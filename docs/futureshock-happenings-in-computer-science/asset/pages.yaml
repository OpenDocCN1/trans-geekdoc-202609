    issued surreptitiously; and FIREWALK, a device identical to a standard RJ45 socket
    but allows for remote monitoring of the data being transmitted. Such compromises
    also further validate the premise of the ‘Big Hack’ as discussed earlier, and
    so it appears that actually a litany of possible attack strategies exist for meddling
    with computer hardware.


    To summarise the key takeaways for this section: Computer hardware cannot simply
    spring into existence. Both Integrated Circuits (ICs) and Printed Circuit Boards
    must be designed, produced, and shipped to their eventual customers, and this
    occurs over a globalised supply chain featuring multiple companies and countries.
    We must be wary of compromise that could occur at any stage of this process, from
    malicious insiders who change the original design files, to manufacturers who
    might tamper with what is being built, and finally to actors who can intercept
    and modify the physical artifacts as they are being shipped from place to place.


    # 8.5 COUNTERFEIT ELECTRONICS: RISKS AND OCCURRENCES


    Of course, the risks of these complex electronics supply chains is not limited
    just to tampering, and indeed, the chances that the average person will be subject
    to tampering seems quite low given the relative cost and perceived benefits for
    the given attacker. Certain high-value individuals and organisations might be
    targeted, but overall, given the relatively low rate of reporting of these kinds
    of attacks, it seems like society is getting off relatively unscathed.


    Indeed a far more likely form of attack – and one we as a society do see, and
    do have to interact with – comes from product counterfeiting. The typical threat
    actor here is a malicious manufacturer, but not one that is interested in modifying
    your designs. Instead, they are motivated in stealing them. The simplest method
    for doing this is via ‘Overbuilding’, where a factory contracted to make a certain
    number of units of a product instead makes more than that. For instance, assume
    that you are an inventor of a brand new computer gadget – let’s say a neat new
    keyboard.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Congratulations! You think that you could sell 10,000 of your new keyboard,
    so you contact a factory and draw up a contract to have 10,000 keyboards produced
    and shipped. Unbeknownst to you, however, that factory has done its own market
    analysis and they think that 20,000 of your keyboard could be sold. So, they instead
    build 20,000 units, and then ship the last 10,000 themselves – and keep the margin,
    your profit, for themselves!


    This is only one type of counterfeiting, a black-market industry sector worth
    up to US$1 trillion annually [12]. In other cases, devices can be reverse engineered
    and copied, or they might simply be imitated by creating similar products illicitly
    bearing another company’s logo. This introduces risks, particularly where corners
    are cut on the counterfeit products – something that is often the case when a
    malicious manufacturer is pretending to be someone else! After all, if a product
    fails early, it will hardly harm your own reputation when nothing can be traced
    back to your factory. As such, counterfeit products are often of poor quality.


    This can be a real risk when they end up in safety-critical systems. A years-long
    investigation by the U.S. Senate discovered over 1,800 cases of counterfeit parts
    in U.S. military vehicles, including cargo aircraft, special operations helicopters,
    and surveillance planes [2]. They found that Chinese suppliers were producing
    tens of thousands of counterfeit, low-quality components which end up in military
    equipment, risking mission successes such as missile firing and helicopter night
    vision. In some cases, these were discovered after installation, such as when
    counterfeit memory chips were found in failing L-3 Display Systems in fielded
    aircraft. Similar counterfeits were identified in parts available in online catalogues
    (see Figure 8.7).


    ![](img/35d43ba1274e18d0f2f189e6392aa2e3_180_0.png)


    Figure 8.7 Example counterfeit electronic components (transistors and integrated
    circuits) identified in a study by the U.S. GAO [11] for the U.S. Senate


    Counterfeit parts also impact consumers as well. As an early example, 50,000 LG-branded
    cell-phones had to be recalled in 2004 after counterfeit batteries entered the
    supply chain [9]. These batteries were dangerous: they lacked overcharge protection
    circuits, meaning that they could overheat or catch fire if left on a charger
    too long. Since then, the numbers of counterfeit consumer electronics have only
    continued to grow. In a single seizure US CBP agents in Philadelphia were able
    to seize hundreds of fake cellphone screen components [8] in 2023, and likewise
    US HSI and CBP agents seized US$14.7 million in counterfeit electronics devices,
    toys, and furniture on the World Trade Bridge in 2021 [16].


    Another type of counterfeiting comes from the re-use or re-packaging of old, recycled
    components. Here, you could imagine how a product might have reached the end of
    its usable life, and so it is sent to a disposal facility, which might disassemble'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'it into its parts. Some of these could be legitimately re-used, which is a
    good thing! Unnecessary wastage of products is undesirable. However, when second-hand
    parts are sold, they should be clearly marked as such, and this is not always
    the case. Second hand parts will have shorter lifespans than newer products, which
    means they must usually be sold at a discount – financially motivating malicious
    sellers to lie. In severe cases, they may even clean, re-number, or re-package
    devices so that they appear to be newly produced. This was what occurred in several
    of the aforementioned US military counterfeit cases, including one instance where
    used Xilinx FPGAs were re-sold as new before being installed in U.S. Navy P-8A
    Poseidon aircraft [28].


    Like hardware Trojans, counterfeits are therefore a risk and a threat to the security
    of our electronic devices. Although perhaps not as deliberate as introducing designed-to-be-malicious
    circuits, defective components which under-perform and fail early can just as
    easily cause real-world harm.


    Unfortunately, it is not easy to detect if a given component is counterfeit, particularly
    if they were original parts that have been illicitly recycled. Given the complexity
    of the electronics supply chain, components need only to function well enough
    to pass basic tests they might be subjected to – tests which are designed to weed
    out defective parts, not fakes. Some counterfeit parts are visually suspect, or
    can be identified with scans such as by X-rays or electron microscopes to show
    that the internals of a chip are not lining up with what’s expected. If re-labelling
    has been done with low quality materials (e.g. paint) this can be identified with
    simple chemical tests (e.g. using acetone to show the original markings). Other,
    more comprehensive counterfeits, might require more complex testing – for instance,
    the age and grade of a chip can alter transistor performance, meaning that electrical
    testing can show that a chip is suspiciously under-performing.


    It is much more difficult to address overbuilding, the first challenge posed in
    this section. Here, components will be performing exactly to their specification,
    as they may be being built by the original factory and production line. As noted,
    the illicit manufacturer can still make financial gains here, by simply avoiding
    license payments to the original designer.


    This overbuilding issue underscores a fundamental challenge in modern manufacturing:
    trust. When intellectual property (IP) is shared with a manufacturer, especially
    one overseas, it becomes incredibly difficult to enforce boundaries on how that
    IP is used. Factories with the expertise and equipment to produce high-quality,
    genuine components can just as easily produce unauthorized extras or share proprietary
    designs with competitors. This creates an ecosystem where counterfeit and overbuilt
    parts can be nearly indistinguishable from legitimate ones, yet they enter the
    market through unauthorized channels, eroding consumer confidence and undercutting
    legitimate businesses.


    The issue of counterfeiting extends beyond the direct risks to systems or users
    – it also has profound economic implications. The presence of counterfeit goods
    undermines the market for genuine products, and can discourage innovation by harming
    legitimate manufacturers who invest heavily in research and development. Furthermore,
    the financial impact of counterfeit components often goes beyond replacing'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'defective parts. It includes the costs of investigating failures, recalling
    products, and potentially dealing with lawsuits or regulatory penalties.


    # 8.6 HARDWARE SECURITY: DEFENDING ICS AND PCBS


    It seems that the obvious method to protect against both Hardware Trojans and
    low-performing Counterfeits would be to **test**, i.e., simply take the suspect
    IC or PCB, and see how it performs. However, although commercial electronics makers
    can and do test chips and circuits to see how they perform, they can’t usually
    afford to test anything, as there is a nearly infinite universe of possible things
    that are not specified for a given design. Instead, they will focus on testing
    known functionalities. A component destined for a cellphone, for instance, might
    be subject to energy emission tests and hardware in the loop functional tests.
    But, extraneous circuits that don’t interfere with the normal functionality, or
    circuits that might fail early due to age, likely won’t show up in these tests
    [1].


    Other tests, such as ‘decapping’ an integrated circuit and examining it under
    a scanning electronic microscope could reveal if there are unexpected changes
    to the design of the silicon. But, this process involves grinding away the chip,
    layer by layer – destroying it in the process. This means that you might verify
    the chip you tested, but not necessarily any other that you have from the batch.
    This can be a tough assumption when an attack strategy might be to compromise
    a small number of random parts to minimize the chances of detection. Further,
    this strategy also assumes you can cope with mapping the real chip to your design
    files – for an IC with potentially hundreds of millions of internal transistors
    this might be a very difficult ask. It also implies you can trust the design files
    itself! Remember, your chip might be passing through multiple stages as you pass
    from design to implementation, and at each phase the design is in a different
    form, such as in hardware description language (code), a netlist, or in the layout
    form.


    On the other hand, printed circuit boards can be more straightforward to verify
    against their design files. This is because everything is happening on a physically
    larger scale. Still, like integrated circuits, PCBs can have multiple layers,
    and if a change happens to an internal layer, one will need to rely on scans such
    as X-rays to see through the material. Alternatively, electrical tests can verify
    which traces are connected to which other traces, and might also be able to identify
    if an individual circuit has been tampered with in some way (e.g. changing a track
    width to alter a characteristic impedance of a circuit). However, these only work
    to a point, and once again destructive testing might be the only avenue to be
    certain if a given PCB is trustworthy.


    However, there is a solution. Let’s assume that a given product – either an IC,
    or a PCB, is potentially untrustworthy. We have several of these products, and
    we know that we can conclusively prove that they are or are not trustworthy, but
    this must happen destructively, e.g. via decapping. What we can do is take a large
    number of so-called *side-channel* measurements of all the samples. This is depicted
    in Figure 8.8.'
