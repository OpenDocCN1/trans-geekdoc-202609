  img_proc: true
- pgno: 101
  md: '# 5.5.1 THE PURPOSE OF OUR RESEARCH PROJECTS


    # EXPERIMENT 1:


    The primary objective of this research was to simulate a multiplayer medical science
    laboratory environment in VR, exploring its effectiveness in teaching Polymerase
    Chain Reaction (PCR) procedures. The sub-objectives were as follows:


    +   1. Evaluate participants’ perceptions and attitudes toward using VR simulations
    for learning PCR procedures by collecting qualitative data through post-questionnaires
    and interviews.

    +   2. Assess participants’ cognitive load during PCR procedures after receiving
    VR training compared to training in a physical lab.


    # EXPERIMENT 2:


    The purpose of this project was to evaluate the efficiency of the sense of immersion
    in virtual reality in medical science laboratory experiments. The sub-objectives
    were as follows:


    +   1. Compare users’ cognitive load between the VR version and the same version
    using a regular computer display.

    +   2. Assess participants’ perceptions and attitudes toward using the simulation
    to learn PCR procedures in the VR version compared to the same version using a
    regular computer display.


    # EXPERIMENT 3:


    The purpose of this experiment was to compare a virtual and real-world mechanical
    engineering laboratory, analysing the impact on users’ cognitive load in the virtual
    environment. The project served two sub-purposes:


    +   1. Evaluate participants’ perceptions and attitudes toward using VR simulations
    for learning manufacturing composite through qualitative data collected from post-questionnaires
    and interviews.

    +   2. Assess participants’ cognitive load during manufacturing composite procedures
    after receiving VR training compared to training in a physical lab.


    # EXPERIMENT 4:


    The purpose of this project aligned with that of the 3rd experiment. However,
    in this experiment, instead of simulating the process of making composites, we
    simulated an expensive piece of equipment found in mechanical engineering labs:
    a manufacturing robot. The sub-objectives were as follows:'
  merge: -1
  img_proc: true
