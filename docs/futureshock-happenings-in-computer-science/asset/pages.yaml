    # LESSON 4: FAIRNESS MEANS MANY THINGS – WE NEED TO CHOOSE ONE


    This brings us to a fundamental question. What precisely does fairness mean? This
    is not an easy question to answer as fairness means many different things and
    is applied in different ways in a number of different contexts. For example, in
    classification, fairness might mean we treat different groups identically, while
    in resource allocation, fairness might mean that no individual envies another’s
    allocation. Deploying AI systems requires us to be much more exact about what
    fairness means. In the past, we could leave it up to human judgement and accountability.
    However, we now need to code it precisely.


    Let us return to the problem of classification. What does it mean to classify
    fairly? There have been at least 21 different mathematical definitions of fairness
    studied by machine learning researchers [25]. Here are just a few of the most
    popular to give you an idea:


    **Demographic or statistical parity:** people within different groups have the
    same chance of a positive classification. For instance, the same fraction of Asian
    and Caucasian people should be offered a loan. Note that this ignores that Asians
    and Caucasians might have a different likelihood of successfully paying off a
    loan.


    **Equal opportunity:** eligible people with the different groups have the same
    chance of a positive classification. More precisely, the true positive rate for
    different groups should be identical. For instance, the same fraction of Asian
    people who would successfully repay a loan are actually offered a loan as Caucasian
    people. Note that this ignores how (in)accurately we classify those people, Asian
    or otherwise, who would not successfully repay the loan.


    **Equal precision:** in the different groups, the same fraction of those classified
    positively are correctly classified. For instance, the same fraction of people
    in each group offered a loan will successfully repay the loan. Note that this
    ignores the accuracy of those classified ineligible for a loan.


    **Casual non-discrimination:** changing the protected feature does not change
    the outcome. For instance, changing the input race from Asian to Caucasian does
    not change if someone gets offered a loan.


    **Fairness through unawareness:** A protected feature should not be used in the
    classification. For example, race should not be an input in deciding who gets
    a loan. Often this is not enough as ML systems are very good at identifying correlations,
    and there can be correlated features (e.g. ZIP or postal code might be closely
    correlated with race and so the system might learn to discriminate on ZIP code).


    The fundamental challenge is that these different fairness measures are typically
    incompatible except in three degenerate circumstances: (1) the classifier is 100%'
  merge: -1
  img_proc: true
