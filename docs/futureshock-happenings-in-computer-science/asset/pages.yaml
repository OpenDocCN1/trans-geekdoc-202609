  md: 'We will more closely study two special kinds of classifiers. The first kind
    of classifier corresponds to switching classification between “in the class” and
    “not in the class” at every exception, starting with one or the other, e.g.: by
    default, the case is in the class, except if this condition, the first one from
    this sequence of alternatives, holds, in which case the case is not in the class,
    except if this condition, the first one from this sequence of alternatives, holds,
    in which case the case is in the class… This is related to the notion of mind
    change bound [8], developed in the paradigm of formal learning theory [7], even
    though in the simpler framework developed here, there is no need for infinite
    ordinals…


    # Definition 52.


    Let a classifying gradation tree (T,ℓ) be given. If ℓ⁻¹(1) is the set of all σ
    ∈ T that contain an even number of pairs of the form (∧,∨) or the set of all σ
    ∈ T that contain an odd number of pairs of the form (∧,∨), then we say that (T,ℓ)
    is parity-based, positive by default in the first case, negative by default in
    the second case.


    Let a classifying gradation graph (G,ℓ) be given. If ℓ⁻¹(1) is the set of all
    σ ∈ Paths(G) of odd length the set of all σ ∈ Paths(G) of even length, then we
    say that (T,ℓ) is parity-based, positive by default in the first case, negative
    by default in the second case.


    # Property 53.


    Let a classifying gradation graph 𝓖 be given. Then 𝓕 is parity-based iff the classifying
    gradation tree 𝓕 that is determined by 𝓖 is parity-based. Moreover, if 𝓖 is parity
    based then 𝓖 is positive by default or negative by default iff 𝓕 is positive by
    default or negative by default, respectively.


    The second kind of classifier corresponds to classifying a case as being in the
    class if and only if evaluation stops at a node that has no exception, that is,
    at a node where evaluation cannot possibly proceed any further.


    # Definition 54.


    A classifying gradation tree (T,ℓ) is said to be end-based iff ℓ⁻¹(1) is the set
    of all σ ∈ T such that T contains no element of the form σ·((∧,∨)).


    A classifying gradation graph (G,ℓ) is said to be end-based iff ℓ⁻¹(1) is the
    set of members of Paths(G) that have no proper extension in Paths(G).


