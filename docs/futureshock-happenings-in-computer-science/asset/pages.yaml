  md: '# Preface


    When George Knott (then of CRC Press at Taylor and Francis) and I first met to
    discuss the idea that would turn, eventually, into the book that you are now reading,
    little did we realise the leap into popular consciousness that computer science
    was about to make.


    It was the tail end of the Covid 19 outbreak, university campuses were still largely
    deserted, and ChatGPT4 was yet to unleash Turing-test level generative artificial
    intelligence upon the world.


    As George and I sat over tea and coffee at The Lounge, the University of New South
    Wales’ cafe and restaurant perched atop UNSW’s Library Tower, we knew that we
    did not want a book on coding or programming per se. There are plenty of books
    on such things already, and most of this sort of content is disseminated over
    video these days anyhow.


    What we did want on the other hand, was something that shared the inside story
    of computer science as a practised academic discipline today – or share at least
    those parts of it that are most often hidden from view. We also wanted to share
    some of the magic that is the School of Computer Science and Engineering at UNSW.


    The School of Computer Science and Engineering - abbreviated in the familiar fashion
    to ‘CSE’, but referred to by its members as simply “The School” – has been my
    academic home for the last three years. I have never been happier. The School
    is vast. There are close to 100 full time academic staff, 7000 undergraduates
    (this is not a typo), thousands of masters students, and goodness knows how many
    PhD students and postdocs. The latter are difficult to count, and I am writing
    this preface only a day or so before the manuscript deadline.


    Given the sheer scale of things, the School burns more brightly than the sun.
    No less importantly however, it is by far and away the best school of computer
    science in Australia, and one of the best in the world. The rate of growth is
    incredible to behold. The dedication and goodwill of the academic and professional
    staff, along with that of those who comprise the student body, make it what it
    is. As always, it is the people who make the thing the thing that it is. This
    is unlikely to stop being true any time soon.


    I owe many a thank you. Thank you to George Knott himself, for reaching out and
    for inviting me to publish with CRC in the first place.


    Thank you to Aaron Quigley, the Head of School at the time and now Science Director
    and Deputy Director of CSIRO’s Data61. I was new to the School at the time, and
    due to COVID 19 restrictions was yet to meet many of the School’s members in person.
    Aaron was a sage guide in the early days, and the debt that I owe him is not insubstantial.


    This thank you is perhaps the most important of all. It was not long before George
    Knott departed Taylor and Francis for new adventures, and was replaced by the
    intrepid Gerald Bok as Commissioning Editor for Computer Science and Statistics
    at'
