    # 7.5 NORMAL FORMS


    Let a gradation tree $T$ and a member $\sigma$ of $T$ be given. Defined as it
    is, $\hat{\sigma}$ can have $\vee$s within $\wedge$s within $\vee$s within $\wedge$s...
    all the more so that $\sigma$ is longer and has more “direction changes”. This
    is in contrast to the flat structure of disjunctive or conjunctive normal forms,
    that limit embedding depth to 2 (disjunctions within conjunctions, or conjunctions
    within conjunctions). Notation 41 captures the natural way to convert $\hat{\sigma}$
    to disjunctive and conjunctive normal forms. Corollary 44 characterises the disjunctive
    and conjunctive normal forms that can be expressed as formulas of the form $\hat{\sigma}$.


