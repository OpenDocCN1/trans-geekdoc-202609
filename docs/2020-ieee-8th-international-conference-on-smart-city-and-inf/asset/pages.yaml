    # Multi-Language


    Wang et al. [41] presented a bilingual attention network (BAN) model based on
    LSTM and the attention mechanism. The model can aggregate the monolingual and
    bilingual information to form the attentions vectors from the document entities,
    and can integrate the attentions vectors to predict the emotion. Zhou et al. [42]
    presented an attention-based cross-lingual sentiment classification model, which
    learns the distributed semantics of the documents in both the source and the target
    languages. They used LSTM, attention mechanism, and dropout for Bi-LSTM. Chen
    et al. [43] designed an adversarial DAN (AD) for cross-lingual sentiment classification.
    ADAN consists of two branches: both branches train on a shared feature extractor
    to learn emotion features that are discriminative and invariant across languages.


    Zhou et al. [44] presented a bilingual word embedding (BSEW) using deep learning
    for English-Chinese sentiment classification. They proposed a bilingual method
    for cross-lingual sentiment classification (CLSC). Wang and Fan [45] presented
    a cross-lingual indoor sentiment analysis (CLISA) based on the LSTM. It is an
    end-to-end method that leverages the unlabeled data in multiple languages and
    multiple domains. Bari et al. [46] presented a multi-based sentiment sentiment
    embedding (MBSE), which uses a two-layer-fed averaging network to predict sentiment
    and to minimize the translation pairs in vector space.


    Ahmed et al. [47] designed a method for the emotion detection of Hindi languages.
    They used CNN, cross-lingual embeddings, and different learning strategies for
    tasks.


