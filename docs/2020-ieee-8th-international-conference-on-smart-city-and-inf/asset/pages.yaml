    # V. Challenges of Emotion analysis based on


    Due to the short history of emotion analysis based on deep, we find that the field
    is in its infancy. According to our understanding and knowledge of this, which
    we think that there are some differences of the surveyeded methodology


    (1) Description of emotion


    At present, there is no unified definition for emotion. And there is no standard
    on how to classify emotions effectively and sensitively, which may affect the
    perception of the emotional features respectively. However, due to the three components
    of human emotion: physiological, subjective experience, and external expression,
    there is different understanding for them in different fields. For example, as
    to sociology, developmental psychology, and neuroscience, it is impossible for
    researchers in each field to have the same understanding of emotion. It is difficult
    to define a unified standard to accurately describe human emotions and their characteristics.'
