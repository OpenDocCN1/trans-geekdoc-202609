    Abstract—With the rise of mobile internet, and the polarization of e-commerce
    and social networks, people have shifted the focus from simple users of internet
    to main publishers of text. A large number of various network data have been generated,
    and a large part of these involve emotion analysis, which makes us better understand
    the views and positions of netizens, and help to keep the key emotion of public
    opinion. In this era of knowledge of emotion analysis, including different definitions
    and classification methods of text, We summarize the existing research on emotion
    analysis methods in text based on deep learning, and make a survey of the emotion
    analysis in text, and the future trends for research.


    information analysis.—On the 38th statistical report on the development of Internet
    published by China Internet Information Center (CNIC) [3], the number of Internet
    users in China has reached 710 million, and the penetration rate of sentiment
    analysis has reached 51.7%. Among them, the number of Microblogs has reached 242
    million, and the daily blogs have reached 100 million. In these short message
    texts, a large part of them contain emotions.


    Emotion analysis—is focused on targeting to extract the emotional states of users
    from their reviews (e.g., blogs, tweets, post, etc.) in social networks [5]. The
    key research work mostly focused on studying the positive and negative behavior
    of emotion analysis, and based on the classification and classification methods
    [7]. However, the emotion analysis based on perception and oriented emotion analysis.
    From the perspective of human psychology, emotion analysis can characterize attitude
    of people in multi-dimensional view, based on the existing coarse-grained sentiment
    analysis.


    Index Terms—emotion analysis, deep learning, social networks, public opinion


