    注意力机制在 [15] 中是一种模仿人类视觉过程的，它将内部经验与外部感受对齐，以增加对某些区域的观察。在显示图片时，人们可以快速查看并专注于某些区域。然后，注意力被放在该区域以获取任务更详细的信息，并抑制其他无用的部分。


