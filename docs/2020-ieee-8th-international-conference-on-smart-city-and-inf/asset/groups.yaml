    components: sequential encoder speaker-level context encoder, Abdul-Maged and
    Ungar [27] presented a method for the fine-grained emotion detection using the
    recurrent neural network. Majder et al. [28] presented a new architecture called
    DialogueRNN, which is based on RNN to detect emotion in a conversation, where
    the textual feature of each utterance is extracted by CNN.


    Kulshehra et al. [29] presented a neural architecture LC-DNN for emotion detection
    using CNN which combines convolutional layers of CNN with fully layers in a non-sequential/parallel
    performance. Mohammad et al. [30] presented a method for emotion text detection.
    The model utilizes an attention-based recurrent neural network, and connects experiments
    with GloVe and ELM embeddings, aligning pos tags with LSTM, GRU as recurrent units,
    and a SVM classifier. Li et al. [31] presented an emotion-classification method
    for short text, also using the skip-layer and LSTM.


    Gu et al. [32] presented a sentiment analysis model to identify the emotion in
    3-turn conversations on Twitter, using deep learning and two word embeddings.
    Rathnave et al. [33] designed a pyramid attention network (PAN) for emotion detection
    in methods, based on the gated recurrent network (GRN). Wang et al. [34] presented
    a structured method to predict the degree of intensity and sentiment. They developed
    three deep learning models on CNN, LSTM, GRU, and one supervised model based on
    support vector regression (SVR).


    Li et al. [35] presented a fully data-driven interactive emotion state model cell
    (LSTM), for emotion prediction. In the model, BiLSTM and the mechanism were used
    to extract the emotion features. Zhang et al. used a multi-task CNN for text analysis,
    based on the emotion distribution. Malhari et al. [37] designed an emotion detection
    method using neural network by emotion vectors (ED-NNV), to predict the degree
    of category in the conversation, based on CNN.


    Khanpur and Karaage [38] presented a model, called Co-LSTM, for emotion detection
    in health monitoring (OHS). With the emotion-features, which are all fed into
    the LSTM network that produces the output via softmax mechanism. Kratzwal et al.
    [39] presented a text-based emotion recognition using recurrent neural network
    (RNN), named SanZect, which is a type of transformer for for attention mechanism.
    Chatterjee et al. [40] presented an end-to-end trainable deep learning model called
    sentiment and semantic emotion detector (SS-BEID) to detect emotions in textual
    dialogues.


    The specific comparison of existing monolingual emotion analysis models is listed
    in Table I.


    ## Multi-Language


    Wang et al. [41] presented a bilingual attention network (BAN) model based on
    LSTM and the attention mechanism. The model can aggregate monolingual and bilingual
    information to form the attentions vectors from the document, and can integrate
    attentions vectors to predict the emotion. Zhou et al. [42] presented a cross-lingual
    sentiment classification model, which learns the distributed semantics of the
    source and target languages. They used LSTM, attention mechanism, and dropout
    for Bi-LSTM. Chen et al. [43] designed an adversarial DAN. ADAN consists of two
    branches: both branches train on a shared feature extractor to learn emotion features
    that are discriminative and invariant across languages. Zhou et al. [44] presented
    a bilingual word embedding (BSEW) using deep learning for English-Chinese sentiment
    classification. Wang and Fan [45] presented a cross-lingual indoor sentiment analysis
    (CLISA) based on the LSTM. It is an end-to-end method that leverages the unlabeled
    data in multiple languages and multiple domains. Bari et al. [46] presented a
    multi-based sentiment embedding (MBSE), which uses a two-layer-fed averaging network
    to predict sentiment and to minimize the translation pairs in vector space.


    Ahmed et al. [47] designed a method for the emotion detection of Hindi languages.
    They used CNN, cross-lingual embeddings, and different learning strategies for
    tasks.


    ## V. Challenges of Emotion analysis based on


    Due to the short history of emotion analysis based on deep, we find that the field
    is in its infancy. According to our understanding and knowledge of this, which
    we think that there are some differences of the surveyed methodology


    (1) Description of emotion


    At present, there is no unified definition for emotion. And there is no standard
    on how to classify emotions effectively and sensitively, which may affect the
    perception of the emotional features respectively. However, due to the three components
    of human emotion: physiological, subjective experience, and external expression,
    there is different understanding for them in different fields. For example, as
    to sociology, developmental psychology, and neuroscience, it is impossible for
    researchers in each field to have the same understanding of emotion. It is difficult
    to define a unified standard to accurately describe human emotions and their characteristics.

