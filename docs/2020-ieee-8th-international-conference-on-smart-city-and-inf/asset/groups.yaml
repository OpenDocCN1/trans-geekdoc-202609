    $av = \sum_{i=1}^{n} t_{i/n}$


    步骤 2：将平均值通过一个或多个前馈层。如果有一层，平均嵌入列如下：


    其中$b$表示词序列，$w$表示kxd权重矩阵。如果有多多个层，平均嵌入列如下：


