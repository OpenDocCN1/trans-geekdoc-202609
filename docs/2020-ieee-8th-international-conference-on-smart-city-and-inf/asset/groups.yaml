    (2) Language imbalance

    Most of the existing emotion analysis methods are aimed at English literature.
    There are some methods in recent years. These methods based on emotion dictionaries
    or semantic lexicons need external features of speakers'' speech to translate
    English-based emotion analysis methods to other languages. In the training and
    test set of non-English emotion analysis are relatively scarce, especially those
    of non-common language resources, which affects the performance of non-English
    emotion analysis methods.


    (3) Domain relevance

    Some words carry different emotions in different domains, such as “long time”.
    In the field of reviews for waiting for time to serve, they need to express negative
    emotion but in the field of reviews for smart phone, they need to express the
    positive emotion of long battery standby time. Thus, it is necessary to consider
    the domain relevance of emotional words in emotion analysis, Cross-domain emotion
    analysis is a hot topic, there are many problems to be solved.


    Comments in social network texts are of limited length. From the different language
    text, short texts have the characteristics of sparseness, lack of use, and massive
    data. Due to the insufficiency of context information and the problem of processing
    short one word and synonym multiple, it is difficult in accurately extracting
    the topic information, which affects the performance of text emotion analysis
    in the.


    (5) Model depth of learning

    Deep learning is a repeated process of adjusting the parameters of model. The
    biggest problem is learning speed of the model, that is too slow and training
    is too long. If we want to improve quality of the model, we have to reduce the
    number of iterations in the same training time; if we want to improve the speed,
    we have to reduce the number of training times, which will increase the chance
    of different super parameters; all of these will affect the accuracy of the model.
    The size of training dataset may affect the performance of the training model.
    The larger dataset, the better training results. But the larger dataset.


