    摘要——随着移动互联网的兴起以及电子商务和社交网络的极化，人们的身份已从简单的互联网用户转变为文本的主要发布者。产生了大量的各种网络数据，其中很大一部分涉及情感分析，这使我们能够更好地理解网民的观点和立场，有助于保持舆论的关键情绪。在这一情感分析知识时代，包括文本的不同定义和分类方法，我们总结了现有基于深度学习的文本情感分析方法的研究，并对文本情感分析及未来研究趋势进行了综述。


    信息分析——在中国互信息中心（CNIC）发布的第38次中国互发展统计报告[3]中，中国网用户已达到7.1亿，情感分析的渗透率达到51.7%。其中，微博数量达到2.42亿，日博客量达到1亿。在这些短消息文本中，很大一部分包含了情感。


    情感分析——侧重于从社交网络用户的评论（如博客、推文、帖子等）中提取其情感状态[5]。主要研究工作大多集中在研究情感分析的正向和负向行为，并基于分类和分类方法[7]。然而，还有基于感知和定向的情感分析。从人类心理学的角度，基于现有的粗粒情感分析，情感分析可以从多维度视角描述人的态度。


    索引词——情感分析，深度学习，社交网络，舆论


    # I. 引言


    “七情六欲”中的七种情感是喜、爱、哀、恐、忧、怒、欲。其中，所有都是正面情绪，而大多数是负面情绪。这表明现实世界中的人类情感更倾向于传播负面情绪。2011年中国互联网公共指数年度报告[1],
    [22]显示：“2011年，今日的话题中有80%是负面事件。微博和Twitter论坛上的负面事件分别占75.6%和95.8%，高于传统媒体。”


    随着Web 2.0技术的普及，人们目前已从普通用户转变为生产者。基于神经网络的自然语言处理（NLP）工作已达到新的质量水平，并成为情感分析和机器翻译等NLP任务的关键技术。流行的深度学习（DL）方法被用于建模分析，包括深度平均网络（DAN）[8]、去噪自动编码器（DAE）[9）、卷积神经网络（CNN）、循环神经网络（RNN）[11）、长短期记忆网络（LSTM）[12）、双向长短期记忆网络（Bi-LSTM）[13）、门控循环单元（GRU）[14]、Attention、多头注意力机制（MHA）[16]等。为了提高情感分析的性能，研究人员可能会整合多种方法在空间模型中解决任务，而不是单一方法。


