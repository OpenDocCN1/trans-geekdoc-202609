    has achieved new levels of quality, and has become an essential technology for
    tasks of NLP, such as sentiment analysis and machine translation. The popular
    methods of deep learning (DL) are used to model analysis, including deep averaging
    network (DAN) [8], denoising autoencoder (DAE) [9], convolutional neural network
    (CNN), recurrent neural networks (RNN)


