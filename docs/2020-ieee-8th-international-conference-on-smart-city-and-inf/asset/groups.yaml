    ## IV. 基于深度学习的分析方法


    ## A. 单语言


    深度学习方法已被证明在许多 NLP 任务中是有效的，包括情感和情绪分析。以下是基于深度学习方法的单语言的情绪分析模型。


    Ghosal 在 [26] 中提出了一种对话图网络（DialogueGCN），用于基于双向 GRU 的对话情感识别。DialogueGCN 由三个完整组件组成：序列编码器、说话人层级上下文编码器；Abdul-Maged
    和 Ungar [27] 提出了一种使用循环神经网络进行细粒度情感检测的方法。Majder 等人 [28] 提出了一种名为 DialogueRNN 的新架构，它基于
    RNN 检测对话中的情绪，其中每个语句的文本特征通过 CNN 提取。


    Kulshehra 等人 [29] 提出了一种使用 CNN 进行情绪检测的神经架构 LC-DNN，它将 CNN 的卷积层与全连接层在非顺序/并行性能中结合。Mohammad
    等人 [30] 提出了一种情绪文本检测的方法。该模型利用基于注意力的循环神经网络，并与 GloVe 和 ELM 嵌入连接实验，将 POS 标记与 LSTM、GRU
    循环单元以及 SVM 分类器对接。Li 等人 [31] 提出了一种用于短文本的情绪分类方法，也使用了跳层和 LSTM。


    Gu 等人 [32] 提出了一种情感分析模型，用于识别 Twitter 上 3 轮对话中的情绪，使用了深度学习和两种词嵌入。Rathnave 等人 [33]
    基于门控循环网络（GRN）设计了一种金字塔注意力网络（PAN）用于情绪检测。Wang 等人 [34] 提出了一种预测强度和情感的结构化方法。他们开发了基于
    CNN、LSTM、GRU 的三个深度学习模型，和一个基于支持向量回归（SVR）的监督模型。


    Li 等人 [35] 提出了一种完全数据驱动的交互式情绪状态模型单元。在模型中，使用了 LSTM 机制来提取情绪特征。Zhang 等人 使用 CNN 提出了一种多任务的情绪预测模型，用于预测情绪分布。Malhari
    等人 [37] 提出了一种基于神经网络的情绪检测方法（EDV）。


    Khanpur 和 Karaage [38] 提出了一种基于 LSTM 的模型（Co-LSTM），用于健康监测。Kratzwal 等人 [39] 提出了一种基于循环神经网络的情绪识别（SanZect）。Chatterjee
    等人 [40] 提出了一种端到端的情感模型（SS-BEID），用于对话。


    现有单语言情感分析模型的具体对比表所示。


    ## 多语言


    Wang 等人 [41] 提出了一种基于 LSTM 和注意力机制的双语网络（BAN）。该模型可以聚合单语言和双语信息形成注意力向量，并整合注意力向量来预测情绪。Zhou
    等人 [42] 提出了一种跨语言情感模型，学习源语言和目标语言的语义。Zhou 等人 [44] 使用深度学习提出了一种用于英文情感分类的双语嵌入（BSEW）。Wang
    和 Fan [45] 提出了一种基于 LSTM 的跨语言情感分析（CLISA）。这是一种利用多种语言和领域无标记数据的端到端方法。Bari 等人 [46]
    提出了一种基于多的情感嵌入（MBSE），它使用双层馈入平均网络预测情感，并最小化向量空间中的翻译对。


