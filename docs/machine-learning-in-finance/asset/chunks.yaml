  trans: "\n对于大多数交易新手来说，直接用实盘交易通常是个坏主意。此外，如果你的机器学习算法也是这个领域的新手，在确定它足够优秀、不会让你损失巨额资金之前，你绝对不想让它处理真实的金钱。更如此，创建一个你自己的金融交易软件来模拟股市，然后再编写一个机器学习算法来“操纵”这个市场，这在财务上是不划算的。你会你会遇到很多问题，比如试图为\
    \ `ML` 算法制作软件，这意味着对它来说要么太简单要么太难。通常情况下，你想要一个旨在训练人类如何交易股票的软件。\n\n这就是 `Thinkorswim`\
    \ 发挥作用的地方，它是一个模拟股票交易的高度复杂系统。此外，它还包含一个`Paper Money”（模拟货币）模式，允许你使用`Fake Money”（虚拟资金）进行交易。这使其成为构建机器学习算法的完美基础，可以为算法提供数据集，并最终优化算法性能。\n\
    \n这对机器学习算法的构建非常重要，因为该软件可以提供真实世界的对比。此外，该软件完全倾向于帮助股票交易者赚更多的钱。这意味着它提供的不仅仅是简单地处理股票市场图表，还提供了波动、开盘、关闭等许多变量供你处理。所有信息都集中在一起，这意味着你可以将信息提取到算法中。最后，该软件并没有考虑到机器学习算法可能会与软件结合使用。这意味着它对你的`neural\
    \ network`神经网络）来说是中性的，这是最理想的情况。\n\n## TradeStation 自动化软件\n\n这款软件价格稍贵，所以你在尝试使用该软件之前，可能想先确保自己有一些`Deep\
    \ Pockets`财厚的资金）。他们确实提供模拟服务，这意味着对于那些想要用它来训练模型的人来说非常出色。然而，如果你选择了该服务，你需要达到每月的最低活动量，以确保你的账户不会变成“死账户”，因为他们真的希望平台上上有活跃的交易者。这款软件有很多花哨的功能，如果你决定利用它而不是让机器学习算法独立完成你所有的需求，这些功能将让你的交易变得简单。当你尝试交易时，他们的费用非常优惠，是行业内最低水平之一，而且对于机器学习用途来说甚至更有优势；如果你对期权交易感兴趣，他们还会提供免费的交易实时数据。多年来他们一直是一家非常优秀的公司，拥有悠久的历史，可以追溯到\
    \ 1982 年，当时他们列为第一个在线交易平台。他们不是最好的，但在提供你运行自动化功能所需的服务方面确实非常出色。此外，他们拥有丰富的宏命令库，并配有移动端选项。\n\
    \n## Etna 自动交易软件\n\n这是另一款在为交易者提供模拟器和移动选项方面做得非常好的软件。我将这款软件列入名单主要是因为它的可定制性和对开发者非常友好。与这里的许多选项不同，你会发现这家软件公司对开发者的推广比对交易者的还要多。他们有多个`APIs`和网页交易功能，而不仅仅是基于桌面技术。这意味着如果你计划将你的自动化交易作为一个平台，你实际上可以使用他们的技术进行开发和部署，而无需创建自己的经纪商软件。\n\
    \n## eSignal 自动化交易软件\n\n这种软件是我会称之为`data puke`数据倾泻）的东西。我并不经常用这个词，但我发现它完美地描述了从这个程序产生的信息量。像这里的许多软件一样，你可以访问实时数据，但除此之外，你实际上还\
    \ Get 获得有关交易信息的实时新闻，以及大量的课程视频和图表功能，这些我在许多其他软件中发现是缺失的。虽然数据倾泻确实意味着你将获得大量信息，但一旦打开它，实际应用可能会有点令人生畏。这是因为几乎所有的信息都是直接呈现给你的，但就像`Gimp`一样，如果你花些时间研究它，它实际上可以是一个非常好的软件。同样，因为这是一是一款数据倾泻软件，如果你决定创建一个机器学习语言算法，你会有充足的内容来喂给它。\n\
    \n## Tensorflow\n\n老实说，如果你真的想做，你可以构建自己的，但这将花费相当的时间。我在这里提到的这些软件是特权软件，它们几乎总是会收取一定比例的资金是有原因的。你看，市场是一场层层费用、层层费用、层层费用的游戏，这种模式一直持续直到最终击中你。这意味着当你使用这类服务时，你实际上支付了最高可能的费用，因为他们能够为你提供访问权限……并收取费用，因为他们知道你可能无法去交易大厅。提供这些平台赚了大量的钱，而他们实际上所做的只是为你提供访问权限和信息。他们能为你提供的信息越多，你就越愿意为他们的平台付费。这意味着他们有动力将软件尽可能填满数据，这意味着一个`Legion\
    \ of Developers`（开发者军团）实际上是你与自己自己开发时进行权衡的对象。他们拥有实际软件的经验，他们通常已经做了很多年，而且他们完全清楚如何激励人们。当然，你可以开发自己的，但这就像是在几乎没有钱去雇佣任何人的情况下尝试自己制作一款`AAA`\
    \ 游戏。你可以做到，只是会需要很长的时间。\n\n然而，如果你计划制作一个利用他们软件的机器学习算法，我强烈建议使用`Tensorflow`。你看，有大量的教程会教你如何制作符合你目的的机器学习算法。特别是\
    \ YouTube 上的教程，因为网站上的教程通常会被标记后就遗忘。所以，你可以利用这里的大多数软件来收集你需要的信息，然后开发一个向你正在聚合信息的应用程序发送输入的机器学习算法。`Tensorflow`是解决这一问题最简单的方法，因为他们提供了对这些神经网络的访问权限，你只需要实现编程逻辑来利用它。\n\
    \n# 结论\n\n## \n\n## 机器学习可以成为你生活的革命性变化\n\n机器学习已经帮助了许多行业做了许多事情，因此在一个充满数字的行业中，机器学习的兴起并不意外。机器学习在未来还有巨大的潜力，而且它已经向许多人证明了自己的成功。然而，当许多人把股票市场视为一个不可预测的猛兽时，出现了一个奇怪的情况：我们正在设计机器来研究并买卖它。"
