    # 什么是金融机器学习？


    ### 了解人工智能

    为了理解什么是金融机器学习，我们首先需要对什么是人工智能进行简要介绍。事实上，人工智能其实是我们社会中的一个常见主题。从电影中的反派到游戏中的交互敌人（顺便提一下，注意到人工智能通常都是反派），人工智能透彻地渗透到了我们的社会。然而，这大部分都是“限制性”的人工。


    限制性人工智能是指能力极其有限的机器或程序。事实上，你认为的人工智能的大部分也是“伪”人工智能。伪人工智能是指模拟人工智能体验但本身并非人工智能的程序程序。


    例如，当你在游戏中看到一个敌人跟随你时，它实际上并没有在思考。相反，它在运行一种关于“可能性”的数学算法。当离你近时，它进行近战攻击的概率很高；它投掷手榴的概率较低。这种做法也被称为近距离估计，视频游戏中的大多数敌人人工智能仅仅是根据与玩家的距离以及玩家伤害的持续准确性来决定动作。这是“伪”的，因为它模拟了一个具有智能的机器，但它实际上并不具备任何智能。


    真正的人工智能可以比某些视频游戏中的“影子”敌人或双胞。在这些场景中，游戏记录了你过去最常见的动作，例如：最常见的攻击指令、偏好的距离、攻击延迟等。基于这些信息，这个“影子”敌人构建了一种最挑战你习惯行为的战斗技巧。通过这种方式，机器获取了关于你战斗技巧的智能。在这两种情况下，人工智能都是限制性的，但一个拥有智能而另一个是模拟智能。


    ### 了解机器学习

    机器学习有点类似于真正的人工智能，因为它根据给定的信息进行学习。然而，与真正的人工智能不同，机器学习使用一种被称为 `Backpropagation`（反向传播）的技术。假设制造了一个“影子”敌人，在它被杀死后会发生什么？通常，根据游戏时长，游戏稍后会生成新的、更强大的“影子”敌人。这个新的、强大的“影子”敌人实际上是使用与第一个相同的信息构建的。唯一的区别在于你最终改变了游戏方式，而且敌人的基础“属性”更高了。


    在机器学习中，这样一个“影子”敌人会尝试查看它在第一次中哪里出了错。这可以通过从不同的角度观察相同的信息来实现。例如，如果你以前通常依赖重攻击，但现在切换到了快速攻击而不是投射攻击，它就会使用投射攻击来强迫你那样玩。唯一的区别是，现在它还可以查看标准敌人哪里被击败的、是如何被击败的，以及哪些攻击模式导致了更多的伤害。如果这听起来很像“研究你的敌人”，那是因为它确实如此。


    `Backpropagation` 是机器学习在更复杂环境中运作的关键。它获取自己产生的错误答案，并找到一种优化正确答案的方法。存在一些不利用这种技术的机器学习算法，这些被称为
    `Feedforward Neural Networks`（前馈神经网络）。这仅意味着数据只从输入到输出通过系统，而没有输出变成新的输入。


    事实上，如果你还没有猜到，真正的人工智能是一种前馈机器学习机制，但它不是一个 `Neural Network`（神经网络）。因此，虽然在技术上它可能符合这一类别，但它通常不被视为机器学习算法。`Neural
    Network` 充满了节点，将选择因素分解为最基础的组件。这允许网络快速移动并以更准确的方式做出决策。因此，除非真正的人工智能是以并行方式创建的，否则它不被视为机器学习。


    ### 金融场景中的机器学习

    在金融场景中，你可能可能会利用机器学习。例如，你可以利用它们根据积累的财务数据得出更准确的预测。你还可以想出预测股票的更好方法。这甚至可以用于确定谁表现最好，以及哪些员工需要更多的审查。这听起来可能像奥威尔式的，但请记住这仍然人工智能。


    然而，事实是，这些情况大多数通常用 `Feedforward Neural Networks` 处理。这是因为 `FFNN` 要容易创建得多，数学定义也较少。这种优势的处是，你可能会从
    `BPNN`（反向传播神经网络）中看到相同的信息，因为 `FFNN` 在重新运行时会考虑新的数字。在许多情况下，构建 `BPNN` 实际上更有利，但需要更多的时间和资源。


    让我们看看员工的例子来讨论一下为什么我要对此进行澄清。在 `FFNN` 中，你可能想知道员工何时记录休息、上班和下班时间，以及他们期间的产量水平。这对于是一个相当规模的数据集，可以用来确定高产和低产员工。然而，如果你想尝试找到他们成为低产员工的原因呢？


    在这种情况下，你可能想了解更多关于员工的信息；这些是通常比较奇怪的信息。例如，如果问题出现在某些人员身上，你可能想知道睡眠习惯、BMI 和普通体能。在 `Neural
    Network` 中，你提供的信息越多，结果就越准确。这并不意味着结果总是那样，某些数据可能会损害你的机会。员工可能因为材料比他们重或者因为肥胖导致移动不快而挣扎。那么作为公司，你可能会提供免费的店内健身房，或者开展活动让每个人健身，这样就不会有人被单独针对。


    ## 预测就是机器学习算法所做的


