- raw: "Ironically, those categories are usually the most stable when it comes to\
    \ investing. A good handful of people say that Real Estate should be included\
    \ into this, but the property has to meet specific standards in order to grow.\
    \ If you buy stocks into rich communities, unless that community is expanding,\
    \ that community is likely to depreciate over time. The reason why those categories\
    \ are the best is usually due to two factors; P/E and P/BV ratio.\n\nIn places\
    \ of technology, you have a wide range of P/E. Let’s get something out of the\
    \ way real quick because shares and stocks can be quite confusing on their own.\
    \ \n\nA Share is how much the company wants to divide itself, which is announced\
    \ by the company itself. Therefore, when a company goes “public” what they are\
    \ doing is opening the Share pool to the public. At this time, they will release\
    \ a specific number of shares. Essentially, they are selling components of a company\
    \ to the public as a stock in the company. This stock is called a Share, as in\
    \ you are getting a share of the company. A stock, on the other hand, is a collection\
    \ of those shares. It’s rather hard to keep track of 1 billion shares but if each\
    \ Stock is made up of 5 shares, that’s only 200mil stocks to keep track of. However!\
    \ This is a story of all shares are stocks but not all stocks are shares. For\
