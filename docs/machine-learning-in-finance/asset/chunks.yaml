    \ \n\n# Determine the Optimal Time to Buy Stocks\n\n##  \n\n## You Should Not\
    \ Fully Automate\n\nNow that we have gotten off the beaten path of practically\
    \ pure mathematical reasoning, I need to tell you upfront that you should not\
    \ fully automate your trading decisions. There are some that are willing to convince\
    \ you that fully automated trading is a fantastic idea, but the honest truth is\
    \ that it's a really bad idea. It's a bad idea because we, as humans, are definitely\
    \ flawed. What I mean by this is if you didn't train it right, if you missed a\
    \ line of code, or if something goes wrong in the processing speed, you could\
    \ make trades you would never make in your entire life.\n\nThe problem with developing\
    \ a machine learning algorithm that's fully automated is that you have to be able\
    \ to trust that it’s going to make the right decision most of the time. The problem\
    \ with humans is that we are often way too impatient to wait until it can get\
    \ that good and so we try to use it almost as soon as we build it. The problem\
    \ with this is you can wind up broke and out of the game within moments of you\
    \ turning on the machine learning algorithm if you did something wrong. Instead,\
    \ you should really be using it like a personal advisor at times. Specifically,\
    \ you should know more than it for a little bit down the road after you have created\
    \ it.\n\nThe moment that you can feel comfortable handing over your trading decisions\
    \ to the machine should be when it gets the calculation right more than you do.\
    \ Therefore, say you were to get signals from the machine learning language algorithm\
    \ that told you that you needed to buy stock and you refuse to do so because it\
    \ didn't make sense to you, but it turns out that the machine was right. If this\
    \ happens more than 75% of the day, I would highly recommend just leaving the\
    \ trading decisions up to the machine because at that point it's more successful\
    \ than you. However, it's going to take quite some time for it to get up to that\
    \ type of accuracy and a lot of practice. I would not trust the machine to make\
    \ any trading decisions within at least the first six months of the machine's\
    \ creation. \n\n## Using Support Vector Regression Analysis to Find Good Times\n\
    \nWhile Support Vector regression analysis is definitely a fantastic technique,\
    \ you have to remember that it is it's only designed to predict the next step\
    \ in the Trends. Therefore, it can actually tell you what times are going to be\
    \ good for selling and buying your stock. However, it can only ever predict the\
    \ next step in the process so if it's wrong then it has to recalculate everything\
    \ until it becomes right. Considering the sheer randomness of the market, it's\
    \ going to be recalculating quite a bit so while you can use it to find good times\
    \ to sell your stock, it's not going to be 100% reliable.\n\nWe have not gotten\
    \ to the point where machine learning is more efficient at humans at doing particular\
    \ tasks 100% of the time. There are certain machine learning applications that\
    \ can claim that they do it better than humans most of the time, but none of them\
    \ have significantly proven to be flawless compared to humans. This means that\
    \ you can utilize it to try and find times to sell the stock in real time, but\
    \ there are a few other methods out there that can help you determine great times\
    \ to sell stock.\n\nSpecifically, I'm talking about partitioning cluster methods.\
    \ Partitioning cluster methods are clustering techniques that allow you to separate\
    \ information into clusters. Therefore, if you are able to find profit spots more\
    \ than loss spots, you can actually see a pattern of when it's good to sell a\
    \ certain stock with a company. \n\nFor instance, let's say that we divided our\
    \ information into 30-minute increments for a specific business over the period\
    \ of a day. During that time, we record moments where the company is at a profit\
    \ and moments when companies are at a loss. We can actually do this in a line\
    \ graph, but clustering techniques are specifically meant to grab data points\
    \ that form into a cluster. Therefore, while you could see a trend line in said\
    \ 30 minutes, you are more likely to see dots of profit and dots of loss. Therefore,\
    \ as a natural result, you can actually find the parts of the day where there\
    \ are more profit dots more often than there are loss dots. \n\n## Using Cluster\
    \ Analysis to Find Good Businesses\n\nHalf the battle in determining what companies\
    \ to sell with and at what times you can sell at is often the business itself.\
    \ You don't really want a business that is dealing with a massive pile of debt\
    \ that it can't seemingly pay off. You also don't want a company that if it died\
    \ yesterday, you would likely only see a small portion of money go back into your\
    \ pocket. While support vector regression analysis is really good at finding the\
    \ trend times that you want to sell your stock at, you primarily want to use partitioning\
    \ and cluster algorithms to determine which companies you should go with.\n\n\
    While we will get into specific clustering methods later on when we discuss penny\
    \ trading and day trading, clustering algorithms allow you to group together common\
    \ companies. Therefore, let's say that you have companies that do extremely well,\
    \ companies that do generally well, companies that do okay, companies that are\
    \ losing a little bit of money, companies that are losing a lot of money, and\
    \ companies that are about to die. Now, there are also over a million of these\
    \ companies and you can't possibly check them all within a reasonable amount of\
    \ time. Normally, you would generally just look for the best ones that you can\
    \ cherry-pick out of the data set. This is a problem because you could have missed\
    \ all of the ones that could make you money, it just gives you the ones that are\
    \ most popular because, as humans, we are very biased. By using cluster algorithms,\
    \ we can use the variables that we would normally use to identify companies in\
    \ those categories and then cluster them on each variable so that we can compare\
    \ those groups rather than individual companies."
