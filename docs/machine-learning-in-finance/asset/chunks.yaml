    1. Cluster like-variable companies

    2. Extract companies with Preferred variables

    3. Use standard comparative statistics on those companies to determine the value


    ### K-Means Clustering


    `K-means clustering is actually a really simple, reiterative technique based on
    mean calculations. For every category of data you want to measure, you place a
    randomized “centroid”. You then calculate the distance from each datapoint to
    each centroid and create a relation to the nearest centroid for that datapoint.
    Once this is done for all centroids, you calculate for the mean of each cluster.
    Using the mean of each cluster, we recluster using the mean values to measure
    the distance rather than the randomized value we started out with. Finally, if
    that doesn’t change the clustering, then we calculate and keep track of the variation
    between the clusters. It will repeat this process as many times as you want, but
    only return the one with the best variation.


    The primary problem with this algorithm is that it''s sensitive to outlier data.
    Therefore, if you have companies that have huge amounts of debt, they are likely
    to throw off your results. If you really want this to work, you have to run through
    this algorithm, see what it produces, and if you notice that you are getting skewed
    results, you need to find the companies with the huge amounts of debt and remove
    them. So, if you notice that a company with $60k of debt is in the same group
    as the company with $900k of debt, you know that the second company is an outlier.
    You can learn more about `K-means clustering` here: [https://www.datascience.com/blog/k-means-clustering](https://www.datascience.com/blog/k-means-clustering).


    ### K-medoids


    This algorithm does very much the same thing as the previous clustering algorithm,
    however, it is less sensitive to outliers because of the `medoidshift` algorithm.
    The only problem and the main reason why this algorithm is not very popular is
    due to the computational requirements that it needs to do. Therefore, if you are
    iterating over hundreds, thousands, or even millions of companies, it''s going
    to take you significantly longer to make the necessary calculations to get to
    the end result when compared to the first algorithm that I listed here.


    You can find out more about `K-medoids` here: [http://www.math.le.ac.uk/people/ag153/homepage/KmeansKmedoids/Kmeans_Kmedoids.html](http://www.math.le.ac.uk/people/ag153/homepage/KmeansKmedoids/Kmeans_Kmedoids.html).


    ### CLARANS


    Due to the lack of optimization of the `k-medoids` algorithm, there have been
    many redesigns for how the algorithm goes about doing the same calculation. This
    algorithm stands for `Clustering Large Applications with Randomized Search`. This
    means that it is specifically designed to run a very similar version of the previous
    algorithm, but it''s also changed so that it is better for large applications.


