  trans: '

    之前，我们在“理解股票运作原理”章节中讨论了如何寻找值得投资的业务。一旦你找到了值得投资的业务，所有优秀的业务都会在不同的间隔经历两种不同的趋势。`绿线`（Green
    Line）被称为`大峰`（Big Peak），这意味着线条在大幅下降之前会达到`峰值`（Peak）。这是人们想要卖出的线条部分。下降的部分被称为`低谷线`（Trough
    Line），即人们等待再次购买的区域。`红线`（Red Line）是`小峰`（Little Peak），大多数`日内交易者`（Day Traders）在这里活跃。它和`大峰`相同，但利润产生的速度快得多。如果我们看这个的六个月版本，可以很容易看到很多这样的：


    ![](img/image00061.jpeg)


    这对我们来说相当容易理解，并且会变成一个我们可以寻找的重复模式。只要我们观察的是成功的业务，模型就非常直观，除非你想变得极其精确，否则不需要大量的数学知识。


    ## 最常用的机器学习方法：支持向量回归算法


    对于机器来说，使用相同的分析方法并不简单。这是因为我们已经构建了识别此类模式所需的算法。事实上，人类大脑在遗传上就倾向于识别模式。然而，创建一个`神经网络`（Neural
    Network）就像教幼儿如何识别同一种模式，只是机器掌握得更快，并且需要数学解释。因此，我们必须将这些模式分为两个不同的类别。


    第一类是注意线条的极值，但是哪一个呢？由于我们大脑已经识别了这些模式，你可能会困在思考线条上，但如果是这样，你需要停下来。`机器`（Machine）看到的不是线条，而是一个正数序列，我们需要重新训练`机器`看到其他东西。它需要看到靠近零的正数是`损失`（Loss），而远离零的正数是`收益`（Gain）。


    然而，你可能已经注意到没有一条完美的“线”来拟模型。如果我们观察之前的数据，当你为一种趋势定义一条线时，它将不再适用于另一种趋势。因此，我们需要一种方法来持续定义`损失`和`收益`在`线`上的位置，这就是`支持向量`（Support
    Vectors）发挥用场的地方。


    `支持向量`算法为`收益`设置一个边距，为`损失`设置一个边距，它们被放置在`趋势线`（Trending line）上。让我们使用之前对`收益`和`损失`的定义。不过，这些线条的定义有点不同。我们不是从零开始，而是从所谓的`超平面`（Hyperplane）开始。这是一条独立的线，它位于`D+`和`D-`边距之间，但这些边距根据你的需求定义为最近或最远的向量。一个是`D+`，另一个是`D-`。这些只是分类，`D`只是一个占位符，这里是展示`支持算法`（Support
    Algorithms）如何显示的图表：


    ![](img/image00062.jpeg)


    你可以看到，在我们情况下，`绿线`或`D-`是`收益`线。另一方面，`红线`代表我们的`损失`线以及方程的`D+`。现在你理解了它运作的大致，我们将对一个极其复杂的算法进行简要解释，大多数机器学习预测算法将使用：


    ![](img/image00063.jpeg)


    不要惊慌。没关系的。我们将一起过一遍。你需要理解这实际上是两个算法的结合。此外，这只是一个演进形式的


    ![](img/image00064.jpeg)


    几乎所有的机器学习算法都从`截距`（Slope-Intercept）开始，这是因为`截距`是`二分类`（Binary Separation）的真实形式。换句话说，`截距`是`感知器`（Perceptron）中使用的相同类型的公式。让我们把这些信息拆解为不同的组件：


    ![](img/image00065.jpeg)


    ![](img/image00066.jpeg)


    我认为我们可以理解这种情况下的`b = b`。现在我们将进一步拆分，但我们将从`x`开始，因为它比`m`不那么抽象。让我们从最困惑的部分开始，即连接这个方程的角括号。你会发现这种情况下的`b
    = b`。


    ```

    （其余文本对 x, m, b, y 和 Phi 等变量遵循相同的格式）

    ```

    '
