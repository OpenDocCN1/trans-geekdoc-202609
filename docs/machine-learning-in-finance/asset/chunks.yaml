    # 限价单 (Limit Orders)


    限价单是一种允许你设定买卖最低或最高价格的订单类型。这些通常是你预测的数字，你认为该物品的价格在特定时间内会达到这些数值。例如，假设你决定以每股约 70 美元的价格购买
    Facebook 股票。根据历史数据，你认为你的股票总价可能达到 75 美元。然而，你会发现你的股票价值可能跌到 65 美元。根据你的交易策略，如果你投资的是趋势交易（Trend
    trading），你可能会认为巨大的 `Surplus`（盈余）可能会导致巨额债务。你可以设置一个限价单以特定数量购买股票，我们将在股价跌破 65 美元后讨论这一点。同样，如果你看到股票价值达到
    75 美元，你可以设置一个限价单，在价格超过 75 美元后卖出该股票。如你所见，你可以设置机器语言算法的阈值，以类似于标准股票交易员的方式利用限价单。


    出场交易价格（Exit Trading Price）代表了对值得卖出的物品的识别。必须承认这一点是，在处理机器语言时，你在使用它们之前必须识别出边界。通过入场交易价格（Entry
    trading price），你是在寻找值得购买的商品；通过出场交易价格，你正在评估已经购买的物品，并决定现在是时候出售它们。


    ## 容差范围 (The Tolerance Range)


    我之所以指出入场交易价格是识别值得购买的物品，而出场交易价格是识别你已有的值得卖出的物品，是为了调节机器语言算法。在这两种情况下，你可能遵循相似的步骤，但出场交易价格的数据集要小得多，且数学逻辑与入场交易价格相反。这两个变量的目的是识别上限阈值和下限阈值，这需要两条独立的逻辑通道和数据集。


    ## 销售数量 (The Quantity of Sale)


    最后，尽管这看起来显而易见，我认为我有必要确保你理解，任何处理股票的机器学习算法的关键组件之一，就是如何决定卖出多少。新股票交易员可能认为，一旦股票变得足够盈利就卖掉所有股票是一个好主意，但情况并非如此。例如，假设你持有
    1,000 股 `Intel`（英特尔）。如果股票上涨 5 美元，那么卖掉它们时你将获得 5000 美元的利润。然而，如果你计划获得可能的 20 P/S 回报，你可能只想在盈利时卖出其中几股，并观察价格是否会进一步上涨。毕竟，有时趋势的增长最终会导致更大的跌落，但如果你寻找上升趋势，你仍然可以赚到相当观的钱。因此，你可能只想卖出
    500 股股票，这样你至少可以获得 2500 美元的利润，然后等待价格是否回落，随后你可以利用利润在更低的价格买入股票，同时等待股票回升。这允许你在赚取更多钱的同时，为价格更高时保留备用股票。这意味着你可能有多个神经网络，分别处理带有不同限价单的股票部分。


    # 使用机器学习确定当前股票价值


    ## 按季度而非每年训练你的机器学习算法


    现在，你可能认为这有点奇怪，但当你开始考虑长期投资时，你真的应该查看季度报告。然而，普通的股票交易员除非绝对必要，否则不会看季度报告。这是因为季度报告通常可以总结在他们所选股票网站提供的财务统计中，这些数据读起来要容易且快捷得多。长期投资意味着你需要找到某个特定公司的安全模式，以查看它是否在业务经营的可接受范围内。


    例如，正如我之前提到的，具有优秀 `PE` 值的公司通常是值得关注的。然后你研究这家公司，发现他们还有很棒的 `PBV` 值。这意味着这家公司可能值得调查，但问题是
    `PE` 值会随时间变化。虽然你可能看着当前的 `PE` 值，但讽刺的是，过去的 `PE` 值也具有价值。事实上，`PE` 值和其他变量可以随着时间的推移而受到观察。


    了解公司是否仍然存在决定了死亡模式的原因。虽然这可能并不令人意外，但公司倾向于以非常相同的方式死去。通常，发生的情况是，公司的收入突然出现负值。现在，他们可以在负值出现之前出售资产，或者在他们没有预料到它之后出售。这个关键时刻代表了公司正在恐慌，因为自然的模式是随着公司萎缩走向死亡而不断承担债务。在少数情况下，他们幸存了，但大多数情况下，它们都会以非常相同的方式死去。理解债务和总收入在决定公司何时临死方面起着关键作用，这是教机器学习算法避开那些在季度范围内表现出相同模式公司的关键。因此，你的数据集看起来可能如下所示：


    | 日期 | 市盈率比例 | 总收入 | 债务 | 资产价值 | 负债价值 | -1 = 死亡 1 = 存活 |

    | --- | --- | --- | --- | --- | --- | --- |


    ## 常识法：趋势交易 (Trend Trading)


    最常见的交易方法是使用峰值和谷底，这实际上就是说遵循趋势。无论你是看长期投资还是短期投资，你都在观察趋势。事实上，我早期提到过有 4 种主要的交易方法，但实际上，所有方法仍然属于趋势交易。


    让我们看看 CNBC 提供的以下 2018 年 6 月道琼斯指数图表：


    ![](img/image0059.jpeg)


    如你所见，这可能是最好或最坏的月份，取决于你在山坡哪一侧卖出股票。我们在在这张图中看到了特定类型的趋势，我将在下一张图中将其标记为绿线和红线：


    ![](img/image0060.jpeg)


    '
