- raw: "While some may argue differently, the ultimate goal of an ML algorithm is\
    \ to make predictions based on data. This means that you have a machine capable\
    \ of taking data and possibly making more accurate predictions than a top economist.\
    \ That means that there’s also a lot that it cannot do and, ethically, some things\
    \ they are forbidden to do.\n\nFor instance, you might want it to give you a 12-month\
    \ forecast of potential earnings. A Machine Learning algorithm can be made for\
    \ this. However, it can’t tell you how to improve that number. You could create\
    \ a Machine Learning algorithm that determined which tactics had better success\
    \ rates, but you cannot create an algorithm that will tell you how best to sell\
    \ a product. Additionally, you cannot create a Machine Learning algorithm to take\
    \ over the world. I’ve looked it up and there are simply too many variables.\n\
    \n## Financial Machine Learning Weaknesses\n\nThe primary issue that occurs with\
    \ most of the Machine Learning algorithms is with the dataset the algorithm it\
    \ is provided with. As I mentioned previously, the more useful data that you give\
    \ your algorithm, the more useful it can become. However, a good example of when\
    \ a good Machine Learning algorithm becomes “bad” is a Google example from years\
    \ ago. Google is a search engine giant that makes money by providing the best\
    \ search results and, thus, being able to sell ad-space that more accurately reflect\
    \ those results.\n\nOne day, something odd was found in the results of a particular\
    \ pair of searches. If a woman searched for a name associated with a Caucasian\
    \ male, the results would often return job-related websites like LinkedIn and\
    \ Monster Job. If a woman searched a name associated with African American decent,\
    \ advertisements and search results of criminal background checks would accompany\
    \ the original search. The problem was not how the machine language learned but\
    \ the dataset the machine was given a.k.a. women who commonly sought criminal\
    \ records for African American men. The Machine Learning Algorithm was making\
    \ an accurate prediction, but as humans, we would consider this morally wrong.\n\
    \n# Developing a Trading Strategy for Stocks\n\n##  \n\n## There Are 4 Primary\
    \ Methods of Trading\n\nMachine Learning can actually be used to determine what\
    \ method of trading you might want to take part in. Additionally, it may even\
    \ help you to open up your portfolio to commit to different types of trading strategies.\
    \ In this section, we’re going to discuss what types of algorithms can be used\
    \ alongside the different trading strategies.\n\nIdeally, if you are going into\
    \ this first hand, you might want to perform a K-cluster algorithm on the past\
    \ 5 years of trading information. Specifically, you want to include all companies\
    \ that have lasted for over 5 years and exclude anyone that hasn’t. This is called\
    \ Cluster Analysis and it will find possible associations between the companies\
    \ you might not have seen. An individual skeptical of the technology will only\
    \ see how the machine can show coincidences, but there is often a good reason\
    \ why some stocks rise at the same time.\n\nLet us talk about Black Box LLC (not\
    \ the real company) and Lee Memorial Hospital stocks (not the real company). There’s\
    \ no news associating these two companies, however, what happens when LMH signs\
    \ a multi-million-dollar contract with BB LLC? LMH will now be doing a lot of\
    \ business with BB LLC but LMH would have had a reason to make the contract. This\
    \ means that LMH plans to do well in the coming time and BB LLC will benefit from\
    \ this. Once the contract becomes news, everyone will want to get a trade in before\
    \ their stocks rise and this, ultimately, causes the rise. However, what happens\
    \ if this happens more than once?\n\nThere’s often a lot of data going around\
    \ stocks and it is difficult to keep track of contract renewals. Renewals are\
    \ important because they can be a predictor of rising and falling stock between\
    \ those in the contract. While knowing ahead of time what will happen in the deal\
    \ can be seen as insider trading, using a K-cluster algorithm to see there is\
    \ a periodic correlation is not. This is why it is useful to start this before\
