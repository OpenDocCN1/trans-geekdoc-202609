    \ Language and how it relates to the stock market.\n\n## Why You Need to Know\
    \ How It is Calculated\n\n### Information is Not Real-Time\n\nThe most important\
    \ part of this is that you needed to know the previous information because even\
    \ if you rely on the information gathered at stock market APIs, they may not have\
    \ the most recent, updated information. For instance, a common trick to see if\
    \ the information is updated daily or updated in real-time is to check the P/E\
    \ value for yourself. Sometimes, the number for this could be one or two points\
    \ lower or higher than what you personally calculate, which means what you calculated\
    \ is more accurate than the information you're being provided with. \n\n### You\
    \ Need to Teach the Machine This\n\nYou need to actually teach this to the machine,\
    \ so all the equations you would normally do in a financial situation needs to\
    \ be done by the machine itself. After all, what is the point of building a machine\
    \ learning neural network if the neural network cannot function in its original\
    \ purpose? You can use machine learning to identify Trends and similar, simple\
    \ tasks. However, if you're going to spend the time to train a neural network,\
    \ it might be worth your effort to build a machine that could suggest trades rather\
    \ than look at common market trends and just provide general data you already\
    \ have access to. \n\n### You Need to Know Where to Point the Machine\n\nNo matter\
    \ what you are doing with a machine learning algorithm, you are going to need\
    \ a way to point it in a certain direction. Whether you plan to use the machine\
    \ to identify trends, to identify companies worth investing in, to see if there\
    \ are hidden relations between companies, or anything else, you need to at least\
    \ know the mathematics used in the stock market so that you can effectively point\
    \ the machine towards the direction you wanted to go. \n\n### Understanding How\
    \ a Trader will Trade"
