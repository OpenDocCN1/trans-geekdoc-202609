    Therefore, if a company has a massive amount of debt and it doesn''t seem to be
    lowering, the machine can use clustering to put that debt area into a specific
    graph that''s away from the others. You could also have it separate the margin
    of risk by percentages so that if it fits within a certain percentage then the
    clustering can bring that into groups so that you can easily identify which ones
    have high debt that''s being managed and which ones have low debt that are doing
    okay and then you have ones in the middle that aren''t able to seem like they''re
    getting rid of that but the debts not increasing. What this does is that it creates
    categories of risk that you can easily identify as companies worth investing in.
    The reason why you might want to use clustering for this is because of the sheer
    amount of data that you have to go through. You may have to only look at a single
    number, but you also have to look at a single number 8 times for each company
    that you''re going through and you''re likely to go through at least a thousand.
    That means you''re literally looking at around 8,000 numbers, which would be quicker
    if you simply used a clustering technique to auto sort them.


    ## As A Day Trader


    The difference between penny trading and day trading is a little bit different
    in how you go about it, but also very much the same. You are still looking for
    variables such as debt and you are looking at debt history, but you are also including
    the link to your history that you would not normally include with penny trading.
    This is due to the fact that as a day trader, you are not looking at just companies
    that are trying to survive but companies that are making a decent profit. Therefore,
    you are looking for very much the same variables but for a different reason.


    This means that you might have to tweak your algorithms slightly so that you include
    extra variables in your classifications. You primarily want to look at the companies
    that are making a decent amount of money, have a decent margin of safety, and
    have a considerable P/E ratio. Once you develop a machine learning algorithm that
    takes these into account, you can then further develop it so that it takes other
    variables into account and thus becomes more precise. However, this is how you
    might create the machine learning algorithm to make very quick assumptions as
    to companies that are worth your time within minutes of you giving it data. In
    my honest opinion, I would probably have three different machine learning algorithms
    running at different times because this allows different variations of knowledge
    to be coming through. I would have your standard Financial machine learning algorithm
    running and using all the variables I would normally use to judge a company, a
    machine learning algorithm that just determines whether the company is surviving
    or thriving versus dying, and a final algorithm that determines trending companies
    at that time. These will give you, mostly, different results but the sweet spots
    are the companies that fit into 2 categories, primarily trending with the first
    or second ML algorithm.


    ## Clustering Techniques


    ### Partitioning is your Friend

