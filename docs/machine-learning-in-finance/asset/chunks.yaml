  trans: '


    尽管有些人可能持有不同意见，但机器学习算法的终极目标是根据数据做出预测。这意味着你拥有一台能够接收数据，并可能做出比顶尖经济学家更准确预测的机器。这意味着它也有许多做不到的事情，而且在伦理上，还有某些事情是它们被禁止做的。


    例如，你可能希望它能为你提供一份为期 12 个月的潜在收益预测。可以为此制作一个机器学习算法。然而，它无法告诉你该如何提高这个数字。你可以创建一个机器学习算法来确定哪些战术的成功率更高，但你无法创建一个能告诉你如何最好地销售某件产品的算法。此外，你无法创建一个用来接管世界的机器学习算法。我查过了，这其中的变量实在太多了。


    ## 金融机器学习的局限性


    大多数机器学习算法出现的首要问题在于提供给算法的数据集。正如我之前提到的，提供给算法的数据越有价值，它就越能变得有用。然而，一个优秀的机器学习算法何时变得“糟糕”的典型例子是多年前的一个
    Google 案例。Google 是搜索引擎巨头，通过提供最好的搜索结果来获利，从而能够出售更准确反映这些结果的广告位。


    一天，在某组特定搜索结果中发现了一些异常。如果一个女性搜索一个与白人男性相关的名字，结果通常会返回 LinkedIn 和 Monster Job 等与工作相关的网站。如果一个女性搜索一个与非洲裔背景相关的名字，犯罪背景检查的广告和搜索结果就会随原始搜索出现。问题不在于机器语言学习的方式，而在于给予机器的数据集——即那些经常寻找非洲裔男性犯罪记录的女性。机器学习算法正在做出准确的预测，但作为人类，我们认为这在道德上是错误的。


    # 开发股票交易策略


    ## 交易有 4 种主要方法


    机器学习实际上可以用于确定你想要参与哪种交易方法。此外，它甚至可以帮助你开放投资组合以投入不同类型的交易策略。在本节中，我们将讨论哪些类型的算法可以与不同的交易策略配合。


    理想情况下，如果你是亲身尝试，你可能想对过去 5 年的交易信息执行 `K-cluster algorithm`。具体来说，你想包含所有生存超过 5 年的公司，并排除任何未生存的公司。这被称为
    `Cluster Analysis`（聚类分析），它将发现你可能没有观察到的公司之间可能的关联。对技术持怀疑的人只会看到机器如何展示巧合，但某些股票之所以同时上涨通常有其充分的理由。


    让我们谈谈 Black Box LLC（非真实公司）和 Lee Memorial Hospital 股票（非真实公司）。没有新闻将这两家公司联系起来，然而，当
    HH 与 BB LLC 签署了一份数百万美元的合同时会发生什么呢？LMH 现在将与 BB LLC 进行大量业务交易，但 LMH 有理由签署该合同。这意味着
    LMH 计划在未来一段时间表现良好，而 BB LLC 将从中受益。一旦合同成为新闻，每个人都想在股票上涨之前进行交易，而这最终导致了价格的上涨。然而，如果这种情况发生了多次又会如何呢？


    股票周围通常流传着大量数据，很难跟踪合同的续约情况。续约非常重要，因为它们可以作为合同双方之间股票上涨或下跌的预测指标。虽然预知交易中将发生什么可以被视为内幕交易，但使用
    `K-cluster algorithm` 来发现周期性相关性并不是。这就是为什么在开始之前进行这项工作是很有用的，因为可以帮助关联公司之间可能的关系。


    ## 同日交易


    虽然我让这个术语听起来更有意义，但它通常被称为“日内交易”（Day Trading）。在这样的策略中，你在同一天买入和卖出股票。因此，如果你在第一天的上午
    9 点买入股票，那么你很可能在第一天的中午卖出这些股票。这使得潜在的毁灭性损失很难发生。然而，同时，你可能在短期内看到巨额的回报。由于日内交易发生的速度很快，很难整合所有可能的机器学习算法。


    ## 持仓交易


    持仓交易（Positional Trading）是大多数人考虑投资股票时的想法。这通常被称为“买入持有”策略，因为大多数人在买入后至少会等待一周或更长时间才卖出股票。这是因为这些人想要获得作为大股东时产生的巨额回报或控制权。这种大股东在电影中经常作为冲突点而非常受欢迎。然而，我们将关注更丰的回报，例如那些免费投资比特币并在几年后成为百万富翁的人。


    持仓交易的一个关键特征是确定哪些类别是最佳。例如，许多人一上来就选择了科技、律所、家电器和医疗保健。然而，这些个人并并不理解这些行业中哪些部分是最佳投资的。这在开发用于盈利的机器学习算法时是一个巨大的问题。


    ## 趋势交易


    趋势交易可能由于几个原因发生。例如，一种趋势交易是当你试图履行社会责任时。如果你支持女性主义，你可能会选择支持那些具有女性主义号召的公司。此外，另一种趋势交易是当你看到某种即将推出的热门技术。如果你关注主题演讲或参加技术会议，你可能会了解到某项你认为是有利润的技术。因此，你可能会投资销售这些技术的公司，以从从中获利。


    最后，另一种趋势交易通常指的是你试图预测特定公司的趋势线。事实上，当股票交易员谈论趋势交易时，他们指的是这种类型。趋势本身的定义稍微困难一些。


    ## 头皮交易


    最后，我们来到最后一种股票交易方法。头皮交易（Scalping）这种技术让人联想起真实的剥头皮行为。在真实的剥头皮中，一个人夺取敌人的头并从头骨上切下皮肤。以非常相似的方式，头皮交易在股票交易中是指通过买入价购买资产，然后寻找愿意以更高的买卖差价购买的买家。买卖差价简单就是股票出价和要价之间的差异。因此，如果你发现某只股票的出价是
    40 元，但你又找到了一个买家要价 50 元，那么你就可以获得 10 元的买卖差价。


    '
