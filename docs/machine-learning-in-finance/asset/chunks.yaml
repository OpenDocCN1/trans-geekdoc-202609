    \ to the public as a stock in the company. This stock is called a `Share`, as\
    \ in you are getting a share of the company. A stock, on the other hand, is a\
    \ collection of those shares. It’s rather hard to keep track of 1 billion shares\
    \ but if each `Stock` is made up of 5 shares, that’s only 200mil stocks to keep\
    \ track of. However! This is a story of all shares are stocks but not all stocks\
    \ are shares. For instance, some stocks could be allocated to certificates and\
    \ other parts that are share-like but are not directly shares. So, let’s begin\
    \ this by understanding how to calculate for shares since they hold the real value\
    \ for stocks.\n\nLet’s first discuss `BV` or `Book Value` and to get this we need\
    \ to break a company down into its most basic components and go from there. Let’s\
    \ go ahead and define `asset` and `liability`. An `asset` is anything that holds\
    \ monetary value, whether it makes you money or you can sell it for money. A `liability`\
    \ is anything that holds a deficit of monetary value, whether it costs you money\
    \ to keep it or if it is a debt.\n\nLet’s say we are a software company and we’re\
    \ about to open up to the stock market. We know that we make $100 for every software\
    \ we make, so let’s use that as our basis. That $100, should we only sell 1 product,\
    \ is called the `Total Revenue`. However, we only got that software because we\
    \ had it made. If we have a software team and website, along with other items,\
    \ that we pay for then this would be referred to as the `Cost of Revenue`. Let’s\
    \ say that for every product we sell, we have a `Cost of Revenue` of $70.\n\n\
    [![](Images/image00055.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\nThis number\
    \ is called `Net Income` and is called `Earnings` when divided into shares. If\
    \ there are 10,000 shares and you own 1 share, you make 1/10,000 of the `Earnings`\
    \ as a result. This is the reason why finding out what a company is worth before\
    \ you buy a stock is important. This is why you need to know the `Income Statement`,\
    \ `Balance Sheet`, and `Cash Flow Statement`. You already know about the `Income\
    \ Statement` as this is where you find the `Net Income` and `Earnings`. The `Balance\
    \ Sheet` is where you’ll find the `Equity` and `Book Value` or `BV` of a company.\
    \ This will be where your `Margin of Safety` is.\n\n[![](Images/image00056.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\
    \nThat equation is what calculates the `Equity` of a company, but the `Book Value`\
    \ is a little bit different. Additionally, if you take the `Market Price`, the\
    \ price that the market is selling all combined shares for, and subtract the `Equity`\
    \ from it, you then have the risk. Therefore, if the `Market Price` for this software\
    \ company’s shares are a total of $1,000,000 and the equity is $20,000, then you\
    \ have a risk of $980,000. This would be referred to as an extremely low `Margin\
    \ of Safety`. While this bigger number is known as the `Equity`, when it is divided\
    \ into shares it is renamed `Book Value`.\n\n`P/E` refers to how much the company’s\
    \ market price is versus how much it earns, thus aptly named `Price to Earnings\
    \ Ratio`. There are a few steps needed to get this number. I’m going to not only\
    \ explain how to come to those numbers, but why you need to know them even though\
    \ most stock “news” websites provide this freely.\n\nTo get to the `P/E` ratio,\
    \ you must first find the `EPS` and that simply means how much each share will\
    \ earn you should you buy it, named `Earnings Per Share`. `EPS` is calculated\
    \ by taking the `Earnings` and dividing it by the `Outstanding Shares` number,\
    \ which is really just how many shares are in circulation. To find `Earnings`,\
    \ stock traders will take the `Total Revenue` of a company and subtract the `Liabilities`\
    \ of the company. Therefore, the true calculation for this is:\n\n[![](Images/image00057.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\
    \nThe `P` in the `P/E` ratio is the current price for each share as it stands\
    \ currently. The `EPS` is how much each share should cost as its’ base value.\
    \ Therefore, if a company says it’s going to sell 2,000 shares at a total value\
    \ of $10,000 then the value of each share is $5. This is the `P` side of the equation.\
    \ \n\nIf we take the $100 for our software company earlier and turn it up to $10,000\
    \ and we do the same with the $70, which becomes $7,000 we can now do `EPS` calculations.\
    \ This means that our `Cost of Revenue`, which is also our `Liabilities` in this\
    \ situation, turns each share into `$3000/2000`. This makes our `EPS` 1.5. Now,\
    \ to get P/E we do:\n\n[![](Images/image00058.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\
    \nTherefore, if we say that the `Market Price` is $5 and our `EPS` is 1.5, then\
    \ our `P/E` is 3.\n\nSo, now that we have worked through this, you understand\
    \ the general gist of most the stock market. Good investors will look for a low\
    \ `P/E` value and a medium to high `Margin of Safety`. While there’s definitely\
    \ a bit more to stock trading, this book is about Financial Machine Language and\
    \ how it relates to the stock market.\n\n## Why You Need to Know How It Is Calculated\n\
    \n### Information is Not Real-Time\nThe most important part of this is that you\
    \ needed to know the previous information because even if you rely on the information\
    \ gathered at stock market APIs, they may not have the most recent, updated information.\
    \ For instance, a common trick to see if the information is updated daily or updated\
    \ in real-time is to check the P/E value for yourself. Sometimes, the number for\
    \ this could be one or two points lower or higher than you personally calculate.\n\
    \n### You Need to Teach the Machine This\nYou need to actually teach this to the\
    \ machine, so all the equations you would normally do in a financial situation\
    \ needs to be done by the machine itself. After all, what is the point of building\
    \ a machine learning neural network if the neural network cannot function in its\
    \ original purpose? You can use machine learning to identify Trends and similar,\
    \ simple tasks. However, if you're going to spend the time to train a neural network,\
    \ it might be worth your effort to build a machine that could suggest trades rather\
    \ than just provide general data you already have access to.\n\n### You Need to\
    \ Know Where to Point the Machine\nNo matter what you are doing with a machine\
    \ learning algorithm, you are going to need a way to point it in a certain direction.\
    \ Whether you plan to use the machine to identify trends, to identify companies\
    \ worth investing in, to see if there are hidden relations between companies,\
    \ or anything else, you need to at least know the mathematics used in the stock\
    \ market so that you can effectively point the machine towards the direction you\
    \ wanted to go.\n\n### Understanding How a Trader will Trade\n"
  trans: '

    讽刺的是，在投资方面，这些类别通常是最稳定的。许多人认为 `Real Estate`（房地产）应该包含在内，但必须符合特定标准才能增长。如果你在富人社区购买股票，除非该社区正在扩张，否则该社区可能会随着时间的推移而贬值。这些类别之所以是最好的，通常是因为两个因素：`P/E`
    和 `P/BV` 收益率。


    在技术领域，你拥有广泛的 `P/E` 范围。让我们快速解决一个问题，因为“股份”（Share）和“股票”（Stock）本身本身就非常令人困惑。


    `Share`（股份）是指公司想要拆分自己的份额，由公司本身公布。因此，当一家公司“上市”时，他们所做的是向公众开放 `Share` 池。此时，他们将发布特定数量的股份。从本质上，他们是将公司的一部分作为公司的股票向公众出售。这种股票被称为
    `Share`，因为你获得的是公司的一份。另一方面，`Stock`（股票）是这些股份的集合。要追踪 10 亿股股份非常困难，但如果每只 `Stock` 由
    5 股股份组成，那么只需要追踪 2 亿只股票即可。然而！这是一个故事：所有的股份都是股票，但并非所有的股票都是股份。例如，某些股票可能分配给证书以及其他类似于股份但不是直接的股份的部分。因此，让我们从理解如何计算股份开始，因为它们代表了股票的真实价值。


    让我们先讨论 `BV` 或 `Book Value`（账面价值），为了得到这一点，我们需要将公司拆解为最基础的组件并从那里开始。让我们先定义 `asset`（资产）和
    `liability`（负债）。`asset` 是任何持有货币价值的物品，无论它是能为你赚钱，还是你可以将其卖掉换钱。`liability` 是任何持有货币价值缺口的物品，无论维持它需要花费多少钱，还是它是一笔债务。


    假设我们是一家软件公司，正准备面向股市。我们知道每制作一个软件就能赚 $100，就以此为基准。如果我们只卖出 1 个产品，这 $100 就称为 `Total
    Revenue`（总营收）。然而，我们之所以拥有该软件是因为付钱制作了它。如果我们有一个软件团队、网站以及其他我们需要付费的项目，那么这将被称为 `Cost
    of Revenue`（营收成本）。假设我们每卖出一个产品，`Cost of Revenue` 都是 $70。


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    这个数字被称为 `Net Income`（净利润），当分摊到股份上时被称为 `Earnings`（收益）。如果有 10,000 股股份而你拥有 1 股，那么结果你将获得
    1/10,000 的 `Earnings`。这就是为什么在购买股票之前找出公司的价值是重要的原因。这就是为什么你需要了解 `Income Statement`（利润表）、`Balance
    Sheet`（资产负债表）和 `Cash Flow Statement`（现金流量表）。你已经了解了 `Income Statement`，因为这是你可以在其中找到
    `Net Income` 和 `Earnings` 的地方。`Balance Sheet` 是你找到公司 `Equity`（股东权益）和 `Book Value`
    或 `BV` 的地方。这将是你的 `Margin of Safety`（安全边际）所在。


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    该方程是计算公司 `Equity` 的，但 `Book Value` 稍有不同。此外，如果你将 `Market Price`（市场价格，即市场所有所有股份的总价格）减去
    `Equity`，你就得到了风险。因此，如果这家软件公司股票的 `Market Price` 总计为 $1,000,000，而权益为 $20,000，那么你就有
    $980,000 的风险。这将被视为极低的 `Margin of Safety`。虽然这个较大的数字被称为 `Equity`，但当它被分摊到股份时，它被重命名为
    `Book Value`。


    `P/E` 指公司的市场价格与其收益相比的情况，因此贴切地命名为 `Price to Earnings Ratio`（市盈率）。获得这个数字需要几个步骤。我不仅会解释如何得到这些数字，还会解释为什么即使大多数股票“新闻”网站免费提供这些信息，你仍然需要了解它们。


    要获得 `P/E` 收益率，你必须首先找到 `EPS`，它简单意味着如果你购买，每股股份将为你赚多少钱，名为 `Earnings Per Share`（每股收益）。`EPS`
    的计算方法是取 `Earnings` 并除以 `Outstanding Shares`（发行股数）数量，这实际上就是流通中的股份数量。要找到 `Earnings`，股票交易员会取公司的
    `Total Revenue` 并减去公司的 `Liabilities`（负债）。因此，真正的计算公式为：


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    `P/E` 比例中的 `P` 是目前每股的价格。`EPS` 是每股股份应的基础价值。因此，如果一家公司说它将以 $10,000 的总价值出售 2000 股，那么每股股份的价值就是
    $5。这是方程的 `P` 端。


    如果我们把之前提到的软件公司的 $100 增加到 $10,000，并对 $70 进行同样的操作（变为 $7,000），我们现在就可以进行 `EPS` 计算了。这意味着我们的
    `Cost of Revenue`（在这种情况下也是我们的 `Liabilities`）将每股变为 `$3000/2000`。这使得我们的 `EPS` 为
    1.5。现在，获取 P/E 我们这样做：


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    因此，如果我们说 `Market Price` 是 $5 而我们的 `EPS` 是 1.5，那么我们的 `P/E` 就是 3。


    所以，现在我们处理完这些之后，你已经理解了股市的大致。优秀的投资者会寻找低 `P/E` 值和中等到高的 `Margin of Safety`。虽然股票交易肯定还有更多内容，但这本书是关于金融机器语言（Financial
    Machine Language）以及它如何与股市相关的。


    ## 为什么你需要知道是如何计算的


    ### 信息不是实时的

    最重要的一点是你需要了解之前的信息，因为即使你依赖从股市 API 获取的信息，它们可能没有最新的更新信息。例如，检查信息是否每天更新或实时更新的一种常用技巧是自己去检查
    P/E 值。有时，这个数字可能比你亲自计算的低一一点或高一点。


    ### 你需要教会机器

    你实际上将这些教给机器，因为你在财务情况下通常执行的所有方程都需要由机器本身来完成。毕竟，如果机器学习神经网络无法实现其初衷，那么它的意义何在？你可以使用机器学习来识别趋势和类似的简单任务。然而，如果你打算花时间训练神经网络，那么可能值得精力构建一个可以建议交易的机器，而不是仅仅提供你已经获取的通用数据。


    ### 你需要知道将机器指向哪里

    无论你用机器学习算法做什么，你都需要一种方法将它指向特定的方向。无论你计划使用机器来识别趋势、识别值得投资的公司、查看公司之间是否存在隐藏关系，还是任何其他内容，你至少需要了解股市使用的数学知识，以便你能够有效地将机器指向你想要去的方向。


    ### 理解交易员将如何交易


    '
