    讽刺的是，垃圾股（penny stock）是你最不希望看到其长期历史的股票期权之一。原因在于，垃圾股之所以被称为垃圾股，通常是因为公司刚刚起步，要么由于某些原因，几乎没有进入股市的视野。通常，我发现许多公司出现在垃圾股名单上的原因仅仅是因为它们曾经非常值钱，然后陷入了巨大的麻烦，最终导致其总价值暴跌。很多时候，我看到公司股价在短短一年的时间内从
    60 美元或 100 美元一路跌到 3 美元。


    这意味着，如果你将长期的信息输入机器学习算法中，机器将学习到垃圾股中发生的巨大亏损差距。事实上，如果你根据过去的迭代来判断利润率，你实际上可能会发现，结果是你永远不会买垃圾股。现在，大多数垃圾股是通过大额购买让你盈利的。也就是说，如果某只股票价值约为
    0.27 美元，你购买 100 股，你现在就有大约 270 美元的股票。如果该股票每上涨 1 分，你的收益就会增加 10 美元。这就是垃圾股的盈利所在：股票的大额订单，因为任何正向的波动通常意味着你获得了巨额收益。


    问题实际上在于确定一家公司是在萎缩死亡，还是可能可能反弹。虽然说起来有些悲哀，但垃圾股市场确实是一个普通股票交易者在那个时刻倾向于为弱者加油的市场。这些公司曾处于事业的巅峰，但发生了某些事情，导致它们在股市中几乎一文不值。股市中的股票交易者利用并利用廉廉的价格从分钱中赚取倍倍的美元，这实际上有助于让那些公司生存下去。记住，当股价上涨时，通常意味着公司的实际价值也随上升。因此，在垃圾股公司中成功交易实际上可能会让它们重回曾经经历过的辉煌。


    除了这种感性的观点外，你是基于分钱而不是美元来定义成功的，因此你的阈值需要考虑到这一点。如果你的股票在 5 年前最初价格为 70 美元，而现在大约在 0.50
    美元左右，你的目标不是赚回该公司曾经拥有的 70 美元。你不想让你的机器学习算法过载无用信息。这意味着你能够更快地在数据集上训练你的机器，因为这些是最有用的数据。同样，你真的不需要超过两年的时间来衡量某些垃圾股的成功。


    ## 债务历史是好事


    另一方面，正如你并不一定想要一家公司及其利润的长期历史一样，你确实想要一份债务历史。你看，垃圾股内部的关键因素之一是该公司是否正在死去。你需要关注的是一家正在生存的公司和一家持续死亡的公司。你看，一家生存的公司最终会重新崛起，这是垃圾股交易者的终极愿望，因为如果你以
    0.27 美元购买了 100 股股票，公司价格涨到 30 美元，你花 270 美元赚了 3000 美元。这是一笔巨款，但通常这样做风险太高。相反，你要做的是寻找当天的趋势。


