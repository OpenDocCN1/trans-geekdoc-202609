    ![](Images/image00061.jpeg)


    This, for us, is fairly easy to understand and becomes a repeatable pattern we
    can look for. Provided we are looking at successful businesses, the models are
    pretty straightforward and don’t require a lot of math unless you want to become
    super precise.


    ## The Most Common Machine Learning Method: Support Vector Regression Algorithm


    It is not as simple for Machines to use the same method of analysis. This is because
    we have already constructed the algorithms needed to recognize this type of patterns.
    In fact, the human brain is genetically predisposed to recognize patterns. However,
    creating a `Neural Network` is like teaching a toddler how to recognize the same
    pattern, only machines catch on quicker and require mathematical explanations.
    Therefore, we have to separate these patterns into two different categories.


    The first category is to notice the extremes of the lines, but which ones. Since
    our brains already recognize the patterns, you might be stuck on thinking of the
    line, but you need to stop that if you are. The `Machine` does not see a line,
    instead, it sees a sequence of positive numbers and we need to retrain the `Machine`
    to see something else. It needs to see that positive numbers closer to zero are
    a `Loss` and positive numbers further away from zero are a `Gain`.


    However, you’ve probably already noticed there’s no good “line” that fits the
    model. If we look at the previous data, when you define a line for one trend,
    it will no longer be applicable for another trend. Therefore, we need a way for
    us to continuously define where the `Losses` and `Gains` are on a `Line`, which
    is where `Support Vectors` come in.


    The `Support Vector` algorithm sets a margin for `Gain` and a margin for `Loss`,
    which are placed along a `Trending line`. So, let’s use the previous definitions
    for `Gain` and `Loss`. Definitions for these lines are a little bit different
    though. Instead of going from zero, we go from what’s known as a `Hyperplane`.
    This is a separate line that places itself between the `D+` and `D-` margins,
    but these margins are defined by the closest or furthest vectors based on your
    needs. One category is `D+` and the other is `D-`, based upon what you want. These
