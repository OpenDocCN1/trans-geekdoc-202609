    # Limit Orders


    A limit order is a type of order that allows you to set a minimum or a maximum
    for which you will buy and sell at. These are usually speculative numbers that
    you think the price of the item will reach in a given time period. For instance,
    let''s say that you decide to buy Facebook stock at around $70 per stock. You
    think, according to pass data, that there is a likelihood that your stock will
    reach a total of $75. However, you will see that it is possible for your stock
    to become worth $65. Based off of your trading strategy, if you invested in Trend
    trading, you might think that a big `Surplus` will likely lead to a huge debt.
    You can then set a limit order to buy the stock at specific quantities, which
    we will talk about in a little bit after the price of the stock has gone below
    $65. Likewise, if you do see your stock become worth $75, you can set a limit
    order to sell that stock once it goes past $75. As you can see, you can set the
    thresholds of the machine language algorithm to utilize limit orders much the
    same way that the standard stock trader might.


    The Exit Trading Price represents the identification of an item worth selling.
    It''s fairly important to recognize that when dealing with machine languages,
    you have to identify the boundaries before you can use them. With the entry trading
    price, you are finding products that are worth buying. With the exit trading price,
    you are evaluating items you have already bought and determining whether it is
    time to sell them or not.


    ## The Tolerance Range


    The reason why I pointed out that the entry trading price is identifying items
    that are worth buying and the exit trading price are identifying items you already
    have that are worth selling, is to modulate the machine language algorithm. In
    both instances, you may follow similar steps, but the data set is significantly
    smaller for the exit trading price and the mathematics are in reverse to that
    of the entry trading price. The purpose of these two variables are to identify
    the upper bound threshold and the lower bound threshold, which requires two separate
    lanes of logic and data sets.


    ## The Quantity of Sale


    Finally, even though it seems obvious, I believe I need to ensure that you understand
    that one of the key components of any machine learning algorithm dealing with
    stocks is how to determine how much to sell. While the new stock trader might
    think that it is a good idea to sell all of their stocks once those stocks become
    profitable enough, that isn''t always the case. For instance, let''s say that
    you have 1,000 stocks inside of `Intel`. If the stocks rose by $5 then you would
    have a profit of $5000 if you sell those. However, if you plan on seeing a possible
    $20 P/S return, you may only want to sell a few of them while they are profitable
    and wait to see if the price increases further. After all, sometimes there is
    an increase in the trend that will eventually lead to a greater downfall, but
    you can still make quite some money if you look for a climbing trend. Therefore,
    you may just want to sell 500 of your stocks so that you at least get $2,500 as
    a profit and then wait to see if it falls back down, which you can then use the
    profit to buy the stocks at a lower price while waiting for the stocks to climb
    back up. This allows you to make more money while also keeping reserve stock for
    when the price is even higher. This means you could have more than one neural
    network handling portions of stock with different limit orders on them.


    # Machine Learning to Determine Value of Current Stocks


    ## Training Your Machine Learning Algorithm Quarterly not Annually


    Now, you might think this is a bit odd, but when you begin to think of long-term
    investment, you should really be looking at quarterly reports. However, a normal
    stock trader will not look at quarterly reports unless they absolutely have to.
    This is because the quarterly reports can usually be summed up in the financial
    statistics provided by their chosen stocks’ website, which are much easier and
    quicker to look at. Long-term investment means that you need to find a safe pattern
    with a specific company to see if it is within acceptable ranges of doing business
    with.


    For instance, as I mentioned before, a company with a great `PE` value is usually
    a company that''s worth looking into. You then look into the company and find
    that they also have a great `PBV` value. This means that the company might be
    worth investigating, but the problem is that the `PE` value changes over time.
    While you may be looking at the current `PE` value, the past `PE` values also
    have, ironically, value. You see, the `PE` value and other variables can be looked
    upon over the course of time.


    The reason why knowing whether the company is still around or not determines a
    pattern of death. While it may be somewhat not surprising, companies tend to die
    in very much the same way. Normally, what will happen is that the company will
    suddenly have a negative value in their revenue. Now, they could sell sell of
    their assets before the negative value appears or afterward if they weren''t expecting
    it. This key moment represents when a company is panicking because then the natural
    pattern is to consistently take on debt as the company dwindles into death. On
    a rare occasion, they do survive, but more often than not most of them will die
    in very much the same way. Understanding that debt and total revenue play a key
    role in determining when a company is about to die is key to teaching Machine
    Learning algorithms to stay away from companies that exhibit the same patterns
    on a quarterly basis. So, your Dataset may look something like this


    | Date | P/E Ratio | Total Revenue | Debt | Asset Value | Liability Value | -1
    = Dead 1 = Alive |

    | --- | --- | --- | --- | --- | --- | --- |


    ## The Common Sense Method: Trend Trading


    The most common method of trading is to use peaks and troughs, which is really
    just to say that one would follow the Trend. Whether you are looking at the Long
    Term or Short-Term Investing, you are still looking at Trends. In fact, early
    on I mentioned that there are 4 primary methods of trading, but in reality, all
    of them still fall underneath Trend Trading.


    Let us take a look at the following chart for the Dow Jones in June of 2018 thanks
