    我已经向你展示了如何选择最佳时间，但我们都清楚，确定一家公司的最佳方法是看它是否显示出相似的特征。因此，我们查看 `PE ratio`（市盈率）、`debt`、`total
    revenue`以及许多其他独特特征。现在，如果你正在搜索数千甚至数百万家公司，查看每一个变量是非常困难的。假设你只为一家公司查看五个变量，那么如果你处理数百万家公司，你需要查看
    500 万个变量；如果你处理的是数千家公司，则需要 5000 个变量。最后，你还需要注意哪些公司是好的，哪些是坏的。因此，你可能会无意中反复检查同一家公司，从而浪费时间。


    确定哪家公司值得投入时间的最佳方法实际上是利用你所查看的相同变量并对它们运行分区算法。具体来说，对于你查看的每个变量，都会运行一个分区算法。因此，你会看到一种聚类算法，它会根据随机点组织所有的
    `PE ratios`，以便你拥有高 `PE ratios`、中等 `PE ratios` 和低 `PE ratios`。你可以对 `total revenue`、`debt`
    以及几乎任何其他变量进行此操作。然而，它们不会是你的最终结论。由于你比较了所有的数字，然后你提取放入你最喜欢的类别的公司并以这种方式进行比较。它的作用是将公司的数量减少到一组你可以根据比较进行评估的公司。


    1. 聚类具有相似变量的公司

    2. 提取具有偏好变量的公司

    3. 对这些公司使用标准比较统计来确定价值


    ### K-Means 聚类


    `K-means clustering 实际上是一种基于均值计算的非常简单的迭代技术。对于你想要衡量的每类数据，你都会放置一个随机的“质心”。然后你计算每个数据点到每个质心的距离，并为该数据点与最近的质心建立关联。一旦对所有质心完成操作，就会计算每个聚类的均值。使用每个聚类的均值，我们使用均值重新进行聚类，而不是我们最初开始的随机值来测量距离。最后，如果这没有改变聚类结果，我们就计算并跟踪聚类之间的差异。它将根据你的需要重复此过程，但只返回变异最好的一个。


    该算法的主要问题是它对离群数据敏感。因此，如果你有巨额债务的公司，它们很可能会干扰你的结果。如果你真的想让它起，你必须运行此算法，看看它产生了什么，如果你发现你得到的是偏斜的结果，你需要找到拥有巨额债务的公司并删除它们。所以，如果你发现一家负有
    6 万美元债务的公司与一家负有 90 万美元债务的公司在同一组，你就知道第二家公司是离群值。你可以在这里学习更多关于 `K-means clustering`：[`www.datascience.com/blog/k-means-clustering`](https://www.datascience.com/blog/k-means-clustering)。


    ### K-medoids


    该算法的操作与之前的聚类算法非常相似，但由于使用了 `medoidshift` 算法，它对离群值不那么敏感。唯一的问题以及该算法不流行的主要原因是它需要进行的计算需求。因此，如果你正在迭代处理成百、数千甚至数百万家公司，与我在这里列出的第一种算法相比，完成必要的计算以获得最终结果将花费你更多的时间。


    你可以在这里了解更多关于 `K-medoids`：[`www.math.le.ac.uk/people/ag153/homepage/KmeansKmedoids`](http://www.math.le.ac.uk/people/ag153/homepage/KmeansKmedoids)。


    ### CLARANS


    由于对 `k-medoids` 算法缺乏优化，对该算法的方法进行了许多重新设计。这代表了`随机搜索的大规模聚类`。


    # 自动化交易决策的最佳软件


    ## Wealthsimple


