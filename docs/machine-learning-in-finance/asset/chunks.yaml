    \ company’s shares are a total of $1,000,000 and the equity is $20,000, then you\
    \ have a risk of $980,000. This would be referred to as an extremely low Margin\
    \ of Safety. While this bigger number is known as the Equity, when it is divided\
    \ into shares it is renamed Book Value.\n\nP/E refers to how much the company’s\
    \ market price is versus how much it earns, thus aptly named Price to Earnings\
    \ Ratio. There are a few steps needed to get this number. I’m going to not only\
    \ explain how to come to those numbers, but why you need to know them even though\
    \ most stock “news” websites provide this freely.\n\nTo get to the P/E ratio,\
    \ you must first find the EPS and that simply means how much each share will earn\
    \ you should you buy it, named Earnings Per Share. EPS is calculated by taking\
    \ the Earnings and dividing it by the Outstanding Shares number, which is really\
    \ just how many shares are in circulation. To find Earnings, stock traders will\
    \ take the Total Revenue of a company and subtract the Liabilities of the company.\
    \ Therefore, the true calculation for this is:\n\n[![](Images/image00057.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\
    \nThe P in the P/E ratio is the current price for each share as it stands currently.\
    \ The EPS is how much each share should cost as its’ base value. Therefore, if\
    \ a company says it’s going to sell 2,000 shares at a total value of $10,000 then\
    \ the value of each share is $5. This is the P side of the equation. \n\nIf we\
    \ take the $100 for our software company earlier and turn it up to $10,000 and\
