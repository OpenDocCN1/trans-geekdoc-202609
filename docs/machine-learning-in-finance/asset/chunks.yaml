    While some may argue differently, the ultimate goal of an ML algorithm is to make
    predictions based on data. This means that you have a machine capable of taking
    data and possibly making more accurate predictions than a top economist. That
    means that there’s also a lot that it cannot do and, ethically, some things they
    are forbidden to do.


    For instance, you might want it to give you a 12-month forecast of potential earnings.
    A Machine Learning algorithm can be made for this. However, it can’t tell you
    how to improve that number. You could create a Machine Learning algorithm that
    determined which tactics had better success rates, but you cannot create an algorithm
    that will tell you how best to sell a product. Additionally, you cannot create
    a Machine Learning algorithm to take over the world. I’ve looked it up and there
    are simply too many variables.


    ## Financial Machine Learning Weaknesses


    The primary issue that occurs with most of the Machine Learning algorithms is
    with the dataset the algorithm it is provided with. As I mentioned previously,
    the more useful data that you give your algorithm, the more useful it can become.
    However, a good example of when a good Machine Learning algorithm becomes “bad”
    is a Google example from years ago. Google is a search engine giant that makes
    money by providing the best search results and, thus, being able to sell ad-space
    that more accurately reflect those results.


    One day, something odd was found in the results of a particular pair of searches.
    If a woman searched for a name associated with a Caucasian male, the results would
    often return job-related websites like LinkedIn and Monster Job. If a woman searched
    a name associated with African American decent, advertisements and search results
    of criminal background checks would accompany the original search. The problem
    was not how the machine language learned but the dataset the machine was given
    a.k.a. women who commonly sought criminal records for African American men. The
    Machine Learning Algorithm was making an accurate prediction, but as humans, we
    would consider this morally wrong.


    # Developing a Trading Strategy for Stocks


    ## There Are 4 Primary Methods of Trading


    Machine Learning can actually be used to determine what method of trading you
    might want to take part in. Additionally, it may even help you to open up your
    portfolio to commit to different types of trading strategies. In this section,
    we’re going to discuss what types of algorithms can be used alongside the different
    trading strategies.


    Ideally, if you are going into this first hand, you might want to perform a `K-cluster
    algorithm` on the past 5 years of trading information. Specifically, you want
    to include all companies that have lasted for over 5 years and exclude anyone
    that hasn’t. This is called `Cluster Analysis` and it will find possible associations
    between the companies you might not have seen. An individual skeptical of the
    technology will only see how the machine can show coincidences, but there is often
    a good reason why some stocks rise at the same time.


    Let us talk about Black Box LLC (not the real company) and Lee Memorial Hospital
    stocks (not the real company). There’s no news associating these two companies,
    however, what happens when LMH signs a multi-million-dollar contract with BB LLC?
    LMH will now be doing a lot of business with BB LLC but LMH would have had a reason
    to make the contract. This means that LMH plans to do well in the coming time
    and BB LLC will benefit from this. Once the contract becomes news, everyone will
    want to get a trade in before their stocks rise and this, ultimately, causes the
    rise. However, what happens if this happens more than once?


    There’s often a lot of data going around stocks and it is difficult to keep track
    of contract renewals. Renewals are important because they can be a predictor of
    rising and falling stock between those in the contract. While knowing ahead of
    time what will happen in the deal can be seen as insider trading, using a `K-cluster
    algorithm` to see there is a periodic correlation is not. This is why it is useful
    to start this before getting started as it can help associate possible relations
    between companies.


    ## Same Day Trading


    While I did make the terminology make more sense, it is usually referred to as
    Day Trading. In such a strategy, you buy stocks and sell stocks on the same day.
    Therefore, if you bought stocks at 9 AM on Day 1, you would then likely sell such
    stocks at Noon on Day 1. This makes potential, devastating losses hard to come
    by. However, at the same time, you are not likely to be seeing a huge payout any
    time soon. Due to the speed at which Day Trading takes place, it is difficult
    to incorporate all of the possible machine learning algorithms.


    ## Positional Trading


    Positional trading is what most people think of when they think of investing in
    stocks. This is usually called the “buy-and-hold” strategy as most people will
    wait at least a week or more after buying in order to sell their stock. This is
    because these people want the big payoff or control that occurs when you are a
    majority stockholder. This majority stockholder is actually quite popular in movies
    as a point of contention. However, we’ll focus on the bigger payoffs like those
    who invested in Bitcoin for free and became millionaires a few years later.


    One of the key features to Positional Trading is determining what the best categories
    are. For instance, a lot of people choose Technology, Law Firms, Appliances, and
    Healthcare right off the bat. However, those same individuals will not understand
    what parts of those industries are best to invest in. This is a massive problem
    when it comes to developing a machine learning algorithm to make a profit as it
    needs to understand what is a good choice and what is a bad choice.


    ## Trend Trading


    Trend trading can happen for a few reasons. For instance, one type of trend trading
    is when you are trying to be socially responsible. If you believe in feminism
    you might go with supporting only companies that have a feminist calls. Additionally,
    another type of trend trading is if you see a popular piece of technology that
    is about to come out. If you pay attention to keynote speeches or if you attend
    technology conferences, you might know about a certain technology you think it''s
    going to be profitable. Therefore, you might invest in a company selling those
    Technologies to cash in on a particular trend.


    Lastly, the other type of trend trading usually refers to when you are trying
    to predict the trend line for a particular company. In fact, when stock traders
    talk about trend trading, this is the type they are talking about. The trend itself
    is a little bit more difficult to define.


    ## Scalping


    Finally, we get to our final methodology of stock trading. Scalping is a technique
    that is reminiscent of the actual act of scalping. In the actual act of scalping,
    one takes their enemies head and slices off the skin of the skull from the scalp.
    In much a similar way, scalping, as it pertains to stock trading, refers to the
    act of buying assets at their bidding value and then finding buyers willing to
    buy even higher using bid-ask spreads. A bid-ask spread is simply a difference
    between what a stock is bidding at and the asking price for the same asset. Therefore,
    if you find a stock that is bidding at $40 but then you find a buyer asking for
    that stock at $50, you can then have a bid-ask spread of $10.

