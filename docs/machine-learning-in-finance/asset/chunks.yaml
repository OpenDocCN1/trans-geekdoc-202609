    \ example of this is the Bitcoin as it is worth far more than what most people\
    \ would generally say it's worth. In fact, it's usually referred to as a new type\
    \ of Fiat money because of its initial value and then its true value being so\
    \ different. \n\nThe problem here is that I can't tell you exactly what point\
    \ of Direction you should use because it's too difficult to determine the best\
    \ move. There are better moves that you can make. For instance, you definitely\
    \ want to try and find the cheapest type of asset that you can get and you definitely\
    \ want to make sure that you trade in for stocks at a decent value. However, that\
    \ limit and benefit is really defined by you.\n\n## Entry Trading Price\n\nThe\
    \ entry trade is really just the name you use to describe the moment you would\
    \ find a stock acceptable to buy. In such an instance, you might want to buy stocks\
    \ at around 20% of the value that they are currently being sold at. This would\
    \ be a threshold that you would set inside of the computer to determine that you\
    \ want to buy it at a certain price. The problem here is that you run into an\
    \ infinite possibility issue. Let's say that you set it to only buy stocks if\
    \ they are 20% lower in value than when the stocks first opened. Sure, let's say\
    \ that your machine will now do this and that you, in fact, receive a windfall\
    \ of stocks because the stock value has gone down by that much, but what happens\
    \ if it goes down another 20% because the stock market value is crashing for that\
    \ particular business? That's a huge risk to take and yet it is a very real possibility.\
    \ Even worse, this could have been any percentage that you said ahead of time\
    \ because even if you said it to 5%, it could very well go down another 5%.\n\n\
    Additionally, you run into the other side of the problem, what happens if it never\
    \ goes below that amount? You would then need to adjust it to the amount you felt\
    \ appropriate, which would likely be based on the lowest common price that it\
    \ drops to. However, you run into the issue happening again. It is rare, but it\
    \ does happen, and these are the things you need to think about when going with\
    \ machine learning and determining your prices for your stocks. After all, you\
    \ don't want to buy a stock that is plummeting into the ground and you also don't\
    \ want to have a machine that will never buy any stock because it never reaches\
    \ the threshold you have set. However, the Entry Trading Price represents the\
    \ identification of a buy-worthy item.\n\n## Exit Trading Price\n\nYou're going\
    \ to need to define a trading price in which you exit the market, which is to\
    \ say that you need to find a price that you are comfortable selling at. Once\
    \ again, you come into the problem of trying to determine a value that most people\
    \ determine at the time of looking at the stocks. However, we actually do this\
    \ all the time in stock trading. This is often referred to as stop order and limit\
    \ order. For instance, in a stop order, you may only want to buy or sell an item\
    \ at a specific amount. Until that amount is reached, no money leaves your pocket.\
    \ In a limit order, we are dealing with the same thresholds a machine language\
    \ will have to deal with.\n"
