    现在我们进入本章的主题，但我们首先需要建立一个基础来理解这一点。当你为了金融目的开发机器学习算法时，你需要知道你将用什么来“教”这个机器学习算法。如果机器学习算法不知道如何做出适当的财务选择，那么开发机器学习算法或尝试用它来取代你自己的决策就没有意义了。因此，既然你已经了解了不同股票策略的运作方式以及通用的股票市场数学原理，我们现在将介绍你在构建机器学习算法时需要构建的不同部分。


    ## 方向导向 (Point-of-Direction)


    虽然大多数人可能认为方向点是指“最大利润”，但这并不是股票交易员思维的方式。事实上，“最大利润”是他们实际关注点带来的收益。大多数股票交易员会关注被低的资产、目前高昂的趋势以及目前以公价值出售的资产。


    每种方法实际上都有其益处，取决于你如何处理它们。例如，最容易思考的是寻找低估资产，但解决起来却是最困难的。之前在位置交易中提到的方法实际上被称为“沃伦·巴菲特式交易法”。你通过计算具有低
    `P/E`（市盈率）和 `BV`（账面价值）来确定目前哪些是低估的。这告诉你，你购买的任何东西都能获得大量资金，但故事背后还有更多。例如，如果你正试图寻找一个被低估的新科学领域呢？


    在 20 世纪 60 年代，这通常被视为一种爱好。只有富人才能真正投入资金投资，而且你必须通过非常有选择性的杂志进行订购。此外，这些杂志通常会自己资助这些项目。这是一个非常复杂的组合体，由于零件非常昂贵，通常不会给任何人带来盈利。现在，你会投资这项爱好吗？如果你说不，那么你就属于那群没有从计算的未来中获利的人。这是一个非常简单的例子，说明了低估技术进入市场而人们没有看到未来的潜力。更重要的是，除了远见卓识，你究竟如何给这样一个物品估值呢？事实是，你根本做不到。


    最容易定义的实际上是允许机器学习算法识别目前高昂的趋势。例如，你会如何识别趋势呢？你可能会查看之前的数据，发现一个上反弹阈值和一个下反弹阈值。这在机器学习算法内部可以很容易定义，因为阈值通常就是它的工作基础。你看到某只股票开始上涨，然后下跌，重复这种模式几次，最终导致大幅上涨后又剧下跌。这通常被称为趋势，即公司获得了一点价值，又失去了一点价值，但每隔一段时间，它会获得大量价值，然后又失去大量价值。这种做法被称为趋势交易（Trend
    trading），对于那些想要快速赚大钱但不想每天花时间盯着股票的人来说，相当常见。当然，趋势交易可以每天发生，但当你与某些公司打道时，这些趋势线可能需要几周才能形成。这真的不是你可以预测的，除非根据过去这些事件发生的速度以及导致这些事件的原因的模式来预测。


    最后，你可以简单地设置机器学习语言来识别金额处于公价值的部分，也就是说，它大致等于于它应有的价值。这实际上很难做到，因为一旦一家公司变得流行，这种公价值往往就会被抛到脑后。一个完美的例子是比特币，它的价值远高于大多数人通常认为它所拥有的价值。事实上，由于其初始价值与随后真实价值之间的巨大差异，它通常被称为一种新型的法币（Fiat
    money）。


    这里的问题在于，我无法准确告诉你应该使用哪个方向点，因为要确定最佳走法太困难了。你有更好的操作可以进行。例如，你绝对想要尝试找到你能获得的最便宜的资产类型，并且你绝对想要确保以合理的价值买入股票。然而，这种限制和收益实际上是由你定义的。


    ## 入场交易价格 (Entry Trading Price)


    入场交易实际上只是你用来描述发现某只股票可以购买的时刻的名称。在这种情况下，你可能想以其目前出售价格的 20% 左右购买股票。这将是你在计算机内部设置的阈值，以确定你想以特定价格购买它。这里的问题是，你会遇到无限可能性的问题。假设你设置为只有当股票比开盘价低
    20% 时才购买。当然，假设你的机器现在执行了操作，你确实因为股票下跌这么多获得了一笔股票，但如果因为特定业务的股票市场崩溃而又下跌了 20% 会怎样？这是一个巨大的风险，但这是一个非常真实的可能性。更糟糕，这可能是你事先设定的任何百分比，即使你设定的是
    5%，它也很有可能再跌 5%。


    此外，你还会遇到问题的另一面，如果它从未跌破那个金额怎么办？你将需要将其调整为你认为合适的金额，这很可能是基于它跌到的最低共同价格。然而，你又会遇到同样的问题。这种情况很罕见，但确实会发生，这些都是你在使用机器学习并确定股票价格时需要考虑的事情。毕竟，你不想买入一只暴跌入地的股票，你也不希望有一台由于从未达到你设定的阈值而永远不会购买股票的机器。然而，入场交易价格代表了对值得购买物品的识别。


    ## 出场交易价格 (Exit Trading Price)


    你需要定义一个你离开市场的交易价格，也就是说，你需要找到一个你感到可以出售的价格。再次，你面临了试图确定一个价值的问题，而这种价值是大多数人在他们观察股票时确定的。然而，我们在股票交易中实际上经常这么做。这通常被称为止损单（stop
    order）和限价单（limit order）。例如，在止损单中，你可能只想以特定金额买卖某物品。在达到该金额之前，没有资金离开你的口袋。在限价单中，我们处理的是与机器语言需要处理的相同的阈值。

    '
