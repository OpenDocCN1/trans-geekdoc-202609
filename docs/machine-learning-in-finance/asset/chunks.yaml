- raw: "Now we get to the point of this chapter, but we first needed to set up a base\
    \ to understand this. When you develop a machine learning algorithm for financial\
    \ purposes you need to know what you will be using to teach that machine learning\
    \ algorithm. If the machine learning algorithm doesn’t know how to make the proper\
    \ Financial choices, it doesn’t make sense to make a machine learning algorithm\
    \ or try and use one to replace your own decisions. Therefore, now that you know\
    \ how the different stock strategies work and the math that goes along with the\
    \ stock market in general, we will now go over the different parts you need to\
    \ build in a machine learning algorithm.\n\n### Point-of-Direction\n\nWhile most\
    \ might think that the Point of Direction is “most profit”, but this is not how\
    \ a stock trader thinks. In fact, “most profit” is a benefit of what they actually\
    \ think of. Most stock traders will focus themselves on undervalued assets, currently\
    \ expensive trends, and what’s currently selling for fair value.\n\nThere’s really\
    \ a benefit to each of these, depending on how you handle them. For instance,\
    \ the easiest one to think about is finding undervalued assets but it is the most\
    \ difficult to resolve. The previously mentioned method in Positional Trading\
    \ is actually referred to as the Warren Buffett way of trading. You calculate\
    \ what’s currently undervalued if they have a low P/E and BV. This tells you that\
    \ you will get a lot of money for anything you purchase, but there’s more to this\
    \ story. For instance, what if you were trying to find an undervalued new piece\
    \ of science?\n\nIt was generally thought of as a hobby practice in the 1960s.\
    \ Only Rich individuals could really invest money in this and you had to order\
    \ it through very selective magazines. In addition to this, those magazines usually\
    \ funded the project themselves. This was a fairly complex item to put together\
    \ and normally it wouldn't make anybody any money because the parts were so expensive.\
    \ Now, would you invest in this hobby? If you said no, you would have been part\
    \ of the crowd that didn't profit off of the future of computing. This was a fairly\
    \ simple example of when undervalued technology enters the marketplace and people\
    \ don't see the potential future. More importantly, how exactly do you put a value\
    \ on such an item beyond visionary? The truth of the matter is you simply can't.\n\
    \nThe easiest to define is actually allowing a machine learning algorithm to spot\
    \ currently expensive trends. For instance, how would you identify a trend? You\
    \ would likely look at the previous data and see that there is a threshold for\
    \ an upper bounce and a threshold for a lower bounce. This can be easily defined\
    \ inside of a machine learning algorithm because thresholds are usually what it\
    \ works in the first place. You see a particular stock begin to rise and then\
    \ fall and then repeat this pattern for a few steps, which ultimately leads to\
    \ a great rise and then a great fall. This is usually referred to as a trend where\
    \ the company gains a little bit of value and loses a little bit of value but\
    \ every once in a while, it gains a lot of value and then loses a lot of value.\
    \ This practice is known as Trend trading and it is fairly common for people who\
    \ want to make a lot of money quickly but not spend their time watching the stocks\
    \ on a daily basis. Sure, Trend trading can happen on a daily basis but when you're\
    \ working with certain companies, these trendlines can actually take weeks to\
    \ develop. It's not really something that you can predict beyond past patterns\
    \ of how fast that happened in the past and what caused those events.\n\nFinally,\
    \ you could simply set the machine learning language to identify sections where\
    \ the amount is of a fair value and that is to say that it is about equal to what\
    \ it should be. This is actually pretty hard to do because once a company gets\
    \ pretty popular, this fair value tends to be thrown out the window. A perfect\
    \ example of this is the Bitcoin as it is worth far more than what most people\
    \ would generally say it's worth. In fact, it's usually referred to as a new type\
    \ of Fiat money because of its initial value and then it's true value being so\
    \ different. \n\nThe problem here is that I can't tell you exactly what point\
    \ of Direction you should use because it's too difficult to determine the best\
    \ move. There are better moves that you can make. For instance, you definitely\
    \ want to try and find the cheapest type of asset that you can get and you definitely\
    \ want to make sure that you trade in for stocks at a decent value. However, that\
    \ limit and benefit is really defined by you. \n\n### Entry Trading Price\n\n\
    The entry trade is really just the name you use to describe the moment you would\
    \ find a stock acceptable to buy. In such an instance, you might want to buy stocks\
    \ at around 20% of the value that they are currently being sold at. This would\
    \ be a threshold that you would set inside of the computer to determine that you\
    \ want to buy it at a certain price. The problem here is that you run into an\
    \ infinite possibility issue. Let's say that you set it to only buy stocks if\
    \ they are 20% lower in value than when the stocks first opened. Sure, let's say\
    \ that your machine will now do this and that you, in fact, receive a windfall\
    \ of stocks because the stock value has gone down by that much, but what happens\
    \ if it goes down another 20% because the stock market value is crashing for that\
    \ particular business? That's a huge risk to take and yet it is a very real possibility.\
    \ Even worse, this could have been any percentage that you said ahead of time\
    \ because even if you said it to 5%, it could very well go down another 5%.\n\n\
    Additionally, you run into the other side of the problem, what happens if it never\
    \ goes below that amount? You would then need to adjust it to the amount you felt\
    \ appropriate, which would likely be based on the lowest common price that it\
    \ drops to. However, you run into the issue happening again. It is rare, but it\
    \ does happen, and these are the things you need to think about when going with\
    \ machine learning and determining your prices for your stocks. After all, you\
    \ don't want to buy a stock that is plummeting into the ground and you also don't\
    \ want to have a machine that will never buy any stock because it never reaches\
    \ the threshold you have set. However, the Entry Trading Price represents the\
    \ identification of a buy-worthy item.\n\n### Exit Trading Price\n\nYou're going\
    \ to need to define a trading price in which you exit the market, which is to\
    \ say that you need to find a price that you are comfortable selling at. Once\
    \ again, you come into the problem of trying to determine a value that most people\
    \ determine at the time of looking at the stocks. However, we actually do this\
    \ all the time in stock trading. This is often referred to as stop order and limit\
    \ order. For instance, in a stop order, you may only want to buy or sell an item\
    \ at a specific amount. Until that amount is reached, no money leaves your pocket.\
    \ In a limit order, we are dealing with the same thresholds a machine language\
    \ will have to deal with."
