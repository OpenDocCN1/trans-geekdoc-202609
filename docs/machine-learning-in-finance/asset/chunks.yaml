    \nThis number is called Net Income and is called Earnings when divided into shares.\
    \ If there are 10,000 shares and you own 1 share, you make 1/10,000 of the Earnings\
    \ as a result. This is the reason why finding out what a company is worth before\
    \ you buy a stock is important. This is why you need to know the Income Statement,\
    \ Balance Sheet, and Cash Flow Statement. You already know about the Income Statement\
    \ as this is where you find the Net Income and Earnings. The Balance Sheet is\
    \ where you’ll find the Equity and Book Value or BV of a company. This will be\
    \ where your Margin of Safety is.\n\n[![](Images/image00056.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\
    \nThat equation is what calculates the Equity of a company, but the Book Value\
    \ is a little bit different. Additionally, if you take the Market Price, the price\
