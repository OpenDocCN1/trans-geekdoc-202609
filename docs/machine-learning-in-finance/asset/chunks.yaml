    this is just an evolved form of


    [![](Images/image00064.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    Almost all machine learning algorithms start out with the `Slope-Intercept` and
    this is because the `Slope-Intercept` is the first true form of `Binary Separation`.
    In other words, `Slope-Intercept` is the same type of formula used in the `Perceptron`.
    So, let’s go ahead and break this information down into the different components:


    [![](Images/image00065.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    [![](Images/image00066.jpeg)](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    And I think we can understand that `b = b` in this situation. So now we’re going
    to break this down even further, but we’ll start with `x` because it is less abstract
    than `m`. Let’s start with the most confusing part, the angled brackets holding
    this equation together. You will find that `b = b` in this situation.


