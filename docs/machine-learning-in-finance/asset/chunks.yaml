    \n# What is Financial Machine Learning?\n\n##  \n\n## Understanding Artificial\
    \ Intelligence\n\nIn order to understand what Financial Machine Learning is, we\
    \ first need a brief introduction into what Artificial Intelligence is. Artificial\
    \ Intelligence is, actually, a common theme in our society. From the bad guy in\
    \ the movie to the interactive enemies in a game (a side note on noticing A.I.\
    \ usually is the bad guy), Artificial Intelligence permeates our society pretty\
    \ thoroughly. However, most of this is “limited” A.I.\n\nLimited A.I. refers to\
    \ a machine or program that has exceedingly limited capabilities. In fact, most\
    \ of what you think as A.I. is also fake A.I. Fake A.I. refers to programming\
    \ that simulates the experience of A.I. without being A.I.\n\nFor instance, when\
    \ you see an enemy follow you in a game, it’s not actually thinking. Instead,\
    \ it’s running a mathematical algorithm of “possibilities”. There’s a high possibility\
    \ that when you are close that it may melee attack. There’s a low possibility\
    \ that it will throw a grenade. Otherwise known as proximity estimation, most\
    \ enemy A.I. in video games are simply determining an action based on distance\
    \ to the player and continued accuracy of player damage. This is “fake” because\
    \ it simulates a machine that has intelligence, but it really doesn’t have any.\n\
    \nReal A.I. could be compared to the “shadow” enemy or doppelganger in some video\
    \ games. In these scenarios, the game has recorded your most common actions in\
    \ the past such as: most common attack command, preferred distance, delay in the\
    \ attack, etc. Based on this information, this “shadow” enemy builds a fighting\
    \ technique that most challenges what you are used to doing. In this way, the\
    \ machine has acquired intelligence on your fighting technique. In both cases,\
    \ the A.I. is limited but one has intelligence and the other simulates intelligence.\n\
    \n## Understanding Machine Learning\n\nMachine Learning is sort of like Real A.I.\
    \ in that it learns based on information that it is given. However, unlike Real\
    \ A.I., Machine Learning uses something known as Backpropagation. Let’s say that\
    \ a “shadow” enemy is made, what happens after it is killed? Normally, a new,\
    \ strong “shadow” enemy is made later on in the game depending on the length of\
    \ this game. That new, strong “shadow” enemy is actually built using the same\
    \ information as the first one. The only difference is that you’ve ultimately\
    \ changed how you play and the base “stats” of the enemy are higher.\n\nIn Machine\
    \ Learning, such a “shadow” enemy will attempt to see where it went wrong in the\
    \ first one. This could be done by looking at the same information but in a different\
    \ light. For instance, if you normally relied on a heavy attack before but switched\
    \ to the fast attack rather than the projectile, it would use projectile attacks\
    \ to force you to play like that. The only difference would be that now it also\
    \ could look at where the standard enemies are defeated, how they are defeated,\
    \ and which patterns of the attack led to more damage. If this sounds a lot like\
    \ “studying your enemy”, that’s because it is.\n\nBackpropagation is the linchpin\
    \ to how Machine Learning works in more complex environments. It takes wrong answers\
    \ it produced and finds a way to optimize for the correct answers. There are Machine\
    \ Learning algorithms out there that do not utilize this technique, and these\
    \ are referred to as Feedforward Neural Networks. This simply means that the data\
    \ is only being fed through the system from input to output with no output becoming\
    \ the new input.\n\nIn fact, if you haven’t already guessed this, the Real A.I.\
    \ is a Feedforward Machine Learning mechanism, but it is not a Neural Network.\
    \ Therefore, while it could technically fit the category, it’s not generally seen\
    \ as a Machine Learning algorithm. A Neural Network is full of nodes that break\
    \ the choosing factors into their most basic components. This allows the network\
    \ to move fast and come to decisions in a far more accurate manner. Therefore,\
    \ unless the Real A.I. is created in a parallel programmed manner, it is not Machine\
    \ Learning in the eyes of the masses.\n\n## Machine Learning in Financial Situations\n\
    \nThere are numerous instances where you might utilize Machine Learning in financial\
    \ situations. For instance, you could use them to come up with a more accurate\
    \ forecast based on monthly accrued financial data. You could also come up with\
    \ significantly better ways to predict stocks. This could even be used to determine\
    \ who is working the best out of all your workers and which workers seem to need\
    \ a little more… scrutiny. This might sound Orwellian, but it’s important to remember\
    \ that this is still seen as mostly A.I.\n\nHowever, the truth of the matter is\
    \ that most of these situations are usually handled with Feedforward Neural Networks.\
    \ This is because FFNN (Feedforward Neural Networks) are far easier to create\
    \ and less mathematically defined. Such a benefit for this is that you might see\
    \ the same information out of a BPNN (Backpropagating Neural Network) because\
    \ the FFNN takes into account new numbers when it runs anew. It is actually much\
    \ more beneficial in many cases to build a BPNN, but it takes more time and resources\
    \ to do so. It is important here that I clarify that resources also includes data\
    \ acquisition.\n\nLet’s look at the worker example to discuss why I clarify this.\
    \ In an FFNN, you might want to know when the worker clocked their breaks, the\
    \ clock-in and clock-out times, and maybe their quantity production level during\
    \ those times. This would be a rather decently sized dataset to work with to determine\
    \ high-productive and low-productive employees. However, what if you wanted to\
    \ try to find the reason why they were low-productive employees?\n\nIn such a\
    \ situation, you may want to know a little bit more on the employees; information\
    \ that’s usually odd to ask about. For instance, if the issue is with some of\
    \ the stock personnel, you might want to know sleeping habits, BMI, and general\
    \ strength. In a Neural Network, the more information you feed it, the more accurate\
    \ the results can be. That doesn’t mean that it will always be that way, some\
    \ data can harm your chances. The employee might be struggling because the material\
    \ is heavier than they are or they don’t move fast as a result of obesity. Then\
    \ as a company, you might employ free access to an in-shop gym or create initiatives\
    \ to get everyone in shape so that no one is singled out, which can be a PR nightmare\
    \ and just morally bankrupt.\n\n## Predictions are what ML Algorithms Do"
