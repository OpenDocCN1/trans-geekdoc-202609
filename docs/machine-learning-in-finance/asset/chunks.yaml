    这是一个完全不同的方程，对吧？这是因为我们正在寻找一个数字，使虚数变成它的相反数。如果我说 `x` 是 1，那么过程将会是这样的。


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    这是官方的共轭公式：


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)   ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    在这个方程中，我们有一个虚数，即 ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)，其中 `b` 是实数，`i` 是虚数。因此，只有当方程看起来如下所示时，我们才能应用共轭：


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    因此，在 ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) 的原始方程中，我们实际上看到的是迭代 `i` 的实减去迭代
    `i` 实数的共轭。该方程的最后部分实际上是为了替换一个被称为核函数（Kernel Function）的东西。现在，这些中最常见的是多项式和高斯径基。


    ### 多项式


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    ### 高斯径基


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    这些核函数允许非线性 SVR，这就是我们在股市中看到的。当我们将其用于此目的时，我们使用核函数来替换这个


    ![](img/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    如果你想深入学习 SVM，这里有一系列很好的网络教程：[`www.svm-tutorial.com/2014/11/svm-understanding-math-part-1/`](https://www.svm-tutorial.com/2014/11/svm-understanding-math-part-1/)。


    # 确定股票的最佳时机


    ## 你不应该完全自动化


    既然我们已经离开了实际上纯数学推理的常规路径，我需要提前告知你，你不应该完全自动化你的交易决策。有些人愿意说服你全自动交易是一个极佳的想法，但事实是这是一个非常糟糕的主意。之所以坏主意，是因为我们作为人类，无疑是有缺陷的。我的意思是，如果你没有训练好它，如果你漏掉了一行代码，或者处理速度上出现任何问题，你可能会做出你这辈子永远不会做出的交易。


    开发全自动机器学习算法的困难在于，你必须能够信任它在大多数时候都会做出正确的决定。人类的问题在于，我们往往太不耐烦了，无法等到它达到那种完美的程度，所以我们几乎在构建好它之后就尝试使用它。这样做的问题是，如果你做错了某些事，在你开启机器学习算法的瞬间，你可能会破产并退出市场。相反，你真的应该有时把它当成个人顾问来使用。具体来说，你应该比它了解更多。


    ## 使用支持向量回归寻找良好时机


