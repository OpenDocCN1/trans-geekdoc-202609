- raw: "Machine learning algorithms are very efficient at what they do. The mathematics\
    \ needed to understand them literally comes from almost all walks of arithmetic\
    \ and other libraries of mathematics. The formula that I introduced before had\
    \ a little bit of linear algebra, a little bit of calculus, and a little bit of\
    \ geometry in it. It was a huge and scary equation for some yet enlightening for\
    \ many others. \n\nI would have to say that if you can get machine learning algorithm\
    \ to work for you, it will be revolutionary to how you handle stocks. In fact,\
    \ if machine-learning proves to be extremely successful, I think that the average\
    \ person will begin to engage themselves more with the stock market. A huge barrier\
    \ with the stock market is simply understanding how it works and it is not easy\
    \ to find resources that are willing to divulge this information to you. I find\
    \ this to be ironic because the more people that are in the stock market, the\
    \ more money that can be made. If the stock market only had one person in it,\
    \ it wouldn't make any money. However, because millions of people around the world\
    \ are playing the stock market game, billions to trillions are traded annually.\n\
    \nIn addition to this, Stock Market trading may actually just become as commonplace\
    \ as a checking or savings account. This would be where a person simply puts a\
    \ certain amount of money in their stocking account and lets the machine make\
    \ the money. This means that everyone who actively works as a stock trader will\
    \ essentially no longer need to spend hours and weeks of their time studying the\
    \ market because we have machines to do that. They will still make money, it's\
    \ just that many won't find why spending so much time handling the math themselves\
    \ would benefit them. \n\n## Final Thoughts\n\nAs I already said, machine learning\
    \ has many benefits to it and it could be a great opportunity. However, machine-learning\
    \ is still very much an experimental type of programming. You shouldn't 100% rely\
    \ on machine learning to make all of your decisions for you because there are\
    \ huge risks to allowing that to happen. It will take time to train a machine\
    \ learning algorithm to trade like you trade, but if you give it enough effort,\
    \ you may find that machine trading is a lot more efficient than trying to trade\
    \ on your own."
  fmt: '

    Machine learning algorithms are very efficient at what they do. The mathematics
    needed to understand them literally comes from almost all walks of arithmetic
    and other libraries of mathematics. The formula that I introduced before had a
    little bit of linear algebra, a little bit of calculus, and a little bit of geometry
    in it. It was a huge and scary equation for some yet enlightening for many others.


    I would have to say that if you can get machine learning algorithm to work for
    you, it will be revolutionary to how you handle stocks. In fact, if machine-learning
    proves to be extremely successful, I think that the average person will begin
    to engage themselves more with the stock market. A huge barrier with the stock
    market is simply understanding how it works and it is not easy to find resources
    that are willing to divulge this information to you. I find this to be ironic
    because the more people that are in the stock market, the more money that can
    be made. If the stock market only had one person in it, it wouldn''t make any
    money. However, because millions of people around the world are playing the stock
    market game, billions to trillions are traded annually.


    In addition to this, Stock Market trading may actually just become as commonplace
    as a checking or savings account. This would be where a person simply puts a certain
    amount of money in their stocking account and lets the machine make the money.
    This means that everyone who actively works as a stock trader will essentially
    no longer need to spend hours and weeks of their time studying the market because
    we have machines to do that. They will still make money, it''s just that many
    won''t find why spending so much time handling the math themselves would benefit
    them.


    ## Final Thoughts


    As I already said, machine learning has many benefits to it and it could be a
    great opportunity. However, machine-learning is still very much an experimental
    type of programming. You shouldn''t 100% rely on machine learning to make all
    of your decisions for you because there are huge risks to allowing that to happen.
    It will take time to train a machine learning algorithm to trade like you trade,
    but if you give it enough effort, you may find that machine trading is a lot more
    efficient than trying to trade on your own.

    '
  trans: '

    机器学习算法在执行其任务时非常高效。理解这些算法所需的数学知识实际上涵盖了算术和其他几乎所有的数学领域。我之前介绍的公式包含了一些线性代数、一些微积分和一些几何学。对于某些人来说，这是一个巨大且令人敬畏的方程，但对许多人来说，它又极具启发性。


    我必须说，如果你能让机器学习算法为你服务，它将对你处理股票的方式产生革命性的影响。事实上，如果机器学习被证明是极其成功的，我认为普通人将开始更多地参与股市。股市的一大巨大障碍仅仅在于理解它的运作方式，而且并不容易找到愿意向你泄露这些信息的资源。我发现这非常讽刺，因为进入股市的人越多，所能赚到的钱就越多。如果股市里只有一个人，它将赚不到一分钱。然而，由于全球有数百万人在玩着股市游戏，每年的交易额达到数十亿甚至数万亿。


    此外，股票交易实际上可能变得像支票账户或储蓄账户一样普通。在这种情况下，一个人只需向其股票账户存入一定金额，让机器来生钱即可。这意味着所有活跃的股票交易员本质上将不再需要花费数小时或数周的时间研究市场，因为我们有机器来做这些。他们仍然会赚钱，只是许多人不会发现自己亲自花费大量时间处理数学计算对他们有什么益处。


    ## 结语


    正如我所说的，机器学习有许多优点，它可能是一个极佳的机遇。然而，机器学习仍然是非常具有实验性的编程类型。你不应该 100% 依赖机器学习来为你做出所有的决策，因为允许这种情况发生会有巨大的风险。训练一个像你一样进行交易的机器学习算法需要时间，但只要你投入足够的努力，你可能会发现机器交易比尝试自己交易要高效得多。

    '
