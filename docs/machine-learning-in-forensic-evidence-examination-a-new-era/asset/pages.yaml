  md: 'In modern forensic investigations, machine learning has become an essential
    tool due to its capacity to unravel complex patterns, handle large amounts of
    data and uncover concealed insights. For instance, imagine a puzzle and each piece
    of the puzzle has specific information that is useful in solving the case. Traditional
    forensic investigation methods include manually examining each piece of the puzzle,
    which could be time-consuming, or some minute detail can be overlooked. However,
    machine learning is the digital puzzle solver that can solve the most complex
    puzzle in less time (Lefèvre 2018; Metcalf et al., 2017).


    Fingerprints are considered one of the dominant biometric traits due to their
    various characteristic traits such as acceptability, high security, reliability
    and low cost (Awad 2012, Jain et al., 1999). Therefore, there are lots of fingerprint
    identification systems, but they lack identification time and accuracy in different
    stages of fingerprint examination such as fingerprint acquisition, fingerprint
    processing and enhancement, fingerprint extraction, fingerprint matching and fingerprint
    classification as described in Figure 7.1 (Egawa et al., 2012, Jain et al., 2011).
    Machine learning is used for fingerprint/pattern examination to overcome these
    problems.


    From identifying minute details in fingerprints or deciphering the link between
    different pieces of evidence, machine learning is also used in DNA forensics to
    decode complex DNA sequences, genetic profiling or identifying markers. Besides
    these, it is used in financial fraud investigation, pattern


