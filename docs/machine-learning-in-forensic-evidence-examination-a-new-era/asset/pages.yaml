  md: '# Machine Learning in Risk Assessment


    ML and DL play a crucial role in risk management in the field of environmental
    assessment and toxicology. As these techniques continue to be increasingly used
    for the detection and identification of chemicals or pollutants, they have also
    become instrumental in analyzing the risks imposed by such substances. Additionally,
    the output of such assessments acts as guidance for decision-makers and can even
    be used to notify authorities about potential environmental emergencies such as
    harmful algal blooms [81, 82] or air pollution episodes [83]. In the case of environmental
    toxicology, these techniques are also helping researchers and environmental agencies
    protect ecosystems and human health [84, 85]. They are particularly valuable for
    handling the complexity and volume of data associated with environmental assessments.
    In a recent study, a deep neural network (DNN) model was developed for the risk
    assessment of a drive-off scenario involved in an oil and gas drilling rig. It
    was an attempt at addressing the challenges of industrial risk assessment through
    machine learning and was able to achieve considerable accuracy [86]. Regarding
    climate change risk assessment, a variety of ML algorithms have been applied.
    Among them, the most commonly used are decision trees, random forests and artificial
    neural networks. These algorithms are usually applied for the assessment of flood
    and landslide risk events. Also, the application of ML to deal with remote sensing
    data is consistent and effective [87].


    # Forensic Toxicology and Analysis of Forensic Exhibits


    Forensic toxicology focuses on the analysis of substances in biological specimens
    to aid criminal investigations for justice delivery. The primary goal of forensic
    toxicologists is to identify and quantify drugs, chemicals or other toxic substances
    in biological samples obtained from individuals involved in legal cases. This
    field plays a crucial role in various legal contexts, including criminal investigations,
    postmortem examinations and workplace- or traffic-related incidents. Forensic
    toxicologists use various sample preparation and analytical techniques (Figure
    6.5), including chromatography, mass spectrometry and immunoassays, to identify
    and quantify effective analysis of the toxicants when eventually the extracts
    are quantified using instrumental methods. Based on the physicochemical characteristics
    of the compounds, there are different extraction techniques. However as non-volatile
    organic compounds are predominantly found in the visceral samples, we will restrict
    ourselves to discussing methods pertaining to the category of non-volatile organic
    compounds.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_124_0.png)


    Figure 6.5 Analytical flow of toxicants.


    # Classical and Modern Methods of Sample Preparation


    +   - **Stas–Otto Method:** A method utilized to extract and identify alkaloids.
    It has the names of the two chemists, Frederik Stas and Carl Otto, who created
    it. This approach is frequently used in forensic and toxicological laboratories
    for the detection and identification of alkaloids in diverse samples. It has historically
    been used for the examination of alkaloids from plant materials, such as medicinal
    herbs [88].

    +   - **Solvent Extraction:** It is based on the distribution of alkaloid bases
    between acid or aqueous solution and immiscible organic solvent [89]. Distribution
    of a solute between two immiscible liquid phases in contact with each other, that
    is, two-phase distribution of a solute. The common solvents used for solvent extraction
    are n-hexane, toluene and acetonitrile.


    Solvent extraction is one of the most common methods used in forensic toxicology
    related to biological matrices [16]. Drugs and metabolites are separated between
    the two phases based on their polarity. Buffering or pH adjustment of the specimen
    allows for selectivity in extraction techniques for acidic or basic drugs.


    +   - **Solid Phase Extraction:** Solid phase extraction (SPE) was introduced
    as an alternative to solvent extraction in the mid-1970s. It was used for separation,
    preconcentration and solvent exchange of solutes for'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'solution [90]. This technique enables extraction, clean up and concentration
    of analytes before their quantification. SPE uses an adsorbent contained in a
    cartridge device or on a disk to adsorb selective species from the solution [91].
    Different separation chemistries can be used with SPE techniques to extract various
    target analytes such as normal phase, reverse phase and ion exchange (both anion
    and cation) modalities [92]. Commercial cartridges used for SPE have 1–10 ml capacities
    and are discarded after use [93]. Analytes concentration can be achieved better
    with SPE than solvent–solvent extraction and usage of an SPE column provides a
    quicker and safer alternative [16]. SPE is reliable, cost-effective and environmentally
    friendly. SPE can be automated desirable in high throughput laboratories. Low
    solvent consumption can be achieved by miniaturization of SPE columns to mini-columns/cartridges
    [92].


    +   - **Solid Phase Microextraction:** SPME, developed in 1990, is defined as
    a miniature version and equilibrium technique where the extraction phase is small
    in comparison to the sample volume [94]. It is an extraction method where analytes
    are directly adsorbed from the sample onto a fused silica fibre that has been
    coated with the suitable stationary phase. This method is used to extract organic
    chemicals from aqueous samples [16]. SPME can be used for volatile substances,
    drugs in biological specimens, etc. It uses a relatively smaller sorptive surface
    area and the sorptive fibre adsorbs analytes from gases, liquid or semi-solid
    samples upon exposure. Fibre coating is selected depending on the properties of
    the analytes. The commonly used are polydimethylsiloxane (PDMS), polyacrylate
    (PA), carboxen/ polydimethylsiloxane (CAR–PDMS), etc.


    By controlling the thickness and polarity of the fibre coating, having consistent
    sampling time and other parameters, SPME ensures high throughput and quantifiable
    results even at low analyte concentrations. SPME is solvent-free, easy to automate
    and its fibres are reusable and inexpensive.


    +   - **Accelerated Solvent Extraction (ASE):** ASE is an extraction technique
    used for treating organic compounds from solids as well as semi-solid samples
    using liquid solvents. Liquid solvents are organic solvents used at high pressures
    and temperatures above their boiling points [95]. ASE requires less time and fewer
    solvents and gives better analyte recovery than traditional methods of extraction.
    The entire extraction process is automated and conducted in minutes for fast and
    easy extraction of multiple samples with very little solvent consumption.'
