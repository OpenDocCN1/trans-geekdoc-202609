  md: '# Table 8.1 Models of Digital Forensics


    | Models Phases | DFRWS | ADFM | IDIP | EEDIP |

    |---|---|---|---|---|

    | Acquisition | Collection and storage | Collection and storage | Collection,
    storage, deployment, documentation and image acquisition | Crime scene security,
