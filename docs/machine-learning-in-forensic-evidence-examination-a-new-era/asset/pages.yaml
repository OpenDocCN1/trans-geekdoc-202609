  md: '# eXtreme Gradient Boosting (Xgboost)


    This machine-learning algorithm is an extension of gradient boosting in decision
    trees. Weights are associated to all the independent variables which are then
    assigned to the decision trees. The weight of the variables which are predicted
    incorrectly by the decision tree is increased and fed to the next decision tree.
    Hence, the total system now works together to provide a stronger and more accurate
    estimation. Age estimation among juveniles on the basis of mineralized dental
    morphology is an important task in forensic investigations (Figure 10.4). Shan
    et al. found XGBoost as the best predictive model for age estimation using the
    Demirjian method performed on 1477 panoramic radiographs of the South China population
    aged between 2–18 years [32]. SexEst is a free web application based on the extreme
    gradient boosting mathematical model designed for skeletal sex estimation from
    cranial and postcranial measurements. The models were optimized and gave a prediction
    accuracy of 80.8–89.5% for postcranial variables and 81.2–87.7% for cranial variables
    [59]. In a study conducted to predict age from permanent teeth in the Sri Lankan
    population, measurements from 3321 subjects were involved. The comparative results
    among machine-learning algorithms proved the extreme gradient boosting model (XGBoost)
    to be the best fit with a highest accuracy of 88% [60].


    # Decision Trees in Forensic Anthropology


    Decision trees are a supervised learning technique used in machine learning. It
    basically provides a graphical representation of all the possible solutions to
    any problem. It contains two nodes namely a decision node and a leaf node. The
    decision node is responsible for all the decision-making and has numerous branches
    whereas the leaf node depicts the outcome of the decision. These decision trees
    are used for categorizing data and obtaining values based upon previous outcomes
    (Figure 10.4).


    # Advantages of Machine Learning


    The main aim of forensic science is to solve a crime and bring faster justice
    to the victim. But, with the ever-growing number of crimes and varied ‘modus operandi’,
    the impending cases often hold back the justice delivery system. Machine learning
    with its quicker approach to identifying anatomical landmarks can help in reducing
    the count of pending cases. Also, the process'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'of analysing the skeletal evidence is a tiresome task, which can be solved
    easily if the ML algorithm is trained once. Since this field requires multi-tasking
    to ensure thorough analysis and reporting, neural networks can become an important
    tool while performing various identifications simultaneously. Manual estimation
    of the anthropological remains by professional knowledge and expertise can sometimes
    cause errors in minute calculations. These can be avoided using artificial intelligence.
    ML algorithms can identify trends and patterns which is useful while analysing
    large volumes of data. Also, with continuous development, these algorithms can
    function up to an extent where they no longer need human interference.


    # Best Performing Machine-Learning Method


    The best AI method for personal identification problems related to skeletal remains
    may depend on various aspects including the quality and size of the available
    dataset, the specific identification attribute (age/sex/stature/racial affiliation),
    along with the experience and expertise of the forensic anthropologist [6]. Further,
    a combination of multiple ML techniques or employing hybrid approaches may yield
    better results by using the strengths of different algorithms.


    There are several ML methods but each method is suitable for a specific biological
    attribute of skeletal remains. Some methods are good for sex prediction, some
    are good for ancestry estimation and some are good for age estimation and so on.
    Nikita et al. investigated the classification accuracy of statistical methods
    and machine learning algorithms including BLR, multinomial and penalised multinomial
    logistic regression (MLR, pMLR), LDA, NBC, DT, RF, ANN, SVM with linear, polynomial
    or radial kernels, MARS and XGBoost in the context of skeletal sex and ancestry
    estimation LDA and SVM perform best respectively, with high prediction accuracy
    and minimal bias in most tests (Figure 10.5) [6]. On the other hand, regression
    analysis and random forest suited well for stature estimation and for age estimation.


    # Limitations of Machine Learning in Forensic Anthropology


    Despite becoming an indispensable tool in the field of forensic sciences, there
    are some specific shortcomings of machine learning. For the algorithm to become
    user-friendly and adjust to the training data sets it takes lots of trials. Therefore,
    it requires time and expenses to maintain such infrastructure. ML has immense
    promise in many domains, including forensic anthropology, but it has limits.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   - **Limited Data Availability:** Forensic anthropology works with unique
    and complicated situations, making vast diverse datasets difficult to gather and
    the ML algorithms need plenty of data to learn and predict. If the data collected
    is incorrect, the results generated will be insignificant. Further manual or automated
    data acquisition is time-consuming and labour-intensive. Thus the scarcity of
    anthropological datasets limits the performance and generalization of the ML models
    for the biological attributes [61].

    +   - **Lack of Interpretability:** Many ML algorithms, including deep-learning
    models, are ‘black boxes’ because they lack transparency and interpretability.
    In forensic anthropology, where expert views are respected, it might be difficult
    to explain how the algorithm produced a choice or prediction [61].

    +   - **Bias and representativeness:** ML models depend on training data quality
    and representativeness. ML models may inherit and increase training data biases.
    This may impact forensic anthropological investigations by causing erroneous predictions
    or findings [5, 61]

    +   - **Domain-Specific Problems:** In forensic settings, it is quite common to
    receive incomplete or damaged skeletal remains, which presents distinct obstacles.
    Such skeletal remains may restrict the features ML systems may use to derive meaningful
    patterns. When dealing with deteriorated or fragmentary remains, ML models may
    have trouble determining the age, sex, stature or ancestry estimation [5, 61].

    +   - **Expertise and Human Involvement:** Machine-learning algorithms form a
    part of artificial intelligence which is yet again a simulation of human intelligence.
    Therefore, result interpretation and accuracy of results can only be achieved
    with human interference. Also, any error in the data or algorithm can ultimately
    lead to a wrong output. Forensic anthropology demands specialized knowledge and
    expertise. ML can automate processes and provide insights, but it cannot replace
    forensic anthropologists’ experience and judgement [50].

    +   - **Ethical Issues:** AI in forensic anthropology raises ethical issues as
    well. Researchers and practitioners must address the ethical and legal consequences
    of their work since any technology might be misused or have unforeseen repercussions
    in personal identification in different forensic situations. This involves responsibly
    obtaining and using data to train AI algorithms and assessing how AI-driven analysis
    may affect forensic investigators and their communities [50, 62].


    Despite these drawbacks, ML may be useful in forensic anthropology. It might help
    forensic anthropologists analyze vast data sets, find trends, and'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'make educated conclusions. It should be utilized judiciously, with human competence,
    and with an understanding of its limits and biases. ML in forensic anthropology
    creates ethical difficulties. The findings from forensic anthropological examinations
    are admitted in the court as supporting evidence and hence ensure a fair trial
    and speedy delivery of justice.


    # Future Aspects of Machine Learning

    in Forensic Anthropology


    Machine learning has widespread applications in the field of forensic anthropology
    especially pertaining to personal identification. The varied use of different
    supervised and unsupervised learning algorithms holds a promising future in anthropological
    examinations. These algorithms have enabled the analysis of high volumes of skeletal
    data with greater precision, accuracy and speed. These algorithms may also help
    in creating biological profiling along with facial reconstruction, time since
    death estimation, trauma and pathology identification [5]. Detailed analysis of
    the skeletal remains especially about population-specific morphometric variations
    can be easily accomplished using machine learning algorithms. It is imperative
    to incorporate an ethical approach while dealing with such confidential data which
    may be compromised by using these algorithms entirely. Hence, human intervention
    in the collection procedures and interpretation of data may be acknowledged in
    the usage of machine learning algorithms in forensic anthropological examinations.


