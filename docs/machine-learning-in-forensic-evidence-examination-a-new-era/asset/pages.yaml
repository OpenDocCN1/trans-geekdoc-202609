  md: '# A Machine Learning Approach for the Digital Forensics


    ANKIT SRIVASTAV, UJAALA JAIN AND TANURUP DAS


    # Introduction


    The digital forensic research workshop (DFRWS) states digital forensics is:


    > The use of scientifically derived and proven methods toward the preservation,
    collection, validation, identification, analysis, interpretation, documentation
    and presentation of digital evidence derived from digital sources for the purpose
    of facilitating or furthering the reconstruction of events found to be criminal,
    or helping to anticipate unauthorized actions shown to be disruptive to planned
    operations [1, 2].


    In simple terms, digital forensics directly deals with digital information for
    legal proceedings. It includes the use of scientific technologies and methods
    to process the data created by multiple digital objects [3]. It deals with digital
    devices and data in the context of cybercrimes or other digital investigations
    [4].


    The National Institute of Standards and Technology (NIST) has designed a four-step
    procedure to be used in the digital forensics investigation process as mention
    in Figure 8.1. However, they can be performed in a flexible manner depending upon
    the case complexity [3].


    # Forensic Significance


    Digital forensics investigation recovers, collects and analyses data, helping
    investigators to identify and prevent any unauthorized access to the gathered
    information [3]. It is significant in not just criminal but civil litigation as
    well. It extracts the data for the determination of the root cause of system failures
    or any breach of security. It is useful in achieving multiple goals, some of which
    are mentioned below [5]:'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_156_0.png)


    Figure 8.1 Phases of digital investigation.


    +   - **Imaging:** It is the process of making a bit-by-bit copy of a device such
    as a USB drive, hard drive or CD-ROM to preserve the integrity of the original
    device. This copy is used by the examiner to analyze and reconstruct the recovered,
    deleted and damaged data.

    +   - **Data Recovery:** It is the process of getting back data that was erased
    by accident or lost as a result of hardware malfunction.

    +   - **Timeline Analysis:** This creates a chronological order for the events
    related to an instance to govern what actions were taken at what time and by which
    parties.

    +   - **Network Forensics:** It identifies the network traffic and connections
    including its source and destination of data. It is helpful for the identification
    of any malicious or unauthorized activities along with the reconstruction process
    for the network activities.

    +   - **Memory Analysis:** It is the examination of a computer''s volatile memory
    for the recognition of open network connections, running processes, system malware
    and other system information.

    +   - **Steganography Detection:** This involves the identification of hidden
    messages or data embedded in different files. It detects the relevant data from
    the hidden communications or data for investigation purposes.

    +   - **Multimedia Forensics:** It involves the identification and authentication
    of the audio, video and images as evidence using specific tools.


    # Problems Encountered


    Digital forensics has become one of the biggest critical areas of security with
    the growing threat of cyber attacks [3]. There are substantial challenges faced
    during the collection and examination of digital evidence due to the increased
    volume and diversity of data along with the complex nature of'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'the hardware and software platforms that use encryption [3, 6]. There is a
    lack of updated knowledge about the recent digital forensic tools threatening
    the development of the industry along with a question on data accuracy. Issues
    relating to the correlation between the data from different sources and consistency
    in the results could also affect the efficiency of digital investigations [3].
    The investigation procedure requires a large amount of human intervention, resulting
    in slow investigations in comparison to the pace of digital crimes [2, 3]. Human
    powers along with other existing resources are still unable to solely investigate
    digital crimes [2]. Another obstacle faced is due to the increasing amount of
    file formats and operating systems which prevent the International Journal of
    Organisation and Collective Intelligence from developing standardized digital
    forensic tools and methods. Therefore, a lack of standardization in the process,
    formatting and storage has become a significant issue [3].


    The availability of software tools used for any manipulation of digital media
    or conduction of a crime has again raised the difficulty of the detection and
    identification of digital evidence. For example, editing software along with mobile
    photography devices interfere in the detection and identification of computer-generated
    images (CGI), manipulated and recaptured images including splicing, double-compression,
    copy-move, removal, sharpening, resampling, resizing, filter applications and
    many more [6].


    # Machine-Learning Approach for the Examination of Digital Evidence


    Machine learning has revolutionized digital forensic investigations with the introduction
    of new tools. It is a branch of artificial intelligence using algorithms to detect
    the patterns and relationships between data. The algorithms are designed in such
    a way that they automatically improve their work while performing a specific task.
    They are trained to work on a set of labelled data, where the labels describe
    the desired output for the input data. The simplest example is a spam folder in
    emails, where the algorithms label the emails as spam or not spam [4]. This technology
    is useful for security and fraud detection [3]. There is a certain procedure for
    developing machine-learning models which can be summed up in six steps as shown
    in Figure 8.2:


    +   - **Selection of Machine Learning Approach:** There must be a clear understanding
    of what needs to be accomplished and the selection of algorithm must be based
    on that.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_158_0.png)


    Figure 8.2 Development of ML models.


    +   - **Data Collection:** Data available in different forms such as text files,
    spreadsheets or even on paper needs to be collected in electronic form [7].

    +   - **Data Input:** The accuracy and performance of the model increase with
    the increase in the amount of data.

    +   - **Feature Extraction:** It studies the behaviour of the customer and the
    service provider to decide their intentions. It includes features such as a customer''s
    identity, location, time, network, mode of payment, etc.

    +   - **Train Algorithms:** A set of rules based on which actions, such as acceptance
    (legitimate) or rejection (fraudulent), are taken is known as an algorithm. Data
    is input for the model to work efficiently [1]. This is an important step as the
    model must be trained with relevant data to prevent unbiased or false results
    [4].

    +   - **Model Building:** The model after training is all set to be implemented
    with greater accuracy. However, the models have to be constantly updated with
    the new implementation of new plans by the criminals [1].


    Machine-learning approaches including text analysis, optical recognition, image
    processing, voice recognition and character recognition have become the state
    of the art [6]. The concept covers applications such as speech recognition, fraud
    detection systems, automatic text classification, object recognition and many
    more [8]. These techniques gather information from huge volumes of data by matching
    conceptual models which enables data mining, hunting anomalies, identification
    of patterns and knowledge discovery in digital forensic investigation [6]. With
    the help of various tools and methods, experts can obtain important data and proof
    that will strengthen their investigations and shield their organisations from
    any mishaps in the future [5]. The tools which can be used in digital forensics
    include:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - **Software Tools:** Software such as FTK, EnCase and X-ways Forensics
    are designed for the analysis of electronic data.

    +   - **Hardware Devices:** These comprise items such as forensic duplicators
    and write blockers, which create precise duplicates of electronic devices and
    stop data from being altered during the gathering process.

    +   - **Cloud Forensics:** Examining cloud data storage, infrastructure and data
    which was moved to or from the cloud are all part of this process.

    +   - **Tools for Forensic Imaging:** These programs create a bit-by-bit copy
    of the whole storage device for the prevention of data loss or any alteration
    while the inquiry is underway. Tools for forensic imaging counts in FTK Imager,
    dd and EnCase [9].

    +   - **Data Recovery Tools:** They seek information that is still on the storage
    device but has been removed from the file system. File carving techniques are
    used by data recovery tools to locate and retrieve erased data. For example, EaseUS,
    Recuva and PhotoRec Data Recovery.

    +   - **Tools for File Analysis:** Recovery of file, identification and file identification
    with modified timestamps or other metadata can all be accomplished with the use
    of file analysis tools. Tools for file analysis include Forensic Explorer, X-ways
    and Autopsy.

    +   - **Tools for Network Forensics:** These tools are capable of interception
    and examination of network packets in order to determine the kind, timing and
    source and destination of data. Tools for network forensics include tcpdump, NetworkMiner
    and Wireshark [10].

    +   - **Memory Analysis Tools:** Tools for memory analysis can be used to find
    malware, hidden processes and several potential security risks on the system.
    It includes Redline, Rekall and Volatility.

    +   - **Tools for Steganography Detection:** Tools for detecting steganography
    or concealed data can be used to find communications or secret data that could
    be important for an inquiry including StegSolve, StegDetect and StegHide.

    +   - **Tools for Keyword Searching:** These tools allow you to look for particular
    words or phrases in a lot of data. They include FileLocator Pro, dtSearch and
    GRAP.


    In digital forensics, the umbrella of machine learning covers deep-learning models
    which are useful in multiple domains such as adversarial image forensics, computer
    forensics, image temper detection and many more [6]. Digital forensics has numerous
    investigation models, such as the abstract digital forensics model (ADFM), digital
    forensics research workshops model'
