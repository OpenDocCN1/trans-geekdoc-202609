- pgno: 105
  md: 'construct an accurate postmortem interval (PMI) prediction model utilizing
    the microbial sequencing data from internal organs in mouse remains. Regression
    models such as random forest (RF) and support vector (SV) helped in identifying
    potential microbial biomarkers for PMI estimation [19]. Alternatively, varied
    multivariate approaches such as generalized additive models (GAMs) and support
    vector machines (SVMs) allow various indicator components to be included in the
    models, hence making the PMI prediction more accurate [20]. Other machine-learning
    tools such as linear discriminant analysis (LDA) and logistic regression (LR)
    have also been widely used in forensic science for PMI estimation [21]. These
    approaches to machine learning utilize the positive aspects of multiple base classifiers
    and the prediction outcomes, integrating them to deliver accurate predictions.
    This further increases the diversity and complexity of the models while simultaneously
    enhancing prediction accuracy and robustness.


    # Sex Estimation


    Ortega et al. [22] had earlier reported the efficacy of various machine-learning
    (ML) tools in accordance with an expert’s visual examination to determine the
    gender of baby skeletons based on ilium images. In another study, convolutional
    neural network (CNN) models were developed for sex estimation based on pelvic
    regions of the body [23]. Based on photo-anthropometric indexes, specific sex
    and age estimations were earlier reported, wherein an artificial neural network
    enabled the classification of individuals from a Brazilian population [24]. Venema
    Javier et al. [25] analyzed different learning algorithms for male and female
    estimation via humerus bone images. The results obtained from this study attained
    the highest level of accuracy at 91.03% when compared to the ones obtained by
    a human expert with 83.33%.


    # Wildlife Forensics


    In wildlife forensics, machine learning plays a pivotal role as it utilizes advanced
    computational techniques to assess and understand data related to crimes involving
    wildlife. Investigating illicit activities such as poaching, trafficking and the
    illegal trade in endangered species is the primary objective of wildlife forensics.
    Large datasets, such as involving acoustic recordings or camera traps, can be
    processed over time by these algorithms to track migration patterns, monitor changes
    in wildlife distribution and estimate wildlife population respectively. An automated
    approach was developed for species identification on massive matrix-assisted laser
    desorption/ionization (MALDI) datasets employing machine learning with minimal
    human input.'
