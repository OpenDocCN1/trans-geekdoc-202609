    into soil evidence analysis has accompanied a new era of forensic science. The
    following are the contributions of machine learning to the field of forensic science:


    # Pattern Recognition:


    Due to their capability of identifying complex patterns in the data, ML algorithms
    are useful in the analysis of large datasets. This ability proves highly useful
    in the context of soil evidence analysis. Soils collected from different sites
    may appear to be similar when tested for physical properties but they are different.
    This generated data are then analysed by different ML models which on the basis
    of feature extraction can differentiate between particle size, distribution, mineral
    content and other organic matter. For example, the presence of certain minerals
    and ores can be helpful in identifying the source of a particular region.


    # Source Attribution:


    Establishing the origin of a soil sample is one of the primary goals of forensic
    soil analysis. ML greatly improves this process. Based on the database of soil
    profiles, the ML algorithms can carry out the search for compositions similar
    to the sample. Such a comparison neglects the time taken by a manual approach
    and is data-driven. The end-product therefore has a higher degree of accuracy
    in relating the collected soil sample to its probable source. When other approaches
    can be inconclusive, ML can give a more clear-cut answer, which can assist in
    linking evidence to places.


