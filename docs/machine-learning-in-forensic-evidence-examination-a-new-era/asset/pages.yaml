  md: 'of data to work—and a lot of human judgment to interpret their outputs—for
    forensic evidence to follow the rules of due process, which is a basic requirement
    for anything called ‘forensics’ to occur.


    # Explainable AI and Interpretable Machine-Learning Models


    The forensic importance of XAI (explainable artificial intelligence) and the machine-learning
    models that produce interpretable outcomes lies in their ability to facilitate
    understanding and foster trust [20]. Forensic scientists must know the legal and
    ethical particulars of machine-generated evidence as they reason and make decisions
    about clear and present dangers to society. If an AI algorithm is deciding which
    facial recognition match is good for legal admissibility, we want to be sure the
    algorithm is producing understandable outcomes—not just for the algorithm’s developers
    but for all of us. As this chapter demonstrates, some machine-learning models
    are better at this than others.


