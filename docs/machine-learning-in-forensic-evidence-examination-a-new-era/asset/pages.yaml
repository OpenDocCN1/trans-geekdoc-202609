    to evaluate DNA methylation patterns for age estimation [12].


    # Automated Body Fluid Identification


    Identification of various body fluids during any forensic investigation is crucial
    to know about their origin and comprehend the timeline of events at the crime
    scene. Machine-learning algorithms aid in categorizing different body fluids based
    on their specific chemical and biomolecular characteristics. Researchers have
    used various ML models to identify specific body fluids. Specific microRNA (miRNA)
    biomarkers were reported to identify menstrual blood using logistic regression
    models [13]. Multi-class random classifier probabilistic models were also developed
    to predict the source of single or mixed body fluids respectively [14]. A novel
    model based on a random forest algorithm was developed to assess the type and
    source of different body fluids [15].


    # Human Identification


    Over the years, human identification during any forensic investigation is achieved
    by determining the genetic profiles, utilizing the autosomal short tandem repeats
    (STRs) and mitochondrial DNA (mtDNA). However, owing to the complexity and large
    datasets, forensic scientists have considered machine-learning algorithms as a
    novel approach to predicting genetic relatedness [16]. In another study, three
    machine learning classifiers—random forest (RF), support vector machine (SVM)
    and artificial neural network (ANN) were used to predict externally visible characteristics
    (EVCs) obtained from DNA sources [17]. Using a customized convolutional neural
    network (CNN), the study created an automatic human identification system (DENT-net)
    that can accurately identify individuals from panoramic dental radiographs (PDRs)
    [18].


    # Postmortem Interval (PMI) Estimation


    During forensic investigations, the estimation of time since death, that is, postmortem
    interval (PMI) is crucial yet challenging. Researchers aimed to'
  merge: -1
