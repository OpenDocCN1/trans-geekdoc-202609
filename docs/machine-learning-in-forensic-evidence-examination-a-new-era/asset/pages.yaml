    the relationships between these variables and group membership, DFA can determine
    which variables contribute most significantly to the discrimination between groups.
    DFA finds its implications in studying sexual differences, population variations,
    secular changes, patterns of migrations and human evolution [18]. DFA provides
    the understanding of complex interrelationships among genetic and epigenetic factors
    that cause population-specific variations (Figure 10.2) [1].


    # Support Vector Machines (SVMs)


    SVMs stand out as one of the most widely used and potent supervised-learning algorithms,
    capable of handling both classification and regression tasks related to sex, age
    and ancestry estimation. SVMs work well with small to medium-sized datasets and
    can handle high-dimensional feature spaces. SVMs operate on the principle of identifying
    an optimal hyperplane that maximizes the separation between data points belonging
    to distinct categories. The hyperplane is defined by support vectors, that is,
    a subset of training'
