  md: '+   - **Connection (Synapses):** Neurons are connected through weighted connections
    called synapses (Walczak 2019).

    +   - **Propagation:** This is how input data is passed through the network. There
    are two types of propagation methods: (i) feed forward propagation method: in
    this method, input data is passed through the network to generate prediction or
    output and (ii) back propagation method: this method follows the feed forward
    propagation method. This method adjusts the network’s connection weight to minimize
    the error between predicted and target values (Krogh 2008).

    +   - **Training Data:** This is the supervised machine-learning algorithm; training
    data consists of input features and corresponding target values.


    # 1. Support Vector Machine


    Support vector machine (SVM) is one of the most powerful machine-learning algorithms
    for linear and non-linear classification, regression, and outlier detection. In
    linear classification, the decision boundary that separates different classes
    is a single line or hyperplane, whereas non-linear classification involves more
    complex decision boundaries that a single straight line or hyperplane can not
    define. SVM utilizes the ‘Kernel trick’ technology to excel in non-linear classification.
    The classes might have intricate and curved feature space. Moreover, the SVM algorithm
    can be extended to classify data into more than two groups with the help of a
    technique known as ‘multi-class-classification’ in combination with various methods
    such as one-versus-all and one-versus-one (Suthaharan et al., 2016; Pisner et
    al., 2020).


    # *Components*


    +   - **Data Points and Features:** It refers to a specific instance or example
    from the data set that you are using to train, validate or test the SVM model.
    Each data point is linked with a set of features that describes the characteristics
    (Guenther and Schonlau, 2016).

    +   - **Hyperplane:** Hyperplane is the plane or line that separates different
    classes in the feature space (feature space is the collection of all feature vectors
    from space). In 2D cases, the hyperplane is the line, and in higher dimensions,
    it is the hyperplane. The algorithm aims to find the hyperplane that maximizes
    the margin (Pisner and Schnyer, 2020).

    +   - **Support Vector:** Support vectors are the closest data points to the hyperplane.
    These data points determine the optimal position of the hyperplane (Meyer and
    Wien, 2015).'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   - **Margin:** Distance between the hyperplane and nearest support vector.
    The higher the margin, the better the generalization of the new data will be.

    +   - **Kernel Function:** This technology handles the non-linear relationship
    between features (Pisner Schnyer, 2020).


    The SVM algorithm is used in fingerprints to classify fingerprint images in different
    categories such as arches, loops, whorl, etc. (Awad, 2012). Fingerprint images
    were classified into one of five categories: whorl, right loop, left loop, arch
    and tented arch, using multi-class classification (Yao et al., 2001). The SVM
    algorithm was designed to classify the fingerprint images in different categories
    like whorl, right loop, left loop, arch and tented arch with 92.5% accuracy (Alias
    and Radzi, 2016). The SVM algorithm was designed and trained to recognize the
    finger code. Moreover, the research compares two methods that are SVM and RBF.
    And, concluded that SVM has better recognition rates (Elmir et al., 2012). The
    fingerprint classification method based on the twin support vector machine was
    studied in which the Gabor filter is used to extract texture features and the
    experimental results show that applying the twin support vector machine algorithm
    gives good classification results (Ding et al., 2020). SVM classifier was used
    to separate fingerprint images into one of the three quality classes: good, medium,
    and poor (Liu et al., 2008).


    # Convolutional Neural Network


    It is the extended version of the artificial neural network algorithm. This algorithm
    is mainly used to extract the features from grid-like matrix datasets. Convolutional
    neural networks have revolutionized computer tasks by automatically learning hierarchical
    features from input data, making them particularly effective in tasks such as
    image classification, object detection, etc. A convolutional neural network (CNN)
    works on the filters, and filters keep sliding on the image and capture the desired
    features (O’Shea and Nash, 2015).


    *Architecture/Workings (Albawi et al., 2017; O’Shea and Nash, 2015)*


    +   - **Input Layer:** The input layer to CNN is typically an image, represented
    as a grid of pixel values.

    +   - **Convolutional Layer:** These are the core building blocks of CNN. They
    apply a set of learnable filters to input images. Each filter is a small, square
    matrix that slides across the input image in horizontal and vertical directions.
    Multiple filters are applied in parallel to'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'create various feature maps, capturing different aspects of the input layer.


    +   - **Pooling Layer:** This layer reduces the spatial dimensions of the feature
    maps while retaining their most important information.

    +   - **Flattening:** After several convolutional and pooling layers, the resulting
    maps are flattened into a dimensional vector.


    This step connects the CNN to a fully connected layer.


    +   - **Fully Connected Layer:** This layer consists of multiple neurons (nodes)
    that are fully connected to neurons in the previous layer and tell about the global
    pattern and relationship obtained from convolutional and pooling layers.

    +   - **Output Layer:** This layer provides the final prediction and classification.

    +   - **Training:** CNNs are trained using labelled data and an optimization algorithm.
    The network parameters, including filter weights and biases, are adjusted during
    training to minimize a loss function. The loss function measures the difference
    between predicted and actual values.

    +   - **Backpropagation:** Errors are propagated backwards through the network
    during training, and gradients are computed for each layer. And errors are updated.

    +   - **Analyzes:** After training the data, CNN can be used to make predictions
    on new and unseen data.


    In digital fingerprint classification, the most significant challenge faced by
    researchers is the low-quality images. A model consisting of several preprocessing
    stages such as edge enhancement, data resizing and data augmentation was made
    to overcome this challenge. Initially, poor quality original raw fingerprint images
    were processed using previt and lapace filters to enhance the edge and, in this
    research, the classification accuracy varied from 67.6% to 98.7% for the validation
    set and from 70.2% to 75.6% for the test set (Dincă Lăzărescu et al., 2022). Moreover,
    a CNN autoencoder is used to reconstruct the fingerprint images, where autoencoder
    is the technique that can replicate the data into images. CNN autoencoder resulted
    in a more than 90% accuracy rate for fingerprint identification in different databases
    (Saponara et al., 2021). Damaged fingerprints can be recognized using the CNN
    algorithm in MATLAB® software. A comparison was made between the traditional point-matching
    recognition method, the traditional CNN recognition method and the improved CNN
    recognition method. It was found that CNN algorithms had higher recognition rates
    and lower false acceptance rates than traditional'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'point matching. However, the enhanced CNN recognition method shows the best
    result, with the highest recognition and lowest false acceptance rates (Li, 2021).
    The advanced CNN consists of 15 layers and is classified into two stages. The
    first stage is the preparation stage, which includes fingerprint collection, augmentation
    and preprocessing. While the second stage deals with feature extraction and matching.
    It was found that this model gives 100% accurate results for both training and
    validating datasets (Althabhawee and Alwawi, 2022).


    # Generative Adversarial Network


    A generative adversarial network is a deep-learning algorithm that consists of
    two neural networks competing against each other in a zero-sum framework. The
    two neural networks are the generator and discriminator, which are trained simultaneously
    through a competitive process. The generator is the neural network that takes
    random noise as input and attempts to generate data samples that resemble real
    data. Then, a random noise vector is passed through multiple layers of the neural
    network; then, the network gradually transforms the noise into data that becomes
    indistinguishable from real data. Therefore, the output of the generator is an
    image sample that resembles the real image. At the same time, the discriminator
    is the neural network that serves as the binary classifier that takes the input
    data and tries to distinguish between real and fake data generated by the generator.
    And it outputs the result in terms of probability, indicating how likely the input
    data is to be real (close to 1) or fake (close to 0) (Creswell et al., 2018; Wang
    et al., 2017).


    The generative adversarial network (GAN) algorithm enhances the quality of low-quality
    fingerprint images. Super-resolution GAN is trained to enhance the spatial resolution
    of fingerprint images and generate a high-resolution version of the same fingerprint
    image that can provide more detailed fingerprint feature extraction; therefore,
    for this, the Fdeblur-GAN model was made for deblurring fingerprint images using
    conditional GAN (Joshi et al., 2021). Moreover, a powerful progressive GAN mode,
    consisting of two stages, progressive offline training and interactive online
    testing, makes the model focus on minutiae and the orientation field and achieve
    better recognition accuracy (Huang et al., 2020). A GAN algorithm with certain
    modifications forces the model to generate three additional maps to the ridge
    maps to ensure that the generation process must consider orientation and frequency
    information and to force the generator to reserve ID information during the reconstruction
    process. This modified model was applied and tested on different databases, and
    it was observed that a rank 10 accuracy of 88.02% was achieved on the IIIT-Delhi
    latent fingerprint database and rank 50 accuracy of 70.89% on the IIIT-Delhi MOLF
    database (Dabouei et al., 2018).'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# K-Means Clustering Method


    It is the popular unsupervised machine-learning algorithm used for partitioning
    a dataset into distinct groups or clusters based on the similarities of data points.
    ‘k’ represents the pre-defined value, that is, the number of groups (Sinaga and
    Yang, 2020).


    # Workings


    +   - Decide the number of clusters you want to make.

    +   - Randomly select centroid. The centroid represents data points that represent
    the average position of all data points within the clusters.

    +   - Each data point is assigned to the nearest cluster centroid based on the
    distance metric.

    +   - Now, centroids are re-assigned within the cluster, and new data points are
    added based on the distance.

    +   - The same steps are repeated until a stopping criterion is met (Sinaga Yang,
    2020; Hossain et al., 2019).


    # Components


    +   - **Data Points:** The individual items or observations you want to cluster.

    +   - **Number of Clusters (k):** This is the pre-defined number of clusters you
    want to make in the data set (Pham et al., 2005).

    +   - **Cluster Centroid:** These are representative points at the centre of each
    cluster.

    +   - **Distance Metric:** It measures the distance between two data points.


    In the field of fingerprint examination, k-means algorithms are used for different
    purposes than in the research (Wang et al., 2002); datasets of fingerprints are
    classified into different classes/clusters such as arch, left loop, right loop
    and whorl as depicted in Figure 7.2. A hierarchical k-means clustering algorithm
    has been utilized to classify fingerprint images into four quality classes: good,
    dry, normal and wet (Munir et al., 2012). Moreover, k-means clustering is also
    used in image segmentation (Mehidi et al., 2019, Cherrat et al., 2019).


    # Decision Tree


    The decision tree is a type of supervised-learning algorithm that is used for
    problems majorly related to classification and regression. This algorithm is widely
    used because it is easy to understand and interpret. Moreover, it can be used
    for categorical and continuous data (Navada et al., 2011).'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_142_0.png)


    Figure 7.2 All the data points are mixed; after applying the k-means algorithm,
    data points are partitioned into distinct groups or clusters based on similarities
    between data points. For example, each colour represents a fingerprint pattern
    class. Before applying the k-means algorithm, all the fingerprint patterns are
    mixed. However, after the application of the algorithm, all the patterns are divided
    into different groups.


    # Workings


    +   - The algorithm starts with the entire dataset, which consists of input features
    and their corresponding target labels. The goal is to create a tree structure
    that can predict based on input features (Charbuty Abdulazeez, 2021).

    +   - The algorithm selects the best feature to split the dataset into subsets.
    It evaluates different features based on different criteria.

    +   - After selecting the best feature, the dataset is split into subsets.

    +   - Similarly, these steps are repeated recursively for each created subset
    and split until the stopping criteria are met (Navada et al., 2011).

    +   - Once a stopping criteria is met, the leaf node represents the decision tree''s
    final predictions.


    # Components


    +   - **Root Node:** The topmost mode of the decision tree, representing the entire
    dataset at the beginning of the tree-building process. It is the node where the
    first feature is selected for splitting the data (Delibasic et al., 2011).

    +   - **Internal Node:** These nodes represent the decision points in the tree.
    Each internal node is associated with the feature and conditions based on that
    value.

    +   - **Branches:** Branches emanate from an internal node that leads to child
    nodes or leaf nodes

    +   - **Leaf Node:** It is the terminal node of a decision tree. It does not have
    any child nodes. The leaf node represents the final decision or prediction made
    by the tree (Delibasic et al., 2011).'
  merge: -1
  img_proc: true
