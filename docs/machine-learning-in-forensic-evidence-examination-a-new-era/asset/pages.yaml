- pgno: 116
  md: '# Machine Learning in Predictive Toxicology


    ML and DL models have the ability to predict toxicity with high accuracy and subsequently
    fill the research gaps, as demonstrated in Figure 6.2 [21]. These models are trained
    on large datasets of chemical and biological data, allowing them to recognize
    patterns and relationships that might not be apparent through traditional experimentation.
    Predictive models can estimate toxicity endpoints, such as median lethal dose
    (LD50) and median inhibitory concentration (IC50) which are crucial for risk assessment
    and regulatory decisions [28]. It can also predict the harmful effects of substances
    on living organisms [29] and help in the structure–activity relationship (SAR)
    by establishing a relationship between the molecule and its biological activity.
    For such purposes, a variety of ML and DL models are available for use depending
    on the nature of the data and the problem at hand. A few of the most commonly
    used models in predictive toxicology are given below [30]:


    **Random Forests (RF):** Random forest is one algorithm which has been widely
    used in predictive toxicology [31]. For instance, in a recent study, it was used
    to build classification models for mouse liver toxicity [32]. This algorithm is
    a combination of multiple decision trees that are merged to put out a single result
    and is suitable for both classification and regression problems [33].


    **Support Vector Machines (SVMs):** SVMs are used in toxicology for binary classification
    problems, especially when working with limited samples. They can distinguish toxic
    from non-toxic compounds [34]


    ![](img/b862fc39ed9add71b3d54909afaeaeb0_116_0.png)


    Figure 6.2 Predictive toxicology.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'and have been found to be useful in the identification of aquatic toxicity
    mechanisms of various organic compounds [35].


    **Gradient Boosting Machines (GBM):** Gradient boosting algorithms such as XGBoost
    and light GBM have become increasingly popular as they are able to handle complex
    data and provide good results. Gradient boosting combines various base models
    to form a strong ensemble model, often used for regression and classification
    problems in toxicology. In a study, GBM along with other methods was used to build
    a model for predicting the half-life of organic chemicals in humans [36].


    **Neural Networks:** Deep-learning models are also increasingly used for the toxicity
    prediction and classification of various chemical substances. These models have
    the ability to learn complex patterns and extract information from the given data.
    The different types of neural networks commonly used in predictive toxicology
    include:


    +   - **Feedforward Neural Networks (FNN):** An FNN is one of the most basic types
    of neural networks wherein the data moves in only one direction through input,
    hidden and output layers and is used for various toxicity prediction tasks [37].

    +   - **Convolutional Neural Networks (CNN):** CNNs are usually used for image
    recognition purposes and are thus useful when dealing with image-based toxicity
    prediction such as molecular structures or biological assays [38].

    +   - **Recurrent Neural Networks (RNN):** RNNs are used when working with sequential
    data and are suitable for predicting time-dependent toxicity or molecular sequences
    [39].

    +   - **Graph Neural Networks (GNN):** GNNs are developed specially for graph
    data and hence, ideal for problems involving molecular graphs or chemical compounds
    [40].


    **DeepChem:** DeepChem is a library that was created specifically for the discovery
    of drugs [41] as well as predictive toxicology. It provides pre-built deep learning
    models and tools tailored for chemical and biological data analysis [42].


    **Chemoinformatics Models:** Chemoinformatics-based models, such as quantitative
    structure–activity relationship (QSAR) models and pharmacophore modelling are
    also commonly used for toxicity prediction alongside traditional ML and DL models.
    These models rely on chemical properties, molecular descriptors and structural
    features [43].'
  merge: -1
  img_proc: true
- pgno: 118
  md: '**Ensemble Models:** Often, a combination of different models is used to improve
    the model performance [44]. Some examples of ensemble techniques such as stacking
    and bagging can be used to combine the predictions from multiple models in order
    to achieve greater accuracy [45, 46].


    **Transfer Learning:** Through transfer learning, a pre-trained model that has
    been fine-tuned for a specific toxicology task is re-used on a second related
    problem and can be particularly advantageous when dealing with limited data and
    computational resources [47].


    # Explainable Artificial Intelligence Models (XAI)


    As the name suggests, explainable AI models not only make predictions but also
    give the rationale behind the model’s decision. This improves the transparency
    of the models and makes the predictions more trustworthy, which is crucial in
    toxicological studies [48].


    Ultimately, the choice of the model depends on factors such as the nature of the
    toxicological task, data availability as well as the desired level of interpretability.
    Nevertheless, different models can be experimented with to assess which one works
    best for the problem at hand.


    # Structure–Activity Relationship


    Structure–activity relationship (SAR) studies are used to determine the relationship
    between the structural characteristics of a chemical compound and its biological
    activity, such as toxicity. With the increase in chemical libraries and datasets,
    ML and DL models have been widely used in SAR-based toxicity predictions [49,
    50]. This can help identify features that are associated with toxicity, which
    is especially necessary when developing drugs or chemicals for use [51]. ML and
    DL techniques are currently utilized in SAR analysis in the following ways:


    # Feature Extraction and Selection


    +   - **Molecular Descriptors:** Molecular descriptors are numerical values that
    represent chemical compounds. These descriptors are derived from various properties
    of the molecules from simple ones such as molecular formula and topology to more
    complex ones such as 3D structure [52]. These descriptors are used as input variables
    for the ML model in order to make predictions.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_119_0.png)


    Figure 6.3 Deep learning-based predictive toxicity prediction.


    +   - **Deep Learning for Feature Extraction:** DL models have the ability to
    learn and extract relevant features from the input data, such as molecular structures,
    without requiring manual feature engineering. Techniques such as graph convolutional
    neural networks (GCNs) and recurrent neural networks (RNNs) can process molecular
    graphs or sequences directly, maintaining valuable structural information (Figure
    6.3) [53].


    # Data Preparation and Augmentation


    +   - **Data Preprocessing:** The most important part of this initial step includes
    cleaning and standardizing molecular data, handling missing values, normalizing
    features and ensuring that the data is consistent.

    +   - **Data Augmentation:** In case of limited data or samples, data augmentation
    techniques can be considered for generating new data points with slight variations,
    thus increasing the size and diversity of the dataset.


    # Model Training


    +   - **Traditional ML Models:** ML algorithms such as random forests and support
    vector machines, among others, are trained on datasets of compounds with known
    activity levels. Thereafter, these models learn to map the relationship between
    molecular descriptors and the corresponding biological activities [54].

    +   - **Deep Learning Models:** SAR models based on DL techniques such as GNNS
    can be used to predict values on various chemical and toxicological properties
    such as activity labels or continuous activity values [55].'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Predictive Modeling


    +   - **Binary Classification:** ML and DL models can be used for binary classification
    tasks, such as predicting whether a molecule is active or inactive against a specific
    target [56].

    +   - **Regression Analysis:** Regression models are used for quantitative SAR
    (QSAR) analysis to predict the activity levels of chemical compounds and are able
    to assess the contribution of various features with respect to certain parameters
    [57].


    # Model Interpretability


    +   - **Feature Importance:** As stated earlier, ML and DL models are capable
    of evaluating the contribution of each feature towards making the final prediction
    [58].

    +   - **Attention Mechanisms:** Some DL models, for instance, GNNs use attention
    mechanisms to point out specific substructures or atoms within molecules, responsible
    for bioactivity [59, 60].


    # Model Validation


    +   - **Cross-Validation:** Cross-validation techniques are used to evaluate the
    performance of the model on the portion of the dataset that was not used to train
    the model. This is done in order to measure the model’s ability to generalize
    new unseen data.

    +   - **External Validation:** Another type of validation that can be done is
    external validation in which the model is validated against similar external datasets
    [61].

    +   - **Chemoinformatics Databases:** There are various databases available, such
    as ChEMBL and PubChem [62], that are utilized by ML and DL models for gathering
    chemical and biological data which is useful for SAR analysis.


    **Virtual Screening:** ML and DL models today have employed numerous existing
    chemical libraries for screening drugs and toxic compounds, which in turn, has
    been a huge improvement for SAR analysis and predictions. Overall, these techniques
    have increased the speed of such analysis through automatic feature extraction,
    capturing complex patterns [63] and also improving the understanding of how chemical
    compounds work [64].'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Machine Learning in Clinical Toxicology


    In the pharmaceutical industry, predicting adverse events associated with drugs
    is critical. ML and DL models can analyze large-scale clinical and pharmacovigilance
    data to identify patterns that suggest potential adverse events. This helps in
    postmarketing surveillance and can lead to safer drug usage. A study evaluated
    machine-learning algorithms for predicting seizure due to acute tramadol poisoning
    using routine demographic, clinical and paraclinical data, and important predictive
    variables [65]. A support vector machine–based method along with a feature selection
    technique that can be applied to accurately predict paraquat poisoning toxicity
    is also reported [66].


    # Machine Learning in Environmental Monitoring and Toxicology


    ML and DL are also applicable in environmental toxicology. These techniques can
    help in predicting the environmental impact of chemicals, assessing their potential
    for bioaccumulation and understanding their effects on ecosystems [67]. This knowledge
    aids in the regulation of pollutants and further helps in reducing their effects
    on the ecosystem as well as human health [68]. ML and DL are used in environmental
    toxicology specifically for the purpose of predicting the toxicity of various
    chemicals to aquatic organisms (Figure 6.4). As a result, they are able to identify
    potentially harmful substances and prioritize the same for further testing. They
    are also a great tool for predicting bioavailability, considering factors such
    as soil properties, climate and microbial activity [69]. In the case of environmental
    monitoring,


    ![](img/b862fc39ed9add71b3d54909afaeaeb0_121_0.png)


    Figure 6.4 Predictive environmental toxicology [20].'
