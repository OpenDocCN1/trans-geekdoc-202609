  md: '# Advantages of the Approaches


    The automation sourced through the machine-learning approach brings invaluable
    support to the investigators as well as researchers by speeding up the procedure
    and the processing capacity [6]. With the use of machine-learning approaches,
    the efficiency of the entities will surely increase along with the reduction in
    revenue losses which may occur due to digital crimes [1]. It is the potential
    of a machine-learning approach that can deliver high performance, better collaborative
    functions with more sophistication to perform efficient investigations with massive
    datasets [7]. Machine learning helps in the recognition of any criminal actions
    or risks by data analysis and segmentation. Additionally, it enables investigators
    to examine the widely distributed data sets located in wired and social networks.
    To put it simply, it can offer a well-structured repository containing the cleaned
    data from digital investigations with well-known characteristics and outcomes
    [2]. Understanding machine learning is greatly important as with its increasing
    scope, criminals tend to use such techniques to commit crimes. Thus, machine learning
    is not only used in the analysis of a digital crime but is equally important to
    be identified in cases where these technologies are used [18].


    # Disadvantages of the Approaches


    The applications are restricted because of their use in security in terms of image
    forensics and large data. When there is a difference in the output results during
    the test phase, a need to develop a new class is raised [11]. CNN models in image
    analysis bring challenges to the network designing for learning features through
    weak traces related to precise manipulations. Compressed images are tedious to
    analyse because of their quality aspects or various compressions as available
    methods function under certain conditions [6]. Machine-learning algorithms require
    massive data storage which becomes really difficult for professionals to handle
    [19].


    # Conclusion


    This chapter focused on highlighting the way machine learning has completely transformed
    digital investigations. Digital forensics, with its rapid advancements, requires
    tools that are capable of running faster or at least match its pace; hence machine
    learning is highly valuable in cases of digital'
