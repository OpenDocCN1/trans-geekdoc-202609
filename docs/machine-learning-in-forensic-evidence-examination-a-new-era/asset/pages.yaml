    SVMs help in age estimation by examining the morphological and structural variations
    of the bones that take place with time such as the maxillary sutures, epiphyseal
    fusion and wearing of knee joints [25–27]. By training on a dataset of people
    with known ages and the accompanying skeletal traits, a support vector machine
    (SVM) can be trained to forecast the age of unidentified skeletal remains.


    As it is a supervised learning algorithm, it can also be trained on known sample
    datasets beforehand to recognize comparable trauma patterns, skeletal diseases
    and anomalies in unknown remains.


    In forensic anthropology, SVMs are only one of many machine-learning algorithms
    that can be utilized. Their efficacy is contingent on the quality and extent of
    the training dataset, as well as the selection of suitable features for analysis.
    Moreover, the expertise and comprehension of forensic anthropologists play a crucial
    role in interpreting results and making informed decisions based on the SVM’s
    output (Figure 10.3).


    # Random Forest (RF)


    It is a prevalent ML algorithm and belongs to the group of supervised-learning
    techniques, used for both classification and regression problems encountered related
    to ancestry estimation. This algorithm basically contains multiple decision trees
    and uses the average outputs of the various datasets to enhance the accuracy (Figure
    10.3). The conventional method of ancestry estimation includes an examination
    of both morphoscopic traits and anthropometric measurements. However, a study
    shows that the application of a random forest model can combine both datasets
    and increase the accuracy of estimation. The results revealed that discriminant
    function analysis gave an accuracy of 75.4% whereas using random forest models
    the accuracy was increased to 89.6% [28]. AncesTrees is a novel algorithm proposed
    for ancestry estimation with randomized decision trees. The database used in designing
    this algorithm comprised 23 craniometric variables from 1734 individuals with
