    # Problems Encountered during Trace Evidence Examination


    Trace evidence analysis comes with its fair share of difficulties; this can be
    due to the nature of the evidence or the limitation and availability of instruments
    for their analysis. One of the main issues with trace evidence, as the name suggests,
    is that it is found in very small amounts, making identification, handling, preservation
    and contamination prevention difficult. These issues can be easily overlooked
    until trained eyes look at the trace evidence and the evidence is at a greater
    risk of becoming lost or damaged. Trace evidence can be easily contaminated from
    multiple sources including environmental factors, such as rain and temperature,
    contamination while handling, such as from gloveless hands, contamination can
    also occur during collection, packaging, transportation or storage, which ultimately
    compromises the evidentiary value of the evidence in the court of law. Background
    noise during the analysis of trace evidence can interfere with the identification
    of the elements; to overcome we require expertise and sophisticated analytical
    techniques which can accurately identify the elements with great sensitivity.
    Forensic experts handling such evidence should be well-trained in skills and knowledge
    to accurately perform the required analysis with precision. There should be universal
    standardization in the steps of analysis to avoid inconsistencies.


