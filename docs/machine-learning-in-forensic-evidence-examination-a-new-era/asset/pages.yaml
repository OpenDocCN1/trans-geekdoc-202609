    # Application in the Realm of Forensics


    **Machine Learning and Deep-Learning Methods for Sex Estimation of Infant Individuals:**
    The research of machine-learning techniques, particularly deep learning, for sex
    estimation in infant skeletons. A recent study compared the effectiveness of machine-learning
    algorithms with expert visual assessment in estimating the sex of child skeletons
    from ilium pictures. The researchers utilized photos of 135 infant individuals
    aged between 5 months of gestation to 6 years from the University of Granada collection.
    The study applied deep-learning techniques such as VGG16 and ResNet50 pre-trained
    on ImageNet, obtaining an accuracy of 59%, which was near to expert evaluation.
    Classic ML approaches such as support vector machines (SVMs), random forests (RFs)
    and AdaBoost with HOG features were also tested, yielding an accuracy of 49%,
    which was less successful than deep learning. The results of the study suggested
    that deep learning approaches provided competitive outcomes compared to expert
    assessment, underlining the promise of AI techniques in forensic anthropology.
    The study also proposed exploring 3D models and software tools to further develop
    AI applications in forensic anthropology [54].


    **Pediatric Bone Age Assessment Using Deep Learning: Generalizability and Limitations:**
    Here we examine the issues of generalizing pediatric bone age assessment using
    deep learning models, which is an important concern in this field. It was considered
    intriguing that the algorithm was evaluated on several datasets without segmentation
    and the impact of demographic characteristics such as sex was underlined. Several
    studies provide useful information for future studies to improve the clinical
    usability of automated bone age assessment. It also underlines the necessity to
    examine cross-institutional generalizability and demographic considerations for
    strong and equitable medical uses of deep learning in bone age assessment [55].


