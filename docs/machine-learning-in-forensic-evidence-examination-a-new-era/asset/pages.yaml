    # Applications of Machine Learning in Forensic Ballistics


    # Firearm Identification


    The recordings of firearms utilized at the scene of an increasing number of crimes
    are accessible for investigative purposes. The objective of forensic investigation
    is to ascertain whether the item under scrutiny is, in fact, a firearm, as well
    as to specify its model, calibre and other relevant characteristics. The forensic
    analysis of cartridge discharge sounds (specifically, shock waves and muzzle blasts)
    is widely recognized [11–14] and is utilized in criminal investigations. The integration
    of acoustic evidence and exterior ballistic calculations can facilitate the determination
    of the shooter’s distance and location [15, 16]. Moreover, an examination of the
    noise generated by a projectile throughout its trajectory and upon impact is possible
    [17–19]. An additional application of acoustic analysis of crime scene records
    is the determination of the sequence of shots fired by various shooters [10, 20].


    Firearms produce various acoustic signals during their operation, including the
    sound of a shot, the sound of a flying bullet and the sound of the bullet’s impact.
    These acoustic signals can be analyzed, compared, and identified to differentiate
    between different types of firearms and their mechanical actions. Forensic investigation
    of the sounds of cartridge discharge, combined with exterior ballistic calculations,
    can help determine the distance to the shooter and their position. By analyzing
    the acoustic signals made by firearms, including the sound of a shot, the sound
    of a flying bullet and the sound of the bullet’s impact, it is possible to identify
    different types of firearms and their mechanical actions. Machine learning has
    been found to be the most promising method for analyzing and identifying these
    acoustic signals, which can be used in forensic identification.


    # Gun-Shot Residue Analysis


    Quantitative profile–profile relationship (QPPR) modelling is a novel machine-learning
    technique that aims to establish associations and predictions regarding the chemical
    properties of unspent ammunition derived from gunshot residue (GSR) [21–23]. By
    leveraging the post-discharge GSR profiles, the methodology forecasts the pre-discharge
    chemical profiles of'
