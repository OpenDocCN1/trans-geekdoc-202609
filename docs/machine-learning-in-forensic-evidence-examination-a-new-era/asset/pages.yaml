    # Conventional Machine Learning–Based Classification


    The incorporation of traditional ML models into forensics document examination
    has advanced significantly, particularly in the utilization of bit number models
    for classification purposes. The integration of bit number models within the conventional
    ML frameworks can offer advantages in terms of document classifications if the
    scientific intricacies behind this integration are properly understood [24, 25].


    # Support Vector Machines (SVMs) with Bit Number Models


    In a binary classification SVM, the decision boundary is represented as a hyperplane:
    =0+11+2+2+ ... +f(X)=β0+β1X1+β2X2+ ... +βnXn.


    The objective is to find the β coefficients that maximize the margin between classes.


    Support vector machines (SVMs) are renowned for their ability to manage intricate
    data and can be improved by incorporating bit number models. In bit number models
    all features are represented in a binary format, where'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'each bit functions as a distinct feature. This methodology enables SVMs to
    effectively analyze and categorize documents by leveraging detailed bit-level
    patterns. This becomes particularly valuable in situations where a high-dimensional
    feature representation is necessary.


    # Decision Trees Utilizing Bit Number Models


    Decision trees make decisions by splitting data based on features. The formula
    for predicting the target variable Y in a decision tree is based on a series of
    conditions:


    Y = f (X1, X2,...,Xn)


    Each condition represents a split based on a specific feature, guiding the tree
    to a final prediction.


    The decision trees have special abilities towards spontaneous classification of
    data and this can be further augmented by using the binary features of bit number
    models through integration of both. This added capability of employing binary
    features at the bit level makes the decision trees capable of accurately mapping
    and discriminating the patterns and characteristics within the questioned document
    at the time of examining it. Consequently, more precise and accurate results can
    be obtained through this integrated model of decision tree and bit number model
    [26].


    # Random Forests Enhanced by Bit Number Models


    The unitary decision tree models can collectively generate the random forest model.
    As the word signifies, many trees together create a forest. In this case, prediction
    from each of the individual trees is also collated to create a combined prediction
    under the model of random forest. To perform the task of classification, the model
    considers the majority vote as shown below mathematically:


    mode Y = mode {Y1, Y2,..., Yk}


    For regression, it could be an average. As the decision tree model could be enhanced
    by integrating it with the bit number model, similarly, the random forests can
    also be enhanced by integrating it with bit number models for better learning
    and output. In such a situation, each decision tree component of a random forest
    model will facilitate processing the binary features at the bit level and later
    will be aggregated to give a collective insight. This integration, therefore,
    strengthens the random forest for dealing with and classifying complex, long and
    diverse data sets in suspected documents [27].'
