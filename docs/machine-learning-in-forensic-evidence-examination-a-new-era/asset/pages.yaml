    # Introduction


    Interestingly, the development of robotic technologies in many ways has become
    a kind of alternative and a parody of the human brain which has been quite developed
    in the field of dentistry [1]. The era of computerization began some time ago
    with the digitization of archives and medical devices for maintaining records;
    however, cloud servers have emerged as the true enablers of integration, serving
    as repositories for centralized data management. The use of computerized dental
    records was useful in the identification of victims in the aftermath of the World
    Trade Center attacks and the Indian Ocean earthquake and tsunami [2]. Human remains
    have become severely incinerated in some of these cases, and apart from the oral
    cavity, which is incredibly durable, there are no other means of identification
    [3].


    Together with these factors, artificial intelligence (AI) has developed tremendously
    over the past decade and has been incorporated into a multitude of industries
    without complications [1, 4]. As the scenarios change, the field of healthcare
    has been more emphasized as compared to other time periods, and issues such as
    AI should be able to help physicians detect and diagnose a variety of dental issues.
    [5].


    Forensic odontology, or FO, looks at both teeth and teeth remains, mainly for
    human identification purposes. [2, 3] The use of artificial intelligence more
    or less resolved the challenges faced by the existence of professional and personal
    bias when dealing with odonatological information. [6] In the case of FO artificial
    intelligence technology, this is not the only function, as it can also be utilized
    in solving crimes through the identification of bite marks, estimating the anatomy
    of the teeth and the mandible, sexing and ageing among other things. [7] All of
    these artificial-intelligence models are based'
