  md: 'relevance and predictive ability which can be derived from statistical outputs
    of correlation or other statistical coefficients which measure its applicability
    in a particular context. The wrapper method selects the relevant features by approaching
    the process as a search problem and employing the algorithm as a ‘black box’.
    Embedded methods make use of regularization methods such as L1 regularisation
    (Lasso), which results in automatic feature selection.


    +   - **Dimensionality Reduction:** This is another method to control or reduce
    certain unwanted dimensions of any data for targeted processing and outcome. There
    can be two kinds of approaches to dimensionality reduction—linear methods and
    non-linear methods. The linear method performs dimensionality reduction by determining
    the variance and principal component analysis (PCA). The non-linear relationships
    in the data can be retrieved and the unwanted dimensionality reduced through non-linear
    techniques such as t-SNE (t-distributed stochastic neighbour embedding) and UMAP
    (uniform manifold approximation and projection).

    +   - **Regularization:** The regularization technique helps to reduce the complexity
    and overcrowding of data by training the model to apply penalty terms during training
    when the model becomes too complex or fits the data too closely. These are achieved
    by L1 regularization (Lasso), and L2 regularization (Ridge).


