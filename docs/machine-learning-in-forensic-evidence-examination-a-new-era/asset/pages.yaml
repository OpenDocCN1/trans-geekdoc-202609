  md: 'age estimation methods from dental radiographs can be used for up to 25 years
    but after that age estimation in the elderly and adults becomes difficult. Hence,
    a novel CNN named ‘Soft Stagewise Regression Network’ SSR NET was developed to
    perform multi-stage age estimation from a single image. Based on SSR NET another
    novel software was developed named DENSEN to perform similar tasks but with a
    higher sensitivity [53]. Sex determination forms an important part of biological
    profiling and can also be done using convolutional neural networks. A study conducted
    using 1476 lateral cephalometric radiographs showed that CNNs can be used to obtain
    sexual dimorphism with an accuracy of 90% [54]. Ear biometrics are often used
    for somatometric examinations, and are easily found for personal identification.
    Ear biometrics remain unaffected by any facial expressions and hence deep learning
    convolutional networks can be used to study them. These neural networks must be
    trained with a known dataset before use. A study suggested that such a trained
    neural network was able to determine morphological landmarks accurately [50, 55].


    Wen et al. used CNN for ancestry estimation from Chinese population groups (156
    Yellow and 178 White skulls) as samples, in which 80% served as training sets
    and 20% as test sets. They obtained 95.88% accuracy on the training set and 95.52%
    accuracy [56].


    # Multivariate Adaptive Regression Splines (MARS)


    MARS is a regression algorithm put forth by Jerome H. Friedman in 1991 and was
    an extension of the linear models. This algorithm works as a non-parametric technique
    and automatically models non-linear relationships between variables. Conventional
    juvenile age estimation methods often fall short of statistical validity (Figure
    10.4). Hence a standard approach using MARS was used to predict age from iliac
    biometric variables. The study was conducted on 176 subjects aged between 0–12
    years. The MARS predictive model depicted iliac width, module and area providing
    better age estimation [57]. Another study conducted on 1310 subjects aged between
    birth to 12 years, used MARS to predict age from diaphyseal dimensions. The results
    revealed that univariate models can be used only for younger children whereas
    multivariate diaphyseal length models generated better results for older children
    [11]. Another approach at sub-adult age estimation was made from the fifth lumbar
    vertebrae, clavicles of 534 males from the French population and iliac measurements
    of 244 subjects aged between 0–12 years. The MARS model was used to combine both
    sets of measurements. The model integrated the non-linear relationships among
    the variables and generated an accuracy of 92% [58].'
