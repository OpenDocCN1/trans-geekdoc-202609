    # Introduction to Deep Neural Network Architectures


    The deep learning model of machine learning is built on deep neural network topologies.
    The deep neural network helps the model to identify complex patterns and intricate
    correlations within the data. Let us briefly discuss two of the most important
    deep neural network architectural models: (i) multi-layer perceptrons (MLPs) and
    (ii) convolutional neural networks (CNNs). While CNNs are explicitly intended
    for handling network-like information, making them especially useful for image
    classification tasks, MLPs succeed at distinguishing intricate non-linear relationships
    [30].


    (i) **Multi-Layer Perceptrons (MLPs):** Multi-layer perceptrons (MLP), as the
    name suggests, are made up of multiple layers of neurons, each interconnected
    with its preceding and succeeding layer of neurons. The first layer represents
    the ‘input layer’, which is passed through several intermediary layers known as
    ‘hidden layers’ and finally the last layer which is referred to as ‘output layer’.
    Due to this interconnectivity for processing the input data, it is also known
    as a feedforward neural network as each neuronal layer provides an activation
    function and passes on the output to the subsequent layer in the channel. The
    multiple layers of neurons are able to recognise even the non-linear correlations
    from the input data through progressive learning and thus are useful in handling
    data requiring complex decision-making and classification. MLPs are ordinarily
    trained through backpropagation, a technique for modifying the network’s weights
    in view of the error occurring between expected and noticed results [31].


    (ii) **Convolutional Neural Networks (CNNs):** Convolutional neural networks (CNNs)
    were made with the sole reason of handling'
