- pgno: 22
  md: '# Support Vector Machines (SVMs)


    **Overview:** Support vector machines (SVMs) represent a high-performing supervised
    learning algorithm used in many applications, including forensic science. SVMs
    are used in classification and regression tasks by building optimal decision boundaries,
    called hyperplanes, within a space of high dimensionality [6]. At the highest
    level, SVMs are ideal for forensic evidence analysis because this is a very clear
    classification problem: finding patterns in fingerprints or categorizing genetic
    profiles.


    **Operating Principle:** Support vector machines (SVMs) seek to identify hyperplanes
    which segregate data points of different classes, while at the same time trying
    to maintain a margin between them. The efficacy of SVMs depends on the data points—known
    as support vectors—that are useful in determining an optimal hyperplane. SVMs
    are great in dealing with highly non-linear relationships as they use kernel functions
    to generate linear boundaries for different classes where a simple line cannot
    separate one class from another. Figure 1.3 shows a diagram for SVMs.


    **Applications in Forensic Science:** For example, in fingerprint analysis, SVMs
    are used to classify and match prints based on dissimilarities, with the features
    collectively responsible for correct identifications. SVMs can perform genetic
    profiling analysis, where in a linear classifying manner the SVM is suited to
    pick out patterns within DNA data which would then provide vital information for
    identifying individuals.


    ![](img/b862fc39ed9add71b3d54909afaeaeb0_22_0.png)


    Figure 1.3 Support vector nachine diagram [21].'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Naive Bayes Classifiers


    **Introduction:** Naive Bayes classifiers are probabilistic models based on the
    principle of Bayes’ theorem and work well for classification tasks, especially
    in forensic sciences Committed to their underlying simple assumptions, the naive
    Bayes classifiers are efficient and effective tools in some scenarios such as
    when computational resources or training examples is limited [7].


    **Operating Principle:** The basic premise behind naive Bayes classifiers is their
    assumption of feature independence with respect to the class label—hence, ‘naïve’.
    Nevertheless, naive Bayes classifiers are likely to perform very well in practice.
    What these do is simply crunch numbers, such as calculating the likelihood (*a
    priori*) of obtaining a specific class given input features, and then selecting
    the class with the highest probability. In forensic evidence examination, naive
    Bayes classifiers find application in tasks such as document analysis or handwriting
    recognition.


    **Applications in Forensic Science:** For example, in document analysis, they
    can be utilized to categorize and authenticate documents based on textual features.


    # Neural Networks and Deep Learning Models


    **Introduction:** Neural networks and deep learning represent an exciting class
    of machine learning that works by modelling the way the human brain processes
    complex information. In the field of forensic science, these models have shown
    state-of-the-art performance at dealing with intricate patterns and relationships
