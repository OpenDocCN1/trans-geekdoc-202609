  md: 'cranium, long bones and other skeletal remains [21–24]. Ancestry estimation
    also can be established by the SVMs by training it on known datasets of different
    racial groups and associated specific morphological or metrical features. In a
    study conducted by Spiros and Hefner (2020), ancestry estimation was carried out
