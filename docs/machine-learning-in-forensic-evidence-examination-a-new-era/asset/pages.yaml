    | Review | Proof | Return of evidences | Review | Review |


    (DFRWS), integrated digital investigation process model (IDIP), and end-to-end
    digital investigation process model (EEDIP) [3].


    # Algorithm for Digital Investigation and Examination


    Algorithms are developed for the digital investigation process as a whole and
    for individual examinations of digital evidence. These must be transparent, interpretable
    and explainable to understand and verify the results [4]. The applicable algorithms
    are:


    # Support Vector Machine


    It is used in the detection of computer-generated images. First, the extraction
    of a histogram and multifractal spectrum structures from the residual images and
    regression model fitness features and then measuring the binary similarity of
    PRNU (photo response non-uniformity) [6]. It has the ability to handle both regression
    and classification problems. It can perform complex tasks on structured as well
    as unstructured data depending on the kernel function and uses the samples from
    the training data set for the classification of objects. It basically identifies
    the features in each data set and decides a hyperplane based on which the data
    is classified into two categories. The error rate here is minimised with the increasing
    marginal distance between the two categories [3]. It is a supervised learning
    algorithm used for the classification of phishing emails as it separates data
    which is non-linear [1]. SVM is a state-of-the-art method used in machine-learning
    theory. It is designed for multi-class and binary classification. Its main aim
    is to identify the hyperplane with maximum distance between data of different
    classes for further processing [11]. It is viewed as an algorithm that learns
    from training using particular data sets to provide correct predictions or outputs.
    It is'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'counted under the supervised learning category as it performs tasks for data
    analysis, pattern recognition, regression analysis and classification. The SVM
    algorithm is trained by the example datasets to build a model that will define
    the categories of the input data. It can be used in both linear and non-linear
    classification [12]. SVM-based techniques are considered appropriate to solve
    binary problems in image forensics [6].


    # Convolution Neural Network (CNN)


    CNN works based on observational data. However, it is a complex model due to its
    interconnectivity with large neurons. It addresses image processing tasks including
    pattern recognition. In this, feature extraction is a data-driven process which
    can classify images based on their shapes [11]. It is a variant of neural networks,
    popularized recently with the availability of computational power to train the
    models. It works tremendously on large datasets with great accuracies for image
    classification, object detection and face identification. The datasets on which
    it has worked are Pascal visual object challenge (VOC) 2007, VOC 2012 and Image
    Net 2012 [8].


    # Decision Tree Algorithm


    It can be used for both classification and regression of tasks. The interpretation
    is easier in this type [3] and can be used as a statistical model as well [12,
    13]. It can communicate the output from the tests to the classification of data
    items. It forms a flow chart–type structure for instance a tree for the classification
    of data into classes [12]. It considers decision logic framing them into a tree-like
    structure. The topmost node is the root node, internal nodes are the input variables,
    the child nodes are branched by the classification algorithms after the test completion
    and the process continues until the leaf node is ready for the decision [3]. The
    decision tree algorithm works in a bottom up approach, starting from the roots
    and going to the leaves which demonstrates it is class one. The roots become the
