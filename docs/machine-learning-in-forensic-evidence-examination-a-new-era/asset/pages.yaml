    # Machine Learning Techniques in Fingerprint/Pattern Recognition/Identification/Matching


    In biometric security and pattern recognition, using machine-learning algorithms
    has enhanced the security and other parameters in the fingerprint/pattern recognition/identification/matching
    field. Machine-learning algorithms contribute to fingerprint identification and
    matching to meet the growing demand for accurate and robust human identity verification
    methods. From classical algorithms to advanced deep learning models, these techniques
    have enhanced the precision of fingerprint analysis and enabled automation and
    scalability in various applications (Awad 2012).


    # 1. Artificial Neural Network


    It is a model inspired by the human brain’s neural network, that is, it works
    similarly to the biological neural network in the human brain. Neural network
    algorithms are used for various tasks such as classification, regression, pattern
    recognition and management (Krogh 2008). The neural network algorithm works on
    three layers: input, hidden and output (Walczak 2019).


    +   - **Input Layer:** The starting point receives the raw input data. Each neuron
    in the input layer corresponds to the specific feature on the attribute, and its
    value represents the value of that feature. Each neuron passes the value to the
    neuron of the next level.

    +   - **Hidden Layer:** It is the intermediate layer responsible for learning
    and representing complex pattern relationships in data. It is the layer where
    the network learns to recognize features and combinations of features that are
    relevant to making predictions. The number of hidden layers and the number of
    neurons in each hidden layer are hyperparameters that need to be chosen based
    on the complexity of the problem.

    +   - **Output Layer:** It produces the final results of neural network computation.


    # *Components*


    +   - **Neural (Node):** It is the basic unit of the neural network algorithm.
    Each neuron works on different layers; therefore, each receives input, processes
    it and produces an output (Walczak 2019).'
