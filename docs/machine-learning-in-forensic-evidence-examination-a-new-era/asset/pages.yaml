  md: 'analytics also referred to as text mining is the extraction of meaningful information
    from some textual data using a mixture of algorithms. It analyzes structured and
    unstructured as well as semi-structured data and identifies the unknown information
    present in it. It can be an extractive, inductive or even deductive type of forensic
    technique depending on the type of algorithms used for the knowledge extraction.
    It performs several tasks such as text processing, cleaning up unwanted information,
    tokenization by splitting into slices, removal of stop words (the, is, a, etc.),
    stemming the words into base words (bikes to bike) and, most importantly, document-term
    or term document matrix analysis. Tools useful for text mining are Attensity,
    dtSearch, Forensic Toolkit from AccessData Apache OpeNLP, Natural Language Tool
    Kit, WEKA, etc. [7].


    # Network Tracing


    Tools such as Iris, Net Witness, Xplico, Net Intercept and SoleraDS5150 help in
    examining the network traffic to detect intrusion and determine how the crime
    had occurred [17]. It is beneficial for network surveillance and security analysis.


    # Link Analysis


    It establishes the connection between the evidence gathered and the suspects.
    By converting the information into a collection of linked entities or objects,
    it is possible to ascertain the structure and content of a body of knowledge [12].
    It is an extractive technique which uncovers the hidden associations between entities
    buried under a large amount of data. It is based on graph theory, a branch of
    mathematics. It builds an immediate visual picture of communications for the investigator
    to help them understand the puzzle. It frames the case data gathered from multiple
    devices with mutual device users on a single map. Tools such as Analyst’s Notebook,
    Maltego, Netmap, Centriguge and marketVisual analytics are popular for use in
    performing link analysis [7].


    # Malware Analysis


    Malware analysis and behaviour identification can be accomplished by machine-learning
    methods. This can assist investigators in figuring out the malware’s origin and
    mode of operation. New instruments and methods for identifying and evaluating
    malware can also be created using machine learning algorithms [4].'
