    # Anomaly Detection


    Big data analytics heavily relies on anomaly detection since it identifies trends
    or instances that dramatically vary from expected behaviour. Anomaly detection
    becomes much more crucial in the context of big data, as enormous amounts of different
    data are produced, for a variety of reasons. First of all, big data analytics
    works with a variety of data sources and types, such as structured, unstructured
    and semi-structured data. Whether they are numerical values, textual data, network
    traffic, sensor readings or multimedia content, anomaly detection algorithms assist
    in finding anomalies across diverse data kinds [46].


    Anomaly detection can also automatically point out systemic failures, cybersecurity
    infringement or breach, different types of fraud, equipment failure or any other
    critical malfunctioning. Big data analysis can mine out data of interest, critical
    to decision-making, from large chunks of noise, resulting in enhanced operational
    efficiency, reduced risk and detection of abnormalities and outliers which is
    normally not possible through routine statistical techniques [46].


    # Incremental Learning for Non-Stationary Data


    Non-stationary data changing data or dynamic data presents a different set of
    challenges in big data analytics. In order to handle such dynamic data,'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'adaptive procedures, known as idea drift, such as online learning, concept
    drift detection and adaptive learning rates, should be used [47].


    Online learning offers real-time learning opportunities for training the model.
    It is also referred to as incremental learning or streaming learning. This learning
    mode continuously updates the model due to a constant inflow of new. The online
    learning method trains the model’s parameters as per new input data on an incremental
    basis to accordingly improve the output. This incremental learning allows the
    model to stay updated as it keeps on training itself on the most recent patterns
    and progressively most recent data sets.


    The phenomenon of change in the data distribution owing to changes in statistical
    features of the data over time is known as ‘concept drift’. Changes in user preferences,
    seasonal variations or environmental changes, etc., can lead to concept drift
    in big data analytics. Taking this into account, it is imperative that concept
    drift detection is essentially applied to ensure that the model remains accurate
    and the output trustworthy. The concept drift detection methods use a wide range
    of techniques. Some of the popular ones include: sliding window methods, ensemble
    methods, online change detection algorithms and statistical tests such as the
    Kolmogorov–Smirnov test and the CUSUM test.


    The data stream may have different properties at different times and thus the
    learning parameter needs to be adjusted accordingly. Thus, adaptive learning rates
    are very important from a model training perspective. It shall ensure that the
    learning rate is modified dynamically as a function of data streaming and the
    model is updated appropriately. The AdaGrad algorithm is one such algorithm which
    allows for adjustment of the learning rate for each parameter depending on the
    previous gradient information.


    # Multi-Dimensional Data


    Multi-dimensional data exhibiting a lot of variables and features can be challenging
    to analyze. The challenges can be in the form of increased computational complexity,
    overfitting and poor interpretability. Any of these can substantially impact the
    efficiency or outcome of the ML model. However, these can be tackled by certain
    methods such as feature selection, reducing dimensionality and regularisation.[47].


    +   - **Feature Selection:** Through the feature selection method, features of
    relevance or interest are only selected and the rest are eliminated out of a multi-dimensional
    dataset. This is achieved through three approaches: filter methods, wrapper methods
    and embedded methods. In the filter method, features are chosen based on their'
  merge: -1
