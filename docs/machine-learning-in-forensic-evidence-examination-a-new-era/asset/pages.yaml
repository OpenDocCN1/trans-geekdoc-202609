  md: '# Fraud Detection


    Fraud is any activity that is done with the intention to deceive. One such example
    is computer network intrusions which mean manipulation of network service offered
    by some other host. Battling fraud demands a wide collection of algorithms, approaches
    and most importantly data sources which are effective in such scenarios [12].
    There are also certain data sets available for the analysis of forgery detection
    methods, such as the Dresden Image Database, Image Manipulation Dataset and CASIA
    Tampered Image Detection Evaluation Database [16].


    # Network Traffic Analysis


    It helps in the identification of the communication patterns between the devices
    helping in the identification of sources or origin of crime. It uses unsupervised
    learning to recognise any anomalous patterns or behaviours such as future threats,
    unusual communications, fraudulent acts and large data transfers. It works on
    real-time scenarios and flags the traffic which matches anomalous patterns [4].


    # Social Media Data Analysis


    It is essential to aid in building a picture of the social networks of a suspect.
