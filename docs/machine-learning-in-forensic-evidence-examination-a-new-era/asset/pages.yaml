    # Facial Reconstruction


    The process of forensic facial approximation or reconstruction involves the rebuilding
    of the face of an individual whose identity is unknown from their skeletal remains
    [13]. It is a combination of sculpturing, osteology, anatomy and anthropology.
    It is a technique that is utilized in the field of forensics when there are unidentifiable
    remains involved in a crime [31]. The computerized facial reconstruction approach
    makes use of a laser video camera that is either interfaced with a computer or
    with CT scanning [32]. The application of artificial neural networks allows for
    the diagnosis of a person’s gender based on their skeletal features with an accuracy
    rate of 95% [14]. When used for determining the gender of skeletal remains, approaches
    that are based on artificial intelligence will eliminate human bias, do not require
    any specialised skill, and offer results in a short amount of time [13, 33].


