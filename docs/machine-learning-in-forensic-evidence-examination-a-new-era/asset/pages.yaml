  md: '# Potential Applications of Machine Learning in Forensic Questioned Document
    Examination


    SURBHI MATHUR, SUMIT KUMAR CHOUDHARY, PARVESH SHARMA, KRITIKA SOOD AND VINAY ASERI


    # Introduction


    While writing started as a medium of communication, handwriting also evolved as
    an important biometric tool for individualization with the passage of time. And
    thus the concepts of forgery and document fraud were understood and defined in
    due course. Detection of forgery became a prevalent practice in most countries
    across the world from very early times. Handwriting identification and forgery
    detection dates back to 539 AD and as such it predates several other forms of
    forensic science disciplines by centuries. With more people practising and doing
    research, the discipline became more formalized and treatises were published for
    examination and identification parameters, protocols and benchmarks. In 1910,
    Albert S Osborn mentioned how the examination of handwriting had become more scientific
    and had slowly done away with empiricism. However, the science and practice of
    document examination still largely rested on the knowledge, skill and experience
    of the handwriting experts or forensic document examiners (FDE) [1].


    Technology-led disruptive innovation has brought about significant transformation
    in all walks of life. The tale of technology has left humans speechless and coveting
    more technological innovations to achieve effortless operation of complicated
    tasks. The remarkable contribution of technology can be envisaged with the technological
    progress that we have made during the past century, which has led to substantial
    development for mankind. The introduction of 3D printers, robotic machinery to
    automate manual operations at factories and self-driven cars are some of the revolutionary
    examples of technologies developed by man which has enhanced the quality of human
    life and the processes they undertake.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The dawn of the creation of intelligent machines began with the introduction
    and boom of artificial intelligence which works on the model of manufacturing
    intelligent machines that can mimic human intelligence, thereby improving its
    overall efficiency and accuracy. A subset of artificial intelligence is ‘machine
    learning’. This deals with enabling a system to make decisions based on previous
    interactions and patterns. Therefore, machine-learning algorithms work on training
    the system using various types of structured and unstructured data/datasets, to
    equip the system with the intelligence to solve problems and learn from the same.
    The applications of AI-ML-driven technologies extend to various sectors and domains
    worldwide. From AI-powered assistants that work on the models of natural language
    processing to the development of sophisticated machines for aiding medical assistance
    (detection and reporting of cancer cells), the implementation of AI-ML technologies
    has established itself as an indispensable technology of the future [2].


    It has impacted the ways of crime commission and has also, at the same time, forced
    the investigators to adopt counter-technological tools to detect such crimes.
    The advent of artificial intelligence (AI) and machine learning (ML) are big capability
    boosters that have led to several innovations and promises to continue their dominance
    in almost all spheres of human intervention including forensics and questioned
    documents examination [3]. In the realm of forensic questioned document examination,
    where the delicate interplay between science and law seeks to unravel the mysteries
    embedded in handwritten and printed artifacts, the advent of machine learning
    presents a transformative paradigm shift. This chapter extensively addresses the
    fast-paced growth of machine learning applications in the forensic examination
    of questioned documents. This includes the immense possibilities that machine-learning
    techniques bring along with them in terms of improvement in the speed of examination,
    its precision, as well as reduced bias while examining the documents [4]. It fundamentally
    refers to a blend of technology, forensic science and law to enable the analysis
    of documents and their admissibility in the legal framework. The applications
    of machine learning will continue to improve and be finetuned with human intelligence
    and its increasing interference in augmenting artificial competences. While capability
    augmentation takes place and may appear to revolutionize policy and practices,
    it is important to understand and strike a balance between human intelligence,
    expertise and computing prowess for probing the forensic truth or facts under
    question [5].


    Forensic document examination, until about a decade ago, primarily focused on
    issues related to the examination and identification of forgery, handwriting,
    signatures, altered documents, erasures, and the analysis of paper and ink. This
    field required a deep understanding of the physical and'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'chemical properties of paper, ink, toner, and handwriting characteristics to
    effectively differentiate between genuine and forged documents. Mechanical impressions
    such as typewritten documents, seals, stamps, etc., were another crucial class
    of documents examined in larger volumes through manual endeavours. However, with
    the increasing volumes of digital and physical documents, there is an urgent need
    for sophisticated tools that can handle the scale and complexity of forensic examinations
    [6, 7].


    The science of machine learning is an artificial intelligence field that enables
    computers to learn from data patterns and make predictions or decisions without
    having to be given specific instructions [8]. Forensic document examination works
    in harmony with machine learning, poised to transform the field by augmenting
    traditional methods with advanced computational capabilities [9]. Machine learning
    trains forensic experts on algorithms and computational models as tools that can
    speed up document analysis, avoid vagueness and identify hidden details that could
    be missed by human eyes.


    # Machine Learning Fundamentals


    Machine learning is a part of artificial intelligence where systems can learn
    and enhance their performance through experience without direct programming. The
    core idea of machine learning involves using algorithms and statistical models,
    allowing a system to execute tasks without the need for explicit programming,
    as mentioned by Biswas and Shreemoy in 2019.


    While human expertise in identifying handwriting and document characteristics
    is crucial for distinguishing genuine documents from forgeries, machine learning
    algorithms can be trained to detect even the minutest details, map patterns, and
    notice inconspicuous anomalies and features that are beyond the manual limits
    of detection. This advancement leads to improved accuracy, efficiency, and reliability
    in forensic findings related to document analysis.


    # Applications of Machine Learning in Forensic Document Examination


    **Handwriting Analysis:** The handwriting of every individual is unique and forms
    the basis of individual identification or fixing authorship. From pictorial appearance
    to class characteristics to individual characteristics, there are a lot of features
    which can be observed and compared between questioned and standard handwriting
    samples to arrive at a genuineness or authorship'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'conclusion. Machine-learning algorithms can also be trained on a large number
    of datasets of a variety of handwritings to pick up the forensic markers for the
    distinction of forged from genuine and identify the author of a given handwriting
    sample. The machine-learning capabilities can differentiate between natural variations
    and fundamental differences for identifying potential forgeries and can also differentiate
    one writer from another or identify one writer from among a group of writers based
    on important forensic markers of individuality in handwriting.


    Authorship attribution with deep learning models and especially neural networks
    and recurrent neural networks (RNNs) presents unparalleled capabilities. Through
    the processing of extensive textual data these models can discern subtle nuances
    in writing styles, contributing to more accurate determinations of document authorship.
    The ability of deep-learning models to learn intricate patterns in the way individuals
    express themselves in text enhances their effectiveness in authorship attribution
    tasks, making them powerful tools in forensic document analysis.


    **Signature Verifications:** Signature verification is another very important
    and voluminous forensic task in document examination. Signatures are examined
    for specific class and individual characteristics, natural variations and inherent
    signs of forgery to establish whether it is a genuine or forged signature. Machine-learning
    models can be trained on a large and diverse group of genuine and forged signatures
    to help them learn the specificities and distinct characteristics of either type
    so that they not only examine but bring about higher accuracy, speed and efficiency
    in forensic examination of questioned signatures.


    Convolutional neural networks (CNNs) have demonstrated high effectiveness in signature
    verification tasks. When trained on datasets that include both authentic and forged
    signatures and these models can automatically identify and extract relevant features.
    This capability enhances the accuracy of distinguishing between genuine and fraudulent
    signatures. CNNs excel in capturing spatial hierarchies and patterns and making
    them well suited for tasks such as signature verification in forensic applications.


    **Text Analysis:** Besides handwriting and signature examination sometimes the
    forensic examination of text in a document itself can reveal a lot of important
    facts about its originality, authorship or possible tampering. The pattern, writing
    habits, choice of words, misspellings, margin, start and finish, etc., can be
    helpful under the umbrella of examination of forensic stylistics of the text or
    content. Machine-learning algorithms, if trained for such examinations on extensive
    datasets, can be extremely helpful in figuring out the consistency or unusual
    departures from the norm.


    Recurrent neural networks (RNNs) and their specialized variant and long short-term
    memory (LSTMs) networks and play a significant role in'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'textual content analysis. These models excel in analyzing the sequential nature
    of language and allowing them to identify patterns and anomalies that may indicate
    document tampering or forgery and as highlighted by the work of [10]. Their ability
    to capture dependencies in sequential data makes them valuable tools in forensic
    applications for uncovering linguistic patterns that may suggest alterations or
    inconsistencies in documents.


    **Ink and Paper Analysis:** Several cases in questioned documents call for analysis
    of ink as well as writing surface. ML algorithms can be trained to tackle and
    examine problems pertaining to ink and paper such as their physical properties,
    age of documents, type of material used, etc. Answers to these questions would
    be crucial in determining forgery, tampering, ageing, etc. [11].


    # Forgery Detection Leveraging Deep-Learning Models


    Deep-learning models are capable of learning and processing complex and difficult
    patterns, which can be crucial in detecting forgeries in documents encompassing
    handwriting characteristics, personal styles, ink properties or other document-related
    specificities which can be instrumental in reaching the conclusion of whether
    a particular document has been forged or tampered or not. Their ability to discern
    subtle details and patterns enhances the accuracy and efficiency of identifying
    fraudulent documents and making them valuable tools in forensic document examination.


    # Machine Learning Techniques for Signature Validation


    One of the most frequent tasks in forensic document analysis is signature verification.
    Its goal is to ascertain whether a signature under suspicion corresponds with
    known signature samples. One way to look at the process from the perspective of
    automating it is as a machine-learning problem based on a population of signatures
    [12, 13].


    **Machine Learning tasks fall into two categories:** Person-dependent (also known
    as special) learning and person-independent (also known as general) learning.
    A population of authentic and counterfeit signatures belonging to several persons
    provides general learning about the distinctions between authentic and counterfeit
    signatures for all individuals. Comparing a questioned signature to one authentic
    signature is possible using the general-learning model. Through several samples
    of just that person’s signature, special learning is able to identify within-person
    similarities in a person’s signature [14].'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Validating the genuineness of signatures is the most common activity in the
    field of forensic document analysis The inquiry about the validity of a signature—does
    this questioned signature (Q) match the known, real signatures (K) of this subject
    is the one that comes before a document examiner the most frequently. When rendering
    a determination in forensic casework, a forensic document examiner, often referred
    to as a questioned document (QD) examiner, draws on years of experience analysing
    signatures [15]. This can be lengthy, challenging and prone to human bias. Thus,
    the task of automating the verification of signatures as a machine-learning problem
    makes sense. The ability of a program to learn from examples improves as the number
    of examples rises, this is considered its machine-learning capability. Determining
    the authenticity of a questioned signature is the performance task of signature
    verification [16].


    The key is to distinguish between variations that are authentic and those that
    are counterfeit [17]. To put it simply, the learning challenge is to learn a two-class
    classification issue where the input is the difference between two signatures.
    Comparing the disputed signature to every known signature completes the verification
    operation. One way to conceptualize the general learning issue is as a learning
    process whereby near misses serve as counter-examples [18].


    Learning from authentic examples of a specific individual is the main goal of
    special learning. Finding out how each genuine signature in the class differs
    from the others is the main goal. Determining whether or not the questioned signature
    belongs to that class is the verification job, which is effectively a one-class
    problem.


    The available information on automated techniques for verifying signatures is
    sporadic. It''s also important to consider automatic writer verification techniques,
    which include figuring out if a handwriting sample rather than a signature was
    indeed written by the specified person [19]. Identification is the process of
    figuring out who, among a particular group of people, could have written the material
    in question. The challenges of handwriting identification and verification are
    similar to those of biometric identification and verification, about which a substantial
    body of literature exists. Recently, there has been talk of using a machine-learning
    approach for biometrics.


    # Feature Extraction and Similarity Computational Approach


    Since every human being develops distinct penmanship tendencies that serve as
    a representation of their signature, signatures are trusted for identification.
    Therefore, two algorithms, one for extracting characteristics and the other for
    comparing the similarities between two signatures based on'
