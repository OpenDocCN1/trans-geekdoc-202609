- pgno: 87
  md: 'should monitor the process of training these machine-learning algorithms so
    they provide accurate and reliable results at the end of the process.


    +   - **Complexity of Pathological Data:** Data obtained from pathological results
    may be ambiguous and even diverse, involving different tissue specimens, histological
    changes and diagnostic outcomes of postmortem examinations. Such complex data
    may not be easy to understand by machine-learning algorithms, and this could be
    a problem, especially when the results are rare or unusual clinically. Machine
    learning is useful to forensic pathologists, but the results need to be thoroughly
    checked and validated to ascertain their accuracy in forensic examinations [26,
    33, 34].


    # Steps for Performing Analysis in Machine Learning in Forensic Pathology


    +   - **Conceptualization and Problem Formulation:** This step involves defining
    the particular forensic pathology problem or task that is going to be solved with
    the help of machine learning. Scientists define the goal, research questions and
    evaluation criteria to guide the development of machine learning models. For instance,
    in pathology, the problem could be to diagnose the probability of a tissue sample
    being cancerous or benign by examining histological characteristics.

    +   - **Data Acquisition and Preparation:** During this step, researchers obtain
    relevant datasets from hospitals, research organizations, or a public database
    for the purpose of training ML algorithms. They preprocess the data to eliminate
    errors, inconsistencies and noise to make it suitable for analysis and more reliable.
    In pathology, this may involve obtaining digital histopathology slides and the
    related clinical metadata, including patients’ demography and diagnosis.

    +   - **Feature Extraction and Representation:** This stage involves transforming
    the raw data into features that are useful in the process of training the machine-learning
    algorithms. In pathology, features could mean the shape, size or location of certain
    cell types, the location of tissues in the body, or a measure of the intensity
    of staining of a tissue. More complex forms of machine-learning models, such as
    convolutional neural networks (CNNs), do not require features to be extracted
    as they can automatically be learned from digital pathology images.

    +   - **Model Development and Evaluation:** Scientists usually develop machine-learning
    models with the help of techniques such as logistic regression models, random
    forests or deep-learning models.'
