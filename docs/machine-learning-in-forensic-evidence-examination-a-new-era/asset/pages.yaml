    is a method utilized by CNNs, and it involves applying a progression of channels
    which can be trained to the information or input data. A strategy known as pooling
    is utilized to consolidate the results of the channels, which limits the spatial
    aspects while holding the main data. The channels or filters are premeditated
    to capture the local features and patterns such as surface texture and edge patterns,
    etc. Multiple pooling layers are an important characteristic of CNN models. The
    CNN models capture hierarchical depictions of data to extract the relevant features
    from the input data while the pooling layers downsample the feature maps, thereby
    reducing the computational load but still safeguarding the vital information within
    the data. All these retrieved features are then cumulatively processed through
    all the associated layers of CNN to make the final prediction [32]. CNNs are especially
    useful in classifying images, visual data, image recognition tasks, facial identification
    in forensics and object detection tasks for general and forensic applications
    owing to their ability to capture and work with local and spatial patterns and
    ability to take advantage of translational invariance and hierarchical structure.


