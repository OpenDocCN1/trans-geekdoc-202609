- pgno: 72
  md: 'that remains to be addressed. The rate of accuracy of the AI tools is a very
    crucial factor in determining the success of the tool. It has been observed that
    in cases where large amounts of data are required to process and analyze, the
    AI tool fails to be accurate and may result in false positive or negative results.
    The lack of accuracy in investigating enormous documentary evidence may lead to
    ineffective investigation of all the facts of a case and ultimately result in
    compromising the evidentiary value of the same [27].


    The AI tools are trained over time on large sets of data to identify patterns,
    make intelligent decisions and predict outcomes. Its efficiency and utility depend
    on the training process it is subjected to, which facilitates the AI-ML system
    to produce an output. The AI-ML tool has a limited understanding of the situation
    presented to it. It lacks the ability to deduce or comprehend the context independently
    outside the scope of its learning [28].


    The handwriting of an individual is highly unique and is characterized by the
    presence of natural variations. Natural variations can be defined as the innate
    quality of a writer which is associated with the inability to execute the same
    manner of handwriting operation each and every time, giving birth to a range of
    variables in the handwriting. External factors such as intoxication, body posture,
    health, age, etc., also affect the degree of variation found in handwriting. While
    examining the handwriting samples the forensic examiner needs to assess the document
    keeping in mind all the possible variations that the writer may execute while
    writing. The AI-ML forensic tools rely on the dataset which has been fed to them
    for their programming, therefore lacking the normal ability to detect variations
    in handwriting which have been affected by extrinsic factors or disguise. Also,
    it is important to be conscious of the fact that the AI-ML software lacks the
    common sense of reasoning which becomes vital in decision-making and opinion framing
    [28].


    AI-ML tools are also devoid of the capabilities to understand human emotions;
    all documents are logically analyzed and processed by the tool, therefore while
    examining documentary evidence and summarizing all the facts pertaining to a case,
    the tool fails to consider emotional angles of the case which might be relevant
    to acknowledge while furnishing a final opinion. The AI tool would remain as a
    supplement in such instances and would not conceive the same result and accuracy
    that Human Intelligence would serve [28, 29]


