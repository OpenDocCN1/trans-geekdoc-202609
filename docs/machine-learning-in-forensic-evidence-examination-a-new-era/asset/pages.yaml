- pgno: 215
  md: 'Machine learning (ML) commonly referred to as a subfield of artificial intelligence
    is capable of processing large amounts of data based on its algorithm and can
    learn from these data to improve further data analytics, classification and pattern
    identification and finally predict things. Machine learning in big data analytics
    can help businesses, industries and even law enforcement agencies to identify
    patterns, forecast outcomes in a precise manner and gain valuable insights from
    vast amounts of data [1]. Thus, big data with its velocity, volume and variety
    traits can be effectively handled and necessitates the application of sophisticated
    methods such as machine learning for its analysis [2].


    # Basics of Machine Learning


    Understanding the core fundamentals of machine learning is quintessential before
    applying it in the analysis of big data. Machine-learning algorithms enable a
    system to take input data, learn from it, produce meaningful insights or predict
    things and constantly improve its performance based on more data availability
    for perfecting its predictive attribute. Primarily there are three basic types
    of machine learning: (i) supervised learning, (ii) unsupervised learning and (iii)
    reinforcement learning.


    When the system learns and gets trained on labelled datasets and accordingly makes
    predictions, it is called supervised learning [3]. While it may have a very high
    accuracy percentage in prediction as it is trained on a labelled dataset but may
    suffer from failing to identify unknown patterns which were not part of the training
    dataset. The system uses logistic regression and linear regression for binary
    classification and predicting continuous variables [4]. For improved output, these
    models are required to be trained on huge amounts of data allowing them to learn
    scalable implementations, parallel processing and distributed computing techniques
    [5].


    Conversely, when the system is trained on unlabelled datasets and the system develops
    the ability to make predictions or generate outputs based on its ability to identify
    new patterns and structures, it is known as unsupervised learning. The system
    explores hidden patterns, relationships and similarities between the unlabelled
    data to come out with a specific probability for new input data [6].


    Sometimes, a semi-supervised learning model is also found which works with partial
    similarity to both supervised and unsupervised learning by using both labelled
    and unlabelled data for training. Reinforcement learning is feedback-based learning,
    where after every output, the system enhances its learning through reward–penalty
    feedback. The surrounding has a definitive impact on the system learning in this
    case. The system improves every time after receiving positive or negative feedback
    on their outcomes.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Preprocessing and Feature Engineering


    Big data by its nomenclature is characterized by large voluminous data which may
    be very complex as well as unstructured. Thus, to process such data through machine-learning
    tools, it is important to preprocess the raw data through feature engineering
    involving steps such as cleaning and altering the raw data. Cleaning typically
    refers to processing the data to reduce noise, manage missing values and resolve
    inconsistencies. For altering the data or transforming the data as we may call
    it, scaling normalization and encoding the variables should be done [7]. Feature
    engineering can further help to pick pertinent features from within the raw data
    for improving the overall performance and output of ML models.


    # Neural Networks and Deep Learning


    The ability of machine learning to deal with large volumes and complexly structured
    data through deep learning has gained immense traction of late. Recurrent neural
    networks (RNNs) are frequently used for sequential data analysis such as voice
    and natural language processing. Similarly, convolutional neural networks (CNNs)
    find a lot of application in tasks pertaining to image identification [8]. The
    deep-learning models have to a great extent transformed the ability of systems
    towards language understanding and machine translation. The deep-learning models
    can be effectively trained on massive amounts of data with inherent complexity
    using distributed computing frameworks, parallel processing and specialized hardware
    accelerators such as tensor processing units (TPUs) and graphics processing units
    (GPUs).


    # Applications of Big Data


