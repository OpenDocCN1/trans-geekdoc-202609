  md: '# Application of Machine Learning in the Field of Forensic Fingerprint Sciences


    ASHISH BADIYE, NEETI KAPOOR AND MUSKAN SINGAL


    # Introduction


    Machine learning is the branch of artificial intelligence and can be defined as
    the process by which a machine is learned or trained to work more efficiently.
    The sample is trained by feeding the input–output data, or input data alone, and
    the machine’s behaviour is studied. This means how the machine behaves or responds
    to all possible inputs, or we can say that machine learning involves training
    machines to recognize patterns, extract insights and make predictions or decisions
    based on data. Therefore, we can define machine learning as the equation or algorithm
    used to improve some performance measures while executing some tasks through training
    (Jordan and Mitchell, 2015). In simple words, machine learning teaches the machine
    how to handle extensive data efficiently. In cases of large data, humans sometimes
    cannot interpret the data or extract useful information from the data. In those
    cases, machine-learning algorithms are used to interpret data and give conclusions
    based on previously fed data (Mahesh 2020).


    Machine learning has revolutionized how machines learn, adapt and make decisions.
    Different types of machine-learning algorithms are used in a wide variety of data
    and to solve different machine-learning problems. For example, linear regression
    algorithms are used to understand the relation between two variables. It draws
    the straight line that best fits the variables and predicts one value based on
    the value of another variable. The decision tree algorithm uses a series of questions
    to reach a conclusion. The random forest algorithm combines the result of many
    decision tree algorithms and predicts the conclusion. Neural network algorithms
    are like a simplified model of the human brain. They work by adjusting connections
    between neurons to understand the pattern (Hastie et al., 2009; Murphy 2012; Mahesh
    2020).'
