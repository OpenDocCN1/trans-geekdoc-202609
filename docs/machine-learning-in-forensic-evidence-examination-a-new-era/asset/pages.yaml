    5


    SATISH KUMAR AND JENNIFER JOHNSON


    # Introduction: Forensic Biological Evidence


    The term ‘biological’ represents living organisms, life processes and their interactions.
    Evidence, on the other hand, is information that is presented in court to support
    an argument that has been legitimately stipulated as evidence of that claim to
    an authorized tribunal. Blood, saliva, semen, hair etc., all are referred to as
    forensic biological evidence, that is commonly encountered at a crime scene [1].
    This biological evidence holds specific characteristics that aid forensic experts
    and investigators in carrying out forensic investigations judicially. During any
    forensic investigation, this evidence is of paramount significance for many reasons.
    It can connect a suspect to a victim, an object or a crime scene. This link can
    further be crucial in assembling evidence against the accused [2]. Also, forensically
    relevant biological evidence has efficiently helped in exonerating the innocent
    who were wrongfully convicted of a crime. DNA analysis is a powerful investigative
    technique useful for identifying individuals and establishing familial relationships.
    Moreover, forensic biological evidence is an essential part of criminal investigations
    and court procedures since it independently validates and supports the key elements
    of the case, serving as corroborative evidence. The scientific and objective aspect
    of such evidence lends credibility and dependability to the case as a whole.


    Biological evidence refers to samples or specimens containing biological material,
    usually collected at a crime scene. It can be categorized into various forms based
    on its origin, which can be human or non-human (animal or plant). As illustrated
    in Figure 5.1, forensic biological evidence is broadly grouped into two categories,
    that is, body fluids (saliva, blood, urine, sweat, semen, tears, vaginal and nasal
    secretion) and non-body fluids (teeth, nails,'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_101_0.png)


    Figure 5.1 Categorization of forensic biological evidence.


    bones, hair, tissues, botanical and microbial evidence) [3]. In serology analysis,
    biological fluids are identified through the use of both presumptive as well as
    confirmatory testing. Presumptive testing relates to a rapid kind of testing that
    indicates the presence of bodily fluid under investigation. On the other hand,
    confirmatory tests are relatively specific and take longer time for analysis as
    compared to the presumptive tests [4].


    The quality and reliability of forensic analysis may be majorly impacted by several
    challenges faced while analyzing such biological evidence during forensic investigations.
    External factors (temperature, humidity, flora and fauna of the surrounding area)
    tend to degrade these biological samples rapidly. Body fluid identification in
    forensic science holds significant prominence as it provides the capability to
    differentiate them individually. However, there are enormous challenges faced
    in dealing with these body fluids during forensic investigations. Low sample quantity
    or sample mixtures majorly contribute to any hindrance during the analysis. Therefore,
    there is always a demand for significant advancements in forensics so as to overcome
    these challenges. Computational models coupled with human abilities will venture
    new avenues in the field of forensics by offering promising measures to uplift
    scientific assessment and thereby ensure accuracy and precision in forensic investigations.


    # Machine-Learning Approaches


    Machine learning (ML) encompasses a broader collection of varied algorithms aimed
    at attempting to identify computational data patterns and then utilizing them
    to derive mathematical models which are capable of generalizing'
  merge: -1
  img_proc: true
