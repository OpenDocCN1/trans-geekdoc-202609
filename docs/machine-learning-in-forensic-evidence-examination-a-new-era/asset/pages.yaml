- pgno: 224
  md: '# Introduction to Deep Learning


    Learning how to represent data hierarchically, deep learning relies on training
    neural networks with numerous layers. Deep learning makes it possible to automatically
    extract intricate features and patterns from raw data, in contrast to typical
    machine-learning techniques that rely on manually created features. Due to its
    capacity to handle difficult tasks including natural language processing, speech
    recognition and image recognition, it has drawn considerable attention and gained
    popularity.


    # Historical Background


    The idea of artificial neural networks was first proposed in the 1940s and 1950s,
    which is where deep learning first emerged. Deep learning sprang to prominence,
    however, in the 1980s and 1990s because of the creation of techniques such as
    backpropagation that made it possible to train deep neural networks effectively
    [27]. Deep learning has advanced more quickly in recent years thanks to improvements
    in computer power, the accessibility of large-scale datasets and the creation
    of specialized hardware (such as GPUs).


    # To Understand Deep Learning, It Is Essential to Grasp Several Key Concepts


    +   - **Neural Networks:** Deep learning is built on neural networks. They are
    made up of layers of neurons, which are interconnected nodes. Each neuron takes
    in information, uses an activation function and sends the output to the layer
    below. An input layer, one or more hidden layers and an output layer are possible
    in neural networks. The data can be represented in progressively more complicated
    ways thanks to the hidden layers.

    +   - **Activation Functions:** The neural network can simulate intricate interactions
    between inputs and outputs thanks to the non-linearities introduced by activation
    functions. The sigmoid, tanh and ReLU (rectified linear unit) activation functions
    are frequently used. They use a neuron’s input to determine its output value.

    +   - **Backpropagation:** Deep neural networks are trained using the core algorithm
    of backpropagation. It involves propagating mistakes backwards from the output
    layer to the input layer to iteratively change the network weights. Backpropagation
    enhances the performance of the network by minimizing the discrepancy between
    expected and actual outputs.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   - **Deep Neural Networks:** Deep neural networks may learn hierarchical
    data representations since they have several hidden layers. From the input data,
    each layer pulls features that are more and more abstract. The depth of the network
    makes it suitable for handling high-dimensional and unstructured data since it
    enables the learning of complicated patterns and complex relationships.

    +   - **Deep Learning Architectures:** Different deep learning architectures have
    been created to handle various data and task types. Convolutional neural networks
    (CNNs) and recurrent neural networks (RNNs) make use of spatial correlations and
    temporal correlations respectively to analyze image and video and sequential textual
    data.

    +   - **Deep Neural Networks:** The underlying innovation of deep learning is
    deep neural networks. They are composed of interconnected neurons or hubs organized
    in layers. Every neuron learns, actuates it and afterwards sends its result to
    the layer underneath. Deep neural networks can learn progressive information representation,
    which empowers them to perceive unpredictable patterns and connections.

    +   - **Feedforward Networks:** It is also called multilayer perceptrons (MLPs),
    and can be considered as the most basic type of deep neural network. They comprise
    a hidden layer or layers, an output layer and an input layer. Data goes in a unidirectional
    manner from the input layer through the hidden layers to the output layer.

    +   - **Convolutional Neural Networks (CNNs):** CNNs were created with the sole
    purpose of processing grid-like input, such as photos and movies. They make use
    of the idea of convolution, which entails applying a group of teachable filters
    on the incoming data. Convolutional layers are used by CNNs for feature extraction,
    and pooling layers are used for downsampling and lowering the number of spatial
    dimensions. After that, fully linked layers for classification or regression receive
    the collected features. In applications including image classification, object
    identification and image segmentation, CNNs have displayed excellent performance
    [28].

    +   - **Recurrent Neural Networks (RNNs):** To handle issues such as time series,
    sequential data, speech and text, recurrent neural networks (RNNs) were developed.
    RNNs, as opposed to feedforward networks, have recurrent connections that enable
    data to remain and be processed throughout time steps. RNNs can detect temporal
    dependencies in the data as a result. An RNN uses its hidden state as input and
    memory at each time step, which affects predictions made later. These two well-liked
    RNN variations, long short-term memory (LSTM) and gated recurrent unit (GRU) help
    to solve'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'the vanishing gradient issue and make it easier to learn long-term dependencies
    [28].


    +   - **Deep Belief Networks (DBNs):** A class of generative models known as deep
    belief networks (DBNs) consists of numerous layers of stochastic binary units.
    Using a method known as restricted Boltzmann machines (RBMs), DBNs are trained
    in an unsupervised way. The deep belief networks when trained can generate new
    samples, which resemble the training data set. DBN models can be widely used for
    dimensionality reduction, collaborative filtering and generative modelling [28].


    # Deep Neural Networks for Classification and Regression


    Deep learning has proven to be an exceptionally well-performing model for recognizing
    complex correlations, capturing hierarchical representations and in number of
    categorization or classification tasks. Let us see how deep learning models work
    in three important classification tasks: sentiment analysis, text categorization,
    and image identification:


    +   - **Deep Learning for Image Recognition:** Image recognition through deep
    learning models is a challenging task involving classifying patterns, and object
    or facial identification from a photograph or any form of visual data. However
    deep learning models such as convolutional neural networks (CNNs), capable of
    mining out important features from raw pixel data have powered the image recognition
    abilities tremendously. Pre-trained CNN models use their multiple interconnected
    layers, and pooling layers to extract the local features and patterns for obtaining
    high accuracy in recognising images and object identification from new datasets
    [29].

    +   - **Deep Learning for Text Categorization:** Text classification involves
    characterizing text-based data into predetermined groups, such as papers or articles.
    Recurrent neural networks (RNNs) and transformer models have been found to be
    particularly promising with their applications in text categorization. RNNs are
    able to explore and establish contextual relevance and sequence of information
    in the given data so the RNN models can easily carry out document classification,
    sentiment analysis and topic modelling. Similarly, having trained on extensive
    textual data and by implementing self-attention methods, transformer models such
    as BERT (bidirectional encoder representation from transformers), have proved
    to be a valuable tool in natural language processing [29].'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   - **Deep Learning for Sentiment Analysis:** The objective of sentimental
    analysis is to recognize the emotion or polarity communicated in text, for example,
    whether it is positive or favourable, or negative or against or neutral or impartial.
    By gathering the semantic and context-oriented subtleties in the message, deep
    learning approaches have shown to be capable of sentimental analysis. Sentimental
    analysis tasks are effectively performed by recurrent neural networks (RNNs) and
    convolutional neural networks (CNNs). While RNN models such as LSTM and DRU excel
