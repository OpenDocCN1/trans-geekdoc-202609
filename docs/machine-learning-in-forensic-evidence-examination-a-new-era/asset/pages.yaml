  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_32_0.png)


    Figure 1.6 Types of machine learning. Source: https://www.dreamstime.com/machine-learning-types-supervised-vs-unsupervised-reinforcement-glance-vector-editable-stroke-colors-image297519539


    Supervised Learning: Supervised learning is a method where algorithms are trained
    on labelled data to understand the relationship between inputs and outputs. These
    algorithms are then applied to projects that require a clear, known target for
    the algorithm to achieve.


    Unsupervised Learning: Unsupervised learning is a method where the algorithm works
    on unlabelled data. When analyzing unlabelled data, the algorithm attempts to
    find inherent patterns or structures in the data. Forensics experts can better
    utilize machine learning when they understand the primary operating conditions
    and use cases of the two primary methods: supervised and unsupervised learning.
    Clustering algorithms, such as k-means and hierarchical clustering, are important
    to understand when forensic experts think about applying unsupervised learning
    to their projects.


    Reinforcement Learning: Reinforcement learning involves an agent learning from
    feedback in a dynamic environment, which can help in cybercrime investigations
    and resource optimization.


    Understanding these machine-learning types helps forensic experts uncover patterns,
    streamline analysis and make better decisions.


    # Challenges, Ethical Considerations, Interpretability and Explainability of Machine-Learning
    Models


    When it comes to machine learning in forensic applications, two things are extremely
    important: data quality and bias. And for good reason: in the'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'contexts where learning algorithms are being taught to work, the correctness
    and fairness of their results simply have to be taken as a given if they are to
    be relied upon at all. Forensic science, after all, is not only about working
    with evidence; it is about working with evidence that has been found to be accurate,
    complete and consistent. If it is not, then the results being worked upon—and,
    in the case of machine learning, the models being worked with—aren’t worth much
    in terms of both predicting future results and ensuring those results are fair.


    Enhancing data quality involves identifying and repairing errors and removing
    outliers. We must involve data from all sorts of groups and conditions to reduce
    bias. We also use algorithms that train with a reduced bias and thus result in
    a much fairer set of answers. And, of course, we try to keep those models as understandable
    as possible. That is especially important in forensics, where we affect people’s
    lives (and make decisions that can ultimately result in someone being imprisoned
    or not) and where the work we do needs to be understood by experts, investigators
    and lawyers (who also have to make decisions that can affect someone’s being imprisoned
    or not).


    To enhance clarity, we can employ more straightforward models, emphasize the key
    parts of our data, elucidate predictions and utilize rule-based systems. In a
    courtroom, the evidence provided by these models must be understood and trusted
    by judges and juries. When we apply machine learning to forensic science, we must
    ensure that we are protecting privacy and security, because the data we are working
    with—often biometric or genetic in nature—is very sensitive. The challenges are
    not small: the need to not lose data usefulness while adding privacy necessary
    for data to be useful; the need to have effective model protection while enabling
    necessary access to data for use by law enforcement; all of this break down into
    the three facets of privacy, security and ethics. Addressing these involves a
    number of strategies: using differential privacy, secure multiparty computation
    and encryption; obtaining informed consent; and ensuring that the forensic analysis
    of models not only is accurate but also respects the privacy rights of individuals.


    # Future Directions and Emerging Trends


    # Deep Learning and Neural Networks


    Forensic science is now part of the machine-learning revolution, and the most
    powerful tools of this revolution are deep learning and neural networks. These
    have given us new architectural forms—such as CNNs, recurrent neural networks
    (RNNs), transformers and generative adversarial networks (GANs)—that handle the
    most basic types of forensic evidence, such as images, videos, audio and text.
    These networks, however, need a lot'
  merge: -1
  img_proc: true
