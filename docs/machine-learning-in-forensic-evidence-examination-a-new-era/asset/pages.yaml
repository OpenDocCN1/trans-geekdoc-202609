  md: 'possesses unique soil compositions. Thus, when soil samples are collected from
    a suspect’s person, clothing or vehicle, they can provide a geographical location
    or geographic fingerprint that links the individual to a specific area or even
    a particular crime scene [26]. This association can be essential in verifying
    or challenging a suspect’s alibi. The Lindbergh Kidnapping Case (1932) is a case
    in which the child of Charles Lindbergh was kidnapped from their home in New Jersey.
    Soil evidence was crucial evidence in this case which is proven effective in solving
    this case. Soil found on a ladder used in the kidnapping was analysed and traced
    back to a location near the home of Bruno Hauptmann, who was subsequently arrested
    and convicted. The case is a landmark example of how soil evidence can link a
    suspect to a crime scene.


