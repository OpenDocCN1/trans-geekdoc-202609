    is an asset as well as a challenge for all modern-day enterprises. Big data is
    a great enabler if put to use in a meaningful manner. A careful review can present
    a wonderful correlation between your past actions and past outcomes. The mistakes
    are retrieved and opportunities for course correction for a better outcome in
    future are promulgated. An insight into what better work has been done in the
    past is also evidenced and gives a clue about how it can be further improved.
    Thus, several procedural steps can be amended, resurrected or augmented based
    on big data analysis. Figure 12.1 shows various techniques utilized for data mining.
    Resource management and its optimal applications can be ensured for enhanced efficiency.
    Reasons for failures can be determined and expunged. Trends and specific patterns
