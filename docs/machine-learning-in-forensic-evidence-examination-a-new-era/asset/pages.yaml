  md: 'The J48 decision tree algorithm has been utilized in fingerprint-based gender
    classification. The accuracy of this approach is approximately 96.28% for the
    four fingerprint features namely, ridge count, ridge density, ridge thickness
    to valley thickness ratio and white line count (Abdullah et al., 2016).


    # Machine Learning in Palm Print and Hand Print Analysis


    Besides fingerprints, biometric parameters such as handprints and palm prints
    are also majorly used in a person’s identification. Due to the rapid growth and
    technological advancement, a reliable and secure biometric identification method
    was required. Therefore, it increases accuracy, reliability and security. Several
    models based on machine learning were introduced for palmprint/handprint identification,
    recognition and examination (Zhang et al., 2003). Handprint and palm print identification
    are primarily based on geometrical and texture characteristics, which are essential
    for stable recognition features (Kong et al., 2008; Zhao and Zhang, 2020). Palm
    prints have several unique features such as principal lines (flexion creases),
    minutiae points, wrinkle ridges (secondary creases), deltas, patterns and singular
    points that can be used in individual identification (Kong et al., 2009).


    Measurements of handprints were used to determine the gender of the Sinhalese
    population in Sri Lanka. The results concluded that the classification and regression
    tree (CART) algorithm can differentiate gender with 91.67% accuracy with hand
    lengths, handbreadth and palm length. Also, other algorithms such as SVM and naive
    Bayes showed results with low accuracy, 83.33% (Dayarathne et al., 2021). PalmNet
    is the method used to extract highly discriminative palmprint-specific descriptors.
    This method uses the application of the Gabor filter in CNN. It was tested on
    databases captured using touchless acquisition procedures and heterogeneous devices.
    It was found that this method gives high accuracy (Genovese et al., 2019). Alexnet
    is also a structure based on CNN. It is used in palmprint recognition and identification
    using the PReLU activation function and recognition accuracy was found to be 99.9%
    (Gong et al., 2019).


    # Advantages and Disadvantages of Machine Learning


    Humans have been using different machines or techniques to simplify their lives.
    Machine learning is one of the techniques that humans use to make their work easier
    (Mahesh, 2020). Forensic science deals with large databases that are reference
    databases for standard values. Therefore, a significant'
