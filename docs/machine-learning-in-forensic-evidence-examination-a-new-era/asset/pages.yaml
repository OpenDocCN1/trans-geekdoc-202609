  md: '# Potential Application of Machine Learning in Forensic Anthropology 10


    VINEETA SAINI AND ARUNIMA DUTTA


    Forensic anthropologists can provide deep insights into the analysis and identification
    of skeletal remains in criminal proceedings using detailed knowledge about bone
    development and morphological variations [1]. In cases of mutilated, decomposed
    and charred bodies, where DNA or antemortem dental records of the deceased are
    not available for comparison purposes, anthropological examination can pose as
    a helpful tool for such a challenging task. It also forms an integral part of
    analyzing the cause, manner, mode and time since death of the deceased. Forensic
    anthropologists also render their skills in the identification of victims of mass
    murders, wars, genocides and mass disasters such as building fires, building collapses,
    train accidents, ship sinkings and airplane accidents [1]. This personal identification
    can be established by the compilation of successional comprehensive information
    regarding the sex, stature, ethnicity, age and congenital or traumatic deformities,
    followed by craniofacial reconstruction and facial superimposition of the victim’s
    skeletal remains. This database can be created by collecting the measurements
    of different areas of the human skeleton directly or by imaging techniques. Many
    studies conducted previously on the human skeleton have shown promising accuracies
    for the pelvis, skull, mandible, sternum and long bones in establishing a biological
    profile [2–4].


    # Challenges Faced by Forensic Anthropologists


    Even though forensic anthropologists aid in personal identification, they frequently
    face obstacles when conducting their investigations.


    +   - **Insufficient Victim Information and Lack of Context:** Forensic anthropologists
    often face a shortage of information about acquired bones and skeletal remains,
    such as the location where the remains were located or any objects found with
    the deceased. This leads to reduced chances of correct biological profiling, time
    since death estimate and cause of death.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   - **Damaged Skeletal Evidence and Taphonomical Changes:** Fragmented skeletal
    remains or injuries caused during autopsies can cause a hindrance in personal
    identification and determination of bone trauma. Further, the taphonomical changes,
    weathering and scavenging activities may result in fragmentation, brittleness,
    crumbling, colour change or mineralization of bones and hinder the identification
    process.

    +   - **Population Intermixing:** The most difficult challenge faced by forensic
    anthropologists is the intermingling of populations. With the immigration of people
    from their native regions in search of better opportunities, it becomes difficult
    to obtain population-specific data.

    +   - **Ethical Management:** Since forensic anthropologists have to deal with
    accidental, homicidal and mass disaster victims, ethical management and a humanitarian
    approach have to be ensured while dealing with the family of the deceased. When
    the remains are discovered in isolated or politically insecure locations, access
    and authorization to carry out an investigation may be restricted, making this
    difficult.

    +   - **Objectivity in Opinion:** Forensic anthropologists are required to be
    more objective while ascertaining the details rather than being biased and subjective.


    Although forensic anthropologists face a multitude of challenges, their expert
    opinion garners immense importance in establishing the admissibility of such evidence
    in the court of law, ensuring justice for the family of the victim.


    During skeletal examination, forensic anthropologists use a range of techniques
    such as radiology, visual assessment of morphological characteristics and measurements
    between particular anatomical landmarks but these methods require technical skill
    and time.


    Using artificial intelligence (AI) in forensic anthropology speeds up the analysis
    process and improves accuracy. The term ‘artificial intelligence’ refers to the
    replication of human knowledge by machines to accomplish tasks easily. It uses
    a detailed database to perceive information, process it and provide subsequent
    action accordingly [5]. AI possesses the capacity to swiftly, accurately and efficiently
    analyze large volumes of data. It can also recognize patterns and make predictions,
    which can be helpful in forensic investigations.


    These days, AI is extensively used in forensic anthropology, specifically its
    applications in facial recognition, skeletal analysis and the identification of'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'human remains. However, these estimations are based on data extracted by the
    scientists through mathematical formulas and professional experiences. Therefore,
    they can be time-consuming and inaccurate especially while processing large amounts
    of data [6]. Hence incorporating AI and its different branches has shown some
    promising advancements in the field of personal identification. With the advent
    of technology, various imaging techniques such as radiographs, computed tomography
    (CT) scans, magnetic resonance imaging (MRI) and cone bone computed tomography
    (CBCT) have eased the process of anthropological examinations. But still, some
    of the facets of artificial intelligence especially in detecting skull damage
    from CT scans and facial soft tissue prediction from the skull are yet to be explored
    by forensic anthropologists [7, 8].


    AI also has various subfields one of which is machine learning (ML). ML algorithms
    are used to improve the classification performance of sex, age, stature and ancestry
    estimation based on skeletal remains. It’s a segment of artificial intelligence
    capable of predicting without direct programming, utilizing mathematical models
    created from sample ‘training’ data.


    It contains certain algorithms prepared to deliver specific responses based on
    imported databases and training. It enables the machine to understand human instructions
    and evolve to an extent where it can function without any human intervention.
    Machine learning includes various types of algorithms, which are frequently used
    to estimate sex, stature, age and ancestry, such as linear discriminant function
    analysis, support vector machines, artificial neural networks, decision trees,
    random forest, naive Bayes classification, binary logistic regression, multinomial
    and penalized multinomial logistic regression, multivariate adaptive regression
    splines and extreme gradient boosting (XGB), etc. (Figure 10.1) [9–15]. This is
    achieved by artificial neural networks that form a part of deep learning which
    is yet another subset of Machine Learning itself [16].


    # Discriminant Function Analysis (DFA)


    Also called linear discriminant (LDA) or canonical discriminant analysis while
    quadratic discriminant analysis is a type of LDA, which is used to separate non-linear
    datasets. Due to its computational simplicity, discriminant function analysis
    (DFA) is widely used in anthropology to explore and understand patterns of biological
    variation among different groups or populations [17]. DFA classifies individuals
    into predetermined groups by analyzing measured variables such as skeletal or
    dental traits, along with cranial or postcranial measurements for sex estimation
    [18–20]. By analyzing'
