  md: '# Advantages of the Approaches


    Forensic investigators can benefit from machine-learning techniques as they are
    capable of handling huge datasets related to investigations much more efficiently
    than conventional methods. The rapid development of artificial intelligence technologies
    helps assist law enforcement agencies and forensic experts, police personnel in
    not only detecting crimes but also in preventing and predicting them [2]. Machine-learning
    algorithms are designed to identify crime patterns and discover suspicious anomalies,
    forecast future crime locations, evaluate criminal risk factors and reveal criminal
    networks [39]. Machine-learning models can be trained to automatically sort and
    classify different types of trace evidence. For example, in hit-and-run cases,
    it can automatically tell from which model of vehicle the paint chip may come
    from or what type of fibres are used. It is quick and gives more accurate results.
    Machine learning is able to function with greater efficiency since its performance
    is not affected by subjective judgement, it never becomes exhausted, and it is
    not influenced by sentiments [40].


    # Disadvantages of the Approaches


    The implementation of machine learning carries inherent risks which gives unexpected
    negative outcomes [41]. It is complex, expensive and has the potential for showing
    bias similar to that of a human forensic expert, dependent upon the type of data
    utilized to train the machine learning model [42–44]. The use of AI in evidence
    analysis carries a probability of giving rise to either false positives or false
    negatives, which could have major implications for both suspects and victims [44].
    Obermeyer et al. discovered indications of racial bias in a healthcare algorithm
    which has the data of 200 million people [45].


    # Future Aspects of Machine Learning


    Machine learning has the capacity to improve the manner through which forensic
    experts examine evidence [38]. The future of machine learning in trace evidence
    examination holds the potential to transform forensic science. The relationship
    between technology developers and forensic professionals will play a crucial role
    in creating ethical, legitimate and effective applications of machine learning
    in the complex field of trace evidence analysis [41]. In contrast to human learning,
    machine learning is primarily advantageous due to its capacity to process vast
    quantities of data, identify patterns and operate more effectively in environments
    that are less predictable [46]'
  merge: -1
  img_proc: true
