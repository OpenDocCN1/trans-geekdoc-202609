    green flags can be better understood for well-informed actions regarding what
    is to be dropped and what is to be pursued. In essence, predictive analytics and
    smart decisions can be made out of big data analytics.


    It is essential that big data as a concept is well understood before we move on
    to applying machine-learning algorithms to conceive its utility and challenges.
    Figure 12.2 shows the three Vs of big data, variety, volume and velocity. These
    describe the essence of the task at hand and also give a glimpse of the complexity
    pertaining to data that needs to be handled. Managing and analyzing big data poses
    serious challenges. The challenge of big data lies in the speed with which it
    is expanding (velocity), the exponential amount'
