  md: '# Scope of Machine Learning in Forensic Trace Evidence Examination


    VAISHALI, NIHA ANSARI AND JEET DASGUPTA


    # Introduction


    Artificial intelligence (AI) is an ever-evolving field that involves teaching
    machines to perform tasks that would typically require human intelligence [1].
    One of the primary goals of AI is to develop machines that can think, reason and
    learn as people do. This involves creating algorithms that can analyse data, recognize
    patterns and make decisions based on that information [2]. It is a rapidly developing
    discipline that is also being used for enhancement in the field of forensics and
    the legal system as a whole. Considering the enormous quantity of data; the small
    size of the evidence in the incoherent, complicated environment; conventional
    laboratory frameworks, as well as occasionally inadequate expertise, professionals
