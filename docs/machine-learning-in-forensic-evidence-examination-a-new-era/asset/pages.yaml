- pgno: 147
  md: 'problem arises in the management of that database. Machine learning successfully
    organizes the data into systematic form (Wuest et al., 2016).


    Moreover, sometimes, the data is large enough that it is difficult to extract
    the information of interest even after visualising the whole data, or if possible,
    it takes more time (Mahesh, 2020). For example, the examiner has to identify whether
    the print ‘matches’ or ‘does not match’ from the database containing 10,000 samples.
    In this case, it will be tough for the examiner who will match each print manually.
    Here, using different machine-learning algorithms will accelerate the identification
    process. Even it reduces the chances of manual error. Many times, different conditions
    such as residual composition, impression condition, skin condition, disability
    and acquisition devices result in poor-quality prints. These poor-quality prints
    are challenging to examine manually. However, machine-learning algorithms such
    as the Gabor and GAN algorithms are used for fingerprint enhancement. That enhances
    the print, thus making it more compatible for the examination (Win et al., 2020;
    Hong et al., 1998). According to the different studies of the J48 decision tree
    algorithm in fingerprint gender classification problem, the accuracy of the approach
    is approximately 96.28% for the four fingerprint features namely, ridge count,
    ridge density, ridge thickness to valley thickness ratio and white line count
    (Abdullah at al., 2016) and CNN autoencoder resulted in a more than 90% accuracy
    rate for fingerprint identification in different databases (Saponara et al., 2021)
    this demonstrates that fingerprint identification, classification and examination
    is done more effectively by the machine-learning process rather than a manual
    process.


    Besides this, the identification, classification and examination of fingerprints
    by machine-learning algorithms has some challenges. The algorithm’s reliability
    highly depends on the quality and quantity of the training data. If the training
    data is not proper or is of a low amount, then the reliability of the result might
    be affected. Moreover, the result depends on the instructions provided; any biases
    or inaccuracies in the instructions will result in inaccurate conclusions (Singh
    et al., 2016). As machine-learning algorithms depend entirely on the training
    data, sometimes, results remain inconclusive due to erroneous fitting of suspected
    samples and training data (Anguita et al., 2010). Lack of interpretability and
    explanation of the result is one of the significant issues the examiners face.
    That makes it difficult for the examiners to verify the result or check the accuracy
    and reliability of the result (Tyagi et al., 2022).


    Moreover, machine-learning models may be prone to vulnerable attacks where malicious
    actors can manipulate the input data to deceive the algorithms. Addressing these
    challenges requires a balanced approach that prioritizes machine-learning algorithms’
    transparency, accuracy and reliability.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Future Aspects of Machine Learning


    With the increase in machine learning and artificial intelligence usage in every
    sector, it is highly predictable that the use of machine learning algorithms and
    artificial intelligence will keep increasing (Tyagi et al., 2022). Machine-learning
    techniques are now widely used in different domains of forensic science. Its use
    in the fields of fingerprint, handprint and palmprint examination is discussed
    above. Further, more advancements can be made in the examination of spoofed fingerprints.
    Spoofed fingerprints are artificial or fabricated fingerprints used to disguise
    the fingerprint recognition system, that is, spoofed prints are used to bypass
    the biometric authentication system, smartphone unlocking or other security features.
    Therefore, more advancements can be made in machine-learning algorithms to distinguish
    between genuine and spoofed prints (Adam and Sathesh, 2021). Fingerprints can
    also reveal the person’s daily routine or lifestyle by examining the chemical
    composition of the fingerprints by mass spectrometry. Thus, utilizing machine-learning
    algorithms in the determination of the compositional profile of the prints will
    be of great use (Hinners et al., 2018; Win et al., 2020). Several types of research
    in the field of fingerprint examination deal with determining gender from fingerprints
    (Thakar et al., 2018; Iloanusi and Ejiogu, 2020; Jayakala, 2021; Ibitayo et al.,
    2022) or determining age from fingerprints (Hinners et al., 2020; Basavaraj and
    Rafi, 2015; Falohun et al., 2016) or determination of the age of fingerprints
    (Popa et al., 2010; Chen et al., 2021; Girod et al., 2016). These research areas
    are of great importance in forensic investigation. Therefore, advancement can
    be made in this area by utilizing machine-learning algorithms to investigate the
    determination of age from fingerprints, the determination of the age of fingerprints
    and the determination of gender from fingerprints. This will not only help the
    examiner narrow down the suspect list but also help the examiner determine these
    parameters with higher accuracy, reliability and minimal human error. Machine
    learning can be used not only in the examination of fingerprints, handprints and
    palmprints but also in other domains of forensic sciences. More research can be
    conducted to determine the test’s accuracy, reliability, and admissibility in
    a court of law.


