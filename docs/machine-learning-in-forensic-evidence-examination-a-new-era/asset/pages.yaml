    [45]. The machine-learning algorithms can be aggregated together to form a stacked
    model, which shows higher accuracy when compared to single algorithms. One such
    stacked ML algorithm was used for sex determination from the patella of the South
    African population and it showed an accuracy of 90.8% whereas the multivariate
    discriminant function showed an accuracy of 81.9–84% (Figure 10.4) [46].


    Hefner and Ousley compared different machine-learning models of morphoscopic traits
    of the cranium to evaluate ancestry in African, European and Hispanic Americans.
    ANN has the greatest classification accuracy (87.9%) among ANN, SVM and RFM [47].


    # Convolutional Neural Networks (CNN)


    CNNs are primarily used for image-based tasks, such as facial reconstruction and
    skeletal trauma analysis. They excel at capturing spatial relationships in images
    through convolutional layers and have been applied to various aspects of forensic
    anthropology. Unlike ANN, convolutional neural networks have multiple layers starting
    from the input layer, convolutional layer, pooling layer, fully connected layer
    and output layer. CNNs are known for their superior functioning in image, speech
    and audio input signals. It helps in computer vision which is a subfield of artificial
    intelligence that aids in image interpretation. 3D-CNN allows interpreting images
    using specialized 3D kernels that predict the segmentation in a volumetric patch
    of an image. A study aimed to establish sexual dimorphism from maxillofacial features
    from radiographs using CNN. Transfer learning (TL) CNN architecture provided a
    greater accuracy as compared to the other architecture [48]. Like other neural
    networks, CNN also requires a well-formed database. A study suggested age estimation
    of young children and adults using whole-body low-resolution x-ray images using
    CNN. The database used to train the CNN comprised 910 multispectral images and
    showed a minimum discrepancy in age calculation [49]. Facial reconstruction of
    damaged skulls is one of the most challenging tasks faced by forensic anthropologists.
    CNN can help in resolving this issue using special algorithms to not just provide
    a 3D reconstruction but also perform a biometric matching of the reconstructed
    skull [50, 51]. Age-at-death estimation is vital in forensic identification, but
    there is a lot of conflict in its accurate calculation. Convolutional neural networks
    have been shown to estimate the age precisely up to a certain extent. A reference
    dataset containing 500 individuals with ages between 19–101 years was used to
    train the CNN model. Also, a novel software DRNNAGE was developed to cater to
    age estimation within certain skeletal traits [52]. Most'
