  md: 'The study utilized semi-supervised machine-learning algorithms for species
    identification by collagen peptide fingerprinting [26]. In another study, machine-learning
    algorithms were used to differentiate tooth scores and tooth pits of carnivore
    species with high precision [27].


    # Crime Scene Prediction and Reconstruction


    The incorporation of algorithms based on machine learning (ML) can improve crime
    scene reconstruction in numerous ways by providing insightful information that
    helps law and enforcement agencies solve crimes. Machine-learning algorithms,
    utilizing advanced deep-learning strategies on CCTV camera images, fraud detection
    systems and spam image recognition, have been employed in both the identification
    and prevention of criminal acts. Palanivinayagam et al. [28] proposed an algorithm
    to forecast the probability of specific crimes in a particular area. The study
    also reported a summary of different works where advanced machine-learning algorithms
    were used for the prediction of crime for a given area. Mandalapu et al. [29]
    reported a systematic review of the application of different machine-learning
    algorithms for the early detection of crime. A similar review was reported by
    Dakalbab et al. [30] on the application of various machine-learning algorithms
    for crime prediction. Therefore, advanced machine-learning algorithms have the
    potential to foresee future criminal activity, reconstruct complex crime scenes
    and track significant bits of evidence.


    # Victim Identification


    Machine learning has the potential to significantly contribute to victim identification
    processes by identifying victim’s facial characteristics or analyzing behavioural
    patterns associated with victims, that may help in understanding their habits,
    routines or interactions. A machine-learning algorithm was introduced to identify
    single nucleotide polymorphisms (SNPs) for victim identification from skin microbes
    [31]. Another research study was reported to evaluate the efficacy of machine
    learning algorithms in identifying panoramic radiograph pairs for individual identification
    [32]. It was observed that by utilizing a deep convolutional network an accuracy
    of 85% was obtained and precise prediction for personal identification was achieved.
    In order to predict the outcomes of criminal trials based on the evidence provided,
    researchers [33] utilized different machine-learning tools, respectively. The
    algorithm was able to accurately classify historical guilty verdicts'
