  img_proc: true
- pgno: 63
  md: '![](img/b862fc39ed9add71b3d54909afaeaeb0_63_0.png)


    Figure 3.1 Machine-learning techniques helping QDE computational data management
    process.


    those features, are at the core of every automatic signature verification system
    as brief in Figure 3.1. Features are the components that make something special.
    Such features are known as discriminating elements or elements of comparison in
    QD literature. The quantity of components in a specific person''s samples may
    vary, and the combination of elements has a higher discriminating power [20].


    Ticks, curve smoothness, pressure change smoothness, positioning, expansion and
    spacing, writing top and base, angulation/slant, overall pressure, pressure change
    patterns, macro forms, variations, connective forms and micro-forms are examples
    of these elements used by a human document examiner. Higher-level features such
    as rhythm, shape and balance are determined by basic characteristics such as speed,
    proportion, pressure and design.


    The literature’s descriptions of automatic signature verification techniques make
    use of a wholly distinct set of attributes. While some, such as wavelets, are
    focused on the texture of the picture, others concentrate on the geometry and
    topology of the signature image. Wavelet descriptors, projection distribution
    functions, extended shadow code and geometric features are some of the feature
    types employed for signature verifications [21].


