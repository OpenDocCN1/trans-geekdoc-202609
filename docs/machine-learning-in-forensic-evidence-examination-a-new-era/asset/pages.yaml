    # Unsupervised Learning Algorithms


    # Clustering Algorithms: K-Means, Hierarchical Clustering


    +   - **Clustering Algorithms:** These are a core part of unsupervised learning,
    which allows the discovery of patterns in datasets. Clustering algorithms, like
    k-means and hierarchical clustering, prove to be'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'useful in forensic science, in which patterns might not only exist but are
    also unknown; this method is able to provide an intuitive structure of relationships
    among data points generated by forensics and bring about noteworthy insight.


    +   - **K-Means Clustering:** K-means structures data into k-clusters while also
    being partitional. It is designed to assign data points into clusters of similarity,
    iteratively reassigning data points until every single point has been appropriately
    grouped. K-means are both efficient and widely used in forensic scenarios where
    distinctive boundaries exist between classes [10]. For example, in a cybersecurity
    investigation, k-means can identify unique behaviours or patterns within network
    data, helping law enforcement quantify proper thresholds for specific tactics,
    techniques and procedures (TTPs).

    +   - **Hierarchical Clustering:** Hierarchical clustering makes a tree-like ladder
    of clusters, known as a dendrogram, by iterative integration or splitting clusters
    based on their similarity [11]. This is especially useful not only for looking
    at how many clusters we need to make but also for identifying patterns of hierarchy
    within forensic data. Hierarchical clustering can be used in voice and speaker
    recognition to group similar audio patterns thereby helping identify individuals
    by their voices.


    **Applications in Forensic Science:** In fingerprint analysis, k-means clustering
    can help to determine unique features within a set of prints so that these patterns
    appear different from each other. Applications of hierarchical clustering to DNA
    profiling can reveal hierarchical relationships between genetic markers, and detail
    familial information.


    # **Dimensionality Reduction Techniques: Principal Component Analysis (PCA), t-Distributed
    Stochastic Neighbour Embedding (t-SNE)**


    **Introduction:** Dimensionality reduction techniques are a necessity when working
    with high-dimensional data, which is typical in forensic science. Like principal
    component analysis (PCA), these techniques try and reduce high-dimensional data
    into a lower dimension while keeping important information. PCA and t-distributed
    stochastic neighbour embedding (t-SNE) are two powerful methods that have applications
    in forensic evidence examination by simplifying data for more effective analysis.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - **Principal Component Analysis (PCA):** PCA is a process that aims to
    reduce dimensions in some way by detecting components which are axes of dimension
    where data have the highest variances [12]. PCA preserves the information while
    reducing the dimensions in such a way as to project onto these numbers. In forensic
    science and other fields, PCA is useful to analyze markers in DNA profiles (genetics)
    coordinates, the most important correlating element of each fingerprint index/features
    dataset.

    +   - **t-Distributed Stochastic Neighbour Embedding (t-SNE):** t-SNE is a nonlinear
    method for dimensionality reduction that aims to globally structure data by performing
    local similarities present in high-dimensional space [13]. It is excellent for
    discovering patterns (structures, clusters) in the data. A key finding about t-SNE
    is that when results are used wisely they can help us to understand relationships
    within data, which is critical during image and video forensics scenarios or for
    spotting cybercrime-related data.


    **Applications in Forensic Science:** Both PCA and t-SNE are tools used frequently
    in science among datasets that are high dimensional (complex). These approaches
    go a long way towards speeding up the process of feature detection during fingerprint
    analysis. As a case in point, t-SNE is used to assist in the investigation of
    cybercrime as it unveils regional structures that aid interpretation around nuanced
    causation between any two data points.


    # Feature Selection and Extraction


    # Feature Selection Methods: Filter, Wrapper and Embedded Approaches


    **Introduction:** Feature selection is an essential part of data preparation for
    a machine-learning model, especially in forensic science, where the datasets can
    be complicated and large. This is precisely the process by which different important
    features that enhance the predictive power of a model are selected, while irrelevant
    or redundant ones are removed. There are three main ways to select features: filter,
    wrapper and embedded—the appropriate way depends on the approach.


    +   - **Filter Methods:** Filter methods train for multiple different machine-learning
    algorithms over the same dataset by evaluating features independently There are
    two general methods to rank the individual'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'significance of features, either by statistical tests or correlation analyses.
    Finally, features are chosen or ruled out based on actions [14]. Filter methods
    are computationally efficient and work well with high-dimensional datasets. Filter
    methods are useful in forensic applications because they can improve the performance
    of tasks such as DNA profiling by selecting the most discriminative genetic markers.


    +   - **Wrapper Methods:** Wrapper methods work by putting the machine-learning
    algorithm to work against each subset. It examines various feature subsets and
    perceives the capability of functioning or assessing this model to detect its
    suitability function in each class [15]. This iterative process is more computationally
    expensive than using filter methods, but typically provides a finer-tuned feature
    set for specific models. Wrapper methods are important when configuring features
    for voice or speaker recognition tasks, that is, in forensic sciences.

    +   - **Embedded Approaches:** Embedded approaches integrate feature selection
    into the model-training process. During the training, machine-learning algorithms
    select features and assign a weight or coefficient to them based on their importance.
    Regularization techniques, such as L1 regularization, can enhance the embedded
    feature selection process by promoting sparsity in the model [16]. On the other
    hand, embedded approaches are specially designed for a condition where feature
    selection is part of learning—one such being in neural networks because applied
    to image forensics.


    # Applications in Forensic Science:


    Feature selection methods help forensic models to develop better efficiency and
    accuracy. In matching fingerprint analysis, filter methods can help identify the
    best discriminative features for identifying fingerprints. The DNA profile features
    can be adjusted for specific identity verification tasks using the wrapper methods.
    By jointly targeting the most discriminative image features, embedded approaches
    can improve neural networks’ performance in image forensics.


    # Feature Extraction Techniques: Autoencoders, Principal Component Analysis (PCA)


    **Introduction:** Feature extraction techniques try to convert the original raw
    data into a smaller, and more useful format, facilitating efficient model training
    and enhancing interpretability. Two prominent techniques—autoencoders and principal
    component analysis (PCA)—offer distinct approaches to feature extraction in forensic
    applications.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - **Autoencoders:** Autoencoders are a type of neural network which is
    very useful for unsupervised learning. An autoencoder, which consists of an encoder
    and a decoder learns to compress the input data into some lower-dimensional representation
    (encoding), while also learning how to reconstruct the original data through this
    encoding [17]. Autoencoders can be quite useful in forensic science, especially
    when it comes to image forensics, as they can capture detailed patterns and even
    anomalies within visual data. These encodings, being learned, often unveil important
    structures involving forensic evidence.

    +   - **Principal Component Analysis (PCA):** PCA is a classical technique in
    the linear realm that projects high-dimensional data to lower dimensions after
    identifying the principal components which capture maximum variance [12]. These
    are orthogonal axes which represent the biggest vectors of variability in your
    data. PCA is frequently used as a basic technique in many forensic applications,
    such as DNA profiling, where it enables the reduction of the dimensionality of
    genetic data while maintaining information regarding its underlying structure.


    **Applications in Forensic Science:** Feature extraction techniques play a critical
    role in identifying informative patterns from forensic data. The ability of the
    autoencoder to work with voice data makes it possible for use in speech and speaker
    recognition. PCA is a linear dimensionality reduction method that helps improve
    the efficiency of fingerprint analysis by decomposing a large set of features
    into key components.


    # Model Evaluation and Performance Metrics


    # Evaluation Metrics: Accuracy, Precision, Recall and F1-Score


    **Introduction:** Evaluation metrics are very important to determine how machine-learning
    models perform in our forensic science work. They supply numerical metrics designed
    to indicate how well a model generalizes with unseen data and help forensic practitioners
    make informed decisions. A model can be evaluated on four basic metrics—exactness/accuracy,
    precision, recall and F1-score. These four metrics give a good overall indication
    of how a model is working in a forensic task [3].


    +   - **Accuracy:** The exactness metric is the most common metric and the most
    basic. It tells how many of the predictions made by a model'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'were correct and how many were not. It is the ratio of correctly predicted
    instances to the total instances as given in Equation 1.1 where TN indicates true
    negative, TP represents true positive, FN represents false negative and FP represents
    false positive in the equation. For classification, true positives (TP) and true
    negatives (TN) are the most relevant and accurate parameters. However, it does
    not tell how many of the instances that a model was supposed to identify were
    in fact identified or how many of the things that a model was supposed to classify
    as negative were classified in fact as positive (which is not exactly what you
    want). So, to gain a more comprehensive insight into the effectiveness of a model
    across various forensic tasks, it is better to look at all four metrics instead
    of just relying on one.


    Accuracy = \frac{TP + TN}{TP + TN + FP + FN}  (1.1)


    +   - **Precision:** The focus of precision is on the accuracy of the positive
    predictions made by a model. It is the ratio of the number of truly positive predictions
    to the sum of truly pleasing and falsely pleasing predictions, as given in Equation
    1.2. Forensic science particularly relates to precision when the cost of a false
    positive is very high, as it is in the case of fingerprint analysis. In that application,
    precision measures the accuracy of the model in positively identifying a match
    among the instances it predicts will match.


    Precision = \frac{TP}{TP + FP}  (1.2)


    +   - **Recall:** Recall, is also known as ‘sensitivity’ or the ‘true positive
    rate’. Recall assesses how well the model captures all the positive instances
    in the dataset. Again, assuming our resolution to a forensic problem is a model
    that makes predictions, recall assesses the accuracy of the model in capturing
    all the truly pleasing predictions. An instance of this is found in DNA profiling,
    where the recall metric measures how well individuals can discern one from another
    based on their unique genetic markers. The profiling’s correct identification
    rate averages well below 100%. Recall is given as:'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Recall = TP / (TP + FN)  (1.3)


    +   - **F1-Score:** The F1-score is the harmonic mean of precision and recall,
    providing a balanced measure that considers both false positives and false negatives
    as given in Equation 1.4. Both metrics are vitally important because they directly
    assess the balance between two types of errors—false positives and false negatives—that
    are pivotal for scoring the success of forensic science outcomes.


    F1-Score = 2TP / (2TP + FP + FN)  (1.4)


    **Applications in Forensic Science:** Evaluation metrics play a very important
    role in measuring the reliability of forensic models. In the context of applications,
    such as voice and speaker recognition, overall accuracy in identified speakers
    is what we generally seek. With precision, we can ensure that matched fingerprints
    in an analysis are correct and not false positives. Recall becomes critical when
    we want to ensure that all ‘recognized’ instances of nefarious activity in a system
    have been apprehended. With these three core metrics—accuracy, precision and recall—forensic
    scientists and investigators can see inside the black box of a model’s performance
    and make better decisions based on what appearances that model gives when it is
    working well and when it is not.


    # Cross-Validation and Overfitting


    **Cross-Validation:** In the forensic sciences, the applied use of machine learning
    requires a high level of assurance that a model can be trusted to operate on data
    it has not seen before. For instance, a model should not be expected to work on
    new DNA samples if it has only been trained on previously known samples. The primary
    technique for assessing the predictive power of a model is called cross-validation.
    The basic idea is to hold out some of the data from the model during training
    and then see how well it performs when the model is applied to that held-out data
    [18].


    **Overfitting:** When a model becomes too finely attuned to the training data,
    it overfits. By overfitting, a model learns not only the essential features of
    the training data but also the unimportant, irrelevant details. In this context,
    a model may give us ‘results we can trust’ for the training data, but it is far
    less effective on fresh, new data—in our case, new forensic evidence [19].'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# ROC Curves and AUC (Area Under the Curve):


    Receiver operating characteristic (ROC) curves and area under the curve (AUC)
    are important tools for evaluating how well machine-learning models work in forensic
    science [3]. They help understand the balance between true positive rates and
    false positive rates, which is crucial in tasks such as fingerprint analysis or
    DNA profiling.


    The true positive rate (sensitivity) and false positive rate (1—specificity) tell
    us how well a model performs only at fixed, predetermined thresholds. ROC curves
    provide much more information than that. They show how the true positive rate
    varies with the false positive rate at all possible thresholds and help us select
    the ‘best’ operating point. AUC collapses the ROC curve down to a single number.
    AUC is higher the better the voice recognition model is and the better a model
    can distinguish between normal and malicious activities in the cyber domain. Figure
    1.5 shows an ideal ROC–AUC curve.


    # Applications in Forensic Science:


    In forensic work, we need to pay much more attention to ROC curves and AUC than
    we historically have—if we do not want to maximize false positives or false negatives.


    # Types of Machine Learning: Supervised, Unsupervised and Reinforcement Learning


    In the field of forensic science, diverse machine-learning methodologies are applied,
    with the three fundamental types—supervised learning, unsupervised learning and
    reinforcement learning—being the most common. Each plays a distinctive and valuable
    role, rendering its own form of interpretation of the data. Figure 1.6 shows different
    types of machine learning.


    ![](img/b862fc39ed9add71b3d54909afaeaeb0_31_0.png)


    Figure 1.5 ROC–AUC curve.'
