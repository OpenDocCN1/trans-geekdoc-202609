- pgno: 240
  md: 'To have absolute confidence, and win the hearts and minds of their customers,
    and with ‘trust’ increasingly becoming a critical success factor, banks need to
    effectively manage (directly or indirectly) their supply chains, including their
    technology. This is a more proactive rather than reactive role. It isn’t enough
    to ask suppliers to provide ‘evidence’ of security compliance but rather that
    the banks must play a much more dynamic role in the proactive management of data
    throughout the supply chain. The use of so-called ‘white hat hackers’ who hack
    in an ethical way might also be employed by firms to identify areas of vulnerability.


    Additionally, banks must recognise that whilst technology is a problem in cyber
    security, many ‘leaks’ are of a relatively simple nature. These leaks can involve
    employees who are either careless and reuse passwords; who are disgruntled and
    deliberately steal information; or who are gullible enough to open unsolicited
    emails. Sophisticated criminals are increasingly focusing on social engineering
    by finding enough about an individual on social media to be able to send a communication
    that looks credible enough to open.


    But where will the burden of that operational delivery in the supply chain rest
    in practical terms? Perhaps with the supply chain management professional whose
    main criteria, historically and maybe arguably, has been in getting the best deal
    or structuring the right commercial relationship between the parties. For that
    traditional supplier manager, data protection and cyber security management may
    be no more than a ‘hygiene factor’ and part of a ‘box-ticking exercise’. But perhaps,
    looking forward, it could be the most important criteria of them all.


    One problem, however, is that smaller businesses along most supply chains are
    often considered poor relations. To what degree should banks – and other larger
    organisations – provide a certain level of free advice when it comes to cyber
    security, especially given the large costs involved in compliance? If the cyber
    gaps need to be effectively plugged, banks may need to take a leading role in
    that process. Some sort of ‘utopian society’ could be created in commerce where
    the larger organisations, such as banks, help the smaller ones, in the interests
    of both. Already there’s much free information available online and many vendors
    provide free access to conferences, but perhaps there’s a better way of exchanging
    cyber safety knowledge for the benefit of all?


    It’s impossible to disregard the potential general weakness of supply chains.
    If the idea is that at least one version of the ‘Future of Banking’ is that of
    a traditional business model becoming ‘disaggregated’, that is, that future banking
    becomes in effect part of some sort of collection of supply chain components,
    then there’s significant pressure on banks (and the other ‘actors’ in that operating
    model) to get their cyber risk management house in order. It could be a critical
    success factor in the future of the banking industry.


    # Cyber Readiness


    According to the Hiscox Cyber Readiness Report 2019, cyber readiness spend is
    on the increase. The report indicates that the average spend for 2018 is now $1.45
    million, up 245% from 2017 and seemingly accelerating.'
