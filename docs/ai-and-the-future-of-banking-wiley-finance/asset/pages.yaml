  md: '# CONCLUSION


    The banking sector is increasingly data driven and for that reason is especially
    likely to suffer disruption as a result of technology, robotics and AI. Over 75%
    of banking functions can be automated, say experts, and a single robot (whatever
    that is) can replace 8 humans.


    The indicators are that robotic systems can operate on a 24/7 basis, are relatively
    low maintenance, are more flexible to change, and some might argue constitute
    a better investment than people training. The potential, therefore, is not only
    to transform the banking industry but to radically reform it.


    There are, however, additional risks or societal impacts that may emerge:31


    +   - Rogue algorithms, which can create distortion

    +   - Unconscious bias emerging in those who build the systems

    +   - Contagion where systems respond to meet market conditions, which might prove
    to be incorrect

    +   - Cyber attack made especially worse by interconnectivity between systems


    In their useful report ‘How artificial intelligence is transforming the financial
    ecosystem: The new physics of financial services’,32 Deloitte together with the
    World Economic Forum aimed to cut through the *sensationalism* of the AI debate,
    suggesting nine key findings, including:


    +   - Back-office services could become profit centres, not cost centres, as shared
    services become increasingly common.

    +   - Customer loyalty will be transformed by added-value services provided by
    financial organisations, as banks move away from commoditised offerings.

    +   - AI will increasingly automate the finances of customers, and enhance self-service.

    +   - Collaborative solutions will emerge that will pool data and information,
    and include ‘safety’ in the financial services sector.

    +   - Strategic partnerships will increase in importance but ‘be fraught with
    strategic and operational risk’.

    +   - Regulations related to data privacy will start to shape what banks and financial
    services can offer.


    This book was never intended to give a complete understanding of how AI works,
    nor does it seek to report on all the different types of elements and applications
    that might contribute to some form of advanced analytical system or machine learning
    in the banking sector. Rather, it is intended to give some insight into the depth
    of capabilities that have evolved to date and are presently evolving, and the
    potential implications.


    Beyond this, it’s important to recognise the tangential impacts of these technological
    changes on the way we will live. Whilst the business case for biometrics in banking
    might be clear, the wider impact of biometrics on society is less so. So too is
    the case with the use of AI. Both provide ample ammunition for discussion, debate
    and disagreement. Whether these new technologies happen or not will depend as
    much on the'
