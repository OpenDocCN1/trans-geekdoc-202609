  md: 'If we focus on the third type of data, that yet to be identified, we can only
    speculate on what this might be, but maybe it might relate in some way to talent
    management or perhaps behavioural analysis of decision-making employees?


    But the question then arises, can’t an automatic system also identify and manage
    these additional sources of information, and if so, what is the value of human
    intervention? If portfolio prediction will be largely done by machines in the
    future, where is the human ‘value-add’?


    Perhaps the answer rests in issues beyond ‘mere’ mathematical computation. Isn’t
    there a role where human intervention provides intuition, experience and just
    a plain ‘hunch’ to statistical analysis? Would a computer ever have seen the value
    in solutions such as Uber or Lyft, which create value through the ability of these
    largely software solutions to impact on, and help with the daily grind of human
    existence? Is it ever truly possible to fully replace human experience with automatic
    systems and AI, even in a deeply analytical financial context?


