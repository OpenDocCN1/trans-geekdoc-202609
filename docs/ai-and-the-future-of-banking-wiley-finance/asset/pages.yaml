- pgno: 42
  md: 'Banks would do well to better understand what is happening to High Street retailers
    whose traditional retail processes are being replaced by on-line shopping. Retail
    premises are increasingly being used for ‘showrooming’, that is, locations where
    potential customers look at and try goods before buying them on-line, usually
    at a cheaper price.


    As a result, retailers are increasingly creating what they describe as a ‘shopping
    experience’. For example, the Mercedes ‘Me’ store in Sanlitun, Beijing, aims to
    provide ‘an integrated and multi-sensory customer experience journey, encompassing
    elements of hospitality (food & beverage), the arts (entertainment) and lifestyle
    (premium retail).’ In addition, the second floor of this two-storey building provides
    an upmarket bar and restaurant, both contributing to Mercedes brand positioning
    themselves as ‘lifestyle partners.’⁸


    Similar Mercedes Me stores are opening in Hamburg, Munich, Milan and Tokyo and
    are usually found in locations of other luxury labels such as Prada and Gucci.⁹
    Mercedes aim to stretch their brand as far as practically possible, including
    shoes, clothing and backpacks. The topic of branding is critical to the Mercedes
    offering, and we will look at this more specifically in Chapter 6.


    Banks may need to figure out a way of showrooming their financial services. In
    this context, therefore, what should be our ‘banking experience’, especially when
    many still associate their past experiences with distrust, complexity and uncertainty?


    An ‘experience’ is usually described as a combination of physical, mental and
    emotional triggers, some of which are conscious and others unconscious. We even
    describe a spiritual engagement as a religious experience. Customer experience
    (more commonly abbreviated to CX) is defined as the sum of the interactions that
    a customer has during the entire customer journey.¹⁰


    According to customer experts Ameyo, there are four key steps to improve customer
    experience in banking:


    +   1. Plan, by having a set of defined goals and targets, all appropriately segmented.

    +   2. Strategise, by having a customer experience strategy to achieve those targets.

    +   3. Improve the experience by designing and delivering experiences.

    +   4. Measure, using a data-driven approach to continually refine the experience.


    # Comparable Imperatives in the Telecoms Industry


    With ‘mobile’ being recognised as one of the key technological contributors to
