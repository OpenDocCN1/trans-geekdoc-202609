- pgno: 165
  md: '# The Bank of the Future


    # SUMMARY


    > > ‘In the future, the (banking) interface will not be a branch, a computer or
    even a phone’.

    > >

    > > —Jim Marous


    Some of the concepts for the Bank of the Future will be considered in this chapter,
    including their feasibility and practicality. The first issue is whether there
    is still a demand for traditional financial services and, if so, what it looks
    like. Will the digital bank require a High Street presence in the future, especially
    recognising that some of the challenger banks are growing successfully without
    the need to incur these costs?


    We will examine different potential banking models and consider whether traditional
    banking is dead and what might then replace it. Responses will be coloured by
    considering the impact of advanced analytics and artificial intelligence in the
    overall mix of thinking and implementation.


    The chapter offers different scenarios for the ‘Bank of the Future’, such as disaggregation,
    conversational banking and collaborative banking, suggesting that perhaps no single
    one of these will prevail but that the Bank of the Future may prove ultimately
    to be an amalgam.


    Finally, we will explore some of the issues affecting investment banking and where
    transformation may happen.


    # AI Transforms Customer Experience


    Wells Fargo have piloted a chatbot which, according to the bank’s own Innovation
    Group, uses AI ‘to allow us to take an experience that would have required our
    customers to navigate through several pages on our website, and turn it into a
    simple conversation in a chat environment.’¹'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# INTRODUCTION


    What drives the demand for financial services, and why is ‘demand’ important?
    A 2019 report from the UK-based CBI/PwC Financial Services Survey reported that
    demand and sentiment for financial services had fallen for the first time since
    2013, rounding off three full years of flat or flailing optimism. Volumes of business
    amongst banks, building societies and specialist lender were at their lowest since
    2013 affecting profits. Rain Newton-Smith, CBI Chief Economist, said:²


    > A combination of macroeconomic and Brexit uncertainty, regulatory compliance
    and global market volatility are taking a toll on the UK’s financial services
    sector. The persistent weakness in optimism and the deterioration in expectations
    sound a warning for the outlook.


    It’s clear the sector is grappling with a number of other challenges too, from
    using data to improve customer experiences, to new entrants to the sector. However,
    with new risks and demands come opportunities.


    Technologists and banking leaders already accept that the banking industry is
    likely to be transformed not only by technology such as AI, but also by changing
    customer needs and expectations. It should probably be accepted that such transformation
    is a ‘given’ but how will it manifest itself? Should consumers expect the demise
    of the High Street banking presence or will this reinvent itself in some way?
    Is a High Street presence needed and, if so, why?


    An AI-infused bank or banking system is not one that concentrates solely on the
    use of advanced analytics, machine learning and more, but rather one that is prepared
    to reinvent itself in all its channels and transactions, with AI being both the
    catalyst and the glue that holds it all together. (See Figure 8.15.)


    A relatively simple place to start might well be in the branch experience itself.
    To what degree does a bank of the future require a branch network, and if so,
    what will it look like?


    # BRANCH MAKEOVER


    In this increasingly technologically driven environment, customers are unlikely
    to be won over by better seating and a new coat of paint in the front office area.


    In his article ‘A bright ideal: Seven elements of the ultimate branch format’,³
    David Kerstein created a picture of a branch in the bank of the future:


    The ‘ideal branch’ of the future will be fully automated with robots or holograms
    serving as branch staff. The interior walls will reconfigure at the push of a
    button to create meeting rooms of different sizes and shapes with chairs popping
    out of the floor to fit any configuration.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/58d39abe2abae45d51491548f7293e40_167_0.png)


    # FIGURE 8.15 AI Centric Banking.


    Branch signage along with interior finishes (wall colours, floor coverings, artwork,
    etc.) will be all digital. They will change remotely if the bank merges with a
    competitor.


    Customers will self-identify through retina scans or facial recognition. The facilities
    will be fully paperless, green and LEED-certified.


    He describes seven key elements of a future branch setup:


    +   1. Transaction zone where the ‘business will be done’

    +   2. A self-service zone

    +   3. Private meeting spaces

    +   4. Customer meeting room, which is more like a customer’s living room than
    a bank office

    +   5. Demonstration area

    +   6. Marketing displays

    +   7. Branding area'
