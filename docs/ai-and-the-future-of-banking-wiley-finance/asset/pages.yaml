- pgno: 226
  md: 'the change is in the best interest of their customers but to the employee’s
    own personal detriment.


    The traditional approach of businesses is one of putting the customer first, but
    there is an alternative suggestion that the some successful organisations put
    their employees first, and then encourage the employee, in turn, to look after
    the customer in a similar way. Success for those businesses that apply this approach
    arises through


    # TABLE 21  Blockages to Innovation


    | Causes of Blockages to Innovation | Mitigating Factor |

    |---|---|

    | Loss of status | Tricky but one good tactic is that of ‘no surprises’. Senior
    people are usually good at managing their own messaging. |

    | Loss of job security | Job security is a diminishing prospect and some enter
    the banking industry expecting a job for life (which is increasingly less likely).
    Career coaching in advance is a good approach. |

    | Fear of uncertainty | Most people are concerned about uncertainty, as reflected
    by Maslow’s Hierarchy of Needs. We live in an uncertain world and providing help
    with coping strategies is important at all levels of business. |

    | Fear of AI and advanced analytics | Often a lack of understanding of the technologies
    translates into a fear of their impact. Effective communication plays a key part
    in reducing this particular type of anxiety. |

    | Peer pressure | This is partly linked to the element of competition, which exists
    not just in banking but in almost all professions. Competition amongst peers can
    be unhealthy when compared to collaboration. Success is a team sport, but make
    sure that individual contributions are recognised. |

    | Mistrust of management | Transparency of strategy and objectives are critical
    components in this but ultimately the issue is interpersonal, and also based on
    past experience. |

    | Organisational politics | In almost any reorganisation there is a power struggle.
    Sometimes it is obvious, sometimes discrete but overall it undermines the overall
    ambition of the organisation. In AI, the struggle potentially is about the credibility
    of established practices against the new techniques of technology, so these are
    ‘new battles’ to be contested. |

    | Fear of failure | This is an area that is very personally oriented in terms
    of behaviour but may also link into the need for clear performance objectives.
    These need to be realistic even in period of operational uncertainty. |

    | Poor implementation process | This is at the heart of a transformation process.
    Effective transformation comprises a series of interconnected and related independent
    projects, usually time and objective related. A good (and impartial) ‘programme
    of change’ manager is essential, coupled with strong stakeholder support and a
    good executive sponsor. |'
