  md: '# Machine Learning, AI and ‘Apps’


    # SUMMARY


    In this section, knowledge acquired to date on advanced analytics will be further
    built on, and consideration will be given to existing and emerging capabilities,
    particularly in the area of machine learning, which is considered in some detail,
    and how the approach leads to an AI environment.


    The topic of applications, or ‘apps’, will also be explored, especially the apps
    likely to be of more specific interest to the banking sector, typically related
    to personal identification such as iris and palm recognition. Expanding the topic,
    the section will also review their use in wealth management.


    The chapter closes on some of the ethical and societal issues of the use of biometrics
    in financial services, but recognises that there is potential for considerable
    further and detailed conversation around this very important and sometimes emotive
    area.


    # Bank of America Surpasses One Million Users of ‘Erica’


    Bank of America has surpassed one million users of ‘Erica’, the first widely available
    AI-driven virtual assistant in financial services, available to clients in its
    mobile banking app. The milestone was reached within two months of completing
    its phased rollout. Erica combines the latest technology in artificial intelligence,
    predictive analytics and natural language to be a virtual financial assistant
    to clients, who can interact with Erica any way they choose, including texting,
    talking or tapping options on their screen.¹


    # INTRODUCTION


    AI is not a new phenomenon, having been referred to as far back as 1956 at what
    was called ‘The Dartmouth Event’. Between then and now there have been a number
    of cycles and iterations, and a degree of science fiction and Hollywood imagination
    has also been applied to the topic.²'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Nowadays it is such a hot subject on the agenda that it may even have reached
    the point of becoming ‘hype’. Some cynics suggest that the topic has mainly been
    driven along by those set to benefit, mainly technology companies and vendors.
    Others view it as the panacea to all ills in the world, and a methodology by which
    services (and products) can be customised, friction can be removed from processes,
    and risk can be mitigated.


    AI seems to have a polarising effect, with participants in the debate either believing
    in it or being sceptical. AI sits at the extreme end of a maturity curve of analytics
    comprising:


    +   (a) Descriptive analytics

    +   (b) Predictive analytics

    +   (c) Prescriptive analytics

    +   (d) Cognitive analytics

    +   (e) Artificial intelligence


    Cognitive analytics is a system which has the ability to interact with the user,
    such as in the situation of a wealth manager for example, and which helps the
    human advisor give the right information to their end customer. It has by engineering
    the ability to learn, usually through some sort of closed loop mechanism. In many
    cases it’s problematic to try and segment the different types of analytics too
    rigidly. In fact, some are already referring to AI as ‘assisted intelligence’,
    which is a form of cognitive analytics. Cognitive analytics usually has some element
    of predictive analytics embedded within it, and AI has machine learning capabilities.
    Beyond this, both have the ability to use algorithms to examine large volumes
    of unstructured data and to find patterns which extend not only to text data but
    also to voice and other unstructured forms.


    In addition, both cognitive analytics and AI have ‘machine learning’ capability
    which enables the system to learn without being explicitly programmed. This occurs
    at three different levels:


    +   1. Supervised learning where the system is given data and a required outcome
    and is then helped by a teacher to compute a set of rules

    +   2. Unsupervised learning where the system is tasked to find patterns in unlabelled
    data

    +   3. Reinforcement learning where the system learns in a dynamic environment,
    such as in the playing of games.


    The element of learning is a key attribute both in cognitive analytics and AI.
    It accepts in principle that there will be exponential growth in the use of AI
    to a point where there is an intersection between man and machine, a concept called
    ‘singularity’. It is at that stage where AI first matches and then surpasses human
    intelligence. The jury is still out as to when that may happen but it is suggested
    by AI experts such as Ray Kurzweil that by 2045 ‘there will be no distinction
    between man and machine’. He bases his projection on Moore’s Law, expressed over
    50 years ago, that the number of transistors doubles every two years, and that
    self-learning machines will double their speed every two years.'
