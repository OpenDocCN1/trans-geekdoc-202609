    Because of this ‘bad behaviour’, statisticians such as Nassim Taleb wrote about
    the difficulty of prediction in his book *The Black Swan* (described as one of
    the 12 most influential books since World War II). His argument is that risk is
    very difficult to predict, and suggests that there is no real point in investing
    in what is a ‘medium risk’ – conservative investors should invest 80%–90% in extremely
    safe instruments, with the balance in high risk. Alternatively, high-risk investors
    should invest 80%–90% in high risk, and the balance in a potential fallback. He
    describes this as being ‘hyper conservative’ or ‘hyper aggressive’.


    In the second edition of *The Black Swan*, Taleb writes, ‘One of the most common
