  md: '+   - The use of metadata, which gives greater structure to the data held in
    the warehouse

    +   - Real-time reporting, including the use of ‘more dynamic and responsive risk
    management’

    +   - Anomaly detection, which serves to find ‘unpredictable new patterns of attack
    and relationships’

    +   - Integrated case management, which in other words is the idea of collaboration
    across the enterprise rather than as individual businesses operating in silos

    +   - Consistency demanding common understanding and definitions across the organisation
    and probably, with time, across the industry


    An essential component of managing cyber risk is the need for effective communication
    between different role functions. These might typically comprise the Chief Data
    Officer (CDO), Chief Information Officer (CIO), Chief Information Security Officer
    (CISO) and the Chief Risk Officer (CRO). As cybercrime becomes more problematic,
    there is likely to be a need to revisit some of these roles and consider whether
    there is duplication or latency. In the future, these roles and functions may
    either need to be redefined or consolidated in some way.


    At the very least, it becomes critical for organisations to have some preplanned
    approach to the management of cyber risk. The impact to the business, especially
    on customers and to the reputation of the organisation cannot be overstated, especially
    when considering one of the key decision drivers of Millennial-type users, which
    is that of security.


    # The Internationalisation of Cybercrime


    In their 2019 survey, Europ Assistance’s ‘Cyber Barometer’¹⁴ explored consumer
    sentiment on the topic of cyber security across nine European countries. They
    discovered that 46% of consumers feel worried about cyber security, especially
    those with elderly parents or with children. Nearly a third of respondents (31%)
    felt exposed to cyber security issues, and those with children felt even more
    concerned, at 38%. Of European countries, southern Europe seems to be more concerned,
    with Spanish citizens (47%) and Italian citizens (39%) feeling especially vulnerable.
    Considering the wider European picture, just over a quarter (26%) knew someone
    who has had an attack on their personal data and over 82% viewed such an attack
    as being ‘very stressful’.


    What’s more worrying about the survey is the apparent lack of knowledge amongst
    consumers about what to do if their personal data was compromised. Only 45% of
    responders said they would know what to do, and 48% said that they felt organisations
    weren’t doing enough to help them. In the US, it seems that there is a greater
    awareness of data security issues; 65% are more aware of identity protection solutions,
    compared to Europeans, at 40%.'
