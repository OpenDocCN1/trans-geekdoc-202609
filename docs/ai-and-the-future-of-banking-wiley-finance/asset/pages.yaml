    life through voice or text’, says Keith Armstrong, co-founder of Abe, a chatbot
    that currently works through Slack (a cloud-based workflow), or SMS messaging
    to monitor income and expenses or to set a budget.34,35


    It’s an interesting approach, using humans as the default or place of last resort
    in terms of consumer requirement. It seems to establish some form of hierarchy
    yet at the same time recognises that some of the queries are too complex for automated
    systems to cope with. It also reflects an evolution from mobile banking.


    In their 2017 report ‘Ready to Talk’, Accenture refer to conversational banking
    as being a natural evolution that reflects the fact that many devices today and
    presumably tomorrow are capable of bi-directional voice interaction and refer
    to examples such as the Garanti Bank Mobile Assistant and Capital One’s connectivity
    through Amazon’s Alexa device.


    Any move towards conversational banking requires a different set of technical
    skills with less dependence on mobile app developers, and greater dependence on
    language and semantic experts interlocked with advanced analytical capabilities.36'
