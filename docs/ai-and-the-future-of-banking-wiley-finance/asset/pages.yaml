    # To Brand or to Debrand?


    Tom Peter’s book Re-Imagine!¹⁸ is thought by some to be a ‘Marmite’ publication.
    (Marmite is a British yeast-based spread of the Australian Vegemite school of
    appeal, with the slogan ‘Either you love it, or hate it’). First published in
    2004, his book falls into that category for reviewers not only for its rather
    radical layout but also for its provocations, one of which is that of ‘branding’.


    He reminds us that branding is an ‘emotional connection point’, a ‘powerful connecting
    experience’ and that it is within the grasp of organisations to define their own
    brand ‘based on what they feel deeply about’. His frustration is that we tend
    to see branding as an external image rather than being a reflection on who (or
    what) the business really is, or what its personality, values and identity are.


    Some basic questions are asked of companies:


    +   ■ Who are you?

    +   ■ Why are you here?

    +   ■ How are you unique?

    +   ■ How can you make a dramatic difference?

    +   ■ Who cares (do you care?)


    Branding and leadership are described as ‘Siamese twins’ with the inspiring leader
    setting the template for the ‘brand promise’. This in itself creates a challenge,
    especially as the flag waving, ‘follow me’ sort of leadership, as we traditionally
    know it, is increasingly being recognised as an unsuitable model for this new
    AI-infused future. After all, it might be argued, which of our leaders has experience
    of this new era of data, analytics and AI? Perhaps the leadership of the future
    must inevitably come from Gen Z rather than Gen X or Gen Y, in some form of ‘leap
    frogging’ of generations?


    Others describe leadership as a function of power, rather than a role or position,
    and believe that the leadership role can move from person to person, dependent
    on the nature of the circumstances.¹⁹


    If the leadership model is to change, then perhaps also is our understanding of
    brand. If branding is the way that organisations think, feel and behave, then
    this must in some way be embedded into its DNA in a sustainable sort of way. And
    most importantly, those brand values must align to the expectations of the organisation’s
    customer base. The paradox is that if we accept that ‘true brand’ has a degree
    of'
