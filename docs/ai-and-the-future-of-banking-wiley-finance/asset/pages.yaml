- pgno: 141
  md: 'Beyond economic analysis, consumption smoothing also reflects the way consumers
    act in terms of behavior, brand awareness and even the psychology of consumerism.
    In considering the psychology of ‘spending’, money is earned so that it is able
    to be spent. In doing so, consumers make themselves happier (possibly), so implicitly
    the banking system potentially appears to have some role in managing customer
    ‘happiness’.


    Consumerism also has a major role to play in fueling the economic growth, or prosperity,
    of a nation. The more we spend, said Adam Smith in Wealth of Nations, the better
    it is for our country. As the topic of consumerism is considered in the context
    both of banking and AI, the uncertainty of the impact of AI in the workplace also
    shouldn’t be overlooked, together with the possibility that, for many workers
    in routine roles (including in the banking industry), their working life may be
    prematurely reduced.


    Accepted thinking and economic theory are that high-interest, unsecured borrowing
    such as credit cards and overdraft management is often used as a way of managing
    and income/expenditure imbalance. It’s another part of maintaining stability of
    spending patterns, or ‘smooth consumption’ mentioned immediately above.


    The concept of credit smoothing is a controversial area that implies that credit
    management may be preferable to that of consumption management, and that it is
    better for consumers to manage their debt rather than their spending patterns.
    There’s been much research into this and theorists suggest credit smoothing and
    consumer smoothing are ‘countercyclical’ behaviours, which indicate changes in
    consumer behavior dependent on economic conditions. Research also shows that borrowing
    doesn’t go up when there has been a financial ‘shock’ such as unemployment resulting
    in lost income, but rather the contrary.23,24


    At a banking level, credit risk – which is the inability to pay– constitutes one
    of the greatest risks that banks can undertake.


    It’s important to understand these concepts in the context of banks, AI and, ultimately,
    in the context of consumerism. If retail banks in particular can better understand
    consumer behaviour through having a 360-degree understanding of the customer,
    then they can better understand how best to manage the customer’s money, even
    allowing for consumer and credit smoothing issues. The banks may then start to
    take on the role of financial guardians, perhaps giving advice in the same way
    that a financial manager might.


    Such advice will be analytically infused. The mantra that ‘analytics provide actionable
    insight’ remains valid, with special emphasis on ‘actionable’ but where does the
    burden of taking the ‘action’ actually rest? Is it with the consumer to listen
    to the advice and to act on it, or for an ‘intelligent bank’ somehow to be proactive
    around the money management exercise? At the very least, banks could be able to
    provide some sort of scenario modelling at a personalised, granular level that
    says, ‘If you don’t take this action, then these will be the consequences’.'
