    # ‘Digital Future of Banking Requires a New Leadership Model’


    In his article of this name Jim Marous of The Financial Brand also makes the argument
    for needing to change our understanding of leadership in the banking industry
    to reflect changes in technology, new forms of competition and the changing nature
    of the customer base.²³


    He suggests that not only do leaders need to be able to ‘articulate the vision’
    but also importantly make certain that adequate and timely resources are made
    available to ensure that the vision can be realised. He references the results
    of a five-year study between MIT Sloan and Deloitte that consider whether traditional
    models of leadership are sufficient, whether an entirely new model of leadership
    is needed to respond to the digital age or whether (as the report concludes) the
    future requires a blend of the old and the new.²⁴


    In an era of disruption, Marous concludes that future leaders must ‘embrace change,
    take risks, and disrupt themselves’. As for the leaders themselves, a survey of
    over 3000 by MIT/Sloan identified three key issues:²⁵


    +   1. The single most important attribute leaders needed to have was that of
    a ‘transformative vision’ (22%). By ‘transformative’, respondees to the survey
    believed that leaders should have ‘the ability to anticipate markets and trends,
    make savvy business decisions and solve tough problems in turbulent times’.

    +   2. The next highest was having a ‘forward-looking vision’ (20%), made more
    difficult by the need to manage business based on multiple possible scenarios
    they describe as ‘embracing ambidexterity’. In practical terms this means doing
    something differently with each hand simultaneously. In business terms, it refers
    to operating two business models at the same time with all the organisational
    tension that creates.²⁶

    +   3. The third most important skill was identified as being ‘technologically
    savvy’ (18%) by having an understanding of the technological landscape. The 2019
    report identified that ‘only a quarter of all board members fell within that category,
    and that digital literacy didn’t seem to exist above middle management level’.


    MIT/Sloan identified four key activities for leaders in banking to enable them
    to become digitally aware:


    +   1. Self-directed learning, at conferences or from digitally aware mentors,
    or both

    +   2. Becoming ‘digital tourists’ by meeting with peers from more technologically
    advanced businesses

    +   3. Having digital strategy ‘retreats’ that focus specifically on technology

    +   4. Recruiting new leaders with strong digital skills


    It’s important to recognise that this is not a one-off programme of activities
    but rather needs to be continuous to reflect the continuous evolution of technology
    in the current climate.'
