  md: '# CHAPTER 10


    # Innovation and Implementation


    # SUMMARY


    This chapter will consider issues such innovation and, more importantly, implementation.
    Implementation is the proverbial ‘elephant in the corner’ and often the stumbling
    block of many organisations.


    Whilst the issue of leadership has been explored elsewhere, including the nature
    of organisations and how they need to adapt, in this part we will look a little
    more deeply into that element in the context of innovation and implementation.


    The chapter will look into inventive approaches such as the creation of new roles
    and responsibilities to encourage innovation, and the use of bootcamps and hackathons,
    for instance. The topic of Fintech is also considered, and the appendix provides
    examples of Fintech companies in banking.


    Finally, we will explore potential blockages to innovation and suggestions for
    mitigating strategies.


    # NatWest Becomes First UK Bank to Launch Data Academy


    NatWest is to establish a Data Academy to train staff in in how best to understand
    and harness data. Open to all bank employees, it will offer a wide range of training,
    courses and qualifications that will cover all levels of proficiency.


    The move is central to both the bank’s digital transformation and to realising
    the full potential of a wide range of cutting-edge technologies, including artificial
    intelligence and machine learning. The academy will give staff the tools and training
    to serve customers better by offering more tailored, personalised products and
    services that best fit people’s financial needs.¹


    # INTRODUCTION


    Arguably there has never been a greater time to innovate. According to Ark Investments,
    ‘the global economy is undergoing the largest technological transformation in
    history’. The impact of innovation platforms such as AI, robotics and Blockchain'
  merge: -1
  img_proc: true
- pgno: 213
  md: '(as well as energy storage and genome sequencing) is estimated to dwarf the
    historic impact even of steam, the telephone, automobile, the internet and electricity.


    For individuals and organisations, this is the ‘Gold Rush’ of the modern age.
    Like the old prospectors of the Yukon, the secrets rest not only in where to dig
    for gold but how to sell and distribute it. As with the Gold Rush, there are profits
    to be made not only by the diggers themselves – many of whom failed and were reduced
    to austerity – but also by the intermediaries who rode on the wave of opportunity
    through the success of others. These intermediaries were key ‘enablers’ to the
    process, much in the same way that innovation hubs are offering intermediated
    and added-value services to start-ups. The size of valuations of companies such
    as WeWork as US $16.0 billion in May 2018, a US $6.0 billion increase in 9 months
    for what is, in effect, office rental space for some is startling but is, nevertheless,
    an indication as to how some place huge value on innovation.²


    Innovation is a subject others have covered in the past and in its broadest sense
    it’s just about doing something new. ‘New’ may refer to something entirely new
    or just new to the sector. In fact, many innovations occur as a result of a transfer
    of ideas from one industry to another or from one geography to another. Innovation
    need not comprise a ‘eureka’ moment but may simply involve a logical consideration
    of an approach or technology operating successfully in one sector and, with an
    enquiring mind, wondering how it might apply to a different one.


    Many organisations have a desire to be ‘first’ and bring new innovative ideas
    to the table, but there are many advantages to being second, subject to issues
    of intellectual property ownership. Second mover advantage occurs when an organisation
    looks at the ‘first mover’, in effect the original innovator, and not only improves
    on that innovation but also exercises or implements the innovation more effectively.


    Typical advantages of being a ‘second mover’³ include these instances:


    +   - The first mover has already established a market or opportunity.

    +   - The development of the product is likely to be more robust.

    +   - From analysis of the customer base, it’s possible to go to market more quickly
    and profitably.

    +   - The supply chain can be optimised, unless the ‘first mover’ has obtained
    unique options through some form of agreement.


    Examples of second mover advantage include names such as Amazon, Apple, Pampers
    and Facebook. In a period of innovation there may be a real temptation to wait,
    replicate and build on the success of others. There is a key decision to be made:
    Should one try to innovate as a first mover, or replicate as a second mover but
    with superior implementation?


    # New Roles and Responsibilities


    Companies want to be seen to be innovators and to demonstrate thought leadership
    within the enterprise. Not only does it help to create good PR narrative but also
    it helps satisfy key stakeholders, including institutional investors who are keen
    to see that the organisation is moving ‘with the times’. It’s a real challenge
    for senior management,'
