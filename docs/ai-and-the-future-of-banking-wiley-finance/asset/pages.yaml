  md: '# The Collaborative Bank


    Mergers and acquisitions in the banking sector have become familiar in many parts
    of the world, both to satisfy the demands of scale efficiencies and also to provide
    a platform for revenue growth where there are complementary territories or products
    (a term sometimes described as ‘inorganic growth’). Another advantage is that
    they reduce competition and M&A activity effectively removes one of the competitors.
    It’s described as a ‘horizontal merger’ because the merging entities are usually
    involved in the same kinds of commercial or business activities.


    In many countries global banks are extending their operations with regional banks
    in those areas, helping the global players increase their dominance. M&A activity
    is controlled or ‘regulated’ by the ‘apex’ leading financial institution in the
    country, for example, the Reserve Bank of India.37


    There can also be a downside to M&A activity. Job losses may occur, which may
    be economically or politically unacceptable, and there may also be major challenges
    in integrating legacy technologies. On the other hand, general deregulation and
    market liberalisation remain as market factors in the structural changes in the
    marketplace. There is a fourth model to consider, that of a more collaborative
    banking system. (See Figure 8.19.) In many cases improved vertical collaboration
    along the supply chain is a precursor to acquisition activities as banks acquire
    new technological capabilities to ensure differentiation. The advent of Open Banking
    is suggested as also providing an eventual catalyst for greater collaboration.


    Although the term ‘collaboration’ is often used along the supply chain between
    the bank as client and a vendor (which may be a technology company but could quite
    easily be a distributor), the prospect of ‘horizontal collaboration’ between banks
    themselves should not be ruled out. Whilst operational optimisation is a factor,
    the customer experience should not be overlooked. For many retail consumers, the
    banking branch network provides a useful social function where local charities
    and communities can make cash deposits. Also, in areas where social deprivation
    or generational issues prevents (or slows down) a move towards a cashless society,
    the traditional bank has an important role to play. In 2018 the total number of
    bank branches in the UK had fallen to 7,207, from 11,365 in 2007.


    Perhaps as a recognition of this, in 2019 three of the UK’s largest banks – Lloyds,
    RBS and Barclays – decided to collaborate by opening trial ‘mini-hubs’ in four
    cities comprising ‘jointly run’ branches with longer opening hours, where businesses
