    # Thumbprint Recognition


    The idea of fingerprints being used for identification is longstanding. There’s
    evidence of them being used as a form of identification as far back as in Babylonian
    days of the second millennium BCE, when they were used as imprints into clay to
    validate contracts.19 By 265 BCE, they were also being used by the Chinese as
    a form of contractual identity, and fingerprints (with handprints and footprints)
    were taken as ‘scene of crime evidence’ even at that time.20


    By then the fact that they were unique had yet to be established. This wasn’t
    recognised until the nineteenth century when fingerprint records started to be
    kept, perhaps the earliest version of biometric data storage. In the US, the FBI
    manage the ‘Integrated Automated Fingerprint Identification System’, which apparently
    holds data on 51m criminal subject records and 1.5m civil (non-criminal) records.
    The US Visit programme, which captures fingerprint data on those entering the
    country, also holds records on over 5 million non-US visitors.


    Finger and thumbprints have inspired an entire scientific field known as dactyloscopy.
    Prints are unique because of the special characteristics of what are called ‘fingerprint
    ridges’, which not only include patterns such as arches, loops and whorls but
    also much smaller features experts call minutiae. In essence, a fingerprint or
    thumbprint is a record of the ‘friction ridges’ or ‘epidermal ridges’ – that is,
    the raised parts of the finger. These ridges not only provide grip but convey
    information to sensory nerves beneath the skin. Fingerprints are difficult to
    alter and are enduring, meaning that they don’t change during the lifespan of
    the user even if there have been efforts by criminals from time to time to remove
    personal fingerprints using ‘superglue’.


    Automated scanners aim to measure not only the location of the friction ridge
    but also the depth between the peaks and the valleys of the ridge. This information
    can be distorted by applying pressure to the fingers. For this reason the idea
    of ‘contactless scanning’ of fingerprints has been introduced through which 3D
    information about the fingerprint can be obtained. This area has been the subject
    of criticism. Simple scanning devices can be conned using gel moulds, and in 2013
    a group of hackers bypassed the thumbprint validation system of Apple’s iPhone
    5S ID touch print sensor (which Apple have now seemingly corrected).21


    Nevertheless, it’s an area that continues to receive attention. Modern techniques
    capture a digital image of the finger, which is processed into a biometric template,
    which is then stored and matched. These techniques can be optical, capacitive
    (that is, managing electrical resistance across micro points of the skin), thermal,
    ultrasonic, or even by considering the ‘microelectromechanical’ component of the
    skin, which considers such complex combinations as electrostatic charges, magnetic
    elements and surface fluid mechanics.'
