    +   - Understanding the problem

    +   - Building the ‘right’ thing

    +   - Building the thing ‘right’


    # Finding Capital to Innovate: One Example


    For many banks, the pressure is on to get beyond their normal walls of business
    and have the ability to compete with newer, more flexible competitors. Unless
    specific funds have been put aside for development, there is the inevitable challenge
    of where funding might be found. Despite recognising that in many cases it becomes
    a ‘mission critical’ exercise to transform, at the same time there are often budgetary
    challenges.


    This particular example is included to flag up the potential for looking more
    carefully into an existing business to identify where development funding might
    be obtained. In this situation, the use case was that of developing an omnichannel
    solution across online and social media environments, with funding obtained through
    better management of their telecom costs.


    By way of background to this innovation example, omnichannel banking is described
    as a ‘seamless banking experience’ that a customer enjoys however he or she interacts
    with the bank, whether mobile, retail or over the internet. (See Figure 10.26.)
    It reflects the desire of consumers that the bank ‘speaks with one voice’. According
    to Global and Finance Banking site, by adopting an effective omnichannel strategy,
    Wells Fargo bank in the US have reported an ‘increase in purchase rate by 1.9
    times, increase in customer retention by 20ppt and increased cross-selling per
    house-hold by 6 products among others.’17


    With such apparent benefits it would seem that investment in omnichannel is critical
    for banks, but a large proportion of IT investment is still directed towards the
    maintenance of their legacy systems. As a result, banks are increasingly looking
    at ways


