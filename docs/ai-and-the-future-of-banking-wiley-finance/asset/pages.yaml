- pgno: 168
  md: 'In summary he describes the branch of the future as:


    +   - Open and private

    +   - Offering high-tech solutions and highly personalised services

    +   - Warm and inviting

    +   - Leveraging technology to enable flexibility


    All banks need to consider how the traditional branch transforms itself into a
    new, welcoming space. Adrenaline Agency considered this in their blog ‘Best practices
    in refreshing, transitioning and reforming space’, suggesting that there are three
    key implementation phases:


    +   - Refresh

    +   - Transition

    +   - Reform


    Within each of these three phases there are two key elements:


    +   - **Visual**: Principally this relates to branding, internal and external
    signage. Improving visual elements such as lighting and colour can have a dramatic
    impact on how a space ‘feels’.

    +   - **Operational**: This comprises the construction of the space and the equipment
    contained there. It starts to address the functionality of the space by removing
    areas that don’t work well and creating what they describe as ‘new zones of experience’.


    Through these three phases of refresh/transition/reform, it’s possible to initially
    understand how a relatively low-cost refresh programme might simply improve the
    visual impact. The topic of addressing functionality falls into the transition
    category, perhaps by having new desks or pedestals. More radically, reform requires
    the bank to completely reimagine the space from top to bottom. The challenge is
    that banks may not want to go through the costly exercise of reforming or ‘reimagining’
    every single branch. It becomes important that banks are able to prioritise which
    branches should be improved and this requires the use of analytics to effectively
    measure branch performance (as has been covered earlier in this book). To that
    extent, analytics becomes a critical tool to establish not only performance but
    branch potential and investment rationale.


    From an order-of-magnitude perspective, there are degrees of expenditure within
    any given category but one might imagine an allocation of costing such as that
    shown in Figure 8.16.


    An alternative approach might be that of combining banking with other services
    such as retail or, as suggested below, with the providers of coffee. The idea
    of ‘planting’ a bank inside a department store, typically a supermarket, should
    not be taken as an easy ride for the bank and a way of getting before customers
    at a reduced cost. Supermarkets are especially sensitive about the topic of space
    allocation, refusing to sacrifice space to nonprofitable product lines unless
    there is a good promotional reason to do so. Banks inserted into supermarkets
    will need to justify their presence.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '![](img/58d39abe2abae45d51491548f7293e40_169_0.png)


    # FIGURE 8.16 Transformational Cost of Branch Improvements (Based on Adrenaline
    Agency).


    Similarly, the idea of placing banking services in retail outlets continues to
    attract attention but readers should not forget that the traditional retail sector
    itself is under threat from online purchasing. Both the High Street function and
    the shopping mall presence are under question, as consumers increasingly use physical
    shops as a place to touch and try, rather than to buy. Retailers themselves are
    trying to reinvent themselves to create a ‘customer experience’ that will ultimately
    lead to a sales opportunity, rather than to sell directly. What role do banks
    have in that ‘retail customer experience’?


    # The Emergence of the Café Bank


    Millennials have adopted a new way of working. Once called the Flat White Society
    after the preferred coffee on order, new start-ups around the world increasingly
    centre their business activities around the coffee shop, an informal setting where
    the internet is free. Coffee shops also seem to be part of the devil’s bargain
    because they seem not to worry about time spent by visitors, nor do they change
    their internet access codes on a daily basis. As start-ups become more successful,
    they often evolve from the café to the innovation hub, where expertise is consolidated,
    mentoring is readily available and support services are within reach.


    But let’s focus on the coffee shops and their role in the future of banking. The
    idea of banking coffee shops isn’t new but it’s an emerging trend. Already in
    local bank branches customers are often offered coffee whilst waiting to see an
    ‘advisor’, but this may be more of a courtesy than any attempt to replicate the
    café bank model. Some might argue that café banks are a new form of distribution
    channel. In the same way that there has been a crossover between vehicle ownership,
    leasing and financial services, the café banks seem to represent a crossover among
    retail, recreation and financial services, which places emphasis on co-location.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'As banks progress towards fully accessible, ubiquitous banking that isn’t dependent
    on a human at the end of a phone network but rather replaced by some sort of automated
    system, the concept of café banks is also likely to be affected. Robotics advice
    coupled with self-service coffee?


    In his article for International Banking, Urs Bolt refers to the concept of the
    ‘humanoid banker’ and looks further into the issue of robotic advice. He asserts,
    ‘Banking is more than technology, but it cannot progress without it.’⁴ By the
    same measure, perhaps café banks specifically have to be more than just coffee,
    but they cannot exist without it.


    # Millennials Not Happy with Dealing Only with Robots


    A survey carried out by Global Data suggested that ‘only 5% of UK millennial investors
