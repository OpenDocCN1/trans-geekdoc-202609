  md: 'that on the last trading day of the month there was a sudden surge (of at least
    0.2%) occurring before 4 pm, as often as 31% of the time, followed by a quick
    reversal.


    The management of currencies and transactions looks a little like a game but there
    are trillions of dollars at stake held by investors and pension funds. ‘Gaming
    theory’ ideas may be worth considering in the context of these issues, especially
    as automation of some or all of the rules might be on the horizon. Two particular
    gaming ideas come to mind, in the context of an interconnected economic environment
    and on which much has been written and analysed:


    +   - The ‘prisoner’s dilemma’ is an example of a game where two rational participants
    fail to cooperate or to trust each other even though it is in both their interests
    to do so. It’s a situation often seen in the climate change discussion.

    +   - In ‘grim trigger’, both sides will initially cooperate, but if one of the
    participants defects once, then the other will defect (or cheat) all the time.


    # Investment Banks and Blockchain


    In their 2017 report¹³ Accenture, together with benchmarking firm McLagan, indicated
    the use of Blockchain could enable investment banks to cut their infrastructure
    costs by between US $8.0 billion and $12.0 billion by 2025. In their survey of
    eight of the ten largest investment banks in the world, they concluded that they
    could ‘reduce infrastructure costs by an average of 30 percent, helped by better
    data quality and transparency’. Beyond this, it’s suggested that ‘costs associated
    with compliance, business operations such as trade support and centralized operations
    such as know-your-customer checks, could fall by up to 50 percent’. These savings
    do not allow for implementation costs. Others are more sceptical, suggesting that
    this is just another attempt to jump on the ‘Blockchain bandwagon’.


    The decision rests at the door of the regulator, who, it is suggested, might be
    reluctant to upset the applecart and introduce new solutions and technologies
    in the clearing and settlement infrastructure without being absolutely certain
    about the safety, security and resilience of these new approaches.


    Other countries appear to be more bullish about the use of this technology. In
    his article ‘The Bank of China Sees Future in Blockchain’,¹⁴ writer Anujit Mukhopadhyay
    reminds us that the Bank of China – one of the largest in China and a state-owned
    enterprise – are looking to transform their business not only through the use
    of data and AI but also through the use of Blockchain. The bank already uses Blockchain
    in as many as 12 projects (as of 2018), including cross border payment, digital
    currencies and data sharing, amongst others. By 2018 they had already filed 11
    patents for Blockchain technologies, making them the largest Blockchain innovator
    in the Chinese financial services sector. According to Mukhopadhyay, one particular
    patent is that of compressing data in the blocks, which gives scalability. BoC’s
    goal is not only to digitise its entire operation but also to transfer all its
    operations to a digital platform and remove the need for hard currency.


    The Chinese government have already taken a tough stance regarding the use of
    cryptocurrency, although in 2018 they published a ranking of top ‘coins’ (Table
    17),'
