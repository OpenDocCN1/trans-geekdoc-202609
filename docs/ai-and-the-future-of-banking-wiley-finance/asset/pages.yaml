  md: 'When comparing the current situation to the past, it’s suggested that the most
    likely reason that cryptocurrency won’t overtake that of sovereign money is the
    lack of political willingness. One shouldn’t be so complacent because the politicians
    may not be in control of the new digital economy in the same traditional way going
