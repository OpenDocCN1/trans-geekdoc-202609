  md: 'With its origins in security in the mid-''60s, one of the particular challenges
    was not only the ability to match facial elements to the database but also to
    compensate for issues such as ‘head rotation and tilt, lighting intensity and
    angle, facial expression, aging, etc.,’ according to Woody Bledsoe, who was one
    of the early pioneers. Technology has significantly moved on since then and both
    Facebook and Google, for example, now provide tags and photo apps that help users
    organise their photos by automatically identifying family and friends.


    Facebook became especially competent in this area by being able to analyse the
    content of 1.5 billion users, but some argued that this is a breach of trust,
    especially in what appears to be a largely unregulated area. In 2014 they issued
    a paper on a facial recognition program called Deepface, which claims to have
    97.35% accuracy. According to Cognitec Systems,¹⁶ one of the leading vendors:


    Essentially what is being looked at is a landscape of the face. Facial recognition
    software takes various measurements of each face and turns these into a string
    of numbers. Then it’s just a matter of comparing one string of numbers with another.
    The higher the similarity score, the more likely it is that you’re looking at
    the same person.


    The ‘Biometric Information Privacy Act’ may offer some remedies and protections
    to consumers. BIPA, as it is also known, was passed by Illinois State in 2008
    and (currently) remains the only law addressing regulation in this area, although
    there are a number of laws pending across several US states. It also permits injured
    parties to seek remedies in the court for misuse of biometric data.


    Facial recognition is a ubiquitous piece of technology with uses in almost every
    sector of industry or even in the community:¹⁷


    +   - In security where facial recognition is used; for example, in casinos, railway
    stations and airports.

    +   - In gaming with Microsoft’s X Box having the ability for users to access
    their profile using face recognition technology.

    +   - In advertising; for example, Digital Astra beers ads in Germany can detect
    the age and gender of passers-by and tune the digital billboard accordingly.

    +   - In retail it is used to count people and genders waiting in queues and to
    help in reorganising store layouts as well as to recognise shoplifters.

    +   - In social or religious settings; for example, in 2015 a company called Churchix
    even launched an app allowing churches to discover who was attending.


    A survey of US consumers by First Insight found that 75% said that they would
    not use a store that used that sort of technology, but interestingly the figure
    dropped to 55% if the store offered good discounts. If that’s the case, then the
    customer reaction to facial recognition seems to mirror that of the telematics
    industry, where users are prepared to ‘opt in’ for location tracking and ‘push
    notifications’ from coffee shops, for example, if they get some benefit such as
    a discounted drink.'
