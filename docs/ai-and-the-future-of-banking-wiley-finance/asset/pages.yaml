    permanence, then how does it react to changes in consumer sentiment brought on
    by political, economic, societal or technological change? Does a new concept of
    brand need some sort of flexibility within an agreed set of tramlines or parameters?
    A flexible approach to branding must be more than a willingness to change a logo
    or product package.


    In the context of the Future of Banking and the impact of advanced analytics and
    AI, what might branding in the future entail? The impact of data, analytics and
    AI is considered to be disruptive but perhaps this will also lead to disruption
    in the brand proposition.


    According to brand managers Fast Company, the future of branding will be that
    of ‘debranding’. They suggest that the smoothest branding, called ‘native branding’,
    was mainly to hide the commercial intention, aimed at creating a product familiarity
    and giving the brand the impression of reliability and being indispensable. Backlashes
    against branding – which often occur following overt product placement, for example
    – have increasingly led to subtler approaches, which they call ‘camouflage branding’.
    This is, in effect, subliminal messaging. Consumers, they say, are ‘are more likely
    to follow a happy, undemanding brand instead of bonding with real people and real-world
    problems. A brand will never ask you for help. It won’t confront you with difficulties
    or opposing views.’


    ‘Debranding’ effectively represents a backlash against consumerism. It is about
    the experience rather than the product, about people and about places rather than
    purchasing. It is said to be the ideal application for the networked age. ‘The
    brand that screams the loudest no longer commands the most attention; the one
    that offers something genuinely useful does’.


    It’s a callout for quality, not quantity, for value rather than price. ‘The only
    information on packaging will be features such as origin, the intentions of the
    maker, the production process, and the environmental impact.’ Ultimately the argument
    is that the consumer no longer needs brands but quality, and that they will be
    able to find this quality more easily in a networked society.²⁰


    Foresight Alliance take a different angle on branding,²¹ suggesting that by 2030:


    +   1. ‘AI Branding’ as a concept will emerge where intelligent customised brands
    actively seek out their customers in digital micro-segmentation. As a result,
    advertising will be transformed into a distribution channel for communication.'
