    Gen X by definition is the population segment following the ‘baby-boomers’ (those
    born mid-1940s to about 1964) and who were born between the mid-1960s and early
    1980s. Whilst it might have been convenient to have dealt with these three segments
    sequentially, Gen Y and Gen Z have more in common through their digital heritage
    and influences than Gen X, whose greatest influences arguably were political,
    societal and economic. Gen X are said to be a group that grew up at a time when
    society was more focussed on adults than on children, when divorce rates were
    rising and at a time that coincided with the sexual revolution.


    Much has already been written on this topic mainly because social scientists have
    had plenty of time to consider the causes and effects of this phenomenon. The
    interest here, though, is how this group specifically respond to branding and
    marketing, and especially their relationship with banking and the financial sectors.
    How they choose to ‘digest’ branding and marketing information is also interesting,
    with some overlap between distribution channels by demographic segment. (See Figure
    6.14.)


    Gen X are described¹² as being:


    +   - ‘Independent, resourceful, and self-sufficient’ and distain being micro-managed

    +   - ‘Technically adept, with the ability to absorb the use of new technologies’

    +   - More flexible, especially around the workplace

    +   - Value the work/life balance


    Marketers such as Maye Create suggest that Gen X aren’t as conservative as their
    baby boomer parents but less liberal than their Gen Y children.


