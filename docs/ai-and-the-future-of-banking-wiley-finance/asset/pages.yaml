  md: '# IMPLEMENTATION


    When the issue of implementation is considered, what in effect is being considered
    is the ‘operationalisation’ of the innovated product, service or solution. This
    issue relates not only to organically designed (that is, internally innovated)
    products and services, but also to those that are created in association with
    an external partner, which may be a Fintech start-up. Implementation should not
    focus on the technology, no matter what the temptation, but should also consider
    issues such as how it affects the current (and perhaps future) business models,
    what is the value proposition from a customer viewpoint and how the innovation
    might be brought to market.


    In the specific context of implementing an AI programme, there is a series of
    key components that might be described as a hierarchy, in that they range from
    foundational requirements, such as hardware and storage, to the ability to deliver
    solutions at scale and that meet particular business requirements. (See Figure
    10.25.)


    Cultural issues are also an important contributor to change. In their 2019 report
    ‘Building the AI Powered Organisation’, McKinsey propose that organisations guard
    against a ‘plug-and-play’ approach to AI by suggesting that adopting a number
    of point solutions to individual problems is not the best way forward, but rather
    that organisations need to adopt an enterprise-wide view of AI transformation,
    focusing, for example, on the entire customer journey. They say, ‘At most businesses
    that aren’t born digital, traditional mindsets and ways of working run counter
    to those needed for AI.’


    ![](img/58d39abe2abae45d51491548f7293e40_216_0.png)


    FIGURE 10.25 Artificial Intelligence Hierarchy.'
