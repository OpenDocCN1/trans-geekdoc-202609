  md: '![](img/58d39abe2abae45d51491548f7293e40_116_0.png)


    FIGURE 5.13 Hierarchy of Speech Understanding.


    In terms of how the computer analyses these, there are four broad approaches,
    although these can be further broken down into more granular analysis, as per
    Figure 5.13:


    +   1. **Simple pattern matching**: This is where each word is recognised in its
    entirety so that the system recognises the pattern of speech. This is a very basic
    approach and one that is familiar in the use of call centres, where the automated
    phone system invites us to say our ‘selected service’ or to read out our bank
    account details. It usually only comprises the ability to recognise ten numbers
    and the computation is relatively not complex.

    +   2. **Pattern and feature analysis**. This is where each word is broken into
    bits and each bit (such as a vowel) is recognised. In this process, the speech
    (in its analogue form) is digitised, converted into a graphical form and into
    acoustic frames each lasting 1/25th or 1/50th of a second. The output is then
    compared to a phonetic dictionary and the system identifies what has probably
    been said. Many of these systems have a form of correction process so that there
    is a degree of continuous learning by the system.

    +   3. **Language or statistical modelling**. This is where a knowledge of language,
    grammar and the probability of words being used helps to speed up accuracy. It
    uses statistical analysis to anticipate the sequence of certain words or phrases,'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'for example that two nouns rarely are used side by side in language but rather
    are most likely to be preceded by a noun or adjective. Modern speech recognition
    systems not only do this but also take into account the possibility of gaps between
    words. One of the leaders in this space was a Russian mathematician called Andrey
    Marcov, whose system of analysis is known as the ‘Hidden Marcov Model’ (HMM),
    ‘hidden’ because the system of analysis sits in the background of the system.


    4. Artificial neural networks. This is where AI-type systems can reliably recognise
    patterns and word sounds. Whilst HMM has been the backbone of speech recognition,
    the use of systems which mimic the human brain through internal ‘connections’
    has also allowed the recognition of speech patterns. These are known as ‘Artificial
    Neural Networks’ (ANN) and are sometimes used together with HMM. It’s easy to
    understand the complexity of the challenge.15


    Today’s personal systems make speech or voice recognition more commonplace and
    most are already familiar with systems such as Siri, Alexa or Cortana, for example.
    Most personal devices already have these capabilities built into the system, so
    rather than typing a question into a search engine, the only action required is
    to speak into the device. Admittedly, there are often issues with background noise
    but it is possible to incorporate filters into the recording process, eliminating
    ambient sound much in the same way that top-end headphones eliminate aircraft
    noise. Perhaps the biggest barrier is the user themselves and their reluctance
    to ‘talk’ to a system. With time, that attitude will change.


    When we consider the Bank of the Future, we should imagine that screens and keyboards
    will become increasingly obsolete and that our interaction with the banking system
    will be mainly voice-driven. Even if we improve the accuracy of recognition, it’s
    likely that users will still remain cautious when it comes to financial matters.
    How quickly will it be before payments are made to a third party or a transfer
    of funds based on a voice command only? How will that instruction be tracked?
    Where will the governance around ‘mistaken verbal instruction’ rest?


    On the other hand, can’t an intelligent system query an ‘odd’ or seemingly incorrect
    instruction? And if the cost benefit of using voice recognition or indeed any
    other system outweighs the risk, can’t some pricing be built in for the risk,
    and if so why should consumers feel constrained? Can’t fraud analysis advance
    at the same pace as biometric analysis?


    If AI is being properly considered in the context of banking, initially in retail
    banking but extending to wealth management, then the increasing importance of
    more effective voice recognition capabilities should not be ruled out.


    # Visual and Facial Recognition


    Face recognition systems are those that can identify or verify an individual from
    their digital image. In general, they work by comparing selected facial features
    of the individual and comparing them to a database. It’s described as a ‘biometric
    AI application’, biometrics being the technical term for any measurement of the
    body. Biometric identification is the process also used in fingerprint or eye
    iris recognition systems.'
