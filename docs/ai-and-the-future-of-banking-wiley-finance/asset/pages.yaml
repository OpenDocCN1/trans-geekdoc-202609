  md: 'commissions) as opposed to being in the interests of the customer. New technologies
    have led to an automation of the complex calculations and predictions used, which
    together with better analysis of data have created major disruption, especially
    as other experts have developed their own capabilities.


    # 5. The Disruption of Sales and Trading:


    In 2014 the Volker Rule, which was passed as part of the Dodd–Frank regulation,
    banned investment banks from making bets with their own capital, also known as
    ‘prop trading’. The rationale behind this was that if the bank was making bets
    with its own capital, it might take higher risks, and in doing so place the whole
    bank and the customers’ money at risk. As a result, investment banks can now make
    money from trading only by charging a commission on each executed trade. Trading
    revenues for investment banks has plummeted. Collectively JP Morgan, Citigroup,
    Bank of America, Goldman Sachs and Morgan Stanley suffered a fall of 30% of trading
    revenue over a decade.


    Because of this, the mood again is towards the use of automation, including blockchain.
    Goldman Sachs’ automated trading platform, Marquee, was launched in 2018 with
    a view to automate processes, reduce staff, reduce cost and improve profitability.


    So what does the future look like for investment banks? Like all organisations,
    they are taking a good hard look at what is profitable and what is not. Effective
    use of financial analytics becomes a critical success factor in terms of making
    those important decisions. Key options include:


