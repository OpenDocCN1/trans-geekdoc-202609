    # UNIVERSAL BANKING AND BEYOND


    The concept of the ‘universal bank’ is one whereby banks provide a wide range
    of services, including credit, loans and advisory services on investment. A common
    approach in the US and Switzerland, a ‘universal banking system’ allows a bank
    to offer a range of services but does not oblige them to do so. Some of the major
    banks, such as Deutsche Bank, HSBC and ING Bank, are already considered to be
    universal banks. The general intention behind the concept is to leverage scale
    and customer insight, and also to gain greater access to capital.


    It allows the combination of an investment bank and a commercial bank to provide
    both services from a single entity. One issue to consider is to what degree banks
    may be prepared to go beyond the current model to one where the brand is extended
    into new business areas such as auto and property services. (See Figure 8.17.)
    Although universal banks tend to confine themselves to banking services such as
    retail, investment and stock-broking, it may be necessary for them to understand
    what a customer looks for in a bank.


    In their 2016 report,¹² Finextra asked what customers expected from their bank.
    Not surprisingly, there were issues relating to satisfactory discharging of all
    the hygiene factors of the banking process, such as speed, efficiency and security,
    but the report implied that ‘connected consumers’ are expecting much more, particularly
    asking for ‘banking services which integrate with their everyday life’. This might
    be described as banking services extending to a ‘Lifestyle Ecosystem’.


    Some banks are already moving in that direction by bolting on additional capabilities
    such as home emergency, travel and health insurance, but these add-ons still feel
    clunky and far from being seamless in terms of the consumer experience. Usually
    they are a series of ‘hand-offs’ to independent third-party providers with little
    insight into the customer’s own needs, instead viewing these relationships as
    insular and ring-fenced. In many cases, the third parties are also working for
    others and are unlikely to be able to provide any service or brand differentiation.


    If the banks are to follow a more strategic and broader approach to universality,
    there are major issues to overcome, such as:


    +   - Effective bidirectional flow of information from third party to bank, and
    vice versa

    +   - Greater understanding of customer needs

    +   - Better supplier management controls and methodologies

    +   - More effective brand differentiation in the supply chain'
