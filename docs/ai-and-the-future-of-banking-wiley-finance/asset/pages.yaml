  md: '+   - Letting C-level executives and the board connect directly with technology
    staff and vendors

    +   - Going off-the-shelf even if it means limiting your choices

    +   - Getting consumer feedback but not too much or output will be clouded

    +   - Forgetting top-down ideation but rather encouraging bottom-up innovation⁸˒⁹


    Futurion’s 2017 ‘Innovation Speed to Market Report: How Financial Sector Firms
    Manage Innovative Projects’¹⁰ is based on a survey of 28 Industry leaders, and
    asked three questions:


    +   1. How long do innovative projects take on average?

    +   2. How are projects structured?

    +   3. What is the learning?


    Perhaps unsurprisingly they record that projects differ considerably in duration,
    with the typical project length being 24 months. Undertaking development in manageable
    chunks is critical, they say. According to one executive, ‘Sometimes when a company’s
    development process is too long, you don’t even launch what you first built. .
    . you just scrap it before you finish it’.


    However, many financial services firms appear able to move more quickly ‘if they
    have to’ – for example, if there are hard deadlines that must be met. The need
    to comply with regulation is a prime example. It is not surprising that innovators
    create ‘burning platforms’ if there are none already present in order to energise
    the organisation. On the other hand, some burning platforms originate naturally.


    The most successful approaches to innovation appear to replicate what occurs in
    software companies, rather than behaving like traditional financial services.
    In terms of how these projects are structured, successful financial services businesses
    described their innovation process implementation as tending to be one of three
    different options:


    **Waterfall:** A waterfall development is a linear, sequential approach to development
    that symbolises a logical progress of steps. Typically, this comprises identifying
    the requirement, analysis, design, coding (where needed), implementation, testing,
    operation and ultimately maintenance. This approach is considered to require meticulous
    record keeping.¹¹


    **Agile:** This is a form of implementation where development occurs in incremental,
    rapid releases, with each release building on the previous functionality. Unlike
    the waterfall model, very little planning is needed to start the project. On the
    down side, key issues are that it is difficult to anticipate timing and resources
    needed. It’s an approach that is mainly collaborative in nature and focuses on
    principles rather than process.¹²


    **Agile plus Waterfall:** This approach combines both the waterfall and agile
    approaches. It allows developers to plan out the end results of the final project
    to allow time/money to be forecasted while having a decent documentation of the
    work (Waterfall), and also to allow breaking down the project into defined phases.'
