- pgno: 146
  md: '+   4. Personal or physical power where we might be physically or mentally
    intimidated by an individual or group.

    +   5. Personal self-awareness which is a sort of ‘Zen’ approach to whether an
    individual exerts or subsumes to other powerful influence, such as externally
    (bullying) or internally (depression)

    +   6. Power of love where there is (irrational) emotional influence.


    Focusing more specifically on leaders, they need to:


    # 1. **Understand the key drivers of good and bad decisions, and the difference
    between decisions and outcomes.**


    It might seem obvious to us what is a good decision or not, but it’s often more
    complex than that. *Psychology Today* defines a good decision as ‘one that is
    made deliberately and thoughtfully, considers and includes all relevant factors,
    is consistent with the individual’s philosophy and values, and can be explained
    clearly to significant others’.


    They suggest that a ‘good decision’ is different to a good outcome, as ‘the outcome
    of any decision can be affected by factors which the decision maker cannot control.’⁷


    # 2. **Be able to create the right environment for effective decision-making,
    which is more than just the right physical environment.**


    This also includes having access to the right information (on which the decision
    is being made), the right tools (De Bono’s ‘Thinking Hats’ approach, for example),
    and having the right people involved in the process.⁸


    # 3. **Understand the key barriers to effective decision-making.**


    This might include psychology (the science of behaviour and mind including conscious
    and unconscious reaction); sociology (the study of social relationships and interactions);
    anthropology (the study of human behaviour including what the ‘norms’ are, which
    extends to culture and the use of language); political science (which deals with
    governance, political power and distribution of resources); and economics (the
    study of the production, consumption and transfer of wealth).


    # 4. **Understand behaviour decision-making science.**


    This includes the science of judgement and decision-making which extends to ‘cognitive
    science’, rational thinking, and decision-making tendencies (such as underweighting
    or overweighting of probabilities).


    It all sounds a pretty daunting set of skills and competences to attain and maintain.
    Some leaders have the ability to do many of these things intuitively, but others
    require formal and continuous training. One key question to address is to what
    degree these skills will be supplemented or even replaced by robotics or AI systems.


    Most seem to agree that it’s unlikely that leadership will be replaced by robotics.
    They argue that:


    +   There are too many variables, and machines don’t know the difference between
    the important ones and the less important ones.

    +   Humans still have the ability to take a broad view of not only what is happening
    but what will happen and how this will have an impact in the future.'
