    +   - Allow the bringing together of startup and innovation ecosystems.

    +   - Provide clear separation ensuring security, agility and governance.


    ‘Cloud’ computing also needs to be considered. One good and simple description
    of cloud computing, often just referred to as simply ‘the cloud’, is the delivery
    of on-demand computing resources. This includes everything from applications to
    data centres. These resources may be on a pay-for-use basis, often accessible
    through wireless or increasingly at no cost to the consumer as an added-value
    offering. There’s a growing trend for High Street branches of banks to offer complimentary
    Wi-Fi to visiting customers and also, incidentally, to passers-by as an attempt
    to encourage them to visit the premises.


    For the record, the concept of ‘the cloud’ is not a process in the sky or somewhere
    in the ether but rather is an expression to reflect a capability. Users should
    not be misled by the fact that there are usually no cables or physical connectivity
    involved. As with the other processes described above, the technology is too complex
    to be considered in detail and cloud computing as a topic is in itself worthy
    of its own book. Cloud computing also provides another example of how a paradigm
    shift in the thinking of the banking industry needs to take place.


    The entire concept opens the door to new thinking and those who do not have an
    open mind will be disadvantaged. In their 2014 document ‘Predicts 2015: Cloud
    Computing Goes Beyond IT Into Digital Business’,¹² Gartner indicate that business
    leaders will need to ‘constantly adapt their strategies to leverage increasing
    cloud capabilities’. The use of a ‘private cloud’ is also a critical element in
    terms of the adoption of a digital strategy. A ‘private cloud’ is one accessible
    only within the business enterprise. The game has moved on significantly in a
