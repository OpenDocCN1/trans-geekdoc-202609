  md: '# BANKS WILL USE AI TO BECOME LIFESTYLE MANAGERS


    The convergence of brand and lifestyle has long been recognised. Both consumer
    goods suppliers and banks/wealth managers focus on the same market, albeit from
    different directions, so there is increasingly greater opportunity for convergence
    of thinking and shared technologies:


    +   - Banks have a potential role in providing a catalyst for consumer spending.

    +   - Consumer goods suppliers have a potential role in helping banks not only
    provide available lines of credit, but also wealth management advice.


    Both might use advanced analytics and AI not only to identify potential customers
    but also to ensure that the right products, services and lines of credit are placed
    before them in a timely way. One particular challenge is that of ensuring customers
    do not over extend themselves in terms of their financial decisions.


    In considering the future of banking, the most sophisticated financial institutions
    will not only provide modeling for the present, taking into account different
    risk appetites, but also help the consumer plan effectively for the future, taking
    into account current and anticipated assets, current and expected commitments,
    lifestyle and life expectancy. Key branded organisations will ultimately become
    ‘partners for life’, a sort of quasi-financial marriage using advanced analytics
    and AI as a form of catalyst. We will conceivably become ‘married’ to the financial
    brand. Integral to that long-term relationship will be key issues such as consumption
    and credit smoothing.


    # Consumption and Credit Smoothing


    The concept of ‘consumption smoothing’ is a process by which consumers manage
    their personal lifestyles to ensure that they have adequate savings to maintain
    their lifestyle, including during retirement. It’s a balance between sensibility
    and frugality. Those who overspend during their working life and fail to save
    will suffer the consequences later on in life when they have inadequate savings
    and need to adopt a more frugal existence. Those who ‘oversave’ whilst working
    and lead a frugal existence at that time will (hopefully) reap the benefits in
    later life.


    It suggests that some element of ‘frugality’ will need to occur sooner or later,
    and that it’s a delicate balance to plan. From an economic perspective, ‘consumption
    smoothing’ is all about:


    +   - Stability of consumption, for example, the management of spending patterns
    or purchasing behaviour at different stages of the consumer lifecycle

    +   - Reduction of risk and uncertainty, for example, where there is an unexpected
    loss of income or life event

    +   - The ability to predict what might be needed in terms of financial reserves'
