  md: 'They said that digital banking is about three key elements in order to deliver
    demonstrable and sustainable economic value:


    +   1. The delivery of a customised but consistent (financial institution) brand
    experience to customers across all channels and points of interaction

    +   2. An experience underpinned by analytics and automation

    +   3. An environment that requires a change in the operating model, namely products
    and services, organisation, culture, skills and IT


    This definition implies that digitalisation is primarily a way of creating a customised
    brand experience, but this is an arguable point of view. Digitalisation needs
    to be more than a brand or personalised (or customised) distribution model but
    together with these, a completely different way of thinking about the banking
    business. (The issue of ‘brand’ is considered more in Chapter 6.)


    McKinsey suggest that digitalisation can give as much as a 30% revenue boost to
    mainstream revenue¹⁶ (i.e. through high turnover products such as personal loans
    and payments), as well as taking out between 40% and 90% of back-office costs
    as a result of automation, workflow and self-servicing capabilities for customers.
    They indicate that effective digitalisation can double staff productivity (aka
    ‘halve the labour force’) as well as improving customer service. It is a way of
    reducing or removing current legacy frictional processes in favour of smoother,
    straight-through operations.


    At its most simple level, digitisation is a mechanism leading to low overheads.
    It opens the door for RPA (Robotic Process Automation). More importantly it is
    a mind-set issue for the bank, who need to place absolute focus on becoming digital.
    (See Figure 2.4.)


