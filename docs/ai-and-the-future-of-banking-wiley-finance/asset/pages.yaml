- pgno: 88
  md: 'is, banks where the credit line originates, are in line with planned diversification
    and strategies. This takes into account:


    +   1. The characteristics of the originating bank and also the volumes involved

    +   2. The ‘back-end’ performance, which takes into account the characteristics
    of the portfolio, previous losses and any delinquencies

    +   3. Management of capital and reporting, according to Basel II, Basel III and
    subsequent iterations.


    +   - **Market risk:** ‘Market risk is described as the risk of financial loss
    resulting from movements in market prices.’ The European Banking Authority (EBA)
    defines market risk as the risk of losses on-and-off the balance sheet that occur
    as a result of ‘adverse movements in market prices.’¹⁸

    +   - **Investment and liquidity risk:** Liquidity is the capability of an entity
    to pay its debts without suffering catastrophic losses. So, liquidity risk is
    fundamentally about the quality and attractiveness of an investment, and whether
    it can be bought or sold quickly enough to prevent or minimise a loss. Expanding
    this, ‘Liquidity risk’ per se is the measure by which an entity – at either a
    corporate, organisational or institutional level – can meet its short-term debt
    obligations.¹⁹


    The most effective training courses cover issues such as international considerations,
    reflecting the needs of worldwide markets, and look at techniques used to identify,
    reduce and manage specific aspects of risk.


    # Risk Scenario Analytics


    In very general terms, in business, the concept of ‘scenarios’ requires the business
    not only to consider the outcome of a series of events but also the development
    paths leading to that outcome. Effective scenario analysis does not rely on historical
    developments but rather considers the individual turning points and events that
    might contribute to the possible outcome. These possible outcomes can be optimistic,
    pessimistic or relatively improbable.


    One should not, of course, rule out the concept of unexpected consequences, which
    can also be grouped into three categories:²⁰


    +   - *Unexpected benefit*, which gives a positive unexpected outcome, like winning
    the lottery

    +   - *Unexpected drawback*, which gives an adverse result in addition to the
    expected one (The example suggested is that of irrigation systems providing vital
    water for agriculture but resulting in waterborne diseases such as cholera.)

    +   - *Perverse result*, sometimes known as ‘backfire’, which gives a result entirely
    contrary to what might be expected, and where an intended solution only makes
    things worse.


    In financial services, a bank might also use this approach to anticipate changes
    in the economy and how this might impact their strategy, or to gain a better understanding
    of likely returns in periods of rapid, moderate or slow growth.'
