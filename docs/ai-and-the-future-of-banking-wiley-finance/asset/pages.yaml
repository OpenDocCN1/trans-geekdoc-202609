    # Voice Recognition and Voice Assistants


    Voice recognition is a process by which systems and software are used to ‘identify,
    distinguish and authenticate’ the voice of an individual speaker.¹³ It’s also
    known as speech or speaker recognition. It evaluates what are the ‘speech biometrics’
    of an individual including speed, intonation and accent. (See Figure 5.13.)


    Speech as a topic is a complex thing and is represented by the study of linguistics.
    It also includes the study of phonemes, or small pieces of language. The word
    phoneme itself is recognizable from its association with ‘phonetics’ and derives
    from the ancient Greek φώνημα (phōnēma), ‘sound made, utterance, thing spoken,
    speech and language’.¹⁴'
