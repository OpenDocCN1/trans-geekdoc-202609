  md: '# SAFEGUARDING THE BANK OF THE FUTURE:

    NEW CYBER SECURITY THREATS


    In considering the future of banking in an AI-context, the future of cyber threat
    also needs to be addressed. In his report ‘Future cyber threats and challenges:
    Are you ready for what’s coming?’22 information technology expert Michael Nadeau
    challenges the suggestion that the world is changing and the internet is changing
    as a result. Rather, he suggests, the internet is changing and the world is changing
    as a result. He looks though the other end of the telescope. If his thinking is
    extended, it’s possible to recognise that as the internet changes and evolves,
    then banking will also change as a result.


    He also refers to a group called ‘The Internet Society’ (ISOC), founded in 1992
    and still going strong. Their 2017 report ‘Paths to Our Digital Future’ reinforces
    their view that ‘the future of the internet is ours to shape for the next generation.
    Humanity must be at the centre of tomorrow’s Internet’.


    Elsewhere Nadeau also writes about the ‘State of Cybercrime 2017: Security Events
    Decline, but not the Impact’. In it, he refers to the US State of Cybercrime Survey,
    conducted annually. Of the 510 respondents of these major respondees, the average
    IT security budget is US $11 million, yet the majority of respondents (61%) saw
    cyber security as an IT issue rather than one of corporate governance.


    Beyond this, Symantec’s 2019 report23 also records multiple cyber intrusions:


    +   1. ‘Formjacking’ attacks skyrocketed, with an average of 4,800 websites compromised
    each month. (Formjacking is an approach where hackers insert a small piece of
    code into the checkout page of an online supplier and from this are able to steal
    credit card details of the purchaser.)

    +   2. A reduction in ‘cryptojacking’, which comprises the secret use of your
    device to ‘mine’ or access crypto currency.

    +   3. ‘Ransomware’ criminals who are shifting targets from consumers to enterprises,
    where infections rose 12%.

    +   4. More than 70 million records were stolen from poorly configured third-party
    supply chains, put down to rapid cloud adoption. Supply chains remain a soft target,
    with attacks ballooning by 78%. This especially presents a challenge to the concept
    of the extended universal bank, considered earlier.

    +   5. Internet of Things (IoT) and devices were a key entry point for targeted
    attacks, and that most IoT devices are vulnerable. The same issues arise as in
    item 4 above, in terms of the extended universal bank trying to add value but
    in doing so adding vulnerability.


    Items 4 and 5 are particularly important as society increasingly considers itself
    as being ‘connected’ (at least at a technological level). Symantec suggest that
    the weakest links are both in the supply chain and in the devices that will be
    more readily used. The concept of the ‘Connected Car’ sits alongside the ‘Connected
    Home’ and the ‘Connected Factory’ where the IoT indicates that associated devices
    are the weakest link in the chain. Symantic’s view of where commercial and technological
    vulnerability lies is potentially worrying. As banks extend into other value-add
    services by'
