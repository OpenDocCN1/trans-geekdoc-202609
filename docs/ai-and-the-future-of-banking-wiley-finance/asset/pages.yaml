  md: '‘The emergence of Blockchain technology, big data, on-demand services, cloud
    computing and the Internet of Things (IoT) are all spurring inclusive growth on
    the African continent. And it is the convergence of these exciting technology
    innovations that is changing the face of Africa’, says Van Der Beek, of Goodwell
    Investments, who are a Dutch investor focussing on the African market.²⁶


    It’s difficult not to take eyes off Africa at the moment. As has been seen with
    China and other Asian regions, the challenge of urbanisation is likely to have
    a major impact. Africa is urbanising more quickly than anywhere else on the planet.²⁷
    (See Figure 9.22.) It’s estimated that Africa’s 1.1 billion citizens will double
    by 2050 and more than 80% of this will occur in cities. According to McKinsey,
    by 2025 there will be 100 cities in Africa with more than 1 million inhabitants,
    twice the number of cities in Latin America.


    The concern, naturally, is whether the infrastructure is mature enough or capable
    of developing sufficiently quickly to meet this level of growth. There is especially
    likely to be hyper-growth of the slum areas, where 60% of those living in the
    cities already live. Without commensurate development of the infrastructure, there
    is a risk of yet another humanitarian crisis. It’s important to look for positivity
    in this difficult situation. Essential development opens the door to considerable
    economic growth, despite the nervousness of businesses and the private sectors
    to provide private funding (rather than rely on the public purse) due to issues
    of what they describe as ‘instability and regulatory confusion’.


    Figures 9.23 and 9.24 are provided by way of context relative to the sheer numbers
    involved and the degree of urban growth.


    Change is inevitable and whilst Africa is just beginning to see the benefits of
    the Era of Data and all that it entails, the opportunity for transformational
    growth remains not only tempting but potentially irresistible, above all for those
    with a longer-term view of the continent.


