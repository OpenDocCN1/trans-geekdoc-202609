  md: 'improved levels of employee satisfaction, which, in turn, is transformed into
    higher levels of customer service.


    In an AI context, this might be a difficult pill to swallow. Technological transformation
    usually depends on the robust return on investment, and this in turn often depends
    on headcount reductions. Innovation in AI development is no different to any other
    form of automation. ‘Heads’ are at risk and employees livelihoods are likely to
    be threatened. This is almost certainly going to impact their approach to change.
    Beyond this is a slightly irrational approach to AI, more aligned to sci-fi movies
    than reality but in some cases contributing to the ‘fear factor’. Effective communication
    is a key part in reducing that particular worry.


    Table 21 identifies some of the most likely blockages to innovation, and offers
    some suggestions regarding possible mitigating factors. The suggestions are not
    comprehensive and there are almost certainly other considerations at a personal
    and organisational level to take into account.


    # CONCLUSION


    Advances in technology can only be effectively monetised when they are effectively
    implemented. It is increasingly recognised that failed implementations can be
    due as much to cultural, organisational or behavioural issues as to failures in
    the technology itself.


    This chapter has considered some of the issues relative both to innovation and
    implementation, first by asking what is meant by innovation and how can this be
    done, and then second by considering some implementation issues, which include
    hackathons and the use of external sources such as Fintech hubs. Finally, it considers
    potential blockages to change.


    One of the major ones is that of organisations being unable to deliver on promised
    ROI, either because the original plan was overly optimistic or inadequate controls
    were in place to measure progress. To that degree, it appears essential that relatively
    straightforward BI reporting tools are in place in the office of finance at the
    outset of an implementation programme, to avoid disagreements at a later stage
    about the accuracy of achieved benefits.


    Some ‘legacy’ financial reporting solutions are already being rebadged as being
    critical components of AI implementation. Whilst this might arguably be considered
    jumping on the proverbial AI bandwagon, nevertheless they make an important point
    and offer a timely reminder that the analytical ‘basics’ need to be in place before
    companies launch into relatively futuristic AI solutions.


