  md: 'Blockchain remains very much in the Indian focus, with India having signed
    a Memorandum of Agreement as part of a BRICS initiative (Brazil, Russia, India,
    China and South Africa) as part of a plan under an ‘Interbank Cooperation Mechanism’.
    ‘The current agreement allows the development banks of BRICS countries to study
    the applications of innovative technologies in infrastructure finance and bank
    products optimization.’21


    In the same way that the Chinese financial market has undergone massive growth
    in recent years, so too has the Indian financial services sector. The annual report
    ‘Analytics and Data Science in Indian Financial Sector: A Deep Dive 2019’,22 undertaken
    by AIM and Jigsaw Academy, points to the use of analytics to focus on the three
    key imperatives covered earlier: operations, customer analytics and risk. However,
