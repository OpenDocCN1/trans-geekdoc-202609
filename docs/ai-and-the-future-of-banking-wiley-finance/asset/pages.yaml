  md: 'Consumers appear especially interested in:


    +   - Alerting services (57%)

    +   - Assistance services, provided on a 24/7 basis (54%)

    +   - Prevention services (47%)

    +   - Monitoring services (48%)


    According to Hiscox Insurance, at a commercial level there is still a wide disparity
    in cyber readiness. In ‘The Hiscox Cyber Readiness Report 2019’,¹⁵ they record
    that on assessment, overall US, German and Belgian firms score highest on the
    readiness level, with more than four-fifths of French firms still in the category
    of ‘novices’.


    # Cyber Security Toolkits


    The ‘Global Cyber Alliance’ describe themselves as being an international, cross-sector
    effort dedicated to eradicating cyber risk. It was formed in 2015 ‘to address
    systemic cyber risk through a proactive risk-based, solution-oriented approach
    to address and eradicate malicious cyber risks’.


    > > ‘What sets the Global Cyber Alliance Cybersecurity Toolkit apart is that it
    is an action kit,’ said Philip Reitinger, president and CEO of Global Cyber Alliance.


    > > ‘Our focus is on producing a dynamic clearinghouse of operational tools that
    help small and medium businesses address risk and improve their cybersecurity
    posture, leveraging the deep expertise of our network of global partners, such
    as Mastercard, and the experiences of actual GCA toolkit users.’¹⁶


    They describe their mission as:


    +   - One of uniting global communities

    +   - Implementing solutions

    +   - Measuring the effect


    Specifically, they offer a number of ‘toolkits’ or prescribed solutions especially
    targeted at the SME that aim to provide ‘actionable guidance’ and tools with clear
    directions to combat the increasing amount of cyberattacks on SMEs. The toolkit
    provides:


    +   - *Operational guidance*: With respect to cyber-related assets, such as multi-factor
    passwords, effective use of backups and how to prevent phishing and viruses

    +   - *Training*: Including templates and foundational documents

    +   - *Recognised best practices*: Including from organisations such as the Centre
    for Internet Security Controls, the UK’s National Cyber Security Centre (‘Cyber
    Essentials’), and Australia’s Cyber Security Centre (‘Essential Eight’)'
