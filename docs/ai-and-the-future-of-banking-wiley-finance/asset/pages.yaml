    and services to their own clients. www.bcbgroup.io |

    | BitX | BitXchange ‘Crypto transfers’ | Online exchange to buy cryptocurrencies
    with a simple bank transfer. The company offers its customers favourable interest
    rates and good feedback, constantly monitors all trends in the financial sphere
    and reacts to the slightest changes. https://bitxchange.ae/ |

    | Nebeus | ‘Low risk, trusted custodians, interest much better than with banking
    system’ | Nebeus is a full-service financial services platform enabling their
    customers to buy, sell, store, lend and borrow cryptocurrency. www.nebeus.com
    |

    | Xapo | ‘Always with you’ | Founded to address two of the biggest issues with
    Bitcoin’s success and adoption, those of accessibility and security. In less than
    4 years Xapo claims to have become the largest custodian of cryptocurrency securing
    over $10 billion for its members. Currently is expanding beyond Bitcoin to create
    a robust banking alternative that provides the same level of accessibility to
    and security in all facets of the customer’s financial life. https://www.xapo.com/en/about
    |'
