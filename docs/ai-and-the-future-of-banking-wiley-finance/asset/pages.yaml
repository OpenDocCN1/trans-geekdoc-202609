- pgno: 59
  md: '![](img/58d39abe2abae45d51491548f7293e40_59_0.png)


    # **FIGURE 3.6** Hierarchy of Analytical Capability


    +   - **Predictive Analytics** seeks to make predictions on the balance of probabilities,
    that is, what is likely to happen next. An example of this is the projection of
    sales and branch performance, enabling the bank to take a view as to what corrective
    campaign action might be needed.

    +   - **Prescriptive Analytics** not only anticipates what will happen next but
    what should be done about it, usually through some form of rules-based system.
    It is called ‘prescriptive analytics’ on the basis that it ‘prescribes’ (or suggests)
    a course of action. One example of this might be the activities happening within
    a contact or service centre. Commonly also known as ‘next best action’, which
    might be better expressed as ‘best next action’, it provides the contact centre
    agent with, for example, insight to help position the best next proposed offering
    to help to close a deal.


    Predictive analytics and prescriptive analytics are probabilistic in nature, in
    that there is no absolute certainty as to the predicted outcome, but rather the
    algorithms anticipate the most likely outcome based on the information available.
    It follows that the more data there is, and the better the data, then the likelihood
    of accurate prediction and more effective prescription will occur.


    Statisticians will be aware of the notion of the ‘false positive’. There are different
    meanings for this term dependent on the industry application. Generally, it’s
    taken to mean that of an incorrect outcome (or analysis) based on information
    that results in a ‘positive result’ when in fact a negative result should have
    been more correct. It’s a statistical anomaly and is often seen in filtering out
    junk mail, or in fraud analysis where an innocent transaction is identified as
    being ‘doubtful’.


    In all these cases there is an increasing quality of visualisation either in the
    form of dashboards, advanced graphics or some type of graphical mapping. Such
    visualisations'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'are increasingly important as a tool to help users understand the complexities
    of greater data, and to allow quicker decisions to be made. However, judgments
    based on the appearance of a dashboard are no substitute for the power of an analysis
    sitting ‘underneath’ the dashboard.


    Overall, it is important to emphasise that analytics is not the destination but
    rather what is done with the analytics, and that analysis should be viewed in
    that spirit. Analysis provides a means to an end, by changing processes and practices,
    and in doing so can create a combination of hard and/or soft benefits. These benefits
    may comprise:


    +   - Higher levels of customer satisfaction leading to higher levels of retention
    or cross selling/upselling

    +   - Greater operational efficiencies

    +   - Better risk management

    +   - More effective investment policies


    Insight provided from analytics should not only feed in to the development of
    best practices but also to manual and automatic decisioning, and ultimately to
    strategic and operational judgments. Overall the analytical process should not
    sit in isolation to the wider business but rather must be an integral part of
    the organisation, one we might describe as an ‘analytical enterprise’.


    # ''Next-Generation'' Cognitive Analytics


    ''Next-generation'' analytics is increasingly likely to be ‘cognitive’ in nature,
    not only by providing probabilistic insight based on some degree of machine learning
    but also with a more natural human interface (as opposed to requiring machine
    coding). Cognitive analytics is a stepping stone towards ‘full-blown’ AI. However,
    ‘cognitive’ is not ‘artificial intelligence’ or ‘AI’ out of the mold of HAL in
    Kubrick’s 2001: A Space Odyssey but rather represents a different relationship
    between the computer and the user.


    There’s already a great deal of confusion relative to the use of the terms ‘cognitive
    computing’ and ‘artificial intelligence’. It’s important not to be too churlish
    about these definitions. After all, the man and woman in the street often describe
    the ability of a system that makes predictions such as choice of music or viewing
    as a form of AI.


    Purists argue that they are different; generalists say that they are more or less
    the same. The concept of ‘cognition’ implies that the computing platform in some
    way replicates the operation of the human brain by combining different technical
    capabilities such as language processing, visual recognition, sophisticated algorithms
    and speech. The net outcome of this combination of capabilities is that the system
    ultimately ‘assists’ human decision making, rather than replaces it. By comparison,
    true ‘AI’ completely does away with the need for human intervention and for that
    reason sits at the very peak of the ‘hierarchy of analytics’.


    Cognitive analytics will have a major part to play in the banking challenges of
    skill shortages and the so-called demographic explosion.


    Forms of cognitive computing are already being used in healthcare and asset management,
    in the context of ‘wealth advisors’, and it is only a matter of time before it
    finds its way into mainstream retail banking activities.'
