  md: '# Responding to Cyber Attack


    In addition, the NCSC recommend the following advice²⁶ in the event that a business
    is subject to cyberattack:


    +   - **Secure the network:** By locking down the network this will restrict the
    hackers from having access to data but at a cost of disrupting the business’s
    own operation.

    +   - **Activate the ‘Response Team’**: NCSC recommend that there is a trained
    response team in place representing key parts of the business (IT, HR, Legal),
    or there is an external arrangement with a certified cyber security incident provider
    (such as from the ‘Council of Registered Ethical Security Testers’).

    +   - **Report the incident**: In Europe, for example, the GDPR rules require
    a business to notify the Information Commissioners Office (ICO) within 72 hours.
    Cases of fraud or extortion should be reported to the police. (In 2018 the ICO
    fined Uber £385,000 under the Data Protection Act for a 2016 breach when the firm
    admitted to paying hackers $100,000 to destroy data on 50 million users and keep
    quiet about it.)

    +   - **Review and learn**: Before returning to business as usual, it is recommended
    there is a complete audit of the business’s cyber strategy, and it is adjusted
    accordingly.


    Cyber security experts Analecta, a US-based company focusing on small and medium-sized
    business, suggest that susceptibility to cybercrime can be reduced by 75% with
    adequate training, which covers issues such as legal compliance, motivation and
    engagement, and improved responses to attack, and develops appropriate competences.²⁷


    The top five challenges to the adoption of cyber awareness programmes for businesses
    appear to be:


    +   1. Adequate resources

    +   2. Adoption or embracing of the awareness programme

    +   3. Support from management

    +   4. Support from end users

    +   5. Finding time to take part


    Whilst a banking organisation may have both policies and capabilities to manage
    cyber risk within the walls of its own enterprise, the problem is that its business
    partners may not. Constance Bommel aer, Senior Director, Global Internet Policy
    at ISOC, who adds that collaboration among all the actors within an ecosystem
    is required to promote complete security, puts it this way:


    > It may be the ecosystem of banking services that your business depends on, your
    ISP, or the legal framework in your country that puts your business at a security
    disadvantage.'
