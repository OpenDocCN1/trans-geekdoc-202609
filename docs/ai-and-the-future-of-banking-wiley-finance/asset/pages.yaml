  md: 'The FSB’s analysis highlights key issues between technological innovation and
    the banking market as being:


    +   - The degree of cooperation in the relationship between incumbent financial
    institutions and Fintech

    +   - The contrast between Fintech and more established tech firms (‘BigTech’)
    with the latter having large, more established relationships and networks

    +   - The relatively low reliance by financial institutions on third-party data
    service providers (e.g. data provision, cloud storage and analytics, and physical
    connectivity)


    The engagement of banks with Fintech often takes the form of equity investment
    or the provision of incubators where they assist start-ups looking to grow and
    scale their business not only by providing physical working space but also by
    giving access to funding, mentoring, and education. According to research by CB
    Insight, at the time of this writing in 2019, US banks have participated in 24
    equity deals to Fintech companies. This follows a record 2018, where US banks
    backed 45 equity deals to Fintech start-ups, a 180% increase from 2017.23


    Fintechs usually fall under multiple categories, although some straddle these
    and others provide innovation of a more general nature. According to a 2016 report
    on the number of Fintechs, there are over 1000 firms, with the main hubs in California,
    London, New York and France. In Asia, both China and India numbers are growing
    rapidly due to the size of population and the rapidly growing middle class. Australia
    is also very active due to a friendly regulatory environment. Insurtech appears
    to be getting considerable attention.24


    The top active venture capital firms in Fintech as of 2016 measured in number
    of deals were all California-based:


    +   - Sequoia

    +   - Accel

    +   - Index

    +   - Andreessen Horowitz

    +   - SVAngel

    +   - Khosla Ventures

    +   - 500Startups

    +   - First Round Capital

    +   - NEA


    In terms of the likely lifespan of any start-up, this is very difficult to gauge.
    An estimated 90% of start-ups are doomed to fail. Be they Fintech or otherwise,
    new businesses usually go through five key cycles:25


    +   1. Seed and development are about the creating of the idea and considering
    its viability.

    +   2. Start-up is the official stage. Many mistakes are made at this point in
    terms of business aims and objectives, priorities and strategies, which may explain
