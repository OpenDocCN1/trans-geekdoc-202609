  md: 'The banking industry is in a key transitional stage, which will be analytically
    and ultimately AI-fuelled and there will be important questions, the answers to
    which will underpin their strategy:


    +   1. How quickly will AI become not only a significant part of the banking agenda
    but a cornerstone of a bank’s strategy going forward?

    +   2. When will we see reference to AI in the annual reports not only of the
    major banks but of the intermediary and smaller ones as well?

    +   3. When will we see banks flip over from being financial services providers
    using technology, to becoming technology companies with banking knowledge?


    # CONCLUSION


    This chapter is only meant to be an introduction or ‘prologue’ to the main topic,
    which is that of analytics, AI and the ‘Future of Banking’.


    In an earlier book by this author, consideration was given as to how AI would
    impact the ‘Future of Work’, relating to all professions and industries.33 To
    allow that issue to be fully considered effectively required an understanding
    of what is meant by ‘work’. Adopting the same approach, it’s helpful to start
    to understand what is mean both by ‘money’ and by ‘banking’, although both are
    big topics and only the surface has been scratched here. Others, such as Galbraith
    and Fergusson, have written about these subjects in much greater depth. Galbraith’s
    book Money: Whence It Came, Where It Went34 was written in 1975 and is of its
    time, failing to mention the digital economy, which was at that time not even
    on the radar. Fergusson’s book The Ascent of Money,35 republished in 2009, only
    gives passing comment in his original version to the impact of digitalisation,
    which is a reflection of how much has changed within a decade or so.


    Fergusson also toyed with the idea of calling his book, with due homage to Charles
    Darwin, ‘The Descent of Finance’. He recognised finance as a topic that was –
    and continues to be – evolutionary. His argument, like Darwin’s, was that until
    we understand the fundamental truth about money, and inter alia, the fundamental
    truth about banking, then we can never really understand the future. In the financial
    evolutionary process, we need to absolutely recognise that the purpose and functions
    of banks is evolving through analytics and AI. Artificial intelligence might be
    to the banking industry what a meteor strike was to the dinosaur population. Through
    this process of ‘evolution’, banks will continually need to create new and sometimes
    radical processes and financing models, not only to maximise their future profits
    and maintain their existing profitability, but also to survive in a recognisable
    form. As Darwin discovered, it will not be the biggest and the strongest that
    survive, but rather the most agile.


    ‘We will never understand the fundamental truth about money’, says Fergusson.
    But he recognises that money and financial markets are, in some way, ‘a mirror
    of mankind, revealing every hour of every working day the way in which we value
    ourselves and the resources of the world around us’. If money is the mirror, then
    aren’t banks the frame that contains the mirror?


    It’s always tempting to think of ‘banking’ as some sort of generic term, and that
    all banks are more or less the same. Banks and banking are viewed from our own
    personal perspective or experience (both good and bad) and how successfully we
    normally'
