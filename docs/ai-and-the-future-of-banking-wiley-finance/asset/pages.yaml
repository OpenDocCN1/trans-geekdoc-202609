    this is much too difficult, and the dealer will use a series of portfolio management
    techniques which are known as ‘Greek options’, or ‘Greeks’. These are a series
    of options, or predictions, which ‘capture the sensitivities of an option value
    to market parameters such as time, interest rate and volatility’. They are called
    ‘Greeks’ because the sensitivities of an option to various market parameters are
    labelled with letters from the Greek alphabet, such as delta, gamma and vega.³⁶


    Beyond this complexity, investment managers also use a technique called ‘Value
