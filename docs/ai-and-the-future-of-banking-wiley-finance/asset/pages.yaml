    # Reinventing Risk Management


    In such an unknown and uncertain world, the management of risk will take on increased
    importance. Not just in terms of operational risk, which considers issues such
    as failure of systems, people or processes, but also with respect to new categories
    where business suffers vulnerability. Political instability, coupled with climate
    change plus technological advances, starts to push current ideas of risk management
    to the limit. In a heavily regulated industry such as banking and financial services,
    the ability to manage new levels of unpredictability increasingly becomes a critical
    success factor.


    In a future AI-infused financial system, how might the risk process be changed?
    What new capabilities are needed of future risk managers, whose business function
    will be augmented (if not substantially replaced) by automated systems and AI?


    In his recording ‘The Risk Manager of the Future’, Brian Ruane of Willis Towers
    Watson^23 comments that in his view the trend is clear. Risk managers, he says,
    will not only need to be smarter and exhibit greater leadership in order to be
    rewarded with a ‘seat at the table’ but ‘they will be compensated accordingly
    with prestige, influence and, yes, money’. It looks like an interesting place
    to be.


    In their 2017 report ‘The Future of Risk Management in the Digital Era’ McKinsey
    reinforce those views^24 by suggesting that future risk managers will focus on
    strategic and high-value decisions whilst lower-value decisions are automated
    and there will be less manual handling. They suggest a model in which risk executives
    ‘deploy a centralised “nerve centre” where newly powerful self-learning models
    will harness improved connectivity to set limits dynamically and to detect emergent
    risks (credit, market, and operational) – evaluating those risks immediately,
    setting cross-risk mitigation strategies in motion, and dynamically adjusting
    limits.’


    Is this hype or optimism? The 2017 IIF/McKinsey digital risk survey found that:


    +   - 70% of banks had digital risk on their radar with a middling level of management
    attention.

    +   - 10% have it as a high priority.

    +   - 22% of banks have invested more than 25% of their annual risk budget to
    digitalise risk management.


    The needs and challenges of global players to manage compliance issues internationally
    cannot be underestimated. Increasingly it is getting beyond human'
