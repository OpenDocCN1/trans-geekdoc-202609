  md: '# Cyber Risk Management Apps


    There is an increasing focus on the use of Fintech to address cyber risk issues.
    The Willis Towers Watson Quarterly Insuretec briefing of Q4, 2018¹⁷ particularly
    focused on the management of cyber risk, referring to:


    +   - ‘Cyence Risk Analytics’ from Guidewire, which models the economic effect
    of cybercrime

    +   - ‘Corax’, which build analytics tools to support the design of new cyber
    insurance products

    +   - ‘Paladin’, which creates cyber-risk detection

    +   - ‘Zeguro’, which builds tools to reduce cyber risk

    +   - ‘Refirm Labs’, which creates methods to vet and validate hardware security


    From an insurance point of view, the cyber problem is increasingly being described
    as ‘Silent Cyber’, referring to insurance liabilities and obligations arising
    from cyber-related losses. These ‘silent’ losses stem from traditional property
    and liability insurance policies that were not specifically designed to cover
    cyber risk but where such losses aren’t specifically excluded, nor are they priced
    for by underwriters. It’s becoming more topical as an issue. In 2017 the NotPetya
    cyberattack was to become one of the costliest in history, attacking a range of
    businesses, from shipping companies to law firms, and demanding a bitcoin ransom.
    The attack was thought to have cost shipping giant Merck and also FedEx over US$300
    million each.¹⁸,¹⁹


    In mid-2017 the UK-based Prudential Regulatory Authority (PRA) said that it ‘expects
    firms to be able to identify, quantify and manage cyber insurance underwriting
    risk’. But it’s a challenge. As John Merchant, director of customer solutions
    at Guidewire Cyence Risk Analytics, puts it, ‘Five-years-old is ancient in terms
    of cyber’.²⁰


    # Broader Cyber Issues for Banking


    Whilst cyber security is a worry at a personal level, there are broader issues
    that need to be considered. In part, these are increasingly leading to a new category
    of cybercrime insurance, which in many cases has yet to be tested in the courts
    of law. According to global insurers AXA, there are at least four key areas that
    need to be addressed.²¹


    +   - **Infiltration of industrial systems**: That is, the ability of cybercriminals
    to infiltrate industrial controls (In 2014, cybercriminals increased the speed
    of machinery in a German steel mill until it burst into flames.)

    +   - **Ransom risk**: The concept of ‘cyber extortion’, where a system is infiltrated
    and a ransom is demanded, usually payable through some form of crypto-currency

    +   - **Reputational risk**: Infiltration leading to loss of brand trust and the
    public losing faith in an organisation they have trusted with their personal information

    +   - **Professional liability risk**: Where organisations (such as lawyers) that
    are less concerned with data loss realise that they are holding sensitive information,
    the loss of which would create insights that are both actionable and potentially
    detrimental to the owners'
