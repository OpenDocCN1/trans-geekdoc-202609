    # Blockchain in Indian Banking


    Both Delhi and Mumbai consistently feature not only in the list of megacities
    for today, but also for ten years hence and at the turn of the next century. It
    would be remiss not to consider India in more detail.


    India appears to be a not-so-secret force in terms of the development of analytics
    and AI, and Analytics India Magazine is an excellent source of reference for reporting
    progress in that continent.¹⁸ In her 2019 report ‘AI is the Global Force that
    Will Transform the Indian Workforce and Create Jobs’, writer Richa Bhatia reminds
    us that the Indian AI industry has grown by 30% since 2017 and that there is a
    surge in AI roles being created in ‘Machine Learning, Natural Language Processing,
    Neural Networks, Analytics, Cloud Computing & Pattern Recognition’.¹⁹


    Beyond this, Open Banking is also high on the Indian agenda as a result of the
    Indian Government’s Unified Payments Interface (UPI), which is an instant real-time
    payment system developed by National Payments Corporation of India (NPCI). The
    UPI system not only allows a consumer to transfer money between two bank accounts,
    but also allows the consumer to pay merchants directly from the bank account using
    a smartphone.


    In 2017, HDFC Bank launched an AI-based chatbot that it claims ‘can answer millions
    of customer queries across multiple channels instantly’.²⁰ In 2019 Indian commercial
    bank Federal were reported to have started an Open Banking project.'
