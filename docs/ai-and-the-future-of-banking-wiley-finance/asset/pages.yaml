  md: 'According to Poppy Gustafsson, one of the Darktrace co-founders, their technology
    system emulates the human immune system, which ‘has an innate sense of self’ and
    by virtue of that can ‘identify anomalies such as bacteria and viruses.’ Their
    technology is claimed to replicate that approach, monitoring the ‘pattern of life’
    or normal behaviour of every device on the network and identifying when the pattern
    changes at which point the safeguards respond ‘autonomously’.²⁹


    # New Cyber Roles, New Cyber Responsibilities


    For banks and other major institutions to be able to respond effectively to the
    cyber threat it becomes critical for them to be able to call on capabilities that
    are broad, deep and usually of a global nature. To be able to provide comprehensive
    protection, experts need to be able to call on commercial solutions that provide
    know-how in areas such as identity and access management, data security, application
    security, network security and endpoint security.


    Optimum solutions include pervasive encryption, security intelligence, analytics,
    cognitive and artificial intelligence, and forensic tooling. Experts need to be
    able not only to defend against cyber intrusion but also to process information
    on IT security events, vulnerabilities and provide detailed insight about potential
    threats to the virtual organisation, which include customers and the supply chain.
    Cyber and risk experts increasingly need to design and implement layered approaches
    to the ways an organisation’s data and infrastructure are managed. This includes
    controls and policy development to defend against cyber security attacks and threats
    on networks, end-user devices, servers, applications, data and cloud.


    Beyond this, there are issues of culture. Cyber security is a matter for everyone.
    Internal risk experts must also ensure adequate training and education, not only
    for their own organisation but for the wider ‘virtual organisation’ in order to
    foster a culture of security awareness and responsibility.


    At the outset of the book, the meaning of money was considered in the context
    of banking, which is a complicated industry with many functional roles, often
    wrapped in a matrix of overlapping (and sometimes duplicated) management and authority.
    From the outside it’s sometimes almost impossible to understand the complexity
    of the matrix and which career routes are most likely to allow an individual to
    climb the ladder of success. Whilst cybercrime experts are unlikely to be entirely
    replaced by AI systems, the future must invariably bring systematic support in
    some fashion to that particular skill set.


    The challenges of cyber security continue to take the banking industry into new
    levels of complexity and difficulty. In addition to technology roles considered
    earlier, effective cyber security in the future may depend on two pivotal roles:


    +   - **The Chief Security Officer:** The CSO will increasingly become a prominent
    position. The security of both the real and virtual enterprise will rest with
    them, in their hands. They will not only need to cope with current threats but
    also to anticipate future ones. It’ll be a tough job, requiring insight, imagination
    and technical expertise, and some of the best CSOs may come from the ‘hacking
    community’ itself.'
