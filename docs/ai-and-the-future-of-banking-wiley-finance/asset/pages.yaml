  md: 'The objectives of these new innovation hubs might be, generally, to:


    +   - Build new services and business models that allow the bank to become a true
    partner of their customers.

    +   - Ring fence the innovation hub as a separate business unit to ensure that
    it benefits from a dedicated organisation and resources, and does not run the
    risk of cannibalisation.

    +   - Develop banking by using new technologies and approaches, in order to give
    their customers a better service.


    # The Evolution of the Banking Employee


    In the same way that organisations and leadership are likely to change, it is
    also important to think about how the employee is likely to change. From an extract
    from a 2014 book titled The Future of Work: Attract New Talent, Build Better Leaders,
    and Create a Competitive Organization23 by Jacob Morgan, principal and co-founder
    of Chess Media Group, it''s possible to start to understand more about the potential
    (and perhaps current) evolution of the employee.


    # A Banking Employee Persona in 2050


    In closing this particular section, it might be interesting to create a persona
    of an AI-infused banking employee of the future. Perhaps in a decade or two, when
    advanced analytics and AI have become more operationally mainstream, it might
    be interesting to compare a prediction with the reality of the situation. With
    the first edition of this book being published in 2020, we should consider a time
    frame that will resonate with the majority of Millennials, who would expect to
    have a working career of say 30 years, so let''s project forward to 2050.


    TABLE 10 Evolution of the Banking Employee


    | The Past Employee | The Future Employee |

    |---|---|

    | Works 9–5 | Works anytime |

    | Works in a corporate office | Works anywhere |

    | Uses company equipment | Uses any device |

    | Focuses on Inputs | Focuses on outputs |

    | Climbs the corporate ladder | Creates own career ladder |

    | Has predefined work | Has customised work |

    | Hoards information | Shares information |

    | No voice | Can become a leader |

    | Relies on email | Relies on collaborative technologies |

    | Focuses on knowledge | Focuses on adaptive learning |

    | Undertakes corporate learning and teaching | Has democratised learning and teaching
    |'
