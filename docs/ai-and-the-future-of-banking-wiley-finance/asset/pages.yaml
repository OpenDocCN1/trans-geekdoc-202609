- pgno: 17
  md: '# Prologue: Why Banking?


    # SUMMARY


    This section will look briefly at:


    +   1. What is meant by the concept of money especially in the digital world

    +   2. What is banking in a digital environment

    +   3. The breadth of the banking industry, and the key functions within banks
    such as HR and operations

    +   4. Some of the present and future roles in an analytically and AI-infused
    banking world


    It’s not intended to be a comprehensive guide but rather to help set the scene
    in terms of the breadth and width of the banking industry, and how the elements
    of advanced analytics and AI form part of a concept that will be described as
    the ‘Bank of the Future’.


    # Technology Is Changing the Way We Manage Our Money


    The popularity of convenient webchat services like Twitter is making banks invest
    in similarly fast capabilities as customers embrace online support. Britons (as
    well as many others around the world) are increasingly turning to their smartphones;
    22 million were using a banking app in 2017, up from 19.6 million in 2016. There
    were over 5.5 billion log-ins to banking apps in 2017, an increase of 13% on 2016.
    Stephen Jones, Chief Executive, UK Finance, said: ‘Over the next few years Open
    Banking and artificial intelligence will change the relationship we have, not
    only with our banks but also how we fundamentally access and utilise financial
    products and services’.¹


    Beyond this, the chapter considers some of the present key functions in banking
    and speculates on what might comprise ‘jobs of the future’ with some indicative
    job titles and descriptions of what they might entail.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# INTRODUCTION


    > ''Money, get away

    > Get a good job with good pay and you''re okay

    > Money, it''s a gas

    > Grab that cash with both hands and make a stash''


    Roger Waters, Pink Floyd, ‘Money’


    To consider the future of banking, in whatever form, we need to think also about
    the future of money and that in turn needs us to think about what actually is
    ‘money’. We already think we know the answer to that question.


    Everyone, except an economist, knows what money means, and even an economist can
    describe it in the course of a chapter or so.


    > A.H. Quiggan. A Survey of Primitive Money: The Beginnings of Currency²


    We’re obsessed with money. Admittedly, there are some who view the topic as a
    necessary evil, but ‘necessary’ it certainly is. Its pursuit dominates a large
    part of our lives in that concept we call ‘work’. Beyond that alone, money provides
    a mechanism for escaping from work through the funding of leisure or, ultimately,
    retirement. The process by which we normally gain access to money is that of banking
    and because of this the topics of money and banking are irretrievably interlocked.


    But money is much more than it seems at face value. For most, it represents coins
    in pockets, notes in wallets and numbers on bank statements. We think of it as
    the reward for labour and effort extended and as a medium of exchange to be passed
    on to another party in return for a service or product. Entire disciplines – such
    as economics – have been created on the strength of it and even these attempt
    to take the subject to higher levels through more granular subsets such as macro-
    and microeconomics. Our understanding of money seems almost commonsensical, intuitive
    and understandable but there is one fatal flaw, which is that our understanding
    is incorrect.


    In his book, Money, the Unauthorised Biography,³ Felix Martin takes us through
    the history of money and concludes that it represents no more than a set of ‘tokens’,
    themselves representing a system of credit and clearing, all ultimately based
    on trust. The management of these tokens has been reinforced through what he describes
    as three key quasi-technological breakthroughs:


    +   1. Mankind’s ability to be numerate

    +   2. The capability to write and therefore to record

    +   3. The concept of accountancy, which has allowed both individuals and groups
    to keep records efficiently in a standardised way, permitting quantities to be
    tracked


    The tokens themselves are a reflection of something deeper, that of universal
    economic value, which through standardisation has allowed trade to happen throughout'
