- pgno: 16
  md: 'for example – will mould the future shape of the industry. Where appropriate,
    examples of best practice will be provided by way of proof points that are already
    in the public domain.


    Even at this stage, it is tempting to make the bold statement that all banking
    will be infused with AI to some degree within the foreseeable future, but one
    big issue to address is how the industry will get there from a practical point
    of view. What are the challenges of implementation and what are the possible solutions?
    Do they rest in external organisations like start-ups in the Fintech community,
    or can banks innovate internally themselves? In either case, what are the key
    building blocks of change? How quickly might all this happen, and how is change
    resisted at an organisational level?


    As a caveat, it should also be recognised that the future of banking is not just
    all about analytics and AI, although these will play a major part. It is important
    to reflect on some of the other contributing factors of change, such as those
    of customers’ behaviour and their greater expectations, as well as advances in
    other industries that will inevitably have a ‘knock-on’ effect.'
  merge: -1
