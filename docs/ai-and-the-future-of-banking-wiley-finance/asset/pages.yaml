  img_proc: true
- pgno: 74
  md: "Effectively managing the key business and performance drivers translates into\
    \ effectively managing performance. Studying past performance can help banks understand\
    \ the key reasons for success and from this, to allow key performance indicators\
    \ to be prepared. In banking specifically, some of the key drivers are customer\
    \ assets and liabilities, and their corresponding interest margins and profitability.\
    \ It’s then possible to use techniques such as matched-funds transfer pricing\
    \ to drive growth in particular areas. (Matched-fund transfer is an approach to\
    \ understand how specific funds are adding to the profitability of the bank, and\
    \ can assist in product development, branch optimisation and judging the efficiency\
    \ of processes.)^6\n\n+   2. **Use of Rolling Forecasts:** A rolling forecast\
    \ is a financial model which, unlike static budgeting models, manages the performance\
    \ of a business over a continuous period. It operates on an add/drop process where\
    \ months are added/dropped as the year progresses, and has the main benefit of\
    \ helping businesses operating in a fluid and sometimes volatile business environment.\
    \ For example, moving from a traditional balance sheet approach to a rolling forecast\
    \ can help banks swiftly and effectively understand the impact of a change in\
    \ central bank rates, and what effect this might have on the business plan.\n\n\
    +   3. **Reporting and Visualisation:** Effective use of dashboarding and visualisation\
    \ as a method of communicating data-driven information and insights, together\
    \ with drilldown capability, helps users rapidly understand what is happening\
    \ at a product, branch and distribution level. The integration of bi-directional\
    \ location analytics also helps banks (and others) understand what is happening\
    \ with a geographical perspective.\n\n+   4. **Democratisation of Information:**\
    \ This expression implies that unambiguous ‘trusted’ information is shared across\
    \ the enterprise, with appropriate permissions and levels of authority, so that\
    \ business users have timely access to relevant information. In this way, quicker\
    \ and better decisions can be made.\n\n+   5. **Planning tools:** The most effective\
    \ planning tools and processes enable effective linkage between departments, lines\
    \ of business and the enterprise. This eliminates independently initiated manual\
    \ operations, and helps provide integration between development and execution\
    \ of strategy, business planning and, ultimately, business execution. Relative\
    \ to banking, in particular, calculations such as consolidation of business units,\
    \ transfer pricing between business units, calculation of funds transfer pricing\
    \ and interest margins can be both automated and driver-based. This eliminates\
    \ manual errors and time-consuming reconciliation processes.\n+   \n+   Effective\
    \ planning tools also include workflow management to aid the planning administrator\
    \ in managing deadlines, especially where there is a high-participation planning\
    \ process.\n\n+   6. **Effective Analytical Tools:** These analytical processes\
    \ and tools help explain variance against plans (such as Variance Analysis, aka\
    \ ‘ANOVA’); tools that test ‘what if’ hypotheses and ‘recover’ scenarios; and\
    \ others like predictive analytics – all of which ultimately improve decision\
    \ making.^7"
  merge: -1
  img_proc: true
- pgno: 75
  md: '# CUSTOMER ANALYTICS


    At the heart of banking is an understanding of the value of, and the opportunity
    that comes from, the profitability of the customer. Ultimately banks need to be
    interested in four key elements:


    +   - What is the customers’ propensity to buy?

    +   - What is their likelihood to take specific action – and if so, what is the
    relevance of this?

    +   - What is their likelihood to churn, or to leave the bank (especially in an
    Open Banking situation)?

    +   - What is the lifecycle opportunity or lifetime ‘value’ of the customer?


    To do this requires a bank to understand and anticipate the needs of both existing
    and prospective customers, which then allows them to place the right offer before
    them. This might be done at a granular (i.e. individual) level, or a broader-based
    ‘campaign’ approach.


    # Customer Insight


    The notion of a ‘customer 360-degree’ insight is not a new idea, yet many organisations,
    including banks, still struggle to operationalise it. Conceived in the early ’90s,
    the concept has moved beyond a relatively straightforward CRM (Customer Relationship
    Management) tool to one increasingly affected by modern trends such as:


    +   - Mobile technology

    +   - Chatbots and other automated services

    +   - The advance of ‘digital’, including the Internet of Things

    +   - Machine learning and AI

    +   - The availability of analytical, cloud-based solutions and capabilities providing
    insight ‘on demand’


    There are four key stages to creating an effective customer 360-degree insight.


    # Sourcing data


    This may comprise:


    +   (a) Behavioural: Data that defines the behaviour of the customer such as banking
    records, loans, products already taken and uses of overdraft.

    +   (b) Sentimental: Attitudinal data derived from general or even individual
    social media content (as far as practically possible).

    +   (c) Interactional: Data derived from how many interactions the customer has
    had with the bank, either across the counter, through the website or through a
    contact centre.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '(d) External: How to capture the vast amount of external data that might refer
    to the customer’s location, workplace and use of devices (for example) and to
    recognise and reflect in an offer what is particularly relevant to the customer.


    # Data Reservoir


    From this assortment of data, it becomes possible to create a single repository
    or ‘reservoir’ of relevant information, and in doing so, create a 360-degree view
    of the customer. Without effective data management and tooling, data collection
    by itself is irrelevant.


    The various different types of data – structured, unstructured and from different
    sources – require a variety of technological tools to extract the information
    from the sources. The intention isn’t to comment on or to recommend these, but
    these data management tools might include, for example, the management of:


    +   (a) Continual data feeds, to ensure that offers are both timely and relevant

    +   (b) Content management, which effectively captures and sorts data

    +   (c) Text analytics, which makes sense of free text and voice translations
    from contact centre interactions and web contact

    +   (d) Device data analysis, such as locational details from smartphones

    +   (e) Customer identification, which tracks single customer identification across
    multiple apps


    All of these processes need to be enveloped around an appropriate culture of governance
    and security, especially as the bank is potentially vulnerable to infiltration
    as it metaphorically opens its doors to external sources of data.


    # Creating Insight


    In the previous chapter, we reminded ourselves that neither data nor analytical
    processes were the destination but rather it was what was done with this analysis
    that makes the difference. Fundamentally, the aim of this exercise is to establish
    with an increased degree of probability what is the customer’s propensity to buy
    a product or service. This insight will become increasingly important as banks
    offer Open Banking and de facto, facilitate increased mobility of customers between
    banking organisations. (See Chapter 9.) Better insight becomes critical, therefore,
    to allow banks to be able to identify which customers are most likely to leave
    so, in a way that is similar to the insurance problem of customer churn, appropriate
    attention can be given to matters of retention.


    Additionally, as banks consider other business models such as ‘universal banking’
    and ‘full-service banking’, which are in effect brand extensions, they will also
    need to gauge the propensity of their existing customers to purchase a broader
    financial (and even possibly non-financial) product set.


    Such insight may not necessarily all be used for ‘outward-facing’ activities.
    With greater data, banks will be able to gain more holistic insights about their
    customer base, which, when linked with sentiment analysis, may assist the bank
    in establishing more'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'effective tactics and strategies and help them to understand why their strategy
    has been successful or otherwise.


    The ability of a bank to understand these outcomes in the context of the performance
    of their peers – or competitors – increasingly becomes a critical success factor.
    The increased availability of external information from published reports such
    as Bloomberg, when coupled with internal information, starts to become essential.
    We might call this ‘contextual analytics’.


    # Key Deliverable


    The aim of all that has gone before is to create such a degree of granularity
    that the bank has, in effect, a ‘segment of one’ – in other words, an approach
    of ‘hyper-personalisation’. Greater granularity, which provides a higher level
    of customer segmentation, will hopefully lead to more timely and appropriate offers.


    Analysis will also provide an element of prioritisation: who is most likely to
    buy, who is most likely to leave.


    The manner in which this offer is made is also important, with special care being
    needed to ensure that the messaging is consistent regardless of the channel (aka
    ‘omnichannel’ marketing). With an increased focus on mobile devices as a key communication
    medium, the ability to express these offers in a readily ‘digestible’ way, on
    a small screen, also becomes a critical success factor.


    The essence of modern ‘360-degree customer insight’ thinking is to move the relationship
    between the supplier and the end user away from the ‘relational’ – in other words,
    Party A trying to sell to Party B – to one that is ‘experiential’ – in other words,
    the intention is to create a whole new level of connectivity based on the experience
    of the customer when engaging with that particular brand.


    The motivation for such an approach is that if the customer enjoys a better experience,
    they start to enjoy a deeper, more loyal and therefore more sustainable interaction.
    They become an advocate or ‘ambassador’ for the brand (as we recognise in Chapter
    6, the idea of ‘brand’ is increasing in importance). Beyond this, a deeper relationship
    translates in financial terms to a more sustainable ‘lifetime value opportunity’.


    The opposite of this is that current customers who ‘digitally’ interact with the
    bank and suffer a ‘clunky’ experience if the system is slow, frictional or unsafe
    will be more inclined not only to leave but might even tell their friends of the
    poor experience, which could affect business growth. The impact of this with respect
    to Open Banking cannot be underestimated. A ‘clunky’ or ineffective app can have
    a significant effect on customer experience, especially amongst Gen Z. The corollary
    is that a smooth, attractive app has the potential to win customers as well as
