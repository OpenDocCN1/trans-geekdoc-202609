    # Branding and Human-Centred Design


    Brand is often associated with the quality of customer experience, and may be
    either a positive or a negative association. As ‘customer experience’ seems to
    be one of the buzzword expressions, it might be helpful to see what at least one
    banking group was asking of its experts in that field.


    A recently (and almost certainly now-filled) job vacancy advertised for a position
    in what they described as a ‘group roadmap and business design’ team. The task
    required the individual to:


    +   - Challenge and shape existing thinking and align portfolios across the group.

    +   - Identify how developing technology could change the way the company interacts
    with customers and colleagues and influence future business models and architecture.

    +   - Define what the overall strategy means in practice and develop frameworks
    to allow Value Streams, Enterprise Enablers and Major Core Programmes to achieve
    strategic business and architectural objectives.

    +   - Support the mobilisation of key elements of the portfolio.

    +   - Coordinate across Business Design, IT Architecture and Human-Centred Design
    (HCD).


    ‘Human-centred design’ is an approach to problem solving that develops solutions
    to problems by taking the human perspective in all parts of the decision-making
    process. Its international standard, ISO 9241-210:2010(E), states:


    > Human-centred design is an approach to interactive systems development that
    aims to make systems usable and useful by focusing on the users, their needs and
    requirements, and by applying human factors/ergonomics, usability knowledge, and
    techniques. This approach enhances effectiveness and efficiency, improves human
    well-being, user satisfaction, accessibility and sustainability; and counteracts
    possible adverse effects of use on human health, safety and performance.


    Applicants were also required to be:


    +   - Comfortable working in an ambiguous and rapidly changing environment, managing
    a diverse set of priorities

    +   - Highly aware of the overall strategic landscape with customer focus, diplomacy
    and strong stakeholder management ability

    +   - Experienced in shaping and managing complex portfolios, with a proven record'
