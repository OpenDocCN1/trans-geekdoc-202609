  md: 'We should not overlook the issues of scale here. The larger banks, including
    Asian and Chinese banks, have customer bases measured in many millions of customers.
    In 2005 the largest Chinese bank, Industrial and Commercial Bank of China (ICBC),
    had 2.5m corporate customers and over 150m private customers.¹⁰ The bank (at the
    time of writing) now reports 567 million personal customers.¹¹


    Albeit that there are greater controls around social media in some countries,
    this number of customers will not necessarily generate a directly proportionately
    huge amount of social media data. However, the potential remains for the creation
    of unstructured data relating to a particular individual banking business at an
    unprecedented scale. By comparison, in what might be described as the more local
    European theatre, the largest of the banks, HSBC, serves a ‘mere’ 39m customers
    globally, with this number being split into 66 countries and territories.


    # Relationship Pricing


    Relationship pricing is generally meant to represent a ‘framework’ where pricing
    is based on a customer’s overall purchasing activity, rather than on a product
    by product basis. It allows banks to set the price of a product or service based
    on the amount of overall business done with the bank by that client (the relationship)
    and as a result, uses customer-centric parameters to determine the price. It’s
    also an approach that banks use to provide a single point of contact for a service
    and to improve the loyalty of its customers.


    With the majority of these services comprising loans, relationship pricing is
    principally the ability to ‘handcraft’ the terms of a loan for individual customers,
    usually commercial or higher-value customers. Increasingly the ability to quickly
    create such a bespoke offering, without undue referral, is viewed as a critical
    success factor.


    In a personal banking situation, it is also often possible for a customer who
    has just taken a mortgage to negotiate the reduction or removal of fees for their
    current account.


    Where the opening of new accounts is a KPI for bank sales executives, this can
    lead to doubtful practices. In the US, Wells Fargo adopted an aggressive (and
    punitive) programme for new accounts to be opened by relationship bankers between
    2011 to 2016, only to subsequently discover that these new accounts had not been
    opened with the agreement of the customers involved. The total number of new accounts
    was estimated at 3.5m, and is a prime example of problematic KPIs and performance
    measures driving bad behaviours.¹²


    Calculating a ‘relationship price’ requires the bank also to understand what is
    the ‘full opportunity cost’ of the relationship – that is, the potential benefits
    that might accrue in the event of the customer moving some or all their accounts
    over to the lending organisation. In effect, this is a cross-selling approach
    with attractive pricing intended to lure the customer into an increasing and deeper
    relationship. However, in the US the Bank Holding Company Act Amendments of 1970
    prevent the banks from ‘contingent pricing’: making the cost of one service or
    product contingent on another.


    It also requires them to take into account the degree of risk – ‘risk-based pricing’
    – associated with the loan, such as the impact of collateral and guarantees.¹³


    In terms of analytics, experts such as McKinsey recognise that a digital bank
    has a much greater chance of implementing such processes compared to a traditional
    ‘analogue bank’. Elsewhere, companies such as Zafin explain that an analytically
    based'
