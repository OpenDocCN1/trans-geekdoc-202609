    # Completely Accepting Technological Change


    Banks need to engage more effectively with technology in the same way that their
    customers are also embracing technological change. It’s more than just getting
    rid of legacy systems but also about creating scalable, enterprise-wide systems
    that are relatively futureproof. This may require new innovative partnership models
    between traditional financial services organisations and technology providers.


    The technological discussion opens the door to broader and often problematic issues
    such as integrating disparate systems as a result of merger and acquisition, creation
    of effective third-party partnerships, and of course the problematic issue of
    implementation.


    (In April 2018 the UK’s TSB Bank, part of Banco Sabadell, attempted to transfer
    1.3 billion customer records, leading to ‘computer meltdown’ and resulting in
    more than 204,000 complaints, the loss of 80,000 customers, and £330.2m in extra
    costs, before any regulatory fines were taken into account.)¹⁸


    As we look to the future, banking must not only fully integrate with but also
    utilise rapidly emerging technology. This includes the use of advanced analytics
    and artificial intelligence. Fundamentally, this may need a repositioning of the
    strategic intent of the major banks. It is insufficient for them to behave as
    banks and try to become digital: rather it represents a major shift in their entire
    business model and go to market approach, as in the case of Bank of America, now
    describing itself as a technology company that happens to do banking.


