  md: '# CONCLUSION


    Brand is an integral part of the Future of Banking, not only as a mechanism for
    loyalty and customer acquisition in an era of Open Banking, but as part of a way
    to generate value for the organisation. Brand is not soft or fluffy but rather
    has hard financial dynamics attached that justify executive focus.


    The service experience – which is what we experience in our interaction with the
    bank, including through the use of apps – will increasingly become the ‘brand
    experience’. When all else is the same in the banking industry as systems are
    powered by more or less the same technologies, the only thing that might differentiate
    one bank from another will be its brand.


    The concept of brand will also need to change, from being some form of ubiquitous
    logo or slogan to something deeper and more relevant to the individual consumer.
    Brand might also take up new attributes such as sounds or emotional engagement,
    in a way that is somehow consistent across the channels but unique and hyper-personal
    to the individual. In the same way that there is ongoing reinvention of the concept
    of banking, including the traditional branch network, it is likely that the entire
    approach to branding will need to be reviewed, with marketers considering the
    topic by viewing it through an AI lens.


