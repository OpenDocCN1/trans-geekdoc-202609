- pgno: 219
  md: 'For completeness, other project management approaches are listed here:


    **V-Model:** ‘V’ is for verification and validation, which is like a waterfall
    implementation but each part of the plan is verified and tested before moving
    onto the next part of the plan.¹³


    **Incremental Model:** In effect, this is a series of mini-waterfalls or modules,
    with each module going through requirement, design, implementation and testing
    phases.¹⁴


    **RAD Model:** The Rapid Application Development model is one where each module
    is built in parallel to an agreed timeframe and then bundled together into a working
    prototype; useful for projects that are clear and need delivery within 3–6 months.¹⁵


    **Spiral Model:** Like an incremental model but with more emphasis placed on risk
    management. Each phase of the project – such as planning, risk analysis, engineering
    and evaluation – is measured against an agreed baseline of risk. This process
    is especially useful where risk management is important, such as in large and
    mission-critical projects.¹⁶


    Overall, the argument being adopted is that in such a technological world, traditional
    approaches to development by financial services businesses are no longer adequate.
    They need instead to mirror the approaches of technology companies, especially
    those such as Apple and Amazon, which are increasingly moving into the financial
    services sector.


    An additional important factor is that financial services companies looking to
    transform will not be able to do so by maintaining a traditional, conservative
    approach because they won''t be able to recruit or retain appropriate talent.
    Another interesting insight from the Futurion survey included the fact that even
    in complex organisations the most successful innovators ‘acknowledge, embrace,
    and thus master their complexity’. They use essential tools such as analytic insights
    (to measure progress), effective stakeholder management, compliance management
    and high-quality communication to achieve their goals.


    # The Use of ‘Design Thinking’


    All too often innovators create new capabilities and then look for an industry
    where it has the best ‘stickability’. Mentors are often used in incubators not
    only to help with development of the product or solution but also to help with
    the go-to-market. Where an innovation can hitch itself to a business problem,
    then this helps with the fundraising process and in due course with the success
    of the innovation.


    Whilst the domain of the innovators seems to be occupied by baggy trousers and
    T-shirts, there is an increasing band of ‘mature’ entrepreneurs with seasoned
    experience who approach the need for change by understanding the key industry
    issues or problems. Recognition of the business imperative of any industry become
    critical. Whilst most mature innovators and entrepreneurs may know this either
    intuitively or through experience, those with less experience may need to either
    do their homework or rely on a supportive mentor.'
