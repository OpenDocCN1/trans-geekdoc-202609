  md: '# FINANCING


    TABLE 37 Examples of Fintech Companies Focussing on Finance.


    | Name | Tagline | Description |

    |---|---|---|

    | Kiva | ‘Dreams are universal, opportunity is not. Lend as little as $25 to create
    opportunity for people around the world’ | Nonprofit organisation that allows
    people to lend money via the Internet to low-income entrepreneurs and students
    in over 80 countries.

    Kiva’s mission is ‘to expand financial access to help underserved communities
    thrive’.

    https://www.kiva.org |

    | Prosper | ‘Hello Financial Well-Being’ | Peer-to-peer lending intermediary.

    Since 2005 Prosper claims to have facilitated more than $15 bn in loans to more
    than 950,000 people.

    https://www.prosper.com/ |

    | Upstart | ‘You are more than your credit score. On Upstart your education and
    experience help you get the loan you deserve’. | Upstart is an online lending
    marketplace that provides personal loans using nontraditional variables, such
    as education and employment, to predict creditworthiness.

    /www.upstart.com/ |


    # PAYMENTS


    TABLE 38 Examples of Fintech Companies Focussing on Payments.


    | Name | Tagline | Description |

    |---|---|---|

    | Ant Financial | ‘Bring the world equal opportunities’ | Ant Financial Services
    Group, formerly known as Alipay, is an affiliate company of the Chinese Alibaba
    Group. Ant Financial is the highest valued Fintech or newly named ‘TechFin’ company
    in the world, and the world’s most valuable unicorn company, with a valuation
    of US$150 bn.

    The group comprises a broad range of capabilities including mobile wallets, credit
    pay, online banking, wealth management and more.

    http://www.antfinancial.com |

    | Klarna | ‘Shop now. Pay later’ | A Swedish bank that provides online financial
    services such as payment solutions for online storefronts, direct payments and
    post-purchase payments. Their main service is to assume stores’ claims for payments
    and handle customer payments, thus eliminating the risk for seller and buyer.

    https://www.klarna.com/uk/ |'
