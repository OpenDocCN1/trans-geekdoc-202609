  md: 'nominal value, only with the face or arms of the issuing party, so it was easy
    for the sovereign to reduce the ‘tariffed amount’ of the coin, and in doing so
    in effect create a one-off wealth tax. This approach – together with debasement,
    which was, in effect, a process of reducing the precious metal content of a coin
    to reduce its tangible value – continually served to erode trust in ‘money’ itself.
    Even today we are sometimes unsure about what it actually is, and this is likely
    to get worse as increased digitalisation affects us in all areas of life.


    Such exploitation, together with relative chaos, created an atmosphere in which
    the topic of money might be better addressed. Nicolas Oresme (1320–1382) was the
    Grand Master of Navarre, which was one of the most prestigious schools in Paris.
    In his paper called ‘A Treatise on the Origin, Nature, Law and Alterations of
    Money’, addressed to the French Dauphin Charles in 1360, he asked two questions:


    +   1. Was it right that the sovereign should be able to manipulate the money
    standard?

    +   2. If it was, then in whose interests might it be done?


    He suggested a radically different viewpoint: that money was not the property
    of the sovereign but rather of the community that uses it. If there was a role
    for the sovereign, he argued, it was as the ‘executor of a public ordinance’.


    Put another way, Oresme’s argument was that ‘money’ – or at least the concept
    of money – is owned by ‘us’. Everyone else are merely custodians and intermediaries.


    # WHAT IS BANKING?


    The term ‘banking’ is generic and wide-reaching, so it is first important to recognise
    the different types of bank. (See Figure 1.1.) Generally, these types comprise:


    +   1. Retail banks: These focus on consumers or the general public as their customers.
    These are the banks that provide checking and savings accounts, as well as other
    services such as credit card and personal loan services.

    +   2. Commercial banks: These banks target business customers but the services
    they offer are more complex and normally the amounts are much larger. They may
    need to deal with payment from customers and to provide lines of credit to help
    their clients manage their cash flow.

    +   3. Investment banks: These help businesses operate in financial markets, such
    as if a business wants to raise capital or to go public.

    +   4. Merchant banks: Historically, these banks deal in commercial loans and
    investments. Originally their purpose was to facilitate trading in commodities,
    which were mainly fabrics that involved ‘merchants’, and hence the name ‘merchant
    banking’ arose. In more recent times, the term ‘merchant banking’ has tended to
    refer to banks that provide capital to companies in the form of share ownership
    rather than loans, and also to provide corporate advice to the firms in which
    they invest.⁶

    +   5. Central banks: These are typically the US Federal Reserve Bank or the Bank
    of England, which manage the monetary system for a government.'
