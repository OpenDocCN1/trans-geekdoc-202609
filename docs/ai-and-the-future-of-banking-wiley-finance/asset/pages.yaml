    # Analytics in Portfolio Management


    A useful but perhaps slightly unusual beginning to this section is that of a short
    historical review of what is described as ‘financial mathematics’. The starting
    point is with a botanist, Robert Brown (1773–1858), who observed the motion of
    pollen suspected in water, a phenomenon he called Brownian motion. Louis Bachelier
    (1870–1946), considered the founding father of financial mathematics, is believed
    to have been the first to have applied mathematical models to the analysis of
    financial markets, and proposed in his thesis ‘Theory of Speculation’ that stock
    markets evolve according to Brownian motion. Thorvald Thiele, a Danish astronomer
    (1838–1910) proposed a mathematical theory explaining Brownian motion, which Albert
    Einstein expanded on in 1905 to allow predictions.


    Brownian motion is explained as being a stochastic process in statistics, that
    is, a mathematical object (in this case, the stock value) defined as a series
    of random variables. As well as in finance, the process is used in biology, ecology,
    chemistry and computer science (amongst others). Even at this basic level, it’s
    a complex statistical calculation. Notwithstanding, other experts such as Wiener
    and Robert Merton continued to push the financial boundaries to what is now ‘masters
    level’ mathematics.


    Taking matters to the next stage, we then stumble across what is commonly known
    as the Black–Scholes (or Black–Scholes–Merton) formula, which was created by three
    scientists to calculate the theoretical price of one type of financial security.
    Their approach was that stock either rises or falls with the same degree of ‘predictable
    unpredictability’.31


    When the formula was first introduced, it was used for pricing of stocks when
    an explicit formula wasn’t available. Nowadays, it is much easier to use, and
    there are online analytical tools that do the ‘heavy lifting’ in terms of the
    calculations for the user. Before it came into use, investors would find it difficult
    to assess whether an ‘option contract’ was reasonably priced and if so, did it
    represent good value? They could only speculate in terms of the price and value
    of ‘options’, and this was seen as being, on the whole, too risky. As a result
    of Black–Scholes, the trading price of an option can now be calculated mathematically
    so that there is only one accurate price for an option. With the formula, the
    trader or investor can determine if the market price is higher or lower than its
    theoretical value, and decide to invest (or ‘hedge’) accordingly.


    It calculates the value using six factors:


    +   1. Whether the option is a ‘call’ or a ‘put’, which is a description of the
    contract that places the emphasis on either the buyer (a put option) or the seller
    (a call option)

    +   2. Current stock price

    +   3. Strike price: the price at which the option can be exercised

    +   4. Volatility of the underlying security, which is considered to be the most
    important of the factors'
