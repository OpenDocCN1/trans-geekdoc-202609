  md: 'Banking leaders will need to somehow blend the need for risk-averse, compliant
    direction with the need to respond to changing times, changing customers, and
    the increasing threat of both challenger banks and also new quasi-financial institutions,
    typically retailers and others intruding into the banking landscape. To do this
    effectively will require leaders to adopt new and relevant competences, which
    perhaps they may learn from mentors who are younger and less experienced than
    them. Old dogs will need to learn new tricks, and who best to learn them from
    but a younger, more dynamic generation?


    As the nature of leadership changes, so too will organisational structures, which
    will increasingly focus on the consumer and brand experience. Because of this,
    there will be an inevitable transformational drag on bank employees themselves,
    whose route to success will not be one of working harder and longer but one of
    recognising and responding to the changes happening around them.


