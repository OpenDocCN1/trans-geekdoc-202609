    # FUTURE IMPERATIVES IN BANKING


    In considering three non-banking industries (retail, telecoms, healthcare), some
    key trends start to emerge.


    # Greater Customer Centricity


    This might be a ‘given’ because it features in today’s banking imperatives as
    described above, but banks increasingly need to think of customer centricity at
    an entirely new level. Retailers such as Mercedes and Apple are pushing the limits
    of what they call the ‘customer experience’ and are, for example, reinventing
    the purchase and ownership of a prestige car into a ‘lifestyle experience’.


    Banks need to understand the needs and expectations of their customers and to
    be able to implement new products and services in a quickly and timely manner.
    To do this will almost certainly result in increased complexity, which, when added
    to issues of globalisation and developing technology, will present more difficult
    challenges of implementation.


    Whilst the answer may in part rest in the increased use of ‘apps’ and mobile technology,
    the customer experience is invariably negatively affected by clunky, slow apps,
    which add inconvenience, rather than adding value.


    What might a ‘lifestyle experience’ in banking look like? As property insurers
    and healthcare providers move away from a reactive claims model to one of proactivity
    and wellness management, for example, what is the banking equivalent to this?
    Certainly it takes the form of some type of ‘money management’ – whatever we take
    the expression'
