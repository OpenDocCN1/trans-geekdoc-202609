  md: '![](img/58d39abe2abae45d51491548f7293e40_79_0.png)


    **FIGURE 4.8**  AI-Infused Customer 360-Degree.


    Already experts are thinking about a ‘modern’ customer 360-degree, which takes
    into account issues such as open data, and are beginning to ‘reimagine’ a new
    form of Customer Experience Management (CXM) process. Ultimately, the secret for
    the business user is to be able to find the right technological tools – Adobe,
    MS, SAP and others – and to integrate these into their business. The deeper issue
    is that of the specific relationship of the individual with their bank. What information
    are individuals prepared to ‘trade’ for better service and more appropriate products,
    and how might this be reflected in terms of regulatory compliance?


    For example, GDPR (‘General Data Protection Regulation’) governs the way that
    personal data is used and amongst other elements requires the individual to expressly
    give permission for that usage. By comparison, CCPA (‘California Consumer Privacy
    Act’) gives consumers the right to know the sources from which personal information
    has been obtained. Overall, both are part of a general ‘march’ towards protecting
    the data ‘rights’ of the individual.


    There’s a distinct recognition that more detailed granularity of data aligning
    the bank to the individual (or individual business) is the optimum solution, one
    which matches product and service to consumer need, but arguably achieving this
    in actual practice is still some time off. In the meantime, banks may need to
    cope with the relatively broad-brush approach of segmenting their customer and
    prospective customer base, and adopt what we might call a ‘campaign management’
    route to growth (which is covered later).


    # Credit Ratings


    One subset of ‘customer 360-degree insight’ as far as banking is concerned is
    that of the customer’s credit rating – that is, the evaluation of the credit risk
    of an individual or business and their ultimate ability to repay any loans or
    liabilities that might attach. It is a form of forecast of the likelihood of the
    debtor defaulting. Lenders have historically used a mathematical model to calculate
    this risk, usually based on credit reports'
