  md: '# # CYBER AND THE LAW


    Cyber law, sometimes known as the ‘Law of the Internet’, is one of the newest
    additions to the legal system. It is concerned with the legal protection of people
    and businesses using the internet. Most cyber security courses include an understanding
    of relevant law. Cyber law covers a broad range of topics, including:


    +   - Freedom of expression

    +   - Access to and usage of the internet

    +   - Online privacy

    +   - Digital contracts

    +   - Management of cyberspace

    +   - Electronic evidence

    +   - E-commerce


    The developing use of internet and communication technologies has given rise to
    regulatory compliance issues as well as various other civil and criminal sanctions.
    There are three key areas of crime that might occur:


    +   1. Crime against individuals, such as cyber bullying, credit card fraud, online
    libel and slander

    +   2. Crimes against property, such as theft of intellectual property, worms
    and viruses, cybersquatting or physical damage to computers

    +   3. Crimes against the government, such as cyber terrorism, cyber warfare and
    theft of unauthorised information


    Countries are increasingly coming to terms with this developing area.


    +   - In the UK, there are multiple laws relevant to the topic, including Computer
    Misuse Act, the Serious Crime Act, the EU Directive 2013/40/EU, Police and Justice
    Act, the Terrorism Act, Human Rights Act, Digital Economy Act, Interception of
    Communications Act, Regulation of Investigatory Powers Act, Lawful Business Practice
    Regulation, and others.⁴³

    +   - In the US, the Justice Department prosecutes cybercrime under three different
    areas: Computer Fraud and Abuse Act of 1986 (CFAA); the Wiretap Act, also known
    as Title III, which involves the use of wiretaps while investigating crime; and
    a catchall of other network crime statutes, all of which bear different penalties.⁴⁴

    +   - In China, responsibility for internet security rests with the ISP providers
    who may be penalised by having their licence revoked, plus fines and public prosecution.
    The two most important organisations responsible for security are the Public Security
    Bureau, whose responsibilities are codified in the 1997 ‘Computer Information
    Network and Internet Security, Protection and Management Regulations’, and externally
    by the Ministry of State Security.⁴⁵

    +   - In India the Indian Information Technology Act was passed in 2000 (‘IT Act’).⁴⁶'
