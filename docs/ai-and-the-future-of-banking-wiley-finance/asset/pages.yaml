- pgno: 70
  md: '# INTRODUCTION


    Analytics is already heavily used in banking and is a key enabler to many quite
    diverse parts of the organisation. This section will review the current uses of
    analytics in the banking industry, but this is far from a comprehensive picture
    as each separate section merits detailed investigation by the reader.


    The essence of all analytical analysis in banking is that of the management of
    finances and the operations of the Office of Finance. This is the ‘engine room’
    of the banking organisation. Clear understanding of the profitability of divisions,
    channels and products rests at the heart of bank profitability. Beyond this are
    considered issues of customer insight, followed then by risk management, the latter
    driving into more detail in relation to operational risk, credit risk and market
    risk, by way of example. The diversity of the industry lends itself to multiple
    types of risk management and not all can be considered in sufficient depth within
    a single volume, but will perhaps provide a taster as to the issue and complexities
    involved.


    Additionally, matters such as operational analytics (for example, branch performance
    management) are included. Whilst the concept of branches as we normally understand
    them is, if not in doubt, then certainly under discussion, it is useful to understand
    how the success of branches is currently measured. Later on, in Chapter 8, the
    way that branches might develop in the future will be explored, including the
    concept of ‘debranching’.


    Even taking all the above into account, the use of analytics in banking is a broad
    church, and one that will continue not only to broaden but also to deepen. It
    is an integral part of the AI journey and the route towards the Bank of the Future.


    # OFFICE OF FINANCE MANAGEMENT


    It is in the nature of some readers to think that analytics in the office of finance
    need not be industry specific or indeed banking specific, to think that all finance
    officers and accountants are more or less the same, and that they undertake the
    same functions. To some degree they are right in that accounting practices across
    all industries by necessity have a degree of standardisation to enable organisations
    to be benchmarked against one another. Equally, there is an argument that financial
    analytics are too complex to be understood and managed by other than professionally
    trained accountants.


    On the other hand, many industries do necessarily have distinct characteristics,
    and banking falls within that grouping. Banking has many functions, including
    the need to manage structured uncertainty in multiple lines of business and product
    sets, and manage that risk with a view to creating measurable benefit from that
    risk, and ultimately turn a profit.


    It is also important that the office of finance in banking has a mechanism that
    enables them to manage the full breadth and depth of their organisation in a consistent
    way. This manifests itself in multiple and often diverse products and offerings,
    multiple routes to market and channels and in more complex organisations, to reflect
    multiple'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'geographies. Put quite simply, the banking environment has become too complex
    for financial management by spreadsheet, even for smaller banks.


    A future, more ‘agile’ banking industry is one with shorter product development
    lifecycles, new distribution models and perhaps also a tendency to sunset products
    or continually add value – and will require banks to be much more proactive in
    their response to the market. This in turn will place greater demands on the office
    of finance, whose increasing role recognises their strategic impact on the bank
    as a whole.


    Beyond this, as new techniques emerge such as advanced analytics and AI, banks
    especially need to be able to measure and understand the ‘hard’ benefits that
    accrue. With many decisions regarding innovation on the horizon, there is an increasing
    need to measure Return on Investment (ROI) with certainty and, in doing so, support
    the need for further investment.


    But it is not ‘just’ a matter of financial performance management. There is an
    increased focus on regulatory requirements, especially in the light of losses
    following adverse exposures to securitised asset portfolios, that is, assets that
    have been pooled together (such as mortgages, loans and credit card advances),
    whose related ‘cash flows’ are sold on to third-party investors as securities
    such as bonds. There is a burden on banks to prepare high-quality regulatory reports,
    and these are foundational to the monitoring of a bank’s safety and soundness.
    Because of this greater attention, banks are subject to stronger focus on risk
    management, as well as the need to comply with complex regulatory environments
    (such as Basel, IFRS and others). Cross-border operations and the many effects
    of globalisation also add to that risk, so the ability to have a clear view of
    performance is more important than ever, using flexible, comprehensive and robust
    processes.


    The Office of Finance is being viewed more and more as a dynamic, interactive
    part of the organisation rather than simply a ‘bean counter’. This requires the
    finance professional to be effectively engaged with the wider business, taking
    part in strategic (and in some cases even tactical) considerations, and acting
    as a trusted advisor rather than a form of custodian of finances.


    In many cases, especially in smaller banks, responsibility for risk management
    and regulatory compliance also falls to the Office of Finance, when arguably some
    are less well-prepared to undertake such a role.


    The relationship between the CEO and the CFO is critical in understanding the
    relationship between finance and the wider business. If the CEO is the ‘pilot’
    of the organisation, the CFO is the co-pilot, and co-operatively they must work
    as a fully integrated team for the benefit of the business. These statements are
    not, of course, banking specific, but rather represent the changing nature of
    many professions as a result of the digital and big data revolution.


    Cedric Read’s book eCFO: Sustaining Value in the New Corporation² recognises that,
    going forward, many of the functions undertaken will need to be transformed, including
    the finance function. If the reader is to be left with one enduring thought about
    this book, it must be that the world of banking is being transformed by the era
    of big data and analytics, and nothing will quite be the same again. Such transformation
    also extends to the Office of Finance.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'In 2009, Mossiman, Dussalt³ and others identified the issues attaching to the
    Office of Finance:


    +   - A lack of information to regulate what has happened and what will happen

    +   - The relevance, visibility and credibility of financial information

    +   - The need for balance between short and long term, detailed focus and the
    big picture

    +   - Finding a path between top down vision and bottom up circumstances


    They recognised the challenge of multiple decision makers within the organisation,
    often holding budgets and more importantly carrying accountability for delivery;
    the balance between cash flow versus working capital; decisions regarding capex
    versus opex; and the management of the treasury. Not much of that world has moved
    on over the past ten years.


    In the same way that the IT department has needed to change, and perhaps in some
    aspects has been slightly marginalised in favour of the line of business decision-maker,
    the role of the Office of Finance is also going through change, especially as
    more advanced analytical methods become both available and more affordable. This
    change will continue to happen as AI systems increasingly become embedded into
    the organisation, automating many of the traditionally routine tasks through a
    process known as RPA (Robotic Process Automation). Financial decisions are increasingly
    being placed in the hands of the line of business, as systems replace centralised
    control. Big data has brought with it ‘big empowerment’, and also what we might
    describe as ‘big accountability’. At an operational level, the Office of Finance
    inevitably needs to justify their decision to withhold funding or restrict budgets,
    for example, more than ever before.


    The rules of engagement have also changed as well, especially around the use of
    analytic capabilities. Line of business executives and staff with specialist needs
    are increasingly able to identify tools that meet their particular operational
    needs. Technology vendors are making their tools free of charge (‘freemium’) in
    an effort to get engagement. Self-service identification of analytic tooling is
    dangerously becoming the norm and it’s important that the adoption of these ‘tools’
    is managed carefully.


    The expression ‘dangerous’ is not used lightly, in that multiple tactical purchases
    potentially lead to a disjointed outcome. The banking organisation is broad and
    complex, and requires standardisation to ensure alignment, although new ‘tools’
    are emerging that help ‘glue’ disparate systems together. Independent decision
    making and choice of technology can lead to tooling for specific needs but this
    may be contrary to the greater good of the organisation. Fragmented purchasing
    cuts across everything that procurement hopes to achieve – standardisation, price
    leverage, management of upgrades, integration of tooling and strategic procurement
    rather than a series of tactical relationships that may be more difficult to manage
    and maintain.


    # Performance Management and Integrated Decision Making


    One of the key tenets of analytics is that there is a *single version of the truth*.
    What this means in technological terms is that all information placed before end
    users is derived from the same data. Gone are the days, in theory at least, of
    disagreement around the'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'numbers (albeit there may still be scope for a degree of interpretation). It
    is sometimes in these grey ‘interpretative’ areas that disputes occur, but nevertheless
    it is a step forward to think in terms of all information being reliable because
    it comes from the same source.


    To do this, reliable forms of measurement must also be used with an understanding
    that the same data will be used not only to manage the business, but also to meet
    regulatory requirements.


    It’s also helpful to bear in mind that different industries and similarly different
    parts of the financial services sector are at varying levels of maturity, with
    banking, for example, having a greater level of maturity than insurance. Departments
    responsible for asset and liability management have extremely high levels of analytical
    insight. Analytical tools are used in what is a niche area and whilst some of
    these may not be obviously transferable across the enterprise, a culture of data-driven
    decision making may well be.


    Movement of individuals across departments and also industries is likely in time
    to have a levelling effect. Whilst some industries and departments are more advanced
    than others, there will nevertheless be some degree of knowledge and capability
    transfer as well as some cultural resonance.


    Retail bankers might reasonably take a lead from the Consumer and Retail Goods
    (CRG) sector. Invariably consumer retailers have their finger on the pulse in
    terms of what is selling and what is not, and what level of discount needs to
    be offered to encourage the customer. Customer behaviour management is as much
    a financial issue as it is a marketing and psychological issue and to do this
    effectively requires absolute and indisputable agreement about issues such as
    revenue, profitability and growth, and how they are linked to product, channel
    and reputation.


    Bankers would be well advised to look outside their peer groups to find a benchmark
    of progress. It is clear that in terms of customer analytics, retailer and telecom
    companies are far ahead of bankers in terms of their analysis of buying behaviours
    but that gap is rapidly closing. With highly analytical companies such as Amazon
    entering the banking space, it’s critical that traditional banks look and learn
    – and do it very quickly.⁴


    > *A true anecdote: A room full of bankers and insurers listened avidly to a High
    Street retailer describing how, through loyalty cards, they understood the customers’
    buying behaviour with absolute granularity and could not only pitch an attractive
    offer, but anticipate where and when that offer should be made. The audience were
    especially interested in one specific question, ‘What is the banking equivalent
    to loyalty cards?’*


    # The Key Elements of Banking Performance Management


    The banking business performance management process comprises a series of six
    key tenets, typically:


    +   1. **Understanding the Business Drivers:** That is, the need to understand
    the key business and performance drivers. A business driver is ‘a resource, process
    or condition that is vital for the continued success and growth of a business.’⁵'
