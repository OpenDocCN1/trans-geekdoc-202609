- pgno: 244
  md: '# Advanced Analytics in Fraud Detection


    Generally, banks and other financial institutions already use both predictive
    and prescriptive analytics running pretrained algorithms to score transactions
    on their propensity to be fraudulent in nature. Beyond this, closed-loop analysis
    helps improve the algorithm through machine learning. The process by which this
    is done is that banking data experts or data scientists need to run a large volume
    of legitimate or fraudulent transactions through the system, and the machine learning
    model begins to be able to recognise which are fraudulent or not.


    Typically, the triggers that might be involved could relate to products that the
    account owner would never buy or locations where an account owner was unlikely
    to shop. The system is ‘trained’ to recognise these inconsistencies and to either
    flag them as being suspicious or not allow the transaction to proceed. As more
    transactions are passed through the system, then it becomes ‘smarter’.


    Banks are increasingly able to use these capabilities regardless of channel such
    as through mobile apps, ATMs or recurring payments such as a crowdfunding website.
    For example, crowdfunding site Patreon use US tech company Stripe to process their
    payments. Their analytical process recognises ‘transactional fingerprints’ in
    payments or processes and identifies when anomalies occur. Location analytics
    is also playing a more significant role in recognising fraud, especially if the
    account holder allows the bank to access the user’s smartphone or mobile device,
    and to identify any personal data contained therein.


    This appears to be an interesting trade-off. If the customer is prepared to share
    their personal information from their own device, then the banks are more able
    to prevent fraud and to safeguard the individual’s digital money. This seems to
    be a win-win that avoids problems such as forged identities, stolen identities
    and fraudulent transactions, but there is a downside, which is that of the individual
    trusting the bank to safeguard their personal information.


    Fraud management and detection is a tempting marketplace for technology vendors.
    Like insurance fraud management, the return on investment for banks is both obvious
    and striking, with some companies claiming the ability to discover 30–50% more
    fraud with accuracy rates of up to 90%. Others claim a reduction in false positives
    of up to 80%, that is, an analytical result that wrongly (embarrassingly) indicates
    a particular customer behaviour is fraudulent. The aim must be to increase the
    accuracy rate from 90% to, say, 99% or higher, which will require even more advanced
    analytics, machine learning and AI. It is foreseeable that banks and software
    providers will be able to detect current types of fraud with 100% success. At
    that point detection devices either prove to be a deterrent for criminals or a
    stimulus for more sophisticated fraud, especially in a ‘new world’ of facial and
    voice recognition.


    The probable reality is that as commerce moves closer towards an age of entirely
    digital cash, the amount of information that is or could be held about us creates
    a form of ‘money DNA’. The way that money is spent, on what, on whom and where,
    might create a set of unique and distinctive characteristics.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# AI and Anomaly Detection


    Anomaly detection is about the recognition of inconsistencies or inaccuracies
    in behaviour or payments. Carrying this out with any degree of accuracy requires
    the creation of a set of ‘baseline normalities’ against which current behaviours
    can be tested and analysed. There are at least four issues with this approach:


    +   - Correctly establishing the baseline

    +   - Ensuring that the baseline is adequately representative

    +   - The management of ‘normal’ deviations, alternatively is any ‘deviation’
    unacceptable?

    +   - The impact of anomaly detection on the ‘customer experience’


    The expression ‘AI’ is often misused in place of ‘advanced analytics’ but that
    aside, there is a need to recognise not only the issues relating to fraud but
    also the multi-channel, multi-device, volatile nature of the commerce marketplace.
    The ability of advanced systems not only to take an enterprise-wide view but also
    relate empathically to the individual starts to become some form of a ‘Holy Grail’.^30^


    When it came to light that a bank may have inadvertently enabled thousands of
    money-laundering transactions to pass across its platform as a result of a system
    error, SAS expert Colin Bristow reinforced the argument for the use of AI solutions
    in the payment process. ‘Anti-money laundering efforts need to be highly accurate
    and extremely fast – much faster and more accurate than a human could be’, says
    Bristow. ‘As finance increasingly goes digital, fraud is getting harder and harder
    to spot. Businesses must use advanced technologies like AI to stay on top of the
    rising tide – or fall prey to ever-more advanced fraudsters’.^31^


    # Fraudulent Use of Data


    One tempting question is that of understanding who is looking at whose data. It
    may not be fraudulent, especially if the information is already in the public
    domain, but may be being misused, as in the case of the Cambridge Analytica data
    scandal where personal data of millions of people was taken from Facebook and
    used without their consent for political purposes.^32^


    The new Google Alphabet capability starts to answer that question, reports *Forbes*.
    ‘All the information is quickly indexed and organized,’ they report, ‘then customers
    carry out searches on the data, like “Are any of my computers sending data to
    “X”?’ From there, cybersecurity investigators can start asking more and more questions,
    such as: ‘What kinds of information is “X” taking, when and how?’^33^


    It starts to open up interesting areas such as cybercrime ‘self-service’, which
    perhaps ultimately needs a greater technical awareness by the consumer as end
    user. It’s a complex area generally with its own terminology, and Table 24 offers
    explanations as to some of the more common expressions found in this category.'
