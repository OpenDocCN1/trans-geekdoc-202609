    but let’s consider that, with machine learning and various AI applications, the
    important algorithms have evolved to a point that any improvement only gives marginal
    (if any) benefit. As a result, investment managers might see no competitive advantage
    in the algorithms used, whether they are built in-house or purchased off the shelf.
    In fact, there might be no incentive to even try to build these capabilities internally
    as the cost of upgrade and maintenance will become too prohibitive. We enter into
    a world of ‘investment software as a service’.


    Speed of transactions has already been recognised as a competitive differentiator,
    with transactions undertaken in micro-seconds. Perhaps with time speed will cease
    to be, or at worst become less of a differentiator. All investors will refer to
    and analyse the same sources of information: Bloomberg News, Twitter or whatever
    their future iterations will look like or be named. Larger institutions will have
    the advantage of being able to look inside the enterprise, with internal data
    perhaps giving some additional insight (although it’s not obviously apparent what
    that internal additional ‘valuable’ info might be).


    So where then will the competitive element rest? Surely one of the key differentiating
    factors will be new forms and sources of data, probably from different and previously
    unconsidered sectors. Maybe it will be data that is deliberately sought, through
    new or different devices, or in different formats.


    These new data might comprise:


    +   - Internal data to the organisation itself, in which case larger organisations
    appear fundamentally to be at a competitive advantage

    +   - New sources of data, data that already exists but hasn’t yet been ‘mined’

    +   - Historically unstructured data, which has now, somehow, been sorted

    +   - New types of data that haven’t yet been collected but were it to be so,
    it would add to the mix and provide deeper insight'
