  md: '+   - Increased use of technology and automation to reduce cost, reduce risk,
    improve certainty and improve customer experience

    +   - Downsizing or perhaps inevitably consolidation between companies

    +   - Offshoring especially in locations where costs are lower (Whilst once this
    related to India or the Philippines, increasingly more new territories are being
    identified, such as Malaysia.)

    +   - Creating new business models that are more appropriate for the times, that
    allow greater flexibility and agility, and that are fundamentally data-driven,
    or ‘digital’ in nature


    The key issue is that of the ability both of the big investment banks and perhaps
    of the industry as a whole to transform itself. There is a temptation to think
    that in the banking industry it is usually the retail side of ‘the house’ that
    will change but this is unlikely to be the case. As with all industries and professions,
    the advent of advanced analytics and AI will lead to new roles and business models
    emerging. It will no longer be sufficient to digitise existing business models
    and hope for the best but rather that the investment banking industry must prepare
    itself for turbulence of the first order.


    One particular area of interest is in sales, with banks such as BNP investing
    heavily in machine learning research. Another aspect has been that of trying to
    explain to clients how the algorithms work as they are principally ‘black boxes’
    with hidden algorithms and are complex by virtue of the number of inputs. Elsewhere,
    regulators are understanding how with much greater granularity of data it is increasingly
    possible to discover who might be the beneficiaries of a transaction, and in doing
    so, uncover more market abuse. Clustering can also be used to detect outliers
    and errors in declarations.⁴¹


    # CONCLUSION


    The Bank of the Future will not only embrace AI and other related applications
    such as chatbots and advice bots but will also involve physical transformation.
    Whilst retaining some semblance of brand identity, future retail banks may look
    more like lounges, cafés or even shops. In the same way that high-end retailers
    have reinvented themselves by replacing shops with showrooms, allowing purchasers
    to look, touch and then buy online, banks will follow a similar route, although
    the approach will need to be different due to the intangible nature of banking
    products and services. After all, as considered in the prologue of this book,
    what banks are likely to do in the future is mainly to manage financial data and
    digital assets.


    Whilst a High Street presence may still have some brand reinforcement value, the
    increased use of robotics and virtual services undermines the need for this. In
    any event, who is really certain what the High Street of the future will look
    like anyway? Because of this, some possible scenarios are provided. Any or all
    of these might happen, perhaps some form of hybrid, perhaps something completely
    different. Do not rule out talking ATMs.


    Banks will increasingly extend their ecosystem and ‘universality’, and correspondingly
    extend their brand footprint. The ability to do this not only will allow bidirectional
    data flow but will also demand improved controls, governance and customer sensitivity.'
