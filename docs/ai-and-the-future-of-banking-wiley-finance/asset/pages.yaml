- pgno: 90
  md: '# Regulatory Compliance


    With such focus by banks on compliance, the use of advanced analytics and AI in
    this critical area is an inevitable area of focus. Known as Regtech, this falls
    broadly into the area of operational risk (which comprises a failure to comply
    with regulations, as well as other issues of compliance such as internal requirements).


    The particular challenge for global banks is that of complying with diverse local
    requirements even if there are similar underlying requirements such as customer
    interaction and capital management.


    In the area of customer management for example, the use of AI-infused recording
    and analysis can be used to monitor the nature and quality of advice given during
    a customer conversation, and ultimately to improve it. With the consent of the
    customer, AI can be used to break down a conversation into relevant key parts,
    such as whether the discussion was specifically financial advice or just general
    ‘chitchat’. From this, the financial advice element can be interrogated to establish
    whether the information given was within the accepted parameters. The AI element
    is a key component of how insight can be obtained, and a process by which the
    system constantly increases an understanding both of the nature and quality of
    interactions, and also the context of the conversation.


    At central bank level, AI is increasingly likely to play a part especially in
    the management of capital adequacy, in particular in the area of stress testing.
    The volatility of the economic climate lends itself to greater automation. The
    likelihood is that as banks enter the next decade, they will enter more into fully
    digitised processes. The impact of this is that they will move, probably quite
    quickly, from paper to fully digitised formats, which lend themselves more readily
    to modern approaches such as machine learning, natural learning and ultimately
    to AI.


    # Risk Management and AI


    The principles concerned here are:


    +   - Management of counterparty risk

    +   - Management of credit risk

    +   - Management of compliance


    With specific reference to the use of risk management, the issue is one of whether
    AI can provide some sort of automation, or whether it is just another element
    of the risk management ‘toolbox’. Even relatively robust solutions currently require
    human talent from data scientists and industry analysts. Beyond this, the data
    in itself may not be sufficient even when coupled with appropriate algorithms.
    Ultimately there must be the potential for AI to:


    +   - Combine different volatility models (a process called ensemble learning)

    +   - Choose and combine between different backtesting models, where strategies
    or models are applied to historical data

    +   - Make forecast volatility models learn from errors (reinforcement learning)

    +   - Create early warning systems for potential crises (neural networks)'
