  md: '# INTRODUCTION


    Both Open Banking and Blockchain sit alongside AI as key elements of change in
    considering the Bank of the Future. There is a temptation to think that these
    are all independent in nature but closer examination suggests that they might
    be complementary technologies.


    # Setting the Stage: Open Banking


    Consumers are already being encouraged to compare their current bank against others
    with organisations such as the Competition and Markets Authority (CMA) encouraging
    dissatisfied consumers to switch their bank. Some banks have started to send messages
    raising awareness about Open Banking, saying that it:


    +   - Gives more control over data

    +   - Provides choice about how balances are viewed and managed

    +   - Gives access to personal accounts from different banks²


    Most messages to direct customers go on to explain the mechanism by which an Open
    Banking arrangement could be set up, especially reassuring the customer that,
    amongst everything else, the customer will remain in control and that there are
    adequate security and safety measures in place. There’s a sense that this is an
    effort by the banking industry to advise their customers in accordance with directives,
    yet not to fully engage with them and share the benefits. After all, with circa
    70% of banking profits originating from loans, where is the incentive for banks
    to spread the news that better deals might be obtained from competing organisations?


    There is a move toward a more flexible way of doing business. Banks increasingly
    recognise that consumer behaviour remains mainly consistent regardless of what
    service they purchase, and that banking in its current form may be no more or
    less than a form of commodity. If the consumer is prepared to change internet
    provider or utility with a degree of frequency, then why should they not be prepared
    to change their banks in the same way?


    In the context of AI, which uses technology to help banks retain existing profitable
    customers and attract new ones, the challenge may perhaps be one of banks having
    a better understanding of the lifetime value of customers.


    The expression ‘Open Banking’ was first coined by Santander and one to which they
    had rights but, after discussion, the term was ‘released’ to the CMA ‘Competitions
    and Marketing Authority’ as part of a wider discussion.


    Associated with PSD2 (Second Payment Services Directive), it was published in
    the European Union’s Official Journal on 23 December 2015.³ It aims to:


    +   - Contribute to a more integrated and efficient European payments market

    +   - Improve the level playing field for payment service providers

    +   - Promote the development and use of innovative online and mobile payments

    +   - Attract new providers and technology companies to enter the banking market

    +   - Make payments safer and more secure'
