  md: '+   2. Continued growth and profitability, especially as lack of growth is
    rarely acceptable, leading to increased focus on the customer

    +   3. Effective risk and compliance management, which includes integrating risk
    management into everyday decisions


    It’s probably fair to say that, regardless of almost any industry, these are the
    three main key areas that need to be focused on. Some might even argue that in
    an age of digitalisation, these imperatives remain ‘constants’ in the overall
    decision matrix, and are to a large degree generic. Overall, perhaps it’s simply
    a matter of how these imperatives are ‘translated’ to the specific needs of the
    sector.


    Table 1 presents these in order, with specific reference to banking.


    # TABLE 1 Current Imperatives in Banking


    | Business Imperative | Tactic/Objective |

    |---|---|

    | Operational efficiency improvement | Cost take out by optimising the process,
    and creating ‘friction-free’ operations<br>Cost take out by refining the business
    model, and removing (or outsourcing) non-added value functions<br>Improving financial
    processes and controls by having more effective financial performance management<br>Better
    management of the distribution (or ‘channel’) process |

    | Better risk management | Ability to absorb, accommodate and comply with new
    regulations<br>Improve internal compliance controls<br>Embed risk management into
    controls and processes<br>Create early warning and alarms for breaches and non-compliance<br>Align
    risk management with decision making, for example in the pricing process<br>Improve
    risk modelling in the allocation of capital<br>Reduce and mitigate fraudulent
    behaviour, including theft |

    | Growth and profitability | Improve customer retention<br>Improve customer acquisition<br>Improve
    customer insight<br>Improve customer service<br>Upsell and cross sell<br>Improve
    campaign management<br>Accelerate product innovation and development |'
