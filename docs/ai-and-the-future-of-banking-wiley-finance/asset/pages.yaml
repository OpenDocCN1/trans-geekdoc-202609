- pgno: 197
  md: '# Interlock between Blockchain and AI


    Experts such as Francesco Corea identify a number of opportunities where Blockchain
    and AI meet. In his 2017 article ‘The convergence of AI and Blockchain: What’s
    the deal?’⁶ he points to several possible uses for AI:


    +   - Management of Blockchain energy consumption: Blockchain is already recognised
    as being very energy-hungry, and he suggests that effective use of AI may help
    in managing that energy requirement.

    +   - Helping with the problem of scalability: When (if) Blockchain is fully utilised,
    the issue of scaling is likely to become problematic and AI may help in some way
    by ‘pruning’ saved data, and ensuring only critical data is retained. This may
    avoid tying up unnecessary storage and ultimately may help create new blockchain
    ‘models’.

    +   - Improving security: Although one of the key selling points of Blockchain
    is security, the effective use of AI may further reinforce that capability.

    +   - Improving privacy: Data security and privacy regulations will continue to
    mature, and increasingly apply themselves to the Blockchain.

    +   - Improving efficiency: The ultimate scale of the network will bring issues
    of network optimisation, and AI may prove to be a tool in improving this, working
    together with energy consumption reduction.

    +   - Talent management: Current thinking regarding the use of Blockchain is that
    creating a ‘distributed ledger’ is mainly a manual operation, but Corea does not
    rule out the possibility of automating this using AI in some way.


    Conversely Corea also suggests that the use of Blockchain may also help in the
    adoption of AI by:


    +   - Improving trust in data systems

    +   - Improving AI effectiveness, because a more secure data sharing model will
    lead to more data being provided and thus more able to be analysed

    +   - Lowering market barriers to entry as AI becomes more accessible to smaller
    players by being ‘built onto blockchains’

    +   - Increasing ‘artificial trust’ in direct machine-to-machine interactions


    # BLOCKCHAIN IN BANKING


    Amongst other capabilities, Blockchain provides the ability for banks to make
    cross-border payments and foreign exchange. IBM’s Blockchain World Wire allows
    banks to optimise and accelerate foreign exchanges, and cross border payments
    and remittances, using what is known as the ‘Stellar Protocol’. This is a ‘common
    financial platform that is designed to be open and accessible to everyone. This
    document outlines the long-term goals of both the Stellar Development Foundation
    and the Stellar Network and Protocol’.⁷


    The Stellar Development Foundation, also known as Stellar.org, was incorporated
    in 2014 in the US as a non-profit-making, non-stockholding corporation, funded
    by a'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'combination of charitable donations and the purchase of Lumens, which are a
    form of bitcoin.⁸


    Jesse Lund, head of Blockchain at IBM, says about the use of cryptocurrency in
    this context:


    > I think cryptocurrencies could very well serve as a viable settlement instrument.
    We’ve started with Lumens, which is the native asset of the Stellar network, but
    we already have the capacity to introduce other cryptocurrencies that could include
    Bitcoin or Ether. We will add more digital assets based on client demand and participants
    on the network.⁹


    Of particular application is that of remittances or money transfers. The World
    Bank estimate that migrants across the world send home an estimated US $574 billion,
    which is about double the amount they were sending a decade ago. Over $138 billion
    was transferred from the US to other countries as remittances in 2016 alone, and
    migrants from Latin America and the Caribbean sent record amounts home. According
    to Pew Research, these remittances are more than just a family lifeline in many
    cases but a major contributor to some local economies especially in developing
    areas. Yet these payments struggle because of the need to involve intermediaries
    for this process, adding time, cost and complexity to the arrangement. The use
    of a Blockchain solution is said to provide for clearing and settlement in near-real
    time, and also to allow funds to be transferred at a lower cost than traditional
    correspondent banking.


    The essence of the IBM World Wire solution is that it provides a ‘private and
    permissioned’ Blockchain protocol for the banking sector, as opposed to one that
    is more ‘public and permissioned’. The differentiator is that this is a banking-specific
    solution that meets the broader criteria of the Stellar protocol, which calls
    for ‘thousands of transactions per second’. According to Lund, ‘This network really
    has the potential to radically transform foreign exchange entirely’.


    From a customer point of view, there are implications of speed, reduced cost and
    greater efficiency. For the banking industry, this is yet another indication of
    the use of technology reducing (or even removing) traditional jobs in the banking
    workplace.


    Foreign exchange is described as a ‘market that dwarfs the stock market’.¹⁰ Principally
    there are two types of foreign exchange market, Interbank Market and Foreign Exchange
    (or ‘Forex’).


    # Interbank Market


    The Interbank market is one where, although there are few banks involved, the
    scale is enormous and sufficient to open the doors to manipulation, especially
    in the Forex business environment, where there have been previous accusations
    of rate fixing. Interbank transactions can be between 10 million and 100 million
    per day. Increased automation has a part to play in the governance of these deals
    and in helping detect anomalies.


    Banks also take part in what is called the SWIFT market, formed in 1974, which
    allows them to transfer foreign exchange to each other. SWIFT (Society for World-Wide
    Interbank Financial Telecommunications) is a messaging system that allows banks
    to'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'securely transmit information between one another through a series of standardised
    codes. It''s a predominantly code-cased approach:


    +   - First four characters: the institute code (i.e. the bank code)

    +   - Next two characters: the country code

    +   - Next two characters: the location/city code

    +   - Last three characters: optional, but can be used to assign codes to individual
    branches


    As with Stellar.org, SWIFT is non-profit-making. In this case it comprises a cooperative
    model owned by members who pay a subscription to take part, plus support fees
    dependent on the category of use. SWIFT’s particular challenge is in respect to
    the number and complexity of transactions, and the increasing degree of automation
    that is occurring. Whilst SWIFT appears to have a dominant position at the moment,
    there’s a real call to action to invite SWIFT to respond to changing times or
    suffer the consequences. After all, in this banking industry, how many capabilities
    created over three decades ago will carry the test of time without changing in
    the future?


    In more recent times, bearing in mind the focus on analytics and AI, it is recognised
    that ‘SWIFT has recently introduced dashboards and reporting utilities which enable
    the clients to get a dynamic, real-time view of monitoring the messages, activity,
    trade flow, and reporting. The reports enable filtering based on region, country,
    message types, and related parameters.’¹¹


    When compared to the forward thinking approach of Blockchain, SWIFT might be argued
    as holding a ‘defensive position’ concerning issues of scalability, reference
    data and compliance. These by themselves are not impenetrable positions and it
    will be interesting to see how SWIFT responds to, or complements with, the Blockchain
    proposition. Perhaps one test is to consider whether a new entrant to the banking
    sector would prefer a SWIFT solution or a Blockchain-type solution. Probably both
    in the interim, but which of these options is likely to be more sustainable?


    # Forex Market


    The second type of foreign exchange is what is called the Forex or ‘over-the-counter’
    market. This market isn''t as highly regulated and can be subject to substantial
    opportunism. It''s very much around ‘spot trading’ at the time of exchange or
    at some time in the future. Every day currency is ‘fixed’ against benchmark foreign
    currency rates in London which are determined by the buy and sell traders 60 seconds
    either side of 4 pm, and the benchmark rates of 21 currencies are determined within
    that one-minute window. The industry has been found to be subject to abuse through
    rate manipulation and allegations have been made against traders colluding by
    sharing information about orders prior to the 4 pm ‘fix’, and by what is known
    as ‘banging the close’ – that is, aggressive buying or selling of pending orders
    prior to the 4 pm deadline.¹²


    There’s no need at this point to go into detail about the pros and cons of these
    trading approaches other than to consider the impact of more detailed analytics
    and automation. Perhaps more than the human workforce aspect, the use of advanced
    analytics is important both to help in the decision-making process and also to
    detect anomalies. Retrospective analysis by Bloomberg journalists over a two-year
    period identified'
