- pgno: 32
  md: '**Manager and Counsel:** ‘Take a lead role in monitoring trends, industry and
    regulatory developments, including in respect of Open Banking, Future of Payments,
    Big Data, Artificial Intelligence, Wearables, IoT, digital payments, marketing
    and personalisation.’


    These quite genuine job adverts from the banking sector have not been specifically
    referenced partly because these advertised vacancies are now likely to be ‘long
    gone’. However, it’s hoped the descriptions give an indication of what is ‘hot’
    in the job world, roles that command significant (and in some cases eye-watering)
    remuneration packages, and some of the buzzwords that might need to be included
    in CVs to attract the attention of analytically infused recruitment processes.


    One important aspect to consider is that recruiters and employers are not just
    looking for generally competent individuals whom they are willing to train on
    the job. Rather they seem to be looking for capable and seasoned individuals who
    can hit the ground running and make an immediate impact. The scale of demand is
    arguably worrying; for example, HSBC alone is looking for 1000 people. When this
    is extrapolated into the wider banking industry and multiple other sectors responding
    to the AI era, then there is quite possibly a resource and talent challenge and
    that is one of how to find enough of the right calibre of suitably competent candidates.
    Adequate training and experience don’t happen overnight. As Malcolm Gladwell put
    it, some suggest that to become a true ‘master, you need to put in 10,000 hours
    of experience’.31


    By comparison, Fitch Learning say that to become a ‘game changer’ in the future
    of financial services might require six years of training. However, perhaps banks
    don’t need ‘game changers’ or ‘masters’ at this stage but rather they need highly
    qualified and competent *foot soldiers*.32


    Where will these competent foot soldiers come from? There are many prospective
    candidates in the pipeline but will they have the right skills when they emerge?
    Will they have the ability to apply themselves to particular industry verticals,
    or the specific challenges of individual market sectors? In the long run, does
    that matter? Perhaps a future operating model, at least in the short term, is
    the ability for data scientists to co-work with banking experts. In time, it’s
    likely that there will be no distinction between these two professions, and that
    banking experts will need to have adequate ‘new age’ technological capability.


    *Anecdotally, a data scientist with expertise in fisheries and oceanography was
    being ‘courted’ by financial institutions to turn his hand to customer acquisition
    through data management. Surely the biblical expression ‘Fishers of Men’ was never
    intended to be used in this way?*


    Advanced analytics and AI are increasingly being judged to be important not only
    to the future of banking in general terms but also to the future profitability
    of individual banks. Banks (and others) are likely to be increasingly ruthless
    in acquiring specialist practitioners, and in doing so will start to push up salary
    costs. The impact of this could be to widen the gap between Tier 1 and Tier 2
    industries in respect to analytical maturity. A shortage of skilled people and
    increased salary costs will lead to banks wanting to develop alternative strategies,
    especially in advanced analytics, machine learning and ultimately AI. New disaggregated
    business models might need to emerge. With banking as ‘first movers’ in comparison
    to other industries, a shortage of talent might be more likely to create some
    form of a burning platform or catalyst, and in doing so, to force the development
    of AI more quickly.'
