- pgno: 66
  md: 'that, in the future, there will still be branch networks of sorts for that
    particular HNW demographic.


    Similarly, the concept of a café bank recognises the need for co-location of banking
    and coffee providers, and especially targets participants of the so-called ‘flat
    white economy’, named after that group whose preferred (daytime) beverage is flat
    white coffee. Perhaps banking services in some form or another will be physically
    placed where the public are likely to have a need for financial advice.


    There are other, equally important uses for location analytics going forward.
    At a more ‘defensive’ level relative to either natural disaster or human conflict
    such as weather, crime, terrorism or cyber infiltration, effective use of location
    analytics can help a bank plan where best to place its critical physical infrastructure
    to mitigate risks.


    Even if we anticipate a future AI-infused world heavily influenced by remote devices
    and ‘smart devices’, the role of location still plays a critical part. Futurists
    speculate on a world where advertising images are personalised and communicated
    to us as we walk past some form of physical or virtual billboard. Major banking
    corporations will continue to extend their brand and boost their profitability
    by taking every opportunity to understand the location of their existing customers
    (for cross sell/upsell opportunities), and of potential future customers (for
    customer acquisition). This will be more important as Open Banking becomes more
    operational.


    The story of location analytics as a profession and industry is in itself transformational.
    A decade ago, the role of the GIS (geographic information systems) analyst was
    very much a backroom position, but as ‘location’ has become ever more critical,
    that role has propelled itself forward. Even so, with such a critical capability,
    the reality is that salaries in the GIS profession are still relatively poor.
    Based on Feb 2019 figures, the average salary for a GIS analyst is $26.26 per
    hour in the United States, whereas the average salary for banking is $40.00 (ranging,
    incidentally, from $26,150 to $324,651 annually).14,15


    Perhaps the reason for that disparity is that GIS analysts are technically and
    analytically minded rather than commercially minded. Going forward, we are increasingly
    likely to see a convergence of technologies such as analytics, AI, machine learning
    and others, but with expertise more aligned to industry-specific requirements.


    Talent acquisition and management will also remain important across all elements
    of analytics and AI. Organisations will need to plan and implement a strategy
    for ensuring that not only new entrants but also existing participants are increasingly
    ‘tech savvy’, and that the historic demarcation between the ‘line of business’
    and the ‘IT department’ is broken down. This will inevitably lead to new roles,
    new challenges around talent management and the development of new competences.


    # CONCLUSION


    The banking industry has no shortage of data. Some elements of this complex industry
    are almost entirely reliant on it, and roles have emerged (and continue to evolve)
    based on data. This chapter aimed to set out a hierarchy or migration curve in
    respect of analytical maturity.'
