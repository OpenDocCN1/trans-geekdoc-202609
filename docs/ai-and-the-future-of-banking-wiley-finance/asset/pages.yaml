  md: 'It’s clearly an exceptionally complex field and, in the relevance to banking,
    the use of finger and thumbprints is already being considered as a replacement
    to signatures. More importantly, as the banking industry becomes increasingly
    digital, consumers have the growing personal challenge of managing (and recalling)
    multiple passwords. The ability of a consumer to access information using biometric
    information becomes all the more attractive, although the flip side is that a
    potential vulnerability starts to emerge: if one site is hacked using faked biometrics,
    then perhaps the entire digital ecosystem of the consumer is placed at risk.22,23


    Biometrics are an inevitable part of the Bank of the Future. For example, Windows
    Hello aims to stretch biometric information into other device authentication,
    ‘With Windows Hello,’ suggests the MS marketing, ‘you’ll be able to just show
    your face, or touch your finger, to new devices running Windows 10 and be immediately
    recognized’.24


    # Palm Vein Recognition


    Palm vein recognition is a form of biometric identification that takes into account
    the layout of the veins below the skin in the palm of the hand and the amount
    of oxygen-carrying protein in the blood (haemoglobin). By using near-infrared
    scanning of the veins, it’s possible to create a map of the veins that provides
    a unique identifier of the individual, especially as the way that the blood is
    pumped through the hands (and the rest of the body) is unique to the individual.


    This is also known as ‘vascular biometrics’ or ‘vascular technology’, and developers
    point to unique advantages:


    +   - The contactless nature of the recognition process reducing health and safety
    issues, especially where identification was required in a public place

    +   - 100% accuracy in terms of identification

    +   - The resilience of the system to skin surface problems, such as dryness,
    wetness or roughness

    +   - The need to have the user’s consent to provide that physical scan of the
    hand, unlike with facial recognition, which can be done remotely without permission,
    for example

    +   - Reduced fraud potential as the consumer needs to be physically present


    It’s an interesting area. One downside may be that it would be possible to scan
    a person who was unconscious, perhaps undergoing medical treatment or worse and
    obtain access to their accounts.25


