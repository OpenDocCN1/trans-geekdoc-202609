- pgno: 56
  md: 'The emerging trend is that of moving from ‘big data’ to ‘fast data’, which
    is the assimilation of information and its analysis in real or near-real time.
    In a banking context, speed of information helps banks and other organisations
    provide a more customised and more relevant offer.


    Variety: Data comes to the user from many sources and in many forms – structured,
    semi-structured and unstructured. Semi-structured data presents particular problems
    because it is seldom consistent. Structured is in the form of established and
    organised data warehouses. Unstructured data (for example, plain text or voice)
    has no structure whatsoever but some might reasonably argue that there is a ‘golden
    thread’ tying both structured and unstructured information, and that is the ‘thread’
    of location. After all, it’s suggested, isn’t everyone and everything somewhere?


    Currently, a significant amount of data is unstructured, perhaps as much as 80%.
    It’s suggested that the winners of the future will be those organisations which
    can obtain insight and therefore extract value from the unstructured information.
    In a banking context this might comprise data, for example, which is based on
    social media and which helps establish consumer sentiment and brand equity.


    Veracity: This is normally taken to mean the reliability of the data. Not all
    data is equally reliable because it comes from different sources. One key measure
    of veracity is the ‘signal to noise’ ratio, which is an expression for the usefulness
    of information compared to false or irrelevant data. (The expression has its origin
    in the quality of a radio signal, for example, compared to the background noise.)


    In a banking context this may relate to the amount of ‘spam’ or off-topic posts
    on a social media site where a banker is looking for insight into customers’ reactions
    to a new media campaign. Spam may also include information automatically created
    in large volumes by ‘webots’, also known as ‘WebRobots’, ‘WWW robots’ or just
    simply ‘bots’. Typically a bot performs repetitive tasks that could be done by
    a human but at much higher volumes.


    As organisations become obsessed with data governance and integrity there is a
    risk that any data that is less than perfect is not reliable. This is not necessarily
    true. One major UK bank, for example, gives a weighting to the veracity, or ‘truthfulness’,
    of the data. It allows them to use imperfect information in their decisions. The
    reality is that even in our daily personal life, decisions we take are often based
    on the best information available, even if it is not perfect, and subsequent actions
    are taken accordingly with different levels of confidence.


    Value: the final characteristic and one not widely commentated on is that of the
    value of the data. This can be measured in different ways, such as the value to
    the user of the data in terms of giving deeper insight to a certain issue, or
    the cost of acquiring key data to gain better information about, for example,
    the creditworthiness of a customer. The challenge for many banks – and for other
    organisations – is how to ‘monetarise’ the data they presently have and can collect
    in the future.


    There’s an argument to say that almost all essential information is already out
    there ‘in the ether’ and it is simply a matter of finding it and creating a mechanism'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'for absorption and analysis. Very definitely it seems that certain key types
    of data are critical to gain particular insights, and there is often a strong
    financial benefit case for actively seeking it.


    In a banking context, as we consider the concept of the universal bank and the
    ‘full financial service enterprise’ offering a wider range of products and services,
    these new services and ‘next-generation’ offerings may not be created and managed
    by the banks themselves but rather by third-parties, working with the bank on
    some form of ‘revenue share’. In such a case, data shared up and down the supply
    chain (with the customers’ agreement) would typically assist in a go-to-market
    strategy and ultimately that of operational execution, so to that extent the data
    has monetary ‘value’ in terms of more effective marketing.


    Recently an additional 8 ‘Vs’ have also been suggested.⁶,⁷


    +   - **Validity:** Embracing data quality and master data management (which we
    will cover below)

    +   - **Variability:** Including data that is dynamic and evolving, such as the
    identification of behavioural attributes in the source data (i.e. conscious or
    unconscious bias)

    +   - **Venue:** Covering not just geographic relevance but also in terms of the
    platform on which the data was hosted, such as in a distributed ledger/Blockchain

    +   - **Vocabulary:** Linked to data models, the semantics describing the data
    structure

    +   - **Vagueness:** Relating to the confusion over the meaning of terms used
    in ‘big data’ and the tools used

    +   - **Vulnerability:** The new security concerns that big data brings

    +   - **Volatility:** How long the data remains relevant

    +   - **Visualisation:** Is it possible to use visualisation to provide easier
    understanding of detailed information?


    Purists might suggest that of the 13 items listed, there’s an element of duplication
    between the first 5 and the second 8. Let’s just say that sometimes there is no
    limit to the human imagination in terms of marketing. At the moment probably all
    types and categories of data that currently exist and will exist in the future
    can be characterised by these expressions. (For the superstitious, perhaps it
    might be necessary to find another ‘V’ to move the number of descriptions beyond
    the unlucky ‘13’, maybe ‘Virus-free’?)


    # DATA MANAGEMENT AND ANALYTICS


    # Data Management


    The idea of data management, sometimes also known as ‘MDM’ or ‘master data management’,
    has been around for a long time but is attaining a new level of importance in
    the age of AI. In business it’s considered ‘a method used to define and manage
    the critical data of an organization to provide, with data integration, a single
    point of reference. The data that is mastered may include reference data, that
    is, the set of permissible values, and the analytical data that supports decision
    making’.⁸'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'In other words, it’s a process that helps remove duplicate data, creates standardisation
    and creates business rules that prevent ‘rogue data’ from entering the system.
    As a technological process or function it is also evolving.


    There are considered to be three ‘ages’ of MDM:


    +   1. First-Generation MDM focused on data quality and governance. This allowed
    businesses to consolidate information from customers, products or financial data
    from multiple systems, and was especially useful where there had been mergers
    and acquisitions.

    +   2. Second-Generation MDM reflected the evolution of systems by placing greater
    emphasis on the customer, and especially relating to omnichannel strategies by
    providing real-time visibility into multiple channel activity.

    +   3. Third-Generation MDM reflects the introduction of automation and new systems,
    with users increasingly pressing for exchange of information across multiple ecosystems.
    In doing so, they are demanding greater flexibility, data virtualisation, the
    ability to retrieve data without requiring technical information about the type
    of data (such as how it is formatted) and data syndication (information from third
    parties, such as consumer product or goods manufacturers).


    According to Forrester’s report,⁹ the two major initiatives in third-generation
    MGM are:


    +   1. **Prioritising agility over compliance**: Whilst recognising that compliance,
    including data protection, is a crucial component, companies also want to provide
    a personalised experience to the customer in an agile manner that reduces the
    ‘time to value’ (TTV). ‘Time to value’ is a metric usually defined as the amount
    of time it takes for a customer to realise value from a product or service.

    +   2. **Forming the cornerstone of digital change**: MDM is increasingly being
    recognised as what is described as ‘the centrepiece of flexibility’, allowing
    companies to gain deeper insight into customers, products and channels.


    In terms of the AI agenda, companies such as Informatica, who are identified as
    a leader in Forrester’s report, aim to use AI to ‘simplify MDM integration, provide
    matching, discover relationships or automate rules-based data quality’.


    # The Hierarchy of Analytics


    Analytics, or the analysis of data, is generally recognised as the key by which
    data insights are obtained. Put another way, analytics unlocks the ‘value’ of
    the data.


    There is a recognised hierarchy of analytics (see Figure 3.6):


    +   - **Descriptive Analytics** serves simply to report on what has happened or
    what is happening. In banking, this might relate to the performance of a bank
    branch, a product or a service for a given date or period. Descriptive analytics
    is also often known by the expressions ‘business intelligence’ or ‘management
    information’.'
