- pgno: 82
  md: 'Social media not only exists to improve consumer sentiment and brand image,
    but also it is a key communication medium for the customer base. That means that
    the content is not only snappy but readily understandable on a small screen. This
    goes beyond ‘flat’ images and web shots but also to the use of short videos, and
    social media channels such as Instagram and Facebook. As we specifically consider
    the banking of the future, then it needs to be recognised that Millennials are
    likely to use social media as one of the primary channels, if not the main one.


    For banks to effectively use social media, they need to be able to:


    +   - Manage large amounts of data, and effectively use analytics to create actionable
    insight.

    +   - Deal with this at speed, so that any insights generated are relevant.

    +   - Understand the context of text, either relative to the individual (which
    requires a high degree of granularity) or to the peer group as a whole.

    +   - Be able to communicate this effectively using multiple social media platforms.


    There’s an array of tools typically used in social media analytics, including:


    +   - Natural language processing, which enables computers to process and analyse
    large amounts of human-generated content

    +   - Sentiment analysis, sometimes known as opinion mining, which allows computers
    to ‘identify, extract, quantify, and study affective states and subjective information’⁸

    +   - Data mining, which is the process of discovering patterns in large data
    sets

    +   - Social network analysis, which is the process of identifying social structures
    within the text, such as friendships or affinity groups

    +   - Social media mining, which is the process of obtaining data from social
    media sites for the purpose of obtaining insights


    The market offers a large number of software tools to enable these functions to
    be undertaken. The ultimate choice of vendor might depend on the available budget
    and the importance of the outcome required.


    In banking specifically, sentiment analytics are also used to gain insight into
    trade movements in financial markets, sourcing organisations such as Bloomberg
    News, Facebook and Twitter, as well as PR releases from companies. Such insights
    not only provide better insight and help improve economic forecasting but can
    also be built into economic models to improve accuracy. Experts such as Cuemacro⁹
    remind us that companies, including banks, have much to gain by looking at internal
    unstructured data such as internal emails and reports from business partners,
    as well as from publicly available content.


    In the wider context, effective use of social media analytics by banks allows
    them to:


    +   - Understand and influence consumer sentiment

    +   - Contribute to more timely and relevant offerings

    +   - Improve brand image and brand equity

    +   - Provide a catalyst for more effective social interaction with the customer
    – for example, around complaints management'
