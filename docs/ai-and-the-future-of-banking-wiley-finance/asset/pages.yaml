  img_proc: true
- pgno: 161
  md: 'For those readers perhaps in their mid- or later career who might be thinking
    that this is irrelevant to them, they should reflect on the fact that whilst in
    2050 they may not be active professionals, they may nevertheless still be customers
    and recipients of the service of the bank of the future.


    But before leaping forward in time, it might be helpful to look backward a similar
    period of 30 years.


    By the end of the 1980’s there were great socioeconomic changes. This included
    a move away from planned economies to what some describe as ‘laissez faire capitalism’,
    that is, ‘an economic system in which transactions between private parties are
    free from government intervention such as regulation, privileges, tariffs and
    subsidies’.34


    At that time, 30 years ago, developing countries faced multiple debt crises requiring
    intervention from the International Monetary Fund. Famine in Ethiopia led to the
    Live Aid concert in 1985. Multinationals were increasingly offshoring their manufacturing
    activities to Asia. Tim Berners Lee had formalised the concept of the internet
    in 1989. From a tech viewpoint, in 1984 the Motorola DynaTAC 8000X becomes the
    first commercially available mobile phone (a full charge took 10 hours and gave
    30 minutes of air time). Game consoles introduced Donkey Kong and Super Mario
    Brothers. There was a rise in the use of PCs including home computers such as
    the Macintosh 128 which was the original Apple Macintosh.


    From a retail banking point of view, according to Bank of Ireland, today only
    3% of customers do their banking over the counter whereas in 1980 it was 100%.
    Almost all retail transactions were cheque -based including salaries leading to
    long queues at the counter on a Friday. ATMs were few and far between. With multiple
    banks and branches, the role of the Branch Manager was not only prestigious but
    also pivotal. He (it was predominantly a ‘he’) was pivotal to the process making
    key local decisions on loans and mortgages with judgements taking days and sometimes
    weeks whereas nowadays these are usually made at headquarters in a matter of hours.35


    In 2050, the realities for the banking employee might well be that:


    +   - There will be no branches as are currently known.

    +   - The main relationship of the customer with banks will be entirely app orientated.

    +   - The quaint concept of keyboards will have disappeared and screens may have
    disappeared as we know them, replaced by 4-D projections.

    +   - There will be many more types of bank with niche and customisable service
    offerings.

    +   - Back-office functions (as we currently know them) will be almost entirely
    automatic.

    +   - Front-office functions (as we currently know them) will be almost entirely
    mainly robotic.

    +   - The main operational costs for banking, typically those of people and property,
    will have been significantly reduced if not removed completely.

    +   - The dominant purpose of banks will be that of managing and creating capital.'
