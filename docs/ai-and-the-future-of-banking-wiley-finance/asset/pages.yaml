  md: '# AI and the Importance of Brand in Banking


    # SUMMARY


    At face value, this chapter might be more appropriate to a book on marketing rather
    than AI. It’s an easy mistake to make. As the development of AI occurs to a point
    where banking is increasingly automated, customers will interact through self-help
    capabilities and robotic ‘chatbots’, and products and services will be customised.


    The need for hyper-customerisation is unlikely to be achieved other than through
    advanced and cognitive analytics and through AI. The chapter will consider some
    of the specific expectations of Gen X, Gen Y and Gen Z customers in terms of both
    banking and brand.


    The differences between competing banks will get smaller and smaller. Perhaps
    the only difference will be the qualities of the technologies used, and in many
    cases the back office of the bank may be using the same tech as their competitors.


    What then might differentiate one bank from another? The clunkiness of the banking
    app will affect user experience, but this is arguably a superficial element of
    the entire value chain. What might distinguish one bank from another is quite
    simply that of brand, and more specifically how the brand is perceived by the
    user base.


    This section will consider what is meant by ‘brand’ in the context of banking,
    the specific impact that branding has on Millennial and post-Millennial customers,
    and the linkage of both to AI.


    It also suggests that banks potentially have a much greater part to play in the
    lifecycle of consumers, with the ability to become some form of ‘lifestyle manager’.


    # For This Generation, Talking to a Robot Is Nothing Unusual


    > ‘In the financial services industry overall adoption rates’ (of chatbots) ‘remain
    low, but this is changing rapidly’, says a senior banking analyst at GlobalData.
    ‘For the generation that is growing up with Alexa, Cortana, and Siri, talking
    to a robot is nothing unusual. To remain relevant to this generation, financial
    services providers (continued)'
  merge: -1
  img_proc: true
- pgno: 128
  md: '*（continued）*


    will have to integrate chatbots into their overall channel strategies’. GlobalData’s
    2018 Investor Survey shows that only 8.3 per cent of customers have used chat
    applications when dealing with their investment providers.^1


    # INTRODUCTION


    We think we know all about branding and brand awareness. After all, we live with
    it every day, are surrounded by it and often make our buying decisions based on
    it. But what is it really other than (some might say) just another tool in the
    back pocket of marketing professionals? According to the American Marketing Association:^2


    > A brand is a name, term, design, symbol, or any other feature that identifies
    one seller’s good or service as distinct from those of other sellers.


    It’s the image that people have in mind when considering the physical nature of
    the good or service, and their emotional engagement with it. In their book *Marketing
    Management*, Kotler and Keller say, ‘Branding is endowing products and services
    with the power of a brand’, which seems fairly straightforward, and there’s no
    shortage of information about the topic given its importance.^3


    Branding is achieved in multiple ways, such as:


    +   - Advertising

    +   - Communication strategy

    +   - Product and packaging design

    +   - Customer experience

    +   - Sponsoring and partnerships

    +   - Visual identity of the brand (logo, website and colours).


    But why does brand resonate so strongly with us, how does it create such a differentiating
    effect, why is it such a key component to loyalty and why will it be even more
    important going forward? As we understand these aspects more, what will be the
    impact of the digital age and the AI-era?


    In his paper ‘The Importance of Brand Awareness in Consumers Buying Decisions
    and Perceived Risk Assessment’^4 Associate Professor Olividiou Moisescu carried
    out research into the relationship between retail banks and consumers, and his
    findings reinforce the importance of brand awareness and recognition in the decisioning
    process.


    Moisescu equates branding in the eye of the consumer with issues of risk, as familiarity
    with the brand and its characteristics provides confidence in the purchasing decision.
    Brand awareness falls into two categories: ‘unaided’, which relates to brand recall,
    and ‘aided’, which relates to brand recognition. Both of these are important relative
    to'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'the purchasing decision, but some might argue that these are techniques more
    suited to commodity purchases rather than financial services.


    Marketing for financial services is increasingly considered to be a specialist
    area requiring in-depth knowledge not only about products and services but also
    about consumer sentiment and what is most likely to resonate with current and
    future customers. Brand positioning for many financial services seems to be relatively
    intangible when considered against the bank itself. Financial services often use
    brand identities associated with sports, animals or both, and then aim to reinforce
    messages of innovation, teamwork and trustworthiness. In a more sophisticated
    world of AI and imagery being presented on a small mobile screen, almost certainly
    new brand techniques will need to start to emerge such as sound, voices and other
    sensory attributes. AI methods will in time start to customise how an individual
    consumer is best attracted by a particular element of branding.


    As the concept of universal or full-service banks develop, the challenge for marketers
    will be that of ensuring the brand message is communicated by all elements of
    the banking ecosystem in a consistent way. The weakest link of the supply ecosystem
    will become the weakest link of the banking universe. More effective governance
    of the supply chain will become increasingly important, and the role of the supply
    chain manager will be obliged to reflect this.


    # BRAND VALUE AND EQUITY IN BANKING


    Brand isn’t just an exercise in attracting customers but has a strong and relatively
    clear financial value as well. In *Managing Brand Equity: Capitalizing on the
    Value of a Brand Name*,⁵ David Aaker – who is an American organisational theorist,
    consultant and professor emeritus at the University of California – considered
    the concept of ‘brand equity’ or ‘brand value’, describing it as a ‘complex combination
    of brand awareness, perceived quality, brand loyalty and brand associations’.


    Brand value is measured in three key ways:


    +   - Cost-based brand valuation

    +   - Market-based brand valuation

    +   - Income-approach brand valuation


    Experts also recognise the importance of value and how to financially assess it,
    typically understanding the significance of:


    +   1. Value derived out of customer perception, social media, and so on, as a
    relative measure against an unbranded/common brand

    +   2. Value derived in terms of growth in market share and revenue through perceived
    brand equity over a time period


    The essence is, therefore, that brand isn’t just a form of ‘magnet’ that attracts
    new customers and encourages existing ones to be loyal. Both of these, incidentally,
    are important elements as the concept of Open Banking gains in traction, and brand
    value'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'becomes a vehicle in terms of customer magnetism. Rather, it recognises that
    in banking marketplaces where mergers and acquisitions are likely to feature,
    either between banks or other business (such as technology companies for example),
    then brand is important in terms of the market valuation of a potential ‘target’.


    Studies by companies such as Brand Finance, a leading brand valuation consultancy,
    seek to identify the world’s biggest banks by their brand value.^6^ They calculate
    value through three contributing factors:


    +   1. Enterprise value, which they define as ‘The value of the entire enterprise,
    made up of multiple branded businesses’

    +   2. Branded business value, which they define as ‘The value of a single branded
    business operating under the subject brand’

    +   3. Brand contribution, which they define as ‘The overall uplift in shareholder
    value that the business derives from owning the brand rather than operating a
    generic brand’


    Brand Finance differentiate between ‘brand value’ and ‘brand strength’. The latter
    is defined by ‘the efficacy (or value) of a brand’s performance on intangible
    measures, relative to its competitors’, measured by marketing investment, stakeholder
    equity and the impact of those on business performance.


    In their 2018 report, Brand Finance also draw specific attention to non-finance
    competitors in the broader financial services sector such as Apple, Facebook,
    Google and Amazon. They make the point that these tech giants have either already
    created consumer-facing financial services or are expected to do so soon. As such
    they ‘represent new challenges to traditional banking services, as they are more
    aligned to modern customer expectations around instant multi-channel and multiplatform
    services’.


