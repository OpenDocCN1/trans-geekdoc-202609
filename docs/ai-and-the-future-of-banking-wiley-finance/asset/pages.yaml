  md: 'Banks in Mexico, South America, Africa, and the Middle East are also moving
    towards the use of biometric identification technology because of its popularity
    with consumers, and ability to offer more security than traditional personal identification
    numbers (PINs) and passwords.


    Elsewhere the Chinese biometric market has experienced double-digit growth between
    2014 and 2019. Part of the reason is government intervention and security issues
    but also a general trend towards increased usage. In 2014, almost a decade ago,
    more than 20 commercial banks, 130 regional commercial banks and 200-plus foreign
    banks were using biometrics. The rate of acceptance in that particular region
    seems in many ways to be linked to a more engaged, ubiquitous use of the technology,
    including:


    +   - Government intervention where biodata is required to be added to passports
    and national ID cards for quick and easy identification

    +   - Cross-border travel where the weight of numbers especially at national holidays
    force the use of new innovative technologies

    +   - Security and identification at gaming festivals

    +   - Coal mining to keep track of workers in this volatile and at times risky
    working environment

    +   - Healthcare, especially for patient safety but also to provide supply-chain
    verification in issues of blood supply, for example³⁰


    With increased progress in this area principally in Asian and Growth markets,
    what is preventing Western and North American customers from moving to a more
    biometrically oriented approach to identification?


    +   - Perhaps we think our identities are fundamentally private, and that biometrics
    steps over the line between the data that we, as individuals, are prepared to
    share and have stored.

    +   - Possibly it just feels too Orwellian and from the realms of science fiction.


    There are, however, very practical issues to contend with. In order to comply
    with Europe’s Payment Services Directive 2 (PSD2), banks in the EU need to provide
    multi-factor identification. There is a need for a second factor but banks are
    still increasingly looking to traditional methods such as passwords, security
    questions and card readers. The use of a biometric solution alone will not suffice
    but could form part of the identification equation.


    This may be principally a generational issue. What will it be that starts to compel
    consumers to be prepared to engage with biometrics, and why have the other markets
    moved so quickly into the biometric space? It’s likely that government intervention
    is one dominant driver but there may simply be stronger direction at a macro level
    towards the use of this type of advanced technology. This may be driven in part
    by the sheer weight of numbers in certain markets and also the diversity of the
    population, but also the increasing acceptance of new technologies in that region
    and their ability to rapidly implement new approaches.'
