  md: 'approach can help provide the necessary insights to allow more effective relationship
    pricing. Zafin’s approach is to use what they describe as a ‘Customer Relationship
    Score’, which uses algorithms to understand a customer’s behaviour, and what they
    call the customer’s ‘stickiness’. Their Chief Analytics Officer, Suman Singh,
    describes it as allowing the bank ‘to look systematically at customer experience
    from a strategic perspective of value and opportunity, and morph its interaction
    model to maximise customer satisfaction.’


    Cutting through the jargon, it’s about running a FICO credit-scoring type of approach
    which aligns to the risk appetite of the lending bank, with the key components
    of the scoring system comprising:


    +   - Current product ownership

    +   - Payment preferences

    +   - Product usage behaviour

    +   - Customer interaction experience


    The scoring model allows the bank to segment customers as being:


    +   - Best in class

    +   - Strong relationship

    +   - Moderate relationship

    +   - Weak relationship


    Based on the Customer Relationship Score (CRS), it allows the bank not only to
    identify what products it may choose to offer, but also at what price.¹⁴


    The idea of altering the price (aka ‘pricing elasticity’) is not new, and is one
    of a series of capabilities that sees price flex depend not only on supply and
    demand but also on the customer’s propensity to buy. The idea recognises that
    a relatively small change in price can have a large impact on demand. (A product
    is deemed to be ‘inelastic’ if a large change in price does not impact on demand.)


    Pricing elasticity, or as it is sometimes known, ‘pricing optimisation’ is a common
    practice in other industries such as hotels and transport – for example, in the
    cost of flights. On the other hand, the approach has been criticised especially
    in the area of property insurance, where the cost is based not on the physical
    risk but on the customer’s behaviour. In 2015 the Florida Insurance Commissioners
    expressed concern that pricing optimisation was ‘discriminatory’.¹⁵


    How the customer responds to pricing elasticity is thought to depend on several
    factors:


    +   - The competitive environment, and the pricing of equivalent peer products
    and services

    +   - The essential nature of the product, and if there are any ‘substitutes’

    +   - The habitual nature of the purchase (for example, the purchase of alcohol)

    +   - The loyalty of the customer base

    +   - The impact of effective advertising'
