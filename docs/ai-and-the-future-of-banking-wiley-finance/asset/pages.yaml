- pgno: 158
  md: 'In his article ‘Zen and the Art of Leadership’, writer Stephen Balzac draws
    an analogy between the master swordsman and the business leader.28 A master swordsman,
    he says, understands his craft but fights to his best when he does not care whether
    he lives or dies. A successful athlete, says Balzac, also takes the same approach
    knowing that overanalysis will make them too introspective and lead to doubt or
    failure. We might call this ‘paralysis by analysis’. The same applies in business,
    where a successful leader must be prepared both to win and to lose, and to empower
    his or her team, rather than micromanage them for fear of failure.


    There is, however, a potential contradiction. In such a highly regulated industry
    as banking with compliance being a critical success factor and failure having
    potentially heavy consequences, there is no real scope for ‘rogue activities’.
    One of the greatest real challenges is that of somehow bringing together the relatively
    entrepreneurial style of ‘new leaders’ with the constraints of a relatively rigid
    industry. Perhaps the ‘emotional fortitude’ mentioned earlier also needs to include
    the frustrations of ‘new leaders’ who will be constrained from transforming the
    business by the framework within which they operate.


    # FUNCTIONAL CHANGE AND ROLE TRANSFORMATION


    Earlier in this book the different types of banks were considered and, as a result,
    readers will recognise that there are many different types of organisational structures
    to consider. Typically, these may comprise a senior executive or suite of C-level
    functional executives, supported by a team of senior managers (often senior vice
    presidents). In a hierarchical approach, there are usually a series of functional
    silos such as back-office operations, lines of business, retail branch operations
    and the like.


    Specific functions within the bank and reflected in its manner of organisation
    may include credit operations, direct banking operations, fraud prevention, loan
    operations, loan servicing, trade operations and support, transaction processing
    and support, business banking, commercial lending, consumer lending, credit cards,
    investment management, mortgage lending, online and mobile banking, treasury and
    cash management and platform operations.29


    How a bank or business organises itself is reliant on its business model. By ‘business
    model’ we mean the way in which it fulfils its objectives, including managing
    and selling its products and/or services, its policies and its processes. Earlier
    the idea of ambidexterity has been considered including the concept that it is
    possible to operate two (or more) apparently conflicting business models within
    the same organisation.30


    According to management expert Peter Drucker, a business model needs to answer
    the following questions:


    +   - Who is your customer?

    +   - What does the customer value?

    +   - How do you deliver value at an appropriate cost?'
