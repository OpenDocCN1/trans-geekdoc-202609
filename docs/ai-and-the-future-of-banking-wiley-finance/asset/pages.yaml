  img_proc: true
- pgno: 248
  md: 'One major issue is that ‘traditional’ lawyers may not be fully aware of technological
    developments, whereas technical security experts may not be fully aware of legal
    issues. This has given rise to a new category of legal advice involving hybrid
    specialists with legal and technical knowledge, rather than a coordinated team
    of legal experts working with cyber security experts. Already a library of case
    studies is emerging that are forming judicial precedents, that is, where judges
    take guidance from previous cases to help make decisions on similar situations.47


    # CONCLUSION


    Cyber security is not only a huge problem for banks but a specialism with a lexicon
    of its own jargon of usage, that is often recognisable but seldom fully understood
    except by experts.


    It is impossible to consider both the future of money and the future of banking
    without recognising the impact of data and analytics, and therefore issues of
    safety and security. Far from these two items being matters of competitive differentiation,
    rather they are hygiene factors. With trustworthiness being close to the top of
    consumer decision making, how can a bank be trustworthy with money if it is not
    trustworthy with data? After all, digital money nowadays may be no more than another
    form of data.


    For that reason and others, including punitive fines for data security lapses,
    banks are increasingly focusing on cyber security and making investments accordingly.
    Some banks are teaming up with universities and research organisations to combat
    the risk, as well as working more collaboratively. New roles are emerging and
    advanced technology will inevitably be a factor in the banking response to this
    problem. It''s a ripe area for Fintech and innovation generally. The complexity
    of the topic, especially as biometrics becomes more mainstream, will force the
    need more urgently for automatic detection and AI-infused assistance.


    The concept of the universal or extended bank as a model for the future has been
    considered earlier on, one that is operating in a more connected world with greater
    alignment to the needs of its customers. Were this model to be ultimately adopted,
    complete with bi-directional data flows, then the risk of security lapses potentially
    increases as the weakest link in the ecosystem becomes the most likely point of
    ingress. That could be in the supply chain or equally likely with a customer or
    consumer.


    The burden of responsibility for data safety rests not only with banks but also
    more specifically with those in the operational ‘firing line’, such as data security
    officers and supplier managers whose skills will need constant updating and refinement.
    Whilst it is unlikely that these experts will ever become CEOs, nevertheless these
    complex and demanding roles will in their own right be likely to command significant
    remuneration.


