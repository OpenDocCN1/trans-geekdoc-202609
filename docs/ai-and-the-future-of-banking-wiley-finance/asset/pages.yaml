    distribution. Also known as ‘heavy tails’, the phenomenon is also seen in physics
    and earth sciences as well as in economics. Black-Scholes is based on a normal
    distribution, but if there is a probabilistic skew, this can lead to distortions
    in the prediction. Therefore, fat tails are viewed to create higher levels of
    risk in terms of the accuracy of the prediction. As to when these fat tails occur,
    it’s suggested that at times of financial catastrophe such as the ‘bursting’ of
