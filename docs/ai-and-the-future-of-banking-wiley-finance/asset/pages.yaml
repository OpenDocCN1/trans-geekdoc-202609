- pgno: 37
  md: 'Perhaps the name of the game is not one of goal setting and reaching objectives
    but rather a combination of:


    +   - Vision setting, which provides stakeholders with some form of mission statement

    +   - Development of competences both at business and personal level

    +   - Organisational rethinking to allow participants to be more agile and responsive
    to the current times


    This sort of relatively radical approach in isolation might be fine if businesses
    are operating in a vacuum or perhaps for a start-up that needs to think on its
    feet. But will be of cold comfort to more established enterprises such as banks,
    which have a duty not only to customers but also to stockholders, and who have
    the shadow of regulation above them.


    There is still a need for banks to have strategic objectives, but the nature of
    these strategic directives is necessarily changing, not only as a result of the
    digital age but of the impact of advanced technologies.¹


    In their 2018 article ‘Six Digital Growth Strategies for Banks’,² McKinsey suggest
    six opportunities for what they describe as ‘navigating the chaos’. These are:


    +   1. Expanding beyond their core business of banking into non-core activities
    such as home services, healthcare, mobile devices and facilities management

    +   2. Creation of a financial supermarket; in other words, a form of cost comparison
    approach

    +   3. Extending the value chain such as the provision of advice beyond that solely
    connected with core banking services

    +   4. Monetising the data or, in other words, using analytics to extract value
    from data they are already holding within their enterprise

    +   5. Becoming a financial factory by renting out their back-office functions
    to other smaller organisations or start-ups, and in doing so, turning a cost centre
    into a profit centre

    +   6. Becoming what McKinsey call a ‘digital attacker’, by employing a digital
    go-to-market approach or new innovative business models, in order to attain market
    share


    They suggest four key action points:


    +   1. Identification of which strategy best aligns to current resources and market
    opportunities

    +   2. The need to prioritise rather than pursue all these opportunities simultaneously

    +   3. The need to understand what organisational structures and governance is
    needed to achieve any of these objectives

    +   4. The need to understand what capabilities are needed to deliver on these
    objectives


    Beyond this, McKinsey also suggest a sense of urgency. For banks, they say, this
    means to attack the market rather than defend it, but this is arguably easier
    said than done. For the largest of the banks there are inevitable political and
    organisational complexities that make rapid change akin to turning the supertanker.
    Smaller banks may'
