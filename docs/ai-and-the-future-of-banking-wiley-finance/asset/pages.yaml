  md: '# Interlock between AI and Open Banking


    Whilst it is increasingly accepted that the future of Open Banking depends on
    the successful implementation of apps and APIs to provide a friction-free transfer
    process, this implies that customers readily want to change their banking provider.
    This is not always the case; many consumers suffer from issues of inertia or lack
    of confidence when contemplating changing their bank, insurer, utilities services
    or other providers.


    Effective use of advanced analytics and, ultimately, AI will become key weapons
    in the battle between banks to identify who are the most desirable customers to
    retain or to attract, and who they might readily pass over in terms of retention
    or acquisition. Incumbent banking providers will have greater visibility in terms
    of those profitable – or future profitable – customers.


    There is a strong feeling that PSD2 will bring a greater amount of information
    to the table that will allow banks to create better services and products for
    customers. One major challenge will be that of gaining insight from what could
    be a deluge of data, and making sense of it to such a degree that it becomes operationally
    useful. Advanced analytics and AI may well prove to be the key that unlocks that
    safe.


    # Blockchain: Setting the Stage


    There is a Blockchain revolution ongoing at the moment, and the banking and financial
    services sector is part of that revolution. Blockchain is often described as a
    ‘distributed ledger’ or set of accounting records (see Figure 9.21), which follow
    the process of:


    +   1. Someone initiates a transaction.

    +   2. The transaction is broadcast to a set of networked P2P computers known
    as nodes.

    +   3. A validation process takes place using complex algorithms.

    +   4. A transaction takes place that may comprise *cryptocurrency* or ‘stable
    coins’, documents, contracts or other records.

    +   5. Once the transaction is completed the transaction forms part of a ledger,
    and in effect creates a new ‘block’ or component of the data. It becomes part
    of the ‘block chain’ and as such it is unalterable and permanent.

    +   6. The transaction is completed.


    In this context, *cryptocurrency* is a currency that has no intrinsic value. It
    cannot be redeemed for gold (although can be bought and sold), has no physical
    presence (existing only on the network), its supply is not determined by a central
    bank and the network that it is operating through is decentralised. The concept
    of the shared or distributed ledger means that the data isn’t held in one place
    but is hosted by (potentially millions) of computers simultaneously and as a result
    is accessible to anyone with the internet and an appropriate password.


    It’s described as having three key pillars:


    +   1. **Decentralisation**: The traditional approach is that information is centralised
    such as in the banking system. The only way that you can get to your money is
    through the central system. It’s suggested that a centralised approach has flaws;
    the main'
