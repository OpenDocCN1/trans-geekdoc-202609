    # BRANDING AND CUSTOMER EXPERIENCE INTERLOCKED


    The financial market is increasingly reflecting the newer generation of spenders.
    ‘Young Money’, established in 2011, was identified as the ‘first British blog
    to help young people understand personal finance’. Their mission as stated appears
    both clear and attractive to the generation it targets.


    ‘All young people’, its website states, ‘should be financially knowledgeable,
    confident and in control of their futures. This is essential for individual, economic
    and social progress. This means promoting real choice and opportunity and moving
    away from a system that drives apathy, unfair sacrifice and learned helplessness’.


    ‘We deserve’, it goes on to say:


    +   - ‘A truthful, fair and informed view of the financial sector

    +   - Policies and regulations which genuinely serve OUR (i.e. their) interests

    +   - Representation at all levels so that we can properly shape our financial
    futures’


    Founder Iona Bain has been described as the UK’s ‘go-to voice’ on young people’s
    money issues. She was ‘Money Blogger of the Year’ at the Santander Financial Journalism
    Award in 2016, and in 2018 was named by the Association for Independent Professionals
    and the Self-Employed (IPSE) as ‘Freelancer of the Year’.¹⁵


    Having control over personal finances is certainly a topic that is attracting
    investors. Whilst the topic of Fintech and start-ups is covered more generally
    elsewhere, one specific company is worth mentioning at this stage: Revolut.


    Revolut started up on the Level 39 financial incubator in London and has already
    attained the status of ‘unicorn’, that is, having a start-up value of more than
    US $1 billion (£740m). Although not a bank when it started, it offers itself as
    an alternative to banks, including app-based current accounts; as well as other
    services, it provides budgeting services that ‘show you exactly where your money
    is going each month, and even let you set up monthly budgets for things like restaurants
    and groceries.’¹⁶


    As an aside, in 2019 Revolut was ‘called out’ for using an ad that highlighted
