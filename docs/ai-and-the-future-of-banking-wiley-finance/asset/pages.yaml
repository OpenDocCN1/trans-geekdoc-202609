- pgno: 61
  md: 'Coupled with this is likely to be the emergence of contextual analytics. Banking
    organisations will become better at knowing and optimising their own performance
    but unless consideration is given to what is happening outside their own organisation
    – for example, amongst their competitors – then these viewpoints are being made
    in a vacuum. The American scientist Alan Kay expressed it succinctly: ‘Context
    is worth 80 IQ points.’¹⁰


    In the cold light of day, two key objectives need to be adopted by bankers:


    +   1. First, outperform direct competitors.

    +   2. Second, achieve the strategic objectives of the organisation.


    To do one and not the other is a job only partly completed. Often (but not always)
    these two key objectives go hand in hand. As some banks focus all the more on
    softer measures of success – for example, engagement with the community or responding
    to social needs – success may increasingly also be measured by consumer sentiment
    and brand recognition as well as by profitability.


    # Extracting Value from Data


    Data in either its structured or unstructured forms does not naturally flow into
    analytic outcomes, which usually take the form of reports, predictions or recommended
    actions, but is dependent on intermediate processes. These exist between the data
    and the analytics, and might generally be known as the ‘plumbing’ of the systems.
    This essential process allows all organisations to extract value or ‘monetise’
    the data. (See Figure 3.7.)


    How this is done in practice is a matter for technical experts, but in simple
    terms the raw data needs to be captured, then brought into the system where it
    is filtered, cleansed and usually stored. Massive volumes of data lend themselves
    to complex sorting systems or ‘landing zones’, most of which have their own language
    and jargon. Often a ‘datamart’ or ‘staging layer’ is created to ensure that an
    analytical outcome can be created relatively quickly. The process by which data
    is moved through the system is referred to as ETL, or ‘extract, transfer, load’.


    There are other alternatives, such as ‘data warehouse appliances’, which provide
    a parallel processing approach and create a modular, scalable, easy-to-manage
    database system. These high-speed solutions allow very rapid computing power by
    providing an alternative to traditional linear processing, and often come with
    prebundled analytical and geospatial capabilities. In effect, this is a ‘plug
    and play’ approach to data and analytics. This serves as a reminder that, in the
    same way as was experienced with the internet in the early days, both organisations
    and individuals are increasingly pressing for computing power in the form of analytics
    to be provided ‘at speed’. It doesn’t seem that long ago that, in a domestic environment,
    for example, connecting to the internet was accompanied by some form of whistling
    and other strange noises down the telephone line.


    Now (at the time of publication) instant 4G connectivity is expected anytime,
    anywhere – within reason – and we are already seeing the first examples of 5G
    with new levels of hyper-delivery. Perhaps in that light, if one level of differentiation'
