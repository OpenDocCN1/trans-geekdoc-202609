  md: 'management and whilst this might be operationally delivered at a local level,
    global organisations may more frequently demand that this is centralised in some
    sort of automated, ‘intelligent’ AI-infused way. Risk managers cannot fail to
    see the risk involved in a lack of control through a devolved model of operation.


    Attitudes to risk management are usually a function or by-product of specific
    events or experiences, as are budget allocation and prioritisation. When risk
    management becomes the zeitgeist of the moment, as will invariably happen at some
    time in the future, then AI will have a significant part to play. In the meantime,
    regtech providers may need to bide their time and hold their nerve. Major incidents
    have yet to happen. Their time is yet to come.


    # CONCLUSION


    In this chapter the issue of banking imperatives has been considered both in terms
    of those which currently exist and those which will be needed in the future. Imperatives
    have been operationally ‘devolved’ to what might be considered as business ‘objectives’,
    but these in themselves might be becoming increasingly irrelevant in favour of
    a more dynamic method of both personal and business measurement of progress.


    This in itself throws up some interesting organisational challenges about how
    personal contribution is measured in a new AI-infused age. Many ‘Personal Development
    Plans’ are objective-based, yet in a more volatile business world traditional
    ‘objective-based’ measures are becoming less relevant and important. Skills and
    knowledge are being replaced by agility and flexibility and this places new pressures
    on banks to effectively measure progress in a different way at a corporate, divisional
    and ultimately individual level. We may be reaching a point where the concept
    of ‘performance management’ needs to be reinvented.


    It’s not just a challenge for banking. As roles and responsibilities increasingly
    change through the uses of automation and AI, operational functions within the
    enterprise are also being both reinvented and redefined. Although they may not
    have yet realised it, the HR professional is being pushed more and more to the
    front line of change, which few are prepared for. There will be an inevitable
    spinoff in terms of performance management, competence-based pay, employment law
    and the like.


    It’s not just a matter of applying today’s banking imperatives and thinking about
    tomorrow’s but of recognising the implication of these changes both on organisations
    and individuals. The revolution towards Banking 4.0 will affect all the stakeholders,
    both back office and front office. There is no hiding place. The new mantra will
    become ‘competences, not objectives’.


    At a strategic level, the notion that banks might need to extend their traditional
    ecosystems into other areas also opens the door to convergence of imperatives.
    At the end of the day, banks, retailers, telecoms providers and healthcare providers
    are dealing with the same end user, the ‘consumer’, albeit in different guises.
    In a truly customer-centric environment, the customer’s needs should come first
    but it’s more complex than that. Effective use of AI could help create some new
    form of ‘balanced scorecard’ for the next millennium, one that not only reflects
    customer needs but also risk and operational effectiveness.'
