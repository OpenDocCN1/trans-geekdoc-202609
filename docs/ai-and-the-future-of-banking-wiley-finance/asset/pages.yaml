  img_proc: true
- pgno: 67
  md: 'Some organisations discuss AI as if it is the imminent future for them, but
    yet struggle to come to terms with even the basic issues of reporting, and having
    a ‘single version of the truth’. Managing the basics effectively remains a key
    component of success, if only to be able to measure progress accurately.


    For many, technology is some sort of ‘black art’ to be implemented by those who
    have their own jargon and language. Those technologists might equally be confused
    by the deep nuances and complexities of the banking industry. Beyond this, the
    generic expression ‘banking industry’ often fails to convey the detailed complexities
    of each sector.


    The future will inevitably reflect a convergence of banking and technical knowledge
    but the skills of both industries will probably mean that there might never be
    such a simple definition of a role as a ‘banking analyst’ in its broadest form.
    Analysts will become specialists in the areas of retail, commercial and investment
    banking (amongst others). There are likely to be some transferable skills but
    the real experts are those with both industry knowledge and the ability to apply
    particular technical applications. Ultimately they are likely to be able to command
    a premium in the employment salary market.


    The perennial challenge remains. Is it easier for a technologist to become a banker,
    or for a banker to become a technologist? It’s a hypothetical question because
    the ability of one profession to fully migrate to another is unlikely, perhaps
    even impossible, but over the passage of time there will be a convergence of skills.
    Those learning about banking in general terms will need to learn about technology;
    those learning about technology may choose to learn about banking as a specialty.
    In the early stages both will deal with the topic only at a relatively high level.
    Specialisation will ultimately be a critical success factor at a personal level,
    but having a general understanding will also be important.


    Ultimately each must face the challenge of whether the role that they have trained
    for will be replaced by automated systems, machine learning and AI. They should
    not be put off from engaging with either industry and should be aware of the changes
    in each. If AI in banking is an express train rumbling down the track, then it’s
    important that those who engage in the topic are passengers on that train rather
    than observers standing on the platform. AI in banking is anything but a spectator
    sport.


