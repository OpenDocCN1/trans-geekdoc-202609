  md: 'Human executives have developed the ability to make informed decisions based
    on limited information, and it is unlikely that this will be readily replicated
    in a data-driven business environment.


    In the article ‘Can Artificial Intelligence Replace Executive Decision Making?’⁹
    the author suggests that ‘there will be a mix of good, bad, and ugly’ as executives
    are relieved of the mundane tasks but may find challenges from ‘automated virtual
    workers’ whose dominant purpose may be to deliver data-driven and therefore logical
    decisions. ‘Ugly’ in this context represents the possible failure of an executive
    of the future to be able to deliver any added value to the decision-making process.


    ‘Mastery’ seems to be a rather different proposition. In his 2008 book, as mentioned
    earlier, Malcolm Gladwell looked at people he described as ‘outliers’, that is,
    those who are extraordinarily proficient in a skill or subject. He suggests that
    by practising 90 minutes per day for 10 years (in other words, having 10,000 hours
    of study in a particular area), one in effect reaches the ‘tipping point’ for
    ‘greatness’.¹⁰


    Others suggest that 10,000 hours isn’t a magic number. Tim Ferris says, ‘I believe
    you can become world class in only 6 months’, a concept he describes as ‘meta
    learning’¹¹ and emphasises quality of learning over quantity. (The idea of becoming
    an expert in any subject and achieving ‘mastery’ in 6 months seems much more attractive
    than in 10 years.)


    The mood is one of more focused learning programmes, which comprise:


    +   1. Feedback loops for continuous assessment to identify weaknesses and areas
    for improvement

    +   2. Deliberate practice of skill subsets where individuals knowingly go beyond
    their current abilities

    +   3. Becoming a teacher on the premise that if you can’t explain it to others
    then you don’t understand it yourself


    # LEADERSHIP IN AN AI-INFUSED AGE


    So what’s the implication in an AI-infused age? Firstly, let’s think about different
    styles of leadership. Styles of leadership seem to align strongly to personality
    type, and one company, Chron, suggests that there are seven leadership ‘types’:¹²


    +   - The autocratic leader adopts a command and control approach, giving orders
    and expecting prompt execution. Company ownership is often an issue. In this case
    the leader pushes his or her employees hard but there is sometimes a price to
    be paid by the leader in terms of employee loyalty and commitment.

    +   - ‘Laissez-faire leadership’ (from the French for ‘do as you will or choose’)
    is very ‘hands off’, unstructured and dependent on the employee to be self-motivated
    and with the right sense of self-imposed direction.

    +   - Transformative leadership is often viewed as being inspirational, where
    the leader has a big vision they can effectively communicate; it is both inspirational
    and charismatic.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   - Hands-on and participation leadership is very collaborative in style
    and application but is sometimes criticised for not being adequately decisive.

    +   - Transactional leadership is driven by process and environment, and is particularly
    ‘results oriented’, such as in a contact centre environment.

    +   - Bureaucratic leadership is driven by discipline, rules and regulations.
    In such a situation, leaders find it hard to inspire or motivate, yet must try
    to get employee engagement and enthusiasm in a very constrained operating environment.

    +   - In situational leadership, the style changes to meet the situation and can
    range from a collaborative approach to one that is overtly directive.


    As we reflect from time to time on our own personal careers, it’s usually possible
    to categorise some of our organisational hierarchy into one or more of the above
    types. Perhaps we flatter some of them as being ‘transactional leaders’ as opposed
    to ‘managers’. After all, what actually is a ‘manager’? The Oxford English Dictionary
    (OED) simply describes a manager as ‘A person responsible for controlling or administering
    an organisation or group of staff’, perhaps without having (or needing to have)
    the apparently critical capabilities of vision, charisma and the rest.


    Does a manager become a ‘transactional’ or ‘bureaucratic’ leader, if ever? At
    the end of the day, perhaps we are just playing with words.


    Is leadership (in all its forms), mastery, management and the rest simply a set
    of semantics? If so, where does that leave the idea of ‘thought leaders’ and ‘futurists’?
    The OED describes a ‘thought leader’ as ‘one whose views on a subject are taken
    to be authoritative and influential’,13 and defines a ‘futurist’ as ‘a person
    who studies the future and makes predictions about it based on current trends’.14


    There seems to be a great deal of ambiguity and doublespeak, so it’s important
    to understand:


    +   - What is the character of the people who open the door to our future?

    +   - Who are our leaders who will translate that vision of the future into practical
    applications?

    +   - Who are the masters of their subjects who can guide us forward without undue
    reliance on technology and jargon?

    +   - Who are those leaders (but could equally be called managers) who will operationally
    implement and deliver these transformations, to budget and to time?


    It’s possible to flirt with, review and revisit existing leadership and management
    theory to our heart’s content. There’s no shortage of information written on management
    and leadership theory and no shortage of courses that time and money can be spent
    on. The really big issue is to what degree (if at all) current management and
    leadership theory is relevant for the new age of AI. Almost all the management
    theory currently in practice was valid for a pre-AI era but we have to ask ourselves
    whether it is still valid not only for today, but especially for tomorrow.


