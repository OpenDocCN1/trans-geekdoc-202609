  md: 'In the banking sector, most of the major banks already have apps that allow
    their retail customers to manage their accounts and make payments, for instance.
    In 2019, UK award-winning National Westminster’s app boasted the following capabilities:⁵


    +   - Android fingerprint login, touch ID and iPhone X FaceID

    +   - Checking of account balance

    +   - Viewing of transaction details

    +   - Personalisation of accounts with nicknames

    +   - Payment of bills to friends or someone new up to £500 (limits apply)

    +   - Making future dated payments

    +   - Registration of travel plans

    +   - Management of 24/7 account alerts

    +   - Messaging


    The use of outstanding apps are one way that so-called challenger banks are especially
    growing their market share. By definition a challenger bank is a ‘relatively small
    retail bank set up with the intention of competing for business with the larger,
    long-established high-street banks’.


    The Money Whisperer website suggest a series of key capabilities that are often
    found with challenger banks, and that are especially attractive to Millennials
    and those born later, such as:


    +   - The ability to ‘lock the card’ through the app and then to unlock it if
    needed. Rather than needing to call the bank to freeze it (and in doing so to
    endure the contact centre experience), self-service ‘locking’ places the customer
    in control.

    +   - The ability to set up an account through the app by scanning passports or
    other agreed ID. The system then requires the user to read a script through a
    video link, thus establishing identity and biometric checks.

    +   - Deeper information provided in a visualised way that identifies spending
    by category, real time data and strong graphics.

    +   - Better budgeting, including the ability to set a budget and track against
    it. It’s a capability that seems to resonate well with Gen Z, who believe they’re
    in control not only of their life but also their finances.

    +   - Paying friends by sending a link rather than payment details.

    +   - Creating ‘pots’ so that customers can save for special events or purchases.
    It’s the electronic way of what used to be done at home with a ‘piggy bank’.⁶


    Typical challenger banks in the UK include Aldermore, Atom Bank, Metro Bank, Monzo,
    Revolut, Starling Bank, Tandem, Tesco Bank and Virgin Money, all of which have
    already received PRA authorisation to act as banks in the UK. Similarly, there
    is no shortage of challenger banks in the US, including organisations such as
    ‘BankMobile’, which describes itself as a digital bank created by an established
    US-based financial services player, Customers Bancorp. According to its co-founder,
    president and chief strategy officer, Luvleen Sidhu, BankMobile is ‘the largest
    digital bank in the'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'US’. She describes it as ‘a hybrid model, a fintech company with a bank charter,
    that is revolutionising and disrupting banking.’⁷


    The tagline of Starling Bank, one of the UK challengers, is ‘Clever banking apps
    . . . putting themselves at the heart of their customer’s financial ecosystem’.
    ‘Banking, but better’ is another of their smooth (and assertive) marketing lines,
    which sets the challenge for traditionalists. The company was only started in
    2014 as a digital, mobile-only bank and has attracted significant investment funding.
    It’s very innovative, with leading Open Banking capabilities and open APIs, which
    allow customers to share their data with other financial product providers.⁸


    Often the measure of success in an app is whether it is ‘clunky’ – that is, whether
    there is a choppiness in its usage, which can be due to systematic errors in its
    development. It’s commonly thought that this clunkiness is often due either to
    the speed of development or as a result of failure to bring in ‘functional testers’
    early enough in the process, by which time the problem becomes both complex and
    usually costly to resolve. Alternatively, it is possible to bring in third-party
    testers, including companies like TestIO, which adopt a crowd testing approach
    to quality assurance and control.⁹


    As we consider Banking of the Future, we should also recognise that poor apps
    are highly likely to influence consumer sentiment. In an environment of social
    media, poor app performance can result in criticism spreading both quickly and
    widely. For an industry mainly based on trust, bearing in mind our changing understanding
    of the meaning of money as explained earlier, there’s a perceived correlation
