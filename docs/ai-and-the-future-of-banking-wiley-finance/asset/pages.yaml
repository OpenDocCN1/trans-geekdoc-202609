  md: '+   - Protect consumers

    +   - Encourage lower prices for payments


    The concept of Open Banking arises principally from a lengthy 700-page report
    from the CMA into the retail banking market. In 2016 it recognised the dominance
    of the major banks both in terms of personal accounts (PCAs) and the structure
    of banking for SMEs. Part 1 of the report considers market conditions in detail,
    while Part 2 introduces a series of remedies to make PCA and SME banking markets
    work better for customers.


    What was described as a ‘remedy package’ in effect comprises foundational measures
    of standardisation, service quality information, customer prompts and three key
    pillars:


    +   1. Current account switching measures, including better governance of switching
    processes and customer access to transactions

    +   2. PCA overdraft measures; alerting, maximum charges

    +   3. Additional banking for small businesses; including SME switching tools
    and loan rate transparency


    Clause 168 of the report states:


    > > We are requiring the largest retail banks in both GB and NI to develop and
    adopt an API banking standard so as to share information to a specified timetable
    and we are requiring it to be an open standard so as to enable it to be widely
    accessible.


    This will enable intermediaries to access information about bank services, prices
    and service quality. Customers who are satisfied about privacy and security safeguards,
    and are willing to give consent, will be able to share their own transaction data
    with trusted intermediaries, which can then offer advice tailored to the individual
    customer.


    The overall aim was for it to be easier for customers to identify the best products
    for their needs, but there are some interesting challenges. The burden almost
    seems to be on the consumer to be the prime mover as far as any change of bank
    is concerned. The consumer has to assume that the provider of the APIs being used
    is meeting minimum standards and has been approved. Regardless of whether the
    vetting process is adequate, cynical consumers will be wary of previous poorly
    delivered, government-initiated IT schemes such as the failed NHS patient record
    scheme described as the ‘biggest IT failure ever seen,’ said to have cost £10
    billion and ultimately abandoned.⁴


    Some experts believe that the concept of Open Banking (OB) is most probably a
    slow burner. It is highly political in nature, and major banks inevitably are
    reluctant to encourage processes that could lead to loss of customers and revenue.
    Others suggest that whilst OB may not be a destination in itself, it may nevertheless
    provide some sort of a catalyst for new collaborations and partnerships. EY’s
    report suggests, ‘81 per cent of UK fintech firms surveyed are getting ready for
    Open Banking, while 29 per cent of respondents said they were already fully prepared’.⁵'
