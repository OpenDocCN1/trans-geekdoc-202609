  md: 'which often compensates by creating new ‘innovation-oriented’ roles such as
    the following.


    **Head of Innovation:** This role seeks to ensure that all ideas are managed with
    innovation in mind, which is usually the coordination and management of internal
    brainstorming and of ‘new thinking’. This is especially important with a complex
    organisation, which might operate in silos, or an international organisation where
    different territories might have different ideas. Once an idea has reached a certain
    level of maturity – which might involve it having being beta-tested – then it
    may be taken back to product leaders and designers for further input and refinement.


    **Head of Product:** Having agreed on the innovation, the duty of the product
    manager is in effect to set it up and get it off the ground. This may involve
    a mixture of marketing, training, clarifying the value proposition and other various
    support services.


    There are other job roles, such as brand and innovation manager (cultivating some
    new thinking that will enable investment to flow), innovation consultant, chief
    innovation officer, business model designer, cluster director of operational innovation,
    digital and innovation practice strategist and others. These roles not only serve
    to provide focus within the organisation for innovation but help create methodologies
    for implementing self-grown ideas.


    # Bootcamps, Hackathons, Innovation Labs, and Other Devices


    Some of the ‘mechanisms’ through which innovation happens, especially within the
    organisation, include techniques such as bootcamps and hackathons.


    **Innovation Bootcamps:** In essence these comprise teams formed from different
    areas of the business. The bootcamps are usually done off site and kick off with
    presentations around a particular theme so that the innovation teams are educated.
    Part of this education is to ensure that the team are aware of market conditions
    so that any innovations are timely and appropriate to customer need, which may
    vary from geography to geography. Each team then is allocated an executive sponsor
    and are tasked to go away and come up with an individual innovation, which may
    comprise a product, solution or service. At the end of an agreed period, normally
    4 or 6 weeks, each team makes a presentation and the most successful is developed
    into a fully fledged solution.


    **24 Hour Hackathons:** Much the same as the above but much more intense, especially
    because the participants get little or no sleep.


    **Device-Centric Innovation:** Whilst much of the focus of innovation appears
    to be technologically led, new ideas may not in their own right be confined just
    to new technological thinking. They might also relate to how different but complementary
    capabilities and offerings might be bundled together. With much of the thinking
    being concentrated on the IoT and interconnected devices, their impact on business
    models needs to be considered, as well as issues such as risk, liabilities and
    cyber security.


    How intercommunication is undertaken is becoming more important than ever. Whilst
    insurers appear perhaps more focused on the development of'
