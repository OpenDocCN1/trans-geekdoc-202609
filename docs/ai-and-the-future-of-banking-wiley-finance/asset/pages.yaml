    In FOREX (Foreign Exchange) trading, broader economic indicators such as GDP and
    employment rates might also be key factors, as might public and social media.
    The use of wealth management systems means that inexperienced traders (and some
    experienced ones as well) can let more experienced investors make decisions and
    follow them. What value does the inexperienced trader bring in these circumstances?


    Social media or social trading may increasingly play a part in wealth management.
    Social trading is similar to ‘copy trading’ and ‘mirror trading’. Copy trading
    connects the portfolio of the user to that of the expert, and can be done automatically.
    Mirror trading is a method used in FOREX trading similar to copy trading.26


    There is no shortage of advice available for those who wish to use automated wealth
    management sites. Suggested benefits of these systems, especially social trading,
    include:


    +   - Greater accessibility

    +   - Ease of usage

    +   - Lower costs

    +   - Lower minimum investment

    +   - Reduction in learning curve of usage

    +   - Ability to learn to trade in a risk-free sandbox


    There is concern that whilst wealth apps and robo-advisors might have benefit
    in a bull market, traditional wealth and investment managers suggest that they
    specifically add value in a bear market where there is considerable uncertainty
    and where customers need more ‘hand holding’, or where a customer has particular
    needs such as tax management. Increasingly there is a move towards investment
    managers having ‘multi-distribution channels.’27


    One particular area of interest in the topic of robotic control is that of chatbox
    wealth advisors. These are typically available through social media and mobile
    devices, and which with permission can delve into a customer’s financial situation
    and make recommendations. If the customer is happy, then investments are made
    on their behalf. To do this accurately, the chatbot needs access to the customer’s
    account, usually on a read-only basis so that it cannot gain direct access to
    any transaction authorities. Principally these are e-wallets, usually with a banking
    backer, but not normally covered by financial compensation schemes (i.e. in the
