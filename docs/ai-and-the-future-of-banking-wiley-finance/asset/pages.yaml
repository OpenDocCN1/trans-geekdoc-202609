  md: 'Bank lending therefore creates money. At the same time, more or less, money
    is also created by central banks to support and facilitate this creation of private
    money.


    Money is constantly moving around in a massive accounting exercise. Let’s look
    at the situation regarding a ‘simple’ ATM (automated teller machine) or ‘cash
    point machine’, typically one embedded into the wall of a store or on a street
    corner. When physical cash is taken from the machine, the customer’s account balance
    is reduced by the bank, and the physical money is handed over. Because of this,
    the balance sheet of the bank gets smaller as it loses both an asset (which is
    the ‘cash’), and also loses a liability (the bank deposits). Customers can only
    withdraw money if they have a positive balance of demand deposits or an agreed
    arrangement such as an overdraft. This means that before any payment can be made,
    a bank needs to have created ‘money deposits’, which are in effect legal obligations
    by the bank to the depositor who has transferred legal title to the cash. The
    cash becomes an asset to the bank, but also a liability to the bank as well. It’s
    only in this rather convoluted way that anyone can obtain physical cash from the
    ATM.¹³


    Almost as a ‘sublayer’ in the process, the central banks hold money reserves that
    act as the final settlement between banks and other financial institutions. Also,
    when households and businesses make payments between each other, processes such
    as BACS in the UK, for example (previously known as ‘Bankers Automated Clearing
    Services’), queue these payments and calculate the net differences of the payment
    flows in each direction. Then at the end of the clearing cycle, the net difference
    is transferred from one bank to another.¹⁴


    Whilst the notion of banks creating money might sound to be a modern concept,
    its background is not a new idea. The Romans had a well-developed banking system,
    but there is more knowledge of the Italian Renaissance cities and later in Amsterdam
    and elsewhere in Northern Europe. People wanted a place where their coins could
    be kept in reasonable safety and the best bankers were the goldsmiths: the profession
    that seemed to have the strongest strongboxes. Bankers discovered that they could
    also lend this money to someone else and earn interest. Usually the borrower was
    given hard money or a deposit that they could draw on, but more often than not
    was given a piece of paper certifying that the borrower had money ‘on deposit’
    at the bank. They were able to pass on this piece of paper for a purchase, in
    a form still recognizable today.


    The original saver still had money in the bank, and the borrower now had a piece
    of paper that also represented that they had money in the bank by way of a deposit.
    In reality it was the same money but it had in effect doubled. To that extent
    the bank had ‘created’ money or capital, and so it has been ever since. Creating
    an overdraft or credit loan on a plastic card has the same effect, which is one
    of ‘creating money’, as has the idea of providing finance for any new purchase
    such as a car or home.¹⁵


