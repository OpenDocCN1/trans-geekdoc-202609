  md: 'Regulatory change and deregulation have allowed ‘challenger banks’ to be able
    to enter the market through an easier process.⁷


    Some suggest that there is also a massive ‘shadow banking’ system, which comprises
    finance companies, structured investment entities, securities lenders and others.
    These perform similar functions to banks but are not regulated in the same way
    and don’t have the protection of central bank support or government deposit insurance.⁸


    The traditional role of many banks as intermediaries (between savers and depositors)
    is thought by some – for example, Susan Strange in her book *Casino Capitalism*
    (1986)⁹ – to be on the decline and that they are increasingly focusing on ‘creating,
    buying and selling credit money’ through innovation and the use of so-called ‘money
    substitutes’. This, she suggests, is leading to them increasingly operating beyond
    the reach of central banks and governments. Money substitutes are described as
    highly tradable commodities as an alternative to ‘paper money’, such as ‘token
    coins’ or even a credit card. Strange suggests that the develop of ‘money substitutes’
    encourages the ‘imprudent expansion of credit with increased profit to the banks
    but increased risk to the system of financial panic and collapse’, and even gives
    this notion a name: ‘overbanking’.


    Susan Strange also warns that through credit cards, the individual consumer is
    at risk of overspending to the point that the debts incurred may not be recoverable
    by the bank. In the UK, for example, more people are likely to hold a debit card
    (51m) than a credit card (32m), but those holding credit cards are likely to spend
    higher than debit card holders, as much as 39% more. According to UK figures,
    credit card write-offs were as much as £3.1 Bn per month in 2010, although in
    more recent times has ‘settled down’ to a more reasonable £1.6 Bn per month. Such
    write-offs might be considered to be *dead money*.¹⁰


    It almost seems as the banks encourage overspending beyond the means of their
    customers by passing the burden of repayment of credit card and loan debt onto
    a relatively uninformed public. This is made worse by the complexity of the banking
    industry and the jargon that describes its activities. No wonder that the general
    public are mistrustful of the banking industry. The topic of ‘trust’ underpins
    not only the concept of banking but the concept of money itself. Georg Simmel,
    author of *The Philosophy of Money* in 1874, refers to money as being a form of
    ‘socialized debt’ in which money is expected to be used to settle debts as it
    is part of a wider ‘social community’.¹¹


    It’s inevitable that we have to ask ourselves, ‘what is a bank?’ in today’s terms.
    And in looking for that answer, what therefore might a ‘future bank’ look like?
    The banking sector has far more complexity than it seems at face value, and our
    views of the future of banking might be mainly limited to our own personal expectation
    of what a future bank on the High Street might look like, even after a little
    cosmetic ‘polishing’.


    More importantly, the question of what a future bank is like starts to address
    a deeper complexity, one that is linked to the concept of increased ‘financialisation’
    – a broad term that embraces multiple the idea of *financial instruments* – or
    more simply, how will we deal with and ultimately manage our money across our
    entire financial ecosystem?


    Increasingly we are forced to consider the concept of ‘Banking 4.0’ (see Figure
    1.2), that is, banking for the Era of Data in what is often described as the Fourth
    Industrial Revolution.'
