    Beyond this, the report suggests several approaches to AI transformation, which
    in effect is an integrated programme of activities comprising a series of key
    projects. These include:


    +   - Creation of a ‘governing coalition’ of AI, technology and business teams
    to ensure a common view

    +   - Forming of assignment-based execution teams focussing on key business issues

    +   - Implementing an education policy that requires leadership to be an effective
    role model, and effective two-way communication

    +   - Accountability in key deliverables, coupled with effective tracking of progress
    using performance analytics

    +   - Appropriate incentives, especially around career progression for successful
    contributors


    # Innovation or Adaptation?


    For many organisations, whilst creating an enterprise-wide programme of AI change
    might be desirable, in practical terms this may be more difficult. The expense
    and risk of change is such that only incremental steps might be possible, and
    only then after proven demonstration of key deliverables. To overcome internal
    barriers such as cultural resistance, some organisations still choose to effect
    a quasi-innovative approach by integrating new technology into their current workflows.
    This avoids radical change but gradually introduces new ideas and learning in
    a safer way.


    In many ways this goes against the mantra of new technology simply digitising
    existing analogue processes but at the same time it’s important that a more conservative
    option is also on the table for organisations less able to act radically. Business
    transformation specialists Futurion say that successful implementation can be
    done by:


    +   - Using outside resources to reduce the implementation cycle

    +   - Minimising approval cycles and make them both agile and speedy

    +   - Employing agile process development methods'
