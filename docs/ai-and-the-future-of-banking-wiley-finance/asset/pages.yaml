  md: 'An obvious question to ask perhaps at this stage is that of ‘How does AI actually
    work?’ In the spirit of trying to give a simple answer to a complex question,
    there appear to be two main approaches to AI:


    +   (a) The first is an ‘algorithm-based’ approach, which comprises a series of
    capabilities found in advanced analytics, such as behaviour trees and statistical
    approaches, which are in effect stitched together to solve a particular problem
    or achieve a desired effect. This approach is often found in computational models
    designed to respond to a specific issue such as voice or text analysis.

    +   (b) The second is that of a machine learning approach (artificial neural networks)
    which mimic the way that the human brain works.


    In its broadest sense, one view of an AI ‘ecosystem’ is that it comprises four
    key elements:


    +   1. The ability to apply advanced data mining techniques

    +   2. The ability to apply expert systems

    +   3. The ability to ‘reverse engineer’ the human brain, and in doing so replicate
    how it works

    +   4. The ability to satisfy the so-called ‘Turing Test’, which is used to establish
    whether a user is interacting with a human or a machine.


    At this stage in the development of systems, there is evidence of cognitive systems
    but limited ‘true’ experience of pure AI. That is, where end users interface with
    a system in an intelligent way but fail to recognise that it is a machine. However,
    that time will definitely come within a generation and most probably sooner. The
    distinction between cognitive analytics and AI is best measured by the degree
    of human intervention or ratification of the process. Where an intelligent system
    has a 90% success rate in its decision-making capability but still requires human
    intervention to manage the 10% balance, this is often called ‘weak AI’.


    The fact that there appear to be so many AI-described apps emerging from so many
    start-ups is arguably a feat of ‘marketing over mastery’, in that new entrants
    are invariably tempted to exaggerate their AI capability in order to gain attention
    and investment.


    Whilst this chapter predominantly focusses on machine learning and apps, it may
    be useful to recognise what might be called a hierarchy of AI requirements to
    effectively implement an advanced system. These are considered in Chapter 10 under
    the broader topic of implementation, and represented in Figure 10.25.


    # THEORY AND PRACTICE OF MACHINE LEARNING


    A proportion of this book has focussed on what we mean by both money and banking,
    partly to allow those with a technological focus to understand the issues of this
    particular market or segment. It is as difficult for a technologist to become
    a banker as it is for a banker to become a technologist. Yet if we accept that
    there is an inevitable convergence'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'between banking and technology then there is a requirement of an understanding
    of both disciplines.


    The point of convergence is unclear. Bryan Moynihan, chairman and chief executive
    of Bank of America, is considered to have changed that organisation designated
    the number two US bank into ‘a technology company that happens to be a bank’.³


    Moynihan might well be called a ‘digital banker’, meaning someone who not only
    understands the issues of both banking and technology but someone who can operationalise
    these capabilities and start to build strategies around them. It is not an easy
    journey. Although some suggest that the bank of the future will be a combination
    of both sets of skills in a converged team (and they are probably right in the
    short term), the true future of banking rests with a new profession of hybrid
    banking and tech/ analytical skills.


    It isn’t likely to be an easy journey for those who will be successful. It was
    suggested that as much as 80% of routine functions would be automated, and that
    there would be many fewer people in the banking workforce. Those who remain will
    require exceptional competences and capabilities, but on the up side their rewards
    are likely to be phenomenal. What does it require for a banker to understand AI
    and machine learning?


    A recent accelerated learning AI course⁴ by a London-based Level 39 start-up Thalesians
    is aimed at post-grad-, Master’s- and PhD-level applicants, and suggests as a
    minimum requirement not only an understanding but the ability to apply the skills
    outlined in Table 2.


    With a focus on finance, economics and engineering, Thalesians specifically focus
    on *time series data*, which they describe as sequences of ‘timestamped updates,
    arriving in chronological order, on the state of a particular process evolving
    over time’. They claim the creation of a new science built on the foundation of
    quantitative finance, algorithmic trading, high-frequency trading and markets
    microstructure, machine learning (ML), deep learning (DL), deep reinforcement
    learning (DRL), AI, reactive programming, and big data, which they call *neocybernetics*.


    # APPS AND THEIR USAGE


    This section considers the more typical types of app. As a ‘level set’ it might
    help to remind ourselves that ‘app’ is shorthand for ‘application’ and by this
    we mean a form of computer program or software that has usually been created with
    a specific task in mind. Many companies make their software easy to access by
    having an icon on the screen of a smartphone, which can be tapped or clicked.
    Some devices already come with preloaded apps.


    At the heart of this issue is that of identification and authentication, which
    for many consumers is still confined to pin numbers and pass codes, although two-stage
    authentication for some payments is becoming popular. Figure 5.12 takes into account
    current and imminent identification practices as mentioned below, and starts to
    anticipate authentication solutions at some time in the future. It foresees a
    future beyond iris and palm identification (covered later), but one that might
    even be non-physical in nature.'
