    # The Full-Service Bank


    Earlier in this chapter we explored the concept of the universal bank, that is,
    one that provides a wide range of services. Chapter 6 also considered the importance
    of brand to the banking industry and how this will impact on consumer loyalty,
    especially amongst Millennials and Gen Zers. Figure 8.17 extends this concept
    to a ‘full-service financial institution’, which takes account of all their customers’
    lifestyle requirements, as well as their financial management needs.


    In the same way that auto manufacturers create finance propositions by having
    partnership relations with banks to allow cars to be both financed and purchased,
    this alternative model of ‘extended universal banks’ allows them to provide things
    like mobility solutions, which might extend to road, rail or aircraft capabilities.
    In other words, the consumer of the future may buy an aircraft ticket through
    their bank as opposed to just using the bank’s payment system. The buying leverage
    of the major banks will mean that preferential terms can be obtained for customers,
    better than those available on aggregator sites. Similarly, providers of vehicles
    or indeed any significant commodity will be able to leverage the bank’s own customer
    base as a form of distribution channel.


    In terms of the customer journey, in this model the customer will have a lifetime
    relationship with the bank as their ‘trusted partner’. Salaries, savings, pensions,
    investments and loans will all rest in one banking organisation. Banks will not
    only understand the life cycle of their customer but help them to plan for it,
    both whilst in work and afterwards. This model stretches the concept of the universal
