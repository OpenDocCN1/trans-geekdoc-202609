  md: '# Cybercrime and IT Resilience


    # SUMMARY


    When considering the impact of advanced analytics and AI for banking, it would
    be incomplete to omit the issue of cybercrime and IT resilience as an area of
    interest. In the context of the Bank of the Future, there is an essential requirement
    of trust and security. Therefore, it’s necessary to recognise the increased risk
    and impact of cybercrime on the banking system.


    The harsh reality is that if the banking industry, based on trust and increasingly
    based on digital transactions, can’t get this aspect of its operation right, then
    customer confidence will at best be eroded and at worst could be lost entirely.
    This section aims to give greater understanding of the nature of cybercrime at
    both a general and banking specific level, and how banks (by way of example) need
    to prepare themselves for both the present and the future. This includes topics
    such as cyber security toolkits and the emergence and importance of new roles.


    With fraud being one of the key areas of concern, the use of analytics and AI
    is also considered in this particular context. Finally, the chapter closes with
    some insights into issues of cyber law.


    # CitiBank and Mastercard Both Focus on Fraud Using AI


    CitiBank have made numerous investments in AI firms, with particular attention
    given to eSecurity and cybersecurity. For example, one acquisition, Feedzai, monitors
    customer payment behaviour for anomalies.¹


    Mastercard has agreed to acquire Ethoca, a provider of technology solutions that
    help merchants and card issuers collaborate in real time to quickly identify and
    resolve fraud in digital commerce. Mastercard intends to further scale these capabilities
    and combine Ethoca with its current security activities, data insights and artificial
    intelligence solutions.²'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# INTRODUCTION


    Cybercrime is already being described as the ‘New Frontier’ in terms of the threat
    landscape. The International Standards Organization’s ISO 27k series on IT risk
    already includes a cyber security component, specifically under clause ISO/IEC
    27032, which defines cybercrime as: ‘Preservation of confidentiality, integrity
    and availability of information in the Cyberspace.’ (The ISO 27k suite comprises
    almost 70 standards, about fifty of which have been published so far, covering
    information risk and security management.)³


    ‘Cyberspace’ itself is defined as: ‘the complex environment resulting from the
    interaction of people, software and services on the internet by means of technology
    devices and networks connected to it, and which does not exist in any physical
    form.’⁴


    A cyberattack is a deliberate attempt to disrupt computer systems or networks
    or to infiltrate codes. Its consequences are to disrupt processes, compromise
    data and infiltrate information sources leading to identity theft. Cyberattack
    may comprise multiple forms, such as:


    +   - Gaining or attempting to gain unauthorised access to a computer system or
    its data

    +   - Disruption or denial of service attacks (known by the acronym DDoS), often
    requesting ransom

    +   - Hacking a website or mal-facing a site by applying a false facing page

    +   - Virus or malware installation leading to disruption of systems and processes

    +   - Inappropriate use of computers or applications by employees of a company
    in a way that it harms the company. This may extend to physical theft of data
    by downloading information onto disk drives.⁵


    It’s a major problem that banks are already familiar with. In the UK, the Financial
    Conduct Authority (FCA), together with the Competition and Markets Authority (CMA),
    invites banks to voluntarily publish information about the number of IT shutdowns
    that they have made because of cyber intrusion and other technical issues.⁶ According
    to information provided, most of the major UK banks suffer one IT-related outage
    per month, although these are often linked to IT modifications rather than directly
    to cybercrime.⁷


    ‘UK Finance’ – the collective body for 250 UK-based banks – provide a single voice
    for a competitive and diverse industry and cover issues such as financial risk
    and economic crime. They recently commented that its members are currently investing
    ‘billions of pounds’ in ensuring IT and human systems were ‘robust and secure’,
    making the point that ‘Operational resilience is crucial in a modern financial
    system and is a key priority for the industry’.⁸


    But it’s a continuing worry. The chair of the UK Treasury Committee, which has
    an ongoing inquiry into IT failures in the financial sector, said, ‘IT failures
    at banks are a regular occurrence. . . . These failures now seem to have an air
    of inevitability’. Although their findings (at the time of writing) have yet to
    be published, the committee are also considering issues such as:


    +   - The frequency of operational incidents and how this might change as consumers
    and firms rely more heavily on technology

    +   - The most common causes of operational incidents'
