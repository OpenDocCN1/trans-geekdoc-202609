  md: 'Another key element is that of risk assessment, typically to help individuals
    or organisations understand their propensity for risk and ensure that suitable
    investments are made that align to that assessment. Risk attitude is often considered
    to be linked more to behavioural attributes than to financial status. AI is seen
    as a better method of measuring this but incorporating societal, behavioural and
    attitudinal factors, and it may be that many of the same metrics used in 360-degree
    customer assessment (Chapter 4) might also be reused. There are also broader issues
    to consider from other sectors when evaluating risk. The judicial system has previously
    attempted to use algorithms to predict the likelihood of offenders becoming repeat
    offenders but apparently with limited success, so there needs to be a degree of
    prudence in using analytics to assess the risk appetite of individuals.


    Finally, in considering risk assessment, banks should recognise that an individual’s
    risk appetite can change over time, and this might influence their investment
    appetite. Currently risk assessment seems relatively static as a process yet human
    behaviours and attitudes are dynamic in nature. The future of wealth management
    may well be a much more dynamic model than currently exists.


    # THE BIOMETRIC MORAL ARGUMENT


    At face value, it seems that biometrics must have a critical part to play in the
    banking industry. Although this book is about AI and banking, access to the banking
    system is a critical component. In other words, the future of AI in banking will
    be biometrically infused.


    Potential applications for the sector include:²⁹


    +   - Branch banking where visiting customers can be authenticated at the counter
    by iris, fingerprint or palm scanners, or a combination of any or all of these

    +   - ATM authentication through fingerprint scanners

    +   - Multifactor biometrics, namely voice and location, for example, for internet
    banking and more substantial transactions

    +   - Use of biometrics such as voice or facial recognition for mobile banking


    Some European corporate organisations already use biometrics to allow their employees
    to gain access to the premises. To what degree might we as individuals have different
    personal ‘rules’ relative to our access to the workplace, compared to access to
    our personal bank account?


    The challenge overall then is that of how quickly this might be taken on board
    by the consumer. There are market maturity issues to contend with. Biometrics
    experts M2Sys reported:


    > Many banks worldwide are already using biometrics with their banking systems
    to authenticate employees and customers and among all banks utilizing biometrics,
    52% are located in Asia.


    > Japan has more than an estimated 15 million customers using biometric authentication
    for banking transactions.'
