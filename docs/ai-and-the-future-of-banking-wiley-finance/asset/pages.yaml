  md: '# AI Leadership and Employee Transformation


    # SUMMARY


    This chapter will consider the complex and enabling elements of leadership and
    employee transformation, which start to unlock the secrets of successful innovation
    and implementation, covering issues such as power, mastery, servitude and freedom
    and how they relate to an AI-infused working environment.


    The topics of leadership and employee transformation in a digitally transformed
    or AI-infused world might be at face value relatively generic, and there are certain
    consistent trends that follow through. As these trends are considered, a deeper
    dive will be provided, specifically in the context of the banking industry.


    The chapter will look not only at new leadership approaches in an era of AI, but
    consider training and psychological approaches.


    Finally, it will offer some views regarding not only leadership evolution but
    employee evolution, tentatively providing a picture of a banking employee in thirty
    years’ time.


    # British Bank Improves In-House AI Capabilities


    British bank NatWest is looking to leverage AI across its business by building
    an in-house AI team. The team have already identified a use for AI in scanning
    incoming communications to pick out key topics, and use smarter routing.¹


    # INTRODUCTION


    In an earlier book by this author² that looks at the future of work especially
    in the context of AI, the concept of work was considered and why it is so important.
    If we understand the notion of working, then it’s possible to better understand
    the notion of leadership.


    Nearly all of us want to be or imagine ourselves to be ‘leaders’. To do otherwise
    characterises us as ‘followers’ or commercial ‘serfs’ whose roles are to dutifully
    fulfil'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'the tasks allocated to us by others, even if we have some degree of control
    over our affairs. The expression ‘serf’ has its origins in the notion of slavery,
    which in turn is derived from the Roman for slave (servus). The conditions for
    a slave in Roman times depended entirely on the disposition of the master, who
    might be cruel, kind or indifferent. The Roman writer Columella wrote about the
    treatment of slaves, recommending the stick as well as the carrot, and amongst
    Romans at that time there was a general consensus about the virtues and financial
    benefits of a balanced approach to servitude.


    The flip side of slavery is that of ‘freedom’, which the ancient Greeks recognised
    as they consulted the Pythia, who was the priestess at the temple known as the
    Oracle in Delphi. On the walls of the temple were defined the four elements of
    freedom:


    +   1. Representation in legal matters

    +   2. Freedom from arrest and seizure

    +   3. The right to do as one wished

    +   4. The right to go where one wished


    Two thousand years later, US President Franklin D Roosevelt spoke in 1941 of a
    world founded on four freedoms:


    +   1. Freedom of speech and expression

    +   2. Freedom of worship

    +   3. Freedom from want

    +   4. Freedom from fear


    The notions of slavery and freedom might seem to depend on our place in what is
    a hierarchical structure, whereas Marx suggested in his Communist Manifesto that
    it is somehow linked to the struggle between classes and hierarchy. Issues of
    ‘power’ also play a part in that equation.


    What are the alignments between power, mastery, and leadership in the modern and
    future worlds? We define:


    +   - ‘Power’ as ‘the ability or capacity to do something or act in a particular
    way’ or ‘the capacity or ability to direct or influence the behaviour of others
    or the course of events’.³

    +   - ‘Mastery’ as ‘control or superiority over someone or something’⁴

    +   - ‘Leadership’ as ‘the action of leading a group of people or an an organization’
    from ‘to lead’, which is to ‘be in charge or command of’, or to ‘organise and
    direct’, or ‘set (a process) in motion’.⁵


    It all feels quite nuanced. Here are three words all with subtle characteristics
    or meanings. They all seem to link back to five or perhaps six traits,⁶ which
    are in some areas interlinked:


    +   1. Knowledge where individuals are ‘knowledge masters’ and have insights that
    others do not

    +   2. Charismatic influence, which comprises the power of charm and personality

    +   3. Money or financial control, which allows an individual to direct (or withhold)
    funds and therefore facilitate or block certain activities'
