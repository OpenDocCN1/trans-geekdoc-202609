    The inevitable question is, what might an Apple, Facebook or Amazon banking proposition
    look like, especially from a customer experience point of view? Let’s read dress
    the question of ‘brand’ again, from a user’s point of view.


    # Millennial and Gen Y Brand Expectations from Bank Brands


    In considering the importance of brand in the future, it’s important to give more
    attention to the nature of the customers whom current and future brands will be
    addressing, and to get inside their minds.


    As a level-set we describe Millennials (sometimes known as Gen Y, following Gen
    X and preceding Gen Z) as being that group born from the 1980s through to the
    mid-1990s and reaching adulthood in the early twenty-first century. Although there
    is considerable divergence by location, economic and social conditions, they are
    generally characterised by their increased use of and familiarity with technology.
    Known as ‘digital natives’, they have been brought up with technology as opposed
    to those who have been introduced to the topic in later life (and who are known
    as ‘digital immigrants’). Both expressions were first coined in 1996 in the ‘Declaration
    of the Independence of Cyberspace,’8 which was in effect a rebuttal that organised
    government did not have a mandate to manage the laws of cyberspace (aka the internet)
    as the internet was developing its own rules or ‘social contract’.'
