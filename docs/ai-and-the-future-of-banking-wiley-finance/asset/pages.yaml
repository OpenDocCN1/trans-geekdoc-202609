    # Acquisition Management:


    This term can be slightly ambiguous in that it might relate to ‘customer acquisition’
    (i.e. growth of a profitable customer base), which may in effect be a form of
    sales, marketing or account management function. Increasingly customer acquisition
    is being digitally driven and practitioners in this area increasingly need to
    be not only marketing experts but must also be technically competent in the use
    of CRM (customer relationship management) and other relevant software.


    Alternatively, the expression ‘acquisition management’ may also relate to the
    acquisition or merging of one bank with another. The probability is that nearly
    every mid-sized bank is looking to acquire or be acquired and it is critical that
    any ‘fit’ is both appropriate and timely. Mergers and acquisitions occur to fill
    operational gaps, allow rapid expansion or to achieve economies of scale. But
    it is often more than just about ‘numbers’. Effective acquisition requires effective
    consideration of operational alignment, shared visions and matching of cultures.
    In an increasingly technology-driven business environment, it also requires alignment
    of operating platforms, which may not be easily undertaken. In a risk-averse industry,
    the potential for problems in merger and acquisition activities invariably remains
    for operational, systematic or procedural failures (which we also describe by
    the umbrella expression of ‘operational risk’; see Chapter 4).


    # HR and Corporate Services:


    As with all organisations, HR (human resources) and corporate services underpin
    the effective running of the banking business. Perhaps once thought of as the
    ‘employee’s friend’, increasingly the HR function has taken on the mantle of dealing
    not only with recruitment, staff retention and development (aka ‘talent management’)
    but also the legal interpreter and implementer of the employment contract. Increasingly
    advanced analytics and AI systems are being used as primary tools in the recruitment
    process, especially relating to selection of candidates.


    In more recent times, one particular demand of the HR function has been to try
    and restore the integrity of a banking industry that had suffered from lost trust,
    especially in the last decade. Employee behaviour, which was often ‘coin-operated’
    or commission-driven, has been forced to change and HR is often seen as the ultimate
    custodian of that cultural shift, which in many cases has led to a loss of people
    from the sector.


    Specifically in the banking and financial services sector, the new regime of compliance
    coupled with technological change has also placed increased pressure on the HR
    function. Going forward, as work roles and functions inevitably change as a result
    of the infusion of technology into operational processes, the likelihood is that
    the HR function will itself increase in complexity. In summary, a profession once
    thought of as being based on ‘soft skills’ is increasingly becoming the vanguard
