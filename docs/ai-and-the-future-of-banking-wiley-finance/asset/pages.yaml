    # A New Approach to Leadership: ‘Trust but Verify’


    If the approach is taken of intelligent systems potentially modelling the options,
    carrying out the evaluation and ultimately potentially implementing the optimum
    solution (however this is measured), confidence in decision-making starts to move
    away from individual decision-making regardless of seniority but to the data and
    the model.


    At what point might an individual stand up and say, ‘I hear (or see) what the
    model is telling us but it doesn’t reconcile with my own experience’? The mantra
    needs to be ‘Trust but Verify’. In their report of the same name, ‘Trust but Verify’,
    SiliconAngle describe a process they call ‘financial aid levering’.


    This is where algorithms are used to identify students who ‘nearly’ have enough
    money for further education and then direct funds towards them to enable them
    to successfully complete their courses. (In doing so, they also identified ‘machine
