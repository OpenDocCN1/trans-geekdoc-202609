- pgno: 31
  md: '‘Many of the roles and job titles of tomorrow are unknown to us today,’ says
    Josh Bottomley, global head of digital, retail banking and wealth management at
    HSBC. ‘One thing is certain, however: artificial intelligence will not replace
    human intelligence. Blending the best technology with the power of people will
    be the difference between good and great when it comes to customer experience.’³⁰


    It’s an interesting viewpoint but not one that everybody might subscribe to, yet
    he may be right at least in the short term.


    HSBC specifically identified five digital jobs for the future:


    +   1. **Mixed Reality Experience Designer**: A role that helps augment the real
    world with digital data to give 3-D augmented reality experiences in design, branding
    and user experience.

    +   2. **Algorithmic Mechanic**: As industry moves to a ‘no-code’ environment,
    with interaction with systems being increasingly based on natural language, the
    *algorithmic mechanic* is someone who continually fine-tunes the algorithms for
    optimum performance.

    +   3. **Conversational Interface Designer**: In other words, a chatbot designer
    but whose skills are in creative, linguistic, and anthropological elements (i.e.
    relating to the study of mankind).

    +   4. **Universal Services Advisor**: Highly skilled customer service advisor
    who can switch between real and virtual customer interfaces.

    +   5. **Digital Process Engineer**: As it’s being increasingly recognised that
    the future won’t be about digitalising existing processes but rather about creating
    new platform-orientated ecosystems, this type of role fine-tunes new processes
    for efficiency and friction-free operation.

    +   6. **Partnership Gateway Enabler**: This role manages the interface between
    the participants or ‘actors’ in banks’ future virtual enterprise, especially in
    respect of bilateral data flow and security issues.


    It’s an interesting list, and perhaps might have been created for provocation
    rather than reality, especially as it has a feel of random title generation to
    it. For ‘random title generation’, think in terms of putting a handful of tech
    jargon words into a hat and then pulling them out three-by-three. (This approach,
    incidentally, is also called a cut-up technique – or découpage – and was used
    by both David Bowie and Kurt Cobain to create some of their more memorable songs.)


    To supplement this list, readers might also want to look at job descriptions in
    other advanced sectors and industries. Any typical recruitment site carries advertisements
    for vacancies, such as:


    +   - **Data Analyst Speech Chatbot Artificial Intelligence**: ‘This role collates
    interaction data from my clients’ Artificial Intelligence Assistant/Chat Bot (like
    Alexa, Siri, Bixby, Cortana) and utilises this data to understand customer behaviour
    and to help improve the potential of my clients’ Chat Bot’.

    +   - **Python Developer Artificial Intelligence**: ‘Working closely with the
    Technical Architect and other developers, you will contribute to building robust
    and performant server-side code for the core product that uses Artificial Intelligence
    to harness knowledge from across the web to provide clients with a strategic,
    competitive advantage’.'
