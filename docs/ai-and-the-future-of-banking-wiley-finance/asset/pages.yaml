    analytics and machine learning across the entire enterprise.


    The size of the Indian analytics marketplace is already estimated at US $1.2 billion
    annually. There is a vast availability of talent, with 60,000 data science and
    financial analytics professionals working in the sector and this figure increases
    by 7,000 per year, yet such is the pace of change that they still view the main
