    Already we are beginning to see the emergence of the Chief Customer Officer (CCO)
    as a senior role, often at executive level, who is responsible for the relationship
    between an organisation and its customers. This new role is a further addition
    to the suite of CxO jobs, and is usually a board-level appointment, looking at
    (and influencing) all issues, such as contact centre, billing and all other functions
    where there is a direct customer-facing operation.


    In their article ‘Why Your Company Needs A Chief Customer Officer’,14 the authors
    suggest that businesses increasingly need a customer champion as companies ‘reorient
    and reprioritise’ their activities around the customer. The article points to
    the need to have two specific functions:


    +   - ‘To unify all customer initiatives throughout different functions’

    +   - ‘To inject a new way of thinking and acting throughout organization’


    It also mentions four key targets:


    +   1. Bringing the customer to life; that is, creating empathy within the organisation
    in terms of the importance of the customer and the nature of the relationship
    between them and the wider enterprise

    +   2. Reaching outside the organisation, typically by allowing the customers
    to help create new processes and products

    +   3. Involving the front lines; that is, recognising that customer-facing staff
    are often best placed to make suggestions regarding customer service and product
    development

    +   4. Embracing data, especially with respect to the creation of a 360-degree
    view of the customer to ensure that satisfaction is measured at all contact points


    It’s easy to be slightly sceptical about the need to create another C-level role,
    which, if anything, might further complicate established responsibilities and
    lines of authority. Notwithstanding this, with greater access to information especially
    through social media and with a heightened awareness of what comprises good service,
    the customer is in the ascendant in terms of being the most important person in
    the room.


    # Becoming Truly Digital


    What this means is that it is insufficient to take existing value models and value
    chains and simply digitalise them. A truly digital transformation requires organisations
    – including banks – to be prepared to deconstruct their existing models and to
    reconstruct them for the digital age, and more importantly, for their digital
    customers.


    But what we mean by ‘digitalisation’ appears to have different interpretations.
    It’s certainly more than ‘on-line banking’, which provides speedy and efficient
    24/7 access. In their 2014 report ‘What digital actually means when it comes to
    banking’,15 Celent, a research, advisory and consulting firm who are focused on
    financial services technology, proposed a definition of ‘digitalisation’ for the
    industry.'
