  md: 'Beyond banking, the new store also acts as an events space where anyone, not
    just NatWest customers, can visit and listen to finance-related presentations
    such as how to avoid being affected by cybercrime. It also attracts children to
    attend child-friendly events as part of NatWest’s ‘Moneysense’ programme.24


    According to research by Caravan Omnibus Surveys, 88% of American adults still
    feel a need to visit a physical branch location, yet there’s recognition that
    the old branch model needs to be transformed into what some are calling a ‘bricks-and-clicks’
    approach.25


    Some banks, such as Umpqua Bank in Oregon, US, are adopting a ‘hub-and-spoke’
    approach by having a fully serviced hub branch and a series of self-service satellites
    in local neighbourhoods. Barclays already provide complete self-service branches
    open 24/7 and with access to services entirely by ATM and telephone. Tangerine
    Bank (formerly ING Direct in Canada), identified as the best online bank in Canada
    in 2019, have even tested pop-up branches.26


    Variations on this model include the concept of ‘banking pods’, which might comprise
    the ‘ATM of the future’ that allows customers to undertake more complex transactions,
    robotic advisors, virtual banking (through the use of video links), and agent
    branches, where a form of franchised version emerges.27


    What seems clear is that there could still be a role for traditional bank branches
    in one form or another, even in a digital, AI-infused age. Why should this be?
    This question needs to be addressed not only by banks but by all brands. According
    to brand experts BWP group, it’s partly because consumers are distrustful of advertising.
    According to their surveys, 95% of Gen Z are expecting brands to court them and
    80% even want brands to entertain them. Increasingly, consumers are seeing retailers
    use ‘showrooming techniques’ to reinforce their brand, allowing the consumer to
    visit, touch, feel and experience before making an online purchase.28


    If a brand exists only online, is this sufficient to fully engage with it? Whilst
    this may be relevant for commodity goods, how does this translate to the financial
    services industry? Surely financial services are more important than perfume and
    cars (although not every consumer may see it that way).


    There is something more subtle to be addressed. Banking is about safety, accessibility,
    prudence and security. Can these be accurately reflected physically through the
    branch network, whether clicks or bricks? Have banks something to learn from,
    say, Apple Stores, which sell not only devices but fundamentally sell something
    equally as intangible as money: their operating system?


    # The Disaggregated Bank


    The concept of ‘disaggregation’ refers to something divided into its component
    parts.29 In this alternative model, one option might be that the banking industry
    disaggregates or ‘dismantles’ what is, in effect, parts of its internal supply
    chain, which are non-core to the banking business. It implies that many of the
    other functions within a bank are not ‘core’ to the real business of banking.
    In effect, the cash teller in this model is ‘just’ an intermediary in a functional
    sense, rather than a net contributor to value.'
