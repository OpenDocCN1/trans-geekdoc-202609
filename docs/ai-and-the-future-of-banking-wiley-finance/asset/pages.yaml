    \ website that looks like a real (and trusted) site.^38 |\n| Click fraud | A click\
    \ on an ad that is not the result of any genuine interest in what that ad is offering,\
    \ and which as a result generates fraudulent revenue in a ‘pay per click’ environment.^39\
    \ |\n| Botnets | A series of interconnected ‘bots’ that may be affected by a common\
    \ set of malware. The term *botnet* is derived from the words *robot* and *network*.\
    \ A bot in this case is a device infected by malware, which then becomes part\
    \ of a network or *net* of infected devices controlled by a single attacker or\
    \ attack group.^40 |\n| Cryptology | Cryptology (or cryptography) is a method\
    \ of protecting information and communications through the use of codes so that\
    \ only those for whom the information is intended can read and process it.^41\
    \ |\n| Firewalls | Software or firmware that enforces a set of rules about what\
    \ data ‘packets’ will be allowed to enter or leave a network. |\n| Intrusion detection\
    \ systems/techniques | Systems and processes that identify intrusion, such as\
    \ the analysis of traffic, detection of anomaly, or detection of malware.^42 |\n\
    | Honeypots | A form of security approach whereby data (for example) that appears\
    \ to be part of a wider database is in fact isolated and monitored for the purposes\
    \ of countering cybercrime. |"
