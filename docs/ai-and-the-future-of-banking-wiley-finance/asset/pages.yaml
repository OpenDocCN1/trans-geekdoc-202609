  md: '> ‘Only three things happen naturally in organizations’ says Drucker, ‘friction,
    confusion, and underperformance. Everything else requires leadership’.


    The essence, therefore, is how do banks reorganise themselves and their business
    models not only to meet current imperatives but also those in the future, and
    how will this reorganisation take into account the use of advanced analytics and
    AI? According to Jim Marous:31


    Most financial institutions understand the major trends that are impacting the
    banking industry as well as what needs to be done to respond to those trends.


    The challenge for legacy banking organizations is prioritizing and deploying resources
    in alignment with these realizations.


    The question is whether organizations are ready to embrace change, take risks
    and disrupt themselves.


    Earlier in this chapter we considered issues of leadership and how it was important
    not only that leaders were able to win and lose but also that empowerment of the
    team is critical.


    Stephen Balzac identified 10 key points:32


    +   1. Clarification of aims and objectives

    +   2. Provision of information at the point of delivery

    +   3. Encouragement of constructive discussion

    +   4. Understanding of what success and failure look like

    +   5. Ease of providing feedback

    +   6. Minimisation of disruption to routines

    +   7. Establishment of key checkpoints to monitor progress

    +   8. Analysis, evaluation and adjustment – and no penalising

    +   9. Revision of the vision as progress is made

    +   10. Relinquish power and delegate


    It’s tempting to try and create some illustrative templates for the Bank of the
    Future. What is recognised is that the future bank is a probable combination of:


    +   - Greater digitalisation

    +   - New technologies working alongside legacy core technologies

    +   - Greater focus on web and mobile technologies

    +   - Centres of innovation and testing

    +   - More APIs

    +   - Personalisation of the customer experience


    One very interesting example of transformation is that of Bank of America, whose
    chairman and CEO Bryan Moynihan described it as being ‘a technology company, wrapped
    around a great bank, and that’s going to be the future of what we do’, he says
    ‘And that’s because our customers demand it’.


    Like other large banks such as Barclay, BoA have innovation hubs that support
    and mentor fintechs and are constantly on the lookout for technical allies.'
