- pgno: 38
  md: 'not have either the critical mass or the business appetite to make these changes,
    yet they potentially have the flexibility and agility to transform themselves
    more quickly than their larger peers.


    There are tradeoffs to be made with respect to agility versus operational efficiency
    and cost reduction. For example, smaller banks might have to be prepared to outsource
    their back-office services to a larger (and more established) competitor, technology
    company or perhaps to a ‘pure’ outsourcing provider to ensure that they have the
    dynamism to compete in the digital age. These decisions are important not only
    in terms of operational cost but also in relation to the customer experience.
    With a great deal of outsourcing being offshore, language and dialect are often
    operational issues. In many cases, xenophobia aside, banking customers still tend
    to deal with human contacts at the other end of the line which they can easily
    understand. Perhaps ultimately chat bots will remove that unintentional bias.


    These aspects will be considered later on and in more detail when we explore the
    bank of the future and the role of AI in this matrix, when issues of implementation
    will also be looked at. For the time being, more foundational (and relatively
    traditional) issues need to be dealt with, those we might traditionally describe
    as ‘business imperatives’.


    # STRATEGY AND IMPERATIVES


    # Strategy


    The expression ‘strategy’ (from the Greek στρατηγία, strategia, which means ‘art
    of troop leader; office of general, command, generalship’) started off as a military
    term, comprising a plan to achieve goals under conditions of uncertainty by using
    several subsets of skills or ‘tactics’. The word ‘strategy’ in business first
    came into usage in the 1960s but the reference to planning during conditions of
    uncertainty seems perfectly fitted to this current age.³


    In fulfilling their obligations to investors, banks typically are relatively transparent
    with respect to their strategic objectives. The information is usually provided
    in investor reports and updates as well as in newsfeeds.


    For technology vendors, for example, the need to understand the strategic objective
    of a bank (or any organisation) is critical as it allows alignment of the vendor’s
    technology (what they are trying to sell) with the bank’s strategic intent. If
    there is no alignment, then the chance of a successful sale is reduced. This approach
    is normally called ‘strategic selling’, and it is a well-known approach to complex
    (‘non-tactical’) selling. Strategic selling allows the vendor to engage with the
    customer at an earlier stage, usually at a higher level, and usually with a greater
    chance of success.⁴


    Start-up ‘Fintech’ companies – which we will consider more specifically later
    on – would be well advised to understand this approach, if only to understand
    how their newly created capabilities fit into the wider picture of their prospective
    client rather than hoping that the start-up’s new technology can find a place
    in the organisation.'
