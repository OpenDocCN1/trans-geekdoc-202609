    > > VCs (Virtual Currencies) respond to real market demand and, most likely, will
    remain with us for a while. . . . VCs should be treated by regulators as any other
    financial instrument, proportionally to their market importance, complexity, and
    associated risks.


    This might sound rather a condescending approach to the matter. Perhaps were it
    not for the Chinese example it could be a valid conclusion, but money and political
    control have often remained significantly hand in hand. Advanced analytics and
    AI have already been established as the foundations of disruptive technology,
    regardless of what industry or profession is being considered. The technological
    impacts of Blockchain and cryptocurrencies fall into that category. The importance
    of Blockchain on the future of banking is critical in the impact that it will
    have not only on process but also on governance.


    There will be a technological cost to be met but also a human cost as well. As
    with greater automation, robotics and AI, these complementary technologies will
    inevitably transform the banking industry.


    # Blockchain and Open Banking in Africa


    In the longer run, the ability of consumers to look across different banking systems
    looks quite appealing. Already the insurance and utilities industries operate
    forms of cost comparison sites. It’s difficult to see why the financial services
    industry should not provide a similar setup.


    Elsewhere beyond Europe, the need for change goes beyond simply consumerism. The
    demand to find the best banking deal for SMEs might prove to be the difference
    between their survival and collapse. The degree of ‘under banking’ (where people
    don’t have access to mainstream banks and therefore resort to alternative financing
    such as loan sharks) in emerging territories also encourages the use of a form
    of Open Banking.


    Already countries are considering not how these new technologies will change the
    face of banking but rather how they will change the face of a continent. Considering
    Africa, for example, the annual Blockchain Africa Conference brings together key
    experts who are focusing on the use of Blockchain in that region. Since 2015 all
    the key big banks in South Africa have been actively researching its use, and
    according to Ross A. Mauri, general manager of IBM’s Z Systems, ‘All South Africa’s
    leading financial institutions have some proof-of-concept or early stage technology
    related to the Blockchain’. This isn’t only a South African initiative but has
    extended Africa-wide.'
