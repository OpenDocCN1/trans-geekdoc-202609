  md: '# Appendix: Fintech in Banking


    This appendix reviews some of the Fintech companies that are currently making
    an impact (at the time of this writing), in order to give an indication and ‘flavour’
    of the types of innovation happening in this particular sector.


    In 2018 research consultants CB Insights published a heat map on what they considered
    to be the hottest offerings in the Fintech space, and this has provided a useful
    insight.¹ Additional names have also been added from those operating from the
    Level 39 innovation hub in Canary Wharf, London, and also from Asian sources,
    but there are many other start-ups and sources to consider.


    Names and summaries of capabilities of individual Fintech companies have mainly
    been taken from their own websites or referenced review sites, and are offered
    without recommendation but are provided by way of illustration of what is happening
    in this sector. This list is far from complete.


    ‘Taglines’ are either taken from the companies’ own websites or are the author’s
    best interpretation of their capability, taken from the companies’ marketing content
    online at the time of research. These, it must be recognised, are naturally subject
    to change in our modern era.


    By the same measure, whilst individual companies are categorised in the tables,
    this is the author’s interpretation of their primary market and in many cases
    they operate in multiple other sectors and fulfil other activities. Readers are
    strongly recommended to make their own direct enquiries of these businesses and
    their scope of activity, and no responsibility is accepted by the author in terms
    of accuracy.


