  md: 'These are very major and long-term decisions. As the banking industry looks
    to the future, with advanced analytics, AI, Blockchain and open banking to name
    just a few of the transformational technologies, senior executives are faced with
    making the right choices, against a background of an uncertain future. (We will
    consider some issues around implementation later on in Chapter 10.)


    It is easy to get bogged down in terminology and jargon. Readers should try to
    avoid becoming distracted or confused by many unfamiliar expressions. The concept
    of Blockchain and the ‘distributed ledger’, for example, is challenging especially
    to those who have a ‘financial head’ rather than a technical head. It may be sufficient
    for individuals simply to become aware of what they do *not* know, and as a result
    have an open mind about technology and change. Some may view this as a catalyst,
    a personal challenge or perhaps a call to action in order to find out about new
    elements of their own industry and other associated industries.


    Managers should encourage their direct reports to become more familiar with technology
    as part of their annual personal development planning, even if it means those
    individuals stepping outside their personal comfort zones. It’s also incumbent
    on the managers and ‘captains of industry’ to keep ahead of the times.


    # The Importance of Location Analytics


    Everything and everyone is somewhere. When we contemplate the challenges of data,
    analytics, customers and successful outcomes, it’s critical that the topic of
    location analytics is taken into account. The topic of location is critical when
    we consider:


    +   - Where each customer lives and works, and their buying behaviour in each
    location

    +   - How they physically get from one place to the other (car or public transport,
    for example), which might influence the customer’s views on how this is funded,
    and the role of the banks as ‘enablers’ of that process. In other words, how might
    a bank assist in the funding of a ticket loan or a car?

    +   - The issues around where the customer lives and the demographic considerations
    in terms of house buying, retail behaviour and local trends (which may in turn
    influence localised campaign management, for example).


    Traditionally, location analytics companies have tended not to focus on banks,
    instead favouring insurance and retail, but increasingly the mood is changing.
    One of the largest companies, ESRI, make this point: ‘Everything in banking is
    hyperlocal’.¹³


    Referring specifically to bank mergers and acquisitions, the ability to understand
    the branch locations of two (merged) companies, overlaid by a new, now-shared
    customer base, allows banks to optimise the physical banking network, improving
    customer service yet at the same time reducing cost.


    The ability of a bank to identify where the greatest concentration of high-net-worth
    customers are may also influence decisions regarding the best place to locate
    or to relocate a branch, and what type of services to provide within that physical
    banking environment. It tends to be the case that high-value customers prefer
    personal service and branches may need to be physically located closer to those
    with higher disposable income, and most probably with adequate parking. This seems
    to imply'
