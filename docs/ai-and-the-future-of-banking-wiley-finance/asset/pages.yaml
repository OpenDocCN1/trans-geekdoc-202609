    # Zen and Leadership in Banking


    Ambidexterity in leadership requires a combination of ‘enhancing optimization
    and exploration simultaneously’ and also being able to embrace failure. The concept,
    which applies to managerial contradictions, was first introduced by the academic
    Robert Duncan in 1976 and since then it has surfaced in different areas:


    +   1. Strategic management where it represents the problem of alignment versus
    adaptability

    +   2. Operations management where it represents flexibility versus efficiency

    +   3. Innovation management where it represents the challenge of radical versus
    incremental.


    To do so, say MIT/Sloan authors, requires future leaders to have ‘emotional fortitude’.
    This is described as being a combination of tenacity, the ability to cope with
    multiple roadblocks and also the willingness to ‘let go of treasured projects’
    if they are not providing appropriate results. Others might simply call this mental
    toughness.


    They also draw out links with Zen Buddhism that allow leaders to identify possibilities
    when they don’t have all the answers. It’s tempting to expand on that particular
    element and wonder whether future leaders will need to have ‘Zen-like’ qualities
    in their approach to business. This isn’t a unique idea, insofar as there have
    been previous efforts to stretch what is in effect a religious ethic into business
    self-help (i.e. Zen and the Art of Work) and even into motorcycle maintenance.


    Zen and the Art of Motorcycle Maintenance27 was first published in 1974 and has
    sold over 5 million copies. It sought to compare and contrast what the writer
    Perzig described as the rational and the romantic. In the context of motorcycle
    maintenance, the ‘rational’ viewpoint was to understand the workings of the machine
    and to fully maintain it. On the other hand, the ‘romantic’ approach was simply
    to run the machine into the ground and then pay for a mechanic to repair it. The
    story suggests that the optimum situation is a combination of the two. From this
    co-existence of knowledge and being ‘in the moment’, it becomes possible to gain
    insights that are not normally possible and may not be rationally explained.'
