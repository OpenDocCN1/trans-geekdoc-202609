- pgno: 87
  md: 'But isn’t the idea of client servicing, with its rather static reporting, now
    ‘old hat’? What might the future look like in this sector? Invariably, it will
    also be affected by the digital transformation of the banking industry, rather
    than run parallel to or to bypass it. Investment and asset managers are already
    using advanced technology to anticipate changes in the stock market, so why shouldn’t
    these same technologies also apply to the client services sector? The essence
    of future client servicing is likely to be one of proactivity rather than reactivity.


    But there is a potential danger especially as these capabilities are increasingly
    available on mobile devices. Asset managers constantly advise that the essence
    of successful asset management is to take a longer view and not to apply knee-jerk
    reactions. How easy will it be to resist such temptations to change or adjust
    the portfolio, if the predictive indicators forecast bad news on the horizon?
    Would such quick responses to sell, for example, become some form of self-fulfilling
    prophecy? As we increasingly automate the process, using advanced tools with in-built
    rules engines, how might those robotic fund managers show restraint, if restraint
    is needed? And if any in-programmed systematic self-restraint results in major
    financial losses, where might the burden of responsibility for those losses actually
    lie? It’s as complex a conundrum as that of the self-driving, or autonomous, car-making
    algorithmic decisions in real time about an impending accident, and what might
    comprise the least-damaging or injurious outcome. Increased automation in multiple
    business areas opens new issues of responsibility and legality.


    Finally, in this subsection, we should also take a moment to reflect on the financial
    disparity that the banking industry is also trying to address. On the one hand
    is this growing number of ‘rich’, but on the other hand is that part of the global
    population at best where there has been no income growth, and at worst who are
    below the poverty line, and whose situation is dire. Because of their own difficult
    conditions, many have migrated from rural locations to the city, with the issue
    of urbanisation creating not only new problems, but adding to existing ones. They
    are the so-called ‘underbanked’ and perhaps for the banks provide new opportunities,
    which will be considered in Chapter 9.


    # RISK MANAGEMENT


    At the heart of banking, the effective use of analytics allows those in charge
    to have an understanding of their risk across risk classes. The topic of risk
    in itself provides sufficient content as to consume full-time and part-time courses,
    and invites the student to consider items such as:


    +   - **Operational risk.** This relates to risk originating from failed process,
    software, individual behaviour and the impact of external events.

    +   - **Credit risk**, both at a retail and wholesale/counterparty risk level.
    In terms of credit risk, effective analytics allows banks to ensure that ‘originating
    banks’, that'
