  trans: '

    使用搜索方法在您的代码中是相当容易的。您只需要使用`search()`作为语法，然后即可开始使用。这个方法会很好，因为您可以在任何位置匹配项目，而不必受限于只查找字符串开头的匹配，这与其他一些查询选项相比。如果您想遍历整个字符串，查看是否在该字符串内找到您要查找的内容，`search()`函数就是您的不二之选。为了了解此选项的工作情况，请查看以下语法：


    ```python

    import re


    string = ''apple, orange, mango, orange''


    match = re.search(r''orange'', string)


    print(match.group(0))

    ```


    当您花时间将这段代码放入解释器中时，您会发现输出是“orange”。您可以在代码的开头或之后找到模式，请记住，使用`search()`函数，它只会为您查找一次。在这个例子中，搜索函数发现只有一个“orange”匹配，因为字符串中只有这一个。但如果代码中有十个更多的橙子，它仍然只会显示一次“orange”，因为这是唯一有匹配的词。


    Match 方法


    现在我们将转向上一节中使用的`search()`函数的第二个查询选项。这个选项与之前使用的`search()`函数略有不同，但也能在 Python 语言中发挥作用。使用`match`函数会查找出现在字符串开头的匹配。如果匹配出现在字符串开头之外，它将不会在代码中显示。


    因此，当您查看上一节中的代码时，如果使用`match`函数，输出将为空。虽然代码中有“orange”的模式，但由于“orange”不是字符串的第一个词，`match`函数不会像这样工作。而且，由于“apple”在字符串的其余部分没有匹配，您将无法得到任何结果。如果“apple”在字符串中重复出现，或者您将“orange”移动到字符串的开头，那么这些代码的输出可能会是：


    这个选项主要有用于当您有一个字符串开头的术语，并且想快速查看该语句是否包含与第一个词匹配的模式。它在查找您想要使用的模式时可以节省您一些时间。


    findall 方法


    在 Python 中使用正则表达式时，接下来要探索的命令是`findall`方法。如果您正在处理一段文本，并且想要从字符串中提取所有同一单词，使用`findall`方法将是您的最佳选择。虽然听起来比较复杂，但它基本上与`search()`函数类似，只是`findall`会返回所有匹配该模式的实例数量，而不是仅返回一个结果。


    例如，在我们使用的代码中，您可以使用`findall`方法找出所有的“orange”。它会识别出代码中的模式，然后列出所有匹配该模式的项。使用上述模式，如果您使用`findall`方法，输出将显示两个“orange”。您可以根据需要扩展这个方法，具体取决于代码中有多少个匹配项。如果“orange”的模式中有
    100 个“orange”，那么`findall`方法会返回一个包含 100 个“orange”的列表供您查看。


    如果您有一个字符串较短，想知道其中包含多少个匹配项，这很有用。但如果字符串很长，您可能不想使用它，因为屏幕上显示 100 个或更多的“orange”列表并不理想。正如上文所述，这取决于您希望从代码中获得什么。


    正如我们在这本书中讨论的，您将能够使用许多正则表达式。它们将帮助您在 Python 库中工作，并且在查找模式时能为您指明方向。根据您在代码中想要做什么，`search`、`match`和`findall`方法可以帮助您从代码中提取所需信息，并将正确的信息显示在屏幕上以满足您的需求。


    # 第 4 章：面向对象编程的含义是什么？


    当您进行编程时，可能会听到几次关于面向对象编程（Object Oriented Programming，OOP）的内容。这是许多编程语言（如 Python）正在采用的一种新方法，旨在在开发过程中保持程序的有序。它基本上是一种消除传统编程方法中发现的一些缺陷的设计方式。


    OOP 通过以更有结构的方式使用最佳的程序特性，以及一些新的强大概念来实现这一点。虽然它对您来说可能有点令人困惑，但这是一种新的设计方式，能让您更好地设计程序、使用
    Python 以及其他程序，以及了解为什么 Python 对初学者来说使用起来如此便捷。


    当大多数编程语言刚刚出现时，它们采用了程序化（procedural）的方法。虽然这种方法能完成工作，并在多年内创造出一些惊艳的代码，但它也存在许多缺陷。这些缺陷往往让初学者望而却步，不想尝试编程。


    由于旧的编程方法难以使用，面向对象编程（OOP）被开发出来。通过 OOP，数据被视为开发中的重要部分，而不是自由流动于系统中。它将数据与将操作数据的函数绑定在一起，从而保护数据安全，防止外部来源对数据进行
    accidental modifications（意外修改）。


    对于您来说，这意味着编程语言更易于使用，同时保留了您所寻找的所有功 power。使用支持 OOP 的编程语言的一些您会喜欢的特性包括：


    * 将重点从过程转移到数据上。

    * 程序将被分割为对象。

    * 这些程序中的数据结构设计为可以由其对象来特征。

    * 用于操作对象数据的函数将与该数据结构一起封装。

    * 数据被隐藏，因此外部函数无法访问该数据。

    * 对象可以通过共享函数相互通信。

    * 新的数据和其函数可以在任何时候添加。

    * 在设计程序时，它将遵循自下而上（bottom-up）的方法。


    需要理解的 OOP 概念


    在使用 OOP 时，有许多概念需要学习。以下是您现在应该重点学习以提升代码质量的概念：


    * `Classes`（类）

    * `Objects`（对象）

    * `Inheritance`（继承）

    * `Data encapsulation and abstraction`（数据封装与抽象）

    * `Dynamic binding`（动态绑定）

    * `Polymorphism`（多态）


    这些概念都是 OOP 的独特特性，能确保您能够在自己的代码中有效使用这一强大的编程范式。让我们花些时间了解这些概念及其工作方式，以提升您的代码力和正确性。


    类

