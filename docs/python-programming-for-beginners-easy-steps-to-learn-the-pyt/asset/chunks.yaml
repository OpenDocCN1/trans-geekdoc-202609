    \ and there ends up being a hundred oranges in the pattern, then the findall method\
    \ would pull up a list that had 100 oranges for you to see. \n\nThis can be useful\
    \ if you have a smaller string and you would like to know how many are inside\
    \ the pattern. But if the string gets pretty long, you probably don’t want to\
    \ use it because who wants to have a list of 100 or more oranges on their screen.\
    \ As mentioned above, it all depends on what you would like to get out of this\
    \ code. \n\nAs we discussed inside this book, there are many regular expressions\
    \ that you will be able to work with. They are going to help you to work inside\
    \ the library of Python and can be amazing for getting you on the right track\
    \ when it comes to finding patterns. Depending on what you would like to do within\
    \ the code, the search, match, and findall method can really help you to get the\
    \ information that you want out of the code and to get the right message to display\
    \ on the screen for your needs. \n\n# Chapter 4: What Does Object Oriented Programming\
    \ Mean?\n\nAs you work with programming, you may hear a few times abut Object\
    \ Oriented Programming, or OOP. This is a new approach that many programming languages,\
    \ like Python, are using in order to keep the program organized during development.\
    \ It is basically designed as a way to eliminate some of the pitfalls that were\
    \ found in conventional methods of programming. \n\nThe OOP is going to do this\
    \ by using the best program features in a more structured way as well as some\
    \ new powerful concepts. While it may seem a bit confusing to you, this is a new\
    \ way that you will be able to design some of your programs, how you are able\
    \ to use Python along with some of the other programs, and why Python is so easy\
    \ to use, even for the beginners. \n\nWhen most programming languages first came\
    \ out, they were developed using the procedural approach. While this did get the\
    \ job done and made some amazing code for many years, it did have a lot of flaws\
    \ inside of it. These flaws were the things that often made beginners in coding\
    \ run away and not want to try it out. \n\nBecause the older programming approach\
    \ was harder to use, the OOP was developed. With OOP, you will find that data\
    \ is treated as an important development rather than allowing the data to just\
    \ flow freely throughout the system. It is going to keep the data tied up with\
    \ the function that will operate it, helping to keep the data safe and ensure\
    \ that no accidental modifications occur from outside sources. \n\nFor you, this\
    \ simply means that the programming language is easier to use and still has all\
    \ the power that you will look for. Some of the features that you will really\
    \ enjoy when using programming languages that have OOP include:\n\n*   Pulling\
    \ the emphasis away from the procedure and putting it more on the data.\n\n* \
    \  The programs will be divided up into objects. \n\n*   The structures of data\
    \ in these programs are designed so that they can be characterized by their objects.\
    \ \n\n*   The functions that are used to operate the data of an object are going\
    \ to tie together inside of this data structure. \n\n*   The data will be hidden\
    \ so that none of the external functions will be able to access this data. \n\n\
    *   The objects will be able to communicate with each other thanks to having common\
    \ functions. \n\n*   The new data and their functions can be added at any time\
    \ if you want. \n\n*   You will notice that when you are designing the program,\
    \ it is going to follow the bottom up approach. \n\nSome concepts to understand\
    \ in OOP\n\nThere are many concepts that you can learn about when you want to\
    \ work with OOP. Most of the ones that you should learn at this point to make\
    \ your codes better include:\n\n*   Classes\n\n*   Objects\n\n*   Inheritance\n\
    \n*   Data encapsulation and abstraction\n\n*   Dynamic binding\n\n*   Polymorphism\n\
    \nEach of these are pretty unique to OOP and will ensure that you are going to\
    \ be able to use this great program in your own code. Let’s take some time to\
    \ look at these concepts and how they are going to work to make your code more\
    \ powerful and work properly. \n\nClasses"
