    \n# Chapter 1: Starting Out With Python\n\nWhen it comes to the world of coding,\
    \ there is so much to learn about. There are different coding languages that you\
    \ can work with, different commands that you can learn that will make the program\
    \ act in a certain way, and so much more that you can learn in the process. Sometimes\
    \ as a beginner, it is confusing to understand how the coding languages work.\
    \ Maybe at some point you have seem some complicated code and felt that it is\
    \ too hard for you to learn how to do. Maybe you have listened to others talk\
    \ about code at some point, and it just seemed to go over your head. While there\
    \ is some technical aspects that are found with many coding languages since they\
    \ do work to tell the computer how to behave, once you learn some of the basics,\
    \ it doesn’t have to be such a hard thing to learn. \n\nIf you are interested\
    \ in learning how to do some basic coding, and to perhaps change it to something\
    \ more advanced down the line, then you need to learn how to work in the Python\
    \ programming language. This is one of the easiest of the programming languages\
    \ because it is based on English (so there aren’t any complicated words to learn\
    \ along the way) and it is set up to be really easy to read. Even if you have\
    \ no experience with coding in the past, you will find that reading through this\
    \ language can be pretty simple. \n\nThere are many different coding languages\
    \ that you will be able to work with in your time in this field and some of them\
    \ may have more options or more power compared to working with Python. C++ is\
    \ a popular coding language that does a lot of hacking and other commands on the\
    \ computer while a program like Java and JavaScript is perfect for setting up\
    \ web pages online. But for a good overall program that can get you started in\
    \ coding, and will build up some of your confidence in how this process works,\
    \ Python is one of the best that you will find. \n\nWhen working in Python, you\
    \ will be able to notice its philosophy fairly early on. This programming language\
    \ was built on the idea of being simple to use. Rather than making things complicated\
    \ and too hard to hand, you will be able to learn this language quickly and a\
    \ lot of the readability that you need is found inside of Python. As a beginner,\
    \ you will appreciate being able to look at the code and understand what is there,\
    \ rather than just taking our word for what you write. With other options, you\
    \ may worry that you missed out on a little part or that you are doing it all\
    \ wrong just because it is set up to be so complicated; this just isn’t the case\
    \ with Python and most beginners appreciate how easy the design of this language\
    \ is. \n\nAs you start to work with Python, you will notice that there are quite\
    \ a few features inside that make this program one of the best for beginners to\
    \ learn with. Some of the benefits and features that you will enjoy when working\
    \ on Python include:\n\n*   The syntax is elegant and easy to read, even for the\
    \ beginner. \n\n*   The language is really easy to use so not only will you be\
    \ able to read through it, but you can also avoid a lot of the bugs and problems\
    \ that come with the other coding languages.\n\n*   The Python library is really\
    \ large, so you will be able to look here for guidance for some of the tasks that\
    \ you want to work with inside of Python. The library is going to include commands\
    \ that help with connecting to web servers, changing files, searching for text,\
    \ and so much more. As a beginner, you should spend some time looking through\
    \ this library because it can provide you with much of the information you need\
    \ to get to learning some of these codes. \n\n*   The Python interface is one\
    \ of the most interactive out of the coding languages. This can make it easy for\
    \ a beginner to test out their code to see what is working for them. If you want\
    \ to experiment a bit and see if one thing works over another, the Python language\
    \ makes that possible. \n\n*   At times, you may want to expand out the work that\
    \ you are doing into something more complex or powerful. Python works great with\
    \ some other coding modules, including C++ and C so you have this option down\
    \ the road. \n\n*   It doesn’t matter what kind of programming you are using,\
    \ or operating system, on your computer. Python is set up to work with all of\
    \ the operating systems including Mac, Windows, Unix, and Linux. \n\n*   The Python\
    \ program is free. You can download it onto your computer and not have to worry\
    \ about paying anything on it. This is an open source program so you can download\
    \ this for free and keep it for your own personal use or you can choose to make\
    \ changes and develop a new update if you feel that brave. \n\n*   There are some\
    \ advanced features that come in this programming language, even for it being\
    \ so simple. You will enjoy some of these features, such as generators and comprehensions\
    \ as you get more advanced in your coding knowledge. \n\n*   It is easy to find\
    \ errors that occur in the Python language. Since the different data types are\
    \ going to be dynamically types, when these types come together and get mixed,\
    \ it is going to raise up an exception that you will need to deal with inside\
    \ of your code. \n\n*   You will enjoy that there is the possibility to group\
    \ together codes into modules and packages whenever you need. \n\n*   And finally,\
    \ you can enjoy that there are many data types that are allowed inside of the\
    \ Python program. You can pick from the data types of numbers, lists, strings,\
    \ and dictionaries. \n\nSetting up the Python program\n\nIt is pretty easy to\
    \ get the Python programming to work on your system. There are a few parts that\
    \ you are going to need to place inside the program to make it work first, but\
    \ overall you will be fine. First, you need to make sure that you have some kind\
    \ of text editor in place. This is the area where you will write out the codes\
    \ that you want to work with inside of the Python language. It doesn’t have to\
    \ be something complicated. When you are working on a Windows computer, you could\
    \ use the Notepad feature to be your text editor and then there are a few other\
    \ options that you are able to use to be the text editor to go along with the\
    \ Python language. "
