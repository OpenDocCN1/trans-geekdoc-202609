- raw: "Learning how to work within the files on your system is a great way to get\
    \ some more experience within Python. This may seem like a simple method that\
    \ you are able to work on and like it shouldn’t need a code or other steps to\
    \ accomplish, but it is really a good way to start learning how to use the system\
    \ and how to not only save some of the code that we will be writing in this guidebook,\
    \ but also to open it up later when you would like to use it again as well as\
    \ how to move the code to a new location if needed. There is just so much that\
    \ you are able to do when in Python when it comes to some of the file and code\
    \ that you are writing, and learning how to do some of these simple steps is the\
    \ right way to get the program written fast. \n\n# Chapter 3: What are Exceptions\
    \ and How Do They Work in Python?\n\nWhile there are a lot of things that can\
    \ make working inside the Python language more enjoyable, one thing that you will\
    \ enjoy the most is the big library that comes with it. This is going to make\
    \ it so much easier to get the codes that you are working on to come out the way\
    \ that you would like. When working inside of this Python library, you are basically\
    \ working with things that are known as regular expressions. These are the parts\
    \ that are responsible for executing any task that you want without any glitches\
    \ and sometimes they will even help to handle the searches that you are doing.\
    \ There are many times when you will need to use these regular expressions to\
    \ help filter your text and you can use them to check on the strings of text to\
    \ see if they do match up with some of the regular expressions you are working\
    \ on. \n\nOnce you learn how to use the regular expressions inside of Python,\
    \ you are going to be set. The syntax that you are working with will stay the\
    \ same whether you are working in just Python or if you combine Python with one\
    \ of the other coding languages that you want. Plus, the syntax for those other\
    \ coding languages is going to be similar to the coding that you find inside of\
    \ Python so once you learn how to do one of the coding languages, it should be\
    \ so much easier to work on some of the others. \n\nAt this point, we have just\
    \ looked a bit at what these could all be about, but you may be confused as to\
    \ what the regular expressions are all about. One way that you can see these regular\
    \ expressions and how they work is to find a word that you spelled a bit differently\
    \ inside of the text editor. This could be a misspelling or some other issues,\
    \ but let’s say that you spelled word blue and then the next one as bleu. Even\
    \ though these are going to have different spellings, you will be able to use\
    \ your text editor to make the two work together correctly. \n\nNow, when you\
    \ want to take these regular expressions and make them work inside of your program,\
    \ you must make sure that you are importing the right expressions from the Python\
    \ library. A good place to do this is right at the beginning of your program to\
    \ keep things organized. When you open up the program, you can go through the\
    \ process and import all the expressions that you need out of the library. This\
    \ not only helps you to write out the code that you should be using, but it is\
    \ also easier on those who are trying to read your program later on. \n\nThere\
    \ are many expressions that are found inside the Python library and you will need\
    \ to take a look at them and figure out the one that is right for your needs.\
    \ Often these expressions are going to be used at the same time as the statements\
    \ so that these statements are able to execute in the proper way. This means that\
    \ you need to have a good understanding of how each expression works because if\
    \ you use the wrong one with your statements, you could end up with the wrong\
    \ execution happening. \n\nLuckily, there are many expressions that you are able\
    \ to use inside of your code and you will be able to find the one that will help\
    \ the program work the way that you would like. You simply need to learn how these\
    \ expressions work and place the right ones in the code and then you will see\
    \ that your commands will quickly come to life. \n\nBasic Patterns\n\nIn addition\
    \ to helping you to set up some of the commands that you want your statements\
    \ to execute, you will also find that these regular expressions are good at helping\
    \ you to make up and specify the patterns that you should have within your code.\
    \ There are a number of different patterns that can be used inside of the Python\
    \ programming and it is a good idea to know which ones you can use for your coding.\
    \ These include:\n\n1.  Ordinary characters. These are characters that will match\
    \ themselves exactly. Be careful with using some of these because they do have\
    \ special meanings inside of Python. The characters that you will need to watch\
    \ out for include \\[\\], \\*, ^, $\n\n2.  The period—this is going to match any\
    \ single except the new line symbol of ‘\\\\n’\n\n3.  3\\. \\\\w—this is the lowercase\
    \ w that is going to match the “word” character. This can be a letter, a digit,\
    \ or an underbar. Keep in mind that this is the mnemonic and that it is going\
    \ to match a single word character rather than the whole word. \n\n4.  \\\\b—this\
    \ is the boundary between a non-word and a word\n\n5.  \\\\s—this is going to\
    \ match a single white space character including the form, form, tab, return,\
    \ newline, and even space. If you do \\\\S, you are talking about any character\
    \ that is not a white space.\n\n6.  ^ = start, $ = end—these are going to match\
    \ to the end or the start of your string.\n\n7.  \\\\t, \\\\n, \\\\r—these are\
    \ going to stand for tab, newline, and return\n\n8.  \\\\d—this is the decimal\
    \ digit for all numbers between 0 and 9. Some of the older regex utilities will\
    \ not support this so be careful when using it\n\n9.  \\\\ --this is going to\
    \ inhibit how special the character is. If you use this if you are uncertain about\
    \ whether the character has some special meaning or not to ensure that it is treated\
    \ just like another character. \n\nMake sure that you learn how these patterns\
    \ work because they are going to really help you to communicate with the interpreter\
    \ and let it know what you are working on inside the code you create. You should\
    \ learn how some of these symbols work and practice inside the interpreter to\
    \ see what is going to come up when you try out different things. If you use the\
    \ symbols in the correct way, you will find that your code is going to execute\
    \ beautifully and there shouldn’t be any problems. On the other hand, if you mess\
    \ up on a sign or on something else within the code, you may find that you get\
    \ an error message, the interpreter gets a bit confused, or the wrong messages\
    \ come up on your screen. \n\nDoing a query with the help of expressions\n\nAt\
    \ this point, we are going to work on using these expressions in order to create\
    \ a query. There are a few different queries that you will be able to use and\
    \ it often depends on what you want the regular expression to do before you pick\
    \ the method that you will use. There are three types of methods that work for\
    \ this kind of action and they include:\n\nre.findall()\n\nre.match()\n\nre.search()\n\
    \nRight now these are all just some words in the code that you may not understand\
    \ all that well, but in the next few parts, we are going to look at what each\
    \ of them mean, how these options are a bit different from each other, and help\
    \ you to learn when you are supposed to use each one in your code writing. \n\n\
    The search method"
