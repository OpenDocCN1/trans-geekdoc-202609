    # 第 7 章：在 Python 中使用条件语句


    另一种你可以在 Python 语言中使用的功能是让计算机为你做出一些重大决策。有时你会在程序中设置条件，然后用户会输入他们的信息。有时候这些答案是根据你设定的条件为真，其他时候用户输入的信息则会导致条件为假。你需要让计算机根据你输入的内容和返回的结果来决定它应该做什么。


    本章将向你展示一些教程程序进行自我决策的基本知识。这将为你的程序增加更多能力，并且在屏幕上出现多种选项时，使用程序会更加便捷。


    首先，让我们来看看你可以在程序中使用的不同类型的决策控制命令。Python 中最常见的包括 `switch` 语句、`if` 语句和 `if…else` 语句。此外，还有这些语句的变体，允许你在代码中拥有更多选项。


    作为初学者，我们从最基础的这些决策控制命令开始。这就是 `if` 语句，它基于真或假进行工作。你需要在代码中设置为真的条件。然后用户可以输入他们想要的任何信息。如果程序判断用户的输入符合你设定的条件为真，消息将在屏幕上显示，或者用户可以继续运行程序。相反，如果用户的输入被判定为假，系统将直接停止运行（我们稍后会看到如何在条件为真时显示单独消息）。


    这看起来很基础，只会根据用户输入是否符合你设定的条件显示一条消息。下面是一个 `if` 语句的良好示例语法：


    `age = int(input("Enter your age:"))`


    `if (age <=18):`


    `print("You are not eligible for voting, try next election!")`


    `print("Program ends")`


    观察这个语法时，有几个需要注意的点。如果用户在网站上输入他们的年龄为 18 岁或以下，他们就满足了你设定的条件。程序会看到输入为真，并在用户的屏幕上显示“You
    are not eligible for voting, try next election!”。但如果用户输入的年龄超过 18 岁，例如 25，情况会不同。


    当用户输入 25 等年龄时，编译器会认为这个输入是基于你设定的条件为假的。由于这是基础编码公式，你没有为假的情况设置任何内容。编译器不会输出上面的语句，因为它只在条件为真时显示。当输入为假时，编译器没有
    if 语句的指示来执行什么操作，因此它会显示空白屏幕，不继续执行程序。


    如你所见，这种方法并不是高效的决策方式。它能处理输入为真的情况，是初学者写代码的好起点，但当用户输入不满足条件时，程序会出现空白屏幕或直接关闭，这显然不合理。即使用户的年龄大于
    18 岁，也不应该因为不符合条件而关闭程序。


    幸运的是，你可以使用一些方法确保在条件满足时显示一条消息，在条件不满足时显示另一条消息。这样，无论用户输入什么，都能看到相应的提示。这些就是 `if…else`
    语句。


    `if…else` 语句负责为程序设定例外规则，使其继续运行。你只需添加一小部分代码，就能让程序与 `if…else` 语句配合良好，并确保无论用户输入什么，正确的消息都会显示。下面是一个使用
    `if…else` 的良好语法示例：


    `age = int(input("Enter your age:"))`


    `if (age <=18):`


    `print("You are not eligible for voting, try next election!")`


    `else`


    `print("Congratulations! You are eligible to vote. Check out your local polling
    station to find out more information!")`


    `print("Program ends")`


    在这个例子中，系统会有两种可能的输出。如果用户输入 18 岁或更小，第一条消息“You are not eligible for voting, try next
    election!” 会显示。如果用户输入超过 18 岁的年龄，第二条消息“Congratulations! You are eligible to vote.
    Check out your local polling station to find out more information!” 会显示。这样用户可以输入任意年龄，并获得相应的提示。


    这是 `if…else` 语句的基本用法。如果你想让程序处理三个或四个不同年龄组，也可以实现。你只需要添加另一个 `else` 部分，并说明根据用户输入应显示的消息或说明。


    在熟悉 `if` 语句后，可以转向 `if…else` 语句。这些语句会增加程序的选项，确保程序运行得更加完整、更加正常。没有人希望输入答案后屏幕变黑，这在使用过于简单的
    `if` 语句时可能发生，因为它们无法处理编码中的各种变体。幸运的是，`if…else` 语句可以解决这个问题，即使是初学者也能使用它来创建出色的程序。


    ## 使用 `elif` 语句


    '
