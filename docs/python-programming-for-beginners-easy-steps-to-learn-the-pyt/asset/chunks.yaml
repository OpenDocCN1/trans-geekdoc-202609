- raw: "When you are thinking about classes, you should think of them like the blue\
    \ prints or the design of the Python program. The whole set of data and code for\
    \ the objects that you are using can be defined when the class is there to help.\
    \ For the most part, the objects are going to be variables of the type of class\
    \ that you want to work with. \n\nWhen the user has taken the time to define their\
    \ class, they are then able to go on and create as many objects as they would\
    \ like to belong within that same class. The objects will then be associated with\
    \ the data type of class that they were originally created within. \n\nFor the\
    \ most part, the class is just going to be a collection of objects that are grouped\
    \ together because they have some similarities that link them together in some\
    \ way. They can have the same actions, the same colors, or the same use. You are\
    \ able to determine the way that the objects are classified together. For example,\
    \ you could place all fruits in one class, all the objects that are the color\
    \ blue, all kids toys, or something else that will link the objects together.\
    \ \n\nWhen you are making the classes, you should ensure that they make sense.\
    \ You want the things that are in the class to be there because they make sense.\
    \ If you put in a firetruck, an ice cube, a car, a bush, and a slide, it may be\
    \ hard for someone to figure out what the class is all about. But if you pick\
    \ something like a Christmas tree, Santa Clause, elves, and presents, the user\
    \ would be able to determine that these are items that are for the Christmas season.\
    \ \n\nObjects\n\nWe discussed this a bit above, but objects are basically the\
    \ items that are going to be placed inside the classes and they will be the basic\
    \ entities to run time inside of the OOP program. These can represent almost anything\
    \ from a table with a bit of data, a person, an item, a place, or even a building.\
    \ There are not limitations on what can be considered an object. It just needs\
    \ to be something that you want the interpreter to execute. \n\nSome of the other\
    \ things that you may want to classify as an object in your code include user\
    \ defined content such as vectors, time, and lists. In addition, if you even up\
    \ having some issues with your programming, your interpreter is going to analyze\
    \ the code in term of the objects that you use and how they are communicating\
    \ with each other. The objects that you choose in your classes and in the codes\
    \ need to be chosen carefully, ensuring that the objects you are using will match\
    \ closely with each other as well as with other real world objects so that the\
    \ interpreter is able to show them correctly. \n\nAbstraction and data encapsulation\n\
    \nWhen you take the data and the function from one unit, or the class, you are\
    \ doing the process that is known as encapsulation. This is one of the most amazing\
    \ features that you will see within the class. The data, once it has gone through\
    \ the process of encapsulation, will not be accessible to the outside world and\
    \ only any functions that are inside that class will be able to access it.\n\n\
    This is going to ensure that no one else is able to make changes to your classes\
    \ when you are done creating them, that only the function that is attached to\
    \ that class will be able to make the changes in the code. These functions are\
    \ good for the interface when you want the data and the program of the object\
    \ to work together well. This insulation will help to keep the data away from\
    \ access of the program and it is a process that is known as either data hiding\
    \ or information hiding. \n\nAnother option that you may want to use is abstraction.\
    \ The process of abstraction is the act of representing some essential features\
    \ of the class without adding in the explanation or the details about the background\
    \ of that class. The classes that you are using are going to use abstraction to\
    \ help keep it safe and will be defined by the different attributes such as size,\
    \ wait, function, and cost to name a few. \n\nInheritance\n\nInheritance is a\
    \ great feature that you are able to use on Python and we will discuss how to\
    \ go about this process a bit more in a later chapter. It is going to be used\
    \ to help you to use features from a previous code and expand it to work with\
    \ a newer code, one that you are able to make different changes to over time.\
    \ \n\nWhen you are on OOP, the concept of using inheritance is the idea that things\
    \ are able to be reused within the program. This means that you will be able to\
    \ pick out a parent that you would like to use in the code and then change it\
    \ into the child code before making the changes that you need to continue on the\
    \ code. \n\nThis is going to save you a lot of time. You will be able to use one\
    \ of the classes that you already developed in order to make something new. You\
    \ will not need to go through and make a whole new code completely since you will\
    \ be able to use some of the information that you already have. Plus, with inheritances,\
    \ you will be able to make changes. You are not stuck with just using the same\
    \ parent code each time, the parent code is going to give you the basis that you\
    \ need, but you can add more power and functions to the original code. \n\nPolymorphism\n\
    \nThe next thing that you are able to work on in your code is to do a polymorphism.\
    \ You are going to be able to create an operation that is able to take on behaviors\
    \ that come from different instances. The behavior that comes up is going to depend\
    \ on the types of data that you plan to use in the operation, but you are able\
    \ to make the code work based on the functions that you choose. A good example\
    \ of this is when you have a class that is about shapes and then you give it a\
    \ draw method in there as well. \n\nYou would use this kind of method when you\
    \ want your object to do more than one thing during the execution. Perhaps you\
    \ want the ball to be able to roll and bounce when it comes out or something else\
    \ that would work well with your coding. You can take just one of the objects\
    \ and get it to do many different things. The best part about this is not only\
    \ will the code help the object to do many different actions, but you will not\
    \ need to use as many lines of codes to make it happen, helping your code to stay\
    \ organized and neat looking. \n\nDynamic binding\n\nIt is also possible to work\
    \ with dynamic binding when you are working on your OOP language. Binding refers\
    \ to the linking of a procedure call to the code to be executed in response to\
    \ the call. But when you are working with dynamic binding, this means that the\
    \ code will be associated to the given procedure, but the call is not known until\
    \ you call this out at the run time. You are often going to see this happen with\
    \ some of the other features of OOP including with inheritance and with polymorphism.\
    \ \n\nThe OOP options are one of the best to use in your programming language\
    \ because they are simple, there is a lot that you are able to do with it, and\
    \ it is easier to use without as many complications like you would get with some\
    \ of the older coding languages. Python as well as some of the other modern programming\
    \ languages will use this option, making it one of the best to use if you want\
    \ to have safe programming that is easy for you to make and the user to use properly.\
    \ And as this chapter shows, there are a lot of great things that you will be\
    \ able to do with your code when you use a programming language that utilizes\
    \ OOP. \n\n#   \n\nChapter 5: The Importance of Classes and Objects in the Python\
    \ Code\n\nWe spent quite a bit of time talking about objects and classes in the\
    \ last chapter and how they are going to work together. The classes are going\
    \ to make it easier for you to place different objects together so that you are\
    \ able to pull them out at the same time when they are needed within the code,\
    \ but both are so important to making the code work out the way that you want. "
