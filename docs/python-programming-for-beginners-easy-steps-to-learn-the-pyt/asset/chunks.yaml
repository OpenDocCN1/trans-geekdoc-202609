  trans: "\n一旦你选择了想要使用的文本编辑器，就该下载你的 Python 编程了。由于这是免费的，你可以选择你最喜欢的版本，然后在短时间内将其下载到计算机上。你可以访问\
    \ python.com 查看可用的版本列表，然后你就可以选择想要使用的那个版本。在将其下载到计算机上时，请确保同时下载 IDLE，因为如果没有这个环境就无法让你的程序工作。一旦你将这些都放在计算机上，就可以开始使用\
    \ Python 并开始编写自己的代码了。\n\n## 使用 Python 的原因\n\n如前所述，Python 只是众多编程语言中的一种，你可以选择使用的语言。市面上有很多语言，有些会比你想象的更复杂、更有力量，甚至比\
    \ Python 提供的更多。选择哪种编程语言进行编码，很大程度上取决于你想完成的工作类型，这将决定你选择的类型。在所有这些选项中，为什么要考虑使用 Python\
    \ 而不是其他语言呢？下面我们将讨论选择 Python 而非其他编程语言的一些好处，尤其是当你刚开始学习编程时。\n\n### 可读性\n\n你开始使用 Python\
    \ 时，首先要注意到的就是它非常易于阅读。它基于英语语言，第一次查看它时，你可能会松一口气，因为它看起来很容易阅读。Python 也是一门易于学习格式的语言，只要你了解一些基本规则。任何人都可以学会用这种语言书写，即使是初学者，也能写出其他程序员能阅读并理解的内容。\n\
    \n### 库\n\n当你是编程新手时，你选择的编程语言的库非常重要。这些库包含了你在 Python 语言中需要的大量命令和语法。由于这是开源程序，库中有成千上万行代码，其他程序员不断开发并添加到库中。\n\
    \n这对初学者来说是好消息。如果你想学习新的代码或不确定如何在你正在开发的代码中放置某些内容，你可以访问库，通常能找到所需的信息。这在节省时间方面也很有帮助，因为你可以从库中找到一段代码，将其插入到自己的代码中并投入使用。\n\
    \n### 社区\n\n使用 Python 语言的一个优点是你可以找到一个良好的社区来合作。Python 是最流行的编程语言之一，因此拥有庞大的社区。你可以找到包含许多\
    \ Python 产品的全国性会议，以及在线和离线的论坛，人们不断提问并获得建议。\n\n作为初学者，探索这些社区是个好主意。它们包含更高级的用户以及其他初学者，如果你在遇到困难、想学习新事物或遇到编程问题时，这里是你找到答案的地方。\n\
    \n### 易用性\n\n当你开始使用新的编程语言，尤其是如果你没有任何编码经验时，你希望使用的程序尽可能易用。你不想花几个月时间学习如何使用新代码，因为这会让你沮丧并想放弃。虽然学习新代码需要一些努力，但大多数人希望能够在付出一点努力后掌握它，而不是觉得永远无法弄清楚。\
    \ \n\nPython 语言非常易用。它没有太多花哨的功能，你甚至可以在学习任何关于它的知识之前，直接阅读其中的代码。加上一些关于该编程语言的知识，你很快就能将其变为自己的。\n\
    \nPython 是一门易于学习的编程语言，经过一段时间的练习后，你会发现自己能够迅速编写自己的代码。学习一种全新的编程语言会很有趣，Python 将是你用来实现这一点的最佳工具之一。如果你是初学者，想要开始编写自己的代码，这是一个理想的起点。\n\
    \n# 第 2 章：如何在 Python 中处理文件\n\n现在我们已经掌握了一些 Python 的基础知识，并了解为什么你可能会选择这种编程语言而不是其他语言，现在是时候学习一些与这门语言相关的基础知识了。你在创建\
    \ Python 项目时，会有很多时候需要将数据存储起来，以便以后方便访问。你甚至可能希望在程序中显示这些数据，作为整体或一部分，并且希望让这能够顺利实现。\n\
    \n当你需要以这种方式存储数据时，应该创建一个“文件”，但有时你也可以在编程语言中重复使用相同的代码。让我们在这一章中花些时间创建这些文件，以便它们在你编写新代码时依然存在。\n\
    \n在文件模式中，你可以执行多种操作。你可以像在 Windows 电脑的 Word 中工作那样，保存文档。当你完成后，想要以后再打开它时，你需要保存文档；而在\
    \ Python 中，你则是用保存代码来实现这一点。你可以对文件执行的操作包括：\n\n*   创建新文件\n\n*   关闭文件\n\n*   移动文件\n\
    \n*   编辑文件以添加更多代码。\n\n这些操作将为你提供在文件中工作的选择，并确保代码在你想要的位置。学会使用这些操作可以让你更轻松地使用 Python，但一旦你练习几次，你会发现这其实是一个很简单的过程。\n\
    \n### 创建新文件\n\n我们首先要探讨的是如何创建新文件。如果你想在创建文件之前就写入内容，只需打开文件并选择想要以哪种模式写入代码。有三种基本的模式可用，它们将帮助你确定在程序中执行什么操作。这三种模式分别是\
    \ mode(x)、append(a) 和 write(w)。每当你想对文件进行更改，例如最初写入内容，就需要使用 write(w) 模式来开始。\n\n\
    如果我们在创建新文件，并通过写入语句或字符串（这通常用于二进制文件）来实现，你只需使用 write(w) 方法即可。这一直是最简单直接的方式，因为它允许你在创建新文件时直接写入代码，保持一切整洁有序。\n\
    \n"
