    学习如何在系统的文件中工作是获得 Python 更多经验的好方法。这可能看起来像是一个简单的方法，你可以直接操作并喜欢它，似乎不需要代码或其他步骤就能完成，但实际上这是学习如何使用系统以及如何不仅保存本指南中将要编写的代码，而且在以后需要再次使用时打开它，以及在需要时将代码移动到新位置的好方法。当你在
    Python 中处理文件和代码时，你能做的事情非常多，学习这些简单步骤是快速编写程序的正确方式。


    # 第 3 章：什么是异常以及它们在 Python 中如何工作？


    虽然有很多东西能让你在 Python 语言中工作更加愉快，但你会享受的最大一件事是它附带的庞大库。这将使你的代码更容易按照你想要的方式输出。在使用这个 Python
    库时，你实际上是在使用所谓的“正则表达式”。这些是用于执行你想要的任何任务而不出错的部分，有时它们甚至能帮助处理你正在进行的搜索。你会在很多时候需要使用这些正则表达式来过滤文本，并且可以用它们检查文本字符串是否匹配你正在使用的正则表达式。


    一旦你学会在 Python 中使用正则表达式，你就已经准备好一切了。你使用的语法无论是在单独的 Python 中，还是将 Python 与其他编程语言结合使用时，都保持不变。而且，其他编程语言的语法也与
    Python 中的语法相似，一旦你掌握了其中一种语言，学习其他语言就会变得非常容易。


    在此我们已经大致了解了这些内容，但你可能对正则表达式到底是什么仍然感到困惑。一种查看正则表达式及其工作方式的方法是，在文本编辑器中查找拼写错误。这可能是拼写错误或其他问题，但假设你拼写了单词
    "blue"，然后下一个词拼写为 "bleu"。尽管这两个词拼写不同，但你可以通过文本编辑器让它们正确配合。


    现在，当你想让这些正则表达式在程序中工作时，必须确保你从 Python 库中导入正确的表达式。最佳位置是在程序的开头进行导入，以保持代码的有序。打开程序后，你可以按流程导入所有需要的表达式。这不仅帮助你编写正确的代码，也方便后来阅读你程序的人。


    Python 库中包含许多表达式，你需要仔细查看并找出适合你需求的那一个。这些表达式通常与语句一起使用，以确保语句能正确执行。这意味着你需要深入理解每个表达式的工作方式，因为如果使用错误的表达式，你可能会得到错误的执行结果。


    幸运的是，你可以在代码中使用许多表达式，并找到适合你程序的那一个。你只需要学习这些表达式的工作原理，将正确的表达式放入代码中，然后你会看到你的命令迅速生效。


    ### 基础模式


    除了帮助你设置想要的语句执行的命令外，正则表达式还擅长帮助你定义和指定代码中的模式。Python 编程中有许多不同的模式可以使用，了解哪些模式适合你的编码是个好主意。这些包括：


    1.  普通字符。这些字符会精确匹配自身。要小心使用某些字符，因为它们在 Python 中具有特殊含义。需要注意的字符包括 `[\ ]`、`\*`、`^`、`$`


    2.  点号（`.`）——匹配除换行符 `\n` 之外的任意单个字符


    3.  `3\. \w`——这里的 `\w` 表示“字符”类型，可匹配字母、数字或下划线。注意，这是一个惯用法，匹配单个字符而不是整个单词。


    4.  `\b`——匹配非字词字符与字词字符之间的边界


    5.  `\s`——匹配单个空白字符，包括空格、制表符、换行、回车、换行符以及普通空格。若使用 `\S`，则表示匹配除空白字符之外的任意字符。


    6.  `^ = start, $ = end`——匹配字符串的起始位置或结束位置


    7.  `\t`、`\n`、`\r`——分别代表制表符、换行和回车


    8.  `\d`——匹配十进制数字（0-9）。部分旧版正则工具不支持此符，使用时需谨慎


    9.  `\`——转义字符，用于抑制字符的特殊含义，确保它被视为普通字符


    务必学习这些模式的工作原理，因为它们能帮助你与解释器通信，让它明白你在代码中想要实现的内容。你应该学习这些符号的用法，并在解释器中练习，观察不同组合的效果。正确使用符号的话，代码会运行得很漂亮，不会出现问题；若符号使用错误，可能会出现错误信息、解释器困惑或屏幕显示错误信息。


    ### 使用表达式进行查询


    此时我们将使用这些表达式来构建查询。你可以使用多种查询方式，具体取决于正则表达式需要执行的操作。下面列出了三种常用方法：


    `re.findall()`


    `re.match()`


    `re.search()`


    目前这些只是代码中的单词，可能不太容易理解，但接下来我们会详细说明每种方法的含义、它们之间的区别，以及在何时应使用它们。


    #### 查找方法


    '
