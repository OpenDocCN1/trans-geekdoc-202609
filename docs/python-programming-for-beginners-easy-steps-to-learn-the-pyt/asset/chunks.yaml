- raw: "These messages are going come up on the screen any time that the user puts\
    \ in something that may not be allowed inside the system. These can be a bit nicer\
    \ compared to having the error come up and if you create the message to be the\
    \ right way, you will find that it can actually help out the user. With the message,\
    \ the user will be able to see the things that they did wrong inside the code\
    \ and they can go through and make some of the changes to get it all to work out\
    \ the right way. Here is something that you could write out in the code in order\
    \ to get a message to come up, rather than just the error from before:\n\nx =\
    \ 10\n\ny = 0\n\nresult = 0\n\ntry:\n\nresult = x/y\n\nprint(result)\n\nexcept\
    \ ZeroDivisionError:\n\nprint(“You are trying to divide by zero.”)\n\nIf you look\
    \ closely at this syntax, you will see that this is going to be pretty similar\
    \ to what you found in the previous example, but there is one change that is inside.\
    \ The program will still see that you are handling an exception, but you will\
    \ be able to send out a message to the user letting them know that something is\
    \ wrong in the code that they are writing. Instead of following the top example\
    \ and having the error message come up, you will have the message come up that\
    \ says (in this example) “You are trying to divide by zero.” This is going to\
    \ leave a look that is much cleaner and will give the user a chance to go back\
    \ on and change the input they are doing. \n\nMaking your own exceptions\n\nIn\
    \ the example above, we took a look at how to handle the exceptions that come\
    \ up if your user is doing something that the Python system doesn’t allow. In\
    \ those examples, we took a look at what happens when the user tries to divide\
    \ by zero within the program. But there are some steps that you can take any time\
    \ that you would like to make an exception into the program, even if it is something\
    \ that Python does allow. There are some programs that you can create where you\
    \ may not want to allow a certain answer or so on, and making sure that this is\
    \ handled as an exception in the program will ensure that it is going to work\
    \ the way that you want. \n\nFor example, if you want to make sure that the user\
    \ isn’t allowed to place certain numbers into the system, you would want to make\
    \ sure that there is an exception added in. If you want to make sure that the\
    \ user is able to add in two or more guesses for the part they are working on,\
    \ you could also create an exception for that as well. The trick here is that\
    \ the Python program wouldn’t see something wrong with what the user is putting\
    \ into the system, but because of the way that you design your program, there\
    \ are going to be issues if you allow everything. A good example of this is dealing\
    \ with ages. There is nothing wrong with the person stating that they are 20,\
    \ but if you are on a gambling site that only allows people 21 and older to play,\
    \ you will want to make an exception that says that anyone under the age of 21\
    \ is not able to get onto the site. \n\nYou are able to set up any exception class\
    \ as long as it meets with the Python rules and also follows the rules of the\
    \ program that you are trying to create. If there is a certain thing that you\
    \ don’t want to happen inside of the code, such as having certain answers, letters,\
    \ numbers, and other things picked, you need to add in these as an exception to\
    \ the program. Here is an example that you can follow that will help you to create\
    \ some of these exceptions:\n\nclass CustomException(Exception):\n\ndef\\_init\\\
    _(self, value):\n\nself.parameter = value\n\ndef\\_str\\_(self):\n\nreturn repr(self.parameter)\n\
    \ntry:\n\nraise CustomException(“This is a CustomError!”)\n\nexcept CustomException\
    \ as ex:\n\nprint(“Caught:”, ex.parameter)\n\nUsing this particular syntax is\
    \ going to help you to get the message “Caught: This is a CustomError!” and it\
    \ is going to show up whenever the user places in some of the wrong information,\
    \ based on the conditions that you set out. This is a great way to show that there\
    \ is a custom exception that is going on inside the program, especially when this\
    \ is an exception that you set up by yourself rather than one that is through\
    \ the program. \n\nKeeping this in mind, you are able to make any changes to the\
    \ wording that you would like to use inside this as well. You aren’t stuck with\
    \ just leaving the message that we have listed above. You can use this as a good\
    \ starting point, or choose to change it up so that it works for your particular\
    \ program. If you are keeping people out of the program because it is a gambling\
    \ site and you can’t allow anyone under 21 to come into the game, for example,\
    \ then you may want to leave a message about that in there. \n\nWhen you are working\
    \ with these exceptions, you will find that they are going to be defined as being\
    \ able to do the same things that most of your classes are able to do, but it\
    \ is best to keep these as simple as possible when you are the programmer, changing\
    \ a few of the attributes to make sure that the right error is extracted out of\
    \ the exception, but not adding in much more than that or it can get confusing.\
    \ \n\nIt is possible to create some modules inside of your program or your code\
    \ that will bring up two or more errors all at the same time. The best way to\
    \ do this is to create one class that will be the base for which the definition\
    \ of the exemptions will be listed out. This is going to help sort out the exceptions\
    \ that you want to work with. you can then go through and create some subclasses\
    \ that will take care of all these different classes. \n\nDoing some cleanup actions\n\
    \nAnother of the clauses that you would like to use is the ones that are considered\
    \ the try statement. This is one that is also known as the finally clause, because\
    \ you are going to use this in order to clean up the actions that are going through\
    \ your program. These are often called the clean up actions because once you go\
    \ through and execute them, they can clean up the code, make sure that it is ready\
    \ for the next part, and make everything run in a smooth manner. \n\nThis is one\
    \ of the clauses that will be used both on the way in with the code and then again\
    \ on the way out. You can choose it to clean up on the way out whenever the other\
    \ clauses are still left behind in the statement, return statement, continue,\
    \ or a break. To see how this is going to work, take a look at this example for\
    \ clean up actions inside of your Python statements:\n\ndef divide(x, y):\n\n\
    try:\n\nresult = x/y\n\nexcept ZeroDivisionError:\n\nprint(“Division by zero!”)\n\
    \nelse: \n\nprint(“result is”, result)\n\nfinally:\n\nprint(“Executing finally\
    \ clause”\n\ndivide(2,0)\n\nWhen you go through and execute this syntax, you will\
    \ see the results:\n\n\\>>>\n\nDivision by zero!\n\nExecuting finally clause\n\
    \n\\>>>\n\nThis is one of the useful clauses to know how to use because it is\
    \ great for ensuring that all of the statements will clean up and that when you\
    \ are done with the code, nothing is going to be left behind. It can be really\
    \ helpful any time that you are worried about how your program will end or there\
    \ is some kind of issue between switching from one part of the code to the other.\
    \ It is also often used when you are dealing with exceptions and you need to allow\
    \ the program to move on, even if the exception has been brought up. You will\
    \ need to experiment w a bit with these kinds of clean up actions because they\
    \ will make it possible to have smooth transitions between your code and will\
    \ make it work better than before. \n\nWorking with exceptions can be a lot of\
    \ fun inside of Python. They will add in some new stuff that you will be able\
    \ to do, such as helping to bring up messages instead of error signs when working\
    \ with the exceptions that are already inside of Python and watching to see which\
    \ of the exceptions you are going to bring up all on your own to work with the\
    \ program. You may find that as you go along, there are going to be more and more\
    \ instances when you want to bring up exceptions and make your program more powerful\
    \ while getting it to work the exact way that you want."
