    \ the search function found that there was one match of orange because that is\
    \ all that is there. But, you could have ten more oranges in this code, and it\
    \ is only going to show up the word “orange” once because that is the word that\
    \ has a match. \n\nMatch Method\n\nNow we are going to move on to the second query\
    \ option that you can work with. This option is going to be slightly different\
