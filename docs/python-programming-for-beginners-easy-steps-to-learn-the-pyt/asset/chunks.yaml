    保留在类中创建的对象可以是你想要的任何类型，但你应该考虑将相似的对象放在同一个类中。这样做可以让你更容易地将它们组织在一起，并使你的代码看起来更加统一。通过一些组织和提前思考，你将能够保持代码的所有部分有序，以便解释器以你想要的方式读取它们。


    在我们继续创建类之前，需要记住以下几点：


    *   同一个类中的对象将具有相同的结构，但它们可以稍作差异。例如，如果你有一个车辆类，你可以将任何车辆放入其中，包括汽车、面包车、卡车等。


    *   使用类创建对象的方法。


    *   类是基本的蓝图或设计，它们会告诉解释器如何运行程序。


    如何创建类？


    在 Python 中创建一个类并不复杂。当你在编写类语句时，你实际上是在定义一个新的类定义。你需要在关键字后面紧跟类名，然后在括号内放置超类。务必以冒号结尾，以保持良好的编码规范。下面是一个正确语法的示例：


    class Vehicle(object):


    #构造函数


    def__init__(self, steering, wheels, clutch, breaks, gears):


    self._steering = steering


    self._wheels = wheels


    self._clutch = clutch


    self._breaks = breaks


    self._gears = gears


    #析构函数


    def__del__(self):


    print(“This is destructor….”)


    #成员函数或方法


    def Display_Vehicle(self):


    print(‘Steering:’ , self._steering)


    print(‘Wheels:’, self._wheels)


    print(‘Clutch:’, self._clutch)


    print(‘Breaks:’, self._breaks)


    print(‘Gears:’, self._gears)


    #实例化一个车辆选项


    myGenericVehicle = Vehicle(‘Power Steering’, 4, ‘Super Clutch’, ‘Disk Breaks’,
    5)


    myGenericVehicle.Display_Vehicle()


    从将这些信息全部输入到解释器中后，你将得到以下输出：


    (‘Steering:’, ‘Power Steering’)


    (‘Wheels:’, 4)


    (‘Clutch:’, ‘Super Clutch’)


    (‘Breaks:’, ‘Disk Breaks’)


    (‘Gears:’, 5)


    通过这个例子，你会发现代码包含了很多部分：类定义、方法定义、属性、析构函数、类定义和函数。让我们来看看这些部分是如何工作的以及它们在你的代码中为什么如此重要。


    类定义和对象实例化


    你需要这两个部分来定义你想要发生的事情的语法。它们将帮助解释器理解你的意图。以下是一些语法，确保解释器能够识别你的操作：


    类定义语法如下：


    class subclass[(superclass0]:


    [attributes and methods]


    对象实例化语法如下：


    object = class()


    当你想要调用类中的方法和属性时，你可以使用以下方式：


    object.attribute


    object.method()


    Python 中的特殊属性


    有一些属性在 Python 中是特殊的。了解这些属性很有用，因为它们可以让你更轻松地工作，并且确保解释器能够正确读取它们。以下是一些你应该学习如何在代码中使用的特殊属性：


    __dict__ 这是类名称空间的字典变量


    __doc__ 这是类的文档参考字符串


    __name__ 这是类的名称


    __module__ 这是模块名称，包含类


    __bases__ 这是包含所有超类的元组


    让我们看看如何在你可能选择的语法中使用这些语法。


    class Cat(object):


    itsWeight = 0


    itsAge = 0


    itsName = ""


    defMeow(self):


    print(“Meow!”)


    defDisplayCat(self):


    print(“I am a Cat Object, My name is”, self.itsName)


    print(“My age is”, self.itsAge)


    print(“My weight is”, self.itsWeight)


    frisky = Cat()


    frisky.itsAge = 10


    frisky.itsName = “Frisky”


    frisky.DisplayCat()


    frisky.Meow()


    当你在解释器中使用这个语法时，屏幕上显示的结果是：


    (‘I am a Cat Object, My name is’, ‘Frisky’)


    (‘My age is’, 10)


    (‘My weight is’, 0)


    Meow!


    访问类的成员


    在我们使用的语法中，我们通过点运算符来访问对象的成员。这意味着要获取 Frisky 的正确年龄，你需要写出类似 frisky.itsAge=10 的代码。你可以对所有想要赋值的对象进行此操作。


    在上面的例子中，我们定义了许多可以从类对象中访问的变量。但这并不总是最方便的获取所有变量的方式。还有其他方法可以让类的成员返回。访问器方法是最佳选择，因为它能够提供信息或将其封装到语法中。


    class Cat(object)


    itsAge = None


    itsWeight = None


    itsName = None


    #使用访问器函数来赋值给字段或成员变量


    def setItsAge(self, itsAge):


    self.itsAge = itsAge


    def setItsWeight(self, itsWeight):


    self.itsWeight = itsWeight


    def setItsName(self, itsName):


    self.itsName = itsName


    #get 访问器函数用于返回字段的值


    def getItsAge(self):


    return self.itsAge


    def getItsWeight(self):


    return self.itsWeight


    def getItsName(self):


    return self.itsName


    objFrisky = Cat()


    objFrisky.setItsAge(5)


    objFrisky.setItsWeight(10)


    objFrisky.setItsName(“Frisky”)


    print(“Cats Name is:”, objFrisky.getItsname())


    print(“Its age is:”, objFrisky.getItsAge())


    print(“Its weight is:”, objFrisky.getItsName())


    从以上示例可以看出，使用访问器方法来获取你想要的变量。这通常用于数据封装或数据隐藏。封装会在变量成为私有或受保护时实现，但由于你使用的是 Python 语言，所有变量成员默认是公共的。


    记住，Python 中不会出现 public、protected 或 private 这样的可访问性关键字。因为所有成员默认是公共的，所以请记住在开始使用时要注意这一点。


    属性


    在 Python 中，属性是指获取和设置值的部分。它的工作方式类似于 Python 中的其他方法，但其语法比其他方法更容易学习和使用。


    在上面的猫类示例中，你已经拥有了 setter 和 getter 方法。属性的 setter 可以为成员变量赋值，而 getter 则返回成员变量的值。


    静态方法和实例


    '
