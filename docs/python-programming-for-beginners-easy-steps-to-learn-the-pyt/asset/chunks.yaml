    \ out the following syntax:\n\nimport re\n\nstring = ‘apple, orange, mango, orange’\n\
    \nmatch = re.search(r’orange’, string)\n\nprint(match.group(0))\n\nWhen you take\
    \ some time to place this code into your interpreter, you will find that the output\
