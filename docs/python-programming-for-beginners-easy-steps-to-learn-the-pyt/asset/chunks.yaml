- raw: "If you do have a reason to use the overloading process, you will need to make\
    \ sure that you download the right module to help you get this done. A good place\
    \ to go to get a good module to finish this up is [https://github.com/bintoro/overloading.py](https://github.com/bintoro/overloading.py).\
    \ \n\nMethod Overloading\n\nIn one of the newer versions of Python, there is a\
    \ new feature that has been added that will make it easier to do method overloads.\
    \ This is going to make it possible to perform different operations depending\
    \ on what type of statement you are using in your first argument. \n\nWhen you\
    \ are making a generic function, you will have one that is composed of different\
    \ functions that are implementing the same operation over different types. Which\
    \ type of implementation you are choosing or which one you should use during this\
    \ time is often determined by the dispatch algorithm. When the program chooses\
    \ the implementation from just one of your arguments that is on its own, this\
    \ is called a single dispatch. \n\nTo define this generic function, you will need\
    \ to use the right decorator. This is usually the @singledispatch decorator. Keep\
    \ in mind that this dispatch is going to happen just with the first argument.\
    \ \n\nMultiple inheritance\n\nAnother feature that you may want to work with inside\
    \ of Python is multiple inheritance. We have already discussed how to go through\
    \ and do one inheritance and how you will be able to use the features of the parent\
    \ code to work with the child code while also making the corrections that are\
    \ needed. But you can take this a step further and do multiple inheritance. \n\
    \nThe multiple inheritance is a feature where a class is going to have two or\
    \ more parent classes. As long as you do this properly, you will be able to use\
    \ as many parent classes as you would like within the new child class. What basically\
    \ happens is that you are creating a new class, ClassC, and it is created from\
    \ the features of ClassB. ClassB was designed from ClassA, meaning that ClassC\
    \ is going to have some features from both ClassB and ClassA to make it work.\
    \ You will be able to make adjustments at each level, but you will get some of\
    \ the features of the parent class into the child one. \n\nKeep in mind that when\
    \ you are working with multiple inheritances, you will not be able to do circular\
    \ inheritance with Python. But it is possible to use two or more parent classes\
    \ in order to create the new child code that you would like to use in Python.\
    \ \n\nThere are many times when you are going to want to use inheritances inside\
    \ of your code because it is easier. You will be able to use some of the methods\
    \ and features from codes that you already wrote and then put them into a new\
    \ one, adding in some extra features and making changes as you would like. It\
    \ is even possible to use a few different method parents to make new ones if this\
    \ will work the best inside of your code. \n\nThere are many options that you\
    \ are able to do with inheritances and these will make your code look amazing\
    \ if you do it right. You can just keep carrying the inheritance down in the code\
    \ as much as you would like, making changes each time or keeping them pretty much\
    \ the same. It will all depend on the things that you want to happen in your code.\
    \ \n\n# Chapter 9: Creating Loops in Python\n\nWhile the decision control statements\
    \ add some good power to the code and can help you to do a lot more than before,\
    \ it is definitely a good idea to work with the loops inside of the  Python program.\
    \ These are helpful any time that you need the program to repeat something inside\
    \ of the code, but you don’t want to write the code out over and over again. For\
    \ example, if you would like the code to list all the numbers from 1 to 10, it\
    \ probably wouldn’t be much fun to write out the code to tell the compiler to\
    \ write out 1 and then write it again for 2, and so on until you reach 10. You\
    \ could use the idea of looping in Python to get this all done in one block of\
    \ code to save time and to make the code easier to read. \n\nLoops are pretty\
    \ easy to work with. They are basically going to tell the compiler to keep on\
    \ reaidng the same block of code over and over until some condition is met. If\
    \ you would like the code to count from 1 to 10, you would just need to tell the\
    \ code to stop going once it got higher than 10 (we will look at some codes that\
    \ show how this is done). You do need to be careful with this though because if\
    \ you don’t set out the condition ahead of time, the code is going to end up in\
    \ a continuous loop and will get stuck. So always make sure that you set out the\
    \ break of the code, or the part that will make the loop stop and move on to another\
    \ part of the code to read. \n\nThere are several types of loops that you can\
    \ work with to help make the program work the way that you would like. The two\
    \ we are going to talk about in this guidebook are the while loop and the for\
    \ loop. \n\nWhat is the while loop?\n\nOne of the loop types that you are able\
    \ to work on is known as the while loop. This is the one that you will want to\
    \ use whenever the code should go through the cycle a fixed amount of times. You\
    \ don’t want this code to go through the cycle indefinitely, but you want to make\
    \ sure that it goes through the right amount of times. Often this is the one that\
    \ will repeat at least one time before it sees whether the code is true or false\
    \ so it can be helpful if you would like to use it in this manner. To understand\
    \ better how this is going to work, let’s look at a good example of the while\
    \ loop:\n\n#calculation of simple interest. Ask user to input principal, rate\
    \ of interest, number of years.\n\ncounter = 1\n\nwhile(counter <= 3):\n\nprincipal\
    \ = int(input(“Enter the principal amount:”))\n\nnumberofyeras = int(input(“Enter\
    \ the number of years:”))\n\nrateofinterest = float(input(“Enter the rate of interest:”))\n\
    \nsimpleinterest = principal \\* numberofyears \\* rateofinterest/100\n\nprint(“Simple\
    \ interest = %.2f” %simpleinterest)\n\n#increase the counter by 1\n\ncounter =\
    \ counter + 1\n\nprint(“You have calculated simple interest for 3 time!”)\n\n\
    Once you have the time to put this in your compiler and execute the code, you\
    \ will see that the output is going to come out so that your user is able to place\
    \ in the information, any information, that they wish to have computed. The program\
    \ is going to be able to figure out the rates of interest as well as the final\
    \ amount based on the numbers that the user places into the system. Right now\
    \ this loop is set up to go through three times, but you are able to change it\
    \ around and get it to do more loops if you would like. \n\nHow is the for loop\
    \ different?\n\nThere are many times that the while loop will be your friend and\
    \ can help you to get a lot of things done, but there are other times when the\
    \ for loop is useful. The for loop is considered a more traditional way to write\
    \ out the loop, but there are many times when you will want to use it. \n\nIn\
    \ this kind of loop, the user won’t be able to go in and give the right information\
    \ or determine when the loop is able to stop. Rather, with the for loop, Python\
    \ will go over the iteration in the order that they show up inside of your statement\
    \ and it will show this information on the screen, without needing input from\
    \ someone else, until it reaches the end. A good example of how this may work\
    \ includes:\n\n\\# Measure some strings:\n\nwords = \\[‘apple’, ‘mango’, ‘banana’,\
    \ ‘orange’\\]\n\nfor w in words:\n\nprint(w, len(w))\n\nNow, when working on the\
    \ example above, you will be able to put it into your code and when it is executed,\
    \ the four fruits will come out onto the screen, in the exact order that they\
    \ are already written. Any time that you would like to have them come out on the\
    \ screen in a slightly different order, you will just need to go back to the syntax\
    \ and change that up. Once they are in the syntax and ready to be used inside\
    \ of the code, you will not be able to make these changes. \n\nThe nested loop"
