    \ Steering’)\n\n(‘Wheels:’, 4)\n\n(‘Clutch:’. ‘Super Clutch’)\n\n(‘Breaks:’, ‘Disk\
    \ Breaks’)\n\n(‘Gears:’, 5)\n\nWhen you look through this example you are going\
