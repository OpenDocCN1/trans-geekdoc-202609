  trans: "\n这些消息在用户输入系统不允许的内容时会显示在屏幕上。与其直接出现错误消息相比，这些消息会更友好。如果你创建消息的方式正确，它实际上会真正帮助用户。通过消息，用户可以看到他们在代码中做了什么错误，然后进行修改，使其运行正确。\n\
    \n以下是你可以在代码中编写的示例，以显示消息而不是之前的错误：\n\n`x = 10`\n\n`y = 0`\n\n`result = 0`\n\n```python\n\
    try:\n    result = x / y\n    print(result)\nexcept ZeroDivisionError:\n    print(\"\
    You are trying to divide by zero.\")\n```\n\n仔细观察这个语法，你会发现它与前面的示例非常相似，但有一个变化。程序仍然会检测到你正在处理异常，但你可以向用户发送消息，告知代码中存在问题。与上面的示例不同，这里会显示消息“You\
    \ are trying to divide by zero.”，这会给用户一个更清晰的提示，让他们有机会回去修改输入。\n\n自定义异常\n\n在上面的示例中，我们查看了如何处理用户执行的操作导致\
    \ Python 系统不允许的异常。这些例子展示了当用户尝试在程序中除以零时会发生什么。但你可以在任何需要时为程序创建异常，即使 Python 本身允许这种操作。有些程序需要限制某些输入，通过将这些情况设计为异常来处理，可以确保程序按预期工作。\n\
    \n例如，如果你想确保用户不能输入特定的数字，你需要在程序中添加相应的异常。如果你想允许用户为他们正在工作的部分输入两个或更多的猜测，你也可以为此创建异常。关键在于，Python\
    \ 程序本身不会认为用户输入有问题，但由于你程序的设计，如果允许所有输入，会导致问题。这在处理年龄时是一个很好的例子。用户说他们 20 岁没有问题，但如果你是一个只允许\
    \ 21 岁及以上的人使用的赌博网站，你需要创建一个异常，表明年龄小于 21 的人不能访问该网站。\n\n只要你的自定义异常类符合 Python 规则，并且遵循你正在创建的程序的规则，你就可以创建任何异常类。如果你不想在代码中发生某些操作，比如输入特定的答案、字母、数字或其他内容，你需要将这些作为异常添加到程序中。以下是一个你可以遵循的示例，帮助你创建这些异常：\n\
    \n```python\nclass CustomException(Exception):\n    def __init__(self, value):\n\
    \        self.parameter = value\n\n    def __str__(self):\n        return repr(self.parameter)\n\
    \ntry:\n    raise CustomException(\"This is a CustomError!\")\nexcept CustomException\
    \ as ex:\n    print(\"Caught:\", ex.parameter)\n```\n\n使用这种语法会显示“Caught: This\
    \ is a CustomError!”，并在用户输入错误信息时根据你设定的条件触发。这是一种很好的方式来表明程序内部发生了自定义异常，特别是当这个异常是你自己设计的，而不是系统自带的。\n\
    \n记住，你可以自由地修改消息的措辞。你不必局限于使用上面列出的默认消息。你可以将其作为起点，或者根据你的程序需要进行调整。例如，如果你是一个赌博网站并且不允许任何未满\
    \ 21 岁的人进入，你可能会想在消息中包含关于这一点的说明<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><