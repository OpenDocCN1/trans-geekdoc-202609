    \ operations\n\n#writing to a new file hello.txt\n\nf = open(`hello.txt`, `w`,\
    \ encoding = `utf-8`)\n\nf.write(`Hello Python Developers!`)\n\nf.write(`Welcome\
    \ to Python World`)\n\nf.flush()\n\nf.close()\n\nWhen you are working on this\
    \ particular code, you are telling the compiler that you want all the things that\
    \ are created in this file to end up in the current directory since you didn’t\
    \ tell the system a different location where you wanted to send everything. So\
    \ if you would like to find this, you would be able to find this hello.txt file\
    \ inside your current directory. Take a moment to look for this file and then\
    \ try to get it to open. You should notice that there will be a message that comes\
    \ up on your screen that says “Hello Python Developers! Welcome to Python World!”\
    \ as long as you typed everything into the code properly.\n\nNow that we have\
    \ written a simple code inside of this language, it is time to take it all to\
    \ the next step. You could choose to rewrite some of the parts of this language\
    \ so that they will show up with different messages on the screen or in a different\
    \ way. You will need to make some changes to the code that you are using, but\
    \ this is still a pretty simple process to complete. Below is a simple example\
    \ of what you are able to do when you want to make some changes to your syntax\
    \ in order to rewrite your code:\n\n#file handling operations\n\n#writing to a\
    \ new file hello.txt\n\nf = open(`hello.txt`, `w`, encoding = `utf-8`)\n\nf.write(`Hello\
    \ Python Developers!`)\n\nf.write(`Welcome to Python World`)\n\nmylist = [`Apple`,\
    \ `Orange`, `Banana`]\n\n#writelines() is used to write multiple lines in to the\
    \ file\n\nf.write(mylist)\n\nf.flush()\n\nf.close()\n\nThe above example is going\
    \ to be a simple example of how you will be able to make some changes inside of\
    \ your file since you just need to add in an additional line. You will be able\
    \ to write in as many of these lines as you would like to get some good results.\
    \ If you typed all of this inside of your compiler and asked the compiler to interpret\
    \ the results, you would get this message to come across your screen: “Hello Python\
    \ Developers! Welcome to Python World. Apple Orange Banana.”\n\nWorking on your\
    \ binary files\n\nIn some instances, when you are working on your data, you may\
    \ want to write it out as a binary file. This may seem a bit complicated at the\
    \ beginning, it is actually a pretty simple to work with. You will simply be writing\
    \ out your data as a sound or image file rather than a text file in this process.\
    \ You can easily change any of the text that you are working on into a binary\
    \ file, regardless of the file type that you were using in the beginning, you\
    \ just need to follow the right steps to get it changed. You must remember to\
    \ supply the data into the object form so that the compiler is able to expose\
    \ this as a byte. A good way to write out the syntax for doing this includes:\n\
    \n\\# write binary data to a file\n\n\\# writing the file hello.dat write binary\
    \ mode\n\nF = open(`hello.dat`, `wb`)\n\n\\# writing as byte strings\n\nf.write(b`I\
    \ am writing data in binary file!/n`)\n\nf.write(b`Let’s write another list/n`)\n\
    \nf.close()\n\nOnce this has been written into the compiler, you can then bring\
    \ out your notepad so that you can see what is all written for the program. It\
    \ is important to remember that you must decode and encode your functions so that\
    \ it is easier to read and write with these codes once you are in the binary file\
    \ mode. To get this to happen, you will just need to write out the following syntax:\n\
    \n\\# write binary data to a file\n\n\\# writing the file hello.dat write binary\
    \ mode\n\nf = open(`hello.dat`, `wb`)\n\ntext = `Hello World`\n\nf.write(text.encode(`utf-8`))\n\
    \nf.close()\n\nOpening up a new file\n\nSo far we have taken a look at how you\
    \ are able to design the file so that it will save for you to find later. But\
    \ now it is time to move over to opening up the files that you have saved so that\
    \ you can use them again. Any code that you have saved this far has been stored\
    \ on some disks inside whichever computer is using them, so you just need to find\
    \ them, bring them back up, and then you are able to read all the way through\
    \ them. A good syntax that you should use when you want to open up the file includes:\n\
    \n\\# read binary data to a file\n\n#writing the file hello.dat write append binary\
    \ mode\n\nwith open(`hello.dat`, `rb`) as f:\n\ndata = f.read()\n\ntext = data.decode(`utf-8`(\n\
    \nprint(text)\n\nthe output that you would get form putting this into the system\
    \ would be like the following:\n\nHello world!\n\nThis is a demo using with\n\n\
    This file contains three lines\n\nHello world\n\nThis is a demo using with\n\n\
    This file contains three lines. \n\nYou can use this to open up any of the files\
    \ that are on your system. This is a simple syntax and makes it easier to find\
    \ the files that you would like and open them up so that you can either read them\
    \ again, make some changes, or use the codes that you have written. As you can\
    \ see, this is a simple process, part of why Python is so popular to use, and\
    \ you will be able to use it to open up any of the files that are on your system.\
    \ \n\nMoving your files\n\nIn addition to writing out a new file, saving it, or\
    \ opening up one of the files that you saved, there are also going to be times\
    \ when you will want to move one of the file locations. You may want to put them\
    \ in a new place that is easier to find or you may have made a new folder that\
    \ you want to put a few of the files inside for easier access. There may even\
    \ be times when things don’t match up the way that you would like, such as words\
    \ that are not spelled right in the code or something else, and making some moves\
    \ could make it easier to work within the files of your system. \n\nYou can always\
    \ choose to move some of the file locations so that they end up in the right spot,\
    \ or so that they are easy for you to find on the system. You will just need to\
    \ take some time to go inside and find the file and tell your code where you would\
    \ like to have it moved. Once your program finds the new location, you can easily\
    \ go inside, make the changes, and get them all moved. This may sound a bit complicated\
    \ in the beginning, but you will find that it can be pretty easy once you try\
    \ it out. \n\nSo the trick here is to find out where the original file is currently\
    \ located before you are able to move it. For the most part, if you didn’t specify\
    \ where the file should go, it is going to be in the current drive until you move\
    \ it around. You can go to the current drive, or wherever you stored the information\
    \ inside the system, and open up the file using the tricks that we did earlier.\
    \ Now that you are inside the system, you will be able to make some changes to\
    \ the code, choose where you would like to move it (such as giving it a new name\
    \ or finally specifying where you would like to place it), and so much more. \n"
  trans: "\n`write(w)`函数使用非常简单，你可以用它来创建很多东西。你可以通过在代码中写入内容来启动一个新文件，也可以修改文件中已有的内容。这都取决于你想在完成代码后看到代码中包含什么内容。\n\
    \n下面是一个使用`write(w)`函数在 Python 中开始新文件的好例子：\n\n# 文件操作\n\n# 向新文件 hello.txt 写入\n\n\
    f = open(`hello.txt`, `w`, encoding = `utf-8`)\n\nf.write(`Hello Python Developers!`)\n\
    \nf.write(`Welcome to Python World`)\n\nf.flush()\n\nf.close()\n\n当你在编写这段代码时，你告诉编译器你希望将文件中创建的所有内容保存到当前目录（因为你没有指定其他位置）。因此，如果你想找到这个文件，它会在当前目录中。花点时间去查找这个文件，然后尝试打开它。你会看到屏幕上出现“Hello\
    \ Python Developers! Welcome to Python World!”的提示，只要你正确输入了代码内容。\n\n我们已经编写了一段简单的代码，现在是时候继续下一步了。你可以选择修改代码的某些部分，使其在屏幕上显示不同的消息或以不同方式呈现。你需要对正在使用的代码进行一些修改，但这仍然是一个简单的过程。下面是一个当你想要修改语法以重写代码时可以做的简单示例：\n\
    \n# 文件操作\n\n# 向新文件 hello.txt 写入\n\nf = open(`hello.txt`, `w`, encoding = `utf-8`)\n\
    \nf.write(`Hello Python Developers!`)\n\nf.write(`Welcome to Python World`)\n\n\
    mylist = [`Apple`, `Orange`, `Banana`]\n\n# writelines()用于向文件写入多行内容\n\nf.write(mylist)\n\
    \nf.flush()\n\nf.close()\n\n上述示例展示了如何在文件中添加额外内容。你可以添加尽可能多的行来获得更好的结果。如果你在编译器中输入所有内容并要求编译器解释结果，你会在屏幕上看到“Hello\
    \ Python Developers! Welcome to Python World. Apple Orange Banana.”的提示。\n\n处理二进制文件\n\
    \n在某些情况下，当你处理数据时，可能希望以二进制文件的形式写入数据。这在一开始可能看起来有点复杂，但实际上使用起来很简单。你只需将数据作为声音或图像文件而非文本文件来写入。你可以轻松地将任何文本转换为二进制文件，无论最初使用的是哪种文件类型，你只需遵循正确的步骤进行转换。请记住，必须将数据以字节形式提供，以便编译器能够将其暴露为字节。一个良好的写入二进制数据语法示例包括：\n\
    \n# 向文件写入二进制数据\n\n# 向 hello.dat 文件写入二进制模式\n\nF = open(`hello.dat`, `wb`)\n\n#\
    \ 以字节字符串写入\n\nf.write(b`I am writing data in binary file!/n`)\n\nf.write(b`Let’s\
    \ write another list/n`)\n\nf.close()\n\n将这些内容写入编译器后，你可以打开记事本查看程序中写入的所有内容。记住，在二进制文件模式下，你需要对函数进行编码和解码，以便在读取和写入时更方便。要实现这一点，只需编写以下语法：\n\
    \n# 向文件写入二进制数据\n\n# 向 hello.dat 文件写入二进制模式\n\nf = open(`hello.dat`, `wb`)\n\ntext\
    \ = `Hello World`\n\nf.write(text.encode(`utf-8`))\n\nf.close()\n\n# 打开新文件\n\n\
    到目前为止，我们已经了解了如何设计文件以便以后方便查找。现在是时候打开之前保存的文件并再次使用它们了。迄今为止你保存的所有代码都存储在计算机的某个磁盘中，你只需找到它们，恢复它们，然后就能完整阅读它们。当你想要打开文件时，应该使用以下语法：\n\
    \n# 读取二进制文件数据\n\n# 打开 hello.dat 文件追加二进制模式\n\nwith open(`hello.dat`, `rb`) as f:\n\
    \ndata = f.read()\n\ntext = data.decode(`utf-8`(\n\nprint(text)\n\n使用这段代码得到的输出将是：\n\
    \nHello world!\n\nThis is a demo using with\n\nThis file contains three lines\n\
    \nHello world\n\nThis is a demo using with\n\nThis file contains three lines.\
    \ \n\n你可以使用这段语法打开系统中任何文件。这是一个简单的语法，使你更容易找到并打开想要的文件，以便重新阅读、修改或使用其中的代码。如你所见，这部分过程简单，这也是\
    \ Python 为何如此流行的原因之一，你可以用它打开系统上任何文件。\n\n移动文件\n\n除了创建新文件、保存文件或打开已保存的文件外，有时你也会想要移动文件的位置。你可能希望将它们移动到更容易找到的地方，或者创建了一个新文件夹来存放几个文件以便于访问。也有可能出现文件名拼写错误或其他问题，使得文件无法正确匹配，此时进行移动可能会让你更轻松地在系统的文件中工作。\n\
    \n你可以选择将文件移动到正确的位置，或者让它们更容易在系统中查找。你只需花点时间找到文件，并告诉代码你希望将其移动到哪里。一旦程序找到新位置，你就可以轻松地进入文件，进行修改，并完成移动。这在开始时可能听起来有点复杂，但一旦你尝试，就会发现它其实很简单。\n\
    \n关键在于在移动文件之前找出它当前所在位置。通常，如果你没有指定文件应该去哪里，它会保留在当前驱动器中，直到你将其移动。你可以访问当前驱动器，或者在系统中存储信息的位置，使用之前的技巧打开文件。进入系统后，你可以对代码进行修改，选择想要移动的位置（例如给它重命名或指定存放位置），并做更多操作。\n\
    \n"
