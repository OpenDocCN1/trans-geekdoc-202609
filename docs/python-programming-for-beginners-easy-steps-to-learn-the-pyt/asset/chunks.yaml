    \ tab, return, newline, and even space. If you do `\\S`, you are talking about\
    \ any character that is not a white space.\n\n6.  `^ = start, $ = end`—these are\
    \ going to match to the end or the start of your string.\n\n7.  `\\t`, `\\n`,\
    \ `\\r`—these are going to stand for tab, newline, and return\n\n8.  `\\d`—this\
    \ is the decimal digit for all numbers between 0 and 9. Some of the older regex\
    \ utilities will not support this so be careful when using it\n\n9.  `\\`—this\
    \ is going to inhibit how special the character is. If you use this if you are\
    \ uncertain about whether the character has some special meaning or not to ensure\
    \ that it is treated just like another character. \n\nMake sure that you learn\
    \ how these patterns work because they are going to really help you to communicate\
    \ with the interpreter and let it know what you are working on inside the code\
    \ you create. You should learn how some of these symbols work and practice inside\
    \ the interpreter to see what is going to come up when you try out different things.\
    \ If you use the symbols in the correct way, you will find that your code is going\
    \ to execute beautifully and there shouldn’t be any problems. On the other hand,\
    \ if you mess up on a sign or on something else within the code, you may find\
    \ that you get an error message, the interpreter gets a bit confused, or the wrong\
    \ messages come up on your screen. \n\nDoing a query with the help of expressions\n\
    \nAt this point, we are going to work on using these expressions in order to create\
    \ a query. There are a few different queries that you will be able to use and\
    \ it often depends on what you want the regular expression to do before you pick\
    \ the method that you will use. There are three types of methods that work for\
    \ this kind of action and they include:\n\n`re.findall()`\n\n`re.match()`\n\n\
    `re.search()`\n\nRight now these are all just some words in the code that you\
    \ may not understand all that well, but in the next few parts, we are going to\
    \ look at what each of them mean, how these options are a bit different from each\
    \ other, and help you to learn when you are supposed to use each one in your code\
    \ writing. \n\nThe search method\n"
