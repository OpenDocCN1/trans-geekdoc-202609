- raw: "Keep in mind that while you can make the objects of a class be anything that\
    \ you like, you should consider placing ones that are similar in the same class.\
    \ This just makes it easier to keep things together and can give your code a more\
    \ coherent look. With a bit of organization and thinking ahead, you are going\
    \ to be able to keep all the parts of your code in order so that you get the interpreter\
    \ to read them exactly the way that you want. \n\nBefore we get too far with creating\
    \ classes, there are a few things that you need to keep in mind including:\n\n\
    *   Objects that are found inside the same class are going to have the same structures,\
    \ but they are allowed to differ a bit. For example, if you have a class of vehicles,\
    \ you can put any vehicle you want inside of it including cars, vans, trucks,\
    \ and more. \n\n*   How to create objects by using classes with the help of instantiating\
