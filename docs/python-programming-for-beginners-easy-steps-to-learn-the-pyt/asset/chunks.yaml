  trans: "\n当你使用静态方法时，你可以在不需要创建新对象或类，或者使用新类名称的情况下调用事物。这是因为这种方法不会接受自我实例。\n\n但是当你使用实例方法时，你需要使用对象和类，并且为了使用这些，你需要在调用它们之前先创建类和对象。这是两种不同的调用方式，你需要根据是否在语法上创建新对象来决定使用哪种方式。\n\
    \n对象和类在创建语法时非常重要。对象将在语句中定义你正在使用的内容。你可以以任何方式定义它们，但要确保它们合理，并且解释器能够根据你的对象判断你想让它做什么。\n\
    \n如果你想了解这些的工作原理，你应该尝试本章中提供的几个示例。先尝试原始选项，然后混合匹配它们以获得出色的结果。\n\n# 第 6 章：异常是什么以及它们在\
    \ Python 中如何工作？\n\n当你开始使用 Python 编程语言时，你会发现有时异常会发生。根据异常的类型，你可能会在计算机上收到错误消息。每当在你的代码中出现异常情况时，你需要使用这些异常来告诉解释器在发生这些条件时该如何反应。有时，即使语句和输入在你的语言中运行得很好，但由于你正在设计的程序，你需要为该程序添加一个专门的异常。本章将花一些时间探讨\
    \ Python 程序如何处理异常，以便代码按你期望的方式工作。\n\n每当你在代码中工作并希望表明一个异常条件在代码内部发生时，就是使用异常的时机。代码中有几种会导致异常的情况。例如，当你编写代码时，你可能会输入错误的语句或拼写错误；这些可能会因为\
    \ Python 解释器找不到你想要做的事情而产生异常，并可能导致错误消息。\n\n除了代码中的异常情况外，程序员有时会在代码中自定义一些异常。在这些情况下，解释器会检查用户输入的内容，发现没有问题，但由于代码的编写方式，你希望异常显现。例如，如果你有一个用户使用你的代码且年龄为\
    \ 17 岁，而你不想让 18 岁以下的人输入内容，你可以将此转换为一个异常，告诉代码在该情况下如何行为，即使这在程序中是被允许的。\n\n在查看 Python\
    \ 程序时，你会看到库中已经预置了一些异常。当你想将这些异常添加到你的代码中时，拥有库中的一些异常会很有帮助，这能节省时间并展示它们的工作方式。Python\
    \ 库中包含多种不同类型的异常，包括当你尝试将数字除以零（这将在你尝试这样做时显示错误消息），或者当你尝试读取文件末尾时。\n\nPython 中异常的好处是，即使发生这些错误，你也可以进行修改使其运行得更好。例如，与其让计算机在尝试除以零时声称发生错误，你可以改为给出一个消息解释为什么这不被允许。与其声明发生错误，你可以让出现一个消息，例如“你正在尝试除以零！这是不允许的。”这告诉用户为什么在程序中被禁止做某事，而不是让他们去猜测错误消息的含义。\n\
    \n如果你想在代码中实现的异常不在 Python 库中，这也是一种选择。你将学习如何手动触发一些异常，最好是带有你设置的消息，这样错误会显示在屏幕上，让用户知道你为什么不允许该答案。\n\
    \n在 Python 中处理异常时，你会在库中找到几个选项，需要了解并正确使用它们，以便异常（无论是程序设定的还是你创建的）能够正常工作。一些用于在 Python\
    \ 中处理异常的语句包括：\n\n*   **Finally**—这是用于执行清理操作的语句，无论异常是否发生。\n\n*   **Assert**—这个条件会在代码中触发异常。\n\
    \n*   **Raise**—raise 命令用于在代码中手动触发异常。\n\n*   **Try/except**—这是当你想尝试执行一段代码，然后通过异常（无论是你还是\
    \ Python 代码触发的）来恢复的情况。\n\n目前，这些可能不太符合你处理异常的使用方式，但我们将花一些时间详细讨论每个语句，并说明它们如何在你的代码中发挥作用。\n\
    \n**触发异常**\n\n触发异常是一个简单的概念。当你在代码中工作并发现有问题，或者程序试图做某事但不在 Python 的限制范围内，你的 Python\
    \ 程序会为这种行为触发异常。这是因为程序不理解如何处理这些问题。有时，你会发现异常很简单，因为你可能错误地命名了某些东西，只需在代码中修改即可。或者，可能存在用户尝试除以零的问题，这是系统不允许的。下面是一个例子：\n\
    \nx = 10\n\ny = 10\n\nresult = x/y #尝试除以零\n\nprint(result)\n\n当你尝试让解释器执行这段代码时，你将得到以下输出：\n\
    \n\\>>>\n\nTraceback (most recent call last):\n\nFile \"D: \\\\Python34\\\\tt.py\"\
    , line 3, in <module> \n\nresult = x/y\n\nZeroDivisionError: division by zero\n\
    \n\\>>>\n\n在这个例子中，Python 程序因为你试图将一个数除以零而触发了错误。这是 Python 语言的行为，你会看到错误出现。如前所述，当这种错误出现时，它可能对用户来说有点困惑，他们可能不明白为什么会出现错误，因此你可以进行修改使代码更友好。显示一个新的消息会让用户更容易理解，比起仅仅看到标准错误信息更友好。\n\
    \n"
