    ]:\n\n\\[attributes and methods\\]\n\nThe object instantiation syntax will look\
    \ like the following\n\nobject = class()\n\nWhen you want to invoke the methods\
    \ and attributes within the syntax you will use the following options:\n\nobject.attribute\n\
    \nobject.method()\n\nSpecial attributes that you can use in Python\n\nThere are\
    \ some attributes that are special inside of Python. These are good to know about\
    \ because they will make it easier to work on the code and you will be able to\
    \ use them with the knowledge that the interpreter has an idea of how to read\
    \ them. Some of the attributes that you should learn how to use within some of\
    \ your codes include:\n\n\\_\\_dict\\_\\_\\_   this is the dict variable of a\
    \ class name space\n\n\\_\\_doc\\_\\_    this is the document reference string\
    \ of class\n\n\\_\\_name\\_\\_\\_  this will be the class name\n\n\\_\\_module\\\
    _\\_this is the module name and consists of the class\n\n\\_\\_bases\\_\\_this\
    \ is the tuple that will also contain all of the superclasses\n\nLet’s take a\
    \ look at how this may work within one of the syntaxes that you may choose to\
    \ work with. \n\nclass Cat(object):\n\nitsWeight = 0\n\nitsAge = 0\n\nitsName\
