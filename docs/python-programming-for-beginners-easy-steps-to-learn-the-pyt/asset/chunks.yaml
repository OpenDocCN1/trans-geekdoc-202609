    如果你确实需要使用过载处理，确保下载正确的模块以完成此任务。获取一个好的模块的好去处是 [`https://github.com/bintoro/overloading.py`](https://github.com/bintoro/overloading.py)。


    方法重载


    在 Python 的较新版本中，有一项新功能被添加，它将使使用方法重载变得更加容易。这将使你能够根据你在第一个参数中使用的语句类型来执行不同的操作。


    当你编写一个通用函数时，你会有一个由多个函数组成的函数，这些函数实现相同的操作但针对不同的类型。在什么时候选择哪种实现，或者在什么时候使用哪一个，通常由分派算法决定。当程序仅从一个独立的参数中选择实现时，这称为单分派。


    要定义这个通用函数，你需要使用正确的装饰器。通常是 `@singledispatch` 装饰器。请记住，这种分派仅针对第一个参数发生。


    多重继承


    另一个你可能想在 Python 中使用的特性是多重继承。我们已经讨论过如何进行单一继承以及如何使用父类的特性来与子类一起工作，同时进行必要的修正。但你可以进一步提升，实现多重继承。


    多重继承是一个特性，其中类会有两个或多个父类。只要正确操作，你就可以在新的子类中使用尽可能多的父类特性。基本上，你是在创建一个新类 `ClassC`，它继承自
    `ClassB`。`ClassB` 是基于 `ClassA` 设计的，这意味着 `ClassC` 将结合 `ClassB` 和 `ClassA` 的特性来工作。你可以在每个层级进行调整，但你会将父类的一些特性传递给子类。


    请记住，在使用多重继承时，Python 不允许循环继承。但你可以使用两个或多个父类来创建你想要的新子类代码。


    你在代码中使用继承的情况很多，因为它更方便。你可以复用你已有的代码中的方法和特性，放入新类中，添加额外功能并按你的意愿进行修改。甚至可以使用几种不同的方法父类来创建新的类，如果这在你的代码中效果最佳。


    如果正确使用继承，你的代码将会非常出色。你可以一直向下传递继承，每次进行修改或保持不变。这完全取决于你希望在代码中实现的效果。


    # 章节 9：在 Python 中创建循环


    虽然控制语句为代码增加了良好的能力，使其比以前更强大，能够实现更多功能，但使用循环在 Python 程序中是个好主意。这些循环在你需要程序重复执行某些代码，但不想一遍又一遍地重复书写代码时非常有用。例如，如果你想让代码列出从
    1 到 10 的所有数字，手动编写每个数字的代码会很无聊，需要反复输入 1、2、3…直到 10。使用 Python 的循环功能，你可以在一段代码中完成这件事，节省时间并让代码更易读。


    循环操作简单。它们基本上会指示编译器反复执行同一段代码，直到满足某个条件为止。如果你想让代码从 1 到 10 计数，只需指示代码在数值超过 10 时停止（我们稍后会查看一些示例代码）。但要注意，如果没有提前设置停止条件，代码可能会陷入无限循环并卡住。因此，务必设置退出条件，即让循环停止并继续执行代码的其他部分。


    你可以使用多种类型的循环来实现想要的程序行为。本指南将讨论两种主要的循环：`while` 循环和 `for` 循环。


    什么是 `while` 循环？


    `while` 循环是一种循环类型，适用于代码需要在固定次数内执行的情况。你不希望代码无限循环，而是希望它在正确的次数内运行。通常，`while` 循环会在检查条件之前或之后至少执行一次，这对于需要至少执行一次再判断条件的情况很有帮助。为了更好地理解其工作原理，让我们看一个
    `while` 循环的示例：


    # 计算简单利息。请用户输入本金、利率和年数。


    counter = 1


    while(counter <= 3):


    principal = int(input("Enter the principal amount:"))


    numberofyeras = int(input("Enter the number of years:"))


    rateofinterest = float(input("Enter the rate of interest:"))


    simpleinterest = principal * numberofyears * rateofinterest/100


    print("Simple interest = %.2f" %simpleinterest)


    # 增加计数器


    counter = counter + 1


    print("You have calculated simple interest for 3 time!")


    执行这段代码后，用户将被提示输入相关信息，程序会根据用户输入计算利率和最终金额。当前循环设置为执行 3 次，但你可以调整它以执行更多或更少的循环。


    `for` 循环有什么不同？


    虽然 `while` 循环在许多情况下很有用，但 `for` 循环在其他场景中更为合适。


    在 `for` 循环中，用户无法输入信息或自行决定循环何时停止。相反，Python 会按照语句中列出的顺序遍历每个迭代，并将结果显示在屏幕上，直到完成所有迭代，而无需额外输入。例如：


    # 测量一些字符串：


    words = [''apple'', ''mango'', ''banana'', ''orange'']


    for w in words:


    print(w, len(w))


    执行上述代码后，屏幕会按原顺序显示这四个水果及其长度。如果你想改变显示顺序，只需修改语法中的列表顺序即可。一旦代码中写入，就无法在运行时改变这些顺序。


    嵌套循环


    '
