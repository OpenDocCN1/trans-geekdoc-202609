  trans: '

    # 第 8 章：学习 Python 中继承的工作原理


    接下来我们将学习在 Python 中如何工作的内容是继承。这些是非常棒的，是面向对象语言中添加的一个功能。你将能够让你的代码看起来更加整洁和美观，因为你不需要再次重复书写所有代码。继承将使你能够提取并复制重要代码的部分，并将其转换到新的代码片段中，同时添加你想要的功能。


    # 继承示例


    # 基类


    class `Student`(object):


    def `\_\_init\_\_(self, name, rollno)`:


    self.name = name


    self.rollno = rollno


    # Graduate 类继承自 Student 类


    class `GraduateStudent`(`Student`):


    def `\_\_init\_\_(self, name, rollno, graduate)`:


    `Student`\_\_init\_\_(self, name, rollno)


    self.graduate = graduate


    def `DisplayGraduateStudent`(self):


    print`"Student Name:", self.name`)


    print`"Student Rollno:", self.rollno`)


    print`"Study Group:", self.graduate`)


    # 研究生类继承自 Student 类


    class `PostGraduate`(`Student`):


    def `\_\_init\_\_(self, name, rollno, postgrad)`:


    `Student`\_\_init\_\_(self, name, rollno)


    self.postgrad = postgrad


    def `DisplayPostGraduateStudent`(self):


    print`"Student Name:", self.name`)


    print`"Student Rollno:", self.rollno`)


    print`"Study Group:", self.postgrad`)


    # 实例化 Graduate 和 PostGraduate 类


    objGradStudent = `GraduateStudent`("Mainu", 1, "MS-Mathematics")


    objPostGradStudent = `PostGraduate`("Shainu", 2, "MS-CS")


    objPostGradStudent.`DisplayPostGraduateStudent`()


    当你在解释器中输入这些代码时，你将得到以下结果：


    (‘Student Name:’, ‘Mainu’)


    (‘Student Rollno:’, 1)


    (‘Student Group:’, ‘MSC-Mathematics’)


    (‘Student Name:’, ‘Shainu’)


    (‘Student Rollno:’, 2)


    (‘Student Group:’, ‘MSC-CS’)


    # 重写基类


    有时你可能需要重写基类，以便在新的派生类中使用它。这样做的基本意义是，你将在子类中替换父类的行为，使其能够在子类中存在。


    你可以使用想要的父类特征，然后在子类中添加特征并进行修改，使新类按你想要的方式工作。通过这种方法，你可以轻松地复制另一个类，避免重复相同的代码，同时仍然保持增强或定制代码的能力。


    # 重载


    在使用这些继承时，你可能还想进行重载。当你进行重载时，你基本上只是使用一个标识符来定义类中两个或多个方法，这些方法在输入和输出参数上有所不同。重载方法通常在概念上执行相同的任务，但参数设置上存在一些差异。重载还将使你能够定义两个或多个具有相同名称但不同签名的函数。


    在大多数情况下，你不需要使用这种函数。由于 Python 被认为是动态类型的程序，它很容易支持函数中的可选参数，因此你通常不需要担心使用重载过程。


    '
