    \ that you are going to need in order to make sure that the interpreter recognizes\
    \ what you are doing. \n\nClass definition syntax will be the following:\n\nclass\
    \ subclass\\[(superclass0\\]:\n\n\\[attributes and methods\\]\n\nThe object instantiation\
    \ syntax will look like the following\n\nobject = class()\n\nWhen you want to\
    \ invoke the methods and attributes within the syntax you will use the following\
    \ options:\n\nobject.attribute\n\nobject.method()\n\nSpecial attributes that you\
    \ can use in Python\n\nThere are some attributes that are special inside of Python.\
    \ These are good to know about because they will make it easier to work on the\
    \ code and you will be able to use them with the knowledge that the interpreter\
    \ has an idea of how to read them. Some of the attributes that you should learn\
    \ how to use within some of your codes include:\n\n\\_\\_dict\\_\\_\\_   this\
    \ is the dict variable of a class name space\n\n\\_\\_doc\\_\\_    this is the\
