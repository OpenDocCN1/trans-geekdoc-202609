- raw: "In addition to working with the if statement and the if…else statement, you\
    \ can also create some elif statements. These are nice because they are going\
    \ to give the user some choices that they are able to make. Each of the choices\
    \ will have a process associated with it and when the user makes a decision, these\
    \ processes will occur that correspond with the choice. This is one of those options\
    \ that are popular inside of games that let the user choose what they would like\
    \ to do inside the game. It is possible to add in as many of the elif statements\
    \ as you would like into the code, you just need to make sure that you have the\
    \ right syntax in place and that the functions are going to work out the best.\
    \ To see how the elif statements are going to look in their most basic format,\
    \ take a look at the following:\n\nif expression1:\n\nstatement(s)\n\nelif expression2:\n\
    \nstatement(s)\n\nelif expression3:\n\nstatement(s)\n\nelse:\n\nstatement(s)\n\
    \nThis is the basic syntax that you are able to use when working inside the elif\
    \ statements and you will simply be able to place whatever information you would\
    \ like into it and set up the answer that you would like to work with each of\
    \ the parts. As mentioned, this is one of the basic forms of the elif statement.\
    \ You will be able to make some of the changes that are needed into the program\
    \ in order to get many different choices for the user to enjoy and you can choose\
    \ which conditions need to be met as well as what responses you would like the\
    \ come up based on the answers that the user is providing to you. So let’s take\
    \ a look at how this would look when it is used in a code and has been expanded\
    \ out a bit more. \n\nPrint(“Let’s enjoy a Pizza! Ok, let’s go inside Pizzahut!”)\n\
    \nprint(“Waiter, Please select Pizza of your choice from the menu”)\n\npizzachoice\
    \ = int(input(“Please enter your choice of Pizza:”))\n\nif pizzachoice == 1:\n\
    \nprint(‘I want to enjoy a pizza napoletana’)\n\nelif pizzachoice == 2:\n\nprint(‘I\
    \ want to enjoy a pizza rustica’)\n\nelif pizzachoice == 3:\n\nprint(‘I want to\
    \ enjoy a pizza capricciosa’)\n\nelse:\n\nprint(“Sorry, I do not want any of the\
    \ listed pizza’s, please bring a Coca Cola for me.”)\n\nThis code is pretty simple\
    \ for you to get started with, but let’s look at what it is all going to stand\
    \ for and figure out how the user would be able to do it. This syntax is listing\
    \ out a few options that the user is able to go with and they can pick the one\
    \ that they like. For example, the user can look at this code and pick out the\
    \ number 2 in order to tell the system that they wanted the pizza rustica. If\
    \ they would rather stick with a Coca Cola rather than having any pizza at all,\
    \ they would be able to pick that choice as well. You would be able to add in\
    \ as many of these choices as you would like to go with the elif statements. If\
    \ you would like to have ten options because this goes with the program you are\
    \ creating, that is fine, it would just expand out in the same method as you see\
    \ in this section. \n\nThe if statements are some of the best commands that you\
    \ can learn how to work with inside of the Python programming language. These\
    \ statements make it easier for the user to make some decisions in what it would\
    \ like to do and you can place in the different options that you would like to\
    \ be available for them based on their answers. You can start out with a basic\
    \ if statement and just have one answer be the right one, with nothing showing\
    \ up if the user input ends up being false, or you can make it a bit more complex\
    \ by adding in some options based on whether the conditions are met or not. And\
    \ then the elif statements come into effect and allow the user to pick from numbered\
    \ options to get what they want. \n\nThe if statements will add in a lot of power\
    \ to the program that you are working with. They are a complex part of the Python\
    \ system, but even a beginner is able to learn how to work with them and all the\
    \ options that they will allow inside of your code will be amazing. Try out a\
    \ few of the syntaxes and codes that we have available in this chapter and see\
    \ how it feels to write out these statements in the command prompt as well as\
    \ learning how to use these statements to write some of your own code.\n\n# Chapter\
    \ 8: Learning How Inheritances Work in Python\n\nThe next thing that we will learn\
    \ how to work with inside of Python are inheritances. These are really great and\
    \ were an addition that was added to the OOP languages. You will be able to make\
    \ your code look a lot cleaner and nicer because you will not have to rewrite\
    \ all of it over again. Inheritance is going to allow you to go through and copy\
    \ the important parts of one code and translate them into a new part of the code,\
    \ adding in the things that you want. \n\nYou are able to use inheritances to\
    \ make things easier, to help keep things together, and you can add in a few inheritances\
    \ together to ensure that you are getting all the parts together for a new part\
    \ of the code. Here is a good example of what you may see when you are working\
    \ with inheritances in your code on Python.\n\n#Example of inheritance\n\n#base\
    \ class\n\nclass Student(object):\n\ndef\\_\\_init\\_\\_(self, name, rollno):\n\
    \nself.name = name\n\nself.rollno = rollno\n\n#Graduate class inherits or derived\
    \ from Student class\n\nclass GraduateStudent(Student):\n\ndef\\_\\_init\\_\\\
    _(self, name, rollno, graduate):\n\nStudent\\_\\_init\\_\\_(self, name, rollno)\n\
    \nself.graduate = graduate\n\ndef DisplayGraduateStudent(self):\n\nprint”Student\
    \ Name:”, self.name)\n\nprint(“Student Rollno:”, self.rollno)\n\nprint(“Study\
    \ Group:”, self.graduate)\n\n#Post Graduate class inherits from Student class\n\
    \nclass PostGraduate(Student):\n\ndef\\_\\_init\\_\\_(self, name, rollno, postgrad):\n\
    \nStudent\\_\\_init\\_\\_(self, name, rollno)\n\nself.postgrad = postgrad\n\n\
    def DisplayPostGraduateStudent(self):\n\nprint(“Student Name:”, self.name)\n\n\
    print(“Student Rollno:”, self.rollno)\n\nprint(“Study Group:”, self.postgrad)\n\
    \n#instantiate from Graduate and PostGraduate classes\n\nobjGradStudent = GraduateStudent(“Mainu”,\
    \ 1, “MS-Mathematics”)\n\nobjPostGradStudent = PostGraduate(“Shainu”, 2, “MS-CS”)\n\
    \nobjPostGradStudent.DisplayPostGraduateStudent()\n\nWhen you type this into your\
    \ interpreter, you are going to get the results:\n\n(‘Student Name:’, ‘Mainu’)\n\
    \n(‘Student Rollno:’, 1)\n\n(‘Student Group:’, ‘MSC-Mathematics’)\n\n(‘Student\
    \ Name:’, ‘Shainu’)\n\n(‘Student Rollno:’, 2)\n\n(‘Student Group:’, ‘MSC-CS’)\n\
    \nOverriding your base class\n\nThere may be times when you will need to override\
    \ the bass class so that you are able to take it into the new derived class. The\
    \ basic meaning of doing this process is that you are going to replace the parental\
    \ behavior so that it can now be present inside of your child class. \n\nYou will\
    \ be able to use the parental features that you want and then add features and\
    \ make changes inside of the child class, making the new class work the way that\
    \ you want. With this method, it is easy to copy over another class, avoid duplicating\
    \ some of the same codes, and still keeping the ability to enhance or customize\
    \ the code that you want. \n\nOverloading\n\nAnother task that you may want to\
    \ do when working on these inheritances is overloading. When you are overloading\
    \ you basically just use one identifier in order to define two or more methods\
    \ inside of a class that differ in the input as well as the output parameters.\
    \ The overload methods are going to often be used when they will execute the same\
    \ task conceptually, but there are some differences in the parameters that you\
    \ set. Overloading is also going to give you the ability to define two or more\
    \ functions with the same names, but which have different signatures. \n\nIn most\
    \ cases, you are not going to need to use this kind of function. Since Python\
    \ is considered a dynamically typed program, it is easy to support optional arguments\
    \ inside the function, so you won’t usually have to worry about using the overloading\
    \ process. "
