    \ class\n\n\\_\\_bases\\_\\_this is the tuple that will also contain all of the\
    \ superclasses\n\nLet’s take a look at how this may work within one of the syntaxes\
    \ that you may choose to work with. \n\nclass Cat(object):\n\nitsWeight = 0\n\n\
    itsAge = 0\n\nitsName = “”\n\ndefMeow(self):\n\nprint(“Meow!”)\n\ndefDisplayCat(self):\n\
    \nprint(“I am a Cat Object, My name is”, self.itsName)\n\nprint(“My age is”, self.itsAge)\n\
    \nprint(“My weight is”, self.itsWeight)\n\nfrisky = Cat()\n\nfrisky.itsAge = 10\n\
    \nfrisky.itsName = “Frisky”\n\nfrisky.DisplayCat()\n\nfrisky.Meow()\n\nWhen you\
    \ are using this as your syntax in the interpreter the result that you will get\
    \ on the screen is:\n\n(‘I am a Cat Object, My name is’, ‘Frisky’)\n\n(‘My age\
    \ is’, 10)\n\n(‘My weight is’, 0)\n\nMeow!\n\nAccessing the members of your class\n\
    \nWith the syntax that we used above, we defined the object of the cat as being\
    \ Frisky by using the dot operator in order to access the members of that object.\
    \ This means that in order to get the right age assigned to Frisky, you will need\
    \ to write out the function like frisky.itsAge=10. You can do this with all of\
    \ the different objects that you want to assign. \n\nWith the example that we\
    \ used above, there were a lot of variables that you are able to access from the\
    \ class object. But this is not always the most convenient way to go out and get\
    \ all of the variables. There are some other methods that you are going to be\
    \ able to use in order to get the members of a class to come back out. The accessor\
    \ method is one of the best because it is going to be able to provide the information\
    \ or encapsulate it into the syntax. \n\nclass Cat(object)\n\nitsAge = None\n\n\
    itsWeight = None\n\nitsName = None\n\n#set accessor function use to assign values\
    \ to the fields or member vars\n\ndef setItsAge(self, itsAge):\n\nself.itsAge\
    \ = itsAge\n\ndef setItsWeight(self, itsWeight):\n\nself.itsWeight = itsWeight\n\
    \ndef setItsName(self, itsName):\n\nself.itsName =itsName\n\n#get accessor function\
    \ use to return the values from a field\n\ndef getItsAge(self):\n\nreturn self.itsAge\n\
    \ndef getItsWeight(self):\n\nreturn self.itsWeight\n\ndef getItsName(self):\n\n\
    return self.itsName\n\nobjFrisky = Cat()\n\nobjFrisky.setItsAge(5)\n\nobjFrisky.setItsWeight(10)\n\
    \nobjFrisky.setItsName(“Frisky”)\n\nprint(“Cats Name is:”, objFrisky.getItsname())\n\
    \nprint(“Its age is:”, objFrisky.getItsAge())\n\nprint(“Its weight is:”, objFrisky.getItsName())\n\
    \nThe output that you are going to get from all of this will be the following:\n\
    \n(‘Cats Name is:’, ‘Frisky’)\n\n(Its age is:’, 5)\n\n(‘Its weight is:’, 10)\n\
    \nWith the example above, you are putting the accessor method to work in order\
    \ to get the variables that you want to work. This is often a process that you\
    \ are going to use for data encapsulation or data hiding. Encapsulation will be\
    \ done if the variables end up being private or protected, but since you are working\
    \ with the Python language, all the variable members will be default into the\
    \ public. \n\nKeep in mind that you are not going to find words like public, protected,\
    \ or private when looking at the accessibility of your members. These are not\
    \ used in Python because all of the members are going to be considered public\
    \ by default. All of your attributes are going to be public so keep this in mind\
    \ when getting started. \n\nProperty\n\nWhen you are talking about properties\
    \ in Python, you are talking about the part that gets and then sets a value. It\
    \ is going to work similar to some of the other methods in Python, but you will\
    \ find that the syntax is easier to learn and use compared to some of the others.\
    \ A property is going to be assigned just like you would assign a variable, and\
    \ this will cause the setter method to be executed. \n\nWith the cat class that\
    \ you used above, you already have the setter and getter inside the syntax. The\
    \ setter property will be able to assign the value to the member variables while\
    \ the getter property is going to return a value from the variables of the member.\
    \ \n\nStatic Methods and Instances"
