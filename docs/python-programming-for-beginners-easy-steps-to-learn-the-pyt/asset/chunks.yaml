- raw: "# Chapter 7: Working with Conditional Statements in Python\n\nAnother thing\
    \ that you are able to work with inside of the Python language is that you are\
    \ able to teach the computer to make some big decisions for you. There are times\
    \ when you will set up your conditions into the program and then the user will\
    \ put in their input. At times these answers are going to be true based on the\
    \ conditions that you set and other times they will put in some information that\
    \ is going to false based on your conditions. You will need to set up the computer\
    \ so that it can decide what it should do based on what you have put into the\
    \ system and the answer that comes up. \n\nThis chapter is going to show you some\
    \ of the basics that come from teaching the program you are making to do its own\
    \ decision making. This will add some more power to the programs and makes it\
    \ easy to work inside of your program while having a few different options come\
    \ up on the screen. \n\nFirst, let’s take a look at the different types of decision\
    \ control commands that you can make inside of your program. Some of the most\
    \ common that are found inside of Python include the switch statements, the if\
    \ statements, and the if…else statements. There are also variations of these that\
    \ you can work with that allow for more options inside of the code. \n\nAs a beginner,\
    \ we are going to start out with the most basic of these decision control commands.\
    \ This is the if statement and it is going to work on the basis of true or false.\
    \ You will set out the conditions that are true inside of your code. Then the\
    \ user is able to put in any information that they would like. If the program\
    \ determines that their answer is true based on your conditions, your message\
    \ will show up on the screen or they will be able to proceed through the program\
    \ some more. On the other hand, if the input of the user is determined to be false,\
    \ the system is going to just shut down and stop (we will take a look at how you\
    \ can leave a separate message for when the answer comes out true later on in\
    \ this chapter).\n\nThis is pretty basic and allows the system to just put up\
    \ one message based on whether the input of user is true based on your conditions.\
    \ A good example of these if statements would include the following syntax:\n\n\
    age = int(input(“Enter your age:”))\n\nif (age <=18):\n\nprint(“You are not eligible\
    \ for voting, try next election!”)\n\nprint(“Program ends”)\n\nSo when we take\
    \ a look at this syntax, there are a few points to watch out for. If your user\
    \ comes onto the site and puts that their age is 18 or under, they have matched\
    \ true to the conditions that you have set. The program will see that the input\
    \ is true and will provide them with the statement “You are not eligible for voting,\
    \ try next election!” on the screen of your user. But something a bit different\
    \ is going to happen whenever the user places an answer that is above 18, such\
    \ as 25 into the program. \n\nWhen the user puts in an answer such as 25 into\
    \ the program, the compiler is going to read that this input is considered false\
    \ based on the conditions that you have set. Since this is a basic formula for\
    \ coding, there is nothing set up for when the answer is false. The compiler is\
    \ not going to put out the statement above because that only shows up when the\
    \ conditions are considered true, but when the input is considered false, the\
    \ compiler has no instructions with the if statement on what to do in this situation.\
    \ For now, the compiler is just going to leave a blanks screen and will not continue\
    \ on with the program. \n\nAs you can see, this is not the most efficient method\
    \ that you can use with making decisions inside of your program. While it can\
    \ help you to just get the true answers that come in from  your input, and it\
    \ is a good place to get started when you are trying to write out some of your\
    \ first codes, what are you going to do when someone enters an answer that is\
    \ not considered true based on your conditions? Do you really want someone to\
    \ come to your code and then get a blank screen, or the program shutting down,\
    \ because their age or some other information doesn’t line up with your conditions,\
    \ even if the information is right? Your user may be older than 18 and it doesn’t\
    \ make sense to close down the program because it doesn’t meet with your conditions.\
    \ \n\nLuckily, there are some methods that you are able to use that will make\
    \ sure that one message is going to show up when the conditions are met and then\
    \ another message can show up when the conditions are not met. This ensures that\
    \ the user is able to see some kind of statement or message regardless of the\
    \ answer that you put up. These are going to be the if…else statements.\n\nThe\
    \ if…else statement is basically going to be in charge of making some exceptions\
    \ to the rules to help the program keep on running. You can just add in a small\
    \ little part in order to get the program to work well with the if…else statements\
    \ and to ensure that the right messages are going to show up regardless of what\
    \ answer they place into the system. A good syntax for working with the if…else\
    \ statement includes:\n\nage = int(input(“Enter your age:”))\n\nif (age <=18):\n\
    \nprint(“You are not eligible for voting, try next election!”)\n\nelse\n\nprint(“Congratulations!\
    \ You are eligible to vote. Check out your local polling station to find out more\
    \ information!)\n\nprint(“Program ends”)\n\nnow with this example, there are going\
    \ to be two options that will come up on your system. If your user inputs that\
    \ they are 18 or a younger age, the first statement “You are not eligible for\
    \ voting, try next election!” will come up on the screen. On the other hand, if\
    \ your user inputs an age that is above 19, the second message the “Congratulations!\
    \ You are eligible to vote. Check out your local polling station to find out more\
    \ information!” will come up on your screen. This is a good way to allow the user\
    \ to input any age into the system that they would like and then they will get\
    \ the corresponding message that tells them what is going on. \n\nNow this is\
    \ a pretty basic version of using the if…else statement. You can add in more than\
    \ one option if you would want. If you want to make it so that you have three\
    \ or four different age groups that people are separated out into, you can make\
    \ this happen as well. You would just need to add in another else portion as well\
    \ as the information that will tell the program what message or statement that\
    \ will come up based on the input of your user. \n\nOnce you have had some time\
    \ to get more familiar with the if statements, it is time to move over to the\
    \ if…else statements. These will add in some more options to the whole program\
    \ and will ensure that your program looks all put together and like it is working\
    \ properly. No one wants to go to a program, put in an answer, and then find out\
    \ that the screen goes blank, but this is something that can happen when you are\
    \ working with the if statements because they are too simple to handle some of\
    \ the different variations that happen in coding. Luckily, you are able to use\
    \ the if…else statement is able to fix this process and even as a beginner you\
    \ will be able to use it to make a great looking program. \n\nWorking with elif\
    \ statements"
