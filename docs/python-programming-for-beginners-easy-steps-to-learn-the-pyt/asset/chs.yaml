- "# \nPython 入门指南：轻松掌握 Python 语言，从初学者到专家！\n\n\n\n\n\n当涉及到编码世界时，需要学习的东西非常多。你可以使用的编程语言有很多种，你可以学习的指令和命令也很多，这些指令和命令会让程序以某种方式运行，除此之外你在学习过程中还可以学到很多。有时作为初学者，理解编程语言的工作方式会让人感到困惑。也许在某个时刻，你看到一些复杂的代码，觉得它对你来说太难学习如何编写。也许你曾经听别人谈论代码，感觉根本听不懂。虽然许多编程语言都有许多技术性方面，因为它们用来告诉计算机如何行为，但一旦你学习了一些基本知识，学习这些就不必那么困难了。\n\
  \n如果你对学习如何进行基础编码感兴趣，并且希望将来能够将其转变为更高级的功能，那么你需要学习如何使用 Python 编程语言。这是最容易学习的编程语言之一，因为它基于英语（所以你不需要学习复杂的单词），并且设计得非常易于阅读。即使你以前没有任何编码经验，你也会发现阅读这种语言相当简单。\n\
  \n你将能够在你的职业生涯中使用的许多不同的编程语言中进行工作，其中一些可能比 Python 更有选项或更强大。C++ 是一种流行的编程语言，它在计算机上执行许多黑客操作和其他命令，而像\
  \ Java 和 JavaScript 这样的语言非常适合在线创建网页。但对于一个能够帮助你入门编码并增强你对这个过程信心的好程序来说，Python 是你会找到的最佳选择之一。\n\
  \n在使用 Python 时，你会很早就注意到它的哲学理念。该编程语言是基于“易于使用”的理念设计的。与其让事情变得复杂和难以处理，你能够快速学习这种语言，并且所需的可读性大部分都包含在\
  \ Python 中。作为初学者，你会欣赏能够直接查看代码并理解其中内容的能力，而不是仅仅相信我们的描述。与其他选项相比，你可能会担心自己漏掉了一些细节，或者因为代码设计得太复杂而做错事；但这在\
  \ Python 中并不如此，大多数初学者都会欣赏这种语言设计的简洁性。\n\n当你开始使用 Python 时，你会发现它内置了许多让初学者觉得这是最佳学习工具的功能。你在使用\
  \ Python 时能够享受的好处和特性包括：\n\n*   语法优雅且易于阅读，即使是初学者也能轻松理解。\n\n*   语言使用非常简单，不仅能让你轻松阅读，还能避免其他编程语言常见的错误和问题。\n\
  \n*   Python 的标准库非常庞大，你可以在其中找到许多任务的指导。标准库包含帮助你连接到 web 服务器、修改文件、搜索文本等命令。作为初学者，你应该花一些时间浏览这个库，因为它能提供你开始学习这些代码所需的大部分信息。\n\
  \n*   Python 的界面是所有编程语言中最具交互性的之一。这使得初学者能够轻松测试他们的代码，看看什么在工作。如果你想尝试一下，看看一种方法是否比另一种方法更有效，Python\
  \ 语言让这变得非常容易。\n\n*   有时，你可能希望将你的工作扩展到更复杂或更强大的功能。Python 与其他编程模块（包括 C++ 和 C）很好地协同工作，因此你在将来有扩展的选项。\n\
  \n*   无论你使用什么类型的编程，或在什么操作系统上运行你的计算机，Python 都能与所有操作系统（包括 Mac、Windows、Unix 和 Linux）兼容。\n\
  \n*   Python 程序是免费的。你可以将其下载到你的计算机上，而无需支付任何费用。这是一个开源程序，你可以免费下载并用于个人使用，或者如果你觉得有勇气，你可以选择对其进行修改并开发新的更新。\n\
  \n*   即使是在这种看似简单的编程语言中，也存在一些高级功能。你会享受的一些功能包括生成器和 comprehensions，随着你在编码知识方面的提升，你会欣赏这些功能。\n\
  \n*   由于 Python 的不同数据类型是动态类型的，当这些类型混合在一起时，它们会触发异常，你需要在代码中处理这些异常。\n\n*   你会发现可以将代码分组为模块和包，以便在需要时进行组织。\n\
  \n*   最后，你会发现 Python 程序支持许多数据类型，包括数字、列表、字符串和字典。\n\n让 Python 编程在你的系统上运行非常容易。你需要在程序中放置几个部分才能让它正常工作，但总体而言你会没问题。首先，你需要确保你有一个文本编辑器，这是你编写想要在\
  \ Python 语言中使用的代码的地方。它不需要是复杂的工具。如果你在 Windows 计算机上工作，可以使用记事本作为你的文本编辑器，此外还有其他几种选项可供你使用与\
  \ Python 语言配合。\n\n\n\n\n现在我们已经掌握了一些 Python 的基础知识，并了解为什么你可能会选择这种编程语言而不是其他语言，现在是时候学习一些与这门语言相关的基础知识了。你在创建\
  \ Python 项目时，会有很多时候需要将数据存储起来，以便以后方便访问。你甚至可能希望在程序中显示这些数据，作为整体或一部分，并且希望让这能够顺利实现。\n\
  \n当你需要以这种方式存储数据时，应该创建一个“文件”，但有时你也可以在编程语言中重复使用相同的代码。让我们在这一章中花些时间创建这些文件，以便它们在你编写新代码时依然存在。\n\
  \n在文件模式中，你可以执行多种操作。你可以像在 Windows 电脑的 Word 中工作那样，保存文档。当你完成后，想要以后再打开它时，你需要保存文档；而在\
  \ Python 中，你则是用保存代码来实现这一点。你可以对文件执行的操作包括：\n\n*   创建新文件\n\n*   关闭文件\n\n*   移动文件\n\n\
  *   编辑文件以添加更多代码。\n\n这些操作将为你提供在文件中工作的选择，并确保代码在你想要的位置。学会使用这些操作可以让你更轻松地使用 Python，但一旦你练习几次，你会发现这其实是一个很简单的过程。\n\
  \n**逻辑运算符**\n\n逻辑运算符用于评估条件语句的真假。主要有三种：`or`、`and`、`not`。\n\n*   `or`: 当 `x` 为假时，会评估\
  \ `y`。如果 `x` 为真，则直接返回 `x` 的值。\n\n*   `and`: 当 `x` 为假时，会评估 `x`。如果 `x` 为真，则会继续评估 `y`。\n\
  \n*   `not`: 当 `x` 为假时返回 `True`，当 `x` 为真时返回 `False`。\n\n**赋值运算符**\n\n赋值运算符使用 `=`\
  \ 将值赋给变量。例如，要让变量等于 100，就写 `var = 100`。赋值运算符帮助编译器知道变量的值。\n\n你可以一次性赋多个值给同一个变量，只要使用正确的符号和分隔符，变量就可以保存多个值。\n\
  \n使用运算符可以让代码更易处理。你可以把变量相加，进行其他数学运算，给变量赋值，甚至进行比较，帮助理解程序的工作原理。花点时间写几段使用这些运算符的代码，会发现其实很简单！\n\
  \n## 第 11 章：准备动手实践项目？\n\n现在你已经掌握了一些 Python 的基础，是时候动手做几个小项目，让学习更有趣。通过实践，你可以巩固之前学到的知识，并为自己写代码提供额外练习。下面我们来看看几个可以尝试的项目，包括游戏和猜谜类的练习，展示\
  \ Python 的强大之处。\n\n**创建你自己的魔幻 8 球游戏**\n\n回想儿时玩魔幻 8 球的经历：提问后摇晃球体，得到有限的答案。虽然答案种类不多，但这仍是个有趣的游戏。你可以用前面学过的\
  \ Python 代码来实现同样的效果。实现魔幻 8 球所需的代码片段如下：\n\n## 导入模块\n\nimport sys\n\nimport random\
  \ \n\nans = True\n\nwhile ans:\n\n\n\nimport random\n\nquestion = raw_input(\"Ask\
  \ the magic 8 ball a question: (press enter to quit)\")\n\nanswers = random.randint(1,8)\n\
  \nif question == \"\"\n\nsys.exit()\n\nelif answers == 1:\n\nprint(\"It is certain\"\
  )\n\nelif answers == 2:\n\nprint(\"Outlook good\")\n\nelif answers == 3:\n\nprint(\"\
  You may rely on it\")\n\nelif answers == 4:\n\nprint(\"Ask again later\")\n\nelif\
  \ answers == 5:\n\nprint(\"Concentrate and ask again\")\n\nelif answers == 6:\n\n\
  print(\"Reply hazy, try again.\")\n\nelif answers == 7:\n\nprint(\"My reply is no\"\
  )\n\nelif answers == 8:\n\nprint(\"My sources say no\")\n\nHere we just provided\
  \ you with 8 answers, but you can cut it down a few to make it easier or give twenty\
  \ answers if that is what you would like. It is set up to be random and pick the\
  \ answers differently each time, which can make it easier for you to get something\
  \ different each time that you ask a new questions. This is a good way for you to\
  \ use some of the topics that we discussed in this book and you can have some fun\
  \ playing the game by asking it questions during the testing period.\n\nLet the\
  \ computer roll the dice\n\nAnother game that you are able to create is one where\
  \ you tell the Python program to roll the dice for you. This one will also use the\
  \ random idea that we did above because you want the computer to determine different\
  \ numbers on the dice each time that you roll; no one wants to play the game and\
  \ get the exact same numbers each time the do it so the random module will help\
  \ to make sure that this happens. In this code, it is your responsibility to set\
  \ up two different variables, the maximum and the minimum, so that the system will\
  \ only pick out numbers that are on your code. For example, you will want to make\
  \ sure that your minimum on this one is 1 and the maximum is 6. If you would like\
  \ to make a special die, you could add in more numbers, but we will just keep it\
  \ simple for this one.\n\nYou will notice in this example that we are working with\
  \ the loop function. This allows the user to roll the dice as many times as they\
  \ would like without restarting the code, rather than just doing it one time. We\
  \ are going to use the “y” for yes so that the user is able to click on it and roll\
  \ the dice again and again as they would like.\n\nSo, to create this new game, we\
  \ would need to use the following code to tell the compiler what to do:\n\nImport\
  \ random\n\nmin = 1\n\nmax = 6\n\nroll_again = \"yes\"\n\nwhile roll_again == \"\
  yes\" or roll_again == \"y\":\n\nprint(\"Rolling the dice…\")\n\nprint(\"The values\
  \ are…\")\n\nprint(random.randint(min, max))\n\nprint(random.randint(min, max))\n\
  \nroll_again = raw_input(\"Roll the dices again?\")\n\nCreating a Hangman game\n\
  \nHere we are going to look at how to create the Hangman game with the help of your\
  \ Python compiler. If you are a fan of this game, you are going to see that it is\
  \ pretty easy to create this game all on your own. You will be able to use some\
  \ dashes that are in a row in order to represent the word that you are trying to\
  \ have the user guess and when the user does guess a letter that is inside the word,\
  \ the script will be able to place this letter in the correct spot.\n\nFor the game\
  \ that we are going to make, we will allow the player to guess 10 times. After the\
  \ 10 times, or when the user guesses the word ahead of that many times, the game\
  \ is going to end. You will be able to choose the variables and make it a bit different,\
  \ such as giving it the ability to let the user guess more or fewer times, but here\
  \ we are going to keep things simple and stick with 10. The code that is needed\
  \ in order to create this game includes:\n\n## importing the time module\n\nimport\
  \ time\n\n#welcoming the user\n\nName = raw_input(\"What is your name?\")\n\nprint(\"\
  Hello, \" + name + \", Time to play hangman!\")\n\nprint(\"\n\n\")\n\n#wait for\
  \ 1 second\n\ntime.sleep(1)\n\nprint(\"Start guessing…\")\n\ntime.sleep(.05)\n\n\
  #here we set the secret\n\nword = \"secret\"\n\n#creates a variable with an empty\
  \ value\n\nguesses = ' '\n\n#determine the number of turns\n\nturns = 10\n\n#create\
  \ a while loop\n\n#check if the turns are more than zero\n\nwhile turns > 0:\n\n\
  #make a counter that starts with zero\n\nfailed = 0\n\n#for every character in secret_word\n\
  \nfor car in word:\n\n#see if the character is in the players guess\n\nif char in\
  \ guesses:\n\n## print then out the character\n\nprint(char, end=\" \")\n\nelse\n\
  \n## if not found, print a dash\n\nprint(\"_ \", end=\"\")\n\n## and increase the\
  \ failed counter with one\n\nfailed += 1\n\n## if failed is equal to zero\n\n##\
  \ print You Won\n\nif failed == 0:\n\nprint(\"You Won\")\n\n## exit the script\n\
  \nBreak\n\nprint\n\n## ask the user go guess a character\n\nguess = raw_input(\"\
  guess a character:\")\n\n## set the players guess to guesses\n\nguesses += guess\n\
  \n## if the guess is not found in the secret word\n\nif guess not in word:\n\n##\
  \ turn's counter decreases with 1 (now 9)\n\nturns -= 1\n\n## print wrong\n\nprint(\"\
  Wrong\")\n\n## how many turns are left\n\nprint(\"You have,\" + str(turns) + \"\
  \ more guesses\")\n\n## if the turns are equal to zero\n\nif turns == 0:\n\n## print\
  \ \"You Loose\"\n\nprint(\"You Loose\")\n\nAs you can see, this is one that has\
  \ some more complexities to it because of the nature of the game, but it has many\
  \ of the different parts in it that you need to practice when using this code. You\
  \ will be able to add in more parts, or take them away and maybe try just having\
  \ 5 practices or tries inside of it to make it easier, but you will be able to try\
  \ it out and play a fun game with all of the information that you learn inside of\
  \ this guidebook and the code that is above.\n\nMaking some of your own projects\
  \ inside of Python is one of the best ways to work on learning the code. Many of\
  \ these games bring together different parts of the information that we learned\
  \ inside of this code so that you can see that they aren’t just some random concepts\
  \ that are talked about but you will never actually used. In fact, many of the options\
  \ that we discuss are going to be used together inside the same code in order to\
  \ make it functions. As you get used to seeing some more of these things together\
  \ and you practice writing out codes like the one above, you will be better able\
  \ to see how all of the parts need to be present in order for the code to work properly.\n\
  \n## Conclusion\n\nThank you for taking the time to read my book! I hope you learned\
  \ everything that you needed to know about Python coding and about getting started\
  \ with the Python language.\n\nIf you liked what you read, please take a moment\
  \ to leave a review after this book! Also, to keep up to date on my future books,\
  \ check out my Facebook page at [SAHM Writing](https://www.facebook.com/SAHM-Writing-134046599947068/)!\n"
