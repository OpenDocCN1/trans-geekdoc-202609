    # The telephone network


    Until the arrival of computer networking, the telephone system was the only medium
    for electronic mass communication. Although the two are intimately linked, there
    are important differences between the way people talk to each other and the way
    computers converse. In a telephone conversation, people tend to talk continuously,
    or even both at once. For that reason, the electronic link between them is reserved
    exclusively for them and remains open for as long as they wish to speak. Computer
    conversation, on the other hand, is a rather more staccato affair. It comes in
    fits and starts, so keeping a link open continuously would be extremely wasteful.


    Communicating by fax is a bit closer to computer communication. Information is
    bundled up into discrete packages and a line is held open just long enough for
    the package to be sent. Once the message has been received, the connection is
    closed and the message can be digested ‘off-line’.


    When you pick up the telephone and dial a number, the telephone system finds you
    a line to the person you want to talk to. The problem with such a system is scalability:
    it is hard to make the system grow larger. Each new subscriber would have to be
    linked to each existing subscriber. Such a system would not scale up easily to
    more than a handful of subscribers.


    The solution is circuit switching. Instead of every subscriber having a line to
    every other, each one has a single line to a central switch. It works because
    most people are off the phone most of the time and only a fraction of all possible
    pairs of phones are connected to each other at any given moment. In the old days
    there would be an army of switchboard operators connecting calls. Now it is all
    done automatically; but the basic principle is the same.


    A circuit-switched system makes the scalability problem more tractable. Each community
    has its own local switch and different communities are linked by long-distance
    connections between switches. As cables gave way to optical fibres, which can
    carry much more traffic, the efficiency of communication improved.


    Circuit switching links you to the person you are calling by establishing a circuit
    between the two of you. That circuit may be made from several pieces of wire and
    lengths of optical fibre, but as long as you want it, it is exclusively yours.
    You are also paying for it even when you are not saying a word, and no one else
    can use it as long as you are on the line.'
