  mdcn: "\n到1929年，已出现有声电影。1929年，股市和行业均达到饱和，随后的市场崩盘已被充分记录。\n\n## 互联网的决定性时刻：《分组网络互联协议》\n\
    \n直到1970年代，世界作为一个单一统一整体的想法也不过就是一个想法。随着计算机技术和信息理论的发展，这一想法开始成为现实，而这些最终导致了互联网的诞生。这是一个技术复杂程度极高的过程，并没有一位主导的天才。互联网的优势之一在于它不依赖于单一的见解或技术。但可以公平地说，1974年5月刊的冷门技术期刊\
    \ *IEEE Transactions on Communications* 是二十世纪历史上的决定性时刻，很可能也是新千年历史上的决定性时刻。\n\n\
    罗伯特·E·卡恩和文顿·G·瑟夫发表的论文题为‘A Protocol for Packet Network Intercommunication’，标题并不令人期待。它技术性强、术语堆砌、枯燥乏味。其结论是：‘In\
    \ particular, we have described a simple but powerful and flexible protocol which\
    \ provides for variation in individual network packet sizes, transmission failures,\
    \ sequencing, flow control, and the creation and destruction of process-to-process\
    \ associations.’ 简而言之，他们定义了互联网。网络的关键在于它确实是一个网。它没有中心；相反，它是数百万台计算机之间的连接系统。因此，除非全球电力供应完全中断，否则不可能将其关闭，而且它具有极强的韧性。得益于‘packets’信息总能通过网络找到自己的路由，它可以承受网络大部分甚至绝大部分结构的破坏。\n\
    \n网络的强大之处在于它超出了用户、公司或国家的控制。与其之前的道路、铁路和电话一样，网络为世界带来了前所未有的连通性。但与它们不同的是，它还创造了一个新世界——网络空间。这是一个可以导航的‘place’，与之相关的语言是地理或建筑学的。因此有聊天‘rooms’、网页‘sites’、网络‘locations’，我们被说成‘surf\
    \ the Net’，仿佛它是一片海洋。\n\n当时并未完全认识到瑟夫和卡恩论文所产生的冲击。然而，作者们很清楚，回顾过去，关于技术及其经济影响的一些预测曾过于乐观。瑟夫和纳瓦斯基在后来的论文中引用了托马斯·爱迪生1910年的预测：‘the\
    \ nickel–iron battery will put gasoline buggies out of existence in no time’（1984，第229页）。但其他预测同样过于悲观。瑟夫和纳瓦斯基还引用了密歇根储蓄银行总裁1903年的预测：‘the\
    \ horse is here to stay, but the automobile is only a novelty, a fad’（1984，第228页）。\n\
    \n## 数据的民主化\n\n加州大学伯克利分校的一组研究人员，由彼得·莱曼和哈尔·瓦里安领导，整理了世界目前每年产生的独特信息的估计产量。他们在1999年得出的数字约为2艾字节。\
    \ （艾字节大约是十亿的十亿字节，相当于约200亿本商业杂志。）研究作者指出，很快在技术上普通人将能够获取几乎所有记录的信息。\n\n为了计算这些数字，作者首先考察了四种主要存储介质：纸张、胶片、光盘和磁盘和磁带等磁性设备。以胶片为例。据美国商务部称，全世界每年拍摄的照片超过800亿张。联合国教科文组织称每年制作的电影为4250部。还有20亿张X光片。\n\
    \n研究人员将这些数字换算成字节——例如每张照片5兆字节，每部电影4000兆字节，每张X光片8兆字节——然后加总。为此，他们对数字信息压缩以节省空间的程度做出了某些假设。\n\
    \n分析这些数据得出的主要结论是作者所称的‘democratization of data’。是全球的个人创造和存储了大部分数据——每年约740 000太字节（千亿字节）。出版信息仅累计为285太字节。\n\
    \n研究人员还计算了电子邮件、广播和电话等通信产生的资讯量，因为所有这些在不久的将来很可能会被系统地归档。结果同样惊人。仅在美国，每年发送约6100亿封电子邮件，总计超过11太字节。但这与电话产生的海量数据相比微不足道：576\
    \ 000太字节。\n\n肯尼斯·阿罗在1973年诺贝尔经济学奖获奖感言中称信息为‘an economically interesting category\
    \ of goods which have not hitherto been afforded much attention’。世界已经跟上了阿罗的评论。信息时代真正来临了。\n\
    \n## 新经济：互联网和科技股在其中处于什么位置？\n\n> 当你看到对新范式的提及时，你应该在任何情况下都躲避……从未有过像覆盖约翰·劳和南海泡沫的那样新颖而美妙的范式……直到灾难来临之日。\n\
    > \n> （J.K. Galbraith, *The Great Crash*, 1955）\n\n在1990年代，美国经济强劲增长，通胀低，劳动生产率增长回升，导致许多人将这一现象称为‘新经济’。但对于美国经济有何不同以及该术语的含义，几乎没有共识。本章探讨了新经济的含义，为理解互联网和科技股估值所涉及的复杂问题提供了背景。\n\
    \n### 新经济的定义\n\n新经济的定义并不精确，但通常包括以下一个或多个特征。\n\n#### 更高的生产率增长率\n\n更高的生产率增长率在很大程度上与信息技术（IT）的投资有关。这导致了经济学家所称的‘capital\
    \ deepening’，即资本 per 工人数量随时间增加的过程（资本/劳动比率）。最近的例子是信息技术的投资，反映了计算机价格的下降以及计算机以更少的投入完成旧任务的新方式。微处理器是这些技术发展的核心。人们认为，微处理器操纵、存储和移动大量信息的能力已改变了美国经济的重心，创造了更小、更快、更聪明、更好、更便宜的时代。为了更好地理解这些技术发展的意义，有益于回顾美国历史（参见McTeer,\
    \ 1999）。\n\n从1895年到1915年，一场伟大的发明浪潮开启了快速技术变革和经济增长的时代。美国人见证了一个奇迹接一个奇迹的到来——汽车、飞机、电话、留声机、收音机、电梯、制冷等等。这些新发明在以农业、零售和小规模生产为主的GDP中几乎没有引起波澜。然而，随着时间的推移，由它们发展起来的产业构成了二十世纪的经济支柱。这一久远时代的进步若没有在美国内战后不久到来的技术——电力——是不可能的。托马斯·爱迪生于1879年发明了电灯泡，只为简单地照亮房间。为了为他的发明建立市场，爱迪生利用电力，建造了世界上第一座发电厂和纽约市的配电网络。随着电力在经济中传播，它重塑了经济范式。没有电力，就没有内燃机的火花，没有电话、收音机、冰箱和空调的动力。电力为工厂提供了随时待命的能源，规模化生产推动了几乎所有东西制造成本的下降。\n\
    \n与电力一样，微处理器本身就是一项重要的发明，它引发了连锁溢出的快速传播。1958年，德州仪器的杰克·基尔比制作了第一块集成电路，一块硅片上的晶体管束。现代电子学的宏大主题由此开始——越来越小，越来越强大。13年后，英特尔的泰德·霍夫开发了硅蚀刻工艺，生产出真正的第一代微处理器。最初的应用集中在计算和快速数据输入。手持计算器于1972年出现，条形码扫描仪于1974年出现，个人电脑于1975年出现。\n"
