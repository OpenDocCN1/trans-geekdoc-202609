    ## The Black–Scholes model


    The binomial model, discussed earlier, assumes a discrete-time stationary binomial
    stochastic process for security price movements. In the limit, as the discrete-time
    period becomes infinitely small, this stochastic process becomes a diffusion process
    (also called a continuous-time random walk, an Ito process, or geometric Brownian
    motion). This was the process assumed by Black and Scholes (1973) in their derivation
    of the option pricing formula. As with the binomial model, Black and Scholes begin
    by constructing a riskless hedge portfolio, long in the underlying security and
    short in call options. This portfolio generates the riskless rate of return, but
    the internal dynamics of the portfolio are driven by the diffusion process for
    the security price. The structure of the hedge portfolio can be put into a form
    that is identical to the heat equation in physics.


    Once this was recognized, the solution to the equation was easily derived.


    In the case of a European call option with no cash payments on the underlying
    asset and with a certain, continuously compounded interest rate, Black and Scholes
    demonstrated that the value of a call option is an explicit function of the first
    five factors mentioned above. The Black–Scholes model is shown in Equation 10.10:


    C = P N(d₁) - E e^{-rt} N(d₂)

    10.10


    where:

    - C = the price of a call option

    - P = the current price of the underlying asset

    - E = the exercise price

    - e = the base of natural logarithms

    - r = the continuously compounded interest rate

    - t = the remaining life of the call option


    N(d₁) and N(d₂) are the cumulative probabilities from the normal distribution
    of getting the values d₁ and d₂, where d₁ and d₂ are as follows:


    d₁ = [ln(P/E) + (r + 0.5 σ²) t] / [σ √t]

    d₂ = d₁ - σ √t


    where σ = the standard deviation of the continuously compounded rate of return
    on the underlying asset.


    The term e^{-rt} is the present value of $1 received t periods from the present.
    It is the continuously compounded equivalent of what we have called d, the present
    value of $1.


    To understand the Black–Scholes model better, consider the case where N(d₁) and
    N(d₂) are both equal to 1. This is equivalent to assuming complete certainty.
    Then the model becomes Equation 10.11


    C = P - E e^{-rt}

    Eq 10.11


    N(d₁) and N(d₂) represent cumulative probabilities from the normal distribution.
    Figure 10.5 illustrates these cumulative probabilities, which must be numbers
    between 0 and 1. If they


