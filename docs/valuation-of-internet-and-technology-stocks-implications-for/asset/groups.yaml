    becomes Equation 10.11:


    C = (0.75) P - (0.25) E e^{-rt}

    Eq 10.12


    The Black–Scholes function is shown in Figure 10.6.


    Since the Black–Scholes model requires no cash payments and interest rate certainty,
    it cannot be applied to debt instruments. However, the Black–Scholes models can
    be applied to common stocks without dividends. The model can be adapted for common
    stocks that pay dividends.


