    # Revenue when firm matures (millions)


    This is what the investor thinks the total revenues of the firm may be when it
    matures into a company with predictable earnings and growth. One way to try to
    predict this is to look at the total size of the market in which the company competes,
    and try to guess what kind of market share the firm may end up with.


    # Profit margin


    Losses in the early years of many start-up companies are to be expected. What
    really matters is how much profit the firm will regularly generate after it matures.
    What profit margin do you think is likely for the firm that you are seeking to
    value?


    # P/E ratio


    The price to earnings ratio is one benchmark of a firm’s value. The market basically
    assigns a higher P/E multiple to firms with good growth prospects.


    # Number of shares


    One thing to watch for is the number of shares that might be issued later due
    to the exercise of stock options or the conversion of convertible bonds.


    # Discount rate


    Since the payoff for investing in a growth stock is in most cases some years in
    the future, it is necessary to discount the future value of the stock to find
    out what it is worth today. A value of 10% (0.10), Angel suggests, is a reasonable
    guess as to the appropriate discount rate for the stock market. Various rates
    can be used depending on the individual investor’s expectations.


    # Years until maturity?


    How many years will it take for the stock to grow up into a firm with steady earnings
    and predictable growth?'
