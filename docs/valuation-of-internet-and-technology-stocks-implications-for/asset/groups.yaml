    Investors have an ever-shortening time horizon over which they will tolerate the
    time between the listing of a technology company and the period it can show critical
    mass. Investors look to revenue, profit and cash flow growth |

    | Quality of growth | A higher quality of growth should attract higher valuation
    levels. Technology companies that can grow with ‘value addition’ – and that can
    sustain that value addition – will attract the highest valuation levels over time
    |

    | Business margins | There are many business models for listed technology companies.
    Companies that have businesses that deliver higher margins will be more highly
    valued than companies generating larger revenues yet at lower margins |

    | Customers and marketing | The likely behaviour of the customers of technology
    businesses is not well understood. How loyal will they be? At what level will
    marketing spend stabilize? How will brand name, first mover and size affect customers?
    These are key components of both growth and margins |

    | Capital intensity | In the nascent stage of development technology companies
    require a large amount of cash. This cash is primarily being utilized to market
    their businesses and to develop new applications and services. The greater the
    amount of cash required to generate business development the greater the degree
    of risk the investment holds |

    | Premium return on investment | Technology stocks price the value of the growth
    and profitability of the ongoing business as part of the total valuation. Investors
    allocate a substantial amount of value to the ability of technology companies
    to generate additional growth from the success that they will experience. The
    value of the ability to continue to find new investment opportunities which can
    deliver high levels of return, which are measured by their excess over the cost
    of capital, is the ‘premium’ return on investment |


    the forward priced multiple method forces investors to focus on what the company
    will look like at maturity. This method is consistent with both discounted cash
    flow methodology and is also effectively based on a profit multiple. Where a company
    is in a more mature stage then the emphasis should shift from one focused on revenues
    to one focused more on profit multiples.


    (3) **Discounted cash flow:** Discounted cash flow (DCF) can be difficult to apply
    at the very early stage of a developing, high-growth company’s life and would
    perhaps carry less weight in analysis, as we discussed in Chapter 6. But as short-term
    forecasts start to show cash flows, which are more reliable as a basis for longer-term
    projections, this method should be given more attention.


    We now turn to the three techniques in more detail.


    ## *Current priced multiple of sales revenue*


    As stressed throughout this book, valuation multiples should ideally be based
    on profits rather than revenues, since it is profit and the cash flow derived
    from it which creates value. In the absence of current profits for most technology-based
    companies, investors were forced to look to other measures. Sales revenue is the
    next best thing to profit, although clearly it has drawbacks. However, one may
    expect those stocks where the future margins will be highest to sell for higher
    sales multiples, assuming all other value drivers are equal.


    ## ***Margin-adjusted sales multiples***


    In making comparisons of stocks using revenue multiples it is vital that only
    those with similar margin potential should be included. Profit-based multiples
    would be more comparable since these are not directly affected by margin. However,
    revenue multiples for different business models can be compared if they are ''potential
    margin adjusted''. A margin-adjusted sales multiple of a competitor company, adjusted
    for the purpose of comparison with a target company, can be calculated using the
    following formula:


    ```

    Margin-adjusted sales multiple =

    Observed sales multiple × Target company’s expected operating margin

    Comparator company’s expected operating margin

    ```


    Use of this adjustment introduces further subjectivity into the valuation process
    but it should provide a better basis for making comparisons between different
    business models.


    ## *Forward priced multiple valuation*


    This technique is essentially a combination of the simplicity of a valuation multiple
    with the forward-looking elements of discounted cash flow.


    The mechanics of forward price multiples are relatively simple.


    - (1) Select a time horizon.

    - (2) Estimate investors’ required return over that period (the cost of capital).

    - (3) Then deduct from the current value of the business the present value of
    the cash flows from the valuation date to that time horizon. The result of this
    is the present value of the implied exit value of the business.

    - (4) Finally, compound this value to obtain the actual implied exit value.

    - (5) This is then compared with a business activity measure for that future period
    to obtain the forward priced multiple.


    In applying this valuation technique it is useful to apply a forward price to
    sales model and here we set out the steps investors need to go through.


    ### **Step One: Identify the period to maturity**


    The model is based upon an assumed level of revenue and desired price to sales
    multiple at ‘maturity’. Maturity can be freely selected but is intended to be
    several years hence; say, five to ten years. Maturity does not necessarily mean
    the stock is expected to be ex-growth. It is simply that the characteristics in
    terms of growth, margin and return on capital have reached the estimated long-term
    values which it is believed the company can achieve.


    ### **Step Two: Forecast revenues at maturity**


    Of course, forecasting revenues several years hence is difficult and speculative,
    but it is a key component in valuing technology stocks. This technique uses two
    approaches to forecasting revenue:


    - analysts’ short-term forecasts plus an estimated medium-term growth rate to
    maturity, and

    - a total market size and estimated company market share (at maturity) approach.


    ### Step Three: Estimate forward price to sales multiple


    A key element in determining the forward price to sales multiple is the estimated
    net margin. Again, this is a difficult driver to forecast but is also an essential
    component of the valuation about which a view must be taken. The margin must be
    post-tax and a realistic estimate of the long-term profit opportunities for the
    business. Key factors to consider in this are the nature of the products and services,
    the quality of business model, barriers to entry, brand name, etc.


    ### Step Four: Apply the investor’s required rate of return


    This is likely to be relatively high for most technology stocks since this reflects
    the required return of investors over the period where there is greatest uncertainty.


    ## Discounted cash flow (DCF)


    As we discussed in Chapter 6, there are two main problems with the standard DCF
    approach.


    First, the limited explicit forecast period fails to capture all the high growth.
    Many growth stocks were priced on the assumption that a premium growth rate can
    be maintained for longer than, say, a five-year explicit forecast. This means
    that the growth rate in the terminal value calculation has to be a quasi-average
    of continuing high growth for a limited period plus the real long-term growth;
    in other words, a number almost impossible to estimate.


    Second, the final-year forecast cash flow is a poor basis for measuring terminal
    value. In traditional two-stage DCF models, typically 70–80% of value is inherent
    in the terminal value calculation, whereas for growth stocks this is usually well
    over 90%. For technology stocks it is not uncommon for more than 100% of value
    to be in the terminal value (the cash flows in the explicit forecast period are
    negative).


    Since the terminal value is based upon the cash flow in the final year of the
    explicit forecast period, this becomes the critical figure in the valuation. However,
