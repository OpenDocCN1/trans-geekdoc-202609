    for just $40.


    As the new technology became better and cheaper, American businesses and households
    embraced it. Only a few thousand homes had a PC in 1980. Now more than half of
    US families own computers, the newest of them 200 times more powerful than IBM’s
    first PC, introduced in 1981. Three-fifths of US households are connected to the
    Internet, a mode of instant communication scarcely heard of at the start of the
    1990s. This growth in technology provides the underpinning to the idea that the
    old rules of economics have been dramatically changed.


    # A rise in total factor productivity growth


    Total factor productivity growth refers to the growth in output that is not explained
    by the physical increase in either capital or labour. Its contribution to economic
    growth is not easy to identify and measure but nevertheless is an important source
    of economic growth. This phenomenon is due to the increased utilization of information
    technology across the economy with resulting spillover effects. Total factor productivity
    growth depends on:


    +   - technological change

    +   - other advances in knowledge, e.g. just in time manufacturing

    +   - economies of scale.


    Spillover effects occur when returns to an investment increase because others
    make similar investments. Examples here would be networking and the returns to
    an Internet-capable computer as more consumers and businesses connect to the Internet.


    The effect of the Internet has been to intensify product market competition with
    associated efficiency.


    The potential impact of the Internet gains can be seen from Figure 2.1. It took
    36 years to achieve 50 million users for radio, 13 years for TV, 16 for PCs, but
    for the Internet it has taken fewer than 5.


    # Technology spillovers: increasing returns and decreasing costs


    Even when individual industries face decreasing returns to scale, the economy
    as a whole may enjoy increasing returns when technology spillovers from one industry
    benefit others. Technology spillovers are especially abundant with inventions'
