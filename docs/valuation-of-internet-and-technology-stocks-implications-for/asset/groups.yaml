    \ to be received one period from now, which is (D1). In valuation terminology,\
    \ D0 represents the dividend currently being paid, and D1 represents the dividend\
    \ expected to be paid in the next period. If D0 is known, D1 can always be determined:\
    \ D0 = Current dividend D1 = D0(1 + g) where g is the expected growth rate of\
    \ dividends.\n"
