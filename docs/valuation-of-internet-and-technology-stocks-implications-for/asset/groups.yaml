    # Discounted cash flow fights back!


    As discussed in Chapter 6, discounted cash flow has some limitations when it comes
    to valuing dot.com companies. However Copeland, Keller and Murrin, writing in
    their book *Valuation: Measuring and Managing the Value of Companies* (2000),
    put forward a revised version of DCF enabling the technique, so they claim, to
    be just as applicable to dot.com companies as to standard ''Old Economy'' type
    companies.


    The authors focus on the three twists required to make DCF more useful for valuing
    Internet companies. These are: start from a fixed point in the future and work
    back to the present, secondly use probability-weighted scenarios to address high
    uncertainty in an explicit way, and thirdly exploit classic analytical techniques
    to understand the underlying economics of these companies in order to forecast
    their future performance. Let''s examine these stages, one by one.


    # Stage 1: start from the future


    In forecasting the performance of high growth companies the authors stress that
    analysis should not be constrained by concentrating on current performance. Instead
    of starting from the present, the usual practice in DCF valuations, one should
    start by thinking about what the industry and the company could look like when
    they evolve from today''s very high-growth, unstable condition to a sustainable,
    moderate growth state in the future, and then extrapolate back to current performance.
    The future growth state should be defined by metrics such as the penetration rate,
    average revenue per customer and sustainable gross margins. Just as important
    as the characteristic of the industry and company in this future state is the
    point when it actually begins. Since Internet-related companies are new, the authors
    suggest more stable economics probably lie at least 10–15 years in the future.


    Combining various assumptions enables forecasts of revenues, profits, capital
    requirements etc. to be made. The projected free cash flow is then discounted
    back to give the present value calculations of a company.'
  - '[PAGE 158]


    # Stage 2: weighting for probability


    Uncertainty is the hardest part of valuing high-growth technology companies, and
    the use of probability-weighted scenarios is a simple and straightforward way
    to deal with it. The use of probability-weighted scenarios requires one to repeat
    the process of estimating a future set of financials for a full range of scenarios,
    some more, some less optimistic. The discounted cash flows multiplied by the probability
    of the scenarios occurring gives us an expected value figure. Sensitivity analysis
    should then be applied to these scenarios.


    # Stage 3: customer value analysis


    The last difficult aspect of valuing very high-growth companies is relating future
    scenarios to current performance. How can you tell a soon-to-be successful Internet
    company from a soon-to-be bankrupt one? Here, classic microeconomic and strategic
    skills play a critical role because building sound scenarios for business requires
    knowledge of what actually drives the creation of value. Many of these principles
    revolve around applying the Porter model, suitably modified, as we discussed in
    Chapter 5. For many Internet companies, the authors suggest customer value analysis
    is a useful approach. Five factors are important in applying customer value analysis:


    +   (1) The average revenue per customer per year from purchases by its customers,
    as well as revenues from advertisements on its site and from retailers that rent
    space on it to sell their own products.

    +   (2) The total number of customers.

    +   (3) The contribution margin per customer (before the cost of acquiring customers).

    +   (4) The average cost of acquiring a customer.

    +   (5) The customer churn rate (that is, the proportion of customers lost each
    year).


    By using this adapted DCF approach the authors indicate that reasonable valuations
    can be generated for seemingly unreasonable businesses. Writing before the dot.com
    crash, the authors correctly stress that uncertainty about the future – a fact
    of life that cannot be eliminated no matter what type of valuation methodology
    is applied – should be factored into all'
