    ## The Wall Street Crash of 1929


    The 1929 Wall Street Crash was the conclusion of one of history’s largest episodes
    of mad speculation, but, as the recent technology stocks crash demonstrates, almost
    certainly not the last. For a number of years up to 1924 the American Dow Jones
    Industrial Index fluctuated within a relatively narrow price interval, with strong
    selling pressure whenever it reached 110. From 1921, when the stock market was
    very depressed, to 1928, industrial output rose by 4% annually and by 15% from
    1928 to 1929. Inflation was low and new industries sprouted forth everywhere.


    This rising optimism, combined with easy access to cheap money, stimulated stock
    investors and after a temporary reversal in 1926 almost no month passed without
    a rise in stocks creating a new generation of rich investors. Investment trusts
    increased in number as stock investments rose in popularity. From around 40 companies
    before 1921 the number rose to 160 at the beginning of 1927 and 300 at the end
    of the same year. From the beginning of 1927 to the autumn of 1929 the total assets
    of investment trusts increased more than ten-fold and there was almost unlimited
    confidence in these companies.


    On 24 October 1929, trading reached 12 million stocks. Nervousness, however, had
    set in and a panic was evident. As the situation was clearly getting out of hand,
    on 25 October President Hoover made the following statement: “The fundamental
    business of the country, that is, production and distribution of commodities,
    is on a sound and prosperous basis.”


