    Valuation methodologies, particularly so for high-risk, technology-related companies.


    ## Conclusion


    Early gauges of success, such as how many ‘hits’ a web page gets, are considered
    as irrelevant these days. Therefore analysts are trying to set new quantifiable
    standards, such as lifetime value per user, which are becoming quite popular.
    Warren Buffett, a very successful value-based investor, recently stated that if
    he were teaching an ‘Investments’ class, the final exam question he would set
    would be ‘How do you value an Internet company?’. He supposedly claimed that he
    would fail anyone who handed him in an answer. The moral of this possibly apocryphal
    story is that it is very hard to value an Internet company at such an early stage
    in the industry’s life cycle. Successful valuations may identify undervalued and
    overvalued Internet stocks. However, they cannot address the most important question
    as to whether the whole industry is overvalued. Recent Nasdaq developments indicate
    that this question remains unresolved.


    ## Derivatives markets, real options and the valuation of Internet and technology
    stocks


    ### What are derivatives?


    Derivatives are contracts that give one party a claim on an underlying asset (derived
    from the cash value of an underlying asset) at some point in the future, and bind
    a counterparty to meet a corresponding liability. The contract might describe
    an amount of currency, a security, a physical commodity, a stream of payments,
    or a market index. It might bind both parties equally, or offer one party an option
    to exercise it or not. It might provide for assets or obligations to be swapped.
    It might be a bespoke derivative combining several elements. Whether derivatives
    are or are not traded on exchanges; their market price will depend in part on
    the movement of the price of the underlying asset since the contract was created.


    The rapid growth of derivatives trading around the world in recent years has been
    propelled by the internationalization of capital markets in general, by technological
    advances in computers and telecommunications, and by the increasingly fierce competition
    among big banks and securities houses to devise and sell products.


    Trading in derivative contracts has a long history. The first recorded accounts
    of derivative contracts can be traced back to the philosopher Thales of Miletus
    in ancient Greece, who, during winter, negotiated what were essentially call options
    on olive presses.


