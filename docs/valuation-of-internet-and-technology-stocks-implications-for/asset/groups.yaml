    \ D₀ (1+g)³ + ⋯ + D₀ (1+g)∞\n  时间段：0 1 2 3 + ⋯ + ∞\n  \n- (3) **多重增长率模型**：在该模型下，我们有一个以可变速率增长的股息流，例如，前四年为\
