    # What do we know about US stock market history?


    When predicting future returns on the market, the price-to-earnings (P/E) ratio
    and the dividend yield, compared to historical standards, are the most frequently
    cited criteria for judging the valuation of the stock market.


    Table 4.2 displays the dividends and earnings yield on stocks represented by the
    US S&P 500 Index for the period 1871–1994. It can be seen that the average historical
    earnings yield during this period is 8.1%, giving an average price/earnings ratio
    of 13.6. This means that investors priced stocks on average at about 12 to 15
    times their annual earnings. Despite the stability of the average, the P/E ratio
    for the period has shown considerable annual variation, ranging from a high of
    27 in 1894 to a low of 6 in 1950. (It should be noted that P/E ratios have been
    around 30 towards the end of the last millennium and the beginning of the new
    one.)'
