    striking exception to the economic rule that value comes from scarcity. In addition,
    some companies give away their products to establish market share, then sell linked
    services later on: network effects were experienced historically in the adoption
    of telephones and fax machines. The difference today is that everyone is linked,
    so far more products and services gain their value from widespread network acceptance,
    as we discussed earlier in this chapter.


    # 7. EFFICIENCY: The middleman lives. ‘Infomediaries’ replace intermediaries


    Traditional distributors and agents are seriously threatened by a networked economy
    in which buyers can deal directly with sellers. But a new brand of middleman is
    being created. As the amount of info-clutter grows, these infomediaries are needed
    to turn dumb data into usable information. They offer aggregated service, or intelligent
    customer assistance, or powerful technology-based buying aids, or an attractive,
    community-based buying environment.


    # 8. MARKETS: Buyers are gaining new power – and sellers new opportunity


    It’s no longer necessary for your customer to walk down the street to compare
    prices and services. Your competitor may just be a mouse-click away. And intelligent
    software helps buyers find the best deal. So businesses that genuinely offer unique
    services or lower costs will flourish, benefiting from a flood of new buyers.
    Those that have relied on physical barriers to competition will fail.


    # 9. TRANSACTIONS: It’s a one-on-one game


    Information is easier to customize than hard goods. The information portion of
    any good or service is becoming a larger part of it.


    # 10. IMPULSE: Every product is available everywhere. The gap between desire and
    purchase has closed


    The shelf space of the World Wide Web is unlike any other, in that it has no bounds.
    Artificial constraints on choice are replaced by the ability to purchase the precise
    product you'
  - '[PAGE 29]


    desire. The impulse to buy and the purchase itself used to be separated by a combination
    of physical and mental barriers. When you heard a song on the radio, you had both
    to remember the song or the artist and actually go to a store to purchase. On-line
    it’s different. Discover a product you desire, and just hit the ‘buy’ button.
    Consequence: The processes for marketing, sales and fulfilment are merging.


    # Postscript


    Although the magazine promoting these ideas has since ceased publication and we
    have had, of course, a Nasdaq stock price collapse, there is little doubt that
    these ideas have not gone away. They may have been temporarily set back but they
    will return. They play a key role in understanding the issues associated with
    valuing technology/Internet stocks.


    But let us now turn to the micro-economic picture. As discussed earlier in this
    chapter, the New Economy ideas are indeed still powerful. But to what extent are
    they reflected in how we measure technological change?


    # Technological change and US economic statistics


    The US economy is constantly evolving. New technologies are continuously transforming
    the production and delivery of new and existing goods and services. But business
    practices adapt just as readily to changes in technology. The scramble for market
    share and profitability forces firms to find innovative ways to add value to their
    firm’s products and services.


    These innovations often require computer hardware and software. In the past, when
    businesses generally used main-frame computers, they acquired the hardware and
