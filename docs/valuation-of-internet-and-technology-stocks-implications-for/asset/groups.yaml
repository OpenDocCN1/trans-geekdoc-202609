    # Bond yield/stock yield ratio


    Investors always have a choice between stocks and bonds. In the long run, the
    two asset classes ought to achieve similar returns, or at any rate similar returns
    after adjusting for differences in risk and liquidity. In the UK it is usual historically
    for government bonds to pay a little more than twice as much as dividend yields.
    In the US the historical average is nearer three.


    Analysts use the bond/stock yield ratio as a benchmark as to whether bond or equity
    prices will revert back to the historical average. Table 4.5 illustrates how this
    would work.


    Table 4.5 Why bond yields drive stock (dividend) yields (and vice versa)


    | Historical average bond yield/stock yield | Assumed current ratio | Share price
    | Dividend yield | Bond price | Bond yield |

    |---|---|---|---|---|---|

    | 3 | <3 | ↑ | ↓ | ↓ | ↑ |

    | 3 | >3 | ↓ | ↑ | ↑ | ↓ |


    However, the dividend yield has to be sensitively interpreted. If the dividend
    yield is low due to the effect on earnings of a forthcoming recession then the
    ratio has to be treated cautiously.


    # Tobin''s q ratio


    In addition to comparing a company''s dividends or earnings to the price of the
    stock it can also be useful to compare the value of the company''s securities
    to the value of its assets. The ratio of the market capitalization to the replacement
    cost of the underlying corporate assets is known as Tobin''s q. It is named after
    its creator, James Tobin, Yale University''s Nobel Laureate.


    Tobin''s q is a simple enough idea. The ratio of (a) the value of companies according
    to their market capitalization to (b) the'
  - '[PAGE 83]


    replacement of the cost of their assets should be a number equal to 1.The numerator
    and the denominator of the ratio are, after all, just two ways of measuring the
    same thing, the value of companies.


    The value of the company on the financial markets exceeds the value of its assets
    when its expected earnings are high or rising rapidly. Conversely the company
    can be worth less than its assets when its prospects are especially poor or uncertain.


    If q was for some reason greater than 1 this would imply that the stockmarket
    put a higher value on assets owned by companies than those same assets cost to
    acquire. So there would be a kind of arbitrage opportunity. If q were greater
    than 1 companies could be expected to increase their investment, presumably until
    the market reckoned the company was now worth what its assets cost. At that point
    q would again be equal to 1.


    Estimates of Tobin''s q for non-financial corporations by the US Federal Reserve,
    for 1998–2000, show the highest valuations since 1925. Using the Fed''s calculations
    it has fluctuated between a minimum of 0.4 and a maximum of 1.8, its level at
    the end of the millennium. The average level is 0.7.


    A value higher than unity, the case since 1991, for the first time in 25 years,
    indicates that it is more advantageous for firms to issue shares in order to finance
    the accumulation of productive capital (land, plant) than to buy such assets ''second-hand''
    through purchasing the corresponding securities on the stock market.


    In the early 1970s and early 1980s the value was usually less than 1, suggesting
    that companies were quite cheap. If this ratio was to revert to the long-term
    average the US stock market would decline by 50%.


    Smithers and Wright (2000) have recently analysed the US stock market and come
    up with a q ratio of well over 2. They find that when the ratio (suitably adjusted
    to take account of accounting discrepancies) moves far above unity, equilibrium
    is indeed eventually restored – not however by a surge in the replacement value
    of companies'' assets but by a dramatic fall in their stock price. As Smithers
    and Wright point out, that is what happened in 1968–74 after earlier peaks in
    q. The value of q in year 2000, they note, is higher now than in either 1929 or
    1986.


    A ratio of this type has to be handled with great care, because of the problems
    posed by the valuation of assets both tangible and intangible. Intangible assets
    (intellectual property,'
  - '[PAGE 84]


    trademarks, patents, know-how,) for example tend to be undervalued in the denominator
    of q, causing the ratio to be overstated. This argument is often advanced to explain
    the present high level of q, on the grounds that intangible assets are now of
    much greater importance than they were. We return to these ideas in Chapter 11.


    # Price to book value (P/BV)


    Company balance sheets display a figure for the book value of stockholders funds,
    which can be expressed as net worth per share. US stocks in year 2001 were selling
    at a record 4.9 times book value. Book value refers to the value of the assets
    on a company’s balance sheet. In year 2001 it was about 2.5 times the average
    multiple over the past 20 years.


    But there is an old investment saying that ‘assets are only worth what they can
    earn’. Asset analysis is most useful when companies possess unexploited assets
    that could be sold or put to other uses – office blocks, say, or stakes in other
    companies. Inflexible assets such as machinery or oil wells may need to be analysed
    more cautiously.


    The decline of manufacturing industry has highlighted, as mentioned above, the
    importance of intangible assets in today’s companies – brand names, software,
    royalty rights and the skills of the workforce. Because it is so hard to value
    these satisfactorily in the balance sheet the use of asset value analysis, and
    with it price to book value, has declined in importance.


    # Price to sales ratio (P/SR)


    This is simply the ratio of the value of the company’s stock (that is, its market
    capitalization) to its sales. This might seem a confusing indicator, because profit
    margins can vary so much between different kinds of industry. But in an influential
    book, What Works on Wall Street, published in 1996, the American quantitative
