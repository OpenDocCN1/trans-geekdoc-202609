    Result from new information that produces a dramatic change in optimal forecasts
    of the future valuation of firms. Some financial economists have pointed out that
    there are many possible explanations for why rational explanations of the future
    value of firms dropped dramatically on 19 October 1987: moves in Congress to restrict
    corporate take-overs, the disappointing performance of the trade deficit, congressional
    failure to reduce the budget deficit substantially, increased fears of inflation,
    the decline of the dollar, and increased fears of financial stress in the banking
    industry. Other financial economists doubt whether these explanations are enough
    to explain the stock market drop because none of these market fundamentals seems
    important enough.


    One lesson from the 1987 Black Monday stock market crash appears to be that factors
    other than market fundamentals may have had an effect on stock prices. The crash
    of 1987 has therefore convinced many financial economists that the stronger version
    of efficient markets theory, which states that asset prices reflect the true fundamental
    (intrinsic) value of securities, is incorrect. They attribute a large role in
    the determination of stock prices to market psychology and to the institutional
    nature of the market place. However, nothing in this view contradicts the basic
    reasoning behind rational expectations of efficient markets theory – that market
    participants eliminate unexploited profit opportunities. Even though stock market
    prices may not always solely reflect market fundamentals, this does not mean that
    rational expectations do not hold. As long as the stock market crash was unpredictable,
    the basic lessons of the theory of rational expectations hold.


    ## Rational bubbles


    Keynes (1936), as mentioned earlier, is noted for his observation that stock prices
    may not be governed by an objective view of ‘fundamentals’ but by what ‘average
    opinion expects average opinion to be’. His analogy for the forecasting of stock
    prices was that of trying to forecast the winner of a beauty contest. Objective
    beauty is not necessarily the issue; what is important is how one thinks the other
    judges’ perception of beauty will be reflected in their voting patterns.


    Rational bubbles arise because of the indeterminate aspect of solutions to rational
    expectations models, which for stocks is implicitly reflected in what is known
    as the Euler equation for stock prices. This states that the price you are prepared
    to pay today for a stock depends on the price you think you can obtain at some
    point in the future. The standard form of the Euler equation determines a sequence
    of prices but does not ‘pin down’ a unique price level. However, in general the
    Euler equation does not rule out the possibility that the price you pay today
    may contain an explosive bubble.


    While one can certainly try to explain prolonged rises or falls in stock prices
    as due to some kind of irrational behaviour such as ‘herding’, or ‘market psychology’,
    nevertheless recent work emphasizes that such sharp movements or ‘bubbles’ may
    be consistent with the assumption of rational behaviour. Even if traders are perfectly
    rational, the actual stock price may contain a ‘bubble element’ and therefore
    there can be a divergence between the stock price and its fundamental value.


    So proponents of rational bubbles attempt to demonstrate how the market prices
    of stocks may deviate, possibly substantially from their fundamental values even
    when agents are homogeneous, rational and the market is informationally efficient.
    To do this they must show that the market price may equal its fundamental value
    plus a ‘bubble term’ and yet the stock will be willingly held by rational agents
    and no supernormal profits can be made.


    It must be stressed that firm conclusions about the existence or otherwise of
    speculative bubbles are difficult to establish. There are severe econometric difficulties
    in testing for rational bubbles. Such tests critically depend on the correct specification
    for asset returns. Rejection of the no-bubble hypothesis may well be due to mis-specifying
    the underlying model of the fundamentals.


    ## Some famous bubbles in history


    It is instructive to examine some of the most famous bubbles in history that have
    ended in speculative collapse. The most analysed have been the Tulipmania in Holland
    in 1636, the South Sea Bubble in England, 1711–1720, and the 1929 Wall Street
    Crash. Recent empirical work, particularly on Tulipmania and the South Sea Bubble
    (Garber, 1989a, b, 1990), has cast doubts on whether these were bubbles. But it
    is still useful to paint the picture.


    ## Tulipmania


    The first account of tulips in Europe is from 1559, when a collector of exotic
    flora, Councillor Hewart, received a consignment of tulip bulbs from a friend
    in Constantinople, which he planted in his garden in Augsburg, Germany. His tulips
    drew a good deal of attention and in following years this flower became more and
    more popular among the upper classes, particularly in Germany and Holland, where
    it became the custom to order bulbs at exorbitant prices directly from Constantinople.
    Up to 1634 this custom became increasingly common, and from that year affluent
    society in Holland considered the lack of a tulip collection to be proof of poor
    taste.


    Year by year tulip bulb prices rose, finally reaching astronomical heights. According
    to original accounts of the peak of the tulip mania, in one deal the following
    price was paid for one tulip bulb of the rare ‘Semper Augustus’ variety: 4600
    florins, a new carriage, two grey mares and a complete bridle and harness. In
    today’s money 4600 florins is $US1.5 million! One single bulb of another rare
    variety, ‘Viceroy’, was sold for 24 carriage loads of grain, eight fat hogs, four
    cows, four barrels of ale, 1000 pounds of butter and a few tons of cheese.


    In early 1636 demand for tulip bulbs had risen so drastically that people started
    to trade them on exchanges in a number of Dutch towns. Tulips were no longer bought
    only by well-to-do collectors but also by investors and speculators. At the smallest
    price drop they bought up, to sell later at a profit. To facilitate trading on
    margin, tulip options were introduced, requiring a margin deposit of only 10–20%.
    Ordinary people in all business sectors started to sell off assets to invest in
    this attractive market.


    The Dutch tulip boom also drew attention from abroad and capital began to stream
    into the market. This capital forced up prices for land, property and luxury goods,
    as well as tulips, to new record heights. Fortunes grew and a growing nouveau
    riche group was added to the old upper classes. This new affluent class had earned
    its money from, and reinvested in, tulip bulbs. The story is told of a brewer
    in Utrecht who went so far as to exchange his brewery for three valuable tulip
    bulbs.


    In September and October of 1636 market psychology began to alter and doubts began
    to emerge. How could one be sure that three tulip bulbs were worth as much as
    a brewery? Suppressed mirth began to be heard. Who said a tulip bulb was worth
    anything at all? The market was seized by panic and prices began to plummet.


    Many of the nouveau riche had to face the fact that they owned a fortune consisting
    only of tulip bulbs which nobody wanted, less broker cash loans which they could
    not repay. The government tried to find a compromise by declaring all tulip contracts
    from before November 1636 as being invalid, while all subsequent contracts would
    be honoured at 10% of original value. But prices dropped below this 10% and the
    number of bankruptcies increased day by day. Tulipmania was followed by a depression
    in Holland from which it took the country many years to recover.


    Garber (1989a, b) points out that the standard version of Tulipmania neglects
    discussion about what the market fundamental price of bulbs should have been.
    To form an expectation about the price of tulip bulbs, Garber collected data on
    bulb price patterns for various highly valued tulip bulbs. He found that the extremely
    high prices reported for rare bulbs and their rapid decline reflected normal pricing
    behaviour in bulb markets and cannot be interpreted as evidence of market irrationality.
    Garber points out that serious traders ignored the market and participants in
    the market had almost no wealth anyway. Garber concludes that tulip prices at
    the time could be explained by market fundamentals and that Tulipmania does not
    qualify as being a bubble. It must be stressed that his findings have been hotly
    disputed.


