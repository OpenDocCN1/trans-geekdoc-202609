    ## The role of expectations in analysing stock market bubbles


    Beliefs about the future are an important determinant of behaviour today. Important
    disagreements between differing views of how expectations are formed lie at the
    centre of the discussion as to the existence or otherwise of ''bubbles''. Different
    views about expectations can be usefully broken down into three groups: exogenous
    expectations, extrapolative expectations and rational expectations.


    ### Exogenous expectations


    Some economists remain almost completely agnostic on the vital question of how
    expectations are formed. When analysing the behaviour of the economy they simply
    treat expectations as exogenous, or given. Expectations are one of the inputs
    to the analysis. The analysis can display the consequences of a change in expectations.
    For example, an increase in expected future profits might increase the stock price
    of a firm. But this assumption of exogenous expectations means that the analysis
    does not investigate the cause of the change in expectations. In particular, it
    is unrelated to other parts of the analysis. With given expectations, there is
    no automatic feedback from rising output to expectations of higher profits in
    the future.


    Thus, at best, economists using exogenous expectations in their analysis give
    an incomplete account of how the economy works. At worst they completely neglect
    some inevitable feedback from the variables they are analysing to the expectations
    that were an input to the analysis. On the other hand, since modelling expectations
    remains a contentious issue, proponents of this approach might argue that the
    various types of possible feedback on expectations can be explored in an ad hoc
    manner.


    ### Extrapolative expectations


    One simple way to make expectations endogenous, or determined by what is going
    on elsewhere in the analysis, when discussing the existence or otherwise of bubbles,
    is to assume that investors forecast future profits by extrapolating the behaviour
    of profits in the recent past, or extrapolate past inflation in order to form
    expectations of inflation in the near future. Proponents of this approach suggest
    that it offers a simple rule of thumb and corresponds to what many investors seem
    to do in the real world.


    ### Rational expectations


    Suppose the rate of money growth is steadily increasing and inflation is steadily
    accelerating. Extrapolating past inflation rates will persistently underforecast
    future inflation. Many economists believe that it is implausible that people will
    continue to use a forecasting rule that makes the same mistake (underforecasting
    of future inflation, say) period after period. The hypothesis of rational expectations
    makes the opposite assumption: on average, investors guess the future correctly.
    They do not use forecasting systems that systematically give too low a forecast
    or too high a forecast. Any tendency for expectations to be systematically wrong
    will quickly be detected and put right.


