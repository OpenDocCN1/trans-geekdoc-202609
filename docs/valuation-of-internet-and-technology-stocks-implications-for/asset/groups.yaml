    # Financial analysis in the valuation of companies


    In analysing the financial position of a company, technology or otherwise, it
    is essential to assess both qualitative and quantitative aspects of the company
    (see Table 5.3).


    # Qualitative company analysis


    Qualitative analysis would include:


    +   - an individual overview of the business

    +   - an overview of the industry

    +   - the position of the business within the industry

    +   - a management profile

    +   - analysis of ‘event risk’ – the risk that a single event could fatally affect
    the company.


    # Quantitative company analysis


    Quantitative analysis would include:


    +   - profit and loss analysis

    +   - balance sheet analysis

    +   - operational leverage

    +   - break-even analysis.


    All companies, technology companies included, seeking to raise finance on the
    international capital market are frequently obliged to gain a credit rating from
    one of the credit rating agencies. These agencies analyse the ability to repay
    any borrowings by analysis of the balance sheet, profit and loss account and the
    cash flow statement. The criteria applied by the rating agency Standard & Poors
    provide a valuable guide as to which financial information should be analysed
    when analysing the financial strength of any company (see Table 5.4).'
