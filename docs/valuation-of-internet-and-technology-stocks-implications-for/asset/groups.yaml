    Another yardstick used to judge the future of the market is the dividend yield.
    The dividend yield has averaged 4.9% from 1871, with a high of 8.71% in 1959 and
    a low of 2.85% in 1973. The dividend yield shows far less variability than the
    earnings yield, as managers pursue policies to stabilize the cash payments to
    stockholders.


