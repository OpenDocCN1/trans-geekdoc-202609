    the value of a call option. This is based on the fact that if a call buyer has
    bought the option rather than the underlying asset then the funds saved can then
    be invested at the now higher interest rate.

    - (6) **Dividends or interest on the underlying asset**: The higher the cash payments
    on the underlying asset the lower the value of a call option. The total return
    on an asset is the cash payment (dividends or coupon interest) plus price appreciation.
    For a given total rate of return, higher cash payments on an asset imply lower
    returns from price increases. Since the call buyer gains only if the price of
    the underlying asset increases, higher cash payments on the underlying asset tend
    to reduce the capital gains and the value of the call option.


