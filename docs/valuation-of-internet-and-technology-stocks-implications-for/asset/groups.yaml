    # Angel’s net stock valuation calculator


    Professor James J. Angel of Georgetown University, USA provides a method that
    calculates the stock price of an Internet company. His calculation is based on
    an assumption that someday an Internet company will ‘grow up’ and become a mature
    company with predictable profits and growth that then can be valued with ‘traditional’
    pricing models. In order to use this model, forecasts need to be made on how the
    company will look when it has matured. Estimates must also be made on the time
    frame it will take for the company to mature. Figure 9.1 below indicates the variables
    needed to calculate the stock price of an Internet company, in this case Amazon.com.
    Explanations of the individual variables can be found below along with his methodology
    for calculating the share price.


    # Net stock valuation calculator variables and methodology


    # Probability of success


    This is a number between 0.0 and 1.0. There are many unforeseen things that can
    go wrong with any high growth stock, and this holds true for any Internet stock
    too. Thus, a proper valuation should take into account the fact that probability
    of surviving is less than perfect.'
