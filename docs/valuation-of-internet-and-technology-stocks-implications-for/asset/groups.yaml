    with DCF, the whole valuation of assets issue again reasserts itself.


    ## Financial accounting and intangible assets


    The accurate measurement of profit is fundamental to financial accounting. Profit
    tells us two things: how much revenue exceeded costs (a measure of the economic
    value of the current operations of the firm) and how much the assets of the corporation
    have increased (before any cash distributions to stock holders). Formally, accountants
    define profit as ‘the excess of revenues over all expenses’. Expenses are ‘the
    costs of goods, services, and facilities used in the production of current revenue’
    (Estes, 1981).


    To the extent that a firm buys inputs that are not used up in production, those
    additional costs are investments, not expenses, and are capitalized, that is,
    considered assets. A capital asset gives rise to an expense only to the extent
    that the capital asset’s value falls while in use, a process normally called depreciation
    or capital consumption. The intertwining of the measurement of corporate earnings
    and corporate assets depends on how one defines investment and assets. To understand
    how definitions of investment affect the measure of profit, which is very important
    in valuing technology stocks, we need to follow the details of corporate profit
    accounting.


    ## The world according to GAAP


    In the United States, corporate books are kept by certified public accountants
    who apply a set of rules called ‘generally accepted accounting principles’ (GAAP).
    According to GAAP, ‘All R&D costs covered by GAAP are expensed when incurred’,
    that is, R&D costs are treated as part of the current expenses of the firm and
    this treatment reduces reported profit. The only part of R&D costs not expensed
    is purchases of durable, tangible assets ‘that have alternative future uses’ beyond
    the project in hand. The rationale for this treatment of R&D is, in part, that
    firms might be tempted to artificially manipulate profits if R&D were capitalized.
    For example, by pretending that some ordinary expenses of the business were R&D,
    the firm might disguise a loss. Another part of the rationale is that R&D expenditures
    are more speculative than investments in fixed assets (fixed assets may have alternative
    uses and thus could be sold to others, but the product which the R&D is designed
    to exploit may not be successful and therefore have no alternative use).


    ## Expensing versus capitalization of R&D expenditures


    The reported earnings of technology firms are misleading, given the way in which
    they treat R&D expenses. Under the rationale that the products being researched
    are too uncertain and difficult to quantify, accounting standards have generally
    required that all R&D expenses are to be expensed in the period in which they
    occur. This requirement has several consequences, but one of the most profound
    is that the value of the assets created by research does not show up on the balance
    sheet as part of the total assets of the firm.


    Many commentators have argued that research expenses notwithstanding, the uncertainty
    about future benefits should be capitalized. To illustrate how the accounting
    principles influence the price/earnings ratio let us take a simple example. Assume
    in both examples below that revenues = $100, operating costs = $50, R&D expenditures
