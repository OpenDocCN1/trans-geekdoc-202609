    ### Some terminology


    A summary of the principal terminology of the options market is offered below:


    - The option buyer becomes the **holder**. The option seller is called the **writer**.

    - A **call** option gives the owner the right to buy a specified quantity of a
    commodity at an agreed price over a given period.

    - A **put** option gives the owner the right to sell a specified quantity of a
    commodity at an agreed price over a given period.

    - The **premium** is the price paid for the option.

    - The **strike price** or **exercise price** is the rate at which the option may
    be exercised; in other words, it is the price which has been agreed under the
    option contract.

    - The **expiry date** is the final date on which the option can be exercised.

    - A **European-style** option can be exercised only on the expiry date, whereas
    an **American-style** option can be exercised at any date prior to and including
    the expiry date. (Note that these terms have no geographical significance.)


    ### Exchange-traded versus over-the-counter options


    Options may be traded on exchanges, i.e. in a physical location, or on the over-the-counter
    (OTC) market, in which dealing takes place between two counterparties, usually
    over the telephone.


    Exchange-traded options have the following characteristics:


    - Fixed expiry dates, generally at 3-monthly intervals for the third Wednesday
    in March, June, September and December.

    - Maturities generally up to two years.

    - Strike/exercise prices at fixed intervals.

    - Fixed contract sizes.

    - Standardization of contracts. This means that markets tend to be liquid. In
    other words, bid-offer spreads (the difference between the buying and selling
    price) tend to be narrow, and large orders can usually be transacted fairly easily.

    - Given that these options are traded on regulated exchanges, trading is closely
    monitored. The clearinghouse of the exchange acts as the counterparty to every
    trade, thus the credit risk, i.e. the risk of default on a trade, is standardized
    and limited.

    - Prices are publicly quoted, i.e. trading takes place by open outcry between
    traders on the floor of the exchange.

