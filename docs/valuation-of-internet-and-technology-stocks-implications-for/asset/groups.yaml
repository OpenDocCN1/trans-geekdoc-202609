    # The role of intangible assets: if you cannot touch it what is it worth?


    The word intangible is defined by Webster''s Dictionary as something ‘that represents
    value but has either no intrinsic value or no material being’. The fact that intangible
    assets are lacking in intrinsic value or material being makes it difficult to
    pinpoint their value, yet such assets often play an important role in the value
    of a business, a fact particularly true for technology companies. So how do you
    determine the value of intangible assets?


    Every year, thousands of companies seek money from stock offerings, mergers, joint
    ventures and divestments. These are common financial techniques for either raising
    operating capital or for enabling the founders of a project to exit it. In all
    of these cases, the valuation of the company is a critical point. The valuation
    is the total worth of company’s assets as agreed upon between a seller and a buyer(s).


    Two types of assets influence the valuation of the company: tangible and intangible.


    +   - **Tangible assets** are real-world, physical items. They include cash, real
    estate, machinery, equipment, inventory, etc.

    +   - **Intangible assets** have value because of their implicit usefulness or
    worth. They include such things as proprietary knowledge, processes, and products,
    a desirable market segment, customer lists, and many other items.


    For good reason, accounting practices tend to emphasize objective measures of
    value. In doing so, they treat the business as essentially an assembly of tangible
    tradable assets. Yet the real value in most businesses is in their intangible
    assets.


    How much of the future revenue and profitability of a firm is due to its market
    share and the reputation it and its products now enjoy? How much is due to the
    cooperative and knowledgeable relations established over time with suppliers and
    distributors; to the expertise and insight of its personnel, and more particularly
    the ways they have developed integrated business approaches to produce products
    and serve markets; and to the systems and practices created within the firm as
    the way of'
  - '[PAGE 112]


    doing business? The balance sheet statement is silent about these and other components
    of business upon which businesses depend for future earnings.


    # Types of intangible assets


    Many businesses have intangible assets, and no list could ever be complete given
    that intangibles can be unique to a specific business. Some, however, are fairly
    common and can be found in many businesses. These more common intangibles include:


    +   - **Proprietary lists:** Proprietary lists can include customer or client
    lists, patent lists or even mailing lists, whether they are made up of customers
    or prospects. Lists can be especially valuable to a business if the relationships
    they represent are ongoing. Consider, for example, a magazine’s list of advertisers.
    The magazine may get 75% of its advertising revenue from the companies on that
    list. Therefore, the list is critical to the magazine’s future profitability.

    +   - **Beneficial contracts:** Long-term contracts can add value to a company.
    For instance, a company may have a contract that allows it to sell its product
    or service for a higher-than-normal mark-up. Or it may have a contract that allows
    it to purchase or lease items at a below-market rate.

    +   - **Patents and applications for patents:** How much the patents are worth
    depends on the strength of the patent claim (which can be difficult to determine
    if the patent hasn’t withstood litigation), and the patent’s economic and legal
    life.

    +   - **Copyrights:** Copyrights are trickier to value than patents because, while
    they may have a long legal life, their practical value may only be for a short
    period. This is especially true for technical works that become dated quickly.
    The value of a copyright also depends on the author’s previous success.

    +   - **Trademarks and brand names:** If a brand name or trademark enables a company
    to sell its products for a higher price or in greater quantity than its competition,
    it has value.

    +   - **Subscriptions and service contracts:** Subscriptions are especially important
    for newspapers, magazines and cable companies because a large portion of their
    revenues is based on subscriptions. With both subscriptions and service contracts,
    the longer they have been in effect, the more they are worth.'
  - '[PAGE 113]


    +   - **Franchise agreements:** Franchises with long track records and well-recognized
    names have significant value over newer, lesser known franchises. This is especially
    true in some industries (such as the hotel industry) that are dominated by franchises.

    +   - **Software:** Many companies have developed proprietary software specific
    to their businesses. If this software provides efficiencies and benefits that
    the business wouldn''t have without the software, it is a separate asset.

    +   - **Goodwill:** Goodwill means many things to many people, but generally it
    refers to intangibles like reputation and location that lead to repeat business.


    # Methods for valuing intangible assets


    Valuing intangible assets can be done using one of three basic methods: cost of
    creation, capitalization of income or savings, or discounted cash flow. Rule-of-thumb
    formulas do exist for some assets in some industries but are better for providing
    an estimate of value to be compared with the value determined by the other methods.


    # Cost of creation


    The cost of creation method of valuing intangible assets relies on calculating
    what it would cost another business to duplicate a given asset today. This method
    does not measure an asset''s future impact on profits; it merely looks at what
    it would cost to create the asset from scratch at a particular point in time.


    Assets that may be valued using the cost of creation method include:


    +   - Internal software

    +   - Patents

    +   - Trademarks

    +   - Copyrights

    +   - Subscriptions

    +   - Customer lists

    +   - Service contracts


    # Capitalization of income or savings method


    The capitalization method measures the future benefits intangible assets will
    bring to a company, identifies when those'
