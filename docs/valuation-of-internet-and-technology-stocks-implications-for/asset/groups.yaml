    在接下来的十年左右，美国工业将微处理器应用于其他任务。数字电子革命的产物——全新的产品——涌入市场——包括蜂窝电话、机器人工厂手臂、空中交通管制系统、全球定位卫星、激光手术工具、摄像机、掌上个人组织器，仅举几例。


    微处理器使现有产品变得更好、更便宜、更高效。从 1980 年代初期开始，“智能”功能帮助精细调节电视机，降低冰箱能耗，控制微波炉烹饪，记忆录像机的节目安排，并为汽车生成诊断报告。


    大学是首先将计算机接入网络的机构，但没过多久，每日美国人便开始通过电子邮件连接。互联网在 1990 年代进入时，是供教育工作者和科学家使用的晦涩通信网络。它以大众的图书馆、购物中心和游乐场结束了这个十年。互联网正在产生溢出效应，使现有行业更高效，并催生全新的行业，包括网页设计和互联网服务。


    计算机处理能力在三十年内跃升了 7000 倍。20 世纪 70 年代初期需要一周的计算任务现在只需一分钟。英特尔于 1993 年 5 月发布的奔腾芯片，在
    16 毫米乘 17 毫米的硅片上集成了 310 万个无缺陷晶体管。它可达到每秒高达 112 百万条指令的计算速度。


    数据存储容量和传输速度也随着更强大的微处理器同步激增。单个存储芯片现在可容纳的数据量是 20 世纪 70 年代初期的 25 万倍——相当于一页文本与 1600
    本书之间的差异。传输速度提高了近 20 万倍。1970 年，通过互联网从纽约向旧金山发送 32 卷《大英百科全书》需要 97 分钟。今天的主干线路可在 1
    秒内传输相当于 8 套完整版的内容。


    巨大的功率、容量和速度飞跃带来了信息管理成本的进一步大幅降低。英特尔 1970 年代的老芯片售价为每兆赫 7600 美元。今天的奔腾 III 芯片以每兆赫
    17 美分的成本提供其计算能力。存储 1 兆比特信息——相当于一本 320 页的书——的成本从 1975 年的 5257 美元下降到 1999 年的 17
    美分。1970 年，跨海岸发送《大英百科全书》需花费 187 美元，主要是由于数据传输速度缓慢和长途电话费昂贵。今天，整个国会图书馆可通过光纤网络仅花费 40
    美元即可在全国范围内传输。


    随着新技术变得更好、更便宜，美国企业和家庭纷纷采用它。1980 年只有几千户家庭拥有个人电脑。现在美国超过一半的家庭拥有电脑，其中最新的电脑比 1981 年推出的
    IBM 首台个人电脑强大 200 倍。美国五分之三的家庭已接入互联网，这种即时通信方式在 1990 年代初期几乎无人知晓。这种技术增长为“旧经济规则已被彻底改变”这一观点提供了支撑。


    ## 总要素生产率增长的上升


    总要素生产率增长是指产出增长中无法用资本或劳动的物理增加来解释的部分。其对经济增长的贡献不易识别和衡量，但仍然是经济增长的重要来源。这种现象源于信息技术在整个经济中的日益利用以及由此产生的溢出效应。总要素生产率增长取决于：

    - 技术变革

    - 知识的其他进步，例如准时制生产

    - 规模经济。


    溢出效应发生在他人进行类似投资时，投资回报增加。这里的例子是网络以及随着更多消费者和企业接入互联网，对可接入互联网的计算机的回报。


    互联网的影响是加剧了产品市场竞争，并带来了相关的效率。


    图 2.1 显示了互联网收益的潜在影响。无线电实现 5000 万用户用了 36 年，电视用了 13 年，个人电脑用了 16 年，而互联网不到 5 年。


    ## 技术溢出：递增回报与递减成本


    即使单个行业面临规模报酬递减，整个经济仍可能因技术溢出使一个行业的收益惠及其他行业而享受递增回报。技术溢出在发明中尤其丰富


    然而，这些成就确实改变了我们生活的想法却有其批评者。戈登（1998b），一位领先的新经济怀疑论者，认为计算机与电力、内燃机或生物技术等早期的技术进步相比相形见绌。戈登认为计算机可能并不特别具有生产力，因为它们主要重新分配产出，而不是创造产出。戈登的意思是，计算机可能通过提供更好的工作条件来提高工人的效用，其中包括电脑游戏，或者它们创造了顾客不重视的产出，时髦字体就是一个例子。


    ## 要素利用的增加


    这在非加速通胀失业率概念的下降中体现得最明显，非加速通胀失业率是一个原则，最早由莫迪利亚尼和帕帕德莫斯（1975）定义。许多经济学家（例如，梅耶，1997）认为，存在失业率的某个阈值水平，在该水平上劳动力市场（也许产品市场也是如此）的供给和需求处于平衡。这种平衡产生恒定的通胀率。因此，NAIRU
    是可以在不改变通胀率的情况下维持的失业率。如果失业率低于该阈值水平（NAIRU），通胀往往会随着时间的推移逐步上升。20 世纪 90 年代末美国的失业率被广泛认为低于该阈值；因此人们对低通胀率感到困惑。


    通胀在强劲 GDP 增长和低失业率面前未能上升的可能解释是 NAIRU 已下降；也就是说，劳动力供给与需求平衡的失业率水平可能比以前更低。美联储主席格林斯潘（1997）等人提出的观点，即技术变革在近年增加了工人的不安全感，使他们不愿要求更高的工资，可以被视为这种解释的一种版本。更大的不安全感可能在任何失业率下减少工资率的上升压力，从而降低工资（和价格）开始上涨的阈值率。产品市场竞争加剧应会降低
    NAIRU 水平的理由可能是由于互联网的影响以及世界市场的全球化（下面讨论）。


    瓦德瓦尼（2000）已证明，互联网在零售市场中的影响应会降低价格，因为：

    - 较低的搜索成本应导致价格下降

    - 较低的市场进入成本将限制现有市场参与者可维持的价格溢价，通过增加实际或潜在竞争

    - 通过缩短供应链，分销和库存成本将更低。


    NAIRU 的估计表明，过去几年低失业率本应产生相当显著的价格加速，但通胀却持续下降。罗伯特·戈登（1997）和斯泰格、斯托克和沃森（1997）等人将这种现象视为
    NAIRU 下降的证据。其他人认为，特殊因素，例如员工健康保险向健康维护组织的转移，暂时掩盖了通胀的上升。另一个经常引用的解释是，20 世纪 90 年代末通胀表现令人惊讶地好，涉及美国经济对外国经济状况日益敏感的因素。由于近年海外产能利用率疲软，据认为美国通胀一直温和。据进一步认为，这是由于世界经济的全球化，我们现在转向讨论这一问题。


    ## 世界经济的全球化


    “全球化”在经济方面是指世界各国经济通过贸易和金融流动日益一体化的过程。该术语有时也指劳动力（劳动）和知识（技术）在国际边界间的流动。


    日益加剧且前所未有的全球化，部分由技术变革驱动，部分由政府人为消除货物、服务、人员、金融资本、企业和思想国际流动的障碍所推动，已改变了国际和国内竞争环境。


    从最基本层面看，全球化并没有什么神秘之处。该术语自 1980 年代以来被广泛使用，反映了技术进步使事情变得更容易和

