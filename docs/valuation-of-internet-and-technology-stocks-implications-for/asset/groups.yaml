    和 Scholes（1973）在其期权定价公式的推导中假设了该过程。与二叉树模型一样，Black 和 Scholes 首先构建一个无风险套期保值组合，持有标的证券多头并做空看涨期权。该组合产生无风险回报率，但组合的内部动态由证券价格的扩散过程驱动。套期保值组合的结构可以被置于与物理学中的热方程相同的形式。


