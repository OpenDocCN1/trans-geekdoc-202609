    ## Moore’s law: the processing power of microchips


    Data transmission costs and computing costs are plummeting. Why is this important?


    One of the chief enablers of the New Economy is instantaneous global communications:
    the ability to easily send and receive data – everything from documents to video
    and multimedia – inexpensively. One measure of progress in that direction is the
    cost of data transmission. The cost to transmit one bit of data over a kilometre
    of fibre-optic cable declined by three orders of magnitude between the mid-1970s
    and the beginning of the 1990s, allowing more data to be transmitted over longer
    distances at lower prices.


    Technologies for transmitting data are also getting more and more powerful. For
    example, technology recently developed by Lucent transmits 3.2 terabits – which
    is approximately equal to 90 000 volumes of an encyclopaedia – per second.


    Computing costs continue to fall. In a 1965 speech, Intel chairman (now emeritus)
    Gordon Moore made a famous observation: With price kept constant, the processing
    power of microchips doubles every 18 months.


    ![](img/67ce553842aa835a611c7cbbbb028358_45_0.png)


    Figure 3.2 Moore’s law and data transmission costs


    Moore’s law, as it came to be known, and is illustrated in Figure 3.2, governs
    Silicon Valley’s most important product cycles, for hardware and software alike.
    And its relentless drive has spawned whole new industries: digital watches, calculators,
    videogames, the Internet – with smart phones, digital TV, etc.


    In fact Moore’s law, which says that the processing power of microchips doubles
    every 18 months, has a corollary: the cost of computing is dropping by nearly
    25% per year. In 1978, Intel Corp introduced its 8086 chip, which defined the
    base architecture for the later x86 series (including the 386, 486 and Pentium
    chips). It contained 29 000 transistors. Four years later came the 286, with 134
    000 transistors. Three years after that, the 386 had 275 000 transistors. And
    on the trend goes: the Pentium Pro, introduced in 1995, had 5.5 million transistors
    in its core central processing unit. Meanwhile, the cost of all that computing
    power has been dropping precipitously. In 1978, the price of Intel’s 8086 was
    1.2 cents per transistor, and $480 per million instructions per second (mips).
    By 1985, the 386 cost 0.11 cents per transistor and $50 per mips. Ten years later,
    the Pentium Pro’s introductory price amounted to 0.02 cents per transistor, and
    $4 per mips.


