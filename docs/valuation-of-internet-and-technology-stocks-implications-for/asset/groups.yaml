    ## Gilder’s law: developments in bandwidth


    The term bandwidth is used to mean the slice of the radio spectrum available for
    transmission. Today it is mostly used to describe the rate at which information
    – measured in bits of data per second – can move between computers.


    The ability to transfer large amounts of data is largely determined by bandwidth,
    the carrying capacity of the connections, or the ‘size of the pipes’, between
    the sender and the receiver of the data. Greater bandwidth allows faster transmission
    of larger amounts of data, which in turn facilitates not only the development
    of vastly more valuable and compelling on-line services, but also the convergence
    of all forms of electronic data transmission, from e-mail and basic text documents,
    which require relatively little bandwidth, to full-motion, real-time video applications,
    which require a great deal of carrying capacity.


    Fibre-optic cable, currently being laid as fast as the companies supplying it
    can dig trenches, is increasing this carrying capacity. Pundit George Gilder has
    proposed a bandwidth corollary of Moore’s law: Backbone capacity will triple annually
    for the next quarter century. It could happen. Already, corporate Internet users
    are measuring their access in gigabits per second – sufficient to start realizing
    the trillion-dollar pipe dream of TV and Internet convergence.


    ## Metcalfe’s law: the impact of network externalities


    In June 1973 Bob Metcalfe, working with Vinton Cerf and Robert Kahn, who in 1974,
    as mentioned earlier, published the blueprint for the Internet, set out what became
    known as Metcalfe’s law. This states that ‘the value of a network is proportional
    to the square of the number of nodes in the network’. The basic idea is that after
    a certain point the value you get from connecting computers and devices outstrips
    the cost.


    These benefits generate what economists call network externalities. Fax machines
    and board games share an economic quirk, each new one sold – or, in the case of
    games, each new enthusiast who learns the rules – adds to the value of the rest.
    A fax machine isn’t worth much if there are no others to communicate with; board
    games aren’t much fun if no one else knows how to play. Thus the whole adds to
    the value of each of its parts.


    Network externalities – a term for the effect one person’s decision to buy into
    a network has on others who are still thinking of buying in – have been the Net’s
    rocket fuel: the more people who connect, the more valuable a connection becomes.
    But the Internet in turn is bringing network externalities to the economy as a
    whole, a concept we discussed earlier in Chapter 2 when examining some of the
    aspects of the New Economy. Knowledge is affected by the same sorts of network
    externalities as Internet connections themselves; having the equipment to receive
    messages is no more important than having the knowledge to understand them. This
    explains why the future seems to happen so fast on the Internet. Change accelerates
    itself. And yesterday’s arcane knowledge becomes today’s essential information.


    So Metcalfe’s law, that the value of a network increases as the square of the
    number of linked devices, creates an environment in which network externalities
    guarantee the benefits of increased Internet usage.


