    \n所有支付股息或预计在未来某个时间支付股息的股票都可以使用这种方法进行建模。使用 DDM 时必须记住的关键点是，投资者必须通过模拟增长率(s)来考虑从现在到无穷大的所有股息。如下面所示，这一过程的机制是，我们实际上看不到所有这些股息，因为公式简化为简化形式，但尽管如此，使用\
