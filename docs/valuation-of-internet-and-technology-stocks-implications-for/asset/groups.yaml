    runs at two gigahertz, or two billion cycles per second, again marking the doubling
    of computer chip speed in only one year and a half (see Figure 3.3). The prices
    will no doubt continue to fall in the future.


    ![](img/67ce553842aa835a611c7cbbbb028358_46_0.png)


