    # Angel''s valuation model


    Angel''s methodology is fairly simple. First, he calculates the value per share
    of the firm in the future after it grows up, as shown in Step 1 below.


    Price in the future = Revenues in the future

    * Profit margin * P/E ratio in future

    Step 1


    Then he discounts to today''s value by taking into account the probability of
    success, the discount rate and the number of years to maturity. This can be seen
    in Step 2.


    Price today = Probability of success

    * Price in future / (1 + discount rate)^

    (No of years to maturity)

    Step 2


    Figure 9.1 highlights a hypothetical example of valuing an Internet stock by using
    this method to value Amazon. Certain assumptions must be made. Suppose an Investor
    assumes that Amazon.com has a 75% chance of receiving $10 billion in revenues
    per year in five years'' time, with a 5% profit margin. The investor also believes
    that its P/E ratio will be 25 then and the expected discount rate for the stock
    will be 10% per year. Assuming that the total amount of shares outstanding is
    159 million, Angel calculates Amazon''s share price at $37. One must then compare
    this valuation with the market price to decide if it is cheap or expensive.


    The problem with valuation methods that result in earnings forecasts such as Angel''s
    valuation technique is that they require estimates of revenue growth, profit margins
    and other important inputs. This becomes an even bigger problem for new Internet
    start-up companies, with little history and vague business plans. The most logical
    and thoughtful estimates are still big guesses. This is especially true where
    discounted cash flows are used as outcomes can be very sensitive to the discount
    rate.


