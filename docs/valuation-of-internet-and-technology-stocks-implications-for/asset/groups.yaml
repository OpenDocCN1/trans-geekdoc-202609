    benefits will be generated and determines for how long. The capitalization rates
    used in this method should reflect the risk associated with the intangible asset
    being valued.


    In addition to the income an intangible asset may bring to a company, the benefits
    may also include savings to the company as a result of owning the asset, or not
    having to pay a royalty to someone else who owns the asset or of efficiencies
    generated by the asset.


    Intangible assets that this technique is suited to include:


    +   - Trade names

    +   - Customer lists

    +   - Commercial software

    +   - Patents

    +   - Trademarks

    +   - Brand names


    The capitalization method works well for all of these assets when they are relatively
    new. As they come closer to the end of their economic usefulness, however, other
    methods of valuing them may become more appropriate.


    # Discounted cash flow


    The discounted cash flow method is good for assets with predictable life spans
    and future financial benefits, including:


    +   - Contracts (current and future yearly benefits)

    +   - Subscriptions and service contracts

    +   - Patent royalties


    # Methodology issues in technology stock valuations


    Accounting issues are always important in stock valuation, particularly where
    valuations are based upon multiples of income statement data. We discuss the role
