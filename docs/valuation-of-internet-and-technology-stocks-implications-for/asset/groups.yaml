    Industry competition can be expected to grow as service providers are increasingly
    implementing the same generic concept. Specific characteristics of the Internet
    in relation to industry competition revolve around an increase in suppliers’ power.


    ## Suppliers’ power


    The suppliers of the Internet are technology and platform providers (Yahoo, Microsoft,
    etc.). The objective of platform providers is to establish and control the dominant
    standard. This strategy is based, for example, on the success of Microsoft MS-DOS
    as the de facto standard operating system of the 1980s and Windows for the 1990s,
    control of which gave Microsoft enormous leverage in application software.


    The market dominance strategy of the technology providers, such as Microsoft,
    means that technology users can obtain major parts of the basic technology rather
    inexpensively. On the other hand, those technology users cannot derive strategic
    advantages from the basic technology, as it is generally available. They may be
    in a strong position to negotiate especially advantageous price deals, as the
    technology providers are strongly interested in enhancing market share. In the
    future the situation might change, if relatively small companies with particular
    circumstances supply critical technology for highly specialized advanced services,
    for example technology for intelligent service assistance or one-to-one marketing.


    The reaction to this threat to existing businesses has been defensive. In particular
    large companies have reacted to it by applying familiar concepts of branding,
    to which we now turn.


    ## Technology stocks and branding


    Branding is a major factor in product strategy decisions for technology companies.
    But what is a brand and why is it so important for technology companies? The origins
    of the word ‘brand’ go back to old English, where it meant a burning piece of
    wood. Over the years it came to mean something that was created as a result of
    intense heat, associated with branding criminals or cows.


    ### The American Marketing Association defines a brand as


    A **brand** is a name, term, sign, symbol, or design, or a combination of them,
    intended to identify the goods or services of one seller or group of sellers and
    to differentiate them from those of competitors.


    Interbrand, a specialist brand consultancy, have a more financially specific definition
    of a brand. Interbrand regards the brand as an intangible asset that creates an
    identifiable economic earnings stream. Their approach to brand valuation is based
    on the principle of economic use, which means the value the brand adds to the
    underlying business. Brand value is defined as the net present value of the economic
    profit that the brand is expected to generate in the future. Table 5.2 illustrates
    that many of the world''s most well-known companies have a brand value, rather
    than an asset value, which represents a significant proportion of their market
    capitalization.


    In essence, a brand identifies the seller or maker. It can be a name, trademark,
    logo or other symbol. Under trademark law, the seller is granted exclusive rights
    to the use of the brand name in perpetuity. Brands differ from other assets such
    as patents and copyrights, which have expiration dates.


    A brand is essentially a seller''s promise to deliver a specific set of features,
    benefits and services consistently to the buyers. The best brands convey a warranty
    of quality. But a brand is an even more complex symbol. It can convey up to six
    levels of meaning:


    - (1) *Attributes*: A brand brings to mind certain attributes. Mercedes suggests
    expensive, well-built, well-engineered, durable, high-prestige automobiles.

    - (2) *Benefits*: Attributes must be translated into functional and emotional
    benefits. The attribute ‘durable’ could translate into the functional benefit:
    ‘I won’t have to buy another car for several years.’ The attribute ‘expensive’
    translates into the emotional benefit: ‘The car makes me feel important and admired.’

    - (3) *Values*: The brand also says something about the producer’s values. Mercedes
    stands for high performance, safety, and prestige.

    - (4) *Culture*: The brand may represent a certain culture. The Mercedes represents
    German culture: organized, efficient, high quality.

    - (5) *Personality*: The brand can project a certain personality. Mercedes may
    suggest a no-nonsense boss (person), a reigning lion (animal), or an austere palace
    (object).

    - (6) *User*: The brand suggests the kind of consumer who buys or uses the product.
    One would expect to see a 55-year-old top executive behind the wheel of a Mercedes,
    not a 20-year-old secretary.


