    # External analysis: strategic factors for analysing the industry environment


    An industry analysis usually begins with a general examination of the forces influencing
    the organization. The objective of such a study is to use this to develop the
    competitive advantage of an organization in its ability to defeat its rival companies.


    This type of analysis is often undertaken using the structure proposed by Porter.
    His basic model is illustrated in Figure 5.1. This is often called Porter''s Five
    Forces Model because he identifies five basic forces that can act on the organization:


    +   - the bargaining power of suppliers

    +   - the bargaining power of buyers

    +   - the threat of potential new entrants

    +   - the threat of substitutes

    +   - the extent of competitive rivalry.


    The objective of such an analysis is to investigate how the organization needs
    to form its strategy in order to develop opportunities in its environment and
    protect itself against competition and other threats.'
