    |---|---|

    | **Business overview** |  |

    | Company history | Where has the company come from and where is it going? This
    is not only about historic financial performance, but also longevity and culture
    (e.g. has the company grown organically or via acquisition?). If a company has
    survived historic economic fluctuations, changes in technology, culture and the
    outside world, it is fair indication that the company will survive in the future,
    although this is not guaranteed |

    | Structure | What is the company structure? How are subsidiaries controlled?
    Where are the assets located/situated (i.e. can they be repatriated) and where
    is the cash generated? |

    | Shareholders | Who are the main shareholders, what is their interest/purpose
    in owning the company? Could they offer support? |

    | **Industry analysis** |  |

    | Political/economic importance | Is there political risk? Does the industry have
    national, political or economic importance? Is it likely to receive government
    support if necessary? |

    | Regulatory risk | Is the regulatory environment supportive or hostile? Could
    this change? What would the implications be? |

    | Size/growth potential | What are the industry prospects? Is it growing or declining?
    Are there any technological changes on the horizon, a very important consideration
    with technology stocks? Is it possible to raise prices? Are there any substitute
    products? Is the industry consolidating? |

    | Competition | What is the competitive structure of the industry? Is the industry
    a monopoly, duopoly, oligopoly or is it highly competitive? Is there pricing flexibility?
    |

    | Barriers to entry | Are barriers to entry a competitive advantage, or will they
    work against the company? |

    | Profitability | Is the industry profitable? A company can be very efficient
    and well run, but if the structure of the industry is such that it is unprofitable,
    it may not make money |

    | Cyclicality | How resilient is the industry to an economic downturn? How volatile
    has past performance been, again very important for technology companies? How
    does cyclicality feed through to profit margin and cash flow? |

    | Key success factors | Is the industry driven by price, quality or service, quality
    of product, distribution capabilities or other factors? Is its success placed
    on technology developments only? Why should the customer buy this company''s product?
    |

    | **Business position** |  |

    | Country/political risk | The economic, political and regulatory conditions of
    the company''s home country and/or places of doing business are an important starting
    point, i.e. what is known as a ''top-down'' approach |'
