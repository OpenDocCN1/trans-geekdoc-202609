    a year during the recent US business expansion (first quarter of 1991 to first
    quarter 2001). Moreover, with software prices falling much less than prices of
    computers and peripheral equipment during this period (1.6% versus 19.3%), the
    inclusion of software prices has had the effect of slowing the rate of decline
    of prices of information processing equipment (computers, software and other equipment).


    The effect of these statistical revisions is that software purchases now boost
    the GDP growth figures. Previously when corporations and governments bought software
    the Bureau of Economic Analysis (BEA) rated it as ‘purchased input’, much as when
    an auto company bought steel or a newspaper bought newsprint. So now software
    has been added to the ‘business investment’ column meaning that the BEA recognizes
    that software lasts more than a year, adding directly to the computed value of
    GDP.


