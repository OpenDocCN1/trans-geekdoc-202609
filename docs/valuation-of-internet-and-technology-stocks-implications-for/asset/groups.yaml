    fundamental economic conditions; one group of investors buys with the expectation
    of a large capital gain, and others follow suit, without paying proper attention
    to economic factors such as future dividends or interest rates. If such behaviour
    persists, it may feed on itself as consecutive waves of buying increase prices.
    Speculative bubbles may subsequently burst very suddenly. An overvalued market
    is fragile and a relatively unimportant piece of ‘bad’ news may easily create
    pessimism and set off a selling wave.


    The traditional method of searching for market overvaluation or speculative bubbles
    counts the number of unusually high returns during the suspected bubble period
    and assesses the likelihood that the total number of these high returns could
    have arisen from chance (Blanchard and Watson, 1982). An unusually high return
    (or a positive ‘abnormal’ return) is a return higher than the risk-free rate plus
    the usual risk premium necessary to compensate risk-averse shareholders for the
    uncertainty associated with their security returns. In the absence of a speculative
    bubble, a very large number of unusually high returns would normally occur by
    chance only with a small probability. Hence, a large number of unusually high
    returns constitutes evidence consistent with the presence of speculative bubbles.


    Unfortunately, although simple, the traditional test has low statistical power
    to detect speculative bubbles; share prices are very volatile and their swings
    generate both large positive and large negative returns. The latter tend to mask
    any existing bubble evidence.


    In order to construct a more powerful test for bubbles, it is necessary to formulate
    a more precise economic account of the development of the bubble. One can imagine
    many different scenarios of market overvaluation, but analysis restricts the possible
    scenarios to those in which investors know that the market is overvalued yet show
    no special desire to liquidate their positions and continue to buy or sell as
    they would in the absence of bubbles. This is a realistic working assumption for
    the period before October 1987. Robert Shiller (1987) provides survey evidence
    indicating that, before October 1987, 71.7% cent of individual investors and 84.3%
    of institutional investors thought that the market was overvalued at the time.
    Schiller argued that the crash was generated by what he calls a ‘feedback loop’.
    After a first price decline investors sold, not based on fundamentals, but because
