    ## 债券收益率/股票收益率比率


    投资者始终在股票和债券之间做出选择。从长期来看，这两类资产应实现相似的回报，或者在调整风险和流动性差异后至少实现相似的回报。在英国，历史上政府债券支付的收益通常比股息收益率多出一点超过两倍。在美国，历史平均值更接近三。


    分析师使用债券/股票收益率比率作为基准，以判断债券或股票价格是否会回归历史平均水平。表 4.5 说明了其运作方式。


    表 4.5 为什么债券收益率驱动股票（股息）收益率（反之亦然）


    | 历史平均债券收益率/股票收益率 | 假设当前比率 | 股价 | 股息收益率 | 债券价格 | 债券收益率 |

    |---|---|---|---|---|---|

    | 3 | <3 | ↑ | ↓ | ↓ | ↑ |

    | 3 | >3 | ↓ | ↑ | ↑ | ↓ |


    然而，股息收益率必须谨慎解读。如果股息收益率低是由于即将到来的衰退对盈利的影响，那么该比率必须谨慎对待。


    ## 托宾 q 比率


    除了将公司的股息或收益与股票价格进行比较之外，将公司证券的价值与其资产价值进行比较也可能很有用。市值与基础企业资产重置成本之比被称为托宾 q。它以其创造者、耶鲁大学诺贝尔奖获得者詹姆斯·托宾命名。


    托宾 q 是一个足够简单的概念。（a）根据市值计算的公司价值与（b）其资产重置成本之比应等于 1。毕竟，比率的分子和分母只是衡量同一事物——公司价值的两种方式。


    当公司预期收益高或快速上升时，其在金融市场上的价值超过其资产的价值。相反，当公司前景特别黯淡或不确定时，其价值可能低于其资产价值。


    如果 q 出于某种原因大于 1，这意味着股市对公司拥有的资产的估值高于获取这些资产的成本。因此就会产生一种套利机会。如果 q 大于 1，可以预期公司会增加投资，presumably
    直到市场认为公司的价值现在等于其资产成本。在那时 q 将再次等于 1。


    美国联邦储备局对非金融公司在 1998–2000 年期间的托宾 q 估计显示，自 1925 年以来估值最高。根据美联储的计算，其在 0.4 的最低值和 1.8
    的最高值之间波动，后者为千禧年末的水平。平均水平为 0.7。


    高于 1 的数值，自 1991 年以来首次在 25 年内出现，表明企业通过发行股票来为生产性资本（土地、厂房）的积累融资，比通过在股票市场上购买相应证券来“二手”购买此类资产更为有利。


    在 20 世纪 70 年代初和 80 年代初，该值通常小于 1，表明公司相当便宜。如果该比率回归长期平均水平，美国股市将下跌 50%。


    Smithers 和 Wright（2000）最近分析了美国股市，得出 q 比率远超 2。他们发现，当比率（经过适当调整以考虑会计差异）远高于 1 时，均衡最终确实会恢复——但不是通过公司资产重置价值的激增，而是通过其股价的急剧下跌。正如
    Smithers 和 Wright 所指出的，1968–74 年在 q 之前的峰值后发生了这种情况。他们指出，2000 年 q 的价值现在高于 1929 年或
    1986 年的任何一年。


    这种类型的比率必须非常谨慎地处理，因为有形和无形资产的估值存在问题。例如，无形资产（知识产权、商标、专利、know-how）往往在 q 的分母中被低估，导致比率被高估。这个论点经常被提出以解释
    q 目前的高水平，理由是无形资产现在比过去重要得多。我们将在第 11 章重返这些观点。


    ## 市净率（P/BV）


    公司资产负债表显示股东资金的账面价值数字，可表示为每股净资产。2001 年美国股票的售价创纪录地达到账面价值的 4.9 倍。账面价值是指公司资产负债表上资产的价值。2001
    年约为过去 20 年平均倍数的 2.5 倍。


    但有一句老投资格言：“资产的价值仅在于其能赚取的收益”。当公司拥有未开发的资产可出售或用于其他用途时——例如办公楼或对其他公司的股份——资产分析最有用。不灵活的资产如机械或油井可能需要更谨慎地分析。


    如上所述，制造业的衰退凸显了当今公司中无形资产的重要性——品牌名称、软件、版税权利以及劳动力的技能。由于在资产负债表中对其进行满意估值如此困难，因此资产价值分析以及随之而来的市净率的使用已下降重要性。


    ## 市销率（P/SR）


    这仅仅是公司股票价值（即其市值）与其销售额之比。这可能看起来是一个令人困惑的指标，因为不同行业的利润率可能差异很大。但在 1996 年出版的有影响力的书籍《华尔街上什么有效》中，美国量化投资者
    James O’Shaughnessy 将市销率描述为“价值因素之王”。


    O’Shaughnessy 发现，低资本化与销售额比率的股票比任何其他价值比率更能跑赢市场。他强调投资者应谨慎对待市值超过公司销售额两倍以上的股票。


    O''Shaughnessy 使用追溯到 1951 年的数据，分析了用于选择普通股的所有基本投资策略，如账面价值、现金流、P/E、ROE、收益率等。O''Shaughnessy
    发现，基于年度再平衡投资组合的 50 只 PSR 最低的股票，在 1954 年至 1994 年的 40 年间以年均 15.42% 的速度表现，而他所研究的全部股票年均收益为
    12.45%。PSR 最高的股票每年仅赚取 4.15%。此外，将低 PSR 股票（通常 PSR 为 1.0 或更低）与表现 *动量*（12 个月最佳价格表现）的股票相结合，在整个
    40 年期间产生了年均 18.14% 的回报。


    ## 经济增加值（EVA）


    一种不同的估值方法颠覆了整个问题，并处于投资分析的前沿。而不是预测所有输入以得出股票应有的价值数字，该方法从股价开始倒推，回答问题：该公司需要实现何种增长才能证明这一价格合理？该方法并不避免做出一些假设，但它是一种进行现实检验的方式。


    看看 Amazon.com。在股价崩盘前的 214 美元价格下，市场暗示亚马逊的收入在未来 10 年内将每年增长 59.6%。这是 Warburg Dillon
    Reed 老牌证券分析师 Charles R. Wolf 得出的结论。


    为了得出这一结论，Wolf 使用了一种基于经济增加值（EVA）的估值方法，该概念由管理咨询公司 Stern & Co. 提出。EVA 背后的思想是，从长远来看，重要的不是会计利润——多收一英镑比多付一英镑——而是经济利润。简单地说，公司只有在赚取的收益超过其资本成本时才赚取经济利润，而这在损益表中找不到。EVA
    最初设计为管理工具多于投资工具。


