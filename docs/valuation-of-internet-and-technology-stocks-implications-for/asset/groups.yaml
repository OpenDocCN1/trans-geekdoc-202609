  - '[PAGE 50]


    1939 Stanford engineers William Hewlett and David Packard start a company on $500,
    and set up shop in a garage in Palo Alto, California. A coin flip determines whose
    name goes first.


    1940 Radio Detection and Ranging, or Radar, is developed by Scottish physicist
    Robert Watson-Watt. Konrad Zuse of Berlin invents the first programmable calculator,
    called the V1.


    1941 Iowa State College professor John Vincent Atanasoff and graduate student
    Clifford Berry develop the first digital computer, which they called the ABC.
    John W. Mauchly and colleague J. Presper Eckert later patent a digital-computer
    design, forming a company that later becomes Sperry-Rand Corp.


    1943 Harvard scientist Howard Aiken develops the first program-controlled computer,
    the Mark 1, independently of Zuse. It is 15.3 metres long and weighs 4.5 metric
    tons. The US navy uses it to calculate missile trajectories. Eckert and Mauchly
    develop the Eniac, or electronic numerical integrator and computer. It weighs
    27 tons and has 18000 vacuum tubes. The US army buys it to calculate trajectories
    and to develop the hydrogen bomb.


    1947 Bell Labs makes the first cellular telephone.


    1948 The transistor is invented at Bell Labs by William Bradford Shockley, Walter
    Houser Brattain and John Bardeen, for which they win the 1956 Nobel Prize for
    physics.


    1950 Eckert and Mauchly develop the first commercially available computer, the
    UNIVAC-1. This is the first general-purpose computer, capable of using both numbers
    and text.


    1952 Grace Murray Hopper, a navy programmer working in Howard Aiken''s Harvard
    lab, devises the first compiler, which translates English-like programming code
    into the ones and zeros of machine language. In 1957 she develops the Common Business-Oriented
    Language, or Cobol. She also coined computer terms: Investigating a problem with
    a Mark 1 vacuum tube, she pulled out a moth and, legend has it, exclaimed, ''It''s
    a bug!''.'
