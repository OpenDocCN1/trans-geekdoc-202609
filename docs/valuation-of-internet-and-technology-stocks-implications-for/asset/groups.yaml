    Figure 10.7 illustrates this by showing the theoretical value (see other limitations
    below) of a real option assuming a certain profitability index for an investment
    opportunity. A profitability index is the ratio of the gross present value of
    expected cash flows of an investment opportunity to the investment required.


    An alternative way of presenting this data is to show the absolute net present
    value data split into the expected intrinsic value of the investment and the time
    value of the option (see Figure 10.8).


    Figures 10.7 and 10.8 show that, even where there is high volatility, the option
    value only has a limited contribution to overall investment value if the investment
    is expected to be highly profitable (in this analysis a high-profitability index).
    However, real options can contribute significantly to value where investment decisions
    are more marginal.


    ## (2) There is limited flexibility to react to new information


    Options have time value because investors have the opportunity to modify their
    actions to their best advantage. In a traded

    ![](img/67ce553842aa835a611c7cbbbb028358_197_0.png)


    Figure 10.8 Analysis of investment NPV. Note: This chart uses a 40% volatility
    measure but otherwise is based upon the same data as the previous chart. Source:
    UBS Warburg


    equity option, the investor can decide whether or not to invest (to exercise the
    option or not) up until the final exercise date, at which point it can be observed,
    with certainty, whether exercise is profitable. Action can be modified perfectly
    always to take best advantage of the circumstances faced. Now imagine the option
    holder has to commit to exercising or not when the option is first acquired. Of
    course it is then not an option at all; it is simply a future and would attract
    an option premium. Valuation would be at the present value of the value of the
    investment. Option value critically depends upon the ability to modify strategy,
    i.e. change from exercise to not exercise as appropriate depending on changes
    in circumstances (in the case of the traded equity option, the movements in the
    stock price).


    ## (3) Management does not have the ability to react appropriately


    Although there may be the potential of real option value due to the opportunities
    available to a company and the flexibility to react to these, the actual realization
    of this value depends on the ability of management. Only if management is capable
    of recognizing the existence of options and only if they are capable of effectively
    using information to exercise the options appropriately is a real option premium
    justified. This is the reason that investors are willing to pay more for companies
    with ‘good management’ in place.


    How does this apply to real corporate investment opportunities? For a future business
    opportunity to have option value (i.e. value in excess of the intrinsic value
    – the expected NPV), there must be the opportunity for the company to modify its
    strategy to the best effect.


    ## What are the lessons for investors from the year 2000 technology stocks collapse?


    The concept of the New Economy, or the ‘new economic paradigm’ as it was sometimes
    referred to, contained a number of distinct strands, some true, some half true,
    and some simply wrong. All these ideas came together in the US economy of the
    second half of the 1990s, as we discussed in Chapter 2. To distinguish what may
    still be true from what we now know to be false, that skein of ideas must be unravelled.


    On analysis, four narrow notions emerged; that the business cycle was dead; that
    capital markets now worked in unprecedented ways; that we were living in an era
    of unique technical progress; and, finally, that information technology had fundamentally
    altered the way the economy works.


