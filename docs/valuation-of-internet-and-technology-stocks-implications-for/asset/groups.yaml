  - '[PAGE 21]


    Over the next decade or so, American industry applied microprocessors to other
    tasks. Whole new products, progeny of the digital electronic revolution, burst
    onto the market place – cellular telephones, robotic factory hands, air traffic
    control systems, global positioning satellites, laser surgery tools, camcorders,
    palm-size personal organizers, to name just a few.


    Microprocessors made existing products better, cheaper and more efficient. Starting
    in the early 1980s, ‘smart’ features helped fine-tune televisions, cut energy
    use by refrigerators, control cooking in microwave ovens, memorize programme schedules
    in VCRs and generate diagnostic reports for automobiles.


    Universities were the first to hook computers into networks, but it wasn’t long
    before everyday Americans began to connect via electronic mail. The Internet entered
    the 1990s as an obscure communications network for educators and scientists. It
    ended the decade as the library, shopping mall and playground of the masses. The
    Internet is creating spillovers making existing industries more efficient and
    spawning entirely new ones, including web page design and Internet service.


    Computer processing power leapt 7000-fold in three decades. Number crunching tasks
    that took a week in the early 1970s now require but a minute. The Pentium chip,
    released by Intel in May 1993, crowds 3.1 million flawless transistors on a square
    of silicon 16 millimetres by 17 millimetres. It can churn out calculations at
    up to 112 million instructions per second (mips).


    Data storage capacity and transmission speeds surged right along with the more
    powerful microprocessors. A single memory chip now holds 250 000 times as much
    data as one from the early 1970s – the difference between one page of text and
    1600 books. Transmission speeds increased by a factor of nearly 200 000. Sending
    the 32-volume Encyclopaedia Britannica on the Internet from New York to San Francisco
    would have taken 97 minutes in 1970. Today’s trunk lines can move the equivalent
    of eight full sets in just one second.


    Great leaps of power, capacity and speed led to even greater reductions in the
    cost of managing information. Intel’s vintage (1970) chips sold for $7600 per
    megahertz. Today’s Pentium III chip supplies its computing power for 17 cents
    per megahertz. The cost of storing one megabit of information – enough for a 320-page
    book – fell from $5257 in 1975 to 17 cents in 1999. Sending the Encyclopaedia
    Britannica coast to coast would have cost $187 in 1970, largely because of slow
    data-transmission speeds and the expense of a long-distance telephone call. Today,'
