    # 2. SPACE: Distance has vanished. The world is your customer and your competitor


    Geography has always played a key role in determining who competed with whom.
    Now your business can connect instantly with customers all over the globe. Flipside:
    you’re exposed to world-wide competitors as well. The opportunity – and the threat
    – has never been greater. (See Chapter 5 again for more discussion of this idea.)


    # 3. TIME: It’s collapsing. Instant interactivity is critical, and is breeding
    accelerated change


    In a world of instantaneous connection, there is a huge premium on instant response
    and the ability to learn from and adapt to the market place in real time. Winning
    companies accept a culture of constant change, and are willing to constantly break
    down and reconstruct their products and processes – even the most successful ones.


    # 4. PEOPLE: They’re the crown jewels . . . and they know it


    Brainpower can’t be tallied on a ledger sheet, but it is the prime factor driving
    the New Economy. More than ever before, huge value is being leveraged from smart
    ideas – and the winning technology and business models they create. So the people
    who can deliver them are becoming invaluable, and methods of employing and managing
    them are being transformed.


    # 5. GROWTH: It’s accelerated by the network


    The Internet can dramatically boost the adoption of a product or service by ‘viral
    marketing’, network-enhanced word of mouth. Communication is so easy on the Web;
    product awareness spreads like wildfire. So once a company reaches critical mass,
    it can experience increasing returns leading to explosive growth. This principle
    means that in the New Economy, first-mover advantages are greater than ever.


    # 6. VALUE: It rises exponentially with market share


    For products that help to establish a platform or a standard, the network effect
    is even more pronounced. The more plentiful they become the more essential each
    individual unit is, a'
