    # Technological change and the stock market in history


    Every major advance in communication and transportation has been a marvel to users,
    a cause for a huge stock market celebration and, for the economy in most cases,
    significantly lowered costs of distribution. Ultimately, every distinctive innovation
    matured and was eclipsed by the next one.


    In the late 1600s, Turnpike Trusts in the United Kingdom became very popular with
    investors and provided dramatically improved efficiencies. As existing roads were
    narrow and rough, packhorses were widely used. The new toll roads featured a well-structured
    roadway wide enough that wagons could pass. A packhorse could carry about 250
    pounds, but the turnpike could support a two-ton wagon load pulled by a two-horse
    team resulting in a quadrupling in productivity.


    In the 1720s, the prolific writer Daniel Defoe noted that the reduction in freight
    rates mainly benefited tradesmen rather than carriers. Obviously, conditions were
    competitive. The public heard all the touts, but considered the tolls as taxation
    and were impatient for benefits. The following doggerel sums up the party aspects
    of the boom and its consequence:


    > Now with Turnpikes are grown much in fashion the hardest Tax in all our Nation
    – for where Wine & Women & Stock-Jobbing past, The Turnpike must help us at last.


    The jump in efficiencies with canals was outstanding as one horse could tow a
    barge carrying 50 tons. The improvement over the packhorse was by a factor of
    400 times or over the turnpike by about 50 times. Speculators frantically chased
    new canal issues.


    Of course, the construction time from stock mania to operating success was measured
    in years and canals provided the first great vision phenomenon well in advance
    of commercial reality. A new issue mania erupted in 1792 and subscriptions could
    only be entered with the company in the town where the canal was to start. Newspapers
    that winter provided entertaining accounts of speculators wildly galloping through
    the night in snowstorms to get to the next town for the start of business.'
