    \ 表示当前支付的股息，或最近支付的股息。投资者必须估计未来要支付的股息，从 D₁ 开始，即预期在下一期间支付的股息。\n\n股息的三种增长率模型是：\n\n\
    - (1) **零增长率模型**：零增长率的股息流，由等于当前支付股息 D₀ 的固定金额股息构成，从现在起每年支付到无穷大。这通常被称为无增长率或零增长率模型：\n\
    \  \n  股息流：D₀ D₀ D₀ D₀ + ⋯ + D₀\n  时间段：0 1 2 3 + ⋯ + ∞\n  \n- (2) **恒定增长率模型**：在该模型下，我们有一个从\
