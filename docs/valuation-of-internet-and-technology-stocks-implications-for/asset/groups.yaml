    \ =$ 股息贴现模型的零增长版本\nof the dividend discount model\nEq 4.3\n\n其中 $D_0$ 是所有未来期间预期的恒定金额股息，$k_{cs}$\
    \ 是该特定普通股的机会成本或必要收益率，$\\hat{P}_0$ 是当前价格。\n\n零增长率普通股是永续年金，一旦确定 $k_{cs}$ 就很容易估值。\n\
    \n在理解使用 DDM 对普通股进行估值时，极其重要的是要认识到，在所有情况下，投资者都在贴现从现在到无穷大的未来股息流。当使用零增长率情况下涉及的永续年金公式时，这一事实往往被忽视，因为贴现过程不可见。尽管如此，在这种情况下，我们也在考虑从现在到无穷大的所有股息，就像所有其他情况一样。这只是一个数学事实，将恒定金额除以贴现率\
    \ $k_{cs}$ 得到的结果等同于单独贴现从现在到无穷大的每笔股息并求和所有现值。\n\n## 恒定增长率模型\n\nDDM 的另外两个版本，即恒定增长模型和多重增长情况，表明为了建立预期股息的现金流，该现金流随后将被贴现，首先有必要将某个初始股息复利到未来。显然，使用增长率越高，未来金额越大。此外，时间段越长，未来金额越大。\n\
    \n估值中一个众所周知的情形是股息预计以恒定速率随时间增长的情况。该恒定或正常增长模型如方程 4.4 所示\n\n\\hat{P}_0 = \\frac{D_0\
    \ (1 + g)}{(1 + k_{cs})} + \\frac{D_0 (1 + g)^2}{(1 + k_{cs})^2} + \\frac{D_0\
    \ (1 + g)^3}{(1 + k_{cs})^3} + \\cdots + \\frac{D_0 (1 + g)^{\\infty}}{(1 + k_{cs})^{\\\
    infty}} \\quad Eq 4.4\n\n其中 D0 是当前支付的股息并以恒定速率 g 增长，kcs 是适当的贴现率。\n\n方程 4.4 可以简化为以下方程：\n\
    \n\\hat{P}_0 = \\frac{D_1}{k - g} = 股息贴现模型的恒定增长版本 \\quad Eq 4.5\n\n其中 D1 是预期在第\
    \ 1 年末收到的股息。\n\n每当未来股息的增长率估计为恒定时，就使用方程 4.5。在实际操作中，由于其简单性以及它是对大量公司实际行为的最好描述，在许多情况下也是对整个市场的最好描述，因此它经常被使用。示例\
    \ 4.1 说明了如何将恒定增长模型应用于估值股票。\n\n### 示例 4.1\n\n假设 Nadia Corporation 目前每股支付 1 美元股息，投资者预计股息在可预见的未来每年增长\
    \ 7%。对于这种风险水平，投资者要求的回报率为每年 15%。Nadia Corporation 的估计价格为：\n\n\\hat{P}_0 = \\frac{D_1}{k\
    \ - g} = \\frac{$1.00 (1.07)}{0.15 - 0.07} = $14.38\n\n请注意，当前股息 (D0) 必须复利一个期间，因为\
    \ DDM 的恒定增长版本将分子指定为预期在下一个期间收到的股息，即 (D1)。在估值术语中，D0 表示当前支付的股息，D1 表示预期在下一期间支付的股息。如果已知\
    \ D0，则 D1 总是可以确定：D0 = 当前股息 D1 = D0(1 + g) 其中 g 是股息的预期增长率。\n"
