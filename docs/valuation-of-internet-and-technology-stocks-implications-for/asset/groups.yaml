    fundamental economic conditions; one group of investors buys with the expectation
    of a large capital gain, and others follow suit, without paying proper attention
    to economic factors such as future dividends or interest rates. If such behaviour
    persists, it may feed on itself as consecutive waves of buying increase prices.
    Speculative bubbles may subsequently burst very suddenly. An overvalued market
    is fragile and a relatively unimportant piece of ‘bad’ news may easily create
    pessimism and set off a selling wave.


    The traditional method of searching for market overvaluation or speculative bubbles
    counts the number of unusually high returns during the suspected bubble period
    and assesses the likelihood that the total number of these high returns could
    have arisen from chance (Blanchard and Watson, 1982). An unusually high return
    (or a positive ‘abnormal’ return) is a return higher than the risk-free rate plus
    the usual risk premium necessary to compensate risk-averse shareholders for the
    uncertainty associated with their security returns. In the absence of a speculative
    bubble, a very large number of unusually high returns would normally occur by
    chance only with a small probability. Hence, a large number of unusually high
    returns constitutes evidence consistent with the presence of speculative bubbles.


    Unfortunately, although simple, the traditional test has low statistical power
    to detect speculative bubbles; share prices are very volatile and their swings
    generate both large positive and large negative returns. The latter tend to mask
    any existing bubble evidence.


    In order to construct a more powerful test for bubbles, it is necessary to formulate
    a more precise economic account of the development of the bubble. One can imagine
    many different scenarios of market overvaluation, but analysis restricts the possible
    scenarios to those in which investors know that the market is overvalued yet show
    no special desire to liquidate their positions and continue to buy or sell as
    they would in the absence of bubbles. This is a realistic working assumption for
    the period before October 1987. Robert Shiller (1987) provides survey evidence
    indicating that, before October 1987, 71.7 per cent of individual investors and
    84.3% of institutional investors thought that the market was overvalued at the
    time. Shiller argued that the crash was generated by what he calls a ‘feedback
    loop’. After a first price decline investors sold, not based on fundamentals,
    but because they were worried about what was going on and about market irrationality.
    The drop did not stop until enough people started to have opposing feelings.


    Explaining why investors did not get out of an overvalued market is more difficult.
    One could argue that the presence of highly liquid futures markets and associated
    trading strategies such as portfolio insurance led investors to the false belief
    that they could enjoy large positive returns in an upward market yet still avoid
    suffering a large loss if the market took a big plunge.


    An alternative explanation, outlined above by Hardouvelis (1988), is one that
    does not depend on some sort of collective irrationality. Within the economics
    literature this is known as the ‘rational speculative bubble hypothesis’.


    ## The ‘bubble premium’


    In the case of a rational speculative bubble, investors know that the bubble may
    crash and that they will not be able to get out once the crash starts, but they
    remain in the market because they believe – for whatever reason – that there is
    a good probability that the bubble will continue to grow, bringing them large
    positive returns. These returns are expected to be higher than the risk-free rate
    plus the usual risk premium in the absence of bubbles, and large enough to compensate
    them exactly for the probability of the bubble crash and a large one-time negative
    return. Hence, it is rational for investors to stay in the market. The expected
    extra return when no bubble crash occurs can be called the ‘bubble premium’. The
    theory implies that the bubble premium is not only positive, but also increases
    during the lifetime of the bubble. The time trend in the bubble premium derives
    from the explosive nature of the bubble component of the stock price. As time
    goes on, the bubble component of the stock price grows larger and larger relative
    to the fundamental components. This growth implies that with the passage of time,
    the expected drop in the stock price in the case of a bubble crash grows larger
    too, necessitating a larger and larger bubble premium.


    ## Was the Internet and technology stock price crash a predictable bubble?


    Historically the following can be said about bubbles:

    - 1. Bubbles grow at an exponentially increasing growth rate. The growth rate
    is highest just before the crash.

    - 2. Bubbles always grow larger and last longer than anyone expects.

    - 3. The crash is a total surprise, coming just when it seems everyone has accepted
    that it will continue forever. In fact this is what precipitates the crash. There
    are no new fools left to bid up the price, everybody is already in.

    - 4. The base of the bubble narrows at the top. At first the best technology stocks
