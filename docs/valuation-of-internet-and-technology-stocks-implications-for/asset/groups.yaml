    have occurred in flexible economies with credible monetary anchors. All that is
    needed is a big investment expansion fuelled by expanding credit and a strong
    stock market. Indeed, the firmer the belief that the business cycle is therefore
    sustainable stock market valuations, ultimately brought all technology stocks
    back down to earth.


