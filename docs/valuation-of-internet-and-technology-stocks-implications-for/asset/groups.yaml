    valuation of these future dividends is not fully reflected in the future share
    price. It is by forecasting and valuing potential future dividends and earnings
    and deciding whether someone will, in the future, value these differently, that
    enables one to judge the investment value of shares.


    The uncertainty of future cash flows makes the pricing of stocks according to
    the system of applying net present values more difficult. In this chapter we examine
    the valuation principles applicable to common stocks. Two basic approaches of
    stock valuation when using security analysis are:


    +   (1) the present value approach, or capitalization of income method; and

    +   (2) fundamental analysis.


    # Present value analysis: capitalization of income method


    The classic method of calculating intrinsic value applies present value analysis.
    This technique is often referred to as the capitalization of income method. The
    present value process involves the capitalization (discounting) of future cash
    flows. That is, the intrinsic value of a stock is equal to the present value of
    the future stream of cash flows an investor expects to receive from the asset.
    These cash flows could be periodic, such as dividends, or simply a terminal price
    or redemption value, or a combination of these. Since these cash flows occur in
    the future, they must be discounted at an appropriate rate to determine their
    present value. The sum of these discounted cash flows is the estimated intrinsic
    value of the stock. This is illustrated with Equation 4.1.


    ```

    Value_{t=0} = Σ_{t=1}^{n} Cash flows / (1 + k)^t

    Eq 4.1

    where

    Value_{t=0} = the value of the asset now (time period 0)

    ```'
