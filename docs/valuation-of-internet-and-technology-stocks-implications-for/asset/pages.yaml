  md: '\hat{P}_0 = \frac{D_0 (1 + g)}{(1 + k_{cs})} + \frac{D_0 (1 + g)^2}{(1 + k_{cs})^2}
    + \frac{D_0 (1 + g)^3}{(1 + k_{cs})^3} + \cdots + \frac{D_0 (1 + g)^{\infty}}{(1
    + k_{cs})^{\infty}} \quad Eq 4.4


    where D0 is the current dividend being paid and growing at the constant rate g,
    and kcs is the appropriate discount rate.


    Equation 4.4 can be simplified to the following equation:


    \hat{P}_0 = \frac{D_1}{k - g} = Constant growth version of the dividend discount
    model \quad Eq 4.5


    where D1 is the dividend expected to be received at the end of Year 1.


    Equation 4.5 is used whenever the growth rate of future dividends is estimated
    to be a constant. In actual practice, it is used quite often because of its simplicity
    and because it is the best description of the actual behaviour of a large number
    of companies and, in many instances, the market as a whole. Example 4.1 illustrates
    how the constant growth model can be applied to value stocks.


    # Example 4.1


    Assume Nadia Corporation is currently paying $1 per stock in dividends and investors
    expect dividends to grow at the rate of 7% a year for the foreseeable future.
    For investments at this risk level, investors require a return of 15% a year.
    The estimated price of Nadia Corporation is:


    \hat{P}_0 = \frac{D_1}{k - g} = \frac{$1.00 (1.07)}{0.15 - 0.07} = $14.38


    Note that a current dividend (D0) must be compounded one period because the constant
    growth version of the DDM specifies the numerator as the dividend expected to
    be received one period from now, which is (D1). In valuation terminology, D0 represents
    the dividend currently being paid, and D1 represents the dividend expected to
    be paid in the next period. If D0 is known, D1 can always be determined: D0 =
    Current dividend D1 = D0(1 + g) where g is the expected growth rate of dividends.'
  merge: -1
  img_proc: true
