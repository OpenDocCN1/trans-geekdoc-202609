    # What are the limitations of P/E ratios?


    There are several limitations to P/E ratios. They do not tell you:


    +   - at what rate a company''s earnings are expected to grow;

    +   - whether a company''s earnings growth is expected to accelerate or decelerate;

    +   - how its earnings generating capability compares with other investments offering
    the same risk-reward relationship;

    +   - exactly how earnings between companies differ. Earnings suffer from fundamental
    measurement problems because they depend on subjective judgement made by companies
    and their auditors. In bull markets accounting standards often deteriorate as
    companies bend the rules to meet the over-ambitious expectations of investors;

    +   - how to adjust the ratio when accounting for massive structural change within
    an economy. As discussed in Chapters 5 and 6, the rising importance of intangible
    assets has meant that new methods of accounting need to be introduced. This forms
    a key component of the impact of the so-called New Economy.


    # Prospective price/earnings ratio


    Some analysts calculate the prospective price/earnings ratio based on what they
    predict companies will earn in the future. Since expectations of future earnings
    differ between analysts it is not easy to apply this method for the overall stock
    index, but it may be useful for individual stocks and sectors.


    # Price/earnings growth factor (PEG)


    A concept that has become popular in the past few years is the price/earnings
    growth factor, or PEG. This is the P/E ratio divided by the annualized growth
    rate of earnings.


    Dividing the P/E ratio by the estimated growth of earnings is a gauge of how quickly
    the company is growing. This is known as the prospective PEG. For instance, two
    companies may have'
