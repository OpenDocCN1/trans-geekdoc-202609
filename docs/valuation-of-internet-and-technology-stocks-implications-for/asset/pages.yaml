    # The role of the arbitrageur and the pricing of futures markets


    One of the reasons for emphasizing the role of the arbitrageur in a discussion
    of options is that arbitrageurs are an important factor in determining the spot/forward
    price relationship, and the first step in finding the value of an option is finding
