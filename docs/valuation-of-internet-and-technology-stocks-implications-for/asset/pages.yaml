    This estimated price at the end of Period 1 is 7% higher than the estimated price
    today of $13.38.


    Price change = (Ending price - Beginning price) / Beginning price

    = ($14.31 - $13.38) / $13.38 = 7%


    An examination of Equation 4.6 quickly demonstrates the factors affecting the
    price of a common stock, assuming that we are assuming the constant growth version
    of the DDM to be the applicable valuation approach. The lessons of this version
    are:


    +   1. If the market lowers the required rate of return for a stock, the stock
    price will rise (other things being equal).

    +   2. If investors decide that the expected growth in dividends will be higher
    as the result of some favourable development for the firm, the stock price will
    also rise (other things being equal).


    Of course, the converse for these two situations also holds – a rise in the discount
    rate or a reduction in the expected growth rate of dividends will lower stock
    prices.'
