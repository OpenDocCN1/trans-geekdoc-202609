    ultimately a loss of independence |

    | Regulatory change | Regulatory changes can act as a spur to changes in an industry
    |

    | Industry consolidation | Often one particular merger or acquisition in an industry
    will prove defining and eventually result in a change in the whole industry landscape.
    Once an industry starts to consolidate it becomes self-perpetuating. Each remaining
