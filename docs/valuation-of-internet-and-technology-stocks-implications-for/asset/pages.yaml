    Figure 5.1 Porter''s Five Forces Model. Source: Porter, 1985


    # The bargaining power of suppliers


    Virtually every organization has suppliers of raw materials or services, which
    are used to produce the final goods or services. Porter suggested that suppliers
    are more powerful under the following conditions:


    +   (1) If there are only a few suppliers. This means that it is difficult to
    switch from one to another if a supplier starts to exert its power.

    +   (2) If there are no substitutes for the supplies they offer. This is especially
    the case if the supplies are important for technical reasons – perhaps they form
    a crucial ingredient in a production process or the service they offer is vital
    to smooth production.

    +   (3) If suppliers’ prices form a large part of the total costs of the organization.
    Any increase in price would hit value added unless the organization was able to
    raise its own prices in compensation.

    +   (4) If a supplier can potentially undertake the value-added process of the
    organization. Occasionally a supplier will have power if it is able to integrate
    forward and undertake the value-added process undertaken by the organization;
    this could pose a real threat to the survival of the organization.'
