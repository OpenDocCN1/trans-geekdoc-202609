  md: 'The first step in the valuation process, illustrated in Figure 4.2, is to determine
    the dollar dividends in each year of supernormal growth. This is done by compounding
    the beginning dividend, $1, at 12% for each of five years, producing the following
    expected dividend stream:


    ```

    D₀ = $1.00

    ```


    ```

    D₀ = $1.00(1.12) = $1.12

    D₁ = $1.00(1.12)² = $1.25

    D₂ = $1.00(1.12)³ = $1.40

    D₃ = $1.00(1.12)⁴ = $1.57

    D₄ = $1.00(1.12)⁵ = $1.76

    ```


    Once the stream of dividends over the supergrowth period has been determined,
    they must be discounted to the present using the required rate of return of 10%.
    Thus


    ```

    $1.12(0.909) = $1.02

    $1.25(0.826) = $1.03

    $1.40(0.751) = $1.05

    $1.57(0.683) = $1.07

    $1.76(0.621) = $1.09

    $5.26

    ```


    Summing the five discounted dividends produces the value of the stock for its
    first five years only, which is $5.26. To evaluate Years 6 and later, when constant
    growth is expected, the constant growth model is used.


    ```

    Pₙ = Dₙ₊₁ / (k - g_c)

    = D₆ / (k - g_c)

    = D₅ (1.06) / (k - g_c)

    = 1.76 (1.06) / 0.10 - 0.06

    = $46.64

    ```


    Thus, $46.64 is the expected price of the stock at the beginning of Year 6 (end
    of Year 5). It must be discounted back to the present, using the present'
