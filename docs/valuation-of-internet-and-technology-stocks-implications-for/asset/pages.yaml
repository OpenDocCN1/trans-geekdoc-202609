    yen may find it cheaper to borrow US dollars, then swap them into yen.


    Box 10.1 provides a formal definition of the principal derivatives contracts traded:
    forwards, futures, options and swaps.


    # What are options?


    Options are one of the most powerful derivatives contracts and it is essential
    to become familiar with the option terminology.


    As defined above, an option is a contract between two parties that gives the buyer
    the right but not the obligation to buy or sell a specific quantity of a commodity
    or instrument at an agreed price for a specified period. The option buyer pays
    the seller a premium for the privilege of being able to buy or sell the instrument,
    at a fixed price, without having the commitment to do so.


    To take an example, consider an option to buy gold at US$400 per ounce. Let us
    say the market price of gold is currently US$395. The option buyer pays the option
    seller a premium of US$3.50. The option buyer has the right, but not the obligation
    to buy gold at US$400. It will be profitable for the option buyer to exercise
    this right if the price of gold rises above US$403.50. However, if the price of
    gold falls in the market then the option buyer has no commitment to buy gold at
    US$400, and the option buyer can then allow the option to expire unexercised,
    and purchase gold at the cheaper market price.


    # Some terminology


    A summary of the principal terminology of the options market is offered below:'
