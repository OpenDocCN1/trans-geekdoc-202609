- pgno: 69
  md: 'It is useful to think about the second term in Equation 4.7 as representing
    a P̂₀ or the expected price of the stock derived from the constant growth model
    as of the end of period n. The constant growth version of the dividend discount
    model is used to solve for expected price at the end of period n, which is the
    beginning of period n + 1. Therefore,


    $P_n = \frac{D_{n+1}}{k - g_c}$


    Because P is the expected price of the stock at the end of period n, it must be
    discounted back to the present. When added to the value of the discounted dividends
    from the first term, the estimated value of the stock today (P₀) is produced.
    Example 4.5 illustrates the multiple growth model.


