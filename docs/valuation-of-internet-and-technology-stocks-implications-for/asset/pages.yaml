  md: '# Stickiness


    Website ‘stickiness’ generally refers to a site''s ability to retain a surfer
    at the site once a customer has arrived there. Website ‘stickiness’ is a desirable
    quality because a ‘sticky’ site may be able to generate higher advertising rates
    from advertisers who believe that visitors are more likely to spend sufficient
    time at the site to read, retain, and/or otherwise be influenced by the ads that
    are placed there.


    # Customer loyalty


    Customer loyalty generally refers to a website’s ability to generate repeat visits
    from surfers who have previously visited the site. This metric is relevant because
    a website’s ability to re-attract current visitors is expected to be an important
    determinant of its ability to sustain, and/or ultimately grow to, the critical
    mass of traffic that is necessary to attain profitability.


