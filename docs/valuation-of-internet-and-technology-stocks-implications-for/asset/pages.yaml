    # The Porter model, the Internet and the Web


    The goal of any business strategy is to achieve a competitive advantage within
    the company’s industry. The Porter model demonstrates that companies competing
    in a particular, established industry are interested in positioning themselves
    in the market but, above all, share a common interest in not letting anybody else
    in (to prevent the competition from growing stronger); in preventing new products
    or services that could replace their own from appearing; and, lastly, in ensuring
    that their internal competitiveness does not give rise to an increase in suppliers’
    or clients’ negotiating power. It is by controlling all these factors that a company
    may obtain a competitive advantage within its industry.


    The Internet is merely a physical medium that provides a base for certain services,
    but, as will be seen below, does have major implications for applying the Porter
    model. The main services are e-mail, newsgroups and the Web. The possibilities
    offered by each are very different, as are the rules governing them.


    +   - e-Mail allows fast, inexpensive, and asynchronous communications. (It is
    not necessary for the two people communicating to do so at the same time.) In
    this regard, it has merits that the telephone (synchronous), the fax (expensive)
    and the postal service (slow) all lack. It is personal and, therefore, discrete
    (provided that nobody with sufficient technical skills tries to intercept it).

    +   - Newsgroups are a means for receiving information on specific subjects that
    interest the group and are a means of disseminating this information. Their merit
    lies in the fact that the information is unrestricted and is not screened by the
    major communications corporations.

    +   - Finally, there is the World Wide Web. The Web has broken through the barriers
    of the not-so-friendly Internet and has made it a user-friendly tool. It has transformed
    an information network into a real information channel that is open to the public
    in general. The public can now be seen to be potential buyers of whatever products
    are on offer.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'In short, the Internet has created a new distribution channel. This necessarily
    provides sellers with a means of informing potential customers about their supply
    of products and enables customers to make their purchases (order and payment).
    It is the combination of the Web and e-mail which can provide companies with a
    full distribution channel. The Web is used to inform clients and e-mail to place
    orders. To simplify the process, e-mail can be generated directly from the Web.


    As a distribution channel, the Web may be characterized as follows:


    +   - It is a new channel that is not controlled by the companies from any one
    particular industry.

    +   - Distribution costs are low.

    +   - Its impact is limited (for the time being). Predictions are made, but its
    true impact is not really known.

    +   - It enables fast distribution of information products.

    +   - The cost of changing prices or even commercialized products is very low,
    thus enabling a relatively quick product rotation.


    The power of the Internet is that due to the real time nature of the Internet,
    customers are able to get instant feedback about information or availability and
    delivery status of products. Its implications for the Porter model are discussed
    below. One of the great strengths of the use of the Internet is that it is independent
    of time, language and the geographic location of customer/company. It helps to
    break down traditional barriers to entry, shifts the power balance between buyers
    and sellers, facilitates comparison-shopping, distributes knowledge, expands markets
    and sustains growth.


    The key features of the Internet for business are listed in Table 5.1.


    # The Porter model revisited


    The arrival of the Internet has major implications when applying the Porter model
    (see Figure 5.2). The five competitive strategies have to be carefully analysed.


    +   - The power shift between suppliers and buyers: the power of suppliers is
    no longer the same. The buyers can more easily'
