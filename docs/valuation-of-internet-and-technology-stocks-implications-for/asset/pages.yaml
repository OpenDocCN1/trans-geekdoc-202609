    # Exchange-traded versus over-the-counter options


    Options may be traded on exchanges, i.e. in a physical location, or on the over-the-counter
    (OTC) market, in which dealing takes place between two counterparties, usually
    over the telephone.


    Exchange-traded options have the following characteristics:


    +   - Fixed expiry dates, generally at 3-monthly intervals for the third Wednesday
    in March, June, September and December.

    +   - Maturities generally up to two years.

    +   - Strike/exercise prices at fixed intervals.

    +   - Fixed contract sizes.

    +   - Standardization of contracts. This means that markets tend to be liquid.
    In other words, bid-offer spreads (the difference between the buying and selling
    price) tend to be narrow, and large orders can usually be transacted fairly easily.

    +   - Given that these options are traded on regulated exchanges, trading is closely
    monitored. The clearinghouse of the exchange acts as the counterparty to every
    trade, thus the credit risk, i.e. the risk of default on a trade, is standardized
    and limited.

    +   - Prices are publicly quoted, i.e. trading takes place by open outcry between
    traders on the floor of the exchange. Prices'
