    # Economic value added (EVA)


    A different approach to valuation turns the whole issue on its head and is on
    the frontier of investment analysis. Instead of forecasting all the inputs to
    come up with a number for what the stock should be worth, this method starts with
    the stock price and works backwards to answer the question: what kind of growth
    does this company have to deliver to justify this price? This method does not
    avoid making some assumptions, but it''s a way to perform a reality check.


    Look at Amazon.com. At a price of $214 before the stock price collapse, the market
    was implying that Amazon''s revenues will increase 59.6% a year over the next
    10 years. That was the conclusion of veteran securities analyst Charles R. Wolf
    of Warburg Dillon Reed.


    To come to that conclusion, Wolf used a valuation method built on economic value
    added (EVA), a concept developed by Stern & Co., a management consulting firm.
    The idea behind EVA is that in the long run, it''s not accounting profits – taking
