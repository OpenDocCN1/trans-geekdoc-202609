- pgno: 122
  md: 'The stock market, Keynes wrote, ‘is a game of musical chairs, of Snap, where
    the winner is the one who makes his move fractionally ahead of everyone else’
    (1936). So the stock market, in Keynes’s view, is an environment in which speculators
    anticipate ‘what average opinion expects average opinion to be’ rather than focusing
    on factors fundamental to the market itself, including expected future dividends
    etc. The implication here is that if bubbles exist in asset markets, prices will
    differ from their long-term fundamental values.


    It is only recently that serious research has taken place on the existence of
    bubbles. Economic theory, until recently, placed essentially no restrictions on
    how agents formed expectations of future prices. Thus a folklore of bubbles grew
    up. These would include the tulip bubble in seventeenth century Holland, the South
    Sea bubble, in eighteenth century England and the increase in stock prices during
    the 1920s in the United States. All these events, when followed by subsequent
    collapses in asset values, have been labelled as bubbles. However, the widespread
    adoption of rational expectations, discussed below, provides a model amenable
    to the empirical study of bubbles.


    But before we proceed further, we first of all need to describe the terminology
    used by ‘bubbleologists’.


    # Bubble terminology


    Following the technical language of economics, a ‘bubble’ is any deviation from
    ‘fundamental values’, whether up or down. Fundamental values are a concept easier
    to define in theory than in practice. This concept refers to the prices stocks
    ought to sell for based on business’s real economic value, apart from speculation.
    The assumption is that stock prices will ultimately (whenever that is) return
    to their fundamental values, however much extraneous factors may be influencing
    them at any one moment.


    A bubble is an upward price movement over an extended range which then implodes.
    An extended negative bubble is a crash. ‘Noise’ refers to small price variations
    about fundamental values. So a bubble is a situation in which the price of an
    asset differs from its fundamental market value. With a rational bubble, as discussed
    below, investors can have rational expectations that a bubble is occurring because
    the asset price is above its fundamental value but they continue to hold the asset
    anyway. They might do this because they believe that someone else will buy the
    asset for a higher price in the future. In a'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'rational bubble, asset prices can therefore deviate from their fundamental
    value for a long time because the bursting of the bubble cannot be predicted and
    so there are no unexploited profit opportunities.


    When a stock is experiencing a rational bubble, the rate of return on an asset
    is higher than normal in order to compensate the holder for the possibility that
    the asset''s price might suddenly collapse to its fundamental value. With what
    is known as a rational bubble, the asset holder is willing to accept a lower rate
    of return since the asset''s price might suddenly jump up to its fundamental value.


    # The role of expectations in analysing stock market bubbles


    Beliefs about the future are an important determinant of behaviour today. Important
    disagreements between differing views of how expectations are formed lie at the
    centre of the discussion as to the existence or otherwise of ''bubbles''. Different
    views about expectations can be usefully broken down into three groups: exogenous
    expectations, extrapolative expectations and rational expectations.


    # Exogenous expectations


    Some economists remain almost completely agnostic on the vital question of how
    expectations are formed. When analysing the behaviour of the economy they simply
    treat expectations as exogenous, or given. Expectations are one of the inputs
    to the analysis. The analysis can display the consequences of a change in expectations.
    For example, an increase in expected future profits might increase the stock price
    of a firm. But this assumption of exogenous expectations means that the analysis
    does not investigate the cause of the change in expectations. In particular, it
    is unrelated to other parts of the analysis. With given expectations, there is
    no automatic feedback from rising output to expectations of higher profits in
    the future.


    Thus, at best, economists using exogenous expectations in their analysis give
    an incomplete account of how the economy'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'works. At worst they completely neglect some inevitable feedback from the variables
    they are analysing to the expectations that were an input to the analysis. On
    the other hand, since modelling expectations remains a contentious issue, proponents
    of this approach might argue that the various types of possible feedback on expectations
    can be explored in an ad hoc manner.


    # Extrapolative expectations


    One simple way to make expectations endogenous, or determined by what is going
    on elsewhere in the analysis, when discussing the existence or otherwise of bubbles,
    is to assume that investors forecast future profits by extrapolating the behaviour
    of profits in the recent past, or extrapolate past inflation in order to form
    expectations of inflation in the near future. Proponents of this approach suggest
    that it offers a simple rule of thumb and corresponds to what many investors seem
    to do in the real world.


    # Rational expectations


    Suppose the rate of money growth is steadily increasing and inflation is steadily
    accelerating. Extrapolating past inflation rates will persistently underforecast
    future inflation. Many economists believe that it is implausible that people will
    continue to use a forecasting rule that makes the same mistake (underforecasting
    of future inflation, say) period after period. The hypothesis of rational expectations
    makes the opposite assumption: on average, investors guess the future correctly.
    They do not use forecasting systems that systematically give too low a forecast
    or too high a forecast. Any tendency for expectations to be systematically wrong
    will quickly be detected and put right.


    This in no way says that everybody gets everything exactly right all the time.
    We live in a risky world where unforeseeable things are always happening. Witness
    the September 11th 2001 attacks on New York. Expectations will be fulfilled only
    rarely. Rational expectations theory says that people make good use of the information
    that is available today and do not make forecasts that are already knowably incorrect.
    Only genuinely unforeseeable events cause present forecasts to go wrong. Sometimes
    investors will underpredict and sometimes they will overpredict. But any systematic
    tendency to do one or other will'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'be noticed and the basis of expectations formation will be amended until guesses
    are on average correct.


    The existence or otherwise of ''bubbles'' depends on which one of these three
    models of expectations one applies. The adoption of the rational expectations
    assumption has clarified considerably the nature of price bubbles. With rational
    expectations a researcher can specify a model of bubbles, which is then testable.
    If the expected rate of market price change influences the current market price,
    the researcher has a model to work with. This is not to say that this is straightforward.
    There is an indeterminacy in the model, as a researcher is in fact faced with
    something to explain, the market equilibrium price, with two variables, the market
    price and the expected rate of market price change, both of which are interrelated
    within the economic system.


    A bubble can arise when the actual market price depends positively on its own
    expected rate of change, as normally occurs in asset markets. Since agents forming
    rational expectations do not make systematic prediction errors, the positive relationship
    between price and its expected rate of change implies a similar relationship between
    price and its actual rate of change. In such conditions, the arbitrary, self-fulfilling
    expectation of price changes may drive actual price changes independently of *market
    fundamentals*. This situation is referred to as *a price bubble*.


    An explicit definition of market fundamentals depends on a particular model''s
    structure; indeed, the very notion of a bubble can make no sense in the absence
    of a precise model detailing a market''s operation. Without such a model, it is
    impossible both to define market fundamentals and then to isolate them from the
    presence, or otherwise, of a bubble.


    # Bubbles and the efficient market hypothesis (EMH)


    Efficient market theory applies the theory of rational expectations to the pricing
    of securities. The EMH comes in three versions: the weak form, the semi-strong
    form and the strong form.


    +   - The **weak form** of the EMH asserts that prices fully reflect the information
    contained in the historical sequence of prices.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Thus, investors cannot devise an investment strategy to yield abnormal profits
    on the basis of an analysis of past price patterns.


    +   - The **semi-strong** form of the EMH asserts that current stock prices reflect
    not only historical price information but also all publicly available information
