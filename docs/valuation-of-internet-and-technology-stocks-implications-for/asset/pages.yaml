  img_proc: true
- pgno: 31
  md: 'any lessons we can learn from technical progress from a historical perspective?
    In particular, what can we learn from the works of Joseph Alois Schumpeter and
    a more contemporary follower, Alvin Toffler?


    # Schumpeter: the pioneer of the analysis of technological change


    Austrian born economist Joseph Alois Schumpeter (1883–1950) viewed the business
    cycle as a continuing process moving from phase to phase as economic development
    occurs. Schumpeter located the cause of long run economic expansions in the investment
    opportunities provided by a major technological breakthrough. More particularly,
    Schumpeter distinguished between ‘inventions’ and ‘innovations’. He defined inventions
    as the discovery of new ways of producing. These occur more or less continuously
    in modern market economies as people are always discovering new ways of producing
    or better ways of producing. However, inventions become economically significant
    only when they are actually introduced into economic activity. This he called
    ‘innovation’ and Schumpeter argued that such is the nature of modern economies
    that innovations occur only discontinuously. They tend to be bunched or clustered
    and this cluster of investment opportunities, exploited more or less at the same
    time, produces an expansion.


    In general, innovation for Schumpeter meant a change in production severe enough
    to cause a discontinuity in production. The most basic kind would be the introduction
    of a new product with a new production process, particularly one requiring the
    construction of a new plant or equipment to carry it out. The introduction of
    the production line to produce Henry Ford’s new automobiles is the clearest historical
    example of an innovating entrepreneur. There have been other kinds of innovation
    involving new sources of raw materials, new markets for products, or new methods
    of organization in an industry. But whatever the type, the distinctive character
    of the innovation for Schumpeter was that it required introducing fresh ideas
    into the production process and these involved'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'investment outlays to bring them into being. Schumpeter argued that to innovate
    successfully an entrepreneur must have ‘broader horizons’, his term for the range
    of new possibilities that any entrepreneur felt comfortable contemplating.


    Significant innovations were therefore associated with the rise to leadership
    of new entrepreneurs. These infrequent leadership changes occurred only when dissatisfaction
    with old ways reached a critical level. This level was associated with the building
    up of tension in the firm caused by slow or non-existent progress under old leadership,
    and the consequent willingness of those who decide on entrepreneurial fates to
    take a chance on new leaders.


    Innovation in one industry or firm tended to result in other firms taking a chance
    in what Schumpeter called ‘imitation waves’. The introduction of new techniques
    and inventions was thus bunched – the cluster of innovations about which Schumpeter
    wrote: ‘Progress – in the industrial as well as in any other sector of cultural
    or social life – not only proceeds by jerks and rushes but also by one-sided rushes
    productive of consequences other than those which would ensue in the case of co-ordinated
    rushes. In every span of historic time it is easy to locate the ignition of the
    process and to associate it with certain industries, with certain firms, from
    which the disturbances spread over the entire system’ (Schumpeter, 1939).


    Schumpeter, therefore, developed a broad theory to account for instability in
    modern industrialized market-oriented economics. This theory focuses on the profit-motivated
    activity of entrepreneurs who operate within a given culture and are heavily influenced
    by all the experiences that shape as well as limit their perspective and vision.


    The 2000 Nasdaq technology stock price collapse is symptomatic of the fact that
    there has no doubt been massive misallocation of resources in the US economy,
    particularly over-investment in technology. This creative destruction will be
    painful. Schumpeter would have surely welcomed the sight of the turbulence and
    creative destruction associated with the volatility created by the New Economy.


    # Tofler’s ‘third wave’


    In Alvin Toffler’s 1980 book The Third Wave, based partially it must be said on
    earlier work by Schumpeter, the wave'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Metaphor is applied to symbolize the fact that beneath the raging surface of
    change it is essential to distinguish those changes that are merely transitional
    and cosmetic from those that are truly revolutionary. Despite the fact that Toffler’s
    work was published over 20 years ago, its impact is still being felt and is worth
    highlighting here.


    The first wave was the change from a hunter–gatherer existence to a more settled
    agricultural way of life. The second wave was the industrialization that occurred
    in (mainly) Europe and North America between the eighteenth and mid-twentieth
    centuries.


    Second wave society was heavily dependent on concentrated fossil fuels for its
    energy sources, factory production for its goods, the nuclear family for social
    stability, the corporation as the main means of wealth creation and mass media
    to supply the labour for the factories. Mass education and the mass media contributed
    to social cohesion (and to social engineering). There was a wide gulf between
    production and consumption: almost no one produced the items they consumed. The
    whole organization was managed by a set of elites – governments, civil servant
    and corporations – whose task was to integrate the elements into a whole. In particular,
    the nation-state was a second wave creation, particularly matched to the size
    and scope of second wave economies.


    The forces of the second wave are illustrated in Table 2.1.


    According to Toffler, the characteristics of the third wave are almost diametrically
    opposed to those of his second wave shown


    **Table 2.1**  The forces of the second wave


    | Force | Consequences |

    |---|---|

    | Standardization | Standardization of measurements; millions of identical products
    |

    | Specialization | Specialists within manufacturing and in the professions |

    | Synchronization | Groups of workers working together at the same time |

    | Concentration | Concentrated energy sources, cities, factories, schools, hospitals,
    mental asylums and of capital |

    | Maximization | Quest for efficiency and bigness |

    | Centralization | New management methods in business and politics |


    *Source: Toffler, 1980*'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'in Table 2.1. Although standardization of measurement in production has been
    retained, there has been a move away from the production of millions of identical
    products to providing much greater choice. For example, UK supermarkets stock
    around half a dozen types of table salt; there are around 250 models of car on
    sale in most European countries. There has been a demassification of the media,
    as shown by the upsurge in the number of specialist periodicals and the number
    of TV channels now available. And whereas in the second wave the recipients of
    goods and services were passive, having a negligible individual impact on the
    offers they bought, the move now has been towards incorporating individual tastes
    into their production.


    Specialization was a very significant feature of the second wave. Instead of an
    individual or their family taking responsibility for their own food, clothing,
    education, health, etc., large numbers of specialisms became established by people
    who would do this for them: specialist farmers, teachers, doctors, lawyers, etc.


    In the third wave, in contrast, individuals are taking back some of these responsibilities.
    In the third wave information technology and knowledge plays a key role. This
    latest wave of human endeavour, updating Toffler, can be referred to as the ‘information
    age or knowledge age’, a theme attention is drawn to throughout this text, given
    its importance for valuing technology stocks.


    # The macro-economic consequences of the Internet economy


    Apart from the individual winners and losers, the Internet may create real efficiencies
    for the economy as a whole. For some guidance as to where these efficiencies might
    come, consider the driving forces behind the past 20 years of financial market
    innovation. Nobel Prize-winning economist Robert Merton identifies the source
    of the efficiencies in three places.


    The first is in the creation of new and bigger markets, which can lead to lower
    prices and higher quality because firms can now complete transactions with firms
    that were either too far'
  merge: -1
  img_proc: true
- pgno: 35
  md: away or in markets that were too small to be profitable. The second is reducing
    the costs of making those transactions. The third is a bit subtler, but arises
    because each party to any business deal usually has inside information about his
    or her own company. This asymmetrical knowledge tends to reduce trust between
    the parties and increase the cost of monitoring subsequent performance. If the
    Web really were to promote the sharing of information and to make the boundaries
    between firms less distinct, it would shrink the costs that are driven by distrust.
    As stressed throughout this text, we do indeed live in an information age.
  merge: -1
