  md: '# Bubbleology, stock markets and the Internet and technology stock price collapse*


    Bubbles generally are perceptible after the event. To spot a bubble in advance
    requires a judgement that hundreds of thousands of informed investors have it
    all wrong.


    > (Testimony of Fed Chairman Alan Greenspan, before the Joint Economic Committee,
    US Congress, 17 June 1999)


    Alan Greenspan, Chairman of the US Federal Reserve, made the remark that opens
    this chapter well before the collapse in the price of technology stocks. However,
    as will be seen in this chapter, the whole issue of whether ‘bubbles’ in stock
    markets do or do not exist raises many complex issues. Greenspan’s comments, particularly
    his earlier one in 1996 that financial markets suffered from ‘irrational exuberance’,
    opened up the debate as to whether stock markets are prone to speculative bubbles
    and, if so, as to how financial economists can identify them.


    # The Internet and technology stock price collapse


    Following Greenspan’s comments one can look back and see what lessons can be learned
    from the year 2000/2001 technology stock price crash. With the wisdom of hindsight,
    we can see


    *The contents of this chapter are discussed in more detail in Financial Economics
