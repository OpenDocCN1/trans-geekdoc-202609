    \ debt within 1 year | \n| Free cash flow as a percentage of total debt³ | (Net\
    \ income before extraordinary items plus depreciation plus deferred tax plus non-cash\
    \ items less capex plus increase in the change in working capital)/(Total debt)\
    \ × 100 | This shows how much free cash the business generates i.e. how much is\
    \ available for debt repayment after re-investment in the business (i.e. working\
    \ capital and capex). As above, the higher the percentage the shorter the time\
    \ the company would need to repay its debt whilst maintaining current investment\
    \ levels | \n| Return on permanent capital | (Pre-tax income plus interest expense\
    \ less interest capitalized)/((The 2 year average of total debt plus deferred\
    \ taxes plus minority interests plus shareholders equity) × 100 | This shows the\
    \ return the business makes on the resources employed. If the return is not high\
    \ enough there may be shareholders’ pressure to improve it, increasing the risk\
    \ of an acquisition or a share buyback, and increasing the risk of a bid | \n\
    | Operating income as a % of sales | (Operating income before depreciation)/(Sales)\
    \ × 100 | This shows how much profit the company makes from each sale. The higher\
    \ this ratio, the more operating profit the company will generate as sales grow\
    \ | \n| Total debt as a percentage of total capital | (Total debt)/(Shareholders’\
    \ equity plus total debt) × 100 | This shows how much of the resources employed\
    \ in the business are provided by debt. The higher the percentage the more debt\
    \ in the business and the lower the ‘cushion’ of equity. This is important because\
    \ whilst interest must be paid, in need a company could decline to pay a dividend\
    \ | \n| LTD as a percentage of total capital | (Long-term debt)/(Shareholders’\
