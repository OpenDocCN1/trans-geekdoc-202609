    is in a more mature stage then the emphasis should shift from one focused on revenues
    to one focused more on profit multiples.


    (3) **Discounted cash flow:** Discounted cash flow (DCF) can be difficult to apply
    at the very early stage of a developing, high-growth company’s life and would
    perhaps carry less weight in analysis, as we discussed in Chapter 6. But as short-term
    forecasts start to show cash flows, which are more reliable as a basis for longer-term
    projections, this method should be given more attention.


    We now turn to the three techniques in more detail.


    # *Current priced multiple of sales revenue*


    As stressed throughout this book, valuation multiples should ideally be based
    on profits rather than revenues, since it is profit and the cash flow derived
    from it which creates value. In the absence of current profits for most technology-based
    companies, investors were forced to look to other measures. Sales revenue is the
    next best thing to profit, although clearly it has drawbacks. However, one may
    expect those stocks where the future margins will be highest to sell for higher
    sales multiples, assuming all other value drivers are equal.


    # ***Margin-adjusted sales multiples***


    In making comparisons of stocks using revenue multiples it is vital that only
    those with similar margin potential should be included. Profit-based multiples
    would be more comparable since these are not directly affected by margin. However,
    revenue multiples for different business models can be compared if they are ''potential
    margin adjusted''. A margin-adjusted sales multiple of a competitor company, adjusted
    for the purpose of comparison with a target company, can be calculated using the
    following formula:


    Margin-adjusted sales multiple =

    Observed sales multiple × Target company’s expected operating margin

    Comparator company’s expected operating margin'
