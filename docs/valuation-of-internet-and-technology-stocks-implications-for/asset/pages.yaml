  md: 'Let’s look first at our investor, A. He thinks that gold is a good investment
    – a ‘gold bug’ in the terminology of the market. He wants to buy gold and hold
    it long term. When A buys gold, he forces up the spot price of gold. When the
    spot price of gold rises, the future or forward price tends to rise as well.


    B, our long gold speculator, is not a long-term investor, like A, but she thinks
    gold is going up and would like to take a position that is going to be profitable
    if she is right. B can accomplish this in a couple of different ways. First, B
    can buy spot gold. If gold goes up in a short period of time, she can sell that
    gold at a higher price and make a profit.


    Alternatively, B can buy a future or forward contract on gold. B’s purchase of
    forward gold tends to make the future or forward price go up; and, just as demand
    for spot gold tends to raise future or forward prices, demand for forward gold
    tends to raise spot prices. As we will see later, when B buys a future or a forward,
    she does not have to pay out much money. When A buys spot gold, say 100 ounces
    at $400, he has to pay $40 000, immediately.


    Our short speculator, C, thinks that the gold price is going down. She is very
    pessimistic about the outlook for gold. Like A and B, C has two choices. She can
    sell gold spot, or she can sell a future or forward contract on gold.


    If C happens to own gold, she can simply sell it. Alternatively, if she is in
    a position to borrow gold relatively easily and sell it short, i.e. to sell gold
    she does not physically own, she might do that. But if she does not have direct
    access to gold, she probably will find it easier to sell a future or forward contract
    on gold.


    Short speculators like C affect the price of spot gold. The effect on the spot
    price is clear if the short speculators own gold and want to shift their investment
    to something else. If they are not trading in the spot market, the direct effect
    of their sale will be on the forward or future price, making it trade at a lower
    price.


    D is someone who needs gold a year from now. D might be a dentist or a jeweller
    – someone who has all the gold he needs right now but who wants to be assured
    of the gold price a year from now. There is no advantage in buying the gold now
    and spending a large sum of money to store and insure it. D probably will want
