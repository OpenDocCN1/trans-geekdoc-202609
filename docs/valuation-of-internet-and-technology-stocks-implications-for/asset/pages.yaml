    # Web metrics


    Web traffic measures became standard Internet company performance benchmarks that
    were commonly reported in the business press, voluntarily disclosed by companies
    at the time of their earnings announcements, and frequently mentioned as valuation
    parameters in analysts’ reports.


    Three key dimensions of traffic generating performance are: the attraction of
    new visitors (or ‘eyeballs’) to a website; the retention of visitors at the site,
    conditional on having got them to the site for a visit; and the ability to generate
    repeat visits from surfers who have been attracted to the site in the past. These
    three dimensions of web traffic performance are commonly referred to as ‘reach’,
    ‘stickiness’ and ‘customer loyalty’, respectively.


    # Reach


    Reach is generally defined as the number of unique individuals who visit a site,
    stated as a percentage of the (active or total) web surfing population. Reach
