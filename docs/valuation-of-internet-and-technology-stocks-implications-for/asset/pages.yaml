- pgno: 81
  md: 'Apart from the historic low of the dividend yield, two other questions need
    to be asked when using this as a form of calculating investment returns.


    First, how safe is the dividend yield? If the next dividend payment is cut, the
    apparently attractive yield of, say, the real 7% return for 1946–1975, may be
    largely an illusion. Usually the market’s expectation of the next or prospective
    annual total dividend is more important for the stock price than the amount actually
    paid in the past year. Stability of profits, and the dividend cover – the ratio
    of available earnings to dividends – are also important factors here. Secondly,
    how rapidly is the dividend likely to grow? A fast growing dividend stream is
    clearly worth more than a static one, as we discussed earlier, with the effect
    that growth stocks are worth buying on much lower dividends than mature companies.


    Professional analysts use the dividend discount models discussed earlier to compute
    the impact of different growth assumptions. Due to the power of compound arithmetic
    valuations can be very sensitive to the forecast of the growth rate and this explains
    why company shares can fall so sharply when they produce disappointing results
    or issue profit warnings.


    Suppose that the end of the millennium low dividend yield adjusts back to its
    mean. In this case, either stock prices will fall or dividends will increase.
    On 14 March 1998, Warren Buffet, a famous value investor, told stockholders that
    he believed the historically high stock prices were justified as long as interest
    rates remain low and corporations continue to produce ‘remarkable’ returns on
    equity. Buffet apparently believed that future dividends will rise to justify
    the low dividend to price ratio. Unfortunately history tells a different story.
    It is adjustments in stock prices, not dividends, that historically have driven
    the dividend yield back toward its mean value. If dividend yields do revert to
    their long-run mean over the next few years, the long-term prospects for the stock
    market change dramatically.


    Unfortunately the analysis of dividends has become more complex than it used to
    be. Tax considerations cloud the calculations. Companies are therefore much more
    interested than they used to be in finding alternative, more tax-efficient, ways
    of returning cash to shareholders. Stock buybacks are increasingly popular. Analysts
    now agree that it is necessary to take stock buybacks into account in valuing
    dividend flows.'
