  md: "dividends. In summary: the dividend discount model is operationalized by estimating\
    \ the expected growth rate(s) in the dividend stream.\n\nAll stocks that pay a\
    \ dividend, or that are expected to pay dividends some time in the future, can\
    \ be modelled using this approach. It is critical to remember in using the DDM\
    \ that an investor must account for all dividends from now to infinity by modelling\
    \ the growth rate(s). As shown below, the mechanics of this process are such that\
    \ we don’t actually see all of these dividends because the formulas reduce to\
    \ a simplified form, but nevertheless we are accounting for all future dividends\
    \ when we use the DDM.\n\nIt is necessary in using the DDM to remember that the\
    \ dividend currently being paid on a stock (or the most recent dividend paid)\
    \ is designated as D₀ and is, of course, known. Specifically, D₀, designates the\
    \ current dividend being paid, or the most recent dividend paid. Investors must\
    \ estimate the future dividends to be paid, starting with D₁ the dividend expected\
    \ to be paid in the next period.\n\nThe three growth rate models for dividends\
    \ are:\n\n+   (1) **The zero growth rate model**: a dividend stream with a zero\
    \ growth rate resulting from a fixed dollar dividend equal to the current dividend\
    \ being paid, D₀, being paid every year from now to infinity. This is typically\
    \ referred to as the no growth rate or zero growth rate model:\n+   \n+   Dividend\
    \ stream: D₀ D₀ D₀ D₀ + ⋯ + D₀\n+   Time period: 0 1 2 3 + ⋯ + ∞\n+   \n+   (2)\
    \ **The constant growth rate model**: under this model we have a dividend stream\
    \ that is growing at a constant rate g, starting with D₀. This is typically referred\
    \ to as the constant or normal growth version of the dividend discount model:\n\
    +   \n+   Dividend stream: D₀ D₀ (1+g)¹ D₀ (1+g)² D₀ (1+g)³ + ⋯ + D₀ (1+g)∞\n\
    +   Time period: 0 1 2 3 + ⋯ + ∞\n+   \n+   (3) **The multiple growth rate model**:\
    \ under this model we have a dividend stream that is growing at variable rates,\
    \ for example, g₁, for the first four years and g₂ thereafter. This is referred\
    \ to as the multiple growth version of the dividend discount model:\n+   \n+ \
    \  D₀ D₁ = D₀ (1+g₁) D₂ = D₁ (1+g₁) D₃ = D₂ (1+g₁) D₄ = D₃ (1+g₁)\n+   0 1 2 3\
    \ 4"
