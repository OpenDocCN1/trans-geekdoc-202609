- pgno: 27
  md: '# 2. SPACE: Distance has vanished. The world is your customer and your competitor


    Geography has always played a key role in determining who competed with whom.
    Now your business can connect instantly with customers all over the globe. Flipside:
    you’re exposed to world-wide competitors as well. The opportunity – and the threat
    – has never been greater. (See Chapter 5 again for more discussion of this idea.)


    # 3. TIME: It’s collapsing. Instant interactivity is critical, and is breeding
    accelerated change


    In a world of instantaneous connection, there is a huge premium on instant response
    and the ability to learn from and adapt to the market place in real time. Winning
    companies accept a culture of constant change, and are willing to constantly break
    down and reconstruct their products and processes – even the most successful ones.


    # 4. PEOPLE: They’re the crown jewels . . . and they know it


    Brainpower can’t be tallied on a ledger sheet, but it is the prime factor driving
    the New Economy. More than ever before, huge value is being leveraged from smart
    ideas – and the winning technology and business models they create. So the people
    who can deliver them are becoming invaluable, and methods of employing and managing
    them are being transformed.


    # 5. GROWTH: It’s accelerated by the network


    The Internet can dramatically boost the adoption of a product or service by ‘viral
    marketing’, network-enhanced word of mouth. Communication is so easy on the Web;
    product awareness spreads like wildfire. So once a company reaches critical mass,
    it can experience increasing returns leading to explosive growth. This principle
    means that in the New Economy, first-mover advantages are greater than ever.


    # 6. VALUE: It rises exponentially with market share


    For products that help to establish a platform or a standard, the network effect
    is even more pronounced. The more plentiful they become the more essential each
    individual unit is, a'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'striking exception to the economic rule that value comes from scarcity. In
    addition, some companies give away their products to establish market share, then
    sell linked services later on: network effects were experienced historically in
    the adoption of telephones and fax machines. The difference today is that everyone
    is linked, so far more products and services gain their value from widespread
    network acceptance, as we discussed earlier in this chapter.


    # 7. EFFICIENCY: The middleman lives. ‘Infomediaries’ replace intermediaries


    Traditional distributors and agents are seriously threatened by a networked economy
    in which buyers can deal directly with sellers. But a new brand of middleman is
    being created. As the amount of info-clutter grows, these infomediaries are needed
    to turn dumb data into usable information. They offer aggregated service, or intelligent
    customer assistance, or powerful technology-based buying aids, or an attractive,
    community-based buying environment.


    # 8. MARKETS: Buyers are gaining new power – and sellers new opportunity


    It’s no longer necessary for your customer to walk down the street to compare
    prices and services. Your competitor may just be a mouse-click away. And intelligent
    software helps buyers find the best deal. So businesses that genuinely offer unique
    services or lower costs will flourish, benefiting from a flood of new buyers.
    Those that have relied on physical barriers to competition will fail.


    # 9. TRANSACTIONS: It’s a one-on-one game


    Information is easier to customize than hard goods. The information portion of
    any good or service is becoming a larger part of it.


    # 10. IMPULSE: Every product is available everywhere. The gap between desire and
    purchase has closed


    The shelf space of the World Wide Web is unlike any other, in that it has no bounds.
    Artificial constraints on choice are replaced by the ability to purchase the precise
    product you'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'desire. The impulse to buy and the purchase itself used to be separated by
    a combination of physical and mental barriers. When you heard a song on the radio,
    you had both to remember the song or the artist and actually go to a store to
    purchase. On-line it’s different. Discover a product you desire, and just hit
    the ‘buy’ button. Consequence: The processes for marketing, sales and fulfilment
    are merging.


    # Postscript


    Although the magazine promoting these ideas has since ceased publication and we
    have had, of course, a Nasdaq stock price collapse, there is little doubt that
    these ideas have not gone away. They may have been temporarily set back but they
    will return. They play a key role in understanding the issues associated with
    valuing technology/Internet stocks.


    But let us now turn to the micro-economic picture. As discussed earlier in this
    chapter, the New Economy ideas are indeed still powerful. But to what extent are
    they reflected in how we measure technological change?


    # Technological change and US economic statistics


    The US economy is constantly evolving. New technologies are continuously transforming
    the production and delivery of new and existing goods and services. But business
    practices adapt just as readily to changes in technology. The scramble for market
    share and profitability forces firms to find innovative ways to add value to their
    firm’s products and services.


    These innovations often require computer hardware and software. In the past, when
    businesses generally used main-frame computers, they acquired the hardware and
    software as a bundle. With the advent of personal computers and mini-computers,
    a greater percentage of business software was purchased separately from hardware.
    Yet business software still continued to count as an investment in the US National
    Income and Product Accounts (NIPA) only when purchased as installed software on
    a new computer. Software purchased separately was considered an intermediate input
    and did not'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'count as capital investment. Hence, the unbundling of computer hardware and
    software purchases led to the unintended consequence of US statisticians classifying
    a considerable portion of business software expenditures as intermediate products,
    and hence not directly raising the standard measurement of economic activity,
    GDP.


    Given the mid to late 1990s'' boom in computer purchases, and the fact that computer
    software, like other capital expenditure, provides a flow of services that last
    more than a year, the US Bureau of Economic Analysis (BEA) recognized the need
    to address this issue, and did so in the 28 October 1999 release of the advance
    third quarter GDP report. Accompanying the advance report was the 11th comprehensive
    revision of the NIPA. The BEA now treats business purchases of computer software
    and ‘in-house’ software production as fixed investments in order to remedy the
    classification problem discussed above.


    Adding business software purchases to the new equipment and software (E&S) component
    of non-residential fixed investment, formally known as producers’ durable equipment
    (PDE, raises the level of GDP. In 1998, for example, the nominal value of US software
    investment totalled $123.4 billion, which was 15.1% of E&S investment and 1.4%
    of GDP. A back-of-the-envelope calculation shows that reclassifying software purchases
    as fixed investment boosted the growth of real GDP by about 0.1 percentage point
    a year during the recent US business expansion (first quarter of 1991 to first
    quarter 2001). Moreover, with software prices falling much less than prices of
    computers and peripheral equipment during this period (1.6% versus 19.3%), the
    inclusion of software prices has had the effect of slowing the rate of decline
    of prices of information processing equipment (computers, software and other equipment).


    The effect of these statistical revisions is that software purchases now boost
    the GDP growth figures. Previously when corporations and governments bought software
    the Bureau of Economic Analysis (BEA) rated it as ‘purchased input’, much as when
    an auto company bought steel or a newspaper bought newsprint. So now software
    has been added to the ‘business investment’ column meaning that the BEA recognizes
    that software lasts more than a year, adding directly to the computed value of
    GDP.


    So the New Economy driving principles have now been finally incorporated into
    the official statistics. Given this fact, are there'
