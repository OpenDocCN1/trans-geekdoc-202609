  md: '$D_5 = D_4 (1 + g_2) + \cdots + D_\infty = D_{\infty-1} (1 + g_2)$ Dividend
    stream

    5 + $\cdots$ + $\infty$ Time period


    # The zero growth rate model


    The fixed dollar dividend model reduces to a perpetuity. Assuming a constant dollar
    dividend, Equation 4.2 simplifies to the no growth model shown as Equation 4.3.


    $\hat{P}_0 = \frac{D_0}{k_{cs}} =$ Zero growth version

    of the dividend discount model

    Eq 4.3


    where $D_0$ is the constant dollar dividend expected for all future time periods
    and $k_{cs}$ is the opportunity cost or required rate of return for this particular
    common stock and $\hat{P}_0$ is the current price.


    A zero growth rate common stock is a perpetuity and is easily valued once $k_{cs}$
    is determined.


    It is extremely important in understanding the valuation of common stocks using
    the DDM to recognize that in all cases an investor is discounting the future stream
    of dividends from now to infinity. This fact tends to be overlooked when using
    the perpetuity formula involved with the zero growth rate case because the discounting
    process is not visible. Nevertheless, we are accounting for all dividends from
    now to infinity in this case, as in all other cases. It is simply a mathematical
    fact that dividing a constant dollar amount by the discount rate, $k_{cs}$, produces
    a result equivalent to discounting each dividend from now to infinity separately
    and summing all of the present values.


    # The constant growth rate model


    The other two versions of the DDM, the constant growth model and the multiple
    growth case, demonstrate that to establish the cash flow stream of expected dividends,
    which is to be subsequently discounted, it is first necessary to compound some
    beginning dividend into the future. Obviously, the higher the growth rate used,
    the greater the future amount. Furthermore, the longer the time period, the greater
    the future amount.


    A well-known scenario in valuation is the case in which dividends are expected
    to grow at a constant rate over time. This constant or normal growth model is
    shown as Equation 4.4'
  merge: -1
