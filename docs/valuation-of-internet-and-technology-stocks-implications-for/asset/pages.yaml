    # The Black–Scholes model


    The binomial model, discussed earlier, assumes a discrete-time stationary binomial
    stochastic process for security price movements. In the limit, as the discrete-time
    period becomes infinitely small, this stochastic process becomes a diffusion process
    (also called a continuous-time random walk, an Ito process, or geometric Brownian
    motion). This was the process assumed by Black and Scholes (1973) in their derivation
    of the option pricing formula. As with the binomial model, Black and Scholes begin
    by constructing a riskless hedge portfolio, long in the underlying security and
    short in call options. This portfolio generates the riskless rate of return, but
    the internal dynamics of the portfolio are driven by the diffusion process for
    the security price. The structure of the hedge portfolio can be put into a form
    that is identical to the heat equation in physics.'
