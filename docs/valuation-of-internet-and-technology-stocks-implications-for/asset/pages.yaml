    UBS Warburg have developed a three-stage DCF model for use with all stocks, but
    it is particularly useful for growth stocks where the growth period is longer
    than that taken by the normal analyst’s explicit forecast period. There are two
    main differences between this model and the traditional model:


    +   1. a medium-term growth period, and

    +   2. a terminal value based upon value drivers (an approach similar to the one
    used in the target multiple model described later).


    These are discussed below.


    # The medium term growth rate


    Much of the value inherent in growth stocks is dependent upon:


    +   - the period over which a premium growth rate can be maintained;

    +   - the rate of that growth; and

    +   - the cost in terms of additional investment.


    This model looks at the current price and calculates the implied medium term growth
    rate. This can then be compared with the likelihood of that growth continuing.


    # The terminal value


    This can be calculated using a value driver approach to produce a target exit
    multiple from inputs of forecast long-term growth, cost of capital and, importantly,
    the incremental return on capital.


    # The use of multiples as valuation techniques: arguments for and against


    The use of multiples (sales revenue, forecast revenue, profits etc.) are not a
    measure of the absolute value of a company. They are useful for investors seeking
    a portfolio approach to technology stock investment. Multiples are criticized
    because they do'
