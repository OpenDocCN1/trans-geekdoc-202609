  img_proc: true
- pgno: 99
  md: '# The American Marketing Association defines a brand as


    A **brand** is a name, term, sign, symbol, or design, or a combination of them,
    intended to identify the goods or services of one seller or group of sellers and
    to differentiate them from those of competitors.


    Interbrand, a specialist brand consultancy, have a more financially specific definition
    of a brand. Interbrand regards the brand as an intangible asset that creates an
    identifiable economic earnings stream. Their approach to brand valuation is based
    on the principle of economic use, which means the value the brand adds to the
    underlying business. Brand value is defined as the net present value of the economic
    profit that the brand is expected to generate in the future. Table 5.2 illustrates
    that many of the world''s most well-known companies have a brand value, rather
    than an asset value, which represents a significant proportion of their market
    capitalization.


    In essence, a brand identifies the seller or maker. It can be a name, trademark,
    logo or other symbol. Under trademark law, the seller is granted exclusive rights
    to the use of the brand name in perpetuity. Brands differ from other assets such
    as patents and copyrights, which have expiration dates.


    A brand is essentially a seller''s promise to deliver a specific set of features,
    benefits and services consistently to the buyers. The best brands convey a warranty
    of quality. But a brand is an even more complex symbol. It can convey up to six
    levels of meaning:


    +   (1) *Attributes*: A brand brings to mind certain attributes. Mercedes suggests
    expensive, well-built, well-engineered, durable, high-prestige automobiles.

    +   (2) *Benefits*: Attributes must be translated into functional and emotional
    benefits. The attribute ‘durable’ could translate into the functional benefit:
    ‘I won’t have to buy another car for several years.’ The attribute ‘expensive’
    translates into the emotional benefit: ‘The car makes me feel important and admired.’

    +   (3) *Values*: The brand also says something about the producer’s values. Mercedes
    stands for high performance, safety, and prestige.

    +   (4) *Culture*: The brand may represent a certain culture. The Mercedes represents
    German culture: organized, efficient, high quality.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '(5) Personality: The brand can project a certain personality. Mercedes may
    suggest a no-nonsense boss (person), a reigning lion (animal), or an austere palace
    (object). (6) User: The brand suggests the kind of consumer who buys or uses the
    product. One would expect to see a 55-year-old top executive behind the wheel
    of a Mercedes, not a 20-year-old secretary.


    In the digital world consumers are in control. Digital developments allow Web
    surfers to choose products solely on real value and not just intangibles, like
    brand associations. Already websites exist that compare features on more than
    10 000 products and digital personal assistants will surf the Web looking for
    information you''ve requested. This development is in fact weakening the impact
    of brands.


    Despite this long-term trend towards brand weakening, how does a small company
    or a new company which cannot spend millions of dollars on an expensive advertising
    campaign compete? Technology companies in particular have been adept at achieving
    levels of brand recognition through less conventional marketing approaches. Here
    are two examples:


    # American Online Inc.


    Over half of US households are familiar with America Online (AOL). That''s because
    AOL gives away its software for free. For several years AOL has been blanketing
    the country with diskettes and now CD-ROMs, offering consumers a one-month free
    trial. Because it''s hard to describe the benefits of an on-line service to novices,
    AOL believes the best approach is to let them try it. Then, once consumers start
    using AOL, the company reasons that the user-friendly program will lure them to
    subscribe. Also on AOL''s side is sheer consumer inertia, which prevents many
    people from switching and signing on with another Internet service provider.


    # Sun Microsystems Inc.


    Sun has built the visibility of Java, its flagship software program, within the
    corporate community almost entirely through conducting a public relations war.
    It has aimed its guerrilla PR largely at the company''s nemesis, Microsoft. For
    example, after Microsoft developed a technology that competed with Sun''s ''Java
    Beans'', Sun learned when and where Microsoft planned to introduce it. The day
    before Microsoft''s announcement Sun mailed bags of'
