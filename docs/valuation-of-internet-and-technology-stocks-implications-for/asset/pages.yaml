- pgno: 75
  md: 'Another yardstick used to judge the future of the market is the dividend yield.
    The dividend yield has averaged 4.9% from 1871, with a high of 8.71% in 1959 and
    a low of 2.85% in 1973. The dividend yield shows far less variability than the
    earnings yield, as managers pursue policies to stabilize the cash payments to
    stockholders.


    In contrast to the long-term stability of the earning yield, the US dividend yield
    has fallen significantly in recent years. Between 1959 and 1994, the average dividend
    yield was 3.8%, and has fallen since to below 2%. The primary cause of the reduction
    in the dividend yield is not the higher valuation of shares, but the reduction
    in the dividend pay out ratio – the fraction of earnings firms pay as dividends.
    The increase in US personal and corporate taxes has made it advantageous for firms
    to retain earnings, rather than pay them to stockholders in the form of taxable
    dividends.


    # The fundamental valuation techniques available


    Numerous fundamental stock valuation methods are available for investors to choose
    between. It must be said that stock picking, as it is known, is an art rather
    than a science. However there are scientific elements to the exercise and this
    section summarizes the techniques available. It must be stressed that each technique
    has limitations and these should be kept in mind.


    The fundamental techniques discussed below cover:


    +   - The price/earnings ratio

    +   - The price/earnings growth factor (PEG ratio)

    +   - The dividend yield

    +   - The yield ratio: bond yield to the dividend yield

    +   - Tobin’s q ratio

    +   - Price to book value

    +   - Price to sales ratio


    # The price earnings (P/E) ratio


    The cash flows which are received by stockholders come primarily from dividends,
    and these dividends in turn come from earnings. Obviously, then, two of the most
    important financial statistics about stocks are earnings and dividends. The earnings
    per share divided by the current stock price is'
