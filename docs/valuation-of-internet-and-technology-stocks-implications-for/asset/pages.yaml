    respectively. Equivalently, selling 0.5 shares of the stock and lending $38.10
    at the risk-free rate would mean payoffs from that portfolio of –$20 and $0 in
    the up and down state, respectively, which would completely offset the payoffs
    from the option in those states. This is a very powerful finding as it enables
    us to replicate the risk-free portfolio and price the options accordingly. It
    is also worth noting that the current value of the option must equal the current
    value of the portfolio, which is 100 × Δ – M = 100 × 0.5 – M = $11.90. In other
    words, a call option on the stock is equivalent to a long position in the stock
    financed by borrowing at the risk-free rate.


