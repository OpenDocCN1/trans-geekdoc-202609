- pgno: 87
  md: '# Applying the Porter model to the valuation of Internet and technology stocks


    The recent performance of technology and Internet companies and their stock price
    behaviour offers a classic textbook example of how business strategy, as taught
    in most business schools, can be applied. As any new industry establishes itself,
    the theory goes, it will move through several stages. First, many industry players
    will emerge. Second, a group of leaders will start to stand out from the pack.
    Third, these leaders will then move to cement their positions through acquisitions
    and consolidation, resulting in a divergence between the stronger and the weaker
    players, with the weaker players then dropping out. Eventually, a new group of
    more specialized, niche-oriented companies emerge to coexist with the leaders.


    The textbook model demonstrates that one can apply this framework for analysing
    New Economy companies and ultimately their stock values in ways similar to the
    factors influencing old economy companies and their stock values. Analysis of
    the factors internal and external to the firm has to take place. New economy,
    old economy, same process. It is these internal and external factors that will
    influence the long-term valuation of these companies and it is to this that we
    now turn. Remember that the rules of the New Economy from Chapter 2, despite recent
    volatilities, must still be imposed on the standard valuation process. But what
    are these internal/external factors which need to be analysed? Internal factors
    are those which arise from within the individual company and external factors
    are those relevant to the industry overall.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Internal analysis: strategic factors within the company


    The internal factors that are crucial to make a company successful, and ultimately
    affect its stock valuation, are listed below.


    # Human capital


    +   - **Management:** Most successful companies have a strong management or a
    strong leader. A company needs to have a management that is able to motivate employees
    so they can work to their best ability. Investors consider management as a very
    important factor when they consider investing in a company; few investors would
    invest in a company with weak management.

    +   - **Motivation:** It is important to keep all people involved in the company’s
    activities motivated to work well. It has been very common among Internet companies
    to use stock options where the employees have the opportunity to have ownership
    in the company and thereby have a share of future profits. Clearly this becomes
    a problem when the stock price falls and the options appear to have little value.

    +   - **Knowledge/skills:** Another important factor is to see what access to
    knowledge the company has. A company with a high level of knowledge is probably
    more attractive than a company with a brilliant business idea but without the
    skills to carry it out. Initially attracting individuals with the appropriate
    skills is essential, but as the sector matures one would expect the supply of
    suitably skilled personnel to rise.


    # The corporate culture


    The culture within the company is of great importance. Is the firm profit oriented,
    cost oriented? Do the employees have the right attitude? Without attributes like
    those the firm will not have the requirements to be a successful company. The
    work environment could be of considerable importance. Is the environment a creative
    environment to work in? Is the organization flexible? Do the employees feel that
    they are important and what they say counts? There is no doubt that the corporate
    culture for technology companies is very different from the old economy companies.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# The uniqueness of product or service


    Another important factor to analyse is the uniqueness of the product or the service.
    A good way to measure uniqueness is to estimate the time it would take a competitor
    to reach the same position the company has now. The most interesting companies
    have products or services that are protected by patents and/or are technically
    advanced or are in some other way difficult to substitute. Looking at a company''s
    Research & Development (R&D) department will give a good view of their ability
    to come up with new unique products. The brand is another factor that an investor
    could look at to see if the company has or is building a strong brand that will
    add value to the company. The whole B2B and B2C sectors are providing a unique,
    if yet unproven business model.


    # External analysis: strategic factors for analysing the industry environment


    An industry analysis usually begins with a general examination of the forces influencing
    the organization. The objective of such a study is to use this to develop the
    competitive advantage of an organization in its ability to defeat its rival companies.


    This type of analysis is often undertaken using the structure proposed by Porter.
    His basic model is illustrated in Figure 5.1. This is often called Porter''s Five
    Forces Model because he identifies five basic forces that can act on the organization:


    +   - the bargaining power of suppliers

    +   - the bargaining power of buyers

    +   - the threat of potential new entrants

    +   - the threat of substitutes

    +   - the extent of competitive rivalry.


    The objective of such an analysis is to investigate how the organization needs
    to form its strategy in order to develop opportunities in its environment and
    protect itself against competition and other threats.'
