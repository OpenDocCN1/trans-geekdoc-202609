  img_proc: true
- pgno: 14
  md: '# Technological change and the stock market in history


    Every major advance in communication and transportation has been a marvel to users,
    a cause for a huge stock market celebration and, for the economy in most cases,
    significantly lowered costs of distribution. Ultimately, every distinctive innovation
    matured and was eclipsed by the next one.


    In the late 1600s, Turnpike Trusts in the United Kingdom became very popular with
    investors and provided dramatically improved efficiencies. As existing roads were
    narrow and rough, packhorses were widely used. The new toll roads featured a well-structured
    roadway wide enough that wagons could pass. A packhorse could carry about 250
    pounds, but the turnpike could support a two-ton wagon load pulled by a two-horse
    team resulting in a quadrupling in productivity.


    In the 1720s, the prolific writer Daniel Defoe noted that the reduction in freight
    rates mainly benefited tradesmen rather than carriers. Obviously, conditions were
    competitive. The public heard all the touts, but considered the tolls as taxation
    and were impatient for benefits. The following doggerel sums up the party aspects
    of the boom and its consequence:


    > Now with Turnpikes are grown much in fashion the hardest Tax in all our Nation
    – for where Wine & Women & Stock-Jobbing past, The Turnpike must help us at last.


    The jump in efficiencies with canals was outstanding as one horse could tow a
    barge carrying 50 tons. The improvement over the packhorse was by a factor of
    400 times or over the turnpike by about 50 times. Speculators frantically chased
    new canal issues.


    Of course, the construction time from stock mania to operating success was measured
    in years and canals provided the first great vision phenomenon well in advance
    of commercial reality. A new issue mania erupted in 1792 and subscriptions could
    only be entered with the company in the town where the canal was to start. Newspapers
    that winter provided entertaining accounts of speculators wildly galloping through
    the night in snowstorms to get to the next town for the start of business.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'As wondrous as they were, canals had limitations, with droughts in summer and
    ice in winter. Also, speed was limited due to bank erosion from the wake of faster
    ‘packets’ designed for passengers and mail.


    Horse-drawn freight wagons rolling on wooden rails had long shown efficiencies
    superior even to wide (up to 9 inches) steel-tired wheels on improved roads. Originally
    developed as feeders to turnpikes and then to canals, all that was needed was
    a mobile steam engine to launch another revolution in communications.


    Naturally, speculators were in full song well before commercial success. The high-tech
    concept celebrated in the bubble that peaked in 1825 was the railroad. ‘Nothing
    now is heard of but railroads,’ said the Quarterly, a London publication, in May
    1825. ‘The daily papers teem with notices of new lines in every direction; and
    pamphlets are thrown before the public eye recommending nothing short of them
    general throughout the Kingdom.’


    During 1824 and 1825 prospectuses were issued for 624 companies, and in March
    of 1825 the famous merchant banker, Francis Baring, noted ‘The gambling mania
    [has] seized upon all classes and was spreading in all parts of the country.’
    That bubble topped out in the summer and the stock market was into severe speculative
    frenzy in late October when the first commercial railroad began operation. Railroads
    did not reach ultimate saturation in the United States until the 1890s, just as
    the automobile was being developed. Automobile sales collapsed in the severe recession
    following the1920 commodity boom. They spiked up again in the stock market euphoria
    just prior to the 1929 stock market crash, when they again collapsed.


    The electronic world, so to speak, began in the 1860s with telegraph using Morse
    code and by 1869 undersea cables provided instantaneous communication between
    America, Europe and England. All of this was celebrated as high-tech in the 1873
    Bubble. Obviously, the telephone, in moving from Morse to voice, was an outstanding
    but evolutionary step. The effect of the introduction of the telephone as a distinctive
    jump in communications and transportation was highly celebrated in the 1920s’
    great financial boom.


    Radio communication using Morse was expanded by military purposes during the First
    World War and handed over to RCA. The business plan in 1920 could not have imagined
    network broadcasting of voice and music, as well as gramophones and'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'talking pictures by 1929. Saturation in both the stock market and the industry
    was reached in 1929, and the subsequent market crash is well documented.


    # The defining moment for the Internet: ‘The Protocol for Packet Network Intercommunication’


    Until the 1970s the idea of the world as a single, unified entity was no more
    than that – an idea. It began to become a reality with the development of computer
    technology and information theory that was to lead to the creation of the Internet.
    This was a process of immense technical complexity over which there was no one
    presiding genius. One of the Internet’s strengths is that it is not dependent
    on a single insight or technology. But it is fair to say that the May 1974 edition
    of the obscure technical journal *IEEE Transactions on Communications* was a defining
    moment in twentieth-century history and, probably, the new millennium also.


    The paper published by Robert E. Kahn and Vinton G. Cerf was unpromisingly entitled
    ‘A Protocol for Packet Network Intercommunication’. It is technical, jargon-laden
    and as dry as dust. It concludes: ‘In particular, we have described a simple but
    powerful and flexible protocol which provides for variation in individual network
    packet sizes, transmission failures, sequencing, flow control, and the creation
    and destruction of process-to-process associations.’ In short, they had defined
    the Internet. The key to the Net is that it is, indeed, a net. It has no centre;
    rather it is a connection system between millions of computers. As a result, it
    is impossible to turn off unless there is a total global failure of electricity
    supplies and, in addition, it is formidably resilient. Thanks to the way ‘packets’
    of information will always find their own routes through the Net, it can survive
    the destruction of much, or even most, of its fabric.


    The power of the network is that it lies beyond the control of its users, companies
    or nations. Like roads, railways and telephones before it, the Net brings a hitherto
    inconceivable'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'level of connectivity to the world. But unlike them, it also creates a new
    world – cyberspace. This is a ‘place’ in that it can be navigated, and the language
    associated with it is that of geography or architecture. So there are chat ‘rooms’,
    web ‘sites’, Net ‘locations’ and we are said to ‘surf the Net’ as if it were an
    ocean.


    The impact that the Cerf and Kahn paper was to have was not fully recognized at
    the time. However, the authors were well aware that, with hindsight, some past
    forecasts about technology and its economic impact had been wildly optimistic.
    Cerf and Navas ky, in a later paper, quote Thomas Edison’s 1910 forecast that
    ‘the nickel–iron battery will put gasoline buggies out of existence in no time’
    (1984, p. 229). But other forecasts were equally wildly pessimistic. Cerf and
    Navas ky also quote the president of the Michigan Savings Bank’s prediction in
    1903 that ‘the horse is here to stay, but the automobile is only a novelty, a
    fad’ (1984, p. 228).


    # The democratization of data


    A group of researchers at the University of California, Berkeley, led by Peter
    Lyman and Hal Varian, collated the estimated output of unique information the
    world is currently producing each year. The figure they came up with, in 1999,
    is about 2 exabytes. (An exabyte is roughly a billion times a billion bytes, or
    the equivalent of around 20 billion copies of a business magazine.) The authors
    of the study point out that soon it will be technologically possible for an average
    person to obtain access to virtually all recorded information.


    To calculate the numbers the authors start with examining the four main storage
    media: paper, film, optical disks and magnetic devices such as disks and tapes.
    Take film, for instance. More than 80 billion photographs are taken each year
    around the world, according to America’s Department of Commerce. UNESCO puts the
    number of movies produced annually at 4250. And then there are 2 billion x-rays.


    The researchers translated these numbers into bytes – 5 megabytes per photo, 4000
    megabytes per movie, 8 megabytes per x-ray, for example – and added them up. To
    do this, they made certain assumptions about the degree to which digital information
    is compressed to save space.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The main conclusion from analysing this data is what the authors call the ‘democratization
    of data’. It is individuals around the globe who create and store most of this
    data – about 740 000 terabytes (thousand billion bytes) a year. Published information
    adds up to a mere 285 terabytes.


    The researchers also calculated the amount of information generated by communications
    such as e-mail, radio and telephone calls, since all of this will probably be
    archived systematically in the near future. The results are equally staggering.
    About 610 billion e-mails are sent each year in America alone, adding up to more
    than 11 terabytes. But this is nothing compared with the mountain of data generated
    by telephone calls: 576 000 terabytes.


    Kenneth Arrow, in his 1973 Nobel Prize for Economics acceptance speech, spoke
    of information as ‘an economically interesting category of goods which have not
    hitherto been afforded much attention’. The world has caught up with Arrow’s comments.
    The age of information is truly with us.'
  merge: -1
  img_proc: true
- pgno: 19
  md: "# The New Economy: where do Internet and technology stocks fit in?\n\n> When\
    \ you see reference to a new paradigm, you should always, under all circumstances,\
    \ take cover . . . There was never a paradigm so new and so wonderful as the one\
    \ that covered John Law and the South Sea Bubble . . . until the day of disaster.\n\
    > \n> (J.K. Galbraith, The Great Crash, 1955)\n\nDuring the 1990s, strong economic\
    \ growth in the United States, combined with low inflation and a pickup in labour\
    \ productivity growth, led many people to label the phenomenon a ‘new economy’.\
    \ But there was really little consensus on what was different about the US economy\
    \ nor on what the term meant. This chapter examines what was meant by the New\
    \ Economy, providing the background for understanding the complex issues involved\
    \ in the valuation of Internet and technology stocks.\n\n# The New Economy defined\n\
    \nDefinitions of the New Economy are not precise but typically include one or\
    \ more of the following characteristics.\n\n# A higher rate of productivity growth\n\
    \nThe higher rate of productivity growth is largely related to investment in information\
    \ technology (IT). This has resulted in what economists refer to as ‘capital deepening’,\
    \ the process"
  merge: -1
  img_proc: true
- pgno: 20
  md: 'whereby the quantity of capital per worker increases over time (the capital/labour
    ratio). Recent examples of this are the investment in information technologies,
    reflecting falling computer prices and new ways computers can help accomplish
    old tasks with fewer inputs. The microprocessor lies at the heart of these technological
    developments. The microprocessor’s ability to manipulate, store and move vast
    amounts of information has, it is argued, shifted the US economy’s centre of gravity,
    creating the era of smaller, faster, smarter, better, cheaper. To gain an appreciation
    of the implications of these technological developments it is instructive to look
    back in US history (see McTeer, 1999).


    From 1895 to 1915, a great burst of inventiveness ushered in an era of rapid technological
    change and economic growth. Americans saw the arrival of one marvel after another
    – automobiles, aeroplanes, telephones, phonographs, radios, elevators, refrigeration
    and much more. These new inventions barely registered as a blip in a GDP dominated
    by farming, shopkeeping and small-scale production. In time, though, the industries
    that grew out of them formed the economic backbone of the twentieth century. The
    advances of this long-ago era would have been impossible without a technology
    that arrived just after the US Civil War: electricity. Thomas Edison created the
    lightbulb in 1879 for the simple task of illuminating a room. To build a market
    for his invention, Edison harnessed electricity, building the world’s first generating
    plant and a distribution network in New York City. As it spread through the economy,
    electricity recast the economic paradigm. Without electricity, there would be
    no spark for internal combustion engines, no power for telephones, radios, refrigerators
    and air conditioners. Electricity provided an ever-ready energy source for factories,
    with mass production driving down the cost of making just about everything.


    Like electricity, the microprocessor is an important invention in its own right
    and one that shook the world as it touched off a rapid-fire proliferation of spillovers.
    In 1958 Jack Kilby of Texas Instruments fashioned the first integrated circuit,
    a bundle of transistors on a piece of silicon. Thus began the grand theme of modern
    electronics – ever smaller, ever more powerful. Thirteen years later, Ted Hoff
    of Intel developed the silicon-etching process that produced the first true microprocessors.
    Initial applications centred on number crunching and rapid data entry. Handheld
    calculators arrived in 1972, bar code scanners in 1974 and the personal computer
    in 1975.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Over the next decade or so, American industry applied microprocessors to other
    tasks. Whole new products, progeny of the digital electronic revolution, burst
    onto the market place – cellular telephones, robotic factory hands, air traffic
    control systems, global positioning satellites, laser surgery tools, camcorders,
    palm-size personal organizers, to name just a few.


    Microprocessors made existing products better, cheaper and more efficient. Starting
    in the early 1980s, ‘smart’ features helped fine-tune televisions, cut energy
    use by refrigerators, control cooking in microwave ovens, memorize programme schedules
    in VCRs and generate diagnostic reports for automobiles.


    Universities were the first to hook computers into networks, but it wasn’t long
    before everyday Americans began to connect via electronic mail. The Internet entered
    the 1990s as an obscure communications network for educators and scientists. It
    ended the decade as the library, shopping mall and playground of the masses. The
    Internet is creating spillovers making existing industries more efficient and
    spawning entirely new ones, including web page design and Internet service.


    Computer processing power leapt 7000-fold in three decades. Number crunching tasks
    that took a week in the early 1970s now require but a minute. The Pentium chip,
    released by Intel in May 1993, crowds 3.1 million flawless transistors on a square
    of silicon 16 millimetres by 17 millimetres. It can churn out calculations at
    up to 112 million instructions per second (mips).


    Data storage capacity and transmission speeds surged right along with the more
    powerful microprocessors. A single memory chip now holds 250 000 times as much
    data as one from the early 1970s – the difference between one page of text and
    1600 books. Transmission speeds increased by a factor of nearly 200 000. Sending
    the 32-volume Encyclopaedia Britannica on the Internet from New York to San Francisco
    would have taken 97 minutes in 1970. Today’s trunk lines can move the equivalent
    of eight full sets in just one second.


    Great leaps of power, capacity and speed led to even greater reductions in the
    cost of managing information. Intel’s vintage (1970) chips sold for $7600 per
    megahertz. Today’s Pentium III chip supplies its computing power for 17 cents
    per megahertz. The cost of storing one megabit of information – enough for a 320-page
    book – fell from $5257 in 1975 to 17 cents in 1999. Sending the Encyclopaedia
    Britannica coast to coast would have cost $187 in 1970, largely because of slow
    data-transmission speeds and the expense of a long-distance telephone call. Today,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'the entire Library of Congress could move across the nation on fibre-optic
    networks for just $40.


    As the new technology became better and cheaper, American businesses and households
    embraced it. Only a few thousand homes had a PC in 1980. Now more than half of
    US families own computers, the newest of them 200 times more powerful than IBM’s
    first PC, introduced in 1981. Three-fifths of US households are connected to the
    Internet, a mode of instant communication scarcely heard of at the start of the
    1990s. This growth in technology provides the underpinning to the idea that the
    old rules of economics have been dramatically changed.


    # A rise in total factor productivity growth


    Total factor productivity growth refers to the growth in output that is not explained
    by the physical increase in either capital or labour. Its contribution to economic
    growth is not easy to identify and measure but nevertheless is an important source
    of economic growth. This phenomenon is due to the increased utilization of information
    technology across the economy with resulting spillover effects. Total factor productivity
    growth depends on:


    +   - technological change

    +   - other advances in knowledge, e.g. just in time manufacturing

    +   - economies of scale.


    Spillover effects occur when returns to an investment increase because others
    make similar investments. Examples here would be networking and the returns to
    an Internet-capable computer as more consumers and businesses connect to the Internet.


    The effect of the Internet has been to intensify product market competition with
    associated efficiency.


    The potential impact of the Internet gains can be seen from Figure 2.1. It took
    36 years to achieve 50 million users for radio, 13 years for TV, 16 for PCs, but
    for the Internet it has taken fewer than 5.


    # Technology spillovers: increasing returns and decreasing costs


    Even when individual industries face decreasing returns to scale, the economy
    as a whole may enjoy increasing returns when technology spillovers from one industry
    benefit others. Technology spillovers are especially abundant with inventions'
  merge: -1
  img_proc: true
