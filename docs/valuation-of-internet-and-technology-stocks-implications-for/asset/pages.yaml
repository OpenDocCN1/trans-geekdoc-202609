  md: '![](img/67ce553842aa835a611c7cbbbb028358_46_0.png)


    Figure 3.3 Microprocessor price trends


    # Gilder’s law: developments in bandwidth


    The term bandwidth is used to mean the slice of the radio spectrum available for
    transmission. Today it is mostly used to describe the rate at which information
    – measured in bits of data per second – can move between computers.


    The ability to transfer large amounts of data is largely determined by bandwidth,
    the carrying capacity of the connections, or the ‘size of the pipes’, between
    the sender and the receiver of the data. Greater bandwidth allows faster transmission
    of larger amounts of data, which in turn facilitates not only the development
    of vastly more valuable and compelling on-line services, but also the convergence
    of all forms of electronic data transmission, from e-mail and basic text documents,
    which require relatively little bandwidth, to full-motion, real-time video applications,
    which require a great deal of carrying capacity.


    Fibre-optic cable, currently being laid as fast as the companies supplying it
    can dig trenches, are increasing this carrying capacity. Pundit George Gilder
    has proposed a bandwidth corollary of Moore’s law: Backbone capacity will triple
    annually for the next quarter century. It could happen. Already, corporate Internet
    users are measuring their access in gigabits per second – sufficient to start
    realizing the trillion-dollar pipe dream of TV and Internet convergence.'
