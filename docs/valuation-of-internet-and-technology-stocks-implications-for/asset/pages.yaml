- pgno: 67
  md: 'These wide differences suggest why stock prices constantly fluctuate as investors
    make their buy and sell decisions. Even if all investors use the constant growth
    version of the DDM to value a particular common stock, many different estimates
    of value will be obtained given that:


    +   1. Each investor has his or her own required rate of return, resulting in
    a relatively wide range of values of *k*.

    +   2. Each investor has his or her own estimate of the expected growth rate in
    dividends. Although this range may be reasonably narrow in most valuation situations,
    small differences in *g* can produce significant differences in price, everything
    else remaining constant.


    Thus, at any point in time for a particular stock, some investors are willing
    to buy, whereas others wish to sell, depending on their evaluation of the stock’s
    prospects. This helps to make markets active and liquid.


    # ***The multiple growth rate model***


    Many firms grow at a rapid rate (or rates) for a number of years and then slow
    down to an ‘average’ growth rate. This was certainly the case for technology stocks.
    Other companies pay no dividends for a period of years, often during their early
    growth period. The constant growth model, discussed earlier, is unable to deal
    with these situations; therefore, a different model is needed that can handle
    these possible scenarios. Such a variation of the DDM is the multiple growth rate
    model.


    Multiple growth is defined as a situation in which the expected future growth
    in dividends must be described using two or more growth rates. Although any number
    of growth rates is possible, most stocks can be described using two or possibly
    three. It is important to remember that we need to assume at least two different
    growth paths. This is the distinguishing characteristic of multiple growth situations.


    A number of companies have experienced rapid growth that could not be sustained
    forever. During part of their lives their growth exceeded that of the average
    company in the economy, but later the growth rate slowed. Examples from the past
    would include McDonald’s, Disney, IBM, Microsoft and Amazon.


    To capture the expected growth in dividends under this scenario it is necessary
    to model the dividend stream during each period of differential growth. It is
    reasonable to assume that at some point the company’s growth will slow down to
    that'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'of the economy as a whole. At this time the company’s growth can be described
    by the constant growth model. What remains, therefore, is to model the exact dividend
    stream up to the point at which dividends slow to a normal growth rate and then
    to find the present value of all the components.


    A well-known multiple growth model is the two-stage growth rate model. This model
    assumes near-term growth at a rapid rate for some period (typically, 2 to 10 years)
    followed by a steady long-term growth rate that is sustainable (i.e., a constant
    growth rate as discussed earlier). Equation 4.7 describes the multiple growth
    model:


    ```

    P̂₀ = Σₜ₌₁ⁿ D₀ (1 + g₁)/(1 + k)ᵗ + Dₙ (1 + g_c)/(k - g_c) × 1/(1 + k)ⁿ   Eq 4.7

    ```


    where


    +   - P̂₀ = the intrinsic or estimated value of the stock today

    +   - D₀ = the current dividend

    +   - g₁ = the supernormal (or subnormal) growth rate for dividends

    +   - g_c = the constant growth rate for dividends

    +   - k = required rate of return

    +   - n = the number of periods of supernormal (or subnormal) growth

    +   - Dₙ = the dividend at the end of the abnormal growth period


    Notice in Equation 4.7 that the first term on the right-hand side defines a dividend
    stream covering n periods, growing at a high (or low) growth rate of g, and discounted
    at the required rate of return, k. This term covers the period of supernormal
    growth, at which time the dividend is expected to grow at a constant rate forever.
    The second term on the right-hand side is the constant growth version discussed
    earlier, which takes the dividend expected for the next period, n + 1, and divides
    it by the difference between k and g. Notice, however, that the value obtained
    from this calculation is the value of the stock at the beginning of period n +
    1 (or the end of period n), and it must be discounted back to time period zero
    by multiplying by the appropriate discount (present value) factor. Conceptually,
    the valuation process being illustrated here is:


    P̂₀ = discounted value of all dividends through the unusual growth period n plus
    the discounted value of the constant growth model which covers the period n +
    1.'
