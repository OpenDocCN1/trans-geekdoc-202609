    # Who participates in the derivatives markets?


    In order to understand how to apply these arbitrage principles, and ultimately
    to understand how option prices are determined, we need to examine the actions
    of the different participants in the markets. In this case we choose the gold
    market, but any other market could easily have been selected.


    The expected future price of gold is important to anyone who uses the gold *spot*
    markets, that is, the market for immediate delivery or receipt of gold, and to
    the gold *futures* and *forward* markets, that is, the markets for delivery at
    some future time period. These users would include:


    +   - (A) Investors

    +   - (B) Long speculators

    +   - (C) Short speculators

    +   - (D) Long hedgers

    +   - (E) Short hedgers

    +   - (F) Arbitrageurs


    It is useful to describe each of these market participants, discuss what motivates
    their market behaviour, and look at how their actions affect the spot and the
    future or forward price of an underlying commodity or security.'
