- pgno: 171
  md: '# What is basis?


    Basis is the difference between the forward or future value and the spot value.
    For many products, the basis is defined as the cost minus the benefit of holding
    the underlying security. This gives the following relationship:


    basis = cost of transaction – benefit from the transaction


    In our gold futures pricing example, we considered only the financial cost of
    carrying gold at 10%, because there are no economic or financial benefits from
    owning gold. (It might give you a feeling of comfort to own gold, but we are not
    counting that.) In some other products, there are benefits to holding financial
    instruments as well as costs.


    If we now consider the futures markets for stocks we must again consider the cost
    of carry, that is, the cost of the money to buy the stock, but we must now also
    consider the possible benefit of holding stocks, i.e. the possibility of receiving
    a cash dividend. Not all stocks pay dividends, but if they do, the dividend is
    a benefit.


    In currency markets, the cost of carrying a foreign currency is the investor''s
    domestic interest rate. If US dollar-based investors wants euros, they have to
    give up dollars to buy the euros. When they give up the dollars, they either take
    them out of an interest-bearing account, which means they lose the interest income,
    or they borrow the dollars from a bank and pay domestic interest. Either way they
    have a carry cost in the domestic currency, and that is the dollar cost. On the
    other hand, when they get the euros, they can invest them in a euro account and
    earn interest at euro rates. The interest on the euro account is a benefit of
    owning the euros.


    Let us now turn to the bond market. Often, traders or portfolio managers have
    to borrow money to carry bonds. They borrow money in the Repo (repurchase agreement)
    market, posting the bonds as collateral for the loan. The Repo rate is the term
    used for the interest rate charged on such a loan. On the other hand, while they
    own the bond they are entitled to any coupon interest that accumulates. For a
    bond, the Repo rate is the carry cost of the bond, and the coupon interest is
    the benefit.


    The basis in each of these examples consists of the cost of holding the instrument
    or commodity minus the benefit of owning the underlying instrument or commodity
    from the spot date to the forward date.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'The basis for different instruments is as follows:


    +   - For gold, the basis is simply the interest cost of carrying the gold.

    +   - For a stock, the basis is the interest cost of carrying the stock minus
    the dividends earned from the stock.

    +   - For a currency, the basis is the cost of the interest on the domestic currency
    minus the benefit of the interest earned on the foreign currency.

    +   - For a bond, the basis is the cost of borrowing at the Repo rate minus the
    benefit of the coupon payment.


    # What are forward market contracts?


    A forward contract is an agreement between two parties made independently of any
    organized exchange market. Nobody other than the parties to the forward agreement
    needs to be involved – there are no formal rules outside the agreement between
    the two parties. The forward contract is a stand-alone, customized contract. It
    can be based on any amount of any good. It can be written for settlement at any
    time and at any price. It can be, as an extreme example, for delivery of 37 000
    gallons of vodka in 52 days at $2 a gallon. The terms can be virtually anything
    as long as both parties agree to them.


    One party agrees to sell the vodka at the contract price, and the other party
    agrees to buy it at that price. Since the contract can be for any amount of any
    good, at any time and at any price, and since each party depends on the other
    party to meet contractual obligations, the forward contract cannot be traded freely
    with other potential counterparties. Forwards are not fungible; that is, one forward
    contract is not interchangeable with another contract that has similar terms,
    and the present value of the forward contract is not easily converted to a cash
    market value.


    Each party has to be able to trust that the other party will uphold their side
    of the agreement, because the two counter-parties are exposed to each other''s
    ability and willingness to perform on the contract. There is credit risk associated
    with a forward contract, which must be controlled. This is based in the fact that
    you cannot be sure that the counterparty will deliver as agreed. Often, the credit
    risk is controlled by banks, which act as intermediaries, assuring the performance
    of their clients. A very important point to remember about forward contracts is'
