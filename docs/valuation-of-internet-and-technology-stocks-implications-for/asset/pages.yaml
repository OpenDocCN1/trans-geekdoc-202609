    relevant for option pricing. Any spreadsheet that computes NPV already contains
    the information necessary to compute S and X, which are two of the five option-pricing
    variables. Accordingly, executives who want to begin using option pricing need
    not discard their current DCF-based systems.


    NPV and option pricing do diverge, however, when the investment decision may be
    deferred. The possibility of deferral gives rise to two additional sources of
    value. First, we would always rather pay for assets later than sooner, all else
    being equal, because we can earn the time value of money on the deferred expenditure.
    Second, while we’re waiting, the world can change. Specifically, the value of
    the operating assets we intend to acquire may change. If their value goes up,
    we haven’t missed out; we can still acquire them simply by making the investment
    (exercising our option). If their value goes down, we might decide not to acquire
    them. That also is fine (very good, in fact) because, by waiting, we avoid making
    what would have turned out to be a poor investment. We have preserved the'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'ability to participate in good outcomes and insulated ourselves from some bad
    ones.

    For both of these reasons, being able to defer the investment decision is valuable.
    Traditional NPV misses the extra value associated with deferral because it assumes
    the decision cannot be deferred. In contrast, option pricing *presumes* the ability
    to defer and provides a way to quantify the value of deferring. So to value the
    investment, we need to develop new metrics that capture these extra sources of
    value.


    # Real option pricing methods


    In their book *Investment Under Uncertainty*, Dixit and Pindyck (1994) use a simple
    example to illustrate the difference between NPV and option pricing methods.


    Suppose you are deciding whether to invest $1600 in a new project that makes widgets.
    The cash flow per widget is $200 but will change to either $300 or $100 at the
    end of the year with equal probability. After that it will stay at its new level
    forever. Note that the expected future cash flow is $200, the weighted average
    of the risky outcomes, $300 and $100. The cost of capital is 10%. Assuming that
    one widget can be sold immediately, and one per year thereafter, the net present
    value of the project would be estimated as follows:


    NPV = MAX [ - 1600 + Σ_{t=0}^{∞} , 0 ] 200 / (1.1)^t

    = MAX [ (-1600 + 2200), 0 ]

    = 600


    The NPV approach discounts the expected project cash flow at the weighted average
    cost of capital. The decision rule is to take the maximum of the discounted expected
    cash flows or zero (meaning don''t do the project). The NPV rule is the maximum
    (determined today) of the expected values. It also makes the implicit assumption
    that the project should be undertaken immediately or not at all, because the maximum
    must be decided right now. This assumption rules out the possibility of deferring
    the investment one year until the uncertainty about the price per widget is resolved.
    If we look at the project given the option to defer, the economics look better:'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Option value = [0.5 MAX( (-1600/1.1) Σ_{t=1}^{∞} + 300/(1.1)^t ), 0] + [0.5
    MAX( (-1600/1.1) Σ_{t=1}^{∞} + 100/(1.1)^t ), 0] = 0.5 MAX( (-1600 + 3300)/1.1,
    0) + 0.5 MAX( (-1600 + 1100)/1.1, 0) = 0.5 (1700/1.1) + 0.5(0) = 7.33


    With the option to defer you can wait one period to invest, then decide whether
    to do so, based on the arrival of information about the long-term cash flow per
    widget. If the cash flow is only 100 per unit you will not exercise the option
    to invest, but if the cash flow is 300 per unit, you will. Although the NPV of
    investing immediately is $600, the NPV should you decide to defer is even higher
    at $733. Therefore you will defer.


    The value of this call option (with an exercise price of $1600, a one-year life,
    a variance determined by the cash-flow spread of $200 per unit, and an underlying
    risky asset that has a value without flexibility of $600) is the difference between
    the value of the project with flexibility and its value without flexibility, $733
    – $600 = $133. Note also that the NPV is the maximum, decided today, of the expected
    discounted cash flows or zero, while the option value is the expected value of
    the maximums, decided when information arrives, of the discounted cash flows in
    each future state of nature, or zero:


    NPV = MAX_{t=0} ( Expected cash flows / Cost of capital ), 0


    Option value = Expected [ MAX_{t=t} ( Cash flow given info / Cost of capital ),
    0 ]'
