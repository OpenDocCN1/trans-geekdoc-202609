  md: '‘pure’ Internet companies. These companies did not exist before the Internet,
    their whole business model is built around the Internet, and all their revenues
    derive from transactions on the Internet.


    +   - Bricks-and-mortar companies: These are traditional companies that are successfully
    changing their business model to seize the opportunities offered by the Internet.
    Examples include companies such as Federal Express and Disney. Federal Express
    has totally redesigned its business processes so that 60% of its shipments are
    fully ordered, tracked and managed via the Internet.

    +   - Internet technology companies: These companies make the switches, routers,
    modems, software and other technology critical to the Internet’s operation. A
    good example of such a company is Cisco Systems.


    Overall, Internet stocks can be stocks in a company that falls within any of the
    above three categories. However, the main bulk of the recent Internet stock craze
    took place with stocks that fell under the ‘pure’ category, and throughout this
    book reference to an Internet stock will normally be referring to a stock in a
    company that can be described as a ‘pure’ Internet company. There are of course
    many exceptions, with companies that occur in the other two categories.


    # Developments in information technology


    The transistor, the basis for modern computers, was discovered in 1947. Computing
    and communications have developed enormously over the subsequent 50-plus years.
    The increase in computing power – measured over three decades – followed Moore’s
    law, named after Gordon Moore, co-founder of Intel, the world’s leading maker
    of computer chips. In 1965 Moore forecast that computing power would double every
    18 months to 2 years. This meant, for example, that between 1960 and 1990 the
    cost of a unit of computing fell by 99%. Computer power is now 8000 times less
    expensive than it was 30 years ago. As Bill Gates, the founder of Microsoft famously
    commented, ‘If we had similar progress in automotive technology, today you could
    buy a Lexus for about $2, it would travel at the'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'speed of sound and travel for about 600 miles on a thimble-full of gas.’


    Computing technology has been one of the main drivers of the convergence; the
    other is the rapid development of fibre-optic and wireless technologies, both
    satellite and land-based. While computer technology provides processing power
    and the means of routing signals along the appropriate communication ‘roads’,
    these roads are increasingly fibre-optic and wireless. Fibre-optic cables are
    made from filaments of glass fibres, each only the thickness of a human hair and
    from glass that is so pure that a sheet 70 miles thick would be as clear as a
    windowpane. The filaments carry the bits as very small pulses of light. Fibre-optic
    and satellite channels support the revolution in communications because they provide
    what is termed broad bandwidth. Bandwidth refers to the number of bits per second
    (bps) that can pass through a channel.


    There is a comparable law to Moore’s for fibre-optics – currently, bandwidth is
    tripling every year. This is known as Gilder’s law and is discussed further below.
    In addition, there is Metcalfe’s law, promulgated by Robert Metcalfe, who founded
    3Com, the US networking equipment manufacturer: ‘The value of a network is proportional
    to the square of the number of nodes in the network’, again discussed below.


    # Moore’s law: the processing power of microchips


    Data transmission costs and computing costs are plummeting. Why is this important?


    One of the chief enablers of the New Economy is instantaneous global communications:
    the ability to easily send and receive data – everything from documents to video
    and multimedia – inexpensively. One measure of progress in that direction is the
    cost of data transmission. The cost to transmit one bit of data over a kilometre
    of fibre-optic cable declined by three orders of magnitude between the mid-1970s
    and the beginning of the 1990s, allowing more data to be transmitted over longer
    distances at lower prices.


    Technologies for transmitting data are also getting more and more powerful. For
    example, technology recently developed by Lucent transmits 3.2 terabits – which
    is approximately equal to 90 000 volumes of an encyclopaedia – per second.


    Computing costs continue to fall. In a 1965 speech, Intel chairman (now emeritus)
    Gordon Moore made a famous observation: With price kept constant, the processing
    power of'
