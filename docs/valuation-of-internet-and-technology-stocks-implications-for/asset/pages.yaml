- pgno: 24
  md: 'The idea that these achievements have really transformed our lives does, however,
    have its critics. Gordon (1998b), a leading New Economy sceptic, argues that computers
    pale in comparison to earlier technological advances like electricity, the internal
    combustion engine, or biotechnology. Gordon argues that computers may not be exceptionally
    productive since they primarily redistribute output, not create it. By this Gordon
    means that computers may increase the utility of workers by providing better working
    conditions, which would include computer games, or they create output that is
    unvalued by customers, fancy fonts being one example.


    # An increase in factor utilization


    This is seen most clearly in the decline in the concept of the Non-Accelerating
    Inflation Rate of Unemployment (NAIRU), a principle first defined by Modigliani
    and Papademos (1975). Many economists (for example, Meyer, 1997) subscribe to
    the view that there is some threshold level of the unemployment rate at which
    supply and demand are balanced in the labour market (and perhaps in the product
    market as well). This balance yields a constant inflation rate. So NAIRU is that
    rate of unemployment which can be sustained without a change in the inflation
    rate. If the unemployment rate falls below this threshold level (NAIRU), inflation
    tends to rise progressively over time. The US unemployment rate in the late 1990s
    was widely believed to be below this threshold; hence the puzzlement at the low
    inflation rate.


    A possible explanation of this failure of inflation to rise in the face of strong
    GDP growth and low unemployment is that the NAIRU had declined; that is, the level
    of the unemployment rate at which the supply of and demand for labour are in balance
    may be lower than it used to be. The argument, expressed, for example, by Fed
    Chairman Alan Greenspan (1997), that technological change has added to workers''
    insecurity in recent years and made them less willing to push for higher wages,
    may be thought of as one version of this explanation. Greater insecurity might
    reduce the upward pressure on wage rates at any unemployment rate and so lower
    the threshold rate at which wages (and prices) would begin to move upward. The
    reason why intensification of product market competition should lower the level
    of NAIRU could be due to the effect of the Internet and to the globalization of
    world markets (discussed below).'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Wadhwani (2000) has demonstrated that the effect of the Internet in the retail
    market should be to lower prices because:


    +   - lower search costs should lead to lower prices

    +   - lower market entry costs will limit the price premiums sustainable by existing
    market participants, by increasing actual or potential competition

    +   - by shortening the supply chain, distribution and inventory cost will be
    lower.


    Estimates of NAIRU suggest that the low level of unemployment over the past few
    years should have produced a fairly significant acceleration in prices, yet inflation
    has continued to decline. Some, like Robert Gordon (1997) and Staiger, Stock,
    and Watson (1997), take this occurrence as evidence that the NAIRU has declined.
    Others argue that special factors, such as movements of employee health coverage
    to health maintenance organizations, have temporarily masked the increase in inflation.
    Another often cited explanation for the surprisingly good inflation performance
    of the late 1990s concerns the increasing sensitivity of the US economy to foreign
    economic conditions. Since capacity utilization abroad has been slack in recent
    years, it is argued, US inflation has remained mild. This is due, it is further
    argued, to the globalization of the world economy, to which we now turn.


    # Globalization of the world economy


    ‘Globalization’ in its economic aspect refers to the increasing integration of
    economies around the world, particularly through trade and financial flows. The
    term sometimes also refers to the movement of people (labour) and knowledge (technology)
    across international borders.


    Increasing and unprecedented globalization, driven partly by technological change
    and partly by the deliberate removal of government-created barriers to the international
    movement of goods, services, people, financial capital, enterprises and ideas,
    has transformed the international and domestic competitive environments.


    At its most basic, there is nothing mysterious about globalization. The term has
    come into common usage since the 1980s, reflecting technological advances that
    have made it easier and'
