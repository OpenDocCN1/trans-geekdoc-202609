  md: '+   - analysts’ short-term forecasts plus an estimated medium-term growth rate
    to maturity, and

    +   - a total market size and estimated company market share (at maturity) approach.


    # Step Three: Estimate forward price to sales multiple


    A key element in determining the forward price to sales multiple is the estimated
    net margin. Again, this is a difficult driver to forecast but is also an essential
    component of the valuation about which a view must be taken. The margin must be
    post-tax and a realistic estimate of the long-term profit opportunities for the
    business. Key factors to consider in this are the nature of the products and services,
    the quality of business model, barriers to entry, brand name, etc.


    # Step Four: Apply the investor’s required rate of return


    This is likely to be relatively high for most technology stocks since this reflects
    the required return of investors over the period where there is greatest uncertainty.


    # Discounted cash flow (DCF)


    As we discussed in Chapter 6, there are two main problems with the standard DCF
    approach.


    First, the limited explicit forecast period fails to capture all the high growth.
    Many growth stocks were priced on the assumption that a premium growth rate can
    be maintained for longer than, say, a five-year explicit forecast. This means
    that the growth rate in the terminal value calculation has to be a quasi-average
    of continuing high growth for a limited period plus the real long-term growth;
    in other words, a number almost impossible to estimate.


    Second, the final-year forecast cash flow is a poor basis for measuring terminal
    value. In traditional two-stage DCF models, typically 70–80% of value is inherent
    in the terminal value calculation, whereas for growth stocks this is usually well
    over 90%. For technology stocks it is not uncommon for more than 100% of value
    to be in the terminal value (the cash flows in the explicit forecast period are
    negative).


    Since the terminal value is based upon the cash flow in the final year of the
    explicit forecast period, this becomes the critical figure in the valuation. However,
    because a technology company has probably not reached maturity at this time the'
