- pgno: 194
  md: 'The two methods use information quite differently. NPV forces a decision based
    on today''s expectation of future information, while option valuation allows the
    flexibility of making decisions in the future contingent on the arrival of information.
    Option-pricing methods capture the value of flexibility while NPV does not. So
    the real options approach formalizes and captures in a mathematical sense what
    is already reflected in valuations in a more subjective way. Analysts and investors
    recognize that flexibility – the ability to react to changing circumstances and
    new information – is linked to value. That premium is effectively the option value.


    # Types of real options


    There are many types of real options and methods of classifying them. The categories
    below are designed to capture the key sources of option value in businesses. Three
    real options are discussed below: scale, scope and timing options.


    # Scale (growth) options


    Scale or growth options represent the value inherent in future investment opportunities
    that expand existing business operations. Once a company is committed to a new
    investment then the growth option value disappears (although this may be replaced
    by other options such as the option to abandon or curtail operations) and the
    value of the investment opportunity is simply the expected present value of the
    investment cash flows.


    Growth options need to be differentiated from growth opportunities. Many growth
    opportunities do not have any option value since there may be significant upfront
    commitment and little in the way of learning benefits. In this case, the value
    of the growth opportunity is simply the expected NPV. Growth options are more
    valuable since they give a company the opportunity to use flexibility in their
    operations to benefit from uncertainty.


    # Scope options


    These are the options available to companies that enter new markets, develop new
    business models and reinvent themselves. Although growth options are difficult
    to identify and value, scope options are even more difficult. Clearly there is
    a value inherent in the possibility that a company with an'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'existing position in a market, a valuable customer base, and so on, will be
    in a better position than others to take advantage of new business opportunities.
    These opportunities are most prevalent in a sector where there is rapid development
    through technological change – the Internet being an obvious illustration of these
    conditions.


    In addition to the effects of technological change, the reason why scope options
    are particularly important for Internet stocks is that their value is much more
    dependent upon information. Established Internet companies derive vast quantities
    of data from the on-line activities of their customers and this, when managed
    effectively, should reduce the risks inherent in new business activities.


    # Timing options


    Flexibility, and the ability to react appropriately as a company learns from new
    information acquired, is the key to realizing real option value. A timing option
    arises where a company can use information to time the entry into a new venture
    (or the exit from an activity) to best effect.


    # The link between real options and DCF


    It is very important to remember that the assumptions and inputs in a real options
    valuation include all those necessary for a discounted cash flow valuation plus
    several others. Real options methodology is inevitably more difficult to apply
    in the real world than DCF.


    In many cases, although investment opportunities have intrinsic (or more correctly
    forward) value, they nevertheless have little or no option value. The time value
    of the option is zero. There are three main circumstances where this applies.


    # (1) The investment opportunity is significantly ‘in the money’


    If an investment opportunity is expected to be highly profitable and the chance
    of it not being so profitable (and of the company being able to curtail the investment
    to avoid loss) is remote, then the options value is likely to be material. This
    effect is easily seen in the equity options market where call options with a strike
    price significantly below the share price essentially trade at their intrinsic
    value (their NPV).'
  merge: -1
  img_proc: true
