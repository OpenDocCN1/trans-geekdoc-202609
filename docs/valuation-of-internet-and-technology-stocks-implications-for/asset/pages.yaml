    # *Forward priced multiple valuation*


    This technique is essentially a combination of the simplicity of a valuation multiple
    with the forward-looking elements of discounted cash flow.


    The mechanics of forward price multiples are relatively simple.


    +   (1) Select a time horizon.

    +   (2) Estimate investors’ required return over that period (the cost of capital).

    +   (3) Then deduct from the current value of the business the present value of
    the cash flows from the valuation date to that time horizon. The result of this
    is the present value of the implied exit value of the business.

    +   (4) Finally, compound this value to obtain the actual implied exit value.

    +   (5) This is then compared with a business activity measure for that future
    period to obtain the forward priced multiple.


    In applying this valuation technique it is useful to apply a forward price to
    sales model and here we set out the steps investors need to go through.


    # **Step One: Identify the period to maturity**


    The model is based upon an assumed level of revenue and deserved price to sales
    multiple at ‘maturity’. Maturity can be freely selected but is intended to be
    several years hence; say, five to ten years. Maturity does not necessarily mean
    the stock is expected to be ex-growth. It is simply that the characteristics in
    terms of growth, margin and return on capital have reached the estimated long-term
    values which it is believed the company can achieve.


    # **Step Two: Forecast revenues at maturity**


    Of course, forecasting revenues several years hence is difficult and speculative,
    but it is a key component in valuing technology stocks. This technique uses two
    approaches to forecasting revenue:'
