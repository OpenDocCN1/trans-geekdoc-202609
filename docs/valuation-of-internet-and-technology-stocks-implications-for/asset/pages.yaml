    # Key issues in valuation of technology stocks


    Some of the key areas complicating the valuation of these stocks were discussed
    in Chapter 6.


    The valuation issues revolve around:


    +   - Profit and cash flow earned today is, for many technology companies, not
    a good predictor of future cash flow generating ability and hence of value. This
    places greater emphasis on other less reliable performance measures and upon speculative
    forecasts.

    +   - Most of the value inherent in these stocks is further out. Near-term cash
    flows are small or negative and the ultimate hoped-for cash flow and value creation
    may not materialize for many years.'
