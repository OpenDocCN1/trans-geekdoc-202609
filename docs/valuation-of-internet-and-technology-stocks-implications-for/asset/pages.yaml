  md: 'a P/E ratio of 20, but show different rates of earnings growth. Company A has
    earnings growth of 20%, while Company B has earnings growth of 5%. Company A''s
    PEG ratio would be 1 (20 divided by 20), whereas Company B would have a PEG of
    4 (20 divided by 5). The lower the PEG ratio, the better the potential value of
    the company. In this example, company A is growing very quickly and could represent
    better potential.


    A PEG of significantly less than 1 is regarded as attractive, so a share with
    a moderate P/E ratio of 15 would need a growth rate of close to 20% a year to
    be a strong buy.


    PEG can only be used for growth stocks. It would be inapplicable for cyclical
    stocks or turnaround situations. When calculating the estimated sustainable growth
    rate in earnings it is expected that these can be sustained for over 5 years.
    So a company with a P/E of 10, for example, growing at 20%, would have a PEG of
    0.5 or half the estimated growth rate. A PEG of less than one, as discussed above,
    usually means that the stock is good value.


    The essential drawback in valuation with all multiples is that they do not take
    account of changes in inflation and interest rates. Increases in interest rates
    will usually cause stock prices to fall, as the real net present value of companies''
    future earnings streams is eroded. Falling interest rates have the opposite effect.


