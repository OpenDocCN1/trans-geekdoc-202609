- pgno: 76
  md: 'referred to as the earnings yield on the stock. Many investors prefer to think
    in terms of the inverse of the earnings yield – called the price/earnings, or
    P/E ratio. The P/E ratio, also called the earnings multiple, measures how many
    times current (or prospective) earnings the market is paying for a stock. The
    P/E ratio is the most popular fundamental variable for valuing both stocks and
    the whole market.


    There are many measures of profit, but a particularly useful definition is earnings
    – the profit after taxes and any other changes that are attributable to ordinary
    shareholders. Earnings are reported by companies on a per share basis, and that
    can be translated by analysts into an earnings yield, to parallel the dividend
    yields, discussed below. As mentioned above, the ratio is presented the other
    way round as the price–earnings ratio. Thus a 5% earnings yield represents a P/E
    ratio of 20.


    So the P/E ratio indicates how many years’ purchase of a company’s earnings are
    reflected in its share price. The higher the ratio the more optimistic investors
    must be about growth in order to pay the market price. Thus growth stocks, most
    recently represented by technology stocks, have been on high P/Es. Stocks on low
    P/Es may represent bargains, but more likely they are stocks facing troubled times.


    # Determinants of the P/E ratio


    What determines the P/E ratio? The P/E ratio can be derived from the dividend
    discount model, discussed earlier.


    Start with Equation 4.1, the estimated price of a stock using the constant growth
    version of the model. We use P₀ to represent estimated price from the model.


    $$P_0 = \frac{D_1}{k-g}$$


    Dividing both sides of Equation 4.1 by expected earnings, E₁, gives us Equation
    4.8.


    $$\frac{P_0/E_1}{ } = \frac{D_1/E_1}{k-g} \qquad \text{Eq 4.8}$$


    Equation 4.8 indicates that those factors that affect the estimated P/E ratio
    are:


    +   1. The dividend pay out ratio, D/E.

    +   2. The required rate of return, k.

    +   3. The expected growth rate of dividends, g.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'The following relationships should then hold, other things being equal:


    +   1. The higher the pay out ratio, the higher the P/E ratio.

    +   2. The higher the expected growth rate, g, the higher the P/E ratio.

    +   3. The higher the required rate of return, k, the lower the P/E ratio.


    It is important to remember the phrase ‘other things being equal’ because usually
    other things are not equal and the preceding relationships do not hold by themselves.
    It is quite obvious, upon reflection, that if a firm could increase its estimated
    P/E ratio, and therefore its market price by simply raising its pay out ratio,
    it would be very tempted to do so. However, such an action would in all likelihood
    reduce future growth prospects, lowering g, and thereby offsetting the increase
    in the pay out ratio. Similarly, trying to increase g by taking on particularly
    risky investment projects would cause investors to demand a higher required rate
    of return, k. Again this would work to offset the positive effects of the increase
    in g.


    Factors 2 and 3 above are typically the most important factors in the determination
    of the P/E ratio because a small change in either can have a large effect on the
    P/E ratio. This is illustrated in Example 4.6.


    # Example 4.6


    Assume that the pay out ratio is 60%. By varying k and g, and therefore changing
    the difference between the two (the denominator in Equation 4.8), investors can
    assess the effect on the P/E ratio as follows:


    Assume k = 0.15 and g = 0.07      P/E = D₁/E₁ / (k − g)


    P/E = 0.60 / (0.15 − 0.07)


    = 0.60 / 0.08 = 7.5


    Now assume k = 0.16 and g = 0.06  P/E = 0.60 / 0.10 = 6'
