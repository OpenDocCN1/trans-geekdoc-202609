    UBS Warburg


    equity option, the investor can decide whether or not to invest (to exercise the
    option or not) up until the final exercise date, at which point it can be observed,
    with certainty, whether exercise is profitable. Action can be modified perfectly
    always to take best advantage of the circumstances faced. Now imagine the option
    holder has to commit to exercising or not when the option is first acquired. Of
    course it is then not an option at all; it is simply a future and would attract
    an option premium. Valuation would be at the present value of the value of the
    investment. Option value critically depends upon the ability to modify strategy,
    i.e. change from exercise to not exercise as appropriate depending on changes
    in circumstances (in the case of the traded equity option, the movements in the
    stock price).


    # (3) Management does not have the ability to react appropriately


    Although there may be the potential of real option value due to the opportunities
    available to a company and the flexibility to react to these, the actual realization
    of this value depends on the ability of management. Only if management is capable
    of recognizing the existence of options and only if they are capable of effectively
    using information to exercise the options appro-'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'priately is a real option premium justified. This is the reason that investors
    are willing to pay more for companies with ‘good management’ in place.


    How does this apply to real corporate investment opportunities? For a future business
    opportunity to have option value (i.e. value in excess of the intrinsic value
    – the expected NPV), there must be the opportunity for the company to modify its
    strategy to the best effect.'
