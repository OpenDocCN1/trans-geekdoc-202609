    # Factors influencing the price of futures


    Traders in any commodity, say a wheat buyer (bread maker), or a wheat seller (wheat
    farmer), fearing wheat price volatility, are anxious to use a cash market hedge
    to hedge wheat price risk. A futures contract is a derivative of this spot market
    hedge. A seller of wheat will not wish the price to fall in the future when a
    sale is anticipated. A buyer of wheat will not wish the price to rise when a purchase
    is anticipated. If an agreement is made to deliver a quantity and grade of wheat
    in 3 months’ time, how might the seller of the wheat arrange affairs so that there
    is no price risk? If they remain in an open position, i.e. not owning the wheat,
    there is no knowing what the price of wheat will be in 3 months’ time. Therefore
    a cash market hedge can be constructed as follows. Wheat will already be held
    or can be purchased at today’s spot price. Take today’s spot price, which is known,
    and add to this the **cost of carrying** the wheat for three months. These carry
    costs will be:'
