    +   - attempting to poach key employees.


    The factors that will lead to high competitive rivalry are:


    +   - *When competitors are roughly of equal size and one competitor decides to
    gain share over the others*, then rivalry increases significantly and profits
    fall. In a market with a dominant company, there may be less rivalry because the
    larger company is often able to stop quickly any move by its smaller competitors.

    +   - *If a market is growing slowly and a company wishes to gain dominance*,
    then by definition it must take its sales from its competitors – increasing rivalry.

    +   - *Where fixed costs of storing finished products in an industry are high*,
    then companies may attempt to gain market share in order to achieve break-even
    or higher levels of profitability.

    +   - *If extra production capacity in an industry comes in large increments*,
    then companies may be tempted to fill that capacity by reducing prices, at least
    temporarily.

    +   - *If it is difficult to differentiate products or services*, then competition
    is essentially price-based and it is difficult to ensure customer loyalty.

    +   - *When it is difficult or expensive to exit from an industry* (perhaps due
    to legislation or redundancy costs or the cost of closing dirty plant), there
    is likely to be excess productive capacity in the industry and thereby increased
    rivalry.

    +   - *If entrants have expressed a determination to achieve a strategic stake
    in that market*, the costs of such an entry would be relatively unimportant when
    related to the total'
