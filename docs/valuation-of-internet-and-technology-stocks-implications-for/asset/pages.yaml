  md: '# What are the lessons for investors from the year 2000 technology stocks collapse?


    The concept of the New Economy, or the ‘new economic paradigm’ as it was sometimes
    referred to, contained a number of distinct strands, some true, some half true,
    and some simply wrong. All these ideas came together in the US economy of the
    second half of the 1990s, as we discussed in Chapter 2. To distinguish what may
    still be true from what we now know to be false, that skein of ideas must be unravelled.


    On analysis, four narrow notions emerged; that the business cycle was dead; that
    capital markets now worked in unprecedented ways; that we were living in an era
    of unique technical progress; and, finally, that information technology had fundamentally
    altered the way the economy works.


    The business cycle is decidedly alive. That should not surprise anybody. Yet the
    view that business cycles were dead rested on several correct presumptions about
    the US economy: labour markets had become more competitive; global competition
    had reduced the pricing power of both trade unions and big business; the need
    for inventories had diminished; and monetary policy was far more credibly oriented
    towards price stability than in the inflationary 1960s and 1970s.


    What this analysis overlooked, however, is that cycles can occur and frequently
    have occurred in flexible economies with credible monetary anchors. All that is
    needed is a big investment expansion fuelled by expanding credit and a strong
    stock market. Indeed, the firmer the belief that the business cycle is'
  merge: -1
  img_proc: true
- pgno: 200
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 201
  md: 'therefore sustainable stock market valuations, ultimately brought all technology
    stocks back down to earth.


    Specifically, there are three economic principles that stock market analysts continuously
    overlooked in the tech stock mania.


    The first is simply the law of supply and demand. In any competitive economy new
    capital will flow into any industry that enjoys very high profits and growth.
    This flow will continue until the risk-adjusted return on capital falls to the
    economy''s normal or average rate. Super-normal profits can be maintained only
    over long periods in markets that are not competitive, where individual companies
    enjoy a large degree of monopoly power. But experience shows that there have been
    few monopolies in technology industries.


    The second economic principle that Silicon Valley is now recognizing, and investors
    ignored at their peril, is the law of diminishing returns. Technology may continue
    to advance as rapidly as ever – for example, the speed of microprocessors is still
    doubling every 18 months – but every new leap in technology is likely to be less
    economically valuable than the one before. Once a computer processor reaches a
    certain power further additions to its speed or its storage capacity will not
    offer much economic value to users. The same is likely to prove true of broadband
    Internet connections and third generation mobile phone services. These will doubtless
    improve services, but will consumers pay large premiums for these improvements
    to services they already regard as satisfactory?


    Many investors believed that the Internet had not only repealed, but also actually
    reversed, the law of diminishing returns. The Internet was supposed to be subject
    to a new ‘network effect’, which asserted that each new addition to the network,
    every new subscriber and every new service, would generate more profit than the
    one before. This was obviously true up to a point, since the Internet, like any
    other business, required a certain critical size to start enjoying the economies
    of mass merchandising and mass production. But once the Internet passed the critical
    point where it became a genuine mass global network, additional subscribers have
    become less wealthy, more price sensitive and less commercially valuable. In short,
    the law of diminishing returns has come back into force.


    The third economic law that investors have started to rediscover is the time value
    of money. Profits in the future are worth far less than cash in the hand today.
    Technology'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'investors habitually talk about the amazing speed of technical and commercial
    change in the Internet world. Yet the way they valued technology stocks assumed
    that revenues and profits would continue to grow without interruption for 20 or
    more years!


    # Recent mistakes must be avoided


    As mentioned above there is no doubt that the computer revolution has infiltrated
    almost every part of the economy, greatly increasing potential efficiency. In
    the US the productivity of labour is probably capable of rising by 2.5% a year,
    compared with 1.5% in recent decades.


    There is good reason to believe that this improvement can be sustained. The doubling
    in complexity of computer chips every 18 months will continue for some time. Communications
    costs will fall further. As happened after the development of electric motors,
    human ingenuity will find new ways to refine and apply these technologies.


    But investors and bankers must avoid two big mistakes of recent years. First,
    they must not expect high technology to translate automatically into high demand.
    The standard investment in mobile phones shows that an extra ingredient is needed:
    the tailoring of technology to real human needs – and they are notoriously unpredictable.


    Second, investors must be under no illusion that high technology will improve
    general profit levels. It will not. The advantage of improved efficiency will
    be eroded by competition. And the race to the winning-post in high-tech investments
    will leave many competitors floundering in the mud.


    # Schumpeter and creative destruction


    All attempts to understand the effects of technological progress on economic growth
    pay homage to Joseph Schumpeter, the Austrian economist discussed in Chapter 2,
    best remembered for his views on the ‘creative destruction’ associated with industrial
    cycles 50–60 years long. Arguably the most radical economist of the twentieth
    century, Schumpeter was the first to challenge classical economics as it sought
    (and still seeks) to optimize existing resources within a stable environment –
    treating any disruption as an external force on a par with plagues, politics and
    the weather. Into this intellectual drawing room, Schumpeter introduced the raucous
    entrepreneur and'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'his rumbustious behaviour. As Schumpeter saw it, a normal healthy economy was
    not one in equilibrium, but one that was constantly being ‘disrupted’ by technological
    innovation.


    But will the market forget these simple laws of economics? It is wise to remember
    the words of Alan Greenspan, Chairman of the Federal Reserve, speaking in early
    2000:


    > History tells us that sharp reversals in confidence happen abruptly, most often
    with little advance notice . . . Claims on far distant future values are discounted
    to insignificance. What is so intriguing is that this type of behaviour has characterized
    human interaction with little appreciable difference over the generations. Whether
    Dutch tulip bulbs or Russian equities, the market price patterns remain much the
    same.'
