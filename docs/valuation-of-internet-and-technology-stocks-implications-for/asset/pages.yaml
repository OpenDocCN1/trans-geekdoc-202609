- pgno: 73
  md: 'and the short run was best described by John Maynard Keynes when he wrote in
    1936:


    > most of these [professional investors and speculators] are, in fact, largely
    concerned, not with making superior long-term forecasts of the probable yield
    of an investment over its whole life, but with foreseeing changes in the conventional
    basis of valuation a short time ahead of the public. They are concerned, not with
    what an investment is really worth to a man who buys it ''for keeps'', but with
    what the market will value it at, under the influence of mass psychology, three
    months or a year hence.


    The game of forecasting future investor sentiment is difficult and deters many
    from investing in stocks. But, you need not forecast market sentiment in order
    to profit by investing in stocks. Although investment advice geared to the short
    run hinges on predicting the judgement of other investors, in the long run one
    can ride out the waves of investor sentiment and profit from your own predictions.
    Investing for the long run does however necessitate, first, a knowledge of stock
    market history and secondly, the ability to apply some suitable stock valuation
    models.


    So we need to know some stock market history, and given that background we must
    then ask whether there are any other stock valuation models available which would
    enable us to compare our results with those of the capitalization of income method
    already discussed. So does history tell us anything about the long run performance
    of US stock markets?


    # What do we know about US stock market history?


    When predicting future returns on the market, the price-to-earnings (P/E) ratio
    and the dividend yield, compared to historical standards, are the most frequently
    cited criteria for judging the valuation of the stock market.


    Table 4.2 displays the dividends and earnings yield on stocks represented by the
    US S&P 500 Index for the period 1871–1994. It can be seen that the average historical
    earnings yield during this period is 8.1%, giving an average price/earnings ratio
    of 13.6. This means that investors priced stocks on average at about 12 to 15
    times their annual earnings. Despite the stability of the average, the P/E ratio
    for the period has shown considerable annual variation, ranging from a high of
    27 in 1894 to a low of 6 in 1950. (It should be noted that P/E ratios have been
    around 30 towards the end of the last millennium and the beginning of the new
    one.)'
