- pgno: 11
  md: '# Preface


    # The collapse of Internet and technology stocks


    It was a bubble, and it did burst. About that most people agree. The history books
    will record 10 March 2000 as one of the most tumultuous days ever to engulf the
    stock market. In a matter of hours billions of dollars were wiped from stock markets
    all over the world, as the technology bubble finally burst.


    America’s Nasdaq index, made up largely of technology firms, collapsed into what
    many believe to be the biggest stock market crash of all time. The Nasdaq Stock
    Market smoothly rose six-fold to a record high over the five years ending 10 March
    2000, before collapsing. This was not the first time stock prices have been driven
    by waves of ‘irrational exuberance’ rising to dizzy heights and falling back accordingly.


    ‘Stock prices have reached what looks like a permanently high plateau,’ declared
    the eminent Yale economist Irving Fisher in the autumn of 1929. A few weeks after
    this oracular pronouncement, the Dow Jones Industrial Average had declined by
    more than a third. The worst was still to come. On 8 July 1932, the Dow Jones
    closed at 41.88, a drop of nearly 90% from its 1929 peak. The stock market chart
    of these years resembles a precipice rather than a plateau.


    Why did Professor Fisher get things so wrong? The answer is that he had fallen
    for the decade’s most alluring idea, a thesis which underpinned the great bull
    market of the late 1920s: he believed that America had entered a new era of limitless
    prosperity.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Investors trying to make sense of the dot.com debacle might do well to recall
    the story of William C. Durant. Early in the twentieth century, Mr Durant founded
    General Motors Corporation, one of a revolutionary group of automakers that in
    some ways were the dot.com companies of their era. Investment capital poured in
    and GM stock grew by leaps and bounds from 1914 to 1920. But when the overcrowded
    automobile industry failed to deliver on inflated expectations in the early 1920s,
    auto stocks plunged. GM lost two-thirds of its stock value in six months. A panicked
    Mr Durant borrowed money and feverishly bought the shares in a futile attempt
    to prop them up.


    GM, of course, eventually recovered and soared again – too late for its founder,
    who lost his entire fortune and wound up running a bowling alley. Many other once-great
    auto companies, such as Packard, Studebaker and Hudson, fared less well than GM,
    disappearing one by one in the ensuing decades.


    The current technology stocks boom and bust, it turns out, is nothing new. It
    is simply the latest in a long history of investment bubbles that have plagued
    shareholders since investing began. From the Dutch tulip bulb craze of the seventeenth
    century, to the locomotive revolution of the nineteenth century, to the rise,
    fall and resurrection of personal computer stocks and biotechnology stocks in
    the 1980s and 1990s, investors have fallen madly in love with – and then madly
    out of love with – the hot technology of the moment.


    History does not suggest that, eventually, many of the pieces of a burst stock
    bubble get patched back together. Some of the stocks will soar again. But the
    recovery typically takes longer than investors hope – usually years, not months.
    Many of the stocks caught up in the bubble will fail to survive, and of those
    that do survive, all but the most robust will wind up behaving less exuberantly
    than they did before.


    This text does not claim to provide any message with respect to when or if the
    year 2000 technology stock market collapse marks the beginning or the end of any
    new phase of economic/stock market activity. However, the whole momentum of this
    latest boom–bust phenomenon has opened up many intriguing technology-related conceptual
    questions for economists, accountants and government policy makers, to highlight
    just three groups in society. These are questions to which there are no clear
    answers. In this text I have tried to take readers on a voyage of discovery through
    the intricacies of many of these issues. Enjoy the trip!'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# The age of information

    and the democratization of

    data


    > Is it possible that there is something fundamentally new about this current
    period that would warrant complacency? Yes, it is possible . . . but regrettably
    history is strewn with visions of such ‘new eras’ that, in the end, have proven
    to be a mirage. In short, history counsels caution.

    > (Alan Greenspan, February 1997)


    This book is about the valuation of technology stocks whose ultimate value is
    linked to the growth of the Internet and the World Wide Web. It is of course written
    at a time when many of the so-called dot.coms have collapsed in price. It nevertheless
    remains the case that the ultimate value of many of these stocks revolves around
    the valuation of intangible assets, assets that by definition are not easy to
    value. However, I do not share the investment viewpoint that ‘if you can’t value
    them . . . you shouldn’t buy them’, and this book sets out an approach to the
    valuation of technology stocks. It’s a long road, travelling through economic
    history, rapid technological change, speculative stock market bubbles and the
    bursting of the same, changes in accounting methodology and the mass psychology
    of investors, to choose just some of the chapter contents.


    To put recent trends into a historical framework, it is useful first to look back
    in time.'
