- pgno: 57
  md: '# The required rate of return


    An investor who is considering the purchase of a common stock must assess its
    risk and, given its risk, the *minimum expected rate of return* that will be required
    to induce the investor to make the purchase. This minimum expected return, or
    *required rate of return*, is an opportunity cost.


    The required rate of return, capitalization rate and discount rate are interchangeable
    terms in valuation analysis. While in theory we know what this variable is, in
    practice it is not easy to determine the precise number to use. Because of this
    complexity, we will generally assume that we know the capitalization rate and
    concentrate here on the other issues involved in the valuation of stocks.


    # The expected cash flows


    The other component that goes into the present value framework is the expected
    stream of cash flows. The value of common stock is the present value of all the
    cash flows to be received from the issuer. The questions that then arise are as
    follows:


    +   1. What are the cash flows to use in valuing a stock?

    +   2. What are the expected amounts of the cash flows?

    +   3. When will the expected cash flows be received?


    Stockholders may plan to sell their shares at some time in the future, resulting
    in a cash flow from the sales price. As shown later, however, even if investors
    think of the total cash flows from common stocks as a combination of dividends
    and a future price at which the stock can be sold, this is equivalent to using
    the stream of all dividends to be received on the stock as the key valuation principle.


    What about earnings? Are they important? Can they be used in valuing a stock?
    The answer to both questions is a clear Yes. Dividends are paid out of earnings,
    so earnings are clearly important. The second stock valuation approach, fundamental
    analysis, to be considered later, uses earnings and a P/E ratio to determine intrinsic
    value. Therefore, earnings are an important part of fundamental analysis: in fact,
    earnings receive more attention from investors than any other single variable.


    If all earnings are paid out as dividends, they will be accounted for as dividends.
    If the company retains earnings they presumably will be reinvested, thereby enhancing
    future'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'earnings and, ultimately, dividends. The present value analysis should not
    count the earnings reinvested currently and also count them again paid later as
    dividends. If they are properly defined and separated, these two variables produce
    the same results. This means that more than one present value model is possible.
    However, it is always correct to use dividends in the present value analysis,
    and this is what is almost always done when investors use the present value approach
    to stock valuation.


    Because dividends are the only cash flow stream to be received directly by investors
    under normal conditions, it is appropriate to have a stock valuation model based
    on dividends. It is now important to consider such a model, the dividend discount
    model, which is the basis for understanding the fundamental valuation of common
    stocks.


    # ## The dividend discount model (DDM)


    Since dividends are the only cash payment a stockholder receives directly from
    a firm, *they provide the foundation of valuation for common stocks*. Applying
    Equation 4.1 specifically to value common stocks, the cash flows are the dividends
    *expected* to be paid in each future period. An investor or analyst using this
    approach carefully studies the future prospects for a company and estimates the
    likely dividends to be paid. In addition, the analyst estimates an appropriate
    required rate of return or discount rate based on the risk foreseen in the dividends,
    taking account of the alternatives available. Finally, the investor would discount
    to the present the entire stream of estimated future dividends, properly identified
    as to amount and timing.


    Equation 4.1 adapted for common stocks where dividends are the cash flows results
    in Equation 4.2. This equation, known as the dividend discount model (DDM), states
    that the value of a stock today is the discounted value of all future dividends:


    $$\hat{P}_{cs}=\frac{D_1}{(1+k_{cs})}+\frac{D_2}{(1+k_{cs})^2}+\frac{D_3}{(1+k_{cs})^3}+\frac{D_{\infty}}{(1+k_{cs})^{\infty}}$$


