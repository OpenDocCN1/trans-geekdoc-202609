  img_proc: true
- pgno: 112
  md: 'doing business? The balance sheet statement is silent about these and other
    components of business upon which businesses depend for future earnings.


    # Types of intangible assets


    Many businesses have intangible assets, and no list could ever be complete given
    that intangibles can be unique to a specific business. Some, however, are fairly
    common and can be found in many businesses. These more common intangibles include:


    +   - **Proprietary lists:** Proprietary lists can include customer or client
    lists, patent lists or even mailing lists, whether they are made up of customers
    or prospects. Lists can be especially valuable to a business if the relationships
    they represent are ongoing. Consider, for example, a magazine’s list of advertisers.
    The magazine may get 75% of its advertising revenue from the companies on that
    list. Therefore, the list is critical to the magazine’s future profitability.

    +   - **Beneficial contracts:** Long-term contracts can add value to a company.
    For instance, a company may have a contract that allows it to sell its product
    or service for a higher-than-normal mark-up. Or it may have a contract that allows
    it to purchase or lease items at a below-market rate.

    +   - **Patents and applications for patents:** How much the patents are worth
    depends on the strength of the patent claim (which can be difficult to determine
    if the patent hasn’t withstood litigation), and the patent’s economic and legal
    life.

    +   - **Copyrights:** Copyrights are trickier to value than patents because, while
    they may have a long legal life, their practical value may only be for a short
    period. This is especially true for technical works that become dated quickly.
    The value of a copyright also depends on the author’s previous success.

    +   - **Trademarks and brand names:** If a brand name or trademark enables a company
    to sell its products for a higher price or in greater quantity than its competition,
    it has value.

    +   - **Subscriptions and service contracts:** Subscriptions are especially important
    for newspapers, magazines and cable companies because a large portion of their
    revenues is based on subscriptions. With both subscriptions and service contracts,
    the longer they have been in effect, the more they are worth.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   - **Franchise agreements:** Franchises with long track records and well-recognized
    names have significant value over newer, lesser known franchises. This is especially
    true in some industries (such as the hotel industry) that are dominated by franchises.

    +   - **Software:** Many companies have developed proprietary software specific
    to their businesses. If this software provides efficiencies and benefits that
    the business wouldn''t have without the software, it is a separate asset.

    +   - **Goodwill:** Goodwill means many things to many people, but generally it
    refers to intangibles like reputation and location that lead to repeat business.


    # Methods for valuing intangible assets


    Valuing intangible assets can be done using one of three basic methods: cost of
    creation, capitalization of income or savings, or discounted cash flow. Rule-of-thumb
    formulas do exist for some assets in some industries but are better for providing
    an estimate of value to be compared with the value determined by the other methods.


    # Cost of creation


    The cost of creation method of valuing intangible assets relies on calculating
    what it would cost another business to duplicate a given asset today. This method
    does not measure an asset''s future impact on profits; it merely looks at what
    it would cost to create the asset from scratch at a particular point in time.


    Assets that may be valued using the cost of creation method include:


    +   - Internal software

    +   - Patents

    +   - Trademarks

    +   - Copyrights

    +   - Subscriptions

    +   - Customer lists

    +   - Service contracts


    # Capitalization of income or savings method


    The capitalization method measures the future benefits intangible assets will
    bring to a company, identifies when those'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'benefits will be generated and determines for how long. The capitalization
    rates used in this method should reflect the risk associated with the intangible
    asset being valued.


    In addition to the income an intangible asset may bring to a company, the benefits
    may also include savings to the company as a result of owning the asset, or not
    having to pay a royalty to someone else who owns the asset or of efficiencies
    generated by the asset.


    Intangible assets that this technique is suited to include:


    +   - Trade names

    +   - Customer lists

    +   - Commercial software

    +   - Patents

    +   - Trademarks

    +   - Brand names


    The capitalization method works well for all of these assets when they are relatively
    new. As they come closer to the end of their economic usefulness, however, other
    methods of valuing them may become more appropriate.


    # Discounted cash flow


    The discounted cash flow method is good for assets with predictable life spans
    and future financial benefits, including:


    +   - Contracts (current and future yearly benefits)

    +   - Subscriptions and service contracts

    +   - Patent royalties


    # Methodology issues in technology stock valuations


    Accounting issues are always important in stock valuation, particularly where
    valuations are based upon multiples of income statement data. We discuss the role
    of applying the concept of multiples in more detail in Chapters 8 and 9. The common
    accounting problems such as goodwill, stock options, in-process research and development,
    and pooling versus purchase accounting are all relevant to Internet and technology'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'stocks as well as to other companies. However, these issues are reasonably
    well understood.


    One of the features of multiple comparisons today is the use of measures from
    higher up in the income statement, such as cash earnings or EBITDA. The purpose
    of this is to mitigate the comparability problems caused by accounting differences
    through the elimination of goodwill amortization and depreciation, the accounting
    treatment of which can vary considerably, most especially where cross-border comparisons
    are involved. Indeed, this desire to eliminate accounting distortions sometimes
    leads to investors focusing on top-line revenue through price/sales or Enterprise
    Value/sales multiples. However, this often does not seem to work very well for
    technology and Internet stocks, partly due to accounting problems.


    In most industries, the revenue line is regarded as being relatively clean of
    accounting distortions. This is not so for technology and Internet stocks, since
    the recognition of revenue is one of the most problematic areas and, because of
    rapid growth, this can lead to vastly different reported revenue. Given the importance
    of sales multiples in technology and Internet valuation, these accounting issues
    assume great importance.


    The accounting issues for Internet and technology stocks set out in Appendix 6.1
    generally relate to the classification and timing of revenues and expenses. Implementation
    of the regulatory guidance on gross versus net revenues, barter transactions,
    sales incentives and upfront fees would generally result in lower revenues (or
    delayed revenues in the case of upfront fees).'
