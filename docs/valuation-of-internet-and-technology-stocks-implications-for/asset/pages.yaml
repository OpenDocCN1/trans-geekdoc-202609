  md: '# Box 10.1 Derivatives defined


    **Forward contract:** A contract to buy or sell a specified amount of a designated
    commodity, currency, security, or financial instrument at a known date in the
    future and at a price set at the time the contract is made. Forward contracts
    are negotiated between the contracting parties and are not traded on organized
    exchanges.


    **Futures contract:** A contract to buy or sell a specified amount of a designated
    commodity, currency, security, or financial instrument at a known date in the
    future and at a price set at the time the contract is made. Futures contracts
    are traded on organized exchanges and are thus standardized. The contracts are
    marked to market daily, with profits and losses settled in cash at the end of
    the trading day.


    **Option contract:** A contract that gives its owner the right, but not the obligation,
    to buy or sell a specified asset at a stipulated price, called the strike or exercise
    price. Contracts that give owners the right to buy are referred to as call options
    and contracts that give the owner the right to sell are called put options. Options
    include both standardized products that trade on organized exchanges and customized
    contracts between private parties.


    **Swap contract:** A private contract between two parties to exchange cash flows
    in the future according to some prearranged formula. The most common type of swap
    is the ‘plain vanilla’ interest rate swap, in which the first party agrees to
    pay the second party cash flows equal to interest at a predetermined fixed rate
    on a notional principal. The second party agrees to pay the first party cash flows
    equal to interest at a floating rate on the same notional principal. Both payment
    streams are denominated in the same currency. Another common type of swap is the
    currency swap. This contract calls for the counterparties to exchange specific
    amounts of two different currencies at the outset, which are repaid over time
    according to a prearranged formula that reflects amortization and interest payments.'
  merge: -1
  img_proc: true
