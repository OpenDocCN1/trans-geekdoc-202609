  md: '# How are options priced?


    The method used to price options depends on the type of option being priced. As
    can be seen from Table 10.2, the two pricing models are the binomial model used
    for American options, which was designed by Cox, Ross and Rubinstein, and the
    Black–Scholes option pricing model, used for pricing European options. As we show
    below, the binomial model can also be used to price European options.


    Table 10.2 European versus American options


    | Type of option | Exercise date | Pricing model |

    |---|---|---|

    | American option | Any time up to maturity | Cox, Rubinstein and Ross |

    | European option | At maturity date | Black–Scholes |


    The key to valuing options is to design a risk-free portfolio in which the value
    does not change when there is a change in the underlying asset. This risk-free
    element is achieved by designing a portfolio which replicates, i.e. one in which
