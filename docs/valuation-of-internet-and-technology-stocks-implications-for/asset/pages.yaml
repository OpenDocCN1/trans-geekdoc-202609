  md: '# **Table 5.1**  Key features of the Internet for business


    | Key feature | Implication |

    |---|---|

    | Availability | ‘Normal’ business hours time constraints do not exist any more
    with on-line, 24-hour per day and immediate access |

    | Ubiquity | For most companies and customers there is no reason not to have Internet
    access – so assume that in the near future most will have it, just as we now assume
    that they have a phone and a fax |

    | Global | With no physical borders for access (but not always for delivery),
    our mental map of what is ‘near’ and ‘far’ will radically change |

    | Local | Paradoxically, the Internet not only enables global commerce, but is
    also a perfect vehicle to reinforce local physical presence and local person-to-person
    business relationships |

    | Digitization | The real business will increasingly be happening in information
    space, even for physical products. Convergence is leading to the shake-up of major
    industries such as telecommunications and broadcasting, as well as different thinking
    about the ‘natural’ laws of economics, e.g. increasing rather than decreasing
    returns to scale |

    | Multimedia | A long-awaited combination of technologies is finally coming to
    business, not only to gain a competitive edge in information provision during
    buying and selling but also to provide completely new opportunities in consultancy,
    design and entertainment in combination with interactivity and networking |

    | Interactivity | Interactivity is a challenge, namely to overcome the virtuality
    of the business relationship, as well as an opportunity for greatly improving
    traditional customer service at an affordable price |

    | One-to-one | Based on data processing and customer profiling, possibly based
    on enriched interactivity, one-to-one marketing is a natural companion of doing
    business on the Internet. It may also be a necessity to overcome the anonymity
    of Internet business relationships |

    | Network effects and network externalities | Low cost and fast growth in the
    number of relationships enable business models that require a significant number
    of parties in the network and whose benefits increase faster with a growing number
    of parties. That is, these business models exhibit network effects and/or network
    externalities. Examples are implementations of open market concepts such as virtual
    communities and third-party market places |

    | Integration | It has long been argued and to some extent demonstrated that the
    value of combined information across steps of the value chain is more than the
    sum of its parts. The Internet now provides at least part of the technology for
    value chain functional and information integration. Advanced electronic commerce
    companies show how to exploit the added value |


    *Source:* Timmets, 1999'
