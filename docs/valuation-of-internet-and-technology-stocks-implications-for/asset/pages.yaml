- pgno: 36
  md: '# Technology and the Internet economy: what made it all happen?


    The story of the Internet and the World Wide Web revolves around one man, Tim
    Berners Lee. There are three defining features of the World Wide Web and we come
    back to these later in this chapter. These are:


    +   - the Uniform Resource Locator (URL), which forms its addresses;

    +   - the Hypertext Transfer Protocol (HTTP), which allows hypertext to be transported
    over networks;

    +   - the Hypertext Markup Language (HTML), which is the language of the Web documents.
    It is HTML that allows for the easy linking of files and pages by embedding an
    interactive reference to a document directly into the page.


    All three defining features of the Web were in Tim Berners Lee’s prototype browser/editor
    designed at CERN, the European Particle Physics Laboratory in Switzerland, in
    the late 1980s. Many of these ideas are, of course, simply milestones in the development
    of information technology. This chapter focuses mainly on the evolution of the
    Internet economy. The Appendix at the end of the chapter offers a broader historical
    perspective on the milestones in information technology.


    # What is the Internet?


    The term Internet is a shortened version of ‘international network of computers’.
    The Internet is the infrastructure linking the'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'computers of the world together in a network of networks consisting of links
    and nodes. A national road system is an analogous network of networks. In any
    city there are roads (the links) and roundabouts and crossroads (the nodes) forming
    a network. Each city network is linked to other city networks via highways. The
    networks of the Internet operate under the Transmission Control Protocol/International
    Protocol (TCP/IP), a standard protocol that is recognized by virtually all computers.


    It is often asked whether the Internet is the same as the World Wide Web? The
    answer is quite emphatically No! Often the term World Wide Web (WWW), or simply
    the Web, is used synonymously with the Internet, but Web applications are only
    one category of application where data are transmitted across the Internet; others
    are e-mail, voicemail and electronic data interchange (EDI). Although e-mail,
    voicemail and EDI can and are run on the Internet outside of the Web – and indeed
    outside of the Internet – rather confusingly perhaps, they are also available
    within the Web.


    What is so unusual about the Internet is that since it has become available to
    the general public, its penetration has been exceedingly fast. As the US Department
    of Commerce (1995) commented: ‘It took 38 years for the radio to reach 50 million
    US listeners, and 13 years for the television to reach 50 million viewers. It
    has taken only 5 years since the Internet got going for real in the US in 1993
    for the Internet to acquire 50 million users.’ Thinking about this quote, it’s
    worth noting the increase in activity possible to the recipients: first they were
    listeners, then listeners and viewers and now users.


    # What is the Internet economy?


    The Internet economy is made up of companies that directly generate all or part
    of their revenues from Internet-related products and services. This is a two-tier
    economy consisting of infrastructure and economic activity (see Figure 3.1).


    The infrastructure can be broken down further into two components:


    +   (1) The physical Internet infrastructure of e-commerce (Layer 1)

    +     - Fibre-optics makers: Corning, Pirelli

    +     - Networking hardware/software: Cisco, Lucent, 3Com'
