    始终更新你的防毒软件。防毒程序旨在防止恶意软件嵌入你的计算机，有助于保护你的计算机。在任何时候，当程序检测到病毒或蠕虫时，它会消除威胁。病毒可以通过黑客将其放置在你的计算机中来获取你的访问权限。\n\
    \n间谍软件技术也需要保持更新。正如其名，间谍软件允许某人看到计算机上进行的所有活动。某些间谍软件实际上会在未经你许可的情况下收集数据，然后在你的网页浏览器中产生不想要的弹出广告。\n\
    \n过时的操作系统实际上会让黑客更容易进入你的计算机。随着每次新的更新，由于在更新之间发现并修复了漏洞，计算机的安全性会稍微提高一点。让你的系统不进行这些更新可能会让黑客访问你的机器。\n\
    \n黑客还可以通过你的电子邮件进入系统。永远不要打开来自你不认识的人的邮件。这些邮件可能包含来自黑客的恶意代码，他们试图访问多台机器以获取他们想要的信息。\n\
    \n不使用计算机时请关闭它。虽然让计算机一直开启以便于访问更简单，但间谍软件和病毒仍然可以访问你的计算机，并让让黑客在不知情的情况下进入。\n\n# 第七章：黑客使用的技术\n\
    \n![](img/26215855e4000962a48e12eab4e94c9f_32_0.png)\n\n到目前为止，你已经学习了如何破解不同的系统，以及如何进入黑客的心态。然而，就像世界上其他任何事情一样，你可以使用一些技术来成为一个更高效的黑客。\n\
    \n- **匿名性**：黑客不希望让你知道他们进入了你的系统。为了做到这一点，他们会尽一切努力不留痕迹。在此过程中，他们将使用：\n  - 代理或安全隧道\n\
