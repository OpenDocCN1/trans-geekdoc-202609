    \ telnet。\n\n- **离开**：任何黑客都会确保不在你的计算机上留下的任何痕迹，这样你就永远不知道他们曾来过那里。在离开的过程中，黑客会放过你所有的文件，但他会留一个“后门”，以便在日后能够重新进入你的计算机。\n\
    \n- **收集目标信息**：在破解某人时，尽可能多地获取他们的信息是非常重要的。在此过程中，你可能想要获得如下信息：\n  - 他们的 IP 地址\n \
    \ - 使用 Telnet 或 Tracert 查看某人在使用计算机时的 ping 值\n  - 并善于利用。尽可能多地获取你目标的信息。\n\n- **记录击键**：作为黑客，你可以使用程序来查看某人在计算机上输入的每一个按键，仅此一项就能揭示一个人的身份。\n\
    \n- **5. 破解密码**：在尝试破解密码时，最好尝试使用创建字母、符号和数字组合的简单算法。你需要做出明智的推测并使用字典攻击，以便生成密码的所有可能组合。\n\
    \n- **6. 留下病毒**：这是重新进入计算机的简单方法。通过向任何潜在受害者发送电子邮件或即时消息即可留下病毒。\n\n- **7. 通过后门进入**：这与破解密码非常相似。许多黑客开发了代码和程序，寻找网络中毫无防御的路径，作为一种无需使用密码即可进入网络的方法。\n\
    \n- **8. 监控邮件**：这是一种可以用于中断和读取邮件的程序。\n\n- **9. 制作僵尸计算机**：这是黑客利用计算机来发动 DDoS 攻击并发送垃圾邮件。如果一个无辜的用户点击了你发送的链接，将在你的计算机和他的计算机之间建立一个连接。\n\
    \n- **10. 确保你有一个防火墙**，以便限制对可能传出计算机的任何个人信息的访问。\n\n- **11. 使用代理服务器**：当你决定使用计算机时，确保你的目标是代理服务器。\n\
    \n- **13. 使用搜索引擎**：这将帮助你找到破解系统所需的工具。从这里开始，你可以下载针对特定计算机所需的工具。\n\n- **14. 在计算机上留下一两个文件**：这将允许你在日后重新访问计算机。你可以留下诸如\
    \ Netcat 等文件以再次访问。\n\n# 第八章：追求伦理黑客职业\n\n并不是所有的黑客都是那种通过破解系统来获取你个人信息的黑客。事实上，历史上出现了几个非常著名的黑客，他们为我们提供了现在拥有的技术。想到的三个是史蒂夫·沃兹尼亚克（Steve\
    \ Wozniak）、史蒂夫·乔布斯（Steve Jobs）和酸饼船长（Captain Crunch）。\n\n这些非常有名的男性从破解开始职业，然后为我们提供了我们今天所知并享受的技术。他们所做的只是将他们拥有的知识应用于技术，并找到创造事物的新方法。\n\
    \n为了开启你的伦理黑客职业，明智的做法是拥有某种计算机科学学位以便于。许多大公司正在招聘黑客来寻找他们系统的漏洞，以便保护他们的公司秘密。\n\n你还可以利用你的黑客技能像沃兹尼亚克和乔布斯一样创造自己的东西。你可以创建程序、计算机或任何你想创建的东西，以帮助人们免受黑客侵害。\n\
    \n如果你想去一家公司为他们工作，那么你需要找到那些正在招聘 IT 团队人员的公司。你所做的将不仅是寻找系统中的安全漏洞，但这将让你朝着正确的方向迈出一步。\n\
    \n让你记住，黑客是违法的，除非是以伦理的方式进行的。以下是黑客在被发现后受到惩罚的一些方式。\n\n在印度，如果你被发现篡改计算机源文档，这包括破坏、隐藏甚至更改文档源代码，将导致黑客被处至少三年的监禁或处以\
    \ 20,000 卢比的罚款。\n\n在印度，如果你只是破解了一个网站或其他各种来源，你将被监禁最高三年，并可能处以 50,000 卢比的罚款。\n\n荷兰将破解定义为具有违法意图的自动化工作或其部分。入侵被认为破解了任何安全措施、虚假信号或虚假加密密钥、使用窃取的用户名或密码。其中任何一种都可能导致你至少一年的监禁，以及第四类罚款。\n\
    \n"
