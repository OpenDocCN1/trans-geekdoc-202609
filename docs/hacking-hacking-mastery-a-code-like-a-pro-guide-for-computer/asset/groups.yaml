    # Introduction


    Firstly, I want to thank you and congratulate you for downloading the book, *Hacking
    Mastery.*


    This book contains proven steps and strategies on how to become a hacker and the
    many ways that you can use your new found hacking skills.


    An inescapable fact is that you are able to use your hacking skills for both good
    and bad. However, it is not recommended that you hack into any system. It is highly
    illegal!


    You should never hack into a system without the administrator''s permission. Any
    hacking that is done without the expressed permission of the system''s administrator''s
    permission is strictly illegal while you may not get caught right away, you can
    end up spending time in prison or paying some very heavy fines. Any illegal hacking
    can earn you a sentence up to twenty years in a federal prison.


    Any information in this book is purely for educational purposes!


    Thanks again for downloading this book, I hope you enjoy it!


    # Chapter 1: A Hacker’s Mindset


    There are five main principles of a hacker’s mind that every hacker should think
    about when they are hacking. If you are looking to begin hacking, you should think
    of these too.


    - 1. The world is full of fascinating problems that are just waiting to be solved:


    As a hacker you can have a lot of fun (as long as you are doing it legally). It
    also takes a lot of effort to be a hacker. And that effort takes a lot of motivation.
    As a hacker, your motivation is going to come from you solving problems, exercising
    your intelligence, and even sharpening your skills with each successful hack.


    If you are not this naturally, you will become this way as you learn the ways
    of being a hacker. If you do not, your energy is going to be sapped by many different
    distractions such as money and even social approval.


    You also need to be able to develop some kind of faith in your own ability to
    learn. This belief is going to let you know that you can learn how to hack anything
    you need to, but you do not know everything. If you are able to tackle a problem
    and learn how to solve just one piece of it, you have learned and are ready to
    go on and learn the next thing.


    This is you having the faith in yourself to be able to learn how to solve a puzzle
    one piece at a time.


    - 2. No problem should ever have to be solved twice: your creative brain is both
    valuable and a limited resource (because you''re the only one of you). Just as
    you didn''t waste any time on re-inventing the wheel, you shouldn''t have to go
    back and solve a problem when there are many other interesting problems that are
    not out to be solved.


    In order to behave like a hacker, you need to believe that your time is precious.
    Think that it is your moral duty to share any information that you have from solving
    problems as solving any problem before you just give the solution away. This will
    help other hackers to be able to solve any problems instead of solving ones that
    you may have answers to.


    Remember, just because a problem has been solved does not mean that you shouldn''t
    try to go back and find a new solution that might make solving that easier. This
    is never just one solution to any given problem.


    Often times we learn a lot from the problem that we didn''t know before by studying
    the first solution to it. It is okay for you to believe that you can do better
    than the however, to use artificial technical, legal, or institutional barriers
    in order to prevent a good solution from being re-used therefore causing other
    people to have to re-invent the wheel.


    You also do not need to feel obligated to hand over any of your creative product.
    You might want to remember that as a hacker, it is perfectly okay to respect some
    authority that will help you.


    - 3. Boredom and drudgery are evil: being that hackers are naturally creative;
    you should never get bored at work that is repetitive. Boredom and drudgery are
    not just unpleasant, but actually evil.


    In order to behave like a hacker, you need to believe this to make sure you do
    not fall into boredom. You also need to be able to spot when you hit a wall so
    that you can find a way to get off it for yourself and for others.


    Just like most things, there is an expectation of this rule: as a hacker, you
    will do things that are going to be repetitive or even boring to a observer. these
    are done as mind-clearing exercises or for you to be able to acquire a skill you
    have no experience in, or to sharpen your skill in a certain area.


    This type of "boring" is perfectly okay because it is by choice. you should never
    be forced into a situation that is going to bore and stifle your creativity.


    - 4. Freedom is good: as a hacker, you are most likely anti-authoritarian (this
    does not have to be the point that you do not respect any authority, however,
    for some hackers it goes this far).


    When someone gives you an order that will you from solving a problem that you
    are fascinated by, it will generally cause you to fight harder to solve the problem.


    As most authority might think, they will find some sort of reason as to why it
    is stupid that you are attempting to solve this problem. therefore it is important
    that you try and fight this type of mindset so that you do not become smothered.


    Remember that this does not mean that you are fighting all authority. as a hacker,
    you need to be able to accept some authority that you are able to get things that
    you want. this does not mean that you have to allow the authority to smother you
    and stop you from hacking.


    - 5. Attitude is no substitute for competence: if you are going to be a hacker,
    you need to have some of these attitudes. however, copping an attitude alone is
    not going to make you hacker any more than standing in a garage is going to make
    you a car.


    To become a hacker, it is going to take practice, dedication, hard work, and intelligence
    from you.

