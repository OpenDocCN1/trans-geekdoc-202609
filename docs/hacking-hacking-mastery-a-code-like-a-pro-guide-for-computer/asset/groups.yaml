    +   1. The world is full of fascinating problems that are just waiting to be solved:


    As a hacker you can have a lot of fun (as long as you are doing it legally). It
    also takes a lot of effort to be a hacker. And that effort takes a lot of motivation.
    As a hacker, your motivation is going to come from you solving problems, exercising
    your intelligence, and even sharpening your skills with each successful hack.


    If you are not this naturally, you will become this way as you learn the ways
    of being a hacker. If you do not, your energy is going to be sapped by many different
    distractions such money and even social approval.


    You also need to be able to develop some kind of faith in your own ability to
    learn. This believes going to let you know that you can learn how to hack anything
    you need to, but you do not know everything. If you are able to tackle a problem
    and learn how to solve just one piece of it, you have learned and are ready to
    go on and learn the next thing.


    This is you having the faith in yourself to be able to learn how to solve a puzzle
    one piece at a time.


    +   2. No problem should ever have to be solved twice: your creative brain is
    both valuable and a limited resource (because you''re the only one of you). Just
    as you didn''t waste any time on re-inventing the wheel, you shouldn''t have to
    go back and solve a problem when there are many other interesting problems that
    are not out to be solved.


    In order to behave like a hacker, you need to believe that your time is precious.
    Think that it is your moral duty to share any information that you have from solving
    problems as solving any problem before you just give the solution away. This will
    help other hackers to be able to solve any problems instead of solving ones that
    you may have answers to.


    Remember, just because a problem has been solved does not mean that you shouldn''t
