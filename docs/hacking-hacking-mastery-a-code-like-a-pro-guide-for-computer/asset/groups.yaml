    \n当科技公司急于给一切事物都贴上 WI-FI 连接时，他们忽略了设备隐私和安全等重要事项。\n\n一个重要的例子是，黑客曾劫持了一个婴儿监视器，并在设备中说了一些非常难听的话。\n\
