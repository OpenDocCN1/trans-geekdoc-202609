  md: '# Chapter 3: How to Hack a Computer System


    Hacking was used to help with gaining information about system for IT purposes
    when it was brought to the public''s attention as something that was not all bad.
    It is now days that hacking has taken on a darker meaning thanks to those who
    use their skills for personal gain while hurting others.


    When you look at the positive end of the hacking scale, there are multiple multimillion
    dollar companies that have hackers employed in their IT departments in order to
    test the strength of their systems so that they know where they are most vulnerable
    and beef up their security in order to keep their systems safe. Due to being employed
    by a large company, hackers will only hack as far as they are allowed into the
    system and then help the company to fix the holes that they find. This is what
    they earn the large salary that the companies pay them to keep their information
    protected.


    There are also hackers who work outside of the company that do the same thing
    only they work with security consulting firms that the multimillion dollar companies
    hire in order to find the flaws in their security systems.


    Before you begin to hack, there are steps that you need to follow in order to
    make sure that you are prepared for the experience of hacking that you will gain
    when you try and hack into a system. We have talked about these steps in previous
    chapters, but they are worth going over again just to ensure that you are fully
    prepared when it comes to hacking into the system that you are granted access
    to.


    Step One: Programming language is a necessity when it comes to hacking. As we''ve
    talked about earlier, there is a variety of different programming languages that
    you can learn and it is best that you learn all of them so that you have a well-rounded
    knowledge of programming languages. It is vitally important that you know how
    a program speaks and works with the operating system that it is on. The more that
    you know, the easier that will be for you to be able to gain access to the network.


    Unix uses a C programming language and this teaches the memory how to work and
    knowing how this works is vitally important to learning how to hack into any system.


    Python and Ruby are programming languages that are both very powerful programming
    languages that are used to automate a variety of tasks.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'PHP Perl is used for web applications and is a very reasonable choice for those
    who are in the hacking field.


    If you are going to be scripting, you should be using Bash. This program easily
    manipulates the Unix and Linux systems therefore doing most of the job for you.


    Assembly is the most basic language that your processor is going to understand.
    All programs can and will interpret assembly as it is the most basic language
    that any computer has. If you do not have a good knowledge of assembly, then you
    will never truly be able to exploit a program.


    Step Two: you need to know your target. It is vitally important that you gather
    as much information as possible on the target that you are planning to hack. In
    getting this information you will need to be able to find the weak spots in their
    system. There is a chance that you''re going to need to have different approaches
    in order to get the system you should find that your initial approach is not the
    way to go. The more that you know about your target, the less chance that you''ll
    find a surprise while you are hacking the system. When you gather information
    on your target it is known as enumeration.


    # Hacking:


    Step One: You''re going to want to use a *n terminal for all your commands that
    you''re going to be using when it comes to hacking. Cygwin is a good program that
    will actually emulate the *unix for those who use Windows. If you do not have
    access to Cygwin, then it is that you use Nmap which will run not WinPcap while
    you''re still on windows even though you''re not using Cygwin. However, the downside
    of Nmap is that it will run poorly on the Windows operating system because there
    is a lack of sockets.


    When you''re actually hacking, you''re most likely to want to consider using BSD
    or Linux as both of these systems are flexible no matter type of system you are
    using. But, it is important to know that Linux will have more tools that are pre-installed
    and ultimately more useful when it comes to your hacking ventures.


    Step Two: make sure that the machine you are using to hack is actually secured.
    You''re going to need to make sure that you are protected before you go hacking
    into anyone''s system. If you are not secured, then there is a possibility that
    you are going to be traced and they will be able to get ahead of you and file
    a lawsuit against you because they now know where you are.'
