- pgno: 23
  md: '# Chapter 5: How to Crack Passwords


    Passwords are going to be the easiest way to get into someone''s computer. However,
    even though you have to be highly skilled in order to get a password correct the
    first time.


    But, there are other ways that you are able to go about hacking into someone''s
    system by using their password. These techniques are not always going to be effective
    and some of them are not going to work period.


    Do not put all your faith in thinking that you''re going to hack someone''s password.
    Some passwords are not going to be able to be hacked because of how everyone is
    constantly told that they need to make sure they have strong passwords in order
    to make sure that they are not hacked.


    +   1. Dictionary Hack: this is when you use actual dictionary words in order
    to try and hack someone''s password. This is used by trying to determine different
    paraphrases and using a trial and error method.


    This works much like a normal dictionary; however, it is just a simplified file
    that contains unusual words that many people are going to place inside of their
    password. This makes it easy to hack their password. However, a tough password
    will always beat this attack.


    ![](img/26215855e4000962a48e12eab4e94c9f_23_0.png)


    +   2. Brute Force Attack: the motto for the brute force attack is to crack passwords.
    A brute force attack will try every possible combination in order to crack the
    password.


    With people being smarter as technology changes, the growing size of passwords
    is making it hard for brute force to be able to crack the passwords.


    This is very similar to the dictionary attack but is basically an upgraded version.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/26215855e4000962a48e12eab4e94c9f_24_0.png)


    +   3. Phishing: this is by far the easiest method that you can use as a hacker.
    Phishing asks you for its password in a unique and different way. As the hacker,
    you are able to create fake emails, apps, pages and other things that are going
    to ask you to log in with your id and password. At the point in time that you
    have logged in, your passwords are instantly transmitted into the hacker’s computer
    for them to be able to access your sensitive data.


    ![](img/26215855e4000962a48e12eab4e94c9f_24_1.png)


    +   4. Viruses, Trojans, and other Malware: a virus is a program that a hacker
    can develop in order to destroy their intended target. These worms and viruses
    can get into a user’s system and therefore give the hacker full use of the system.
    At this point in time, a hacker has full use of the network or machine and can
    spread the virus through emails or other hidden applications.


    ![](img/26215855e4000962a48e12eab4e94c9f_24_2.png)


    +   5. Shoulder Surfing: this is the practice of spying on the user of any electronic
    device in order to obtain personal information. This is usually found in eye catching
    notes that are stuck in front of your monitor that keep asking you to login.'
  merge: -1
  img_proc: true
