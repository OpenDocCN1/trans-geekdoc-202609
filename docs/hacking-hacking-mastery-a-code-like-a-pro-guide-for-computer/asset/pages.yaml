    In order to behave like a hacker, you''re going to need to believe this to make
    sure that you do not fall into boredom. you also need to be able to spot when
    you hit a wall so that you can find a way to get yourself off it. you need to
    do this not for yourself, but others as well.


    Just like most things, there is an expectation to this rule. as a hacker, you
    will do things that are going to be repetitive or even boring to a normal observer.
    these are done as a mind-clearing exercises or for you to be able to acquire a
    skill that you have no experience in, or to sharpen your skill in a certain area.


    This type of “boring” is perfectly okay because it is by choice. you should never
    be forced into a situation that is going you to be bored and stifle your creativity.


    +   4. Freedom is good: as a hacker, you are most likely anti-authoritarian. (this
    does not have to be the point that you do not respect any authority, however,
    for some hackers it goes this far).


    When someone gives you an order that will spot you from solving a problem that
    you are fascinated by, it will generally cause you to fight harder to solve the
    problem.


    As most authority might think, they will find some sort of reason as to why it
    is stupid that you are attempting to solve this problem. therefore it is important
    that you try and fight this type of mindset so that you do not become smothered.


    Remember that this does not mean that you are fighting all authority. as a hacker,
    you need to be able to accept some of authority that you are able to get things
    that you want. this does not mean that you have to allow the authority to smother
    you and stop you from hacking.


    To behave like a hacker, you need to develop an instinctive hostility to any censorship,
    use of force or deception, censorship or anything that is used to compel responsible
    adults. you need to be willing to act on that belief alone.


    +   5. Attitude is no substitute for competence: if you are going to be a hacker,
    you need to have some of these attitudes. however, copping an attitude alone is
    not going to make you hacker any more than standing in a garage is going to make
    you a car.


    To become a hacker, it is going to take practice, dedication, hard work, and intelligence
    from you.'
