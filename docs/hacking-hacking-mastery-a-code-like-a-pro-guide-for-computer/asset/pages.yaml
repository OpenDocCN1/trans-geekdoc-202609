    are the ones who are going to help you on your way up.


    +   3. Boredom and drudgery are evil: being that hackers are naturally creative;
    you should never get bored or have drove at work that is repetitive. this will
    cause you to not be able to solve new problems, which is the whole reason you''re
    doing it!


    Therefore, bored and drudgery are not just unpleasant, but they are actually evil
