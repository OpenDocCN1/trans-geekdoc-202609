- pgno: 27
  md: '# Chapter 6: How to Protect Yourself from Hackers


    Some people use their hacking skills to gain access to information that they are
    able to use to harm others. Information that is taken is your personal information
    like your social security, address, or credit card numbers. It does not take a
    lot of information in order to someone to gain access to your entire identity.
    As long as they have a few keys of information then they can pass themselves off
    you and ultimately ruin your life. The hackers who do this are out to only help
    themselves at the cost of anyone that takes. As long as the information helps
    them further themselves enough that they are able to go on hacking into the next
    person''s life.


    However, you are able to avoid situations like this by doing some small things
    that most people do not think about when it comes to helping them save their identity.
    Below are a few of these steps that can help you to protect yourselves a little
    more against hackers who are out to harm you and your family.


    Turn off the WiFi and Bluetooth on your phone. Keeping on these features allows
    hackers to have easy access to your phone.


    ![](img/26215855e4000962a48e12eab4e94c9f_27_0.png)


    When you keep the WiFi and Bluetooth on all the time, hackers have access to see
    what networks you have been connected to and be able to create a fake network
    with the same name so that they are able to trick your phone into connecting to
    a device because it believes device is actually the network that you have authorized
    to have access to your phone.


    At the point in that your phone is now connected to the device of the hacker''s
    choosing, they are able to gain access to your data that is stored there as well
    as on information that you put into your phone. Not only that, but they are able
    to place malware on your phone so that you can never trace the fact that they
    were in your phone.


    Therefore, you should turn your Bluetooth and WiFi off when you are not using
    it so that you are able to protect your phone just a little more.


    Another way you can protect yourself is to never use the one password. When you
    use one password, it makes it too easy for yourself to be hacked and you are exposed
    all time because of how limited the security is whatever the hacker wants access
    to. So, in order to protect yourself, use a two-step authentication so that if
    your password is entered in wrong, it will then ask you for a second password
    in order to verify that you are who you say you are.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'A lot of social media sites and even email services now are able to offer extra
    protection. The two-step authentication is essentially a temporary password that
    gives you access to what a hacker is trying to get into.


    When you join sites such as LinkedIn, Twitter or Google, you are asked to enter
    a code each time you attempt to log into your account from a new device. This
    code is sent to whatever email or phone number you have on file for the account.
    You should change your email or phone and not change it with your account, you
    will then not be able to access your account.


    Although someone may be able to get a hold of your password, it is highly unlikely
    that they are going to have access to your phone''s messages as well in order
    to get the verification code they need.


    For websites you access sensitive information such as your email or your bank
    account, you should use a passphrase that is both unique and long. An example
    would be +HIspl@inumDr@gonBreathefire.


    When you are entering something that does not contain some of your sensitive data,
    you can save your password on the password manager that is on your computer so
    you do not have to remember the password.


    The most important thing for you to remember is that when you use the password
    manager, it encrypts any passwords that are stored on your device. Programs such
    as 177 Password Lock, Password Safe and LastPass will do this for you so that
    your passwords are still protected.


    ![](img/26215855e4000962a48e12eab4e94c9f_28_0.png)


    If you are using one password for everything, it acts like a master password that
    will unlock everything and once hacker has access to one password, they will be
    able to gain access to any website they have gotten on.


    It is also a good idea for you to change your passwords more than once a year
    in order to keep your accounts up to date.


    While you are browsing the web, make sure that you are using HTTPS. The program
    HTTPS Everywhere encrypts all the information that is transmitted or received
    by your browser when you visit multiple websites.


    If there is no s at the end of the HTTP in the address bar of the website that
    you are visiting, then anyone can view what you are currently viewing.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'When you are setting up your home WiFi, you need to set it up with a password.
    Many routers come with a sticker on the side of the box that will give you access
    to that network. Make sure that you change it! Do not stay with the default password
    because it is entirely too easy to be hacked for someone to be gain access to
    your network.


    Also, when the machine asks which encryption you want, it is best to choose WPA-2.


    ![](img/26215855e4000962a48e12eab4e94c9f_29_0.png)


    It is wise to attempt and try and use WEP and WPA. The encryptions actually have
    a flaw that will give you the password to your network within a few seconds.


    At the time that your home router is set up, it will ask you if you want to hide
    the SSID. When you click yes, your WiFi will be hid from others, but it will force
    your devices to constantly search for the network that they are connected to.
    Your devices will connect, but in the time that is spent searching for the network,
    it will open up your device to connecting to a strange network.


    Now days there are devices such as a smart fridge, oven, and even washer and dryer.
    These devices connect to the internet and give you different options that the
    original designs don''t.


    But, the companies that are putting out these devices are still working out the
    kinks in them.


    While tech companies rush around and just slap WI-FI connectivity on everything,
    they are skipping the important things such as privacy and safety of their devices.


    An important example of this is when a hacker hijacked a baby monitor and said
    some very foul mouthed things over the device.


    Hacker Stanislav says that even though you are told things are secure with your
    device, they might not be.


    Ultimately, security over your devices is up to you in order to protect yourself
    and those you love.


    Other ways to keep yourself protected are to keep your firewall turned on. Your
    firewall helps keep hackers out of your computer. Some operating systems already
    come with a'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'firewall that you can use or you can purchase a program with a firewall.


    Always keep your antivirus software updated. Designed to prevent malicious software
    from embedding in your computer, antivirus programs help to protect your computer.
    At any point in time, when the program detects a virus or a worm, it works to
    remove the threat. Virus'' can gain access to your computer through hackers placing
    them there in order to spy on you.


    Antispyware technology needs to be kept updated as well. Just as it sounds, spyware
    allows someone to be able to see all activity that is done on a computer. Some
    spyware actually collects data without your consent and then produces unwanted
    ads popping up on your web browser.


    Outdated operating systems actually make it slightly easier for a hacker to enter
    your computer. With each new update, the security on a computer gets just a little
    better due to all the flaws that were found and fixed between updates. Leaving
    your system without these updates can give a hacker access to your machine.


    Hackers can also get into your system through your email. Never open an email
    that is from someone you do not know. These emails can contain malicious code
    from hackers who are attempting to gain access to multiple machines in order to
    get information that they want.


    Turn off your computer when you''re not using it. Even though it is easier to
    just leave your computer so that it is easily accessed, spyware and virus'' still
    have access to your computer and still allow hackers to get into your computer
    without knowing.'
  merge: -1
  img_proc: true
