- pgno: 15
  md: 'If you’re hacking a system that is a friend, family members, or a companies,
    make sure that you do not do so without the permission of the system’s owner.
    The permission needs to ultimately be handwritten so that there are no repercussions
    that can come back on you.


    If you do not feel comfortable attacking else’s system, you always have the option
    of attacking your own system in order to find your own securities flaws. In order
    to do this, you’ll need to set up a virtual laboratory to hack.


    Ultimately, it does not matter what you are trying to hack, if you do not have
    the permission of the administrator, it is illegal and you will get in trouble.


    Step Three: you’re going to make sure that you can reach the system in which you
    are trying to attack. You can use a ping utility tool in order to test and see
    if your target is active, the results from this cannot always be trusted. If you
    are using a ping utility tool, the biggest flaw you will find is that the system
    administrator will actually be able to turn their system off and therefore causing
    you to lose your target.


    Step Four: you’re going to run a scan of the system that you’re trying to attack
    by using pOF or Nmap in order to check and see which ports are actually open on
    the machine. Along with telling you which ports are open, you’ll also be able
    to see what type of firewall is being used as well as what kind of router is being
    used.


    Knowing this type of information is going to help you to plot your course of action
    in attacking the system. In order to activate the OS detection using Nmap, you’re
    going to use the -O switch.


    Step Five: Ports such as those use HTTP or FTP are going to more than often than
    not be protected ports and are only going to become insecure and discoverable
    when they are exploited.


    Ports that are open for LAN gaming such as TCP and UDP are often forgotten much
    like the Telnet ports.


    Any ports that are open are usually evidence of a SSH (secure shell service) that
    is running on your target. Sometimes these ports can be forced open with brute
    force in order to allow you access to them.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Step Six: before you are able to gain access to most systems, there is a password
    that you''re going to have to crack. You are able to use brute force in order
    to crack the password as one of the ways that you can try and get into a system.
    When you use brute force, your effort of trying every possible password contained
    within a pre-defined dictionary is put onto a software program and used to try
    and crack the password.


    Being that users of any website or system are highly discouraged from using passwords
    that are weak and easy to crack, sometimes using brute force can take some time
    in cracking to password. However, there have been some major improvements to the
    brute force techniques in an effort to lower the time that it takes to crack a
    password.


    You can also improve your cracking speed by using cracking algorithms. Many hashing
    algorithms can be weak and therefore are exploited in their weakness in order
    to easily gain access to the system that you are trying to attack.


    For example, if you have an MD5 algorithm and cut it in 1/4, you will then have
    a huge boost in the speed used to crack the password.


    Graphics cards are also now used as another sort of processor that you can gain
    access to. Gaining access to a graphics card is a thousand times faster than it
