- pgno: 38
  md: '# Chapter Nine: Wozniak and Jobs


    As mentioned in the previous chapter, Wozniak and Jobs used hacking in order to
    help improve technology. In this chapter, you are going to learn how they were
    able to do this.


    Just like in a previous chapter, Jobs and Wozniak used a popular way of hacking
    in order to break into different computers.


    Even though they used their hacking for good, what they were doing was still illegal!


    Back in the 60s the term hacker was used to describe someone who was an expert
    at programming. The years went on and more people got into hacking, the skills
    used in order to gain access to a system from being “completely innocent” to the
    people who used it for illegal activity on the computer. Either way you look at
    it, the ones who use their skills to program a computer and make it better, the
    ones who use their skills in order to gain access to a person’s private information,
    they are both skilled individuals. Some of the biggest names in technology started
    out “hacking” in the beginning days of computers.


    At the Computer History Museum in California, there is a device on display called
    a Blue Box. This was used to interrupt phone signals and was invented by two hackers
    that are extremely well known today – Steve Jobs and Steve Wozniak.


    As stated, the Blue Box was used to interrupt phone signals. It was a hacking
    activity that is known as phone freaking.


    Today, phone calls are a series of connections that place you through to whom
    you wish to talk to. Back in the beginning, this was done by a human operator
    who could help you get through to the person you wanted to speak with. When the
    automatic exchanges come into place, you route your call to its destination by
    communicating with one another. The automatic exchanges used a series of audible
    tones known as signaling which came around in the 60s and 70s.


    The tones that phones used proved to be the weak spot that hackers exploited.


    The blue box emulates the signaling tones used by telephone exchanges. When these
    tones are played through a speaker that is connected to the phone’s handset, the
    automatic exchanges are fooled into believing that they are receiving a signal.
    Anything became possible once the hacker understood all the signaling tones that
    were used.


    A hacker could figure out how a call was routed by the billing companies, overriding
    the blocking restrictions that a phone company had in place. And this would help
    them to overcome. In the early 1970s this is what Jobs and Wozniak designed and
    began to sell. Using false names, (Berkeley Blue and Oaf Tob), Jobs and Wozniak
    entered into the illegal world of Phone Freaking.


    Wozniak and Jobs started with Phone Freaking because they were interested in the
    challenge it gave them to take apart and figure out how it works, and then find
    ways around it. By the time they did figure it out, they also figured out that
    they could'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'make money off of it, and that is when they began the illegal action of selling
    their work. Now motivated by the new technical challenges that were coming out
    with the advancement of technology, Wozniak and Jobs abandoned their life of crime
    and moved on different challenges. In an interview with Jobs, he claimed that
    if it hadn''t been for the Blue Boxes that he and Wozniak experimented on, Apple
    would not exist today.


    Blue Boxes became extinct when the telephone companies began to adopt an opt of
    band signal that would spate and dedicate the connections that were used for exchange
    to exchange any communication.


    By today''s definition, Wozniak and Jobs would be considered hackers. But, were
    they really hackers or were they just skilled programmers? The line is thin in
    deciphering which side they fell on. They did know that they were engaging in
    illegal activities with their Blue Box. Is the only reason that they are not considered
    hackers because they are now a household name thanks to creating Apple?


    nOn the other hand, things could have turned out very differently for Wozniak
    and Jobs. Due to all the hacks that have happened within the government now days,
    their Blue Boxes and other hacking antics would be far less likely to just be
    dismissed as harmless rebellion thanks to people feeling more sensitive to our
    privacy and communications. In fact, it is very possible that if Wozniak and Jobs
    had continued with their illegal activities, they would have ended up serving
    time.


    But, since they learned a lot thanks to the use of their blue boxes. Without having
    dabbled in the darker side of hacking, Wozniak and Jobs would have never created
    the worldwide company that we all know and enjoy today.'
  merge: -1
  img_proc: true
