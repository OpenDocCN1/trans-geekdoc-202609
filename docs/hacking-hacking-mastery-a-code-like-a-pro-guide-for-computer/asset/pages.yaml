- pgno: 32
  md: '# Chapter Seven: Techniques Used by Hackers


    ![](img/26215855e4000962a48e12eab4e94c9f_32_0.png)


    So far in this book you have learned how to hack different systems as well as
    to get into the mindset of a hacker. However, just like anything out there, there
    are techniques that you can use in order to be a more effective hacker.


    +   Anonymity: Hackers don''t want you knowing that they got into your system.
    In doing this, they are going to make sure that they do anything that they can
    in order to not leave a trace. In doing this, they will use

    - Proxies or secured tunnels

    - Software that will hide their IP address

    - Will use other people''s usernames and passwords without using his own

    - Programming that is written in C

    - Or a telnet that will hide him and his task execution.


    +   Getting Out: Any hacker is going to make sure that they do not leave any trace
    on your computer so that you never know they were there. In the process of getting
    out the hacker is going to leave all your files alone, however, he is going to
    leave a “backdoor” open so that he is able to get back into your computer at a
    later date.


    +   Gather information about the target: When hacking someone, it is important
    to get as much information on them as you possibly can. In doing this, you’re
    going to want information such as:

    - Their IP address

    - Telnet or Tracert in order to look at the pings of when someone is on the computer

    - And be resourceful. Find out as much about your target as you possibly get.


    +   Log the keystrokes: as a hacker, you are able to use programs that will review
    every keystroke that someone has made on their computer and that alone can reveal
    a person’s identity.'
  merge: -1
  img_proc: true
- pgno: 33
