    to minimize noise while maximizing the number of required samples to form a cluster
    using the elbow method.


    OLS: Both k-means and DBSCAN post-process all records after program execution,
    which requires the system to store large numbers of records and incur high computational
    overhead due to the dimensional complexity of each record. To address these issues,
    TPUPoint-Analyzer offers OLS, which identifies similar, consecutive program behaviors
    that approximate clustering with significantly lower overhead and reduced data-storage
    needs. With OLS, TPUPoint-Analyzer simply relies on records from the current step,
    from the previous step, and from two steps ago. OLS has four stages:


