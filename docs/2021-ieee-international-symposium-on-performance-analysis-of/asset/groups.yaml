    ## VII. TPUPOINT-OPTIMIZER


    基于 TPUPoint-Profiler 的观察结果，我们设计了 TPUPoint-Optimizer，这是一个自动工具，有助于精调工作负载中已识别阶段的性能。TPUPoint-Optimizer
    在无需程序员输入的情况下工作，并确保调优不影响程序执行输出。TPUPoint-Optimizer 执行以下操作以帮助插桩工作负载：


    - 它分析代码并自动插桩代码以辅助优化。

    - 它允许在无需完整程序执行的情况下进行在线调优。

    - 它控制输出质量。


    本节描述了 TPUPoint-Optimizer 的设计。


    ### A. 程序分析


    如果用户启用 TPUPoint-Optimizer，TPUPoint-Optimizer 将分析启动和停止 TPUPoint-Profiler 调用之间的
    TensorFlow 程序。在程序分析阶段，TPUPoint-Optimizer 首先识别用户最初定义的可调参数。这些可调参数包括缓冲区大小、专用于某个操作的线程数量，以及在保持正确性的前提下可以重新排序的操作顺序。如果这些可调参数中的任何一个在被更改时导致错误，TPUPoint-Optimizer
    不会将其视为可调参数。使用输入/输出变量列表和可调参数，TPUPoint-Optimizer 对代码进行插桩，在分析程序中的每个函数调用之前生成检查点。


    ### B. 在线调优


    TPUPoint-Optimizer 提供了一项在线性能调优功能，可在无需程序完成整个执行周期的情况下调整 TPU 工作负载的性能。TPUPoint-Optimizer
    的在线调优算法设计主要源自前一节中描述的两项观察：观察 1——大多数 TPU 工作负载可以


    ![](img/a2afc74fc22d678e24674964f5d46bc8_7_0.png)

    图 14. TPUPoint-Optimizer 针对 TPUv2 的加速比


    总结为有限数量的阶段。观察 2——最长的 3 个阶段涵盖了 TPU 工作负载的大部分执行时间。综合来看，这些观察表明，对程序执行的一小部分进行优化，对整体程序执行可能产生重大影响。


    TPUPoint-Optimizer 分析输入/输出变量并对代码进行插桩以进行检查点记录后，将使用正常输入和默认参数开始运行工作负载。同时，TPUPoint-Optimizer
    使用为 TPUPoint-Profiler 开发的统计模型跟踪不同代码段中的累积执行时间。如果 TPUPoint-Profiler 在最耗时阶段中观察到第
    [VI] 节中描述的最常见算子模式（例如，reshape、infeed、fusion、outfeed），或者当前阶段占聚合执行时间的一半以上，TPUPoint-Optimizer
    会将当前代码段指定为已进入性能关键阶段，并相应地进行优化，同时确保保持正确性。


    如果性能提高且输出不变，TPUPoint-Optimizer 将继续朝同一方向调整参数值，直到找到该特定参数的最佳值。如果没有其他邻近值优于默认值，TPUPoint-Optimizer
