    vector representation as done in k-means.


    +   2) Apply DBSCAN on aggregated steps of 25, requiring a minimum number of samples
    from 5 to 200. As the minimum increases, the number of produced clusters decreases.


    +   3) For each clustering minimum sample size, measure the ratio of the noise
