    TPUPoint is portable; simply changing the low-level library function calls that
    TPUPoint uses to retrieve statistics makes TPUPoint''s profiling and optimization
    available on a wide variety of platforms.


    Some benchmark suites also attempt to standardize ML workload management: $\mu$
    Suite [54], BigDataBench [55], AI Benchmark [56], EEMBC MLMark Benchmark [57],
    [58], Fathom [59], AI Matrix [60], DeepBench [61], DAWNBench [62], and MLPerf
    [63], and mixed-precision benchmarks as well [64], [65]. When benchmarking Cloud
    TPUs, we can only test a subset of each benchmark suite due to the limited front-end
    programming-language support for the Cloud TPU platform. That being said, many
