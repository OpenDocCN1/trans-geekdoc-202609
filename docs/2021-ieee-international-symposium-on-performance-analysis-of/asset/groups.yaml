    尽管 Cloud TPU 的实现并未完全向公众开放，但已注册的 API 调用和可服务请求仍然可用；名为 CLOUD-TPU-PROFILER 的命令行工具可用于生成客户端到主节点的
    gRPC 调用，以请求为小迭代生成 Cloud TPU 配置文件。然而，CLOUD-TPU-PROFILER 的实用性有限，因为它无法集成到训练代码中，只允许在执行后获得洞察，并且只在有限的时间范围内运行（因此无法对整个程序执行进行性能分析。）


    ## III. TPUPOINT-PROFILER: TPUPOINT 的核心


    TPUPoint 通过 TPUPoint-Profiler 模块提供一组工具。TPUPoint-Profiler 测量 Cloud TPU 性能并启用 TPUPoint
