    ## IX. CONCLUSION


    This paper presents TPUPoint, a toolchain that collects, analyzes, and optimizes
    the performance of TPU-accelerated ML workloads. Using the post-analysis tool,
    TPUPoint-Analyzer, we determined that most TPU-accelerated ML workloads are under-utilizing
    precious TPU resources. Moreover, because workload behavior varies by model and
    dataset, manually optimizing workloads is not feasible. Fortunately, the behavior
    within a workload is often repetitive, opening the door for dynamic optimizations.
    Using the observations learned from TPUPoint-Analyzer, we designed TPUPoint-Optimizer
    to detect the main application phase and dynamically adjust parameters in running
    code. Our results show a 1.12× speedup over default parameters without programmer
    intervention.


