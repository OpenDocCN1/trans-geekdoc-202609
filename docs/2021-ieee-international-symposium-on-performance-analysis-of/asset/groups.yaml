    \ 的分析线程将发送最后一个请求。在 TPUPoint-Profiler 接收并适当保存了发送到 Cloud TPU 的最后一个配置记录响应后，所有 TPUPoint-Profiler\
    \ 线程将终止。生成的配置记录数量取决于 TensorFlow 应用程序的持续时间。\n\n### B. TPUPoint 编程接口\n\n当前版本的 TPUPoint\
    \ 为程序员提供基于 Python/TensorFlow 的前端，后端功能使用 C++ 实现。图 2 展示了在 TensorFlow 应用程序中启用 TPUPoint-Profiler\
    \ 的示例代码。程序员需要通过创建 TPUPoint-Profiler 对象（示例第 7 行中的 tpprofiler）并指定适当选项来启动 TPUPoint\
    \ 使用。\n\nTPU 训练通过 TensorFlow 的高级 TPUEstimator API 执行（第 6 行和第 10 行）。如果程序员希望使用 TPUPoint-Analyzer\
    \ 进行执行后分析，则必须在 Start() 函数调用中将 analyzer 标志设置为 true（第 9 行）；当 analyzer 标志设置为 false\
    \ 时，TPUPoint-Profiler 仅启用 TPUPoint-Optimizer。训练完成（即 TPUEstimator.train() 已结束）后，TPUPoint-Profiler\
    \ 通过 Stop() 函数停止（第 11 行）。当已指定执行后分析（如代码示例所示）时，Stop() 还将实例化 TPUPoint-Analyzer 进程以可视化分析结果。\n\
    \n此实现允许 TPUPoint 对应用程序的整个持续时间进行分析，这是 CLOUD-TPU-PROFILER 命令行工具不具备的功能。\n\n## IV.\
    \ TPUPOINT-ANALYZER：执行后分析\n\n为应对从大量分析统计数据中推导有意义结果的挑战，TPUPoint-Analyzer 会遍历并将配置文件汇总为程序阶段。为应对这些挑战，TPUPoint\
    \ 实现了 TPUPoint-Analyzer 的执行后分析。TPUPoint-Analyzer 执行后处理中的每个程序阶段都会识别相似的重复程序行为。将程序行为汇总为阶段，以便于分析、可视化以及用于性能优化的检查点/重启。\n\
    \n### A. 分析算法\n\n为了减少 TPUPoint-Analyzer 在计算程序行为相似性时的搜索空间，TPUPoint-Analyzer 首先利用\
    \ Google 为 Cloud TPU 提供的步骤编号——这些步骤编号指示粗粒度的重复应用程序行为。随后，TPUPoint-Analyzer 将这些步骤作为相似性比较的基本单位，并为步骤创建可视化摘要。TPUPoint-Analyzer\
    \ 提供三种汇总方法：传统的 k-means 算法 [15]、[16]、基于密度的带噪声的空间聚类应用 (DBSCAN) [17]、[18] 以及开销更低的在线线性扫描\
    \ (OLS) 算法。k-means 和 DBSCAN 在所有分析记录完成后运行，而 OLS 在记录期间执行（因此其名称中有“在线”一词）。\n\nk-means：我们使用三个阶段\
    \ [19] 来评估 TPUPoint-Analyzer 中的 k-means 算法实现：\n\n- 1) 从所有统计配置文件中提取记录，并使用 TPU 步骤编号将记录聚合在一起。对于每个步骤，我们根据\
    \ TensorFlow 操作、累积调用次数和总持续时间定义维度。使用主成分分析 (PCA) 进行降维 [20]，我们最多有 100 个不同操作用于频率向量表示。\n\
    - 2) 对 k 取值范围为 1 到 15 的聚合步骤尝试 k-means 聚类算法。每次 k-means 运行都会产生一个聚类，将步骤划分为 k 个不同的簇。\n\
    - 3) 对于每个簇（k = 1, ..., 15），计算每个 k 值的样本到簇中心（质心）的平方距离之和。尝试使用肘部方法最小化平方距离之和，同时最大化簇的数量\
    \ (k)。\n\nTPUPoint-Analyzer 实现的 k-means 类似于 SimPoint [19]、[21]、[22]。SimPoint 使用贝叶斯信息准则\
    \ (BIC) [23] 来衡量给定模拟的聚类概率。SimPoint 将每周期指令数 (IPC) 作为指标，将聚类而非完整模拟用于分析进行比较。TPUPoint\
    \ 的目标是不使用 IPC 等架构指标来模拟完整的程序执行，而是采用肘部方法 [24] 作为启发式方法，在改进不再显著增加时停止聚类（即，当某个簇的平方距离之和不再显著改善时）。\n\
    \nDBSCAN：DBSCAN [17]、[18] 与 k-means 遵循相同的一般方法，但依赖于高密度簇的核心样本。DBSCAN 为与 k-means\
    \ 的比较提供了一种替代方法。DBSCAN 也有三个阶段：\n\n- 1) 从所有统计配置文件中提取记录，并生成与 k-means 中相同的频率向量表示。\n\
    - 2) 在聚合的 25 个步骤上应用 DBSCAN，要求最小样本数从 5 到 200。随着最小值增加，生成的簇数量减少。\n- 3) 对于每个聚类最小样本大小，通过计算未标记点的数量与总点数的比率来测量噪声比例。尝试使用肘部方法最小化噪声，同时最大化形成簇所需的样本数量。\n\
    \nOLS：k-means 和 DBSCAN 都会在程序执行后对所有记录进行后处理，这要求系统存储大量记录，并因每条记录的维度复杂性而产生高计算开销。为解决这些问题，TPUPoint-Analyzer\
    \ 提供 OLS，该方法可识别相似的连续程序行为，以显著更低的开销和减少的数据存储需求来近似聚类。使用 OLS 时，TPUPoint-Analyzer 仅依赖当前步骤、前一步骤和两步前步骤的记录。OLS\
    \ 有四个阶段：\n\n- 1) 从传入的统计配置文件中提取记录，并使用步骤编号将记录分组。对于每个步骤，使用程序中的所有 TensorFlow 操作以及每个操作的累积调用次数和总持续时间。\n\
    - 2) 当程序进入另一个步骤时，将配置文件中的前一步骤与其后继步骤进行比较，并使用公式 [1] 计算它们的相似性。公式 [1] 将两个步骤的相似性计算为步骤\
    \ i-1 的事件集与步骤 i-2 的事件集的交集与两个集合大小中较小值的比率，其中步骤 i-1 是步骤 i-2 的后继步骤。（某个步骤的事件集定义为在该步骤期间发生的所有唯一事件。）\n\
    - 3) 如果根据用户指定的阈值或默认阈值（70% 相似性）判断后继步骤相似，则将两个步骤分组为单个阶段。否则，将后续步骤与新的程序阶段关联。\n- 4)\
    \ 重复上述阶段，逐步聚合连续步骤，直到存储的配置文件中的所有步骤都被解析。\n\nStepSimilarity (Step_i-1, Step_i-2)\
    \ = |Step_i-1 ∩ Step_i-2| / min(|Step_i-1|, |Step_i-2|) (1)\n\n### B. 可视化\n\n\
    ![](img/a2afc74fc22d678e24674964f5d46bc8_3_0.png)\n\n图 3. TPUPoint 分析输出的可视化\n\n\
    TPUPoint-Analyzer 生成一个 JSON 文件来存储应用程序行为的汇总视图。此文件连同相应的 CSV 文件包含 (1) 每个阶段的格式化描述和\
    \ (2) 训练步骤期间执行的 TPU 和主机 CPU 操作。JSON 文件与 Google Chrome 的事件分析工具 chrome://tracing\
    \ 兼容。图 3 显示了从这样的文件中获取的 TPU 训练阶段期间 TPUPoint-Analyzer 输出的可视化。每条记录的配置文件在横向 Profile\
    \ Breakdown 轴上显示为总执行时间的一个小子段。每个识别的阶段在横向 Phase Breakdown 轴上显示为总执行时间的一个较大子段。图 3\
    \ 展示了每个阶段如何跨越多个配置文件记录，从而有效汇总每个配置文件的信息。图 3 中显示的时间标记不按比例绘制，因为 TPUPoint-Analyzer\
    \ 对配置文件和阶段的可视化仅是一种表示，旨在减少用户必须消耗的信息量。使用 Chrome 的控件，用户可以对每个程序阶段进行放大/缩小，以查看 TPUPoint-Analyzer\
    \ 输出中更多/更少的细节。\n\n### C. 检查点与重启\n\n除了阶段外，TPUPoint 还记录 TensorFlow 模型存储的每个阶段最近的检查点。为识别检查点，TensorFlow\
    \ 比较阶段内的步骤，并找到与这些步骤距离最小的检查点。这种方法允许基于目标阶段修改应用程序，并从步骤零开始执行。\n\n## V. 实验方法论\n\n为验证\
    \ TPUPoint-Profiler 和 TPUPoint-Analyzer 的设计，并获得有助于代码优化的初步见解，我们在 Google Cloud Platform\
    \ 上运行了一组实验。每个实例包含一台主机，配备 16 核、双路 SMT Intel Skylake CPU、104 GB 主内存和 250 GB 持久磁盘\
    \ [25]。为保持实现一致性，所有实例均使用 Docker 19.03.1 版和带有已安装 TPUPoint 的 TensorFlow 1.15 版。如第\
    \ III 节所述，每个实例都可以访问 TPUv2 和 TPUv3——在单个 TPU 实例上运行的模型实现（如 TPUv2）可以在不进行代码修改的情况下在单个\
    \ TPUv3 实例上运行。然而，对多个 TPU 实现进行扩展“需要大量调整和\n\n"
