    # ## VII. TPUPOINT-OPTIMIZER


    Based on the observations from TPUPoint-Profiler, we designed TPUPoint-Optimizer,
    an automatic tool that helps to fine-tune the performance of an identified phase
    in a workload. TPUPoint-Optimizer works without programmer input and ensures that
    tuning does not affect program-execution output. TPUPoint-Optimizer does the following
    to help instrument a workload: (1) It analyzes code and automatically instruments
    code to assist optimization. (2) It allows for online tuning without the need
    for complete program execution. (3) It controls the output quality. This section
    describes the design of TPUPoint-Optimizer.


    # ### A. Program Analysis


    If the user enables TPUPoint-Optimizer, TPUPoint-Optimizer will analyze a TensorFlow
    program between the calls to start and stop TPUPoint-Profiler. During the program-analysis
    phase, TPUPoint-Optimizer first identifies adjustable parameters originally defined
    by the user. These adjustable parameters include buffer size, the number of threads
    dedicated to an operation, and the order of operations that can be rearranged
    while maintaining correctness. If any of these adjustable parameters cause errors
    when altered, TPUPoint-Optimizer will not treat them as adjustable. Using the
    list of input/output variables and adjustable parameters, TPUPoint-Optimizer instruments
    code to produce checkpoints before each function call within the profiled program.


    # ### B. Online Tuning


    TPUPoint-Optimizer provides an online performance-tuning feature that adjusts
    the performance of TPU workloads without requiring the program to finish a complete
    execution cycle. The design of TPUPoint-Optimizers online tuning algorithm comes
    primarily from two observations described in the previous section: Observation
    1—most TPU workloads can be


    ![](img/a2afc74fc22d678e24674964f5d46bc8_7_0.png)


    Fig. 14. TPUPoint-Optimizer speedups for TPUv2


    summarized into a limited number of phases. Observation 2— the 3 longest phases
    cover most of the execution time for TPU workloads. Taken together, these observations
    suggest that optimization of a small portion of program execution can have a significant
    impact on program execution as a whole.


    After TPUPoint-Optimizer analyzes input/output variables and instruments code
    for checkpointing, it will start running the workload using the normal inputs
    and default parameters. At the same time, TPUPoint-Optimizer tracks the accumulated
    execution time in different code segments using the statistical model that we
    developed for TPUPoint-Profiler. If TPUPoint-Profiler observes the most common
    pattern of operators described in Section [VI] (e.g., reshape, infeed, fusion,
    outfeed) within the most time-consuming phases, or the current phase accounts
    for more than half of the aggregated execution time, TPUPoint-Optimizer will designate
    the current code segment as having already entered the performance-critical phase
    and will optimize accordingly, making sure to maintain correctness.


    If performance improves and output does not change, TPUPoint-Optimizer continues
    adjusting parameter values in the same direction until an optimal value for that
    specific parameter is found. If no other neighboring values are better than the
    default value, TPUPoint-Optimizer will keep the default value. Finally, TPUPoint-Optimizer
    uses the improved adjusted parameters to complete rest of the program''s execution.


