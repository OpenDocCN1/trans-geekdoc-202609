    不带 TPUPoint-Optimizer 的 TPUv2 和 TPUv3。图 [16] 显示了带有和不带 TPUPoint-Optimizer 的朴素实现对
    TPUv2 和 TPUv3 的 MXU 利用率。TPUPoint-Optimizer 增加了 TPUv2 和 TPUv3 朴素实现的 TPU 空闲时间（图
    [15]）并提高了 TPUv2 的 MXU 利用率（图 [16]）。因此，TPUPoint-Optimizer 能够通过更高效地使用 Cloud TPU 带来性能提升，其中
    TPUv2 表现出对矩阵运算依赖的显著变化。当我们将 TPUPoint-Optimizer 应用于原先执行时间不足二十分钟的朴素工作负载（BERT 和 DCGAN）时，这些工作负载的速度与原始性能相比没有显著变化。相比之下，当我们将
    TPUPoint-Optimizer 应用于原先耗时超过二十分钟的朴素工作负载（QANet 和 RetinaNet）时，我们确实看到了速度的改善——这并不令人意外，因为执行时间较长的工作负载相对于执行时间较短的工作负载，涉及更大、更复杂的数据集和更深层的实现。由于
    TPUv3 仅仅是包含 TPUv2 两倍数量的 MXU 和 HBM，我们没有观察到 TPUPoint-Optimizer 对 TPUv3 带来性能提升。事实上，由于我们分析/优化工具的开销，我们观察到平均性能损失低于
    10%。尽管如此，这些结果表明，与完整程序执行相关的开销相比，TPUPoint-Optimizer 相关的开销相对微不足道。


    ## VIII. 相关工作


    针对架构模拟而非全系统分析（SimPoint [19], [21], [22] 的关键概念）以及将相似程序行为聚类为程序阶段（如 HyGCN [33] 所做）启发了
    TPUPoint 的开发。TPUPoint 还整合了 TurboSMARTS [34] 的检查点和重启功能，以节省架构模拟时间并降低云计算成本。


    TPUPoint 和 ParaDnn [35] 均提供工具和系统方法论来分析 Cloud TPU 性能。TPUPoint 在自动且隐式地重写性能不佳的代码的同时，向程序员提供直接反馈。相比之下，ParaDnn
    侧重于架构视角下的系统性测试和优化洞察，因此与 TPUPoint 互补。


    除了使用 Cloud TPU，数据中心还经常依赖异构硬件组件来加速 ML 工作负载 [36]–[53]。然而，硬件解决方案通常不易于分发。由于 TPUPoint
    在编程语言/应用程序级别工作以观察和优化性能，TPUPoint 具有可移植性；只需更改 TPUPoint 用于检索统计信息的低级库函数调用，即可使 TPUPoint
    的分析和优化在多种平台上可用。


    一些基准套件也试图标准化 ML 工作负载管理：$\mu$ Suite [54]、BigDataBench [55]、AI Benchmark [56]、EEMBC
    MLMark Benchmark [57]、[58]、Fathom [59]、AI Matrix [60]、DeepBench [61]、DAWNBench
    [62] 和 MLPerf [63]，以及混合精度基准 [64]、[65]。在对 Cloud TPU 进行基准测试时，由于 Cloud TPU 平台的前端编程语言支持有限，我们只能测试每个基准套件的一个子集。话虽如此，许多基准依赖相同的模型和数据集，仅不同框架和实现。我们已尽力覆盖
    ML 工作负载的全谱。


    此前已有若干关于 ML 摘要的论文，例如 EcoRNN [66]、SeqPoints [67] 和 TBD [68]。这些工作并未尝试像 TPUPoint
    那样对同一范围的基准进行分析/优化，其中计算可能与输入无关或在不同迭代中具有异构性。EcoRNN 和 TBD 分别针对 LSTM RNN 和 DNN 采用基于采样和迭代的方法，而
    SeqPoint 则考虑输入变化如何影响基于序列的神经网络（SQNN）。为了对如此广泛的 ML 工作负载提供洞察，TPUPoint 致力于实现高覆盖率和低开销，无论
    ML 工作负载如何。


    由于 ML 工作负载在云服务中占据主导地位，优化资源利用率的方法已受到广泛关注。一些方法使用性能估算算法 [69]–[73] 或训练模型 [74]–[76]
    来选择最优参数。此类方法倾向于拥有停滞的选择器，尽管其开销较低，但在适应新工作负载方面能力有限。TPUPoint 不仅仅关注特定工作负载，而是提供一个更通用的框架，适用于更广泛的
    ML 任务范围。


    ## IX. 结论


    本文介绍了 TPUPoint，这是一个用于收集、分析和优化 TPU 加速 ML 工作负载性能的工具链。使用事后分析工具 TPUPoint-Analyzer，我们确定大多数
    TPU 加速 ML 工作负载未充分利用宝贵的 TPU 资源。此外，由于工作负载行为随模型和数据集而异，手动优化工作负载不可行。幸运的是，工作负载内部的行为通常具有重复性，为动态优化打开了大门。利用从
    TPUPoint-Analyzer 获得的观察结果，我们设计了 TPUPoint-Optimizer 以检测主要应用阶段并在运行代码中动态调整参数。结果表明，在无需程序员干预的情况下，相对于默认参数实现了
    1.12× 的加速比。


