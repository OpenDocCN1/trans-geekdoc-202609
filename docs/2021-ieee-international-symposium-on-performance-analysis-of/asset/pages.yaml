    # B. Visualization


    TPUPoint-Analyzer produces a JSON file to store the summarized view of application
    behavior. This file, along with a corresponding CSV file, contains (1) a formatted
    description of each phase and (2) the TPU and Host CPU operations executed during
    training steps. The JSON file is compatible with Google Chromes event-profiling
    tool, chrome://tracing. Figure 3 shows a visualization of TPUPoint-Analyzer output
    for phases during TPU training from one such file. Each profile recorded is displayed
    as a small subsection of the overall execution time on the horizontal Profile
    Breakdown axis. Each phase identified time is displayed as a larger subsection
    of the overall execution time on the horizontal Phase Breakdown axis. Figure 3
    displays how each phase can expand over multiple profile records, effectively
    summarizing the information from each profile. The time markers displayed in Figure
    3 are not to scale, as TPUPoint-Analyzer''s visualization of the profiles and
    phases are only a representation, meant to reduce the information a user must
    consume. Using Chromes controls, a user can zoom in/out of each program phase
    to see more/less detail from the TPUPoint-Analyzer output.


    # C. Checkpointing and Restarting


    Along with phases, TPUPoint records the closest checkpoint to each phase stored
    by the TensorFlow model. To identify checkpoints, TensorFlow compares the steps
    within a phase and finds the checkpoint with the smallest distance from those
    steps. This approach allows applications to be modified based on a targeted phase
    and executed without starting from step zero.


