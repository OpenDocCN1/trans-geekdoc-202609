  md: 'Cloud Services. This section briefly describes the capabilities and interfaces
    of Cloud TPUs.


    # ## A. Cloud TPUs


    Google offers three different Cloud TPUs. Google uses the first-generation TPU
    internally for search and inference but makes the second and third-generation
    TPUs (TPUv2 and TPUv3, respectively) available via the Google Cloud Platform and
    TensorFlow Research Cloud (TFRC) program [12]. The TPUv2 chip contains two Matrix
    Units (MXUs), where each MXU is associated with 8 GiB of High Bandwidth Memory
    (HBM) to deliver a combined theoretical 45 TFLOPS of computation throughput for
    200–250 W TDP. Google typically combines four TPUv2s on a single board [13]. TPUv3
    contains twice as many MXUs as TPUv2 and twice the HBM. Google does not disclose
    many details about the TPUv3 architecture. Nonetheless, the performance-number
    specifications, which include a capacity of 90 TFLOPS and 32 GB HBM for each chip,
    suggest that TPUv3 simply leverages more advanced process technologies to place
    four MXUs within the same chip while maintaining the same level of power consumption
    as TPUv2.


    # ## B. The Cloud TPU Hardware/Software Interface


    A Google Cloud TPU is only accessible through a compute instance (Compute Engine)
    associated with a TPU instance. Along with the Compute Engine VM, a Google Cloud
    TPU requires cloud storage (Storage Buckets) for training data and model information
    during execution; the Compute Engine acts as a host, the TPU acts as a coprocessor,
    and the Storage Buckets act as persistent memory. These components comprise the
    Cloud TPU architecture.


    TensorFlow [14] is another important part of the Cloud TPU equation. Google developed
    the TensorFlow framework to model and execute ML algorithms on single machines
    and heterogeneous/distributed systems. Google Cloud TPUs are readily integrated
    with TensorFlow. TensorFlow makes heavy use of Googles Protocol Buffers (Protobuf)
    and Googles Remote Procedural Call (gRPC). Both Protobuf and gRPC are crucial
    to the TensorFlow framework to allow for communication to occur across TensorFlow.
    TensorFlow makes heavy use of Googles Protocol Buffers (Protobuf) and Googles
    Remote Procedural Call (gRPC). Protobuf allows for convenient data abstraction
    across multiple programming languages, and gRPC allows TensorFlow to share data
    between multiple servers and clients to facilitate execution across multiple devices.
    The gRPC server implements a method and waits for client requests. A gRPC client
    uses an object referred to as a stub to provide a channel between the client and
    server. The stub handles gRPC client requests (with Protobuf) and server responses
    and uses efficient formats such as RDMA for communication between processes during
    execution. Both Protobuf and gRPC are crucial to the TensorFlow framework.


    TensorFlow execution involves a client (the user), a master, and one or more worker
    processes. The client interacts with the master, and the master coordinates the
    workers. The master is


    ![](img/a2afc74fc22d678e24674964f5d46bc8_1_0.png)


    Fig. 1. The TPUPoint system architecture


    responsible for handling device placement of graph nodes and partitions the graph
    into subgraphs to be executed by the workers. In addition to managing the entire
    computational graph, the master applies optimizations such as constant folding.
    The workers handle requests from the master, execute kernel operations, and manage
    communication between kernels.


    Even though the Cloud TPUs implementation is not fully available to the public,
    registered API calls and serviceable requests are still available; a command-line
    tool called CLOUD-TPU-PROFILER may be used to generate a client-to-master gRPC
    call that requests a Cloud TPU profile for a small iteration. CLOUD-TPU-PROFILER
    is limited in its usefulness, however, because it cannot be integrated into training
    code, only permits insights to be gained post-execution, and only runs within
    a limited time range (and so cannot profile program execution in its entirety.)


    # ## III. TPUPOINT-PROFILER: THE CORE OF TPUPOINT


    TPUPoint offers a set of tools via the TPUPoint-Profiler module. TPUPoint-Profiler
    measures Cloud TPU performance and enables the other two elements of the TPUPoint
    toolchain: (1) TPUPoint-Analyzer (Section IV), a post-execution, offline analysis
    tool that identifies the most important application phase and the cause of under-utilized
    system components and (2) TPUPoint-Optimizer (Section VIII), the online, automatic
    workload-optimization tool that dynamically adjusts and rewrites code running
    on Cloud TPU platforms. This section introduces the TPUPoint design and programming
    interface.


    # ## A. TPUPoint-Profiler Design


    The complete TPUPoint toolchain consists of a set of extensions to the TensorFlow
    framework (the only programming interface for Cloud TPUs at this point). Figure
    1 shows the interactions of the core TPUPoint-Profiler that drives TPUPoint-Analyzer
    and TPUPoint-Optimizer to work with a TensorFlow application.


    TPUPoint creates a separate profiling thread upon initialization of the TPUPoint-Profiler.
    Once created, the TPUPoint-Profiler thread periodically sends profile requests
    to associated Cloud TPUs independently of the main TensorFlow thread, allowing
    TPU training to continue uninterrupted while profiling takes place. When a Cloud
    TPU sends a response back to the profiling thread, TPUPoint-Profiler generates
    a profile record'
