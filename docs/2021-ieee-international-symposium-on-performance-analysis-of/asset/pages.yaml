  md: 'simulations for analysis. TPUPoint aims to simulate complete program execution
    without architectural metrics such as IPC, instead employing the elbow method
    [24] as a heuristic to cut clustering off when improvement stops increasing significantly
    (i.e., when the sum of squared distances for a cluster stops improving significantly).


    DBSCAN: DBSCAN [17], [18] follows the same general approach as k-means but relies
    on core samples of high-density clusters. DBSCAN provides an alternative method
    for comparison with k-means. DBSCAN also has three stages:


    +   1) Extract the records from all statistical profiles and produce a frequency
    vector representation as done in k-means.


    +   2) Apply DBSCAN on aggregated steps of 25, requiring a minimum number of samples
    from 5 to 200. As the minimum increases, the number of produced clusters decreases.


    +   3) For each clustering minimum sample size, measure the ratio of the noise
    by counting the number of unlabeled points to the total number of points. Attempt
    to minimize noise while maximizing the number of required samples to form a cluster
    using the elbow method.


    OLS: Both k-means and DBSCAN post-process all records after program execution,
    which requires the system to store large numbers of records and incur high computational
    overhead due to the dimensional complexity of each record. To address these issues,
    TPUPoint-Analyzer offers OLS, which identifies similar, consecutive program behaviors
    that approximate clustering with significantly lower overhead and reduced data-storage
    needs. With OLS, TPUPoint-Analyzer simply relies on records from the current step,
    from the previous step, and from two steps ago. OLS has four stages:


    +   1) Extract the records from the incoming statistical profiles and group the
    records together using their step numbers. For each step, use all TensorFlow operations
    in the program as well as the accumulated number of invocations and the total
    duration of each operation.


    +   2) When the program advances to another step, compare the previous step within
    a profile to its successor step and calculate their similarity using Equation
    [1]. Equation [1] computes the similarity of two steps as the ratio of the intersection
    of the set of events from step i - 1 and the set of events from step i - 2 to
    the minimum size of the two sets, where step i - 1 is the successor of step i
    - 2. (A set of events for a step is defined as all the unique events that occur
    during that step.)


    +   3) If the successor step is similar according to either a user-specified threshold
    or the default threshold (70% similarity), group the two steps together into a
    single phase. Otherwise, associate the later step with a new program phase.


    +   4) Repeat the above stages and gradually aggregate consecut-


