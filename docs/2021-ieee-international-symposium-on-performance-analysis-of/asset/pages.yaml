    take a performance hit by waiting for TPUPoint-Optimizer to complete any post
    processing tasks. Using the default parameters from TPUv2, the workloads with
    long execution times achieve a speedup of about 1.12x on average. It''s important
    to note that most of the publicly available ML workloads used in this study were
    manually optimized by Google engineers. So to test TPUPoint-Optimizer, we developed
    an original naive implementation to see if TPUPoint-Optimizer could improve poor
    performance. Figure [15] displays TPU idle time of the naive implementation with
    and'
