    # VI. OBSERVATIONS AND INSIGHTS LEARNED FROM TPUPOINT-ANALYZER


    # A. Representativeness of Phases


    TPUPoint-Analyzer identifies similar, repetitive behaviors in applications and
    categorizes those behaviors into phases to facilitate analysis and optimization.
    This section discusses and compares the phases identified from the k-means, DBSCAN,
    and OLS clustering algorithms.


    Figure 4 shows the clustering results for k-means with k between 1 and 15, inclusive.
    Each cluster represents a phase


    of more extensive program execution. In this case, TPUPoint-Analyzer determines
    that the sum of squared distances stops improving by a significant margin when
    k is between 4 and 6; that is, 4 to 6 clusters are sufficient to cover most program
    behaviors.


    Although DBSCAN and k-means both use the elbow method, DBSCAN does not use centroids,
    so distance cannot be used as a clustering metric. Instead, DBSCAN varies the
    number of minimum required samples to form a cluster—designating a sample as either
    a cluster or a noisy sample. Figure 5 shows the ratio of noisy samples to all
    samples for the minimum number of required samples ranging from 5 to 180 in aggregated
    steps of 25. The elbow method was applied in attempt to reduce the noise percentage
    while maximizing the minimum number of samples required to form a cluster. Using
    DBSCAN, TPUPoint-Analyzer found that a minimum of 30 to 80 samples was optimal
    to reduce noise and produced between 3 to 13 clusters. Again, each cluster represents
    a phase of more extensive program execution.


    Figure 6 shows the number of phases that OLS identifies for varying similarities
    using Equation 1 With a similarity threshold of 70%, we found that most workloads
    are condensed into just 3 phases. For a similarity threshold above 70%, the number
    of phases identified grows significantly for the majority of the workloads. For
    these workloads, we further examined the operators within neighboring phases that
    cannot combine together, and we found the differences between neighboring phases
    are essentially ignorable, as they often represent a small amount of the application’s
    execution time, turning even single operations into a phase—this creates a low
    similarity between phases and so creates an excessive number phases.


    As OLS tends to break up steps with small differences into different phases, a
    high similarity threshold leads to a significant increase in the number of identified
    phases. That being said, k-means, DBSCAN, and OLS all aggregate the same set of
    phases into a single phase. Even when TPUPoint-Analyzer uses the extreme 100%
    StepSimilarity threshold (meaning that TPUPoint-Analyzer requires all steps in
    a phase to share exactly the same breakdown of operators), TPUPoint-Analyzer still
    breaks up most workloads into fewer than 15'
