    # B. Operators in Phases


    Cloud TPUs are simply hardware accelerators in computer systems, so TPU-accelerated
    workloads still rely on a host program for workload distribution. We now describe
    the most time-consuming operations on both the host CPU programs and the TPU.


    Table III shows the top 5 most time-consuming operations from the top 3 longest
    phases on both the CPU/host program and the TPU program using TPUv2. For k-means
    and DBSCAN, the identified phases are mostly identical with nearly the same set
    of top operators. For OLS, which tends to


    divide similar phases into multiple phases, the top 5 operators are slightly different
    from the top 5 k-means and DBSCAN operators.


    Differences notwithstanding, all three algorithms identify a common set of the
    most time-consuming operators on TPUv2 across workloads, with the fusion operator
    being the most time-consuming overall. The identified fusion operator combines
    compute-intensive operations from the XLA compiler and is intended to help reduce
    memory operations [32]. The reshape operator is also one of the most time-consuming
    operators. Unlike fusion, reshape is not algorithm-related, but rather serves
    only to prepare input data for subsequent TPU computations.


