  mdcn: "\n\n- **平板电脑**  \n  一种运行与智能手机类似计算架构的平板触摸屏设备，但通常体积更大。\n\n- **特洛伊木马（或特洛伊木马程序）**\
    \  \n  一种通过伪装成无害文件或程序来获取计算机访问权限的恶意软件类型。（另请参阅 恶意软件。）\n\n- **URL**  \n  统一资源定位符是网站的地址。\n\
    \n- **URL 欺骗**  \n  黑客试图创建一个与试图复制的网站 URL 非常相似的假网站，以愚弄人们。常用于网络钓鱼攻击。（另请参阅 网络钓鱼。）\n\
    \n- **病毒**  \n  另请参阅 计算机病毒。\n\n- **VoIP**  \n  互联网语音协议是通过互联网进行语音通信的一种方法。\n\n-\
    \ **Web 浏览器**  \n  专为连接和读取网页而设计的软件。\n\n- **网页**  \n  由 HTML 在互联网上生成的页面，包含可在 Web\
    \ 浏览器上查看的信息。\n\n- **网站**  \n  在单个域名地址下的网页集合。\n\n- **Web 服务器**  \n  使网页和其他资源可通过互联网共享的计算机。\n\
    \n- **WEP**  \n  有线等效加密是无线路由器使用的一种加密类型。\n\n- **Wi-Fi**  \n  无线保真是一种短距离无线技术，可实现无线互联网和网络访问。\n\
    \n- **Wi-Fi 热点**  \n  通常是公共无线接入点。这些位置有时安全措施薄弱或没有安全措施。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_252_0.png)\n\
    \n- **万维网**  \n  互联网上相互互连的网站和网页的名称。\n\n- **蠕虫**  \n  一种可以自我复制并在网络中传播的恶意软件类型。（另请参阅\
    \ 恶意软件。）\n\n- **WPA（及 WPA2）**  \n  Wi-Fi 保护访问是一种比 WEP 更安全的无线加密形式。\n\n- **僵尸计算机**\
    \  \n  在用户不知情或未经许可的情况下，后台运行机器人或其他恶意程序的计算机。\n\n## 进一步阅读\n\n- Abagnale, Frank W.,\
    \ *偷走你的生活：终极身份盗窃防范计划*, Broadway Books, 2008\n\n- Hunter, Nick, *互联网安全（热点话题）*,\
    \ Raintree, 2011\n\n- Bailey, Matthew, *互联网隐私、匿名性和安全性完全指南*, A Nerel Publication,\
    \ 2011\n\n- Ioannou, Nick, *互联网安全基础：提升在线安全性的实用步骤*, Boolean Logical Ltd, 2014\n\
    \n- Cambridge, Rodney D., *如何不使用智能手机：避免黑客通过你的手机窃取身份*, CreateSpace Independent\
    \ Publishing Platform, 2012\n\n- Kandasamy, Vijey Ashok, *初学者防病毒实现：实现防病毒程序的简单指南*,\
    \ VDM Verlag Dr. Müller, 2011\n\n- Cherry, Denny, *数字隐私基础*, Syngress, 2014\n\n\
    - LaVine, Howard, *如何利用智能手机、平板电脑和计算机提高在线安全性*, 2014\n\n- Clare, Andrew, *Android\
    \ 手机和平板电脑粗糙指南*, Rough Guides, 2012\n\n- Liu, Ashok, *Computercare 笔记本电脑维修练习册：300\
    \ 个经典笔记本电脑故障排除与维修案例*, AuthorHouse, 2012\n\n- Donat, Wolfram, *互联网安全入门：在线保护您的数据安全*,\
    \ CyberWolf Publishing, 2012\n\n- Lockhart, Andrew, *网络安全黑客技术*, O'Reilly Media,\
    \ 2006\n\n- Edgington, Shawn Marie, *家长短信、Facebook 和社交媒体指南：理解数字世界中育儿的益处与危险*, Brown\
    \ Books, 2011\n\n- Montgomery, Jim, *互联网安全：笔记本电脑、智能手机和平板电脑上的安全与隐私*, CreateSpace\
    \ Independent Publishing Platform, 2014\n\n- Elenkov, Nikolay, *Android 安全内部机制：Android\
    \ 安全架构深度指南*, No Starch Press, 2014\n\n- Owen, Madison, *如何保护您的孩子在线安全：儿童互联网安全提示*,\
