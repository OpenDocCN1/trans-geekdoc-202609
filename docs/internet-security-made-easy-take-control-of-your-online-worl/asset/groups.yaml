    ### Hot Tip


    Most websites requiring a username and password have a check box for remembering
    your login details. Make sure you do not tick it if you are using a public or
    shared computer to prevent somebody else logging in using your details.


    ## AUTHENTICATION OVERLOAD


    Because of the sheer number of websites, online accounts and social media platforms
    people sign up to these days, it can be nigh-on impossible to memorize every single
    password and username combination. For this reason, some people use the same password
    for all their accounts. However, this is very bad practice, because if one account
    is compromised, the same details can be used to hack into all the others.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_39_0.png)


    Left: Entering a username and password to access a bank account. Note the check
    box to remember the details.


    ## Cookies


    Websites store your account details in little files on your computers known as
    cookies. This enables a computer to add further verification that you are who
    you say you are, as well as allowing your Internet browser to remember your username
    and password for you.

