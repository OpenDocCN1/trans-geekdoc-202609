  mdcn: "\n\n## 面向所有人的访问\n\n这无疑是历史上最慷慨的举动之一，蒂姆·伯纳斯-李和 CERN 的董事们于 1993 年发表声明，宣布万维网将向所有人免费开放使用。这一举动催生了我们今天所知的互联网，在短短几年内，它已成为有史以来最强大的通信工具之一。\n\
    \n## 网络的发展\n\n自万维网向所有人免费开放以来，其发展呈指数级增长，得益于各种技术和进步的助推。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_19_0.png)\n\
    \n上方：亚马逊是第一家大型商业电子商务网站。它最初只销售图书，但现在销售各种各样的产品。\n\n- Web 浏览器：名为浏览器的程序通过使 HTML 更易于使用，让人们能够访问网站。\n\
    - 搜索引擎：在 20 世纪 90 年代中期，第一批搜索引擎出现，使查找和访问信息变得容易得多。\n- 电子商务：在 20 世纪 90 年代中期，第一批电子商务网站出现，这有助于改变全世界做生意的方式。\n\
    \n## 当今的网络\n\n万维网不再是少数学者和研究人员的专属领域。如今，全球超过 17 亿人使用互联网。网络仍在不断发展。早期，调制解调器连接使上传和下载非文本文件变得缓慢而笨拙；如今，凭借超高速宽带，我们现在可以使用网络访问图像、视频、音乐和其他多媒体内容。\n\
    \n### 移动网络\n\n我们访问网络的方式也发生了巨大变化。随着智能手机和平板电脑的出现，我们不再需要被绑在电脑前，这意味着无论身在何处、无论在做什么，都可以上网。\n\
    \n### 你知道吗？\n\n虽然现在这两个词经常混用，但严格来说，“Internet”是计算机网络，而“World Wide Web”是指互联网上的网站。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_20_0.png)\n\n上方：移动设备让我们几乎可以随时随地访问万维网。\n\
    \n## 互联网使用\n\n最初作为文本通信信息门户的东西，已成为我们日常生活不可或缺的一部分，让我们能在线做各种各样的事情，许多人在许多日常活动中都越来越依赖虚拟世界。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_21_0.png)\n\n### 通信\n\n网络最具革命性的方面之一，在于它改变了我们的沟通方式。在网络出现之前，与他人联系主要有三种方式——邮寄、电话或面对面。网络引入了许多不同的通信方式，所有这些方式都让世界变得更加狭小。\n\
    \n- 电子邮件：电子邮件是即时的，并允许您将各种文件附加到消息中。如今，世界上大部分通信都是通过电子邮件进行的。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_21_1.png)\n\
    \n上方：社交媒体网站 Facebook 拥有超过十亿用户。\n\n- 社交媒体：Twitter、Facebook 和 LinkedIn 等网站使人们能够在线与全球各地的人们社交、建立人际关系和交友。\n\
    - 即时通讯：即时通讯（IM）使世界各地的人们无论身在何处都能进行实时通信。\n- VoIP：互联网语音协议现在允许人们以极低或零成本进行全球实时文本、语音甚至面对面的通信。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_22_0.png)\n\n上方：Skype 等 VoIP 服务让人们可以通过互联网相互通话。\n\
    \n### 新闻与信息\n\n网络现在是大多数人获取新闻和信息的主要来源。使用 Google 等搜索引擎，世界的知识就在您指尖。维基百科等网站已取代传统百科全书，几乎所有新闻机构都有在线存在。此外，获取新闻的速度快得多，新闻事件常常在主流新闻网络能够播出之前，就在网站和社交媒体论坛上率先报道。\n\
    \n### 电子商务\n\n商业世界现在也依赖互联网。曾经需要去商业街才能完成的各种交易，如今都可以在线进行。\n\n购物：网上购物彻底改变了我们的购物方式。在线购物现在和在商业街购物一样普遍，几乎每个知名零售商都有网络存在。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_22_1.png)\n\n上方：网上银行让管理财务变得轻松得多。\n\n\
    财务交易：许多人现在使用网络来了解自己的财务状况，无论是查询银行余额还是支付账单。\n\n预订：机票、酒店客房和餐厅预订都可以通过互联网完成。\n\n> 你知道吗？\n\
    > \n> 宽带现在允许视频和音乐服务‘流式传输’内容，使用户可以实时观看或收听，而无需先将其下载到设备上。\n\n### 娱乐\n\n网络也从根本上改变了我们获取娱乐的方式。电影、电视节目、音乐、视频游戏和电子书现在都可以在线下载。您甚至可以在电视频道播出时观看，或收听现场广播。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_23_0.png)\n\n### 商业\n\n许多人现在依赖互联网谋生。无论是在线销售商品和服务，还是作为自由撰稿人、设计师或顾问执业，网络都让做生意变得容易得多。\n\
    \n### 营销\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_23_1.png)\n\n网络提供了各种传播信息的方式。现在，创意产业（如作者、音乐家和视频制作人）的人们无需经销商或出版商即可触达受众，广告商还可以利用社交媒体接触潜在客户。\n\
    \n上方：Netflix 等娱乐网站允许您通过互联网访问电影和电视节目。\n\n## 攻击开始\n\n虽然网络极大地扩大了我们的机会，但也让我们变得脆弱。自万维网诞生之初，怀有恶意动机的用户就开始利用它。\n\
    \n### 美丽新世界\n\n蒂姆·伯纳斯-李对万维网的愿景是一个能让世界更紧密联系、实现信息自由获取和思想交流的系统。这一理念意味着几乎未考虑安全问题，在网络早期，当时只有少数用户，保护信息和数据的需求并未出现。然而，这一状况很快就会改变。\n\
    \n### 威胁\n\n不久之后，恶意用户就利用不断增加的用户数量，威胁了网络的基本理念。计算机病毒、黑客以及将网络视为犯罪机会的人，使得安全问题成为互联网用户日益关注的焦虑。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_24_0.png)\n\n上方：网络设计之初并未太考虑互联网安全。\n\
    \n## 黑客攻击\n\n未经授权进入计算机或其持有的数据被称为黑客攻击。然而，计算机黑客攻击早于万维网和互联网的出现。事实上，最初的黑客与计算机毫无关系。\n\
    \n### 第一批计算机黑客\n\n第一批黑客出现在 20 世纪 60 年代和 70 年代。在此期间，发展最迅速的技术是电信领域，在美国形成了一种做法：人们试图绕过电信系统以获取免费电话——这种做法后来被称为‘phreaking’。当计算机在\
    \ 20 世纪 70 年代末和 80 年代初普及后，许多曾参与频客活动的人开始对这项新兴技术产生兴趣，并开始未经授权进入计算机系统，往往只是为了好玩。\n\n\
    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_25_0.png)\n\n上方：约翰·托马斯·德雷珀，计算机黑客圈中最著名的人物之一。\n\
    \n### 你知道吗？\n\n前电话频客和计算机程序员约翰·托马斯·德雷珀，人称“Captain Crunch”，在 20 世纪 70 年代因多次高调被捕而臭名昭著，许多人认为他是现代计算机黑客之父。\n\
    \n"
