  - '[PAGE 19]


    # # Access For All


    In what has to be one of the most magnanimous gestures in history, Tim Berners-Lee
    and the directors at CERN issued a statement in 1993 declaring that the World
    Wide Web was to become freely available for everybody to use. This move saw,the
    birth of the Internet as we know it today, which in a few short years has become
    arguably the most powerful communications tool ever created.


    # # GROWTH OF THE WEB


    Since the World Wide Web became freely available for everybody to use, its growth
    has been exponential, aided by all sorts of technologies and developments.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_19_0.png)


    Above: Amazon was the first large, commercial ecommerce site. It originally sold
    just books, but now sells a wide range of products.


    +   - Web browsers: Programs called browsers allowed people to access websites
    by making HTML easier to use.


    +   - Search engines: In the mid-Nineties, the first search engines appeared,
    making it much easier to find and access information.


    +   - Commerce: The first ecommerce websites appeared in the mid-Nineties, which
    helped to change the way the world does business.


    # # THE WEB TODAY


    The World Wide Web is no longer the preserve of a few academics and researchers.
    Today, over 1.7 billion people around the world use the Internet. The web continues
    to develop. In the early days, modem connections made uploading and downloading
    non-text files slow and'
  - '[PAGE 20]


    cumbersome; with today’s superfast broadband, we can now use the web to access
    images, videos, music and other multimedia.


    # The Mobile Web


    The way we access the web has changed dramatically too. With the advent of smartphones
    and tablet computers, we no longer need to be tied to a computer, which means
    we have access to the Internet wherever we are and whatever we are doing.


    # Did You Know?


    Although now used interchangeably, strictly speaking, the ‘Internet’ is the network
    of computers, while the ‘World Wide Web’ is the term for the websites on the Internet.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_20_0.png)


    Above: Mobile devices have allowed us to access the World Wide Web almost anywhere
    we like.'
  - '[PAGE 21]


    # # INTERNET USE


    What started as an information portal for communicating text has become an integral
    part of our daily lives, allowing us to do a whole host of things online, and
    many of us are becoming increasingly dependent on the virtual world for many of
    our day-to-day activities.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_21_0.png)


    # ## Communication


    One of the most revolutionary aspects of the Web is how it has changed the way
    in which we communicate. Before the web, there were primarily three ways to connect
    with someone – by post, over the phone, or face to face. The web has introduced
    a number of different methods of communication, all of which have made the world
    a much smaller place.


    +   - Email: Email is instant and enables you to attach all sorts of files to
    your messages. These days, much of the world''s correspondence takes place via
    email.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_21_1.png)


    Above: Social media site Facebook has over a billion users.


    +   - Social media: Websites such as Twitter, Facebook and LinkedIn have enabled
    people to socialize, network and build relationships online and with people from
    across the globe.


    +   - Instant messaging: Instant messaging (IM) has enabled real-time communication
    between people no matter where they are in the world.'
  - '[PAGE 22]


    VoIP: Voice-over-Internet Protocol now allows people to have global, real-time
    text, voice, and even face-to-face communication for little or no cost.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_22_0.png)


    Above: VoIP services such as Skype let people speak to each other over the Internet.


    # News and Information


    The Web is now most people''s primary source of news and information. Using search
    engines such as Google, the world''s knowledge is literally at your fingertips.
    Websites such as Wikipedia have replaced traditional encyclopedias, while nearly
    all news organizations have an online presence. Furthermore, access to news is
    much quicker, with news stories often breaking on websites and social media forums
    before the mainstream news networks can broadcast them.


    # Commerce


    The commercial world is now reliant on the Internet too. All sorts of transactions
    that once required a trip to the high street can now be conducted online.


    Shopping: Online shopping has revolutionized the way we shop. Buying online is
    now as common as shopping on the high street, and nearly every big-name retailer
    has a web presence.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_22_1.png)


    Above: Online banking has made keeping on top of your finances much easier.


    Financial Transactions: Many people now use the web to keep abreast of their finances,
    whether it is checking their bank balance or paying bills.'
  - "[PAGE 23]\n\nReservations: Airline tickets, hotel rooms and restaurant bookings\
    \ can be made over the Internet.\n\n> Did You Know?\n> \n> Broadband now allows\
    \ video and music services to ‘stream’ content, which enables users to watch or\
    \ listen to something in real time without having to download it to their device\
    \ first.\n\n# Entertainment\n\nThe web has also radically changed the way we access\
    \ entertainment. Films, TV shows, music, video games and electronic books are\
    \ now available to download online. You can even watch TV channels as they are\
    \ broadcast or listen to live radio.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_23_0.png)\n\
    \n# Business\n\nMany people now rely on the Internet to make their living. Whether\
    \ it is selling goods and services online, or operating as a freelance writer,\
    \ designer or consultant, the web has made doing business so much easier.\n\n\
    # Marketing\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_23_1.png)\n\nThe web offers\
    \ all sorts of ways to get your message across. It is now possible for those in\
