  - '[PAGE 151]


    # TREND MICRO (HTTP://WWW.TRENDMICRO.COM/)


    Trend Micro Internet Security (known as PC-cillin in Australia and Virus Buster
    in Japan) is the company''s latest foray in antivirus software. Trend Micro produces
    antivirus software for PC, Mac and smartphone and tablet computers.


    # Cost


    Varying in price from £39.95/$39.95 for basic protection and £79.95/$99.95 for
    their Titanium Maximum Security package, Trend Micro produces neither the cheapest
    solution on the market nor the most expensive.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_151_0.png)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_151_1.png)


    Above: Trend Micro''s Titanium Maximum Security can protect PCs, Macs and smartphones.


    # Features


    With malicious URL blocking, anti-phishing and anti-spam protection, Trend Micro
    produces a very good all round antivirus solution, tailored for heavy Internet
    users.


    # Reviews


    PC Mag awarded Trend Micro 4 out of 5 stars for their Titanium Antivirus Plus,
    with the major criticism being that the system can be over-zealous, often blocking
    non-threats.'
  - '[PAGE 152]


    # # QUICK HEAL

    (HTTP://WWW.QUICKHEAL.COM/)


    Indian-based Quick Heal has been producing antivirus software since the mid-1990s,
    but has come to prominence in recent years due to its unique Advanced Machine
    Learning capabilities, making it one of the most effective antivirus solutions
    on the market for spotting threats.


    # ## Hot Tip


    For those wanting extreme protection against online threats, it is possible to
    run more than one antivirus solution at once, although not all software is compatible
    with one another.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_152_0.png)


    Above: Quick Heal has plenty of low-cost solutions.


    # ## Cost


    Quick Heal is sold via a US website, but UK customers can buy and download any
    of their antivirus solutions, which vary from $30 to $74 a year. They also have
    low-cost smartphone and tablet solutions, starting at $7 a year!


    # ## Features


    The biggest benefit offered by Quick Heal is not only its effectiveness at spotting
    threats, but it is also very light on system resources, making it quick and efficient.


    # ## Reviews


    Scored 98.29 points out of 100 in independent tests in 2010 when it was awarded
    PC Security Labs certification.'
  - '[PAGE 153]


    # ESET


    Slovak-based ESET produced their first antivirus system called NOD32 back in 1987.
    Based on their original NOD32 system, ESET Smart Suite is aimed at Internet users
    and is a simple-to-use but fairly basic antivirus package.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_153_0.png)


    Above: ESET''s NOD32 was developed in the 1980s.


    # Cost


    ESET produce Smart Suite, which ranges from £39.99/$59.99 for one PC per year,
    to £69.99/$89.99 for five licences, and its basic NOD32 antivirus software (£29.99/$39.99).


    # Features


    This is a very basic system with good malware protection but with only rudimentary
    firewall and parental control.


    # Reviews


    Many people like Smart Suite for its simplicity, although others have criticized
    it for its inability to deal with threats as effectively as comparable systems.
    PC Mag awarded the latest version of Smart Suite 2.5 out of 5.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_153_1.png)'
  - '[PAGE 154]


    # # BIT DEFENDER


    Launched in 2001 by Romanian-based Softwin, Bit Defender is the relatively new
    kid on the block when it comes to antivirus software, but has gained a solid reputation
    for protection against online threats.


    # ## Cost


    Bit Defender comes in three basic packages: Antivirus Plus (£39.95/$49.95), Internet
    Security (£49.95/$69.95) and Total Security (£59.95/$79.95).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_154_0.png)


    # ## Features


    Even Bit Defender''s basic package, Anti Virus Plus, is crammed full of features
    that you have to pay for on comparable software. These include phishing protection,
    ID-theft monitoring, password management, private data, financial transaction
    protection and a Facebook profile scanner, while the more advanced packages have
    remote management and multi-device parental control.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_154_1.png)


    # ## Reviews


    Most independent tests scored Bit Defender well above average and their Anti Virus
    Plus scored 4.5 out of 5 in PC Mag.


    Left: Bit Defender is award-winning antivirus software.'
