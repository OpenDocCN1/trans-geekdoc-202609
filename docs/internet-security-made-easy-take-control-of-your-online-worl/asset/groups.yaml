    # JARGON BUSTER


    The world of Internet security is full of its own terms and terminology that you
    may find confusing, so to help you, here is the most common jargon explained.


    **Adware**

    Malware designed to display unwanted advertisements. Adware can infect Internet
    browsers and prevent normal browsing by redirecting you to advertising websites
    or bombarding you with pop-ups (see also malware).


    **Botnet**

    A collection of computers infected with malicious bots that work together to carry
    out a single act, such as attacking a computer network or spreading malware. Botnets
    often operate unbeknown to the computer users. (See also **Zombie computer**.)


    **Antivirus software**

    Software designed to prevent malware, including viruses, computer worms and Trojans,
    from infecting computers. Antivirus software can also remove malware and stop
    spyware and adware threats.


    **Cache**

    Files stored on an Internet browser, such as images and text, that are used to
    speed up the loading of websites.


    **Backdoor**

    A method used by hackers to bypass normal security procedures on a computer, often
    caused by vulnerabilities in the software or network.


    **Cloud (computing)**

    Computing services that operate on the Internet, such as applications that can
    be run without needing to download a program, or storage services that store your
    files online.


    **Bluetooth**

    A short-range, wireless communication system often used to connect devices such
    as headphones, smartphones and keyboards.


    **Cookie**

    A small file stored on your computer by websites, which contains certain details
    about your web history so a website can remember your log-in details and personal
    preferences.


    **Bot or web bot**

    An automated program that performs a set of actions; a bot can be legitimate,
    such as those used by search engines to crawl websites, or they can be malicious
    and take control of computers. (See also **Botnet**.)


    **Computer virus**

    A type of malware that infects a computer and can self-replicate and spread to
    other machines. The term is often used as a catch-all word to describe malware.
    (See also **Malware**.)


    **Cracker**

    A malicious or criminal hacker. (See also **Hacker**.)'
