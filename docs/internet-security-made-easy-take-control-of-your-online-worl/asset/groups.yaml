  - '[PAGE 5]


    # # CONTENTS


    +   INTRODUCTION.................... 8


    +   WELCOME TO THE WEB........... 14


    The World Wide Web has come a long way since its origins in the 1980s. What started
    out as a tool for academics and researchers has morphed into the most revolutionary
    communication tool ever developed. In this chapter, we explore the history of
    the World Wide Web, how the Internet works and how security threats take advantage
    of inherent weaknesses in it. We also provide you with some basic advice on keeping
    secure when you are online.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_5_0.png)'
  - '[PAGE 6]


    # THE DANGERS . . . . . . . . . . . . . 46


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_6_0.png)


    Now that you know a little about how the World Wide Web works, it is time to explore
    some of the specific risks of using the Internet. In this chapter, we explore
    the different types of online threat, from the various kinds of malware and the
    consequences of infection, to identifying fraudsters and hackers. We also explain
    what makes you vulnerable and how you can go about ensuring that you do not fall
    victim.


    # ONLINE SECURITY AND CHILD SAFETY . . . . 90


    Many of us now live some of our lives online. Whether we are on social media,
    chatting to friends, or logging into our online bank, we need to ensure that we
    are keeping our personal information safe and secure. In this chapter, we explore
    the various privacy and security settings employed by websites. We also explore
    the risks faced by young people using the Internet and what you can do to keep
    them safe.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_6_1.png)'
  - '[PAGE 7]


    # # ANTIVIRUS, FIREWALLS AND OTHER PROTECTION . . . . . . 134


    If you do not have any antivirus protection, it is time to install some. This
    chapter explains the importance of antivirus software, the different solutions
    available, how to use antivirus software to remove threats and prevent infections.
    We also explain what firewalls are and how they can be used to provide security,
    and look at some of the other software protection available.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_7_0.png)


    # # SMARTPHONES, TABLETS AND LAPTOPS . . . 178


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_7_1.png)


    Now that you have secured your desktop PC, it is time to look at all those other
    devices you use to access the Internet. Smartphones, tablet computers and laptops
    all come with specific online security threats, and we will show you how to secure
    your data, how to keep safe when accessing the Internet in public areas, as well
    as exploring some of the antivirus and security solutions aimed at mobile devices.'
  - '[PAGE 8]


    # ADVANCED TROUBLESHOOTING ............ 210


    Whether you have been infected by a stubborn computer virus that you cannot remove,
    or your Internet browser keeps showing you unwanted adverts, we explain how you
    can get rid of some specific threats, recover lost data and get your computer
    back to good working order following an attack. We also explore the different
    types of hardware solutions that can help secure your network, prevent unauthorized
    access and add an extra level of Internet security.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_8_0.png)


    +   JARGON BUSTER .................... 248


    +   FURTHER READING .................... 252


    +   USEFUL WEBSITES .................... 253


    +   INDEX ............................ 254'
  - '[PAGE 9]


    # # INTRODUCTION


    The Internet has changed our lives forever, but this communications revolution
    is not without its problems. As in ordinary life, there are viruses, hackers and
    identity fraudsters. This book is designed to help you safely navigate the online
    world and keep you secure from online threats.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_9_0.png)


    Above: Websites such as Facebook allow us to socialize but they also contain all
    sorts of personal information about us.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_9_1.png)


    Above: Many of us now do our banking online. The last thing we would want is for
    somebody to be able to access our accounts.


    # ## INTERNET SECURITY


    Keeping safe online is important. As well as benefits, the Internet contains potentially
    harmful threats, from viruses and malware that can infect our computers, erasing
    our data or spying on our online activities, to hackers and ID fraudsters who
    want to gain access to our data for their own aims. Knowing how to defend yourself
    from these threats is increasingly crucial for keeping your network, computers,
    online accounts and family safe.


    # ## The Importance of Protection


    The Internet has become a vital tool for many of us, enabling us to socialize
    on social media, communicate by email, shop and do our banking online. Because
    of this reliance on the online world, keeping secure is vital to prevent unauthorized
    access to our online accounts and ensure our personal information does not fall
    into the wrong hands.'
