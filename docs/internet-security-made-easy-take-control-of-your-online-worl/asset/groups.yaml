    +   - Governments: Even governments create malware to infiltrate the computers
    systems of another nation.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_59_0.png)


    Above: By accepting the terms on some licence agreements, you are agreeing to
    have malware installed on your machine.


    # How They Get In


    Malicious software can get into a computer in a number of ways: some are hidden
    in programs and are activated when you install the program; some software developers
    create free programs just in order to install malware on people''s machines; while
    other malware is disguised as genuine files and is activated when you open the
    file. Additionally, some malware lingers on malicious websites, infecting your
    Internet browser when you visit the site.


    # Hot Tip


    Whenever you install new software, especially free programs, always read the user
    agreement carefully and do a search on the Internet to see if other users have
    developed malware issues after installing.


    # WHAT IS OUT THERE?


    Malware is a broad term and includes all sorts of malicious software that can
    range from being minor annoyances to programs that can erase all your data, steal
    your files or disable your computer. Sometimes infection by malware is obvious
    because you may lose data or suffer continuous computer crashes. However, with
