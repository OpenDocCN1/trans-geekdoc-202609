    # WHAT MAKES YOU VULNERABLE?


    While major cyber attacks against big companies often make the headlines, you
    do not have to be a large organization to be vulnerable to attack. Almost anybody
    can become a victim, especially if you have inadequate Internet security.


    # TEMPTATION


    The speed at which the World Wide Web has grown has been incredible. In just a
    couple of decades, it has gone from being a tool for a handful of researchers
    and academics to being ubiquitous. Millions of people now rely on the Internet
    for work, business and socializing. However, not everybody who uses the Internet
    does so with good motives. The Internet has become a tempting target for criminals
    or for people intent on doing harm.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_49_0.png)


    # Unseen Enemy


    Unlike crimes committed in the real world, online criminals can commit their misdeeds
    anywhere in the world and from the comfort of their own home. Finding and prosecuting
    cyber criminals is also extremely difficult, so people who do this sort of thing
    believe they have little to fear.


    Left: Cyber crime is an increasing problem.'
