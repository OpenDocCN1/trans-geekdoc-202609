    # # PASSWORD ADVICE


    Passwords are your virtual key for gaining access to your online accounts. However,
    as with other types of keys, you have to make sure they do not fall into the wrong
    hands, which means ensuring your passwords are secret, safe and secure.


    # ## SETTING A PASSWORD


    Most websites that require you to create a password insist on at least eight letters
    or digits. The longer the password, the more secure it is, but the harder it is
    to remember.


