    app stores.


    > **Hot Tip**

    > Android devices are far more susceptible to malware than iOS and Windows devices,
    mainly because the operating system is open source, so it is available for anybody
    to develop apps for it.


    - McAfee: Also produce multi-platform antivirus for mobile devices as well as
    multi-device packages.

    - AVG: Offer both a free and a professional version of antivirus software for
    Android devices. As well as malware protection, the app can help you locate a
    lost or stolen device and remote wipe its contents.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_207_0.png)


    Above: Avast have a free mobile suite for Android devices.


    - Avast: Produce a free Android security suite, including malware protection,
    remote wipe and device location.


    ## Installing Mobile Antivirus


    Installing antivirus software on your tablet or smartphone is relatively straightforward.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_207_1.png)


    Above: Installing an antivirus app.


    - 1. Download the antivirus app, either direct from the developer or via an app
    store.

    - 2. Install the app on your phone and approve the requested permissions.

    - 3. Launch the antivirus app and follow the on-screen instructions.

    - 4. For location and remote wipe services, you will need to register the device
    on the developer''s website.


    ## Removing Apps


    Unlike PCs, app-based malware is unable to affect files and folders in the same
