    - Safe searching: You can filter explicit content from all search results (to
    understand how to use this feature, see the section on parental controls on pages
    129–33).

    - Signing in: Requires you to sign in before you can access the search engine.

    - Malicious content warnings: If a website is suspected of harbouring malicious
    content, there may be a warning next to it in the search engine results.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_103_1.png)


    Above: A warning on Google that a website may harm your computer.


    ## EMAIL SECURITY


    Whether you use an online webmail service or download your emails to your computer
    using programs such as Outlook, you can use various security features to help
    keep you safe. You can often adjust these security features by logging on to your
    email provider and going into the settings menu.


    - Security information: Add additional security information to your account, such
    as an alternative email address, mobile phone number or security question.

    - HTTPS: Some webmail providers such as Gmail offer HTTPS for added security.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_104_0.png)


    Above: Google Mail uses HTTPS for added security


    - Blocked content: Email providers may block images, attachments or other elements
    of an email if they appear to pose a threat.

    - Spam filters: Most email providers have some form of spam filter that can recognize
    not only spam, but also phishing content.

    - Antivirus scanning: Some email services have their own antivirus scanners that
    can be used when downloading attachments.

    - Reporting: Most email providers let you report malicious content, phishing and
    spam emails; doing so helps improve their security for all their users.


    ## SAFER SURFING TIPS


    Now you know how websites operate and understand some of the features available
    to help you safely surf the Internet, it is worth looking at how you interact
    with the World Wide Web and what you can do to limit Internet security threats.


    - Personal information: Never give out personal information unless you are sure
    you are on a verified, secure and safe website.

    - Security and privacy settings: Take advantage of the security and privacy settings
    provided to you by web browsers, websites and email providers.

    - Password safety: Never share passwords, ensure they are as strong as possible
    and change them regularly.

    - Unsecured or unknown websites: Be wary of using websites that are not HTTPS
    for any financial transactions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_105_0.png)


    Above: Make sure you have your updates turned on in your operating system.


    - Links: Avoid clicking links in emails, as they may not be genuine. Always type
    addresses in the URL bar or use search engines such as Google to find the websites
    you are looking for.

    - Keep up to date: Keep your browsers and security software up to date, as well
    as your operating system and any programs that access the Internet.


    ## SOCIAL MEDIA SECURITY


    The way we communicate has changed for ever. Social media has made keeping in
    touch and meeting new people so much easier, but it has also opened us up to a
    range of new threats to our privacy and security.


    ### THE SOCIAL MEDIA REVOLUTION


    Facebook has over one billion users worldwide, Twitter over 250 million, and email
    is now far more popular than postal mail as a means of communication. This has
    meant a dramatic shift in the way we communicate. However, when it comes to what
    we say and to whom we speak, many of us are still stuck in the old ways, and forget
    that what we post on the Internet can often be seen by almost anybody.


    ### Anybody and Everybody


    One of the most common mistakes people make when using social media is assuming
    that they are only speaking to their friends and followers. However, this is rarely
    the case. While you can implement all sorts of privacy settings on social media
    websites, you can never be certain your content will stay private.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_106_0.png)


    Right: There are countless social media platforms available.

    '
