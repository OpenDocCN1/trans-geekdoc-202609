    aspects of Internet security.


    ### Help For All


    You can read this book from cover to cover, or you can use it as a reference and
    turn to it whenever you need help with a different aspect of online security.
    We have tried to cover all aspects of web protection and Internet security, from
    keeping viruses and malware at bay to helping guard against hackers and ID fraudsters,
    as well as how to secure your Internet connection at home and ensure your children
    are using the Internet in safety.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_11_0.png)


    Above: This book will help you keep your children safe when they are online.


