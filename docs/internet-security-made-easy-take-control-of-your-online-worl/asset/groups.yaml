    ## ENCRYPTION KEYS AND IDENTIFIERS


    Perhaps the most important form of security on a modern wireless router is the
    encryption key you enter when connecting to the router. Most manufacturers provide
    each router with a unique key, but is often a good idea to regularly change it.


    ## Hot Tip


    Change your SSID in your router setting from the manufacturer''s default, as this
    will prevent hackers from knowing what type of router you have, making it harder
    for them to hack into it.


    ## SSID


    Service Set Identifier (SSID) is the name given to your router that you see in
    your network settings on your computer or smartphone. By itself, the SSID cannot
    be used to gain access to your network, but it does let people know your wireless
    router exists.


    ## SSID Broadcast


    Most routers let you prevent your SSID from being broadcast. If you turn this
    off, devices will not be able to find your router, but those already connected
    to it will remain connected.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_248_0.png)


    Above: You can usually find all your router details on a sticker on the back.


    ## Encryption Types


    Wireless routers come with some form of encryption, which scrambles the data sent
    over the network. Generally, there are two types of encryption offered by router
    manufacturers.


    - WPA (Wi-Fi Protected Access): A newer, more secure form of encryption. Always
    opt for this in your router settings if available.


    - WEP (Wireless Equivalent Privacy): An older, less secure form of encryption,
    although it is more compatible with devices than WPA.


    ## Router Position


    Finally, where you place your router in your home can affect security. Wireless
    routers are broadcast devices, so they can reach far beyond the confines of your
    home. To limit the range, try to install a router as close to the centre of your
    home as possible, rather than by windows or doors, where the signal can leak out.
    (This will also give you the best signal.)


