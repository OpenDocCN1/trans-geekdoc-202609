    of the most common Internet security terms in our Jargon Buster (see pages 248–251).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_12_0.png)


    Above: Different aspects of Internet security can be complicated but we won''t
    expect you to deal with anything like this!


    ### Step by Step


    Throughout this book, we have included step-by-step guides to steer you through
    some of the more technical aspects of Internet security, such as how to adjust
    your browser and computer settings, install antivirus software, and adjust your
    social media privacy so you are more secure when you use Facebook, Twitter and
    other networking websites.


    ### MALWARE AND VIRUSES


    One of the most common threats to your online security is malicious software,
    which can cause you all sorts of problems, from spying on your online activity
    in a bid to steal your passwords and usernames, to disabling your computer, erasing
    files or even using your machine to attack


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_13_0.png)


    other computers. In this book, we explain the difference between a computer virus
    and a Trojan horse, what spyware and adware are, and how to protect yourself from
    these and other malicious software threats.


    Above: We will explain the difference between Trojans and viruses and how to protect
    against them.


    ### Antivirus Software


    Antivirus software is one of the most crucial tools for keeping you safe online.
    In this book, we explain the different types of protection on offer, from free
    solutions that you can download and install for basic protection, to paid-for
    packages from some of the most respected names in Internet security software.


    > **Hot Tip**

    >

    > If your computer is already infected with a virus or other malware, this book
