    ## USING ANTIVIRUS SOFTWARE


    Once you have installed antivirus software on your computer, you will need to
    learn how to use it. Fortunately, most of the basic functions of antivirus software
    are easy to get to grips with, no matter which program you have opted for.


    ### INSTALLATION


    Antivirus software is installed in much the same way as any other software program.


    - Whether your software is on a disk or you have downloaded it, click the setup
    icon (on a Mac click the installer).

    - Follow the steps as indicated by the installer, for example click run when asked
    if you want to run the file, and choose a location where you want your software
    installed.

    - You may have to enter a registration key to activate your software.

    - Once installed, most antivirus software programs will run automatically but
    if yours does not, click on the program icon in either your program menu or in
    the antivirus folder.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_158_0.png)


    Above: You may be asked to enter a registration key; this will be on the box or
    will be sent to you by email.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_158_1.png)


    Above: Clicking the AVG icon in the program''s menu.


    ### Control Panel


    When your antivirus software is installed on your computer, you will see a small
    icon in the lower right-hand corner of your Windows taskbar (on a Mac, this may
    be in the top right, or you may have to open up System Preferences). When you
    double click this icon, it will bring up the antivirus control panel. Control
    panels for antivirus software normally include the different functions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_159_0.png)


    - **Computer**: This will tell you if your computer is protected. If you have
    not run an initial scan, this will show that action is required. There will normally
    be a Fix or Scan Now button.

    - **Internet**: Where you will find your browser protection tools.

    - **Emails**: Where you can run email scans.

    - **Firewall**: Where you can turn on and control your antivirus firewall (if
    included).

    - **Others**: You may have sections for identity protection, parental controls
    and other additional features included in your antivirus software.

    - **Updates**: Where you can update your antivirus software.


    Above: Norton control panel.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_159_1.png)


    Above: McAfee control panel.


    ### SCANNING


    When your antivirus software is installed it will most likely ask you if you want
    to run an initial scan. This is important as it will check your hard drive for
    any existing threats and remove them. If you are not prompted to run an initial
    scan, go into the control panel of your antivirus software. You will probably
    find a simple interface, with a section labelled Scanning: go into this and run
    a full scan.


    > **Hot Tip**

    > Most antivirus software will allow you to schedule when you want updates. Make
    sure you update it daily, perhaps when you first boot up your machine. That way,
    you will always be protected from the most recent threats.


    ### Update


    Before your antivirus software can run a full scan it may need to update its virus
    database so it can spot recent threats. This may take several minutes. Most software
    will do this automatically, but it may prompt you with a window asking for your
    permission to update; just click yes.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_160_0.png)


    Above: Running a scan in AVG.


    ### SETTING UP YOUR PROTECTION


    When installed, antivirus software normally starts in a default mode, which ensures
    your system is secure from the outset. However, this default mode may not provide
    you with all the features you require in operation, or it may be too strict, slowing
    the performance of your machine down as it runs unnecessary scans. You can adjust
    the various different settings to ensure you are getting the most out of your
    antivirus software.


    ### Shield


    Your antivirus shield is normally in the **Computer** protection settings. The
    purpose of the shield is to stop threats entering your computer, but the way it
    does this can be adjusted using a settings menu (you may have to double click
    the **Computer** tab to see the settings menu or click a **settings** link).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_161_0.png)


    Above: Adjusting shield settings in Avast.


    - **Permission:** Your antivirus software may remove threats automatically or
    you can set it to ask your permission first.

    - **Reporting:** The software may be able to report potentially unwanted programs
    or possible threats that are not yet on its database.

    - **Heuristics:** Enabling heuristics lets your antivirus software look for suspicious
    behaviour or code.


    > **Hot Tip**

    > A full computer scan can take some time and can slow your computer down. It
    is perhaps more practical to schedule a scan on a weekly basis or before you shut
    down your machine, rather than when you turn it on.


    ### Scans


    There are all sorts of options available in the scanning settings on most antivirus
    software.


    - **Media:** You can scan removable media plugged into your machine, your hard
    drive or specific files and folders.

    - **Schedules:** Allows you to schedule full or partial scans at regular intervals.

    - Files: You can set your antivirus to scan files when you open or close them.

    - Extensions and cookies: You can scan items in your Internet browser, such as
    cookies, toolbar extensions and browser helper objects (more on these on pages
    235–37).


    ### Email Scanning


    Scanning emails can protect your computer from malware threats sent in attachments
    and can also prevent you from infecting other people''s machines. You can choose
    whether to scan inbound or outbound emails or both.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_162_0.png)


    Above: Adjusting email settings in AVG.


    ### Web Browser Protection


    Different antivirus solutions offer all sorts of protection when you are surfing
    the Internet, most of which can be adjusted in the settings.


    - Identity protection: This sort of protection can guard you against phishing
    and spyware. However, as no system is infallible, it may block innocent emails,
    so you can choose whether to have it warn you or remove threats automatically.

    - Malicious web pages: Most antivirus software has some form of web shield that
    protects you from malware hidden in web pages. This can be adjusted in the settings.

    - Toolbars and browser extensions: Some antivirus software provides you with tools
    that can be installed on your browser, such as safe search bars.

    - Search protection: Some antivirus has software that runs on search engine pages,
    providing information about whether a website is trusted or may contain a threat.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_163_0.png)


    ### Updating


    It is not only the virus database that can be updated, but most antivirus developers
    also release updates to the software, and it is important to regularly install
    these.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_163_1.png)


    ### Quarantine


    The quarantine, sometimes called a virus vault, is where your antivirus software
    places threats it has not removed. Once in quarantine, threats can no longer cause
    harm, as they are isolated from the computer. If the file is innocent and needed
    by a program to run, you may find that program stops working, which is why it
    is a good idea to set your antivirus software to quarantine threats before deleting
    them.


    Left: AVG safe search icons show next to Google search results.


    - Schedule: You can schedule your antivirus software to delete threats in your
    quarantine after a certain time, enabling you to check whether the files are not
    needed. Alternatively, you can delete threats manually.

    - Size of vault: You can also allocate how much of your hard drive you want to
    set aside for the virus vault.


    > **Did You Know?**

    > Your antivirus software will keep a record of all the threats it has found and
    will normally provide statistics in the settings menu, allowing you to evaluate
    the effectiveness of your software.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_164_0.png)


    Above: Adjusting the size of the virus vault in AVG.

    '
