    ## ONLINE SECURITY AND CHILD SAFETY


    ### WEB BROWSING SECURITY


    Web browsers provide us access to the World Wide Web, but you can also use them
    to keep you safe online. In this section, we will explore how web browsers interact
    with websites and how the various features and functions can protect us online.


    ### WEB NAVIGATION


    When we think of websites, we often think in terms of ‘visiting’ a web page. However,
    this is not strictly accurate. When we enter a website address into our browser
    or click on a link, our web browser connects with the server hosting the website
    and downloads all the information to our computers. In other words, we are not
    visiting a website, but the website is visiting us. This is why it is important
    to have Internet security systems such as antivirus software and firewalls, because
    we are allowing all this data onto our machines.


    ### HTML


    Web pages function using HTML (HyperText Markup Language), which provides the
    content of a web page and defines how the web browser should display it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_93_0.png)


    Above: A web page is made up of HTML code.


    ### Browser Interaction


    Not only do web browsers download information from a web server to our computers,
    but they also provide information the other way. To understand the sorts of security
    issues that can arise from web browsing, it is important to understand the sorts
    of information we are inadvertently handing over each time we visit a web page.


    - IP address: When we visit a website, our browser tells the web server the IP
    address of our computer, which allows the website to know where to send the page.


    - System information: In order to ensure the web page is presented correctly,
    web browsers provide information relating to the computer environment we are using,
    such as the operating system and browser type.


    > Did You Know?

    > Websites can use your IP address to discern your approximate location. This
    helps some services, such as search engines, to offer you results based on where
    you live.


    - Linked page: If you have visited a page from a search engine or link, the web
    browser will also provide this information to a web server.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_94_0.png)


    Right: Services such as Google Maps use our IP address to identify our location.


    ### STORING INFORMATION


    When we visit a website, our Internet browsers also store information on our computers
    about our interaction.


    - History: Your browser stores a history of every page that you visit, including
    the date and time of your visit.


    - Cache: Your browser temporarily stores certain aspects of web pages on your
    computer, such as images and HTML. This helps speed up the loading of the web
    pages you visit more frequently.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_95_0.png)


    - Forms, searches and passwords: Your browser may also retain passwords and usernames
    for different sites, as well as information you include in forms.


    ### Clearing Browser Data In Internet Explorer 9


    To clear your web-browsing history in Internet Explorer:


    - 1. In the Tools menu choose Safety.


    - 2. Click Delete browsing history.


    Left: Deleting browser history.


    - 3. Select the types of history you want to delete, such as browsing history
    and/or temporary Internet files (cache).


    - 4. You can retain the cache just for your most-visited websites, by checking
    the Preserve Favorites website data box.


    You''ve gone incognito. Pages you view in this window won''t appear in your browser
    history or search history, and they won''t leave other traces, like cookies, on
    your computer after you close all open incognito windows. Any files you download
    or bookmarks you create will be preserved, however.


    Going incognito doesn''t affect the behavior of other people, servers, or software.
    Be wary of:


    - Websites that collect or share information about you


    - Internet service providers or employers that track the pages you visit


    - Malicious software that tracks your keystrokes in exchange for free smileys


    - Surveillance by secret agents


    - People standing behind you


    Learn more about incognito browsing.


    Because Google Chrome does not control how extensions handle your personal data,
    all extensions have been disabled for Incognito windows. You can reenable them
    individually in the extensions pane.


    Above: When using Chrome, pressing Ctrl, Shift and N brings up the Incognito window.


    > **Hot Tip**

    >

    > If you do not want your web browser to record your page history, some browsers
    offer ''private'', ''incognito'' or ''anonymous'' browsing options.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_96_0.png)


    Above: Clearing browser data in Chrome.


    ### Clearing Browser Data in Chrome


    To clear your web history in Chrome:


    - 1. Click the Chrome menu on the browser toolbar (the three horizontal stripes).


    - 2. Select Tools, and then Clear browsing data.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_96_1.png)


    - 3. A window will appear, providing you with a list of checkboxes for the types
    of information you wish to remove.


    Above: Choose what history to delete.


    ### Clearing Browser Data in Firefox


    - 1. Click the menu button (three horizontal stripes).


    - 2. Choose History and then Clear browsing history.


    - 3. Select how far back you want to delete your history, or choose everything.


    - 4. Select what information you want to erase, such as browsing history, cache
    or cookies.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_97_0.png)


    Above: Clearing history in Firefox.


    > **Hot Tip**

    > We have included instructions for clearing web history in the most popular browsers.
    In other browsers or older versions of the ones listed, search for the right option
    by opening the settings panels.


    ### COOKIES


    Not only do our web browsers store information about our visit to a web page,
    but websites do so too. In order to improve our user experience, websites store
    information in cookies. Cookies are simply pieces of code stored on our computers.
    Generally, cookies do not pose too much of a security threat. However, if you
    would rather not have them on your system, you can also clear cookies in a similar
    way as clearing web-browsing history.


    ### Clearing and Blocking Cookies


    You can clear, restrict and permit cookies in web browsers:


    - Internet Explorer: Select the Cookies check box when deleting browser history.


    - Firefox: Follow the instructions for clearing web history.


    - Chrome: Go into the Settings menu (three horizontal stripes), click the advanced
    settings link and clicking Content settings under Privacy.


    ### ANONYMOUS BROWSING


    Even if you are blocking cookies or using a private browsing session, websites
    will still know your IP address because it is needed to deliver content to you.
    However, it is possible to visit websites anonymously by using an intermediary
    service, known as a proxy server.


    ### Proxy Servers


    A proxy server is a server located between you and the website you want to visit.
    When you connect using a proxy server, a website sees only the details of the
    proxy. However, using a proxy server is not without its risks. Some proxy servers
    are set up to entrap people, for example sending you to websites that look like
    your bank or email provider but which are, in fact, fake phishing web pages. Therefore,
    if you intend to use a proxy server, you need to ensure it is trusted. Websites
    such as www.publicproxyservers.com can help you find a proxy.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_98_0.png)


    Above: Deleting cookies in Chrome.


    > Hot Tip

    >

    > Some websites such as www.kproxy.com and www.hidemyass.com offer anonymous browsing
    without the need of a proxy server. You can also download anonymous browser programs
    such as Tor (www.torproject.org).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_98_1.png)


    Above: The Tor Project provides a completely anonymous browser.


    ### Using A Proxy Server On Windows


    - 1. To use a proxy server, open Internet Options in your Control Panel.


    - 2. Select Network and Internet Connections.


    - 3. Click Internet Options and select Connections.


    - 4. Choose LAN Settings.


    - 5. Under Proxy server, select the Use a proxy server for your LAN check box.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_99_0.png)


    Above: Connections in Internet properties.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_99_1.png)


    - 6. Enter the IP address of the proxy server and port number, and click OK.


    > **Hot Tip**

    >

    > For information on browsing more privately on mobile devices, such as smartphones
    or tablets, see the section on Wireless and Bluetooth Security on pages 193–200.


    Above: Entering a proxy address and port number.

