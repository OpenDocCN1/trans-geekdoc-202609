    ## Candy from a Baby


    Another reason why so many people get involved in cyber crime is that it can be
    very easy, primarily because so many computers lack adequate Internet security,
    which makes them vulnerable to attack.


    ## Continual Access


    In the early days of the Internet, when somebody wanted to connect, they would
    plug a phone line into a modem, and when they finished, they would disconnect
    again. These days, most homes have high-speed, always-on connections, which can
    cause security issues.


    - Constant point of entry: An Internet connection serves as a point of entry for
    attack, and always-on connections mean this point of entry is always open.

    - Static IP (Internet Protocol) address: With dial-up modems, IP addresses changed
    every time you connected to the Internet, which made it harder for attackers to
    locate you. Modern connections have IP addresses that never change.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_50_0.png)


    > **Did You Know?**

    >

    > An IP address serves as a unique location identifier. They are normally a series
    of one to four digit numbers separated by dots, for example 1.160.10.240.


    Above: IP addresses are unique numbers that can be used to identify your location.


    ## SYSTEM VULNERABILITY


    Computer systems and software are always advancing in complexity. As software
    developers strive to add new features to their products, operating systems and
    programs become increasingly complex, and this complexity makes it difficult to
    identify weak points and vulnerabilities. While software developers try to identify
    problems before they release the product, quite often software contains inherent
    flaws when it hits the market, which hackers can take advantage of.


    ## Operating Systems


    The main program used by your computer to manage your hardware and software is
    known as the operating system (OS). Flaws in operating systems are particularly
    common, primarily because they are such large programs and have to do so many
    different tasks. OS developers constantly release updates to fix problems. However,
    by the time the update is released, malicious programs or hackers may have already
    exploited these flaws.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_51_0.png)


    Above: Microsoft''s Windows series is the most common operating system for PCs,
    but others include Linux, OS X for Macs, and iOS and Android for smartphones and
    tablets.


    ## Internet Browsers


    Web browsers, such as Internet Explorer, Chrome and Safari, are the main applications
    used to interact with the World Wide Web.


    > **Did You Know?**

    >

    > When software and operating system manufacturers identify vulnerabilities, they
    often release a fix known as a patch that you can download to ''patch up'' the
    problem.


    As such, web browsers are exposed to more malicious content than other programs
    on our computers. Malicious websites and malware often exploit weaknesses in web
    browsers as a means of attack. As with operating systems, browsers require regular
    updates to fix these vulnerabilities.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_52_0.png)


    Above: Make sure you set your Internet browser to install updates.


    ## Other Software


    Web browsers and operating systems are not the only software to contain vulnerabilities
    that can be exploited by attackers. These days, all sorts of programs require
    access to the Internet, from games to office programs, and if there are flaws
    in these applications, it can be a way in for a malicious user.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_52_1.png)


    ## HARDWARE VULNERABILITIES


    Software is not the only aspect of our computers that can contain vulnerabilities;
    much of the hardware we use to connect to the Internet can also be flawed or improperly
    installed, leaving us open to attack.


    > **Hot Tip**

    >

    > If you use a wireless router, make sure you use a password for connecting to
    it, otherwise anybody could gain access to your Internet connection.


    ## Routers


    A router is the device that lets you connect to the Internet. Its main function
    is to forward Internet data to and from our computers. In this respect, it acts
    as a gateway, so any vulnerability in a router can result in an easy way in for
    attackers. These days, most people use wireless routers, which have the added
    risk of people being able to exploit the Wi-Fi signal to access our systems.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_53_0.png)


    Above: A secure Wi-Fi connection requires a password for access.


    ## FIREWALLS


    Firewalls are either software or hardware gateways that act as barriers, blocking
    data coming from the Internet unless it adheres to certain rules or criteria.
    Not having a firewall installed can result in your Internet connection being an
    open door for any hacker or malicious software to enter your system.


    ## INSTALLING SOFTWARE FIREWALLS


    Some of the most common operating systems come with a firewall built in. We will
    discuss how to use firewalls in more detail on pages 165–68, but in the meantime,
    if you want to know how to activate your firewall, just follow these steps.


    ## Windows


    - 1. Click Start and select Control Panel.

    - 2. In Windows XP select Security Center, in Windows 7 or 8 select System and
    Security.

    - 3. In Windows XP check the round red button next to Firewall so it goes green.
    In Windows 7 or 8, click the link that says Turn Firewall on or off and check
    the button that says Turn on Windows Firewall.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_54_0.png)


    Above: In Windows, the firewall settings are contained in the control panel settings
    for System and Security.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_54_1.png)


    Above: Turning the firewall on in Windows.


    ## Mac OS X


    - 1. Click the Apple symbol (top left) and select System Preferences in the pull-down
    menu.

    - 2. Select Security or Security & Privacy.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_54_2.png)


    Above: In Mac OS X, select Security & Privacy in System Preferences.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_55_0.png)


    - 3. Click the Firewall tab. You may have to unlock the pane by clicking the lock
    in the lower-left corner and entering an administrator username and password.

    - 4. Click Turn on Firewall or Start to activate the firewall.


    Above: Turning the firewall on in OS X.


    > **Did You Know?**

    >

    > Due to the way smartphones and tablets connect to the Internet, there is little
    need for firewalls on these devices, although some firewall and security apps
    have been developed. (For more information see pages 205–06.)


    ## HUMAN VULNERABILITY


    Hardware and software vulnerabilities are not the only weak links in the Internet
    security chain. Quite often, users are responsible for letting in threats such
    as viruses or hackers. For instance, opening email attachments from people you
    do not know is one of the most common ways viruses get onto machines.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_55_1.png)


    Above: Email attachments can be a source of malware.


    ## Education


    While most people have concerns about Internet security and are aware of threats
    such as viruses, few people keep themselves up to date with the different ways
    to protect a computer system from attack. This is partly due to the rapid rate
    at which Internet technology advances, and secondly, users often install some
    form of security, such as antivirus software, and think that it will offer them
    100 per cent protection, which is rarely the case. Internet security requires
    a holistic approach, with good practices running in tandem with hardware and software
    solutions.


    ## Common Bad Practices


    Computer users are often guilty of some common computer bad practices that make
    them more vulnerable to attack.


    - No protection: Having no Internet security systems in place, such as antivirus
    software and firewalls, can almost guarantee your computer will suffer from an
    attack at some point.

    - Passwords: Weak passwords, using the same password for all accounts, or divulging
    your passwords to other people are also common reasons why people suffer an online
    attack.

    - File sharing: While peer-to-peer file sharing is a useful way to swap files
    with people you know, files from unknown sources can sometimes contain viruses.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_56_0.png)


    Above: Files from file-sharing websites, such as ISO Hunt, can sometimes contain
    viruses.


    - Attachments: Opening attachments from people you do not know, or not having
    some antivirus software to scan them, can unleash malware.

    - Personal details: Giving out too much personal information on social media websites
    can lead to people guessing passwords or knowing enough to assume your identity
    (identity fraud).

    - Out-of-date software: Running old software or not updating operating systems,
    programs and antivirus software can make a computer vulnerable.

