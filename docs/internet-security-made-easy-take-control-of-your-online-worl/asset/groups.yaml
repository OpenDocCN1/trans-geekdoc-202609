    # # ORIGINS OF THE WWW


    It is difficult to imagine the world without the Internet. Yet the Internet as
    we know it is just a few decades old and it is all down to just one man and his
    creation – the World Wide Web.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_17_0.png)


    # ## THE HISTORY OF THE WEB


    The Internet has been around since the late Sixties. It grew out of a US Defense
    Department project called ARPANET (Advanced Research Projects Agency Network).
    This was a project designed to develop a secure computer communications network
    that could be used in the event of war (this was during the height of the Cold
    War) and started as a number of computer connections between various universities
    and research institutes.


    # ### Text-based Communication


    The early Internet was great for exchanging text-based information (the first
    email was sent in 1971). There were no pictures, videos, search engines, or even
    links to other websites, just pages of text, and finding a page was extremely
    difficult, as you needed to know the telephone number for the computer modem where
    the page was based. For this reason, the only people who ever used it were academics
    and researchers.


    Left: Early Internet usage was completely text-based.'
  - '[PAGE 18]


    # THE FATHER OF THE WEB


    The early Internet was not easy to use. Different computers used different languages,
    so exchanging information and making improvements to the Internet proved difficult.
    It took a British scientist at the European particle physics laboratory, CERN,
    to identify what was needed. Tim Berners-Lee came up with the idea of a standard
    Internet, where all users used the same language and protocols. He called it the
    World Wide Web.


    # Developments


    To enable the creation of the World Wide Web, Tim Berners-Lee brought together
    several ideas and innovations, which included the following.


    +   o HTML (HyperText Markup Language): A universal language used by all web pages
    to format, exchange and publish information.


    +   o URL (Uniform Resource Identifier): A unique address for each website, allowing
    users a simple method of gaining access to a website.


    +   o HTTP (HyperText Transfer Protocol): Developed in conjunction with the computer
    mouse, HTTP allowed web pages to be connected by use of hypertext words, now commonly
    called links.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_18_0.png)


    Above: Tim Berners-Lee created the World Wide Web as we know it today.


    # Did You Know?


    At the end of 1992, there were only 26 websites in existence on the World Wide
    Web. Today, there are over a trillion web pages on hundreds of millions of websites.'
