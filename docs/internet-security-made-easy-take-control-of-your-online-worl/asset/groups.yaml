    When we visit a website, our Internet browsers also store information on our computers
    about our interaction.


    +   History: Your browser stores a history of every page that you visit, including
    the date and time of your visit.


    +   Cache: Your browser temporarily stores certain aspects of web pages on your
    computer, such as images and HTML. This helps speed up the loading of the web
    pages you visit more frequently.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_95_0.png)


