  - '[PAGE 172]


    # # OTHER PROTECTION SOFTWARE


    Antivirus and firewalls are not the only software available to guard you against
    online threats. Some malware can be difficult to detect and an array of additional
    tools and techniques is available that can help keep you secure.


    # ## JAVA AND FLASH THREATS


    One of the major weaknesses on a computer when it comes to online threats is the
    plug-ins used by browsers that allow multimedia and interactions on websites.
    These are known as Flash and Java, and malicious programmers often use the inherent
    weaknesses in these plug-ins to attack computers.


    # ### Java


    Java is a browser plug-in, used by some websites to show content. However, Java
    is a bit like running a virtual computer on your browser, and Java programs run
    on this virtual environment. This means a malware program can be written to infect
    Java, and it will run on any computer, PC or Mac, and your firewall and antivirus
    software can do little to guard against these threats.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_172_0.png)


    Above: Java is used by a lot of websites for running multimedia.


    # ### Flash and Shockwave


    Flash and Shockwave are plug-ins created by Adobe to run multimedia such as videos
    and streaming content. As with Java, malicious programs can attack these plug-ins.
    However,'
  - '[PAGE 173]


    Adobe regularly releases updates to ensure its products are secured against malware,
    so the best way to protect your machine from Flash and Shockwave threats is to
    ensure you update regularly.


    **Hot Tip**


    You can ensure you have the latest versions of Flash by downloading it directly
    from https://www.adobe.com/support/flashplayer/downloads.html, and the latest
    Shockwave at http://get.adobe.com/shockwave/


    # Disabling Java


    While Java regularly releases updates to protect against threats, some users prefer
    to disable it in their Internet browser unless they are on a website they trust.


    # Disabling Java on a PC


    +   1. Click the Start menu and scroll through your programs until you find Java.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_173_0.png)


    Above: Disabling Java in the Java control panel.


    +   2. Select Configure Java to launch the Java Control Panel.


    +   3. Click the Security tab and uncheck the Enable Java content in the Browser.


    +   4. Click Apply.


    # Disabling Java on a Mac


    +   1. Click on the Apple icon on upper left of your screen and go into System
    Preferences.


    +   2. Click on the Java icon to launch the Java Control Panel.'
  - "[PAGE 174]\n\n+   3. Click the Security tab and uncheck the Enable Java content\
    \ in the Browser.\n\n+   4. Click Apply.\n\n# OTHER MALWARE TOOLS\n\nWhen looking\
    \ for software online, it is important you do your homework. The Internet is full\
    \ of disreputable companies claiming they have legitimate products, but which\
    \ in fact are selling ineffectual software packed with spyware, adware and other\
    \ malicious programs. While you certainly have to be careful when downloading\
    \ anti-spyware and other software from the Internet, there are still some useful\
    \ tools available that can help keep you safe and clean your computer from malware\
    \ threats.\n\n> # Hot Tip\n> \n> Beware of adware that warns you that spyware\
    \ has been detected on your machine, which can be remedied by buying a certain\
    \ spyware removal program. Normally, these anti-spyware tools install more malware\
    \ and force you to buy more anti-spyware products further down the line.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_174_0.png)"
  - '[PAGE 175]


    # # MALWARE DETECTION TOOLS


    Because no antivirus software system is perfect, you may never know when a malware
    threat has managed to slip past your security suite and infected your machine.
    Malware detection tools are not antivirus software as such, but are designed as
    extra levels of security to help spot threats you may not even be aware of. Often
    these are good for occasional scans and can be used alongside your standard antivirus
    software.


    # ## Malwarebytes (http://www.malwarebytes.org/)


    Malwarebytes is a simple-to-use malware scanner for Windows machines that can
    spot and remove threats your standard software may have missed. It also includes
    a tool called FileASSASSIN, which can help delete locked files, caused by either
    malware or errors in Windows.


    # ## Super Antispyware (http://www.superantispyware.com/)


    This is another free Windows malware scanner and removal tool designed to spot
    spyware threats. It is compatible with most major antivirus software suites, so
    gives great additional security for ensuring your PC is spyware free.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_175_0.png)


    Above: Malwarebytes can scan for malware threats that your antivirus may have
    missed.


    # ## Spybot Search and Destroy (http://www.safer-networking.org/)


    One of the most popular free spyware removal tools that works on any Windows machine,
    including older operating systems, such as XP, Windows 98 and even Windows 95.'
  - '[PAGE 176]


    # Microsoft Safety Scanner (http://www.microsoft.com/security/scanner/en-gb/default.aspx)


    A free downloadable security tool for Windows machines that provides a one-time
    scan and helps remove viruses, spyware and other malicious software. It works
    with your existing antivirus software and erases itself off your machine after
    10 days.


    # BOTNET SCANNERS


    Botnets are among the toughest online threats for antivirus software to detect.
    Creators of botnet malware are for ever finding weaknesses in operating systems
    which they then use to infect machines and recruit as botnets.


    # BotHunter (http://www.bothunter.net/)


    Rather than relying on a database to recognize bots or analysing a computer for
    suspicious activity, BotHunter, which is a free program, listens to the Internet
    traffic through your machine for telltale signs of a botnet. When it spots a threat,
    it removes it and informs a database kept by its developers so that other machines
    can be cleaned of the same threat.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_176_0.png)


    # RUBotted (http://free.antivirus.com/us/rubotted/)


    Another free program that works in a similar way to BotHunter, RUBotted monitors
    your computer for potential infection and suspicious activities associated with
    bots. Upon discovering a potential infection, RUBotted will identify and remove
    it with its HouseCall cleaner.


    Right: BotHunter is one of the best tools for detecting bots on your computer.'
  - '[PAGE 177]


    # # REGISTRY CLEANERS


    Your system registry is what Windows computers use to store the configuration
    of the operating system. The registry is often targetted as it means the malware
    will be installed whenever the machine boots up. While most antivirus software
    cam remove registry threats, there are a couple of tools you can use to remove
    registry entries yourself.


    > > **Hot Tip**

    > > You should never make changes to your system registry without knowing what
    you are doing and first backing up.

    > > Changes to your system registry can result in system crashes, requiring the
    reinstallation of your operating system and the loss of data.


    # **HiJackThis (http://sourceforge.net/projects/hjt/)**


    This free tool scans the registry reports and registry entries that could have
    been altered or tampered with by spyware, malware or other malicious programs.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_177_0.png)


    Above: You should only use registry cleaners such as HijackThis if you are confident
    that know what you are doing.


    # **CCleaner (https://www.piriform.com/CCLEANER)**


    This free program removes entries for non-existent applications in your Windows
    registry, fixes invalid or corrupted entries, cleans out temporary files, cookies
    and cached items in your'
  - '[PAGE 178]


    browser, as well as removing temporary and log files on Windows. It even empties
    your recycling bin.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_178_0.png)


    # PC SECURITY


    Because many of us keep important documents on our computers, not to mention all
    those passwords and usernames stored in cookies on our browsers, having a system
    in place to secure all this data can give you peace of mind in case your computer
    is lost or stolen.


    # Windows Bitlocker


    Bitlocker is installed On Windows 7 and Windows 8 operating systems. Bitlocker
    isn''t enabled by default, but you can activate it by checking the box in System
    and Security in the Control Panel. Bitlocker automatically encrypts the hard drive
    and protects everything from documents to saved passwords.


    # OTFE


    (http://www.portable freeware .com/?id=698) If your operating system does not
    have Bitlocker, you can download OTFE for free, which encrypts files on Windows
    machines, including Windows Mobile, and encrypts all files before they are stored
    on your hard drive.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_178_1.png)


    Above: Turning on Bitlocker in the Windows System and Security menu.'
