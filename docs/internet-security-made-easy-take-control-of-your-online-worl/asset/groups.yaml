    settings. Most come with software that you can install on your hard drive to access
    the functions, but this is actually not required, and the simplest way to reach
    your router or firewall''s configuration settings is to open an Internet browser
    and enter the device''s IP address in the address bar. You can normally find this
    on a sticker attached to your device. If you cannot find it, go online and visit
    your manufacturer''s support pages.'
