    ### 功能\n\n这是一款非常基础的系统，具备良好的恶意软件防护，但只有基础的防火墙和家长控制功能。\n\n### 评测\n\n许多人喜欢 Smart Suite\
    \ 的简洁性，但也有人批评其无法像可比系统那样有效地处理威胁。PC 杂志为最新版本的 Smart Suite 评出了 5 分中的 2.5 分。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_153_1.png)\n\
    \n## 比特防卫\n\n比特防卫由罗马尼亚公司 Softwin 于 2001 年推出，在杀毒软件领域算是后来居上的新秀，但已凭借对在线威胁的防护赢得了良好声誉。\n\
    \n### 费用\n\n比特防卫提供三个基础套餐：Antivirus Plus（£39.95/$49.95）、Internet Security（£49.95/$69.95）和\
    \ Total Security（£59.95/$79.95）。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_154_0.png)\n\
    \n### 功能\n\n即使是比特防卫的基础套餐 Anti Virus Plus，也包含了在可比软件中需要付费才能获得的众多功能。这些功能包括防钓鱼、身份盗窃监控、密码管理、私人数据保护、金融交易防护以及\
    \ Facebook 个人资料扫描器，而更高级的套餐则具备远程管理和多设备家长控制功能。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_154_1.png)\n\
    \n### 评测\n\n大多数独立测试将比特防卫的得分远高于平均水平，其 Anti Virus Plus 在 PC 杂志中获得了 5 分中的 4.5 分。\n\
    \n左图：比特防卫是获奖的杀毒软件。\n\n## 微软安全基础\n\nMicrosoft Windows 的最新版本 Windows 8 自带名为 Windows\
    \ Defender 的杀毒程序。对于旧版 Windows，Microsoft Security Essentials 可在以下网址下载：http://windows.microsoft.com/en-GB/windows/security-essentials-download/，不过对\
    \ Windows XP 的支持现已结束。\n\n### 费用\n\n尽管它仅适用于运行 Windows Vista Service Pack 1 或 Service\
    \ Pack 2、Windows 7 和 Windows 8 的 Windows PC 用户，但对于家庭用户和小型企业（最多 10 台设备）完全免费。然而，即使它是免费的，质量好吗？\n\
    \n> 热贴士\n> \n> PC 杂志 (http://pcmag.com) 对几乎所有生产的杀毒软件进行评测和测试，因此是发现可用解决方案的优缺点的良好资源。\n\
    \n### 功能\n\nMicrosoft Security Essentials 文件相当小（24 MB），但包含了付费软件的所有基本杀毒功能，例如恶意软件防护、实时扫描和监控，\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_155_0.png)\n\n以及系统还原功能。它也易于使用，并与 Windows\
    \ 防火墙并行运行。\n\n### 评测\n\n许多独立测试人员发现，虽然 Microsoft Security Essentials 在保护和清除在线威胁方面工作尚可，但它无法提供与某些付费解决方案同等级别的防护。不过，它在\
    \ PC 杂志中仍获得了 5 分中的 3 分，优于一些最昂贵的解决方案。\n\n上图：Windows 8 机器上预装了名为 Windows Defender\
    \ 的 Windows Essentials 版本。\n\n## 其他免费程序\n\nMicrosoft Security Essentials 并非唯一可用的免费杀毒防护。其他开发者也提供免费版本。其中一些是基础套餐，可以通过付费升级获取附加功能，而另一些则提供免费的家用版本，但向企业用户收费，希望个人用户的积极体验能鼓励企业购买。\n\
    \n- AVG (http://www.avg.com/): 迄今为止最受欢迎的免费杀毒软件，用户可获得基础恶意软件防护、链接防护和文件粉碎功能，但可以付费升级以获取防垃圾邮件、在线防护盾和防火墙。\n\
    \n- Avast (http://www.avast.com/): 同样提供升级服务，以改进免费版本的基础恶意软件防护，增加金融交易防护、防火墙和防垃圾邮件防护。\n\
    \n右图：AVG 是目前最受欢迎的免费杀毒软件。\n\n> 热贴士\n> 您可以通过安装试用版和免费版并让其扫描计算机，亲自测试多个杀毒解决方案。您可能会发现某些解决方案能发现其他方案遗漏的计算机威胁。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_156_0.png)\n\n- Avira (http://www.avira.com/):\
    \ 声称能检测 99.99% 的恶意软件。Avira 还附带一个带有防钓鱼工具和社交媒体防护的浏览器工具栏。\n\n- Panda Cloud (http://www.cloudantivirus.com/):\
    \ 一款商业产品的免费版本，在轻量级包中提供基础防护。\n\n## 商业用户\n\n某些杀毒软件开发者允许其免费版或家用版被中小型企业使用。这样做可能在财务上合理，因为您将获得可能足以满足需求的基础防护级别。然而，拥有数百台设备需要防护的大型组织，或对安全性有更高需求的公司，应考虑选择主要杀毒软件开发者的商业套餐。\n\
    \n### 商业套餐\n\n使用商业套餐，您可以通过网络部署杀毒软件，而不必在每台机器上单独安装。商业软件的许可证通常为期两年以上（与家用版的一年相对），虽然它仅限于\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_157_0.png)\n\n- 您需要保护的机器越多，就需要购买越多的许可证——每台机器的成本通常比使用家用许可证更便宜。\n\
    \n左图：大多数杀毒软件开发者都生产其软件的商业版本。\n\n"
