    # Hacker


    A person who gains unauthorized access to a computer or network, either for malicious
    purposes or to test security.


    # Heuristics


    Often used to describe a type of antivirus solution that can spot malware by suspicious
    behaviour rather than having to identify its signature on a database.


    # HTML


