    # # Monitoring Your Finances


    Because of the prevalence and growing threat of identity fraud, it is important
    to check your personal finances regularly and be on the alert for unusual activity.


    +   - **Not receiving bills:** If your usual bills or statements stop arriving,
    it could be a sign that someone has changed the account address.

    +   - **Credit cards:** If you are sent credit cards that you did not apply for,
    somebody else may have ordered them in your name.

    +   - **Statements:** Receiving financial statements from organizations you do
    not remember signing up to is a common sign of identity fraud.

    +   - **Refusal of credit:** If you have been denied credit, it may be because
    somebody else has obtained credit in your name and damaged your credit history.

    +   - **Statement items:** Anything on your bank or credit card statement that
    you do not remember purchasing needs investigating.

    +   - **Phone calls:** Unexpected calls from debt collectors, financial organizations
    and banks can often be a sign that your identity has been stolen.


