    no technical solution is 100 per cent guaranteed and a determined teen may find
    ways around the restriction, so it is important to continue monitoring and discussing
    their web use with them.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_129_0.png)


    Above: Selecting Search Settings in Google.com settings.


    ## SAFE SEARCHING


    You can prevent search engines from bringing up inappropriate content by using
    the ''safe search'' mode.


    ## Safe Search in Google


    To set up safe search in Google, follow these steps.


    - 1. On the Google homepage (www.google.com), click the settings link on the bottom
    right-hand corner.

    - 2. Select Search Settings.

    - 3. Check the Filter explicit results box.

    - 4. Click Save at the bottom of the page.

    - 5. You can lock safe search by setting up a Google account and clicking the
    Lock Safesearch link, which will require a password to unlock it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_129_1.png)


    Above: Filtering explicit content from results pages.


    ## Safe Search in Bing


    To turn on safe search in Bing, do the following:


    - 1. On the Bing homepage (www.bing.com) click More at the top of the page.

    - 2. Select Account under My Bing.

    - 3. Under Safesearch choose either Strict (no adult content), Moderate (allows
    some adult content but filters out hardcore pornography) or Off (no restrictions).


    ## Safe Search UK


    For families with young children, you may wish to use Safe Search UK as your default
    search engine (http://www.uk.safesearchkids.com/), which is a search engine powered
    by Google, but with safe search permanently on.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_130_0.png)


    ## PARENTAL CONTROLS


    As well as using safe search modes in search engines, you can use parental controls
    installed in your operating system or by a third-party service. Note that you
    have to set up these controls on every device your child has access to. (For details
    about setting up parental controls in mobiles and tablets, see page 207.)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_130_1.png)


    Right: Safe Search UK is a more child-friendly search engine as it automatically
    filters out adult content.


    ## WINDOWS FAMILY SAFETY


    Windows has a parental control feature called Family Safety. While it comes installed
    as standard on Windows 8 machines, for older operating systems (from XP onwards),
    you have to download and install the Windows Essential package (available free
    from http://windows.microsoft.com/en-gb/windows-live/essentials).


    ## Using Family Safety


    Family Safety has several features you can use to protect your children when using
    the Internet.


    - Time restrictions: Lets you limit the amount of time your child can use the
    PC or Internet.

    - Website access: Limits the type of websites your child can visit.

    - Applications and games: Limits the programs and games your child can use.

    - Time of day: Lets you set times during which they can use the computer.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_131_0.png)


    Above: You sign into Family Safety at https://familysafety.live.com, using your
    Microsoft Live log-in details.


    ## Setting Up Family Safety


    - 1. Once you have installed Family Safety, you have to create a Windows Live
    account (https://login.live.com) and then set up a user account for each child.

    - 2. Select Windows Live Family Safety from your list of programs in the Start
    menu.

    - 3. Set yourself as an ‘administrator’ and each child as a ‘user’ by selecting
    Create a new Windows account.


    ## Restricting Internet Use with Family Safety


    - 1. To make changes to web access, visit https://familysafety.live.com. Click
    Edit settings next to the account you want to change.

    - 2. Select Web filtering lists. You can enter a website address and choose whether
    to Allow or Block it. Click Save when you have finished.

    - 3. Click the Time Limits to specify what time of the day the PC can or cannot
    be used.

    - 4. To monitor activity, click View activity report next to the account you wish
    to monitor, and you will see which sites your child has attempted to access.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_132_0.png)


    Above: Web filtering on Windows Family Safety.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_132_1.png)


    Above: Time limits and other options on Windows Family Safety.


    ## PARENTAL CONTROLS OS X


    Mac OS X machines have a parental control system installed in the operating system
    that allows you to limit web use, place time controls on computer use, as well
    as restrict applications and games.


    > **Hot Tip**

    >

    > If your child attempts to visit a blocked site, Windows Family Safety sends
    you a message by email or MSN Messenger and lets you request or deny permission
    for access.


    ## Setting Up OS X Parental Controls


    - 1. Click the Apple menu (top left) and select System Preferences.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_133_0.png)


    Above: Creating a new account in OS X


    - 2. Select Accounts. Add a new account for each user by clicking the + sign (lower
    left). Keep each account Standard and fill out the rest of the fields before hitting
    Create Account.


    - 3. Select the account you want to add parental controls to and check the Enable
    parental controls box.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_133_1.png)


    Above: Activating and opening Parental Controls.


    - 4. Click on Open Parental Controls.


    ## Adjusting OS X Parental Controls


    When you have opened up the parental controls, you will see a number of options
    that will allow you to set various restrictions.


    - Apps: Here you can limit the types of applications that your child has access
    to as well as set an age restriction for the app store.

    - Web: Allows you to block or allow certain websites. You can also let the system
    limit access to adult content, although this is not 100 per cent guaranteed.

    - Limits: You can set limits to what your child can access as well as various
    time limits.


    ## THIRD-PARTY SOFTWARE


    There is also a range of third-party software solutions, which let you limit your
    child''s web use.


    - **PC moderator (http://www.pcmoderator.com/)**: Hardware devices that turn off
    your monitor after a set time limit.

    - **Safe eyes (http://www.internetsafety.com/)**: A web-based system that lets
    you control your entire family''s web use. Available for both Windows and Mac
    machines.

    - **ContentProtect (http://www.contentwatch.com/)**: A flexible content-filtering
    system but more aimed at corporate web filtering. However, it is highly effective
    at blocking adult content from family machines.

    - **iShield (http://ishield.ph/)**: Prevents children from accessing pornographic
    sites whether accidentally or deliberately. It uses image-recognition software
    to identify nudity and sexual acts.

    - **KuruPira webfilter (http://www.kurupira.net/en/)**: A free and easy-to-use
    software platform that lets you block web access, set time limits and monitor
    web use.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_134_0.png)


    Above: The various options in OS X parental controls.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_134_1.png)


    Above: Safe Eyes is a third-party parental control program.


    ## ANTIVIRUS, FIREWALLS AND OTHER PROTECTION


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_136_0.png)


    ## ANTIVIRUS SOFTWARE


    The Internet is full of malware threats, and the easiest way to protect your computer
    is to ensure you have some form of antivirus software. However, before you can
    go looking for antivirus software, you need to understand the different sorts
    of features they offer and the protection they provide.


    ## MALWARE PROTECTION


    The term antivirus is a bit of a misnomer, because some antivirus software not
    only provides virus protection but also guards you against other malware threats,
    such as Trojan horses, spyware and adware. However, not all antivirus software
    is the same and the choice can sometimes be overwhelming.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_137_0.png)


    ## A Variety of Solutions


    Antivirus software varies in price, complexity and protection, so knowing what
    the best solution is for you can be difficult.


    Sometimes, on a machine with a lot of inbuilt protection, only a basic package
    is necessary, while on more basic machines, you may require a more sophisticated
    software solution. However, before we look at the various choices on the market,
    it is worth examining how antivirus software works.


    Above: All computers need some form of antivirus protection to guard against malware
    threats.


