  - '[PAGE 85]


    # # HOW HACKERS GAIN ACCESS


    Hackers can use all sorts of information about you to gain access to your online
    account.

    These are the most common means.


    +   - **Passwords**: Weak passwords that are easy to guess are one of the easiest
    ways hackers

    +   gain access to your online accounts.


    +   - **Personal information**: Hackers sometimes use personal information they
    find online

    +   about you, such as your address or phone number, to convince an online account
    that

    +   they are you and have lost their password.


    +   - **Spyware**: Keyloggers and other spyware can give hackers access to your
    usernames

    +   and passwords.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_85_0.png)


    # ## Account Security


    Some online accounts are far more

    secure than others. Banks, for instance,

    have several layers of identity

    authentication, including passwords,

    PINs and memorable questions.

    However, social media, email and online

    retail sites have fewer layers, making

    them easier targets for online hackers.


    Above: Banks often have extra layers of security, such as asking you for

    memorable information before you can log in.


    # # EMAIL ACCOUNTS


    Taking over your email account is not only a severe invasion of privacy, but it
    also allows

    hackers to send spam, malware or phishing emails to everybody in your address
    book, who

    may think the message is from you. In addition, having access to your email account
    can let

    a hacker reset your passwords on online accounts, granting them access.'
  - '[PAGE 86]


    # Securing Your Email Account


    Protecting your email account from hackers is crucial, so make sure your account
    is secure.


    +   Security measures: Choose a secure email provider, preferably one that has
    several layers of verification, such as SMS or phone verification. If these are
    optional, take advantage of them.


    +   Password: Choose a strong password and change it regularly, and never tell
    anybody your email password.


    +   Security measures: React quickly to messages about possible attempts to hack
    your email account. However, be wary of phishing messages claiming to be from
    your email provider.


    +   Multiple accounts: Think about using more than one email address.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_86_0.png)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_86_1.png)


    Above: Take advantage of the extra security features offered by your email account
    provider.


    # Symptoms of an Email Hack


    Determining if your email account has been hacked is not easy; often hackers want
    to remain undetected, so they go to extreme lengths to hide their presence. However,
    there can be some tell-tale signs.'
  - '[PAGE 87]


    +   * Sent messages: Hackers often delete the messages they send to avoid detection,
    so if your sent messages folder is empty or you spot messages that you did not
    send, you may have been hacked.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_87_0.png)


    +   * Non-delivery reports: If your account has been used to send random emails
    and spam, you may get non-delivery reports that have been sent to accounts no
    longer in existence.


    +   * Friends/colleagues: People in your address book may ask if you sent them
    a recent message, as they may be suspicious about its content.


    Above: Delivery-failure notifications for emails you do not remember sending are
    a sign that you have been hacked.


    # SOCIAL MEDIA


    Social media platforms are perhaps the most easily and often hacked accounts.
    Quite often, people use social media accounts to send spam or direct a user’s
    friends and followers to a website, but a hacked social media account can bring
    with it other problems, such as somebody getting hold of personal information,
    which can be used to hack into other accounts or as part of an identity fraud.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_87_1.png)


    Above: Take advantage of the security and privacy settings on your social media
    accounts.


    # Securing Your Social Media Accounts


    As with your email account, it is important to use a strong password to access
    your social media platforms, such as Twitter, Facebook or LinkedIn, but there
    are a couple of things you can do to secure your account.'
  - "[PAGE 88]\n\n+   * Privacy and security settings:\n+     Take advantage of the\
    \ platform's privacy and security measures. (See pages 108–12 for more information.)\n\
    +   \n+   * Avoid: Revealing personal information on social media. Even if you\
    \ think you are only talking to friends, you never know if their accounts have\
    \ been compromised.\n\n> **Hot Tip**\n> \n> Beware of messages on Twitter alerting\
    \ you to a link of a picture, video or something that somebody has written about\
    \ you on the Internet. This is a common sign an account has been hacked and the\
    \ link might take you to a malicious website.\n\n# # Symptoms Your Social Media\
    \ Has Been Hacked\n\nThe most common sign your social media account has been hacked\
    \ is when your friends and followers start receiving messages from you that you\
    \ did not send. You may also have started following or befriending a lot of new\
    \ people. Make sure you regularly check your activity so you can spot a hack as\
    \ soon as possible.\n\n# # FINANCIAL ACCOUNTS\n\nArguably the most damaging type\
    \ of online account to have hacked is one that deals with financial transactions.\
    \ Not only can somebody access your money if they hack into your online bank or\
    \ credit card accounts, but some retail accounts hold other personal information,\
    \ such your credit card details, address, email and phone number, which a hacker\
    \ may gain access to.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_88_0.png)\n\n\
    Above: Some online retailers, such as Amazon, hide your credit card details in\
    \ case your account is hacked."
  - '[PAGE 89]


    # # Tell-tale Signs of a Hacked Financial Account


    The last thing you want a hacker to have access to is your money, be it via an
    online retailer, bank or other financial institution. Fortunately, most financial
    organizations and ecommerce websites take security seriously, but it is important
    to look out for tell-tale signs of a breach.


    +   - **Log In:** If you cannot log in, it could be because the account has been
    hacked. Contact the online account provider immediately.


    +   - **Warnings:** Most financial organizations will send you a warning if they
    suspect unusual behaviour on your account.


    +   - **Statements:** Check your bank and credit card statements carefully. If
    you spot a transaction you do not remember, investigate it.


    +   - **Orders:** Regularly check your order history on retail and ecommerce websites
    for any new items.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_89_0.png)


    +   - **Emails:** Websites may send you an email alerting you to a product that
    has been dispatched, or to confirm that you have changed some personal details.


    Above: Order confirmations can be a sign somebody has hacked one of your accounts.


    +   - **Balance:** Make sure you know your account balance. If it is not what
    it should be, investigate it.'
  - '[PAGE 90]


    # # HELP, MY ACCOUNT HAS BEEN HACKED!


    If any of your online accounts have been hacked, whether social media, email or
    a bank or ecommerce site, it is crucial to act as quickly as possible to minimize
    the damage. If you think your account has been hacked, take the following steps.


    +   1. Inform the website or account provider immediately. If you cannot log in,
    contact them by telephone for help, not by email.


    +   2. Change your password and other log-in information, such as your email address.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_90_0.png)


    +   3. Check your personal information has not been changed.


    +   4. Change your password on other websites in case they have also been compromised.
    Check these for signs of hacking.


    Above: If you think an account has been hacked, check your personal information
    has not been changed.


    +   5. If your online account contains credit card or bank account numbers, tell
    your financial institutions immediately.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_90_1.png)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_90_2.png)


    Above: Change your password on other accounts.'
