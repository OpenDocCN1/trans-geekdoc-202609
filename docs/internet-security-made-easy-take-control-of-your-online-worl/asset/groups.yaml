    # WEB BROWSING SECURITY


    Web browsers provide us access to the World Wide Web, but you can also use them
    to keep you safe online. In this section, we will explore how web browsers interact
    with websites and how the various features and functions can protect us online.


    # WEB NAVIGATION


    When we think of websites, we often think in terms of ‘visiting’ a web page. However,
    this is not strictly accurate. When we enter a website address into our browser
    or click on a link, our web browser connects with the server hosting the website
    and downloads all the information to our computers. In other words, we are not
    visiting a website, but the website is visiting us. This is why it is important
    to have Internet security systems such as antivirus software and firewalls, because
    we are allowing all this data onto our machines.


    # HTML


    Web pages function using HTML (HyperText Markup Language), which provides the
    content of a web page and defines how the web browser should display it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_93_0.png)


    Above: A web page is made up of HTML code.'
  - '[PAGE 94]


    # Browser Interaction


    Not only do web browsers download information from a web server to our computers,
    but they also provide information the other way. To understand the sorts of security
    issues that can arise from web browsing, it is important to understand the sorts
    of information we are inadvertently handing over each time we visit a web page.


    +   IP address: When we visit a website, our browser tells the web server the
    IP address of our computer, which allows the website to know where to send the
    page.


    +   System information: In order to ensure the web page is presented correctly,
    web browsers provide information relating to the computer environment we are using,
    such as the operating system and browser type.


    > Did You Know?

    > Websites can use your IP address to discern your approximate location. This
    helps some services, such as search engines, to offer you results based on where
    you live.


    +   Linked page: If you have visited a page from a search engine or link, the
    web browser will also provide this information to a web server.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_94_0.png)


    Right: Services such as Google maps use our IP address to identify our location.'
