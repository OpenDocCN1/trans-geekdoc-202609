  - '[PAGE 107]


    # SOCIAL MEDIA PLATFORMS


    Social media has been around for some time, and while it is impossible to list
    all the available platforms, some social media sites are more popular than others.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_107_0.png)


    Above: Facebook now has over a billion users.


    +   - Facebook: The world''s most popular social networking site with over one
    billion members.

    +   - Twitter: The platform that allows you to send 140-character messages, known
    as Tweets (a form of ‘microblogging’).

    +   - LinkedIn: Used by professionals and those in the business world to network
    and connect with other professionals.

    +   - Pinterest: Lets users collect and share photos of their favourite events,
    interests and hobbies.

    +   - Google Plus+: Google''s own social networking platform that interacts with
    many of Google''s other services.

    +   - Tumblr: Another microblogging platform, which allows users to share videos
    and other multimedia.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_107_1.png)


    Above: You can send up to 140 characters in a Tweet, but you can also attach images.'
  - '[PAGE 108]


    # THE INFORMATION YOU PROVIDE


    When we sign up to a social media account, we often provide all sorts of information.
    Social media providers keep some of this private, such as our email address and
    password, but other information ends up as part of our profile and may be visible
    to anyone.


    # Access to Information


    Websites such as Twitter and Facebook now allow interaction from all sorts of
    apps and other websites. One of the consequences of this is that when are logged
    into a Twitter or Facebook account, all sorts of information about you can be
    accessed by third-party websites, such as your name, profile photo and even your
    interests.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_108_0.png)


    # Ownership


    Another aspect of social media that people often fail to understand is that we
    do not have ownership over the content we post. When we sign up to social media
    platforms, we often grant these websites the rights to do what they like with
    our content, which means we have no control over who has access to our images
    and videos.


    # SHARING INFORMATION


    Whether you are sending Tweets, updating your Facebook wall or just creating a
    social media profile, it is important to understand what information should be
    shared and what could put you at risk from identify fraud or other security threats.


    # Sensitive Information


    Sensitive information is anything that could be used by scammers, fraudsters and
    other types of people with dubious motives. Even information that may seem mundane
    can be used against us. Sensitive information falls into several categories.'
  - '[PAGE 109]


    +   • Identification: Anything that can be used to identify who you are, such
    as your full name, names of children, spouses or other family members, and your
    date of birth.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_109_0.png)


    Above: For security reasons passwords are normally obscured by asterisks when
    you log into social media.


    +   • Location: Anything that helps identify your address, such as the street
    in which you live or postcode.


    +   • Security: Passwords, account numbers and personal email addresses should
    never be divulged on social media.


    +   • Schedules: Details of when we are at home or at work, planned holidays and
    trips can all put us at risk.


    # PRIVACY SETTINGS


    In order to control who sees what information, most social media websites have
    privacy settings, which you can adjust to allow certain information to be visible
    only to your friends and followers. While we cannot explain the settings of every
    social media platform in this book, we will look at how to increase security on
    the largest platforms – Facebook and Twitter.


    # FACEBOOK SECURITY AND PRIVACY


    Facebook is the world’s most popular social media platform, allowing over a billion
    people to share information with friends and family. However, you may not want
    everything about you to be known to just anybody, so it is important to try to
    control what you give out and who gets to see it.'
  - '[PAGE 110]


    # # Facebook Settings


    In order to protect your personal information, Facebook provides all sorts of
    settings.


    +   1. To access your security and privacy settings, click on the downward-pointing
    arrow in the top-right corner.


    +   2. Click Settings.


    +   3. Select Security in the menu on the left to adjust your security settings,
    and Privacy to adjust your privacy settings.


    > **Hot Tip**

    > When you sign up to Facebook, you are asked for a lot of information, but much
    of this is optional. Beyond your name, email address, birthday and gender you
    do not need to divulge anything else.


    # ## Facebook Security


    In the security menu, you can adjust aspects of your account to make it more secure.
    Simply click edit next to each setting.


    +   * **Login notifications:** Receive email or text notifications if somebody
    tries to log into your account.


    +   * **Login approval:** Set a security code for logging in from a computer other
    than your own.


    +   * **Code generator:** Generate codes in your Facebook mobile app for logging
    in and resetting your password.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_110_0.png)


    Right: Selecting Facebook settings.'
  - '[PAGE 111]


    +   App passwords: Create passwords for apps that cannot use security codes.


    +   Trusted contacts: Allows you to choose trusted friends to help you get into
    a locked account.


    +   Trusted browser: Select what browsers you can use to access your account.


    +   Where you''re logged in: Limit the locations where you can log in.


    # Facebook Privacy


    In the privacy, timeline and blocking menus, you can control who sees what in
    your timeline, prevent people from tagging images of you, as well as block people
    with whom you would rather not engage.


    +   Who can see my stuff: You can choose whether your posts are public or for
    friends only, and even restrict things you have already posted.


    +   Who can contact me: Filter messages sent to you and who can send you a friend
    request.


    +   Who can look me up: Edit who can search for your profile on both Facebook
    and in search engines.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_111_0.png)


    +   Timeline and tagging: You can adjust who can post to your timeline, who can
    see things on it, as well as control who tags you in their posts and photos.


    +   Blocking: Lets you block or restrict friends, apps and invitations.'
  - '[PAGE 112]


    # TWITTER SECURITY AND PRIVACY


    While not as popular as Facebook, Twitter is still used by millions of people
    and has the potential to compromise your online security if you do not control
    the information you give out.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_112_0.png)


    # Twitter Profile


    Twitter does not ask for as much personal information as Facebook, and it is entirely
    up to you how much information you want to make public on your Twitter profile.
    For most people, their profile contains their name and a short biography. However,
    some people have their location visible on their profile, as well as other sensitive
    information. Be careful when you compose your profile that you are not giving
    away too much personal detail.


    # Tweeting


    The biggest threat to privacy and security on Twitter comes in what you talk about.
    Divulging too much information in a Tweet may mean the information gets into the
    wrong hands, and while Tweets drop down your timeline very quickly, they can remain
    accessible for months, even years.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_112_1.png)


    Above: Do not give out personal information in a Tweet, even if it appears to
    be a reputable company asking for it.


    # Twitter Settings


    +   1. To access Twitter''s security and privacy settings, click the gear icon
    in the top right-hand corner.'
  - '[PAGE 113]


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_113_0.png)


    Above: Selecting settings in Twitter.


    +   2. Click Settings in the drop-down menu.


    +   3. Select Security and Privacy in the left-hand menu.


    # # Twitter Security and Privacy


    You can adjust several aspects of your account to protect your personal information.


    +   - Login verification: Have Twitter send you an email or text whenever somebody
    attempts to log into your account.


    +   - Password reset: Allows you to set Twitter to request additional information
    for resetting passwords.


    +   - Photo tagging: As with Facebook, you can prevent people tagging you in photos.


    +   - Tweet privacy: Choose to make your Tweets public, so anyone can see them,
    or private and visible only to your followers.


    +   - Tweet location: Choose whether your location is included in your Tweets.


    +   - Discoverability: Choose whether people can search for you on Twitter using
    your email address.


    +   - Promoted content: Prevent Twitter from tailoring adverts specifically to
    you based on your Tweets and the people you follow.


    > > Hot Tip

    > >

    > > Avoid clicking on links from people you do not know on social media, as spammers
    often use these platforms to try to get you to visit websites with malicious content.'
