    The Internet offers plenty of educational and social benefits for children, but
    it also comes with certain risks. Many adults feel very anxious about the Internet
    and the dangers it poses to their children, partly because of the knowledge gap
    between children and adults when it comes to the online world. However, while
    there are dangers on the Internet, understanding what they are and what you can
    do to minimize the risks can make you more relaxed about your children''s web
    use.


    > > **Hot Tip**

    > > Many children feel that their parents do not understand the Internet so do
    not talk about their web use, which opens the door for danger. Make an effort
    to spend time talking about their online activities, so they feel comfortable
    discussing it with you.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_120_0.png)


    Above: Be aware of what children are using smartphones for as well as computers.'
