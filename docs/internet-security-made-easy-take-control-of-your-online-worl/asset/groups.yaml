  - '[PAGE 1]


    # INTERNET SECURITY MADE EASY


    It is an unfortunate truth that when we send an email or surf the net, most of
    us are unaware of just how much is occurring below the surface, of the risks we
    take when we enter cyberspace. From viruses and other malicious malware to hacking,
    identity theft and financial fraud; from embarrassing damage to one''s reputation
    to serious dangers posed to children through social media, there are many threats
    against which we can take action.


    Internet Security Made Easy aims to leave no stone unturned, from the necessity
    of a strong password and the means to obtain it, to the best antivirus software
    to install. With straightforward and digestible information, we provide you with
    multiple solutions and useful knowledge that you will be able to apply to your
    experiences online, regardless of whether you are already familiar with Internet
    security or a complete beginner. Beginning with an introduction to the World Wide
    Web and its risks, the book then covers a wide range of dangers to look out for,
    with specific sections on child Internet safety, followed by various software
    solutions and advanced troubleshooting.


    The knowledge we provide is intended to get you to think outside of the box. You
    wouldn''t leave your child alone with a stranger so why should online interaction
    be any different? Equally, many people overlook the fact that it is possible for
    your handheld devices to be hacked and even damaged by various viruses, so we
    cover that too. With practical step-by-step guides and helpful screenshots, Internet
    security really is made easy.'
