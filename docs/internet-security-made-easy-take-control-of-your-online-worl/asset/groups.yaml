  - '[PAGE 195]


    # Hot Tip


    Regardless of how you connect a mobile device to the Internet, always take basic
    security precautions, such as using HTTPS protocol when accessing email and banking
    services.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_195_0.png)


    # GPRS SECURITY


    The radio signals that allow data transfer on mobile devices are pretty secure.
    Mobile telecoms companies use very sophisticated firewalls and encryption technology,
    which make unauthorized access extremely difficult.


    # WIRELESS ACCESS


    The big downside to using GPRS data services is that mobile operators charge us
    for the data we download. However, if you are at home or in a location that has
    a public accessible network, you can access the Internet over Wi-Fi, which does
    not cost you anything for data transfer. However, unlike GPRS, Wi-Fi access does
    present some possible security issues.


    # What Is Wi-Fi?


    Wi-Fi is simply the term used to describe wireless networking. Rather than plugging
    a laptop, smartphone or tablet into a broadband connection using a cable, Wi-Fi
    allows you to connect to the Internet using a localized radio signal.


    # Wireless Router


    In order to connect wirelessly, you need access to a wireless router, which is
    plugged into a broadband connection and a wireless accessible device. Most smartphones,
    laptops and tablets now have in-built wireless adapters that allow you to connect
    to a wireless network.


    # Hot Tip


    If your laptop does not have an in-built wireless adapter, you can use an external
    wireless adapter that plugs into the USB port, or a wireless card that can be
    installed inside the laptop.'
