    ## USING THIS BOOK


    This book has been designed to give you all the information you need to keep safe
    when you surf the Internet. Whether you use the Internet for socializing, to do
    your banking, or to download games and software, this book will help you navigate
    the world of Internet security and ensure you and your family can go online safely
    and securely.


    > **Hot Tip**

