    A portable computer.


    # Malware


    Means malicious software and describes all types of software designed to cause
    harm on a computer, including computer viruses, spyware, keyloggers, worms, adware
    and Trojans.'
  - '[PAGE 251]


    **Network**

    A group of computers or devices connected together either wirelessly or by cables.


    **PDA**

    A Personal Digital Assistant is a type of small computer that can be used to store
    information such as addresses and telephone numbers, as well as connect to the
    Internet.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_251_0.png)


    **Pharming**

    An attempt by a hacker to redirect a website’s traffic to another site for the
    purpose of stealing information.


    **Phishing**

    An attempt by a hacker or fraudster to obtain personal information about a user,
    often by posing as someone else or a legitimate company. Phishing is normally
    done using email, text or social media messages.


    **Plug-in**

    An additional component to a software program that adds a new feature or added
    functionality.


    **Pop-up**

    A new browser window, often containing an advertisement, that pops up uninvited
    in front of an existing page.


    **Proxy (server)**

    A computer server that acts as an intermediary between your computer (the client)
    and the server you are communicating with (the host).


    **Ransomware**

    A type of malware that forces you to pay money to unlock files or regain access
    to your computer.


    **Registry**

    A database on Windows machines that stores start-up and configuration settings.


    **Rootkit**

    A type of malware designed to hide the fact that a computer has been compromised
    by hiding itself in the system files or ''root'' of a computer. (See also Malware.)


    **Router**

    A hardware device that connects a computer or network to the Internet either wirelessly
    or by the use of cables.


    **Security holes**

    A weakness in a security system that can be exploited by hackers or malicious
    software. (See also Backdoor.)


    **Smartphone**

    A mobile phone that also has many functions of a computer, such as being able
    to access the Internet.


    **Spam**

    Unsolicited emails or messages often containing adverts. Spam can also include
    phishing messages. (See also Phishing.)


    **Spyware**

    A type of malware designed to spy on your computer use and collect information
    about you without your knowledge or permission. (See also Malware.)'
