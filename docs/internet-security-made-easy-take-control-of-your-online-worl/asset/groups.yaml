  md: "\n- **Tablet computer**  \n  A flat touch-screen device that runs similar computing\
    \ architecture to a smartphone but is usually larger.\n\n- **Trojan (or Trojan\
    \ horse)**  \n  A type of malware that gains access to a computer by posing as\
    \ an innocent file or program. (See also Malware.)\n\n- **URL**  \n  Uniform Resource\
    \ Locator is a website's address.\n\n- **URL spoofing**  \n  An attempt by hackers\
    \ to create a fake website that has a very similar URL to the site it is trying\
    \ to replicate in order to fool people. Often used in phishing attacks. (See also\
    \ Phishing.)\n\n- **Virus**  \n  See Computer virus.\n\n- **VoIP**  \n  Voice\
    \ over Internet Protocol is a method of voice communication over the Internet.\n\
    \n- **Web browser**  \n  Software designed to connect with and read web pages.\n\
    \n- **Web page**  \n  A page on the Internet generated by HTML that contains information\
    \ that can be viewed on a web browser.\n\n- **Website**  \n  A collection of web\
    \ pages under a single domain address.\n\n- **Web server**  \n  A computer that\
    \ makes web pages and other resources available for sharing over the Internet.\n\
    \n- **WEP**  \n  Wired Equivalent Privacy is type of encryption used by wireless\
    \ routers.\n\n- **Wi-Fi**  \n  Wireless Fidelity is a short-range wireless technology\
    \ that enables wireless Internet and network access.\n\n- **Wi-Fi hotspot**  \n\
    \  Usually a public wireless access point. Sometimes these locations have poor\
    \ or no security measures in place.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_252_0.png)\n\
    \n- **World Wide Web**  \n  The name given to the websites and web pages that\
    \ are interconnected on the Internet.\n\n- **Worms**  \n  A type of malware that\
    \ can self-replicate and spread itself around a network. (See also Malware.)\n\
    \n- **WPA (and WPA2)**  \n  Wi-Fi Protected Access is a form of wireless encryption\
    \ that is more secure than WEP.\n\n- **Zombie computer**  \n  A computer that\
    \ has a bot or other malicious program running in the background without the knowledge\
    \ or permission of the user.\n\n## FURTHER READING\n\n- Abagnale, Frank W., *Stealing\
    \ Your Life: The ultimate identity theft prevention plan*, Broadway Books, 2008\n\
    \n- Hunter, Nick, *Internet Safety (Hot Topics)*, Raintree, 2011\n\n- Bailey,\
    \ Matthew, *The Complete Guide To Internet Privacy, Anonymity And Security*, A\
    \ Nerel Publication, 2011\n\n- Ioannou, Nick, *Internet Security Fundamentals:\
    \ Practical steps to increase your online security*, Boolean Logical Ltd, 2014\n\
    \n- Cambridge, Rodney D., *How NOT To Use Your Smartphone: Avoid hackers stealing\
    \ your identity via your phone*, CreateSpace Independent Publishing Platform,\
