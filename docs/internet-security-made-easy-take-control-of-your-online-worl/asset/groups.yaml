  - '[PAGE 252]


    +   **Tablet computer**

    +   A flat touch-screen device that runs similar computing architecture to a smartphone
    but is usually larger.


    +   **Trojan (or Trojan horse)**

    +   A type of malware that gains access to a computer by posing as an innocent
    file or program. (See also Malware.)


    +   **URL**

    +   Uniform Resource Locator is a website''s address.


    +   **URL spoofing**

    +   An attempt by hackers to create a fake website that has a very similar URL
    to the site it is trying to replicate in order to fool people. Often used in phishing
    attacks. (See also Phishing.)


    +   **Virus**

    +   See Computer virus.


    +   **VoIP**

    +   Voice over Internet Protocol is a method of voice communication over the Internet.


    +   **Web browser**

    +   Software designed to connect with and read web pages.


    +   **Web page**

    +   A page on the Internet generated by HTML that contains information that can
    be viewed on a web browser.


    +   **Website**

    +   A collection of web pages under a single domain address.


    +   **Web server**

    +   A computer that makes web pages and other resources available for sharing
    over the Internet.


    +   **WEP**

    +   Wired Equivalent Privacy is type of encryption used by wireless routers.


    +   **Wi-Fi**

    +   Wireless Fidelity is a short-range wireless technology that enables wireless
    Internet and network access.


    +   **Wi-Fi hotspot**

    +   Usually a public wireless access point. Sometimes these locations have poor
    or no security measures in place.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_252_0.png)


    +   **World Wide Web**

    +   The name given to the websites and web pages that are interconnected on the
    Internet.


    +   **Worms**

    +   A type of malware that can self-replicate and spread itself around a network.
    (See also Malware.)


    +   **WPA (and WPA2)**

    +   Wi-Fi Protected Access is a form of wireless encryption that is more secure
    than WEP.


    +   **Zombie computer**

    +   A computer that has a bot or other malicious program running in the background
    without the knowledge or permission of the user.'
