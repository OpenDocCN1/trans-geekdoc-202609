    the Report link that appears near the content itself.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_115_1.png)


    Above: You can report somebody for abuse on Facebook via the "..." menu in their
    timeline.


    - Twitter: You can report abusive behaviour at the following address – https://support.twitter.com/forms/abusiveuser


    - LinkedIn: Has a contact form for reporting abusive behaviour – https://help.linkedin.com/app/ask/path/rhsc


    - Pinterest: You can report abuse and harassment using the contact form at http://help.pinterest.com/en/contact


    - Google Plus+: Click on the arrow to the top and right of the post and select
    Report abuse.


    - Tumblr: The only way to report abuse on Tumblr is to email the support desk
    – support@tumblr.com


    > Hot Tip

    > Never assume that private information and messages sent to friends and followers
    will remain private. You never know what other people will do with your information
    or how secure their web habits are.


    ## SENSIBLE SOCIAL MEDIA USE


    When using any social media website or app, it is a good idea to bear in mind
    some basic principles.


    - Sensitive information: Avoid giving out any information that could be used by
    identity fraudsters, spammers or hackers.

    - Privacy: No matter what security and privacy settings you have set, never say
    anything you would not want the whole world to hear.

    - Remember: Something you say on social media could be accessible for weeks, months
    and even years into the future.

    - Passwords: Guard your passwords, ensure they are strong and remember to change
    them regularly.

    - Connect: Be careful whom you befriend or follow on social media. Not everyone
    will be who they say they are.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_117_0.png)


    Above: Be careful about what pictures you post online.


    - Pictures: Photos can be copied and forwarded easily, so never post any pictures
    that you would not feel comfortable letting the whole world see.


    - Links: Do not click on links from people you do not know, as they may lead you
    to a malicious website.


    - Social media mobile apps: See pages 203–05 about using apps and the risks they
    pose.


    ## COMMON SOCIAL MEDIA SCAMS


    Due to its popularity, social media has become a tempting target for scammers
    and fraudsters. Be on the lookout for some of these common scams.


    - **Secret details about ....** Often followed by the name of celebrity and including
    a link to tempt you to some salacious gossip, but which in fact leads you to a
    malicious site.

    - **Help, need money:** Be wary of anybody asking for financial help. Often the
    fraudsters claim to be a victim of a terrible tragedy.

    - **Did you see this picture of you?:** Watch out for any Tweets or Facebook messages
    containing a link to a picture of you. It normally directs you to a fake login
    screen designed to get your account details.

    - **Ur cute. Message me:** Be wary of strangers claiming they find you attractive,
    as they are liable to be fraudsters.


    > Government authorities, prospective employers and law-enforcement agencies commonly
    do searches on social media websites, so always think about what you are posting
    and who might see it in the future.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_118_0.png)


    **Right:** Beware of messages suggesting there is a compromising picture of you
    on the Internet somewhere.


    ## THE INTERNET AND CHILDREN


    In many cases, teenagers and even young children know more than their parents
    when it comes to using the Web. However, they are vulnerable to some specific
    online risks, which will obviously vary depending on their age and Internet access.
    Let’s first look at what these risks are.


    ## THE TECH GENERATION


    For many adults, the Internet and World Wide Web were not around when they grew
    up, which has meant the Internet is something we have had to learn as it developed.
    For youngsters, the Internet is something that has always been there, which means
    using the Web comes naturally to them.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_119_0.png)


    ### Tech-savvy


    One of the big problems adults face with their children’s Internet use is that
    quite often children know more than they do about the online world. This means
    monitoring your child’s Internet use can be difficult, especially as so much online
    activity is conducted on smartphones and other mobile devices these days. However,
    it is important to understand the risks children could be exposed to and what
    you can do to minimize them.


    Left: In many ways, children are more Internet savvy than their parents.


    ### The World Wide Wild West


    The Internet offers plenty of educational and social benefits for children, but
    it also comes with certain risks. Many adults feel very anxious about the Internet
    and the dangers it poses to their children, partly because of the knowledge gap
    between children and adults when it comes to the online world. However, while
    there are dangers on the Internet, understanding what they are and what you can
    do to minimize the risks can make you more relaxed about your children''s web
    use.


    > **Hot Tip**

    > Many children feel that their parents do not understand the Internet so do not
    talk about their web use, which opens the door for danger. Make an effort to spend
    time talking about their online activities, so they feel comfortable discussing
    it with you.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_120_0.png)


    Above: Be aware of what children are using smartphones for as well as computers.


    ### Understanding the Web


    If you are reading this book, you are already taking a step in the right direction.
    Understanding how the Internet works and the threats it poses can make it easier
    to eliminate these threats and protect your child''s web use.


    ### THE RISKS


    Adults and children face similar threats online, such as malware, hackers and
    phishing. But the personal attacks that children risk online can be even more
    damaging because of their age.


    ### The Four Cs


    Particularly iniquitous risks faced by children fall into four categories.


    - **Contact**: Children use all sorts of tools for communicating with others –
    social media, chat rooms and forums – but the people they come into contact with
    online can pose a risk.


    - **Content**: There is a lot of material on the Internet that is not suitable
    for children to see.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_121_0.png)


    - **Conduct**: How your children conduct themselves online can also have consequences.


    - **Crime**: Criminals use the Internet, and some specifically target children.


    Above: Chat rooms are places where children may encounter cyberbullies.


