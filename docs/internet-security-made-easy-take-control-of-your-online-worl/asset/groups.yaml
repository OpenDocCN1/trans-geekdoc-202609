    ## SYSTEM THREATS


    Your browser is not the only location where you can find threats that your antivirus
    may have missed. If you really want to be sure your PC is virus free, it is worth
    checking the system files, particularly those installed on start-up, as this is
    a common place for viruses and Trojans to linger.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_240_1.png)


    - 1. Click Start, Run, and then type in msconfig to run the System Configuration
    Utility.

    Above: Start-up files in the System Configuration Utility.


    - 2. Click on the Startup tab. Here is a list of all the items that run when the
    machine boots up. Note anything suspicious, such as those with Unknown listed
    under the manufacturer or those claiming to be Windows or Microsoft files.


    ### Removing Start-up Viruses


    - 1. Disable the suspicious file in the System Configuration Utility (check the
    box and click Disable).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_241_0.png)


    - 2. Reboot your computer in Safe Mode and run msconfig again. If the threat is
    still there, you can be pretty sure it is a virus.


    - 3. Note down the location of the virus, and then run Registry Editor.


    - 4. Go to the location of the virus and right click the suspected file, select
    modify and put ":" in front of the value data. This will disable the virus but
    not delete it.


    Above: The potential location of a virus.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_241_1.png)


    - 5. Reboot your computer in normal mode. If all is well you can be assured the
    file is not important to your system, so go back into Registry Editor and delete
    the virus (right click Delete).


    - 6. Reboot again, and then run msconfig to check that the threat has been removed.


    Above: Modifying registry values.


    ## ROGUE PROGRAMS AND SECURITY TOOLS


    Some of the simplest malware can also be the hardest for antivirus software to
    spot and remove. Sometimes they are in the form of innocent programs that install
    themselves on start-up, or they might be in the guise of a security tool, which
    provides false scans prompting you to pay to have fake threats removed.


    > **Hot Tip**

    > After making changes to your registry, it is a good idea to run a registry-cleaning
    program such as CCleaner or Wise Registry Cleaner to fix any issues or corrupted
    files (see page 229).


    ### Processes


    In order to see if you have a rogue program or security tool running on your Windows
    machine, you need to open the Task Manager (Ctrl, Alt, Delete), in OS X use the
    Activity Monitor (Applications, Utilities).


    - 1. Make a note of any suspicious processes. Look for processes with no clearly
    defined name, such as a random number or string of letters.


    - 2. Do an Internet search of these processes to see if they are malware; if there
    is no record of any process with the same name, it is unlikely to be genuine.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_242_0.png)


    - 3. If so, Force Quit the process in Task Manager/Activity Monitor.


    - 4. Do a search for files and data associated with the name of that program.
    Remove any associated files or folders.


    ## HARDWARE SECURITY


    Not all Internet security comes in software form. You can get all sorts of hardware
    to help secure your computers and Internet connection, which can be especially
    useful if you have a home or small-business network.


    ### ROUTERS


    The router is the hardware device through which you connect to the Internet. Because
    of this, the router can be your first line of defence against online threats,
    hackers and other Internet nasties. Routers have all sorts of in-built security
    measures, but in order to take advantage of them, you need to set up your router
    correctly.


    ### Types of Router


    Routers come in a variety of types, but for most people there are two basic choices.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_243_0.png)


    Above: Most people use wireless routers these days.


    - Wired routers: Less common for home networking these days, but wired routers
    are more secure and so preferred by most business networks, although they are
    less flexible.


    - Wireless routers: Let you connect devices wirelessly to the router, giving greater
    freedom; the most common choice for most home networks.


    ### Understanding Routers


    In order to make the best of your router and its security features, it is worth
    understanding how a router works and what its core functions are.


    - Packet forwarding: Internet traffic travels around in small packets of data.
    It is the router''s job to relay these packets to you.


    - Packet filtering: Not all data travelling to your network is wanted. Routers
    sift through the packets and filter what is and isn''t required.


    - Packet switching: Routers break data into packets and send them separately,
    to be reassembled at the destination.


    ### HARDWARE FIREWALLS


    Because a router''s main job is to sift through the data coming into your home,
    it is very easy for it to act like a firewall. In fact, most wireless routers
    now have a firewall option, but if your router does not, you can also buy a specialized
    hardware firewall.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_244_0.png)


    ### ACCESSING YOUR ROUTER


    To understand whether your router has a firewall installed, or if you wish to
    turn it on, you must first access your router or hardware firewall''s configuration
    settings. Most come with software that you can install on your hard drive to access
    the functions, but this is actually not required, and the simplest way to reach
    your router or firewall''s configuration settings is to open an Internet browser
    and enter the device''s IP address in the address bar. You can normally find this
    on a sticker attached to your device. If you cannot find it, go online and visit
    your manufacturer''s support pages.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_245_0.png)


    Above: Most routers have in-built firewalls.


    ### Administrator Password


    When you first install your router, you will be given an administrator username
    and password allowing you to access your router settings. It is important to change
    this as soon as possible to protect your router from being accessed by somebody
    else. You will normally find the option to do this in the basic settings page
    or your router configuration.


    ### Router Firewall


    You can normally find the settings for your router’s firewall under the Port Forwarding
    or Packet Forwarding settings. You will normally see a number of options for disabling
    the firewall, blocking all traffic or allowing certain access (usually set as
    the default).


    ### Firewall Access


    As with software firewalls, the firewall on your router may block innocent applications
    and devices. Because of this, you may need to add exceptions to your firewall.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_245_1.png)


    - 1. Go into your Port Forwarding settings and look for a menu option that says
    ''exceptions'' or ''configuration''.


    - 2. You may have a menu of listed games and applications that you can simply
    select to allow access.


    Left: Adding an exception to the firewall.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_246_0.png)


    - 3. If your game or application is not listed, you will have to add it, which
    means finding out the port range and protocol of the application (see the manufacturer''s
    instructions).


    > Hot Tip

    > If you have a games console, it is sometimes better to add the device as an
    exception using Port Forwarding configuration rather than the individual games,
    as attacks against consoles tend to be quite rare.


    ### Granting Device Access


    Not only can you grant certain access to games and applications, but you can also
    set up a list of approved devices that can access your router. Sometimes this
    is described as an access blocking policy, or it may just be listed as access
    restrictions. If you have a list, you must remember that any new devices you want
    to connect to the router will have to be added to gain access to the Internet.

