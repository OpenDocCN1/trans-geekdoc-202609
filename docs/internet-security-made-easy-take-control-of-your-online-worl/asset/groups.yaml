    # Grooming


    Sexual predators try to befriend and exploit children in a number of ways; these
    techniques are known as grooming.


    +   - **Posing as a child**: They may pose as someone of the same age group to
    get close to children; often they pretend to be a child of the opposite sex interested
    in a relationship.

    +   - **Personal information**: Sexual predators sometimes try to extract personal
    information from children, such as addresses, emails or phone numbers.

    +   - **Bribery**: As a means of getting a child to meet up, a sexual predator
    may offer tickets to a pop concert, cinema or other event.

    +   - **Blackmail**: Another known tactic is to threaten to disclose something
    a child has said on the Internet to make them to do something they do not want
    to do.

    +   - **Intimacy**: They may ask intimate questions or send inappropriate images.


    # Child Exploitation and Online Protection Centre


    A special criminal taskforce has been set up in the UK solely to track online
    sexual predators. It is called the Child Exploitation and Online Protection Centre
    (CEOP). If you suspect your child has been in contact with a sexual predator,
    you can contact CEOP at http://ceop.police.uk/


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_126_0.png)


    Above: CEOP police the Internet to protect children from exploitation and online
    grooming.'
