    # # Types of Computer Virus


    Computer viruses come in various guises, and each one behaves differently.


    +   - **Program viruses**: These infect executable files (programs), and the virus
    is installed into the computer memory with the executable file, where it infects
    other files and acts out its programming.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_61_0.png)


    Above: Some viruses will prevent your PC from booting up normally.


    +   - **Boot viruses**: Rather than infecting computer memory, boot viruses infect
    the record used by operating systems when they start up, so the virus is reinstalled
    every time you turn on.


    +   - **Stealth viruses**: These viruses are designed to avoid detection. Commonly,
    this is done by preventing the section of hard disk they are on from being read.


    +   - **Polymorphic viruses**: Just as biological viruses mutate, so do polymorphic
    viruses, changing their source code with each infection to make detection and
    removal harder.


    +   - **Macro viruses**: These infect the macros (little pieces of code that do
    specific tasks) in program files, such as word-processing documents or spreadsheets.


    +   - **Active X viruses**: Active X is a framework used by software programs
    to share information, and by infecting this framework, Active X viruses can spread
    easily.'
