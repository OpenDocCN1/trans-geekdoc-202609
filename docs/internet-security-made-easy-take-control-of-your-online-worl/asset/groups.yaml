    # # WINDOWS TOOLS


    Windows has a number of tools that can help you repair your system registry.


    +   - Scandisk: Will scan hard drives for potential errors and corrupted files.


    +   - Safe Mode: Designed for troubleshooting. Safe Mode boots up a limited version
    of Windows with only the minimum of files installed.


    +   - System Restore: Lets you roll back the operating system to a previous state.


    # ## Scandisk


    Performing a scan of your hard drive is relatively easy.


    +   1. Click Start and select My Computer.


    +   2. Right click on the drive you want to scan and select Properties.


    +   3. Click the Tools tab and under Error Checking, click the Check now button.


    +   4. In the window, select whether you want to fix errors automatically or not.
    (Windows 7 and later), then hit Start.


    > > **Hot Tip**

    > > If your computer crashes, Windows will automatically run Scandisk and check
    the hard drive for errors when it boots up.


    # ## Safe Mode


    If your machine simply will not boot up, you can try starting in Safe Mode and
    then run Scandisk once Windows has booted up.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_224_0.png)


