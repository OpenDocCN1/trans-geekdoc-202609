    Similar to a computer virus, a worm can self-replicate and is designed to do harm.
    However, the big difference is in the way a worm spreads. Rather than infecting
    files that require human activity to pass them on, such as in email attachments,
    worms can spread over computer networks without assistance. When one computer
    on a network is infected, the worm will spread to all other machines on that network.
    Some worms have even been known to email themselves to everybody in a person''s
