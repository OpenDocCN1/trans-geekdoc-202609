    This book is aimed at both those new to the Internet and Internet security and
    those with more online experience. We provide basic help on protecting your computers
    and online accounts, as well as some more advanced Internet security advice, such
    as how to manually remove viruses and malware, repair your system following an
    attack, or how to surf the Internet anonymously.


    ### Cutting through the Complexity


    The world of Internet security can be a complicated one, but we have tried to
    simplify as many aspects as we can, so if you are unsure what HyperText Mark-up
    Language is, or what browser cookies do, we will explain everything in a language
    that we are sure you will understand.


