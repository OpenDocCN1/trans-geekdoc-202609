    # # Keylock on Windows Phones and Tablets


    Windows phones and tablets utilize either a version of the Windows Mobile operating
    system or Windows 8. Windows 8 permits the use of password locking as with normal
    PCs and laptops (see Securing a Laptop on page 190), while some Windows phones,
    such as those using Windows Phone 7, allow you to set a lock-screen password.


    +   1. On your application list, select Settings.

    +   2. Press Lock Screen and turn on the Password option (if not already on).

    +   3. You will be prompted to enter a new password twice. After this, press Done
    to save your changes.


    # ## Other Devices


    Of course, Android, iOS and Windows are not the only operating systems available
    for smartphones and tablets. It is impossible to cover the security features for
    all devices and operating systems in this book, but most devices will have some
    form of key-lock security, which you can set by going into your security settings.


    # ## REMOTE WIPE


    As its name suggests, Remote Wipe is a function that enables you to wipe the contents
    of your phone remotely, so if your device is stolen, you can be assured nobody
    will be able to access your files or online accounts. It works by restoring your
    device to the factory settings, erasing everything in the process, including numbers,
    files, photos, saved passwords and browser history.'
