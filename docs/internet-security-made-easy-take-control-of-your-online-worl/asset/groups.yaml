  - '[PAGE 165]


    # Exceptions


    If your antivirus software starts to interfere with the normal running of some
    programs, you can instruct the antivirus to ignore these programs from scans and
    threat detection. Adding exceptions is normally straightforward in most antivirus
    software.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_165_0.png)


    Above: Exceptions menu in AVG.


    +   1. Click Add Exception in the exceptions settings menu.

    +   2. Choose whether it is a file, folder or program you wish to exclude.

    +   3. Enter or browse for the location of the item you want to exclude.

    +   4. Select what you want to exclude the file from, such as scanning or shield
    protection, and click Save.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_165_1.png)


    Above: Browsing for a file to exclude from antivirus scans.


    # Reporting Back


    Because antivirus software is dependent on identifying new threats and finding
    solutions to defend against them, your software may send a report to the developers
    if it finds a new threat, including data about your machine. This information
    is normally anonymous, and not identifiable to you, but you can usually turn this
    feature off if you feel uncomfortable about it.'
  - '[PAGE 166]


    # USING FIREWALLS


    Firewalls are as important as antivirus software for protecting you from threats.
    Most antivirus software comes with a firewall, or you may have one built into
    your operating system, but to ensure proper protection, you need to know how to
    use it properly.


    # WHAT IS A FIREWALL?


    While your antivirus software can protect you from malware by scanning files and
    folders, other threats can still get through your computer, such as hackers and
    bots. To guard against unauthorized access, a computer or network needs a firewall.
    Firewalls work by filtering traffic and only letting through certain communications
    depending on a given set of criteria.


    > Did You Know?

    > A firewall normally acts as a one-way barrier to the Internet; while it will
    block traffic coming into a computer, it will allow free access for outbound traffic.


    # Hardware and Software


    A firewall is commonly a software barrier, often installed in an operating system
    or with antivirus software, but you can use hardware firewalls for added protection.
    For more information on hardware firewalls, see pages 243–45.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_166_0.png)


    Right: Firewalls act rather more intelligently than a brick wall – filtering out
    dangerous traffic.'
  - '[PAGE 167]


    # Installing Firewalls


    Most antivirus software comes with a firewall, as do many operating systems. You
    can easily check if you have a firewall installed.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_167_0.png)


    Above: Opening up the Security Center on a PC.


    +   1. On a Windows machine, click start and open up the **Control Panel**. On
    a Mac, open up the **System Preferences** from the Apple menu.


    +   2. On a Windows machine, select the **Security Center**; on a Mac, choose
    **Security and Privacy**.


    +   3. You can see if your firewall is active by the green **On** button in Windows
    and in the **Firewall** tab on a Mac.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_167_1.png)


    Above: Windows firewall is activated.


    # Third-party Firewalls


    If you do not have a firewall installed, you can buy or download free third-party
    firewalls.


    Some third-party firewalls include:


    +   ♣ **ZoneAlarm** (http://www.zonealarm.com/): Has a free firewall, but also
    sells a compatible antivirus and security suite.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_167_2.png)


    Above: ZoneAlarm is a popular free firewall.


    +   ♣ **Comodo** (http://personalfirewall.comodo.com/): Provides a free firewall
    as well as a paid-for antivirus and firewall suite called Internet Security Pro.'
  - '[PAGE 168]


    Online Armor: A paid for firewall (£25.07/$40.00 per year) that is rated as one
    of the best on the market.


    # ## COMMON FIREWALL PROBLEMS


    Most issues around firewalls are caused by the firewall blocking access to innocent
    programs that need to send data to your computer. Sometimes using a firewall can
    stop certain features of applications from working properly. In the majority of
    cases, these problems can be rectified by adjusting settings in your firewall
    to allow incoming traffic.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_168_0.png)


    # ## Exceptions


    When your firewall blocks something, a box may pop up to tell you and give you
    the option of allowing the item through. However, it may not, in which case you
    have to add an exception to your firewall settings to allow data needed by the
    program to enter your firewall.


    **Hot Tip**


    Some programs, such as antivirus software, automatically include themselves as
    exceptions in your firewall settings. However, some malware can do this too, so
    it is worth checking to see what has been made an exception in your firewall settings.'
  - '[PAGE 169]


    # Adding Exceptions to Windows Firewall


    Adding a program as an exception to most firewalls is relatively straightforward.
    Here''s how to add a program as an exception to Windows Firewall.


    +   1. Open up the Windows Security Center and click on Windows Firewall.


    +   2. In the Windows Firewall menu, click on Exceptions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_169_0.png)


    +   3. Click Add Programs.


    +   4. Select the program from the menu, or Browse for it on your hard drive.


    +   5. Click OK to add to exceptions.


    # Removing an Exception


    If you wish to remove a program from your list of exceptions, just select it and
    click Delete.


    Above: Adding a program as an exception to the firewall.


    # PORTS


    When data arrives on your computer, it does so by the way of an open port. A port
    is simply the pathway on which data travels to your computer. Normally these pathways
    are blocked by the firewall, but to authorize communication, the firewall opens
    a port to allow access. Most software is usually programmed to send data through
    a specific port, but sometimes a program may not have a predetermined port number
    and you may need to open one or redirect the data.'
  - '[PAGE 170]


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_170_0.png)


    # # Changing Port Numbers


    If a program is not working properly, such as freezing or crashing, or you are
    receiving Windows’ error messages indicating you have a software conflict or that
    it has blocked a port, it may be a sign you have several programs trying to use
    the same port and you may need to reassign the port number. However, most software
    will only work through certain ports, so if a user manual came with your program,
    look to see what ports it can work with.


    +   1. Open up the firewall settings (here we show Windows Firewall).


    +   2. In the Exceptions tab, select the program for which you need to open a
    new port and select Edit then Change Scope.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_170_1.png)


    +   3. Enter the new port address.


    Above: Editing a port number in Windows Firewall.'
  - '[PAGE 171]


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_171_0.png)


    # Opening Ports


    Sometimes your software may not be able to automatically open its own port, which
    means you may have to do it manually.


    +   1. In your firewall settings, select Add Port.


    +   2. Enter the name of the program you want to open a port for.


    +   3. Enter the port address (consult your software manual for suitable ports).


    +   4. Click OK.


    Above: Changing a port address in Windows Firewall.


    # Port Forwarding


    Some hardware firewalls allow port forwarding. When you forward a port, you are
    redirecting the data. This is often done to speed up the performance of the data
    entering a network, as congested ports can slow down programs and applications.
    However, you cannot simply forward data to any old port, it has to be one that
    is compatible with your software. In addition, it is not something you should
    try unless you are confident you know what you are doing.


    # Running Multiple Firewalls


    Some firewalls are compatible with each other, but generally speaking, running
    more than one firewall at a time can cause conflicts, which may leave your computer
    exposed to threats.


    # Turning off Your Firewall


    If your firewall is causing an issue that you cannot solve, such as preventing
    a program from working, you can turn your firewall off using the firewall settings.
    However, your computer will be vulnerable to threats as long as the firewall is
    not on, so ensure you turn it back on again as soon as possible.'
