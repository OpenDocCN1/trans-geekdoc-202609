  - '[PAGE 24]


    # # THE ATTACKS BEGIN


    While the web has hugely expanded our opportunities, it has also made us vulnerable.
    Since the very start of the World Wide Web, users with malicious motives began
    to take advantage of it.


    # ## BRAVE NEW WORLD


    Tim Berners-Lee''s vision for the World Wide Web was a system that would bring
    the world closer together, enabling free access to information and the exchange
    of ideas. This concept meant that very little thought was given to security, and
    in the very early days of the web, when there were just a few users, the need
    to protect information and data did not arise. However, that was soon to change.


    # ### The Threat


    It didn''t take long before malicious users threatened the basic ideals of the
    web by taking advantage of the ever-increasing number of users. Computer viruses,
    hackers and people seeing the Web as an opportunity to commit crime have meant
    that security became an ever-increasing concern for Internet users.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_24_0.png)


    Above: The web was designed without much thought given to Internet security.'
  - '[PAGE 25]


    # HACKING


    Gaining unauthorized access to a computer or the data that it holds is known as
    hacking. However, computer hacking predates both the World Wide Web and the Internet.
    In fact, the first hackers had nothing to do with computers at all.


    # The First Computer Hackers


    The first hackers appeared in the 1960s and 1970s. During this time, the most
    rapidly developing technology was in telecommunications, and a practice developed
    in America where by people would try to bypass telecoms systems in an attempt
    to get free phone calls – a practice that became known as ‘phreaking’. When computers
    gained popularity in the late 1970s and early 1980s, many of the people who had
    been involved in phreaking began to take an interest in this emerging technology
    and started to gain unauthorized access to computer systems, often just for the
    fun of it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_25_0.png)


    Above: John Thomas Draper. one of the most famous figures in the computer-hacking
    fraternity.


    # Did You Know?


    Former phone phreaker and computer programmer John Thomas Draper, known as Captain
    Crunch, gained notoriety in the 1970s following several high-profile arrests,
    and is considered by many to be the father of the modern-day computer hacker.'
