    parties as well as spy on your online activities. However, if you suspect you
    have a malware threat, quite often the best way to resolve it is to uninstall
    any apps that you think could be the cause. You can always reinstall innocent
    apps once you have resolved any threat.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_208_0.png)


    ## Parental Controls


    As with desktop computers, you can limit what your children see on their smartphones
