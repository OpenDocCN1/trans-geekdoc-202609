  mdcn: "\n\n总计\n公用事业费\n$3763.55\n$1163.55\n$1319.27\n$73.18\n2013 年 2 月\n\n下载\n计算器\n\
    \nAlt Gr\n菜单\nCtrl\n\n## 智能手机、平板电脑和笔记本电脑\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_180_0.png)\n\
    \n## 移动安全\n\n得益于智能手机、平板电脑和 Wi-Fi 接入点，我们不再需要被束缚在办公桌前才能访问互联网，但这种自由伴随着自身的安全风险。\n\n\
    ## 移动技术\n\n使用智能手机、平板电脑和笔记本电脑等设备访问移动互联网技术时，最大的安全威胁之一是，这些设备容易成为窃贼的目标。此外，如果你在长途火车旅行中一直在使用移动设备，很容易将其落下，而丢失或被盗的智能手机、平板电脑和笔记本电脑可能会引发安全噩梦。这些设备不仅包含重要文件和文档，还可能存储大量私人和个人信息，包括照片、账户号码以及我们在线账户的密码。\n\
    \n> ### 小贴士\n> \n> 始终留意你的移动设备。设备不一定会被盗，你就会丢失数据。黑客可以将 U 盘插入无人看管的设备，安装窃取数据的恶意软件。\n\
    \n左图：随时随地访问互联网为我们带来了无限自由，但这并非没有风险。\n\n### 盗窃风险\n\n智能手机、平板电脑和笔记本电脑是窃贼觊觎的目标。由于体积小巧，这些移动设备容易被顺手牵羊，窃贼也发现它们在黑市上很容易出售。因此，在外出携带移动设备时，值得格外小心。\n\
    \n- 位置：在掏出手机或平板电脑之前，先观察周围环境。注意附近有谁，以及是否安全取出设备。\n- 无人看管：绝不要让移动设备无人看管，哪怕只有几秒钟。放在桌上的手机很容易被拿走，切勿将移动设备留在车内。\n\
    - IMEI 号码：所有智能手机和平板电脑都有一个 15 位的 IMEI 号码，通常印在电池下方。知晓此号码可让你的运营商在设备丢失或被盗时将其屏蔽（即使更换了\
    \ SIM 卡）。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_182_0.png)\n\n- 备份：确保你的手机和平板电脑上已备份所有文件和照片，以防万一。\n\
    \n> 右图：IMEI 号码通常位于条形码上或序列号旁边。\n\n## 保护您的数据\n\n如果你的平板电脑、智能手机或笔记本电脑丢失或被盗，你不仅需要承担更换设备的费用，还面临个人数据落入他人之手的风险。如今，移动设备被用于各种用途，从社交媒体到网上银行和电子邮件。这意味着你的设备可能包含高度敏感的数据，包括账户号码、用户名和密码。\n\
    \n**小贴士**\n\n为手机或平板电脑设置密码时，请选择一个强密码，不能被通过试错法猜出。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_183_0.png)\n\
    \n### 密码保护\n\n确保智能手机或平板电脑上存储的数据和信息安全的最简单方法之一，是利用制造商提供的密码保护系统。大多数智能手机和平板电脑都带有某种形式的密码锁，防止未经授权的用户访问设备，实施起来相对简单，具体取决于所涉及的设备。\n\
    \n### iOS 设备上的密码\n\n在早期的 Apple 平板电脑和手机上，你只能设置四位数字密码。然而，在 iOS4 及更高版本的设备上，你可以设置完整密码，从而提供额外的安全性。当手机未使用一段时间后锁定将被激活，这意味着你需要输入密码才能解锁手机。\n\
    \n左图：如果输入错误的密码，大多数手机会锁定一分钟左右。\n\n### 设置 iOS 密码/密码锁\n\n1. 打开“设置”应用并选择“通用”。\n2.\
    \ 选择“密码锁”并将其打开。\n3. 输入新密码或密码锁。\n4. 回到“通用”菜单，你可以更改自动锁定设置，即设备锁定自身之前的等待时间。设置为“立即”意味着每次你想要访问设备时都必须输入密码。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_184_0.png)\n\n上图：在 iPhone 上打开密码锁。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_184_1.png)\n\n> 你知道吗？\n> \n> 密码只能防止访问你的数据，而不会完全禁用你的手机，因为小偷可能会执行“出厂重置”，这将擦除你的数据但允许手机被使用。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_185_0.png)\n\n上图：在 Android 手机上设置滑动解锁图案。\n\
    \n## Android 设备上的滑动安全\n\n大多数 Android 设备包括使用滑动图案锁定手机的功能，这是一种用手指创建的独特形状，用于解锁手机。与密码一样，你需要想出一些不容易被猜出或通过试错法破解的内容。这意味着不要使用明显的形状，例如十字或\
    \ L 形。\n\n### 设置 Android 滑动图案\n\n1. 进入“设置”并选择“安全”。\n2. 选择“更改解锁图案”并勾选“要求图案”。\n\
    3. 划出你想要用来解锁手机的图案。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_185_1.png)\n\n\
    上图：如果你忘记了滑动锁，可以输入 Gmail 账户来解锁手机。\n\n### 忘记滑动图案\n\n如果你忘记了 Android 设备的安全图案，可以向下并向右滑动手指。这将向你展示输入\n\
    \n> **你知道吗？**\n> 如果在 Android 设备上五次都未能划出正确的图案，设备将锁定，你需要等待 30 秒后才能再次尝试。\n\n你的 Gmail\
    \ 地址和密码（手机或平板电脑需要连接到互联网才能实现这一点），如果正确且已与手机同步，将解锁它。\n\n## 其他平板电脑和智能手机锁定功能\n\n较新版本的\
    \ iOS 和 Android 设备都安装了其他安全功能，你可以使用这些功能来锁定/解锁手机。要访问这些功能，你需要在设备的设置中访问安全菜单。\n\n-\
    \ 人脸解锁：某些平板电脑和智能手机允许使用面部识别软件，确保只有你的脸可以解锁设备。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_186_0.png)\n\
    \n上图：你可以在较新的 iPhone 上安装面部识别软件。\n\n- 签名：某些设备，例如 Galaxy Note 平板电脑，允许你使用手写签名来锁定/解锁设备。\n\
    - 密码和 PIN：某些 Android 设备，例如 2.2 Froyo，允许使用密码锁和密码。\n- SIM 卡 PIN：为了防止有人取出你的 SIM 卡并在另一部手机中使用，你可以在某些智能手机上设置\
    \ PIN 锁。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_187_0.png)\n\n上图：Windows\
    \ 手机上的锁屏设置。\n\n## Windows 手机和平板电脑上的键盘锁\n\nWindows 手机和平板电脑使用 Windows Mobile 操作系统的一个版本或\
    \ Windows 8。Windows 8 允许使用与普通 PC 和笔记本电脑相同的密码锁定（请参见第 190 页的保护笔记本电脑），而某些 Windows\
    \ 手机，例如使用 Windows Phone 7 的手机，允许你设置锁屏密码。\n\n1. 在应用程序列表中，选择“设置”。\n2. 按下“锁屏”并打开“密码”选项（如果尚未打开）。\n\
    3. 系统将提示你两次输入新密码。之后，按“完成”保存你的更改。\n\n### 其他设备\n\n当然，Android、iOS 和 Windows 并不是智能手机和平板电脑上可用的唯一操作系统。在这本书中不可能涵盖所有设备和操作系统的安全功能，但大多数设备都会有某种形式的键盘锁安全功能，你可以通过进入安全设置来设置它。\n\
    \n### 远程擦除\n\n顾名思义，远程擦除是一项功能，使你能够远程擦除手机的内容，因此，如果你的设备被盗，你可以放心，没有人能够访问你的文件或在线账户。它通过将设备恢复到出厂设置来工作，在此过程中擦除一切内容，包括号码、文件、照片、保存的密码和浏览器历史记录。\n\
    \n"
