  - '[PAGE 64]


    # Scareware


    Scareware is a less blunt method of obtaining money, where the malware creates
    a fake warning message suggesting your computer has been infected with a virus
    or spyware while suggesting you buy a particular malware removal product to solve
    the problem.


    # Trojan Horse


    A Trojan horse does not describe a particular type of malware, such as spyware
    or virus, but describes a method of delivery. A Trojan horse is a piece of malware
    that is disguised as a legitimate file. Trojan horses can be spyware, or contain
    pieces of code that will join your computer to a botnet (we will discuss these
    in a minute). Trojan malware rarely replicates or spreads from machine to machine,
    as the purpose of a Trojan is to run in the background so a user does not know
    he or she has been infected.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_64_0.png)


    Above: Some ransomware not only locks your files, but also threatens to destroy
    them at a certain time.


    # Rootkit


    Another type of malware that tries to remain hidden to avoid detection is the
    rootkit. A rootkit buries itself deep in the operating system much like a boot
    virus does, but they do not replicate or try to spread to other machines. Their
    purpose is to remain hidden so antivirus software and other security measures
    cannot detect them as they carry out the tasks they were programmed for. They
    are also notoriously difficult to remove.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_64_1.png)


    Above: The best way to protect yourself from malware is to use antivirus programs.'
  - '[PAGE 65]


    # Bots


    As mentioned in the previous chapter, bots are computer codes designed to do a
    specific task. Bots are not necessarily malevolent; search engines, for instance,
    use bots to identify what is on a web page, but bots can be used maliciously,
    especially when they are working together (see below).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_65_0.png)


    # Botnets


    Botnets are when large number of bots work together for a common goal. When a
    computer becomes part of a botnet, the bots function on people''s computers in
    the background with the user often unaware. Botnets work together and can send
    out spam and other malware, or target specific networks or website servers, either
    to take them down or to bombard them with so many requests that the server becomes
    clogged, known as a distributed denial of service attack (DDoS).


    Left: Unexplained network activity could mean you have become part of a botnet.


    # Hot Tip


    If your Internet connection is running slowly, or you notice network activity
    even when you are not on the Internet, it could be because your machine may have
    become part of a botnet.'
  - '[PAGE 66]


    # PROTECTING YOURSELF


    As computers and the Internet get ever more sophisticated, so do viruses and malware.
    Antivirus developers are in a constant battle to identity and eliminate new threats.
    However, they are always one step behind the malicious coders. Antivirus software
    is crucial, but even with it installed, malware can still be a problem. Because
    of this, it is worth being prepared for the worst.


    # Backing Up


    Data loss can be one of the worst outcomes from an attack by malware, so ensure
    you back up all your important files regularly. However, it is worth remembering
    that if a virus has been on your machine for a while, your backup files may also
    be infected. Do not just have one system for backing up either; think about using
    a cloud solution (online file storage) as well as a hardware system, such as a
    flash drive.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_66_0.png)


    Above: Cloud storage solutions such as Dropbox can be used to store back-ups of
    your important files.


    # PC Health Checks


    Regular use of diagnostic software (see pages 174–77) can help spot and eliminate
    threats before they cause harm. You can also take your computer to a trained professional
    for regular health checks.


    # Warning Others


    If your system does


    become infected with malware, think about warning other people, such as those
    in your email address book, as you may have inadvertently already spread the malware.'
  - '[PAGE 67]


    # # THE WORST OFFENDERS


    Malware can often make the headlines, especially when it attacks high-profile
    organizations, or if it has become particularly widespread. Here are some famous
    examples of malware.


    +   - **The Love Bug virus**: Perhaps the most successful computer virus attack
    in history, infecting an estimated 50 million computers. The virus was hidden
    in an email attachment purporting to be a love letter, triggering people to open
    it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_67_0.png)


    +   - **The Anna Kournikova worm**: The Kournikova worm was attached to an email
    claiming to have naked pictures of the tennis star. Once opened, the worm sent
    itself to everybody in a user''s address book and infected tens of millions of
    machines.


    +   - **Conficker Botnet**: In 2009 Conficker became the largest botnet ever and
    took control of millions of PCs around the world, yet to this day nobody knows
    for what purpose or by whom.


    Left: Promises of naked pictures of Anna Kournikova were enough to convince millions
    of people to open an attachment containing a virus.'
  - '[PAGE 68]


    # # IDENTITY THEFT


    Identity fraud is one of the fastest-growing crimes and it can cause chaos for
    its victims. Identity theft can result in somebody stealing from you, taking out
    loans in your name or even committing crimes while pretending to be you.


    # ## A CASE OF STOLEN IDENTITY


    In 2006, when 24-year-old university graduate Victoria Sennitt opened her post,
    she was surprised to see a letter from a mobile phone company welcoming her to
    her new contract. Because Victoria had not signed up for a new mobile phone, she
    made some enquiries and was shocked to discover her identity had been stolen by
    fraudsters, who had used information she had left on social media websites to
    apply for a mobile phone.


    ''I know it sounds stupid,'' Victoria told UK Newspaper The Daily Mail, ''but
    I feel very violated to know that a criminal was able to log on to my page and
    steal my personal details.''


    Victoria was lucky; she managed to convince the phone company that it was a fraudster
    who had taken out the contract, but not everybody is so fortunate.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_68_0.png)


    **Above:** Fraudsters may assume your identity in order to make purchases – for
    which you then receive the bill.'
  - '[PAGE 69]


    # A Growing Problem


    Identity theft is a huge problem. In the United States, it is estimated that identity
    theft costs Americans over $20 billion each year, and in the UK, identity fraudsters
    are stealing nearly £2 billion of other people’s money. And the problem is getting
    worse.


    # Online Activity


    Identity theft is not just an online problem; fraudsters can get hold of our personal
    information in other ways, such as going through our rubbish bins. However, the
    reason identity fraud is rising so quickly is because there is an increasing amount
    of information about us online, which has made it so much easier to get hold of
    our personal details. Using social media, email and other online platforms, fraudsters
    have ready access to all sorts of personal information about us, which they can
    use to commit fraud in our name.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_69_0.png)'
  - '[PAGE 70]


    # CONSEQUENCES OF IDENTITY THEFT


    Before we look at how identity fraudsters get hold of our personal information
    and what we can do about it, it is worth reiterating the consequences of having
    your identity stolen.


    +   - **Financial:** Somebody assuming your identity can take out loans and other
    financial commitments under your name, for which you may be deemed liable.


    +   - **Driving licence:** Your name could be used to obtain a driving licence,
    which could result in you being penalized for somebody else''s driving infringements.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_70_0.png)


    +   - **Benefits and tax:** An identity fraudster may use your name to claim State
    benefits or file fraudulent tax returns.


    +   - **Passport:** Your identity may be used to obtain a passport, preventing
    you from getting one.


    Above: With enough information, fraudsters can apply for credit cards in your
    name.


    +   - **Crime:** Frauds or other crimes may be committed under your name, for
    which you could be held responsible if you cannot prove it was not you.


    > **Hot Tip**

    > Never divulge information over the Internet that could be used to steal your
    identity, especially your address, phone number, and bank and credit card details.


    +   - **Credit score:** Your credit rating could be damaged, making it harder
    for you to get a loan, mortgage or credit card.


    +   - **Reputation:** Somebody pretending to be you could say and do things on
    social media that may cause you embarrassment.'
