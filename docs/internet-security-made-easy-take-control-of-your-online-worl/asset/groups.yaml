  md: "\n## Hot Tip\n\nIf your child seems withdrawn or quieter than normal, it could\
    \ be a sign of being bullied. Speak to them and get them to talk to you.\n\nAttack\
    \ from other children, often known to them, who use emails, text messages, chat\
    \ rooms and social media to intimidate and threaten, in what has come to be known\
    \ as cyberbullying.\n\n## Types of Online Bullying Behaviour\n\nBullying can take\
    \ many forms, from other children spreading rumours and gossip about your child,\
    \ to threats of violence, blackmail, abusive comments and alienation. The problem\
    \ with identifying if your child is being bullied is that children are very reluctant\
    \ to speak about it; they may even be scared to report it in case of further attacks\
    \ by the bully. In addition, your child may worry that even if they do tell you,\
    \ you may not take it seriously. Indeed, what may seem like a bit of trivial name-calling\
    \ may be causing your child severe anxiety, which could even lead to depression.\n\
    \n## Consequences of Online Bullying\n\nGenerally speaking, most incidents of\
    \ online bullying are minor, and early intervention can prevent it escalating.\
    \ However, there have been cases where children have felt so isolated and fearful\
    \ of online bullies that they have harmed themselves.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_122_0.png)\n\
    \nAbove: Website Bullying UK (http://www.bullying.co.uk/cyberbullying/) can help\
    \ you and your child deal with issues around cyberbullying.\n\n## INAPPROPRIATE\
    \ CONTENT\n\nPornography and violent pictures and videos are not something any\
    \ of us want our children exposed to. There are tools and software you can use\
    \ (more on this in the next section) to guard against your children viewing such\
    \ content, but there are few restrictions and checks on websites themselves to\
    \ prevent minors from accessing the content.\n\n### Pornography\n\nAdult pornography\
    \ is perfectly legal, and while some websites require credit cards before people\
    \ can access it, many do not. This means that anybody can click on a link or visit\
    \ a web page and see pornographic material.\n\n### Illegal Material\n\nSexual\
    \ content featuring minors (child pornography) is illegal, and viewing and possessing\
    \ such material can result in a criminal prosecution, even if the people accessing\
    \ it are minors themselves. Children are at risk of accessing other types of illegal\
    \ material on the Internet too, such as pirated films, music and anything that\
    \ promotes criminal activities.\n\n> ### Hot Tip\n> If you find illegal content\
    \ on the Internet, you can report it in confidence to the Internet Watch Foundation\
    \ – www.iwf.org.uk/report/\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_123_0.png)\n\
    \n**Right:** You can report illegal web content at the Internet Watch Foundation.\n\
    \n### Other Inappropriate Material\n\nNot everything we would rather not have\
    \ our children access is illegal or pornographic. Films, music and video games\
    \ are widely available on the Internet, and some of these we may feel are unsuitable.\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_124_0.png)\n\n### DAMAGED REPUTATIONS\n\
    \nWe have already seen that things we post on the Internet can have long-lasting\
    \ consequences. Images, comments and posts can stay there for ever. It is also\
    \ very easy to copy and paste content from one site to another, so something that\
    \ your child sends to just a few select friends could soon be available for anyone\
    \ to see, even years later.\n\n### Selfies\n\nYoungsters love sending and posting\
    \ 'selfies' – photos of themselves that they have usually taken on their smartphone\
    \ cameras. Selfies can be great fun, and many people take shots of themselves\
    \ when out with friends or if they happen to meet a celebrity. However, there\
    \ is a darker side to the selfie, and both\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_124_1.png)\n\
    \nAbove: Selfies are a popular craze; even celebrities take selfies, such as this\
    \ one taken at the 2014 Oscars.\n\nchildren and adults need to be aware that they\
    \ should not post nude or inappropriate pictures of themselves, as they can have\
    \ widespread and damaging repercussions.\n\n> Hot Tip\n> \n> A photo-messaging\
    \ app called Snapchat (www.snapchat.com) allows people to send pictures that disappear\
    \ after a few seconds. However, it is possible for people to screen grab these\
    \ images.\n\n### SEXUAL PREDATORS\n\nPerhaps the biggest fear many parents have\
    \ about their children's use of the Internet is the threat of contact with an\
    \ online predator. Reports in the media about such threats may make it seem like\
    \ it is all too common; thankfully, the threat of your child becoming a victim\
    \ to sexual predator is rare, but of course, it can happen.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_125_0.png)\n\
    \n### Stranger Danger\n\nBefore the Internet, it was easy to warn children about\
    \ the dangers of talking to strangers. However, in the Internet era, with social\
    \ media, chat rooms, forums and text messages, it can be all too easy for strangers\
    \ to make contact. Furthermore, one of the great advantages of the World Wide\
    \ Web is that your children can meet and chat with children from all over the\
    \ world, which can be a positive experience, but which can also pose some perils.\n\
    \nLeft: Snapchat is a safer way for children to swap 'temporary' pictures, but\
    \ while it is safer, it is still not 100 per cent safe.\n\n### Grooming\n\nSexual\
    \ predators try to befriend and exploit children in a number of ways; these techniques\
    \ are known as grooming.\n\n- **Posing as a child**: They may pose as someone\
    \ of the same age group to get close to children; often they pretend to be a child\
    \ of the opposite sex interested in a relationship.\n- **Personal information**:\
    \ Sexual predators sometimes try to extract personal information from children,\
    \ such as addresses, emails or phone numbers.\n- **Bribery**: As a means of getting\
    \ a child to meet up, a sexual predator may offer tickets to a pop concert, cinema\
    \ or other event.\n- **Blackmail**: Another known tactic is to threaten to disclose\
    \ something a child has said on the Internet to make them to do something they\
    \ do not want to do.\n- **Intimacy**: They may ask intimate questions or send\
    \ inappropriate images.\n\n### Child Exploitation and Online Protection Centre\n\
    \nA special criminal taskforce has been set up in the UK solely to track online\
    \ sexual predators. It is called the Child Exploitation and Online Protection\
    \ Centre (CEOP). If you suspect your child has been in contact with a sexual predator,\
    \ you can contact CEOP at http://ceop.police.uk/\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_126_0.png)\n\
    \nAbove: CEOP police the Internet to protect children from exploitation and online\
    \ grooming.\n\n## KEEPING CHILDREN SAFE\n\nNow you know the risks faced by children\
    \ on the Internet, it is time to look at the measures you can take to ensure your\
    \ children are safe when they interact with the World Wide Web.\n\n### EDUCATION\n\
    \nPerhaps the first step in ensuring your children are safe on the Internet is\
    \ to check that they know the risks. This does not mean you should frighten them,\
    \ but it is worth explaining some of the basic measures you can do together to\
    \ keep them safe while surfing.\n\n- **Permanence:** It is worth reminding your\
    \ children what goes online can stay online for ever.\n- **Privacy:** Explain\
    \ to them how privacy settings work on social media so only their friends and\
    \ family can see photographs or posts.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_127_0.png)\n\
    \n- **Personal information:** Reiterate the importance of being aware of how much\
    \ personal or sensitive information they divulge.\n- **Passwords:** Make sure\
    \ they understand the importance of not sharing their passwords, except perhaps\
    \ with parents.\n- **Strangers:** Ensure your children know not to meet up with\
    \ anybody they meet on the Internet, as they may not be who they said they were.\n\
    \nAbove: Educate your child about the risks associated with the Internet.\n\n\
    ### MONITORING WEB USE\n\nOne of the things parents find difficult is knowing\
    \ where the line is between invading your child's privacy and sensible monitoring\
    \ of their Internet use. Children will not appreciate you standing over their\
    \ shoulder while they speak to their friends on social media, or accessing their\
    \ accounts so you can read their posts, but there are other ways in which you\
    \ can monitor their web use.\n\n### Hot Tip\n\nSpending too much time on the Internet\
    \ is not good for anybody, let alone children. Some parents set limits as to how\
    \ long their children can spend online each day.\n\n### Page History\n\nYou may\
    \ not feel comfortable snooping on your child's Facebook or Bebo page, but as\
    \ a parent, it is sensible to ensure your children are not accessing inappropriate\
    \ material, and one of the easiest ways to do this is to check their web history.\n\
    \n- 1. On your Internet browser, select options (this may be represented by three\
    \ horizontal lines or a gear icon).\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_128_0.png)\n\
    \nAbove: Web history in Chrome.\n\n- 2. Select History.\n- 3. You will be taken\
    \ to a page of all the websites visited in chronological order (newest first).\
    \ Click on the links if you are unsure what they are and want to check the content\
    \ of the website.\n\n### RESTRICTING WEB ACCESS\n\nIn order to prevent your children\
    \ from accessing inappropriate material, you may wish to restrict the type of\
    \ websites they can visit. There are several ways of doing this. However,\n"
  mdcn: "\n\n## 热贴士\n\n如果您的孩子显得孤僻或比平时安静，这可能是遭受霸凌的迹象。跟他们说话，让他们和你交谈。\n\n来自其他儿童的攻击，通常是他们认识的人，他们利用电子邮件、短信、聊天室和社交媒体来恐吓和威胁，这种行为如今被称为网络霸凌。\n\
    \n## 网络霸凌行为类型\n\n霸凌形式多种多样，从其他儿童散布关于你孩子的谣言和闲言碎语，到暴力威胁、敲诈勒索、辱骂性评论和孤立。识别你的孩子是否遭受霸凌的问题在于，孩子们非常不愿意谈论此事；他们甚至可能害怕报告，以防霸凌者进一步攻击。此外，你的孩子可能担心，即使他们告诉了你，你也可能不会认真对待。事实上，看似无关紧要的谩骂可能会给孩子带来严重的焦虑，甚至导致抑郁。\n\
    \n## 网络霸凌的后果\n\n一般来说，大多数网络霸凌事件都是轻微的，早期干预可以防止其升级。然而，也有案例显示，孩子们感到如此孤立和害怕网络霸凌者，以至于他们自残。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_122_0.png)\n\n上方：霸凌英国网站（http://www.bullying.co.uk/cyberbullying/）可以帮助你和你的孩子处理网络霸凌问题。\n\
    \n## 不当内容\n\n色情和暴力图片和视频是我们都不希望自己的孩子接触到的。有可使用的工具和软件（下一节将详细介绍）来防止孩子们观看此类内容，但网站本身几乎没有限制和检查来防止未成年人访问此类内容。\n\
    \n### 色情\n\n成人色情是完全合法的，虽然有些网站在人们访问前要求信用卡，但许多网站不要求。这意味着任何人都可以点击链接或访问网页并看到色情材料。\n\
    \n### 非法材料\n\n涉及未成年人的性内容（儿童色情）是非法的，观看和持有此类材料可能导致刑事诉讼，即使访问者本身是未成年人。孩子们也面临在互联网上访问其他类型非法材料的风险，例如盗版电影、音乐以及任何宣传犯罪活动的内容。\n\
    \n> ### 热贴士\n> 如果您在互联网上发现非法内容，可以保密向互联网观察基金会举报 – www.iwf.org.uk/report/\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_123_0.png)\n\
    \n**右侧：** 您可以在互联网观察基金会举报非法网络内容。\n\n### 其他不当材料\n\n并非我们不希望孩子接触的一切都是非法或色情的。电影、音乐和视频游戏在互联网上广泛可得，其中有些我们可能认为不合适。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_124_0.png)\n\n### 受损的声誉\n\n我们已经看到，我们在互联网上发布的事情可能会产生长期的后果。图片、评论和帖子可以永久保留在那里。从一个网站复制粘贴内容到另一个网站也非常容易，所以你的孩子发给仅几个精选朋友的东西，很快就可能让任何人看到，即使是多年后也是如此。\n\
    \n### 自拍\n\n年轻人喜欢发送和张贴 'selfies' – 照片的是他们自己，通常是用智能手机相机拍摄的。自拍可以很有趣，许多人在外出与朋友在一起或碰巧遇到名人时会拍摄自己的照片。然而，自拍也有黑暗的一面，而且\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_124_1.png)\n\n上方：自拍是一种流行的时尚；即使是名人也会拍自拍，比如这张在2014年奥斯卡颁奖典礼上拍摄的自拍。\n\
    \n儿童和成人都需要意识到，他们不应该发布自己裸露或不当的照片，因为这可能会产生广泛而有害的后果。\n\n> 热贴士\n> \n> 一款名为 Snapchat（www.snapchat.com）的照片消息应用程序允许人们发送几秒钟后消失的照片。但是，人们有可能截取这些图像的屏幕截图。\n\
    \n### 性侵犯者\n\n许多父母对孩子使用互联网最大的担忧或许是接触在线性侵犯者的威胁。媒体对此类威胁的报道可能让它看起来司空见惯；幸运的是，你的孩子成为性侵犯者受害者的威胁很小，但当然，这种事情是有可能发生的。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_125_0.png)\n\n### 陌生人危险\n\n在互联网出现之前，警告孩子不要与陌生人交谈是很容易的。然而，在互联网时代，随着社交媒体、聊天室、论坛和短信，陌生人很容易建立联系。此外，万维网的一个巨大优势是你的孩子可以遇到并与来自世界各地的孩子聊天，这可以是一种积极的体验，但也可能带来一些危险。\n\
    \n左侧：Snapchat 是孩子们交换 'temporary' 照片的一种更安全的方式，但虽然更安全，它仍然不是 100% 安全。\n\n### 诱骗\n\
    \n性侵犯者试图以多种方式与孩子交朋友并利用他们；这些技术被称为诱骗。\n\n- **冒充儿童**：他们可能冒充同一年龄段的人来接近孩子；他们常常假装成有兴趣建立关系的异性儿童。\n\
    - **个人信息**：性侵犯者有时试图从孩子那里提取个人信息，如地址、电子邮件或电话号码。\n- **贿赂**：为了让孩子见面，性侵犯者可能会提供流行音乐会、电影院或其他活动的门票。\n\
    - **敲诈勒索**：另一种已知的策略是威胁披露孩子在互联网上说过的话，迫使他们做自己不想做的事。\n- **亲密关系**：他们可能会提出亲密问题或发送不当图像。\n\
    \n### 儿童剥削和网络保护中心\n\n英国成立了一个特别的刑事任务小组，专门追踪在线性侵犯者。它被称为儿童剥削和网络保护中心（CEOP）。如果您怀疑您的孩子曾与性侵犯者接触过，您可以联系\
    \ CEOP，网址是 http://ceop.police.uk/\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_126_0.png)\n\
    \n上方：CEOP 警务部门保护儿童免受剥削和在线诱骗。\n\n## 保障儿童安全\n\n现在你了解了孩子在互联网上面临的风险，是时候来看看你可以采取哪些措施，以确保你的孩子在与万维网互动时的安全。\n\
    \n### 教育\n\n确保孩子在互联网上安全的第一步或许是检查他们是否了解风险。这并不意味着你应该吓唬他们，但解释一些你可以一起做的基本措施，以在冲浪时保护他们是值得的。\n\
    \n- **持久性：** 值得提醒你的孩子，上网的内容可能会永久留在网络上。\n- **隐私：** 向他们解释社交媒体上的隐私设置是如何工作的，这样只有他们的朋友和家人才能看到照片或帖子。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_127_0.png)\n\n- **个人信息：** 强调意识到他们透露了多少个人或敏感信息的重要性。\n\
    - **密码：** 确保他们理解不共享密码的重要性，除非可能是与父母分享。\n- **陌生人：** 确保你的孩子知道不要与在互联网上认识的人见面，因为他们可能不是他们自称的那个人。\n\
    \n上方：教育你的孩子了解与互联网相关的风险。\n\n### 监控网络使用\n\n父母觉得困难的一件事是知道侵犯孩子隐私和合理监控其互联网使用之间的界限在哪里。孩子们不会欣赏你在他们与社交媒体上的朋友交谈时站在他们身后，或者访问他们的账户以便阅读他们的帖子，但有其他方式可以监控他们的网络使用。\n\
    \n### 热贴士\n\n花太多时间在互联网上对任何人都不好，更不用说孩子了。一些父母设限，规定孩子每天可以在网上花费的时间。\n\n### 页面历史记录\n\
    \n你可能不愿意窥探孩子的 Facebook 或 Bebo 页面，但作为父母，明智的做法是确保孩子们没有访问不当材料，而做到这一点的最简单方法之一是检查他们的网络历史记录。\n\
    \n- 1. 在你的互联网浏览器上，选择选项（这可能由三条水平线或齿轮图标表示）。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_128_0.png)\n\
    \n上方：Chrome 中的网络历史记录。\n\n- 2. 选择历史记录。\n- 3. 你将被带到一个按时间顺序（最新的在前面）显示所有访问过的网站的页面。如果你不确定链接是什么并且想检查网站内容，请点击链接。\n\
    \n### 限制网络访问\n\n为了防止孩子们访问不当材料，你可能希望限制他们可以访问的网站类型。有几种方法可以做到这一点。然而，\n\n"
