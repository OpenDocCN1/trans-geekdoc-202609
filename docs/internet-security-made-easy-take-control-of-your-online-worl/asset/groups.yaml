  - '[PAGE 157]


    +   o Avira (http://www.avira.com/): Claims to detect 99.99% of malware. Avira
    also comes with a browser toolbar that has an anti-phishing tool and social media
    protection.


    +   o Panda Cloud (http://www.cloudantivirus.com/): A free version of a commercial
    product that contains basic protection in a lightweight package.


    # BUSINESS USERS


    Some antivirus software developers permit their free or home software to be used
    by small and medium-sized businesses. This may make financial sense as you will
    get basic level of protection that could be enough to meet your needs. However,
    larger organizations with hundreds of devices to protect, or those companies with
    a need for more enhanced security, should consider opting for a business package
    from one of the main antivirus developers.


    # Business Packages


    With a business package, you can deploy the antivirus software over your network,
    rather than having to install the software individually on each machine. A licence
    for business software is often over two years (as opposed to one for home use)
    and while it is limited to


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_157_0.png)


    - the more machines you need to protect the more licences you will need to buy
    – the cost per machine can often work out to be cheaper than using a home licence.


    Left: Most antivirus developers produce business versions of their software.'
