    \ these plug-ins. However, Adobe regularly releases updates to ensure its products\
    \ are secured against malware, so the best way to protect your machine from Flash\
    \ and Shockwave threats is to ensure you update regularly.\n\n**Hot Tip**\n\n\
    You can ensure you have the latest versions of Flash by downloading it directly\
    \ from https://www.adobe.com/support/flashplayer/downloads.html, and the latest\
    \ Shockwave at http://get.adobe.com/shockwave/\n\n### Disabling Java\n\nWhile\
    \ Java regularly releases updates to protect against threats, some users prefer\
    \ to disable it in their Internet browser unless they are on a website they trust.\n\
    \n### Disabling Java on a PC\n\n- 1. Click the Start menu and scroll through your\
    \ programs until you find Java.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_173_0.png)\n\
    \nAbove: Disabling Java in the Java control panel.\n\n- 2. Select Configure Java\
    \ to launch the Java Control Panel.\n\n- 3. Click the Security tab and uncheck\
    \ the Enable Java content in the Browser.\n\n- 4. Click Apply.\n\n### Disabling\
    \ Java on a Mac\n\n- 1. Click on the Apple icon on upper left of your screen and\
    \ go into System Preferences.\n\n- 2. Click on the Java icon to launch the Java\
    \ Control Panel.\n\n- 3. Click the Security tab and uncheck the Enable Java content\
    \ in the Browser.\n\n- 4. Click Apply.\n\n## OTHER MALWARE TOOLS\n\nWhen looking\
    \ for software online, it is important you do your homework. The Internet is full\
    \ of disreputable companies claiming they have legitimate products, but which\
    \ in fact are selling ineffectual software packed with spyware, adware and other\
    \ malicious programs. While you certainly have to be careful when downloading\
    \ anti-spyware and other software from the Internet, there are still some useful\
    \ tools available that can help keep you safe and clean your computer from malware\
    \ threats.\n\n> **Hot Tip**\n> \n> Beware of adware that warns you that spyware\
    \ has been detected on your machine, which can be remedied by buying a certain\
    \ spyware removal program. Normally, these anti-spyware tools install more malware\
    \ and force you to buy more anti-spyware products further down the line.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_174_0.png)\n\
    \n## MALWARE DETECTION TOOLS\n\nBecause no antivirus software system is perfect,\
    \ you may never know when a malware threat has managed to slip past your security\
    \ suite and infected your machine. Malware detection tools are not antivirus software\
    \ as such, but are designed as extra levels of security to help spot threats you\
    \ may not even be aware of. Often these are good for occasional scans and can\
    \ be used alongside your standard antivirus software.\n\n### Malwarebytes (http://www.malwarebytes.org/)\n\
    \nMalwarebytes is a simple-to-use malware scanner for Windows machines that can\
    \ spot and remove threats your standard software may have missed. It also includes\
    \ a tool called FileASSASSIN, which can help delete locked files, caused by either\
    \ malware or errors in Windows.\n\n### Super Antispyware (http://www.superantispyware.com/)\n\
    \nThis is another free Windows malware scanner and removal tool designed to spot\
    \ spyware threats. It is compatible with most major antivirus software suites,\
    \ so gives great additional security for ensuring your PC is spyware free.\n\n\
    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_175_0.png)\n\nAbove: Malwarebytes can\
    \ scan for malware threats that your antivirus may have missed.\n\n### Spybot\
    \ Search and Destroy (http://www.safer-networking.org/)\n\nOne of the most popular\
    \ free spyware removal tools that works on any Windows machine, including older\
    \ operating systems, such as XP, Windows 98 and even Windows 95.\n\n### Microsoft\
    \ Safety Scanner (http://www.microsoft.com/security/scanner/en-gb/default.aspx)\n\
    \nA free downloadable security tool for Windows machines that provides a one-time\
    \ scan and helps remove viruses, spyware and other malicious software. It works\
    \ with your existing antivirus software and erases itself off your machine after\
    \ 10 days.\n\n## BOTNET SCANNERS\n\nBotnets are among the toughest online threats\
    \ for antivirus software to detect. Creators of botnet malware are for ever finding\
    \ weaknesses in operating systems which they then use to infect machines and recruit\
    \ as botnets.\n\n### BotHunter (http://www.bothunter.net/)\n\nRather than relying\
    \ on a database to recognize bots or analysing a computer for suspicious activity,\
    \ BotHunter, which is a free program, listens to the Internet traffic through\
    \ your machine for telltale signs of a botnet. When it spots a threat, it removes\
    \ it and informs a database kept by its developers so that other machines can\
    \ be cleaned of the same threat.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_176_0.png)\n\
    \nRight: BotHunter is one of the best tools for detecting bots on your computer.\n\
    \n### RUBotted (http://free.antivirus.com/us/rubotted/)\n\nAnother free program\
    \ that works in a similar way to BotHunter, RUBotted monitors your computer for\
    \ potential infection and suspicious activities associated with bots. Upon discovering\
    \ a potential infection, RUBotted will identify and remove it with its HouseCall\
    \ cleaner.\n\n## REGISTRY CLEANERS\n\nYour system registry is what Windows computers\
    \ use to store the configuration of the operating system. The registry is often\
    \ targetted as it means the malware will be installed whenever the machine boots\
    \ up. While most antivirus software can remove registry threats, there are a couple\
    \ of tools you can use to remove registry entries yourself.\n\n> > **Hot Tip**\n\
    > > You should never make changes to your system registry without knowing what\
    \ you are doing and first backing up.\n> > Changes to your system registry can\
    \ result in system crashes, requiring the reinstallation of your operating system\
    \ and the loss of data.\n\n### HiJackThis (http://sourceforge.net/projects/hjt/)\n\
    \nThis free tool scans the registry reports and registry entries that could have\
    \ been altered or tampered with by spyware, malware or other malicious programs.\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_177_0.png)\n\nAbove: You should only\
    \ use registry cleaners such as HijackThis if you are confident that know what\
    \ you are doing.\n\n### CCleaner (https://www.piriform.com/CCLEANER)\n\nThis free\
    \ program removes entries for non-existent applications in your Windows registry,\
    \ fixes invalid or corrupted entries, cleans out temporary files, cookies and\
    \ cached items in your browser, as well as removing temporary and log files on\
    \ Windows. It even empties your recycling bin.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_178_0.png)\n\
    \n## PC SECURITY\n\nBecause many of us keep important documents on our computers,\
    \ not to mention all those passwords and usernames stored in cookies on our browsers,\
    \ having a system in place to secure all this data can give you peace of mind\
    \ in case your computer is lost or stolen.\n\n### Windows Bitlocker\n\nBitlocker\
    \ is installed On Windows 7 and Windows 8 operating systems. Bitlocker isn't enabled\
    \ by default, but you can activate it by checking the box in System and Security\
    \ in the Control Panel. Bitlocker automatically encrypts the hard drive and protects\
    \ everything from documents to saved passwords.\n\n### OTFE\n\n(http://www.portablefreeware.com/?id=698)\
    \ If your operating system does not have Bitlocker, you can download OTFE for\
    \ free, which encrypts files on Windows machines, including Windows Mobile, and\
    \ encrypts all files before they are stored on your hard drive.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_178_1.png)\n\
    \nAbove: Turning on Bitlocker in the Windows System and Security menu.\n"
  mdcn: "\n\n## 其他保护软件\n\n防病毒软件和防火墙并不是用来防范网络威胁的唯一软件。某些恶意软件可能难以检测，但有一系列额外的工具和技术可供使用，可以帮助你保持安全。\n\
    \n### Java 和 Flash 威胁\n\n计算机在面对网络威胁时的主要弱点之一是浏览器使用的插件，这些插件允许网站上的多媒体和交互功能。这些插件被称为\
    \ Flash 和 Java，恶意程序员经常利用这些插件固有的弱点来攻击计算机。\n\n### Java\n\nJava 是一种浏览器插件，由某些网站用于显示内容。然而，Java\
    \ 有点像在浏览器中运行虚拟计算机，Java 程序在这个虚拟环境中运行。这意味着可以编写恶意软件来感染 Java，并且它可以在任何计算机（PC 或 Mac）上运行，而你的防火墙和防病毒软件对此类威胁几乎无能为力。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_172_0.png)\n\n上方：许多网站使用 Java 来运行多媒体。\n\
    \n### Flash 和 Shockwave\n\nFlash 和 Shockwave 是 Adobe 创建的插件，用于运行视频和流媒体内容等多媒体。与\
    \ Java 一样，恶意程序可以攻击这些插件。然而，Adobe 会定期发布更新，以确保其产品防范恶意软件，因此保护你的计算机免受 Flash 和 Shockwave\
    \ 威胁的最佳方法是确保定期更新。\n\n**热门提示**\n\n你可以通过从 https://www.adobe.com/support/flashplayer/downloads.html\
    \ 直接下载来确保拥有最新版本的 Flash，最新版本的 Shockwave 可在 http://get.adobe.com/shockwave/ 获取。\n\
    \n### 禁用 Java\n\n虽然 Java 会定期发布更新以防范威胁，但某些用户倾向于在其 Internet 浏览器中禁用 Java，除非他们正在访问他们信任的网站。\n\
    \n### 在 PC 上禁用 Java\n\n- 1. 单击“开始”菜单，浏览你的程序，直到找到 Java。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_173_0.png)\n\
    \n上方：在 Java 控制面板中禁用 Java。\n\n- 2. 选择“配置 Java”以启动 Java 控制面板。\n\n- 3. 单击“安全”选项卡，并取消选中“在浏览器中启用\
    \ Java 内容”。\n\n- 4. 单击“应用”。\n\n### 在 Mac 上禁用 Java\n\n- 1. 单击屏幕左上角的 Apple 图标，进入“系统偏好设置”。\n\
    \n- 2. 单击 Java 图标以启动 Java 控制面板。\n\n- 3. 单击“安全”选项卡，并取消选中“在浏览器中启用 Java 内容”。\n\n\
    - 4. 单击“应用”。\n\n## 其他恶意软件工具\n\n在网上寻找软件时，做好功课非常重要。互联网上充斥着声称拥有合法产品但实际上出售包含间谍软件、广告软件和其他恶意程序的无效软件的不良公司。当然，你在从互联网下载反间谍软件和其他软件时必须小心，但仍然有一些有用的工具可供使用，可以帮助你保持安全并清除计算机上的恶意软件威胁。\n\
    \n> **热门提示**\n> \n> 警惕那些声称你的机器上检测到间谍软件，并可通过购买某个特定的间谍软件删除程序来解决的广告软件。通常，这些反间谍软件工具会安装更多恶意软件，并迫使你日后购买更多反间谍软件产品。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_174_0.png)\n\n## 恶意软件检测工具\n\n因为没有任何防病毒软件系统是完美的，你可能永远不知道什么时候恶意软件威胁已经绕过你的安全套件并感染了你的机器。恶意软件检测工具本身并不是防病毒软件，而是旨在作为额外的安全级别，帮助发现你可能甚至不知道的威胁。这些工具通常适用于偶尔扫描，并可以与你的标准防病毒软件一起使用。\n\
    \n### Malwarebytes (http://www.malwarebytes.org/)\n\nMalwarebytes 是一款适用于 Windows\
    \ 机器的简单易用的恶意软件扫描器，可以发现并移除你的标准软件可能遗漏的威胁。它还包含一个名为 FileASSASSIN 的工具，可以帮助删除由恶意软件或\
    \ Windows 错误导致的锁定文件。\n\n### Super Antispyware (http://www.superantispyware.com/)\n\
    \n这是另一款免费的 Windows 恶意软件扫描和移除工具，旨在发现间谍软件威胁。它与大多数主要防病毒软件套件兼容，因此为确保你的 PC 没有间谍软件提供了极佳的额外安全保障。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_175_0.png)\n\n上方：Malwarebytes 可以扫描你的防病毒软件可能遗漏的恶意软件威胁。\n\
    \n### Spybot Search and Destroy (http://www.safer-networking.org/)\n\n最流行的免费间谍软件移除工具之一，可在任何\
    \ Windows 机器上运行，包括 XP、Windows 98 甚至 Windows 95 等旧操作系统。\n\n### Microsoft Safety\
    \ Scanner (http://www.microsoft.com/security/scanner/en-gb/default.aspx)\n\n适用于\
    \ Windows 机器的免费可下载安全工具，提供一次性扫描，并帮助移除病毒、间谍软件和其他恶意软件。它与你现有的防病毒软件协同工作，并在 10 天后从你的机器上擦除自身。\n\
    \n## 僵尸网络扫描器\n\n僵尸网络是防病毒软件最难检测的网络威胁之一。僵尸网络恶意软件的创建者不断寻找操作系统中的弱点，然后利用这些弱点感染机器并将其招募为僵尸网络。\n\
    \n### BotHunter (http://www.bothunter.net/)\n\nBotHunter 是一款免费程序，它不依赖数据库来识别机器人，也不分析计算机的可疑活动，而是监听经过你机器的互联网流量，寻找僵尸网络的明显迹象。当它发现威胁时，会将其移除并通知其开发者维护的数据库，以便其他机器也能清除相同的威胁。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_176_0.png)\n\n右侧：BotHunter 是检测计算机上机器人的最佳工具之一。\n\
    \n### RUBotted (http://free.antivirus.com/us/rubotted/)\n\n另一款免费程序，其工作方式与 BotHunter\
    \ 类似，RUBotted 监控你的计算机以查找潜在感染和与机器人相关的可疑活动。一旦发现潜在感染，RUBotted 将使用其 HouseCall 清理器识别并移除它。\n\
    \n## 注册表清理工具\n\n你的系统注册表是 Windows 计算机用来存储操作系统配置的地方。注册表经常成为攻击目标，因为这意味着机器启动时恶意软件就会被安装。虽然大多数防病毒软件可以移除注册表威胁，但有一些工具你可以使用来自己移除注册表项。\n\
    \n> > **热门提示**\n> > 在不了解自己在做什么且未先备份的情况下，绝不应对系统注册表进行更改。\n> > 对系统注册表的更改可能导致系统崩溃，需要重新安装操作系统并导致数据丢失。\n\
    \n### HiJackThis (http://sourceforge.net/projects/hjt/)\n\n此免费工具扫描注册表报告和可能被间谍软件、恶意软件或其他恶意程序更改或篡改的注册表项。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_177_0.png)\n\n上方：只有在确信自己知道自己在做什么时，才应使用\
    \ HijackThis 等注册表清理工具。\n\n### CCleaner (https://www.piriform.com/CCLEANER)\n\n\
    此免费程序会移除 Windows 注册表中不存在的应用程序的条目，修复无效或损坏的条目，清理浏览器中的临时文件、Cookie 和缓存项目，以及移除 Windows\
    \ 上的临时文件和日志文件。它甚至会清空你的回收站。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_178_0.png)\n\
    \n## PC 安全\n\n因为我们中的许多人将重要文档存储在计算机上，更不用说浏览器 Cookie 中存储的所有密码和用户名，建立一套保护所有这些数据的系统，可以在计算机丢失或被盗时让你安心。\n\
    \n### Windows Bitlocker\n\nBitlocker 预装在 Windows 7 和 Windows 8 操作系统中。Bitlocker\
    \ 默认未启用，但你可以通过在控制面板的“系统和安全”中勾选框来激活它。Bitlocker 会自动加密硬盘，并保护从文档到保存的密码的所有内容。\n\n###\
    \ OTFE\n\n(http://www.portablefreeware.com/?id=698) 如果你的操作系统没有 Bitlocker，你可以免费下载\
    \ OTFE，它可加密 Windows 机器（包括 Windows Mobile）上的文件，并在文件存储到硬盘之前加密所有文件。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_178_1.png)\n\
    \n上方：在 Windows 系统和安全菜单中打开 Bitlocker。\n\n"
