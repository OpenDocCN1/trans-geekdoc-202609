    - PhoneSheriff (http://www.phonesheriff.com/): Compatible with both Android and
    iOS, PhoneSheriff lets you restrict access to certain types of Internet content,
    as well as set time restrictions, block phone numbers and track the phone''s location
    using GPS.

    - My Mobile Watchdog for Android (http://www.mymobilewatchdog.com/): You can monitor,
    block, filter and track your child''s Android or iOS device, but it does not offer
