    # Spyware


    Unlike a virus, spyware does not self-replicate. As its name suggests, the sole
    purpose of spyware is to spy on a person''s computer activity. Spyware can collect
    all sorts of data about your computer use, such as the websites you visit, while
    some spyware, known as ''keyloggers'', even records your keystrokes, which can
    be used to identify your passwords and usernames for online accounts.


    # Adware


    While different to spyware, adware is often installed with it. Companies pay a
    lot of money to malware developers to have adware installed on people''s machines.
    It works by sending specific advertisements to you depending on your web-browsing
    history. This may be in the form of pop-ups or it may replace your browser homepage
    and bookmarks. Other adware can even replace your search-engine results with websites
    from the people who have paid the adware developers.


    # Hot Tip


    If you notice your computer is running unusually slowly, you may have inadvertently
    installed spyware, as it often runs in the background using system resources and
    slowing things down.


    # Ransomware


    Ransomware is designed solely to make money. It works by holding your computer
    or files hostage until you pay a ransom. Some ransomware will flash up warning
    messages telling you to pay money to get rid of the messages, hoping that the
    annoyance will be enough for you to cough up, while other ransomware, such as
    CryptoLocker, encrypts all your files so you cannot access them until you have
    paid to have them decrypted.'
