    +   PIN: Personal Identification Numbers are often used in conjunction with passwords
    on secure sites.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_41_0.png)


    Above: Entering memorable information to log into a bank account.


    # Password Lock


    Many password systems, especially on secure servers, will lock you out if you
    enter the incorrect password several times (usually three times). This is to stop
    people attempting to guess a password or to prevent software bots from running
    through every possible password combination to hack into a system. If you are
    locked out of an account, you may have to contact the administrators before you
    can log back in.


    Hot Tip

    In the next section, we will explore how to create strong passwords as well as
    provide you with some tips for remembering them.


    # CAPTCHA Codes


    Another system designed to ensure a user is a human being and not a software bot
    is the use of CAPTCHA codes (Completely Automated Public Turing Test; a Turing
    test is something designed to tell the difference between people and machines).
    Usually, these are visuals of letters and numbers, which have to be read and correctly
    entered.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_41_1.png)


    Right: Entering a CAPTCHA code.'
