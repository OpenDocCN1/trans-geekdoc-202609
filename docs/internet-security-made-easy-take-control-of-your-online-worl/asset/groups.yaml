    (ensure that the format is Mac OS Extended, which is set by default).\n6. Select
    a security option. The securer the option, the more thorough it will be in erasing
    your data, but it will also be slower.\n7. Once formatting is complete, reinstall
    your OS X operating system.


    Above: Selecting erase.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_235_2.png)'
  - '[PAGE 236]


    # # REMOVING STUBBORN THREATS


    Some malware can be really stubborn when it comes to cleaning a computer. Either
    they act like normal programs so antivirus software does not spot them, or they
    infect areas that make them hard to remove. In these instances, you may have to
    take care of the threat manually.


    # ## IDENTIFYING THREATS


    If your antivirus scan comes up clean, you may still feel that your machine is
    infected with something because of the way it is acting: your PC may be running
    slowly, your Internet browser playing up, or some other symptom is indicating
    something is not quite right. If this is the case, you may have to do a bit of
    diagnosis to identify what the problem is.


    # ### BROWSER THREATS


    One of the most common threats missed by antivirus software is malware installed
    into browser extensions. Extensions, plug-ins, browser helper objects (BHOs) and
    add-ons are tools designed to expand the functionality of your web browser, but
    some malicious software developers use these to install adware and other malware.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_236_0.png)


    Above: Extensions can be really useful, but they can also harbour malware.'
  - '[PAGE 237]


    # # Browser Helper Objects


    Browser helper objects (BHOs) are plug-ins for Internet Explorer designed to allow
    the browser to display file formats it could not otherwise interpret. However,
    they can also harbour malware, so if your browser seems to have a mind of its
    own, you may want to disable your BHOs to see if they are the cause.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_237_0.png)


    Above: Disabling browser extensions.


    +   1. Close Internet Explorer, click Start, Settings and Control Panel.

    +   2. Select Internet Options and click the Advanced tab.

    +   3. Under Browsing, clear the Enable third-party browser extensions check box.

    +   4. Restart Internet Explorer.


    # ## Removing BHOs


    If Internet Explorer starts to function normally after disabling your browser
    extensions, you know a BHO is the cause of the problem. Therefore you may want
    to run a BHO removal tool to identify and remove the offending BHO. Many of these
    can be found on the Internet.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_237_1.png)


    # ## Extensions and Plug-ins


    Internet Explorer is not the only browser plagued by malware threats hidden in
    plug-ins.'
  - '[PAGE 238]


    Most browsers rely on extensions to improve your web experience, and they can
    all too easily be hijacked by malicious malware. However, disabling and removing
    extensions and plug-ins can be pretty simple.


    +   1. Go into your browser settings.


    +   2. In Firefox click the Add-ons button, in Chrome, click the Extensions link
    on the left, in Opera select Extensions from the tools menu.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_238_0.png)


    Above: Spy BHO Remover can remove malware posing as browser helper objects.


    +   3. In Firefox, select Extensions or Appearance in the Add-ons Manager tab,
    and click the Disable button next to the extension you want to disable.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_238_1.png)


    Above: You can enable and disable most extension quite easily.


    +   4. In Chrome, simply uncheck the Enable box to disable the extension.


    +   5. In Opera, disable extensions in the Manage Extensions menu.


    # Stubborn Extensions


    Some extensions, such as Enterprise Policy extensions, which were created by Google
    to help developers, differ from normal extensions in that they cannot be removed
    or disabled in the normal way on Windows machines (OS X users can still delete
    them). This has made them a popular tool for malware producers, who can use them
    to install adware.'
  - '[PAGE 239]


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_239_0.png)


    Above: Extensions with long random IDs that cannot be removed are usually malware.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_239_1.png)


    Above: Searching for an extensions registry entry.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_239_2.png)


    Above: Deleting an extension in registry.


    # # Removing Stubborn Browser Malware


    If you have an extension that you cannot remove in the Extensions page, it is
    possible to get rid of them, although it is a fairly complicated procedure.


    +   1. Go into the Control Panel and select the Install/Uninstall Programs.


    +   2. Select anything that you do not remember installing and uninstall it. In
    particular, look for any programs with the words ''ad'', ''blocker'' or ''coupon''
    in the title.


    +   3. Go into your extension manager in your browser, and make a note of the
    name of the extension that you want to remove.


    +   4. Do a search (Start, Search) and type or paste in the name of the extension.
    Delete any folders or files that come up in the search.


    +   5. Run the Registry Editor (regedit.exe), click Edit and select Find next.


    +   6. Type or paste in the ID of the extension and press the Find next button.'
