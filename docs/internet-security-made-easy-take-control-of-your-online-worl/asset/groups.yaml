    ## Remote Wipe on iOS Devices


    Organizing remote wipe on Apple devices is fairly simple, but you need to set
    up a few things first.


    - iCloud: You need to set up an iCloud account so you can access Apple''s online
    services.

    - iOS 4.2 and earlier: For older Apple devices, you need to enable Push and Find
    My iPhone in the Settings app under Mail, Contacts, Calendars.


    ## Wiping Your iOS Device


    1. Log into iCloud and click the Account button at the top of the screen.

    2. Select the Find My iPhone, iPad, iPod Touch or Mac option once the page loads.

    3. Select All Devices and choose the device you want to erase.

    4. In the device''s information window, select Erase.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_188_0.png)


    Above: You can remote wipe an iPhone using the iCloud service.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_188_1.png)


    Above: Finding your iPhone in iCloud.


    > **Did You Know?**

    >

    > If your phone or iPad is offline, it will erase as soon as it goes online again.
