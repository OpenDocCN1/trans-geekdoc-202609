    # HTTPS


    HyperText Transfer Protocol Secure is an encrypted and more secure form of HTTP.


    # Hyperlink (also just ''link'')


    An active element such as a word or phrase on a web page that takes you to another
    destination when you click on it.


    # Internet


    A network of computers and computer networks. Often used interchangeably, although
    incorrectly, with the World Wide Web, which are the websites that exist on the
    Internet.


    # IP address


    An Internet Protocol address is a unique numerical identifier for each computer,
    network or server.


    # Keylogger


    A type of malware or spyware that tracks your keystrokes on a keyboard and sends
