  mdcn: "\n\n## 黑客如何获取访问权限\n\n黑客可以利用关于你的各种信息来获取你的在线账户访问权限。以下是最常见的手段。\n\n- **密码**：容易被猜到的弱密码是黑客获取你在线账户访问权限的最简单方式之一。\n\
    \n- **个人信息**：黑客有时会使用在网上找到的关于你的个人信息，例如你的地址或电话号码，来说服一个在线账户认为他们是你并且丢失了密码。\n\n- **间谍软件**：键盘记录器和其他间谍软件可以让黑客访问你的用户名和密码。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_85_0.png)\n\n### 账户安全\n\n有些在线账户比其他账户安全得多。例如，银行有几层身份验证，包括密码、PIN码和安全问题。然而，社交媒体、电子邮件和在线零售网站的验证层较少，使其成为在线黑客更容易攻击的目标。\n\
    \n以上：银行通常有额外的安全层，例如在你登录前要求提供安全信息。\n\n## 电子邮件账户\n\n接管你的电子邮件账户不仅是对隐私的严重侵犯，还允许黑客向你通讯录中所有人发送垃圾邮件、恶意软件或网络钓鱼邮件，收件人可能认为消息是你发来的。此外，访问你的电子邮件账户可以让黑客重置你在在线账户上的密码，从而获得访问权限。\n\
    \n### 保护你的电子邮件账户\n\n保护你的电子邮件账户免受黑客攻击至关重要，因此请确保你的账户安全。\n\n- 安全措施：选择安全的电子邮件服务提供商，最好选择具有多层验证的提供商，例如短信或电话验证。如果这些是可选的，请充分利用它们。\n\
    \n- 密码：选择一个强密码并定期更改，永远不要告诉任何人你的电子邮件密码。\n\n- 安全措施：对关于可能试图黑入你电子邮件账户的消息做出快速反应。然而，要警惕声称来自你的电子邮件提供商的网络钓鱼消息。\n\
    \n- 多个账户：考虑使用不止一个电子邮件地址。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_86_0.png)\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_86_1.png)\n\n以上：充分利用你的电子邮件账户提供商提供的额外安全功能。\n\
    \n### 电子邮件被黑客攻击的症状\n\n判断你的电子邮件账户是否被黑客攻击并不容易；黑客通常希望不被发现，因此会不遗余力地隐藏自己的存在。然而，可能会有一些明显的迹象。\n\
    \n- * 已发送消息：黑客通常会删除他们发送的消息以避免被发现，因此如果你的已发送消息文件夹是空的，或者你发现你没有发送的消息，你可能已被黑客攻击。\n\n\
    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_87_0.png)\n\n- * 未送达报告：如果你的账户被用来发送随机电子邮件和垃圾邮件，你可能会收到发送给不再存在的账户的未送达报告。\n\
    \n- * 朋友/同事：你通讯录中的人可能会问你是否最近给他们发过消息，因为他们可能对内容感到可疑。\n\n以上：对于你不记得发送过的电子邮件的投递失败通知是你已被黑客攻击的迹象。\n\
    \n## 社交媒体\n\n社交媒体平台可能是最容易且最常被黑客攻击的账户。人们经常使用社交媒体账户发送垃圾邮件或将用户的朋友和关注者引导至某个网站，但被黑客攻击的社交媒体账户可能会带来其他问题，例如有人获得个人信息，这些信息可用于黑客攻击其他账户或作为身份欺诈的一部分。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_87_1.png)\n\n以上：充分利用你的社交媒体账户上的安全和隐私设置。\n\
    \n### 保护你的社交媒体账户\n\n与你的电子邮件账户一样，使用强密码来访问你的社交媒体平台（例如Twitter、Facebook或LinkedIn）非常重要，但你可以采取一些措施来保护你的账户。\n\
    \n- * 隐私和安全设置：充分利用平台的隐私和安全措施。（有关更多信息，请参见第108–112页。）\n\n- * 避免：在社交媒体上泄露个人信息。即使你以为你只和朋友交谈，你也永远不知道他们的账户是否已被泄露。\n\
    \n> **热门提示**\n> \n> 谨防Twitter上提醒你点击某个图片、视频或某人在互联网上关于你所写内容链接的消息。这是账户已被黑客攻击的常见迹象，该链接可能会将你引导至恶意网站。\n\
    \n### 你的社交媒体已被黑客攻击的症状\n\n你的社交媒体账户被黑客攻击的最常见迹象是，你的朋友和关注者开始收到你未发送的消息。你可能也开始关注或添加了很多新的人。请确保定期检查你的活动，以便尽快发现黑客攻击。\n\
    \n## 财务账户\n\n可以说，最具破坏性的在线账户被黑客攻击的类型是涉及金融交易的账户。不仅有人如果黑客攻击了你的网上银行或信用卡账户可以访问你的资金，而且一些零售账户还持有其他个人信息，例如你的信用卡详细信息、地址、电子邮件和电话号码，黑客可能会获取这些信息。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_88_0.png)\n\n以上：一些在线零售商，例如Amazon，会隐藏你的信用卡详细信息，以防你的账户被黑客攻击。\n\
    \n### 被黑客攻击的财务账户的明显迹象\n\n你最不希望黑客获得访问权限的是你的资金，无论是通过在线零售商、银行还是其他金融机构。幸运的是，大多数金融机构和电子商务网站都非常重视安全，但留意泄露的明显迹象很重要。\n\
    \n- **登录**：如果你无法登录，可能是因为账户已被黑客攻击。请立即联系在线账户提供商。\n\n- **警告**：大多数金融机构如果怀疑你的账户有异常行为，会向你发送警告。\n\
    \n- **对账单**：仔细检查你的银行和信用卡对账单。如果你发现一笔你不记得的交易，请进行调查。\n\n- **订单**：定期检查零售和电子商务网站上的订单历史记录，查看是否有任何新商品。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_89_0.png)\n\n- **电子邮件**：网站可能会向你发送一封电子邮件，提醒你某个产品已发货，或确认你已更改某些个人详细信息。\n\
    \n以上：订单确认可能是有人黑客攻击了你的某个账户的迹象。\n\n- **余额**：确保你知道你的账户余额。如果它不应该是这个数字，请进行调查。\n\n##\
    \ 帮助，我的账户已被黑客攻击！\n\n如果你的任何在线账户（无论是社交媒体、电子邮件、银行还是电子商务网站）已被黑客攻击，尽快采取行动以最大限度地减少损失至关重要。如果你认为你的账户已被黑客攻击，请采取以下步骤。\n\
    \n- 1. 立即通知网站或账户提供商。如果你无法登录，请致电寻求帮助，而不是发送电子邮件。\n\n- 2. 更改你的密码和其他登录信息，例如你的电子邮件地址。\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_90_0.png)\n\n- 3. 检查你的个人信息是否已被更改。\n\
    \n- 4. 在其他网站上更改你的密码，以防它们也已被泄露。检查这些网站是否有被黑客攻击的迹象。\n\n以上：如果你认为账户已被黑客攻击，请检查你的个人信息是否已被更改。\n\
    \n- 5. 如果你的在线账户包含信用卡或银行账号，请立即通知你的金融机构。\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_90_1.png)\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_90_2.png)\n\n以上：在其他账户上更改你的密码。\n\n"
