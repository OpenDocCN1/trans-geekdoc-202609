    ## 目录


    - 简介 .................... 8

    - 欢迎来到网络 ............. 14


    万维网自20世纪80年代起源以来已走过了漫长的道路。最初作为学术界和研究人员的工具，它已经演变成有史以来最具革命性的通信工具。在本章中，我们将探讨万维网的历史、互联网的运作方式以及安全威胁如何利用其中固有的弱点。我们还将为您提供一些在线保持安全的基本建议。


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_5_0.png)


    ## 危险 .... 46


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_6_0.png)


    既然您对万维网的运作方式有了一定了解，是时候探讨使用互联网的一些具体风险了。在本章中，我们将探讨不同类型的在线威胁，从各种恶意软件及其感染后果，到识别骗子和黑客。我们还将解释是什么让您处于脆弱状态，以及您如何确保自己不成为受害者。


    ## 在线安全与儿童安全 .... 90


    我们许多人现在生活的一部分是在线上。无论我们是在社交媒体上、与朋友聊天，还是登录网上银行，我们都需要确保个人信息安全可靠。在本章中，我们将探讨网站采用的各种隐私和安全设置。我们还将探讨年轻人使用互联网所面临的风险，以及您可以采取什么措施来保障他们的安全。


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_6_1.png)


    ## 防病毒软件、防火墙及其他防护 .... 134


    如果您还没有安装任何防病毒防护，现在是时候安装一些了。本章解释了防病毒软件的重要性、可用的不同解决方案、如何使用防病毒软件删除威胁并防止感染。我们还将解释什么是防火墙、它们如何用于提供安全保护，并介绍一些其他可用的软件防护。


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_7_0.png)


    ## 智能手机、平板电脑和笔记本电脑 .... 178


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_7_1.png)


    既然您已经保护好桌面电脑，是时候看看您用来上网的所有其他设备了。智能手机、平板电脑和笔记本电脑都伴随着特定的在线安全威胁，我们将向您展示如何保护您的数据、如何在公共区域上网时保持安全，以及探讨一些面向移动设备的防病毒和安全解决方案。


    ## 高级故障排除 .... 210


    无论您是受到无法清除的顽固计算机病毒感染，还是互联网浏览器不断显示不需要的广告，我们都将解释如何消除某些特定威胁、恢复丢失的数据，并在攻击后使您的计算机恢复正常工作状态。我们还将探讨不同类型的硬件解决方案，这些方案可以帮助保护您的网络、防止未经授权的访问，并增加额外的互联网安全级别。


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_8_0.png)


    - 行话解密 .................... 248

    - 延伸阅读 .................... 252

    - 有用网站 .................... 253

    - 索引 ............................ 254


    ## 简介


    互联网永远地改变了我们的生活，但这场通信革命并非没有问题。如同现实生活中一样，网络上也存在病毒、黑客和身份欺诈者。本书旨在帮助您安全地在在线世界中导航，并使您免受在线威胁的侵害。


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_9_0.png)


    上方：Facebook 等网站让我们能够社交，但它们也包含关于我们的各种个人信息。


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_9_1.png)


    上方：我们许多人现在都在网上银行。我们最不希望的就是有人能够访问我们的账户。


    ### 互联网安全


    在线保持安全很重要。除了好处之外，互联网还包含潜在的有害威胁，从可能感染我们计算机、删除我们的数据或监视我们在线活动的病毒和恶意软件，到想要为其自身目的获取我们数据访问权限的黑客和身份欺诈者。了解如何防御这些威胁对于保护您的网络、计算机、在线账户和家人的安全至关重要。


    ### 保护的重要性


    互联网已成为我们许多人不可或缺的工具，使我们能够在社交媒体上社交、通过电子邮件通信、在线购物和网上银行。正是由于这种对在线世界的依赖，保持安全对于防止未经授权访问我们的在线账户并确保我们的个人信息不落入错误之手至关重要。


