    # SAFE SEARCHING


    You can prevent search engines from bringing up inappropriate content by using
    the ''safe search'' mode.


    # Safe Search in Google


    To set up safe search in Google, follow these steps.


    +   1. On the Google homepage (www.google.com), click the settings link on the
    bottom right-hand corner.


    +   2 Select Search Settings.


    +   3. Check the Filter explicit results box.


    +   4. Click Save at the bottom of the page.


    +   5. You can lock safe search by setting up a Google account and clicking the
    Lock Safesearch link, which will require a password to unlock it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_129_1.png)


    Above: Filtering explicit content from results pages.'
  - '[PAGE 130]


    # Safe Search in Bing


    To turn on safe search in Bing, do the following:


    +   1. On the Bing homepage (www.bing.com) click More at the top of the page.


    +   2. Select Account under My Bing.


    +   3. Under Safesearch choose either Strict (no adult content), Moderate (allows
    some adult content but filters out hardcore pornography) or Off (no restrictions).


    # Safe Search UK


    For families with young children, you may wish to use Safe Search UK as your default
    search engine (http://www.uk.safesearchkids.com/), which is a search engine powered
    by Google, but with safe search permanently on.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_130_0.png)


    # PARENTAL CONTROLS


    As well as using safe search modes in search engines, you can use parental controls
    installed in your operating system or by a third-party service. Note that you
    have to set up these controls on every device your child has access to. (For details
    about setting up parental controls in mobiles and tablets, see page 207.)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_130_1.png)


    Right: Safe Search UK is a more child-friendly search engine as it automatically
    filters out adult content.'
  - '[PAGE 131]


    # WINDOWS FAMILY SAFETY


    Windows has a parental control feature called Family Safety. While it comes installed
    as standard on Windows 8 machines, for older operating systems (from XP onwards),
    you have to download and install the Windows Essential package (available free
    from http://windows.microsoft.com/en-gb/windows-live/essentials).


    # Using Family Safety


    Family Safety has several features you can use to protect your children when using
    the Internet.


    +   - Time restrictions: Lets you limit the amount of time your child can use
    the PC or Internet.

    +   - Website access: Limits the type of websites your child can visit.

    +   - Applications and games: Limits the programs and games your child can use.

    +   - Time of day: Lets you set times during which they can use the computer.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_131_0.png)


    Above: You sign into Family Safety at https://familysafety.live.com, using your
    Microsoft Live log-in details.


    # Setting Up Family Safety


    +   1. Once you have installed Family Safety, you have to create a Windows Live
    account (https://login.live.com) and then set up a user account for each child.

    +   2. Select Windows Live Family Safety from your list of programs in the Start
    menu.

    +   3. Set yourself as an ‘administrator’ and each child as a ‘user’ by selecting
