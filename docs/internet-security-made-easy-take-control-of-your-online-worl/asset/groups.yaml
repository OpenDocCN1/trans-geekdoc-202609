    # # BASIC FUNCTIONS


    While the vast majority of malware is spread via the Internet, this is not the
    only source. Email attachments, programs and files, USB memory sticks and even
    CDs and DVDs can harbour malware. For this reason, antivirus software has to be
    able to identify malware for a number of different locations, and it does this
