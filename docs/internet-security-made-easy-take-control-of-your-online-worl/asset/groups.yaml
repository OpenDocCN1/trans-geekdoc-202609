    ## MOBILE PHONE HACKING


    While strictly not an Internet threat, mobile phone hacking has made the headlines
    in recent years due to some of the dubious methods employed by certain British
    newspapers. Mobile phone hacking is not actually very sophisticated but is the
    result of people not adequately securing their mobile phones.


    Above: It takes just a few seconds to set up a voicemail PIN.


    ### Voicemail PIN


    The way people hack into voicemails is relatively simple. Most mobile phone companies
    provide a voicemail number that you can call from a landline phone to gain access
    to your messages. To prevent unauthorized access, a PIN is used, but most phones
    come with a factory default number, such as 1111, so unless you set a new PIN,
    a hacker can gain access to your messages.


    ### Setting Voicemail PIN


    The steps to set a new PIN will depend on your phone provider, but generally you
    need to do something approaching the following:


    1. Using your mobile handset, call your voicemail service and listen for the option
    to change your PIN.

    2. Press the appropriate button to change your PIN.

    3. Enter your new PIN.


    > **Hot Tip**

    > If your voicemail suggests you have no new message when you know somebody has
    left one, or a new message suddenly disappears, it could be a sign that your mobile
    phone has been hacked.


    ## SMARTPHONE AND TABLET SECURITY CHECKLIST


    To summarize the points discussed in this chapter and to help you keep your mobile
    devices secure, here is a checklist.


    - Connections: Disable Wi-Fi and Bluetooth when you are not using them.

    - Antivirus: Install antivirus software on your smartphone and tablet.

    - Remote wipe: Set up remote wipe in case your phone is lost or stolen.

    - PIN: Make sure you change your voicemail PIN from the factory default.

    - Update: Keep your operating system and apps updated.

    - Apps: Be careful when downloading and installing apps.

    - Hotspots: Be wary of using public access points.

    - HTTPS: Always use HTTPS for email and other secure online activities, or think
    about setting up a VPN (virtual private network).

    - Device: Keep tabs on your device. Never leave it unattended, even for a moment.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_210_0.png)


    ## ADVANCED TROUBLESHOOTING


    ### RECOVERING LOST DATA


    If you are unfortunate enough to have your computer infected by a virus or hacked,
    cleaning and protecting your system may be only part of the solution. Many people
    find that malware and hackers erase important data and files, and getting those
    back can be a struggle.


    ### DATA LOSS


    Following a malware or hacking attack, one of the worst outcomes can be the loss
    of data; photographs, documents or all those important emails could have vanished.
    However, all is not lost. Computer files are rarely completely erased, although
    it may seem that way, and it is sometimes possible to get your data back.


    **Hot Tip**


    Before you try to recover any lost data, it is essential that you are confident
    any malware has been removed from your system, otherwise a virus could end up
    deleting the data again, this time permanently.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_213_0.png)


    ### Cause of Wiped Data


    Before you can go about trying to recover files, it is important to understand
    how they came to be erased in the first place. Erased data can be caused by a
    number of events.


    Left: You may find all your documents have gone following a virus attack.


    - Antivirus: Your antivirus software may have deleted or quarantined a file to
    remove a malware infection.

    - Viruses: Some viruses delete files as part of their programming.

    - Deliberate erasing: A hacker with access to your machine could deliberately
    wipe your data for malicious reasons.


    > Hot Tip

    > Most antivirus software can clean files, such as documents and pictures, but
    they may leave them in quarantine where you can recover them. However, program
    files are often harder to clean so should not be recovered.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_214_0.png)


    Above: If you are missing files, check your virus vault or antivirus quarantine.


    ### Quarantined Items


    The first place to check if you have lost a file is your antivirus quarantine.
    Normally, antivirus software tries to clean an infected file, but if it cannot,
    it places it in quarantine where it cannot do any more harm. However, before you
    can retrieve your file, you need to ensure it does not pose a threat as you could
    just be unleashing the virus back onto your system.


    ### Recovering Quarantined Files


    Most antivirus software makes it simple to release files from quarantine. In most
    cases, you simply right click and select Restore and the file is returned to its
    original location on the drive. However, if the file is still infected, you will
    receive a warning message and the antivirus software may put it back in quarantine.
    Most antivirus software will let you exclude files from antivirus protection,
    but you should only do this if you think the antivirus is giving a false positive
    and the file is actually safe.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_215_0.png)


    Above: Cloud storage services such as Dropbox let you back up all your important
    files to the Internet.


    ### RECOVERING FROM A BACKUP


    By far the simplest ways to recover data following a virus or hacker attack is
    to retrieve the file from a backup, whether a removable media device, such as
    a flash drive, or from cloud storage, but first, you need to ensure the backup
    version is not also infected.


    ### Scanning Removable Media


    Most antivirus software will automatically scan a removable media device as soon
    as it is inserted into the computer or tablet. If yours is not set up to do this,
    follow these steps.


    1. To restore backups from a flash drive or other removable media, insert it into
    your computer.

    2. Once your operating system has recognized the device, on a Windows machine,
    go into the **My Computer** folder and right click and choose antivirus scan from
    the menu; on an Apple device, hold down the mouse button and select scan.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_216_0.png)


    Above: Scanning a removable hardware device with AVG.


    3. Your antivirus software will let you know if there is an infection and clean
    the files.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_216_1.png)


    ### RECOVERING CHANGED EXTENSION FILES


    Due to the way computers erase files (more on this in a bit), malware rarely deletes
    files completely, but in order to prevent you from using files, they sometimes
    change the file extensions (the application suffix, such as ''.doc'', ''.jpg'').
    Often this is done by changing the file into a shortcut, which will not open,
    making you think the file is lost forever. This is very common with infected files
    stored on removable media, but you can normally convert the file extension back.


    ### Recovering Changed Extension Files


    1. First, if the software is on removable media, scan it using your antivirus
    software to clean any viruses from it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_217_0.png)


    Above: Running the command prompt.


    2. Run the command prompt. In Windows 7/8, type cmd in the Start screen. In Windows
    XP, click Start, select Run and then type cmd.


    3. In the black console screen, type: ATTRIB -H -R -S /S /D [drive letter] \*.*
    replacing [drive letter:] with the letter of the drive where your infected file
    is, such as E:.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_217_1.png)


    Above: Restoring file extensions in drive E: using the command prompt.


    4. Press Enter. Now, when you open your file folder, your files should be present
    and correct.


    > Hot Tip

    > If you cannot clean an infected flash drive or change file extensions using
    the command prompt, check the file extensions are not Read Only (right click and
    Properties).

