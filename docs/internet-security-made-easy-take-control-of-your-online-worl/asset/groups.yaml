    models, this can take as long as two hours.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_189_0.png)


    Above: You need to sync a Gmail account to your phone to use remote wipe.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_189_1.png)


    Above: Android Device Manager.


    ## Remote Wipe on Android Devices


    Remote wipe on an Android device is called Lock & Erase but it is a lot more complicated
    to set up, and you need to have several things in place before you can utilize
    it.


    - Android 2.2: You can only set up remote wipe on devices running Android 2.2
    or later.

    - Google Account: Before you can set up remote wipe on an Android device, you
    need to have a Google account, which is synchronized with your device.

    - Remote access: The device needs to be set up for remote access.


    ## Setting Android Remote Access and Lock & Erase


    In order to set up remote wipe on an Android device, you first have to enable
    remote access.


    1. Set up your Google account on your device.

    2. On a separate computer, log into your Google account, and then go to www.google.com/android/devicemanager/

    3. Click on the Accept button.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_190_0.png)


    Above: Once you have allowed access on your phone, you will be able to lock or
    erase remotely.


    4. The page should display your device name. Click on Setup Lock & Erase and click
    on the Send button to send a message to your Android device, confirming remote
    lock and reset.

    5. On your Android device, confirm access. You will then be taken to the activation
    page, where you will be required to tap on the Activate button to set up Lock
    & Erase.

    6. Check the box for Remote locate this device and Allow remote lock and factory
    reset. Tap on the check box for both options to enable remote locking and wiping
    of your device.

    7. You will now be able to log into the Android Device Manager on any computer,
