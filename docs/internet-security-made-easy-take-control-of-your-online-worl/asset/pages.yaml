    # Phishing


    Email can be another resource used by identity fraudsters to extract information
    about you. As we have already seen, phishing techniques are designed to fool you
    into sending information. Phishing can be a simple message, suggesting a company
    is updating its records and needs your address and phone number, to sophisticated
    scams where spoof websites are set up and you are sent a link to log on. Often,
    these websites look indistinguishable from the real thing. Phishing is not just
    a problem on email either. Twitter, Facebook and SMS text messages can all be
    used for phishing.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_72_0.png)


    # Online Privacy


    Even if you have your social media settings on the strictest privacy levels possible,
    or are only sending emails or direct messages to people you know and trust, you
    can never be sure that'
