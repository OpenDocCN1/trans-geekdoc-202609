- pgno: 100
  md: '# Using a Proxy Server on OS X


    +   1. Choose System Preferences in the Apple menu.

    +   2. Select Network, Advanced, and then click Proxies.

    +   3. Choose the type of proxy, such as FTP (most common), and type its address
    and port number.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_100_0.png)


    Above: Proxies menu.


    # BROWSER SECURITY SETTINGS


    Web browsers include all sorts of other features that you can use to protect you
    from threats when you are surfing the Internet. However, adjusting these settings
    may reduce your user experience on certain websites.


    +   Cookies: You can clear cookies from your system or prevent certain websites
    from installing them.

    +   Tracking: You can prevent websites from tracking your activity.

    +   Private browsing: You can stop the browser from storing your search history,
    page history and passwords.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_100_1.png)


    Above: In Internet Explorer, you can assign security zones for trusted websites
    and those you would rather restrict.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   • **Location:** You can request that websites should not know your physical
    location, although some websites can ignore this request.


    +   • **Security zones:** Some browsers let you assign security zones to websites,
    where you can block certain content and restrict sites that are not trusted. ,


    +   • **Extensions and apps:** You can install and remove extensions and applications
    that extend the functionality of the web browser.


    +   • **Passwords and forms:** You can choose whether to allow the browser to
    remember passwords and information you use in online forms.


    # # PHISHING AND MALWARE PROTECTION


    Many Internet browsers now contain some form of malicious content protection.
    These normally warn you that a web page you are about to visit has been reported
    as containing malicious content, such as phishing or malware. This sort of protection
    is normally on when you install an Internet browser, and while you can usually
    turn it off in your browser settings, it is highly recommended that you leave
    it on.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_101_0.png)


    Above: If an Internet browser suspects a website may contain malicious software,
    it will flash up a warning message.


    # ## Antivirus Plug-ins


    Some antivirus software can install a small program in your Internet browser called
    a plug-in. These can help you identify malicious websites when you are surfing
    the Internet or using search engines so they can warn you if you are about to
    download a file that has been reported as containing malware. For more information
    on this, see page 161.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# WEBSITE SECURITY


    Your browser is not the only form of security you can use when surfing the World
    Wide Web. Many websites implement security measures to keep you safe when you
    are online.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_102_0.png)


    # Secure Sockets Layer (SSL)


    Websites that transmit sensitive information often employ a security mechanism
    called SSL (Secure Sockets Layer). This software secures an encrypted link between
    you and the web server, preventing anybody from intercepting any transmitted data.


    # SSL Certificates


    Electronic certificates are used to verify the authenticity of secure SSL websites.
    These certificates tell browsers that the website can be trusted and are verified
    by third-party organizations. If you try to access a website that has a certificate
    that cannot be


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_102_1.png)


    Above: SSL certificate warning.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'verified, you will receive a message warning you not to proceed. Sometimes
    the problem is just a website error, perhaps caused by a certificate that has
    expired, but it is advisable not to proceed unless you are sure the website can
    be trusted.


    # HTTPS


    You can tell if a website requires an SSL connection because it usually starts
    with HTTPS (HyperText Transfer Protocol Secure) rather than the standard HTTP.
    Some web browsers display a padlock icon in the address bar if a website is using
    HTTPS protocol.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_103_0.png)


    # SEARCH ENGINE SECURITY


    Some search engines, such as Google and Bing, also have several useful security
    functions that can help keep you safe when looking for websites on the Internet.


    +   - Safe searching: You can filter explicit content from all search results
    (to understand how to use this feature, see the section on parental controls on
    pages 129–33).

    +   - Signing in: Requires you to sign in before you can access the search engine.

    +   - Malicious content warnings: If a website is suspected of harbouring malicious
    content, there may be a warning next to it in the search engine results.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_103_1.png)


    Above: A warning on Google that a website may harm your computer.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# # EMAIL SECURITY


    Whether you use an online webmail service or download your emails to your computer
    using programs such as Outlook, you can use various security features to help
    keep you safe. You can often adjust these security features by logging on to your
    email provider and going into the settings menu.


    +   - **Security information:** Add additional security information to your account,
    such as an alternative email address, mobile phone number or security question.


    +   - **HTTPS:** Some webmail providers such as Gmail offer HTTPS for added security.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_104_0.png)


    Above: Google Mail uses HTTPS for added security


    +   - **Blocked content:** Email providers may block images, attachments or other
    elements of an email if they appear to pose a threat.


    +   - **Spam filters:** Most email providers have some form of spam filter that
    can recognize not only spam, but also phishing content.


    +   - **Antivirus scanning:** Some email services have their own antivirus scanners
    that can be used when downloading attachments.


    +   - **Reporting:** Most email providers let you report malicious content, phishing
    and spam emails; doing so helps improve their security for all their users.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# # SAFER SURFING TIPS


    Now you know how websites operate and understand some of the features available
    to help you safely surf the Internet, it is worth looking at how you interact
    with the World Wide Web and what you can do to limit Internet security threats.


    +   - **Personal information:** Never give out personal information unless you
    are sure you are on a verified, secure and safe website.


    +   - **Security and privacy settings:** Take advantage of the security and privacy
    settings provided to you by web browsers, websites and email providers.


    +   - **Password safety:** Never share passwords, ensure they are as strong as
    possible and change them regularly.


    +   - **Unsecured or unknown websites:** Be wary of using websites that are not
    HTTPS for any financial transactions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_105_0.png)


    Above: Make sure you have your updates turned on in your operating system.


    +   - **Links:** Avoid clicking links in emails, as they may not be genuine. Always
    type addresses in the URL bar or use search engines such as Google to find the
    websites you are looking for.


    +   - **Keep up to date:** Keep your browsers and security software up to date,
    as well as your operating system and any programs that access the Internet.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# SOCIAL MEDIA SECURITY


    The way we communicate has changed for ever. Social media has made keeping in
    touch and meeting new people so much easier, but it has also opened us up to a
    range of new threats to our privacy and security.


    # THE SOCIAL MEDIA REVOLUTION


    Facebook has over one billion users worldwide, Twitter over 250 million, and email
    is now far more popular than postal mail as a means of communication. This has
    meant a dramatic shift in the way we communicate. However, when it comes to what
    we say and to whom we speak, many of us are still stuck in the old ways, and forget
    that what we post on the Internet can often be seen by almost anybody.


    # Anybody and Everybody


    One of the most common mistakes people make when using social media is assuming
    that they are only speaking to their friends and followers. However, this is rarely
    the case. While you can implement all sorts of privacy settings on social media
    websites, you can never be certain your content will stay private.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_106_0.png)


    Right: There are countless social media platforms available.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# SOCIAL MEDIA PLATFORMS


    Social media has been around for some time, and while it is impossible to list
    all the available platforms, some social media sites are more popular than others.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_107_0.png)


    Above: Facebook now has over a billion users.


    +   - Facebook: The world''s most popular social networking site with over one
    billion members.

    +   - Twitter: The platform that allows you to send 140-character messages, known
    as Tweets (a form of ‘microblogging’).

    +   - LinkedIn: Used by professionals and those in the business world to network
    and connect with other professionals.

    +   - Pinterest: Lets users collect and share photos of their favourite events,
    interests and hobbies.

    +   - Google Plus+: Google''s own social networking platform that interacts with
    many of Google''s other services.

    +   - Tumblr: Another microblogging platform, which allows users to share videos
    and other multimedia.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_107_1.png)


    Above: You can send up to 140 characters in a Tweet, but you can also attach images.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# THE INFORMATION YOU PROVIDE


    When we sign up to a social media account, we often provide all sorts of information.
    Social media providers keep some of this private, such as our email address and
    password, but other information ends up as part of our profile and may be visible
    to anyone.


    # Access to Information


    Websites such as Twitter and Facebook now allow interaction from all sorts of
    apps and other websites. One of the consequences of this is that when are logged
    into a Twitter or Facebook account, all sorts of information about you can be
    accessed by third-party websites, such as your name, profile photo and even your
    interests.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_108_0.png)


    # Ownership


    Another aspect of social media that people often fail to understand is that we
    do not have ownership over the content we post. When we sign up to social media
    platforms, we often grant these websites the rights to do what they like with
    our content, which means we have no control over who has access to our images
    and videos.


    # SHARING INFORMATION


    Whether you are sending Tweets, updating your Facebook wall or just creating a
    social media profile, it is important to understand what information should be
    shared and what could put you at risk from identify fraud or other security threats.


    # Sensitive Information


    Sensitive information is anything that could be used by scammers, fraudsters and
    other types of people with dubious motives. Even information that may seem mundane
    can be used against us. Sensitive information falls into several categories.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   • Identification: Anything that can be used to identify who you are, such
    as your full name, names of children, spouses or other family members, and your
    date of birth.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_109_0.png)


    Above: For security reasons passwords are normally obscured by asterisks when
    you log into social media.


    +   • Location: Anything that helps identify your address, such as the street
    in which you live or postcode.


    +   • Security: Passwords, account numbers and personal email addresses should
    never be divulged on social media.


    +   • Schedules: Details of when we are at home or at work, planned holidays and
    trips can all put us at risk.


    # PRIVACY SETTINGS


    In order to control who sees what information, most social media websites have
    privacy settings, which you can adjust to allow certain information to be visible
    only to your friends and followers. While we cannot explain the settings of every
    social media platform in this book, we will look at how to increase security on
    the largest platforms – Facebook and Twitter.


    # FACEBOOK SECURITY AND PRIVACY


    Facebook is the world’s most popular social media platform, allowing over a billion
    people to share information with friends and family. However, you may not want
    everything about you to be known to just anybody, so it is important to try to
    control what you give out and who gets to see it.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# # Facebook Settings


    In order to protect your personal information, Facebook provides all sorts of
    settings.


    +   1. To access your security and privacy settings, click on the downward-pointing
    arrow in the top-right corner.


    +   2. Click Settings.


    +   3. Select Security in the menu on the left to adjust your security settings,
    and Privacy to adjust your privacy settings.


    > **Hot Tip**

    > When you sign up to Facebook, you are asked for a lot of information, but much
    of this is optional. Beyond your name, email address, birthday and gender you
    do not need to divulge anything else.


    # ## Facebook Security


    In the security menu, you can adjust aspects of your account to make it more secure.
    Simply click edit next to each setting.


    +   * **Login notifications:** Receive email or text notifications if somebody
    tries to log into your account.


    +   * **Login approval:** Set a security code for logging in from a computer other
    than your own.


    +   * **Code generator:** Generate codes in your Facebook mobile app for logging
    in and resetting your password.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_110_0.png)


    Right: Selecting Facebook settings.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   App passwords: Create passwords for apps that cannot use security codes.


    +   Trusted contacts: Allows you to choose trusted friends to help you get into
    a locked account.


    +   Trusted browser: Select what browsers you can use to access your account.


    +   Where you''re logged in: Limit the locations where you can log in.


    # Facebook Privacy


    In the privacy, timeline and blocking menus, you can control who sees what in
    your timeline, prevent people from tagging images of you, as well as block people
    with whom you would rather not engage.


    +   Who can see my stuff: You can choose whether your posts are public or for
    friends only, and even restrict things you have already posted.


    +   Who can contact me: Filter messages sent to you and who can send you a friend
    request.


    +   Who can look me up: Edit who can search for your profile on both Facebook
    and in search engines.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_111_0.png)


    +   Timeline and tagging: You can adjust who can post to your timeline, who can
    see things on it, as well as control who tags you in their posts and photos.


    +   Blocking: Lets you block or restrict friends, apps and invitations.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# TWITTER SECURITY AND PRIVACY


    While not as popular as Facebook, Twitter is still used by millions of people
    and has the potential to compromise your online security if you do not control
    the information you give out.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_112_0.png)


    # Twitter Profile


    Twitter does not ask for as much personal information as Facebook, and it is entirely
    up to you how much information you want to make public on your Twitter profile.
    For most people, their profile contains their name and a short biography. However,
    some people have their location visible on their profile, as well as other sensitive
    information. Be careful when you compose your profile that you are not giving
    away too much personal detail.


    # Tweeting


    The biggest threat to privacy and security on Twitter comes in what you talk about.
    Divulging too much information in a Tweet may mean the information gets into the
    wrong hands, and while Tweets drop down your timeline very quickly, they can remain
    accessible for months, even years.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_112_1.png)


    Above: Do not give out personal information in a Tweet, even if it appears to
    be a reputable company asking for it.


    # Twitter Settings


    +   1. To access Twitter''s security and privacy settings, click the gear icon
    in the top right-hand corner.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_113_0.png)


    Above: Selecting settings in Twitter.


    +   2. Click Settings in the drop-down menu.


    +   3. Select Security and Privacy in the left-hand menu.


    # # Twitter Security and Privacy


    You can adjust several aspects of your account to protect your personal information.


    +   - Login verification: Have Twitter send you an email or text whenever somebody
    attempts to log into your account.


    +   - Password reset: Allows you to set Twitter to request additional information
    for resetting passwords.


    +   - Photo tagging: As with Facebook, you can prevent people tagging you in photos.


    +   - Tweet privacy: Choose to make your Tweets public, so anyone can see them,
    or private and visible only to your followers.


    +   - Tweet location: Choose whether your location is included in your Tweets.


    +   - Discoverability: Choose whether people can search for you on Twitter using
    your email address.


    +   - Promoted content: Prevent Twitter from tailoring adverts specifically to
    you based on your Tweets and the people you follow.


    > > Hot Tip

    > >

    > > Avoid clicking on links from people you do not know on social media, as spammers
    often use these platforms to try to get you to visit websites with malicious content.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# ONLINE HARASSMENT


    As useful as social media is for helping us to socialize and connect with new
    people, it has given rise to a darker phenomenon – online harassment. Online bullying
    is not just something that children suffer from, as some people take great pleasure
    in abusing and making other people''s lives a misery, no matter how old they are,
    and with social media, these people have an almost unlimited supply of victims.


    # Trolls


    People who harass others online are known as trolls.

    Trolling can come in various forms.


    +   - Abuse: Trolls often send people abusive messages.

    +   - Threats: Some trolls threaten people with violence.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_114_0.png)


    Above: Anyone can be subject to nasty comments or harassment online.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '+   - Cyberstalking: Some trolls follow people around the Internet and harass
    them on different platforms.


    +   - Privacy: People posting private information about you on social media is
    also a form of trolling.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_115_0.png)


    # ## Dealing with Trolls


    The best way to deal with trolls is to block interactions with them and report
    their behaviour to the social media administrators. If trolls are making serious
    threats of violence towards you, you should consider contacting the police.


    Above: You can report somebody for abuse on Twitter using the settings menu in
    their profile.


    # ## Reporting Abusive Behaviour


    Most social media platforms have some facility for reporting abusive behaviour.


    +   - Facebook: The best way to report abusive content or spam on Facebook is
    by using the Report link that appears near the content itself.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_115_1.png)


    Above: You can report somebody for abuse on Facebook via the "..." menu in their
    timeline.


    +   - Twitter: You can report abusive behaviour at the following address – https://support.twitter.com/forms/abusiveuser


    +   - LinkedIn: Has a contact form for reporting abusive behaviour – https://help.linkedin.com/app/ask/path/rhsc'
  merge: -1
  img_proc: true
- pgno: 116
  md: '+   - Pinterest: You can report abuse and harassment using the contact form
    at http://help.pinterest.com/en/contact

    +   - Google Plus+: Click on the arrow to the top and right of the post and select
    Report abuse.

    +   - Tumblr: The only way to report abuse on Tumblr is to email the support desk
    – support@tumblr.com


    > > Hot Tip

    > > Never assume that private information and messages sent to friends and followers
    will remain private. You never know what other people will do with your information
    or how secure their web habits are.


    # # SENSIBLE SOCIAL MEDIA USE


    When using any social media website or app, it is a good idea to bear in mind
    some basic principles.


    +   - Sensitive information: Avoid giving out any information that could be used
    by identity fraudsters, spammers or hackers.

    +   - Privacy: No matter what security and privacy settings you have set, never
    say anything you would not want the whole world to hear.

    +   - Remember: Something you say on social media could be accessible for weeks,
    months and even years into the future.

    +   - Passwords: Guard your passwords, ensure they are strong and remember to
    change them regularly.

    +   - Connect: Be careful whom you befriend or follow on social media. Not everyone
    will be who they say they are.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_117_0.png)


    Above: Be careful about what pictures you post online.


    +   - Pictures: Photos can be copied and forwarded easily, so never post any pictures
    that you would not feel comfortable letting the whole world see.


    +   - Links: Do not click on links from people you do not know, as they may lead
    you to a malicious website.


    +   - Social media mobile apps: See pages 203–05 about using apps and the risks
    they pose.'
