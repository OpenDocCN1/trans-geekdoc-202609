- pgno: 73
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_73_0.png)


    Above: Be wary of emails apparently from well-known companies asking you to verify
    your account: they are often phishing.


    other people will not see what you have written. These days, people check their
    email and social media in all sorts of places, so you never know who could be
    looking over the shoulder of the person you are chatting to.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_73_1.png)


    # Hacking


    Another method employed by fraudsters to gather information about you is to hack
    into your online accounts. We will discuss hacking in more detail and what you
    can do about it a little later.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_73_2.png)


    Above: When you hover over a link, you can see its actual address on the bottom
    left of your browser.


    # Malware


    Malware is another method employed by people to gather information about you in
    order to assume your identity. Keyloggers, spyware and viruses can be used to
    monitor what you are doing on the Internet or to steal files containing personal
    information from your computer.


    # IDENTIFYING IDENTITY FRAUD


    The problem with identity fraud is the longer somebody gets away with it, the
    worse the consequences can be. For this reason, it is important to spot the signs
    early, so if there are any financial ramifications, they are kept to a minimum.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# # Monitoring Your Finances


    Because of the prevalence and growing threat of identity fraud, it is important
    to check your personal finances regularly and be on the alert for unusual activity.


    +   - **Not receiving bills:** If your usual bills or statements stop arriving,
    it could be a sign that someone has changed the account address.

    +   - **Credit cards:** If you are sent credit cards that you did not apply for,
    somebody else may have ordered them in your name.

    +   - **Statements:** Receiving financial statements from organizations you do
    not remember signing up to is a common sign of identity fraud.

    +   - **Refusal of credit:** If you have been denied credit, it may be because
    somebody else has obtained credit in your name and damaged your credit history.

    +   - **Statement items:** Anything on your bank or credit card statement that
    you do not remember purchasing needs investigating.

    +   - **Phone calls:** Unexpected calls from debt collectors, financial organizations
    and banks can often be a sign that your identity has been stolen.


    **Hot Tip**

    Companies such as www.equifax.co.uk, www.experian.co.uk and www.checkmyfile.com
    can provide you with access to your credit history, which can help you spot if
    anybody is attempting to get credit in your name.


