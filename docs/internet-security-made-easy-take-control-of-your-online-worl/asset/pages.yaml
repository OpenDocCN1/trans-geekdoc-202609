- pgno: 126
  md: '# Grooming


    Sexual predators try to befriend and exploit children in a number of ways; these
    techniques are known as grooming.


    +   - **Posing as a child**: They may pose as someone of the same age group to
    get close to children; often they pretend to be a child of the opposite sex interested
    in a relationship.

    +   - **Personal information**: Sexual predators sometimes try to extract personal
    information from children, such as addresses, emails or phone numbers.

    +   - **Bribery**: As a means of getting a child to meet up, a sexual predator
    may offer tickets to a pop concert, cinema or other event.

    +   - **Blackmail**: Another known tactic is to threaten to disclose something
    a child has said on the Internet to make them to do something they do not want
    to do.

    +   - **Intimacy**: They may ask intimate questions or send inappropriate images.


    # Child Exploitation and Online Protection Centre


    A special criminal taskforce has been set up in the UK solely to track online
    sexual predators. It is called the Child Exploitation and Online Protection Centre
    (CEOP). If you suspect your child has been in contact with a sexual predator,
    you can contact CEOP at http://ceop.police.uk/


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_126_0.png)


    Above: CEOP police the Internet to protect children from exploitation and online
    grooming.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# KEEPING CHILDREN SAFE


    Now you know the risks faced by children on the Internet, it is time to look at
    the measures you can take to ensure your children are safe when they interact
    with the World Wide Web.


    # EDUCATION


    Perhaps the first step in ensuring your children are safe on the Internet is to
    check that they know the risks. This does not mean you should frighten them, but
    it is worth explaining some of the basic measures you can do together to keep
    them safe while surfing.


    +   **Permanence:** It is worth reminding your children what goes online can stay
    online for ever.


    +   **Privacy:** Explain to them how privacy settings work on social media so
    only their friends and family can see photographs or posts.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_127_0.png)


    +   **Personal information:** Reiterate the importance of being aware of how much
    personal or sensitive information they divulge.


    +   **Passwords:** Make sure they understand the importance of not sharing their
    passwords, except perhaps with parents.


    +   **Strangers:** Ensure your children know not to meet up with anybody they
    meet on the Internet, as they may not be who they said they were.


    Above: Educate your child about the risks associated with the Internet.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# MONITORING WEB USE


    One of the things parents find difficult is knowing where the line is between
    invading your child''s privacy and sensible monitoring of their Internet use.
    Children will not appreciate you standing over their shoulder while they speak
    to their friends on social media, or accessing their accounts so you can read
    their posts, but there are other ways in which you can monitor their web use.


    # Hot Tip


    Spending too much time on the Internet is not good for anybody, let alone children.
    Some parents set limits as to how long their children can spend online each day.


    # Page History


    You may not feel comfortable snooping on your child''s Facebook or Bebo page,
    but as a parent, it is sensible to ensure your children are not accessing inappropriate
    material, and one of the easiest ways to do this is to check their web history.


    +   1. On your Internet browser, select options (this may be represented by three
    horizontal lines or a gear icon).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_128_0.png)


    Above: Web history in Chrome.


    +   2. Select History.


    +   3. You will be taken to a page of all the websites visited in chronological
    order (newest first). Click on the links if you are unsure what they are and want
    to check the content of the website.


    # RESTRICTING WEB ACCESS


    In order to prevent your children from accessing inappropriate material, you may
    wish to restrict the type of websites they can visit. There are several ways of
    doing this. However,'
  merge: -1
  img_proc: true
