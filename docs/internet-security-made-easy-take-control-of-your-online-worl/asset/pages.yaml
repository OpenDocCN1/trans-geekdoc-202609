- pgno: 213
  md: '# # RECOVERING LOST DATA


    If you are unfortunate enough to have your computer infected by a virus or hacked,
    cleaning and protecting your system may be only part of the solution. Many people
    find that malware and hackers erase important data and files, and getting those
    back can be a struggle.


    # ## DATA LOSS


    Following a malware or hacking attack, one of the worst outcomes can be the loss
    of data; photographs, documents or all those important emails could have vanished.
    However, all is not lost. Computer files are rarely completely erased, although
    it may seem that way, and it is sometimes possible to get your data back.


    **Hot Tip**


    Before you try to recover any lost data, it is essential that you are confident
    any malware has been removed from your system, otherwise a virus could end up
    deleting the data again, this time permanently.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_213_0.png)


    # ### Cause of Wiped Data


    Before you can go about trying to recover files, it is important to understand
    how they came to be erased in the first place. Erased data can be caused by a
    number of events.


    Left: You may find all your documents have gone following a virus attack.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "+   - Antivirus: Your antivirus software may have deleted or quarantined a\
    \ file to remove a malware infection.\n\n+   - Viruses: Some viruses delete files\
    \ as part of their programming.\n\n+   - Deliberate erasing: A hacker with access\
    \ to your machine could deliberately wipe your data for malicious reasons.\n\n\
    > Hot Tip\n> \n> Most antivirus software can clean files, such as documents and\
    \ pictures, but they may leave them in quarantine where you can recover them.\
    \ However, program files are often harder to clean so should not be recovered.\n\
    \n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_214_0.png)\n\nAbove: If you are missing\
    \ files, check your virus vault or antivirus quarantine.\n\n# # Quarantined Items\n\
    \nThe first place to check if you have lost a file is your antivirus quarantine.\
    \ Normally, antivirus software tries to clean an infected file, but if it cannot,\
    \ it places it in quarantine where it cannot do any more harm. However, before\
    \ you can retrieve your file, you need to ensure it does not pose a threat as\
    \ you could just be unleashing the virus back onto your system."
  merge: -1
  img_proc: true
- pgno: 215
  md: '# # Recovering Quarantined Files


    Most antivirus software makes it simple to release files from quarantine. In most
    cases, you simply right click and select Restore and the file is returned to its
    original location on the drive. However, if the file is still infected, you will
    receive a warning message and the antivirus software may put it back in quarantine.
    Most antivirus software will let you exclude files from antivirus protection,
    but you should only do this if you think the antivirus is giving a false positive
    and the file is actually safe.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_215_0.png)


    Above: Cloud storage services such as Dropbox let you back up all your important
    files to the Internet.


    # # RECOVERING FROM A BACKUP


    By far the simplest ways to recover data following a virus or hacker attack is
    to retrieve the file from a backup, whether a removable media device, such as
    a flash drive, or from cloud storage, but first, you need to ensure the backup
    version is not also infected.


    # # Scanning Removable Media


    Most antivirus software will automatically scan a removable media device as soon
    as it is inserted into the computer or tablet. If yours is not set up to do this,
    follow these steps.


    +   1. To restore backups from a flash drive or other removable media, insert
    in into your computer.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   2. Once your operating system has recognized the device, on a Windows machine,
    go into the **My Computer** folder and right click and choose antivirus scan from
    the menu; on an Apple device, hold down the mouse button and select scan.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_216_0.png)


    Above: Scanning a movable hardware device with AVG.


    +   3. Your antivirus software will let you know if there is an infection and
    clean the files.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_216_1.png)


    # # RECOVERING CHANGED EXTENSION FILES


    Due to the way computers erase files (more on this in a bit), malware rarely deletes
    files completely, but in order to prevent you from using files, they sometimes
    change the file extensions (the application suffix, such as ''.doc'', ''.jpg'').
    Often this is done by changing the file into a shortcut, which will not open,
    making you think the file is lost for ever. This is very common with infected
    files stored on removable media, but you can normally convert the file extension
    back.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Recovering Changed Extension Files


    +   1. First, if the software is on removable media, scan it using your antivirus
    software to clean any viruses from it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_217_0.png)


    Above: Running the command prompt.


    +   2. Run the command prompt. In Windows 7/8, type cmd in the Start screen. In
    Windows XP, click Start, select Run and then type cmd.


    +   3. In the black console screen, type: ATTRIB -H -R -S /S /D [drive letter]
    \*.* replacing [drive letter:] with the letter of the drive where your infected
    file is, such as E:.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_217_1.png)


    Above: Restoring file extensions in drive E: using the command prompt.


    +   4. Press Enter. Now, when you open your file folder, your files should be
    present and correct.


    > Hot Tip

    > If you cannot clean an infected flash drive or change file extensions using
    the command prompt, check the file extensions are not Read Only (right click and
    Properties).'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# TEMPORARY FILES


    Not everybody backs up their computer regularly, which means if data is lost due
    to a virus or hacking attack, getting it back can be problematic. However, it
    is not impossible and the first thing to do is check for any temporary files.


    # Autosave and Temporary Files


    Some programs, such as Microsoft Office, have an autosave and recovery system
    that automatically saves versions of your documents. Even if you do not have the
    autosave function on, programs such as Microsoft Office create temporary files
    while you are working, and these can be used to recover lost documents.


    # Finding Temporary Files


    Temporary and autosave files can be recognized by a tilde (~) followed by a few
    letters, such as ~wrdxxxx.tmp. You can usually alter the settings in your programs
    to save temporary files to any location you like, but most people never change
    these settings. These locations vary depending on the program, but in Microsoft
    Word, for instance, temporary and autosave files can be found.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_218_0.png)


    Above: A temporary document file for Microsoft Word.


    +   - Windows 7 and 8: You can find temporary Word files in either C:\Users\<username>\AppData\Local\Microsoft\Word
    or C:\Users\<username>\AppData\Local\Temp


    +   - Windows XP/98/95: In older versions of Windows look in either C:\Documents
    and Settings\<username>\Application Data\ and the program folder applicable to
    the file or C:\Documents and Settings\<username>\Local Settings\Temp'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_219_0.png)


    Above: Showing hidden files and folders.


    # Hidden Files


    Temporary files are stored as hidden files, so in order to see them you need to
    have the temporary folders set for viewing hidden files.


    +   1. Open Windows Explorer (Start, Programs, Accessories, Windows Explorer)
    and browse for the folder where you think your temporary files may be stored.


    +   2. Select Tools from the folder menu bar and scroll down to Folder Options.


    +   3. Select the View tab. Scroll down to the Hidden files and folders option,
    and check the button next to Show hidden files or folders. Click Apply.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_219_1.png)


    # Opening Temporary and Autosave Files


    When you have found a temporary or autosave file, you need to open it to see if
    there is any data on it. However, you cannot simply double click it as you would
    to open a normal file; you have to tell Windows what program you want to use to
    open the file.


    Left: Choosing a program to open a temporary file.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "+   1. Right click the file and choose Open With.\n+   2. Select the program\
    \ you want to use from the list, or select Choose Program if it is not listed.\n\
    +   3. Alternatively, you can drag and drop the folder into an open program window.\n\
    \n> **Hot Tip**\n> \n> The contents of a temporary file may not always look like\
