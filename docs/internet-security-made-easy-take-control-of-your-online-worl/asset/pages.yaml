- pgno: 233
  md: '# # THE LAST RESORT


    If all the repair and reinstallation options have failed, you may be able to reformat
    your hard drive and reinstall your OS from scratch. Reformatting will erase everything
    on your hard drive, which will mean you will have to reinstall not just the operating
    system, but also all your files, folders, programs and system drivers.


    # ## Backing Up


    Before you consider reformatting, you need to back up all your files. This means
    not just your documents, pictures and multimedia, but you also need to ensure
    you have copies of your system drivers (software that enables your hardware to
    run), programs and anything else you may lose when your hard drive is wiped.


    # ## Windows Reformatting


    On Windows machines, there are two choices when it comes to reformatting.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_233_0.png)


    +   Quick format: Does not check the drive for its condition. In addition, the
    data is not erased, but simply marked as being writable (new data can take its
    place).


    +   Full format: Will check the hard drive for any bad sectors; it then erases
    all data on the drive.


    # ## Partitions


    When a hard disk is formatted, it has to be assigned a drive letter, such as C:.
    This is done by means of a partition. Most computers have single partitions, so
    the letter C represents the entire hard disk, but you can have multiple partitions.


    Above: You can run a format on a second hard drive in Windows by right clicking
    and selecting format.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# # Reformatting a Windows PC


    Once you have backed up your computer, you can reformat and reinstall your Windows
    operating system. To reformat a Windows hard drive, insert your Windows installation
    disk into the drive and reboot your computer.


    +   1. At the **Welcome to Setup** page, press **Enter**, and then **F8** to accept
    the licensing agreement and press **Esc** to bypass Windows repair.


    +   2. Use the arrow keys either to create a new partition or to use your current
    one. For a full format, it is best to create a new partition.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_234_0.png)


    Above: Creating a partition before formatting.


    +   3. Select the partition where you want to install Windows, then press **Enter**.


    +   4. Select the format options (quick or full), then the files system option;
    for most recent versions of Windows, it is recommended to use a NTFS file system.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_234_1.png)


    Above: Choosing partition options.


    +   5. Press **Enter** to reformat the drive. Once complete, you will have to
    reinstall your operating system by rebooting and following the instruction on
    the installation disk.'
  merge: -1
  img_proc: true
- pgno: 235
