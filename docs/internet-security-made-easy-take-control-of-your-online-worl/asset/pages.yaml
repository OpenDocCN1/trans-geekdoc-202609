- pgno: 6
  md: '# THE DANGERS . . . . . . . . . . . . . 46


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_6_0.png)


    Now that you know a little about how the World Wide Web works, it is time to explore
    some of the specific risks of using the Internet. In this chapter, we explore
    the different types of online threat, from the various kinds of malware and the
    consequences of infection, to identifying fraudsters and hackers. We also explain
    what makes you vulnerable and how you can go about ensuring that you do not fall
    victim.


    # ONLINE SECURITY AND CHILD SAFETY . . . . 90


    Many of us now live some of our lives online. Whether we are on social media,
    chatting to friends, or logging into our online bank, we need to ensure that we
    are keeping our personal information safe and secure. In this chapter, we explore
    the various privacy and security settings employed by websites. We also explore
    the risks faced by young people using the Internet and what you can do to keep
    them safe.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_6_1.png)'
