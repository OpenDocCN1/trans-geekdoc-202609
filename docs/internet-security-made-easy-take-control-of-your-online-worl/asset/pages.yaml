- pgno: 97
  md: '# # Clearing Browser Data in Firefox


    +   1. Click the menu button (three horizontal stripes).

    +   2. Choose History and then Clear browsing history.

    +   3. Select how far back you want to delete your history, or choose everything.

    +   4. Select what information you want to erase, such as browsing history, cache
    or cookies.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_97_0.png)


    Above: Clearing history in Firefox.


    > # Hot Tip

    > We have included instructions for clearing web history in the most popular browsers.
    In other browsers or older versions of the ones listed, search for the right option
    by opening the settings panels.


    # ## COOKIES


    Not only do our web browsers store information about our visit to a web page,
    but websites do so too. In order to improve our user experience, websites store
    information in cookies. Cookies are simply pieces of code stored on our computers.
    Generally, cookies do not pose too much of a security threat. However, if you
    would rather not have them on your system, you can also clear cookies in a similar
    way as clearing web-browsing history.


    # # Clearing and Blocking Cookies


    You can clear, restrict and permit cookies in web browsers:


    +   - Internet Explorer: Select the Cookies check box when deleting browser history.

    +   - Firefox: Follow the instructions for clearing web history.'
  merge: -1
  img_proc: true
- pgno: 98
  md: "Chrome: Go into the Settings menu (three horizontal stripes), click the advanced\
