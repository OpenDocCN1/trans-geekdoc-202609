- pgno: 9
  md: '# # INTRODUCTION


    The Internet has changed our lives forever, but this communications revolution
    is not without its problems. As in ordinary life, there are viruses, hackers and
    identity fraudsters. This book is designed to help you safely navigate the online
    world and keep you secure from online threats.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_9_0.png)


    Above: Websites such as Facebook allow us to socialize but they also contain all
    sorts of personal information about us.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_9_1.png)


    Above: Many of us now do our banking online. The last thing we would want is for
    somebody to be able to access our accounts.


    # ## INTERNET SECURITY


    Keeping safe online is important. As well as benefits, the Internet contains potentially
    harmful threats, from viruses and malware that can infect our computers, erasing
    our data or spying on our online activities, to hackers and ID fraudsters who
    want to gain access to our data for their own aims. Knowing how to defend yourself
    from these threats is increasingly crucial for keeping your network, computers,
    online accounts and family safe.


    # ## The Importance of Protection


    The Internet has become a vital tool for many of us, enabling us to socialize
    on social media, communicate by email, shop and do our banking online. Because
    of this reliance on the online world, keeping secure is vital to prevent unauthorized
    access to our online accounts and ensure our personal information does not fall
    into the wrong hands.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# # ONLINE THREATS


    When most people think of Internet security, they think of viruses, but there
    are many types of viruses and much more to protecting yourself online than keeping
    malicious software at bay. Your web presence can give hackers and fraudsters a
    wealth of information about you. They can even access your finances and take over
    your identity. Furthermore, if you have children who are using social networks
    and communicating with people over the World Wide Web, you want to be assured
    that they are doing it safely.


    # # The Mobile Age


    The Internet used to be something that you could only access on a desktop PC through
    a phone line. However, these days you can access the web almost anywhere. Smartphones,
    tablet computers, wireless access and other technologies means the World Wide
    Web is available everywhere, but so are online threats, and Internet security
    is just as important when you are using a smartphone as it is when you are using
    a desktop PC.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_10_0.png)


    Above: We can access the Internet almost anywhere, making Internet security just
    as crucial for mobile devices.'
  merge: -1
  img_proc: true
