- pgno: 56
  md: 'the case. Internet security requires a holistic approach, with good practices
    running in tandem with hardware and software solutions.


    # Common Bad Practices


    Computer users are often guilty of some common computer bad practices that make
    them more vulnerable to attack.


    +   No protection: Having no Internet security systems in place, such as antivirus
    software and firewalls, can almost guarantee your computer will suffer from an
    attack at some point.


    +   Passwords: Weak passwords, using the same password for all accounts, or divulging
    your passwords to other people are also common reasons why people suffer an online
    attack.


    +   File sharing: While peer-to-peer file sharing is a useful way to swap files
    with people you know, files from unknown sources can sometimes contain viruses.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_56_0.png)


    Above: Files from file-sharing websites, such as ISO Hunt, can sometimes contain
    viruses.


    +   Attachments: Opening attachments from people you do not know, or not having
    some antivirus software to scan them, can unleash malware.


    +   Personal details: Giving out too much personal information on social media
    websites can lead to people guessing passwords or knowing enough to assume your
    identity (identity fraud).


    +   Out-of-date software: Running old software or not updating operating systems,
    programs and antivirus software can make a computer vulnerable.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# KEEPING SECURE\n\nBecause of the number of vulnerabilities that threaten\
    \ our Internet security, the first step to staying protected is to fix as many\
    \ of them as possible.\n\n+   - Connection: Make sure your Wi-Fi connection is\
    \ secured by a password to stop people piggybacking on it.\n\n+   - Firewall:\
    \ Install a software firewall on your computer or laptop. If your operating system\
    \ does not include one, consider buying one. (For more information about firewalls,\
    \ see pages 165–68.)\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_57_0.png)\n\n\
    Above: Firewalls, software updates and antivirus protection are all crucial for\
    \ Internet security.\n\n+   - Antivirus: Make sure you have some form of antivirus\
    \ software installed. (See pages 136–64 for more details about the different solutions\
    \ available.)\n\n+   - Update: Keep your operating system, Internet browser and\
    \ programs regularly updated to fix any vulnerabilities.\n\n> **Did You Know?**\n\
    > \n> Some Wi-Fi systems include an encryption system, such as WEP or WPA, to\
    \ provide added security. Contact your Internet provider to make sure you are\
    \ taking advantage of these.\n\n+   - Good practice: Practise safe online surfing,\
    \ such as never divulging too much personal data, never opening attachments from\
    \ people you do not know, as well as ensuring you have strong passwords on your\
    \ accounts."
  merge: -1
  img_proc: true
- pgno: 58
  md: '# # MALWARE


    By far the most common online threat comes from malware. In this section, we will
    examine the different types of malware more closely and explore how they work
    and the threats they pose.


    # ## MALICIOUS SOFTWARE


    Malicious software has been around almost as long as computers. The first computer
    viruses were not deliberately made but came about from errors in software programs.
    These errors caused system crashes and became known as ''bugs''. However, people
    soon realized they could create their own bugs and even get them to self-replicate,
    and so the computer virus was born.


    # ### Who Creates them and Why?


    You may wonder what sort of person would make malware and for what reason. The
    truth is, all sorts of people make malware and for all sorts of reasons.


    +   - Hackers: People create malware to cause disruption and hack into high-profile
    computer systems, either just for fun of it or for some political agenda.

    +   - Criminals: Malware is used to steal data and money.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_58_0.png)


    Right: Virus infections are an all-too-common threat.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - Businesses: Some disreputable companies use malware to market products
    or get people to buy their software fixes.

    +   - Governments: Even governments create malware to infiltrate the computers
    systems of another nation.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_59_0.png)


    Above: By accepting the terms on some licence agreements, you are agreeing to
    have malware installed on your machine.


    # How They Get In


    Malicious software can get into a computer in a number of ways: some are hidden
    in programs and are activated when you install the program; some software developers
    create free programs just in order to install malware on people''s machines; while
    other malware is disguised as genuine files and is activated when you open the
    file. Additionally, some malware lingers on malicious websites, infecting your
    Internet browser when you visit the site.


    # Hot Tip


    Whenever you install new software, especially free programs, always read the user
    agreement carefully and do a search on the Internet to see if other users have
    developed malware issues after installing.


    # WHAT IS OUT THERE?


    Malware is a broad term and includes all sorts of malicious software that can
    range from being minor annoyances to programs that can erase all your data, steal
    your files or disable your computer. Sometimes infection by malware is obvious
    because you may lose data or suffer continuous computer crashes. However, with
    some malware, you may not even know you have been infected.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_60_0.png)


    # ## Computer Viruses


    Most people have heard of computer viruses, but few people really understand how
    they work.

    Simply put, a computer virus is a piece of code that self-replicates and spreads
    to other

    computers. Viruses are normally written to have a specific purpose, such as deleting
    files or

    creating errors in software. A virus can enter a computer through various means,
    such as in email

    attachments or the programs you download, and they often infect

    other files on a computer, which

    allows the virus to spread when you

    pass these file on. Because of this,

    even the people who create viruses

    have no control over the number of

    machines a single virus can infect.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_60_1.png)


    Right: Viruses can hide in programs or attachments.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# # Types of Computer Virus


    Computer viruses come in various guises, and each one behaves differently.


    +   - **Program viruses**: These infect executable files (programs), and the virus
    is installed into the computer memory with the executable file, where it infects
    other files and acts out its programming.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_61_0.png)


    Above: Some viruses will prevent your PC from booting up normally.


    +   - **Boot viruses**: Rather than infecting computer memory, boot viruses infect
    the record used by operating systems when they start up, so the virus is reinstalled
    every time you turn on.


    +   - **Stealth viruses**: These viruses are designed to avoid detection. Commonly,
    this is done by preventing the section of hard disk they are on from being read.


    +   - **Polymorphic viruses**: Just as biological viruses mutate, so do polymorphic
    viruses, changing their source code with each infection to make detection and
    removal harder.


    +   - **Macro viruses**: These infect the macros (little pieces of code that do
    specific tasks) in program files, such as word-processing documents or spreadsheets.


    +   - **Active X viruses**: Active X is a framework used by software programs
    to share information, and by infecting this framework, Active X viruses can spread
    easily.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Worms


    Similar to a computer virus, a worm can self-replicate and is designed to do harm.
    However, the big difference is in the way a worm spreads. Rather than infecting
    files that require human activity to pass them on, such as in email attachments,
    worms can spread over computer networks without assistance. When one computer
    on a network is infected, the worm will spread to all other machines on that network.
    Some worms have even been known to email themselves to everybody in a person''s
    address book.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_62_0.png)


    Above: The harm that worms can cause varies from simply consuming bandwidth, to
    deleting and encrypting files or worse.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_63_0.png)


    Above: People use spyware and keyloggers to hack into online accounts.


    # Spyware


    Unlike a virus, spyware does not self-replicate. As its name suggests, the sole
    purpose of spyware is to spy on a person''s computer activity. Spyware can collect
    all sorts of data about your computer use, such as the websites you visit, while
    some spyware, known as ''keyloggers'', even records your keystrokes, which can
    be used to identify your passwords and usernames for online accounts.


    # Adware


    While different to spyware, adware is often installed with it. Companies pay a
    lot of money to malware developers to have adware installed on people''s machines.
    It works by sending specific advertisements to you depending on your web-browsing
    history. This may be in the form of pop-ups or it may replace your browser homepage
    and bookmarks. Other adware can even replace your search-engine results with websites
    from the people who have paid the adware developers.


    # Hot Tip


    If you notice your computer is running unusually slowly, you may have inadvertently
    installed spyware, as it often runs in the background using system resources and
    slowing things down.


    # Ransomware


    Ransomware is designed solely to make money. It works by holding your computer
    or files hostage until you pay a ransom. Some ransomware will flash up warning
    messages telling you to pay money to get rid of the messages, hoping that the
    annoyance will be enough for you to cough up, while other ransomware, such as
    CryptoLocker, encrypts all your files so you cannot access them until you have
    paid to have them decrypted.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Scareware


    Scareware is a less blunt method of obtaining money, where the malware creates
    a fake warning message suggesting your computer has been infected with a virus
    or spyware while suggesting you buy a particular malware removal product to solve
    the problem.


    # Trojan Horse


    A Trojan horse does not describe a particular type of malware, such as spyware
    or virus, but describes a method of delivery. A Trojan horse is a piece of malware
    that is disguised as a legitimate file. Trojan horses can be spyware, or contain
    pieces of code that will join your computer to a botnet (we will discuss these
    in a minute). Trojan malware rarely replicates or spreads from machine to machine,
    as the purpose of a Trojan is to run in the background so a user does not know
    he or she has been infected.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_64_0.png)


    Above: Some ransomware not only locks your files, but also threatens to destroy
    them at a certain time.


    # Rootkit


    Another type of malware that tries to remain hidden to avoid detection is the
    rootkit. A rootkit buries itself deep in the operating system much like a boot
    virus does, but they do not replicate or try to spread to other machines. Their
    purpose is to remain hidden so antivirus software and other security measures
    cannot detect them as they carry out the tasks they were programmed for. They
    are also notoriously difficult to remove.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_64_1.png)


    Above: The best way to protect yourself from malware is to use antivirus programs.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Bots


    As mentioned in the previous chapter, bots are computer codes designed to do a
    specific task. Bots are not necessarily malevolent; search engines, for instance,
    use bots to identify what is on a web page, but bots can be used maliciously,
    especially when they are working together (see below).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_65_0.png)


    # Botnets


    Botnets are when large number of bots work together for a common goal. When a
    computer becomes part of a botnet, the bots function on people''s computers in
    the background with the user often unaware. Botnets work together and can send
    out spam and other malware, or target specific networks or website servers, either
    to take them down or to bombard them with so many requests that the server becomes
    clogged, known as a distributed denial of service attack (DDoS).


    Left: Unexplained network activity could mean you have become part of a botnet.


    # Hot Tip


    If your Internet connection is running slowly, or you notice network activity
    even when you are not on the Internet, it could be because your machine may have
    become part of a botnet.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# PROTECTING YOURSELF


    As computers and the Internet get ever more sophisticated, so do viruses and malware.
    Antivirus developers are in a constant battle to identity and eliminate new threats.
    However, they are always one step behind the malicious coders. Antivirus software
    is crucial, but even with it installed, malware can still be a problem. Because
    of this, it is worth being prepared for the worst.


    # Backing Up


    Data loss can be one of the worst outcomes from an attack by malware, so ensure
    you back up all your important files regularly. However, it is worth remembering
    that if a virus has been on your machine for a while, your backup files may also
    be infected. Do not just have one system for backing up either; think about using
    a cloud solution (online file storage) as well as a hardware system, such as a
    flash drive.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_66_0.png)


    Above: Cloud storage solutions such as Dropbox can be used to store back-ups of
    your important files.


    # PC Health Checks


    Regular use of diagnostic software (see pages 174–77) can help spot and eliminate
    threats before they cause harm. You can also take your computer to a trained professional
    for regular health checks.


    # Warning Others


    If your system does


    become infected with malware, think about warning other people, such as those
    in your email address book, as you may have inadvertently already spread the malware.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # THE WORST OFFENDERS


    Malware can often make the headlines, especially when it attacks high-profile
    organizations, or if it has become particularly widespread. Here are some famous
    examples of malware.


    +   - **The Love Bug virus**: Perhaps the most successful computer virus attack
    in history, infecting an estimated 50 million computers. The virus was hidden
    in an email attachment purporting to be a love letter, triggering people to open
    it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_67_0.png)


    +   - **The Anna Kournikova worm**: The Kournikova worm was attached to an email
    claiming to have naked pictures of the tennis star. Once opened, the worm sent
    itself to everybody in a user''s address book and infected tens of millions of
    machines.


    +   - **Conficker Botnet**: In 2009 Conficker became the largest botnet ever and
    took control of millions of PCs around the world, yet to this day nobody knows
    for what purpose or by whom.


    Left: Promises of naked pictures of Anna Kournikova were enough to convince millions
    of people to open an attachment containing a virus.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # IDENTITY THEFT


    Identity fraud is one of the fastest-growing crimes and it can cause chaos for
    its victims. Identity theft can result in somebody stealing from you, taking out
    loans in your name or even committing crimes while pretending to be you.


    # ## A CASE OF STOLEN IDENTITY


    In 2006, when 24-year-old university graduate Victoria Sennitt opened her post,
    she was surprised to see a letter from a mobile phone company welcoming her to
    her new contract. Because Victoria had not signed up for a new mobile phone, she
    made some enquiries and was shocked to discover her identity had been stolen by
    fraudsters, who had used information she had left on social media websites to
    apply for a mobile phone.


    ''I know it sounds stupid,'' Victoria told UK Newspaper The Daily Mail, ''but
    I feel very violated to know that a criminal was able to log on to my page and
    steal my personal details.''


    Victoria was lucky; she managed to convince the phone company that it was a fraudster
    who had taken out the contract, but not everybody is so fortunate.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_68_0.png)


    **Above:** Fraudsters may assume your identity in order to make purchases – for
    which you then receive the bill.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# A Growing Problem


    Identity theft is a huge problem. In the United States, it is estimated that identity
    theft costs Americans over $20 billion each year, and in the UK, identity fraudsters
    are stealing nearly £2 billion of other people’s money. And the problem is getting
    worse.


    # Online Activity


    Identity theft is not just an online problem; fraudsters can get hold of our personal
    information in other ways, such as going through our rubbish bins. However, the
    reason identity fraud is rising so quickly is because there is an increasing amount
    of information about us online, which has made it so much easier to get hold of
    our personal details. Using social media, email and other online platforms, fraudsters
    have ready access to all sorts of personal information about us, which they can
    use to commit fraud in our name.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_69_0.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# CONSEQUENCES OF IDENTITY THEFT


    Before we look at how identity fraudsters get hold of our personal information
    and what we can do about it, it is worth reiterating the consequences of having
    your identity stolen.


    +   - **Financial:** Somebody assuming your identity can take out loans and other
    financial commitments under your name, for which you may be deemed liable.


    +   - **Driving licence:** Your name could be used to obtain a driving licence,
    which could result in you being penalized for somebody else''s driving infringements.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_70_0.png)


    +   - **Benefits and tax:** An identity fraudster may use your name to claim State
    benefits or file fraudulent tax returns.


    +   - **Passport:** Your identity may be used to obtain a passport, preventing
    you from getting one.


    Above: With enough information, fraudsters can apply for credit cards in your
    name.


    +   - **Crime:** Frauds or other crimes may be committed under your name, for
    which you could be held responsible if you cannot prove it was not you.


    > **Hot Tip**

    > Never divulge information over the Internet that could be used to steal your
    identity, especially your address, phone number, and bank and credit card details.


    +   - **Credit score:** Your credit rating could be damaged, making it harder
    for you to get a loan, mortgage or credit card.


    +   - **Reputation:** Somebody pretending to be you could say and do things on
    social media that may cause you embarrassment.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# ASSUMING YOUR IDENTITY


    Fraudsters employ a number of different tactics to get hold of your personal data
    online. These range from the very simple to some ingenious methods of fooling
    you to hand over information.


    # Social Media


    Perhaps the places with the greatest wealth of personal information available
    for fraudsters to take advantage of are social media websites. People include
    all sorts of details on their Facebook, Twitter and LinkedIn profiles, feeds and
    pages, such as where they live, phone


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_71_0.png)


    Above: If you do not take precautions, fraudsters may use your personal information
    to obtain identity documents in your name or apply for credit cards.'
  merge: -1
  img_proc: true
