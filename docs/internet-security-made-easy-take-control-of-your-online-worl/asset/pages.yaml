    \ delete files. What normally happens is that the location on the hard drive where\
    \ the file is stored is marked as accessible, allowing other data to overwrite\
    \ it, but that can take weeks, months or even years, so your file can linger on\
    \ the hard drive for a long time.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_220_0.png)\n\
    \nAbove: When you empty a recycle bin, you may think the data is gone for ever,\
    \ but that may not be the case.\n\n# Recovering Erased Files\n\nA number of different\
    \ software solutions are available for all sorts of platforms: PCs, Macs,"
  merge: -1
