- pgno: 159
  md: '# # Control Panel


    When your antivirus software is installed on your computer, you will see a small
    icon in the lower right-hand corner of your Windows taskbar (on a Mac, this may
    be in the top right, or you may have to open up System Preferences). When you
    double click this icon, it will bring up the antivirus control panel. Control
    panels for antivirus software normally include the different functions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_159_0.png)


    +   - **Computer**: This will tell you if your computer is protected. If you have
    not run an initial scan, this will show that action is required. There will normally
    be a Fix or Scan Now button.

    +   - **Internet**: Where you will find your browser protection tools.

    +   - **Emails**: Where you can run email scans.

    +   - **Firewall**: Where you can turn on and control your antivirus firewall
    (if included).

    +   - **Others**: You may have sections for identity protection, parental controls
    and other additional features included in your antivirus software.

    +   - **Updates**: Where you can update your antivirus software.


    Above: Norton control panel.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_159_1.png)


    Above: McAfee control panel.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "# ## SCANNING\n\nWhen your antivirus software is installed it will most likely\
    \ ask you if you want to run an initial scan. This is important as it will check\
    \ your hard drive for any existing threats and remove them. If you are not prompted\
    \ to run an initial scan, go into the control panel of your antivirus software.\
    \ You will probably find a simple interface, with a section labelled Scanning:\
    \ go into this and run a full scan.\n\n> **Hot Tip**\n> \n> Most antivirus software\
    \ will allow you to schedule when you want updates. Make sure you update it daily,\
    \ perhaps when you first boot up your machine. That way, you will always be protected\
    \ from the most recent threats.\n\n# ## Update\n\nBefore your antivirus software\
    \ can run a full scan it may need to update its virus database so it can spot\
    \ recent threats. This may take several minutes. Most software will do this automatically,\
    \ but it may prompt you with a window asking for your permission to update; just\
    \ click yes.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_160_0.png)\n\nAbove:\
    \ Running a scan in AVG.\n\n# ## SETTING UP YOUR PROTECTION\n\nWhen installed,\
    \ antivirus software normally starts in a default mode, which ensures your system\
    \ is secure from the outset. However, this default mode may not provide you with\
    \ all the features you require in operation, or it may be too strict, slowing\
    \ the performance of your machine down as it runs unnecessary scans. You can adjust\
    \ the various different settings to ensure you are getting the most out of your\
    \ antivirus software."
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Shield


    Your antivirus shield is normally in the **Computer** protection settings. The
    purpose of the shield is to stop threats entering your computer, but the way it
    does this can be adjusted using a settings menu (you may have to double click
    the **Computer** tab to see the settings menu or click a **settings** link).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_161_0.png)


    Above: Adjusting shield settings in Avast.


    +   **Permission:** Your antivirus software may remove threats automatically or
    you can set it to ask your permission first.


    +   **Reporting:** The software may be able to report potentially unwanted programs
    or possible threats that are not yet on its database.


    +   **Heuristics:** Enabling heuristics lets your antivirus software look for
    suspicious behaviour or code.


    # Hot Tip


    A full computer scan can take some time and can slow your computer down. It is
    perhaps more practical to schedule a scan on a weekly basis or before you shut
    down your machine, rather than when you turn it on.


    # Scans


    There are all sorts of options available in the scanning settings on most antivirus
    software.


    +   **Media:** You can scan removable media plugged into your machine, your hard
    drive or specific files and folders.


    +   **Schedules:** Allows you to schedule full or partial scans at regular intervals.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   Files: You can set your antivirus to scan files when you open or close
    them.


    +   Extensions and cookies: You can scan items in your Internet browser, such
    as cookies, toolbar extensions and browser helper objects (more on these on pages
    235–37).


    # Email Scanning


    Scanning emails can protect your computer from malware threats sent in attachments
    and can also prevent you from infecting other people''s machines. You can choose
    whether to scan inbound or outbound emails or both.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_162_0.png)


    Above: Adjusting email settings in AVG.


    # Web Browser Protection


    Different antivirus solutions offer all sorts of protection when you are surfing
    the Internet, most of which can be adjusted in the settings.


    +   Identity protection: This sort of protection can guard you against phishing
    and spyware. However, as no system is infallible, it may block innocent emails,
    so you can choose whether to have it warn you or remove threats automatically.


    +   Malicious web pages: Most antivirus software has some form of web shield that
    protects you from malware hidden in web pages. This can be adjusted in the settings.


    +   Toolbars and browser extensions: Some antivirus software provides you with
    tools that can be installed on your browser, such as safe search bars.


    +   Search protection: Some antivirus has software that runs on search engine
    pages, providing information about whether a website is trusted or may contain
    a threat.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_163_0.png)


    # Updating


    It is not only the virus database that can be updated, but most antivirus developers
    also release updates to the software, and it is important to regularly install
    these.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_163_1.png)


    # Quarantine


    The quarantine, sometimes called a virus vault, is where your antivirus software
    places threats it has not removed. Once in quarantine, threats can no longer cause
    harm, as they are isolated from the computer. If the file is innocent and


    Left: AVG safe search icons show next to Google search results.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "needed by a program to run, you may find that program stops working, which\
    \ is why it is a good idea to set your antivirus software to quarantine threats\
    \ before deleting them.\n\n+   - Schedule: You can schedule your antivirus software\
    \ to delete threats in your quarantine after a certain time, enabling you to check\
    \ whether the files are not needed. Alternatively, you can delete threats manually.\n\
    \n+   - Size of vault: You can also allocate how much of your hard drive you want\
    \ to set aside for the virus vault.\n\n> **Did You Know?**\n> \n> Your antivirus\
    \ software will keep a record of all the threats it has found and will normally\
    \ provide statistics in the settings menu, allowing you to evaluate the effectiveness\
    \ of your software.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_164_0.png)\n\n\
    Above: Adjusting the size of the virus vault in AVG."
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Exceptions


    If your antivirus software starts to interfere with the normal running of some
    programs, you can instruct the antivirus to ignore these programs from scans and
    threat detection. Adding exceptions is normally straightforward in most antivirus
    software.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_165_0.png)


    Above: Exceptions menu in AVG.


    +   1. Click Add Exception in the exceptions settings menu.

    +   2. Choose whether it is a file, folder or program you wish to exclude.

    +   3. Enter or browse for the location of the item you want to exclude.

    +   4. Select what you want to exclude the file from, such as scanning or shield
    protection, and click Save.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_165_1.png)


    Above: Browsing for a file to exclude from antivirus scans.


    # Reporting Back


    Because antivirus software is dependent on identifying new threats and finding
    solutions to defend against them, your software may send a report to the developers
    if it finds a new threat, including data about your machine. This information
    is normally anonymous, and not identifiable to you, but you can usually turn this
    feature off if you feel uncomfortable about it.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# USING FIREWALLS


    Firewalls are as important as antivirus software for protecting you from threats.
    Most antivirus software comes with a firewall, or you may have one built into
    your operating system, but to ensure proper protection, you need to know how to
    use it properly.


    # WHAT IS A FIREWALL?


    While your antivirus software can protect you from malware by scanning files and
    folders, other threats can still get through your computer, such as hackers and
    bots. To guard against unauthorized access, a computer or network needs a firewall.
    Firewalls work by filtering traffic and only letting through certain communications
    depending on a given set of criteria.


    > Did You Know?

    > A firewall normally acts as a one-way barrier to the Internet; while it will
    block traffic coming into a computer, it will allow free access for outbound traffic.


    # Hardware and Software


    A firewall is commonly a software barrier, often installed in an operating system
    or with antivirus software, but you can use hardware firewalls for added protection.
    For more information on hardware firewalls, see pages 243–45.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_166_0.png)


    Right: Firewalls act rather more intelligently than a brick wall – filtering out
    dangerous traffic.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Installing Firewalls


    Most antivirus software comes with a firewall, as do many operating systems. You
    can easily check if you have a firewall installed.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_167_0.png)


    Above: Opening up the Security Center on a PC.


    +   1. On a Windows machine, click start and open up the **Control Panel**. On
    a Mac, open up the **System Preferences** from the Apple menu.


    +   2. On a Windows machine, select the **Security Center**; on a Mac, choose
    **Security and Privacy**.


    +   3. You can see if your firewall is active by the green **On** button in Windows
    and in the **Firewall** tab on a Mac.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_167_1.png)


    Above: Windows firewall is activated.


    # Third-party Firewalls


    If you do not have a firewall installed, you can buy or download free third-party
    firewalls.


    Some third-party firewalls include:


    +   ♣ **ZoneAlarm** (http://www.zonealarm.com/): Has a free firewall, but also
    sells a compatible antivirus and security suite.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_167_2.png)


    Above: ZoneAlarm is a popular free firewall.


    +   ♣ **Comodo** (http://personalfirewall.comodo.com/): Provides a free firewall
    as well as a paid-for antivirus and firewall suite called Internet Security Pro.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Online Armor: A paid for firewall (£25.07/$40.00 per year) that is rated as
    one of the best on the market.


    # ## COMMON FIREWALL PROBLEMS


    Most issues around firewalls are caused by the firewall blocking access to innocent
    programs that need to send data to your computer. Sometimes using a firewall can
    stop certain features of applications from working properly. In the majority of
    cases, these problems can be rectified by adjusting settings in your firewall
    to allow incoming traffic.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_168_0.png)


    # ## Exceptions


    When your firewall blocks something, a box may pop up to tell you and give you
    the option of allowing the item through. However, it may not, in which case you
    have to add an exception to your firewall settings to allow data needed by the
    program to enter your firewall.


    **Hot Tip**


    Some programs, such as antivirus software, automatically include themselves as
    exceptions in your firewall settings. However, some malware can do this too, so
    it is worth checking to see what has been made an exception in your firewall settings.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Adding Exceptions to Windows Firewall


    Adding a program as an exception to most firewalls is relatively straightforward.
    Here''s how to add a program as an exception to Windows Firewall.


    +   1. Open up the Windows Security Center and click on Windows Firewall.


    +   2. In the Windows Firewall menu, click on Exceptions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_169_0.png)


    +   3. Click Add Programs.


    +   4. Select the program from the menu, or Browse for it on your hard drive.


    +   5. Click OK to add to exceptions.


    # Removing an Exception


    If you wish to remove a program from your list of exceptions, just select it and
    click Delete.


    Above: Adding a program as an exception to the firewall.


    # PORTS


    When data arrives on your computer, it does so by the way of an open port. A port
    is simply the pathway on which data travels to your computer. Normally these pathways
    are blocked by the firewall, but to authorize communication, the firewall opens
    a port to allow access. Most software is usually programmed to send data through
    a specific port, but sometimes a program may not have a predetermined port number
    and you may need to open one or redirect the data.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_170_0.png)


    # # Changing Port Numbers


    If a program is not working properly, such as freezing or crashing, or you are
    receiving Windows’ error messages indicating you have a software conflict or that
    it has blocked a port, it may be a sign you have several programs trying to use
    the same port and you may need to reassign the port number. However, most software
    will only work through certain ports, so if a user manual came with your program,
    look to see what ports it can work with.


    +   1. Open up the firewall settings (here we show Windows Firewall).


    +   2. In the Exceptions tab, select the program for which you need to open a
    new port and select Edit then Change Scope.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_170_1.png)


    +   3. Enter the new port address.


    Above: Editing a port number in Windows Firewall.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_171_0.png)


    # Opening Ports


    Sometimes your software may not be able to automatically open its own port, which
    means you may have to do it manually.


    +   1. In your firewall settings, select Add Port.


    +   2. Enter the name of the program you want to open a port for.


    +   3. Enter the port address (consult your software manual for suitable ports).


    +   4. Click OK.


    Above: Changing a port address in Windows Firewall.


    # Port Forwarding


    Some hardware firewalls allow port forwarding. When you forward a port, you are
    redirecting the data. This is often done to speed up the performance of the data
    entering a network, as congested ports can slow down programs and applications.
    However, you cannot simply forward data to any old port, it has to be one that
    is compatible with your software. In addition, it is not something you should
    try unless you are confident you know what you are doing.


    # Running Multiple Firewalls


    Some firewalls are compatible with each other, but generally speaking, running
    more than one firewall at a time can cause conflicts, which may leave your computer
    exposed to threats.


    # Turning off Your Firewall


    If your firewall is causing an issue that you cannot solve, such as preventing
    a program from working, you can turn your firewall off using the firewall settings.
    However, your computer will be vulnerable to threats as long as the firewall is
    not on, so ensure you turn it back on again as soon as possible.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # OTHER PROTECTION SOFTWARE


    Antivirus and firewalls are not the only software available to guard you against
    online threats. Some malware can be difficult to detect and an array of additional
    tools and techniques is available that can help keep you secure.


    # ## JAVA AND FLASH THREATS


    One of the major weaknesses on a computer when it comes to online threats is the
    plug-ins used by browsers that allow multimedia and interactions on websites.
    These are known as Flash and Java, and malicious programmers often use the inherent
    weaknesses in these plug-ins to attack computers.


    # ### Java


    Java is a browser plug-in, used by some websites to show content. However, Java
    is a bit like running a virtual computer on your browser, and Java programs run
    on this virtual environment. This means a malware program can be written to infect
    Java, and it will run on any computer, PC or Mac, and your firewall and antivirus
    software can do little to guard against these threats.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_172_0.png)


    Above: Java is used by a lot of websites for running multimedia.


    # ### Flash and Shockwave


    Flash and Shockwave are plug-ins created by Adobe to run multimedia such as videos
    and streaming content. As with Java, malicious programs can attack these plug-ins.
    However,'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Adobe regularly releases updates to ensure its products are secured against
    malware, so the best way to protect your machine from Flash and Shockwave threats
    is to ensure you update regularly.


    **Hot Tip**


    You can ensure you have the latest versions of Flash by downloading it directly
    from https://www.adobe.com/support/flashplayer/downloads.html, and the latest
    Shockwave at http://get.adobe.com/shockwave/


    # Disabling Java


    While Java regularly releases updates to protect against threats, some users prefer
    to disable it in their Internet browser unless they are on a website they trust.


    # Disabling Java on a PC


    +   1. Click the Start menu and scroll through your programs until you find Java.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_173_0.png)


    Above: Disabling Java in the Java control panel.


    +   2. Select Configure Java to launch the Java Control Panel.


    +   3. Click the Security tab and uncheck the Enable Java content in the Browser.


    +   4. Click Apply.


    # Disabling Java on a Mac


    +   1. Click on the Apple icon on upper left of your screen and go into System
    Preferences.


    +   2. Click on the Java icon to launch the Java Control Panel.'
  merge: -1
  img_proc: true
