    \ a Mac or PC, reinstalling an operating system can bring with it a few problems.\
    \ In some instances, you may lose data, user accounts and saved preferences, so\
    \ before you consider a reinstallation make sure you back up all important files\
    \ and folders.\n\n> **Hot Tip**\n> \n> If your Windows PC will not install from\
