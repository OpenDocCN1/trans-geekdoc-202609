- pgno: 44
  md: '# LOOKING AFTER YOUR PASSWORD


    Once you have set your password, you need to keep it safe and secure.


    +   **Keep it secret:** Never tell anybody your passwords. If you think that someone
    else knows a password, change it immediately.


    +   **Privacy:** When you are entering a password on a public computer, make sure
    nobody can see your keystrokes.


    +   **Do not recycle:** When creating a new password, do not use one that you
    have used before.


    +   **Storing passwords:** Avoid writing passwords down. If you have to, disguise
    them in sentences and never store them on your computer.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_44_0.png)


    +   **Beware:** Of email claiming to be from your account provider and asking
    for your password. Online account providers almost never ask for your password.


    Above: Uncheck the ''Remember me'' box on any shared or public computers.


    +   **Public computers:** Make sure a browser on a public computer is not remembering
    your passwords and always log off when you have finished.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# # CHANGING YOUR PASSWORD\n\nBecause you never know when your details or the\
    \ websites that you have frequented have been compromised, it is important to\
    \ change your passwords regularly. Do this about every three months, but do not\
    \ change all your online accounts at once, stagger them, just in case somebody\
    \ is monitoring your computer activity.\n\n# ## Hot Tip\n\nIf you think the email\
    \ address that is attached to your online accounts has been compromised, change\
    \ it, as anybody with access to your email could reset all your passwords and\
    \ gain access to your accounts.\n\n# ## Password Reset\n\nIf you forget your password,\
    \ all is not lost. Most websites provide a password-reset facility to allow you\
    \ to create a new password.\n\n+   1. On the login page, there should be a ‘Forgotten\
    \ your password?’ or ‘Reset password’ link.\n+   \n+   2. After you click this\
    \ link, you may be asked to confirm that you want to reset your password.\n\n\
    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_45_0.png)\n\nAbove: Clicking reset password\
    \ link on Twitter.\n\n+   3. Once confirmed, your account provider will send a\
    \ link to your email address.\n+   \n+   4. Click this link to reset and create\
    \ a new password.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_45_1.png)\n\nLeft:\
    \ Password reset link sent to your email."
  merge: -1
  img_proc: true
- pgno: 46
  md: '# PASSWORD CHECKLIST


    Because passwords are so important for protecting your online security, here is
    a checklist of Dos and Don''ts for keeping passwords strong and secure.


    +   - Do: Use upper- and lower-case letters, numbers and keyboard symbols where
    possible in your passwords.

    +   - Do: Make your password at least eight characters in length, longer if you
    can remember it.

    +   - Don''t: Use personal information in your passwords, such as birthdays or
    names of family members.

    +   - Don''t: Use any information somebody could guess from reading your social
    media pages, such as your favourite sports team or the town in which you live.

    +   - Don''t: Use simple or plain words, ascending or descending numbers, or keyboard
    patterns such as ''qwerty'' in your passwords.

    +   - Don''t: Tell anybody your password.

    +   - Do: Remember to change your password regularly.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_46_0.png)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_46_1.png)


    Above: Changing a password on Twitter.'
  merge: -1
  img_proc: true
