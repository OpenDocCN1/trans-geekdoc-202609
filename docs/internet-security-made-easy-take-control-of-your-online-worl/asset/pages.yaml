    # # Swipe Security on Android Devices


    Most Android devices include the ability to lock a phone using a swipe pattern,
    unique shape created using your finger, that will unlock the phone. As with passwords,
    you need to come up with something that cannot be easily guessed or cracked using
    trial and error. This means not using an obvious shape such as a cross or L-shape.


    # ## Setting an Android Swipe Pattern


    +   1. Go into Settings and choose Security.

    +   2. Select Change Unlock Pattern and check Require Pattern.

    +   3. Swipe the pattern you want to use to unlock your phone.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_185_1.png)


    Above: If you forget your swipe lock, you can enter your Gmail account to unlock
    your phone.


    # ## Forgotten Swipe Pattern


    If you forget your security pattern for your Android device, you can swipe your
    finger down and to the right. This will present you with the ability to enter


    > **Did You Know?**

    > If you fail five times to swipe the correct pattern into an Android device,
    the device will lock and you have to wait 30 seconds before you can try again.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'your Gmail address and password (the phone or tablet has to be connected to
    the Internet for this to work), which, if correct and synced to the phone, will
    unlock it.


    # Additional Tablet and Smartphone Locks


    Both later iOS and Android devices have other security features installed that
    you can use to lock/unlock your phone. To access these, you need to visit the
    security menu in your device''s settings.


    +   Face unlock: Some tablets and smartphones allow the use of facial recognition
    software that ensures only your face can unlock the device.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_186_0.png)


    Above: You can install facial recognition software on later iPhones.


    +   Signature: Some devices, such as the Galaxy Note tablet, let you lock/unlock
    the device using your written signature.


    +   Passwords and PIN: Some Android devices, such as 2.2 Froyo, permit the use
    of passcodes and passwords.


    +   SIM card PIN: To prevent someone removing your SIM card and using it in another
    phone, you can set a PIN lock on some smartphones.'
