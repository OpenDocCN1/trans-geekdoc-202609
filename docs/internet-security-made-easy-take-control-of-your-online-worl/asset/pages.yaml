- pgno: 222
  md: "# # SECURING ERASED DATA\n\nWhile software that can recover deleted files may\
    \ be useful when you have been the victim of data loss, they do pose another security\
    \ threat. If you change your computer, or install a new hard drive, the last thing\
    \ you want is your personal information, files and data on your old computer or\
    \ hard drive falling into the wrong hands. Because of this, many of the hitherto\
    \ mentioned file recovery platforms also offer secure delete functions that let\
    \ you erase data completely from your hard drive or removable media.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_222_0.png)\n\
    \n# # DATA RECOVERY SERVICES\n\nIf you have tried every possible method of recovering\
    \ deleted files and failed, do not dismay. You may be able to find a data recovery\
    \ specialist in your area who may be able to help. These people use specialist\
    \ equipment and software to retrieve your data, even when all other methods have\
    \ failed. Many also offer secure and permanent erasing of old hard drives.\n\n\
    > Left: Antivirus software can help you permanently erase data.\n\n> ### Hot Tip\n\
    > \n> Some antivirus software have facilities that let you permanently erase files\
    \ or folders, but you need to exercise caution when using them, as once the file\
    \ is deleted, it is gone for ever."
  merge: -1
  img_proc: true
- pgno: 223
  md: '# SYSTEM REPAIR


    Viruses and malware can not only erase files, but they can also make your machine
    unstable, causing system crashes, even preventing you from booting up your computer.


    # SYSTEM STABILITY


    If you have had malware on your computer, even if you have managed to clean the
    infection using antivirus software, you may find things have become a little unstable.
    System crashes, booting problems and other issues can often occur following a
    malware attack. Viruses and other malware may have corrupted system files, and
    while your antivirus software may have removed the threat, most cannot repair
    registry files and other operating system information used by your computer.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_223_0.png)


    Above: The so-called ''blue screen of death'' is a common symptom following a
    virus infection.


    # System Tools


    Fortunately, when it comes to desktop PCs, Macs and laptops running OS X or Windows,
    you have a wide variety of tools at your disposal that can help restore things
    to the way they were before the malware struck. These range from tools that scan
    your hard drives and system for potential errors, to those that roll things back
    to a time before the infection, restoring your system.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# # WINDOWS TOOLS


    Windows has a number of tools that can help you repair your system registry.


    +   - Scandisk: Will scan hard drives for potential errors and corrupted files.


    +   - Safe Mode: Designed for troubleshooting. Safe Mode boots up a limited version
    of Windows with only the minimum of files installed.


    +   - System Restore: Lets you roll back the operating system to a previous state.


    # ## Scandisk


    Performing a scan of your hard drive is relatively easy.


    +   1. Click Start and select My Computer.


    +   2. Right click on the drive you want to scan and select Properties.


    +   3. Click the Tools tab and under Error Checking, click the Check now button.


    +   4. In the window, select whether you want to fix errors automatically or not.
    (Windows 7 and later), then hit Start.


    > > **Hot Tip**

    > > If your computer crashes, Windows will automatically run Scandisk and check
    the hard drive for errors when it boots up.


    # ## Safe Mode


    If your machine simply will not boot up, you can try starting in Safe Mode and
    then run Scandisk once Windows has booted up.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_224_0.png)


    Above: Click the Check Now option under Tools in Properties to scan your computer
    with Scandisk.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_225_0.png)


    Above: Safe Mode menu in boot options.


    +   1. Press and hold the F8 key as your computer starts.

    +   2. Select Safe Mode in the options window.


    # # System Restore


    System Restore can return your PC''s system files and programs to a time when
    everything was working well. Programs installed after a restore point will be
    removed, but System Restore will not remove files, so you will not lose data.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_225_1.png)


    Above: Choosing a system restore point.


    +   1. Click Start, Programs, Accessories, System Tools, and then select System
    Restore.

    +   2. On the Welcome to System Restore page, check the Restore my computer to
    an earlier time button.


    > **Hot Tip**

    > Unfortunately, Android and iOS devices do not have a system repair and restore
    option, but you can do a factory reset to restore the device to its default settings,
    but you will lose all your data and files.


    +   3. Click Next, then choose a System Checkpoint on the calendar. Remember to
    choose a date before your computer started having issues.

    +   4. Click Next, read the warnings about saving data and closing programs, and
    then click Next to restore Windows to your chosen time.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_226_0.png)


    # # OS X TROUBLESHOOTING


    Mac computers have similar methods of repairing and restoring the operating system
    to Windows machines.


    # ## Disk Utility


    Disk Utility repairs and restores OS X systems, but you do need the installation
    disk to make use of it.


    +   1. Turn off the computer and insert the OS X installation disk.

    +   2. Hold down the C key to load the set-up program. Choose your language to
    continue.

    +   3. In the menu, select Disk Utility.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_226_1.png)


    Above: OS X Utilities include Disk Utility.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   4. Select the **First Aid** tab and check the disclosure triangle to display
    the names of your hard disk volumes.


    +   5. Select which volume you wish to check and click **Repair**. Disk Utility
    will check and repair the disk before rebooting your Mac.


    # Mac Safe Boot


    You can also boot up a Mac in safe mode to troubleshoot any issues.


    +   1. Turn on your Mac, and after you hear the start-up tone, press and hold
    the Shift key.


    +   2. Release the Shift key when you see the Apple logo and the progress indicator
    (looks like a spinning gear).


    +   3. The Mac will now boot up in safe mode.


    Below: Mac Safe Boot.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_227_0.png)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_227_1.png)'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# OS X Recovery


    In later versions of OS X, you can hold down Command R during start-up to run
    OS X Recovery. This is full of restore and repair utilities, such as Disk Utility.
    It also lets you erase your hard drive, reinstall a new version of OS X, or restore
    your Mac from a backup.


    # Time Machine


    Time Machine is the built-in backup feature of OS X that lets you restore your
    Mac to a previous time. You do need an external drive to use Time Machine, but
    it is worth the investment, because you can automatically back up your entire
    system, including system files, applications, preferences, email messages and
    all your documents and multimedia.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_228_0.png)


    Above: Time Machine makes it easy to back up your entire system.


    # WINDOWS REGISTRY REPAIR


    Common issues that affect Windows machines following a malware attack have to
    do with the system registry. The registry contains all the settings and configurations
    for the operating system, so when there is a problem in the registry, Windows
    can suffer from instability and crashes, but you may be able to rectify the situation
    by using one of a variety of registry tools.


    # Windows Registry Checker


    Whenever a Windows machine has successfully booted up, the Windows Registry Checker
    makes a backup copy of the system files and registry settings, which can be used
    to repair'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'registry entries. While Windows Registry Checker automatically scans the registry
    when a machine is booting up, if you have a registry issue and need to start in
    Safe Mode, you may need to manually run Registry Checker.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_229_0.png)


    Above: The Windows Registry Checker will automatically fix issues with the registry.


    +   1. Click Start, and then Run.


    +   2. In the box, type scanregw.exe, and then click OK to run Registry Checker,
    which will scan and automatically repair your registry.


    Hot Tip OS X, Android and iOS devices do not have system registries, so malware
    is less able to cause system errors and instability.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_229_1.png)


    Above: You can choose from multiple registry restore points.


    # Restoring Registry


    If after running Windows Registry Checker, you still have issues, it may because
    the backup file Windows is using is also corrupted. To fix this, you can restore
    from an earlier registry backup.


    +   1. Run the command prompt. In Windows 7/8, type cmd in the Start screen; in
    Windows XP, click Start, select Run, and then type cmd.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   2. Type scanregw.exe/restore.


    +   3. Restore from one of the five registry backup files listed.


    # Registry Tools


    As well as Windows Registry Checker, you can download and install a variety of
    registry cleaning and repair tools that may help get your registry back to a stable
    condition.


    +   - CCleaner (https://www.piriform.com/CCLEANER): A free registry-cleaning program
    that will fix invalid or corrupted entries.


    +   - Wise Registry Cleaner (http://www.wisecleaner.com/): Another free registry-repair
    tool that can be used on Windows 8, 7, Vista and XP.


    # Operating System Repair


    You can also repair your operating system by using your installation disc. In
    Mac OS X machines, this is done using Disk Utility (see pages 225–26) and selecting
    Repair Disk from the menu. In Windows, repairing the OS is done in a similar manner.


    +   1. Put your Windows disk into your drive and restart the computer.


    +   2. On the Install Windows screen, select language, time and keyboard, and
    then click Next.


    +   3. Select Repair Your Computer.


    +   4. In System Recovery Options, select Startup Repair and click Next.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_230_0.png)


    Above: The installation screen does differ on different versions of Windows, but
    there is always a repair option.'
  merge: -1
  img_proc: true
- pgno: 231
