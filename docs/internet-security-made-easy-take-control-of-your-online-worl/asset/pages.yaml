- pgno: 181
  md: "# MOBILE SECURITY\n\nThanks to smartphones, tablets and Wi-Fi access points,\
    \ we no longer need to be chained to our desks to access the Internet, but this\
    \ freedom comes with its own security risks.\n\n# MOBILE TECHNOLOGY\n\nOne of\
    \ the biggest security threats to mobile Internet technology when using such devices\
    \ as smartphones, tablets and laptops, is that they make tempting targets for\
    \ thieves. Furthermore, if you are on a long train journey and have been using\
    \ your mobile device, it is all too easy to leave it behind, and lost or stolen\
    \ smartphones, tablets and laptops can cause a security\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_181_0.png)\n\
    \n> ### Hot Tip\n> \n> Always keep an eye on your mobile device. It does not have\
    \ to be stolen for you to lose data. Hackers can slip a USB stick into an unattended\
    \ device to install malware that can steal data.\n\nLeft: Accessing the Internet\
    \ on the move gives us untold freedom, but this is not without its risks."
  merge: -1
  img_proc: true
- pgno: 182
  md: 'nightmare. Not only do these devices contain important files and documents,
    but they also may be packed full of private and personal information, including
    photographs, account numbers and passwords to our online accounts.


    # Theft Risk


    Smartphones, tablets and laptops are tempting targets for thieves. Because of
    their size, these mobile devices are easily snatched, and thieves find them easy
    to sell on the black market. For this reason, it is worth taking extra care when
    out and about with your mobile devices.


    +   Location: Before getting out your phone or tablet, take stock of your surroundings.
    Note who is about and whether it is safe to get your device out.


    +   Unattended: Never leave a mobile device unattended, even for a few seconds.
    A phone left on a table can be easily grabbed, and never leave a mobile device
    in a car.


    +   IMEI number: All smartphones and tablets have a 15-digit IMEI number, usually
    printed under the battery. Knowing this number enables your provider to block
    the device if it is lost or stolen (even if it has been given a new SIM).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_182_0.png)


    +   Back up: Make sure you have a backup of all your files and photos on your
    phone and tablet in case the worst does happen.


    > Right: The IME number is normally situated on a barcode or next to the serial
    number.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# PROTECTING YOUR DATA


    If your tablet, smartphone or laptop is lost or stolen, you not only have the
    expense of replacing the device, but you also run the risk of having all your
    personal data fall into the wrong hands. Mobile devices are used for all sorts
    of things these days, from social media to online banking and email. This means
    that your device may contain highly sensitive data, including account numbers,
    usernames and passwords.


    **Hot Tip**


    Remember when coming up with a password for your phone or tablet to choose a strong
    one that cannot be guessed by trial and error.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_183_0.png)


    # Password Protection


    One of the simplest ways of ensuring the data and information stored on your smartphone
    or tablet is secure is to take advantage of the password protection systems provided
    by the manufacturer. Most smartphones and tablets come with some sort of password
    lock, preventing any unauthorized user from gaining access to the device, and
    implementing it can be relatively straightforward, depending on the device in
    question.


    # Passcodes on iOS Devices


    On earlier Apple tablets and phones, you can only set a four-digit passcode. However,
    on iOS4 and later devices, you can set a full password, providing you with added
    security. The lock is activated when the phone has not been used for a set length
    of time, and means you have to enter it to unlock the phone.


    Left: If you fail to enter the correct password, most phones will lock for a minute
    or so.'
  merge: -1
  img_proc: true
