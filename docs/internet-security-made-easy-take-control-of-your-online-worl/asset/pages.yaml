- pgno: 75
  md: '# PREVENTION IS BETTER THAN CURE


    Before we look at what you can do if you think your identity has been stolen,
    it is worth looking at measures you can take to prevent identity fraud in the
    first place.


    +   Never: Reveal personal information over the Internet or email, such as your
    address, account numbers, phone numbers or passwords, even if you are sure of
    the person you are communicating with.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_75_0.png)


    +   Always: Keep your online passwords private. Remember to change them regularly
    and ensure they are as strong as possible.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_75_1.png)


    Above: Credit reference agencies can help you spot attempts at identity fraud.


    +   Statements: Make sure you shred any paper bills and statements. Do not simply
    throw them in the rubbish bin.


    +   Emails: If companies email you requesting personal information, insist they
    send the request by post (if they do not have your address, it is a sign they
    may not be who they say they are).'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # HELP, MY IDENTITY HAS BEEN STOLEN!


    If you suspect your identity has been stolen, it is important to act promptly
    in order to minimize the impact of the theft. If you spot any of the symptoms
    of identity fraud, follow these steps.


    +   1. Contact your bank, building society or credit card company and explain
    your fears immediately. Ask for advice on freezing your account, getting replacement
    cards and changing passwords and PINs.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_76_0.png)


    +   2. Contact the police. Identity theft is a crime and you may be able to recoup
    some or all of your losses if you report it and get a crime reference number.


    Above: Report identity theft as soon as you suspect it.


    +   3. Contact credit reference agencies, such as Experian and Equifax, and ask
    for advice on getting your credit rating repaired, as it may have been damaged
    by the identity fraudsters.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_76_1.png)


    +   4. If you suspect your online accounts have been compromised, contact the
    companies concerned. Change passwords and other information that you use to log
    on.


    Above: Change your password.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# # HACKING


    Hacking can affect people in different ways. Websites, personal computers and
    online accounts can all be hacked. Even some of the largest companies in the world
    fall foul of hackers, so what exactly can you do about it?


    # ## UNDERSTANDING HACKING


    We discussed earlier the reasons people hack into computers, but it is worth looking
    at who is at risk, how to avoid being hacked in the first place and what you can
    do if you have been hacked.


    # ### What Can Be Hacked


    When people think of computer hacking, they normally think of illicit computer
    experts breaking into government networks. However, hacking is quite a broad term
    and can describe a number of different methods of unauthorized computer use.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_77_0.png)


    Above: Hackers can take over your online accounts and computers.


    +   - Network hacks: Attacking entire computer networks is normally done by protesters,
    organized hacking groups and criminal gangs.


    +   - Personal computer hacking: People gain access to personal computers to steal
    data or use them as part of a botnet.


    +   - Account hacking: Perhaps the most common and simplest form of hacking is
    gaining access to somebody else''s online account.'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# NETWORK HACKING\n\nThe most sophisticated form of hacking is when people\
    \ break into high-profile computer networks, such as governmental organizations\
    \ or big companies. The way hackers do this varies, from using highly sophisticated\
    \ programming, software and equipment, to far simpler methods.\n\n+   • Vulnerabilities:\
    \ Exploiting holes in system security systems, such as outdated network log-in\
    \ protocols.\n\n+   • Human weakness: Taking advantage of bad security practices,\
    \ such as users who have weak passwords.\n\n+   • Botnet attacks: Using thousands\
    \ of machines to bombard a network with attempts at access.\n\n> **Did You Know?**\n\
    > \n> In 2008, a USB flash drive was found in a car park outside a Department\
    \ of Defense building. When a curious employee found it and plugged it into a\
    \ computer, it granted hackers access to the entire network.\n\n# GETTING YOU\
    \ TO DO THE DIRTY WORK\n\nOne of the most common reasons people hack into personal\
    \ computers is to take it over or make it part of a botnet so it can be used to\
    \ do further hacking activities or distribute spam or malware.\n\nRight: Be wary\
    \ of using other people's flash drives or removable media.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_78_0.png)"
  merge: -1
  img_proc: true
- pgno: 79
  md: '# DDoS Attacks


    The simplest way hackers can attack a network server is by employing a Distributed
    Denial of Service attack (DDoS). This involves getting thousands or even millions
    of machines to access a server or website simultaneously, which causes an overload
    and prevents regular access. Because the requests are made from thousands of different
    machines, all from different locations with individual IP addresses, DDoS attacks
    are difficult to fix because system administrators cannot tell which computers
    are legitimate and which form part of the DDoS attack.


    # Zombie Computer


    When a hacker or piece of malware has compromised a computer, it is referred to
    as a ‘zombie computer’. This is because users are normally unaware their computer
    is being used for nefarious purposes.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_79_0.png)


    Above: DDoS attacks cause websites to become unavailable.


    # Symptoms of a Zombie Computer


    While hard to detect, having a PC turned into zombie computer does have some tell-tale
    signs. Trojans and bots will use your system resources, such as processor and
    Internet connection, slowing things down.


    # Common Symptoms of a Hacked Computer


    +   - Computer fan: If your computer fan runs excessively when your computer is
    idle, it could be a sign that a malicious program is running (or a sign that your
    computer needs cleaning!).


    +   - Shut down: If your computer takes longer than normal to shut down or will
    not shut down properly, it could be because of malicious programs.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_80_0.png)


    +   Programs: Slow programs and regular screen freezes can be caused by bots and
    Trojans running in the background.


    +   Updates: Some programs installed by hackers prevent you from updating operating
    systems and antivirus, as these can spot and remove the malicious code.


    +   Internet connection: If your computer is part of a botnet, it may be using
    your Internet connection, slowing other Internet use down.


    # System Resources


    One of the best ways to identify that you have been hacked is to keep an eye on
    your system resources and see what processes are running or how much network access
    is being used.'
  merge: -1
  img_proc: true
- pgno: 81
  md: "# Using Windows Task Manager\n\nIn Windows systems, you can access information\
    \ about your system resources by using the Task Manager.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_81_0.png)\n\
    \nAbove: Windows Task Manager processes.\n\n+   1. Close all programs and press\
    \ Ctrl, Alt, Delete together.\n\n+   2. In early Windows systems, such as XP,\
    \ the Task Manager will pop straight up. In later versions of Windows (Windows\
    \ 7 and Windows 8), you have to select it from a menu.\n\n+   3. Click on the\
    \ Processes tab to see what is running in the background. Look for cryptic names\
    \ that could be malicious programs, and click on Mem Usage to see what is using\
    \ the most resources.\n\n+   4. Use the Networking tab to see if anything is accessing\
    \ the Internet (if you are not using your connection, Network Utilization should\
    \ be 0%).\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_81_1.png)\n\nAbove: Look\
    \ for spikes in network usage.\n\n> Hot Tip\n> \n> If you don't recognize the\
    \ description of a process in the Task Manager, use Google or another search engine\
    \ to find out what it does."
  merge: -1
  img_proc: true
- pgno: 82
  md: "# # Hot Tip\n\nDon't turn off or force quit processes you don't recognize,\
    \ as it can make your computer unstable and could lead to data loss and system\
    \ crashes.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_82_0.png)\n\nAbove: Use\
    \ a search engine to help you identify the different processes in your Task Manager.\n\
    \n# Using Activity Monitor\n\nTo check system resources on an OS X machine you\
