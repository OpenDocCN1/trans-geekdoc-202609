- pgno: 24
  md: '# # THE ATTACKS BEGIN


    While the web has hugely expanded our opportunities, it has also made us vulnerable.
    Since the very start of the World Wide Web, users with malicious motives began
    to take advantage of it.


    # ## BRAVE NEW WORLD


    Tim Berners-Lee''s vision for the World Wide Web was a system that would bring
    the world closer together, enabling free access to information and the exchange
    of ideas. This concept meant that very little thought was given to security, and
    in the very early days of the web, when there were just a few users, the need
    to protect information and data did not arise. However, that was soon to change.


    # ### The Threat


    It didn''t take long before malicious users threatened the basic ideals of the
    web by taking advantage of the ever-increasing number of users. Computer viruses,
    hackers and people seeing the Web as an opportunity to commit crime have meant
    that security became an ever-increasing concern for Internet users.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_24_0.png)


    Above: The web was designed without much thought given to Internet security.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# HACKING


    Gaining unauthorized access to a computer or the data that it holds is known as
    hacking. However, computer hacking predates both the World Wide Web and the Internet.
    In fact, the first hackers had nothing to do with computers at all.


    # The First Computer Hackers


    The first hackers appeared in the 1960s and 1970s. During this time, the most
    rapidly developing technology was in telecommunications, and a practice developed
    in America where by people would try to bypass telecoms systems in an attempt
    to get free phone calls – a practice that became known as ‘phreaking’. When computers
    gained popularity in the late 1970s and early 1980s, many of the people who had
    been involved in phreaking began to take an interest in this emerging technology
    and started to gain unauthorized access to computer systems, often just for the
    fun of it.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_25_0.png)


    Above: John Thomas Draper. one of the most famous figures in the computer-hacking
    fraternity.


    # Did You Know?


    Former phone phreaker and computer programmer John Thomas Draper, known as Captain
    Crunch, gained notoriety in the 1970s following several high-profile arrests,
    and is considered by many to be the father of the modern-day computer hacker.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Legislation


    Until 1986, no specific law governed unlawful access to computers. However, following
    several high-profile hacks, the US became the first country to outlaw the practice
    when Congress passed the Computer, Fraud and Abuse Act.


    # # MALWARE


    People soon realized that hacking into a computer was not the only way to gain
    unauthorized access or cause chaos. Hackers soon discovered they could use tiny
    software programs to infect a computer and cause its systems to crash.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_26_0.png)


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_26_1.png)


    # # Computer Viruses


    The term ''computer virus'' was first coined in 1984, when computer scientist
    Fred Cohen wrote a paper warning of the potential of these infectious programs,
    which could replicate and spread through networks, just as biological viruses
    do in living hosts. Early viruses were usually hidden in legitimate programs and
    spread by removable media such as floppy disks, the precursor to CDs and memory
    sticks.


    Left: Early computer viruses were spread by floppy disks.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'However, the rise of the World Wide Web meant there was soon a much easier
    way to spread a computer virus from machine to machine.


    # # ONLINE CON ARTISTS


    Along with computer viruses and computer hackers, another threat soon surfaced
    on the World Wide Web – online fraud. When more and more people started gaining
    access to the Internet, it became possible for fraudsters to target thousands
    of people at once.


    # ## 419 Scams


    One of the earliest and still most common computer frauds is known as the 419
    scam. This originated in Nigeria and is named after the Nigerian criminal code
    that deals with fraud. There are many variants of the 419 scam, but they usually
    involve somebody posing as a high-ranking official, such as a prince or general
    needing to transfer a large sum of money out of the country. The fraudster often
    offers an inordinately large sum of money to victims if they agree to let the
    fraudster use their bank account for the transfer, and once the fraudster has
    hold of the victim''s bank details, they can plunder their account.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_27_0.png)


    Above: Another variant of the 419 scam is sending an email that claims you have
    won a large sum of money in a lottery but you need to hand over your bank details
    to claim the prize.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_27_1.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# THE DEFENCES


    As computer viruses, hacking and online fraud became more common, people came
    up with different methods to defend computers and keep data safe. Many of these
    systems predate the World Wide Web, but the popularity of the Internet has meant
    these methods to neutralize security threats took on new importance.


    +   **Firewall:** Named after the fireproof barrier that protects connected properties
    in the event of a fire, a firewall blocks access to a system and only lets through
    data that adheres to specific criteria.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_28_0.png)


    Above: Antivirus software such as McAfee has become a necessity for keeping out
    computer viruses.


    +   **Antivirus:** As computer viruses became more prominent, developers created
    programs to clean infected systems, known as antivirus software.


    +   **Encryption:** To prevent unauthorized access to data as it travels around
    the Internet, encryption was developed to make the data difficult to read or decode
    without a decryption key.


    +   **Spam filters:** Used to identify unsolicited emails and those from fraudsters.


    # The Arms Race


    Ever since hacking and computer viruses emerged, a battle has been raging between
    the hackers and those trying to stop them infiltrating computer systems. As the
    sophistication of security measures increases, so does the sophistication of the
    hackers attempting to break into the systems.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # CYBER ATTACKS


    The malicious use of computers is known as cyber crime. It can range from criminals
    wanting to steal an individual''s personal information to State-sponsored cyber
    attacks, where a nation targets another country''s computer systems either to
    steal information or cause chaos.


    # ## Cost


    Because of the prevalence of cyber crime, the global Internet security industry
    is worth an estimated £70 billion, yet it is estimated that cyber attacks cost
    the global economy many times more than that.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_29_0.png)


    Above: Cyber crime costs the global economy hundreds of billions of pounds.


    # # STAYING SAFE


    For the average individual, there is little to fear from State-sponsored cyber
    attacks, but it is still important to protect yourself from cyber crime. In the
    next section, we will explore the various security threats and the consequences
    of poor Internet security.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# THE RISKS


    We will explore online threats in more detail in the next chapter, but in order
    to understand the importance of Internet security, we will take a quick look at
    some of the most common threats and the dangers they pose.


    # INTERNET DEPENDENCE


    As the World Wide Web has evolved, many of us have become ever more dependent
    on the virtual world. We now rely on the Internet for all sorts of things, from
    financial transactions and online banking, to communicating with friends and colleagues.
    If our computers, smartphones or tablets become compromised, the results can be
    catastrophic, especially if important information, such as your online bank details,
    fall into the wrong hands.


    > Did You Know?

    > ''Computer virus'' is often used as a broad term to describe all types of malware,
    and most antivirus software is designed to remove not just viruses but also other
    malware threats.


    # Protecting Yourself


    Because of this dependence on the World Wide Web, Internet security is now crucial
    to protect us from the array of online threats that lurk in the virtual world.
    But before you can arm yourself, it is a good idea to know just what is out there.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_30_0.png)


    Above: To ensure safe online banking is just one of the reasons why you need Internet
    security.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_31_0.png)


    # MALWARE


    Malware describes a whole gamut of malicious programs designed to compromise computers,
    steal data or hijack your machine. Malware is simply a contraction of malicious
    software. We will look at malware in more detail in the next chapter, but for
    now, it is worth understanding the different types that are out there.


    # Computer Virus


    This is a form of malware that is able to replicate itself and spread from machine
    to machine by attaching itself to a legitimate program, which, when launched,
    releases the virus.


    # Trojan Horse


    A malicious program disguised as a normal or innocent file. Once the file is opened,
    the Trojan is activated and can be used to gain remote access to your computer.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_31_1.png)


    Above: Trojans are often sent in email attachments.


    # Worms


    A computer virus that replicates itself over a network. Worms can spread independently,
    without the need for a user to open a file or run a program.


    # Spyware


    Designed to spy on your computer, once activated, spyware can monitor your keystrokes,
    steal passwords and steal data from your hard drive.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Adware


    Designed to bombard you with advertisements, adware normally infects an Internet
    browser and can assail you with annoying pop-ups – extra windows that appear on
    your screen – that prevent you from browsing normally.


    # Bot


    A software program designed to do a specific task. Bots can work silently together
    on thousands of machines, unbeknown to the users, and attack websites and other
    computer systems (this connecting of bots is known as a botnet).


    # Ransomware


    Holds a computer for ransom by seizing control and preventing normal access until
    the user pays to have the malware removed.


    # Rootkit


    Malware designed to hide on a machine and be undetectable by security systems
    and users, often by taking advantage of vulnerabilities in software systems.


    # Pharming


    These can change bookmarks and other files in your Internet browser and take you
    to a bogus or scam site.


    # Spam


    Unsolicited messages, usually sent by email, which can clog up inboxes.


    # Scareware


    These are usually designed to scare users into paying for an unnecessary product
    by claiming a virus has infected the computer.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_32_0.png)


    Above: Scareware can pretend to be authentic messages from your operating system.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# HACKING


    As discussed earlier in this chapter, hacking is the unauthorized access of a
    computer, network or online account. Hacking is done for a multitude of reasons,
    some more nefarious than others.


    +   Challenge: Some hackers just enjoy the challenge of beating security systems;
    often these hackers will infiltrate high-profile networks.


    +   Criminality: Hackers often target machines to steal data, obtain personal
    information, steal money or cause disruption.


    +   Ethical hacking: A legal form of hacking, where somebody is hired to hack
    into a system to check system security.


    Hot Tip

    Even the most secure and expensive computer networks can be hacked, so there is
    no guaranteed way of keeping hackers out. But you can make life much more difficult
    for them by taking proper Internet security precautions.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_33_0.png)


    Above: Hacking predates the World Wide Web and remains a huge problem.


    # Methods of Hacking


    The problem with trying to prevent hacking is that hackers utilize a myriad of
    techniques to gain access to a computer system or to hack people''s online accounts.
    These include taking advantage of system vulnerabilities, the sophisticated use
    of malware and ''phishing'' techniques (for more information about hacking and
    what you can do about it, see pages 76–89.)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# PHISHING


    One of the simplest ways of gaining access to a computer or to someone’s online
    account is to fool people into handing over their login details, such as a password
    or username. This is known as ‘phishing’. One of the most common methods of phishing
    is to send an email that appears to come from a legitimate source, such as a bank
    or social media account. These emails provide a link to log in and prompt victims
    to do so, usually by suggesting there is a problem with their account. However,
    these links often take you to a fake site (known as a ‘spoof’ site) that looks
    like the real thing but is designed to get hold of login details.


    # IDENTITY THEFT


    Because we live so much of our lives online, it can be very easy for somebody
    to pose as us if they have the right personal information. This is known as identity
    theft. Whether it is by hacking, phishing or malware, if somebody gets enough
    personal information about you, they can open up bank accounts, obtain credit
    and commit criminal offences, all in your name (we will look at identity theft
    in more detail on pages 67–75).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_34_0.png)


    Above: A phishing email claiming to be from Twitter, prompting the account holder
    to log in:


    # OTHER THREATS


    Malware, hackers and fraudsters are not the only threats posed by the online world.
    Proper Internet security can also help you guard against:


    +   Harassment/Bullying: Taking part in online forums or using social media can
    mean you can come into contact with people intent on bullying, harassing or threatening
    you, a practice known as ‘trolling’.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - Wireless piggybacking: With so many Internet connections now wireless,
    it is possible for somebody to use your connection without you knowing it; they
    may even be downloading illegal files or hacking.


    +   - Offensive content: There may be lost of Web content that you may not want
    see or want your children to see, such as pornographic or violent websites.


    # Hot Tip


    Make sure everybody in your family is aware of Internet security threats. Check
    that they know not to download files they are uncertain about or hand over passwords
    or other personal information.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_35_0.png)


    Above: Internet security can help keep your children safe.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# # CONSEQUENCES OF POOR INTERNET SECURITY


    Failing to protect ourselves from online threats can result in all sorts of consequences,
    ranging from minor inconveniences to serious financial traumas.


    +   - **System failure:** Malware can cause systems to run slowly, crash and even
    cause permanent damage to a computer.


    +   - **Internet problems:** You may find you lose your Internet connection because
    of a security issue, or your connection speed may slow down, or you may be unable
    to access certain web pages.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_36_0.png)


    +   - **Data loss:** Hackers and malware may not only steal and copy your personal
    data and files, but they could also cause it to be permanently erased.


    Above: System errors can often be a sign of malware.


    +   - **Financial loss:** If somebody gains access to financial websites, such
    as your bank account, you could lose money.


    +   - **Identity fraud:** If someone uses your personal information, you may become
    liable for loans and other financial obligations taken out under your name.


    +   - **Infection:** If you have poor Internet security, you may pass viruses
    and other malware on to friends, relatives and co-workers.


    +   - **Privacy:** Poor Internet security means people may be able to access your
    social media accounts, photos stored on your hard drive and other personal data.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# AUTHENTICATING IDENTITY


    The first line of defence in Internet security is the various methods employed
    by websites and service providers to help you prove who you are. In this section,
    we will look at the different ways websites can authenticate your identity.


    # IT''S ME, HONEST!


    Before the World Wide Web, if you wanted to withdraw money from your account,
    pay for something using a chequebook, or access some personal information, it
    would normally involve you handing over some type of identification, such as a
    driving licence or banker''s card, and then providing a signature. In the online
    world, these methods of proving identity are not practical, so other forms of
    identity authentication are needed.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_37_0.png)


    Left: Online banks will often log you off after a certain amount of time of inactivity.


    # Did You Know?


    Many secure websites will time out after a set amount of time of inactivity. This
    is in case you have left your computer unattended and forgotten to log off. Once
    timed out, you have to log in again to resume using the website.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # ONLINE IDENTIFICATION


    There are three stages to online identification that most websites and computers
    commonly use in order to authenticate you are who you say are.


    +   - **Identifier**: To begin the process of identification and help the computer
    or website identify you, some form of identifier is required. This is often a
    username or email address.


    +   - **Authentication**: This is a system designed for you to be able to prove
    you are who you say you are. The most common authenticators are passwords or PIN
    numbers (personal identification number).


    +   - **Authorization**: If you have successfully entered your password or PIN,
    the system grants authorization for you to enter the website by logging you in.


    # ## Email Validation


    Many online services, such as social media sites, require you to have a valid
    email address before you sign up. This email address is used as part of the identification
    process. In order to gain access to your account, you may first have to validate
    that you own the email address attached to it. This is usually done by clicking
    a link sent in an email to the address stipulated.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_38_0.png)


    # ## Username


    The most common identifier used by websites and computers is the username. Usernames
    have to be unique. Some websites use an email address as a username, others ask
    you to create one, and some will create one for you.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Passwords


    Passwords are by far the most common authenticators used by websites and computers.
    Most passwords are six to twelve digits long and use both letters and numbers.
    When you enter a password, it is normally obscured, for example appearing on screen
    as asterisks (*), to prevent anybody looking over your shoulder and seeing it.


    # Hot Tip


    Most websites requiring a username and password have a check box for remembering
    your login details. Make sure you do not tick it if you are using a public or
    shared computer to prevent somebody else logging in using your details.


    # AUTHENTICATION OVERLOAD


    Because of the sheer number of websites, online accounts and social media platforms
    people sign up to these days, it can be nigh-on impossible to memorize every single
    password and username combination. For this reason, some people use the same password
    for all their accounts. However, this is very bad practice, because if one account
    is compromised, the same details can be used to hack into all the others.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_39_0.png)


    Left: Entering a username and password to access a bank account. Note the check
    box to remember the details.


    # Cookies


    Websites store your account details in little files on your computers known as
    cookies. This enables a computer to add further verification that you are who
    you say you are, as well as allowing your Internet browser to remember your username
    and password for you.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_40_0.png)


    # # OTHER ONLINE SECURITY MEASURES


    As well as username and passwords, websites deploy a host of other security measures
    to help with the authentication process.


    +   o **Memorable information**: When you sign up to a website or service, you
    may be asked to provide some memorable information such as your first school or
    mother’s maiden name.


    +   o **IP address**: Some websites restrict you to logging in on specific computers
    and won’t allow access if your IP (Internet Protocol) address, the unique identifier
    of your computer, is different to the one registered to your account.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   PIN: Personal Identification Numbers are often used in conjunction with
    passwords on secure sites.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_41_0.png)


    Above: Entering memorable information to log into a bank account.


    # Password Lock


    Many password systems, especially on secure servers, will lock you out if you
    enter the incorrect password several times (usually three times). This is to stop
    people attempting to guess a password or to prevent software bots from running
    through every possible password combination to hack into a system. If you are
    locked out of an account, you may have to contact the administrators before you
    can log back in.


    Hot Tip

    In the next section, we will explore how to create strong passwords as well as
    provide you with some tips for remembering them.


    # CAPTCHA Codes


    Another system designed to ensure a user is a human being and not a software bot
    is the use of CAPTCHA codes (Completely Automated Public Turing Test; a Turing
    test is something designed to tell the difference between people and machines).
    Usually, these are visuals of letters and numbers, which have to be read and correctly
    entered.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_41_1.png)


    Right: Entering a CAPTCHA code.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # PASSWORD ADVICE


    Passwords are your virtual key for gaining access to your online accounts. However,
    as with other types of keys, you have to make sure they do not fall into the wrong
    hands, which means ensuring your passwords are secret, safe and secure.


    # ## SETTING A PASSWORD


    Most websites that require you to create a password insist on at least eight letters
    or digits. The longer the password, the more secure it is, but the harder it is
    to remember.


    # ### Strong Passwords


    Passwords should be strong. A strong password is one that cannot be guessed by
    somebody else. The strongest type of password contains letters (both upper and
    lower case) and numbers, and in some cases symbols (although these are not always
    permitted).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_42_0.png)


    Above: Creating usernames and passwords on Twitter.


    # ## CREATING A STRONG PASSWORD


    The problem with passwords is that you have to remember them. Random letters and
    numbers may


    # ## Hot Tip


    Never use personal information in your usernames or passwords, such as telephone
    numbers or dates of birth, as this information is not only easy to guess but can
    also be used to compromise other online accounts.'
  merge: -1
  img_proc: true
