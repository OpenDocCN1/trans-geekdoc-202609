- pgno: 191
  md: '# SECURING A LAPTOP


    Because of the size of laptop hard drives and the different architecture used,
    something like remote wipe is not feasible for preventing access to a lost or
    stolen laptop. It would take too long to erase and would be ineffective if the
    laptop was not connected to the Internet, which could be too late to prevent the
    unauthorized copying of your data. However, there are other methods of preventing
    your files, folders and data from falling into the wrong hands.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_191_0.png)


    Above: All versions of Windows allow for the use of log in passwords.


    # Passwords


    One of the first methods of ensuring your data is secure on a laptop is to set
    up a user account password. You do this in the same way as you set up a password
    on a desktop machine.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_191_1.png)


    Above: Selecting User Accounts.


    # Windows Passwords


    Different versions of Windows have slightly different methods of setting up passwords,
    but generally speaking, the following steps should give you a guide to the process.


    +   1. Go into the Control Panel.

    +   2. Select User Accounts, and select the account you want to password protect.

    +   3. Select Create a password.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '+   4. You will be asked to enter the new password twice, as well as a word
    or phrase to be used as a password hint.


    +   5. Click Create password. The next time you boot up your computer, you will
    have to enter the password to gain access to your files and documents.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_192_0.png)


    Above: New password screen.


    # OS X Passwords


    Different versions of OS X also vary in their password set-up procedures, but
    the following steps should give you an idea of how to do it. Note you have to
    be set up as an administrator to set passwords.


    +   1. In the Apple menu, select System Preferences, and then click Users & Groups.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_192_1.png)


    +   2. Click the lock icon and type in an administrator name and password, and
    then click Unlock.


    +   3. Select the user you want, then the Password tab and then Change Password,
    or click Login Options to set various login options.


    Above: You can set a password as well as a security question or hint.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Hard Drive Encryption


    To prevent the unauthorized copying and sending of your documents, files and folders,
    you can encrypt your laptop''s hard drive. For modern versions of Windows, such
    as Windows 7 and Windows 8, you can use Bitlocker to encrypt your entire hard
    drive. For more information on using Bitlocker, see page 177. Later versions of
    Apple OS X also have an encryption facility called FileVault, which you can turn
    on in the Security & Privacy section in System Preferences.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_193_0.png)


    Above: Bitlocker in Windows 8.


    # OTHER SECURITY MEASURES


    You can download all sorts of apps and programs to help secure your smartphone,
    tablet or laptop.


    +   - **Mobile Defense (https://www.mobiledefense.com/):** An app available for
    Android phones that lets you remotely connect to your device, track its location
    and even remotely wipe data.

    +   - **Prey (https://preyproject.com/):** Designed for tracking and monitoring
    laptops and mobiles., you can even use it to activate the webcam on a laptop to
    take pictures of the thief.

    +   - **EXO5 (http://www.exo5.com/):** A business package designed to secure data
    on laptops by encrypting it as well as providing tracking information.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_193_1.png)


    Above: Turning on FileVault in OS X.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# WIRELESS AND BLUETOOTH SECURITY


    With mobile devices, you can connect to the internet anywhere and everywhere.
    However, this freedom comes with its own security risks, so it is important to
    know how to stay safe when using Wi-Fi, Bluetooth and public networks.


    # ACCESS ON THE GO


    When the World Wide Web first emerged, the only way to access it was through a
    telephone wire. These days, there are various ways of getting online using a smartphone,
    laptop or tablet computer.


    +   WAP: Wireless Application Protocol is used by some mobile phones to download
    simplified web pages because they require less data than regular websites.


    +   GPRS: Either 2nd, 3rd or 4th generation (2G, 3G or 4G) General Packet Radio
    Service (GPRS) allows smartphones and tablets to connect to the Internet, download
    web pages or transfer data using mobile phone signals.


    +   Wi-Fi: You can also connect to the Internet using a wireless local area network.
    This can be your broadband connection at home or a public network.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_194_0.png)


    Above: In locations that offer Wi-Fi access, you will usually see this symbol.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Hot Tip


    Regardless of how you connect a mobile device to the Internet, always take basic
    security precautions, such as using HTTPS protocol when accessing email and banking
    services.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_195_0.png)


    # GPRS SECURITY


    The radio signals that allow data transfer on mobile devices are pretty secure.
    Mobile telecoms companies use very sophisticated firewalls and encryption technology,
    which make unauthorized access extremely difficult.


    # WIRELESS ACCESS


    The big downside to using GPRS data services is that mobile operators charge us
    for the data we download. However, if you are at home or in a location that has
    a public accessible network, you can access the Internet over Wi-Fi, which does
    not cost you anything for data transfer. However, unlike GPRS, Wi-Fi access does
    present some possible security issues.


    # What Is Wi-Fi?


    Wi-Fi is simply the term used to describe wireless networking. Rather than plugging
    a laptop, smartphone or tablet into a broadband connection using a cable, Wi-Fi
    allows you to connect to the Internet using a localized radio signal.


    # Wireless Router


    In order to connect wirelessly, you need access to a wireless router, which is
    plugged into a broadband connection and a wireless accessible device. Most smartphones,
    laptops and tablets now have in-built wireless adapters that allow you to connect
    to a wireless network.


    # Hot Tip


    If your laptop does not have an in-built wireless adapter, you can use an external
    wireless adapter that plugs into the USB port, or a wireless card that can be
    installed inside the laptop.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# WIRELESS SECURITY


    As mentioned, while Wi-Fi offers us the freedom to connect to the Internet in
    all sorts of locations and download data at no cost, it does pose some security
    risks.


    +   - **Device access:** Having Wi-Fi enabled on your device not only enables
    you to send data from your device, but also allows data to enter your device.

    +   - **Hacking:** An unsecured wireless network could lead to somebody eavesdropping
    on the information you are sending and receiving.

    +   - **Wi-Fi hotspots:** Anybody can set up a wireless hotspot, so you need to
    ensure you are on a trusted network.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_196_0.png)


    Above: Wi-Fi hotspots are commonly found In cafés, pubs, airports and hotels.


    # Enabling Wi-Fi Access


    In order to gain access to Wi-Fi, you normally have to enable Wi-Fi on the device.
    In order to keep your device secure, it is always a good idea to disable Wi-Fi
    when you are not using it. This will stop anybody connecting to your device without
    your knowledge (it will also prolong your battery life). Some devices such as
    mobile phones are often set up automatically to connect to wireless networks when
    they are in range, so it is worth browsing through your device''s settings to
    disable this function.


    # Wi-Fi Hotspots


    Wireless hotspots pose the biggest security risks when it comes to Wi-Fi, as it
    is difficult to know how secure the network is and whether the providers have
    any encryption in place to prevent'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'hackers from eavesdropping on your data transfers. Most well-known wireless
    hotspot providers, such as coffee shop chains or hotels, provide information explaining
    their security protocols, so it is best to avoid hotspots from companies that
    cannot provide this information.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_197_0.png)


    Above: You can disable Wi-Fi access in your network settings.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_197_1.png)


    Above: A wireless connection with encryption will have a padlock symbol on it.


    # # Wi-Fi Connection Security


    Wi-Fi networks can be secured in a number of ways.


    +   - **Wired Equivalency Privacy (WEP)**: This is a form of encryption that ensures
    that any data you send or receive cannot be accessed by an unauthorized user.
    To access a WEP network, you will need to know the password, known as a WEP key.


    +   - **Wi-Fi Protected Access (WPA and WPA2)**: A newer and improved form of
    encryption compared to WEP, which is installed on some Windows machines.


    +   - **Media Access Control (MAC)**: Only allows devices approved by an administrator
    to connect to a wireless network.


    # ## Virtual Private Network (VPN)


    No matter what the security employed by a public accessible network, you can never
    be too sure of who is listening in, as hackers can use a wide variety of tools
    and programs to'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_198_0.png)


    connect to the same network and eavesdrop on your data. For this reason, many
    businesses employ virtual private networks (VPNs) that encrypt all local web pages
    so that only authorized devices can access them.


    # Wi-Fi Privacy Tools


    You can minimize the risk of using Wi-Fi hotspots by using a wide selection of
    privacy software.


    +   o CyberGhost VPN (http://www.cyberghostvpn.com/): Allows you to set up your


    **Hot Tip**


    Be wary of ‘evil twin’ attacks, where hackers set up wireless hotspots (sometimes
    posing as reputable companies) so they access your passwords, login details and
    other information after you connect to their network.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'own virtual private network every time you access the Internet and connects
    you to anonymous Internet servers.


    +   HTTPS Everywhere (https://www.eff.org/https-everywhere/): A plug-in for Firefox,
    Opera and Chrome Internet browsers that encrypts information from certain websites,
    such as Facebook, Twitter and Paypal.


    +   Hotspot Shield (http://www.hotspotshield.com/): Encrypts all your data every
    time you connect to the Internet.


    # Home Wi-Fi Security


    Wi-Fi hotspots are not the only risk when using Wi-Fi on a mobile device. If you
    have Wi-Fi access at home, it is important to secure your network by employing
    the same encryption methods mentioned on page 196.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_199_0.png)


    Above: Services like HTTPS Everywhere make using public Wi-Fi hotspots more secure.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# # BLUETOOTH SECURITY


    Bluetooth is a similar technology to Wi-Fi. However, while Wi-Fi is mainly used
    as an access point to the Internet, Bluetooth is often used to connect devices
    together. Bluetooth enables speedy communication between different mobile devices,
    as well as allowing you to use wireless equipment such as headphones, microphones
    and hands-free systems. As with Wi-Fi, Bluetooth also comes with some security
    risks.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_200_0.png)


    Above: Bluetooth-enabled devices will have this symbol on them.


    # ## How Bluetooth Works


    Bluetooth uses radio signals to connect devices. This enables you to swap files
    with other Bluetooth users and connect devices to your smartphone. There are two
    steps to connecting a Bluetooth device.


    +   - **Discoverability:** Devices have to find other Bluetooth devices within
    range. This is known as discoverability.


    +   - **Pairing:** When two devices have discovered each other, they can be connected,
    know as pairing.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_200_1.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Connecting Devices


    Normally, a user has to accept a pairing to his or her device. Some Bluetooth
    devices allow you to use PINs and passwords to prevent the unauthorized pairing
    of devices.


    # Securing Your Bluetooth Devices


    Because Bluetooth tends to work at short ranges (about 10 metres), most people
    think they do not pose much of a security risk. However, hackers have found ways
    to access Bluetooth devices, allowing them to steal data, listen in on conversations
    and even make calls. There are steps you can take to prevent this.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_201_0.png)


    +   1. Set your Bluetooth devices to non-discoverable mode by default, which will
    prevent hackers from finding your device.


    +   2. Never accept an unknown request to pair with your Bluetooth device.


    +   3. Turn Bluetooth off when you are not using it.


    Above: Turn Bluetooth off when you are not using it.


    +   4. Avoid using Bluetooth in crowded locations. Because Bluetooth requires
    users to be fairly close to one another, you are at greater risk of being hacked
    the more people there are around.


    +   5. When exchanging data with somebody else, always request PIN and passwords
    to prevent a third party from hooking up.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# MOBILE ANTIVIRUS, HACKING AND APP SECURITY


    Desktop PCs are not the only devices that require antivirus software these days.
    Smartphones and tablets are equally at risk from malware and hackers, and many
    of these threats come from the apps we download and install.


    # THE RISE OF THE SMARTPHONE


    Viruses on smartphones and tablets were unheard of a few years ago, but as the
    technology has become ubiquitous, malicious programmers and hackers have seen
    the potential that infecting these devices offers. After all, tablets and smartphones
    are just as capable as our desktops and laptops of accessing the Internet and
    running programs, so we store an awful lot of personal data on them, as well as
    using them to access sensitive websites such as online banks.


    # Mobile Architecture


    Before we look at the malware threats and how you can prevent them, it is worth
    spending a moment to understand how smartphones and tablets work. Essentially,
    a tablet computer and smartphone use the same architecture. In other words, the
    operating system used on the latest iPhone is the same as the one used on the
    latest iPad.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_202_0.png)


    Above: Tablet operating systems differ to those on laptops and PCs.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Mobile OS


    There are numerous smartphone and tablet operating systems around, but the three
    most popular are:


    +   - iOS: Installed on Apple iPhones and iPads. Apple tend to bring out a newer
    version of their operating system whenever they release a new device.

    +   - Android: An operating system created by Google that runs on various manufacturers''
    tablets and smartphones.

    +   - Windows Mobile/Phone: Microsoft also produce operating systems for mobile
    devices; the first was Windows Mobile, then Windows Phone and now Windows 8.


    > **Hot Tip**

    > If you have a smartphone but want to buy a tablet, it will make your life easier
    to choose one that runs the same operating system, as it will allow greater interaction
    between the two devices.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_203_0.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# APPS


    The main difference between regular PCs and mobile devices such as smartphones
    and tablets is how they run programs. On mobile devices they are known as apps
    (short for applications), which are more self-contained than PC programs and are
    usually designed for just one specific task.


    # Installing Apps


    Depending on your mobile operating system, apps are downloaded and installed from
    app stores.


    +   Google Play (https://play.google.com/): Android apps are downloaded and installed
    from Google Play.


    +   App Store (https://itunes.apple.com/): iOS users need to sign up to iTunes
    before they can download and install apps.


    +   Windows (http://windows.microsoft.com/): Has various app stores depending
    on the OS version.


    +   Amazon (http://www.amazon.co.uk/appstore): Owners of one of Amazon''s Android-based
    tablets can download apps from the Amazon App Store.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_204_0.png)


    Above: You download apps from app stores such as Google Play.


    > **Did You Know?**

    > Most of the major app providers have their own app stores where you can download
    and install apps direct to your tablet or smartphone without using a web browser.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# App Threats


    You may think because big, reputable companies such as Apple and Google run their
    own app stores that everything on there will be safe and free from malware, but
    this is not the case. Anyone can make an app and upload it to these app stores,
    and while these companies strive to ensure everything listed is safe and free
    of malware, app threats still get through.


    # App Security


    Apps range from functional apps, such as maps and shopping tools, to games and
    other fun items. Apps are usually cheap and many can be downloaded for free. Usually,
    these free apps are perfectly safe to use and malware free (they usually generate
    income from advertising), but some malicious developers have begun installing
    malware on apps, as well as creating pirated sub-standard or malware versions
    of legitimate apps. Because of this, you need to be a little cautious when downloading
    and installing apps to your smartphone or tablet.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_205_0.png)


    Above: App reviews on Google Play.


    +   - **Third-party app stores**: Stick to the major app stores and avoid downloading
    any app from a third-party website.


    +   - **Reviews**: Read the reviews customers leave on app stores. If an app has
    lots of one-star reviews, it''s a sign of something wrong.


    +   - **Fakes**: Look out for fake versions of legitimate software, or brand new
    versions of existing apps. Visit the developers'' web page to ensure you are getting
    a legitimate product.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# # App Permissions


    When you install an app, you will often be asked to grant the app certain permissions,
    such as use of your Internet connection, access to your device''s storage, and
    even access to GPS or other functions. Apps may even ask permissions for access
    to your SMS messages and email, which could be a sign of a malicious app, unless
    it is an email or SMS app that has a legitimate need for this access. Therefore,
    it may be worthwhile checking with the app store or with the developer directly
    to ensure they need the permissions that they do, and do not allow permissions
    on anything you think might be suspect.


    # # MOBILE ANTIVIRUS


    One way of identifying risky apps and keeping your phone or tablet free from malware
    is to install antivirus software. Not so long ago this was not seen as a necessity
    for smartphones and tablets, but as more and more malware is infecting mobile
    devices, so antivirus software is becoming as essential for mobile devices as
    it is on PCs.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_206_0.png)


    Above: Antivirus software for mobiles and tablets often comes in the form of an
    app.


    # # Antivirus Apps


    Most of the major developers now produce antivirus solutions for mobile devices.
    Some offer free solutions, others sell yearly or monthly licences. However, mobile
    antivirus software is usually much cheaper than PC versions, and most software
    is sold in the form of an app.


    +   - Norton: Produce antivirus apps for both Android and iOS, we well as multi-device
    support to protect all your devices. A free trial version is available on most
    app stores.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Hot Tip


    Android devices are far more susceptible to malware than iOS and Windows devices,
    mainly because the operating system is open source, so it is available for anybody
    to develop apps for it.


    +   - McAfee: Also produce multi-platform antivirus for mobile devices as well
    as multi-device packages.


    +   - AVG: Offer both a free and a professional version of antivirus software
    for Android devices. As well as malware protection, the app can help you locate
    a lost or stolen device and remote wipe its contents.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_207_0.png)


    Above: Avast have a free mobile suite for Android devices.


    +   - Avast: Produce a free Android security suite, including malware protection,
    remote wipe and device location.


    # # Installing Mobile Antivirus


    Installing antivirus software on your tablet or smartphone is relatively straightforward.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_207_1.png)


    Above: Installing an antivirus app.


    +   1. Download the antivirus app, either direct from the developer or via an
    app store.


    +   2. Install the app on your phone and approve the requested permissions.


    +   3. Launch the antivirus app and follow the on-screen instructions.


    +   4. For location and remote wipe services, you will need to register the device
    on the developer''s website.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# ## Removing Apps


    Unlike PCs, app-based malware is unable to affect files and folders in the same
    way as a computer virus. However, malware can still copy and send data to third
    parties as well as spy on your online activities. However, if you suspect you
    have a malware threat, quite often the best way to resolve it is to uninstall
    any apps that you think could be the cause. You can always reinstall innocent
    apps once you have resolved any threat.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_208_0.png)


    # ## Parental Controls


    As with desktop computers, you can limit what your children see on their smartphones
    or monitor their usage. Some mobile antivirus software comes complete with parental
    control software or you can download various apps.


    +   - PhoneSheriff (http://www.phonesheriff.com/): Compatible with both Android
    and iOS, PhoneSheriff lets you restrict access to certain types of Internet content,
    as well as set time restrictions, block phone numbers and track the phone''s location
    using GPS.


    +   - My Mobile Watchdog for Android (http://www.mymobilewatchdog.com/): You can
    monitor, block, filter and track your child''s Android or iOS device, but it does
    not offer a stealth mode, so your children will know they are being monitored.


    +   - Mobile Spy (http://www.mobile-spy.com/): While you cannot block websites
    with Mobile Spy, you can see everything your children have been viewing, including
    deleted texts and emails.


    +   - Spyera (http://spyera.com/): Has the advantage over other apps by letting
    you regulate and monitor your child''s smartphone remotely. You can even listen
    in on calls.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_209_0.png)


    # # MOBILE PHONE HACKING


    While strictly not an Internet threat, mobile phone hacking has made the headlines
    in recent years due to some of the dubious methods employed by certain British
    newspapers. Mobile phone hacking is not actually very sophisticated but is the
    result of people not adequately securing their mobile phones.


    Above: It takes just a few seconds to set up a voicemail PIN.


    # ## Voicemail PIN


    The way people hack into voicemails is relatively simple. Most mobile phone companies
    provide a voicemail number that you can call from a landline phone to gain access
    to your messages. To prevent unauthorized access, a PIN is used, but most phones
    come with a factory default number, such as 1111, so unless you set a new PIN,
    a hacker can gain access to your messages.


    # ## Setting Voicemail PIN


    The steps to set a new PIN will depend on your phone provider, but generally you
    need to do something approaching the following:


    +   1. Using your mobile handset, call your voicemail service and listen for the
    option to change your PIN.

    +   2. Press the appropriate button to change your PIN.

    +   3. Enter your new PIN.


    > > **Hot Tip**

    > > If your voicemail suggests you have no new message when you know somebody
    has left one, or a new message suddenly disappears, it could be a sign that your
    mobile phone has been hacked.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# # SMARTPHONE AND TABLET SECURITY CHECKLIST


    To summarize the points discussed in this chapter and to help you keep your mobile
    devices secure, here is a checklist.


    +   - Connections: Disable Wi-Fi and Bluetooth when you are not using them.

    +   - Antivirus: Install antivirus software on your smartphone and tablet.

    +   - Remote wipe: Set up remote wipe in case your phone is lost or stolen.

    +   - PIN: Make sure you change your voicemail PIN from the factory default.

    +   - Update: Keep your operating system and apps updated.

    +   - Apps: Be careful when downloading and installing apps.

    +   - Hotspots: Be wary of using public access points.

    +   - HTTPS: Always use HTTPS for email and other secure online activities, or
    think about setting up a VPN (virtual private network).

    +   - Device: Keep tabs on your device. Never leave it unattended, even for a
    moment.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_210_0.png)'
  merge: -1
  img_proc: true
