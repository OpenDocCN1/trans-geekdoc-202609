  md: '# # USEFUL WEBSITES


    www.publicproxyservers.com

    Find a proxy to browse the Internet anonymously.


    www.preyproject.com

    Download an app that lets you keep track of your laptop, smartphone or tablet
    whenever missing.


    www.kproxy.com

    Claims to be the most reliable and fastest free anonymous web proxy on the Internet.


    www.cyberghostvpn.com

    Set up your own private network when using Wi-Fi hotspots.


    https://www.google.com/safebrowsing/report_badware/

    Report a site containing malicious software to Google.


    www.piriform.com/recuva

    Download Recuva, a free Windows program that lets you restore deleted files.


    https://www.iwf.org.uk/report

    Report inappropriate material to the Internet Watch Foundation.


    www.piriform.com/ccleaner

    Download CCleaner, the free registry-cleaning program for Windows to fix invalid
    or corrupted entries.


    www.uk.safesearchkids.com

    Powered by Google, this search engine lets your children browse the web with safe
    search permanently on.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_254_0.png)


    www.antivirusforum.net/forum.php

    Compare and choose between different antivirus software.


    www.avg.com

    Download the most popular free antivirus software.


    www.zonealarm.com

    Download a free firewall and find compatible antivirus and security software.


    www.adobe.com

    Get free trials of Adobe software and free updates for basic plug-ins.


    www.malwarebytes.org

    For a free downloadable version of anti-malware software.'
