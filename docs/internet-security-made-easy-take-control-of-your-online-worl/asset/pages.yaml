- pgno: 241
  md: '+   2. Click on the Startup tab. Here is a list of all the items that run when
    the machine boots up. Note anything suspicious, such as those with Unknown listed
    under the manufacturer or those claiming to be Windows or Microsoft files.


    # Removing Start-up Viruses


    +   1. Disable the suspicious file in the System Configuration Utility (check
    the box and click Disable).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_241_0.png)


    +   2. Reboot your computer in Safe Mode and run msconfig again. If the threat
    is still there, you can be pretty sure it is a virus.


    +   3. Note down the location of the virus, and then run Registry Editor.


    +   4. Go to the location of the virus and right click the suspected file, select
    modify and put ":" in front of the value data. This will disable the virus but
    not delete it.


    Above: The potential location of a virus.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_241_1.png)


    +   5. Reboot your computer in normal mode. If all is well you can be assured
    the file is not important to your system, so go back into Registry Editor and
    delete the virus (right click Delete).


    +   6. Reboot again, and then run msconfig to check that the threat has been removed.


    Above: Modifying registry values.'
  merge: -1
