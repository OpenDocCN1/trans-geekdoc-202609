- pgno: 145
  md: '+   - Office: If you use your computer mainly for office work, you will want
    to ensure you have an email scanner for sending and receiving attachments.


    +   - Children: Those with a family may want a package with parental controls.


    # Platform


    Another factor you need to take into account when choosing your antivirus software
    is the machine you are using and the operating system you are running. Some antivirus
    software requires a lot of system resources to run, which may make it unsuitable
    for some older machines as it may slow things down and reduce performance; some
    solutions do not support older operating systems (they may install but no longer
    update). In addition, some antivirus software performs better on certain operating
    systems and computers than on others.


    # Detection Rates


    Developers of antivirus software vary in their efficiency too. Some companies
    such as Symantec and McAfee have been developing antivirus solutions for decades
    and have the experience to provide high-level detection rates, but some companies
    are quite new to antivirus software, so their systems may not be as effective.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_145_0.png)


    # Cost


    As with many other things, when looking at antivirus software, you get what you
    pay for, and some of the best solutions tend to be the most expensive. However,
    work within your budget, as the last thing you need is to install a package then
    find you cannot afford the subscription, eventually leaving you unprotected.


    > > Above: Not all antivirus developers make versions for Macs or tablets.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "# # Shortcomings\n\nThere are a few other things to consider when choosing\
    \ antivirus software.\n\n+   * **Learning curve:** Some software solutions can\
    \ be incredibly complicated in all but their basic functions, so choose something\
    \ that you find user-friendly.\n\n+   * **System resources:** Ensure your computer\
    \ is able to cope with the demands of the antivirus software; the last thing you\
    \ want is your screen freezing or your machine slowing down when your antivirus\
    \ is updating or scanning.\n\n+   * **Updates:** Make sure the system you choose\
    \ has frequent and regular updates in order to keep you protected from the latest\
    \ threats.\n\n+   * **Compatibility:** Antivirus software may prevent some innocent\
    \ programs from working or accessing the Internet. Make sure the antivirus you\
    \ choose is compatible with your current software.\n\n+   * **Support:** Choose\
    \ antivirus software that comes with technical support so you can speak to a technician\
    \ if\n\n> **Hot Tip**\n> \n> When choosing antivirus software, do your research.\
    \ Go online and read reviews of antivirus solutions, and go on forums such as\
    \ http://www.antivirusforum.net/forum.php to see what people are saying about\
    \ the different software.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_146_0.png)\n\
    \nAbove: You can get all sorts of help and advice on antivirus forums that can\
    \ help you choose the right software for you."
  merge: -1
  img_proc: true
- pgno: 147
  md: "# # THE SOLUTIONS\n\nIt is time to look at some of the antivirus solutions\
    \ available. In this section, we will explore some of the main software on the\
    \ market, examine their advantages and disadvantages, costs, and how effective\
    \ they are at dealing with threats.\n\n# ## THE BIG PLAYERS\n\nWhen it comes to\
    \ antivirus, two names have dominated the market for years – McAfee and Symantec.\
    \ As Internet technology advances and people realize the importance of Internet\
    \ security, this is now changing and the antivirus market is becoming increasingly\
    \ crowded as more companies are developing software to meet the demand. However,\
    \ Symantec, which produces Norton Antivirus, and McAfee remain two of the largest\
    \ companies.\n\n# ### McAFEE\n\n(HTTP://WWW.MCAFEESTORE.COM/)\n\nFounded in 1987\
    \ by British-American computer programmer John McAfee, the company is now owned\
    \ by Intel Corporation. McAfee produce new versions of their antivirus solutions\
    \ each year and the products are licensed for 12 months, meaning you have to repay\
    \ your subscription to continue using them. You are also restricted to the number\
    \ of devices you can run the software on.\n\n> > **Did You Know?**\n> > \n> >\
    \ All costs listed are correct at the time of writing this book and represent\
    \ the actual UK and USA costs, not the pound to dollar conversion. However, many\
    \ antivirus developers run regular half-price promotions."
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Cost


    McAfee produce various antivirus packages for PC, Mac, smartphone and tablet computers.
    These packages vary from £49.99/ $49.99 for their basic Antivirus Plus package
    to £79.99/$99.99 for their All Access Suite, which provides protection for multiple
    devices, including tablets, smartphones, PCs and Macs.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_148_0.png)


    Above: McAfee have been producing antivirus software for over 20 years.


    # Features


    Even the basic McAfee''s antivirus package contains all the features you require
    in antivirus software, including phishing protection, virus and spyware protection,
    and web and email scanning, as well as a built-in firewall. McAfee is easy to
    use, with a simple interface and plenty of help options available.


    # Reviews


    Various third-party tests have suggested that while McAfee products are good at
    spotting threats, they are not as effective as other solutions at removing them.
    Computer Shopper Magazine gave their Total Protection package 2.5 out of 5 stars,
    while CNET gave the same product a rating of 3.5 out of 5 stars.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_148_1.png)


    Above: McAfee produce numerous different packages that vary in price.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# NORTON/SYMANTEC (HTTP://NORTON.COM/)


    Founded in 1982, Symantec produced their first antivirus solution in 1989. Under
    the brand name Norton, the company releases new antivirus software all the time
    and, unlike McAfee, they no longer identify newer versions with a year-of-version
    number, enabling them to install updates to current versions without you having
    to wait for the latest product.


    # Cost


    Prices for Norton antivirus products range from £39.99/$49.99 a year for their
    basic package to £69.99/$89.99 for their 360 Multi Device package (licensed for
    up to three devices).


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_149_0.png)


    # Features


    Symantec''s basic Norton AntiVirus provides basic virus protection, the detection
    and removal of spyware, the prevention of Internet worms and free technical support,
    while their advanced packages also include features such as parental controls
    and hacker protection.


    Above: Symantec''s Norton offers some of the best antivirus packages on the market.


    # Reviews


    Older Symantec products used to be criticized for using too many system resources
    and slowing machines down, but these problems have been addressed in the latest
    versions, which have been recognized in recent years by both PCMag and PC World
    as being among the best on the market.


    # OTHER PLAYERS


    Symantec and McAfee no longer have the dominance they once had in the antivirus
    market. New antivirus developers are emerging all the time, and while it is impossible
    to list every software manufacturer, here are some of the most popular and well-regarded
    solutions available.'
  merge: -1
  img_proc: true
