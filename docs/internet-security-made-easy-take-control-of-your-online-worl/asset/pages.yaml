- pgno: 242
  md: '# # ROGUE PROGRAMS AND SECURITY TOOLS


    Some of the simplest malware can also be the hardest for antivirus software to
    spot and remove. Sometimes they are in the form of innocent programs that install
    themselves on start-up, or they might be in the guise of a security tool, which
    provides false scans prompting you to pay to have fake threats removed.


    **Hot Tip**


    After making changes to your registry, it is a good idea to run a registry-cleaning
    program such as CCleaner or Wise Registry Cleaner to fix any issues or corrupted
    files (see page 229).


    # ## Processes


    In order to see if you have a rogue program or security tool running on your Windows
    machine, you need to open the Task Manager (Ctrl, Alt, Delete), in OS X use the
    Activity Monitor (Applications, Utilities).


    +   1. Make a note of any suspicious processes. Look for processes with no clearly
    defined name, such as a random number or string of letters.


    +   2. Do an Internet search of these processes to see if they are malware; if
    there is no record of any process with the same name, it is unlikely to be genuine.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_242_0.png)


    +   3. If so, Force Quit the process in Task Manager/Activity Monitor.


    +   4. Do a search for files and data associated with the name of that program.
    Remove any associated files or folders.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# HARDWARE SECURITY


    Not all Internet security comes in software form. You can get all sorts of hardware
    to help secure your computers and Internet connection, which can be especially
    useful if you have a home or small-business network.


    # ROUTERS


    The router is the hardware device through which you connect to the Internet. Because
    of this, the router can be your first line of defence against online threats,
    hackers and other Internet nasties. Routers have all sorts of in-built security
    measures, but in order to take advantage of them, you need to set up your router
    correctly.


    # Types of Router


    Routers come in a variety of types, but for most people there are two basic choices.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_243_0.png)


    Above: Most people use wireless routers these days.


    +   Wired routers: Less common for home networking these days, but wired routers
    are more secure and so preferred by most business networks, although they are
    less flexible.


    +   Wireless routers: Let you connect devices wirelessly to the router, giving
    greater freedom; the most common choice for most home networks.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Understanding Routers


    In order to make the best of your router and its security features, it is worth
    understanding how a router works and what its core functions are.


    +   Packet forwarding: Internet traffic travels around in small packets of data.
    It is the router''s job to relay these packets to you.


    +   Packet filtering: Not all data travelling to your network is wanted. Routers
    sift through the packets and filter what is and isn''t required.


    +   Packet switching: Routers break data into packets and send them separately,
    to be reassembled at the destination.


    # HARDWARE FIREWALLS


    Because a router''s main job is to sift through the data coming into your home,
    it is very easy for it to act like a firewall. In fact, most wireless routers
    now have a firewall option, but if your router does not, you can also buy a specialized
    hardware firewall.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_244_0.png)


    # ACCESSING YOUR ROUTER


    To understand whether your router has a firewall installed, or if you wish to
    turn it on, you must first access your router or hardware firewall''s configuration
    settings. Most come with software that you can install on your hard drive to access
    the functions, but this is actually not required, and the simplest way to reach
    your router or firewall''s configuration settings is to open an Internet browser
    and enter the device''s IP address in the address bar. You can normally find this
    on a sticker attached to your device. If you cannot find it, go online and visit
    your manufacturer''s support pages.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "![](img/f1096bf6e51eba2af0c1cf60f883f3b6_245_0.png)\n\nAbove: Most routers\
    \ have in-built firewalls.\n\n# Administrator Password\n\nWhen you first install\
    \ your router, you will be given an administrator username and password allowing\
    \ you to access your router settings. It is important to change this as soon as\
    \ possible to protect your router from being accessed by somebody else. You will\
    \ normally find the option to do this in the basic settings page or your router\
    \ configuration.\n\n# Router Firewall\n\nYou can normally find the settings for\
    \ your router’s firewall under the Port Forwarding or Packet Forwarding settings.\
    \ You will normally see a number of options for disabling the firewall, blocking\
    \ all traffic or allowing certain access (usually set as the default).\n\n# Firewall\
    \ Access\n\nAs with software firewalls, the firewall on your router may block\
    \ innocent applications and devices. Because of this, you may need to add exceptions\
    \ to your firewall.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_245_1.png)\n\n\
    +   1. Go into your Port Forwarding settings and look for a menu option that says\
    \ 'exceptions' or 'configuration'.\n+   \n+   2. You may have a menu of listed\
    \ games and applications that you can simply select to allow access.\n\nLeft:\
    \ Adding an exception to the firewall."
  merge: -1
  img_proc: true
- pgno: 246
  md: "![](img/f1096bf6e51eba2af0c1cf60f883f3b6_246_0.png)\n\n+   3. If your game\
    \ or application is not listed, you will have to add it, which means finding out\
    \ the port range and protocol of the application (see the manufacturer's instructions).\n\
    \n> Hot TIp\n> \n> If you have a games console, it is sometimes better to add\
    \ the device as an exception using Port Forwarding configuration rather than the\
    \ individual games, as attacks against consoles tend to be quite rare.\n\n# Granting\
    \ Device Access\n\nNot only can you grant certain access to games and applications,\
    \ but you can also set up a list of approved devices that can access your router.\
    \ Sometimes this is described as an access blocking policy, or it may just be\
    \ listed as access restrictions. If you have a list, you must remember that any\
    \ new devices you want to connect to the router will have to be added to gain\
    \ access to the Internet."
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/f1096bf6e51eba2af0c1cf60f883f3b6_247_0.png)


    # ENCRYPTION KEYS AND IDENTIFIERS


    Perhaps the most important form of security on a modern wireless router is the
    encryption key you enter when connecting to the router. Most manufacturers provide
    each router with a unique key, but is often a good idea to regularly change it.


    # Hot Tip


    Change your SSID in your router setting from the manufacturer''s default, as this
    will prevent hackers from knowing what type of router you have, making it harder
    for them to hack into it.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# SSID


    Service Set Identifier (SSID) is the name given to your router that you see in
    your network settings on your computer or smartphone. By itself, the SSID cannot
    be used to gain access to your network, but it does let people know your wireless
    router exists.


    # SSID Broadcast


    Most routers let you prevent your SSID from being broadcast. If you turn this
    off, devices will not be able to find your router, but those already connected
    to it will remain connected.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_248_0.png)


    Above: You can usually find all your router details on a sticker on the back.


    # Encryption Types


    Wireless routers come with some form of encryption, which scrambles the data sent
    over the network. Generally, there are two types of encryption offered by router
    manufacturers.


    +   - WPA (Wi-Fi Protected Access): A newer, more secure form of encryption. Always
    opt for this in your router settings if available.


    +   - WEP (Wireless Equivalent Privacy): An older, less secure form of encryption,
    although it is more compatible with devices than WPA.


    # Router Position


    Finally, where you place your router in your home can affect security. Wireless
    routers are broadcast devices, so they can reach far beyond the confines of your
    home. To limit the range, try to install a router as close to the centre of your
    home as possible, rather than by windows or doors, where the signal can leak out.
    (This will also give you the best signal.)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# JARGON BUSTER


    The world of Internet security is full of its own terms and terminology that you
    may find confusing, so to help you, here is the most common jargon explained.


    **Adware**

    Malware designed to display unwanted advertisements. Adware can infect Internet
    browsers and prevent normal browsing by redirecting you to advertising websites
    or bombarding you with pop-ups (see also malware).


    **Botnet**

    A collection of computers infected with malicious bots that work together to carry
    out a single act, such as attacking a computer network or spreading malware. Botnets
    often operate unbeknown to the computer users. (See also **Zombie computer**.)


    **Antivirus software**

    Software designed to prevent malware, including viruses, computer worms and Trojans,
    from infecting computers. Antivirus software can also remove malware and stop
    spyware and adware threats.


    **Cache**

    Files stored on an Internet browser, such as images and text, that are used to
    speed up the loading of websites.


    **Backdoor**

    A method used by hackers to bypass normal security procedures on a computer, often
    caused by vulnerabilities in the software or network.


    **Cloud (computing)**

    Computing services that operate on the Internet, such as applications that can
    be run without needing to download a program, or storage services that store your
    files online.


    **Bluetooth**

    A short-range, wireless communication system often used to connect devices such
    as headphones, smartphones and keyboards.


    **Cookie**

    A small file stored on your computer by websites, which contains certain details
    about your web history so a website can remember your log-in details and personal
    preferences.


    **Bot or web bot**

    An automated program that performs a set of actions; a bot can be legitimate,
    such as those used by search engines to crawl websites, or they can be malicious
    and take control of computers. (See also **Botnet**.)


    **Computer virus**

    A type of malware that infects a computer and can self-replicate and spread to
    other machines. The term is often used as a catch-all word to describe malware.
    (See also **Malware**.)


    **Cracker**

    A malicious or criminal hacker. (See also **Hacker**.)'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Distributed Denial of Service (DoS) attack


    Where a number of machines all attack a network at the same time, overloading
    it and making normal access impossible.


    # Domain Name System (DNS)


    Converts the IP address of a server into an easily recognizable web address that
    you can type into an address bar.


    # Digital certificate


    Also called public key certificate or security certificate, a digital certificate
    validates a website by the use of encrypted or digitally signed data.


    # Domain (address)


    The main part of a website name, such as www.google.com. Other web pages on a
    site can be attached to a domain address by means of a backslash, such as www.google.com/help.


    # Encryption


    A method of scrambling information to make it unreadable to unauthorized users.


    # Firewall


    A hardware or software device that blocks access into a network. Can be used to
    prevent hackers and malicious software from gaining access.


    # Hacker


    A person who gains unauthorized access to a computer or network, either for malicious
    purposes or to test security.


    # Heuristics


    Often used to describe a type of antivirus solution that can spot malware by suspicious
    behaviour rather than having to identify its signature on a database.


    # HTML


    HyperText Mark-up Language is used by websites to design and format web pages.


    # HTTP


    HyperText Transfer Protocol is a set of communication rules for controlling how
    information is sent over the Internet.


    # HTTPS


    HyperText Transfer Protocol Secure is an encrypted and more secure form of HTTP.


    # Hyperlink (also just ''link'')


    An active element such as a word or phrase on a web page that takes you to another
    destination when you click on it.


    # Internet


    A network of computers and computer networks. Often used interchangeably, although
    incorrectly, with the World Wide Web, which are the websites that exist on the
    Internet.


    # IP address


    An Internet Protocol address is a unique numerical identifier for each computer,
    network or server.


    # Keylogger


    A type of malware or spyware that tracks your keystrokes on a keyboard and sends
    the data to a third party. (See also Malware.)


    # Laptop


    A portable computer.


    # Malware


    Means malicious software and describes all types of software designed to cause
    harm on a computer, including computer viruses, spyware, keyloggers, worms, adware
    and Trojans.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '**Network**

    A group of computers or devices connected together either wirelessly or by cables.


    **PDA**

    A Personal Digital Assistant is a type of small computer that can be used to store
    information such as addresses and telephone numbers, as well as connect to the
    Internet.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_251_0.png)


    **Pharming**

    An attempt by a hacker to redirect a website’s traffic to another site for the
    purpose of stealing information.


    **Phishing**

    An attempt by a hacker or fraudster to obtain personal information about a user,
    often by posing as someone else or a legitimate company. Phishing is normally
    done using email, text or social media messages.


    **Plug-in**

    An additional component to a software program that adds a new feature or added
    functionality.


    **Pop-up**

    A new browser window, often containing an advertisement, that pops up uninvited
    in front of an existing page.


    **Proxy (server)**

    A computer server that acts as an intermediary between your computer (the client)
    and the server you are communicating with (the host).


    **Ransomware**

    A type of malware that forces you to pay money to unlock files or regain access
    to your computer.


    **Registry**

    A database on Windows machines that stores start-up and configuration settings.


    **Rootkit**

    A type of malware designed to hide the fact that a computer has been compromised
    by hiding itself in the system files or ''root'' of a computer. (See also Malware.)


    **Router**

    A hardware device that connects a computer or network to the Internet either wirelessly
    or by the use of cables.


    **Security holes**

    A weakness in a security system that can be exploited by hackers or malicious
    software. (See also Backdoor.)


    **Smartphone**

    A mobile phone that also has many functions of a computer, such as being able
    to access the Internet.


    **Spam**

    Unsolicited emails or messages often containing adverts. Spam can also include
    phishing messages. (See also Phishing.)


    **Spyware**

    A type of malware designed to spy on your computer use and collect information
    about you without your knowledge or permission. (See also Malware.)'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   **Tablet computer**

    +   A flat touch-screen device that runs similar computing architecture to a smartphone
    but is usually larger.


    +   **Trojan (or Trojan horse)**

    +   A type of malware that gains access to a computer by posing as an innocent
    file or program. (See also Malware.)


    +   **URL**

    +   Uniform Resource Locator is a website''s address.


    +   **URL spoofing**

    +   An attempt by hackers to create a fake website that has a very similar URL
    to the site it is trying to replicate in order to fool people. Often used in phishing
    attacks. (See also Phishing.)


    +   **Virus**

    +   See Computer virus.


    +   **VoIP**

    +   Voice over Internet Protocol is a method of voice communication over the Internet.


    +   **Web browser**

    +   Software designed to connect with and read web pages.


    +   **Web page**

    +   A page on the Internet generated by HTML that contains information that can
    be viewed on a web browser.


    +   **Website**

    +   A collection of web pages under a single domain address.


    +   **Web server**

    +   A computer that makes web pages and other resources available for sharing
    over the Internet.


    +   **WEP**

    +   Wired Equivalent Privacy is type of encryption used by wireless routers.


    +   **Wi-Fi**

    +   Wireless Fidelity is a short-range wireless technology that enables wireless
    Internet and network access.


    +   **Wi-Fi hotspot**

    +   Usually a public wireless access point. Sometimes these locations have poor
    or no security measures in place.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_252_0.png)


    +   **World Wide Web**

    +   The name given to the websites and web pages that are interconnected on the
    Internet.


    +   **Worms**

    +   A type of malware that can self-replicate and spread itself around a network.
    (See also Malware.)


    +   **WPA (and WPA2)**

    +   Wi-Fi Protected Access is a form of wireless encryption that is more secure
    than WEP.


    +   **Zombie computer**

    +   A computer that has a bot or other malicious program running in the background
    without the knowledge or permission of the user.'
  merge: -1
  img_proc: true
