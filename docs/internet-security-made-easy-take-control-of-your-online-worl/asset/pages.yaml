- pgno: 137
  md: '# ANTIVIRUS SOFTWARE


    The Internet is full of malware threats, and the easiest way to protect your computer
    is to ensure you have some form of antivirus software. However, before you can
    go looking for antivirus software, you need to understand the different sorts
    of features they offer and the protection they provide.


    # MALWARE PROTECTION


    The term antivirus is a bit of a misnomer, because some antivirus software not
    only provides virus protection but also guards you against other malware threats,
    such as Trojan horses, spyware and adware. However, not all antivirus software
    is the same and the choice can sometimes be overwhelming.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_137_0.png)


    # A Variety

    of Solutions


    Antivirus software varies in price, complexity and protection, so knowing what
    the best solution is for you can be difficult.


    Sometimes, on a machine with a lot of inbuilt protection, only a basic package
    is necessary, while on more basic machines,


    Above: All computers need some form of antivirus protection to guard against malware
    threats.


    you may require a more sophisticated software solution. However, before we look
    at the various choices on the market, it is worth examining how antivirus software
    works.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # BASIC FUNCTIONS


    While the vast majority of malware is spread via the Internet, this is not the
    only source. Email attachments, programs and files, USB memory sticks and even
    CDs and DVDs can harbour malware. For this reason, antivirus software has to be
    able to identify malware for a number of different locations, and it does this
    in two ways.


    +   - **Virus shield**: The virus shield acts like a gatekeeper, examining all
    the files you download, whether from the Internet, an email attachment or another
    source, looking for any malware.


    +   - **Virus scan**: There is little point in checking new files for malware
    if your system is already infected, which is why antivirus software can also scan
    your hard drives and removable media for threats.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_138_0.png)


    Above: Antivirus software can scan your computer for threats.


    # ## Virus Database


    One of the ways antivirus software identifies threats is by the use of a virus
    database. Antivirus software developers compile these databases, and when their
    software comes across a piece of code similar to something on the virus database,
    it is flagged as a possible threat. However, virus databases do have limitations.


    > > **Hot Tip**

    > >

    > > When you install antivirus software for the first time, make sure you do a
    thorough scan of your hard drive. It may take some time but it is the only way
    to be sure your machine is not already infected.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - Polymorphic viruses: Some viruses can modify themselves so may no longer
    resemble an existing threat on the database.


    +   - Update: If a virus has yet to be identified, or the antivirus software has
    not updated its database to include the latest threats, some malware may get through.


    # Heuristic Scanning


    Because of the above limitations, some antivirus software can also identify threats
    by monitoring the behaviour of files and programs on a computer. If it spots something
    unusual, such as program trying to overwrite another program, it flags it up as
    a possible threat, allowing you to take action. This is known as heuristic scanning.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_139_0.png)


    Above: It is important to keep your antivirus software updated.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # DEALING WITH THREATS


    When antivirus software comes across a threat, it can deal with it in several
    ways. Your antivirus programs may offer you the choice of what to do with a threat
    or it may take the action it thinks most appropriate, which includes:


    +   * **Cleaning:** If your antivirus software identifies something that it is
    certain is a threat, it may erase it completely.


    +   * **Quarantine:**

    +   If your antivirus software is unsure that something is a threat, it may quarantine
    it, allowing you to investigate it later. You can release a file from quarantine
    at any time.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_140_0.png)


    Above: If your antivirus software spots a potential threat, it may isolate it
    by placing it in quarantine.


    +   * **Ignore:** If your antivirus spots something that could be a threat but
    is dormant, it may decide to ignore the threat and only take action if the suspicious
    item does something to threaten the system.


    > > **Hot Tip**

    > >

    > > When a file is quarantined, it can no longer carry out its programmed behaviour
    or infect another file. If you are unsure whether a file is malware or not, quarantine
    it, and see what effect it has on your computer.'
  merge: -1
  img_proc: true
- pgno: 141
  md: "# OPERATING ENVIRONMENT\n\nTraditionally, antivirus software has been considered\
    \ only necessary for Windows machines. This was because Mac computers, Linux machines\
    \ and smartphones used to be more secure than Windows-based machines as fewer\
    \ people created viruses for these platforms. However, times are changing and\
    \ this is no longer the case.\n\n![](img/f1096bf6e51eba2af0c1cf60f883f3b6_141_0.png)\n\
    \nAbove: Even Mac computers need antivirus software.\n\n# Antivirus Software For\
    \ Mac\n\nThe increase in people using Apple products has made them a tempting\
    \ target for hackers and malicious coders. This has made antivirus software just\
    \ as crucial for users of Apple devices as it is for Windows machines. Not only\
    \ do desktop computers and laptops require protection, but smartphones and tablets\
    \ too.\n\n# Windows 8\n\nBefore the release of the latest Microsoft operating\
    \ system, Windows users needed separate antivirus software. Although Windows 8\
    \ now includes its own antivirus system, known as Windows Defender many users\
    \ prefer to use a third-party program, as they feel they are more effective at\
    \ protecting against threats.\n\n> **Hot Tip**\n> \n> We will look at smartphone\
    \ and tablet antivirus and security software in more detail from page 201."
  merge: -1
  img_proc: true
- pgno: 142
  md: '# CHOOSING YOUR ANTIVIRUS SOLUTION


    With such an array of choices of antivirus software on the market, it can be difficult
    to decide what solution is best for you. To help you decide, we will explore the
    different options and see what types of protection are available.


    # NOT ALL ANTIVIRUS SOFTWARE IS THE SAME


    A common misconception about Internet security is that it does not matter what
    sort of antivirus protection you have on your computer, as long as you have some.
    This has led to a tendency for people to opt for free or cheap solutions, believing
    they offer the same protection as the more expensive software packages. However,
    this is not the case. Different antivirus software packages come with a wide variety
    of options and functions, and the solution that best suits your needs will depend
    on your Internet use and the risks you expose yourself to.


    > Hot Tip

    > Some antivirus software packages are sold on a subscription basis, so make sure
    you understand what the total monthly and yearly costs will be before you commit.


    Right: Free antivirus software, such as AVG, offers basic levels of protection,
    but you may need more depending on your computer use.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_142_0.png)'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# # FUNCTIONALITY


    Antivirus software can contain all sorts of different features and functions.
    Some software, such as free packages, includes just basic functionality, while
    other programs include sophisticated features.


    # ## Basic Functions


    At the very least, any antivirus software needs to offer the following functions:


    +   - **Scanning**: So you can scan your files and folders to spot potential infection.


    +   - **Shield**: Some real-time scanning is crucial for spotting threats before
    they can infect your files and folders.


    +   - **Updates**: An obsolete antivirus program will be useless at spotting recent
    threats and the latest viruses, so ensure your program can be regularly updated.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_143_0.png)


    # ## Additional Functions


    Depending on your computer usage and existing security measures, you may want
    other functions beyond the basics.


    +   - **Email scanning**: Not all antivirus packages scan emails and attachments.


    +   - **Heuristic scanning**: Some antivirus solutions only rely on databases;
    heuristic scanning enables your software to spot unknown and newer threats by
    monitoring the behaviour of files.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   • **Antispyware**: Basic packages do not always protect against spyware
    threats.


    +   • **Adware protection**: Not all antivirus software offers adware protection.


    # YOUR NEEDS


    What you use your computer for can determine the types of threats you will be
    exposed to and the type of antivirus functionality you may need.


    +   • **Internet surfers**: If you spend a lot of time surfing the Internet, you
    will need to ensure your antivirus protects you from adware, spyware and other
    threats you may face on the Web.


    +   • **Gamers**: Some antivirus software can prevent games from accessing the
    Internet, so you need to ensure you adopt a solution that does not impinge on
    your online gaming.


    +   • **Media**: If you download a lot of films, music and other files, you will
    want something that can spot threats as soon as they arrive on your computer.


