- pgno: 118
  md: '# # COMMON SOCIAL MEDIA SCAMS


    Due to its popularity, social media has become a tempting target for scammers
    and fraudsters. Be on the lookout for some of these common scams.


    +   * **Secret details about ....** Often followed by the name of celebrity and
    including a link to tempt you to some salacious gossip, but which in fact leads
    you to a malicious site.

    +   * **Help, need money:** Be wary of anybody asking for financial help. Often
    the fraudsters claim to be a victim of a terrible tragedy.

    +   * **Did you see this picture of you?:** Watch out for any Tweets or Facebook
    messages containing a link to a picture of you. It normally directs you to a fake
    login screen designed to get your account details.

    +   * **Ur cute. Message me:** Be wary of strangers claiming they find you attractive,
    as they are liable to be fraudsters.


    > > Government authorities, prospective employers and law-enforcement agencies
    commonly do searches on social media websites, so always think about what you
    are posting and who might see it in the future.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_118_0.png)


    **Right:** Beware of messages suggesting there is a compromising picture of you
    on the Internet somewhere.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # THE INTERNET AND CHILDREN


    In many cases, teenagers and even young children know more than their parents
    when it comes to using the Web. However, they are vulnerable to some specific
    online risks, which will obviously vary depending on their age and Internet access.
    Let’s first look at what these risks are.


    # # THE TECH GENERATION


    For many adults, the Internet and World Wide Web were not around when they grew
    up, which has meant the Internet is something we have had to learn as it developed.
    For youngsters, the Internet is something that has always been there, which means
    using the Web comes naturally to them.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_119_0.png)


    # ## Tech-savvy


    One of the big problems adults face with their children’s Internet use is that
    quite often children know more than they do about the online world. This means
    monitoring your child’s Internet use can be difficult, especially as so much online
    activity is conducted on smartphones and other mobile devices these days. However,
    it is important to understand the risks children could be exposed to and what
    you can do to minimize them.


    Left: In many ways, children are more Internet savvy than their parents.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# The World Wide Wild West


    The Internet offers plenty of educational and social benefits for children, but
    it also comes with certain risks. Many adults feel very anxious about the Internet
    and the dangers it poses to their children, partly because of the knowledge gap
    between children and adults when it comes to the online world. However, while
    there are dangers on the Internet, understanding what they are and what you can
    do to minimize the risks can make you more relaxed about your children''s web
    use.


    > > **Hot Tip**

    > > Many children feel that their parents do not understand the Internet so do
    not talk about their web use, which opens the door for danger. Make an effort
    to spend time talking about their online activities, so they feel comfortable
    discussing it with you.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_120_0.png)


    Above: Be aware of what children are using smartphones for as well as computers.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Understanding the Web


    If you are reading this book, you are already taking a step in the right direction.
    Understanding how the Internet works and the threats it poses can make it easier
    to eliminate these threats and protect your child''s web use.


    # THE RISKS


    Adults and children face similar threats online, such as malware, hackers and
    phishing. But the personal attacks that children risk online can be even more
    damaging because of their age.


    # The Four Cs


    Particularly iniquitous risks faced by children fall into four categories.


    +   **Contact**: Children use all sorts of tools for communicating with others
    – social media, chat rooms and forums – but the people they come into contact
    with online can pose a risk.


    +   **Content**: There is a lot of material on the Internet that is not suitable
    for children to see.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_121_0.png)


    +   **Conduct**: How your children conduct themselves online can also have consequences.


    +   **Crime**: Criminals use the Internet, and some specifically target children.


    Above: Chat rooms are places where children may encounter cyberbullies.


    # CYBERBULLYING


    Just as adults can come under attack from online trolls, so can children. However,
    in many instances children can come under'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# # Hot Tip


    If your child seems withdrawn or quieter than normal, it could be sign of being
    bullied. Speak to them and get them to talk to you.


    attack from other children, often known to them, who use emails, text messages,
    chat rooms and social media to intimidate and threaten, in what has come to be
    known as cyberbullying.


    # ## Types of Online Bullying Behaviour


    Bullying can take many forms, from other children spreading rumours and gossip
    about your child, to threats of violence, blackmail, abusive comments and alienation.
    The problem with identifying if your child is being bullied is that children are
    very reluctant to speak about it; they may even be scared to report it in case
    of further attacks by the bully. In addition, your child may worry that even if
    they do tell you, you may not take it seriously. Indeed, what may seem like a
    bit of trivial name-calling may be causing your child severe anxiety, which could
    even lead to depression.


    # ## Consequences of Online Bullying


    Generally speaking, most incidents of online bullying are minor, and early intervention
    can prevent it escalating. However, there have been cases where children have
    felt so isolated and fearful of online bullies that they have harmed themselves.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_122_0.png)


    Above: Website Bullying UK (http://www.bullying.co.uk/cyberbullying/) can help
    you and your child deal with issues around cyberbullying.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # INAPPROPRIATE CONTENT


    Pornography and violent pictures and videos are not something any of us want our
    children exposed to. There are tools and software you can use (more on this in
    the next section) to guard against your children viewing such content, but there
    are few restrictions and checks on websites themselves to prevent minors from
    accessing the content.


    # ## Pornography


    Adult pornography is perfectly legal, and while some websites require credit cards
    before people can access it, many do not. This means that anybody can click on
    a link or visit a web page and see pornographic material.


    # ## Illegal Material


    Sexual content featuring minors (child pornography) is illegal, and viewing and
    possessing such material can result in a criminal prosecution, even if the people
    accessing it are minors themselves. Children are at risk of accessing other types
    of illegal material on the Internet too, such as pirated films, music and anything
    that promotes criminal activities.


    > ### Hot Tip

    > If you find illegal content on the Internet, you can report it in confidence
    to the Internet Watch Foundation – www.iwf.org.uk/report/


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_123_0.png)


    **Right:** You can report illegal web content at the Internet Watch Foundation.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Other Inappropriate Material


    Not everything we would rather not have our children access is illegal or pornographic.
    Films, music and video games are widely available on the Internet, and some of
    these we may feel are unsuitable.


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_124_0.png)


    # DAMAGED REPUTATIONS


    We have already seen that things we post on the Internet can have long-lasting
    consequences. Images, comments and posts can stay there for ever. It is also very
    easy to copy and paste content from one site to another, so something that your
    child sends to just a few select friends could soon be available for anyone to
    see, even years later.


    # Selfies


    Youngsters love sending and posting ''selfies'' – photos of themselves that they
    have usually taken on their smartphone cameras. Selfies can be great fun, and
    many people take shots of themselves when out with friends or if they happen to
    meet a celebrity. However, there is a darker side to the selfie, and both


    ![](img/f1096bf6e51eba2af0c1cf60f883f3b6_124_1.png)


    Above: Selfies are a popular craze; even celebrities take selfies, such as this
    one taken at the 2014 Oscars.'
  merge: -1
  img_proc: true
