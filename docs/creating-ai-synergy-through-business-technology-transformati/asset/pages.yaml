    products, requiring consumers to possess sufficient financial knowledge for informed
    decision-making. Additionally, regulatory changes emphasize individual responsibility
    for sound financial management, underscores active engagement in personal finance
    (Bhandare et al., 2021). (Grohmann et al., 2018) found a significant link between
    financial literacy and inclusion, indicating a positive influence on economic
    development. Their study, encompassing 119 countries, revealed that financial
    literacy can enhance economic growth. Furthermore, (Effendi et al., 2021) demonstrated
    that financial well-being positively influences GDP growth, which is improved
    by financial literacy components such as financial behavior, attitude, and knowledge.


    Financial literacy is vital for sustainable financial well-being and investment
    behavior. Research has shown that financial literacy strongly and positively correlates
    with active investment behavior, which may affect wealth accumulation and long-term
    financial well-being (Lusardi & Mitchell, 2023a). For instance, studies conducted
    in Japan and Singapore found that financial literacy levels are generally low,
    yet it significantly impacts investment behavior and financial well-being (Bayram
    & Palese, 2022; Perdansari et al., 2019). Moreover, financial education is fundamental
    to understanding the need to combat climate change, especially among rural populations
    (S. et al., 2021). Teachers'' roles in providing age-appropriate financial literacy
    materials are crucial for students'' future financial management Perdansari et
    al., 2019). Financial literacy is necessary to avoid financial problems and enhance
    financial behavior and inclusion, contributing to a sustainable financial future
    (Damayanti et al., 2018).


    # Determinants of Financial Literacy


    Several factors determine the level of financial literacy. Financial education
    is the primary determinant, as highlighted in the OECD 2020 report, which emphasizes
    the importance of financial knowledge in enabling individuals to make well-informed
    financial decisions (OECD/INFE 2020 International Survey of Adult Financial Literacy,
    2020). Financial behavior, including budgeting, saving, and borrowing habits,
    is another crucial determinant (Khalisharini et al., 2022). Socioeconomic factors
    such as education level, income, gender, and cultural background also significantly
    influence financial literacy levels (Ndou,, 2023). Typically, individuals with
    higher education and income levels exhibit greater financial literacy, while younger
    individuals and males tend to demonstrate higher literacy levels (Wagner, 2019).
    Access to financial education and resources, such as formal'
