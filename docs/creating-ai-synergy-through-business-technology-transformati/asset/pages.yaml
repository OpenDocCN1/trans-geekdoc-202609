  md: '# Role of CV and AR in E-Commerce


    Deep learning combined with AR and CV helps customers to overlay virtual information
    to real recommendation, world. Image based product recommendation, product visualization
    and virtual try-on, enhanced product information, product searching are certain
    applications that are provided by the AR, CV. Deep learning methods enhance the
    role of CV and AR. DL methods such as CNN, generative neural network, graph neural
    networks, and recurrent neural network with their different variations help to
    enhance the e-commerce features (Singh, Singh, & Gupta, 2020). In this section
    we explain the role and use of CV and AR in various e-commerce applications with
    DL algorithms.


    # Product Recommendation System


    In virtual world when a customer visits on e-commerce platform to find and explore
    product. How visual search and recommendation suggest similar products, When a
    customer visits an online shop and wants to search dress CV provide an option
    for visual search by visual catalog for the product or customer can upload their
    desired image to search similar product. Figure 2 makes understanding how CV and
    DL models help a customer in searching their desired product and form their past
    data also recommend the suggestion. For example if a customer wishes to search
    a particular dress/attire then customer simply search it by submitting the images
    of the dress in the system. Following steps are performed to recommend the similar
    dress to the customer.


    # Preprocessing


    A set of product images from the dataset as input. Preprocessing phase applies
    necessary action to transform and prepare for feature extraction. The process
    prepares the images for feature extraction.


    # Feature Extraction


    Feature extraction depends on various factors such as the types of the input data
    and image, availability of labeled and unlabeled data and resources. Various DL
    models such as CNN, RNN, GNN are used and all are depending on the factors of
    feature extraction.


    In E-commerce CV are used for images and video processing to create recommendation
    systems. CNN work on supervised learning used various algorithms to classify the
    images and video by using regression and loss function.CNN are'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'a class of DL algorithm and used for image recognition and image classification.
    CNN helps to analyze deep association with different set and help to tag them
    and trained the data (Rong et al., 2021). As per the past research shows CNN and
    ResNet-50 are better approach for image based search (Kumar et al., 2023). Deep
    CNN: Type of CNN with large numbers of layers is mainly used to detect complex
    object detection and patterns. Neural network: are inspired by human brain neurons.
    They interconnected to each other called neurons and on different layers using
    weight computation. In e-commerce it helps in pattern matching, image classification,
    NLP and segmentation et. There are various variations used are AR with chaotic
    neural networks based on chaos theorem, this method used to find not changeable
    features first, is used to define global feature matching (Nandhini et al., 2022).


    Generative neural network is a well-known DL algorithm used to generate new training
    data with the same statistics. It provides a virtual try on feature in ecommerce
    (Kumar, 2018). All the methods are used to convert preprocessed images to vector
    images.


    After getting vector images, we apply ML classifiers, to find the similar product
    nearest neighbor (Addagargla & Amalanathan, 2020). Additionally previous research
    also used unsupervised methods for the recommendation system K-Mediod, Agglomerative,
    Brich, and the Gaussian Mixture Model (GMM) (Addagargla & Amalanathan, 2021).
    The use of this model to train for similar products for search visual query.


    # Recommendation Engine


    The output generated by the system for the corresponding product in the visual
    representation. This system helps the customer to provide each and every possible
    detail about the product and helps to increase the customer satisfaction in online
    shopping. Additionally, this system used metadata to elaborate more options and
    provide personalized recommendation systems on the basis of past browsing history,
    feedbacks, their buying patterns and other details to refine the recommendation
    results.'
