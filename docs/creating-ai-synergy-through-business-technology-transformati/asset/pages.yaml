- pgno: 406
  md: 'Revenio C. Jalagat, Jr. is presently employed in Al-Zahra College for Women
    in the Sultanate of Oman since 2013 and as Associate Professor in 2023. He had
    a total accumulated experience of 20 years in both the industry serving as Accountant,
