    utilize Instagram, YouTube, and TikTok to disseminate engaging content formats
    such as videos, blogs, and interactive posts, making complex financial concepts
    more digestible and relatable.


    # Challenges and Ethical Considerations in Influencer Content


    The emergence of influencers has significantly contributed to democratizing financial
    knowledge and enhancing financial literacy among the public. However, concerns
    regarding transparency, ethics, and the reliability of financial advice on social
    media have surfaced. Many finfluencers lack of formal qualifications in finance,
    raising questions about the accuracy and credibility of their information. (Partharthy,
    2023). The potential for conflicts of interest due to lucrative brand partnerships
    further undermines the integrity of their recommendations. In response, regulatory
    bodies like the Securities and Exchange Board of India (SEBI) have tightened restrictions
    and promoted greater transparency and accountability among finfluencers (Tiwari,
    2024). Efforts to enhance financial literacy among finfluencers and their followers
    are underway to ensure a more informed audience. SEBI has raised concerns about
    finfluencers misleading the audience with unsolicited opinions on investment and
    stock trading. The regulatory body’s consultation paper aims to address this issue,
    proposing penalization for unregistered entities using the name of SEBI-registered
    entities and making it mandatory for influencers to display their registration
    number alongside their name and qualifications. The guidelines also clarify that
    financial advice influencers must possess appropriate credentials, such as a license
    from the Insurance Regulatory and Development Authority of India (IRDAI) or be
    a qualified chartered accountant. (Burugala, 2024).'
