- pgno: 294
  md: '+   - Wind Turbines: Wind turbines harness the kinetic energy of wind to generate
    electricity. Onshore and offshore wind farms are increasingly common and are a
    rapidly growing source of renewable energy.

    - Hydropower: Hydropower systems use the energy of flowing or falling water to
    generate electricity. Dams and small-scale hydro installations are used for power
    generation.

    - Geothermal Energy: Geothermal power plants utilize heat from within the Earth
    to generate electricity. This source of energy is reliable and sustainable, with
    minimal environmental impact.

    - Biomass Energy: Biomass energy uses organic materials, such as wood, agricultural
    residues, and waste, to produce heat, electricity, and fuels. Biomass can be a
    carbon-neutral energy source when managed sustainably.

    - Tidal and Wave Energy: Tidal and wave energy systems capture the energy from
    the movement of ocean tides and waves, providing a predictable and renewable source
    of power.

    - Hydrogen Fuel Cells: Hydrogen fuel cells convert hydrogen gas into electricity,
    emitting emitting water and heat. They can be used in transportation and stationary
    power applications.

    - Concentrated Solar Power (CSP): CSP technology uses mirrors or lenses to concentrate
    sunlight onto a small area, generating high-temperature heat. This heat is used
    to produce electricity, typically by driving a steam turbine.

    - Ocean Thermal Energy: Ocean thermal energy conversion (OTEC) systems use the
    temperature difference between warm surface water and cold deep seawater to produce
    electricity and desalinated water.

    - Microgrids and Smart Grids: Smart grid technologies improve the integration
    of renewable energy sources into the grid enabling better management and distribution
    of electricity, reducing waste and improving grid reliability.

    - Energy Storage Systems: Battery technology and energy storage systems are essential
    for capturing excess energy generated by renewables and providing it when needed,
    ensuring a stable and continuous power supply.

    - Waste-to-Energy: Waste-to-energy facilities incinerate waste materials to generate
    heat and electricity, reducing landfill use and converting waste into useful energy.

    - Floating Solar: Solar panels can be installed on floating platforms of water,
    providing dual benefits of solar power generation and reduced water evaporation.'
