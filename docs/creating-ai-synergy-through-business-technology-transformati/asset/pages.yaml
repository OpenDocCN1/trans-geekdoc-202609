  md: '# Regression Model Comparison


    This methodological framework undertakes a rigorous examination of regression
    models with the primary objective of assessing and comparing the performance of
    fourteen distinct models based on key metrics, namely R-squared values and Mean
    Squared Error (MSE). A standardized train-test split ratio of 80% training and
    20% testing is used, and the instantiation of fourteen regression models is conducted.


    +   a) Random Forest Regression:


    In this research, the Random Forest Regression (RFR) utilizes the Gini Index for
    selecting variables, enabling the trees to reach their maximum depth without undergoing
    pruning. This method, proposed by Breiman (1999), is advantageous over M5 trees
    because it mitigates overfitting as the number of trees increases, resulting in
    a low generalization error.


    +   b) Gradient Boosting Regressor


    Boosting is a powerful ensemble technique that sequentially addresses poor base
    models to improve overall classifier performance. Gradient Boosting Regression
    (GBR) proposed by Freund and Shapire (1996) extends this concept, optimizing a
    differentiable loss function to create an ensemble of decision trees with natural
    data handling, high predictive accuracy, and robustness to outliers. Its flexibility
    in choosing loss functions adds versatility.


    +   c) XGBoost


    XGBoost, crafted by Chen and Guestrin (2016), stands out as a widely acclaimed
    and scalable machine learning framework founded on gradient tree boosting. Notable
    attributes encompass an innovative tree learning algorithm tailored for sparse
    datasets, a procedure utilizing weighted quantile skeletos, and capabilities for
    parallel/distributed computing, enhancing its efficacy in model exploration.


    +   d) LightGBM


    LightGBM proposed by Ke et al. (2017) is a paradigm-shifting gradient boosting
    decision tree (GBDT) model designed for enhanced efficiency and scalability. Its
    innovative methodologies, such as Gradient-based One-Side Sampling and Exclusive
    Feature Bundling, facilitate swift training and deployment, effectively tackling
    past issues associated with GBDTs.


    +   e) CatBoost


    CatBoost proposed by Prokhenkova et al. (2019)is a gradient-boosting decision
    tree (GBDT) model specifically tailored for categorical features. By introducing
    an ordered permutation-driven boosting algorithm and a unique approach for handling
    categorical features, CatBoost addresses the'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'challenges of exponential feature combination growth. The model stands out
    by efficiently converting non-numerical data into integers through a series of
    steps, enhancing performance in scenarios where the number of categories is substantial.


    +   f) K-nearest Neighbor

    nThe KNN algorithm, introduced by Hastie et al. (2009), serves as a flexible supervised
    learning method applicable to both classification and regression tasks, particularly
    in scenarios characterized by constrained data availability. By calculating distances
    between a query point and training examples, selecting the k-nearest instances,
    and averaging their labels for regression, KNN offers a simple yet powerful predictive
    model.


    +   g) Ridge Regression

    Ridge regression proposed by McDonald (2009) is a crucial method in addressing
    multicollinearity challenges within multiple linear regression models. This approach,
    characterized by its effective formulation and advantageous properties, introduces
    a penalty term to prevent overfitting and enhances the generalization capability
    of the model. The study not only outlines the four rationale behind the ridge
    estimator also delves into the algebraic properties, shedding light on how coefficients
    behave across different range parameters.


    +   h) Lasso Regression

    The Lasso, a regression method proposed by Tibshirani (1996) minimizes the residual
    sum of squares while constraining the sum of absolute coefficients, resulting
    in some coefficients being precisely zero for interpretable models. Simulation
    studies indicate that it combines the interpretability of subset selection and
    the stability of ridge regression.


    +   i) RANSAC

    Random Sample Consensus (RANSAC) proposed by Bolles and Fischler (1981) is a robust
    two-step fitting procedure that adapts a distinctive filtering technique, contrary
    to conventional smoothing approaches. Operating with a minimal initial dataset,
    RANSAC progressively expands it by assessing compatibility with a model, making
    it resilient to outliers and noise. Its adaptability extends to various tasks,
    such as fitting models to unknown structures, making it particularly valuable
    in computer vision and image processing.


    +   j) GAMnThe Generalized Additive Model (GAM), proposed by Liu (2008), serves
    as a versatile statistical framework with wide-ranging applications in prediction
    across diverse fields. Utilizing the back-fitting algorithm,'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'a universally applicable technique for fitting additive models, GAM adeptly
    captures intricate nonlinear associations between dependent and independent variables
    in exponential family and likelihood-based regression models.


    # k) Huber Regression


    Huber regression proposed by Feng and Wu (2022), plays a crucial role in handling
    outliers and heavy-tailed noise, making it resilient and reliable in various applications.
    Its significance is particularly pronounced in the statistical learning context,
    where understanding its behavior in nonparametric scenarios remains a challenge.


    # l) Quantile Regression


    Quantile regression, a statistical technique, proposed by Koenker (2005) extends
    traditional linear regression by modeling quantiles, providing a comprehensive
    view of the data distribution. Its advantages lie in robustness to outliers and
    the ability to analyze various points in the distribution, making it valuable
    for capturing diverse data patterns. Applications span economics, finance, and
    healthcare, where understanding conditional quantiles enhances insights into phenomena
    with varying levels of impact.


    # m) RBF Kernel Regression


    The RBF Kernel Regression, proposed by Kuo et al. (2013), presents an approach
    to enhance the radial basis function parameter in support vector machines. This
    is achieved by assessing the separability of feature space using a criterion that
    amalgamates both between-class and within-class information. Notably, the Automatic
    Parameter for RBF (APR) method accelerates soft-margin SVM training, efficiently
    selecting the most suitable RBF kernel function parameters. This holds significant
    advantages, enhancing computational performance and overall efficiency in SVM
    applications, particularly in fields like machine learning and pattern recognition
    when SVMs are central.


    # n) SGD Regression


    Stochastic Gradient Boosting (SGB) proposed by Friedman (2002) is a machine learning
    algorithm that enhances the traditional gradient boosting method by introducing
    randomness during the training process, leading to improved generalization and
    efficiency. Its advantages include robustness to overfitting, scalability, and
    the ability to handle large datasets.'
