    # ABSTRACT


    Financial literacy, a cornerstone for stability and empowerment in today''s economic
    landscape, is set to be revolutionized. Finfluencers, individuals with significant
    financial acumen and a robust digital platform presence, are shaping audiences''
    financial attitudes and behaviors. This study introduces a conceptual framework
    based on the decomposed theory of planned behavior (DTPB) that holds the potential
    to transform how we understand and implement financial education. The unique aspect
    of this framework is its incorporation of Finfluencers as critical influencers
    in adopting AI chatbots for financial education. For instance, the model can predict
    the likelihood of a Finfluencer endorsing an AI chatbot for financial education
    based


    DOI: 10.4018/979-8-3693-4187-2.ch008'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'on their attitudes, subjective norms, and perceived behavioral control. Despite
    the widespread use of DTPB across various disciplines, a research gap exists in
    understanding the determinants of intention and behavior concerning adopting AI
    chatbots for financial education.


    # INTRODUCTION


    The dawn of the twenty-first century marks a pivotal juncture characterized by
    the seismic impact of the COVID-19 pandemic, delineating a clear demarcation between
    the pre-COVID and post-COVID epochs. As societies navigate this landscape, technology
    has emerged as a cornerstone of resilience and adaptation, driving unprecedented
    transformations across global economies (Srisadhan & Naruethadharhol, 2022). This
    accelerated adoption of advanced technologies, such as artificial intelligence
    (AI) and deep intelligence, signifies a profound shift towards a tech-centric
    civilization. This shift is characterized by the increasing integration of technology
    into various aspects of our lives, from healthcare and education to business operations.
    (McKinsey Global Surveys, 2021: A Year in Review, 2021) report that the pandemic
    accelerated digital adoption by three to four years, significantly influencing
    healthcare, education, and business operations. AI-driven solutions like predictive
    analytics and telemedicine proved instrumental in managing the pandemic''s challenges,
    optimizing resource allocation, and enhancing patient care (Chalutz Ben-Gal, 2023).
    In education, digital learning platforms ensure that students can continue their
    education despite closures, highlighting the potential of technology to bridge
    gaps in access and quality of education (Dhawan, 2020). Likewise, AI in business
    facilitated process automation, improved decision-making, and enhanced customer
    service through innovations like chatbots and virtual assistants (Pendy, 2023).
    The pandemic underscored the critical need for resilient technological solutions,
    prompting increased investments in digital tools and innovations across industries
    to bolster continuity and adaptability (Brynjolfsson et al., 2020).


    Concurrently, the pervasive influence of social media continues to permeate the
    fabric of contemporary existence, manifesting in multifaceted domains ranging
    from communication and information dissemination to entertainment, marketing,
    e-commerce, and virtual interactions. Social media platforms have become indispensable
    for real-time communication and engagement, facilitating global connectivity and
    community-building during periods of social distancing (Cinelli et al., 2020).
    The integration of AI and social media analytics has further amplified the impact
    of digital platforms, enabling businesses to personalize customer interactions,
    target specific demographics, and measure campaign effectiveness with'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'unprecedented granularity. This transformative period highlights the necessity
    and potential of technology to drive societal resilience, economic recovery, and
    future growth in a post-pandemic world.


    The COVID-19 pandemic has also brought financial wellness to the forefront, as
    many individuals have been exposed to economic downturns and financial insecurity
    (Anand et al., 2021). This exposure highlighted the detrimental effects of financial
    illiteracy, exacerbating issues such as inadequate retirement savings, debt accumulation,
    and lack of insurance coverage (Naidu, 2017). A study by the (National Endowment
    for Financial Education and the Council for Economic Education Policy Convening
    Initiative, 2021) found that 70% of Americans reported increased financial stress
    due to the pandemic, underscoring the urgent need for improved financial literacy.
    The Organization for Economic Co-operation and Development (OECD, 2011) defines
    financial literacy as skills, knowledge, attitudes, and behaviors necessary for
    sound financial decision-making and overall well-being. Financial literacy is
    essential for empowering individuals to make informed financial decisions, effectively
    manage risks, and plan for their future financial well-being (Prihartanti et al.,
    2022). Despite its significance, formal education systems in many developing nations
    struggle to promote financial literacy adequately, contributing to continued financial
    instability (Muliana et al., 2023).


    In response to these needs and challenges in financial education, the rise of
    “influencers” – individuals who wield significant influence on social media platforms,
    focusing primarily on personal finance, investment strategies, and financial literacy—has
    emerged as a notable trend (Singh & Sarva, 2024). These influencers play a crucial
    role in sharing valuable insights, recommendations, and personal experiences to
    educate and empower their audience to make informed financial decisions, thus
    democratizing financial literacy and influencing consumer financial behavior through
    engaging content and real-time updates. Their influence is not just in disseminating
    financial knowledge but also in making complex concepts more understandable and
    relatable to their audience. According to a survey by The Financial Brand (2022),
    65% of millennials and Gen Z follow at least one influencer on social media, indicating
    the significant impact these influencers have on younger generations. This influence
    is significant in the digital age, where traditional financial education methods
    may struggle to engage audiences effectively due to limited attention spans and
    prevalent information overload (Setiawan et al., 2022).


    Integrating AI chatbots within financial literacy marks a significant stride forward,
    leveraging advancements in artificial intelligence and natural language processing.
    Recent years have witnessed remarkable progress in the artificial intelligence
    and natural language processing technologies (Gatzioufa & Saprikis, 2022). Chatbots,
    also known as artificial intel-'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'gence (AI) agents, can be characterized as “software entities facilitating
    automated communication through the application of natural language processing,”
    (Farazouli et al., 2024). By leveraging machine learning algorithms, these AI
    agents enable real-time responses to financial inquiries, personalized budgeting
    advice, and tailored investment recommendations, democratizing access to financial
    knowledge for individuals who may lack traditional avenues for financial counseling.
    Their ability to analyze user data ensures that advice is customized to individual
    financial circumstances, enhancing the relevance and effectiveness of financial
    guidance compared to conventional one-size-fits-all approaches.


    Moreover, AI chatbots enhance financial literacy''s accessibility, particularly
    in underserved communities and developing regions where traditional financial
    education resources are scarce. Accessible via smartphones and digital devices,
    AI chatbots bridge educational gaps by delivering financial knowledge remotely.
    This technological accessibility promotes financial inclusion globally and empowers
    users with the skills and confidence to navigate their financial futures effectively.
    As AI chatbots evolve, their role in making financial education engaging and understandable
    through interactive interfaces and personalized content methods underscores their
    potential to transform how financial literacy is disseminated and embraced in
    the digital age.


    The successful implementation of AI chatbots in financial education hinges significantly
    on the intentions and strategies of finfluencers leveraging this technology to
