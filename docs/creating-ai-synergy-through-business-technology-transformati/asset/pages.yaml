  md: '# METHODOLOGY


    This study is descriptive in nature. It applies to reviewing and synthesizing
    existing literature including secondary data sources. It involves a thorough review
    of the available literature, and empirical studies form part of an academic database,
    books, journals, reports, and relevant websites. With the help of secondary data
    sources, this study seeks to aggregate and analyze insights about the role and
    effect of AI in modern accounting practice to get a comprehensive overview of
    the effect of AI on efficiency, accuracy, and strategic decision-making in accounting.


    # RESULTS AND DISCUSSION


    # How is AI Used in Audit?


    The incorporation of AI into accounting and auditing significantly enhances the
    efficacy and scope of audit processes. Machine learning programs, proficient in
    analyzing extensive financial datasets, quickly identify anomalies such as duplicate
    payments and signs of fraudulent activities. Additionally, AI extends its capabilities
    to "read" and interpret data from contracts and internal notes, delivering critical
    insights during analysis of financial statements. This review and analysis by
    AI not only identifies existing issues but also reveals new opportunities. Below
    are several key applications of AI in the auditing process:


    +   1. **Data Analytics**: AI excels in processing and analyzing large volumes
    of structured and unstructured data rapidly. Internal auditors use AI-driven data
    analytics to detect patterns, anomalies, and trends that might indicate areas
    of risk, inefficiency, or malpractice. This allows auditors to be more proactive
    in addressing potential issues before they escalate.

    2. **Continuous Auditing**: AI facilitates continuous auditing by automating the
    routine tasks of data collection and analysis. This enables real-time monitoring
    and reporting of an organization''s financial status and operations, allowing
    auditors to provide timely insights and enhance decision-making processes. Continuous
    auditing also helps in maintaining compliance with regulatory standards and internal
    policies.

    3. Fraud Detection**: AI algorithms are particularly effective at identifying
    irregular transactions and patterns that may suggest fraudulent activity. By analyzing
    transaction data, AI can flag unusual activities based on historical data and
    predictive behaviors, enabling auditors to investigate and respond to potential
    fraud more swiftly.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '4. Natural Language Processing (NLP): NLP is a branch of AI that helps computers
    understand, interpret, and manipulate human language. In internal auditing, NLP
    is used to analyze textual data from various sources like emails, contracts, and
    business documents. This helps auditors extract relevant information, understand
