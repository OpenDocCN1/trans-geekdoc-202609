    When human dignity ceases because of the AI replacement, reputation, credibility,
    and trust also cause.


    In the aspect of technical and organizational challenges in AI implementation,
    common challenges comprise the lack of skills, lack of culture, lack of data,
    and lack of infrastructure. The lack of skills hindered the effective deployment
