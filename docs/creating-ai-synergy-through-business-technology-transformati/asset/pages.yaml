  md: '# THEORETICAL FOUNDATION: DECOMPOSED THEORY OF PLANNED BEHAVIOUR


    Technology adoption is selecting technology for use by individuals or organizations(Gangaiamaran
    & Anil Premraj, 2020). Various models have been proposed to predict intentions
    toward adopting technology (IT), including the Diffusion of Innovation Theory,
    Theory of Reasoned Action, Theory of Planned Behavior (TPB), Social Cognitive
    Theory, Technical Adoption Model, Unified Theory of Acceptance and Use of Technology,
    and the Decomposed Theory of Behavior (DTPB)(Lai, 2017). Among these models, TPB
    and its extension, DTPB, have gained considerable attention for their effectiveness
    in anticipating technology adoption across diverse domains.


    (Taylor & Todd, 1995), introduced DTPB, expanding the TPB framework to provide
    a more complex view of behavior. DTPB combines elements of the Innovation Diffusion
    Theory with the Technology Acceptance Model, offering insights into how individual
    attributes influence technology adoption. Rooted in the Theory of Reasoned Action
    (TRA) by Icek Ajzen and Martin Fishbein and later extended into TPB (Ajzen, 1991),
    DTPB introduces a nuanced perspective by decomposing key constructs and incorporating
    additional variables. Unlike TPB, DTPB breaks down constructs into more specific,
    multidimensional belief structures, allowing for a finer-grained analysis of intention
    and behavior antecedents, thereby enhancing predictive power and explanatory depth.


    Research suggests that DTPB outperforms TPB and other models in predicting adoption
    intentions. For example, Taylor and Todd''s (1995) found that DTPB predicts the
    intention to use internet-based services better than TPB(Shih & Fang, 2004). Composing
    critical factors and including normative and control beliefs account for more
    significant variance in behavioral intention. One of DTPB''s strengths lies in
    its comprehensive nature, incorporating elements from other theoretical models
    like TAM and Innovation Diffusion Theory. For instance, including compatibility
    and use of factors from TAM enhances DTPB''s applicability to technology adoption
    contexts.


    DTPB has been applied across diverse domains, including healthcare, education,
    mobile commerce, and finance, with promising results (Kanimozhi & Selvarani, 2019).
    In healthcare, DTPB has been used to understand factors influencing patients''
    intentions to adopt telemedicine services (Oei et al., 2024), while in the financial
    technology (Fintech) sector, the Decomposed Theory of Planned Behavior (DTPB)
    has been effectively utilized to investigate the factors influencing consumers''
    adoption of various financial innovations, including mobile payment systems, cryptocurrencies,
    online banking services, and investment platforms (A. et al., 2023). In the education
    sector, the Decomposed Theory of Planned Behavior (DTPB) is applied'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'to understand the factors influencing students'' and educators'' adoption of
    e-learning technologies and digital educational tools (Chien et al., 2018) (Nyasulu
    & Dominic Chawinga, 2019). DTPB distinguishes between attitudinal, normative,
    and control beliefs, each comprising subdivisions, enabling a precise examination
    of factors shaping behavioral intentions and actions(Durac & Moga, 2023). Attitudinal
    beliefs encompass perceived usefulness, compatibility, and ease of use, drawing
    from innovation theory. Based on interpersonal behavior theory, normative beliefs
    are divided into peer and superior influences. Control beliefs, rooted in self-efficacy
    theory, are decomposed into self-efficacy and resource-facilitating conditions.
    Figure 1 illustrates the Decomposed Theory of Planned Behavior (Ghani et al.,
    2017).


