- pgno: 14
  md: '# Chapter 15

    Decoding Work-Life Balance Conundrum: A Meta-Learning Prediction Approach..........................................
    313


    Sajidha S. A., Vellore Institute of Technology, Chennai, India

    Deepshika Vijayanandan, Vellore Institute of Technology, Chennai, India

    Madhumitha Rajagopal, Vellore Institute of Technology, Chennai, India

    Dhanush Basambivasam, Vellore Institute of Technology, Chennai, India

    Nisha V. M., Vellore Institute of Technology, Chennai, India


    To unravel the complex facts of optimal equilibrium between professional commitments
    and personal life, this research delves into the intricacies of work-life balance
    dynamics, employing machine learning to predict factors influencing equilibrium.
    A stacking-ensemble method utilizes the mutual complementary effects of the base
    models to improve the performance with better generalization of the model. ML
    algorithms including gradient boosting algorithm, ridge regression, lasso regression,
    sgd regressor, support vector regressor (SVR), k neighbours regressor, kernel
    ridge regressor, RANSAC regressor, K means boosting algorithm, and generalized
    additive model (GAM) were trained meticulously. Fine-tuning the performance of
    random forest performance having R2 value of 0.9353, the lowest using the stacking
    ensemble to 0.9999 was performed. The base model combinations encompass a wide
    array of techniques with random forest as meta learner gave a notable improvement
    in its prediction performance.


