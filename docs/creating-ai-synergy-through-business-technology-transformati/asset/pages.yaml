- pgno: 72
  md: '# AI in Organizations


    In the context of organizations, the initial stages of AI research emerged in
    the 1960s, focusing on facilitating decision-making processes (Buchanan & O''Connell,
    2006). During this time, AI primarily addressed problems that could be represented
    using mathematical formulas (McCarthy & Hayes, 1981; Siklósy, 1970). Remember
    that AI has been an integral part of the business world since the 1980s. Many
    companies have invested significantly in developing and implementing computer
    vision systems, robotics, expert systems, as well as software and hardware for
    these purposes (Boden, 1984; Russell & Novig, 2010). It''s worth noting that AI
    was already being recognized at that time as a strategic tool to enhance organizational
    competitiveness in a rapidly evolving business environment (Holloway, 1983; Porter
    & Millar, 1985).


    Prior to the year 2000, computer science research in the field of AI focused on
    developing algorithms to create new approaches or enhance existing ones (Zhuang,
    Wu, Chen, & Pan, 2017). From 2001 onwards, researchers highlighted that the main
    challenge for AI lies in the vast volume of data present in large databases (Russell
    & Novig, 2010). As a result, new AI techniques were developed (Brynjolson & McAfee,
    2017; Zhuang et al., 2017) thanks to advancements in hardware. This technological
    advancement is attributed to the emergence of big data, characterized by the fusion
    of technology, methodology, and analytical capacity to search, aggregate, and
    cross-reference large datasets to identify patterns and gain insights (Boyd &
    Crawford, 2012).


    In 2016, the Google DeepMind team showcased the remarkable potential of AI technology
    with AlphaGo, a computer program that uses deep learning to play the ancient game
    of Go. Unlike traditional AI, AlphaGo was not programmed with specific moves or
    rules but instead learned from human experts and self-play. This approach allowed
    AlphaGo to challenge and defeat the world champion, Lee Sedol, in a five-game
    match, showcasing its creativity and ability to generate new insights in Go. This
    ground-breaking achievement marked a significant advancement in the history of
    machine learning.


    The rapid advancement of AI in recent years can be attributed to three main factors:
    the abundance of data, enhanced algorithms, and significantly improved computational
    hardware (Brynjolson & McAfee, 2017). This progress has captured the interest
    of major technology-focused companies, leading to the provision of machine learning
    infrastructure in the cloud by companies as Google, Amazon, Microsoft, Salesforce,
    and IBM. This has made cognitive technologies more accessible and easier to use
    (Brynjolson & McAfee, 2017; Davenport, 2018; Marr & Ward, 2019; Venkatraman, 2017).'
  merge: -1
  img_proc: true
