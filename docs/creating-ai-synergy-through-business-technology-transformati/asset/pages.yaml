    also research scholar pursuing her PhD at Visvesvaraya Technological University,
    Belgaum.I have 16 years of Teaching Experience.Topic of interest includes Computer
    Vision, Artificial Intelligence,Machine Learning,Deep Learning.


    Annie Isaac is a distinguished academic and researcher with a robust backbone
    in finance and education. She earned her Master of Commerce (M.Com) degree from
    Kristu Jayanti College, Bengaluru, from 2016-2018. Further advancing her expertise
    in education, she completed her Bachelor of Education (B.Ed) from Christ College,
    Bhopal. Annie has significant experience in academia, having worked as Assistant
    Professor, where she contributed to her students'' academic growth and professional
    development. Her commitment to education and research has been evident throughout
    her career. Annie Isaac is pursuing her Ph.D. in Finance at Christ (Deemed to
    be University), Bengaluru. Her research focuses on various facets of finance,
    aiming to contribute new insights and advancements. Her academic journey and professional
    experiences highlight her dedication to finance and education, making her valuable
    member of the educational community.'
