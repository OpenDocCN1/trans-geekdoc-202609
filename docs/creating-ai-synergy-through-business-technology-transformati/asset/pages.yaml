  md: '# Research Gap


    The current state of research into financial influencers (finfluencers) is uncharted
    territory. This study aims to fill this gap by providing new insights into how
    finfluencers employ AI chatbots to disseminate financial information. While substantial
    research exists on influencers across various domains, such as beauty, food, travel,
    and sports, there is a noticeable lack of understanding of the influencer phenomenon
    in the financial sector, particularly in adopting AI chatbots for financial literacy.


    Despite the growing prominence of finfluencers in shaping financial behavior,
    most studies have examined influencers in more visually appealing and lifestyle-oriented
    industries, leaving the financial sector relatively unexplored. Previous empirical
    research on chatbot adoption has predominantly concentrated on customer service,
    banking, insurance, and e-commerce (Gatzufa & Sapris, 2022). There is a lack of
    investigation into how AI chatbots can be integrated into financial education,
    specifically by finfluencers, who play a crucial role in disseminating financial
    knowledge and advice to the public.


    This study is the first to develop a framework explicitly tailored for using chatbots
    to enhance financial literacy. By applying the Decomposed Theory of Planned Behavior
    (DTPB), this research aims to uncover the determinants influencing finfluencers''
    inclination to incorporate AI chatbots. The primary purpose of this study is to
    develop a framework for the scope of finfluencers to implement AI chatbots for
    enhancing financial literacy initiatives in future studies.


    This study addresses these gaps and contributes to the existing literature on
    influencer marketing and technology adoption. It also provides practical insights
    for finfluencers and other stakeholders in the financial education ecosystem.
    This research aims to bridge the knowledge gap and support the development of
    more effective strategies for using AI chatbots to promote financial literacy.
    Moreover, it seeks to foster further studies to implement AI chatbots in financial
    education and other core areas, ultimately enhancing individuals'' financial knowledge
    and promoting financial well-being and resilience.'
