  md: '# KEY TERMS AND DEFINITIONS


    **Artificial Intelligence:** Artificial intelligence popularly abbreviated as
    AI refers to computer systems that simulate human intelligence processes. These
    processes involve learning, reasoning and correction. To perform tasks traditionally
    carried out by human intelligence, AI systems are designed.


    **Business Process Management:** In order to achieve more effective results, better
    customer satisfaction, and overall business efficiency, BPM is a systematic approach
    to improving the organization''s processes. In order to align business processes
    with organizational objectives and targets, BPM involves the design, implementation,
    monitoring and optimization of these processes.


    **Cognitive Decision Making:** Cognitive Decision Making refers to the process
    through which people or systems use their cognitive skills to evaluate available
    information, assess potential options and decide what course of action is best
    for them.


    **Data Management:** In order to guarantee the accuracy, accessibility, reliability
    and security of data over their life cycle, data management is a process by which
    data are acquired, stored, organized and managed. Various activities, such as
    data collection, storage, integration, transformation, analysis and dissemination,
    are involved.


    **Malicious Intrusions:** Unauthorized access or penetration into computer systems,
    networks or digital environments with malicious intent is called malicious intrusions,
    also known as cyber intrusions or security breaches.'
