    et al. (2011), features the quality of using collaborative filtering strategies
    in augmenting customer satisfaction and accuracy of the strategy deployment. The
    results of which enable retailers to reduce stockouts, minimize the excessive
    cost of inventory, and raise inventory levels. Fildes et al. (2019) supported
    the above findings by displaying the effectiveness of demand forecasting models
    powered by AI in enhancing inventory management and retailers’ profit-'
  merge: -1
