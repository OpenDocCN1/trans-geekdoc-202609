  md: '# Chapter 14


    Cloud-Based Visualization Techniques for Big Data: A Survey of Platforms and Algorithms
    ............................................ 301


    Vimuktha Evangeleen Salis, Global Academy of Technology, India

    Sharmila Chidravalli, Global Academy of Technology, India


    In our rapidly evolving landscape, the realm of big data has gained prominence
    across sectors like healthcare, finance, and e-commerce. However, deciphering
    the vast amounts of generated data presents a significant challenge. Visualization
    techniques prove invaluable in making sense of this data, but traditional methods
    fall short. Enter cloud-based visualization platforms and algorithms, offering
    scalable and cost-effective solutions to tackle big data visualization challenges.
    This chapter embarks on a survey, comparing these platforms and algorithms based
