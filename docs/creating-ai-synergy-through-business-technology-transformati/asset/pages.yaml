    The decision-making process is an important part of every organization, and numerous
    scholars who create Decision Support Systems (DSS) readily accept H. Simon’s approach,
    as seen in Figure 3. This paradigm is broken into four stages: cognition, design,
    decision- making, and issue comprehension. During the design phase, they identify
    requirements, develop a model, and investigate various solutions. During the selecting
    phase, a choice or decision is made, and the decisionmaker follows through on
    it and learns during the implementation phase.'
