  md: '# RESEARCH METHODOLOGY


    # Objectives


    +   1. To examine the existing literature on financial literacy, finfluencer studies,
    AI chatbots, and the Decomposed Theory of Planned Behavior (DTPB) to develop a
    comprehensive model for future studies aimed at adopting AI chatbots for finfluencers.

    2. Develop a conceptual framework to elucidate the factors impacting finfluencers''
