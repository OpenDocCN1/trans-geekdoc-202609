  md: '# CONCEPTUAL MODEL FOR FINLUENCERS TO IMPLEMENT AI CHATBOTS


    This study customizes the Decomposed Theory of Planned Behavior (DTPB) framework
    to include factors unique to finfluencers’ intent to use AI chatbots. The model
    aims to explain finfluencer behavior by investigating the interaction of beliefs,
    attitudes, intentions, and actual behavior in the context of adopting chatbots
    for financial education. Using Taylor and Todd’s (1995) approach, the essential
    elements of attitudes, subjective norms, and perceived behavioral control are
    broadened to better capture the factors influencing individual intentions to accept
    AI chatbots among finfluencers.


    Main factors influence attitudes towards technology adoption: perceived usefulness
    (how much users think technology will improve their job performance), perceived
    ease of use (how easy users believe it is to use the technology), compatibility
    (how well the technology fits with users’ values and needs). This study broadens
    these elements to include five key factors: perceived usefulness, perceived ease
    of use, perceived compatibility, perceived trustworthiness, and perceived customization.
    Perceived usefulness refers to finfluencers’ beliefs about the effectiveness of
    AI chatbots in enhancing their financial education content creation and dissemination.
    Finfluencers who perceive AI chatbots as practical tools for increasing engagement,
    improving content quality, and streamlining workflow are more likely to have positive
    attitudes toward their adoption. Ease of Use pertains to finfluencers’ perceptions
    of the ease with which they can integrate AI chatbots into their existing content
    creation processes. Finfluencers who find AI chatbots user-friendly and intuitive
    are more likely to have favorable attitudes toward their adoption. Perceived Compatibility
    relates to how well AI chatbots fit with finfluencers’ existing content creation
    strategies, personal brand identity, and audience preferences. Influencers who
    see AI chatbots as compatible with their goals, values, and target audience will
    likely adopt them. Perceived trustworthiness involves finfluencers’ perceptions
    of AI chatbots’ reliability, accuracy, and credibility in delivering financial
    information. Influencers who trust AI chatbots will likely have positive attitudes
    toward their adoption. Perceived Customization is about finfluencers’ beliefs
    in their ability to customize and personalize AI chatbot interactions to align
    with their content style, tone, and audience preferences. Influencers who see
    AI chatbots as customizable tools will likely have positive attitudes toward their
    adoption.


    Subjective norms encompass two components: peer influence and authority influence,
    as outlined by (Taylor & Todd, 1995) Subjective norms in this context encompass
    peer influence, industry trends, and authority influence. Peer Influence means
    that finfluencers are swayed by the endorsements and recommendations of'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'their peers within the financial education community. Positive endorsements
    from influential finfluencers who have successfully integrated AI chatbots can
    enhance perceptions of their credibility and effectiveness, thus influencing adoption
    intentions. Industry Trends refer to the broader trends and developments in adopting
    AI chatbots in financial education. Positive indications of AI chatbots'' increasing
    popularity, adoption rates, and success stories within the industry can create
    a sense of social pressure and legitimacy, encouraging finfluencers to adopt similar
    technologies to stay competitive and relevant. Authority Influence involves the
    impact of opinions and insights from thought leaders, financial experts, and technology
    experts. Endorsements and recommendations from respected figures regarding the
    benefits and advantages of AI chatbots can bolster finfluencers'' confidence in
    adopting these technologies.


    Behavioral control involves self-efficacy and conditions facilitating resources,
    such as access to capital and technology(Durac & Moga, 2023). Behavioral control
    in the context of chatbot implementation involves self-efficacy, resource-facilitating
    conditions, and technology-facilitating conditions. Self-efficacy refers to finfluencers''
    confidence in navigating and utilizing AI chatbots effectively. Resource-facilitating
    conditions include access to capital, reliable internet access, and dedicated
    time for financial learning, which can motivate finfluencers to adopt chatbots.
    Technology-facilitating conditions pertain to user-friendly interfaces and compatibility.


