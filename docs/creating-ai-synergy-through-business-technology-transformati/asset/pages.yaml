    that have the potential to significantly impact aspects of our lives, industries,
    and society in the near and distant future (Rees, W., & Wackernagel, M. 2013)
    (Song, Y., & Zegeye, A., 2017) (Angel, S., Sheppard, S., & Civco, D. L., 2011).
    These technologies often represent the forefront of scientific research and'
