    # Challenges to AI and Business Technology Transformation


    Undeniably, the implementation of AI has provided enormous benefits in line with
    the business technology transformation. However, it also faced challenges and
    limitations that impact operations and one of the increasing challenges is ethical
    considerations. According to Floridi et al. (2018), ethical challenges related
    to AI have increased due to its impact on human decisions and human lives. Biases
    generated by AI algorithms are inadvertently sourced from historical data attributed
    to ethical issues and need cautious surveillance to avoid discriminatory results
    (Barocas & Selbst, 2016). Moreover, the negative implications of automating routine
    tasks for employees have been emphasized considering job displacement, requiring
    upskilling and reskilling initiatives to train them for the tasks that match AI
    technologies (Bessen, 2019). Other ethical concerns rest on the possibility of'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'misuse, copyright issues, deepfake creation, and implementation of less impactful
    policies and guidelines.


    Privacy and security are paramount challenges with the implementation of AI technology
    as it can cause security and privacy risks, intentionally or unintentionally of
    data algorithms or mechanisms to gather, keep, or process information. Risks in
    security and privacy can negatively impact integrity, confidentiality, and insights,
    and can result in compromises to employees, stakeholders, and customers. Unattended
    risks may involve violating legal, ethical, and social expectations and standards
    that further lead to penalties, liability, and losses. Crucial challenges are
    also prevalent in human dignity and autonomy. The AI implementation can affect
    human dignity and independence because it diminishes the value of respect, worth,
