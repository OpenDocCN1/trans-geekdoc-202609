  md: '# Chapter 4


    Modern Smart Banking With Cutting-Edge Technologies: A Sustainable Banking and
    Financial World ............................................................ 73


    +   M Kiran Kumar, CMS Business School, JAIN University, Bangalore, India

    V. Srinidhi, Community Institute of Management Studies, Bengaluru, India

    B. S. Shanthakum, Surana Evening College, Bengaluru, India

    Amit Kumar Tyagi, National Institute of Fashion Technology, New Delhi, India


    In today''s rapidly changing world/digital landscape, the banking sector is undergoing
    a profound transformation driven by cutting-edge technologies. This chapter examines
    the convergence of smart banking with innovative technologies and explores its
    implications for using sustainability within the financial ecosystem. Modern smart
    banking leverages a constellation of technologies, including artificial intelligence,
    machine learning, big data analytics, and blockchain, to revolutionize traditional
    banking processes and deliver enhanced value to customers. By harnessing these
    technologies, banks can offer personalized financial services, automate routine
    tasks, and optimize decision-making processes, thereby improving operational efficiency
    and customer experiences.


    # Chapter 5


    Harnessing Artificial Intelligence in Internal Auditing: Implementation, Impact,
    and Innovation...........................................................................
    95


    +   Akhil Manuel, Christ University, India

    Senthil Kumar Arumugam, Christ University, India


    The influence of artificial intelligence (AI) on various sectors of the economy,
    its impact on the internal auditing sector is causing increased attention from
    the academic and professional communities. This chapter investigates how AI is
    revolutionizing internal audit and its implications for the future of internal
    audit. By examining numerous literature sources and developments from various
    perspectives, this chapter conducted a comprehensive analysis of how AI is applied
    in various processes of internal auditing. In the current data-reliant business
    society, AI''s capacity to handle vast datasets and perform complex analyses plays
    an important role. The use of AI in internal auditing enhances efficiency, increases
    accuracy, and improves risk management. However, in the process, audit procedures
    fundamentally change. This chapter concludes that AI will significantly change
    the internal auditing process, it will not replace human auditors. AI will alter
    auditing jobs by requiring auditors to learn additional technology.'
