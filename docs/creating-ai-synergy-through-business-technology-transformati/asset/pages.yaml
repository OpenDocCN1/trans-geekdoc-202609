    # # Strategic Use of Technology


    In today''s research landscape, AI tools fall under the umbrella of Information
    Technology (IT). IT is a multifaceted aspect that encompasses human, organizational,
    and administrative aspects, including information systems, data processing, software
    engineering, and hardware and software (Keean, 1993; Porter & Miller, 1985).


    It is crucial to adopt a comprehensive definition of IT that takes into account
    both technological aspects and considerations related to workflow, person, and
    information. Porter and Miller (1985) propose a broad definition of IT which covers
    the information generated and utilized by businesses, as well as a diverse range
    of interconnected and integrated technologies involved in processing this information
    (Porter & Miller, 1985).


    Despite the surge in the digital era, the impact of IT on organizations is not
    a recent phenomenon. As since the early 1970s, researchers were already discussing
    the potential of IT to influence organizational competition (Benjamin, Rockart,
    Morton, & Wyman, 1983; Henderson & Venkatraman, 1992; Keean, 1991; King, 1978;
    McFarlan, 1984; Porter, 1979; Laurindo, 2008; Luftman, Lewis, & Oldach, 1993).
    Some scholars began using the term "strategic use" to describe how IT can shape
    new business strategies or support existing ones, providing significant value
    to businesses (Frangou, Wan, Antony, & Kaye, 1998; Henderson & Venkatraman, 1999;
    Luftman et al., 1993; McFarlan, 1984; Philip, Gopalakrishnan, & Mawalkar, 1995;
    Porter & Miller, 1985).


    Henderson and Venkatraman (1999) propose that aligning business and IT strategies
    involves a continuous process of adaptation and transformation that encompasses
    business strategy, IT strategy, organizational infrastructure and processes, as'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'well as IT infrastructure and processes. In this context, strategic IT utilization
    can empower organizations to stay ahead in a rapidly changing competitive landscape
    (Laurindo, 2008).


    Numerous models, theories, and methodologies have been put forward in the literature,
    with a focus on aligning IT with business strategy and operations (Gerrow et al.,
    2014).Over time, digital technologies have become essential in shaping business
    strategies (Bharadwaj et al., 2013; Bughin & Catlin, 2019; Laurindo, 2008; Mattos,
    Kisimoto, & Laurindo, 2018; Venkatramanan, 2017).


