- pgno: 10
  md: '# Chapter 8


    Revolutionizing Financial Literacy Through Exploring Finfluencers'' Intentions
    in Chatbot Financial Information Dissemination ............ 159


    Annie Issac, Christ University, Bangalore, India

    R. Serammadevi, Christ University, Bangalore, India


    Financial literacy, a cornerstone for stability and empowerment in today''s economic
    landscape, is set to be revolutionized. Finfluencers, individuals with significant
    financial acumen and a robust digital platform, are shaping audiences'' financial
    attitudes and behaviors. This study introduces a conceptual framework based on
    the decomposed theory of behavior (DTPB) that holds the potential to transform
    how we understand and implement financial education. The unique aspect of this
    framework is its incorporation of Finfluencers as critical influencers in adopting
    AI chatbots for financial education. For instance, the model can predict the likelihood
    of a Finfluencer endorsing an AI chatbot for financial education based on their
    attitudes, subjective norms, and perceived behavioral control. Despite the widespread
    use of DTPB across various disciplines, a research gap exists in understanding
    the determinants of intention and behavior concerning adopting AI chatbots for
    financial education.


    # Chapter 9


    The Effect of AI on HRM Practices ............................................................................
    189

    Tharaya Said AlHarthi, UTAS Ibra, Oman


    In the age of digital technologies and transformation, artificial intelligence
    (AI) has emerged as essential technology to be integrated into various business
    activities and practices. The integration of AI into human resource management
    (HRM) practices has a profound and transformative shift in the way organizations
    approach workforce management. This technological evolution has not only revolutionized
    traditional HR methods, but also introduced novel efficiencies, reshaping the
    landscape of talent acquisition, employee engagement, and overall organizational
    effectiveness. In this era of rapid technological advancement, understanding the
    multifaceted impact of AI on HRM is essential for businesses to stay competitive,
    foster a more responsive workforce and build its capabilities. By reviewing the
    existing literature, this chapter offers a systematic analysis to gain insights
    on the impact of AI on various HRM practices. In addition, it aims to explore
    how AI technologies assist organizations to tackle numerous challenges associated
    with HRM.'
