- pgno: 405
  md: 'Senthil Kumar Arumugam is a Professor at the School of Commerce at Presidency
    University, Bengaluru, India. His areas of specialization include Finance, Accounting,
    Marketing, Computer Applications in Business, and Research Methodology. He earned
    a PhD in Commerce from Bharatharthi University, India, in 2014, and holds an MPhil
    in Commerce, an MPhil in Computer Science, a Master of Computer Applications,
    and a Master of Commerce. He has 23 years of experience in teaching, research,
    and administration in the fields of Commerce and Computer Applications. He is
    the author of 65 research articles, 11 edited books, and 18 book chapters. In
    2021, he received the “International Excellence Award for Research Publications
    in Digital and Finance Domain” from CIMA.


    Amit Kumar Tyagi is an Assistant Professor at the National Institute of Fashion
    Technology, New Delhi, India. Previously, he worked as Assistant Professor (Senior
    Grade 2), and Senior Researcher at Vellore Institute of Technology (VIT), Chennai
    Campus, 600127, Chennai, Tamil Nadu, India (for the period of 2019-2022). He received
    his Ph.D Degree (Full-Time) in 2018 at Pondicherry University, 605014, Puducherry,
    India. About his academic experience, he joined as assistant professor at Lord
    Krishna College of Engineering, Ghaziabad (LKCE) (for the periods of 2009-2010,
    and 2012-2013). He was an Assistant Professor and Head-Research, Lingaya’s Vidyapeeth
    (formerly known as Lingaya’s University), Faridabad, Haryana, India (for the period
    of 2018-2019).


    Sharmila Chidaravalli is currently working as Assistant Professor, Department
