    # LITERATURE REVIEW


    # Evolution and Definitions of Financial Literacy


    Financial literacy is recognized globally as a vital life skill essential for
    individual empowerment and fostering financial well-being at both personal and
    societal levels.(G20, 2021). The term “financial literacy” was first introduced
    by the Jumpstart Coalition for Personal Finance in 1997. It is defined as utilizing
    knowledge and skills effectively to manage financial resources for lifetime financial
    security (Ameer & Khan, 2020). Researchers have proposed various definitions to
    capture the multidimensional nature of financial literacy. According to the Organization
    for Economic Co-operation and Development (OECD), financial literacy includes
    the knowledge and skills necessary to comprehend risks, capabilities, motivation,
    and confidence crucial for financial prosperity, as well the capacity to contribute
    to the economic vitality of one’s business (Stolper & Walter, 2017). Other definitions
    emphasize the ability to make well-informed financial choices and manage financial
    resources effectively (Bojowun et al., 2023). (Huston, 2010) characterized financial
    literacy as possessing the knowledge, awareness, and practical capability to apply
    financial understanding in everyday situations. (Marinov, 2023) described it as
    a multidimensional construct comprising awareness, skills, attitudes, and behaviors.
    (Lusardi and Mitchell, 2014) Defined financial literacy as analyzing economic
    information and making informed decisions regarding financial planning, wealth
    accumulation, debt management, and retirement. (U.S. National Strategy for Financial
    Literacy, 2020) described financial literacy as the abilities, information, and
    resources that empower individuals to make personalized financial decisions to
    achieve their objectives.


    # Need or Importance of Financial Literacy


    Financial literacy is crucial for various aspects of individuals’ lives, beginning
    with the need for young people to develop financial knowledge and skills to establish
    saving habits and prevent financial problems (Mohta & Shunmugasundaram,'
