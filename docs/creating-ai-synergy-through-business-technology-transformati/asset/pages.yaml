  md: '# Chapter 9

    nThe Effect of AI on

    HRM Practices


    Tharaya Said AlHarthi

    UTAS Ibra, Oman


    # ABSTRACT


    In the age of digital technologies and transformation, artificial intelligence
    (AI) has emerged as essential technology to be integrated into various business
    activities and practices. The integration of AI into human resource management
    (HRM) practices has a profound and transformative shift in the way organizations
    approach workforce management. This technological evolution has not only revolutionized
    traditional HR methods, but has also introduced new efficiencies, reshaping the
    landscape of talent acquisition, employee engagement, and overall organizational
    effectiveness. In this era of rapid technological advancement, understanding the
    multifaceted impact of AI on HRM is essential for businesses staying competitive,
    foster a more responsive workforce and build its capabilities. By reviewing the
    existing literature, this chapter offers a systematic analysis to gain insights
    on the impact of AI on various HRM practices. In addition, it aims to explore
    how AI technologies assist organizations to tackle numerous challenges associated
    with HRM.


    # THE EFFECT OF AI ON HRM PRACTICES


    In the age of digital technologies and transformation, Artificial Intelligence
    (AI) has emerged as essential technology to be integrated into various business
    activities and practices. The integration of Artificial Intelligence (AI) into
    Human Resource Management (HRM) practices has a profound and transformative shift
    in the way organizations approach workforce management. This technological evolution
    has not only revolutionized traditional HR methods but has also introduced new
    efficiencies,


    DOI: 10.4018/979-8-3693-4187-2.ch.009'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'reshaping the landscape of talent acquisition, employee engagement, and overall
    organizational effectiveness. In this era of rapid technological advancement,
    understanding the multifaceted impact of AI on HRM is essential for businesses
    aiming to stay competitive, foster a more responsive workforce and build its capabilities.
    By reviewing the existing literature, this chapter offers a systematic analysis
    to gain insights on the impact of AI on various HRM practices. In addition, it
    aims to explore how AI technologies assist organizations to tackle challenges
    associated with HRM. The impact of AI on various HRM practices including recruitment
    and talent acquisition, sourcing and matching, performance management and HR analytics
    and reporting, are explained. In conclusion, human resource management focused
    on AI have a great potential to enhance employee performance, talent development,
    learning and development, and employee retention, while also helping to minimize
    employee turnover. Hence, organizations, regardless of their size, are recommended
    to adapt to AI technologies and deploy robust strategies to boost their HR functions.


    # INTRODUCTION


    Nowadays, emerging technologies are changing how businesses handle their various
    activities, and one big change is the use of Artificial Intelligence (AI). This
    technological change can be viewed as a smart system that can mimic humans’ abilities,
    like thinking and learning in a much faster rate. In fact, AI in recent years
    is being adopted more and more in different domains and notably many organizations
    around the globe have realized the importance of deploying AI solutions in their
    processes.


    Prior to addressing its impact on organizations and understanding its applicability
    to different areas and practices, it is important to shed a light on what Artificial
    Intelligence is and what it entails.


    Artificial intelligence has gained more attention in the recent years as it encompasses
    many areas and as is predicted to significantly affect our everyday life and to
    transform nearly every business. In order to understand this concept, it is important
    first to look into two terms “Artificial” and “Intelligence” separately. With
    regards to artificial, it is used a notion to refer to something which is not
    occurring naturally produced by human (Mikalef & Gupta, 2021). On the other hand,
    the word intelligence is used to refer to “the ability to acquire and apply knowledge
    and skills”. It is also used to describe the involvement and use of mental abilities,
    e.g., learning, understanding and reasoning (Lichtenhal, 2019). When both terms
    are combined, it is worthy of mentioning that several definition for AI have been
    proposed. According to a definition provided by Kolbjørnsrud et al. (2017), AI
    is'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'used to refer to “computers and applications that sense, comprehend, act, and
    learn”. This definition is similar to those of Delelehner and Laumer (2020) who
    defined AI as “a computer system having the ability to percept, learn, judge,
    or plan without being explicitly programmed to follow predetermined rules or action
    sequences throughout the process.”. A most recent and broad definition of AI has
    been given by Wang et al. (2019) who described AI as “a broad concept that captures
    the intelligent behavior of the machine"


    Throughout this chapter, the broad definition suggested by (Afiouni, 2019) to
    describe AI is followed. According to Afiouni (2019) as a term is to refer to
    the use of machines/computers abilities to“perform tasks that usually need natural
    human intelligence"


    Despite few researchers argued that AI has limited applicability in HRM processes
    (Chitrao et al., 2022) and that availability of these technologies is not well
    known to recruiters, many other researchers believed it has the potential to shape
    the future of HR practices (Pan & Roe, 2023); Vedapradha et al., 2023), Ekuma,
    K. (2023) and hence becomes a phenomenon of interest for HR professionals and
    practitioners. Agarwal et al., 2023). A more intriguing fact in the literature
    is that AI-based applications are regarded as one of the most most advance development
    in HRM technologies.


    Although it is still in the infancy stage, 2019, and has a limited applicability
    to teach and innovative firms (Albert, 2019), the use of AI in the field of HR
    has witnessed a rapid growth (Pan & Roe, 2023) (Davenport et al., 2020). And the
    impact of the digitization, in particular AI, on different HR functions has becomes
    a phenomenon of interest for HR professionals and practitioners (Pandita, 2019)
    The presence of Artificial Intelligence (AI) effect on human resource represents
    represents a paradigm shift on various HR practices from planning, recruiting
    talents to retention. By all means, this has not only transformed traditional
    human resources practices but has formerly offered both opportunities as well
    as concerns in multifaceted for HR professionals.


    Indeed, literature indicates many contributing to keenness among organizations
    to integrate AI technologies into their processes and functions. For instance,
    AI technologies have the potential to make HR tasks faster than before. Also,
    these technologies ensure more accurate HR processes and better alignment with
    organizational goals. For instance, with the help of AI tools, organizations spend
    less time to scan resumes and quickly identify the best suitable candidate. The
    secret behind is undoubtedly the use of algorithms as a enabler to save time and
    efforts undoubtedly reduce cost per hire.'
