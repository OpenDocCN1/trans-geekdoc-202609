  md: '# # Chapter 13

    nThe Impact of AI Integration on Workforce Dynamics:

    Legal Challenges and Labour Law Implications in the Era of Business Technology
    Transformation


    J. Gayathri

    https://orcid.org/0000-0002-5118-2683

    Saveetha School of Law, India


    S. Mangaiyarkarasi

    Saveetha School of Law, India


    # ABSTRACT


    The research delves into the dual-edged nature of AI in business, highlighting
    both its potential for creating new opportunities and its role in displacing existing
    jobs. It examines cases where AI has led to significant changes in workforce requirements
    and explores the legal framework''s response to these changes. Key areas of concern
    include the protection of displaced workers, the evolution of employment contracts,
    and the need for regulatory updates to address the challenges posed by automation.
    Additionally, the study assesses the effectiveness of current labor laws in safeguarding
    worker interests amidst rapid technological advancements. It proposes potential
    legal reforms and policy measures aimed at ensuring a balanced approach to AI
    integration, where technological progress does not come at the expense of worker
    rights and job security.


    DOI: 10.4018/978-8-3693-4187-2.ch013'
