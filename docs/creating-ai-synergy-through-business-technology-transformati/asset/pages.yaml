  img_proc: true
- pgno: 221
  md: 'The use of AI powered tools helps HR departments to make things work better
    and faster. For this reason, many practitioners believe that AI has a significant
    impact in HR functions as it can help with tasks like hiring new employees or
    assessing the performance of the existing employees.


    As mentioned above, literature indicates various HR key areas affected by the
    adoption of AI. However, the following part of this paper moves to describe in
    greater detail four HR areas revolutionized by the advent of AI. The areas are:
    (1) recruitment and talent acquisition, (2) candidates sourcing and matching,
    (3) performance management and (4) HR analytics and reporting. However, before
    proceeding to discuss how AI affect HR practices, it deems necessary to offer
    the readers with a general overview about the history of AI.


    # HISTORY OF ARTIFICIAL INTELLIGENCE


    This sections intend to provide a general overview about the history of AI. Unlike
    what many people think about AI as a new phenomenon, AI technologies has been
    “traced back to philosophy, fiction and imagination” (Buchanan,2006). According
    to Cordeschi R. (2007), the origin of AI can be traced back to the Dartmouth Summer
    Research Project on AI before 1960, where a group of researchers were formulated
    the term “Artificial Intelligence” with the objective of imitating human intelligence
    into machines. In his book (brief history of artificial intelligence: what it
    is, where we are, and where we are going), Woolridge (2021 attributed the emergence,
    spread and growth of AI to three reasons: genuine scientific breakthroughs, access
    to more powerful and cheap computer capabilities and the availability of big data.
    According to the author, AI has evolved significantly over the decades, with ongoing
    advancements shaping its current state and future prospects. In recent years,
    these technologies have witnessed a huge explosion in its capability affecting
    almost every individual and transforming nearly every industry and activities
    including HR functions. Having briefly traced the history of AI, the section that
    follows review the literature related to the theoretical frameworks and models
    underpinning the adoption and use of AI in different organizational areas including
    HR activities.


    # THEORETICAL FRAMEWORKS UNDERPINNING AI ADOPTION IN ORGANIZATIONAL CONTEXT


    Several studies investigating the adoption of artificial intelligence (AI) in
    organizational contexts used various theoretical frameworks to explore AI adoption
    in organizational settings. One of the most popular framework commonly used'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'the Technology-Organization-Environment (TOE) framework, which explores how
    technological features, organizational factors (including structure and culture),
    and external environmental factors influence AI adoption. For instance, AI Hadwer,
    A., Tavana, M., Gillis, D., & Rezania, D. (2021) draw on TOE framework by Tornatzky
    and Fischer (1990) which focuses on the organizational factors that affect the
    adoption process. In addition to TOE framework, there has a great deal of research
    on Technology Acceptance Model (TAM) to understand the adoption of AI in organization.
    This model has been widely used to study the adoption process of technologies
    in organizations as well as by individuals.


    In the context of human resource management (HRM), researchers often employ specific
    theoretical frameworks to understand the adoption of emerging technologies including
    AI technologies within organizational context. For instance, Hmod own (2021) used
    TAM to investigate HR roles and the attitude of HR practitioners towards the adoption
    of AI-based solutions. In addition to the TOE framework, Institutional Theory,
    and Diffusion of Innovations theory, researchers also draw on other theoretical
    perspectives to explore AI adoption in organizational settings. The Resource-Based
    View (RBV) explores how internal resources of an organization and its capabilities,
    such as knowledge assets and technology infrastructure, shape its ability to innovate
    including AI technologies. Another framework is the Resource-Based View (RBV),
    which emphasizes on human capital (knowledge and skills) organizational capabilities
    can be well-utilized to effectively adopt and integrate AI. Additionally, HRM
    researchers also draw on Institutional Theory to examine organizational norms
    and pressures from external sources affect HR practices (e.g., workforce planning
    and skill development) related to AI adoption affects the implicit expectations
    and mutual obligations between organization and its employees. Similarly, the
    Psychological Contract Theory was employed to see how AI adoption affects the
    implicit expectations and mutual obligations


    In addition the above mentioned theoretical framework to explore the drivers of
    adopting AI technologies in organizational contexts, Mariani et al. (2023) presented
    other theoretical lenses used by researchers to address the adoption and implementation
    of AI technologies in organization. This includes: diffusion of innovation theory
    and technological innovation systems (TIS).


    These diverse theoretical lenses offer better understandings of the multifaceted
    factors and drivers influencing AI adoption decisions, intentions as well as implementation
    strategies across various organizational contexts. These frameworks, theories
    and models provide HR professionals with better insights into addressing and managing
    the human side of AI adoption, aligning technology implementation with organizational
    culture, employee motivation, and well-being. This alignment covers and affected
    HR areas and functions. The section below describes the impact of AI in one of
    the main HR area, recruitment and talent acquisition.'
