    leverages machine learning algorithms to evaluate anticipated failures, minimize
    downtime, reduce maintenance costs, and examine equipment data (Luo et al., 2020).
    On the other hand, quality control procedures enhanced by AI-enhanced image identification
    systems can acknowledge defects with higher precision and speed comparable to
    human assessment (Jia et al., 2019). Furthermore, Sarkis et al. (2021) explained
    that AI-powered supply chain management devices inventory levels, augment logistics,
    and improve forecasting leading to cost savings and enhanced operational efficiency.
    Lee et al. (2019) also stressed that AI-enhanced robotics automation empowers
    manufacturers to achieve higher levels of accuracy in manufacturing operations,
