    # III. PREDICTION OF LABOR INTENSITY


    As practice, the most perceptible feature of research and development projects''
    scheduling is a rapid decrease in an accuracy of predicted labor intensity with
    a slight increase in a prediction at the same time.


    ![](img/96700e18732b64716e81c810de6512f6_1_0.png)


    Fig. 2. Example of total amount of target labor intensity relative to current
    enterprise labor productivity.


    The area indicated by the hatching reveals the deviation of total amount of target
    labor intensity from current enterprise productivity. This irregularity helps
    to resolve the triple restriction (time, cost and quality) while forming the production
    schedule of an enterprise:


    +   - There is an increased risk of over limit a completion time.

    - A total cost of productivity decreases due to the increase activity execution
    mode.

    - A quality of activity decreases with productivity threshold exceeded.


    ![](img/96700e18732b64716e81c810de6512f6_1_1.png)


    Fig. 3. Example of relation between accuracy and prediction distance


    It is important to be mind that reduced input of labor of project might cause
    a decrease in salary fund and a reduction of productivity resources.


    One feature of high-tech industry of aircraft production is a dependence on qualified
    performers. Proceeding from this, the solution of problem by regularly changing
    executors does not seem effective because labor market does not have the ability
    to provide necessary dynamics.


    # C Equality of resource assignment respect


    Figure 2 shows a simplified example, which does consider the consideration of
    performers, specifications of activities and in-process development of labor productivity
    of performers, which takes into account cases. The irregularity of resource assignment
    increases over periods. To solve this problem and minimize the negative effects
    mentioned above, the following steps can be:


    +   - Transfer of part to a related company for execution.

    - Participation in projects of related companies as the executor.

    - Performing extra-planned activities in a reserve of future projects.

    - Revision of a contract terms regarding time limits or scope of the project.

    - Alteration of projects'' schedules to reflect existing priorities.


    Currently, one of the researches is the application of digital technologies in
    the field of quality management [2]. Taking into account the probabilistic nature
    of the production and development process, there is evidence [9-12] to suggest
    that one of the most effective ways of implementation of these methods are artificial
    neural networks (ANN). Development and training processes consist of a few:


    +   - Preparation of a training set of projects'' resources data contains information
    about actual labor variables in machine learning.

    - Converting the training set to a data format in using.

    - Selection of a representative part of the training set for the tests of firstly
    quality.

    - Iterative training of the ANN with any variety of configuration.

    - Analyzing the results and identifying the best configuration of the ANN.


    To automate the process of identifying which provides the best prediction accuracy
    and distance, it is proposed to use the generic method with logging of initial
    and resulting results.


    In addition, it is proposed to use the ANN to increase prediction accuracy by
    using a classification task to identify projects with similar dynamics of labor
    intensities. This approach will improve training results, taking into account
    specific of projects.


    The practice of using artificial neural networks in similar issues shows the high
