    # I. INTRODUCTION


    Modern research in the field of quality control and management is of particular
    importance for aircraft manufacturing.


    The issue of quality control and management in the field of non-threaded aircraft
    production is complex and consists of several elements. One of the them is to
    create new models of assignment conflict with many stages, which have unique requirements
    and a large number of projects that are executed at the same time and have influence
    between each other. Another reason is that projects use shared resources of an
    enterprise, and this causes schedule conflicts.


    All of these reasons tend to increase the risk of planning in the field of quality
    management. At the same time, a planning process for each stage of production,
    and a pilot project in, has specific characteristics.


