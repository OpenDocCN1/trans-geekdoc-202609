    **Abstract**—This paper describes the issue of quality control and management
    in the field of non-threaded of aircraft production. Frequently, many projects
    are executed at the same time. These projects use shared resources and tends to
    increase the risk of project planning in the field of quality management. The
    main aim of project planning system is to manage conflicts arising with contract
    terms. The first issue is to perform the project scheduling and the second to
    identify and evaluate risks. A reasonable approach to tackle these issues is to
    reduce the learning effect which occurs from influence of projects. Suggested
    method would probably increase accuracy and that such regression function is used
    to identify and evaluate risks.


