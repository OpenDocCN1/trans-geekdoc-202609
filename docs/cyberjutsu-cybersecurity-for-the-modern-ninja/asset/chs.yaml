  \nNo Starch Press 及 No Starch Press 标志是 No Starch Press, Inc 的注册商标。此处提到的其他产品和公司名称可能是其所有者的商标。我们并非在每次出现商标名称时都使用商标符号，仅以编辑方式使用这些名称并维护商标所有者的利益，无侵犯商标的意图。\n\
  \n书中的信息按“原样”分发，不提供任何保证。虽然在准备本书时已采取一切预防措施，但作者或 No Starch Press, Inc. 对因书中包含的信息直接或间接引起或据称引起的任何损失或损害，不对任何个人或实体承担任何责任。\n\
  \n献给我亲爱的 Sarah\n以及那些害怕新思想、对自身弱点视而不见的无助组织，感谢你们激励我写这本书\n\n## 关于作者\n\nBen McCarty 是前美国国家安全局（NSA）开发人员，美国陆军退役军。他是陆军网络战营首批获得完全资格的网络战专家（35Q）之一。在职业生涯中，他曾担任黑客、事件处理人员、威胁狩猎者、恶意软件分析师、网络安全工程师、合规审计师、威胁情报专业人士以及能力开发人员。他拥有多项安全专利和认证。目前在华盛特区担任量子安全研究员。\n\
  \n## 关于技术审稿人\n\nAri Schloss 在联邦政府国税局（IRS）开始了他的网络安全职业，并与国土安全部（DHS）和联邦医疗保险及服务中心（CMS）签过合同。他在\
  \ `NIST 800-53/800-171` 合规、网络安全防御行动和取证方面拥有经验。他拥有信息安全硕士学位和 MBA 学位。目前在马里兰州的一家国防承包商担任安全工程师。\n\
  \n# 前言\n\n网络安全从未像现在这样紧密地关系到我们的经济繁荣和社会和平。保护好我们企业的知识产权和人们的个人信息至关重要。网络犯罪分子正变得更快、更有创意、更有组织性且资源更丰富。尽管已经采取了所有的网络防御措施，网络安全从业人员发现自己正不断地发现新威胁并应对新攻击。这是一场网络军备竞赛。\n\
  \n在接下来的 200 多页中，Benjamin McCarty——一位才华的网络威胁情报专家，我自 2017 年起认识的创新安全研究员——分享了如何保护你的信息免受网络黑客的侵害。Ben\
  \ 的核心观点很简单：像忍者一样思考。但这个观点有什么理由值得写一整本书呢？想要完整详尽的答案，你只需要读。但我可以告诉你，从高层次来说，答案在于忍者在战争中使用的战术和技术。\n\
  \n15 年前当我读研究生时，我在安全工程课上学到的第一堂安全课是像黑客一样思考。在网络安全社区中，我们已经多年、甚至十年一直在宣传这一信息。但根据组织每年继续遭受的网络攻击数量来看，这一信息似乎并没有让许多网络防御者深之于心。这可以理解，原因有两点：第一，由于缺乏细节，这一信息很难内化；其次，任何可获得的细节可能非常难以掌握。Ben\
  \ 通过将信息从“像黑客一样思考”改为“像忍者一样思考”解决了这两个问题。\n\n“如何做呢？”你可能会问。很好，答案就在忍者卷轴中，这些卷轴编写于中世纪，但直到\
  \ 20 世纪中叶才被严密保守。这些卷轴最近从日语翻译成了英语。译文揭示了忍者是如何被训练思考、制定策略和行动的。忍者作为特工，谨慎地保持他们的策略和战术秘密。但通过出版他们的卷轴所揭示的内容值得深入分析，以理解是什么让忍者在几个世纪的间谍、欺骗和突袭任务中如此如此成功。\n\
  \nBen 对这些卷轴的分析提取了忍者用于攻击的策略、战术和技术。他将这些古老的战术和技术映射到黑客进行网络攻击时使用的现代战术、技术和程序（`TTPs`）。阅读这本剧本和程序将帮助安全专业人士不仅理解忍者如何思考，还能理解网络犯罪分子如何思考。通过这种理解，你将能够开发真正像黑客一样思考的技巧并内化这一安全原则。这不仅能帮助你预测黑客潜在的下一步行动，还能让你有时间为该行动做好准备，并建立防御以防止黑客实现目标。\n\
  \nBen 使用忍者卷轴让这些 `TTPs` 更贴近网络防御者的另一个原因是非常高明的方法，因为这些卷轴处理的是物理世界的攻击；也就是说，它们引用了物理对象。物理环境比网络或虚拟环境更容易让我们大脑想象。将黑客的战术和技术与实体资产联系起来，使它们更加易懂。你可以开始想象黑客如何应用特定的\
  \ `TTP` 来入侵资产或在资产之间移动。在每一章中，Ben 都巧妙地带你通过城堡思想练习，帮助你可视化城堡中的行动，然后将其转化为网络环境。\n\n读者将从\
  \ Ben 列出的技巧和策略中受益匪浅。这是一个及时的贡献：网络安全正成为我们经济的主要支柱之一。Ben McCarty 拥有十年的威胁情报经验，非常适合分享如何像忍者和黑客一样思考的实用技巧，以保护你的信息以及整个数字经济。\n\
  \nMalek Ben Salem, PhD\n安永安全研发负责人\n\n\n我必须首先感谢我亲爱的 Sarah。从阅读初稿到为封面提供建议，再到给我写书的自由，非常感谢。\n\
  \n感谢 Chris St. Myers，感谢在你的领导下进行深度网络间谍威胁情报研究时保持我的投入和快乐。这段经历对于我敏锐地捕捉网络间谍威胁者的者的脑模式至关重要。你从未阻止过我，你一直在鼓励我并在过程中教了我很多东西。\n\
  \n我永远感谢美国陆军 TRADOC 教导员和 DET-MEADE，他们认可了我的潜力并将我分配到首个网络战班级和单位。这段独特的经历对于我理解网络安全和操作员技艺具有特别的塑造作用。\n\
  \n特别感谢 Antony Cummins 和他的团队，他们翻译了忍者卷轴并让英语世界能够阅读。正是你们的努力和对忍者的感染力热情，让我找到了写这本书的灵感。\n\
  \n感谢 No Starch Press 所有帮助完善手稿并将其变成令我自豪的书的人，感谢你们。\n\n\n\n\n最后，感谢所有参与过我网络安全之旅的人们。向其他网络安全专业人士学习是一件乐事，这极大地丰富了我对网络安全和威胁的整体知识和理解。我写这本书需要其中的每一个点滴。\n\
  \n# 引言\n\n首先：我不是忍者。我既不是忍者历史学家，不是老师师，甚至不是日本人。\n\n然而，我曾为美国陆军执行过网络战争，我的战友们经常将我们的任务描述为“高速度的忍者操作”。从那时起，我开始注意到网络安全领域中“忍者”这一词的出现频率异常之高。我想看看这个术语的使用背后是否有实质性的内容。我从\
  \ 2012 年开始研究忍者，就在那时，我发现了一些 400 多年前编写的日本卷轴的英文译本（关于这些更多信息请见后文的“关于本书”章节）。这些卷轴是忍者学习技艺的训练手册——它们不是历史报告，而是实际的行动计划。其中一本《万篇忍书》（`Bansenshūkai`）被日本政府解密，并在二战后才限期向公众公开，因为这些信息在近\
  \ 300 年里被认为过于危险而无法流传。在中世纪，非忍者绝不应该看到这些文件。卷轴中的**粗体警告**提醒读者要用生命保护这些信息。曾几何时，在日本仅仅拥有这样一份卷轴就足以被处决。材料的禁忌属性为阅读体验增添了不可否的神秘色彩。我入迷了。\n\
  \n在阅读了超过 1000 页的译文后，很明显，针对忍者的指令和秘密技术本质上是对信息保障、安全、渗透、间谍和破坏性攻击的实地训练，这些攻击依赖于对高度加固组织的隐蔽访问——这与我在网络安全职业中每天处理的许多概念相同。这些\
  \ 400 年历史的手册充满了关于防御和进攻安全的见解，而我在现代信息保障实践中找不到它们的对等物。而且由于它们是揭示了秘密战争战术、技术和程序（`TTPs`）的实战指南，它们确实是独特的。在我们的行业中，国家级网络间谍机构和其他恶意行为者不会举办研讨会或发布描述其`TTPs`的行动计划。因此，这些忍者卷轴是独一无二且无价的。\n\
  \n`Cyberjutsu`旨在将古代忍者的战术、技术、策略和心态转化为实用的网络安全领域指南。网络安全相对年轻，仍然具有高度的反应性。行业专业人士的大部分时间花在消除迫在眉睫的威胁，或根据刚刚发生的事情预测未来的攻击。我写这本书是因为我相信，通过从这些提供了信息安全首批高级持续威胁（`APT`）卷轴中提供的长期视角，我们可以学到很多东西。古代忍者实践的信息战争`TTPs`经过了数百年的完善。这些`TTPs`在他们的时代行之有效——而且它们可能成为跨越当今网络安全主流模型、最佳实践和概念的关键，从而实施更成熟、经过时间考验的思想。\n\
  \n## 关于本书\n\n每个章节都详细研究了一个与忍者相关的课题，从历史和哲学的广泛基础，到分析，再到可操作的网络安全建议。为了方便使用，每章的结构如下：\n\
  \n1. **忍者卷轴**：对忍者使用的工具、技术或方法进行简要介绍。\n2. **网络安全**：分析忍者概念教会了我们关于当前网络安全格局的什么。\n3. **你可以做什么**：根据前述分析得出的可操作步骤，你可以采取这些步骤来保护你的组织免受网络威胁。\n\
  4. **城堡理论思维练习**：要求你利用所学的忍者和网络概念知识来解决某个威胁场景的练习。\n5. **推荐的安全控制和缓解措施**：基于`NIST 800-53`标准的推荐安全设置和规格清单，你可以出于合规目的或符合最佳实践而实施这些内容。\n\
  \n本书并不寻求提供一份忍者术语的完整目录，或对忍者哲学的扩展论述。如需此类内容，请参阅 Antony（Antony Cummins）和南美惠（Yoshie Minami）的作品，他们为当代读者编辑并翻译了日本古代忍者卷轴。本书引用了以下\
  \ Cummins 和 Minami 的著作（关于每本书的更多细节，请参见第 xx 页的“忍者入门”章节）：\n\n*   《忍者书》（`The Book of\
  \ Ninja`）（ISBN 9781780284934），《万篇忍书》的译本\n*   《忍者的隐秘传统》（`The Secret Traditions of\
  \ the Shinobi`）（ISBN 9781583944356），《忍者隐传》、《忍者传》、《军法辞世集》和《长持百种》的译本\n*   《忍者的真传》（`True\
  \ Path of the Ninja`）（ISBN 9784805314395），《论记》的译本\n\nCummins 和 Minami 的作品非常详尽，我强烈建议全文阅读。这些合集不仅是灵感的源泉，也是书中对忍术进行分析的原始来源。\n\
  \n### 关于城堡理论思维练习的说明\n\n我认为，讨论网络安全行业的问题至少会伴随着三个固有的问题。首先，即使在安全组织中，非技术决策者或其他利益相关者也往往因为缺乏技术专业知识而被排除在网络安全对话之外、被欺骗或被排挤出对话。其次，许多安全问题实际上是人性问题。我们已经知道如何对许多威胁实施技术解决方案，但人类会因为政治、无知、预算考虑或其他限制而产生阻碍。最后，可以购买或通过互联网搜索轻松发现的安全解决方案和/或答案已经改变了人们处理问题的方式。\n\
  \n为了解决这些问题，我在每个章节中将主题的核心问题呈现在“城堡理论思维练习”中——这是一个智力游戏（我希望你无法通过谷歌搜到），在其中你尝试保护你的城堡（网络）免受敌人忍者（网络威胁者）的危险。从防御城堡的角度来描述安全问题，消除了对话中的技术层面，允许就问题的核心和团队协作进行更清晰的沟通。每个人都能理解忍者物理渗透城堡的场景，无论他们能否流利地谈论企业网络和黑客。假装是城堡统治者还意味着你可以忽略实施所提解决方案时的任何组织官僚主义或政治问题。毕竟，国王和女王随心所欲的。\n\
  \n### 未来用途\n\n书中有很多网络安全想法。有些是摘自原始卷轴并适用于现代信息应用的。另一些是针对我发现的商业产品或服务的漏洞提出的解决方案。还有一些想法更为新颖或具有理想色彩。我不确定这些实现在技术上如何运作，但也许具有更好视角和见解的人可以进行开发并申请专利。\n\
  \n\n\n\n如果你偶然对一个源自本书的思想申请了专利，请考虑将我的名字列为共同发明人——这并非出于财务目的，仅仅是为了记录该想法的起源。如果你对这本书有任何问题，或想讨论这些想法的实际应用，请发送邮件至\
  \ `ben.mccarty0@gmail.com`。\n\n# 忍者入门指南\n\n这份简短的入门指南旨在帮助你对“忍者”的认知转向历史证据所描述的现实。请尝试放下你从电影和小说中获得的对忍者的认知。当面对与长期以来的观点和信念矛盾的证据时，感到困惑、怀疑和认知不适是很自然的——尤其是对于我们这些从小就梦想成为忍者的人来说。\n\
  \n## 历史上的忍者\n\n`Ninja` 有许多名称。我们在 21 世纪的西方熟悉的名称是 `ninja`，但他们也被称为 `shinobi`、`yato`、`ninpei`、`suppa`、`kanja`、`rappa`\
  \ 和 `ukami`。许多标签说明了他们行踪诡秘、神秘莫，但实际上这个职业并不难理解：`shinobi` 是古代日本雇佣的精锐间谍和战士。他们从平民和武士阶层中招募——例子包括\
  \ `Natori Masatake` 和 `Hattori Hanzō`——他们可能以某种形式与日本本身一样存在，但直到 12 世纪的平治战争，他们才在历史记录中频繁出现。在几个世纪里，日本饱受冲突和流血之苦，期间领主（`daimyō`）雇用\
  \ `shinobi` 执行间谍活动、破坏、暗杀和战争。即使是公元前五世纪中国军事战略家孙子的经典著作《兵法》，也强调了利用这些秘密特工取得胜利的必要性。\n\n\
  忍者在情报间谍、渗透敌方营地和破坏性攻击方面极其精通；`shinobi` 也许是历史上第一个高级持续性威胁（你可以称之为 APT）。在一个冲突不断的时代，他们机会主义地磨练并完善了技术、战术、工具、技艺和程序，以及他们的实践理论——忍术（`ninjutsu`）。《万叶书》（`Bansenshūkai`）记载道：“忍术的最深原理是避敌之锐处，击敌之疏忽处。”因此，他们作为秘密特工，通过伪装或潜行前往目标地（如城堡或村庄）；收集信息；评估目标防御的漏洞；并渗透执行间谍活动、破坏、纵火或暗杀。\n\
  \n随着江户时代漫长和平时代的到来，对 `shinobi` 的需求减少了，但许多重要的忍者手册随之诞生。\n\n## 忍者卷轴\n\n忍者的知识通常通过保密的书面记录传下来。这些卷轴是理解忍者方法的关键。在最重要的文献中包括：\n\
  \n1. `Bansenshūkai`（万叶书）：由 `Fujibayashi` 于 1676 年编写的 2 卷百科全书卷轴，涵盖了各种技术和哲学。\n2. `Shinobi\
  \ Hiden`（或 `Ninpiden`）：1655 年的手册合集，侧重于实际应用和工具。\n3. `Gunpo Jiyoshu`（或 `Shiyoshu`）：由\
  \ `Ogasawara Saku’un` 于 1612 年编写的广泛卷轴，包含了由 100 首诗的《长守百集》（`Yoshimori Hyakushu`）。\n\
  4. `Shōninki`（忍记）：由 `Natori Sanjuro` 于 1681 年开发的训练手册，强调了战争的心理和身体方面。\n\n## 忍者哲学\n\
  \n与忍者的价值观和心态建立智力共情是很重要的，而不深究神秘主义或灵性。虽然理解忍者战术和技术并非必须了解基础哲学，但从这些技术的智慧中学习无疑非常有帮助。\n\
  \n### 铁刃之心\n\n日语单词 `shinobi`（忍）由刃（`刃`）和心（`心`）这两个字组成。对其含义有多种解释。\n\n一种解释是，忍者应该拥有刃之心，或将心变成刃。剑刃锋利且坚固，同时具有韧性——这是一种旨在杀戮同时也作为使用者精神和意志延伸的工具。这与日本的\
  \ `kokoro`（心）概念契合，即将一个人的心、精神和思想融合为一个核心本质。在这种语境下，这种符号为一个人承担忍者角色所需的平衡心态提供了见解。\n\n\
  另一种解释是“刃之下的心”。在这种解读中，刃是一种生存威胁。危及 `shinobi` 生命的不仅是物理威胁，还有一把紧紧守护着跳动心脏的武器。`忍` 的音读（汉字读音）是“坚持”，这强调了在敌方领土持续受到威胁下作为间谍工作所需的内在力量。\n\
  \n### 正确的心态\n\n\n\n\n\n《忍之书》（*Bansenshūkai*）指出忍者必须拥有“正确的内心”，否则将面临必然失败。达到这种稀有的状态意味着时刻保持在场、专注并对目标明确——这是一种作为自我防御的正念。忍者被要求在做决定时心中要怀有“仁、义、忠、信”^(14)，尽管他们技艺的成果往往是阴谋和欺骗。这种哲学的益处在于，在战斗或渗透等高压时刻，能让忍者保持冷静并集中注意力。《忍之记》（*Shōninki*）提到：“当你内心平静时，你就能洞察他人无法察觉的事。”^(15)\n\
  \n“正确的内心”还被认为能让忍者成为更具灵活性的战略家。当其他战士往往匆忙且一心意地冲入战斗时，忍者对精神敏锐性的关注使他们变得耐心且灵活。他们接受过训练，能够打破常规思维，质疑一切；历史学家安东尼·库明斯（Antony\
  \ Cummins）将这种思维与当代的创业颠覆者相比。如果他们的武器失效，他们就使用语言。如果言语失效，他们就放下自己的想法，引导到敌人的思维过程中。^(16)清晰的头脑是掌握敌人、环境以及看似无法完成的体力任务的大门。\n\
  \n《忍之记》简洁地写道：“没有什么比人类的心灵更神奇了。”^(17)\n\n## 忍者技巧\n\n忍者卷轴中详细描述的渗透技术说明了忍者信息收集过程惊人的效力。他们练习两种主要的渗透模式：*隐忍*（*in-nin*，“黑暗之术”）是指在黑暗的掩护下潜入或通过其他方式隐藏以避免被探测；而*阳忍*（*yo-nin*，“光之术”）是指在众目睽睽之下渗透，例如伪装成僧侣以避免怀疑。有时忍者会将两者结合使用——例如，他们可能会伪装进入一个城镇，然后溜走躲在城堡的护城河中，直到攻击时机到来。\n\
  \n无论使用*隐忍*还是*阳忍*，忍者的目标都是尽可能了解关于目标的一切信息，并且拥有经过时间磨炼的方法来收集最详尽的信息。他们研究目标的物理地形，还会研究当地人的习俗、态度、兴趣和习惯。在尝试渗透城堡之前，他们首先会进行侦察，以确定每个房间的规模、位置和功能；入口；居住者及其作息；甚至他们宠物的喂食时间。他们记忆敌方守卫的姓名、头衔和工作职责，然后利用敌人的旗帜、纹章和制服公开地潜入（*阳忍*），同时与那些毫无防备的目标交谈。他们收集各方领主的印章以便用于伪造，通常向敌方军队发布虚假命令。在投入战斗之前，他们会研究敌军的规模、实力和能力，以及他们的战斗倾向、补给线和士气。如果他们的目标是一个强大的领主，他们会试图了解该统治者的道德准则和深层欲望，以便腐败或利用其弱点。^(18)\n\
  \n忍者被教导通过“正确的内心”哲学进行创造性思考。这种训练使他们对周围的世界极度警觉，并激发了在实地采取行动的新方法。例如，《忍之记》教导忍者通过观察自然界动物的行为来提高效率。如果忍者遇到路障或敌人检查站，他们会像狐狸或狼一样思考：他们不会越过或穿过；而是表现出耐心并绕行，即使绕行需要走很多英里。在其他时候，他们让自己像“牛马一样”被引导，^(19)\
  \ 走到开阔地，也许伪装成信使或使者以接近敌人，因为敌人很可能会忽视地位较低的人。无论忍者内心感受如何——即使他们正怒火中丈——他们努力在表面上表现得宁静，“正如平静湖面上的水鸟一样。”^(20)\
  \ 如果他们需要分散守卫离开岗哨的注意力，他们可以通过吠叫、嚎叫或抖动和服来模仿狗抖身体的声音，伪装成狗。^^(21)\n\n忍者带来了战场创新，军队和秘密特工至今仍在使用这些方法，而这些方法之所以成功，是因为忍者坚持不懈的侦察和对目标的完美掌握将信息和欺骗武器化了。\n\
  \n# 1. 绘制网络地图\n\n有了这些地图，将军就可以考虑如何防御和进攻城堡。\n\n> 关于移动军营，有一套关于移动时间和日期的原则需要遵循。忍者的职责是准确了解该地区的地理状况以及与敌人的距离。\n\
  >\n> ——吉森百集（*Yoshimori Hyakushu*）#9\n\n> ——一旦你获得了城堡或营地的细节和布局，你需要做的就是尽快带着这些信息回来，因为这就是一个优秀的忍者应该做的事。*\n\
  >\n> ——吉森百集（*Yoshimori Hyakushu*）#24\n\n《忍之书》“指挥官指南”中提供的第一条建议就是制作极其精确的地图，你的将军可以使用这些地图策划对敌人的攻击。^(1)《吉森百集》中的选诗^(2)也强调了绘制和维护地图的重要性，细节要详尽到对军队和单个忍者都有用。指挥官通常指派忍者绘制地图。卷轴明确指出，能够准确画出你所看到的东西（山脉、河流、田野）的能力，与绘制有目的、背景化的辅助军事战略或忍者渗透的威胁地图并非一回事。卷轴规定，以下细节与战争和间谍术有关，因此应包含在地图：^(3)\n\
  \n1. 房屋、城堡或堡垒的所有入口和大门。存在哪些类型的锁、插销和开启机制？打开门窗有多困难，在开启或关闭时会发出声音吗？\n2. 接近的道路。它们是直的还是弯曲的？是宽还是窄？是土路还是石路？是平坦还是倾斜的？\n\
  3. 结构的设计、构成和布局。每个房间的大小和用途是什么？每个房间里放了什么？地板会吱吱响吗？\n4. 结构的居住者。他们的名字是什么？他们是否有任何值得注意的技能或艺术？每个人的警觉性或怀疑程度如何？\n\
  5. 城堡及周围区域的地形。从位置内部和外部可以看到信号中继吗？食物、水和木柴储在哪里？护城河有多宽多深？墙有多高？\n\n## 理解网络地图\n\n网络安全中的*网络地图*是网络拓扑图，描述了网络中`links`（通信连接）和`nodes`（设备）之间的物理和逻辑关系及配置。为了更好地理解这个概念，考虑道路地图或地图中的地图。它们描述了物理位置、地理特征、政治边界和自然景观。关于道路（`links`）的信息——它们的名称、方向、长度以及与其他道路的交叉——可以用于在不同地点（`nodes`）之间进行导航。现在让我们考虑以下假设的情景。\n\
  \n\n\n\n想象你生活在一个这样的世界：道路和建筑会在眨眼之间突然出现或消失。GPS 确实存在，你拥有自己所在地和目标地点的坐标，但你必须尝试通过遵循一个不断变化的、错综复杂的网络来到达那里。幸运的是，导航官员（`routers`）被放置在每个交叉路口，帮助像你这样的旅行者找到方向。这些路由器不断与其邻居路由器通信，学习哪些路线和位置是开放的，以便它们更新存储在剪贴板上的路由表。你必须在每个路口停下，向路由器展示你的旅行卡以询问下一个拐角的方向，你的旅行卡上用\
  \ GPS 坐标编码了你的预期目的地。路由器在进行一些计算的同时，检查剪贴板上当前开放的路线，迅速为你指引方向，在你的旅行卡上盖上路由地址，并在你的旅行卡上打孔以跟踪你旅途中签到过的路由器数量，然后将你送到下一个路由器。你重复这个过程，直到到达目的地。\n\
  \n现在想象一下这个世界的制图师，由于无法跟上不断变化的网络，他们可能会放弃制作准确的地图。这些制图者只能满足于用通用名称标记地标和兴趣点，并在这些点之间画线，以表示它们之间存在某种路径。\n\
  \n## 地图绘制的挑战\n\n这种假设的情况实际上存在于网络空间中，这也是为什么网络地图是不准确的，而且它们的维护没有像应该那样被优先考虑。缺乏高质量、全面的网络地图是一项公认的挑战。如果一个组织拥有地图，它通常提供给安全运营中心（`SOC`），用以说明数据流中传感器或安全设备的位置，并更好地理解数据包捕获、防火墙规则和系统日志。然而，它可能也是抽象的，只描述了基本特征，例如互联网、边界网络和局域网的边界；边缘路由器或防火墙的大位置；以及未指定的网络边界。\n\
  \n公平地说，缺乏实用的网络地图有其理由。构建、共享和维护地图会消耗宝贵的时间和其他资源。地图也容易变化。向网络中添加或删除系统、更改 `IP` 地址、重新配置电缆或推送新的路由器或防火墙规则都可能显著改变地图的准确性，即使它是在几分钟前刚刚制作的。此外，现代计算机和网络设备运行着动态路由和主机配置协议，这些协议会自动将信息推送到其他系统和网络，而无需地图，这意味着网络本质上可以自动配置自己。\n\
  \n## 网络地图的关键组件\n\n网络地图应该包含以下细节：\n\n1. **接入点**：网络中节点的所有接入点。存在哪些类型的接口接入点（`Ethernet`、`Fast-Ethernet`、`Gigabit-Ethernet`、`Universal\
  \ Serial Bus`、`Console`、`Loop-back`、`Wi-Fi` 等）？是否存在访问控制（`NAC`）或媒体访问控制（`MAC`）过滤？是否启用或锁定远程或本地控制台访问？存在什么种物理安全？是否有机架锁甚至正在执行接口访问日志？网络管理接口和网络在哪里？每个接入点的\
  \ `IP` 地址和 `MAC` 地址是什么？\n\n![Figure 1-1: 简化的网络](img/f01001.png)\n图 1-1: 简化的网络\n\n\
  没有有效网络地图的组织可能会参考其 IT 部门制作布线图或原理图。这些简化的插图记录了系统、网络设备和设备连接的相对安排，它们可以作为网络内技术或运营问题排查的参考。\n\
  \n2. **网关和出口**：边界网关、跳点和出口点。是否存在多个互联网服务提供商（`ISP`）？是信任互联网连接（`TIC`）还是托管互联网服务（`MIS`）？互联网连接的带宽是多少？出口是由光纤、同轴电或其他介质组成的？接近网络的跳数是什么？网络内部或是否存在卫星、微波或\
  \ `Wi-Fi` 出口方法？\n\n3. **设计和布局**：网络的组成和布局。每个子网的名称、目的和大小是什么（例如无类域间路由 `CIDR`）？是否存在虚拟局域网（`VLANs`）？是否存在连接池限制？网络是平层的、分层的还是根据建筑结构或防御层划分的？\n\
  \n4. **主机和节点**：它们的名称是什么？它们的操作系统（`OS`）版本是什么？它们运行哪些服务/`端口`，哪些是开放的？它们拥有哪些可能检测攻击的安全控制？它们是否存在任何已知的漏洞利用（`CVEs`）？\n\
  \n5. **物理和逻辑架构**：网络和建筑的架构。数据中心位于哪里？大厅里是否有 `Ethernet` 插座？`Wi-Fi` 会泄露到建筑外吗？从建筑外侧可以看到电脑屏幕和终端吗？办公室是否使用了安全玻璃？游客/会议室网络是否已正确隔离？网络的内核访问列表（`ACLs`）和防火墙规则是什么？`DNS`\
  \ 在哪里解析？边界网络或 `DMZ` 中有什么？是否使用了外部电子邮件提供商或其他云服务？网络中的远程访问或虚拟专用网络（`VPN`）架构是怎样的？\n\n\
  当然，有大量的基于软件的映射工具，例如 `Nmap`，它们扫描网络以发现主机，通过距离扫描器的跳数来视觉化网络，使用简单网络管理协议（`SNMP`）发现并映射网络拓扑，或使用路由器和交换机配置文件快速生成网络图。由工具生成的网络图虽然方便，但它们很少捕捉到满足防御者或攻击者所需的高质量映射标准的所有细节或背景。\n\
  \n\n\n\n网络中的设备使用独特的形状而非象形图来表示。相似的设备类型重复相同的形状类型。例如，图 1-2 中的圆形代表工作站，方形代表路由器，矩形代表服务器；如果存在邮件中继器或域控制器，则用三角形表示。此外，这些形状内部是留空的，没有纹理或背景，使得在内部编写的信息清晰易读。\n\
  \n每个接口（包括虚拟接口和物理接口）都标记了其类型和编号。例如，以太网接口类型标记为 `eth`，接口编号与设备上物理标记的编号相同，即 `eth 0/0`。未使用的接口也会被标记。当已知接口的\
  \ IP 地址和子网码时，会为每个接口分配相应的地址和子网码。\n\n设备信息（如主机名、品牌、型号和操作系统版本）在已知时会记录在设备的顶部。漏洞、默认凭据、已知凭据和其他关键缺陷标记在设备中心。正在运行的服务、软件和开放端口也会记录在内。VLAN、网络边界、布局和结构应设计在网络图中并进行此类标记，同时包含任何值得注意的信息。\n\
  \n ![Figure 1-2: 详细网络图](img/f01002.png)\n\n图 1-2: 详细网络图\n\n## 不被察觉地收集情报\n\n对于忍者（shinobi）来说，在不被察觉的情况下收集情报是一项精英技能。在城堡附近徘徊并用木工角或其他设备进行详细测量会引起居民的注意，暴露忍者敌方间谍的身份。因此，勤奋的忍者会在和平时期绘制地图，此时防御工事的占领者会降低警备；在这些时候，忍者可以更自由地活动，并在收集数据时引起较少疑心^(5)\n\
  \n然而，忍者往往必须想出隐秘地进行测量、记录地形特征和收集其他情报的方法。值得一提的是，《忍之书皆》（*Bansenshūkai*）在关于公开伪装技术的章节中包含了对如何准确制作地图的描述，这表明忍者利用欺骗手段在敌人的眼皮底下进行测绘。该卷轴提到一种名为\
  \ *uramittsu no jutsu*（测距术）^(6)的技巧——估计距离的艺术——涉及利用已知物体尺寸作为比例尺找到与熟悉物体距离。*uramittsu\
  \ no jutsu* 还结合了巧妙的三角法技巧；例如，忍者可以躺下，脚对着目标，利用已知的脚部尺寸进行测量，而这一切看起来像是在树下午睡。\n\n收集网络方位角是攻击者在攻击目标网络或主机之前做的首要工作之一。攻击者创建的地图与历史忍者地图具有相同目的：识别并记录渗透目标所需的信息。这些信息包括网络的所有出站和入口：ISP\
  \ 连接；无线接入点；UHF、微波、无线电或卫星点；以及云网络、互联网络和外部网络。\n\n攻击者还会寻找边界网关协议（BGP）网关以及通往网络的路由或跳数。他们会寻找网络的表述结构、布局和设计；网络清单（包括主机名、设备型号、操作系统、开放端口、正在运行的服务和漏洞）；以及网络拓扑结构（如子网、VLAN、ACL\
  \ 和防火墙规则）。\n\n攻击者使用的许多网络绘图工具都是“高噪声”的，因为它们会与大量主机通信，使用自定义数据包，并被内部安全设备检测。然而，攻击者可以通过减慢或限制网络绘图器的速度、使用非自定义（非可疑）数据包，甚至使用受害者主机上已有的常用工具（如\
  \ `ping` 或 `net`）进行手动侦察来减轻这些弱性。攻击还可以使用无害的侦察方法，即攻击者从不触碰或扫描目标，而是使用 Shodan 或通过互联网发现的其他先前索引数据来收集信息。\n\
  \n\n\n\n在您确定了所有关键利益相关者并说服他们该项目应作为首要任务之后，第一步是收集贵组织内部拥有的任何可能有助于映射过程的资源。这包括接线图、旧的网络架构项目计划、漏洞扫描、资产清单列表、数据中心库存审计、DHCP\
  \ 租约、DNS 记录、SNMP 网络管理数据、端点代理记录、数据包捕获（`PCAP`）、SIEM 日志、路由器配置、防火墙规则和网络扫描。\n\n路由器配置应该是构建网络地图主要架构和布局的首要来源；考虑先将您的核心/中心路由器放置在地图中央，并从那里向外延伸。`PCAP`\
  \ 捕获可以揭示网络上通信的端点，这些终端可能对网络扫描没有响应，或者由于网络过滤而无法被扫描到达。在允许特定系统在杂杂模式（promiscuous mode）下长时间收集\
  \ `PCAP` 后，就可以查看 `PCAP` 中发现的端点列表，如图 1-3 所示。\n\n![图 1-3：PCAP 收集期间发现的端点的 Wireshark\
  \ 截图](img/f01003.png)\n\n图 1-3：PCAP 收集期间发现的端点的 Wireshark 截图\n\n理想情况下，`PCAP` 收集应在网络扫描期间进行，以验证扫描范围。此外，应该进行多次网络扫描，每个子网至少有一个端点对其子网进行扫描；这些扫描可以手动缝合到网络地图拓扑中，如图\
  \ 1-4 所示。识别出可以自动化的项目，以便未来更容易重复此过程。\n\n![图 1-4：10.0.0.0/24 子网扫描的 Zenmap 拓扑视图](img/f01004.png)\n\
  \n图 1-4：10.0.0.0/24 子网扫描的 Zenmap 拓扑视图\n\n一旦收集了所有数据，就需要对其进行处理、分析和合并。在整合所有数据之前，找出哪些数据源最准确，并识别具有独特且有用信息的数据源（例如设备的最后出现时间）将很有用。此外，应该调查任何不一致和差异之处。这些可能包括网络中缺失的设备、网络中的违规设备以及异常的网络行为或连接。如果您发现您的网络扫描器由于\
  \ IP 规则或入侵防御系统（`IPSes`）无法渗透某些飞地或子网，请考虑请求网络变更以允许更深层次、更全面的扫描。项目此阶段的关键成果是识别并定位连接到您的网络的所有授权和未授权设备——这是一项巨大的成就。\n\
  \n评估软件映射工具，这些工具应能够自动摄取 `SNMP` 数据、网络扫描和漏洞扫描，并允许手动编辑以包含任何额外数据。您选择的工具应该生成一个全面、准确且详细的、满足利益相关者需求的网络地图。选择能够处理您的数据并符合您预算的最佳解决方案。\n\
  \n制作地图并对其测试。在变更管理会议/安全事件以及网络中断/调试事件期间测试其实用性。它是否有助于更快地解决问题和发现问题？通过接口上的 `traceroutes`\
  \ 和 `tcpdumps` 测试其准确性。要测试 `traceroutes` 的准确性，请从不同的网络位置进行内部和外部 `traceroutes`，以查看跳点（路由器）是否存在于地图中，并根据您的地图逻辑进行流动。`traceroute`\
  \ 的示例见图 1-5。\n\n![图 1-5：指向 example.com 的 Windows traceroute](img/f01005.png)\n\n\
  图 1-5：指向 example.com 的 Windows traceroute\n\n## 推荐的安全控制与缓解措施\n\n在相关情况下，每项建议都结合 NIST\
  \ 800-53 标准提供了相应的安全控制措施，并应在地图制作的基础上进行评估。\n\n- 为记录地图分配职责。实施团队更新地图的策略和程序。[CM-1: 配置管理策略与程序\n\
  - 为了建立基准，记录网络拓扑、架构和系统的配置。[CM-2: 基准配置\n- 将缺陷识别（例如地图不准确）和修复（例如网络中固有的漏洞）纳入映射过程。[SI-2:\
  \ 缺陷修复\n\n## 总结\n\n在本章中，您回顾了忍者的映射目标和标准，并对现代映射实践和技术进行了概述。考虑到地图的重要性、如何创建（良好的）地图以及攻击者如何收集情报可能激发了您的想象力，您可能已经想到了用于映射自身或其他网络的新数据源或技术。在下一章中，您将有机会利用您的网络地图作为数据流图（`DFD`）进行威胁建模。这意味着您将识别威胁者可能攻击的网络区域。我将讨论新颖忍者防护技术。\n\
  \n# 特别防护\n\n即使是防御坚固的城堡也应受到特别防护，特别是拐角处。\n\n> 忍者在潜入城堡或营地时应该记住自然防御严密且困难的方向、森林和盲区。\n\
  >\n> ——松永百集（Yoshimori Hyakushu）#10\n\n查看红队可以利用地图做什么。并考虑如何用更短的时间制作更好的地图。\n\n\n\n\n\
  \n`Bansenshūkai` 中关于隐藏渗透的卷轴列出一系列初衷良好的防御技术、武器和思维模式，但这些手段实际上可能会让营地暴露风险。它敦促指挥官考虑环境中的一切事物如何可能被用来对付自己。例如，卷轴指示渗透者寻找\
  \ `shinobi-gaeshi`（忍返），这是设置在敌人营地周围的尖刺，用以威慑潜在的攻击者。由于防御者将这些尖刺放置在他们认为脆弱的地方，尖刺的存在告诉敌人忍者哪里的防御是不充分；防御者本质上是在广播他们的不安全感。忍者知道他们可以移除这些尖刺——这样做相对容易，因为它们几乎总是作为事后补救添加的——并借此通过目标围边界中最薄弱的点。\n\
  \n这种作为“事后补救”添加的安全措施，一个简明的例子可以在 Microsoft Windows 的 PowerShell 中找到。随着 `PowerShell`\
  \ 每个新版本的发布，在 `.NET` 框架之上添加的大量安全功能并没有解决产品的核心缺陷，事实上，它们允许威胁攻击者创建了一个工具和武器库，可用于渗透支持 `PowerShell`\
  \ 的系统。对于任何想要更仔细研究 `shinobi-gaeshi` 的安全研究人员来说，这是一个极佳的案例。\n\n日本仍然存在的古堡通常没有装饰尖刺，但它们往往倾向于拥有人类无法爬过的小水管、清理了植被的边界，以及外墙没有凹陷角——这些都表明，皇帝们以忍者为参考，随着时间的推移努力消除这些漏洞。然而，虽然消除漏洞使其无需守卫是理想的，但这并不总是可能的。\n\
  \n在本章中，我们将讨论“守护”（Guarding）的概念及其提议在网络安全五大功能中的地位。然后，我们将讨论如何通过威胁建模来识别可能需要守护的脆弱区域。\n\
  \n## 守护的概念\n\n`Guarding` 是通过观察环境、检测威胁和采取预防措施对资产执行保护性控制的行为。例如，城堡领主识别出墙上一个相当大的排水管是一个弱点。领主保留了这根管道（它具有让水排出的重要功能），但要求一名守卫站在附近，防止攻击者利用管道作为进入的手段。\n\
  \n通常，组织倾向于让网络安全人员对弱点系统、网络盲点或需要特别守护的脆弱攻击向量保持无知。有些组织假设发现网络中的安全缺陷完全是网络安全人员的责任。许多利益相关者根本就没有识别这些攻击向量，或者如果没有商业解决方案或无法轻易应用广泛接受的应对措施，他们简单地忽略这些缺陷并希望它们不会被利用。\n\
  \n在某些情况下，管理层指示安全人员*不要*对遗留系统进行基本的日志记录、扫描或补丁，担心接触它们会干扰业务运营。在更具政治色彩的组织中，除非通过正式文档流程识别，否则威胁通常不会被视为有效的担忧。想象一下看到一座城堡缺少了西墙，向国王报告这个明显的漏洞，结果国王却忽视了你的担忧，因为他的守卫没有在官方报告中提到过它。\n\
  \n## 网络安全框架中的守护\n\n`美国标准与技术研究院 (NIST) 网络安全框架` 旨在通过五个核心网络安全功能：识别、保护、检测、响应和恢复，防止这些常见的失误并提高组织对网络威胁的韧性。这些功能通过使用通的信息安全工具和过程来识别网络和系统中的漏洞。\n\
  \n例如，大多数组织通过对其网络上的系统进行漏洞或应用程序扫描来开始识别弱点的过程——这就是 `identify`（识别）功能。这些扫描有效且可靠，可以识别明显的安全问题，如未打补丁的软件、空密码的活动账户、默认工厂凭据、未参数化的输入以及对互联网开放\
  \ `SSH` 端口。接下来是 `protect`（保护）功能。发现不安全的系统后，扫描器记录该问题，然后安全人员通过补丁、配置更改或长期的架构、安全系统或软件实施来修复或缓解漏洞。\n\
  \n如果安全人员无法保护一个已被识别为攻击向量的系统，我认为他们应该通过人工控制对其进行 `guard`（守护）。然而，NIST 框架中缺少守护功能。相反，我们直接进入\
  \ `detect`（检测）功能：安全人员通过监控和调查异常事件尝试检测敌人。只有在安全人员检测到渗透后，他们才执行 `respond`（响应）功能，通过包含威胁、中和威胁并报告。\n\
  \n最后是 `recovery`（恢复）功能：将系统和数据恢复到运行状态，并提高它们抵抗未来攻击的能力。\n\n虽然这些保护措施对于稳健的安全配置至关重要，但它们是基于预防、保护或响应的功能。网络安全行业很少将“守护”概念——使用人工控制和保护——应用于信息系统，因为人类防御者无法像门卫看进入建筑的人那样手动检查并批准每个离开或进入环境的电子邮件、网页、文件或数据包。\n\
  \n例如，具有 `1GB` 网络连接的计算机每秒可以处理超过 100,000 个数据包，远超人类能检查的数量。防御者与其使用人工守卫，要么高度依赖自动化安全控制，要么接受/忽略风险作为业务的一部分。然而，如果仅将守卫插入到需要特别关注的区域（例如最可能的攻击向量），守护在现代数字网络中仍然可行。这就是为什么通过威胁建模识别你组织中的这些区域是有用的。\n\
  \n### 威胁建模\n\n网络安全中最接近守护的是 `threat hunting`（威胁狩猎），它涉及在日志、取证数据和其他可观测证据中积极寻找渗透迹象。很少有组织执行威胁狩猎，即使在这些组织中，猎人的工作也是检测而不是守护。\n\
  \n尽管如此，网络防御者超越传统框架、不断想象网络和信息系统可能被攻击的新方法并实施必要的防御。为了这一点，防御者可以使用威胁建模来实现信息流控制，并设计针对威胁的防御措施，而不仅仅是对此做出反应。\n\
  \n\n\n\n威胁建模通常由网络安全水平较高的组织执行，它涉及编写`数据流图 (DFD)`，该图描述了系统内部的数据流和处理过程。`DFDs` 通常以流程图的形式记录，但也可以通过详细的网络拓扑粗略表示。`DFD`\
  \ 可以用作对攻击面进行结构化分析的工具，允许你在已记录的信息系统参数内思考攻击场景。它并不需要漏洞扫描、红队对攻击场景的证明，也不需要来自合规框架的验证，而且组织在采取行动防御漏洞之前，不需要等待安全事件发生来证明威胁模型的存在。\n\
  \n了解你环境中类似于城堡石墙凹角、垃圾处理区域、水管以及以及附近的森林或灌木丛的现代网络对应物，可以帮助你识别可能需要特别留范的攻击向量。\n\n考虑这样一个例子：作为夜间职责的一部分，保安人员会拉动办公室里的每一个门手，以确保门已锁。如果他们发现门未锁，就会将其锁上，妥善保管钥匙，并提交安全事件工单。\n\
  \n后来确定发生安全事件是因为门钥匙被复制或被盗了，因此组织在门上增加了二级身份验证控制（如键盘或门禁读器），更换了锁并发放了新钥匙。这些新的预防性安全措施满足了合规审计员的要求，报告未锁门的工单也被关闭了。首席信息安全官(`CISO)甚至聘佣了一支红队对新的门锁机制进行小范围的物理渗透测试，团队确认由于增强了安全措施，他们被拒绝访问。\n\
  \n然而，一旦我们进行威胁建模演练，就会发现有可能推开移动的天花板板并爬过办公室墙壁，从而完全绕过新的安全措施。为了应对这一点，我们可以增加控制措施，例如在天花板吊顶空间内安装监控摄像头或运动检测器，或者安装坚固的、防隧道穿的天花板和地板。甚至可以雇佣并培训保安来寻找天花板板被动过的迹象、地板上的天花板颗粒或墙上的脚印。防御这种威胁需要保安守在房间内或驻留在天花板吊顶空间内，并配备保护房间免受入侵者侵害的权限和工具。实施此类防御措施的可行性较低——你可能因为提了这些建议就被经理从办公室里笑出去。很容易理解为什么组织更倾向于接受或忽略某些威胁，而不是尝试击退它们，这可能也是为什么`NIST\
  \ Cybersecurity Framework`中不包含防御功能的原因。然而，如果受到详细威胁建模的深刻指导，并以创意且审慎的方式实施，这种以防御为核心的思维模式可以增强信息系统和网络的安全性。\n\
  \n适用于防御功能实施示例是`跳板机 (jump boxes)`。`Jump boxes`是跨越两个或多个网络边界的系统，允许管理员从一个网络远程登录跳板机，并“跳”到另一个网络以获得访问权限。传统的网络安全框架建议通过修补所有已知漏洞、使用各种防火墙规则限制访问以及监控审计日志以发现未经授权访问等异常事件来强化跳板机系统。然而，此类技术控制往往会被攻击或绕过。相比之下，保安可以在向管理员确认授权执行远程命令后，物理上将内部网络电缆从另一个网络断开并直接连接。保安还可以实时监控操作。\n\
  \n## 使用威胁建模寻找潜在向量\n\n识别攻击向量的基本步骤是遵循威胁建模指南，从创建`DFD`开始。一旦从`DFD`中识别出潜在的攻击向量，建议检查它们以确定可以实施哪些技术安全控制。然后，作为最后手段，使用防御措施来保护这些区域。\n\
  \n### 为你的系统建模\n在组织的网络、安全、开发、业务和其他 IT 系统所有者及专家的帮助下，创建一个准确的`DFD`。它不需要使用`统一建模语言 (UML)`或其他高级概念——它只需要准确表示你的系统及其内部的信息。请注意，大型复杂的系统可能需要一个团队花费数月时间才能绘图。\n\
  \n### STRIDE 与防御\n`STRIDE` 是微软开发的一种威胁建模方法，用于描述信息系统中可能出现的问题。该缩写源于攻击者可能违反系统的六种属性的方式：\n\
  \n| `身份伪造 (Spoofing Identity)` | `=` | `身份验证 (Authentication)` |\n| :--- | :---\
  \ | :--- |\n| `数据篡改 (Tampering with Data)` | `=` | `完整性 (Integrity)` |\n| `否认/抵赖\
  \ (Repudiation/Deniability)` | `=` | `不可否认 (Nonrepudiation)` |\n| `信息泄露 (Information\
  \ Disclosure)` | `=` | `机密性 (Confidentiality)` |\n| `拒绝服务 (Denial of Service)` |\
  \ `=` | `可用性 (Availability)` |\n| `权限提升 (Elevation of Privilege)` | `=` | `授权 (Authorization)`\
  \ |\n\n要使用`STRIDE`，你将审查你的`DFD`，并在每个数据输入、数据处理、数据输出或其他数据流/规则点，假设对手可能如何威胁它。例如，如果系统要求在允许访问系统之前通过指纹验证用户身份，你可能需要考虑他们如何通过伪造指纹来冒充另一个用户。同样，你可以思考他们可能如何篡改指纹数据库以插入自己的指纹，或者探索一种攻击者导致指纹扫描仪故障的场景，允许通过较弱的验证过程进行未经授权的访问。\n\
  \n学习此框架后，你可以用它来挑战任何想象的威胁模型，即未能准确代表你系统的模型，或者未能描述合理的威胁如何影响特定组件、表面或向量的场景。这可能需要邀请技术领域专家参加威胁建模会议。\n\
  \n假设，例如，一次组织的威胁建模会议产生了以下场景：“恶意软件威胁损害了内部数据库的完整性。”\n\n\n\n\n该威胁没有得到妥善建模。在其他关键信息中，该场景并未描述恶意软件如何被分发和安装。它也没有描述恶意软件将如何破坏数据库的完整性：它是加密、删除还是损坏了数据？它没有描述哪些向量允许威胁影响系统，并且没有考虑现有的信息流和控制措施，也未提供现实的对策措施。例如，如果我们确定感染内部业务数据库的恶意软件最可能的方法是通过恶意的\
  \ USB 盘，那么安全部门可能需要制定政策，详细说明员工必须如何使用 USB 盘，或安装摄像头来监控对 USB 端口的访问。组织可能会决定授予安全人员开启关闭\
  \ USB 的权限、规定哪些驱动器可以与 USB 接口、控制 USB 端口的信息流和方向、在授予请求者访问权限之前检查 USB 盘上的文件、使用硬件或软件锁控制访问，甚至用热熔胶将\
  \ USB 端口封死。这些源于详尽威胁建模的措施使安全人员能够特别留心地防范特定威胁，而不是被迫接受风险或局限于保护和检测功能。\n\n### 3. 不要推销“补丁式”安全\n\
  \n威胁建模是一个迭代的、无限的过程，用于评估新威胁并开发保护性应对措施。在急于保护系统时，避免使用 `shinobi-gaeshi`（忍返）安全控制——这种防御努力可能会因引起对你脆弱区域的关注而适得其反。由于时间、资源或操作上的限制，你可能只采取了半吊子的措施，而有动机且复杂的威胁者可以轻易击败这些。例如，USB\
  \ 端口中的热熔胶可以用异丙酒精去除。在可能的情况下，评估纯安全优先的防御方法的可行性。\n\n在 USB 威胁示例中，USB 与位于操作系统内核之下的硬件抽象层\
  \ (`HAL`) 交互。无法通过软件和策略控制对其进行完全保护或缓解，因为这些控制位于内核之上，可以被绕过。因此，更完整的解决方案可能是实现一种甚至不存在 USB\
  \ 端口的主板和机箱配置。相比之下，USB 端口中的热熔胶向有动机的威胁者暗示你没有妥善处理 USB 的安全性，如果他们能将其拔掉，这可能会成为他们成功的攻击向量——就像古代的忍者拔掉固定在管道和墙上的铁钉一样。\n\
  \n## 推荐的安全控制与缓解措施\n\n在相关的情况下，每项建议都附有一个来自 NIST 800-53 标准的适用安全控制，并应通过“特别用心”的视角进行评估。\n\
  \n1. 审查审计员、红队评估、漏洞扫描和事件报告的结果，以发现你环境中无法通过补丁或控制措施轻易修复的漏洞（即那些需要特别留意的漏洞）。`[CA-2: 安全评估;\
  \ CA-8: 渗透测试; IR-6: 事件报告 | (2) 与事件相关的漏洞; RA-5: 漏洞扫描]`\n\n2. 对你的环境进行威胁建模以识别漏洞。然后确定哪些漏洞可以通过设计从你的环境中消除。探索保护安全功能的概念，并将这些控制应用于无法轻易清除的威胁。`[SA-8:\
  \ 安全工程原理; SA-14: 关键性分析; SA-15: 开发过程、标准和工具 | (4) 威胁建模/漏洞分析; SA-17: 开发者安全架构与设计]`\n\
  \n3. 为了威慑、保护并确保快速响应，聘请安全人员并将其整合。`[IR-10: 集成安全分析]`\n\n## 总结\n\n本章帮助你思考网络中脆弱的位置。你还接触了“特别用心”的概念，并可能利用了上一章中的数据流图\
  \ (`DFD`)。在下一章中，我们将探索`排外性`安全——或基于对外人的不信任的安全——以及它如何作为一种反特权类型被应用。\n\n# 3 排外安全\n\n\
  如果你在不加思考的情况下接受陌生人，敌人可能会伪装进入。\n\n> 如果乞丐或被遗弃者靠近守卫室，要粗鲁对待并将他们赶走。\n> ——Yoshimori #91\n\
  \n在本章中，我们将探索`排外性安全`的概念——即基于对外人的不信任的安全——以及它如何作为一种反特权类型被应用。为了说明这一观点，我们将考虑忍者面对的敌对环境。\n\
  \n试图公开进入村庄的忍者面临着一个普遍的挑战：古代日本普遍的排外心理。村庄的孤立产生了独特的方言、发型、服装和其他习俗，使得每个社区都有自己的社会生态系统。偏远地区的人口稀意味着每个人通常互相认识，外人显然无法融入。\n\
  \n作为外人，忍者经常被视为怀疑并被跟踪。他们不能在镇上自由移动，并经常被拒绝租房间和购买食物。当然，村民不会与他们分享信息。社区的排外性将忍者降低到了反特权状态。\n\
  \n## 理解反特权\n\n为了理解反特权的意义，让我们首先检查`特权`的概念，在网络安全中，它指的是用户执行操作（如读取或删除文件）的权限。现代计算机系统具有不同权限级别的环形架构：\n\
  \n1. `ring4`: 默认（无特权）\n2. `ring3`: 普通用户（最低特权）\n3. `ring2`: 超级用户（管理员）\n4. `ring1`:\
  \ Root（高特权）\n5. `ring0`: 内核（系统）\n\n例如，一个普通村民（最低特权）或一只猫（无特权）可能随时可以离开小镇。拥有`高特权`的村长拥有额外的权限可以可以意愿锁定城门。然而，一个被怀疑作恶的外国人（反特权）权限可能比一只流浪猫（无特权）还要少，因此不被允许离开村庄。\n\
  \n\n\n\n反特权（anti-privileged）与非特权状态之间的区分非常。在某些计算机系统中，注销等操作被视为非特权，并默认授予所有环层（rings）中的执行者。不可信的进程/用户可以使用这些默认的非特权能力来执行更具恶意的行为，或相对自由地运行以实现更复杂的目标。另一方面，通过拒绝反特权进程执行注销，你可以阻止其清除会话历史或其存在的证据。考虑一下计算机系统是否可以采用一种\
  \ `ring5`（反特权）安全控制。以我们的村庄为例，可以推测性地强制可疑的忍者在离开村庄之前接受搜索和审问。通过这种方式，村庄可以捕获小偷和间谍。此外，通过让渗透者的工作变得更加危险和昂贵，村庄无疑地威慑了敌对活动。\n\
  \n要渗透这样一个排外的村庄，忍者首先必须记忆并练习一系列具有文化差异的伪装，精通该地区独特的装束风格、方言、理容技巧、货币习俗和社会礼仪。\n\n当精通了文化伪装后，忍者仍然需要一个留在村庄的令人信服的理由；通常这与工作有关。《忍之传》描述了忍者如何利用一个通用的身份故事，也许声称是一名处于精神之旅中的僧侣、商人、乞丐，甚至是一个受领主命令旅行的武士。（尽管也会被村民视为外地人，但武士不会像潜在的逃犯或土匪那样遭受同等程度的不信任。）\n\
  \n在与相同职业、阶层或种姓的人周围伪装时，忍者被建议展示足够的知识以在职业上看起来可信，但也要表现得愚笨并需要帮助来完成常见任务。假装无知可以欺骗目标关于忍者的真实智力，同时奉承目标的智慧，导致他们降低戒备并免费提供信息。《忍之传》列出了忍者应通过这些策略争取的特定目标，例如当地副\
  \ sheriff、治安官、医生、僧侣以及其他在当地领主或权威机构面前工作的人。这些目标通常拥有对任务有价值的信息^(3)\n\n注意，中世纪日本村庄的社会阶级类似于现代计算机系统中的特权环结构，甚至类似于计算机网络的分层分，其中外部层（如\
  \ `DMZ`）是最不受信任的。同样，普通村民（特权最低）无法与处于中心 `ring0` 的领主进行交互。\n\n我们可以将忍者识别可能目标的方法应用于网络安全语境。正如忍者针对的是那些在比喻上更接近\
  \ `ring0` 或拥有 `ring0` 访问权限的人，现代威胁者也将针对目标系统/用户的特权阶级。因此，防御者应该考虑他们的系统中，类似于僧侣和治安官等高地位人士的计算机等效物是什么。此外，你应该考虑现代威胁者可能会使用什么样的伪装来接近更特权的系统/用户。\n\
  \n## 互操作性与通用标准的问题\n\n无论他们是否意识地考虑到这一点，互操作性（interoperability）都是技术消费者的首要任务：人们期望他们的设备、应用程序、系统和软件能够在新旧版本以及不同平台之间无缝运行，并与其他品牌和型号互换使用。国际标准化组织\
  \ (`ISO`)、国际电工委员会 (`IEC`)、互联网工程任务组 (`IETF`)、互联网学会 (`ISOC`) 以及其他治理机构已为技术如何设计、运行和集成建立了广泛认同的标准。\n\
  \n这些努力产生了许多 `ISO` 标准、意见请求 (`RFC`) 以及其他互操作性协议，这些协议使得计算机更容易获取，更不用说构建、管理、诊断、修复、编程、网络化和运行。一个典型的例子是\
  \ 1995 年引入的即插即用 (`PnP`) 标准，它引导主机系统检测并接受通过 `USB`、`PCI`、`PCMCIA`、`PCIe`、`FireWire`、`Thunderbolt`\
  \ 或手段接入的任何外部设备，然后自动配置、加载、安装和接口。\n\n遗憾的是，当目标是建立功能并维护其操作性时，安全性几乎从不是首要任务。事实上，`PnP`\
  \ 标准——促进了对未知实体的信任和接受——其构建方式与中世纪日本人所持的排外安全标准完全相反。例如，一个不熟悉的系统可以以外人的身份连接到网络，并向动态主机配置协议\
  \ (`DHCP`) 请求 `IP` 地址，向本地路由器询问方向，查询权威 `DNS` 服务器获取其他设备的名称，并从地址解析协议 (`ARP`)、服务器消息块\
  \ (`SMB`)、Web 代理自动发现 (`WPAD`) 以及其他旨在减轻性负担的协议中获取本地信息。你将系统接入网络，它就能工作，展示了用户期望和渴望的行为。然而，网络安全行业如果能在其网络协议中变得更加“排外”，将从中受益。\n\
  \n为了减轻由类似 `PnP` 的可访问性导致的弱点，引入了网络访问控制 (`NAC`) 和组策略对象 (`GPO`) 等安全控制。在主机系统上，这些技术防止物理连接到内部网络或系统的潜在恶意外部设备。\n\
  \n`NAC` 通常会锁定 `DHCP`，将未识别的计算机分配到访客 `IP` 子网或非特权 `VLAN`。这允许外部系统连接互联网进行通用访问，但将其与其他信任的网络隔离。这种行为对于会议室和大堂特别理想，可以使外部业务合作伙伴和供应商运行而不让网络暴露在威胁之下。\n\
  \n本地主机上的 `GPO` 强制规定了哪些类型的设备（外部硬盘、USB、媒体读取器等）可以在系统中配置和安装。`GPO` 甚至可以为组织内的已知应用程序建立白名单，同时阻止所有未知软件在系统上下载或安装。\n\
  \n然而，这些安全控制是显著的例外。从使用 `EIA/TIA-561` 和 `Yost` 标准的 `RJ45` 以太网接口到使用 `IEEE 802` 标准的数据包网络——以及其之间的一切——大多数技术都是基于透明、广为人知的标准构建的，以确保跨外部系统和网络的快速易于用，这使其容易受到可能进行网络发现、侦察、嗅探和通信的未经授权的恶意系统的攻击。\n\
  \n在你的环境中开发独特的特性将有助于将你的资产与进入环境的恶意资产进行区分，并可以保护你的网络免受侵害。\n\n\n\n\n最近引入的采用零信任模型的商业产品，可以通过技术协议和不信任机制相结合，帮助你的网络或系统对不熟悉的系统、软件和设备变得“排外”（xenophobic）。严格的白名单和身份验证/授权程序可以实现类似的效果，但适当的解决方案会引入计算机版本的“方言”——即偏离通用计算标准的设置、习俗和其他独特特征。连接到你内部网络的系统或设备需要被“教化”以适应你组织的独特文化，而未经过教化的服务器、组件、网络设备和协议将不再信任或拒绝这些陌生的外国代理，并向安全团队警报其存在。\n\
  \n通过一些创意和工程手段，这些文化计算机标识符可以在开放系统体系模型（OSI）的任何层（应用层、表示层、会话层、传输层、网络层、数据链路层、物理层）实施，以识别网络外部并提供额外的防御层。无论是在\
  \ `RJ45` 接口的隐藏适配器中转换某些接线，在 `TCP/IP` 层级期待秘密握手（`SYN`、`SYN ACK`、`ACK-PUSH`），还是使用 `Ethernet`\
  \ 报头中的保留位，一个排外解决方案都应该是模块化的、可定制的且每个实例都是唯一的。\n\n## 建议的安全控制与缓解措施\n\n在相关的情况下，以下建议结合了\
  \ `NIST 800-53` 标准中相应的的安全控制措施提出的。每项措施都应考虑到“排外安全”的概念进行评估。\n\n1. 检查系统，以确定其规格或要求是否偏离了之前约定的基准配置。[`CM-2:\
  \ Baseline Configuration`]\n\n2. 维护你组织中所有信息系统的文档，以便能够更方便地识别环境中的外国系统。[`CM-8: Information\
  \ System Inventory`]\n\n3. 使用加密信息、嵌入数据、特殊数据类型或元数据（例如，将所有数据包填充到特定大小）作为通信中的特殊标识符，以便过滤器可以识别并限制不熟悉的流量。[`AC-4:\
  \ Information Flow Enforcement; SA-4: Acquisition Process`]\n\n4. 将排外标识符的实施和认知限制于新获取的系统和设备。[`SA-4:\
  \ Acquisition Process`]\n\n5. 将排外检查作为一种安全控制措施，用于识别和验证你组织内的系统和设备。[`IA-3: Device Identification\
  \ and Authentication`]\n\n## 汇报总结\n\n本章描述了历史上忍者（shinobi）所处的排外环境，这种环境需要投入精力和精力以及先进技术，在开始实际目标侦察之前使用公开伪装战术进行准备性侦察。你学习了反特权的概念，以及如何创建独特的内部特征来识别环境中的流氓资产或用户。现在，你可能能够识别出环境中可能成为目标的关键资源或人员（这些目标在之前的威胁建模练习中可能未被视为攻击向量），随后你可以考虑与这些潜在目标密切工作的系统或账户。\n\
  \n然而，通过使用正确的徽章、服装、发型、口音和其他特征，忍者可以避开本章详述的排外检查。因此，在下一书中，我们将探索日本领主历史上使用的“配对安全”技术，用于检测可能通过伪装渗透进其防御工事的忍者。\n\
  \n# 4 识别挑战\n\n尽管有古老的识别标记、密码和证书方法，除非你发明新的方法并进行轮换，否则敌人将通过使用类似的伪品设渗透进来。\n\n> 在夜袭期间，你可能会让敌人跟随你并进入盟友的队伍。为了防止这一点，请制定一项预先的政策——一种识别盟友的方法。\n\
  >\n> —Yoshimori Hyakushu #27\n\n想象以下历史情景：在派遣大大部队进行夜袭后，军事指挥官必须打开大门让他们回到防御工事内部。夜袭有助于赢得战斗，但也提供了反击的机会。敌人忍者可以从进攻部队中伪造或偷取制服，并在他们返回基地时混入他们的阵型。\n\
  \n为了应对这种威胁，指挥官实施了让突击者在通过大门前使用的一次性口令——但这种密码很容易被破解：伪装的忍者会在排队中其前面的士兵说出密码时偷听到它。因此，指挥官们尝试了其他识别方法。有些方法要求袭击者全部穿着某种特定秘密颜色的内衣，以便在返回时进行检查，但聪明的忍者会携带或穿着多种颜色的内衣，然后有选择性地拉开内衣层数，使得在检查期间只显示正确的颜色。额外的对措施包括每天更改多次密码（这仍然无法阻止忍者偷听到当前的密码）以及独特的制服徽章或令牌（忍者可以在袭击后从死者的尸体上偷取）。\n\
  \n忍者将这些技术分为公开伪装之术（*yo-nin*，字面意为“光忍者”）或隐藏渗透之术（*in-nin*，字面意为“暗忍者”）。在这种情况下，*公开*指的是显而可见；例如，攻击者可以穿着防御士兵的制服，完全预料会被看到。另一方面，*隐藏*指的是试图不被看到，例如使用迷装或融入阴影。`Bansenshūkai`\
  \ 中描述的许多各种公开伪装技术既可用于进攻也可用于防御。忍者不仅知道如何使用这些技术进行自己的攻击，还如何发现敌人渗透者。间谍复制制服和纹章或偷听密码是常有的，因此忍者开发了识别应对措施来区分盟友和敌人。\n\
  \n其中一种识别技术是“配对”（`matched pairs`），即用于验证盟友的单词组合挑战.^(1)）。这种技术也被称为“对号”（`countersigns`）或“挑战-响应认证”（`challenge-response\
  \ authentication`）。配对技术的工作原理如下：一个身份不明的人靠近城堡门口的守卫并请求进入。守卫首先检查陌生人是否穿着正确的制服并佩戴正确的纹章。如果是，守卫会说出一个单词——例如“树”。如果陌生人没有给出预先约好的匹配词——“森林”——守卫就知道他们面对的是一个敌人。虽然\
  \ `Bansenshūkai` 规定配对短语应该简单到让“低级”人员能够记住，但它建议不要使用对手可能猜到的常见关联。因此，与其使用“雪”和“山”，一个更理想的配对可能是“雪”和“富士山”。卷轴建议忍者与指挥官合作，每\
  \ 100 天生成 100 对不同的单词配对，每天使用一组新组合.^(2)）。这种大量的配对允许哨兵在每支部队靠近时（如有必要）在列表中随机轮换，使得伪装的敌人不太可能听到他们将收到的挑战词的答案。\n\
  \n\n\n配对（Matched pairs）曾被用于揭示可能的渗透者。如果陌生人错误地回答挑战，他们会被迅速扣留、审问并可能被杀死。由于知道这些后果，《忍之帖》（Bansenshūkai）建议尝试渗透敌营的忍者将自己的外表、行为和言语伪装成邋遢或低层士兵的样子。这样一来，如果他们被要求回答他们不知道的配对挑战，他们就可以令人信服地声称自己无所不知^(3)。某些读者可能会注意到，他们的金融机构已开始在在线认证中实施匹配单词或图像对，但需要注意的是，这些网站并不需要\
  \ 100 组不同的配对，而且更新频率不高（或者根本不更新）。小小的静态配对池使得对手能够观察所有的配对，然后利用窃取的身份验证响应执行未经授权的操作。\n\n\
  这些历史案例强调了在试图从高级且动态的对手手中保护身份验证时所面临的挑战。在本章中，我们将探讨证明你的身份有多困难，以及信息保证（IA）中用于验证他人身份的各种因素。我将提到现代网络威胁行为者用于阻碍“仅验证正确人员”这一最佳努力的一些技术，并强调类似的忍者战术，以说明为什么在可预见的未来，身份验证将一直是一个挑战。我还将为读者提供指导，说明他们如何将忍者身份验证技术应用于现代应用程序。本章的总体目标是帮助读者理解这一识别问题涉及的核心问题，而不是迷失身份验证和密码学已变得极其庞大的知识领域。\n\
  \n# 理解身份验证\n\n`Authentication`（身份验证）是在授予访问信息系统、数据、网络、物理场所和其他资源的权限之前，确认用户身份的过程。身份验证过程通过要求用户提供其所知的、所拥有的或所具备的来确认用户身份。例如，身份验证器可能会要求密码（用户所知道的）、令牌（用户拥有的）或生物识别（用户所具备的）。根据所需的安全级别，组织要求`单因素`、`双因素`或`多因素`认证。\n\
  \n成熟的组织可能还会使用`strong authentication`（强认证），它使用多层多因素凭据。例如，强认证的第一步可能需要用户名、密码和指纹，而第二步则通过令牌和通过短信发送的一次性代码进行验证。行业专业人士日益考虑到第四因素的可行性，例如组织内的一位受信任人员，可以确认用户的身份。有趣的是，配对忍者的场景正是从这种测试开始；只有当区域内没有人能验证陌生人的身份时，才会使用该挑战。\n\
  \n身份验证失败是一个关键的安全漏洞。用户经过验证的身份与权限绑定，这些权限允许他们执行特定的（通常是特权的）操作。成功“搭便车”用户已验证连接的对手，可以自由访问该用户的资源，并在信息系统、数据和网络上进行恶意活动。\n\
  \n遗憾的是，身份验证过程并不完美。尽管有许多网络认证措施，目前无法百分之百确定地验证用户或进程的身份，因为几乎每个现有的验证测试都可以被伪造（`spoofing`\
  \ 是使用虚假数据冒充另一个实体）或攻破。对手使用多种技术来窃取密码、拦截令牌、复制身份验证哈希值或票据，并伪造生物识别。如果攻击者获得了身份管理系统（如`domain\
  \ controllers`）的未经授权访问，他们就可以创建并验证伪造的账户。在用户身份验证后，除非执行特权任务时需要重新输入密码，否则他们在会话期间很少会受到挑战。同样，伪装的忍者可以在城堡内部徘荡而不受挑战——在这两种情况下，系统都假设内部人员已经通过了身份验证。\n\
  \n安全技术正在进化以应对身份验证威胁。一种新兴解决方案被称为`continuous authentication`（持续认证）或`active authentication`（活跃认证），它在初始登录后不断验证用户身份。然而，由于持续认证对话可能会干扰用户体验，目前也在开发相关技术，通过打字风格、鼠标移动或其他与用户身份相关的特征来监控身份验证。此类技术可以捕获物理访问被遗留的登录系统的对手，并将其锁定。这种方法也适用于未经授权的远程访问方法，例如`Remote\
  \ Desktop Protocol (RDP)`会话。即使攻击者使用了有效的凭据和身份验证器进行登录，此类技术也能识别出攻击者。当然，人的行为可能会改变。此外，复杂的对手可以通过在攻击中加入用户行为侦察，对特定行为进行模仿或模拟。\n\
  \n配对模型的一种可能实现涉及人机接口，该接口使用被动脑波传感器连接到系统，该系统根据用户的思考方式来验证身份。研究表明，当人类看到以前交互过的物体或有特定的想法关联时，会产生独特的脑波模式。因此，向用户展示受控刺激（例如配对的单词或图像组合），监控脑的的电响应，并将其与用户配置相匹配，就可以准确地验证用户。通过风格化的排列动态生成足够的独特挑战对，对手不太可能重放或模拟用户的脑波活动。\n\
  \n在下一节中，我们将讨论你可以用于配对身份验证的一些技术。\n\n## 开发配对身份验证器\n\n以下是关于开发配对身份验证器的建议以及应用想法。\n\n1.\
  \ 与合适的商业身份验证供应商合作。寻找使用挑战短语认证的供应商，这种认证与用户的密码、账户名称或其他可能被对手攻破的识别信息不同。虽然某些金融机构在授权账户更改之前使用配对挑战短语，但不幸的是这种方法通常只在用户报告丢失或忘记密码时使用，且挑战短语是静态的，不会改变。\n\
  \n2. 开发新的身份验证系统。身份验证产品可能与身份控制集成，每当已验证的用户尝试执行特权操作（例如`admin/root/system commands`）时，向其展示配对挑战。在这种协议下，即使对手观察到了一个或几个挑战对，他们执行特权操作的也会被拒绝。\n\
  \n\n\n\n一个理想的产品使用两种形式的配对挑战：每日挑战和用户预设挑战。每日挑战在仅对授权人员可见的区域以非数字化方式分发，通过单词或图像对本地身份验证请求进行挑战，并要求用户提供匹配项进行响应。所有其他员工（包括远程/VPN\
  \ 员工）则建立一套大型且不易被遗忘或误解的匹配词对。组织随机选择这些配对或轮换它们，以快速定位在网络上通过验证的未经授权用户。（注意，为了防止攻击者利用受损或伪造的凭据插入自己的匹配配对，必须对活动挑战系统中的新配对进行安全的传输、存储和审计。）考虑在安全受控信息设施\
  \ (SCIF) 或需要手动身份验证和授权才能进入和使用的隔离房间内使用单向接口插入匹配配对。其他机制可以通过要求访问用户的麦克风、摄像头、位置、运行进程、运行内存或缓存、桌面截图以及其连接系统上的其他信息来伏击未身份的用户，从而更好地识别威胁的来源和身份。\n\
  \n## 建议的安全控制与缓解措施\n\n在相关的情况下，建议结合来自 NIST 800-53 标准的适用安全控制进行提出。每项都应在配对识别和身份挑战响应的背景下进行评估。\n\
  \n1. 对于特权账户，在设定一段时间后、根据特权用户请求或响应可疑行为时实施会话锁定。只有在用户提供配对挑战响应后才重新建立访问。（会话锁定可能比普通的密码锁定更好，因为挑战配对匹配只需点击一次或比用户账户密码更简单的单词。）[AC-11:\
  \ 会话锁定；IA-2: 识别与认证（组织用户） | (1) 特权账户的网络访问 | (3) 特权账户的本地访问；IA-10: 自适应识别与认证；IA-11:\
  \ 重新认证]\n\n2. 识别、记录并强制执行安全控制在不通过配对挑战响应的情况下可以在系统上执行哪些用户操作——例如，联系技术支持或拨打紧急电话。[AC-14:\
  \ 未经身份识别或认证的允许执行的操作]\n\n3. 通过建立大型一次性挑战响应身份验证器，开发能够抵抗重放攻击的配对认证流程。[IA-2: 识别与认证（组织用户）\
  \ | (8) 特权账户的网络访问——抗重放]\n\n4. 捕获唯一标识请求认证的用户设备的信息，以获取有关未通过配对挑战响应的未识别攻击者的的情报。[IA-3:\
  \ 设备识别与认证 | (4) 设备归属证明]\n\n5. 要求面对面配对输入，以缓解挑战响应识别系统的被破解风险。[IA-4: 标识符管理 | (7) 现场注册]\n\
  \n6. 在物理和逻辑上隔离配对挑战响应系统，并实施严格的访问控制，以保护其免受破解侵害。[IA-5: 身份验证器管理 | (6) 身份验证器的保护]\n\n\
  ## 总结\n\n本章强调了指挥官在验证士兵身份以防止伪装忍者（shinobi）渗透进其防御工事时所面临的挑战。你学习了配对识别技术，包括忍者如何利用它来检测敌人，以及忍者在进攻时针对该技术采取了哪些保护措施。你还看到了这种技术在计算机安全认证和识别中的现代对应物。在下一章中，你将利用对身份验证因素的理解来学习“双重密封（double-sealing）”的不同之处。\n\
  \n### 双重密封密码\n\n有时，`双重密封`信号（如捏鼻子或夹住耳朵）应该配合`双重密封`使用。\n\n## 5 双重密封密码\n\n“Banshūkai”（万州会）和“Gunpo\
  \ Jiyase”（军报伪造）都指示“Banshūkai”站立或坐下。“Banshūkai” 指令忍者在所有检查站模仿守卫的行为和言语，即使守卫看起来像是在没有意识意图的情况下行动；至少，这可能让守卫误认为忍者组织无章或愚蠢。\n\
  \n### `tachisuguri` 密码\n\n在 `tachisuguri isuri` 最常见的例子中，穿着正确制服的人靠近大门。守卫不认识陌生人，选择坐下或起身，然后低声说单词。如果访问者是熟悉\
  \ `tachisuguri isuri` 识别协议的盟友，他们将执行预定义的动作——一种不明显的信号，如触摸鼻子或耳朵——并低声说密码。只有当陌生人同时给出密码和正确的动作时，守卫才允许进入。（除了让守卫站立或坐下外，可能还有多种实现\
  \ `tachisuguri isuri` 的方法，但遗憾的是，这些方法被认为记录在《Banshūkai》丢失的补充章节《Teikairo》中。）\n\n这种技术的简单巧妙之处在于，站立或坐下的动作通常不会被注意到。即使是试图冒充人员的恶意观察者也可能忽略这种第二种沉默的挑战响应。他们可能会看到\
  \ 100 人使用相同的口令进入大门（因为守卫认识他们），因此他们不会看到当守卫站立时互动会有何不同。`tachisuguri isuri` 的成功程度足以让其他忍者也没有足够的防御措施来阻止它。卷轴还为任何失败未知\
  \ `tachisuguri isuri` 挑战的忍者提供了这条实用的建议：要么反应快、说话得快——要么逃命。\n\n\n\n\n然而，间谍们发现通过特殊的加热技术，他们可以弄松蜡，在不损坏纸张的情况下完好取出封条，读取信件内容，然后重新封好原始文件，或将封条加到包含虚假信息的伪造文件上。针对熔化蜡封纸张一面的技术，一种应对方法可能是对蜡进行“双重密封”。想象一下，作者使用的不是单一金属印章，而是一个带有前后印章的夹具或虎钳式设备。蜡片的底部会在纸张的背面压留一个隐藏的封印，只有在撕开文档时才能检查。试图从纸张上熔化封条的尝试可能会保留表面的封印，但会破坏第二个隐藏封印，从而使通信变为双重密封。\n\
  \n你可以看出为什么双重密封被采用作为对抗渗透单密封尝试的有效对策，以及它如何帮助检测敌方忍者活动的。在本章中，我将说明双因素认证（two-factor authentication）和二步认证（second-step\
  \ authentication）之间的区别。我还将讨论现代二步身份验证器如何通过双重密封来提高其有效性。随后，我将描述我认为实现双重密封密码所需的条件和标准，以及使用现有身份验证器和技术的实现方案。我的希望是在完成这些思考练习并看到我提供的双重密封密码实现示例后，你会赞叹楠木政盛（Kusunoki\
  \ Masashige）的天才，并亲自尝试这个高度直观的想法。\n\n## 隐藏的二步认证\n\n越来越多的网络认证和身份识别协议在密码之上增加了安全层。这被称为`二步认证`（`2-step\
  \ authentication`）：第二步要求用户执行额外的认证操作，例如提供密钥代码或点击`带外`（`out-of-band`）`device`（即不参与认证过程其他部分的设备）。请注意这与上章的双因素认证细微区别，后者用于防止攻击者通过盗取的凭据访问账户。\n\
  \n虽然密钥代码（第二步）可以通过软件应用程序进行随机化，但它通常每次都使用相同的程序生成。遗憾的是，这种程序上的僵化为攻击者提供了许多破解二步认证方法的机会。例如，二步认证代码通常以明文、不安全的消息形式发送，可以通过手机克隆被拦截。在这种情况下，接收到代码\
  \ `12345` 并在密码提示处输入该序列的用户，也会无意中将代码提供给攻击者。用于认证的设备（通常是手机）可能会被盗、通过呼叫转移被劫持，或被攻击者克隆并用于完成认证。同样，为交付二步代码而建立带外设备可能会丢失或被盗，并被用于绕过认证过程，允许攻击者窃取用户提供的备份代码。\n\
  \n使用“交叉置替”（tachisuguri isuguri）技术进行双重密封的二步代码可以缓解认证程序中固有的某些缺陷。每个用户都应该能够建立一个预先的、对他们来说唯一且有意义的“tachisuguri\
  \ isuguri”标识符。例如，假设用户收到了口头或其他安全方法的指令，要求在他们的二步代码中跨越键盘上的数字 `5` 进行转置——1 变成 `9`，2 变成\
  \ `8`，依此类推——但仅在代码显示红色字体而非正常绿色时执行。这种颜色变化是隐藏的“交叉置替”因素，当系统发现由于时间异常、未识别的设备或发起请求的 IP\
  \ 地址不同或其他标准导致认证请求可疑时触发。（为了防止可能观察登录行为的攻击者，此协议不应过于频繁。）现在，当合法用户收到红色代码 `12345` 时，他们知道响应\
  \ `98765`，而窃取了用户凭据但不知道隐藏规则的攻击者会输入 `12345`。这将停止认证进程，将账户标记为调查，并在会话中增加一次二步认证失败。随后，二步验证器会发送提示——“使用认证协议\
  \ #5”，可能还会附带另一个红色代码，如 `64831`（用户应响应为 `46279`）。另一个错误的响应将触发进一步的警报或账户锁定。\n\n## 开发双重密封密码\n\
  \n与行业标准授权控制集成的双重密封安全解决方案将执行以下操作：\n\n1.  仅在用户身份存疑疑时使用：\n    *   从新设备登录\n    *   报告其移动设备被盗\n\
  \    *   丢失其令牌、代码或密码\n2.  使用带外通信方法。\n3.  使用秘密的、基于规则的因素。每个用户都应该能够自定义规则。\n4.  利用易于理解和记忆但又不显而易见的因素。\n\
  5.  允许在连续猜测的情况下将规则堆叠。\n6.  在认证尝试失败后对账户进行限制、冻结或锁定。\n7.  不锁定。\n\n双重密封安全的普及需要设计师、工程师和用户共同探索技术上的可行性。例如，考虑现有移动设备上可以各种输入变化，并仅要求用户点击“是”或“否”来验证身份。以下是当用户在二步应用中收到“交叉置替”信号时，可能响应的范围示例：\n\
  \n1. 用户在点击“是”之前将屏幕倒置，应用程序静默检查`DeviceOrientation`状态以测试其是否为`portraitUpsideDown`。\n\
  2. 用户在点击“是”之前操作移动设备的物理音量键将`OutputVolume` 设置为 `0.0`（静音）或 `1.0`（最大），应用程序静默获取音量浮点值以测试是否符合预期值。\n\
  3. 用户等待到移动设备时钟跳到下一分钟再选择“是”，然后立即点击。应用程序执行静默时间戳请求，将选择时间与 `HH:MM:0X` 进行比较，其中 *X* 小于\
  \ 3 秒。\n4. 用户在移动设备上点击“是”时使用压力，应用程序静默获取事件的`UITouch.force`以判断是否超过预设阈值。\n5. 用户在移动设备上多次快速点击“是”按钮，应用程序静默获取`UIEvent`的`tapCount`以判断是否小于\
  \ 2\n6. 用户在点击移动设备“是”按钮时执行手势，应用程序静默获取`UIGestureRecognizer`以判断其是否为`Pinch`（缩放）、`LongPress`（长按）、`Swipe`（滑动：上、下、左、右）或`Rotation`（旋转）。\n\
  \n\n\n\n在相关情况下，建议结合了来自 `NIST 800-53` 标准的适用安全控制。每项建议都应根据两步（双重密封）认证进行评估。\n\n1. 通过独立的通信路径利用带外认证\
  \ (`OOBA`)，以验证身份验证请求源自已验证的用户。[`IA-2: 识别与认证 | (13) 带外认证`]\n\n2. 确保员工不泄露两步认证隐藏规则的存在。[`IA-5:\
  \ 身份验证器管理 | (6) 身份验证器的保护`]\n\n3. 建立多重密封规则，使 `tachisuguri isuguri` 不是静态的。[`IA-5:\
  \ 身份验证器管理 | (7) 不嵌入明文静态身份验证器`]\n\n4. 实现带外通信并建立双密封规则以维护机密性。[`SC-37: 带外通道`]\n\n5.\
  \ 为失败的认证尝试仔细设计错误消息，使其不会泄露对手可能利用的双重密封密码信息。[`SI-11: 错误处理`]\n\n## 总结\n\n在本章中，你学习了一种名为双重密封密码或\
  \ `tachisuguri isuguri` 的反忍者认证技术。我们涵盖了身份验证过程中因素与步骤之间的区别。然后，我们对一个良好的 `tachisuguri\
  \ isuguri` 身份验证器的标准进行了简要分析。\n\n在接下来的章节中，我们将讨论一个名为“渗透时段”的忍者概念。你将了解到一天中的某些时段如何为渗透提供有利机会。理解这些基于时间的机遇可能帮助你决定在组织何时实施或触发\
  \ `tachisuguri isuguri` 身份验证器，例如仅在特定小时或特定日期，以最大限度地减少 `tachisuguri isuguri` 的使用并保护其秘密性。\n\
  \n# 渗透的 6 小时\n\n等到丑时后，忍者意识到守卫已经睡着了；一切死寂，火熄灭了，留下一片黑暗。\n\n> 对于忍者来说，了解正确的时刻至关重要。那一直应该是敌人疲劳或放松警备的时候。\n\
  > —吉森百首集 #5\n\n在策划盗窃、间谍、破坏、暗杀或其他攻击时，忍者并不受体育道德精神或公平竞争的负担。相反，他们会仔细考虑出击最“建议的时间和有利的位置”。《忍之记》强调了等待渗透，直到目标分心、精疲打采、可能判断草率、饮酒嬉闹或仅仅精疲力竭时的重要性；《吉森百首集》第\
  \ 63 首诗指出，人的疲劳“可能会导致严重的失误”。忍者是此类行为的敏锐观察者，通常会在敌人正在砍树、专注于建立自己的阵地、战斗后感到疲劳或更换守卫时渗透。\n\
  \n在研究敌人的行为时，忍者们发现可预测的人类日常行程创造了攻击的机会窗口。卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……（等等，文本继续）……卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……\n\
  \n卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……（注：原文包含重复短语，我已保持了核心叙述流）。\n\n卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……（实际上，查看提供的文本）：\n\
  \n卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……（提供的文本似乎包含一些循环或片段，我将对现有内容进行格式化）。\n\n卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……（让我仔细重读提供的文本）。\n\
  \n卷轴将一天分为两小时一个区块，并建议在以下区块期间计划渗透……\n\n\n\n\n1. 确定每小时的活动基线。\n\n2. 培训人员监控活动，并使他们非常熟悉其分配时段内的典型活动。\n\
  \n3. 评估每小时的业务需求。根据此评估，创建业务逻辑和安全公理，以进一步缓解威胁并检测异常。\n\n首先，考虑将您的网络和系统日志划分为一或两小时的段落。回顾网络和系统的历史趋势和活动水平，以建立基线，基线是威胁狩猎和识别网络卫生问题的关键指标。特别关注发生过攻击的时间段，以及根据组织情况、威胁建模和经验判定的可能常规性易受攻击的时间。\n\
  \n一旦所有数据都完成了分段和基线化处理，就开始培训分析师、系统管理员和安全专业人员，让他们极其熟悉您的网络活动模式。他们还应该意识到组织常规操作会产生的安全漏洞。忍者卷轴（shinobi\
  \ scrolls）要求守卫在值班期间仔细检查每一个不规则之处和不协调之处。例如，他们应该注意到渔民何时比正常情况下得得，或者是否有不熟悉的鸟类在奇怪的时间鸣叫。让安全人员同样对不协调之处保持敏感，可能会促使他们对异常事件进行二次检查，从而揭示安全事件。开发这种深层专业知识可能需要指派安全人员监控某个扇区——例如，一个被认为是可能目标的单一系统——让他们极其熟悉该系统，然后在其八小时值班期间审查该系统两小时内的所有日志和事件。这种策略与大多数\
  \ SOC（安全运营中心）“随时监控一切”的心态形成鲜明对比——这种心态会导致告警疲劳、过载和职业倦怠。它还可以缓解许多自动化异常检测系统的问题，这些系统需要人类对每个异常进行跟进并提供反馈和调查。这些系统会迅速变得难以负担，而对于每天或每周审查异常的安全人员来说，数据变得晦涩不可。\n\
  \n请注意，`security logs`不像夜中的声音那样转瞬即逝，而是供未来分析的。复杂的对手可能会修改或删除安全日志、过滤来自网络分路和传感器的流量，或以其他方式破坏记录其入侵并告警安全的系统。然而，这些行为应该足以干扰系统的正常行为，从而让敏锐的安全分析师注意到。\n\
  \n接下来，您可能想问自己两个问题：\n\n* 您的用户和系统何时处于活跃状态？\n* 对手何时可能处于活跃状态？\n\n理解用户何时以及如何登录并操作系统有助于您策略性地限制访问，使外部或内部威胁难以在您最脆弱的时间渗透。例如，如果一个系统在晚上\
  \ 8:00 到第二天上午 8:00 之间未使用，则在这些时间内关闭该系统。如果用户在周六没有访问系统的业务需求，则在周六禁用所有用户对这些系统的访问。在计划时间禁用系统也有助于训练\
  \ SOC 员工检测特定小时段的异常，因为需要审查的告警和系统会更少。NIST 标准建议实施此类访问控制，但许多组织为了紧急情况下的操作便利而优先考虑某些场景，无论这些发生的概率有多小。\n\
  \n## 推荐的安全控制与缓解措施\n\n在相关的情况下，建议结合 `NIST 800-53` 标准中的适用安全控制提出。每项建议都应考虑到渗透所需的时间窗口进行评估。（注意，应用这些技术要求日志和告警具有时间戳，且所有系统的时间必须同步。参见\
  \ `AU-8: Time Stamps`。）\n\n1. 评估您的运营时间并进行威胁建模。您何时最容易受到攻击？您可以做什么来培训您的员工做好准备？`[NIST\
  \ SP 800-154: Guide to Data-Centric System Threat Modeling]`\n\n2. 根据用户的业务和运营需求对账户实施基于时间的权限控制。例如，限制某些用户在晚上\
  \ 7:00 之后发送或接收工作邮件的能力。`[AC-2: Account Management | (6) Dynamic Privilege Management]`\n\
  \n3. 限制在特定小时段内登录或使用特定账户的能力。例如，当有人在晚上 9:00 到晚上 11:00 之间尝试对非活动账户执行未经授权的操作时，立即告警用户以核实其身份。如果他们未予响应或身份验证失败，则告警\
  \ SOC。`[AC-2: Account Management | (11) Usage Conditions]`\n\n4. 利用启发式分析系统检测设定时间段内的异常系统访问或使用模式。用户应自愿记录并提供典型用途的见解，以帮助建立预期行为。`[AC-2:\
  \ Account Management | (12) Typical Usage]`\n\n5. 要求系统所有者和用户记录预计何时使用系统以及何时可以关闭。`[AC-3:\
  \ Access Enforcement | (5) Security Relevant Information]`\n\n6. 缩短对手的操作时间范围。定义一项策略政策，使得敏感或专有信息仅在设定时间内访问——例如，工作日的上午\
  \ 11:00 到下午 3:00 之间。`[AC-17: Remote Access | (9) Disconnect/Disable Access]`\n\n\
  7. 在账户持有者成功或失败登录时通知他们，包括上次登录的时间和。`[AC-9: Previous Login | (4) Additional Logon Information]`\n\
  \n8. 在建立运营时间后，配置用户设备和系统在指定时间自动锁定，终止所有会话。`[AC-11: Session Lock]`\n\n9. 编写一项允许基础设施更改的时间和日期的政策。这有助于\
  \ SOC 按小时评估网络和配置更改。`[AU-12: Audit Generation | (1) System Wide and Time Audit Trail;\
  \ CM-5: Access Restrictions for Change]`\n\n## 结要回顾\n\n在本章中，你学习了基于中国十二生肖的日本传统时间、中国占星术对占卜的影响，以及忍者可能如何利用这些来获取渗透或胜过目标的机会。你考虑了网络活动如何随一天的时间变化，以及你如何通过基于时间的控制来减少攻击机会。你熟悉了忍者的安全标准。具体来说，你了解到守卫被要求在值班期间注意到其扫描区域内的每一个不协调之处——任何可能暗示对手存在的迹。此外，你还回顾了如何将这些概念应用于威胁狩猎、安全运营流程和异常检测系统。\n\
  \n在下一章中，我们将回顾时间机密性的应用，即向恶意软件隐藏时间，这允许防御者利用特定的检测和防御选项。\n\n\n\n\n\n当忍者执行任务时，特别是在夜间，他们最关键且复杂的职责之一就是追踪时间。如果你觉得这项任务看起来很简单，请记住，忍者当时并没有手表或时钟。直到\
  \ 17 世纪初，他们甚至还没有沙漏计时器。为了在适当的时间发送和接收信号、协调攻击、获知敌人何时会变得脆弱等，忍者必须开发出可靠的计时时间方法。\n\n从历史角度来看，标记时间的一种方法是点燃燃烧速度恒定的香或蜡烛，然后在特定的间隔内敲钟宣布时间。《忍之书》（*Bansenshūkai*）建议利用环境线索（如星辰移动）或基于重量的仪器来计时。这些基于重量的仪器可能是水钟（有时被称为\
  \ *clepsydras*），它们利用平衡和水流/重量机制来精确地发出时间间隔信号。其他卷轴还包含了更深奥的选择，例如跟踪猫瞳孔在一天内的扩张变化，或者建筑物在夜晚微妙的热膨胀，因为这些变化与特定的时辰相对应。忍者甚至被教导通过观察哪个鼻孔呼吸更活跃来推算时辰。卷轴解释了呼吸如何以规律的间隔在一个鼻孔中进出，然后切换到另一个鼻孔，这可以用来追踪时间。虽然这个想法看起来可能像伪科学，但在\
  \ 1895 年，德国科学家理查德·凯瑟（Richard Kayser）观察并记录了在白天，血液会聚集在人脸的不同侧，导致一个鼻孔的空气流量明显减少，然后切换到另一个鼻孔。忍者敏锐的观察力不仅在西方科学发表该现象之前的\
  \ 300 多年就识别出了这种现象，而且还为此开发了实际应用。例如，他们可能需要躺在目标下方地板的爬行空间内，在那里他们无法点燃蜡烛或香，无法使用仪器计时，甚至不敢睁眼，因为眼睛中的光芒可能会通过地板缝隙引起目标的注意。在这些不便的情况下，他们会静止不动并注意鼻呼吸，直到攻击时间的到来——这是忍者纪律、智慧和创造力的极佳范例。\n\
  \n忍者卷轴中对时间的大量引用，结合为了追踪时间而开发的艰辛方法，表明如果保持时间追踪对于威胁行为者的有效运作至关重要，这些技术就不可能被开发出来。现代社会中廉价、简单且可靠的计时方式的随处可见，几乎肯定让我们习惯了将时间及其测量视为理所应当。\n\
  \n在本章中，我们将重新考虑数字系统中时间的价值和重要性，同时简要回顾如何使用现有的最佳实践对其生成、使用和保护。然后我们将问：如果准确的时间对对手来说如此重要，如果我们能对他们隐瞒时间，会发生什么？或者拒绝对手访问时间？抑或用不准确的时间欺骗他们？\n\
  \n## 时间重要性\n\n时间对于几乎每个现代计算机系统的运行都是必须的。通过同步顺序逻辑并产生规定功能间隔的时钟信号，计算机建立了有限的时间脉冲。这些脉冲就像时钟的滴答，系统在稳定、可靠的输入输出环境中对数据执行操作。运行我们政府、经济、商业和个人生活的庞综网络和系统都在这些脉冲上运行，持续请求时间。如果没有时钟，它们无法运行。\n\
  \n存在许多安全控制来保护时间数据。网络时间协议（`NTP`）服务器上的身份验证可以确保攻击者没有伪造系统的信任时间源。`NTP` 服务器时间数据上的加密和校验和（加密对通信编码，校验和用于检测传输过程中的错误）可以验证其完整性并防止其被篡改。`Nonce`\
  \ 是添加到时间通信中的任意随机数，以防止重复传输错误。时间戳和时间同步日志将系统时间与权威时间源报告的时间进行比较。`NTP` 通过利用多个时间源和备用传播方法保持可用性和容错性；如果拒绝访问\
  \ `NTP` 或其不可用，则备份方法可以根据上次同步准确估算时间。额外的安全最佳实践要求对审计记录进行时间标记、根据不活动锁定会话、根据一天中的时间限制账户访问、根据时间/日期信息评估安全证书和密钥的有效性、建立备份时间，以及衡量缓存记录保留多久。\n\
  \n这些控制保护了时间数据的完整性和可用性，但很少有足够的考虑来保护时间数据的机密性。几乎任何现代应用程序都可以随时请求时间，并且通常不仅允许访问日期和时间，还允许访问时钟库和函数。虽然\
  \ `NTP` 可以加密其通信给系统的时间数据，但在限制访问当前系统时间方面明显缺乏此类控制措施。识别这一控制漏洞是重要的，因为时间是对手用于传播恶意软件的关键信息之一。例如，破坏性的\
  \ `Shamoon` 恶意软件被设置为在沙特阿拉伯周末开始时执行以造成最大伤害；它被设计在任何人注意到之前清除所有受感染系统。\n\n其他常见攻击包括泄露机密信息、引起竞态条件、强制死锁、操纵信息状态以及执行计时攻击以发现密码秘密。更复杂的恶意软件可以使用对时间的访问来：\n\
  \n*   睡眠一段时间以避免检测\n*   计算圆周率到 100 万位，测量计算所需的时间以判断受感染系统是否处于沙箱/触发环境\n*   根据特定的时间指令尝试联系其命令控制（`C2`）\n\
  *   通过计时攻击发现元数据和其他信息，揭示目标系统的状态、位置和能力\n\n如果管理员能够拒绝访问时间（本地、实时和线性时间），那么在目标信息系统内执行操作对对手来说将变得困难得多——甚至可能是不可行的。然而，需要注意的是，草率限制时间查询可能会导致级联故障和错误。需要一种精确的方法来拒绝访问时间。\n\
  \n## 保持时间机密性\n\n请记住，由于机密性不像其他形式的安全那样根深，应用此类安全控制将需要你的组织和更广泛的安全社区付出特殊努力。\n\n### 确定你的基准\n\
  \n识别你环境中需要访问时间的软件、应用程序、系统和管理命令。实施函数钩子（拦截函数调用）和日志记录，以确定是谁是什么在请求时间。建立此基准后，使用它来检测异常的时间查询，并为基于时间的需要评估提供信息，从而定制额外的安全控制（例如，即时安全\
  \ (`JIT`））。\n\n### 评估技术能力\n\n\n\n\n\n联系您的硬件制造商和软件供应商，确定可以启用哪些技术控制措施来限制对时间函数的访问。如果没有此类控制措施，请要求实现新功能，以鼓励行业开发围绕时间机密性的解决方案。\n\
  \n### 建立策略\n\n拒绝访问时间是一种非传统的安全控制，但与更常规的控制措施一样，执行执行需要制定战略策略，并详细说明要求——在这种情况下，即限制对时间的访问并监控对时间的访问尝试。在可能的情况下，在所有的变更管理决策、新硬件软件采购以及\
  \ SOC 优先级排序中纳入时间机密性的概念。正式记录新策略，并确保贵组织的 CISO 批准了它们。\n\n## 建议的安全控制措施与缓解措施\n\n在相关的情况下，建议结合\
  \ `NIST 800-53` 标准中的适用安全控制措施。每项措施都应结合时间机密性的概念进行评估。\n\n1. 实施保护措施，阻止访问时间戳日志或其他信息监控日志中的时间数据。防止时间泄露或时间戳泄漏可能需要物理、环境、介质和技术控制措施。[`AU-9:\
  \ 审计信息的保护`]\n\n2. 审查您当前的时间信息架构，包括在您的环境中实施时间数据访问和机密性控制所需的哲学、需求和战术。如果利益相关者同意限制时间，请将其记录在安全计划中，并分配已批准的预算、资源和专门用于实施的时间。[`PL-8:\
  \ 信息安全架构`]\n\n3. 进行日志审查和内部狩猎，以发现通过端口 `123` 与您环境中的任何非官方 NTP 服务器进行的通信。寻找与外部 NTP 服务器的\
  \ 通 通，并考虑阻止访问您无法控制的 NTP 服务器。[`SC-7: 边界保护`]\n\n## 总结\n\n在本章中，你学习了一些忍者（shinobi）用来计算时间的工具，以及他们如何利用对时间的知识。我们讨论了时间对网络行动和安全有多么重要，并注意到目前的安全实践主要关注系统内时间的可用性和完整性。你还接触了一项思考练习，探讨了如何通过操纵时间来缓解忍者攻击。\n\
  \n在下一章中，我们将讨论忍者如何将许多事物变成工具来完成任务。理解等同数字“工具”可能帮助你检测并防止此类工具的新型武器化，或至少阻碍其使用。\n\n# 8\
  \ 种工具\n\n记住，如果你使用忍者工具，务必在风声呼啸时使用它以隐藏任何声音，并始终将其取出。\n\n> *无论作为忍者携带多少工具，请记住，最重要的是，你应该始终把食物挂在腰上。*\n\
  \n> —白击百周（Yoshimori Hyakushu）#21\n\n好莱坞的描写通常显示忍者挥舞手里星或刀，但真正的忍者开发了广泛且多样的工具和武器，并被指示在选择合适的工具时要格外小心。三部忍者卷轴都花费了大量篇幅描述秘密工具，其中许多是那个时代的创新技术。仅《万应变化书》（Bansenshūkai）就包含了五卷关于工具的大型著作。它在其他指令中指出，最好的工具可以用于多种用途、安静且不笨重。《忍之记》（Shōninki）建议忍者限制携带的工具数量，因为任何设备如果看起来格格不入，就有引起怀疑的可能性。卷轴还建议忍者寻找并破坏目标的工具和武器；这些器器对于忍者的能力来说至关重要。\n\
  \n当然，忍者并不是从任何大型忍者用品商店获取工具的。相反，根据卷轴的指导，他们利用易于购买、发现或制作的物品制作有效的工具。这种方法有几个优点。这些日常物品可以在不引起过多怀疑的情况下携带，甚至可以作为忍者伪装的佐证道具。例如，丰臣秀吉和织田信长等几位统治者实行了刀狩——大量没收平民所有的剑和其他武器，以减少反叛者攻击统治军队的能力。在这种情况下，任何在公共场合佩剑或其他武装的非武士都可以预料其武器会被没收。在训练有过的忍者手中，日常工具变成了致命武器。尽管这些工具具有实用性，《万应变化书》断言，使用工具的基本原理不仅是挥舞它们，而是要有明智的理解。忍者深入且频繁地思考工具的用处，不断重新构想其用途。结果，忍者经常改进现有工具，发明新工具，并传授这些知识。\n\
  \n在本章中，我们将思考工具。我们将触及工具的双重属性——同一个工具具有行善或行恶的能力，这取决于其操作者。这种二元的 *in-yo*（或“阴阳”）概念是理解黑客接触数字工具的有用模型。例如，考虑一个旨在帮助用户的工具如何被用于恶意目的。\n\
  \n离地攻击（Living Off the Land）\n\n在网络安全中，*工具*是指任何辅助手动或自动操作任务的仪器。有物理工具，如 `BadUSBs`、`Wi-Fi`\
  \ 嗅探器和开锁，也有软件工具，如平台、漏洞、代码、脚本和可执行文件。整个计算机系统本身就是一个工具。工具可以有法的用途，但在黑客手中会变成武器。\n\n\n\n\
  \n\n正如忍者一样，网络攻击者高度依赖工具来实现其目标，他们不断针对现有的实地技术对其工具进行开发、定制、磨练和测试。复杂的威胁组织会雇用全职的、专用工具和能力开发人员来维护和改进他们的工具集。作为回应，富有进取的网络防御者致力于对这些自定义工具进行逆向工程，以便构建防御措施、实施实用的安全策略和检测签名、在沙箱环境中测试恶意工具的能力，并创建识别和阻止危险工具的应用程序白名单。在某些情况下，新防御措施的应用非常好，以至于攻击者无法向目标系统下载或安装他们的工具，因为基于主机的安全系统会立即隔离这些工具、阻止访问，并向安全人员警报它们的存在。\n\
  \n由于基于主机的安全系统可以检测并阻止专用工具和恶意软件，许多攻击者现在采用一种被称为“离地攻击”（living off the land）的渗透战术。通过这种方法，攻击者首先收集目标系统上已使用的软件和工具的情报。然后，他们仅使用这些应用程序来构建攻击，因为主机系统的防御机制不会认为这些应用程序是有害的。“离地攻击”可以使用受害者机器磁盘上的任何文件，包括任务计划程序、Web\
  \ 浏览器和 Windows 管理实例（WMI）命令行实用，以及脚本引擎如 `cmd`/`bat`、`JavaScript`、`Lua`、`Python` 和\
  \ `VBScript`。正如忍者利用目标环境中常见的物品（如农具，他们知道这些工具很容易获得并融入环境一样），黑客通过征用目标机器上已有的东西，可以将日常用户和管理员工具、应用程序和操作系统文件转化为其用途的工具。\n\
  \nWindows 机器上容易受到利用的常用工具之一是微软强大的 PowerShell 框架。即使微软也承认，威胁者经常针对 PowerShell 以渗透系统、执行未经授权的操作并以其他方式破坏组织的系统。反之，微软提供了安全和缓解能力，例如通过特权访问管理（PAM）强制执行最小权限管理（JEA），并结合即时（JIT）管理。遗憾的是，JEA/JIT\
  \ 将 PowerShell 的无处不在变成了人类 IT 管理员的访问控制噩梦。怎么做到的？我就不略过更多技术细节了。想象一个被叫来排除故障的技师，但他只被允许带一把螺丝刀，并且只能在下午\
  \ 1:00 到 2:00 之间使用该螺丝刀。\n\n使用访问控制措施来锁定工具仅在 IT 团队愿意严重限制其自身有效性时才有效。即便如此，当这些日常工具存在于目标系统中时，仍存在固有的危险——网络安全专业观察到威胁者可以轻松地将工具从本地锁定中释放。网络安全的一个事实是：只要这些复杂的工具存在，滥用它们的可能性就存在。\n\
  \n## 工具安全\n\n拥有工具的悖论在于，你需要它们来操作，攻击者也是如此。应对这一挑战的一种方法是减少工具数量（从数量、功能、访问和可用性方面）到最低。虽然这种策略会让你在自己的环境内操作变得有些困难，但在适当的安全控制下，它应该让潜在攻击者变得更加困难。这种方法的一个缺点是你削弱了远程管理环境能力的韧性和稳健性。因此，如果攻击者通过移除或破坏关键工具来攻破，你自己的保护措施可能会破坏你管理和修复系统的能力。对于工具安全，以下步骤是一个良好的开始：\n\
  \n1. **确定你的基线。** 对组织内所有系统进行基于角色的员工调查和软件清单审计。记录环境中每个工具（包括所有软件/应用程序、脚本、库、系统和角色）的用户列表、版本号和系统位置的完整列表。这包括操作系统和系统文件，如下：\n\
  \n    | `sc.exe` | `find.exe` | `sdelete.exe` | `runasuser.exe` |\n    | --- | ---\
  \ | --- | --- |\n    | `net.exe` | `curl.exe` | `psexec.exe` | `rdpclip.exe` |\n\
  \    | `powershell.exe` | `netstat.exe` | `wce.exe` | `vnc.exe` |\n    | `ipconfig.exe`\
  \ | `systeminfo.exe` | `winscanx.exe` | `teamviewer.exe` |\n    | `netsh.exe` |\
  \ `wget.exe` | `wscript.exe` | `nc.exe` |\n    | `tasklist.exe` | `gpresult.exe`\
  \ | `cscript.exe` | `ammyy.exe` |\n    | `rar.exe` | `whoami.exe` | `robocopy.exe`\
  \ | `csvde.exe` |\n    | `wmic.exe` | `query.exe` | `certutil.exe` | `lazagne.exe`\
  \ |\n\n2. **审查你的发现并评估你的需求。** 评估每个工具以确定哪些用户需要它，以及如何、何地和何时使用它。对每个工具进行风险评估，以确定攻击者获得访问权限后的潜在影响。\n\
  \n3. **实施限制。** 限制风险工具的可用性、访问和授权。记录任何异常情况并计划每季度重新审查这些异常。你可以在限制业务操作的同时增加安全性——例如，禁用\
  \ Microsoft Word 和 Excel 中的宏。你甚至可以设置一段时间后自动撤销或删除工具。建立已工具工具白名单，以便阻止任何未识别或未经授权的工具被传递到你的系统。\n\
  \n## 建议的安全控制和缓解措施\n\n在相关情况下，建议结合 NIST 800-53 标准提供相应的安全控制措施。每项措施都应考虑到工具的概念进行评估。\n\
  \n1. 通过禁用、删除和限制环境内不必要的软件和系统功能，评估你执行“最小功能原则”的技术能力。`CM-7: Least Functionality`\n\n\
  2. 定期对每个角色和系统使用的功能、工具和软件进行审查，以确定它们是否必要，是否可以移除或禁用。建立一个系统来注册、跟踪和管理这些工具。`CM-7: Least\
  \ Functionality | (1) Periodic Review | (3) Registration Compliance`\n\n3. 在记录用户或系统可以使用每一个工具后，限制用户将这些工具用于其角色之外的功能。`CM-7:\
  \ Least Functionality | (2) Prevent Program Execution`\n\n4. 对软件、应用程序和其他工具实施白名单或黑名单（或两者）。`CM-7:\
  \ Least Functionality | (4) Unauthorized Software/Blacklisting | (5) Authorized\
  \ Software/Whitelisting`\n\n5. 对硬件和软件工具实施物理和网络边界限制。例如，将敏感工具限制在隔离的管理网文件服务器或便携式锁定介质中，仅在需要时访问，并结合\
  \ JEA/JIT 访问控制使用。`MA-3: Maintenance Tools | (1) Inspect Tools | (3) Prevent Unauthorized\
  \ Removal | (4) Restricted Tool Use; SC-7: Boundary Protection | (13) Isolation\
  \ of Security Tools/Mechanisms/Support Components`\n\n\n\n\n\n6. 评估所有已安装软件，以确定已知安全的应用程序使用了哪些导入、API、函数调用和钩子（hooks）。考虑使用恶意代码保护措施来阻止任何使用这些实现或其他正常软件不使用的实现方式的工具。考虑您的选项，以限制、禁用和移除未用于业务操作的操作系统函数、模块、组件和库。[SA-15:\
  \ 开发过程、标准和工具 | (5) 攻击面；SI-3: 恶意代码保护 | (10) 恶意代码分析]\n\n## 总结\n\n在这一章中，你学习了工具——它们有多强大，以及为什么保持这些工具的安全至关重要。你学习了“就地取材”（living\
  \ off the land）以及让系统既兼具防御性又具功能的复杂性。你可能还开始思考工具与恶意软件之间的区别，以及如何编写一个工具来识别这两者之间的差异。“毒轴实验”的思维练习挑战了你如何智胜入侵你所控制之环境的敌人。\n\
  \n在接下来的章节中，我们将讨论忍者侦察员使用的不同技术——嗅觉、视觉和听觉——以及我们从中可以学习什么，特别是当我们在网络环境中应用不同类型的数字传感器时。\n\
  \n# 9 传感器\n\n无论昼夜，都应该派遣进行远距离观察的侦察员。\n\n> 即使忍者没有过人的身体能力，也要记住，最重要的是具备敏锐的观察力。\n\n>\
  \ > —百周弥守（Yoshimori Hyakushu）#11\n\n除了在门口设置守卫、在哨位部署士兵外，《万叶抄》（Bansenshūkai）建议通过在道路、路径和其他入口处秘密地部署侦察员来防御城堡。防御方指挥官应该在城堡周围错落有地部署侦察员。这些侦察员履行三种角色之一：\n\
  \n*   嗅觉侦察员（`kagi`）\n*   听觉侦察员（`monogiki`）\n*   外勤侦察员（`togiki`）\n\n嗅觉和听觉侦察员使用经过训练的狗和猎犬员，位于隐蔽的观察哨所内——他们看不到外面，敌人也无法看到内部。侦察员全神贯注地嗅或听入侵迹象。这些技术在晚上效果特别好，因为嗅觉和听觉侦察员不需要光线即可工作。\n\
  \n外勤侦察员试图通过在敌方边界进行搜查来捕渗透者；躲在敌方土地上监控朝向自己营地的移动；或使用触发线、噪音甚至物理接触来检测入侵者。《万叶抄》说，`togiki`\
  \ 侦察员本身必须是忍者，因为他们必须精通隐身和观察，对敌人将从哪个方向进攻有超常的理解，并能够成功检测并接触敌人忍者。\n\n除了人类（和动物）侦察员外，《万叶抄》建议使用主动和被动检测技术来识别敌人渗透者。在主动方面，忍者可能会将\
  \ `sarubi`（猴火，或“绳子上的火”）投入或横跨如护城河、战壕或城堡墙底等黑暗区域，以便从远处快速且动态地照亮该区域，这是固定灯笼无法做到的。在被动方面，忍者会建立检测系统，例如通过向宽而浅的壕沟填满细沙，然后将沙子耙成复杂的图案。如果敌人绕过了外部防御，他们就会留下脚印，提醒守卫城堡已被造访。沙子上的脚印可能还会告诉敏锐的忍者敌人从哪个方向来，以及他们是否原路返回——这些都是帮助消除即时威胁并加强未来防御的宝贵情报。\n\
  \n在这一章中，我们将查看网络中常用的不同类型安全传感器，对比现代部署方式与忍者历史上使用传感器的方法。我们将重点介绍传感器的放置以及传感器反制技术，从忍者的经验中学习增强自己的网络安全防御。我们还将根据古代感官侦察员提出传感器。\n\
  \n## 使用传感器识别和检测威胁\n\n在网络术语中，`sensor`（传感器）一词涵盖各种检测系统和仪器。最常见的是，传感器是分路、T 分线器、跨接或镜像端口上的监控设备，用于复制活动以便观察、记录和分析。在其中一种配置中，传感器在数据包通过线路时嗅探并捕获原始数据包（`PCAPs`），然后对其进行处理和分析，以向安全人员发出可疑事件警报。传感器也可以“Inline”（in\
  \ line），这意味着数据包通过一个可以延迟、阻塞或更改数据包信息的设备，从而有效阻止攻击而不仅仅是发出红旗。次级传感器（如 Wi-Fi 传感器）检测外部或其他未经授权的信号和连接，而物理安全传感器（如摄像头）则监控对敏感数据中心、服务器机架和交换机室的访问。从更广泛的来说，某些软件终端代理也充当传感器，因为它们收集主机系统上的事件、操作和活动，并报告给命令与控制（`C2`）系统以便必要时进行分析并发出警报。\n\
  \n组织通常为某些类型的流量专用传感器——例如，配置电子邮件网关安全设备以检测钓鱼尝试或垃圾邮件、入侵预防/检测系统以检测网络攻击、防火墙以检测未经授权的 IP\
  \ 和端口、代理以检测可疑网站以及数据泄露系统。基于传感器的网络安全设备通常安装在网络的主出口点，通常位于非军事化区（DMZ）。由于将传感器放置在网络尽可能上层的位置以最大化其看到的流量数量是标准做法，因此如果对手躲避了网关处的传感器或绕过主出口桥接到网络内部，他们就可以在网络内自由操作而不受安全传感器的检查。\n\
  \n尽管存在这种安全风险，但大多数组织不太可能大幅增加系统中传感器的数量，因为购买许多额外的传感器——加上许可、安装、更新、维护和监控所有传感器的额外工作——在财务上是不可行的。遗憾的是，许多组织简单地假设如果主出口传感器没有捕获威胁，那么更多的相同传感器也不会更有效。这是一个判断错误，使他们的系统面临风险。\n\
  \n## 更好的传感器\n\n\n\n\n\n传感器的一个主要问题是它们几乎总是需要人工进行监控，并根据其传递的信息采取行动。安全传感器的局限性和可用分析平台的限制加剧了这个问题。可以将现代安全传感器这样理解：建筑内散布着许多微麦克风和摄像头，但这些摄像头和麦克风被困在小吸子里——这些吸管限制了它们的捕捉视野。现在想象一下，你只能一次通过一根吸管观察，试图拼凑出一个正在发生的入侵。不仅如此，每根吸管还积累了数千小时的数据需要存储、处理和分析。这种令人沮丧的情况通常通过签名、算法或机器学习来缓解——这些工具可以帮助识别异常和恶意活动。然而，这些自动化系统并非完美。它们往往会产生误报，或者产生大量的合法警报，以至于感觉就像完全没有传感器一样。为了解决这些问题，我们可以借鉴忍者（shinobi）的方法：我们可以识别敌人可能采取的路径，并在这些路径上隐藏许多类型的传感器，以便对攻击进行预警。在考虑改进组织的传感器时，请参考以下指南：\n\
  \n1. **对网络进行建模并识别弱点。** 为你的环境创建网络地图和信息流模型——该模型应描述每个系统及其用途、系统如何连接、信息何时进入和离开你的网络、接收的信息类型、哪些传感器（如果有的话）检查信息，以及出口点。识别缺乏传感器的区域以及你认为已得到良好监控的地方。预测威胁者将尝试渗透你网络的位置。请记住，创建一个全面的地图可能需要几个月，并且需要整个企业的协助。你生成的地图可能并不完美，但即使是有缺陷的地图也比没有地图好。\n\
  \n2. **进行红队测试和渗透测试。** 委托红队尝试渗透你的网络。考虑在练习中使用“紫色小组”方法，即你的网络防御者（蓝队）在同一间房间内实时观察红队，并可以暂停练习进行提问。在攻击之前、期间和之后查询安全传感器，查看它们检测或报告了什么（如果有的话）。这些信息应该是极具启发性的。让你的蓝队考虑不同的传感器布局如何能更快、更准确地发现红队。讨论测试建议的架构防御变更、传感器调优和其他解决方案。\n\
  \n3. **检测并拦截加密流量。** 拦截所有你的传感器无法拦截和检查的加密流量。此外，采取适当措施消除机器使用未经授权加密的能力。让红队测试你检测加密流量攻击的能力。大多数传感器无法检查加密流量；因此，许多组织允许非对称加密，例如椭圆曲线迪菲-赫尔曼\
  \ (`ECDH`)，这无法通过根证书破解。允许未经过数据泄露防护（DLP）的完整加密流量离开你的组织，会产生安全漏洞，这类似于城堡守卫检查每个进入或离开大门的光脸者，但允许任何戴着面具的人不受挑战地通过。\n\
  \n4. **开发“嗅觉”和“听觉”传感器。** 探索创建可以秘密检测某些类型威胁活动的传感器的机会。例如，配置外部物理传感器来监控系统的 CPU 活动或功耗，并根据性能是否与已知命令或登录用户活动相关，来检测未经授权的访问或使用（例如加密货币矿矿）。\n\
  \n5. **实施被动传感器。** 建立被动传感器。建立被动传感器以便在被激活时在本地进行检测和告警。\n\n6. **安装传感器。** 禁止在非传感系统上开启混杂模式（promiscuous）传感器，以防止敏感信息泄露给攻击者。\n\
  \n## 推荐的安全控制与缓解措施\n\n在相关之处，建议根据 800-53 标准提出。每项都应根据传感器的概念进行评估。\n\n1. 实施嗅探器、全 PCAP\
  \ 和其他传感器以支持事件处理、维护和信息流强制。`AC-4`, `IR-4`, `MA-3`\n\n` `\n\n2. 为了保护物理访问并检测篡改，在布线间锁、监控数据中心和服务器访问的摄像头以及通信线的水传感器上安装传感器。`PE-4`,\
  \ `PE-6`, `PE-15`\n\n`\n\n3. 为员工（包括非 IT 员工）运行意识培训计划，以便他们作为人类传感器来检测威胁活动。为员工提供一种清晰、简单且易操作的方法报告可疑活动。`PM-16`\n\
  \n`\n\n4. 拦截加密通信并允许你的传感器对未加密的数据包进行深度检查。`AC-4`, `SC-4`, `SC-8`\n\n` `\n\n5. 实施可以分析数据包并采取预防措施（如阻塞或过滤）的传感器。`SC-5`,\
  \ `SC-7`\n\n` `\n\n6. 禁止在非传感系统上开启混杂模式传感器，以防止敏感信息泄露给获得未经授权的攻击者。`SC-42`\n\n` `\n\n\
  7. 与你的 ISP 合作，在网络边界之外放置信任互联网连接 (`TIC`) 传感器。`AC-17`\n\n` `\n\n8. 记录所有内部系统连接；其接口；它们处理、存储和通信的信息；以及系统之间的传感器布局。`CA-9`\n\
  \n`\n\n9. 进行渗透测试和红队演练以测试并验证你的传感器布局和能力。`CA-8`, `RA-6`\n\n##总结\n\n在本章中，我们讨论了古代日本用于探测敌人忍者的嗅觉、听觉和外部感官侦察。我们还查看了城堡守卫部署用于捕获入侵者的主动和被动传感器。然后我们讨论了今天使用的各种安全传感器——这些帮助防御者看到周围线路上发生了什么的传感器。我们涵盖了围绕传感器的若干逻辑问题，如传感器布局、误报和传感器管理。最后，我们讨论了如何应用古代忍者的技术来识别网络系统中的入侵者。\n\
  \n\n\n\n接下来，我们将讨论忍者使用的用来绕过城堡防御的不同类型的桥梁和梯子——这一概念在传感器方面具有重要意义。例如，想象你的城堡受护城河的保护，而你将所有传感器都放置在吊桥上。如果一个敌人忍者能够在不使用吊桥的情况下秘密地架设自己的桥梁，那么他们也有效地绕过了你的传感器——使它们失效。我们将探讨这种“桥接”概念在网络安全中是如何与之几乎完全相同的，以及解决这一问题有多么困难。\n\
  \n# 10 桥梁与梯子\n\n无论墙有多高、有多陡，没有任何墙是无法逾过的，特别是当你使用忍者梯子时。\n\n> 城堡门楼通常守卫最严，但屋顶是你挂钩钩梯子最方便的地方。\n\
  \n> — 《忍之书》（Bansenshūkai），“忍之二” ^(1)\n\n忍者可以使用*忍气*（ninki）渗透工具安静且无痕迹地移动在敌人的墙墙和门门上——这些工具在《忍之书》(Bansenshūkai)\
  \ ^(2) 和《军法辞书》（Gunpo Jiyoshu）^(3) 中均有描述。多功能的梯子和便携桥梁，如铁刺梯、云梯或工具运输线^(4) ^() 让忍者能够安全且隐蔽地穿越护城河、爬墙并向其他忍者传递工具。有时这些梯子是“正式的”，即忍者在任务之前提前制作的；有时是“临时的”，即在现场建造的^(5)。这些都是价值工具，因为它们提供了进入通常因过度自信无法进入而无人看守位置的机会。\n\
  \n卷轴还解释了如何通过操控敌人自身的安全措施来渗透敌营。《忍之记》（Shōninki）指示忍者想象鸟或鱼如何进入城堡^(6)——换句话说，要意识到处于高处或低处所提供的独特优势。例如，爬墙提供了快速跨越其他墙壁和屋顶的机会，比通过大门能更好地进入城堡内部。游泳过护城河可以提供通往常用水道的水下访问权限——那是一个通往城堡的通道。《忍之书》甚至建议刻意尝试跨越守卫室大门，因为逻辑上那里会有最多的守卫驻守，而防守者可能会假设攻击者会避免尝试从这一点渗透。^(7)\n\
  \n在本章中，我们将讨论桥接网络域与跨越城堡墙围边界的相似之处。就像城堡墙一样，网络的设计带有屏障和分段，假设人们必须通过受控的网关。桥接允许威胁绕过这些网关，从而规避在网关出口处建立的安全控制。某些看似是直接的措施（例如指示守卫拦截任何在护城河上架桥的人），当城堡建筑师出于水管理原因选择连接护城河的同心环时，可能会变得徒劳无功。一旦连接，三个护城河不再是敌人必须通过的三个离散边界，而是一条可以直接游进城堡心脏的水桥。学习如何像忍者一样思考，并将障碍视为潜在的梯子钩点，可以帮助你重新评估自己的网络并预先切断桥接机会。\n\
  \n## 网络边界桥接\n\n对于网络安全专业人员来说，*桥接*是指同时运行在物理层和数据链路层——即 OSI 模型的第 1 层和第 2 层的虚拟或物理网络设备，用于连接两个网络段以形成单一聚合网络。该术语也指任何允许信息跨越“间隙”的设备、工具或方法，例如隔离网络或分段边界。桥接通常绕过安全控制和保护，允许数据从网络外泄或将未经授权或恶意数据传输到网络。这些潜在的严重后果迫网络安全专业人员开发检测和缓解方法来防止桥接，包括：\n\
  \n*   禁用无线以太网卡上的网络桥接\n*   禁用具有两个或多个活动网络接口的系统\n*   实施网络访问控制 (`NACs`) 和监控以检测网络上的新设备\n\
  *   安装传感器检测未经授权的 Wi-Fi 访问点\n*   使用 `VLAN` 或路由器技术限制某些网络\n*   在链路层发现协议 (`LLDP`) 中使用认证\n\
  \n尽管安全控制在不断演进，未经授权的桥接仍然发生——某些先进的渗透技术虽然仅在学术或实验室环境中得到证明，但显示出巨大的破坏潜力。最近的示例包括控制系统 LED\
  \ 指向另一个房间或建筑的光学接收器闪烁比特位、使用 FM 频率信号与附近的手机通信（如 `AirHopper` 和 `GSMem` 漏洞）、控制并脉冲风扇通过声学方式发送比特位，以及人为使\
  \ CPU 过热和冷却以缓慢发送数据（如 `BitWhisper` 漏洞）。攻击者甚至可能通过电力线传输以太网技术 (`EOP`，不要与以太网供电 `POE`\
  \ 混淆）通过系统的电源线来桥接网络。在其他情况下，组织的 VoIP 电话的麦克风和扬声器可能被远程激活，允许攻击者传输声音数据或监听对话。\n\n当然，有些桥接并不那么尖端。敌人可以爬上办公大楼的屋顶，接入可见的网络线，并安装一个小型地球卫星站，为网络提供强大的桥接访问。手机经常被插入到系统\
  \ `USB` 端口充电，但充电中的手机还将将计算机连接到未经过防火墙、数据泄露防护 (`DLP`) 或安全工具检查的外部移动网络，完全绕过了组织的防御并促进了主机网络上的数据盗取或代码注入。当通过肉身网络（sneakernet）进行桥接时，用户将信息加载到便携介质并步行到另一台计算机或网络位置，手动绕过安全控制。还存在威胁可能使用隐藏的管理网络（通常在\
  \ `10.0.0.0/8` 上），它直接连接到路由器、防火墙和其他安全系统的控制台，利用这些作为跳点来桥接不同的网络 `VLAN` 和段。此外，分拆隧道（split\
  \ tunneling）构成了风险，因为信息可能会通过同时连接到两个网络的设备在不同网络之间泄漏。\n\n## 反击桥接\n\n防止设计连接到其他系统的之间发生桥接是一个难以解决的难题。虽然没有完美的解决方案，但可以减少桥接机会并将隔离努力集中在最重要的资产上。此外，抵消桥接技术的反应对措施可以分层实施，以提高这些防御的有效性。\n\
  \n\n\n\n\n1. **识别你的弱点。** 识别存储你组织敏感、关键或高价值数据的网络和信息系统。创建数据流图 (`DFD`) 来模拟信息在系统中是如何被存储和移动的。然后，识别可能发生隐蔽道外桥接攻击的区域。\n\
  \n2. **实施桥接防御措施。** 考虑实施 `TEMPEST` 控制，例如法拉第笼或屏蔽玻璃，以阻止通过发射或其他信号进行物理隔离桥接。为了阻止恶意桥接，确保在允许设备连接到你的网络或其他设备之前，你已对设备进行了识别和身份验证。开发适当的保护措施，以缓解威胁模型中识别出的潜在桥接威胁。\n\
  \n## 建议的安全控制与缓解措施\n\n在相关，建议结合了 `NIST 800-53` 标准中的适用安全控制。每项措施都应在桥接的概念下进行评估。\n\n1.\
  \ 实施边界保护和信息流控制，防止外部设备、系统和网络外泄数据或将恶意代码传输到你的网络中。[`AC-4: 信息流强制 | (21) 信息流的物理/逻辑隔离；AC-19:\
  \ 设备的访问控制；AC-20: 外部信息系统的使用 | (3) 非组织所有的系统/组件/设备；SC-7: 边界保护]`\n\n2. 强制无线访问保护控制，以阻止或检测在微波、`UHF/VHF`、`Bluetooth`、`802.11x`\
  \ 以及其他频率上跨越你网络的未经授权无线信号[`AC-18: 无线访问；SC-40: 无线链路保护]`\n\n3. 审计网络访问和互连，以识别外部网络或系统（例如远程网络打印机），这些系统可能会桥接你的网络以传输数据[`CA-3\
  \ 系统互连；CA-9 内部系统连接]`\n\n4. 建立强大的便携媒体策略以防止未经授权的桥接。在任何物品连接到你的环境之前，要求对外部介质和设备进行识别和身份验证[`IA-3:\
  \ 设备识别与身份验证；MP-1: 媒体保护策略和程序；MP-2: 媒体访问；MP-5: 媒体传输]`\n\n5. 测试系统是否存在 `TEMPEST` 泄露或其他道外信号。根据结果，决定在何处实施保护，以抑制信号被用作桥的能力[`PE-19:\
  \ 信息泄露；SC-37: 带外通道]`\n\n## 回顾\n\n在本章中，我们讨论了对抗性桥接的哲学，并讨论了网络段桥接和传统的最佳实践。我们查看了多重桥接技术——即以你以前可能没想的方式跨越差距的桥。本章的思维练习旨在引发对梯子和墙之间建立物理防护的思考；从理论上讲，这些可以为系统输入输出的创新奠基础。\n\
  \n在下一章中，我们将讨论锁以及忍者（shinobi）的开锁技巧，这种技术基于一种信念：任何人类设计的锁都可以被人类打开。我们还将窥见当忍者必须依赖他们自己不信任的锁时，他们是如何处理安全问题的。我们将讨论锁在网络安全中的应用，以及我们可以从忍者身上学到什么，以改进我们处理锁和开锁的方法。\n\
  \n# 11 锁\n\n没有你打不开的挂锁。然而，这完全取决于你的技巧；因此，你应该始终进行实际练习。\n\n> 开启工具的设计是为了帮助你轻松进入敌人的家门。因此，在所有的艺术中，这是当你最接近敌人时所执行的一种。\n\
  \n> —`《忍界之书》(Bansenshūkai)，Ninki III`\n\n在古代日本，锁比今天的锁定装置要简单，因为当时的制造能力无法生产现代锁具使用的复杂的销钉、弹子和其他组件。然而，这些古老的锁设计精巧，典范地利用“插销、锁闩以及重力和张力的自然力量”来保护人们的财物免受入侵者和盗贼的侵害。\n\
  \n忍者在执行任务期间经常遇到复杂的锁——并想出打开所有锁的方法。卷轴表明，对于一个拥有精良工具、充足训练和智慧以及乐观心态的忍者来说，没有任何锁、屏障或其他机制是安全的。三卷卷书中很大一部分都记录了如何制作和使用各种开锁针、拨片和其他用于打开锁、门和门的探测性工具（`图\
  \ 11-1`）。\n\n![图 11-1: 用于打开锁、门和门的各种工具。从左到右是：探测铁、可伸缩钥匙、开锁拨片、用于引导式挂锁的开锁针以及开门工具（出自《忍界之书》和《忍之传》）。](img/f11001.png)\n\
  \n图 11-1: 用于打开锁、门和门的各种工具。从左到右是：探测铁、可伸缩钥匙、开锁拨片、用于引导式挂锁的开锁针以及开门工具（（`忍界之书`和`忍之传`）。\n\
  \n从环形锁闩到绳子，从锁杆到钩子和销，从复杂的钥匙锁到原始的自制技术 . . . 无论锁的设计，忍者都有方法和工具来绕过它。由于锁不能被完全信任，忍者自己开发了将安全掌握在自己手中的技术。有些方法简单粗暴：当他们在不信任的锁保护的住宿处睡觉时，忍者有时会将一根绳子从门或窗户连接到发髻上，确保他们在睡眠时如果门闩或锁被打开，他们就会醒来。\n\
  \n在今天，就像忍者时代一样，人们使用锁来保护财产——而攻击者仍然使用开锁针来击败它们。锁，一如既往起着多重作用：它起到威慑作用。它是所有者对财产安全的可见保证。如果锁通过钥匙被破解，它为钥匙持有者建立了一个问责系统。它还作为屏障和报警器，因为盗贼在试图绕过它时会花费时间并发出噪音。在本章中，我们将讨论黑客如何像忍者一样仍然在开锁和绕过安全防护。此外，我们将讨论为什么物理锁对数字系统如此重要，并详细说明必要的伴随预防措施。我们还将探索锁和开锁针的一些技术进步，发现忍者还能在安全方面教我们什么。\n\
  \n### 物理安全\n\n正如开锁通常是进入黑客世界的入门爱好一样，破解锁是进入网络安全的常见切入点。发现应该是安全的物体寻找缺陷或对其进行物理访问——即在你击败了它的防御后，手中锁打开时带来的视觉、触觉和听觉反馈——这是一种强烈的感受。它可以激发人们对安全领域的兴趣，并对初学的能力建立信心。\n\
  \n\n\n\n网络安全行业使用锁定设备来限制对建筑、数据中心、交换机房和独立办公室的物理访问。在更细粒度的层面上，机柜锁限制对服务器的访问，机箱锁限制对系统物理组件的访问，设备端口锁防止未经授权使用\
  \ USB 或控制台接口，防盗锁防止系统离开其所在位置，而电源锁则防止设备被完全开启。对系统的物理访问进行锁定是组织网络安全策略中至关重要的一环。如果系统容易受到物理篡改，那么一旦对手获得物理访问权限，由于许多数字安全控制措施都将面临失效的风险。应当假设，如果对手获取了机器的物理访问权限，他们也将获得系统的管理员级权限并获取其数据。\n\
  \n尽管非法开锁工具和技术泛滥，但组织倾向于年年如一日地使用相同的锁，这使得他们自己变得极易受到攻击。大多数信息系统和建筑访问锁使用弱弱的弹子销芯，例如 `Yale`\
  \ 柱形锁——该锁于 1860 年获得专利，由于成本低且易于批量生产，目前是世界上最常见的锁——以及筒形锁（或“圆锁”），这是最常见的自行车锁。犯罪分子制造、销售并使用可以轻易破解这些市售锁的开锁工具。例如，可乐水罐垫片可以撬开锁，笔帽可以模拟筒形钥匙，而\
  \ 3D 打印的塑料钥匙可以根据原始照片轻松伪造。对于没有技巧的犯罪分子，自动电子开锁器只需扣动扳机即可在几秒钟内完成每个弹子锁所有销钉的开锁工作。\n\n大规模的开锁反制措施寥寥无几，且某些措施更关注责任而非安全。例如，某些保险政策规定，如果犯罪过程中由于劣质锁（如美国最常见的锁）被破解或绕过，保险将不赔入入室和盗窃。某些政府为锁具制造商发布合规性标准，并规定禁止向公民销售不合格的锁。在网络安全领域，某些政府通过密码锁或其他高保证锁，结合缓解锁具安全缺陷的辅助安全控制措施来保护其机密系统和数据。\n\
  \n然而，仍有太多的门和系统在使用弱的锁钥匙防御——这种防御即使是稍显老练的威胁者也能轻易破解。必须改进信息系统的锁和屏障，以缓解撬锁、开锁、盗窃、复制和强制开启等常见攻击。\n\
  \n## 改进锁具\n\n防止所有的开锁是不可能的。然而，你可以采取许多主动措施来提高锁具的韧性。改进锁具还将通过缓解对系统的未经授权物理访问攻击，提升你的网络安全态势。\n\
  \n*   **升级你的锁具。** 评估更先进的锁定系统（例如欧式点锁），确定哪些锁符合你的业务需求和预算。寻求利益相关者和物理安全团队的批准，然后将你所有的锁升级为对攻击韧性更强的型号。\n\
  *   **跳出锁的思考。** 为你的组织考虑非传统的锁定解决方案，例如多级锁。当第一阶段解锁机制控制对第二阶段锁的访问时，入侵者就无法快速方便地同时或连续打开两把锁。\n\
  \n    例如，为了关闭一个入口，可以使用两个相互互补的独立锁定系统。第一阶段可以是一个数字 4 位 PIN 锁，它可以临时解结第二阶段锁（一个柱形锁）中的销钉。当第二阶段锁的销钉处于冻结状态时，它们无法被破解，但可以插入钥匙准备接受第一阶段锁的激活。一旦销钉被临时解冻，物理钥匙就可以旋转，入口即可解锁。然而，这个机会窗口只开启三秒钟。之后，数字锁会重置并重新冻结销钉。要获得成功，入侵者必须首先获知\
  \ PIN 码，然后能够在三秒内撬开门锁，这在人类能力上可能是不可能的。\n*   **增加加固。** 考虑加固锁具正在保护的物体。你可能保护铰链免受篡改，或安装撞击板、门/框加固件、门手手罩或地板防护。\n\
  *   **游说锁具行业。** 敦促锁具行业进行创新，并将新设计整合到保护信息系统的产品中。在产生足够的消费者压力来升级其过时产品之前，制造商将继续销售同样熟悉的、易损的设备。\n\
  \n## 推荐的安全控制措施与缓解措施\n\n在相关的情况下，建议结合 `NIST 800-53` 标准中的适用安全控制措施提出。每项建议都应考虑到锁具的概念进行评估。\n\
  \n1.  在锁定的、受控的容器中保护纸质文件、磁带、硬盘、闪存器、磁盘和其他物理介质。[MP-4: 媒体存储; MP-5: 媒体传输]\n2.  使用安全钥匙或其他锁定设备来执行对系统和环境的物理访问控制和授权。[PE-3:\
  \ 物理访问控制 | (1) 信息系统访问 | (2) 设施/信息系统边界 | (4) 可锁外壳 | (5) 防篡保护; PE-4: 传输介质访问控制; PE-5:\
  \ 输出设备访问控制]\n\n## 总结\n\n在本章中，我们讨论了锁及其用途。我们注意到，无论在哪个时代，对手都会开发绕过锁的工具和技术。我们提到了用于保护系统访问的常用锁技术，以及为什么升级它们非常重要。特别需要记住的是，如果对手获取了你系统的物理访问权限，你应该假设他们可以破解它——因此，用锁从物理上防止对这些系统的访问至关重要。\n\
  \n在下一章中，我们将讨论忍者在目标防守非常严密时使用的一种高级策略——一种诱骗对手交出钥匙的策略。\n\n\n\n\n对于那些特别不愿离开其坚固防御的目标，卷轴指示忍者寻求其指挥官的帮助以进行高级欺骗。例如，指挥官可以将部队移动到脆弱位置，诱使敌人攻击，从而消耗敌人的防御能力，使忍者能够渗透。或者，当敌人筋疲力竭地返回时，忍者将将其击败。指挥官甚至可能策划更复杂的行动，比如发起一场全面的、长期的城堡围攻战。随后，忍者可能会派遣一名伪装成盟军将军信使的士兵，说服敌人离开城堡，加入反攻并破包围。为了完成这一骗局，忍者指挥官会派遣一小部队伪装成盟军援军，既引诱目标离开营地，又在大门打开时允许忍者渗透进去。\n\
  \n根据卷轴记载，忍者在利用 `suigetsu no jutsu` 成功渗透目标后，他们必须记住以下几点：\n\n*   保持冷静。不要表现出不知所措。\n\
  *   模仿城堡内的人。\n*   优先收集口号、密码、挑战响应和徽章。\n*   尽快向盟友发出信号。\n\n在本章中，我们将探索网络威胁活动者如何部署这种古代技术，并将其与常用的社会工程学策略进行比较。我们将介绍一种抽象思考网络通信信号如何视为进入和/或离开边界的方法——尽管计算机系统在物理上并没有移动——并详细介绍应对“水中月影”技术和普通社会工程学攻击的概念。最后，我们将尝试一个思维演练场景，模拟古代日本将领在遭受“水中月影”攻击时可能面临的困境。\n\
  \n## 社会工程学\n\n忍者的“水中月影”攻击与今天的 `social engineering` 攻击具有惊人的相似性，后者利用人类目标的决策过程和认知偏差来操纵他们暴露敏感信息或执行自毁行为。在网络安全领域，大多数社会工程学策略由在敌方领土内部运行的对手使用，以利用目标的信任。典型的社会工程学攻击示例包括：\n\
  \n1. **钓鱼 (Phishing)**：攻击者发送电子邮件，说服收件者打开危险文档或访问恶意链接，导致恶意软件感染、勒索软件执行、数据泄露或其他攻击。\n\
  2. **预设 (Pretexting)**：攻击者通过虚构的情景进行电话或邮件交流，旨在说服目标暴露敏感信息或执行恶意操作。\n3. **诱饵 (Baiting)**：攻击者策略性地在物理位置放置恶意便携介质（如\
  \ `USB drive`），诱导目标捡起并连接到内部系统，从而为系统攻破创造机会。\n\n社会工程学是一个极具挑战性的安全问题，因为它利用人性的方式是技术控制手段往往无法完全防御的。随着目标和受害者对社会工程学威胁的认识提高，许多组织开始依靠针对性的技术控制、安全协议和用户教育来保护其价值资产。员工接受如何妥善处理和维护敏感信息系统的培训，而安全团队则记录程序以验证未知或未经请求访问客的身份，并要求非雇员在公司区域接受物理护送。红队进行内部钓鱼测试和尾随（tailgating）测试等练习，以评估员工对社会工程学策略的意识并培养其抵制能力。管理员实施技术控制以阻止恶意文档和链接，使用数据泄露防护\
  \ (`DLP`) 软件，防止未经授权的系统更改，将未注册系统和外部介质列入黑名单，并使用呼叫者显示。\n\n虽然这些都是良好且必要的安全措施，但人们的工作方式已经发生了变化。从外部系统传递到内部主机。因此，虽然内部主机在物理上没有离开组织的防御范围，但在虚拟上这样做（例如，通过访问恶意网站）就可能允许威胁活动者在响应通信中进行渗透。本质上，这就是数字尾随。\n\
  \n除了直接攻破传统的安全架构外，威胁活动者还可以使用许多类似于“水中月影”的技术渗透防御森严的组织。考虑以下场景：\n\n*   攻击者在安全设施内触发火警报警，导致员工大量撤离。当消防员清理大楼时，攻击者混入员工人群，偷取或记录胸牌、钥匙、令牌、面部信息、指纹等。为了方便员工返回工作，设施临时关闭了读卡器、转闸机或其他物理访问控制，或者安全人员被大量的人流得于应付，没有注意到尾随行为。\n\
  *   攻击者利用餐车将员工从安全设施中引诱。然后他们利用自己非发起者的身份对目标进行等价交换（quid quo）的社会工程学攻击，最终建立关系并说服目标执行他们在传统社会工程学场景中不会执行的操作。\n\
  *   攻击者入侵了商务会议室对面咖啡馆的 `Wi-Fi` 网络，以窃目标组织员工的凭据。通过带着设备进入咖啡馆，这些员工离开了组织的防御范围，并在不意的情况下暴露在由攻击者控制环境中。\n\
  *   攻击者对目标人员、系统和数据进行大规模的破坏性、拒绝服务或破坏攻击，促使他们移动安全性较低的灾难恢复地，那里比组织的永久总部更容易渗透。\n\n注意，虽然这些攻击不一定能实现攻击者的最终目标，但它们可以提供手段或信息，与其他漏洞结合来实现恶意目标。\n\
  \n## 针对社会工程学的防御\n\n大多数组织都会进行社会工程学意识培训，并定期对内部员工进行钓鱼测试。虽然这种策略提高了对此类攻击的韧性，但始终有很大比例的人员会失败。遗憾的是，大多数组织让员工暴露在社会工程学的风险之中。我们需要做出努力，为员工提供防御此类欺骗所需的工具。\n\
  \n\n\n\n\n1. **建立防护措施。** 为员工实施标准的信任框架，以降低因社会工程学攻击导致的风险。识别你环境中的高价值目标，并建立安全协议、策略和程序，对这些系统上的敏感信息进行适当的控制和处理（随着时间的推移，将其扩展到所有系统）。在组织内部开展培训、意识和测试演练，提高员工对社会工程学的意识水平，并结合迭代的威胁建模来审查和改进相关的安全控制。\n\
  \n2. **实施“慢思考”。** 与你的安全团队分发并讨论丹尼尔·卡尼曼的书籍《思考，快与慢》（*Thinking, Fast and Slow*）。该书描述了两种思维模式：更快速、更冲动的“系统\
  \ 1”和更缓慢、更有逻辑性的“系统 2”。开发出能够迫使你的员工慢下来并用系统 2 模式进行思考的解决方案，从而避免社会工程工程师最常利用的认知偏差和捷径。可能的示例包括：\n\
  \n* 配置您的电话切换系统，要求接收外部电话的员工在系统连接之前必须拨入对方号码的偶数数字。\n\n* 配置您的邮件客户端，让员工在打开外部邮件附件之前，必须反向输入“发件人”邮箱地址。\n\
  \n* 要求访问非白名单 URL 的用户在浏览器执行 DNS 查询之前，正确输入域名的字符数。\n\n所有这些措施都会减慢业务运行速度，但它们也有助于缓解社会工程学攻击。\n\
  \n## 推荐的安全控制与缓解措施\n\n在相关的情况下，建议结合 NIST 800-53 标准中的适用安全控制措施。每项措施都应结合“水中之月”（moon on\
  \ the water）的概念进行评估。\n\n1. 由于安全系统和控制只能保护既定边界内的信息，请实施防护措施，防止信息和系统越过这些边界并落入社会工程工程师手中。[AC-3:\
  \ 访问强制 | (9) 受控发布；PE-3: 物理访问控制 | (2) 设施/信息系统边界；SC-7: 边界保护]\n\n2. 控制你的信息流，即使数据超出了正常的保护边界，也不允许其传输到未经授权的信息系统或系统之间。[AC-4:\
  \ 信息流强制；PL-8: 信息安全架构；SC-8: 传输机密性和完整性]\n\n3. 对于所有非本地（即通过网络）系统维护，建立审批协议，要求使用强身份验证器和记录的政策，并实施监控。[MA-4:\
  \ 非本地维护]\n\n4. 为受控区域外的数据建立保护，并将数据处理活动限制为授权人员。[MP-5: 介质运输 | (1) 受控区域外的保护]\n\n## 总结\n\
  \n在本章中，我们描述了名为“水中之月”的高级忍者忍术。我们查看了“水中之月”技术可以现代化改造以针对企业的各种场景。我们探索了社会工程学带来的挑战以及它可能采取各种形式。我们回顾了旨在处理社会工程学的现有安全实践，并审视了新的防御概念。我们还从忍者卷轴中提取了一个思维练习，以证明我们的信任模型是多么脆弱，以及防范社会工程学是多么困难。\n\
  \n在下一章中，我们将讨论内部威胁——这是安全领域最迷人的的话题之一。忍者卷轴提供了详细的指示，说明如何利用某些社会工程学技术识别可能被招募为内鬼的人——而且它们提供了一种与现代最佳实践背道而驰的防御内部威胁的方法。\n\
  \n# 13 虫剂 (Worm Agent)\n\n将敌人变成一个*minomushi*，或虫剂（又称内部威胁）。\n\n> *minomushi* 是指一个为敌人服务但被培养成为我方工作的忍者。因此，该特工就像敌人肚子里的虫子，从内部向外噬它的腹部。\n\
  \n> —《忍界之书》（Bansenshūkai），Yo-nin I\n\n《忍界之书》书中不乏极具感染力的意象，它描述了一种被称为“胃中之虫之术”（或“虫剂”）的开放伪装渗透技术，这种技术要求忍者（shinobi）招募敌人内部人员来代表他们执行任务。这种招募需要极高的情商。忍者必须选择合适的目标；设计机会来接触目标；并谨慎地分析目标对其实雇主、个人价值和秘密野心的看法。该卷轴警告说，候选人的选拔必须极其小心，因为试图图招募错误的人成为虫剂——或*minomushi*——可能会严重损害忍者的任务。为了最大限度地增加成功招募的几率，忍者开发了八种可能的虫剂原型：\n\
  \n* 那些因先前的错误受到当前雇主不公正或过度惩罚，并因此怀有深层积恨的人。\n\n* 那些尽管出生于豪门或拥有卓越能力，但职位与其身份不符、被错过了晋升机会，并对未被充分利用感到愤恨的人。\n\
  \n* 习惯性的过度成就者，他们持续为雇主提供良好的成果，但得到的仅是象征性的头衔、小额奖金或不足的加薪——或者什么都没有。由于他们的贡献被淡化，他们认为如果被另一家雇主雇佣，可能会有更丰硕的职业生涯。他们进一步认为自己的组织做了愚蠢的决定，因为领导层看重奉迎者和政客，而不是拥有真实成就的忠实员工。\n\
  \n* 与领导层不合的聪明且有华的工人。由于这些人容易引起反感并被视为干扰，他们的雇主给他们低级职位，为建设性解雇铺平道路，并通常让他们感到不受欢迎。\n\n\
  * 各领域的专家，其雇主利用他们的处境（如忠诚誓言或家庭义务）将他们留在较低的职位。\n\n* 其工作职能与其个人身份、家庭需求或信念直接对立的人，导致他们对所做的工作感到后悔。\n\
  \n* 贪婪且狡诈、缺乏忠诚或道德准则的人。\n\n* 因过去的过错而名誉狼藉的“黑羊”员工，对自己地位下降感到沮丧。\n\n在忍者挑选了潜在的*minomushi*后，他们制定了一个计划来与候选人接触并建立关系。《忍界之书》指示忍者要表现得富有，并用金钱讨好目标；通过友好的交谈辨别其喜好、信仰和幽默感；并通过轻松的闲谈秘密地探听他们的内心想法。如果目标的性格符合虫剂原型，忍者就会试图利用这些*minomushi*特征，通过承诺财富、认可和帮助实现其秘密野心——或者更直接地提供酒精和性色——来换背叛其雇主。\n\
  \n在利用新转化的*minomushi*之前，忍者被建议获得一份背叛誓言，收集抵押资产以保证虫剂的忠诚，并建立信号和其他行动安全措施（OPSEC）。\n\n\n\
  \n\n在本章中，我们将回顾内部威胁。我们将对比分析“不满的员工”与“被招募的内部威胁者”。我们还将涉及组织用于应对内部威胁的检测和威慑方法，以及一种全新的、定制的方法——灵感来自忍者（shinobi）卷轴——旨在主动防止高风险员工变成内部威胁者。最后，一项思考练习将要求你想象哪些前任和或现任员工可能成为内部威胁者，并检查你曾与他们如何互动。\n\
  \n## 内部威胁\n\n`insider threat`（内部威胁）是指员工、用户或其他内部资源，其行为可能会损害组织——无论是有意还是无意。由于他们并非刻意执行恶意行动，一个打开钓鱼邮件并导致工作站感染恶意软件的不幸员工是一个无意识的内部威胁者。另一方面，一个不满的员工故意向组织内部释放病毒，无论是出于个人原因还是代表对手，都是蓄意的内部威胁者。由于内部威胁者是由于拥有了身份验证、权限以及对信息系统和数据访问权的合法授权用户，它们是网络安全领域最难缓解的问题之一。\n\
  \n许多组织依赖技术控制和威胁猎人来早期检测内部威胁。技术检测技术——如行为启发式分析——可以帮助识别潜在的内部威胁。警觉的网络防御者和猎人可能会调查那些采取反常或不当行为的用户，包括将所有文件下载到外部便携式介质、搜索与其工作无关的敏感或专有数据、在周末或节假日登录执行非优先工作、访问明确标记为受限访问的蜜罐系统和文件，或下载并使用类黑客工具执行其职能范围之外的行为。\n\
  \n但事实是如此，即使对于成熟的组织来说，技术控制也只是稳固防御策略的一部分。通过核实参考资料；进行背景检查（包括犯罪和财务历史）；以及筛选药物使用情况，雇主可以验证员工是否明显易于受到不当影响。人力资源职能在识别潜在内部威胁者方面起着关键作用。一些人力资源部门进行年度员工调查以识别潜在问题，另一些则会主动终止高风险员工的聘，或根据问题的发现建议撤销某些访问权限。遗憾的是，组织采取极小预防措施的情况非常常见。大多数人信任自己的员工，其他人忽视这个问题，而还有一些则接受内部威胁的风险以确保业务运营顺畅运行。\n\
  \n更积极地对抗内部威胁的实体（例如国防行业和情报界的组织）实施了更先进的检测和预防措施，如测谎仪、例行许可检查、反情报计划、部门化以及严厉的法律处罚——更不用说尖端的技术控制。然而，即使是这些措施也无法保证所有内部威胁者的恶意行为（特别是受到复杂对手协助的威胁）都能被检测和防止。这些措施还带来了独特的实施和运营挑战。\n\
  \n## 应对内部威胁的新方法\n\n那些将精力放在审查员工并试图在现场将其抓获的组织，在处理威胁方面等待得太晚了。更主动的方法是营造一种不会产生内部威胁滋生条件的工作环境。以下某些建议是专门为修复特定的内部威胁者典型类型而定制的。\n\
  \n1. **开发检测和缓解技术。** 检查你的组织用于识别和缓解内部威胁的产品和技术控制。开展员工培训和意识会议，审查安全事件报告，并进行红队演习（如钓鱼测试）以识别重复的无意识内部威胁者。然后通过在他们的账户、系统、权限和访问上实施额外的安全控制，对这些个人进行培训、告诫和缓解。例如，你的安全团队可以通过严格的控制和策略限制员工执行内部威胁行为的能力和机会。一些示例包括：\n\
  \    * 强制执行系统上无法启用或执行宏的策略。\n    * 配置所有邮件以明文形式送达并禁用超链接。\n    * 默认隔离所有外部邮件附件。\n  \
  \  * 禁用网页浏览，或仅通过不连接到组织内域网的隔离互联网系统提供浏览服务。\n    * 在某些系统上禁用 USB 端口和外部介质驱动器。\n\n监控蓄意的内部威胁者既需要先进的检测技术，也需要能够欺骗和保密的技术。根据适当的组织威胁建模和风险评估选择这些工具。\n\
  \n2. **实施基于人力资源的政策。** 在实施并测试了上述技术控制和检测技术后，处理人员控制。确保人力资源部门维护现任员工、前员工和候选人的记录，其中包含内部威胁者特征的指标。在候选人筛选、绩效评估和离职面试中提出针对性问题以获取这些诊断信息。\n\
  \n3. **特别注意产生内部威胁者的情况。** 你们的人力资源团队应考虑以下全公司策略，按八种内部威胁者典型类型排列：\n    * 审查员工纪律协议以防止对员工进行不公正或过度的处罚（真实的或感知）。要求员工和申请者披露其家人是否曾在组织工作过。鼓励人力资源评估员工是否认为对他们的纪律处分不公正或过度，然后共同寻找缓解员工敌意的解决方案。\n\
  \    * 定期发布员工调查以评估士气并识别低级员工未被利用的人。与员工和管理层进行透明访谈，以确定：员工是否已准备好晋升、成就未获得认可，或需要培养特定技能；公司是否有职位将其晋升或预算为其加薪；或者某些员工认为自己比同事更好或更有价值——以及是否有必要进行现实检查。与管理层合作，考虑如何缓解员工的痛苦以及如何纠正对组织并非优人制的感知。\n\
  \    * 作为绩效评估的一部分，征求同事反馈以识别低级员工认为最有价值的经理，以及哪些员工认为自己没有得到适当认可。通过奖励和/或让公司决策透明来解决这些不满。\n\
  \    * 鼓励领导层亲自指导聪明但社交笨拙的员工，委婉地让他们知道他人的感知，目标是帮助这些员工感到更被社交接受、更不孤立。\n    * 审查并消除阻碍顶级人才的公司政策。这些可能包括竞业协议、对员工知识产权的不公正占用，以及不足的绩效奖金或留才激励。虽然这些政策旨在保护公司，但它们产生适得其反。\n\
  \n\n\n\n\n*   对现有员工和应聘者进行开源背景调查，以确定他们是否曾对贵组织的使命表达过强烈的情绪，或是否存在相关的利益冲突。如果是这样，将这些员工重新分配到与其个人价值观与工作内容更契合的职位，或者方便他们离开组织。\n\
  *   开发性格画像技术，以寻找员工和应聘者可能受贿影响的指标。考虑降低这些员工的系统访问权限和权限级别，从而降低他们对敌方的利用价值。\n*   与处于 `minomushi`（蝉虫）状态的高风险风险员工密切合作。为他们提供额外的资源、时间和动力，帮助他们克服可能存在的积怨，抓住成长机会并培养自尊心。尽量减少或停止那些强化负面记忆或继续因过去的错误而惩罚员工的组织行为。\n\
  \n## 推荐的安全控制与缓解措施\n\n在相关情况下，建议结合 `NIST 800-53` 标准中的适用安全控制措施提出。每项措施都应该考虑到“被招募的内部威胁”的概念进行评估。（更多信息，请参阅\
  \ `PM-12: 内部威胁计划`。）\n\n1.  让 `SOC` 与人力资源部门私下合作，关联有关表现 `minomushi` 特征的潜在内部威胁人员的信息。`SOC`\
  \ 应更密切地监控、审计和限制这些高风险个人。它还可以与人力资源部门合作建立内部威胁蜜罐——例如，在网络共享中放置标记为“机密切勿打开”的文件，以识别执行与内部威胁一致之行为的员工。`[AC-2:\
  \ 账户管理 | (13) 禁用高风险人员账户; AU-6: 审计审查、分析和报告 | (9) 与非技术来源信息的关联; SC-26: 蜜罐]`\n\n2. \
  \ 使用你自己的账户对你已知不会损害组织的文件和系统执行内部威胁行动（不具备红队能力）。这些行动可能包括修改或删除数据、插入虚假数据或窃取数据。记录你的账户可以访问哪些系统和数据，然后使用如\
  \ `admin` 或 `root` 等特权账户进行恶意特权操作。例如，你可以创建一个使用不存在的员工命名的新 `admin` 用户。询问你的 `SOC` 是否能发现你在特定日期范围内窃取、删除或修改了哪些数据，以测试你的\
  \ `SOC` 是否能妥善审计你执行的特权操作。`[AC-6: 最小权限原则 | (9) 特权函数使用的审计; CA-2: 安全评估 | (2) 特殊评估]`\n\
  \n3.  培训员工识别 `minomushi` 特征和内部威胁行为。让员工能够方便且匿名地报告有关疑似内部威胁的潜在 `minomushi` 状态，类似于他们举报钓鱼诈骗的方式。作为常规安全培训的一部分，开展内部威胁意识演练。`[AT-2:\
  \ 安全意识 | (2) 内部威胁]`\n\n## 总结\n\n在本章中，我们回顾了在目标组织内部招募弱势人员执行恶意行动的“忍者忍术”。我们详细介绍了八种内部威胁候选者原型，并讨论了组织目前使用的各种内部威胁检测和保护计划。我们描述了一种基于“忍者卷轴”信息的新防御方法——一种对不满的员工采取同理心的方法。本章的思维练习挑战参与者不仅要评估潜在的内部人员，还要评估他们对同事的行为；鼓励他们思考如何采取更合作的方式应对潜在的内部威胁。\n\
  \n在下一章中，我们将讨论长期内部威胁：在加入贵组织之前就被敌对招募的员工。由于长期内部威胁者会刻意隐藏对组织的任何怨恨或恶意，检测他们变得更加困难。\n\n\
  # 14 月上之魂\n\n根据日本传说，如果你知道如何寻找守护月球树木的幽灵，他可以邀请你上月吃他树的叶子，让你变得隐形。\n\n> 在正常时期，在需求产生之前，你应该寻找一个人作为卧底特工成为背叛者，一个你安插的敌人，从而使其成为忍者并将其安置在敌方的城堡、营地或附庸中，就像传说中的幽灵“桂浦男”（Katsuraotoko）驻守在月球一样。\n\
  \n> ——《万华抄》（Bansenshūkai），忍之卷 I \n\n作为其一系列复杂渗透技术的一部分，《万华抄》描述了一种被称为“月上之魂”的长期公开伪装战术。该战术旨在通过安插的秘密特工获取特权信息和访问权限。首先，一名忍者招募一个值得信赖、聪明、明智、勇敢且忠诚的人。或者，如果招募者最初就不忠诚，卷轴建议在任务期间将其家属作为人质以使其变得“忠诚”。然后，忍者将特工安插在一个省份或城堡中。在那里，他们将花费多年努力地与目标合作，建立自己的声誉、人脉、知识和访问权限。理想情况下，该间谍将与敌人领导层密切工作。间谍必须始终与忍者保持合理、可靠且显眼的联系方式。如果这个敌方堡垒演成为攻击目标，忍者负责人可以号召卧底特工获取高置信度的情报、内部协助、破坏以及针对敌人的进攻行动，包括暗杀。虽然“月上之魂”计策需要多年才能获得成报，但对于耐心且老练的忍者来说，这种回报值得投入时间。\n\
  \n在本章中，我们将“月上之魂”视为一种内部威胁。通过类比，可以将硬件植入看作是试图用望远镜寻找月球上的幽灵。出于此原因，我们将涵盖硬件植入、供应链安全和隐藏硬件后门的主题。我们还将比较“月上之魂”卧伏与理想硬件植入的特征。我们将涉及供应链风险管理和威胁狩寻策略，但需要注意，底层问题使得这种威胁几乎无法完全防御。\n\
  \n### 植入\n\n历史上，企业间谍活动和国家级活动活动依赖于策略性部署的代理来实现特定的长期任务。今天，技术提供了更廉的方法来获得传统上只能通过人类人员实现的结果。例如，假设你的组织多年前在网络上购买并安装了一个外国制造的路由器，它一直运行良好。但在你的安全团队不知情的情况下，敌对方刚刚激活了在工厂安装的隐藏植入物，提供了对最敏感系统和数据的直接、未经过滤的后门访问。\n\
  \n网络安全行业将此类攻击分类为供应链攻击。在这里，“供应链”指的是与组织的业务活动或系统相关的产品和服务；示例包括硬件、软件和云托管。在之前的示例中，路由器执行了在网络上移动数字信息以进行电子商务的必要业务活动。\n\
  \n\n\n\n虽然启发式方法或威胁猎可以检测到异常路由器行为，但并没有万无一失的方法可以防御隐蔽植入。某些组织可能会使用质量保证代表来监控制造过程，但他们无法确保每个系统都构建正确。然而，几项网络安全最佳实践可以缓解基于路由器的供应链攻击。一个积极的组织可以：\n\
  \n1. 对所有路由器制造商进行威胁分析，然后利用结果获取一个不太可能带有带有受损硬件或软件的路由器。\n2. 采用信赖、安全的运输服务，并为路由器获取监管链（chain\
  \ of custody），以防止恶意拦截。\n3. 在交付时对路由器进行取证检查，以验证其未被篡改或偏离预期的规格。\n4. 使用防篡改保护和检测技术加固路由器，以识别并缓解未经授权的更改。\n\
  \n请注意，这些步骤不仅限于路由器。组织可以对其供应链中的每个服务、设备、系统、组件和软件应用程序采取这些预防措施。\n\n隐蔽植入对于现代国家来说就像对于古代忍者（shinobi）一样价值，因为发现和防御它们面临着困难且长期的组织挑战。网络安全专业人员不断测试新概念来应对这些挑战。例如，一个组织可以在假设所有系统已受损的前提下，限制对所有系统的信任和访问。然而，它们对业务运营的巨大影响使得许多此类概念在实践中是不可行的。\n\
  \n## 针对植入的防护\n\n试图通过称重或 X 光检查每个系统以发现异常的组织，可能会发现自己迷失在管理供应链的途中。更重要的是，能够实施供应链攻击的高级威胁者可能会在系统的默认设计中嵌入恶意功能。通过这种方式，只有*他们*知道启用植入的秘密，而且它存在于每个系统中。虽然组织的检查过程可能发现威胁，但它可能并不理解自己正在看什么。这就是该问题的范围——它就像是试图在月球上寻找幽灵。尽管如此，保护组织免受这些植入影响的指南如下：\n\
  \n1. **识别供应链攻击条件。** 在你的供应链中列出具有“月球幽灵”（ghost on the moon）潜力的组件列表。包括以下元素：\n    * 被视为高信任的\n\
  \    * 可以通信\n    * 可以提供对敏感信息或系统的侧向或直接访问\n    * 不易于检查\n    * 不会定期更换或更新\n\n具体来说，关注与外部系统通信或控制可以执行信号或功能系统的软件和硬件（例如路由器上的固件、`NICs`\
  \ 和 `VPN concentrators`）。植入也可以以硬件设备的形式存在，例如放置在 `PCI` 接口插槽内部的极薄金属接口，作为针对 `NIC` 的中间人攻击，更改该接口网络通信的数据流、完整性、机密性和可用性。\n\
  \n想象一下你的杀毒软件、虚拟机管理器、漏洞扫描器或取证分析师无法在你的环境中检查或测试的内容。月球幽灵供应链候选者的关键特征是它们能够在目标环境中持久存在，这可能需要针对那些不会经常损坏或磨损、不会随时间容易被廉价版本升级、重要到无法关闭或处置、以及难以修改和更新的组件（例如固件、`BIOS`、`UEFI`\
  \ 和 `MINIX`）。这类供应链植入对自主性和隐性的要求意味着植入需要避免检查、扫描和其他类型的完整性测试，同时能够某些形式的处理器指令或执行。\n\n2.\
  \ **实施供应链保护。** 根据需要实施供应链保护措施和保护。月球幽灵供应链攻击是最难检测、预防或缓解的攻击之一。因此，许多组织只是接受或忽略这种风险。从第一性原理开始——关于安全的根本真理以及你业务的目的——是有用的，然后利用这些真理作为准则来评估你的组织面临的威胁。审阅《Saltzer\
  \ 和 Schroeder 1975 设计原则当代视角》^(3) 或其他核心安全著作，以确定针对该威胁的适当缓解。将问题抽象为更高层次的概念可能也有帮助，使它们变得熟悉且易懂，然后尝试解决它们。考虑以下城堡理论思维练习。\n\
  \n## 建议的安全控制和缓解措施\n\n在相关之处，建议结合 `NIST 800-53` 标准中的适用安全控制提出。每项措施都应在考虑月球幽灵概念的情况下进行评估。\n\
  \n1. 考虑通过隔离、分段和层化多样化的供应链组件为供应链引入异构性。供应链多样性极大减少了受损组件的潜在影响。[`SC-29: Heterogeneity`]\n\
  2. 分析组织的采购流程，识别可以减少供应链攻击风险的领域。使用诸如盲买、信赖运输、限制从某些公司或国家购买、修改采购合同语言以及随机化或最小化获取时间等技术。[`SA-12:\
  \ Supply Chain Protection | (1) Acquisition Strategies/Tools/Methods`]\n3. 考虑尽可能推迟非安全更新或获取新的未经测试的软件、硬件和服务。实施高级反措施，以限制复杂攻击者针对你组织的机会。[`SA-12:\
  \ Supply Chain Protection | (5) Limitation of Harm`]\n4. 通过不同的供应商购买或评估同一硬件、软件、组件或服务的多个实例，以识别更改或非正品元素。[`SA-12:\
  \ Supply Chain Protection | (10) Validate as Genuine and Not Altered; SA-19: Component\
  \ Authenticity; SI-7: Software, Firmware, and Information Integrity | (12) Integrity\
  \ Verification`]\n5. 安装独立的、带外监控机制和健全性测试，以验证怀疑遭受供应链攻击的高信任组件没有在执行隐蔽通信或更改数据流。[`SI-4:\
  \ Information System Monitoring | (11) Analyze Communications Traffic Anomalies\
  \ | (17) Integrated Situational Awareness | (18) Analyze Traffic/Covert Exfiltration`]\n\
  \n\n\n\n在下一章中，我们将讨论如果你确实抓住了忍者或他们的据点，他们将采取备选计划。忍者通常会在秘密任务之前很早就布置虚假证据，以便在被捕时能够推卸责任。如果成功，这种策略会误导受害者使其相信盟友背叛了他们，这种欺骗本身就会损害目标。\n\
  \n# 15 萤火之术\n\n萤火之术应在你对敌人了尽了解后执行，这样你才能根据目标的心态构建你的欺骗术。\n\n> 在执行监视或秘密忍者活动之前，你应该为你未来的声誉留下一字条。\n\
  \n> —吉森百周集 #54\n\n《万页书》（Bansenshūkai）描述了一种忍者的伪装渗透技术，被称为“萤火术”（`hotarubi no jutsu`）。^(1)\
  \ 我认为认为，这种技术的命名是基于萤火虫在移动后，其光芒在你的夜间视觉中停留的时间，导致你抓到的是虚空。《忍之记》（Shōninki）将相同的技术描述为“伪装之术”（`koto\
  \ wo magirakasu no narai`）。^(2) 通过这种技术，忍者会布置物理证据，诱导敌人采取某些特定行动，包括误判忍者的所属方、对忍者的动机做出错误假设，以及对尝试的攻击做出轻率反应，从而使其暴露在进一步的进攻之下。\n\
  \n带有定罪细节或关于敌人的误导性证据的伪造信是最常见的 `萤火术` 技术，并有多种变体。卷轴描述了忍者将信件缝在衣领里，以便在被捕或被搜身时能被迅速发现。^(3)\
  \ 或者，忍者可能会招募一个自愿但能力平庸的人当“忍者”，给他们一封详细说明忍者真实计划完全相反的信件，并派遣他们进入敌方环境执行任务，因为他们知道这个“注定死的代理”定会被抓获。重要的是，招募者本人并不知道计划的这部分。在搜查招募者时，守卫会发现那封伪造信，信中会将一个高价值目标——例如敌方最有能力的指挥官——卷入一场叛国阴谋。那个“忍者”可能会在拷刑下崩溃，并证实信息的真实性，从而进一步陷害目标。^(4)\
  \ 这都是为了误导敌人攻击或处置他们自己的盟友。\n\n在一种更复杂的变体中，在任务之前，忍者会仔细布置支持信件中虚假故事的证据，并将伪造信放置在具有犯罪意义的地方，例如敌方指挥官信赖的顾问的宿舍。伪造信随后变成了一项保护措施。如果忍者被捕，他们将忍受拷刑直到确定敌人的目标，然后揭露他们关于信件的秘密。敌人随后会发现这封信和相关的证据。在建立信誉后，忍者将承诺成为双面间或分享关于其雇主的秘密，以换取生命。^(5)这种技术让敌人对忍者的动机感到困惑。\n\
  \n在本章中，我们将回顾与威胁归因于特定敌人相关的挑战。我们将涵盖使用可观测证据、基于行为的分析和反制措施进行归因调查。我们还将讨论意识到这些方法并因此增加风险的复杂对手的问题。\n\
  \n### 归因\n\n在网络安全背景下，归因是指对可用于识别网络空间活动者的可观测证据进行评估。证据有许多形式。威胁活动者的行为、工具、技术、程序、能力、动机和意图等信息都提供了宝贵的上下文，并驱动对安全事件的响应。\n\
  \n例如，假设你的家宅报警器响了，表明窗户被破了。你的反应将根据归因水平的不同产生巨大差异：消防员进入你的家与强盗闯入的反应完全不同。当然，归因并不总是容易获得的。小偷可以通过戴手套和面具对证据进行某种控制。他们甚至可以在犯罪期间或之后布置、破坏或避免制造犯罪证据，从而阻碍法医调查人员的工作。一个老明的罪犯甚至可以使用伪造的指纹；偷取的头发、血液或衣物样本；真实的\
  \ 3D 打印面具；或从无辜者身上获得的武器来陷害另一个罪犯。如果被陷害的人没有不在证明，或者犯罪目标与其动机一致，那么当局就有理由怀疑或逮捕这个无辜者。\n\n\
  [/content]网络安全专业人员面临这类归因问题，甚至更多。由于网络环境固有的匿名性，归因特别为困难。即使在执行了将攻击或事件追踪到源计算机和物理地址的艰难任务后，网络安全专业人员发现验证人类攻击者的身份极其困难。在受感染机器上追踪威胁活动者来源的尝试通常指向隧道、`VPN`、加密和没有任何意义日志或证据的租赁基础设施。复杂的威胁活动者甚至入侵并远程连接到外国机器，将其作为攻击其他系统的平台。即使在检测到对手后，在某些情况下不立即阻止他们或移除访问权限可能是明智的；相反，监控他们一段时间以确定他们的目标和识别特征可能更有益。^(6)\n\
  \n在某些情况下，威胁小组会故意留下工具或其他观测结果以推动归因叙事。据报道，美国、俄罗斯和朝鲜曾修改或复制其网络工具中的代码段、字符串、基础设施和制品以导致误归因。^(7)\n\
  \n\n\n请注意，使欺骗成为可能的相同机制也提供了强大的识别手段。内存转储、磁盘镜像、注册表、缓存、网络捕获、日志、网络流、文件分析、字符串、元数据等有助于识别网络威胁攻击者。各种情报学科，例如信号情报（`SIGINT`）、网络情报（`CYBINT`）和开源情报（`OSINT`）也有助于归因，而人类情报（`HUMINT`）能力从特定来源收集数据，经过处理和分析后，有助于指示谁可能实施了网络攻击。这些能力通常被保密，因为公开其存在会让目标了解如何避免、否认或欺骗这些系统，从而削弱生成有用情报和威胁归因的能力。\n\
  \n## 归因方法\n\n组织想要了解破坏其系统和网络的威胁攻击者的身份和来源是合理的。许多人想要采取行动（如黑客回）来发现这些威胁攻击者是谁，这是可以理解的。然而，威胁攻击者像忍者（shinobi）一样，总会找到通过否认和欺骗来进行隐蔽恶意活动的方法，使归因变得不确定。此外，从历史中汲取教训，只有当日本在和平统治下统一且忍者不再存在时，对忍者的归因需求才停止。世界在可预见的未来可能经历统一，因此国家级网络攻击可能会继续。在世界和平实现之前，以下归因方法可以帮助你识别对于正在进行的网络冲突你可以做些什么：\n\
  \n1. **摒弃你的认知偏见。** 反思你自己的认知偏见和缺陷逻辑。每个人的思维中都有漏洞，但我们可以意识到这些漏洞并努力纠正它们。构建你自己的案例研究。回顾之前被证明是错误的判断，识别出所犯的错误，并考虑如何提高你的分析能力。这项重要工作可以通过小步进行（逻辑谜题、字字游戏和脑力体操是提高认知功能的极佳方法）或大跨越。你可以学习讨论已知认知偏见和逻辑谬误的文章书籍，并学习结构化分析技术来克服自身的偏见。\n\
  \n2. **建立归因能力。** 检查可以使用哪些数据源、系统、知识和控制措施来影响组织的归因。你是否正在运行开放且未受保护的 Wi-Fi，允许未注册、未认证且未识别的威胁攻击者匿名连接到你的网络并发动攻击？你是否管理的路由器允许伪造\
  \ IP，或者它们是否使用了反向路径转发（`RFP`）保护技术来防止来自网络内部的匿名攻击？你是否正确发布了发送者策略框架，以防止威胁攻击者伪造电子邮件地址并冒充你组织的身份？\n\
  \n   虽然其中许多配置更改不产生直接成本，但实施此类广泛更改的时间和劳动力（以及机会成本）可能会让管理层犹豫。然而，请考虑之前投资在良好的摄像头和灯光上的决定是否帮助店主正确识别破坏者。建立健全的日志记录、文档和证据收集实践可以提高归因能力，强化技术问责制，并为终端用户提供对网络威胁的更好可见性。\n\
  \n3. **……或者忘记归因。** 与组织的利益相关者合作，确定减轻风险所需的归因努力范围。对于能够逮捕威胁攻击者或发起反击攻击的组织来说，归因是必要的。然而，大多数组织不能或不应尝试捕捉或攻击威胁攻击者、了解他们的身份或绘制他们的能力地图。事实上，对特定攻击者进行归因并不总是。对威胁的意识就足够了。\n\
  \n   例如，假设有两个威胁攻击者针对你组织的知识产权。一个想在黑市出售这些信息，另一个想通过这些信息来帮助他们的国家。无论威胁如何，防御者最终必须限制机会。\n\
  \n## 推荐的安全控制和缓解\n\n在相关之处，建议结合 `NIST 800-53` 提供。每一项都应在考虑归因的情况下进行评估。\n\n1. 将账户映射到身份。`SA-12:\
  \ Supply Chain Protection`\n2. 开发一个定义归因评估的计划。`IR-8: Incident Response`\n3. 建立收集和共享信息的威胁意识计划。`PM-16:\
  \ Threat Awareness Program; SC-26: HoneyPots`\n4. 应用安全控制。进行威胁建模。`SA-8: Security\
  \ and Privacy Engineering`\n\n## 总结\n\n在本章中，我们回顾了“萤火虫之术”——忍者使用的误归因技术。网络威胁小组在复杂性上不断演进，如果他们还没有这样做，很可能会将这种技术整合到他们的操作安全安全中。我们注意到，有几个威胁小组认为已经在使用误归因技术，并讨论了归因的方法以及归因的未来是暗淡的。\n\
  \n在下一章中，我们将讨论忍者在被防御者审问时保持“合理否认”的战术。该章还将讨论在捕捉忍者时使用的高级忍者审讯技术和工具。\n\n# 16 现场捕获\n\n\
  运用良好的判断来确定目标实际上是分心，还是他们正在使用计策诱捕忍者并捕获他们。\n\n> 如果你在夜间巡逻时发现可疑个人，你应该通过动用所有资源将其活捉。\n\n\
  >YoshYoshimori Hyakushu #74\n\n\n\n\n\n这些卷轴承认，活捉敌方忍者绝非易事。`Bansenshūkai` 中较直接的技巧之一包括在火绳枪中装入浸过辣椒粉的棉球——这是一种古代的催泪瓦或胡椒喷雾。在近距离射击时，这种射物会使目标的眼睛和鼻子产生剧烈的不适感，使其更容易被捕获。卷轴还描述了更隐晦的战术，例如\
  \ `fushi-kamari` 伏击和陷阱。例如，`Bansenshūkai` `Gunyo-hiki` 中描述的虎落阱（`mogari` 或 `koraku`）最初设计用于捕捕老虎（正如其名所示），但后来被修改用于捕捕忍者。在陷阱中，屏障会将入侵者引导通过一个充满隐藏陷阱的迷宫。盟友知道可靠的路径，但深夜独自潜入的忍者并不知道，这让他们很可能掉入陷阱。其他陷阱方法使用了\
  \ `tsuiritei`，即“假悬空墙段”，这些外壳看起来像真墙，但用楔子和假柱建造。当忍者试图攀爬这些假墙时，墙就会坍塌，令忍者措手不及并很可能受伤，从而允许他们被轻易捕获。\n\
  \n`Bansenshūkai` 还建议了防止被捕的防御措施，并提出了检测和规避 `fushi-kamari` 伏击的方法。忍者被建议侦察森林、田野、山谷、战沟和其他环境中是否有鸟类、其他动物甚至草木的反常行为，这些都可能预示着陷阱。假人和异常气味也会暴露出潜在伏击的端倪。在敌方领地，忍者可以部署多种规避战术，包括：\n\
  \n1.  **鹌鹑藏 (`uzura-gakure`)**：忍者会在地上蜷成一团，集中精力保持盲目、无知和无反应，这样敌人就不可能发现他们。即使被守卫用长矛或剑戳刺，他们也不会做出反应。\n\
  2.  **狸狗撤退 (`tanuki-noki`)**：在徒脚逃跑时，忍者会决定被更快的追捕者“抓住”。当他们之间的距离缩小时，忍者毫无预警地倒在地上，并将剑指向追捕者的腰部，在追捕者反应过来之前将其刺穿。\n\
  3.  **百发炮撤退 (`hyakurai-ju`)**：忍者会在目标附近放置烟花，要么设置延时引信，要么安排盟友点燃它们。这种声音会分散敌人追捕者的注意力。\n\
  4.  **狐藏 (`kitsune-gakure`)**：忍者通过垂直移动来逃生。忍者与其试图通过从 A 点到 B 点移动离开敌人领地，不如爬上高树或躲在壕沟中，改变追逐的维度。这种战术通常让敌人困惑，因为他们不太可能向上或向下寻找目标。\n\
  \n其他逃生方法包括模仿——模仿狗或其他动物来欺骗追捕者——以及虚假对话——使用误导敌人的语言让忍者逃跑。例如，知道自己正被跟踪的忍者可能会假装没听见追捕者的声音，并对想象中的盟友低语，好让警觉的守卫听到。如果忍者说：“我们悄悄移动到主的卧室，以便在他睡觉时杀掉他”，守卫可能会派兵前往主的卧室，从而让忍者从另一个方向逃脱。\n\
  \n当然，忍者避免被捕的最佳方法是不留留任何证据，以防调查人员从一开始就怀疑曾有入侵。卷轴强调了无痕执行任务的重要性，以便让目标没有理由怀疑现场有忍者存在。卷轴中充斥着关于秘密行动的指导；其文字在某些地方生动传神。`Yoshimori\
  \ Hyakushu` #53 写道：“如果你在下雪时以忍者身份潜入，首先必须小心的是你的脚步。”\n\n不幸的是，对于许多组织来说，活捉威胁并不总是首要考虑。当某些组织检测到系统存在威胁时，他们的做法与《忍术》中建议的相反。\n\
  \n## 现场分析\n\n在网络安全中，计算机取证镜像提供了必要的威胁情报。取证镜像通常在安全事件或违反规定的行为后制作，成像方式保持了数据的完整性。来自取证镜像的证据可以帮助安全专业人员了解威胁是什么以及如何发生的，帮助他们开发签名、保护措施和主动拦截措施。例如，确定攻击者针对某个关键系统上的特定知识产权，这告诉防御者保护该系统的数据。如果取证确定攻击成功且敏感数据已泄露，组织可以利用这些知识决定其战略性业务响应。如果威胁失败，组织可以为可能的后续攻击做准备。取证指标可能提供关于谁负责该威胁的信息，进一步决定响应方案。\n\
  \n收集设备数据进行分析涉及 `live capture`（也称为 `live analysis` 或 `live acquisition`）和 `imaging`（也称为\
  \ `forensic imaging` 或 `mirroring`）。组织使用蜜罐和其他欺骗虚拟环境进行现场捕获甚至与攻击者交互。此类系统通常配置用于诱捕黑客或让恶意软件访问，这样当威胁渗透系统时，隐藏的日志记录和监控控制就能捕获威胁的行为和方式，以及其他观测结果。\n\
  \n\n\n\n\n取证通常不会在实时捕获中进行。相反，取证分析师查看的是静态、惰性或死亡的数据，这些数据可能丢失了某些信息或威胁的独特细节。这在无文件恶意软件（存在于内存中）或特定的恶意配置或伪迹中（例如路由表缓存中的项）中很常见。不经常进行实时分析由于多种原因，包括：\n\
  \n*   对特殊技术的要求\n*   必须绕过要求断开连接、拔掉电源、隔离或阻塞受损系统的组织策略\n*   缺乏能够在物理现场地进行实时分析的胜任取证资源\n\
  *   调查期间员工无法访问关键系统的权限\n\n也许最重要的一点是，如果对实时分析处理不当，威胁可能会发现系统上的取证镜像软件，并决定隐藏、删除自己、执行反取证对抗措施，或对系统实施破坏性攻击。\n\
  \n为了绕过取证捕获技术，威胁会分多个阶段部署。在初始阶段（侦察阶段），威胁会寻找捕获技术的存在，只有在确认其可以在环境中安全运行后，才会加载恶意软件和工具。对于威胁攻击者来说，此类预防措施是必要的。如果发生了成功的捕获和取证分析，威胁的工具和技术就可以与其他组织和防御者共享，让他们从攻击中学习、针对其修复补丁或开发对抗措施。执法部门甚至可以使用取证捕获策略来追踪或为威胁攻击者提供证据。\n\
  \n最近，复杂的攻击者已横向移动到计算机和网络区域，而标准的取证镜像、捕获和分析工具无法或不能检查这些区域。这些攻击者的创新包括：安装硬盘固件以创建隐藏的加密文件系统；将恶意软件嵌入\
  \ BIOS 存储器中；利用本地微芯片存储在正常工作内存之外运行；以及更改路由器、交换机、智能打印机等网络设备上的低级模块和代码，这些设备传统上并不进行检查，甚至不适合取证镜像。某些威胁通过渗透原始制造商来模拟核心操作系统或受信任的安全组件，而制造商本身是受信任的，不被纳入取证分析。其他威胁通过删除取证证据来隐藏，移动到不经常重置系统的内存（例如域控制器），然后等待目标系统的取证审查结束，再返回预定目标。\n\
  \n## 面临实时威胁\n\n组织经常发现，当唯一接受过使用取证镜像工具培训的人员不在办公室时，他们正面临着活跃的安全事件。隔离的机器可能需要几天时间才能运给该人员进行检查，而那时攻击已不再是当前威胁的实时体现。这种无法以威胁相同的速度或更快的速度操作，使防御者沦为“取证清洁工”的角色——即在威胁攻击者已经实现目标后收集证据并清理感染的人员。主动建立能力、陷阱和伏击来应对威胁，对于实时捕获威胁并对其进行彻底审问是必要的。\n\
  \n1. **建立取证能力。** 承诺并投资建立一个拥有设备、经验、认证和授权以执行计算机取证的专门团队。创建带有写写保护器、安全硬盘和其他专用软件和设备的取证工具包。确保所有用于捕获和分析的系统都安装了适当的取证代理，以便团队立即识别、定位、隔离并执行收集。确保所有员工都理解如何帮助取证团队识别和定位受影响的系统并保存证据。如果他们上次进行取证调查已超过一个月，请与取证团队一起进行复习课程或演练。\n\
  2. **实施伏击。** 在适当的情况下，授权您的团队伏击威胁攻击者、团体和攻击活动。支持创建对威胁、金融服务和商业公司敌意的网络领域的目标。\n3. **设置虎阱。**\
  \ 考虑在可能的目标（如域控制器）中设置虎阱。部署这些陷阱，使得错误操作会导致系统冻结、锁定或隔离攻击。\n\n## 建议的安全控制和缓解措施\n\n在相关的情况下，建议结合\
  \ `NIST800-53` 标准中的适用安全控制措施提出。每项措施都应考虑到实时捕获的概念进行评估。\n\n1. 如果您没有对外部系统和组件进行取证调查的权限或能力，请限制这些组件在组织内部的使用。\n\
  2. 使用无法轻易访问的外部传感器和 SIEM，实施自动化机制以全量收集实时数据、PCAPs、`syslog` 以及取证分析所需的其他数据。\n3. 如果您决定实施非持久化作为对抗威胁的措施（例如通过定期重新镜像或重建所有系统以销毁未经授权的访问），请考虑在重新镜像或拆除之前进行取证捕获，以保留威胁证据。\n\
  4. 在组织内部实施、记录并强制基准系统配置，以便取证分析师可以更容易判断哪些信息可能被威胁更改。\n\n\n\n\n\n5. 为你的取证人员提供培训和模拟演练，以便在发生安全事件时能够做出有效响应。[IR-2:\
  \ 事件响应培训 | (1) 模拟事件]\n\n6. 建立一个取证分析团队，使其具备能力并获得授权进行实时取证收集和调查。[IR-10: 集成信息安全分析团队]\n\
  \n7. 使用保护措施验证取证系统、软件和硬件未被篡改。[SA-12: 供应链风险管理 | (10) 验证真实性且未被更改 | (14) 身份与可追溯性]\n\n\
  ## 总结\n\n在本章中，我们回顾了捕获和审问敌方忍者的忍者技巧，以及用于逃避捕捕的战术。我们谈到了收集更多取证证据如何让威胁者有更多机会向调查人员提供虚假数据点——以及为什么与活威胁进行互动可能更好。我们讨论了围绕取证能力以获得威胁可见性的最佳实践，以及用于对抗威胁的高级技术，如伏击和陷阱。\n\
  \n在下一章中，我们将讨论忍者兵器库中破坏性最强的攻击模式：火攻。\n\n# 17 火攻\n\n首先，放火很容易；其次，敌人很难扑灭火灾；第三，如果你的盟友同时来进攻城堡，由于防御工事的兵力不足，敌人将失去任何优势。\n\
  \n> 如果你打算对敌人的城堡或营地放火，你需要与你的盟友预先安排好点火时间。\n\n> —百景秀守 #83\n\n忍者在渗透进城堡或防御工事后，能做的最有影响力的事情之一就是放火——理想情况下是在火药库、木材库、食品或物资仓库，或桥梁内部或周围。布置良好的火灾可以迅速蔓延且不被发现；无法被轻易遏制或扑灭；并对城堡的完整性、物资和居民构成即时威胁。城堡守卫者被迫在扑灭火焰和抵抗由纵火者发出信号进攻的敌方军队之间做出选择。试图同时进行两场战斗会削弱目标执行任何一项战斗的能力。对付火的人很容易被进军的士兵击败，而那些忽视火灾而拿起武器的人，无论他们战斗得如何，最终都会输掉战斗。\n\
  \n卷轴中详细讨论了火攻，包括执行这些攻击的各种工具、战术和技能。在攻击之前，忍者会研究城堡的居民，以确定他们何时睡觉或关键位置何时无人值守。然后，他们与其他入侵者协作协调时间。忍者为这些攻击设计了许多定制工具，如火箭、隐蔽的持火圆筒、地雷、炸弹和投掷火炬。在视觉冲击力最强的武器中，有“热马”——马鞍上系着特殊火炬的马，让它们在防御工事内疯狂奔跑，混乱地蔓延火势，分散守卫和居民的注意力，并且极难以遏制。在混乱中，忍者与隐藏在城堡外的部队进行通信，一旦火势得到充分蔓延就发出攻击信号。\n\
  \n虽然中世纪军队有从远处发起火攻的能力——例如通过部署弓箭手射火箭——但《万叶忍书》建议指挥官派遣忍者来放火。与外部攻击相比，由忍者点燃的火不会被那么快地发现和扑灭。此外，忍者可以将火源设置在易燃物品或具有战略价值的物品附近，特工可以持续助火直到其壮大。\n\
  \n火攻的成功使其在封建日本无处不在，因此许多城堡开始实施针对性的防御措施。这些包括使用“土藏造”（dozo-zukuri，“抹灰防火”）或耐火漆对防御工事进行防火、使用粘土或岩石等耐火材料建筑、使用耐火屋瓦、建立消防队，并通过指定无关紧要的建筑（即为了防止火势蔓延到关键基础设施而牺牲的建筑）来创建防火带。守卫还收到警告，火灾可能是故意的注意力分散物，以便进行盗窃、攻击或其他行动（这一建议后来在《军法》中得到呼应）。\n\
  \n重要的是记住，忍者当时没有自动点火器，而防御者必须时刻警惕纵火者（就像现代组织维护防病毒软件和威胁检测）。忍者设计了巧妙的方法来隐蔽地投送火焰、将其武器化并利用易燃目标。在想象如何对目标投放并武器化网络攻击时，请记住忍者在火攻方面的智慧。\n\
  \n在本章中，我们将回顾在网络战背景下，忍者的火攻与现代战术有惊人的相似之处。火焰是蠕虫/自我传播网络攻击的极佳类比，因为它会蔓延到它触及的地方。我们将回顾破坏性网络攻击的案例，以及现代对手如何定时和协调这些攻击。我们将涉及组织用于预防、缓解、遏制和从网络攻击中恢复的各种防御。本章的总结可以应用于防火墙以及新的先进网络防御策略。\n\
  \n## 破坏性网络攻击\n\n在计算机能够连接和通信后不久，自我传播的病毒和蠕虫就诞生了。破坏性攻击随着时间的推移变得越来越频繁。现在，针对一个组织的破坏性攻击可以像火一样迅速蔓延，破坏互联网上的系统和数据。考虑到网络空间日益互联性以及内在的安全漏洞，一个连接到互联网但没有修复或其他保护措施的网络或机器基本上就是等待点燃的引柴。\n\
  \n在 21 世纪初，行业看到了首次勒索软件攻击。在这些攻击中，恶意软件会加密系统或网络数据（并删除备份），直到目标支付费用以解密。这些病毒会从系统传播到网络存储再到云端，将数据作为人质，或者在不支付的情况下通过加密将其摧毁。像忍者火攻一样，勒索软件经常被用于分散更大计划的注意力。例如，对手（据信是朝鲜）部署了\
  \ FEIB Hermes 勒索软件攻击，以分散网络防御者的注意力，与此同时他们执行了 SWIFT 金融攻击，从中获取了数百万美元。\n\n接下来是擦除器恶意软件攻击，攻击者在多个系统中植入“定时炸弹”病毒，在指定的有利时机删除所有系统数据并擦除备份。一个例子是沙姆（Shamoon）病毒，据认为是由伊朗威胁者针对沙特阿拉伯发起的，并在周末假期开始时启动，以破坏数据并禁用工业石油系统。\n\
  \n\n\n\n最近，攻击者针对工业控制系统部署了破坏性恶意软件，使攻击者能够读取传感器数据，或控制机械开关、电磁阀或其他物理执行器，这些执行器负责高高炉、电网、防空系统和核离心机的运行。此类攻击可能导致这些关键系统失效或发生故障，可能引发爆炸、其他物理破坏或同时发生的动能攻击。\n\
  \n防止攻击扩散的行政管理措施包括通过加固系统来减少攻击面，以便在系统受到攻击时，精细化的安全控制可以限制损害。韧性也很有用，即在其他位置和网络中对系统和数据进行多份备份，当网络攻击成功攻破主系统时为组织提供回退方案。（有时这些备份甚至是模拟系统或手动系统。）\n\
  \n更具技术性的防御解决方案包括在网络边缘部署`firewalls`。然而，如果攻击者绕过防火墙、渗透网络并开始自我传播的破坏性攻击，`firewall` 可能会让攻击扩散到网络之外；换句话说，`firewalls`\
  \ 通常用于阻止入站攻击，而不是出站攻击。检测和阻止破坏性攻击的其他措施包括防病毒软件、入侵防御系统 (`IPS`)、主机入侵检测系统 (`HIDS`) 和组策略对象\
  \ (`GPO`)。此类技术安全防护措施可以立即识别、响应并中和破坏性攻击，但它们通常是基于特征的，因此并不总是有效。\n\n一种较新的方法是网络保险，这是一种保护组织免受泄露带来的法律和财务影响的协议。虽然此类保险策略可以在网络攻击发生时减轻组织的责任，但它并不能防御攻击，就像火灾险无法防御火焰一样。\n\
  \n可以说，防御破坏性攻击的最佳选择包括严格的网络划分和隔离（物理隔离），以限制资源访问并防止自我传播病毒的扩散。虽然这是阻止网络攻击的一种极其有效的方法，但考虑到其对业务功能可能产生巨大影响，这并不总是可行。此外，它可能被间溜网络（sneakernets）和内部威胁绕过。\n\
  \n## 防御（网络）火灾攻击\n\n组织购买火灾险并寻求防火和遏制策略是常见的。然而，出于某种原因，某些组织在购买网络保险的同时并未实施针对网络攻击的安全措施。这可能是因为他们认为网络攻击的风险没有真实火灾那么大，毕竟财产甚至人类生命都面临着威胁。但随着物联网\
  \ (`IoT`) 的增长以及物理世界与网络空间日益融合，风险只会不断增加。采取以下防御措施可能对您的组织大有帮助：\n\n1. **进行网络火灾演习。** 模拟破坏性攻击，以测试备份、故障转移、响应、恢复能力以及及时撤离数据或系统的能力。这种练习与灾难恢复或备份测试的区别在于，它不是基于想象的威胁场景，而是让活跃的模拟威胁与网络交互（采取使用已知密钥加密数据等措施，以确保在练习过程中不会破坏任何数据）。\n\
  \n   Netflix 运行一种名为 `Chaos Monkey` 的持久练习，随机断开服务器连接、破坏配置并关闭服务。因此，该组织不断测试其能够顺畅且立即地负载均衡或故障转移到备份。一旦发生真实问题，安全团队已经设计并测试了可行的解决方案。Netflix\
  \ 已将 `Chaos Monkey` 免费向公众，任何组织都可以使用它来提高检测、抵抗、响应和从破坏性攻击中恢复的能力。\n\n2. **（网络）防火。**\
  \ 投入资源研究选定的破坏性攻击是如何传播的、它破坏了什么，以及是什么导致您的系统容易受到攻击。实施在硬盘缓冲区中进行操作的只读硬盘适配器，将数据锁定在“玻璃后面”，由于在只读状态下没有任何东西与之交互，因此数据无法被破坏。移除“易燃”软件：已知会传播破坏性攻击的应用程序、库、函数和其他系统组件。\n\
  \n   开发用于网络防火系统的专用软件、硬件和设备存在商业机会。这些应用程序可能通过使服务器或数据抵御破坏性攻击（或至少减缓或停止其进展），从而产生巨大的市场影响。\n\
  \n3. **设置网络火阱。** 创建自动的拒绝和欺骗性“网络火阱”具有巨大的市场机会，可以诱导对手或恶意程序进入无限循环，或触发触发机制导致攻击被隔离、熄灭或遏制。一种聪明的、公开报道的防御措施是在网络共享上设置具有无限递归的文件夹；当恶意软件尝试遍历文件夹以寻找更多数据时，它会陷入无尽的循环中。可以部署专用传感器来定位这种行为。它们可以告警事件响应小组或触发命令杀死启动无限目录的进程。\n\
  \n4. **创建动态网络防火线/切断路器。** 网络攻击之所以容易扩散，是因为系统通常处于开启状态并相互连接。虽然攻击可能无法直接攻破给定系统，但它可以扩散到其他互连的系统。网络空间中数以万计（甚至百万）机器人网络、蠕虫和其他自我传播的恶意软件反复证明了这一点。\n\
  \n   虽然大多数的网络划分和隔离是通过静态架构实现的，但 IT 组织可以实施额外的人工和基于软件的“断开线”。已知某些组织安装了主电磁开关，手动断开组织与互联网的连接。内部域网通信继续，但所有外部网络连接立即断开，形成物理隔离。这种需求可能看起来很极端或不太可能，但在发生全球“网络火灾”时，组织可以选择快速轻松地脱离威胁，而无需使用灭火斧切断电缆。\n\
  \n   这种实现的一种变体是每个系统、房间、楼层和建筑都有自己的主开关，允许安全人员做出快速决策以挫破坏性攻击。在听到领导层的攻击后，员工可以快速下载任何关键工作文档，然后拨动开关，将计算机与网络隔离开并防止攻击的扩散。\n\
  \n## 推荐的安全控制和缓解措施\n\n在相关之处，建议结合 NIST 800-53 标准中的适用安全控制措施。每项措施都应考虑到火灾攻击进行评估。\n\n\
  1. 监控组织内部破坏性行为的指标。通过将数据转发到分段的事件收集器，防止系统监控日志、审计事件和传感器数据被篡改。`AU-6: 审计审查、分析和报告 | (7)\
  \ 允许的操作`;`AU-9: 审计信息的保护`;`SI-4: 系统监控`\n\n\n\n\n2. 实现网络、系统和进程的分隔/隔离，以减少破坏性攻击跨越网络传播的能力。[CA-3:\
  \ 系统互连; SC-3: 安全功能隔离; SC-7: 边界保护 | (21) 系统组件隔离; SC-11: 可信路径 | (1) 逻辑隔离; SC-39: 进程隔离]\n\
  \n3. 进行备份测试和弹性演练，以确定恢复机制和故障保护是否按预期工作。[CP-9: 系统备份 | (1) 可靠性和完整性测试 | (2) 使用采样进行恢复测试;\
  \ CP-10: 系统恢复与重构 | (1) 应急计划测试]\n\n4. 在允许删除或破坏数据的命令前，要求来自合格且授权的人员进行双重授权。[CP-9: 系统备份\
  \ | (7) 双重授权]\n\n5. 实施措施在发生导致安全系统失效的破坏性攻击时维持组织的安全。例如，配置防火墙在离线时拦截所有流量而非允许所有，或配置系统在检测到攻击时进入“安全模式”。[CP-12:\
  \ 安全模式; SC-24: 处于已知状态]\n\n6. 维护受破坏性攻击保护的介质传输机制。例如，确保包含敏感数据的硬盘保持离线、断开连接，并存储在安全的地方，防止物理破坏性攻击（如真实火灾）损害其。[MP-5:\
  \ 介质传输; PE-18: 系统组件位置; SC-28: 静态数据保护]\n\n7. 在将移动介质或设备连接到组织的系统或网络之前，对其进行测试和扫描以寻找恶意软件证据。[MP-6:\
  \ 介质清理; SC-41: 端口和 I/O 设备访问]\n\n8. 进行风险评估，确定哪些数据和系统如果被破坏会对您的组织造成最大的伤害。对这些系统和数据采取高级预防措施并安装特殊的保护措施。[RA-3:\
  \ 风险评估; SA-20: 关键组件的定制化开发]\n\n9. 构建如恶意代码保护和爆炸室等防御，以寻找破坏性攻击能力的证据。[SC-44: 爆炸室; SI-3:\
  \ 恶意代码保护]\n\n## 总结\n\n在本章中，我们回顾了火灾攻击以及忍者用于秘密携带火焰和将火武器化的各种技术。我们查看了若干次高水平的网络攻击以及防御这些攻击的方法。我们还更广泛地研究了网络威胁如何像火灾攻击的数字孪生。\n\
  \n在下一章中，我们将详细讨论忍者如何与外部盟友通信并协作以发动火灾攻击。忍者通过许多巧妙的方式实现了隐蔽命令与控制（C2）通信——这些方法与某些恶意软件用于执行\
  \ C2 通信的方法相似。\n\n# 18 隐蔽通信\n\n当忍者在进入敌方城堡后需要与将军通信时，忍者需要让他的盟友知道自己的位置。安排好通信的时间和地点至关重要。\n\
  \n> 为了确保夜攻成功，在下达命令之前，先派遣忍者了解敌方位置的细节。\n\n> —白守森百周 (Yoshimori Hyakushu) #12\n\n由于忍者首要是间谍活动专家，他们必须安全地传递秘密信息。`yabumi`（矢术）方法是一种发送信息的常用方式，将卷轴绕在箭杆上，通过箭羽上的标记识别接收者。考虑到封建日本的后勤现实，忍者并不能总是保证\
  \ `yabumi` 能够到达目标，因此他们开发了箭的“握手”。如果一方看到特定数量的箭被快速射向同一个地点，他们就会向前方射回特定数量的箭作为回信号。这种信号和反信号建立了友好的连接。忍者随后射出\
  \ `yabumi`，它会被捡起并递送给目标。\n\n对于远距离信号传输或不方便发送卷轴时，忍者发明了旗帜、火、烟雾和灯光信号（`hikyakubi`）。当这些方法都不可行时，他们使用了秘密鼓、钟和海螺。信号设备响亮且独特的声响让敌人内部的忍者准备接收秘密通信。具体的信号模式在渗透前一到六天达成约定，以避免混淆。在最初的\
  \ `hikyakubi` 信号之后，信息通过鼓、钟或海螺信号传递。\n\n《事法集》（Jiyoshu）手册警告敌人可能会通过箭发送虚假信件；因此，接收者应使用之前描述的一些语言技术仔细检查\
  \ `yabumi` 信息。《万应之解》（Bansenshkai）卷轴描述了如何将信息分成几部分并由不同的信使发送。忍者甚至开发了用橘汁、酒或蓖麻油制成的墨水，可以通过火显现，并使用只有接收者才能理解的自定义字母表（`iroha`）。\n\
  \n\n恶意软件通常无法完全独立和自主运行。如果真的可以做到，恶意软件将变得极其庞大、复杂且易被防御者发现。相反，大多数恶意软件在行动期间需要其控制器的战术指导，因此威胁攻击者使用名为\
  \ `command and control`（缩写 `C2`、`CnC` 或 `C&C`）的技术来与其控制的恶意软件、后门、植入程序和受控系统进行通信。操作人员使用\
  \ `C2` 通信发送命令，促使其执行如下载数据、更新配置甚至删除自身等操作。`C2` 植入程序也可以通过发送统计数据或贵贵文件、请求新命令或回传信号（beaconing）以报告系统在线来发起通信。网络威胁攻击者通常会在渗透前几周建立如域名、IP\
  \ 地址和网站等 `C2` 基础设施。`C2` 功能广为人知，许多防火墙、`IDS/IPS` 以及其他安全设备可以防止攻击者与目标系统直接通信或反之。为了绕过这些控制，威胁攻击者不断开发更先进的\
  \ `C2` 技术、战术和程序（`TTPs`）。例如，`C2` 数据可以嵌入 `ping` 的载荷中或托管在公共网站的命令中。攻击者已在 `Twitter` 馈和受信网站的评论中使用\
  \ `C2`。他们还利用 `C2` 在受控系统上建立代理和电子邮件中继站；然后通过已知协议和未被安全控制拦截的机站点进行通信。插入受控系统的手机可能会被恶意软件感染，该软件在\
  \ `USB` 连接后会通过手机基站“调用” `C2`，绕过防火墙和其他防御，并在手机充电时促进受感染主机与 `C2` 之间的通信。某些 `C2` 通信方法使用闪烁的\
  \ `LEDs`（如火光）、改变 `CPU` 温度（如烟雾）、使用硬盘或 PC 扬器的声音（如鼓声），并利用电磁波绕过与附近机器的物理隔离开。\n\n威胁攻击者通过混淆、加密和其他机密技术对\
  \ `C2` 通信进行分层处理，以保持与受控系统的联系，而不向受害者泄露命令证据。攻击者可以通过以下方式避免检测：\n\n- 限制每日通信的数据量，使每日流量看起来从无异常（例如，每天最多\
  \ `100MB`，两周内达到 `1.5TB`）。\n- 仅在用户活跃期间发送或接收信跳信号（beacons），以与合法流量混合（例如，不在周日凌晨或节假日清晨频繁发送信跳信号）。\n\
  - 切换到新的、随机或动态的 `C2` 点以避免统计学异常。\n- 定期生成伪合规流量，以规避行为分析的审查。\n- 禁用或删除活动日志以躲避取证分析。\n\n\
  先进的 `C2 TTPs` 可能变得特别阴险、几乎无法检测且难以阻。。考虑一个 Windows IT 管理员的例子，他们实施了极其严格的防火墙控制，导致他们唯一访问的网站是\
  \ `technet.microsoft.com`（微软为 IT 专业人员提供的官方 Web 门户）。仅允许 `HTTPS` 协议，杀毒软件为最新且正在运行，操作系统已完全打补丁。没有运行\
  \ `email`、`Skype` 或 `iTunes` 等外部程序，管理员完成工作所需的 Microsoft TechNet 网站除外。这听起来可能很安全，但请考虑，中国\
  \ `APT17`（也称为 `Deputy Dog` 或 `Aurora Panda`）在 Microsoft TechNet 页面上发布的评论中编码了隐藏的\
  \ IP 地址——这些评论与受控系统上的 `BLACKCOFFEE` 远程访问木马进行了通信。如果有人检查了代理流量、行为分析、异常启发式算法、`IDS` 签名、杀毒软件或防火墙警报，没有任何迹象表明正在发生恶意通信。\n\
  \n应对复杂 `C2` 的高级防御工作通常涉及对系统进行物理隔离（air gapping），但近年来也开发了新的 `C2` 通信技术。一个示例是使用加载了 rootkits\
  \ 或受损固件及恶意软件的 `USB`，该设备一旦插入，就会与受控系统上的植入程序通信，收集数据并将其秘密上传到 `C2`。\n\n## 通信控制\n\n组织通常会订阅多个威胁馈源，这些馈源持续提供恶意的\
  \ URL、IP 地址和域名作为 `C2`。组织将通过防火墙和安全设备发出告警或拦截这些威胁。这是防御 `C2s` 的良好起点，但由于存在源源新的 URL、IP\
  \ 地址和域名，需要新旧结合方法来应对 `C2s`。建议如下：\n\n1. **遵循最佳实践。** 虽然阻止所有 `C2` 通信可能不现实甚至不可能，但通过实施网络最佳实践可以阻止基础或中级的\
  \ `C2s`：了解你的网络、设置边界流量控制、建立白名单并授权狩寻小组主动拦截 `C2` 通信。不要在最佳实践上走捷径。相反，要致力于可靠的安全工作。记录、测试并验证你的最佳实践，并咨询第三方评估人员获取额外措施。在维护和改进现有最佳实践基础设施的同时投资安全。\n\
  \n2. **实施带有“远程查看”控制的分区。** 网络分区和隔离意味着建立多个网络和机器，例如内网机器和未分类的互联网机器，并相互隔离。分区应防止 `C2`\
  \ 通信跨越边界。不幸的是，用户经常会将内网机器临时连接到互联网以下载文档、库文件或其他违反安全协议的行为。解决此类问题的方法之一是配置内网机器，使其远程查看另一台连接互联网的隔离机器。用户无法物理或直接访问隔离箱；他们可以发出命令并查看屏幕，但无法从隔离箱中接收实际的原始信息。远程查看箱实际上是一台显示另一个房间电脑的电视显示器。因此，`C2`\
  \ 通信、恶意软件和漏洞无法通过视频信号跳转造成伤害。\n\n## 建议的安全控制与缓解措施\n\n在相关情况下，建议结合 `NIST 800-53` 标准中相应的安全控制措施。评估每项措施时都应考虑到\
  \ `C2s` 的概念。\n\n- 在系统、网络边界和网络出口点实施保护措施，以寻找网络中数据外泄的迹象。这可能意味着阻止传感器无法拦截的加密隧道，同时寻找未经授权的协议、数据格式、数据水印、敏感数据标签以及离开网络的大文件或数据流。`AC-4:\
  \ 信息流强制 | (4) 加密信息内容检查; SC-7: 边界保护 | (10) 防止外泄; SI-4: 系统监控 | (10) 加密通信的可视性`\n\n\n\
  \n\n\n## 2. 在互联网与内网资源之间建立隔离和分段的多网络。限制关键内部系统连接互联网。[AC-4: 信息流强制 | (21) 信息流的物理与逻辑隔离；CA-3:\
  \ 系统互连 | (1) 非机密国家安全系统连接 | (2) 机国家安全系统连接 | (5) 外部系统连接限制；SC-7: 边界保护 | (1) 物理隔离子网络\
  \ | (11) 限制入站通信流量 | (22) 连接不同安全域的独立子网]\n\n## 3. 限制对任何包含关键系统的远程访问。[AC-17: 远程访问]\n\
  \n## 4. 实施限制和配置控制，以检测并防止未经授权无线通信。[AC-18: 无线访问 | (2) 监控非法连接；PE-19: 信息泄露；SC-31: 隐通道分析；SC-40:\
  \ 无线链路保护；SI-4: 系统监控 | (15) 无线到有线的通信]\n\n## 5. 培训安全团队和员工以识别 C2 通信。[AT-3: 基于角色的培训\
  \ | (4) 可疑通信和异常系统行为；SI-4: 系统监控 | (11) 分析通信流量异常 | (13) 分析流量和事件模式 | (18) 分析流量和隐蔽外泄]\n\
  \n## 6. 拒绝任何可能作为 C2 后门或植入程序的未经授权软件在你的系统中运行。[CM-7: 最小功能化 | (5) 授权软件——白名单]\n\n## 7.\
  \ 保护绕过安全控制和边界的系统直接物理连接；这些包括机柜、以太网墙插和计算机接口。[PE-6: 监控物理访问；SC-7: 边界保护 | (14) 防止未经授权的物理连接\
  \ | (19) 阻止来自非组织配置主机的通信]\n\n## 8. 对进入或离开组织的的可移动介质进行检查和扫描，防止人员通过交付和移除外部介质手动执行 C2\
  \ 通信。[PE-16: 交付与移除]\n\n## 9. 实施白名单，拒绝与任何未通过异常许可的资源或地址通信。许多 C2 站点是全新的域名，贵组织没有任何合规使用历史。[SC-7:\
  \ 边界保护 | (5) 默认拒绝——例外允许]\n\n## 总结\n\n在本章中，我们回顾了忍者用于接收和向盟友发送命令的各种通信方法。我们描述了各种现代 C2\
  \ 方法，以及它们相对应的忍者方法。然而，我们仅触及了皮毛，因为极有可能最复杂的 C2 技术尚未被发现。就像忍者最出色的隐蔽通信方法从未被记录下来一样，我们可能永远无法得知最先进\
  \ C2 技术背后的天才智慧和创造力。我们讨论了几种最佳实践，包括白名单和加密检查，作为缓解对手 C2 的手段，但解决问题的理想方案仍有待发现。\n\n在下一章中，我们将讨论忍者的代号（call\
  \ signs）。这些是通过留下独特的标记或信息，在敌方内部与盟友通信的方法。类似于死信箱（dead drop），代号永远不会离开环境边界，因此传统的阻止或检测\
  \ C2 通信的方法通常对它们无效。\n\n# 19 代号\n\n当你潜入敌营时，要的第一件事就是标记路径。虽然忍者在流行文化中经常被描绘成孤身行动者，但许多人是团队工作的。《军谱事集》（*Gunpo\
  \ Jiyushu*）手册描述了忍者为了相互通信而开发的代号（或物理标记）。这些标记必须是便携的、部署快速且放置在地面上的。例如，一名忍者可能同意通过留下染色的米粒来告知同伴他们的行踪。一个忍者留下红米，另一个留下绿米，以此此类推，这样当同伴看到那些有颜色的米粒时，他们就知道盟友曾经过。这个系统的精妙之处在于，虽然忍者可以快速识别这些物品，但普通的路人并不会注意到颜色奇异的米粒。通过类似的方法，忍者可以微妙地为盟友指向选定的路径，或者在地面留下一张小纸条来标记将被焚毁的住所，从而减少团队成员成为受害者或嫌疑人的概率。\n\
  \n> 潜入敌营后，你要做的第一件事是标记路径以引导你的盟友。\n> \n> —吉森百集（Yoshimori Hyakushu）#26\n\n## 渗透技巧\n\
  \n在 2016 年民主党国家委员会黑客攻击期间，俄罗斯军事机构 GRU（也称为 APT28 或 FANCYBEAR）及其盟友安全机构 FSB（APT29 或\
  \ COZYBEAR）在同一网络和系统上操作，但他们未能使用代号进行相互通信。这一疏忽导致了重复性工作，并在受害者网络中产生了可观测值、异常和其他入侵指标（IoCs），这可能导致了这两次行动的失败。这种通信的缺失（可能源于这两个情报机构之间的部门隔离）让我们看到了网络间谍威胁组织可以从忍者身上学到什么。\n\
  \n\n\n\n\n虽然网络安全社区尚未观察到重叠的威胁组织使用隐蔽标记，但 DNC（民主全国委员会）黑客攻击表明了存在此类协议的必要性。假设 GRU（俄罗斯总参谋）和\
  \ FSB（联邦安全局）对他们的 DNC 黑客攻击手段进行了事后报告，他们可能已经决定在未来涉及目标重叠的行动中实施呼号协议（call sign protocol）。如果网络间谍组织开始以隔离但相互交叉的形式进行定期工作，那么在无法使用正常通信通道时，他们需要一种方法来交流各种信息，包括他们在系统和网络中的存在情况，以及关于其目标的细节。\n\
  \n如果这些呼号确实存在，它们会是什么样子的？有效的网络呼号最可能具备：\n\n*   随时间推改变，就像忍者（shinobi）的标记那样。\n*   实现在无法被捕获和逆向工程的工具和恶意软件中。需要使用键盘的人员来识别它们。\n\
  *   存在于重叠间谍小组一定能发现的位置，例如高价值且唯一的主域控制器（DC）。考虑到文件安全监控器的存在以及 DC 并不频繁重启的运行现实，威胁组织可能会将标记放置在\
  \ DC 的内存中，以最大化其持久性并最小化其检测性。\n\n目前尚不清楚什么样的字符串或唯一的十六进制字节可以作为标记；标记可能存储在什么缓存、临时表或内存位置；以及另一个操作员如何轻松地发现它们。然而请注意，网络安全行业已经观察到多个恶意软件家族，它们留下特定的文件或注册表键作为信号，告知病毒的后续副本感染已成功扩散到特定机器（因此无需再次尝试感染该机器）。尽管这种呼号功能无法针对动态的人类威胁攻击者轻松实施，但防御者可以创建伪造感染信号的文件和注册表键，促使恶意软件无害地离开。\n\
  \n## 检测呼号的存在\n\n许多组织正努力识别是哪个用户从共享网络驱动器删除了文件，更不用说隐藏在系统远程部分的隐蔽呼号了。尽管如此，防御者越来越需要能够防御在防御环境内部相互通信的威胁。为了有机会捕获威胁者，防御者需要接受培训，并需要实施检测工具以及主机可见性。\n\
  \n1.  **实施高级内存监控。** 识别网络中的高价值系统——即你认为威胁者会针对目标或需要访问以进一步移动到目标的系统。然后，探索你组织监控和限制这些系统内存更改的现有能力。也查看供应商提供的产品和服务。评估调查此类内存更改源头所需的精力和时间。最后，确定你是否能有信心地识别出这些更改是否表明目标机器已被入侵。\n\
  2.  **培训你的人员。** 培训你的安全、狩猎和 IT 团队，将内存中的取证痕迹视为潜在的入侵指标，特别是当这些痕迹出现在高价值目标中，而不是忽视他们发现的任何异常之处。\n\
  \n## 推荐的安全控制和缓解措施\n\n在相关之处，建议是 NIST 800-53 标准中的适用安全控制提出的。每项建议都应该考虑到呼号的概念进行评估。\n\n\
  1.  确保获取相同系统或资源的当前用户无法获取先的用户信息。[`SC-4: 共享资源中的信息`]\n2.  识别可能用于未经授权的信息流的系统通信。潜在隐蔽通道的良好示例来自\
  \ `PE-8: 访客访问记录`。访客用于进入设施签名的纸质日志或不受限制的数字设备可能会受到信息标记的影响，这些标记向分部门间谍活动者发出其他小组已访问该地点的信号。[`SC-31:\
  \ 隐蔽通道分析`]\n3.  搜索潜在攻击和未经授权系统使用的指标，并部署监控设备以跟踪感兴趣的信息交易。[`SI-4: 系统监控`]\n4.  保护系统内存免受未经授权的更改。[`SI-16:\
  \ 内存保护`]\n\n## 总结\n\n在本章中，我们回顾了忍者团队在敌方领土内部相互信号的物理标记。我们学习了为什么这些呼号是有用的，以及根据卷轴记载的良好呼号的特征。然后，我们回顾了一次网络间谍行动，该行动由于缺乏呼号和导致的不协调导致了威胁组织活动的泄露。我们讨论了现代威胁组织可能会继续变得复杂化——这种复杂化可能包括采用呼号技术。我们还探索了现代数字呼号可能是什么样子，以及我们如何注意到它们。\n\
  \n在下一章中，我们将讨论忍者呼号的反面：忍者根据卷轴指示采取的在敌方领土内不留任何活动痕迹的预防措施。先进技术包括创建旨在欺骗防御者的虚假信号。\n\n# 20\
  \ 光、噪垃圾纪律\n\n古代忍者的传统说，在用火观察敌人之前应该锁好门。\n\n> 如果你必须在下雪时像忍者一样潜入，你必须小心的是你的脚步声。\n\n> ——白守百集\
  \ #53\n\n避免不必要的关注是他们职业的核心纪律，忍者在隐蔽方面经过了刻苦训练。如果灯笼发出的光干扰了动物，脚步声回响并唤醒了睡眠的目标，或者食物垃圾提醒了守卫对入侵者的存在，那么忍者的任务——如果不是生命——就会处于危险。因此，卷轴对于在保持光、噪、垃圾纪律的同时进行战术移动和操作提供了大量的指导。\n\
  \n光纪律包括通用战术。例如，卷轴建议渗透忍者在点燃火炬之前从内部锁门，以防止光线（以及房间内的任何人）逃逸。它还包括特定的技术。《万叶抄》（Bansenshūkai）详细介绍了许多用于光管理的巧妙工具，例如\
  \ `torinoko`（鸟子）火蛋。这是一个中心带有火星的特殊易燃材料束，压缩成蛋的形状和大小。火蛋落在忍者的手心中，通过打开或握手来控制到达火星的氧量，从而调亮或调暗光线，并允许携带者将光引导到特定的狭窄方向。通过这种工具，忍者可以快速打开手查看房间内谁在睡觉，然后通过握拳立即熄灭光线。因此，火蛋具有与现代战术手电筒相同的按需定向和开关光线控制功能。\n\
  \n\n\n\n对于忍者来说，沉默至关重要，卷籍中描述了一系列在渗透目标时保持安静的技巧。《忍之传》（`Ninpiden`）建议咬住一条纸条来减小呼吸声。同样，有些忍者通过手掌抓住脚底在狭窄空间内移动，然后用手走路来消除脚步声。这项技巧的成功执行可能需要大量的练习和体能训练。忍者还经常携带油脂或其他粘稠物质，用以润滑嘎吱作响的门扇铰链或木质滑动门——任何可能发出吱吱声并引起他人注意其踪的物品。卷籍还警告不要过度使用这些液体，因为它们可能会肉眼可见地积聚，导致守卫发现有人闯入的事实。3\n\
  \n并不是所有的忍者噪音纪律技术都是为了最小化噪音。卷籍还提供了制造有目的动静的指导。《忍之》（`Shōninki`）描述了一种名为 `kutsukae`（或“更换鞋子”）的噪音纪律技巧，它实际上涉及改变脚步节奏，而不是更换不同的鞋。渗透中的忍者可以拖行、跳跃、假装跛行、采取细碎的步，或发出清晰但独特的脚步声来欺骗任何听者。然后，当他们恢复自然步态时，听者会认为他们听到的是另一个人，或者错误地认为他们追踪的人突然停止了。4《忍之传》描述了通过拍击木块或大喊“小偷！”或“救命！”来模拟警报，以此测试守卫对噪音的反应。5《忍之书》（`Bansenshūkai`）描述了一种更受控的噪音测试，即目标或守卫附近的忍者会逐渐增大说话声音，以确定目标的噪音检测阈值。噪音测试有助于忍者对目标如何做出做出具体的观察，包括：\n\
  \n*   目标反应有多快？\n*   守卫之间是否就听到噪音的问题产生了争论？\n*   守卫是否迅速且警觉地出现，并手持武器？\n*   噪音是否让目标感到措手不及？\n\
  *   目标是否完全毫无察觉？\n\n这些观察不仅能告诉忍者目标的警觉和听觉有多敏锐，还能揭示目标在应对事件时的技能和准备情况——忍者可以利用这些信息来定制渗透方案。6\n\
  \n在物理证据方面，忍者在“不留痕迹”成为一种环保准则很久以前就已经使用它了。一种名为 `nagabukuro`（或“长袋”）的工具有助于控制声音和垃圾。当忍者爬上高墙墙并需要切开一个洞爬过去时，他们会在下方挂上一个衬有皮毛或毛毡的大型厚皮\
  \ `nagabukuro` 袋，以接住从墙上落下的碎片并消音。然后忍者可以静静地将碎片降到下方地面上隐蔽的地方。这比让碎片掉落在地面或溅入护城河中要好得多。7\n\
  \n在本章中，我们将忍者渗透者的“光”、“噪音”和“垃圾”抽象为相应的网络威胁等物。我们将回顾威胁组织用于最小化其遗留证据的一些工具和技术，以及一些程序性的技战纪律。我们将讨论检测“低且慢”威胁的话题，以及修改你的环境以使其有利于你。思维练习将观察一种忍者用于掩盖脚步声的技巧，该技巧理论上可以应用于现代数字系统。在章节结束处，我们将介绍检测纪律，作为一种对抗复杂对手的方法——这种对手会时刻留意他们可能在你的网络中留下（或不留下）的可观测特征。\n\
  \n## 网络层面的光、噪音与垃圾\n\n数字世界的行为并不总是与物理世界相同。要理解并持续搜猎对应“光”、“噪音”和“垃圾”的网络等价物可能具有挑战性。由于防御者缺乏时间、资源和在受控的数字系统内部进行监控和搜猎的能力，攻击者的光、噪音和/或垃圾痕迹往往没有被记录。结果是威胁攻击者执行网络渗透可能比物理渗透更容易。\n\
  \n许多扫描和漏洞利用工具及框架（例如 `Nmap`，8），利用防御者的假设，即认为具有如此微小足迹的文件不会造成伤害。恶意软件可以配置为不频繁地发送命令与控制（`C2`）信号来最小化其产生的噪音，或者通过故意长时间睡眠或执行长时间无操作（`NOP`）指令来最小化进程日志或内存中的噪音。为了避免留下可能暴露其位置的数字垃圾，某些恶意软件不会向磁盘投放任何文件。邻近网络基础设施上的攻击者和恶意软件可以选择被动收集信息，从而对目标内部环境获得缓慢但丰硕的了解。值得注意的是，这些许多威胁也选择接受运行其行动时产生的网络光、噪音和/或垃圾的风险。\n\
  \n假设足够先进的攻击者有程序来限制网络光、噪音和垃圾，例如：\n\n*   将与目标的通信限制在每天 100MB 以内\n*   确保恶意软件产物、文件和字符串不易被识别为可能暴露其踪迹或归因于恶意软件的垃圾\n\
  *   “静音”日志、警报、陷阱和其他传感器，以免安全系统发现入侵者的存在\n\n似乎大多数当前的安全设备和系统被设计为响应已知威胁的精确特征而触发，例如特定的\
  \ IP、事件日志或字节模式。即使有可以实时显示威胁活动的专业软件（如 `Wireshark`，10），也需要巨大的精力来收集、处理和研究这些信息。将这种工作流与听到脚步并做出反应进行对比。由于人类无法以感知物理环境的方式通过感知感知数字领域，安全措施基本上是带有视觉和听觉障碍的守卫，等待指令来对房间另一头的威胁采取行动。\n\
  \n## 检测纪律\n\n不幸的是，对于捕捉长于不被发现的人，没有理想的。某些威胁攻击者在该领域相对于防御者具有巨大的优势，他们甚至可以授权访问安全团队的事件工单工具，并监控任何引用其自身威胁活动的新调查。然而，仍有改进空间、需要进行的培训、需要部署的反措施，以及防御者可以尝试通过技战术错误来误导或捕获威胁的技巧。\n\
  \n1.  *练习意识能力。* 作为威胁搜猎、事件响应和安全分析培训的一部分，教你的安全团队寻找攻击者的光、噪音或垃圾的迹象。\n\n\n\n\n\n### 2.\
  \ `Install squeaky gates. ` 考虑实施欺骗性的攻击感知与警告（AS&W）指标，例如在域控制器或其他敏感系统或网络设备上每分钟触发一次的安全事件。例如，你可能会实施一个显示为“[[安全事件日志警报]:\
  \ Windows 无法激活 Windows Defender/验证此版本的 Windows 失败.”的警告。这可能会误骗正在渗透的对手。可以假设，某些对手可能会以这种方式评估你的安全性，以便他们判断是否可以使用零日漏洞或其他隐蔽技术，而不必担心被发现。\n\
  \n## 建议的安全控制与缓解措施\n\n在相关之处，建议结合了 NIST 800-53 标准中的适用安全控制措施。每项措施都应根据可能随攻击产生的“光、噪音和垃圾”进行评估。\n\
  \n1. 通过模拟“大张旗鼓型”和“低调缓慢型”对手的网络渗透，来确定贵组织的检测能力。记录哪些日志与哪些观测活动相关，以及你在何处可能存在感知盲点。[AU-2:\
  \ 审计事件；CA-8: 渗透测试；SC-42: 传感器能力和数据]\n\n2. 将事件日志、警报和观测结果与记录的威胁行动相关联，以便更好地教育员工，并测试你对威胁在网络上如何“发声”的感知。[IR-4:\
  \ 事件处理 | (4) 信息关联]\n\n3. 调整你的沙箱和爆破室，以寻找试图执行网络等同的“光、噪音和垃圾”纪律的威胁攻击者的指标。[SC-44: 爆破室]\n\
  \n4. 使用基于签名的检测方法来寻找旨在规避签名识别的隐蔽纪律活动。[SI-3: 恶意代码保护 | (7) 非签名检测]\n\n5. 部署信息系统监控以检测隐蔽活动。避免在高活动区域放置过敏的传感器。[SI-4:\
  \ 信息系统监控]\n\n## 简报报告\n\n在本章中，我们回顾了忍者（shinobi）采取的预防措施以及他们用来隐藏活动证据的工具——例如，测量他们在惊动守卫之前能制造多大的声响，并了解如果忍者活动被发现，目标可能会如何应对。我们讨论了对手使用的几种网络工具，以及这些工具如何被理解为“光和噪音”的等物——即防御者可以检测到的证据。最后，我们回顾了防御者可以采取的潜在对抗措施。\n\
  \n在下一章中，我们将讨论协助忍者渗透的情况，因为这些情况缓解了光、噪音和垃圾带来的问题。例如，强暴雨可以掩盖噪音、遮挡视线并冲刷他们留下的痕迹。网络防御者可以考虑类似的情况来保护他们的系统。\n\
  \n# 21: 渗透环境\n\n你应该在敌人移动的精确时刻进行渗透，而不是在他们不动时尝试——这是一种有原则的人的行为。\n\n> 在大雨中，当雨势最猛的时候，你应该利用它进行忍者活动和夜袭。\n\
  \n> —《吉森百集》(Yoshimori Hyakushu) #1\n\n《忍传》（Ninpiden）和《万应忍法》（Bansenshūkai）都建议，在攻击目标时，忍者应利用掩体保持不被发现。他们可能会等待存在掩体的情况，或者在必要时自己创造这些情况。卷籍提供了各种有助于渗透的状况，从自然现象（强风和暴雨）到社交聚会（节日、婚礼和宗教仪式），再到忍者发起的活动（放马、引发斗殴和纵火建筑）。无论来源如何，一个精明的忍者都应该能够利用分散注意力、兴奋、混乱以及其他转移目标注意力的条件。\n\
  \n忍者能够将恶劣天气转化为有利的渗透环境。例如，大雨暴雨意味着街道空旷、能见度差以及湍流可以掩盖忍者发出的任何声音。当然，坏天气对所有人都是不利的，《吉森百集》的第二首诗提到，过强的风暴雨可能会压垮忍者，使其难以执行战术和技巧：“在深夜，当狂风雨交加时，街道如此黑暗，使得忍者无法轻易发动夜袭。”\n\
  \n忍者还利用了其他更具个人色彩的情况，例如目标家族中的悲剧死亡。卷籍指出，当目标处于哀悼期间，他们可能连续两三晚无法入睡，这意味着忍者可以在葬礼或守灵期间伪装成哀悼者被察觉地接近，或者等到目标在第三或第四天晚上终于深度入睡后再进行渗透。\n\
  \n当然，忍者的任务并不总是与天意相合。在某些情况下，忍者会亲自在目标要塞制造严重疾病。生病的人是不有效的防御者，而他们忧心忡忡的护理者则忙于奔命，为了照顾病人而放弃睡眠。当患者开始康复时，如释重负的护理者会沉睡，此时忍者便渗透进去。或者，忍者可以破坏关键基础设施（如桥梁），然后等待目标在炎热的夏季承担这项艰巨困难的重建工程，然后在精疲力竭的对手面前进行渗透。\n\
  \n有效的分散注意力也可以更具直接对抗性。《万应忍法》描述了一种被称为“虚忍”（kyonin，即“通过惊喜制造缺口”）的技巧，它利用了军事力量或其他忍者的协助。这些盟友让目标认为攻击正在进行，也许通过开火、击战鼓或大喊，而忍者可以在混乱中溜入。当忍者想要安全离开时，只需重复这种技术即可。\n\
  \n\n\n\n\n网络安全攻击者可能会分散目标的注意力，并创造某些条件，使得检测渗透行为变得像古代忍者那样广泛且精明。例如，当网络安全防御者检测到突发的分布式拒绝服务（DDoS）攻击时，标准操作程序要求评估\
  \ DDoS 的强度和持续时间，并创建安全事件工单以记录该活动。防御者可能不会立即怀疑 DDoS 是威胁攻击者攻击网络的掩护。因此，当攻击淹没了目标的安全传感器和数据包捕获（`pcap`），且入侵检测或防御系统（`IDS`/`IPS`）无法打开——换句话说，当通信量大到无法进行检查时——防御系统可能会自然地让数据包通过，而不对其进行恶意内容扫描。当\
  \ DDoS 停止时，防御者会注意到没有显著的停机时间，并将状态恢复正常，却没有意识到尽管 DDoS 仅持续了 10 分钟，但数据包洪水已经给了攻击者足够的时间和掩护来入侵系统并在网络中建立立足点。（正如《百人集》第\
  \ 2 卷警告的，强风可能会同时阻碍目标和攻击者，攻击者不太可能部署过度激烈的 DDoS。这样做会导致网络设备丢弃数据包并丢失通信数据——包括他们自己的攻击。相反，攻击者可能会限制目标系统的速度，以在不中断通信的情况下使其过载。）\n\
  \n攻击者还有许多其他方法在渗透目标时创造有利条件，他们的限制仅限于想象力。攻击服务和基础设施的质量与可靠性可能有利，例如中断 ISP 或互连。耐心攻击者可以等待商业供应商发布故障更新或补丁，之后目标的安全或\
  \ IT 人员可能会创建“允许所有”条件或移除安全控制以排除故障。威胁攻击者可能会监控公司的资产收购过程，确定他们何时将新系统和服务器迁移到生产环境或云端——因此确定这些目标何时可能无人看或未针对攻击进行正确配置。威胁攻击者可能会跟踪公司合并，并试图渗透不同公司合并网络时产生的间隙。其他攻击者可能会利用目标建筑内举办的特殊活动（例如大型会议、供应商博览会被第三方会议），在陌生人群中混合并渗透目标。他们甚至可能在此过程中顺手拿礼品袋。\n\
  \n## 敌对不利因素 (Adversarial Adversity)\n\n保证数字系统的 100% 运行时间被认为是不可能的，而要保证这些数字系统在任何时候都\
  \ 100% 安全应该更加困难。此外，防止灾难、危害、事故、失败和不可预见的变化几乎是不可能的——其中许多情况将创造机会主义威胁攻击者可以渗透的条件。为了避免这些情况而过度谨慎可能会阻碍业务采取大胆战略和执行目标的能力。解决这一困境的方案可能是冗余层系统以减少渗透机会。安全团队可能会实施等同于高可用性的安全——在系统薄弱的地方部署冗余层的安全防护。加强意识和准备。作为安全人员变更管理协议的一部分，针对事件、事故、危机、自然灾害和其他分散注意力或困惑的情况，训练您的安全团队寻找迹象，表明某事件是由攻击者创建或正被其用于渗透组织。在组织政策和程序中记录角色职责。使用威胁建模、桌面演练和风险管理来识别潜在的干扰，然后考虑处理这些问题的安全措施、应对措施和保护。\n\
  \n## 建议的安全控制与缓解措施 (Recommended Security Controls and Mitigations)\n\n在相关的情况下，建议结合\
  \ `NIST 800-53` 标准中的适用安全控制提出。评估时应考虑到渗透环境的概念。\n\n1. 识别并记录不同的安全控制和协议（例如身份验证）在紧急情况或其他极端情况下可能如何被处理，以缓解攻击者的渗透。[`AC-14:\
  \ 无需身份识别或验证的允许操作`]\n\n2. 针对使用外部信息系统的条件建立控制和策略，特别是在特殊情况下。[`AC-20: 使用外部信息系统`]\n\n\
  3. 在模拟紧急情况的应急培训期间（如火灾演习）启动渗透测试练习，以测试防御和检测能力。[`CA-8: 渗透测试; CP-3: 应急培训; IR-2: 事件响应培训`]\n\
  \n4. 对访问者实施物理访问限制，以及在无法引导大量不受控人员的情况下（例如响应火灾的消防员）实施限制，但仍必须防止未经授权的系统进入和退出。[`PE-3:\
  \ 物理访问控制`]\n\n5. 开发在怀疑攻击者已破坏您的防御的紧急情况下，关闭信息系统和网络的能力。[`PE-10: 紧急关机`]\n\n6. 考虑您的组织如何将攻击者意识和狩猎纳入应急计划。[`CP-2:\
  \ 应急计划`]\n\n7. 评估在备用站点突然转移或恢复业务操作是否会为攻击者渗透创造机会。然后考虑适当的防御措施和缓解措施。[`CP-7: 替代处理站点`]\n\
  \n## 总结 (Debrief)\n\n在本章中，我们回顾了创建和或等待为渗透目标提供掩护条件的战术。我们查看了几个忍者在目标防御良好时如何创造机会的示例，并探索了这种战术在现代网络环境中如何展开。我们涵盖了在脆弱时期管理安全的各种方法，并通过思维练习，研究了如何为风险无法避免、转移或应对的情况做好准备。\n\
  \n在下一章中，我们将讨论零日漏洞，或者一种新颖或秘密以至于没有人想过如何防御它的渗透手段。忍者也拥有类似于零日的漏洞和技术；它们是如此秘密，以至于禁止记录，卷轴中仅间接地提到了它们。\n\
  \n\n\n\n忍者的关键战术优势之一是保密。卷轴反复警告忍者要防止他人了解其能力的细节，因为如果某项技术泄露给公众，后果将可能是灾难性的。这不仅会导致技术在未来几代人中失效，使用泄露技术的忍者生命也可能面临危险。《毫无之书*Shōninki*）和《忍之传*Ninpiden*）都描述了向外暴露忍者秘密贸易技艺的危害，某些卷轴甚至建议杀掉发现技艺秘密的目标或目击忍者行动的旁观者。^(2)\n\
  \n《毫无之书》和《忍之传》都提到了因公开暴露而作废的古代技术。例如，古代忍者（`yato`）^(3)在进行侦察时，有时会穿过农田；他们通过等手段，例如装扮成稻草人，并在人们靠近时迅速摆出一个令人难以信服的姿势来避免被发现.^(4)然而，一旦这种技术被发现，当地人就会经常通过冲撞甚至用刺戳稻草人来测试它们。无论忍者的伪装有多么逼真，或者他们的肢体动作有多么巧妙，这项技术都变得太危险了，忍者必须开发新的隐身方法，或者完全避开农田。这项技能因此失传。\n\
  \n同样，有些忍者成了猫狗声音的模仿大师，这样如果他们在任务期间不小心引起了人的注意，他们就可以汪汪或或喵喵，让目标相信这种扰动只是路路过的动物，不需要进一步检查。这种技术最终也被发现了。守卫们接受了训练去调查不熟悉的动物声音，这使忍者面临被发现的风险。^(5)\n\
  \n卷轴还描述了这样的情况：防御工事由狗看守，忍者无法将其杀掉、绑架或与狗建立友谊，否则会引起安全守卫的怀疑。在这种情况下，卷轴告诉忍者身上涂上鱼油气味，然后等狗离开守卫，或者引狗离开。接着他们殴打这只狗，并连续几个晚上这样做。由于鱼油气味刺鼻且稀有，这种气味会让狗将痛苦和惩罚与气味联系起来，狗就不再敢攻击带有这种独特气味的忍者了。当这种技术泄露后，守卫们接受了训练去注意鱼油独特的气味，或者他们的狗行为的突然改变。^(6)\n\
  \n当然，大多数忍者秘密在忍者实际上成为历史遗迹多年后，卷轴正式出版之前一直没有被暴露。因此，那个时代的防御者必须创造出技术来阻止他们完全不了解细节的攻击——甚至是连攻击者自己尚未考虑过的攻击。\n\
  \n对于作为防御者的忍者来说，卷轴提供了一些基础建议。《万应之会*Bansenshūkai*》的“指挥指南”^(7)卷册建议了各种安全最佳实践，包括密码、认证章、身份标记以及秘密符号和信号。卷轴还建议指挥官思考这些安全策略背后的原理；将它们与其他标准协议（如夜巡和守卫）相结合；采取高级预防措施（如设置陷阱）；并开发自己的秘密、定制且动态的安全实施方案。这些技术共同防御了技能低级或中等水平的攻击者，但无法防御最复杂的忍者。^(8)\n\
  \n为此，《万应之会》最务实的安全建议是：防御者永远不会做到完全安全、时刻警惕或拥有完美无可击的纪律。总总会有忍者可以利用的漏洞。相反，卷轴强调了理解敌人的哲学、心态和思维过程的重要性，并恳促忍者要开放心态尝试新技术，有时是现场发挥的：“很难准确根据情况、时间和地点判断如何行动。如果你有一套固定的方法或使用不变的形式，即使是最伟大的将军又如何获得胜利呢？”^(9)\n\
  \n作为防御者的忍者使用了创造性的心理建模，例如想象反向情景并探索潜在的漏洞。他们从自然中汲取灵感，想象鱼、鸟或猴子如何渗透城堡，以及他们可以如何模仿这些动物的能力。^(10)他们通过研究普通盗偷（`nusubito`）推导出新技术。最重要的是他们信任人类大脑的创造力，并进行持续的学习、逻辑分析、问题解决和元认知灵活性：^()\n\
  \n> 尽管对于忍者来说有数百万个微妙且瞬息变化的教训，但你无法通过传统或传授来完全教他们。你要做的最重要的事情之一，就是始终尽可能去了解每一个可能了解的地点或省份。\
  \ . . . 如果你的心完全顺应万物之规律，并以完美的理性和逻辑运作，你就可以穿过“无门之门”。 . . . 人心是奇妙且灵活的。它是令人惊叹的。随着时间的流，无论是清晰还是神秘，你将领悟到事物的本质，理解将从空处出现……\
  \ . . . 在[忍者的道路上]，你应该掌握所有可能的一切…… . . . 你应该利用想象力和洞察力去感知并掌握万事之道。^() ^(11)\n\n一个拥有敏锐头脑和勤奋工作道德的前瞻忍者可以建立足够强大的防御来抵御未知攻击，迫使敌人花费时间和资源开发新的攻击计划、测试安全漏洞并对抗隐藏的防御——结果在整个安全系统发生动态变化时再次被挫败。\n\
  \n在本章中，我们将探索零日漏洞的现代威胁格局，并理解忍者卷轴中描述的哲学和技艺有哪些可以应用于网络安全。此外，我们将探索各种针对零日的防御方案。本章的城堡思维实验提出了应对隐藏在现代硬件、软件、云和网络中的未知潜在零日的挑战——这一切是为了引发新的见解。\n\
  \n## 零日\n\n在网络安全词汇中，很少有词能让防御者和知情的业务利益相关者感到如此恐惧，就像 `zero-day`（或 `0-day`），这指的是此前未知且防御者可能不知道如何对抗的漏洞利用或攻击。该术语源于公众已知该攻击或漏洞的时间为零天。由于受害者防御者没有机会研究该威胁，拥有常用技术零日漏洞的攻击者几乎总是成功的。例如，`STUXNET`\
  \ 使用四个零日漏洞破坏了伊朗一个物理隔离的核富设施，证明了零日漏洞攻击最安全、最隐蔽的目标的力量。^(12)\n\n\n\n零漏洞攻击的价值源于其未知性。一旦威胁攻击者使用零漏洞，受害者就有机会通过传感器和监控系统捕获攻击证据，对这些证据进行法医检查并对攻击进行逆向工程。在零漏洞在野外出现后，安全专业人员可以快速开发缓解措施、检测签名和补丁，并发布\
  \ CVE 编号以提醒社区。并非所有人都会关注此类公告或修复系统补丁，但随着 0 日漏洞变为 1 日漏洞、2 日漏洞等，其攻击成功的概率会越来越小。\n\n根据攻击者动机的不同，零漏洞的部署方式也不相同。追求快速获取巨额回报的网络犯罪分子可能会立即在规模巨大且高曝光的攻击中消耗零漏洞，以使其即时收益最大化。更高级的威胁者会建立程序来删除零漏洞攻击的产物、日志和其他可观测证据，以延长其使用寿命。真正复杂的攻击者会将零漏洞留给经过加固且高价值的目标，因为针对热门技术的零漏洞在黑市场上可以以数千美元的价格卖给网络犯罪分子，或者向渴望将其武器化或构建防御的政府以超过\
  \ 100 万美元的价格出售。\n\n虽然某些零漏洞源于软件代码中合法且良好的安全漏洞，但威胁攻击者可以通过协议或秘密人工渗透恶意地在软件应用程序的源代码中引入零漏洞。针对性攻击还可以破坏软件库、硬件或编译器以引入漏洞、后门和其他隐藏漏洞以供未来利用，就像一个加入城堡建设团队的忍者通过创建只有自己知道的秘密入口来破坏设计一样（卷轴告诉我们这种情况确实发生过）。([注\
  \ 13]）\n\n传统上，零漏洞的发现来自于对代码研究有深厚专业知识的安全研究人员威胁猎人人员，尽管团队应该审查现有的事件报告，以确定防御是如何失效的以及如何构建主动防御。\n\
  \n### 3. 谨慎实施动态防御\n近年来，安全专业人员共同努力引入了复杂且动态的防御措施，这些措施：\n\n*   试图让网络成为移动目标——例如每晚更新\n\
  *   引入随机化——例如地址空间布局随机化（ASLR）\n*   在交互时动态变化——例如量子加密\n*   启动不稳定的防御条件或免疫反应系统\n\n这些动态防御措施最初相当相当成功，但随后对手开发了击败它们的方法，使其从战略角度来看实际上变成了静态的。与网络安全供应商和从业人员交流，并探索有关最先进动态防御的文献，以确定什么对您的组织有效。然而，请谨慎行，因为今天的动态防御可能会变成明天标准的、易于被绕过的安全层。\n\
  \n### 4. 构建更“无聊”的防御\n考虑在可能的情况下您的环境中使用“无聊”的系统、编码实践和实现。“无聊防御”（Boring Defense）由 Google\
  \ 的 BoringSSL 开源项目发起([注 14])，建议通过简化和减少代码的攻击面、尺寸、依赖和复杂性——使其变得无聊——很可能会消除高价值或关键的漏洞。在这种实践下（它在代码、应用程序或系统级上均有效），代码并不精巧或艺术化，而是通过枯燥的安全手段保护且结构单一。从理论上讲，让代码更容易供人类和机器阅读、测试和解释，可以降低意外输入或事件挖掘出零漏洞的可能性。\n\
  \n\n\n\n### 5. 拒绝与欺骗 (D&D)\n\n拒绝与欺骗可以防止对手获取有关你的环境、系统、网络、人员、数据及其他可观测指标的信息，它并可以误导他们采取对你有利的行动。通过增加对手进行侦察、武器化和漏洞利用的难度，可以迫使他们花费更多时间进行测试、探索和验证，以确认他们在你的环境中感知到的漏洞是否真实存在。例如，你可以欺骗性地修改你的系统，使其声称自己运行着不同的操作系统和软件，例如通过将一个\
  \ `Solaris` 实例修改得看起来像一个不同的 `SELinux` 操作系统。（理想情况下，你应该实际迁移到 `SELinux`，但遗留 IT 系统的复杂性可能会让你的组织对旧软件的依赖比预期更长。）如果你的欺骗有效，对手可能会尝试针对你的\
  \ `SELinux` 实例开发并投送武器化攻击——这无疑会失败，因为你实际上并没有在运行 `SELinux`。\n\n请注意，D&D 应该应用在良好的安全实践之上以增强它们，而不是单独利用它来实现“通过隐蔽实现安全”。对于寻求额外方法防御持续性威胁攻击者的极成熟组织来说，D&D\
  \ 是一种安全终极手段，类似于《忍之书》（Bansenshūkai）中描述的“秘密策略”。\n\n### 6. 断开以保护。\n\n在对断开防御的讨论中，《论》（Shōninki）教你从心理、战略、物理以及任何其他方式与敌人隔绝。在网络安全中，这意味着创建一个完全向内的孤独蓝队，他们与世界隔离工作，忽略所有的安全新闻、威胁情报、补丁、漏洞、恶意软件变体、新签名、尖端产品——任何可能影响他们的判断、改变其心态或提供与敌人连接的东西。如果执行得当，断开技能会将防御者的思维引向一个远离行业标准的方向。对手很难以与隔离的防御者相同的方式思考，而防御者会开发出对手未遇到过的独特秘密防御策略，使得零日攻击极难以实施。\n\
  \n与 D&D 类似，这种方法仅在你已经拥有精锐的网络安全技能时才被推荐。否则，与敌人疏远并在黑暗中操作可能会适得其反。\n\n## 推荐的安全控制与缓解措施\n\
  \n在相关之处，建议结合 NIST 800-53 标准中的适用安全控制提出。每项都应在考虑零日漏洞的情况下进行评估。\n\n1. 为你的组织创建自定义、动态且自适应的安全防护，以强化安全最佳实践。[AC-2:\
  \ 账户管理 | (6) 动态权限管理； AC-4: 信息流强制 | (3) 动态信息流控制; AC-16: 安全与隐私属性 | (1) 动态属性关联; IA-10:\
  \ 自适应认证; IR-4: 事件处理 | (2) 动态重配置; IR-10: 集成信息安全分析小组; PL-8: 安全与隐私架构 | (1) 深度防御; SA-20:\
  \ 关键组件的定制开发; SC-7: 边界保护 | (20) 动态隔离与划分; SI-14: 非持久性]\n\n2. 记录零日漏洞，包括发现的时间和方式、针对的技术、漏洞扫描结果以及它们与预测的未来零日漏洞的相关性。[AU-6:\
  \ 审计审查、分析和报告 | (5) 审计记录的集成分析; SA-15: 开发过程、标准和工具 | (8) 威胁和漏洞信息的重用]\n\n3. 进行专门的漏洞扫描、验证和系统测试，以评估零日安全。[CA-2:\
  \ 评估 | (2) 专门评估]\n\n4. 聘用专业的渗透测试人员在你的软件、系统和其他技术中寻找零日漏洞，以便你能够主动防御这些利用。[CA-8: 渗透测试;\
  \ RA-6: 技术反侦措施调查]\n\n5. 对你的系统和软件进行威胁建模，以评估潜在的零日漏洞并评估你可以如何通过主动重新设计来缓解它们。考虑实施“无聊”代码。[SA-11:\
  \ 开发者测试与评估 | (2) 威胁建模与漏洞分析; SA-15: 开发过程、标准和工具 | (5) 攻击面减少; SI-10: 信息输入验证 | (3) 可预测行为]\n\
  \n6. 实现自定义、多样且独特的安全防御，以减轻零日漏洞利用你系统的能力。[SC-29: 异构性]\n\n7. 部署拒绝与欺骗行动，减少对手对你的组织进行侦察或武器化并投送零日攻击的能力。[SC-30:\
  \ 隐藏与误导]\n\n8. 建立狩猎小组和安全团队，以搜索零日攻击和利用的指标。[SI-4: 系统监控 | (24) 妥协指标]\n\n9. 定期进行自动化漏洞扫描，以检查\
  \ 1-day、2-day、3-day 等漏洞。根据情况对漏洞进行补丁、缓解或修复。[RA-5: 漏洞扫描; SI-2: 缺陷修复]\n\n## 回顾\n\n\
  在本章中，我们回顾了忍者的技术以及他们几个世纪以来培养的漏洞利用技术所包的秘密性。我们探索了这些秘密忍者技术中许多与我们今天观察到的零日利用和漏洞高度相似。我们回顾了在网络安全、网络战和信息主权方面，零日攻击的当前水平和未来潜力。本章涉及了讨论零日漏洞可能感觉很无意义，但实际上对于应对威胁至关重要。\n\
  \n在下一章中，我们将讨论如何聘用合适的人才来对抗各种零日漏洞和威胁者。我们将回顾忍者卷轴提供的招募忍者的指南，并探索我们如何将这些指导应用于吸引网络安全人才。目前有一种持续说法认为网络安全行业面临人才短缺问题，我怀疑在日本战乱时期也存在忍者短缺问题。忍者卷轴解释了如何识别可以训练成忍者的人，这种角色的风险比今天的办公室工作高得多。糟糕的招聘可能很快导致，从而浪费培训投入并危及任务和团队成员的生命。\n\
  \n# 23 招募忍者\n\n\n\n\n\n1. **智能**：一个思维坚定、逻辑严密、具有战略性的思考者，拥有良好的记忆、敏锐的观察力和快速学习的天赋。\n\
  2. **耐心**：一个审慎但果断的执行者，具有卓越的意志力和自控力。\n3. **干练**：在领域内机智、富有创意且勇敢，拥有显性的成就记录，并在绝境中也能预见胜利的远见。\n\
  4. **忠诚**：对他人真诚、正直且仁慈；一个会对自己的行为负责的人。\n5. **雄辩**：能够与领主进行有效沟通，并能对员工进行有说服力的引导。\n\n\
  除了这些品质外，寻求领导职位的忍者者必须能够有效地划分优先级，成功执行复杂的战术，并在压力下表现出明智的判断。^(2)\n\n卷轴还标记了一些会导致候选人失格的特质，包括自私和愚蠢；不道德（例如为了个人利益而利用技能）；以及可能沉溺于酒、色或贪婪。^(3)\
  \ 裙关系可能也是一个问题。虽然出生在忍者村（最著名伊加和甲贺）所带来的早期预期、机会和培养可能会增加成为成功忍者的机会，但出生于忍者父母家庭并不能保证成功。事实上，这些孩子可能成为具备上述许多负面特质的低质量候选人。^(4)\n\
  \n重要的是，在那个长长的理想与不理想特质列表中，并没有提到任何特定的要求技能、过往经验、教育背景、社会出身、等级或头衔——或者说，年龄或性别。看起来成为一名忍者是基于实力的，取决于个人的性格、价值观、资质和能力。\n\
  \n虽然卷轴没有对招聘、面试或评估候选人提供任何具体指导，但《忍之术》确实提供了如何理解一个人的深层本性的建议——即他们的知识、思维模式、信仰、欲望、缺陷和性格。尽管这些方法通常用于间谍活动和锁定目标，但可以非常有用地调整到招募新人的过程中。\n\
  \n例如，《忍之术》建议访问目标经常出没的地方，从了解该目标的当地人那里收集信息。最好的信息来自目标感到自在，或与店主或客户有关系的地方，因此那里更有可能透露秘密。^(5)\n\
  \n还有一种名为 `hito ni kuruma wo kakeru` 的技巧——“通过赞美让人们迷失”。这涉及向目标提问并赞美他们的答案；这种奉承会让你看起来没那么聪明，并且似乎表现出对候选人能力的敬畏。如果执行得令人信服，这种技术可以放松目标，增强他们的信心，并让他们享受向你介绍自己，这可能会导致各种有价值的情报。例如，一旦他们感到放松，你就可以改变对话话题，观察他们对无意询问的反应。他们有自己的意见，还是仅仅在复述他人的智慧？^(6)\n\
  \n招募盟友和侦查敌人对忍者来说关乎生死。他们往往必须决定是否将生命托付给某个人，或者那个人在危险的任务中是否会掉链。结果，忍者可能内化了这些技术和其他准则，成为专家的人洞观察师，能够快速且不露声色地评估一个人的能力、知识和性格。^(7)\n\
  \n在本章中，我们将观察现代组织的常见招聘做法，并识别将忍者的智慧融入人才招募和培训的机会。许多招聘经理甚至历史上的忍者似乎认为，他们可以在彻底的面试后评估一个人的适用性。虽然这在某些情况下有效，但许多候选人由于各种信号步骤、代理先决条件和人力资源检查清单可能被错误地筛选掉，根本没有获得此类面试的机会。我们从这些招聘流程可能无法达到预期结果的角度来探讨探索。\n\
  \n## 网络安全人才\n\n网络安全领域的爆炸式增长导致了招聘足够人数——以及正确的人来完成所有必要工作的问题。这部分源于网络安全是一个相对新的领域，技术门槛很高，但目前的候选人评估方法也存在问题。太多的私营公司过度看重那些符合简历要求或在白板题中表现良好的候选人，但他们无法胜任工作的日常职。候选人、招聘人员和培训计划已经注意了获得工作所需的条件，并据此定位，这削弱了传统候选人评估方法的有效性。大学产出的计算机科学毕业生无法解决旨在测试基础编程技能的\
  \ `FizzBuzz` 问题。候选人为潜在雇主提供偏见或虚构的参考文献。员工追求在简历上看起来好看但很少与其工作经验或能力相关的无意义的头衔。职场攀爬者通过死记硬背准备考试来获得\
  \ IT 或安全认证（并且通常会立即忘记这些信息）；为了曝光率而发表浅薄、无意义的文章；通过在他们几乎没有参与的项目中加上自己的名字来申请专利。\n\n对这些招聘漏洞作斗的措施（如家庭作业式测试）很容易通过在线帮助或直接抄袭来绕过。现场面试的白板题虽然曾很新颖，但现在已是常态。候选人在进入面试场前已经练习过这些题目，甚至可能从公司的泄密中获取了完全相同的练习。即使这些评估没有被攻破，也没有任何一种评估能准确衡量候选人从事网络安全工作的能力。\n\
  \n公平地说，候选人同样有理由怀疑网络安全雇主。即使一个机构雇佣了一位配得上“网络忍者”称号的优秀专业人士，也不能保证雇主能有效地利用他们。虽然这种风险在任何行业都存在，但由于许多原因，在网络安全公司尤为严重，包括高技术职业的隐晦性、技术的演进、领导层对员工更高级能力的认知或接触，以及无界限创造力对成功的重要性。为了表现良好并影响组织安全，员工需要领导层的认可，并可以在不担心惩罚或能力被直接破坏的情况下行使他们的技能。\n\
  \n网络安全专业最大的招聘者、雇主和培训者之一是美国军队，他们可以招募几乎完全不懂电脑的中学辍，并在 18 个月内将他们训练成能力出的网络战专家。当然，并不是每个招募人员都能通过培训，因为层层要求过滤掉了不合格的候选人——这种做法与《万叶之书》中描述忍者招募者的做法高度契合。^(8)\n\
  \n\n\n\n\n军事招募中一种独特的工具是武装军种职业能力评估测试（ASVAB）。与强调过去成就和专业资历的职场招募不同，ASVAB 评估的是征募人员的学习潜力、天赋和通用技术能力。测试得出的分数被用于将候选人分配到特定的专业领域，如果他们接受了成功培训，很可能在这些领域大放异彩。ASVAB\
  \ 对军事一直非常有效，但值得注意的是，某些网络安全工作报告其培训失败率异常高，且实地表现不佳，这可能是由于这些工作具有严苛的属性，而 ASVAB 并不总是能针对这些属性进行测试。在结构化的军事世界中，很难识别或培养那些想要用创意、无畏、独立且以问题为基础的思维来应对挑战的人——这种技能与黑客密切相关。\n\
  \n## 人才管理\n\n每个人都想为自己的组织招聘网络安全专业人员，但供应有限。那么，大家如何获得一些网络安全人才呢？组织首先应该确定是打算自己培养原始人才，还是与其他组织竞争有限的资深网络安全专家供应。下方的许多建议适用于培养人才，但也可能适用于混合方法。许多网络安全专业人员可能会认同许多网络安全专业人员可能会同意，现有的招聘方法是失效的，应考虑通过以下替代方案来招聘人才。\n\
  \n1. **开始使用实战评估。** 相比于面试，应通过结构化的测试、测试、白板测试、实战代码测试或家庭作业来评估候选人的专业技能。在招聘时，让候选人员在实际环境中进行操作并测试，以确保其符合要求。通过不断挑战、调节和培训，识别出符合要求的员工。根据\
  \ ASVAB 的测试结果，确保其在招聘和维护人才的实践中是完全合格的。\n\n2. 实施语言能力测试。** 某些网络安全工作具有 ASVAB 无法测试，让他们尝试黑客攻击或确保安全。这种方法类似于国防部的语言能力评估测试（Defense\
  \ Language Aptitude Test），以衡量候选人的能力：\n\n    * 快速学习新技术\n    * 使用逻辑和批判性思维解决问题\n  \
  \  * 在受规则限制的运营环境中实现目标\n\n3. **能够识别排除项。** 过去的学历、证书和推荐信并不总是能够准确描述一个人的性格；投入大量精力去识别那些未来可能做出错误决策的人。\n\
  \n4. **培训员工并建立卓越文化。** 技术技能可以教授，但其他属性需要巨大的努力来磨炼。通过不断挑战、调节和培训来识别员工。指导员工采取以下步骤：\n\n\
  \    * 每天努力解决日益复杂的网络问题\n    * 通过记忆训练、自律和练习来锻炼大脑\n    * 在遵循自设规则的情况下，通过创建有限的操作场景来学习技巧\n\
  \n## 建议的安全控制与缓解措施\n\n这些建议是结合 NIST 800-53 标准和 800-16 网络劳动力框架提出的。在评估将实施安全控制的潜在员工时，请考虑这些建议。\n\
  \n1. 定义执行组织网络安全职责所需的知识、技能和能力。在人才招募、招聘和培训期间解决这些需求——以及能力基准、员工技能和任务需求。\n\n2. 通过审查和记录所需的知识单元来定义网络安全职位的招聘要求，例如：\n\
  \n    * 高级网络技术和协议\n    * 数字取证\n    * 软件开发\n    * 合规性\n    * 计算机网络防御\n    * 配置管理\n\
  \    * 密码学与加密\n    * 数据安全\n    * 数据库\n    * 身份管理/隐私\n    * 事件管理\n    * 工业控制系统\n\
  \    * 信息保障\n    * 信息系统\n    * IT 系统与运营\n    * 网络与电信安全\n    * 人员安全\n    * 物理环境安全\n\
  \    * 架构、系统与应用安全\n    * 安全风险管理\n    * Web 安全\n\n3. 考虑以下培训、证书和协议：`OV-6`, `ANTP-*`,\
  \ `ARCH-*`, `COMP-1/5/9/10`, `CND-*`, `CM-*`, `CR-*`, `DS-*`, `DB-*`, `DF-*`, `IM-*`,\
  \ `IR-*`, `ICS-*`, `IA-*`, `WT-*`, `SI-*`, `ITOS-*`, `NTS-*`, `PS-*`, `PES-1`, `RM-*`,\
  \ `SW-*`, `SAS-*`。\n\n\n\n\n在本章中，我们回顾了忍者（shinobi）认为在其职业技能中取得成功所需的特质。此外，我们描述了忍者使用的某些后台访谈方法。我们还探索了现代组织使用的许多当前招聘流程，以及为什么这些流程没有预期中那样有效。我们列出了一些识别合适候选人的新方法。本章中的思维练习对于今天与当年需要雇佣忍者保护自己免受敌人忍者侵害的中世纪指挥官来说具有同样的相关性。雇佣可能没有良好\
  \ GPA 或坚实工作经历、或者不穿职业正装的类黑客人才，在反击网络犯罪分子方面可能比雇佣那些只会按规矩办事的人更有效。\n\n一旦你雇佣了这些才华横溢和或有技能的防御者，建立标准和流程就变得非常重要，以便他们以纪律的方式防御你的组织。如果没有设定明确预期的领导力，防御者可能会变得松懈，从而变得毫无价值。在下一章中，我们将讨论守卫室的行为。\n\
  \n# 24 守卫室行为\n\n即使你没有面对敌人，也不要掉以警惕。\n\n> 在守卫室内，警告不要大声说话、喝酒、唱歌、嫖妓或赌博。\n>\n> —白木森百周（Yoshimori\
  \ Hyakushu）#65\n\n忍者的卷轴充满了关于如何绕过目标安全人员的细节。对于在野外的忍者来说，没有任何防御障碍比敌人的守卫更紧迫——或更复杂。虽然卷轴指示忍者在守卫无法监控或容易保护的盲区工作，但最易利用的漏洞并非源于糟糕的军事策略或人力短缺，而是源于守卫的疏忽和缺乏纪律。\n\
  \n卷轴建议寻找那些明显疲劳、懒惰、组织混乱、不通忍者技巧或自满的守卫。评估和利用守卫能力的方法有很多。除其他技术外，《万战之书》还建议：\n\n*   在守卫附近低声耳语以测试他们的注意力，然后监控他们的反应至少一小时，以衡量他们的应对方法和能力\n\
  *   识别根据隐藏守卫信号行动的疏忽守卫，揭露嵌入防御者的存在，例如听觉或嗅觉侦察兵\n*   针对守卫大声说话、不停交谈或过度饮酒或派对的守卫室，这一切都表明缺乏经验或疏忽\n\
  *   等待或引发迫使守卫离开岗位的事件\n\n同一份卷轴还建议忍者观察守卫的行为、移动、举止和动作，以推断更多关于他们纪律的信息。例如，如果城堡的护河和周围边界保持整洁、畅通且照明良好，那么守卫可能很警觉并践行防御卫生。但如果众为人知的城堡入口（如墙角、溢洪道和污水口）没有受到保护，这可能是守卫或其指挥官忽视职责的迹象。\n\
  \n渗透敌方的守卫室为忍者改进自身防御中的守纪律、行为和能力提供了关键见解。同样，卷轴将守卫的疏忽和懒惰视为成功防御的最大障碍，并将克服这些恶习的责任归于领主或指挥官，他们严格的纪律、刻苦的训练和对细节的彻底关注，可以赋予守卫抵御敌人威胁（包括其他忍者）所需的心理韧性。忍者诗中说：“每一件事都取决于你自己的大脑和你的思考方式。‘如果你总是假设自己正面对敌人，你就永远不会以任何方式放下警惕。’”\n\
  \n在本章中，我们将对比忍者时代的守卫室与今天的安全运营中心（`SOCs`）。我们将触及安全的现代化趋势，这种趋势将安全责任从仅限安全人员转移到了所有员工。我们将回顾外部威胁攻击者可以通过何种方法检测网络上糟糕的安全控制/实践。此外，我们还将介绍一些关于安全人员与对手之间直接交互的理论——特别是当对手能够渗透\
  \ `SOC/IR` 工单系统时——以及关于对手可能如何判断 `SOC` 警觉性的其他想法。最重要的是，我们讨论了为什么安全人员的行为如此重要，为什么它会随时间而恶化，以及如何建立一种卓越的安全文化。\n\
  \n## 安全运营中心的问题与预期\n\n对于安全和 IT 人员来说变得懒惰、自满、疏忽、疲劳或职业倦怠是非常容易的。为什么？有许多原因。\n\n其中最大的原因之一是人性的一种不幸的现实：如果没有人在盯着，许多工作者就会玩职守。懒惰的安全专业人士有充足的掩护。他们的任务对同事——甚至是主管在很大程度上是不可见的。许多运营中心位于锁上的门后面，员工可以在那里工作、放松甚至睡觉而无人知晓。他们的网络和机器位于独立的\
  \ `VLAN` 或“研究”箱上，允许他们在不受记录、检查或过滤的情况下浏览互联网。\n\n行业对流程的过度依赖也可能让员工陷入疏忽或自满。通过程序的重复，安全人员会产生熟悉感、习惯以及对如何防御组织的狭隘想法。虽然这种倾向源于日常工作的常规，但它也导致了高度专业化的单一工具或单一方法防御者，他们不考虑自身经验范围之外的攻击技术和工具。这种局限的心态给组织留下了巨大的安全漏洞。\n\
  \n进取的员工面临着相反的问题。对于他们来说，在一个要求深度专业知识、能力和野心的竞争性领域工作增加了职业倦怠的风险。在花费了数月时间搜寻威胁和事件后，很容易失去注意力，依赖已知概念，等到出现安全系统或软件警报时才行动，或者只学习在报告或修复特定安全事件时必需的知识。\n\
  \n网络安全专业人士不是计算机素养和安全意识的唯一裁决者；所有员工共同承担这一责任。不幸的是，这意味着非技术员工的懒惰和疏忽往往对组织构成了比恶意外部攻击者更大的安全威胁。这些员工可能会因为粗率地点击钓鱼邮件或插入在停车场发现的外国\
  \ `USB` 盘而在无意中使公司的网络或系统暴露于威胁之中。如果管理层在适当时不执行安全警觉和纪律，那么尽职的员工就被迫在一个疏忽员工横行甚至可能获得奖励的文化中运作。\n\
  \n\n\n领导层的认可和能力可以显著提升员工的士气和安全警惕性；相反，糟糕的领导决策或组织策略可能会削弱安全态势并损害员工信任。改进防御盲点或弱点的尝试通常需要跨部门合作、共享预算、周末加班，以及可能导致员工抱怨和抵制这些倡议的不便。结果是，精疲力竭、备受挫败的安全工程师会对安全改进产生怀疑态度，并对现有的缺陷视而不见。有些人甚至可能等到事件发生，因为他们知道组织的被动式安全态势意味着，除非先发生坏事，否则他们将不会允许进行改进。\n\
  \n攻击者很容易从外部可观测的指标评估组织的安全警惕性，例如：\n\n*   通过网站上的错误消息泄露过多信息\n*   登录时泄露密码策略详情\n*   缺乏安全策略头部内容\n\
  *   使用不当的自签名证书\n*   配置错误的电子邮件基于域的消息身份验证、报告和合规 (`DMARC`)/发送者策略框架 (`SPF`)\n*   配置不当的\
  \ `DNS` 记录\n*   在面向互联网的服务器、安全设备或网络硬件上暴露了管理接口\n*   泄露技术版本或使用的安全措施\n\n为了对抗缺乏警惕的倾向，防御者必须不断进行自我评估并努力改进。虽然经理并不总是赞扬或奖励实施额外安全措施的工作，但持续的警惕向对手传递了一个信息：组织的第一道防线是坚强的，并暗示内部防御可能更加强大。\n\
  \n## 影响行为\n\n员工在工作场所的表现受其自身信念、工作文化以及长期学习经验形成的条件的影响。通过有选择性地强化行为和实施有意义的工作-反馈循环来塑造工作文化，将鼓励员工追求卓越。缺乏反馈（尤其是正反馈）可能是安全领域中最难解决的问题之一，因为防御者的行为很容易滑入低能量的、由于得得无失的安全虚无主义状态。这可能源于对良好行为缺乏正强化。表现未能体现其行动的效用。良好表现的结果（如阻止对手掠夺组织的知识产权或金钱）可能需要多年才能显现，因此难以在此基础上建立。以下列出了如何改进和维持良好安全行为的指导。\n\
  \n1.  **设定标准并培养你的文化。** 美国国防部 (`DoD`) 培养了一种优先考虑安全警惕的文化。`DoD` 员工离开其他组织，在新的工作场所遇到安全疏忽时，经常描述经历了文化冲击（遗憾的是，他们最终降低了自己的标准，接受了新文化）。审查\
  \ `DoD` 的“网络安全文化与合规倡议” (`Cybersecurity Culture and Compliance Initiative`)，并确定其哪些元素可以帮助你的组织建立安全警惕文化。一些可以明确提出的可能属性包括：\n\
  \n    *   **诚信 (Integrity)**：鼓励员工在错误发生时进行报告。例如，不小心破坏网络安全的员工不应该因为担心丢工作而需要隐藏事件。相反，他们应该感到足够安全来承认错误并帮助组织加固安全漏洞。\n\
  \    *   **能力 (Competence)**：为所有在网络空间操作的人建立基准教育标准。这些标准应指导所有员工的日常行为，赋予人们识别安全风险的能力，并通过持续的网络安全教育促进明智决策。注意，为你的组织建立核心能力可能意味着防止那些未证明能力的人担任某些职位。\n\
  \    *   **专业精神 (Professionalism)**：为了保持卓越标准和警惕文化，要求员工对自己的工作负责，不走捷径。\n    *   **质疑态度\
  \ (Questioning attitudes)**：聘用那些不接受现状，而是对观察结果进行质疑、分析和解释的人。确保员工感到可以直言，而不会被迅速驳回或感到愚蠢。\n\
  \n2.  **执行纪律。** 安全疏忽影响的不仅仅是一个人的工作表现或产品。它让让整个组织处于风险之中。`Bansenshkai` 的“守卫室行为六点”指出：“必须遵守严格规则，对于不警惕的人，应受到严厉惩罚。”建立正式程序来识别并惩罚用户、安全人员、IT\
  \ 人员的违规行为。避免在发生安全事件时将其咎于首席信息安全官 (`CISO`)或其他人员，这样做会破坏每个人都负责的文化。\n\n3.  **建立正式流程、程序和合规。**\
  \ 识别、记录并发布你希望安全团队遵循的任务、规则和政策。确定衡量员工是否遵守这些标准的方法。避免使用浅浅的关键性能指标 (`KPIs`)，例如提交了多少工单或调查了多少安全事件，因为这些指标无法客观衡量工作。建立理解并关心安全、投入时间建立警惕并识别违规行为的领导层。\n\
  \n4.  **驱动主动性和和参与感。** 许多员工在工作中没有参与感。他们不参与决策，不为了组织的利益行动，对公司的成功（或自己的成功）缺乏投入。无聊是安全领域的一个常见问题——通过消除阻碍或抑制员工采取积极安全行动的障碍通常可以缓解。通过允许以下操作赋予安全人员能力：\n\
  \n    *   尝试新的安全控制、常规流程和概念\n    *   学习新技术、技术和工具\n    *   在工作中找到意义\n    *   获得积极结果，例如职业发展或晋升路径\n\
  \    *   参与战略决策\n    *   进行蓝队、红队（例如红蓝对抗）或其他模拟和演练，以便他们相互提供积极投入\n    *   庆祝发现安全漏洞的成功\n\
  \n## 建议的安全措施与缓解\n\n在相关情况下，建议附带了 `NIST 800-53` 标准中的适用安全措施。每项措施都应结合守卫室行为的概念进行评估。\n\
  \n1.  为所有员工制定、记录并提供安全培训、程序和行为规则。为具有重大安全责任的角色（如开发、IT、安全和领导职位）创建特定的培训和程序。对于违反安全政策和程序的行为执行严格的纪律措施。`[AT-1:\
  \ 意识与培训政策与程序; AT-2: 意识培训; AT-3: 角色培训; IR-2: 应急响应培训; PL-4: 行为规则; SA-16: 开发者提供的培训]`\n\
  \n\n\n2. 通过专门的安全评估、扫描、渗透测试和红队对抗，对安全响应能力、态势和工具能力进行基于性能的测试。此类活动可以识别出未遵守的流程或程序、安全盲点以及警惕性的员工。`[CA-2:\
  \ 评估 | (2) 专业评估; CA-8: 渗透测试; IR-3: 应急响应测试; RA-5: 漏洞扫描; SC-7: 边界保护 | (10) 渗透测试; SI-4:\
  \ 系统监控 | 监控工具和机制测试; SI-6: 安全与隐私功能]`\n\n3. 创建培训计划和练习，不断提高安全人员的知识、技能组和能力。`[CA-8: 渗透测试;\
  \ IR-3: 应急响应测试 | (3) 持续改进; PM-12: 内部威胁计划; PM-13: 安全与隐私工作人员; PM-14: 测试、培训与监控; PM-16:\
  \ 威胁意识计划]`\n\n4. 允许安全人员决定应该更改哪些配置和控制以提高安全性。将责任交给系统所有者、维护者和开发人员，要求他们提供强有力的基于证据的论点，说明为何无法实施安全人员的建议。`[CM-3:\
  \ 配置变更控制]`\n\n5. 执行处理安全人员投诉的策略和流程。这种反馈通过修订或撤销不当控制帮助安全改进流程。它还为用户提供了一种识别安全担忧并警示安全人员的方法，无需担心报复。`[PM-28:\
  \ 投诉管理]`\n\n6. 要求安全人员执行操作安全（OPSEC），以保护关键运行、配置和部署信息，同时注意不要向可能测试安全防御的敌人泄露操作安全。`[SC-38:\
  \ 操作安全]`\n\n## 总结\n\n在本章中，我们查看了忍者（shinobi）如何侦察守卫和哨所，并根据其目标的安全标准（或缺乏标准）来评估渗透机会。我们回顾了数百年前，像今天一样，守卫在职责上产生大意心理如何是常态，以及高超的渗透者是如何利用这种疏忽的。此外，我们触及了文化如何塑造组织的自卫能力；这一概念在忍者哲学中具有至关重要的地位。随后，我们将忍者文化与现代\
  \ SOC（安全运营中心）和信息安全工作文化进行了比较，这些文化存在今日网络攻击者可能利用的问题。我们还描述了建立和维护卓越安全文化的几种方法和最佳实践。\n\n\
  在下一章中，我们将讨论忍者的“陌生人危险”（stranger danger）原则——即不允许任何可疑人员靠近。重复这一信息以建立安全文化，同时实施严格的控制以防止可疑事件变成恶意，是组织安全卓越的体现。\n\
  \n# 25 零信任威胁管理\n\n如果你从后方进入房间，如果房间里有人没有睡觉，那么他们就不会怀疑你是入侵者。因为从后方来的人不被认为是可能的小偷或攻击者。\n\
  \n> 你永远不应该允许来自省份之外的人靠近哨所，即使他们是你的亲戚。\n>\n> —Yoshimori Hyakushu #93\n\n在封建日本，旅行商人、僧侣、祭司、表演者、艺人、乞丐和其他外部人士在活跃的军营或城堡附近活动是常态，因为驻营士兵频繁使用他们的服务。^(1)\
  \ 然而，这些外部人士中某些人是受雇为敌人收集信息的秘密特工。^(2)\n\n《万忍书》描述了忍者如何阻止可疑活动，该卷轴警告说，不应允许任何人进入城堡。^(3)\
  \ 在这些严格的白名单条件下，攻击者在尝试突破组织之前，必须先渗透信任伙伴。^(4) 此外，《万忍书》建议忍者帮助受信任的商人加固他们的小屋和商店以防御火灾或意外。^(5)\n\
  \n在本章中，我们将回顾“仅阻止恶意”模式——这种模式可能会变成对显示为恶意的新域名、IP 和文件的无尽追逐。我们将探索许多组织选择追逐这种永无止境的威胁而不是采用“阻止所有可疑”模式的原因。我们还将概述处理技术问题的策略。\n\
  \n## 威胁机会\n\n从网络安全的角度来看，想象营地是你的组织，而边界之外的商人、艺人和其他所有人都是互联网上可用的许多外部服务和应用程序。所有帮助员工完成工作的与外部网站的合法业务互连——更不用员工在休息期间查看的新闻、社交媒体和娱乐网站了——都允许可疑实体连接到你的组织。寻求初始访问、交付和利用的攻击者通常需要这些外部通信能力在不受挑战、不经检查且不过滤的情况下运行。他们随后的攻击战术包括对员工访问的网站实施“路过式”攻击，向你的员工发送带有链接和附件的针对性网络钓鱼邮件，从不可信的\
  \ IP 对你的环境进行网络扫描，以及使用命令与控制（C2）站点获取信息并向受感染机器上的恶意植入程序发送指令，这仅是其一。\n\n为了应对这些攻击，网络安全行业已经建立了功能性安全控制、策略和系统，对与已知且信任的关联、伙伴和其他经过验证的第三方业务实体的适当通信进行白名单。组织可以创建域名、IP\
  \ 段、名称服务器、电子邮件地址、网站和证书机构的白名单，允许员工仅与信任伙伴进行通信，反之亦然。在这些严格的白名单条件下，攻击者在尝试突破组织之前，必须先投入时间、资源和精力来渗透信任伙伴。\n\
  \n然而，虽然技术问题已经解决，但人为问题仍然存在。通过外部关系以及娱乐和新闻寻求刺激是人性的本能。因此，对于管理层来说，执行“阻止可疑”策略具有挑战性，因为这需要意志来领导组织各个部分发生大的文化和行为变革。\n\
  \n\n\n例如，假设你注意到机构的大部分互联网流量均来自员工在娱乐网站上的流媒体视频。你注意到这些活动不符合他们的工作职责，因此你决定使用第 7 层检测工具阻止所有主要的娱乐网站进入你的网络。\n\
  \n虽然这种合理的措施符合你的业务需求，甚至可能已经记录在 IT 策略中，但许多经历过这一过程的组织都已对此表示 Reg 悔。员工可能会抱怨或向你施加社会压力，要求解封违规流量，某些人甚至会尝试通过加密或隧道技术、代理规避或访问包含类似内容但避开你过滤器的娱乐网站来绕过该策略——这将使你的网络和系统面临更大的风险。\n\
  \n一种流行的解决方案是提供一个非业务性的互联网——或者一个自带设备（BYOD）网络——让员工可以在他们的个人设备上流媒体视频。你甚至可以设置独立的机器，供员工在进行互联网研究和休息时使用，但不用于业务功能。美国国防部（DoD）就使用了这种方法，为员工提供了一个独立的、用于非机密互联网访问的专用系统（`NIPRnet`）；网络在物理和逻辑上隔离了该系统以进行信息流控制。国防部在\
  \ `NIPRnet` 上采取了进一步措施，将所有已知的非恶意互联网资源加入白名单，并拒绝其认为可疑或至少是不必要的的大 IP 段和 ASN。\n\n在过去的十年或更久以来，组织一直在不断消耗已知恶意\
  \ IP、域名和 URL 的威胁馈，因此阻止已知的 `malicious`（黑名单）是容易的。阻止 `suspicious`可以防止未知的恶意流量渗透，但对于组织来说要困难得多，通常出于正当理由。要创建一个包含你确定员工将使用的所有已知安全互联网资源、网站和\
  \ IP 的主白名单可能是极其困难。再次，国防部是一个理想的实践者，因为该机构主动制定了阻止和防止这些威胁情景的策略。它还不断提醒员工——通过 OPSEC 海报、强制性培训、系统使用条款和清晰的系统警告标签——不要绕过其策略或控制，因为这样做可能会损害网络、系统和信息安全。\n\
  \n## 阻止可疑流量\n\n“陌生人危险”是许多孩子在年幼学习的简单概念。通过对任何陌生人的接近零容忍，可以避免对儿童的潜在威胁。陌生人危险并非完美的策略，但它是有效的，前提是任何已知实体（非陌生人）已被验证为可信的。这种策略的优势在于，它不依赖额外的安全层来响应此前被识别为可疑的威胁。因为一旦恶意威胁被允许与其互动，儿童和许多组织就失去了防御，因此应用“阻止所有可疑流量”的安全策略可能是他们获得的第一道也是唯一的防御。下面列出了如何在你的环境中应用这些概念的指导。\n\
  \n1. *练习识别、意识和理解。* 向利益相关者演示必须阻止可疑网站的这一观点。一个良好的起点可能是对伊朗、北朝鲜（`175.45.178.129`）或对你组织已知但不太可能的威胁的服务器进行\
  \ `ping` 或执行外部 DNS 查询。如果你收到成功的响应，说明你的网络允许你在没有有效业务理由的情况下与可疑系统通信。这种网络探测通常有效。组织倾向于“阻止恶意”而非“阻止可疑”，因为没有已知\
  \ IP 在这些国家的互联网空间托管过恶意软件或进行过攻击，它们没有被放在已知的恶意威胁馈中。\n\n现在你已经有了应该被阻止的内容的证据，你的组织可以阻止该单个\
  \ IP，如果你向安全团队请求防火墙更改，则可能阻止它所属的网段（`/24`）。然而，请注意，超过 1430 万个 IPv4 `/24` 子网需要评估和阻止，自然，你的组织可能没有时间、意愿或资源来执行全面覆盖互联网的阻止可疑列表。与其采用那种方法，不如开始记录白名单，并理解这将产生误报但也会阻止恶意、可疑以及未来/未知的恶意。\n\
  \n2. *加入或创建信息共享分析中心（ISAC）。* 为了减轻创建主白名单的负担，加入或创建一个 `ISAC`，与同行业的其他公司共享他们用于业务功能的可信网站、IP\
  \ 和域名。对于开发主白名单的企业来说，这可以使网络更容易构建和维护。\n\n3. *寻求相互保证。* 对与组织有业务关系的外部实体进行相互漏洞扫描和红队测试；这种方法符合\
  \ `Bansensukai` 的建议，即帮助信任的商建筑防火。此措施适用于信任外部网络、具有直接连接或使用其他绕过安全控制的直接隧道技术的组织。\n\n##\
  \ 建议的安全控制和缓解措施\n\n在相关情况下，建议将来自 NIST 800-53 标准的安全控制措施提出。每项措施都应根据阻止可疑流量的概念进行评估。\n\n\
  1. 实施自带设备（BYOD）策略，以便用户出于非业务原因连接互联网，或为员工提供用于外部连接的附加工作站。[[CA-3: System Interconnections\
  \ | (1) 非机密安全系统连接; SC-7: Boundary Protection | (1) 物理隔离子网络]`\n\n2. 对于入站和出站连接，建立除非例外外全部拒绝的白名单。[[CA-3:\
  \ System Interconnections | (4) 连接到公共网络 | (5) 外部系统连接限制; SC-7: Boundary Protection\
  \ | (5) 默认拒绝——例外允许]`\n\n3. 与类似组织共享信息以创建白名单。[[PA-4: 与外部共享信息]`\n\n## 总结\n\n在本章中，我们研究了防御忍者如何采取安全策略使敌人忍者的工作变得困难。我们还讨论了现代组织采取类似策略有多困难，包括组织尝试类似网络安全方法时需要克服的挑战。我们探索了如何将“阻止可疑”概念作为指导的多种想法。\n\
  \n在下一章中，我们将结合之前章节中学到的概念，以将其应用于威胁情报。最后一章是全书的总结，将你学到的关于忍者的知识与在之前的章节中遇到的真实网络威胁联系起来。\n\
  \n\n\n\n> 即使外面有嘈杂声，也要意识到守卫室不能完全空着。此外，你应该倾听任何动静。\n> —白首百集 #66\n\n虽然忍者有时会被雇佣守卫城堡和其他防御工事（如《庄类绪记》^(1)\
  \ 中描述），但在封建时代的日本，非忍者士兵或雇佣兵——即训练用来击退普通入侵者的战士——占据了大多数守卫站点。但《万人相略》和《军法事用集》手册建议防范忍者的指挥官雇佣自己的人员，因为这些战士可以训练普通守卫来识别忍者的秘密战术、技术和战术动作规程（TTPs）。^(2)\
  \ 尽管卷轴中描述了许多内容，但 TTPs 一直在不断开发和完善，不同的氏族拥有其他忍者所不为人的秘术。\n\n忍者的 TTPs 巧妙且优雅，并且通常具有多重用途。例如，忍者可能会秘密地在地上插一把普通的雨伞，并在城堡守卫的视范围内将其打开。忍者不仅可以将物品放在伞下躲避守卫的视线，而且明显的人类活动迹可能会引诱守卫离开岗位。^(3)\
  \ 这种技术还利用了当时盛行的迷信：认为遗忘或丢失的雨伞会附灵并骚扰它们的前主人，这种现象被各种称为“付神”（tsukumogami）、“伞怪”（kasa-obake）和“妖怪”（yokai）。^(4)\n\
  \n被雇佣来指导守卫的忍者面临着独特的教学挑战：记录 TTPs 或与外人分享是禁忌或完全禁止的，因为这样做会损害技能的完整性并危及其他忍者的生命。卷轴中的某些章节甚至建议杀死任何发现\
  \ TTPs 的观察者或受害者。^(5)\n\n因此，忍者并没有提供具体的技巧，而是强调采取正确的态度、保持高水平的警觉性，并进行捕捉忍者所需的审查程度。^(6)\
  \ 这种心态通过对守卫营地、敌方情况以及敌人可能部署的最有可能且影响最大的威胁场景进行风险评估得到了加强。忍者似乎确实为守卫提供了关于忍者行动能力的通用感知以及不同威胁场景的示例，但可能在描述方式上没有完全透露商业机密。^(7)\
  \ 他们教导守卫识别潜在忍者活动的指标——在巡逻时要寻找的视觉、声音和其他可观测迹——并制定了规则以避免错误。^(8)\n\n由于有无数种的技术需要学习，而且由于许多接受训练的守卫缺乏正式教育，忍者通过诗歌来传递知识，使信息更容易记忆。（这解释了为什么在《白首百集》的“百首忍者诗”中发现了大量关于守卫警觉的诗歌。这些诗并不是为了忍者本身，而是为了让忍者将其传达给守卫。）同样，诗歌提供的细节足以描述忍者的战术，并提供了现实的指导，但又不至于让信息淹没守卫。例如，诗歌\
  \ 66（在本章开头引用）提供了直接的建议：不要让你的岗位空着，并倾听任何声音，包括但不限于最初引起注意的嘈杂声，例如从后方靠近的脚步声。^(9) 这些诗歌按主题分组。诗歌\
  \ 64–67、78、79、91、93 和 94 都涉及了保持警觉和避免失误的示例。示例包括疲劳时如何进行夜巡；面对哪个方向；以及为什么在值班期间喝酒、唱歌和招嫖妓是坏主意。\n\
  \n当然，如果敌方忍者观察到守卫正在积极寻找忍者 TTPs，那么敌人就会部署应对措施。出现在三部主要卷轴中的一个明显例子涉及忍者躲在灌丛或高草中，或在田间爬行。忍者的活动扰动了周围的昆虫，它们会冻结并保持安静以隐藏自己。对于训练过的守卫来说，没有嗡嗡声、鸣叫声或叫声意味着一个隐藏的人正在靠近。通常，如果守卫突然警觉并开始寻找入侵者，而忍者知道自己已经暴露，忍者就会悄悄撤退。^(10)\
  \ 这就是应对措施发挥作用的地方。在下一次尝试之前，忍者在盒子里捕捉了一些蟋蟀。蟋蟀对携带它们的忍者出现并不感到困扰，自由地鸣叫，填补了忍者靠近守卫室周围的任何沉默。守卫们现在没有理由怀疑忍者的接近了。^(11)\n\
  \n诗歌 68 生动地描绘了 TTP 检测和应对措施的挑战：“你应该进行彻底的搜索，跟在夜逻队伍后面。这被称为*镰击付*（kamaritsuke）[伏击探测]。”^(12)\
  \ 晚上，指挥官会派遣一支主搜索队携带通常的灯笼和其他设备巡逻外围，但领队会在主队伍的后方派遣一支秘密搜索队紧随其。^(13) 外围巡逻的守卫被他们的忍者顾问告诉要寻找任何异常之处——特别是声音、动作和人员。^(14)\
  \ 敌方忍者对这些指导也了如指掌。卷轴描述了攻击性忍者如何在巡逻队通过时躲在灌丛、沟壑或其他地方。^(15) 然而，在某些情况下，敌人可能会跟随巡逻队，利用防御者的声音和光线掩盖行动；渗透者甚至从后方攻击巡逻队。^(16)\
  \ 因此，在巡逻队后面增加第二支队伍可以抓到忍者。这支全武装士兵会搜索可能的藏身点，并对跟随巡逻队的敌人保持警惕。^(17) 然而，作为应对的应对，知晓*镰击付*技术的攻击忍者可能会在影子中等待第二支巡逻通过，或者移动到第二支巡逻不会搜索的地方。为了对抗这种应对的应对的应对，增加了诗歌\
  \ 69 和 70：^(18)\n\n1. 69：“在夜逻进行后，反复进行*镰击付*是非常重要的。”\n2. 70：“在执行*镰击付*时，据说你应该间隔进行多次巡逻，以便发现敌方的忍者特工。”\n\
  \n这种指导鼓励了不规律的*镰击付*巡逻，以干扰敌人自由行动的能力。频繁且半不可预测的、有一支或多个跟随镰击付队伍的巡逻，让敌方忍者对城堡或守卫巡逻队执行执行行动的机会极少。^(19)\n\
  \nTTP 检测和应对措施的尽力方法可能会迅速升级，但最终攻击城堡会变得太危险或不切实际。这通常是防御者面对敌人忍者所能获得的最好结果。\n\n\n\n\n在本章中，我们将讨论忍者战术（shinobi\
  \ tradecraft）背后的哲学如何适用于理解网络威胁者的 TTPs。我们将涉及网络威胁情报如何指导应急响应、安全工程师和威胁猎人，使他们能够更好地防御自己的组织，就像忍者能够通过情报驱动的防御来提高普通城堡守卫和士兵的效能一样。我们将探索几个用于描述网络威胁\
  \ TTPs 的主流框架。将这些框架与忍者的知识相结合，可以更容易地理解威胁本身以及为什么 TTPs 很有用。我们将介绍为什么 `TTPs` 中的 `P` 往往是一个谜，并且很可能保持未知，但我们还将根据我们对忍者行动方式的了解，对理性对手者可能会采取的程序进行理论假设。最后，我们将探索如何将网络威胁情报整合到组织防御策略中的指导，并触及为什么这样做会如此困难。\n\
  \n## 技术、战术与步骤 (Techniques, Tactics, and Procedures)\n\n在网络安全领域，TTPs 描述了分析特定威胁者或小组的行为模式、活动和方法的方法。`Tactics`（战术）描述了攻击者的操作策略，例如侦察、横向移动和后门部署。`Techniques`（技术）是攻击者用于完成任务的详细技术方法，例如使用特定的工具或软件来执行武器化或利用。`Procedures`（步骤）详细说明了要执行的标准策略和行动方案，例如在执行额外任务之前，确认被利用的目标系统是否有活跃的登录用户；在部署恶意软件之前通过字符串分析运行恶意软件以检查是否存在战术性错误；或在验证目标机器的连通性后实施预防性的自动清理。\n\
  \n一旦识别并定义了 TTPs，防御者就可以在他们的环境中搜索它们的指示器。他们甚至可以预测哪些 TTPs 可能会被用于针对他们，以支持规划和实施先性的缓解措施或反制措施。为了建立并传达网络攻击者\
  \ TTPs 的通用定义，业界开发了多种概念、模型、分析方法和共享方法，包括：\n\n*   `Pyramid of Pain`（痛苦之字塔）\n*   `ATT&CK™\
  \ framework`\n*   `Attack LifeCycle model`（攻击生命周期模型）\n*   `Cyber Kill Chain framework`（网络杀伤链框架）\n\
  *   `Diamond Model of Intrusion Analysis`（入侵分析钻石模型）\n*   `STIX (Structured Threat\
  \ Information eXpression)`\n\n### Pyramid of Pain (痛苦之字塔)\n\n痛苦之字塔（见 `Figure 26-1`）是一个可视化对攻击者指示器、工具和\
  \ TTPs 的感知如何影响防御者安全态的卓越模型。它还展示了实施措施和反制措施的难度对于防御者和攻击者来说是如何增加的。\n\n痛苦之字塔的名称是指：虽然没有办法可以保证绝对的安全或防止所有攻击，但如果你让攻击者花费时间、资源和精力变得极其痛苦，他们就不太可能针对你的组织。\n\
  \n![Figure 26-1: Fortification of indicators of compromise (adapted from David Bianco’s))](img/f2601.png)\n\
  \n金字塔底部是入侵指标（`IoC`）——例如 `domains`、`IPs`、`file hashes` 和 `URLs`。在原子指示器之上是 `host-based\
  \ indicators`（基于主机指示器），例如 `registry keys`、`dropped files` 和 `artifacts`。下一层是 `tools`（工具）——攻击者操作的软件或设备。金字塔的顶部是攻击者的\
  \ `tactics`（战术）、`techniques`（技术）和 `procedures`（步骤）。如果你能够识别并缓解这些，对攻击者来说就会变得困难。\n\n\
  ### ATT&CK Framework\n\nMITRE 的对抗性战术、技术和常见知识（`ATT&CK`）框架许多战术源自洛希德·马丁的 `Kill Chain\
  \ framework`（见 `Figure 26-2`）。杀伤链框架概述了七个阶段：`reconnaissance`（侦察）、`weaponization`（武器化）、`delivery`（交付）、`exploitation`（利用）、`installation`（安装）、`command\
  \ and control`（命令与控制）和 `actions on objectives`（目标行动）。注意，ATT&CK 框架中缺少了 `Procedures`（步骤）。ATT&CK\
  \ 框架中识别的每种战术都列出了技术及其示例，这些描述了威胁小组的 `procedures`。\n\n### Threat Intelligence (威胁情报)\n\
  \n当你的安全团队理解了这些战术和技术——并识别了攻击面、评估了当前的控制措施、并对先前的事件进行了分析——就可以开始预测攻击者可能针对哪些位置。有了良好的威胁预测，你就可以开始威胁猎寻——寻找攻击者留下的指示器和证据。\n\
  \n![Figure 26-2: Ninja attack chain (adapted from MITRE’s))](img/f2602.png)\n\n\
  然而，如果不深入了解攻击者的具体方式，很难有效地猎寻或检测他们的存在。\n\n在这里，威胁情报展示了它的价值。`Threat intelligence` 并不意味着与恶意软件、攻击基础设施或威胁小组相关的\
  \ `IPs`、`domains`、`URLs` 和 `file hashes` 等列表馈。相反，`cyber threat intelligence (CTI)`\
  \ 指的是收集和分析恶意软件、黑客主义、国家支持、犯罪、DDoS 攻击等网络威胁的传统情报。在正确消费时，CTI 提供关于威胁正在做什么、其动机和 TTPs 的可操作情报和评估。简单来说，CTI\
  \ 是有效理解和防御威胁的最佳方式之一，因为它要求决策者获取信息并采取防御行动。\n\n遗憾的是，许多 CTI 消费者只关注 `IoCs`，因为它们可以很容易地摄入\
  \ `SIEMs`、`firewalls`和其他安全设备以阻止或检测威胁。这种操作方式抵消了 CTI 的真实价值，因为 CTI 分析师的详细观察和评估描述的是行为、模式、方法、归属和背景。\n\
  \n\n\n当然，在意图理解威胁的同时对你的环境建立深度理解，并消耗情报报告是一项具有挑战性的任务。这一过程需要广泛的技能组合——包括快速学习和做出战略决策的能力。但如果一个网络威胁情报（CTI）受用者能够投入时间来理解威胁的每一个步骤、代码、战术和技术，他们就可以做出决策，从而成功地缓解、检测、响应，甚至预测未来的威胁动向。\n\
  \n## 网络威胁情报\n\n在已经购买了数十种安全解决方案并聘佣了全职安全人员来处理众多威胁向量后，有些人可能将 CTI 视为为他们本已是“深度防御”的安全模型添上的最后一层成本支出。然而，CTI\
  \ 可能会让你改进安全策略，并放大所有其他安全层的效性，从而证明其成本的价值。遗憾的是，在许多情况下，有效使用 CTI 类似于阅读某个领域最新科学发现的报告，因为这要求你理解发现的意义，并据此快速改变文化、业务策略和技术。虽然这是可能的，但这种消耗、合成和行动的强度似乎要求过高。这是\
  \ CTI 面临的最大挑战：它不是一个提供易于遵循的简单答案的水晶球。请查看以下指南，以对你的 CTI 程序做出明智决策。\n\n1. **开发网络威胁情报和威胁猎寻。**\
  \ 考虑让组织订阅免费或付费的 CTI 报告。此外，开始通过收集正在攻击你环境的威胁证据来开发你自己的内部 CTI。建立一个 CTI 团队来收集、分析发现及结果，并将这些发现报告给\
  \ IT、安全和业务利益相关者。这些人员应该了解谁在针对该组织、他们是如何渗透的、进入网络后将做什么、他们的假设目标，以及他们如何执行这些目标。在你的信息系统中实施战略和业务安全防护、缓解和对抗措施，以防御观察到的特定战术。\n\
  \n训练你的安全和情报人员进行威胁猎寻。因为并不是每个威胁都能通过工程手段进行拦截，因此专门的猎寻团队必须在 CTI 合作伙伴、供应商或团队的情报指导下，不断在网络中搜索威胁痕迹。威胁猎寻可以通过红蓝演练来增强，在演练中红队在你的网络上执行对抗活动，而你的蓝队试图猎捕他们，从而学习如何对抗威胁。\n\
  \n2. **消耗并利用 CTI。** 与你的电子邮件、IT 和安全团队一起进行桌面演习，模拟威胁的 TTP 并评估你的反应。例如，假设你收到情报，某场钓鱼攻击正在针对使用\
  \ Google 链接缩短器（`http://goo.gl/`）的你这样的组织。你无法在不影响业务运营的情况下直接屏蔽 Google 的 IP、URL 或域名，而且许多组织员工出于合法目的使用链接缩短器。你的\
  \ CTI 评估认为，攻击者可能使用 `goo.gl` 链接是因为你的杀毒软件、代理或钓鱼协议没有正确地将其评估为恶意。安全系统识别出 Google 是一个白名单网站。\n\
  \n首先，尝试在现有的邮件中猎寻该链接的证据。许多组织在此处遇到首要障碍，因为他们的电子邮件管理员不配合，或者没有必要的可见性或资源来搜索包含 `goo.gl`\
  \ 超链接的入站邮件。额外的障碍可能包括隔离潜在的钓鱼邮件、向非 IT 和非安全人员警威胁的存在，并培训他们如何检测和避免这种威胁。\n\n正如攻击者拥有不同的工具、战术和技术来针对你的组织一样，你自己的工具也需要深思、理解、独创和工程设计，才能以整体、有效的方式屏蔽并响应威胁。例如，你的电子邮件管理员可能会创建一个规则来检测\
  \ `goo.gl` 链接缩短器，但其他人呢？希望你的 CTI 团队能够识别出这种带有链接和链接缩短器的钓鱼威胁，并推荐检测、屏蔽或缓解这些链接的方法。此外，团队应该让你组织中的人员意识到这种\
  \ TTP。换句话说，他们不仅要寻找 `goo.gl`，还要寻找所有的链接缩短器。最后，决策者必须从战略上解决这种 TTP 问题。\n\n## 推荐的安全控制和缓解措施\n\
  \n这些建议是考虑到 NIST 800-53 提出的。\n\n1. 为所有角色提供安全意识培训。`AT-2`\n2. 专门设立一个团队分析威胁和事件。`PM-13`\n\
  3. 与外部安全小组合作以接收情报。`PM-15`\n4. 实施威胁意识计划。`PM-16`\n5. 使用威胁情报猎寻活动。`SI-4`\n\n## 汇报总结\n\
  \n在本章中，我们回顾了若干种 TTP，特别是 `kamaritsuke` TTP 如何随着防御者和攻击者的对抗战术共同进化，直到产生韧性。我们讨论了网络威胁情报，以及为什么仅仅了解攻击者正在做什么、如何做以及他们将要做什么是不够的。为了发挥作用，CTI\
  \ 必须以某种方式解决威胁为目标进行消耗。在城堡理论思维练习中，我们看到了一个清晰的例子：防御者发现了一个观测点，随后针对威胁发生了战术转变。这种思维练习可以比比伪造系统/网络日志以欺骗威胁猎寻者、异常检测器甚至机器学习系统——它在现代可能会再次出现。本章——也许甚至是整本书——最重要的教训是：消耗威胁情报并以创新的方式应对动态威胁至关重要。\n\
