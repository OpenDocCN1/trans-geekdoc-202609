  \n\n\n\n在这种语境下，健康被定义为社会、心理以及生理健康的完全状态，而不仅仅是残疾或疾病的缺乏。舒适是一种心理状态，使人感到身体平静且没有不适。性能被描述为个人执行各种认知和身体高要求活动的能力，也是衡量员工实现其目标成功程度的指标。生产力被定义为员工完成工作的数量和质量，相对于理想条件下可能产出的成果的衡量。生产力通常被定义为输出与投入的比率。投入通常包括维持\
  \ `IAQ` 的费用、招聘、培训、设备、工资、福利、保险等许多支出，而 `output` 则包括个人表现、生产的产品或服务。\n\n`IAQ` 对人类如此关重要的主要原因之一是，在工业化国家，个人经常将近乎\
  \ 90%的时间花在室内，主要是在建筑内 [10]。对于某些人来说，大部分时间花在家里；对于另一些人，是在办公室和工作场所；对于学生和学者来说，则是在学校或学院。员工每周在各种类型的办公室或行业场所花费约\
  \ 50 小时。在周期间，学生和教师在学校花费 4 到 8 小时 [6]。\n\n2020 年，印度将拥有全球前 10 大污染城市中的 9 个，以及全球前 50\
  \ 大污染城市中的 35 个。在空气质量方面，印度在 106 个国家中排名第三，仅次于巴基斯坦和孟加拉（分别位列第二和第一）。2020 年期间，印度的美国空气质量指数（`US\
  \ AQI`）平均值为 141 [11]，这对老年、呼吸道疾病患者和儿童等脆弱群体有害。预测室内空气污染物浓度以定义 `IAQ` 是建筑环境科学领域的一个长期课题。与测量\
  \ `IAP` 浓度相比，基于 `AI` 方法的预测是非侵入性的、快速且经济的 [6]。\n\n建筑内部及周围的空气质量被称为 `IAQ`。`IAQ` 受湿度、通风率、温度、各种气体、生物污染物以及颗粒物存在的影响，这些大致分为四类：物理参数、化学参数、生物学参数和颗粒物\
  \ [6]。各种参数（生物、化学、物理和颗粒物）的结合以及它们与波动的湿度温度的动态交互，使得居住者难以识别与 `IAQ` 相关的问题。户外污染对自然通风建筑的\
  \ `IAQ` 有重大影响 [12]。通风对 `IAQ` 有影响，它是将占用空间内的污染空气与室外清洁空气进行交换，同时维持区域内空气流动的过程。病建筑综合症（`SBS`）主要与糟糕的\
  \ `IAQ` 相关 [13]。\n\n大量研究发现，低空气质量水平会导致早死亡、呼吸系统和心血管疾病，以及癌症、痴呆和哮喘发作次数的增加 [14–16]。高污染物浓度水平导致的空气质量恶化是全球数百万人死亡的原因。在没有法规限制污染排放的贫穷国家，糟糕的空气质量具有最不利的影响。同样，空气质量在工业化国家也是一个关注的问题。遗憾的是，2012\
  \ 年室内 `IAP` 导致了超过 430 万非正常死亡，其中大部分发生在中低收入国家 [17]。慢性阻塞性肺（`COPD`）、肺癌、心脏病、中风和肺炎是与不良空气质量相关的突出原因。\n\
  \n政府和建筑环境组织还制定了许多公共法规以减少居住者的污染暴露 [6, 18–20]。对室内 `IAP` 浓度水平的实时监测，作为对 `IAQ` 管理的理性响应，可能是迈向良好室内管理以及有效源头的重要一步。此外，前沿技术如机器学习（`ML`），`AI`\
  \ 可以利用与污染水平相关的数据来预测未来的生活状况 [21]。智能健康系统、智能城市、智能工厂和智能家居在全球日益流行。此外，`AI` 与 `IoT` 的集成对智能环境产生了显著影响\
  \ [22, 23]。\n\n\n\n室内空气质量（IAQ）是室内环境质量（IEQ）组成的一部分，涵盖了室内舒适的物理和心理因素（例如热舒适度、声学、视觉质量和照明）[3]。美国环保保护局将\
  \ IAQ 定义为“建筑和结构内部及周围的空气质量，特别是与建筑人员健康和舒适相关的空气质量”[27]。任何能量或质量应力源（物理参数）、颗粒物、气体（化学参数）和微生物污染物（生物参数）都可能导致健康状况不良并对\
  \ IAQ 产生影响。IAQ 参数大致分为四类，即(a) 物理参数、(b) 颗粒物、(c) 化学参数和 d) 生物参数。这些参数列在图 18.1 中。\n\n\
  内部环境被定义为封闭或半封闭场所，比开放外部环境更容易产生污染物积聚。室内空气中的污染物沉积源于多种来源，可归分为(a) 室内源、(b) 地下（地下）源和(c)\
  \ 室外源。清洁产品、家具、吸烟、油漆、烹饪、化妆品、地毯、香水、驱虫剂、喷雾、人体代谢、宠物、二次反应、建筑材料、平台、燃料燃烧和修复都是室内污染的来源。地下源包括基础材料、浸出液、地下水、地下停车场和填埋场气体。道路交通、施工作业、农业、工业、发电厂、废水处理设施、污染场地、炼油厂、污染水域、沙暴和火山爆发都是室外源的示例。\n\
  \n![图 18.1 IAQ 参数。](img/c18-fig-0001.jpg)\n\n图 18.1 IAQ 参数。\n\n主要的室内空气污染物（IAP）、来源及其对人类健康的不利影响列在表\
  \ 18.1 中。这些污染物具有不同的尺寸图 18.2 代表了不同类型污染物颗粒尺寸从 100 µm 到 0.001 µm 的变化范围。\n\n表 18.1 IAP\
  \ 来源及其对健康的不利影响。\n\n| 污染物 | 来源 | 健康影响 |\n| --- | --- | --- |\n| CO2 | 燃烧煤炭、石油和天然气\
  \ | 降低氧气水平，降低呼吸和大脑功能，导致视觉缺陷 |\n| CO | 室内采暖设备、室外空气 | 浓度为 700 ppm 时，具有严重剧毒性 |\n| RSPM\
  \ | 路边扬尘、污染物、主要施工活动 | 增加心肺疾病和肺癌风险、儿童哮喘 |\n| O3 | 高压空气净化设备和室外空气 | 过敏反应和哮喘 |\n| ETS\
  \ | 烟草制品 | 肺癌、哮喘 |\n| TVOC | 地毯、胶胶板、油漆、溶剂、农药、密封剂、受污染水、塑料、香、香氛用品和某些植物 | 眼睛刺激、光化学氧化剂的形成\
  \ |\n| NO2 | 炉灶、火、室外空气 | 肺部刺激和增加呼吸道感染机会 |\n| Rn | 地球、通风不良位置的花岗岩和片麻岩 | 放射性，导致非吸烟者患肺癌\
  \ |\n| 甲醛 | 颗粒板、内装级胶胶板柜、家具 | 致癌风险 |\n| SO2 | 含硫燃料的燃烧 | 皮肤刺激、咳嗽、喉部刺激、呼吸困难 |\n\n![图\
  \ 18.2 室内空气污染物及其颗粒尺寸范围。](img/c18-fig-0002.jpg)\n\n图 18.2 室内空气污染物及其颗粒尺寸范围。\n\n使用新鲜空气稀释污染物、过滤和源控制是改善\
  \ IAQ 的基本策略。IAP 可能在暴露后或多年后产生健康影响。不良的 IAQ 是导致室内建筑综合症（SBS）和建筑相关疾病（BRI）的主要原因[28]。密闭结构内的污染物暴露会导致\
  \ SBS。不同参数及其浓度是导致 SBS 和 BRI 的根源。\n\n## 18.2.1 物理参数\n\n物理参数即湿度、换气次数（通风）、风速和温度影响建筑内部的\
  \ IAQ 和热舒适度[6]。尽管这些物理参数通常不直接影响人类健康，但由于它们会影响生理，会容易产生不适感。长期来看这种不适感的原因。\n\n### 18.2.1.1\
  \ 湿度\n\n室内空气湿度（相对湿度 `RH` 或绝对湿度 `AH`）是室内环境中的一个重要参数。空气干燥感和潜在的健康影响使其成为重要参数。如果室内相对湿度超过\
  \ 60%，将促进病原体和过敏物的生长。低湿度会导致黏膜干燥以及静电放电引起不适。\n\n### 18.2.1.2 换气次数（通风）\n\nASHRAE 标准\
  \ 62.1 [29] 的第一部分指出：“本标准的目的是规定人类人员可接受的最低通风率和室内空气质量，旨在最大限度地减少潜在的健康影响。”换气与建筑内部污染物浓度的降低直接相关。低换气率导致建筑内部污染物积聚。人员因换气不足而产生\
  \ SBS 症状。\n\n### 18.2.1.3 风速\n\n空间内的风速影响人体与室内环境之间的对流热交换。风速主要有两种形式。第一种气流由自然气流、浮力或具体地由大气循环产生。第二种气流是指强制空气，即由机械设备（如立扇或吊扇）产生的风速。通常情况下，自然风速能提供更好的\
  \ IAQ、更强的凉快感更高的热舒适度。\n\n### 18.2.1.4 温度\n\n\n\n\n温度主要影响居住者的热舒适度。然而，它与室内空气质量（IAQ）也有关联。温度的变化会改变湿度、流型等。任何建筑内部的高温都会促使空气流量增加，因为居住者会尝试通风，如果室外空气清洁，这将稀释室内的污染物浓度。相比之下，如果室内温度处于冷却侧，居住者将关闭开口，从而导致污染物被困住。许多研究人员报告，冬季的室内污染物浓度高于夏季。\n\
  \n## 18.2.2 颗粒物\n\n通常识别为 `PM` 的颗粒物是一个用于定义空气中盛行的液体液滴和固体颗粒混合物的术语。`污垢`、`灰尘`、`烟雾`和`烟灰`是足够大或黑到肉眼可见的颗粒示例。其余的非常微小，需要使用`电子显微镜`才能看到。颗粒污染包括可吸入颗粒，即\
  \ `PM[10]`，其直径为 10 µm 或以下；以及被称为微型吸入颗粒的 `PM[2.5]`，其直径为 2.5 µm 或以下。这些颗粒由数百种不同的化学物质组成，并以各种形状和大小存在。其中一些直接从`烟囱`、`火源`、`土路`、`农田`和`施工现场`等地方释放。工业、发电厂和汽车产生的`氧化氮`和`二氧化硫`等污染物构成了大气中大部分的颗粒。颗粒可以被吸入并引起严重的健康问题。直径小至\
  \ 10 微米的颗粒可以到达肺部，甚至进入血液循环并扩散到全身。颗粒根据大小在人体呼吸系统中的渗透水平见表 18.2 `[31]`。颗粒物是最有害的污染物，由于它们能够深入血流、大脑和肺部，会导致呼吸道疾病、过早死亡和心脏发作。国际癌症研究机构（IARC）和世界卫生组织（WHO）已将空气颗粒归类为一类致癌物。最危险的颗粒是直径小于\
  \ 2.5 µm 的颗粒，有时被称为微细颗粒、细颗粒或 `PM2.5`。\n\n**表 18.2**](#c18.xhtml#R_c18-tbl-0002) 根据在人体呼吸系统的渗透水平对颗粒进行分类。\n\
  \n| **直径 (µm)** | **渗透水平** | **分类** |\n| --- | --- | --- |\n| `>7` | 口腔和鼻腔 | 可吸入\
  \ |\n| 4.7-7 | 喉喉 | |\n| 3.3-4.7 | 气管和支气管 | 胸腔部 |\n| 2.1-3.3 | 次级支气管 | |\n| 1.1-2.1\
  \ | 细气管 | 可呼吸 |\n| 0.65-1.1 | 肺泡 | |\n\n## 18.2.3 化学参数\n\n在室内空气质量（IAQ）中，化学参数包含多种气体。其中包括`一氧化碳\
  \ (CO)`、`二氧化碳 (CO[2])`、`二氧化硫 (SO[2])`、`二氧化氮 (NO[2])`、`臭氧 (O[3])`、`气氨 (NH[3])`、`挥发性有机化合物\
  \ (VOC)`等，并在下方简要说明。\n\n### 18.2.3.1 二氧化碳\n\n这是一种酸性无色气体，由两个共价结合的氧原子组成。在地球大气中，它以微量气形式存在。森林火、火山和温泉都是自然来源，它通过`酸和水的分解`从`碳酸盐岩`中释放。天然`CO[2]`源包括森林火、温泉和火山。`CO[2]`\
  \ 是地球大气中最丰富的温室气体。自工业革命以来，人类活动（主要是森林砍伐和化石燃料的使用）排放剧增加了其在空气中的浓度，加剧了全球变暖。`CO[2]`污染会产生多种不利健康影响。过高的\
  \ `CO[2]` 浓度和暴露时间会导致头痛、坐不安、刺痛感、眩晕、高血压、出汗、呼吸困难、疲劳、缺氧、昏迷和痉挛等症状。\n\n### 18.2.3.2 一氧化碳\n\
  \n这是一种易燃、无味、无味、无色的气体，密度略低于空气，是`氧碳族`的基本成员。它是几种室内环境中常见的空气污染，主要产生于`内燃机排放`（汽车、压力清洗机、割草机、便携式和备用发电机等），以及其他各种物品的部分燃烧（如木炭、煤、木材、天然气、石油、丙烷、垃圾和石蜡）。燃料（如柴油、石油产品和木材）的热燃烧是\
  \ `CO` 最常见的来源。在狭闭空间内，`CO` 浓度可达到致命水平。由于 `CO` 在体内的作用，`CO 代谢`异常与多种疾病有关，包括高血压、心脏疾病、病理性炎症和痴呆。\n\
  \n### 18.2.3.3 二氧化氮\n\n这是一种具有强烈的、不愉快气味且呈红褐色的气体。`NO[2]` 主要作为燃料燃烧的副产物排放到大气中。发电厂、公交车、卡车、汽车和其他消耗燃料的交通工具会产生\
  \ `NO[2]`。室内 `NO[2]` 暴露的主要原因是烟雾、煤油炉和加热器。当一氧化氮 (`NO`) 被空气中的氧气氧化时，就会产生 `NO[2]`。当氮与氧在高温下结合时，会产生\
  \ `NO`。接触皮肤会导致刺激。只有极高浓度浓度才会引起严重不适：`100–200 ppm` 的浓度会导致中度鼻喉不适；`250–500 ppm` 会导致水肿（由于液体聚集和积聚引起的肿胀），可能导致肺炎或支气管炎；`1000\
  \ ppm` 的浓度会导致肺部窒息引起死亡。除了短暂的恶心、咳嗽或疲劳外，接触时通常没有症状，但在炎症几小时后会出现水肿。即使 `NO[2]` 的每日细小变化也会影响肺功能。长期暴露于\
  \ `NO[2]` 会导致健康人群产生呼吸道影响，如气道炎症，并加剧哮喘患者的呼吸症状。`NO[2]` 产生臭氧，臭氧会刺激眼睛并加剧呼吸问题，导致呼吸道疾病的急诊和住院人数增加。\n\
  \n### 18.2.3.4 二氧化硫\n\n这是一种具有强烈的硝酸味气味的毒性气体。它是通过燃烧含硫化石燃料产生的，也是通过火山活动自然释放的。`SO[2]`\
  \ 的气味与火柴燃烧的味道相似。例如，煤、火柴和含硫燃料的烟雾经常使个体暴露于二氧化硫。`SO[2]` 是一种中等毒气体，在高浓度下可能是致命的。低浓度暴露也是危险的。除了呼吸问题外，`SO[2]`\
  \ 导致胃不适、低血压、潮红、荨麻、皮炎、腹泻以及可能危生命的过敏反应。\n\n### 18.2.3.5 臭氧\n\n\n\n\n\n这是一种由无机分子组成的氧气同聚物，其稳定性远低于\
  \ `O[2]`。它是一种黄蓝色的气体，具有类似于氯的强烈难臭气味，许多人在浓度低至 0.1 ppm 时就能感知到。`O[3]` 是一种强氧化剂。`O[3]`\
  \ 是一种危险气体，通常由人为活动产生，可能出现在带有复印机、飞机客舱、杀菌器、激光打印机和其他场所。\n\n### 18.2.3.6 气态氨\n\n这是一种无色、无味的由一个氮分子和三个氢分子组成的气态化学物质。氮类废物是最常见的来源。高浓度下的氨既有毒性又有腐蚀性。农业作业（如使用氨肥和畜牧业）产生了大部分氨。其他来源还包括海洋和土壤的挥发、汽车排放、工业过程等。高浓度氨的室内空气会刺激眼睛、鼻子和喉咙，并引起皮肤刺激。氨中毒会导致长期健康影响，包括严重的心血管和肺部问题。肺功能受损、哮喘加重和早死都是潜在的影响。\n\
  \n### 18.2.3.7 挥发性有机化合物\n\n`VOCs` 由某些固体或液体以气形式释放。`VOCs` 是一类会对健康产生短期和长期影响的化学物质。建筑内部许多\
  \ `VOC` 的浓度持续高于室外。成千上万的物品都会释放挥发性有机化合物（`VOCs`）。家具和建筑材料、清漆、油漆以及脱漆、农药、清洁用品、办公设备、无碳复写纸和修正液、粘粘剂和胶水之类的工艺和美术材料、相光溶液和永久性马克笔，仅是其中的少数例子。有机化合物经常被用作家用用品的成分。蜡、清漆、油漆、各种清洁、消毒、化妆品及其他产品均含有有机溶剂。燃料由有机分子制成。在使用过程中以及在程度较小的情况下存放时，所有这些物品都有存在泄漏有机化合物的可能。恶心、协调能力丧失、头痛、眼睛、鼻子喉咙刺激，以及中枢神经系统、肾脏和肝脏损伤都是潜在的风险。在人类中，某些\
  \ `VOCs` 可导致癌症。\n\n## 18.2.4 生物参数\n\n某些污染物被归类为生物参数。病毒、细菌、动物唾液和皮屑、蟑螂、花粉和尘螨是一些生物污染物。这些污染物可以在多种环境中找到。可以控制家中的相对湿度水平，以防止某些生物的生长。在许多情况下，30%\
  \ 到 50% 的相对湿度对房屋是有益的。积水、受损的材料和潮湿表面是霉菌、霉、昆虫和细菌的理想繁殖地。家用尘螨在潮湿、温暖的环境中生长，使其成为最强过敏原之一。包括\
  \ COVID-19、麻疹和水痘在内的传染病通过空气传播。霉菌和霉释放的化学物质会引起疾病。咳嗽、流泪、喷嚏、呼吸困难、胃部不适和疲劳都是生物污染的症状。\n\n\
  ## 18.3 AI 在室内质量预测中的\n\n`AI` 现在广泛应用于工程、科学和制造业。`AI` 是一种不同于传统技术的方法。`AI` 是模拟人类行为的计算机程序。它是能够感知周围、理解其行为并采取行动的计算机或系统。根据麦肯锡的数据，`AI`\
  \ 将在 2030 年产生 13 万亿美元的经济价值。这是因为 `AI` 正在改变几乎每一个行业和应用。与传统方法相比，`AI` 技术为各种环境挑战提供了解决方案，特别是在室内空气质量（`IAQ`）领域。此外，`AI`\
  \ 技术可以在无法进行物理测试的地方工作，减少时间、人力费用。使用 `AI` 的主要优点是它可以减少误差并由于其快速处理能力产生结果。此外，`AI` 具有子集\
  \ `ML` 和深度学习（`DL`），见图 18.3。在 `IAQ` 中，许多研究使用了 `ML` 来预测空气质量。在文献中，主要使用的 `ML` 模型有人工神经网络（`ANN`）、支持向量机（`SVM`）、随机森林（`RF`）、增强回归树（`BRT`）、多元线性回归（`MLR`）、决策树（`DT`）和适应神经模糊系统（`ANFIS`）。图\
  \ 18.4 展示了各种 `ML` 方法。\n\n```\nAI, ML, and DL.\n```\n\n```\nML methods.\n```\n\n\
  每个模型的性能取决于预测值的变化。数据集中离群值越高，模型性能越低。`ANN` 模型在准确性方面良好，但 `ANN` 算法预测结果需要大量时间。`ANFIS`\
  \ 模型解决了 `ANN` 模型的时间限制，但其准确性可能低于 `ANN` 模型。表 18.3 说明了使用 `ML` 预测空气的研究。\n\n### 表 18.3\
