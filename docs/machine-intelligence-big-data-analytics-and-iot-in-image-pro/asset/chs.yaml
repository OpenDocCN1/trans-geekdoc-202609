  \ 90, 103479, 2020。\n\n\n\n\n\n# 面向印度智慧城市的物联网智能停车系统\n\n**E. Fantin Irudaya Raj¹*,\
  \ M. Appadurai², M. Chithamabara Thanu² and E. Francy Irudaya Rani³**\n\n*¹ 印度泰米尔纳杜，Dr.\
  \ Sivanthi Aditanar College of Engineering，电气与电子工程系*\n*² 印度泰米尔纳杜，Dr. Sivanthi Aditanar\
  \ College of Engineering，机械工程系*\n*³ 印度泰米尔纳杜，Francis Xavier Engineering College，电子与通信工程系*\n\
  \n## 摘要\n近年来，智慧城市的概念受到了广泛关注。全球大多数政府正在采取各种倡措来建设智慧城市。印度政府也宣布了“国家智慧城市任务”，旨在对全印度的城市进行改造、复兴并创建智慧城市。该任务的核心目标是利用物联网（IoT）技术建设新城市，或改造现有城市，使其更具可持续性和对公民更友好。车辆停车将成为印度城市的一个大问题。这主要是由于规划不善和土地匮乏导致的，并引发了交通拥堵、污染、经济损失等一系列问题。物联网广泛利用传感器和变送器从物理世界收集实时数据。车辆停车设施、交通拥堵、交通管理和道路安全等问题正在通过物联网解决。本章研究了印度城市基于物联网的车辆停车系统。此外，详细讨论了车辆停车及其基本需求、现代停车系统中各种各种技术、停车设施使用的不同传感器以及基于物联网的车辆停车系统的优势。\n\
  \n**关键词：**智慧城市、物联网 (IoT)、传感器、智能车辆停车系统、交通管理系统\n\n## 15.1. 引言\n19 世纪末机动车引入后，这些车辆的使用逐渐增长到\
  \ 20 世纪中期。然而，在 21 世纪，这一数量呈巨大的增长。这种增长主要出现在全球范围内高度发展的城市，并开始导致车辆停车、交通拥堵和环境污染问题。车辆停车挑战的出现主要是由于城市设计不当导致土地匮乏，以及人口密度增加\
  \ [1]。在现代智慧城市等大都市地区，这个问题将比农村地区严重得多。这主要是因为为了工作和满足经济需求，从农村地区向大都市地区迁移的人口不断增加。工业革命后，人们从农村向城市环境迁移的速率呈指数级增长\
  \ [2]。\n\n城市中的人们出于各种原因在城市内的不同地点之间往返，包括工作旅行、教育旅行、休闲旅行和商务。由于城市内部不同地点之间车辆移动的增加，对停车产生了巨大需求，如果不提供，将因车辆占用道路空间停车而导致严重的交通拥堵。因此，规划者被迫在城市、休闲区和工业区的建设中加入停车结构，以确保车辆顺畅流动，防止交通拥堵、事故和污染，并增加经济活动等\
  \ [3]。在传统的停车方法中，规划者分配空地土地和路边空间用于停车，但由于城市车辆数量的饱和，这并不是满足停车需求的有效解决方案。因此，他们转向了更先进的方法来管理停车需求，例如计费停车、多层停车、自动停车等。然而，满足停车需求的问题尚未得到解决\
  \ [4]。\n\n为了实现可持续性，发达和发展中国家的大多数城市都实施了一种名为“智慧城市”的城市开发新理念。他们希望通过这样做来减少交通拥堵、污染、延迟、旅行时间、旅行成本和事故。他们考虑的另一个主要因素是如何管理停车需求。综合交通系统、公交专用道和改进的公共交通工具都是智慧城市的一部分。具体而言，将使用更高效、更有效的物联网（IoT）智能停车系统来满足停车需求\
  \ [5]。它在全球范围内被广泛使用，包括 [6] 等。印度政府也对全印度的城市改造、复兴和创建智慧城市采取了倡措。该任务的主要目的是利用信息和通信技术（ICT）开发新城市，或将现有城市变为更具可持续性和对公民更友好的环境\
  \ [7]。本章提供了回顾，并详细探讨了基于物联网的停车系统。\n\n## 15.2. 印度智慧城市\n印度是许多经历从农村向城市快速转变的发展中国家之一。城市人口的十年级增长反映了这一转变。印度城市人口从\
  \ 2001 年的约 27.8%增长到 2011 年的 31.2%，预计到 2030 年将扩大到 40%，2050 年超过 50% [8]。随着人口的增加，城市正面临着基础设施管理和服务交付方面的问题\
  \ [9]。成功且高效地应对这些挑战的技术之一是开发智慧城市。印度的“智慧城市任务”是由印度政府城市发展部（MoUD）领导的一项为期 5 年的国家计划，旨在为全国\
  \ 100 个智慧城市提供基础 [10]。然而，该任务并未确定“智慧”城市必须具备的特定特征。相反，他们正集中于将现有城市转变为智慧城市 [11]。为了这一目标，已经花费了巨额资金，并建立了新的项目和基础设施。智慧城市的各个组成部分如图\
  \ 15.1 所示。\n\n根据印度政府的数据，汽车工业是该国 GDP 的重要贡献者。其目前占 GDP 的比例约为 6.7%，预计到 2026 年将达到约 12%。它将是最重要的就业来源之一。印度拥有约\
  \ 470 万公里的道路，拥有世界上最大的网络之一。道路承担了超过 65%的货运和 80%的客运，但道路基础设施的状态是一个担忧来源。其他问题包括交通拥堵、运行燃油的车辆造成的空气污染、公共交通不足、水路利用率低以及运输系统缺乏技术创新\
  \ [12]。\n\n\n\n\n\n智能交通系统（ITS）是一系列信息通信技术（ICT）方案的集合，用于在智慧城市环境中高效地管理交通。ITS 的关键领域之一是实时停车管理和多层停车。实时停车管理系统还在公共可见的电子显示屏上显示可用停车场的信息。这项便利对于停车场员工和终端用户都是有利的。通过极少数的土地利用率、快速的进出以及多个传感器和安全系统，多层停车提供了廉价的运行和维护成本\
  \ [13]]。\n\n基于 `IoT` 的传感器和设备的使用是汽车技术领域的最新进展。车辆底盘和传动系统还集成了摄像头和传感器，辅助停车。这项技术提高了停车和驾驶的安全性、效率和舒适度，使其成为缺乏经验的驾驶员和学习者的得益工具。它对于现代智慧城市布局中的公民在许多方面也有帮助\
  \ [14]]。\n\n## 15.3. 智慧城市配置下的车辆停车及其需求\n\n汽车停车并在更安全的地方短时间停留以实现以下目的：装卸货物、购物、短时间休息以及维修故障车辆，这些都是停车的例子。还有长时间的停留以实现以下目的：停车并工作、休闲活动、停车并使用公共交通工具以及居住停车。停车是成功交通系统中最重要的部分之一，因为每个目的地都应该有可用的车位，从而确保驾驶的便利性并提高整体的可访问性\
  \ [15]]。\n\n![图 15.2 停车规划周期。](img/c15-fig-0002.jpg)\n\n图 15.2 停车规划周期。\n\n如今，由于建筑成本、建设成本、污染、交通拥堵、延迟和事故等许多因素，停车已成为一个社会问题。所有经济阶层的人都应该能够获得所有可选旅行方案，如公共交通、单轨、地铁和机场，并且他们应该拥有停车设施的准确信息，例如各种车辆的停车费用、美学可访问性、用户信息和车辆安全\
  \ [16]]。其规划方式应当能够接受峰值需求等不确定性，同时能够服务不同的目的地。由于基础设施的快速发展、工业化以及人们为了工作、教育和商业从农村地区向城市迁移，高流动性导致停车需求增加，这要求停车规划发生范式转变。在过去，停车困难意味着没有空间停车辆；现在，它意味着缺乏用户信息、空间饱和和高成本\
  \ [17]。图 15.2 显示了如何根据估计当前和预测需求来规划停车。\n\n为了通过提供最佳停车设施来实现全面且整合的策略，规划者应该通过考虑以下参数来妥善解决停车问题，例如停车缺口发生的时间和地点，以及问题的类别。停车管理应该更具成本效益，因为停车对其他成本有间接影响，例如税收、租金和零售产品成本等。根据印度道路会议（IRC）的指南，如表\
  \ 15.1 所示，不同类型的建筑需要不同的最小停车位。然而，根据 IRC 规定，停车需求随不同的土地利用模式而波动。\n\n表 15.1 不同类型建筑的最小停车位。\n\
  \n| 建筑类型 | 停车位（IRC 建议） |\n| :--- | :--- |\n| 住宅建筑小于 300 m² | 公共停车 |\n| 住宅建筑（300\
  \ 到 500 m²） | 开放区域 |\n| 办公建筑 | 每 70 m² 一个空间 |\n| 餐厅建筑 | 每 10 座一个空间 |\n| 电影院 | 每\
  \ 20 座一个空间 |\n\n## 15.4. 智慧城市车辆停车系统中整合的技术\n\n道路上的汽车数量正以大城市人口增长的速度同步增长。人们倾向于私人出行而非公共交通，这导致了车辆数量的增加。结果是获取空车变得越来越困难，引发了各种问题，如能源浪费、时间浪费和汽油浪费。为了缓解交通拥堵，已经实施了多种方法。尽管有许多需要考虑的因素，其中一个就是实施智能停车系统。先进技术和许多学术的研究用于生产智能停车系统，这些系统在许多国家已经建立。预计在停车场部署技术将消除用户面临的上述问题\
  \ [18]]。\n\n停车场系统对停车场运营商、客户和环境观察者都有利。停车场运营商可以利用通过智能停车系统收集的信息来预测未来。还可以根据收集的数据调整定价策略以增加公司利润。通过减少空气中的排放，可以在环境保护方面降低污染水平。这归功于行驶里程的减少。因为燃料消耗与行驶里程成正比，它将显著减少\
  \ [19]]。\n\n用户也可以从智能停车系统中受益，因为在更安全、更高效的系统中停车位可以得到充分利用。由于智能停车系统提供的信息，系统变得更加高效，因为车辆行驶时间和搜索时间大大减少。有了这些信息，驾驶员可以轻松避免满停车场。随着更多车辆进入停车场，导致交通拥堵的路边违停车辆将会减少\
  \ [20]]。最主要的益处是缓解了交通拥堵。这一切最终有助于公共便利。智能停车系统进一步分为五类。它们分别是 a) 自动停车、b) 电子停车、c) 支付系统、d)\
  \ 基于传输的信息系统以及 e) 停车引导信息系统 [21]]。有多种现代技术整合到车辆停车系统中，使其现代化且有效。与现代车辆停车系统相关的各项重要工作列在表\
  \ 15.2 中。\n\n\n\n\n\n文献中列出了许多著作。本节将讨论其中一些重要的著作。在这些技术中，基于 IoT 的智能停车系统更加可靠且具有成本效益。目前，基于\
  \ IoT 的传感器和设备取得了许多进展。整套设备的成本也变得非常低。这些因素最终使得基于 IoT 技术在印度智慧城市中使用智能停车系统中更具优势。接下来的章节将介绍基于\
  \ IoT 的现代智能停车系统，该系统最适用于印度智慧城市。\n\n### 表 15.2 (#c15.xhtml#R_c15-tbl-0002) 关于现代化车辆停车系统的文献重点工作。\n\
