  \ 1.1 展示了科学界使用的几种 AD 分类模型的性能。\n\n## 1.4 使用迁移学习进行分类\n\n与传统的机器学习（ML）不同，深度学习（DL）能够从低级到高层自动提取特征。相比之下，网络是从零开始使用\
  \ DL 方法训练的，这存在缺点。在需要临床标注数据的医疗领域，这可能是一个问题且非常昂贵。它还需要大量的计算资源。此外，这些模型中的许多超参数必须仔细调整，否则可能会导致欠拟合或过拟合，以及性能下降。迁移学习（TL）可用于微调深度网络（如\
  \ `CNN`），而不是从零开始学习。神经网络模型首先在目标问题相似的源域数据上进行训练。然后使用训练模型的最后几层创建一个使用目标数据集作为训练数据的新模型。为了执行迁移学习，权重初始化和特征提取是两个重要的方法。结果，这种方法比从零开始训练网络快得多，并产生更好的结果。由于其巨大的计算能力，它主要用于计算机视觉应用，例如情感分析和分类问题。许多研究团队选择微调其网络而不是从零开始，并使用了\
  \ `CaffeNet`、`GoogLeNet`、`VGGNet-11`、`VGGNet-16`、不同深度的 `DenseNet`（121-161-169）、`Inception-V4`、`AlexNets`、`ResNet-18`、`ResNet-152`，甚至是在泛化图像上预训练的集成迁移模型，用于\
  \ AD 分类和提高性能。Table 1.2 说明了研究人员利用迁移学习技术进行 AD 分类的各种设计成功。\n\n\n\n据报道[44]，使用 `VGG-16`\
  \ 架构的阿尔茨海默病（AD）三分类准确率为 92%。另一方面，作者们表明基于 `VGG` 的 AD 二分类更为准确 [50, 55, 58, 61]。对于三分类，在\
  \ ADNI 数据集上，`GoogleNet` 在 [45] 中的表现优于 `ResNet-18` 和 `ResNet-152`。[54] 中使用相同的 OASIS\
  \ 数据集对四种不同的迁移学习（TL）模型（`VGG`、`DenseNet`、`ResNet` 和 `EfficientNet`）进行了比较，`EfficientNet`\
  \ 在四者中具有 96% 的最高率。\n\n### 表 1.2 (#c01.xhtml#R_c1-tbl-0002) 通过迁移学习技术进行 AD 分类。\n\n\
