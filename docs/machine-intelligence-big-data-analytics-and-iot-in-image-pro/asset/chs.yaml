  \n# 17 机器学习模型在 FRP 包裹梁强度预测中的应用\n\n通讯作者*: `jatin.arora@chitkara.in`\n\nAman Kumar¹,2,\
  \ Harish Chandra¹,2\n\n¹ CSIR-Central Building Research Institute, Roorkee, 印度\n\
  ² AcSIR-Academy of Scientific and Innovative Research, Ghaziabad, 印度\n\n## 摘要\n\n\
  钢筋混凝土（RC）结构的腐蚀引起了全球日益关注。由于其许多性能，纤维增强聚合物（FRP）在过去十年已广泛应用于修复和新建筑中。这种材料具有优异的强度重量比、刚度重量比、轻量化、潜在的耐久性以及施工方便等优点。本章总结了用于预测\
  \ FRP 与混凝土界面抗剪和抗弯强度的机器学习模型。\n\n***关键词：*** 机器学习、人工智能、FRP-混凝土粘结、抗弯强度、剪强度、FRP\n\n##\
  \ 17.1 引言\n\n建筑是全球所有经济体最重要的行业之一。水泥、粘土、木材、钢、铝和玻璃只是建筑行业中使用的少数材料。然而，在大多数情况下，该行业对实验新材料持犹豫态度，倾向于坚持经过验证的混凝土和钢等可靠选择。由于其普及性和低成本，混凝土已成为全球最常用的人造建筑材料，也是海洋环境中土木基础设施发展的理想介质。钢筋混凝土用于许多土木工程结构中，如多层建筑、桥梁、大坝、核电站等。混凝土结构随年龄推移而导致结构耐久性和强度丧失是一个常见现象。环境因素（如水分渗透、盐分/酸侵蚀和湿度条件）会加剧退化，从而缩短结构的使用寿命。达到寿命期的现有结构必须定期进行评估和监测，以确定其功能性并协助减少基础设施退化的根本原因。在资源有限的情况下，确保旧建筑的安全是工业化国家面临的严峻问题。\n\
  \n钢筋腐蚀是混凝土退化的最原因。氯离子诱发的钢筋腐蚀是混凝土结构损坏和早期退化的主要来源，对安全、可靠性、经济和环境性能产生严重影响。\n\n\n\n\n\n\
  FRP 最初用于 20 世纪 30 年代的建筑和施工领域。玻璃纤维是第一个作为工程材料使用的纤维材料。20 世纪 70 年代初，世界各地开始建造玻璃纤维 FRP\
  \ 复合材料的结构/建筑（例如迪拜的一个机场屋顶和班格加齐的一个圆顶结构）。与此同时，复合材料和制造工艺得到了充分改进。20 世纪 90 年代，芬兰建造了一个由\
  \ 75% 聚合物和 FRP 复合材料组成的有趣结构模型`[3]`。同时，在日本，FRP 系统被用于代替钢筋以应对腐蚀相关问题。1988 年，日本石川市建造了第一座利用碳纤维增强聚合物（`CFRP`）筋的混凝土预应力梁桥`[4]`。由于碳纤维具有耐腐蚀、高机械强度、低密度、高弹性模量和低成本等优异特性，它在航空、运输和体育用品等多个行业变得越来越受欢迎`[5]`。2008\
  \ 年，消耗了 35,000 吨 CFRP；到 2014 年，由于 12% 的年增长率，这一数字翻了一番`[6]`。到 2020 年，预计全球将生产 100 万吨\
  \ CFRP`[7]`。但是，只有 60% 的原生 CFRP 复合材料被有效应用在实际技术中，导致 40% 被视为废物`[8]`。鉴于填埋空间的稀缺和碳纤维废物处理的高昂成本`[9]`，日益增加的碳纤维废物对长期增长产生了巨大的环境和经济影响。将\
  \ FRP 复合材料与混凝土部件进行外部粘接被认为是提高现有建筑长期性能的可能解决方案。\n\n## 17.1.1 定义纤维增强聚合物\n\nFRP 复合材料系统由“聚合物”和用于增强的“纤维”材料组成。聚合物是构成有机物质的长链分子。单体是这种链的基础组成部分，它们会不断重复出现。聚合物充当纤维的粘剂，保护纤维免受外部机械磨损和环境影响，并将负载从一根纤维传递到另一根纤维以确保稳定性。环氧树脂、乙酸酯和聚酯是\
  \ FRP 最广泛使用的聚合物。相互比较，上述每聚合物在应用技术、成本和耐用性方面各有优劣。FRP 复合材料的纤维和其他组分通过增强聚合物，为复合材料增加了了刚性和强度。这些\
  \ FRP 具有许多优点，例如与混凝土和钢材等典型增强材料相比，它们具有高强度、低重量、应用速度快、耐腐蚀以及结构单元几何形状的改进较小等优点`[10]`。\n\
  \n在大多数情况下，FRP 复合材料具有金属等传统材料无法比拟的材料特性。为了最大化材料强度，FRP 可以以任何长度或截面形状生产。此外，与典型的工程材料相比，FRP\
  \ 具有等优点，如重量轻、耐用性好、耐腐蚀且基于生命周期的成本效益高。\n\n### 17.1.2 复合材料的类型\n\nFRP 复合材料大致分为四类，如碳、玻璃、芳纶和玄武岩，如图`Figure\
  \ 17.1`所示。\n\n### 17.1.2.1 纤维增强聚合物\n\nFRP 复合材料系统由“聚合物”和用于增强的“纤维”材料组成。聚合物是构成有机物质的长链分子。单体是这种链的基础组成部分，它们会不断重复出现。聚合物充当纤维的粘剂，保护纤维免受外部机械磨损和环境影响，并将负载从一根纤维传递到另一根纤维以确保稳定性。环氧树脂、乙酸酯和聚酯是\
  \ FRP 最广泛使用的聚合物。相互比较，上述每聚合物在应用技术、成本和耐用性方面各有优劣。纤维和 FRP 复合材料的其他组分通过增强聚合物，为复合材料增加了刚性和强度。这些\
  \ FRP 具有许多优点，例如与混凝土和钢材等典型增强材料相比，它们具有高强度、低重量、应用速度快、耐腐蚀以及结构单元几何形状的改进较小等优点`[10]`。\n\
  \nFRP 复合材料在大多数情况下具有金属等传统材料无法比拟的材料特性。为了最大化材料强度，FRP 可以以任何长度或截面形状生产。此外，与典型的工程材料相比，FRP\
  \ 具有等优点，如重量轻、耐用性好、耐腐蚀且基于生命周期的成本效益高。\n\nFRP 复合材料大致分为四类，如碳、玻璃、芳纶和玄武岩，如图`Figure 17.1`所示。\
  \ \n\n### 17.1.2.1 碳纤维增强聚合物\n\n碳纤维增强聚合物（`CFRP`）包含聚合物树脂和作为增强的碳纤维，`Figure 17.1`所示。碳纤维是极细的丝状（直径约为\
  \ 5-10 微米），肉眼几乎可见`[11]`。碳纤维已经存在了近一个世纪。在第一个灯泡中，爱德华·迪松使用了竹纤维制成的丝`[12]`。经过几十年的研究，市场上提供了各种强度和模量的碳纤维。`Table\
  \ 17.1` 比较了四种常用碳纤维与钢材料的机械特性。\n\n| 序号 | CFRP 类别 | E (GPa) | f (MPa) | HTT (°C) |\
  \ C (o) |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1. | 钢 (`Fe500`) | 210\
  \ | 640 | - | - |\n| 2. | 低模量碳纤维 (`LMCF`) | 200 或低 | 3500 或低 | <1000 | 随机 |\n| 3.\
  \ | 标准模量碳纤维 (`HTCF`) | 200–280 | 2500 或更高 | ~1500 | 很大平行于纤维轴 |\n| 4. | 中等模量碳纤维 (`IMCF`)\
  \ | 280–350 | 3500 或更高 | ~1500-2000 | |\n| 5. | 高模量碳纤维 (`HMCF`) | 350–600 | 2500\
  \ 或更高 | >2000 | |\n| 6. | 超高模量碳纤维 (`UHMCF`) | 600 或更高 | 2500 或更高 | >200 | |\n\n\
  ### 17.1.2.2 玻璃纤维\n\n玻璃纤维生产自古代就有尝试，但 1893 年“爱德华·德鲁蒙·利比”展示了一件由丝绸和玻璃纤维织物制成的服装后，玻璃纤维的大规模生产开始。“拉塞尔·盖姆斯·斯莱特”在\
  \ 1938 年获得了玻璃棉制造的第一项专利`[13]`。由于产生的纤维表现出良好的电绝缘性能，玻璃纤维产品被称为 E 玻璃或电玻璃。玻璃纤维于 1939 年首次用于美国海军战舰的隔热层。\n\
  \n\n\n\n\n玻璃纤维最广泛的应用是通用结构性应用。它们有多种形式，其中最流行的是`E-glass`。玻璃纤维主要用于被动加固，例如受地震损坏的建筑。`E-Glass`\
  \ 纤维的缺点是耐碱性低。为了弥补这一弱点，中添加了大量的 `zirconia` 以制成抗碱的 `AR-glass`。\n\n### 17.1.2.3 芳胺纤维\n\
  \n芳胺纤维是第一具有显著拉伸模量和强度的用于先进复合材料增强材料的有机纤维。芳胺纤维于 20 世纪 60 年代上市[14]]。芳胺纤维的各种优点包括耐热性、强力有机溶剂抗性以及低易燃性。在\
  \ 500°C 左右，芳胺纤维开始降化。芳胺纤维的“惰性”属性使其适用于广泛的领域。另一方面，芳胺纤维对紫外（UV）辐射、酸和某些盐敏感。可以使用芳胺织物保护桥柱，防止其因车辆碰撞而坍塌。爆炸减缓是另一个重要的应用领域。芳胺纤维本质上对紫外光的抵抗力较低。\n\
  \n### 17.1.2.4 玄岩纤维\n\n玄岩纤维由天然存在的复杂氧化铝/硅/其他氧化物玄武岩制成，其成分与玻璃相当，用于替代石棉。它们有无纺布和丝材形式，其温度性能被认为优于玻璃纤维。它被用作航空领域和汽车领域的防火布，也可用于建筑、公路和跑道施工中的复合增强材料（包括混凝土加固）。\n\
  \n## 17.2 使用 FRP 系统加固 RC 梁\n\n使用 FRP 系统对钢筋混凝土进行加固大致分为两个部分：(i) 梁的弯矩加固和 (ii) 梁的剪切加固，如图图\
  \ 17.3 所示。\n\n在过去的二十里，`FRP` 在建筑行业的使用急增。由于人工智能（AI）的帮助，分析工作的速度和准确性正在提高。AI 主要用于预测 FRP\
  \ 筋梁的粘结强度、剪切强度和弯矩强度。\n\n![Figure 17.3 Types of strengthening in RC beams with FRP.](img/c17-fig-0003.jpg)\n\
  \nFigure 17.3 使用 FRP 加固 RC 梁的加固类型。\n\n### 17.2.1 FRP 与混凝土的粘结\n\n`FRP` 板与混凝土基底之间的界面连接对于大多数采用外部粘结\
  \ `FRP` 的混凝土结构加固或加固程序的性能至关重要。`FRP-concrete` 粘结在传递应力方面起着重要作用。单剪切测试和双层搭接剪切测试是确定 `FRP`\
  \ 与混凝土表面之间粘结强度常用的实验方法，如图图 17.4 所示。\n\n已经进行了各种实验研究，以探索不同输入参数（如混凝土抗强度、纤维厚度和粘结长度）的行为，以便估计粘结强度[15–18]。各种作者和国家提供的文献给各种分析公式。这些分析公式最主要的局限性是它们仅适用于特定的数据库。AI\
  \ 可以帮助克服这些局限性。\n\n![Figure 17.4 FRP-bond strength test setup (a) single-lap shear\
  \ test [19] (b) double-lap shear test [20].](images/c17-fig-0004.jpg)\n\nFigure\
  \ 17.4 FRP 粘结强度测试装置 (a) 单层剪切测试 [19] (b) 双层搭接剪切测试 [20]]。\n\n### 17.2.2 使用 FRP 对梁进行弯矩加固\n\
  \n在很多情况下，弯破坏是一种常见类型。腐蚀的 RC 梁必须用复合材料进行加固，以避免失效并增加其使用寿命。材料质量、加固技术、负载都会影响性能。放置在拉力面的\
  \ `FRP` 可以显著提高其使用寿命。`FRP` 复合材料的厚度控制着加固参数[21]。[图 17.5 显示了外部粘结 (EB) FRP 系统对 RC 梁的弯矩加固。\n\
  \n### 17.2.3 使用 FRP 对梁进行剪切加固\n\nU 型包裹、完全包裹和侧粘加固方法均可提高 RC 梁剪切区域的强度。使用 `FRP` 进行剪加固最成功的形式是完全包裹加固方案，其中层/层/板包裹整个梁截面。然而，由于“整体板”或额外支撑部分的存在，这种方法从施工角度来看是不可行的。侧粘方法将板材仅贴在梁侧面，增加了梁的微小承载能力。大多数\
  \ RC 梁与楼板整体浇筑，U 型包裹方案（将 `FRP` 层/层/板应用于梁的拉力面和两侧）是实践中常用且成功的方法。然而，在许多情况下，`FRP` 剥离是主要的失效机制，限制了\
  \ `FRP` 的剪切影响[22]。\n\n![Figure 17.6 FRP shear strengthening configurations [23].](images/c17-fig-0006.jpg)\n\
  \nFigure 17.6 FRP 剪切加固方案 [23]]。\n\n\n\n\n\n与传统的工程方法相比，在需要通过算法解决方案修正概念时，将系统研究方法作为开发的一个备选项是有益的。机器学习方法有三种类型：\n\
  \n- (i) `监督学习`：在监督学习中，教育集由输入和输出对构建而成，其目标是学习这两个空间之间的映射关系；\n- (ii) `无监督学习`：在无监督学习中，教育集包含未标记的输入，即没有分配预期结果的输入；\n\
  - (iii) `强化学习`：强化学习是一种跨越监督学习和无监督学习光谱的学习形式。与无监督学习相比，它具有某种形式的监督，但这种监督并不是为数据中的每一个输入表达优选结果。在土木工程应用中，主要使用基于监督的机器学习。\n\
  \n近年来，已经进行了若干实验，以确定外部粘结和近表面粘贴（NSM）FRP 对剪切、弯曲以及 FRP 与混凝土基底之间界面进行加固的 RC 梁的极限强度。大多数剪切和弯曲增强设计方案是基于匹配特定配置的实验数据的回归调查，这极难以捕捉相关因素之间的真实关系。传统模型使用了依赖于未知因素的既有经验方程假设。为了防止这一问题，创建了机器学习（ML）模型来根据先验实验预测\
  \ FRP 系统加固混凝土梁的剪切强度、弯曲强度界面强度。另一方面，标准方法在建模原理未知或难以发现的情况下并不良好。由于机器学习方法建立于对实验数据的学习和泛化，它们可能会克服这些挑战；此外，它们可以随时间调整解决方案以考虑新信息。为了检查机器学习算法的性能，常用的性能指标有`R`、`MAE`、`RMSE`、`MAPE`、`20-index`和`NS`\
  \ \\[24–31\\]。图 17.7 描述了预测 FRP 增强 RC 梁界面、剪切和弯曲强度的人工智能技术。\n\n![图 17.7 AI 在 FRP 加固\
  \ RC 梁预测中的应用](img/c17-fig-0007.jpg)\n\n图 17.7 FRP 加固 RC 梁预测中的人工智能。\n\n## 17.3.1\
  \ 界面强度预测\n\nCoelho *等人* \\[32\\]使用了人工神经网络（ANN）和支持向量机（SVM）来预测 FRP 系统的界面强度。预期的结果表明，`SVM`模型显著优于`ANN`和`ACI`标准指南。Su\
  \ *等人* \\[33\\]使用多元线性回归（MLR）、`ANN`和`SVM`研究了 FRP 与混凝土基底之间的界面强度。界面强度数据被收集两个部分，命名为`dataset\
  \ 1`和`dataset 2`。对于`dataset 1`的训练数据，`MLR`、`SVM`和`ANN`模型的决定系数分别为`0.80`、`0.82`和`0.72`。对于`dataset\
  \ 2`的训练数据，`MLR`、`ANN`和`SVM`模型的决定系数分别为`0.88`、`0.88`和`0.91`。对于`dataset 1`的测试数据，`MLR`、`ANN`和`SVM`模型的决定系数分别为`0.74`、`0.77`和`0.79`。对于`dataset\
  \ 2`的测试数据，`MLR`、`ANN`和`SVM`模型的决定系数分别为`0.80`、`0.82`和`0.85`。`SVM`模型的整体准确性良好。\n\nChen\
  \ *等人* \\[34\\]通过集成学习（EL）分析了 FRP 与混凝土基底之间的界面强度。梯度提升回归树（GBRT）方法用于 EL 计算 FRP 系统的界面强度，并与`SVM`和`ANN`模型比较。`ANN`模型的训练和测试结果分别为`0.9504`和`0.8373`，`SVM`模型为`0.9535`和`0.8548`，`GBRT`模型为`0.9627`和`0.9269`。结果表明，实际上，该模型的预测结果优秀且准确。\n\
  \nBasaran *等人* \\[35\\]使用规范配方和机器学习模型，如回归树（RT）、`MLR`、`GPR`和`ANN`进行界面强度估计。对于预测的界面强度，`GPR`方法显示出最佳结果，平均值为`0.95`，标准差为`0.14`。当规范中的界面强度估计与实验结果比较时，`ACI\
  \ 440`方程给出最准确的估值。\n\nZhang 和 Xue \\[36\\]采用了两种模型，即随机森林（RF）和基因规划（GEP）来预测 FRP 棒或条与混凝土基底之间的行为。`RF`和`GEP`模型的预测值与观测结果相当。。`RF`模型的验证和训练数据的`R²`分别为`0.780`和`0.962`。同样，`GEP`模型中，验证和训练数据的`R²`分别为`0.80`和`0.87`。根据性能指标，分析结果显示这些模型可以中等准确地预测界面强度。\n\
  \nKumar *等人* \\[19\\]使用优化神经蜂算法预测 FRP-混凝土界面强度。使用了三种机器学习算法，即`ANN`、`GPR`和人工蜂群（ABC）ANN\
  \ 来预测实验数据。`ABC-ANN`和`GPR`模型的 R-值分别为`0.9514`和`0.9618`。在所有机器学习模型和经验模型中，`GPR`模型的可靠性最好。表\
