  \n**关键词：** 云计算、安全、挑战、分析、预防措施、数据安全、隐写术\n\n## 10.1 引言\n\n云计算正在从业务端向消费者端转变[1]。根据最近的研究\
  \ 1，客户在每次检查四个其他云端应用时，其体验是相同的。此外，41%的商业产品在云端发现了巨大的负担。系统责任转移到了云端；云入驻的安全正受到审查[2]。所有计算机应用程序的\
  \ 80%是云端的，49%的组织允许启用云功能。所提传达构型的新颖点是基于 Web 的分布式和虚拟机（VM）开发，为客户提供智能的处理组织并限制组织，从而降低注册成本。不同客户的受益非常显著，《纽约时报》租用了亚马逊的云基础设施，在一天内处理了超过\
  \ 1100 万个故事以为客户转换电子文件[3]；对于一个中等规模甚至数百个开发小组的传统响应的成本，最近建立的协会通过云配置进行巨额资金的假设投资，例如劳动力成本、软件、计算限制扩展的成本，而且极具价值且快速。每个云专家协会都需要确保客户拥有云端数据，并且对该数据的权限应有一定的确认，基本上限制在批准的访问范围内[4]。客户的数据安全、实践和保障方法应得到支持，以确保云客户的数据安全和保险。安全和保障也是不可或缺的观点，正如开发一样，这也增加了成本。由于所有的云连接都需要网络连接，随着互联网成为数据传输的方法，其未经授权的性质会对数据的可靠性造成混乱。今天，有各种入侵者和开发者试图干扰不同的防火墙并获取或束缚客户的数据。在目前的情况下，分布式计算是一种正在形成并快速发展的技术在全球范围内广泛使用。它利用基于互联网的部署的力量，通过计算机或设备按需向客户提供数据、信息和其他资源。这是另一个利用虚拟资源共享数据的开始。Hooray\
  \ 或 Gmail 是分布式注册的一些合适实例。融合医疗保健、银行和准备的各种活动正朝着这一技术发展，这一切是因为使用模型驱动的系统提供的能力，随后，它管理带宽、数据改进、交易和限制数据。多年来，分布式处理一直是信息技术（IT）业务中一种新兴的注册模型。许多大型组织正向其投入资源。它通过整合存储、内存管理和移动速度提供了有用的准备。接受适当的注册对数据安全可以产生积极和消极的结果。本章介绍了关于分布式计算挑战的研究结果。它包括新种的风险以及它们的存在对云客户意味着什么。采用云面临着不同的挑战，包括数据安全、开放性和保护[5]。\n\
  \n它展示了像今天这样使用加密流有多么重要，而没有接近或存档关联。注册安全的重要性是云所提供的不同组织的直接结果。这些组织之一通过云信息跟踪器许可社区限制了客户访问其信息。该服务的劣端是，由于敏感信息的可用性，它构成了安全问题。客户希望世界是一个可以在云端存储信息的好地方。因此，它需要能够在信息安全方面创新的模型。图像隐写术防止未经授权访问信息。图像隐写术在表面覆盖了客户信息。在本文中系统研究了一个关于使用图像隐写术获取云信息的提议新实践的片段。他们使用的评估方法；最基本的获益和障碍评估形式。其次，与隐写术特征相关的模型关系[5,\
  \ 6]。\n\n在本章中，讨论了云计算安全风险预防措施的概述，以往的研究通常描述了跨以下安排的云安全挑战：数据访问、网络问题和虚拟化特性。无论如何，以往的研究没有关注人为错误，即由于云建模师在组织、安排和传递云组织时的疏忽而发生的云安全挑战，或由于客户的不慎率引起的错误。考虑到这一点，它增加了一个名为“人为错误”的表征。本提议系统通过寻找可能由于人类缺乏关注而直接导致安全挑战的论文实现了这一点[7]。\n\
  \n## 10.2 背景\n\n### 10.2.1 云计算的历史\n\n\n\n\n\n要理解分布式计算的定义与本质，观察这种处理模式的演进至关重要。正如阿尔文·托夫勒（Alvin\
  \ Toffler）在其流行著作中所言，发展是以波浪形式进行的（迄为止共有三次：主波浪是农业社会秩序，第二次是现代时代，第三次是数据时代）。在每个波浪内部，都有几个重要的次波浪。在这个后现代数据时代，它正朝着许多人认为的分布式计算时代的起点迈进\
  \ [22]]。以下描述了从传统系统到云系统的快速变化：\n\n> 在云计算出现之前，客户端/服务器计算主要涉及产品应用，信息和控制存储在服务器端。\n> 如果单个客户端需要查找进度或运行程序，该人员最初必须与服务器关联并在继续之前获得准入许可\
  \ [8]]。\n> 随后，分布式处理进入了视野，每台计算机都组织在一起并在需要时提供其资源。\n> 云计算理念之所以是因为上述的注册模式而出现并随后付诸实施。\n\
  \n云计算意味着，与其在计算机或企业网络上拥有整个产品和设备，不如它可能从另一个组织获取所有服务并通过互联网访问，通常以一种完全一致的方式进行。对于客户端来说，设备和程序安排在何处或如何工作并没有区别——它们只是位于互联网地址指向的未知“云”中的某处\
  \ [11]]。\n\n* [Salesforce.com](http://Salesforce.com) 于 1999 年开始通过基础网站向客户端分发应用程序。应用程序通过互联网分发给组织，使计算作为公用服务的梦想更贴近现实\
  \ [21]]。\n* 亚马逊于 2002 年启动了亚马逊 Web Services，提供存储、计算甚至人工智能等服务 [10]]。\n* Google Apps\
  \ 于 2009 年开始提供云计算业务应用程序 [15]]。\n* 所有的核心部分都参与了云计算的发展，有些早于其他时候 [9]]。\n\n![图 10.1 云的开启时代](img/c10-fig-0001.jpg)\n\
  \n**图 10.1** 云的开启时代。\n\n从图 10.1 可以看出，尽管所提到的软件即服务（SaaS）这种分布式计算云安全服务模型在这些服务的提供方式和运行机制上存在显著差异。尽管\
  \ ASP（应用程序服务提供商）通常为不同客户提供类型的服务（与今天相似），但它们是通过专用框架实现的。也就是说，每个客户都有自己的专用应用程序实例，且该实例通常运行在专用的主机或服务器上。SaaS\
  \ 供应商与 ASP 之间的主要区别在于，SaaS 供应商在通用而非专用的框架上提供应用程序访问。事实上，无论大小 IT 企业都遵循标准的 IT 开发方法。云计算数据原语由特定的数据安全专家负责，可以通过以下示例来理解，即：在这个房间里有数据科学家；邮件员工分类防火墙；交换机；调制解器交换机。这种高速系统需要大量的资金来构建这样的系统环境\
  \ [33]。为了解决这一难题并降低 IT 系统成本，云计算出现了。这种注册模型通过互联网为外部购买者提供极其强大（灵活）的 IT 相关能力。云意味着一个组织或网络。云计算允许用户通过网络按需获取硬件和软件等\
  \ IT 资源。它提供了一种低成本的 IT 基础设施配置。由于产品不需要本地引入到计算机设备上，云计算提供了平台自由。随后，云计算允许我们使业务应用程序更移动性和社区化\
  \ [9]]。\n\n#### 10.2.1.1 软件即服务模型\n\n从图 10.2 可以看出，传统的软件购买策略包括客户将产品安装到自己的设备上，以换取许可费用（资本支出，称为\
  \ CapEx）。客户还可以购买维护许可以获取产品补丁或其他服务。客户关注功能框架、修复程序以及与许可协议的一致性。`SaaS` 允许软件开发商控制和限制使用，禁止复制和传播，并对其产品的所有附属形式进行控制。SaaS\
  \ 的统一控制通常允许销售商或供应商与不同的组织和客户建立持续的收入流，而无需在组织的每个设备上都预装软件。\n\n#### 10.2.1.2 基础设施即服务模型\n\
  \n在传统的托管应用模型中，供应商为客户提供整个基础来运行其应用程序。通常，这涉及为该特定应用程序购买或租赁专用设备。IaaS 模型也同样提供了运行应用程序的框架，但分布式计算方法使得按需付费和按需扩展服务成为可能。从\
  \ IaaS 供应商的角度来看，它可以构建一个处理客户请求峰值的基础，并在总需求增加时添加新限制。本质上，在托管应用模型中，IaaS 供应商可以涵盖应用程序托管，也可以联系不同的服务（例如，应用程序支持、应用程序开发和升级），并维护更全面的\
  \ IT 重新配置。\n\n![图 10.2 云服务的类型和架构](img/c10-fig-0002.jpg)\n\n**图 10.2** 云服务的类型和架构。\n\
  \n#### 10.2.1.3 平台即服务模型\n\n在平台即服务（PaaS）模型中，供应商为应用程序工程师提供一个开发环境，由他们开发应用程序并通过供应商的平台提供这些服务。供应商通常创建工具栈和开发标准，以及分发和安装渠道。供应商通常为提供平台和交易及循环服务获取费用。这使得应用程序能够快速传播，因为部分成本较低，且利用了现有的客户获取渠道。\n\
  \n### 10.2.2 云的类型\n\n公有云：谷歌、亚马逊、微软等公司提供公有云选项。公有云向公众提供基础设施和服务；公司获得该基础设施和网络的一部分。成百上千的人共享资源。公有云允许公众简单地访问配置和服务。由于其开放性，公有云的安全性可能较低\
  \ [10]]。\n\n\n\n\n\n私有云（Private Cloud）：私有云许可关联和管理应在协会内部访问。私有云安排利用由组织拥有或受其限制的框架，或者它们可以权威地要求处理该基础的商家满足某些规则。由于其私有性质，这种模式更为流行。\n\
  \n社区云（Neighborhood Cloud）：社区云允许一组组织使系统和服务可用。\n\n混合云（Hybrid Cloud）：混合云系统结合了公有云和私有云资源。由于组织必须管理多个平台并选择数据的存储位置，这是一种更复杂的云解决方案。希望在私有云上保护机密信息，但在公有云上创建更通用、面向客户的材料的企业，就是混合云解决方案的一个示例\
  \ [11]。\n\n## 10.2.3 云服务模型\n\n云计算基于服务模型。这些模型被分为三种基本服务模型，如图图 10.3\n\n图 10.3 云计算服务。\n\
  \n**软件即服务 (SaaS)：** 它是最复杂的分布式计算类型。尽管客户端不接触外部事件或资产，但 SaaS 应用可以直接向互联网浏览器提供出色的功能。SaaS\
  \ 世界允许终端用户将应用程序作为一种服务来使用。\n\n**基础设施即服务 (IaaS)：** IaaS 或“基础架构即服务”，是第二种云管理。这种云平台通常是全面的，大部分由全职工程师和大型项目客户使用。虽然\
  \ SaaS 和 PaaS 允许使用云应用并创建应用程序，但 IaaS 为在云环境中创建、执行和存储程序提供了框架。IaaS 的优势在于设计人员在无需现场保留任何实际设备的情况下，拥有几乎无限的容量和计算限制。IaaS\
  \ 提供了包括服务器、存储、虚拟系统和虚拟存储在基础资源 [12]。\n\n**平台即服务 (PaaS)：** 它提供了运行时环境，以及开发和部署工具。平台即服务是第三种云服务，为开发者提供了对专用\
  \ API 的访问，允许他们创建在特定环境中运行的应用程序。虽然开发者被允许设计他们想要的任何程序，但该程序受限于构建它的平台。这种开发应用程序的方法成本很低（在某些情况下甚至是免费的），并允许使用成熟云公司的基础架构和工具来构建或迁移现有应用程序。这还允许向大量人员立即提供软件。\n\
  \n## 10.2.4 云计算的特征\n\n1. 灵活性：云在分散的注册环境中工作。它在客户之间分配资源，并且运行速度极快。\n2. 高开放性和可靠性：服务器的可用性高且更健壮，因为发生系统故障的概率微乎其微。\n\
  3. 高可扩展性：意味着在大范围内“按需”配置配置资源，而无需为高负载配备工程师。\n4. 多租户：通过分布式计算，不同的消费者和请求可以通过共享标志性结构更有效地共同工作，并降低成本。\n\
  5. 设备和位置自主性：云计算允许客户通过网络程序获取结构，而无需占用其物理空间，无论他们使用的是什么设备，例如电脑、手机等 [13]。\n6. 低成本：通过使用分布式计算，成本将降低；IT\
  \ 组织无需建立自己的系统并根据资源的使用情况付费。\n\n## 10.2.5 云计算的优势\n\n分布式计算技术具有一些优势 [14]。\n\n1. 为客户降低计算机成本：在云中，不需要操心一台巨大的（且同样昂贵的）计算机来在网络应用程序上运行分布式计算，因为应用程序运行在云端而不是本地工作站。\n\
  2. 降低 IT 基础设施成本：通过使用分布式计算，不需要将资产投入到更大数量的物理服务器中。此外，不需要 IT 员工来管理这些惊人的专业设备。\n3. 更少的支持成本：分布式计算的维护成本从根本上减少了组织的硬件和软件维护成本。\n\
  4. 软件费率低；这降低了该物品的成本，因为不需要为每个系统购买单独的软件组。\n5. 分布式计算中的即时程序更新优势是客户无需在旧计划和维修费用之间做出选择。如果程序是电子设备，预发布是正常的，客户在进入云端时可以再次获得。\n\
  6. 增加准备能力；服务器距离云的距离要高得多。估计应用程序非常快。\n7. 无限制的存储空间；云提供了更大的限制，例如至少有 2000 GB。\n\n## 10.2.6\
  \ 云计算的挑战\n\n数据窃取：随着时间的推移，互联网普及率提高。然而，随着使用互联网人数的增加，数据窃取的风险也随之增长。互联网用户中存在大量的攻击者和黑客\
  \ [15]]。\n\n客户应该意识到提供者的加密和备份程序。例如，许多电子邮件提供商会对邮件进行加密，使其员工无法读取。客户应定期审查这些措施，以确定它们是否满足其需求。\n\
  \n网络负载：云负载也会影响云计算系统的性能。当网络负载超过某个阈值时，计算机将无响应。这是一个阈值限制。由于磁盘和计算机内存之间的大量数据移动，计算机和服务器会出现故障。\n\
  \n\n\n\n\n# 标准的不成熟性\n\n在云中，标准尚不成熟，且事物正以惊人的速度变化。不同的 IaaS 和 SaaS 供应商使用着不同的技术和标准。Amazon\
  \ 的存储系统与普通数据中心有所不同。Azure 的存储引擎不使用传统的关系型数据库，Google 的 App Engine 也是如此。因此，不能简单地将应用程序迁移到云端并期望它们能够运行。将应用程序迁移到云端所需的精力至少与将其从现有服务器移动到新服务器的精力一样多。还存在人员能力的问题；员工可能需要重新培训，并且他们可能恨并恐惧迁移到云端\
  \ [18]]。\n\n### 10.2.7 云安全\n\n云安全，通常命名为云计算安全，是一系列旨在保护基于云的基础设施架构、应用程序和信息的各种安全工作。这些防护措施确保了客户端和设备的验证、对控制面板的访问和资产的访问，以及信息安全保障。它们还有助于信息安全和管理合规性\
  \ [16]]。\n\n### 10.2.7.1 基础安全\n\n在调查主机安全和评估风险时，应当考虑云管理服务的交付模型（`SaaS`、`PaaS` 和 `IaaS`）以及部署模型（公共、私有和混合）。尽管没有已知的针对分布式计算的特定新风险，但某些虚拟化安全风险（例如\
  \ `VMs` 逃逸、框架配置漏洞以及通过薄弱的访问控制对 `hypervisor` 实施的内部威胁）已进入公共云计算环境。分布式计算的独特性（灵活性）从安全治理的角度来看可能会带来新的功能性挑战。这种功能模式促成了快速配置和\
  \ `VMs` 的快速迁移。与此相比，管理漏洞和补丁比简单运行输出要困难得多，因为其进展速度远高于传统的服务器农场 [22]]。\n\n### 10.2.7.2\
  \ SaaS 和 PaaS 主机安全\n\n通常，云服务提供商（`CSP`）不会自由共享与其主机平台相关的数据、操作系统以及用于设置主机的循环，因为开发人员在尝试入侵云管理服务时可以利用这些数据。因此，对于\
  \ `SaaS`（例如 `Salesforce.com`、`Workday.com`）或 `PaaS`（例如 `Google App Engine`、`Salesforce.com`\
  \ 的 `Force.com`）云管理，安全性对客户来说是模糊的，而获取主机的责任交给了 `CSP`。为了获得 `CSP` 对其主机安全状况的确认，这要求供应商根据协议共享数据，或者让\
  \ `CSP` 通过受控的评估系统共享数据，例如 `SysTrust` 或 `ISO 27002`。从控制确认的角度来看，`CSP` 需要确保建立起适当的预防性和调查性控制，并应通过外部评估或\
  \ `ISO 27002` 类型的评估系统来确保等性 [33]]。`PaaS` 和 `SaaS` 平台都是动态的，并且通过主机治理层向终端用户隐藏主机操作系统。`PaaS`\
  \ 和 `SaaS` 之间的一个重要区别在于隐藏应用程序所用操作系统特性的治理层面的开放程度。由于 `SaaS` 的原因，反射层对客户是不可见的，仅供设计人员和\
  \ `CSP` 的运维人员访问，而 `PaaS` 客户会被作为 `PaaS` 应用程序编程接口的主机治理层的后门访问，从而与主机反射层通信。因此，`SaaS`\
  \ 或其他服务取决于 `CSP`。\n\n\n\n\n\n云安全正与威胁同步进展，经常观察到这些威胁已经超过了能够完全规避事故的程度。由于其复杂的本质、错综复杂的工程以及共享资源，云计算对所有成员都构成了新颖且真实的风险。理解风险并充分缓解风险对于所有合作伙伴和从业人员来说至关重要。对于潜在风险，应该通过采用标准程序和开发创新将安全融入到云计算平台的每个层级。为了充分确保云平台，客户、供应商、专家、传输、审计师和其他所有人都应该针对风险采取必要的措施。\n\
  \n### 10.2.8 云计算应用\n\n分布式计算主要与客户的便利性相关，这可能包括全球旅行。客户需要来自不同地区的设备无缝连接组织。客户需要便利并共享基础设备。设备丢失也可能是一个问题。因此，满足这些需求的应用具有巨大的魅力。安全应用程序、灾难缓解、包括远程通信在内的群体计算是获取灵活分布式注册应用程序集合的主要竞争者。Apple\
  \ 和 Google 都提供云应用，例如 Apple 的 iCloud 和 Google 的紧凑邮箱组织。主要的跨国公司——交付和开发平台（App Engine）以及实用工具（Google\
  \ Apps）。低成本设备的可扩展软件系统、创意性应用、易于开发、维护和扩展。云中心客户越多，繁荣程度越高。在线业务是基于业务的 SaaS 和 PaaS 模型。融合整个网络的云计算服务、云安全组织、个人和企业的互联网数据支持。更多云的使用显示在图\
  \ 10.4 中。\n\n业务应用依赖于云端的专业团队。今天，每个合作伙伴都需要云业务应用程序来扩大其业务。它为客户提供 24\\*7 的类似的商业服务[19]。\n\
  \n数据存储和应用程序分（数据、报告、图像、声音和账户）存储在云端，并通过网络连接获取这些信息。云提供商负责安全；因此，他们提供一站式媒体恢复应用程序来恢复丢失的数据。\n\
  \n![图 10.4 云计算的应用领域。](img/c10-fig-0004.jpg)\n\n图 10.4 云计算的应用领域。\n\n云在学校应用指南领域的注册是惊人的。它为不同级别的在线远程教育和想要学习的学生提供信息服务。在辅导领域使用云的潜力在于它可以用于虚拟虚拟教室场景；易用性；安全数据收集；灵活性；这些是学生更具可性和可用性的基本硬件要求。娱乐应用媒体机构使用多云方法与理想的参与方建立接口。循环处理提供了不同的重定向应用，例如网络游戏和视频会议。执行应用程序云处理提供了独特的云看板设备，帮助主席管理广泛的云工作，类似于资源规划、数据整合和灾难恢复。这些组织设备还提供了对平台、应用程序和设施的行政控制。\n\
  \n## 10.3 文献综述\n\n本文评估了信息安全问题的适当处理，包括信息传输的安全性、删除安全和繁荣因素。关注大规模数据看板的云安全评估，并指出这种分布式计算进展的突破，试图列出不同的系统和长期趋势。最后部分是对基于注册的安全问题的未来趋势的概述和观点[20]。通过一项性研究，其目的是保护专家们用于应对这些安全挑战的理论，并对这些挑战的保护工作进行了组织。他们的发现表明，毫无疑问，在云选择中经历的安全挑战诉求中，将人为错误作为一类是有道理的，如果云导向网络及其客户完全了解在云中经历的安全挑战，这两大参与者可以从这种注册模型提供的利益中充分受益[21]。该领域将首先重点基本思想并分离与分布式处理的安全问题[22]。然后，它通过讨论其趋势和现有计划（如果有）来培养每个问题。在本文中，系统对云步骤提供的安全评估进行了评估。基础加密安全算法；例如双加密标准（`DES`）、高级加密标准（`AES`）经过审查，考虑了这些评估指标的身份并介绍了它们的结果。与其他框架相比，用于实施云学习的一些框架完全消失；它们被深入分析，并通过检查当前详细信息的局限性提供了安全方面的概述。最后，它为我们提供了不同的配置并提供了一个可以看到它们之间依赖关系的云安全架构。该系统面临与五个订单谈判的安全机会。它报告了区域内的九种不同通用攻击并评估了合理性。本文或部分需要出现在信誉第三方出版物来源或参考文献，描述适当的注册请求，包括资格和问题[10–15]。\n\
  \n## 10.4 云计算挑战及其解决方案\n\n云计算中存在不同的安全问题和困难，因为它包含了关联、数据库、工作结构、虚拟化、资源安排、看板、同步控制和内存主机等各种技术[8]。这是基础性的，因为云专家社区应该确保客户不会面临任何重大问题，如数据灾难和数据盗窃，根据云中设置数据集的脆弱性，可能会导致巨大的事故。恶意客户可能声称是真实客户并污染云[20]。\n\
  \n有许多安全问题需要检查：\n\n\n\n\n\n### 安全问题：\n\n信息泄露在适当的配置中仍然是一个巨大的问题，因为客户可能会将所有普通、私有甚至是敏感的数据存储在云端，而任何人可以在任何地方访问这些数据。数据伪造是目前云计算专家协会正在关注的一个非常典型的问题。此外，由于成本合理性和灵活性的考虑，某些云专家中心甚至不提供自己的员工。此外还存在诸如数据灾难之类的事件，这对客户来说可能也是一个重大问题。例如，专家意外关闭导致客户的数据丢失。此外，灾难性事件还可能导致数据损坏或毁坏。因此，实时数据区域可以被视为云计算注册中的安全问题之一`[19]`。\n\
  \n信息问题：云计算专家社区应该批准其自身的计划，以确保客户在他们的云模型中留存的数据安全。他们应该确保自己了解谁实际上在访问存储在云端的数据集，并且只有授权的个人才能感知云组织模型`[8]`。适当注册的安全性应在提供者侧实施，而不仅仅是客户侧。云专家社区应该为客户提供良好的安全保护层，而客户不应修改其他客户的数据。适当的处理是一种降低成本并提供更大限制的体面策略，前提是提供者和客户都执行了安全工作`[9]`。确保合规性变化对于保证云端复杂数据至关重要，因为适当处理中最棘手的观点之一就是确保客户对他们数据的保险和安全的信任。\n\
  \n应用问题：\n\n检查和维护应该由云专家协会承担很大一部分机会，以确保云是安全的，并且被那些不固定的开发者迁移到云端的恶意代码污染，这些代码旨在获取敏感信息，或损害特定客户的信息。\n\
  \n在`图 10.5]`中，云环境中的各种威胁分类如下：\n\n![图 10.5 根据云服务器通信的云计算架构](img/c10-fig-0005.jpg)\n\
  \n`图 10.5` 根据云服务器通信的云计算架构。\n\n1. **网络负载**：云网络负载也会影响分布式计算框架的呈现。当网络负载超过限制时，系统会变慢。这个限制就是阈值。由于磁盘和内存之间海量的数据移动，系统和工作节点之间发生冲突。当限制超过\
  \ 80% 时，销售者将确保他们的服务并将损坏传递给客户。这是导致暂时性断电的众多原因之一`[21]`。\n\n2. **数据脱敏**：信息过滤是测试和开发数据集中隐藏敏感数据最常用的方法，通过用与原始数据合理但虚假的同类型信息来覆盖原始数据来实现。这种方法被用于确保数据安全。当一个功能设备从管理中删除或移动到其他地方进行存储时，出于安全考虑，会对该信息数据应用数据脱敏程序。这种方法也适用于用于恢复的增强副本。覆盖是用于数据过滤的程序之一。\n\
  \n3. **数据位置**：企业面临的最广为人知的一致性问题之一是数据区域。在分布式计算中，数据分散在世界不同部分的工作节点上。客户不知道其/她的数据区域。信息可以出现在世界的任何部分。这种情况使得很难确定是否建立了足够的保护。\n\
  \n4. **数据位置限制**：每个国家都有自己的法律法规。由于法律的变化，这很难确定是否建立了足够的保护以及是否满足了法律要求。由于法律的变化，美国受到某些法案的深远影响，这些安排允许政府获取私人数据。因此，当数据跨越边界时，由于\
  \ 2001 年 9 月 11 日恐怖袭击后出台的法案的影响，数据安全无法得到保证`[22]`。\n\n5. **缺乏网络犯罪法律**：许多国家缺乏网络犯罪法律。大约\
  \ 52 个国家对网络犯罪做出了反应，其中只有澳大利亚、日本和美国等十国拥有完整或更新的法律。巴西、智利和波兰等九国也有某种程度的法律。然而，有 33 个国家没有法律。十三个国家没有采取严肃行动。在这种情况下，如果数据被迁移到没有完全更新网络犯罪法律的国家，数据的安全可能是危险的。\n\
  \n6. **服务的可用性**：虽然旨在提供高可靠性和可用性的结构，但客户仍会遇到故障和服务中断。服务没有 100% 的稳定性。服务可能会受到某些原因的阻碍，如流量、设备故障等。存在这样的宕机案例：2008\
  \ 年 6 月 17 日 Amazon S3 宕机 5 小时`[30]`，以及 2008 年 8 月 11 日 Gmail 网站无法访问 1.5 小时`[42]`。这使得客户由于服务不可用而受到困扰。\n\
  \n\n\n\n\n### 8. 数据隔离\n当客户信息在通用模式下可用时，客户应确保信息是安全的，不会被不同的客户获取。由于信息可能包含个人数据，例如财务余额数字、密语等，云供应商应通过信息隔离来处理这些信息的安全性。信息加密是提供信息隔离的一种保护方法。客户应该询问专业机构是否已尝试过加密执行。因为事故的发生是因为加密技术执行不力导致的。在存储客户的所有数据之前，应应对客户信息进行加密，然后再进行存储。在客户恢复信息之前，应对该特定客户的信息进行解码，然后将数据交给客户。同样，发现谁访问了解密密钥也是重要的\
  \ [23]。\n\n### 9. 内部人员访问\n存储在云供应商员工处的信息理论上可能被该机构的代表获取，且标准人员对这些人个人拥有控制权。这也是云计算的另一个负面特征。专业合作机构不应允许员工访问云端客户的信息。这种访问权限决定了信息的安全。代表可能会接触客户的私有数据，员工可能会滥用此类数据。这不仅会影响客户，还会影响品牌形象和专业合作机构的财务效益。为此，客户在将秘密数据存入云端之前应该考虑，并获取有关访问和管理信息的员工的一些信息。\n\
  \n### 10. 长期可行性\n专业机构应确保在合并和收购等不断变化的业务环境中信息安全。客户应确保在这些情况下信息的可用性。供应商的服务条款可能不会揭示真实的所有者。购买者可能是行政机构、外包办公室或互联网新闻服务机构。如果行政办公室拥有该供应商，允许向成员共享的服务条款可能会导致客户的全部数据在没有任何额外通知或互动的情况下被调查人员或知识部门获取。此外还存在一些第\
  \ 11 章问题。破产对客户信息构成了威胁。专业合作机构应审慎地与资助者贷款人安排协议。另一种安排可以是保护合同，该合同可以在破产后一段时间内提供运行基础的资金\
  \ [24]]。\n\n#### 10.4.1 云端挑战的解决方案与实践\n随着许多客户开始理解其益处，云环境已变得广为人知。它允许客户方便地提取移动并有助于节省成本。然而，随着云组织收集速度的加快，安全问题和风险也随增加。为了使分布式处理成为比构建客户收集终点并安全存储其有序数据的更好的选择，目前有效的解决方案和实践相对较少\
  \ [25]。\n\n**漏洞保护：** 云专家社区还应促进补板的修复。他们应该检查其云组织的漏洞，并通用且可靠地恢复并对云端保持警惕，以限制可能的路径并减少开发者对云的攻击风险。云专家中心还可以使用\
  \ `Intrusion Detection System` 来确保云组织的安全与。\n\n**明智使用云组织：** 存储在云端的数据应该是私密的，云专家协会不应获取这些数据\
  \ [23]。存储在云端的数据应经过混合，以确保客户信息的安全。任何需要访问云数据的人员在执行操作前都应征得客户的同意。\n\n**安全事件监控：** 客户应与云专家社区达成明确共识，以便客户能够确保云端存储的敏感数据发生任何事件或泄漏。在使用特定云专家协会提供的云组织之前，客户应与云专家协会达成明确的同步。客户应确保云专家社区提供有关执行的充分知识，以确保漏洞修复并确定概率\
  \ [26]。\n\n**数据存储规则：** 云环境的设计是确保云端存储数据安全的关键点。客户应该了解云专家协会遵循的数据收集规则的可能性。提供符合可靠规则安全计划（例如数据保护法）的云专家协会通常是最佳选择。\n\
  \n**恢复场所：** 在根据明确问题发生任何数据事故的情况下，云专家社区应对恢复客户数据的风险。云专家社区应确保他们拥有适当的支持，并能够恢复和提取可能极端的客户私有数据。此外，云专家社区还可以通过有关确保数据恢复的交易来执行以下操作：\n\
  1. 在灾难发生时利用最快的磁盘开发进行数据复制。\n2. 修改损坏的页面限制。\n3. 预测并更换危险设备。\n\n**应急系统：** 客户必须获得他们需要保留在云结构中的数据。云专家中心应提供一个框架，允许客户提交并规划硬件部分，如\
  \ `firewalls, switches, laborer and mediator specialist`。\n\n**访问控制：** 云专家协会应建立具有权限的数据访问控制，且无论如何，访问数据的客户都应经过云专家协会的确认。云专家协会应确保只有受支持的客户可以访问云存储的数据。该方法有助于减少未经授权客户访问数据的风险，并在需要为存储脆弱数据提供更安全的环境。\n\
  \n\n\n\n\n在讨论安全问题之前，首先理解云的定义和顺序。分布式计算要强大得多，可以根据需求进行更新。它可以通过任何真正重要的方式来实现。在大师社区的帮助下，可以以个人方式使用互联网而无需任何收入。云关乎事物的创新与交互，为反思和评估提供了更好的建议方案。正如《云计算参考架构》所述，附近有五位伟大的表演者被他的安全思想所吸引。本报告重点关注客户和云提供者的风险和信息碎片，如图\
  \ 10.5 所示 \\[27\\]。\n\n- **云消费者**：与个人或组织建立有关系的云提供者：\n- **云提供者**：个人；为联盟或参与者提供帮助；\n\
  - **云审计员** - 云协会的一部分；与数据框架相关的职责；对云管理性能和安全性进行免费评估；所有权- **云经纪人**：一个实体，它促进执行和发展，并促进云用户之间的集成。\n\
  - **运营商**：是一个将云提供者和云团队整合在一起的枢纽。\n\n### 10.5.1 云中的通用安全威胁\n\n随着云安全挑战引导着社交互动，它增加了供应的需求。目标是理解并整合过去研究中的云安全挑战，并通过新新年期间面临的挑战使云智能挑战更加全面。在我们的评估期间，考虑了相关原因；通信形式；网络问题；信息可能性；无云危险；虚拟化问题；董事会事务。发现了一系列包含内容传输的文章。\n\
  \n云安全问题的类型和依赖关系是这项工作的一部分。它已对当前的云安全问题和分类安全计划进行了最佳分析。28 个安全问题列在五类中（表 10.1）。提供了对当前安全计划和高层反击的全面概述\
  \ \\[29\\]。拟议工作预计组 1 中描述的安全关注将根据“五大指令”进行总结。云安全关注点涵盖了几个计划和四个插图。\n\n- **(C1)** 安全标准规范管理机构和监管机构，他们展示云安全哲学以确保无尘的工作场所。这涉及团队级的方法；评估与客户之间不同的策略；本地知识和各种附件。\n\
  - **(C2)** 网络类指云框架和客户端之间的一个中间组，用以实现最佳评估。它选择性地选择程序，提供网络连接和数据交换。\n- **(C3)** 访问控制是一种客户端管理类，提供文档的访问，涉及建议和支持问题。\n\
  \nTable 10.1 云安全挑战分类。\n\n| 趋势 | 解释 |\n| :--- | :--- |\n| 加密 \\[25\\] | 1. 在传统的 IT\
  \ 中，加密已成为信息安全的支柱，在分布式计算的世界观中它将继续如此。信息安全和信息可信度是两个关键保障。<br> 2. 然而，在云环境中，加密用于保护存储或传输过程的数据。然而，加密的有效性取决于密钥的强度和管理。\
  \ |\n| 数据血缘 \\[11\\] | 1. 数据血缘跟踪数据从源地到目的地的移动。这对审计和合规至关重要。<br> 2. 在云中，数据血缘的追踪可能复杂，因为数据通常由许多不同的和服务工具处理。\
  \ |\n| 静态数据 \\[26\\] | 1. 静态数据是指存储在物理介上的数据，如硬盘或磁带。<br> 2. 为了保护静态数据，组织使用加密和访问控制确保只有授权用户可以访问存储的数据。\
  \ |\n| 进行中数据 \\[40\\] | 1. 进行中数据是指正在跨网络移动的数据。<br> 2. 为了保护进行中数据，组织使用加密和安全协议确保数据在传输过程中不会被截获或篡改。\
  \ |\n| 传输中数据 \\[33\\] | 1. 传输中数据是指从一个地方到另一个地方移动的数据。<br> 2. 为了保护传输中数据，组织使用加密和安全协议确保数据在传输过程中不会被截获或篡改。\
  \ |\n\n- **(C4)** 云基础设施的整合整合 SaaS、PaaS 和 IaaS 中的安全问题，特别是与虚拟化环境有关。\n- **(C5)** 数据类描述了信息安全和投诉问题\
  \ \\[30\\]。\n\n\n\n\n\n### 8. 编程接口与浏览器脆弱性\n云供应商系统或接口的任何缺陷，当与蓄意的安排或基于程序的攻击结合时，往往会产生巨大的危险；这种破坏性可能是根本性的。\n\
  \n### 9. 业务模式的改变\n分布式处理对云客户的业务计划可能是一个巨大的改变。IT 部门和业务需要改变或提高对风险的感知。\n\n### 10. 额外用途\n\
  循环计算的某些组件可能被用于恶意骚扰目的，例如利用使用足迹来发送僵尸网络或 DDoS 攻击。\n\n### 11. 恶意内部人员\n有害的内部人员无疑是一个巨大的风险，无论如何，云提供商的危险内部人员都可能对许多客户造成破坏。\n\
  \n### 12. 可用性\n结构按照需要运行的概率。\n\n在表 10.1 中讨论了云威胁的分类。\n\n根据这一阶段，它感知到了具有七类云安全问题的演变：会话/黑客\
  \ Cookie - 会话和权限通常用于保证程序中客户端的凭据。如果其中任何一个受到威胁，它们就可以被用来完成关键攻击，或者攻击者可以提供误导性证据，并将客户变成事故中的其他协助。为了执行这种攻击，攻击者利用云结构中的缺陷或客户端中的恶意软件；一些主要的安全威胁如图\
  \ 10.6 [32]。\n\n#### XML 签名绑定\nXML 证书是用于从云中各种信息源实时传递消息的方法 [16]，一种不同的、经过认证的加密系统。攻击者可以劫持简单对象协议消息；它通过整合用于移动到云端的传输和信息，增强了由确认的发送者发送的消息。这通常会欺骗客户考虑并采取控制措施\
  \ [34–38]：\n\n1. **端到端加密**：云传输模型中的信息可能会穿过多个地理区域；从头到尾对信息加密。\n2. **扫描恶意活动**：在强烈建议的情况下进行端到端加密会引发新的风险，因为加密信息无法被防火墙读取。因此，要采取适当的控制和应对措施，以减轻恶意程序通过加密的风险。\n\
  3. **云购买者验证**：云供应商需要谨慎地监控云购买者，以防止云的重要组成部分被用于恶意攻击目的。\n4. **安全的接口和 API**：接口和 `APIs`\
  \ 对于实现自动化、组织和管理至关重要。云供应商需要确保任何漏洞都得到缓解。\n5. **内部攻击**：云供应商应该谨慎地筛选员工和外包，同时加强内部安全框架以防止任何内部攻击。\n\
  6. **安全使用资源**：在共享/多租户模型中，云供应商拥有安全的共享资产，例如 `hypervisor`、组织和监控工具 [39, 40]。\n7. **业务连续性计划**：业务连续性计划是针对任何导致整个或部分业务基础周期不可用的事件做出反应的存档方案。\n\
  \n表 10.2 主要安全问题的解释。\n\n| 挑战 | 安全威胁类型 | 主要安全问题 |\n| --- | --- | --- |\n| **动态环境**\
  \ | 云上条件的灵活构想，使得虚拟事件的理想持续感知性变得困难。保护此类环境需要持续的披露、安全评估和保护它们的积极举措。 | |\n| **不佳的身份和访问管理**\
  \ | | |\n| 1. 账户劫持 | 如果云商控制台或编程接口凭据丢失，组织之外的恶意攻击者可以获得云环境的控制权。 | |\n| 2. 数据泄露 | 产品存储桶和数据库的访问权限漏洞导致敏感数据暴露，这是云端数据泄露的重要原因之一。\
  \ | |\n| 3. 恶意内部人员 | 试图获取管理员/root 权限的恶意内部人员可能会导致敏感信息和系统的丢失。 | |\n\n\n\n\n\n## 4.\
  \ 云资源的滥用和恶意利用\n云记录账户被劫持可能导致恶意客户端利用被攻破的资产发送 DDOS 攻击、垃圾邮件和钓鱼攻击，使组织面临法律风险。\n\n## 5.\
  \ 尽职调查不足\n处理信息并受行政合规条例约束的组织，需要有一套清晰的云迁移方案，否则将构成安全威胁和法律风险。\n\n## 云安全威胁与挑战\n\n*  \
  \ **边界定义**：云责任通常跨越几个不同的地理区域和环境，使得很难在中间层进行资源管理。\n*   **工作负载威胁**：\n    1. **高级持续威胁**：恶意软件和高级持续性威胁（APT）一旦进入环境，就会适应安全防护并在长期内在环境中立足，在此期间进行自我复制，当它们到达预定目标时，将泄露敏感信息。这些威胁难以识别和修复。\n\
  \    2. **漏洞**：由于云服务是多租户的，涉及权限提升和边界越权的的漏洞可能导致数据泄露，并使应用程序和云基础设施变得脆弱。\n    3. **不安全的应用程序接口**：为应用程序提供不同服务的不安全\
  \ API 可能导致应用程序面对已知攻击时毫无还，并导致应用程序停机或数据泄露。\n*   **对实际安全的控制**：当组织完全放弃对实际安全的控制时，保护传输中和存储中数据的责任就落到了客户身上。公云的虚拟化和多租户特性使得组织不断关注最新漏洞并在必要时采取修复措施至关重要。\n\
  *   **网络威胁**：\n    1. **DOS 和 DDOS 攻击**：糟糕的网络划分和防火墙板导致云资源成为 DOS 和 DDOS 攻击的目标，从而导致应用程序执行不佳甚至应用程序宕机。\n\
  \    2. **数据渗透**：糟糕的出站防火墙控制会导致受受的作业发起的数据渗透尝试。\n\n在 `表 10.2` 中，列出了每种威胁类别主要的云安全问题和挑战。\n\
  \n## 10.6 使用隐写技术的云数据保护与安全\n\n隐写是解决此问题的方法之一。这些方法增加了敏感数据的安全性，因为允许隐藏其他内容（例如视频）。本系统讨论的是利用图像隐写来传输云数据\
