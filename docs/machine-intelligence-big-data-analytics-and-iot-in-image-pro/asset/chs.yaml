  \ AD 分类性能。\n\n## 1.5 结论\n\n本章讨论了使用传统 `DL` 模型和迁移学习（TL）进行二分类和多类分类的方法。阿尔茨海默病是发达国家死亡的主要因素。从科学角度来看，计算机辅助算法取得了良好的结果，但在实践中仍缺乏可用的技术。在过去的几年，`DL`\
  \ 模型变得日益流行，特别是在 AD 分类方面。从头开始训练模型有时是不切行的，因为训练过程非常耗时，且需要大量的训练数据来使其工作。对于人脸识别，数据集中有数十亿张图像；因此，研究人员可以使用在数据集上预训练的\
  \ `CNNs` 对神经影像数据进行分类。因此，研究人员能够更高效地使用预训练模型，如 `VGG` (16, 19)、`ResNet` (121, 161, 169)、`LeNet`\
  \ 和 `Inception` 来从头构建模型。研究人员实现了 AD 对 NC 的最高率（约 99.5%），相对于二分类（AD 对 MCI, MCI 对 NC,\
  \ cMCI 对 ncMCI）、三分类（AD 对 MCI 对 NC, AD 对 cMCI 对 ncMCI）和多类分类（NonD 对 VM 对 Mod）。\n\n\
