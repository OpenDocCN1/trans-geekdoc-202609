  \n基于物联网的智能灌溉与作物推荐\nN. Joys Kumari¹ N. Thirupathi Rao² Debnath Bhattachya³\n\n##\
  \ 1. 注释\n\n1. innervasu.mutti@gmail.com\n\n## 摘要\n\n农业是一个与其他完全不同的领域。灌溉、施肥和作物轮作是三个关键方面。主要目标应该是最大化新技术的使用和协作。用于农业推荐的相关\
  \ `RVA` 算法允许农民以某种方式进行灌溉。通过该系统的多个传感器，土壤水分含量和湿度可以预测未来情况。实验表明，智能灌溉在比传统灌溉消耗更少水的情况下产生更高的产量是最有效的技术。\n\
  \n**关键词：** 土壤水分含量、产量、物联网、机器学习\n\n\n\n\n根据印度工业联合会（CII）`[4]`的研究，印度的农业技术动能正在增强。在农业领域，已有\
  \ 500 多家农业科技初创公司正在使用`AI`、`ML`和其他先进技术来提高效率、生产力、产量、农业金融和其他关键的农业服务。越来越多的种植者开始采用由`IoT`提供的新技术，以满足日益增长的人口需求并提高其`IoT`\
  \ 运行的效率。得益于利用`IoT`技术的新型“智能农场”应用，农业将减少浪费并提高产量。灌溉在农业中至关重要。在 19 世纪`[5]`之前，古埃及的居民就采用多种方法来灌溉植物。埃及人是第一批在房屋中安装喷淋器的人，而这已经是几千年前的事了。\n\
  \n这种喷淋头上有许多喷嘴，软管呈弓形，可以来回移动。由于技术的进步，灌溉等基础操作在 20 世纪 50 年代变得不再那么重复和耗时，从而导致了自动灌溉系统的诞生。喷淋系统在\
  \ 20 世纪 50 年代首次引入时，最初被用于微型草坪。因为这种自动浇水系统不需要你时刻关注某块土地，所以非常方便。智能灌溉系统是灌溉行业的下一个大趋势。它使得通过考虑作物的情况来减少用水成为可能。最常见的用水方法是灌溉。智能灌溉是一种人工为土壤浇水的方法，使作物生长茂盛。自动系统的使用使得管理和监控向作物的水流量变得更加简单，从而减少了植物的用水。专家表示，在节水方面，智能灌溉系统和控制器比普通的灌溉控制器更优。\n\
  \n大量的受控研究结果表明，可以节约 40%到 70%的水。根据灌溉协会（`IA`）和加利福尼亚州立大学国际水技术中心进行的研究`[6]`，智能灌溉控制器比普通灌溉控制器可以多节约\
  \ 20%的水，其耗水量更少。`IoT`负责智能灌溉系统`IoT`的运行。当数据在网络上传输而无需在人或计算机之间进行交换时，这被称为`IoT`。基于这种方法的灌溉系统能够与传感器等计算机设备接口，并并通过互联网向`cloud`传输实时数据，使其能够正常且高效地运行。正因如此，使用该系统的个人`[7]`将不再需要在农业或灌溉用途的土地上四处奔波。然而，植物灌溉有时是一项漫长且耗时的任务，需要大量人员参与才能在合理的时间内完成。以前，所有工作都由一个人完成。为了减少员工人数和浇水花费的时间，越来越多先进的方法将被使用。\n\
  \n## 6.1.1 问题背景\n\n### 6.1.1.1 水资源管理的必要性\n\n\n\n\n水资源管理在水资源有限的国家至关重要。这会对农业产生影响，因为大量水被用于农业生产。全球变暖的[11\\\
  ]潜在影响要求我们开发水资源自适应技术，以确保粮食生产和消费的水源供应。因此，近年来针对减少灌溉过程中用水量的研究日益增加。农业灌溉系统的商业用传感器昂贵得令人望畏，使得小农民无法负担此类设备。另一方面，制造商目前正在开发低成本传感器，由于物联网（IoT）和无线传感器网络（WSN）技术的最新进展，这些传感器可以连接到节点，以实现经济型的灌溉管理和农业监测[12\\\
  ]系统。在本研究中，介绍了一项关于智能灌溉系统领域现状的综述。本章确定了在水量、水质、土壤属性和天气状况方面监测的灌溉系统参数。本章总结了最频繁使用的节点和无线技术。最后，本文将探讨基于传感器的灌溉系统的实施问题和最佳实践。\n\
  \n### 6.1.1.2 精准农业的重要性\n\n物联网实现的精准农业技术为农民提供了最大化每项农业作业的价值工具。这些技术驱动的努力旨在提高农业产量和收入，同时减少对传统农业投入（水、肥料、杀虫剂和除草剂）的需求。例如，配备全球定位系统（GPS）[13\\\
  ]系统的拖机让农民更高效地播种并优化田间及田内部的移动，节省时间和燃料。由农机设备传感器采集的天气、土壤、害虫和水分数据可以发送到中心化的智能农场平台进行分析和预测性农业决策。农田可以使用物联网控制的激光进行平整，从而实现更有效的浇水，并减少流入附近溪流和河流的液体废物。人工智能（AI）可能被用于预测害虫行为，这有助于害虫管理规划。有效的害虫控制可以减少对作物和环境的伤害。为了区分杂草和作物，可以结合遥感数据和有效的图像分类系统。通过农机传感器采集的天气、土壤、害虫和水分[14\\\
  ]数据可以发送到中心化的智能农场平台进行分析和预测性农业决策。农田可以使用物联网控制的激光进行平整，从而实现更有效的浇水，并减少流入附近溪流和河流的液体废物。人工智能（AI）可能被用于预测害虫行为，这有助于害虫管理规划。有效的害虫控制可以减少对作物和环境的伤害。为了区分杂草和作物，可以结合遥感数据和有效的图像分类系统。\n\
  \n在需要喷洒除草剂时，无人机可以取代人工喷洒，节省资金。无人机还可以通过飞行收集作物健康状况。由于物联网技术的发明和使用，播种不再是一个游戏。可编程智能设备可以确定最佳种植位置。当作物成熟时，智能拖机可以更高效地收集作物。物联网及其相关设备已渗透到人类生活的各个方面，从医疗保健、汽车到物流。物联网的引入使农业更可持续性。\n\
  \n### 6.1.1.3 物联网\n\n精准农业是一个广泛术语，涵盖了所有依赖数字系统和技术进步以优化生产、减少浪费并维护环境质量的服务[15\\]。农民可以利用植入土壤的传感器来合理分配化肥和除草剂。\n\
  \n### 6.1.1.4 物联网在机器学习和深度学习中的应用\n\n基于机器学习的精准农业应用既高效又易于安装。机器学习[16\\]过程分为三个阶段：数据收集、模型创建和泛化。当人类能力不足时，机器学习算法通常被用于处理复杂问题。在农业中，机器学习可用于评估有机碳和水分含量等土壤参数，预测作物产量，识别作物病害和杂草。深度学习通过增加模型复杂性和使用各种函数修改输入来改进标准的机器学习。特征学习，或者更准确地说，从原始数据中自动提取特征，是深度学习的一个显著优势。\n\
  \n\n\n研究人员为了应对对能够验证、保护、监控和分析农业数据的智能点对点系统的需求，建议构建了基于区块链的精准农业物联网（IoT）系统，如图 6.1 所示。区块链技术对于将传统的农业数据存储、排序和传播方法转变为更可靠、不可篡改、透明且去中心化的数字格式至关重要。当`IoT`和`blockchain`\
  \ [18]]被应用于精准农业时，将形成一个智能农场网络。这种连接为系统赋予了更多的自主性和灵活性。\n\n`IoT`、`Data Science`、`Machine\
  \ Learning`、`Deep Learning` 和 `Blockchain` 都是处理数据的技术，对于理解和提供可操作的见解特别有用。因此，这些先进技术被用于各种农业实践中，例如确定特定位置的最优作物\
  \ [19]]、识别可能破坏作物的因素（如杂草、昆虫和作物病害）以深入了解作物生长并辅助决策，以及确定特定位置的最优作物。土地管理、土壤准备、水资源监测、杂草识别、农药建议、疾病诊断和成本计算是农业的七个关键阶段。土地管理是跟踪天气和地质特征在内的物理要素的过程。这非常重要，因为气候条件影响着全球的农业生产力。降雨是地球气候系统的重要部分，其不可预测性对农业生产、水资源管理和生物过程产生了巨大影响。因此，需要一种可以提前预测降雨的技术来使作物管理变得更容易。\n\
