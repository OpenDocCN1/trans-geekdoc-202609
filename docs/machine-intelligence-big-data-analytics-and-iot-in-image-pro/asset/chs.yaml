  \ 页码 571–579, Springer，新加坡, 2021.\n\n\n\n\n\n在现代导航系统中，导航系统与全球定位系统（GPS）的集成已在实践中成功应用。为了寻找经纬度，采用了多种方法。这些导航系统由全球定位系统接收器、处理设备、算法和空间数据库组成。差分演化是一种通过反复尝试增强针对特定质量标准的解决方案来优化问题的技术。OpenStreetMap\
  \ 是一个非专有的空间数据库，被频繁地用于导航系统的研发。作为一个志愿者空间数据库，OpenStreetMap 存在许多质量问题，为了识别和纠正这些质量问题，人们开发了许多算法。为了处理和使用全球定位系统的输出进行导航定位，研究社区开发了许多不同的方法，例如基于生物启发算法的导航。混合遗传算法结合了基于不同数学模型和技术的遗传算法和禁忌算法，以解决动态多目标问题。本章对导航中使用的进化技术进行了综述，为寻求理解导航系统中不同算法广泛模式的分析师和研究人员提供了机会。\n\
  \n**关键词：** 全球定位系统、差分演化、导航、遗传算法、进化算法、元启发算法\n\n## 14.1. 引言\n\n年来，人们使用许多传统技术进行全球导航。他们依靠星辰、指南针、地图在不同地点之间旅行；这有助于防止人们迷路。导航是科学与艺术的结合，用于确定不同车辆的位置并引导它们到达特定目的地\
  \ [1]。导航应用于生活的各个方面，人们往往不假思。每个人都经历过导航——在城市中寻找道路或从一点移动到另点。在这些情况下，标记、地标、提示或技术被用来逐渐引导方向。从数千年的太阳物理到地质学——科学对于导航技术有一套具体的方法。它通过避免碰撞、节省燃料和满足进度来确定位置和距离。经度对于识别导航技巧至关重要\
  \ [2]。纬度和经度是地球表面的虚线，用于确定特定点或位置的位置。纬线形成环绕地球的圆圈，经线从北极延伸到南极，位于 0 到 360 度之间。地球被分为两个相等的部分，称为赤道。\n\
  \n最早的导航方法涉及观测星座，利用星星、月亮、地平线和太阳来标记自己的位置，然后计算他们在开放海域的位置，这被称为天体导航 [3]。今天，一些航天机构（如 NASA）在地球大气层外的许多任务中使用天体导航。指南针是陆、海、空中熟悉的导航工具。它通过响应和检测地球的自然磁场来工作。在上个世纪，雷达、远程导航、陀螺罗盘和全球定位系统（GPS）加速了进展\
  \ [4]。\n\n现代出现了一种通过人们收集地形信息和数据的新方法。OpenStreetMap (OSM) 是这种方法的最佳实例 [5]。在过去的几年里，有更多的人将其认为是认证和商业信息的切实替代方案。免费的地理信息和丰富数据的可用性引起了人们、分析师和研究人员的浓兴趣。传统上，政府机构、地图机构和相关机构是空间数据的来源。如果用户想获取任何信息，就会面临高昂的费用、版权、许可和其他限制。互联网和社交媒体改变了一切；OSM\
  \ 项目就是其中之一。其议程很简单：让终端用户为终端用户构建和维护空间数据。最初，重点是街道和地图；现在它包含了由世界各地数千名志愿者绘制的极其丰富的内容 [6]。\n\
  \n### 14.1.1 导航系统\n\n导航是一种通过测量状态的各种变化（如加速度和速度），计算速度、时间、位置和方向来确定物体位置的方法。导航系统使用 GPS、卫星和其他设备来精确确定物体的位置\
  \ [7]。为了确定位置坐标，GPS 使用卫星星座发射的无线电波。`Figure 14.1` 描述了全球卫星系统的框图。\n\n```\n![Figure 14.1\
  \ 全球卫星系统的框图](img/c14-fig-0001.jpg)\n```\n\n**图 14.1** \n\n导航系统的主要组件如下：\n\n- **标准定位服务\
  \ (SPS)：** 所有 GPS 用户都使用 L1、L2 和 L5 频率，计时和定位依赖于 SPS。对于军事目的，加密导航数据是强制性的，因为这两个频率都包含面向授权用户的\
  \ P/Y 码测距信号；这些信号可以通过天线和其他设备传输。\n- **无线电波：** 电流负责传输和接收电磁波。通过天线发射器，该场向外发射，接收器接收并转换为理想的无线电频率。有不同类型的人造电磁辐射，用于向固定和移动通信、雷达、导航传输信号。\n\
  - **天线：** 天线接收和传输不同类型的无线电波。它们有不同的形状和大小。\n- **无线电发射器：** 几个元件组合在一起产生无线电波。这些无线电波以音频、视频或数字等不同数据形式携带有用信息。\n\
  - **电源：** 为了运行发射器，需要提供一些电，这一目标由电源实现。\n- **振荡器：** 发射器仅在特定频率传输；振荡器产生交流电正弦波（也称为载波）。\n\
  - **调制器：** 幅度调制 (AM) 和频率调制 (FM) 是两种调制类型，它们向正弦波或载波添加信息。AM 负责改变载波的强度，而载波频率的变化取决于频率调制。\n\
  - **放大器：** 为了增加功率，功率放大器放大调制后的载波。广播功率将取决于放大器的功率。放大的信号通过天线转换为无线电波。\n\n导航系统使用的波的类型：\n\
  \n\n\n\n\n-   **地波**：低频波沿地球表面传输，且不受外部因素的影响[8]。较低的频率将确保信号尽可能传输得越远。地波的传输路径不易改变，因此它是一种可靠的导航波。地波频率范围从\
  \ 100 Hz 到约 1 MHz。\n\n-   **天波**：高频波被电离层折射并传输信号，由于频率高，该频率的范围介于 1 到 30 MHz 之间[9]。使用天波进行导航既有趣又可靠，但高频正逐渐被更真实的卫星通信所取代。\n\
  \n-   **空间波**：极高频。1.5 MHz 及以上的无线电波直接穿过电离层被视为空间波。大多数导航系统使用这些源自空间波的信号。电离层会产生一些传播误差，因此为了最小化这些误差，导航信号在到达电离层之前就会使用。\n\
  \n-   **无方向无线电标**：它标记或定位仪表着陆系统（ILS）进场[10]。它是古老的航空导航系统之一，广播信号并向每个方向发射恒定信号，也称为全向标。\n\
  \n#### 全球定位系统\n\nGPS 是一种以卫星为中心的导航系统，提供位置、速度和时间同步。GPS 帮助识别当前位置并找到两个位置之间的方向。这些卫星在特定的轨道上运行，要找到位置需要至少\
  \ 3 颗卫星的信号。通过使用这三颗卫星，可以获得地理实体的精确位置。第四颗卫星则用于测量时间。图 14.2 显示了使用四颗不同卫星信号寻找位置的示例场景。三角测量法是\
  \ GPS 接收器使用的一种数学过程，它需要通过涉及球体涉及四个距离来形成唯一解[11]。\n\n#### 相对论\n\n爱因斯坦的狭义相对论广泛用于预测时间会随速度而变化。如果时间不准确，那么\
  \ GPS 定位就会出现偏差。卫星通过分析从 GPS 卫星传输的无线电信号，根据其上方四颗卫星的位置以及这些卫星与接收器之间的距离向整个 GPS 接收器发送更新信息。原子钟集成在系统接收器和发射器中。几颗卫星将决定三角测量的精度。发射器在时间\
  \ `T2` 发送信号，接收器在时间 `T1` 接收信号，因此可以使用公式 14.1 计算距离。\n\n(14.1)![equation](img/c14-disp-0001.png)\n\
  \n其中 `C` 是光速。\n\n![图 14.2 GPS 的三角测量。](img/c14-fig-0002.jpg)\n\n图 14.2 GPS 的三角测量。\n\
  \n智能手机没有使用原子钟，而是内置晶振钟。通过求解某些坐标，可以检索精确位置 `x`、`y`、`z`、`T offset`。`T offset` 可以使用公式\
  \ 14.2 计算。`T offset` 对于每颗卫星都保持相同。\n\nGPS 系统由三部分组成，如图 14.3](#c14.xhtml#c14-fig-0003）所示。空间段包括\
  \ 24 颗卫星和通信链路，控制段包括若干监测站和主控站，用户段包括位于船舶、汽车和手机等各种设备中的 GPS 接收器。\n\n![图 14.3 GPS 的组成。](img/c14-fig-0003.jpg)\n\
  \n图 14.3 GPS 的组成。\n\n### 14.1.2 遗传算法\n\n约翰·霍兰（John Holland）提出了一种用于寻找最优解的启发式算法，称为遗传算法（GA），它建立在进化和生物遗传学的基础上，灵感源自达尔文理论，模拟了生物启发进化的某些方面[12]。通过使用遗传继承，遗传算法模拟了自然进化，用于解决优化问题[13]。遗传算法的基本元素是染色体。个体所有基因的字符串被称为染色体，以二进制形式编码[14,\
  \ 15]。\n\n使用了几种算子技术来执行算法并寻找主要的评估因素，即个体适应度。目标函数定义了如何解决问题。实现方式决定了随机生成种群的结果；如果在遗传算法中采用了适当的技术，遗传算法适应度值将得到提高。\n\
  \n### 14.1.3 差分进化\n\n\n\n\n差异进化算法（Differential Evolution, DE）是一种基于遗传算法（GAs）的新型进化算法（EA），首次于\
  \ 1997 年提出 [17]。传统上，DE 在搜索时没有关于搜索方向的特定信息，导致其随机行为，旨在在连续范围内发现最优解 [18, 19]。在实现随机全局优化方面，DE\
  \ 策略对 DE 的性能有显著影响。结果具有随机性和不确定性。对于处理优化问题，元启发式搜索算法是最好的方法之一。如果没有满意的特定问题算法，则可以通用它。\n\
  \n如今，在研究和技术领域，许多用于优化的不同生物启发算法 [20] 都需求迫求。进化计算算法指的是整个进化优化算法族。遗传算法（GA [14]）、遗传编程、DE、进化策略和进化编程可以作为进化计算领域的主要算法。GA\
  \ 和 DE 算法都使用相同的算子：选择、交叉和变异。为了构建更好的解决方案，GA 依赖于交叉，而 DE 依赖于变异和其他两个组件：即所选的策略和控制参数。事实上，变异是区分其他种群算法与\
  \ DE 的主要组件。\n\nDE 设计用于处理具有多维值候选解的连续目标函数，且在搜索时不利用梯度信息，而 GA 使用一系列比特。对控制参数及其他问题的敏感性会导致停滞，并使得在精确的领域空间内解决特定问题变得效率低下。经过改进的\
  \ DE 提高了种群根据空间区域的最新分布开发新合适后代的能力。探索（Exploration）和开发（Exploitation）是驱动差异种演化的两个关键过程。探索在新空间中寻找新解决方案，而开发则是通过对现有解决方案进行精炼，对新后代的适应度进行选择工作\
  \ [21]。\n\n选择一个基础解并应用某些策略添加变异，以创建新的候选解以及从种群中计算出变异数量的其它随机解，这被称为差分向量，然后 DE 通过计算两个种群向量之间的差异产生新的参数向量。如果后代具有更好的目标函数，则它被基础解替换。每个父代创建一个后代，在当前种群中，如果后代比父代更健康，它就会替换父代。\n\
  \n## 14.2 相关研究\n\n多年来，研究人员提出了许多利用遗传信息结合 DE 算法的路由算法。本节的基本目标是查看导航、GA 和 DE 领域的研究活动。\n\
  \n基于 GA 的路径规划算法具有处理当存在多个最优解或路径时的问题的能力 [18]。使用这种基于 GA 的路径规划算法对特定区域内的 1000 多个节点进行了测试，以构建出一种智能路径规划结构。使用\
  \ DE 和 GA 解决具有同时送货取货和时间窗口的车辆路径问题 [22]。通过设置参数，它可以转换为经典的车辆路径问题。研究建议了 DE 理论、GA 与混合优化算法（HOA）的结合。根据发现，遗传算子和自适应差异进化交叉算子被用于规避早收敛。\n\
  \n在静态环境下，真实地图上通往给定源和目的地的路由选择问题。为了选择最佳邻居，提出了具有可变长度染色体的 GA，并使用和比较了新的建议选择方法和锦赛法。使用了并测试了几种交叉操作和不同变异算子在路由导航系统中的行为。\n\
  \n基于 DE 的路由算法丰富了 LEACH 协议（以一种方式排列在所有传感器中均匀分布能量） [23]。基于每个路径评估的 DE 显示，计算最优路由更有效。如果路径被阻塞或过载，将进一步研究优化因子以提供更好的解决方案\
  \ [24]。提供替代过载路径的 GA。通过交叉和变异并增加收敛速度可以获得解决方案的改进 [25]。\n\n一种用于发现路由系统行驶时间最短路径的 GA 方法\
  \ [26]。应考虑流量的影响因素导致的低效路由。在处理速度受限的导航系统中，使用性方法（如`Dijkstra`算法）确定确切的最解是困难的。GA 在大型网络上提供近似解。\n\
  \nDE 方法经过了修订，并引入了抖动因子，通过控制设置实现了探索与开发之间更好的平衡 [27]。用于解决动态路径规划问题的许多基准函数测试了算法的实用性和效率。\n\
  \n带有 DE 的多样化区域过程是一种改进的搜索算子 [28]。通过改变传感器的数量，已在无线传感器网络的各种情况下对该算法进行了研究。基于动态控制的机制和基于聚类的\
  \ GA。多态交叉和动态种群通过染色体进行了讨论 [29]。GA 被应用于路由优化问题。这种技术允许快速收敛到最佳解并保持种群的多样性。\n\n使用开放最短路径优先（OSPF）和\
  \ GA 的结合，引入了一种用于计算网络最短路径以提高路由器性能的方法 [30]。为了找到最优解，适当设置 GA 比`OSPF`产生更好的结果。一种通过 DE\
  \ 替代方案修改的向量生成方案用于解决停滞问题。测试了由 24 个不同基准函数组成的连续优化器（COCO）框架 [31]。提高收敛速率并移除无效问题为单峰和多峰问题提供了最好的结果。\n\
  \n\n\n\n一种基于数据管理的技术，用于在真实世界的道路地图中高效计算最短路径 [32]。瓦片地图分划分包含了在真实道路地图上全完整解决方案栈的实际实现。对于移动自组网络，提出了一种基于\
  \ `DE` 算法的自组网络按需多路径距离向量协议 [33]。在从起点和终点之间的多种路径中寻找最优路径的路由恢复过程中，该算法提供了备份，以避免节点之间的任何链路故障。\n\
  \n为了减轻接收者的处理负载，开发了一种基于 `Gibbs sampler` 的卫星选择技术 [34]。研究了一种新型混合 `DE` 算法，以及一种带有遗传算子和模糊逻辑控制器的整数线性规划公式，用于解决带回程和异构车队的多程车辆路径问题\
  \ [35]。为了证明其其实可行性，设计了相关实验。\n\n### 14.2.1 遗传算法的相关研究\n\n在本章中，审查了 80 篇关于使用 `GAs` 的导航系统中不同方法的论文。为了处理优化或路由困难，开发了某些具有局部搜索策略的\
  \ `GA` 和 `DE` 算法方法的新变体。由于 `DE` 作为一种简单且强大的优化器的快速出现，以及机器智能和控制论的发展，开发者们在广泛的各个领域中利用了许多方法论。研究了\
  \ `GAs` 在动态最短路径路由问题（`DSPRP`）中的应用 [36]。在动态尺度上，由于计算复杂度高，该方法是不恰当的，尽管 `bellman-ford`\
  \ 和 `Dijkstra` 在固定基础设施中表现良好。利用 `MANET` 构建了一种特殊的 `GA` 来解决最短路径问题 [37]。正在进行移动机器人导航的研究，以便更好地理解路径规划策略并识别不同环境情况下的研究缺口。正在对传统方法和反应性方法进行逐步调查\
  \ [38]。研究中考虑了模糊逻辑、路图方法、`GA`、神经网络等许多不同方法。文章以比较不同导航战术频率的图表和表格作为收尾。使用 `python` 实现 `GA`\
  \ 是快速且方便的，不需要任何额外的库 [39]。有一篇论文提出使用混合模拟退火算法处理三峡工程两座大坝的最优导航协同调度。虽然某些实验表明这些算法是可行的，但由于其复杂性，论文中使用的算法尚未用于实际的导航调度系统\
  \ [40]。为了增加种群多样性并增强局部搜索能力，创建了邻域交叉策略和贪心后向变异技术 [41]。在一项关于交通拥堵最小化模型的研究中，将 `DE` 优化与\
  \ `TRANSYT` 交通仿真软件相结合被提出 [42]。为了处理交通分配问题，利用路径流估计器作为随机用户均衡评估。在一个通过集成 `Google API`\
  \ 的 `Android OS` 来处理 `TSP` 问题的 `GA` 新版本中，也强调了相同的结果 [43]。`Python` 是一种解释型语言，支持多种编程范式，如面向对象编程、函数式和过程化编程。同样，`TSP`\
  \ 是寻找最短路径路由的优化方法之一，对于局部搜索技术，使用了爬山法 [44]。使用 `Android OS` 是因为它在全球范围内具有易访问性。为了获取地理位置，将\
  \ `Google API` 集成到 `android OS` 中。在几个城市的不同位置进行了实验，对比混合遗传算法（`HGA`）与简单 `GA` 的效果 [45]。结果显示\
  \ `HGA` 的性能优于简单 `GA`。\n\n### 14.3 基于遗传算法的导航\n\n![图 14.4 遗传算法分类法。](img/c14-fig-0004.jpg)\n\
  \n图 14.4** 遗传算法分类法。\n\n`DE` 是一种 `EA` [17]，在其他 `EAs` 中出现非常迅速。在道路网络中，如图 14.4 所示，有几种路由规划算法被应用。寻找最低成本路径，`Dijkstra`\
  \ 算法值得考虑，因为它在目标节点被标记时就会终止。`Dijkstra A*` 的变体使用了启发式搜索并缩短了计算时间。`Tabu search` 是一种基于局部的元启发式搜索，通过多次迭代发现最佳可能的键。遗传算法是一种基于种群的元启发式算法，应用于不同的路由问题。`GA`\
  \ 是基于动态自然种群遗传学原理的搜索程序。`DE` 是一种基于种群的优化算法，如图 14.5 所示，它依赖于各种参数。`GA` 中使用的遗传算子类型决定了其性能：初始化、选择、交叉、变异和替换。无法保证任何优化方法都能生成最优解，但包括\
  \ `GAs` 在内的所有进化算法都能找到近优解 [13]。技术以伪代码的形式呈现。任何编程语言都可以轻松实现伪代码。计算道路上的最短路径时使用了 `Dijkstra\
  \ 算法` 和双向搜索等路由模块。为了发现从源到目的地的最短路径，需要跳过不重要的节点并添加快捷路径以保留剩余节点的最短路径。\n\n\n\n对于大多数计算问题，给定信息必须以位字符串的形式进行加密，并根据问题领域进行区分。它应该完全掌握从起点到终点的路径信息。编码方案包括二进制编码，其中每个位都表示为\
  \ 0 或 1 的字符串，用来表示解决方案的特征，如表 14.1 所示。假设从源点到终点 0 位或 1 位之间存在任何路径，并且是易于实现的 [46–48]。八进制编码方案，染色体以\
  \ 0 到 7 的八进制形式表示 [49]。同样（0–9, A–F）在十六进制编码方案中表示。在排序问题中，使用了如表 14.2 所示的排列编码方案。当使用复杂值（如实数）且二进制编码不足时，则使用如表\
  \ 14.3 所示的值编码方法。在树中，编码方案算子可以很容易应用，如表 14.4 所示。\n\n#### 表 14.1 二进制编码。\n\n| 染色体 i ||\
  \ 101010010011010101 |\n| --- | --- |\n| 染色体 ii || 110010100100101010 |\n\n####\
  \ 表 14.2 排列编码。\n\n| 染色体 i || 2 4 6 1 3 5 8 7 9 |\n| --- | --- |\n| 染色体 ii || 9 3\
  \ 1 4 2 7 5 6 8 |\n\n#### 表 14.3 值编码。\n\n| 染色体 i || 1.2333 4.3435 5.6774 |\n| ---\
  \ | --- |\n| 染色体 ii || ACEFDBAGBCADE |\n| 染色体 iii || (forward)(back)(left)(right)\
  \ |\n\n![表 14.4 树编码。](img/c14-inline-0001.jpg)\n\n#### 表 14.4 树编码。\n\n##### 选择算子\n\
  \n特定的染色体（路径）是否会参与并产生最适应的个体，取决于选择算子，该算子有时称为繁殖算子 [50]。选择压力决定了差分进化（DE）的收敛速率以及两个或多个交叉候选对象\
  \ [51]。锦标选择和轮盘选择分别是在图 14.6 和图 14.7 中展示的某些选择技术。对于交叉，高价值个体有更高的机会用生成的最适应个体替换现有个体 [52]。所有可能的字符串都映射到轮盘上；在轮盘选择中，轮盘上的部分由适应度值分配\
  \ [53]。为了获得最适应的结果，然后旋转这个轮盘，一个随机生成的值将负责产生新值。排名选择则代替了适应度值，它是轮盘选择的一种变形式。锦标选择技术保留了多样性；并行实现不需要排序\
  \ [54]。\n\n##### 交叉算子\n\n为了产生后代，两个或多个父母的遗传信息被结合 [55]。对于下一代池，两个或多个父母可能不会在现有种群中替换。单点、双点、中间、算术、洗牌、均匀、部分匹配是广知的交叉算子\
  \ [56]。由选择算子选出的两个优势个体的后代可能具有优势性状。单点交叉如下方的表 14.5 所示。\n\n##### 变异\n\n![图 14.6 锦标选择。](img/c14-fig-0006.jpg)\n\
  \n图 14.6 锦标选择。\n\n最终，如果没有变异，池中的所有个体将是相同的 [57]。翻转候选者的一个基因会使遗传信息交换中的实际变化多样化。这种偏置算子受到选择和交叉算子的影响。位移变异、简单反转变异、随机变异、均匀变异和倒转变异是少数变异技术。表\
  \ 14.6 展示了变异。\n\n![图 14.7 轮盘选择。](img/c14-fig-0007.jpg)\n\n图 14.7 轮盘选择。\n\n表 14.5\
  \ 单点交叉是交叉点。\n\n| 染色体 1 || 1101 | 1100001110 |\n| --- | --- |\n| 染色体 2 || 1101 |\
  \ 0010011010 |\n| 后代 1 || 1101 | 0010011010 |\n| 后代 2 || 1101 | 0010011010 |\n\n\
  表 14.6 变异。\n\n| 当前染色体 i || 1.2333 4.3435 5.6774 |\n| --- | --- |\n| 当前染色体 ii ||\
  \ ACEFDBAGBCADE |\n| 当前染色体 iii || (forward)(back)(left)(right) |\n\n### 14.3.2 进化算法使用的算子和术语\n\
  \nDE 操作具有类似的术语。以下是主要的算法操作。图 14.8 展示了遗传算法和差分演化的字符。进化算法与数学规划之间的对比在表 14.7 中所示。\n\n\
  **个体**：任何遗传算法的基础结构被称为基因，基因的集合决定了等位基因。它可能带来一个解决方案而并非解决方案本身。\n\n**染色体**：它被划分为基因；基因的数量决定了染色体的长度。\n\
  \n**种群**：它包含种群代中所有可能解决方案的拷贝，可以被描述为染色体的集合。第一代种群池主要是随机生成的。\n\n![图 14.8 遗传算法和差分演化的字符。](img/c14-fig-0008.jpg)\n\
  \n\n\n\n\n**适应度函数：** 通过将问题的候选解作为输入并判断给定答案与目标问题最优解的接近程度，该函数（也称为评估函数）生成一个输出作为任何问题的最佳结果\
  \ [59]。\n\n### 开始\n*   **步骤 1：** 初始化或生成包含 `n` 个染色体的种群，以确定目标函数并假设这可能是可能的最优解。\n* \
  \  **步骤 2：** 适应度函数：计算每个染色体的适应度函数 `f(x)` 并将其应用于每一代。\n*   **步骤 3：** 下一代种群池：为了获得下一代所需的候选个体，执行以下步骤，直到获得\
  \ `n` 个染色体：\n    1.  选择：从种群中选择任何适应度最高的父代染色体。\n    2.  交叉：对选定的父代应用交叉技术以获得后代。\n  \
  \  3.  变异：在指定的位置根据变异率对后代进行变异。\n*   **步骤 4：** 测试子代是否适合下一代种群池。如果子代达到所需尺寸且优于现有染色体，则将其放入下一代。\n\
  *   **步骤 5：** 终止条件：如果满足所需条件则停止。\n*   **步骤 6：** 重复：返回适应度函数。\n\n**结束**\n\n## 14.4.\
  \ 用于导航的元启发算法\n\n`DE` 是一种基于种群的元启发搜索技术，通过进化过程迭代地改进潜在解来优化问题 [60]。为了协助先进运输遥测（ATT）服务的定位需求，通过高完整性的地图配准算法，实现了稳健且可靠的导航系统的开发\
  \ [61]。从定位技术来看，已经生成了概率性或传统的拓扑分析地图配准算法用于车辆导航。输入来自 `GPS`；改进的拓扑和模糊逻辑地图匹配在路段识别和位置确定方面是高完整性的地图配准算法。由于应用了渐进技术，如\
  \ `Kalman filter` [62]、`belief theory`、`fuzzy logic` 和 `Dead reckoning`，定位和空间路网的状态都得到了升级。来自智能交通系统（ITS）的高精度数据很少可用。`Hidden\
  \ Markov Model (HMM)` 是一种对稀疏和扰动具有鲁棒性的离线地图配准算法 [63]。在复杂区域，高要求的导航很难处理。以下是其中的一些描述：\n\
  \n#### Dijkstra 算法\n它是寻找源点到目的地最短路径的方法 [64], 65]。Dijkstra 的复杂度为 `O(n)`，其中 `n` 是节点数。\n\
  \n#### 禁忌搜索 (Tabu Search)\n一种从初始解开始并对其迭代的局部搜索 [66]。在迭代过程中，`tabu` 存储最近访问过的解。将 `DE`\
  \ 与 `Tabu` 结合的思想用于处理多维问题 [67]。\n\n#### 旅行旅行员问题 (TSP)\n是最研究最充分的组合优化示例之一 [68], 69]。它是\
  \ `NP-hard` 的，因为随着节点数量的增加，计算量呈指数级增长 [70]。\n\n#### 模拟退火\n一种用于线性目标函数的随机搜索策略，通过随机化和迭代更新候选解\
  \ [72]。与爬山局部搜索一样，它检查搜索空间的一个极小部分 [73]。它的灵感源于冶金中的退火，即先提高温度然后缓慢冷却。针对多目标优化问题，提出了带有 `simulated\
  \ annealing` 的多目标 `DE` [74]。\n\n#### 爬山算法\n这是一种单目标优化过程，通过迭代使当前已知个体产生最好的后代 [75]。为了识别某区域内的最优解，通常将\
  \ `GA` 与局部搜索机制结合，形成混合算法 [76]。\n\n提高现有算法在路线规划以及确定两点之间最短路径的效率是一项艰巨的任务 [77]。关于用于提高路线规划效率的输入，有一些信息。\n\
  \n### 14.4.1 `DE` 的缺点\n\n*   “没有免费午餐”定理是 `DE` 的缺点之一，所有其他进化搜索技术也是如此。尽管 `DE` 具有良好的全局开发能力，但在解的利用方面速度较慢\
  \ [78]。\n\n\n\n\n\n*   `DE` 算法族尚未取得显著发展，而 `GAs`、`ES` 和 `EP` 在理论理解方面已取得巨大进展 [19]。\n\
  *   它在非线性可分函数上面临困难，必须依赖其差分变异过程 [79]。\n*   `DE` 在多目标优化问题中的应用也有限 [79]。\n\n## 14.5.\
  \ 结论\n\n基于元启发式算法的差分进化算法用于获取给定问题的最优解。二叉树方案中障碍的处理并不理想，计算效率也较低。基于改进蚁群算法的算法非常耗时，计算成本过高且容易发生停滞现象。基于模拟退火的多优化器无法找到完美解决方案，且划分过于粗糙。通过将最佳粒子引入初始种群可以获得最佳最优结果。进一步认为，其他局部搜索技术也可以混合在\
  \ `DE` 的不同步骤中，并可以在几个不同的标准问题上进行测试。禁忌搜索-元启发式搜索与其他随机初始化进行了比较。结果显示，禁忌初始化方法能有效产生更优的解并增强向最优解收敛的速度。除了启发式算法，许多研究人员使用了多种元启发算法来解决导航中的路由问题。为了分析卫星数据，洛斯阿拉莫斯实验室已利用它创建真实的特效。元素的加入将使问题变得复杂，因此找到更好的优化方法是未来研究的一个重点。本章内容表明，`DE`\
  \ 未来将继续是一个活跃且繁忙的跨学科领域。\n\n## 参考文献\n\n1. Hunt, M.M., Marquet, W.M., Moller, D.A.,\
