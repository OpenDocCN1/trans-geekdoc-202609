  \n3.1 引言\n\n肝脏解剖\n\n### 3.1.1 肝脏在人体中的作用\n\n为了发现肝癌，你需要弄医学图像的含义，使用带分水变换的自适应阈值法使肝脏从身体其他部分脱颖而出。优化策略和群体优化模型是分离肝脏恶性区域的一些方法。数据包含了来自不同类型肝癌患者的\
  \ 225 张图像。为了构建一个大型数据集，使用了灰度级矩阵、局部二值模式（Local Binary Pattern）来寻找重要特征。然后使用神经网络、支持向量机、随机森林和深度神经网络分类器将其分为不同类型的癌症。这些包括血管瘤、肝细胞癌。建议的方法根据其敏感性、特异性、准确率和\
  \ Jaccard 指数进行了评估。使用基于分水岭的深度学习算法的人发现，它们可以用于诊断肝癌。发现 DNN 分类器效果最好，在 300 个 epoch 中，准确率达到\
  \ 99.25%，Jaccard 指数为 0.97，验证损失低为准确率的 65.73%。\n\n### 3.1.2 肝脏疾病\n\n慢性肝炎是一种综合动态稳定的肝脏疾病，其中肝细胞活动受到硬化血液组织阻碍血流的影响。\n\
  \n\n\n\n肝脏中最常见的物质是脂肪。这三个特征中的每一个都出现在同一个人身上，或是单独存在，或是紧密相邻。没有人被允许获得他们所需的酒精治疗。肝脏有两种类型：光滑肝和坚硬肝。光滑肝最为常见，受到的损伤也最少。当个人在长时间内大量饮酒时，被称为暴饮。脂肪积聚在肝细胞的细胞质中，导致器官增大，并随着时间的推移扩散大量脂肪。当你摄入过多酒精时，可能会发生急性或慢性酒精性肝炎。获得性肝炎是一种通常在肝硬化之前发生的慢性疾病，非常危险。纤维性肝硬化与其他肝硬化类型一样如果经常发生，可能会非常有害。患有此症状的人肝组织出现扩大的结节，被完全纤维化的组织包围，如图所示。在这种情况下，疤组织的生长速度比正常肝细胞快，而其调节系统继续按照以前的方式控制血流。即使患者长时间处于无保护状态，随着肝硬化的进展，发生迟缓肝的几率大大增加。\n\
  \n肝炎是肝脏炎症的医学术语。肝炎可能由多种因素引起，最常见的是感染和酒精摄入 [6]。病毒引起的肝炎可能以多种方式表现。三个最为人知的是 B 型肝炎、A 型肝炎和\
  \ C 型肝炎。病毒性肝炎可以通过血液传播。它可能以多种方式表现，其中可能进展为肝硬化，因此具有危险。血色沉积症是一种体内铁水平异常升高的疾病（铁过载）。如果不加治疗，血色沉积症可能会发展为肝硬化、癌症和心脏问题。肝脏恶性变变的初始阶段发生在肝脏肿瘤生长失控时。大多数肝肿瘤\
  \ [7] 分为两类：对人体至关重要或不重要。最常见的恶性发展类型是肝脏形成良性肿瘤，导致肝病。非癌性肿瘤是其原因。因为血管瘤和中央结节性增生不会阻碍肝脏的功能，它们很少对肝脏造成损害。B\
  \ 型或 C 型肝炎，以及许多肝毒和肝病毒疾病都可能导致危险肝癌细胞的形成。非肝致癌细胞扩散到其他器官，导致额外的恶性发展增加。这种疾病具有扩散到胃肠系统其他器官的潜力。肝脏接收来自包括胃在内的各种器官的血液。“转移性疾病”是指肝脏恶性生长之外另一种。它通常是肝肿瘤生长的副作用。也可能是由晚期乳腺癌、结直肠癌、肺癌或肾癌等癌症引起。\n\
  \n### 3.1.3 肝肿瘤的类型\n\n肝肿瘤可能由肝肿瘤或生长或其他因素引起。这表明肝肿瘤可能是导致肝肿瘤的因素之一。通常，在健康的肝脏中，细胞 [8]\
  \ 以可预测和受控的方式增殖，对相邻细胞的干扰最小。当肝脏内部的肝细胞（肝细胞）、胆管细胞或血管的增殖过快时，肝脏就会产生肿瘤。肿瘤在性质上被分为良性或恶性。在这种情况下，良性肿瘤被细胞壁保护着，防止它们与周围组织发生作用。另一方面，肿瘤具有致命性。它们有可能扩散到身体其他区域，对其邻近的组织造成伤害。通常，男性患此类肿瘤的风险高于女性。它们可以通过医学影像被发现，或者患者可能表现出腹部肿块、不适、黄疸或其他肝功能衰竭的体体征和症状。\n\
  \n### 3.1.3.1 良性肿瘤\n\n进行胃部影像检查的患者越多，发现的良性恶性变肿瘤就越多。尽管许多人没有表现出任何症状且没有肝病家族史，但他们仍被误诊患有肝病。在某些情况下，非侵入性肝肿瘤检测和诊断性影像检查可能难以区分健康者\
  \ [9] 和不健康者。\n\n\n\n\n# 肝癌\n\n患者中可能看到的两种肝癌形式是原发性肝肿瘤和扩散到身体其他区域的癌症。原发性肝肿瘤是最常见的肝癌类型。肝转移最常见的原因是消化系统、肺部和乳腺的恶性肿瘤。多种组织（包括肝细胞、胆管上皮和其他类型的组织）均可用于形成原发性肝肿瘤。肝细胞癌（`HCC`）是\
  \ 50 岁以上人群肝脏中最常见的原发性淋巴肿瘤。对于 50 岁以上的人群，它可能占所有原发性肝癌的 85%（2011 年）。`HCC` 通常被称为“致命的肝细胞癌”，是一种如果不进行治疗就有可能扩散到身体其他区域的肝癌。`HCC`\
  \ 通常是由肝硬化或引起乙型或 C 型肝炎感染的病毒引起的（酒精中毒是肝硬化的最常见原因）。根据世界癌症研究基金，`HCC` 现在是全球第六种常见的癌症。\n\n\
  由于这场灾难，亚洲被迫引起关注。在大多数情况下，只有约 10% 到 20% 的 `HCC` 可以通过手术完全切除。如果肿瘤没有完全切除，患者通常会在 3 到 6\
  \ 个月内死亡，但并非总是如此。这很大程度上是因为肿瘤在发现过程中发现晚了。纤维层状 `HCC` 是一种 `HCC`，其特征是具有独特的临床和病理学特征。`HCC`\
  \ 与普通 `HCC` 的不同之处在于，它在肝脏健康的年轻人中比在肝功能不全的老年人更常见。它影响了约 1% 的 `HCC` 患者，且在这方面对男女的影响是相同的。胆管细胞癌（`CCC`）是这种疾病的医学术语。\n\
  \n根据美国癌症协会的说法，它是胆管上皮癌的一种，占所有起源于肝脏的恶性肿瘤的约 10%。这种病变在西方国家并不流行，但在亚洲国家更为常见。`CCC` 出于于\
  \ 10% 的人群，受影响者大多数年龄在 50 岁以上。它是儿童中最常见的恶性肝肿瘤，也是儿童最危险的肝肿瘤类型。被子植物仅出现在极小比例的人群中。他们正遭受肝间充质肿瘤的痛苦。一旦你的血管打开，内皮细胞就会准备攻击你。上皮样血管内皮瘤是一种影响肝脏内皮细胞的罕见肝癌。\n\
  \n## 3.1.4 医学影像程序的特征\n\n当涉及到医学影像信息时，它通常用于增强传输、压缩和功能等。审查这些信息至关重要，以确保你能够更好地掌握`program`；通过利用图像相关信息具有增强传输、存储和归档的潜力。尽管许多系统可以管理大量信息，但要实现对图像如何捕捉、过程为何完成，以及没有人存储指南中所描述过程的语义的自然语言解释是非常困难的。存档责任可用于各种不同的任务。根据研究，肝可以分为几个不同的部分。例如，使用提供的标准列表就可以生成。在开发新型设计和压缩技术时，考虑这些可能性是重要的。程序的治疗目的是执行满意的诊断或治疗功能。有必要理解序列之间的联系，以便从中提取信息。图像处理用于从大量数据中提取有价值的信息。因此，有必要记录对整体成功有影响的程序和因素。大多数数字工具都利用某种处理。窗窗调节、缩放和测量等简单处理技术经常被使用。另一方面，技术所需的处理时间对过程中所需的存储空间数量没有影响。为了确定肿瘤病理随时间的演变，保留图像的最常见医学理由是为了将其与未来的治疗进行比较。肝癌及其产生的细胞都是癌症的例子。大多数恶性肿瘤在发育阶段会变得更具侵略性。巴塞罗那肝中心表示，美国肝病研究协会（`AASLD`）的建议是基于现实世界中肝癌患者的治疗方法，而不是理论模型。\n\
  \n它评估扩散范围、肝功能的维持程度以及患者的整体健康状况。对肝脏获得的灰度共生矩阵、灰度运行长度矩阵和灰度梯度共生矩阵进行了分析。使用计算机断层扫描（`CT`）可以区分计算机辅助诊断（`CAD`）发现肝癌处的两种肝疾病。当肝肿瘤在\
  \ `CT` 扫描中能够清晰检测和分割时，早期癌症识别和诊断的概率会显著增加。\n\n\n\n\n\n从身体其他区域迁移到肝脏的恶性肿瘤包括继发肝脏肿瘤和 `HCCs`。此外，肝脏可能会发生原发性致命肿瘤，如\
  \ `HCC` 或 `Schweich`，这是世界上最常见的癌症，也是全球死亡的首要原因。搜索人体内部脏器和软组织的非侵入性方法是 `Ultrasound Diagnostics\
  \ (US)`，它不需要任何侵入性操作。这使得操作人员能够尽可能准确地展示图像面的选择和疾病的解剖结构。在这种情况下，可能需要使用 `Diagnostic Ultrasound`\
  \ 对肝脏进行检查。这是一种非侵入、安全的患者检查方法，操作简单、廉价且可能重复。在 `CT` 或 `MRI` 的情况下，你无法使用它们，因为它们在这种情况下要么辐射强度过大要么成本过高。为了协助专家医生同时确保结果看起来良好，`CAD`\
  \ 系统利用了图像处理和 `AI`。在某些情况下医生是做出最终选择的人，但并非所有情况都是如此。\n\n### 3.1.5 与肝癌分类相关的问题\n\n肝癌是美国第三种常见的癌症，也是全球第三种常见的癌症。在检测肝癌时，会进行多种诊断，包括血液检查、影像学检查和活检。由于有了更简单、更快速的搜索方法，早期识别肝癌将成为可能。血液测试是确定患者健康状况以及肝酶是否异常升高的第一阶段。携带肝炎病毒的人将进行血液测试以确定是否感染。这是因为乙肝\
  \ B 病毒 (`HBV`) 和乙肝 C 病毒 (`HCV`) 均已知会诱发肝癌。如果发现任何问题，患者可能接受进一步的程序，例如肿瘤标志物检测。进行肝脏超声扫描以确定其是否比通常大或更厚，或者是否包含实性或充满液体的肿瘤。根据超声检查的结果，使用\
  \ `CT` 扫描获取肝脏的横截面图像。\n\n为了检测 `HCC`，会进行四次 `CT` 扫描。由于四次扫描使用了不同的对比剂，结果各不。如果这种方法显示患者患有\
  \ `HCC`，则不需要进行肝活检。此外，它还可以用于获取器官、组织和骨头的横截面图像，以确定肝癌是否扩散到邻近淋巴结、组织或器官。如果 `CT` 扫描未发现\
  \ `HCC` 的存在，则进行活检。由于肝癌位于肋骨附近，因此检测该疾病的早期迹象较为困难。肿瘤可能生长到如此以至于在被发现时已经无法被检测到。基于 `CT`\
  \ 的肝脏肿瘤识别已经存在很长时间，但它比 `ultrasound imaging` 成本更高且安全性更低，而后者提供了更多关于软组织的信息，且成本更低、危害更小。超声有多种应用，包括下面列出的那些：\n\
  \n* 考虑人体内软组织器官的大小、位置和结构至关重要。\n*   理解充满液体囊肿与肿瘤之间的区别非常重要。\n*   在某种程度上为医生提供帮助。\n* \
  \  确定癌症扩散的范围。\n\n### 3.1.6 系统研究的目的\n\n本研究的主要目标之一是确定利用超声技术来识别和分类肿瘤的方法。为了完成这项任务，预处理、特征提取与选择、最佳特征融合和分类都是必须在子任务层级完成的过程。文章讨论了在用于识别和分类癌症之前对肝脏图像进行预处理的重要性。当这些信息以这种方式使用时，它有助于预处理以及构建既高效又有效的算法。这些信息被用于根据特征确定肿瘤多快被分类。\n\
  \n## 3.2. 相关工作\n\n本研究的目标之一是检查文献中提到的所有检测肝癌肿瘤的新方法。\n\n\n\n\n\n# 宏基因组测序与微生物组分析\n\n\
  宏基因组测序技术为我们提供了丰富的人类微生物组基因组信息，这有助于我们更好地地理解和诊断微生物疾病 [12]。患者与健康人的组成存在显著差异，这些差异可用于帮助医生判断其健康状况。尽管取得了显著进展，但这些工具的诊断和治疗准确性仍需提高。\n\
  \n使用一种名为 `MDL4 Microbiome` 的方法可以非常准确地预测某人是否健康，该方法将宏基因组测序的多个特征与多模态深度学习模型相结合。不同标准（如标准分类学谱系、基因组级相对丰度和代谢功能特征）的结合，可能帮助你提高分类能力。通过使用这种深度学习方法，研究人员能够创建一个分类器，包含在人类微生物组中发现的所有各种类型。`IBD`\
  \ 患者、2 型糖尿病（包括胰岛素抵抗）、肝硬化（包括肝癌）和结直肠癌（包括结直肠癌）患者的预测准确率分别为 `0.98`、`0.76`、`0.84` 和 `0.97`。与经典的机器学习方法相比，这些结果等同或优于通过这些新方法获得的结果。所选特征受到了更广泛的检查，以便更深入地理解其独特特征的功能机制。`MDL4\
  \ Microbiome` 是一种分类器，在不同情况下，其准确性优于或等于其他机器学习算法。具体而言，它提供了关于基于宏基因组序列的深度学习模型中特征是如何生成的见解，这些特征可能如何被用于诊断宿主的疾病状况，以及它们运作机制。\n\
  \n# 医学数据收集与优化\n\n医疗行业的数据随着时间的推移不断积累，从基础类别进展到更复杂的类别。在医学数据收集案例中，组成数据的数据和结构可以分解为其原始形式，以及数据达到当前状态的过程\
  \ [13]。以癌症数据集作例，它被分为早期良性癌症和恶性癌症。随着医学知识的演变和新数据的可用，二分类结构被多分类结构取代。随着数据集从二分类结构进展到多分类结构，疾病子类的标签也更加增加。\n\
  \n在机器学习中构建多分类模型需要使用更多的计算机资源。模型优化被用于提高多分类模型的准确性。在生死抉择中非常关键，模型优化在这种情况下至关重要。模型必须经过长时间的训练才能用于此模型优化任务。在这项研究中，将采用一种名为“单类组预测”（`Group-of-Single-Class\
  \ Prediction` (`GOSC`)）的新颖策略，以最短的时间训练模型以获得最佳结果。它与多数投票和模型迁移相结合。最大的优势是，它能够让你创建一个接近绝对最大准确性的理想多分类分类模型，同时将训练时间缩短高达\
  \ 70%。机器学习被用于肝脏数据进行分类。通过应用深度学习完成了 `COVID-19` 肺 CT 数据的分类。根据早期统计，这种新程序似乎是行的。\n\n#\
  \ 组织病学成像与深度学习\n\n通过观察组织病学图像，可以了解许多疾病，包括癌症、脑肿瘤、脂肪肝和先天性心脏问题 [14]。在现实世界中，需要领域专家才能使这种耗时的诊断方法有效。在决策过程的每个阶段，病理学家可能会得出不同的结论。在诊断过程开始阶段解决这些挑战时，机器学习可以通过许多方式被应用。当病理学家检查组织病学图像时，深度学习算法可能帮助他们工作得更快并得出更正确的结论。\n\
  \n自动学习特征的深度学习算法在分析组织病学图像方面优于依赖系统预设特征的其它机器学习方法。本研究旨在通过基于块的轻量级 `CNN` 对组织病学图像进行分类，以检测放射引起的肝损伤。所提技术被用于对放射诱性肝病数据集的\
  \ 555 张组织病学图像进行分类，结果发表在 `Radiology` 上。测试人员未获得测试集的访问权限，导致在测试集上二分类准确率达到 `100%`，多分类准确率达到\
  \ `87.577%`。`ResNet-50`、`Vgg16` 和 `Google Net` 等模型对于此目的还不够，无法拥有它们更好的模型。这是深度学习首次用于检测放射诱性肝疾病数据，是该领域的首创。这种方法未来对病理学家可能具有价值。这项研究在医学领域具有重要意义，因为它识别了肝功能受损的风险因素。\n\
  \n# TIL 标志物研究\n\nTIL（浸润淋巴细胞）引起了转化癌症研究者的关注，因为它们潜力作为疾病进展和临床结果的标志物 [15]。精炼且扩展的深度学习算法可用于确定\
  \ `20×` 放大倍下 `100 × 100` 像素的 `50 × 50 µm` 瓷砖图像块是否为特定基因的阳性或阴性。可以使用这种技术创建 `TIL` 图，以确定在\
  \ 23 种不同类型的癌症中 `TILs` 的数量和位置。\n\n利用第一代 TIL 模型的病理学家注释和计算机生成的标签，为 13 种不同癌症训练了三种流行的\
  \ `CNN` 架构。这是通过使用大量的训练数据（模型生成的注释）实现的。该训练数据集包含身体不同部位肿瘤的 TIL 阳性和阴性斑块，以及经过领域专家审查和批准的数据。所有这一切通过减少已知的假阳性和假阴性数量，有助于算法性能的提升。为了创建\
  \ TIL 图，开发了一种新型的 TIL 方法，利用自动阈值将模型预测转换为二分类。与原始模型相比，所有修改 TIL 模型的人表现都优于原始模型，准确率和 F\
  \ 分数分别提高了高达 `13%` 和 `15%`。除了评估代码外，公众还可以访问这些独一无二的 TIL 模型以及 `TIL-Maps-23`，该集合将 23\
  \ 种不同癌症的 `7983` 张 WSI 的 TIL 图汇编成了一个集合。\n\n\n\n\n肝脏疾病是全球死亡率上升的重要原因之一 [16]。如果能早期发现肝脏疾病，可能会减少其死亡人数。在医生诊室内，CT\
  \ 是一种允许查看肝脏图像的程序。大量的肝脏图像可能让放射科医生认为他们已经理解了肝脏的问题。这可能导致如肝癌等潜在威胁生命的疾病。需要机器学习算法根据其解决方案的纹理来确定这些挑战的性质。根据这项研究，有两种筛查肝脏问题的替代技术。在第一种技术中（基于经典机器学习），根据其所拥有的纹理对物体进行分类。通过将自动纹理分析与监督学习方法相结合，这项技术增强了机器学习算法的能力。该主题通过使用来自\
  \ 71 个不同人的 3000 多个 CT 图像样本得到了解答。所有 CT 图片在使用之前都经过了临床确认。有必要采用监督学习方法来创建代表相同状况的图像类别，以确保肝脏组织不是正常的。使用机器学习技术检测\
  \ CT 图像中的非对称模式。通过使用 `KNN`、`Naive Bayes (NB)`、`Support Vector Machine (SVM)` 和 `Random\
  \ Forest (RF)` 等其他方法确定了特征向量运行的有效性。在寻找肝脏疾病时，第二步是将术语分为几类。通过使用安全注入系统（SIS）完成 `CNN` 的使用。高密度图使用这种方法进行编码，这种方法利用了聚焦注意力。该算法已经学会了根据\
  \ CT 扫描结果区分五种不同的疾病。模型的卓越发现证明了它能够完成其声称能够完成。证据表明，纹理分析方法可以用于区分和检测人类肝脏的异常，这是一项很有前景的发展。这对于放射科医生和医学物理学家预测肝脏疾病的严重程度和扩散可能有用。\n\
  \n随着癌症病例和使用正电子发射层/计算机断层扫描（PET/CT）人数的增加，辅助放射科医生的自动化癌症筛查系统变得越来越重要 [17]。如今基于图像的 PET/CT\
  \ 方法通常局限于特定的身体部位，这是一个重大的限制。本文提出了一种基于深度学习的策略来识别不同器官特定恶性肿瘤的形式，以帮助放射科医生工作。在分类模型中，这项研究包含一个整合了来自多个源\
  \ PET 图像、CT 图像和多器官分割数据的模块。分割输出为网络提供了地图，指导它应该在何处集中精力。它告知网络需要从全身 PET/CT 图像中学习与器官相关的方面，以便正常运行。这里展示了在\
  \ PET/CT 扫描中越来越流行的肺部数据计算机断层扫描（LDCT）图像。使用双级 `V-net` 来分割 LDCT 图像中的大量不同器官，作者推荐的灰度变换方法处理了未标记数据的问题，而双级\
  \ `V-net` 通过将图像转换为灰度为图像增加了上下文信息。PET/CT 扫描可以根据执行扫描的技术分为六类不同的筛查类型（健康、食道癌、胃癌、肝癌、胰腺癌和肺癌）。分类器的\
  \ `F-score` 为 82.3%，这表明它在放射科医生的癌症筛查工作中可能有用。\n\n## 3.3 建议的方法\n\n根据目前的医学成像研究，亚洲国家肝癌的发病率正在上升。活检等侵入性程序可能具有风险且不适，它们是确定身体问题的最有效方法之一。因此，除非有迫切需求，否则在大多数情况下不建议这样做。图像处理技术和程序作为这种范式的替代方案，可以帮助临床医生确定患者的问题。然而，为了有效使用这些工具和程序，需要高水平的能力和实践。肝脏图像的纹理以一种不明显的方式展示了健康肝和病肝之间的差异。借助先进的图像处理技术获取材料并对其进行检查。通常来说，在为观众提供尽可能真实的纹理信息时，有两种方法可供选择：基于梯度的方法和灰级共性分析。可以使用名为\
  \ CT 扫描的计算机辅助成像设备查看肝脏图像。该仪器可以与 CT 扫描 [17, 18]、MRI、X 射线和超声波结合使用。利用成像模态提供有关肿瘤位置和大小的信息，以及它与身体其他器官和组织的关系。这项研究的目的是确定分类器的分类率在肝脏肿瘤检测过程中是如何演变的。识别肝肿瘤的过程可以分为四个部分：\n\
  \n1. 图像采集\n2. 预处理\n3. 特征提取\n4. 分类\n\n观察肝脏肿瘤图像分类率有两种方法：首先是不进行预处理，然后是进行预处理和进一步处理。预处理通过使用邻域收缩（neighbour\
  \ shrink）完成，特征提取通过使用池化层完成。在分类时，应用了 `CNN` [19, 20] 方法。\n\n所建议的研究框图如图 图 3.2 所示。\n\n\
  \n\n\n其他 50 名贡献者来自不同的背景，包括工程、计算机科学和医学图像处理机构。在某些情况下，例如神经计算，《IEEE 生物医学健康信息学杂志》、《计算机与生物医学》以及《国际计算机辅助放射学杂志[20]，清晰地如图\
  \ 3.3 中所示[21]，而在外科领域则存在例外。这些出版物大部分发表在致力于计算机科学或生物医学信息学的期刊上。\n\n![图 3.3 肝癌分类的建议流程图](img/c03-fig-0003.jpg)\n\
  \n图 3.3 肝癌分类的建议流程图。\n\n### 3.3.1 高斯混合模型\n\n分水岭变换是一种根据外观对属性划分的方法。在这种方法下，灰度图像被视为“空间缓解”，而近极小值被视为“集水盆”。当水溢出并建立边界时，就会形成分水岭。结果是图像被完全一分为两半。使用形态学方法构建图像结构。通常在此过程中，会从灰度图像中去除结构噪声和其他不良元素。通过改变倾斜图像使其看起来像分水岭。结果使得构建平滑的边界结构变得简单得多。图像是更大系统的一部分，该大系统的每个组件都与单个像素通信。在高斯混合模型中，图像像素被视为高斯混合模型（GMM）中的随机变量。为了表示图像像素，变量\
  \ `x` 是具有 RGB 值的三维变量。在确定图像的概率时，利用了加权高斯色散。区域总数为 `k`，符合标准的负载集是所有负载的集合。在该国家的部分，有一个术语指的是该区域高斯传输的均值和标准差。在确定\
  \ GMM 优劣之前，先确定模型的参数。确定 GMM 最流行的方法是寻找最可能的结果。测试的主要目标是增加 GMM 的似然性。测试过程中使用了期望最大化（EM）方法。\n\
  \n### 3.3.2 数据集描述\n\n在 [medicaldecathlon.com/](http://medicaldecathlon.com/) [22]\
  \ 上对大量人员进行了观察和成像。该研究包括 20 个人，总共 68 个病变。它是使用一个包含 14 人、55 个病变且进行了 CT 扫描的测试集进行的。另一项\
  \ CT 成像揭示了一项 2010 年进行的针对 182 个病变的小研究结果（53 个囊肿、64 个转移瘤和 65 个血管瘤）。尽管医学数据库可以在线访问，但作者声称它们的范围有限，仅适用于特定的医学疾病。他们还声称获取数据集非常困难。人员研究了\
  \ 75 名接受 3D 多期增强 CT 扫描的参与者。医生检查了局灶性结节性增生（FNH）、HCC、血管瘤等。\n\n第四次进行增强对比的肝脏 CT 扫描见图\
  \ 3.4。在之前的项调查中，发现了三个不同阶段的肝肿瘤图像（无对比剂增强、动脉期和延迟期）。如前所述，观察者被分为五组。另一方面，134 名患者进行了上腹部\
  \ MRI 扫描（37.7% 原发肝肿，62.3% 转移性病变）。二十名患者的 MRI 图像中有 1700 个互不接触的不同区域。只有一名研究人员使用超声图像检查了\
  \ 94 名参与者的肝脏。照片中有 48 个正常肝、50 个硬肝和 41 个在肝化基础上形成的 HCC，因此它们都被代表了。其他文件还包括实验数据，例如 127\
  \ 张肝病照片。\n\n![图 3.4 多期增强肝脏基础 CT 扫描](img/c03-fig-0004.jpg)\n\n图 3.4 多期增强肝脏基础 CT 扫描。\n\
  \n### 3.3.3 性能指标\n\n### 3.3.3.1 准确率测量\n\n本研究利用了多种准确率指标，作为起点，系统运行以及它在将肝脏分割成部分和识别异常方面的准确性。之后，系统与其他\
  \ CNN 比较的性能。最后，深度 CNN 方法的敏感性、特异性和准确率的特征以及其他。第六，将深度 CNN 方法与贝叶斯模型和基准方法进行比较，以查看哪种更准确。训练的放射学专业人员通过眼睛比较两个数据（精确率和召回率）。本研究在使用一种基于\
  \ CNN 的系统来确定现有的非网络型肝病变诊断方法表现如何。许多实验没有评估其结果的敏感性或特异性。\n\n使用 CT 图像分割了图 3.5 所示的肝肿瘤，如前所述。特别是肝分割、多尺度候选的形成、活动轮廓模型的构建以及候选的选择都包含在本节中。根据研究人员的说法，机器学习算法用于划分肝肿瘤。数据质量[23]–26](#c03.xhtml#c3-bib-0026)]对于实施机器学习算法至关重要。创建了大量的\
  \ CNN，目标是将肝脏与病变分离。在数据集中，你会发现并没有许多掩膜可以帮助医生更容易地查看病变的位置。在训练样本有限的情况下，教网络未来所需的不变性和高效特性至关重要。在这种情况下，当病变大小变化时，生成从\
  \ 0.8 到 1.2 的尺度。\n\n![图 3.5 基于 CNN 的图像](img/c03-fig-0005.jpg)\n\n图 3.5 基于 CNN 的图像。\n\
  \n在获得一致测量值后，使用最近邻方法对图像进行重采样以提供更准确的结果。CNN 分割技术产生了以下发现。使用了四种不同的尺度来确定数据集中每张照片的大小。通过图\
  \ 3.6 中的混淆矩阵，目标是在提高病变分割准确性的同时，减少所检查像素的值。肝脏和肿瘤被区分的精度证明了混合学习策略的有效性。当模糊边界被有效分离时，高速数据分割变得更加准确。大的边缘有助于实现这一点。尽管混合特征有助于肿瘤分割，但由于它们在较少的切片中被检测到，只能用于微小恶性肿瘤。所提\
  \ CNN 在训练和验证过程中学习和测试的周期次数方面的训练和验证准确率（蓝色曲线显示了训练准确率，绿色曲线暗示了验证准确率）。\n\n\n\n\n\n![图\
  \ 3.6 ROC 曲线的混淆矩阵](img/c03-fig-0006.jpg)\n\n图 3.6 ROC 曲线的混淆矩阵。\n\n为了确定该流程对各种类型肝脏的处理性能，计算了体积误差。当使用约\
  \ 14 个训练样本时，不准确性保持保持性。当使用约 23 个训练样本时，错误率并非最优状态。即使在最严重的癌症病例中，当图像噪声量和患者位置改变时，预测肿瘤负荷的准确性也会大幅提高。研究对类型纠正前后的结果进行了比较。在分割出现显著误差的情况下，体积误差从总量的\
  \ 28.9%下降到 6.6%。当存在肿瘤时，体积误差的比例也从 17.0%下降到 5.2%。`CNN` 方法的体积不准确性见图 3.7。研究人员开展了三次回顾性临床研究，包括肝脏\
  \ CT 扫描（增强、动脉期和延迟期，无对比剂）。很少发生的肿块无法用于确定病变的形状，因为它没有一致的模式。因此，有必要通过比较随时间的对比剂注射率来验证诊断，以确保诊断是正确的。在历史上，提取过程中使用了许多不同的传统。这些传统中的许多可以在计算机视觉中使用的提取函数中找到。由于深度学习网络中的节点数量对网络分类和检测肺部\
  \ CT 结节的能力有显著影响，因此构建网络的传统方法是在训练网络之前尽可能加深。通过这种方法，肺部 CT 结节分类的假阳性数量减少了。一种利用 `CNNs`\
  \ 对项目分类的方法。本研究采用了一种基于二维 `CNN` 的方法，将肺结节候选归类为阳性肺结节或阴性非结节。这样做是为了消除最近发现的肺结节候选中的假阳性。\n\
  \n![图 3.7 应用所提算法后的分类输出](img/c03-fig-0007.jpg)\n\n图 3.7 应用所提算法后的分类输出。\n\n网络输出是输入块中中心像素（目标像素）的几率。网络有两个输出神经元。一个是非肿瘤的概率（0~1）；另一个是肿瘤的概率（0~1，如图\
  \ 3.7，而当目标像素无肿瘤时，输出为 (1, 0)。使用交叉熵函数作为损失函数来衡量学习的精确性。与其他现有方法相比，所提方法的复杂性较低。该函数已用于衡量权重和权重损失误差。\n\
  \n### 3.3.3.2 主要发现\n\n他们在进行测试时发现，区分肝脏肿块的平均准确率为 0.84，且受试者工作特征曲线（ROC 曲线）的斜率为 92。在三次交叉验证研究中，94.6%的发现是正确的，仅有\
  \ 2.9%的结果是不正确的。在过去的 5 或 6 年里，人工智能（AI）在图像处理研究中变得越来越重要，手工算法的使用优先于深度学习框架的使用，并倾向于使用人类创建的算法。为了确定\
  \ `CNN` 是否可能用于深度学习分析肝癌图像，研究人员进行了这项研究以回答该问题（肝细胞癌和肝转移癌或肝肿块）。在调查过程中，发现了 11 项研究。由于可用数据种类繁、报告结果存在空白以及完成相同任务的多种不同方法，无法进行元分析。这些查询结果建立了一些特定的准则。首先，诸如\
  \ `CNN` 等深度学习架构已通过使用 `CNN` 来增强医学成像。\n\n在调查中，CT 扫描、超声和磁共振成像（MRI）扫描，以及肝肿瘤的组织学和细胞图像均被证明相当准确。尽管在发表时，每种恶性肿瘤只有少数深入的原始研究，但所有\
  \ 11 篇研究论文都发表于 2017 和 2018 年。因此，`CNNs`及其在医学科学中的应用表明，由 CNN 描述的深度学习是一个新兴的研究课题。除了测试数据如何汇总和算法如何开发外，还需要讨论如何获取和评估图像源、参与研究的患者以及临床数据。当检查完成后，发现所用方法之间没有一致性或统一性。必须开展来自医学、计算机科学和工程领域的等人数作者的研究，以确保研究可以被不同职业的人士利用。比较使用相同数据集测试的研究文章结果将是一次有趣的比较练习。\n\
  \n遗憾的是，大多数研究没有说明数据集的来源，这使得很难确定测试是否以相同的方式进行。这些信息对于比较和评估是必要的。当作者编写关于深度学习的文章时，我们认为希望发表作品的作品也将遵循同一一套原则。他们将对了解使用了哪些数据集以及结果是如何评估的感兴趣。然而，这项研究确实存在一些问题。由于病变类型非常多样，在解释数据和确定其显著性时存在困难。由于“发表偏倚”，不出色的研究可能没有向公众公开。在其他语言中可能写有关于此主题的优秀文章，但只有以英文发表的文章才被纳入该合集。根据本研究的结果，这展示了迄为止英语文献在这一问题上所做的工作。每一项都是独特的，取决于谁进行了研究、进行了什么类型的研究、如何进行以及使用了什么类型的方法论。\n\
  \n### 3.3.3.3 解决的关键问题\n\n\n\n\n\n本研究调查了 `CNN` 的多个不同方面，包括其功能原理以及如何训练它们（`CNNs`）。首先，`CNNs`\
  \ 能够在短时间内区分出 `HCC`（肝细胞癌）与其他类型的肝癌。其次，`CNNs` 可用于在肝癌领域执行多种任务，包括病变识别、病变分类和病变分割。第三，`CNN`\
  \ 不仅用于查看肝癌的放射学图像；它还可用于其他目的。该技术还可用于研究病理和细胞研究问题。但该领域的现有文献仍存在几个需要解决的问题。遗憾的是，目前还没有足够的长期肝脏计算机断层扫描（`CT`）扫描研究可用于比较独立方案和随访方法与长期\
  \ `CT` 扫描结果的结果。此外，关于该问题的研究较少，多中心研究也并不多。研究人员可能比较随时间与基线扫描相比的变化，这可能使他们在长期试验中更及时地检测到新的微小肝癌。\n\
  \n`CNN` 作为一种用于生物医学研究的 AI 技术，以及其他深度学习技术 `[27, 28]` 重新引发了该问题的关注。本文讨论了肝细胞癌（`HCC`）和其他肝癌，探讨了关于利用卷积神经网络（`CNNs`）观察这些肿瘤的现状。同时也考虑这种尖端技术如何帮助医生在现实世界做出更准确的诊断。虽然该研究专注于胃肠科和肿瘤学中一个充满前景的新领域，但研究人员在获取图像方面遇到了困难，这使得将机器学习算法应用于医学数据集并获得高精度图像分类变得困难。最终，该研究未取得成功。因此，必须修改\
  \ `CNN` 设计，以包含更多各种原因导致的肝硬化患者，以及肝硬化基础上患有 `HCC` 的患者或纤维化等肝继发性疾病的患者。使用 `CNNs` 调查 `HCC`\
  \ 或肝肿，在 `PubMed`、`EMBASE` 和 `Web of Science` 中搜索详细描述肿瘤或肿块病理结构、细胞组成和放射图像的出版物。通过特定的提取方法对数据进行分析，以查看\
  \ `CNNs` 在诊断癌症或早期癌症方面是否准确有效。研究的主要结果是哪种癌症或肝肿瘤的诊断准确率最高，以及哪种照片检测癌症准确率最高，这两者在研究中均被发现。发现的研究非常少。在进行测试时，发现它能够区分肝肿块与其他肝问题，并区分\
  \ `HCC` 与肝硬化或肿瘤生长。研究通过两种不同方法调查了 `HCC` 肿瘤的细胞核。大量实验表明，`CNNs` 在其预测方面是准确的。\n\n研究人员试图在调查中尝试定位、表征和解剖病变。使用了许多不同的方法来确定\
  \ `CNN` 模型的准确性。目前大多数研究集中在肝肿瘤；然而，临床试验的数量较少且受限，需要更多研究来确定 `CNNs` 所用算法存在什么问题。在对放射学和病理学的常见癌症图像进行病变分割、分类和识别时，`CNNs`\
  \ 表现良好。由于所有这些问题，如今这类研究也变得困难。需要进行多中心调查，以提供 `CNN` 如何应用于 `HCC` 和其他肝脏治疗的全面图景。由于放射成像的局限性，区分原发性和继发性肝癌（肝转移）或其他肝肿瘤可能是困难的。本研究表明，基于\
  \ `CT` 的深度学习算法区分肝转移和原发性肝肿瘤是有效的。在评估系统性能和计算正性预测值时，应该对构成系统性能的 `CNNs` 的准确性和敏感性给予更多关注。\n\
  \n## 3.4. 结论\n\n鉴于使用 `CNNs` 解读肝癌图像的研究日益增多，确保这些研究的正确性并为进一步研究建立目标至关重要。由于大型肝肿瘤在历史上一直是研究的重点，公众能看到的论文数量相当有限。大多数研究在患者描述、医学要素和流程中的技术计算机相关部分之间的内容比例上不平衡。此外，应该将\
  \ `CNNs`与其他模型进行比较，特别是当每个模型在面对一组大小和形状与其他图像相同的照片时，其准确性和敏感性表现如何。因此，这些领域的未来研究应以合作的方式进行，并让患有各种疾病的患者参与。`CNNs`\
  \ 在肝脏肿瘤学中的应用正变得越来越重要。\n\n## References\n\n1. 1\\. Neal Joshua, E.S., Bhattacharyya,\
