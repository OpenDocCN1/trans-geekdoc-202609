  \n*   它为驾驶员提供指令以及车位信息。它可以用于现有的停车场。\n\n*   实施成本高且耗时较长。\n\n*   基于无线传感器网络的智能停车服务 [43,\
  \ 44]]。\n\n*   正在使用 `android` 应用程序。\n\n*   它具有更好的界面。\n\n*   它缺乏预约功能。\n\n## 15.5.\
  \ 车辆停车系统的传感器\n\n传感器对于使这种基于物联网的智能车辆停车系统变得实用至关重要。市场上上有多种类型的传感器可应用于这项技术。每种类型的传感器在成功实施时都有其自身的优缺点。使用传感器的主要目标是实时寻找空车位，以识别车辆进入停车位的情况并确保……\n\
  \n### 15.5.1 主动传感器\n\n使用了图像处理技术。利用传感器摄像头采集图像，以辅助判断是否有可用停车位。然而，在可见性方面，雨、雾、雪等天气条件可能会对系统产生影响。\n\
  \n摄像头被用作传感器来检测车辆的存在。\n\n没有 `GPS`，且某些天气条件（如雨雾）不兼容。系统处于固定位置。\n\n（注：原文中存在大量重复段落，已根据指令进行去重并保留核心内容。）\n\
  \n\n\n\n压电传感器由于其自供电能力，主要被应用于多个领域。外部环境负载（即施加在系统上的力）被转换为电能，为传感器模块供电。压电晶将应变能转换为有用的电脉冲。电能的强度主要取决于施加的力。压电传感器放置在停车位上。由于车辆位移重量，可以对车辆移动进行逐渐监测。\n\
  \n## 15.6 面向印度智慧城市的物联网车辆停车系统\n\n![图 15.6 市内交通的特殊停车位。](img/c15-fig-0006.jpg)\n\n\
  `图 15.6` 市内交通的特殊停车位。物联网技术近年来已应用于许多领域。其应用范围从医疗保健 `48–`51`、制造业 `52`、遥感 `53`、`54`、状态监测\
  \ `55`、`56`、发电 `57`、输电 `58–`60`、汽车工业 `61–`63`、智能农业 `64`、`65`、智慧城市 `66–`68` 等。它将使老城市焕发生机变为现代智慧城市。它是智慧城市的重要组成部分。将物联网技术引入车辆停车系统对智慧城市来说更有利。基于物联网的车辆停车技术被广泛用于消除最近停车位的不确定性以及可用停车资源的有效利用\
  \ `69`。在市中心，建造了特殊停车位以管理城市停车空间需求，如`图 15.6`](c15.xhtml#c15-fig-0006）所示。这种先进系统引导驾驶员在更短的时间内搜索并停车辆。这有助于市政和私营停车服务供应商实现停车空间的最优利用。城市车辆管理系统使用这种停车技术进行有效的交通管理，并为市内车辆提供可能的停车位\
  \ `70`。\n\n智能停车技术专为不同的目的而设计，以管理几类车辆。市政停车服务旨在管理市内的停车空间需求。另一种是私营停车服务，即商业楼、公司办公室或购物中心，旨在为其客户提供便利。通常，停车位被规划在顶层和地下空间。购物场或商业建筑中的智能智慧停车系统吸引客户进入其专属空间。\n\
  \n在车辆停车管理系统中，有几种操作需要执行以有效处理车辆。`图 15.7`](c15.xhtml#c15-fig-0007) 展示了车辆管理系统，该系统包含多个传感器和停车管理工具。首先，必须检测进入的车辆并将其引导至空闲停车位。这为驾驶员、客户和停车服务供应商带来了许多益处。在密集的城市地区，道路上的车辆数量巨大。客户觉得在有限的时间内识别本地停车位非常困难。这种智能系统根据请求向驾驶员和客户提供关于最近可用停车位的信息。在使用这种智能智能系统时，车辆可以在有限时间内快速获得停车位。此外，通过消除因停车位不确定性而导致的无效搜索，车辆减少了碳排放并提高了燃油经济性。\n\
  \n![图 15.7 车辆管理系统。](img/c15-fig-0007.jpg)\n\n`图 15.7` 车辆管理系统。这种智能系统有助于停车服务供应商通过有效利用停车位获得利润。分析中央服务器中的可用数据以获得关于停车位需求时间的清晰知识。通常，每天傍晚和休息会有大量的车辆移动和停车需求。高效的定价策略、快速的支付接收选项和简单的预留系统吸引大量客户进入停车系统。动态定价系统（即在需求高峰时段略微提高价格）有助于停车服务供应商获得更高利润。\n\
  \n在实时应用中实施基于物联网的智能停车系统需要若干操作。智能停车系统的主要操作是车辆感知系统。传感器安装在停车入口区域以感知车辆进入。每个停车位都安装了网络连接传感元件，以了解停车区域是否空闲。实时数据在停车管理系统的中央服务器中持续更新。这种传感数据操作是该智能系统的骨干。然后，数据传输是下一个最重要的操作，将收集到的车辆进入和停车分配信息连续地传输到中央服务器。在有线或无线方式形式的数据传输期间，数据安全非常重要。还确保了存储信息的安全以防止未经授权的数据黑客攻击。停车系统中实施了多种安全措施以确保存储信息的安全。下一个操作是对停车系统可用信息的智能处理。来自车辆所有者的动态请求通过合适的算法进行处理，并有效利用了停车位\
  \ `71`。移动 App 和网页主要供客户用于预订停车位。\n\n### 15.6.1 通过智能设备为客户提供引导\n\n主要，客户或驾驶员得到良好引导，在特定的预留区域停放而不产生不确定性。停车管理系统使用多种设备为车辆驾驶员提供良好引导。停车位内安装了线圈检测器、红外线、超声波、微波或可变显示牌类型的引导系统。这种引导系统为车辆驾驶员提供正确的路线而不会产生困惑。`图\
  \ 15.8`](c15.xhtml#c15-fig-0008) 展示了停车预留区域多个传感器的有效利用，引导客户进入其分配的车位。\n\n\n\n\n各种操作通过中央服务器以集中化或去中心化的形式在停车系统中完成。驾驶员搜索移动应用程序或网站以了解车辆停车位的详细信息。在大多数地方，停车位是根据先来后得原则分配的。第一个请求者根据请求获得车位。下一个请求被转到队列中。中央服务器通过从\
  \ `IoT` 模块收集信息，为每个请求固定停车位。`Global Positioning System`（全球定位系统）的可靠性和网络速度对于该系统的成功实施至关重要。如果网络速度低，所有的停车管理系统概念都将无法实现。该停车系统中还存在其他实际问题。考虑一个驾驶员在特定区域请求停车位，中央服务器分配了一个停车位。如果驾驶员不配合或拒绝了该分配的车位，将导致车辆停车延迟，降低停车效率。尽管对停车位有需求，且车位是空闲，但由于驾驶员的不配合，停车服务供应商的收入受到了影响。一些停车服务供应商通过设定固定充值费来弥补这种收入损失。最后，停车位详情的动态更新以及车辆进入空闲空间，为初始投资者带来了合理的收益。\n\
  \n### 15.6.2 智能停车预约系统\n\n在成功建立停车系统基础设施后，服务供应商必须关注停车预约系统。车位的预约必须由停车服务供应商或市政委员会妥善处理，以实现收益最大化或停车费最小化。私立服务供应商根据需求设定更高价格来提高停车价格。市政委员会向城市居民通报交通流量情况。市政委员会通过降低停车费以更低廉的费用鼓励当地公众\
  \ [72]。客户可以根据可用信息在交通低峰时段安排他们的行程。因此，智能预约系统需要关于过去城市交通和停车位使用的完整信息以便进行未来预测。通常，从过去的信息中可以识别高峰时段。这些信息详细列在网站或移动应用程序上，以向公众或驾驶员提供高峰时段的信息。客户或驾驶员根据可用信息调整他们的行程，或者准备在高峰时段支付更高的价格\
  \ [73]。因此，这种智能预约系统将客户需求与停车位的可用性相接。车位分配后，信息会通过短信发送到驾驶员的手机上。此外，预约系统提供有关特定日期需求的数据。公众通过预约系统提前确定停车位。当天的交通和车位需求会提前预估。这些信息指导停车服务在特定时间设定车位的动态价格。这种智能管理系统的另一个主要优势是为有紧急请求的需要公众提供服务。来自公众或驾驶员的多项请求会被妥善识别和消除。可以通过短信或应用程序向驾驶员告知邻近停车位的信息\
  \ [74]。\n\n根据收集的信息，对车位需求进行了分类。例如，在白天，银行或办公室为其员工需要大量的停车位。在晚上，公众主要利用停车位。根据中央服务器的信息，服务部门估计了常规银行工作或办公室工作员工可能产生的最低收益。此外，这些信息为服务供应商提供了一个清晰的视角，判断停车服务在未来是否可以扩展\
  \ [75, 76]。\n\n### 15.7 基于 IoT 的车辆停车系统的优势\n\n由 `IoT` 设备辅助的智能停车系统在印度智慧城市中不断普及。基于\
  \ `IoT` 的车辆停车技术因其巨大的效益而被使用，提高了知名商场或商业建筑的品牌形象。识别空闲停车位所需的时间大幅减少。驾驶员或客户可以轻松地找到位置。由于花费时间缩短且驾驶员可以找到无烦恼的停车场，这具有环境效益。由于其智能化使用，停车位的利用率更高。通过提供适当的停车位，知名建筑周围的交通流量减少。污染和管理成本也随之降低。更智能的预约和支付系统即使在高峰时段也改善了整体体验。车辆和客户的安全得到了提高。由于停车位使用\
  \ `CCTV` 设备进行完全监控，车辆的进出被妥善记录。店主通过为客户提供更好的便利性，增强了客户的满意度。由于车辆拥堵导致的高峰时段摩擦得到了大幅减少。由于驾驶员知道确切的位置，汽车不必要的怠速和行驶大部分情况下被消除了。\n\
  \n停车管理系统的开销降至最低。这是高密度城市地区的新业务模式。处理整个过程的动态模型为投资者带来了更高的收益。实时数据在中央服务器中持续更新。移动应用程序和智能设备使得停车协助、车位定位、预约系统、整体管理和收费变得非常容易。这种车辆停车系统对于印度智慧城市项目实现目标非常重要。\n\
  \n## 15.8 结论\n\n总体，本章讨论了停车系统中的各种方法或技术。物联网的传感器或设备的普及增加了系统的可靠性，允许基于物联网的应用的发展。`IoT`\
  \ 为交通管理提供了广泛的解决方案，包括用于获得最佳的车辆通信。本章有助于理解智慧城市概念下的各种交通管理方法。详细介绍了印度政府的“智慧城市任务”。还讨论了智慧城市背景下的车辆停车需求。并介绍了文献中可以建议的不同技术。在这些技术中，基于\
  \ IoT 的车辆停车系统具有很好的优点。\n\n## 参考文献\n\n1. Zakhem, M. and Smith-Colin, J., Micromobility\
