  ## 摘要\n印度城市化进程正在加速，并将在未来几年达到顶点。城市地区现在拥有人口的三分之一，并承诺进一步发展。尽管启动了各种政策来应对日益增长的交通需求，印度未能与其同行并肩。交通领域未能采用新技术的成本比任何国家都高。智能交通系统\
  \ (ITS) 可用于消除印度基础设施中的效率低下和拥堵。它包含涉及数据存储、人工智能视觉、通信、控制系统和传感器的信息技术。ITS 试图通过管理交通、为驾驶员提供其他信息来优化汽车运行。交通的未来在于以下技术：智能基础设施、共享出行、按需移动、劳动力开发、连接车辆、大数据和分析以及自动驾驶车辆。报告的主要目标是了解\
  \ ITS 的最新进展，进一步了解可行性分析、应用、挑战和未来工作。\n\n关键词：智能交通系统、基础设施部门、城市基础设施、智能基础设施、连接车辆\n\n##\
  \ 引言\n每种商品在生产到分销的所有阶段都需要运输，运输对于任何地区的经济进步都至关重要。经济和社会发展反映在交通基础设施中。在印度等发展中国家，由于 70%\
  \ 以上的人口住在农村，城市地区的崛起并不代表国家的整体成功。如果能在农村和城市地区提供适当的交通设施，将实现经济增长。由于发展中国家的交通状况复杂，其交通情况与发达国家不同。\n\
  \n\n\n\n\n从马车时代到技术进步以及城市交通网络的发展，近年来交通发生了巨大的变化 [5]。根据哈拉帕和摩亨德达罗的考古发现，道路在公元前 25 年至\
  \ 35 世纪之间就已经存在。在英国统治下，印度的道路和交通系统的建立是为了促进贸易和管理。交通发展的进步本质上与文明的增长紧密相关 [6]。随着全球日益工业化和城市化，在不同点点之间传输人员和货物的不同方法变得至关重要\
  \ [6, 7]。由于工业增长，人口在城市中快速定居促进了城市扩张。由于大多数人的居住地离工作地点很远，提供廉价高效的交通已成为城市生活中最重要的部分之一 [8]。它试图用机械能代替动物动力。1881\
  \ 年，有电车公司在印度加尔塔开始运营公共交通系统。加尔塔最初的有电车是由马拉的。几年后，蒸汽机被用于拉动有电车 [9]。1931 年，有电车被淘汰，取而代之的是汽油动力巴士。自\
  \ 1920 年以来，机械巴士道路交通已进入印度的主要城市。交通有助于经济、工业、社会和文化的进步 [10]。\n\n大多数印度城市的建筑非常稠密，人口密度高且土地用途混合。交通部门一直难以跟上日益增长的需求，使经济面临风险\
  \ [11]。随着农村和城市地区交通能力的提高，人们迁往大都市的愿望减少，导致发展变得更加平衡。在城市中，良好的公共交通是长期移动性的关键组成部分。它通过提高运营效率、标准化票价和时间表以及增强可无性和换乘设施来保持其高标准\
  \ [12]。为了实现显著的生产力和效率提升，印度交通网络的未来架构必须努力鼓励多模态出行 [13]。\n\n本章有助于更好地理解印度交通业务中的提供者和客户面临的众多困难。该研究的一个主要目标是弄清楚什么是智能交通系统（ITS）以及它在全球范围内是如何被感知的。此外，研究人员对对印度\
  \ ITS 进行可行性评估感兴趣。此外，研究人员对印度 ITS 的重要领域好奇。\n\n## 13.2. ITS 入门\n\n相当新的技术旨在就各种交通管理和运输系统提供新颖的服务\
  \ [14]。它还让消费者能够获得适当的信息，并使用更加集成、复杂且更安全的交通网络。ITS 的一个目的始终是通过尽可能地减少交通拥堵来提高交通效率 [15]。这项技术为用户提供座位可用性、实时运行信息、交通和其他相关信息的提前通知，减少了行程过程，并增加了消费者的便利性和保护\
  \ [16]。\n\n事故案件的增加、道路建设不足以及扩大新道路的不可行请求可能都可以通过 ITS 解决，通过控制技术的应用使交通更安全、更高效、更安全、更快速\
  \ [17]。此外，这有助于缓解日益加剧的交通拥堵，从而缩短旅行时间和工业成本，并减少与交通相关的环境问题 [18]。\n\n先进公共交通系统 (APTS)、先进商业车辆运营系统、先进农村交通系统、先进交通管理系统\
  \ (ATMS) 和先进车辆控制系统都需要智能交通系统、通信系统、自动交通优先信号、信息处理器、`GPS` 更新、传感器和路边信息 [19]。\n\n## 13.3.\
  \ ITS 阶段\n\n交通管理中心 (TMC) 是 ITS 的不可组成部分 [20]。交通部门管理这一技术系统。所有数据在该系统中被捕获、处理和分析，用于交通运营和控制管理，提供有关当地车辆的实时统计和细节\
  \ [21]。带有精确位置信息的自动数据收集、提供详细交通知识的数据分析，以及随后将提取良好的特征重新循环给旅行者，对于高效运营和组织良好的交通控制中心都是都是的\
  \ [22]。ITS 的四个步骤是数据收集、传输、分析和行程信息。图 13.1 显示了 ITS 的四个条支柱，并提供了全面的数据以帮助我们理解实际系统：\n\n\
  **数据收集与通信**：快速、完整的数据收集和交换对于监测、规划和实施是必要的。可靠的数据收集通信系统将可靠的数据采集硬件与结构化的方法相结合，用于未来的 ITS\
  \ 活动。使用的硬件设备包括传感器、摄像头、全自动识别和处理器，可以为以后保存大量信息 [23]。\n\n**数据清洗、融合与分析都是数据分析的一部分**：在将数据交付\
  \ TMC 之前，来自传感器和其他设备的数据必须经过审查。必须剔除不稳定的数据并保持清晰的数据。为了评估和预测旅行问题，可能需要对多个源的输入进行合并或混合，此后这些评估交通模式的方法将用于为用户提供相关信息\
  \ [24]。\n\n![图 13.1 ITS 的阶段](img/c13-fig-0001.jpg)\n\n**图 13.1** ITS 的阶段。\n\n\n\n\
  \n\nITS 的主要功能如图 13.2 所示。全球、区域、省份和地方层面的业务利益和政策倡议影响着公共和私营部门的企业实践，从而影响 ITS 的部署 [29]。\n\
  \n![图 13.2 ITS 的功能。](img/c13-fig-0002.jpg)\n\n图 13.2 ITS 的功能。\n\n为了解决典型的交通难题，ITS\
  \ 是一种优先考虑数据量、高效决策和增加系统灵活性的便捷流程。这与某些更频繁的增加物理能力和扩大交通网络的方法不同 [29–31]。在传统策略可能无法发挥的情况下（例如人口稠密地区或受严格环保限制的地方），ITS\
  \ 为控制未来的交通需求提供了选择。传感器、通信和认知计算是可能整合到交通解决方案中的工具示例，以提高其效率、安全性、经济以及在重大中断情况下网络运行的韧性 [32]。\n\
  \n## 13.5. ITS 优势\n\nITS 提供实时交通和行程信息以及灵活网络管理方法的能力是最重要的特征 [33–35]。图 13.3 显示了 ITS\
  \ 的主要优势，它是长期交通系统的关键组成部分，：\n\n*   满足在特定地区生活和工作或安全使用公共交通工具的人员的可性和流动需求。\n*   提供各种可访问且经济的交通解决方案，以充分利用现有基础设施。\n\
  *   为道路用户提供高水平的服务，控制交通和意外事件。\n*   允许减少道路交通带来的空气污染和噪音，从而改善公共和环境健康。\n\n![图 13.3 ITS\
  \ 的优势。](img/c13-fig-0003.jpg)\n\n图 13.3 ITS 的优势。\n\n*   促进经济繁荣和高效的货物及货运运输。\n*  \
  \ 提供了一种实施交通政策的机制，例如需求管理或优先考虑公共交通。\n\n## 13.6. ITS 应用\n\nATMS、应急管理系统 (EMS)、先进旅客信息系统\
  \ (ATIS) 和先进乘客交通管理系统 (APTMS) 是根据其在交通管理各个要素中的用途的 ITS 四大类 [35]。表 13.1 显示了 ITS 的主要应用及其描述。\n\
  \n表 13.1 ITS 的主要应用。\n\n| 序号 | ITS 的主要应用 | 描述 |\n| :--- | :--- | :--- |\n| 1 | 先进交通管理系统\
  \ | 多个平台，包括信息系统、检测和跟踪、监控、连接等，都应整合到一个单一的统一接口中，预测交通状况以进行更有效的规划 |\n| 2 | 先进旅客信息系统 |\
  \ 为了帮助驾驶员，使用网络、广播、电视、电话和其他技术，让乘客对最佳路线做出明智选择 |\n| 3 | 应急管理系统 | 主要为协助紧急情况而设计 |\n|\
  \ 4 | 先进乘客交通管理系统 | 能够将信号控制关联到集成网络中以改进数据收集和分析，从而获得更好的交通信号定时。 |\n\nATIS 使用互联网、广播、电视、电话和其他技术帮助驾驶员和乘客对最佳路线、交通模式和行程出发时间做出明智选择。该系统实现了以前无法做到的对用户路线反馈，这在各种情况下都很有用\
  \ [36]。交通信息帮助旅行者避免交通拥堵、缩短旅行时间并改善交通网络的运行。行程前数据促进了公路的利用并使通勤者能够做出更明智的交通决策 [35, 36]。\n\
  \nATMS 将多个系统（如信息系统、车辆检测、CCTV、通信等）整合到一个单一、一致的平台，预测道路拥堵以便进一步更高效地实施和设计实际信息 [37]。高速信息系统、自适应车辆控制和应急准备系统等能够对变化的情况做出实时反应\
  \ [38]。\n\n先进乘客交通系统 (APTS) 是一种交通管理系统，它利用先进技术和信息技术来最大化公共交通的生产力和效率 [39]。\n\n它包含了到站系统、乘客信息系统、自动车辆定位系统以及在信号交叉口优先考虑公交的技术\
  \ [36]。传统的轻轨交通正在被快速公交 (BRT) 取代。与其使用铁路或地铁，BRT 在固定路径上行驶车辆。普纳可能是第一个引入 BRT 系统的印度城市 [39,\
  \ 40]。\n\nITS 目前的研究主题是 EMS。这种交通模式主要设计用于协助紧急情况 [41]。\n\n用户可以使用 ATIS 获取旅行数据以帮助做出路线选择，这可以通过不同的技术实现，即关于堵塞、交通拥堵和事故的实际通信，并在道路关闭或维修时提供替代路线。通过带有\
  \ GPS 的信息系统和带有红黄绿颜色协议的网站来显示流量 [22]。关于消息，仅使用了网络、短信和广播。这些协议已在印度几个城市应用 [41, 43]。ATIS\
  \ 系统已在班加罗尔、海得拉巴、买买和德里部署。\n\n## 13.7. 全球 ITS\n\n世界各地各机构构建了为了特定目的提供交通解决方案的 ITS 应用。在富裕国家，拥堵和需求管理以及道路安全和基础设施变得越来越依赖\
  \ ITS [43]。\n\n\n\n\n十多年来，新加坡一直处于智能交通管理的前沿。近年来，智能交通管理领域的投入日益增加，2018 年的交通发展预算就达到了\
  \ 120 亿美元。因此，高成本归因于带有用于交通控制和预防性维护传感器的联动基础设施[44]]。另一方面，该市正关注联网汽车，并计划最早在 2022 年引入自动驾驶公交。新加坡关于智能交通系统（ITS）的信息由于其在真实驾驶引导方面的潜力，使其成为全球拥堵程度最低的地区之一[45]]。\n\
  \n纽约以其卓越的大型交通闻名，并正努力建立 ITS。纽约已有超过 10,000 个路口配备了视频监控，并已致力于互联架构和自适应标志。该市还在探索联网汽车，启动了一项试点计划，从网络车辆中收集并分析用于各种设备和服务的数据。联网汽车的软件硬件将用于\
  \ V2X 计划，以增强真实的交通和安全控制[46]。表 13.2 显示了世界上使用 ITS 的主要及其描述。\n\n伦敦正通过采用 5G 技术将其基础设施推向未来。大都市区宣布了\
  \ Sitraffic Fusion，这是一种结合联动汽车数据的交通控制系统。该计划将成为伦敦实时优化系统的重要部分，该系统此前使用集成传感器、兼容设备和其他资源的数据来调节公路[47]]。\n\
  \n公共交通和乘客移动性在巴黎非常重要。虽然该市正努力改进其准交通系统，但政府也认可汽车的价值[48]]。巴黎正在用电动汽车替换整个公交车队，以成为绿色城市。巴黎同样关注交通安全和管理，这导致自\
  \ 2010 年以来交通死亡人数减少了 40%。它将花费 1 亿欧元用于基础设施改造，以在其此前开发的 ITS 范围内实现联动和无驾驶汽车的广泛部署[46]。\n\
  \n### 表 13.2](#c13.xhtml#R_c13-tbl-0002) 使用 ITS 的主要城市。\n\n| 序号 | 使用 ITS 的主要城市 |\
  \ 描述 |\n| :--- | :--- | :--- |\n| 1 | 新加坡 | 智能交通管理、交通控制传感器、联网汽车 |\n| 2 | 纽约 | 联动基础设施和自适应信号、联动汽车、V2X\
  \ 项目 |\n| 3 | 伦敦 | Sitraffic Fusion、实时优化器 |\n| 4 | 巴黎 | 智能移动、联动和无驾驶汽车 |\n| 5 | 北京\
  \ | 尖端数据分析与发展 |\n| 6 | 柏林 | 智能交通、电动汽车 |\n| 7 | 首尔 | 5G 基础设施、联动汽车 |\n| 8 | 巴塞罗那 |\
  \ 智能移动、联动汽车、自动驾驶汽车 |\n\n中国的电动汽车行业预计将成为世界最大，同时减少冠新冠病毒的传播。为了检测和消除交通拥堵，北京使用了集成传感器。为了向人们警告可能的危险并提供实际路线，技术可能会使用\
  \ 5G 基础设施。2015 年，柏林批准了一项智能计划，从那时取得了巨大进展。人口建设了 5G 基础设施，包括联动汽车，同时增加了联动和无驾驶汽车的地铁部署[47]]。\n\
  \n全球可持续发展协会在首尔成立，旨在促进交通和长期增长。巴塞罗那是智能移动开发的专业城市，自身拥有数据分析能力[49]]。尽管该市还有一个依赖于基础设施传感器的综合交通管理系统，V2X\
  \ 已经在路上。\n\n### 13.8. 印度 ITS 的现状\n\n在印度实施 ITS 的想法已经存在了一段时间。最后，包含 ITS 的汽车行业标准 140\
  \ (AIS-140) 被创建，以修改印度交通的范围[51]。印度的许多城市（主要是大都市地区）长期以来一直有 ITS 想法。然而，每项尝试都只关注少数 ITS\
  \ 组件，而不是全面采纳[52]]。虽然某些计划取得了某种成功，但大多数项目未能产生实质的影响。ITS 失败版本的一些根本性原因是缺乏适当的安装、监管和法律合规性[53]。\n\
  \nARAI 提出了 AIS-140 作为成功的 ITS 实施之一。此外，通过 RFID 标签优化收费站以实现无现金化属于 ITS 范畴，并已被证明是一项成功的尝试。\n\
  \n### 13.9. 提高印度 ITS 地位的建议\n\n\n\n\n\n1. 随着印度近期开始使用智能交通系统（ITS）来控制交通，需要将先进的软件和原理更全面、更实时地整合到传统的交通管理中。ITS\
  \ 模型已经在许多区域投入使用，重点侧重于离散停车信息系统、区域信号管理和增强型收费站。另一方面，印度拥有交通控制中心的、完全成熟的 ITS 应用数量较少。尽管各种技术在发达国家已得到有效实施，但在印度复制类似的系统面临着巨大的挑战。\n\
  \n2. 在印度，ITS 系统必须具有成本效益、易于实施，并尽可能减少人工干预。由于现场的交通警察稀少，技术应当根据当地人口的方言进行定制。在情况下，大多数 ITS\
  \ 系统是由工业化国家的市政府或当地交通警察支付高昂成本安装的。在印度，ITS 系统的高昂成本使其对当地政府的紧迫性较低。\n\n3. 印度范围内没有针对 ITS\
  \ 的明确设计标准、结构标准或立法。由于独特的驾驶行为和环境，印度的 ITS 系统不能简单模仿其他国家的成功 ITS 解决方案。\n\n4. 印度一直不愿采用现有的\
  \ ITS 技术。美国与其他国家之间的地理、文化和人口差异是显而易见的解释。该国增长最快的汽车出现在基础设施落后的城市地区。这是一个自我循环的过程：基础设施负载越高，安装技术就越困难。在大多数情况下，实施现有技术将不会产生影响。\n\
  \n5. 印度需要现有技术的“本土化（desi）”版本，而不是即插即用的部署。当地交通管理公司将比国际公司更重要。在伦敦有效的方案可能不是班加罗尔的理想选择，而适用于悉尼的方案也可能不是德里的最优选项。\n\
  \n## 13.10. 结论\n\n交通业对印度的经济至关重要。印度的总增长依赖于这一行业。政府已优先实施立法，以确保该国优质基础设施的快速发展。汽车的快速发展，加之人口扩张、农村进城以及经济繁荣，对印度城市和城镇的交通基础设施（尤其是交通控制策略）产生了巨大需求。根据美国、迪拜、加拿大、欧洲国家和英国等国的国际经验和最佳实践，采用用\
  \ ITS 似乎是高级交通控制和管理的一种可行解决方案。ITS 要在印度取得成功，必须克服若干物理、社会、经济和管理方面的挑战。尽管印度刚刚开始其 ITS 之旅，但迫切需要扩大\
  \ ITS 应用的使用范围，首先是制定基于 ITS 的移动规划，随后是在城市地区推行强制执行。\n\n## 参考文献\n\n1. Tejas, R. and Devadas,\
