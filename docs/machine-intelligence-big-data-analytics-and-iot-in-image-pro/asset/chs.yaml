  \ 437–439, 2013。\n\n\n\n\n# 11.1. 引言\n\n无人机是物联网（IoT）智能设备和电器领域最新兴的领域之一。由于有物联网的支持\
  \ [1]]，它们在具备所有网络连接能力下在高空飞行，并利用了各种最新技术，如云计算、无线通信、无线传感器网络、机器学习、智能计算机视觉、高性安全方法等。智能无人机是带有传感器和执行器作为嵌入机制的成熟设备，具有很高的认知能力。它们能够识别远处的物体并追踪它们的去向；当无人机飞到相关物体上方时，无人机可以很容易地追踪和识别指定物体\
  \ [2]]。无人机还解决了用户试图从远程位置追踪和观察这些设备的问题，因为这些工作现在由无人机完成。为了让无人机正常运行并为用户提供最佳分析和结果，需要一个功率受限的环境。\n\
  \n在当今世界，无人机无处不在，由于它们易于使用并能为用户提供多种功能，其在各个领域的应用日益增加 [3]]。无人机被应用于多个领域领域，例如在农业领域，无人机可以帮助农民了解野生动物何时进入农场，并帮助在大面积农田上洒粪肥和化学品，这在手动操作上是非常困难的。无人机还用于医疗物联网（IoMT）\
  \ [4]]，以识别患者的位置并使其获得医疗护理。\n\n无人机还用于工业检测、监控和安保。无人机技术使人们易于理解，随着 `MLML` 和 `AIAI` 的使用，`AI`\
  \ 让无人机进入智能环境。主要的进展是这项技术与计算机领域最新进展的融合，如 `ML`、`DL`、软计算、`AI` 等，这些技术融合都尝试带来一系列无人机无法独立完成的操作。\n\
  \n# 11.2. 无人机\n\n无人飞行器是无人机的另一种名称，是指一种没有飞行员的飞行器。无人机系统 `UAS` 包含多个组件，例如 `UAVs`，它们主要由人类通过遥控器控制。这也被称为\
  \ `RPA`（遥控飞行器）。`RPA` 包含多个级别的自主性，其中自动驾驶辅助，以及在没有人工干预的情况下自主运行。\n\n`UAVs` [6]] 开发于 20\
  \ 世纪，主要用于军事。随着无人机技术的进步，它们变成了重要的资产。无人机的一些用途包括航拍、农业、产品交付和监控系统。\n\n`UAVs` 和 `UAS` 因为在\
  \ 20 世纪发展出来，由于其功能灵活且获取成本低，在短时间内变得非常流行。现在，工作正转向通过技术来优化这些 `UAV` 系统 [7]]，包括降低生产成本、延长电池寿命、使用智能传感器和提高摄像头分辨率。主要的进展是这项技术与计算机领域最新进展\
  \ [8]] 的融合，如 `ML` [9]]、`DL`、软计算和 `AI`。\n\n\n\n\n\n全球无人机的终端用户正在不断增加，主要集中在娱乐和媒体、安全系统、农业、石油天然气、电子商务、医院以及其他多个领域。根据研究，无人机（UAV）市场增长速度迅速，2016\
  \ 年市场规模已达到约 80 亿美元，而到 2021 年，无人机销售额已突破 120 亿美元大关，销售额从 2016 年的 80 亿美元增长到 2021 年的\
  \ 120 亿美元，增长了 7.6% [10]。因此，可以说无人机和无人机系统的市场增长非常快，预计预计未来几年市场规模将进一步扩大。无人机产量增长的主要类别是消费级无人机，其在\
  \ 2021 年突破了 3000 万台；其次是企业级无人机，在 2021 年突破了 800 万台；最后是政府无人机，其每年以约 50%的速度增长。\n\n随着技术和不同领域（如无线传感器网络（WSNs）、泛在计算、机器机器通信（M2M）等）的发展，物联网（IoT）提供了感知数据和理解事物的能力\
  \ [11]，然后执行器根据环境条件和必要需求采取行动。物联网帮助无人机根据情况和条件采取行动，同时也有助于部署必要的智能传感器系统并提供更好的通信能力。物联网由通过各种方式相互通信的“物”组成。物联网的主要目标是识别并处理\
  \ [12] 设备，使其能够在尽可能少的人工干预下相互交换必要和机密信息。同样的方法适用于无人机，它们通过检测安全的通信路径来与地面系统建立通信。\n\n无人机通过嵌入无人机内部的微控制器由地面系统进行远程控制，其飞行通过这些微控制器进行软件控制。整个工作过程在传感器、执行器、全球定位系统（GPS）技术、先进通信系统等的协助下协调进行\
  \ [13]。最初，它们在第一次和第二次世界大战期间是通过热气球使用的。今天，随着先进技术的发展，它们得到了显著的改进，因此根据环境要求和分配给无人机的任务类型，它们以各种形式、组合、配置以及复杂的实现方式使用\
  \ [3]。如今，这些无人机有不同的名称，例如纳米无人（NAV）、微型飞行器（MAV）、低空（LASE）、垂直起降飞行器（VTOL）、中空长空机（MALE）、低空长空机（LALE）等。因此，可以看出根据无人机所执行的功能，它们被赋予了不同的名称。\n\
  \n这些无人 AV 或无人机的使用在过去几年急剧增加，因为研究人员发现这项新技术非常有趣，因此他们尽可能地改进和优化这项技术。根据一项研究，2017 年的无人机销售量约为\
  \ 300 万台，将在 2020 年突破 1100 万台，而且在 2021 年仍在每天增长 [12]。许多跨企业公司正在投资这一产品，并为客户提供多种功能。被称为“IoDT”的代未来正通过无人机与边缘计算、云计算等技术融合而成型\
  \ [14]。借助物联网无人机使用的智能或智能传感器也取得了非常好的结果。“IoDT”术语将改变未来几年无人机的未来，因为现有的无人机技术现在将拥有更广泛的任务，涵盖更广泛的应用领域，与最新的问题解决方法、运筹学方法、更快的连接、先进的数据分析技术等进行更好的协作。\n\
  \nIoDT 是无人机技术的面貌，它将帮助无人机达到更高的高度，并帮助无人机在挑战性条件下工作，例如在自然灾害情况下拯救生命、提供食物和水供应、农村监测以及与农农业相关的作业、水下监测——保护海洋清洁倡议和保护水下野生动物、通过无线传感器网络（WSNs）监测森林火灾、监测地下油煤矿等\
  \ [15]。因此，上述地点很难进行人工监测，监测几乎是不可能的。物联网不仅限于智能城市、智能家居连接，它通过无人机技术拓宽了应用领域，现在不仅可以在空中，而且可以轻松转换和增强无人机技术，例如在水下监测等地下环境中。\n\
  \n### 11.2.1 无人机特性与工作原理\n\n无人机的正常运行存在许多特性。首先，语音指令通过蓝牙设备或 WiFi 发送，用于语音识别。然后设备上存在一些应用程序，可以控制无人机的某些组件并对其进行控制。这些应用程序还包含了神经语音服务，可以检测任何种语言或语音。因此，在语音识别服务和无人机应用程序之间，语音交互和识别是一个持续的过程。无人机的飞行通过飞行控制器控制。在图\
  \ 11.1](#c11.xhtml#c11-fig-0001)中，数据被发送并由遥控器接收到无人机的飞行控制系统 [9]。飞行系统以安全的方式控制无人机所有的飞行操作。因此，通过这种方式利用无人机功能，人们就可以轻松地使用无人机执行所有操作。与无人机相关的应用程序都发现与无人机工作非常方便，并能实现其目标。\n\
  \n\n\n\n为了使无人机能够被远程控制和运行，需要处理某些事项。用户必须确保无人机已开电，且遥控器在用户身边，应用程序设备已连接到遥控器和无人机，可能还连接有一个连接到所有设备的蓝牙耳机。用户可以轻松地通过蓝牙耳机通话，而设备中的应用程序\
  \ [11] 会处于持续监听模式，以捕获用户通过耳机说的任何内容。\n\n现在，这种语音通过语音识别机制传输，语音以用户选择的自然语言进行记录。一旦语音被识别，背景中存在的人声和噪声将与其无关，因为它们不会污染用户的原始语音。作为输入的语音在语音识别系统中会与这些系统中已有的语音进行匹配。然后，输入的语音与已存在的语音进行匹配，最后将输出结果显示在屏幕上。语音被转换为一系列正则表达式\
  \ [16]，这些表达式的设计方式使得用户不需要记忆用于模式匹配的指令。正则表达式通过使用和创建一个平台无关的机制来帮助对语言进行建模，然后在特定的编程语言中完成实现。\n\
  \n## 11.2.2 IoDT 架构\n\n本章此节将详细讨论 IoDT 系统的架构。该架构的目的是为大量应用程序（如监控系统、导航系统、位置检测和通信服务）以协调且高效的方式提供多种多样化的通用服务。无人机的正常运行和操作需要导航控制。该架构启用了多种应用程序，使得移动无人机能够为客户执行本地任务\
  \ [17]。如果谈论无人机集群，它们比独立工作的个体无人机要高效得多。因此，集群无人机主要负责执行 [6] 本地任务，并通知本地无人机任务已完成。为了通信目的提供无人机的位置是该架构应用的一个方面。\n\
  \nIoDT 架构提供了一种抽象设计，并包含了客户对功能和特性的需求，即需要在 IoDT 系统上实现的功能和特性 [8]。IoDT 系统提供了具体的系统协议 [18]，这些协议包含了实现\
  \ IoDT 架构特性的各种算法和接口。在不同的应用程序中可能会实现多个基于相同核心 IoDT 架构的 IoDT 系统，它们具有各自的优缺点。并非所有的架构在工程设计和应用中都是可行的，因此需要对原始\
  \ IoDT 架构进行细微调整 [9]。为了证明 IoDT 架构的可行性，系统需要实现该架构以确保正确运行。\n\n描述架构需要一组特定的概念和定义，这些概念在架构中有特殊含义。空域（Airspace）是无人机使用的术语，指无人机用于监控和其他调查方法的飞行目的的有限区域。空域被用作城市无人机的道路网络\
  \ [19]。无人机被允许在某些路径上运行，例如航道，这些航道类似于道路，交叉口由两条航道和最后的节点形成，这些节点是可以通过两条航道和交叉口的交替序列到达的兴趣点。这些空域结构具有静态特征，有助于避免航道上的碰撞。无人机的移动以及它们在航道或交叉口上的移动方向受到监管，当它们在节点内部时，它们处于自由飞行模式。\n\
  \n空域被划分为若干区域，因此每个区域都包含自己的一套航道、节点和交叉口。相邻区域可以通过入站和出站闸门轻松访问，闸门充当区域边界的交叉口，因此它们同时属于两个区域。因此，无人机可以沿着这些交叉口道路从一个区域移动到另一个区域。航道不允许获得给予交叉口的那种访问权限\
  \ [20]。为了让航道访问两个区域，它们需要在边界处被分割成两部分，一部分在一个区域内，另一部分在另一个区域。两条航道在两个区域的边界处分离。\n\n人们还可以利用这些节点和交叉口作为顶点形成一个图，它还包括作为有向边的闸门和航道，这种图被称为区域图（zone\
  \ graph）。路径（Pathway）是区域图中存在的一种路径。元素词（Element word）指的是区域图中存在的交叉口、航道和节点。每个元素都有一个全局地址以便于访问。这类似于互联网上在线主机的全局地址。当闸门被视为顶点并在跨区域之间连接时，它们被称为转运点（transits），然后生成的图基本上被称为跨区域图（interzone\
  \ graph）。转运成本（Transit cost）是无人机在任意两个闸门之间旅行的成本。这种转运根据距离、时间、速度等进行计算。该区域图的路径被称为路由（route）。\n\
  \n区域图的部分被分为公共部分和私有部分。图中公共部分和私有部分中的元素分别称为图的公共成员和私有成员。私有元素对无人机有一定的访问规则，这些规则指定在元数据中，例如是否允许无人机访问元数据。抽象的最层包含了空域中的点或节点。坐标系（包括纬度、经度和高度）有助于识别空域中的点。空域的几何形状通过这些点进行学习。轨迹（Trajectory）是通过这些点遵循的路径形成的。\n\
  \n\n\n\n如图 11.2 所示，IoDT 的架构该系统包含了无人机应用层`[5]`，该层包含许多供应用层与架构中其他层进行通信的接口。它主要包含无人机接口、云接口和\
  \ Web 服务。`UAV interface`用于连接无人机设备与地面基站控制。`UAV interface`提供了一个通信通道，使得无人机能够以安全的方式将消息传递给地面系统。`cloud\
  \ interface`将 IoDT 系统与云服务连接起来，以便存储无人机连接的机密数据。云是一个虚拟平台，提供了一系列高效存储数据的服务，确保数据不丢失。Web\
  \ 服务的提供方式是为了确保无人机能够通过网络进行正常运行。每当任何设备通过网络传输信息时，就会使用这些 Web 服务。\n\n下一层是云和处理层，它包含了许多帮助无人机系统的分析工具、方法和机制。此外，该层还存在与无人机相关的控制和管理系统。云平台为无人机存储重要信息提供了一个安全空间。系统中存在多种数据分析工具来帮助管理数据。数据经过收集、分类、消除重复数据、精炼处理后，再进行存储和进一步处理。数据分析工具还会分析数据并从收集的数据中得出一些实用的见解。同样，这里也使用了大数据工具，用于处理海量数据并解决信息过载和信息溢出的问题。因此，大数据工具有助于大数据工具的管理。\n\
  \n无人机云和处理层还包含了无人机系统的多个方面，包括无人机控制机制、无人机飞行监控系统、无人机服务与管理方法以及无人机网络接口。`UAV control mechanism`包含一组用于检查的方法，以确保系统能够以正确的格式工作。在`UAV\
  \ flight monitoring system`中，记录无人机在其寿命内进行的飞行。监控系统在无人机为了自身目的飞行时监控其正常运行。`UAV services\
  \ and management methods`负责确保无人机在执行任务时如果需要任何帮助，因此进行适当的管理是必要的。`UAV network interface`包含了用于无人机通信的不同网络通道。它提供了一个安全的网关，用于传输机密信息，并通过使用若干安全协议防止黑客获取这些信息。\n\
  \n无人机架构中的信息导航是通过区域内指定的任意两个元素之间的区域图格式（zonal graph format）完成的。指定区域的信息传输许可由管理整个系统的机构授予。无人机在交汇处、航道以及公共或私有节点方面必须遵守法律。无人机系统软件通过区域服务提供商的帮助轻松实现，以确保无人机的正常运行。有许多服务提供公司向区域提供服务，即`区域服务提供商\
  \ (ZSPs)`，类似于`IoDSP 无人机服务提供商 (IoDSP)``[3]`。当无人机跨越边界进入另一个区域时，各个门之间通过切换进行协调，然后责任将转移给新的`ZSP`。`ZSP`能够命令无人机执行各种功能，如悬停、着陆位置、起飞、绘制某些轨迹，这些动作分别称为着陆位置和保持位置。\n\
  \nIoDT`[9]`架构层为无人机提供了多益处，例如可维护性、设备的可扩展性、设备层的灵活性，且其他层所需的更改极少。IoDT 架构的基本目标是通过为应用程序提供一些通用和基础性的目标和服务，使无人机能够以最少的进展和更改执行多个应用程序。基本上，架构设计者考虑了两个目标。第一个是为无人机提供从源节点旅行到目标节点的方法或指导。这是在所有无人机在空中协调的情况下完成的。架构的第二个任务是为未来的服务提供一个可扩展平台，以便应用程序用于交付的需求。\n\
  \n无人机的导航是一个非常重要的方面。无人机穿越区域内从区域源到终地的路径。无人机还必须遍历区域以及交汇处。不同的层处理无人机面临的不同任务和困难。一个包含地图的所有巨型系统会变得非常复杂，且有时不可持续。现在，这些大问题可以转换为较小的问题，然后所有这些问题都变得可处理且可解决。因此，可处理的优解决方案就是最佳解决方案。\n\
  \n存在一些特性`[7]`，这些特性可以在无人机处于空中飞行时帮助并控制它们：\n\n1.  **广播与跟踪**：在空中期间，无人机定期广播其三维坐标以及轨迹以及飞行期间将去向何。因此，无人机未来飞行的路径规划变得简单，计算无人机的进度也变得容易。\n\
  2.  **轨迹规划**：`ZSPs`需要规划无人机应遵循的轨迹。需要确保无人机在规划的路径内保持在交汇处和航道的边界内。\n3.  **精确控制**：空中应具有精确控制功能，`ZSP`需要被通知无人机的特定动作，如悬停、起飞、着陆等。因此，这是该架构的一项合理特性。\n\
  4.  **避障**：当无人机与各种动态物体（如鸟类、其他无人机）飞行时可能会发生碰撞，这些物体可能会阻塞航道或交汇处。无人机必须通过预先查看轨迹并在飞行期间做出快速决策来尝试避免碰撞。需要使用标准协议进行协调运动以避障。\n\
  5.  **天气状况**：在无人机飞行之前应该提前获知降雨、降雪、强风等天气状况。需要这样做以确保无人机在轨迹飞行期间的安全飞行。\n\n## 11.3. 应用领域\n\
  \n\n\n\n\n快速的实现和创新正帮助物联网（IoDT）在多元化的领域和行业中发展，因此，它们受到了创新者和研究人员的高度关注。过去几年中，IoDT 出现了无限的可能性，这意味着在图\
  \ 11.3 \\[7] 中存在大量的实时应用领域。随着嵌入无人机内部的传感器和执行器，智能无线连接正在涌现。通过智能集成，多种数据分析工具结合雾计算、云计算、大数据分析等用于物联网。这些空中系统在物联网强有力协作下找到了了自己的道路，这有助于先进技术的发展并为大量的实时机会开启大门。在物联网的帮助下，这些无人机可以轻松部署在高海拔地区以及海底和海洋中，这意味着现在无人机也可以部署在极端地区。\n\
  \n![图 11.3 IoDT 应用。](img/c11-fig-0003.jpg)\n\n`图 11.3` IoDT 应用。\n\n### 1. 航空摄影\n\
  \n无人机让航空摄影变得更加简单高效，因为它们可以轻松捕捉画面，而这对于直升机和起重机来说是非常昂贵且困难的 \\[6]。许多动作电影片段都是借助无人机拍摄的，因此使得摄影技巧变得更加简单。许多自主飞行设备被用于房地产和体育摄影。记者也使用这些无人机收集重要素材以及进行直播，这些设备还被用于军事目的以执行侦察行动等。\n\
  \n### 2. 物流递送\n\n许多大型电子商务公司如 [Amazon.com](http://Amazon.com)、UPS 等都倾向于使用无人机向客户递送\
  \ \\[7]。这节省了大量人力，还避免了主要的道路交通拥堵，并将这些不必要的流量转移到了空中。短距离内的多个小型快递包裹可以通过无人机进行传输，这些包裹包括食物包、信件、饮料、药品等。因此，小型的奢侈品包裹可以轻松地传输。[Amazon.com](http://Amazon.com)\
  \ 已经在美国部署了约 300 台物联网无人机进行包裹递送。\n\n### 3. 地图测绘\n\n无人机可以轻松捕捉到许多人类难以到达的地理位置，例如山区、岛屿、海岸线等\
  \ \\[8]。3D 地图是由无人机捕捉的画面形成的图像，它们积极为众包式测绘应用做出贡献。\n\n### 4. 灾害管理\n\n每当发生人为或自然灾害时，无人机为受灾地区和伤员提供快速的救援措施。无人机收集受灾地区的信息，然后在碎片和瓦砾中导航导航，以寻找伤员\
  \ \\[9]。高分辨率相机、传感器和执行器、雷达为救援队提供了所有救援支持\n\n### 5. 精准农业\n\n农业是提供……最大的领域。开发无人机的成本非常低，因此人们可以将它们发送到螺旋、龙卷风、火山爆发等非常恶劣的环境\
  \ \\[12]。科学家和天气预报部门获得了新的见解，然后他们预测特定条件下天气行为的发展和轨迹。\n\n### 6. 搜索与搜救\n\n无人机中存在的热传感器有助于提供夜视功能，并为监控提供了强大的工具。无人机发现失踪人员变得容易\
  \ \\[11]。此外，无人机还可以帮助向灾区地区投放必要的食物供应。\n\n\n\n\n无人机战斗是为了娱乐玩家而进行的。在笼笼赛中，两名竞争者及其无人机展开对决。随着技术的进步，无人机变得更加健壮，并且能够在携带更重载荷的情况下战斗数小时\
  \ [15]。无人机智能可用于捕捉战斗场景的视频、照片以及自拍。。因此，无人机娱乐业带来了巨大的机遇和多种业务模式。所以，有必要发现更多无人机技术的机遇，而处理无人机的业务公司需要构建必要的基础设施，并在那里对无人机及其服务进行测试。\n\
  \n### 11.3.1 其他应用领域\n\n还有一些需要关注的无人机技术应用领域。\n\n1. **水生生物监测**\n无人机在空中视角下表现良好，但在水下水生生物监测系统中工作原理同样相同。基于\
  \ `IoDT` 的无人机能够在水下拍摄高分辨率图像 [16]。凭借 `IoDT` 技术提供的自动驾驶功能，无人机可以轻松、高质量地监测水生生物，而且这些无人机可以进入深海。研究人员能够探索水下未开发的区域以进行海洋研究。其他其他水下观测任务，如系缆检查、捕食者网受损的沉没设施检查等。\n\
  \n2. **GIS 绘图**\n传统的无人机系统或 `UAVs` 需要花费时间进行操作和设置，而自动驾驶功能有助于自主飞行、碰撞检测和地理信息系统 (`GIS`)\
  \ 绘图 [17]。`GIS` 绘图是一个由无人机支持的概念化框架，提供了捕捉并随后分析地理位置的能力。此外，`IoDT` 网络能够提高作物生产力，增加产量并提升利润。机器人无人机被用于增强航运业、水下研究和渔业的变革。\n\
  \n3. **水下基础设施维护**\n几家政府机构、私营公司和多家服务提供商都得到了无人机的帮助，使用增强的高分辨率摄像头对水下排水管道系统或下水道管道等进行检查检测\
  \ [18]。无人机负责监测管道，如果任何管道被切断或损坏，就会恢复其正常功能。\n\n4. **边界无人机监视**\n过去几年，跨境威胁、入侵和非法侵入增加，各国长期以来一直试图通过多种智能无人机在边境线应对这种局面\
  \ [18]。凭借 `IoDT` 的帮助，军事力量可以轻松在边界上空飞行无人机一段时间，部队可以确定发生侵入的位置。因此，通过 `IoDT` 的帮助，军可以监测入侵区域，并派遣任务小组防止入侵者造成任何伤害。因此，无人机可以在许多方面帮助边境安全部队。\n\
  \n5. **早期威胁检测**\n凭借 `IoDT` 的帮助，现在无人机可以轻松监测敏感区域，并向军事部队发出关于敌人攻击的早期警报。\n\n6. **士兵安全**\n\
  凭借 `IoDT` 的帮助，现在无人机可以轻松监测敏感区域，并向军事部队发出关于敌人攻击的早期警报。无人机可以在许多方面帮助边境安全部队。无人机通过，，1111111111111111111the-00\
  \ 和 9 来帮助士兵。\n\n## 11.4 IoDT 攻击\n\n![Figure 11.4](img/c11.4.jpg)\n\n以下是包含在 11.4\
  \ IoDT 攻击中的攻击。\n\n构成 IoDT 的组件主要是设备、传感器、执行器和通信链路。安全性的缺陷会导致机密信息丢失和设备可用性问题。根据安全性，[8]\
  \ 它们被分为 5 类：\n\n### 1.1. 隐私\n`隐私` [2] 是 `IoDT` 系统主要关注的问题。当处理数据时，威胁和漏洞将会增加，攻击者试图针对这些机密信息。以下是破解这些中起着重要作用的攻击：\n\
  \n* **数据计算**：通过流量分析，从 `IoDT` 中收集大量数据。数据取证攻击通过提取机密信息来攻击数据。在这种情况下，必须为反攻击制定一些解决方案。\n\
  * **流量分析**：`IoDT` 系统获取有关流量的有用信息，并分析网络中存在的这些信息。信息在无人机和地面控制系统之间以包的形式共享。这些数据包包含非常机密和敏感的信息。\n\
  * **消息拦截**：当攻击者控制经常检查网络通信的人员时，就会消息拦截。在这种情况下，有时捕捉入侵者变得非常困难，因为在敏感任务中，无人机包含非常重要且敏感的信息。\n\
  \n### 1.2 机密性\n`机密性` [4] 监控私有信息，使其不会泄露给任何非法用户或未经授权的设备。安全性的缺陷会导致针对 `IoDT` 系统和地面控制系统的多种攻击。当非法或未经授权的用户访问\
  \ `IoDT` 系统时，机密性协议就会被破坏，并可能产生严重后果。从那时起，信息的检索将变得棘手。现在，有许多机密性被破坏的方法：\n\n\n\n\n###\
  \ 2. 窃听\n窃听是指对网络上 `IoD` 设备之间交换的消息进行未经授权的实时截获，即对通信系统进行窃听。对于重要信息而言，窃听是一种非常危险的攻击，因为攻击者一旦进入通信网络就可以很容易地接管系统并获取重要数据。每个连接的\
  \ `IoD` 设备中未加密数据的可用以及身份验证协议的会导致会导致攻击。\n\n### 3. 重放攻击\n在这里，恶意用户嗅探 `IoD` 网络，然后通过不断在\
  \ `IoD` 网络上重放请求来绕过安全机制。这类重放攻击可以通过许多不同的方式实施，因为攻击者已经发现了许多渗透 `IoD` 网络以及在 `IoD` 设备之间进行通信的方法。这些攻击可以通过身份验证机制防止，它们应该以非常安全的方式使用新颖消息请求的概念。\n\
  \n### 4. 伪装\n在这里，攻击者伪装成合法用户，通过利用特定合法用户的伪造 ID 从 `IoD` 网络获取私有信息，从而使攻击者能够访问 `IoD` 网络和通信链路。此类攻击的唯一解决方案是使用加密\
  \ ID 和一次性有效 ID，这些可以是防御此类攻击的有效方案。\n\n### 3. 信任\n信任 `[12]` 与最新技术相关的风险起着重要作用，它取决于并影响技术的可衡量及不可衡量的属性，如强度、良好性、可用性、可靠性和能力。隐私和安全\
  \ `[11]` 是信任的支柱。部署了许多机构和公司与 `IoD` 系统建立信任关系，这是非常重要的。企业中有限的安全机制导致了双方之间信任的各种威胁。消息配置错误也会导致信任的破裂。\n\
  \n#### 3.1 第三方干扰\n某些应用涉及第三方的信任，这是通过 `IoD` 通信格式（如公私钥、数字证书、管理机构等）实现的。每当信任方发布或泄露已部署\
  \ `IoD` 设备的机密信息时，这种信息泄露会导致财务和知识产权损失，从而导致双方信任的破裂。\n\n#### 3.2 键盘记录器\n键盘记录器属于内部威胁。。键盘记录器工作在系统软件中，并在\
  \ `IoD` 系统的部署和开发期间嵌入。机密和敏感信息由键盘记录器转发给攻击者。\n\n#### 3.3 伪造 IoD\n有时，合法的 `IoD` 设备被制造设备替换，它们开始向攻击者和窃听者发送重要信息，从而轻松访问\
  \ `IOD` 网络和通信。因此，通过这种方式，`IoD` 设备可以被伪造，可能会给整个 `IoD` 网络带来麻烦并泄露敏感信息。\n\n### 4. 完整性\n\
  完整性 `[14]` 包含了三个…………数据不应以任何方式更改。在这里使用的保护机制是哈希函数、校验和。有几种攻击会影响完整性。\n\n#### 4.1 访问控制\n\
  有一些规则和策略控制设备如何通信数据。当攻击者获得 `IoD` 系统的访问时，他们可以更改信息的权限。\n\n#### 4.2 伪造消息\n有时，为了获取机密信息，攻击者会伪造消息。他们根据需要伪造身份验证协议。之后，攻击者可以轻松地修改并重新传输。\n\
  \n#### 4.3 信息篡改\n信息篡改意味着传输给用户的信息被伪造并改变了信息的原始含义。修改、更改、伪造、替换、数据注入是改变信息的术语和方法。\n\n\
  ### 5. 可用性\n当需要维护 `IoD` 系统正常运行运行时，需要立即启动服务的可用性 `[15]`。需要信息的可用性，以确保只有合法用户可以访问 `IoD`\
  \ 网络。当 `IoD` 网络在任务导向型应用中运行时，主要 `IoD` 资源、设备和信息的可用性对于确保安全性起着主要作用。\n\n#### 5.1 路由攻击\n\
  `IoD` 网络中存在多种网络路由攻击，如节点隔离、节点捕获、泛洪、钓鱼、位置披露攻击等。节点捕获是指特定节点被攻击者击败。\n\n#### 5.2 DDoS\
  \ 攻击\n拒绝网络执行的功能、资源的访问权限、防止未经授权的用户访问重要信息等，被称为拒绝服务攻击。为了防止此类攻击，`IoD` 需要适当的通信系统。\n\n\
  #### 5.3 干扰\n干扰的主要目标是有意破坏 `IoD` 系统的通信网络。干扰会因资源不可用影响 `IoD` 网络，并导致 `IoD` 网络发生冲突。\n\
  \n\n\n\n## 4. GPS 欺骗\nGPS 基本上用于确定 IoD 网络中设备或车辆的位置，或者是飞向指定目标的高空无人机的位置。攻击者可以轻易修改 GPS\
  \ 信号信息，甚至他们通过生成器的 GPS 信号生成欺骗信号。由于欺骗信号的干扰，`GS` 信号会延迟，这可能对 IoD 网络造成巨大损失，并破坏设备与 IoD\
  \ 网络之间的协调，最终导致碰撞。针对 GPS 信号有一系列应对措施，例如应该妥善使用经过验证和加密的信号，结合绝对值和相对值对 GPS 信号强度进行常规检查。此外，还可以接收\
  \ GPS 信号时检查时间间隔。\n\n## 5. 物理攻击\n物理攻击主要针对 IoD 网络的硬件设备。硬件组件受物理攻击最为频繁。硬件组件非常昂贵且难以管理，因此保护\
  \ IoD 系统的硬件组件免受所有物理攻击是一个严重的问题。\n\n### 11.4.1 应对措施\n无人机在未来几年将成为先进安全系统的核心。军事设备也将由\
  \ `IoDT` 技术赋能。因此，在几乎所有领域，无论是商业部门还是业务部门，无人机行业在技术型行业中已经取得了积极且充满前景的结果，这将增强多个业务的安全性和效率\
  \ [5]。联邦航空管理局（FAA）已制定了各种无人机的远程识别要求，这些要求已安装了安全标准，适用于视距内和逐案使用的无人机。广泛的家庭配送包裹通过无人机发送。\n\
  \n无人机行业在未来几年存在巨大的盈利机会，FAA 预计到 2023 年，美国将有约 125 万架个人无人机 [7]，该国还将约 40 万架商业无人机。随着企业采用\
  \ `UAV` 系统进行交付、检查等多种用途，到 2023 年，商业无人机总量将达到 80 万，是目前商业无人机数量的两倍。无人机行业在未来几年将创造数千个工作机会，因此网络安全系统将利用无人用于安全目的。未来几年无人机的主要应用将是建筑业、公用事业行业、石油和天然气行业，以及最大的行业——安全行业，安全行业将从无人机的监控等许多其他用途中受益最深。建筑和施工现场参数的监测很快将由无人机完成。\n\
  \n尽管无人机有大量的用途和应用，但它们仍然存在一些漏洞。有时，在没有及时通知的情况下，无人机可能会危及公众，或者无人机之间会相互碰撞，这将是一个巨大的问题。此外，无人机像任何其他\
  \ `IoT` 设备一样，可以在几英里之外被攻击者轻易破解。安全是无人机面临的一个非常需要解决的问题。\n\n每当攻击者能够定位空中无人机时，就可以像任何其他普通设备一样被黑入，攻击者可以获取无人机必须共享或发送给基站的信息。无人机通过\
  \ `WiFi` 等连接网络与基站连接，如果无人机通过网络连接，则无人机处于脆弱状态，需要进行良好的安全保护。`IoDT` 网络执行单因子身份验证，在缺乏加密设备和资源的情况下，使用弱密码，这些密码很容易被猜到或破解。因此，攻击者可以拦截特定的咖啡馆或建筑。\n\
  \n当无人机安全系统被破解时，随时修补补丁是无人机安全的一种良好方法。因此，应该始终安装这些补丁以应对新出现的安全威胁。虚拟专用网络 (`VPN`) [8] 在黑客试图通过互联网渗透通信系统时也会使用补丁系统。未来几年，无人机数据将存储在云端，因此云端也应该进行加密，这是保护数据免受攻击者的唯一方法。\n\
  \n有很多应对措施可以保护 `IoDT` 系统中的无人机免受黑客攻击。某些方法包括：\n\n1. **定期更新固件**：无人机的固件需要定期更新，每当出现新的安全威胁时，制造商就会发布安全补丁。这就是为什么定期更新无人机的不同的固件和软件，以便比黑客领先一步。当系统出现某些异常活动（如黑客未经授权访问信息、访问视频和照片、某些位置的实时地图视图等）时，会发布安全补丁。即使在发生此类安全漏洞后，仍有一些客户拒绝安装新补丁，从而为黑客提供了访问所有机密数据的可能。\n\
  \n2. **使用强密码**：必须使用非常强密码，因为使用弱密码会让黑客很容易猜到密码。建议妥善使用特殊字符、符号、数字和字母的组合，这可能阻止攻击者猜密码。因此，强密码将避免无人机信号被破解。\n\
  \n3. **保持连接设备安全**：连接到 `IoDT` 网络的所有设备都可能被黑客劫持。曾有一个恶意软件攻击美国军无人机的案例，其中一个操作员使用连接的无人机计算机下载视频游戏。无人机中必须安装防病毒软件，用户不应下载任何可疑程序或访问不良网站。\n\
  \n4. **返回模式**：每个 `IoD` 设备必须具有返回模式，这样当无人机丢失信号、信号被干扰或电池电量需要充电时，它可以返回家。返回功能将帮助无人机防止人质或劫持局面。必须确保\
  \ `GPS` 正常运行以便\n\n5. **使用 VPN**：无人机网络需要订阅 `VPN`，以阻止黑客访问私人信息并获取互联网上的网络通信。`VPN` 提供通往互联网的安全路径或网关，然后对连接进行加密，使得黑客无法得知信息内容，因为解密变得困难。\n\
  \n6. **限制连接设备**：对连接到 `IoD` 网络的设备数量应进行限制。这将防止设备被劫持，因为信号可以轻松控制有限数量的设备。\n\n\n\n\n因此，在上一节中，为了确保无人机的正常运行和无人机安全，采取了一些应对措施。由于\
  \ `WiFi` 和云服务的存在，无人机数据变得更具移动性，这使得数据保护变得困难。`IoDT` 结合无线射频识别 (``RFID`) 使得在整个 `IoDT`\
  \ 网络以及较小设备（如货物标签、监控摄像头、`pallet tables` 等）中数据的访问和流动成为可能。`Bluetooth`、`RFID`、`WiFi`\
  \ 以及其他多种技术中存在的物理访问限制使得防止黑客成为可能，但由于数据的移动性，黑客可以轻松访问数据。存在一些由攻击者和黑客编写的恶意无人机，旨在进入 `IoD`\
  \ 网络。这些无人机被安装在建筑和办公室内，利用 `WiFi`、`Bluetooth`、`RFID` 等技术的漏洞。一旦进入 `IoD` 网络，这些无人机可以轻松地从\
  \ `IoD` 设备中窃取数据，甚至可以劫持鼠标和键盘等系统外设。`Keyloggers` 被用于以这种格式窃取信息。\n\n无人机在 `FFA` 下被称为 `UAVs`\
  \ 或非武装飞行器 (`UAs`)，因此它们不能被任何人击落。它们无法受到任何物理伤害，也没有人能中断这些无人机的运行。当无人机与地面控制系统之间通信时，信号无法被拦截。因此，防御机制必须侧重于数据和空间的保护。有一些应对措施可以帮助监控恶意无人机并保护数据免受侵害。\n\
  \n### 地理围栏 (Geofencing)\n\n地理围栏 `[16]` 是处理恶意无人机威胁的方法。当 `IoD` 网络使用 `GPS` 或 `RFID`\
  \ 标签时，地理围栏会创建一个虚拟边界，使得任何意外设备无法访问无人机系统中传输的信息。当未经授权的无人机进入保护区域时，它会产生响应，然后地理围栏系统将防止这些商业无人机进入、飞行或进入地理围栏区域。大型无人机制造公司已在其脆弱站点（如发电站、机场建筑、监狱等）安装了地理围栏。一些攻击者发现了绕过地理围栏软件的方法。然而，破解地理围栏软件非常容易，人们可以通过互联网找到攻击此类软件的方法。一种阻止地理围栏的方法是在无人机周围包裹锡箔并进行折叠，从而屏蔽无人机的\
  \ `GPS`。\n\n地理围栏是一种昂贵的软件，因此大多数消费者并无法使用。如果无法阻止未经授权的无人机，就必须检测这些恶意无人机，但没有任何方法是 100%\
  \ 有效的。因此，这些方法并不可靠，但人们必须尝试寻找。雷达是用于检测无人机的方法之一，但它们同样不是 100% 可靠的，因为有时会将鸟类误认为无人机。必须使用声学传感器来检测不需要的无人机，因为它们主要设计用于识别无人机的细微声音、振动和特征，并可以检测它们是否是不需要的。\n\
  \n射频 (`RF`) 扫描仪也设计用于检测无人机，它们主要检测光谱上的电磁波，并识别无人机在电磁场上的传输。使用 `GPS` 信号的先进无人机则不使用电磁波。\n\
  \n\n\n边缘计算 `[17]` 是另一种技术，当它与 IoDT 技术融合时，可以以高效处理信息的方式为 IoT 行业带来惊喜。现在，在边缘计算的帮助下，IoDT\
  \ 系统中的许多问题得到了解决，例如互联网连接性、实时处理、QoS 要求以及互联网连接较差的偏远地区的实时处理。无人机应用通过对问题进行非常近似的求解进行计算，这些系统依赖地面基站处理计算密集型任务，从而改进了系统的可扩展性、稳定性、准确性和可靠性。IoDT\
  \ 受益于边缘计算，例如低延迟率、实时服务和计算操作、在连接不佳的地区执行任务且不发生任何丢失，通过这种方式，大量的无人机可以被部署在集成网络中。异构性是其中的一个重要方面，使用了自适应流媒体站点，例如基于流的并行连续细化方法等。\n\
  \n# 智能农业\n\n农业 `[15]` 已经以各种形式使用了 IoDT 技术，但农业部门仍面临着连接有限的大面积监测问题。因此，需要一种精确的解决方案为农民监测农田和作物、土壤水分水平、肥力、pH\
  \ 值、农药质量、农场内动物检测、牲畜监测以及农业设备监测。无线传感器网络 (WSN) 是农场监测的良好解决方案，传感器部署在有限区域内，有时由于恶劣天气和其他因素，它们在实时运行时容易发生某些频繁故障。IoDT\
  \ 系统被用于农业农场监测，但仍存在精度问题。牲畜监测系统和传感器、数据采集机器人、天气监测机器人的出现为农民提供了救援。随着 IoDT 的实施和无人机的部署，某些问题被消除了，例如动物入侵案件，农场边界可以被容易地控制，但由于无人机部署、传感器部署或摄像头安装的成本和维护，这可能会非常贵。维护一切的成本可能是一项大任务并花费大量时间。\n\
  \n在 IoDT 的帮助下，牲畜监测可以在精确水平进行。农场中的每只动物都部署了传感器以便进行监测。通过无人机对农田进行监控，可以在任何威胁发生前采取及时的行动。任何与动物相关的异常活动，如动物健康、牛群离开农场边界，都可以通过及时的触发行动来防止。IoDT\
  \ 系统可以定期从传感器处获取实时数据。农业机器人被用于耕作农场，它们控制水位并监测天气。因此，农业的复杂问题可以通过 IoDT 解决，以获得更好的作物。\n\n\
