  \ `b`, `t`, `E`, `L` | `R² = 0.9801` |\n| Haddad 和 Haddad 39 | 2020 | ANN | `f'`,\
  \ `t`, `E`, `L`, `b`, `f` | `R² = 0.9801` |\n| Kumar 等 19 | 2022 | ANN, ABC-ANN,\
  \ GPR | `f'`, `b`, `E`, `f`, `t`, `b`, `L` | `R² = 0.8666 (ANN), R² = 0.9052 (ABC-ANN),\
  \ R² = 0.9251 (GPR)` |\n| Köroğlu 44 | 2018 | ANN | `Type`, `Surface`, `d`, `f`,\
  \ `C/db`, `L/d`, `A/s`, `confining` | `R² = 0.8989` |\n| Cascardi 和 Micelli 45 |\
  \ 2021 | ANN | `t`, `b`, `L`, `E`, `b`, `f` | `R² = 0.95` |\n\nZhou 等 37 使用显式神经网络预测\
  \ FRP 粘结强度。`ANN` 模型测试经过了 84 轮训练以找到最佳输入节点组合。与文献中现有的粘结强度模型相比，所提出的 `ANN` 模型更准确（即预测误差更小）。用于测试和训练数据的最佳\
  \ `ANN` 模型的 `R²` 值分别为 0.928 和 0.930。\n\nPei 和 Wei 38 使用蚁群优化 (`ACO`)`ANFIS` 预测粘结强度。结果表明，建立的\
  \ `ACO-ANFIS` 模型比其他分析模型更精确，其 `R²`、`RMSE` 和 `MAE` 值分别为 0.97、`kN`。\n\nHaddad 等 39\
  \ 使用 `ANN` 算法预测 FRP-混凝土粘结强度。预测结果显示出良好的精度，`R`值为 0.99。与其他分析模型相比，`ANN` 模型的性能卓越。表 17.2\
  \ 总结了机器学习（ML）在 FRP-混凝土粘结强度研究方面的重大发现。\n\n图 17.8 显示了用于估计粘结强度的不同 ML 模型的决定系数对比。![图 17.8\
  \ 不同 ML 模型的 R² 值（FRP-混凝土强度)](img/c17-fig-008)\n\n## 17.3.2 抗弯强度的估计\n\nMurad 等 46\
  \ 使用 `GEP` 计算了 FRP 加固 RC 梁的抗弯强度。`GEP` 模型是使用从许多研究计划收集的 116 个数据点创建的。`GEP` 模型的精度和可靠性标准的\
  \ `ACI-440-17` 和 `CSA S806-12` 进行了比较。在三个模型中，`GEP` 模型的精度更高。\n\n## 17.3.3 抗剪强度的估计\n\
  \nChou 等 47 使用智能萤火虫算法 (`SFA`) 优化最小二乘向量回归 (`LSSVR`) 的混合 `ML` 模型预测了 RC 梁的抗剪强度。根据比较结果，优化的\
  \ `AI` 模型在预测多种 RC 梁的抗剪强度方面超过了其他模型。混合 `AI` 模型对于带箍筋和无箍筋 RC 梁测试数据的 `MAPE` 值分别为 12.941%\
  \ 和 21.70%。对于 FRP 筋梁，`MAPE` 值为 18.951%。\n\nNikoo 等 48 使用 `GA-ANN`、蚁算法 (`BA`)`ANN`\
  \ 和 `PSO-ANN` 识别了 RC 梁的抗剪强度。`GA-ANN`、`BA-ANN` 和 `PSO-ANN` 的 `MAE` 值分别为 8.79、18.05\
  \ 和 23.36。结果发现，`BA-ANN` 在计算 FRP 筋混凝土梁的抗剪强度方面比其他 `ML` 和经验模型更具能力、适应性且更精确。\n\nNaser\
  \ (2020) 应用 `ANN` 和 `GA-ANN` 模型预测 FRP 筋梁的强度 49。使用开发的基于 `ML` 的表达式可以正确捕捉 FRP 加固/加筋构件的响应。带有遗传算法优化的\
  \ `ANN` 模型在无箍筋数据库中的精度为 96.2%，在有箍筋数据库中为 90.7%。\n\nNguyen 等 50 探索了使用 `ANN` 方法预测 FRP\
  \ 混凝土梁的抗剪强度。从文献中收集了包括 125 个值的实验数据集，并利用其发现了最佳的 `ANN` 设计。使用常用的统计指标来识别和评估 `ANN` 模型合适的架构。结果表明，利用最佳架构，`ANN`\
  \ 模型预测 FRP 包覆 RC 梁的抗剪强度非常有效，训练和测试数据集的 `R²` 值分别为 0.9634 和 0.9577。\n\nAbuodeh 等 51\
  \ 使用 `ANN` 和神经网络解释图 (`NID`) 预测了 FRP 筋的抗剪能力。预测结果显示 `ANN` 模型与实验数据非常接近。测试数据集的 `R²`\
  \ 为 0.911，表明数据未过拟合。可以使用 `NID` 技术识别影响 FRP 筋抗剪能力的机械物理特性。\n\nNaderpour 等 52 使用 `ANN`\
  \ 算法估计了 FRP 复合材料加固 RC 梁的抗剪能力。研究采用的 `ANN` 模型结构具有两个中间层。`ANN` 模型的 `R²`、`MSE`、`RMSE`\
  \ 和 `MAE` 分别 0.93、129、11.36 和 8.70。结果显示 `ANN` 模型优于经验公式。\n\nKar 等 53 采用 `ANFIS` 模型预测\
  \ FRP 包覆钢筋梁的抗剪贡献。`ANFIS` 模型是使用发表论文中的 119 个现有数据集构建的，这些数据用于创建训练和测试集。`ANFIS` 模型预测值与实际数据的对比显示\
  \ `ANFIS` 结果与实验结果密切相关。`ANFIS` 模型的决定系数为 0.996，大于分析和传统的规范指南。\n\nNaderpour 等 54 使用\
  \ `ANN` 计算了 FRP 筋加固 RC 梁的抗剪强度。实验数据是不规律的，基于 `LR` 分析的模型无法准确预测行为。所提 `ANN` 模型的相关系数总值为\
  \ 0.98。`ANN` 平均误差为 9.72%，而其他模型（如 `BISE`、`ISISM03-07`、`ACI 440.1R-06`、`CNR DT 203`\
  \ 和 `JSCE`）的平均误差分别为 17.94%、29.37%、45.68%、28.5% 和 25.89%。\n\n\n\n\n\nPerera *et al.*\
  \ \\[55\\] 部署了 ANN 技术来预测 FRP 复合材料增强 RC 梁的剪切能力。ANN 技术的 `R-value` 为 `0.98`。Lee 和 Lee\
  \ (2014) 使用 ANN 分析了 FRP 在无箍筋配筋梁剪切加固中的贡献 \\[56\\]。根据预测值与 `106` 个测试数据集的比较，开发的 ANN\
  \ 模型比其他现有的方程具有更高的准确性，统计参数也得到了增强。根据结果，ANN 模型的精度高达 98%。\n\nNaderpour 和 Alavi 使用 ANFIS\
  \ 算法估计了 CFRP 筋 RC 梁的剪切参与度 \\[57\\]。与直接从 `ACI 440.2R-08`、`fib-TG9.3`、`CSA-S806` 和\
  \ `CIDAR` 等现有指南中获得的结果相比，结果表明建立的 ANFIS 模型能够更准确地预测 FRP 复合材料在 RC 梁中的剪切参与度。ANFIS 模型的\
  \ `R²`、`RMSE` 和 `MAPE` 值分别为 `0.977`、`10.07 kN` 和 `17.19%`。\n\nPerera *et al.* \\\
  [58\\] 使用 AI 技术（`GA` 和 ANN）预测 FRP 增强 RC 梁的剪切承载。两种模型的准确性都良好，可以作为传统经验模型的替代。Cao *et\
  \ al.* \\[59\\] 探索了 ANFIS 和 ANN 算法以预测 FRP 在 FRP 梁中的贡献。结果显示，对 FRP 增强 RC 梁剪切强度估算影响最大的三个参数组合是受拉筋深度、FRP\
  \ 弹性模量和剪跨深比的组合。\n\nTanarslan *et al.* \\[60\\] 探索了 ANN 算法，使用 ANN 估计 FRP 增强 RC 梁的剪切能力。为了验证，将\
  \ ANN 的预测结果直接与 `ACI 440.2R`、`CNR-DT`、`CIDAR`、`fib14` 和 `CHBDC` 进行了比较。根据研究结果，ANN\
  \ 模型的结果比标准指南更精确。\n\nPerera *et al.* \\[61\\] 使用 ANN 和多目标进化算法（`MOEA`）预测 NSM FRP 筋加固\
  \ RC 梁的剪切行为。ANN 和多目标进化算法的线性回归斜率分别为 `0.97` 和 `0.8473`，ANN 和多目标进化算法的线性相关系数分别为 `0.9798`\
  \ 和 `0.9115`。ANN 算法性能卓越，具有更高的精度和速度。\n\nAnarslan *et al.* \\[62\\] 部署了 ANN 来预测 CFRP\
  \ 裹覆 RC 梁的剪切行为。ANN 的发现与来自 `fib14`、`CIDAR` 和 `ACI 440.2R` 的结果相等。根据实验结果，在设计指南的理论预测中，`fib14`\
  \ 提供了最好的预测。此外，实际比较表明，在实验结果方面 NN 模型比标准指南更精确。\n\n关于 RC 梁剪切加固中 ML 研究的相关摘要列于表 17.3 中，图\
