  \ [64]。\n\n\n\n数字交易在流行病期间及之后起起了至关重要的作用。数字货币与两个不同方面相关，并帮助在这一时期内赢得了这场战斗，而且这一过程仍在持续。首先，货币被指控为传播感染的媒介，因此，数字化成为社会的福音，并受到绝大多数人的青睐\
  \ [72]。一方面，消费者在网上进行购物；另一方面，他们通过银行卡或 Google 应用程序进行支付，这在印度多个地区也通过政府的支持得以实现 [73]。这最终导致了数字支付使用量的激增，并将推动对这一新技术的扩散研究。其次，在封锁期间，大多数人失业，政府通过数字支付应用程序提供援助。这些是资金从源头传输到目的地的良好媒介，就像在早期的困境情况中一样\
  \ [74]。因此，在危机期间观察到了这两个方面，并需要进一步调查。\n\n### 4.3.8 隐私与监控\n\n在封锁期间，隐私和监控对于管理移动和数字应用程序变得越来越重要。感染患者通过这些智能设备受到监控，并记录了他们的接触追踪轨迹\
  \ [75]。隐私和监控是主要的关注点。在流行病期间，各国政府推出了不同的移动应用程序来追踪症状人员。印度政府启动了 `AarogyaSetu` 应用程序来追踪印度内的感染者\
  \ [76]，中国政府在中国推出了 `Covid-19 tracker` [77]，美国政府启动了接触追踪应用程序 [78]。因此，通过这些技术创新，这场全球疫情可以得到应对，监控问题也可以得到解决。\n\
  \n## 4.4 对研究的影响\n\n本节描述了上述讨论挑战产生的影响。\n\n*   在部署这些数字技术时，理解数字化程度提高带来的影响至关重要。这些智能技术在发展中国家生活的每个方面都非常有用，例如它们在工作流中的整合、在复杂问题中的高效性等。\n\
  *   针对零工经济者和居家办公的员工，考虑了许多研究方面，如他们之间的信任、绩效评估、有效沟通和团队合作。\n*   对于某些员工来说，虚拟工作和理解新的数字工具是困难的，这在他们脑中制造了压力和紧张。随着他们的工作过载，必须接受最新且严厉的数字监管及其所决定的影响。\n\
  *   为了理解数字鸿沟的维度和影响，人们付出了巨大的努力。当全球活动在流行病期间数字化进行时，对于那些无法上网的人来说生存非常困难。互联网接入在当今场景下非常重要。\n\
  *   需要采取网络关闭的措施。在流行病期间及之后，一切都严重依赖互联网，这给生活带来了各种困难。\n*   收集与在线支付系统相关的信息，在流行病期间为受影响的人提供了援助和支持。\n\
  *   通过各种接触定位应用程序收集的数据，在这一期间成为关注焦点，数据分配。\n\n## 4.5 结论\n\n数字转型就像身体的心脏。在当下，每项技术都有其积极和负面影响。在流行病期间，数字化进程不仅影响了工作文化，也改变了正常的生活方式。因此，本章概述了一些新兴技术，这些技术改变了人们的生活并使其具有韧性。研究还强调了与这些技术相关的挑战。\n\
