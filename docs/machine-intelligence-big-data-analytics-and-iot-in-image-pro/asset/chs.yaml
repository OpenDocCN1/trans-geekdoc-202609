  \ 2.8. 结论\n\n本研究采用了多种优化算法来定位肿瘤。医学图像在统计分析之前通常会进行清洗。自适应中值滤波在斑点抑制、斑点保留和均值保持方面优于中值滤波和均值滤波。所提出的算法是五种算法中最准确的，在所有图像中的最高准确率达到了\
  \ 95.8079%。它优于升级前的方法（当时准确率为 90%）。为了提高准确率，未来的研究将使用更多方法并进行采用。当关系的复杂性降低时，诊断确定性水平会增加。使用隐马尔可夫模型，CT\
  \ 扫描可以在扫描时不存在肺癌的情况下寻找它。数据通过去除噪声进行清洗。然后对肺部图像进行分割。医生可以通过观察症状和年龄判断患者是否患癌。更新的模型创建图像，图像用于诊断，最终目标是定位和分类\
  \ 4-D CT 扫描。我们开展的工作是可以实时检测细胞的自动图像处理系统。\n\n## 参考文献\n\n1. Neal, E.S., Bhattacharyya,\
