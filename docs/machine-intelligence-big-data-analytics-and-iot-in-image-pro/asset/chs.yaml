  \n# 第三部分：智能城市与村庄\n\n# 9 数据预处理对数据检索的影响\n\nHuma Naz¹, Sachin Ahuja², Rahul Nijhawan¹\
  \ 和 Neelu Jyothi Ahuja¹\n\n¹ 德拉敦石油与能源大学计算机科学\n² 奇特卡大学工程技术学院，奇特卡大学，旁遮拉邦\n\n> ###\
  \ 摘要\n> 近年来，由于数据驱动方法的广泛应用和普及，数据驱动的决策已成为研究的重点。此类研究的准确性完全取决于可用数据的质量。为了提高模型性能，研究人员采取了不同的“数据预处理”技术。本章旨在探讨数据预处理技术的应用及其对数据检索的影响，并考虑了一些涉及大量数据的特定问题。本章涵盖了在任何数据分析过程之前需要处理的主要问题。本章分为两个部分，强调了数据预处理的必要性。为了确定数据预处理的必要性并研究其对结果的影响，使用了决策树、朴素贝叶和神经网络三种机器学习算法。\n\
  \n> **关键词：** 数据预处理技术，数据分析，数据检索\n\n## 9.1 引言\n近年来，由于数据驱动方法的广泛应用和普及，数据驱动的决策已成为研究的重点。此类研究的准确性完全取决于可用数据的质量。为了提高模型性能，研究人员采取了不同的“数据预处理”技术。本章旨在探讨数据预处理技术的应用及其对数据检索的影响，并考虑了一些涉及大量数据的特定问题。本章涵盖了在任何数据分析过程之前需要处理的主要问题。本章分为两个部分，强调了数据预处理的必要性。为了确定数据预处理的必要性并研究其对结果的影响，使用了决策树、朴素贝叶和神经网络三种机器学习算法。\n\
  \n\n\n\n\n![图 9.1 数据预处理的阶段。](img/c09-fig-0001.jpg)\n\n`图 9.1` 数据预处理的阶段。\n\n如介绍所示，为了获得预期的结果，必须进行数据预处理。数据预处理包含了根据数据集偏好的各种任务。本节对数据预处理中可以执行的所有任务进行了简要介绍。数据预处理的第一步是数据清洗，可以根据数据类型使用各种可用技术进行。如果目标数据集包含数值、名义或多项式值，但根据所选技术并非所有都能处理不同的数据类型，就需要使用数据预处理技术将数据转换为该技术接受的所需格式。数据预处理涉及的另一个重要任务是数据降维，这既需要领域知识也需要技术知识。由于数据集包含可能或可能不有助于预期结果的属性\
  \ [4]，有时数据集中存在冗余值，需要消除这些值以提高数据质量 [5]。这可以根据数据类型和使用的算法通过各种数据降维技术来实现 [6]。数据预处理涉及的各种任务如图\
  \ 9.2\n\n`图 9.2` 数据预处理中的不同任务 [7]。\n\n### A. 数据清洗\n\n#### 在数据缺失的情况下\n有时，从不同来源收集的数据可能包含缺失信息，导致模型性能下降\
  \ [8]，可以通过以下方式处理：\n1. 忽略这些值\n2. 填充缺失值\n\n#### B. 数据回归\n可以使用线性回归对数据进行平滑处理。回归分析被解释为一种预测方法，它指定了因变量和自变量之间的关系，用于时间序列预测等多种应用。\n\
  \n#### C. 聚类\n可以使用聚类技术消除数据中的异常值，因为相似的数据会被归类，而异常值会被移除 [6]。\n\n#### D. 数据转换\n数据的基本局限性可能是其不完整或不相关，这需要转换技术。因为，如果数据不进行转换，就会遇到许多困难\
  \ [9]。\n\n#### E. 数据分析\n数据分析是从数据中提取隐藏模式的过程，这被证明是有用的 [10]。\n\n论文的其余部分安排如下：第二节介绍了不同的预处理。第三节对方法论进行了详述。第四节描述了工作工作。第五节讨论了获得的结果。论文在第六节结束。\n\
  \n## 9.2 相关工作\n许多研究建议使用预处理操作来提高一致性。此外，根据 Jagdale 等人 [11] 的观点，已有若干针对组织数据进行预测的研究，这些数据必须经过各种预处理阶段。作者试图对研究的所有技术和实践方面进行调查，以提供完整的表示\
  \ [11]。Sriram 等人 [12] 对图像预处理进行了综述。一种变化检测算法应用于图像数据集，但在实现该算法之前，需要一系列图像预处理步骤。使用抑制技术来增强图像质量，从而提高检测对象的效率。所有诱发变化的算法被分为六类，结合了分割、阈值、差异、轨迹分类、统计边界和回归\
  \ [12]。虽然有许多数据处理的工具和技术，但 Perez 等人 [13] 引入了一种名为 `SeqClean` 的新预处理软件。该工具已经在爱达荷大学生物信息学与演化研究所\
  \ (IBEST) 的测试和生产阶段通过了验证 [13]。\n\nTran 等人 [14] 解释了数据分析领域中需要具备的开放问题和挑战，以改进解决类别不平衡问题。Mishra\
  \ 等人 [15] 在其提出的研究中考虑的问题以及近期科学、工业和业务应用中不断演变的大数据，是非结构化的，需要预处理以为任何机器学习算法提供良好的结果。\n\n\
  \n\n\n\n提取实时用户访问数据的预处理算法 `[16]` 可以对业务模式和趋势产生更深层次的洞察。在这里，Banerjee 和 Pal `[17]` 提出了一种高效的预处理技术和创新的哈希技术，用于识别\
  \ Web 使用挖掘中的 `Distinct Users`（独立用户）。近期作者 Imambi 和 Sudha `[18]` 将数据准备任务精炼并增强到了工业标准。作者建议了一种名为“数据挖掘交叉标准过程”（CRISP-DM）的方法来处理噪声和未处理的数据。对于流行病领域，数据准备可以分为通用型（General）和特定型（Specific）。在\
  \ Aziz *et al.*（等等人）`[19]` 的工作中，通过数据中相应的吸引力和密度移除噪声和离群值，这被称为 `D-IMPACT` 数据预处理，这是一种在二维数据集中产生更好结果的迭代技术。特征选择通过多种方式进行，无论是有监督还是无监督算法，通常包含重复或关联的特征。这产生了额外成本并完全消除了重复值，这可能使系统更易受到\
  \ Khoshgoftaar *et al.* `[20]` 和 Kang *et al.* `[21]` 所讨论的区域误差的影响。\n\n其他研究人员，如 Mukhopadhyay\
  \ *et al.* `[22]` 在无监督类别中提出了一种名为“UFeSCoR”的新特征选择方案，以避免非显著特征并允许显著特征。因此，这种方法通过对比其他其他特征选择方法有助于控制冗余。提供了一种新型特征加权方案“GRW”（Zhang,\
  \ Y., `[23]`，Nazarzade *et al.* `[24]`），并在医学数据集上测试时证明其支持分类准确率。\n\n在软件工程背景下，尝试了迭代和基于多次划分的过滤器用于数据预处理。Nilashi\
  \ *et al.* `[25]` 由此改进了软件质量预测。基于过滤拟合的数据集构建的模型所获得的最终结果比基于较高噪声水平的数据集构建的模型更准确。Niu *et\
  \ al.* `[26]` 的实验结果提出了一种新方法，相对于所有传统的 `SVM` 集成，该方法所需训练时间更短即可获得合理的成功。Palaniappan &\
  \ Awang `[27]` 指出了用于数据挖掘的多目标进化算法的贡献。这为特征选择增加了更轻量的维度。当数据量变得庞大时，“众感知”通过动员连接到各种网络设备的大量移动用户来利用群众的力量。\n\
  \n## 9.3 方法论\n\n当数据量变得庞大时，“众感知”通过动员连接到各种网络设备的大量移动用户来利用群众的力量。正如 *et al.* `[28]` 所讨论的，通过数据中相应的吸引力和密度移除噪声和离群值，这被称为\
  \ `D-IMPACT` 数据预处理，这是一种在二维数据集中产生更好结果的迭代技术。\n\n当数据量变得庞大时，“众感知”通过动员连接到各种网络设备的大量移动用户来利用群众的力量。\n\
  \n### 9.3.1 实验设置\n\n当数据量变得庞大时，“众感知”通过动员连接到各种网络设备的大量移动用户来利用群众的力量。\n\n当数据量变得庞大时，“众感知”通过动员连接到各种网络设备的大量移动用户来利用群众的力量。\n\
  \n## 9.3.2 各种预处理任务的应用\n\n### 数据清洗\n\n由于所有数据集都是巨大的，可能存在如离群值等差异。“众感知”通过动员连接到各种网络设备的大量移动用户来利用群众的力量。\n\
  \n### 离群值检测\n\n在填充缺失值并清洗数据后，经检查发现，模型的性能会受到数据集中离群值存在的影响。\n\n### 处理不平衡问题\n\n所应用的机器学习算法在不平衡数据的模型训练上表现并不良好。\n\
  \n\n\n\n\n顾顾名，`DT` 分类器的工作原理类似于树结构，其内部节点对数据集的每个属性进行测试，而最终节点代表 `DT` 的结果。`DT` 被证明是用于预测的最基础且高效的分类方法。权重最高的属性被视为树的根，所有内部节点都对所考虑的根节点应用决策。`DT`\
  \ 是一种简单且易于解释的分类问题，尽管训练数据中的噪声和离群值可能会导致数据集过拟合。当使用训练数据构建 `DT` 时，许多分支会由于噪声过度扩张，因此，为\
  \ `DT` 提供预处理后的数据以获得更好的结果至关重要。\n\n#### 9.3.3.2 朴素贝叶斯\n\n`NB` 并不是单一算法，而是算法的集合，遵循贝叶斯分类规则。它代表了假设与实际观测之间的关联。如公式\
  \ (9.6) 所示。\n\n(9.6)![equation](img/c9-disp-0006.png)\n\n*   其中 `P(Y)` 显示前提的先验概率\n\
  *   `P(X)` 呈现实际值的先验概率\n*   `P(Y/X)` 表示在给定 `X` 的情况下前提概率\n*   `P(X/Y)` 显示给定值的概率\n\n\
  通常，需要识别数据对象的后验概率。`Naive Bayes` 是一种监督类分类器，这意味着它在对数据集进行分类之前需要经过训练。由于由于，分类器需要一些包含若干个对应分类实例的训练数据。之后，还需要一个测试集用于测试目的\
  \ [29]。`NB` 是一种可以解决二分类和多分类问题的分类算法。尽管如此，`NB` 在处理二分类或分类变量时表现更好。在本文工作中，所有功能性数据集都包含分类目标变量。\n\
  \n### 9.3.3.3 人工神经网络\n\n人工神经网络——基本上是一个源自生物学的概念，在生物学中，神经网络人体人体起着主要且关键的作用。神经元是一种独特的生物细胞，负责在化学变化和某些电变化的辅助下将信息从一个神经元传递到另一个神经元。它由细胞体组成，并具有两种向外的分支（树状）。包含某些遗传特征信息的细胞核和含有为神经元提供重要物质分子工具的细胞质是细胞体的组成部分。人工神经元主要是生物神经网络或神经元的工程方法。\n\
