  \ \\[3\\]对于阻止癌细胞的进展和扩散至关重要。目前，识别肺癌的方法尚不充分。\n\n## 2.2. 所提模型的主要贡献\n\n卷积神经网络 (`CNN`)\
  \ 可以通过网络产生的最终卷积特征图，逐像素地对输出梯度进行加权。当 `CNN` 算法得出结论时，该方法被应用于每个特征图像素，以确定其相对于 `CNN` 算法得出的结论的值。可以使用一本书来获取\
  \ `SoftMax` 和指数激活函数的数学公式，以及像素级加权方法。\n\n\n\n\n在评估视化质量时，可以使用许多方法，如反卷积、引导反向传播、计算机辅助机制（CAM）和梯度加权类激活（Grad-CAM）\
  \ \\[7\\]。通常做法是代之以人工或辅助评估，例如相对于边界框（真值）的定位误差。此外，在这种情况下，应该舍弃网络的决策规则。根据研究结果，已经开发了新的标准来评估理论和解释在多大程度上反映了其所基于的模型（客观上）。研究结果显示，群优化的性能优于\
  \ \\[8\\]其他替代方案。\n\n与之前解释 `CNNs` 的尝试一样，该模型已经在模拟工作上进行了测试。`Grad-CAM` 图像并不能产生像 Graduated\
  \ CAM++ 图像（对于人类用户而言）那样对模型的同样信任。在照片中寻找弱引导物体类别方面，群优化表现优于 `Grad-CAM`。逻辑应该能够合理地总结任何数据集。人工智能的解释\
  \ \\[9\\]已引起广泛关注。Grad-explanation 的映射让学生能够构建自己的损失函数，这可能帮助他们在与教授的一面对面中表现得更好。统计采样显示了成功\
  \ \\[10\\]，并建立了一种有助于实现目标的方法。群优化 \\[11\\]可用于数据合成的各种应用，包括图像分类和物体识别。涉及到照片时，通常用于帮助人们理解电影的\
  \ `3D-CNNs` 并不常见。图 2.2 说明了直到最近，`CNNs` 仅能够显示二维图像。\n\n![图 2.1 带有 PSO 的 CNN 基础框图](img/c02-fig-0001.jpg)\n\
  \n图 2.1 带有 `PSO` 的 `CNN` 基础框图。\n\n![图 2.2 提出的 3D CNN 架构](img/c02-fig-0002.jpg)\n\
  \n图 2.2 提出的 `3D CNN` 架构。\n\n`CNN` 的每一层都可以有输入层和输出层。顶层之上还有卷积层和最大池化层。引入卷积层能够对可用输入池进行最有效的利用。每一层都将与其他层连接，并都指向同一个位置。卷积核与数据的点积会创建出这种映射。使用可用最大数量池化层是缩小尺寸的最佳方法。这在提高处理速度的同时也减少了执行的过拟合量。在构建项目时，底层被教学习更困难的内容，而顶层被教包含更简单的部分。\n\
  \n在 `CNNs` 中必须使用卷积层来模拟特征，如良性结节和恶性结节等。不再使用单层，而是使用体素，卷积核或滤波器将是三维的。假设，它不是看到 2D 特性（如边界和角），而是会注意到上述列出的\
  \ 3D 特性。\n\n## 2.3. 相关工作\n\n肺部肿瘤的形成由于异常细胞不受控生长 \\[12\\]。早期肺癌有助于患者活得更久并获得更有效的治疗。可以使用多种医学成像方法来帮助医生诊断疾病。已经提出了许多有助于早期检测肺肿瘤的科研计划。最常见的问题是显著的计算延迟和肿瘤的误识别。为了克服这些困难，本研究提供了一种基于空洞空间金字塔池化架构\
  \ (`ASPP-Unet`) 和鲸鱼优化算法 (`ASPP-Unet-WOA`) 的混合分类器。该模型要求在预处理期间使用 `Gabor filter` 以在肺\
  \ CT 中实现更准确的肿瘤检测。其次，为了分割特征，应用了保证收敛粒子群优化。最后，使用二进制蝗虫优化算法来识别应该使用哪些特征。事实证明，所提出的方法 (`ASPPUnet-WOA`)\
  \ 在美国癌症研究所 (`NCI`) 的肺癌数据库联盟数据集上有效。分析并比较了大量的性能指标与之前产生的分类器，以确定哪一个是性能最好的。`CNN` 的准确率评级为\
  \ 93.45%，`CNN` 的评级为 91.67%，`UNet` 的评级为 95.75%，而 `ASPP-UNet-WOA` 的评级为 98.68%。\n\n\
  肺癌是一种可怕的疾病，每年破坏全球数千人的生活。早期识别肺癌可能会提高患者的生存机会。`CT` 扫描用于检测肿瘤在全身扩散的大小和范围。另一方面，`CT` 成像的问题会导致肿瘤区域可见性降低且构造性率较高。本章描述了一种基于优化的肺癌诊断策略。使用\
  \ `CT` 扫描确定肿瘤的位置。深度联合模型用于分割 `CT` 图片。此外，提取了局部三值模式特征、HoG 特征以及统计参数（如方差、均值、峰度、能量、熵和偏度）。分层注意力网络\
  \ (`HAN`) 用于分类肺癌。为了训练 `HAN`，采用了火萤虫竞争群优化 (`FCSO`) 技术。它将火萤虫算法 (`FA`) 与竞争群优化 (`CSO`)\
  \ 结合以提供最优结果。基于基于 `FCSO` 的 `HAN` 的准确率、敏感度和特异性均很高，分别为 91.3% 的准确率、88% 的敏感度和 89.1% 的特异性\
  \ \\[13\\]。\n\n频繁项集挖掘算法的文献综述；热图像电气设备状态监测分割技术的影响；医疗记录安全与隐私各种问题和技术的综合综述；以及银行贷款领域不同分类算法的性能分析是涵盖的主题\
  \ \\[14\\]。\n\n\n\n\n在医学信息学领域，医学数据的分类是一项具有挑战性的任务 [15]。必须采用源自医学数据集的分类算法，以实现通过医学数据分类减轻人类压力的目标。本研究的主要目的是使用一种基于决策树的信角群优化算法（`DT-SWO`）对医学数据进行分类。在预处理之后，混合特征选择技术选择了医学数据的属性。离散独立成分分析（`DICA`）用于减少高维特征的数量，而\
  \ `DT-SWO` 用于选择最主要的医学数据类别。`UCI` 机器学习库包含了与心脏、肝脏、癌症和肺部疾病相关的四个数据集：白血病、弥漫性大 B 细胞淋瘤（`DLBCL`）、肺癌和结肠癌。最后，研究结果表明，推荐的\
  \ `DT-SWO` 方法在医学数据分类方面优于现有算法。\n\n本研究的目的是通过减少输入特征的数量并优化 `BPN` 分类器每层神经元的数量，在保持准确性的同时构建一个理想的反向传播网络（`BPN`）模型\
  \ [16]。这项工作提供了一种用于特征集压缩的混合 `AFSO-EA` 策略，它将人工鱼群优化（`AFSO`）与进化算法（`EA`）相结合。本研究中使用与创建\
  \ `BPN` 模型相同的混合策略优化了每个隐藏层神经元的数量。根据结果，推荐的混合 `AFSO-EA` 策略提供的 `BPN` 模型分类准确率为 97.5%，且计算开销远低于现有技术。\n\
  \n最近发现指示癌症疾病的基因在微阵列数据分析中变得日益重要 [17]。由于情况频繁变化，大量的数据是必重要的。传统的数据挖掘方法在地理和时间复杂性方面效率低下。通过利用大数据可以实现特定目标。在本研究中，利用改进的监督主成分分析（`ISPCA`）实现了特征提取。为基因表达构建了协方差矩阵，并使用\
  \ `ISPCA` 通过特征选择对癌症进行分类。然后，利用独特的封装模型方法和边界调优支持向量机（`BT-SVM`）分类器进行了改进的粒子群优化（`PSO`）。该研究使用了来自加州大学欧文分校的系列数据集，包括关于白血病、乳腺癌、脑癌、结肠癌和肺癌的数据。所建议的方法在六个脱氧核糖酸（`DNA`）微阵列数据基准数据集上根据准确率、召回率和精确率进行了评估。它在用于判断计划工作有效的系列常用指标中表现出色，在有和无特征选择的情况下均获得了最佳的准确率、召回率、精确率和训练长度。\n\
  \n肺癌不再是一个副作用 [18]。在各项研究结束后，发现死亡率已经上升。因此，患者应该更早地进行诊断以限制死亡人数。目前，机器学习领域存在多种用于特征提取和选择肺癌识别的方法。使用超像素进行分割是一种常用方法。我们将在本研究中一种能够在肺癌检测中产生准确结果的算法，开发或改进当前的算法（如遗传优化、`PSO`\
  \ 和 `SVM`），并将其它们与现有算法进行比较，最后确定一种能够设计肺癌检测系统准确率的标准策略。\n\n肺癌是全球范围内男女死亡的主要原因，估计每年导致五百万人死亡\
  \ [19]。`CT` 扫描对于诊断肺部疾病可能非常有效。本研究的主要目的是检测肺图像中的恶性肺结节并根据其严重程度诊断肺癌。这项工作应用新的深度学习方法来定位癌性肺结节。这项工作采用了最佳特征提取算法，包括方向梯度直方图（`HoG`）、基于波变换的特征、局部二值模式（`LBP`）、尺度不变特征变换（`SIFT`）和\
  \ Zernike 矩（Moment）。在累积了纹理、几何、体积和强度数据后，使用模糊粒子群优化（`FPSO`）方法识别最佳特征。随后，采用深度学习对这些特征进行分类。由于新的模糊粒子群优化卷积神经网络（`FPSOCNN`），`CNN`\
  \ 的计算复杂度得到了降低。\n\n在生物医学研究领域，在显微镜下检查病变组织并使用称为组织病理学的程序评估疾病严重程度至关重要 [20]，实验室生成用于数字查看的组织切片。这些组织学照片已完整扫描。在切片数字化后，病理学家可以在计算机上查看它们而不是使用显微镜。因此，能够区分和表征细胞核对于癌症检测至关重要。由于组织病理照片中噪声程度高且细胞核大小波动较小，这一过程变得非常困难。为了应对这一困难，我们设计了一种基于优化的超像素聚类的自动细胞核分割方法。首先从可靠来源收集组织病理学图像集。然后，采用归一化方法去除图像中的噪声。去噪后，利用最佳聚类算法将细胞分割为恶性细胞和良性细胞。推荐策略的主要目的是使用有效的分割技术来处理良性肿瘤问题。所建议的研究在分割肺/乳腺/肝/脑癌组织学图像方面取得了出的性能，通过检索关键部分将所展示的\
  \ `CT` 扫描分类为肿瘤或非肿瘤，从而支持了癌症的早期诊断。\n\n\n\n\n\n由于自动化医疗诊断的各种益处，肺癌检测一直是研究的重点[21]。近年来，利用\
  \ CT 扫描进行自动肺癌筛查被认为是一项关键工具。尽管文献中发表了多种肺癌检测方法，但建立一个能够自动识别癌症的有效系统仍然具有挑战性。因此，本项目的目的是创建一个基于深度学习的采用混合优化策略的自动化肺癌检测系统。肺癌数据库中的\
  \ CT 图像在提交给主动轮廓肺分割之前在此进行了预处理。然后，使用网格的技术发现分割图像中的结节。包括强度、小波和散射变换在内的多个图像组件被输入到所提出的大象群优化算法-深度信念网络（SEOA-DBN）中进行分类。SEOA\
  \ 是一种新发现的方法，它结合了藻类群算法（SSA）与大象群优化算法（EHO）。实验将传统数据库的肺部 CT 图像与多种先进技术进行了比较。根据统计，计划的基于\
  \ SEOA 的 DBN 运行良好，准确率达到了 96%。\n\n## 2.4 问题描述\n\n随着越来越多的人依赖医学图像来诊断和治疗疾病，医学图像变得越来越重要。由于医疗专业人员寻求更好地理解人体解剖和功能，这些图像至关重要。长期以来，医学图像处理被认为是一个小众领域，但现在它已无处不在。在医学手术中使用的技术包括图像分割、图像配准和图像引导手术等。癌症的一个主要问题是该疾病的发现和诊断太晚。因此，很少有患者能获得治疗，治疗费用昂贵得令人负担，死亡似乎是必然的。必须在尽早的机会对疾病进行诊断和分类。这无疑是一个可以拯救生命的属性。\n\
  \n## 2.5 提议模型\n\n### 2.5.1 肺癌医学图像分析中的群体优化\n\nPSO 是一种基于计算机的方法，用于识别给定问题的最优解决方案。它利用质量度量来尝试提高潜在解决方案的质量。这就是\
  \ PSO 对每个解决方案的引用方式。粒子构成了群体结构。根据个体移动的速度和它们之间的距离，PSO 决定了它们应该被分配到何工作。由于每个粒子都有唯一的局部最佳位置，粒子向搜索空间中最已知位置的方向迁移。\n\
  \n通过对粒子位置进行调整，以便更好地引导群体到达已识别最佳可能的位置。在搜索空间中，彼此靠近的粒子可能代表某个优化问题的解决方案。由于搜索过程是随机的，粒子可能会给出一个比之前想出的更不满意的解决方案。对于\
  \ PSO 算法，有大量的粒子，每个粒子都有唯一的当前目标编号和位置，以及一个个人最佳目标编号（即该粒子目前为止的最佳目标编号）。表现顶峰的个体被认为对他们最有价值。PSO\
  \ 还保留了世界最佳值和位置，这是任何粒子在宇宙中拥有过的最大值和位置。\n\n### 2.5.2 结合 PSO 的深度学习\n\n在计算机行业中，深度学习是机器学习的一种，能够有效识别模式，但它需要大量数据才能正常运行。对用于机器学习和深度学习算法的数据进行检查[22–25]]是一项重要的过程。深度神经网络拓扑结构涵盖了图像分类、自然语言处理、计算机视觉和生物信息学在内的广泛领域，用于解决这些方法中的问题。最近的几项研究表明，深度学习可以在各种应用中产生领先的结果，从而促进了它的复兴。\n\
  \n\n\n\n\n根据数据，该公司在医学影像领域的筹集资金将超过 2016 年整个分析领域的总和。以这种方式使用机器学习是目前可用最高效的受监督方法。该过程中使用了一种被称为“深度神经网络”的神经网络。\n\
  \n近年来，这种神经网络在图像分类和计算机视觉等应用中变得越来越流行。基于 DCNN 的架构：本研究展示了如何从肺部 CT 扫描图中检测并分类癌症。因此，这项工作展示了这种架构结构是如何组合的。\n\
  \nCNN 主要有三个重要的层：\n\n1. 输入图像层\n2. 卷积池化层\n3. 分类层\n\n### 2.5.3 建议的 CNN 架构\n\nCNN 模型利用局部感受野、共享权重和下采样，使其比单一模型对平移、缩放和畸变更具抗性。该模型可以通过使用线性滤波器、偏置和非线性函数，学习如何将大量不同的特征相互映射。卷积层称为\
  \ `Conv`，池化层称为 `Pool`，全连接层称为 `FC`（completely connected 的缩写）。\n\n模型包含一个具有 32 个滤波器的\
  \ SoftMax 分类器，以及三个卷积层、两个最大池化层、一个全连接层和另一个全连接层。图像被传递到第一个卷积层，该层通过第一个卷积层创建的 24x24 块对其进行分离。在\
  \ `C1` 的 32 个特征图之间有 1 像素的间隙，它们连接到由 5 个滤波器生成的 24x24 像素的分块图像，且 `C1` 中每个特征图之间也有 1 像素的间隙。它们的宽度为\
  \ 20 像素，高度为 20 像素。这是该结构的第二层。卷积尺寸使用了两个数字，步长也使用了两个数字。除了第一层外，还有一个第二个卷积层（10x10 卷积层）。`P1`\
  \ 的输出通过该层路由。随后，卷积层和池化层的处理方式与之前完全相同。最后，有若干用于将多个独立单元连接在一起的层。之后，采用 SoftMax 分类器来确定图像是正常的还是癌。DCNN\
  \ 架构 1 以尽可能少的层数创建，以便处理大小为 1,000 像素的图像。数据集的准确性与集合中照片的数量成正比。因此，这项工作采用了两种可选的 DCNN 拓扑结构，下文分别描述。与架构\
  \ 1 相比，架构 2 具有更多的卷积层和池化层。这样做是为了提高准确性。这些分类器应用于约万张照片，并表现良好。图 2.3 是受众提出的架构 2 的表示。\n\
  \n![图 2.3 带有偏置的线性滤波器。](img/c02-fig-0003.jpg)\n\n图 2.3 带有偏置的线性滤波器。\n\n![图 2.4 全连接\
  \ CNN。](img/c02-fig-0004.jpg)\n\n图 2.4 全连接 CNN。\n\n图 2.4 中的 CNN 架构由 13 层组成。其中 7\
  \ 层是卷积神经网络，4 层是池化神经网络，1 层是连接神经网络，1 层是 SoftMax 分类器。然而，某些层在 图 2.5 中的滤波器大小为 5x5，而其他层的尺寸为\
  \ 2x2，两者并不相同。在引入卷积层后，用于特征图的滤波器数量从 64 增加到 96、128、192、256，如下所示。该算法包含了 7 个卷积层、4 个池化层、2\
  \ 个全连接层和 SoftMax 分类器。它对 256x256 块尺寸的输入图像添加 64 个滤波器。与块的大小相似，每个滤波器都有类似的足迹。池化层有两个 2\
  \ 滤波器，它们共同将前一个卷积层的输出减小最小尺寸。第一个池化层生成 126x126 的输出，然后发送到第二和第三层卷积层，分别对结果图像应用 98 和 128\
  \ 个滤波器。之后，采用最大池化，生成尺寸为 59x59 像素的图像。同样，对于第四和第五卷积层（具有 128 和 192 个滤波器），也是如此。它们将来自第三最大池化层的下采样照片应用到这些层，生成一个总维度为\
  \ 25x25 的特征图。方法：重复此过程，直到每层中的所有神经元都连接到前一层的所有神经元，以此此类推。最后但同样重要的是，利用 SoftMax 分类器将图像分类为三类：正常、良性和恶性。第二种架构在每个方面都优于前一种。从架构上说，第三层通过与之前层非常相似的描述和超参数完全互连。\n\
  \n![图 2.5 带有偏置和步长的滤波器。](img/c02-fig-0005.jpg)\n\n图 2.5 带有偏置和步长的滤波器。\n\n\n\n\n肺癌是世界上最常见的癌症，也是导致癌症相关死亡的首要原因。在美国，低剂量\
  \ CT 扫描正被用于肺癌筛查，以识别患该疾病高风险的人群。预计在不久的将来，会有更多国家效仿此。CT 肺癌筛查需要审核数百万张 CT 图片，这给放射科医生带来了巨大的压力。因此，创建提高筛查程序效率的计算机算法引起了极大关注。肺结节可能是早期肺癌的指标，也可能不是，它是肺癌筛查\
  \ CT 中首要检查的内容。\n\n已经有证据表明若干 `CAD` 系统能够实现这一目标。自动结节识别方法将在 `LUNA16` 竞赛中进行大规模测试，该竞赛将利用\
  \ `LIDC/IDRI` 数据集进行测试。四位放射科医生在 `LIDC/IDRI` 数据收集过程中提供了有关结节的信息。这些信息向公众开放，并包含了对个体的描述。更棒的是，`LUNA16`\
  \ 挑战现在对任何想要参加的人开放。该赛道提供了可以完全定位结节的系统赛道，也提供了处理可能存在某种形式结节的位置列表的系统赛道。该列表的编制是为了让团队能够利用算法确定\
  \ CT 扫描中哪里可能看到肺结节，哪里可能不可见，从而相互协助。`Lung Image Database Consortium` 图像集包含带有病变标注的胸部\
  \ CT 图片，可以在此处找到 (`LIDC-IDRI`）。这些照片用于诊断肺癌和寻找疾病症状。在互联网上可以获得有关识别和诊断肺癌的 `CAD` 过程的帮助，这是可用最大的资源之一。美国癌症研究所\
  \ (`NCI`)、美国国立卫生协会基金会 (`FNIH`) 和美国食品药品管理局 (`FDA`) 均参与了这一公私合作项目，以展示基于共识的联盟是如何运作的。\n\
  \n八家医疗影像公司与七家学术机构共同开发了该数据集，包含 `1018` 记录。对于每个人，图中显示了胸部 CT 扫描的图像，旁边还显示了一个 `XML` 文件，该文件包含了四位胸部放射科医生在两年内创建的两阶段图像注释系统的结果。这正是在初始盲读阶段发生的情况。每张\
  \ CT 图像都由一位放射学专家审核，他们将病变分类为 `nodule > = 3 mm`、`nodule 3 mm` 或 `non-nodule > = 3\
  \ mm`。在程序的非盲读部分，每位放射科医生都会审核自己的标记，以及其他三位放射科医生的标记，然后得出最终判断。该方法的目标是在每张 CT 扫描中发现尽可能多的肺结节，而不需要团队达成共识。\n\
  \n## 2.7. 结果与讨论\n\n### 2.7.1 性能评估参数\n\n肺癌分类的基本性能指标有：\n\n*   平均绝对误差 (`MAE`)\n*  \
  \ 分类准确率\n*   均方误差 (`MSE`)\n*   F1 分数\n*   对数损失\n*   混淆矩阵\n*   曲线下面积 (`AUC`)\n\n\
  `MAE` 可以通过两种不同的方式计算。它展示了预测是不错误的。如果数据预测错误，该数据将无法显示误差的方向。它可以用数学公式表示如下：\n\n![equation](img/c2-infml-0001.png)\n\
  \n在分类中，“准确率”（accuracy）一词经常被误写为“精确率”（precision）。正确预测的数量除以输入样本的总数如下：\n\n![equation](img/c2-infml-0002.png)\n\
  \n这种方法在两个类别的样本数量相同时效果最好，因为每个类的样本数量并不总是相同的。考虑到训练集包含了 98% 的 `A` 类样本和仅 2% 的 `B` 类样本。结果，通过简单预测所有\
  \ `A` 类训练样本，模型就实现了 98% 的训练准确率。根据结果，当用同一个模型对 60% 的 `A` 类样本和 40% 的 `B` 类样本进行测试时，测试准确率下降到\
  \ 60%。因此，在这种情况下，分类准确率似乎很高。真实问题出现在当错误分类少数类样本的成本变得极其昂贵时。未能诊断罕见但致命疾病的成本超过了对健康个体进行额外检测的成本。\n\
  \n`MSE` 和 `MAE` 之间的唯一区别是 `MSE` 取原始值与预测值之间差的平方平均。`MSE` 比 `MAE` 更容易计算，后者需要复杂的线性规划工具。由于较大的误差在平方后影响更大，模型现在可以强调较大的误差。\n\
  \n![equation](img/c2-infml-0003.png)\n\n调和平均数用于计算 `F1 Score`，这是一种精确率和召回率的量。`F1 Score`\
  \ 的范围从 0 到 1。它显示了分类器的精确度和强度（正确分类的次数）（没有遗漏大量实例）。具有高精确率但低召回率，结果极其准确，但漏掉了许多难以分类的案例。`F1\
  \ Score` 表明了模型的准确性。从数学角度来看，它如下：\n\n![equation](img/c2-infml-0004.png)\n\nF1 分数的属性是在召回率和精确率之间找到平衡点。精确率是正确预测的正例数除以分类器的预测总数。\n\
  \n![equation](img/c2-infml-0005.png)\n\n召回率是正确识别的正例样本与相关样本（所有应被识别为正例样本）之间的比例。\n\n\
  ![equation](img/c2-infml-0006.png)\n\n对数损失对错误分类施加了惩罚。它擅长分类多个类别。在使用对数损失时，分类器必须为每个类别给出概率。对数损失是：如果从\
  \ `M` 个类别中有 `N` 个样本，对数损失为：\n\n![equation](img/c2-infml-0007.png)\n\n其中 `y ij` 表示是否提取了样本。`I`\
  \ 是第 `j` 类成员。\n\n`P ij` 表示样本 `I` 属于第 `j` 类的概率。\n\n对数损失没有上限；它发生在 [0,1] 之间。精确率通过接近零但并非零的对数损失所示。降低对数损失通常会提高分类准确率。\n\
  \n作为输出，混淆矩阵总结了模型的整体性能。假设这是一个二分类问题；混淆矩阵如[表 2.1](#c02.xhtml#c2-tbl-0001）所示。\n\n可以被分类为是或否的样本，以及预测输入样本类别的分类器。下表显示了模型在\
  \ 165 个样本上的结果。\n\n\n\n\nAUC 是一种常用的评估指标。它用于解决需要二分类的问题。分类器的 AUC 值是：随机选择的正样本排名高于随机选择的负样本的概率。在讨论\
  \ AUC 之前，让我们定义两个概念：灵敏度使用 `TPR(TP/(FN+TP))` 来衡量。`TPR` 是在评估所有正性数据点后，被正确分类为正例的正性数据点的百分比。\n\
