  \n### 7.3.2 采用的技术\n\n### 7.3.2.1 ReliefF 算法\n\n该属性选择方法在多分类情况下计算输入的权重。该方法通过惩罚相同类别中具有不同值的预测器，同时奖励不同类别间产生不同值的预测器。它通过估计特征的质量及其区分相邻样本的有效性来工作。所有预测器的权重初始设置为零。权重根据目标与其相邻实例之间的属性差异进行更新\
  \ [30]。RF 特征选择的一般步骤如算法 11 所示。\n\n`表 7.3` ReliefF 算法确定每个特征的排名和权重。\n\n| 序号 | 特征 |\
