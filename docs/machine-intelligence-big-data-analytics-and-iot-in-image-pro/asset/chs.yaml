  \ 7.2 ReliefF 算法预测的每个特征的权重。\n\n### 7.3.2.2 遗传算法\n\n这是一种受启发优化技术，用于特征选择。它基于自然演化的思想，这意味着生物的基因通过世代不断进化，以更好地适应它们的环境。它将达尔文的物竞天择思想作为搜索算法的一部分，在所有选项中寻找最佳答案。它跟踪针对特定问题的潜在解种群，称为“个体”。它使用选择、交叉和变异等遗传算子，在许多代之后创建出更好的解决方案。每个解决方案都使用适应度函数进行评估，适应度函数对于优化解决方案至关重要\
  \ [31]。遗传算法涉及的一般步骤如算法 2 所示。\n\n### 7.3.3 用于小麦产量预测的机器学习技术实现\n\n在当前的研究中，应用了常用且最重要的机器学习（ML）算法来预测小麦产量。这些算法是：KNN\
  \ [32]、NB [33]、ANN [34]、LR [35]、SVM [36] 和 LDA [37]。在目前的研究中，每个机器学习模型都被实现为一个分类器，并在带有输入参数（由本研究采用的特征选择技术选择）的训练集上进行了训练。输出标签三个类别。\n\
  \n### 7.3.3.1 K 近邻算法\n\nKNN 提供了用于分类和回归任务的监督学习技术。该方法的假设是数据集中的每个实例对应 `D` 维空间中的点。使用邻近的\
  \ `k` 个数据实例来评估新数据实例的输出标签。通过应用包括欧几里得（Euclidean）、城市区块（Cityblock）、曼哈顿（Manhattan）等在内的距离度量，找到靠近的\
  \ `k` 个数据点，以追踪相似的模式。这些指标评估了给定实例与训练集中每个样本之间的距离，由 `k` 个最近邻的多数类别标签代表给定实例的输出类别。在 particular\
  \ 算法中，`k` 指一个正整数，通常可以使用启发式技术获得 `k` 的最佳值。\n\n假设 `M` 是训练集中具有 `D` 个输入属性的实例；`L` 是一个具有属性数组\
  \ `[l[1], l[2], l[3]….l[d]]` 的新样本，其中 `t[v]` 指第 `v^(th)` 个属性。`M` 和 `L` 之间的欧几里得距离计算如下：\n\
  \n(7.2)![equation](img/c7-disp-0002.png)\n\n对于当前的工作，使用了 10 折交叉验证和欧几里得距离度量来创建基于 `KNN`\
  \ 的混合系统。发现最佳最近邻数 (k) 为 7。\n\n### 7.3.3.2 人工神经网络\n\n神经网络是一个简化类脑系统的数学模型，由人工神经元的并行分布网络组成，可以对模式识别进行同步计算。人工神经元模仿生物神经元的作用。ANN\
  \ 由输入层、隐藏层和输出层组成，其中输入层接收来自数据集的输入参数，处理它们并将其传输到隐藏神经元。在隐藏层中，每个神经元处理并传播来自上层的输入信号，传播信号的强度取决于神经元的权重、激活函数和偏置值（bias\
  \ value）。最终输出在输出层获得。每个输入数据与某些权重值相关。神经网络使用某些随机值初始化权重，然后通过应用学习算法评估最终权重。此外，每个神经元的输出通过激活函数限制在某些范围内。偏置项是指在应用激活函数之前在加权输入上添加的常数。它只影响输出值。\n\
  \n![图 7.3 ANN 的通用架构。](img/c07-fig-0002.jpg)\n\n图 7.3 ANN 的通用架构。\n\n通常情况下，ANN 由一个输入层、一个或两个带有少量神经元的隐藏层以及一个输出层组成。图\
  \ 7.3 代表了 ANN 的通用框架。第一层 `L1` 代表输入层；第二层 `L2` 指隐藏层；第三层 `L3`称为输出层；每层由相互连接的神经元组成。\n\n\
  在上述网络中，输入层有 `n` 个神经元，其中 `n` 代表输入向量 `X=[x[1], x[2], …, x[n]]` 中的特征数量；`W[i]` 指层间神经元之间连接的权重，`b[(i)]`\
  \ 代表层内神经元的偏置值。输出 `y` 表示为：\n\n(7.3)![equation](img/c7-disp-0003.png)\n\n其中 `f(.)`\
  \ 代表激活函数。\n\n在这项工作中，`ANN` 模型包含一个输入层、一个隐藏层和一个输出层。隐藏层由 8 个神经元组成，学习率设置为 0.01。输入层和隐藏层应用“线性（linear）”激活函数，而输出层使用“sigmoid”函数。ANN\
  \ 模型的训练使用“缩放共轭梯度（Scale Conjugate Gradient）”学习算法进行小麦预测。该模型训练了 200 个轮次（epochs）。\n\n\
  ### 7.3.3.3 逻辑回归\n\nLR 是监督学习下的一个机器学习模型，用于从一组自变量预测分类因变量的目标值。它是一种基于概率概念的预测分析技术。当目标值具有两个以上的顺序类别时，称为序逻辑回归或多分类逻辑回归。对于序逻辑回归，输出标签（类别）具有\
  \ N 个类别，每个类别表示为范围 1 到 N 之间的整数。使用“softmax”函数计算所有分类变量的分，并使用多数投票技术选择最终输出类别。\n\n对于当前的工作，通过\
  \ `mnrfit` 函数通过 10 折交叉验证应用了序逻辑回归，因为输出标签有三个类别。\n\n### 7.3.3.4 朴素贝叶斯\n\n\n\n\nNB（朴素贝斯）是机器学习中有效的归纳方法之一。该算法反映了基于贝叶斯定理的概率学习方法，其原理是条件独立假设，即待分类的每对特征之间都是独立的，且每个特征具有相同的权重。因此，每个参数独立地对最终结果做出贡献。从数学上讲，贝叶斯定理可以表示为：\n\
  \n(7.4)![equation](img/c7-disp-0004.png)\n\n其中 `T` 代表输出变量，`P(T)` 指先验概率，`P(S/T)`\
  \ 指条件概率或似然比，`P(T/S)` 指 `S` 的后验概率，`S` 代表具有 `n` 个特征的输入特征向量，表示为：`S = (s[1], s[2], s[3],\
  \ … , s[n])`。\n\n因此，分子部分具有特殊之处，考虑到分母部分不依赖于类别标签且提供了特征值，目标是使分母成为足够的常数。分子部分遵循联合概率模型的概念。NB\
  \ 算法分两步对数据分类：训练步骤：此步使用训练数据估计概率分布的参数，假设预测器在给定类别的情况下是条件独立的；测试步骤：对于新实例，此步计算该样本每个类别的后验概率；然后用最高后验概率对测试数据进行分类。在这项工作中，NB\
  \ 引入了“高斯”函数和“经验”先验概率。\n\n### 7.3.3.5 支持向量机\n\n这是一种应用于分类和回归问题的监督方法，基于结构风险最小化。它寻找一个最优的\
  \ N 维超平面，将数据划分为两类。该最优超平面试图最大化独立类别之间最近观测点之间的间隔（margin），为正类和负类创建边界。它可以被视为一种线性判别方法，在学习模型过程中试图优化类与间间距。该超平面可以用线性方程表示为：\n\
  \n(7.5)![equation](img/c7-disp-0005.png)\n\n其中 `a` 指数据点，`w` 是一个 `N`-维系数向量，定义了垂直于平面的正交向量，`b`\
  \ 指距离原点的偏移。\n\n在线性 SVM 的情况下，当最近的点属于一类时，`f(a)≥ 0`；当最近的点属于另一类时，`f(a)≤ 0`。\n\n分类问题的标准\
  \ SVM 方法表示为：\n\n(7.6)![equation](img/c7-disp-0006.png)(7.7)![equation](img/c7-disp-0007.png)\n\
  \n其中 `S` 表示训练向量，`T` 是与训练向量相关的标签，`x` 表示分类器超平面的参数向量。`K(S, T)` 指等于 `[ϕ(S[i]), ϕ(T[i])]`\
  \ 的核函数，其中 `ϕ(S)` 是输入向量到核空间的映射，用于计算训练向量 `S[i]` 和 `T[i]` 之间的距离，`C` 是控制误分类率的惩罚参数。\n\
  \nSVM 应用了纠错输出代码（ECOC），由于输出是多类别的，使用了“一对一”编码，通过十折交叉验证和核函数应用了 SVM。\n\n### 7.3.3.6 判别分析\n\
  \nLDA 代表了一种简单高效的分类技术，基于以下假设：每个属性都从高斯分布中得出且每个属性具有相同的方差。它计算每个类别的均值和方差。该方法可用于二分类和多分类问题。在这项研究中，LDA\
  \ 通过十折交叉验证应用了其“经验”概率以得出预测。\n\n## 7.4. 实验结果与分析\n\n本研究提供了一种基于特征选择的机器学习模型用于小麦产预测。根据实验结果，所提出的混合方法可以用于预测产量。通过准确率、召回率、精确率和\
  \ Kappa 系数验证了这些机器学习方法的性能，并解决了不平衡数据集的问题。这些指标计算如下：\n\n-   `tp[i]`：正类的真正样本数\n-   `tn[i]`：负类的真负样本数\n\
  -   `fp[i]`：负类的假正样本数\n-   `fn[i]`：正类的假负样本数\n-   `N`：总样本数\n-   `P[i]`：预测概率\n-   `T[i]`：类别的真实值\n\
  \n(7.8)![equation](img/c7-disp-0008.png)(7.9)![equation](img/c7-disp-0009.png)(7.10)![equation](img/c7-disp-0010.png)(7.11)![equation](img/c7-disp-0011.png)(7.12)![equation](img/c7-disp-0012.png)\n\
  \nTable 7.4 反映了机器学习方法对小麦产量的实验结果，可以用于预测。然而，这些技术面临高假正率和高假负率的问题。在这些机器学习方法中，LR 和 LDA\
  \ 达到了 95.5% 的准确率。前者召回率为 81.18%，精确率为 82.53%，Kappa 系数为 0.885；而后者获得的召回率为 84.98%，精确率为\
  \ 84.32%，Kappa 系数为 0.884。NB 预测的准确率最低为 87.6%，Kappa 系数分别为 0.7202 和 0.713。因此，需要改进机器学习的性能。作者建议通过结合两种算法策略的混合方法。\n\
  \nTable 7.5 展示了每个混合模型对小麦产量的实验结果。在所有实现的模型中，GA-KNN 的预测结果最好，准确率为 98.3%，召回率为 94.32%，精确率为\
  \ 93.41%，F 分数为 0.9386，Kappa 系数为 0.957。这些结果优于传统的 LR 和 LDA 方法。\n\n\n\n\n| 方法 | 算法\
  \ | 混合模型 | 准确率 | 精准率 | 召回率 | F-score | Kappa |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| M[1] | `ReliefF Algorithm` | `KNN` | `RF-KNN` | 98%\
  \ | 93.39% | 94.14% | 0.9376 | 0.949 |\n| M[2] | `SVM` | `RF-SVM` | 95.3% | 75.30%\
  \ | 82.40% | 0.7869 | 0.88 |\n| M3 | `LR` | `RF-LR` | 94.9% | 71.48% | 78.46% |\
  \ 0.7481 | 0.869 |\n| M4 | `ANN` | `RF-ANN` | 97.1% | 91.99% | 89.21% | 0.9058 |\
  \ 0.928 |\n| M5 | `LDA` | `RF-LDA` | 91.4% | 72.18% | 82.06% | 0.7681 | 0.763 |\n\
  | M6 | `NB` | `RF-NB` | 85.9% | 65.64% | 68.61% | 0.6709 | 0.662 |\n| M7 | `Genetic\
  \ Algorithm` | `KNN` | `GA-KNN` | 98.3% | 94.32% | 93.41% | 0.9386 | 0.957 |\n|\
  \ M8 | `SVM` | `GA-SVM` | 96.2% | 80.78% | 84.87% | 0.8277 | 0.903 |\n| M9 | `LR`\
  \ | `GA-LR` | 96% | 79.09% | 82.81% | 0.8091 | 0.897 |\n| M10 | `ANN` | `GA-ANN`\
  \ | 97.2% | 93.62% | 89.11% | 0.9131 | 0.921 |\n| M11 | `LDA` | `GA-LDA` | 96.6%\
  \ | 84.56% | 85.89% | 0.8522 | 0.913 |\n| M12 | `NB` | `GA-NB` | 89.3% | 75.48%\
  \ | 79.43% | 0.7741 | 0.75 |\n\n几乎所有的混合模型都比其相应的传统方法获得了结果。基于 `RF` 的混合方法提升了标准 `KNN`、`SVM`\
  \ 和 `ANN` 在小麦产量预测中的性能；但它降低了其他机器学习技术的性能。在某些情况下，像 `RF-SVM`、`RF-LDA` 和 `RF-LR` 等混合模型的准确率超过了\
  \ 90%，但这些方法预测的召回率分别为 75.30%、72.18% 和 71.48%。因此，基于 `RF` 的混合模型存在更多假阴性情况。这可能是因为 `RF`\
  \ 方法在特征子集中选出的所有特征对小麦产量的预测并非贡献最大。基于 `GA` 的混合方法对所有传统机器学习技术都取得了更好的结果。它提高了本研究中所有用于产量预测的机器学习算法的准确率。`KNN`、`SVM`、`LR`、`ANN`、`LDA`\
  \ 和 `NB` 的准确率分别从 94.1%、92.4%、95.5%、94.7%、95.5% 和 87.6% 提高到了 98.3%、96.2%、96%、97.2%、96.6%\
  \ 和 89.3%。基于 `GA` 的 `NB` 方法也遇到了假阴性和假阳性情况；但这些情况远少于传统的 `NB`。基于 `GA` 的混合方法实现的 `F-score`\
  \ 和 `Kappa` 值大于其相应的传统机器学习方法。因此，基于 `GA` 的混合方法已被证明能够提高所有机器学习技术的效率。\n\n[图 7.4] 到 [7.9]\
