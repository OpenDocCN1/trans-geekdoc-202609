  \ [48]。目前，大多数教育机构已将区块链作为课程的一部分，并将其用于学位管理 [49, 50]。\n\n### 4.2.6 5G\n\n\n\n\n\n5G\
  \ 网络是第五代移动网络，是蜂窝移动通信技术的现代代。它能比旧的移动网络更高效地传输数据，提供高高速、大带宽和低延迟。这项技术在现代移动操作系统中提供了惊人的数据能力和无限的数据传输能力\
  \ [55, 56]。这将伴随着自动驾驶汽车、智能设备、远程医疗和 `IoT` 的发展。车联网 (`IoV`) 和智能设备已成为 5G 网络的关键方面 [57]。在\
  \ 5G 时代，人工智能、自动化和用于故障排除的增强现实是制造公司将其普通工厂转换为智能工厂、转型生产并增加销售的首要因素 [58]。这种新技术还通过为医疗人员提供集成移动性和先进连接，惠及了医疗领域，使其能够随时随地监控患者。5G\
  \ 技术允许患者使用可穿戴设备随时向医生汇报健康状况。医生利用 5G 网络最快的带宽，坐在一端到另一端进行手术。在中国，外科医生通过离线手术机器人并实时操作完成了此类手术\
  \ [59]。5G 允许机器人用于医疗目的，在 COVID-19 疫情期间可以提供药物、监测患者体温并消毒医院房间，从而最大限度地减少了医护人员与病毒的接触。Ava\
  \ Robotics 创建的 `iRobot` 专门为医疗用途设计，帮助医疗工作人员在不受到感染威胁的情况下处理居家隔离的人员 [60]。\n\n## 4.3.\
  \ 数字化转型面临的挑战\n\n![图 4.2 数字技术的挑战。](img/c04-fig-0002.jpg)\n\n图 4.2 数字技术的挑战。\n\n新冠-19\
  \ 疫情由于维持社交距离和全球封锁的标准，导致数字技术利用率了不可避免的剧增。个人的生活已经改变，必须适应新的转型方式以生存。以下是疫情期间所面临的挑战，如图\
  \ 4.2 所示。\n\n### 4.3.1 数字化程度的提高\n\n数字化就像身体里的心脏。为了将组织转换为数字平台，正在使用许多数字技术，如 `Blockchain`、`IoT`、`cloud`、`AI`、`5G`\
  \ 等。这需要对扩展带宽、使用的技术、网络设备、智能设备等进行投入巨资，因为这是生存的迫切需求，而不是一种例外。员工已经接受了在线工作的文化，学生习惯于通过 `Zoom`\
  \ 和 `Google Meet` 等数字平台进行在线学习，业务组织开始通过视频会议和 `Skype` 召开会议，客户也开始遵循数字化交易以实现数字化。各公司正利用这些技术变革来适应现状\
  \ [61–63]。\n\n### 4.3.2 居家办公文化\n\n零工工作者是独立的在线平台工作者，根据公司的需求临时工作，为客户或顾客提供服务。当全球全面关闭时，这些零工工作者是最大的损失者，因为他们的服务停止了，生存非常困难\
