  \n## Note\n\n1. **#*通讯作者*: debnathb@gmail.com\n\n# 3\n\n基于深度学习技术结合灰度共现矩阵的肝癌分类\n\n\
  **Debnath Bhattacharyya¹\\*, E. Stephen Neal Joshua² and N. Thirupathi Rao²**\n\n\
  *¹ 计算机科学与工程系，Koneru Lakshmaiah Education Foundation, Vaddeswaram, Guntur, Andhra\
  \ Pradesh, 印度*\n\n*² 计算机科学与工程系，Vignan’s Institute of Information Technology, Visakhapatnam,\
  \ AP, 印度*\n\n> ### 摘要\n\n> 肝癌是世界上常见的死因。为了发现肝癌，你需要弄医学图像的含义，使用带分水变换的自适应阈值法使肝脏从身体其他部分脱颖而出。优化策略和群体优化模型是分离肝脏恶性区域的一些方法。数据包含了来自不同类型肝癌患者的\
  \ 225 张图像。为了构建一个大型数据集，使用了灰度级矩阵、局部二值模式（Local Binary Pattern）来寻找重要特征。然后使用神经网络、支持向量机、随机森林和深度神经网络分类器将其分为不同类型的癌症。这些包括血管瘤、肝细胞癌。建议的方法根据其敏感性、特异性、准确率和\
  \ Jaccard 指数进行了评估。使用基于分水岭的深度学习算法的人发现，它们可以用于诊断肝癌。发现 DNN 分类器效果最好，在 300 个 epoch 中，准确率达到\
  \ 99.25%，Jaccard 指数为 0.97，验证损失低为准确率的 65.73%。\n\n> **关键词：** 机器学习，深度学习，癌症分类，SVM，随机森林，深度神经网络\n\
