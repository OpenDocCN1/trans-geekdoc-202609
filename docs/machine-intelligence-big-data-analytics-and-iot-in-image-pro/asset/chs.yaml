  \ 41, 12, 1381–1391, 2016.\n\n## 7 用于小麦预测的基于机器学习的混合模型\n\nHaneet Kour¹, Vaishali\
  \ Pandith¹, Jatinder Man² and Vinod Sharma¹\n¹ 查穆米大学计算机科学与 IT 系，印度\n² 查穆米大学 Bhaderwah\
  \ 校区计算机科学与 IT 系\n\n## 摘要\n\n机器学习（`ML`）方法在解决现实世界问题方面具有重要意义。这些方法已应用于农业领域，帮助农民预测作物产量、检测作物疾病并执行其他任务。本文介绍了一种用于小麦产量预测的混合模型，该模型将特征选择与\
  \ `ML` 技术相结合。所提出的混合模型包含两个阶段：第一阶段使用特征选择策略寻找小麦的最佳特征，第二阶段使用 `ML` 根据这些最佳特征估计作物产量。在研究中，通过整合两种特征选择技术（每种技术结合六种\
  \ `ML` 技术），实现了 12 种不同的混合模型，以确定小麦产量预测的最佳混合技术。应用的特征选择技术为遗传算法（`GA`）和 `ReliefF` 算法，而使用的\
  \ `ML` 方法包括 K 近邻（`KNN`）、朴素贝叶斯、人工神经网络、逻辑回归、支持向量机和线性判别分析。使用五个性能指标——准确率、召回率、精确率、F 值和\
  \ Kappa 系数评估这些混合模型的性能。在实现的 12 种混合方法中，`GA-KNN` 模型性能最优，准确率达到 98.3%。\n\n关键词：作物产量、特征选择、机器学习、土壤、小麦\n\
  \n## 7.1 引言\n\n农业是任何国家经济中至关重要的部分。人口增长、自然资源枯竭和环境变化等各种挑战对农业结构在提高作物产量和质量方面提出了更高要求。因此，农业正在整合数字技术以增加作物产量的同时度地减少对环境的影响。它还利用传感器收集土壤、作物和环境的数据，以便更好地理解如何提高作物生产。机器学习（`ML`）技术已证明是农业行业执行各项任务的宝贵工具，包括杂草识别、作物识别、土壤管理等。这些方法为农民和农业专家解决面临的各种问题提供了成本效益高的解决方案。此外，研究人员还实现了\
  \ `ML` 技术来辅助作物产量预测。\n\n作物产量预测是精准农业中的一项重要任务，涵盖产量图和估计以及作物供需匹配。它可以帮助农民根据市场需求，预先对何时以及种植什么作物做出决策。这对于全球的粮食生产具有巨大的帮助，因为它允许快速做出进出口决策。包括大气、降水、土壤类型、肥料、温度和作物基因状在内的若干因素都会影响作物产量。因此，需要深入了解这些参数与产量之间的相关性。\n\
  \n## Note\n\n- 通讯作者：`debnathb@gmail.com`\n\n\n\n\n当前研究通过拼接混合模型对小麦产量进行预测。特征选择识别了小麦产量的低、中、高特征。为了预测小麦产量，该研究实施了基于遗传算法（`GA`）和随机森林（`RF`）的特征选择。使用了朴素贝斯（`NB`）、k-最近邻（`KNN`）、支持向量机（`SVM`）、人工神经网络（`ANN`）、逻辑回归（`LR`）和判别分析（`LDA`）等机器学习方法。\n\
