  \ 5. 使用深度学习进行植物病害检测\n\n**Sangeeta V¹, Appala S. Muttipati²\\* 与 Brahmaji Godi³**\n\
  \n¹ Anil Neukonda 技术学院，计算机科学与工程系，维沙卡帕特德，安得拉拉邦\n² iNurture Education Solutions 有限公司，班加罗尔\n\
  ³ Raghu 学院，计算机科学与工程系，维沙卡帕特德，安得拉拉邦\n\n> ### 摘要\n> 植物病害是印度等发展中国家的主要威胁，农业在经济中起着重要或关键的作用。对疾病的早期预测减少了粮食安全风险。植物的生物检查或专家人工检查成本高昂。这为实施计算机方法进行检测并建议农药铺平了道路。图像处理和计算机视觉等最新技术通过深度学习（DL）促进了早期检测。DL\
  \ 技术利用卷积神经网络和残差神经网络架构，适用于早期检测。该模型使用 7000 张健康和异常植物图像进行开发。结果令人鼓舞，准确率达到 95%。\n>\n>\
  \ **关键词：** 植物叶片、病害、卷积神经网络、残差网络\n\n## 5.1. 引言\n\n印度等依赖农业的国家，需要转向使用现代技术来生产充足且高质量的食物。尽管如此，粮食安全仍然面临威胁，并受到许多因素的影响。由于某些气候条件，植物受到真菌、细菌和病毒的影响。\n\
  \n植物病害在粮食安全中起着主要作用，对小农户构成威胁。早期发现和定期监测在降低成本和生产健康食品方面发挥了关键作用。\n\n现有的疾病识别方法包括专业的简单的肉眼检查，这允许进行诊断和检测。这需要大量的专家以及持续的植物监测，两者成本都很高。同时，农民设施有限，甚至不知道如何联系专家。因此，咨询专家既昂贵又耗时。所提技术在大面积农田监测中非常有效。\n\
  \n通过观察叶片症状自动识别疾病更廉价、快捷。肉眼检测植物疾病是一项耗时且错误的操作，只能在特定环境下进行。另一方面，自动检测涉及的工作较少，投入精力最小，并提高了准确性。\n\
  \n\n\n\n将视觉内容划分或分组为各种楔形的方法被称为图像分割。肖像分割可以通过多种方式实现，从基础阈值法到复杂的彩色图像分割方法应有尽。这些组件通常伴随着人类可以轻易辨别并视作独立个体的任何物体。尽管机器具备了智能理解对象的能力，但已经开发出几种不同的画面细分方法。分割过程基于图像的许多属性，这可能是颜色数据、图像轮廓，或图像的区域\
  \ [9]]。\n\n因此，作者们正在实施图像处理和计算机视觉等前沿技术。为了提高产量和吞吐量，引入了许多高效益的程序。引入了多种技术来确定植物疾病。`Residual\
  \ Neural Network`（`ResNet 152`）用于特征提取，并使用 `softmax` 对植物是否患病进行分类。\n\n剩余内容组织成若干章节，其中第\
  \ 5.2 节涉及各种植物叶片疾病，第 5.3 节包含背景知识，第 5.4 节为 `ResNet 512 V2` 架构，第 5.5 节介绍了一种用于检测植物叶片疾病的方法论，第\
  \ 5.6 节处理结果分析，最后一节对工作进行了总结。\n\n## 5.2. 植物叶片疾病\n\n植物感染和疾病是生态系统的重要组成部分，但植物病学研究严重倾向于农业和林业。大多数植物病学研究集中在两类疾病：传统和主动控制的疾病，以及了解较少的疾病\
  \ [1]。植物疾病的发生受到多种环境的影响，包括病原体进入新区域。在缺乏经验的情况下，病原体的生物学和生态学可能难以预测。\n\n现有信息对于开发根除方法、隔离步骤和管理计划至关重要，但必须在短时间内适应新环境才能有效。虽然学术研究人员经常面临应对日益增长的流行病的技术挑战，但新疾病增加初期的发生情况很大程度上受到传统社会、经济状况的影响。重要的决定，例如是否以及实施根除行动以及如何执行，必须快速且果断地做出，并且可能无法完全得到科学证据的支持。对于研究得更深入的疾病，结合多个领域信息的研究导致了疾病特异性控制技术的发展\
  \ [1, 2]。\n\n这些是植物疾病的一些主要原因，它们被细分为真菌性、细菌性和病毒性疾病 [1, 3]，这些疾病影响植物发育生命周期中各个阶段的生长。植物疾病的分类见图\
  \ 5.1。这些疾病是由强降雨、降雪以及大气中发生的突然环境变化引起的，这些变化影响了植物生命 [10]。\n\n![图 5.1 植物叶片疾病分类。](img/c05-fig-0001.jpg)\n\
  \n图 5.1 植物叶片疾病分类。\n\n1. **早疫**：真菌引起早疫病。真菌在西茄植物上引起早疫病。在潮湿的天气下，真菌会产生圆斑，最终导致植物枯萎并死亡。\n\
  \n2. **黑斑病**：真菌在玫瑰和其他果实上引起黑斑病。这种疾病会使植物变黄。在凉爽潮湿的天气下，真菌会在叶片和茎上产生同心圆纹。\n\n3. **锈病**：真菌在植物上产生易于识别的锈斑斑点。锈病是另一种易于识别的真菌疾病，在叶片和茎上产生锈斑斑点。锈病的预防和治疗通常采用相同的技术。\n\
  \n4. **叶斑病**：病原体和真菌引起的两种形式的叶斑病。这种疾病损害了番茄、辣椒和生菜等作物。植物的生产力和生长经常受到抑制。\n\n5. **大尔疫病**：大尔疫病是一种真菌，损害了树木、灌木和食用植物。病原体可以在土壤中存在多年，进入植物维管系统，导致枝条枯萎，叶片变黄。\n\
  \n6. **雪霉**：雪霉是一种真菌，在雪下的寒冷潮湿条件下生长。在雪融化后，症状为浅棕色斑点。\n\n7. **尖孢菌病**：由土壤真菌引起的尖孢菌病影响了豆类、番茄和豌豆等植物中毒。叶片枯萎、植物矮小以及根腐烂和茎腐变色都是这种疾病的迹象。它在炎热的夏季非常活跃。\n\
  \n8. **猝病**：由多种土壤真菌引起的猝病在多雨潮湿的环境下尤为棘手。它感染幼苗，使其枯萎死亡。它在温室内很常见，但在室外也可以发现。\n\n9. **马斑病毒**：马斑病毒有多种形式，但园丁最可能遇到两种主要的病毒，如番茄马斑病毒和烟草马斑病毒。番茄、辣椒、土豆、苹果、梨和樱桃会被前者感染；黄瓜、番茄、甜菜、辣椒、生菜、牵牛和烟草会被后者感染。马斑病毒导致叶片出现黄色斑点，有时会扭曲和变形。\n\
  \n10. **炭病**：炭病在植物部、叶片或果实上产生黑色水渍斑。在潮湿温暖的天气下，这些病变的中心通常覆盖着粉红色的胶状孢子。在短短几天内，炭病可能会让丰收的收成变成腐烂的垃圾。\n\
  \n\n\n\n\n12. **霜霉病**：许多植物受此影响，该病表现为老叶片正面的黄色至白色斑块。这些斑块的背面覆盖着白色至灰白色的棉花状真菌。这些“霜霉”状斑块在下雨或大露水后最为明显，一旦阳光回归它们就会消失。即使植物水分充足，随着疾病的扩散，叶片也可能变得枯脆褐色并掉落。它主要影响十字花科作物和花菜作物。\n\
  \n13. **溃疡**：通常用真菌或细菌感染的开放性伤口来诊断溃疡。有些溃疡是无害的，而另一些是致命的。溃疡主要出现在木本景观植物上。茎部、枝干或树干可能出现凹陷、膨胀、裂纹、死亡等症状。溃疡可能会环绕并杀死叶片。溃疡出现在受寒冷、虫害、干旱、营养不平衡或根腐损害的压力植物中。感染还可能通过齿齿传播。\n\
  \n## 5.3. 背景知识\n\nSaharan *et al.* [1] 利用基因概念创建了抗病植物。他利用转化技术转移了用于创建抗病植物的有用基因。他在转基因作物创造上取得了巨大成功。他证明了基因工程植物对病毒、真菌和细菌病体具有更好的韧性。农民从植物转基因技术中受益更多。这为全球农业食品工业提供了巨大的支持。作者需要更多投入以在功能基因学学获得高吞吐量。功能基因组学有助于改进植物的疾病管理。\n\
  \nHassan *et al.* [12] 建议并证明了深度卷积神经网络（`CNN`）可以提高植物产量并及时或早期识别作物疾病，因为 `CNN` 在机器视觉领域获得最佳结果方面证明了其重要性。基础\
  \ `CNN` 模型涉及极高的计算成本，并且需要更多的参数处理。作者证明深度可分离卷积将减少参数数量，反而降低计算成本。他们使用了开放数据集训练的模型，该数据集包含\
  \ 14 种不同的植物、38 种不同的分类疾病类别和健康叶片 [11]。他通过考虑不同的参数和每个 epoch 需要的时间来评估其模型的性能。他实现了 99.56%\
  \ 的准确率，并使用了数据集的不同表示形式。他观察到，与灰度分段数据集相比，分段彩色图像数据集的表现更优。\n\nMohanty *et al.* [13] 在植物疾病识别中使用两种不同的架构，即\
  \ `AlexNet` 和 `GoogleNet`。`AlexNet` 架构使用了与现有 `LeNet-5` 架构相似的设计模式。它利用了更多的卷积层，随后跟有一个或多个全连接层。它还可以可选地在卷积层之后使用归一化层和池化层。这些层通常与\
  \ `ReLu` 激活函数相关。它使用了五个卷积层，其中前两层被称为 `conv{1,2}`，随后是归一化层和池化层。网络以 `softmax` 层结束。`softmax`\
  \ 层接收来自 `fc8`（全连接 8 层）的馈，具有 38 个输出。最后，`softmax` 层归一化输入并以 0.5 的丢弃率获取所需的输出。根据 `GoogleNet`\
  \ 架构，相比 `AlexNet` 架构更宽更深。与 `AlexNet` 相比它使用了 22 层且参数较少。`GoogleNet` 架构使用了“网络中网络”架构。第一个模块对一、三、五层使用并行卷积，以及一个最大池化层。这使得架构能够捕捉不同的特征，这在以前是不可能的，因为架构的最后一步使用滤波器拼接层来连接所有这些并行层的输出。\n\
  \nJun Liu 和 Xuewei Wang [14] 对植物病害害虫检测的传统方法与当前方法的对比进行了综述。当前方法使用了深度学习技术。作者概述了利用深度学习检测植物疾病的研究，使用了三个网络（分类网络、检测网络和分割网络）。在他的文献中，他总结了每种方法的优缺点。他使用一个名为\
  \ `Faster R-CNN` 的两阶段检测网络来获取特征图。然后，作为第二阶段，他计算了锚框（anchor box）置信度。锚框置信度是使用 `RPN` 计算的。它使用了\
  \ `ROI pooling` 和损失函数。基于对各种方法的比较研究，他识别了实际实施中可能面临的挑战。两阶段检测网络提高了检测系统的实时性和实用。作为结论，作者对面对实际实施的挑战给出了各种建议。\n\
  \nWei Wang *et al.* [15] 提供了一种在复杂环境中有效预防植物疾病的方法。随着数字化和智能农业的发展，植物病害检测也实现了数字化。这有助于实现先进的决策、智能分析和恰当的规划。作者使用了数学模型来提高准确率和训练效率。在实施的第一步，使用\
  \ `RPN` 识别叶片的受病部分。然后，它使用 `Chan-Vese algorithm` 进行图像分割。最后一步是将分割的叶片输入到迁移学习以训练模型。最终模型通过各种疾病进行了测试。作者显示的\
  \ 83.57% 准确率优于最终方法。尽管该模型在复杂环境中表现良好，但 `Chan-Vese algorithm` 的计算使得该模型运行时间较长，这为改进铺平了道路。\n\
  \nShah *et al.* [16] 提出了一种新模型 `ResTS`（残差教师/学生），用于提高检测植物疾病的性能。该模型为食品安全提供了保障。作者通过使用残差连接和执行批量归一化改进了教师/学生模型。`ResTS`\
  \ 网络由三个部分组成，即教师、解码器和学生。在模型过拟合时使用了 `VGG16`。`ResTS` 的输出是精确的，优于以往的方法。\n\n## 5.4. ResNet\
  \ 512 架构\n\n具有数百层卷积的 `CNN` 为 `ResNet` [17]。以前的架构限制了附加层的效率。`ResNet` 具有大量的层且速度极快。`ResNet\
  \ V2` 与创新的 (V1) 之间的主要区别是 `V2` 在添加每个权重层之前应用批量归一化。图 5.2 描述了残差网络 152 版本 2。\n\n![图 5.2\
  \ ResNet 152 V2 架构。](img/c05-fig-0002.jpg)\n\n**图 5.2** ResNet 152 V2 架构。\n\n###\
  \ 5.4.1 残差网络的工作原理\n\n\n\n\n\n何恺明和张祥宇于 2015 年发明了 ResNet [20]。这是一种用于图像识别的深度残差学习神经网络\
  \ [17, 20]]。为了解决复杂问题，通常会在深度神经网络中堆叠一些额外的层，以提高准确性和表现能力。增加更多层的目的是让它们随着时间的推移学习到更复杂的特征。跳跃连接有两种类型。数据集中包含了许多\
  \ 224*224 像素分辨率的植物叶片图像：\n\n1. 如果输入和输出维度相同，可以直接使用恒等简写 `x` [30]]。\n\n   (5.1)![equation](img/c5-disp-0001.png)\n\
  \n   当残差块函数的输入和输出维度不同时使用它。\n\n2. 当维度发生时，残差连接必须重新计算。快捷径仍用于恒等映射，但使用较大的维度来填充缺失的零。投影快捷径用于匹配维度（通过\
  \ `1*1` 卷积完成）。\n\n   (5.2)![equation](img/c5-disp-0002.png)\n\n   公式 (5.2) 是因为残差块函数的输入和输出维度不同。图\
  \ 5.3 描绘了残差学习过程 [13]]。\n\n![图 5.3 残差学习过程。](img/c05-fig-0003.jpg)\n\n图 5.3 残差学习过程。\n\
  \n## 5.5. 方法论\n\n该框架被分为两个阶段，如图 5.4 所示。第一阶段是图像预处理。在预处理中完成了图像缩放、数据增强、数据归一化和数据划分。第二阶段是特征提取和图像分类，ResNet\
  \ 用于特征提取，利用 softmax 分类器进行分类 [17]]。\n\n### 5.5.1 图像缩放\n\n由于训练数据集中的图像大小不一，它们在作为模型输入之前必须进行缩放。图像被缩放到\
  \ 256 像素的正方形。矩形照片的短边被缩小到 256 像素，然后从中心裁剪出 256 X 256 的正方形。\n\n之后，通过减去平均像素值使每个像素居中。这是按通道进行的，这意味着平均像素值是从训练集中计算的，彩色图像的红、绿、蓝通道各计算一个\
  \ [21]]。\n\n### 5.5.2 数据增强\n\n数据增强方法生成了实际数据集的许多类别，通过处理使其变大。ML 模型可以从数据增强策略中受益。一个实验表明，与没有增强的模型相比，具有数据增强的深度学习模型结果更好。使用准确率、训练损失（也称为错误预测的惩罚）和验证等各种指标用于图像分类。图像增强是一种改变现有照片以供模型训练提供更多数据的技术\
  \ [18]]。\n\n![图 5.4 检测健康叶片或不健康叶片的建议方法。](img/c05-fig-0004.jpg)\n\n图 5.4 检测健康叶片或不健康叶片的建议方法。\n\
  \n### 5.5.2.1 数据增强的类型\n\n图像旋转：无论如何旋转，图像的信息保持不变。\n\n图像平移：改变照片允许我们自定义图像中物体的位置，为框架提供更多变体。这最终可能在一个更通用的框架中发生。\n\
  \n图像翻转：旋转可以被视为翻转的扩展。它允许我们左右以及上下翻转图像。\n\n图像噪声：通过向图像中添加噪声来产生图像噪声。模型可以通过数据增强学习区分图像中的信号与杂质，从而使设计的模型对图像调整具有更大的韧性。\n\
  \n图像模糊：由于素材源于各种根，它们的质量各异。有些图像非常出色，而另一些不是。在这种情况下，原始图像可能会被修改，使得系统对测试集中使用的图像质量更健壮。\n\
  \n### 5.5.3 数据归一化\n\n归一化是一种在准备数据时确保所有像素值具有相同平均值和标准差的技术。这允许模型学习得更快。在本章中，讨论了各种归一化方法并在图\
  \ 5.5 中展示。AlexNet 中 fc 层的权重被分类并重新初始化，这可以用于 DL 模型 [18, 22]]。\n\n![图 5.5 数据归一化。](img/c05-fig-0005.jpg)\n\
  \n图 5.5 数据归一化。\n\n在 DL 模型中，有几种可以应用的归一化方法。列表如下：\n\n1. 批量归一化（Batch Normalization）是\
  \ DL 训练中最常用的归一化程序之一。它通过稳定层输入的分布，允许深度神经网络更快速、稳定的训练。内部协方差移（Internal covariate shift）是该方法的关键组件。每当提到内部协方差移，是指在前层更新后层输入的分布就会发生变化。必须压缩内部协方差移以改进模型的训练。通过添加限制层输入均值和方差的网络层，批量归一化减少了内部协方差移\
  \ [16, 18]]。\n\n2. 权重归一化（Weight normalization）是一种对深度神经网络权重进行重参数化的技术，通过解耦权重长度和方向来实现。根据作者观点，权重归一化是优化神经网络权重的技术\
  \ [18]]。\n\n3. 层归一化（Layer normalization）是一种用于加速各种神经网络模型学习速度的技术。与批量归一化不同，这种方法实时从隐藏层神经元的累积输入中计算归一化事实。层归一化的创建是为了克服批量归一化的缺点，例如对小批的依赖。\n\
  \n4. 作为批量归一化的替代方案，可以描述为组归一化（Group normalization）。该方法将通道分为组，并在每个组内计算归一化（即对每个组内的函数进行归一化）[23]]。与批量归一化不同，组归一化不受批量大小的影响，其正确性在宽泛范围内保持一致。\n\
  \n5. 实例归一化（Instance normalization），也被称为评估归一化，与层归一化非常相似。与批量归一化不同，例如，归一化应用于整个批次图像而不是单个图像\
  \ [24]]。\n\n### 5.5.4 数据划分\n\n在 ML 中，数据是解决任何问题的最重要的因素。没有准确数据的 ML 模型就像没有灵魂的躯体。仅仅向\
  \ ML 模型提供大量数据是不够的，还必须确保高质量的数据以获得准确的结果 [25]]。\n\n\n\n\n\nDL/ML 专家面临的最大困难是划分用于训练和测试的数据。如果数据集在划分为训练集和测试集时划分不当，可能会导致模型出现意想不到的行为\
  \ [26]。这可能导致模型对给定数据产生过拟合或欠拟合，最终导致偏差的结果。数据集通常被分为三部分，即 `train`、`test` 和 `dev` 集（开发集）。`dev`\
  \ 集也称为留出交叉验证集。让我们现在了解这些集合的作用：\n\n1. **训练集 (Train Set)**：该部分作为模型的输入，模型需要从该输入划分中学习。\n\
  2. **留出交叉验证集 (Holdout Cross-validation set)**：使用该集合对模型进行验证，以测试其训练是否适当。如果导致高方差，则认为模型过拟合。高方差可能是训练集与留出交叉验证集之间的误差巨大。\n\
  3. **测试集 (Test Set)**：使用该集合对开发的模型进行测试。它能清晰地展示开发模型在预测某些内容时的优劣。它利用不同的性能指标进行预测。\n\n\
  最受争议的问题之一是训练、开发和测试集的大小。尽管 80:10:10 的训练、交叉验证、测试集比例适用于基础机器学习任务，但在今天的大数据环境下，数据集的 20%\
  \ 就是一个巨大的数据集。这些数据很容易用于训练，允许模型学习更复杂的属性。\n\n## 5.6 结果分析\n\n该模型的第一步是数据收集，第二步是数据预处理，第三步是特征提取，最后是从图像进行疾病检测。\n\
  \n### 5.6.1 数据收集\n\n数据集中包含若干分辨率为 224*224 像素的植物叶片图像。收集包含了各种疾病植物的叶图像。照片 [27] 用于分类健康和不健康的处理叶片。对于上述作物，从多种来源获取全面的叶片信息。Kaggle\
  \ 数据集 [29] 是来源之一。照片通过互联网获取或简单地使用任何类相机设备拍摄。\n\n### 5.6.2 特征提取\n\n在根据许多层级和约束选择特征特性时，应该探索各个研究领域。这对系统性能和增长具有显著影响。由于每个连接都有其独特的架构，它们的共同目标是识别新疾病并确定其正确性复杂纠缠程度。单个对象指标将与模型的一些对象提取器相结合。数据集可以对特征提取、减少和选择程序进行处理，以便通过选择最重要的属性来降低其复杂性。显示有时会受到用于测试的数据集平衡比例的影响。任何不对称的数据集在进行分类之前都会使用混合方法进行平衡\
  \ [28]。\n\n### 5.6.3 植物叶片检测\n\n建议的实际实验在来自 Kaggle 集的 7,000 张植物叶片图像数据收集上运行 [29]。发现数据集包含\
  \ 7,000 张用于训练的数字图像、1,000 张用于测试的数字图像和 3,000 张用于验证的数字图像。实验在 `Windows` 操作系统中使用 `Python`\
  \ 3 版本开发。使用了已知包，即 `Numpy`、`Pandas`、`TensorFlow`、`Keras` 和 `matplotlib` 用于绘图。使用 `ResNet52`\
  \ 模型（如图 5.6 所示）训练图像。\n\n根据建议实验，测试中获得了 95% 的准确率，其中损失函数确保了 0.186，准确率模型在重复 197 ms 内确保了\
  \ 0.949。使用上述技术的植物疾病检测结果。5.7 和 5.8 显示了准确率和损失函数的支持图。\n\n![图 5.6 使用 ResNet52V2 获得的\
  \ 95% 准确率](img/c05-fig-0006)\n图 5.6 使用 `ResNet52V2` 获得的 95% 准确率。\n\n![图 5.7 模型损失准确率曲线](img/c05-fig-0007)\n\
  图 5.7 模型损失准确率曲线。\n\n![图 5.8 测试准确率曲线](img/c05-fig-0008)\n图 5.8 测试准确率曲线。\n\n## 5.7\
  \ 结论\n\n植物叶片检测有很多方法，许多研究正在进行中。但仍然没有合适的解决方案来检测所有类型的疾病。在这项工作中，一种实现 `ResNet` 架构的 DL\
  \ 方法旨在检测植物叶片上最常见的疾病，这是一个三步程序。第一步，拍摄并处理需要测试的植物叶片图像。在第二步，使用 `ResNet` 进行特征提取和图像分类，以分类叶片是健康还是还是。`CNN`\
  \ 强大的特征提取能力与现有模型相比，提供了 95% 的准确率，模型损失发生在 0.1861。DL 方法或 `ResNet` 优于传统方法，后者在疾病检测和害虫识别中有多个步骤。训练模型所需的时间远于其他机器学习方法。该模型可以扩展到植物图像的实时捕获并通过云端发送到实验室并立即接收结果。这种方法的设备成本更高，但农民不需要等待解决方案。尽管有许多研究在为农民建议合适的农药，但仍存在待解决的问题。\n\
