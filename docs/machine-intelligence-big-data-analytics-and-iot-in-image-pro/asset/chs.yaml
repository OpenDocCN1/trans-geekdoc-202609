  \n## 9.4 实验结果与讨论\n\n我们提出的模型在四个不同数据集的测试数据上进行了验证；其性能通过分类准确率、敏感性和特异性等多种指标进行衡量。还讨论了在应用预处理方法前后应用\
  \ `DT`、`NB` 和 `ANN` 算法获得的结果。在当今的进步时代，IoT 生态系统可以整合智能设备来收集传感器数据，并与机器学习算法相结合以获得更好的结果\
  \ [31-33]。在我们的研究工作中，实验是通过 rapid miner 工具包进行的。实施了三种用于预处理的技术，它们是分箱法（binning）、z-score\
  \ 和 `SMOTE` 方法。如本节所示，结果显示处理后的数据性能优于未处理的数据。三种机器学习算法（`DT`、`ANN` 和 `NB`）被应用于四个数据集，结果表明在预处理后，训练数据和测试数据在分类器上的性能更好。本节展示了不同数据集在预处理前后的早期性能流程。表\
  \ 9.6 展示了使用敏感性和特异性性能指标对所有四个数据集进行预处理前后的结果 [34]。在使用所应用的数据挖掘技术改进后，`DT` 的准确率提升了 12.79%，`NB`\
  \ 提升了 4.52%，`ANN` 提升了 9.54%。\n\n表 9.6 `DT`、`NB` 和 `ANN` 在四个不同数据集上预处理前后的性能。\n\n|\
  \ 应用的数据集 | 应用的分类器 | 预处理前 | 预处理后 |\n| :--- | :--- | :--- | :--- |\n| | 准确率 | 敏感性\
  \ | 特异性 | 准确率 | 敏感性 | 特异性 |\n| PIMA | `DT` | 82.39 | 60.21 | 82.73 | 97.62 | 97.62\
  \ | 95.35 |\n| | `NB` | 73.94 | 58.12 | 62.01 | 85.71 | 85.71 | 82.95 |\n| | `ANN`\
  \ | 76.06 | 57.07 | 66.87 | 93.81 | 93.81 | (缺失) |\n\n## 9.5 结论与未来工作\n\n数据预处理是在数据分析之前对数据进行的技术。这种分析过程的核心要素是数据。分析结果的性能或质量只能通过预处理的质量来提高。来自不同来源的基础数据可能存在格式冲突、冗属性以及未填充或空白数据。因此，在应用任何处理之前，需要对数据进行准备和预处理。在本研究中，实施了数据预处理技术，在四个不同的数据集上进行数据清洗、异常检测和类别平衡，以提高应用机器学习分类器的性能。还讨论了数据预处理方法的有效效果。结果显示，预处理方法在提高机器学习算法准确率方面表现出良好的改进。未来，我们打算通过结合所应用的预处理技术提出一种新的预处理方法，以获得更好的结果。\n\
