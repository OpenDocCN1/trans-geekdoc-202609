  \ | 0.0112 | 11 |\n| 11 | Mn (锰) | 0.0347 | 3 |\n\n\n\n\n\n当前的研究应用了随机森林（RF），将所有特征设置为预测器，并将类别（Class）属性作为响应变量。RF\
  \ 对每个特征预测的排名和权重如表 7.3 所示。图 7.2 展示了 Relief 算法预测的每个输入属性的权重。表 7.3 和图 7.2 表明，特征 5“磷”对小麦产量预测的贡献最大，而特征\
  \ 10“铜”贡献最小，因此磷元素对小麦产量有很大影响，而铜不影响小麦生产。在小麦数据集的十一个特征中，选择了贡献最大的五个特征，即“P, Fe, Mn, pH,\
