  \ *14*, 12, 22372–22393, 2014.\n\n\n\n\n\n> 基于物联网（IoT）的智能家电控制提供了更美好、更舒适的生活。家居控制系统包括温度控制、照明控制、空气质量控制、安全系统和水务控制等。智能系统可以通过在适当范围内维持所需的参数，来监控所有的家居控制系统。广泛利用基于物联网的智能家电来控制家居设备运行引发了数据安全问题。高度敏感的数据容易受到数据泄露的风险。为了确保在不安全网络上共享的数据完整性和机密性，需要强大的身份验证机制。本章讨论了确保数据机密性的安全数据传输和密钥交换。IoT\
  \ 设备具有功耗大、尺寸小的主要限制，导致计算仅限于简单。复杂的计算和额外的开销无法部署在小型处理设备上。广泛普及的基于物联网的家居自动化系统应该得到力保障，以防止任何外部干预和安全威胁。因此，利用现有的安全算法进行物联网设备安全研究具有重要意义。本文讨论了基于物联网的应用的新趋势和现有的安全挑战。\n\
  \n> **关键词：** 身份验证、机密性、IoT 安全、IoT 应用、分布式系统、密钥交换\n\n## 16.1. 引言\n\n从古代到现代，世界随着科学奇迹逐渐变得非常智能。另一个科学奇迹正在等待未来，即物联网（IoT）：一个居住的智能世界。仅通过手机就能监控和控制房间温度、空气质量并控制家里所有的电子设备，这种未来的生活方式正随着物联网领域的发展而逐日成为可能\
  \ [1]。物联网是一个现代概念，指各种设备在同一互联网网络下工作，使连接的设备可以共享数据，从而对生活的不同方面提供实时监控。不同类型的设备根据其应用和处理需求使用不同的物联网计算框架。一些最常见的框架如下\
  \ [2]：\n\n### 1. 物联网计算框架\n物联网的计算框架旨在处理互联网上的数据，它为设备网络奠定了基础工作。根据应用和处理位置的不同，使用了不同类型的计算框架。\n\
  \n### 2. 雾计算\n雾计算架构利用路由器、集成接入设备（IADs）或广域网（WAN）、城域网（MAN）等边缘设备来访问接入设备。它为智能设备在计算、存储和网络服务方面提供逻辑智能。\n\
  \n### 3. 边缘计算\n边缘计算具有去中心化计算能力的特征，即处理在数据中心之外。在边缘计算中，数据临时由边缘设备处理，这有利于本地存储和安全。\n\n\
  ### 4. 云计算\n云计算是最最重要的计算类型之一，因为它允许在云服务器（基于互联网的服务器）上存储、访问和编辑数据。例如，Google Drive、OneDrive、Dropbox、iCloud\
  \ 等都是全球范围内广泛使用的著名云计算应用。由于高延迟和高负载均衡问题，这种计算并不经常被用于处理 IoT 数据，而物联网需要高速度的处理 [3]：\n\n\
  云计算有有不同类型 [4]：\n\n- 基础设施即服务 (IaaS)\n- 平台即服务 (PaaS)\n- 软件即服务 (SaaS)\n- 移动即服务\n\n\
  ### 5. 分布式计算\n顾如其名，分布式计算是指组件分布在相互通信的计算机网络中的计算。这种计算处理海量数据，首先将海量数据划分为小数据，然后将这些小数据分布到网络中，从而使整体成为可能\
  \ [5]：\n\n## 6. 物联网：对社会的全球影响\n技术的进步带来了更智能的世界。但现在，是时候考虑更伟的事情了，能源、出行、城市规划等基本人类需求将经历革命性的进步。下述点提供了物联网的全球影响：\n\
  \n#### 6.1. 智能城市\n让城市变得更智能是非常明智的选择，因为建筑、路灯、交通灯和所有基础设施将通过互联网连接，从而允许设备共享数据，使评估变得非常快速且高效。通过智能设备可以精确监控城市及其区域、街道的污染和温度水平。此外，在事故、地震、火山爆发以及任何灾害发生，更智能城市能够保护更多的生命和财产。调查和预防任何盗窃或犯罪也将变得更容易。\n\
  \n#### 6.2. 智能能源\n能源是所有现代服务的流体。因此，能源的生产和利用非常重要。通过物联网，减少了整体能源消耗，提供了高质量、经济且环保的智能能源。智能能源应用、智能泄漏监控和可再生能源是智能能源的组成部分。通过一种名为智能电网的智能应用，对过去和现在的能源消耗评估以及未来能源消耗的估计已成为可能\
  \ [6]。\n\n#### 6.3. 智能出行\n交通在安全驾驶、道路交通减少、公共交通改进等各个方面都在得到提高。自动驾驶汽车使用物联网传感器和无线连接来安全、有效地驾驶汽车\
  \ [7]。自动驾驶汽车可以自己决定路线以避免交通拥堵。最广泛使用的交通方式之一是公共交通。通过车辆 IoT 传感器与区域之间的通信，可以决定公共车辆应该遵循的最优路线。\n\
  \n#### 6.4. 智能公民\n处处都是智能技术物联网设备；因为人类总是适应周围环境，其整体利益将在环境、基础设施、节省时间、安全、防护和社会健康方面得到享受。生活质量将提升到新的智能水平，通过物联网即使是困难的任务也可以轻松地完成，让生活变得简单、舒适和快乐。\n\
  \n\n\n\n\n未来的城市发展与现在的城市发展同样重要。因此，为了更好地优化空间和资源，必须收集数据并对城市的现有城市规划进行深度监控，这可以通过物联网（IoT）最有效的方式来实现。这证明了物联网是全球发展的未来\
  \ [8]。\n\n基于物联网的设备在一些关键领域被广泛接受，如下 [9]：\n\n1. **生活质量**：物联网与提高生活质量有直接联系，因为通过物联网，日常生活中工作的复杂工作变得更简单、更美好\
  \ [10]。\n2. **城市发展**：通过对过去和现在收集的数据，规划城市将变得非常容易，并有助于建设更加现代化、更有组织性的城市。\n3. **食品生产**：通过使用智能设备进行食品生产，可以确保食物具有更好的质量和充足的数量。温度控制物联网设备用于确保保存食物的最佳质量。\n\
  4. **基于物联网的智能农业**：农业的所有过程都受益于更智能的农业方法。\n5. **例如**：在作物水分管理中，物联网设备可以确保农业用水完全满足作物的需求，并避免水资源的浪费。\n\
  6. **集成害虫控制管理**：害虫的移动通过物联网的 PIR 传感器进行监控和检测，向农民报警它们的存在。\n7. **医院**：物联网设备在追踪成功手术并收集数据方面非常有用，通过改进它们所使用的医疗仪器和机器，增加更多手术成功的概率。\n\
  8. **机器学习**：通过物联网收集的数据，可以对收集的数据进行分析，教导智能设备如何就智能设备的目标做出正确的决策。\n9. **能源供应**：通过物联网，可以监控目前的能源生产和消耗，因此可以估计未来的能源生产与消耗比例。\n\
  10. **水资源分配**：水资源分配管道系统可以被训练变得智能化，为需要更多水的地方提供更多水，为人口较少的地方提供较少的水，从而避免水资源。使用物联网智能设备也可以轻松检测到管道中的任何泄漏。\n\
  11. **交通**：自动驾驶车辆拥有物联网传感器，通过无线连接与其他车辆交互，赋予其基于算法的自主决策能力，使车辆能够自动驾驶。这将有助于安全驾驶，并选择交通流量较少的正确路径\
  \ [11]。\n\n## 16.2. 物联网挑战\n\n![图 16.1 通用物联网架构。](img/c16-fig-0001.jpg)\n\n`图 16.1**\
  \ 通用物联网架构。\n\n物联网系统在数据、应用、通信通道、端到端加密等许多方面面临着挑战。物联网架构如图图 16.1 所示。对应物联网架构的一些关键挑战如下\
  \ [12]：\n\n* **通信可扩展性**：无数设备以极可能是分层的方式连接到物联网，因此互联设备在数量级上将远超过目前的互联网。因此，通信通道的可扩展性是一项重大挑战。\n\
  * **应用安全与信任**：物联网的基本概念是通过物联网应用程序通过互联网将各种数据服务器互联。这导致各种应用程序接收和访问的数据增多，从而增加了对数据安全和信任的要求。通过其中一个服务器在物联网网络中共享的数据可能存在某些信任问题，警示了通过其他服务器访问数据是否安全，因为一个服务器接收到的数据故障可能会导致整个物联网网络出现问题。\n\
  * **物联网数据的端到端加密**：物联网的高处理能力和实时数据的广泛分布使得物联网网络更容易受到网络攻击。数据泄露的漏洞和个人隐私的风险使得物联网成为网络犯罪分子的完美目标，因此必须以非常恰当、安全且简明的方式实现物联网数据的端到端加密\
  \ [13]。\n\n## 16.3. 物联网漏洞\n\n物联网的标准化工作仍在进行中，加剧的漏洞会导致物联网系统中出现更多的安全漏洞。本节讨论了物联网系统的一些通用安全威胁\
  \ [14]：\n\n1. **硬件威胁**：在开发物联网设备时并未考虑安全性，而只关注其功能。这导致了后期安全特性的缺失。硬件漏洞包括物理接口、不安全的启动过程以及为入侵者留下的漏洞。此类设备的安全性和完整性主要取决于固件的安全和可靠安装\
  \ [15]。\n2. **社会工程威胁**：社交网络和人类交互极大影响了物联网设备。社交媒体上公开的默认设置使得物联网设备容易受到攻击。入侵者可以使用默认凭据访问设备并敏感信息。\n\
  3. **法律挑战**：物联网信息的安全未涵盖在任何法律义务中。数据和信息的丢失责任完全取决于用户。根据目前的立法政策，缺乏此类数据安全的规则法规。一些机构正在致力于数据安全的法律法规。\n\
  4. **缺乏意识**：导致物联网数据不安全的常见属性是对网络钓鱼攻击、击键记录、恶意软件攻击、密码破解等安全漏洞缺乏意识。导致数据泄露的其他因素是在智能手机和其他移动设备上使用不安全的公共网络。短密码字符串、不安全的互联网连接、明文数据传输是用户端的一些意识问题。\n\
  5. **拒绝服务 (DoS) 攻击**：资源滥用攻击包括内存消耗、CPU 过载、电池耗尽、通信通道阻塞、磁盘过度占用。大多数，网络路由器和交换机是 DoS 攻击的主要目标\
  \ [16]。\n\n## 16.4. 物联网架构中的分层威胁\n\n物联网架构在中间层带来了各种安全威胁，这些威胁非常难以处理 [17]。可能有多种安全措施来克服威胁，但分层处理这些威胁将更有益。物理/感知层遭受盗窃、信号丢失、被动嗅探等物理威胁。电池耗尽攻击会导致设备关闭并停止功能。终端设备的故障可能会导致重大的经济损失和人员伤害\
  \ [18]。因此，考虑物联网架构的分层安全将有助于更好地控制并减少物联网威胁 [19]。物联网架构由如图图 16.2 所示的各种设备组成。\n\n\n\n\n\
  \n![图 16.2 分层 IoT 设备架构。](img/c16-fig-0002.jpg)\n\n`图 16.2` 分层 IoT 设备架构。\n\n完整的 IoT\
  \ 架构由四层组成：(1)感知层、(2)网络层、(3)中间件层和(4)应用层 [20]。所有层使用了多种设备和技术，会导致多种安全威胁。后续章节提供了有关每个\
  \ IoT 架构层级所有可能漏洞的详细信息 [21]。\n\n### # 16.4.1 感知层安全问题\n\nIoT 基础设施中的物理层主要由各种传感器、开关和执行器组成。传感器的主要目的是接收环境中发生的刺激。开关用于控制设备的操作。执行器的作用是根据接收到的信号执行固定任务。传感器可以是频率检测传感器、烟雾传感器、摄像头传感器、光传感器、压力传感器等\
  \ [22]。执行器可以是可以将设备当前状态变为另一种状态的物理电气机制，例如电子继电器。其他物理/感知层设备包括 GPS、无线传感器网络 (WSNs)、RFID\
  \ 等。物理层容易受到各种威胁，如下所示 [23]：\n\n1. **节点黑客**：IoT 系统由各种终端节点组成，这些节点容易受到入侵者的威胁。入侵者可能会黑入节点或用其节点替换该节点。新安装的节点可能会访问数据并将其发送给攻击者。单个被攻破的节点可能导致整个\
  \ IoT 系统的泄露。\n2. **病毒注入**：入侵者可能尝试在进程的运行镜像中注入某些恶意代码。通常，这种攻击通过应用代码中存在的存根代码（stub code）模拟，或者可能在应用程序代码更新期间发生。这种攻击为入侵者执行不道德函数以获取机密数据提供了一种方便的方法。\n\
  3. **错误数据注入**：节点被黑入后，入侵者可能会注入错误数据以执行不道德的任务。节点的这种功能故障可能会导致错误的数据存储，从而导致财务和货币损失。\n\
  4. **侧信道攻击 (SCA)**：这种攻击基于各种侧信道，例如功耗、电磁辐射暴露、激光束攻击、导致 IoT 设备行为异常的烟雾攻击。IoT 设备必须封装在能够抵御此类攻击的外壳中。\n\
  5. **启动级攻击**：终端设备只有在完成整个启动过程后才会启动其安全功能。入侵者可以通过使用另一个操作系统启动设备来获取访问权限。低功耗 IoT 设备在启动-重启循环中可能会丢失电源。\n\
  \n### # 16.4.2 网络层安全问题\n\n网络层负责在安全通道中将数据从一个设备传输到另一个设备 [24]。网络层面临的一些安全威胁如下：\n\n1.\
  \ **钓鱼攻击**：钓鱼攻击通常通过发送欺诈性信息/邮件针对受害者以窃取机密数据。攻击者的目的是攻击某些 IoT 设备并误导受害者。这是通过在网页、电子邮件等上发送恶意链接来窃取登录信息实现的。如果攻击者能够窃取登录信息，整个\
  \ IoT 系统将被攻破。网络层主要受到钓鱼攻击的影响，必须通过在 IoT 基础设施中应用安全固件来防止。\n2. **拒绝服务攻击 (DoS)**：DoS 攻击的目的是向目标设备发送大量请求消息，导致\
  \ IoT 设备中所有资源的过度使用。这使得 IoT 设备无法可用。有时，攻击者通过多个系统对系统进行泛洪来攻击，这被认为是分布式拒绝服务 (DDoS) 攻击，且难以追踪。IoT\
  \ 设备的网络层容易受到此类攻击，因为使用的功率组件非常有限，且极小资源的消耗会导致 IoT 网络变得不可用。IoT 网络的复杂性使其成为此类攻击的简单方法。\n\
  3. **数据泄露**：网络层处理 IoT 节点之间大量的数据交换。数据被认为是组织最宝贵的资产，是所有攻击者的共同目标，在数据传输期间很容易被获取。数据移动极易受到嗅探攻击，攻击者被动地分析数据流量并获取秘密信息。\n\
  4. **数据路由攻击**：执行数据路由是为了将数据包重定向到其他中间节点以到达最终目的地。攻击者试图将整个流量重定向到空路由，使数据流量无法到达任何地方。这种攻击从不返回任何回复消息，导致\
  \ IoT 节点无限等待。\n\n### # 16.4.3 中间件层安全问题\n\nIoT 基础设施的中间件在应用层和网络层之间提供抽象层。中间件提供的接口非常强大且计算密集。它包含处理通信层请求的\
  \ API。它还包括用于安全方式共享数据的内存和永久存储。尽管中间件是安全的，但也容易受到外部威胁。这些威胁可能会危及整个 IoT 系统，如下所示：\n\n1.\
  \ **中间人攻击 (MITM)**：中间人攻击通常由攻击者执行，以收集机密密钥和数据流量知识。在这种攻击中，攻击者通常通过发送欺骗身份在协议任务中成为中间人。攻击者通常冒充经过身份验证的用户以获取机密凭据。如果攻击者黑入代理服务器或密钥发行服务器，整个\
  \ IoT 通信的控制权将暴露给攻击者，而实际用户毫无感知。\n2. **SQL 注入**：在使用 SQL 查询获取数据的应用程序中非常常见的攻击。攻击者通常嵌入查询某些机密数据的代码以访问个人数据。SQL\
  \ 注入被认为是 Web 应用程序最常见的威胁。\n3. **签名篡改攻击**：Web 服务通常使用 XML 签名来验证接收数据的完整性和真实性。在这种攻击中，签名算法被破解以篡改数据并利用\
  \ Web 漏洞访问整个数据。\n4. **云端恶意软件注入**：攻击者可以从云服务提供商请求资源并在机器上安装某些恶意程序。攻击者保持所有资源经过验证且有效，以获得对提供服务的信任。受害者机器共享机密数据，并将整个控制权丢失给攻击者。\n\
  5. **云端泛洪攻击**：通过意外的服务请求对云资源进行泛洪会影响服务器的响应时间，并使实际客户丧失服务。这种攻击会严重影响云机器的性能。\n\n### #\
  \ 16.4.4 网关安全问题\n\n\n\n\n\n互连设备通常依赖网关设备来在它们之间建立安全连接。网关对通过云和 IoT 设备传输的数据进行加密处理。IoT\
  \ 设备不仅限于单一类型的设备；而是由不同类型的设备组成，这些设备之间需要不同的网关层才能进行正常通信 [25]。这些网关层为 IoT 基础设施增加了一些安全问题，并在下方讨论：\n\
  \n1. **新安装**：每当系统添加新的 IoT 设备时，它可能会引入与现有系统不兼容的漏洞，并为数据泄露留下漏洞。新设备可能会通过捕获用于加密/解密的密钥来向黑客泄露数据。\n\
  2. **额外连接**：有时为了增加可靠性，会在 IoT 设备上创建额外的连接，这些接口会成为入侵者容易进入的后门。IoT 提供商必须只提供最少的接口以避免后门进入。这些后门被用于规避正确的身份验证通道。\n\
  3. **完全安全连接**：假设从一个 IoT 节点传输到另一个节点的数据是以加密方式通过所有节点的。但这对于所有中间节点来说并不真正有效，因为中间节点可能会读取未加密的数据。在接口层读取的机密数据可能会被入侵者访问。IoT\
  \ 数据应该安全地到达目的地，而不在中间节点暴露数据。\n4. **IoT 固件破解**：IoT 设备的固件提供了初始启动和对设备的基本控制。通常，需要定期更新固件以防止设备受到外部威胁。网络接口提供系统更新，并且它应该确认安全校验和值。\n\
  \n### 16.4.5 应用层安全问题\n\nIoT 设备上最常用的接口是应用层，用于向智能设备发送命令。应用层存在一些与数据丢失和机密性相关的安全问题。应用层进一步划分为子层，如业务逻辑层、存储层和资源分配层。一些常见的应用层安全问题如下\
  \ [26]：\n\n1. **数据丢失**：IoT 应用层接口提供了某些处理设备功能的控制。入侵者可以看到输入数据，并通过实施暴力攻击，可能会获取到一些有用信息。\n\
  2. **系统访问控制**：IoT 设备的访问应当经过适当授权，并遵循数据访问的法律程序。任何未经授权的访问系统方式都可能导致整个系统的崩溃。\n3. **嗅探攻击**：入侵者可能使用嗅探技术分析数据流量和系统利用模式。安装在应用层的嗅探程序会将系统细节（如密码和\
  \ OTP 令牌）发送给入侵者。\n4. **病毒注入**：应用层的恶意代码注入会导致整个设备功能的损坏并破坏整个系统。这种非法的代码注入行为并不容易被用户识别，并会导致大量数据丢失\
  \ [27]。\n\n## 16.5 攻击预防技术\n\nIoT 架构的所有层级都需要 IoT 安全措施，但主要要求在物理层、网络层和应用层。安全措施必须确保数据从物理层到应用层受到保护。安全措施必须确保数据从物理层到应用层受到保护。安全措施必须确保数据从物理层到应用层受到保护。安全措施必须确保数据从物理层到应用层受到保护。安全措施必须确保数据从物理层到应用层受到保护。身份验证和完整性措施将在下文讨论。\n\
  \n### 16.5.1 IoT 身份验证\n\nUmer *et al.* 基于哈希技术提出了一种用于 IoT 设备的相互身份验证方案 [28]。它还使用了一种支持不可逆性并避免碰撞攻击的功能。该方案轻量级，适用于\
  \ IoT 设备。IoT 节点可以从一个节点发送数据并从 IoT 节点接收数据。必须对接收到的数据进行验证，以便拒绝错误或伪造的数据。该方案仅适用于单向数据传输，不适用于双向传输\
  \ [29]。通信节点之间的预共享密钥矩阵将提供密钥派生。安全密钥从矩阵中生成并保存在设备中一段时间，用于向接收节点发送加密数据。\n\n通信节点可能随时取消密钥并重新生成新密钥。为了保护高度机密的数据，需要不断变化的密钥。如果节点数量很大，预共享矩阵的共享也是一个具有挑战性的过程。在\
  \ IoT 节点之间实现安全连接时，设计精确的访问控制和身份验证同样重要。Samrah *et al.* 提出了一种与存储受限且本质上低功耗的 IoT 设备兼容的公钥加密系统。通过时间戳值防止了各种攻击。该方案使用椭圆曲线加密创建秘密密钥，随后进行相互授权和数据访问控制。用于会话的私钥是基于公私值通过椭圆曲线加密派生的\
  \ [30]。\n\n公钥加密与现有技术 Wi-Fi、蓝牙、5G 兼容。从公私值派生的密钥非常安全，可以防止中间人攻击。每个 IoT 设备存储其私参数，用于身份验证和加密通过网络发送的消息。如果\
  \ IoT 设备未经过加密且未采取预防措施，任何人都可以访问设备并嗅探通过其传输的数据。通信的 IoT 设备必须相互验证且不产生额外开销。身份验证和授权的主要要求是轻量级的\
  \ [30]。\n\n### 16.5.2 会话建立\n\n![图 16.3 IoT 设备的密钥交换机制。](img/c16-fig-0003.jpg)\n\n\
  **图 16.3** IoT 设备的密钥交换机制。\n\n\n\n\nIoT 设备具有移动性，会从一个位置移动到另一个位置 [31–34]，因此节点之间的安全会话需要访问权的平滑过渡。IoT\
  \ 设备之间的互信建立需要分级访问控制框架。会话通过在可信通道之间共享预共享密钥来建立。发送者将所有密钥派生参数发送到可信节点，以获取发送响应消息的密钥。通信节点将使用自己的密钥派生参数来获取用于加密下一轮通信消息的密钥。IoT\
  \ 内部安全架构无法容纳所有消息的数据发送，需要在应用层额外的安全措施来保护中间 IoT 节点的数据。在所提出的工作中，展示了一种密钥共享模型，这可以减轻 IoT\
  \ 节点密钥共享的负担。密钥共享对于每个 IoT 应用来说一直是一项巨大的挑战。挂载密钥共享方案为网络上共享的数据提供了更好的安全性。所有密钥派生参数都封装在响应消息中，消除了共享修改后密钥信息的额外开销。接收到的信息包含密钥派生参数，接收者将生成发送响应消息的密钥，该消息由派生的密钥进行加密。图\
  \ 16.3 表示发送者和接收者 IoT 节点之间的密钥共享机制。\n\n发送者和接收节点可以使用牛顿向前插值、牛顿向前插值或拉格朗日插值等多项式生成方法重新生成多项式，随后获取用于加密响应消息的密钥。这种密钥交换机制确保了通信\
  \ IoT 节点之间用于导出下一轮通信密钥的消息数量减少。加密数据的安全性完全取决于 `AES` 算法的强度。在 IoT 节点成功建立会话后的高阶多项式方程实现了\
  \ IoT 节点密钥的安全可用。\n\n## 16.6. 结论\n\nIoT 设备及其通信网络是异构的，需要在其基础设施的每一层都需要安全性。仅依赖单一 IoT\
  \ 层无法保证通信的安全，容易受到数据泄露的攻击。在异构和移动基础设施中，IoT 安全也具有挑战性。本章介绍了当前的 IoT 安全挑战，以及在给定会话中通信新密钥的轻量级密钥交换机制。通过利用不同的多项式生成方法，可以进一步改进安全密钥交换机制。本文主要关注智能家居解决方案，因此与家电之间的通信必须是安全的，不受各种数据泄露攻击的影响。IoT\
  \ 市场提供了许多安全解决方案来保护数据免受外部入侵，但 IoT 设备只能处理有限的数据，因此，复杂的安全措施无法应用于 IoT 安全。\n\n## References\n\
