  \ `k`。提取过程是直接复制 `k` 个最右侧位。数值上，移除的消息表示为：\n\n```\n(10.2)![equation](img/c10-disp-0002.png)\n\
  ```\n\n此外，减少后的差值提供了主要的私有数据。在使用 24 位图像时，可以使用红、绿、蓝所有隐藏部分的一个位，因为它们各由一个字节处理，且每个字节可以表示\
  \ 256 种特定的调。考虑到所有因素，可以在每个像素中存储 3 个位。一张 800 × 600 像素的图像借此能够存储总计 1,440,000 个位或 180,000\
