  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n系列编辑：Sujata Dash, Subhendu Pani 和 Milan Tubi\n\
  \n本系列深入涵盖了人工智能、进化计算、机器学习及其应用的创新。该系列书籍的意图是具有实际相关性，以便兼顾理论和管理层面的影响。请向 Scrivener 出版社\
  \ Subhendu Pani 博士通过 `skpani@gmail.com` 或 `Pani.subhendu@gmail.com` 提交书稿提案。\n\n\n\
  \n封面图片：Pixabay.Com\n封面设计：Russell Richardson\n\n# 前言\n\n机器智能、大数据分析和物联网（IoT）的概念持续通过实时疾病检测、作物产量预测和智能停车等各种应用改善我们的生活。这些技术的变革性影响是巨大的，因为它们在揭示智慧医疗、植物病学以及智慧城市/乡村规划与开发方面发挥着重要作用。本书通过汇编全球研究人员、学者和从业人员的尖端研究和见解，从跨学科视角介绍了机器智能、大数据分析和物联网的应用。它识别并讨论了人工智能、机器学习、物联网、图像处理、网络安全、云计算和传感器等各种先进技术，为人类的生活挑战提供了有效的解决方案。\n\
  \n这些实际创新应用包括交通导航系统、基于物联网和传感器网络的智能农业、基于深度学习的癌症检测以及智能家居解决方案。此外，云计算使得通过互联网远程访问这些现实应用成为可能。本书的主要关注点是让该领域的新手以及在实际应用开发方面具有高级知识的人士，利用机器智能、大数据分析和物联网的固有特性。例如，如何利用这些先进技术来开发如无人机监控、智能交通、医疗保健、智能农业解决方案和自动化机器人等实际应用。\n\
  \n本书是对机器智能、大数据分析和物联网新兴的实际应用相关知识体系的重要补充。各章节涉及这些技术的特定应用领域。刻意选择涵盖化的领域，是为了强调这些技术在现实生活中几乎每个方面的应用，以帮助不同行业的人士理解并利用这些技术提供的战略机遇。以下是各章节所呈现工作的主要思想摘要：\n\
  \n\n\n\n\n*   第 1 章 基于用于诊断阿尔茨海默病（AD）的模型。这些模型利用不同深度的 `CaffeNet`、`GoogLeNet`、`VGGNet-16`、`VGGNet-19`、`DenseNet`、`Inception-V4`、`AlexNet`、`ResNet-18`、`ResNet-152`\
  \ 甚至集成迁移学习，这些模型在通用图像上进行预训练以进行 AD 分类，比从头训练模型具有更好的性能。\n\n*   第 2 章 描述了如何从输入的肺部扫描图像检测肺结节，并分类肺癌及其严重程度。使用了一种新型深度学习方法来检测肺结节的位置。\n\
  \n*   第 3 章 概述了一种分类器，根据形状、纹理和特征统计的主要特征将肝脏 CT 图像分为正常和异常类。它包括四个阶段：预处理、模糊聚类、特征提取和分类。此外，使用了灰度共生矩阵（`GLCM`）方法来提取特征。\n\
  \n*   第 4 章 提供了一些主要的新兴数字技术，这些技术通过使人们的未来取决于这些技术的韧性改变了个人生活。它还强调了与这些技术相关的某些挑战及其适当的影响。\n\
  \n*   第 5 章 描述了一种基于深度学习 `ResNet` 架构的模型，帮助农民在早期检测植物叶片疾病，以便采取预防措施。\n\n*   第 6 章 讨论了一种基于\
  \ `IoT` 的智能灌溉系统，帮助农民进行精准农业以提高产量。它利用多种传感器指标，通过预测土壤水分、温度和湿度来帮助预测灌溉计划状况。\n\n*   第 7\
  \ 章 介绍了一种使用机器学习（`ML`）方法的小麦产量预测混合模型，即 k 最近邻（`KNN`）、朴素贝叶、人工神经网络、逻辑回归、支持向量机和线性判别分析。该模型分两个阶段工作：第一阶段使用特征选择策略寻找小麦的最佳特征，第二阶段使用\
  \ `ML` 根据这些最佳特征估计作物产量。\n\n*   第 8 章 讨论了用于智能农业的无线传感器网络（`WSN`）技术以及 `ML` 在智能决策中的应用。\n\
  \n*   第 9 章 提供了数据预处理技术的应用及其对信息检索影响的见解。它涵盖了开始任何数据分析过程之前需要处理的主要问题。\n\n*   第 10 章 关注云和分布式计算最新范式转变的安全性。它勾定了云环境中的各种风险参数，并提供了一些可用于云数据安全的新颖方法。\n\
  \n*   第 11 章 介绍了无人机物联网（`IoDT`）、其在现代世界中的应用、研究机会以及需要解决的当前挑战。此外，它讨论了经常发生在 `IoDT` 中的新发明、安全问题和攻击。\n\
  \n*   第 12 章 了一种基于人工智能的手势识别系统，用于预测印度手语。它涵盖了基于二维卷积网络的图像转文本的分类。\n\n*   第 13 章 阐述了印度智能交通系统（`ITS`）领域的应用、挑战和未来发展。它解释了\
  \ `ITS` 并评估了其在印度的可行性。\n\n*   第 14 章 对导航中使用的进化技术进行了调查，为分析师和研究人员提供了理解导航系统中不同算法广泛模式的机会。\n\
  \n*   第 15 章 研究了印度城市基于 `IoT` 的车辆停车系统。此外，它讨论了车辆停车及其基本要求、停车系统中各种各种技术、停车使用的不同传感器以及基于\
  \ `IoT` 的车辆停车的优点。\n\n*   第 16 章 讨论了确保数据机密性的安全数据传输和密钥交换。还有一种用于确保不安全网络共享数据完整性和机密性的轻量级认证机制。\n\
  \n*   第 17 章 勾定了用于预测纤维增强聚合物（`FRP`）包裹钢筋（`RC`）梁强度参数的机器学习模型。它总结了估计 `FRP` 与表面之间粘结强度，以及\
  \ `FRP` 包裹 `RC` 梁的剪切和弯曲强度的机器学习模型。\n\n*   第 18 章 描述了预测建筑室内空气质量的现有 `AI` 研究以及基于 `AI`\
  \ 的室内空气质量预测的未来。它概述了机器学习模型在预测室内污染物浓度中的重要作用，以开发有助于对居住者健康产生积极影响的预警系统。\n\n\n\n阿尔茨海默病（AD）是一种严重的疾病，其脑细胞会退化，导致记忆丧失增加。AD\
  \ 症状的治疗选择取决于疾病的分期，随着疾病的进展，处于特定阶段的个体会接受特定的医疗保健。大多数现有研究基于单一数据模态进行预测，它们要么利用磁共振成像（MRI）、正电子发射断层扫描（PET）、扩散张量成像（DTI），要么结合这些模态。然而，通过整合这些数据模态可以实现对\
  \ AD 分期评估的深入理解，并且使用两种或两种以上模态的组合可以进一步增强性能。但是，从零开始训练网络的深度学习技术存在以下缺点：(a) 需要海量的标记训练数据集，这对于需要医生标注数据的医学领域来说是一个问题，此外成本可能非常昂贵；(b)\
  \ 需要大量的计算资源。(c) 这些模型还需要对许多超参数进行繁琐且仔细的调整，这会导致欠拟合或过拟合，进而导致性能下降。(d) 在医疗训练数据集有限的情况下，代价函数可能会陷入局部最优问题。在本章中，将基于用于\
  \ AD 诊断的模型进行项研究。许多研究人员对网络进行了微调而非从头训练，并利用不同深度的 `CaffeNet`、`GoogleNet`、`VGGNet-16`、`VGGNet-19`、`DenseNet`、`Inception-V4`、`AlexNet`、`ResNet-18`、`ResNet-152`\
  \ 甚至在通用图像上预训练的集成迁移学习模型进行 AD 分类效果更好。\n\n**关键词：** 阿茨海默病，迁移学习，深度学习，参数优化\n\n## 1 引言\n\
  \n在美国，AD 是最常见的神经退行性疾病，也是第六大死因。预计到 2030 年，AD 的全球疾病负担将超过 2 万亿美元，需要预防性护理 [1]。尽管在临床实践取得了巨大的研究和进展，但近一半的\
  \ AD 患者能根据医学指标正确识别疾病的解剖结构和进展。组织学上神经纤维蛋白缠结和淀粉蛋白斑块的存在是 AD 最确定的证据。因此，斑块的存在并不与 AD 的开始相关，而是与感觉和神经元损伤有关。Alois\
  \ 阿尔茨海默博士（一位精神科医生和神经心理学家）是该疾病命来源，他研究了一名在 1906 年因严重认知障碍去世的 51 岁女性的大脑 [2]。Alois 博士检查了她的大脑并发现了块，这些块实际上是神经元及其周围蛋白质的聚集，导致了它们的丢失。识别或确认疾病存在的关键特征是海马和大脑皮层的萎缩，以及脑室的增大。海马在学习和记忆中至关重要，同时也作为身体器官中枢神经系统之间的连接。AD\
  \ 最终会破坏心脏和呼吸活动的大脑区域，导致死亡 [3]。\n\n不幸的是，AD 目前还没有根治愈方法 [4]。相反，目标是减轻疾病的发展、缓解痛苦、管理学习障碍并提高生活质量。另一方面，如果诊断得早，临床试验可以显著缓解精神疾病的进展。虽然更多的心理治疗以及最终的预防甚至治愈是（长期）目标，但早期诊断可能为病患带来更好的治疗结果益处。在少数可以识别出遗传异常的情况下外，AD\
  \ 的确切原因仍然不清楚。\n\n对经验性生物标志物的评估对于疾病的早期治疗是必要的 [5]。许多非侵入性神经影像方法，包括计算机断层扫描（CT）、结构性和功能性\
  \ MRI 以及 PET，已探索用于预测 AD。为了产生人体内骨骼、血管和软组织的横截面图像，使用计算机处理来整合从身体定义的不同角度记录的一系列 X 射线图像。普通\
  \ X 射线提供的细节没有 CT 扫描成像那么多。根据美国国立健康研究院的，MRI 扫描利用强磁铁和无线电波观察大脑下方的结构。医疗医生使用 MRI 扫描来检查各种疾病，从受损的韧带到癌症。为了观察和评估细胞代谢的变化，PET\
  \ 是一种功能性成像方法，因此使用称为放射性示剂的放射性添加剂。放射学家和临床医生作为医学专家，分析医学影像数据 [6]。由于人类专家在手动评估图像时可能会疲劳，计算机辅助方法已被证明对研究人员和医生都有益。然而，机器学习（ML）方法正在帮助解决这个问题。医学影像分析任务需要使用\
  \ ML 来发现或学习描述数据中相关性或模式的有用特征。由于相关或任务相关的特征通常是由人类专家根据其领域知识创建的，非专家可能很难以传统方式使用 ML 技术进行自己的研究。现在有许多项目正在研究从训练样本或预设字典中学习稀疏表示的问题。从那时起，已经尝试根据从训练数据集中学习的预定义字典生成稀疏表示。根据简洁性概念，稀疏表示被用于许多科学领域。一种稀疏诱惩罚和特征学习技术在医学影像分析的确定特征表示和选择方面已被证明是有效的\
  \ [7]。尽管浅层架构的数据仍具有有意义的模式或规律，但稀疏表示或字典学习技术在表示这些特征的能力仍然有限。特征工程已整合到深度学习（DL）的学习阶段中，尽管这克服了这个问题\
  \ [8]。DL 不再是手动提取特征，而是只需要一个几乎没有准备的数据集合，然后以自动方法学习有价值的解释。由于特征提取和选择责任的转移，即使是 ML 的非专家现在也可以有效地使用\
  \ DL 进行他们自己的研究工作，特别是在医学领域的影像分析方面 [9]。\n\n然而，DL 受数据依赖性的困扰，这是最显著的问题之一。与标准的 ML 方法相比，DL\
  \ 依赖于大量的训练数据来发现数据中的隐藏模式。模型层数方面的大小与所需信息量之间存在着一种有趣的关系。\n\n\n\n迁移学习（TL）消除了对海量数据的依赖，这启发我们利用这一点来解决训练数据不足的问题。这一概念源于一种理念：人们可以策略地利用过去的知识来解决新问题或取得理想的结果。机器学习（ML）中这一理念的根本依据是在神经信息处理系统（NIPS-95）一次关于“学习学习”的研讨会上提出的，该会议强调了需要存储和应用先前获取信息的终身机器学习方法[[10]]。迁移学习方法最近在各种实际应用中显示了成果。在\
  \ Verma *et al.* [[11\\]中，研究人员利用迁移学习方法跨领域传输文本数据。为了解决自然语言处理问题，Nalavade *et al.* [[12\\\
  ]中的作者提出了结构对应学习。研究人员采用了若干种基于卷积神经网络（CNN）的迁移学习模型来检测阿尔茨海默病（AD）[13]]。\n\n本章介绍了以往研究人员用于识别\
  \ AD 的几种迁移学习技术的结果。\n\n## 1.2. 迁移学习技术\n\n迁移学习是一个机器学习研究课题，侧重于保留接收到的信息的同时，解决问题并适应到其他但相似的问题上。例如，在学习识别卡车时获得的知识可能被用于分类其他四轮车辆。在\
  \ CNN 中，这可以通过两种方式之一实现：要么将所有 CNN 层的权重与某个带有分类层输出的其它 CNN 层进行耦合，或者直接利用“现成的 CNN 特征”，其中\
  \ CNN 充当一个通用的特征提取器供以后分析。\n\n知识工程的几个领域（如分类器、预测和分割）已经通过机器学习和数据挖掘技术取得了显著成果[14]]。然而，许多机器学习技术的成功运行是基于训练测试数据采集自相同维度区域和方差的假设。当总体发生变化时，大多数统计模型必须从头重新设计，并使用新接收的数据进行训练。在某些实际应用中，重新收集必要的训练数据并重建模型要么成本太高，要么不可行。如果研究人员能够减少与获取训练样本相关的时间和精力，将极有益处。在这种情况下，跨问题背景的知识迁移或学习将是有利的。\n\
  \n研究人员在迁移学习中面临三个主要的（1H 和 2W）研究问题：如何迁移、何时迁移以及迁移什么[15]]。哪些知识可以在领域或任务之间传输是在“迁移什么”中研究的？某些类型的知识特定于某些领域或任务，而另一些类型的信息是多个领域共有的，可以提高目标任务的性能。为了回答“如何迁移”的问题，必须在确定哪些类型的知识可以传输后构建学习算法。“何时迁移技能”是一个探索何时进行技能知识迁移的问题。同样，研究人员对何时不应该揭示学习也感到好奇。使用不同的迁移学习策略来决定\
  \ 1H 和 2W，如图 1.1]]。迁移学习允许研究人员将从以前完成的工作获得的知识应用于相关且更新的情况。当研究人员拥有来自源大量的学习任务 1 数据时，他们可以使用迁移学习方法论来获取并泛化这些收集到的知识（属性、权重），目标是学习任务\
  \ 2，后者的数据要少得多，如图 1.2\n\n`图 1.1` 迁移学习技术。\n\n更短的训练周期、提高的神经网络效率（在大多数情况下）以及缺乏大量的源数据集只是迁移学习的优势之一[17]]。同样，机器学习中的迁移学习涉及将以前学过的模型应用于新问题。在从头开始开发计算模型时，通常需要大量数据，但并不总是能够获取知识——这就是迁移学习派上用场的地方。此外，不是从头到尾训练模型，而是移除最后一个全连接输出层，并利用预训练的计算模型作为特征提取器[18,\
  \ 19]]。同样，我们可以使用类似的策略利用新数据集来解决不同的问题。可以开发一个方便快速的线性模型，根据新数据集更改输出，因为预训练的先进人工神经网络被用作新任务的特征。每当目标任务数据有限时，特征提取都是最佳选择。微调通过解冻底层模型（或其部分）并以较低的学习率在完整数据集上重新训练整个模型来完成[20]]。由于适中的学习率，模型在给定新数据集上的准确率性能将得到提高，这也有有助于减少有限数据场景下的过拟合。\n\
  \n![图 1.2 迁移过程。](img/c01-fig-0002.jpg)\n\n`图 1.2` 迁移过程。\n\n## 1.3. 使用传统训练方法进行 AD\
