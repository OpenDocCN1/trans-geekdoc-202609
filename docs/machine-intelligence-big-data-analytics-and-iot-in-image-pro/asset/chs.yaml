  \ 技术的农民可以同时增加收获、增加利润并改善环境管理。利用 `IoT` 技术的精准农业可以帮助农民提高产量同时降低运营成本。农业 `IoT` 包含了无线连接的专用设备、软件和其他信息技术。根据\
  \ `BI Intelligence`，预计农业领域的 `IoT` 设备数量到 2020 年将达到 7500 万，年增长率为 20% [20]。到 2025 年，预计“智能农业”将在全球范围内实施。当其达到\
  \ 153 亿美元时，将比 2016 年的 50 亿美元有巨大增长。\n\n\n\n\nIoT 可能通过许多其他方式对耕场产生重大影响，但这些是最关键的。这种农管理由许多基本部分组成。传感器、控制器、机器人和自动驾驶汽车仅仅是可用技术的少数几种。可能采用的其他技术还包括变速率技术、运动传感器、按钮摄像头和可穿戴设备等，仅举几个例子。公司的健康状况、员工的生产力以及设备的有效性可能都能从使用这些数据所提供的监控中获益。对工业生产更深入的了解可能为未来消费者市场更具想象力的方法铺平道路。\n\
  \n全球人口如图 6.3\n\n图 6.3 智能灌溉中与物联网相关的挑战。\n\n预测性分析正用于智能农业。如果农民能够提前预测产量，他们就能就如何生产、储存、营销和保护作物做出更好的决策。人工网络用于根据安装在田间的传感器收集的数据来预测农业生产力。这些数据包括土壤信息、温度和压力、降雨量和空气湿度等。通过专门为农民创建的仪表板或移动应用程序，他们可能获得可靠的土壤数据。越来越多的农民开始看到\
  \ IoT 如何帮助他们他们在田间工作得更高效并节省资金。\n\n## 6.4. 现状下农民面临的挑战\n\n随着印度人口持续增长，农业部门面临着日益增长的压力。印度缺乏现代农业技术导致农民面临很高的疾病损失率。过度使用杀虫剂和农药对消费者和环境都有害。其目标是通过为农民提供及时信息并在早期阶段检测疾病来解决问题。化学农药对农民和普通公众都构成了严重威胁。农药对自然界的土壤、水体、草坪和其他植物都会造成损害。农药在破坏昆虫和杂草外，还会伤害鸟类、鱼类、益虫和非目标植物。被分类为杀虫剂的农药具有最高的急性毒性。雇主和员工需要知道，投资预防性健康措施和健康促进计划是一项值得的努力，对双方都有益并有助于长期经济增长。由于直接和/或推性信息的有限，在长期暴露方面，农药似乎充满了不确定性。因此，迫切需要开发和基于知识、能力和行为的社区农药教育计划。因此，实验后的研究发现，使用创新技术解决方案减少农药的使用在许多情况下（如城市绿地）可能会完全放弃化学化合物。鉴于化学农药对人类健康和环境造成的危险，显而易见需要新的耕作方法。在这种新理念中，必须大幅减少化学农药，才能对人类健康、环境质量和经济产生积极影响。为农民建立一个可以作为疾病检测系统的框架，将专家带给农民。植物识别计算机视觉（CV）算法可用于多种用途，包括：\n\
  \n1. 创建用于疾病预测的计算方法。\n2. 实现用户友好的新设计软件。\n\n深度学习方法将用于训练检测植物叶片疾病的模型，IoT 传感器和设备将用于向农民提供最新信息，而无需始终连接的设备，云计算将使用农民提交并经过专家验证的新信息来更新模型。\n\
  \n1. 为贫困国家的农民提供可靠的互联网连接可能是困难的。\n2. 农场的蜂窝网络覆盖有限。\n3. 他们容易受到天气引起网络中断的影响。\n\n## 6.5.\
  \ 精准农业中的数据收集\n\n在田间观察到的作物生长特征（如土壤温度、土壤湿度、土壤湿润度和土壤 pH）被收集成数据集并用训练样本。喷淋灌溉被用于三个子区域，而滴灌用于另外两个区域。数据是在安得拉普拉什邦南部的一个棉田收集的，具有不同的灌溉处理子小区。此外，研究了降水的统计降尺度，以预测精确测量并为灌溉资源优化提供决策帮助。许多土壤属性通过传感器测量。测量的结果通过直接连接到\
  \ `Arduino UNO` 的传感器发送到服务器。在这种情况下，水无疑是最重要的问题。\n\n### 6.5.1 算法\n\n特征是感兴趣对象的特性，用于将其与图像中的其他对象区分开来。颜色是农产品和食品分类和分析中广泛使用的特征。彩色图像具有许多优点，包括鲁棒性、效率和处理的简单。通常，颜色属性最常用于区分对象。\n\
  \n\n\n\n## 引言\n特征清晰的对象易于识别，而特征模糊的对象则难以检测。精准农业系统数据采集阶段的主要目标是收集数据。信息可以被视为关于特定领域内感兴趣项目的数据。这些数据可能是土壤、作物或生产数据。通过对这些数据进行分析，可以找到需要改进方法以获得更好结果的区域，并避免过度的投入。许多研究详细介绍了如何利用\
  \ `CV` 从农业照片中提取相关信息。该研究采用检测方法来确定照片中物品的存在，以用于计数。过去几年中，农业领域的许多研究已成功利用了 `CV`。虽然 `CV`\
  \ 在果实质量评估、疾病检测和花卉处理等领域展现了卓越的性能，但极少的研究利用 `CV` 来估算面积或产量。`CV` 是玫瑰和柑橘等农产品许多自动收获系统的关键组件。这些工作利用图像分割从照片中提取感兴趣对象的信息。分割侧重于使用各种标准将前景对象从背景对象中提取出来。随着两个大型（且开放）数据集\
  \ `Plant Village` 的发布，利用深度学习模型进行疾病检测的研究呈指数级增长。虽然 `Digi Pathos` 是一个相对较新的数据集，但它被用于下文描述的文章中训练和评估深度学习模型。从互联网下载的图像用于训练基于\
  \ `Caffe` 的深层 CNN [19]。通过图像增强，增加了数据集的大小。采用了 `Caffe Net` 架构。一项利用 `plant village`\
  \ 数据集的早期研究构建了一个利用超过 54,000 张照片的深度学习模型。在受控数据集上，它们的准确率达到了 99.9%。当在全新的照片批上对模型进行评估时，准确率为\
  \ 31.4%。当训练数据集在更多样化的条件（如不同的背景、光照等）下收集时，它们的深度学习模型表现得更好。使用迁移学习训练的 `CNN` 正确识别了作物训练数据集中\
  \ 93% 的木薯。利用一个名为 `InceptionV3` 的 `CNN` 模型作为迁移学习的起点，使用的是他们数据集。\n\n一种开发的方法使用深层 `CNNs`\
  \ 来识别苹果叶病。他们自己的数据集有 13689 张图像，他们利用这些图像来比较基于 `AlexNet` 的深层 `CNN` 的性能与基于 `AlexNet`\
  \ 的深层 `CNN` 的性能。\n\n在 图 6.4 中，根据物联网中的精准农业周期，迁移学习可用于检测小米谷物的疾病。在 `VGG16` 架构和特征提取的帮助下，他们在迁移学习过程中达到了\
  \ 95% 的准确率。深度学习被用于创建一个可以检测木薯感染的移动应用程序。它使用 `Mobile Net` 架构在 `COCO` 数据集上进行了训练。在现实世界中测试时，尽管在受控条件下结果良好，但他们的模型准确性损失了\
  \ 32% 的性能。对于植物分类，分别使用四个模型和四个数据集测试了迁移学习的适用性。他们得出的结论是采用的模型和数据集与性能无关。\n\n文献表明，即使从各种调查中获得了具前景的发现，分类结果仍然可以得到改进。使用神经网络进行分类可以获得更准确的发现。因此，本研究侧重于神经网络分类。在利用人工神经网络进行\
  \ `CV` 分类的过程中涉及几个步骤。为了估算当前准备采收的花卉产量，必须将提取出的对象分为两类：首先是“花”，其次是“蕾”，以便估算未来几天的提前产量。根据对象检测方法的结果创建了花和蕾的数据集。\n\
  \n![图 6.4 物联网中的精准农业周期。](img/c06-fig-0004.jpg)\n\n图 6.4 物联网中的精准农业周期。\n\n# 分类过程\n\
  分类的下一个阶段是构建一个比上一个准确的分类器。\n\n- **提取对象**：带有对象的训练图像具有一致的黑色背景，与对象形成对比。使用阈值分割法分离训练图像中的对象。\n\
  - **确定对象区域**：通过斑点分析（blob analysis），在 `n x 2` 数组中获得这些区域相应 `x-y` 坐标的像素列表，其中 `n` 是对象区域像素像素，第一列包含相关的\
  \ `x` 位置，第二列是相应的 `y` 位置。\n- **提取对象区域内像素的颜色值**：一旦检测到彩色图像中对象区域的像素，就会独立提取每个项目这些像素的\
  \ `RGB` 颜色值。\n- **特征**：特征从多个对象到类别生成源图像向量，每个对象包含数千个像素。从内存和处理时间的来看，直接在训练神经网络中使用所有对象的所有像素颜色值的想法被认为是不现实的。\n\
  \n### 6.5.1.1 作物生产阶段的环境考虑因素\n\n表 6.1 影响不同生产阶段的环境因素。\n\n| 种植阶段 | 空气温度 | 土壤温度 | 土壤水分\
  \ | 湿度 |\n| :--- | :--- | :--- | :--- | :--- |\n| 发芽 | 26-33 摄氏度（最佳）。至少 18 摄氏度（最低）\
  \ | 23-28 摄氏度（最佳） | 基于吸收 | - |\n| 生长 | 30-33 摄氏度（最佳），低于 20 摄氏度时较差 | 23-29 摄氏度（最佳），低于\
  \ 21 摄氏度时较差 | 充足的水分至关重要 | 更好 |\n| 成熟 | 偏好凉爽的夜晚或低于 15 摄氏度 | 低温最佳 | 最少水分会引发 | 偏好干燥气候\
  \ |\n| 开花 | 偏好温暖的夜晚或 18 摄氏度 | 在温暖土壤中最佳 | 湿润土壤最佳，干旱条件下停止 | 更好 |\n| 过熟 | 在炎热季节引发 |\
  \ 喜欢高温 | 干燥季节水分充足 | - |\n\n文献表明，人工神经网络（`ANN`）作为一种软计算工具，在综述的各种研究中被证明是有效的分类器。因此，本研究使用人工神经网络辅助分类任务，如表\
  \ 6.1 所示，观察了环境考虑因素对不同生产阶段的影响。\n\n### 6.5.2 实施措施\n\n### 6.5.2.1 相关向量分析\n\n\n\n\n\
  新的 RVA 推荐算法已用于 ARV 推荐系统的所有数据分析。该技术是两种著名的精准农业评估方法的混合：均方根误差 (`RMSE`) 和纳什-斯塔克利夫效率 (`NSE`)。这种独特的算法根据观测到的传感器值预测关键因素，并提供高产农作建议，其中观测到的传感器数据的准确性通过\
  \ `RMSE` 和 `NSE` 分析来确定。\n\n`RMSE` 是一种比较观测值与预期值的统计量。残差是 `RMSE` 的偏差。假设用于估计的数据样本被计算错误。`RMSE`\
  \ 是许多预测特定数据集的最佳模型中使用的关键准确性统计量。容器中的水量是 0 到 1 之间的分数。\n\n### 6.5.2.2 均方误差\n\n预测器的质量由均方误差决定。`N`\
  \ 表示预测值，`yp` 表示观测向量，`yp` 表示观测向量。\n\n### 6.5.2.3 物联网在精准农业中的潜力\n\n到 2050 年，世界目前的 83\
  \ 亿人口预计将达到 97 亿。全球人口每年将增加约 9500 万。人口的增长必须与食品产量的增加相匹配。为了满足食品需求，农业产量必须在现有基础上至少增加三分之一。由于农田面积无法跟上人口增长，农民已开始转向精准农业。\n\
  \n精准农业从根本上说是将智能技术部署到田间，以便农民在生产作物时对产量和成本考虑具有可见性。配备传感器的智能设备 IoT 物实时收集信息并将其传输到数据处理中心。农民现在正采用新开发的技术在农田的微样本上进行作物管理，以评估土壤成分、调节肥料和农药的种类，并实现准确的产量估计。\n\
  \n*   肥料及施用时机。\n*   灌溉和降水模式。\n*   空气的温度和相对湿度。\n*   土壤的组成与管理。\n*   作物养护流程。\n*   所使用的种子。\n\
  \n如果没有支持物联网的技术，精准农业将是不可能的，这些技术加速了农民对作物产量变化的主要原因、影响实测量的因素以及生产成本驱动因素的认知。从农田、作物和周围环境测量并收集数据是成熟物联网解决方案提供的关键能力。\n\
  \n大多数农场位于数字网络接入有限的农村地区。频繁的天气变化可能导致传感器和设备故障。这些困难要求采用强大、简单且易于维护的物联网技术。传感器、控制系统、机器人、自动驾驶车辆、自动化硬件、变率技术、运动检测器、按钮摄像头和可穿戴设备都是这种农场管理策略的一部分。这些信息可用于跟踪公司的整体健康状况，以及员工生产力和设备效率。产品配送策略受益于预测制造产出的能力。\n\
  \n*   **农业无人机：** 无人机正被应用于农业，以改进一系列农业活动，包括作物健康评估、灌溉、作物监测、作物喷洒、种植以及土壤和农田分析。\n*   **地理围栏和牲畜追踪：**\
  \ 农场主可以无线物联网应用收集有关牛的位置、状况和健康信息。这些信息有助于预防疾病传播，同时减少了劳动支出。\n*   **智能温室：** 使用物联网监控器构建的智能温室可以监控并调节气候，消除了人工干预的需求。\n\
  *   **预测性分析的智能农业：** 作物预测非常重要，因为它支持农民对作物生产、储存、营销方法和风险管理做出未来决策。人工网络用于从田间传感器获取的数据来估计作物产率。土壤、温度、压力、降雨和湿度等参数包含在数据中。农民可以使用仪表板或自定义移动应用程序收集正确的土壤数据。\n\
  \n农民已开始意识到物联网可以帮助他们以更低的成本提高农业生产力。\n\n### 6.5.3 建议模型的架构\n\n植物灌溉系统设计人员在为植物设计灌溉系统时会考虑许多方面，包括土壤类型以及天气和温度等条件。使用传感器网络可以收集土壤水分和温度数据。本体论被用于确定哪种植物、气候和土壤类型对于特定的植物、气候类型和土壤类型是最。本体结果占了长期是否给植物浇水的最终决策的\
  \ 50%。\n\n另一半工作量由 ML 系统处理。很容易看出 ML 模型为灌溉系统的规划和开发得如何。所提物联网架构的几层相互连接：应用层、处理层、传输层和感知层。与传统的三级物联网设计不同，这种设计只有三层（应用层、网络层和感知层）。在物理层（也称为感知层）中，可以安装数据采集传感器。湿度、土壤水分和天气等因素会被空气捕捉并随之带走。\n\
  \n无线、2G、3G 和局域网 (`LAN`) 网络用于将数据传输到网络栈的处理层。传输层负责确保数据递送到正确位置。处理层负责保存、处理和解释来自传输层的大量数据。在此过程中使用了数据库、云计算甚至边缘计算。应用层负责帮助使用应用程序的用户。传感器、全球移动系统\
  \ (`GSM`) 模块、边缘服务器和 IoT 服务器只是构成该系统的少数组件之一。每一层都有特定的功能。云计算和认知计算是四层计算中的两种。\n\n在图 6.2\
  \ 中，你可以看到传感器是如何获取那里显示的数据。土壤水分、空气湿度和温度的测量也是该过程的一部分。感知层包括传感器、执行器和微控制器等。最后三层完成了该结构。它们共同为与其合作的农民提供浇水策略、作物监测和其他实用建议。\n\
  \n\n\n\n# 概述\n\n照片中清晰地看到，在物理组件组装之前已进行了全面的物理设计审查。每个组件在市场上都容易获得且价格合理。因此，找到现在在物理世界中使用的这种设备非常容易。除了常用的湿度和光传感器外，它还具有湿度、光照和湿度传感器。每\
  \ 30 秒，数据就会通过名为 `SIM808`（全球移动通信系统）的 GSM 模块发送到数据中心。安卓应用的用户能够观察决策过程的结果，并能够使用系统的执行器来阀门释放或关闭水流。\n\
  \n在图 6.5 中，所提模型以及运行在 IoT 服务器上的 ML 智能决策系统的工作原理确保了植物获得充足的水。在这种环境下，可能种植的种类及其生长方式都受土壤和气候条件的影响。通过将本体论引入智能系统，可以改进这些特性。通过使用这些技术，所提模型能够实现系统的完全自动化并消除人为错误。随后，算法将查看智能灌溉系统拥有的语义知识库。下一节位于此处。订阅数据管理（SDM）旨在与真实世界的数据结合使用。当思想包含在语义数据中时，分类和评估是基于逻辑层级的。通过查看本体论中呈现的题逻辑系统的输出，可以对下一步做什么做出明智决策。\n\
  \n![图 6.5 所提模型及其工作原理](img/c06-fig-0005.jpg)\n\n图 6.5 所提模型及其工作原理。\n\n# 智能灌溉系统逻辑\n\
  \n为了根据作物的种类、气候和土壤类型预测所需的水，本研究应用了所提本体论的概念。本体论可以用于根据各种信息做出决策 [21–24]，因为它们是可用于判断的组织化数据。传感器和\
  \ `SPARQL`（用于 `RDF` 的查询语言）是运行灌溉系统时你应该注意的两个部分。为特定植物所需的水量可能受环境中温度和土壤种类的影响。当阀门打开时，水被输送到作物。根据田间布局，它可能会被完全关闭。传感器数据通过各种传感器在大型区域的多个水平收集。在庭院级测量表面和深层土壤水分，同时在象限级也测量表面和深层土壤水分。传递给控制代理的\
  \ `RDF` 数据包含了关于作物、气候和土壤等的本体论信息。你必须以此格式向代理提供信息。此外，它还学习植物在特定土壤质地中的水分需求。\n\n系统的本体论相当广泛且复杂，因为在决定是否给植物用水之前有大量的方面需要考虑。本体论处于高度抽象水平。巴基斯坦分为四个独立的气候区。与每个地理位置一样，每个地区都有自己的特定特征：丘陵、沙漠和低地丰富，沿海地区和其他水域也是如此世界各地看到的湿度差异可能是导致灌溉用水量差异巨大的原因。温度和湿度都是决定植物需量的关键因素，但土壤类型也至关重要。粘土非常适合生产小麦，因为排水良好且能保持水分。土壤的外观和功能可以根据种类分为四五个不同的类别。不同的作物（如甘蔗、水稻和小麦）需要不同的水量才能良好生长。例如，小麦和棉花所需的水远多于其他作物。\n\
  \n![图 6.6 智能灌溉的数据流](img/c06-fig-0006.jpg)\n\n图 6.6 智能灌溉的数据流。\n\n图 6.6 描绘了建立算法决策支持的过程。了解每种作物生长需要多少水至关重要。田间所需的实际灌溉供应是通过分析来自牧场和农田的数据、土壤类型和天气类型等因素决定的。农民通过安卓应用程序获取灌溉建议是可行的。农民在田间可以通过点击智能手机上的“激活”按钮来开启田间的阀门。\n\
  \n## 6.6 结论\n\n未来农民可以通过桌面程序或手机连接到推荐系统以交换信息。目前的研究是测试使用 CV 技术在精准农业领域应用 IoT 方法的方法。精准农业是农业技术中一种相对新的范式，旨在保持或提高产量的同时减少与农产品生产相关的成本。精准农业是一个巨大的领域，涉及许多处理步骤，从收集田间需求或生产的变化数据开始，然后评估信息以查看是否有必要的更改。\n\
