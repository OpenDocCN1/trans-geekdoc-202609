  \n# 12. 面向计算机视觉的实时 ISL 预测手势识别系统\n\nMukul Joshi, Gayatri Valluri, Jyoti Rawat[*]](#c12.xhtml#c12-note-0001)\
  \ and Kriti\nSchool of Computing, DIT University, Dehradun, Uttarakhand, India\n\
  \n## Abstract\n\n> 手势语言是一种非语言的交流方式，用于传输信息，与语音（即通过手势利用口语表达的言语交流方式）不同。本章旨在通过创建一个识别模型，消除音听障碍人士与非手势语言使用者之间的交流障碍。该系统使用实时运动分析创建，对数据集进行预处理并转换为灰度图。随后，应用\
  \ HSV 转换并结合皮肤掩码和 Canny 边缘检测用于手部跟踪和检测。手势语言预测借助二维卷积神经网络（`CNN`）实现，该网络主要用于图像处理应用，结果被翻译并存储在数据库中，以便手势能够被识别并翻译成文本。通过\
  \ 2-D `CNN` 分类实现的总体准确率为 91%，在 36 个标签中成功检测到 33 个标签。\n\n> **关键词：** 视觉识别系统、手势语言、卷积神经网络、印度手势语言\n\
  \n## 12.1. 引言\n\n\n\n\n\n手语是一种包含非语言对应关系的语言，其起源于视觉线索和手势。在手语中，存在完全建立的手部动作，具有其语法意义和内置的形成系统。手语由手部形状、动作和方向形成的各种手势组成。目前，手语是听障人士的基础语言\
  \ [1\\]，也被能听见但不能说话的人所采用。手语是一种复杂的语言，包含但不限于手势、面部表情和肢体动作。手语虽然并非通用，但它特定于拥有母语手语的国家，这些手语有自己的一套规则、语法和语序。当残障人士使用手语与不熟悉这种语言的人士交流时，就会产生问题。因此，有必要开发一种自动且交互的翻译界面来弥合沟通鸿沟。通常，听力及语言障碍者会寻求中介手语翻译员的帮助，即精通手语和普通口语的人员，将他们的想法翻译给普通人，反之亦然。然而，这种方式被证明成本高昂，且并非总是有效。因此，引入一种能够自动识别手语手势的系统成为首要任务。引入这样的系统将显著缩小残障人士与社会中使用语言作为交流形式的人士之间的差距。通常，使用的手语根据文化和语言而异\
  \ [2\\]]。\n\n特别是，印度手语（ISL）被印度说话和听力困难的人士使用。它是印度残障人士以及使用英语交流的人士的一种被认可且先进的交流形式。ISL\
  \ 中不同的字符涉及各种符号表示法。\n\n解决这一问题的有效方案是采用一种面向计算机视觉的手势识别系统，该系统利用图像处理技术。手语功能齐全，但并未被通用使用或理解，感知它们最简单的方法是创建一个计算机识别模型，通过视频序列捕捉空间运动并进行记录，通过卷积神经网络（`CNN`）预测手语的翻译系统。\n\
  \n此外，本章分为不同的部分：文献综述、系统架构、实现与结果，最后是结论。所提出的模型是一个 `CNN` 网络，即在预处理的手语图像数据集上训练的模型，不需要任何复杂的预处理，手语者可以通过摄像头直接输入实时视频流并馈送网络。\n\
  \n## 12.2. 文献综述\n\n不同的作者实现了多种用于手语识别（SLR）模型分类的技术，每种方法相对于其他方法都有其优势，包括为了开发其 SLR 模型而自提出的方法。该部分的目标是综述各种\
  \ SLR 系统的方法，并对比研究人员在负担能力和访问性方面所采用的更高效的方法。隐马尔可夫模型（`HMM`）是 SLR 处理中广泛使用的方法。`HMM` 算法与另一种算法结合用于\
  \ SLR。根据 Wang *等人* [3\\]的研究，他们使用了轻级 `HMM` 模型用于中文 SLR，其中可以通过低级近似的帮助选择关键帧，并连续区分 `HMM`\
  \ 中隐藏的状态，使得关键帧成为对隐藏状态的缩放和精确估计。在 Zhang *等人* [4\\]的一项类似工作中，另一种名为 `Tied Density-HMM`（耦合密度\
  \ HMM）的方法使用了类似于连续 `HMM` 的技术，通过合并相同的高斯复合分量减少了计算。\n\nEkbote *等人* [5\\]的另一种研究方法使用了人工神经网络（`ANN`）通过形状描述符进行识别，结合梯度方向直方图（`HOG`）技术进行特征提取，并借助支持向量机（`SVM`）分类器通过神经网络进行手势分类。表\
  \ 12.1 规定了考虑到硬件影响和每种方法的图像数量的情况下，各方法准确率的比较研究。Rekha *等人* [6\\]、Fatmi *等人* [15\\]在他们的工作中也做了相同的任务。另一种由\
  \ Tewari *等人* [7\\] 提出的用于 SLR 的无监督神经网络方法是自组织映射（`SOM`），它使用 2D 离散余弦变换（`2D-DCT`）创建压缩图像，并在\
  \ `MATLAB` 中模拟了 `SOM` 或 Kohonen 自组织特征映射图（`SOFM`） [7\\]]。\n\n所实现的处理方法是基于 Yang *等人*\
  \ [8\\] 呈现的 `CNN`，这是一种基于 `CNN` 和长短期记忆（`LSTM`）网络的中文手语（CSL）识别模型。\n\n该模型在创建时，`CNN`\
  \ 将图像作为输入，这防止了复杂的手势分段和特征提取，并尽可能地利用信息。由于 CSL 中有各种动态符号，因此拥有一个连续识别模型更具实践。类似于，在另一种 `CNN-LSTM`\
  \ 方法 [9\\]中，使用名为 `Inception-V3` 的 `CNN` 进行特征提取，由循环神经网络（`RNN`）架构将其翻译为文本。在 Subha *等人*\
  \ [11\\]的处理方法中，图像通过基于网的特征提取，将手势描述为特征向量。随后通过 k 近邻算法对手势进行进一步分类。对于所提出的模型，使用了 `2D-CNN`\
  \ 方法，它与 `ANN` 相同 [12]13\\]。它由通过权重链接连接的节点或神经元组成，对给定输入产生输出。\n\n**表 12.1** 不同 SLR 研究的比较分析。\n\
  \n| **文章** | **方法** | **图像数量** | **硬件** | **准确率 (%)** |\n| :--- | :--- | :--- |\
  \ :--- | :--- |\n| [3\\] | 轻级 `HMM` | 7000 帧视频 | Kinect 传感器，彩色手套 | 83.60 |\n| [4\\\
  ] | 耦合密度 `HMM` | 1756 个训练样本和 439 个测试样本 | Kinect 传感器，彩色手套 | 91.30 |\n| [11\\] | `HMM`\
  \ | 320 个样本图像，每个手势 10 张图像 | Kinect 传感器，彩色手套 | 96.87% |\n| [5\\] | `ANN` 和 `SVM`\
  \ | 自建 1000 张图像数据库 | 多台摄像头 | (`SIFT` + `SVM`=96.2), (`HOG` + `SVM`=93), (组合 99.00)\
  \ |\n| [7\\] | `SOFM` | 35 张图像的数据集 | 高规格摄像头 | 80.00 |\n| [8\\] | `CNN` 和 `LSTM`\
  \ | 320 个对应手势视频，256 个用于训练，64 个用于测试 | 摄像头，网络摄像头 | 98.43 尺寸为 1024 的输入向量 |\n| [9\\\
  ] | `CNN` 和 `LSTM` | 1100 段视频 | 摄像头，网络摄像头 | 81.00 |\n\n\n\n\n\n2-D CNN 的实现通过卷积核窗口（也称为局部感受野）提取层特征图来完成，这减少了自由变量并增加了网络的泛化能力。根据\
  \ [3]，使用 HMM 模型的测试准确率为 83%；对于 [4]，使用紧密密度 HMM 针对 439 个测试样本的测试准确率为 91.30%。在 ANN-SVM\
  \ 情况下，[5] 获得的组合准确率为 93%。对于 [7] 的 Kohonen SOM 方法，针对包含 35 幅图像的数据集，获得的测试准确率为 80%。最后，对于\
  \ [8] 使用 LSTM 的 CNN 方法，在使用 64 个测试样本的情况下获得的准确率为 98.43%。同样，对于 [9]，对由 1100 个视频组成的数据集进行测试获得的准确率为\
  \ 81%。\n\n## 12.3. 系统架构\n\n所提出的框架包含模型构建阶段和用于实时流输入的开发环境阶段。\n\n### 12.3.1 模型开发阶段\n\
  \n1. **数据获取**：模型构建阶段通过从多个资源获取训练数据进行初始化。对于所提出的模型，从 Kaggle [10] 获取了印度手语数据集，包含约 40,000\
  \ 幅图像。获取的数据集长度为 34153，其中每幅输入图像都会经过一系列卷积层。\n\n![图 12.1 (a) 预处理前的字符数据集 [A-R]，(b) 预处理后的字符数据集\
  \ [A-R]，(c) 预处理前的数字数据集 [0-9]，以及 (d) 预处理后的数字数据集 [0-9]。](images/c12-fig-0001.jpg)\n\
  \n图 12.1 (a) 预处理前的字符数据集 [A-R]，(b) 预处理后的字符数据集 [A-R]，(c) 预处理前的数字数据集 [0-9]，以及 (d) 预处理后的数字数据集\
  \ [0-9]。\n\n2. **图像处理**：该部分适用于各种图像预处理技术，这些技术对于在数据集上训练模型时的特征提取以及提高图像质量至关重要。预处理前后的示例数据集如图\
  \ 12.1 所示。\n\n所提出的用于 ISL 预测模型的架构图示见于图 12.2 。\n\n3. **数据缩放**：所有用于训练模型的图像都应该保持尺寸一致，以便应用图像缩放技术。\n\
  \n4. **数据增强**：这种方法允许从业人员通过旋转、缩放、归一化和水平翻转等各种方法，在不收集新数据的情况下自动增加用于模型训练的数据 [13]。\n\n\
  5. **特征提取**：CNN 模型被认为由特征提取部分和分类部分两个组件组成。CNN 的初始层执行特征提取（卷积层 + 池化层）。\n\n6. **CNN 分类**：CNN\
  \ 的最后几层（全连接层 + 输出层）为所提出的模型执行分类部分 [14]。\n\n![图 12.2 所提出的 ISL 模型系统架构。](img/c12-fig-0002.jpg)\n\
  \n图 12.2 所提出的 ISL 模型系统架构。\n\n### 12.3.2 开发环境阶段\n\n实时流通过网络摄像头或手机作为图像输入，并从实时流中提取帧并进行缩放。提取的图像通过图像分割处理，从而进一步获取图像中更重要的特征。相同的图像处理技术再次应用于模型构建阶段，以提高预测性能。然后，处理后的输出通过所开发的\
  \ CNN 模型进行分类。\n\n## 12.4. 方法论\n\n所提出的 ISL 预测系统分两个阶段执行。第一阶段是数字图像处理阶段，使用多种图像处理技术提取并突出重要特征；第二阶段（或模型构建阶段）涉及使用训练好的分类器对手手势进行分类。\n\
  \n在执行若干种预处理技术后，用于样本训练的图像将在训练过程中进一步馈入分类器模型。\n\n### 12.4.1 图像预处理阶段\n\n从视频中提取帧，如果每秒帧率超过\
  \ 70，则开始帧提取过程；否则停止后续过程，直到帧率达到要求。帧提取之后是图像处理 [16]–18]。\n\n1. **RoI 分割**：识别帧的特定区域[14]。\n\
  \n2. **灰度转换**：将输入颜色转换为灰度图像。\n\n3. **HSV 图像转换**：将输入颜色转换为 HSV 空间。\n\n4. **降噪**：对所提出的模型执行中值滤波\
  \ [19]。\n\n5. **边缘检测**：应用阈值值为 60 的 Canny 边缘检测器。\n\n### 12.4.2 模型构建阶段\n\n基于 2-D CNN\
  \ [20]–24] 对提出的模型应用深度学习方法以构建分类器。用于 ISL 预测的 CNN 模型见图 12.3 。\n\n![图 12.3 所提出的系统 CNN\
  \ 模型。](img/c12-fig-0003.jpg)\n\n图 12.3 所提出的系统 CNN 模型。\n\n\n\n\n第三个卷积层产生的深度为 64，这就是如何从最终的\
  \ `x, y` 尺寸得到 16×16 值以及 64 的深度的原因。这将是全连接层应该获得的输入数量。然后，产生 500 个输出，并将其作为输入馈入最终分类层，分类层将这些视为输入并产生\
  \ 36 个类别得分作为输出。\n\n按顺序添加了一系列卷积层和池化层 [25–27]，输入图像通过第一层卷积层，最初在此应用激活函数和池化层。该过程在第二和第三层卷积层中重复。最后，得到的结果被展平为向量形状，并进入全连接层，随后应用\
  \ `ReLu` 激活函数。需要注意的是，在展平和每个全连接层之间添加了丢弃（dropout）层以防止过拟合 [28–32]。因此，得到的结果是 36 个类别得分的列表。对于分类，数据集被分为\
  \ [0-9] 和 [A-Z] 36 个类，批大小为 (64)，每个标签大约训练了 900 张图像。训练使用了 34,153 张图像，验证使用了 7091 张，测试使用了\
  \ 1410 张。\n\n## 12.5. 实现与结果\n\n### 12.5.1 性能\n\n使用模型前向传播执行前向传递，比较预测输出与实际标签并测量损失，进一步使用交叉熵损失来衡量模型性能。图\
  \ 12.4 和 图 12.5 分别显示了“A–J”范围内的输出字符以及“0–9”范围内数值的输出字符显示。\n\n每个标签获得的测试准确率，对于标签 [0-9]\
  \ 的准确率为 100%，对于 [A-Z] – B 的准确率为 100%，而对于标签 B 的准确率为 97%。\n\n图 12.6 显示了当前 ISL 预测模型的损失和准确率曲线。\n\
  \n![图 12.4 “0–9”范围内数值的输出字符显示](img/c12-fig-0004.jpg)\n\n图 12.4 “0–9”范围内数值的输出字符显示。\n\
  \n![图 12.5 “A–J”范围内的字母输出显示](img/c12-fig-0005.jpg)\n\n图 12.5 “A–J”范围内的字母输出显示。\n\n\
  ![图 12.6 ISL 模型实现的损失-准确率曲线](img/c12-fig-0006.jpg)\n\n图 12.6 ISL 模型实现的损失-准确率曲线。\n\
  \n![图 12.7 训练后模型的混淆矩阵热图](img/c12-fig-0007.jpg)\n\n图 12.7 训练后模型的混淆矩阵热图。\n\n### 12.5.2\
  \ 混淆矩阵\n\n混淆矩阵是一种指示所提语言识别模型在测试数据上预测的图表。在混淆矩阵中，每一行代表所提实际类的预测概率值，而每一列代表不同类别被预测为特定类别的概率。\n\
  \n如图 12.7 所示，对角线上的所有蓝色单元表示类别标签的正确预测，具有高水平的置信度。每行的黄色单元显示了模型与该行对应类别混淆的类别。因此，实现了约 91%\
  \ 的总体测试准确率。观察到给定模型中的任何损失都是由于背景移除或边缘检测错误造成的。训练后模型的混淆矩阵热图见图 12.7。\n\n## 12.6. 结论与未来展望\n\
  \n这项工作通过将基于 2D CNN 的分类集成到所获取的数据集中，并处理可以转换为文本的匹配图像，实现了面向计算机视觉的手势识别。最后，实现了一个稳健的系统，对\
  \ 36 个标签进行了绝对检测，总体准确率达到 91%。所提模型包含了图像预处理技术和深度学习，不需要任何额外的硬件支持（网络摄像头/摄像头外），使系统具有高功能且成本效益。该系统能够预测包括单手和双手的语言。所提模型的主要特征（这为整个方法增加了实用性）是，在早期阶段，系统通过处理可以转换为文本的匹配图像来预测语言。\n\
