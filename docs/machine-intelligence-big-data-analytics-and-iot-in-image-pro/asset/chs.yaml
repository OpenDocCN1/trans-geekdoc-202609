  \ LSB 替换过程。在低亮度图像中，每个像素由 8 个位组成。一个像素随后可以显示 $2⁸ = 256$ 种变化。LSB 替换的核心思想是将私有信息插入到最右侧位（权重最小的位），这样嵌入技术就不会极度地影响原始像素值。LSB\
