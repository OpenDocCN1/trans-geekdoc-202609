  \ | |\n\n## 17.4. 结论\n\n在本章中，讨论了机器学习模型在估算使用 FRP 复合系统的 `RC` 筋梁粘结、剪切和弯曲强度方面的重要性。通过广泛的文献综述，提取了机器学习模型在\
  \ FRP 系统包裹的钢筋混凝土梁粘结、剪切和弯曲强度应用方面的信息。使用 `ANN`、改进 `ANN` 和 `ANFIS` 模型进行 `FRP`-混凝土粘结强度预测在准确性和速度方面表现良好。目前仅有少数机器学习方法可以预测使用\
  \ `FRP` 增强的钢筋混凝土梁的弯曲强度。`ANFIS` 和 `ANN` 模型在预测 `FRP` 增强的剪切强度方面表现更好。未来的研究将有必要开发更准确的弯曲强度预测模型。这些机器学习模型对于落在输入和输出参数范围内的数据是有效的。\n\
