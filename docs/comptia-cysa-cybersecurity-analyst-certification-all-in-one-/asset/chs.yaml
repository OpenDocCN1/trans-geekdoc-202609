  \n## 第二部分\n\n## 漏洞管理\n\n![Images](img/00004.jpeg) 第 5 章 实施漏洞管理流程\n\n![Images](img/00004.jpeg)\
  \ 第 6 章 漏洞扫描\n\n## 第 5 章：实施漏洞管理流程\n\n在本章中，你将学习到：\n* 漏洞管理流程的要求\n* 如何确定你需要的漏洞扫描频率\n\
  * 各种系统中发现的漏洞类型\n* 配置扫描工具时的考虑因素\n\n*古人云：“兵法之者，先求无不胜，然后等待敌之可胜”。*\n——孙子\n\n### 漏洞管理要求\n\
  \n就像生活中的许多其他领域一样，漏洞管理涉及到我们想做的事情、应该做的事情以及必须做的事情的结合。假设你不需要第一方面的帮助，我们将把本章的注意力放在后两点上。首先，我们必须识别出绝对必须满足的要求。广而言之，这些要求来自外部机构（例如法律和法规）、内部机构（例如组织政策和高管指令）以及最佳实践。最后这一个来源可能让某些人感到意外，但请记住，在应用安全原则保护我们的信息系统时，我们被要求表现出尽职调查。否则，将面临法律责任风险，甚至危及我们的工作。\n\
  \n### 监管环境\n\n*监管环境*是指组织存在或运行的环境，该环境在很大程度上受到政府（联邦、州或地方）、行业团体或其他机构所制定的法律、规则或法规的控制。简而言之，就是当你必须按照别人的规则行事，否则将面临严重后果时所发生的情况。监管环境的一个共同特征是它们拥有处理不合规行为的执行小组和程序。\n\
  \n作为网络安全分析师，你可能需要采取多种行动以符合一项或多项监管要求。一个有时被忽视的例子是某些合同，这些合同要求一方确保在信息系统安全方面满足某些条件。这种情况并不常见，特别是在与政府打交道时，被要求遵循某些规则，例如防止外国人访问某些信息，或确保在合同上工作的每个人都接受过适当的信息处理程序的培训。\n\
  \n在本节中，我们将讨论在漏洞管理背景下，你应该熟悉的一些最重要的监管要求。以下三个标准涵盖了从完全可选到法律要求的各种范围。\n\n#### ISO/IEC\
  \ 27001 标准\n\n国际标准化组织（`ISO`，尽管缩写顺序有明显差异）和国际电工委员会（`IEC`）共同维护着多项标准，包括 `27001`，它涵盖了信息安全管理体系（`ISMS`）。`ISO/IEC\
  \ 27001` 认为是世界上最流行的自愿安全标准，涵盖了开发和维护良好信息安全的每一个重要方面。其规定之一（位于控制编号 `A.12.6.1` 中）涉及漏洞管理。\n\
  \n该控制措施的实施是认证的依据，它本质上表示组织有一套记录在案的流程，用于及时识别和缓解已知漏洞。`ISO/IEC 27001` 认证由独立的认证机构提供，分三个阶段进行。第一阶段是现场审核，验证组织拥有一套管理漏洞的合理记录流程。第二阶段是实施审计，旨在确保记录在案的流程正在被执行。最后是监督审核，确认该流程继续得到遵守并不断改进。\n\
  \n#### 支付卡行业数据安全标准\n\n支付卡行业数据安全标准（`PCI DSS`）适用于任何涉及使用五大发行机构（`Visa`、`MasterCard`、`American\
  \ Express`、`Discover` 和 `JCB`）品牌的信用卡支付的组织。这些组织各有自己的供应商安全要求，因此它们在 2006 年共同努力并在整个行业范围内实现了标准化。`PCI\
  \ DSS` 定期更新，截至本书时版本为 `3.2`。\n\n`PCI DSS` 的要求 `11` 涉及“定期测试安全系统和流程”的义务，第 `2` 部分描述了漏洞扫描的要求。具体而言，它规定组织每季度必须执行两种漏洞扫描：内部和外部。区别在于，内部扫描使用组织的合格成员，而外部扫描必须由批准的扫描供应商（`ASVs`）执行。重要的是，组织必须能够证明参与扫描的人员具备所需的所需的专业知识。要求\
  \ `11` 还规定，当系统或流程发生重大变化时，必须执行内部和外部漏洞扫描。\n\n最后，`PCI DSS` 要求任何通过任一类型扫描发现的“高风险”漏洞都得到解决。解决后，需要再次进行扫描以证明风险已得到适当缓解。\n\
  \n#### 健康保险可携带性与责任法案\n\n健康保险可携带性与责任法案（`HIPAA`）对未能保护受保护健康信息（`PHI`）的覆盖实体规定了罚款（范围从\
  \ 100 美元到 150 万美元）。尽管 `HIPAA` 没有明确提出要求进行漏洞评估，但第 `164.308(a)(1)(i)` 部分要求组织进行准确且彻底的漏洞评估，并实施足够的安全措施，将所评估漏洞带来的风险降低到合理水平。任何违反本法案规定的组织，无论是故意、疏忽还是无知，都面临巨额的民事罚款。\n\
  \n![Images](img/00005.jpeg)\n\n**考试贴士** 你不需要背诵 `ISO/IEC 27001`、`PCI DSS` 或 `HIPAA`\
  \ 的规定，但你需要知道存在要求漏洞管理的监管环境。虽然这些示例是为了说明考试要求，但对它们稍加熟悉将会有帮助。\n\n### 企业安全策略\n\n\n\n\n\
  \n`企业安全策略` 是由高级管理层（或选定的策略委员会或小组）制定的总体通用性声明，规定了安全在组织中所扮演的角色。安全策略可以是组织级的、特定问题的或特定系统的。在在组织级安全策略中，管理层建立了安全计划将如何建立、列出计划目标、分配职责、展示安全的战略和战术价值，并概述应如何进行执行。特定问题策略（也称为`功能性策略`）旨在解决管理层认为需要更详细说明和关注的特定安全问题，以确保建立全面的结构并让所有员工理解他们应如何遵守这些安全问题。特定系统策略则呈现了管理层针对实际计算机、网络和应用的特定决策。\n\
  \n通常，组织会有一项涵盖漏洞管理的特定问题策略，但重要的是要注意，该策略嵌套在更广泛的企业安全策略之中，并可能与特定系统策略相关联。关键点在于，仅仅在真空状态下理解漏洞管理策略（或在策略不存在时开发一个）是不够的。我们必须理解该过程发生的组织安全背景。\n\
  \n### 数据分类\n\n应附加到所有数据中的一个重要元数据项是分类级别。该分类标签对于决定我们应用于信息的保护控制措施至关重要。为不同类型的数据分配值的原理是，它使公司能够评估投入到保护每种类型数据的资源，因为并非所有数据对公司的来说价值都是相同的。组织应该使用的分类级别没有硬性规定。典型的分类级别包括以下：\n\
  \n* `私有`：发生不当披露可能引发个人隐私问题的信息\n* `机密`：可能对组织造成严重损害的数据\n* `专有（或敏感）`：可能导致某些损害的数据，例如导致组织失去竞争力\n\
  * `公开`：发布后对组织不会产生不利影响的数据\n\n每个分类都应该是唯一的，与其他相互分离，并且不应有任何重叠的影响。分类过程还应该概述信息在整个生命周期内（从创建到终止）是如何被控制和处理的。以下列表显示了组织可能用于确定数据敏感性的一些标准参数：\n\
  \n* 数据泄露可能造成的损害程度\n* 数据被修改或损坏时可能造成的损害程度\n* 如果数据不可用或损坏，可能产生的机会机会成本\n* 保护该数据的法律、监管或合同责任\n\
  * 数据对安全的影响\n* 数据的存储时长\n\n### 资产清单\n\n你无法保护你不知道拥有的东西。虽然资产盘点并不是我们大多数人认为光光的事的事，但它仍然是管理信息系统漏洞的一个关键方面。事实上，安全的这一方面如此重要，以至于它显著地列在互联网安全中心（CIS）关键安全控制措施（CSC）列表的最顶部。`CSC\
  \ #1` 是授权和未授权设备的清单，而 `CSC #2` 处理的是运行在这些设备上的软件。\n\n然而，请记住，资产是对组织具有任何价值的任何物品。除了硬件和软件之外，这还包括人员、合作伙伴、设备、设施、声誉和信息。出于\
  \ `CSA+` 考试的目的，我们重点关注硬件、软件和信息。你会注意到，确定资产的价值可能是困难的，而且往往具有主观性。在漏洞管理的语境下，`CSA+` 考试仅要求你决定如何处理关键和非关键资产。\n\
  \n### 关键资产\n\n`关键资产`是指执行你组织主要功能绝对必需的任何东西。如果你在在线零售商工作，这组资产将包括你的 Web 平台、数据服务器和财务系统等。它可能不包括你的\
  \ Web 开发人员使用的工作站或打印机。显然，关键资产在管理漏洞方面需要更高程度的关注。这种关注可以通过许多不同的方式表达，但你应该至少关注两点：每次漏洞扫描的彻底性和每次扫描的频率。\n\
  \n### 非关键资产\n\n`非关键资产`虽然有价值，但对于完成组织的主要任务来说并非必须。你仍然需要将这些资产包含在漏洞管理计划中，但考虑到我们所有人处理的资源有限，你对它们的优先级排序将低于关键资产。\n\
  \n![Images](img/00005.jpeg)\n\n**考试贴士**：每一项安全决策——包括如何、何时以及何地进行漏洞评估——必须考虑这些控制措施和活动对组织核心业务的影响。\n\
  \n## 常见漏洞\n\n大多数威胁者并不想比他们必须做的付付出更多努力。除非他们专门针对你的组织，否则切断通常的利用手段通常就足够他们转向其他处更容易获取的果实了。幸运的是，我们非常了解许多组织在保护系统方面所犯的错误，因为遗憾的是，我们一次又一次看到相同的问题。在深入研究特定类型平台的常见缺陷之前，这里是一些适用于大多数（并非所有）系统的缺陷：\n\
  \n* `缺失补丁/更新`：系统可能由于各种原因缺少补丁或更新。如果原因是合法的（例如，无法离线的工业控制系统），那么该漏洞应被记录、跟踪并使用替代控制措施进行缓解。\n\
  * `防火墙规则配置错误`：无论设备是否自带防火墙，跨网络访问它的能力（这应该通过防火墙或其他分割手段进行限制）往往是缺失的。\n* `弱密码`：我们最喜欢的例子是一个由高技能的安全运营人员团队为演练部署的边缘防火墙。然而，该团队未能遵循自己的检查清单，并且由于专注于加固其他设备，以至于忘记了更改边缘防火墙的默认密码。\n\
  \n### 服务器\n\n服务器上看到的最常见的漏洞可能源于对服务器在网络中用途的跟踪，并允许其运行不必要的的服务和开放端口。许多服务器的默认安装包含了数百个甚至数千个应用程序和服务，其中大多数对于服务器的主要用途来说并不是真正需要的。如果这些额外软件不被移除、禁用或至少不被加固和记录，那么保护服务器可能会变得困难。\n\
  \n\n\n\n\n另一种常见的漏洞是服务的配置错误。大多数产品提供的功能远超实际需求，但我们中的许多人简单地忽略了这些“额外”功能，而专注于配置关键功能。如果这些额外功能允许攻击者通过利用我们甚至未察觉的合法系统功能来轻松获取立足点，那么这些功能就会反过来困扰我们。解决这个问题的办法是确保我们完全了解部署在网络上的任何设备的完整功能集，并禁用任何我们不需要的功能。\n\
  \n***\n\n![Images](img/00009.jpeg)\n\n**注意** 网络设备是专门设计用于执行一个或多个功能（如代理网络流量或提供文件）的计算机。它们通常会表现与其他服务器相同的漏洞，尽管\
  \ IT 人员可能会忽视对其进行安全防护或补丁的需求。\n\n## 终端 (Endpoints)\n\n终端几乎总是终端用户设备（移动或其他）。它们是攻击者进入我们网络最常见的入口，而最常见的向量是电子邮件附件和网页链接。除了之前讨论的常见漏洞（特别是更新/补丁）外，终端最常见的问题是缺乏最新的恶意软件防护。当然，这只是最低标准。我们真的应该努力实现更先进的、中心化管理的基于主机的安全系统。\n\
  \n终端的另一种常见漏洞是系统配置错误或默认配置。尽管大多数现代操作系统都注重安全性，但它们往往倾向于功能性。对卓越用户体验的追求有时会付出高昂代价。为了应对这种漏洞，你应该拥有基准配置，并由你的扫描工具定期进行验证。这些配置反过来由组织的风险管理流程以及任何适用的法规要求驱动。\n\
  \n## 网络基础设施 (Network Infrastructure)\n\n最常见的漏洞网络基础设施组件也许是无线接入点 (WAPs)。特别是在员工可以携带（并连接）自己的设备的环境中，要在安全性和功能之间取得平衡是具有挑战性的。需要指出的是，有线等隐私\
  \ (WEP) 协议至少从 2004 年起就被认为是不安全的，我们的网络中没有立足之地。（信不信，我们仍然在小型组织中看到它们。）为了获得最佳效果，请使用 Wi-Fi\
  \ 安全访问 2 (WPA2) 协议。\n\n即使你的 WAP 已经安全（从电子和物理上），除非你采取措施防止这种情况发生，否则任何人都可以将恶意 WAP 或任何设备连接到你的网络。IEEE\
  \ 802.1X 标准为有线和无线设备都提供了基于端口的网络访问控制 (NAC)。通过 802.1X，任何想要连接到网络的客户端必须先进行身份验证。通过该验证，你可以提供非常细粒度的访问控制，甚至要求终端满足补丁/升级要求。\n\
  \n## 虚拟化基础设施 (Virtual Infrastructure)\n\n虚拟化正日益在我们的系统中变得无处不在。虚拟计算最大的优势之一是它的效率。我们的许多物理网络设备有很大一部分时间处于闲置状态，因此利用率不足，如图\
  \ 5-1 中的 Mac OS 工作站所示。即使其他设备过度使用并成为性能瓶颈，情况也是如此。通过将设备虚拟化并将它们放在相同的共享硬件上，我们可以降低成本来平衡负载并提高性能。\n\
  \n![Images](img/00034.jpeg)\n\n***\n\n**图 5-1** 显示 CPU 使用率的 Mac OS 性能监控应用程序\n\n\
  除了节省成本和提高配置需求的响应速度外，这项技术还承诺提供更级别的安全性——当然，前提是我们的操作得当。问题在于，通过将以前相互独立的物理设备放在同一个主机上并在软件中控制系统，我们允许虚拟机程序中的软件漏洞可能允许攻击者从一个虚拟机跳转到另一个一个虚拟机。\n\
  \n### 虚拟主机 (Virtual Hosts)\n\n虚拟主机的常见漏洞与我们在前面的章节中讨论的服务器和终端中的漏洞无异。然而，主机的虚拟化带来了一些自身的潜在漏洞。其中最主要的是虚拟机\
  \ (VMs) 的泛滥。与物理对应设备不同，虚拟机可以很容易倍增。我们看到许多组织有成百上千个处于不同使用和/或损坏状态的虚拟机遍布各地。这通常发生在需求发生变化时，直接复制现有的虚拟机比从头开始要容易得多。最终，一个或两个虚拟机被遗忘了，但没有被妥善处理。虽然大多数这些虚拟机处于挂起或关闭状态，但看到安全性较差的虚拟机在无人跟踪的情况下运行也并不罕见。\n\
  \n虚拟机理上应该与它们运行的主机操作系统完全完全隔离。这之所以重要的原因之一是，如果虚拟机中的某个进程能够突破这种隔离并直接与主机交互，那么该进程将访问该主机上运行的任何其他虚拟机，并且可能具有很高的权限。虚拟化环境（或*虚拟机程序\
  \ (hypervisor)*）负责执行这一属性，但与任何其他软件一样，其中可能存在可被利用的漏洞。事实上，常见漏洞和披露 (CVE) 列表包含了几个此类漏洞。\n\
  \n### 虚拟网络 (Virtual Networks)\n\n虚拟网络通常以两种方式实现：通过虚拟机程序内部的网络虚拟化软件在主机内部实现，通过使用如二层隧道协议\
  \ (L2TP) 等协议从外部实现。在本节中，我们处理内部虚拟网络中常见的漏洞，并将外部虚拟网络的讨论推到稍后的章节。\n\n如前所述，虚拟机程序中的漏洞将允许攻击者逃离虚拟机。一旦离开机器，攻击者就可以访问由虚拟机程序实现的虚拟网络。这可能导致窃听、修改网络流量或拒绝服务。尽管如此，在编写期间，除了我们在讨论虚拟机常见漏洞时已经提到的之外，针对虚拟网络的已知实际威胁非常少。\n\
  \n### 管理接口 (Management Interface)\n\n由于虚拟设备没有物理形态，必须有一种机制让我们能够执行在服务器背面插入以太网线或添加内存的虚拟操作。这些功能以及许多其他功能都是通过虚拟化工具的管理接口实现的，这些接口通常允许管理员远程访问。这些接口最常见的漏洞是配置错误。如果不是严格遵守安全技术实施指南，即使是称职的技术人员也会忘记加固或正确配置这一关键控制设备。\n\
  \n### 移动设备 (Mobile Devices)\n\n有一句著名的格言说，如果我能获得你设备的物理访问权限，你几乎无法做任何事情来保护它。这凸显了所有移动设备最常见的漏洞：盗窃。我们必须假设每个移动设备某一天会被不应该访问它的人拿走（永久或临时）。那么还拥有什么呢？\n\
  \n\n\n\n\n尽管弱密码是我们所有信息系统各个部分的共同漏洞，但移动设备面临的问题甚至更为严峻，因为这些设备频繁使用短数字代码而不是密码。即使设备被配置为在尝试次数达到上限后自动擦除数据（这种做法远非普及），但也有多种记录在案的方法可以穷举式地尝试所有可能的组合，直到找到正确的一个为止。\n\
  \n移动设备的另一个常见漏洞是其加载新软件的应用商店。尽管 `Google` 努力利用其 `Google Bouncer` 技术来降低风险，但其商店仍然是许多恶意应用程序的来源。更糟糕\
  \ true 的问题是，`Android` 应用程序可以从任何商店甚至网站加载。许多寻找酷炫应用并可能试图规避费用的用户会求助于这些来源不靠的渠道。虽然 `iOS`\
  \ 用户受到了来自 `Apple` 生态系统的良好保护，但他们也无法完全幸免，特别是当他们对设备进行越狱（jailbreak）处理时。\n\n最后，尽管缺乏补丁/更新是所有设备的共同漏洞，但移动设备（`iOS`\
  \ 除外）在升级方式和升级时间上受到限制。这些限制是由运营商施加的。我们见过某些手机运行着三年前的 `Android` 版本，并且完全无法升级。\n\n###\
  \ 互联网络\n\n2013 年底，零售巨头 `Target` 向全世界揭示了互联网络的危险性。近期历史上最大的数据泄露事件之一并不是通过直接攻击该零售商实现的，而是利用一个供暖、通风和空调（`HVAC`）供应商的网络作为切入点。该供应商可以访问\
  \ `Target` 商店的网络以监控和管理 `HVAC` 系统，但安全人员并未充分考虑这种互联所带来的漏洞。在一个日益互联和相互依赖的世界里，我们都应该审视一下我们的合作伙伴中哪些可能为攻击者提供了快速进入我们系统的途径。\n\
  \n### 虚拟专用网络\n\n虚拟专用网络（`VPNs`）连接两个或多个物理上属于不同网络的设备，并允许它们像连接到同一个局域网（LAN）一样交换数据。这些虚拟网络以某种方式封装在其他网络内部，将\
  \ `VPN` 的流量与底层网络的流量隔离开来。这是通过多种协议实现的，包括互联网协议安全（`IPSec`）的第二层隧道协议（`L2TP`）、传输层安全协议（`TLS`）以及许多\
  \ `Cisco` 设备使用的数据报传输层安全协议（`DTLS`）。这些协议及其实现在很大程度上是相当安全的。\n\n***\n\n![Images](img/00009.jpeg)\n\
  \n**注意** 在考虑 `VPN` 漏洞时，我们专门关注使用 `VPNs` 将远程主机连接到公司网络。我们不讨论使用 `VPNs` 来保护连接到不可信网络（例如，咖啡馆的\
  \ `WLANs`）的移动设备，或者泛泛地确保网络流量的个人隐私。\n\n`VPNs` 的主要漏洞在于它们可能允许我们执行的操作：将不可信的、未打补丁的甚至可能被感染的主机连接到我们的网络。第一个风险来自于允许哪些设备连接。某些组织要求\
  \ `VPN` 客户端软件只能安装在组织拥有并管理的设备上。如果情况并非如此，任何用户只要拥有凭据就可以连接任何设备，那么暴露的风险就会显著增加。\n\n另一个问题（官方设备可以缓解，但个人设备可能较难完全缓解）是设备的补丁/更新状态。如果我们在开发安全架构方面做得很好，但随后让未打补丁的设备连接上去，我们就是在为攻击者提供一种方便的方法，使我们的许多控制措施失效。缓解这种风险的最佳实践是实施网络访问控制（`NAC`）解决方案，在允许设备加入网络之前，积极检查设备的补丁、更新和任何必要的其他参数。许多\
  \ `NAC` 解决方案允许管理员将不合规的设备放在“访客”网络，以便它们下载必要的补丁/更新并最终被允许进入。\n\n最后，对于那些“离开”一段时间后通过 `VPN`\
  \ 回到我们网络的设备，我们无法知道它们是否已被破解。即使它们没有传播恶意软件或未被用作深度渗透系统的跳板，这些设备获取的任何数据都会受到未经授权第三方的监控。同样，源自此类受损主机的任何数据本质上都是不可信的。\n\
  \n### 工业控制系统\n\n工业控制系统（`ICSs`）是一种允许专用软件控制系统物理行为信息物理系统。例如，`ICSs` 用于自动汽车装配线、建筑电梯甚至\
  \ `HVAC` 系统。典型的 `ICS` 架构如图图 5-2\n\n***\n\n**图 5-2** 简单的工业控制系统 (`ICS`)\n\n运行 `ICS`\
  \ 的大部分软件被固化在可编程逻辑控制器（PLC）等设备的固件中，例如运行 Stuxnet 的铀浓缩离心机。这是一个漏洞来源，因为更新这种软件通常无法自动或集中地进行。补丁和更新本身已经很少发生，而且通常需要将设备离线并由合格的技术人员进行手动更新。考虑到涉及的成本、精力以及对业务流程的影响，获悉许多\
  \ `ICS` 组件从未更新或打过补丁并不令人意外。更糟糕的是，供应商以臭名昭著的不提供补丁，即使漏洞被发现并公开也是。在 2016 年的 `ICS` 安全报告中，`FireEye`\
  \ 描述了 1552 个已知的 `ICS` 漏洞中有 516 个没有可用的补丁。\n\n`ICSs` 的另一个常见漏洞是密码。与本章之前提到的此类问题不同，这里的问题不是用户选择了弱密码，而是\
  \ `ICS` 设备的制造商在固件中设置了简单的密码，并进行了记录使得所有用户（以及可能存在的攻击者）都知道它是什么，有时甚至非常困难或无法更改。在许多记录在案的案例中，这些是以明文存储的。\n\
  \n### SCADA 设备\n\n\n\n\n数据采集与监控控制（SCADA）系统是一种特定的工业控制系统（ICS），其特点是覆盖大范围地理区域。ICS 通常控制单栋建筑或小型园区内的物理过程和设备，而\
  \ SCADA 系统则用于跨越数百或数千英里的管道和输电线路。SCADA 最常见于能源（例如石油或电力）和公用事业（例如水水务或下水道）应用。SCADA 系统的通用架构如图图\
  \ 5-3\n\n***\n\n**图 5-3** SCADA 系统的典型架构\n\n除了 ICS 中发现的漏洞外，SCADA 系统还引入了两种更为常见的漏洞。第一种是由远距离通信链路引起的。多年来，大多数使用\
  \ SCADA 系统的组织依赖于相关通信协议和无线频率的相对隐蔽性来提供某种程度（或至少是幻想）的安全性。在针对 SCADA 系统的最早网络攻击案例中，2001\
  \ 年一名寻求报复的澳大利亚男子将一个非法无线电收发机连接到 RTU，故意导致数百万加仑的污水溢入当地公园和河流。尽管无线系统已大部分实现现代化并加固，但它们仍然存在潜在的漏洞。\n\
  \n第二种弱点是 SCADA 系统特有的，即对孤立且无人设施的依赖。这些远程站点为攻击者提供了物理访问系统组件的机会。尽管这些站点现在大多受到摄像头和报警系统的保护，但由于其偏远性，响应速度比大多数其他信息系统要慢得多。\n\
  \n## 漏洞扫描频率\n\n面对这些非常特定的漏洞，我们应该多久检查一次？正如你可能猜到的那样，这个问题没有通用的答案。需要记住的重要问题是`process`（过程）本身。如果你以随机间隔随意进行漏洞扫描，要回答你的漏洞管理是否有效将变得困难得多。相反，如果你提前计算，并根据你的假设和需求列表确定各种扫描的频率和范围，你将对自己的安全态势有更多的控制。\n\
  \n#### 风险偏好\n\n组织的 `risk appetite` 是其高级管理人员愿意承担的风险程度。你永远无法将风险降为零，因为总会有某些或某事会对你的组织造成损失。此外，当你试图降低风险时，你会迅速接近收益递减点。\n\
  \n当你开始缓解风险时，你会经历一个阶段，通过一些常识和廉价的控制措施就可以减少许多风险。当你开始耗尽这些“易得的果实”后，成本（例如财务和机会成本）将开始迅速增加。你将达到一个点，进一步的缓解将变得相当昂贵。“太贵了”到什么程度取决于你组织的风险偏好。\n\
  \n至于漏洞扫描的频率，并不简单是在风险偏好低时就做得更多，反之亦然。风险是一个刻意的过程，它量化了威胁实现的可能性以及对组织产生的净影响。某些威胁（如飓风和地震）无法通过漏洞扫描来缓解。[注：源文件中的截断的文本已按照指令保留]。\n\
  \n\n\n在配置扫描工具时，你有许多不同的考虑因素，但在这里我们重点关注 CSA+ 考试要求你掌握的几个主要点。然而，此列表并非详尽，你可能还需要根据针对你所属组织或行业的特定问题来不断扩充。\n\
  \n### 敏感性级别\n\n在本章较早之前，我们讨论了应该对数据和信息分配的不同分类，以及我们其他资产的关键性水平。现在我们回到这些概念，思考如何配置工具，使其在完成工作的同时，能够恰恰好处地保护我们的资产。当涉及系统中的信息时，我们必须非常仔细确保所需的保护措施始终到位。例如，如果我们正在扫描一个受\
  \ `HIPAA` 监管的组织，我们应该确保评估过程中的任何操作都不会以任何方式损害受保护的健康信息 (`PHI`)。我们见过某些漏洞评估包含一些证明材料，例如通过利用安全漏洞获取的示例文档。显然，在我们讨论的场景中，这种做法是不可取的。\n\
  \n除了保护信息外，我们还需要保护存储这些信息的系统。之前我们讨论了关键和非关键资产，其背景是将注意力集中在关键资产上。现在我们对这一观点进行补充：我们应该以确保这些资产对于业务或其他最初使其关键的流程保持可用方式进行扫描。如果一个组织每秒处理数千美元，而我们的扫描导致其速度下降一个数量级，即使只有几分钟，结果也可能是重大的收入损失，且可能很难向董事会解释。理解这些资产的性质和敏感性可以帮助我们识别出将其风险降至最低的工具配置，例如安排在没有交易的特定时间窗口内进行扫描。\n\
  \n### 漏洞馈源\n\n除非你在政府情报机构工作，否则你对漏洞的了解大部分来自商业或社区馈源。这些服务的更新周期从几小时到几周不等，尽管它们最终会趋同于大多数已知的漏洞，但某个馈源可能会比另一个早得多发布某个威胁。如果你运行每小时一次的扫描，那么你显然会从更快的服务中受益，并可能认为更高的成本具有合理性。相反，如果你的扫描是每周、每月甚至每季度一次，那么这种差异可能没有那么显著。根据经验，你希望漏洞馈源的频率与你自己的扫描周期相当。\n\
  \n如果你的漏洞馈源不是具有快速更新周期的类型，或者你想确保自己完全掌握最新发现的漏洞，你可以（也许也应该）在提供者的提示之外额外订阅提醒。由美国国家标准与技术研究院\
  \ (`NIST`) 维护的国家漏洞数据库 (`NVD`) 提供两个富站点摘要 (`RSS`) 馈源，其中一个会提醒你任何报告的新漏洞，另一个则仅提供经过分析的漏洞。第一个馈源的优势在于你处于通知的最前沿。第二个的优势在于它向你提供了受影响的具体产品以及额外的分析。许多其他组织提供类似的馈源，你可能也应该探索一下。\n\
  \n假设你已经订阅了一个或多个馈源（除了你的扫描产品馈源之外），你可能会在两次计划扫描之间获知漏洞。当这种情况发生时，你必须考虑是运行一次计划之外的扫描来寻找该特定漏洞，还是等到下一次计划事件时再运行测试。如果该漏洞关键到足以立即采取行动，你可能需要从服务提供商处获取信息，或者如果不行，则编写自己的插件来测试该漏洞。显然，这需要大量的资源，因此你应该有一套流程，作为漏洞管理计划的一部分做出此类决策。\n\
  \n### 范围\n\n无论是运行计划扫描还是特殊扫描，你都必须仔细定义其范围并妥善配置工具。虽然按照固定的间隔一次性扫描所有内容更简单，但现实情况是，由于对关键节点（甚至是整个系统）造成的负载，这往往是不可能的。更有效的方法是运行一系列扫描，每个扫描具有不同的范围和参数。\n\
  \n无论你是进行全局扫描还是针对性扫描，你的工具都必须知道哪些节点需要测试，哪些应该忽略。将被评估的设备集合构成了漏洞扫描的范围。刻意界定这些事件的范围对于许多原因都很重要，但最重要的之一是对凭据的需求，我们将在下讨论。\n\
  \n### 有凭据与无凭据扫描\n\n无凭据的漏洞扫描从外部人员的视角评估系统，例如刚刚开始与目标交互的攻击者。这是一种黑盒测试，扫描工具无法获取目标的任何特殊信息或访问权限。这种方法的优势是它通常更快，同时仍然具有很强的真实性。它可能更安全一点，因为不需要在所有测试设备上提供额外的凭据。当然，缺点是你很可能无法对目标进行全覆盖。\n\
  \n* * *\n\n![Images](img/00005.jpeg)\n\n**考试提示**：无凭据扫描从攻击者的角度查看系统，但没有有凭据扫描那样彻底。\n\
  \n为了真正了解主机中所有存在的漏洞，你通常需要为工具提供凭据，使其远程登录并检查内部和外部。有凭据的扫描总是比无凭据的扫描更彻底，仅仅是因为登录为工具提供了额外信息。这种额外的彻底性对你是否重要，由你和你的团队来决定。有凭据扫描的一个额外益处是它们倾向于减少完成评估所需的网络流量。\n\
  \n* * *\n\n![Images](img/00009.jpeg)\n\n**注意**：执行漏洞扫描极少需要全域管理员凭据。如果你正在进行有凭据扫描，除非你确定无法其他无法满足需求，否则应避免使用特权账户。\n\
  \n### 基于服务器与基于代理\n\n漏洞扫描器通常分为两类架构：一种需要在每个扫描设备上运行进程（`代理`），另一种则不需要。差异如图 5-4（part0014.html#ch5fig4）所示。基于服务器（或无代理）的扫描器将所有数据和处理集中在一个或少数扫描主机上，这些主机需要大量的网络带宽来运行扫描。它的组件较少，可能使维护任务变得更容易并提高可靠性。此外，它可以检测并扫描连接到网络但未运行代理的设备（例如新主机或流氓主机）。\n\
  \n![Images](img/00037.jpeg)\n\n* * *\n\n图 5-4：基于服务器和基于代理的漏洞扫描器架构\n\n\n\n\n- 基于代理的扫描器在每个受保护的主机上运行代理，并将扫描结果报告给中心扫描器。由于仅传输扫描结果，这种架构方法所需的带宽远少于基于服务器的解决方案。此外，由于代理在每个主机上持续运行，即使移动设备未连接到公司网络，仍然可以对其进行扫描。\n\
  \n![Images](img/00005.jpeg)\n\n**考试贴士**：基于代理的（或无服务器的）漏洞扫描器通常适用于扫描移动设备。\n\n### 数据类型\n\
  \n最后，在配置扫描工具时，你必须考虑报告中应该或必须包含的信息，特别是在处理监管合规性扫描时。这些信息将驱动你的扫描必须收集的数据，反过来又影响工具的配置。请记住，每份报告（一次扫描可能会产生多个报告）都是针对特定受众的。这既影响了报告中的信息，也影响了信息的呈现方式。\n\
  \n### 工具更新与插件\n\n漏洞扫描工具通过对比已知漏洞列表进行系统测试来工作。这些漏洞经常被供应商和安全研究人员发现。理所当然，如果你不更新列表，无论你使用什么种工具，最终都无法检测出他人（尤其是你的对手）已已的漏洞。这就是为什么保持工具更新至关重要的原因。\n\
  \n漏洞扫描器插件是一个用于寻找特定漏洞的简单程序。在 `Nessus` 中，插件使用 Nessus 攻击脚本语言 (`NASL`) 编写，这是一种非常灵活的语言，能够执行几乎可以想象的所有检查。图\
  \ 5-5 显示了一个 `NASL` 插件的一部分，用于测试允许匿名连接的 `FTP` 服务器。\n\n![Images](img/00038.jpeg)\n\n\
  **图 5-5**：测试匿名 FTP 登录的 NASL 脚本。\n\n### SCAP\n\n问题：无论使用什么扫描工具，如何确保你的漏洞管理流程符合所有相关的监管和策略要求？毕竟，每个工具都可能使用其开发者所需的任何标准（例如规则）和报告格式。这种标准化的缺乏导致美国国家标准技术研究院\
  \ (`NIST`) 与行业伙伴合作，开发了安全内容自动化协议 (`SCAP`)。SCAP 是一种使用特定标准对组织信息系统的漏洞进行评估和报告的协议。目前版本为\
  \ 1.2，它包含了大约十个不同的组件，将从资产报告格式 (`ARF`) 到常见漏洞和暴露 (`CVE`) 再到常见漏洞评分系统 (`CVSS`) 的所有内容进行了标准化。\n\
  \nSCAP 的核心利用了 `NIST` 及其合作伙伴开发的基准，这些基准定义了漏洞管理的最低标准。例如，如果你想确保你的 `Windows 10` 工作站符合联邦信息安全管理法\
  \ (`FISMA`) 的要求，你会使用捕捉这些要求的适当 `SCAP` 模块。然后你将该模块提供给经过认证的 `SCAP` 扫描器（如 `Nessus`），它就能用标准语言报告这种合规性。正如你所看到的，SCAP\
  \ 实现了漏洞管理流程的完全自动化，特别是在监管环境中。\n\n### 权限与访问\n\n除了已经讨论过的凭证扫描考虑因素外，扫描工具必须在运行的任何主机上都具有正确的权限，并具有跨网络基础设施的必要访问权限。通常做法是为扫描工具设置一个专用账户，或者在负责运行扫描的用户上下文中执行。无论在哪种情况下，都应该使用最小权限账户以降低风险（即，除非别无选择，否则不要以\
  \ `root` 身份运行扫描器）。\n\n网络访问也是一项重要的配置，与其说是工具的，不如说是基础设施的。由于漏洞扫描是经过提前计划的，因此应该检查网络并确定需要修改哪些访问控制列表\
  \ (`ACLs`) 以允许扫描器工作。同样，网络 `IDS` 和 `IPS` 可能会由于扫描活动而触发，除非它们已配置为识别其为合法活动。这对于基于主机的安全系统\
  \ (`HBSSs`) 也是，它们可能会尝试缓解扫描的影响。\n\n最后，工具可能包含一个报告模块，必须为该模块设置正确的权限。讽刺的是，有些组织部署了漏洞扫描器，但未能妥善保护报告接口。这导致本应未授权的用户可以随意查看报告。虽然这似乎是一个很小的风险，但请考虑一下对手能够读取你的漏洞报告的后果。这种能力将为他们节省大量精力，因为他们可以专注于你已经列出为有漏洞的目标。作为额外奖励，他们将确切知道如何攻击这些主机。\n\
  \n### 本章总结\n\n本章重点关注开发审慎、可重复的漏洞管理流程，以满足所有内部和外部要求。目标是让你作为网络安全分析师，能够提出正确的问题并开发出适当的方法来管理信息系统中的漏洞。当然，并非所有漏洞都是同等的，因此你必须考虑信息的敏感性以及存储和使用这些信息的系统。正如反复提到的，你永远无法消除所有漏洞并将风险降为零。你可以且应该做的是评估并缓解风险，使其符合适用的法律要求，并与高管理层的风险承受能力保持一致。\n\
  \n你需要对组织的运行环境采取整体观点，并根据特定需求调整流程、行动和工具。这包括理解与你的基础设施相关的常见漏洞类型。你还需要理解缓解风险的内部和外部要求。最后，你需要考虑对组织关键流程的影响。毕竟，没有任何组织是为了对其系统运行漏洞扫描而存在的。相反，这些评估是为了支持存在的真实理由。\n\
  \n### 问题\n\n1. **1**: 旨在标准化自动化漏洞评估、管理和合规性的流行框架被称为？\nA. CVSS\nB. SCAP\nC. CVE\nD.\
  \ PCAP\n\n2. **2**: 根据监管机构定义，可能需要限制访问或特殊处理某些数据的系统被称为？\nA. 补偿控制\nB. 国际标准组织 (ISO)\n\
  C. 监管环境\nD. 生产系统\n\n3. **3**: 组织在确定数据分类时*不应*使用以下哪些参数？\nA. 数据泄露时可能造成的损害程度\n\n\n\n\
  \n\n**B.** 保护数据的法律、监管或合同责任\n\n**C.** 数据的事龄\n\n**D.** 已分配的保护数据的控制措施类型\n\n#### 4.\
  \ 组织为了实现其业务目标而愿意接受的风险量的术语是什么？\n**A.** 风险承受度 (Risk appetite)\n**B.** 创新阈值\n**C.**\
  \ 风险饥渴度\n**D.** 风险上限\n\n#### 5. 修复漏洞所需的存储、计算或带宽不足被认为是哪种限制？\n**A.** 组织性限制\n**B.**\
  \ 知识限制\n**C.** 技术限制\n**D.** 风险限制\n\n#### 6. 哪种类型的早期系统使用了*模糊安全*（security through\
  \ obscurity），即错误地依赖不熟悉的通信协议作为安全防护措施？\n**A.** PCI DSS\n**B.** SCADA\n**C.** SOC\n\
  **D.** PHI\n\n#### 7. ICS 和 SCADA 设备补丁和更新发生频率如此之低的原因是什么？\n**A.** 这些设备控制着关键且昂贵的系统，需要持续运行。\n\
  **B.** 这些设备未连接到网络，因此不需要更新。\n**C.** 这些设备不使用常用的操作系统，因此无法更新。\n**D.** 这些设备控制着如 HVAC（暖通空调系统）等不需要安全更新的系统。\n\
  \n#### 8. 在决定漏洞扫描频率时，以下哪项*不是*重要的考虑因素？\n**A.** 安全工程师承担风险的意愿\n**B.** 高级管理人员承担风险的意愿\n\
  **C.** HIPAA 合规性\n**D.** 工具对业务流程的影响\n\n使用以下场景回答问题 9–12：\n某当地医院联系了你们的安全咨询公司，因为他们担心最近有关全国范围内医院网络遭受勒索软件攻击的报告。医院希望了解网络上存在哪些弱点，并就其环境的最佳安全实践获得你们的指导。医院请求你们协助其制定漏洞管理策略，并提供了一些关于其网络的信息。医院为员工提供笔记本电脑，每台设备都可以使用标准基准进行配置。然而，该医院无法为所有人提供智能手机，并允许用户自有设备连接到网络。此外，其员工流动性很大，并依赖\
  \ `VPN` 来访问医院网络。\n\n#### 9. 在查看 `VPN` 日志时，你确认连接的设备中约有一半是用户自有设备。你建议对策略进行以下哪些更改？\n\
  **A.** 无需，`VPN` 中使用的 `IPSec` 提供了强加密，可以防止恶意软件扩散\n**B.** 要求所有员工升级其移动设备上的 Web 浏览器\n\
  **C.** 禁止个人设备上所有的 `UDP` 流量\n**D.** 禁止非公司笔记本电脑和移动设备连接到 `VPN`\n\n#### 10. 你建议在 във环境中使用哪种漏洞扫描器架构？\n\
  **A.** 零客户端\n**B.** 基于服务器的\n**C.** 基于代理的 (Agent based)\n**D.** 基于网络的\n\n#### 11.\
  \ 你预计在医院中主要会发现哪些漏洞？\n**A.** `802.1X` 的配置错误\n**B.** `PLCs` 中的固定密码\n**C.** 缺少 `VPN`\
  \ 客户端\n**D.** 过时的恶意软件签名\n\n#### 12. 下列哪项*不是*你可能禁止用户自有设备的原因？\n**A.** 环境可能禁止此类设备。\n\
  **B.** 对员工的担忧。\n**C.** 无法控制谁可以访问。\n**D.** 组织可能不得不。\n\n### 答案\n1. **B.** `SCAP`（安全内容自动化协议）是一种用于识别缺陷的方法。\n\
  2. **C.** 监管环境是指受法律或法规控制的环境。\n3. **D.** 数据分类决定了所使用的控制措施，反之亦然。\n4. **A.** 风险承受度，或组织愿意承担的风险量，是风险管理和指导的核心考虑因素。\n\
  5. **C.** 由于技术导致执行任务能力的任何限制都是技术限制。\n6. **B.** `SCADA`（监控控制和数据采集）系统存在严重依赖模糊协议的漏洞。\n\
  7. **A.** 中断业务流程涉及的成本和潜在的负面影响通常使这些系统放弃更新。\n8. **A.** 组织愿意承担的风险是决定扫描频率的合法考虑。但只有领导层才能做出决定。\n\
  9. **D.** 通过 `VPN` 允许潜在不可信、未修补且可能被感染的主机网络是不理想的。最佳实践规定 `VPN` 客户端软件应仅安装在组织拥有并管理的设备上。\n\
  10. **C.** 因为每台笔记本电脑都有相同的软件基准，所以基于代理的漏洞扫描器是一个明智的选择。基于代理的扫描器运行在每个主机上的代理程序，并将结果报告给中央扫描器。\n\
  11. **D.** 恶意软件签名在端点上是著名的难题，特别是当它们是便携且未经过妥善管理时。\n\n\n\n\n\n## 12. B. 人员招聘和留存经常被业务领袖引用为允许在公司网络中使用个人移动设备的原因。因此，人员配置方面的考量通常不会成为禁止这些设备的合理理由。\n\
  \n***\n\n# 第 6 章\n## 漏洞扫描\n\n在本章中，你将学习：\n* 执行漏洞扫描的最佳实践\n* 针对未修复漏洞的修复技术\n* 如何审查和解释漏洞扫描报告的结果\n\
  * 漏洞管理中的趋势分析技术\n\n***\n\n*消灭一个错误与建立一个新真理或事实同样有益，有时甚至更有益。*\n— 查尔斯·达尔文\n\n漏洞扫描是网络安全的关键部分。简而言之，它是对你的系统进行自动化安全检查的实践。这些检查通过指出系统的薄弱环节，帮助我们将把精力集中在保护网络上。在许多情况下，这些工具甚至会修复修复。尽管我们提倡定期使用漏洞扫描器，但在开始使用之前，你必须考虑这种做法的一些重要局限性。许多漏洞扫描器在识别弱点方面非常出色，但它们通常是单一用途的工具。具体来说，它们往往缺乏利用漏洞并自动提升到利用阶段的功能。作为防御者，你必须理解，真正的攻击者会将他自己的漏洞扫描结果与其他关于网络的其他信息相结合，制定出如何进入网络的明智计划。此外，这些工具通常无法独立执行任何类型的高级关联分析。你可能需要额外的工具和流程来确定运行网络的整体风险。这不仅是因为网络配置多种多样，还因为其他非技术因素，例如业务需求、运营需求和组织政策。\n\
  \n一个简单的例子可能是，在网络中发现了多个低风险漏洞。尽管漏洞扫描器可能会将这些情况中的每一个归类为“低风险”，但如果没有网络其他区域安全态势的背景，就无法真正理解这些低风险漏洞可能产生的累积效应。事实证明，累积效应可能超过其简单叠加效应的总和。管理员和普通用户的弱密码都是问题，但管理员账户被攻破的潜在影响对组织来说可能大得多。没有任何单一工具能够自动提供这种深度的洞察，因此，了解工具的局限性与了解它们的能力同样重要。\n\
  \n## 执行扫描\n\n现代扫描器无法发现它们未感知或不理解的弱点。虽然它们只能识别自己已知的弱点，但最流行的漏洞扫描器已经积累了巨大的漏洞库。我们将讨论市场上的三种流行的漏洞扫描器：Tenable\
  \ Network Security 的 `Nessus`、Greenbone Network 的 `OpenVAS` 以及 `Nikto Web Scanner`。这些工具可以从外部人员的视角也可以从合法用户的视角扫描你的网络。在后一种情况下，扫描器将执行所谓的*认证扫描*（authenticated\
  \ scan）。进行认证扫描有两种主要方法。第一种是在端点上安装本地代理，以与漏洞扫描服务器同步，并在扫描过程中对端点进行分析。第二种方法是直接向扫描器提供管理员凭据，扫描器将在过程中根据需要调用这些凭据。在评估期间同时使用认证和未认证扫描是良好的做法，因为使用其中一种方法可能会发现另一种方法无法发现的漏洞。\n\
  \n### Nessus\n\n`Nessus` 是一种流行且强大的扫描器，它于 20 世纪 90 年代后期作为一种开源免费工具诞生，此后成为进行漏洞扫描的首选。凭借超过\
  \ 80,000 个插件，`Nessus` 允许用户根据自定义策略在多个网络上调度并执行扫描。你可能记得在我们讨论端口扫描工具时提到过 `Nessus` 包含基本的端口扫描功能。然而，它的真正威力在于其用于漏洞识别、误配置检测、默认密码使用和合规性判定的众多功能。标准安装包含\
  \ `Nessus` 服务器，它将协调漏洞扫描、生成报告并促进漏洞管理功能。它可以位于与 `Nessus` Web 客户端相同的同一台机器上，也可以位于网络其他地方。客户端设计为从\
  \ Web 界面运行，允许管理员使用任何支持 HTML5 的浏览器来操作扫描设置。[图 6-1] 显示了在网络中几个目标上使用的 `Nessus` 架构。位于\
  \ `Nessus` 服务器上的是在对目标进行评估时所使用的各种插件。通过注册机制，Tenable 经常更新这些插件和服务器软件，通常是每天一次。\n\n![Images](img/00039.jpeg)\n\
  \n***\n\n**图 6-1** 针对多个网络目标显示的 Nessus 客户端/服务器架构\n\n假设服务器在与客户端相同的本地机器上运行（这通常是事实），你可以通过将浏览器指向\
  \ `http://localhost:8834` 来访问 `Nessus` Web 界面，如图 [6-2] 所示。当你首次启动 `Nessus` 时，初始配置、注册和更新会有一些延迟。请耐心等待，很快就能准备好进行扫描了。\n\
  \n![Images](img/00040.jpeg)\n\n***\n\n**图 6-2** 从标准浏览器查看初始 Nessus\n\n一旦完成初始设置，你可以从同一个界面指定任何类型扫描的详细信息。默认情况下，最流行的扫描已经启用，但良好的做法是检查所有设置，以确切知道你的网络上将发生什么。[图\
  \ 6-3] 显示了常规设置页面，为扫描的名称和描述提供了空间。在这里创建的扫描可以用于立即或计划的操作。目标可以通过多种方式指定，包括通过单个 IPv4 地址、单个\
  \ IPv6 地址、IPv4 或 IPv6 地址范围或主机。此外，服务器还将正确解释 CIDR 或子网掩码表示法以指定 IPv4 子网。`Nessus` 还提供了一个以\
  \ ASCII 文本格式上传一组特定目标机器的空间，便于重用预填充列表。在此设置屏幕上，你还可以设置扫描调度、调整通知偏好并定义扫描某些技术限制。`Nessus`\
  \ 将某些插件分类为危险，这意味着在某些条件下它们的使用可能会对系统造成损害。当你准备执行扫描时，使用 `Nessus` 的“安全检查”选项可能很有用，以避免潜在的破坏性攻击。我们接下来的几页中逐步介绍如何设置基础扫描。\n\
  \n![Images](img/00041.jpeg)\n\n***\n\n**图 6-3** 在进行漏洞扫描前的 Nessus 配置界面\n\n\n\n\n\n\
  Nessus 在扫描过程中提供了极大的灵活性和深度。你可以配置 Nessus 以传递任何可能有用的凭据。在图 6-4 所示的配置示例中，有空间可以为 Windows\
  \ 主机配置凭据。Nessus 支持为各种云服务、数据库、主机、网络设备和虚拟机管理程序传递身份验证。\n\n![Images](img/00042.jpeg)\n\
  \n**图 6-4**   Nessus 凭据界面\n\n在图 6-5 所示的下一个选项页中，你可以为扫描任务配置合规性检查。默认安装中包含了许多内部开发的、或基于行业最佳实践和基准的预配置检查。作为管理员，你还可以开发并上传自己的自定义配置，称为\
  \ `audit file`（审计文件），用于合规性检查。`audit file` 提供了指令，用于根据合规策略评估终端和网络设备系统的配置，或检测是否存在敏感数据。在使用合规性检查时，你应该注意某些权衡。启用这些检查可能会减慢扫描速度，因为目标系统的更多方面将被检查，而且可能深度更深。在某些情况下，活动扫描可能会降低客户端和目标机器的功能。此外，这些合规性检查还可能被目标视为侵入性的，从而可能触发中间安全设备和终端软件的警报。\n\
  \n![Images](img/00043.jpeg)\n\n**图 6-5**   Nessus 合规检查显示了 AWS 最佳实践审计选项\n\n移动到名为\
  \ `Plugins`（插件）的下一个选项页，你可以看到所有可用扫描插件的状态。Nessus 维护着这些小型程序的库，它们用于检查已知缺陷。插件用 Nessus\
  \ 攻击脚本语言 (`NASL`) 编写，并包含有关漏洞的信息、其修复步骤以及插件用于确定漏洞是否存在的机制。插件通常在漏洞公开披露后 24 小时内发布，并作为\
  \ Nessus 订阅的一部分不断更新。如图 6-6 所示，你可以激活（或停用）扫描所需的任何插件，或者详细了解插件在评估期间具体执行的操作。\n\n![Images](img/00044.jpeg)\n\
  \n**图 6-6**   Nessus 插件选择界面\n\n保存所有必要的设置后，你现在可以开始对目标进行漏洞扫描。\n\n### OpenVAS\n\n开放漏洞评估系统，或\
  \ `OpenVAS`，是一个免费框架，由多个用于漏洞识别和管理的分析工具组成。OpenVAS 是原始 Nessus 项目的分支，于 Tenable 停止 Nessus\
  \ 框架开发后不久启动。OpenVAS 与 Nessus 相似之处在于它支持通过浏览器访问其 `OpenVAS Manager`，该管理器使用 `OpenVAS\
  \ Scanner` 根据一组超过 47,000 个网络漏洞测试 (`NVTs`) 来进行评估。这些 `NVTs` 的结果将发送回 `Manager` 进行存储。你可以使用标准浏览器访问\
  \ `http://localhost:9392` 来访问 OpenVAS 界面。图 6-7 显示了欢迎界面，管理员可以通过该界面访问 `OpenVAS Manager`\
  \ 和 `OpenVAS Scanner` 的所有设置。屏幕右侧还有一个空字段，可启动快速扫描。\n\n![Images](img/00045.jpeg)\n\n\
  **图 6-7**   OpenVAS 欢迎界面\n\nOpenVAS 还提供了扫描中使用的活动 `NVTs` 的详细信息，如图 6-8 所示。你可以看到每个测试的状态，并像\
  \ Nessus 一样，获取测试本身的详情。除了 `NVT` 的摘要外，还会给出一个漏洞评分，以及分配给检测方法的置信度级别。\n\n![Images](img/00046.jpeg)\n\
  \n**图 6-8**   OpenVAS 网络漏洞测试族\n\n### Nikto\n\n`Nikto` 包含在 Kali Linux 发版中，是一个 Web\
  \ 服务器漏洞扫描器。它的主要优势是发现如 SQL 注入和命令注入敏感性、跨站脚本 (`XSS`) 以及服务器配置不当等漏洞。尽管 Nikto 作为一个命令行执行工具缺乏图形界面，但它能够快速地执行数千次测试，并提供有关缺陷性质的详情。图\
  \ 6-9 显示了从命令行执行时可以使用的选项。\n\n![Images](img/00047.jpeg)\n\n**图 6-9**   Nikto 命令行选项\n\
  \n要对 Web 服务器进行扫描，你需要启用 `-host` 选项并指定 IP，如图 6-10 所示。默认情况下，扫描结果将输出到同一个窗口。虽然对于详细分析来说并不实用，但对于快速确认主机状态很有用。通过使用命令行中的其他选项，你可以将结果导出到输出文件以便后续评估。注意输出包含漏洞类型、简要描述以及关于漏洞的任何引用信息。\n\
  \n![Images](img/00048.jpeg)\n\n**图 6-10**   终端窗口中的 Nikto 扫描结果\n\n**考试提示**尽管我们在本章中关注特定的漏洞扫描器，但扫描执行、报告生成和报告分发的流程对于几乎所有类型的漏洞扫描器都是相似的。\n\
  \n![Images](img/00005.jpeg)\n\n### 生成报告\n\n报告生成是事件响应过程的重要部分，对于漏洞管理尤为关键。所有漏洞扫描器都执行某种形式的报告，但并非所有的都带有自定义选项。Nessus\
  \ 以常见格式提供报告，如 PDF、HTML 和 CSV。此外，还可以使用 Nessus 自己的格式。\n\n作为管理员，考虑你的工具能够生成哪些报告以及你可能如何自动化报告过程是非常。将相关信息及时传递给正确的人是成功利用漏洞扫描的关键。\n\
  \n#### 自动化与手动分配\n\n创建报告模板允许你根据漏洞扫描结果快速准备自定义报告，然后将其转发给必要的联系人。例如，你可以让所有 Web 服务器漏洞自动收集并发送给\
  \ Web 服务器管理员。同样，你可以将数据存储违规情况发送给溢出团队以便采取行动。除非只有一个管理员，否则自动化报告交付过程可能有意义，以减轻主管理员管理每个报告的负担。服务管理员可以通过获取与其角色最相关的报告来提高效率。\n\
  \n### 修复\n\n当扫描器发现漏洞时，它会提供尽可能的信息。图 6-11 显示了 OpenVAS 对发现的漏洞提供的详细界面。此界面显示了漏洞的摘要、关注资源的位置、漏洞的影响、发现方式以及任何解决方案或变通方法。\n\
  \n![Images](img/00049.jpeg)\n\n**图 6-11**   OpenVAS 漏洞详情截图\n\n\n\n\n网络漏洞的修复应在发现后尽快进行，但不能由于草率行事而导致情况恶化。有效的修复需要对漏洞进行持续检查，并结合深思熟虑的处理来解决问题，以保持组织资源的机密性和可用性。验证修复的最简单机制是比较连续的漏洞扫描结果，以确定漏洞已通过软件补丁或升级得到解决。许多供应商提供了管理整个补丁过程的解决方案，这种独立的实践方法被称为“补丁管理”。如果需要使用补偿控制，您可以通过在报告中添加备注来向漏洞管理系统提供反馈，或者可以忽略告警。这有助于在您无法应用更新的情况下，记录您为解决问题所采取的行动。\n\
  \n### 优先级排序\n系统管理员很容易被海量的扫描结果搞得不可应交。这时，对漏洞及相关的修复步骤进行优先级排序就会有所帮助。理想情况下，关于如何确定响应优先级的讨论应既包括技术人员的能力，也包括组织的整体业务目标。将关键利益相关者纳入讨论（或者至少让他们了解你们的方法论），将确保确保未来的策略变更能够获得支持。\n\
  \n### 关键性\n对于如何响应扫描结果的决策是由经济因素驱动的；我们用于修复问题的时间、资金或人员都是有限的，因此在做出响应时必须审慎。为了帮助这一点，`Nessus`和`OpenVAS`在结果结果页面上都提供了发现漏洞严重程度的快速视觉参考，如图\
  \ 6-12 所示。对结果进行颜色标记并允许排序将有助于决策者快速关注最关键的问题，并最大限度地利用有限的资源。\n\n![Images](img/00050.jpeg)\n\
  \n**图 6-12** 按严重性排序的 OpenVAS 漏洞扫描结果\n\n用于量化严重性的已知标准是通用漏洞评分系统（CVSS）。作为一个旨在标准化漏洞严重性评分的框架，其模型确保了准确的量化测量，使用户能够更好地理解这些缺陷的影响。通过\
  \ CVSS 评分标准，工业界、学术界和政府部门可以在其社区之间进行清晰的交流。\n\n![Images](img/00005.jpeg)\n\n**考试提示**\
  \ 通用漏洞评分系统（CVSS）是评估漏洞严重性的事实标准。因此，您应该熟悉 CVSS 及其指标组：基本指标（base）、时间指标（temporal）和环境指标（environmental）。\n\
  \n### 实施难度\n由于实施解决方案的困难，您在修复过程中可能会遇到挑战。由于技术原因或成本导致实施严重延迟的情况下，您仍应通过某些补偿控制来实现安全需求的目标。让非技术团队成员加入将有助于在实施主要解决方案的过程中，采纳所开发的任何替代方案。\n\
  \n### 通信/变更控制\n你可以看到，在获得漏洞扫描结果后，管理所采取的行动投入了巨大的精力。虽然从表面上看实施每项建议似乎是个好主意，但我们无法一次性完成。如果没有系统的方法来管理所有必要的安全变更，我们就有可能让自己陷入比开始时更糟的境地。建立正式通信和变更管理程序的目的是确保第一次就做出正确的变更，保持服务可用，并在整个变更过程中高效地使用资源。\n\
  \n### 变更顾问委员会\n许多组织使用变更顾问委员会（`CAB`）来批准公司政策的主要变更，并协助变更管理对变更进行监控和评估。`CAB` 的成员通常包括可能受拟议变更产生不利影响的实体。这些包括客户、经理、技术人员和公司领导层。在召开会议时，委员会成员确保所有拟议的变更都能解决问题，并且从业务和技术角度来看都是合理的。\n\
  \n### 沙箱/测试\n2016 年 9 月，维护广泛使用的 SSL 和 TLS 协议开源实现的 `OpenSSL 项目` 在其定期更新中，发布了一个被他们认为是常规的安全补丁。其中包含的公告表明，在某些情况下，该不安全代码会导致拒绝服务，且其严重性评级为“低”。然而，发现该补丁了另一个另一个严重的漏洞，允许攻击者执行任意代码。现在想象一下，在没有对部分设备或在沙箱进行测试的情况下，直接在大型网络中部署第一个补丁。这不仅会极大地增加你组织的攻击面，还会导致停机，因为你必须多次修补。这说明了在部署到整个企业之前，在安全环境中测试补丁的重要性。\n\
  \n### 修复障碍\n即使是经过利益相关者支持的可靠修复计划，有时也会面临障碍。许多挑战源于对 IT 系统有严重依赖的流程，或未能充分应对变化的技术格局的过时策略在本节中，我们将涵盖修复的一些常见障碍以及我们可能如何避免它们。\n\
  \n### 谅解备录\n谅解备录（`MOU`）概述了所有相关方的职责和预期。与渗透测试一样，漏洞扫描应该有明确定义的范围，以及正式的介入规则（`ROE`），这些规则首先规定了在评估期间以及发现漏洞时可以做什么。例如，在业务用量高峰期间对生产系统进行扫描是不合适的。还可能出现一种情况，如果没有正式的\
  \ `MOU`，将留下太多的模糊性。不难想象，在你的网络上发现漏洞可能会对你未控制的相邻网络产生影响。此外，相邻网络的配置错误可能会直接影响你组织的服务。无论何种情况，涵盖此类条件的\
  \ `MOU` 都将以让所有参与者满意的方式继续进行。\n\n### 服务水平协议\n许多 IT 服务提供商根据与其服务接收方之间现有的服务水平协议（`SLA`）来提供服务。`SLA`\
  \ 是一种合同，可以存在公司内部（例如业务部门与 IT 员工之间），也可以存在组织与外部供应商之间。`SLA` 的存在是为了概述服务提供商的角色和责任，包括他们可以执行的服务限制。除非修复明确包含在\
  \ `SLA` 中，否则不能强制他们执行这些步骤。\n\n#### 组织治理\n\n\n\n\n\n组织用于指导和控制运营的流程和规则体系被称为`企业治理`（corporate\
  \ governance）。企业治理旨在公司利益相关者的优先考虑事项之间达成合理的平衡。在某些情况下，治理可能会中断补救措施的应用，因为这些行动可能会对其他业务领域产生负面影响。这凸显了与公司领导层沟通你的行动的重要性，以便他们可以将补救措施的影响与其他问题一并考虑，从而做出决策。良好的沟通有利于为了公司的最大利益做出及时决策。\n\
  \n## 业务流程中断\n\n应用补丁或采取其他补救措施何时都不合适。高效的业务和工业流程，如准时制生产（just-in-time manufacturing），允许企业缩短流程时间并提高整体效率。这些系统的基础是生产\
  \ IT 系统，这些系统本身已经针对业务进行了优化。然而，一个主要的缺点是，某些系统由于其优化状态，可能更容易受到干扰。这种对整体流程的不可预测性或不稳定性的恐惧，通常足以让公司领导层推迟对生产系统的重大更改，或者完全避免更改。\n\
  \n## 功能退化\n\n虽然网络管理中没有等同于“希波拉底誓言”的规定，但我们必须始终尝试对生产系统“不伤害”。有时，建议的治疗方案（例如由于关键漏洞而对关键系统进行隔离）可能被领导层认为是不可接受的。你和你的领导层愿意承担多少风险是你们组织的决定，但你应该尽可能获得有关漏洞状态的最准确信息。如果你发现某个重要的补救措施在测试环境中破坏了关键应用程序，那么替代方案并不是避免打补丁。相反，你必须设计其他缓解控制来解决漏洞，直到开发出合适的补丁为止。\n\
  \n## 持续扫描与持续监控\n\n如果可行，你应该安排每天进行自动漏洞扫描。根据你运营的网络类型和安全策略，你可能会选择更频繁地执行操作，并始终使用最新版本的扫描工具。你应该特别关注关键漏洞，并目标是在\
  \ 48 小时内修复它们。考虑到维护软件、库和报告对管理员来说可能是枯燥的，一些公司开始提供基于 Web 的扫描解决方案。例如，`Qualys` 和 `Tenable`\
  \ 都提供了云端 Web 应用程序扫描器，可以从任何云服务提供商运行。这些公司承诺在各种规模的网络中提高可扩展性和扫描速度，并根据订阅层级提供多项相关服务。\n\
  \n### 分析漏洞扫描报告\n\n鉴于现代网络的多样性和规模，理解漏洞扫描的输出可能是一项艰巨的任务。幸运的是，像 `Nessus` 这样的工具提供了带有可视化工具及其发现漏洞的技术细节的全面报告。理解漏洞存在的原因以及它们如何被利用将有助于你分析最终的扫描报告。图\
  \ 6-13 显示了 `Nessus` 在漏洞扫描后生成的屏幕。该工具为不同严重程度分配了特定的颜色，并生成简单的图表来指示漏洞的分布。\n\n![Images](img/00051.jpeg)\n\
  \n* * *\n\n**图 6-13** Nessus 报告中按严重程度排序的已发现漏洞列表\n\n### 审查和解释扫描结果\n\n没有任何自动漏洞报告是完全准确的。在将其交给组织中的其他人之前，需要分析师对其进行审查和理解。审查过程最重要的两个结果是识别误报和策略异常。从考虑中移除这些类别的条目后，必须对响应措施进行优先级排序。\n\
  \n### 识别误报\n\n在处理任何类型的扫描器时，在不存在问题的情况下报告问题是一项挑战。漏洞扫描器的误报特别令人沮丧，因为修复可疑问题所需的精力可能耗费大量资源。对于较小的组织来说，2%\
  \ 的误报率可能不是问题，但在具有数千个终端的大型网络上，同样的速率将给安全人员带来重大问题。虽然快速为发现的漏洞产生解决方案很重要，但你应该花时间考虑扫描器为何可能“虚报狼警”。有时检查、`NVT`\
  \ 或插件（`plug-in`）使用的逻辑可能是缺陷的，导致产生可能并不存在的漏洞报告。理解，这些测试是基于对系统的某些假设编写的，可能无法写出完美适用于每个系统的逻辑。\n\
  \n* * *\n\n![Images](img/00009.jpeg)\n\n**注意** 尽管漏洞扫描器在多年来得到了改进，但漏洞扫描器对操作系统和软件的检测并非完美。这使得在具有自定义操作系统和设备的环境中检测变得特别具有挑战性。许多设备使用轻量级的\
  \ `Linux` 和 `Apache` Web 服务器，这些被直接刻在设备的只读内存中。在这些情况下，你应该预期获得更多的警报，因为漏洞扫描器可能无法准确判断是什么种系统。然而，你也应该注意不要立即忽略这些系统上的警报。有时，由于漏洞软件包迁移到新系统的方式，众知的漏洞可能会出现在意想不到的地方。\n\
  \n### 识别异常\n\n即使在网络上也总是存在异常。漏洞测试的作者无法获知你网络的细节，因此他们必须创建有时粒度较低的规则，这可能导致误报。在这种情况下，一旦发现了误报，自定义你自己的测试可能是很有用的。产生误报的另一个原因可能是你已经确定了某个问题的适当补偿控制，但没有正确处理该警报。\n\
  \n### 响应措施的优先级排序\n\n目标是获得有关你网络的最准确信息，因为这意味着对技术人员和公司领导层所做出的决策更有信心。通过准确识别漏洞，并通过通畅的沟通开发并完善了最合适的行动方案，你可以对对整个公司影响最小的响应进行优先级排序。\n\
  \n### 验证结果并关联其他数据点\n\n有了漏洞扫描报告的反馈，可以很容易地验证其结果。图 6-14 显示了位于 `10.10.0.115` 的 Windows\
  \ 主机上与远程桌面功能相关的已发现漏洞的输出。\n\n![Images](img/00052.jpeg)\n\n* * *\n\n**图 6-14** Windows\
  \ 主机上远程桌面协议漏洞详情\n\n发现该协议在身份验证期间加密交换的实现上存在缺陷。作为解决方案，`Nessus` 建议我们要么强制服务使用 `SSL`，要么启用网络级身份验证（Network\
  \ Level Authentication）。当我们切换到 图 6-15 所示的 Windows 主机时，可以看到供我们选择的网络级身份验证选项。\n\n![Images](img/00053.jpeg)\n\
  \n* * *\n\n\n\n\n\n# 图 6-15 Windows 7 主机系统属性对话框中的远程桌面选项\n\n我们看到漏洞扫描器成功识别了 Windows\
  \ 主机安全性较低的状态。幸运的是，我们不需要对每种情况进行手动验证和调整；这一切都可以通过强制执行新的组策略或使用许多种自动修复解决方案来实现自动化。\n\n\
  ![Images](img/00009.jpeg)\n\n**注意** 诸如开源漏洞数据库（OSVDB）和美国国家漏洞数据库（U.S.）等主要数据库的目标是发布常见漏洞与披露（CVE）以提高公众意识。这些数据库非常有用，但并不总是包含漏洞的完整信息，因为许多漏洞仍在研究中。因此，您在研究时应该使用补充来源，例如\
  \ Bugtraq、`OWASP` 和 `CERT`。\n\n### 与最佳实践或合规性对比\n\n业界、学术界和政府部门提供了多个基准可供您改进网络安全。在军事网络中，最广泛使用的标准集是由国防信息系统局（DISA）开发的。其安全技术实施指南（`STIGs`）结合国家安全局（`NSA`）指南，构成了美国国防部（DoD）信息系统使用的配置标准。图\
  \ 6-16 显示了 DISA `STIG` 端口，以及最新指南的小样本。\n\n![Images](img/00054.jpeg)\n\n# 图 6-16 安全技术实施指南门户\n\
  \n`STIGs` 提供了加固网络设备、终端和软件所需的各种步骤。注意，尽管许多 `STIG` 基准对公众开放，但某些需要国防部 PKI 证书（如访问卡 `CACs`\
  \ 中的证书）才能访问。使用安全内容自动化协议（`SCAP`）规范，您可以在整个网络应用这些标准或监控遵守情况。\n\n## 协调结果\n\n在事件响应和取证分析中，有一件事是肯定的那就是详细记录最终将让您的工作容易得多。这包括您配置设备、验证其配置、验证其运行以及测试漏洞的步骤。记录如何发现和处理漏洞的笔记有助于连续性，而且根据您运营的行业，这可能是强制要求的。`Nessus`\
  \ 和 `OpenVAS` 都提供了跟踪纠正措施在网络设备上执行效果的方法。如果您的网络活动受到调查检查，了解您对执行的每项使网络更安全的操作都做了详细记录也是很好的。\n\
  \n## 审查相关日志和/或其他数据源\n\n在查看报告时，您还应该查看事件日志和网络数据。您可以将运行的服务、监听端口和打开连接与授权服务列表进行对比，以识别任何异常行为。将漏洞扫描输出与历史网络和服务数据相关联具有多种功能。首先，它验证了您的日志机制正在捕获与漏洞扫描相关的活动，因为这些扫描通常会触发日志。其次，您应该能够根据补丁或由于补偿控制而做的更改看到网络的变化。最后，日志可能让您了解发现的漏洞是否已采取行动。安全信息和事件管理（`SIEM`）工具对验证有极大帮助，因为它们可能能够可视化所有的扫描活动，而且由于您可能已经在采集其他日志数据，这些工具提供了一个实用的起点。\n\
  \n### 确定趋势\n\n使用内置的趋势功能或借助其他软件，您可以跟踪网络中的漏洞随时间变化的情况。趋势分析改进了上下文信息，并允许您的安全响应团队更高效地根据其工作量定制威胁缓解策略。此外，您还可以确定您的任何解决方案是否生效并有效。将漏洞扫描器与现有的\
  \ `SIEM` 平台连接不是唯一的选择；您还可以使用现有的工单软件跟踪修复问题的进度。这有助于问题的进行内部跟踪，并在需要外部协助来执行策略变更时，让领导层具备可见性。\n\
  \n### 章节总结\n\n漏洞扫描是任何安全团队的核心职责。采取步骤理解并跟踪网络面临的漏洞，对于确定最佳缓解策略至关重要。让关键利益相关者参与此工作也将使您能够做出符合组织最大利益的决策。当您增加网络漏洞状态的可见性时，您确保了安全团队可以将精力集中在正确的地方，并且领导层可以投入正确的资源维护网络安全。我们涵盖了几种工具，包括\
  \ `Nessus`、`OpenVAS` 和 `Nikto`，它们都通过持续更新的漏洞信息库提供漏洞扫描信息。其中一些工具还提供了自动化过程并以可供其他 IT\
  \ 系统摄纳的格式输出的能力。漏洞扫描是一个持续的过程，需要您的安全团队定期监控网络以确定检测到的漏洞的变化，评估补丁和补偿控制的效力，并相应调整工作以领先于威胁。\n\
  \n### 问题\n\n1. 下列哪项缺少图形用户界面的开源漏洞扫描器？\n\n**A.** `OpenVAS`\n**B.** `NASL`\n**C.**\
  \ `Nessus`\n**D.** `Nikto`\n\n2. 在优先考虑新发现漏洞的修复时，您应该考虑以下因素以外的所有？\n\n**A.** 关键性（criticality）\n\
  **B.** `SCAP`\n**C.** 实施难度\n**D.** `CVSS`\n\n3. 以下所有因素都可能是修复障碍，除了？\n\n**A.** `SLAs`\n\
  **B.** `TLAs`\n**C.** 治理\n**D.** 业务流程\n\n4. 关于误报，以下哪项是正确的？\n\n**A.** 误报通常不是问题，但漏报性可能是问题。\n\
  **B.** 误报是自动化过程中出现人为错误的指示。\n**C.** 误报对较小组织比较大组织更有害。\n**D.** 误报浪费了组织资源。\n\n参考以下插图回答问题\
  \ 5-8：\n\n![Images](img/00055.jpeg)\n\n5. 以下所有情况都可能解释 10 月 11 日漏洞突然下降，除了？\n\n**A.**\
  \ 团队决定按关键性优先修复。\n**B.** 工具经过了调整以减少误报数量。\n**C.** 一个故障的软件更新服务器在 10 月 11 日早上被修复。\n\
  **D.** 团队决定按关键性优先修复。\n\n6. 如果您的性能严格根据漏洞总数来衡量，您在 10 月 12 日可能会做什么？\n\n**A.** 按关键性优先修复。\n\
  **B.** 关注“高”级漏洞。\n\n\n\n\n\nC. 按实施难度对修复进行优先级排序。\n\nD. 暂停变更管理协议。\n\n### 7. 修复剩余 70\
  \ 个“关键”漏洞最可能的障碍是什么？\n\nA. 组织缺乏与漏洞管理相关的治理流程。\nB. 漏洞存在于任务关键业务流程必需的服务器上。\nC. 所有相关的合作备忘录（MOU）已过期或被撤销。\n\
  D. 组织未制定服务水平协议（SLA）。\n\n### 8. 什么最可能导致 10 月 12 日扫描期间检测到的漏洞数量增加？\n\nA. 软件安全补丁\nB.\
  \ 对漏洞扫描器进行进一步调优\nC. 漏洞扫描器更新/插件\nD. 网络设备配置改进\n\n请使用以下场景回答问题 9–12：\n\n你被要求作为更广泛的漏洞管理流程的一部分开始执行漏洞扫描。在过去的几周里，你一直每\
  \ 48 小时运行一次扫描，并发现终端用户工作站的误报率很高。更让你担心的是，会计部门使用的主数据库和备份服务器上都存在多个关键漏洞。随着财年结束的临近，你非常确定业务影响将太高，不允许进行修复。\n\
  \n### 9. 你如何最好地减少高误报率？\n\nA. 针对你的 IT 环境验证检查项的逻辑\nB. 使用不同供应商的扫描器来双检你的结果\nC. 将你的漏洞扫描限制在网络上的关键主机上\n\
  D. 优先考虑你的响应措施\n\n### 10. 除了降低误报率外，你还可以如何处理这些误报？\n\nA. 将它们与其他数据点进行关联。\nB. 将它们与最佳实践进行比较。\n\
  C. 优先考虑你的响应措施。\nD. 审查相关日志。\n\n### 11. 以下哪些最不利于你获得修复数据库服务器上发现的关键漏洞的权限？\n\nA. 安排在周末修复\n\
  B. 为你的组织实施 SLA\nC. 使用沙箱测试修复\nD. 在修复失败时提供回滚计划\n\n### 12. 对于你不断增长的漏洞扫描报告库，你应该怎么做？\n\
  \nA. 确保你保留最后两组结果。\nB. 将它们提交给你的变更顾问委员会。\nC. 为了合规性而保留它们。\nD. 跟踪漏洞是如何变化的。\n\n### 答案\n\
  \n1. D. `Nikto` 是一个只有命令行接口的 Web 服务器漏洞扫描器。`NASL` 不是漏洞扫描器，而是 `Nessus 攻击脚本语言`。\n2.\
  \ B. 安全内容自动化协议 (`SCAP`) 定义了安全软件（如漏洞扫描器）通信缺陷和安全配置的方式。它在修复的优先级排序中不起任何作用。相比之下，通用漏洞评分系统\
  \ (`CVSS`) 可用于确定漏洞的关键性。\n3. B. 合作备忘录 (`MOUs`)、服务水平协议 (`SLAs`)、组织治理、业务流程中断和功能降级都是可能延迟修复的因素因素。\n\
  4. D. 误报通常会导致资源浪费，因为必须进行人工调查以确保它们不是问题。\n5. D. 最后两次扫描之间关键漏洞的减少仅为 56 个（ 44%），而高危漏洞减少了\
  \ 61 个（或 73%），中危漏洞减少了 18 个（或 67%）。不那么关键的漏洞减少更多，说明重点不太可能在关键性上。\n6. C. 减少漏洞总数最快的方法是针对更容易修复的漏洞。然而，注意的是，这可能不是降低组织整体风险的最有效方法，因为更容易修复的方案可能不是缓解最大风险的方案。\n\
  7. B. 任务关键业务流程通常为修复带来挑战，因为修复需要在业务时间之外进行，并且通常需要广泛的测试和回滚计划。缺乏治理、`MOUs` 或 `SLAs` 可能会加速而非阻碍修复。\n\
  8. C. 漏洞扫描器定期更新以应对新发现的漏洞。这些工具也可以进行校准或调优以改变误报率，尽管此过程有时会让扫描器忽略真实的漏洞。\n9. A. 有时检查项或插件使用的逻辑是有缺陷的，或者对你的环境做出了错误的假设。检查产生误报率最高的检查项并寻找调优机会有时是有帮助的。增加第二个扫描器可能会增加误报的总数，而最后两个回答对减少该数量均不起作用。\n\
  10. C. 如果你无法降低误报率，一种方法仅仅是在采取措施方面提高其他结果的优先级。随着时间的推移，分析师将擅于识别可能的误报，并可以将它们移动到队列的最底部。这样做的风险是，除非你确定结果是不重要的，否则你可能会无限推后一个真实问题。\n\
  11. B. 服务水平协议 (`SLAs`) 几乎存在于组织和外部服务提供商之间，因此一个不会帮助你获得权限。另外三个行动，特别是如果一起采取，可以为高级管理层提供一个有说服力的理由。\n\
  12. D. 趋势分析改进了背景，并允许你的安全响应团队更高效地根据其工作定制威胁缓解策略。根据你特定组织的合规环境，你可能被要求保留其中一些报告。由于这并非普遍\
  \ true，因此为了合规性保留报告不是最佳答案。\n\n\n\n\n\n- 抑制技术\n- 清除技术\n- 响应验证\n- 纠正措施\n- 通讯流程的目的\n\
  \n*我已为最坏的情况做好准备，但对最好的结果充满希望*。\n——Benjamin·迪斯莱\n\n### 角色阵容\n\n在我们深入探讨作为事件响应一部分要考虑无数技术问题之前，我们应该从本章结束时提到的同一个话题开始：人。在事件响应过程中，人们很容易过度关注技术挑战，而忘记人为因素，而这种因素的重要性至少与技术挑战不上下。我们将讨论集中在涉及的各种角色，以及我们必须确保这些角色之间以及与组织外部人员进行有效通信的方式。\n\
  \n### 关键角色\n\n广义而言，事件响应所需的关键角色可以根据预设的升级阈值提前确定。当然，内部技术团队始终会参与，但其他人员何时以及如何被引入呢？这取决于贵组织在制定事件响应（IR）计划时所做的分析。`图\
  \ 7-1`显示了大多数组织遵循的典型升级模型。\n\n![Images](img/00056.jpeg)\n\n**图 7-1** 典型角色升级模型\n\n\
  在常规响应中，技术团队不太可能涉及管理层，例如当一封带有恶意链接或附件的电子邮件某种方式进入用户的收件箱但未被点击时。你仍然需要对此做出响应，并可能会通知其他（例如用户、主管和威胁情报团队）该尝试，但管理层不会在响应的每一步中都“参与其中”。当事件或响应对业务产生直接影响时，情况就不同了，例如为了清除生产服务器上的恶意软件而你必须重启它。在这种情况下，管理层需要紧密参与决策。在某些时刻，内部团队的技能和能力可能无法有效处理事件，此时响应就会升级，你引入承包商来充实团队，甚至接管响应的某些方面。显然，这是一项昂贵的行动，因此你希望仔细考虑何时这样做，而管理层几乎都会参与该决策。最后，还有一些事件需要政府参与。通常情况下（尽管并非总是），这表现为通知并可能引入执法机构，如\
  \ `FBI` 或秘密特勤局（`Secret Service`）。这可能在贵组织呼叫外部承包商的情况下发生，但始终会涉及高层领导。让我们来看看该模型中每个角色所涉及的一些问题。\n\
  \n### 技术人员\n\n响应事件的技术团队的组成通常取决于事件本身。某些响应将涉及单一分析师，而另一些则可能涉及来自许多不同部门的数十名技术人员。显然，没有“一刀切”的团队，因此我们需要引入正确的人来处理正确的问题。这部分应该预先规定的是我们组建团队的方式，最重要的是，在事件响应的各个阶段由谁来说了算。如果你不将此纳入计划并定期进行测试，那么你可能会在重大事件发生期间随之引发的“混乱混斗”中浪费宝贵的几小时（甚至是几天）。\n\
  \n一种最佳实践是利用你的风险管理计划来识别对系统可能产生的威胁。然后，对于每种威胁（至少是主要的威胁），你可以针对其可能表现出的几种方式对响应进行“兵兵演习”。在过程中的每个重大决策点，你都应该问一个问题：谁来决定？无论答案是什么，下一个问题应该是：此人是否拥有所需的权限？如果是，你只需勾掉它并进入下一个问题。如果缺乏权限，你必须决定是由其他人来做决定，还是应该将该权限书面授予你所想到的第一个。。无论如何，你都不希望在事件响应过程中发现自己必须在决策在公司链条中被层层审核时干坐几个小时。\n\
  \n**战地故事：拔掉插头**\n\n我们最近为一个美国大城市运行了一场大型、跨部门的网络安全演习。在某一点，攻击者攻破了某金融机构的域控制器，并创建一个新的域管理员账户以扩大他们的足迹。安全运营中心（`SOC`）的一位敏锐分析师检测到了这一点，并发送了变更请求要求主机下线。他们观察着该机器，并判断攻击者未活跃，但这是一段紧张的等待。当该账户出现远程登录的第一个迹象，且没有收到变更批准机构的回复时，`SOC`\
  \ 主监亲自拔掉了插头。当演习裁判对他这种“未经授权”的行为提出质疑时，他拿出了响应计划，其中明确授权了在系统似乎被入侵并对网络安全构成即时风险时将系统下线的权限。他能够迅速停止攻击，因为他的组织已经预想到了这种场景，并授予了技术人员相应的权限。红队并不高兴。\n\
  \n### 承包商\n\n无论内部技术团队多么熟练或资源多么充足，总会有一个你必须引入佣兵的时刻。例如，极少数组织能够应对涉及国家级攻击性操作者的事件。然而，请求“援军”需要大量的预先协调和沟通。除了与事件响应公司签订明显的服务合同外，你必须计划并测试他们具体将如何进入你的设施、他们将拥有什么权限、谁将监控并支持他们，以及你的系统中哪些（如果有的话）部分是禁止他们访问。这些公司在处理此类事务非常有经验，通常可以提供分步指南以及保密协议（`NDA`）和合同模板。他们无法为你做的是培训你的员工（技术人员或其他人员）在他们降临你的网络时如何与他们打交道。这就是练习和测试大显身场：向组织中的每位利益相关者传达承包商响应将是什么样，他们的角色将是什么。\n\
  \n过度嵌入这些 IR 承包商是有可能的。有些组织出于成本节省的考虑而外包所有的 IR。其逻辑是，你只需为需要的付费，因为面对事实吧，合格的人才很难找到，在内部培养缓慢，而且价格昂贵。然而，事实是，这种方法在两个方面存在根本性缺陷。第一，事件响应与关键业务流程密不可分，第三方很难理解其中的细微差别。这就是为什么你始终至少需要一名合格的、实战的内部事件响应人员，他至少可以将技术行动转化为业务影响。第二个原因是，IR\
  \ 在很大程度上取决于人际沟通和信任，而不仅仅是技术控制。第三方在处理涉及的许多个人时会困难得多。无论如何，你最好拥有一些内部 IR 能力，并根据需要通过外部承包商对其进行充实。\n\
  \n#### 管理层\n\n\n\n\n事件响应几乎总是会对组织的业务流程产生某种程度的直接影响（有时是灾难性的）。因此，事件响应（IR）团队应该包含来自每个受影响业务部门的关键高级领导者。他们的参与不仅仅是为了提供支持，更是为了塑造响应流程以最大限度地减少干扰、解决监管问题，并作为与其部门内受影响人员以及组织内部高层领导沟通的接口。有效的事件响应工作几乎总是需要管理层作为多小组响应团队的一部分进行直接且积极的参与。\n\
  \n将这些业务领导整合到团队中并非易事。即使他们对网络安全的了解程度和热情与你一样（这在现实中极其罕见），他们的优先事项往往也会与你产生冲突。考虑一台服务器遭受了攻击，该服务器负责与你的内部会计系统以及外部支付处理网关进行接口。你知道，该设备在网络上每留一秒，你都面临着进一步被入侵或客户数据大规模泄露的风险。然而，该设备断开网络每秒都会导致公司在销售额和收入方面遭受重大损失。如果你在面对这种情况时才第一次接触相关的业务经理，那么对任何人来说结果都不会太好。相反，如果有一套他们熟悉并支持的流程，那么结果将更好、更快且风险更低。\n\
  \n## 执法部门\n\n许多事件将要求你涉及执法执法机构（`LEA`）。有时，制定这些要求的法律还会有非常具体的时间表，以防你遭受民事甚至刑事处罚。在其他情况下，可能并不要求涉及\
  \ `LEA`，但尽管如此，这样做可能仍然是一个非常好的主意。我们刚刚描述的涉及支付处理器的场景只是你可能想要涉及 `LEA` 的情况中的一个例子。如果你（或你的团队其他成员）不知道哪些事件属于“强制报告”或“建议报告”这两大类别，你可能需要将此与领导层和法律顾问对话的任务放在优先级列表靠后的位置。\n\
  \n当 `LEA` 参与时，他们将对响应过程带来他们自己的视角。当你关注于缓解和恢复，而管理层热于业务连续性时，执法部门将受到保护证据的需求的驱动（这本该应该是你\
  \ IR 计划中的一个要素，但并不总是如此）。这三组目标可能会相互冲突，特别是当你没有制定好一个详尽、现实且经过演练的计划时。如果你与 `LEA` 代表的第一次会议发生在实际事件响应期间，你可能会发现这比演练计划的这部分要困难得多。\n\
  \n### 利益相关者\n\n`stakeholder`（利益相关者）一词非常广泛，可能包括大量的群体。对于 CSA+ 考试而言，我们所说的 IR 利益相关者是指你组织的一部分并在帮助某些事件响应的某些方面发挥作用的个人和团队。他们在某些（甚至是大多数）但并非所有的响应中都起着关键作用。这给\
  \ IR 团队带来了挑战，因为支持性的利益相关者通常不像直接参与者那样习惯执行响应操作。必须投入额外努力，以确保他们在糟糕情况发生时知道该做什么以及如何做。\n\
  \n## 人力资源\n\n人力资源（`HR`）员工参与响应最可能的情况是，团队确定组织的某成员可能在事件中扮演了角色。注意，这种角色并不一定是恶意的，因为它可能是违反了政策（例如，在不允许的情况下将优盘插入电脑），或反复未能接受安全意识培训（例如，在经过几轮补习培训后仍然点击电子邮件中的链接）。无论是恶意的、疏忽的还是其他，同事的行为都可能并确实会导致严重事件。在这些情况下，纪律处分几乎要求\
  \ `HR` 的参与。\n\n在其他情况下，你也可能需要人力资源员工作为响应的一部分，例如当响应需要加班，或者当需要从休假或假期中召回关键人员时。最稳妥的方法是将\
  \ `HR` 纳入你的 IR 计划过程中，特别是在你的演练中，让他们告诉你他们在各种场景中应该承担何种程度的参与。\n\n## 法律\n\n每当事件响应升级到涉及如执法部门等政府机构的程度时，你几乎肯定会与法律顾问协调。除了报告针对你系统的刑事或国家资助的攻击外，还有监管方面的考虑，例如我们在第\
  \ 5 章中讨论过的那些。例如，如果你在一个受 `HIPAA` 覆盖的组织工作，并且正在响应一个涉及 500 人或更多受保护健康信息（`PHI`）的事件，你的组织将有一些具体的报告要求，需要由法律团队审查。\n\
  \n法律是一个极其复杂的领域，因此在我们许多人看来无害的行动也可能产生沉重的法律影响。尽管某些律师对复杂的技术问题非常了解，但大多数人仅有浅层的了解。根据我们的经验，尽早与法律团队开始对话并保持定期的沟通，对于避免陷入职业生涯危机至关重要。\n\
  \n## 营销\n\n与客户和投资者的沟通对于成功从事件中恢复至关重要。说什么、何时说以及如何具有战略意义，因此最好交给可能居住在你营销部门的专业人士。如果你的组织有专门的战略传播、公关、媒体或公共事务团队，他们也应该参与响应过程。\n\
  \n与 IR 的其他方面一样，计划和演练是成功的关键。然而，对于营销团队，这可能比其他大多数时候都要如此。\n\n***\n\n![Images](img/00005.jpeg)\n\
  \n**考试技巧** 当你在考试中看到对营销团队的引用时，请将其想为组织中任何与公众直接沟通的部分。如果你的组织对该团队有其他名称，不要想太多。\n\n## 管理层\n\
  \n\n\n我们在讨论事件响应角色时已经提到了管理层。现在我们回到这一小组，讨论对于不直接参与事件响应的经理来说，管理层是如何其中的。这可以通过多种方式实现，但请考虑你组织中的高层管理人员。他们不太可能参与任何非最严重的事件，但你仍然需要他们的认可和支持，以确保你能从其他业务部门获得正确的资源。在可能需要他们支持的情况下，让他们随时知情是一项平衡术；你不想占用他们太多的时间（或让他们进入活跃角色），但你需要让他们有足够的意识，以便当你只需要打一个简短的求助电话，他们就能促成结果。\n\
  \n管理成员作为事件响应利益相关者的另一种方式，与其说他们做了什么，不如说他们**没做**什么。考虑一个优先级高于你本应为某个业务部门进行的例行升级的事件。如果该部门的领导层不了解什么是\
  \ `IR`，或者不了解正在进行的响应工作的重要性，这可能会在你最无法负担这些干扰的情况下产生不必要的干扰。与领导层进行有效沟通可以建立信任，并在需要时为你提供缓冲空间。\n\
  \n### 响应技术\n\n尽管我们通常交替使用这些术语，但 `event`（事件）和 `incident`（事故）之间存在细微差别：`event` 是任何可以观察、验证和记录的发生；而\
  \ `incident` 是损害组织安全状况的一个或多个相关事件`Incident response`（事件响应）是消除事故对信息系统影响的过程。\n\n有很多事件响应模型，但它们都具有一些基本特征。它们都要求我们在坏事发生之前采取一些准备措施，识别并分析事件以确定适当的反制措施，纠正问题，并防止此类事故再次发生。显然，防止未来再次发生的努力回到了我们的准备措施中，这形成了一个循环。`图\
  \ 7-2` 显示了整个过程，该过程在 `NIST Special Publication 800-61 (Revision 2)` 中有描述。在本章中，我们关注纠正由事故引起的问题。假设已经有人为我们检测并分析了事故，我们从那里开始。\n\
  \n![Images](img/00057.jpeg)\n\n***\n\n**图 7-2** 事件响应生命周期\n\n***\n\n![Images](img/00009.jpeg)\n\
  \n**注意** 虽然我们在这里遵循 `CSA+` 考试目标并重点关注遏制和清除，但重要的是，这些只是整体事件管理过程的一部分，该过程还应该包括检测、分析和从事故中恢复的程序。恢复是将信息系统的功能恢复到事故发生之前的状态。\n\
  \n### 遏制\n\n一旦你知道威胁者已经破坏了你信息系统的安全性，你的首要任务就是防止情况恶化。遏制（Containment）试图剥夺威胁者造成进一步损害的能力或手段。其目标是在努力消除事故的同时，防止或减少该事故的扩散。这类似于将高传染性患者限制在医院的隔离室中，直到他们治愈以防止他人被感染。适当的遏制过程为事件响应团队提供了时间进行适当的调查并确定事故根源。遏制应该基于攻击类型（即是内部还是外部）、受事故影响的资产以及这些资产的关键性。遏制方法可以是主动的或响应的。哪种取决于环境和攻击类型。在某些情况下，最好的行动可能是将受影响的系统从网络断开。然而，这种响应方法可能会导致拒绝服务或限制关键系统的功能。\n\
  \n***\n\n![Images](img/00005.jpeg)\n\n**考试提示** 记住，保留证据是遏制的重要部分。你永远不知道一个看似例行的响应何时会进入法庭。\n\
  \n### 分段\n\n良好的安全架构（我们将在本书的[第四部分](#part0021_split_000.html#part4）中介绍）将根据某些标准对我们的信息系统进行分段，例如功能（财务或人力资源）或敏感性（例如未分类或机密）。`Segmentation`（分段）是将网络分解为子网络（段），使得不同网段中的主机无法直接通信。这可以通过物理布线连接分离的网络或通过逻辑上将设备分配到单独虚拟局域网（`VLANs`）来实现。在任何情况下，网段之间的流量必须通过某种网关设备，这通常是带有适当访问控制列表（`ACLs`）的路由器。例如，会计部门可能有自己的\
  \ `VLAN`，防止研发（`R&D`）部门的用户直接访问财务数据服务器。如果某些 `R&D` 用户对此类访问有合法需求，他们将必须被添加到网关设备的 `ACL`\
  \ 中，这可以根据源/目的地址、时间甚至要访问的特定应用程序和数据设置限制。\n\n事件响应期间网络分段的优势应该是显而易见的：损害可以被限制在开始发生的网络网段内。明确的是，仍然可能从一个段转移到另一个段，如\
  \ `R&D` 用户的案例所示。某些 `VLANs` 也可能存在漏洞，允许攻击者不通过网关即可从一个跳转到另一个。尽管如此，分段提供了重要的防御层，可以帮助遏制事故。如果没有它，生成的“扁平”网络将使遏制事故变得困难。\n\
  \n### 隔离\n\n虽然作为架构设计的一部分对网络进行分割很有，但我们已经看到这仍然允许攻击者在同一子网主机之间轻松移动。作为 `IR` 准备工作，建立隔离\
  \ `VLAN` 是很有用的，就像医院在患者实际需要之前准备隔离室一样。这样 `IR` 团队就可以将任何受感染或可疑的主机快速移动到此 `VLAN` 直到进行进一步分析。隔离\
  \ `VLAN` 与网络其他部分没有连接，这将防止恶意软件扩散。这种隔离还将防止受感染主机与外部主机（如命令与控制 `C2` 节点）通信。使用隔离 `VLAN`\
  \ 的唯一缺点是，某些高级恶意软件可以检测到这种情况，然后采取措施从受感染的主机中自我清除。尽管从 `IR` 的角度听起来很完美，但它确实阻碍了我们理解发生了什么以及攻击是如何执行的，以便我们防止未来再次发生。\n\
  \n\n\n当主机处于隔离状态时，响应团队能够安全地观察其行为，以获取有关事件性质的信息。通过监控其网络流量，我们可以发现可能参与了攻破的外部主机（例如，C2\
  \ 节点和工具仓库）。这使我们能够联系其他组织并寻求他们的帮助，以关闭攻击者正在使用的任何基础设施。我们还可以监控受感染主机的运行进程和文件系统，以查看恶意软件位于何处，以及它在活动系统中试图执行什么。这一切使我们能够更好地理解事件以及如何最好根除它。它还允许我们创建失陷指标（IOCs），然后将这些指标与其他人共享，例如计算机应急响应小组（CERT）或信息共享与分析中心（ISAC）。\n\
  \n## 移除\n\n在响应过程的某个阶段，你可能需要将受感染的主机从网络中完全移除。这可以在隔离之后，也可以在发现入侵时立即发生，取决于情况。如果你有手段研究行为并获取可操作的情报，那么隔离是理想的；或者如果你被大量可能受感染且需要分检的主机所淹没。尽管如此，无论如何，某些受感染的主机将永久地从网络中移除。\n\
  \n当你从网络中移除一个主机时，你需要决定是保持其电源开启、关机并保存，还是简单地重新构建。理想情况下，做出此决策的标准已经在 IR（应急响应）计划中明确列出。以下是在这种情况下需要考虑的一些因素：\n\
  \n- **威胁情报价值**：受感染的计算机可能是一个关于对手的战术、技术、程序（TTPs）和工具的信息宝库——特别是对于复杂或独特的对手。如果你所在的组织具有威胁情报能力，并能从受感染的主机获取新的或有价值的信息，你可能希望让它继续运行直到分析完成。\n\
  - **犯罪现场证据**：在许多国家（包括美国），几乎每一次故意入侵计算机系统都是犯罪行为。即使你不计划对犯罪者追究刑事或民事诉讼，未来的 IR 活动也可能改变你的主意，并从被移除主机的证据价值中受益。如果你有资源，在关机之前对主存储（例如，`RAM`）进行取证镜像，并在关机前后对次级存储（例如，文件系统）进行镜像，可能是值得努力的。\n\
  - **恢复能力**：对于我们这个行业的任何人来说，当我们发现尽管完全按照流程操作，但移除并丢弃了一台包含关键业务信息未在任何地方复制或备份的受感染计算机时，并不是一个令人愉快的时刻。如果我们获取并保留了驱动器的取证镜像，就可以降低这种风险，否则，某人将过糟糕的一天。这是另一个原因，即在资源允许的范围内，尽可能保留被移除主机的大部分内容。\n\
  \n移除过程应该在 IR 计划中详尽记录，以便让正确的人在正确的时间考虑正确的问题。我们在第 9 章中处理了监管链和相关问题，但目前只需说明，如果你处理得不当，你对已移除计算机所做的一切都可能会回过并困扰你。\n\
  \n## 反向工程\n\n虽然反向工程在技术上不属于遏制技术，但如果从中获得的信息有助于识别其他受感染的主机，它就可以帮助遏制事件。`reverse engineering`（反向工程）是对产品进行详细检查，以了解其功能和工作原理。在事件响应的背景下，反向工程专门针对恶意软件。其核心思想是分析二进制代码，以寻找例如它用于\
  \ C2 的 IP 地址或主机/域名，或者它在受感染主机中实现持久化所采用的技术，或者识别一个可以作为恶意软件特征的独特属性。\n\n通常情况下，反向工程恶意软件有两种方法。第一种并不真正关心二进制文件“是什么”，而是关心二进制文件“做了什么”。这种方法有时被称为\
  \ `dynamic analysis`（动态分析），需要一个沙箱来执行恶意软件。该沙箱为恶意软件创建了一个看起来像真实操作系统的环境，并提供访问文件系统、网络接口、内存以及恶意软件请求的任何其他内容。每个请求都被仔细记录，以建立行为时间线，使我们能够理解它的功能。动态恶意软件分析的主要优点是它通常比替代方案（下文描述）快得多，且所需的专业知识较少。对于被作者高度混淆的代码，这可能特别有帮助。最大的缺点是它没有揭示恶意软件的所有行为，而仅仅显示了它在沙箱执行期间所执行的操作。某些恶意软件在执行任何有趣操作之前实际上会检查是否运行在沙箱中。此外，某些恶意软件不会立即采取任何恶意行动，而是等待某些条件的满足（例如，仅在特定日期时间激活的定时炸弹）。\n\
  \n动态代码分析的替代方案，不用说，是 `static code analysis`（静态代码分析）。在这种恶意软件反向工程方法中，高技能分析师将汇编或反编译二进制代码，将其\
  \ 0 和 1 转换为汇编语言或创建它时使用的任何高级语言。这允许反向工程师看到恶意软件的所有可能功能，而不只是它在沙箱中有限运行期间表现出的功能。例如，可以查看在条件允许的情况下恶意软件将访问的所有域名，以及它永久插入到宿主主机中的各种方式。这种最后的见解使事件响应团队能够寻找证据，证明在到此之前未被认为感染的其他主机中是否存在任何其他持久化机制。\n\
  \n## 软件工程与反汇编\n\n\n\n\n\n一旦事件得到控制，我们将注意力转向根除过程，在此过程中，我们将所有系统恢复到已知的良好状态。在恢复系统之前，收集证据至关重要，因为在很多情况下，直到事件发生几天、几周甚至几个月后，我们才知道自己需要具有法律效力的证据。因此，将每一起事件都视为最终可能进入法庭审判来处理是值得的。\n\
  \n一旦捕获了所有相关证据，我们就修复所有破损的部分。目标是恢复组织完整且可信的功能。对于被攻破的主机，最佳实践是直接从黄金主镜像（gold master image）重新安装系统，然后从攻击发生之前的最近备份中恢复数据。\n\
  \n***\n\n![Images](img/00009.jpeg)\n\n**注意** 受到攻击或感染的系统永远不应被信任，因为你并不一定了解已经发生了哪些更改以及损坏的真实程度。某些恶意代码可能仍然隐藏在某处。应该重建系统以确保它们再次变得可信。\n\
  \n## 净化 (Sanitization)\n\n根据 NIST 特别出版 800-88 修订 1（媒体净化指南），`sanitization` 指的是通过特定的努力水平，使得给定介质上数据的访问变得不可行的过程。在事件响应背景下，这些努力水平可以是粗略的，也可以是复杂的。我们所说的粗略净化可以通过简单重新格式化驱动器来实现。对于那些寻找大量易受受害者且不愿投入过多精力深挖任何一个受害者的普通攻击者来说，这可能足够了。另一方面，还有一些复杂的攻击者，他们可能刻意针对了你的组织，并会尽全力在你的系统中持久留存，或者在被击退后再次攻破它们。这类威胁者需要更先进的净化方法。\n\
  \n挑战在于，你并不总是知道是哪种类型的攻击者导致了事件。因此，简单重新格式化驱动器是一种带有风险的方法。相反，我们推荐以下技术，按有效性从低到高排列，以确保对手绝对已从介质中移除：\n\
  \n- **覆盖 (Overwriting)**：覆盖数据意味着将存储介质上代表数据的 0 和 1 替换为随机或固定的 01 模式，使得原始数据无法恢复。这应该至少执行一次（例如，用\
  \ 0、1 或它们的模式覆盖介质），但可能需要执行多次。\n- **加密 (Encryption)**：许多移动设备采用这种方法来快速安全地使数据不可用。前提是数据使用强密钥以加密格式存储在介质上。为了使数据无法恢复，系统需要做的只是安全地删除加密密钥，这比删除加密数据快得多。在这种情况下，恢复数据通常在计算上是不可行的。\n\
  - **消磁 (Degaussing)**：这是移除或减少传统硬盘驱动器或磁带上磁场模式的过程。本质上是对介质施加强大的磁力，这会导致数据被擦除，有时还会损坏驱动盘的电机。请注意，消磁通常会使驱动器无法使用。\n\
  - **物理破坏 (Physical destruction)**：对抗数据残留最好的方法可能是直接破坏物理介质。破坏介质两种最常用的方法是将其粉碎或使其暴露于碱性或腐蚀性化学品。另一种方法是焚烧。\n\
  \n## 重建 (Reconstruction)\n\n一旦被攻破主机的介质经过净化，下一步是将主机重建到原始状态。实现此点的最佳方法是确保你已经为网络上的各种标准主机配置创建了已知的、加固的镜像。这些镜像有时被称为\
  \ `gold masters`，并有助于重建被攻破主机的过程。如果你必须手动重新安装操作系统、对其进行加固配置，然后安装原始主机中的各种应用程序和/或服务，那么这种重建将变得困难得多。我们不认识任何在经历过一次这种可怕的过程后，就不再投入时间去构建和维护黄金镜像的人。\n\
  \n重建的另一个方面是将数据恢复到主机中。同样，这里有一个最佳实践，即确保你拥有系统数据文件的最新备份。这对于快速且廉价地处理勒索软件事件也是关键的。遗憾的是，在许多组织中，备份是个别用户的责任。如果你的组织没有强制对所有系统进行集中管理备份，那么你唯一的其他希望就是确保数据维护在如文件服务器之类的托管数据存储器中。\n\
  \n## 安全处置 (Secure Disposal)\n\n当你因事件响应而处置介质或设备时，取决于设备类型，之前提到的四种技术（覆盖、加密、消磁或物理破坏）中的任何一种都可能有效。覆盖通常只适用于硬盘驱动器，在某些固态驱动器上无法实现。基于加密的清除可以在多个工作站、服务器和移动操作系统中找到，但并非所有。消磁仅对磁性介质有效，但某些最先进的磁硬盘使用更强的场来存储数据，可能导致旧消磁器失效。注意，我们没有提到交换机和路由器等网络设备，它们通常不提供这些任何替代方案。最终，安全处置这些设备的唯一方法是通过经过认证的流程或服务商对其进行物理破坏。这种物理破坏涉及对设备的粉碎、粉化、解体或焚烧。尽管这看起来很极端，但有时这是仅剩的安全替代方案。\n\
  \n## 验证 (Validation)\n\n事件响应中的验证过程专注于确保我们已经识别了相应的攻击向量，并对其实施了有效的应对措施。此阶段假设我们已经分析了事件并验证了其发生的方式。这种分析可以作为一个独立的事后活动，也可以与响应并行进行。\n\
  \n## 补丁 (Patching)\n\n许多破坏性最大的事件都是由于未修复的软件漏洞导致的这种漏洞可能由于多种原因存在，包括未能更新已知漏洞或存在此前未知的漏洞（也称为“零日”漏洞）。作为事件响应的一部分，团队必须确定是哪种情况。第一种表明内部未能更新补丁，而第二种几乎要求通知被利用的程序供应商，以便开发补丁。\n\
  \n\n\n\n\n许多组织依赖于非集中化管理的终端保护，特别是在“自自带设备”（BYOD）环境中。这可能导致用户或设备未能下载并安装可用的补丁，从而引发事件的发生。如果你的组织中存在这种情况，且你无法将策略更改为强制集中化补丁，那么你应该假设会有数量不等的终端无法完成补丁，并且要在安全架构的其他部分开发补偿控制措施。例如，通过实施网络访问控制（`NAC`），你可以对任何尝试连接到网络的设备进行补丁、更新、反病毒软件以及任何你想要执行的策略进行测试。如果终端未能通过任何检查，它将被放置在隔离网络中，该网络可能允许访问互联网（特别是下载补丁），但会阻止设备加入组织网络并防止传播恶意病毒。\n\
  \n相反，如果你的组织使用了集中化的补丁和更新，漏洞是已知但仍被成功利用，这说明你用于补丁的任何系统或流程存在故障。此时响应的一部分将是识别故障、纠正故障，然后验证修复措施能够防止未来再次发生此类事件。\n\
  \n### 权限\n\n在结束事件响应（IR）活动之前，验证权限有两个主要原因。第一是，不当的权限提升可能是导致事件的根源。组织允许用户拥有过度权限并不罕见。我们听过的最常见原因之一是，如果用户在设备上没有管理员权限，他们将无法以提高效率的名义安装任何想要尝试的应用程序。当然，我们很清楚其端，但这可能是一个你无力改变的组织文化问题。尽管如此，记录由于过度权限直接导致的事件（及其严重性），可能会随着时间的推移，使情况向着常识的方向演进。\n\
  \n并不是所有的权限问题都能归咎于终端用户。我们一次又看到系统或域控管理员使用他们的管理员账户完成所有工作（包括上网）。此外，我们大多数人人都听过（或处理过）这种发现：一个在离开组织几个月甚至几年的系统管理员仍然拥有有效的账户。事件响应的后续工作为双检查此类问题提供了绝佳机会。\n\
  \n最后，交互式攻击者经常会创建或劫持管理账户，以便在不被察觉的情况下进行阴险活动。虽然看到一个来自俄罗斯的匿名用户访问你网络上的敏感资源可能很奇怪，但如果你看到自己的同事管理员在移动这些文件，你可能不会产生太大怀疑。如果有任何证据表明事件利用了管理账户，那么删除该账户并在必要时为受害管理员颁发新账户是一个好主意。在执行操作的同时，你可能希望验证所有其他账户都是必要且受到保护的。\n\
  \n### 扫描\n\n根据定义，每个事件的发生都是因为攻击者利用漏洞并破坏了信息系统的安全性。既然如此，在从事件中恢复后，你可能希望对系统进行扫描，以发现相同（或相关）漏洞的其他实例。虽然我们永远无法防御每一个漏洞，但事实也是，我们负责缓解那些已被成功利用的漏洞，无论在事件发生前我们是否认为它们构成了高风险。原因在于，我们现在知道攻击者利用它的概率是\
  \ 100%，因为这已经发生了。如果它发生过一次，在没有改变控制措施的情况下，它可能会再次发生。不可避免的结论是，在事件之后，你需要实施一种防止利用再次利用的控制措施，并为你喜爱的扫描器开发一个插件，测试所有系统是否存在任何残留漏洞。\n\
  \n### 监控\n\n现在你已成功响应了事件，实施了新的控制措施，并运行了更新后的漏洞扫描以确保一切正常。这些都是重要的预防措施，但你仍然需要确保提高应对同一（或类似）攻击者回归的能力。在掌握了所有关于对手\
  \ TTP（战术、技术和程序）的信息后，你现在需要更新监控计划，以更好地检测类似的攻击。\n\n我们已经提到在响应的抑制阶段隔离工作中创建了 `IOCs`（入侵指标）。现在你可以将这些\
  \ `IOCs` 纳入你的网络监控计划来利用它们。大多数组织会将这些指标添加到其入侵检测或防御系统（`IDS/IPS`）的规则中。你还可以通过向业务伙伴甚至你所在行业的竞争对手提供\
  \ `IOCs` 来扩大覆盖范围。这正是像 `US-CERT` 和 `ISACs` 这样的组织可以帮助大型组织群体免受已知攻击的地方。\n\n### 纠措施\n\
  \n任何有效的业务流程如果没有某种形式的反思，如果没有从经验中学习和适应的机会，都是完整的。这就是事件响应中纠正阶段的作用。在这里，我们应用从过程中获得的教训和信息，以改进未来的安全态势。\n\
  \n### 教训报告\n\n在陆军期间，几乎没有在进行任何形式的操作（训练或实战）或运行任何规模的活动时而不进行“热点回顾”（活动后立即的小聚会，用于讨论好、坏和丑的事）和/或进行事后总结（`AAR`）来正式记录问题和建议。在大多数非政府组织在事件发生后看到同样的严谨态度，这非常令人鼓舞。虽然没有一种捕获教训的单一最佳方法，但我们将展示一种在各种情况和领域都为我们很好服务的方法。\n\
  \n通用方法是，鼓励或要求操作的每位参与者按照以下格式提供观察结果：\n\n- `Issue`（问题）：对操作过程中出现的重要（从参与者角度来看）问题给出的简短（通常为单句）标签。\n\
  - `Discussion`（讨论）：对观察到的内容进行详细（通常为段落长度）描述，并说明为什么对于未来记住或从中学习它很重要。\n- `Recommendation`（建议）：如果贡献者认为团队的响应有效或无效，通常以“维持（sustain）”或“改进（improve）”标签开头。\n\
  \n在 `AAR` 之前，每个参与者的输入都会被收集并组织。通常，所有输入会在评审期间进行讨论，但有时协调员如果觉得某些内容是重复的（他人的输入）或对会议不利，会选择忽略它们。随着问题的讨论，它们会根据其他团队成员的输入进行精炼和更新。在\
  \ `AAR` 结束时，小组（或负责人）决定哪些问题值得作为教训记录下来，这些问题将进入最终报告。根据你的组织情况，这些教训报告可能会发送给管理层、保存在本地和/或发送给更高层的清算机构。\n\
  \n### 变更控制流程\n\n\n\n\n在经验教训或事后回顾过程中，团队将讨论并记录有关变更的重要建议。虽然这些变更对于 `IR` 团队来说可能非常有理，但我们必须谨慎，假设这些变更应该自动执行。每个组织都应该有某种形式的变更控制流程。这种机制通常以变更控制委员会（`CCB`）的形式存在，由各业务部门代表以及其他相关利益相关者组成。无论是否存在委员会，该流程的设计旨在确保在没有经过所有受影响的人员审慎考虑的情况下，不会对任何关键系统做出重大变更。\n\
  \n回到之前的一个示例，该事件是由 BYOD（自带设备办公）策略触发的，在该策略下，每个用户都可以控制自己设备上的软件补丁。事件响应团队可能会认为这种状况是不可接受的，并建议对网络上的所有设备进行中心化管理。从信息安全的角度来看，这个决定完全合乎逻辑，但在法律和人力资源部门可能会面临一些挑战。变更控制流程是考虑所有视角并对系统做出合理有效变化的恰当方法。\n\
  \n## 响应计划的更新\n\n无论变更控制流程是否实施了 `IR` 团队的任何建议，都应该对响应计划进行审查，并在适当的情况下进行更新。变更控制流程实施的是组织范围内的变更，而响应团队对响应计划拥有更大的控制权。在没有根本性变更的情况下，可以在\
  \ `IR` 团队层面进行某些补偿。\n\n如之前的图 7-2 所示，事件管理是一个过程。在事件发生后，我们采取的行动让我们能够更好地为未来的事件做好准备，从而重新开始这一过程。对这一生命周期的任何变更都应该从本章开头提到的利益相关者的视角进行考虑。这将确保\
  \ `IR` 团队所做的变更在更广泛的组织背景下是合理的。为了获得这些利益相关者的观点，建立并维护良好的沟通至关重要。\n\n## 总结报告\n\n事后报告可以是非常简短的一页纸，也可以是一篇长论文；这完全取决于事件的严重程度和影响。无论情况如何，我们必须考虑谁将阅读报告，以及哪些利益和关注点将影响他们解读报告的方式。在开始编写之前，我们应该考虑一个问题：这份报告的目的是什么？如果目标是确保\
  \ `IR` 团队记住响应中某些有效（或无效）的技术细节，那么我们可能希望以某种方式编写，说服未来的响应者考虑这些教训。这种写作方式与我们的目标是说服高层管理修改流行的\
  \ BYOD 策略以增强安全性（即使这会导致某些人感到不快）会有很大不同。在第一种情况下，报告可能侧重于技术，而在后一种情况下，它将关注业务的底线。\n\n##\
  \ 沟通流程\n\n我们回到本章开头介绍的话题：参与事件响应的各种团队成员和利益相关者，以及在所有人之间保持有效沟通的重要性。这对于我们已经提到的内部利益相关者是如此，对于外部沟通同样如此。你可能有一个教科书般完美的事件响应，但仅仅因为沟通流程不畅，最终危及整个组织。\n\
  \n### 内部沟通\n\n任何事件响应计划的关键部分之一是让受信的内部人员了解进展并对事件响应进行咨询的流程。对于较重大的事件，指定一个“战争室”并不罕见，关键决策者和利益相关者将在那里面获取定期更新并做出决策。在这些会议之间，该房间作为响应活动信息的汇总中心。这意味着在整个响应期间，至少有一名\
  \ `IR` 团队的知识型成员将驻在那里，以处理这些临时造访的咨询。战争室是一个物理空间是最理想的，但根据你的组织，虚拟空间可能同样有效。\n\n除了战争室的会议（正式或其他形式）外，可能需要建立一个安全的通信通道，以让关键人员随时了解响应的进展。这可以是一个群信息、电子邮件或聊天室，但它必须包含所有可能在该问题发挥作用或拥有利益的关键人员。在涉及内部沟通时，没有信息过量这一说。\n\
  \n### 外部沟通\n\n另一方面，组织之外的沟通必须仔细控制。合理的报告往往会被变成具有误导性且可能产生损害的短句，因此最好指派一名经过培训的专业人员专门负责外部沟通。毕竟，其中一些沟通可能受到监管或法性要求的的约束。\n\
  \n外部沟通的首要部门也是最重要的部门是政府实体。无论是证券交易委员会（SEC）、还是 `FBI` 或是其他政府实体，如果在事件响应过程中有与他们进行沟通的要求，那么法律团队必须参与任何和所有信息的撰写。这是少数几个组织在这个领域搞砸后仍能毫发无损的领域。这并不是说政府利益相关者具有敌意，而是当过程受到法律或法规的监管时，风险要高得多。\n\
  \n列表中排在第二位的是客户。虽然对于受损的客户数据可能有某些监管要求，我们这里的重点是让公众知情，以便他们感知到组织的透明度和信誉度。当情况有趣足以成为头条新闻或在社交媒体上疯传时，这一点尤为重要。正如律师对政府沟通至关重要一样，媒体关系（或相应）团队在与大众沟通时将起到主导作用。这里的目标是平息恐惧和担忧，并控制叙述以保持事实正确。为此，新闻稿和社交媒体帖子应该在事件发生前就制作好模板，这样在快速发布有效的公报之前，只需填补一些空白即可。\n\
  \n另一组我们可能需要刻意且有效地沟通的群体是关键合作伙伴，例如业务合作者、选定的股东和投资者。这种沟通攻势的目标是传达对业务底线的影响。如果事件存在导致公司股价下跌的风险，那么对话必须包含公司将减轻此类损失的方法。如果事件可能会扩散到合作伙伴组织的系统，那么重点应放在如何降低该风险。在任何情况下，业务领导都应该进行这些对话，尽管会有高级响应团队领导的实质性支持。\n\
  \n在本章中，我们无法详尽地讨论事件响应期间如何进行沟通，但我们希望在这几页中传达了人际和组织间沟通的重要性。即使是处理得最好的技术事件响应，也可能因为内部和外部无法有效沟通而迅速被掩盖。\n\
  \n\n\n\n# 章节回顾\n\n本章为我们对事件响应（IR）的后续讨论奠定了基础。本章的开头和结尾都关注事件响应中的人际因素。即使在讨论技术流程本身之前，我们也讨论了你作为团队成员必须跟踪的各种角色和利益相关者，并且在事件发生之前，你就必须与他们建立良好的关系——而且在响应活动期间和之后还必须维持这种关系。对于许多不理解这戏中不同角色重要性的高技能响应人员来说，许多事件变成了一次“简历生成事件”（RGE）。\n\
  \n相比之下，技术部分要简单得多。事件恢复和事件后响应过程由五个离散阶段组成：抑制、根除、验证、纠正措施和最终报告。你在这个过程中的有效性很大程度上取决于你和队友所做的准备工作。如果你充分掌握组织面临的风险，制定了合理的计划，并定期与所有关键人员进行演练，那么当对手突破你的防御时，你可能会表现非常好。在接下来的几个章节中，我们将进入技术响应关键领域的细节。\n\
  \n### 问题\n\n**1.** 在做出涉及重大资金请求或联系执法执法部门的决策时，以下哪些人员将收到通知？\n- A. 承包商\n- B. 公关人员\n\
  - C. 高级领导\n- D. 技术人员\n\n**2.** 剖析恶意软件样本以确定其目的的过程称为什么？\n- A. 分段\n- B. 频率分析\n- C.\
  \ 流量分析\n- D. 逆向工程\n\n**3.** 在执行事件响应时，何时应该咨询法律部门？\n- A. 发现事件后立即\n- B. 当恢复失败导致业务流程面临风险时\n\
  - C. 在敏感信息（如健康信息 PHI）泄露的情况下\n- D. 在丢失超过 1 TB 数据的情况下\n\n**4.** 在 IR 过程中，何时执行漏洞扫描以确定纠正措施的有效性最好？\n\
  - A. 变更控制过程\n- B. 逆向工程\n- C. 移除\n- D. 验证\n\n**5.** 组织中负责协助某些事件响应方面工作的的成员术语是什么？\n\
  - A. 股东\n- B. 利益相关者\n- C. 内部人员\n- D. 公关\n\n**6.** IR 过程中的哪个过程在预期管理和报告方面的重要与应用技术控制同样重要？\n\
  - A. 管理过程\n- B. 变更控制过程\n- C. 通信过程\n- D. 监控过程\n\n针对问题 7-12，参考以下场景：\n\n你收到一个关于网络上设备受攻击的警报。用户报告他们在收件箱中收到了奇怪的消息，并且发送电子邮件遇到问题。你的技术团队报告邮件服务器有异常网络流量。团队分析了相关日志，并确认一个邮件服务器已被恶意软件感染。\n\
  \n**7.** 你立即将服务器从网络中移除，并将所有流量路由到备份服务器。你正处于哪个阶段？\n- A. 准备\n- B. 抑制\n- C. 根除\n- D.\
  \ 验证\n\n**8.** 现在设备已不再生产网络上，你想恢复服务。在将原始服务器重建为已知的良好状态之前，你想保留服务器的状态以备日后检查。你想采取的第一步是什么？\n\
  - A. 格式化硬盘。\n- B. 重新安装最新的操作系统和补丁。\n- C. 为所有媒体制作取证镜像。\n- D. 更新服务器上的防病毒软件定义并保存所有配置。\n\
  \n**9.** 关于与组织领导的沟通，最合适的行动方案是什么？\n- A. 提供进展更新和预计恢复时间。\n- B. 转发服务器上的完整技术细节。\n- C.\
  \ 在通知执法部门之前提供详细信息。\n- D. 仅在无法恢复服务时提供详细信息。\n\n**10.** 你的团队识别出了恶意软件变种，它利用了你的邮件服务器版本的一个漏洞来获取高权限。由于你无法确定该服务器上还有什么受到了影响，最好的行动方案是什么？\n\
  - A. 立即更新邮件服务器软件。\n- B. 重新映像服务器硬盘。\n- C. 编写额外的防火墙规则，仅允许电子邮件相关的流量到达服务器。\n- D. 为邮件服务器申请下一代杀病毒软件。\n\
  \n**11.** 你的团队认为已从主服务器上根除了恶意软件。你正尝试以负责的方式将受影响的系统恢复生产环境。以下哪些任务*不会*属于此阶段？\n- A. 为服务器软件应用最新的补丁\n\
  - B. 监控服务器上的网络流量以寻找受攻击的迹象\n- C. 确定将主服务器逐步投入运行的最佳时间\n- D. 使用带有不同服务器软件的新版本操作系统\n\n\
  **12.** 你的团队已成功恢复了原始服务器上的服务，并验证其没有恶意软件。应该尽快执行哪项活动？\n- A. 准备教训报告\n- B. 通知执法部门以提起诉讼\n\
  - C. 通知行业合作伙伴该事件\n- D. 向媒体通报该事件\n\n## 回答\n\n**1.** 联系外部执法部门或采用将产生巨额成本的变更决策可能需要组织的参与。他们将为公司的优先事项提供指导，协助解决监管问题，并为完成\
  \ IR 过程提供必要的支持。\n\n**2.** 逆向工程恶意软件是拆解恶意软件以理解其功能和工作原理的过程。\n\n**3.** 在处理敏感数据（如受保护的健康信息）的泄露时，有监管报告要求。由于这些泄露可能导致民事罚款甚至刑事起诉，因此咨询法律顾问是非常重要的。\n\
  \n**4.** 应该在验证期间进行额外的扫描，以确保在修复后不存在额外的漏洞。\n\n\n\n\n\n5. **B.** 相关利益者是指是你组织的一部分，并在协助处理某些事件响应方面发挥作用的个人和团队。\n\
  \n6. **C.** 通信流程是事件响应（IR）过程的重要组成部分，它能够实现从事件中高效恢复。\n\n7. **B.** 遏制是试图剥夺威胁者造成进一步损害的能力或手段的一系列行动。\n\
  \n8. **C.** 由于在许多地区未经授权访问计算机系统属于犯罪行为，因此使用取证工具对设备的当前状态拍摄快照以保留证据可能是很有用的。\n\n9. **A.**\
  \ 应当为向组织领导层提供足够的信息以提供指导和支持。管理层需要紧密参与关键决策点。\n\n10. **B.** 通常而言，处理感染系统最有效的方法是对系统的存储器进行完全映像重装，以确保移除了任何恶意内容并防止再次感染。\n\
  \n11. **D.** 事件响应过程的目标是尽可能快速、安全地让服务恢复正常运行。引入完全全新且未经测试的软件可能会给实现这一目标带来重大挑战。\n\n12.\
  \ **A.** 编写教训报告是恢复后过程中的一个关键阶段。它应该在事件发生后尽快进行，以记录尽可能的信息，并完成可能对事件诉讼有用的任何文档，防止未来事件的发生。\n\
  \n***\n\n# 第 8 章\n\n## 确定事件的影响\n\n在本章中，你将学习：\n\n- 网络威胁的分类标准\n- 如何确定事件的严重程度\n- 安全事件响应优先排序的最佳实践\n\
  - 最常见的敏感和受保护数据类型\n\n***\n\n*预测下雨并不作数，建造方舟才算。*\n\n—沃伦·巴菲特\n\n### 威胁分类\n\n在深入研究准备或响应事件时可能遇到的威胁技术细节之前，定义“事件”（*incident*）一词是非常重要的。我们使用这个词来描述任何对你的系统造成直接伤害，或增加你的敏感数据未经授权泄露概率的行动。了解某事是否有害且反常的第一步是理解正常是什么样的。建立系统的基准是为事件准备的第一步。如果不知道什么是正常，想要发现攻击的警告信号将变得极其困难。在这种情况下，你可能只有在系统离线时才会发现自己被入侵。制定事件响应计划不仅是一个好主意——取决于你的运行环境，它还可能是强制性的。作为组织的安全专家，你将受托实施技术措施并建议政策，在保护你的个人数据安全的同时，确保组织免受诉讼。\n\
  \n#### 已知威胁 vs. 未知威胁\n\n在之前的章节中，我们涵盖了入侵检测系统中基于签名和基于异常的检测方法。杀病毒软件的工作原理类似。你可能记得，基于签名的系统依赖于对威胁的预知，而且这些系统的优坏取决于公司收集的历史数据。尽管这对于识别已经存在的威胁很有用，但对于不断变化形式或以前未被观察到的威胁，它的作用有限。这些威胁将在不被察觉的情况下溜过系统。另一种方法是使用观察文件在做什么而不是它看起来像什么的解决方案。这种系统依赖于*启发式分析*（*heuristic\
  \ analysis*）来观察可执行文件调用的命令、它写入的文件以及任何试图隐藏自己的尝试。通常，这些启发式系统会在虚拟操作系统环境中对文件进行沙箱处理，并允许它执行其设计的功能。随着恶意软件的演变，安全实践正在发生转变，以减少制定政策时所做的假设。一份显示没有任何威胁的报告仅意味着扫描引擎没有找到匹配项。如果检测方法无法检测出最新类型的威胁，那么一份干净的报告价值并不大。换句话说，缺乏证据并不代表没有证据。漏洞和威胁的发现速度已经超过了传统检测技术能够识别的速度。因为即使我们无法检测到，威胁仍然存在，所以我们要么进化我们的检测技术，要么将整个网络视为一个不可信的环境。后者在本质上并没有什么错误；它只是要求我们在设计网络时在思维方式上发生重大转变。\n\
  \n#### 零日\n\n“零日”（*zero day*）一词曾仅供安全专业人员使用，现在正迅速成为公共语言的一部分。它指的是以前从未在公开场合出现过的漏洞或漏洞利用程序。*零日漏洞*（*zero-day\
  \ vulnerability*）是软件中的一个缺陷，供应商对此一无所知，因此没有针对该漏洞发布补丁或告警。为了利用这一缺陷而编写的代码被称为*零日利用程序*（*zero-day\
  \ exploit*）。在编写软件时，供应商通常侧重于提供易用性并尽快向市场推出功能最全的产品。这通常会导致随着更多用户与软件交互，需要多次更新。理想情况下，随着时间的推移、采用率的增加以及补丁的发布，漏洞的数量会减少。然而，这并不意味着你应该因为某种安全感的增强而降低警惕。相反，你应该更加警觉；一个完全采用某软件的环境意味着如果受到零日利用攻击，它将无手可策。\n\
  \n零日利用程序曾极其罕见，但安全社区观察到它们的使用和发现显著增加。随着安全公司改进其软件，恶意软件编写者努力进化他们的产品以规避这些系统，形成了一种恶意软件的军备竞赛。现代零日漏洞价值极高，正如其他任何具有感知价值的东西一样，市场已经形成。存在零日利用程序的黑市场，大量犯罪集团参与。在光谱的另一端，供应商利用*漏洞赏金*（*bug\
  \ bounty*）计划来补充内部漏洞发现，邀请研究人员和黑客主动探测其软件的漏洞以换取资金和奖品。即使是五角楼——一个传统上官僚化且规避风险的组织——也看到了这种众包安全性的价值。2016\
  \ 年 3 月，它启动了“黑进五角楼”（Hack the Pentagon）挑战，这是一项旨在识别国防部公开网站安全漏洞的试点计划。\n\n#### 准备工作\n\
  \n\n\n\n\n面对诸如零日漏洞利用等未知且高级的威胁需要一套包含技术和运营最佳实践的稳妥方法论。关键业务资产和敏感数据的保护绝不应托付于单一解决方案。你应该警惕那些声称是处理此类威胁的“一站式”服务的解决方案，因为你本质上是将整个组织的命运交托在了一个单点故障上。虽然“响应”一词是事件响应（IR）计划的一部分，但你的团队还应该开发一种包含主动努力的方法论。这种方法应该涉及主动努力以发现尚未影响组织的新威胁。这些信息的来源包括研究机构和威胁情报提供者。SANS\
  \ 互联网风暴中心（SANS Internet Storm Center）和卡内基梅隆大学的 CERT 中心（CERT Coordination Center）是发现最新软件漏洞的两个优秀资源。掌握了关于攻击者趋势和技术的新知识，你可能可以在恶意流量造成危害之前检测到它。此外，如果没有应对措施或补丁，这将为你的安全团队留出开发控制以缓解安全事件的时间。\n\
  \n## 高级持续威胁\n\n2003 年，分析师发现了一系列针对国防部、能源部、美国航空航天局（NASA）和司法部的协调攻击。发现这些攻击在当时已进行了至少三年，执行者似乎在执行某项任务，并采取了非凡的步骤来隐藏其存在的痕迹。这些后来被称为“泰坦雨”（Titan\
  \ Rain）的事件被归类为高级持续威胁（APT）的作品，这是对任何隐蔽且持续的计算机黑客行为的统称，通常由拥有大量资源的组织或政府协调并执行。APT 的目标是在保持不被发现的情况下，获得并维持对目标系统的持久访问。攻击向量通常包括垃圾邮件、受感染的介质、社会工程学和供应链破坏。其操作背后的支持基础设施；他们在行动期间的技术、战术和程序（TTPs）；以及他们选择的目标类型，都是使\
  \ APT 脱颖出的因素。分析该缩写词中的每个单词，有助于识别 APT 与其他攻击者之间的关键区别。\n\n## 高级\n\n这些这些活动背后的操作者通常装备精良，使用的技术表明他们受过正式培训并拥有大量资金。他们的攻击表明了技术和非技术信息源之间存在高度的协调。这些威胁通常有全方位的情报支持，从数字监视方法到侧重于人类目标的传统技术。\n\
  \n## 持久\n\n由于这些活动通常由政府和军事组织协调，因此每个操作者专注于特定的任务，而不是盲目地搜寻，这并不令人意外。操作者通常会忽略机会性目标，并专注于他们负责的活动部分。这种行为意味着了严格的交战规则，并将一致性和持久性置于一切之上。\n\
  \n## 威胁\n\nAPT 并非存在于真空之中。他们的活动展示了能力和意图，这些方面凸显了它们作为政治计划的技术实现手段。像军事行动一样，APT 活动通常作为政治意志的延伸。虽然它们的代码可能由机器执行，但\
  \ APT 框架是由人类带着特定目标进行设计和协调的。由于 APT 的复杂性，单独处理它们可能非常困难。自动威胁情报共享的概念是安全领域的一个最新进展。由于速度通常是活动成功否的关键，许多供应商提供了自动共享威胁数据并协调技术应对措施的解决方案。\n\
  \n***\n\n![Images](img/00005.jpeg)\n\n**考试提示** 高级持续威胁无论所属身份如何，其特征是在入侵系统、窃取数据和掩盖足迹的行为期间表现出的资源充足、一致性和类军事化的效率。\n\
  \n## 事件严重性和优先级排序的影响因素\n\n准备工作是任何团队顺利运行的关键，对于应对意外挑战而言尤为重要。无论是由于组件故障导致的停机，还是恶意软件感染的结果，拥有全面的响应策略将减少在这种情况下造成的损害。\n\
  \n### 影响范围\n\n在怀疑发生事件期间，拥有一个参考点来了解真实的影响范围是重要的。仅仅记录网络看起来很慢不足以对下一步做什么做出良好的判断。`影响范围`（Scope\
  \ of impact）是指对某个事件偏离正常运行的程度是否足以被称为事件，以及服务受影响程度的正式判定。请记住，你在履行系统管理员职责过程中执行的某些操作可能会触发安全设备并看起来像是攻击。记录此类合法的异常可以减少误报数量，让你对自己的告警系统更有信心。在发生合法攻击的情况下，你必须从网络中的各个源收集尽可能的数据，例如网络设备的日志文件。在这一步拥有尽可能多的信息将为你的事件响应人员决定下一步措施提供帮助。\n\
  \n一旦确认某个事件是合法的，你应该迅速与团队沟通，确定需要联系你的安全组和关键领导层之外的人。你必须联系的人可能取决于你的当地政策——在某些情况下取决于法律或法规。及早开启通信通道也将确保你为组织资源的任何重大变更获得适当的支持。我们已经在第\
  \ 7 章中详细介绍了通信过程。\n\n对于某些组织来说，仅仅提及成功入侵无论损害了什么，都可能是破坏性的。2011 年，安全公司 RSA 成为了一场重大入侵的受害者。RSA\
  \ 的 `SecureID` 是一个双重认证令牌类产品，当时被超过 4000 万家企业用于保护自己的网络。这些令牌是其认证服务的基石，在对事件进行彻底调查后被发现已被破解，导致该公司更换了所有\
  \ 4000 万个令牌。与更换令牌的成本几乎相当的是对 RSA 声誉的损害，因为这个故事席卷了全球。安全公司如何会成为黑客的受害者？在这种情况下，确保只有参与事件响应的决策者知情是至关重要的。第一个原因是在确定明确的前进路线时，减少整个组织的混乱。其次，你可能不想让攻击者发现他已被发现。作为事件响应人员，你必须准备好向领导层提供你的技术评估，以便他们做出符合组织利益的最佳决策。\n\
  \n### 停机\n\n\n\n\n网络的存在是为了在人们需要时为有需要的人提供资源。如果没有网络以及在需要时可用的服务，任何事情都无法完成。决定网络性能的其他指标，如稳定性、吞吐量、可扩展性和存储，都要求网络处于运行状态。是否为了处理安全漏洞而完全将网络离线，这一决定从任何角度衡量都不是一个小决定。在理解了完全关闭网络可能不可行的情况下，你应该转向隔离受感染的系统以防止进一步的损害。这里的首要任务是防止额外损失并尽可能地减少对组织的影响。这与急诊室的操作大不相同：你的团队必须努力对网络进行快速分诊，以确定损害范围并防止进一步伤害，同时保持组织的运转。\n\
  \n关键在于确定组织哪些关键系统是生存所必需的，并估计公司由于事件导致可以承受的停机时间。组织可以承受的停机时间被称为`最大可忍停机时间 (MTD)`，如图 8-1\
  \ 所示。\n\n![Images](img/00059.jpeg)\n\n***\n\n**图 8-1** 最大可忍停机时间 (MTD)\n\n以下是组织可能使用的一些\
  \ MTD 估计。注意，这些是示例估计值，会根据组织和业务部门的不同而异：\n\n- **非本质**：30 天\n- **正常**：7 天\n- **重要**：72\
  \ 小时\n- **紧急**：24 小时\n- **关键**：分钟到几小时\n\n每个业务功能和资产都应该被归入这些类别之一，取决于组织在没有它们的情况下能生存多久。这些估计值将帮助决定如何优先安排响应团队的工作来恢复这些资产。MTD\
  \ 越短，该功能的优先级越高。因此，分类为“紧急”的项应该在分类为“正常”的项之前处理。\n\n## 恢复时间\n\n时间就是金钱，你越快能将网络恢复到安全运行状态，对组织的底线就越越。。虽然网络资产离线的每一秒都可能产生严重的财务影响，但你不应该为了完整性而牺牲速度。你应该与组织管理层保持沟通畅通，以确定可接受的停机限制。了解检测和修复的关键性能指标\
  \ (KPI) 是什么将有助于消除困惑、管理预期，并可能让你在超出这些指南时证明你的团队准备得有多充分。从长远来看，这对团队声誉可能也有用，并可能为培训和工具争取额外预算。\n\
  \n恢复时间目标 (`RTO`) 经常被使用，特别是在灾难恢复的背景下，表示事件发生后必须恢复业务流程的最早时间，以避免与业务流程中断相关的不可接受的后果。`RTO`\
  \ 值小于 `MTD` 值，因为 `MTD` 值代表在该时间之后，如果无法恢复重大业务将对组织的声誉或底线造成严重且可能无法弥补的损害。`RTO` 假设存在可以接受的停机时间。这意味着组织可以停止生产一段时间（`RTO`）而仍然能够重新运转。但如果无法在\
  \ `MTD` 窗口内恢复生产，组织可能会陷得太快，而无法妥善恢复。\n\n## 数据完整性\n\n关掉网络并不总是网络入侵的目标。对于恶意攻击者来说，篡改数据可能就足以扰乱运营并提供他们想要的结果。财务交易记录、个人数据和专业通信是特别容易受到此类攻击的数据类型。在某些情况下，对数据的攻击是显而易见的，例如涉及勒索软件的情况。在这些情况下，恶意软件将加密系统上的数据文件，使用户在不支付解密密钥的情况下无法访问。然而，对数据完整性的攻击并不总是显而易见的。可能只有在详细检查之后，你才会发现对数据的未经授权的插入、修改或删除。这说明了为什么备份数据和系统配置至关重要，并保持它们与网络充分隔离，以免它们本身受到攻击影响。拥有一个易于部署的备份解决方案将允许服务的极快速恢复。然而，作者警告说，就像薛定谔的猫一样，在尝试恢复之前，任何备份的状态都是未知的。换句话说，光有备份是不够的。必须随着时间的推移进行验证，以确保它没有损坏或恶意软件。\n\
  \n***\n\n**勒索软件**\n\n有组织的犯罪集团经常建立恶意网站，提供伪装成游戏或其他文件的文件的恶意软件。这些文件中包含的恶意软件通常在用户不知情的情况下静默安装，并加密主机系统的部分内容，要求支付解密密钥。对于这些小组来说，这是一个巨大且可靠的收入来源，因为有非常多的用户和组织备份习惯糟糕。讽刺的是，这些小组很少违背交换承诺，因为这对其业务模式将产生巨大的破坏。如果你知道你再也看不到你的数据了，支付的意义何在？\n\
  \n***\n\n## 经济\n\n预测网络入侵的二级和三级效应是困难的。即使某些成本很容易计算，但网络泄露的完整经济影响很难量化。对未妥善保护员工个人信息的组织征收罚款是一个即时且显而易见的成本，但如何准确计算由于身份盗窃导致的未来损失，或由于缺乏信任对组织声誉造成的损害呢？在确定处理事件的行动方案时，在与利益相关者的讨论中包含此类问题至关重要。\n\
  \n计算事件经济范围的另一个考虑因素是涉及资产的价值。对信息的价值评估取决于相关方、开发它需要多少工作、维护成本是多少、如果丢失或损坏会造成多大损害、敌人愿意为它支付多少，以及可以承受什么样的责任罚金。如果组织不知道其试图保护的信息和其他资产的价值，它们就不知道投入多少资金和时间来保护或恢复它们。如果公司商业秘密的计算价值为\
  \ `x`，那么保护或恢复它的总成本应该是小于 `x` 的值。\n\n之前的示例指的是评估信息的价值并保护它，但这一逻辑也适用于组织的设施、系统和资源。必须评估设施的价值，以及所有的打印机、工作站、服务器、外设备、用品和员工。如果你从一开始不知道拥有什么以及它的价值，你就不知道面临着多少损失。\n\
  \n#### 系统流程关键性\n\n\n\n\n\n作为准备工作的一部分，你必须确定哪些流程对于业务运营是至关重要的。这些流程与任务相关，这些任务必须以一定的一致性完成，业务才能保持竞争力。每家企业的关键流程列表各不相同，但尽早识别这些流程至关重要，以便它们在恢复期间能够首批恢复。关键流程列表不仅限于技术资产；它们还应该包含确保这些关键系统重新上线并保持运行所需的关键人员。让组织内的各个成员了解这些核心流程是什么、他们的工作如何直接支持这些流程的目标，以及他们如何从成功的运营中获益是至关重要的。这对于在成功响应事件并从任何产生的损害中恢复所需的获得相应水平支持是有效的。\n\
  \n![Images](img/00005.jpeg)\n\n**考试贴士** 关键性（Criticality）和概率（probability）是风险分析的主要组成部分。`probability`\
  \ 描述的是未来事件发生的可能性，而 `criticality` 则是该未来事件产生的影响。关键性通常用程度表示，例如高、中等或低。低关键性表示对业务运营的影响很小，中等表示性能受损或下降，高则表示业务功能受到严重损害。\n\
  \n### 数据类型\n\n虽然我们采取了措施保护网络上的各种类型的数据，但某些某些类型在存储和传输方面需要特别考虑。以下数据示例均为此类类型，其未经授权的披露可能会对相关的业务、政府或个人产生严重的负面影响。\n\
  \n### 个人识别信息 (PII)\n\n个人识别信息（`PII`）是用于区分个人身份的信息。这些信息可以是唯一的，例如社会安全号码或生物识别特征描述，也可能与其他数据结合以追溯到个人，如姓名和出生日期所示。这些信息通常被犯罪分子用于进行身份盗窃、欺诈或任何针对个人的犯罪。根据你组织运营的监管环境，除了联邦和州法律外，你可能在处理\
  \ `PII` 方面面临额外的要求。一项名为《1974 年隐私法案》的美国联邦法律规定了向联邦实体提供 `PII` 时在收集、存储、使用和共享这些方面的严格规则。在国防部，包含\
  \ `PII` 的文档需要附有适当的标记或封面，如图 8-2 所示。\n\n![Images](img/00060.jpeg)\n\n**图 8-2** 国防部\
  \ 2923 表，隐私法案数据封面\n\n### 个人健康信息 (PHI)\n\n《1996 年健康保险流通性与责任法案》（`HIPAA`）是一项建立了保护个人健康信息（`PHI`）标准的法律。`PHI`\
  \ 是任何与个人的过去、现在或未来的身体或心理健康状况相关的数据。通常，这些信息由医疗保健提供、雇主、公共卫生部门或学校处理。`HIPAA` 要求采取适当的安全措施保护个人健康信息的隐私，并规定了在没有患者授权的情况下共享什么以及与谁共享。`HIPAA`\
  \ 对违规规定了特定的报告要求。违反 `HIPAA` 和未经授权披露 `PHI` 有严重的处罚，包括对负刑事责任方的罚款和监禁。\n\n### 支付卡信息\n\n\
  在之前的章节中，我们讨论了建立技术控制以符合支付卡行业数据安全标准（`PCI DSS`）等标准的重要性。`PCI DSS` 的创建是为了减少信用卡欺诈并保护持卡人信息。作为保护存储、处理或传输数据的全球标准，它根据行业最佳实践规定了通用指南，如图\
  \ 8-3 所示。\n\n![Images](img/00061.jpeg)\n\n**图 8-3** 涉及支付卡处理的商家和其他实体的 PCI DSS 目标和要求\n\
  \n你可以看到，`PCI DSS` 并没有专门规定应该使用哪些技术来实现相关目标。相反，它提供了可能有多种合规选项的要求。虽然 `PCI DSS` 在全球使用，但它并不是美国的联邦标准。虽然越来越多的州制定了法律来防止支付卡信息的未经授权披露和滥用，但\
  \ `PCI DSS` 仍然是卡信息保护的事实标准。\n\n### 知识产权\n\n知识产权是企业的生命。它是关于如何制造某物的特殊知识，或者是让组织从竞争中脱颖出的独特创作。就像实体财产一样，也有法律规定财产所有者的权利。作为安全专业人员，你应该意识到网络上的知识产权，以便采取适当措施防止其未经授权的披露。即使采取了保护知识产权的最佳技术措施，公司仍然面临知识产权暴露的风险。你的政策必须结合最新的法律指导，以确保员工理解保护这些信息的重要性，以及未经授权披露对公司和他们自身造成的后果。\n\
  \n#### 知识产权类型\n\n知识产权分为四类：专利、版权、商标和贸易秘密。当发明者开发了一种新型且实用的工艺或物品并获得专利时，专利将赋予持有者制造、使用、市场化和销售该工艺或物品的独家权利。版权是原始创造性表达的有形表现，无论是书籍、音乐作品、绘画甚至是建筑设计。版权保护延伸到已出版和未出版的作品。需要注意的是，根据“公平使用”原则，任何基于受版权保护作品的批评、评论或教学都可以作为侵犯版权的理由。商标也被称为品牌名称。它是企业用来区分自身或其产品与其他区别的独特术语或名称。与希望公众了解的商标不同，贸易秘密是关于公司如何生产某物的受特殊保护的数据。贸易秘密与其他知识产权形式的不同在于，其细节通常不向任何注册方或其他方披露。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** 知识产权法律因国家而异。例如，美国专利局颁发的专利提供的保护仅在美国领土内有效。因此，了解你运营所在地的当地知识产权法律对于了解法律保护的内容至关重要。\n\
  \n## 极光行动\n\n\n\n\n\n2010 年，Google 披露其遭受了一场复杂的攻击，该攻击似乎有两个不同的目标：监控人权活动者的电子邮件通信，以及获取对敏感源代码的控制权。该行动被确定为名为“极光行动”（Operation\
  \ Aurora）的大行动的一部分，与 Adobe、Juniper Networks、Northrop Grumman 和摩根士丹等知名公司的其他安全漏洞和知识产权盗窃有关。攻击者使用了\
  \ Internet Explorer 的零日漏洞、加密隧道和巧妙的混淆方法，表明这是一个 APT（高级持续性威胁）攻击者。该漏洞允许恶意软件加载到公司计算机上，此时知识产权就可以从网络中外泄。尽管有关攻击的细节有限，但\
  \ Google 声称此次行动的责任是中国政府。作为直接结果，尽管中国的互联网用户数量是美国的两倍以上，Google 仍在中国关闭了其搜索引擎服务。\n\n***\n\
  \n## 公司机密\n\n关于公司内部运营的信息被称为 `corporate confidential information`（公司机密信息）。这可能包括关于公司架构即将变化的通信邮件、营销活动的细节，或任何其他可能不适合公开消费的信息。公司机密信息通常被称为\
  \ `proprietary information`（专有信息）。你经常会在公司文件上看到标记，指示分发应受到严格控制。\n\n### 会计数据\n\n有关公司的财务数据需要像其他敏感数据一样进行特殊处理和保护，即使它可能不会泄露健康或个人数据。在某种程度上，财务数据提供了对组织状况的洞察，并应该以此对待。公司政策和法律指导可能规定处理和存储信息的通用程序，但你应该采取额外步骤，将会计数据与公司内部没有知情需求的人隔离开来。\n\
  \n### 合并与收购\n\n关于公司即将进行的合并与收购的数据是一种敏感公司信息，其滥用通常与欺诈和阴谋有关。如果由于恶意行为者导致有关即将收购的信息被过早披露，可能会对两家公司的财务状况产生严重后果。即将被收购的公司可能会受到操纵或失去其竞争优势。如果员工因为对公司财务或尚未公开的待定收购的特权知识而交易上市公司的股票，他就触犯了一项名为\
  \ `insider trading`（内幕交易）的严重犯罪，这既涉及民事处罚也涉及刑事处罚。证券交易委员会的公平披露规定强制，如果有关公司的特殊知识披露给某一个股东，则必须向公众披露。\n\
  \n## 章节复\n\n无论组织规模大小，你都会成为攻击者的目标。攻击者开展其活动的方式在不断演变。个人行为者、活动团体和国家国家获取恶意软件的能力比以往任何时候都容易得多。问题不再是你*是否*会发生事故，而是*何时*发生。忽视这一事实将使你和你的组织处于危险境地。对事件的妥当规划将向你的客户、利益相关者和关键领导层表明你重视安全，并增强他们对业务系统的信心。如果发生事件，你的准备将使你能够快速识别损害范围，因为你已经识别了需要特殊处理和保护的数据，包括\
  \ PII（个人身份信息）、PHI（个人健康信息）、知识产权、公司机密信息以及你组织的财务信息。然而，准备不仅仅是安全团队的努力。这意味着你协助组织领导层传达安全策略的目标，以及员工支持该策略的作用的重要性。除了获得更顺畅恢复的好处外，针对特殊数据拥有完善的事件处理流程可能会在你的组织因未能保护敏感数据而被诉法庭时保护你免受民事或刑事程序的程序。一旦你获得了组织领导层对应急响应计划的支持，你就需要随着威胁的演变继续对其进行完善和改进。如果某一天你需要执行该计划，你将拥有信心和支持来应对挑战。\n\
  \n### 问题\n\n**1.** 关于零日漏洞（zero-day exploit），以下陈述哪项是正确的？\n\n**A.** 它是供应商未察觉的软件中的缺陷。\n\
  **B.** 它是编写用于利用其供应商未未知的软件缺陷的代码。\n**C.** 它是供应商收到其软件存在漏洞通知的那一天。\n**D.** 它是由国家级对手专门开发的网络武器。\n\
  \n**2.** 高级持续性威胁（APTs）最能通过以下哪项得到说明？\n\n**A.** 国家级对手\n**B.** 网络犯罪辛迪加\n**C.** 黑客活动分子团体\n\
  **D.** 脚本小子（Script kiddies）\n\n**3.** 下列所有项都是确定事故范围的因素，但不包括？\n\n**A.** 恢复时间\n**B.**\
  \ 停止时间\n**C.** 运行时间\n**D.** 数据完整性\n\n**4.** 在以下类型的数据中，哪种数据如果被破坏，最可能需要通知政府实体，以免你的组织遭受罚款或监禁？\n\
  \n**A.** 个人身份信息（PII）\n**B.** 个人健康信息（PHI）\n**C.** 知识产权\n**D.** 会计数据\n\n**5.** 下列所有项都是知识产权类型，但不包括？\n\
  \n**A.** 商业秘密\n**B.** 专利\n**C.** 著作权\n**D.** 受“公平使用”原则涵盖的物品\n\n**6.** 什么是让合并与收购的信息如此敏感？\n\
  \n**A.** 它可以为被收购公司提供不公平的优势。\n**B.** 它受 PCI DSS 监管。\n**C.** 如果披露给公众，可能会导致内幕交易的指控。\n\
  **D.** 它的披露可能违反证券交易委员会的规定。\n\n*请使用以下场景回答问题 7–10：*\n\n你的一家大型私立医院工作，专门从事一种罕见癌症的治疗。该医院声誉很高，患者包括来自世界各地的一些知名人士。就在上个月，一家跨国医疗服务集团悄悄地启动了收购你们医院的努力。在交易敲定或公开之前，由于一个三字母政府机构警告你的老板可能发生了入侵，你被召集起来应对一起特别复杂的事件。攻击者似乎在针对你们的会计系统，但没有数据似乎被修改或删除。初始攻击向量似乎是你们边界防火墙中一个此前未知的漏洞。攻击者似乎已经从你们的系统中外泄了几个月的信息，但这是你第一次听说。\n\
  \n**7.** 谁是最可能的威胁行为者？\n\n\n\n\n\nA. 一个高级持续性威胁 (APT)\nB. 一个网络犯罪集团\nC. 一个心不满的内部人员\n\
  D. 脚本小子 (Script kiddies)\n\n### 8. 你的团队已确认初始攻击向量针对的是你们防火墙中的一个零日漏洞。你下一步应该做什么？\nA.\
  \ 通知防火墙供应商。\nB. 扫描防火墙漏洞。\nC. 为防火墙应用最新的补丁。\nD. 实施可以缓解该漏洞的 ACL。\n\n### 9. 在以下因素中，哪一个对决定事件的影响最为？\n\
  A. 系统进程的关键性\nB. 经济考量\nC. 数据完整性\nD. 恢复时间\n\n### 10. 攻击者可能对以下哪类型的数据感兴趣？\nA. 支付卡信息\n\
  B. 知识产权\nC. 个人身份信息 (PII) 或个人健康信息 (PHI)\nD. 并购\n\n### 答案\n\n**1. B.** 为了利用供应商或用户未知的漏洞编写的代码被称为零日漏洞（zero-day\
  \ exploit）。\n\n**2. A.** 高级持续性威胁（APT）是指任何隐蔽且持续的计算机黑客攻击尝试，通常由拥有大量资源的组织或政府协调并执行。虽然该术语可以指某些强大的犯罪组织，但“国家级对手”是一个更好的答案。\n\
  \n**3. C.** 确定事件影响范围时考虑的关键因素是停机时间、恢复时间、数据完整性、经济考量和系统进程的关键性。\n\n**4. D.** 个人健康信息（PHI）在美国受到严格监管，其披露可能导致民事或刑事处罚。列出的其他类型信息通常不具有这种级别的敏感性。\n\
  \n**5. D.** 知识产权分为四类：专利、版权、商标和商业秘密。\n\n**6. D.** 证券交易委员会的《公平披露》条例（Fair Disclosure）规定，如果将某公司的特殊信息披露给其中一个股东，则必须向公众披露，因此这些信息必须经过仔细控制。\n\
  \n**7. A.** 使用零日漏洞且在网络上停留数月而没有提出任何要求、出售过任何信息或破坏任何东西，这强烈指向高级持续性威胁（APT），该医院卓越的客户群也进一步支持了这一点。\n\
  \n**8. A.** 零日漏洞是软件中的一个缺陷，供应商对此并不知情，尚未发布补丁或公告。除了切换到不同的防火墙外，你不太可能自己减轻损害。最佳行动方案是立即通知供应商，以便其开发补丁。\n\
  \n**9. D.** 攻击者非常隐蔽，似乎没有公开发布过任何收集到的信息。这表明该行动侧重于监视而非财务利润。此外，攻击者似乎没有修改或破坏数据，也没有干扰任何关键进程。这意味着根据可用信息，最能影响影响的因素是你们从这次事件中恢复出来所需的时间。\n\
  \n**10. C.** 攻击者的动机似乎不是由金钱利润驱动的，因此信用卡信息不太可能是目标。同样，攻击似乎在收购之前就已经启动了，这使得并购信息不太可能是攻击目标。虽然攻击者可能在追逐有关癌症治疗的知识产权，但\
  \ APT 更有可能对世界知名人物的 `PII` 和/或 `PHI` 感兴趣。\n\n* * *\n\n# 第 9 章\n## 准备事件响应工具包\n\n在本章中，你将学习：\n\
  * 数字取证如何与事件响应相关\n* 进行取证分析的基本技术\n* 熟悉各种取证工具\n* 如何组装取证工具包\n\n* * *\n\n*没有调查的定罪是无知的顶点*。\n\
  ——阿尔伯特·爱因斯坦\n\n### 数字取证\n\n`Digital forensics`（数字取证）是指收集和分析数据的过程，以确定事件发生以及是如何发生的。`forensics`\
  \ 一词可以定义为一种论证练习，因此数字取证分析师的工作构建基于事实的论证来解释事件是合合理的。安全事件的调查并不非进入法庭，但几乎无法预测它是否会进入。这意味着我们应该对待每一次数字取证调查，就像它最终将面临刑事案件级别的审查标准一样。我们都知道，在尝试让关键进程恢复上线时，这并不总是可能的。美国国家司法学院确定了指导每项调查的以下三个原则：\n\
  \n* 为保护和收集数字证据而采取的操作不应影响该证据的完整性。\n* 进行数字证据检查的人员应经过此类目的培训。\n* 与数字证据的封存、检查或传输相关的活动应被记录、保存并可供审查。\n\
  \n#### 调查的阶段\n\n取证调查像许多其他标准化流程一样，可以分为几个阶段。在这种情况下，我们通常识别四个阶段：封存（seizure）、获取（acquisition）、分析（analysis）和报告（reporting）。封存是控制犯罪现场和潜在证据物品状态的过程。获取是以法律允许的方式保留证据。分析在受控环境中进行，且在不不当污染证据的情况下。最后，目标是产生一份完整、准确且无偏见的报告。\n\
  \n* * *\n\n![Images](img/00009.jpeg)\n\n**注意** 我们将数字取证分为四个阶段——封存、获取、分析和报告，尽管许多组织通过合并封存和获取将其简化为三个阶段。\n\
  \n#### 封存\n\n封存的目标是确保犯罪者和调查人员都不会对证据进行任何更改。一个虽然过于简单但具有说明性的例子是，在发生谋杀的区域放置黄色“犯罪现场”胶带并派守，这样这样杀手无法回来捡带有他们指纹的弹壳。显然，数字犯罪现场的不同之处在于，当调查人员试图收集证据时，犯罪者可能继续隐形地出现在现场并做出更改。\n\
  \n* * *\n\n**控制犯罪现场**\n\n\n\n\n无论犯罪现场是物理的还是数字的，控制谁接触犯罪证据对于确保其完整性至关重要。以下是保护犯罪现场时应该采取的一些步骤：\n\
  \n* 仅允许授权人员进入现场。\n* 确保每个参与技术任务的人员都接受了针对其角色的培训并获得了证书。\n* 记录在犯罪现场现场的人员。\n* 记录最后与系统交互的人员。\n\
  * 如果犯罪现场确实被污染了，请予以记录。污染可能不会导致推导出的证据失效，但会使案件调查变得更具挑战性。\n\n你可以采取的最重要的步骤之一是*不要*关闭你不需要关闭的任何设备。这一规则唯一的通用例外是：你非常确定有一个运行中的进程正在蓄意破坏证据。保持设备运行有很多原因，但其中关键的一点是，内存取证（即对计算设备的主存储单元进行数字取证）在过去几年中发生了巨大的变化。虽然威胁攻击者可能会安装隐藏进程、连接或文件的根内核程序（rootkits），但在运行的内存中隐藏踪迹几乎是不可能的。此外，越来越多的恶意软件从不直接接触文件系统，而是完全存在于内存中。在未先获取内存内容的情况下关闭设备，可能会导致无法准确还原事件。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** 为了获取易失性内存，你可能需要对计算机进行一些更改，这通常包括连接外部设备和执行程序。只要你记录了你所做的一切，这就不应导致证据在法庭上不可接受。\n\
  \n另一个重要（尽管看似平凡）的步骤是记录设备周围的整个物理环境。一个简单的方法是对现场拍摄大量照片。这里列出了你通常想要拍摄的特定。无论你是否拍照，都应该记录笔记，不仅描述环境，还要描述你的团队获取证据时采取的每一个动作。\n\
  \n* 显示运行程序的电脑桌面（如果设备已解锁）\n* 连接到设备的外围设备（例如 U 盘和外部硬盘）\n* 设备的紧邻环境（例如物理桌面）\n* 设备的近邻环境（例如房间或隔间）\n\
  \n### 战地故事：一画胜于千言……\n\n我们曾与一位联邦执法探员谈论犯罪现场摄影的最佳实践。他描述了一个案件，他搜查了一名嫌疑人的家并缴获了大量证据，包括几十张\
  \ CD 盘。当他们试图获取硬盘内容时，发现它受到强力全盘加密的保护。他们向嫌疑人索要密码，但嫌疑人高兴地告诉他们他不知道。我们的朋友不可置信地询问这怎么可能。嫌疑人回答说，他从未背过密码，因为那只是每张\
  \ CD 盘标题的第一个字母。令他恐惧的是，我们的朋友意识到他没有拍摄任何显示这些 CD 盘顺序的照片，而这些磁盘在处理过程中被弄乱了。\n\n在记录完环境后，就可以开始拔掉连接并带走它们。对缴获的所有物品进行正确的标记、标签和清单记录至关重要，这样以后对物品在哪里就不会产生疑问。你还需要拆卸和移除工具，如防静手环、钳子和螺丝刀。最后，你需要适当的包装，如防静袋和证据袋。你应该记住，天气条件（例如极端温度、雪或雨）也可能对你的包装和运输安排提出额外要求。\n\
  \n### 监管链\n\n*监管链*（chain of custody）是一份记录了证据在过程每个阶段如何被收集、运输和保存的历史。由于数字证据可以被轻易修改，清晰定义的监管链证明了证据是可信的。在每个案件中收集和标记证据时，遵循非常严格且有组织的程序是非常重要的。此外，监管链应该贯穿证据的整个生命周期，从识别开始，到销毁、永久存档或归还所有者结束。图\
  \ 9-1 显示了可用于此目的示例表格。\n\n![Images](img/00062.jpeg)\n\n**图 9-1** 证据容器数据\n\n### 服务器\n\
  \n对服务器进行取证分析与工作站需要处理额外的问题。首先，可能无法将服务器离线并移至安全的分析室。相反，你可能别选择在现场进行简要分析。*现场取证*（live\
  \ forensics，或现场响应）是在在整个调查期间保持运行的设备上进行数字取证。我们在之前描述在关闭设备之前捕捉易失性内存内容的重要性时，已经提到了相关问题。如果你无法将服务器从生产环境中移除，那么最好的办法就是捕捉其内存内容和感兴趣的文件（例如日志文件）。\n\
  \n处理服务器时的另一个考虑因素是，它们的存储空间（主存和次要存）通常比工作站多得多。这保证了过程会更长，但也可能需要特殊工具。例如，如果你的服务器使用冗余廉价阵列（RAID），你可能需要专用工具来处理这些磁盘。除了硬件差异，你还需要考虑运行在服务器上的软件的特定架构。Microsoft\
  \ Exchange Server 拥有许多帮助取证调查员的功能，但该人员必须熟悉 Exchange 复杂的架构。这一点对于数据库管理系统（DBMS）和公司内部\
  \ Web 应用同样适用。\n\n### 移动设备\n\n如今，犯罪调查中不包含移动设备取证已属罕见。虽然这在企业世界较少见，但你应该意识到移动设备带来的独特挑战。主要挑战是，除非你关闭电源，否则设备将继续与网络通信（我们已经说过这可能不是个好主意）。这意味着犯罪分子可以远程删除设备或对其进行篡改。解决此问题的方法是将设备放入法拉笼容器中，防止其通过无线电通信。法拉笼袋具有吸收射频（RF）能量并重新分配的特殊属性，可以防止容器内设备与外部之间的通信。显然，在你缴获设备后，你还需要一个更大的法拉笼设施来对设备进行分析。\n\
  \n#### 提取\n\n\n\n\n\n`Forensic acquisition` 是从扣收的证据中提取数字内容以便对其进行分析的过程。这通常被称为对硬盘进行取证镜像，但实际上包含的内容不仅于此。你想要提取内容的主要原因是你希望在证据的副本上进行分析，而不是在原始证据上。在整个过程中，保持原始证据的完整性至关重要。为了以一种保护和保存证据的方式获取原始数字证据，通常认为以下步骤是最佳实践：\n\
  \n### 1. **准备目标媒体。** 你需要一个地方来存储被扣收证据的数字内容。该目标可以是移动式硬盘或存储区域网络（SAN）。你必须确保目标介质没有任何可能污染证据的内容。做到此点的最佳方法是使用固定模式的\
  \ 1 和或 0 覆盖介质，对其进行安全擦除。\n\n### 2. **防止原始数据发生变化。** 仅仅将设备连接到计算机或复制器这一操作，通常会导致其内容发生微小但可能具有重大影响的变化。为了防止任何变化，你必须使用写保护机制，例如硬件写保护器（在本章稍后部分将描述）。某些取证采集软件产品支持基于软件的写保护，但使用物理保护器几乎总是更好的。\n\
  \n### 3. **对原始证据进行哈希处理。** 在复制任何内容之前，你应该对原始证据进行加密哈希处理。大多数产品支持 `MD5` 和 `SHA-1` 哈希。尽管这些协议已被证明容易受到碰撞攻击且不再建议用于通用，但我们尚未看到法院在刑事审判中对其可采性提出过异议。\n\
  \n### 4. **复制证据。** 各种应用程序都可以让你对数字介质进行取证复制，包括 Linux 系统中资老的 `dd` 工具。这些应用程序的共同点是它们对整个源介质执行完全二进制拷贝。仅复制文件是不够的，因为你可能无法获取删除或未分配空间中的相关数据。\n\
  \n### 5. **验证采集结果。** 复制完成后，对副本进行加密哈希处理并与原始数据进行比较。只要它们匹配，你就可以对副本进行分析，并确保它与原始完全相同。\n\
  \n### 6. **保护原始证据。** 因为你现在有了证据的完美副本，请将原始证据存放在安全的地方，并确保没有人能够访问它。\n\n## 分析\n\n分析是解释提取出的数据以确定其对案件意义的过程。可能执行的分析类型示例包括：时间线（即在什么时候发生了什么）、数据隐藏（即被刻意隐藏的内容）、应用程序和文件（即哪些应用程序访问了哪些文件）以及所有权和占有（即哪些用户账户访问了哪些应用程序和文件）。尽管你使用的特定应用程序和命令可能会根据涉及的操作系统或文件系统而异，但关键问题是相同的。取证分析师最重要的工具之一是时间线。它为比较系统在不同时间点的状态建立了一个框架。例如，你可能怀疑用户可能在上周五通过将文件复制到\
  \ U 盘来盗取文件，但直到周一你才在系统上看到该驱动器的注册记录。在没有系统数据和时间被篡改的证据的情况下，你可以得出结论：外泄机制并不是那个 U 盘。时间线仅仅是在系统上执行的操作的有序列表。这些操作可以归类为对感兴趣项的读取、写入、修改和删除操作。我们认识的许多调查员只需在电子表格中跟踪他们的时间线，包含如下所示的列：\n\
  \n* 数据和时间\n* 时区\n* 源（例如 Windows 注册表或 `syslog`）\n* 项目名称（例如注册表项名称或文件名）\n* 项目位置（完整路径）\n\
  * 描述\n\n* * * \n\n![Images](img/00005.jpeg)\n\n**考试提示** 你应该始终对系统时间戳保持适度的怀疑。众所威胁者有时会修改系统时钟来隐藏其操作的真实顺序。这种做法被称为\
  \ `timestomping`（时间戳攻击）。\n\n在过程的每一步，你都应该对你采取的每个特定操作记录详细的笔记，精确到你使用的命令和参数。如果你使用如 `EnCase`\
  \ 或 `FTK` (Forensic Toolkit) 等取证分析套件，工具将为你记录你的操作。尽管如此，在整个调查过程中记录自己的笔记仍然是一种最佳实践。\n\
  \n## 报告\n\n如果你一直在做笔记，那么在进行调查的过程中就已经一直在编写报告的部分内容。一旦你根据可用证据得出了可靠的结论，你只需要汇总叙述性陈述，以易读的方式展示你的论点和结论。像任何形式的通信一样，了解你的受众至关重要。如果报告面向执行领导层，该文档将与你在法庭上提交报告时不同。所有主要的商业套件也具有生成可供你自定义的草稿报告的功能。\n\
  \n### 取证调查套件\n\n取证调查本质本质是极其耗时的。幸运的是，许多软件开发者创建了套件来辅助该过程的许多方面。\n\n### 采集工具\n\n取证调查的采集阶段在确保证据、分析和结论的可采性方面可能是最关键的点。这是你可能希望放慢速度、使用检查清单并确保完全不犯任何错误的地方，因为这样做可能会导致后续的所有工作失效。\n\
  \n### 取证复制器\n\n取证复制器是可以在从源到目标复制数据，同时确保没有任何比特位被更改的系统。它们与任何复制工具的区别在于，它们不依赖于文件系统操作，这意味着它们可以恢复文件系统构件，例如\
  \ Windows 中的主文件表 (`MFT`) 和 Linux 中的节点节点表。\n\n### dd\n\nLinux 中资老的苦力是是 `dd` 工具，大多数系统都默认自带它。由于\
  \ Linux 使用的扩展文件系统 (`ext`) 中的几乎所有内容都是“文件”，`dd` 可以在文件、设备、分区和卷之间复制数据。以下命令将硬盘 `hda`\
  \ 逐位复制到文件 `case123.img`，块大小为 4096 字节，如果遇到错误，它将用空符号填充剩余块：\n\n```\ndd if=/dev/hda\
  \ of=case123.img bs=4k conv=noerror,sync\n```\n\n注意，此命令没有生成输出文件的哈希，而我们需要它来进行验证。解决方案是单独使用\
  \ `sha1sum` 命令。\n\n### FTK Imager\n\n`FTK Imager` 是 Access Data 开发的免费数据预览和镜像工具。与\
  \ `dd` 工具不同，该镜像是一个功能齐全的产品，允许你执行符合取证要求的采集，通过生成 `MD5` 和/或 `SHA-1` 哈希进行验证，并以只读方式预览文件和文件夹。`FTK\
  \ Imager` 还可以读取 Windows 注册表项并让你预览它们及其值。它还支持压缩、加密和多种输出格式，包括 EnCase 证据文件格式 (`E01`)\
  \ 和 `dd` 生成的原始格式。\n\n\n\n\n\n# 密码破解器\n\n在从移动设备到后端服务器的一切中，发现加密文件或`drives`变得越来越常见。如果嫌疑人无法或不愿提供密码，或者根本没有可以审问的嫌疑人，你可能需要借助专用软件，这些软件旨在猜测密码并解密受保护的。该领域一种流行的商业解决方案被称为\
  \ `Passware Kit Forensic`。它可以独立运行，也可以与 `EnCase` 集成。`Passware Kit Forensic` 可以解密\
  \ 280 多种类型的保护文件，包括 `BitLocker`、`FileVault`、`iCloud` 和 `Dropbox`。此外，由于密码破解可能需要很长时间，该工具可以利用图形处理器（`GPUs`）和多台网络计算机来加速这一过程。\n\
  \n## 加密工具\n\n我们通常必须确保调查及其证据的机密性。为了实现这一点，我们可以转向适用于多个平台的各种加密工具。加密文件最简单的方法可能是使用大多数操作系统自带的压缩实用程序，但你必须确保提供了密码。这种方法的优点是，这些应用程序无处可见，且文件在大多数平台上都是通用的。\n\
  \n如果你需要更健壮一些的东西，可以尝试任何可用的加密工具。最受欢迎且推荐的开源解决方案之一是 `VeraCrypt`，它基于已失效的 `TrueCrypt`。该工具免费，并适用于\
  \ Windows、`OS X` 和 Linux 系统。`VeraCrypt` 支持多种加密系统，包括 `AES`、`TwoFish` 和 `Serpent`。它还支持在卷内部创建隐藏的加密卷，如图\
  \ 9-2 所示。最后，该工具正在持续开发，并定期进行安全更新。\n\n![Images](img/00063.jpeg)\n\n**图 9-2** VeraCrypt\
  \ 创建加密卷\n\n## 哈希实用程序\n\n法证分析中最流行的哈希算法是 `MD5` 和 `SHA-1`，本章讨论的所有流行工具都支持它们。如果你需要一个独立的哈希实用程序，许多操作系统都默认包含了这些工具。`Mac\
  \ OS` 提供了从命令行使用的 `md5` 工具。`Linux` 通常同时拥有 `md5` 工具和 `sha1sum`。最后，微软提供了`文件校验和完整性验证器`（`FCIV`）工具作为免费但不受支持的下载。`FCIV`\
  \ 能够计算 `MD5` 和 `SHA-1` 哈希。\n\n## 分析实用程序\n\n最广泛使用的商业分析工具是 `Guidance Software` 的 `EnCase`\
  \ 和 `Access Data` 的 `Forensic Toolkit (FTK)`。这些工具并不便宜，但也有许多免费或较廉的选项，包括 The Sleuth\
  \ Kit。我们将在本节中逐一描述这些这些工具。\n\n### EnCase\n\n`EnCase` 可能是执法机构以及一些大型企业中使用得广泛的分析工具。仅将其描述为分析工具可能不太准确，因为它实际上可以执行采集（包括在线和离线）、分析和报告。在采集方面，该产品提供了在所有端点和服务器上运行代理的选项，可用于通过网络远程采集。这意味着你不需要物理收缴设备即可获取其数据。\n\
  \n`EnCase` 对领域的贡献之一是创建了专有的（但广泛使用的）`EnCase Evidence File`格式。这种格式的文件通常具有 `.E01` 扩展名，尽管这不是必须的。该格式之所以具有如此影响力，是因为它将压缩、加密和元数据集成在同一个文件中。如果你正在开发证据驱动器的原始镜像或位对镜像，你将得到多个文件：副本、哈希值和元数据（例如，证据标签和案件号）。你完全可能还有与副本相关的其他文件。此外，如果你想节省空间或确保证据的机密性，你必须单独压缩和/或加密文件。`EnCase`\
  \ 的格式允许以几乎透明的方式将这一切整合到一个文件中。\n\n### FTK\n\n另一个非常流行的套件是 `Forensic Toolkit`，它的使用范围几乎与\
  \ `EnCase` 相当。两个系统的用户有时会指出 `FTK` 的用户界面更直观，但这显然是一个主观问题。真正让 `FTK` 与许多区分开来的是它的基础数据管理模型。由于该工具构建在数据库管理系统之上，它能够高效地处理海量数据。在最新版本中，`FTK`\
  \ 赞称支持 `ElasticSearch`，这是一种非常流行的、为处理大数据源设计的开源搜索引擎。然而，与这些功能相关的数据预处理和索引可能会导致初始案件上传比其他解决方案耗时长。\n\
  \n### The Sleuth Kit\n\n完善我们分析套件的是 Brian Carrier 的开源工具 `The Sleuth Kit`。`EnCase`\
  \ 和 `FTK` 极力呈现一种统一的用户体验，隐藏了在后台支持分析师运行的许多工具，而 `The Sleuth Kit` 则更直白地是一系列可操作的工具，其中许多工具专门使用命令行界面。然而，如果你更倾向于拥有与商业解决方案相当的图形用户界面（`GUI`），你可以配合\
  \ `The Sleuth Kit` 使用 `Autopsy` 来完成工作，如图 9-3 所示。这些工具共同完成了 `EnCase` 和 `FTK` 执行的大部分工作，但与每个许可证数千美元的价格相比，它们是免费的。\n\
  \n![Images](img/0064.jpeg)\n\n**图 9-3** 用于 Sleuth Kit 的 Autopsy 界面\n\n## OS 和进程分析\n\
  \n操作系统（`OS`）是管理和控制与计算机交互的软件系统。虽然今天有很多操作系统，但它们执行相同的三个基本功能：\n\n- 管理所有计算机资源，如内存、CPU\
  \ 和磁盘\n- 提供用户界面\n- 为运行应用程序提供服务\n\n对于法证分析师来说，第一项是特别感兴趣的，因为计算机系统上发生的每一个操作都是通过其 `OS`\
  \ 进行的。\n\n如果你正在调查微软 Windows 系统，两个最重要的信息源是注册表和事件日志。注册表是 Windows 存储大多数系统设置的主要数据存储。虽然主要的分析套件包含了此类数据库的查看器，但你也可以在任何\
  \ Windows 计算机上通过启动注册表编辑器直接检查它。注册表中可以找到数百个感兴趣的制品，包括：\n\n- **自动运行位置**：这是程序告诉 Windows\
  \ 应该在引导过程中启动的地方。恶意软件经常利用此处持久化（例如，`HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\\
  Run`）。\n- **最近使用列表**：通常称为 `MRUs`，在这里找到最近启动的应用程序、最近使用或修改的文档以及最近更改的注册键。例如，如果你想查看最近使用的\
  \ Word 文档，你将查看 `HKEY_CURRENT_USER\\Software\\Microsoft\\Office\\12.0\\Common\\Open\
  \ Find`。\n- **无线网络**：每当计算机连接到无线网络时，这都会记录在注册表中，你作为调查人员可以在 `HKLM\\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\NetworkList\\Profile` 中进行检查。\n\n\n\n\n\n另一个有用的信息源是事件日志，你可以通过在任何\
  \ Windows 计算机上启动“事件查看器”应用程序来访问它。实际上存在多组日志，其数量取决于特定的系统。然而，所有的 Windows 计算机都有应用程序日志，应用程序会在其中报告使用情况、错误和其他信息。此外还有安全日志，操作系统在其中维护安全相关的事件，例如未成功的登录尝试。最后，每个\
  \ Windows 系统都有系统日志，操作系统在其中记录整个系统范围的事件。\n\n虽然 Linux 没有像 Windows 那样方便的集中注册表，但对于法医调查人员来说，它有自己的一套丰富的痕物来源。首先，许多相关数据可以在明文文件中找到（与\
  \ Windows 不同，这使得搜索字符串变得简单）。Linux 通常还包含许多实用的工具，如 `dd`、`sha1sum` 和 `ps`，它们可以分别帮助你获取证据、对其进行哈希处理，并获取运行进程列表（以及与之相关的资源）。你可以在\
  \ Windows 中完成所有这些操作，但需要安装额外的工具。\n\nLinux 文件系统从根目录开始，用斜杠 `/` 表示。作为一名分析师，你需要熟悉某些目录。我们重点介绍了其中的几个，但你应该从此开始建立你自己的列表。\n\
  \n* `/etc`: 这是主要的系统配置目录，包含大多数已安装应用程序的子目录。\n* `/var/log`: 所有运行良好的 Linux 应用程序都会将日志文件保在此目录下的明文文件中，这里是分析师的金矿。\n\
  * `/home/$USER`: 这里，`$USER` 是一个变量名，你应该将其替换为指定的用户名。所有用户数据和配置数据都存储在这里。\n\n请注意，这个列表只是一个开始。你应该从这里建立你自己的列表。\n\
  \n### 移动设备取证\n\n虽然可以在运行中的 Windows 或 Linux 系统上进行一些取证分析，但移动设备需要专门的取证工具。这一规则的例外是越狱的\
  \ iPhone 或 iPad 以及已根的 Android 设备，因为这两者都暴露了与 Linux 非常类似的操作系统，并包含一些相同的工具和位置。为了增加趣味性，许多手机需要特殊的电缆，尽管近年来向\
  \ USB-C 的迁移由于更多设备采用此接口而简化了这一点。\n\n移动取证涉及的挑战之一仅仅是获取数据。移动操作系统的设计并不支持数据提取，这意味着法医分析师必须先让设备加载备操作系统。这通常需要自定义引导加载程序（bootloader），这几乎是任何移动取证工具包必不可少的特征。\n\
  \n移动设备的另一个特性是，其大部分数据存储在如 `SQLite` 等微型数据库管理系统中。这些系统需要特殊工具才能正确查看其数据。然而，它们的优势是，当用户要求删除时，它们几乎不会删除。相反，它们会将数据库表中的行标记为已删除，并保持其完整内容不变，直到新数据覆盖它们。即使如此，底层文件系统也允许恢复这些被删除的信息。与引导加载程序一样，任何常用的分析套件都将包含分析这些数据的方法。\n\
  \n## 日志查看器\n\n每个主流操作系统都提供了查看日志文件内容的方法。你可能需要专用日志查看器的原因是，内置工具旨在用于初步检查，而不是详尽分析，特别是当日志数量达到数千条时。与目前为止描述的大多数功能一样，这种功能通常出现在法医分析套件中。如果你需要专用的日志查看器，选择并不匮乏，包括许多免费选项。\n\
  \n使用独立日志查看器有意义的场景是：当你正尝试汇总来自多台计算机的各种日志，以建立全局事件的时间线时。你需要一个允许你导入多个文件（或运行系统）并以多种方式过滤其内容的工具。允许你此的一些工具包括\
  \ Splunk、SolarWinds Event Log Consolidator/Manager 以及 Ipswitch 的 WhatsUp。\n\n##\
  \ 构建你的取证工具包\n\n对于取证工具包中应该放什么，没有万一不变的答案。这实际上取决于你的环境和工作流程。尽管如此，如果你的工作涉及取证分析，那么几乎每个人都应该准备一些通用类型的工具。\n\
  \n### 应急包 (Jump Bag)\n\n应急包是一组预先包装好的工具，随时准备好在不接到通知的情况下出发。当你被要求放下手头所有工作去响应可能涉及取证检查的事件时，它是你的第一道防线。由于你想确保工具包始终处于就绪状态，你可能希望制定一个清单，在每次使用后对包进行清点，以确保它为下次运行做好准备。你可能想在其中包含以下每一项物品。\n\
  \n### 写保护器和驱动器适配器\n\n硬件写保护器可以在获取存储设备内容时防止对其进行修改。它们有许多种类和价位，但本质上它们的作用都是相同的。最重要的考虑因素是它们支持的接口类型。你应该咨询你的资产清单，看看你的环境中有多少种不同的磁盘接口。某些工具支持\
  \ SCSI 和 ATA，但不支持 SATA，另一些工具可能不支持 USB 设备。只要你为组织中的每种存储设备接口都准备了适配器和电缆，你的情况就是很理想了。\n\
  \n### 电缆\n\n你应急包的很大一部分可能分配给各种类型的电缆。一个可以遵循的良好原则是：如果你以前需要过某种特定的电缆，那么你可能应该永远把它放在你的应急包里。以下是一些你可能想要开始准备的电缆建议：\n\
  \n* 网线（交叉线、直通线、单向线）\n* 串口线（各种类型的 USB 和 RS-232）\n* 电源\n* 一个小型以太集线器\n* 静电手环\n\n###\
  \ 已擦除的可移动介质\n\n在响应事件之前，你可能没有几个小时的时间来擦除硬盘，因此提前准备几个是明智的。接口类型并不太重要（只要你的写保护器支持它即可），但容量很重要。一个良好的原则是查阅你的资产清单，找到组织中最大的工作站或外部硬盘，并在包中准备至少两倍大小的存储空间。服务器的硬盘通常比工作站大得多，所以如果你担心这个问题，你可能需要投资像\
  \ Forensic Computers 的 Forensic Data Monster 这样的便携式 RAID 解决方案。\n\n对于经常处理调查的组织，一种常见的方法是为取证镜像专门设置网络附属存储\
  \ (NAS) 解决方案。只要有快速的网络连接，你轻松地镜像任何工作站或服务器。一个额外的优势是，NAS 可以作为尚待法决的过去调查的存档机制。在这种情况下，遵守组织的数据留存政策很重要。\n\
  \n#### 相机\n\n\n\n\n相机是你的应急包（jump bag）中一个经常被忽视但关键的物品。拍摄犯罪或事件现场非常重要，但任何带有闪光灯的数字相机都能胜任。相机的一个很有用的补充是一个小尺子，每当你需要捕捉距离感或比例时，都可以将其纳入拍摄范围。理想情况下，尺子应该具有哑光表面以减少反光。\n\
  \n## 犯罪现场带\n\n这听起来可能有些多此一举，但通过手段通知该区域的人员不要进入对于取证过程至关重要。犯罪现场带（或其他限制区域标签胶带）可以很好且廉价地完成这项工作。\n\
  \n## 防封条\n\n当你收集的证据数量或运输距离需要他人的协助（例如驱动员）时，你可能希望用防篡封条密封证据容器。在紧急情况下，你可以使用胶带并在上面签名。然而，如果能负担得起费用，专用的带锁容器是最好的。\n\
  \n## 文档和表格\n\n根据你所属机构，许多表格和其他文档可能只以数字形式存在。尽管如此，打印纸质副本并放在你的应急包中是一个好主意，因为你永远不知道在事件响应过程中是否能够访问公司的数据存储。以下是我们大多数人会放在包里的某些物品。\n\
  \n### 证据链表单\n\n图 9-1 显示了一个典型的证据链表单，但如果你还没有这种表单，应该根据你组织的要求对其进行定制。重要的方面是确保每件被扣押的证据都有有足够的副本。理想情况下，你的证据运输容器外部有一个防水袋，你可以将容器的表单放入袋中（其中的单个物品可能仍需要自己的表单）。\n\
  \n## 事件响应计划\n\n事件响应以某事的形式开始并演变成另一种形式的情况并不罕见。特别是当涉及可能具有法律影响的问题（例如取证调查）时，在应急包里准备一份计划副本是一个好主意。这样，即使你与网络断开连接，你也会知道在遇到的任何情况下被预期或要求做什么。\n\
  \n### 事件日志\n\n每位优秀的调查员都会做笔记。当你进行复杂的调查时（大多数数字取证调查都是如此），记录你所采取的每一个行动和正在考虑的每一个假设是非常关重要的。这种详尽程度最重要的原因是，你的结论有效性仅取决于你的过程是否具有可重复性。换句话说，任何可以访问你相同证据的合格个人都应该遵循你的笔记并获得与你相同的结果。在应急包里放一个笔记本和一支笔可以确保你随时准备记录你所做的事情。\n\
  \n### 电话/升级列表\n\n如果现场情况与你开始调查时预想的不符，你可能需要给某人打电话通知他们重要的进展，或请求执行某些操作的授权。虽然电话/升级列表实际上应该是你事件响应计划的一部分，但将其作为你应急包中的一个重要物品单独列出是值得的。\n\
  \n### 章节总结\n\n数字取证调查需要极高的纪律和对既定流程的严格遵守。对这些活动采取草率的方法可能意味着成功解决事件与目睁睁看着威胁者实施犯罪行为并逃脱之间的区别。挑战在于如何在对不需要这种程度努力的事件做出快速响应，与尽早识别那些足够早调整团队应对策略的案例之间取得正确的平衡。因为你可能不知道哪些事件会升级为取证调查，所以你应该随时准备在没有任何通知的情况下以这种方式执行。\n\
  \nCSA+ 考试将要求你了解四步流程（扣押、获取、分析、报告）以及你在每个阶段采取的行动。例如，你可能会看到这样的问题：向你展示一个流程某部分已经完成的场景，并询问你下一步做什么。这可能要求你熟悉如何使用一些最常用的工具，例如\
  \ Linux `dd` 工具。虽然你可能不会看到要求你发布带参数的命令的问题，但你可能需要解释此类工具的输出，并对可能发生的情况进行某种简单分析。\n\n###\
  \ 问题\n\n**1.**](#part0019.html#ch9qus_1) 在发生严重事件时，哪项任务*不是*控制犯罪现场的关键步骤？\n\nA. 记录与数字系统的任何交互。\
  \  \nB. 验证参与调查的人员的角色和培训。  \nC. 切断当前运行系统的电源。  \nD. 仔细记录谁进入和离开了现场。\n\n**2.**](#part0019.html#ch9qus_2)\
  \ 监控证据处理方式以确保其在调查期间完整性的做法被称为什么？\n\nA. 控制链 (Chain of control)  \nB. 关注链 (Chain of\
  \ concern)  \nC. 指令链 (Chain of command)  \nD. 证据链 (Chain of custody)\n\n**3.**](#part0019.html#ch9qus_3)\
  \ 作为取证分析的一部分，哪项关键活动通常包括过程和操作系统的图形化表示？\n\nA. 注册表编辑  \nB. 时间线分析  \nC. 网络映射  \nD. 写入阻塞\
  \  \n\n**4.**](#part0019.html#ch9qus_4) 在取证获取期间，为什么在准备目标介质时，高级格式化是不够的？\n\nA. 高级格式会完全擦除驱动器，但可能会添加痕迹。\
  \  \nB. 高级格式只删除文件数据，保持系统完好。  \nC. 高级格式只删除文件系统数据，保持文件数据完整。  \nD. 高级格式会移除坏道，但保持文件数据完整。\n\
  \n**5.**](#part0019.html#ch9qus_5) 修改或删除数据的行为被称为什么？\n\nA. 时间戳攻击 (Timestomp)  \n\
  B. 时间戳标记 (Timestamping)  \nC. 时间线化 (Timelining)  \nD. 时间位移 (Timesifting)\n\n使用以下命令行输入回答问题\
  \ 6-8：\n\n```\ndd if=/dev/sda of=/dev/sdc bs=2048 conv=noerror,sync status=progress\n\
  ```\n\n**6.**](#part0019.html#ch9qus_6) 每次读写的数据位数是多少？\n\nA. 2048  \nB. 16384  \n\
  C. 256  \nD. 512\n\n**7.**](#part0019.html#ch9qus_7) 目标镜像的名称是什么？\n\nA. sda  \nB.\
  \ /dev/sda  \nC. sync  \nD. sdc\n\n**8.**](#part0019.html#ch9qus_8) 该命令的目的是？\n\n\
  A. 将主分区复制到镜像文件。  \nB. 从镜像文件恢复硬盘内容。  \nC. 将硬盘的所有内容复制到镜像文件。  \nD. 删除 /dev/sda 的所有内容。\n\
  \n使用以下场景回答问题 9–12：*\n\n\n\n\n你被传送到一起重大事件的现场，被要求对数字证据进行取证采集。主要目标是一个为小型公司运行多项服务的 Linux\
  \ 服务器。前管理员被涉疑利用公司资源运行非法服务，并拒绝提供访问系统的密码。此外，服务器旁边的桌子上放着几台公司拥有的手机，它们似乎仍在正常工作。\n\n###\
  \ 9. 在准备分析服务器硬盘时，你的首要任务之一是什么？\n\n**A.** 对所有存储介质进行哈希处理，然后制作硬盘的副本。\n**B.** 在目标系统上开始分析并反复执行\
  \ `MD5` 哈希计算。\n**C.** 将全部内容复制到 SAN 或外部存储器中并开始分析。\n**D.** 在掉电之前立即对服务器进行分析。\n\n###\
  \ 10. 哪种工具允许你对硬盘内容进行位对（bit-for-bit）的复制？\n\n**A.** MFT\n**B.** `dd`\n**C.** `MD5`\n\
  **D.** GPU\n\n### 11. 你可能会使用哪种专用软件来恢复访问系统所需的凭据？\n\n**A.** 取证复制器\n**B.** `dd`\n**C.**\
  \ 密码破解器\n**D.** `MD5`\n\n### 12. 你想将手机带回实验室进行进一步调查。在运输过程中，你可能会使用哪两种工具来维护设备完整性？\n\
  \n**A.** 法拉第袋和防篡封条\n**B.** 写写保护器和现场警戒带\n**C.** 优盘盘和现场警戒带\n**D.** 取证工具箱和防篡封条\n\n\
  ### 答案\n\n1. **C.** 除非是为了保护生命或肢体，或其他紧急情况下，否则不应切断电源。在许多情况下，可以恢复存储在运行内存中的证据。\n2. **D.**\
  \ `证据链`（chain of custody）是一份记录了证据在调查过程每个阶段如何被收集、运输和保存的历史记录。\n3. **B.** 时间线分析是将从\
  \ UNIX 文件系统、Windows 表或移动设备中提取的数据按时间顺序排列的做法，以便更好地理解可疑事件的情况。\n4. **C.** 目标介质应不包含任何可能污染证据的物质。完全删除数据需要覆盖目标存储介质的每个区块，如果你使用高级格式化工具，则始终可以执行。\n\
  5. **A.** 戳篡改（Timestomping）是一种操纵文件创建或修改数据以对抗取证技术的先进技术。它经常被恶意软件用于使时间线分析的过程变得更加困难。\n\
  6. **B.** `bs` 参数表示字节数。因为一个字节有 8 位，所以你需要乘以 8 得到 64。\n7. **D.** `of` 参数表示输出文件。\n\
  8. **C.** `/dev/sda` 是源。\n9. **A.** 在执行任何操作之前，你希望先对原始数据进行哈希处理。\n10. **B.** `dd`\
  \ 是大多数系统中常见的工具。\n11. **C.** 密码破解器是设计用于猜测密码的专用软件。\n12. **A.** 法拉第袋可以防止设备通过电波进行通信。\n\
  \n***\n\n# 第 10 章：选择最佳行动方案\n\n在本章中，你将学习：\n* 如何通过网络症状诊断事件\n* 如何通过主机症状诊断事件\n* 如何通过应用症状诊断事件\n\
  \n*诊断不是终点，而是实践的开始。*\n—*Martin H. Fischer*\n\n### 诊断简介\n\n英语单词 *diagnosis* 源于希腊语\
  \ *diagignōskein*，字面意思是“彻底了解”。因此，诊断意味着能够看透错杂事实，聚焦于相关事实并找到真实原因。与好莱坞电影不同，现实世界中的安全事件会为你提供许多误导性选择，因此保持专注至关重要。\n\
  \n### 网络相关症状\n\n我们从这里开始，因为你可能会从外部向内部开始。我们的网络传感器通常会提供某些出现异常的首要指标。有了这些信息后，我们就可以询问主机以及运行在它们上的进程。在接下来的讨论中，我们假设你已经通过各种传感器构建了网络，我们将使用它们的输出。\n\
  \n### 带宽利用\n\n在计算中，*带宽*（Bandwidth）被定义为数据通过介质的速率，通常以每秒比特计。网络的设计是为了在峰值使用时间支持组织的需求，但在非高峰期间通常有空余容量。每个网络都有自己的利用模式。攻击者可以通过两种方式利用这些特性：首先，有耐心的攻击者可以使用“低速缓慢”的方法在用量高峰期间隐藏数据外泄；然而，大多数攻击者会尝试快速下载敏感信息，从而产生明显的信号。\n\
  \n图 10-1 显示了 NetFlow 活动的可疑模式。从图中可以看出，该主机正在运行一个 Web 服务器，正在为其子网中的其他主机提供服务。奇怪的是，Web\
  \ 服务器正在通过高端口连接到远程 Web 服务器。在查看带宽消耗作为入侵指标时，你不仅要查看流量大小，还要查看连接的端点和方向性。\n\n\n图 10-1 显示可疑带宽使用的\
  \ NetFlow 报告\n\n### 信标 (Beaconing)\n\n攻击者经常暴露马脚的另一种方法是使用常用方法来与受感染主机保持联系。大多数防火墙的配置为对入站连接请求非常谨慎，但对出站连接则较宽松。最常用的恶意软件命令与控制（`C2`）方案让受感染主机定期向\
  \ `C2` 节点发送消息或信标。`Beaconing` 是感染计算机与外部控制器之间的周期性出站连接。这种信标行为可以通过其两个共同特征检测到：周期性和目的地。虽然某些恶意软件变种会随机化信标周期、目标地址或两者，但大多数仍然具有可预测的模式。\n\
  \n通过简单的视觉检查来检测信标极其困难，因为连接通常很短（每个方向可能只有几个数据包），并且很容易消失在典型网络节点的流量中。进行端点分析并查看给定主机与任何其他主机通信的频率要容易得多。要做到这一点，你需要按照内部源地址对流量日志排序，然后按目标地址排序，最后按时间排序。这样，典型的信标就会跳出来并变得显而易见。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** 某些合法连接在你的网络上看起来像信标。我们个人经验中的一个例子是某些高端软件，它们会定期检查许可服务器以确保其被允许使用。\n\
  \n### 不规则的点对点通信\n\n大多数网络流量遵循熟悉的客户端/服务器范式，即有（相对）较少的已知服务器为较多计算机提供服务，而这些计算机本身通常不是服务器。显然，存在例外情况，例如\
  \ n 层架构，其中前端服务器与后端服务器进行通信。尽管如此，这种范式解释了大多数网络流量的本质，至少在我们的组织内部区域是如此。在架构良好的公司网络中，两个对等工作站之间进行通信是稀见的现象。这种点对点通信通常是可疑的，并可能表明主机已受感染。\n\
  \n复杂的攻击者在攻破初始入口点后，往往会深入渗透你的网络。无论他们拥有的第一个主机是某个点击了恶意链接的倒霉员工的工作站，还是一个配置不当的外部服务器，它很少是攻击者的最终目标。`Lateral\
  \ movement`（横向移动）是攻击者在网络中建立立足点后，攻破额外主机的过程。实现此点的最常见方法是利用主机内置的信任工具。他们只需要有效的用户名和密码，就可以在\
  \ Windows 中使用 `SMB` 和 `PsExec` 工具或在 Linux 中使用 `SSH`。所需的凭据可以通过多种方式获取，包括受感染主机上缓存/存储的凭据、密码猜测以及对某些\
  \ Windows 域的哈希传递攻击（pass-the-hash attacks）。以下是需要关注的列表：\n\n- **非特权账户连接到其他主机**：除非遵循了某个（对你而言）已进程（例如，共享打印机的主机），否则任何普通用户到对等主机的连接都可能表明已受感染，并应对此进行调查。\n\
  - **特权账户从普通主机连接**：系统或域管理员完全可能在别人的计算机上工作（例如，修复用户问题），并需要使用特权凭据连接到另一个资源，但这应该是罕见的。我们在第\
  \ 3 章中讨论跳板机时已经描述了为什么这会导致问题。这些连接应该引起你的注意。\n- **重复的远程登录失败**：许多攻击会尝试通过简单猜测远程调用的密码来实现横向移动。任何重复失败登录尝试的事件都应及时调查，特别是如果其后紧跟了成功的登录。\n\
  \n检测此处描述的不规则点对点通信可能极其困难，因为你看到的只是合法用户使用信任工具连接到网络内的其他计算机。然而，背景至关重要，作为分析师应该问的问题是：该用户账户是否有正当理由从此主机连接到另一个资源？\n\
  \n### 战地经验：包分析\n\n我们的一位同事曾告诉我们，他对一个安全性相当良好的组织进行了一次黑盒渗透测试。在几天毫无进展后，他决定给一名员工发送一个包裹（根据其社交媒体资料证明，该员工将离开办公室几周）。包里有一部手机，以及一张开给该员工的金额为全市场价值的发票（以确保手机最终会被退）。手机中加载了无线黑客工具，并通过蜂窝数据网络连接回他的工作站。一天之内，电池就耗尽了，但我们的同事已经能够在不被察觉的情况下将他的非法设备连接到无线网络并攻破了多个工作站，而这一切都是在办公室里地完成的。是的，他确实通过邮件收回了手机。\n\
  \n### 网络上的非法设备\n\n构建和维护安全网络所能做的最好的事情之一就是了解网络上有什么。硬件和软件资产管理是构建你其他安全工作的基础基石。如果你不知道哪些主机属于你的网络，那么你就无法判断何时有未经授权的主机接入。遗憾的是，许多组织都缺乏这种资产意识，这使得攻击者很容易将他们的设备接入网络并对其进行攻破。\n\
  \n攻击者连接主要有两种方式：物理上通过网络插座和无线连接。虽然你可能认为很容易检测到坐在大堂里并将笔记本电脑连接到墙壁的可疑人物，但真正的威胁是那些将自己的无线接入点连接到网络的员工，以便在之前可能没有无线接入的地方提供无线访问。虽然这种情况罕见，但其破坏性足以让我们提及。更可能的情况是攻击者通过无线连接。\n\
  \n无论何种情况，你都需要一种方法来判断何时有新主机连接。最好的方法是部署网络访问控制（`NAC`），以确保每个设备经过身份验证、可能的扫描，然后加入适当的网络。`NAC`\
  \ 解决方案随处可见，并为你提供细粒度的控制以实施你的策略。它们还为你提供了集中日志，可用于检测非法设备的尝试连接。\n\n如果你在环境中没有 `NAC`，你的下一个最佳选择是让所有来自接入点（`APs`）的日志发送到中央存储中，你可以在其中寻找未见过的物理（`MAC`）地址。显然，这个过程繁琐得多且效率较低。攻击者绕过这种监控最简单的方法是将\
  \ `MAC` 地址更改为合法用户使用的地址。挑战在于，如果该用户也在网络上使用相同的 `MAC` 地址，可能会导致问题，但人们可以简单等待用户离开后再尝试冒充。\n\
  \n### 扫描遍历\n\n\n\n\n\n某些攻击者（特别是那些对规模而非隐蔽性更感兴趣的人）在攻破首台主机后，会使用扫描遍历（scan sweeps）来绘制环境。他们可能会下载并运行类似\
  \ `nmap` 的工具，也可以使用自定义脚本，甚至使用其在暗网上购买的黑客工具包中的功能。无论他们采取何种方法，网络上的症状大多是相同的：一个主机对大量端点产生异常大量的连接尝试（但通常不会建立完全连接）。\n\
  \n检测扫描遍历的一种良好方法是关注 `ARP` 消息。地址解析协议（`ARP`）是接口确定数据包最终终目的地的下一跳地址的手段。`ARP` 请求仅仅是节点向其局域网（LAN）内的所有其他节点广播提问：“谁负责往此\
  \ IP 地址的流量？”如果该 IP 地址属于同一局域网内的另一台主机，则该主机将通过提供自己的媒体访问控制（`MAC`）地址或物理地址来响应。此时，源主机将把封装在点对点以太网帧中的\
  \ IP 数据包发送到响应者的接口地址。反之，如果 IP 地址属于不同的局域网，默认网关（即 IP 路由器）将通过声称由其负责来响应。\n\n当攻击者尝试对网络进行扫描遍历时，扫描器将产生大量的\
  \ `ARP` 查询，如图 10-2\n\n**图 10-2** 与扫描遍历相关的 ARP 查询\n\n### 主机相关症状\n\n在注意到像我们在前几节中讨论的异常网络行为后（或在收到\
  \ IDS/IPS 或其他传感器的警报后），你的下一步是查看可疑主机，看看该异常行为是否有良性的解释。遵循证据而不是急于下结论是重要的，因为仅仅通过检查网络流量或行为，往往很难获取入侵的清晰全貌。\n\
  \n### 运行进程\n\n曾有人说过：“恶意软件可以隐藏，但它必须运行。”当你响应事件时，你的首要任务之一应该是检查运行中的进程。每个操作系统都提供了一个执行此操作的工具，但你必须警惕过度信任这些工具，因为攻击者可能使用\
  \ rootkit 在这些工具面前隐藏他们的活动。尽管如此，大多数事件并不涉及此类复杂的隐藏手段，因此在 Linux 中运行 `top` 或 `ps`，或者查看\
  \ Windows 任务管理器中的进程选项卡（并显示所有用户的进程）会非常有帮助。\n\n![Images](img/00005.jpeg)\n\n**考试提示**\
  \ 对于我们许多人来说，在决定是否捕取易失性内存之前，首先会查看系统上运行的进程。在考试中，最好先捕取内存，然后再查看运行的进程。出于教学考虑，我们在这里反倒了顺序。\n\
  \n在典型系统中，运行的进程列表可能只有几十个。其中许多进程的名称类似于 Windows 的 `svchost.exe` 和 `lsass.exe`，或 Linux\
  \ 的 `kthreadd` 和 `watchdog`。除非你知道什么是正常的，否则你将很难发现可疑进程。解决这一挑战的方案是对你环境中的主机建立基准，并记录你在健康系统中通常看到的进程。这将允许你快速过滤掉（可能是）好的进程，并关注剩余的内容。在执行此操作时，请记住，攻击者通常会使用与良性进程相似的名称，特别是当你正在快速扫描列表时。常见的示例包括在\
  \ `svchost.exe` 的末尾添加 `s`，或将 `lsass.exe` 的第一个字母替换为数字 `1`。显然，任何此类更改都应该自动接受调查。\n\n\
  进程揭示其邪恶本质的另一种方式是通过它们所利用的资源，例如网络套接字、CPU 周期和内存。恶意软件在某个时刻不具备某种网络套接字的情况是极罕见的。一些复杂性不那么高的恶意软件甚至会让这些连接保持很长时间。因此，如果你有一个从未见过的名称的进程，并且它正连接到外部主机，你可能想要进一步挖掘。查看哪些套接字属于哪些进程的简单方法是使用\
  \ `netstat` 命令。遗憾的是，每个操作系统实现此工具的方式略有不同，因此你需要使用正确的参数，如下所示：\n\n- Windows\n```\nnetstat\
  \ -ano\n```\n- Mac OS\n```\nnetstat -v\n```\n- Linux\n```\nnetstat -nap\n```\n\n\
  另一个感兴趣的资源是处理器。如果一个恶意进程特别忙（例如，破解密码或加密数据以进行外泄），它将消耗大量的 CPU 周期，这会出现在 Windows 任务管理器中，或者如果你使用\
  \ Linux，则通过 `top` 或 `ps` 实用程序。\n\n### 内存内容\n\n通过前一节讨论的技术可以从计算机中获取的所有信息，也可以通过在其易失性内存的副本上进行。当然，区别在于，如果攻击者对原始系统使用了\
  \ rootkit，易失性内存分析工具将不会撒谎。你可能不会对事件的每台计算机进行完整捕取，是因为捕取它们需要时间。\n\n![Images](img/00009.jpeg)\n\
  \n**注意** 攻击者使用的某些工具仅存在于内存中，在文件系统中没有存储任何组件。这些复杂的工具都要求事件响应人员依赖内存取证来理解它们。\n\n你需要一个特殊工具将内存内容转储到磁盘，你可能不希望该转储存到可疑主机的硬盘上。最好的办法是在你的应急包里准备一个移动硬盘。确保该设备的容量足够容纳你可能被调查的任何系统的最大内存，并在使用前清除其内容。最后，在上面安装许多可用的内存捕取应用程序之一。我们最喜欢用于\
  \ Windows 系统的 Access Data FTK Imager（它也可以获取文件系统）以及用于相应操作系统的 Hal Pomeranz Linux Memory\
  \ Grab。\n\n### 文件系统\n\n\n\n\n\n`file system`（文件系统）是操作系统用于管理持久存储设备（如硬盘驱动器）数据的进程和数据结构的集合。由于这些系统中可以发现丰富的相关的痕迹，这些系统在传统上是（目前仍然是）事件响应的焦点。对于攻击者来说，要攻破计算机且不在文件系统中留下其行为的证据是极其困难的。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** `artifact`（痕迹）一词在取证领域被频繁使用，尽管在该语境下没有标准定义，但通常指代对取证调查感兴趣的数字对象。\n\
  \n### 未授权软件\n\n自数字取证开始以来，最明显的痕迹就是非法的二进制可执行文件。一旦攻击者将恶意软件保存到磁盘，就可以很清楚地判断系统已被攻破。威胁行为者仍然广泛依赖这种技术（与较新的仅内存或无文件恶意软件相比）至少有两个原因：便利性和有效性。事实是，通常可以无阻碍地将文件移动到目标位置，因为许多防御系统依赖于签名检测方法，而这种方法很容易通过代码混淆来破解。即使是行为检测系统（即观察代码`做什么`的系统）也在不断追赶攻击者开发的新逃避技术。\n\
  \n在绕过目标机器上的反病毒系统（如果有）后，该软件将继续工作，直到你发现并停止它。如果你有一份每台计算机允许运行的授权程序列表，这项任务就会简单几个数量级。`Software\
  \ whitelisting`（软件白名单）是确保仅允许良好的软件在系统上执行的过程。更常见的替代方案是软件黑名单，即阻止已知的恶意（或可疑的）软件运行。对于实施白名单的组织来说，白名单对于减少攻击面非常有效。然而，它在普通用户中非常不受欢迎，因为任何新应用程序都需要\
  \ IT 和安全部门的批准，这会推迟获取过程。\n\n即使你没有（或不能）实施软件白名单，你也绝对应该拥有一每台计算机上安装的软件的准确列表。这种软件资产清单不仅有助于检测未经授权的（可能有害的）软件，对于许可证审计和升级规划也同样重要。与硬件清单相结合，这两者是确保你的网络安全最基本的步骤。\n\
  \n### 未授权的更改\n\n维持对受损系统访问的常用技术是用恶意库替换系统库，例如 Windows 系统中的动态链接库（`DLLs`）。这些替代品提供了原始文件的所有功能，还添加了攻击者需要的任何内容。替换这些文件需要提权权限，但攻击者有多种方法来实现这一点。一旦完成切换，除非你采取了某些准备性措施，否则将很难检测到。\n\
  \n在 Windows 系统中，内置了一些功能有助于检测对文件的未经授权的更改。其中之一是对比敏感文件夹中的文件访问或更改进行自动日志记录。这种功能称为 `Object\
  \ Access Auditing`（对象访问审计），可以作为组策略全局或选择性地应用。一旦启用，每当有人对审计空间内的文件进行读取、修改、创建或删除操作时，Windows\
  \ 就会生成一个事件。例如，修饰一个被审计的文件将生成一个代码为 `5136`（目录服务对象已修改）的事件，并记录负责更改的用户、时间以及更改的内容。Linux\
  \ 拥有类似的审计系统，可以提供类似的功能。显然，你对对此需要保持选择性，因为如果你处理得太随意，可能会产生成千上万条警报。\n\n另一种检测重要文件更改的方法是对它们进行哈希处理，并将结果存储在安全位置。这对于那些永远不应该发生任何更改的文件有用，因此你必须进行选择。尽管如此，对于你大多数或所有的库和关键程序，这种方法运行良好。你仍然需要随着时间手动检查哈希值以确保它们没有发生变化，但在任何系统上编写脚本并调度这一过程都是非常简单的。如果你需要一个更全面的文件完整性监控解决方案，有像\
  \ `Tripwire` 这样的商业机构提供该领域的解决方案。\n\n### 数据外泄\n\n除了向你的文件系统写入恶意软件并出于恶意目的修改其中的文件外，攻击者还希望作为某些攻击的一部分窃取数据。对他人有价值的数据通常是可以被防御者预测的。如果你从事先进研发（R&D）工作，你的项目文件可能会对不请自客感兴趣。同样，如果你在银行行业工作，你的财务文件将是丰厚的目标。重点是，我们可以在事件发生之前识别数据的敏感性，以便设计控制措施来降低对这些数据的风险。\n\
  \n外泄数据的常用方法是首先将其整合到目标网络内的暂存位置。攻击者不希望重复工作或外泄流，因为这种重复也会使他们更容易被发现。相反，他们通常会在受损的网络内部协调活动。这意味着即使多个代理在不同的子网中搜索敏感文件，他们倾向于将这些文件复制到协调枢纽，并在那里进行暂存、准备并传输到外部存储库。不幸的是，这些内部流量通常很难检测，因为它们可能类似于组织的合法功能。（一个显著的例外在本章之前的“不规则点对点通信”部分进行了描述。）\n\
  \n如果数据量很大或者攻击者不赶时间，检测从暂存地向外的流量可能会变得更容易。外泄将尝试模仿可接受的传输，例如网络或电子邮件连接，这些连接通常是加密的。要记住的重要方面是，连接看起来是合法的，但其流量和终端不是。即使用户习惯于出于合法原因向远程服务器上传大文件，这种模式会被打破，除非攻击者也攻破了那个经常使用的服务器并将其作为中继。除非你面对的是坚定的国家级，否则这种情况极其罕见。因此，你应该对大传输设置自动报警，特别是当传输到异常目的地时。`NetFlow`\
  \ 分析在这方面很有帮助。\n\n为了更稳健的解决方案，某些商业实体销售数据泄露防护（`DLP`）解决方案，它依赖于文件上的不可篡改标签以及在网络内部和外部移动时跟踪它们的网络。除了技术控制外，DLP\
  \ 还需要数据清单和数据分类系统。CSA+ 考试没有明确涵盖 DLP，但如果数据外泄对你或你的组织是一个担忧，你应该研究该领域的解决方案。\n\n\n\n\n\n\
  被称为 `APT28` 或 `Fancy Bear` 的威胁攻击者所使用的一种策略既有效又低技术。该组织以创建伪造的 Outlook Web Access (`OWA`)\
  \ 页面而闻名，该页面与目标组织的页面完全相同，显示 `OWA` 会话已过期的消息，并提示用户重新输入凭据。该页面托管在一个与目标名称非常相似的域名上（例如，`mail.state.qov`\
  \ 而不是 `state.gov`）。目标会收到一封鱼叉式钓电子邮件，其中包含一个指向诱饵网站的链接，该链接看起来有趣且合适。当在 `OWA` 中点击链接时，它会将\
  \ `OWA` 标签页重定向到虚假的超时页面，并在新标签页中打开诱饵网站。当用户关闭或切换出诱饵标签页时，他们会看到（虚假的）`OWA`提示并重新输入凭据。随后，虚假页面会将凭据转发到（仍然有效的）`OWA`\
  \ 会话。此时，威胁攻击者只需在某些计算机上创建一个 `IMAP` 账户，并使用用户的凭据同步其文件夹和邮件。这让数据外泄变得异常简单。除了虚假的 `OWA`\
  \ 域名外，其他所有内容看起来都完全合法，除非你了解这一特定策略，否则几乎不可能检测出是攻击。\n\n***\n\n### 容量消耗\n\n我们已经看到各种威胁活动指标如何消耗一种或多种类型的资源。无论是内存、`CPU`\
  \ 周期、磁盘空间还是网络带宽，绝大多数攻击者都会导致容量消耗出现峰值。作为分析师，你的工作部分之一是根据你自己的风险评估或威胁模型，主动思考这些峰值会在何时何地发生，然后提供监控资源的能力，以便你能检测到这些峰值。`CSA+`\
  \ 将不会测试你对这一过程的主动方面的处理，但你将被学会如何在场景中识别这些异常情况。你可能会看到一张类似图 10-3 的图像，并被问及正在消耗的资源以及它们可能代表什么。顺便说一下，该图是一个大部分处于空闲状态且未受攻击的\
  \ `Windows 7` 系统。\n\n![Images](img/00067.jpeg)\n\n***\n\n**图 10-3** Windows 资源监视器\n\
  \n当面临无法解释的容量消耗时，你应该参考我们描述的分析进程、内存、网络连接和文件系统的步骤。异常的利用将是一个信号，但你的响应取决于具体在使用哪种资源。\n\n\
  ### 未授权的权限\n\n无论攻击的类型或目的如何，对手几乎都会尝试获取提权权限。有时，漏洞本身将提供访问特权账户的权限，例如 `Windows` 中的 `system`\
  \ 或 `Linux` 中的 `root`。某些远程执行漏洞在被利用时，会将对手置于特权上下文中。然而，更常见的是，攻击者必须采取某些行动来达到该状态。这些行动可以被检测到，并且会留下痕迹作为证据。\n\
  \n`权限提升` 是系统访问受限的用户提升其权限以获取未授权权限的过程。注意，这既适用于系统的已授权用户获取未授权权限，也适用于远程攻击者。这种提升发生的手段很大程度上取决于系统，但它们倾向于分为三类：获取特权凭据、利用软件漏洞和利用配置错误。凭据可以通过社会工程学或密码破解获得，但如果用户从或到该人员不典型的计算机进行连接，就会是异常的。检测对软件漏洞的利用需要对漏洞有认识，并对易受影响的系统进行监控直到它们被修补。显然，在发生零日漏洞利用时，通常是无法检测到的。\n\
  \n一旦检测到权限提升，你的响应取决于情况。最简单的方法是全局禁用怀疑的账户，并将任何具有该用户活动会话的主机放入隔离的 VLAN 中，直到你能够做出响应。那里的风险在于，如果账户用户是合法的，你可能干扰了同事为公司执行重要功能，这可能会产生财务影响。一种更细致的方法是监控账户上的所有活动，以确定它们是恶意的还是良性的。这种方法可以减少误报的风险，但存在让攻击者留在系统中保持活跃并可能造成更大损害的风险。在没有其他信息的情况下，你应该优先保护信息资产，并控制可疑的用户和系统。\n\
  \n#### 相关的症状\n\n虽然你的大部分工作将在网络和主机层面进行，但在事件响应过程中，有时也有必要检查应用程序症状。我们说的“应用程序”指的是用户级而非系统级的功能或服务。换句话说，我们讨论的是像\
  \ `Microsoft Office` 这样的软件，而不是网络或电子邮件服务。\n\n### 异常活动\n\n可能感染的最常见症状可能是受感染应用程序的异常行为。网络浏览器长期以来一直是攻击者的关注点，不仅是因为它们的普及性，还因为它们的复杂性。为了提供我们习惯的大量功能，浏览器是巨大、复杂且往往存在漏洞的应用程序。我们对插件的日益依赖以及上传和下载丰富内容的能力只会让问题变得复杂。这些流行的应用程序是最常被利用的程序，这并不奇怪。问题的第一个迹象通常是异常行为，例如页面冻结、地址栏中统一资源定位符\
  \ (`URL`) 快速变化或需要重启浏览器。因为网络浏览器是攻击的常见切入点，这些症状可能预示着入侵的早期阶段。\n\n其他常用的应用程序是电子邮件客户端。对手使用的两种流行策略是发送带有恶意站点链接的电子邮件和发送受感染的附件。第一种情况在前面的段中讨论过，因为是网络浏览器连接到恶意网络资源。在第二种情况下，与附件相关的应用程序将可能是漏洞利用的目标。例如，如果受感染的文件是一个\
  \ `Microsoft Word` 文档，那么可能被利用的将是 `Word`。电子邮件客户端就像链接情况一样，仅仅是一个媒介。目标应用程序中的典型异常行为包括无响应（或加载时间特别长）、在屏幕上闪现几分之一的窗口，以及要求用户确认给定操作的弹出窗口（例如，允许\
  \ `Office` 文档中的宏）。\n\n诊断用户应用程序异常行为的挑战在于，它们往往模仿了良性的软件缺陷。我们都经历过即使在没有正在攻击的情况下应用程序加载异常缓慢。尽管如此，最好的方法可能是立即将主机移动到隔离的\
  \ VLAN 并开始观察其出站连接尝试，直到事件响应团队对其进行进一步评估。\n\n#### 引入新账户\n\n\n\n\n\n无论感染方式如何，攻击者几乎总是会尝试提升受攻击账户的权限，或者完全创建一个新账户。我们已经讨论了第一种情况，现在让我们考虑第二种情况可能是什么样的。攻击者创建的新账户理想情况下应该是一个特权域账户。这在攻击的早期阶段并不总是可能的，因此看到新的本地管理员账户或普通域账户被添加也并不罕见。\n\
  \n攻击者的目的有两个：其一是安装并运行在本地主机上建立持久化所需的工具，其二是为域账户中提供一种替代且看起来更正常的持久化机制。无论在何种情况下，你都可能想要重置该账户密码并立即注销用户（如果会话正在进行）。接下来，监控该账户的尝试登录，以确定尝试的来源。除非该账户是本地账户，否则不建议直接隔离主机，因为攻击者可能会尝试连接到几乎任何其他计算机。\n\
  \n### 意外输出\n\n在指示入侵的常见应用程序输出中，各种类型的弹出消息是最常见的。Windows 中意外的用户访问控制（UAC）弹出窗口，如图 10-4\n\
  \n**图 10-4** 未签名软件的用户访问控制（UAC）弹出窗口\n\n### 意外的出站通信\n\n指示入侵的最明确且常见的应用程序行为可能可能是意外的出站连接。我们在讨论网络症状时已经谈过为什么这在攻击中如此常见。需要重复强调的是，入侵如果不涉及感染主机的出站连接尝试是极其罕见的。\n\
  \n检测这些连接的挑战在于，网络传感器通常无法判断指向端口 `443` 的出站连接是由 `Internet Explorer` 还是 `Notepad` 发起的。第一种可能是无害的，但后者绝对可疑。由于大多数恶意连接会尝试伪装成合法的网络或电子邮件流量，你几乎肯定需要一个基于主机的传感器或入侵检测系统（IDS）来捕获这种行为。假设你拥有这种能力，最佳响应可能是自动阻止任何未通过网络连接白名单的应用程序的连接尝试。\n\
  \n挑战在于，越来越多的应用程序正依赖网络连接（通常通过端口 `80` 或 `443`）来实现各种目的。一个以前不这样通信的应用程序也可能由于软件更新的结果而开始这样做。\n\
  \n![Images](img/00005.jpeg)\n\n**考试要点** 应用程序在没有任何其他证据的情况下突然开始进行异常的出站连接，这并不一定意味着是恶意的。寻找新的（已授权的）安装或软件更新的指标以评估无害行为。\n\
  \n### 服务中断\n\n启动、停止、重启或崩溃的服务始终值得进一步调查。例如，如果用户注意到状态栏中的杀病毒软件图标突然消失，这可能表明攻击者禁用了此保护。同样，提示合法应用程序无法连接到远程资源的错误消息可能是主机上恶意软件引起的资源分配问题导致的。检查资源管理器和日志文件将帮助你确定这些症状是否指示了恶意活动。\n\
  \n### 内存溢出\n\n另一个经常被漏洞利用或恶意软件破坏的资源是主内存。其原因为内存是一个极其复杂的环境，恶意活动倾向于破坏该空间内元素的精细排列。如果攻击者在写入内存时即使偏移了一个字节，也可能导致内存错误，从而终止进程并向用户显示某种指示此类状况的消息。如果漏洞是基于栈溢出或缓冲区溢出的，这种症状尤为可能发生。幸运的是，这些消息有时表明攻击失败了。你最好的办法是稳妥起见并获取内存转储（memory\
  \ dump），以便你可以分析问题的根源。\n\n## 章节回顾\n\n就像猎中的猎犬一样，事件响应人员必须遵循最强烈的气味来追踪猎物。这个比比非常贴切，因为你有时也会丢失线索，必须徘徊一会儿才能重新获得。从网络层开始，一直到主机，然后单个应用程序，你必须准备好面对模糊的指标、薄弱的证据和偶尔的死胡同。在现实世界和\
  \ CSA+ 考试中，最重要的考虑是在得出任何结论之前查看汇总的证据。在整个调查过程中，请记住奥卡姆剃刀：最简单的解释通常是正确的。\n\n### 问题\n\n\
  1. 仅允许运行已知良性软件的实践被称为什么？\n\nA. 黑名单\nB. 白名单\nC. 黑帽攻击\nD. 漏洞扫描\n\n2. 下列哪项不是横向移动的一部分？\n\
  \nA. 内部侦察\nB. 权限提升\nC. 数据外泄\nD. 渗透\n\n3. 在网络中建立持久化的常用技术是什么？\n\nA. 缓冲区溢出\nB. 添加新账户\n\
  C. 删除所有账户\nD. 注册表编辑\n\n4. 下列存储设备中哪一个是最易失性的？\n\nA. 随机存取内存\nB. 只读存储器\nC. 云存储\nD. 固态硬盘\n\
  \n5. 在寻找威胁活动时，以下哪项不是调查区域？\n\nA. 网络速度\nB. 内存使用\nC. CPU 周期\nD. 磁盘空间\n\n6. 遏制网络上非法设备使用的有效方法是什么？\n\
  \nA. SSID\nB. FLAC\nC. WPA\nD. NAC\n\n\n\n\n\n### 7. 7 所有研发工作站向设计公司发送出站通信最可能的解释是什么？\n\
  \n**A.** 命令与控制指令\n**B.** 大型设计文件的外泄\n**C.** 许可证验证\n**D.** 视频流传输\n\n### 8. 8 为了发现泄露源，下一步检查哪种设备最合理？\n\
  \n**A.** `DNS` 器\n**B.** 属于物流部门的打印机服务器\n**C.** 邮件服务器\n**D.** `R&D` `systems` 的本地备份\n\
  \n### 9. 9 为什么该设备是作为泄露源的理想选择？\n\n**A.** 由于于该设备在网络上的正常用途，它可能不会引起怀疑。\n**B.** 该设备与公司网络之外的有定期的通信。\n\
  **C.** 该设备可以轻松模拟许多系统。\n**D.** 该设备通常拥有海量的存储资源。\n\n### 10. 10 `R&D` `workstations`\
  \ 观察到的周期性通信称为什么？\n\n**A.** 指纹识别 (Fingerprinting)\n**B.** 杂讯 (Chatter)\n**C.** 足迹扫描\
  \ (Footprinting)\n**D.** 信标 (Beaconing)\n\n### 答案\n\n**1.** **B.** 白名单是确保只有良好的软件可以在系统上运行的过程。该技术不是防止已知的恶意软件运行，而是从一开始只允许批准的软件运行。（注：提供的文本说是“B”，但描述的是白名单机制）。\n\
  \n**2.** **C.** 横向移动是攻击者在网络中建立立足点后，攻破网络内额外主机的过程。这通常通过利用主机之间的信任来执行内部侦察、权限提升和枢纽攻击来实现。\n\
  \n**3.** **B.** 攻击者用于持久化的的一种巧妙方法是添加管理员账户或组，然后利用这些新账户进行额外的攻击。\n\n**4.** **A.** 随机访问存储器（`RAM`）是列出的存储类型中最易易失的。`RAM`\
  \ 需要电源来保持其数据，一旦断电，它会迅速丢失内容。\n\n**5.** **A.** 内存 `CPU`、磁盘或网络使用率的激增（不一定是网络速度）可能预示着威胁活动。了解正常使用水平对于更容易地识别异常活动至关重要。\n\
  \n**6.** **D.** 网络访问控制（`NAC`）是一种确保每台设备都经过身份验证、扫描并加入正确网络的方法。`NAC` 解决方案通常提供策略执行的细粒度控制。\n\
  \n**7.** **C.** 某些类型的软件（特别是用于`design` 的软件）需要许可证验证。\n\n**8.** **B.** 该设备与公司网络之外的有定期的通信。\n\
  \n**9.** **A.** 由于该设备在网络上的正常用途，它可能不会引起怀疑。\n\n**10.** **D.** 信标（Beaconing）是 `R&D`\
  \ `workstations` 观察到的周期性通信的术语。\n\n\n\n\n\n**注意** 控制措施的分类可能会令人困惑。管理控制措施也可以称为管理控制或策略控制。技术控制措施和逻辑控制措施也是同义词。最后，根据组织和背景，物理控制措施有时被称为操作控制措施。\n\
  \n### 网络安全框架 (Cyber Security Framework)\n\n2013 年 2 月 12 日，美国总统签署了第 13636 号行政命令，号召为关键基础设施组成的组织开发一套自性的网络安全框架。该架构的目标是具有灵活性、可重复性和成本效益的，使其能够被优先考虑，并更好地与业务流程和目标对齐。整整一年后，美国国家标准与技术研究院（NIST）发布了网络安全框架（`CSF`），这是与政府、工业界和学术界成员合作的结果。截至本文编写，已有超过\
  \ 30% 的美国组织采纳了 `CSF`。这一数字预计到 2020 年将达到 50%。`CSF` 由三个主要部分组成：\n\n- 框架核心（Framework\
  \ Core）由所有组织通用的各种活动、结果和参考组成。`CSF` 将这些分为 5 个功能、22 个类别和 98 个子类别。\n- 实现层次（Implementation\
  \ Tiers）对网络安全实践的严谨和复杂程度进行分类，分为部分（第 1 级）、风险感知（第 2 级）、可重复（第 3 级）或自适应（第 4 级）。目标不是强制组织移动到更高层次，而是为其其决策提供信息，使其在符合业务逻辑的情况下能够这样做。\n\
  - 框架概要（Framework Profile）描述了组织在 `CSF` 类别和子类别方面的状态。它允许决策者将“现状”与一个或多个“目标”可能性进行比较，允许他们以符合特定组织逻辑的方式对齐网络安全与业务优先事项及流程。\n\
  \n`CSF 核心` 将网络安全活动组织为五个高级别功能，您应该熟悉这些功能。我们所做的一切都可以与这些功能之一对齐。\n\n- `Identify`（识别）：了解组织的业务背景、资源和风险。\n\
  - `Protect`（保护）：开发适当的控制措施，以合理的方式降低风险。\n- `Detect`（检测）：及时发现任何威胁安全的因素。\n- `Respond`（响应）：迅速控制任何威胁安全因素的影响。\n\
  - `Recover`（恢复）：在事件后恢复到能够支持业务活动的安全状态。\n\n***\n\n![Images](img/00005.jpeg)\n\n**考试贴士**\
  \ 您应该记住 `CSF` 的五个功能，并记住它是自愿的，并不是一个一刀切的网络安全解决方案。\n\n### ISO\n\n当确定需要扩展并在全球范围内标准化安全标准时，这项任务由国际标准化组织（`ISO`）和国际电工委员会（`IEC`）承担。`ISO`\
  \ 是全球最大的国际标准制定和出版机构。该小组研究的标准范围从气象学、食品技术和农业到航天器工程、采矿和信息技术等。`IEC` 为所有电气、电子及相关技术开发并发布国际标准。这两个组织合作构建了一系列全球性的信息安全管理体系（`ISMS`）标准，被称为\
  \ `ISO/IEC 27000` 系列，这里列出的几个包括：\n\n- `ISO/IEC 27000`：概述和术语\n- `ISO/IEC 27001`：`ISMS`\
  \ 要求\n- `ISO/IEC 27002`：安全管理\n- `ISO/IEC 27003`：`ISMS` 实施\n- `ISO/IEC 27004`：`ISMS`\
  \ 测量\n- `ISO/IEC 27005`：风险管理\n- `ISO/IEC 27006`：认证要求\n- `ISO/IEC 27007`：`ISMS` 审计\n\
  - `ISO/IEC 27008`：审计员指南\n- `ISO/IEC 27031`：业务连续性\n- `ISO/IEC 27033`：网络安全\n- `ISO/IEC\
  \ 27034`：应用安全\n- `ISO/IEC 27035`：事件管理\n- `ISO/IEC 27037`：数字证据的收集与保护\n\n这组标准作为全球范围内组织以整体方式管理安全控制措施的行业最佳实践。构成该标准的列表每年都在增长。每个标准都有特定的侧重点（例如指标、治理或审计）。组织寻求经认可的第三方进行\
  \ `ISO/IEC 27001` 认证是很常见的现象。第三方根据 `ISO/IEC 27001` 中列出的 `ISMS` 要求对组织进行评估，并证明组织的合规性。\n\
  \n### COBIT\n\n“信息和技术控制目标”（`COBIT`）是由 `ISACA`（以前称为信息系统审计与控制协会，现在仅以其缩写命名）和 IT 治理协会（`ITGI`）开发的一个框架和一组控制目标。它定义了用于妥善管理\
  \ IT 的应使用的控制目标。`COBIT` 被分为四个领域：计划与组织、获取与实施、交付与支持以及监控与评估。每个类别又细分为子类别。例如，“获取与实施”类别包含以下子类别：\n\
  \n- `获取和维护应用程序软件`\n- `获取和维护技术基础设施`\n- `开发和维护程序`\n- `安装并认证系统`\n- `管理变更`\n\n因此，这个\
  \ `COBIT` 领域为公司在购买、安装、测试和认证 IT 时提供了遵循的目标和指导。这非常强大，因为许多公司在执行程序时采用的是随机且非正式的方法。`COBIT`\
  \ 通过提供一份必须考虑的事项清单，为 IT 治理提供了“检查清单”方法。\n\n`COBIT` 列出了执行摘要、管理指南、框架、控制目标、实施工具包、性能指标、成功因素、成熟度模型和审计指南。它提供了一个完整的路线图，用于完成该模型涉及的\
  \ 34 个控制目标。图 11-1 展示了框架如何连接业务需求、IT 资源和 IT 流程。\n\n![Images](img/00070.jpeg)\n\n***\n\
  \n**图 11-1** `COBIT` 框架\n\n\n\n\n\n- 实施相关程序，要求用户理解并确认其访问权限以及此类访问的条件\n- 确保内部外部服务提供商在完成授权程序之前不提供访问\n\
  - 为所有注册使用服务的人员维护正式记录（包括访问级别）\n- 对用户 ID 和访问权限进行及时、定期的审查\n\n组织在进行用户账户管理时，应确保至少涵盖了这些目标；反之，审计人员也将根据这些标准来确保组织正在恰当地地执行安全实践。当今许多安全合规性审计实践都是基于\
  \ `COBIT`，因为它们被认为是行业最佳实践。\n\n***\n\n![Images](img/00009.jpeg)\n\n**注意**：安全行业中的许多人误认为地认为\
  \ `COBIT` 纯粹关注安全。实际上，它涉及信息技术的所有方面，安全仅是其中一个组件。\n\n### SABSA\n\n`谢尔伍应用业务安全架构 (SABSA)`（如表\
  \ 11-2 所示）是一个分层模型，其中第一层从安全角度定义业务需求。该模型的每一层抽象程度都在降低，细节程度在增加，从而建立在其他层的基础上，并从策略转向技术和解决方案的实际实施。其核心思想是通过战略、概念、设计、实施以及指标和审计级别提供一条可追溯的链。\n\
  \n![Images](img/00071.jpeg)\n\n**表 11-2** SABSA 架构框架\n\n以下概述了在框架的每一层需要提问并回答的问题：\n\
  \n- *什么*（What）：你在这一层尝试做什么？你的安全架构需要保护的资产\n- *为什么*（Why）：为什么要这样做？想要应用安全的动机，用该层的术语表达\n\
  - *如何*（How）：你打算如何做？在这一层实现安全所需的功能\n- *谁*（Who）：谁参与其中？该层涉及人员和组织方面\n- *哪里*（Where）：你在哪里做？与该层相关的实施安全的位置\n\
  - 什么时候（When）：你什么时候做？与该层相关的安全时间维度\n\n`SABSA` 是一个用于企业安全架构和服务管理的框架和方法论。因为它是一个框架，所以它提供了一个结构；因为它是一个方法论，所以它提供了一个过程。`SABSA`\
  \ 提供了一个可以被持续监控的框架。\n\n### TOGAF\n\n另一个企业框架是`开放组架构框架 (TOGAF)`，它源于业务需求。它为以下内容的设计、实施和治理提供了一种方法：\n\
  \n- 业务架构\n- 数据架构\n- 应用架构\n- 技术架构\n\n该框架使用`架构开发方法 (ADM)`，这是一个迭代过程，允许架构进行持续更新。它为业务、数据、应用和技术提供了不同的视图以满足相应需求。\n\
  \n### ITIL\n\n`信息技术基础设施库 (ITIL)` 是服务管理最佳实践的事实标准。它的创建是因为对信息技术的依赖日益增加。遗憾的是，大多数组织中的业务人员和\
  \ IT 人员之间存在天然的分隔，因为他们使用不同的术语并有不同的关注。这种不当的融合通常会导致混乱、沟通不畅、错过期限、错失机会并增加双方的成本和挫败感。`ITIL`\
  \ 是一个自定义的框架，提供了目标、实现这些目标所需的通用活动以及每个过程的输入和输出值。构成 `ITIL` 的主要组件如图 11-2 所示。\n\n![Images](img/00072.jpeg)\n\
  \n***\n\n**图 11-2** ITIL\n\n### 策略与程序\n\n为了公司的安全计划取得成功，它必须从顶层开始，并在组织内的每一个层级都有用且有效。高层管理需要定义安全范围，并识别和决定必须保护什么以及保护到何种程度。管理层必须理解其负责的安全合规法规、法律和责任问题，并确保公司整体履行其义务。高层管理还必须确定员工的预期以及不合规的后果。这些决策应该由那些在出现问题时将承担责任的人做出。但通常做法是引入安全人员的专业知识进行协作，确保实施了足够的策略和控制以实现高层管理设定的目标。\n\
  \n安全计划包含了为组织提供整体保护的所有要素，并制定了长期安全战略。安全计划的文档应包含安全策略和程序。规则越详细，越容易判断何时违反了规则。\n\n\n\n\
  \n\n`security policy`（安全策略）是由高层管理人员（或选定的策略委员会或小组）发布的总体性陈述，规定了安全在组织中所扮演的角色。安全策略可以是组织级策略、特定问题策略或特定系统级策略。这些文档必须包含一套处理那些选择不遵守策略者的流程。这建立了一个其他人可以理解的流程，从而使他们不仅知道组织对他们的期望，还能预见到在不合规时会得到什么回应。\n\
  \n策略的编写采用较为宽泛的术语，以通用的方式涵盖许多主题。要实际支持策略，需要更细致的粒度，这通过使用程序和控制来实现，我们将在稍后的章节中讨论这些。策略提供了基础。程序提供了安全框架，而必要的安全控制（行政、技术和物理控制）则被用于填充该框架，以提供一个完整的安全计划。\n\
  \n### 数据分类\n\n最常见且最重要的安全策略之一涉及组织数据的分类，这是在第 5 章中介绍的主题。为不同类型的数据分配分类级别的原理在于，它使组织能够评估为保护每种数据应该投入的资金和其他资源。一个典型的组织创建并维护大量信息，但并非所有信息都具有相同的价值。拥有数据分类策略的一个关键原因是根据数据对丢失、篡改、泄露或不可用的敏感性进行组织。许多人错误地只考虑数据保护的机密性方面，但我们需要确保数据不被未经授权的方式修改，并在需要时可用。一旦根据敏感性级别对数据进行分段，组织就可以决定需要哪些流程和安全控制来保护它。\n\
  \n### 数据所有权\n\n数据所有权策略通常与数据分类策略结合使用，因为很难将这两个问题分开。主要原因是数据是由“拥有”它的人进行分类的。数据所有权策略确立了数据所有者在组织内部的角色和责任。数据所有者（信息所有者）通常是负责特定业务部门的管理人员，他们对特定信息子集的保护和使用负最终责任。数据所有者承担尽职调查（due\
  \ care）责任，因此对任何导致数据损坏或泄露的过失行为负责。数据所有者决定其负责的数据的分类，并在出现业务需求时更改分类。这些个人人员还负责确保必要的安全控制到位、根据每个分类定义安全需求和备份需求、批准任何泄露活动、确保正确使用访问权限，以及定义用户访问标准。数据所有者批准访问请求，或选择将此功能委托给业务部门经理。此外，数据所有者将处理与其负责保护的数据相关的违规行为。\n\
  \n数据所有权策略中要解决的关键问题是：谁拥有进入组织信息系统的个人数据？例如，如果允许员工在工作期间查看电子邮件或社交媒体网站，他们的个人数据遍历并存储在公司信息系统中（尽管是暂时的）。这些数据现在是否属于公司？是否有隐私预期？员工在工作账户上收到的个人电子邮件又是怎样的？这些问题应该在数据所有权策略中正式解决。\n\
  \n### 数据留存\n\n对于你应该保留多久拥有的数据，并没有统一共识。法律和法规要求（在存在的情况下）在不同国家和行业之间各异。共性的是需要确保你的组织拥有一并遵循一份记录的数据留存策略。否则无异于自毁性灭，特别是在处理待决或进行中的诉讼时。当然，仅仅有一项策略是不够的；你必须确保它被执行，并通过定期审计来记录这一点。\n\
  \n一种非常直接且可能具有诱惑的方法是：查看你组织中最长的法律或法规留存要求，然后将该时间范围应用于你所有的数据留存。这种做法的问题在于在于，它可能会导致你保留的数据集比需要的大几个数量级。这不仅增加了额外的存储成本，还使得遵守电子取证（e-discovery）命令变得更加困难。当你收到法院的电子取证命令时，通常需要在给定的时间范围内（通常很短）提交特定数量的数据（通常很大）。显然，你保留的数据越多，这个过程就越困难、越昂贵。\n\
  \n更好的方法是找到具有强制性留存要求的特定数据集，并根据这些要求进行处理。其他所有数据都有一个留存期，该期限至少能满足业务需求。你可能会发现，在中大型组织中，不同的业务部门会有不同的留存要求。例如，你可能希望保留研发（R&D）部门数据的时间比保留客户服务部门数据长得多。今天看起来不是特别帮助的研发项目在未来可能有用，但客户服务电话的音频录音可能不需要保留几年。\n\
  \n### 密码\n\n密码策略可能是安全策略中最可见的一项，因为每个用户每天都要处理它产生的影响。良好的密码策略应该激励用户安全地管理密码，向他们描述如何实现，并规定不遵守规定的后果。大多数密码策略中的三个主要元素与生成、时长和使用有关。\n\
  \n在创建密码时，应告知用户合格密码的要求。通常，这些标准包括以下部分或全部内容：\n\n- 最小长度（例如 8 个字符或更多）\n- 对特定类型字符的要求（如大写字母、小写字母、数字和特殊字符）\n\
  - 禁止重复使用（例如，不能是最后四个密码中的一个）\n- 最小年龄（防止通过切换来重复使用旧密码）\n- 最大年龄（例如 90 天）\n- 禁止使用某些词汇（如用户名或公司名称）\n\
  \n策略还应涵盖不同密码的使用。例如，用户不应在多个系统中使用相同的密码，这样即使一个系统被攻破，也不会自动导致所有用户账户被攻破。诚然，这一条款的执行非常困难，特别是当涉及个人和组织使用之间的密码重用时。尽管如此，出于教育目的以及为了可能减轻组织的法律责任，将其包含也是值得的。\n\
  \n### 可接受使用\n\n\n\n\n\n`acceptable use policy (AUP)` 规定了组织认为提供给员工的信息系统什么是可接受的使用方式。在工作计算机上查看色情内容、发送仇恨邮件或攻击其他计算机几乎总是被禁止的。另一方面，许多组织允许员工进行有限的个人使用，例如在休息期间检查个人电子邮件和浏览网页。AUP\
  \ 是一个实用的第一道防线，因为它记录了每个用户何时被告知在工作中哪些计算机（或其他资源）的使用是可接受的，哪些是不可的。这使得用户在随后违反 AUP 时，很难声称自己并不知情。\n\
  \n## 账户管理\n\n攻击者的一种首选技术是尽快成为他们所攻破的系统的“正常”特权用户。他们至少可以通过三种方式实现这一点：攻破现有的特权账户、创建新的特权账户，以及提升普通用户账户的权限。第一种方法可以通过使用强身份验证（例如，强密码和双因子身份验证）以及让管理员仅针对特定任务且仅从跳板（jump\
  \ boxes）使用特权账户来缓解。第二和第三方法可以通过密切关注用户账户的创建、修改或滥用来缓解。这些控制措施都属于账户管理策略的范围。\n\n当新员工入职，他们应该遵循一个定义良好的流程，该流程不仅确保他们理解自己的职责和责任，还确保他们分配了所需的公司资产，并且这些资产得到了适当的配置、保护和记录。这些资产中包括用户账户，授予他们访问信息系统的权限以及在其中创建、读取、修改、执行或删除资源（例如文件）的授权。策略应该规定账户的默认过期日期、密码策略（除非另有文档）以及用户应该访问的信息。最后一部分变得困难，因为用户的信息需求通常会随着时间而变化。\n\
  \n添加、删除或修改用户拥有的权限应该是一个经过仔细控制和记录的过程。新权限何时生效？为什么需要？谁授权的？在安全流程方面趋成熟的组织将有一套变更控制流程来处理用户权限。虽然许多审计员会关注组织中谁拥有管理权限，但也有许多自定义权限集也接近管理员账户的水平。因此，拥有并测试发放提升权限的流程是非常关重要的。\n\
  \n账户管理中的另一个重要实践是挂起不再需要的账户。每个大型组织最终都会发现一个或多个属于不再是组织成员的用户。在某些极端情况下，这些用户在几个月前就离开了，并且曾拥有特权账户。这些账户在我们的网络中无限制的存在，为我们的对手提供了成为看似合法用户的强大手段，这使得我们检测和击退他们的工作变得更加困难。\n\
  \n***\n\n## 以 Root 运行的问题\n\n无疑，通过一个用户账户完成所有工作要容易得多，特别是如果该账户拥有我们可能需要的所有权限。正如你所知的，陷阱在于当我们的账户被攻破时，恶意进程将以账户拥有的任何权限运行。如果我们一直以\
  \ `root`（或 `admin`）身份运行，我们可以确定当攻击者攻破我们的机器时，他们将立即拥有执行他们需要或想做的任何权限。\n\n更好的方法是使用受限账户进行大部分日常工作，并在时提升到特权。考虑以下内容：\n\
  \n- `runAs`\n- `sudo`\n- `SomeCommand`\n- `gksudo`\n- `kdesudo`\n- `AppName`\n-\
  \ `user:` \n\n***\n\n### 流程\n\n*Procedures* 是实现某些目标而应该执行的详细、分步骤的任务。这些步骤适用于用户、IT\
  \ 人员、操作人员、安全人员以及可能需要执行特定任务的其他人。许多组织已经编写了关于如何安装操作系统、配置安全机制、实施访问控制、设置新账户、审计活动、报告事件等的流程。\n\
  \n流程详细说明了策略、标准和指南将如何实际实施。如果策略规定所有访问机密信息的员必须经过适当的身份验证，那么支持性流程将解释实现此点的步骤，即定义授权的访问准则、如何实施和配置访问控制机制，以及如何审计活动。如果某标准规定应执行备份，那么流程将定义执行备份所需的详细步骤、备份时间表、备份介质的存储等。流程应该足够详细，以便对不同背景的人来说既易于理解又有用。\n\
  \n## 持续监控流程\n\n在特殊出版物 800-137 中，NIST 将信息安全*持续监控*（continuous monitoring）定义为“维持对信息安全、漏洞和威胁的持续意识能力，以支持组织的风险管理决策”。因此，持续监控流程将描述组织收集和分析信息的过程，以维持对威胁、漏洞、合规性和安全控制措施有效性的意识。显然，这是一项复杂且范围非常广泛的工作，需要多个业务部门之间的协调，并与组织的风险管理流程紧密结合。\n\
  \n当持续监控揭示了可操作的情报（例如，新的威胁或漏洞）时，应该有一个预定义的流程来处理这种情况。*修复计划*（remediation plan）描述了组织每当安全状况恶化时采取的步骤。该计划可能会引用多个流程，其中一些我们在本章中讨论。例如，如果问题是应用程序中新发现的漏洞，修复计划将引导安全团队参考本章后讨论的补丁程序。另一方面，如果是因为意识到某项安全控制没有想象中那么有效，团队必须考虑控制测试流程是否有效或应进行更新。\n\
  \n\n\n\n\n# 证据制作程序\n\n当当事人进入法庭时，引入证据的方式几乎与证据本身同等重要，这就是为什么拥有一套记录完备（并得到执行）的程序可能是决定胜负的关键所在原因。`Evidence\
  \ production`（证据制作）是对文件、档案或任何可能对法律程序产生影响的实物项目的法律请求。这通常发生在法律诉讼的早期（证据 {）阶段，这就是为什么\
  \ `evidence production` 一词有时与 `electronic discovery`（电子发现）或 `e-discovery` 互换使用。然而，需要注意的是，电子发现是证据制作的一个子集，因为后者包含了扣押（已在第\
  \ 9 章中讨论过），而前者不包含。由于我们已经讨论过事故或犯罪现场的行动，因此在此处考虑电子发现程序是值得的。\n\n电子存储信息（ESI）的发现被称为电子发现（e-discovery），它是为法院或外部律师制作与法律诉讼相关的所有\
  \ ESI 的过程。例如，如果你的公司因产品缺陷导致损害而被起诉，原告律师可以获得一份电子发现命令，强制你提供 QA 团队与高管之间所有讨论产品缺陷的电子邮件。如果你的数据留存策略和证据制作程序充分，电子发现不应要求投入过多的精力。另一方面，如果你在留存方面有所疏忽，这样的命令可能会使组织瘫痪。\n\
  \n电子发现参考模型（EDRM）确定了以下八步骤，尽管它们并不一定都是必须的，也不是以线性方式执行的：\n\n- 根据指令对数据的 `Identification`（识别）\n\
  - 对这些数据进行 `Preservation`（保护），以确保在遵守命令期间不会被意外或例行地破坏\n- 从可能存放数据的各种存储位置进行 `Collection`（收集）\n\
  - 进行 `Processing`（处理），以确保数据及其元数据都使用正确的格式\n- 对数据进行 `Review`（审查）以确保其相关性\n- 对数据进行 `Analysis`（分析）以获取正确的上下文\n\
  - 向请求者 `Production`（制作）最终数据集\n- 向外部受众 `Presentation`（演示）数据以证明或反驳某项主张\n\n证据制作程序应该规定在你的组织中如何执行这些步骤。显然，这应该与你的数据留存策略仔细协调，以确保你不会过早销毁信息，也不会为了遵守法庭命令而不得不处理过量的数据。\n\
  \n# 补丁程序\n\n安全 `patch management`（补丁管理）是识别、测试、应用、验证和记录软件漏洞修复程序的过程。这五项功能应该在每个组织的正式程序中法典化。识别功能需要拥有完整、准确且更新的软件清单。只有当你确切知道系统上运行着什么软件时，才能识别出补丁的需求（以及来源）。一旦你确定了补丁的需求并从可靠源获取它，你就必须对其进行测试，以确定它对你的业务流程可能产生的影响。安全补丁导致某些功能失效并不罕见，这需要\
  \ IT 和安全人员寻找这些意外的影响。组织的领导者随后必须决定是否仍然应用补丁、实施其他控制措施，或者什么不做并承担风险。做出此决定的过程应该在标准补丁程序中描述。\n\
  \n一旦决定将补丁推送到生产系统，不应一次性完成。不同的组织会有不同的程序，优先修补高风险系统（例如面向外的系统）、非关键系统（即如果它们因为补丁而崩溃，对公司不会造成太大），或其工作部门负责人愿担任整个组织“小白鼠”的系统。对于这种排序没有通用的正确答案，但这种方法应该被正式记录。\n\
  \n补丁安装后，必须对其进行记录和验证。补丁的记录意味着你更新了软件清单，以反映特定的软件安装现在已打补丁（或未打）。每个未打补丁的系统都应该需要正式的豁免书，其中包括如何（如果有）缓解未打补丁的风险。最后，应该应对补丁进行验证，以确保它们实现了预期目的。这通常涉及向漏洞扫描器添加插件，甚至可能运行特殊的扫描。\n\
  \n# 控制测试程序\n\n安全控制可能由于多种原因未能保护信息系统不受威胁。如果控制安装或配置不当，或者你最初就选择了错误的控制，那么资产将保持处于漏洞状态（你只是不知道而已）。因此，你应该有一份正式程序，描述你的组织安全人员验证和确认他们所用控制的步骤。验证是确保控制被正确实施的过程。确认则确保（正确安装的）控制实际上缓解了预期的威胁。\n\
  \n# 异常管理程序\n\n有时，组织会选择违反自己的政策或程序。当我们在本章较早介绍补偿控制开发时，已经看到过这种情况。无论做出这一决定的原因是什么，关键在于它必须由正确的人、在拥有正确信息的情况下并带有适当的记录来做出。这些是异常管理程序的基本要素。\n\
  \n\n\n\n第一步始终应该是让合适的人参与对话。例外情况通常会对组织的多个部分产生（实际或潜在的）影响。一旦确定了这些业务部门，其领导就应该指定一个决策者，在对话中代表他们的利益。这些利益相关者中的每一个人都对该异常具有特定的职责和职权，这些职责将为最终做出决策的过程提供依据。例如，如果决策主要影响一个部门，那么该利益相关者在决定是否接受该异常应拥有重要的话语权。在建立利益相关者及其在流程中的角色后，应向小组提供有关该状况、拟议异常及其可能影响的完整已知事实和假设。例外管理程序应当阐明他们将如何对是否授予策略豁免做出决策。它还应该描述确定例外持续时间的过程，以及在决策过程中如果出现不可调和的分歧时该如何处理。\n\
  \n## 控制 (Controls)\n\n实施控制是为了降低组织面临的风险，控制主要分为三种类型：管理、技术和物理控制。管理控制通常被称为“软控制”，因为它们更侧重于管理。管理控制的示例包括安全文档、风险管理、人员安全和培训。逻辑控制（也称为技术控制）是软件或硬件组件，例如防火墙、入侵检测系统（IDS）、加密、识别和身份验证机制。最后，物理控制是用于保护设施、人员和资源的保护措施。物理控制的示例包括安保人员、锁、围栏和照明。\n\
  \n### 物理控制 (Physical Controls)\n\n`Physical controls` 是用于威慑、延迟、防止、检测或响应针对物理财产威胁的保护措施。重要的是，必须理解某些物理控制支持并与管理及逻辑（技术）控制配合，以提供适当的安全保障。物理控制的示例包括让安保人员在进入设施前验证个人身份、在设施外部建立围栏、确保服务器房和布线间被锁定并免受环境因素（湿度、热、低温）的影响，以及仅允许特定人员访问包含机密的工作区域。\n\
  \n### 逻辑控制 (Logical Controls)\n\n`Logical controls`（有时称为技术控制）是用于限制主体访问对象的软件工具。主体可以是用户或进程，而对象是任何系统资源。这些控制是操作系统、附加安全包、应用程序、网络硬件设备、协议、加密机制和访问控制矩阵的核心组件。它们在网络或系统内的不同层上工作，并需要维持协同关系，以确保资源没有未经授权的访问，并保证资源的可用性、完整性和机密性。技术控制通过限制可以访问资源的主体数量来保护资源的完整性和可用性，通过防止向未经授权的主体披露来保护资源的机密性。\n\
  \n### 管理控制 (Administrative Controls)\n\n`Administrative controls` 是管理层主要通过策略和程序实施的安全机制。其中的例子是人员控制，它指明了预计员工如何与安全机制交互，以及处理与这些预期相关的不合规问题。这些控制指示了员工在聘用、辞退、停职、调往另一个部门或晋升时应采取哪些安全行动。必须为每种情况制定特定的程序，许多时候人力资源和法律部门会参与这些决策。\n\
  \n### 控制选择 (Control Selection)\n\n减少事故和灾难发生概率的好方法是确保你的安全计划包含正确的工具 set。这些控制需要根据你自己的情况仔细考虑，以决定哪些是有效的，哪些无效的。第一步是理解风险。这里的核心概念是，你无法消除所有风险，因此应该将稀缺的投入投入最可能发生或最危险的风险，并将其降低到高级领导可以接受的程度。\n\
  \n一旦你确定了正确的风险集，就可以更容易地识别出能够适当缓解这些风险的控制。风险与控制之间的关系是多对多的，因为一个给定的风险可以被分配多个控制，就像一个给定的控制可以缓解多个风险一样。事实上，使用多个控制来缓解一个风险虽然效率较低，但可能为保护特别有价值的资产提供韧性。控制的选择由你的组织参数和你的选择标准驱动。\n\
  \n#### 组织定义的参数 (Organizationally Defined Parameters)\n\n意乎意料的是，组织政策在控制选择中起着很大作用，并决定了流程中关键参数的值。`organizationally\
  \ defined parameter` 是一个变量，用于定义所选控制的范围，以支持特定的组织需求或目标。在某些情况下，这些参数的最小值和最大值由法律或政府规定。大多数情况下，这些值（或值范围）对应于组织的风险偏好。这些组织定义参数的示例包括系统备份的频率、数据泄露必须披露的时间，以及可以访问特别敏感信息的人员上限。\n\
  \n#### 选择标准 (Selection Criteria)\n\n安全控制的选择应始终由风险评估驱动。对信息资源机密性、完整性可用性的风险，结合组织的风险偏好，将决定每个系统的基准安全级别。基准安全级别是给定资源的最低可接受保护集。当然，可能还有由董事会建议、外部顾问建议或高级领导偏好等因素驱动的额外要求。安全\
  \ `control selection criteria` 集合由每个系统的基准安全级别加上法律、法规或策略实施的任何额外要求组成。最后一种来源通常包含在上一节描述的组织定义参数中。\n\
  \n一旦选择了安全控制，就应对其进行验证。这意味着我们要比较三组值：资产的基础风险暴露量、应用控制后的预测风险暴露量，以及应用控制后的实际暴露量。经过验证的安全控制始终将资产的风险至少降低到预测的水平。\n\
  \n### 监管合规 (Regulatory Compliance)\n\n某些组织受政府法规和条例的约束，这些法规可能对信息系统安全设定门槛要求。通常，不遵守相关法规会导致罚款、处罚甚至刑事起诉。虽然描述监管合规的所有方面超出了本书（以及\
  \ CSA+ 考试）的范围，但你应该熟悉更常见的法律和法规，此处列出如下：\n\n\n\n\n\n- **萨班斯-奥克斯莱法案 (SOX)**：该法律在安然（Enron）和世界通（WorldCom）财务危机后于\
  \ 2002 年制定，旨在保护投资者免受上市公司欺诈和误导性活动。它对信息安全控制的影响主要在完整性保护领域。受 SOX 监管的组织在确保数字记录不被不当篡改方面具有更高的标准。\n\
  - **支付卡行业数据安全标准 (PCI DSS)**：这一行业标准适用于任何处理信用卡或借记卡数据的组织。我们之前在第 5 章中讨论过它，但值得重复的是，它对安全控制的主要影响集中在漏洞扫描上。\n\
  - **格林姆-里奇-布莱利法案 (GLBA)**：这项法律于 1999 年制定适用于金融机构，旨在保护消费者的个人财务信息。值得注意的是，它包含了所谓的“安全措施规则”（Safeguards\
  \ Rule），该规则要求金融机构维持防护以保护个人消费者信息的机密性和完整性。\n- **联邦信息安全管理法 (FISMA)**：FISMA 于 2002 年制定，适用于属于联邦机构或代表其工作的承包商所属的信息系统。其关键条款包括对风险评估的最低频率、安全意识培训、事件响应和业务连续性的要求。\n\
  - **健康保险可移植性与责任法案 (HIPAA)**：该法律主要涉及改进医疗保健系统，但它包含影响信息安全策略和程序的重要元素。重要的是，它包含了《安全规则》和《隐私规则》，这些对保护患者数据的机密性、完整性、可用性和隐私提出了特定要求。\n\
  \n![Images](img/00005.jpeg)\n\n**考试提示**：你不需要记住所有的这些法规，但你确实需要了解监管要求的通用性质，以及它们对组织政策和程序的制定以及控制措施选择的影响。\n\
  \n### 验证与质量控制\n\n有一句古老的俄罗斯谚语说“信任但要验证”。组织投入大量精力开发框架、政策、程序和控制措施，并不罕见它们却发现（有时是多年后）其安全态势并非他们所想的那样。每项实施都应该跟随验证和质量控制，以确保执行得当。同样重要的是，应该进行持续的周期性工作，以确保防护措施仍在被正确执行，并且在不断变化的威胁面前依然有效。\n\
  \n在信息安全背景下，`验证`（Verification）是确保策略和程序被遵守的过程。`质量控制`（Quality control）是对我们的控制措施进行采样并确保它们提供了特定的安全基准，也就是说它们对于已识别的风险是有效的。作为一名\
  \ CSA+ 人员，你应该了解组织进行验证和质量控制的一些主要方式，我们将在接下来的章节中重点介绍。\n\n### 审计\n\n`审计`（audit）是由独立第三方进行的系统性检查，通常由监管合规性要求驱动。虽然组织完全可以请审计师来评估信息安全或业务的其他方面，但此类活动的成本使得这种做法往往望而却步。尽管如此，越来越多的组织在希望确保安全的某些方面符合标准时，会进行非监管合规性要求。\n\
  \n### 评估\n\n`评估`（assessment）是任何收集信息并据此做出决定的过程。这个宽泛的术语涵盖了审计以及许多其他评估。比记住其定义更重要的是，理解持续评估的重要性，以确保系统的安全措施是充分的。流行的评估包括：\n\
  \n- 漏洞评估\n- 渗透测试\n- 红队评估\n- 风险评估\n- 威胁建模\n- 桌面演练\n\n每个组织都应该有一个正式的评估计划，规定如何、何时、何、为何以及由谁来评估不同的方面。该计划是驱动组织向持续改进和优化的关键组件。这也是防止环境变化导致过时的保险。\n\
  \n### 认证\n\n`认证`（Certification）是对系统安全组件及其对适用法规遵循情况的全面评估。认证过程可以使用防护评估、风险分析、验证和测试技术来评估特定系统的适用性。认证过程的目标是确保系统、产品或网络满足所有安全要求。每当系统引入新组件（例如服务器或传感器）或为组织配置新系统时，通常都会应用此过程。\n\
  \n有些组织在引入新功能之前还有第二步：授权（accreditation）。授权是管理层对系统整体安全性的正式认可。认证信息提交给管理层或负责机构，由管理层提出问题、审查报告和发现，并决定是否接受该产品以及是否需要任何纠正措施。对呈现的整体安全性满意后，管理层做出正式授权声明。通过这种方式，管理层表示他们理解系统在当前环境中提供的保护水平，并理解与安装和维护该系统相关的安全风险。\n\
  \n### 成熟度模型\n\n组织在网络安全方面的成熟度衡量了其安全流程的反思程度。换句话说，如果对流程没有真正的意识，且安全是通过危机处理来管理的，我们可以得出该组织非常不成熟的结论。相反，如果存在正式的、记录在案的流程并为了持续改进进行定期检查，我们可以得出该组织非常成熟。有很多成熟度模型，但也许最有用的是由卡内基梅隆大学软件工程学院开发的\
  \ `CMMI`。\n\n\n\n\n`Capability Maturity Model Integration (CMMI)` 是一套用于开发产品和软件的全面、集成指南。它可以用于评估安全工程实践并识别改进这些的方法。该模型描述了构成过程成熟度基础的程序、原则和实践。该模型的开发目的是帮助软件供应商改进其开发过程，通过提供一条演进路径，从一种随机的“凭感觉行事”的方法转向更具纪律且可重复的方法；这种方法可以提高质量、缩短开发周期、提供更好的项目管理能力、允许及时创建并达成里程碑，并比低效的被动响应方法采取更为主动的方法。它提供了最佳实践，允许组织开发出适用于许多不同小组的标准化方法。其目标是通过实施持续改进步骤，不断审查和改进过程，以优化输出、提高能力，并通过实施持续改进以更低的成本提供更高质量的产品和服务。\n\
  \n\n\n`CMMI` 模型的五个成熟度级别如图图 11-3 所示，并在下列列表中描述。\n\n![Images](img/00073.jpeg)\n\n***\n\
  \n**图 11-3** 成熟度模型集成\n\n1. **初始级 (Initial)**：开发过程是随机的甚至是混乱的。公司没有使用有效的管理程序和计划。没有一致性保证，质量不可预测。成功通常是个人英雄主义的结果。\n\
  2. **可重复级 (Repeatable)**：已建立正式的管理结构、变更控制和质量保证。公司可以在每个项目中适当地重复过程。公司没有定义正式的过程模型。\n\
  3. **已定义级 (Defined)**：建立了正式程序，概述并定义了每个项目中执行的过程。组织拥有一种允许进行量化过程改进的方法。\n4. **管理级 (Managed)**：公司有正式的流程来收集和分析定量数据，并定义了指标输入到过程改进计划中。\n\
  5. **优化级 (Optimizing)**：公司有了预算并集成了持续过程改进的计划。\n\n#### 总结\n\n本章比书中的其他章节稍微长一点（也许可能更枯燥），但它包含了大量的信息，将让你理解安全框架、策略、程序和控制措施。虽然你可能会在\
  \ `CSA+` 考试中看到关于这些主题的具体问题，但你绝对会看到它们不仅影响了大多数考试题，也影响了你的现实组织。尽管我们中的许多人更倾向于花时间与网络敌人斗争或改进我们的技术防御，但制定确保整个组织朝着正确方向发展的正式文档同样重要。如果没有适当的策略和程序，我们的努力最终在保护系统方面可能注定会失败。\n\
  \n#### 习题\n\n**1.** 下列哪项不是访问控制及其实现的范畴？\nA. 行政\nB. 物理\nC. 虚拟\nD. 逻辑\n\n**2.** 哪份\
  \ `NIST` 出版物概述了政府机构和信息系统的各种安全控制？\nA. Special Publication 800-53\nB. Special Publication\
  \ 800-37\nC. `ISO/IEC 27000`\nD. `ISO/IEC 27001`\n\n**3.** 下列哪种由五个核心卷组成的标准被广泛用于信息技术资产的服务管理？\n\
  A. 信息安全管理系统 (`ISMS`)\nB. 网络安全框架 (`CSF`)\nC. 开放组框架 (`TOGAF`)\nD. 信息技术基础库 (`ITIL`)\n\
  \n**4.** 下列哪份 `NIST` 出版物描述了关键基础设施组成组织的自愿结构？\nA. 网络安全框架 (`CSF`)\nB. 国际标准化组织 (`ISO`)\n\
  C. 信息安全系统 (`ISMS`)\nD. 信息和相关技术控制目标 (`COBIT`)\n\n**5.** `ISO/IEC 27000` 系列描述了下列的哪项？\n\
  A. 信息和相关技术控制目标 (`COBIT`)\nB. 信息安全管理系统 (`ISMS`)\nC. 架构开发方法 (`ADM`)\nD. 国际电工委员会 (`IEC`)\n\
  \n**6.** 谁负责确保数据安全控制措施到位、定义分类要求并批准披露？\nA. 系统管理员\nB. 首席安全官\nC. 数据所有者\nD. 首席信息官\n\n\
  **7.** 哪种设备是开发组织独特的全面且可重复的过程以改进网络安全态的正式流程的一部分？\nA. 验证\nB. 成熟度模型\nC. 质量控制\nD. 合规性\n\
  \n**8.** 网络安全框架的哪个组件描述了网络安全实践的复杂程度？\nA. 框架核心 (Framework Core)\nB. 实施层 (Implementation\
  \ Tiers)\nC. `NIST SP 800-53` 控制类别\nD. `ITIL` 过程\n\n**9.** 网络安全框架 (`CSF`) 框架核心的关键功能是什么？\n\
  A. 识别、保护、检测、响应、恢复\nB. 识别、处理、检测、响应、恢复\nC. 识别、处理、检测、传输、恢复\nD. 识别、保护、检测、传输、恢复\n\n**10.**\
  \ 源自高层管理并指导组织安全实践角色的指令称为（术语）？\nA. 行政策略\nB. 技术策略\nC. 安全策略\nD. 物理策略\n\n### 答案\n\n\
  **1.** **C.** 访问控制是为了保护系统的机密性、完整性和可用而建立的机制，分为行政、逻辑或物理。\n\n**2.** **A.** `NIST` 发布了\
  \ Special Publication 800-53（联邦信息系统和组织的安全与隐私控制），旨在为联邦政府和相关组织建立统一的信息安全框架。\n\n**3.**\
  \ **D.** 信息技术基础库 (`ITIL`) 是 IT 服务管理的既事实最佳标准。它提供了目标、实现这些目标所需的通用活动，以及为了用通用语言满足这些确定目标所需的每个过程输入和输出值。\n\
  \n\n\n\n\n### 4. A. CSF 侧侧于将网络安全活动与业务流程对齐，并将网络安全风险纳入组织风险管理流程。该框架由三部分组成：框架核心（Framework\
  \ Core）、框架描述（Framework Profile）和框架实施层（Framework Implementation Tiers）。\n\n### 5.\
  \ B. 国际标准化组织（ISO）和国际电工委员会（IEC） 27000 系列（也称为“ISMS 标准族”）为信息安全管理提供了最佳实践建议。\n\n### 6.\
  \ C. 数据所有者对数据进行分类，并对其保护、使用和披露负责任。\n\n### 7. B. 成熟度模型用于创建适用于特定操作环境的流程，有助于提高运营性能和安全态势。\n\
  \n### 8. B. CSF 实施层对网络安全实践的严谨程度和复杂程度进行分类，分为部分（第 1 层）、风险感知（第 2 层）、可重复（第 3 层）或自适应（第\
  \ 4 层）。\n\n### 9. A. 框架核心由五个功能组成，可以提供组织管理网络安全风险的高层视角：识别（Identify）、保护（Protect）、检测（Detect）、响应（Respond）、恢复（Recover）。\n\
  \n### 10. C. 安全策略是由高级管理层、政策委员会或委员会发布的指导文件，规定了安全在组织内部扮演的角色。\n\n***\n\n# 第 12 章\n\
  ## 身份与访问管理\n\n在本章中，你将学习：\n\n- 基于上下文的身份验证的各种参数\n- 使用常用身份验证协议的安全问题和最佳实践\n- 网络环境中各种组件的安全问题\n\
  - 针对身份和访问系统的常用攻击手段\n\n***\n\n*身份的价值正如此，它往往伴随着特定的目的*。\n\n—Richard Grant\n\n硅谷网络安全公司\
  \ Shape Security 2016 年的一项研究指出，针对公开公司门户的密码攻击中，近 90% 是使用自动化工具重用从其他泄露事件中收集的登录和密码凭据。这种方法之所以有效，是因为我们倾向于选择容易破解的密码，然后在许多网站上重复相同的弱密码。虽然报告的\
  \ 2% 成功率看起来并不起眼，但当我们考虑到雅虎最近遭受的规模达 15 亿用户的用户泄露等事件时，这变成了一个严重的问题。处理这种规模的攻击的困难之处在于，这些系统从未旨在提供如此大量数据的可见性，也没有相应的基础设施来处理增加的需求。解决这一身份验证挑战的一种优雅且成本较低的解决方案是启用并强制执行`multifactor\
  \ authentication`（多因素认证）。这种身份保证技术在用户尝试访问系统时需要两个或更多信息的信息。因素分为三类：你所知的、你拥有的以及你所的（或你所做的）。最有效的多因素系统使用这些类别中至少两个类的因素。例如，一个因素可能是传统的登录和密码组合，而另一个可能是通过短信投送到移动设备的验证码，或者可能是生物识别特征。尽管使用了多个因素进行身份验证，验证屏幕后人员的身份仍然是一个挑战。使用多个因素的补充解决方案是`context-based\
  \ authentication`（基于上下文的身份验证）概念，它旨在通过无缝且透明地整合位置数据、时间甚至打字模式等因素，使身份验证过程更加安全。用户通常意识不到这些额外因素正在被验证和处理。\n\
  \n***\n\n![Images](img/00005.jpeg)\n\n**考试提示** 密码和 PIN 码是“你所知”的示例。智能卡、硬件身份验证设备和\
  \ USB 狗器属于“你所拥有”的类别。“你所的”和“你所做的”包括生物识别特征或用户的任何其他固有特征，如手写或语音模式。\n\n### 与基于上下文的身份验证相关的安全问题\n\
  \n基于上下文的身份验证通过确保一个或多个参数处于允许范围内，或与标准登录程序结合时匹配历史用户数据，来提高安全性和可用性。这些参数包括时间、IP 地址、位置、设备和生物识别。目标是为每个登录事件提供上下文，但这样做需要对基础设施进行前期投资，以生成系统运行所需的身份数据。对于流程中的每个参数，至少需要发生两个活动。第一项是对用户数据的初始分类。这可能像收集设备信息一样简单，但生物识别测量值等数据可能会增加要求。根据你的组织运营所在地，你可能必须遵守有关存储和传输生物识别数据的严格法律，这包括指纹、语音录音、虹膜扫描，甚至是打字模式。\n\
  \n第二个活动是比较和验证过程。与任何其他类型的模式匹配一样，这里的挑战在于减少假阳性和假阴性。如果一个强大的多因素系统阻止了合法用户访问其所需的资源，那么它就是没用的。此过程还需要足够快，以便于为用户增加明显的等待时间。你最不希望的是用户因为该过程比他们习惯的慢而绕过它。虽然这确实需要更高的设置成本，但与传统方法相比，其优点是增加了安全性、灵性和可用性。在尝试利用这些系统时，攻击者通常会针对单个参数或多因素验证实施中的缺陷。一种非常常见的方法是使用名为`spoofing`（欺骗）的方法提供虚假信息，这是指任何未经授权的用户向系统提交看似合法但伪造的数据以获取访问权限的行为。我们将在后面的章节中深入探讨攻击者试图操控系统的各种方式，以及各种基于上下文身份验证技术的优缺点\n\
  \n#### 时间\n\n基于上下文的身份验证中的时间参数用于根据活动发生的时间判断用户的真实性。这像是一个常识测试：用户在没有需要时或在工作时间之外尝试登录是否合理？这当然需要定义访问限制，并由于时差考虑位置。如果时间限制是已知的，这可能就是攻击者尝试通过操纵系统输入来伪装在不同时区以获取访问的地方。因此，在防止未经授权的访问时，时间和位置应该紧密结合。例如，如果一个用户在\
  \ GMT 时间 10 点从纽约位置成功登录系统，并在 GMT 时间 11:30 从旧金山位置尝试尝试，那么你可以得出这是一个可疑的尝试。\n\n\n\n\n\
  时间也可以通过 `time window`（时间窗口）的概念引入身份验证过程。某些双因子系统（例如 `RSA SecurID` 机制）在登录尝试期间向用户提供代码，通常使用一种名为\
  \ `fob` 的硬件设备，该设备使用内置时钟和硬编码密钥提供持续变化的值。在 `SecurID` 的情况下，每隔 60 秒生成并显示一个新代码。通过该设备，用户在代码失效前始终只有不到一分钟的时间来提供代码。\n\
  \n## 位置\n\n无线位置服务始于联邦通信委员会（`FCC`）于 1996 年发布的一项公共安全指令。该机构希望通过使用移动服务提供商的数据，在拨打 911\
  \ 电话期间获取非常准确的位置信息，从而改进对紧急情况的响应。然而，位置服务的商业潜力促使了许多公司和制造商提高移动设备上位置信息的准确性和获取速度。如今，几乎每个移动设备都配备了至少一个依赖位置服务的应用程序。将位置作为上下文认证的参数是一种常见方法，通过只接受来自已知且信任区域的请求，可以防止许多非法登录尝试。从设备报告位置有多种方法，大多数归为两类：基于网络的位置和基于设备的位置。基于网络的位置信息源于设备所在网络的数据。例如，通过查询\
  \ `IP` 地址，可以查询负责该区块 `IP` 地址的互联网注册机构来确定国家、城市和邮政编码。然而，这种方法存在一些明显的缺点，因为 `IP` 地址很容易伪造。此外，如果攻击者已经通过某种方式攻破了信任网络上的某个设备，并将其作为更大行动的跳板，那么尝试通过这种方式按位置进行过滤就帮助不大了。\n\
  \n现代智能手机和笔记本电脑使用组合传感器来实现位置功能。全球定位系统（`GPS`）传感器仍然是设备位置报告中最广泛使用的方法。这些系统依赖卫星星座来精确确定设备在地球上任何地方的位置。当视野中有三颗卫星时，设备可以获得精确到米的定位信息，而如果有四颗，则还可能获得高度细节。由于并不总是能够获得与\
  \ `GPS` 卫星的直接视线，特别是在城市地区或室内，这些手机通常使用一种称为 `assisted GPS (A-GPS)` 的功能来提高定位信息的准确性。与标准\
  \ `GPS` 类似，`A-GPS` 根据与至少三个已知位置物体的距离获得的信息来计算其位置数据，但它不是使用轨道卫星的位置，而是依靠固定蜂基站的位置。通过结合这两个源，手机即使在通常难以获得良好连接的环境中，也能提供可靠的定位信息。\n\
  \n在伪造位置数据方面，攻击者有几种选择。为了防御这一点，了解位置是如何从这些设备中报告的至关重要。位置数据由传感器提供给手机，然后存储在设备上，并根据需要呈现给身份验证服务器。攻击者可以伪造\
  \ `GPS` 信号数据，也可以操纵设备本身上的位置数据。后者需要的技术知识和成本要少得多。事实上，`iOS` 和 `Android` 都有应用程序可以允许用户轻松地伪造手机手机位置数据。这些应用程序通常只在越狱（jailbroken）或根根（rooted）设备上运行。\n\
  \n## 伪造 GPS\n\n许多遗留系统（如 `GPS`）的发明时期，从计算或财务角度来看，除了国家级行为者外，其他人都无法破解它们。没有什么比普通用户执行的操作更能突出我们现在伪造\
  \ `GPS` 是有多么容易了。2016 年，`Pokémon Go` 移动应用风靡全球。在游戏中，玩家面临的挑战是使用 `GPS` 引导的移动手机收集名为 `Pokémon`\
  \ 的虚拟生物。当用户在现实世界中移动以定位并捕捉目标时，一些玩家意识到通过操纵位置数据可以获得显著优势，迅速开发了各种方法。这些作弊手段中最令人印象深刻的是一种需要将移动设备放在法拉笼箱中，并由信号发生器提供虚假信息的方法。移动设备屏蔽了真实的卫星信号，会将伪造的信号解释为位置数据的合法来源，并将其传递给应用程序。通过调整信号发生器产生的信号，这些聪明的玩家可以模拟游戏中获得额外积分所需的移动，而无需移动一寸。这种作弊手段既廉价又可靠。\n\
  \n## 频率\n\n登录尝试的频率和速度也可以作为上下文认证的一个重要参数。即使是最才华的程序员在打字时也有其局限。在巅峰性能下，人类输入、解释和迭代的速度远跟不上机器。因此，当机器在执行人类应该执行的操作时，这一点显而易见，特别是在登录系统等活动期间。这就是基于频率的认证参数背后的思想。如果系统观察到\
  \ `SSH` 登录尝试的速率看起来不可能，它可以对该地址进行黑名单处理或限制，以防止进一步的探测。攻击者知道，管理员使用 `iptables` 或类似工具实施速率限制是非常容易的，因此他们可能会调整尝试使其看起来更像人类。\n\
  \n## 行为\n\n行为因素是基于用户与计算机交互的因素，例如打字速度和鼠标移动。传统的基于密码的认证系统的主要缺点是，一旦会话通过，很少会有额外的尝试来验证同一用户是否仍然处于控制。如果攻击者\
  \ `hijack`（劫持）了一个会话，他就可以利用原始用户的凭据获得未经授权的访问。\n\n\n\n美国高级研究计划局（DARPA）将这一过程称为“主动认证”，即学习系统根据用户与其机器交互的行为生成一个“认知指纹”。开发这种用户画像需要一些时间，但它是防止攻击者进入你系统的有效方法。然而，随着人工智能算法变得日益强大，对于拥有中等资源但有动机的攻击者来说，开发自动化方法来模拟人类行为（特别是在目标识别方面）已成为现实。安全研究社区近期展示了这种不断演变的“猫鼠游戏”的几个例子。其中一个例子是，研究人员演示了破解\
  \ CAPTCHA 测试的自动化方法——CAPTCHA 是一种通过呈现人类在解决某些任务时具有明显优势的任务（如图像或声音识别）来区分人类与机器的网页挑战。复制人类行为的进步将对任何基于行为的认证参数产生影响。\n\
  \n## 与身份相关的安全问题\n\n`数字身份`是信息系统中对现实世界主体的独特表示。我们大多数人都有多个身份，例如我们在工作、社交媒体和个人电子邮件中使用的身份。每个身份都需要经过`认证`，认证是一个过程（前面部分描述的过程），主体通过该过程验证其对特定身份的所有权，以获取访问特定对象或资源的授权。问题就在于：认证身份和提供适当授权需要复杂的机制，这些机制可能会被精明的对手所利用。劳动力趋势使得这一挑战更加复杂。\n\
  \n随着越来越多的公司变得日益去中心化和移动化，身份管理（`IDM`）任务成为整个 IT 企业的关键部分。云端效率应用程序使用户能够从任何地点、任何设备进行连接，但这是有代价的。在不增加成本、停机时间和用户负担的情况下维持安全性和生产力的要求，使得这成为了一项具有挑战性的工作。尽管技术有所进步，从用户到应用程序，信任链的几乎每个部分仍然存在问题。\n\
  \n### 人员\n\n人是业务的核心，但他们对其安全态势构成了最大的威胁。由于计算机无法实实验证人的身份和意图，`IDM` 解决方案必须足够快速收集正确信息以做出准确判断。现代解决方案结合了之前讨论的参数，为员工和访客提供快速访问，同时保持足够的灵活性以拒绝未经授权用户的访问。尽管有最好的技术控制，人为错误仍然占了事故的大多数。人们经常共享密码、丢失设备，并沦为钓鱼邮件的受害者。如果攻击者能够收集网络上使用户变得独特的所有信息，那么对他来说，伪装成该用户轻而易举。用户培训是解决与组织成员相关安全问题的首要方法。SANS\
  \ 学院这种做法称为“保护人类”，通过教育用户了解威胁并培训他们在网络环境中采取恰当行动，有助于组织管理风险。对用户就保护凭据的最佳实践以及寻找受攻击的迹象进行培训，将比许多技术解决方案更快地提高你组织的安全态势。\n\
  \n### 终端\n\n网络的存在是为了在节点之间可靠地交换信息。终端必须能够快速验证其身份确实如其所称。终端认证（也称为`设备认证`）通常依赖于来自设备硬件或操作系统配置的值。终端认证的一种常见机制是通过终端生成的密钥或令牌，并提交给网络或请求的资源。终端在认证方面特别容易受到滥用，因为伪造或重放终端数据很容易。\n\
  \n* *\n\n![Images](img/00009.jpeg)\n\n**注意** 介质控制（`MAC`）地址是 OSI 网络模型链路层识别网络连接设备的唯一值。该值在制造过程中分配给网络接口卡（`NIC`），但伪造设备的\
  \ `MAC` 地址轻而易举。更改此值的能力现在是许多操作系统的内置部分。\n\n### 服务器\n\n认证服务器的一种广泛使用的技术是使用由 X.509 标准定义的公钥证书。这些数字证书由受信任的证书颁发机构（`CA`）颁发给服务器的所有组织，颁发机构需要采取步骤验证请求机构的身份。这些步骤通常包括支付巨额费用以及提供公司文件。这一过程使得威胁者很难为其他组织获得证书。尽管如此，盗取别人的证书仍然可能的，据称在斯蠕病毒（Stuxnet）行动中就发生过。这种通常实现的这种只验证连接一一端的身份——通常是服务器。即便是如此，攻击者也可能插入到链中并展示虚假证书。虽然这会在客户端浏览器上产生警告，但这些信息经常被用户忽略。\n\
  \n最好对服务器和客户端进行双向认证，为此我们有了 `Kerberos` 认证协议。`Kerberos` 几乎存在于所有的操作系统中，形式各种。像神话中的生物一样，`Kerberos`\
  \ 有三个关键组件用于在请求访问时进行挑战：认证服务（`AS`）、票据授予服务器（`TGS`）和密钥分发中心（`KDC`）。图 12-1 显示了客户端与 `Kerberos`\
  \ 交换组件之间的关系。当客户端发送认证请求时，`AS` 将检查 `KDC` 数据库中的现有用户以验证用户是否存在。如果成功找到用户，`AS` 将向客户端返回两条消息——一个包含\
  \ `TGS` 会话密钥，另一个包含票据授予票据（`TGT`）。`TGT` 消息包含客户端信息、时间戳和 `TGS` 会话密钥的副本。然后它使用一个客户端没有的对称密钥进行加密。另一条消息包含一些用户信息和另一个\
  \ `TGS` 会话密钥的副本。此消息使用用户的私密钥进行加密，因此，如果用户不持有此密钥，客户端将无法读取 `TGS` 会话密钥。如果客户端成功解密消息以获取\
  \ `TGS` 会话密钥，它就可以使用该密钥以及 `TGT` 来查询 `TGS`。\n\n![Images](img/00074.jpeg)\n\n**图 12-1**\
  \ `Kerberos` 协议三个“头”之间的关系\n\n\n\n\n此时，客户端发送给 TGS 的消息包含两个部分。第一部分是 `TGT`，它仍然使用密钥进行加密。第二部分是\
  \ `authenticator`，它包含客户端 ID，并使用 TGS 会话密钥（TGS 目前尚不知道该密钥）进行加密。由于 TGS 拥有该密钥，因此它能够无问题地解密\
  \ `TGT` 消息。它将使用在该条消息中找到的 `TGS session key` 副本来解密 `authenticator`。现在 TGS 能够读取这两条消息了，它将执行几个步骤，例如验证票据是否过期以及\
  \ `authenticator` 是否已经存在。现在 TGS 准备两条消息，其方式与客户端最初的操作类似。其中一条消息将包含服务会话密钥，该密钥使用 `TGS\
  \ session key` 加密；另一个消息将包含一个服务票据，其中包含服务会话密钥的副本，并使用服务密钥加密。客户端将能够使用存储的 `TGS session\
  \ key` 解密第一条消息，但无法解密第二条。\n\n客户端将再次为服务准备两条消息。第一条是服务票据，它仍由服务密钥加密；第二条消息是 `authenticator`，它包含客户端数据并由服务会话密钥加密。请求的服务将使用其服务密钥解密服务票据，从而显示服务会话密钥，并使用该密钥来解密\
  \ `authenticator`。最后，如果所有用户和时间戳检查通过，服务将向客户端返回它自己的 `authenticator`，其中包含用服务会话密钥加密的服务\
  \ ID。由于客户端机器已拥有此密钥，它将解密该 `authenticator` 消息并验证服务 ID。从现在开始直到票据过期，客户端可以使用缓存的服务票据继续访问服务。\n\
  \nKerberos 已使用几十年，你需要了解关于其用法的一些关键点。KDC 数据库对于整个 Kerberos 系统的完整性至关重要。未能保护此资源免受未经授权的访问将使你的组织面临巨大风险。此外，Kerberos\
  \ 是一种必须由网络中的每个节点支持的解决方案。只有在所有服务器、服务和客户端都“感知 Kerberos”并支持加密交换的网络中，Kerberos 才有用。时间在整个\
  \ Kerberos 身份验证过程中起着主要作用。在所有的交换中，时间戳都是验证过程的一部分。整个过程涉及多个设备，这意味着所有时钟都需要同步。如果时钟偏差过大，Kerberos\
  \ 将无法正常身份验证。在微软的 Kerberos 实现中，此值可以在策略的“计算机时钟同步最大容忍度”设置中设置。最佳实践规定此值不超过五分钟。\n\n![Images](img/00005.jpeg)\n\
  \n**考试提示** 虽然你不需要被要求演示整个 Kerberos 身份验证过程，但你应该理解其架构以及票据和对称密钥的使用。\n\n### 服务\n\n伪装成服务是诱骗用户提供敏感数据的有效方法。在用户级别，检测虚假服务极其困难。然而，根据网络环境，有相应的解决方案来确保服务的真实性。为了防止流氓服务的滥用，微软的\
  \ .NET Framework 有一个名为“服务身份和验证”的功能。Windows 通信基础 (WCF) 基础设施将确保所请求服务的身份值与预设值匹配。图 12-2\
  \ 显示了 WCF 中身份元素的语法。当客户端尝试使用此功能连接到服务时，它将首先执行任何已有的标准身份验证程序。一旦服务成功验证了客户端机器，它将会将名为 `endpoint\
  \ identity` 的存储值与服务在交互期间提供的值进行比较。如果这些值匹配，客户端机器就可以访问该服务。身份值的元素包括证书信息、DNS、RSA 值、服务名称和用户名。这本质上是后台发生的第二次身份验证过程。\n\
  \n![Images](img/00075.jpeg)\n\n**图 12-2** Windows 通信基础使用的 identity 元素语法\n\n### 角色\n\
  \n你可能记得我们在第 3 章 中讨论过基于角色的访问控制。例如，一个博客用户可能拥有用户名“tony”并被分配“编辑者”角色。另一个名为“karen”的用户可能拥有“管理员”角色。每个用户可能同时拥有多个角色（例如：贡献者、编辑者和批准者），每个角色将允许访问某些资源。这些访问控制级别基于用户为了履行组织内职责需要执行的必要操作任务。这种方法可能会很复杂，因为管理员在配置访问控制时必须将组织授权策略翻译为权限。随着环境中对象和用户数量的增加，用户不可避免地会被授予某些对象的非必要访问，从而违反了最小权限原则并增加了公司的风险。\n\
  \n攻击者经常会尝试根据角色确定哪些用户具有特权权限。有时，拥有特权角色的用户可能并没有意识到这些特权，这产生了安全问题。角色审计应该是你的评估的一部分，以确保用户只获得其任务所需的角色。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** 在大多数情况下，角色与身份相关联，而不是直接进行身份验证。你可以将其认为是身份的扩展，描述可以执行何种活动。这种关系可能是一对多的关系，意味着一个单一身份可以拥有多个角色，并根据任务调用所需的权限。\n\
  \n### 应用程序\n\n应用程序是寻找进入系统方法的恶意攻击者的不断目标。设计供公众访问的 Web 应用程序将限制公共用户查询或执行的内容。攻击者经常会尝试操纵这些应用程序的输入以实现`权限提升`，即获得对目标应用程序或操作系统的提权访问权限。成功的攻击通常是软件缺陷或配置错误的结果。我们可以利用之前在第\
  \ 5 章和第 6 章中讨论的漏洞评估原则来识别并处理这些漏洞。\n\n#### 与身份存储库相关的安全问题\n\n身份库是任何存储验证用户网络访问所需凭据的资源。攻击者经常针对身份存储库以添加或更改用户属性。常规监控这些存储库以发现操纵迹象将会提醒你攻击者的存在。\n\
  \n#### 目录服务\n\n\n\n\n目录服务服务器本质上是一个用于存储和管理信息的中央存储库。管理员依靠目录服务来提供大规模的管理和安全选项。对于用户而言，目录服务允许他们快速定位网络资源，而无需记住具体的地址。关于网络的几乎任何信息都可以存储在目录服务数据存储器中。用户及其寻求的资源都被分配了唯一标识符，用户通常可以根据这些信息对企业服务和应用程序进行身份验证和授权。目录服务需要具有扩展性，并能够与网络上的各种其他服务良好集成。\n\
  \n#### Active Directory (活动目录)\n\nActive Directory (AD) 在许多组织中起着至关重要的作用。作为 Windows\
  \ 环境的目录服务，AD 允许组织集中管理资源的同时提供网络安全策略。AD 环境中的任何用户、系统、资源或服务都被视为一个 `object`，它关联有 `attributes`，包括名称和描述。许多针对\
  \ AD 环境的攻击者的目标是获取网络立足点，跨系统移动，并最终获得 AD 域控制器的访问。这种访问权限将赋予攻击者对组织相关的所有对象的完全控制权。\n\n\
  保护这些环境两种主要方法是减少 AD 的攻击面和启用审计功能。默认情况下，AD 具有几个特权账户组，如 `Enterprise Admins (EA)`、`Domain\
  \ Admins (DA)` 和 `Built-in Admins (BA)`。根据最小权限原则 (`POLP`)，你只应在网络上保持必要的管理员数量，并仅赋予日常管理所需的适当权限。改进\
  \ AD 安全性的第二种技术是开发事件日志监控系统并启用详细的对象审计。如果启用了正确的审计和报告级别，就可以很早发现许多事件。通过将 `Object Access\
  \ Auditing` 等高级功能作为全目录安全策略的一部分，你可以确定敏感对象何时被访问或被更改，并根据需要报告这些更改。默认情况下，此值是不启用的，但当与良好的\
  \ SIEM 解决方案结合时，它将为您在损害发生前识别异常网络行为的速度和灵活性。\n\n![Images](img/00005.jpeg)\n\n**考试贴士**：在任何情况下都不应共享对\
  \ AD 服务的管理权限。获得 AD 域控制器管理访问的恶意人员对网络拥有完全控制权。即使是具有访问权限的非恶意但缺乏经验的用户，如果他们进行了错误的配置更改，也会导致意想不到的问题。\n\
  \n#### LDAP\n\n目前使用的大多数目录服务底层基础是轻量级目录访问协议 (`LDAP`)。LDAP 为在网络上维护目录服务提供了跨平台的开放标准。用户可以查询\
  \ LDAP 服务器以根据特定格式的语句获取响应。攻击者可能构造某些语句，触发 LDAP 服务器提供请求者通常未被授权的额外信息——更糟糕的是，让服务器执行任意代码。假设该系统允许请求者仅搜索特定类型的资源——在这种情况下是打印机和存储设备。图\
  \ 12-3 显示了普通用户及其请求和响应与攻击者提供的响应的对比示例。在合法请求中，用户指定搜索存储设备或打印机。请注意，攻击者格式化其查询的方式使得在被解释时，输入值看起来像\
  \ LDAP 命令，并在比用户通常允许的更高的级别上执行。系统根据其对 `(uid=\\*)` 的解释为所有用户提供结果。\n\n![Images](img/00076.jpeg)\n\
  \n**图 12-3**：合法查询与 LDAP 注入的对比\n\n防御此类攻击的关键是对用户输入进行验证和清理，以防止转义字符，并限制包含正则表达式的用户输入。\n\
  \n#### TACACS+\n\n终端访问控制系统加 (`TACACS+`) 是一种由思科在 20 世纪 90 年代提出的身份验证、授权和计费 (`AAA`)\
  \ 协议。作为 Kerberos 的替代方案，TACACS+ 使用客户端/服务器方法来确定用户访问级别。在连接时，用户与用户数据库进行比较，然后应用策略。在 TACACS+\
  \ 中，身份验证、授权和计数功能被视为分离且独立的。尽管它主要设计用于用于设备 AAA，但它也经常用于网络 AAA。尽管非常适合网络 AAA，但 TACACS+\
  \ 在其协议中存在一些根本性缺陷。尽管它使用 TCP，但它特别容易受到重放攻击，因为序列号从 1 开始。这意味着攻击者不需要猜测序列在哪里中断的，因为 TACACS+\
  \ 系统总是接受从序列号 1 开始的会话。此外，TACACS+ 的会话 ID 相对较短，可能的 ID 池也足够小，容易受到所谓的“生日攻击”或加密哈希函数碰撞的影响。\n\
  \n![Images](img/00009.jpeg)\n\n**注意**：尽管与 TACACS 和 XTACS 共享大部分名称，但较新的 TACACS+ 是一个完全不同的协议，与旧方法不兼容。\n\
  \n#### RADIUS\n\n远程认证拨号用户服务 (`RADIUS`) 类似于 TACACS+，因为两种 AAA 协议都为管理员和用户提供身份验证服务。然而，TACACS+\
  \ 在身份验证过程中加密用户名和密码，而 RADIUS 只加密用户密码。此外，RADIUS 使用 UDP 而非 TCP，这意味着可靠性可能会取决于网络状态。由于\
  \ UDP 是一种尽力而为的传输协议，很难确定事务过程中何时发生了故障。从安全的角度来看，这意味着在欺骗尝试中伪造数据包更容易，因为没有数据包接收的确认。RADIUS\
  \ 还允许在网络中使用“共享密钥”；因此，如果任何一个弱终端被攻破，整个网络的破解将容易得多。这结合共享密钥缺乏复杂性（或熵），意味着针对密钥的离线攻击更有可能成功。\n\
  \n某些 RADIUS 实现还容易受到 *缓冲区溢出* 攻击，当过多的数据被强制输入内存空间（或缓冲区）时，产生的额外数据溢出专用内存限制并进入内存的其他区域。针对\
  \ RADIUS 系统的此类攻击可用于利用任意恶意代码、泄露敏感用户数据或作为拒绝服务攻击的一部分。\n\n### 与联合和单点登录相关的安全问题\n\n\n\n\
  \n\n联邦身份（Federated identity）是一种使用个人的数字身份来访问各种服务的概念，且通常跨越多个组织。该身份由称为 `federated identity\
  \ manager`（联邦身份管理器）的经纪人提供。当用户验证其身份时，仅需向管理器进行身份验证，而请求身份信息的应用程序也随需要信任该身份。许多流行平台（如\
  \ Google、Amazon 和 Twitter）利用其庞大的用户群为第三方网站提供联邦身份服务，从而省去了用户为每个网站创建单独账户的麻烦。\n\n使用联邦身份提供身份验证通常通过单点登录（SSO）实现。在业务环境中，用户可能需要为电子邮件服务、CRM、目录或其他任何业务\
  \ Web 应用程序提供凭据。`SSO` 通过要求用户仅维护一套凭据，简化了登录单一组织内多个系统的过程，并且它通常与现有的 `LDAP` 数据库相接。使用 `SSO`\
  \ 的主要优势体现在用户和管理员双方。用户只需要记住一个密码或 PIN 码，这减少了管理多个密码带来的疲劳。此外，他们还节省了为每个所需服务重复输入凭据的时间。对于管理员来说，这意味着关于密码问题的电话会减少。图\
  \ 12-4 显示了使用安全断标记语言 (`SAML`) 标准的 `SSO` 请求流程，这是一种实现 `SSO` 的广泛使用的方法。\n\n![Images](img/00077.jpeg)\n\
  \n**图 12-4** 用户发起的身份验证请求的单点登录流程\n\n`SAML` 使用一个系统在用户、身份提供者 (`IDP`) 和服务提供者 (`SP`)\
  \ 之间交换信息来提供访问和授权决策。当用户请求访问服务提供者的资源时，`SP` 会为 `IDP` 创建身份验证请求。`IDP` 将提供关于用户的反馈，`SP`\
  \ 可以根据其内部规则以及来自 `IDP` 的正面或负面响应做出访问控制决策。如果允许访问，则会生成一个令牌代替实际凭据并传递给 `SP`。\n\n尽管 `SSO`\
  \ 改进了访问多个系统时的用户体验，但它确实有一个重大的缺点：如果凭据被泄露，影响可能会增加。因此，使用 `SSO` 平台需要更加关注用户凭据的保护。这就是包含多个因素和基于上下文的解决方案可以针对恶意活动提供强保护的地方。此外，由于\
  \ `SSO` 集中了身份验证机制，该系统变成了一个关键资产，从而成为攻击的目标。`SSO` 系统的遭到破坏或可用性丢失，意味着失去对依赖 `SSO` 系统的整个组织应用程序集的访问权限。\n\
  \n### 手动与自动配置/撤销\n\n`Provisioning`（配置）是指在服务上创建用户账户并设置与之相关的适当角色和访问权限的协调工作。让 `SSO`\
  \ 受管理员如此青睐的部分之一是能够非常快速地为服务创建和删除账户。自动配置（Auto-provisioning）是在用户对新系统进行身份验证时即时创建账户的方法。自动配置意味着\
  \ `IDP` 断言该用户应允许在 `SP` 拥有账户。这显然要求 `SP` 信任 `IDP` 对用户的验证，这进一步说明了该过程的关键性。\n\n### 漏洞\n\
  \n为什么身份验证系统会成为攻击者的首要目标？要回答这个问题，我们必须提醒自己，身份验证是验证身份并授予访问的过程。一旦接受了这些信息，系统通常会根据客户端提供的初始凭据做出后续决策。如果攻击者用虚假凭据欺骗系统，他就可以冒用用户的身份。\n\
  \n挑战的核心在于识别并通信恰好所需的信息。毕竟这些都是机器，它们永远无法真正知道我们是谁或我们的意图是什么。它们只能根据我们提供给它们的信息以及我们在提供这些数据时表现出的行为线索做出决策。如果攻击者足够聪明，能够伪造足够的信息，那么在身份验证系统眼里，他实际上就是同一个人。\n\
  \n有时攻击者会伪装成服务以收集凭据或截获通信。欺骗客户端可以通过几种方式实现。首先，如果服务器密钥被盗，攻击者看起来就像服务器，而客户端可能不会察觉。此外，如果攻击者以某种方式获得客户端作为证书机构（CA）的信任，或者客户端没有检查攻击者是否确实是受信任的\
  \ CA，那么伪装就会成功。\n\n本质上，`MITM` 攻击是双向的伪装攻击：攻击者既向真实服务器伪装客户端，又向真实客户端伪装服务器。作为代理或中继，攻击者将利用其在双方对话中间的位置来收集凭据、捕获流量或引入虚假通信。即使使用加密连接，也可能进行与未加密攻击类似的\
  \ `MITM` 攻击。在 `HTTPS` 的情况下，客户端浏览器与攻击者建立 SSL 连接，而攻击者又与 Web 服务器建立第二个 SSL 连接。客户端可能会看到也可能看不到关于客户端有效性的警告。如果出现了警告，受害者很可能会忽略或点击通过警告，这突显了用户培训的重要性。警告也可能完全不出现，这表明攻击者已成功获得了受信任的证书机构签署的证书。\n\
  \n\n\n\n\n会话劫持（Session hijacking）是一种攻击手段，攻击者利用有效的会话信息（通常通过窃取和重放）来实现。HTTP 流量是无状态的，且通常使用多个\
  \ TCP 连接，因此它使用会话来跟踪客户端的身份验证。会话信息只是出现在 cookie 文件、URL 本身或 HTTP 流量其他部分的字符字符串。攻击者可以通过流量捕获、中间人攻击（MITM）或预测会话令牌（token）信息来获取现有的会话信息。捕获并重复会话信息是攻击者接管或劫持现有网络会话并冒充受害者的方法。\n\
  \n## 跨站脚本\n\n跨站脚本（XSS）是一种注入攻击，它利用用户的浏览器执行恶意代码，这些代码可以访问用户浏览器中的敏感信息，例如密码和会话信息。由于恶意代码存在于用户访问的网站上，用户的浏览器往往不知道该代码不应被信任。因此，XSS\
  \ 利用了浏览器与网站之间这种固有的信任，在网站的安全级别运行恶意代码。XSS 有两种形式：持久型和非持久型。在持久性攻击中，恶意代码存储在网站上，通常通过留言板或评论帖子发布。当其他用户尝试使用该网站时，他们会在无意中执行隐藏在之前发布的内容中的代码。非持久性攻击也称为\
  \ `reflected` XSS，利用服务器软件的漏洞。如果攻击者注意到某个网站存在 XSS 漏洞，他可以创建一个特殊的链接，当其他用户接收并点击该链接时，将导致浏览器访问网站并将攻击反射回受害者。这可能导致会话详情或用户信息无意中泄漏到攻击者指定的任何服务器。这些链接通常通过电子邮件和短信传递，看起来无害且合法的。\n\
  \n## 权限提升\n\n权限提升（Privilege escalation）简单是指任何允许用户执行其通常不被允许的操作。这通常通过利用漏洞、实现缺陷或配置错误来实现。提升可以以`vertical`（垂直）方式发生，意味着用户获得了高用户的权限。或者，可以执行`horizontal`（水平）权限提升以获取相同权限他人的访问权限。攻击者将利用这些权限修改文件、下载敏感信息或安装恶意代码。\n\
  \n## 越狱与 Root\n\n越狱（Jailbreaking）是绕过 Apple iOS 限制的行为，它利用权限提升允许用户执行通常无法执行的功能。越狱允许\
  \ Apple 设备用户安装自定义软件或修改过的操作系统。同样，对 Android 进行“root”赋予了用户对设备子系统的特权访问。开发这类漏洞是一项大工程，因为移动设备制造商花费了大量资源来标准化他们的设备。虽然安装额外应用和修改移动设备的自由看起来是一个好主意，但它会让设备变得不安全，因为为了实现越狱或\
  \ root，原本防止恶意活动的保护措施可能已经被删除了。\n\n## Rootkits\n\nRootkits 是最具挑战性的恶意软件类型之一，因为它们专门设计用于在不被检测的情况下维持系统上的持久性和\
  \ root 级访问权限。与其他类型的恶意软件一样，rootkits 可以利用漏洞来实现权限提升和隐蔽安装。或者，它们可能以 BIOS 或固件更新的形式呈现给系统。Rootkits\
  \ 很难被检测，因为它们有时存在于操作系统的底层（例如设备驱动程序和内核中），甚至存在于计算机硬件本身，因此系统并不一定能够报告其经历的任何修改。\n\n##\
  \ 章节回顾\n\n近期的数据泄露凸显了我们用于保护特权数据的身份验证系统中的若干弱点。随后对个人和公司数据的访问导致了破坏性和昂贵的网络犯罪。挑战在于，攻击者经常使用破解或窃取的用户凭据来获取访问——这些凭据被假设来自合法来源。仅依赖登录名和密码（或单因素身份验证）仍然是一个关键问题。人类在选择和使用密码方面表现糟糕。使用基于上下文的身份验证方法结合多因素身份验证的系统，可以针对伪装成合法用户的恶意攻击者提供增强的保护。然而，作为安全专业人员，我们在努力让安全对用户来说更易用、更透明时，必须理解使用这些系统的某些缺点。\n\
  \n### 问题\n\n**1.** 下列哪项不会是基于上下文的身份验证（context-based authentication）的考虑因素？\n\n**A.**\
  \ 用于身份验证的一次性密码使用不正确。\n**B.** 登录尝试发生在常规工作时间之外。\n**C.** 交易是从外国发起的。\n**D.** 命令本应手动输入，但发布的速度比任何人类打字都要快。\n\
  \n**2.** 为了缓解员工对身份管理可能构的安全风险，你会考虑执行以下所有操作，但除了哪？\n\n**A.** 提醒用户永远不要与任何人共享。\n**B.**\
  \ 提供有关在线身份如何被窃取的演示。\n**C.** 强制要求每月必须更改密码。\n**D.** 禁用电子邮件中的超链接。\n\n**3.** 你正在调查一起事件，财务部门的一个用户账户似乎删除了共享文件夹中的关键电子表格。每个部门都有自己的\
  \ VLAN，没有其他文件似乎受到影响。拥有该账户的员工声称自己不知道这件事。最可能的解释是什么？\n\n**A.** 财务部门的一台工作站可能发生了。\n**B.**\
  \ VLAN 没有进行恰当的分段。\n**C.** 与账户相关的角色可能不适当。\n**D.** 文件服务器可能发生了。\n\n**4.** 下列哪项是标准 Kerberos\
  \ 协议的特征？（选择两个。）\n\n**A.** 它使用非对称加密。\n**B.** 它使用对称加密进行会话安全。\n**C.** 它要求使用 `AS`、`KDC`\
  \ 和 `TGS`。\n**D.** 它要求使用 `AD`、`KDC` 和 `GTS`。\n\n**5.** 下列关于单点登录（SSO）解决方案的描述不正确？\n\
  \n**A.** 它们减少了凭据泄露的影响。\n**B.** 身份由联邦身份管理器或身份提供者（IDP）验证。\n**C.** 它们广泛使用安全标记标记语言（SAML）实现。\n\
  **D.** 它们减少了用户需要记忆的密码数量。\n\n**6.** 如果连接中使用 HTTPS，下列哪种攻击可能会在受害者的网络浏览器中触发证书警告？\n\n\
  **A.** 会话劫持\n**B.** 跨站脚本\n**C.** 中间人攻击\n**D.** SQL 注入\n\n\n\n\n\n根据以下场景和图示回答问题 7–10：\n\
  \n你正在调查一系列影响某小型企业的可能不相关的事件。有四台主机参与了这些事件，并在简化的网络拓图中所示。\n\n![Images](img/00078.jpeg)\n\
  \n#### 7. 内部服务器日志记录了从一个怀疑为攻击者的外部 IP 地址多次尝试登录域管理员账户。这些尝试最终成功了。该服务器是实现 Kerberos 协议的域控制器。下列哪项是正确的？\n\
  \n*   **A.** 域中的所有对象和主体都已被攻破。\n*   **B.** 目前目前为止，我们只知道内部服务器被攻破了。\n*   **C.** 工作站用户的任何\
  \ `TGTs` 现在都失效了。\n*   **D.** 外部服务器将不再能够响应来自工作站用户的请求。\n\n#### 8. 工作站用户获知服务器被攻破的消息，并立即更改了域账户密码。为什么这种响应是无效的？\n\
  \n*   **A.** 密码也必须在外部服务器上进行更改。\n*   **B.** 修改密码将阻止访问外部服务器。\n*   **C.** 密码并未被攻破，因此不需要更改。\n\
  *   **D.** 修改密码将更新被攻破内部服务器上的信息，而攻击者现在对该服务器拥有完全访问权限。\n\n#### 9. 外部服务器为远程用户提供虚拟专用网络（VPN）服务。在检查防火上的\
  \ `NetFlow` 数据时，你注意到从工作站到远程用户的端口 `443` 存在大流量，与远程用户到外部 Web 服务器的端口 `443` 同样的大流量相关。可能发生了什么？\n\
  \n*   **A.** 远程用户是一个攻击者，他攻破了 VPN 服务器，横移动到工作站，现在正在外泄数据。\n*   **B.** 远程用户是跨站脚本攻击的受害者。\n\
  *   **C.** 远程用户只是访问与工作站用户相同的网站，并向其上传大小相似的文件。\n*   **D.** 远程用户是一个攻击者，他攻破了 VPN 服务器现在正在进行中间人攻击。\n\
  \n#### 10. 你决定调查 VPN 服务器并通过 `SSH` 连接到它。你使用 `netstat` 检查网络连接，使用 `ps` 查看运行的进程，并使用\
  \ `search` 寻找新创建的可疑文件。你没有发现任何异常。你可以得出什么结论？\n\n*   **A.** VPN 服务器是安全的，允许远程用户再次连接。\n\
  *   **B.** 你应该寻找新账户并检查日志文件。\n*   **C.** 你无法得出任何结论，因为 rootkit 会干扰这些工具的输出。\n*   **D.**\
  \ 必须存在 rootkit，因为你知道服务器被攻破了。\n\n### 答案\n\n*   **1. A.** 一次密码不是上下文相关的，这意味着它们不属于这种身份验证方式。\n\
  *   **2. C.** 复杂的密码可以从许多方面提高安全性，但它们可能会增加身份管理的风险，因为用户可能会将密码写下来或使用其变体。\n*   **3. C.**\
  \ 给定选项中最可能的情况是该用户访问了共享文件夹并不小心删除了文件。由于只有一个文件被删除，这不太可能表明了攻破，即使 `VLANs` 实现错误，也不允许该用户账户删除文件。\n\
  *   **4. B, C.** `Kerberos` 的主要缺点是它将所有密钥集中在密钥分发中心（KDC）中。任何域密码和对密钥的更改对于现在控制服务器的攻击者都是可见。\n\
  *   **5. A.** 单点登录（SSO）的主要缺点是，凭据被攻破会影响多个系统。\n*   **6. C.** 涉及 `HTTPS` 的中间人攻击会产生证书警告，除非攻击者窃取了目标的私钥。其他攻击利用通常不会产生此类警告。\n\
  *   **7. A.** 因为 `Kerberos` 集中密钥并在整个范围内实施，由于攻击者控制了服务器，目前所有密钥都应被认为已攻破。\n*   **8.\
  \ D.** 在中间人攻击中，流量通常通过恶意主机中继到合法端点。从本地网络进行此类攻击最容易，因此最合理的结论是攻击者利用了被攻破的凭据，现在正在拦截工作站与网站之间的所有流量。\n\
  *   **10. C.** rootkit 会阻止系统工具准确报告计算机的状态。如果这些工具报告了攻破的证据，你可以得出攻击发生的结论。然而，没有发现证据并不意味着没有被攻破。\n\
  \n\n\n\n现代企业网络是极其复杂的环境，某些网络每天仅日志和事件信息就会产生数 GB 级的数据。脚本技术和早期的监控工具其效用性正在迅速结束，因为现在数据的多样性和数量已经超过了它们最初的设计范围。管理网络环境信息需要一种健全的策略和战术工具，将数据提炼为信息，转化为知识，并最终变为可操作的智慧。图\
  \ 13-1 显示了你的工具在战术层面提供的内容与你的可操作情报目标之间的关系。网络上的数据和信息源至少与网络设备数量一样多。日志数据来自网络路由器和交换机、防火墙、漏洞扫描器、IPS/IDS、统一威胁管理（UTM）系统以及移动设备管理（MDM）供应商。此外，每个节点可能通过其提供的服务提供自身的结构化或非结构化数据。安全数据分析的目标是穿透所有网络数据的噪声，产生网络活动的准确图景，并据此做出最符合组织利益的决策。\n\
  \n![Images](img/00079.jpeg)\n\n**图 13-1**   数据、信息、知识和智慧各层级之间的关系\n\n### 数据聚合与关联\n\
  \n收集正确数据以为业务决策提供信息可能会导致挫败感，特别是当数据源是异构的时候。毕竟，数据应该是安全团队的助力，而非阻碍。为了理解为什么数据组织对安全运营至关重要，我们必须记住，没有任何单一数据源能提供理解事件所需的全部信息。例如，当侦探调查犯罪案件时，他们会从各种来源获取输入，以获得尽可能完整的图景。他们收集的视频、目击证词和法医取证在物理事件的分析中都起着作用。但在侦探开始分析发生了什么之前，必须对线索进行收集、标记、排序，并以有利于分析的方式进行展示。这种实践被称为`data\
  \ aggregation`（数据聚合），它允许你的团队轻松比较相似的数据类型，无论其来源如何。此过程的第一步通常涉及`log manager`（日志管理器）从跨网络的数据源收集并归一数据。在数据合并并存储后，它们可以在时间轴上显示，以便于搜索和查看。图\
  \ 13-2 显示了一个安全信息和事件管理（SIEM）仪表板，显示了在固定时间内收集的安全事件。此特定的 SIEM 基于`Elasticsearch`、`Logstash`\
  \ 和 `Kibana`，统合称为`ELK stack`。`ELK stack` 是需要海量数据采集、日志解析引擎和搜索功能的安全分析师流行的解决方案。从原始日志总数（在本例中超过\
  \ 3000 条）中，`ELK stack` 生成了一个带有排序数据的自定义界面，并为每种类型提供了分颜色标记的图表。\n\n![Images](img/00080.jpeg)\n\
  \n**图 13-2**   SIEM 仪表板显示来自各种网络源的聚合事件数据\n\n通过这些图表，我们可以一目了然最常用的协议和流量最大的客户端。异常活动也非常容易识别。看看图\
  \ 13-3 所示的“热门目标端口”图表。在仅几分钟的时间范围内，是否有充分的理由说明一个客户端尝试通过这么多端口访问另一个客户端？在不深入研究原始数据的情况下，你可以看到这里几乎肯定正在发生扫描活动。\n\
  \n![Images](img/00081.jpeg)\n\n**图 13-3**   SIEM 仪表板图表显示收集流量数据的所有目标端口\n\n许多 SIEM\
  \ 解决方案提供了编写`correlation`（关联）规则的能力，从跨源的观测模式中得出更有意义的信息。例如，如果你观察到指向 `UDP` 或 `TCP` 端口\
  \ `53` 的流量并未指向批准的 DNS 服务器，这可能是网络中存在流氓 DNS 服务器的证据。你正在从两个或多个源获取观察结果，为进一步调查哪些活动的决策提供依据。\n\
  \n### 趋势分析\n\n与第 6 章讨论的漏洞扫描器一样，许多安全分析工具提供了内置的趋势分析功能。确定网络随时间变化的状况对于评估应对措施和补偿控制是否有效非常重要。许多\
  \ SIEM 可以以时间序列显示源数据，这是按时间顺序绘制数据点的方法。以连续的方式索引这些点使得检测异常容易得多，因为你可以粗略地比较任何单点与其他所有值。有了足够的基准，很容易发现新事件和异常的下载活动。\n\
  \n我们在第 2 章中介绍了趋势分析，并讨论了趋势可以是内部的、时间上的或空间上的（等）。那时，我们关注的是它在威胁管理背景下的应用。在这里，我们将其应用于确定架构内部正确的控制措施，以减轻这些威胁。然而，两种情况的目标保持不变：我们想要回答这个问题：“鉴于我们过去看到的，我们预计未来会看到什么？”当我们谈论趋势分析时，通常感兴趣的是预测性分析。\n\
  \n### 历史分析\n\n趋势分析倾向于展望未来，而历史分析侧重于过去。它可以帮助回答许多问题，包括“我们以前见过这个吗？”以及“该主机的正常行为是什么？”这种分析提供了一个参考点（或一条线或曲线），我们可以据此比较数据点。\n\
  \n历史数据分析是在给定期间观察网络行为的实践。其目标是通过根据观察到的趋势实施更改来完善网络基准。通过对攻击者过去行为的详细检查，分析师可以获得对攻击者技术、战术和程序（TTP）的视角，为防御措施提供决策。在此过程中获得的信息可能在制定可靠的防御计划、提高网络效率以及主动阻止对抗行为方面证明有用。虽然拥有庞大的数据集来构建预测模型是有用的，但这种方法有一个固有的缺陷：人类的不可预测性。模型不是肯定的，因为预测未来是不可能的。使用根据过去表现收集的信息意味着一个巨大的假设，即行为将以类似的方式继续。因此，安全分析师在使用历史数据预测攻击者行为时，必须考虑当前的背景。一个简单显而易见的例子是，攻击者使用某种技术取得了巨大成功，直到开发出相应的应对措施。在此之前，模型是高度准确的，但随着漏洞被发现并修补，攻击者可能会转向新事物，使你的模型实用性大打折扣。\n\
  \n![Images](img/00005.jpeg)\n\n**考试提示**   趋势分析和历史分析之间的区别很小；大多数从业人员互换使用这两个术语。就 CSA+\
  \ 考试而言，趋势分析有助于预测未来事件，而历史分析有助于将新的观测结果与过去的结果进行比较。\n\n\n\n\n尽管人们倾向于相信机器可以完成一切，但根结底，安全团队的成功取决于其人类分析师能多好地拼凑出事件的始末经过。自动化安全数据分析可能会处理大部分噪声，但真正的价值是由分析师创造的。让我们回顾之前的网络扫描示例，以探索分析师如何快速拼凑出可疑事件期间发生了什么。图\
  \ 13-4 列出了用于前一个图表中使用的离散数据点的详细列表。我们可以看到，在不到一秒的时间，IP 地址为 `4.4.4.12` 的设备向不同端口的两个设备发送了大量探测流量，这表明存在网络扫描。\n\
  \n![Images](img/00082.jpeg)\n\n**图 13-4** 网络扫描期间源自单个主机的所有流量的 SIEM 列表视图\n\n除了源、目的地和端口信息外，该系统中的每次交换都分配了一个唯一标识符。几分钟后扫描完成后，我们可以看到位于\
  \ `4.4.4.12` 的设备通过端口 `80` 与 IP 地址为 `4.4.4.15` 的设备建立了多个连接，如图 13-5 所示。可以假设这是标准的 HTTP\
  \ 流量可能是安全的，但如果我们能查看一下就太好了。攻击者利用常用端口来隐藏其流量并非未罕事。\n\n![Images](img/00083.jpeg)\n\n\
  **图 13-5** 扫描完成后 `4.4.4.12` 与 `4.4.4.15` 之间 HTTP 交换的列表\n\n此 SIEM 允许我们通过直接链接到交换的数据包捕获，获取更多关于期间发生情况的信息。该系列中第一次交换的捕获显示了对\
  \ HTML 页面的成功请求。当我们查看图 13-6 中的细节时，它似乎是一个管理门户的登录页面。\n\n![Images](img/00084.jpeg)\n\
  \n**图 13-6** `4.4.4.12` 与 `4.4.4.15` 之间首次 HTTP 交换的数据包捕获细节\n\n查看图 13-7 中的紧下一个捕获，我们看到了使用\
  \ SQL 注入绕过登录的证据。攻击者输入的用户名为 `Administrator’ or 1=1 #`，由 `uname` 字段中的文本所示。当用户输入用户名密码时，会根据用户的输入创建一个\
  \ SQL 查询。在这次注入中，用户名填充了一个字符串，当它被放入 SQL 查询时，会形成一个服务器将执行的备选 SQL 语句。SQL 服务器将其解释如下：\n\
  \n![Images](img/00085.jpeg)\n\n**图 13-7** `4.4.4.12` 与 `4.4.4.15` 之间第二次 HTTP 交换的数据包捕获细节，显示了\
  \ SQL 注入证据\n\n```\nSELECT * FROM users WHERE name='Administrator' or 1=1 #'and password='boguspassword'\n\
  ```\n\n由于 `1=1` 部分将返回 `true`，服务器便不再去验证真实密码并授予用户访问权限。你可以在同一图中看到“欢迎来到基础管理 Web 控制台”的注释，表明攻击者已获得访问。\n\
  \n请注意，仅仅因为攻击者现在有了访问 Web 服务器受保护区域的权限并不意味着他拥有网络的完全权限。尽管如此，这种行为显然是恶意的，并且是一个应该追踪到底的线索。在接下来的子节中，我们将讨论如何将刚才使用\
  \ SIEM 和数据包捕获进行的人工审查方法扩展到其他信息源。\n\n![Images](img/00009.jpeg)\n\n**注意** 软件定义网络 (SDN)\
  \ 解决了几个让关联分析变得如此困难的挑战。由于网络是集中控制以优化性能的，SDN 提供也是进行数据收集的理想场所。这减少了对每个设备执行收集、格式化和规范化任务的需求。相反，任务可以在整个网络中执行一次。\n\
  \n### 防火墙日志\n\n几十年来，防火墙一直是各种大小网络的主要边界防御机制。在下一代安全设备和高级终端保护时代之前，防火墙日志通常是获取网络上恶意活动信息的主要来源。图\
  \ 13-8 是来自简单防火墙 (`ufw`) 的日志数据片段，它是 Ubuntu 操作系统的默认 `iptables` 防火墙配置工具。注意针对 `4.4.4.12`\
  \ 的一系列 `block` 动作。\n\n![Images](img/00086.jpeg)\n\n**图 13-8** Linux 防火墙日志中的条目，显示一系列被拦截的流量\n\
  \n我们可以在每个条目中看到有关操作的相关细节列表，包括时间、源 IP 和端口号。当我们把这些数据与图 13-3 中提供的信息进行比较时，我们可以看到视觉化呈现可能更吸引分析师，特别是在处理海量流量时。\n\
  \n### Syslog\n\nSyslog 是在加州大学伯克利分校开发的一种消息协议，用于标准化系统事件报告。Syslog 已成为操作系统使用的标准报告系统，包含了与安全、应用程序和操作系统相关的警报。UNIX\
  \ 和 Linux 环境中的本地 syslog 进程（ syslog syslog）收集设备生成的消息并将其存储在本地文件系统中。这包含了路由器、交换机和防火墙中的嵌入式系统，它们使用\
  \ UNIX 的变体。然而，Windows 环境中没有预装的 syslog 代理。Syslog 是汇总单机日志数据的极佳方法，但日志文件也可以发送到集中服务器进行聚合和分析。图\
  \ 13-9 显示了 syslog 层级结构的典型结构。\n\n![Images](img/00087.jpeg)\n\n**图 13-9** Syslog 消息的典型层级结构\n\
  \nsyslog 服务器将收集通过 UDP 端口 `514`（如果需要保证消息交付，则通过 TCP 端口 `514`）发送的 syslog 数据。聚合 syslog\
  \ 数据的分析对于安全审计至关重要，因为攻击者在系统上进行的活动定会被 syslog 工具报告。这些线索可以用于重建现场并对系统进行补救措施。每个 syslog\
  \ 消息都包含一个设施代码和一个严重性级别。设施代码提供了有关消息源地的信息，而严重性代码指示了与消息关联的严重程度。表 13-1 是 RFC 5424 定义的严重性代码列表。\n\
  \n![Images](img/00088.jpeg)\n\n**表 13-1** Syslog 严重性代码、关键字和描述\n\n**注意** 用于事件消息的\
  \ syslog 协议并没有规定消息具体如何格式化。因此，来自不同设备的消息呈现给 syslog 服务器的方式上存在细微差异。协议仅提供了一种从客户端到服务器的标准传输方式。\n\
  \n#### 身份验证日志\n\n\n\n\n\n# 登录事件的审计与分析对于成功的事件调查至关重要。所有现代操作系统都有记录成功和失败尝试的方法。图 13-10\
  \ 显示了 `auth.log` 文件的内容，指示了 Linux 服务器上所有启用的日志活动。虽然关注失败的尝试可能很有吸引力，但你也应该关注成功的登录，特别是与那些失败尝试相关的登录。从\
  \ `4.4.4.12` 登录的人是前几次犯错的管理员的可能性是合理的。然而，当你将此信息与该设备最近执行过可疑网络扫描这一相结合时，这是一个无意失误的可能性就会大幅下降。\n\
  \n![Images](img/00089.jpeg)\n\n***\n\n**图 13-10** Linux 系统 `auth.log` 条目的快照\n\n\
  ***\n\n![Images](img/00005.jpeg)\n\n**考试提示** 在处理日志时，请考虑每个设备的时区差异。有些设备可能报告你所在地的时区时间，有些可能使用\
  \ GMT，而另一些可能完全偏移。\n\n## 事件日志\n\n事件日志在提供的系统及其连接组件详细信息方面与 syslogs 类似。Windows 允许管理员使用名为\
  \ `Event Viewer`（事件查看器）的实用程序查看系统的所有事件日志。此功能使得浏览与系统活动相关的数千条目变得简单得多，如图 13-11 所示。它是理解\
  \ Windows 等复杂系统行为的必备工具——而且对于服务器尤为重要，因为服务器的设计并非总是通过用户界面提供反馈。\n\n![Images](img/00090.jpeg)\n\
  \n***\n\n**图 13-11** Windows 10 中的事件查看器主界面\n\n在最近的 Windows 操作系统，成功登录事件的事件 ID 为 `4624`，而登录失败事件被赋予\
  \ ID `4625`，并带有错误代码以指定失败的准确原因。在 Windows 10 的 `Event Viewer` 中，你可以使用侧边面板中的 `Filter\
  \ Current Log`（过滤当前日志）选项精确指定你想获取更多详细信息的事件类型。生成的对话框如图 13-12 所示。\n\n![Images](img/00091.jpeg)\n\
  \n***\n\n**图 13-12** 用于过滤日志信息的事件查看器提示\n\n***\n\n![Images](img/00005.jpeg)\n\n**考试提示**\
  \ Linux 操作系统和应用程序日志的默认位置是 `/var/log` 目录。在 Windows 环境中，`Event Viewer` 将允许查看事件日志。对于其他网络设备，syslog\
  \ 位置可能不同。\n\n## 深度防御\n\n分层防御的概念起源于军事，作为强制敌人在准备和进行攻击时消耗资源的方法。通过改变使用的防御系统类型并定期更改其实现方式，从业人员可以使对手维持进攻活动变得不符合成本效益。通过将资源分散在不同位置，防御者可以确保如果一种机制失效，在攻击者与其目标之间还有额外的障碍。这种作为严谨防御计划一部分的变变技术的相同概念也可以应用于数字系统。例如，你可能在网络边缘放置防火墙，在各种设备上启用\
  \ `ACLs`，使用网络分段并执行组策略。如果攻击者绕过了一个障碍，他将不得不对其他防御措施采用另一种不同的技术。在信息安全方面，仅使用技术设备层是不够的；如图\
  \ 13-13 所示，我们必须结合流程、人员和技术来实现深度防御的原始意图。深度防御作为物理和网络防御的多维度方法，确实存在一个重大缺陷，即它主要被用作消耗工具。作为一种策略，消耗战旨在使敌人精疲力竭，使其不再拥有继续的意愿。然而，我们如何对拥有无限意志力的敌人呢？如果有足够的时间，敌人可能会发现绕过我们在网络上设置的安全措施的方法。因此，确保深度防御绝不静态方式采用是非常关重要的：它必须不断地重新评估、更新，并与其他最佳实践一起使用。\n\
  \n![Images](img/00092.jpeg)\n\n***\n\n**图 13-13** 人员、流程和技术提供了深度防御\n\n***\n\n## 反击\n\
  \n物理世界中良好的深度防御的一个次要影响是，它往往会让攻击者容易受到反击，因为敌人的资源已经耗尽。虽然在物理战争行动中有经过研究的法律和原则涵盖了这一概念，但在网络空间进行反击的概念在法律上是令人困惑的。此外，考虑到世界如此互联，确定某些进攻行动的真实范围具有挑战性。我们如何确保通过我们内部开发的响应来应对攻击，而不会干扰他人的网络，或跨越国际边界呢？遗憾的是，法律和政策尚未完全跟上技术上的能力——这些讨论（和争论）持续到了今天。\n\
  \n***\n\n### 人员\n\n人力资本是组织最重要的资产。尽管自动化有所进步，人类仍然是公司运营的核心。在日益自动化的世界中处理人的维度是一项巨大的挑战。人类会犯错，有不同的动机，并以不同的方式学习。\n\
  \n### 培训\n\n员工培训对组织来说是一项具有挑战性的任务，因为有时被视为没有即时结果的冗余开支。因此，组织会牺牲培训预算，以支持其他与任务明显相关的其他工作。然而，节扣培训是一个致命的错误，因为员工技能过陈的组织其效率更低，且更容易出错。\n\
  \n我们将在本节涵盖安全培训的两个方面。第一个是通用安全意识培训。此类培训的重点是技术理解水平平均的普通员工。对这类用户进行正确网络行为和如何处理可疑活动的培训将大有益处。在某种程度上，他们是网络防御计划的大部分。如果他们对注意事项、预防和报告程序得到了良好培训，将为安全团队减轻巨大的负担。第二种培训是针对安全人员的培训。由于关于该领域的大许多知识正在实时产生，安全分析师将参加日常的在职培训。然而，这可能不足以应对他们可能遇到的各种挑战。。如果一个组织没有准备好培训其分析师面对这些挑战（无论是通过内部指导还是外部培训），它可能会很快遇到组织和法律问题。想象一种情况：管理层没有资助安全团队对最新类型勒索软件的培训。如果公司被入侵且所有数据被加密，责任在谁？在这种情况下，提供培训将转移与该恶意软件相关的部分甚至全部风险。\n\
  \n### 双重控制\n\n\n\n\n\n通过将任务责任分配给团队小组而非个人，组织可以减少灾难性错误或欺诈的机会。`Dual control`（双控制）是一项需要两个或多个方参与才能完成任务的实践。在计算机安全之外，这种做法的一个典型例子是舰只和潜艇的导弹发射过程。在某些船只上（特别是携带核弹头的船只上上发射导弹需要两名高级军官参与，并在物理隔离的位置插入特殊密钥。其目标显然是避免将此类破坏性武器的巨大力量掌握在个人手中。情况下，拆分执行任务的责任有助于防止意外发射，因为两个人必须协同行动。此外，由于密钥必须在不同区域启用，这使得一个拥有两个密钥的个人无法独自开启系统。\n\
  \n这一原则在网络安全中的实施可以是对敏感账户的访问控制，该账户受密码和硬件令牌双重身份验证的保护。授权用户各拥有一个只有自己知道的唯一密码。然而，登录时，他们必须输入`username`和`password`，然后致电操作中心获取硬件令牌的代码。\n\
  \n### 职责分离\n\n限制用户对敏感流程产生不利影响的另一种有效方法是`separation of duties`（职责分离）实践。这种做法也被称为`segregation\
  \ of duties`（职能分工），它将关键功能的下属任务放在分散的控制之下。这类似于双控制，主要区别在于参与方被赋予了完全不同的任务，这些任务共同朝着更大的目标工作。在安全方面，`separation\
  \ of duties`可能用于防止任何个人扰乱关键业务流程、访问敏感数据或在整个组织范围内进行未经测试的管理更改。例如，你的组织可以将删除敏感数据的需求拆分为几个步骤：验证、执行和批准。通过将每个任务分配给不同的人，你可以确保没有人能独自完成删除任务。理想情况下，参与执行任务的双方不属于同一个小组。通过向不属于同一小组的个人授予访问权限，团队可以减少利益冲突或更糟糕的——共谋的可能性。如果攻击者攻破了账户并尝试使用这些凭据，`separation\
  \ of duties`策略将阻止访问，因为访问时只能满足一个条件。职责分离也通适用于你团队的报告结构。例如，安全团队的审计员不应向生产团队的成员汇报。想象一下，作为一名初级分析师，你必须向管理这些系统的老板汇报生产系统的问题，那将是多么尴尬的境地。\n\
  \n![Images](img/00009.jpeg)\n\n**NOTE** 在较小的组织中，由于缺乏可用人员，可能很难分离职责。使用定期检查和审计等额外的补偿控制措施是缓解这些环境中固有风险的一种方法。\n\
  \n### 第三方与顾问\n\n聘外部顾问是因为他们在某一领域具有专业知识并提供帮助。在实践中，他们的行为通常与正式员工非常相似，尽管由于时间限制，他们可能没有经过相同水平的审查。为了提高效果和效率，他们通常与现有团队紧密整合。由于顾问无疑会接触到公司的机密或专有信息，组织必须将此相关的风险作为整体补偿控制策略的一部分进行权衡。该策略必须包括非泄露协议（NDA）、在公司网络上使用外部设备的明确定义政策，以及对承包商责任和预期的全面描述。\n\
  \n### 交叉培训\n\n组织可以选择轮换分配到某些工作的员工，使他们接触新环境，并为他们在组织流程中的角色提供更多的额外背景知识。`Cross-training`（交叉培训）不仅是提供培训的一种成本效益的方法，而且是确保在主要人员缺席时有备份人员可用的方法。交叉培训对技术培训有显而易见的益处，但在提高技能之外还有额外收益。它通过为团队成员提供互补的机会有助于团队发展，并让每个成员对公司的其他角色有更好的了解。\n\
  \n### 职责轮换\n\n职责分离强制多个人参与执行关键任务，而`rotation of duties`（职责轮换）是定期更改员工分配工作的实践。这进一步减少了共谋或任何规避职责分离所提供保护的尝试。工作轮换对于减少不诚实行为的影响非常有用，因为它迫使组织关注角色而非个人。例如，如果一个员工负责所有与购买相关的所有职责，那么该员工通过未经授权的购买或挪用公款的机会远高于该角色在整个组织内定期重新分配。\n\
  \n### 强制休假\n\n考虑到每天处理敏感数据和流程带来的压力，指导团队成员定期休至少一周的假是一个好主意。这在安全方面有两个目的。首先，通过临时将个人从职位上移除，可以让可能被隐藏的问题暴露出来。此外，由于工人长时间处于高压力职位，职业倦怠和大意的概率会增加。因此，强制休假有助于防止错误的发生，并使员工对社会工程攻击具有更强的韧性。为了连续性考虑，将强制休假与职责轮换和交叉培训相结合是一种良好的做法。\n\
  \n### 继任计划\n\n\n\n\n\n尽管公司希望永远留住最优秀、最出众的人才，但人们在某些时刻离开是现实。为这种离职制定计划是任何成熟组织连续性流程中不可或缺的一部分。在军队中，继任计划是一个被广泛理解并实践的概念。服役过程中固有的风险，加上正常的派遣安排，意味着部队必须以未来时态进行思考，并致力于实现当今任务的成功。与我们的武装力量一样，你组织中的继任计划意味着将职责有序地交给指定的人员。理想情况下，这个人是预先选定的，并在新岗位上做好了准备，使扰动降至最低，但情况并非总是如此。你还必须意识到继任计划与培训之间自然的张力。组织必须在通过培训关怀当前员工之间取得平衡，但不能投入过多以至于忽视了对未来力量的准备。为了防止这种情况，组织及其下属团队应当专注于实现战略目标所必需的任务。继任计划中的一个务实步骤包括创建一个“剧本”（playbook）或“连续性书籍”，以便在交接过程中进行传递。该手册应包含团队流程的描述和技术步骤，且其编写方式应让团队成员能够拿起它并以最小的延迟继续操作。事实上，测试继任计划实用价值的一种有效方法是在职位轮换期间或任何上述涉及从主要员工手中接手的实践中。\n\
  \n### 流程\n\n填补组织中员工与技术工具之间差距的就是流程。网络安全计划的这一关键部分需要经过深思熟虑，并包含所有用户清晰的策略和程序。我们在第 11\
  \ 章中讨论如 `ISO/IEC 27000`、`COBIT` 和 `ITIL` 等框架时，涵盖了其中的一些概念，这些框架确保组织遵循最佳实践，并定期审查和改进其安全态势。流程至少应每年审查一次，并需要反映当前的技术趋势。此外，这些流程需要以保持灵活性的方式进行构建，以应对不断变化的威胁。\n\
  \n## 持续改进\n\n尽管流程的设计是消除歧义的（特别是在关于网络上的适当行为以及违反策略的后果方面），但它们应该保持为“活”的状态，并根据需要进行改进。我们的人员和技术经常变化这并不意外。对我们系统的威胁变化得更快。这种不断变化的环境要求我们不断检查自己的流程并寻找改进的机会。这种受管理的优化是成熟组织的标志。\n\
  \n这种改进过程需要变更，且这些变更必须经过仔细管理。大多数组织实施变更控制流程，以确保对人员、流程或技术的更改是经过深思熟虑的。对安全流程的所有变更，无论是技术上的、人员上的还是策略上的，都应经过审查和更新，以反映当前的威胁。\n\
  \n### 变更控制流程\n\n应该建立一个良好的变更管理流程，以帮助员工应对环境的许多不同类型的变更。该流程应在变更控制策略中列出。尽管变更类型各异，但标准的程序列表可以帮助保持流程受控，并确保其以可预测的方式执行。以下步骤是任何变更控制策略应包含的程序示例：\n\
  \n1. 请求进行变更\n2. 批准变更\n3. 记录变更\n4. 测试与认证\n5. 实施\n6. 向管理层报告最终的变更\n\n## 定期审查\n\n组织应该计划对其安全策略进行定期审查，以跟上所面临的威胁，并验证现有的安全策略是否有效。与软件供应商一样，应根据需要对策略进行更新，以保持强大的安全态势，并与任何新的业务目标保持一致。在受监管环境中，这些审查通常是保持合规所要求的。在所有组织中，它们都需要高层的关注，并且对于防止安全态势的破坏至关重要。\n\
  \n## 流程的淘汰\n\n改进的自然部分是流程的淘汰。无论是该流程不再适用、开发了新流程，还是该流程不再符合组织的业务目标，都必须有一个正式机制将其移除。流程的淘汰与之前描述的变更控制流程类似。相关利益者和公司领导将审查相关流程，进行调整，并向组织明确传达替换策略。对于对于对于内执行任务的人来说，不要继续使用旧版本。\n\
  \n## 技术\n\n你组织的网络安全计划没有技术是不存在的。虽然技术与人员和流程同样重要，但技术的运行速度完全不同。技术最好用于执行人类不擅长的重复性任务，例如执行策略、监控流量、对违规行为报警以及防止数据离开网络。技术解决方案还可以作为补偿控制，在某些时候可以减少人为错误带来的风险。但人员、流程与技术之间的支持关系也是双向的。随着恶意软件演变以规避下一代安全设备，正是支持技术的人员和流程共同努力，防止对你的组织造成灾难性的损害。\n\
  \n## 自动化报告\n\n技术通常最适用于对准确性要求较高的重复性任务。在利用本章前面描述的任何安全数据分析技术快速执行收集和分析后，安全设备可以根据安全团队的规范和偏好发送通知。自动化报告功能存在大多数安全产品中，包括安全设备和安全套件。你应该花些时间确定你具体想报告的内容，因为来自安全设备的持续告警可能会导致“警报疲劳”。\n\
  \n### 安全设备\n\n安全设备执行传统上分布在多个硬件设备上的功能。如今，安全设备可以充防火墙、内容过滤器、`IDS/IPS` 和负载均衡器。由于这些设备提供了多种网络和安全功能（可能取代现有设备），它们的界面通常通过中央管理控制台实现功能之间的无缝集成。图\
  \ 13-14 是安全设备供应商提供的集成仪表板示例。\n\n![Images](img/00093.jpeg)\n\n**图 13-14** 安全设备的示例仪表板\n\
  \n注意，它提供了组织流量、异常、使用情况的概述，以及关于客户端和应用程序行为的详细额外部分。该设备还提供一个独立的安全特定告警和设置区域，如图 13-15 所示。\n\
  \n![Images](img/00094.jpeg)\n\n**图 13-15** 组织网络安全事件概述\n\n\n\n\n\n除了提供与事件相关的源、目的和频率的一般信息外，安全设备会自动创建数据包捕获。图\
  \ 13-16 显示了使用此设备的数据包捕获功能提供的细节。\n\n![Images](img/00095.jpeg)\n\n**图 13-16** 安全设备提供的包检查屏幕\n\
  \n分析师可以查看这些信息，并在发生误报时做出升级处理或细化规则的决策。此外，这些屏幕上发现的任何数据都可以根据计划通过电子邮件发送。\n\n## 安全套件\n\
  \n安全套件是一类提供多种安全和管理相关职的软件。大多数安全套件都包含了端点扫描与保护、移动设备管理（MDM）以及钓鱼检测。安全套件也被称为`多层安全`，它们通常依赖庞大的威胁数据数据库，以对网络威胁提供最新的检测和保护。\n\
  \n## 外包\n外包带来了多项挑战，你作为安全分析师必须熟悉这些挑战。因为你将网络安全托付给了第三方，所以你应该采取以下几个步骤来保护公司的网络和数据：\n\n\
  - **访问控制**：通过公司接口对你的访问应该经过高度且彻底的检查，因为对这些接口的外部访问可能意味着对你自身的访问。\n- **承包商审查**：公司及其员工都应该接受严格的审查标准。毕竟，你可能正在将组织的命运托付给他们。应该进行并核实背景检查。应尽一切确保公司的内部流程与你自己的流程保持一致。\n\
  - **事件处理与报告**：你应该理解并同意处理事件的最佳程序。任何法律责任都应明确向公司传达，特别是当你在监管环境中运营时。\n\n## 安全即服务\n看来，安全加入到以“即服务”的形式提供给企业的技术功能趋势只是时间问题了。安全即服务（SECaaS）是一种日益增长的现象，安全公司作为订阅模式的一部分，担任安全相关服务的服务提供者。这使得订阅业务的企业可以减少对现场安全基础设施的投入，同时获得最新的保护和安全专业知识。\n\
  \n## 密码学\n密码学原理是我们网络网络中发现的许多安全控制的基础。例如，加密哈希函数为我们维护完整性提供了方法。它们为我们的数据提供了虚拟的防篡封。同样，数字签名为我们提供了验证消息来源的方法，通常使用公钥基础设施（PKI）。或许最为人知的原理——加密，提供了我们数据的机密性。根据你组织运营的领域，加密的使用可能是强制性的。监管要求如《健康保险可流动性与责任法案》（HIPAA）、支付卡行业（PCI）和《萨班斯-奥克斯尔法案》（SOX）迫使组织在处理敏感数据时使用加密。\n\
  \n## 其他安全概念\n你组织的安全策略既要足够强大以应对已知威胁，又要足够敏捷以适应新兴危险。用于对抗对手行动的技术会随着时间的推移而失效，或者该威胁可能不再相关。在多层防御方法中加入合理的网络防御计划将显著提高你的防御态势。\n\
  \n## 网络设计\n云服务、基础设施即服务（IaaS）、SECaaS 和 BYOD（自带设备）实践意味着，边界已不再足以以作为你主要的防御装置。事实上，如果你的组织使用订阅服务，那么大部分技术基础设施可能对你隐藏。这意味着网络安全中的人员和流程方面对于你的公司留住数据变得至关重要。\n\
  \n## 网络分段\n分段不仅通过减少路由器和交换机的工作负载来提高网络效率，还通过根据使用和访问进行划分来提高安全性。对于某些组织来说，网络分段将允许他们遵守有关敏感数据的法律规定。\n\
  \n## 章节回顾\n作为安全分析师，我们无法控制攻击背后的人员、他们攻击的频率，或者他们选择如何进行，但我们可以为自己的团队提供必要的工具，在这些事件期间保持安全。通过人员、流程和技术的结合——它们相互依赖并支持——我们可以抵消当今环境中固有且不断增加的风险。在过去，我们主要关注技术作为赋能者。然而，这就像一支只关注进攻的体育队。安全需要一种全面的方法，包括管理我们的技术、理解它如何与我们的业务流程对齐，并为组织中的人员提供成功的工具。人员、流程和技术都是处理风险不可或缺的一部分。\n\
  \n### 问题\n*使用以下场景回答问题 1–3：*\n\n你注意到从网络中的一个主机到外部主机的有大量的流量。你没有发现任何相关的恶意软件警报，且远程主机在你的威胁情报报告中没有显示为疑似恶意\
  \ IP 地址。源主机是一个某员工的 Windows 工作站，该员工上周与经理发生过冲突。\n\n1. 你不确定这是否可疑。你如何最好地判断这种行为是否正常？\n\
  - **A.** 手动检查 `syslog` 文件\n- **B.** 历史分析\n- **C.** 包分析\n- **D.** 启发式分析\n\n2. 你决定对日志文件进行手动检查。以下数据源中*最不可能*有用的是？\n\
  - **A.** 防火墙日志\n- **B.** 安全日志\n- **C.** 应用日志\n- **D.** Syslog 日志\n\n3. 以下哪些人员安全实践可能有助于判断该员工是否为内部威胁？\n\
  - **A.** 安全意识培训\n- **B.** 职责分离\n- **C.** 强制休假\n- **D.** 继任计划\n\n4. 你的组织要求新用户账户必须由人力资源人员启动，并由\
  \ IT 运营人员激活。这两组人中的任何一方都不能执行对方的角色。没有员工属于这两个小组，因此没有人可以自己创建账户。这是哪种安全原则的示例？\n- **A.**\
  \ 双控制\n- **B.** 职责分离\n- **C.** 继任\n- **D.** 交叉培训\n\n5. 你的组织根据双锁规则存储数字证据，持有证物室钥匙的人不能持有储物柜的钥匙。每位首席调查员都会获得一个带钥匙的储物柜，但只有在证据保管打开证物室门后，他们才能进入房间。这是哪种安全原则的示例？\n\
  - **A.** 双控制\n- **B.** 职责分离\n- **C.** 继任\n- **D.** 交叉培训\n\n\n\n\n\n### 6. `ch13qus_6`\
  \ 贵组织有一套定期检查资产、威胁和控制，并对人员配置、流程和/或技术进行更改以优化安全态的流程。这是哪种流程？\n\n**A.** 继任计划\n\n**B.**\
  \ 趋势分析\n\n**C.** 安全即服务 (Security as a service)\n\n**D.** 持续改进\n\n*参考以下插图和场景回答问题\
  \ 7–9：*\n\n你注意到指向 DMZ 区中一个备份 DNS 服务器的流量异常。你检查了日志文件，并看到了此处所示的结果。你所有的内部地址都位于 `10.0.0.0/8`\
  \ 网络，而你的 DMZ 地址位于 `172.16.0.0/12` 网络。现在时间是 4 月 6 日下午 3:20（本地时间）。\n\n![Images](img/00096.jpeg)\n\
  \n### 7. `ch13qus_7` 日志文件指示了什么？\n\n**A.** 对 SSH 服务使用了暴力破解密码生成器\n\n**B.** 需要针对记忆密码进行额外的用户培训\n\
  \n**C.** 针对 SSH 服务的手动密码猜解攻击\n\n**D.** 从内部主机向 SSH 服务进行枢点攻击（Pivoting）\n\n### 8. `ch13qus_8`\
  \ 针对此事件，你最佳的应急响应是什么？\n\n**A.** 实现 ACL 以拦截来自 `192.168.192.6` 的入站流量。\n\n**B.** 在边界路由器上断开连接，并对服务器进行取证分析，以确定受损范围。\n\
  \n**C.** 开始对 `192.168.192.6` 与服务器之间的所有流量进行全包捕获。\n\n**D.** 在边界路由器上断开连接并将服务器放入隔离 VLAN。\n\
  \n### 9. `ch13qus_9` 你如何改进安全流程，以防止此类攻击在未来生效？\n\n**A.** 封禁来自 `192.168.192.6` 的流量。\n\
  \n**B.** 改进终端用户密码安全培训。\n\n**C.** 实现自动化日志聚合和报告。\n\n**D.** 禁止到 SSH 服务的外部连接。\n\n*使用以下场景回答问题\
  \ 10–11：*\n\n你被聘为一家中型企业的安全顾问，该公司正受于日益增加的网络攻击成本的困扰。钓鱼攻击导致的安全事件数量呈上升趋势，这给公司人手不足的安全运营团队带来了更大的压力。该团队已无法同时兼顾事件响应和大量的流程，而且大多数流程根本没有被遵守执行。安全部门的人员流失正成为一个严重的问题。CEO\
  \ 想要停止或扭转感染趋势，并将安全成本控制在合理范围内。\n\n### 10. `ch13qus_10` 你推荐采用什么方法来快速降低受攻击率？\n\n**A.**\
  \ 趋势分析\n\n**B.** 自动化报告\n\n**C.** 安全即服务 (Security as a service)\n\n**D.** 安全意识培训\n\
  \n### 11. `ch13qus_11` 你如何应对团队工作过度的挑战？（选择两项）\n\n**A.** 交叉培训\n\n**B.** 外包功能\n\n**C.**\
  \ 废除流程\n\n**D.** 强制假期\n\n### 答案\n\n**1.** `B`\n**2.** `D`\n**3.** `C`\n**4.** `B`\n\
  **5.** `A`\n**6.** `D`\n**7.** `A`\n**8.** `D`\n**9.** `D`\n**10.** `D`\n**11.**\
  \ `B, C`\n\n\n\n\n构建软件有许多方法，但它们都遵循某种可预测的模式，被称为`lifecycle`（生命周期）。它始于识别未满足的需求，结束于软件退役，通常是为了让新系统取代其位置。无论你使用正式方法论还是敏捷方法论，你都必须识别并跟踪用户或组织的需求；设计、构建并测试解决方案；将该解决方案部署到生产环境中；保持其运行直到不再被需要；最后在不破坏其他任何内容的情况下对其进行处理。在接下来的章节中，我们将介绍该生命周期内通用的工作投入类别，尽管你的组织可能对它们有其他名称。在此过程中，我们将强调这一切如何契合\
  \ CSA+ 考试。\n\n![Images](img/00005.jpeg)\n\n**考试提示** 你不需要背记软件开发生命周期的各个阶段，但你需要知道安全分析师会在该生命周期的不同阶段为开发工作做出贡献。\n\
  \n## DevOps 和 DevSecOps\n\n从历史上来看，软件开发和质量保证团队会合作，但与 IT 运营团队彼此孤立，而后者最终必须处理最终产品。许多问题源于开发过程中这两个团队之间协作不佳。IT\
  \ 团队指责开发人员并不罕见，因为某个功能的发布导致该小组不得不加班、在周末工作，或者简单地放下手头正在做的事情去“修复”开发人员“弄坏”的东西。考虑到每个团队的激励结果是不同的，这种摩擦就非常合情合理。开发者想要推出完成的代码，且通常在严格的时间表下进行。另一方面，IT\
  \ 人员希望保持 IT 基础设施的有效运行。解决这种摩擦的一种良好方法是让开发人员和运营人员（因此有了 DevOps 术语）在整个软件开发过程中共同工作。`DevOps`\
  \ 是将开发、IT 和质量保证（QA）人员整合到软件开发项目的实践，以使他们的激励保持一致，并实现软件产品频繁、高效且可靠的发布。最近，安全团队也被包含在这个多功能团队中，导致了\
  \ `DevSecOps` 术语日益增加使用，如图所示。\n\n![Images](img/00097.jpeg)\n\n## 需求\n\n所有的软件开发都应该从识别最终产品必须满足的需求开始。即使这些需求没有明确地列在正式文档中，它们在编写第一行代码之前就已经存在于某处。通常来说，需求分为两类：描述软件必须“做什么”的功能性需求，以及描述软件必须“如何”完成这些事，或者软件必须具备什么特性的非功能性需求。如果听任其发展，许多软件开发者会将注意力集中在功能上，并且非常不情愿（如果愿意的话）关注其他部分。\n\
  \n### 功能性需求\n\n`functional requirement`（功能性需求）根据输入、处理和输出定义系统的功能。例如，软件系统可能会接收来自温度传感器的遥测数据，将其与该传感器的其他数据进行比较，并显示显示当天数值如何变化的图表。这种需求不受任何特定约束或限制，而那是非功能性需求的作用。\n\
  \n### 非功能性需求\n\n`nonfunctional requirement`（非功能性需求）定义系统的特性、约束或限制。非功能性需求是软件系统架构设计的主要输入。延续上述的温度场景，非功能性需求的一个例子是系统必须对华氏度十分之一度及以上的温度差保持灵敏。非功能性需求有时被称为\
  \ `quality requirements`（质量需求）。\n\n### 安全需求\n\n我们最感兴趣的需求类别是处理安全的那些。`security requirement`（安全需求）定义了系统为了自身以及在与其他系统交互时，达到并维持可接受的安全水平而必须具备的行为和特性。因此，这类需求包含了最终产品的功能性和非功能性方面。\n\
  \n## 开发\n\n一旦识别了所有需求，开发团队就会开始开发或构建软件系统。此阶段的第一步是设计一个满足非功能性需求的架构。请记住，这些是描述系统特性的需求。在架构的基础上，满足系统功能的详细代码模块被设计出来。在架构设计之后，软件工程师开始编写、集成和测试代码。在开发阶段结束时，系统已通过所有单元测试、集成测试和系统测试，准备就。\n\
  \n## 实现\n\n实现阶段通常是开发和运营团队之间的摩擦开始变成实际问题，除非这两个小组之前已经整合。这一过渡阶段的挑战包括确保软件在目标硬件上运行正常、能够与其他系统（例如\
  \ `Active Directory`）正确集成、不会不利网络上任何其他系统的性能，以及不会损害整体系统的安全性。如果组织从一开始就使用了 DevOps 或\
  \ DevSecOps，大多数棘手问题在这个阶段已经被识别并解决了，这意味着实现变成了简单的配置和检查问题。\n\n## 用户验收\n\n每个软件系统都是为了满足一组用户的需求而构建的。因此，在用户或其代表宣布所有功能已以他们接受的方式实现之前，系统不被认为是可（或完成）。取决于所使用的开发方法论，用户验收可能发生在开发阶段之前，也可能发生在实现阶段之前。今天许多组织使用敏捷开发方法论，强调在开发过程中让用户参与。这意味着用户验收不是一个正式的事件，而是一种持续的互动。\n\
  \n\n\n\n\n事实证明，开发安全代码并没有那么困难，但确实需要大量的时间、自律和对细节的关注。这三点会为组织带来高昂的成本，这也是我们倾向于构建不安全软件的主要原因：因为第一次就做对是非常昂贵的。正如我们在对运维（O&M）的简要讨论中所看到的，这些高昂的开发成本与代码投入生产环境后进行修复和维护所产生的更高成本相比，显得微不足道。即使开发团队面临严苛的进度和成本限制，他们仍然可以采取许多步骤来构建更安全的产品。我们将这些分为两类：构建代码时采取的步骤和在测试时采取的步骤。\n\
  \n## 安全编码\n\n安全编码的核心在于减少软件产品中的漏洞数量，使其达到可以通过运行环境控制措施来缓解的程度。换句话说，安全代码很少需要发回程序员手中修复，因为任何缺陷都可以通过运行控制来补偿。事实是，除了某些极小且昂贵的系统外，不存在绝对安全代码。对于我们大多数人来说，这是一个通过结合本节讨论的某些步骤，来减少而非消除缺陷的练习。\n\
  \n## 输入验证\n\n如果开发安全软件有一条通用规则，那就是：永远不要信任用户输入的任何内容。这不仅仅是为了保护系统免受恶意攻击者的侵害，同样适用于无辜的用户错误。验证输入的最佳方法是执行上下文敏感的白名单。换句话说，考虑在从用户处获取输入的特定点，软件系统内部应该发生什么，然后只允许适当的值。例如，如果你从用户处获取信用卡号，你只允许\
  \ 16 个连续的数字字符。任何其他内容都将被拒绝。\n\n也许利用不当的用户输入验证进行对抗攻击的最著名例子之一是结构化查询注入（`SQLi`）。`SQL`\
  \ 是 IBM 开发的用于查询数据库管理系统（`DBMS`）信息的语言。因为 Web 应用的用户凭据通常存储在 `DBMS` 中，许多 Web 应用会使用 `SQL`\
  \ 来验证用户。这里展示了 `PHP` 中实现此功能的典型不安全 `SQL` 查询：\n\n![Images](img/00098.jpeg)\n\n在缺乏对用户输入任何验证的情况下，用户可以提供用户名\
  \ `attacker' or 1=1 --` 以及 `pawned`（或任何内容或为空）作为密码，这将导致以下查询字符串：\n\n![Images](img/00099.jpeg)\n\
  \n如果该 Web 应用的 `DBMS` 是 `MySQL`，该系统会将两个破折后的后的内容解释为注释，并将其忽略。这意味着密码字段中的值是无关的，因为数据库永远不会对其评估。用户名可以是任何内容（或为空），但因为逻辑条件\
  \ `1=1` 始终成立，查询将返回所有注册用户。由于用户数量大于零，攻击者将通过身份验证。\n\n显然，我们需要验证此类输入，但我们应该在客户端还是服务器端进行呢？客户端验证通常通过\
  \ `JavaScript` 实现，并嵌入到包含表单的页面代码中。这种方法的优点是错误在输入点就能被捕获，并且在所有值通过验证之前，表单不会提交到服务器。缺点是，正如我们稍后在讨论拦截代理时会看到的，客户端验证可以使用常用且易于使用的工具轻易抵消。首选的方法是在客户端进行验证以增强良性用户的体验，但在服务器端对一切进行双检，以确保防止恶意攻击者。\n\
  \n## 参数验证\n\n参数验证问题与前面提到的输入验证问题相似。参数验证是在处理应用程序接收到的值之前，验证这些值是否在定义的范围内。输入验证与参数验证之间的主要区别在于，应用程序是期望值来自用户输入，还是来自软件系统的某部分作为参数。该领域的攻击涉及操纵系统认为“值超出了用户可配置范围”的值，这主要是因为接口中没有提供执行此类操作的机制。\n\
  \n一个说明性的例子是 Web 应用中使用 `cookies`。为了提供丰富的终端用户体验，Web 应用设计人员不得不采用机制来跟踪在任何给定可能连接的成千上万种不同浏览器。`HTTP`\
  \ 协议本身并不便于管理用户连接的状态；它只是连接到服务器，获取 `HTML` 代码中请求的任何对象，然后断开连接。相反，我们采用向客户端传递 `cookie`\
  \ 的技术来帮助服务器记住有关连接状态的信息。`cookie` 不是一个程序，而是在客户端和服务器之间交换的数据，存储在客户端中，并用于跟踪它们之间交互的状态。由于访问和修改\
  \ `cookie` 通常超出了大多数用户的能力范围，某些 Web 开发人员在设计系统时并不会将其视为一种严重的威胁。然而，恶意攻击者可以利用 `cookies`\
  \ 进行会话劫持等攻击。\n\n## 静态代码分析\n\n输入验证和参数验证是两种可以通过让人员检查源代码以寻找漏洞程序来验证的实践。静态代码分析是一种旨在识别软件缺陷或违反安全策略行为的技术，通过在不执行程序的情况下检查代码来完成。\n\
  ```\n\n\n\n\n\n# 代码审查\n\n质量保证和安全编码的最佳实践之一是代码审查（Code Review），它是由代码作者以外的人员对组成软件的指令进行的系统性检查。这种方法是成熟软件开发流程的标志。事实上，在许多组织中，在其他人完成代码审查并签字通过之前，开发者不被允许推送软件模块。可以将此比为在将重要文档发送给重要人物之前对其进行校对。如果你尝试自己进行校对，可能无法像别人检查那样容易地发现所有尴尬的拼写错误和语法错误。\n\
  \n不过，代码审查远不止检查拼写错误，尽管这确实是其中的一个元素。它始于编写软件的组织所开发的编码标准。这可能是一个内部团队、外包开发人员或商业供应商。显然，对现成的商业软件进行代码审查极其罕见，除非该软件是开源的，或者你恰好是一个大型政府机构。尽管如此，每家开发公司都会有一份风格指南或文档化的编码标准，涵盖了从代码缩进到何时以及如何使用现有代码库的所有内容。因此，代码审查的初步步骤是确保作者遵循了团队的标准。除了有助于软件的可维护性外，这一步还让代码审查人员预览了后续工作量；一个粗心的程序员其代码中可能存在许多其他、更难发现的缺陷，而这些每一个缺陷都是潜在的安全漏洞。\n\
  \n# 回归测试\n\n软件几乎不是在第一次尝试时就得安全的。具有成熟开发流程的组织将采取本章讨论的步骤，在系统投入生产之前检测并修复软件缺陷和漏洞。错误不可避免会被发现并导致修复。问题在于，修复漏洞很可能在无意中破坏系统的其他功能，甚至创建出一系列新的漏洞。`regression\
  \ testing`（回归测试）是一种正式过程，通过对修改过的代码进行测试，以确保没有任何功能和安全特征受到修改的影响。显然，回归测试的有效性取决于为其开发的标准化测试套件。如果测试覆盖范围不足，回归测试可能无法发现在修复过程中可能引入的新缺陷。\n\
  \n# 安全测试\n\n到为止，我们关注的是通常由软件开发或质量保证团队执行的实践（包括测试）。随着项目从开发转向实施，IT 运营和安全团队通常会执行额外的安全测试，以确保新软件以及在新程序引入后整个生态系统的机密性、完整性和可用性。如果组织正在使用\
  \ `DevSecOps`，部分或大部分安全测试可以在软件开发期间进行，因为安全人员也将是该阶段的一部分。否则，开发团队将软件交给安全团队进行测试，这些人将几乎会发现缺陷，从而引发一个往复循环，这可能会延迟最终的实施。\n\
  \n### Web 应用漏洞扫描\n\nWeb 应用漏洞扫描是漏洞扫描的一种特定形式，我们这种漏洞扫描在本书的第二部分中讨论过（即第 5 章）。与我们在讨论安全编码实践时讨论的测试不同，Web\
  \ 应用漏洞扫描通常是从恶意用户的角度进行的外部测试。与其他漏洞扫描器一样，这些工具只会尝试识别它们拥有插件的漏洞。这里列出了一些最常见的检查项目：\n\n-\
  \ 过时的服务器组件（例如，那些可用补丁的组件）\n- 服务器配置错误\n- 用户的安全身份验证\n- 安全会话管理（例如，随机会话令牌）\n- 信息泄露（例如，过度暴露服务器信息）\n\
  - 跨站脚本 (XSS) 漏洞\n- HTTPS 使用不当（例如，允许 SSL）\n\n有许多商业和开源的 Web 应用漏洞扫描器。在本书的第 15 章中，我们介绍了最流行的工具之一，名为\
  \ `Nikto`。大多数扫描器都允许你为特定环境开发自定义测试，因此如果你有一些必须满足的独特策略或安全需求，学习如何为你喜的扫描器编写插件或测试是值得的。\n\
  \n# 拦截代理\n\n`interception proxy`（拦截代理）是一种插入在两个通信端点之间的软件工具，用于检查、修改或记录两者之间的消息。通常，拦截代理与其中一个端点（通常是客户端）位于同一个网络（甚至是同一主机）中。在安全测试中，这些代理最常用于检查\
  \ Web 应用和移动应用的安全性，因为它们允许安全测试人员检查客户端和服务器之间的每条消息。以下可以使用拦截代理进行测试的安全特征列表：\n\n ** **input\
  \ validation (输入验证)**：虽然可以通过标准用户界面测试输入验证，但通常使用一个环境进行正式（或脚本化）测试更容易，这使得使用代理更高效。\n\
  - **parameter validation (参数验证)**：通过修改用户不应获得的值（例如，隐藏的表单字段或 Cookie）或在客户端已验证的值，安全团队可以验证服务器端是否进行了验证。\n\
  - **plaintext credentials (明文凭据)**：虽然确保 Web 应用使用 HTTPS 发送凭据相对容易，但在处理移动应用时要困难得多，除非你可以拦截流量。这也可以通过数据包嗅探器完成。\n\
  - **session tokens (会话令牌)**：会话通常通过令牌跟踪，令牌是服务器分配的一个值，通常称为会话 ID。如果该值不是真正的随机，攻击者可以猜到有效的会话\
  \ ID 并用来冒充合法用户。代理有助于对会话令牌进行统计分析，以确保它们具有足够的随机性。\n\n# 模糊测试\n\n模糊测试 是一种通过向目标程序发送大量畸形、意外或随机数据来发现软件缺陷和漏洞的技术。攻击者可以操纵这些错误和缺陷将自己的代码注入系统，从而损害其安全性和稳定性。测试工具通常能够成功识别缓冲区溢出、拒绝服务\
  \ (DoS) 漏洞、注入缺陷、验证缺陷以及可能导致软件冻结、崩溃或抛出意外错误的其他活动。图 14-2 显示了一个名为 American Fuzzy Lop\
  \ (AFL) 的流行模糊测试器导致了目标应用程序崩溃。\n\n```\n![Images](img/00101.jpeg)\n```\n\n* * *\n\n\
  **图 14-2** 模糊测试器正在测试应用程序\n\n\n\n\n\n模糊器（Fuzzers）并不总是从零开始生成随机输入。众所周知，纯随机生成是测试系统的一种低效方法。相反，它们通常从一个非常接近正常的输入开始，然后进行大量细小的修改，以观察哪些修改更能有效地暴露漏洞。最终，某个输入会触发目标中的一个有趣状态，此时安全团队需要一种工具来确定漏洞所在以及如何利用该漏洞（如果存在漏洞的话）。这种观测和分析工具通常与模糊器捆在一起，因为没有其中一个，另一个几乎是毫无用处的。\n\
  \n## 压力测试\n\n另一种尝试破坏软件系统的测试类型，是通过创建系统在正常情况下不被预期会遇到的条件来实现的。`压力测试`（Stress testing）通过提出远超软件规划阈值的极端需求，来确定其健壮性。这里的重点是尝试通过创建\
  \ `DoS` 条件来破坏系统的可用性。\n\n最常见的压力测试类型是尝试给系统`过多的`某些东西（例如并发连接或数据）。在开发期间，团队会构建软件以处理特定数量的活动或数据。这种数量可能被指定为非功能性需求，也可能由团队根据经验任意决定。通常，该值是通过衡量或预测系统可能面临的最大负载来确定的。为了根据该值对系统进行压力测试，团队只需在不同条件下超过该值并观察会发生什么。进行这些测试的最常用方法是使用脚本生成数千个模拟连接，或上传极大量的数据（无论是许多大文件，还是少数几个巨型文件）。\n\
  \n并不是所有的压力测试都是为了压垮软件；也可能是让其负载过低。这种类型的压力测试为系统提供`太少`某些东西（例如网络带宽、CPU 周期或内存）。这里的想法是看系统如何处理一种被称为`资源饥饿`（resource\
  \ starvation）的威胁，在这种情况下，攻击者故意导致系统消耗资源，直到资源耗尽为止。一个健壮的系统在发生此类事件期间会优雅地降低其功能，而不会完全崩溃。资源不足测试也有助于确定系统正常性能所需的绝对最小配置。\n\
  \n* * *\n\n## 资源饥饿\n\n资源饥饿攻击试图通过耗尽信息系统运行所需的资源来破坏其可用性。这种类型攻击的三种最常见变体列于此处：\n\n- **网络带宽**：这种类型可能是最广为人知的，因为分布式拒绝服务（`DDoS`）攻击会每秒用数十亿数据包淹没目标。\n\
  - **内存**：如果系统存在内存泄漏（即最终未被系统回收的内存分配），那么耗尽系统的内存是很容易的。如果你能导致程序产生无限数量的递归过程调用，或者对在线购物车中可以添加的项目数量没有限制，这也是可能的。\n\
  - **CPU**：CPU 饥饿攻击通常更难实施，因为你需要利用系统中的某个漏洞，该漏洞会长时间占用 CPU。例如，某些非对称加密程序（如密钥对生成）是 CPU\
  \ 密集型的。如果攻击者能够导致系统生成大量的密钥对，它最终将无法执行任何其他功能。\n\n* * *\n\n## 最佳实践\n\n也许最重要的原则是质量。`质量`（Quality）可以被定义为适用性。换句话说，某物对于它旨在完成的任何事情有多好。一辆高质量的汽车适合交通。我们不需要担心它会故障、在碰撞中无法保护乘客，或者易于被小偷偷走。当我们需要去某个地方时，只需回到我们停放的地方，并指望它带我们去任何我们需要去的地方。同样，我们不需要担心高质量软件会崩溃、在意外情况下损坏我们的数据，或易于被他人破坏。遗憾的是，许多开发者在考虑质量时仍然首先（或只）考虑功能性。当我们从整体角度观察问题时，我们应该看到质量是开发安全软件时最重要的概念。\n\
  \n当然，这并不是一个新问题。安全软件开发几十年来一直是一项挑战。意料之中的是，已经有一套既定的最佳实践，可以尽可能地减少我们代码中的缺陷和漏洞。你应该熟悉一些最著名的安全编码倡导者所建议的内容，这些建议将在下介绍。\n\
  \n### 软件工程研究所\n\n位于卡内基·梅隆大学的软件工程研究所（`SEI`）是一个联邦资助的研究与开发中心，三十多年它一直专注于安全软件工程。美国国防部自\
  \ 1984 年以来一直资助 `SEI`，在很大程度上是因为他们意识到软件系统（特别是军事系统）应该以安全的方式进行构建。然而，`SEI` 的贡献远超政府范围，它被认为是通用软件工程特别是特别是安全编码的世界领先权威之一。\n\
  \n在 `SEI` 开发的产品中，有一份安全编码实践的十大列表。我们在这里简要列出这些项目。（注意，到目前为止，我们在书中已经涉及了其中的大部分甚至全部内容。）\n\
  \n1. 验证所有输入。\n2. 不要忽略编译器警告。\n3. 为了安全进行架构。\n4. 避免不必要的复杂性。\n5. 默认拒绝。\n6. 使用最小权限原则。\n\
  7. 不要共享不需要共享的数据。\n8. 深度防御。\n9. 追求质量。\n10. 使用安全编码标准。\n\n`SEI` 的另一个贡献是开发了能力成熟度模型集成（`CMMI`），我们在第\
  \ 11 章\n\n\n\n\n\n**考试提示** 你不需要背诵 `CMMI` 的扩展项 `CMMI-DEV` 或 `Security by Design`。我们讨论它们是为了让你更好地理解\
  \ `CMMI` 如何应用于网络安全。然而，你应当理解 `CMMI` 的五个成熟度等级，这些内容在第 11 章中。\n\n## OWASP\n\n开放 Web\
  \ 应用安全项目（``OWASP`）是一个专门处理网络安全问题的组织。除了提供长系列开发者可以遵循以创建安全软件的工具、文章和资源外，它在世界范围内设有个人成员会议（分会）。该小组提供开发指南、测试程序和代码审查步骤，但它最广可能是因其维护的十大\
  \ Web 应用安全风险列表而闻名。在本书编写时，该小组识别出的顶级风险如下：\n\n* A1: 注入\n* A2: 破坏的身份验证和会话管理\n* A3: 跨站脚本\
  \ (XSS)\n* A4: 不安全的直接对象引用\n* A5: 安全配置错误\n* A6: 敏感数据泄露\n* A7: 功能级访问控制\n* A8: 跨站请求伪造\
  \ (CSRF)\n* A9: 使用已知漏洞的组件\n* A10: 未验证的重定向和转发\n\n此列表代表了基于 Web 软件中最常见且经常被利用的漏洞。你可以在[`www.owasp.org/index.php/Top_10_2013-Top_10`](https://www.owasp.org/index.php/Top_10_2013-Top_10)\
  \ 获取更多关于这些漏洞的信息。\n\n## SANS\n\nSANS 学院信息安全和网络安全培训领域最受尊敬的机构之一。其关注领域之一是应用安全 (`AppSec`)，并定期在其网页上提供资源（[`software-security.sans.org/resources`](https://software-security.sans.org/resources)）。SANS\
  \ 扩展了其流行的“安全人类”（Securing the Human）计划，该计划关注用户安全意识，并包含了一个针对开发者的专门主题。其中，SANS 列出了大量的建议和最佳实践，许多许多已在本章中介绍。以下是你应该了解的其他额外建议：\n\
  \n* 显示通用的错误信息。\n* 实现锁定机制。\n* 限制敏感数据。\n* 使用 HTTPS。\n* 使用参数化查询。\n* 自动化应用部署。\n\n##\
  \ 互联网安全中心\n\n互联网安全中心（``CIS`）是一个非营利组织，目标是增强所有公共和私立组织的网络安全。`CIS` 的独特之处在于，其核心是协作。多州信息共享与分析中心（``MS-ISAC`）执行类似的功能，但它专注于州、地方和领土\
  \ (`SLTT`) 政府。\n\n### 系统设计建议\n\n`CIS` 通过关注小组和成员之间的共识建立来识别系统设计的最佳实践。网络安全分析师特别感兴趣的是\
  \ `20 CIS Controls`，这些措施通常被认为可以提高组织的安全态势。除了识别这些控制措施，`CIS` 还提供了关于如何在任何信息系统中实施这些措施的具体指导。\n\
  \n## 基准\n\n如果说 `20 CIS Controls` 提供了全球性的系统设计建议，那么 `CIS Benchmarks` 则是保护特定平台（例如 `Windows\
  \ 10 企业版` 或 `Ubuntu 16.04`）的详细指南。这些基准等同于由政府实体（如国防信息系统局 (`DISA`)）发布的安全技术实施指南 (`STIGs`)，用于保护联邦信息系统。除了详细的基准外，`CIS`\
  \ 还提供了开源平台的预加固镜像。\n\n## 本节总结\n\n尽管你可能不会花时间（或者根本不花时间）开发软件，但作为安全分析师，你必须处理任何不安全编码实践带来的后果。最好的办法是熟悉流程和问题，并成为解决方案的一部分。仅仅是参加会议、提问和分享你的想法，可能就是避免由于程序员没有意识到其决策的潜在后果而导致灾难性破坏的关键。理想情况下，你是一个具有凝聚力的\
  \ DevSecOps 团队的一员，持续开发高质量的代码。\n\n至于 `CSA+` 考试，你应该对开发安全代码的主要问题有所认识。你将被要求知道网络安全分析师如何主动地或在需要时响应地处理自定义软件中的漏洞。这里的一些关键概念是你可以运行的安全测试，例如\
  \ Web 应用漏洞扫描、压力测试和模糊测试。\n\n### 题目\n\n**1.**](#part0025.html#ch14qus_1) 测试用户输入以减少格式化用户请求影响的方法称为什么？\n\
  \nA. 输入验证\nB. 静态代码分析\n\n\n\n\nC. 手工检查\nD. 压力测试\n\n2. 在软件开发生命周期中，哪个阶段经常由于集成和性能问题导致开发人员与业务部门之间产生摩擦？\n\
  A. 实现\nB. 设计\nC. 计划\nD. 维护\n\n3. 为了减少应用程序必须检查和解释的数据量，可以使用哪种方法在提交之前捕获错误？\nA. 服务器端验证\n\
  B. 代理验证\nC. 客户端验证\nD. 压力验证\n\n4. 在全组织范围内实施之前，通常使用哪种关键流程来确定新开发软件的可用性？\nA. 用户验收测试\n\
  B. 参数验证\nC. 回归测试\nD. 数据过滤\n\n请使用以下场景和插图回答第 5–10 题：\n\n![Images](img/00102.jpeg)\n\
  \n你们会计部门的管理员联系了团队，因为该部门的一位分析师在会计报告中发现了差异。该部门的一些纸质文档与存储的版本不符，导致他们认为数据库已被篡改。该数据库仅供内部访问，你可以假设它没有从公司网络访问过。管理员告诉你，该数据库软件是几年前由个人编写的，自最初推出以来他们一直未能更新该系统。本地管理员还为你提供了流量捕获数据以协助分析。\n\
  \n5. 在听了关于软件单人开发的描述后，你知道哪种过程可以在不需要运行软件的情况下改进软件？\nA. 运行时分析\nB. 实时性分析\nC. 模糊测试\nD.\
  \ 代码审查\n\n6. 你可能会使用哪种工具监控端点与服务器之间的通信，以观察交换情况并帮助你发现缺陷？\nA. 跳板机\nB. 拦截代理\nC. 回归测试\n\
  D. 客户端验证\n\n7. 根据流量捕获数据，获取 Web 应用程序未经授权访问的方法是什么？\nA. 回归\nB. 重放攻击\nC. SQL 注入\nD.\
  \ 请求伪造\n\n8. 哪种实践可能防止这种特定的攻击成功？\nA. 网络分\nB. SSL\nC. 双因子身份认证\nD. 输入验证\n\n9. 为了防止输入被解释为实际命令，开发者应该使用哪种方法？\n\
  A. 回归测试\nB. 通用错误消息\nC. 会话令牌\nD. 参数化查询\n\n10. 你已经更新了服务器软件，并想主动测试是否有新缺陷。哪种方法最不符合你的需求？\n\
  A. 模糊测试\nB. 静态代码分析\nC. 压力测试\nD. Web 应用扫描\n\n### 答案\n\n1. **A.** 输入验证是一种通过对提供的数据与适当的值进行测试来保护系统免受异常输入的方法。\n\
  2. **A.** 实现主要关注软件在生产环境中的运行情况。虽然问题不可避免地会出现，但高效的组织具有成熟的改进机制。\n3. **C.** 客户端验证是在数据发送到服务器之前，在用户浏览器或应用程序中进行的检查。这种做法与服务器端验证配合使用，以提高安全性并减轻服务器负载。\n\
  4. **A.** 用户验收测试是确定软件是否符合规范并适用于业务流程的方法。\n5. **D.** 代码审查是由未参与初始开发过程的人对软件进行的系统性检查。这确保了视角的中立并促进了对编码和安全标准的遵循。\n\
  6. **B.** 拦截代理是一种插入在两个端点（通常在同一网络中）之间的软件工具，用于监控流量并帮助安全测试。\n7. **C.** SQL 注入是一种通过操纵输入来获取\
  \ Web 应用程序数据库服务器控制的技术。它有效且强大，通常有助于数据的操纵或窃取。\n8. **D.** 输入验证是对输入数据进行限制和清理的实践。通过与已知良好类型对比数据的类型、长度、格式和范围进行检查，这是对所有类型注入攻击的有效防御。\n\
  9. **D.** 使用参数化查询是开发者的一种实践，可以轻松区分代码和用户提供的输入。\n10. **B.** 除了静态代码分析外，所有方法均被视为主动类型的评估。\n\
  \n***\n\n# 第 15 章\n## 工具集\n\n在本章中，你将学习到：\n* 分析师主要的工具和技术\n* 何时以及如何使用不同的工具和技术\n* 如何在相似的工具和技术之间进行选择\n\
  \n***\n\n*我们塑造工具，随后工具塑造我们*。\n—Marshalluhan\n\n本章的目的是向你介绍（或者可能让你重新熟悉）参加 CSA+ 考试需要熟悉的工具。我们并不是试图对每种工具进行全面的回顾或涵盖所有功能。相反，我们提供了足够的信息，让你理解每种工具的作用以及你何时可能想要使用一种而不是另一种。为了方便起见，我们将这些工具分为五类：预防性的、集合性的、分析性的、利用性和取证性的。如果你在本章中第一次读到某种工具，可能需要花更多时间来熟悉它。\n\
  \n五类工具中的每一类都可以进一步细分为工具类。例如，预防类有一类工具被称为防火墙。同一类中的所有工具的作用大大相同，尽管方式不同。对于每个工具类，我们在比较该类中的知名产品之前都会提供概述。然后我们提供了一个说明性场景，对每个工具进行更详细的描述以及它如何适用于该场景。\n\
  \n![Images](img/00005.jpeg)\n\n**考试提示**：考试时不需要详细了解这些工具，但你需要知道何时以及如何使用不同类的工具。\n\n\
  ### 预防性工具\n\n\n\n\n我们将讨论的第一类工具包含了所有帮助我们预防事故的工具。它们允许我们围绕应用程序、主机或网络创建防御性边界。为了获得最佳效果，我们利用这些工具创建同心圆状边界，通常情况下，这些防御层的数量与其所保护的资产价值成正比。\n\
  \n### 防火墙\n\n`Firewalls` 是根据特定规则集限制网络数据流的系统，从而强制执行组织的安全策略。组织安全策略针对保护关键资产的方面，对可接受和不可接受的操作提供高层指令。防火墙拥有的更详细的安全策略，除了其他内容外，它还规定了允许哪些\
  \ `IP` 地址和范围，以及可以访问哪些端口。防火墙策略或规则集通常被称为`access control list (ACL)`。一个简单的规则（如下所示）可以用于允许\
  \ SMTP 流量从系统 `10.1.1.2` 传输到系统 `172.1.1.2`：\n\n```\npermit tcp host 10.1.1.2 host\
  \ 172.1.1.2 eq 25\n```\n\n在表达式 `cvar = avar + bvar` 中，加法运算符（`+`）将 `avar` 和 `bvar`\
  \ 相加，得到它们的和 `cvar`。\n\n在 `List.of(arg0, arg1, arg2)` 中，`List` 接口的工厂方法 `of()` 接受一系列元素并返回一个包含这些元素的只读列表。\n\
  \n随后我们这样调用 `cmd` 命令：`cmd arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"\
  xxx\")}\n```\n\n\n\n\n你最近加入了一家小型企业，担任唯一的网络安全分析师。公司拥有一套合理的安全架构，使用了一些旧的 Cisco 路由器和防火墙，但没有\
  \ IPS（入侵预防系统）。你很快意识到这是一个亟需改进的关键领域，但同时也知道资金非常紧张。你编写了一些基础的 Snort 规则，但并不真正精通它或任何其他系统。下周与\
  \ IT 主监的一次预定会议可能是你在该领域提出一些改进建议的机会。\n\n### Bro\nBro 的初衷并不是为了用作 IPS，但它强大的脚本语言确实可以实现这一点。从核心功能来说，这种\
  \ IDS（入侵检测系统）做两件事：捕获各种事件（不将它们标记为好或坏），然后运行脚本来分析这些事件，寻找可能指示安全事件的特征或异常。这些脚本可以执行各种范围的操作，从发送警告消息到更改系统配置以阻止威胁。Bro\
  \ 之所以可能特别适合这种场景的原因是，它会记录*一切*，即使在你正处于熟悉它并构建脚本库的阶段。这意味着你可以在已经获取的数据上运行新脚本，以检测在你完全掌握之前发生过的事情。它是免费的，这一事实也符合你有限的预算。\n\
  \n### Snort\nSnort 虽然也是一种 IDS，但比 Bro 更经常被用作 IPS。它的脚本语言没有 Bro 那么强大，但对于阻止任何你能开发出特征的网络威胁来说足够了。这是\
  \ Snort 和 Bro 之间的关键区别，后者既可以寻找特征，也可以寻找异常行为。与 Bro 不同，Snort 不会自动记录它在网络上看到的所有内容，如果你存储海量事件数据的手段有限，那么这可能很具吸引力。然而，和\
  \ Bro 一样，Snort 是免费开源的，这意味着你应该能够负担得起它。由于你（在此场景中）拥有一些 Snort 经验，因此在新的组织中部署它时已经占了优势。\n\
  \n### Sourcefire\nSourcefire 起初是 Snort 的商业版本。它的功能迅速增长，后来扩展为 Firepower 安全产品线下的系列备用方案。Sourcefire\
  \ 公司于 2013 年被 Cisco 收购，Firepower IPS 在进一步改进的同时被集成到了 Cisco 产品中。该系统作为 Cisco 的自适应安全设备\
  \ (ASA) 产品线以限时（通常为年度）许可的形式提供。其许可模式随支持的主机数量增加而增加，因此像场景中的这种小型组织可能负担得起，特别是如果你已有的 Cisco\
  \ 防火墙可以支持 Sourcefire Firepower 的话。与 Bro 和 Snort 不同，这种 IPS 带有商业支持，这可能在你适应新角色时让事情变得更轻松。\n\
  \n### 基于主机的入侵预防系统\n顾如其名，基于主机的入侵预防系统 (HIPS) 是一种 IPS，它只检查和响应进出主机网络网络接口的流量。与其基于网络的同类相比，这种保护只提供给一个设备。虽然这看起来像是一个局限性，但它实际上增强了整体安全态势，因为它允许\
  \ HIPS 针对某个特定主机的流量和模式进行精细调优。对于一个不仅依赖特征，还结合了行为或启发式方法的 HIPS 来说，这一点尤为不争事实。\n\n你之所以*不*想在整个组织中部署\
  \ HIPS 的唯一理由是，你没有足够的资源（例如时间、金钱或人员）来正确地安装和维护它们。除了许可的直接成本外，重要的是，基于异常的 HIPS 在训练期间可能需要大量的人工监督（即系统学习什么是“正确”的这段时间）。在此期间，由于\
  \ HIPS 错误地将良性流量归类为恶意，你可能还会面临生产力损失。通过确保你的解决方案包含集中化管理和监控功能，可以缓解部分此类成本。\n\n### 反恶意软件\n\
  反恶意软件（有时称为防病毒软件）旨在检测和中和恶意软件，包括病毒、蠕虫和特木马。市面上可用的大多数反恶意软件都是基于规则的，每周（或更短周期）从供应商处下载新的恶意软件定义文件。该软件的工作原理是识别恶意软件的独特属性，将其提取作为特征，然后用它更新所有软件系统。反恶意软件识别的是供应商已知的恶意软件，这意味着它可能检测不到新的恶意软件（或经过修改的“旧”恶意软件）。\n\
  \n在本文时，市场上至少有 16 种主要的反恶意软件产品。尽管没有一种产品能对恶意软件提供 100% 的保护，但根据独立测试的多份独立报告，它们对*已知*恶意软件的效率在\
  \ 96% 到 99.9% 之间。这使得反恶意软件产品成为性价比最高的保护手段之一。尽管如此，开发专门设计为对任何单一产品都不可见的恶意软件并不困难。这意味着，如果一个老练对手知道你使用哪种反恶意软件产品，绕过它一点都不困难。\n\
  \n* *\n\n![Images](img/00009.jpeg)\n\n**注意** *防病毒* (antivirus) 一词仍被广泛使用，但几乎肯定指的是反恶意软件。该市场中没有一家主要供应商将其工作严格限制在计算机病毒上，这些病毒在如今并不十分常见。\n\
  \n### 增强缓解体验工具包\n增强缓解体验工具包 (EMET) 是微软的一款免费产品，旨在增强 Windows 系统对各种威胁的防护，特别是未知的（或零日）威胁。EMET\
  \ 中提高安全态势的关键特征包括：\n\n- **数据执行保护 (DEP)**：当进程调用一个函数时，它会为（可执行的）代码和（假设为不可执行的）数据分配内存空间。缓冲区溢出攻击会超出数据空间并导致“数据”覆盖内存空间，从而允许任意代码执行。DEP\
  \ 通过将数据空间标记为不可执行并防止数据写入代码空间来防止这种情况的发生。\n- **地址空间布局随机化 (ASLR)**：缓冲区溢出和其他形式的攻击需要攻击者知道（或能够猜测）内存中特定数据（通常是代码）的位置。正确实施使得确定特定指令或数据项的位置变得不可能（或至少非常困难）。\n\
  - **控制流防护 (CFG)**：面向返回的编程 (ROP) 是一种攻击技术，攻击者劫持进程的正常流并导致其执行恶意操作。CFG 通过创建程序内允许流的虚拟映射并阻止任何未映射的流来降低\
  \ ROP 的风险。\n\n需要注意的是，这些功能通常是未安装 EMET 的 Windows 系统自带的。然而，为了使其生效，每个程序都需要由开发者进行编译以利用这些功能。遗憾的是，许多程序并不是以此方式编译的，导致它们容易受到多类攻击。EMET\
  \ 的工作原理是在程序未构建以利用这些功能时弥补这些缺陷，并允许用户控制哪些程序启用哪些功能，如图 15-1 所示。\n\n![Images](img/00105.jpeg)\n\
  \n\n\n\n\n# 图 15-1 EMET 安全功能到程序的的映射\n\n![Images](img/00009.jpeg)\n\n**注意** 微软宣布\
  \ EMET 将于 2018 年 7 月停止支持，理由是这些功能已经是 Windows 10 的关键部分。\n\n## 网络代理 (Web Proxies)\n\
  \n`web proxy`（Web 代理）是一种拦截并转发客户端与服务器之间网络流量的系统。此类代理通常用于执行内容过滤，以确保互联网的使用符合组织的可接受使用策略。它们可以阻止不可接受的网流量、提供有关特定用户访问网站的详细信息日志、监控带宽使用统计、阻止限制网站的使用，并针对特定关键词（如色情、机密或社会安全码）对流量进行筛选。代理服务器可以配置为缓存服务器，保留频繁请求资源的本地副本，从而允许组织在大幅减少上行带宽使用和成本的同时，显著提升性能。\n\
  \n值得注意的是，尽管大多数 Web 代理支持 HTTPS 流量，但要有效地实现这一点需要额外的步骤。首先，你将检查一段加密的“对话”内容，因此（用户）可以合理地预期它是私密的。你的组织政策必须向用户明确这种情况可能会发生，否则你可能会发现自己陷入法律麻烦。\n\
  \n下一步是确保你组织中的所有客户端都信任你将用于签署内部证书的证书颁发机构 (CA)。问题在于，使用 HTTPS 时，客户端向服务器请求由受信任 CA 颁发且与请求资源的域名相匹配的证书。当\
  \ Web 代理调解这段对话时，它将向客户端出自己的证书以保护内部连接，并使用服务器的证书来保护连接的外部部分。如果代理的 CA 不被客户端信任，浏览器每次都会生成证书警告，这是我们并不希望用户习惯于点击跳过的。\n\
  \n![Images](img/00005.jpeg)\n\n**考试提示** Web 代理通常关注客户端，确保其不访问或上传被禁止的内容，同时保护其免受恶意数据的下载。\n\
  \n## Web 应用防火墙 (Web Application Firewalls)\n\nWeb 代理控制 Web 客户端的行为以及对 Web 客户端的操作，但我们还需要为服务器提供类似的保护，以确保外部客户端无法轻易攻击它们。`web\
  \ application firewall (WAF)`（Web 应用防火墙）是一种调解指向受保护服务器外部流量的系统。WAF 针对其旨在保护的特定 Web\
  \ 应用（或类 Web 应用）进行配置。换句话说，WAF “精通 Web 应用的语言”，以便识别针对它的异常或不允许的请求。它能够确定哪些 URL、目录和参数是允许的，哪些是可疑的。这是传统防火墙无法到的。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** 支付卡行业数据安全标准 (PCI DSS) 的第 6.6 条要求受监管组织要么由专业机构对所有\
  \ Web 应用代码进行审查，要么为任何面向 Web 的应用程序部署 WAF。\n\n## 工具 (Tools)\n\n三个流行的 WAF 详见 表 15-3\
  \ 中。\n\n![Images](img/00106.jpeg)\n\n**表 15-3** 监控工具对比\n\n## 场景 (Scenario)\n\n你的朋友正在开始一项在线业务，在听你刚刚通过了\
  \ CSA+ 考试后，他向你寻求关于保护他的 Web 商店并符合 PCI DSS 要求的建议。支持该初创公司的风险投资者期望业务能够快速增长，并投入了大量的首轮资金。Web\
  \ 基础设施尚未开发，因此没有遗留问题需要考虑。被雇佣的唯一系统管理员精通 `Apache`，但对 `Nginx` 比较熟悉。\n\n### SecureSphere\n\
  Imperva 的 `SecureSphere` 是市场上领先的 WAF 之一。它的特色之一是 `dynamic profiling`（动态分析），它可以自动学习受保护应用程序的合法结构和行为，以及用户的正常行为。借鉴了下一代防火墙\
  \ (NGFW)，`SecureSphere` 能够与云端威胁情报系统交换已知威胁源和新攻击指标，从而减少对在其他地方已看到的攻击和攻击者的脆弱性。凭借丰富的功能集、学习正常和异常模式的能力以及与威胁情报资源的连接，`SecureSphere`\
  \ 疑是市场上最强大的 WAF 之一。然而，代价是每台设备的费用高达数万美元，这使得 `SecureSphere` 超出了许多小型组织的承受能力。\n\n由于该初创公司资金充足且基础设施尚未开发，这可能是考虑长期计划并投资\
  \ `SecureSphere` 的正确时机。尽管在公司成立初期可能大材小用，但它将支持非常快速的增长。\n\n### ModSecurity\n`ModSecurity`\
  \ 是一个用于 Web 应用监控、日志和控制的开源工具包。它最初被开发为 `Apache` 服务器模块（因此名称中带有“Mod”部分），但此后已适配 `Microsoft\
  \ Internet Information Server (IIS)` 以及 `Nginx`（尽管存在一些问题和局限性）。`ModSecurity` 能够利用开放\
  \ Web 应用安全项目 (OWASP) 的核心规则集 (CRS)，这是一组针对常见 Web 应用攻击的检测规则。`CRS` 由 `OWASP` 专门为 `ModSecurity`\
  \ 开发的，尽管它也适用于兼容的 WAF。除了这种传统的基于规则的检测外，`ModSecurity` 还能聚合多个（不那么重要的）规则匹配，从而共同触发高级别的警报。这种基于异常的方法旨在捕捉那些原本在分析师屏幕上显示的微量攻击。\n\
  \n### NAXSI\n`NAXSI` 代表 `Nginx Anti XSS and SQL Injection`（Nginx 反跨站脚本和 SQL 注入），`XSS`\
  \ 代表 `跨站脚本`。作为一个相关的说明，`Nginx` 是一种专为在高并发环境下优于 `Apache` 的开源 Web 服务器。由此推，`NAXSI` 也关注性能，其实现方式是集中在一个较小的规则集，该规则集据称可以识别\
  \ 99% 的已知 Web 应用攻击特征。通过对这些规则采取相当严厉的措施，`NAXSI` 实施了默认拒绝策略。然后由系统管理员创建白名单以允许合法流量通过，同时让\
  \ `NAXSI` 拦截所有其他内容。显然，调优 `NAXSI` 实现至关重要，但这种 WAF 可以使用的半监督自学习功能促进了这一点，它可以自动生成白名单。\n\
  \n场景中的系统管理员可能需要大量的学习才能运行 `NAXSI` 解决方案。尽管如此，如果资金有限且快速增长阶段的性能非常重要，这可能是最合适的选择。它可能比\
  \ `Apache ModSecurity` 方案贵一点，但未来可能也能更好地支持庞大的客户群。\n\n\n\n\n即使我们的防御工具能够有效阻止绝大多数针对系统的威胁，我们仍然需要密切关注这些工具（以及整个系统），以确保它们在瞬息万变的威胁环境中依然有效。现实中，我们的工具和其他措施失效的频率比我们愿意承认的要高。这强调了收集信息进行单点分析或历史分析的重要性。聚合工具的范围涵盖了从非常集中的命令行工具（如常用的\
  \ `ping`）到极其复杂的安全信息和事件管理 (`SIEM`)解决方案。\n\n## 安全信息和事件管理\n\n安全信息和事件管理 (`SIEM`) 系统的分析性并不亚于其聚合属性。该类别的所有工具都执行四个基本功能：收集、存储、分析和报告。大多数收集的信息来自各种系统的日志，这些日志被导出并发送到\
  \ `SIEM` 系统。随后，`SIEM` 通常会对来自这些异源的数据格式进行规范化处理，以便它们可以相互比较。然后它会将所有内容存储在一个针对快速检索优化的系统中，这对于分析海信息是必要的。无论分析是简单用户查询的结果，还是复杂关联过程的最终产物，`SIEM`\
  \ 都必须为不同目的生成各种报告，范围从内部经验总结到监管合规。\n\n## 工具\n\n`SIEM` 市场上存在几十个玩家，但出于 `CSA+` 考试目的，我们只关注六个。这些工具在表\
  \ 15-4 中突出，并在接下来的场景背景中进一步描述。\n\n![Images](img/00107.jpeg)\n\n**表 15-4** SIEM 产品列表\n\
  \n## 场景\n\n在几次（相当）小型的安全事件后，你的中型公司准备投资更强大的事件管理能力。作为公司的高级网络安全分析师，你被分配了识别并获取最佳解决方案的任务。你并没有空支，但仍有一笔合理的资金，因此不需要寻找免费解决方案。时机至关重要，因为你的预测显示未来\
  \ 18 个月内将有重大增长，涉及新员工和几次小型收购。你从事大量的政府工作，因此没有太大的云端业务（选择将数据保留在本地），但这类客户也使你成为高级持续性威胁\
  \ (APT) 的可能目标。\n\n### 统一安全管理平台\n\nAlienVault 统一安全管理 (`USM`) 系统是开源安全信息管理器 (`OSSIM`)\
  \ 的专有扩展，我们稍后会讨论。除了 `OSSIM` 的功能外，`USM` 还包含了数据分析和可视化、日志管理、电话和电子邮件支持、文档、知识库以及全整天的培训。AlienVault\
  \ 还提供订阅制的威胁情报服务，以及支持 `OSSIM` 和 `USM` 的众包威胁交换 (Threat Exchange)。所有这些都可以以虚拟机或硬件设备的形式提供，可以部署在本地或紧密集成到亚马逊云服务\
  \ (`AWS`) 中，并拥有良好的客户服务。\n\n由于场景中指定你没有足够的 `SIEM` 能力，像 `USM` 这样的产品可以让你以相当少少的资金获得巨大的效能。威胁情报服务的订阅也可以帮助缓解来自\
  \ `APTs` 的威胁，特别是通过该产品中复杂的分析和报告功能。\n\n### ArcSight\n\n`ArcSight` 拥有三个不同但相关的平台，能够为中大型组织提供服务。其独特特征之一是其关联和分析引擎的成熟度。针对特定功能组集（如用户行为分析\
  \ `UBA` 和 `DNS` 恶意软件分析）的多个可选模块仅为那些有需要的人提供额外功能。`ArcSight` 与其他 `SIEMs`（截至本文编写）的区别特征之一是开放架构，这促进了它与大多数其他安全解决方案的集成。这从它可以进行自己的数据分析，或者与\
  \ `Hadoop` 和 `Kafka` 等其他系统接口以向第三方大数据平台提供数据这一点可见。\n\n`ArcSight` 是市场上最受尊敬的平台之一，因此在这种场景中选择它是不会出错的。可选模块将为你提供一条良好的增长路径，尽管基础产品已经提供了一套强大的功能。此外，如果你的组织发展到能够利用大数据分析的程度，`ArcSight`\
  \ 与该领域最常见的解决方案集成良好。\n\n### Kiwi Syslog\n\n`Kiwi Syslog` 是由 `SolarWinds` 开发的工具，用于监控、归档和告报\
  \ `syslog` 事件。从技术上讲，它不是一个 `SIEM`，尽管它与这类工具共享一些基本功能（例如，对消息进行优先级排序和告报）。`Kiwi` 真是为了帮助监控性能和解决监管合规问题，但这些功能也可以帮助识别入侵情况，这就是\
  \ `CompTIA` 将其归类为 `SIEMs` 的原因。然而，从现实角度来看，`Kiwi` 作为一个独立的 `SIEM` 是不够的。\n\n场景中并没有特别提到\
  \ `Kiwi Syslog` 是一个很好的解决方案。尽管如此，如果你的主要挑战是整合来自 `Linux` 和 `Windows` 系统的日志文件，它可以作为解决方案。\n\
  \n### OSSIM\n\n开源安全信息管理器 (`OSSIM`) 是组件的集成集合，而不是一个单体产品。`OSSIM` 起于 2003 年，五年后成为此前描述的商业产品\
  \ `AlienVault` 的基础。它包含了用于漏洞评估的开源漏洞评估系统 (`OpenVAS`)、用于网络入侵检测的 `Suricata`、用于主机入侵检测的\
  \ `OSSEC`，以及文件完整性监控等。许多开源工具连贯地集成到一个统一的基于 Web 的界面中，带有向导引导你完成常见的设置，如图 15-2 所示。`OSSIM`\
  \ 以 `ISO` 发行，可以安装在虚拟机或物理主机上。这些主机可以参与开放威胁交换 (Open Threat Exchange)，这是一种众包的 IP 信誉服务，允许\
  \ `OSSIM` 系统共享有关已知或可疑恶意地址的信息。\n\n![Images](img/00108.jpeg)\n\n***\n\n**图 15-2**\
  \ OSSIM 配置向导\n\n你已经看到 AlienVault 的 `USM` 将非常适合该场景。如果你的预算有限，或者你更倾向于在获取平台之外还投资于人才培养，那么\
  \ `OSSIM` 可能是一个很好的选择。你通过选择这个免费平台节省的资金可以投入到员工培训中，根据具体需求，这可能给你带来更好的适配性。\n\n### QRadar\n\
  \nIBM 的 `QRadar` 出于其他 `SIEMs` 的地方在于它能够集成 `NetFlows`、数据包捕和事件日志以支持事件响应。该系统不仅跟踪事件（事件可能变成事故），还跟踪“违规行为\
  \ (offenses)”，即关联的事件更有可能表明存在安全入侵。检查违规行为的分析师可以查看支持它的所有网络和日志数据、所有受影响主机以及所有相关的漏洞。`QRadar`\
  \ 的另一个独特特征是能够自动开始获取取证数据和/或启动事件工单。\n\n\n\n\n\n如果你的 SIEM 和响应流程之间需要紧密集成，那么 QRadar 在该场景下会非常合适。特别是，如果你的响应通常涉及网络数据捕获或\
  \ NetFlow 数据，且这些数据必须与事件日志相关联，那么在能够负担得起的情况下，这可能是你的最佳选择。由于场景中没有明确说明这一需求，在做出决定之前，你还需要深入研究。\n\
  \n## 安全智能平台\n\nSplunk 可能是 SIEM 市场中知名度最高的名称。它的安全智能平台 (`SIP`) 由两个产品组成：`Splunk Enterprise`\
  \ 和 `Splunk Enterprise Security`。前者提供事件和日志收集、索引及分析，而后者具有传统的 SIEM 功能，可以使这些数据具有可操作性。Splunk\
  \ 最初只是一个日志文件分析引擎，后来成长为 SIEM，这解释了为什么它在第一个角色上表现出色，但在第二个角色上面临激烈的竞争。事实上，如果你正在寻找高级事件关联，其他平台可能提供更好的产品且需要的精力更少。像\
  \ ArcSight 一样，`SIP` 也能提供用户行为分析 (`UBA`)，这对于高级威胁监控非常有用。\n\n场景中没有任何元素能让 `SIP` 脱颖而出成为显而易见的选择，因此将归结为你所需基本功能的最佳成本。Splunk\
  \ 与其他解决方案相比非常有竞争力，因此你需要明确自己的需求并从多个供应商处获取报价。然后你可以对比功能和成本，并根据这些标准选择合适的平台。\n\n## 网络扫描\n\
  \n网络扫描是对一组主机进行特定信息的质询。例如，水平网络扫描向一组主机地址发送消息并询问“你在那里吗？”。其目标是确定哪些地址对应于活跃（有响应）的系统。另一方面，垂直扫描向一组协议/端口组合（例如\
  \ `UDP 53` 或 `TCP 25`）发送消息并询问相同的问题，目标是确定哪些端口正在监听客户端连接尝试。也可以结合水平扫描和垂直扫描，如图 15-3 所示。任何形式网络扫描的意义在于发现谁在网络上监听（并做出响应）。这对于发现行为不符合要求的系统很有用。\n\
  \n![Images](img/00109.jpeg)\n\n**图 15-3** `Nmap` 同时执行水平和垂直扫描\n\n考虑这样一种情况：软件开发团队建立了一个测试\
  \ Web 服务器，以确保团队成员正在编写的 Web 应用程序运行正常。这并没有恶意，但不知道这台服务器正在运行（以及如何运行）可能会严重损害损害防御的完整性。另一方面，我们有时可以发现证据，表明主机已被攻破且现在正在运行恶意服务。尽管在管理良好的网络中，这些情况应该是罕见的，但扫描是任何安全专业人员的精湛技能之一，因为它是少数能够真正了解并映射我们网络内容的方法之一。\n\
  \n## Nmap\n\nNmap 是一个与网络扫描同义的工具。该名称是“network mapper”（网络映射器）的缩写，对其功能的描述非常恰当。Nmap\
  \ 通过向目标主机发送特意构造的消息并检查响应来工作。这不仅可以告诉我们哪些主机在网络上活跃，以及它们的哪些端口正在监听，还可以帮助我们确定某些系统的操作系统、主机名，甚至是补丁级别。尽管它是一个命令行界面\
  \ (CLI) 工具，但许多前端都提供了图形用户界面 (GUI)，包括 `Zenmap` (Windows)、`NmapFE` (Linux) 和 `XNmap`\
  \ (Mac OS)。\n\n## 数据包捕获\n\n最初用于捕获数据包的商业工具是 20 世纪 80 年代后期开发的 `Network General Sniffer`，它允许我们捕获实时数据，永远改变了我们观察和分析网络的方式。我们在第\
  \ 1 章 和第 2 章 中引入了数据包捕获，但我们回到这个主题是为了讨论你何时以及如何使用各种工具。除了对于故障排除和事件响应有用外，嗅探器通常用于记录和审计。某些具有特别敏感数据的组织（例如金融和军事）会对某些网络中的所有流量进行全数据包捕获。我们不会深入探讨这个大数据分析用例，而是关注网络数据包捕获更常见的用途（参见表\
  \ 15-5）。\n\n## 工具\n\n![Images](img/00110.jpeg)\n\n**表 15-5** 数据包捕获方案对比\n\n## 场景\n\
  \n你正在调查涉及你的域名系统 (`DNS`) 服务器的嫌疑 `NetFlow` 数据。你的防火墙和 SIEM 都没有设置成捕获完整数据包，你认为为了查明真相需要这一点。通过连接到右侧交换机的端口分析器\
  \ (`SPAN`) 端口，并仅捕获进出你 DNS 服务器的端口 `53` 流量，你估计数据包量不会大到无法手动分析。然而，你确实想保存数据包捕获文件，以备未来参考、分析或证据使用。\n\
  \n### Wireshark\n\nWireshark 可能是最广泛使用的基于 GUI 的包分析器。尽管使用其图形前端有许多优势，但重要的是，它包含一个名为\
  \ `TShark` 的 CLI 能力，这在你无法访问 GUI 时（例如通过 `SSH` 连接时）非常有用。无论你是通过 GUI 还是 CLI 捕获流量，你都可以保存并在稍后查看。图\
  \ 15-4 显示了典型的捕获，而图 15-5 显示了你如何深入特定的数据包。\n\n![Images](img/00111.jpeg)\n\n**图 15-4**\
  \ 典型的 Wireshark 捕获\n\n![Images](img/00112.jpeg)\n\n**图 15-5** Wireshark 显示包详情\n\n\
  由于场景没有规定你将使用的界面，这种在图形前端对数据包进行深度分析的能力使得 Wireshark 成为一个很好的选择。场景对于用于捕获数据包的平台也是通用的，因为\
  \ Wireshark 运行在 BSD、Linux、Mac OS 和 Windows 上，因此无论操作系统如何，它都是可行的。\n\n### Tcpdump\n\
  \nTcpdump 是一个 CLI 工具，标准于许多 BSD、Linux 和 Mac OS 发行版，这意味着你通常不需要担心在想要采集流量的平台上安装它。只要你可以\
  \ `SSH` 进入主机并以特权用户（如 `root`）身份运行，就可以在大多数非 Windows 系统上捕获包。如图 15-6 所示，显示没有 Wireshark\
  \ 那么易读，但捕获的信息相同的。还有一个 Windows 版本称为 `windump`，它通常没有默认安装。除非你计划在场景中使用 Windows 计算机捕获，否则\
  \ `tcpdump` 将是一个很好的选择，特别是当你将其与更强大的分析引擎结合时。\n\n![Images](img/00113.jpeg)\n\n**图 15-6**\
  \ 典型的 tcpdump 数据包捕获\n\n\n\n\n\n# Aircrack-ng\n\nAircrack-ng 是最流行的开源无线网络安全工具。它主要用于通过对\
  \ WPA 密钥进行攻击、重放攻击、取消身份验证以及创建伪造访问点来审计 WLAN 的安全性。然而，它也包含了数据包捕获功能。此外，如场景所示，它还可以被强制捕获有线网络流量。但考虑到我们在这里讨论的另外两个工具的强大，它并不是一个非常好的选择。但是，如果场景需要无线捕获，这将是首选工具。\n\
  \n## 命令行实用程序\n\n本节涵盖了每个网络安全分析师必须学会使用的无数 CLI 工具中的某些工具。这些工具的侧重点都非常窄，但在特定情况下是必不可少的。如果你不熟悉其中任何一种工具，你真的应该花些时间研究它们，这不仅是为了\
  \ `CSA+` 考试，更重要的是为了更好地完成工作。\n\n### Netstat\n`netstat` 实用程序提供了关于网络连接状态和监听套接字（sockets）丰富信息。这可能是该工具最常见的用途。它还可以显示接口统计数据。这两个功能都显示在图\
  \ 15-7 中。它还可以提供协议统计，例如 `IP` 和 `ICMP`，如你在图 15-8 所示。`netstat` 是几乎每个 `Linux`、`Mac OS`\
  \ 和 `Windows` 系统的默认安装部分，尽管 `Windows` 中的某些特定选项略不同。\n\n![Images](img/00114.jpeg)\n\
  \n**图 15-7** 显示 TCP 连接、监听端口和接口统计数据的 Netstat\n\n![Images](img/00115.jpeg)\n\n**图\
  \ 15-8** netstat 提供的协议统计数据\n\n### Ping\n`ping` 实用程序只是向你指定的任何主机发送四个（Windows）或持续（其他操作系统）的互联网控制消息协议（ICMP`）回显请求。如果目标主机配置为响应这些请求，它将为收到的每个消息发送一个\
  \ `ICMP` 回显回复消息。`ping` 将比较发送请求的时间与接收响应的时间，然后为交换提供总（往返）时间。这些往返时间可以提供通/自该目标的延迟和抖动指标。\n\
  \n### Traceroute\n`traceroute` 实用程序（用于 `BSD`、`Linux` 和 `Mac OS`）及其 Windows 兄弟版本\
  \ `tracert` 利用传输 `ICMP` 回显请求的 `IP` 数据包中的生存时间（`TTL`）字段。`traceroute` 通过向同一主机的一系列消息递增\
  \ `TTL`（从 1 开始来工作。根据 `IP` 的工作原理，接收主机首先减少到达数据包的 `TTL`。如果该新值大于零，主机将正常处理数据包。否则，它将向源地址发送\
  \ `ICMP` “时间超时”消息。通过增加 `TTL`，`traceroute` 强制源主机和最终目的地之间的每个连续主机暴露其 IP 地址。值得注意的是，`IP`\
  \ 数据包并不保证按照路径运行。\n\n### Ifconfig\n`ifconfig` 实用程序用于配置网络接口。它用于查看和管理网卡的 IP 地址、子网掩码和网关。在许多现代系统中，`ifconfig`\
  \ 已被 `ip addr` 代替。\n\n### Nslookup\n`nslookup` 命令用于查询域名系统（DNS）。它允许用户查找 DNS 记录的映射，例如域相关的\
  \ IP 地址。\n\n### OpenSSL\n`OpenSSL` 是一个强大的商业级工具包，实现了安全套接字和 TLS 协议。它用于各种加密操作，包括生成证书、加密/解密数据以及签名。\n\
  \n### Sysinternals\n`Sysinternals` 工具集是用于 Windows 的高级工具集合。这些工具被管理员用于诊断和分析操作系统。其中许多是微软工具的一部分。\n\
  \n- **Process Explorer**: 提供有关所有进程的丰富信息，包括它们使用的内存和 CPU。\n- **Autoruns**: 允许快速确定哪些程序在系统启动或用户登录时自动启动。\n\
  - **Process Monitor**: 提供有关进程拥有或使用的特定资源的详细信息，包括注册表项、`DLLs`、文件和其他进程。\n\n\n\n\n\n\
  您的组织在过去的几个月里经历了显著增长，并最近聘请了第一位首席信息安全官（CISO）。在她准备为组织信息安全策略变更制定建议时，她希望向其他领导层提供组织网络资产的概要，包括面向可能的服务器、终端和数据存储。她想为公司领导层提供一份简短报告，但想为自己准备一份详细的后续计划，其中包含每个漏洞的技术细节和修复计划。她通知你，她希望每两周进行一次这种评估，并希望结果自动发送到她的邮箱邮箱。\n\
  \n### QualysGuard\n`QualysGuard` 是总部位于加利福尼亚的安全公司 `Qualys` 的产品，该公司是漏洞管理市场的早期参与者。该公司目前通过软件即服务（SaaS）模式提供多种云端漏洞评估和管理产品。对于内部扫描，由本地虚拟机进行评估并将结果报告给\
  \ `Qualys` 服务器。图 15-9 是一个示例仪表板，显示了漏洞管理模块下的各种选项。\n\n![Images](img/00117.jpeg)\n\n\
  **图 15-9** 用于管理其云端漏洞评估和管理任务的 `QualysGuard` 仪表板\n\n所有的网络发现、映射、资产优先级排序、调度、漏洞评估报告和修复跟踪任务都可以通过基于\
  \ Web 的 UI 访问。平台可以使用多个模板生成详细报告。默认安装包含一个名为“执行报告”（Executive Report）的模板，它提供了 CISO 讨论所需的类型数据。该报告的部分结果可以在\
  \ 图 15-10 中看到。\n\n![Images](img/00118.jpeg)\n\n**图 15-10** 从“执行报告”模板生成的 `QualysGuard`\
  \ 报告部分\n\n### Nessus\n正如我们在第 6 章 中介绍过的，`Nessus` 是市场上最受欢迎的漏洞扫描器之一。它拥有一个超过 80,000\
  \ 个插件的大型库，平台利用这些插件按临时或计划的基础上扫描网络上的漏洞。与 `QualysGuard` 类似，`Nessus` 提供了一种简单的方法来配置评估并通过你喜爱的\
  \ 浏览器查看结果。当 `Nessus` 发现漏洞时，它会在扫描结果中分配一个严重级别，如 图 15-11 所示。\n\n![Images](img/00119.jpeg)\n\
  \n**图 15-11** `Nessus` Web 界面中发现的漏洞列表\n\n每个漏洞的技术细节、识别漏洞的方法以及任何数据库引用可以在此处找到。`Nessus`\
  \ 特别擅长使用其“合规性检查”（compliance checks）库来评估合规性。这些合规性检查或任何其他类型的扫描都可以根据需要安排进行，满足 CISO\
  \ 自动进行定期扫描的愿望。至于报告，`Nessus` 多种导出选项，如 图 15-12 所示。\n\n![Images](img/00120.jpeg)\n\n\
  **图 15-12** 漏洞扫描后生成报告的 `Nessus` 导出选项\n\n`Nessus` 可以生成仅列出带有相关漏洞利用程序和建议修复步骤的漏洞报告。对于公司领导等观众，用通俗的语言解释可能采取的改进组织安全的具体步骤是关键的。`Nessus`\
  \ 为单个主机以及整个网络提供了这些建议。\n\n### OpenVAS\n`OpenVAS` 是初始 `Nessus` 项目的分支（fork），是一种广泛使用的漏洞扫描器，其主要优势是成本。`OpenVAS`\
  \ 使用与 `Nessus` 类似的结构进行扫描：`OpenVAS Manager` 用于配置和访问 `OpenVAS Scanner`，由后者调度并运行漏洞扫描。图\
  \ 15-13 是 `OpenVAS` 仪表板的示例，分析师通过访问它来管理漏洞扫描。\n\n![Images](img/00121.jpeg)\n\n**图\
  \ 15-13** 提供访问 `OpenVAS Manager` 的 `OpenVAS` 主界面\n\n作为开源软件，`OpenVAS` 高度依赖社区支持来维护其近\
  \ 50,000 个网络漏洞测试（NVTs）库。尽管该软件是免费的，但它不提供与其付费替代品相同水平的支持。对于大型企业网络，按需客户支持的价格可能使增加成本变得合理。\n\
  \n### Nexpose\n`Nexpose` 是来自 `Metasploit` 开发者 `Rapid7` 的漏洞扫描器。它更强调整个漏洞管理生命周期，而不仅仅是扫描和分类漏洞。它还设计为直接集成到\
  \ `Metasploit` 中以对发现的漏洞进行利用。一旦开始扫描，被称为“资产”的网络连接设备将填充图 15-14 所示的仪表板。\n\n![Images](img/00122.jpeg)\n\
  \n**图 15-14** `Nexpose` 扫描进度\n\n分析师可以选择点击特定主机或查看全站范围来查看漏洞详情。图 15-15 显示了全站图表，按 CVSS\
  \ 分对所有发现结果进行细分。\n\n![Images](img/00123.jpeg)\n\n**图 15-15** `Nexpose` 发现的漏洞概述\n\n\
  该系统提供了上下文信息以根据可能被利用的程度对每个漏洞进行评分。这很重要，因为并不是每个漏洞都有关联的利用程序，也不是每个漏洞都有风险。在进行风险评估时必须考虑这一点，特别是在资源受限的环境中。该平台允许导出之前的任何屏幕，也可以生成报告。每份报告都包含网络摘要，以及设备和漏洞的概述，以帮助他们做出决策。\n\
  \n### Nikto\n正如你可能在第 6 章 中记得的，`Nikto` 是基于命令行的 Web 服务器漏洞扫描器。虽然它的用途局限于 Web 服务器，但 `Nikto`\
  \ 的优势在于评估软件漏洞和配置的速度。作为一种命令行工具，它不像其他工具那样友好。`Nikto` 要求至少指定一个目标主机，并在命令行中添加任何其他选项（如非标准端口）。在图\
  \ 15-16 中，我们看到了针对 Web 团队新网站执行的命令，该网站运行在端口 `3780` 上。\n\n![Images](img/00124.jpeg)\n\
  \n**图 15-16** 针对 IP 为 4.4.4.4 的服务器测试的 `Nikto` 命令行输出\n\n`Nikto` 以多种方式保存报告，包括 HTML。HTML\
  \ 文件的示例可以在图 15-17 中找到。\n\n![Images](img/00125.jpeg)\n\n**图 15-17** 针对 IP 为 4.4.4.4\
  \ 的服务器测试的 `Nikto` HTML 输出\n\n此报告包含了所执行命令的摘要、被测试服务器的信息以及指向相关资源及其漏洞数据的超链接。虽然这对于技术团队执行很有帮助，但对于非技术决策者来说可能没有那么用。\n\
  \n\n\n\n\n# 微软基准安全分析器\n\n微软提供了一个名为基准安全分析器（Baseline Security Analyzer）的工具，用于快速识别\
  \ Windows 操作系统中缺失的安全补丁或软件配置错误。该工具针对 Windows Vista、Windows XP、Windows 7、Windows 8、Windows\
  \ Server 2003、Windows Server 2008 以及 Windows Server 2012 设计，可以直接从微软下载该小型程序程序。此工具仅适用于评估\
  \ Windows 终端和服务器，因此如果组织运行的是其他系统，该工具将无法在这些平台上工作。图 15-18 显示了使用该工具启动扫描的各种选项。你可以扫描与密码、服务器和数据库配置错误以及缺失的安全更新相关的漏洞。生成报告的输出也可以进行修改，以符合你组织的命名规范。\n\
  \n![Images](img/00126.jpeg)\n\n**图 15-18** 微软基准安全分析器扫描配置界面\n\n分析器生成的报告提供了有关系统中测试了什么以及每项测试结果的信息。对于某些条目，提供了指向可能解决方案的链接。我们本地扫描的完整报告如图\
  \ 15-19。你可以看到漏洞按类型分组，并有一个按影响对结果进行排序的选项。\n\n![Images](img/00127.jpeg)\n\n**图 15-19**\
  \ 微软基准安全分析器详细列出完成扫描的报告\n\n要获取有关任何问题的更多信息，请点击相应的链接。描述是用非技术语言编写的，通常会提供有关漏洞潜在影响的注释。\n\
  \n## 监控工具\n\n网络监控是理解网络正在发生什么的关键任务。无论是通过直接检查数据包捕获、观察流量激增还是检查异常连接，监控都能为我们提供阻止攻击者和提高可用性所需的网络可见性。\n\
  \n## 工具\n\n在本节中，我们重点关注通过收集网络数据来生成关于网络统计数据和图表的软件类工具。表 15-7\n\n**表 15-7** 监控工具比较\n\
  \n## 场景\n\n你接到组织内研发小组成员的一封电话，报告间歇性连接问题。他解释说，问题似乎正在恶化，而且特别令人担忧，因为公司计划在未来几个月内发布新产品。你派遣一名技术人员进行调查，他立即发现一个文件服务器运行过热。当他在服务器上使用\
  \ `netstat` 时，他收到如图 15-20 所示的输出。\n\n![Images](img/00129.jpeg)\n\n**图 15-20** 故障排除期间文件服务器的\
  \ Netstat 输出\n\n你注意到有一个来自不属于研发子网的外部地址的连接。作为调查和故障排除的一部分，你想获得更多关于与该服务器建立的连接类型以及消耗的总带宽的信息。\n\
  \n### MRTG\n\n多路由器流量图表器（`MRTG`）是一种跨平台的网络测量工具，它依赖简单网络管理协议（`SNMP`）交换来生成图表和统计数据。该工具设计非常轻量化，用\
  \ Perl 语言编写，并根据 GNU 通用许可许可证作为免费软件提供。图 15-21 显示了数周网络流量的示例图表。\n\n![Images](img/00130.jpeg)\n\
  \n**图 15-21** MRTG 网络流量输出图表\n\n`MRTG` 运行非常快，能够存储多年的流量日志，而不会导致日志存储需求显著增加。虽然 HTML\
  \ 输出很方便，但它缺乏其他网络监控解决方案所提供的精美界面和关联功能。\n\n### Nagios\n\n`Nagios` 是一个非常流行的监控和告警平台，提供两个版本：`Nagios\
  \ Core` 和 `Nagios XI`。虽然两种解决方案都为网络基础设施提供监控和分析能力，但 `Nagios Core` 是作为开源且免费的解决方案。另一方面，`Nagios\
  \ XI` 需要年度标准或企业版许可。除了费用之外，这两个选项之间的主要区别在于报告和界面选项。`Nagios XI` 允许对仪表板、图表和报告进行高级配置。图\
  \ 15-22 是一个提供快速访问网络资产的仪表板示例。\n\n![Images](img/00131.jpeg)\n\n**图 15-22** Nagios\
  \ XI 网络状态仪表板视图\n\n每个设备的详情直接从仪表板超链接而来，因此有关问题服务器的所有历史信息只需点击即可获取。每个主机详情屏幕（如图 15-23\
  \ 所示）可以以仪表板相同的方式配置，显示与你安全团队需求最相关的图表和屏幕。\n\n![Images](img/00132.jpeg)\n\n**图 15-23**\
  \ Nagios XI 主机详情\n\n### Orion\n\nSolarWinds 是多个 IT 和网络监控工具的提供商。该公司成立于 1999，最初是网络监控软件开发商，后来扩展到虚拟化管理、服务器监控，每项都带有高级报告选项。它的主平台\
  \ `Orion` 为整个 SolarWinds 套件提供了基础。\n\n### Cacti\n\n`Cacti` 是 `RRDTool` 的免费前端，`RRDTool`\
  \ 是一种基于 `MRTG` 的网络记录和绘图工具。与 `MRTG` 一样，`Cacti` 的优势在于其数据采集和可视化的速度。由于其资源需求低，`Cacti`\
  \ 是想要创建快速图表和统计数据的 Web 管理员的热选。图 15-24 是开发者提供的显示，突出对时间的精确控制。\n\n![Images](img/00133.jpeg)\n\
  \n**图 15-24** 显示自定义时间范围的 Cacti Web 界面\n\n### NetFlow Analyzer\n\nManageEngine 的\
  \ `NetFlow Analyzer` 是一种网络流量分析工具，依赖 NetFlow 数据为管理员提供完整的视图。除了基本的带宽监控和业务识别外，`NetFlow\
  \ Analyzer` 还提供了流量整形功能，这对于识别和抑制带宽滥用可能。此外，`NetFlow Analyzer` 通过插件提供一些网络取证和特定的安全功能。在我们的场景中，你可以使用\
  \ `NetFlow Analyzer` 快速识别问题服务器以及其他设备是否表现出相同的行为。\n\n#### 拦截代理\n\n出于分析目的，拦截代理提供了对用户行为的卓越洞察，因为它们位于用户和请求资源之间。作为一种中间设备，拦截代理可以使用多种方式来收集、修改或阻止某些类型的数据。\n\
  \n#### 工具\n\n拦截代理是极其灵活的工具，可以充当代理、扫描器、模糊测试器和 Web 爬虫。[表 15-8](#part0026.html#ch15tab8）详细列了目前使用的三种流行的拦截代理。\n\
  \n\n\n\n\n您的会计团队最近建立了一个新的内部网站，以帮助经理管理预算。该网站将为经理提供当前开支情况的快照和反馈，帮助他们规划未来的运营。会计团队的成员担心敏感团队财务数据的泄露，因此他们请求您的帮助，告知他们哪些数据可能对他人可见，以及纠正这些问题的方法。\n\
  \n## Burp Suite\n`Burp Suite` 是一个集成化的 Web 应用程序测试平台。它通常用于映射和分析 Web 应用程序的漏洞，`Burp`允许在发现和利用漏洞时无缝使用自动化和手动操作功能。在代理模式下，`Burp`\
  \ 将允许用户手动检查从用户到服务器传输的每一个请求。转发或丢弃请求的选项如图 15-25 所示。\n\n![Images](img/00135.jpeg)\n\
  \n* * *\n\n**图 15-25** 代理模式下的 Burp Suite 截获屏幕和选项\n\n尽管 `Burp` 的设计初衷是让人类参与决策循环，但其付费版本确实提供了点点式的\
  \ Web 扫描功能，这对于这种场景可能非常有用。\n\n## ZAP\nOWASP Zed Attack Proxy (`ZAP`) 由于其强大的功能和普及，是\
  \ OWASP 的旗舰项目之一。`ZAP` 利用其位于用户浏览器和 Web 应用程序之间的位置拦截并检查用户请求，在需要时修改内容，然后将其转发到 Web 服务器。这与中间人攻击发生的过程完全相同。`ZAP`\
  \ 也设计供各个级别的安全从业人员使用。图 15-26 显示了仅通过指定目标而进行的攻击结果。\n\n![Images](img/00136.jpeg)\n\n\
  * * *\n\n**图 15-26** 显示活动扫描攻击进的 ZAP 屏幕\n\n在例示例中，`ZAP` 使用已知目录和文件快速构建了一份 `GET` 请求列表以测试该网站。这些位置不应该是公开可见的，因此这里的结果将告知管理员服务器的配置错误和意外的数据泄露。\n\
  \n## Vega\n`Vega` 是另一个用 `Java` 编写的跨平台拦截代理。它通过用户界面或 `API` 提供自动化扫描、注入发现和跨站脚本漏洞发现。其使用方法与\
  \ `ZAP` 类似，用户可以通过识别目标来启动快速攻击。与 `ZAP` 一样，结果列表将包含发现的简要描述、其重要性以及最佳修复方法。提供信息的示例如图 15-27\
  \ 所示。\n\n![Images](img/00137.jpeg)\n\n* * *\n\n**图 15-27** Vega 报告 Apache Web 服务中可能的漏洞\n\
  \n### 漏洞利用工具\n并非所有漏洞都有利用程序，但这些软件缺陷为聪明的程序员提供了扭曲规则以获得未经授权访问的机会。`Exploit code` 是旨在利用软件漏洞来获取系统控制权、访问数据或通过拒绝服务阻止对服务的合法访问的代码。\n\
  \n### 漏洞利用框架\n利用框架旨在为安全团队提供复制攻击和验证漏洞所需的必要工具，以便优先分配安全资源。一些流行的框架通过以直观的方式易于访问已知漏洞、利用程序和安全工具，提供了一系列渗透测试选项。表\
  \ 15-9 详细列出了两个此类框架：`Metasploit` 和 `Nexpose`。\n\n#### 工具\n![Images](img/00138.jpeg)\n\
  \n**表 15-9** 漏洞利用框架对比\n\n### 场景\n在阅读了你几周前准备的漏洞报告后，组织的 CISO（首席安全官）对网络上的资产及其相关漏洞有了更好的了解。她将你的发现提交给公司领导层，随后获得了反馈和额外的信息请求。她把你叫回办公室讨论下一步。她认为最好的做法是识别最严重的漏洞，并应用适当的补丁或补偿控制。\n\
  \n## Metasploit\n许多许多工具一样，`Metasploit` 起于一个开源项目，后来被 `Rapid7` 收购。`Metasploit` Framework\
  \ 本身是免费的，但 `Rapid7` 提供了几个专业选项。`Metasploit` 带有数百个利用程序和有效负载，统称为 `modules`。图 15-28\
  \ 显示了 `Metasploit` 命令行界面。\n\n![Images](img/00139.jpeg)\n\n* * *\n\n**图 15-28** Metasploit\
  \ 欢迎界面\n\n`Metasploit` 的主要优势在于其模块化设计提供的多功能性。利用程序可以与有效负载结合起来利用。图 15-29 显示了一个示例，其中用户针对\
  \ `Windows` 操作系统选择了 `PSExec` 利用程序。\n\n![Images](img/00140.jpeg)\n\n* * *\n\n**图\
  \ 15-29** 该模块可用的利用程序选择和选项\n\n## Nexpose\n`Nexpose` 的核心是一个漏洞发现和管理工具。因为它与 `Metasploit`\
  \ 集成得非常好，因此它是想要快速从分析切换到漏洞利用的安全分析师的自然选择。使用 `Metasploit` 的商业选项之一——即 `Metasploit Pro`——可以连接到\
  \ `Nexpose` 扫描引擎。图 15-30 显示了常规扫描期间发现的漏洞列表，以及该漏洞是否存在利用程序的指示。将 `Metasploit` 集成到 `Nexpose`\
  \ 对于确定和优先处理网络上可利用的漏洞非常有用。\n\n![Images](img/00141.jpeg)\n\n* * *\n\n**图 15-30** 按已知利用程序排序的\
  \ Nexpose 漏洞\n\n### 模糊测试 (Fuzzers)\n软件模糊测试（Software fuzzing）是一种通过向软件中输入随机数据以强制其产生不稳定或崩溃来发现软件缺陷的技术。产生的错误通常可以通过模糊测试软件追溯到根源，以便进行修复和修补。模糊测试很有用，因为程序员无法总是预测软件在面对意外或格式错误的输入时会如何反应。参见表\
  \ 15-10 某些模糊测试器的对比。\n\n#### 工具\n![Images](img/00142.jpeg)\n\n**表 15-10** 模糊测试器对比\n\
  \n### 场景\n你们的人资源团队最近开发了一个面向的在线反馈提交系统，并联系了你的团队，寻求上线前如何测试该系统的建议。由于该应用程序严重依赖用户输入，开发人员已经采取了措施，确保用户输入在执行和存储之前经过清理。然而，他们想要获得额外的保障，并希望对应用程序进行模糊测试，包括\
  \ URL、表单和任何用户生成的内容。\n\n\n\n\n\n# Untidy\nUntidy 是一种流行的可扩展标记语言（XML）模糊器。它用于测试 Web\
  \ 应用程序客户端和服务器，untidy 会获取有效的 XML 并在将其输入应用程序之前对其进行修改。untidy 模糊器现在已成为 Peach Fuzzer\
  \ 项目的一部分。\n\n# Peach Fuzzer\nPeach Fuzzer 是一款强大的模糊测试套件，能够测试广泛的目标对象。Peach 使用基于 XML\
  \ 的模块（称为 `pits`）来提供运行模糊测试所需的所有信息。这些模块可以根据测试需求进行配置。在进行模糊测试之前，用户必须指定测试类型、目标以及任何所需的监控设置。图\
  \ 15-31 列出了用于图像文件和网络协议模糊测试的可用 pits 简列表。\n\n![Images](img/00143.jpeg)\n\n* * *\n\n\
  **图 15-31** 测试期间可用的 Peach 模糊测试模块库\n\n# Microsoft SDL Fuzzers\n作为其安全开发生命周期（SDL）工具集的一部分，微软发布了两种独立的模糊器，设计用于\
  \ SDL 的验证阶段：Minifuzz 文件模糊器和 Regex Fuzzer。然而，微软已经停止了支持且不再提供这些应用程序的下载。图 15-32 显示了\
  \ SDL Regex Fuzzer 的设置界面。\n\n![Images](img/00144.jpeg)\n\n* * *\n\n**图 15-32** 微软安全开发生命周期\
  \ (SDL) Regex Fuzzer 设置界面\n\n## 取证工具\n现实世界中的取证完全在于应用科学方法来调查犯罪情况。它高度依赖于对指纹、DNA 和其他痕迹的收集、保存和分析，以尽可能地构建出发生情况的完整画面。数字取证作为法医学科学的一个分支，依赖于相同的发现原则来构建我们系统在受嫌攻击期间发生情况的时间线。\n\
  \n### 取证套件\n在事后重构发生的情况本质上是一项困难的任务，但我们有很多工具可以协助这一过程。取证套件包含一系列用于发现被认为丢失的数据或可能容易丢失的数据（例如易失性内存）。由于文档是取证的重要部分（特别是在刑事调查中），某些套件会自动记录证据分析的进展。表\
  \ 15-11 详细列出了目前可用的一些常用取证套件。\n\n### 工具\n![Images](img/00145.jpeg)\n\n**表 15-11**\
  \ 取证套件比较\n\n### 场景\n你收到一位在另一公司领导安全团队的朋友提供的线索。他告诉你有影响某些旧旧系统的新类型勒索软件，并与你分享了相关细节。你将这些信息传给了你的团队成员，幸运的是，他们在网络遭受更多损害之前，成功隔离了一台显示出受侵害迹象的机器。然而，你的安全主管表示担心，因为没有任何一个检测系统能够在病毒感染那台机器之前识别出该恶意软件。他想进一步了解发生过程，因此让你去调查那台被隔离的机器。\n\
  \n### EnCase\nEnCase 工具套件在执法部门和政府部门的取证任务中非常受欢迎，因为它具有易于使用的图形用户界面和监管链功能。EnCase 套件包含了用于取证采集、分析和报告生成的工具。EnCase\
  \ 的证据文件（Evidence File）格式是常见的常见的镜像格式之一，部分归功于其高可移植性。镜像卷的数据、元数据和哈希值都包含在一个文件中。\n\n###\
  \ FTK\nAccessData 的 Forensic 证 Toolkit（即 `FTK`）是需要创建硬盘取证镜像的调查人员的热选。FTK 因其内置的日志功能而成为取证分析的喜爱，这使得希望保留分析过程细节的调查人员能够更容易地记录工作。FTK\
  \ 套件包含的常用工具之一是 FTK Imager，它是一个数据预览和卷镜像工具。\n\n### Helix\nHelix3 Pro 是 e-fense 提供的最新多平台取证套件。基于开源的\
  \ Knoppix 启动工具，Helix 允许分析师对所有内部设备进行完全镜像，包括物理内存和硬盘。该程序还包含了用于移动设备分析的工具提供了相同的非破坏性镜像功能。\n\
  \n### Cellebrite\nCellebrite 是一家为移动运营商开发数据传输解决方案的公司，此后已进入移动取证市场。其旗舰产品通用取证提取设备 (UFED)\
  \ 是一种主要面向执法部门和军事社区的便持式硬件设备。通过 UFED，用户可以从指定的手机中提取加密、删除或隐藏的数据。Cellebrite 还在数据提取过程中使用写阻塞等技术提供证据保护。\n\
  \n## 哈希（Hashing）\n哈希是一种常用技术，通过创建一个无论原始文件大小如何的固定大小的较小唯一值来验证文件的完整性。这就像在发送货物前放置防篡封胶带一样，哈希值旨在让文件内容发生变化时变得显而易见。哈希函数依赖于这样一个概念：任何两个文件都不应该具有相同的消息摘要。\n\
  \n### 工具\n目前实际使用的实际上只有两种加密哈希算法：MD5 和各种变体 SHA。其中，MD5 和 SHA-1 已认为存在漏洞。尽管如此，它们（目前）仍然很流行。作为网络安全分析师，你需要熟悉的两个工具是\
  \ `md5sum` 和 `shasum`（见表 15-12）。\n\n![Images](img/00146.jpeg)\n\n**表 15-12** 哈希工具比较\n\
  \n### 场景\n你的一位初级数据库分析师最近完成了新数据库软件的部署。他每天晚上将整个数据库备份到离线地点，并想知道是否有快速的方法可以验证备份文件的完整性。理想情况下，他希望在完成备份后立即进行计算，并直接从命令行完成。\n\
  \n### md5sum\n几乎每个 Linux 变体中都包含了 `md5sum` 程序，这是一个计算文件 128 位 MD5 哈希的简单实用程序。虽然在验证文件完整性方面，MD5\
  \ 比简单的循环冗余检查 (CDC) 更可靠，但已不再推荐使用它，因为研究人员已经发现了修改文件内容而不导致 MD5 哈希发生变化的方法。查看图 15-33，我们可以看到\
  \ `md5sum` 工具是从命令行调用的，紧随命令之后指定文件。生成的输出是文件的 128 位 MD5 指纹。\n\n![Images](img/00147.jpeg)\n\
  \n* * *\n\n**图 15-33** 命令行中的 md5sum 工具\n\n### shasum\n`shasum` 工具的创建是为了快速从文件生成 SHA\
  \ 哈希。与 `md5sum` 类似，该工具直接从命令行计算消息摘要并将其输入到标准输出。图 15-34](#part0026.html#ch15fig34)\
  \ 显示了两个文件 a.txt 和 b.txt 以及作为命令输出的关联哈希。如果不使用任何选项，程序将计算 160 位 SHA-1 消息摘要。使用 `-a` 选项，我们可以指定完全不同的算法。\n\
  \n![Images](img/00148.jpeg)\n\n* * *\n\n**图 15-34** 命令行中的 shasum 工具\n\n\n\n\n\n\
  **注意**：2017 年初，谷歌的一个安全研究人员团队宣布，他们成功演示了对 `SHA-1` 算法的实际攻击，该攻击通过生成两个哈希值相同的 PDF 文件来实现。这种被称为“SHAttered”的碰撞攻击表明，只要有足够的计算能力，攻击者就可以破解支撑许多数字签名、数字证书和文件完整性验证过程的算法。\n\
  \n## 密码破解\n\n攻击者的常见目标是操作系统密码文件。在 Windows 中，`Security Accounts Manager`（`SAM`）文件用户用户密码数据库。在现代\
  \ Linux 环境中，用户信息存储在 `/etc/passwd` 文件中，而密码哈希值存储在 `/etc/shadow` 文件中。正如你可以想象的，这些文件受到系统使用的各种加密方法的保护。然而，如果拥有正确的工具，仍然可能破解这些文件。\n\
  \n### 工具\n\n在安全专业人员中最受欢迎的两种密码破解工具是 `John the Ripper` 和 `Cain and Abel`。尽管它们的功能集非常相似，但之间存在一些细微差别，你可能想要了解（参见表\
  \ 15-13）。\n\n![Images](img/00149.jpeg)\n\n**表 15-13** 密码破解器比较\n\n**John the Ripper**\
  \ `John the Ripper` 是一个开源密码破解工具，最初为 `UNIX` 开发，现在有了许多其他操作系统的变体。图 15-35 显示了该命令行工具的使用选项。`John`\
  \ 使用字典列表进行攻击（字典引用了预编译的可能密码列表），或通过暴力破解（在字符空间中尝试许多可能的组合）。此外，`John` 支持自动检测密码哈希类型，这是操作系统用于防止未经授权查看密码文件的保护措施。`John`\
  \ 的商业版扩展了其已令人印象深刻的哈希支持范围。\n\n![Images](img/00150.jpeg)\n\n* * *\n\n**图 15-35** 命令行中的\
  \ John the Ripper 程序\n\n**Cain and Abel** `Cain and Abel` 是一个 Windows 密码破解工具，可以对嗅获的网络流量或本地获取的密码哈希进行操作。注意，`Cain`\
  \ 官方不支持比 `Windows Vista` 更新的操作系统，在这些现代系统上使用它可能需要变方法。像 `John` 一样，`Cain` 支持字典攻击和暴力破解，还可以使用彩虹表（rainbow\
  \ tables）来加速分析。通常，使用字典的密码破解工具会获取给定的明文，计算哈希，并在密码文件中搜索该哈希。`彩虹表`是预计算的哈希列表，程序将用它对可能的密码进行反向查找。在彩虹表的情况下，只需要搜索哈希，因此这显著加快了破解过程。代价是彩虹表的大小可能非常巨大。\n\
  \n* * *\n\n![Images](img/00009.jpeg)\n\n**注意**：密码破解软件已成功使用了多年，但硬件日益廉价的趋势开启了硬件加速密码破解时代。通过使用由多个图形处理器（`GPUs`）组成的“矿机”，用户暴力破解密码的速度可以比传统的纯\
  \ CPU 方法快几个数量级。\n\n## 镜像\n\n镜像工具无论卷上运行的是什么文件系统，都能从源复制数据。这意味着运行 `Mac OS`、`Windows`\
  \ 或 `Linux` 的硬盘可以使用相同的工具以相同的方式复制。镜像工具通常允许将驱动器的整个内容复制到远程目的地的一个文件中。与普通文件复制不同，取证镜像还包括文件系统的空隙（slack\
  \ space）和空空间，删除文件的残留部分可能存在那里。\n\n## dd\n\n使用 `dd` 工具几乎是制作硬盘位对位位的拷贝的最简单方法。你可以在几乎每个\
  \ Linux 发行版以及 `Mac OS` 中找到该程序。它的主要用途是复制或转换文件，因此在镜像过程中，有几个关于块大小和镜像转换的选项，这些可能有助于后续分析。以下命令将执行硬盘“hda”的位对位复制到名为\
  \ `case123.img` 的文件中，并使用的选项是将块大小设置为 4096 字节，并在遇到错误时用空符号填充块的其余部分：\n\n```\ndd if=/dev/hda\
  \ of=case123.img bs=4k conv=noerror,sync\n```\n\n## 本章总结\n\n尽管这是书中最长的一章，但它本可以更长。作为一名\
  \ `CSA+`，你真的应该熟悉我们在这里描述的每一个工具。理想情况下，你应该精通每种工具。我们的目标不是为你提供我们认为你应该拥有的深度知识，而是对这些必备的职业工具进行高层次的概述。我们希望你以此作为对任何你不熟悉的产品进行自学的跳板。虽然考试只需要你对这些内容有通用的了解，但你对职业工具更深入的知识可能会增强你在现实世界中的表现。\n\
  \n#### 练习\n\n1. 你担心自己在零日漏洞进入你的网络之前阻止它们的能力。以下哪些工具可以让你做到这一点？\nA. `Wireshark`\nB. `Imperva’s\
  \ SecureSphere`\nC. `Metasploit`\nD. `Palo Alto NGFW`\n\n2. 哪类工具最能从各种平台接收信息、将其聚合到存储中、生成警报并允许用户查询数据？\n\
  A. `Interception proxy`\nB. `SIEM`\nC. `uzzer`\nD. `IPS`\n\n3. 以下哪项是漏洞扫描器？\nA. `Bro`\n\
  B. `NAXI`\nC. `OpenVAS`\nD. `Helix`\n\n4. `Metasploit` 属于哪类工具？\nA. 漏洞扫描器\nB. 拦截代理\n\
  C. 密码破解器\nD. 漏洞利用框架\n\n*使用以下场景回答 5–7 ：*\n你公司的内部开发团队刚刚开发了一个部署在面向公共服务器的应用程序。你正试图确保它符合最佳实践且不会向你的系统引入任何漏洞。\n\
  \n5. 如果你想确保 Web 应用程序不明文传输密码，哪个工具是最好的？\nA. `Nikto`\nB. `FTK`\nC. `Burp Suite`\nD.\
  \ `Aircrack-ng`\n\n6. 在对所有想到的输入值进行 Web 应用测试后，你决定尝试随机数据以查看是否可以强制产生不稳定或崩溃。哪个工具最适合此种目的？\n\
  A. `Untidy`\nB. `Cellebrite`\nC. `Cain and Abel`\nD. `Qualys`\n\n7. 你发现了一个漏洞，每当应用程序接收到长度为\
  \ 256 或更大的密码就会崩溃。这是你发现的唯一缺陷，你面临着上线的巨大压力。开发团队需要一周来修复问题。假设你已经在使用它，以下哪些安全工具可能让你缓解风险并允许应用程序在明天上线？\n\
  A. `AlienVault`\nB. `Sourcefire`\nC. `Nessus`\n\n\n\n\n\n# D. Metasploit\n\n*请使用以下场景回答问题\
  \ 8–10：*\n\n你是某大型机构的分析师，正在追踪一个相当复杂的对手，该对手似乎已经攻破了你网络上的主机。从威胁情报源获取的信息，该攻击者的战术、技术和程序（TTPs）包括：在内部受损的主机上合并文件，将它们压缩成一个文件并进行加密，然后将其发送到外部服务器。该内部聚合器在\
  \ TCP 端口 `1337` 上运行着服务器。\n\n### 8. 使用以下哪个工具可能最有效地确定你的内部主机是否有任何一个正在端口 `1337` 上监听？\n\
  \nA. `Snort`\nB. `Wireshark`\nC. `nmap`\nD. `netstat`\n\n### 9. 你发现一个主机在端口 `1337`\
  \ 上运行着非法服务器，并将其移动到隔离的虚拟局域网（VLAN）中以防止数据进一步丢失。下一步是寻找其他可能正尝试与该非法服务器通信的受损主机。你迅速配置了一个具有相同主机名和\
  \ IP 地址的新 Linux 主机，然后在端口 `1337` 上启动了 Web 服务器。哪个工具可以让你跟踪尝试连接到该套接字的受损主机？\n\nA. `tcpdump`\n\
  B. `ifconfig`\nC. `nslookup`\nD. `SHAsum`\n\n### 10. 你想对隔离服务器的硬盘制作取证镜像，然后确保所有复制数据的完整性。哪种工具组合最适合这些任务？（选择两项。）\n\
  \nA. `mv`\nB. `cp`\nC. `md5sum`\nD. `dd`\nE. `shasum`\n\n### 答案\n\n**1. D.** 下一代防火墙（`NGFWs`），例如\
  \ Palo Alto 制造的，可以连接到威胁情报源以快速识别攻击并与他人共享这些信息。它们具有在沙箱中运行应用程序的能力，以便在允许进入网络之前确定是否是安全的。\n\
  \n**2. B.** 安全信息和管理（`SIEM`）系统旨在收集、存储和报告安全信息及事件。\n\n**3. C.** `OpenVAS`（此外 `Qualys`、`Nessus`、`Nikto`\
  \ 和 `Microsoft Baseline Security Analyzer`）是你应该熟悉的漏洞扫描器。\n\n**4. D.** `Metasploit`\
  \ 是最广泛使用的开源利用框架。\n\n**5. C.** `Burp Suite` 是一个集成 Web 应用测试平台，通常用于映射和分析 Web 应用程序的漏洞。它能够拦截网络流量并允许分析师检查每个请求和响应。\n\
  \n**6. A.** 通过向应用程序发送随机值来测试应用程序的工具类称为模糊工具（`fuzzing tools`）。`Untidy`、`Peach Fuzzer`\
  \ 和微软的 `Regex Fuzzer` 都在在本范围内。\n\n**7. B.** `Sourcefire` 是一个入侵防御系统，可以配置为阻止包含问题值的指向\
  \ Web 服务器的流量。列出的其他工具都不是 `IPS`，也无法预期能够执行当前任务。\n\n**8. C.** 尽管列出的任何选项在特定条件下可能有效，但\
  \ `nmap` 是最佳答案，因为你可以用它快速远程地检查网络上的所有主机。`Snort` 和 `Wireshark` 只有在捕获进发该服务器的流量时才能识别服务器。`netstat`\
  \ 需要你远程登录到所有主机并查看端口 `1337` 是否正在监听，这种检查大型网络的方法非常耗时。\n\n**9. A.** `Tcpdump` 可以配置为仅捕获指向本地主机特定端口的流量，这将随着时间的推移收集任何其他受损主机的源\
  \ IP 地址。此外，`tcpdump` 可以捕获数据包并保存到远程共享文件中，这允许你监控其变化，而不是反复检查。\n\n**10. D, E.** `dd`\
  \ 工具通常用于为硬盘驱动器等次级存储设备制作位级取证副本。`cp`（复制）命令或 `mv`（移动）命令理论上可以分别复制或移动特定文件，但它们显然无法对磁盘或文件系统制作取证副本。为了确保数据的完整性，你可以使用\
  \ `md5sum` 或 `shasum`，但后者更优，特别是当你使用 `SHA-256` 或更好的算法时。\n\n## 第五\n\n## 附录和术语表\n\n\
