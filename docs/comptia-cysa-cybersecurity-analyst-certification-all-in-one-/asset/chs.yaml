  \n***\n\n# 引言\n\n如果你能够加入网络安全团队，并立即采取正确的步骤来提高组织的安全态，你将成为非常有价值的资产。如果你不仅能做到，还能与网络中的对手进行白刃战并获胜，那么你对你的组织将是无价的。你无需担心寻找和留住有趣且高薪的工作。但如何在一或两页纸简历的范围内，向潜在的雇主传这些技能呢？使用\
  \ `CSA+` 头衔，就像一张照片，可以胜过千言万语。\n\n## 为什么要成为 CSA+\n\n明确地说，在你的签名行末尾加上四个字母并不会让你成为上一段描述的那种超级明星。然而，它会提高雇主的预期。招聘人员在将简历交给技术专家进一步审查之前，通常会通过寻找如\
  \ `CSA+` 等某些关键术来筛选简历。获得这项认证可以增加你通过第一轮筛选的概率，并为专家在面试期间对你的预期设定一个基准。它让他们知道可以直接进入对话的重要部分，而无需先弄清楚你对网络安全分析师角色的了解程度。这项认证为你的成功奠定了基础。\n\
  \n它还为你终身的自学和发展奠定了基础。准备并通过考试不仅会提升你的知识，还会让你意识到自己还有很多需要学习的东西。网络安全分析师永远不存在知识足够的时候。相反，这是一个需要持续学习的角色，因为防御者和攻击者不断进化他们的工具和技术。`CSA+`\
  \ 的领域和目标提供了一个知识和技能框架，你可以在此规划自己的职业发展。\n\n## CSA+ 考试\n\n`CSA+` 考试在授权测试中心进行，费用为 320\
  \ 美元。它包含最多 85 道题，必须在 165 分钟内回答完毕。要通过考试，你必须在满分 900 分中获得 750 分。测试是基于计算机的自适应测试，这意味着不同的题目将获得不同的分值。考试的大部分由带有四个五个可能选项的短多选题组成。在某些情况下，你必须选择多个答案才能获得全分。大多数问题都非常直接，因此你不应该预期有很多“陷阱”题或歧义。尽管如此，如果你发现自己在两个在某个时刻看起来似乎都是正确的答案之间纠结，也不应该感到意外。\n\
  \n考试的一个独特之处是使用了场景题。你只会看到几道这类题（可能 3 到 5 道），但它们需要大量时间来完成。在这些问题中，你将获得一个简短场景和一个网络地图。地图上会有热点，你可以点击它们获取有关特定节点的详细信息。例如，你可能会点击一个主机查看日志条目或命令行工具的输出。你必须想出多个操作。\n\
  \n## 本书涵盖的内容\n\n本书涵盖了你成为 CompTIA 认证网络安全分析师所需的所有内容。它教你如何管理漏洞、威胁和事件。书中还深入探讨了安全架构、取证和响应。最后，它涵盖了你应该熟悉的工具。\n\
  \n## 参加 CSA+ 的建议\n\n尽管 `CSA+` 考试与其他考试并不完全不同，但以下是一些建议：\n\n- 考试前进行充分休息。\n- 提早到达现场。\n\
  - 在做出选择之前阅读所有可能的选项，即使你很确信。\n 如果 如果问题看起来像是个陷阱，你可能想得了；在选择答案后不要自我怀疑。\n- 当你需要跟踪数据点时，在白擦板上（由监考提供）做笔记。\n\
  - 如果对某个答案不确定，尽力尝试，将其标记为复习，然后继续做下一题；你可能在后面的题目中找到提示。\n- 在处理场景题时，在尝试回答之前阅读所有可用信息。\n\
  - 如果你自己在场景题上花费了很长时间，不要压力；你只会遇到几道题。\n- 不要期望附件（例如日志文件）看起来像真实的；它们会缺失某些元素，但包含了你所需的所有信息。\n\
  \n## 如何使用本书\n\n我们投入了精力将所有必要信息汇书中。现在由你学习并理解这些材料及其各种概念。为了从书中受益最多，你可能希望以下学习方法：\n\n\
  - 仔细学习每一章并确保理解每个概念。许多概念必须完全理解，忽略其中的一两个对你可能不利。\n- 确保学习并回答所有问题。如果任何问题让你感到困惑，请重新学习那些章节。\n\
  - 如果你不熟悉特定主题（例如防火墙、逆向工程和协议功能），请使用其他信息源（书籍、文章等）来获得对这些主题的深入理解。不要仅仅依赖你认为需要通过 `CSA+`\
  \ 考试的内容。\n- 如果你不熟悉某个工具，下载该工具（如果是开源）或试用版（如果是商业性的）并尝试一下。由于我们涵盖了数十种工具，你应该根据自己的熟悉程度来确定优先级。\n\
  \n\n\n\n\n附录 A 中包含的目标映射图旨在帮助你将 CompTIA 的官方考试目标与书中的相关内容进行交叉引用。对于每个考试目标，我们都按照 CompTIA\
  \ 的原始呈现方式提供了参考，并标注了对应的章节号和页码。\n\n## 模拟考试\n\n本书包含了包含 `Total Tester` 考试软件的模拟考试，该软件允许你生成完整的模拟试卷，也可以按章节模块或考试领域生成测验。有关配套软件的更多信息，请参阅附录\
  \ B。\n\n## 第一部分\n\n* * *\n\n## 威胁管理\n\n* * *\n\n* * *\n\n![Images](img/00004.jpeg)\
  \ `第 1 章` 应用侦察技术\n\n![Images](img/00004.jpeg) `第 2 章` 分析侦察结果\n\n![Images](img/00004.jpeg)\
  \ `第 3 章` 应对网络威胁\n\n![Images](img/00004.jpeg) `第 4 章` 安全企业网络\n\n* * *\n\n* * *\n\
  \n## 第 1 章：应用侦察技术\n\n在本章中，你将学习：\n\n- 进行侦察的通用方法\n- 侦察目标时涉及的具体任务\n 正 影响侦察工作的变量\n-\
  \ 侦察时使用的常用工具\n\n* * *\n\n* * *\n\n*知彼知己，百战不殆。*\n\n—孙子\n\n在最初学习如何规划和建立防御位置时，士兵被要求离开自己的外围，像对手一样去检查拟议的防御位置。在许多情况下，一个最初看起来完全合理的战壕会被证明是显而易见且脆弱的；或者结果发现，如果攻击者躲在特定的树或岩石后面，防御者将无法向他们射击。正如作者们愿意从个人经验中承认，这通常是一次大开眼界、尽管有些尴尬的练习。\n\
  \n网络防御长期以来一直受益于同样的练习：如果你使用对手可用的程序和工具查看你的网络，你会看到什么？你的防火墙是否有效地隐藏了内部主机的存在？那些补丁*真的*应用到你的\
  \ Web 服务器上了吗？你的 `DNS` 服务器解析的名称是否多于其范围，或者它是否可能过于活跃？你的服务是否暴露了比你预期的更多的网络拓扑结构？在论坛、招聘网站甚至社交媒体上的疏心发帖是如何损害你的业务安全（`OPSEC`）的？在本章中，我们将介绍对你自己的网络进行侦察的过程，就像你是一个寻找切入点的攻击者一样。在此过程中，我们将涵盖从底层数据包分析到始终脆弱的第\
  \ 8 层：终端用户的一切。\n\n从对手的角度来看，成功行动的第一步是深思熟虑的侦察工作。尽可能获取目标网络的信息不仅可以让攻击者对你的网络有良好的了解，还可能在开始攻击时让工作变得容易得多。许多信息源完全免费免费。这对于对手来说特别有利，因为只需要投入时间就能获得目标的全概况。\n\
  \n### 开源情报\n\n对手来说，在不直接接触目标的情况下获取信息几乎总是更优的。为什么？因为他们接触得越少，留给防御者和调查人员发现的指纹（或日志记录）就越少。在理想情况下，对手可以在无需触碰目标的情况下获得成功破解目标所需的所有信息。`被动侦察`是在不与目标交互的情况下收集目标信息的过程。`开源情报`（`OSINT`）是从公开来源收集数据的过程。\n\
  \n* * *\n\n\n**考试提示**   `passive reconnaissance` 和 `open source intelligence` 术语在某些语境下有细微差别，但它们都用于收集有关任何个人、组织或网络的大量信息。请注意，这些许多操作符是为了允许用户精炼他们的搜索。\n\
  \n\n\n\n\n关于网络的另一个有用信息源是维持互联网运行所所需的多个注册机构。可路由的互联网协议（IP）地址以及域名都需要在全球范围内唯一，这意味着必须有某种机制来确保没有两个实体使用相同的\
  \ IP 地址或域名。我们作为一个全球社区，管理这种去冲突的方式是通过接下来描述的非营利公司来实现的。这些公司提供了有关组织在网络空间中足迹的一些有用细节。\n\
  \n### 区域互联网注册机构\n\n如表 1-2 所示，五家独立的公司控制着全球范围内的 IP 地址分配。它们被称为`区域互联网注册机构`(`RIRs`)，每个机构都有一个分配的地理责任区域。因此，希望在加拿大、美国或大部分加勒比地区获取\
  \ IP 地址的实体将（直接或通过中介）与美国互联网数字注册机构(`ARIN`)打交道。这五个注册机构的活动通过数字资源组织(`NRO`)进行协调，该组织还提供了每个国家分配的`RIR`的详细列表。\n\
  \n\n**表 1-2** 区域互联网注册机构\n\n* *\n\n\n**考试贴士** 你不需要了解`RIRs`，但你确实需要理解通过这些机构以及互联网名称与数字管理机构(`ICANN`)可以获得哪些信息。\n\
  \n### 域名系统\n\n如果没有域名系统(`DNS`)，互联网无法按照今天的方式运行。尽管`DNS`是现代网络中的关键组成部分，但许多用户对其存在及其对 Web\
  \ 正常功能的重要性并不知情。`DNS`是负责将域名（例如[www.google.com](http://www.google.com)）与其服务器的 IP 地址（或地址）关联的机制，反之亦然。没有`DNS`，你必须为你想要访问的任何网站记忆并输入完整的\
  \ IP 地址，而不是使用易记的统一资源定位符(`URL`)。管理员通过在命令行中使用`nslookup`、`host`和`dig`等工具来排查 `DNS` 和网络问题。攻击者也可以使用相同的工具来询问\
  \ `DNS` 服务器，以从推推导出有关网络的信息。在某些情况下，攻击者可以自动化此过程，以跨越许多 `DNS` 服务器，这种做法被称为`DNS 采集`(DNS\
  \ harvesting)。\n\n\n* *\n\n\n**注意** `DNS` 区域传输是由客户端发起的——无论是来自二级 `DNS` 服务器还是网络主机。由于\
  \ `DNS` 数据可被用于绘制整个网络的地图，因此只允许授权的主机请求完整传输是至关重要的。这是通过实施访问控制列表(`ACLs`)来实现的。`绝不`允许向未识别的设备进行区域传输。\n\
  \n每当域名被注册时，注册人都会提供有关该组织的详细信息供公开。这可能包括名称、电话和电子邮件联系信息、域名系统细节以及邮寄地址。可以使用名为`WHOIS`（读作\
  \ `who is`）的工具查询这些信息。`WHOIS` 同时提供命令行和网页版本，可以是事件响应人员和网络工程师的有效工具，但它也是垃圾邮件发送者、身份窃窃以及任何试图获取目标个人和技术信息的攻击者的有用信息收集工具。例如，图\
  \ 1-2 显示了来自 `ICANN` `WHOIS` 网页服务的返回的报告。你应该意识到，某些注册商（你注册网站时通过的服务）提供`隐私`注册服务，在这种情况下，查询返回的是注册商的信息而不是注册人的。虽然这可能对于限制组织的暴露很有用，但代价是，在紧急情况下可能很难联系到该组织。\n\
  \n\n* *\n\n**图 1-2** 来自 `ICANN` `WHOIS` 网页服务的返回的报告\n\n### 招聘网站\n\n提供就业服务的网站对信息收集者来说是福音。想想看：用户自愿提交各种个人数据、完整的职业历史，甚至还有一些个人偏好。除了提供个人识别特征外，这些网站通常还包含成员在更大网络中角色的指示。由于许多账户通常通过电子邮件地址识别，对于攻击者来说，自动化收集这些电子邮件地址轻而易举，这种做法被称为`电子邮件采集`(e-mail\
  \ harvesting)。攻击者可以利用此来获益，例如，利用业务联系人来撰写更具说服力的钓鱼邮件。\n\n\n### 社交媒体\n\n社交媒体网站也是个人信息的极具针对性的来源。与招聘网站一样，攻击者可以使用公开信息获取有关个人或公司的信息。从个人页面获取的在线线索使攻击者能够进行`社交媒体画像分析`，即利用目标的偏好和模式来确定其可能的行为。画像分析对于希望利用精准广告的在线广告商来说是一个关键工具。这些信息对于攻击者也有用，可以识别组织中哪些用户可能更容易成为`社会工程`攻击的受害者，在这种攻击中，入侵者欺骗受害者透露敏感信息或以损害系统安全性。\n\
  \n许多攻击者知道进入网络的最佳路线是通过疏忽或未经过训练的员工。在社会工程活动中，攻击者利用欺骗手段（通常受对其目标建立画像的影响）来操纵目标执行不符合其最佳利益的行为。这些攻击有多种形式——从看似来自合法来源的高级钓鱼邮件到请求额外个人信息的电话。钓鱼攻击仍然是网络防御者面临的挑战，因为它们变得越来越具有说服力，经常使收件者泄露敏感信息。\n\
  \n* *\n\n**现实世界中的 OSINT**\n\n\n\n\n其中一名作者被邀请向其员工教授一课程。这门为期一周课程的目标是让他们接触一些他们作为先决条件必须掌握的攻击技术。第一部分的教学是关于侦察的，（老师们）被告知，只要我们不实际上破坏任何系统，就可以表现得相当激进。在为课程准备期间，作者进行了一次相当浅显的操作系统（OS）收集练习，发现了惊人的信息。\n\
  \n从区域注册表开始，我们能够识别出一位名为 Daniel 的个人，并能够了解他的经验和成就。然后，我们在几个招聘网站上查询了该机构，并成功管理了其网络。我们注意到其中一个工具因存在漏洞而臭名昭著。最后，我们在\
  \ Facebook 上查了 Daniel，发现了他最近的一条生日生日动态。在此时，我们本可以给他发一封带有 PDF 附件的电子邮件，或者发一封内容极具说服力的邮件祝他生日快乐——这一切在网络上大约花费了\
  \ 15 分钟。\n\n## 主动侦察\n\n有时，从开源情报（OSINT）中获取的信息会激发攻击者与目标网络进行交互的兴趣。此时，攻击者可能对目标的拓扑结构、网络上可能存在其他主机、各种操作系统或可用服务没有很好的了解。在本节中，我们将讨论攻击者如何使用主动技术获取更完整的网络图的几种方法。\n\
  \n### 扫描\n\n`Scanning` 是一种通过试探并记录响应来获取网络或设备更多细节的方法。自互联网早期以来，攻击者一直在扫描目标试图寻找突破口，从被称为\
  \ `war dialing`（战争拨号）的技术开始。通过使用设备顺序自动拨打号码列表并听响应，攻击者可以判断对面是人还是机器。`Host scanning`\
  \ 是通过发送消息并根据响应对系统进行分类或采取探测措施，并发现系统细节的有效方法。扫描器通常分为：网络映射器、主机（端口）扫描器和 Web 应用漏洞扫描器。\n\
  \n### 网络映射\n\n`network mapping` 的目标是理解网络的拓扑结构，包括解军事化区。在网络映射期间使用的这些操作统称为 `topology\
  \ discovery`。创建网络图的第一步是通过执行“扫射”找出存在哪些设备。与之前的 `war dialing` 示例类似，网络扫射是通过向每个设备发送消息并记录响应来实现的。对此的一种流行工具是\
  \ Network Mapper，更常被称为 `nmap`。在执行网络扫射时，`nmap` 的默认行为是发送 `ICMP Echo Request`、指向端口\
  \ 443 的 `TCP SYN`、指向端口 80 的 `TCP ACK` 以及 `ICMP Timestamp Request`。这四种方法中任何一种的成功响应都是该地址正在使用的证据。`nmap`\
  \ 还具有 `traceroute` 功能，允许它通过巧妙操控数据包的生存时间（TTL）值来映射各种复杂的网络。映射网络后，攻击者可能拥有网络清单，但可能想要填充细节。\n\
  \n### 端口扫描\n\n`Port scanners` 是旨在探测主机或服务器以确定哪些端口开启的程序。它们对于管理员来说是重要的工具。这种枚举主机提供的各种服务的方法是\
  \ `service discovery` 的手段之一。它允许攻击者通过洞察目标上运行的服务来为粗略轮廓添加细节。因为连接网络的设备通常在 `80` 和 `25`\
  \ 等已知端口上运行服务，端口扫描是获取这些设备信息的可靠来源。根据响应时间、响应类型和其他标准，扫描软件可以识别正在运行哪些服务——某些软件甚至可以提供 `OS\
  \ fingerprinting`（操作系统指纹识别）来识别设备的操作系统。然而，识别操作系统并不是完美的，因为软件用于检测的依赖值可能会根据网络配置和其他设置而改变。有了扫描器提供的信息，攻击者可以更有针对性选择哪种攻击可能最有效。\n\
  \n\n**考试提示**：操作系统指纹识别不是门精确的科学。你不应该仅仅因为扫描器将其识别为某个操作系统，就断定主机正在运行该系统。\n\n### Web 应用漏洞扫描\n\
  \n`web application vulnerability scanner` 是一种扫描 Web 应用程序以确定安全漏洞的自动化工具。流行的实用程序中包含了常见的测试，例如\
  \ SQL 注入、命令注入、跨站脚本和服务器配置不当的测试。随着多年应用程序使用量的增加，利用漏洞攻击的频率也随之增加。这些扫描器非常有用，因为它们会自动检查网络上许多系统的许多类型漏洞。扫描通常基于现有的已知漏洞数据库，因此在使用此类扫描器时考虑这一点很重要。尽管从严格定义上说漏洞扫描器没有提供识别现有漏洞之外的任何功能，但某些扫描器提供了额外的关联功能或可以使用插件和\
  \ API 扩展功能。\n\n### 捕获数据包\n\n想象你正坐在去进城的火车上。你注意到两个商人正坐在和你同一节车厢里并聊天。你坐在他们听力范围之外，但根据他们的肢体语言和对话动态，你知道其中一个正在向另一个推销想法，这是一个非常敏感的话题。其中一个显然是供应商，另一个是要求要求的客户。在这种情况下，你可以在没有实际听到他们讨论的任何内容的情况下，对他们的关系做出强力的假设，如果你再靠近几英尺，你可能记录下他们交易的丰人细节。\n\
  \n在网络中，从源到目的地的移动的数据（如果不是目标本身）可能会揭示大量关于通信主机的信息。如果流量是以明文传输的——意味着节点之间没有使用加密——那么任何穿越网络的内容在被截获时都可以被完整地读取。密码、图像、文本和声音都可以从明文传输的流量中轻松恢复——从而凸显了加密的重要性。但仅仅是访问流量移动的方式就可以揭示存在哪些类型的机器。\n\
  \n\n\n\n捕获网络上的原始流量需要专门设计的软件来拦截和解释通过监控接口的流量。这种软件被称为`packet sniffer`（数据包嗅器）或`network\
  \ analyzer`（网络分析器），它记录观察到的数据包并记录事务。数据包嗅器可能会记录数据包的内容，或者只记录一部分称为`header`（头部，或关于数据的数据），以确定流在源和目的之间的流量类型。我们将在本章稍后讨论一种名为\
  \ `Wireshark` 的流行网络协议分析器及其命令行版本 `TShark`。`Wireshark` 和类似的工具允许运行它们的机器在`promiscuous\
  \ mode`（混杂模式）下监控连接的网络，在这种模式下，网卡会监听所有流量，无论这些流量是否是给该机器的。数据包的头部将包含源和目的的信息，网卡会忽略任何不是发自己的数据包。所有的\
  \ Internet 协议版本 4 (`IPv4`）和版本 6 (`IPv6`）数据包都以头部信息开头。`IPv4` 头部的大小可变（在 20 到 60 字节之间），标准\
  \ `IPv4` 数据包的总尺寸最大为 65,535 (`2¹⁶`) 字节。虽然 `IPv6` 的最大数据包尺寸与 `IPv4` 相同，但 `IPv4` 的头部尺寸固定为\
  \ 40 字节。无论哪种情况，捕获头部信息与整个数据流之间都有巨大的大小差异，因此在设置数据包捕获时必须提供更大的存储选项。全捕获的主要优势是能够重构交换的内容（文本、视频、音频或图像）。当然，如果攻击者直接访问目标机器，他可以通过将数据包嗅器设置为记录指定主机接口上的所有流量数据，从而捕获从目标机器到网络上其他主机的所有流量。在没有直接访问主机的情况下，必须采取额外步骤来收集流量。嗅探流量的设置取决于所涉及的网络类型，我们将在下一节讨论软件和硬件要求。\n\
  \n## 特殊考虑因素\n\n在选择执行主动侦察活动的方法时，必须考虑许多变量。例如，目标是有线网络还是无线网络、虚拟还是物理基础设施、内部还是外部主机，以及本地部署还是云环境，这些都会产生不同影响。在接下来的章节中，我们将讨论你应该记住的一些突出问题，特别是当你参加\
  \ `CSA+` 考试时。\n\n### 有线网络考虑因素\n\n在某种程度上，有线网络比其无线兄弟更安全，仅因为它们需要物理上的接近或接触才能从中获取任何信息。显然，由于大多数主机与开放互联网的广泛连接（尽管是通过某种保护机制），这种优势被部分抵消了。\n\
  \n###  own 分用器\n\n对网络基础设施的物理访问应始终被严格控制，因为环境为全流量捕获提供了最佳选择，并可能对网络安全态造成破坏。通过物理方式访问网络，数据包捕获的一种常用方案是网络分用器。第一种被称为`passive\
  \ tap`（被动分用器），不需要额外的电源。在铜介质中，这种分用器将与电缆中的线路建立直接连接，并分割线路上的信号，使得功率继续流向目的地，但有足够的功率引导到分用器供嗅器使用。\n\
  \n同样，被动光分用器试图分割通过光纤的光束并将一部分引导到传感器。虽然这些分用器需要额外的硬件，但如果设备故障，原始信号可能受到很大影响。然而，这种方法存在一些缺点，特别是在千兆速率线线上。千兆连接对功率非常敏感，如果安装了被动分用器，可能会出现高错误率、失真或失败。要分用千兆线路，必须使用`active`\
  \ tap（主动分用器，或主动继电器）。主动分用器在分用器设备中完全终止信号，将信号副本发送到本地接口，并将原始信号移动到转发器。然后该转发器在必要时放大原始信号，并将其传递到原始目的地。这种方法对于千兆线路效果良好，但代价是在链路中增加了另一个电气设备。如果主动分用器故障，整个电路可能会保持断开状态，从而提醒管理员某些情况异常。需要注意的是，使用这些方法分用网络具有改变线路传输特性的潜力。作为安全专业人员，我们应该准备好调查功率、阻抗或错误率的突然波动，因为这些可能是线路被分用的迹象。\n\
  \n### 集线器 (Hubs)\n\n另一种收集方法是直接从中间设备捕获流量。如果由于某种原因，所有主机都连接到集线器，那么只需要监控机通过网线连接到同一设备并启动捕获软件即可。因为集线器平均地共享所有接口进出的流量，它们依赖于连接的主机保持诚实并仅监听分配给它们的内容。一种聪明的技术是攻击者故意引入集线器，将其放置在网络中的瓶颈处，并在那里收集流量。集线器变得越来越罕见，即使在家庭中使用也是，已被更智能的交换机取代。\n\
  \n### 交换机 (Switches)\n\n在交换环境中，数据单元（称为 `frames`）只转发到它们所属的目的地。当每个帧进入交换机时，交换机会会将输入帧的物理媒体访问控制\
  \ (`MAC`) 地址与其现有的地址列表以及交换机上的匹配物理端口进行比较。当找到匹配项时，交换机会将数据转发到相应的接口，然后到达目的设备。`MAC` 地址是在制造期间分配给网卡的不可变值（尽管可以通过操作系统进行伪造），因此在正常情况下，交换机可以确定数据正发往应该去的地方。尽管流交换机的每个数据包都会受到更多的审查，但交换机仍然有数据数据的方法。\n\
  \n在讨论如何在交换网络上实现捕获之前，你理解地址解析协议 (`ARP`）的工作原理非常重要。`ARP` 是网络设备确定特定 `IP` 地址链接到哪个 `MAC`\
  \ 地址的方法。每个主机都维护一个 `ARP` 表，将 `IP` 和 `MAC` 地址相互映射。因此，每当主机需要向某个 `IP` 地址发送位数据时，它会在自己的表中查找相应的\
  \ `MAC` 地址，然后将数据转发到线路上。交换机随后接受该数据并将其转发到正确的目的接口。如果主机不知道某个 `IP` 地址的 `MAC` 地址，它将使用\
  \ `ARP` 请求询问整个网络，例如“谁是 10.10.10.10？”识别出该 `IP` 地址为它自己的机器将回复其 `MAC` 地址。原始发送者随后更新其\
  \ `ARP` 表并将数据发送到目的地。\n\n\n\n\n\n# ARP 毒骗\n在交换环境中，使用名为 `ARP poisoning` 的技术来嗅探流量有两种方法。第一种\
  \ ARP 毒骗方法涉及通过大量的 ARP 回应包来冲击交换机。每当交换机收到 MAC 地址的更新时，它都会调整其内部转发表以反映该变化。如果这种操作足够频繁，表就会溢出，某些交换机将无法正确转发数据，并切换到集线器模式，将所有流量广播到所有接口。\n\
  \n另一种方法涉及篡改网络上特定主机的 `ARP` 表。假设攻击者位于包含 `Host A` 和 `Host B` 的网络中，并对观察它们的对话感兴趣。通常情况下，交换机基于\
  \ MAC 的裁决不会允许这样做，因为攻击者的 MAC 地址不会参与该对话。通过记录 `Host A` 和 `Host B` 的 IP 和 MAC 地址，攻击者可以利用\
  \ `ARP` 固有的信任机制。攻击者的第一步是向 `Host B` 发送一个伪造的 `ARP Reply` 消息，指示 `Host A` 的 IP 地址现在与攻击者的\
  \ MAC 地址关联。对于 `Host B` 来说的是，这条未请求的信息会被视为事实并接受，`Host B` 将更新其 `ARP table`。攻击者随后会对\
  \ `Host A` 执行同样的操作，假装这次自己是 `Host B`，并为未来所有与 `Host B` IP 地址相关的通信提供其自己的 MAC 地址。此时，`Host\
  \ A` 和 `Host B` 的 `ARP tables` 都被毒化了，当它们尝试互相发送消息时，消息最终将流向攻击者。此时，攻击者可以做很多事情，例如捕获数据，甚至修改并将其转发到原始目的地。这被称为中间人攻击\
  \ (`man-in-the-middle`, MITM）。在许多情况下，攻击者进行 `MITM` 攻击的目标是通过插入通信会话中间并充当系统之间的代理，收集登录和身份验证数据、加密密钥或其他任何秘密信息。\n\
  \n## 镜像\n大多数企业级交换机支持一种名为 `port mirroring` 的功能，它可以复制单个端口或选定范围的数据包流量，并将这些包发送到同一设备上的单独输出端口。端口镜像在网络中用于排排除网络问题或便于流量分析，但如果处理不当，即使对于授权的网络管理员，也可能产生严重的法律后果。如果攻击者获得了交换机的访问权限，他可以开启端口镜像并收集通过该交换机的每一比特数据。请注意，接收所有复制包的目标端口活动量将远高于所有其他端口，因此更有可能丢包——在最坏的情况下，可能会无法运行。\n\
  \n\n## 考试提示\n除非在路由器接口上操作或使用 ARP 毒骗或端口镜像，否则通常无法捕获交换网络的所有流量。\n\n# 无线网络注意事项\n无线网络允许通过射频\
  \ (RF) 数据连接对网络进行无绳访问。它们的工作原理是在一个区域覆盖信号以增加设备连接性并降低基础设施成本，因为可能安装的网络接入点较少。它们在设计和保护网络时还引入了需要检查的新领域。由于信号一旦超出组织的物理范围就很难简单地限制，路人可以使用上述任何方法观察网络流量。因此在被动侦察方面，无线网络比其有线对应设备更安全。解决此问题的快速方法是使用安全的加密算法来保护通过网络设备之间的所有流量。这种方法的成本并不高，而且会让攻击者的工作变得困难得多，因为他无法理解任何捕获的数据。\n\
  \n在捕获网络流量时，你还需要额外的考虑。捕获无线流量需要理解主机与接入点之间的关系以及捕获的目标是什么。如果你已经连接到无线网络，并且只是尝试记录网络上连接设备之间的流量，`Wireshark`\
  \ 在这种情况下运行良好。许多无线卡支持混杂模式 (`promiscuous mode`)，就像在有线网络上一样，这种模式允许客户端看到遍历网络的所有流量，前提是客户端已经是网络的一部分。然而，如果你坐在网络外部，并试图了解哪些客户端连接到哪些接入点，你还需要多执行几步。如果客户端机器无法加入无线网络，则无线网卡必须能够在监控模式\
  \ (`monitor` mode）下运行，捕获软件才能看到 `802.11` 数据包。监控模式允许观察者在不关联任何接入点的情况下，监听多个通道上的所有 `802.11`\
  \ 活动。这在收集初始化向量 (`IVs`) 时非常有用，例如在尝试破解过时的有线等效协议 (`WEP`) 时。在许多情况下，网卡可以监听许多通道，但只能在单个通道上捕获。要在多个通道上捕获则需要多张网卡。\n\
  \n## 虚拟化技术\n虚拟化 (`Virtualization`) 是创建和使用计算机和网络资源，以便根据需要随时运行各种操作系统和应用程序实例。虚拟化技术彻底改变了\
  \ IT 操作，因为它们大大减少了提供各种和服务网络功能所需的硬件。虚拟化的持续使用使得大型企业能够在不增加显著开销的情况下，在其 IT 运营中实现极大的灵活性。对于普通用户来说，虚拟化证明是接触新软件和培训的低成本方式。虽然虚拟化从互联网早期就开始存在，但直到\
  \ 2000 年才在企业和家庭计算中取得立。\n\n## 虚拟机程序\n如前所述，虚拟化通过创建逻辑存储、CPU、内存、网络和应用程序的大池并置于公共物理平台上来实现。这通常使用称为虚拟机程序的软件完成，该程序管理物理硬件并执行在多个实例之间共享这些资源所需的功能。简而言之，得益于巧妙的硬件和软件管理，一台物理机可以托管一系列不同的计算机系统，即虚拟机。虚拟机程序分为\
  \ 1 类和 2 类。1 类虚拟机程序也称为裸金属虚拟机程序 (`bare-metal`)，因为虚拟机程序软件直接运行在主机计算机硬件上。1 类虚拟机程序直接访问所有硬件并管理虚拟机操作系统。今天更流行的\
  \ 1 类虚拟机程序包括 `VMware ESX`、`Microsoft Hyper-V` 和 `Kernel-based Virtual Machine (KVM)`。2\
  \ 类虚拟机程序运行在已存在的操作系统内部。这些虚拟机程序就像为操作系统编写的任何其他软件一样，允许虚拟机操作系统共享虚拟机程序可以访问的资源。流行的 2 类虚拟机程序包括\
  \ `VMware Player`、`VirtualBox` 和 `Parallels`。\n\n\n\n\n随着虚拟化软件的成熟，一个名为 `containers`\
  \ 的新分支应运而生。操作系统运行在虚拟机之上，并共享裸机提供的资源；而容器运行在操作系统之上，并共享宿主机操作系统提供的资源。容器软件并不是为客户操作系统抽象硬件，而是为运行在其之上的应用程序抽象操作系统的内核。这使得运行许多应用程序时具有极低的开销，并提高了实例部署的速度，因为不需要为每个应用程序都启动一个完整的虚拟机。相反，可以将应用程序、服务、进程、库以及任何其他依赖项封装成一个单元。此外，每个容器都运行在沙箱中，唯一的交互手段是通过用户界面或应用程序编程接口（API）调用。容器化实现了快速的开发运维，因为开发者可以更快地测试代码，只需更改容器中必要的组件然后重新部署。\n\
  \n## 网络功能虚拟化与软件定义网络\n\n既然为了操作系统和应用程序而对硬件进行虚拟化是合理的，那么我们可以推论，可以用虚拟克隆来替代各种网络功能的自定义硬件。这就是网络功能虚拟化（NFV），它是大规模数据中心和云计算资源的关键组件。路由、交换、入侵防御和负载均衡等关键功能都可以由运行虚拟化设备的同一硬件提供。NFV\
  \ 严重依赖于 `orchestration`（编排）的概念，即虚拟资源的自动配置和管理。更进一步，这种对网络功能的管理（包括流量分析和优化）是软件定义网络（SDN）的核心。SDN\
  \ 最大的特征是网络控制部分和数据部分的分离，允许网络独立于所使用的硬件进行演进。SDN 和 NFV 是互补的，并预示着网络架构和管理的重大转变。\n\n##\
  \ 安全\n\n从安全的角度来看，虚拟机监控为企业的运营增加了多项益处。虚拟化增加了系统的深度，使得攻击者更难准确感知真实环境的状况。再加上使用虚拟工具不断更改网络拓扑的能力，这从根本上改变了对网络进行侦察的成本。这种投入的增加通常足以阻止许多攻击者，因为他们往往会选择去寻找更容易攻克的“目标”。\n\
  \n容器化的普及也让层 7 安全（或 `application-layer` 防墙）得以实际应用。传统做法的一个主要问题是，如果通过对低级协议的限制来为范围应用程序定义所有必要的规则是非常费力的，甚至是不可能的。例如，标准防火墙可以很容易配置为拦截除\
  \ HTTP 流量以外的所有内容。然而，通过 80 端口到达攻击（如 SQL 注入和跨站脚本攻击 XSS）仍然被允许，因为这些防火墙将此类恶意代码视为有效请求。由于无法从第\
  \ 3 层或第 4 层轻松区分恶意和正常的应用程序数据，传统的防火墙不再适用于我们日益多样化的应用程序环境。应用层防火意味着管理员拥有更细粒度的控制权，并且允许或拒绝特定的\
  \ Web 应用程序请求。\n\n## 云计算\n\n`Cloud computing`（云计算）是一个用于描述由高性能、分布式计算所支持的广泛服务的术语。`on-premises`（本地部署）解决方案要求硬件和软件物理上位于组织内部，而云解决方案通常只需要与提供者建立网络连接，大部分计算和存储都在提供者处进行。在描述云提供的功能时，我们将分为三类：基础设施即服务（IaaS）、平台即服务（PaaS）和软件即服务（SaaS）。\n\
  \n### IaaS\n\n基础设施即服务（IaaS）为用户提供了对云服务提供商托管的计算平台的完全管理控制权。一个示例是启动一个 Windows 2012R2\
  \ 服务器实例，然后你可以按照任何你的方式对其进行配置。云计算对企业极具吸引力，因为它减少了对硬件解决方案的预投入，而这些硬件随着技术进步必须不断更换。公司现在不再按照传统的周期购买硬件，而是可以订阅\
  \ IaaS 服务来执行相同的任务，而无需担心具体如何执行。此外，公司可以更容易地进行扩展，而无需等待安装他们未计划需要的计算或存储设备。\n\n### PaaS\n\
  \n在平台即服务（PaaS）中，用户可以访问一个通常构建在服务器操作系统上的计算平台。例如，你可以启动一个预配置为提供 Web 服务的 Windows Server\
  \ 2012R2 实例，而不是自己构建它。然而，服务提供者通常负责配置和保护平台，因此用户通常不会获得整个平台的管理权限。这就是现代开发团队在编程项目上实时协作的方式。它包含了使用通用环境开发、测试、部署和维护应用程序所需的各种服务。在容器化等技术的推动下，PaaS\
  \ 允许来自不同贡献者的开发运维工作。\n\n### SaaS\n\n软件即服务（SaaS）为用户提供了对服务提供者托管的特定应用程序的访问。SaaS 受欢迎的原因在于，随着用户在移动平台上生成和共享内容，将软件移动到\
  \ Web 端的需求应运而生。用户不再从本地安装的应用程序工作，软件而是从中心位置运行并在那里进行管理。用户不再负责安装、妥善执行补丁和应用更新。相反，他们只需要使用软件提供的网络界面，其他一切都在后台完成。\n\
  \n## 安全\n\n云通过提高应用程序的可用性和速度增强了易用性，让普通用户更容易利用技术带来的好处。然而，由于许多资源是去中心化的，身份管理的挑战随之出现。对于访问计算机资源、应用程序和数据的身份验证（这些内容都可能是移动的）是一项挑战。\n\
  \n## 防御侦察\n\n\n\n\n侦察无处不在，且对于攻击者来说是一项低成本活动。虽然采取负责任的网络行为至关重要，但试图完全隐藏你的公开足迹可能是不现实的，特别是当你的组织高度依赖公共形象时。因此，最佳防御是对自己的网络进行扫描。定期识别网络中的关键点，并对你的组织进行漏洞扫描，一旦发生实际事件，将产生丰厚的回。这包括定期对可疑流量进行`log\
  \ reviews`（日志审计），以及检查防火墙和路由器访问控制列表（ACL）的最新性。请记住，现代网络设备可以就其观察到的活动生成海量数据，这可能导致人工审查不再一项合理的任务。日志有多种形式，是关于系统或跨网络发生某些事件的简短说明。`syslog`\
  \ 是一个广泛使用的报告和存储消息标准示例。根据网络流量的大小，每天可能会生成数千条 syslog，因此找到一种管理消息的方法至关重要。解决这一问题的方案是使用`security\
  \ information and event management (SIEM)` 系统。通过聚合设备日志，SIEM 为分析师和管理员提供了详细的监控能力、事件关联以及仪表板视图。\n\
  \n## 职业工具\n\n有大量的工具可用于环境侦察。本节中的列表并非详尽，但它包含了一些你作为分析师工作时需要了解、且对于通过 CSA+ 考试非常有用的知名工具。此列表仅应作为你自学的起点。\n\
  \n### nmap\n\n`nmap` 由安全研究人员 Gordon Lyon 于 1997 年创建，是网络扫描的事实标准。虽然最初是为 *nix` 操作系统编写的，但\
  \ `nmap` 经过用户社区的持续更新，并根据免费软件许可提供 Linux、Windows、Mac OS 以及其他各种系统。`Nmap` 的主要功能包括主机发现、端口扫描、版本检测和操作系统识别。图\
  \ 1-3 显示了搜索设备开放端口的 `nmap` 命令行输出。\n\n\n**图 1-3** 搜索设备开放端口的 `nmap` 命令行输出\n\n### Nikto\n\
  \n`Nikto` 是另一个支持良好的开源软件示例。`Nikto` 主要作为主动侦察工具，通过执行数千次测试来确定 Web 服务器的漏洞。在评估之后，`Nikto`\
  \ 会提供违规文件名以及指向开源漏洞数据库（OSVDB）条目的引用，该条目解释了该漏洞。图 1-4 显示 `Nikto` 报告 Web 服务器上的多个潜在漏洞。\n\
  \n\n**图 1-4** 报告 Web 服务器上的多个潜在漏洞\n\n### OWASP Zed Attack Proxy\n\n与 Nikto 类似，开放\
  \ Web 安全项目（OWASP）的 Zed Attack Proxy（ZAP）是一个开源 Web 漏洞扫描器。`ZAP` 可用于评估现有 Web 服务器，但也具有\
  \ Web 代理功能，允许用户捕获并操纵通过它的网络流量。开放 安全项目（OWASP）是一个非营利组织，其目标是维护和促进 Web 应用程序部署和使用的最佳实践。作为一个社区支持的组织，OWASP\
  \ 通过其网站和现场活动提供各种材料。\n\n### Nessus\n\n`Nessus` 是一种漏洞扫描器，最初是一个免费的安全扫描器。虽然 `Nessus`\
  \ 现在是专有软件，但其插件集非常庞大。`Nessus` 由两个主要部分组成：软件守护进程和 Nessus 服务器。`Nessus` 包含了基本的端口扫描功能，但其真实实力在于全面的配置检查和报告。`Nessus`\
  \ 将检查漏洞、常见的配置错误、默认密码的使用以及合规性水平。\n\n### netstat\n\n`netstat`（网络统计）存在于每个主流操作系统中，是一个命令行实用工具，用于显示网络连接、接口统计、监听端口和进程标识符。`Netstat`\
  \ 提供了一种快速检查给定主机上谁在与谁通信的方法。例如，命令 `netstat -l`（小写字母 L）将显示所有正在监听的端口。虽然我们预期服务器会有各种此类端口，但工作站应该只有少数几个。\n\
  \n### tcpdump\n\n`Tcpdump` 是一种用于显示通过网络传输的网络数据包的原始输出的命令行工具（参见 图 1-5）。虽然 `tcpdump`\
  \ 有一些超出打印数据包内容之外的功能，但它因在进行数据包分析时的简单易用而闻名。请注意，该程序需要管理员权限才能以混杂模式捕获流量。\n\n**图 1-5**\
  \ `tcpdump` 捕获数据包\n\n### Wireshark/TShark\n\n`Wireshark` 及其命令行版本 `TShark` 是两种网络协议分析器，或称\
  \ `packet analyzers`。`Wireshark` 是网络工程师、安全分析师和攻击者不可或缺的工具。该开源软件适用于 Mac OS、Linux 和\
  \ Windows，其工作方式与 `tcpdump` 类似，但也提供了数据包类型的图形化表示和高级过滤。`Wireshark` 可以直接与某些有线和无线网卡交互，允许用户将设备设置为混杂模式以进行更完整的网络捕获。在捕获完成后，`Wireshark`\
  \ 提供统计分析和制图功能。\n\n### 入侵检测与防御系统\n\n保护网络的关键功能是识别跨网络或主机的可疑行为。入侵检测系统（IDS）的目的是识别可疑行为。`IDS`\
  \ 以软件产品或硬件设备的形式存在，通过定期审查网络事件并进行分析以寻找入侵迹象来工作。IDS 不仅仅是防火墙，防火墙根据定义的规则集允许或拒绝流量。相反，IDS\
  \ 通过匹配已识别的恶意活动或分析网络流量的指标来工作。某些 IDS 具有额外的功能，可以在识别出恶意活动后采取行动并停止流量或隔离主机。这些 IDS 设备被称为入侵防御系统（IPS）。如果\
  \ IDS/IPS 设置为跨网络工作，则也可以称为网络入侵检测系统（NIDS），而在单个主机上运行的系统被称为主机入侵检测系统（HIDS）。\n\n### 章节复习\n\
  \n\n\n\n\n防御网络攻击者的手段与防御物理攻击者非常相似。就像任何出色的军事指挥官一样，复杂的攻击者会花费大量精力，通过了解目标的能力来为攻击做准备。他知道，获取目标行为以及其防御和进攻能力的知识对于行动的成功至关重要。攻击者从通过公共渠道、招聘网站和社交媒体搜索收集有关网络用户的公开信息开始，通过这些用户，可以对目标网络有更深入的了解。一旦发现了潜在的切入点，攻击者可能会通过技术工具进行探测，转向更主动的探索，以获取系统架构、网络拓扑和网络策略。例如，获知目标正在使用特定版本的防火墙，将有助于敌人将其精力集中在开发针对该设备的利用程序上。防御侦察是棘手的，因为攻击者所依赖的信息与合法用户访问服务或进行通信时使用的信息是相同的。剩下的问题是，你如何通过了解组织的足迹来最好地保护它？了解组织从外部看起来是什么样的——通过攻击者的视角——是非常重要的。\n\
  \n### Questions\n\n1. 1. 下列中哪一项*不*被视为被动或开源情报侦察的形式？\n   - A. Google 攻击（Google hacking）\n\
  \   - B. `nmap`\n   - C. ARIN 查询\n   - D. `nslookup`\n\n2. 2. 下列哪些传输是 `nmap` 默认主机扫描行为的一部分？\n\
  \   - A. ICMP 回显响应（ICMP Echo Response）\n   - B. 往端口 80 的 TCP FIN\n   - C. 往端口 80\
  \ 的 TCP ACK\n   - D. 往端口 53 的 UDP SYN\n\n3. 3. 为什么操作系统 (OS) 指纹是不精确的？\n   - A. 主机可以运行多个操作系统。\n\
  \   - B. 某些主机同时运行 IPv4 和 IPv6。\n   - C. 无法区分主要的操作系统。\n   - D. 操作系统族（如 Linux）的变体可能很难区分。\n\
  \n4. 4. 邮件采集对以下所有原因都有用，除了哪一个？\n   - A. 收件箱名称通常与活动用户账户名相同。\n   - B. 公开的地址更有可能收到钓鱼邮件。\n\
  \   - C. 电子邮件地址可以帮助产生用于目标的额外个人信息。\n   - D. 很难找到特定个人或组织的电子邮件地址。\n\n5. 5. 在进行有线与无线侦察对比时，关键的考虑因素是什么？\n\
  \   - A. 无线侦察需要物理访问。\n   - B. 无线侦察可以在几千英外进行。\n   - C. 有线侦察需要用户凭据。\n   - D. 有线侦察产生的结果比无线侦察少。\n\
  \n参考以下图回答 6–8 ：\n\n6. 6. 关于该扫描，以下所有陈述中哪一项可能是错误的？\n   - A. 扫描器和主机之间有一个防火墙。\n   -\
  \ B. 扫描是使用 `Kali Linux` 执行的。\n   - C. ICMP 回显请求（ICMP Echo Request）是扫描的一部分。\n   -\
  \ D. 扫描器正试图识别目标的操作系统。\n\n7. 7. 目标上运行着哪种服务？\n   - A. HTTP\n   - B. RPC\n   - C. POP\n\
  \   - D. CPE\n\n8. 8. 关于目标主机，以下哪些陈述可能是错误的？\n   - A. 它与扫描器处于同一子网。\n   - B. 它作为一个虚拟机运行。\n\
  \   - C. 它距离扫描器远。\n   - D. 它运行 Windows 7。\n\n9. 9. `netstat` 可以提供以下信息，除了哪一个？\n \
  \  - A. 监听端口\n   - B. 远程连接的主机 IP 地址\n   - C. 打开 socket 的程序名称\n   - D. 开启 socket\n\
  \n使用以下场景回答 10–12：\nRobbie 是某公司的安全管理员，需要确保员工遵守操作安全（OPSEC）。所有员工都接受了社交工程学（特别是钓鱼）的培训。Robbie\
  \ 想要从外部验证他们正在实践。\n\n10. 10. 在测试员工 OPSEC 时，Robbie 可以执行以下哪项？\n    - A. 在 Facebook\
  \ 和 LinkedIn 页面搜索敏感信息。\n    - B. 尝试破解 Facebook 或 LinkedIn 的密码。\n    - C. 监控对社交媒体的使用。\n\
  \    - D. 在 Facebook 和 LinkedIn 上加好友。\n\n11. 11. 测试同事对钓鱼脆弱性的最佳方法是？\n    - A. 向工作地址发送钓鱼邮件，并对中招的人提供额外培训。\n\
  \    - B. 监控入站钓鱼邮件并记录谁中招。\n    - C. 在邮件关拦截钓鱼攻击。\n    - D. 向个人地址发送钓鱼邮件。\n\n12. 12.\
  \ Robbie 可以通过以下方式测试同事对社交工程的反应，除了？\n    - A. 托词（Pretexting）\n    - B. 叉式钓鱼（Spear-phishing）\n\
  \    - C. 足迹探测（Footprinting）\n    - D. 尾随（Tailgating）\n\n### Answers\n\n1. 1. B.\
  \ `nmap` 是一种需要与测试系统直接交互的扫描工具。其他所有响应通过查询中间源来实现某种匿名性。\n\n2. 2. C. `nmap` 的默认行为是发送\
  \ ICMP Echo 请求、往端口 443 的 TCP SYN、往端口 80 的 TCP ACK 以及 ICMP 时间戳请求。\n\n3. 3. D. 虽然像\
  \ `nmap` 这样的扫描工具可能会推断出操作系统的主要版本（如 Windows 或 Linux），但很难确定具体的变体（例如 Windows 的服务包，或\
  \ Linux 的 CentOS 与 Ubuntu）。此外，老明的防御者可以配置其外部访问的主机报告错误的操作系统。\n\n4. 4. D. 可以利用许多技术和工具来单独或批量获取电子邮件地址，因此这并不是一件困难的事情。\n\
  \n5. 5. B. 有线与无线侦察的关键区别在于，前者需要物理连接，而后者可以在空中远距离进行。事实上，通过使用高增益定向天线，可以在几英里外连接到无线网络。\n\
  \n\n\n\n\n### 6. A. 扫描显示目标主机可能正在运行 Windows 7。该系统防火墙的默认行为是阻止对所有端口的未经请求的访问。这意味着，如果防火墙已启用，扫描将不会报告任何开放端口。\n\
  \n### 7. B. 你可以判断远程过程调用 (RPC) 服务正在运行，因为 TCP 端口 `135` 是开放的，而且因为该服务被命名识别为在其他许多端口上运行。\n\
  \n### 8. C. 扫描显示到该主机的网络距离为一跳，这意味着目标和扫描器之间是直接连接的。\n\n### 9. D. 尽管可以将运行的进程或端口与特定用户相关联，但\
  \ `netstat` 并不提供这一功能。\n\n### 10. A. 在列出的方法中，只有搜索公开可用信息是 Robbie 允许允许的。所有其他选项至少违反了服务条款，最坏的情况下则触犯了**法律**（例如，猜测密码）。\n\
  \n### 11. A. 进行内部模拟钓鱼活动是评估组织应对此类威胁安全态势的常用方法。在没有用户明确同意的情况下，绝不应对个人电子邮件地址使用此方法。\n\n\
  ### 12. C. 足迹探测（Footprinting）是一种侦察技术，而不是社会工程技术。\n\n***\n\n# 第 2 章：分析侦察结果\n\n在本章中，你将学习：\n\
  \n- 在分析中需要考虑的数据源\n- 实时点数据分析\n- 数据关联与分析\n- 安全分析中常用的工具\n\n*专家拥有的数据往往比判断力多*。\n— 柯林·鲍威尔\
  \ (Colin Powell)\n\n进行侦察只是开始；你必须知道如何对收集到的信息进行处理。然而，如果有选择，一种更好的方法是确定你想要问的问题，确定为了回答这些问题需要哪些信息，然后进行能够产生这些可操作信息的侦察。在上一章查看了网络侦察的常用方法后，我们现在转向如何集中这些精力，以帮助我们识别和描述基于网络的威胁。\n\
  \n## 数据源\n\n除了我们在上一章中讨论的外部收集网络信息的手段和方法外，一个良好的信息系统中并不缺少数据源。在确定我们面临的威胁时，同时考虑内部和外部数据是非常关重要的。每个源都有其自身的优势和局限性，我们通常可以通过仔细规划信息收集活动来平衡这些。在接下来的章节中，我们将考虑几乎在任何网络上可用的常用数据源。\n\
  \n### 防火墙日志\n\n人们广泛认为，仅靠防火墙无法保护信息系统甚至是其边界。尽管如此，它们仍然是任何安全架构的重要部分。从根本上说，防火墙旨在根据某些规则限制两个或多个网络接口之间的数据流。这意味着它必须检查到达任何接口的每一个数据包，以确保符合防火墙配置文件指定的任何策略。无论数据包是被接受、拒绝还是丢弃，防火墙都会生成包含详细信息的日志记录，这些细节可以帮助我们预防或从事件中恢复。\n\
  \n***\n\n![Images](img/00009.jpeg)\n\n**注意** 注意入站和出站流量很重要。某些事件在一种流量中比另一种更容易检测。\n\
  \n防火墙日志中包含的信息量是可以配置的。大多数防火墙记录的一些相当通用参数在表 2-1 中描述。默认情况下，大多数防火墙为任何事件响应提供充足的日志。尽管如此，如果开始调查却发现一位心良好的防火墙管理员精简了设备在日志中存储的信息量，这可能是令人沮丧且毫无帮助的。没有办法恢复从未被捕获的日志数据。\n\
  \n![Images](img/00015.jpeg)\n\n**表 2-1** 典型防火墙日志字段\n\n### 入侵检测/防御系统\n\n在价值威胁数据方面，比防火墙日志更进一步的是入侵检测系统\
  \ (IDS) 和入侵防御系统 (IPS) 的日志和警报。两者的区别在于前者在检测到疑似威胁时仅生成警报，而后者会主动阻止它们。通常让这些系统在发现威胁方面更有帮助的是，它们的规则语言通常比防火墙更强大。防火墙只会允许、丢弃或对一组简单的规则或启发式方法报警，而\
  \ IDS/IPS 可以寻找特定的签名或行为。图 2-1 显示了源自相邻节点的 Snort 警报。\n\n![Images](img/00016.jpeg)\n\
  \n***\n\n**图 2-1** IDS 警报示例\n\n***\n\n![Images](img/00005.jpeg)\n\n**考试提示** 下一代防火墙\
  \ (NGF) 结合了防火墙和 IPS 的功能。除非另有说明，否则假设 IDS/IPS 不是 NGF。\n\n### 数据包捕获\n\n显然，我们从防火墙或 IDS/IPS\
  \ 日志中获取的信息是有限制的。更进一步的方法是捕获通过网络接口的所有数据包。这种方法有时被称为全捕获（full capture），尽管它看起来可能过分甚至成本高昂，但有时它是有意义的。事实上，许多金融机构采取这种方法，以确保他们有足够的数据来支持任何网络调查。产生的数据集适用于大数据分析，这反过来可以为攻击者可能正在被检测的新工具和技术提供见解。我们将在本章晚些部分回到大数据话题。\n\
  \n广义地说，在网络上捕获数据包有两种方法：头部捕获（header captures）和全包捕获。正如术语所示，区别在于我们是只捕获 IP 头部还是捕获整个数据包（这将包含负载）。尽管加入全包捕获的热潮可能很诱人，但重要的是，这种方法带来了重大的数据管理问题以及法律问题。拥有这些大型包数据集仅在我们能从中获得可操作信息时才有用。一种方法是在发生重大事件时保留这些数据。尽管如此，这并没有消除在当时能够处理这些数据的需求。有很多解决方案可以存储和检索大型数据存储，因此重点不在于不应该这样做，而是应该进行仔细的工程设计。第二个问题涉及对每个网络通信进行监控的个人隐私可能侵犯。再次强调，这不是不可克服的障碍，但在实施之前必须与法律顾问讨论。\n\
  \n作为回顾，图 2-2 显示了 IPv4 和 IPv6 数据包中的头部信息。如果你对任何字段不熟悉，建议你查阅互联网工程任务组（IETF）针对版本 4 的 RFC\
  \ 791 以及针对版本 6 的 RFC 5871（更新了原始的 RFC 2460）。对于 CSA+ 考试，你需要彻底熟悉 IP 数据包。\n\n![Images](img/00017.jpeg)\n\
  \n***\n\n**图 2-2** IPv4 和 IPv6 头部\n\n\n\n\n\n考试将重点关注 `IPv4`，因此值得回顾一些重点内容。图 2-2 中头部顶部的数字表示位（bits），因此特定的头部长度为\
  \ 160 位（或 20 字节），这是非常典型的。你可能会偶尔看到更大（但绝不会更小）的头部。头部长度（以 32 位字为单位）由第 4 到第 7 位提供（图中标记为\
  \ `IHL` 或 `IP Header Length`），数据包的总长度（包括其有效负载）由第 16 到第 31 位提供。另一个感兴趣的字段是存活时间（`TTL`），它通常从\
  \ 64 到 255 之间的某个值开始，每当接口接收到数据包时减 1。如果 `TTL` 达到 0，接口将丢弃它，并向源地址返回一个互联网控制消息协议（`ICMP`）“超时”消息。这一功能旨在防止数据包无限回传，这也是\
  \ `ping` 工具的工作原理。该工具向目标位置发送一个 `TTL` 为 1 的消息，这意味着第一个接收到它的主机将将其丢弃并响应 `ICMP` 消息。这告诉我们通往目标路径上的第一个主机。该工具随后发送相同的消息，但\
  \ `TTL` 为 2，依此类推。\n\n## 系统日志\n\n如果配置得当，端系统可以记录比许多网络设备丰富得多的数据集。这部分是因为网络流量可以被加密或混淆，但端系统上的操作几乎总是更容易观察。事件日志至关重要的另一个原因是，有许多威胁行为者，他们会在攻击之前或在早期阶段获取域凭据。一旦他们伪装成合法用户账户，你从网络中捕获的数据对你的分析来说将失去很多参考价值。使用真实凭据（即使它们是被窃取的）在整个目标网络中进行横向移动是一种非常常见的技术。\n\
  \n系统日志有多种格式。作为 CSA+ 认证专业人员，你应该熟悉的两种格式是 `Windows Event Logs` 和更通用的 `syslog`。两者都旨在对计算设备上发生的事件进行标准化报告。虽然它们不是唯一的格式，但大多数应用程序在运行于微软操作系统运行时将生成\
  \ `Windows` 格式的事件，否则将生成 `syslog` 格式。此外，还有各种产品可以接收其中一种格式（或任何其他格式）的输入，并将其聚合到一个事件日志中。\n\
  \n## nmap 扫描结果\n\n`nmap` 扫描结果在内容的多样性上不如其他数据源丰富，但它们所产生的信息具有手术级的精确度。此外，使用相同的参数连续运行\
  \ `nmap`，并结合一些脚本，允许用户快速识别目标主机配置的变化。攻击者可能对新服务感兴趣，因为这些服务更有可能存在可利用的配置错误。相反，防御者可能对新服务感兴趣，因为它们可能预示着主机已被入侵。某些组织甚至使用\
  \ `nmap` 通过定期进行全扫描，并将主机和服务与现有基准进行比较，来对网络上的资产进行盘点。\n\n***\n\n![Images](img/00009.jpeg)\n\
  \n**注意** 你可以采取的最重要的防御措施之一是维护网络上所有硬件和软件的准确清目。`nmap` 可以对此提供帮助，但也有各种开源和商业解决方案用于 IT\
  \ 资产管理。\n\n***\n\n## 分析类型\n\n你需要熟悉两种分析类型：时点分析（point-in-time analysis）和关联分析（correlation\
  \ analysis）。顾名义，第一种方法查看与特定时间点或时间窗口相关的数据。这对于事件响应人员来说可能是最熟悉的。第二种方法查看多个数据集，试图寻找可能指向感兴趣事件的模式。\n\
  \n***\n\n### 时点分析\n\n在讨论了我们可以利用的各种数据输出后，我们现在关注转向如何使用这些数据。第一种分析倾向于检查特定时间点的项目，无论它是告警、数据包还是系统事件。正如你可能所知，网络中可以分析的数据量是巨大的。因此，时点分析在我们需要关注某个线索时非常有用。例如，如果\
  \ `IDS` 对特定会话生成了告警，我们就可以对该会话组成的数据包进行时点分析。这种方法在我们需要查看时间记录的系统事件时最有帮助。无论何种方式，我们都是在特定时间点查看单个项目，以发现威胁行为者的更广泛的目标或目的。\n\
  \n### 数据包分析\n\n分析师可以从包捕获数据中提取大量信息。事实上，如果有足够的数据，就可以重建网络安全事件极其精确的时间线。理想情况是在网络中策略性地部署传感器进行全包捕获。产生的数据文件包含丰富的信息，但会消耗大量的存储空间。对于资源有限的安全团队来说，这可能是一个挑战。另一个挑战是在这样的数据包海洋中寻找有用数据。\n\
  \n### 过滤器\n\n过滤器通常有两种用法：捕获和显示。第一种方法通过某些标准限制捕获的数据包。例如，组织可能选择只捕获源或目的地址位于特定网络范围的数据包。这种应用可以是包含组织核心资产的文件服务器。将捕获限制为仅针对该敏感服务器可以降低风险，同时减少对隐私等不利的影响。使用捕获过滤器的明显问题是，对调查有用的数据包可能从未被捕获。\n\
  \n另一种方法是捕获所有内容，但在查看数据时使用过滤器。扩展之前的例子，分析师可以选择只查看针对该敏感服务器的数据包，但如果他们发现其他数据包可能包含有用线索，只需更改显示过滤器即可获得这些数据包的可视性。捕获过多通常比捕获不足要好。\n\
  \n***\n\n![Images](img/00009.jpeg)\n\n**注意** 执行全包捕获可能涉及隐私方面的法律问题。在开始捕获之前，请确保你已经咨询了法律顾问。\n\
  \n#### 加密\n\n\n\n\n\n数据包分析最大的问题之一是，在处理加密数据时，其效用非常有限。分析人员仍然可以访问报头，但内容可能无法理解。众所周知，威胁者利用加密来躲避窥探的视线。解决这一问题的方法是使用\
  \ HTTPS（或“SSL”）代理，这种代理服务器是终止传输层安全协议（TLS）或安全套接层（SSL）连接的服务器，它实际上充当了受信任的中间人，允许组织检查或捕获原本加密的会话内容。如果组织控制了其网络上所有客户端的配置，那么在其浏览器中添加证书颁发机构（CA）并不，这样用户通过加密代理连接到加密网站时就不会注意到任何异常。\n\
  \n![Images](img/00009.jpeg)\n\n**注意** 使用 HTTPS 代理可能涉及隐私方面的法律影响。在利用此功能之前，请确保咨询您的法律顾问。\n\
  \n## 协议分析\n\n数据包分析的焦点是所研究数据包的内容，而协议分析处理的是数据包符合其本应实现的协议的方式。例如，互联网控制消息协议（ICMP）允许回显请求包和回显应包具有负载，只要数据包总长度不超过网络最大传输单元（MTU）。此功能旨在支持诊断消息，尽管在实践中这几乎从未见过。然而，我们确实看到的是威胁者利用该协议建立\
  \ ICMP 隧道，两个主机使用回显请求和应答包创建一个秘密的通信通道。对 ICMP 进行分析将揭示这些通道。\n\n协议分析的另一个应用是确定给定协议的安全性，或者相反，确定其漏洞。假设你购买或开发了一个部署在你的组织系统中的应用程序。除非你对其协议在网络上的具体表达方式有清晰的了解，否则你如何知道它会引入哪些风险？执行协议分析可以简单到嗅探网络流量以确保所有流量都加密，也可以复杂到使用数学模型和仿真来量化意外影响的概率。\n\
  \n![Images](img/00005.jpeg)\n\n**考试提示** 对于 CSA+ 考试而言，你应该关注关注于数据包符合既定协议程度的种类协议分析。\n\
  \n## 流量分析\n\n检测网络中异常行为的另一种方法是查看流量的源和终点。如果你正在实时监控节点的通信，并突然看到一个奇怪的端点，这可能是遭到入侵的指标。诚然，每当有人决定访问新网站时，你都会得到许多假警报。缓解这些假报警的方法是使用自动化（例如脚本）将异常端点与已知或怀疑的恶意主机的\
  \ IP 地址进行比较。\n\n![Images](img/00009.jpeg)\n\n**注意** [VirusTotal.com](http://VirusTotal.com)\
  \ 网站可以快速检查给定 URL 是否被报告为恶意软件，如果是，是由谁报告的。\n\n流量分析也可以以聚合的方式进行，这意味着你监控系统特定部分的流量体积。进入或离开特定主机的流量大幅增加可能表明遭到了入侵。与我们之前监控不寻端点的示例类似，如果没有某些修剪机制，这种方法将导致许多假警报。我们用过的一个有用开源工具称为\
  \ `Etherape`。如图 2-3\n\n**图 2-3** Etherape 描绘了传输大量 HTTP 流量的节点\n\n## NetFlow 分析\n\n\
  NetFlow 是由 Cisco 在 20 世纪 90 年代作为数据包交换技术开发的系统。尽管它担任该角色的时间并不长，但它被重新用于提供网络流量统计信息，这就是为什么它对今天的分析师来说非常重要。它的工作原理是将所有具有以下特征的数据包分组为“流”：\n\
  \n- 网络设备（例如交换机或路由器）的到达接口\n- 源和目的 IP 地址\n- 源和目的端口号（如果不是 TCP 或 UDP，则值为零）\n- IP 协议\n\
  - IP 服务类型\n\n当数据包到达启用 NetFlow 的网络设备且它不属于任何已知流时，设备将为它创建一个新流并开始跟踪任何其他相关数据包。当流在预设时间内没有更多数据包后，该流被认为已结束。启用\
  \ NetFlow 的设备将聚合有关该流的统计信息，例如持续时间、数据包数量和字节数，然后导出记录。NetFlow 收集器将接收数据，在必要时进行清理，并存储。系统的最后一个组件是分析控制台，它允许分析师检查数据将其转换为可操作的信息。\n\
  \n注意，流数据只有在流结束*后*才可用于分析。这意味着这种分析更适用于取证调查，而不是对攻击的实时缓解。此外，NetFlow 捕获的是聚合统计数据，而不是数据包的详细信息。这种分析在调查的早期阶段很有帮助，可以引导分析师指向应详细分析特定数据包（假设组织也在进行数据包捕获）。\n\
  \n![Images](img/00005.jpeg)\n\n**考试提示** 为了知识组织的目的，CompTIA 将数据包分析、流量分析和 NetFlow 分为三种不同的分析类型。实际上，根据定义，数据包分析和\
  \ NetFlow 分析都是流量分析的类型。根据目的和方法，协议分析和无线分析也可以是流量分析类型。这意味着流量分析是一个总术语，数据包、NetFlow 以及有时的协议和无线分析是其子类型。\n\
  \n## 无线分析\n\n在不考虑无线网络影响的情况下，很难运行任何类型的企业网络。即使你不在建筑内完全不允许任何无线设备（甚至是手机），你又如何知道所有员工一直遵守该政策呢？诚然，大多数组织不会（通常也无法）实施此类严厉的措施，这使得无线局域网（WLAN）审计和分析变得尤为重要。\n\
  \n\n\n\n\n要进行 WLAN 分析，必须首先捕获数据。通常，当 WLAN 接口卡连接到无线接入点（WAP）时，客户端设备处于管理模式（managed mode），而\
  \ WAP 处于主模式（master mode）。主模式（也称为 `infrastructure` 模式）意味着接口将负责管理 WLAN 配置的所有方面（如通道和\
  \ SSID）。处于管理模式的客户端由主机管理，因此在收到指令时会更改信道或其他设置。无线接口还可以在网格模式（mesh mode）下直接通信，允许接口与另一个接口直接进行协商，这种关系不分主节点和从属节点（也称为\
  \ `ad hoc` 模式）。在上述三种模式中，接口都被限制为连接到一个网络。为了同时监控多个网络，我们需要第四种工作模式。在监控模式（monitor mode）下，无线接口将看到所有可用的\
  \ WLAN 及其特征，无需连接到任何一个。这是我们进行 WLAN 审计时需要的模式。幸运的是，`Kismet` 等 WLAN 分析器会处理这些细节，让我们只需运行应用程序并查看外部环境即可。\n\
  \n对 WLAN 进行安全分析最重要的一步是了解你的设备。其中最重要的是 WAP，但跟踪无线客户端同样重要。你如何知道发生了异常情况呢？简单来说，就是跟踪“正常”情况是什么样的。在分析\
  \ WLAN 结构时，你必须从已知的良好的接入点和客户端设备列表开始。推测，你的组织安装了（或让别人安装了）所有的 WAP，你应该有一份它们设置的记录（例如协议、通道和位置）以及它们的介质访问控制（`MAC`）地址和\
  \ IP 地址。当你进行定期审计时，将能够判断扫描结果中是否出现了新的 WAP，这可能预示着存在非法接入点（rogue access point）。\n\n寻找非法或未经授权的客户端要棘手一些，因为在许多网络设备上更改\
  \ `MAC` 地址并不困难。事实上，所有主流操作系统都内置了工具，允许你执行此操作。由于终端设备身份的主要指标非常容易被伪造，除非实施某种形式的认证（例如实施\
  \ `WPA Enterprise` 和 `IEEE 802.1x`），否则你可能无法检测到未经授权的节点。如果没有认证，你将很难识别连接到你 WLAN 的最幼稚入侵者以外的所有人员。\n\
  \n### 关联分析\n\n现在，你已经对网络进行了侦察，并在过程中收集了大量数据。此时，你可能拥有数据包捕获文件、`NetFlows` 以及来自防火墙、`IDS`\
  \ 和系统事件的日志文件。从何处开始？关于这一点至少有两种学派观点：你可以从手头的工具开始，也可以从一个观察结果开始。\n\n当你使用工具（或一组工具）开始分析时，你可能在遵循一个熟悉的工作流。你用于捕获数据的工具通常会至少包含一些用于分析这些数据的基础工具。即使没有别的东西，大多数大多数工具也提供了过滤器，允许你关注感兴趣的项目。然而，这些功能通常只在那种没有其他可用工具的权宜之计下才有帮助。对于实际的分析工作，你需要一个全面的工具，用以同时查看你所拥有的所有数据。广而言之，这些工具分为三类：\n\
  \n- `安全信息和事件管理 (SIEM) 系统`收集来自各种传感器的数据，对事件进行模式匹配和关联，生成告警，并提供允许分析师查看网络状态的仪表板。最著名的商业解决方案之一是\
  \ `Splunk`，而在开源领域，`Elasticsearch-Logstash-Kibana (ELK)` 栈非常流行。\n\n- `大数据分析解决方案`旨在处理通常超出\
  \ `SIEMs` 范围的海量数据集。`大数据`一词指的是在容量（即记录数量）、速度（新记录添加的速率）和多样性（不同数据格式的数量）方面大到传统数据库无法处理的数据集。大数据平台通常用于补充\
  \ `SIEM`，而不是取代它们。\n- `本地开发的分析解决方案`通常是安全分析师在公司内部开发的脚本。`PowerShell` 和 `Python` 是开发这些工具的流行语言，这些工具通常构建用于在\
  \ `SIEM` 之外或替代其执行非常特定的功能。\n\n另一种分析方法是从观察结果开始，无论产生该结果的工具是什么。基于该观察结果，你提出了一个可以解释它的假设。下一步是通过额外的观察或实验来证明或反驳该假设。如果这听听起来很熟悉，那是因为我们刚刚描述了科学方法，正如你可能想象的，它与安全分析有很大关系。这种方法迫使我们思考跳出可用工具的限制，并提出答案可能不在我们现有数据中的问题。这就是为什么我们在这里简要提一下这一点。如果我们把自己和问题限制在眼前的工具和信息上，我们可能会错过新颖且潜在具有破坏性的攻击。\n\
  \n***\n\n### 关于统计学的简短旁路\n\n统计学的实用知识对于执行严谨的安全分析非常有益。统计学允许我们对数据做出描述性陈述，例如“这是正常的”，然后断言地说明某事不“正常”。尽管我们都根据经验对正常性有一种直觉，但我们都受到各种偏见的影响，这些偏差往往会导致我们得出错误的结论。如果你从未学过（或后来忘记了）统计学，我们强烈建议你温习。如果没有一些统计知识，很难进行某些分析，例如异常和趋势分析。\n\
  \n***\n\n### 异常分析\n\n从根本上说，异常分析试图回答“这正常吗？”的问题。显然，在回答这个问题之前，我们必须建立什么是正常。学习系统正常状态或流的过程被称为\
  \ `basining`（基准化）。虽然我们可以为单个系统创建基准，但有时对系统组创建基准更有帮助。异常分析侧重于测量与此基准的偏差，并判断该偏差在统计上是否具有显著性。最后这部分特别重要，因为一切都在不断变化。异常分析的目的是确定这种变化在正常情况下是否是预期的，或者它是否值得调查。\n\
  \n异常分析的一个应用示例是用户工作站网络流量的突然增加。如果没有基准，我们无法判断流量激增是否正常。假设我们已经对该特定系统建立了基准，而此种流量明显高于任何其他数据点。该事件可以被归类为离群值并被视为异常。但如果我们退后一步，查看工作站集群的基准，我们可能会发现该事件与特定类型用户（例如媒体团队）使用工作站是一致的。偶尔，他们中的某会发送一次突发流量（例如上传一个完成的电影片段），但在大多数时间里他们相当安静。\n\
  \n#### 行为分析\n\n\n\n\n行为分析（Behavioral analysis）与异常分析密切相关，因为它们都试图发现异常行为。事实上，这两个术语经常互换使用或者结合使用，例如`网络行为异常分析`（network\
  \ behavior anomaly analysis）。尽管实践中确实存在差异，但也微乎其微：行为分析通过观察多个相关数据点来定义异常行为。例如，用户在工作时间内向\
  \ Amazon 云平台上传大文件可能是正常行为，但如果该用户在下班后向 Google 云平台上传大文件则是不寻常。因此，与大小、目的地和时间相关的数据点被结合在一起使用。在异常分析的严格解释中（数据点可以孤立地提取），你可能会收到两条告警：一个针对目的地，一个针对时间，然后你必须手动地对它们进行关联。\n\
  \n***\n\n![Images](img/00005.jpeg)\n\n**考试贴士** 你不应该看到要求你区分异常分析和行为分析的题目。然而，你可能会看到这类题目：要求你必须记住它们都是数据关联和分析的示例（相对于时间点数据分析）。你还应该记住，它们都利用了基线（baselines）。\n\
  \n## 趋势分析\n\n趋势分析（Trend analysis）是对随时间变化的模式的研究，以确定这些模式如何、何时以及为何变化。这种技术有许多应用。最常见的是通过跟踪对手行为模式的演变，将趋势分析应用于安全领域。每年，许多著名的安全公司都会发布他们的趋势分析，并根据他们发现的模式对明年做出预测。例如，如果分布式拒绝服务（DDoS）攻击呈现上升趋势和/或向你所在的特定行业发展，这种方法会促使优先考虑\
  \ DDoS 缓解。\n\n## 内部趋势\n\n内部趋势可以揭示新兴的风险领域。例如，你的组织可能存在一种在 `Dropbox` 等云资源中存储越来越多数据的趋势。尽管从业务角度来看这可能完全合理，但它可能会对机密性、可用性、取证调查甚至法规合规性带来新的或增加的风险暴露。通过注意这一趋势，你能够更好地判断在何种情况下风险需要更改策略或购买托管解决方案。\n\
  \n## 时间趋势\n\n时间趋势（Temporal trends）显示了与时间相关的模式。有许多例子表明，组织在周五深夜被入侵，是希望事件直到三天后才被检测到。矛盾的是，因为周末网络上的用户较少，这本应该让告警防御人员更容易检测到攻击，因为背景流量预计会较低。另一个时间趋势可能是季度报告发布前几天事件的增加，或者报税季期间钓鱼尝试的增加。这些趋势可以帮助我们更好地为可能到来的威胁对技术和人力资产做好准备。\n\
  \n## 空间趋势\n\n趋势也存在于特定区域。尽管我们倾向于认为网络空间几乎独立于物理世界，但实际上，每个设备都存在于非常特定的地点（移动设备则是一系列地点）。例如，在员工访问某些国家时，为他们提供一台“一次性”（burner）笔记本电脑是一种常见做法。该设备不允许连接到公司网络，拥有有限的文件，并在用户返回后立即进行数字擦除。这种做法是观察到前往这些国家旅行的设备面临复杂攻击的趋势而产生的。另一个例子是设备连接到当地咖啡馆免费\
  \ Wi-Fi 网络的情况日益增加，这可能导致针对性的安全意识培训，并强制使用虚拟专用网络（`VPN`）连接。\n\n## 可用性分析\n\n有时，我们的重点放在保护系统的机密性和完整性上，以牺牲防止对其可用性的威胁保护为代价。可用性分析（Availability\
  \ analysis）侧重于确定在各种场景下我们的系统对授权用户可用的概率。其中最常见的可能是缓解 DDoS 攻击，这部分通过获取诸如 `Akamai` 等反\
  \ DDoS 公司的服务来实现。这些服务可能价格昂贵，因此可用性分析可以帮助为这些服务提供业务理由，通过确定在何种情况下本地控制将无法应对 DDoS 攻击，以及系统对客户不可用的每个单位时间内组织会损失多少资金。\n\
  \n可用性分析的另一个应用是确定特定资产或一组资产丢失的后果。例如，丢失 Web 服务器、存储会计数据的数据服务器或 CEO 的电脑对业务流程会产生什么影响。显然，你无法在现实中分析你系统中的每种资产，但存在某些关键资源，它们的不可用可能会瘫痪一个组织。对这些资源进行可用性分析，可以阐明如何减轻其丢失的风险。\n\
  \n## 启发式算法（Heuristics）\n\n`heuristic`（启发式方法）是一种“经验法则”，或者更准确地说，一种基于经验而非理论的方法。计算科学中有些问题被证明是无法解决的，但我们能够使用启发式方法来获得足够实用的结果。网络安全中的启发式分析是应用启发式方法以实际（尽管不完美）的方式发现威胁。这种分析常见于恶意软件检测。我们知道无法\
  \ 100% 准确地找到恶意软件，但我们也知道大多数恶意软件样本表现出某些特征或行为。因此，这些就成了我们检测恶意软件的启发式方法。\n\n下一代防火墙（`NGFs`）除了普通的防火墙功能外，还包含恶意软件检测等功能的设备。这种检测通常在\
  \ `NGFs` 中通过对入站数据进行启发式分析完成。第一方法是获取可疑负载，并在 `NGF` 内部或受其控制的特殊监测虚拟机（`VM`）中打开它。然后观察负载的执行情况，寻找具有特征的恶意软件动作，例如自我复制、添加用户账户和扫描资源。显然，某些恶意软件家族可能不会尝试这些动作的任何一个，这使得这种方法具有启发性：它是实用的，但不是保证的。\n\
  \n## 行业工具\n\n网络安全分析师可以使用的工具数量确实是惊人的。你可能已经实验过许多工具，并且每天使用其中一些。尽管如此，CompTIA 想要确保在某些工具类别上具备知识基准。我们在这里并不尝试列出所有（甚至许多）工具，但我们将专注于一些你参加\
  \ CSA+ 考试应该熟悉的工具。\n\n### 安全信息和事件管理系统\n\n网络安全分析师的精髓工具可能是安全信息和事件管理（`SIEM`）系统。我们已经提到了\
  \ `Splunk` 和 `ELK`，但现在我们深入探讨，以确保你了解它们的一些特性。值得注意的是，从技术上讲，这两个系统都是数据分析平台，而不仅仅是 `SIEM`。\n\
  \n\n\n\n在本书编写时，使用 Splunk 的组织多于任何其他 SIEM，这意味着你可能已经与它打过道，或者在未来的某个时候会用到它。Splunk 可以从几乎任何源摄取数据。这些数据随后会被索引并存储。Splunk\
  \ 的功能之一是允许你通过 `Universal Forwarder` 直接将原始数据摄入 `Indexer`，或者你可以使用 `Heavy Forwarder`\
  \ 在源端进行预处理和索引，然后将准备好存储的较少数据发送到 `Indexer`。第二种方法有助于从各个源到索引器需要传输的数据量。当你考虑到大型企业环境每天可能产生数百\
  \ GB 的数据时，`Heavy Forwarders` 就显得非常有意义。一旦到达 `Indexers`，数据将被冗余存储，以提高可用性和生存能力。除了 `Forwarders`\
  \ 和 `Indexers` 之外，Splunk 的另一个主要组件是 `Search Heads`，它们是允许用户搜索和查看数据的 Web 端前端。图 2-4\
  \ 显示了顶部带有搜索栏的 Splunk 界面。\n\n![Images](img/00019.jpeg)\n\n**图 2-4** Splunk Enterprise\
  \ Security 用户界面\n\n### ELK\n\nELK 与说是一个工具，不如说是一个工具系统。该名称是 `Elasticsearch`、`Logstash`\
  \ 和 `Kibana` 的缩写，它们都是开源的且基于 Java 的。这些是 ELK 的三个主要组件工具。`Elasticsearch` 是最流行的搜索引擎之一。它的主要目的是索引数据，以便能够快速地从大型数据集中搜索特定属性。`Elasticsearch`\
  \ 负责存储数据，但与其他数据管理系统相比，它提供的持久性程度并不高。`Logstash` 是一个数据处理流水线，它可以从各种源（如防火墙和事件日志）摄取数据，对其进行转换（例如，从记录中移除个人身份信息，即\
  \ `PII`），然后将其转发到数据存储器（或 `stash`）。`Kibana` 如图图 2-5\n\n**图 2-5** Kibana 的用户界面\n\n\
  ### 数据包分析器\n\n久誉盛名的 `Wireshark` 可能是世界上使用最广泛的数据包分析器。它允许你在捕获数据包时对其进行实时分析，或者从多种捕获文件格式进行离线分析。它有两个特殊特征使其在分析师手中变得极其强大：丰富的过滤器和深度检测。过滤器允许你根据报头或负载值的任何组合来精确定位特定的数据包。由于\
  \ `Wireshark` 理解数百种网络协议，你可以根据协议栈中几乎任何层面的特定报头字段来过滤捕获的数据。它包含了捕获过滤器和视图过滤器，分别限制了捕获的包包或在界面上显示的包包。深度检测功能允许你对任何捕获的数据包进行位级的可视化，这在执行协议分析以查看对手是否滥用\
  \ `DNS` 或 `ICMP` 时非常有用。这种检测能力根据层级划分数据包报头，因此可以清楚你查看的是 `MAC`、`IP` 还是 `TCP` 报头。图 2-6\
  \ 显示了地址解析协议 (`ARP`) 请求的细节。\n\n![Images](img/00021.jpeg)\n\n**图 2-6** 显示数据包详情的 Wireshark\n\
  \n### 入侵检测系统\n\n入侵检测系统 (`IDSs`) 可以从两个维度进行衡量：焦点和方法。焦点可以是基于主机，这使其成为基于主机的 `IDS` (`HIDSs`)；否则，它们是基于网络的\
  \ `IDS` (`NIDSs`)。它们的方法可以是基于特征或异常。最后，它们可以是独立的，也可以集成到另一个平台中，如下一代防火墙。\n\n### Snort\n\
  \n`Snort` 可能是开源社区中最闻名的 `NIDS`。然而，它不仅仅是一个 `NIDS`，因为它可以作为数据包分析器或网络入侵防御系统 (`NIPS`)\
  \ 运行。`Snort` 由 Martin Roesch 在 20 世纪 90 年代后期开发，并以来持续开发。尽管如此，它最广为人知的是其丰富的规则语言以及存在的大量规则。\n\
  \n`Snort` 规则包含两个部分：报头和选项。报头指定了 `Snort` 将采取的动作（例如 `alert` 或 `drop`）以及特定的协议、IP 地址、端口号和方向性（例如，单向或双向）。然而，规则的真正威力在于选项。在规则的这部分，人们可以指定具体在哪里寻找故障的迹象，以及向用户显示什么消息或在日志中记录。以下规则显示了如何检测网络中的后门：\n\
  \n```\nalert tcp $EXTERNAL_NET any -> $HOME_NET 7597 (msg:\"MALWARE-BACKDOOR QAZ\
  \ Worm Client Login access\"; content:\"qazhsq\";)\n```\n\n在此规则中，我们正在寻找目标端口为 7597\
  \ 且包含“qazhsq”的入站 TCP 包。如果发现了这些内容，`Snort` 将发出“MALWARE-BACKDOOR QAZ Worm Client Login\
  \ access”告警。注意规则中可以编写更多选项，例如已知软件的哈希值。\n\n![Images](img/00009.jpeg)\n\n**注意** 威胁情报公司通常会将新发现威胁的\
  \ Snort 签名作为其订阅服务的一部分。\n\n### Bro\n\n`Bro`（或 `Bro-IDS`）既基于特征也基于异常。它不是只查看单个数据包并判断它们是否匹配规则，而是创建本质上无好坏之分的事件；它们只是表示发生了某事。这种方法的优势是\
  \ `Bro` 会跟踪会话以确保它们符合预期，并且会跟踪它们的状态。所有这些数据都会保留，有助于取证调查。然后将这些事件与策略进行比较，以查看是否有必要采取行动。这正是\
  \ `Bro` 威力真正发挥的地方。策略可以执行从发送电子邮件或短信到更新内部指标或禁用用户账户的任何操作。\n\n另一个另一个强大的功能是从网络流中提取完整的可执行文件并发送到另一个系统进行恶意软件分析。这种下载功能在执行取证调查时也有用，例如我们需要确定哪些文件可能被攻击者外泄。由于所有事件（包括嵌入的文件）都存储了，因此可以供以后分析。\n\
  \n### Suricata\n\n`Suricata` 可以被认为是 `Snort` 的更强大的版本，尽管其架构完全不同。它可以使用 Snort 签名，但还可以做更多事情。具体来说，它是多线程的（`Snort`\
  \ 不是），甚至可以利用硬件加速（即使用图形加速器处理数据包）。像 `Bro` 一样，它还可以从数据包流中提取文件用于保留或分析。像 `Bro` 和 `Snort`\
  \ 一样，`Suricata` 也可以作为 `IPS` 使用。\n\n#### 资源监控工具\n\n\n\n\n\nNagios Core 是最流行的开源资源监控工具之一。从高层级来说，它允许你跟踪网络设备的状态，包括工作站、服务器、交换机、路由器，以及任何可以运行\
  \ Nagios 代理或向插件发送数据的设备。对于这些设备中的每一个，它都可以监控特定的指标，例如处理器或磁盘的利用率。当出现问题时，Nagios 会记录该事件，然后通过电子邮件或短信发送通知，或者通过运行可以修复问题的事件处理器来采取特定操作。Nagios\
  \ 的初始设置非常简单，但它的扩展性也足够，能够处理复杂的环境和流程。\n\n## NetFlow 分析器\n\nNetFlow 分析器对于利用 NetFlow\
  \ 收集器提供的数据几乎是必不可少的。在紧急关头，你可以使用数据包捕获工具配合一些脚本，但没有什么比为这项任务配备正确的工具更棒了。NetFlow 分析器从收集器中提取数据，并允许分析师以多种方式查看和查询数据。至少，它提供了查看最近流量并对其进行深入研究以获取细节的方法。一些更复杂的工具将具有针对安全分析师的过滤器，可以帮助识别拒绝服务攻击（DoS）、恶意软件命令与控制以及数据外泄。\n\
  \n毫无疑问，最流行的开源 NetFlow 分析器之一是 `ntopng`。该工具既可以作为 NetFlow 收集器（接收并汇总来自多个设备的数据），也可以作为分析控制台。它还监控各种其他与\
  \ NetFlow 不严格相关的网络参数和数据。该工具具有基于 Web 的界面，可扩展，并运行在大多数 Linux 变体以及 Mac OS 和 Windows\
  \ 上。图 2-7 显示了 `ntopng` 的运行。\n\n![Images](img/00022.jpeg)\n\n图 2-7：ntopng 用户界面\n\n\
  ## 本章总结\n\n获取数据（无论是通过侦察还是例行监控）只是开始。真正的工作是分析这些数据将其转化为信息。在本章中，我们涵盖了执行安全分析的多种方法和工具。对于这些内容，没有一个万能不变的答案，因此，作为网络安全分析师，充分熟悉我们的选项以便为特定任务选择正确的选项至关重要。本章中提到的主题绝不是详尽的，但它们应该对你的\
  \ CSA+ 考试很有帮助，或许更重要的是，作为进一步终身探索的起点。\n\n### 习\n\n**1.** 入侵检测系统 (IDS) 和入侵预防系统 (IPS)\
  \ 之间的关键区别是什么？\nA. IPS 在分析流量时仅依赖于固定规则或启发式算法。\nB. IDS 仅分析 TCP 流量，而 IPS 仅分析 UDP 流量。\n\
  C. IDS 仅检测可疑流量，而 IPS 检测并拦截恶意流量。\nD. IPS 仅检测可疑流量，而 IDS 检测并拦截恶意流量。\n\n**2.** 下列传输中哪项不是\
  \ NetFlow 网络协议提供的？\nA. 源 IP 地址\nB. 目的 IP 地址\nC. 默认网关地址\nD. TCP 源端口\n\n**3.** 对于资源限制的环境，更倾向于哪种数据包捕获技术？\n\
  A. 头部捕获\nB. 尾部捕获\nC. 全包捕获\nD. 载荷捕获\n\n**4.** 为什么除了网络流量之外，分析单个系统日志可能有用？\nA. 终端上的活动通常比网络上的活动更容易观察到。\n\
  B. 无法分析混淆或加密的网络流量。\nC. 终端无法记录其系统活动。\nD. 记录系统活动没有实用的标准。\n\n**5.** 在进行无线分析捕获时，网卡必须支持什么模式？\n\
  A. 管理模式 (Managed)\nB. 自助模式 (Ad hoc)\nC. 网格模式 (Mesh)\nD. 监听模式 (Monitor)\n\n**6.**\
  \ 单次交换穿越网络的最大数据单元称为什么？\nA. ICMP\nB. MTU\nC. TCP\nD. CDMA\n\n使用以下场景回答问题 7–9：你的公司在过去的几个月里经历了显著增长，流量证明现有工具集已无法负担。你的分析团队正在寻找一种解决方案，以管理企业所有设备生成的告警，同时对网络配置的干扰降至最低，他们向你这个驻专家寻求指导。\n\
  \n**7.** 在寻找解决方案时，团队遇到了简称 SIEM。它代表什么？\nA. 模拟事件与管理 (Simulated incident and management)\n\
  B. 安全指标与监控 (Security indicators and monitor)\nC. 安全信息与管理 (Security information and\
  \ management)\nD. 模拟与监控 (Simulations, and monitors)\n\n**8.** 使用新的 `SIEM` 工具，团队意识到可以更高效地进行时间点分析。他们利用\
  \ SIEM 的哪种功能完成此任务？\nA. 查询调查历史活动\nB. 当前流量的可视化\nC. 证书机构 (CA) 验证\nD. 单日志警告\n\n**9.**\
  \ 当你对流量进行全捕获时，下列哪个不是考虑因素？\nA. 识别流量的源和目的\nB. 法律后果\nC. 隐私影响\nD. 数据存储容量\n\n参考以下图解回答问题\
  \ 10–12：\n\n![Images](img/00023.jpeg)\n\n**10.** 数据包载荷（payload）的总大小是多少字节？\nA. 84\n\
  B. 64\nC. 44\nD. 24\n\n**11.** 第一次 ping 请求和回复之间大约经过了多久？\nA. 35 秒\nB. 35 毫秒\nC. 350\
  \ 毫秒\nD. .350 毫秒\n\n**12.** 允许你轻松监控计算机上各种程序、安全和系统活动日志的 Windows 工具名称是什么？\nA. Nmap\n\
  B. 事件查看器 (Event Viewer)\nC. 控制台 (Console)\nD. Putty\n\n### 答案\n\n**1.** C. 入侵检测系统\
  \ (IDS) 仅检测疑似威胁，而入侵预防系统 (IPS) 主动拦截它们。\n\n**2.** C. NetFlow 是由 Cisco 开发的流量分析系统，提供有关到达接口、源和目的\
  \ IP 地址及端口号以及服务类型的信息。默认网关是辅助连接设备访问的网络设备。\n\n**3.** A. 在头部捕获中，仅记录 IP 头部数据进行分析，而全捕获需要更多的存储和处理能力。\n\
  \n\n\n\n\n### 4. A. 监控本地端点事件可以对计算机的进程和网络活动提供极大的洞察。检查本地事件日志是网络分析的极佳补充，能够提供更准确的网络状态图。\n\
  \n### 5. D. 为了捕获无线流量（特别是当其未关联访问点时），网络接口卡必须支持监控模式（monitor mode）操作。\n\n### 6. B. 最大传输单元\
  \ (MTU) 是在交换过程中穿越网络最大的单个数据单元。较大的 MTU 意味着每次交换传输的数据更多，随着时间的推移，由于处理的单元减少，所需的处理能力也较低。然而，这可能会导致延迟增加，因为在给定时间内占用传输线的单元较少。\n\
  \n### 7. C. SIEM，即安全信息和事件管理，是一组结合安全信息管理 (SIM) 和安全事件管理 (SEM) 的安全工具。\n\n### 8. A.\
  \ 时间点分析（Point-in-time analysis）是对对各种数据输出进行分析，以确定在指定时间记录的系统事件。\n\n### 9. A. 在捕获数据包之前必须考虑法律和隐私问题。取决于捕获的持续时间，存储容量可能会成为问题，因此通常会在开始之前确保有可用空间。由于有许多专门用于数据包捕获和分析的免费及商业捕获与分析软件选项，确定源和目的很容易。\n\
  \n### 10. B. 数据包的总大小（84 字节）是头部大小（20 字节）加上负载（payload）的大小。有效负载大小没有显式提供，但可以通过从总大小中减去头部大小来得到\
  \ 64 字节。\n\n### 11. D. Wireshark 中的时间值单位是秒。列出的第一个和第二个值之间的差约为 .350 毫秒。\n\n### 12.\
  \ B. 事件查看器（Event Viewer）是一种实用程序，通过提供一个易于使用的界面来查看系统日志（包括错误、信息和警告消息），帮助管理员排除其计算机上的故障。\n\
  \n***\n\n# 第 3 章\n## 响应基于网络的威胁\n\n在本章中，你将学习：\n- 网络和主机加固实践\n- 提高安全性的欺骗技术\n- 常见的访问控制类型\n\
  - 威胁检测和端点保护的趋势\n\n***\n\n*战争中的欺骗永远不会过量*\n—孙子\n\n如果我告诉你，在诺克斯堡，整个黄金储备库位于一座显眼建筑中心的一个大房间里，建筑上还挂着“此处有黄金！”的霓虹灯牌，你会说什么？12\
  \ 个入口处各驻一名守卫，配备有该地区所有已知黄金盗贼的照片以及用于与其他守卫进行内部通信的无线电。听起来很荒谬，不是吗？这个虚构的情景对攻击者来说是一个梦想，但这种架构正是许多网络目前的配置：边界渗透，哨兵依赖过时数据（仅针对已知威胁）来做出允许谁进入的决策。对于攻击者来说，唯一更好的就是完全没有安全。\n\
  \n事实上，美国金条储备库是一个极其坚固的设施，位于诺克斯堡范围内。诺克斯堡是一个陆军基地，受坦克、武装警察、巡逻的直升机攻击战斗机以及世界上训练最素良的士兵的保护。攻击者即使成功进入了诺克斯堡的大门，他还必须通过额外的安全层，避开铁丝网以及安全摄像头的探测、触碰感器和军犬的监测，才能到达金库。这种设计结合了物理安全领域的一些最佳实践，在严格的操作策略管理下，保护了国家一些最宝贵的资源。受保护最好的网络也以类似的方式管理，在有效利用技术的同时，增加了攻击者的成本。\n\
  \n## 网络分段\n\n*网络分段*（Network segmentation）是将网络的不同部分分离到从属区域的做法。网络分段的目标目标是阻碍对手的努力、改进流量管理并防止敏感数据泄露。从网络的物理层开始，分段可以一直到应用层。在网络链路层提供分离的一种常用方法是使用虚拟局域网（`VLANs`）。配置得当，`VLAN`\
  \ 允许各种主机即使在物理上没有连接到同一个网络设备，也可以属于同一个网络。或者，单个交换机可以支持多个 `VLANs`，大大改进网络的设计和管理。分段也可以发生在应用级别，防止应用程序和服务与其他可能运行在相同硬件上的其他程序进行交互。请记住，在某一层进行网络分段不会传递到更高层。换句话说，如果你还希望根据应用协议进行分段，那么仅仅实现\
  \ `VLANs` 是不够的。\n\n***\n\n### 微分段\n\n随着云使用的增加和现代数据中心为了优化资源共享而演进，管理员继续失去对网络资源的物理控制。虽然这对于某些用例（如机密环境）可能会产生问题，但它为增加*微分段*（micro-segmentation）或应用新的架构和部署模型大门，这些模型包括容器、加密限制、软件定义网络和虚拟化基础设施。\n\
  \n***\n\n### 系统隔离\n\n即使在同一个子网络或 `VLAN` 中，也可能存在只能与某些特定系统通信的系统，如果你看到超出预期范围的大量流量，就很明显出了问题。确保网络中的主机仅与它们应该通信的机器通信的一种方法是实施系统隔离。这可以通过在分段计划之外的网络设备上实施额外的策略来实现。系统隔离可以从通过*物理隔离*（air\
  \ gap）物理分离特殊机器或机器组开始，即这些系统与外部连接的物理分离。这显然存在权衡，因为这些机器将无法与世界上其他部分通信。然而，如果它们只有一个不需要外部连接的特定工作，那么将它们完全隔离是有有意义的。如果需要连接，可以使用访问控制列表（`ACLs`）来执行策略。像防火墙一样，`ACL`\
  \ 允许或拒绝某些访问，并取决于适用于其操作层的一组规则，通常在网络层或文件系统层。虽然系统隔离的做法需要一些预见，但投入时间设置它的所获得的回报是巨大的。\n\
  \n### 跳板机 (Jump Box)\n\n\n\n\n\n为了方便外部连接到网络的分段，管理员有时会指定一台经过特殊配置的机器，称为跳板机（`jump box`）或跳转服务器（`jump\
  \ server`）。正如名称所示，这些计算机作为外部用户访问网络保护部分的跳板点。其思想是防止特殊用户使用他们处理其他事务时所用的工作站登录到特别重要的主机。如果该日常使用的工作站被攻破，攻击者就可以利用它到达敏感节点。另一方面，如果要求这些用户在进行远程连接时使用经过特殊加固的跳板机，那么攻击者想要触及核心资产的难度将大得多。\n\
  \n跳板机的一个巨大优势是，它们可以作为访问受保护网络的外部用户的瓶颈。因此，跳板机通常会启用高水平的活动记录，以供审计或取证使用。图 3-1 显示了网络环境中跳板机非常简单的配置。注意跳板机相对于网络上防火墙设备的位置。虽然指定单一网络访问点可能会提高整体安全性，但对跳板机进行严密监控至关重要，因为该服务器的攻破可能允许访问网络的其余部分。这意味着禁用任何不必要的服务或应用程序，使用严格的\
  \ `ACLs`，保持软件补丁更新，并尽可能使用多因素身份认证。\n\n![Images](img/00024.jpeg)\n\n* * *\n\n**图 3-1**\
  \ 简单跳板机布局的网络图\n\n* * *\n\n![Images](img/00005.jpeg)\n\n**考试提示** 你可能会在考试中看到特权账户用户（例如系统管理员）使用跳板机远程登录到敏感主机的背景场景。\n\
  \n## 蜜罐与蜜罐网络（Honeypots and Honeynets）\n\n信不信由，有时管理员会设计系统来吸引攻击者。蜜罐是管理员非常喜欢的工具，通过故意暴露一台看起来具有极高价值且有时未受保护的机器，来更多地了解攻击者的目标。虽然蜜罐在攻击者看来可能是是合法的，但它实际上与正常网络隔离，并且所有的活动都经过监控和记录。从防御的角度来看，这有几个益处。通过说服攻击者将其精力集中在蜜罐机器上，管理员可以洞察攻击者的战术、技术和程序（TTPs）。这可以用来预测行为，或通过历史数据辅助识别攻击者。此外，蜜罐可能会延迟攻击者的行动，或迫使其在徒劳的任务中耗尽资源。\n\
  \n蜜罐已经使用了几十年，但部署它们非常困难或成本高昂，因为这通常意味着投入实际硬件来面对攻击者，从而减少了可用于生产目的的资源。此外，为了与攻击者持续足够的时间，蜜罐需要像一个真实的（理想情况下是有价值的）网络节点，这意味着需要在在其放置哪些软件和数据上花脑筋。这都需要花费大量时间，对于非常大规模的部署是不切实的。虚拟化的出现拯救了这个问题，并解决了与管理这些机器相关的许多挑战，因为该技术可以轻松且快速地扩展。\n\
  \n通过蜜罐网络（`honeynet`），其核心思想是如果一个是好的，那么越多越好。蜜罐网络是一个设计用于吸引攻击者的整个网络。使用它的益处与蜜罐相同，但这些网络被设计成像真实的网络环境，拥有真实的操作系统、应用程序、服务以及相关的网络流量。你可以将蜜罐网络看作一组高度交互的蜜罐，提供与真实网络类似的真实反馈。对于蜜罐和蜜罐网络，这些服务实际上并不用于生产环境，因此不应该有理由与服务器进行合法交互。因此，你可以假设任何与这些服务的长期交互都意味着恶意意图。由此得出，蜜罐网络上外部主机的流量是真实的，不像真实网络中那样可能产生误报。与单个蜜罐一样，所有活动都经过监控、记录，有时会根据管理员的意愿进行调整。虚拟化也提高了蜜罐网络的性能，允许在同一块物理裸机上实现不同的网络配置。\n\
  \n## 访问控制列表（ACLs）\n\n访问控制列表（`ACL`）是一个对象表，这些对象可以是文件或网络资源，以及可能访问或修改这些资源的用户。在描述文件系统或网络访问时，你经常会看到\
  \ `ACL` 术语。取决于 `ACL` 的类型，对象可以是单个用户、一个组、IP 地址或端口。`ACLs` 是网络安全的强大工具，但它们通常需要在设置上投入大量的先期成本。例如，在网络设备上使用\
  \ `ACLs` 时，管理员需要准确了解数据如何从端点到网关流经每台设备。这将确保在正确的位置实施适当的 `ACLs`。每种类型的 `ACL`，无论是网络还是文件系统，对于最佳使用都有其特定的要求。\n\
  \n### 文件系统 ACL\n\n在早期的计算环境中，文件和目录有`所有者`（owners），他们拥有读取、写入或修改它们的完全控制权。所有者可以属于`组`（groups），并且可以根据文件或目录授予必要的权限。其他人将属于`其他`（other）类别，也可以被分配适当的权限。这些权限提供了控制访问的基本方法，但没有方法为不同的个人用户分配不同级别的访问权限。`ACLs`\
  \ 的开发是为了对文件或目录提供细粒度的控制。注意图 3-2 中访问 `bar.txt` 文件权限的区别。作为文件的所有者，`root` 拥有读写权限，并向用户\
  \ `nobody` 授予了读取权限。\n\n![Images](img/00025.jpeg)\n\n* * *\n\n**图 3-2** Linux 中的目录\
  \ ACL\n\n### 网络 ACL\n\n与文件系统 `ACL` ，网络 `ACL` 提供了选择性允许或拒绝访问的能力，通常适用于入站和出站流量。访问条件取决于使用的设备类型。例如，交换机可能会使用源和目的的\
  \ `IP` 或 `MAC 地址` 来决定是否允许流量，因为它们是二层设备。路由器作为三层和四层设备，可能会使用 `IP`、网络协议、端口或其他功能来做出决定。在虚拟和云环境中，可以实施\
  \ `ACLs` 来过滤流量。\n\n* * *\n\n![Images](img/00005.jpeg)\n\n**考试提示** `ACL` 规则的顺序非常重要。流量会按照规则列表顺序检查，如果数据包匹配多个规则，则以第一条规则为准。\n\
  \n## 黑洞（Black Hole）\n\n在探测网络时，攻击者非常依赖其他主机提供的反馈来确定方向。这有点像潜艇使用声纳来确定自己相对于海底、障碍以及可能的敌方舰艇的位置。如果潜艇发出的脉冲没有回声，它就可以假设该方向没有障碍。现在想象，如果它发出的任何脉冲都得不到响应，因为它周围的一切似乎都吸收了所有的声能；它将无法确定自己相对于任何其他东西的位置，只能盲目地漂浮。\n\
  \n\n\n\n\n`black hole`（黑洞）是一种被配置为接收具有特定源地址或目的地址的所有包，且对其做出任何响应的设备。通常，网络协议会指示发生故障，但在黑洞情况下，没有任何响应，因为数据包被静默地记录并丢弃。发送者甚至无法感知传输失败。\n\
  \n#### DNS 汇洞 (DNS Sinkhole)\n\n`DNS sinkhole`（DNS 汇洞）这种技术类似于 `DNS 欺骗`，它会对 DNS 查询提供一个无法解析到实际\
  \ IP 地址的响应。然而，其区别在于，DNS 汇洞针对的是已知恶意域名的地址（例如与僵尸网络相关的域名），并返回一个无法正确解析或由管理员定义的 IP 地址。以下这种技术如何帮助网络安全的场景：假设你收到通知，某个网站\
  \ [www.malware.evil](http://www.malware.evil) 正在提供恶意内容，并且你确认网络中的几台机器正尝试连接该服务器。在它们尝试解析该主机名之前，你无法确定哪些计算机被感染了，但如果它们能够解析该主机名，就可能连接到恶意网站并下载额外的工具，这将使修复工作变得更加困难。如果你创建一个\
  \ DNS 汇洞，将 [www.malware.evil](http://www.malware.evil) 解析到地址为 `10.10.10.50` 的特殊服务器，你就可以轻松检查日志来确定哪些机器被感染了。任何尝试连接\
  \ `10.10.10.50` 的主机都可能被感染，因为否则没有理由连接到那里。在此期间，攻击者将无法进一步扩大破坏，因为他们无法从受影响的主机获得反馈。\n\n\
  #### 端点安全 (Endpoint Security)\n\n仅关注网络层面的安全并不总是足以应对攻击者的。虽然我们的目标是在网络层面缓解绝大多数威胁，但可用性与安全性之间的权衡也随之出现。我们希望基于网络的保护能够彻底检查流量，但不能以牺牲网络速度为代价。虽然监控网络很重要，但要看到一切并迅速做出响应是不可能的。此外，恶意代码的目标通常是存储在主机上的数据。如果其他部分没有同等水平的保护，那么仅仅加强网络基础是没有意义的。因此，确保主机经过加固以抵御攻击，并提供一种易于洞察运行进程的方法也同样重要。\n\
  \n#### 检测与拦截 (Detect and Block)\n\n端点解决方案的恶意软件检测通分为通用类型。第一种是基于签名的检测，它将本地机器上文件的哈希值与已知恶意文件列表进行比较。如果发现匹配，端点软件可以将该文件隔离并通知管理员其存在。现代基于签名的检测软件还能够识别恶意代码家族。\n\
  \n但当恶意文件对于环境来说是新的、因此没有签名时会发生什么？这可能是基于行为的恶意软件检测大显身手的地方。它监控系统进程以寻找恶意软件迹象，然后将其与已知行为进行比较，以对文件做出决策。基于行为的检测变得越来越重要，因为恶意软件编写者经常使用多态（不断变化）代码，这使得仅通过签名方法极难检测。\n\
  \n这两种方法都有局限性。误报（将文件错误地识别为恶意软件）可能会导致问题。在最好的情况下，它们只是带来麻烦，但如果检测软件隔离了关键文件，可能会导致操作系统变得无法使用。\n\
  \n### 沙箱 (Sandbox)\n\n创建恶意软件需要大量精力，因此编写者经常会针对最流行的检测工具对其代码进行测试，以确保在发布到野外之前不会被发现。端点解决方案已经演变，使用名为\
  \ `sandboxing`（沙箱化）的技术来覆盖传统检测的盲点。端点沙箱可以是虚拟机的形式，运行真实但受限操作系统操作系统。在文件执行时，沙箱会监控异常行为或系统变化，只有当文件被证实为安全的，才允许其在主机上运行。从历史上来看，研究人员使用沙箱来理解恶意软件是如何执行和演变的，但随着本地计算能力的增加和虚拟化的进步，某些恶意软件编写者已开始制作可以检测沙箱的恶意软件。在这种情况下，如果恶意软件检测到沙箱，它将保持休眠以规避检测，并在后的某一点激活。这凸显了恶意软件创建者与防御网络专业人员之间无休止的战斗。\n\
  \n#### 云连接保护 (Cloud-Connected Protection)\n\n与虚拟化一样，云计算的广泛使用使得恶意软件检测取得了重大进展。许多现代端点解决方案利用云计算，通过为快速文件信誉判定和行为分析提供基础来增强保护。基于云的安全平台通过跨网络自动共享威胁细节，最大限度地减少来自已知和未知威胁的整体感染风险。如果通过手动操作，分析师将花费更多时间来分别准备、共享和更新每个区域。\n\
  \n#### 信任 (Trust)\n\n网络中固有信任的概念给管理员带来了许多挑战。人类会犯错——他们丢失设备或在无意中为攻击者创建了网络入口点。因此，零信任环境的实践正成为企业网络的标准，在这种网络中，网络的设计和管理考虑到了威胁可能来自外部和内部源。\n\
  \n### 组策略 (Group Policies)\n\n大多数企业设备依赖目录服务（如 `Active Directory`）来获取存储卷、打印机和联系人列表等共享资源的访问。在\
  \ Windows 环境中，`Active Directory` 通过域控制器实现，除了为所有连接用户提供资源外，还提供身份验证和授权服务。此外，`Active\
  \ Directory` 服务允许使用策略远程管理。通过使用 `group policies`（组策略），管理员可以强制用户执行基准设置。密码复杂度、帐户锁定、注册表项和文件访问等功能都可以通过\
  \ `group policy` 机制进行规定。可以在本地、域或网络级别使用 `group policies` 设置机器和用户账户的安全设置。\n\n\n\n\n\
  \n本章实践的运用是努力的一部分，旨在让攻击者更努力才能发现我们的网络结构，或者让他的努力更容易被发现。这种`hardening`（加固）网络的实践不是静态的，需要对网络和本地资源进行持续监控。密切关注我们在端点可以做些什么以防止仅依赖对攻击的检测至关重要。加固端点需要对安全性和可用性之间的平衡进行仔细思考。我们不能让系统变得不可用而无法完成任何工作。幸运的是，有一些简单的规则可以遵循。第一是，资源应仅供执行职责需要的人访问。如果管理员无法直接满足某些需求，他们也需要采取措施来应对与需求相关的风险。其次，主机的配置应仅包含该角色所需的必要应用程序和服务。例如，这台机器需要运行\
  \ Web 服务器吗？通过策略，这些设置可以被标准化并推送到域中的所有主机。最后，应该尽早且频繁地更新。除了提供功能性的改进外，许多更新还带有针对最近发现漏洞的补丁。\n\
  \n***\n\n## 可用性与安全性\n\n有时候，我们越试图让一个系统变得安全，它在实践中反而变得越不安全。想一下：如果你给用户的密码要求设置得如此难以记忆，他们就会开始把密码写在便利签上，并将它们存放在键盘下和显示器上以便访问。这会让系统更安全吗？要想象一个没有密码的世界可能很难。不需要记住复杂的字母和数字组合，并且几乎可以即时访问系统，这通常意味着一个极易用但极度不安全的系统。然而，可用性和安全性并不是互斥的概念。有一个整个信息安全领域专门致力于在保持高水平机密性、完整性和可用性的同时，提高系统的可用性。当我们努力在保持高安全性的同时提高可用性时，理解当前系统中的权衡至关重要，这样我们才能对安全策略做出明智的。\n\
  \n***\n\n## 自主访问控制 (DAC)\n\n回想我们对文件系统 ACL 的讨论，我们看到简单权限是多年来访问控制的主导形式。这种方案被称为`discretionary\
  \ access control`（自主访问控制），或 `DAC`。它之所以是“自主”的，体现在内容所有者或管理员可以根据自己的意愿将权限传递给任何人。这些接收者可以根据其身份或组组成访问媒体。访问的验证发生在资源端，这意味着当用户尝试访问文件时，操作系统将查询文件的权限列表并验证用户是否可以执行该操作。你可以在今天的所有主流操作系统中看到这一点：`Windows`、`Linux`\
  \ 和 `Mac OS`。\n\n### 强制访问控制 (MAC)\n\n对于对数据访问需要额外审查级的环境（例如军事或情报机构），`mandatory access\
  \ control`（强制访问控制）`MAC` 模型比 `DAC` 是更好的选择。顾顾义，`MAC` `requires`特定用户对特定对象具有显式授权。`MAC`\
  \ 模型具有用于多级安全的额外标签——未分类、机密、秘密和绝密，这些标签同时应用于主体和对象。当用户尝试访问文件时，会在文件上的安全标签（称为`classification\
  \ level`，密级级）和主体的安全级别（称为`clearance level`，许可级）之间进行比较。只有在个人资料中拥有这些标签的用户才能访问同级的文件，而验证这种“知情需要”是\
  \ `MAC` 的主要优势。此外，管理员可以限制资源的进一步传播，即使对于内容创建者也是如此。\n\n### 基于角色的访问控制 (RBAC)\n\n如果你有大量文件不想逐个进行管理该怎么办？基于角色的访问控制（`RBAC`）允许你根据用户的角色或组授予权限。`RBAC`\
  \ 的重点在于角色级别，管理员在那里定义该角色可以做什么。用户只能执行其角色允许执行的操作，因此不需要对特定角色的资源进行显式拒绝。理想情况下，系统中只有少数角色，无论用户总数有多少，管理都会变得简单得多。你可能会好奇\
  \ `DAC` 模型中的组与 `RBAC` 有什么区别。区别很小，因为 `DAC` 中的权限可以同时授予用户和组，因此存在用户可能被拒绝，但他所属的组可能具有访问权限的情况。在\
  \ `RBAC` 中，每个权限都应用于角色或组，而从不直接应用于用户，因此它消除了之前描述的漏洞可能性。\n\n## 补偿控制\n\n补偿控制是组织实现安全需求目标的任何手段，即使由于某些合法的外部限制或内部冲突，他们无法明确地满足这些目标。例如，在在线商店处理信用卡支付的小型企业，因此受到支付卡行业数据安全标准（`PCI\
  \ DSS`）的约束。该公司对敏感财务操作和外部 Web 访问使用同一个网络。尽管最佳实践建议使用物理隔离的基础设施（可能在两者之间设置物理隔离），但由于成本原因，这可能是不可行的。补偿控制可以是引入一个能够管理`VLAN`的交换机并在交换机和路由器级别强制`ACLs`。这种替代方案将如\
  \ `PCI DSS` 标准描述的，“满足原始声明要求的意图和严谨性”。\n\n## 禁止未使用的端口/服务\n\n我一直惊讶许多设计连接到网络的消费产品运行不必要的服务，有时甚至带有默认凭据。其中一些服务在图\
  \ 3-3 所示。如果你不需要某个服务，应该将其禁用。运行不必要的服务不仅意味着为攻击者提供了更多路径，而且增加了管理工作。不使用的服务本质上是浪费能量，因为计算机将仍然运行该软件，等待一个合法用户可能不会发生的连接。\n\
  \n![Images](img/0026.jpeg)\n\n***\n\n**图 3-3** 未保护的 Windows 8 机器上的开放端口列表\n\n***\n\
  \n![Images](img/00005.jpeg)\n\n**考试技巧** 在 0 到 1023 之间的 `UDP` 和 `TCP` 端口被称为`well-known\
  \ ports`（已知端口），因为它们被用于常用服务。一些著名的已知端口有 `20` (FTP)、`22` (SSH)、`25` (SMTP) 和 `80` (HTTP)。1024\
  \ 到 49151 端口是`registered`（注册）端口，49151 以上的端口是`ephemeral`（临时）或`dynamic`（动态）端口。\n\n\
  #### 补丁\n\n\n\n\n补丁对于管理员来说是一种“必要而又恶”。你不希望因新引入的不兼容性导致网络中断，但你也不希望因为对打补丁的顾虑导致旧软件被利用。多年来，厂商试图通过固定间隔定期发布更新来缓解打补丁的压力。`Microsoft`\
  \ 和 `Adobe` 等主要厂商已为其产品的发布更新建立了节奏。因此，管理员可以根据某种程度的确定性制定测试和推送更新的计划。然而`Microsoft` 最近结束了其“补丁周二”（Patch\
  \ Tuesday）的做法，部分原因就是由于这种可预测性。这种做法的缺点开始显现，因为攻击者会在修复程序发布后立即对其进行反向工程，以确定此前未知的漏洞。攻击者知道，许多管理员在发现漏洞之前无法为所有机器打补丁，因此“漏洞周三”（Exploit\
  \ Wednesday）这一说法应运而生。尽管这很幽默，但这是一个巨大的缺陷，促使公司转而专注于改进其自动更新功能。\n\n## 网络访问控制\n\n为了在基准和组策略之外强制执行终端安全标准，工程师开发了网络访问控制（`NAC`）的概念。`NAC`\
  \ 为终端提供了更深层次的可见性，并在允许设备连接网络之前进行策略执行检查。`NAC` 结合了诸如 `RBAC`、终端恶意软件防护验证和版本检查等功能，以应对广泛的安全需求。某些\
  \ `NAC` 解决方案为不合规设备提供透明化的修复。从原则上讲，这种解决方案减少了对用户干预的需求，同时简化了管理员的安全和管理操作。\n\n然而，对于 `NAC`\
  \ 仍存在一些顾虑：既关乎用户隐私，也影响网络性能。`NAC` 的某些功能（特别是版本检查和修复）可能会消耗巨大的资源。想象一下，几百个不合规节点同时加入网络，并且所有节点都同时更新其各自的\
  \ `Adobe Flash`、`Java` 和 `Internet Explorer` 版本。这通常意味着网络受到影响；此外，用户在应用更新期间可能无法使用他们的机器。此外，`NAC`\
  \ 通常需要某种类型的代理程序（agent）来验证终端软件和系统配置的状态。如果这些收集到的数据被误用，可能会对用户数据隐私产生重大影响。\n\n与其他所有解决方案一样，在开发部署\
  \ `NAC` 解决方案的策略时，我们必须考虑对网络和用户产生的影响。`IEEE 802.1X` 标准多年一直是事实上的 `NAC` 标准。虽然它支持基于网络策略的某些限制，但随着网络变得越来越复杂，它的效用也随之降低。此外，`802.1X`\
  \ 解决方案通常对网络访问提供二元决策：要么允许要么拒绝。随着越来越多的网络转向支持“自备设备”（`BYOD`），这要求 `NAC` 解决方案更具灵活性。现代\
  \ `NAC` 解决方案支持多个框架，每个框架都有其自身的限制，以确保在尝试加入企业网络时终端合规。在发生违规时，管理员从现代 `NAC` 解决方案提供的各种响应中进行选择。根据事件的严重程度，他们完全阻止设备访问、将其隔离、生成告警或尝试修复终端。接下来我们将看看最常用的解决方案。\n\
  \n### 基于时间 (Time Based)\n\n你的访客网络需要在凌晨 3 点保持激活状态吗？如果不需要，那么基于时间的网络解决方案可能适合你。基于时间的解决方案可以为固定间隔或循环时间段提供网络访问，并对访客访问执行时间限制。一些更先进的设备甚至为不同的组分配不同的时间策略。\n\
  \n### 基于规则 (Rule Based)\n\n`NAC` 解决方案将查询主机以验证操作系统版本、安全软件版本、违禁数据或应用程序是否存在，或者规则列表定义的任何其他标准。这些规则还可能包括硬件配置，例如是否存在未经授权的存储设备。通常，它们可以将这些信息传回网络，以通知其他设备进行更改。此外，许多\
  \ `NAC` 解决方案还能以被动模式运行，仅作为监控功能运行并在发生违规时报告。\n\n### 基于角色 (Role Based)\n\n在较小的网络中，手动限制节点之间的交互是一项可以管理的任务，但随着网络规模的扩大，由于可能存在终端配置的多样性，这变得呈指数级地困难。使用\
  \ `RBAC`，`NAC` 解决方案可以帮助限制节点之间的交互，以防止意外或故意的未经授权数据泄露。如所述，`RBAC` 为用户提供了一系列完成其在组织中职责所需的授权操作。`NAC`\
  \ 可能会根据网络中使用的任何目录服务引用现有的 `RBAC` 策略并相应地执行。这有助于数据泄露防护（`DLP`），因为在网络各个部分定位敏感信息的过程变得快得多。因此，`NAC`\
  \ 可以作为 `DLP` 解决方案，即使数据已经离开网络也是，因为它可以验证基于主机的 `DLP` 工具的存在，或者通过 `RBAC` 集成自行进行验证。\n\n\
  ### 基于位置 (Location Based)\n\n随着网络中 `BYOD` 的激增，越来越多的员工在离开网络基础设施的地方工作，依赖虚拟专用网络（`VPN`）软件或云服务来访问公司资源。`NAC`\
  \ 在做出访问决策时可以考虑设备位置，提供身份验证和更准确的资产追踪这两个主要优势。\n\n### 章节总结\n\n主动防御入侵是确保你的网络准备好应对攻击成功这一极概率事件的关键步骤。通过恰当地识别网络上的关键资产并将其划分为子区域，你可以利用合理的网络架构来限制损害。通过智能地管理权限和访问控制，可以确保只有需要访问数据的人员（即使是从内部）才能访问。你的策略应该是足够全面的，包含互补甚至是冗余的控制措施。在由于预算或其他限制无法实施某些技术手段的情况下，应实施这些替代措施以应对受影响的区域。在确保整个网络健康且具有韧性的同时，将终端和服务器加固纳入考虑范围也是重要的。关闭不必要的服务并保持系统和软件更新，是提高安全基准的重要任务。\n\
  \n\n\n\n企业正越来越多地使用移动、云和虚拟化技术来改进产品，并提高员工访问资源的速度和效率；因此，边界的定义每天都在变化。随着边界变得越来越多孔化和模糊，攻击者利用了这一点，并利用这些相同的访问权限非法进入系统。我们必须采取措施来适应这种新范式，并准备我们的系统以应对这些及未来的变化。本章讨论的解决方案为准备和应对网络威胁提供了技术手段。\n\
  \n我们的信息安全学科要求对技术的优势和局限性有深入的理解，但同时也依赖于安全与可用性之间的巧妙平衡。我们对信息系统的目标以及每项技术相关风险了解得越深，我们在追求这种平衡时就越越有利。\n\
  \n### 问题\n\n1. 下列术语中，用于设计防御攻击信息系统安全尝试的网络设备是哪一个？\n   A. `ACL`\n   B. `VLAN`\n   C.\
  \ `Jump box`\n   D. `Honeypot`\n\n2. 网络访问控制 (`NAC`) 可以使用以下参数实现，*除了*哪一个？\n   A. `Domain`\n\
  \   B. `Time`\n   C. `Role`\n   D. `Location`\n\n3. 你正在检查边缘路由器上的访问控制列表 (`ACL`) 规则。通常哪个端口*不应该*允许通过该设备出站？\n\
  \   A. `UDP 53`\n   B. `TCP 23`\n   C. `TCP 80`\n   D. `TCP 25`\n\n4. 洞点 (sinkhole)\
  \ 最可能的用途是什么？\n   A. 保护合法流量免窃听\n   B. 防止恶意软件接触命令与控制系统\n   C. 为流量源提供 `ICMP` 消息\n \
  \  D. 将可疑流量导向生产系统\n\n5. 下列哪项*不是*通常用于隔离网络流量以挫败威胁者技术？\n   A. `Micro-segmentation`\n\
  \   B. `Virtual LANs`\n   C. `Jump server`\n   D. `NetFlow`\n\n6. 下列哪个术语用于一种执行上故意可选的访问控制机制？\n\
  \   A. `DAC`\n   B. `MAC`\n   C. `RBAC`\n   D. `EBAC`\n\n参考以下图回答问题 7–9：\n\n![Images](img/00027.jpeg)\n\
  \n7. 蜜罐机 (honeypot) 的最佳位置在哪里？\n   A. 圆圈 2\n   B. 圆圈 4\n   C. 圆圈 2 或 5\n   D. 以上都不是\n\
  \n8. 使用沙箱 (sandbox) 的最佳位置是哪里？\n   A. 五圆圈中的任何一个\n   B. 圆圈 3\n   C. 圆圈 4 和 5\n   D.\
  \ 圆圈 1 和 2\n\n9. 你预计哪里可以使用访问控制列表？\n   A. 圆圈 1 和 2\n   B. 圆圈 3\n   C. 以上\n   D. 以上都不是\n\
  \n使用以下场景回答问题 10–11：\n\n你所属的行业正面临来自海外犯罪集团的入侵潮。他们的方法是说服终端用户点击链接，该链接将利用他们的浏览器；或者如果失败，将提示他们下载并安装\
  \ `Flash Player` 的“更新”。一旦他们攻破了主机，就会使用 `DNS` 解析不断变化的 `C2` 节点 IP 地址，从而与命令与控制 (`C2`)\
  \ 系统建立联系。你是所在行业信息共享与分析中心 (`ISAC`) 的成员，该中心让你获取更新的域名列表。贵公司的文化非常进取，因此你不能采取严厉的措施来保护系统，以免触怒你的首席执行官。\n\
  \n10. 你意识到第一步应该是从源上防止感染。以下哪种方法最能让你保护工作站？\n    A. 使用 `VLANs` 分隔你的网络\n    B. 部署 `honeypot`\n\
  \    C. 使用 `sandboxing` 提供端点安全\n    D. 实现 `MAC` 使户户无法从互联网安装软件\n\n11. 你如何才能防止受感染的主机连接到\
  \ `C2` 节点？\n    A. 强制所有网络设备仅使用你自己的 `DNS` 服务器解析名称。\n    B. 部署 `honeypot` 以吸引来自 `C2`\
  \ 节点的流量。\n    C. 使用由 `ISAC` 提供的域名实现 `sinkhole`。\n    D. 解析 `ISAC` 提供的域名，并在防火墙上实施\
  \ `ACL` 以阻止连接到那些 IP 地址。\n\n12. 你开始收到网络中出现成功入侵的报告。哪种技术让你可以在修复受感染主机之前控制损害？\n    A.\
  \ 指示用户停止使用浏览器。\n    B. 将受感染的主机加入其自身的隔离 `VLAN`。\n    C. 部署 `jump box`。\n    D. 在受影响主机上安装\
  \ `sandbox`。\n\n### 答案\n\n1. D. 蜜罐 (Honeypots) 是为了诱捕威胁者而开发的虚拟系统，可以有效防御他们的攻击。一旦攻击者开始与\
  \ `honeypot` 交互，可能会减慢他们的速度，并允许防御人员研究他们的技术或防止他们攻击真实系统。\n2. A. 网络访问控制 (`NAC`) 使用 `time`、规则、`roles`\
  \ 或 `location` 来决定是否允许设备接入网络。设备所属的 `domain` 并不作为决策参数使用。\n3. B. `TCP` 端口 `23` 分配给\
  \ `telnet`，这是一种用于远程登录设备的本质不安全的协议。即使你在组织内部允许 `telnet`，你也会希望将其封装在安全连接中。另外三个端口通常允许出站防火墙，因为\
  \ `DNS` (`UDP 53`)、`HTTP` (`TCP 80`) 和 `SMTP` (`TCP 25`) 是每个组织通常所需的。\n4. B. 洞点 (sinkholes)\
  \ 最常用于在不通知源（即不发送 `ICMP` 消息）的情况下将流量转向生产系统。它们不能提供防窃听保护，相反有助于网络防御人员分析数据包。洞点的一个非常常见的应用是防止恶意软件使用\
  \ `DNS` 解析控制节点的名称。\n5. D. `NetFlow` 是一种提供网络流量统计数据的系统。微隔离、`virtual LANs` 和 `jump\
  \ servers`（或 `jump boxes`）都提供了隔离网络流量的方法。\n6. A. 任意访问控制 (`DAC`) 模型在设计上不需要强制执行。其他列出的方法是强制性的\
  \ (`MAC`) 或与强制执行无关 (`RBAC` 和 `EBAC`)。\n\n\n\n\n\n### 7. B. 蜜罐、汇聚池和黑洞都应该尽可能部署在远离生产系统的地方。因此，DMZ\
  \ 上未标记的服务器是最佳选择。\n\n### 8. D. 沙箱通常在执行未知非良代码时用于端点。圈 1 和 2 是终端用户工作站，我们通常会在那里部署沙箱，因为用户倾向于运行来自未知来源的代码。由于运行在路由器或服务器上的任何东西都应事先经过仔细审查和批准，因此圈\
  \ 3 和 5 不是我们通常预期部署沙箱的地方。如果圈 4 专门用于该目的，它可能是可能的位置，但它与圈 5 的数据服务器捆绑，这使其显得不理想。\n\n###\
  \ 9. C. 访问控制列表 (ACL) 几乎出现在网络的任何地方。终端使用它们来控制哪些用户可以读取、修改或执行文件，而路由器也可以使用它们来控制跨接口的数据包流向。\n\
  \n### 10. C. 使用沙箱有助于保护终端，同时对用户的影响降至最低。理想的情况是防止他们安装恶意软件，但该场景中的组织文化使得这在目前看来变得不可行。\n\
  \n### 11. C. 通常情况下，恶意软件加载的 C2 节点是主机名而非 IP 地址。原因是主机名可以随着时间的推移映射到多个 IP 地址，这增加了拦截它们的难度。DNS\
  \ 汇聚池会将给定域名列表中的所有主机名解析到一个死胡同，仅记录尝试并向网络安全分析师报警受感染的主机。拦截 IP 的效果可能佳，因为这些地址可能会频繁更改。\n\
  \n### 12. B. 可以使用极端的网络分段来使受感染主机连接到网络，但无法与取证或修复设备以外的任何人进行通信。\n\n***\n\n# 第 4 章：企业网络安全\n\
  \n在本章中，你将学习：\n\n- 渗透测试\n- 逆向工程\n- 培训与练习\n- 风险评估\n\n*信任，但要验证*。\n俄罗斯谚语\n\n本章的标题可能略带误导性，因为我们不会涵盖企业网络安全的全部工作。做到这一点需要写非常厚的一本书。在本章中，我们关注这项工作中属于网络安全分析师职责范围的特定方面。除了你每天在前方工作中寻找系统中恶意入侵者的迹象外，你可能还会参与风险评估、渗透测试、培训和练习。你还应该至少熟悉逆向工程，因为在你将涉及的更复杂的事件中，通常需要它。让我们从最喜欢的开始：渗透测试。\n\
  \n## 渗透测试\n\n*渗透测试*，也称为 *pen testing*，根据所有者或高级管理层的要求，对网络及其系统模拟攻击的过程。它使用了一系列程序和工具，旨在测试并可能绕过系统的安全控制。其目标是衡量组织抵抗攻击的水平，并发现环境中的任何漏洞。渗透测试模拟攻击者将使用的相同方法，因此渗透攻击应与可能对手的战术、技术和程序\
  \ (TTPs) 一致。\n\n应该使用的渗透测试类型取决于组织、其安全目标以及领导的目标。某些公司使用不同类型的工具对自己进行定期渗透测试，或者使用扫描设备以自动方式持续检查环境中的新漏洞。其他公司则要求第三方执行漏洞测试和渗透测试，以提供更客观的视角。\n\
  \n渗透测试可以评估 Web 服务器、域名系统 (DNS) 服务器、路由器配置、工作站漏洞、敏感信息的访问、远程拨入访问、开放端口以及真实攻击者可能用来破坏公司整体安全的可用服务属性。某些测试可能是相当具有侵入性和破坏性的。测试的时间应达成一致，以免影响生产力，并在必要时让人员将系统恢复上线。\n\
  \n***\n\n![Images](img/00009.jpeg)\n\n**注意** 渗透测试并不一定限于信息技术，还可能包括物理安全和人员安全。最终，目的是破坏一个或多个控制措施，这些措施可以是技术性的、物理的或操作性的。\n\
  \n渗透测试的结果是提交给管理层的报告，描述了识别出的漏洞及其严重性，以及关于如何妥善处理这些问题的建议。从那里开始，由管理层决定如何实际处理漏洞以及实施哪些应对措施。\n\
  \n在执行渗透测试时，团队会经历一个被称为“杀伤链”的四步流程：\n\n1. **侦察**：对目标进行足迹探测并收集信息\n2. **利用**：破坏安全控制或通过其他方式非法访问\n\
  3. **横向移动**：从攻破的系统破坏额外的系统\n4. **向管理层报告**：向管理层交付测试结果的文档以及建议的应对措施\n\n渗透测试团队在实际执行测试之前，对渗透目标可能有不同程度的了解：\n\
  \n- **零知识**：团队对目标一无所知，必须从零开始。这也被称为 *黑盒渗透测试*。\n- **部分知识**：团队拥有关于目标的信息。这也被称为 *灰盒渗透测试*。\n\
  - **全知识**：团队对目标非常熟悉。这也被称为 *白盒渗透测试*。\n\n### 现行规则\n\n罗伯特·弗斯特有一句名言：“好的篱笆是好的邻居”。在渗透测试中，没有不过如此。这项活动涉及的许多任务在没有系统所有者同意的情况下在大多数国家是非法的。即使采取了所有法律预防，对关键业务流程造成昂贵中断的风险需要仔细考虑。最后，如果渗透测试人员将注意力放在错误的目标上，对组织的价值可能会降低。由于所有这些原因，在发射第一次网络攻击之前，仔细定义时间、范围、授权、利用技术和通信机制至关重要。\n\
  \n### 时间\n\n渗透测试可能既昂贵又有风险，因此考虑时间问题非常重要。首先，练习范围通常决定了所需的持续时间。测试区域银行的软件开发子网可以比测试一家跨国公司快得多。项目负责人的职责之一是平衡正在测试的风险区域数量与彻底评估这些区域所需的天数以及相应的成本）。\n\
  \n\n\n\n\n另一个时间上的考虑因素是渗透测试人员活跃的时段。如果测试在正常工作时间内进行，则必须格外小心，确保生产系统不会受到不利影响，从而避免危及到实际业务。这种时间安排也允许防御者对任何检测检测的攻击做出更好的反应。相反，在下班时间后进行测试可以降低对业务流程的风险，但可能会降低对防御者的训练价值。在决定使用哪种方法时，考虑可能的攻击者可能所在的时区可能会有所帮助。如果攻击通常发生在夜间或周末，那么最好的可能是让渗透测试团队在这些时间段内运行。\n\
  \n## 范围\n\n存在一种常见的误区，认为渗透测试人员应该尽可能真实，因此应该自己选择他们要针对的网络和系统。这种方法存在许多问题，其中最主要的问题之一是，测试人员必须确保他们的目标确实是由指令他们攻击这些目标的人拥有。组织外包其信息基础设施的部分内容并不少见。如果没有为测试设定非常具体的范围，评估人员将面临针对未同意该事件的第三方所拥有系统的风险。\n\
  \n通常，渗透测试通过至少两种方式界定范围：哪些明确在范围内，哪些明确在范围之外。例如，组织可能会为测试人员提供特定的 `IP` 子网，在该子网内的任何和所有节点都是目标，但特定列表上的节点除外。除了排除系统的业务原因外，还可能存在监管考虑因素禁止对其进行探测。受保护的个人健康信息（`PHI`）就是其中的显著例子。如果渗透测试人员成功破解了一个主机并提取了\
  \ `PHI`，这可能违反美国的联邦法律。\n\n在获得系统“允许（go）”和“禁止（no-go）”列表后，测试团队有时会遇到不在任何列表上的节点。预先定义如何处理这些情况非常重要。如果一个模糊的节点需要手动验证，可能会消耗宝贵的测试时间。因此，某些组织会对渗透测试人员设置系统白名单或黑名单，其中白名单是首选方法。\n\
  \n## 授权\n\n在高级管理授权渗透测试之前，让他们了解执行测试可能涉及的任何风险至关重要。在少数情况下，可能会使用测试期间使用的工具和技术无意中导致系统或应用程序崩溃。正如预期，渗透测试的目标是识别漏洞、估计环境中安全机制提供的真实保护，并查看可疑活动是如何报告的。然而，事故确实可能发生且会发生。\n\
  \n安全专业人员应该获得一份授权信，其中包含授权测试的范围，这封信或备忘录在测试活动期间应供团队成员使用。这种信通常被称为“免死金牌”（Get Out of Jail\
  \ Free Card）。还应该提供关键人员的联系方式，以及在情况未按计划进行且必须恢复系统时的电话通知树。\n\n***\n\n![Images](img/00009.jpeg)\n\
  \n**注意** “免死金牌”是一份你可以向某人展示的文件，当某人认为你在做某些恶意的事情，而实际上你正在执行一项已批准的测试。曾出现过许多情况，个人（或团队）在执行渗透测试时，被安保人员或认为认为此人在错误的时间出现在错误的地方的人所接触。\n\
  \n## 利用\n\n`Exploitation`（利用）是指利用计算机系统中的漏洞以导致该系统发生非预期的、意料之外的或未经授权的行为。通常，利用涉及对目标机密性、完整性或可用性的破坏。这是执行渗透测试的本质：证明漏洞实际上是可被利用的，并展示如何利用。\n\
  \n利用通常涉及使用特制的软件、数据或命令，称为 `exploits`（利用程序），这些程序触发漏洞并导致所需的行为。这些利用程序并非都是同等的；有些是无害的，而另一些则可能对目标造成临时甚至是永久的损害。正是因为后者的可能性，利用方法必须作为作战规则（rules\
  \ of engagement）的一部分进行仔细讨论。在工作站上偶尔导致蓝屏是可以接受的，但对于生产服务器来说通常是不成立的。\n\n## 通信\n\n当渗透测试出现问题时（这并不罕见），测试团队必须拥有一个预先协调好的清晰通信机制。你肯定不想等到在周五晚上撞掉了一台生产服务器才开始考虑你应该给谁打电话。同样，情况必须糟糕到什么种程度，CEO\
  \ 才会会在半夜接到电话？我们都希望永远不要变成那种地，但我们中的许多人以前处于过危机时刻。最好的办法是考虑到所有可能性（特别是那些非常糟糕的可能性）。\n\n\
  渗透测试期间还有另一个通信考虑因素：谁在什么时候知道什么信息？在某些测试中，防御者（关键领导除外）不知道渗透测试团队正在攻击他们。当渗透测试人员和防御者都没有获得关于对方的信息时，这被称为\
  \ `double-blind test`（双盲测试）。攻击者（最初）盲目地探测网络，而防御者并不知道攻击并非真实的攻击。当采用这种测试方法时，精心规划的通信流程变得不可不可缺。\n\
  \n## 报告\n\n一旦渗透测试结束并完成解释和优先级排序，团队将提供一份详细报告，显示公司可能被成功攻击的许多方法。该报告通常提供被证明成功的方法论，以及降低真实攻击者采取相同行为风险的建议方法。这是应该是持续风险管理过程中下一个循环的输入。所有组织的资源都是有限的，因此只有部分风险可以被缓解。在公司的风险和风险偏好与可能的缓解成本以及每项措施带来的价值之间取得平衡，是安全分析师必须具备的能力的一部分。需要一个监督计划来确保缓解措施按预期工作，并密切跟踪每个缓解措施的估计成本与实际实施成本的差异。\n\
  \n### 逆向工程\n\n\n\n\n有一种观点认为硬件是不可改变的。这也许是真的，但我们正越来越多地看到向软件定义“事物”的转变，例如无线电和网络，这些设备以前几乎完全在硬件中实现。定制电子设备的使用正日益让位于另一种方法，即通过更通用的硬件平台运行自定义软件。这在商业和技术上都是合理的，因为更新软件比更换硬件更容易、更快且更廉。。尽管如此，在某些时刻，我们仍然硬件来运行软件，而这些软件必须是可信的。\n\
  \n### 来源真实性\n\n2012 年，媒体曾多次报道称，伪造网络产品进入了工业和政府部门的关键网络。根据一种说法，某些假冒品甚至被发现出现在敏感的军事网络中。来源真实性，即确保产品来自正品制造商，对我们所有人来说都至关重要，但当我们处理敏感信息时尤为如此。假产品带来的两个特定问题会影响网络安全分析师：恶意功能和低质量。\n\
  \n想象一下，某些组织或政府可能想要在各种网络中插入他们自己的伪造或修改版本的流行路由器。除了作为情报或数据窃取的来源外，它还可以为他们提供远程“杀死”开关，可用于勒索或在敌对情况下使用。当然，问题在于，检测硬件中的这些隐藏功能通常远超大多数组织的能力。确保你的设备是合且直接来自供应商，可以大大降低这种风险。\n\
  \n伪造硬件的另一个问题是，即使没有恶意设计，它的制造标准可能也与正品硬件不同。伪造者如果在质量保证和质量控制上投入与正品制造商相同的资源是没有意义的。这样做会增加他们的痕迹（以及被发现的概率），还会推高成本并降低利润率。对于我们大多数人来说，使用假品的最大风险是它们的故障率比原品更高，且方式更出乎意料。当它们发生故障时，你将无法从合法制造商处获得支持。\n\
  \n***\n\n### 伪造产品：你可以做什么？\n\n伪造是一个非常现实且日益增长的问题。幸运的是，你可以采取一些非常基本的步骤来显著减少你对这种威胁的暴露。以下是我们处理伪造产品的三个主要原则。\n\
  \n- **一分钱分分**：如果设备的价格看起来好得不可置信，那么它可能确实如此。伪造品的很大程度上在于它们可以吸引寻找廉价商品的客户。\n- **从授权零售商处购买**：大多数网络和安全设备的主要制造商都有授权销售其产品的零售商网络。从这些零售商处购买将减少你买到假品的概率，并提高修复问题的成功率。\n\
  - **检查序列号**：大多数制造商都会提供一种机制，让你验证序列号是否对应于合法产品。如果序列号被复制，他们也会提醒你存在重复。\n\n***\n\n###\
  \ 可信代工厂 (Trusted Foundry)\n\n在他们的小说《幽灵舰队》（Ghost Fleet*）中，作者 P.W. Singer 和 August\
  \ Cole 描述了一系列对美国来说极其糟糕的战斗。这些不幸的美国人并不知道，导致失败的根源是一个复杂的程序，它在运行从导弹到船只的一切设备的计算机芯片中植入了无法检测的后门。尽管他们的描述是虚构的，但公开媒体曾多次报道过伪造产品为网络引入漏洞的情况，包括一些军事网络。\n\
  \n这种威胁是真实的。2004 年，美国国防部（DoD）设立了“可信代工厂计划”（Trusted Foundry Program）。其目标是确保任务关键的军事和政府系统可以使用能够抵御外部威胁的供应链进行开发和部署。*可信代工厂*是一个能够以确保产品完整性的方式开发原型或生产级微电子设备的组织。这种信任由国家安全局（NSA）通过特殊的审查流程来确保。在写作此时，有\
  \ 77 家供应商被评为可信代工厂，并供美国国防部客户使用。\n\n### OEM 文档\n\n原始设备制造商（OEM）几乎总是提供有关其产品功能的详细文档。他们有时还会提供详细的参数和特性，这些可以用于验证你手中的产品性能是否符合预期。虽然\
  \ OEM 文档在硬件逆向工程中的作用有限，但在试图确保你的产品是正品时，某些情况下它可以有所帮助。\n\n### 硬件逆向\n\n在之前的章节中，我们讨论了你应该对某些硬件设备产生的各种原因。如果你真的想发现一个设备在做什么，以及可能是如何做的，你就需要将其拆解来寻找。虽然硬件逆向工程这个主题值得专门一本书，但仍有一些通用方法可以为你未来的研究指明正确方向。\n\
  \n***\n\n![Images](img/00009.jpeg)\n\n**注意** 我们在本节中讨论的硬件逆向工程技术可能会导致你的保修失效，甚至在某些司法管辖区违反法律。务必阅读你的用户许可协议和任何适用于你产品的法律警告。如果有疑问，请在继续之前咨询你的法律团队。\n\
  \n最简单的方法是直接打开外壳并向内部看。电路板上的芯片及其布局将为你提供一个很好的起点。你可能可以在网上搜索他人拍摄的该产品照片，这会提醒你注意任何可疑组件。除外，你将能够对许多组件芯片进行清单，因为这些芯片几乎都有明显的标记。芯片制造商会发布包含其产品详细信息的技术数据表。这些不仅告诉你芯片的功能，还提供了关于芯片上每个输入和输出引脚的特定信息。图\
  \ 4-1 显示了 Analog Devices 模数转换器的框图。\n\n![Images](img/00028.jpeg)\n\n***\n\n**图 4-1**\
  \ 来自技术数据表的功能框\n\n固件是永久（或永久）存储在硬件组件只读存储（ROM）中的软件。如果你真的想知道一个设备做什么，你可能需要提取固件并进行分析。你可能需要一个通用的\
  \ ROM 编程器，因为这些具有读取软件的能力（用于验证写入操作）。你可能需要从制造商处获取特定的芯片工具。无论如何，你最终将获得二进制代码，你也需要对其进行逆向工程。我们将在下一节中讨论软件逆向。\n\
  \n硬件逆向工程的另一种方法是捕捉接口处的信号并对其分析。这可以在设备级使用数据包分析器完成，这将为你提供通信模式的高视图。你还可以使用示波器或逻辑分析仪查看原始的电压水平波动。这些工具通常昂贵，但它们能准确告诉你物理层发生了什么。通过这些工具，你还可以监控单个芯片组件的行为，甚至注入你自己的输入以查看是否有隐藏功能。\n\
  \n### 软件/恶意软件\n\n\n\n\n\n尽管硬件逆向工程既有趣又重要，但我们大多数人更有可能参与软件的逆向，特别是恶意软件的逆向。这一过程需要对软件预期运行的处理器架构有深入理解。与\
  \ `x86` 处理器相比，`ARM` 处理器的二进制文件逆向显著不同。原理是相同的，但正如俗话说，魔鬼在于细节。\n\n### 指纹/哈希（Fingerprinting/Hashing）\n\
  \n有时，我们只需要对已知的或良好的二进制可执行文件进行指纹识别或哈希，就能节省很多麻烦。就像指纹在人类中不唯一的概率小到天文数字，通过安全哈希函数运行文件的结果对于任何两个文件来说极不可能是相同的。最终结果是，当你计算\
  \ Windows 动态链接库（DLL）等已知良好文件的 `SHA-256` 值时，攻击者以任何方式修改该文件（即使只更改一个位）并产生相同哈希值的概率微乎其微。但我们在这里想得太了。\n\
  \n`hashing function` 是一种单向函数，接收可变长度的数据序列（如文件）并产生称为“哈希值”的固定长度结果。例如，如果你想确保给定文件不被未经授权的方式篡改，你会计算该文件的哈希值并将其存储在安全位置。当你想要确保该文件的完整性时，你会执行相同的哈希函数，并将新结果与之前存储的哈希值进行比较。如果两个值相同，你就可以确定文件没有被修改过。如果两个值不同，你就知道文件被修改了（无论是恶意的还是其他的），因此就会调查该事件。\n\
  \n我们也可以将哈希应用于恶意软件检测。我们在第 2 章中讨论了全包捕获，这样做的好处之一是可以重组跨网络传输的二进制文件。有了这些文件，你可以获取可疑文件的哈希并与已知不良哈希知识库进行比较。分析师工具箱中不可或少的工具之一是\
  \ [VirusTotal.com](http://VirusTotal.com)，这是一个由 Google 所有并运营的网站，允许你上传哈希（或整个文件），查看之前其他人将其报告为恶意或可疑。图\
  \ 4-2 显示了提交可疑文件哈希的结果，该文件已被 40 个受访者中的 40 个报告为恶意。\n\n![Images](img/00029.jpeg)\n\n\
  **图 4-2** VirusTotal 显示给定哈希对应于恶意文件\n\n* * *\n\n![Images](img/00009.jpeg)\n\n**注意**\
  \ 将二进制文件上传到 VirusTotal 将允许整个全球社区（可能包括恶意软件作者）看到有人对这些文件产生怀疑。有许多记录在案的案例，威胁者一旦发现代码出现在\
  \ VirusTotal 上就会对其进行修改。\n\n### 分解（Decomposition）\n\n我们可以从个人经验告诉你，并不是每个可疑文件都会被 VirusTotal\
  \ 跟踪。有时，你必须自己挖掘代码查看它在做什么。在这些情况下，考虑计算机和人类理解完全不同的语言是非常重要的。计算机语言由其硬件架构决定，由 0 和 1 的模式组成。而人类使用根据语法规则组合的单词。为了让人们告诉计算机该做什么（即我们所说的“编程”），必须有某种机制将人类使用的单词翻译成计算机使用的二进制数字。这是编译器和汇编器的工作。如图\
  \ 4-3 所示，人类程序员使用 `C` 等高级语言编写代码，代码被编译成汇编语言，然后被汇编成二进制可执行文件。\n\n![Images](img/00030.jpeg)\n\
  \n* * *\n\n**图 4-3** 源代码的编译与汇编\n\n二进制可执行文件针对特定的操作系统和处理器族，这意味着你不能在 Windows 上运行 Linux\
  \ 程序。Windows 程序封装在被称为可移植执行文件（PE）的格式中，每个文件都以 2 字节序列 `5A 4D`（或 `4D 5A`，取决于你使用什么操作系统来检查文件）。相比之下，Linux\
  \ 可执行文件采用所谓的可执行与链接格式（ELF），每个文件都以 4 字节序列 `7F 45 4C 46` 开始。这些起始序列或“魔数”允许你快速判断特定恶意样本的目标是哪种操作系统。\n\
  \n* * *\n\n### 计算机语言代\n\n在我们生活的许多方面，后的一代都比前代更好，并使前代过时。但在描述计算机语言时并非如此。这些代在现代计算系统中并存，并且在可预见的未来可能会继续存在。\n\
  \n- **第一代**：计算机刚发明时，编写它们的唯一方法是使用`machine language`，这是一种操作符和参数序列，表示为 0 和 1 的序列，有时用十六进制表示。这种语言非常针对特定的处理器族（例如\
  \ Intel `x86`），对大多数程序员来说非常很难理解。\n- **第二代**：用机器语言编程完全无趣，而且非常容易出错。我们没多久就想出了更符合人类习惯的编程方法，并不意外。汇编语言使用更容易记忆的操作码（`opcodes`）和符号变量表示机器语言的操作符和参数。由于我们仍然需要得到机器语言，我们发明了`assemblers`，它们将第二代汇编语言转换为机器码。\n\
  - **第三代**：汇编语言是向正确方向的一一步，但它仍然需要对特定计算机架构有深厚的知识。一些非常聪明的人决定，能够用更像人的语言编程而无需了解架构将很好。这种顿悟导致了\
  \ `BASIC`、`Pascal`、`C/C++`、`Java` 和 `Python` 等语言的诞生。我们仍然需要落实到机器语言，但这次我们利用了已经创建的汇编器。缺失的部分是`compiler`，它将第三代编程语言翻译成汇编语言，然后由汇编器将其转换为机器码。\n\
  \n* * *\n\n当我们分析恶意软件时，很难获取到源代码。相反，我们通常得到的只是机器语言二进制文件。为了对该程序进行逆向工程，我们需要反汇编器，例如 `IDA\
  \ Pro`。反汇编器将机器语言转换回汇编语言，然后可以由逆向工程师进行分析。也存在一些反编译器，但那些更多是“碰运气”，因为有许多程序可以编译成给定的汇编语言文件。这意味着，平均而言，反编译器并不值得投入精力。\n\
  \n#### 隔离/沙箱（Isolation/Sandboxing）\n\n\n\n\n\n我们在第 3 章中已经在终端防护的背景下提到了隔离技术和沙箱。现在我们回到这一话题，目的是对硬件和软件的实际行为进行更审慎的评估。有时我们无法或不愿投入精力对二进制执行文件进行逆向工程，但仍然想知道它做了。这时隔离环境或沙箱就派上用场了。与终端防护沙箱不同，这类工具通常经过插桩，以帮助安全分析师理解正在运行的可执行文件在做什么。\n\
  \n`Cuckoo Sandbox` 是一种用于恶意软件分析流行的开源隔离环境。它使用 `VirtualBox` 或 `VMware Workstation`\
  \ 创建一个虚拟机，在上面安全地运行可疑的二进制文件。与其他环境不同，`Cuckoo` 在 Windows、Linux、Mac OS 或 Android 虚拟设备上同样有效。另一个你可能想要尝试的工具是\
  \ `REMnux`，这是一个加载恶意软件逆向工程工具的 Linux 发行版。\n\n### 培训与演练\n\n乔治·帕顿将（General George Patton）有一句名言：“你像你训练的那样战斗”，但这种思想以各种形式已扩展军队之外的许多群体。它说明了我们每个人都有两套心理系统：第一套是快速且反射性的，第二套是缓慢且具有分析性的。定期的、真实的训练可以开发并维持第一套系统的“肌肉记忆”，确保反射性动作是正确的。在战斗激烈时，士兵受到视觉、听觉、嗅觉和疼痛等形式的环境信息的轰炸，他们没有奢侈去处理所有信息，必须几乎在瞬间做出正确的判断。我们在响应网络安全事件时也是如此。\n\
  \n诚然，战斗和事件响应中的决策时间相差好几个数量级，但当你面临真实事件时，你无法负担起学习或重新发现标准操作程序的代价。我们曾与某些组织合作，在他们那里几秒钟真的可能意味着数百万美元的损失。因此，你的培训和演练计划的目标应该是确保所有团队成员都拥有快速处理可预测问题的肌肉记忆，并在此过程中为对其他问题进行审慎和分析性的判断留出时间。\n\
  \n培训活动的通用目的是开发或维持一套特定的技能、知识或属性，使个人或小组能够有效或更出色地完成工作。`exercise`（演练）是指个人或小组在特定场景下应用相关技能、知识或属性的活动。虽然看起来培训是演练的前提条件（事实上，许多组织采取了这种方法），但演练本身也可以是培训活动。\n\
  \n所有的培训活动和演练都应该从一组目标或结果开始，并配有一种评估这些目标是否实现的方法。这至少在两个层是有意义的：在操作层面，它告诉你的努力是否成功，或者是否需要重来一次（也许以不同的方式）；在管理层面，它告诉决策者资源的投入是否值得换取相应的结果。培训和演练往往是资源密集型的，应该审慎应用。\n\
  \n## 演练的类型\n\n尽管网络安全演练可以有很多潜在目标，但它们倾向于专注于测试处理事件的战术、技术和程序（TTPs），和/或评估防御团队在处理事件时的有效性。无论哪种方式，成功的关键在于选择有助于评估过程的场景。网络安全演练的两大类型是桌面演习（tabletop）和实战演练（live-fire）。\n\
  \n### 桌面演习\n\n桌面演习（TTXs）可能在桌面上进行，也可能不在，但它们不涉及技术控制。TTXs 可以在执行层（例如 `CEO`、`CIO` 或 `CFO`）、团队层（例如\
  \ `security operations center` 或 `SOC`）或两者之间的任何地方进行。其理念通常是测试流程并确保每个人都清楚自己在响应中的角色。除了仔细的计划外，TTXs\
  \ 需要的资源相对较少。\n\n在确定演练目标并经过高级管理层审核后，规划团队会开发一个涉及重要层面的场景。其想法通常不是涵盖每一个突发情况，而是确保团队能够应对最可能发生和最危险的场景。在开发演练时，规划团队将考虑分支（branches）和后续（sequels）。`branch`（分支）是参与者可以选择多种响应方式之一的节点。如果分支没有得到仔细的管理和控制，TTX\
  \ 可能会向着未知且低效的方向漂移。相反，`sequel`（后续）是给定行动的延续。例如，作为响应的一部分，战略传播团队可能会向新闻媒体发布声明。该行动的后续可能涉及媒体对声明提出挑战，这反过来需要团队做出回应。像分支一样，必须仔细使用后续以保持演练不偏离。高级管理层的支持和良好的场景开发是吸引和引导正确参与者的关键要素。就像任何比赛一样，TTX\
  \ 的好坏取决于参加的人员。\n\n### 实战演练\n\n`live-fire exercise`（实战演练）是指参与者防御真实的或模拟的信息系统，应对真实的（尽管是友方的）攻击者。组织此类活动面临许多挑战，但主要的挑战在于：开发一个代表真实系统的基础设施、获得一支优秀的红队，以及在整个演练期间让正确的蓝队成员在场。这其中的任何一项本身都是一项昂贵的举措。然而，为了确保活动成功，你需要这三者。\n\
  \n\n\n\n一种可能的解决方案是组建一个专门团队，在活动期间通过模拟真实工作来提供这种支持。除非你有一群无所事事的实习生，否则这种成本会迅速变得高不可攀。一个合理的折中方案是让少数人员登录许多账户，从而产生倍增效应。另一种方法是投资一个自动注入数据包的流量生成器。虽然效果因人而异，但这些解决方案并不现实，即使通过粗略检查也能发现它们是伪造的。一个很有前景的研究方向是创建自主代理，这些代理可以与网络上的各种节点进行交互并模拟真实用户。通过人工智能的使用，技术水平不断提高，但我们尚未达到那个水平。\n\
  \n### 红队 (Red Team)\n\n红队是指在演习中充当对手的群体。红队不需要“亲手操作键盘”，因为红队演习涵盖了桌面演练（TTX），也了实战演习（LFX）。这些人员在他们试图破坏的任何领域都需要非常精通。如果他们参加的是桌面演练并试图实施欺诈，他们对欺诈和反欺诈活动的了解至少要与演习参与者相当。如果防御者（或蓝队成员）作为一个整体的技能高于红队，那么演习将无法达到效果或无法获得好评。\n\
  \n这种对高技能红队的要求由于多个原因而存在问题。首先，技能与薪酬通常是正比的，这意味着这些人将非常昂贵。由于他们的技能非常受青睐，他们可能没有空参加活动。此外，某些组织可能不愿或无法引入外部人员来利用其系统的漏洞，即使他们已经签署了保密协议（NDA）。这些挑战有时会导致组织使用自己的员工充当红队。如果你的组织有全职负责红队工作或渗透测试的人员，那么这可能没问题。然而，很少有机构的员工中会有此类人员，这意味着使用内部资产成本可能较低，但可能会降低活动的价值。归根结底，一分钱一货。\n\
  \n### 蓝队 (Blue Team)\n\n蓝队是演习中关注的参与者群体。在假设性事件期间，他们执行的任务与在情景真实的情况下，他们在实际工作中所执行的任务相同。尽管其他人可能也会从演习中获益，但受测试和/或培训最多的是蓝队。团队组成取决于活动的范围。然而，由于响应事件和事故通常需要组织内多个小组的协调行动，因此确保蓝队中代表了每一个小组至关重要。\n\
  \n组建蓝队最大的挑战在于，在演习期间以及任何活动后的活动期间，他们无法履行日常职责。对于某些组织来说，这种成本太高，他们最终派遣了他们负担得起空缺的人员，而不是那些真正应该参加的人员。如果发生这种情况，演习对这些参与者可能具有很高的培训价值，但可能无法让整个组织评估其就绪水平。高层或执行管理层的参与和支持对于防止这种情况发生至关重要。\n\
  \n### 白队 (White Team)\n\n白队由所有计划、记录、评估或主持演习的人员组成。虽然将白队成员视为裁判很有诱惑力，但他们做的工作远不止于此。这些人是构思情景的人，与业务部门负责人和其他关键顾问协同工作。他们安排日程，以确保演习目标的实现以及每位参与者都能有所收获。在活动进行期间，白队记录参与者的行动，并在必要时干预，以确保他们不会偏离演习流程。他们可能延迟某些参与者的行动以保持同步。最后，白队通常负责通过记录并与关键人员分享他们的观察结果（以及可能的评估）来开展事后回顾。\n\
  \n## 风险评估 (Risk Evaluation)\n\n`Risk` 是任何信息系统资产遭受损坏或损失的可能性，以及这种情况发生时产生的影响。将风险视为对组织的影响与该风险发生概率的乘积是常见的做法。例如，如果你正在考虑勒索软件感染的风险，资产的价值可以通过预期的赎金（假设你决定支付）、或从备份恢复所有系统的成本（假设你确实拥有这些备份），或者永远无法找回那些信息对你业务所造成的损失来衡量。\n\
  \n显然，并非所有风险都是平等的。如果你使用“价值乘以概率”的公式，结果可以让你了解应该优先处理哪些风险。推测，你会首先关注最大的风险，因为它们比列表其他风险具有更高的价值或概率（或两者兼有）。使用这种量化方法的另一个优势是：它可以帮助你确定缓解风险的成本是否合适。假设某个风险的价值为\
  \ $10,000，可以通过一个仅花费 $1,000 的控制措施来缓解。实施该控制措施是完全合理的，对你来说，获得领导层的支持可能并不困难。\n\n风险评估是对风险进行排名、分类，并确定哪些控制措施可以将其降低到可接受的业务价值的过程。不存在\
  \ 100% 安全的环境，这意味着风险价值始终大于零。风险评估的主要目的是帮助我们在风险价值与缓解风险的控制成本之间取得平衡。\n\n### 影响与概率 (Impact\
  \ and Likelihood)\n\n量化影响和概率的两种方法是定量和定性分析。`quantitative analysis` 用于对可能受特定风险影响的所有资产分配数值（例如，货币价值）。分析中的每个元素（例如：资产价值、威胁频率、漏洞严重程度、影响损害、保护措施有效性、不确定性和概率项目）都经过量化并输入到公式中，以确定总风险和剩余风险。与定性分析相比，这更像是一种科学或数学方法。`qualitative\
  \ analysis` 对风险评估的数据元素使用了一种更“软性”的方法。它不量化这些数据，这意味着它没有为数据分配数值以便在公式中使用。例如，量化风险分析的结果可能是：如果\
  \ Web 服务器遭受缓冲区溢出攻击，组织面临损失 $100,000 的风险；如果数据库被攻破，损失为 $25,000；如果文件服务器被攻破，损失为 $10,000。定性分析不会以货币价值呈现这些发现，而是为风险分配“高”、“中”、“低”等等级。进行定性分析以产生数值的一种常用技术是将“高”类别替换为数字\
  \ 3，“中”为 2，“低”为 1。我们将在书中重点关注定性分析。\n\n\n\n\n收集数据的定性技术示例包括头脑风暴、故事板绘制、焦点小组、调查、问卷、检查清单、一对一会议和面试。执行风险评估的团队会收集对所评估的威胁具有经验和教育背景的人员。当该小组获得一个描述风险和潜在损失的情景时，每个成员都会根据自己的直觉和经验，对威胁发生的可能性以及可能造成的损害程度做出反应。\n\
  \n小组中最熟悉此类风险的专家应该审查该情景，以确保其反映了风险发生的真实情况。随后评估减少此类风险损害的保护措施，并针对每种保护措施模拟情景。暴露和损失的可能性可以根据\
  \ 1 到 5 或 1 到 10 的量表标记为高、中、低。常见的定性风险矩阵如图图 4-4 所示。请记住，此矩阵只是一个示例。你的组织可能会对风险有不同的优先级排序。\n\
  \n![Images](img/00031.jpeg)\n\n**图 4-4** 发生概率与影响的定性分析\n\n![Images](img/00005.jpeg)\n\
  \n**考试提示** 在考试中，你应该能够将影响和发生概率分类为高、中、低。有了这些分类，你应该能够评估技术控制和操作控制措施的适用性。\n\n一旦选定人员对威胁发生的可能性、潜在损失以及每种保护措施的优势进行排名，这些信息将被汇成报告并提交给管理层，以帮助其就如何在该环境中实施保护措施做出更好的决策。这种分析的益处在于，团队成员必须进行通信以对风险进行排序、评估保护措施强度并识别缺点，而且最了解这些主题的人向管理层提供意见。\n\
  \n让我们来看一个定性风险分析的简单示例。风险分析团队展示了一个情景，解释了黑客访问公司内部五个文件服务器上机密信息的威胁。然后，风险分析团队将该情景书面形式给一个五人的小组（网络安全分析师、数据库管理员、应用程序程序员、系统操作员和运营经理），他们还收到一张表格，对威胁的严重性、潜在损失和每种保护措施的有效性进行排名，分为\
  \ 1 到 5 分，1 分表示最严重、最有效或概率最低。表 4-1 显示了结果。\n\n![Images](img/00032.jpeg)\n\n**表 4-1**\
  \ 定性分析示例\n\n这些数据被汇总并插入报告中提交给管理层。当管理层看到这些信息时，会发现员工（或选定的群体）认为购买网络托管备份系统比购买入侵防御系统或实施用户安全意识培训更能保护公司免受此类威胁。这是只观察一个威胁的结果，管理层将查看每个风险的严重性、概率和潜在损失，以便知道应该先处理哪个。\n\
  \n## 避免群体偏差\n\n以小组形式进行风险评估是理想的，但也可能引入群体偏差的问题。这些偏差有时被称为群体思维，可能会导致小组成员在评估可能性、影响和有效性等问题时得出相似的结果。以下是确保每个人都能不受他人影响发表自己意见的建议：\n\
  \n- 保持小组规模小（不超过 12 人）。\n- 让参与者在分享之前先安静地写下意见。\n- 鼓励尊重的异议。\n- 留出充足的讨论时间，也要设定时间限制。\n\
  \n## 技术控制审查\n\n`Technical controls`（也称为逻辑控制）是指主要通过软件或硬件组件实施的安全控制，例如防火墙、IDS、加密、身份识别和身份验证机制。`technical\
  \ control review` 是对技术控制选择以及其实施和管理方式的刻意评估。你可能在风险评估期间已经决定过防火墙可能是针对特定风险的最佳控制措施，但几个月后，你如何知道它正在按照你预想的方式运行呢？除了确保它仍然是针对给定风险的最佳选择外，审查还会考虑此处列出的等问题：\n\
  \n- 控制版本是否是最新的？\n- 配置是否恰当以处理该风险？\n- 是否只有正确的人（没有其他人）有权限管理该控制？\n- 许可证和/或支持合同是否有效？\n\
  \n即使在实行严格配置管理的组织中，发现被遗忘的硬件或软件，或者不再组织内的人员仍有访问权限也是常有的。此外，如果攻击者改变了程序，技术控制的有效性可能会下降甚至失效。这些都是为什么定期审查技术控制是有意义的。##\
  \ 操作控制审查\n\n`Operational controls`（也称为策略或管理控制）是通过业务流程实施并编码在策略信函或标准操作程序 (SOPs) 等文档中的安全控制。管理控制的示例包括安全文档、风险管理、人员安全和培训。与技术控制不同，操作控制通常不需要购买。\n\
  \n与技术控制一样，我们的策略可能会过。此外，人们可能只是没有遵守它们，或者尝试以错误的方法遵守。`operational control review`是对操作控制选择以及其实施和管理方式的刻意评估。审查首先验证控制仍然是针对给定风险的最佳选择，然后考虑此处列出的等问题：\n\
  \n- 控制是否与所有相关的法律、法规、政策和指令一致？\n- 组织的所有受影响成员是否都知道该控制？\n- 控制是否是影响人员的新人培训或定期复习培训的一部分？\n\
  - 控制是否被遵守？\n\n操作控制像技术控制一样，随着时间的推移可能会失效。花时间审查其有效性和完整性是任何安全计划的重要部分。\n\n### 本章总结\n\n\
  本章主要讨论了为确保企业环境安全而可以采取的积极措施。这些讨论的含义是，安全并不是你架构一次后置之不管的事。它是一系列需要定期甚至频繁重新审的挑战和机遇。你可能进行了非常详尽的风险分析并实施了适当的控制，但六月后其中许多措施可能已经失效了。如果不定期（且正式）审查控制的持续有效性，你就不知道这一点。此外，定期进行渗透测试也是明智之举，以确保管理风险的分析练习实际上转化为真实系统的结果。控制审查和渗透测试将验证你的安全架构是稳健的。\n\
  \n\n\n\n\n还存在一些超出架构范围的问题。无论你对环境的保护有多好，早晚你都会遇到需要分析的可疑硬件设备或可执行文件。虽然并非每个组织都具备硬件或软件逆向工程的内部技能，但作为一名分析师，你需要了解问题是什么，以及去哪里寻找可以提供帮助的人员。\n\
  \n最后，还必须考虑信息系统中的人为因素。培训对于维持技能以及更新对当前关注问题的意识来说是绝对至关重要的。然而，仅仅将正确的信息灌输到同事的大脑中并不一定足够。最好的方法是在桌面演习或实战演练中，在尽可能真实的条件下测试他们的表现。在这一点上，你将能够判断出人员是否已经像设备和软件一样，准备好应对针对贵机构的、不断变化的威胁。\n\
  \n### Questions\n\n**1.**](#part0012.html#ch4qus_1) 从被攻破的机器到网络上另一台机器的移动或横移实践被称为什么？\n\
