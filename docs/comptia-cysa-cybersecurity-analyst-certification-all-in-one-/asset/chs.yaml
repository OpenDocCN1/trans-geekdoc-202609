  \n版本 1.0\n\n\n\n\n\n\n\n## 作者简介\n\n### Fernando J. Mayí\n\n`Fernando J. Mayí,` `Ph.D.,`\
  \ `CISSP,` `CSA+` 是美国陆军的网络行动官，目前担任硅谷国防创新单元实验部 (`DIux`) 的项目经理。在该职位上，他致力于加速商业衍生能力的采购，以维护全球和平并提高美国国家安全。在加入\
  \ `DIux` 之前，他是陆军网络学院 (`ACI`) 的研究员，探索新兴的信息安全和网络问题，重点关注实地解决方案。在西点军校就读期间，他担任教员。他是电气电子工程师学会的高级会员。\n\
  \n### Brent Chapman\n\n`Brent Chapman,` `GCIH,` `GCFA,` `CISSP,` `CSA+` 是美国陆军的网络行动官，目前担任硅谷国防创新单元实验部\
  \ (`DIux`) 的项目经理。（注：原文内容重复）。在加入 `DIux` 之前，他是陆军网络学院 (`ACI`) 的研究员，探索新兴的信息安全和防护。在西点军校就读期间，他担任电气工程与计算机科学系的教员。他是计算协会的专业会员和\
  \ FCC 许可证持有者。\n\n## 关于技术编辑\n\n### Bobby E. Rogers\n\n`Bobby E. Rogers` 是一名为国防部机构工作的信息安全工程师，帮助他们进行系统的安全、认证和认可。他的职责包括信息系统安全工程、风险管理以及认证工作。他在美国空军服役\
  \ 21 年后退休，曾担任网络安全工程师和教员，并在全球范围内维护过网络。Bobby 拥有信息保障 (`IA`) 硕士学位，正在首都科技大学攻读网络安全博士。他的认证包括\
  \ `CISSP-ISSEP`、`CEH` 和 `MCSE: Security`，以及 CompTIA `A+`、`Network+`、`Security+`\
  \ 和 `Mobility+`。\n\n\n\n\n\nCompTIA 认证是厂商中立的——这意味着认证专业人士可以熟练地处理大多数组织中使用的各种硬件和软件。\n\
