  - **C.** 系统所有者\n- **D.** FBI 联邦调查局 (FBI)\n\n**4.**](#part0012.html#ch4qus_4) 在演习中，哪种类型的团队是演习的焦点，他们按照日常操作中的方式履行职责？\n\
  - **A.** 蓝队 (Blue team)\n- **B.** 红队 (Red team)\n- **C.** 灰队 (Gray team)\n- **D.**\
  \ 白队 (White team)\n\n**5.**](#part0012.html#ch4qus_5) 下列哪项解决了与组件供应链相关的漏洞？\n- **A.**\
  \ 破解银行 (Exploitation bank)\n- **B.** 部分知识 (Partial knowledge)\n- **C.** 报告链 (Reporting\
  \ chain)\n- **D.** 可信代工厂 (Trusted foundry)\n\n请参考以下插图回答第 6 和 7 题：\n\n![Images](img/00033.jpeg)\n\
