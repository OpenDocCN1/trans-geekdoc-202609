  - **D.** 潜在损失和期望值\n\n使用以下场景回答第 9–12 题：\n你们公司受雇对一家小型金融服务公司进行渗透测试。该公司公司在安全评估方面没有内部专业知识，依靠你们的团队帮助应对挑战。首席信息官（CIO）邀请你与他的网络工程师一起审查网络。由于他们是一家很小的公司，工程师告诉你他们还没有被多次攻击过。此外，大多数生产系统在当地时间上午\
