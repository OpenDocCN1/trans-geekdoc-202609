  \ 的会议，你将进行哪种类型的渗透测试？\n- **A.** 部分知识 (Partial knowledge)\n- **B.** 黑盒测试 (Red box)\n\
  - **C.** 全量回忆 (Total recall)\n- **D.** 零知识测试 (Zero knowledge)\n\n**10.**](#part0012.html#ch4qus_10)\
  \ 在离开办公室之前，你要求 CIO 提供哪份正式文件，以授权你在网络上执行某些活动？\n- **A.** 系统日志 (Syslogs)\n- **B.** 网络流\
  \ (Network flows)\n- **C.** 证书权威机构 (Certificate Authority)\n- **D.** 授权备录 (Authorization\
