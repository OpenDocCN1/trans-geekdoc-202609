- pgno: 207
  md: 'To achieve a reward, the puzzle is either solved completely or the agent has
    failed irreversibly. The latter state is unlikely to occur, as only a few games,
    for example pegs or minesweeper, are able to terminate in a failed state. Alternatively,
    the episode can be terminated early. Starting a new episode generates a new puzzle
    of the same kind, with the same parameters such as size or grid type. However,
    if the random seed is not fixed, the puzzle is likely to have a different layout
    from the puzzle in the previous episode.


    # ## E.2.2 Observation Space


    There are two kinds of observations which can be used by the agent. The first
    observation type is a representation of the discrete internal game state of the
    puzzle, consisting of a combination of arrays and scalars. This observation is
    provided by the underlying code of Tatham''s puzzle collection. The composition
    and shape of the internal game state is different for each puzzle, which, in turn,
    requires the agent architecture to be adapted.


    The second type of observation is a representation of the pixel screen, given
    as an integer matrix of shape (3×width×height). The environment deals with different
    aspect ratios by adding padding. The advantage of the pixel representation is
    a consistent representation for all puzzles, similar to the Atari RL Benchmark
    [193]. It could even allow for a single agent to be trained on different puzzles.
    On the other hand, it forces the agent to learn to solve the puzzles only based
    on the visual representation of the puzzles, analogous to human players. This
    might increase difficulty as the agent has to learn the task representation implicitly.


    # ## E.2.3 Action Space


    Natively, the puzzles support two types of input, mouse and keyboard. Agents in
    PUZZLES play the puzzles only through keyboard input. This is due to our decision
    to provide the discrete internal game state of the puzzle as an observation, for
    which mouse input would not be useful.


    The action space for each puzzle is restricted to actions that can actively contribute
    to changing the logical state of a puzzle. This excludes “memory aides” such as
    markers that signify the absence of a certain connection in _Bridges_ or adding
    candidate digits in cells in _Sudoku_. The action space also includes possibly
    rule-breaking actions, as long as the game can represent the effect of the action
    correctly.'
