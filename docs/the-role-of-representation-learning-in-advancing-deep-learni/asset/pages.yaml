- pgno: 235
  md: '# E.6.4 Episode Length and Early Termination Parameters


    In Table E.6.50, the puzzles and parameters used for training the agents for the
    ablation in Section 8.4.4 are shown in combination with the results. Due to limited
    computational budget, we included only a subset of all puzzles at the easy human
    difficulty preset for DreamerV3. Namely, we have selected all puzzles where a
    random policy was able to complete at least a single episode successfully within
    10,000 steps in 1000 evaluations. It contains a subset of the more challenging
    puzzles, as can be seen by the performance of many algorithms in Table E.6.47.
    For some puzzles, e.g. NetSlide, Samegame, Sixteen and Untangle, terminating episodes
    early brings a benefit in final evaluation performance when using a large maximal
    episode length during training. For the smaller maximal episode length, the difference
    is not always as pronounced.'
