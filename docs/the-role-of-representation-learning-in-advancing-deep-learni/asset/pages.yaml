  md: 'increased reasoning effort can extend the solvable problem range but may also
    introduce inefficiencies for simpler instances.


    # 9.5 Conclusion


    This study examined how reasoning effort scales in LLMs using the Tents puzzle.
    We found that reasoning effort generally scales linearly with problem size for
    solvable instances. Model performance varied, with o3-mini and DeepSeek R1 showing
    better performance than Qwen/QwQ-32B-Preview and Gemini 2.0 Flash Thinking. These
    results suggest that while LLMs can adapt reasoning effort to problem complexity,
    their logical coherence has limits, especially for larger problems. Future work
    should extend this analysis to a wider variety of puzzles contained in the PUZZLES
    benchmark to include puzzles with different algorithmic complexity. These insights
    could lead the way to find strategies to improve reasoning scalability and efficiency,
    potentially by optimizing reasoning length or refining prompting techniques. Understanding
    these limitations is crucial for advancing LLMs in complex problem-solving.'
