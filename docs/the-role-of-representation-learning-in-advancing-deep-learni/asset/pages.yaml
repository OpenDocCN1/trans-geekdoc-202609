- pgno: 37
  md: 'represented within the framework of ILP, which is essential for our approach.
    Despite the piecewise linearity of ReLU, it remains non-linear, enabling our neural
    network to approximate nonlinear functions as well. Consequently, the learned
    estimated value function for bidder $i$, $\tilde{v}_i$, cannot be used directly
    inside a linear program. A similar problem already occurred in previous work [285],
    see Lemma 2.2. In this chapter, we follow a similar approach. Let $d_k$ be the
    dimension, $b^k$ the bias of layer $k$ and $W^k$ the matrix used to compute the
    output values of the layer $k + 1$ based on the output values of layer $k$. Further,
    $o^{k+1}$ denotes the output of layer $k + 1$ which is computed as the element-wise
    maximum of $0$ and $W^k \cdot o^k + b^k$ due to the ReLU activation function.
    We can convert the neural network into a set of linear constraints by means of
    a technique first introduced in [285]. For any layer $k$ (besides the input layer),
    we introduce three new vectors $y^k, z^k, q^k$, all of size $d_k$, together with
    the three linear constraints in (2.2) - (2.4) from Lemma 2.2, which satisfy $z^k
    = o^k$.


    Let $K + 1$ be the number of layers, input and output layer included. The output
    of the neural network corresponds to the output of the output layer and is therefore
    equal to $o^K$ (indexing starts at 0). Hence, we can write $\tilde{v}_i(x) = z^K$
    if the following constraints are satisfied:


    ```

    z^0 = x

    z^k - q^k = W^{k-1} \cdot z^{k-1} + b^{k-1}

    0 \le z^k \le y^k \cdot L

    0 \le q^k \le (1 - y^k) \cdot L

    y^k \in \{0, 1\}^{d_k}

    \Bigg\} \forall k \in \{1, ..., K\}

    ```


    Some remarks on the constraints: $L$ is a big constant, such that for $\forall
    k \in \{1, ..., K\}$ and for every element $z \in z^k$, $z < L$ and for every
    element $q \in q^k$, $q < L$. Further, $z^k$ and $q^k$ are vectors in the real
    number space. We omit the proof and refer to the proof of Theorem 1 in the paper
    in [285].


    To solve the optimization problem, we use the ILP (2.13) from the linear model
    defined in the previous section and replace the now nonlinear expression $\tilde{v}_i(x)$
    with the just derived linear representation.'
