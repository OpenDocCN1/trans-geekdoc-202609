  md: '# 7.2 Related Work


    The Abstraction and Reasoning Corpus, proposed by Chollet [49], consists of 400
    training tasks, 400 validation tasks and 200 tasks which are withheld for private
    evaluation. Each of the 800 publicly available tasks consists of two to six image
    pairs. Given these few example demonstrations, the goal is to come up with the
    missing solution of a specific test input image. Initially, the challenge was
    hosted as a Kaggle competition [89] and has recently seen a revival by Lab42 [150].
    Many of the top performing solutions rely on an ensemble of heuristic program
    searches using hand-crafted domain specific languages [287, 7, 131] and achieve
    up to 30 percent accuracy on the private evaluation set. However, there is still
    a large gap to match human performance, which is estimated to be at least around
    80 percent [139]. Besides these approaches, there exist other proposals which
    incorporate some sort of learning based techniques such as neurosymbolic approaches
    [8], graph representations [304] or object-centric approaches [296, 11]. In addition,
    recent efforts have started to investigate how natural language can help solve
    ARC tasks [4]. However, they provide a human-generated text guidance on how to
    solve a task, whereas in this chapter we focus on describing and solving the complete
    task in an automated way in the language domain.


