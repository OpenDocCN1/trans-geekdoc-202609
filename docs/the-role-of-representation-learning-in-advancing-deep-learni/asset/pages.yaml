- pgno: 10
  md: '# Introduction


    Navigating the complexities of the real world depends on the ability to abstract.
    Abstractions are not just helpful; they are essential cognitive mechanisms that
    allow us to condense high-dimensional sensory input into manageable representations,
    retaining only the information relevant to a given task. However, identifying
    which aspects of the raw data are truly relevant to a given task is a key challenge
    in learning these critical abstractions from data. Humans have evolved sophisticated
    perceptual and reasoning systems that implicitly learn and encode valuable priors
    through language and cultural transmission [225]. In contrast, deep neural networks
    are known to be vulnerable to exploiting spurious correlations unless appropriately
    guided [95]. Lacking robust inductive biases, these models often struggle to generalize
    beyond their training data and fail to capture the true underlying functions [99,
    160]. Representation learning directly addresses the core problem: extracting
    relevant information and meaningful structure from noisy, high-dimensional data.
    It achieves this by developing priors and training techniques that enable models
    to learn representations that go beyond superficial pattern recognition.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'In the subsequent chapters, we delve into various facets of representation
    learning, exploring techniques to guide neural networks towards learning more
    effective and meaningful representations. The work can be structured into three
    major parts: Active learning, general representation learning, and reasoning.


    # ## 1.1 Active Learning


    Chapters 2 and 3 focus on Active Learning, a paradigm that directly addresses
    the challenge of data efficiency in deep learning. Active learning achieves data
    efficiency by strategically selecting samples to train a network, aiming to maximize
    performance from a minimal amount of labeled data. The focus of this part is how
    we can leverage features of intermediate representations in order to identify
    relevant samples.


    In Chapter 2, we investigate the use-case of active learning for iterative combinatorial
    auctions. Combinatorial auctions allow bidders to not only bid on single items
    but also on a combination of items, called a bundle. In this setting, the active
    learning process strategically queries bidders for their valuations on specific
    bundles of items. This is crucial because, in combinatorial auctions, exploring
    the entire space of possible bundles is computationally infeasible. We introduce
    two novel active learning strategies, GALI and GALO, designed to efficiently explore
    this vast bundle space. GALI prioritizes comprehensive coverage of the bundle
    space, while GALO focuses on areas of high valuation uncertainty. By employing
    linear programming techniques, we demonstrate how active learning can be effectively
    applied even when dealing with exponentially large sample pools. This chapter
    highlights how active learning can guide the network to learn representations
    of each bidders value function that are most informative for efficient resource
    allocation, ultimately enhancing the economic efficiency of these auctions.


    Chapter 3 further explores active learning strategies, specifically focusing in
    settings where pre-trained models are available. Thanks to self-supervised representation
    learning techniques, pre-trained models are available for a wide range of settings.
    This chapter introduces a novel, simple heuristic called TCM, designed to overcome
    the ’cold start’ problem often encountered in active learning, by integrating
    diversity and uncertainty sampling. TCM demonstrates the value of a simple strategy
    combining the exploration of diverse data samples (using TypiClust) and exploitation
    of high-uncertainty samples (using Margin sampling). This strategy allows the
    model to first'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'learn the key task relevant factors and after that take more fine grained differences
    into account. TCM underscores how representation learning can enable the use of
    simple active learning techniques to drastically improve the performance of the
    final model.


    # # 1.2 General Representation Learning


    Having explored active learning, we now broaden our scope to consider architectural
    and training methods that facilitate the learning of meaningful intermediate representations.
    Based on these representations, we are able to achieve features such as better
    sample efficiency for learning downstream tasks, the ability for domain-agnostic
    architectures or better scalability and structuring of large inputs.


    Chapter 4 shifts focus to disentangled representation learning. Disentanglement
    aims to learn representations in which distinct factors of variation in the data
    are encoded in separate, independent latent variables. This is desirable for interpretability
    and improved generalization in downstream tasks. In this chapter, we introduce
    the Disentangling Adversarial Variational Autoencoder (DAVA), a novel training
    procedure for variational autoencoders that elegantly solves the challenging problem
    of hyperparameter selection, which is often critical for achieving good disentanglement.
    DAVA eliminates the need for dataset-specific hyperparameter tuning while remaining
    competitive with models tuned with optimal hyperparameters. Furthermore, we identify
    a necessary condition for unsupervised disentanglement, termed PIPE, and demonstrate
    its ability to predict the performance of downstream models in abstract reasoning,
    emphasizing the practical benefits of learning disentangled representations.


    Chapter 5 then explores a different perspective on representation learning by
    leveraging Implicit Neural Representations (INRs). INRs offer a unique way to
    represent data as continuous functions, allowing for a unified framework across
    diverse data modalities. In this chapter, we introduce FunctaFormer, a domain-agnostic
    super-resolution method that utilizes INRs to upscale any arbitrary data type.
    By treating data as functions, FunctaFormer overcomes the limitations of domain-specific
    architectures and achieves competitive super-resolution performance across images,
    audio, videos, 3D shapes, and even unstructured data like LiDAR scans and manifold
    data. This work illustrates how the choice of representation space itself – moving
    to functional representations – can enable the reuse of the same architecture
    for completely'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'different domains. While FunctaFormer still involves separately trained models
    for the separate domains, it is a step towards unified architectures with a generalized
    representation space. This will become increasingly relevant with more flexible
    multi-modal models, depending on this ability to tackle diverse inputs.


    In Chapter 6, we address the challenge of scaling transformers to large inputs
    through architectural innovation. Transformers have demonstrated remarkable capabilities,
    but their computational cost scales quadratically with input length, limiting
    their applicability to long sequences or high-resolution images. This chapter
    presents a novel tree-based encoder-decoder architecture designed to reduce the
    computational complexity of self-attention in the encoder and cross-attention
    in the decoder. By constructing a hierarchical tree representation of the input,
    our model allows the decoder to efficiently parse and search for relevant information,
    significantly reducing computational cost. In particular, it shows an approach
    that is able to structure information on different levels of abstraction. At the
    same time, all levels of abstraction remain accessible to the decoder and can
    be navigated through the tree structure. This work demonstrates how architectural
    modifications can improve the scalability and efficiency of representation learning,
    enabling transformers to process larger and more complex data. Further, it plays
    into a line of research that tries to separate perception from the processes of
    solving a downstream task [133, 134, 35]. Future work in this direction might
    eventually lead to more efficient transformer architectures with improved scaling
    properties.


    # 1.3 Reasoning


    The remaining chapters of this thesis shift the focus towards reasoning, a more
    complex cognitive ability that demands sophisticated intermediate representations.
    In the following chapters, we analyze how the choice of these representations
    affects reasoning performance. Many problems can be solved using fast, intuitive
    thinking while others need some form of slower, analytical thinking. [206, 112].
    Following the nomenclature of [141], system 1 corresponds to fast thinking and
    system 2 corresponds to slow thinking. Many of the popular problems tackled in
    modern deep learning correspond to system 1 problems, where the same amount of
    compute is applied to each input. Real-world examples include spam detection [57],
    product recommendations [307], image classification [218], sentiment analysis
    [297] and'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'machine translation [252]. Only recently, mostly with the release of OpenAIs
    o1 model [132], general system 2 reasoning at a large scale has entered the stage.
    System 2-style models do not use a fixed amount of compute for a problem. Instead,
    the models have been trained to output a varying amount of intermediate thinking
    tokens before coming up with an answer, in other words scaling test-time compute
    [248]. We will show in Chapter 9 that the amount of intermediate tokens scales
    with the complexity of the problem.


    The use of a suitable representation space is crucial for this kind of slow thinking,
    even more critical is operating at the correct level of abstraction within that
    space. Imagine attempting to write a complex program in assembly language. While
    theoretically capable of expressing any computation, the sheer number of low-level
    steps exponentially inflates the search space for solutions, making even moderately
    complex tasks overwhelmingly difficult. This is analogous to reasoning with overly
    concrete, low-level representations. A more abstract language like C or Python
    provides abstractions that constrain the search space by focusing on higher-level
    concepts and hiding unnecessary details. This abstraction is not just about simplicity;
    it’s about efficiency. By limiting the search space to relevant operations at
    the appropriate level of detail, these languages enable programmers to effectively
    tackle complex problems. Similarly, learning to represent problems at the correct
    level of abstraction is paramount for efficient reasoning.


    As we show in Chapter 7, natural language can be a highly beneficial abstraction
    for reasoning, even for visual problems. We consider the Abstraction and Reasoning
    Corpus (ARC) benchmark [49]. ARC is designed to assess human-like abstract reasoning
    abilities, posing a significant challenge for AI systems. In this chapter, we
    propose a novel approach that transforms ARC tasks from the visual domain to the
    language domain using a set of hard-coded rules. By leveraging pre-trained language
    models to reason in the textual domain, we demonstrate a general learning-based
    framework that can solve some ARC tasks, including tasks previously unsolved by
    other learning-based methods. This work provides compelling evidence that language,
    with its inherent structure and learned priors, can serve as a powerful representation
    space for tackling abstract reasoning challenges, suggesting that grounding visual
    information in language can unlock powerful reasoning abilities. In fact, most
    of current state-of-the-art reasoning models do reason in language space [203,
    63, 104], with some recent works also using a continuous latent space [111].


    Recognizing the increasing importance of system 2 reasoning in AI, especially
    with the rise of agentic language models [3], we introduce a novel'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'benchmark, PUZZLES, in Chapter 8. PUZZLES is a diverse collection of 40 logic
    puzzles, standardized within the gymnasium interface. It is designed to provide
    a common ground for evaluating and comparing the algorithmic reasoning capabilities
    of neural agents, particularly in reinforcement learning. The adjustability of
    the benchmark and the diverse types of puzzles allow fine-grained analysis of
    the strengths and generalizability of reasoning, fostering future research into
    the priors necessary for robust algorithmic reasoning.


    Finally, building upon the PUZZLES benchmark, Chapter 9 investigates the deductive
    reasoning capabilities of Large Language Models (LLMs) on increasingly complex
    logic puzzles. Using the infinitely scalable Tents puzzle, we analyze how the
    reasoning effort of LLMs scales with problem size. Our findings reveal a critical
    limitation: reasoning effort does not scale indefinitely with complexity, and
    may even decrease beyond a certain threshold. This highlights potential limitations
    in the logical coherence of current LLMs and underscores the need for strategies
    to improve reasoning scalability and robustness. This analysis provides valuable
    insights into the strengths and weaknesses of language-based representations for
    algorithmic reasoning.


    Through these diverse chapters, this thesis explores various aspects of representation
    learning, ranging from data-efficient learning through active learning, to learning
    disentangled representations, leveraging functional representations for domain
    generalization, improving transformer scalability, and investigating the crucial
    area of reasoning. By addressing these challenges and proposing novel techniques
    and benchmarks, this thesis contributes to a deeper understanding and advancement
    of representation learning in deep neural networks, ultimately paving the way
    for more robust, efficient, and intelligent AI systems.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# An Active Learning Approach to Iterative Combinatorial Auctions


    # Abstract


    In deep learning-based iterative combinatorial auctions (DL-ICA), bidders are
    not required to report valuations for all bundles upfront. Instead, DL-ICA iteratively
    requests bidders to report their values for specific bundles and determines item
    allocation using a winner determination problem, with bidder profiles modeled
    by neural networks. However, due to the limited number of reported bundles, DL-ICA
    may not always achieve optimal winner allocation, leading to reduced economic
    efficiency. In this chapter, we enhance the economic efficiency, specifically
    the social welfare, of DL-ICA by optimizing the underlying machine learning-based
    elicitation algorithm. We introduce two novel active learning-based initial sampling
    strategies: GALI and GALO. GALI ensures optimal coverage of the entire bundle
    space during sampling, while GALO identifies bundles with high diversity in bidders’
    estimated values as determined by the neural network. This approach extends the
    application'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'of active learning beyond small pool sizes. We demonstrate how linear programs
    can be utilized for active learning to manage pool sizes exceeding 10^30 samples.
    Our approach is theoretically validated and experimentally verified, showcasing
    significant improvements in performance.


    # ## 2.1 Introduction


    A combinatorial auction (CA) is a type of auction in which bidders are allowed
    to place bids not only on individual items but also on bundles of items [217].
    CAs allow bidders to fully express their preferences. As a result, bidders will
    not suffer from the exposure problem [78], where a bidder tries to acquire certain
    collections of items, but then ends up with only incomplete subsets of those collections.
    Combinatorial auctions are widely used in practice, for example in the sale of
    TV advertising slots [101] and in government spectrum auctions [56]. On the downside,
    as the number of items in the CA increases, the CA''s bundle space grows exponentially.
    This makes it challenging for bidders to report their full value functions. Instead,
    algorithms have to be used to achieve an efficient allocation without asking the
    bidders to value all possible combinations of items. Iterative combinatorial auctions
    interact with the bidders in rounds. In each round, the algorithm asks the bidders
    about a limited number of bundles. Deep learning techniques have been used because
    they provide a better estimate of the bidders'' valuation of the unreported bundles
    [285].


    Previous studies [285] have not considered the effects of sampling strategies
    for eliciting bidders'' valuations. This leads to inefficient allocations where
    the auction outcome is unlikely to reach the social optimum. To improve the efficiency
    of deep learning-based iterative combinatorial auctions (DL-ICA), we propose to
    incorporate active learning strategies when determining the bundles that bidders
    are initially asked to report their willingness to pay for. We implement two different
    versions of pool-based active learning for regression (ALR), namely greedy active
    learning on input values (GALI) and greedy active learning on output values (GALO).
    We show that it is possible to handle sample pools of exponential size by using
