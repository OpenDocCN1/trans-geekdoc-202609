- pgno: 2
  md: '# Abstract


    This thesis explores the multifaceted role of representation learning in improving
    the performance of deep neural networks in various applications. We delve into
    the paradigm of active learning, investigating its application in iterative combinatorial
    auctions and the integration of diversity and uncertainty-based sampling strategies
    in the context of self-supervised, pre-trained models. Our exploration extends
    to disentangled representation learning, where we introduce a novel training procedure
    for variational autoencoders that overcomes the challenge of hyperparameter selection
    and enables consistent learning of disentangled representations. We also leverage
    implicit neural representations for domain-agnostic super-resolution, demonstrating
    the ability to upscale any arbitrary data type. In addition, we address the challenge
    of scaling transformers to large inputs by proposing a hierarchical tree-based
    architecture. Finally, we investigate the reasoning capabilities of large language
    models. We demonstrate the feasibility of using language for reasoning in abstract
    visual tasks. We then introduce a benchmark for evaluating algorithmic reasoning
    and analyze the scaling behavior of reasoning language models on complex logic
    puzzles. Through these diverse investigations, this thesis contributes to a deeper
    understanding of representation learning and its potential to advance the development
    of more robust, efficient, and intelligent AI systems.'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# Zusammenfassung


    In dieser Arbeit wird die Rolle des Repräsentationslernens bei der Verbesserung
    der Leistung von neuronalen Netzen untersucht. Zunächst befassen wir uns mit dem
    Paradigma des aktiven Lernens und untersuchen seine Anwendung in Auktionen. Wir
    erforschen auch die Integration von Sampling-Strategien des aktiven Lernens, insbesondere
    im Kontext von vortrainierten Modellen. Unsere Untersuchungen erstrecken sich
    auch auf das Lernen von entwirrt Repräsentationen, wo wir ein Trainingsverfahren
    für variationale Autoencoder einführen, das die Herausforderung der Hyperparameterauswahl
    überwindet und ein konsistentes Lernen ermöglicht. Außerdem nutzen wir implizite
    neuronale Repräsentationen für Superauflösung und demonstrieren die Fähigkeit,
    jeden beliebigen Datentyp hochzuskalieren. Darüber hinaus gehen wir die Herausforderung
    der Skalierung von Transformern an, indem wir eine hierarchische Architektur vorschlagen.
    Schließlich untersuchen wir die Fähigkeiten von großen Sprachmodellen zur logischen
    Schlussfolgerung. Wir demonstrieren die Machbarkeit der Verwendung von Sprache
    für Schlussfolgerungen bei abstrakten visuellen Aufgaben. Anschließend führen
    wir einen Benchmark für die Bewertung algorithmischen Denkens ein und analysieren
    das Skalierungsverhalten von Sprachmodellen bei komplexen Logikrätseln. Durch
    diese Untersuchungen trägt diese Arbeit zu einem tieferen Verständnis des Repräsentationslernens
    und dessen Potenzial bei, die Entwicklung robusterer, effizienter und intelligenterer
    KI-Systeme voranzutreiben.'
