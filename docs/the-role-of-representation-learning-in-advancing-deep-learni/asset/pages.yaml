    The estimated value functions of the bidder are then summed up to build the social
    welfare function \( \tilde{V}^t(a) = \sum_{i \in \mathcal{N}} \tilde{v}_i^t(a_i)
    \). Bero et al. [24] used kernelized SVR for their models. Weissteiner and Seuken
    [285] modified the algorithm by using Deep Neural Networks instead of SVR. Neural
    networks can in general capture more complex functions than linear or quadratic
    kernels.


    The WDP has the goal of allocating the items of an auction in such a way, that
    the social welfare of the auction is maximized. In every iteration \( t \) we
    are interested in finding a maximal allocation \( a^t \) with respect to the estimated
    social welfare function \( \tilde{V}^t \). This can be formulated as:


    ```

    \(\arg \max_{a \in \mathcal{X}^n} \sum_{i \in \mathcal{N}} \tilde{v}_i^t(a_i^t)\)

    \(\text{s.t.} \sum_{i \in \mathcal{N}} a_{ij} \le 1, \quad \forall j \in \mathcal{M}\)

    \(a_{ij} \in \{0, 1\}, \quad \forall j \in \mathcal{M}, \forall i \in \mathcal{N}\)

    (2.1)

    ```


    Weissteiner and Seuken [285] have shown that the presented WDP can be modeled
    as neural networks with ReLU activation function into a MIP. For every bidder,
    a fully connected multi-layer perceptron (MLP) with ReLU activation functions
    is used to learn the bidder''s value function. The output layer does not have
    an activation function. Let \( d_k^i \) represent the dimension of layer k. Let
    further \( W^{i,k} \) be the matrix containing the weights employed to compute
    the values of the layer \( k + 1 \) and \( b^{i,k} \) the bias we add in the computation
    for layer \( k + 1 \) in the neural network for bidder \( i \). Then the output
    \( o^{i,k+1} \in \mathbb{R}^{d_{k+1}^i} \) of layer \( k+1 \) is computed as \(
    o^{i,k+1} = \max \{0, W^{i,k} \cdot o^{i,k} + b^{i,k} \} \). The presented MLP
    can then be expressed as a nested function, where the output of the function corresponds
    to the output layer of the neural network. For a one-hidden-layer perceptron and
    input vector \( x \), the function would be \( \tilde{v}_i(x) = W^{i,2} \cdot
    (\max \{0, W^{i,1} \cdot x + b^{i,1} \}) + b^{i,2} \).


