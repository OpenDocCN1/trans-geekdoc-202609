    # C.3 Data


    **Images.** For the image modality, we select the well-known DF2K dataset, which
    combines the DIV2K [6] and FlickR2K [165] datasets. DIV2K consists of 800 high-resolution
    training images, 100 validation images, and 100 test images. FlickR2K contains
    over 2560 training images. For our training set, we use the 800 training images
    from DIV2K along with the 2560 training images from FlickR2K. For ablation studies,
    we utilize the 100 validation images from DIV2K, splitting them into two halves:
    the first half for validation and the second half for testing, as the 100 DIV2K
    test images are not available for download. For comparison against current state-of-the-art
    methods on super-resolution tasks, we utilized the SET5 [19], SET14 [299], Urban100
    [126], Manga109 [186], and BSD100 [184] image sets. These datasets are standard
    benchmarks in single-image super-resolution. Instead of resizing the entire dataset,
    we take random crops of size $120 \times 120 \times 3$ during training and validation.
    In terms of data augmentation, we add random horizontal flip the images with a
    probability of $p = 0.5$. To ensure a fair comparison with previous works, such
    as those by [65, 163, 124], we padded the test images to a size divisible by the
    SIREN slicing dimensions and FunctaFormer window sizes. Before evaluation, the
    images are cropped back to their original sizes, and we do not exclude the border
    pixels in our evaluation.


    **Manifolds.** For manifold data we use a subset of the ERA5 [118] climate reanalysis.
    Namely the hourly 2m surface temperature measurements in Kelvin from 1971 to 2020.
    The measurements are then monthly averaged'
