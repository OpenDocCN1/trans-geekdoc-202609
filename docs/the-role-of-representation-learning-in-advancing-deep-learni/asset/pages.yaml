    # 7.1 Introduction


    The Abstraction and Reasoning Corpus (ARC), introduced by Chollet [49], is designed
    to measure the progress of artificial intelligence (AI) by testing the ability
    to learn and adapt to unseen tasks. ARC consists of a small dataset of only 1000
    tasks similar to the example in Figure 7.1. For each task, two to six demonstrations
    are given and the solution of a given test input has to be predicted. By design,
    the number of tasks is very limited, which makes it especially challenging for
    learning based approaches to be successful on ARC. Usually, state of the art models
    have to rely on enormous amounts of data to correctly estimate and learn the underlying
    functions directly from the given data.


    ![](img/c742333bcb21933724ca00794dbfb657_103_0.png)


    Figure 7.1: Each ARC task consists of pairs of input and output images that describe
    the task. To solve the task, the missing output image corresponding to the given
    test input must be predicted.


    Learning only from the provided tasks to solve ARC is most likely not sufficient.
    As argued by Chollet [49], prior knowledge closely aligned to human intelligence
    should be incorporated into the approaches. The most important priors cover objectness,
    goal-directness, numbers and counting as well as elementary geometry [49, 250].
    These include the concept of objects, that they can persist, comparing sizes or
    checking for symmetries. The main challenge lies in how to incorporate these priors
    in an approach to solve ARC.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'One can make them explicit through handcrafted heuristics, for example with
    domain-specific languages (DSLs) [287, 7, 131]. These DSLs can then be used to
    brute-force programs that search and propose correct solutions. However, it is
    extremely difficult to capture all important priors explicitly and apply them
    correctly. Further, an exhaustive search is computationally expensive and might
    even yield wrong results, as not all combinations of priors are equally likely
    to appear at the same time.


    ![](img/c742333bcb21933724ca00794dbfb657_104_0.png)


    **Figure 7.2:** The original tasks are given as image pairs in the visual domain
    (red) and are then transformed to the text domain (blue) using the encoder. The
    textual form of the task description allows a language model to propose a solution
    which is decoded back to the visual domain.


    We believe that another promising path to include such priors is through a learning-based
    approach centered on natural language. Natural language itself has evolved to
    incorporate human priors as an efficient way to describe our world. Furthermore,
    natural language has been shown to allow for better generalization across different
    tasks [199]. Recently, the emergence of Large Language Models (LLMs) has demonstrated
    success in understanding and producing natural language. Because these models
    have seen incredibly large amounts of human-generated text during their unsupervised
    pre-training, they have implicitly incorporated human priors.


    We motivate to leverage these insights and capabilities to automate the usage
    of language as a tool to create the foundation for a learning-centric approach
    to tackle ARC. We propose a general framework by first transforming an ARC task
    into a textual description of the entire task. A generic language model can then
    be used in a black-box fashion to output a description of the missing solution.
    Finally, the predicted solution can be translated back to the visual domain. An
    illustration of the entire framework is shown in Figure 7.2. Furthermore, we implement
    a first pipeline based on this framework to demonstrate the viability of this
    approach using a variety of available language models. In particular, through
    our learning-centric approach, we are able to solve tasks which could not be solved
    by any of the existing state-of-the-art DSL solutions.'
