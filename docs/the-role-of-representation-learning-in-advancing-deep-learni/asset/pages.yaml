    # 2.2 Background and Related Work


    # 2.2.1 Machine Learning Powered CAs


    Machine learning algorithms have been used in the mechanism design of CAs for
    almost two decades. The majority of previous work can be classified in two ways:
    (i) generating CA mechanisms with machine learning algorithms, and (ii) reducing
    the computational complexity within the auction process with machine learning
    methods. In (i), researchers utilized the automated mechanism design paradigm
    to generate CA mechanism directly with machine learning algorithms [74, 75, 102,
    198]. In (ii), previous studies focused on improving the computational efficiency
    during the auction process [21, 151]. In particular, Bayesian learning techniques
    have been applied in CAs to converge faster [24, 25].


    Recently, machine learning algorithms have been integrated into CAs, especially
    as iterative combinatorial auctions (ICAs) [208]. ICAs do not require bidders
    to report their full valuation functions on all bundles. Instead, ICAs only query
    a limited number of random bundles at the beginning of the auctions and interact
    with the bidders iteratively to ask their value of specific bundles in multiple
    rounds until they compute the final allocation. Previous work utilizes machine
    learning techniques, such as kernelized support vector regressions (SVRs), to
    learn the valuation functions of bidders on different bundles of items [22, 23,
    20]. Then, these techniques contribute to the elicitation algorithm and improve
    the economic efficiency of the algorithm compared with traditional ICAs, i.e.,
    combinatorial clock auction (CCA) [12]. Weissteiner and Seuken [285] introduce
    deep neural networks (DNNs) into the'
