    trained entirely on ISIC2019. Other methods such as ProbCover, DBAL, or Least
    confidence seem to struggle a lot with providing consistent performance in all
    data regimes and datasets. Furthermore, our results show that when using a pre-trained
    backbone, more complex methods such as SelectAL do not seem necessary, because
    the transition point occurs much earlier compared to training from scratch. This
