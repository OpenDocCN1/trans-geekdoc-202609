    We present Lemma 2.2 from Weisteiner and Seuken [285], which shows how one can
    encode the output values of a layer using a set of linear constraints.


    **Lemma 2.2.** Let \( W^{i,k-1} \circ o^{i,k-1} + b^{i,k-1} \in \mathbb{R}^{d_k^i}
    \) be fixed for \( a \in \{1, ..., K_i\} \) (where \( K_i + 1 \) denotes the number
    of layers including input and output layer). Furthermore, let \( z^{i,k}, s^{i,k}
    \in \mathbb{R}^{d_k^i}, y^{i,k} \in \mathbb{R}^{d_k^i} \). Consider the following
    linear constraints:


    ```

    z^{i,k} - s^{i,k} = W^{i,k-1} \circ o^{i,k-1} + b^{i,k-1} \tag{2.2}


    0 \le z^{i,k} \le y^{i,k} \cdot L \tag{2.3}


    0 \le s^{i,k} \le (1 - y^{i,k}) \cdot L \tag{2.4}

    ```


    The polytope defined by (2.2) - (2.4) is not empty and every element \( (z^{i,k},
    s^{i,k}, y^{i,k}) \) of this polytype satisfies \( z^{i,k} = o^{i,k} \).


    Here, \( L \) denotes a big constant, that is guaranteed to be large enough to
    satisfy that every element in \( z^{i,k} \) and in \( s^{i,k} \) for all \( k
    \in \{1, ..., K_i\} \) is smaller than \( L \).


    Using Lemma 2.2, we can reformulate the WDP 2.1 into a MIP, so it can be efficiently
    solved using a linear program solver:


