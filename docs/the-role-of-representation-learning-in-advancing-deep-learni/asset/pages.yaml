  md: '# The PVM Algorithm


    The Vickery-Clarke-Groves auction (VCG) is a famous auction type for combinatorial
    auctions. One big advantage of VCG is its strategyproofness, which means that
    bidding truthfully represents a dominant strategy. In style of VCG, Bero et al.
    [24] have presented the auction mechanism Pseudo-VCG (PVM), which computes an
    allocation and payments for a CA instance. PVM executes Algorithm 2.1 n + 1 times,
    once for the main economy, n-times for the n marginal economies, where one bidder
    does not participate in the auction. After determining the best allocation under
    the set of elicited bundles returned by Algorithm 2.1 for every economy, it chooses
    the allocation with the highest social welfare and then computes the payments
    according to the VCG-payment rule.


    ```

    Algorithm 2.3 Pseudo-VCG Mechanism (PVM) by Bero et al. [24]

    Run Algorithm 1 n + 1 times to get B^(-0), B^(-1), ..., B^(-n)

    B^* <- (U_{i=1}^n B^(-i)) U B^(-0)

    Determine allocations a^(-0), a^(-1), ..., a^(-n), where

    a^(-i) in arg max_{a in F} V(a|B^(-i)) forall i in {emptyset, 1, 2, ..., n}

    Allocate items according to:

    a^pvm in arg max_{a in {a^(-0), a^(-1), ..., a^(-n)}} V(a|B^(-i))

    Charge each bidder i according to:

    p_i^pvm = sum_{j in N, j != i} v_j(a^(-i)) - sum_{j in N, j != i} v_j(a^pvm)

    ```


    Notice, that the allocations a^(-0), a^(-1), ..., a^(-n) can only assign bundles
    to bidders, which the mechanism has already queried in Algorithm 2.1 from this
    bidder. In other words, if bidder i gets bundle x in the allocation a^(-j), then
    x must be in the set B_i^(-j). As the sets B^(-0), B^(-1), ..., B^(-n) might differ,
    there is no guarantee, that the social welfare of the main economy is the largest,
    unlike as in VCG. Even though being quite similar to the normal VCG auction, PVM
    is not strategyproof as Bero et al. [24] have shown. However, it satisfies at
    least the property of having the bidder''s incentives aligned with the social
    welfare. The increase of a bidder''s utility always'
