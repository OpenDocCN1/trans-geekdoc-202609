    (i.e. all nodes in the tree are used for cross-attention) and keep the number
    of total parameters the same for all configurations.


    Table D.1.1 presents the results for the ablation. We can see that the encoder
    based only on stage I is not able to achieve the performance of global self-attention.
    Using both stages, we are able to mitigate that issue while at the same time achieving
    better computational complexity compared to global attention.


    # Best Node Parser


    Algorithm 4.2 describes the Best-Node Parser. The SimilarityScore function computes
    the attention scores (i.e. dot product) between the projected node embeddings
    and the query vector $\bar{\mathbf{q}}$. By focusing solely on the children of
    the best node at each level, the parser avoids computing attention scores for
    all nodes, ensuring efficiency. Including sibling nodes provides context, with
    higher-level nodes summarizing less important information and lower-level nodes
    capturing finer details.


    # Sliding Window Parser


    The selection process of the Sliding Window Parser is implemented using a 2D convolution
    with a kernel of ones, which slides a window across the attention scores to identify
    the region with the highest cumulative score. This sliding window mechanism gives
    the parser its name.


    Algorithm 4.3 describes the Sliding Window Parser. AreaOfInterest corresponds
    to the process of expanding the search area to include the children of both the
    best-scoring node and its one-hop neighbors. The SelectNodes function then performs
    the sliding window selection.'
  merge: -1
  img_proc: true
