    # ## 3.4 Experimental Evaluation


    # ### 3.4.1 Setup


    Today’s active learning research has an inconsistent landscape with many contradicting
    results. For this reason, we follow the evaluation framework proposed by Lüth
    et al. [181] to have a fair and rigorous comparison to all active learning baselines.
    In particular, we tune the hyperparameters on the CIFAR10 [147] dataset and use
    all other datasets as rollout datasets. We evaluate the datasets CIFAR10 and CIFAR100
    [147] and ISIC2019 [51], but also consider the long-tail versions of the two datasets,
    denoted with LT [33]. These long-tail versions feature class imbalance, where
    the number after LT indicates the ratio between the most common and least common
    class, combined with an exponential decay in sample sizes for the other classes.
    We perform all our experiments on 4 different data budget sizes. These include
    small, medium, and large as defined by Lüth et al., as well as the tiny budget
    size with the initial sample size equal to the number of classes. Further, we
    consistently use a step size equal to the number of initial samples for all budgets.
    Some sampling methods such as ProbCover, Typiclust and our proposed TCM rely on
    self-supervised pre-trained representations. For all these methods, we use the
    same representations. Specifically, for CIFAR10, CIFAR10-LT5, CIFAR10-LT10, CIFAR100,
    CIFAR100-LT5, CIFAR100-LT10 we use the SimCLR features provided by Hacohen et
    al.. For ISIC2019, we train a DINO model from scratch and use the features of
    the model.


