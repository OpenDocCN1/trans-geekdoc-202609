    \(64 \times 64 \times 64\). This downsampling makes the data mod12 divisible and
    reduces disk space usage. We employed trilinear interpolation for downsampling
    using the `torch.nn.functional.interpolate` function with trilinear mode. We also
    evaluated `scipy.ndimage.zoom` as done in [73], but observed no significant visual
    differences compared to the PyTorch method. However, the PyTorch implementation
    proved computationally more efficient, as it avoids polynomial fitting. After
    interpolation, voxels with a value > 0.05 are considered as occupied.


