  img_proc: true
- pgno: 200
  md: '+   - \((\beta_1, \beta_2) = (0.9, 0.999)\)

    +   - \(\epsilon = 10^{-8}\)


    **Gradient Clipping** We apply gradient clipping with a maximum norm of 0.1 to
    prevent exploding gradients.


    **Epochs and Learning Rate Schedule** For the Main Evaluation, models are trained
    for 300 epochs using a step-based learning rate scheduler (StepLR) with a step
    size of 250. All other experiments use the same learning rate scheduler but with
    a step size of 50 and are trained for 60 epochs.


    **Hardware and Batch Size** The Main Evaluation is conducted on 2x A100 GPUs with
    80GB of VRAM and a batch size of 68. All other experiments are conducted on 4x
    RTX 3090 GPUs with 24GB of VRAM and a batch size of 20.


    **Evaluation Metrics** We evaluate the models using the following metrics:


    +   - mAP: The mean average precision for IoU thresholds ranging from 0.50 to
    0.95 in steps of 0.05, averaged over all classes and areas.

    +   - mAP\(_{50}\), mAP\(_{75}\): Mean average precision for IoU thresholds of
    0.50 and 0.75, respectively.

    +   - mAP\(_S\), mAP\(_M\), mAP\(_L\): Mean average precision for small (< 32\(^2\)
    pixels), medium (32\(^2\) to 96\(^2\) pixels), and large (> 96\(^2\) pixels) objects,
    respectively.


    **Reproducibility** To account for randomness in training, each experiment is
    repeated twice with different random seeds. Due to the computational cost of each
    run, we were limited to two repetitions.


    **Backbone** Following DETR [35], we use a ResNet50 backbone pre-trained on ImageNet.
    We freeze its batch normalization layers and modify the last stage of the backbone
    by adding dilation and removing a stride from its first convolution to increase
    feature resolution. Finally, a 1x1 convolutional layer reduces the dimensionality
    of the ResNet50 output from 2048 to d\(_{model}\) = 256 to match that of the model''s
    embedding dimension.'
