    # C.1.3 Swin Transformer Model


    In this subsection, we expand on details of the architecture of the Swin transformer,
    shown in fig. C.1.2.


    **Shifting Window.** We employ the shifting windows mechanism introduced with
    the Swin Transformer [172]. In the first layer, the image is divided into non-overlapping
    windows of a fixed size (see fig. 5.4). In the subsequent layer, the windows are
    shifted by a certain stride (typically half the window size). Applying self-attention
    to such windows is computationally inefficient due to the varying sizes of border
    windows. Most deep learning frameworks are optimized for fixed-size tensors. Therefore,
    we cyclically shift the data by half a window. In a cyclic shift, the data (e.g.,
    pixels) that are shifted out of the frame are repositioned on the opposite side
    of the axis. The window partition is then readjusted to ensure consistent size.
    To prevent border window fragments from attending to each other, we apply an attention
    mask (marked by the orange line). In practice, the attention mask can be precomputed,
    and during the forward pass, only the data needs to be cyclically shifted. The'
