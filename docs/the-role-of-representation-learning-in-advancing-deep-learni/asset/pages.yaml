  md: "# 2.3.1 Greedy Active Learning on Input Values (GALI)\n\nTo determine which\
    \ bundle should be sampled next, the algorithm proposed by [289] for GALI iterates\
    \ over all unlabeled bundles in the pool and computes their distance to the closest\
    \ labeled bundle. As the size of our bundle space grows exponentially with the\
    \ number of items (for each item, you can either take it or not take it), finding\
    \ the next bundle to sample would lead to an exponential number of computations.\
    \ To avoid this problem, we propose an algorithm for GALI using a small number\
    \ of integer linear programs (ILP), which can be computed with an efficient ILP-solver.\
    \ The amount of ILPs needed is equal to the number of already labeled bundles.\
    \ As the goal of our auction mechanism is to query as few bundles as possible,\
    \ our set of labeled data stays rather small. To derive the implementation, we\
    \ will first present an alternative definition of GALI in form of an optimization\
    \ problem, which is equivalent to the definition of 2.2.2. The new optimization\
    \ problem on its own, however, is not efficiently computable. We will show why\
    \ this is the case and then derive the aforementioned implementation based on\
    \ ILPs.\n\n# Alternative Definition of GALI\n\n**Definition 2.4.** *(closest to\
    \ ... in set ...).* Let $C, D$ be sets with $C \\subset D$. Then $d \\in D$ is\
    \ closest to $c' \\in C$ *in set C* if and only if $\\forall c \\in C : \\|d -\
    \ c\\| \\ge \\|d - c'\\|$. *Notice, that d can be closest to more than one element\
    \ in C*.\n\nLet $m$ be the number of items, $\\mathcal{X} = \\{0, 1\\}^m$ the\
    \ bundle space and $S \\subset \\mathcal{X}$ the set of already sampled bundles.\
    \ To overcome the obstacle of exponential iterations, we reformulate the rule\
    \ for the determination of the next sample. For all $s \\in S$ we denote $H_s\
    \ \\subseteq \\mathcal{X} \\setminus S$ as the set of not already sampled bundles\
    \ $x$, for which $x$ is closest to $s$ in set $S$. The elements of $H_s$, which\
    \ have maximal distance to $s$, build up the set $\text{arg max}_{x \\in H_s}\
    \ \\|x - s\\|$. Let further $dist_s = \\max_{x \\in H_s} \\|x - s\\|$ be the maximal\
    \ distance between $s$ and a bundle in $H_s$.\n\n```\nx^* \\in \\text{arg max}_{x\
    \ \\in H_{s^*}} \\|x - s^*\\|\ns.t. \\quad s^* \\in \\text{arg max}_{s \\in S}\
    \ dist_s \\quad (2.8)\n```\n\nThe process is illustrated in Figure 2.5. With the\
    \ following Lemma we show that the Definition (2.8) is in fact equivalent to the\
    \ old one in (2.6)."
