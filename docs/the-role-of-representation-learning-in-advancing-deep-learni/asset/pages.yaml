- pgno: 74
  md: '# Domain-Agnostic Super-Resolution


    # Abstract


    Super-resolution techniques have made remarkable progress in recent years, especially
    in the vision domain. However, extending these advances to other data modalities
    has been challenging due to the need for specialized architectures tailored to
    each domain. In this chapter, we introduce FunctaFormer, a novel domain-agnostic
    super-resolution method capable of upscaling any arbitrary data type. Our approach
    leverages Implicit Neural Representations (INRs) to model data as continuous functions,
    providing a unified framework across different modalities. FunctaFormer obtains
    competitive performance across various domains, including images, audio, videos,
    3D shapes, manifold data, and LiDAR scans.


    # 5.1 Introduction


    Super-resolution (SR) aims to reconstruct a high-resolution output from a given
    low-resolution input. While the specific notion of “resolution” varies'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/c742333bcb21933724ca00794dbfb657_75_0.png)


    Figure 5.1: Samples of 4x super-resolution with FunctaFormer on low-resolution
    input (top) resulting in upsampled output (bottom). By using INRs, FunctaFormer
    can upsample any data modality (shown here as 2D images, 1D audio waveforms, 3D
    shapes, polar coordinates for manifold data, 2+1D videos, and LiDAR point clouds).


    across domains, such as pixel count in images, frame rate in videos, sampling
    frequency in audio signals, grid or mesh resolution in 3D shapes, measurement
    spacing on manifolds, or point density in LiDAR scans, the fundamental goal remains
    the same: enhancing the level of detail beyond what is present in the input data.


    At first glance, these diverse data modalities, ranging from 1D to 3D spaces and
    represented in various forms, appear inherently different. This diversity poses
    a challenge for developing a unified SR approach applicable across modalities.
    However, Implicit Neural Representations (INRs) offer a promising solution by
    modeling data as continuous functions parameterized by a neural network. In an
    INR, the input to the network consists of coordinates—such as time, Cartesian
    coordinates, or polar coordinates—and the output is the corresponding feature
    value at that point. For instance, in the case of an image, the network outputs
    pixel color values for given spatial positions.


    By leveraging INRs, the SR task can be reframed as transforming the INR fitted
    on low-resolution data to generate high-resolution output during inference. This
    perspective abstracts the SR problem away from the specifics of any particular
    data modality, allowing for a unified architecture that is adaptable to any data
    modality.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Previous work has demonstrated the potential of INRs for SR by sampling the
    fitted INR at a higher resolution than the training data [226, 237]. However,
    this approach yields only marginal improvements over basic interpolation techniques,
    primarily because standard INRs lack explicit spatial context in their representations.


    To address this limitation, we leverage Spatial Functa [16], an approach that
    augments INRs with spatial information. Spatial Functa compute individual INR
    representations for spatially arranged subsets of the input data. These localized
    representations are then fed as tokens into a transformer backbone, which captures
    spatial dependencies and interactions between different regions. The transformer
    then produces a residual that is applied to the original INR, enhancing its capacity
    to generate high-quality, high-resolution outputs.


    Our contributions can be summarized as follows:


    +   - We propose FunctaFormer, a novel domain-agnostic super-resolution architecture
    that leverages Spatial Functa and transformer models to achieve competitive performance
    across multiple data modalities, including images, audio, videos, 3D shapes, manifold
    data, and LiDAR scans.

    +   - We conduct extensive ablation studies to optimize the sampling process of
    high-resolution outputs from Spatial Functa, resulting in efficient SR performance.

    +   - We explore various configurations of the transformer backbone, particularly
    focusing on the optimal attention window size for the SR task in conjunction with
    the chosen Spatial Functa representations.


    The codebase is made publicly available at https://anonymous.4open.science/r/functaformer/.


    # ## 5.2 Related Work


    # ### 5.2.1 Single Data Super Resolution


    Neural networks are commonly used to upscale low-resolution data points, typically
    operating on discrete array representations. This technique has been applied across
    various domains, including images [65, 163, 313, 308, 293, 277], 3D shapes [247,
    202, 267], video [178, 195, 312, 129, 292, 46], audio [148,'
  merge: -1
  img_proc: true
- pgno: 77
  md: '170, 157, 275, 47, 215], and LiDAR data [149, 298, 116]. In the field of Single
    Image Super-Resolution (SISR), the integration of Vision Transformers (ViT) [67]
    and their variants [172], often combined with convolutional layers, has emerged
    as the predominant approach. For audio data, architectures based on U-Net [223,
    170], enhanced with self-attention mechanisms and convolutional layers, or employing
    generative adversarial networks (GANs) [47], are commonly used.


    Despite the success of these methods, there has been some research on the application
    of INRs for SISR tasks. Some existing INR-based approaches generate higher-resolution
    outputs by directly sampling from the fitted INR at a higher resolution [237,
    226, 246]. However, this straightforward upsampling often results in only marginal
    improvements over traditional interpolation methods due to the lack of explicit
    modeling of high-frequency details. Other works [306, 249] use more advanced methods
    to refine the INR before sampling. Generally, INRs have gained more traction in
    more complex super-resolution settings such as for medical data [87, 77] or video
    [178, 46, 177].


    # 5.2.2 Implicit Neural Representations


    INRs have recently gained attention as a powerful technique for data representation
    across diverse modalities. Unlike traditional methods that rely on discrete data
    points, INRs model data as continuous functions parameterized by neural networks.
    This approach has been successfully applied to various domains, including images
    [245, 73, 16, 71, 72], manifold data [73, 72], audio [245, 72, 154], 3D shapes
    [245, 207, 188, 179, 96, 97], physical phenomena [245], and entire 3D scenes [190].
    Our research extends this methodology by applying INRs to images, audio, 3D shapes,
    and manifold data, thereby contributing to the growing body of work in this area.


    Traditionally, INRs use simple fully connected neural networks composed of multiple
    linear layers [245, 73, 16, 71, 72, 154, 207, 189]. However, recent advancements
    have introduced a decoupled approach that separates the fitting of the INR from
    its application in downstream tasks. This is achieved by encoding the network
    weights into a latent representation, which can then be utilized for various deep
    learning applications [73, 16, 179]. Following the methodology proposed in [73],
    we incorporate encoded weight representations into our super-resolution framework.
    This enables more efficient processing and improved performance, as the model
    can leverage the rich information encapsulated in the continuous representations
    while remaining adaptable across different data modalities.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 5.2.3 Transformer Architecture


    The vision transformer [67] has achieved great success in many computer vision
    tasks. It has also been successfully applied to SISR tasks [39]. However, due
    to self-attention scaling quadratically with input size, the success for using
    vision transformers in SISR has been limited. The Swin-transformer [172] is a
    hierarchical transformer architecture, that, thanks to its sliding window local
    self-attention, is able to scale to much larger input sizes. Many works have applied
    the Swin-transformer in SISR [163, 124, 42, 313], significantly improving the
    state-of-the-art.


    In this chapter, we build on the success of the Swin-transformer. In combination
    with the flexibility of INRs, we are able to design a super-resolution model that
    can be used for a large range of domains.


    # 5.3 Method


    # 5.3.1 Implicit Neural Representations


    The initial step in our framework involves converting raw discrete data into a
    continuous space. This is achieved by fitting a neural network to each feature
    within a data point. The neural network''s inputs are normalized coordinates,
    and the outputs correspond to features such as amplitude in audio, RGB values
    in images, or voxel occupancy in 3D shapes. Given a data point $D$ with a set
    of coordinates $X$ and feature values $Y$, the network aims to minimize the L2
    loss between each network output and the corresponding feature $\{(\theta(\mathbf{x}_i),
    \mathbf{y}_i \mid i \in D\}$, as outlined in Equation (5.1).


    ```

    \min_{\theta} \mathcal{L}(X, Y) = \min_{\theta} \sum_{i \in D} \|\theta(\mathbf{x}_i)
    - \mathbf{y}_i\|_2^2

    ```


    The network consists of a sequence of linear layers, represented as $\mathbf{Wx}
    + \mathbf{b}$, where $\mathbf{W}$ is a learnable weight matrix and $\mathbf{b}$
    is a bias vector. Before activation, each layer output is scaled by a constant
    factor $\omega_0$. We follow the approach of [245], using a sinusoidal activation
    function, resulting in the form of Equation (5.2). Where $\mathbf{a}^{(l)}$ is
    the activation of the l''th layer.


    ```

    \mathbf{a}^{(l)} \mapsto \sin(\omega_0 \cdot (\mathbf{W}^{(l)} \mathbf{a}^{(l-1)}
    + \mathbf{b}^{(l)}))

    ```


    These networks are referred to as Sinusoidal Representation Networks (SIREN).
    Although other nonlinearities are explored in [237, 226], we empirically found'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'no significant differences in convergence speed or reconstruction quality,
    so we adhered to the sinusoidal activation.


    ![](img/c742333bcb21933724ca00794dbfb657_79_0.png)


    **Figure 5.2:** Functa architecture [73]: The encoded Functas are added as shift
    modulations after each layer.


    **Functa Representation.** INR networks have been shown to fit the underlying
    data with minimal error [245]. However, the training time and space complexity
    make this approach impractical, especially when fitting an entire 3D scene, which
    can take several GPU hours for each scene. Instead of fitting a different neural
    network for each data point, we use a shared base network and represent a data
    point through frequency shift modulations of each layer''s output. These shift
    modulations are derived by an encoder network m = ψ(ϕ), which is a single linear
    layer in the form of Wϕ + b (see Figure 5.2). We refer to the inputs ϕ to the
    encoder as Functas. The forward pass of each layer is thus modified to Equation
    (5.3). After training, a data point is fully represented by its Functa vector,
    which can have equal or lower space complexity, as shown in [73, 71, 72]. The
    base network is only needed for decoding.


    ```

    a^(l) ↦ sin(ω_0 · (W^(l) a^(l-1) + b^(l) + m^(l)))           (5.3)

    ```


    **Meta Learning.** Training this system involves two tasks: identifying the correct
    inputs (e.g., Functas) for the encoder to produce the correct shift'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'modulations, and finding the optimal parameters for the encoder \(\psi\) and
    base network \(\theta\) so that the Functas can be fitted with minimal gradient
    steps. This allows for the transformation of a large collection of data into the
    continuous space rapidly. We achieve this by dividing the training process into
    an inner and outer loop. In the inner loop, we fit a batch of Functas for a few
    gradient steps, freezing the base network \(\theta\) and the encoder \(\psi\),
    thus only altering the Functas. In the outer loop, we unfreeze the base network
    and encoder, perform another forward pass with the fixed batch of Functas, and
    compute double gradients through the computational graph. This corresponds to
    a variant of Model-Agnostic Meta Learning (MAML) [91, 73], where instead of efficiently
    learning new tasks, the model learns to assimilate new data points quickly. The
    learning process is detailed with pseudo code in Algorithm 3.1 in the Appendix.


    **Spatial Functa.** Bauer et al. [16] show that perturbing a single element in
    the Functa vector affects the entire data point. This indicates that individual
    elements of the vector do not correspond to specific spatial regions in the data.
    However, many architectures rely on spatial biases, and many tasks require spatial
    information to be solved. For this reason, Bauer et al. [16] propose to use a
    spatially arranged representation of individual Functa whose features capture
    local signal information in the data point. While [16] evaluate their approach
    on images only, we extend it to 1D and 3D. For audio, we slice samples into temporal
    segments; for images, into 2D patches; for videos, into temporal segments and
    2D patches; for manifold and LiDAR data, into angular sectors; and for 3D shapes,
    into cubes. We then fit a different Functa to each slice, resulting in a spatial
    Functa representation with local biases. Additionally, we find that spatial Functa
    are able to fit the underlying data point better, a property beneficial for strong
    super-resolution performance. This approach also allows the memory-intensive MAML
    training to be applied to larger inputs, since gradients can be computed for individual
    slices of the spatial Functa.


    # 5.3.2 Single Data Super Resolution


    The objective of single data super resolution is to reconstruct a high-quality
    data point \(D_{HQ}\) from its degraded version \(D_{LQ}\) such that the reconstructed
