- pgno: 89
  md: 'Within each block, the windows are shifted in every second subsequent layer.
    The model uses 6 attention heads, an embedding dimension of 180, and 360 hidden
    units in the feedforward layers. Dropout is not applied in the feedforward and
    attention layers. However, stochastic depth [125] is used to randomly drop certain
    residual connections within a STL. The dropout probability is linearly increased
    from 0 to 0.1 throughout the network, resulting in a higher dropout chance for
    deeper connections compared to earlier layers. No weight decay or other regularization
    techniques are utilized aside from stochastic depth. During training, we downsample
    and upsample a batch of high-resolution data with linear interpolation. We fit
    a Functa to both the ground truth and the degraded samples. Our FunctaFormer then
    learns to predict the residual between these two. We again use the Adam optimizer
    [144] but with parameters \(\beta_1 = 0.9\) and \(\beta_2 = 0.99\).


    # Single Data Super Resolution.


    After identifying the optimal attention window and spatial Functa dimensions,
    we proceed with full model training for 100k steps using the best-performing slicing
    and attention window configurations. We evaluate performance across x2, x3, and
    x4 downsampling levels and compare our results with state-of-the-art methods trained
    directly on discrete data.


    # Metrics.


    We assess reconstruction quality using the Peak Signal-to-Noise Ratio (PSNR),
    as defined in Equation (5.5), measured in decibels. Here, \(D_{max}\) represents
    the maximum value of the original data, and \(Y_i\) and \(\hat{Y}_i\) are the
    original and predicted feature vectors, respectively.


    ```

    \(20 \cdot \log_{10}(D_{max}) - 10 \cdot \log_{10} \left( \frac{1}{n} \sum_{i=1}^n
    (Y_i - \hat{Y}_i)^2 \right)\) (5.5)

    ```


    For image and video comparisons, we also compute the Structural Similarity Index
    Measure (SSIM) [279], using a Gaussian window of size 11 \* 11 with \(\sigma =
    1.5\). Both PSNR and SSIM are computed across all three RGB channels.


    For audio data, we additionally calculate the Signal-to-Noise Ratio (SNR), as
    defined by:


    ```

    \(10 \cdot \log_{10} \frac{\sum_{i=1}^n Y_i^2}{\sum_{i=1}^n (Y_i - \hat{Y}_i)^2}\)
    (5.6)

    ```'
