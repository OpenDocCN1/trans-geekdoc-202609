- pgno: 237
  md: '# E.6.5 LLM Evaluation


    We have extended the PUZZLES library with an interface for large language models
    (LLMs) and vision language models (VLMs). This allows for easy evaluation of these
    models on truly out-of-distribution data. Thanks to the scalability of our benchmark,
    puzzle sizes can be continuously increased to match the current capabilities of
    the models. Currently, we focus on zero-shot evaluation of LLMs/VLMs, where the
    models are not provided with any specific training on the puzzle they need to
    solve. This is similar to a human solving a puzzle for the first time. For future
    evaluations, however, this could be improved by either training the model on a
    smaller version of the puzzle, or giving it some examples and allowing it to explicitly
    come up with a strategy. The LLM/VLM had to play the puzzle using the same cursor
    interface as the RL agents and the human expert, requiring it to plan ahead and
    execute single steps. This also means that the model was not able to solve the
    puzzle directly by outputting a solution in text format.


    To reduce the computational cost of LLM evaluation, we implemented early termination
    after state repetition. Specifically, if an LLM enters the exact same state five
    times, indicating no progress in solving the puzzle, the evaluation terminates.
    Additionally, for each puzzle, we set the maximum number of steps to the upper
    bound of an optimal policy.


    During evaluation, the LLM is not provided with the complete history of all past
    actions and states. Instead, it receives only the explanation of the game, the
    current discrete state, an image of the current puzzle state, and the most recent
    past action. Action masking is employed to limit the LLM’s choices to reasonable
    actions.


    The game explanations and instructions for playing the game using the keyboard
    are sourced from https://www.chiar.greenen.org.uk/~sgtatham/puzzles/doc/. Further
    details about the LLM evaluation framework are available on the official GitHub
    repository at https://github.com/ETH-DISCO/rlp/tree/main/llm. The code is designed
    to easily support the addition and evaluation of new LLMs. For more information,
    please refer to https://github.com/ETH-DISCO/rlp?tab=readme-ov-file#run-an-llm-that-is-available-via-api.


    We conducted experiments with Gemini 1.5 Flash and GPT-4o mini, allowing each
    LLM 5 attempts to solve each puzzle. Our results show that GPT-4o mini solved
    slightly more puzzles than Gemini 1.5 Flash. Interestingly, the evaluation with
    GPT-4o-mini took approximately 5 hours, while Gemini 1.5 Flash required only 1
    hour.'
  merge: -1
