  md: '# ## 8.3.2 Difficulty Progression and Generalization


    The PUZZLES environment places a strong emphasis on giving users control over
    the difficulty exhibited by the environment. For each puzzle, the problem size
    and difficulty can be adjusted individually. The difficulty affects the complexity
    of strategies that an agent needs to learn to solve a puzzle. As an example, *Sudoku*
    has tangible difficulty options: harder difficulties may require the use of new
    strategies such as *forcing chains*<sup>3</sup> to find a solution, whereas easy
    difficulties only need the *single position* strategy.<sup>4</sup>


    The scalability of the puzzles in our environment offers a unique opportunity
    to design increasingly complex puzzle configurations, presenting a challenging
    landscape for RL agents to navigate. This dynamic nature of the benchmark serves
    two important purposes. Firstly, the scalability of the puzzles facilitates the
    evaluation of an agent''s generalization capabilities. In the PUZZLES environment,
    it is possible to train an agent in an easy puzzle setting and subsequently evaluate
    its performance in progressively harder puzzle configurations. For most puzzles,
    the cardinality of the action space is independent of puzzle size. It is therefore
    also possible to train an agent only on small instances of a puzzle and then evaluate
    it on larger sizes. This approach allows us to assess whether an agent has learned
    the correct underlying algorithm and generalizes to out-of-distribution scenarios.
    Secondly, it enables the benchmark to remain adaptable to the continuous advancements
    in RL methodologies. As RL algorithms evolve and become more capable, the puzzle
    configurations can be adjusted accordingly to maintain the desired level of difficulty.
    This ensures that the benchmark continues to effectively assess the capabilities
    of the latest RL methods.


    # ## 8.4 Empirical Evaluation


    We evaluate the baseline performance of numerous commonly used RL algorithms on
    our PUZZLES environment. Additionally, we also analyze the impact of certain design
    decisions of the environment and the training setup. Our metric of interest is
    the average number of steps required by a policy to successfully complete a puzzle,
    where lower is better. We refer to the term *successful episode* to denote the
    successful completion of a single puzzle


    <sup>3</sup>*Forcing chains* works by following linked cells to evaluate possible
    candidates, usually starting with a two-candidate cell.

    <sup>4</sup>The *single position* strategy involves identifying cells which have
    only a single possible value.'
