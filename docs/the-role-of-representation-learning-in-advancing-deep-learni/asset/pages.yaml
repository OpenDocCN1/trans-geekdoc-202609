    values, discounted by a so-called bidder-specific term, which depends on the region
    a bidder covers, results in the final value of the bidder. MRVM distinguishes
    three different types of bidders, namely national, regional and local. The value
    of national bidders increases if they can cover the whole country well with the
    received licenses. Regional bidders have synergies between regions close to their
    headquarters, while local bidders do not have synergies between any regions.


