- pgno: 57
  md: '# Disentangling Adversarial Variational Autoencoder


    # Abstract


    The use of well-disentangled representations offers many advantages for downstream
    tasks, e.g. increased sample efficiency, or better interpretability. However,
    the quality of disentangled interpretations is often highly dependent on the choice
    of dataset-specific hyperparameters, in particular the regularization strength.
    To address this issue, we introduce DAVA, a novel training procedure for variational
    auto-encoders. DAVA completely alleviates the problem of hyperparameter selection.
    We compare DAVA to models with optimal hyperparameters. Without any hyperparameter
    tuning, DAVA is competitive on a diverse range of commonly used datasets. Underlying
    DAVA, we discover a necessary condition for unsupervised disentanglement, which
    we call PIPE. We demonstrate the ability of PIPE to positively predict the performance
    of downstream models in abstract reasoning. We also thoroughly investigate correlations
    with existing supervised and unsupervised metrics.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 4.1 Introduction


    Real-world data tends to be highly structured, full of symmetries and patterns.
    This implies that there exists a lower-dimensional set of ground truth factors
    that is able to explain a significant portion of the variation present in real-world
    data. The goal of disentanglement learning is to recover these factors, so that
    changes in a single ground truth factor are reflected only in a single latent
    dimension of a model (see Figure 4.1 for an example). Such an abstraction allows
    for more efficient reasoning [269] and improved interpretability [120]. It further
    shows positive effects on zero-shot domain adaption [121] and data efficiency
    [69, 229].


    ![](img/c742333bcb21933724ca00794dbfb657_58_0.png)


    Figure 4.1: Latent traversals of a single latent dimension (hair fringes) of DAVA
    trained on CelebA. DAVA visibly disentangles the fringes from all other facial
    properties.


    If the generative ground-truth factors are known and labeled data is available,
    one can train a model in a supervised manner to extract the ground-truth factors.
    What if the generative factors are unknown, but one still wants to profit from
    the aforementioned benefits for a downstream task? This may be necessary when
    the amount of labeled data for the downstream task is limited or training is computationally
    expensive. Learning disentangled representations in an unsupervised fashion is
    generally impossible without the use of some priors [176]. These priors can be
    present both implicitly in the model architecture and explicitly in the loss function
    [265]. An example of such a prior present in the loss function is a low total
    correlation between latent variables of a model [40, 143]. Reducing the total
    correlation has been shown to have a positive effect on disentanglement [176].
    Unfortunately, as we show in more detail in this chapter, how much the total correlation
    should be reduced to achieve good disentanglement is highly dataset-specific.
    The optimal hyperparameter setting for one dataset may yield poor results'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'on another dataset. To optimize regularization strength, we need a way to evaluate
    disentanglement quality.


    So how can we identify well disentangled representations? Evaluating representation
    quality, even given labeled data, is no easy task. Perhaps as an example of unfortunate
    nomenclature, the often-used term “ground-truth factor” implies the existence
    of a canonical set of orthogonal factors. However, there are often multiple equally
    valid sets of ground truth factors, such as affine transformations of coordinate
    axes spanning a space, different color representations, or various levels of abstraction
    for group properties. This poses a problem for supervised disentanglement metrics,
    since they fix the ground truth factors for evaluating a representation and judge
    the models too harshly if they have learned another equally valid representation.
    Furthermore, acquiring labeled data in a practical setting is usually a costly
    endeavor. The above reasons hinder the usability of supervised metrics for model
    selection.


    In this chapter, we overcome these limitations for both learning and evaluating
    disentangled representations. Our improvements are based on the following idea:
    We define two distributions that can be generated by a VAE. Quantifying the distance
    between these two distributions yields a disentanglement metric that is independent
    of the specific choice of ground truth factors and reconstruction quality. The
    further away these two distributions are, the less disentangled the VAEs latent
    space is. We show that the similarity of the two distributions is a necessary
    condition for disentanglement. Furthermore, we can exploit this property at training
    time by introducing an adversarial loss into classical training of VAEs. To do
    this, we introduce a discriminator network into training and use the VAEs decoder
    as generator. During training, we control the weight of the adversarial loss.
    We adjust the capacity of the latent space information bottleneck accordingly,
    inspired by [31]. In this way, we allow the model to increase the complexity of
    its representation as long as it is able to disentangle.


    This dynamic training procedure solves the problem of dataset-specific hyperparameters
    and allows our approach to reach competitive disentanglement on a variety of commonly
    used datasets without hyperparameter tuning.


    Our contributions are as follows:


    +   • We identify a novel unsupervised aspect of disentanglement called PIPE and
    demonstrate its usefulness in a metric with correlation to supervised disentanglement
    metrics as well as a downstream task.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   • We propose an adaptive adversarial training procedure (DAVA) for variational
    auto-encoders, which solves the common problem that disentanglement performance
    is highly dependent on dataset-specific regularization strength.


    +   • We provide extensive evaluations on several commonly used disentanglement
    datasets to support our claims.


    # ## 4.2 Related Work


    # ### 4.2.1 Model Architectures


    The \(\beta\)-VAE by Higgins et al. [120] is a cornerstone model architecture
    for disentanglement learning. The loss function of the \(\beta\)-VAE, the evidence
    lower bound (ELBO), consists of a reconstruction term and a KL-divergence term
    weighted by \(\beta\), which forces the aggregated posterior latent distribution
    to closely match the prior distribution. The KL-divergence term seems to promote
    disentanglement as shown in [222]. The \(\beta\)-TCVAE architecture proposed by
    Chen et al. [40] further decomposes the KL divergence term of the ELBO into an
    index-code mutual information, a total correlation and a dimension-wise KL term.
    They are able to show that it is indeed the total correlation that encourages
    disentanglement and propose a tractable but biased Monte Carlo estimate. Similarly,
    the FactorVAE architecture [143] uses the density ratio trick with an adversarial
    network to estimate total correlation. The AnnealedVAE architecture [31] as well
    as ControlVAE [239] build on a different premise, arguing that slowly increasing
    the information bottleneck capacity of the latent space leads to the model gradually
    learning new latent dimensions and thus disentangling them. We will use a similar
    but optimized approach for DAVA. More recent promising approaches are presented
    by Wei et al. [283] using orthogonal Jacobian regularization and by Chen et al.
    [45] applying regulatory inductive bias recursively over a compositional feature
    space.


    # ### 4.2.2 Introduction of Adversarial Training to VAEs


    When combining autoencoders (AEs) with an adversarial setting, one can connect
    the adversarial network either on the latent space or on the output of the decoder.
    Makhzani et al. [182] proposed an adversarial AE (AAAE) that uses an adversarial
    discriminator network on the latent space of an AE'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'to match its aggregated posterior to an arbitrary prior. There, the encoder
    of the AE acts as the generator of the GAN and is the only part of the AE that
    gets updated with respect to the discriminator''s loss. This kind of training
    is strongly connected to VAE training, with the adversarial loss taking on the
    role of KL divergence in the classical VAE training objective but without the
    constraint of a Gaussian prior. The previously mentioned FactorVAE [143] implements
    an adversarial loss on the latent space to reduce total correlation. Larsen et
    al. [155] proposed using a discriminator network with the decoder of the VAE acting
    as generator to improve the visual fidelity of the generated images, but with
    no focus on disentanglement. The difference to DAVA is that they used the discriminator
    on the real observations, while we propose a discriminator that only sees observations
    generated by the decoder of the AE. Zhu et al. [314] introduce an recognition
    network based loss on the decoder that encourages predictable latent traversals.
    In other words, given a pair of images where all but one latent dimensions are
    kept constant, the recognition network should be able to predict in which latent
    dimension the change occurred. Applied on top of a baseline VAE model, this loss
    slightly improves the disentanglement performance of the baseline VAE. In a semi-supervised
    setting, Carbajal et al. [34] and Han et al. [110] propose adversarial losses
    on the latent space of VAEs to disentangle certain parts of the latent space from
    information present in labels. Unfortunately, such an approach does not work in
    an unsupervised setting with the goal of disentanglement of the complete latent
    space.


    # ## 4.2.3 Measuring Disentanglement


    All supervised metrics have in common that they are dependent on a canonical factorization
    of ground truth factors. Given access to the generative process of a dataset,
    the FVAE metric [143] can be used to evaluate a model. It first creates a batch
    of data generated by keeping aforementioned ground truth factor fixed and randomly
    sampling from the other ground truth factors. It then uses a majority vote classifier
    to predict the index of a ground truth factor given the variance of each latent
    dimension computed over said batch. Without access to the generative process,
    but given a number of fully labeled samples, one can use metrics like DCI Disentanglement
    by Eastwood and Williams [76] and MIG by Chen et al. [40]. While DCI in essence
    assesses if a latent variable of a model captures only a single ground truth factor,
    MIG evaluates if a ground truth factor is captured only by a single variable.
    As a result, DCI compared to MIG does not punish multi-dimensional representations'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 4.2. RELATED WORK


    of a single ground truth factor, for example the RGB model of color or a sine/cosine
    representation of orientation.


    There exists a small number of unsupervised disentanglement metrics. The unsupervised
    disentanglement ranking (UDR) by Duan et al. [69] evaluates disentanglement based
    on the assumption that a representation should be disentangled if many models,
    differently initialized but trained with the same hyperparameters, learn the same
    representation. To achieve this, they compute pairwise similarity (up to permutation
    and sign inverse) of the representations of a group of models. The score of a
    single model is the average of its similarity to all the other models in the group.
    ModelCentrality (MC) [169] builds on top of UDR by improving the pairwise similarity
    evaluation. A drawback is the high computational effort, as to find the optimal
    hyperparameter setting, multiple models need to be trained for each setting. UDR
    and MC do not assume any fixed set of ground truth factors. Nevertheless, a weakness
    of these approaches is that they do not recognize similarity of a group of models
    that each learn a different bijective mapping of the ground truth factors. The
    latent variation predictability (VP) metric by Zhu et al. [314] is based on the
    assumption that if a representation is well disentangled, it should be easy for
    a recognition network to predict which variable was changed given two input images
    with a change in only one dimension of the representation. An advantage of the
    VP metric is its ability to evaluate GANs as it is not dependent on the model
    containing an encoder. In comparison to our proposed metric, VP, UDR and MC are
    dependent on the size of the latent space or need to define additional hyperparameters
    to recognize inactive dimensions. Estermann et al. [83] showed that the UDR has
    a strong positive bias for low-dimensional representations, as low-dimensional
    representations are more likely to be similar to each other. One could see the
    same issue arise for the VP metric, as accuracy for the recognition network will
    likely be higher when there is only a low number of change-inducing latent dimensions
    available to choose from.


    # 4.2.4 Applications of Disentangled Representations


    The effects of disentangled representations on downstream task performance are
    manifold. Van Steenkiste et al. [269] showed that for abstract reasoning tasks,
    disentangled representations enabled quicker learning. We show in Section 4.4.2
    that the same holds for our proposed metric. In work by Higgins et al. [121],
    disentangled representations provided improved zero-shot domain adaption for a
    multi-stage reinforcement-learning (RL) agent. The UDR'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'metric [69] correlated well with data efficiency of a model based RL agent
    introduced by Watters et al. [280]. Disentangled representations further seem
    to be helpful in increasing the fairness of downstream prediction tasks [175].
    Contrary to previous qualitative evidence [80, 122], Montero et al. [196] present
    quantitative findings indicating that disentanglement does not have an effect
    on out-of-distribution (OOD) generalization. Recent work by Schott et al. [229]
    supports the claims of Montero et al. [196], concluding that disentanglement shows
    improvement in downstream task performance but not so in OOD generalization.


    # ## 4.3 Posterior Indifference Projection Equality


    We first introduce the notation of the VAE framework, closely following the notation
    used by Kim and Mnih [143]. We assume that observations \(x \sim \tilde{D}\) are
    generated by an unknown process based on some independent ground-truth factors.
    The goal of the encoder is to represent \(x\) in a latent vector \(z \in \mathbb{R}^d\).
    We introduce a Gaussian prior \(p(z) = \mathcal{N}(0, I)\) with identity covariance
    matrix on the latent space. The variational posterior for a given observation
    \(x\) is then \(q_\theta(z|x) = \prod_{j=1}^d \mathcal{N}(z_j|\mu_j(x), \sigma_j^2(x))\),
    where the encoder with weights \(\theta\) outputs mean and variance. The decoder
    projects from the latent space \(z\) back to observation space \(p_\phi(x|z)\).
    We can now define the distribution \(q(z)\).


    **Definition 4.2** (EP). *The empirical posterior (EP) distribution* \(q(z)\)
    *of a VAE is the multivariate distribution of the latent vectors* \(z\) *over
    the data distribution* \(\tilde{D}\).* More formally, \(q(z) = \mathbb{E}_{x\sim\tilde{D}}[q_\theta(z|x)]\).
    We can reconstruct an observation \(x \sim \tilde{D}\) the following way: We sample
    \(z \sim q_\theta(z|x)\) and then get the reconstruction \(\hat{x} \sim p_\phi(x|z)\).
    We informally call observations generated by this process reconstructed samples
    and denote them as \(\hat{x}\).


    The decoder is not constrained to only project from \(q(z)\) to observation space.
    We can sample observations from the decoder by using different distributions on
    \(z\). We define a particularly useful distribution.


    **Definition 4.3** (FP). *The factorial posterior (FP) distribution* \(\bar{q}(z)\)
    *of a VAE is a multivariate distribution with diagonal covariance matrix. We define
    it as the product of the marginal EP distribution:* \(\bar{q}(z) = \prod_{j=1}^d
    q(z_j)\).* We can use the decoder to project \(z \sim \bar{q}(z)\) to observation
    space \(\hat{x} \sim p_\phi(x|z)\). We informally call observations created by
    this process generated samples and denote them as \(\tilde{x}\).'
  merge: -1
  img_proc: true
