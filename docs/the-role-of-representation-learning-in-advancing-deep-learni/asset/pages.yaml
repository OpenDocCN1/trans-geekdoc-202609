  md: '# Implementation with ILPs


    We now present a way to compute (2.8) more efficiently. The idea is to find a
    \(x^* \in \arg \max_{x \in H_s} \|x - s\|\) for every already queried bundle \(s
    \in S\) without having to build \(H_s\). This can be done by solving the following
    small optimization problem for all \(s \in S\).


    \(\arg \max_{x \in \mathcal{X}} \|x - s\| \quad (\mathcal{X} = \{0, 1\}^m)\)

    \(\text{s.t.} \quad \|x - s\| \le \|x - s''\| \quad \forall s'' \in S. s'' \neq
    s \quad (2.9)\)


    In this form, the Optimization Problem (2.9) is nonlinear due to the norms and
    cannot be solved by an ILP-solver. Therefore, we reformulate it into an integer
    linear program (ILP).


    \(\arg \max_{x \in \mathcal{X}} \sum_{j=1}^m x_j + s_j - 2x_js_j\)

    \(\text{s.t.} \quad \forall s'' \in S. s'' \neq s\)

    \(\sum_{j=1}^m x_j + s_j - 2x_js_j \le \sum_{j=1}^m x_j + s''_j - 2x_js''_j\)

    \(x, s, s'' \in \{0, 1\}^m \quad (2.10)\)


    The following Lemma will help prove the equivalence of the ILP (2.10) and the
    Optimization Problem (2.9) in Theorem 2.8.


    **Lemma 2.7.** Let \(x, y \in \mathcal{X} = \{0, 1\}^m\) be two bundles of size
    \(m\). Then, \(\|x - y\|^2 = \sum_{j=1}^m x_j + y_j - 2x_jy_j\).


    Proof of Lemma 2.7.


    \(\|x - y\|^2 = \sum_{j=1}^m (x_j - y_j)^2\)

    \(= \sum_{j=1}^m x_j^2 + y_j^2 - 2x_jy_j\)

    \(= \sum_{j=1}^m x_j + y_j - 2x_jy_j \quad (\text{since } 0^2 = 0 \text{ and }
    1^2 = 1)\)'
