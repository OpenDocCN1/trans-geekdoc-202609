    # **Multi-Head Self Attention.**


    Multi-Head Self-Attention is performed as in the original transformer [270]. However,
    instead of static sinusoidal positional encoding, we add a learnable relative
    position bias to the attention score. Recent studies have shown that relative
    positional embeddings are more effective in capturing spatial relationships [240,
    213]. In each window dimension \(w\), the relative position of two tokens is limited
    to the range \([-(w-1), (w-1)]\). We first calculate the relative position of
    each token to all other tokens in the same window, compute indices for every occurring
    relative distance, and sample a learnable position bias of shape \(B \in \mathbb{R}^{h
    \times w_1 \times w_2 \times \dots}\) from \(\tilde{B} \in \mathbb{R}^{h \times
    (2w_1-1) \times (2w_2-1) \times \dots}\). The bias is added before the SoftMax
    calculation. The overall process is detailed in eq. (C.2), where \(d = \lfloor
    \frac{c}{h} \rfloor\) is the embedding dimension \(e\) divided by the number of
    attention heads \(h\). \(P_Q\), \(P_K\) and \(P_V\) are the learnable projection
    matrices, and \(X \in \mathbb{R}^{w_1 \times w_2 \times \dots \times e}\) represents
    an input window, with \(M\) being the attention mask.


    ```

    Q = X P_Q,      K = X P_K,      V = X P_V

    Attention(Q,K,V) = Softmax(Q K^T / \sqrt{d} + B + M) / V

    ```


    # **Generalizing shifting windows beyond 2D**


    The Swin Transformer architecture [172] we as a basis for FunctaFormer is a derivation
    of the original Vision Transformer [67], primarily designed for 2D images. To
    extend its functionality to arbitrary data, beyond the convolutional layers, we
    need to modify certain architectural elements. Notably, we must adapt the shifting
    window and the relative position bias computation to operate on arbitrary dimensions.


