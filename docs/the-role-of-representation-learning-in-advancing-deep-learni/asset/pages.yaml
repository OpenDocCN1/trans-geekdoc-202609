- pgno: 148
  md: 'DAVA uses the same architecture and general hyperparameters as the baseline
    models. The discriminator of DAVA uses the same architecture as the encoder, with
    the last FC layer having a single output. To stabilize the adversarial training
    procedure of DAVA, we had to make use of a few measures more commonly used in
    GAN training. We used label smoothing as well as mixed batches for the training
    of the discriminator. We clipped the gradient norm for both the VAE and the discriminator
    at 1. As specified in Table B.3.17, we had to use a lower weight for applying
    the adversarial gradient of the discriminator to the decoder. A bigger weight
    negatively affected reconstruction performance of the VAE. We applied instance
    normalization to the discriminator, which improved the adversarial gradient signal.
    We experimented with other types of normalization (batch, spectral, layer) for
    encoder, decoder and discriminator, but did not find a consistent improvement
    for any of them. Further, we improved the mechanism to control the KL-Divergence
    of a VAE proposed by [31]. Instead of using the absolute difference, we propose
    to take the difference to the power of 4. This allows the KL-Divergence to fluctuate
    in between batches, but strongly punishes big deviations.


    We summarize the training procedure of DAVA in Algorithm 2.18. We use dimension-wise
    permutation (*PermuteDims*) to approximate the factorial posterior FP, similar
    to FactorVAE [143] and as explained in B.2.2. The process of adjusting C based
    on the accuracy of the discriminator is described in Algorithm 2.19.


