  md: '# B.2 PIPE Metric Details


    # B.2.1 Training of Evaluated Models


    We used disentanglement-lib [176], enabling easy reproducibility of our results,
    to train all models for Shapes3D, AbstractDSprites and Mpi3d Toy. We focus on
    FactorVAE and β-TCVAE as they are the models generally achieving the highest disentanglement
    performance in [176]. Following [176] on a reduced scale, we trained 5 random
    seeds each for 6 different hyperparameters. This leads to a total of 60 model
    instances per dataset, spanning a broad range of disentanglement performance.


    We followed a similar approach to reproduce the 30 FactorVAE and 30 β-TCVAE models
    for each dataset of the abstract reasoning study [269]. For each VAE model instance,
    we then trained 5 downstream models on the abstract reasoning task, based on the
    representation of the VAE, for 6000 steps and evaluated their performance. We
    used disentanglement-lib to compute the metrics for all evaluated models.


    # B.2.2 Sampling Strategies for D̃EP and D̃FP


    To sample from D̃EP, one can simply sample random instances from the data distribution
    and then use the model M to reconstruct these instances. This implicitly computes
    the EP latent distribution q(z). To sample from SFP, we first need to estimated
    q̄(z). Closely following Algorithm 1 in [143], we can achieve this by sampling
    a batch from q(z) and then randomly permuting across the batch for each latent
    dimension (see PermuteDims in Algorithm 2.18). This is a standard trick used in
    the independence testing literature [9]. As long as the batch is large enough,
    the distribution of these samples samples will closely approximate q̄(z). For
    the evaluation of the PIPE metric, it is therefore not necessary to compute the
    marginals over the complete data distribution. To amplify the differences between
    SEP and SFP, we then slightly adjusted the sampling strategy for the factorial
    posterior (FP). For each dimension of the latent representation we first estimate
    its range while encoding a batch of observations. We then sample values uniformly
    in that range, separately for each dimension, resulting in a similar factorial
    distribution as described earlier, but including a dimension-wise uniform distribution
    prior. This slightly improves performance of the PIPE metric. The architecture
    of the discriminator used in PIPE is similar to the encoder of the VAE displayed
    in Table B.3.13.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# B.2.3 The Role of Reconstruction Loss


    Consider a model which does not store any information in its latent space, where
    the decoder outputs the same image regardless of the inputs it receives. As the
    PIPE metric does not (and cannot) have any knowledge of the ground truth factors,
    it will give such a model a perfect score<sup>1</sup>. It is possible to use the
    reconstruction loss as a proxy for how good a model manages to capture the ground
    truth factors. However, the usefulness of the reconstruction loss is limited by
    two factors. First, it is strongly affected by noise, which requires at least
    dataset-specific normalization for it to be used in a metric. Second, the contribution
    of different ground truth factors in the reconstruction loss can differ a lot.
    We define


    ```

    PIPE<sub>Rec</sub> = PIPE - \(\alpha \cdot Rec_{norm}\)

    ```


    with <sub>Rec_norm</sub> denoting the per dataset normalized reconstruction loss.
    We show results for \(\alpha = 0.5\) and \(\alpha = 1\) in Figure B.2.11. While
    adding the reconstruction loss brings improved correlations with supervised metrics
    for <sub>Shapes3D</sub> and <sub>Mpi3d Toy</sub>, it decreases correlations for
    <sub>AbstractDSprites</sub>, especially for \(\alpha = 1\). For this reason, we
    decided to propose PIPE without any reconstruction loss component, as a practitioner,
    depending on the task, might have different requirements. In practice, we suggest
    to use a classical (denoising) VAE to get a feeling for the achievable reconstruction
    loss on a dataset and then use PIPE to select the best disentangling models among
    those that achieve a satisfactory reconstruction loss.


    # B.2.4 Relation to FID


    The Fréchet inception distance (FID) [119] is a metric to quantify the similarity
    between two image distributions. This is commonly achieved by using a pretrained
    Inception v3 model [256] without its final classification layer to encode the
    image distributions. The FID is then the Fréchet distance of two Gaussian distributions
    fitted to the respective latent image distributions. It is commonly used to evaluate
    the performance of GANs where one desires the generated images to be as similar
    as possible to the original dataset. While it appears that there are strong similarities
    between FID and PIPE, there exist distinct differences. The contribution of PIPE
    is to show the importance of the concept of similarity of the <sub>D<sub>EP</sub></sub>
    and <sub>D<sub>FP</sub></sub> distributions in light of disentanglement. Compared
    to our proposed PIPE metric, FID would be


    <sup>1</sup>In fact, this happened with a few FactorVAE models on <sub>Mpi3d Toy</sub>,
    see Table 4.13.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'another way to quantify PIPE. Figure B.2.12 shows that FID and the PIPE metric
    have some correlation, while also showing substantial differences for some models.
    A large advantage of the PIPE metric over FID would be that it is not dependent
    on a pretrained model. This opens up the possibility to deploy the PIPE metric
    on unseen data domains without any pretrained models available.


    # B.2.5 Comparison to ModelCentrality


    Even though MC outperforms UDR, PIPE still considerably outperforms MC. We discuss
    possible reasons on why this might be the case. To evaluate similarity of two
    models, MC samples from the prior of a model, but the EP distribution of the model
    might be far away from the prior. PIPE does not have this problem because it samples
    from the EP and FP distributions. To evaluate similarity of two models in MC,
    the second model is asked to encode generated samples of the first model (very
    similar to \((D)_{EP}\)). This distribution might be far away from the initial
    data distribution the encoder of the second model is used to. Another issue is
    that if only a very small number of models actually finds a disentangled representation,
    it is hard for MC to identify these models. PIPE can identify even a single disentangled
    model among many. Further, due to implicit biases in model architecture, it is
    possible that models learn similar entangled representations, thus breaking the
    core assumption of MC that only disentangled representations are similar.


    # B.3 Hyperparameters and DAVA Training Details


    # B.3.1 Hyperparameters


    DAVA and all considered baseline models use the same VAE architecture as displayed
    in Table B.3.13. The architecture of the discriminator and its specific hyperparameters
    used in FactorVAE are shown in Table B.3.15. All models, DAVA and baseline, use
    the same general hyperparameters displayed in Table B.3.14. We present the hyperparameter
    range explored for each baseline model in Table B.3.16. We adjusted the latent
    space size z\_dim for all models for a small number of datasets. We did this in
    order to give the VAE enough latent capacity to capture the complexity of the
    dataset. More specifically, we set z\_dim to 20 for _Mpi3d Toy_ and _Mpi3d Real_,
    and to 50 for _CelebA_ respectively.'
