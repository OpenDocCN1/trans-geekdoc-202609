    # B.3.2 Individual Contribution of Different Building Blocks of DAVA


    One might wonder which building blocks of DAVA contribute most to the performance.
    Results during development show that the adversarial loss of DAVA alone delivers
    comparable performance to \(\beta\)-TCVAE and FactorVAE with the same issue of
    regularization strength being dependent on the dataset. Interestingly, for AnnealedVAE,
    the optimal \(C\) for different datasets closely correspond to the values discovered
    by DAVA displayed in Figure 4.10. This also reflects the performance one could
    expect from DAVA without the adversarial loss.


    # B.3.3 Combination of DAVA with Existing Methods


    The main contribution of DAVA lies in its ability to adapt the latent capacity
    bottleneck with respect to the current state of the model, evaluated by the discriminator.
    In that regard, it would be possible to use a different discriminator as the one
    proposed by DAVA. One such option is the discriminator used in FactorVAE, which
    could be used in a similar manner as the discriminator in DAVA to guide the latent
    capacity bottleneck. This would still allow for a dataset-specific annealing scheme
    without the need for dataset-specific hyperparameters.'
