    parsers. The algorithms of the multi-path parsers remain largely unchanged. The
    main difference is in the way the attention scores are computed. Instead of using
    a single query vector (\(\bar{\mathbf{q}}\)) aggregated over all decoder tokens,
    we now select a subset of \(n_{paths}\) query vectors. Specifically, we select
    the \(n_{paths}\) query vectors with the highest attention scores at the highest
    level in the tree. We then parse the tree for each path individually and select
    the union of all chosen nodes for cross-attention.


