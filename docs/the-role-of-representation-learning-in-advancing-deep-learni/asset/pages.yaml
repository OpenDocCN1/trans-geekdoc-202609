    # 8.3 The PUZZLES Environment


    In the following section, we give an overview of the PUZZLES environment.1The
    environment is written in both Python and C. For a detailed explanation of all
    features of the environment as well as their implementation, please see Sections
    E.2 and E.3.


    # 8.3.1 Environment Overview


    Within the PUZZLES environment, we encapsulate the tasks presented by each logic
    puzzle by defining consistent state, action, and observation spaces. It is also
    important to note that the large majority of the logic puzzles are designed so
    that they can be solved without requiring any guesswork. By default, we provide
    the option of two observation spaces, one is a representation of the discrete
    internal game state of the puzzle, the other is a visual representation


