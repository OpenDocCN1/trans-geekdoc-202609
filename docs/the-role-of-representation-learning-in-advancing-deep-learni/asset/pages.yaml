    # ## 2.2.2 Active Learning


    In machine learning, data acquisition is often independent of model training,
    and models are seen as passive recipients of training data. Acquiring labeled
    data for supervised training of a machine learning model can be costly, for example
    when this involves asking bidders to value certain bundles for an ICA. To reduce
    the burden on the bidders, we want to ask them about as few bundles as possible.
    One possible way to overcome this problem is active learning. Active learning
    describes the process where a machine learning algorithm is allowed to choose
    the training data from which it learns [52, 235, 236]. The idea is to find the
    data points that are most useful for the model, i.e. that provide most information.
    If there is a fixed pool of samples available to choose from, the target task
    is a regression task, and samples are selected sequentially, such an approach
    is called sequential pool-based active learning for regression (ALR) [255]. The
    work by [289] builds on top of [255] and proposes an effective and relatively
    simple ALR method inspired by greedy passive sampling [303], outperforming existing
    ALR approaches. The main idea of [289] is that ensuring maximal diversity both
    in sample space and model output space leads to improved performance.


    We demonstrate that extending DL-ICA with active learning greatly improves the
    social welfare of the final auction allocations. We shortly formalize the two
    ALR strategies we base our work upon. We follow the notation of [289].


    # ### Greedy active learning on input values (GALI)


    Originally proposed by [303], GALI values tries to achieve a good diversity in
    the input space for the sampled data points. The data point we want to sample
    next should always lie as far as possible from the already labeled points.


    Let H be the set of all data points, l be the dimension of our input space, k
    the number of already labeled data points and S = {s1, ..., sk} the set of these
    labeled data points, with si = (si,1, ..., si,l) ∈ H. For every x ∈ H \ S we then
    compute the distance to the closest point in S as d_xin = min_i=1,...,k ||si -
    x||. A data point x* with the largest distance to its closest neighbor in S will
    be'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'the next one to label.


    \( x^* \in \arg \max_{x \in H \setminus S} \, d_x^{in} \) (2.6)


    After being labeled, the point is added to \( S \) and the process is repeated
    until we have reached our desired number of samples. Notice that this approach
    is different than the other active learning methods as it does not depend on any
    learning algorithm.


    # Greedy active learning on output values (GALO)


    Originally proposed by [289], GALO aims to achieve diversity in the model output
    space. In other words, the next data point to be sampled should lie the furthest
    away from the already labeled points in the model output space. Unlike GALI, this
    approach depends on a learned model \( m \). This model \( m \) needs to be trained
    with \( k \) samples before GALO is applied, so that it is able to provide a reasonable
    estimate of the labels.


    Let then \( S = \{(s_1, y_1), ..., (s_k, y_k)\} \) be the set containing the pairs
    of the already labeled data points \( s_i \) and their label set \( y_i \). Let
    further \( f \) denote the function learned by the machine learning model. The
    other notations stay the same as before. We again compute for every data point
    \( x \in H \setminus S \) the distance to its closest point in \( S \) as \( d_x^{out}
    = \min_{i=1,...,k} ||y_i - f(x)|| \). As before (2.6), we choose a point with
    the largest distance to be sampled next.


    \( x^* \in \arg \max_{x \in H \setminus S} d_x^{out} \) (2.7)


    # 2.3 Methods


    In this section, we show how we can extend the ALR methods from Subsection 2.2.2
    so that they can be applied to DL-ICA. Specifically, we want to improve upon the
    uniform sampling strategy used to generate the initial set of bundles that bidders
    are queried about in the starting phase of ICAs. (This refers to Line 1 in Algorithm
    2.1). Doing this allows an increase of the economic efficiency of DL-ICA while
    potentially reducing the burden on the bidders by decreasing the number of queried
    bundles. The data points here are often referred to as bundles. Instead of always
    using the word “labeled” to distinguish whether the true label of a data point/bundle
    is known, we also operate with the words “already sampled” and “queried”."'
