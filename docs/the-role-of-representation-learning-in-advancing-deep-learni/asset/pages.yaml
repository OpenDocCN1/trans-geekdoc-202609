  md: "```\nAlgorithm 2.18 Training DAVA\n\\(\\theta_{enc},\\theta_{dec},\\theta_{dis}\
    \ \\leftarrow initialize parameters\\)\nwhile Not Converged do\n  \\(x \\leftarrow\
    \ sample random mini-batch from \\tilde{D}\\)\n  \\(\\hat{z} \\leftarrow Enc(x)\\\
    )\n  \\(\\hat{x} \\leftarrow Dec(\\hat{z})\\)\n  \\(\\mathcal{L}_{vae} \\leftarrow\
    \ logp(\\hat{x}|\\hat{z}) - \\gamma(KL(q(\\hat{z})||p(\\hat{z})) - C)^4\\)\n \
    \ \\(\\theta_{enc} \\xleftarrow{\\dagger} -\\nabla_{\\theta_{enc}}\\mathcal{L}_{vae}\\\
    )\n  \\(\\theta_{dec} \\xleftarrow{\\dagger} -\\nabla_{\\theta_{dec}}\\mathcal{L}_{vae}\\\
    ) \\(\\triangleright\\) Update VAE\n  \\(\\hat{z} \\leftarrow Enc(x)\\)\n  \\\
    (\\hat{x} \\leftarrow Dec(\\hat{z})\\) \\(\\triangleright\\) Recreate \\(\\hat{z}\\\
    ) and \\(\\hat{x}\\) after update\n  \\(\\tilde{x} \\leftarrow Dec(PermuteDims(\\\
    hat{z}))\\)\n  \\(acc \\leftarrow accuracy(Dis, \\hat{x}, \\tilde{x})\\)\n  \\\
    (\\theta_{dis} \\xleftarrow{\\dagger} \\nabla_{\\theta_{dis}} log(Dis(\\hat{x}))\
    \ + log(1 - Dis(\\tilde{x}))\\) \\(\\triangleright\\) Update Discriminator\n \
    \ \\(C \\xleftarrow{\\dagger} update_C(acc)\\)\n  \\(\\mu_{base} \\leftarrow max((acc\
    \ - 0.5) \\cdot 100, 0)\\) \\(\\triangleright\\) Weight grows linearly with higher\
    \ accuracy\n  \\(\\theta_{enc} \\xleftarrow{\\dagger} -\\nabla_{\\theta_{enc}}\\\
    mu_{base} \\cdot \\mu_{enc} \\cdot log(Dis(\\hat{x}))\\)\n  \\(\\theta_{dec} \\\
    xleftarrow{\\dagger} -\\nabla_{\\theta_{dec}}\\mu_{base} \\cdot \\mu_{dec} \\\
    cdot log(1 - Dis(\\tilde{x}))\\) \\(\\triangleright\\) Update VAE with adversarial\
    \ loss\nend while\n```\n\n```\nAlgorithm 2.19 update_C\nInput: accuracy acc\n\
    if acc \\(\\le\\) 0.5 then\n  \\(U \\leftarrow \\Delta C\\) \\(\\triangleright\\\
    ) Only increase C if discriminator is clueless\nelse if acc \\(\\le\\) 0.51 then\n\
    \  \\(U \\leftarrow 0\\) \\(\\triangleright\\) Grace period\nelse\n  \\(U \\leftarrow\
    \ -\\Delta C\\) \\(\\triangleright\\) Decrease C if discriminator gets better\n\
    end if\nOutput: update U\n```"
