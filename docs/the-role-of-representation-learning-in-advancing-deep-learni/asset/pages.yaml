- pgno: 131
  md: 'puzzle instances, especially larger ones, are unlikely to be present in the
    training data of LLMs. We utilized a text-based interface for the Tents puzzle,
    extending the code base provided by Estermann et al. [84] to generate puzzle instances
    and represent the puzzle state in a format suitable for LLMs. Models were presented
    with the same prompt (detailed in Appendix F.1) for all puzzle sizes and models
    tested. The prompt included the puzzle rules and the initial puzzle state in a
    textual format. Models were tasked with directly outputting the solved puzzle
    grid in JSON format. This one-shot approach contrasts with interactive or cursor-based
    approaches previously used in [84], isolating the reasoning process from potential
    planning or action selection complexities.


    # 9.3.2 Evaluation Criteria


    Our evaluation focuses on two key metrics: success rate and reasoning effort.
    Success is assessed as a binary measure: whether the LLM successfully outputs
    a valid solution to the Tents puzzle instance, adhering to all puzzle rules and
    constraints. We quantify problem complexity by the problem size, defined as the
    product of the grid dimensions (rows × columns). To analyze the scaling of reasoning
    effort, we measure the total number of tokens generated by the LLMs to produce
    the final answer, including all thinking tokens. We hypothesize a linear scaling
    relationship between problem size and reasoning effort, and evaluate this hypothesis
    by fitting a linear model to the observed token counts as a function of problem
    size. The goodness of fit is quantified using the R² metric, where scores closer
    to 1 indicate that a larger proportion of the variance in reasoning effort is
    explained by a linear relationship with problem size. Furthermore, we analyze
    the percentage of correctly solved puzzles across different problem sizes to assess
    the performance limits of each model.


    # 9.3.3 Considered Models


    We evaluated the reasoning performance of the following large language models
    known for their enhanced reasoning capabilities: Gemini 2.0 Flash Thinking [63],
    OpenAI o3-mini [203], DeepSeek R1 [104], and Qwen/QwQ-32B-Preview [212]. These
    models represent a range of architectures and training paradigms optimized for
    complex reasoning tasks.'
  merge: -1
