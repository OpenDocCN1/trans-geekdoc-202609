    # Cross-Attention Complexity


    The Sliding Window Parser selects a constant number of nodes, \(\hat{K}_h \hat{K}_w\),
    regardless of the size of the input. Therefore, the complexity of the cross-attention
    operation is \( O(N_D \hat{K}_h \hat{K}_w) = O(N_D) \).


    # D.4 Experimental Setup


    Unless otherwise specified, the following experimental setup is the same for all
    experiments.


    **Dataset** We use the COCO 2017 object detection dataset [168] for our experiments.
    This dataset is divided into two subsets:


    +   • Training Dataset: Contains 117k images, each with 1 to 63 objects of various
    sizes and from 80 different categories.


    +   • Validation Dataset: Includes 5k images with similar characteristics to the
    training dataset.


    **Transformations** We normalize the pixel values of the input images and the
    bounding box coordinates (to the range \([0, 1]^4\)), following [35]. During training,
    we augment the data using random resized cropping (`RandomResizedCrop`), which
    extracts a randomly sized patch from the original image (with an area between
    0.7 and 1.0 times the original area) and resizes it to 512x512 pixels.


    **Loss Function** We employ the same loss function as DETR [35], which combines
    a classification loss and a bound box regression loss


    **Optimization** We use the AdamW optimizer with the following parameters:


    +   • \(\lambda = 10^{-4}\) (weight decay coefficient)


    +   • Learning rates: \(10^{-5}\) for the Backbone, \(10^{-4}\) for the rest of
    the model'
