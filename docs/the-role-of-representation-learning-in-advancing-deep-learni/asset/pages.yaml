    Vision Module The vision module in our approach uses a fixed heuristic based on
    human visual priors, including objectness, basic geometry, and symmetry. The module
    consists of an encoder and decoder, extracting different objects present in the
    task images and describing them in natural language. The inverse rules of encoding
    are applied to decode a description. First, the encoder checks if the full input
    image appears as a subset of the output and vice versa, taking into account different
    rotations, reflections and scales. In this case, the whole image is regarded as
    a single complex object. Otherwise, it predicts the background color using a convolutional
    neural network (CNN) and retrieves all objects present in the images (see Table
    7.4), by detecting monochromatic or multichromatic contiguous sets of pixels different
    from the background, independent of scale. To derive the textual description,
    the encoder first describes the size of the grid and the background color. It
    then groups all objects by similar shape and color patterns, and orders them by
    size to generate the description. The encoder and decoder could be replaced with
    learned modules, for example a pre-trained image captioner.'
