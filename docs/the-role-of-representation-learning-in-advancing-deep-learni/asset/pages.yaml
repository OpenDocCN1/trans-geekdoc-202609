  md: '# 4.4.1 Relation to Existing Metrics


    To classify the performance of the PIPE metric, we evaluate correlations with
    supervised metrics on a diverse set of commonly used datasets. We namely consider
    Shapes3D [30], AbstractDSprites [269] and Mpi3d Toy [103]. All datasets are part
    of disentanglement-lib [176], which we used to train the models we evaluated our
    metric on. More details on the implementation of the PIPE metric and the evaluated
    models can be found in Appendix B.2. Results are displayed in Figure 4.7. They
    show that the PIPE metric correlates positively with existing supervised metrics
    DCI, MIG and FVAE, surpassing the correlations of the unsupervised baselines.
    While the performance of UDR on Mpi3d Toy and the performance of MC on AbstractDSprites
    is lacking, PIPE demonstrates consistent performance across all datasets. Further,
    as opposed to UDR and MC, PIPE can be evaluated on a single model only, whereas
    UDR and MC are only able to evaluate sets of models.


    # 4.4.2 Correlation with Downstream Task Performance


    To further quantify the usefulness of the PIPE metric, we analyze the predictive
    performance of the metric for an abstract reasoning downstream task. For the downstream
    task, a VAE is trained to learn a disentangled representation of a dataset. The
    downstream model then only gets access to this representation then trying to solve
    the downstream task. Van Steenkiste et al. [269] evaluated different supervised
    disentanglement metrics in terms of predictive performance of accuracy in an abstract
    reasoning task on the datasets Shapes3D and AbstractDSprites. They showed that
    good disentanglement is an indicator of better accuracy during the early stages
    on training. We reproduce their experiment on a reduced scale by only considering
    up to 6,000 training steps. As can be seen in Figure 4.8, our metric is on par
    with supervised metrics and clearly outperforms the unsupervised baselines. More
    importantly this means that PIPE is a positive predictor of accuracy of downstream
    models in a few-sample setting and is therefore a desirable property for unsupervised
    model selection.


