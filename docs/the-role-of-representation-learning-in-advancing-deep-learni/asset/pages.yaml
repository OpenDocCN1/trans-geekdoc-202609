    # 2.5 Discussion and Conclusion


    We introduced active learning to deep learning based iterative combinatorial auctions.
    We demonstrated how to solve the exponential pool size problem using linear programming.
    Moreover, we proved the correctness of the linear programming approach. Our results
    show that active learning yields a'
