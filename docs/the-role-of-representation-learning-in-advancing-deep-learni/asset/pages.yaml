    # C.1.1 MAML


    We define the algorithm for meta-learning the base network, following Finn et
    al. [91] and the adaptions made by Dupont et al. [73]. Here, \(\alpha\) is a learnable
    step size, updated with the base network parameters \(\theta\), giving each element
    in the Functa vector its own inner learning rate.


    # C.1.2 INR Activation Function


    With the adaptation of the Rectified Linear Unit (ReLU) activation function [197],
    numerous studies in the field of Implicit Neural Representations (INR) have employed
    ReLU as their nonlinearity [207, 189, 96, 97, 190]. However, the authors of [245]
    laid the groundwork for this work by utilizing a simple sinusoidal activation
    function, demonstrating that such networks can accurately reconstruct various
    data modalities with low error and faster convergence speed. Subsequent research
    expanded on the concept of sinusoidal activa-'
