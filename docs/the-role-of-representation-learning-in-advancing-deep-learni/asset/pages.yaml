- pgno: 127
  md: '# A Scaling Analysis of Reasoning Effort

    and Problem Complexity in LLMs


    # Abstract


    Large Language Models (LLMs) have demonstrated remarkable text generation capabilities,
    and recent advances in training paradigms have led to breakthroughs in their reasoning
    performance. In this chapter, we investigate how the reasoning effort of such
    models scales with problem complexity. We use the infinitely scalable Tents puzzle,
    which has a known linear-time solution, to analyze this scaling behavior. Our
    results show that reasoning effort scales with problem size, but only up to a
    critical problem complexity. Beyond this threshold, the reasoning effort does
    not continue to increase, and may even decrease. This observation highlights a
    critical limitation in the logical coherence of current LLMs as problem complexity
    increases, and underscores the need for strategies to improve reasoning scalability.
    Furthermore, our results reveal significant performance differences between current
    state-of-the-art reasoning models when faced with increasingly complex logical
    puzzles.'
  merge: -1
  img_proc: true
