  md: '# # A Benchmark for Neural Algorithmic Reasoning


    # ## Abstract


    Algorithmic reasoning is a fundamental cognitive ability that plays a pivotal
    role in problem-solving and decision-making processes. Reinforcement Learning
    (RL) has demonstrated remarkable proficiency in tasks such as motor control, handling
    perceptual input, and managing stochastic environments. These advancements have
    been enabled in part by the availability of benchmarks. In this chapter we introduce
    PUZZLES, a benchmark based on Simon Tatham''s Portable Puzzle Collection, aimed
    at fostering progress in algorithmic and logical reasoning in RL. PUZZLES contains
    40 diverse logic puzzles of adjustable sizes and varying levels of complexity;
    many puzzles also feature a diverse set of additional configuration parameters.
    The 40 puzzles provide detailed information on the strengths and generalization
    capabilities of RL agents. Furthermore, we evaluate various RL algorithms on PUZZLES,'
