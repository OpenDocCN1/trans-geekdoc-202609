    # Abstract


    While artificial intelligence (AI) models have achieved human or even super-human
    performance in many well-defined applications, they still struggle to show signs
    of broad and flexible intelligence. The Abstraction and Reasoning Corpus (ARC),
    a visual intelligence benchmark introduced by François Chollet, aims to assess
    how close AI systems are to human-like cognitive abilities. Most current approaches
    rely on carefully handcrafted domain-specific program searches to brute-force
    solutions for the tasks present in ARC. In this work, we propose a general learning-based
    framework for solving ARC. It is centered on transforming tasks from the vision
    to the language domain. This composition of language and vision allows for pre-trained
    models to be leveraged at each stage, enabling a shift from handcrafted priors
    towards the learned priors of the models. While not yet beating state-of-the-art
    models on'
