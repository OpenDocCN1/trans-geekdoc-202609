    # 8.5 Discussion


    The experimental evaluation demonstrates varying degrees of success among different
    algorithms. For instance, puzzles such as Tracks, Map or Flip were not solvable
    by any of the evaluated RL agents, or only with performance similar to a random
    policy. This points towards the potential of intermediate rewards, better game
    rule-specific action masking, or model-based approaches. To encourage exploration
    in the state space, a mechanism that explicitly promotes it may be beneficial.
    On the other hand, the fact that some algorithms managed to solve a substantial
    amount of puzzles with presumably optimal performance demonstrates the advances
    in the field of RL. In light of the promising results of DreamerV3, the improvement
    of agents that have certain reasoning capabilities and an implicit world model
    by design stay an important direction for future research.


    **Experimental Results.** The experimental results presented in Section 8.4.1
    and Section 8.4.3 underscore the positive impact of action masking and the correct
    observation type on performance. While a pixel representation would lead to a
    uniform observation for all puzzles, it currently increases complexity too much
    compared the discrete internal game state. Our findings indicate that incorporating
    action masking significantly improves the training efficiency of reinforcement
    learning algorithms. This enhancement was observed in both discrete internal game
    state observations and pixel observations. The mechanism for this improvement
    can be attributed to enhanced exploration, resulting in agents being able to learn
    more robust and effective policies. This was especially evident in puzzles where
    unmasked agents had considerable difficulty, thus showcasing the tangible advantages
    of implementing action masking for these puzzles.


    **Limitations.** While the PUZZLES framework provides the ability to gain comprehensive
    insights into the performance of various RL algorithms on logic puzzles, it is
    crucial to recognize certain limitations when interpreting results. The sparse
    rewards used in this baseline evaluation add to the complexity of the task. Moreover,
    all algorithms were evaluated with their'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'default hyperparameters. Additionally, the constraint of discrete action spaces
    excludes the application of certain RL algorithms.


    **Benchmarking LLMs.** We also explore the potential of using PUZZLES as a novel
    framework for evaluating the reasoning abilities of both large language models
    (LLMs) and vision language models (VLMs). While existing reasoning benchmarks
    have been the subject of debate regarding their ability to accurately assess the
    reasoning abilities of LLMs [188, 211, 191], PUZZLES offers a unique advantage
    by enabling true out-of-distribution evaluation. Our preliminary experiments,
    conducted with Gemini 1.5 Flash [220] and GPT-4o mini [130], indicate that current
    LLMs have limited success in solving PUZZLES. A detailed analysis of these results
    is presented in Section E.6.5. This research lays the groundwork for future investigations
    using PUZZLES to provide a more nuanced understanding of the reasoning processes
    and limitations of LLMs.


    In the context of RL, the different challenges posed by the logic-requiring nature
    of these puzzles necessitates a good reward system, strong guidance of agents,
    and an agent design more focused on logical reasoning capabilities. It will be
    interesting to see how alternative architectures such as graph neural networks
    (GNNs) perform. GNNs are designed to align more closely with the algorithmic solution
    of many puzzles. While the notion that “reward is enough” [244, 268] might hold
    true, our results indicate that not just *any* form of correct reward will suffice,
    and that advanced architectures might be necessary to learn an optimal solution.


    # 8.6 Conclusion


    In this chapter, we have proposed PUZZLES, a benchmark that bridges the gap between
    algorithmic reasoning and RL. In addition to containing a rich diversity of logic
    puzzles, PUZZLES also offers an adjustable difficulty progression for each puzzle,
    making it a useful tool for benchmarking, evaluating and improving RL algorithms.
    Our empirical evaluation shows that while RL algorithms exhibit varying degrees
    of success, challenges persist, particularly in puzzles with higher complexity
    or those requiring nuanced logical reasoning. We are excited to share PUZZLES
    with the broader research community and hope that this benchmark will foster further
    research to improve the algorithmic reasoning abilities of machine learning models.'
  merge: -1
