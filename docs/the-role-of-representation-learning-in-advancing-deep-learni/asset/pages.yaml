    network can achieve a near-zero reconstruction error across all data modalities,
    with larger Functa sizes strongly correlating with better reconstruction quality.
    In particular, larger models start to diverge compared to smaller models once
    the Functa size exceeds the represented window size of 48. Most data modalities
    exhibit an S-curve, with reconstruction quality saturating beyond a Functa size
    of 256, except for images in the small model.'
