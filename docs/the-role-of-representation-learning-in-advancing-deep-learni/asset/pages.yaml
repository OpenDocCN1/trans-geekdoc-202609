    # 4.6 Conclusions


    In this chapter, we presented a new way to understand and formalize disentangled
    representations from an unsupervised point of view. The main idea is that the
    distribution of reconstructed samples of a disentangled VAE should be similar
    to the distribution of generated samples. We quantify this notion in a new unsupervised
    disentanglement metric called PIPE metric for evaluating disentangled representations.
    Without access to ground truth, PIPE provides results consistent with supervised
    metrics. Furthermore, we apply the same idea to DAVA, a novel VAE training procedure.
    DAVA can self-tune its regularization strength and produces results competitive
    with existing models that require more dataset-specific hyperparameter tuning.
    Robust unsupervised disentanglement performance is an important requirement for
    practical applicability. With DAVA, we provide a method that can be used by practitioners
    with relatively low computational requirements.'
