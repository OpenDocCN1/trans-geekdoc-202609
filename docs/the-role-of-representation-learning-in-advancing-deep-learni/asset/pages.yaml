    # 9.3 Methods


    # 9.3.1 The Tents Puzzle Problem


    In this chapter, we employ the Tents puzzle, a logic problem that is both infinitely
    scalable and solvable in linear time², making it an ideal testbed for studying
    algorithmic reasoning in LLMs. The Tents puzzle, popularized by Simon Tatham''s
    Portable Puzzle Collection [260], requires deductive reasoning to solve. The puzzle
    is played on a rectangular grid, where some cells are pre-filled with trees. The
    objective is to place tents in the remaining empty cells according to the following
    rules:


    +   - no two tents are adjacent, even diagonally


    +   - the number of tents in each row and column matches the numbers around the
    edge of the grid


    +   - it is possible to match tents to trees so that each tree is orthogonally
    adjacent to its own tent (but may also be adjacent to other tents).


    An example instance of the Tents puzzle is visualized in Figure 9.1 in the Introduction.
    The scalability of the puzzle is achieved by varying the grid dimensions, allowing
    for systematic exploration of problem complexity. Where not otherwise specified,
    we used the "easy" difficulty preset available in the Tents puzzle generator,
    with "tricky" being evaluated in Section F.2.1. Crucially, the Tents puzzle is
    designed to test extrapolative reasoning as


