- pgno: 231
  md: '# E.6.3 Detailed Baseline Results


    We summarize all evaluated algorithms in Table E.6.46.


    | Algorithm | Policy Type | Action Masking |

    | :--- | :--- | :--- |

    | Proximal Policy Optimization (PPO) [232] | On-Policy | No |

    | Recurrent PPO [128] | On-Policy | No |

    | Advantage Actor Critic (A2C) [194] | On-Policy | No |

    | Asynchronous Advantage Actor Critic (A3C) [194] | On-Policy | No |

    | Trust Region Policy Optimization (TRPO) [231] | On-Policy | No |

    | Deep Q-Network (DQN) [193] | Off-Policy | No |

    | Quantile Regression DQN (QRDQN) [58] | Off-Policy | No |

    | MuZero [230] | Off-Policy | Yes |

    | DreamerV3 [109] | Off-Policy | No |


    As we limited the agents to a single final reward upon completion, where possible,
    we chose puzzle parameters that allowed random policies to successfully find a
    solution. Note that if a random policy fails to find a solution, an RL algorithm
    without guidance (such as intermediate rewards) will also be affected by this.
    If an agent has never accumulated a reward with the initial (random) policy, it
    will be unable to improve its performance at all.


    The chosen parameters roughly corresponded to the smallest and easiest puzzles,
    as more complex puzzles were found to be intractable. This fact is highlighted
    for example in _Solo/Sudoku_, where the reasoning needed to find a valid solution
    is already rather complex, even for a grid with 2×2 sub-blocks. A few puzzles
    were still intractable due to the minimum complexity permitted by Tatham''s puzzle-specific
    problem generators, such as with _Unruly_.


    For the RGB pixel observations, the window size chosen for these small problems
    was set at 128×128 pixels.'
  merge: -1
  img_proc: true
