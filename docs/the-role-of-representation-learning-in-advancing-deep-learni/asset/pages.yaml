    neural networks (GNNs) or Transformers. All puzzles provide a discrete action
    space which only differs in cardinality. To accommodate the inherent difficulty
    and the need for proper algorithmic reasoning in solving these puzzles, the environment
    allows users to implement their own reward structures, facilitating the training
