  md: '# B.4 Complete Quantitative Results of all Evaluated Datasets


    We present results for a large range of datasets. We also include results for
    the best regularization strength for each of the baseline approaches after supervised
    hyperparameter selection in the upper part of each table. This serves as an additional
    reference on what can be expected from the completely unsupervised approaches
    in a best case scenario. We further include the results of Recursive Disentanglement
    Network (RecurD) by Chen et al. [45]. These are to be interpreted with a grain
    of salt, as we were not able to reproduce them ourselves, but had to take the
    values from their paper. This means that first, only a limited set of datasets
    and metrics were evaluated. Second, there will be differences in model architecture,
    hyperparameter choice, the range of hyperparameter tuning, general training loop
    and possibly more things. Please note that there are two aspects to take into
    consideration in regard of the strong performance of AnnealedVAE. First, the selected
    range of hyperparameters is especially strong, as we include the hyperparameters
    discovered by DAVA. Second, as explained earlier for DAVA, we use $(\cdot)^4$
    instead of the absolute value of the difference for controlling the KL-divergence.
    Further note that the exceptionally high PIPE metric score of FactorVAE on NoisyDSprites
    is caused by the decoder of the FactorVAE models always producing the same output
    regardless of the latent space. This is a design decision of PIPE, as described
    in Subsection B.2.3. Perhaps surprisingly, these models still seem to convey a
    small amount of information in the latent space as reflected by the supervised
    metrics. The same occurred with FactorVAE for Mpi3d Toy, interestingly though
    not on Mpi3d Real.


