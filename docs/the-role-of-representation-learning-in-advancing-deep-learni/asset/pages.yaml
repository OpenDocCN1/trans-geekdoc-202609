  md: 'Pygame surface, as explained in Section E.2.2. The info dict contains a dict
    called puzzle_state, representing a copy of the current internal data structures
    containing the logical game state, allowing the user to create custom rewards.


    The step() function increments the time in the environment by one step, while
    performing an action chosen from the action space. Upon returning, step() provides
    the user with five variables, listed in Table E.3.1.


    # Table E.3.1: Return values of the environment''s step() function. This information
    can then be used by an RL framework to train an agent.


    | Variable | Description |

    | :--- | :--- |

    | observation | 3D NumPy array containing RGB pixel data |

    | reward | The cumulative reward gained throughout all steps of the episode |

    | terminated | A bool stating whether an episode was completed by the agent |

    | truncated | A bool stating whether an episode was ended early, for example by
    reaching the maximum allowed steps for an episode |

    | info | A dict containing a copy of the internal game state |


    **Intermediate Rewards** The environment encourages the use of Gymnasium''s Wrapper
    interface to implement custom reward structures for a given puzzle. Such custom
    reward structures can provide an easier game setting, compared to the sparse reward
    only provided when finishing a puzzle.


    **Puzzle Module** The PuzzleEnv object creates an instance of the class Puzzle.
    A Puzzle is essentially the glue between all Pygame surface tasks and the C back-end
    that contains the puzzle logic. To this end, it initializes a Pygame window, on
    which shapes and text are drawn. The Puzzle instance also loads the previously
    compiled shared library containing the C back-end code for the relevant puzzle.


    The PuzzleEnv also converts and forwards keyboard inputs (which are for example
    given by an RL agent''s action) into the format the C back-end understands.


    **Compiled C Code** The C part of the environment sits on top of the highly-optimized
    original puzzle collection source code as a custom front-end, as detailed in the
    collection''s developer documentation [261]. Similar to other'
