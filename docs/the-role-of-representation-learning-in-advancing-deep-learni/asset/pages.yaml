- pgno: 208
  md: 'The largest action space has a cardinality of 14, but most puzzles only have
    five to six valid actions which the agent can choose from. Generally, an action
    is in one of two categories: selector movement or game state change. Selector
    movement is a mechanism that allows the agent to select game objects during play.
    This includes for example grid cells, edges, or screen regions. The selector can
    be moved to the next object by four discrete directional inputs and as such represents
    an alternative to continuous mouse input. A game state change action ideally follows
    a selector movement action. The game state change action will then be applied
    to the selected object. The environment responds by updating the game state, for
    example by entering a digit or inserting a grid edge at the current selector position.


    # E.2.4 Action Masking


    The fixed-size action space allows an agent to execute actions that may not result
    in any change in game state. For example, the action of moving the selector to
    the right if the selector is already placed at the right border. The PUZZLES environment
    provides an action mask that marks all actions that change the state of the game.
    Such an action mask can be used to improve performance of model-based and even
    some model-free RL approaches. The action masking provided by PUZZLES does not
    ensure adherence to game rules, rule-breaking actions can most often still be
    represented as a change in the game state.


    # E.2.5 Reward Structure


    In the default implementation, the agent only receives a reward for completing
    an episode. Rewards consist of a fixed positive value for successful completion
    and a fixed negative value otherwise. This reward structure encourages an agent
    to solve a given puzzle in the least amount of steps possible. The PUZZLES environment
    provides the option to define intermediate rewards tailored to specific puzzles,
    which could help improve training progress. This could be, for example, a negative
    reward if the agent breaks the rules of the game, or a positive reward if the
    agent correctly achieves a part of the final solution.'
