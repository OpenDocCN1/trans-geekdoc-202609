  md: '# Bridging Diversity and Uncertainty in Active learning with Self-Supervised
    Pre-Training


    # Abstract


    This study addresses the integration of diversity-based and uncertainty-based
    sampling strategies in active learning, particularly within the context of self-supervised
    pre-trained models. We introduce a straightforward heuristic called TCM that mitigates
    the cold start problem while maintaining strong performance across various data
    levels. By initially applying TypiClust for diversity sampling and subsequently
    transitioning to uncertainty sampling with Margin, our approach effectively combines
    the strengths of both strategies. Our experiments demonstrate that TCM consistently
    outperforms existing methods across various datasets in both low and high data
    regimes.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# ## 3.1 Introduction


    Training machine learning models are known to depend on a lot of labeled data.
    However, in many settings labeled data is not easy to acquire, but has to be created
    through expensive manual labeling. The goal of active learning is to address this
    challenge by providing a way to select the most informative samples for labeling.
    These are the samples for which training a classifier on them increases performance
    the fastest.


    ![](img/c742333bcb21933724ca00794dbfb657_49_0.png)


    Figure 3.1: Accuracy improvement compared to random for all baselines and our
    (TCM) strategy. The accuracy improvement mean and standard deviation is computed
    over all budget sizes for CIFAR10, CIFAR100 and ISIC2019.


    Depending on how many labeled samples the model has already been trained on, the
    properties of these samples have to change. In a low-budget setting, diverse and
    typical samples that cover the complete data distribution are most important.
    As the budget increases, the model does not profit from such samples as much anymore.
    Instead, once a model has learned the general rules of the data distribution,
    the most informative samples are now the ones that show where exactly the decision
    boundaries are. The issue is that different active learning methods work best
    in different data budgets and it is not clear when to switch between the methods.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'In this chapter, we provide a new heuristic called TCM on how to combine two
    such methods, namely TypiClust [107] and Margin. TypiClust shows excellent performance
    in low data regimes, while Margin excels afterwards. We specifically analyze the
    setting where a self-supervised pre-trained backbone model is available. Such
    a backbone not only massively increases performance compared to training from
    scratch, but also the transition dynamics from low to high data regimes simplify.


    We show that TCM achieves consistently strong performance, regardless of the labeling
    budget and the dataset (see Figure 3.1). It outperforms its underlying methods
    TypiClust and Margin during the complete training process. Thanks to the simplicity
    and effectiveness of our TCM , we provide clear guidelines for practitioners on
    how to easily use active learning in their own setting.


    # 3.2 Related Work


    In active learning, two primary sampling strategies emerge as critical: diversity-based
    and uncertainty-based sampling. Diversity-based sampling aims to select a representative
    set of samples that span the entire feature space, thus ensuring broad coverage
    of the input domain. In contrast, uncertainty-based sampling focuses on querying
    instances for which the model exhibits the highest prediction uncertainty. In
    this way, uncertainty-based sampling aims to refine the model''s performance in
    challenging cases. Early on in the training, diversity-based methods tend to perform
    better as with limited samples it is harder to cover the complete data distribution.
    Further, in that stage, the classifier uncertainty is a weak predictor of hard
    samples. This is also called the “cold start problem” [192] of uncertainty-based
    methods.


    # 3.2.1 Self-Supervised Pre-Training


    Before we introduce any specific active learning methods, we address self-supervised
    learning. In self-supervised learning, a model is trained using a pretext task,
    allowing it to learn useful representations without explicit external labels.
    Self-supervised learning complements active learning by learning embeddings before
    any data is labeled, simplifying both the sample quivering and classifier training.
    Popular and commonly used models include SimCLR [41] and DINO [36]. SimCLR uses
    a contrastive loss, where different views of an image are pushed to have a close
    representation and views of different images a distant representation. The DINO
    pretext task involves'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'learning data transformation invariant representations, by distilling different
    views of the same image from a teacher to a student network, where the teacher
    network is an exponential moving average of the student network.


    # 3.2.2 Uncertainty-Based Active Learning


    We first briefly introduce relevant uncertainty-based active learning methods.
    Some methods try to quantify model uncertainty based on the output logits of a
    classifier. Least confidence [159] selects samples where the highest class probability
    is the lowest. Entropy [140] measures model prediction uncertainty by the classifier
    probability distribution and selects samples with the highest entropy. Margin
    selects samples for which the difference between the class probabilities of the
    most likely two classes is the lowest. There also exist methods based on a Bayesian
    approach. DBAL [94] uses Bayesian convolutional neural networks as the classifier
    and queries samples based on their highest entropy. BALD [94] also uses Bayesian
    convolutional neural networks, but in contrast to DBAL, it selects samples that
    maximize information gained about the model parameters. Our TCM strategy builds
    on top of Margin for uncertainty sampling due to its strong performance and simple
    design.


    # 3.2.3 Diversity-Based Active Learning


    In the realm of diversity-based active learning, Coreset [233] queries diverse
    samples by selecting points that form a minimum radius cover of the remaining
    samples in the unlabeled pool. The minimum radius cover ensures that all remaining
    unlabeled sample has a nearby sample that gets labeled. ProbCover [302] improves
    on Coreset by building on top of self-supervised embeddings and selecting samples
    of high-density regions of the embedding space. While Coreset ensures that it
    queries samples from the whole distribution, it is likely to select outliers that
    do not benefit the training. In contrast, ProbCover [302] samples from uncovered
    high-density regions, selecting more representative samples. TypiClust [107] queries
    diverse samples by first clustering, and then selecting the most typical sample
    from each cluster. The number of clusters increases by the sampling size at each
    step, ensuring that there are enough clusters to sample new points from unexplored
    regions of the embedding space. Typicality is measured by the inverse average
    distance to other points in the cluster. The typical points queried by TypiClust
    enable strong performance, especially at the beginning of the training process.
    For'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'this reason, our TCM strategy utilizes TypiClust as the initial sampling strategy,
    thereby avoiding the cold-start problem.


    # 3.2.4 Hybrid Methods


    Some works in active learning have previously combined diversity and uncertainty-based
    sampling. BADGE [10] and BatchBALD [146] developed methods to ensure diversity
    within a batch of uncertain samples. SelectAL [106] on the other hand developed
    a complex algorithm that automatically detects the current data regime and selects
    a corresponding diversity or uncertainty-based active learning algorithm. However,
    these methods mostly focused on the case where the classifier is trained from
    scratch. As we show later in this chapter, when using a pre-trained backbone,
    there is no need for a complex switching strategy, as the transition point between
    diversity and uncertainty-based sampling always occurs early on in the training.


    # 3.3 Methodology


    The best querying strategy depends on the already labeled dataset size. As can
    be seen in Figure 3.1, a strong diversity-based method such as TypiClust (Blue)
    performs strongly in the first few steps of sampling. On the other hand, an uncertainty-based
    method such as Margin (Yellow) shows stronger performance the larger the cumulative
    budget grows. The best and most consistent performance can be achieved when utilizing
    both methods when they perform the strongest. We therefore propose a hybrid sampling
    strategy combining TypiClust and Margin and call this strategy TCM.


