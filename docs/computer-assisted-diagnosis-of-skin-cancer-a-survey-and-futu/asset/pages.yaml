    # 3.2. Pre-processing


    Pre-processing of an image is an important stage used in diagnosis since it removes
    noise and improves the content of the processed image. The pre-processing is used
    to eliminate unwanted artifacts like noise, blood vessels, hair, skin lines, texture,
    and air bubbles. These abnormalities limit border identification, resulting in
    accuracy loss and higher computing costs. As a result, various pre-processing
    procedures are necessary to eliminate these anomalies to permit segmentation and
    classification. Preprocessing is mostly used to enhance images for more efficient
    processing and reliable feature recognition. This stage aims to acquire an input
    image for attaining a grayscale image by removing noise and converting it to binary.
    It includes different techniques such as contrast enhancement, and filtering used
    to eliminate any undesired features (such as hair) from the image. Additionally,
    this procedure removes unnecessary noise and improves the image quality for the
    identification of the focal areas in the lesion image. Table 1 gives the description
    and categories of various preprocessing along with their categories.


    +   * **Image enhancement**: Image Enhancement is a critical method for improving
    the image’s visual look; it’s described as the "superior" transformation form
    for future automatic detection procedures. As a result, there are three types
    of image augmentation i.e., Image-scaling, contrast adjustment, and color space
    transformation.

    +   * **Image restoration**: The method for recovering a deteriorated image from
    a fuzzy and noisy one is known as image restoration. It is capable of restoring
    degraded photos in a variety of methods. Image degradation can be produced by
    several factors, that includes imaging system flaws, poor focusing, motion, and
    so on, all of which cause an image to become noisy or blurry. Because damaged
    images lead to fault detection, it’s critical to understand the types of noise
    in an image before choosing the best denoising method. The different types of
    Categories are Restoration from noise (mean filter, adaptive filter, order statistics
    filter), Restoration from blur.

    +   * **Removing thick hairs**: Thick hairs are a frequent impediment to automated
    analysis of tiny skin lesion images, and they can cause the segmentation process
    to be misled. To eliminate dense hairs in skin cancer images, researchers used
    mathematical morphology approaches such as Curvilinear structure recognition,
    inpainting-based method, automate software known as Dullazor, and the Top Hat
    transform in combination with the bicubic interpolation method. The procedures
    are utilized to create hairless images.


    The images produced by preprocessing steps of the skin cancer diagnosing systems
    can be distinguished from those produced by other systems.


