    # 3.4.4.3. Components of a CNN


    Convolutional neural networks are made up of three layers: input, and output,
    and likewise made up of several layers, each with its own set of functions, that
    take and process images as input. A general architecture diagram of CNN, with
    main components like layers, activation function, and key parameters. Layers of
    CNN are divided into three types: convolutional, pooling, and fully connected.
    Convolution and pooling, the first two layers, extract features; the third layer,
    completely linked, transmits those features to the output, like classification.
    The activation function is the nonlinear modification we apply to the input signal.
    This altered output is eventually transmitted as input to the next layer of neurons.
    Linear activation functions and non-linear activation functions such as Sigmoid
    and logistic functions, Hyperbolic Tangent function Tanh, ReLU contains subtypes
    Dying, Leaky and Parametric ReLU, Exponential Linear Unit (ELU), and Softmax are
    popular forms of activation functions [10].


    CNN architectures. CNN architectures have many different shapes and sizes. These
    designs are utilized for the establishment of deep learning algorithms. Table
    5 gives a summary of different CNN architectures with their pros and cons.


    +   • LeNet-5: One of the most basic architectures is LeNet-5. It includes 2 convolutional
    layers and 3 fully-connected layers, thus it has “5’ neural network names that
    are frequently obtained from the no. of convolutional and fully-connected layers.
    We recognize today’s average-pooling layer as a subsampling layer, which includes
    trainable weights (which is not how CNNs are created now). This design has roughly
    60,000 different variables to take into consideration [11].

    +   • AlexNet: AlexNet comprises eight layers, five of which are convolutional
    and three of which are completely linked. AlexNet just added a couple more layers
    to LeNet-5. AlexNet is a straightforward yet effective CNN design that includes
    both convolutional and pooling layers. Its top layer is then composed of layers
    that are completely connected. It makes use of the GPU for training and task execution,
    which is advantageous. AlexNet continues to be used as a foundation for deep neural
    network applications, most notably in computer vision and image processing [12].

    +   • VGG Net: This architecture consists of a sequence of convolutional layers
