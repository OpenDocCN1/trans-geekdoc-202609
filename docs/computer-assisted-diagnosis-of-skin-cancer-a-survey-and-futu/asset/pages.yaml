- pgno: 14
  md: '# 7.2. Emerging sophisticated segmentation methods for skin lesions


    The most crucial step and one of the most well-known areas of research in skin
    cancer diagnosis is segmentation. There are various segmentation strategies, however,
    no single strategy may be regarded as being better. Only specific images and apps
    can benefit from such solutions. Different segmentation methods include thresholding,
    region growth, merging and splitting, clustering, edge detection, and model-based
    image division. Deep learning methods can be incorporated into tactical plans
    for handling such complicated issues. These networks disseminate data using several
    node levels and paths. Therefore, improving segmentation techniques for multidimensional
    images is a future objective. Future research must also focus on improving segmentation
    approaches to achieve.


    # 7.3. Emerging improved classification approaches


    The adoption of neural network approaches in machine learning techniques has made
    them effective techniques for classification, according to current revelations.
    However, a huge number of new techniques are being created virtually constantly.
    Typically, researchers create a novel approach and then test it on benchmark datasets
    where it outperforms a variety of other methods. In the future, researchers will
    work on a sizable dataset with many more identified skin lesions while constructing
    a successful CNN model that includes preprocessing stages to get the best prediction
    and classification accuracy. The CAD, which is user-friendly and reliable for
    all image acquisition settings, can also be used to identify skin cancer.


    # 7.4. Establishing standard performance evaluation for CAD systems


    The diagnostic performance of CAD systems can be evaluated using several techniques.
    The precision-recall (PR), the area under the curve (AUC), the positive and negative
    predictive values, and the receiver operating characteristic curve (ROC) are a
    few examples of these techniques. Some of the performance-related characteristics
    of a CAD system may be covered by one assessment method. It might, however, overlook
    certain other crucial details. Therefore, more than one assessment approach may
    need to be taken into account to properly evaluate the performance of a CAD system.
    There are presently no standard methods for measuring the performance of CAD.
    Standardized methods for evaluating the efficacy of CAD systems are lacking.


    # 7.5. CAD system adoption for medical care


    There are several technological flaws in the process of using CAD systems to make
    diagnosis decisions. One such flaw is the absence of instruction given to doctors
    on how to interpret the outcomes. This may be a key factor in the CAD system’s
    unsatisfactory performance. In order to comprehend the results of CAD systems,
    clinicians must receive the proper knowledge and training. Researchers need to
    enhance the functionality of CAD systems by attaining more precise analyses in
    order to win the trust of doctors. A future recommendation is to show that the
    advantages outweigh the drawbacks or risks by a large factor.


    # 8. Conclusion


    In this contemporary epoch, the medical imaging research community is consistently
    working to develop computer-aided solutions for performing diagnoses of skin lesions.
    With this motivation, this manuscript attempts to identify complications for forthcoming
    researchers by surveying and analyzing the literature available on computer-aided
    diagnosis methods for skin lesions in dermoscopic images. The various research
    papers on skin lesion preprocessing, segmentation, and classification have been
    thoroughly reviewed, and the results were summarized by implementing different
    techniques on the standard dataset to see their applicability in real-time scenarios.
    In addition, an examination of each approach, including the ensuing shortcoming,
    advantages, and disadvantages that need to be addressed in the context of the
    long-run perception, has been explored and, several research concerns that call
    for the immediate attention of researchers have been emphasized. Furthermore,
    a comparison of existing and accessible datasets has also been presented. Additionally,
    certain recommendations for the future have been derived by understanding the
    shortcomings of the studies that have already been done. This work will not only
    assist professionals in medical image processing in discovering unique, beneficial
    concepts and research obstacles, but it will also inspire new researchers to participate
    in this field of study, which will have immeasurable benefits for society in the
    future (Tables 4 and 6).


