    # 5.2. Comparative analysis of denoising techniques


    The authors have discussed both qualitative and quantitative outcomes of the image
    data de-noising approaches in this subsection. To analyze the effectiveness of
    various noise reduction approaches, qualitative analysis sometimes referred to
    as subjective analysis, is carried out by visually evaluating medical pictures.
    To diagnose disorders, the graphical quality of imaging is crucial, therefore
    the main goal is to match the noise presence and texture of the denoised images
    with that of the original image restoration, protection of delicate visual edges,
    and preservation. On the same set of images, Fig. 5 shows the subjective outcomes
    of the noise reduction approaches that were taken into consideration. The spatial
    filters, namely median and gaussian, achieve noise reduction but blur crucial
    picture features by using the mean of pixel values, as can be shown from the image
    in Fig. 5(b) and (c).


    After applying and testing several denoising techniques outlined in the literature
    of a similar collection of images, it was discovered that the anisotropic diffusion
    filter (ADF) performs all other strategies since it accomplishes image smoothness
    while keeping image edge features. According to the visual findings shown in Fig.
    5, ADF provides improved visual outcomes even in the presence of noise by preserving
    crucial picture features, resulting in images that are more vivid, realistic,
    and smoother. The parameters that were used in the investigated denoising algorithms
    were consistent with the standard parameters given by the respective authors.
    However, image visual quality provides adequate evidence to discriminate between
    the inputted image with noise & the de-noised image after noise [25].


    Table 7 shows the noise reduction of the quantitative performance approaches presented
    about SSIM and PSNR. According to the data listed in Table 7, the Gaussian Filter
    achieves higher values of the objective measure under consideration. Furthermore,
    the subjective results of the Gaussian Filter are insufficient. The results reported
    in Fig. 5 and Table 7 show that the ADF can maintain major picture information
    although conducting noise removal, and improves the quantitative metrics regardless
    of the amount of noise present in the original image. The combination of both
    analyses shows that ADF outperforms the state-of-the-art approaches for skin lesions
    with noise. Not only it has a higher value of PSNR, but also it has a reasonably
    high value of SSIM, demonstrating that this approach can convincingly maintain
    the necessary information of the picture such as textures and edges. Table 8 also
    discusses the advantages and disadvantages of the employed preprocessing approaches.


