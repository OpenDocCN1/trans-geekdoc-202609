    # 6.2. Unstable datasets


    In the real world, skin cancer datasets are significantly skewed. The quantity
    of images in databases for each kind of skin cancer varies. E.g., these datasets
    have several images of various forms of cancer but just some images of rare skin
    cancers, making image generalization challenging.


    # 6.3. Inadequate access to high-performance hardware


    To obtain the various characteristics of a skin lesion image, the deep learning
    programmer needs the most powerful system resources with powerful GPU capacity,
    which is demanding for improved skin cancer detection. The lack of appropriate
    computer hardware requirements is a major issue in training for the detection
    of skin cancer.


    # 6.4. Skin cancer images with minor interclass variation


    Healthcare images have comparatively minimal inter and intra-class variation,
    for example, the cancerous and non-cancerous images are significantly low variation
    than the horse and zebra images. Many skin lesions are so similar that they are
    harder to identify. Because of the limited diversity, image analysis and classification
    become incredibly tough.


    # 6.5. Investigation of genetic and environmental factors


    Different genetic factors of skin cancer, such as fair complexion, eye color,
    red hair, body moles, and any medical history have been identified as genetic
    causes of cancer. These factors and environmental factors such as high exposure
    to Ultraviolet radiation, the possibility of developing skin cancer increases.
    These parameters can be used with current deep learning algorithms to boost performance.


    # 7. Future recommendations


    There are many studies in the area of skin cancer detection, however more recent
    studies have focused on increasing the performance and accuracy of skin cancer
    detection. To achieve these goals, sophisticated pre-processing and segmentation
    techniques are used. Additionally, the accuracy of classification operations is
    being impacted by recent deep learning research. The primary objectives of this
    type of study are advancements in scalability and flexibility during a skin cancer
    diagnosis. In the diagnosis of skin cancer by dermatologists, computer-aided diagnosis
    (CAD) has emerged as one of the main research areas. The fundamental idea behind
    CAD is to offer a result of data as a second opinion to help dermatologists analyze
    images by increasing the consistency and accuracy of diagnosis and also by speeding
    up image reading. A self-assessment tool like this one could be used in the future
    to automatically identify people who need treatment. To standardize screening
    recommendations, it would potentially be feasible in the future to create a skin
    cancer screening registry.


    # 7.1. Gathering of data and quality control


    The collection of relevant data and quality criteria of the data are the first
    steps in the CAD process. CAD systems include electronic health records (EHRs)
    as a crucial component. Eliminating bias in the training data is one of the crucial
    data gathering concerns. The efficiency of the CAD system could be severely hampered
    by the presence of bias in such data. Some other issue is related to data imbalance,
    improper sampling generates a problem of class imbalance. As a result, CAD systems
    would need to process enormous volumes of clinical data to arrive at conclusions
    about skin diseases that are statistically significant.'
