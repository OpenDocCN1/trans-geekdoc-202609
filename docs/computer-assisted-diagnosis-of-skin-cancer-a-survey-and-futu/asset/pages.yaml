    # ## 2. Complications in the diagnosis of skin lesions


    The different image forms and sources are responsible for the difficulties in
    diagnosing skin lesions. Human skin color can seem very different from person
    to person, making skin detection a complicated and challenging operation. Fig.
    2 illustrates the different visual properties of skin lesions’ images present
    several issues, including (a) blood vessels (b) low contrast (c) ruler in skin
    images (d) Bubbles (e) hair artifacts, and (f) non-uniform border.


    The location, size, and shape of lesions vary enormously. For accurate analysis,
    the majority of image analysis algorithms necessitate image pre-processing. During
    image acquisition, artifacts called noise are added to the images. The presence
    of noise and artifacts may affect the ability to identify lesion images. Hair
    artifacts, bubbles, and blood vessels are among the examples. It can be difficult
    to obtain precise images of the border of skin lesions during the preprocessing
    stage for straightforward asymmetry prediction. Low contrast from nearby tissues
    might occasionally exist, which adds to the difficulties.


