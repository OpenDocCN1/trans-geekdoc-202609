    # 3.4. Classification techniques for skin lesions


    For the analysis of skin cancer, lesion images could be categorized to aid in
    the detection of skin cancer. Images of skin lesions could identify several types
    of skin cancer. These are divided into two types: malignant and benign. There
    are several kinds of basal cell carcinoma: actinic keratosis, squamous cell carcinoma,
    Merkel cell carcinoma, seborrheic keratosis, vascular lesions, atypical moles,
    and melanoma. Melanoma kind of skin cancer is the worst of these categories of
    lesions since it is a malignant lesion. In this part, we discussed both traditional
    and deep learning classification approaches.


