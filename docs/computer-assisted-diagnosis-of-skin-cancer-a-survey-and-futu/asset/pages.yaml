    # 6. Research challenges of skin lesion detection


    Variations in image type and origins might be responsible for the difficulty in
    recognizing skin lesions. Human skin color has a wide range of appearances, making
    skin identification a difficult and time-consuming process. Following is some
    of the challenges posed by the various visual qualities of skin lesions images.


    # 6.1. Advanced training


    One of the major issues with deep learning computer-aided diagnostic systems is
    the extensive training required. To look at it in other words, to accurately interpret
    and analyze features from dermoscopic images, it will have to go through significant
    training, and


