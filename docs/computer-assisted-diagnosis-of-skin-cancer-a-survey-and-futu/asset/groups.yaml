  mdcn: "\n\n- 皮肤癌公开可用数据集。\n- 在知名期刊上发表。\n- 使用英文撰写。\n\n我们使用了以下标准来筛选出不相关的作品\n\n- 综述文章。\n\
    - 非英文语言出版物。\n- 科学论证不足。\n- 书籍。\n- 书籍章节。\n\n图 3 以流程图形式展示了 PRISMA 选择技术，基于皮肤病灶预处理、皮肤癌分割和分类，共有\
    \ 101,716 篇文章符合初级搜索策略的标准。去除重复项后，最终论文数量为 8480 篇。应用纳入标准后，共找到 458 篇全文出版物；随后使用排除标准对其进行了进一步筛选。最终，选出了\
    \ 30 篇采用机器学习和深度学习技术的出版物。本研究对选定的出版物进行了更深入的探讨，并讨论了研究结果。此外，仅将比较多种模型的研究中得分最高的模型纳入了我们的排名。\n\
    \n## 3.2. 预处理\n\n图像预处理是诊断中用于去除噪声并改善处理后图像内容的重要阶段。预处理用于消除不需要的伪影，如噪声、血管、毛发、皮肤线条、纹理和气泡。这些异常会限制边界识别，导致精度损失和更高的计算成本。因此，需要各种预处理程序来消除这些异常，以允许分割和分类。预处理主要用于增强图像，以便进行更高效的处理和可靠的特征识别。此阶段旨在通过去除噪声并将其转换为二值图像来获取灰度输入图像。它包括对比度增强和滤波等不同技术，用于消除图像中任何不需要的特征（例如毛发）。此外，此过程去除不必要的噪声并提高图像质量，以便识别病灶图像中的焦点区域。表\
    \ 1 给出了各种预处理的描述和类别及其类别。\n\n- **图像增强**：图像增强是改善图像视觉外观的关键方法；它被描述为未来自动检测程序的“优越”转换形式。因此，图像增强分为三种类型，即图像缩放、对比度调整和色彩空间转换。\n\
    - **图像修复**：从模糊和噪声图像中恢复劣化图像的方法称为图像修复。它可以通过多种方法恢复劣化的照片。图像劣化可由多种因素引起，包括成像系统缺陷、对焦不良、运动等，所有这些都会导致图像变得嘈杂或模糊。由于损坏的图像会导致故障检测，因此在选择最佳去噪方法之前，了解图像中的噪声类型至关重要。不同的类别包括去噪恢复（均值滤波、自适应滤波、顺序统计滤波）和去模糊恢复。\n\
    - **去除粗毛发**：粗毛发是自动分析微小皮肤病灶图像时的常见障碍，可能导致分割过程出现偏差。为了消除皮肤癌图像中的密集毛发，研究人员使用了数学形态学方法，如曲线结构识别、基于修复的方法、名为\
    \ Dullazor 的自动化软件，以及双立方插值法结合的顶帽变换。这些程序用于生成无毛发图像。\n\n皮肤癌诊断系统预处理步骤生成的图像可以与其他系统生成的图像区分开来。\n\
    \n表 1\n各种预处理技术。\n\n| 预处理技术 | 描述 | 类别 |\n| :--- | :--- | :--- |\n| 图像增强 | 用于改善图像视觉外观的技术\
    \ | 滤波、对比度调整、图像缩放、色彩空间转换 |\n| 图像修复 | 从模糊和嘈杂图像中恢复损坏图像的技术 | 去噪恢复（均值滤波、自适应滤波、顺序统计滤波）、去模糊恢复\
    \ |\n| 去除粗毛发 | 在病灶微小皮肤像素的自动分析中，粗毛发被视为典型障碍，可能导致分割过程出现偏差并必须被去除。 | 形态学方法、曲线结构检测、基于修复的方法\
    \ |\n\n## 3.3. 皮肤病灶图像分析和诊断的分割技术\n\n分割是皮肤病灶诊断中的关键阶段，通过将不健康区域与健康区域隔离来分析皮肤病灶图像的关键步骤，该方法可获取感兴趣区域。最近，分割过程受到了更多关注。文献中已探索了许多分割方法或算法。这些技术解决了典型医学分割过程中的几个缺陷。然而，没有一种策略可以被认为是优越的。此类解决方案仅适用于特定图像和应用。阈值法、区域生长、合并与分割、聚类、边缘检测和基于模型的图像分割是不同的分割技术。所有分割技术都基于以下重要因素：强度水平、相似性和不连续性。本节介绍了几种分割皮肤病灶图像的策略，基于手工制作特征的方法（如基于阈值的方法）属于这些策略，还有基于智能的有监督分割、边缘和区域方法。深度学习和人工神经网络算法是基于智能的系统的示例。\n\
    \n### 3.3.1. 基于传统智能的分割方法\n\n基于人工智能的系统可以通过推理、学习和感知已存在的大型数据集中的图像来进行图像分析。皮肤病灶分割可以通过多种方式完成，包括有监督和无监督方式，使用现有数据集来训练和学习系统。基于智能的分割方法（如\
    \ ANN、模糊 C-均值和遗传算法）常被使用，解决方案也已融入深度学习技术。此外，表 2 描述了各种传统的分割技术。\n\n- 基于阈值的方法：基于阈值的方法可用于从灰度图像创建二值图像。分割用于从彩色图像创建二值图像。分割是将两个或多个类别分配给原始图像中每个像素的过程。当存在两个以上的类别时，结果通常是一系列二值图像。在图像处理中，阈值法通过定义至少一种颜色或灰度值的边界，将图像划分为较小的段或块。公式\
    \ (1) 显示了图像的阈值处理，其中 T 为阈值\n  g(x, y) = { 0, f(x, y) < T\n              1, f(x,\
    \ y) ≥ T } (1)\n\n- 基于边缘或边界的分割方法：一致性对基于区域的方法至关重要。假设区域内的所有像素必须具有相同的灰度级，这些算法将图像分解为更小的子区域。“基于区域的技术”一词指的是使用附近像素强度值中可比模式作为起点的方法。算法的目的是根据结构或功能角色对区域进行分组，即聚类的目的。\n\
    \n- 基于区域的分割：在此分割过程中，像素必须符合某些既定约束才能被分类到相关像素区域。根据特定标准，图像被分割为具有可比像素的独立组或区域。其核心原理是同一区域内附近的像素具有相同的值。\n\
    \n- 拉普拉斯高斯滤波方法：拉普拉斯滤波器是一种二阶或二阶导数图像增强技术，旨在引起对强度快速变化区域的注意。它非常擅长检测图像中的微小特征。拉普拉斯滤波器会改善任何具有强不连续性的特征。公式\
    \ (2) 显示了线性微分算子的拉普拉斯二阶导数，其中函数 f 表示图像。\n  Δ²f = ∂²f/∂x² + ∂²f/∂y² (2)\n\n表 2\n\
    各种分割技术。\n\n| 技术 | 描述 |\n| :--- | :--- |\n| 基于阈值的方法 | 一种分割方法，通过将像素分配给给定阈值下方或上方的两个不同级别，将灰度图像转换为二值图像。\
    \ |\n| 基于边缘或边界的分割方法 | 在此分割方法中，通过查找边缘的像素并将其连接来生成图像边缘，从而将图像定位在区域的不同边缘上。 |\n| 基于区域的分割方法\
    \ | 此分割方法根据一组特征将图像分为多个组或区域。根据其核心概念，给定区域内的所有相邻像素被假定具有相同的值。 |\n| 拉普拉斯高斯滤波方法 | 拉普拉斯滤波器是一种派生滤波器，用于通过定位强度快速变化区域来识别图像中的边缘。滤波器方法通常在灰度图像上执行，以生成新的带边界灰度图像。\
    \ |\n| 分水岭分割方法 | 分水岭分割被视为一种混合分割方法，即区域和边缘方法。分水岭分割方法基于微分方程的工作原理。 |\n| K-means 聚类分割\
    \ | 此方法用于根据像素与聚类中心之间的多种距离维度将图像隔离为多个簇；其目标是将图像分割为可互换的受限组。 |\n\n"
