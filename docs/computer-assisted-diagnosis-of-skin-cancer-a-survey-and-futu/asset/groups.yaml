    ## 7.2. 皮肤病灶出现的先进精细分割方法


    皮肤癌诊断中最关键的步骤和研究最广泛的领域之一是分割。存在多种分割策略，然而，没有哪一种单一策略可以被认为更好。只有特定的图像和应用程序才能从中受益。不同的分割方法包括阈值分割、区域生长、合并与分割、聚类、边缘检测和基于模型的图像分割。深度学习方法可以纳入处理此类复杂问题的策略中。这些网络通过多个节点层级和路径传播数据。因此，改进多维图像的分割技术是未来的目标。未来的研究还必须专注于改进分割方法以实现。


    ## 7.3. 出现的改进分类方法


    根据最新研究结果，机器学习技术中神经网络方法的采用使其成为有效的分类技术。然而，大量新技术正在不断涌现。通常，研究人员会提出一种新方法，然后在基准数据集上对其进行测试，使其优于各种其他方法。未来，研究人员将在包含更多已识别皮肤病灶的大型数据集上工作，同时构建一个包含预处理阶段的成功
    CNN 模型，以获得最佳的预测和分类准确率。CAD 系统在所有图像采集设置中都用户友好且可靠，也可用于识别皮肤癌。


    ## 7.4. 建立 CAD 系统的标准性能评估


    CAD 系统的诊断性能可以使用多种技术进行评估。这些技术的一些示例包括精确率-召回率（PR）、曲线下面积（AUC）、阳性和阴性预测值以及接收器操作特征曲线（ROC）。一种评估方法可能涵盖
    CAD 系统的一些与性能相关的特征。然而，它可能会忽略某些其他关键细节。因此，为了正确评估 CAD 系统的性能，可能需要考虑多种评估方法。目前，衡量 CAD
    性能尚无标准方法。缺乏评估 CAD 系统疗效的标准化方法。


    ## 7.5. 医疗保健中 CAD 系统的采用


    使用 CAD 系统进行诊断决策的过程中存在若干技术缺陷。其中一个缺陷是缺乏对医生如何解读结果的指导。这可能是 CAD 系统性能不佳的关键因素。为了理解 CAD
    系统的结果，临床医生必须接受适当的知识和培训。研究人员需要通过实现更精确的分析来增强 CAD 系统的功能，以赢得医生的信任。未来的建议是证明优势大大超过劣势或风险。


    ## 8. 结论


    在这个当代时代，医学影像研究界一直在努力开发用于进行皮肤病灶诊断的计算机辅助解决方案。怀着这种动机，本手稿通过调查和分析皮肤镜图像中皮肤病灶计算机辅助诊断方法的现有文献，试图为未来的研究人员识别复杂问题。关于皮肤病灶预处理、分割和分类的各种研究论文已得到彻底审查，并通过在标准数据集上实施不同技术来总结结果，以了解它们在实时场景中的适用性。此外，还探讨了对每种方法的考察，包括在长期视角下需要解决的随之而来的缺点、优点和缺点，并强调了几项需要研究人员立即关注的研究问题。此外，还展示了对现有和可访问数据集的比较。此外，通过了解已完成的研究的不足，还得出了若干未来建议。这项工作不仅将帮助医学图像处理领域的专业人士发现独特且有益的概念和研究障碍，还将激励新研究人员参与这一研究领域，这将为未来的社会带来无法估量的益处（表
    4 和表 6）。


