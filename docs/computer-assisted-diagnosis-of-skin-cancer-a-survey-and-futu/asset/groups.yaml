  mdcn: "\n\n## 皮肤癌计算机辅助诊断：调查与未来建议\n\nSonam Khattar, Ravinder Kaur *\n\nDepartment\
    \ of Computer Science, Chandigarh University, Ghuruan, Mohali, Punjab 140413,\
    \ India\n\n- 文章信息\n- 编辑：Dr. Gaurav Garg\n- 关键词：\n  - 皮肤癌\n  - 调查\n  - 深度学习\n \
    \ - 皮肤病变\n  - 预处理\n  - 分割\n  - 分类\n\n## 摘要\n\n皮肤癌是最常见的癌症类型之一，全球每年约有 200 万至 300\
    \ 万病例被诊断出来。皮肤上的异常细胞发育会导致皮肤病变，而手动检查皮肤病变是一项困难、具有挑战性且繁琐的任务。计算机辅助诊断（CAD）技术可以帮助医生提升诊断能力，缩短获得精确诊断所需的时间。此外，缺乏先进且用户友好的\
    \ CAD 技术，对疾病的非侵入性、精确和快速识别引发了严重担忧。CAD 系统可以帮助对皮肤病变进行早期诊断，从而为患者制定及时的治疗计划，提高其生存率。然而，由于皮肤病变图像的独特性和复杂性，对皮肤病变图像的检查仍然面临重大困难。本研究旨在讨论几种用于分析皮肤病变的预处理、分割和分类策略，以区分癌变图像和非癌变图像。主要目标是为初入该领域的研究人员提供概述，帮助其开展研究。此外，本手稿还将强调公开的挑战和未来建议，进一步号召不同领域的研究人员开始在这个领域开展研究。\n\
    \n## 1. 引言\n\n当正常细胞转变为肿瘤细胞时，皮肤癌就会生长，肿瘤细胞通常从癌前病变发展为恶性肿瘤。最常见的癌症类型是皮肤癌，非黑色素瘤和黑色素瘤是皮肤癌的两大主要类别。这些癌症亚型主要根据其在皮肤层中的发育部位来区分。黑色素瘤是一种仅占所有皮肤癌类型约\
    \ 1% 的皮肤癌，但却是皮肤癌死亡的主要原因。根据国家癌症研究所和美国癌症协会的数据，2022 年美国预计将诊断出约 1918030 例癌症病例，相当于每天约\
    \ 5250 例新病例，皮肤癌将导致约 108480 例新病例和 11990 例死亡 [1]。利用机器学习方法进行的计算机视觉的最新进展，在计算机辅助诊断和检测系统方面取得了重大进展，以实现及时检测。手动筛查和目视检查长期以来一直用于诊断和识别皮肤癌疾病。皮肤科医生的图像视觉检查和检查程序耗时、主观、复杂且容易出错。这主要与皮肤病变成像的精确结构有关。为了分析、评估、检测和理解皮肤病变图像，必须清晰识别皮肤病变的像素。由于下面描述的各种问题，这可能具有挑战性\
    \ [2]。首先，输入的皮肤病变图像可能包含血管、毛发、润滑剂、气泡和额外的噪声，这可能会使分割变得困难。因为病变区域和周围皮肤之间的低对比度也使得病变的精确分割变得困难。最后，皮肤病变图像具有各种尺寸、形状、颜色和外观，这可能会限制技术实现更高准确性的潜力。这使得皮肤科医生的手动调查更具挑战性，需要使用自动计算机诊断设备来分析皮肤病变，并获得皮肤科医生在及时决策中的支持和协助。多年来，各种计算机控制技术已被用于皮肤癌的诊断和检测。在传统的医学图像分析方法中，通常使用一组低级像素处理算法。一般来说，皮肤病变图像的主要处理方法（如预处理、分割、特征提取和分类）已被描述为皮肤癌检测和诊断的一部分，图\
    \ 1 表示皮肤癌分析中涉及的步骤流程图。\n\n本文的主要贡献是向新手介绍皮肤病变计算机辅助诊断领域。它概述了各位学者的各种贡献，指出了它们的局限性和优势。此外，还在公共数据集上对所考虑的方法进行了比较考察，以确定其应用范围。此外，该领域还存在一些公开的难题，需要医学图像处理研究界立即关注。\n\
    \n其余文章的组织如下：第 2 节讨论与皮肤病变诊断相关的并发症。文献中提出了各种图像获取、预处理、病变分割和分类算法的具体内容。第 3 节考察了文献中概述的皮肤病变图像图像获取、预处理、分割和分类的多种方法的细节。第\
    \ 4 节提到了皮肤癌模型评估的数据集。第 5 节用示例展示了最新分割和去噪方法的实验结果和分析。第 6 节强调了一些未解决的问题，随后第 7 节讨论了该领域进一步研究的构思。最后，第\
    \ 8 节提供结论。\n\n## 2. 皮肤病变诊断中的并发症\n\n不同的图像格式和来源导致了皮肤病变诊断中的困难。人类的皮肤颜色因人而异，这使得皮肤检测成为一项复杂且具有挑战性的操作。图\
    \ 2 说明了皮肤病变图像的不同视觉属性存在多种问题，包括（a）血管（b）低对比度（c）皮肤图像中的尺子（d）气泡（e）毛发伪影和（f）非均匀边界。\n\n\
    病变的位置、大小和形状差异巨大。为了进行准确分析，大多数图像分析算法都需要图像预处理。在图像获取过程中，称为噪声的伪影会被添加到图像中。噪声和伪影的存在可能会影响识别病变图像的能力。其中包括毛发伪影、气泡和血管等示例。在预处理阶段，要为直观的不对称预测获得皮肤病变边界的精确图像可能很困难。附近组织可能偶尔存在低对比度，这增加了困难。\n\
    \n## 3. 皮肤病变图像分析技术\n\n借助当今的数字皮肤镜仪器，皮肤病变图像可以存储在计算机上并进行访问。有些系统甚至似乎能够执行计算机辅助诊断（CAD）。由于使用\
    \ CAD 方法的皮肤镜诊断的准确性取决于技能，计算机辅助诊断系统将帮助较少有经验的皮肤科医生提升能力，同时减少个体间的变异性。基于 CAD 的自动化皮肤病变图像分析的四个基本方面是预处理、分割、特征提取和分类。\n\
    \n![](img/afae8650ce702366d6d745bbf7cf0341_1_0.png)\n\n图 1. 皮肤病变图像中癌症分析涉及的基本步骤。\n\
    \n![](img/afae8650ce702366d6d745bbf7cf0341_2_0.png)\n\n图 2. 皮肤病变诊断问题的示意图：（a）血管（b）低对比度（c）尺子（d）气泡（e）毛发伪影（f）非均匀边界。\n\
    \n### 3.1. 系统综述\n\n我们在 ScienceDirect、IEEE Xplore 和 SpringerLink 上搜索了用英语撰写的文献综述和研究论文。本综述仅考虑了在妥善记录科学论文的期刊上发表的出版物。论文选择采用了以下标准：\n\
    \n- 皮肤病变图像的预处理（噪声去除和毛发去除）技术。\n- 分割和分类的传统机器学习方法。\n- 分割和分类的深度学习方法。\n- 二分类和多分类。\n\
    - 不同的 CNN 模型。\n\n![](img/afae8650ce702366d6d745bbf7cf0341_2_1.png)\n\n图 3. 使用\
    \ PRISMA 流程图进行系统综述。\n\n"
