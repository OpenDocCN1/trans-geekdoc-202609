    both joint and parallel training, supporting the model in achieving quicker convergence.
    Faster training with a smaller footprint is one of the benefits. It does, however,
    have an Xception Network which stands for Extreme Inception that can boost the
    inception module’s deviation limit [14].


    +   - **ResNet**: This architecture is also called a deep residual network with
    numerous residual networks that serve as the design’s fundamental elements for
    constructing a complete continuous network. These remaining modules are stacked
    one on top of the other [15]. Deeper neural networks are constructed without the
    use of shortcuts by stacking new layers on top of each other. This architecture
    incorporates hundreds of residual layers which are used for training the network
    and improving performance. It is less computational than other networks that have
    been proposed. ResNet-X stands for a residual deep neural network with X layers,
    such as ResNet-152 refers to a Resnet that has 152 levels.


    +   - **ResNeXt**: It is an evolution of the Inception Network in that it incorporates
    cardinality to utilize the concept of divide, transform, and merge in a strong
    yet simple manner. The number of transformations in a set is what determines its
    cardinality. The split, transform and merge block integrated VGG and GoogleNet
    by restricting resolution to 3*3 filters [16]. It also made use of residual learning
    to speed up network convergence on both the deep and wide scales. Adding more
    cardinality improves performance enormously, leading to a brand-new, better-performing
    model.


    +   - **Deep reinforcement learning**: This network has been thoroughly trained
    from the base, starting with random behavior and progressing to a truth knowledge
    base gained through experience. It’s a mixture of reinforcement and deep learning
    that uses fewer computer data and resources [17]. The representative may train
    from its surroundings and apply what it has learned to any sequential choice task,
    such as image analysis. AlphaGo and AlphaGo Zero are two examples. Due to the
    application of far more principled algorithms, AlphaGo Zero takes far less computing
    than prior versions while still performing at a much higher level.


    +   - **Advanced inception network**: All three versions of Inception i.e V3,
    V4, and ResNet are part of this network. They are enhanced versions of Googlenet,
    Inception-V1, and Inception-V2, respectively. Due to Inception-lowering V3’s processing
    costs, deep networks no longer have to sacrifice generality. Large filters were
    replaced with small and asymmetrical filters by employing 1 × 1 convolution as
    the bottleneck (1 × 7 and 1 × 5).


    +   - **DenseNet**: DenseNet, like ResNet, is a neural network designed to address
    the vanishing gradient issue. While ResNet uses additive identity transformations
    to keep track of information, DenseNet uses cross-layer connections and feeds
    the information forward in a feed-forward manner. Previous layers feature maps
    as inputs into future ones, taking advantage of dense blocks [18].


    +   - **Xception**: Deeply separable convolution is used in this extreme Inception
    design. The original inception block is expanded to control computational complexity,
    and separate spatial dimensions (e.g., 1 × 1, 5 × 5, 3 × 3) are substituted with
    3 × 3 and 1 × 1 convolutions. The network’s computational efficiency improves
    due to the separation of the spatial and feature [14].


    +   - **Squeeze and Excitation Network**: Hu et al. outlined in their paper, the
    Squeeze and Excitation Network (SE-Network). To aid with object recognition, they
    devised a new building element called a “channel block.” Before the convolution
    stage in any CNN design, this layer is required. In this paradigm, the two most
    important processes are squeeze and excitation. When compared to the Squeeze operation,
    the convolution kernel gathers local information but does not consider feature
    context. By generating feature map statistics, the network has evolved into a
    more powerful architecture, making it particularly useful for low bandwidth devices
    such as mobile phones [19].


    +   - **Residual Attention Neural Network (RAN)**: Wang et al. develop this Network
    to enhance feature representation. Its purpose of adding attention to CNN was
    to develop an object-aware network. With the attention module, RAN is a feedforward
    CNN built from residual blocks. The attention module’s trunk and mask branches
    learn from the bottom up. The attention module integrates two independent learning
    algorithms that combine fast feedforward processing and top-down attention feedback
    [20].


    +   - **Convolutional Block Attention Module (CBAM)**: CBAM created by Woo et
    al., is attention based CNN that sequentially implies attention maps through utilizing
    feature map attention and spatial attention to discover the precise feature maps,
    as opposed to the Squeeze and Excitation Network, which still perceives feature-maps
    in classification task without taking the spatial information of the actual object
    into account [21].


    +   - **MultiResUNet**: Ibtehaz and Rahman introduced an enhanced MultiResUNet
    that is suggested to detect tissue from biomedical images. The ResPath component
    improves communication between encoding and decoding blocks and reduces semantic
    inconsistencies, whereas the anti-aliased convolution and MultiRes modules were
    built to be sensitive to high-frequency semantics, such as tissue borders. During
    the training phase, a mixed loss function is employed to concentrate on irregular
    or discontinuous boundaries [22].


    +   - **INet**: Khedkar et al. iNet, which was stimulated by an Inception, collects
    different features by adding the feature-maps of the prior layers. INet employs
    max-poolings with stride 1 i.e., two overlapped max polling, to extract the sharpest
    features. INet, which expands receptive fields by gradually growing the size of
    the kernel in convolutional layers rather than downsampling [23].


    # 4. Datasets for model evaluation of skin cancer


    +   - **DERMOFIT project datasets**: The lesion images can only be used by academic
    researchers and are owned by the University of Edinburgh. The RGB images were
    taken with a superior camera in a regulated environment. There are a total of
    1300 photos in this category: Actinic Keratosis (AK) sample 45, SCC sample 88,
    Sk sample 257, IEC sample 78, BCC sample 239, Mole (ML) sample 331, Pyogenic Granuloma
    (PYO) sample 24, Haemangioma (VASC) has 96 samples, Dermatofibroma (DF) has 65
    and Melanoma (MEL) 76 samples.'
