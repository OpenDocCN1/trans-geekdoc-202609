    # 3.1. Systematic review


    We have searched ScienceDirect, IEEE Xplore, and SpringerLink for literature reviews
    and research papers written in the English language. Only publications appearing
    in journals that properly recorded scientific proceedings were considered for
    this review. The following criteria were used for the selection of the papers:


    +   - Preprocessing (Noise removal and Hair removal) techniques of skin lesion
    images.

    +   - The traditional machine learning method of segmentation and classification.

    +   - The deep learning method of segmentation and classification.

    +   - Binary and multi-class classification.

    +   - A different model of CNN.


