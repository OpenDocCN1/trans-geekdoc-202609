  mdcn: "\n\n- 分水岭分割方法：这种分割方法结合了基于区域和基于边缘的分割技术。这种分水岭分割方法基于微分函数的工作原理。\n\n- K-Means聚类分割：在此方法中，一组数据被分为k个数值组。它从单一数据集中创建k个不同的组。K-means算法可分为两部分：首先，它识别k个质心；其次，它将每个点移动到该簇最近的质心。最近质心与最近点之间的距离可以通过多种方式计算。欧氏距离是最广泛采用的方法之一。Eq.\
    \ (3)显示了计算欧氏距离的公式。其中K为簇的总数。\n\nd = || p(x, y) – c_k ||\n\n### 3.3.2. 基于深度学习的分割技术\n\
    \n在图像处理中，图像分割是一项困难的任务，使用深度学习算法已得到极大改进。研究人员提出了基于深度学习的方法，图像可以使用这些技术有效分割。这些架构包括深度卷积神经网络、U-Net、完全卷积残差网络等。以下将对其进行更详细描述。\n\
    \n- CNN架构：卷积神经网络（CNN）是多层感知机的二维数据处理变体。CNN是一种深度神经网络，因为其网络深度大且图像数据应用广泛。CNN的设计与一般神经网络相似；卷积神经网络中的神经元具有偏置、激活和权重函数。图4解释了CNN的架构，其中包括带有ReLU激活的卷积层、用于特征提取的池化层，然后是带有softmax激活的完全连接层用于分类。特征提取过程分为三个阶段：卷积、激活和池化。从输入图像中提取这些特征，从而提高准确性。CNN的层使模型计算高效，并且由于其能够处理大量数据集，因此优于其他方法。每个滤波器基于输入大小具有适中的相等高度、宽度和深度。卷积可以通过使用合适的滤波器来完成。卷积是一种数学过程，通过组合两个函数x和y创建第三个函数（z），如Eq.\
    \ (4) [3]所示。\n\nz (n)def = x ( n ) * y ( n ) = \n\\sum_{\\eta=-\\infty}^{\\infty}\
    \ x (\\eta) g ( n - \\eta)\n\n- U-Net架构：该设计使用完全卷积网络构建。除了卷积层外，该网络的编码器和解码器均使用卷积层；编码器和解码器部分分别具有池化层和上采样层。在编码器和解码器组件之间，存在快捷链接。一些研究人员已使用此设计来分割皮肤病变。该架构用于在分割皮肤病变照片时预测每个像素的可能性。他们在编码器分支的最底层使用了扩展卷积来修改U-Net架构，从而得到skinNet系统。\n\
    \n- 深度残差网络（DRN）：采用跳跃连接穿越多个卷积层以构建金字塔结构的ANN称为深度残差网络。卷积层主导该结构。一种使用深度残差网络来分割和分类皮肤病变图像的FCRN技术。层数超过50层的DRN正在努力获得更详细和独特的特性。该系统使用ISBI\
    \ 2016数据集实现分割准确性。实现深度残差网络设计需要大量计算资源。这可能限制该架构在现实场景中的实用性。\n\n![](img/afae8650ce702366d6d745bbf7cf0341_5_0.png)\n\
    \n- **FCN:** 使用卷积神经网络，FCN（完全卷积网络）将视觉像素转换为像素类别。FCN是由卷积层和池化层组成的分层结构。为了分割皮肤病变，采用了基于并行集成（PI）的多阶段FCN技术来分割病变。该技术用于在分割后改善分割皮肤病变的边缘。在ISBI\
    \ 2016数据集上评估时，该方法对黑色素瘤的分割准确率为94.70%，Dice系数为92.03%；对非黑色素瘤的准确率为95.71%，Dice系数为90.97%。DFRCN是一种专门为皮肤镜图像分割开发的FCN类型，是修改后的FCN，用于皮肤镜图像分割，可提供改进的性能。为了训练和分割皮肤病变，将卷积与FCN网络相结合。这提高了网络感受野的可见性。另一方面，FCN模型倾向于分割，这可能导致使用该数据集时输出粗糙的分割结果。\n\
    \n- **CDCNN:** 该模型包含两部分：卷积网络路径，类似于CNN，它检索图像的特征层次结构，复杂度从0到1。第二部分是反卷积网络路径，方向相反，称为反卷积网络。它改变聚合特征，并将分割图分辨率从0提高到1。两个网络都用于提取区别特征。在生成最终输出之前，使用反卷积层平滑分割图[4]。可以使用称为RefineNet的网络进行皮肤镜皮肤病变图像分割。该网络有多条路径和许多密集卷积层。基于CDCNN的系统运行时间较长。当训练数据不足时，它们仍然不够精确且存在局限性。这些方法使皮肤病变的分割和分析更加容易。然而，这类方法仍然需要大量工作来调整许多不同的特征和预处理步骤，这耗费大量时间和精力。\n\
    \n此外，表3给出了分割技术的摘要，以及预处理、技术、数据集、描述和性能指标的使用情况。\n\n## 3.4. 皮肤病变分类技术\n\n为了分析皮肤癌，可以对病变图像进行分类以帮助检测皮肤癌。皮肤病变图像可以识别多种类型的皮肤癌。这些分为两种类型：恶性和良性。基底细胞癌有多种类型：日光性角化病、鳞状细胞癌、默克尔细胞癌、脂溢性角化病、血管病变、非典型痣和黑色素瘤。黑色素瘤是这些病变类别中最严重的皮肤癌类型，因为它是恶性病变。在本部分中，我们讨论了传统和基于深度学习的分类方法。\n\
    \n### 3.4.1. 传统分类技术\n\n其中大多数是旧的分类器，仍然依赖于从图像中收集特征并将其馈送到分类器以确定皮肤癌类型的传统方法。近年来，各种传统方法已实现智能化。这些算法包括KNN、朴素贝叶斯算法、SVM和ANN分类器等方法。\n\
