    联合训练和并行训练，支持模型实现更快收敛。更小的占用空间下实现更快训练是其中的一项优势。然而，它确实拥有一个 Xception Network（即 Extreme
    Inception），可提升 inception 模块的偏差极限 [14]。


    - **ResNet**：该架构也称为深度残差网络，包含大量作为设计基础元素的残差网络，用于构建完整的连续网络。这些残差模块彼此堆叠 [15]。通过在彼此之上堆叠新层来构建更深的神经网络，而不使用快捷连接。该架构包含数百个残差层，用于训练网络和提高性能。与其他提出的网络相比，其计算量更小。ResNet-X
    表示带有 X 层的残差深度神经网络，例如 ResNet-152 指的是具有 152 层的 ResNet。


    - **ResNeXt**：它是 Inception Network 的演进版本，通过引入基数以强大而简单的方式利用分割、转换和合并的概念。一组中变换的数量决定了其基数。分割、转换和合并块通过将分辨率限制为
    3 × 3 滤波器来整合 VGG 和 GoogleNet [16]。它还利用残差学习来加快深度和宽度上网络的收敛。增加更多基数可极大地提高性能，从而产生一个全新的、性能更好的模型。


    - **Deep reinforcement learning**：该网络从基础开始接受了彻底训练，从随机行为开始，逐步发展为通过经验获得的真实知识库。它是强化学习与深度学习的混合体，使用更少的计算机数据和资源
    [17]。代表模型可从其环境中进行训练，并将所学应用于任何序列选择任务，例如图像分析。AlphaGo 和 AlphaGo Zero 是两个示例。由于应用了更加原则化的算法，AlphaGo
    Zero 所需的计算量远小于早期版本，同时性能仍处于更高水平。


    - **Advanced inception network**：Inception 的三个版本（即 V3、V4 和 ResNet）均属于该网络。它们分别是
    Googlenet、Inception-V1 和 Inception-V2 的增强版本。由于 Inception 降低了 V3 的处理成本，深度网络不再需要牺牲通用性。通过将
    1 × 1 卷积作为瓶颈（1 × 7 和 1 × 5），大滤波器被小的非对称滤波器所取代。


    - **DenseNet**：DenseNet 与 ResNet 类似，是一种旨在解决梯度消失问题的神经网络。虽然 ResNet 使用加法恒等变换来跟踪信息，但
    DenseNet 使用跨层连接并以前馈方式向前传递信息。以前层的特征图作为未来层的输入，利用密集块 [18]。


    - **Xception**：这种极端的 Inception 设计使用了深度可分离卷积。原始 inception 块被扩展以控制计算复杂度，并用 3 × 3
    和 1 × 1 卷积替代独立的空间维度（例如，1 × 1、5 × 5、3 × 3）。由于空间与特征的分离，网络的计算效率得到提高 [14]。


    - **Squeeze and Excitation Network**：Hu 等人在其论文中概述了 Squeeze and Excitation Network（SE
    网络）。为了辅助物体识别，他们设计了一种名为“通道块”的新构建元素。在任何 CNN 设计的卷积阶段之前，都需要此层。在此范式中，两个最重要的过程是挤压和激活。与挤压操作相比，卷积核收集局部信息但不考虑特征上下文。通过生成特征图统计信息，网络已演变为更强大的架构，使其特别适用于低带宽设备，例如手机
    [19]。


    - **Residual Attention Neural Network (RAN)**：Wang 等人开发了该网络以增强特征表示。向 CNN 添加注意力的目的是开发一个感知对象的网络。借助注意力模块，RAN
    是由残差块构建的前馈 CNN。注意力模块的主干分支和掩码分支自下而上进行学习。注意力模块整合了两个独立的学习算法，结合了快速前馈处理和自顶向下的注意力反馈
    [20]。


    - **Convolutional Block Attention Module (CBAM)**：Woo 等人创建的 CBAM 是一种基于注意力的 CNN，它通过利用特征图注意力和空间注意力顺序应用注意力图来发现精确的特征图，而与
    Squeeze and Excitation Network 不同，后者在分类任务中仍然感知特征图而不考虑实际对象的空间信息 [21]。


    - **MultiResUNet**：Ibtehaz 和 Rahman 引入了一种增强型 MultiResUNet，用于从生物医学图像中检测组织。ResPath
    组件改善了编码块和解码块之间的通信并减少语义不一致性，而抗混叠卷积和 MultiRes 模块则旨在对高频语义（例如组织边界）敏感。在训练阶段，采用混合损失函数来关注不规则或不连续的边界
    [22]。


    - **INet**：Khedkar 等人提出的 iNet（受 Inception 启发）通过添加前几层的特征图来收集不同特征。INet 使用步幅为 1 的最大池化（即两个重叠的最大池化）来提取最清晰的特征。INet
    通过逐渐增大卷积层中的核大小而不是下采样来扩展感受野 [23]。


