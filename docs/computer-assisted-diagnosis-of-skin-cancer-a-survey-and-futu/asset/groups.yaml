    +   Segmentation\n+   Classification\n\nABSTRACT\n\nSkin cancer is amid the most\
    \ frequent types of cancer, accounting for approximately 2 to 3 million cases\
    \ being diagnosed each year worldwide. Abnormal cell development on the skin causes\
