    \ instinctive, and tedious task. Computer Aided Diagnosis (CAD) techniques can\
    \ assist doctors to enhance their investigation skills and reduce the time it\
    \ takes to get a precise diagnosis. Furthermore, the lack of advanced, user-friendly\
    \ CAD techniques has raised serious concerns about the noninvasive, precise, and\
    \ rapid identification of diseases. CAD systems can help to make an early diagnosis\
    \ of skin lesions to plan timely treatment schedules for the patients to increase\
    \ their survival rates. However, due to the distinctive and complex properties\
    \ of skin lesion images, examination of skin lesion images still poses significant\
    \ difficulties. The motivation behind this study is to discuss several preprocessing,\
    \ segmentation, and classification strategies for analyzing skin lesions to differentiate\
    \ between cancerous and non-cancerous images. The primary goal is to provide an\
    \ overview for naive researchers to commence their research in this field. Moreover,\
    \ this manuscript will also highlight open challenges and future recommendations\
    \ which further calls the distinct researchers to begin their research in this\
    \ domain.\n\n# 1. Introduction\n\nSkin cancer grows when normal cells are converted\
    \ into tumor cells that generally grow from a precancerous lesion to a malignant\
    \ tumor. The most common type of cancer is skin cancer, non-melanoma and melanoma\
    \ are the two main categories of skin cancers. These cancer subtypes are mostly\
    \ distinguished by where they develop in the skin layers. Melanoma is the type\
    \ of skin cancer that records around only one percent of all types of skin cancers,\
    \ but that is the dominant reason for death from skin cancer. According to the\
    \ National Cancer Institute and the American Cancer Society, there would be around\
    \ 19,18,030 cancer cases diagnosed, equating to around 5250 new cases per day,\
    \ and skin cancer would cause 1,08,480 new cases and 11,990 deaths in the United\
    \ States in 2022 [1]. Recent advancements in computer vision using machine learning\
    \ approaches have resulted in significant advancements in computer-assisted diagnostic\
    \ and detection systems for timely detection. Manual screening and visual inspection\
    \ have long been used to diagnose and identify skin cancer disorders. Dermatologists'\
    \ procedures for visual examination and inspection of images are time-consuming,\
    \ subjective, complicated, and mistake-prone. This is mostly related to the precise\
    \ structure of skin lesion imaging. The pixels of the skin lesions must be recognized\
    \ clearly in the direction of pursuing analysis, evaluation, detection, and comprehension\
    \ of skin lesion images. Due to various issues described below, this may be challenging\
    \ [2]. In the beginning, inputted skin lesion images"
