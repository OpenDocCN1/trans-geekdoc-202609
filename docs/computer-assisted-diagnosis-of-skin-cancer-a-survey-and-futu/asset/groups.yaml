    Various computer-controlled technologies have been utilized for the diagnosis
    and detection of skin cancer throughout the years. A set of low-level pixel processed
    algorithms are often used in the traditional approach to medical image analysis.
    In general, main processing approaches such as preprocessing, segmentation, feature
    extraction, and classification of skin lesions images have been described as part
    of skin cancer detection and diagnosis, and Fig. 1 represents the flow diagram
    of the steps involved in the analysis of skin cancer.


    This paper’s main contribution is to introduce newcomers to the area of computer-aided
    diagnosis of skin lesions. It presents an outline of various benefits made by
    various scholars, noting their limits and benefits. Furthermore, a comparison
    examination of the methodologies under consideration was done on a public dataset
    to determine the extent of their application. Furthermore, some of the open difficulties
    in this sector have been noted, which dataset the instantaneous consideration
    medical image processing research community.


    The remaining article is organized as follows: Section 2 discusses the complication
    associated with skin lesion diagnosis. The specifics of various image acquisition,
    preprocessing, lesion segmentation, and classification algorithms are proposed
    in the literature. The details of several methods for image acquisition, pre-processing,
    segmentation, and classification for skin lesion images outlined in the literature
    have been examined in Section 3. Datasets for model evaluation of skin cancer
    are mentioned in Section 4. The experimental findings and analysis of the most
    recent segmentation and denoising methods are shown in Section 5 with illustrations.
    A few unresolved issues are highlighted in Section 6 followed by Section 7 then
    discusses ideas for further study in this field. Finally, Section 8 provides the
    conclusion.


    # ## 2. Complications in the diagnosis of skin lesions


    The different image forms and sources are responsible for the difficulties in
    diagnosing skin lesions. Human skin color can seem very different from person
    to person, making skin detection a complicated and challenging operation. Fig.
    2 illustrates the different visual properties of skin lesions’ images present
    several issues, including (a) blood vessels (b) low contrast (c) ruler in skin
    images (d) Bubbles (e) hair artifacts, and (f) non-uniform border.


    The location, size, and shape of lesions vary enormously. For accurate analysis,
    the majority of image analysis algorithms necessitate image pre-processing. During
    image acquisition, artifacts called noise are added to the images. The presence
    of noise and artifacts may affect the ability to identify lesion images. Hair
    artifacts, bubbles, and blood vessels are among the examples. It can be difficult
    to obtain precise images of the border of skin lesions during the preprocessing
    stage for straightforward asymmetry prediction. Low contrast from nearby tissues
    might occasionally exist, which adds to the difficulties.


    # ## 3. Analysis techniques for skin lesion images


    With today’s digital dermoscopic instruments, skin lesion images may be stored
    and accessed on a computer. Some systems even appear to be capable of doing computer-assisted
    diagnostics (CAD). Because the accuracy of dermoscopy diagnosis utilizing CAD
    approaches is dependent on skill, computer-aided diagnostics systems will assist
    fewer dermatologists’ competence while reducing


