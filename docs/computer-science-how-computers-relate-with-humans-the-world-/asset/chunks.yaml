    industries. Chapter  4 Logic Programming And Heuristic Algorithms  Logic programming
    is a type of programming paradigm which is largely based on formal logic. Any
    program written in a logic programming language is a set of sentences in logical
    form, expressing facts and rules about some problem domain. Rules are written
    as logical clauses with a head and a body; for instance, "H is true if B1, …,Bn
    are true. PROLOG ( PROgramming in LOGic) has been used extensively in natural
    language processing and other AI programs. The declarative reading of logic programs
    can be used by a programmer to verify their correctness. Moreover, logic-based
    program transformation techniques can also be used to transform logic programs
    into logically equivalent programs that are more efficient. In the Prolog family
    of logic programming languages, the programmer can also use the known problem-solving
    behaviour of the execution mechanism to improve the efficiency of programs. Logic
    programming can be viewed as controlled deduction. An important concept in logic
    programming is the separation of programs into their logic component and their
    control component. With pure logic programming languages, the logic component
    alone determines the solutions produced. The control component can be varied to
    provide alternative ways of executing a logic program. This notion is captured
    by the slogan Algorithm = Logic + Control where "Logic" represents a logic program
    and "Control" represents different theorem-proving strategies. Other logic programming
    language families include, Answer Set Programming (ASP) and Datalog. In all of
    these languages, rules are written in the form of clauses: H :- B1, …, Bn. and
    are read declaratively as logical implications: H if B1 and … and Bn. H is called
    the head of the rule and B1, ..., Bn is called the body. Facts are rules that
    have no body, and are written in the simplified form: H. In ASP and Datalog, logic
    programs have only a declarative reading, and their execution is performed by
    means of a proof procedure or model generator whose behaviour is not meant to
    be under the control of the programmer. However, in the Prolog family of languages,
    logic programs also have a procedural interpretation as goal-reduction procedures:
    to solve H, solve B1, and ... and solve Bn. Logic is very important for AI as
    flexible, intelligent agents need to know facts about the world in which they
    operate - declerative knowledge and procedural knowledge - how to accomplish tasks.
    e.g., procedural - don''t drink poison; declerative - drinking poison will kill
    you, and you want to stay alive. Every way we can represent the world is a model,
    thus any model where the statement H is true, and B1, ..., Bn is true, we can
    infer a condition based on those two statements. However, if we can infer a counter
    model where the premises are true, but the condition isn''t, the argument is invalid.
    Logic Programming is a method that computer scientists are using to try to allow
    machines to reason because it is useful for knowledge representation. In logic
    programming, logic is used to represent knowledge and inference is used to manipulate
    it. When Programming artificial intelligence projects two good languages for AI
    programming are Prolog, which uses declarative programming and LISP, as programs
    can be treated as data. What Are Heuristic Algorithms? In computer science, artificial
    intelligence, and mathematical optimization, a heuristic is a technique designed
    for solving a problem more quickly when classic methods are too slow, or for finding
    an approximate solution when classic methods fail to find any exact solution.
    This is achieved by trading optimality, completeness, accuracy, or precision for
    speed. In a way, it can be considered a shortcut. A heuristic function, ranks
    alternatives in search algorithms at each branching step based on available information
    to decide which branch to follow. For example, consider the problem of four 6-sided
    cubes, and each side of the cube is painted in one of four colours. The four cubes
    are placed next to one another and the problem lies in arranging them so that
    the four available colours are displayed whichever way the 4 cubes are viewed.
    The problem can only be solved if there are at least four sides coloured in each
    colour and the number of options tested can be reduced using heuristics if the
    most popular colour is hidden by the adjacent cube. So what is the difference
    between solution algorithms and heuristics? While a heuristic algorithm that does
    not guarantee a correct solution,a solution algorithm guarantees a correct solution.
    The "guarantee" is the key phrase. The Gaussian Elimination method taught to solve
    a system of linear equations is a "solution algorithm" in that it guarantees that
    you will always give the right answer. Solution algorithms to a problem can be
    faster or slower, but they all have the same guarantee of being correct. However,
    A "good" heuristic is one that will get you either the correct, or a good enough
    solution most of the time. Heuristics are used when either there is no known solution
    algorithm, or you are interested in something faster than the known solution algorithm.
    Imagine that you see a set of boxes on the other side of the room, and you have
    to guess which is the heaviest. A fair heuristic would be to guess that the largest
    box is the heaviest. The real answer could be found by actually weighing the boxes.
    However, it may be either that weighing the boxes is impossible, or you do not
    want to spend  the time to weigh the boxes. In those cases, you would use the
    heuristic of guessing that the largest is the heaviest. The key point about a
    heuristic is that there is no way of knowing when the solution you get is wrong.
    If there was, you could create a self-correction loop and get the right solution,
    and that would mean you have a solution algorithm. But like with the boxes, just
    by looking at them, you would never know when the largest is not the heaviest.
    With this box weight heuristic, usually, and under a lot of conditions, you would
    be right. But just by looking at them you could never know when the largest is
    full of pillows, and the smallest is full of lead. You would never know when you
    were wrong. The best thing to do in practice is to do an empirical statistical
    study of the typical situation and the typical answer you get. Note that is different
    from an "approximate solution algorithm" that guarantees that the solution is
    correct to within some degree. Weighing the boxes on a cheap scale is an approximate
    solution algorithm. Guessing their weight by their size is a heuristic. When confronted
    with solving sets of non-linear equations, or solving NP problems in general,
    or solving problems like face recognition that are too poorly defined to even
    be formally stated as an NP problem, the only way to get a solution in practice
    is through heuristics. You then just have to live with the fact that you will
    never know when you are way off. Heuristic Search, is an integral part of Artificial
    Intelligence. Different techniques include Constraint Satisfaction Problems, Hill
    Climbing, and Simulated Annealing Antivirus software for example, often uses heuristic
    rules for detecting viruses and other forms of malware. Heuristic scanning looks
    for code and/or behavioral patterns common to a class or family of viruses, with
    different sets of rules for different viruses. If a file or executing process
    is found to contain matching code patterns and/or to be performing that set of
    activities, then the scanner infers that the file is infected. The most advanced
    part of behavior-based heuristic scanning is that it can work against highly randomized
    self-modifying/mutating (polymorphic) viruses that cannot be reliably detected
    by simpler string scanning methods. Heuristic scanning has the potential to detect
    future viruses without requiring the virus to be first detected somewhere else,
    submitted to the virus scanner developer, analyzed, and a detection update for
    the scanner provided to the scanner''s users. Furthermore, suppose you are tasked
    with building an AI system to play a general game (chess for example), if you
    applied the standard methods of minimax and alpha beta pruning you would be tasked
    with generating a heuristic function to determine the relative “strength” of a
    move. Chapter  5 Machine Learning & Artificial Intelligence Machine Learning (ML)
    is a data analytics technique that teaches computers to do what comes naturally
    to humans and animals: learn from experience. Machine learning algorithms use
    computational methods to “learn” information directly from data without relying
    on a predetermined equation as a model. The algorithms adaptively improve their
    performance as the number of samples available for learning increases. Deep learning
    for example, is a specialized form of machine learning. When should machine learning
    be used? Consider using machine learning when you have a complex task or problem
    involving a large amount of data and lots of variables, but no existing formula
    or equation. For example, machine learning is a good option if you need to handle
    situations like these: Machine learning algorithms are used in the applications
    of email filtering, detection of network intruders, and computer vision, where
    it is infeasible to develop an algorithm of specific instructions for performing
    the task. Machine learning is closely related to computational statistics, which
    focuses on making predictions using computers. The study of mathematical optimization
    delivers methods, theory and application domains to the field of machine learning.
    Data mining is a field of study within machine learning, and focuses on exploratory
    data analysis through unsupervised learning. In its application across business
    problems, machine learning is also referred to as predictive analytics. Machine
    Learning applies Artificial Intelligence (AI) that provides systems the ability
    to automatically learn and improve from experience without being explicitly programmed.
    It focuses on the development of computer programs that can access data and use
    it to learn for themselves. The process of learning begins with observations or
    data. The primary aim is to allow the computers learn automatically without human
    intervention or assistance and adjust actions accordingly. There are many different
    types of machine learning algorithms, with hundreds published each day, and they’re
    typically grouped by either learning style (i.e. supervised learning, unsupervised
    learning, semi-supervised learning) or by similarity in form or function (i.e.
    classification, regression, decision tree, clustering, deep learning, etc.). Regardless
    of learning style or function, all combinations of machine learning algorithms
    consist of the following: Representation (a set of classifiers or the language
    that a computer understands) Evaluation (aka objective/scoring function) Optimization
    (search method; often the highest-scoring classifier, for example; there are both
    off-the-shelf and custom optimization methods used) Machine learning enables analysis
    of massive quantities of data. While it generally delivers faster and more accurate
    results in other to identify profitable opportunities or dangerous risks, it may
    also require additional time and resources to train it properly. Combining machine
    learning with AI and cognitive technologies can make it even more effective in
    processing large volumes of information. So how do machines learn? Well, the simpler
    answer is, just like humans do. First, we receive the knowledge about a certain
    thing and then keeping this knowledge in mind, we are able to identify the thing
    in the future. Also, past experiences help us in taking decisions accordingly
    in the future. Our brain trains itself by identifying the features and patterns
    in knowledge/data received, thus enabling itself to successfully identify or distinguish
    between various things. Similarly, we feed knowledge/data to the machine, this
    data is divided into two parts namely, training data and testing data. The machine
    learns the patterns and features from the training data and trains itself to take
    decisions like identifying, classifying or predicting new data. To check how accurately
    the machine is able to take these decisions, the predictions are tested on the
    testing data. There are different approaches to getting machines to learn, from
    using basic decision trees to clustering to layers of artificial neural networks
    (the latter of which has given way to deep learning), depending on what task you’re
    trying to accomplish and the type and amount of data that you have available.
    This dynamic sees itself played out in applications as varying as medical diagnostics
    or self-driving cars. While emphasis is often placed on choosing the best learning
    algorithm, researchers have found that some of the most interesting questions
    arise out of none of the available machine learning algorithms performing to par.
    Most of the time this is a problem with training data, but this also occurs when
    working with machine learning in new domains. Research done when working on real
    applications often drives progress in the field, and reasons are twofold: Tendency
    to discover boundaries and limitations of existing methods. Researchers and developers
    working with domain experts and leveraging time and expertise to improve system
    performance. Let’s understand this with the help of a basic machine learning example:
    Consider that you want to predict whether the next day is going to be rainy or
    sunny. Generally, we will do this by looking at a combination of data like the
    weather conditions of the past few days and present data such as wind direction,
    cloud formation etc. Had it been raining for the past few days, we would predict
    that it would rain for the next day too based on the pattern and vice versa. Similarly,
    we feed the past few days’ weather data along with the present data such as wind
    direction, cloud formation etc. to the machine, and based on the data provided,
    the machine will analyze the patterns and eventually predict the weather for the
    next day. Machines that learn are useful to humans because, with all of their
    processing power, they’re able to more quickly highlight or find patterns in big
    (or other) data that would have otherwise been missed by human beings. Machine
    learning is a tool that can be used to enhance humans’ abilities to solve problems
    and make informed inferences on a wide range of problems, from helping diagnose
    diseases to coming up with solutions for global climate change. Machine Learning
    is an application of AI. It is seen as a subset of artificial intelligence. One
    definition of AI is that “It is the study of how to train the computers so that
    computers can do things which at present human can do better.” Therefore It is
    an intelligence where we want to add all the capabilities to machine that human
    contain. Machine learning algorithms build a mathematical model of sample data,
    thus "training data", in order to make predictions or decisions without being
    explicitly programmed to perform the task. It uses two types of techniques: supervised
    learning, which trains a model on known input and output data so that it can predict
    future outputs, and unsupervised learning, which finds hidden patterns or intrinsic
    structures in input data. Supervised learning uses classification and regression
    techniques to develop predictive models. Classification techniques predict discrete
    responses—for example, whether an email is genuine or spam, or whether a tumor
    is cancerous or benign. Classification models classify input data into categories.
    Typical applications include medical imaging, speech recognition, and credit scoring.
    Use classification if your data can be tagged, categorized, or separated into
    specific groups or classes. For example, applications for hand-writing recognition
    use classification to recognize letters and numbers. In image processing and computer
    vision, unsupervised pattern recognition techniques are used for object detection
    and image segmentation. Common algorithms for performing classification include
    support vector machine (SVM), boosted and bagged decision trees, k-nearest neighbor,
    Naïve Bayes, discriminant analysis, logistic regression, and neural networks.
    Regression techniques predict continuous responses—for example, changes in temperature
    or fluctuations in power demand. Typical applications include electricity load
    forecasting and algorithmic trading. Use regression techniques if you are working
    with a data range or if the nature of your response is a real number, such as
    temperature or the time until failure for a piece of equipment. Common regression
    algorithms include linear model, nonlinear model, regularization, stepwise regression,
    boosted and bagged decision trees, neural networks, and adaptive neuro-fuzzy learning.
    So how do you decide which machine learning algorithm to use? Choosing the right
    algorithm is key—there are dozens of supervised and unsupervised machine learning
    algorithms, and each takes a different approach to learning. There is no best
    method or one size fits all. Finding the right algorithm is partly about using
    trial versions—even highly experienced data scientists can’t tell whether an algorithm
    will work without trying it out. But algorithm selection also depends on the size
    and type of data you’re working with, the insights you want to get from the data,
    and how those insights will be used. Here are some guidelines on choosing between
    supervised and unsupervised machine learning: Choose supervised learning if you
    need to train a model to make a prediction--for example, the future value of a
    continuous variable, such as temperature or a stock price, or a classification—for
    example, identify makes of cars from webcam video footage. Choose unsupervised
    learning if you need to explore your data and want to train a model to find a
    good internal representation, such as splitting data up into clusters. Business
