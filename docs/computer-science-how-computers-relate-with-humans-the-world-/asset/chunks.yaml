    ❖ 关于 LITMUX [Litmux.com](https://litmux.com/) 是一家专注于数字出版的公司 成立于 2014 年。我们对质量和创新的承诺，帮助全球企业家、商务人士和个人获得知识和教育。我们与专家研究人员和行业专业人士紧密合作，在以下核心领域传播高质量内容：商业与管理
    财务与经济 媒体与传播 社会科学与生活方式 计算机科学与信息技术 Litmux 提供能够解决紧迫需求的信息。我们是一家正在成长的公司，我们的成功来自于……当我们对某一特定主题了解不多时，我们可能会打开一本书，阅读更详细的描述，从而扩展我们已有的知识库。我们也可以用更近期的研究成果替换之前存储的信息，这类似于电脑用更新的文件覆盖旧文件。虽然基本信息相同，新文件包含的细节比之前存储的知识更丰富，便于日后回忆。他们提出的问题包括：我们如何获取外部信息？我们如何存储和处理信息？我们如何解决问题？我们的感知出现故障会导致错误，例如邮件是真实还是垃圾邮件，或肿块是癌性还是良性。分类模型将输入数据分类到不同类别中。典型应用包括医学影像、语音识别和信用评分。如果数据可以标记、分类或划分为特定组或类别，则使用分类方法。例如，手写识别应用使用分类来识别字母和数字。在图像处理和计算机视觉中，无监督模式识别技术用于目标检测和图像分割。常见的分类算法包括支持向量机
    (SVM)、提升和袋装决策树、k 近邻、朴素贝叶斯、判别分析、逻辑回归和神经网络。回归技术用于预测连续值，例如温度变化或电力需求波动。典型应用包括电力负荷预测和算法交易。常见的回归算法包括线性模型、非线性模型、正则化、逐步回归、提升和袋装决策树、神经网络以及自适应模糊学习。那么，如何选择合适的机器学习算法呢？选择正确的算法至关重要——有数十种监督和无监督机器学习算法，每种都采用不同的学习方式。没有最佳方法，也没有“一刀切”的方案。选择算法部分取决于试用版本——即使是经验丰富的数据科学家也无法在不实际尝试的情况下判断算法是否合适。但算法选择也取决于数据的规模和类型、想要从数据中获得的洞察以及这些洞察的用途。以下是关于监督学习与无监督学习选择的指南：如果您需要训练模型进行预测——例如预测连续变量的未来值（如温度或股票价格）或进行分类（如从网络视频中识别车辆品牌）——请选择监督学习。如果您需要探索数据并希望训练模型以获得良好的内部表示，例如将数据聚类，请选择无监督学习。
    业务中的机器学习优势 在大数据、人工智能和机器学习（ML）的热潮中，企业正 increasingly 关注机器学习的应用和业务价值。随着 Google、Amazon
    和 Microsoft Azure 推出云机器学习平台，人工智能和 ML 在近年来获得显著关注。常见的实例包括电子邮件服务商的“垃圾邮件”过滤，以及 Facebook
    的“图片”或“面部”标记。Gmail 通过识别特定词汇或模式来过滤垃圾邮件，而 Facebook 则自动使用图像（面部）识别技术为上传的图片打标签。AI 和
    ML 的业务优势众多。让我们来看看最重要的 ML 和人工智能业务优势，从销售和营销部门开始。简化产品营销并辅助精准销售预测 ML 以多种方式帮助企业更好地推广产品并实现准确的销售预测。其主要优势包括：大规模数据消费——无限来源
    ML 可以消费几乎无限量的综合数据，这些数据随后可用于不断根据客户行为模式调整销售和营销策略。模型训练完成后，它能够识别高度相关的变量，从而让您能够获取聚焦数据流，而无需进行冗长而复杂的集成。快速分析、预测与处理
    ML 消费数据的速度和识别相关数据的能力，使其能够在适当时机采取适当行动。例如，ML 会优化向客户提供的最佳后续优惠，使客户在正确的时机看到正确的优惠，而无需您花费时间策划和展示广告。分析过去客户行为
    与过去行为或结果相关的数据可以通过 ML 进行分析和解释，从而基于新的、不同的数据对客户行为进行更准确的预测。 精准医疗预测与诊断 在医疗行业，ML 有助于轻松识别高风险患者、做出近乎完美的诊断、推荐最佳药物并预测住院率。这些主要基于匿名患者记录数据以及其表现出的症状。精准诊断和更佳药物推荐能加速患者康复，并减少不必要的药物使用，从而在医疗行业以最低成本提升患者健康。上述应用凸显了机器学习作为顶级价值创造的数字创新趋势。此外，ML
    与人工智能使企业能够轻松从大规模、多样化的数据集中发现新趋势和模式，并自动化传统上由人工完成的业务交互分析，从而做出基于证据的决策。这使企业能够推出个性化或差异化的产品和服务。
    在人工智能项目中，建议使用以下语言进行编程： Python——因其简洁性被认为是所有 AI 开发语言的首选。Python 的语法简洁，易学，许多 AI 算法可以轻松在其中实现。相比
    Java、C++ 或 Ruby，Python 的开发时间更短。Python 支持面向对象、函数式和过程式编程范式。此外，Python 拥有大量库，例如 NumPy
    用于科学计算。 R——R 是一种高效的语言和环境，用于数据分析和处理，特别适合统计目的。使用 R，您可以轻松生成高质量的出版级图表，包括数学符号和公式。除了通用语言外，R
    还提供大量机器学习包，如 RODBC、Gmodels、Class 和 Tm，简化了机器学习算法的实现，帮助解决业务问题。 Lisp——它是最古老且最适合 AI
    开发的语言，由人工智能之父 John McCarthy 在 1958 年发明。它能够高效处理象征性信息，并以其出色的原型功能和动态创建新对象的能力著称，具备自动垃圾回收。其开发周期支持对表达式的交互评估以及在程序运行时重新编译函数或文件。多年来，Lisp
    的许多特性已被其他语言采纳，影响了其独特性。 Prolog——与 Lisp 并列的 AI 开发语言。它提供高效的模式匹配、基于树的数据结构和自动回溯功能，为构建强大而灵活的编程框架提供了惊人的能力。Prolog
    广泛用于医疗项目以及专家系统的设计。 Java——Java 也是 AI 开发的良好选择。AI 与搜索算法、人工神经网络和遗传编程密切相关。Java 的优势包括易用性、调试便利、包服务、大规模项目简化、数据可视化以及更好的用户交互。它还集成了
    Swing 和 SWT（标准窗口工具包），使界面更具吸引力和专业。 人工智能（AI）是计算机科学的一个分支，专注于创建能够像人类一样工作和反应的智能机器。机器人学也是与
    AI 密切相关的主要领域。机器人需要智能来完成诸如操作物体、导航以及子问题（如定位、运动规划和映射）等任务。例如，Sudoku 这类游戏中的问题解决可以通过构建人工智能系统来实现。
    根据管理文献，Kaplan 和 Haenlein 将人工智能分为三种类型：分析型（Human-inspired Humanized artificial intelligence）。分析型
    AI 仅具备认知智能特征，能够生成对世界的认知表示，并利用过去经验的学习来指导未来决策。人类感知型 AI 结合认知与情感智能，能够理解人类情绪并将其纳入决策过程。人类化型
    AI 具备认知、情感和社会智能的全部特征，能够自我意识并在与他人交互时保持自觉。 21 世纪，随着计算能力、数据量和理论理解的同步进步，AI 技术经历了复兴，并已成为技术行业的重要组成部分，帮助解决计算机科学、软件工程和运筹研究中的许多挑战性问题。
    推动人工智能（AI）增长的关键因素有哪些？ 由顶尖科技公司主导的创新与研究正在影响各行业。虽然技术一直是这些行业的重要元素，但 AI 正将技术推向每家公司的核心。AI
    将渗透到几乎所有程序和设备中。平台公司正在投资研究和开发，致力于让 AI 更易于企业使用。推动创新的三个关键方面是： 高级计算架构：传统 CPU 并非为机器学习设计。最快的
    CPU 可能不是训练复杂 ML 模型的最佳选择。CPU 需配合新型芯片。由于 AI 的兴起，GPU 的需求激增。曾经被视为高端游戏 PC 和工作站的一部分的
    GPU 如今已成为通用云处理器的热门选择。与 CPU 相比，GPU 拥有数万个核心，加速 ML 训练过程。即使在进行已训练模型的推理时，GPU 也正变得必不可少。从客户端设备到云虚拟机，GPU
    将成为 AI 的关键。下一项创新是 Field Programmable Gate Array（FPGA）。这些可编程芯片可在制造后现场编程以适配特定工作负载。传统
    CPU 设计用于通用计算，而 FPGA 可在出厂后现场编程，常用于训练 ML 模型的市场计算任务。公有云提供商正利用 FPGA 提供高度优化的 AI 基础设施。此外，云端裸机服务器的可用性让科学家和研究人员能够在云端进行高性能计算工作。裸机服务器为单租户提供最佳功能，而虚拟机因“吵闹邻居”问题而性能受限。Amazon
    EC2 和 IBM Cloud 等提供商提供裸机服务器，这些创新将推动航空航天和图像处理等领域的 AI 采用。 深度神经网络进展：人工神经网络（ANN）正取代传统机器学习模型，以实现更精准、更精确的版本。卷积神经网络（CNN）能够进行深度学习以监控视觉信息。当前计算机视觉的改进，如单
    Shot Multibox Detector（SSD）和生成对抗网络（GAN），正在推动图像处理的发展。例如，利用这些技术，低光照和低分辨率的视频和图像可以被提升为高清晰度。计算机视觉的持续研究正成为医疗、安保、交通等领域图像处理的基础。诸如胶囊神经网络（CapsNet）等新兴
    ML 方法将根本改变 ML 模型的部署与训练方式，能够在数据有限的情况下实现精确预测。 对历史数据集的可获性：在云平台普及之前，存储和获取信息成本高昂。因此，磁带盒和磁盘等媒介限制了信息的获取。如今，云服务公司让学术界和政府能够解锁以前受限的数据，使数据科学家能够获得大规模的历史数据集，以提高
    ML 模型的精度。模型的有效性直接取决于数据的质量和规模。为应对复杂问题，随着存储和恢复成本下降，政府机构、医疗机构和研究机构正在将非结构化信息开放供研究使用。可以预见，人工智能（AI）如今已成为炙手可热的热点，在企业、学术界和政府中迅速获得
    traction。现在，所有数据——包括创业公司、风险资本、职位空缺和学术项目等指标的增长——都集中在一起。衡量 AI 发展的一个重要指标是创业公司数量和风险资本投入。2015
    年 1 月至 2018 年 1 月，活跃 AI 创业公司增加了 2.1 倍，而所有活跃创业公司仅增长 1.3 倍。AI Index 引用了 McKinsey
    数据，展示了组织中部署的 AI 解决方案类型。北美组织主要采用的 AI 形式包括：机器人流程自动化 23%、机器学习 23%、对话界面 20%、计算机视觉
    20%、自然语言文本理解 17%、自然语言语音理解 16%、自然语言生成 11%。机器学习和 AI 实践已无处不在，体现了计算机科学中无数可能的系统设计方式，旨在实现人类所描述的认知功能。预计到
    2035 年，AI 将为英国经济贡献 8140 亿美元，年增长率在 2.5% 至 3.5% 之间。 AI 的能力是巨大的。例如，有一台机器已经掌握了复杂的围棋游戏，这在当时被认为如果不应用人工处理将极为困难。车辆现在能够自主行驶，包括由一名操作员远程驾驶的卡车。自动化部件和机器人设备的激增为
    AI 革命注入了新动力。 第 6 章 机器人技术 机器人技术涉及机器人的设计、制造、操作以及用于其控制、感知反馈和信息处理的计算机系统。这些技术用于开发能够替代人类并复制人类行为的机器。机器人可用于多种情境和目的，但今天许多机器人用于危险环境（如炸弹检测与处置）、制造流程或人类无法生存的环境（如太空）。机器人形态各异，但有些设计成模仿人类外观，以帮助接受度，使其能够模仿行走、举重、语音、认知以及人类几乎能做的所有行为。许多现代机器人受自然启发，属于生物启发机器人领域。创建能够自主运行的机器概念可追溯至古典时期，但对机器功能和潜在用途的深入研究并未在
    20 世纪前期显著发展。历史上，学者、发明家、工程师和技术人员经常假设机器人终将能够模仿人类行为并以类似人类的方式完成任务。如今，机器人是一个快速增长的领域，技术进步持续推动其研究、设计和构建，服务于家庭、商业和军事等多种实际目的。
    机器人是一门跨学科工程和计算机科学的领域，包括机械工程、电子工程、信息工程、人工智能、纳米技术等。该领域还与测绘学和生物工程相互交叉。机器人还被用作 STEM（科学、技术、工程、数学）教学工具。虽然机器人种类多样，形态和应用各异，但它们在构建时共享三大基本相似性：
    机器都有某种机械结构，即框架、形态或设计，用于实现特定任务。例如，设计用于在重泥或泥土上行驶的机器人可能会使用履带。机械部分是创作者为完成任务并应对环境物理条件的解决方案。形随功能。机器人的电气组件为机械提供动力和控制。例如，带有履带的机器人需要电力驱动履带，电力通过线路从电池或基本电路中获取。即使是燃油机器也需要电流来启动燃烧过程，因此大多数燃油机器（如汽车）都配备电池。机器人的电气部分用于运动（通过电机）、感知（通过电信号测量热量、声音、位置和能量状态）以及操作（需要电能为电机和传感器提供动力）。所有机器人都包含一定程度的编程代码。程序决定机器何时或如何执行某项操作。以履带机器人为例，它可能拥有正确的机械结构和足够的电池电力，但如果没有程序指令它将不动。程序是机器的核心，优秀的机械和电气构造若程序设计不佳，性能将极差甚至无法运行。机器人程序分为三种类型：远程控制、人工智能和混合。远程控制程序意味着机器仅在收到控制信号（通常是人手持遥控器）时执行预设命令，属于自动化范畴而非机器人学。人工智能程序使机器能够自主与环境交互，利用预设编程自行判断对象和问题的应对方式。混合程序结合
    AI 与远程控制功能。 随着机器人被设计用于特定任务，这种分类方式愈发重要。例如，许多机器人用于装配工作，其设计不易适用于其他场景，这类机器被称为“装配机器人”。对于
    seam welding，部分供应商提供完整的焊接系统，包括机器人、焊接设备以及如转台等材料搬运设施，形成一个集成单元。该集成系统被称为“焊接机器人”，尽管其独立操作单元可以适用于多种任务。一些机器人专为重载搬运设计，被称为“重型机器人”。
    当前与潜在应用有哪些？ 工业机器人：自 1960 年代以来，工业机器人使用率显著提升。根据美国机器人协会（RIA）的数据，2016 年汽车制造业是工业机器人的主要客户，占总销售额的
    52%。在汽车行业，它们可占“劳动力”的超过一半。甚至有“灯光关闭”工厂，如德州的 IBM 键盘制造工厂，早在 2003 年就已实现全自动化。 农业机器人（AgRobots）：机器人在农业中的应用紧密与
    AI 辅助精准农业和无人机概念相关。1996-1998 年的研究也证明机器人能够完成驱赶任务。目前，人工智能和机器学习正以有限方式被应用，以增强各种 robotic
    系统的能力。 AI 与机器学习在机器人中的影响有哪些？ AI 和机器学习正在影响机器人流程的四个方面，使其更高效、更盈利： 视觉——AI 帮助机器人识别前所未见的物体并以更高精度辨认已知物体。
    抓取——AI 与机器学习帮助机器人在未见过的物体上找到最佳抓取位置和姿态。 运动控制——机器学习帮助机器人在动态环境中避障、保持生产力。 数据——AI 与机器学习帮助机器人理解物理和物流数据模式，从而主动采取行动。
    AI 与机器学习在机器人应用仍处于起步阶段，但已经产生重要影响。它们将在未来数十年持续推动工业机器人自动化的边界。 软件开发基础  software development
    是无限的。技术是创新与构思的完美融合，形成平台，用于运行各种软件开发。软件可用于满足特定客户/企业需求（定制软件）、满足潜在用户的感知需求（商业和开源软件）或满足个人需求（例如计算机科学家编写软件以自动化琐碎任务）。更好地控制软件开发过程的需求催生了软件工程这一学科，旨在将工程范式的系统方法应用于软件开发过程。
    什么是软件开发？它是从构思、规格、设计、编程、文档、测试到调试的全过程，用于创建和维护应用、框架或其他软件组件。虽然软件开发本身涉及编写和维护源代码，但更广泛的定义包括从软件构思到最终呈现的所有环节，有时是按计划和有条理进行的。因此，软件开发可能包括研究、新开发、原型、修改、重用、重新工程、维护或其他任何导致软件产品的活动。
    软件项目管理有多种方法，称为软件开发生命周期模型、方法论、流程或模型。传统的水 fall 模型与更近期的敏捷开发相对。事实上，软件开发的方法学被视为规划和控制创建专用信息系统的结构。这些创新方法强调软件开发过程本身，而不涉及任何技术细节。唯一考虑的因素是进行高度集成的软件开发的适当计划。
    敏捷开发方法 在 2001 年，十七位软件开发人员在 Utah Snowbird 度假村聚会，讨论了这些轻量级开发方法，包括 Kent Beck、Ward
    Cunningham、Dave Thomas、Jeff Sutherland、Ken Schwaber、Jim Highsmith、Alistair Cockburn、Bob
    Martin 等人。他们共同发表了《敏捷软件开发宣言》。敏捷方法常被与水 fall 模型相比，但因其迭代和递增的开发方式被认为更优。这些方法可追溯至 1957
    年，适应性项目管理和自适应软件开发在 1970 年代初出现。1990 年代，为回应批评所谓的“重型”方法过于规范、计划繁琐和微管理，一系列轻量级开发方法相继出现：快速应用开发（RAD，1991
    年）；统一过程（UP）和动态系统开发方法（DSDM，1994 年）；Scrum（1995 年）；Crystal Clear 和极限编程（XP，1996 年）；特性驱动开发（1997
    年）。尽管这些方法在《敏捷宣言》发表前即已出现，但它们如今统称为敏捷软件开发方法。它们采用递增方式，先与客户讨论原型，以了解关键需求。后续原型根据之前的修改不断迭代，直至客户满意，交付更优的最终产品。其目标是保持整个开发阶段的产品质量。
    2001 年，敏捷联盟讨论并达成了若干敏捷原则。这些原则是敏捷软件开发的指导方针。与水 fall 模型相比，敏捷方法更具灵活性、速度更快、更精简、更敏感，并以人为本、更注重沟通。敏捷方法在动态环境中经过考验，能够灵活适应业务变化；它们通过有规范的定期检查提升领导力，增强团队协作；它们遵循最佳实践，帮助快速交付高质量软件。
    传统的水 fall 方法正逐渐失去 popularity，因为敏捷方法在全球范围内被越来越多的公司采用。水 fall 是一种顺序模型，将软件开发分为需求、规划、设计、构建、测试、生产和支持等预定义阶段。而敏捷方法虽也遵循线性顺序，但对项目需求变化提供了灵活空间。
    水 fall 与敏捷的区别：水 fall 将软件开发视为一个整体项目，分为多个仅出现一次的阶段；敏捷则将项目分解为多个迭代（即 sprints），每个迭代都包含设计、开发、测试等阶段，并可多次出现。水
    fall 强调严格的顺序性，而敏捷强调协作与灵活性。水 fall 适用于需求明确、变化不频繁的项目；敏捷适合需求频繁变化、需快速迭代的项目。 在质量和测试方面，水
    fall 的测试阶段位于构建之后；而敏捷则通常在编程的同一迭代中或与编程同步进行测试。水 fall 不需要客户参与，而敏捷高度重视客户满意度，全程参与客户。水
    fall 适合需求固定、变化不可预测的项目；敏捷适合需求演变、需要频繁调整的项目。 敏捷的价值观与原则：敏捷宣言由四个基础价值观和 12 条支撑原则组成，指导敏捷软件开发。每种敏捷方法都以不同方式应用这四个价值观，但都依赖它们来指导高质量、可工作软件的开发与交付。
    个人与互动重于流程与工具：价值观强调人比流程或工具更重要，因为人能够响应业务需求并推动开发。如果流程或工具主导，团队就不易适应变化，也难以满足客户需求。沟通是个人与流程之差的例证：个人导向下的沟通是自发的，需求出现时即发生；流程导向下的沟通则是预定义的、需要特定内容。
    工作软件重于文档：过去大量时间花在文档编写上，导致开发延期。敏捷不消除文档，但将其精简为开发者所需的最小内容，如用户故事。敏捷重视工作软件胜过文档。 客户协作重于合同谈判：在水
    fall 中，客户在开发开始前与产品经理详细协商需求，并在项目完成后才参与；而在敏捷中，客户贯穿整个开发过程，随时参与并提供反馈。 适应变化重于遵循计划：传统开发视变更为成本，力求避免；而敏捷认为变更始终带来价值，能够在每个迭代中调整优先级，随时加入新功能。
    十二项敏捷原则包括：通过早期且持续的软件交付实现客户满意——客户在收到定期工作软件时更满意，而非长时间等待；在开发过程中随时接受需求变更——避免因需求变更而延误；频繁交付工作软件——Scrum
    通过 sprint 确保定期交付；业务利益相关者与开发人员持续协作——对齐业务与技术决策；支持、信任并激励团队成员——激励团队更有可能交付出色工作；促进面对面交互——共
    colocated 更有效；工作软件是进度的主要度量——交付功能软件是衡量进度的最终标准；敏捷过程保持稳定的开发速度——团队建立可重复的交付节奏；关注技术细节与设计以提升敏捷性——正确技能和良好设计保持节奏、持续改进和适应变化；简洁——只做必要的事情；自组织团队促进优秀架构、需求和设计——有决策权、有动力、经常沟通并共享想法的团队能交付高质量产品；定期反思如何更高效——通过持续改进、技能提升和技术更新提升效率。
    敏捷的目标是使开发与业务需求对齐，强调人与互动胜过流程与工具。客户、开发者和测试人员持续互动。 新兴信息系统开发方法 设计和开发信息系统需要对人、过程、工具和技术进行精心管理，需要明确每个实体的角色并监督它们之间的关系。系统规模的不同导致设计与实现的复杂程度差异。多年来，专家采用多种方法帮助系统架构师和解决方案提供商完成设计与实现。这些方法不断演进，以解决开发生命周期中的常见问题。其中一个新兴方法是采用敏捷方法进行系统设计与开发。敏捷方法通过减少过度规划、繁琐文档和法律合同，转而关注快速响应变化、团队协作和有效沟通等轻量方法。有人认为敏捷只适用于小到中型系统，质疑其在大型系统中的适用性。
    信息系统开发通常涉及三类利益相关者：用户——使用系统的日常操作人员；项目赞助商——负责项目资金并确保项目完成；开发人员——通常包括系统分析师和程序员。系统分析师负责收集用户需求并编写系统规格；程序员根据规格实现系统。最重要的利益相关者是用户，只有用户接受并使用系统，项目才算完成。系统分析的目标是理解业务目标、流程并制定业务流程；其产出是系统规格。系统设计利用系统规格作为输入，其目标是将规格解释为架构、逻辑和物理设计，说明信息系统如何实现。
    利用高速宽带，可在全球任何地点流式传输复杂内容，这对忙碌高管是重要优势，因为信息可以随时随地获取。互联网如今传输大量交互式多媒体内容，这也是许多人获得便利的关键因素。
    信息架构（IA）帮助人们理解周围环境并找到所需内容——在现实世界和线上都适用。实践 IA 涉及帮助我们与合作的个人和组织深思熟虑地构建他们的结构和语言。许多人想知道
    IA 与用户体验（UX）设计的关系。UX 设计师每天都在实践 IA，两者紧密相连。简而言之，IA 是 UX 和其他学科（如内容策略、技术写作、图书馆学和交互设计）中的重要技能。
    IA 是决定如何组织某事物以便其易于理解的实践。如果你曾经使用某物并思考：“我该往哪里走？”或“这说不通”，说明你遇到了 IA 问题。IA 类似于物理建筑的结构，但针对网站和数字产品。正式定义：信息架构（IA）是数字产品中文本、图片和视频等内容的结构设计。它关注通过组织和标记网站，让用户轻松找到所需内容。实际操作中，IA
    包括对内容进行分类、创建一致的导航、站点地图以及为内容组命名。它是整个项目的骨架，基于此再构建视图、视觉元素、交互或功能。IA 让用户以最小的努力获取内容。例如，结构不良的网站会让访客感到沮丧和困惑。
    IA 的组织方式取决于用户需求和业务优先级。例如，博客或登陆页的结构会与其他页面显著不同。 IA 设计师是设计团队的补充成员，负责研究、导航、数据建模和标记等任务。
    IA 架构师负责设计用户如何在网页或应用中浏觪并找到相关信息。用户如何使用应用或网站很大程度上取决于信息的呈现和组织方式。 为什么 IA 对业务重要？要做好
    IA，需要回答以下问题：如何组织和划分信息？如何呈现信息？如何沟通导航方式？用户如何在网站上导航？用户如何查找信息？ IA 的组成部分包括：组织系统、标记系统、导航系统、搜索系统。
    设计有效 IA 的工具与模板：市面上有大量 IA 创作工具。最基础的视图可使用 Microsoft Visio 创建。也可以用简单的图表呈现 IA，即使针对非常大的页面或应用也同样适用。图表常用于基于已有
    IA 的站点地图。 设计有效 IA 的步骤： 1. 用户研究：IA 设计应始于用户研究与分析，重点了解用户需求与痛点，并将其与业务目标对齐。可使用的工具包括卡片排序、用户访谈、焦点小组或调查。
    2. 导航：接下来定义导航结构，即各页面的层级关系，并设计导航的展示和触发方式。可使用思维导图或图表工具。 3. 标记：信息结构制定后，为各章节和页面命名，使其对用户友好且易于导航。
    4. 线框设计：最后基于 IA 制作线框，定义页面上信息的视觉层级和视图之间的连接。 何时创建 IA？对于大型网站或应用，在设计过程初期——在确定用户后、制作线框和原型之前——就值得投入时间进行
    IA 设计。 IA 通过描述内容如何组合成整体图景，以及各元素之间的关联，为内容策略、UI 设计和交互设计提供指导，并在原型和原型阶段发挥作用。 如何分类和组织信息？
    标记系统：如何呈现信息 导航系统：用户如何浏览或移动信息 搜索系统：用户如何查找信息 为了构建这些系统，需要理解用户、内容和情境之间的相互依赖关系。 情境：业务目标、资金、政治、文化、技术、资源、限制  内容：内容目标、文档和数据类型、数量、现有结构、治理与所有权  用户：受众、任务、需求、信息寻找行为、经验
    如何创建有效的 IA？ IA 依赖三个相互作用的要素：本体论（Ontology）、分类学（Taxonomy）和 choreography（ choreography）。
    本体论：指产品元素的含义，例如标签（如“Produce”标签用于苹果、香蕉、芹菜）和标签（Tags），后者提供更深层次的内容组织信息，如餐厅标签“Sushi
    Bars”“Vegan”“Russian”。 分类学：将相似元素归类的科学或技术，使用层级结构对信息进行排名，可按使用频率、新旧、字母顺序、数值等方式排序。例如，美国黑熊的科学分类系统。
    Choreography：可表示为用户流，即用户为完成任务所走的路径。简单的电子商务和会员/订阅用户流示例。 有效 IA 的评估标准包括： IS IT FINDABLE（可查找）？用户能否轻松定位所需内容？是否有多种入口？在不同设备和平台之间，查找能力是否一致？
    IS IT ACCESSIBLE（可访问）？是否在所有预期设备和渠道上可用？是否具备跨渠道一致性和可访问性标准（如视觉/听障用户友好）？ IS IT CLEAR（易于感知）？是否易于理解？是否考虑目标受众的阅读水平？路径到任务完成是否明显且无干扰？沟通是否有效（信息及时、信息量足）？导航标签和信息是否帮助用户定位？标签和信息在产品及其渠道之间是否一致？
    IS IT USEFUL（有用）？用户是否能实现预期结果？ IS IT USABLE（易用）？用户能否在不产生挫败感的情况下完成任务？ IS IT CREDIBLE（可信）？内容是否及时更新？是否方便联系真人？在支付时是否易于验证产品安全性？
    IS IT CONTROLLABLE（可控）？用户是否能轻松完成想要的任务？错误预测和消除做得如何？用户能否轻松恢复错误？是否提供根据情境定制的信息或功能？退出和其他重要控制是否清晰标记？
    IA 的核心是让复杂化简明，帮助用户轻松找到信息并完成任务。通过理解各元素如何组合成整体图景，以及元素之间的关联，实现此目标。 END _____________________________________________________________________________
