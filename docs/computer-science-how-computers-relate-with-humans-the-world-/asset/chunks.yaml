    documentation, but it values working software more. Customer Collaboration Over
    Contract Negotiation: Negotiation is the period when the customer and the product
    manager work out the details of a delivery, with points along the way where the
    details may be renegotiated. Collaboration is a different creature entirely. With
    development models such as Waterfall, customers negotiate the requirements for
    the product, often in great detail, prior to any work starting. This meant the
    customer was involved in the process of development before development began and
    after it was completed, but not during the process. The Agile Manifesto describes
    a customer who is engaged and collaborates throughout the development process,
    making. This makes it far easier for development to meet their needs of the customer.
    Agile methods may include the customer at intervals for periodic demos, but a
    project could just as easily have an end-user as a daily part of the team and
    attending all meetings, ensuring the product meets the business needs of the customer.
    Responding to Change Over Following a Plan: Traditional software development regarded
    change as an expense, so it was to be avoided. The intention was to develop detailed,
    elaborate plans, with a defined set of features and with everything, generally,
    having as high a priority as everything else, and with a large number of many
