    “where am I supposed to go next?” or “this doesn’t make any sense,” you are encountering
    an issue with an information architecture. Information architecture is a task
    often shared by designers, developers, and content strategists. Picture an architect
    planning, designing, and creating buildings and other physical structures. They
    need to design buildings that are functional and pleasant to use, while also being
    technically sound and aesthetically pleasing. People generally enjoy being in
    buildings where they can navigate and find where they need to go, rather than
    running around from one part to another not being able to find their destination.
    Information architecture is similar, but relates to websites and digital products
    instead of physical buildings. Formally defined, Information Architecture, or
    IA, is the structural design of information or content (including text, photos,
