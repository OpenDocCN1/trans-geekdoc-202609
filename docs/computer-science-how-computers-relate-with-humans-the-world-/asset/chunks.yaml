    Multi-core and GPU support via TensorFlow. Desktop application provides a simple
    user interface with menu, 5 display modes, and runtime reconfiguration of parameters.
    Server application supports preset and/or argument-based scripting. Anticipates
    datasets as standard .csv files. Auto-records the full population of each generation
    and runtime configuration. Supports the loading of customised seed populations.
    Relatively simple framework for preparing custom fitness functions and evaluation
    routines. Written in Object Oriented Python with a hierarchical naming scheme
    for all methods. Linear Genetic Programming (Kotlin) by Jed Simson An implementation
    of Linear Genetic Programming (LGP) as outlined by M. F. Brameier and W. Banzhaf
    (2007). LGP is a paradigm of genetic programming that employs a representation
    of linearly sequenced instructions in automatically generated programs. A linear
    approach lends itself to programs which have two unique attributes: a graph-based
    functional structure and the existence of structurally non-effective instructions.
    This particular implementation is written using the Kotlin programming language
    and provides: A modern, robust, and easy-to-use API. A modular system design that
    allows extensibility of entire system components. Numerous built-in components
    for use in different contexts (e.g. parallelised evolutionary algorithms, fitness
    functions). Cross-platform support due to being built on a JVM-based language.
    Extensive API documentation and usage guide. Completely open-source and still
    in active development. Modular Agent Based Evolution Framework (mixed environments
    and platforms) by Hintzelab MABE is a digital evolution research tool used to
    create and manage populations of evolving digital organisms. Mabe is a framework
    with modular parts which can be combined to create experiments. MABE encourages
    users to develop new modules if needed, and use existing modules when possible.
    The purpose of MABE is threefold: To support and accelerate research into topics
    related to digital evolution. To provide insight into evolution and evolutionary
    processes in both digital and biological contexts. To provide a platform which
    allows for direct comparisons. Symbiotic Bid-Based GP (Python) by Jessica Pauli
    de Castro Bonson Symbiotic Bid-Based GP (SBB) is a framework for coevolving teams
    of programs that learn how to autonomously decompose a decision task. Solutions
    therefore always consist of at least two programs. The framework assumes that
    decisions take the form of a discrete set of actions (as in classification and
    reinforcement learning with atomic actions). To date, examples of the SBB framework
    have been demonstrated for multi-class classification, and single and multi-agent
