    send us a direct email info@litmux.com Chapter 1 Why Computer Science? Computer
    science is a major part of Informatics. It is an exciting, challenging, and growing
    field that impacts the world and everyday life in countless ways. Though most
    important aspect of computer science is problem solving, an essential skill for
    life, it is also the study of the principles and use of computers and computational
    systems including artificial intelligence, machine learning, robotics, evolutionary
    programming, artificial neural networks, artificial life, and modern formal methods.
    Unlike electrical and computer engineering, computer science deals mostly with
    hardware, software and software systems; this includes their theory, design, development
    and application. Since it is a discipline that spans theory and practice, it requires
    thinking both in abstract terms and in concrete terms. The practical side of computer
    science can be seen everywhere. Practically everyone is a computer user. Additionally,
    a computer scientist’s goal is to develop an algorithm, a step-by-step list of
    instructions for solving a given problem and any instance of problem that might
    arise. Algorithms for that matter, are basically finite processes that if followed
    will solve a problem. Algorithms are solutions. Computer science can be thought
    of as the study of algorithms or better still a study of solutions. A central
    focus is on processes for handling and manipulating information. Thus, the discipline
    spans both advancing the fundamental understanding of algorithms and information
    processes in general as well as the practical design of efficient reliable software
    and hardware to meet given specifications. That is to say, although knowing how
    to program is essential to the study of computer science, it is only one element
    of the field. Computer scientists design and analyze algorithms to solve programs
    and study the performance of computer hardware and software. The problems that
    computer scientists encounter range from the abstract-- determining what problems
    can be solved with computers and the complexity of the algorithms that solve them
    – to the tangible – designing applications that perform well on handheld devices,
    that are easy to use, and that uphold security measures. The study of computer
    science also includes software engineering, and computer graphics. The theoretical
    discipline such as computational complexity theory, are highly abstract, while
    computer graphics emphasizes real-world applications. Programming language theory
    considers approaches to the description of computational processes, while computer
    programming itself involves the use of programming languages and complex systems.
    The need for computer science as a discipline has grown as computers become more
    integrated into our day-to-day lives and technology continues to advance. Human–computer
    interaction considers the challenges in making computers useful, usable, and accessible.
    For instance, algorithmic trading has increased the efficiency and liquidity of
    financial markets by using artificial intelligence, machine learning, and other
    statistical and numerical techniques on a large scale. High frequency algorithmic
    trading can also exacerbate volatility. Computer graphics and computer-generated
    imagery have become ubiquitous in modern entertainment, particularly in television,
    cinema, advertising, animation and video games. Even films that feature no explicit
    CGI are usually "filmed" now on digital cameras, or edited or post-processed using
    a digital video editor. Modern computers enable optimization of such designs as
    complete aircraft. Notable in electrical and electronic circuit design are SPICE,
    as well as software for physical realization of new (or modified) designs. The
    latter includes essential design software for integrated circuits. The field has
    also seen many major achievements including the digital revolution and establishment
    of the Internet, as well as the use of computers in science and math. The theoretical
    studies, experimental methods, and engineering design are all in one discipline.
    This differs radically from most physical sciences that separate the understanding
    and advancement of the science from the applications of the science in fields
    of engineering design and implementation. The inherent intermingling of the theoretical
    concepts of computability and algorithmic efficiency with the modern practical
    advancements in electronics that continue to stimulate advances in the discipline
    is what makes this field of study very unique. It is this close interaction of
    the theoretical and design aspects of the field that binds them together into
    a single discipline. Let’s take a look at some of the major benefits of computer
    science to the society in recent times: Genomics and personalized medicine are
    an excellent example of how computer science-driven technologies are accelerating
    healthcare progress. The genome sequencing process that powers this frontier of
    medicine used to cost tens of millions of dollars to complete, but machine-learning
    techniques and improved computing power have dropped costs substantially. Moreover,
    E-learning platforms and applications give students new tools to problem-solve
    and study, which has changed the academic world. The ability to take classes online
    is also a huge benefit for the world—as it creates access to education for students
    whose locations, abilities or finances were a barrier.  Can you imagine modern
    education without computer software or the Internet? Whether you’re taking a class
    online, researching for a paper or sharing work via the cloud, computer science
    have helped make this possible. It has also made the whole world a very small
    place when it comes to communication. Social media, video calling and chatting
    apps—even the applications that allow you to share documents and photos with someone
    else long-distance has been powered by the field of computer Science. These capacities
    have completely revolutionized the workforce. The field is scaling—and scaling
    very fast for that matter. Applying computer science to prediction can have a
    huge impact on the world. From predicting consumer markets to predicting climates,
    seasons, ocean currents, etc. It is a noble profession without which today’s world
    would come to a complete halt. That is why its basics is now studied by even children.
    At Northcote Baptist Community Preschool, young children, 3-4 years of age, have
    been learning about computational thinking through visual programming of robotics.
    The children, supported by their teacher, are understanding sequencing, problem-solving,
    looping, and algorithms through this programming. The children play with patterns,
    take risks, trial, make mistakes, and retry as they program their robot to carry
    out certain tasks. Once they have programmed their robot, they place it on the
    floor, and very quickly, and visually, evaluate whether the instructions that
    they gave it worked, or whether they need some refinement. These young children
    are learning about the world they live in, through collaborating on their work
    with robots. Additionally, the introduction of coding as a secondary skill into
    a maths lesson provided a sense of authenticity to the task as the children engaged
    with the maths concept, and worked together to problem solve. The Internet has
    opened up a world of resources and learning communities that every age group can
    tap into. It is this network that will support you as you introduce computer science
    into your own learning environments.  Communication skills are vital for securing
    the necessary information and insight from end users about how the software is
    functioning. Web developers for instance, assess the needs of users for information-based
    resources. They create the technical structure for websites and make sure that
    web pages are accessible and easily and information are easily downloadable on
    the website.  Web developers structure sites to maximize the number of page views
    and visitors through search engine optimization. They must have the communication
    ability and creativity to make sure the website meets its user''s needs. If you
    are a service provider, coming up with your business without a ton of extra cash,
    it can be hard to stay afloat. However, the advent of computer science can make
    a huge difference here. For example, beauticians often do not determine their
    own work hours or find their own clients because they don''t know how. Seeing
    this need, a company called Hugo’s created an app that allows beauticians to recruit
    their own clients and set their own schedules. As a women-owned company, they
    try to find apps that are needed and that will help people in areas that have
    been overlooked by most coders. Further, France is utilizing startups by assigning
    teams to create solutions when a public agent identifies a problem. Then the solutions
    go live nationally. This approach allows computer scientists and other technology
    professionals to jump in and meet needs as they arise in their communities. Sites
    like Code Alliance can be excellent resources for computer scientists who want
    to put their skills to work for global issues. These platforms allow a wide array
    of tech professionals to create, support and execute projects that change lives.
    There are also indirect benefits from the tools computer scientists build. Consider
    charities that are now able to streamline their donations, or crowdfunded campaigns
    that can gather a following and financial backing. Empowering people who are often
    overlooked. Looking back, it is very clear that computer science has really come
    a long way. Before the invention of the modern digital computer, machines for
    calculating fixed numerical tasks such as the abacus have existed since antiquity,
    aiding in computations such as multiplication and division. Eventually, Charles
    Babbage started the design of the first automatic mechanical calculator, his Difference
    Engine, in 1822, which eventually gave him the idea of the first programmable
    mechanical calculator, his Analytical Engine. He started developing this machine
    in 1834, and in less than two years, he had sketched out many of the salient features
    of the modern computer. A crucial step was the adoption of a punched card system
    derived from the Jacquard loom making it infinitely programmable. In 1843, during
    the translation of a French article on the Analytical Engine, Ada Lovelace wrote,
    in one of the many notes she included, an algorithm to compute the Bernoulli numbers,
    which is considered to be the first computer program. Around 1885, Herman Hollerith
    invented the tabulator, which used punched cards to process statistical information;
    eventually his company became part of IBM. During the 1940s, as new and more powerful
    computing machines were developed, the term computer came to refer to the machines
    rather than their human predecessors. Computer science began to be established
    as a distinct academic discipline in the 1950s and early 1960s.  Since practical
    computers became available, many applications of computing have become distinct
    areas of study in their own rights. The field has made a number of fundamental
    contributions not only to society but science itself—in fact, along with electronics,
    it is a founding science of the current epoch of human history “the Information
    Age” and a driver of the information revolution, seen as the third major leap
    in human technological progress after the Industrial Revolution (1750–1850 CE)
    and the Agricultural Revolution (8000–5000 BC). Chapter 2 Human-Computer Interaction
    Human-Computer Interaction (HCI) combines computer science, behavioral sciences,
    and design to help humans interact with computers in novel ways. Humans interact
    with computers in many ways; the interface between humans and computers is crucial
    to facilitating this interaction. HCI deals with the construction and implementation
    of interfaces and tool-building technologies that would adapt seamlessly to people''s
    needs. It focuses on creating simplified interfaces to achieve the best satisfaction
    for various types of users. HCI does not only study how people interact with computers
    but also to what extent computers are developed for successful interaction with
    human beings. Which includes the way humans make, or do not make, use of computational
    artifacts, systems and infrastructures. In doing so, much of the research in the
    field seeks to improve human–computer interaction by improving the usability of
    computer interfaces. The emerging multi-modal and Graphical user interfaces (GUI)
    allow humans to engage with embodied character agents in a way that cannot be
    achieved with other interface paradigms. The growth in this field has been in
    quality of interaction, and in different branching in its history. Instead of
    designing regular interfaces, the different research branches have had a different
    focus on the concepts of multimodality rather than unimodality, intelligent adaptive
    interfaces rather than command/action based ones, and finally active rather than
    passive interfaces. One important HCI factor is that different users form different
    conceptions or mental models about their interactions and have different ways
    of learning and keeping knowledge and skills (different "cognitive styles" as
    in, for example, "left-brained" and "right-brained" people). In addition, cultural
    and national differences play a part. Another consideration in studying or designing
    HCI is that user interface technology changes rapidly, offering new interaction
    possibilities to which previous research findings may not apply. Finally, user
    preferences change as they gradually master new interfaces. Now, let’s take a
    quick look at the difference between the terms User Interface (UI) and Human Computer
    Interaction (HCI). While HCI involves the study, planning, and design of the interaction
    between people (user) and often regarded as the intersection of computer science,
    behavioral sciences, design and several other field of study, User Interface (UI),
    is the system which helps users communicate with the computer system and/or the
    application system. UI Consists of all the hardware, software, screens, menus,
    functions, and features that affect two-way communications between the user and
    the computer. A good user interface provides a unifying structure for finding,
    viewing and invoking the different components of a system. A command-driven interface
    is one in which you enter commands. A menu-driven interface is one in which you
    select command choices from various menus displayed on the screen. Human–computer
    interaction combines novel algorithms with design strategies that enable rapid
    human performance, low error rates, ease in learning, and high satisfaction. Researchers
    use ethnographic observation and automated data collection to understand user
    needs, then conduct usability tests to refine designs. Key innovations include
    the direct manipulation, selectable web links, touchscreen designs, mobile applications,
    and virtual reality. The field of HCI covers a wide range of topics, and its development
    has relied on contributions from many disciplines. Some of the main disciplines
    which have contributed to HCI are: Computer Science - Technology, software design,
    development & maintenance, user Interface Management Systems (UIMS) & User Interface
    Development Environments (UIDE), prototyping tools, graphics etc. Cognitive Psychology
    - Cognitive psychology covers areas such as language, learning and memory, speech,
    and the storage and recall of information. Behaviors occur as a result of how
    information is received and interpreted, and individual differences can vary greatly
    from one person to the next. Process Information - The analogy of computer intelligence
    is often used to describe brain processes and the methods of sorting, filing,
    and relaying information. Like a computer, the brain takes in information, manipulates
    it, and then produces responses. When we understand just a little about a particular
    subject, we might open a book and read a more detailed description of the subject
    so we can add to the knowledge base we already possess. We might also replace
    information that was previously stored with information derived from studies that
    are more recent. This would be similar to a computer overwriting older files with
    newer versions. Although the basic information is the same, the newer ‘file’ contains
    more detail than the previous knowledge that had been stored for future recall.
    They ask questions like: How do we receive information about the outside world?
    How do we store and process information? How do we solve problems? How does a
    breakdown in our perceptions cause errors in our thinking? How do errors in our
    thinking lead to emotional distress and negative behaviors? With the development
    of new warfare technology during WWII, the need for a greater understanding of
    human performance came to prominence. Developments in computer science would lead
    to parallels being drawn between human thought and the computational functionality
    of computers, opening entirely new areas of psychological thought. Allen Newell
    and Herbert Simon spent years developing the concept of artificial intelligence
    (AI) and later worked with cognitive psychologists regarding the implications
    of AI. This encouraged a conceptualization of mental functions patterned on the
    way that computers handled such things as memory storage and retrieval, and it
    opened an important doorway for cognitivism. One of the main things in HCI design
    are humans and the end users who will be using the design. With humans the design
    could never happen. There are three functional principles of Information Processing
    to remember these include: Human as a component; Human Information Processing
    (HIP); GOMS. Human As A Component: The main principle is where people believe
    and understand that part of the computer / HCI is human. Without humans, HCI would
    not be possible. In HCI the user is the main component, the user will want the
    system to be able to calculate and perform complex tasks which would take the
    human brain a lot longer to process. The company / person who builds the HCI needs
    to take into consideration how long it takes for a human brain to calculate data
    because that way, they can create a HCI which is a lot faster and can process
    thousands of data every second. Human Information Processing (HIP): HIP is the
    theory on how humans work like computers. It is believed that the sensed of humans
    such as our hands, mouth, eyes and nose are our input devices which for a computer
    the input devices could be a mouse and keyboard. With HIP working like a computer
    which includes hardware and software, at first, the brain will first input the
    data as hardware, which will then be processed using software and then stores
    the information in either the STM (Short Term Memory) or LTM (Long Term Memory).
    It then acknowledges the information and makes a decision on the output. Computers
    can perform at a faster and more efficient rate. They can process and produce
    information 24/7 and not require sleep. Computers can process hundreds of thousands
    of requests every second, whereas humans can only preform calculations one at
    a time. However, computers cannot hear nor understand what people are saying;
    it requires a person to type the information in to the system for it to be processed.
    Information Processing is the change in a state of information. It allows us to
    split information down into steps which can be easily read and understood by the
    human brain. It also allows people to store, retrieve and use information with
    ease. There are four steps to how information is collected and used: Absorb the
    information Analyze the information Use the information Do something with the
    information GOMS (Goals, Operators, Methods, Selection Rules) What is GOMS? GOMS
    stands for Goals, Operators, Methods and Selection Rules. It is a model that can
    be used to allow users and developers to understand, see and perform tasks that
    are undertaken in a Human Computer Interface. Goals is what the user wants to
    accomplish from the system, what task they want to complete. In order to complete
    a goal, the HCI must be used. An example of a goal would be finding an e-mail
    address from a contact list on Microsoft Outlook. Operators are the actions that
    are physically taken and performed in order to complete a given goal. Again, this
    must be used under a HCI model. An example of an operation that is needed to take
    place in order to complete the goal would be to click on a menu and then pressing
    the contacts button under Microsoft Outlook. The Methods are a set of tasks that
    are needed to be put in sequence in order to complete the goal. There are always
    more than one method that can be taken in order to find the information and complete
    the goal, for example using a menu or a search bar which includes the ''select
    name from contact list'' or ''enter contact name'' for a quicker and more efficient
    search. Depending on how humans interact with the computer also depends on their
    Emotions, Intuition, Cultural influences, Language, Motivation, Senses and physical
    limitations, Problem solving abilities and how they learn and if they have any
    disabilities. Chapter 3 Genetic And Evolutionary Programming One of the central
    challenges of computer science is to get a computer to do what needs to be done,
    without telling it how to do it. Genetic programming is an approach that seems
    most appropriate with problems in which there are a large number of fluctuating
    variables such as those related to artificial intelligence. Genetic programming
    addresses this challenge by providing a method for automatically creating a working
    computer program from a high-level problem statement of the problem. In artificial
    intelligence, genetic programming (GP) is a technique of evolving programs, starting
    from a population of unfit (usually random) programs, fit for a particular task
    by applying operations analogous to natural genetic processes to the population
    of programs. It is essentially a heuristic search technique often described as
    ''hill climbing'', i.e. searching for an optimal or at least suitable program
    among the space of all programs. Genetic programming achieves this goal of automatic
    programming (also sometimes called program synthesis or program induction) by
    genetically breeding a population of computer programs using the principles of
    Darwinian natural selection and biologically inspired operations. The operations
    include reproduction, crossover (sexual recombination), mutation, and architecture-altering
    operations patterned after gene duplication and gene deletion in nature. Evolutionary
    programming on the other hand, is one of the major evolutionary algorithm paradigms
    such as the Genetic Algorithm, and Learning Classifier Systems. It is sometimes
    confused with Genetic Programming given the similarity in name, and more recently
    it shows a strong functional similarity to Evolution Strategies. Unlike genetic
    programming, the structure of the program to be optimized is fixed, while its
    numerical parameters are allowed to evolve. It was first used by Lawrence J. Fogel
    in the US in 1960 in order to use simulated evolution as a learning process aiming
    to generate artificial intelligence. Fogel used finite-state machines as predictors
    and evolved them. Currently evolutionary programming is a wide evolutionary computing
    dialect with no fixed structure or (representation), in contrast with some of
    the other dialects. It is becoming harder to distinguish from evolutionary strategies.
    Its main variation operator is mutation; members of the population are viewed
    as part of a specific species rather than members of the same species therefore
    each parent generates an offspring, using a (μ + μ). Unlike Evolutionary programming
    , Genetic programming uses the ideas (and some of the terminology) of biological
    evolution to handle a complex problem. Of a number of possible programs (usually
    small program functions within a larger application), the most effective programs
    survive and compete or cross-breed with other programs to continually approach
    closer to the needed solution. Specifically, genetic programming iteratively transforms
    a population of computer programs into a new generation of programs by applying
    analogs of naturally occurring genetic operations. So what are the Preparatory
    Steps of Genetic Programming? The human user communicates the high-level statement
    of the problem to the genetic programming system by performing certain well-defined
    preparatory steps. The five major preparatory steps for the basic version of genetic
    programming require the human user to specify: The set of terminals (e.g., the
    independent variables of the problem, zero-argument functions, and random constants)
    for each branch of the to-be-evolved program; The set of primitive functions for
    each branch of the to-be-evolved program; The fitness measure (for explicitly
    or implicitly measuring the fitness of individuals in the population); Certain
    parameters for controlling the run; The termination criterion and method for designating
    the result of the run. Genetic programming goes a step farther and makes the program
    or "function" the unit that is tested. Two approaches are used to select the successful
    program - cross-breeding and the tournament or competition approach. A difficult
    part of using genetic programming is determining the fitness function, the degree
    to which a program is helping to arrive at the desired goal. A simple example
    of a task suited for genetic programming would be devising a program to fire a
    gun. The distance by which the bullet misses its target would determine the fitness
    function. Typically, members of each new generation are on average more fit than
    the members of the previous generation, and the best-of-generation program is
    often better than the best-of-generation programs from previous generations. Termination
    of the recursion is when some individual program reaches a predefined proficiency
    or fitness level. It may and often does happen that a particular run of the algorithm
    results in premature convergence to some local maximum which is not a globally
    optimal or even good solution. Multiple runs (dozens to hundreds) are usually
    necessary to produce a very good result. It may also be necessary to increase
    the starting population size and variability of the individuals to avoid pathologies.
    The genetic programming model is mostly used with the LISP and Scheme programming
    languages. However, it can also be used with C and other programming languages.
    The following are some GP applications and packages: Clojush (Clojure/Java) by
    Lee Spector, Thomas Helmuth, and additional contributors. Clojush is a version
    of the Push programming language for evolutionary computation, and the PushGP
    genetic programming system, implemented in Clojure. Push features a stack-based
    execution architecture in which there is a separate stack for each data type.
    PushGP has been used for a variety of applications, ranging from intelligent agent
    design to automatic quantum computer programming. It has also been used for “meta-genetic-programming”
    or “autoconstructive evolution” experiments, in which programs and genetic operators
    co-evolve or in which programs produce their own offspring while also solving
    problems. Data Modeler (Mathematica) by Evolved Analytics The DataModeler package
    is developed within the context of industrial data analysis with a goal of rapid
    analysis, interpretation and exploitation of multivariate data sets. DEAP (Python)
    Distributed Evolutionary Algorithms by Félix-Antoine Fortin and François-Michel
    De Rainville DEAP is a novel evolutionary computation framework for rapid prototyping
    and testing of ideas. It seeks to make algorithms explicit and data structures
    transparent. It works in perfect harmony with parallelisation mechanism such as
    multiprocessing and SCOOP. ECJ (Java) by Sean Luke, et al. ECJ is a research Evolutionary
    Computation system written in Java. It was designed to be highly flexible, with
    nearly all classes (and all of their settings) dynamically determined at runtime
    by a user-provided parameter file. All structures in the system are arranged to
    be easily modifiable. Even so, the system was designed with an eye toward efficiency.
    Eureqa (web) by Nutonian Eureqa is a Machine Intelligence™ application that automates
    much of the heavy lifting inherent in analytics and data science. Leveraging automated
    evolutionary algorithms, Eureqa churns through your data to create accurate predictive
    models in minutes rather than months. FCUBE (Amazon cloud) by ALFA Group, CSAIL,
    MIT A platform for collaborative learning supporting and uniting developers of
    home-brewed classifier algorithms to solve relevant problems of public domain.
    FCUBE allows users to: Execute classification algorithms with large training data
    with a preset computational budget on Amazon EC2 Retrieve the solutions from the
    cloud nodes, build a fused model, and compute the testing predictions Easily upload
    datasets Easily contribute your standalone classifier in executable format (Java,
    python) or as source code (must compile in Linux: C, C++ etc) Karoo GP (Python)
    by Kai Staats A Python based genetic programming application suite with support
    for symbolic regression and classification. Karoo GP is a scalable platform with
    multicore support, designed to work with realworld data. As a teaching tool, it
    enables instructors to share step-by-step how an evolutionary algorithm arrives
    to its solution. As a hands-on learning tool, Karoo GP supports rapid, repeatable
