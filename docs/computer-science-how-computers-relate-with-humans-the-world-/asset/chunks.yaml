    printing, and the first WYSIWYG text editor. Effective IA depends on the interplay
    between three things: Ontology, Taxonomy, and Choreography. Ontology is the meaning
    of the product’s elements. Example: Labels - easily understood names given to
    individual categories ‘Produce’ is a label given to things like apples, bananas,
    celery. Tags - data about content that helps to organize it at a deeper level
    Restaurants are given tags like ‘Sushi Bars’, ‘Vegan’, ‘Russian’. These can help
    users to find a better match for their preferences. Taxonomy is the science or
    technique of classification, putting like elements together. Taxonomic hierarchy
    is used to rank information. Things can be ranked in different ways, for example:
    importance/frequency of use, recency, alphabetically, numerically, etc. An example
    of taxonomy: scientific classification system for an American Black Bear. Choreography
    can be represented as a user flow, the path through a product that a user can
    take to accomplish a task. Very simple example of potential user flow for eCommerce
    and Membership/Subscription. These set of principles can be used to evaluate existing
    IA and help to predict the effectiveness of design and help answer questions such
    as: IS IT FINDABLE? Can the user locate what they’re trying to find? Is there
    more than one way to access things? How does findability differ across devices
    and platforms? IS IT ACCESSIBLE? Can it be used across all expected devices and
    channels? Is the product resilient and consistent across channels? Does it meet
    standards of accessibility for target audiences? Is it friendly towards visual/hearing
    impaired users? IS IT CLEAR (EASILY PERCEPTIBLE)? Easy to understand? Is the target
    demographics’ grade and reading level considered? Is the path to task completion
    obvious and free of distraction? Is it communicative (talkative, informative,
    timely)? Are messaging and copy effective for users to complete the tasks at hand?
    Do navigation labels and messaging help \`user orient themselves within the product?
    Are labels and messaging consistent across the product and its channels? IS IT
    USEFUL? Are users capable of producing intended result? IS IT USABLE? Users able
    to complete task without frustration? IS IT CREDIBLE? Is content up to date, updated
    in a timely matter? Is it easy to contact a real person? Easy to verify product
    security when making payments? IS IT CONTROLLABLE? Are tasks and info a user would
    want to accomplish available? How well are errors anticipated and eliminated?
    How easily can user recover from errors? Are there features that allow users to
    tailor info/functionality to their context? Are exits and other important controls
    clearly marked? IA is all about making the complex clear and helping users find
    information and complete tasks. Do this by understanding how the pieces fit together
    to create the larger pictures, and how items relate to each other within the system.
