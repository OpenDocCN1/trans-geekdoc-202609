    in computer vision is now the foundation for picture processing in health care,
    protection, transport and other domain names. A number of these emerging ML methods
    like Capsule Neural Networks (CapsNet) will basically alter the manner ML versions
    are deployed and trained. They''ll have the ability to create models that forecast
    with precision even if trained using restricted data. Accessibility To Historical
    Data Sets: Ahead of Cloud became mainstream, saving and accessing information
    was pricey. As a result of the cloud-based companies, academia and authorities
    are unlocking the information which was once restricted to the cassette cartridges
    and magnetic discs. Data scientists want access to large historical datasets to
    educate ML models which may predict with greater precision. The efficacy of an
    ML version is directly determined by the quality and dimensions of this dataset.
    To address complicated problems. With information storage and recovery becoming
    more economical, government agencies, healthcare institutions, and institutions
    are creating unstructured information accessible to the research area. One can
    intuitively surmise artificial intelligence (AI) is today''s hot commodity, gaining
    traction in businesses, academia and government in recent years. Now, there is
    data -- all in one place -- that documents growth across many indicators, including
    startups, venture capital, job openings and academic programs. One key measure
    of AI development is startups and venture capital funding. From January 2015 to
    January 2018, active AI startups increased 2.1x, while all active startups increased
    1.3x, report states. The AI Index also cited McKinsey data that demonstrated the
    types of AI solutions being deployed in organizations. In North American organizations,
    the main forms of AI include the following: Robotic process automation 23% Machine
    learning 23% Conversational interfaces 20% Computer vision 20% Natural language
    text understanding 17% Natural language speech understanding 16% Natural language
    generation 11% The AI and machine learning practices can be seen everywhere in
    the area of computer science. It gives you an idea of the possible number of ways
    how can design a computer system. It is made to perform the cognitive functions
    as described by the humans. By 2035, it has been projected that AI will add $814
    billion to the economy of UK with increasing rates from 2.5 to 3.5%. The capabilities
    of AI are immense. For instance, there is a machine that has mastered the complex
    game Go, that was thought to be a difficult challenge if at all artificial processing
    was applied to the game. Vehicles are now operating independently, including trucks
    that are remotely driven by one operator. There is a proliferation of automated
    parts and robotic devices when it comes to completing tasks with ease; these accomplishments
    are giving new rise to the revolution of AI. Chapter 6 Robotics Technology Robotics
    deals with the design, construction, operation, and use of robots, as well as
    computer systems for their control, sensory feedback, and information processing.
    These technologies are used to develop machines that can substitute for humans
    and replicate human actions. Robots can be used in many situations and for lots
    of purposes, but today many are used in dangerous environments (including bomb
    detection and deactivation), manufacturing processes or where humans cannot survive
    (e.g. in space). Robots can take on any form but some are made to resemble humans
    in appearance. This is said to help in the acceptance of a robot in certain replicative
    behaviors usually performed by people. Such robots attempt to replicate walking,
    lifting, speech, cognition, and basically most things a human can do. Many of
    today''s robots are inspired by nature, contributing to the field of bio-inspired
    robotics. The concept of creating machines that can operate autonomously dates
    back to classical times, but research into the functionality and potential uses
    of robots did not grow substantially until the 20th century. Throughout history,
    it has been frequently assumed by various scholars, inventors, engineers, and
    technicians that robots will one day be able to mimic human behavior and manage
    tasks in a human-like fashion. Today, robotics is a rapidly growing field, as
    technological advances continue; researching, designing, and building new robots
    serve various practical purposes, whether domestically, commercially, or militarily.
    When it comes to Robotics, it is an interdisciplinary branch of engineering and
    computer science. Including; mechanical engineering, electronic engineering, information
    engineering, artificial intelligence, nanotechnology, and others. This field also
    overlaps with, mechatronics and bioengineering. Robotics is also used in STEM
    (science, technology, engineering, and mathematics) as a teaching aid. There are
    many types of robots, although being very diverse in application and form they
    all share three basic similarities when it comes to their construction: Robots
    all have some kind of mechanical construction, a frame, form or shape designed
    to achieve a particular task. For example, a robot designed to travel across heavy
    dirt or mud, might use caterpillar tracks. The mechanical aspect is mostly the
    creator''s solution to completing the assigned task and dealing with the physics
    of the environment around it. Form follows function. Robots have electrical components
    which power and control the machinery. For example, the robot with caterpillar
    tracks would need some kind of power to move the tracker treads. That power comes
    in the form of electricity, which will have to travel through a wire and originate
    from a battery, a basic electrical circuit. Even petrol powered machines that
    get their power mainly from petrol still require an electric current to start
    the combustion process which is why most petrol powered machines like cars, have
    batteries. The electrical aspect of robots is used for movement (through motors),
    sensing (where electrical signals are used to measure things like heat, sound,
    position, and energy status) and operation (robots need some level of electrical
    energy supplied to their motors and sensors in order to activate and perform basic
    operations). All robots contain some level of computer programming code. A program
    is how a robot decides when or how to do something. In the caterpillar track example,
    a robot that needs to move across a muddy road may have the correct mechanical
    construction and receive the correct amount of power from its battery, but would
    not go anywhere without a program telling it to move. Programs are the core essence
    of a robot, it could have excellent mechanical and electrical construction, but
    if its program is poorly constructed its performance will be very poor (or it
    may not perform at all). There are three different types of robotic programs:
    remote control, artificial intelligence and hybrid. A robot with remote control
    programing has a preexisting set of commands that it will only perform if and
    when it receives a signal from a control source, typically a human being with
    a remote control. It is perhaps more appropriate to view devices controlled primarily
    by human commands as falling in the discipline of automation rather than robotics.
    Robots that use artificial intelligence interact with their environment on their
    own without a control source, and can determine reactions to objects and problems
    they encounter using their preexisting programming. Hybrid is a form of programming
    that incorporates both AI and RC functions. As more and more robots are designed
    for specific tasks this method of classification becomes more relevant. For example,
    many robots are designed for assembly work, which may not be readily adaptable
    for other applications. They are termed as "assembly robots". For seam welding,
    some suppliers provide complete welding systems with the robot i.e. the welding
    equipment along with other material handling facilities like turntables etc. as
    an integrated unit. Such an integrated robotic system is called a "welding robot"
    even though its discrete manipulator unit could be adapted to a variety of tasks.
    Some robots are specifically designed for heavy load manipulation, and are labelled
    as "heavy duty robots". What Are Some Of The Current And Potential Applications?
    Industrial Robots: This kind of Robot is increasingly used in manufacturing (since
    the 1960s). According to the Robotic Industries Association US data, in 2016 automotive
    industry was the main customer of industrial robots with 52% of total sales. In
    the auto industry, they can amount for more than half of the "labor". There are
    even "lights off" factories such as an IBM keyboard manufacturing factory in Texas
    that was fully automated as early as 2003. Agricultural Robots (AgRobots): The
    use of robots in agriculture is closely linked to the concept of AI-assisted precision
    agriculture and drone usage. 1996-1998 research also proved that robots can perform
    a herding task. Currently, artificial intelligence and machine learning are being
    applied in limited ways and enhancing the capabilities of various robotic systems.
    Artificial Intelligence And Machine Learning In Robotics There are four areas
    of robotic processes that AI and machine learning are impacting to make current
    applications more efficient and profitable. The scope of AI in robotics includes:
    Vision – AI is helping robots detect items they’ve never seen before and recognize
    objects with far greater detail. Grasping – robots are also grasping items they’ve
    never seen before with AI and machine learning helping them determine the best
    position and orientation to grasp an object. Motion Control – machine learning
    helps robots with dynamic interaction and obstacle avoidance to maintain productivity.
    Data – AI and machine learning both help robots understand physical and logistical
    data patterns to be proactive and act accordingly. AI and machine learning are
    still in their infancy in regards to robotic applications, but they’re already
    having an important impact. AI and machine learning will have a transformative
    impact on industrial robots. While these technologies are still in their infancy,
    they will continue to push the boundaries of what’s possible with industrial robotic
    automation over the next few decades. Chapter 7 Software Development Fundamentals
    The world of software development is something that is limitless. Technology is
    a perfect blend of innovation and ideation that conceptualizes to form a platform,
    which is suitable for operating various software developments taking place. Software
    can be developed for a variety of purposes, the three most common being to meet
    specific needs of a specific client/business (the case with custom software),
    to meet a perceived need of some set of potential users (the case with commercial
    and open source software), or for personal use (e.g. a computer scientist may
    write software to automate a mundane task). The need for better quality control
    of the software development process has given rise to the discipline of software
    engineering, which aims to apply the systematic approach exemplified in the engineering
    paradigm to the process of software development. What is Software development?
    It is the process of conceiving, specifying, designing, programming, documenting,
    testing, and bug fixing involved in creating and maintaining applications, frameworks,
    or other software components. Although Software development itself is a process
    of writing and maintaining the source code, in a broader sense however, it includes
    all that is involved between the conception of the desired software through to
    the final manifestation of the software, sometimes in a planned and structured
    process. Therefore, software development may include research, new development,
    prototyping, modification, reuse, re-engineering, maintenance, or any other activities
    that result in software products. There are many approaches to software project
    management, known as software development life cycle models, methodologies, processes,
    or models. The waterfall model is a traditional version, contrasted with the more
    recent innovation of agile software development. In fact, the methodology meant
    for software development is considered as a structure used for planning and controlling
    the procedure of creating a specialized information system. Certainly, these innovative
    methods are concerned with highlighting the process of software development, which
    does not involve the use of any technical aspect. The only matter considered is
    proper planning for the purpose of highly integrated software development. Agile
    Development Methodology In 2001, seventeen software developers met at a resort
    in Snowbird, Utah to discuss these lightweight development methods, including
    among others Kent Beck, Ward Cunningham, Dave Thomas, Jeff Sutherland, Ken Schwaber,
    Jim Highsmith, Alistair Cockburn, and Bob Martin. Together they published the
    Manifesto for Agile Software Development. Agile methodology is often compared
    with the waterfall model in the software development industry. However, agile
    approach is considered to be better because of its Iterative and incremental development
    methods. These methods can be traced back as early as 1957, with evolutionary
    project management and adaptive software development emerging in the early 1970s.
    During the 1990s, a number of lightweight software development methods evolved
    in reaction to the prevailing heavyweight methods that critics described as overly
    regulated, planned, and micro-managed. These included: rapid application development
    (RAD), from 1991; the unified process (UP) and dynamic systems development method
    (DSDM), both from 1994; Scrum, from 1995; Crystal Clear and extreme programming
    (XP), both from 1996; and feature-driven development, from 1997. Although these
    all originated before the publication of the Agile Manifesto, they are now collectively
    referred to as agile software development methods. It uses an incremental approach
    where a sample prototype is discussed with the customer. The prototype helps in
    understanding the key aspects, including the requirements. The consecutive prototypes
    reflect the changes done in the previous prototypes. This keeps happening till
    the customer is satisfied, providing better end-product to the customer. The idea
    is to maintain product’s quality in the entire phase of development. In the year
    2001, several agile principles were discussed and agreed upon under the Agile
    alliance. The principles were to be followed for agile software development. While
    comparing the Waterfall model and the agile methodology, Royce concluded that:
    Each phase is a result of the process of previous steps; The process should be
    repeatedly checked for consistency; A single iteration would not give a clear
    picture of the process. Why Agile? Agile Methodologies have overcome the traditional
    methods of waterfall model by becoming flexible, fast, lean, responsive, and consistent;
    Agile method focuses on people and is more communication-oriented; Agile methods
    are tested in a dynamic environment and prove to be very flexible by adapting
    to the change happening in the business; Agile methods include regular inspection
    in a disciplined manner, which consequently improves the leadership qualities
    to boost the teamwork; Agile method follows best practices that help in getting
    high-quality software very quickly. The traditional waterfall methodology for
    software development is rapidly losing its popularity as Agile methodology is
    now being increasingly adopted by companies worldwide for software development.
    While Waterfall basically is a sequential model where software development is
    segregated into a sequence of pre -defined phases – including feasibility, planning,
    design, build, test, production, and support, Agile development methodology follows
    a linear sequential approach as well as providing flexibility for changing project
    requirements, as they occur. So what are differences between Agile and Waterfall
    methodology? The software development process is divided into different phases
    in the Waterfall model while Agile methodology segregates the project development
    lifecycle into sprints. Waterfall is a structured software development methodology,
    and often times can be quite rigid, whereas the Agile methodology is known for
    its flexibility. According to the Waterfall model, software development is to
    be completed as one single project, which is then divided into different phases,
    with each phase appearing only once during the SDLC. However, the Agile methodology
    can be considered as a collection of many different projects, which are nothing
    but the iterations of the different phases focusing on improving the overall software
    quality with feedbacks from users or the QA team. If you want to use the Waterfall
    model for software development, then you have to be clear with all the development
    requirements beforehand as there is no scope of changing the requirements once
    the project development starts. The Agile methodology, on the other hand, is quite
    flexible, and allows for changes to be made in the project development requirements
    even after the initial planning has been completed All the project development
    phases such as designing, development, testing, etc. are completed once in the
    Waterfall model while as part of the Agile methodology, they follow an iterative
    development approach. As a result, planning, development, prototyping and other
    software development phases can appear more than once during the entire SDLC.
    One of the major differences between Agile and Waterfall development methodology
    is their individual approach towards quality and testing. In the Waterfall model,
    the “Testing” phase comes after the “Build” phase, but, in the Agile methodology,
    testing is typically performed concurrently with programming or at least in the
    same iteration as programming. While Waterfall methodology is an internal process
    and does not require the participation of customers, the Agile software development
    approach focuses on customer satisfaction and thus, involves the participation
    of customers throughout the development phase. The Waterfall model can be regarded
    as a stringently sequential process, however, the Agile methodology is a highly
    collaborative software development process, thereby leading to better team input
    and faster problem solving. Moreover, while the Waterfall model is best suited
    for projects which have clearly defined requirements and in which change is not
    expected at all, Agile development supports a process in which the requirements
    are expected to change and evolve. Thus, if you are planning to develop a software
    that would require frequent overhauls and has to keep up with the technology landscape
    and customer requirements, Agile is the best approach to follow. The Waterfall
    model exhibits a project mindset and lays its focus strictly on the completion
    of project development, while Agile introduces a product mindset that focuses
    on ensuring that the developed product satisfies its end customers, and changes
    itself as the requisites of customers change. The Agile Manifesto is comprised
    of four foundational values and 12 supporting principles which lead the Agile
    approach to software development. Each Agile methodology applies the four values
    in different ways, but all of them rely on them to guide the development and delivery
    of high-quality, working software. Individuals and Interactions Over Processes
    and Tools: The first value in the Agile Manifesto is “Individuals and interactions
    over processes and tools.” Valuing people more highly than processes or tools
    is easy to understand because it is the people who respond to business needs and
    drive the development process. If the process or the tools drive development,
    the team is less responsive to change and less likely to meet customer needs.
    Communication is an example of the difference between valuing individuals versus
    process. In the case of individuals, communication is fluid and happens when a
    need arises. In the case of process, communication is scheduled and requires specific
    content. Working Software Over Comprehensive Documentation: Historically, enormous
    amounts of time were spent on documenting the product for development and ultimate
    delivery. Technical specifications, technical requirements, technical prospectus,
    interface design documents, test plans, documentation plans, and approvals required
    for each. The list was extensive and was a cause for the long delays in development.
    Agile does not eliminate documentation, but it streamlines it in a form that gives
    the developer what is needed to do the work without getting bogged down in minutiae.
    Agile documents requirements as user stories, which are sufficient for a software
    developer to begin the task of building a new function. The Agile Manifesto values
    documentation, but it values working software more. Customer Collaboration Over
    Contract Negotiation: Negotiation is the period when the customer and the product
    manager work out the details of a delivery, with points along the way where the
    details may be renegotiated. Collaboration is a different creature entirely. With
    development models such as Waterfall, customers negotiate the requirements for
    the product, often in great detail, prior to any work starting. This meant the
    customer was involved in the process of development before development began and
    after it was completed, but not during the process. The Agile Manifesto describes
    a customer who is engaged and collaborates throughout the development process,
    making. This makes it far easier for development to meet their needs of the customer.
    Agile methods may include the customer at intervals for periodic demos, but a
    project could just as easily have an end-user as a daily part of the team and
    attending all meetings, ensuring the product meets the business needs of the customer.
    Responding to Change Over Following a Plan: Traditional software development regarded
    change as an expense, so it was to be avoided. The intention was to develop detailed,
    elaborate plans, with a defined set of features and with everything, generally,
    having as high a priority as everything else, and with a large number of many
    dependencies on delivering in a certain order so that the team can work on the
    next piece of the puzzle. With Agile, the shortness of an iteration means priorities
    can be shifted from iteration to iteration and new features can be added into
    the next iteration. Agile’s view is that changes always improve a project; changes
    provide additional value. Perhaps nothing illustrates Agile’s positive approach
    to change better than the concept of Method Tailoring, defined in An Agile Information
    Systems Development Method in use as: “A process or capability in which human
    agents determine a system development approach for a specific project situation
    through responsive changes in, and dynamic interplays between contexts, intentions,
    and method fragments.” Agile methodologies allow the Agile team to modify the
    process and make it fit the team rather than the other way around. On the other
    hand, the Twelve Principles are the guiding principles for the methodologies that
    are included under the title “The Agile Movement.” They describe a culture in
    which change is welcome, and the customer is the focus of the work. They also
    demonstrate the movement’s intent as described by Alistair Cockburn, one of the
    signatories to the Agile Manifesto, which is to bring development into alignment
    with business needs. The twelve principles of agile development include: Customer
    satisfaction through early and continuous software delivery – Customers are happier
    when they receive working software at regular intervals, rather than waiting extended
    periods of time between releases. Accommodate changing requirements throughout
    the development process – The ability to avoid delays when a requirement or feature
    request changes. Frequent delivery of working software – Scrum accommodates this
    principle since the team operates in software sprints or iterations that ensure
    regular delivery of working software. Collaboration between the business stakeholders
    and developers throughout the project – Better decisions are made when the business
    and technical team are aligned. Support, trust, and motivate the people involved
    – Motivated teams are more likely to deliver their best work than unhappy teams.
    Enable face-to-face interactions – Communication is more successful when development
    teams are co-located. Working software is the primary measure of progress – Delivering
    functional software to the customer is the ultimate factor that measures progress.
    Agile processes to support a consistent development pace – Teams establish a repeatable
    and maintainable speed at which they can deliver working software, and they repeat
    it with each release. Attention to technical detail and design enhances agility
    – The right skills and good design ensures the team can maintain the pace, constantly
    improve the product, and sustain change. Simplicity – Develop just enough to get
    the job done for right now. Self-organizing teams encourage great architectures,
    requirements, and designs – Skilled and motivated team members who have decision-making
    power, take ownership, communicate regularly with other team members, and share
    ideas that deliver quality products. Regular reflections on how to become more
    effective – Self-improvement, process improvement, advancing skills, and techniques
    help team members work more efficiently. The intention of Agile is to align development
    with business needs. People and interactions are emphasized rather than process
    and tools. Customers, developers and testers constantly interact with each other.
    Emerging Methodologies in Information Systems Development Designing and developing
    information systems involves carefully managing people, processes, tools and technology.
    It necessitates having a clear understanding of the role each entity plays, and
    overseeing the relationships between them. The intricacies of designing and developing
    systems vary, depending on the size of the systems in question. Over the years,
    software and technology experts have adopted various methodologies that assist
    system architects and solution providers in the design and implementation process.
    These methodologies are continually evolving, seeking better ways of addressing
    common problems faced during the development life cycle of a system. One of these
    emerging methodologies is the use and adoption of agile methods in the design
    and development of systems. Agile methods propose a different approach to developing
    software systems, by paying less attention to conventional methods of excessive
    planning, heavy documentation, and legal contracts, and focusing more on the light-weight
    methods such as quick response to changes, teamwork and effective communication,
    amongst others. Many arguments have been put forward to suggest that agile methods
    are applicable only in the development of small to medium sized systems, questioning
    their suitability in large systems. A typical information systems development
    usually has three (3) stakeholders namely; Users – Users are the ones who use
    the system after it has been developed to perform their day to day tasks. Project
    Sponsors - This category of the stakeholders is responsible for the financial
    aspect of the project and ensuring that the project is completed. Developers –
    This category is usually made up of systems analysts and programmers. The system
    analysts are responsible for collecting the user requirements and writing system
    requirements. The programmers develop the required system based on the system
    requirements that is developed by the system analysts. The most important stakeholders
    in a project are users. For a project to be accepted as being completed, the users
    must accept it and use it. If the users do not accept the system, then the project
    is a failure. System analysis is concerned with understanding the business objectives,
    goals and developing business processes. The end product of systems analysis is
    systems specifications. System design on the other hand, uses the output from
    system analysis as its input. The main objective of system design is to interpret
    the system requirements into architectural, logical and physical designs of how
    the information system will be implemented. Using today''s fast broadband connection,
    it''s possible to stream sophisticated content to a computer anywhere in the world.
    This is an advantage for many people as the information can be received and read
    wherever and whenever it is convenient for them, which can be a crucial factor
    for a busy executive. A significant amount of interactive multimedia content is
    now delivered via the Internet. Chapter  8 Creating An Effective Information Architecture
    A good IA helps people to understand their surroundings and find what they’re
    looking for – in the real world as well as online. Practicing information architecture
    involves facilitating the people and organizations we work with to consider their
    structures and language thoughtfully. Many people are curious how IA is related
    to user experience (UX) design. UX designers practice IA everyday; the two are
    closely connected. Put simply, IA is an important skill within UX and other disciplines,
    such as content strategy, technical writing, library science and interaction design.
    Information architecture is the practice of deciding how to arrange the parts
    of something to be understandable. If you’ve ever tried to use something and thought,
    “where am I supposed to go next?” or “this doesn’t make any sense,” you are encountering
    an issue with an information architecture. Information architecture is similar,
    but relates to websites and digital products instead of physical buildings. Formally
    defined, Information Architecture, or IA, is the structural design of information
    or content (including text, photos, and videos), within a digital product. It
    focuses on organizing and labeling websites so that users can find what they are
    looking for. In practice IA is about organizing information, that is: categorizing
    content, creating a consistent navigation, site map, and naming individual content
    groups. It is also the skeleton of the whole project, on the basis of which you
    create further views, visual elements, interactions or functionality. IA allows
    the user to reach the content easily, without much effort. For example the inadequate
    structure of a website will discourage and frustrate site visitors. The organization
    of information in an online product itself depends on the users’ needs, but also
    on business priorities. For example, the structure of the information in the case
    of a blog or a landing page will look very different. The IA designer is a complement
    to the design team. With contributing task including research, navigation, data
    modeling and labeling. The IA architect is responsible for how a user will navigate
    through the web product and reach the relevant information. The way in which users
    will use an application or website depends largely on how information is presented
    and organized. So why is Information Architecture important for businesses? In
    order to take care of a well-designed information architecture, you should answer
    to questions like: How do you organize and divide information? How do you present
    information? How do you communicate the way you navigate through the site? How
    will the user navigate on the site? How will the user look for information? The
    components that make up a good IA are: Organization system Labeling system Navigation
    system Searching system A well-designed information architecture is an intuitive
    and has efficient user experience. For this reason, not only UX skills are necessary
    to create a good web product, IA skills are equally important. Only then can it
    be possible to create a project meeting the users’ needs. What are the tools and
    templates for IA? On the market, we find a lot of tools for creating an information
    architecture. The simplest views can be created using tools such as Microsoft
    Visio. One can also present information architecture as a simple diagram. This
    version works well even with very large pages or applications. Diagrams are often
    used for site maps that are based on a previously created information architecture.
    Creating An Effective Information Architecture For A Site If you want to design
    an effective information architecture that will make your site more useful and
    legible, then you need to go through the stages of the design process which includes.
    User research: Work on information architecture should begin with user research
    and analysis. An important part of this process is to understand the needs and
    problems of product users and to reconcile them with the business goals. A number
    of tools can be used for that purpose: card sorting, user interviews, focus groups
    or surveys. Navigation: The next step is to define the navigation, the hierarchy
    of the individual pages, and to design how and when to display them. At this stage,
    we can use programs for mind mapping or diagrams for that. Labeling: Once the
    information structure has been developed, it’s time to name the sections and pages
    so that they are understandable to the user. They also make it easier to navigate
    the page. Wireframing: The next step is to make wireframes that will be based
    on IA. By using them, we define a visual hierarchy of information on the page
    as well as connections between subsequent views of the application. So when do
    you create an IA for your digital product? The importance and value of information
    architecture will be recognized by designing an extensive website or application.
    In that case, it is worthwhile to work on Information Architecture at the beginning
    of the design process – after recognizing the users of the product, but before
    creating wireframes and mockups. To do this, you need to understand how the pieces
    fit together to create the larger picture, how items relate to each other within
    the system. As a result, your IA informs the content strategy through identifying
    word choice as well as informing user interface design and interaction design
    through playing a role in the wireframing and prototyping processes. To be successful,
    you need a diverse understanding of industry standards for creating, storing,
    accessing and presenting information. How do you categorize and structure information?
    Labeling Systems: How you represent information Navigation Systems: How users
    browse or move through information Search Systems: How users look for information
    In order to create these systems of information, you need to understand the interdependent
    nature of users, content, and context.  Context: business goals, funding, politics,
    culture, technology, resources, constraints Content: content objectives, document
    and data types, volume, existing structure, governance and ownership Users: audience,
    tasks, needs, information-seeking behavior, experience Modern use of the term
    IA, strictly related to the design of information, was officially introduced in
    the mid-1970s at the American Institute of Architecture conference where a man
    named Richard Saul Wurman introduced an idea that he called ‘the architecture
    of information’. Later on, in 1996, Wurman published his ideas in a book called
    Information Architects. It included a collection of works and graphics by designers
    whose work exemplified the term information architecture. Two years later, a book
    called Information Architecture for the World Wide Web was published and quickly
    became a best-seller. This book presented frameworks for design and organization
    of content within complex websites. Further editions of this book, evolved and
    expanded on its definition of information architecture. Today, there exists a
    robust job market for information architects, tens of millions of webpages that
    reference information architecture, and even a professional organization called
    the Information Architecture Institution. At the Xerox Palo Alto Research Center
    were a group of people responsible for developing technology that could support
    the ‘architecture of information’. They were single-handedly responsible for many
    important contributions in what is today known as human-computer interaction.
    They introduced the first person computer with a user-friendly interface, laser
    printing, and the first WYSIWYG text editor. Effective IA depends on the interplay
    between three things: Ontology, Taxonomy, and Choreography. Ontology is the meaning
    of the product’s elements. Example: Labels - easily understood names given to
    individual categories ‘Produce’ is a label given to things like apples, bananas,
    celery. Tags - data about content that helps to organize it at a deeper level
    Restaurants are given tags like ‘Sushi Bars’, ‘Vegan’, ‘Russian’. These can help
    users to find a better match for their preferences. Taxonomy is the science or
    technique of classification, putting like elements together. Taxonomic hierarchy
    is used to rank information. Things can be ranked in different ways, for example:
    importance/frequency of use, recency, alphabetically, numerically, etc. An example
    of taxonomy: scientific classification system for an American Black Bear. Choreography
    can be represented as a user flow, the path through a product that a user can
    take to accomplish a task. Very simple example of potential user flow for eCommerce
    and Membership/Subscription. These set of principles can be used to evaluate existing
    IA and help to predict the effectiveness of design and help answer questions such
    as: IS IT FINDABLE? Can the user locate what they’re trying to find? Is there
    more than one way to access things? How does findability differ across devices
    and platforms? IS IT ACCESSIBLE? Can it be used across all expected devices and
    channels? Is the product resilient and consistent across channels? Does it meet
    standards of accessibility for target audiences? Is it friendly towards visual/hearing
    impaired users? IS IT CLEAR (EASILY PERCEPTIBLE)? Easy to understand? Is the target
    demographics’ grade and reading level considered? Is the path to task completion
    obvious and free of distraction? Is it communicative (talkative, informative,
    timely)? Are messaging and copy effective for users to complete the tasks at hand?
    Do navigation labels and messaging help \`user orient themselves within the product?
    Are labels and messaging consistent across the product and its channels? IS IT
    USEFUL? Are users capable of producing intended result? IS IT USABLE? Users able
    to complete task without frustration? IS IT CREDIBLE? Is content up to date, updated
    in a timely matter? Is it easy to contact a real person? Easy to verify product
    security when making payments? IS IT CONTROLLABLE? Are tasks and info a user would
    want to accomplish available? How well are errors anticipated and eliminated?
    How easily can user recover from errors? Are there features that allow users to
    tailor info/functionality to their context? Are exits and other important controls
    clearly marked? IA is all about making the complex clear and helping users find
    information and complete tasks. Do this by understanding how the pieces fit together
    to create the larger pictures, and how items relate to each other within the system.
