    so that users can find what they are looking for. In practice IA is about organizing
    information, that is: categorizing content, creating a consistent navigation,
    site map, and naming individual content groups. It is also the skeleton of the
    whole project, on the basis of which you create further views, visual elements,
    interactions or functionality. IA allows the user to reach the content easily,
    without much effort. For example the inadequate structure of a website will discourage
