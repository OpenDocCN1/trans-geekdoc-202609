    Artificial intelligence (AI) is simply an area of computer science that emphasizes
    the creation of intelligent machines that work and react like humans. Robotics
    is also a major field related to AI. Robots require intelligence to handle tasks
    such as object manipulation and navigation, along with sub-problems of localization,
    motion planning and mapping. Problem Solving in games such as “Sudoku” can be
    an example. It can be done by building an artificially intelligent system to solve
    that particular problem. It can be done by building an artificially intelligent
    system to solve that particular problem. Borrowing from the management literature,
    Kaplan and Haenlein classify artificial intelligence into three different types
    of AI systems: Analytical Human-inspired Humanized artificial intelligence. Analytical
    AI has only characteristics consistent with cognitive intelligence; generating
    a cognitive representation of the world and using learning based on past experience
    to inform future decisions. Human-inspired AI has elements from cognitive and
    emotional intelligence; understanding human emotions, in addition to cognitive
    elements, and considering them in their decision making. Humanized AI shows characteristics
    of all types of competencies (i.e., cognitive, emotional, and social intelligence),
    is able to be self-conscious and is self-aware in interactions with others. In
    the twenty-first century, AI techniques have experienced a resurgence following
    concurrent advances in computer power, large amounts of data, and theoretical
    understanding; and AI techniques have become an essential part of the technology
    industry, helping to solve many challenging problems in computer science, software
    engineering and operations research. What are some of the factors accelerating
    the growth of Artificial Intelligence (AI)? The innovation and research directed
    by the best tech companies are affecting industry verticals. Though technology
    has ever been a very important element for all these industries, AI is bringing
    technology to the center of every company. AI is going to be infused to virtually
