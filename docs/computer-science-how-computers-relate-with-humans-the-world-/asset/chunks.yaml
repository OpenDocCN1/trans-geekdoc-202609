    process and make it fit the team rather than the other way around. On the other
    hand, the Twelve Principles are the guiding principles for the methodologies that
    are included under the title “The Agile Movement.” They describe a culture in
    which change is welcome, and the customer is the focus of the work. They also
    demonstrate the movement’s intent as described by Alistair Cockburn, one of the
    signatories to the Agile Manifesto, which is to bring development into alignment
    with business needs. The twelve principles of agile development include: Customer
    satisfaction through early and continuous software delivery – Customers are happier
    when they receive working software at regular intervals, rather than waiting extended
    periods of time between releases. Accommodate changing requirements throughout
    the development process – The ability to avoid delays when a requirement or feature
    request changes. Frequent delivery of working software – Scrum accommodates this
    principle since the team operates in software sprints or iterations that ensure
    regular delivery of working software. Collaboration between the business stakeholders
    and developers throughout the project – Better decisions are made when the business
