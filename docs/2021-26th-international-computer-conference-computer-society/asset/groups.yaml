    \ $k$，我们的方法复杂度为 $O(k \\log N)$。\n\n## D. Critic 网络（Critic Network）\n\n如图 1 所示，Critic\
    \ 网络接收 $(s_i, action)$ 对并输出动作值 $Q(s, t)$，即表示动作 $a_i$ 的 $Q$ 函数。Critic 使用带有参数 $\\\
