    **Abstract—Recently**, interactive recommendation systems based on reinforcement
    learning have been addressed by researchers to consider the recommendation procedure
    as a dynamic process and update the recommendation model in immediate user feedback,
    which is neglected in traditional methods. The existing works have two significant
    drawbacks. Firstly, rethink ranking function to produce the Top-N recommendation
    list. Secondly, focusing on recommendation accuracy cannot evaluate metrics sufficiently.
    This paper proposes a reinforcement learning based system by utilizing Actor-Critic
    architecture to model dynamic users'' interaction with the recommender to maximize
    cumulative reward. Furthermore, we utilize Spotify’s Attention algorithm to find
    the most similar items generated by action history so that the Total Diversity
    Ranking is used to improve relevance and diversity. Moreover, we employ personally
    to compute representations of the user''s interaction sequence

    **Index—** reinforcement learning, recommendation systems, nearest neighbor


    users'' interest may vary depending on their mood or temper. Due to the recent
    advancement in deep reinforcement learning and outstanding successes in various
    tasks such as playing games [6–8], robotics [9], and other sequential decision
    making problems [11], many studies focus on reinforcement learning based systems
    large state space, which is the nature of recommendation systems. Past reinforcement
    learning methods such as Q-Learning and Partially Observable Markov Decision Processes
    (POMDP) are early efforts to model recommendation procedure as a reinforcement
    learning problem. However, these methods become ineffective with the growing number
    of items in the recommendation process. Convolution Deep Q-Network (DQN) based
    techniques [14] utilize a deep neural network to estimate Q-values for all items
    in action space to take the best action with maximum Q-value in the current state.
    Although these techniques do not require to store Q values, the metric of Q-value
    evaluation to determine the best action is linked to the size of the action space


    # I. INTRODUCTION


    The majority of conventional systems consider the recommendation procedure as
    a static process. In other words, the system has no history of the users and cannot
    provide the recommendation model based on the users'' preferences and long-term
    feedback. On the other hand, interactive recommendation systems can dynamically
    modify its model to the users'' preferences. Some works [1–5] formulated the recommendation
    as multi-armed bandit problem. These works suggest that users'' preferences may
    be left unchanged, but it''s evident that the users'' preferences may change over
    time, for the example,


    it is here in recent years, some [15–17] to leverage deep neural networks as utilizes
    policy and value function estimators. The policy network is the actor, and the
    value network (critic) is known as the critic. In this architecture, actor-network
    generates a continuous value as action used to rank candidate items. The critic
    evaluates the action generated by the actor using the Temporal Difference (TD)
    learning solving these equations. However, there are two limitations: Firstly,
    a ranking function is applied to all items in action space used to produce recommendations
    by selecting items with the highest'
