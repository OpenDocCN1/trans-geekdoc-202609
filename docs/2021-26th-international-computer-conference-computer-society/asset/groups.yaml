    - Reward: based on the choice $a_t$ in $s_t$ made by the recommender agent, a
    diverse yet relevant items is recommended to the user. The user interacts with
    these items and provides feedback, e.g., rating, click, or purchase, and the recommender
    receives immediate reward.

    - Transition: The user''s state changes from $s_t$ to $s_{t+1}$ when the recommender
    agent takes action $a_t$ at time step. If the user ignores the recommended list,
    the next state remains unchanged (i.e., $s_{t+1} = s_t$). Otherwise, the next
    state $s_{t+1}$ updates based on user''s feedback.

    - Discount: $\gamma \in [0,1]$ is a factor that determines the importance of future
    rewards relative to immediate reward. If $\gamma=0$, the agent is short-sighted
    by only considering immediate rewards. On the contrary, if $\gamma=1$, it prefers
    long-term rewards. The expected cumulative reward at time step $t$ is denoted
    as $G_t = \sum_{k=0}^{\infty} \gamma^k R(s_{t+k})$


