    environment); then, users choose one of them. The recommender agent performs this
    process sequentially over time steps to maximize cumulative reward. We model the
    recommendation process as a Markov Decision Process (MDP), which we adopted in
    reinforcement learning. An MDP is a markov process described as follows:


    +   - State: $s_t$ is defined as embeddings of user''s positive preference before
    time step $t$

    - Action: $a_t \in \mathbb{R}$ is a continuous parameter vector used to construct
