- raw: 'Main Concept: Hierarchical clustering is an unsupervised machine learning
    algorithm used to build a hierarchy of clusters. It works by either merging smaller
    clusters into larger ones (agglomerative approach) or by splitting larger clusters
    into smaller ones (divisive approach).


    Main Purpose: The primary goal of hierarchical clustering is to create a multi-level
    hierarchy of clusters, allowing the exploration of data at different levels of
    granularity. This approach provides a tree-like structure called a dendrogram,
    which visualizes the nested grouping of data points.


    When to Use It:


    ❑  When the number of clusters is unknown and needs to be determined through exploration.


    ❑  For visualizing hierarchical relationships in data.


    ❑  When the dataset is small to medium-sized, hierarchical clustering can be computationally
    intensive for large datasets.


    Real-World Examples:


    ❑  Gene Expression Data Analysis: Grouping genes with similar expression patterns
    across different conditions.


    ❑  Document Clustering: Organizing documents into a hierarchy based on content
    similarity.


    Math Background:


    ❑  Distance Metrics: Commonly used metrics include Euclidean distance, Manhattan
    distance, and cosine similarity.


    ❑  Linkage Criteria: Determines how the distance between clusters is computed.
    Common methods include:


    Single Linkage: Minimum distance between points in different clusters.


    Complete Linkage: Maximum distance between points in different clusters.


    Average Linkage: Average distance between points in different clusters.


    Ward''s Method: Minimizes the total within-cluster variance.


    Loss Function:


    Hierarchical clustering does not have a specific loss function like K-Means but
    aims to optimize a criterion based on the chosen linkage method, such as minimizing
    within-cluster variance or maximizing inter-cluster distance.


    Pros and Cons:


    ☺  Pros:


    ⇨  Does not require the number of clusters to be specified in advance.


    ⇨  Produces a dendrogram, which provides insight into the data structure.


    ⇨  Can capture complex hierarchical relationships in the data.


    ☹  Cons:


      Computationally expensive, especially for large datasets.


      Sensitive to noise and outliers.


      Results can be difficult to interpret if the dendrogram is very large.


    Illustrative Figure:


    ––––––––


    ![](images/image-HLHU7D1U.png)


    ## 4.3  DBSCAN (Density-Based Spatial Clustering of Applications with Noise)


    Main Concept: DBSCAN is a density-based clustering algorithm that groups points
    that are closely packed, defining clusters as areas of high density separated
    by areas of low density.


    Main Purpose: It is particularly effective at identifying clusters of arbitrary
    shapes and handling noise in the data.


    When to Use It:


    ❑  When dealing with data containing noise and outliers. When clusters have irregular
    shapes and densities.


    Real-World Examples:


    ❑  Anomaly Detection: Identifying fraudulent transactions in credit card data.


    ❑  Urban Planning: Identifying areas of high population density in a city.


    Math Background:


    ❑  Based on two parameters: ε (epsilon) and MinPts (minimum number of points).


    ❑  Core points, border points, and noise points are defined based on the density
    within ε.


    Loss Function:


    No explicit loss function; based on density reachability and density connectivity.


    Pros and Cons:


    ☺  Pros:


    ⇨  Robust to outliers and noise.


    ⇨  Can find arbitrarily shaped clusters.


    ☹  Cons:


      Sensitivity to the choice of ε and MinPts parameters.


      Difficulty handling clusters of varying densities.


    Illustrative Figure:


    ![](images/image-9JO8LGV6.png)


    ## 4.4  Gaussian Mixture Model (GMM)


    Main Concept: A Gaussian Mixture Model (GMM) is a probabilistic model used for
    representing normally distributed subpopulations within an overall population.
    It assumes that the data is generated from a mixture of several Gaussian distributions,
    each with its own mean and variance.


    Main Purpose: The primary goal of GMM is to model the underlying data distribution
    as a combination of multiple Gaussian distributions, providing a flexible method
    for clustering, density estimation, and anomaly detection.


    When to Use It:


    ❑  When the data exhibits multimodal distributions.


    ❑  For clustering tasks where clusters may have different shapes and sizes.


    ❑  When a probabilistic framework is beneficial for the application, such as in
    expectation-maximization algorithms.


    Real-World Examples:


    ❑  Speech Recognition: Modeling different phonemes in a speech signal.


    ❑  Image Segmentation: Identifying different regions within an image based on
    pixel intensities.


    Math Background:


    ![](images/image-LONVR4RL.png)


    Expectation-Maximization (EM) Algorithm:


    ❑  E-step: Calculate the probability that each data point belongs to each Gaussian
    component.


    ❑  M-step: Update the parameters of the Gaussian components (mean, covariance,
    and mixture weights) to maximize the likelihood of the data.


    ![](images/image-OPCAJSQP.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  Can model complex data distributions with multiple modes.


    ⇨  Provides a probabilistic framework, which is useful for many applications.


    ⇨  Flexibility in representing clusters with different shapes and sizes.


    ☹  Cons:


      Computationally expensive, especially for large datasets and high-dimensional
    data.


      Sensitive to initialization, may converge to local optima.


      Requires specifying the number of components (K) in advance.


    Illustrative Figure:


    ![](images/image-O1IMSZUN.png)


    ## 4.5  Affinity Propagation


    Main Concept: Affinity Propagation is a clustering algorithm that identifies exemplars
    among data points and forms clusters based on message passing between data points.
    It does not require specifying the number of clusters in advance, which distinguishes
    it from many other clustering algorithms.


    Main Purpose: The primary goal of Affinity Propagation is to find a set of representative
    data points (exemplars) that best capture the structure of the dataset. It achieves
    this by iteratively passing messages between data points until convergence.


    When to Use It:


    ❑  When the number of clusters is unknown and needs to be determined through the
    algorithm.


    ❑  For clustering tasks where choosing appropriate initial cluster centers is
    challenging.


    ❑  When working with data that can be effectively represented by pairwise similarities.


    Real-World Examples:


    ❑  Image Clustering: Grouping images into clusters based on visual similarity.


    ❑  Social Network Analysis: Identifying communities within social networks based
    on user interactions.


    Math Background:


    ![](images/image-Q4U8BMAD.png)


    Convergence: The algorithm converges when the messages stabilize, and the exemplars
    are identified.


    Loss Function:


    Affinity Propagation does not use a traditional loss function but aims to maximize
    the sum of similarities between data points and their chosen exemplars.


    Pros and Cons:


    ☺  Pros:


    ⇨  Does not require specifying the number of clusters in advance.


    ⇨  Can handle non-convex clusters and arbitrary cluster shapes.


    ⇨  Often finds clusters that are more meaningful than those found by methods requiring
    predefined cluster numbers.


    ☹  Cons:


      Computationally intensive for large datasets.


      Requires careful tuning of parameters, such as the preference parameter.


      Sensitive to the choice of similarity measure.


    Illustrative Figure:


    ![](images/image-VGUJ18B5.jpg)


    ## 4.6  Spectral Clustering


    Main Concept: Spectral clustering is an unsupervised learning algorithm that uses
    the eigenvalues (spectrum) of a similarity matrix to perform dimensionality reduction
    before clustering in fewer dimensions. It transforms the data into a lower-dimensional
    space in which clusters become more distinct and easier to identify.


    Main Purpose: The primary goal of spectral clustering is to find clusters of data
    points by leveraging the structure of the data represented by the graph Laplacian,
    effectively capturing complex, non-convex cluster structures.


