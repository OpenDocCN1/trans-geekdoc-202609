    \n❑ For short-term forecasting where recent data is more indicative of future\
    \ values.\n\n❑ Suitable for data without significant seasonality (simple exponential\
    \ smoothing) or with trends and seasonality (Holt-Winters).\n\nReal-World Examples:\n\
    \n❑ Inventory Management: Predicting future inventory requirements based on past\
    \ sales data.\n\n❑ Finance: Forecasting stock prices or economic indicators.\n\
    \n❑ Energy Consumption: Predicting future electricity usage.\n\n❑ Weather Forecasting:\
    \ Short-term weather predictions.\n\nMath Background:\n\n![](images/image-528N32O8.png)\
    \  \n\n![](images/image-32H92L59.png)  \n\n![](images/image-8AZW3M73.png)\n\n\
    Steps in Exponential Smoothing:\n\n❑ Model Selection: Choose the appropriate exponential\
    \ smoothing model (simple, Holt’s, or Holt-Winters).\n\n❑ Parameter Estimation:\
    \ Estimate the smoothing parameters (α, β, γ) using optimization techniques.\n\
    \n❑ Model Fitting: Fit the model to the historical data.\n\n❑ Diagnostic Checking:\
    \ Check the residuals of the model to ensure they are white noise.\n\n❑ Forecasting:\
    \ Use the fitted model to make predictions about future values.\n\nPros and Cons:\n\
    \n☺ Pros:\n\n⇨ Simple and easy to implement.\n\n⇨ Effective for short-term forecasting.\n\
    \n⇨ Can handle data with trends and seasonality (Holt-Winters).\n\n☹ Cons:\n\n\
     Assumes linear relationships and may not perform well with non-linear patterns.\n\
    \n Requires selection and optimization of multiple parameters.\n\n May not be\
    \ suitable for long-term forecasting due to reliance on recent data.\n\nIllustrative\
    \ Figure:\n\n![](images/image-D31LUNY2.png)\n\n## 11.5 Deep AR\n\nMain Concept:\
    \ DeepAR is a probabilistic forecasting model based on autoregressive recurrent\
    \ neural networks (RNNs). It is designed to predict future values in time series\
    \ data by leveraging the power of deep learning. Unlike traditional methods, DeepAR\
    \ can handle multiple related time series and produce probabilistic forecasts.\n\
    \nMain Purpose: To forecast time series data with complex patterns, including\
    \ seasonality, trends, and non-linear relationships, while providing uncertainty\
    \ estimates.\n\nWhen to Use It:\n\n❑ When dealing with large collections of related\
    \ time series.\n\n❑ For probabilistic forecasting where prediction intervals are\
    \ important.\n\n❑ Suitable for complex time series data with non-linear patterns.\n\
    \nReal-World Examples:\n\n❑ Retail: Forecasting product demand across multiple\
    \ stores and products.\n\n❑ Finance: Predicting stock prices and financial metrics.\n\
    \n❑ Energy: Forecasting electricity demand across different regions.\n\n❑ Healthcare:\
    \ Predicting patient admissions or disease outbreaks.\n\nMath Background:\n\n\
    ![](images/image-GCURFS8I.png)  \n\n![](images/image-AE04CHR5.png)\n\nSteps in\
    \ DeepAR:\n\n❑ Data Preparation: Collect and preprocess the time series data and\
    \ covariates.\n"
  trans: "\n❑ 当处理具有明确季节性模式的时间序列数据时。\n\n❑ 基于过去值（包括季节性波动）预测未来值。\n\n❑ 适用于具有趋势、季节性和其他周期性行为的数据。\n\
    \n实际案例：\n\n❑ 零售销售预测：预测在节假日期间会出现季节性峰值的月度销售。\n\n❑ 天气预测：预测温度、降水等气象变量，这些变量表现出季节性变化。\n\
    \n❑ 电力需求：预测电力消耗，其具有季节性变化。\n\n❑ 旅游业：预测游客到访量，通常遵循季节性模式。\n\n数学背景：\n\n![](img/image-WL6YPEK7.png)\
    \  \n\n![](img/image-9QXAR9QQ.png)  \n\n结合 SARIMA 模型：\n\nSARIMA(p,d,q) (P,D,Q)\
    \ s\n\np：非季节性 AR 部分的阶数。\n\nd：非季节性差分的阶数。\n\nq：非季节性 MA 部分的阶数。\n\nP：季节性 AR 部分的阶数。\n\
    \nD：季节性差分的阶数。\n\nQ：季节性 MA 部分的阶数。\n\ns：季节性周期的长度。\n\n损失函数：\n\n![](img/image-U0TGYZWO.png)\
    \  \n\nSARIMA 的步骤：\n\n❑ 识别：使用自相关函数（ACF）和部分自相关函数（PACF）图等工具确定 p、d、q、P、D、Q、s 的值。\n\
    \n❑ 估计：估计非季节性和季节性组件的参数。\n\n❑ 诊断检查：检查模型的残差，确保它们是白噪声。\n\n❑ 预测：利用模型对未来值进行预测。\n\n\
    优缺点：\n\n优点：\n\n⇨ 有效捕获季节性和非季节性模式。\n\n⇨ 为复杂季节性时间序列提供全面的预测框架。\n\n⇨ 在时间序列分析中已被广泛理解和使用。\n\
    \n缺点：\n\n 需要仔细识别和调谐许多参数。\n\n 计算开销大，尤其是在长季节周期时。\n\n 解释和诊断模型可能复杂。\n\n示例图：\n\n\
    ![](img/image-5RG56JTZ.png)\n\n## 11.3 SARIMAX（季节性 ARIMA 与外生变量）\n\n主要概念：SARIMAX\
    \ 是 SARIMA 的扩展，加入了外生变量（预测器）以模拟外部因素对时间序列的影响。它同时包含季节性和非季节性组件，以及外部回归器，提供更全面的预测模型。\n\
    \n主要目的：通过捕捉时间结构和外部变量的影响，分析和预测时间序列数据。\n\n使用场景：\n\n❑ 处理具有季节性模式且受外部因素影响的时间序列数据时。\n\
    \n❑ 预测未来值，且外部变量在预测中起重要作用。\n\n❑ 适用于存在趋势、季节性和外部影响的数据。\n\n实际案例：\n\n❑ 经济：预测国内生产总值（GDP），并加入利率、通胀等外部指标。\n\
    \n❑ 销售预测：预测销售额，并考虑营销支出和经济指标。\n\n❑ 天气预测：预测天气模式，加入地理因素等外部变量。\n\n❑ 能源需求：预测电力消耗，考虑温度、人口增长等外部变量。\n\
    \n数学背景：\n\n![](img/image-5N1AQJTM.png)  \n\n![](img/image-UOLEJ637.png)  \n\n\
    结合 SARIMAX 模型：\n\nSARIMAX(p,d,q)(P,D,Q)s+Xt\n\np：非季节性 AR 部分的阶数。\n\nd：非季节性差分的阶数。\n\
    \nq：非季节性 MA 部分的阶数。\n\nP：季节性 AR 部分的阶数。\n\nD：季节性差分的阶数。\n\nQ：季节性 MA 部分的阶数。\n\ns：季节性周期的长度。\n\
    \nXt：时间 t 的外生变量。\n\n![](img/image-L0GNSSHI.png)  \n\nSARIMAX 的步骤：\n\n❑ 识别：使用 ACF、PACF\
    \ 等工具确定 p、d、q、P、D、Q、s，并选择外生变量。\n\n❑ 估计：估计非季节性、季节性组件以及外生变量的参数。\n\n❑ 诊断检查：检查模型残差，确保它们是白噪声。\n\
    \n❑ 预测：利用模型预测未来值，并纳入外生变量。\n\n优缺点：\n\n优点：\n\n⇨ 捕获季节性和非季节性模式。\n\n⇨ 考虑外部变量的影响，提高预测准确性。\n\
    \n⇨ 适合包含多种影响因素的复杂时间序列数据。\n\n缺点：\n\n 需要仔细识别和调谐许多参数。\n\n 计算开销大，尤其是长季节周期和多个外生变量时。\n\
    \n 解释和诊断模型可能复杂。\n\n示例图：\n\n![](img/image-KFBM7NIL.png)\n\n## 11.4 指数平滑\n\n主要概念：指数平滑是一种时间序列预测方法，对过去观测值使用加权平均，权重随观测值的年龄指数衰减。该技术适用于短期预测。\n\
    \n主要目的：通过给近期观测更大权重，同时仍考虑历史数据，预测未来值。\n\n使用场景：\n\n❑ 处理可能存在趋势或季节性的时间序列数据。\n\n❑ 短期预测，近期数据更能反映未来趋势。\n\
    \n❑ 适用于无显著季节性（简单指数平滑）或具有趋势和季节性（Holt‑Winters）的数据。\n\n实际案例：\n\n❑ 库存管理：根据历史销售预测未来库存需求。\n\
    \n❑ 金融：预测股价或经济指标。\n\n❑ 能源消耗：预测未来电力使用量。\n\n❑ 天气预报：短期天气预测。\n\n数学背景：\n\n![](img/image-528N32O8.png)\
    \  \n\n![](img/image-32H92L59.png)  \n\n![](img/image-8AZW3M73.png)  \n\n指数平滑的步骤：\n\
    \n❑ 模型选择：选择合适的指数平滑模型（简单、Holt 或 Holt‑Winters）。\n\n❑ 参数估计：使用优化技术估计平滑参数（α、β、γ）。\n\
    \n❑ 模型拟合：将模型拟合到历史数据上。\n\n❑ 诊断检查：检查模型残差，确保它们是白噪声。\n\n❑ 预测：利用拟合模型预测未来值。\n\n优缺点：\n\
    \n优点：\n\n⇨ 实现简单，易于部署。\n\n⇨ 对短期预测有效。\n\n⇨ 可处理带有趋势和季节性的数据（Holt‑Winters）。\n\n缺点：\n\
    \n 假设线性关系，对非线性模式表现不佳。\n\n 需要选择并优化多个参数。\n\n 由于依赖近期数据，长期预测可能不准确。\n\n示例图：\n\n\
    ![](img/image-D31LUNY2.png)\n\n## 11.5 DeepAR\n\n主要概念：DeepAR 是一种基于循环神经网络（RNN）的概率预测模型，利用深度学习预测未来时间序列值。它能够处理多个相关的时间序列，并提供概率预测。\n\
    \n主要目的：预测具有复杂模式（包括季节性、趋势和非线性关系）的时间序列数据，同时给出不确定性估计。\n\n使用场景：\n\n❑ 处理大量相关的时间序列数据集。\n\
    \n❑ 需要概率预测并关注置信区间的场景。\n\n❑ 适用于模式复杂、非线性的时间序列数据。\n\n实际案例：\n\n❑ 零售：预测多个门店和商品的产品需求。\n\
    \n❑ 金融：预测股价和金融指标。\n\n❑ 能源：预测不同地区的电力需求。\n\n❑ 医疗：预测患者就诊人数或疾病爆发。\n\n数学背景：\n\n![](img/image-GCURFS8I.png)\
    \  \n\n![](img/image-AE04CHR5.png)  \n\nDeepAR 的步骤：\n\n❑ 数据准备：收集并预处理时间序列数据及协变量。\n\
    \n"
