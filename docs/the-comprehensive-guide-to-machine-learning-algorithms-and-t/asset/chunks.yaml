  trans: "\n-   结合 SMOTE 和 Tomek 链接的优势，平衡类别分布，减少噪声和重叠。\n\n-   通过提供更清洁且更具代表性的数据集，提升分类器性能。\n\
    \n☹ Cons:\n\n 由于合成采样和数据集清洗过程的结合，计算开销更大。\n\n 可能仍需仔细调参，以避免删除有用实例或生成非代表性的合成样本。\n\
    \nIllustrative Figure:\n\n![](img/image-NBQLF2L6.png)\n\n## 16. Fine-tune techniques\
    \ for LLMs\n\nFine-tuning 涉及在特定任务或数据集上对预训练的大语言模型进行微调，以提升其在特定应用中的性能。技术包括使用标记数据的监督微调、迁移学习和领域适应。Fine-tuning\
    \ 使得 LLMs 能够针对多种应用进行定制，从法律文档分析到客服聊天机器人。\n\n## 16.1 LoRA (Low-Rank Adaptation)\n\
    \nMain Concept: LoRA (Low-Rank Adaptation) 是一种针对大语言模型（LLMs）的微调技术，利用低秩矩阵分解高效、有效地适配预训练模型。通过将权重更新分解为低秩矩阵，LoRA\
    \ 旨在减少可训练参数的数量和计算需求，同时保持高性能。\n\nMain Purpose: 使大型预训练语言模型的微调更高效、更低计算和内存成本。\n\n\
    When to Use It:\n\n❑ 需要在计算资源有限的情况下，对大型预训练语言模型进行特定任务的微调。\n\n❑ 需要将大模型适配到新域或任务，而无需重新训练整个模型的应用场景。\n\
    \nReal-World Examples:\n\n❑ 文本分类：在标注数据有限的情况下，微调预训练模型用于特定的文本分类任务。\n\n❑ 情感分析：将语言模型适配到特定领域（如金融或医疗文本）的情感分析。\n\
    \n❑ 问答：提升预训练模型在定制问答数据集上的表现。\n\n❑ 机器翻译：微调多语言模型，提高特定语言对或领域的翻译准确率。\n\n❑ 命名实体识别（NER）：适配预训练模型，识别文本中的领域特定实体。\n\
    \nMath Background:\n\n![](img/image-NISQMC0A.png)  \n\n![](img/image-N9ROYK0I.png)\n\
    \nSteps in Using LoRA:\n\n❑ Pre-Training: 使用大型预训练语言模型。\n\n❑ Matrix Factorization:\
    \ 将权重更新分解为低秩矩阵 A 和 B。\n\n❑ Fine-Tuning: 在目标任务的数据集上仅更新低秩矩阵 A 和 B，保持原始权重 W 不变。\n\
    \n❑ Evaluation: 使用适当的指标评估微调后模型的性能。\n\n❑ Deployment: 将微调后的模型部署用于目标任务的推理。\n\nPros\
    \ and Cons:\n\n☺ Pros:\n\n⇨ 显著降低可训练参数数量，降低计算和内存需求。\n\n⇨ 在不进行大规模重训练的情况下，高效适配大型预训练模型到新任务。\n\
    \n⇨ 即使参数量少，仍保持高性能。\n\n☹ Cons:\n\n 对于极其复杂的适配任务，近似可能无法捕获所有细节。\n\n 需要仔细调整低秩阶 r\
    \ 和缩放因子 α 以达到最佳性能。\n\nIllustrative Figure:\n\n![](img/image-NQ6U6EK6.png)\n\n\
    ## 16.2 Quantized LoRA (QLoRA)\n\nMain Concept: QLoRA 是一种高效的大语言模型微调方法，显著降低内存占用，同时保持全\
    \ 16 位微调的性能。它通过在冻结的 4 位量化预训练语言模型上对低秩适配器进行反向传播来实现。\n\nMath Background:\n\n❑ Equation:\
    \ W′=W+Q(A)Q(B), Q(A), Q(B): 低秩矩阵的量化版本。\n\n❑ Objective: 优化量化矩阵，在降低内存占用的同时保持性能。\n\
    \nLoss Function:\n\nCommonly Used: 交叉熵损失、均方误差（MSE）等。\n\nPros and Cons:\n\n☺ Pros:\n\
    \n⇨ 进一步降低内存足迹和计算需求。\n\n⇨ 适合在边缘设备上部署。\n\n☹ Cons:\n\n 量化可能引入近似误差。\n\n 需要在压缩和准确性之间取得平衡。\n\
    \nWhen to Use It:\n\n❑ Edge Deployment: 在内存和计算能力有限的设备上部署模型时。\n\n❑ High Efficiency:\
    \ 当模型大小和速度是关键因素时。\n\nExample Use Cases:\n\n❑ Mobile Applications: 为移动应用微调模型，满足严格的内存和速度限制。\n\
    \n❑ IoT Devices: 部署模型到物联网设备，实现实时处理。\n\nIllustrative Figure:\n\n––––––––\n\n![](img/image-530XNNV3.png)\n\
    \n## 16.3 Parameter Efficient Fine Tuning (PEFT)\n\nMain Concept: PEFT 是一种 NLP\
    \ 技术，通过仅微调少量参数，高效适配预训练语言模型到各种应用，降低计算和存储成本。它通过防止灾难性遗忘、调整关键参数来实现任务特定的性能，在图像分类和 Stable\
    \ Diffusion Dream Booth 等多种模态中，其性能与全量微调相当。PEFT 是实现高性能、最小可训练参数的有价值方法。\n\nMath Background:\n\
    \n❑ Equation: W′=W+ΔW, ΔW: 稀疏或结构化的权重更新。\n\n❑ Objective: 在最小化对预训练权重的改动的同时，最大化任务特定的性能。\n\
    \nLoss Function:\n\nCommonly Used: 交叉熵损失、均方误差（MSE）等。\n\nPros and Cons:\n\n☺ Pros:\n\
    \n⇨ 降低可训练参数数量。\n\n⇨ 保持预训练模型的完整性和泛化能力。\n\n☹ Cons:\n\n 需要慎重选择要微调的参数。\n\n 可能需要多次迭代才能找到最优参数。\n\
    \nWhen to Use It:\n\n❑ Large Models: 当微调大型模型且训练全部参数不切实际时。\n\n❑ Transfer Learning:\
    \ 用于在数据有限的情况下适配模型到新任务。\n\nExample Use Cases:\n\n❑ Text Classification: 将预训练语言模型适配到将文本分类为不同类别。\n\
    \n❑ Speech Recognition: 微调模型以识别和转录特定口音或方言。\n\nIllustrative Figure:\n\n![](img/image-P0HC006D.png)\n\
    \n## 16.4 DeepSpeed\n\nMain Concept: DeepSpeed 是一个加速大型语言模型训练的深度学习软件库。它包含 ZeRO（Zero\
    \ Redundancy Optimizer），一种用于分布式训练的高效内存方法。DeepSpeed 可自动优化使用 Hugging Face Trainer\
    \ API 的微调作业，并提供可替换脚本，以运行现有的微调脚本。\n\nMath Background:\n\n❑ Equation: 在典型优化算法的基础上，加入分布式训练增强。\n\
    \n❑ Objective: 最大化大型模型的训练效率和可扩展性。\n\nLoss Function:\n\nCommonly Used: 任务特定的损失函数，如交叉熵、均方误差等。\n\
    \nPros and Cons:\n\n☺ Pros:\n\n⇨ 对大型模型训练有显著的速度加快。\n\n⇨ 通过 ZeRO 等优化，降低内存占用。\n\n\
    ☹ Cons:\n\n 分布式训练需要复杂的配置。\n\n 可能需要大规模训练的基础设施支持。\n\nWhen to Use It:\n\n❑ Large\
    \ Scale Training: 在多 GPU 或多节点上训练非常大的模型。\n\n❑ High Performance Needs: 当训练效率和速度至关重要时。\n\
    \nExample Use Cases:\n\n❑ Language Modeling: 训练像 GPT-3 这样的极大规模语言模型。\n\n❑ Image\
    \ Classification: 大规模计算机视觉任务的训练。\n\nIllustrative Figure:\n\n![](img/image-U8EK6OO0.png)\n\
    \n## 16.5 ZeRO (Zero Redundancy Optimizer)\n\n"
