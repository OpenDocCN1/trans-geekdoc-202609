    ## 2.  Regression Algorithms


    Regression algorithms are utilized for continuous numerical value predictions
    based on input variables. Linear regression, polynomial regression, and support
    vector regression are some examples of Regression Algorithms. Regression algorithms
    are basic in many applications such as stock market trends, predicting house prices,
    and many other cases where the output variable is a continuous value.


    ## 2.1  OLS (Ordinary Least Squares)


    Main Concept Ordinary Least Squares (OLS) is a linear regression technique used
    to estimate the relationship between independent variables and a dependent variable
    by minimizing the sum of the squares of the differences between observed and predicted
    values.


    Main Purpose To identify the best-fitting line between the data points and predict
    the output variable, OLS seeks to minimize the residual sum of squares.


    When to Use It


    ❑  If there is a linear relationship between the variables.


    ❑  When forecasting continuous output variables.


    Real-World Examples


    ❑  Housing Price Prediction: Estimating the cost of a home based on attributes
    like living space, number of bedrooms, number of bathrooms, etc.


    ❑  Stock market forecasting: predicting stock prices by utilizing past data.


    Math Background


    ![](images/image-H69M3NLD.png)


    Pros and Cons


    ☺  Pros:


    ⇨  The Simplicity of implementing and interpreting.


    ⇨  Computational efficiency.


    ☹  Cons:


      The assumption of the linearity between the dependent and the independent variables.


      the Sensitivity to outliers.


    Illustrative Figure


    ![](images/image-799HM89Z.png)


    ## 2.2  Lasso (Least Absolute Shrinkage and Selection Operator)


    Main Concept Least Absolute Shrinkage and Selection Operator (Lasso) is one type
    of linear regression that performs variable selection and regularization to reinforce
    prediction accuracy and interpretability. It drives some coefficients to zero
    by posing a constraint on the sum of the absolute values of the model parameters.


    Main Purpose Lasso aims to select a simpler model that avoids overfitting by improving
    the prediction accuracy and interpretability of the model by forcing some of the
    regression coefficients to be zero.


    When to Use It


    ❑  with high-dimensional data that has many predictors.


    ❑  If there is a need for both regularization and variable selection.


    ❑  Selecting a subset of the most important features to enhance model interpretability.


    Real-World Examples


    ❑  Gene Expression Data Analysis: determining the most predictive of a disease
    by identifying a subset of genes.


    ❑  Financial Modeling: forecast stock returns by determining the key predictors
    from a large set of economic indicators.


    math background


    ![](images/image-1PRVBZFJ.png)


    Pros and Cons


    ☺  Pros:


    ⇨  Simultaneously carry out regularization and variable selection.


    ⇨  The efficiency of handling high-dimensional data.


    ⇨  boosting the model interpretability via shrinking some coefficients to zero.


    ☹  Cons:


      selecting λ (the regularization parameter) is crucial.


      standardization is often necessary, so it Can be sensitive to the variables
    scale.


      If there are highly correlated variables it might not perform well.


    Illustrative Figure


    ![](images/image-9VF1FUGV.png)


    ## 2.3  SVM (Support Vector Machine) for Regression


    Main Concept Support Vector Machine for Regression known as Support Vector Regression
    (SVR), is a supervised learning algorithm that uses the principles of SVM to predict
    continuous outcomes, thus Its target is to find a function that deflects from
    the actual observed values by a value within a specified margin while being as
    flat as possible at the same time.


    Main Purpose SVR aims to minimize the prediction error while maintaining a model
    complexity that ensures generalization to unseen data, effectively managing the
    trade-off between bias and variance.


    When to Use It


    ❑  If the relationship between the predictors is not linear and complex.'
