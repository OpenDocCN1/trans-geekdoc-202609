    ❑ Classification Loss: Cross-Entropy Loss for individual models, averaging the
    probabilities for the final prediction.


    Types of Averaging:


    ❑ Simple Averaging: Directly averages the predictions from all base models.


    ❑ Weighted Averaging: Applies different weights to the predictions from each base
    model.


    Pros and Cons:


    ☺ Pros:


    ⇨ Simple and easy to implement.


    ⇨ Reduces variance and can improve model robustness.


    ⇨ Enhances predictive performance by combining diverse models.


    ☹ Cons:


     May not significantly improve performance if base models are similar.


     Choosing appropriate weights for weighted averaging can be challenging.


     It is less interpretable compared to single models.


    Illustrative Figure:


    ![](images/image-KZVU07BQ.jpg)


    ## 7. Dimensionality reduction methods


    Dimensionality reduction techniques reduce the number of input features to simplify
    models and avoid overfitting. Principal Component Analysis (PCA), t-SNE, and autoencoders
    are common methods. These techniques help in visualizing high-dimensional data
    and improving computational efficiency.


    ## 7.1 Principal Component Analysis (PCA)


    Main Concept: Principal Component Analysis (PCA) is a dimensionality reduction
    technique that transforms a dataset into a set of linearly uncorrelated variables
    called principal components. These components capture the maximum variance in
    the data, allowing for a more compact representation.


    Main Purpose: To reduce the dimensionality of data while retaining as much variance
    as possible. This helps in visualizing high-dimensional data, reducing noise,
    and improving the performance of machine learning algorithms.


    When to Use It:


    ❑ When you need to reduce the number of features in a dataset.


    ❑ Effective for noise reduction, data compression, and visualization of high-dimensional
    data.


    ❑ Suitable for preprocessing data before applying machine learning algorithms.


    Real-World Examples:


    ❑ Finance: Risk management and portfolio optimization.


    ❑ Healthcare: Image processing and genomic data analysis.


    ❑ Marketing: Customer segmentation and behavioral analysis.


    Math Background:


    ![](images/image-EEZE2AMX.png)


    ![](images/image-1MU87DVL.png)


    ![](images/image-QCBL7UTG.png)


    Steps in PCA:


    ❑ Standardize the data.


    ❑ Compute the covariance matrix.


    ❑ Perform eigen decomposition to obtain eigenvalues and eigenvectors.


    ❑ Sort eigenvectors by descending eigenvalues.


    ❑ Select the top k eigenvectors to form the principal components.


    ❑ Transform the data using the selected eigenvectors.


    Pros and Cons:


    ☺ Pros:


    ⇨ Reduces dimensionality and helps in data visualization.


    ⇨ Removes noise and improves computational efficiency.


    ⇨ Captures the most important features of the data.


    ☹ Cons:


     Assumes linearity in the data.


     May lose interpretability of the original features.


     Sensitive to the scaling of the data.


    Illustrative Figure:


    ![](images/image-SDPOFSB6.png)


    ![](images/image-APH34ZAU.png)


    ## 7.2 Linear Discriminant Analysis (LDA)


    Main Concept:


    Linear Discriminant Analysis (LDA) seeks linear combinations of features that
    best separate classes.


    Main Purpose:


    Maximize class separation.


    When to Use It:


    ❑ Classification tasks with labeled data.


    ❑ Reducing feature space while maintaining class separability.


    Example Use Cases:


    ❑ Face Recognition: Distinguishing individuals in images.


    ❑ Medical Diagnosis: Classifying patients based on test results.


    Math Background:


    ❑ Compute within-class and between-class scatter matrices.


    ❑ Solve generalized eigenvalue problems for linear discriminants.


    ❑ Project data into the new subspace.


    ❑ Objective: Maximize between-class variance to within-class variance ratio.


    Loss Function:


    Commonly Used LDA maximizes class separability metric, not a traditional loss
    function.


    Pros and Cons:


    ☺ Pros:


    ⇨ Enhances class separability.


    ⇨ Reduces dimensionality for classification.


    ⇨ Computationally efficient.


    ☹ Cons:


     Assumes normally distributed classes with identical covariances.


     May not perform well if assumptions are violated.


    Illustrative Figure:


    ![](images/image-CYL4356Z.png)


    ## 7.3 t-Distributed Stochastic Neighbor Embedding (t-SNE)


    Main Concept: t-Distributed Stochastic Neighbor Embedding (t-SNE) is a nonlinear
    dimensionality reduction technique particularly well-suited for embedding high-dimensional
    data into a low-dimensional space (typically 2D or 3D) for visualization. It preserves
    the local structure of the data by converting high-dimensional Euclidean distances
    into conditional probabilities that represent similarities.


    Main Purpose: To visualize high-dimensional data in a way that captures the local
    and global structure of the data, making it easier to identify patterns, clusters,
    and anomalies.


    When to Use It:


    ❑ When you need to visualize high-dimensional data in a low-dimensional space.


    ❑ Effective for exploring and understanding the structure of data, such as clustering.


    ❑ Suitable for preprocessing before other machine learning tasks where understanding
    data structure is crucial.


    Real-World Examples:


    ❑ Finance: Visualizing stock market trends and identifying clusters of similar
    financial instruments.


    ❑ Healthcare: Analyzing gene expression data and visualizing patient similarities.


    ❑ Marketing: Understanding customer segmentation and behavior patterns.


    Math Background:


    ![](images/image-SOLFPICO.png)


    ![](images/image-W5SBKQPJ.png)


    ![](images/image-0A6LF1RU.png)


    Steps in t-SNE:


    ❑ Compute pairwise similarities in high-dimensional space.


    ❑ Initialize points in low-dimensional space.


    ❑ Compute pairwise similarities in low-dimensional space.


    ❑ Minimize the KL divergence between the two distributions using gradient descent.


    ❑ Adjust points in low-dimensional space iteratively to better reflect high-dimensional
    similarities.


    Pros and Cons:


    ☺ Pros:


    ⇨ Excellent for visualizing high-dimensional data.


    ⇨ Captures complex structures in data, such as clusters and manifolds.


    ⇨ Preserves the local structure of the data points.


    ☹ Cons:


     Computationally intensive and may require significant time for large datasets.


     Difficult to interpret distances in low-dimensional space.


     May produce different results with different initializations or random seeds.


    Illustrative Figure:


    ![](images/image-LPY4M6TN.png)


    ## 7.4 Uniform Manifold Approximation and Projection (UMAP)


    Main Concept: Uniform Manifold Approximation and Projection (UMAP) is a nonlinear
    dimensionality reduction technique that is used for visualizing high-dimensional
    data in a low-dimensional space. It emphasizes preserving both the local and global
    structure of the data, making it effective for various data exploration and analysis
    tasks.


    Main Purpose: To reduce the dimensionality of data while maintaining meaningful
    relationships between data points in both local and global contexts. UMAP is particularly
    useful for high-dimensional data visualization and clustering.


    When to Use It:


    ❑ When you need to visualize high-dimensional data in a lower-dimensional space.


    ❑ Effective for discovering and visualizing clusters and data patterns.


    ❑ Suitable for preprocessing data before applying machine learning algorithms,
    especially clustering and classification tasks.


    Real-World Examples:


    ❑ Genomics: Visualizing gene expression and single-cell RNA sequencing data.


    ❑ Image Processing: Analyzing and clustering images based on high-dimensional
    features.


    ❑ Social Networks: Exploring and understanding connections between individuals
    in social networks.


    Math Background:


    ❑ Topological Representation: Constructs a topological representation of the data
    manifold.


    ❑ Fuzzy Topological Structure: Captures both local and global relationships between
    data points.


    ❑ Local Connectivity: Measures the distance between neighbors in the high-dimensional
    space.

