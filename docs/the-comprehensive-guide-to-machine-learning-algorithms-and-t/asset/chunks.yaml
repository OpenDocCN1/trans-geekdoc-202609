- raw: "❑  When the data exhibits complex, non-convex cluster shapes that are not\
    \ well-separated in the original feature space.\n\n❑  For clustering tasks that\
    \ benefit from graph-based representations.\n\n❑  When traditional clustering\
    \ algorithms like K-Means fail to identify meaningful clusters.\n\nReal-World\
    \ Examples:\n\n❑  Image Segmentation: Grouping pixels in an image into meaningful\
    \ segments based on similarity.\n\n❑  Social Network Analysis: Identifying communities\
    \ within social networks based on interaction patterns.\n\nMath Background:\n\n\
    ![](images/image-RM4SEZCT.png)  \n\n❑  Eigen Decomposition: Compute the eigenvalues\
    \ and eigenvectors of the Laplacian matrix. Use the first k eigenvectors to form\
    \ a new data representation.\n\n❑  Clustering: Apply a traditional clustering\
    \ algorithm (e.g., K-Means) to the new representation of the data.\n\nLoss Function:\n\
    \nSpectral clustering aims to minimize the normalized cut, a measure of the total\
    \ edge weight connecting different clusters to the sum of the edge weights within\
    \ each cluster.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Can capture complex, non-linear\
    \ relationships in data.\n\n⇨  Effective for clusters of arbitrary shape.\n\n\
    ⇨  Utilizes global information about the data structure through the graph Laplacian.\n\
    \n☹  Cons:\n\n  Computationally expensive for large datasets due to eigen decomposition.\n\
    \n  Sensitive to the choice of similarity measure and parameters.\n\n  Requires\
    \ the number of clusters to be specified in advance.\n\nIllustrative Figure:\n\
    \n![](images/image-LBOAXG6Q.png)![](images/image-1M38RQP2.jpg)\n\n## 5.  Reinforcement\
    \ Learning Algorithms\n\nReinforcement learning algorithms enable agents to learn\
    \ optimal behaviors through trial and error by interacting with an environment.\
    \ Key methods include Q-learning, deep Q-networks (DQN), and policy gradients.\
    \ This approach is prominent in robotics, game playing (e.g., AlphaGo), and autonomous\
    \ driving.\n\n## 5.1  Q-Learning\n\nMain Concept: Q-Learning is a model-free reinforcement\
    \ learning algorithm that seeks to find the optimal action-selection policy for\
    \ a given finite Markov decision process (MDP). It learns the quality of actions,\
    \ represented as a Q-value, which informs the best action to take under circumstances\
    \ to maximize cumulative reward.\n\nMain Purpose: The primary goal of Q-Learning\
    \ is to learn the optimal policy that dictates the best action to take in each\
    \ state to maximize the long-term expected reward. It does this by iteratively\
    \ updating Q-values based on the agent’s experiences in the environment.\n\nWhen\
    \ to Use It:\n\n❑  When an agent needs to learn an optimal policy for decision-making\
    \ in an environment with discrete states and actions.\n\n❑  For problems where\
    \ the model of the environment is unknown or difficult to obtain.\n\n❑  In scenarios\
    \ requiring online learning from interaction with the environment.\n\nReal-World\
    \ Examples:\n\n❑  Game Playing: Training AI agents to play games like chess, Go,\
    \ or video games by learning strategies that maximize the win probability.\n\n\
    ❑  Robotics: Enabling robots to learn navigation and manipulation tasks through\
    \ trial and error.\n\nMath Background:\n\n![](images/image-3UL73INT.png)  \n\n\
    ![](images/image-TR9JLGXM.png)\n\nLoss Function:\n\nTemporal Difference Error:\
    \ Q-Learning minimizes the temporal difference (TD) error, which is the difference\
    \ between the predicted Q-value and the observed reward plus the discounted maximum\
    \ future Q-value.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Model-free: Does not require\
    \ knowledge of the environment’s dynamics.\n\n⇨  Off-policy: Can learn optimal\
    \ policies independent of the agent’s actions.\n\n⇨  Convergence: Proven to converge\
    \ to the optimal policy under certain conditions.\n\n☹  Cons:\n\n  Requires a\
    \ lot of exploration, which can be time-consuming.\n\n  Q-values can become unstable\
    \ or divergent with inappropriate learning rates or discount factors.\n\n  Struggles\
    \ with large state and action spaces without function approximation.\n\nIllustrative\
    \ Figure:\n\n![](images/image-IA140TZY.png)\n\n## 5.2  Deep Q-Networks (DQN)\n\
    \nMain Concept: Deep Q-Networks (DQN) extend the Q-Learning algorithm by utilizing\
    \ deep neural networks to approximate the Q-value function. This allows the algorithm\
    \ to handle high-dimensional state spaces, making it suitable for complex tasks\
    \ such as playing video games directly from pixel inputs.\n\nMain Purpose: The\
    \ primary goal of DQN is to learn an optimal policy that maximizes cumulative\
    \ rewards in environments with large and high-dimensional state spaces by approximating\
    \ the Q-values with deep neural networks.\n\nWhen to Use It:\n\n❑  When the state\
    \ space is large or continuous, making traditional Q-Learning infeasible.\n\n\
    ❑  For tasks requiring high-dimensional input representation, such as image-based\
    \ inputs.\n\n❑  In applications where a model-free reinforcement learning approach\
    \ is needed.\n\nReal-World Examples:\n\n❑  Video Game Playing: Training agents\
    \ to play Atari games directly from raw pixel inputs.\n\n❑  Robotics: Enabling\
    \ robots to learn control policies from high-dimensional sensory inputs, like\
    \ camera images.\n\n❑  Autonomous Driving: Learning driving policies from camera\
    \ and sensor data.\n\nMath Background:\n\n![](images/image-TBEUX6SR.png)  \n\n\
    ![](images/image-LYPG0VTY.png)\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Capable of\
    \ handling high-dimensional input spaces using deep learning techniques.\n\n⇨ \
    \ Experience replay improves data efficiency and stability.\n\n⇨  Target networks\
    \ reduce the likelihood of divergence during training.\n\n☹  Cons:\n\n  Computationally\
    \ intensive and requires significant resources for training.\n\n  Hyperparameter\
    \ tuning can be complex and time-consuming.\n\n  Can be unstable or divergent\
    \ if not properly configured.\n\nIllustrative Figure:\n\n––––––––\n\n![](images/image-I5CH0P5B.png)\n\
    \n## 5.3  Policy Gradient Methods\n\nMain Concept: Policy Gradient Methods are\
    \ a class of reinforcement learning algorithms that optimize the policy directly.\
    \ Instead of learning the value function, they parameterize the policy by a neural\
    \ network and adjust the parameters to maximize the expected return using gradient\
    \ ascent.\n\nMain Purpose: The primary goal of Policy Gradient Methods is to find\
    \ the optimal policy that directly maps states to actions by optimizing the policy\
    \ parameters to maximize the expected cumulative reward.\n\nWhen to Use It:\n\n\
    ❑  When the action space is continuous or high-dimensional.\n\n❑  For problems\
    \ where it is more straightforward to learn the policy directly rather than the\
    \ value function.\n\n❑  In environments where smooth policies are advantageous.\n\
    \nReal-World Examples:\n\n❑  Robotics: Training robots for tasks like locomotion,\
    \ manipulation, and navigation.\n\n❑  Autonomous Vehicles: Learning driving policies\
    \ from sensory inputs.\n\n❑  Finance: Developing trading strategies by learning\
    \ policies for buying and selling assets.\n\nMath Background:\n\n![](images/image-Z5XYLA1Q.png)\
    \  \n\n![](images/image-HOZMSK3T.png)\n\nLoss Function:\n\n![](images/image-4GFITC8A.png)\n\
    \nPros and Cons:\n\n☺  Pros:\n\n⇨  Suitable for continuous and high-dimensional\
    \ action spaces.\n\n⇨  Can learn stochastic policies, which are useful in exploration.\n\
    \n⇨  Directly optimizes the policy, often leading to more efficient learning.\n\
    \n☹  Cons:\n\n  High variance in gradient estimates can make training unstable.\n\
    \n  Requires careful tuning of hyperparameters and often needs variance reduction\
    \ techniques.\n\n  Typically, slower convergence compared to value-based methods.\n\
    \nIllustrative Figure:\n\n![](images/image-W12Y6T7I.jpg)\n\n## 5.4  Actor-Critic\
    \ Methods\n\nMain Concept: Actor-Critic Methods combine the benefits of policy-based\
    \ and value-based approaches in reinforcement learning. The \"actor\" component\
    \ updates the policy directly, while the \"critic\" component evaluates the policy\
    \ by learning the value function. This hybrid approach leverages the stability\
    \ of value-based methods and the flexibility of policy-based methods."
  fmt: "\nWhen the data exhibits complex, non-convex cluster shapes that are not well-separated\
    \ in the original feature space.\n\nFor clustering tasks that benefit from graph-based\
    \ representations.\n\nWhen traditional clustering algorithms like K-Means fail\
    \ to identify meaningful clusters.\n\nReal-World Examples:\n\nImage Segmentation:\
    \ Grouping pixels in an image into meaningful segments based on similarity.\n\n\
    Social Network Analysis: Identifying communities within social networks based\
    \ on interaction patterns.\n\nMath Background:\n\n![](images/image-RM4SEZCT.png)\
    \  \n\nEigen Decomposition: Compute the eigenvalues and eigenvectors of the Laplacian\
    \ matrix. Use the first k eigenvectors to form a new data representation.\n\n\
    Clustering: Apply a traditional clustering algorithm (e.g., K-Means) to the new\
    \ representation of the data.\n\nLoss Function:\n\nSpectral clustering aims to\
    \ minimize the normalized cut, a measure of the total edge weight connecting different\
    \ clusters to the sum of the edge weights within each cluster.\n\nPros and Cons:\n\
    \n☺ Pros:\n\n⇨ Can capture complex, non-linear relationships in data.\n\n⇨ Effective\
    \ for clusters of arbitrary shape.\n\n⇨ Utilizes global information about the\
    \ data structure through the graph Laplacian.\n\n☹ Cons:\n\n Computationally\
    \ expensive for large datasets due to eigen decomposition.\n\n Sensitive to the\
    \ choice of similarity measure and parameters.\n\n Requires the number of clusters\
    \ to be specified in advance.\n\nIllustrative Figure:\n\n![](images/image-LBOAXG6Q.png)![](images/image-1M38RQP2.jpg)\n\
    \n5. Reinforcement Learning Algorithms\n\nReinforcement learning algorithms enable\
    \ agents to learn optimal behaviors through trial and error by interacting with\
    \ an environment. Key methods include Q-learning, deep Q-networks (DQN), and policy\
    \ gradients. This approach is prominent in robotics, game playing (e.g., AlphaGo),\
    \ and autonomous driving.\n\n5.1 Q-Learning\n\nMain Concept: Q-Learning is a model-free\
    \ reinforcement learning algorithm that seeks to find the optimal action-selection\
    \ policy for a given finite Markov decision process (MDP). It learns the quality\
    \ of actions, represented as a Q-value, which informs the best action to take\
    \ under circumstances to maximize cumulative reward.\n\nMain Purpose: The primary\
    \ goal of Q-Learning is to learn the optimal policy that dictates the best action\
    \ to take in each state to maximize the long-term expected reward. It does this\
    \ by iteratively updating Q-values based on the agent’s experiences in the environment.\n\
    \nWhen to Use It:\n\n- When an agent needs to learn an optimal policy for decision-making\
    \ in an environment with discrete states and actions.\n- For problems where the\
    \ model of the environment is unknown or difficult to obtain.\n- In scenarios\
    \ requiring online learning from interaction with the environment.\n\nReal-World\
    \ Examples:\n\n- Game Playing: Training AI agents to play games like chess, Go,\
    \ or video games by learning strategies that maximize the win probability.\n-\
    \ Robotics: Enabling robots to learn navigation and manipulation tasks through\
    \ trial and error.\n\nMath Background:\n\n![](images/image-3UL73INT.png)  \n\n\
    ![](images/image-TR9JLGXM.png)\n\nLoss Function:\n\nTemporal Difference Error:\
    \ Q-Learning minimizes the temporal difference (TD) error, which is the difference\
    \ between the predicted Q-value and the observed reward plus the discounted maximum\
    \ future Q-value.\n\nPros and Cons:\n\n☺ Pros:\n\n⇨ Model-free: Does not require\
    \ knowledge of the environment’s dynamics.\n\n⇨ Off-policy: Can learn optimal\
    \ policies independent of the agent’s actions.\n\n⇨ Convergence: Proven to converge\
    \ to the optimal policy under certain conditions.\n\n☹ Cons:\n\n Requires a lot\
    \ of exploration, which can be time-consuming.\n\n Q-values can become unstable\
    \ or divergent with inappropriate learning rates or discount factors.\n\n Struggles\
    \ with large state and action spaces without function approximation.\n\nIllustrative\
    \ Figure:\n\n![](images/image-IA140TZY.png)\n\n5.2 Deep Q-Networks (DQN)\n\nMain\
    \ Concept: Deep Q-Networks (DQN) extend the Q-Learning algorithm by utilizing\
    \ deep neural networks to approximate the Q-value function. This allows the algorithm\
    \ to handle high-dimensional state spaces, making it suitable for complex tasks\
    \ such as playing video games directly from pixel inputs.\n\nMain Purpose: The\
    \ primary goal of DQN is to learn an optimal policy that maximizes cumulative\
    \ rewards in environments with large and high-dimensional state spaces by approximating\
    \ the Q-values with deep neural networks.\n\nWhen to Use It:\n\n- When the state\
    \ space is large or continuous, making traditional Q-Learning infeasible.\n- For\
    \ tasks requiring high-dimensional input representation, such as image-based inputs.\n\
    - In applications where a model-free reinforcement learning approach is needed.\n\
    \nReal-World Examples:\n\n- Video Game Playing: Training agents to play Atari\
    \ games directly from raw pixel inputs.\n- Robotics: Enabling robots to learn\
    \ control policies from high-dimensional sensory inputs, like camera images.\n\
    - Autonomous Driving: Learning driving policies from camera and sensor data.\n\
    \nMath Background:\n\n![](images/image-TBEUX6SR.png)  \n\n![](images/image-LYPG0VTY.png)\n\
    \nPros and Cons:\n\n☺ Pros:\n\n⇨ Capable of handling high-dimensional input spaces\
    \ using deep learning techniques.\n\n⇨ Experience replay improves data efficiency\
    \ and stability.\n\n⇨ Target networks reduce the likelihood of divergence during\
    \ training.\n\n☹ Cons:\n\n Computationally intensive and requires significant\
    \ resources for training.\n\n Hyperparameter tuning can be complex and time-consuming.\n\
    \n Can be unstable or divergent if not properly configured.\n\nIllustrative Figure:\n\
    \n![](images/image-I5CH0P5B.png)\n\n5.3 Policy Gradient Methods\n\nMain Concept:\
    \ Policy Gradient Methods are a class of reinforcement learning algorithms that\
    \ optimize the policy directly. Instead of learning the value function, they parameterize\
    \ the policy by a neural network and adjust the parameters to maximize the expected\
    \ return using gradient ascent.\n\nMain Purpose: The primary goal of Policy Gradient\
    \ Methods is to find the optimal policy that directly maps states to actions by\
    \ optimizing the policy parameters to maximize the expected cumulative reward.\n\
    \nWhen to Use It:\n\n- When the action space is continuous or high-dimensional.\n\
    - For problems where it is more straightforward to learn the policy directly rather\
    \ than the value function.\n- In environments where smooth policies are advantageous.\n\
    \nReal-World Examples:\n\n- Robotics: Training robots for tasks like locomotion,\
    \ manipulation, and navigation.\n- Autonomous Vehicles: Learning driving policies\
    \ from sensory inputs.\n- Finance: Developing trading strategies by learning policies\
    \ for buying and selling assets.\n\nMath Background:\n\n![](images/image-Z5XYLA1Q.png)\
    \  \n\n![](images/image-HOZMSK3T.png)\n\nLoss Function:\n\n![](images/image-4GFITC8A.png)\n\
    \nPros and Cons:\n\n☺ Pros:\n\n⇨ Suitable for continuous and high-dimensional\
    \ action spaces.\n\n⇨ Can learn stochastic policies, which are useful in exploration.\n\
    \n⇨ Directly optimizes the policy, often leading to more efficient learning.\n\
    \n☹ Cons:\n\n High variance in gradient estimates can make training unstable.\n\
    \n Requires careful tuning of hyperparameters and often needs variance reduction\
    \ techniques.\n\n Typically, slower convergence compared to value-based methods.\n\
    \nIllustrative Figure:\n\n![](images/image-W12Y6T7I.jpg)\n\n5.4 Actor-Critic Methods\n\
    \nMain Concept: Actor-Critic Methods combine the benefits of policy-based and\
    \ value-based approaches in reinforcement learning. The \"actor\" component updates\
    \ the policy directly, while the \"critic\" component evaluates the policy by\
    \ learning the value function. This hybrid approach leverages the stability of\
    \ value-based methods and the flexibility of policy-based methods.\n"
  trans: "\n当数据在原始特征空间中呈现出复杂的非凸聚类形状且聚类不易分离时。\n\n适用于受图结构表示有益的聚类任务。\n\n当传统聚类算法如 K-Means\
    \ 无法识别有意义的聚类时。\n\n实际案例：\n\n图像分割：根据相似性将图像中的像素分组为有意义的片段。\n\n社交网络分析：基于交互模式在社交网络中识别社区。\n\
    \n数学背景：\n\n![](img/image-RM4SEZCT.png)  \n\n特征分解：计算拉普拉斯矩阵的特征值和特征向量。使用前 k 个特征向量构建新的数据表示。\n\
    \n聚类：在新表示的数据上应用传统聚类算法（如 K-Means）。\n\n损失函数：\n\n光谱聚类旨在最小化归一化切割（normalized cut），这是不同聚类之间的边缘总权重与每个聚类内部边缘权重之和的比值。\n\
    \n优缺点：\n\n☺ 优点：\n\n⇨ 可捕获数据中的复杂非线性关系。\n\n⇨ 适用于任意形状的聚类。\n\n⇨ 通过图拉普拉斯矩阵利用数据结构的全局信息。\n\
    \n☹ 缺点：\n\n 大规模数据集计算开销大，因需进行特征分解。\n\n 对相似度测度和参数的选择敏感。\n\n 需要在先预先指定聚类数量。\n\n\
    示例图：\n\n![](img/image-LBOAXG6Q.png)![](img/image-1M38RQP2.jpg)\n\n5. 强化学习算法\n\n\
    强化学习算法通过与环境交互，让智能体通过试错学习最优行为。主要方法包括 Q-learning、深度 Q 网络（DQN）和策略梯度。该方法在机器人学、游戏玩耍（如\
    \ AlphaGo）以及自动驾驶中具有显著优势。\n\n5.1 Q-Learning\n\n主要概念：Q-Learning 是一种无模型强化学习算法，旨在为有限马尔可夫决策过程（MDP）寻找最优动作选择策略。它学习动作质量（Q\
    \ 值），该值指示在特定情境下采取最佳动作以最大化累计回报。\n\n主要目的：Q-Learning 的主要目标是学习最优策略，即在每个状态下指示最佳动作，以最大化长期期望回报。它通过迭代更新\
    \ Q 值，基于智能体在环境中的经验实现。\n\n何时使用：\n\n- 当智能体需要在离散状态和动作的环境中学习最优策略时。\n- 环境模型未知或难以获得时。\n\
    - 需要在线从环境交互中学习的场景。\n\n实际案例：\n\n- 游戏玩耍：训练人工智能代理通过学习策略来最大化获胜概率，玩棋类、围棋或视频游戏。\n- 机器人学：使机器人通过试错学习导航和操作任务。\n\
    \n数学背景：\n\n![](img/image-3UL73INT.png)  \n\n![](img/image-TR9JLGXM.png)\n\n损失函数：\n\
    \n时间差误差（Temporal Difference Error）：Q-Learning 最小化时间差误差，即预测的 Q 值与观测回报加折扣最大未来 Q\
    \ 值之差。\n\n优缺点：\n\n☺ 优点：\n\n⇨ 无模型：无需环境动态的知识。\n\n⇨ 离线策略：可在不受智能体行为影响的情况下学习最优策略。\n\
    \n⇨ 收敛性：在特定条件下已证明可收敛到最优策略。\n\n☹ 缺点：\n\n 需要大量探索，可能耗时较长。\n\n 学习率或折扣因子不当时，Q 值可能不稳定或发散。\n\
    \n 在状态空间和动作空间较大且没有函数逼近时表现不佳。\n\n示例图：\n\n![](img/image-IA140TZY.png)\n\n5.2 深度\
    \ Q 网络（DQN）\n\n主要概念：深度 Q 网络（DQN）通过利用深度神经网络来近似 Q 值函数，扩展了 Q-Learning，使其能够处理高维状态空间，适用于如直接从像素输入玩视频游戏等复杂任务。\n\
    \n主要目的：DQN 的主要目标是通过深度神经网络近似 Q 值，学习在状态空间大且维度高的环境中最大化累计回报的最优策略。\n\n何时使用：\n\n- 当状态空间大或连续，使传统\
    \ Q-Learning 不可行时。\n- 需要处理高维输入表示，如图像输入时。\n- 需要无模型强化学习的应用。\n\n实际案例：\n\n- 视频游戏玩耍：训练代理直接从原始像素输入玩\
    \ Atari 游戏。\n- 机器人学：使机器人从高维感官输入（如摄像头图像）中学习控制策略。\n- 自动驾驶：从摄像头和传感器数据中学习驾驶策略。\n\n\
    数学背景：\n\n![](img/image-TBEUX6SR.png)  \n\n![](img/image-LYPG0VTY.png)\n\n优缺点：\n\
    \n☺ 优点：\n\n⇨ 能利用深度学习技术处理高维输入空间。\n\n⇨ 经验回放提高数据效率和稳定性。\n\n⇨ 目标网络降低训练时的发散可能性。\n\n\
    ☹ 缺点：\n\n 训练资源需求大，对硬件要求高。\n\n 超参数调优复杂且耗时。\n\n 若配置不当，可能不稳定或发散。\n\n示例图：\n\n![](img/image-I5CH0P5B.png)\n\
    \n5.3 策略梯度方法\n\n主要概念：策略梯度方法是一类强化学习算法，直接优化策略。它们不学习值函数，而是通过神经网络参数化策略，使用梯度上升调整参数以最大化期望回报。\n\
    \n主要目的：策略梯度方法的主要目标是通过优化策略参数，直接找到将状态映射到动作的最优策略，从而最大化累计回报。\n\n何时使用：\n\n- 动作空间连续或高维时。\n\
    - 直接学习策略比学习值函数更为直接。\n- 环境中平滑策略有益的情况。\n\n实际案例：\n\n- 机器人学：训练机器人进行运动、操作和导航任务。\n-\
    \ 自动驾驶：从传感器输入中学习驾驶策略。\n- 金融：通过学习买卖资产的策略开发交易策略。\n\n数学背景：\n\n![](img/image-Z5XYLA1Q.png)\
    \  \n\n![](img/image-HOZMSK3T.png)\n\n损失函数：\n\n![](img/image-4GFITC8A.png)\n\n\
    优缺点：\n\n☺ 优点：\n\n⇨ 适用于连续和高维动作空间。\n\n⇨ 可学习随机策略，有助于探索。\n\n⇨ 直接优化策略，往往学习更高效。\n\n\
    ☹ 缺点：\n\n 梯度估计的高方差会导致训练不稳定。\n\n 需要精心调整超参数，常需使用方差降低技术。\n\n 收敛速度通常慢于值基方法。\n\n\
    示例图：\n\n![](img/image-W12Y6T7I.jpg)\n\n5.4 Actor-Critic 方法\n\n主要概念：Actor-Critic\
    \ 方法结合了策略基于和值基于强化学习的优势。Actor 组件直接更新策略，Critic 组件通过学习值函数评估策略。这种混合方式利用了值基方法的稳定性和策略基方法的灵活性。\n\
    \n"
