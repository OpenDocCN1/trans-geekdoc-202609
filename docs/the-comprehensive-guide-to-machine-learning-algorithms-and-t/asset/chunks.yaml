    \ regression), count data (Poisson regression), or proportion data (binomial regression).\n\
    \n❑  When interpretability of model coefficients is important.\n\nReal-World Examples:\n\
    \n❑  Healthcare: Modeling the number of patient visits to a hospital using Poisson\
    \ regression.\n\n❑  Finance: Predicting the probability of default on a loan using\
    \ logistic regression.\n\nMath Background:\n\n––––––––\n\n![](images/image-F57S1XOM.png)\n\
    \nCommon Link Functions and Distributions:\n\n❑  Identity Link (Normal Distribution):\
    \ For continuous outcomes.\n\n❑  Logit Link (Binomial Distribution): For binary\
    \ outcomes.\n\n❑  Log Link (Poisson Distribution): For count data.\n\nLoss Function:\n\
    \nThe loss function depends on the distribution of the response variable. For\
    \ example:\n\n❑  Logistic Regression: Uses log-likelihood for binomial distribution.\n\
    \n❑  Poisson Regression: Uses log-likelihood for Poisson distribution.\n\nPros\
    \ and Cons:\n\n☺  Pros:\n\n⇨  Flexible framework for different types of data and\
    \ distributions.\n\n⇨  Coefficients are interpretable.\n\n⇨  Well-established\
    \ statistical theory.\n\n☹  Cons:\n\n  Assumes a specific distribution for the\
    \ dependent variable.\n\n  Can be sensitive to outliers and influential data\
    \ points.\n\n  Requires careful selection of link functions and distributions.\n\
    \nIllustrative Figure:\n\n![](images/image-06VVHYGK.png)\n\n## 2.9  K-Nearest\
    \ Neighbors for Regression\n\nMain Concept: K-Nearest Neighbors (KNN) for regression\
    \ is a non-parametric, instance-based learning method used to predict the value\
    \ of a continuous target variable. It operates by finding the K training samples\
    \ closest in distance to the test sample and averaging their target values.\n\n\
    Main Purpose: The primary goal of KNN for regression is to make predictions by\
    \ leveraging the similarity (or distance) between the data points in the feature\
    \ space, if similar inputs have similar outputs.\n\nWhen to Use It:\n\n❑  When\
    \ the data has a simple structure and the relationship between the features and\
    \ target variable is local.\n\n❑  When a straightforward and interpretable model\
    \ is needed.\n\n❑  For small to medium-sized datasets, KNN can be computationally\
    \ expensive for large datasets.\n\nReal-World Examples:\n\n❑  House Price Prediction:\
    \ Predicting house prices based on the prices of nearby houses with similar features.\n\
    \n❑  Temperature Prediction: Predicting the temperature at a given location based\
    \ on temperatures at nearby locations.\n\nMath Background:\n\n![](images/image-PKU4H4QZ.png)\n\
    \nPros and Cons:\n\n☺  Pros:\n\n⇨  Simple to understand and implement.\n\n⇨  Naturally\
    \ handles multi-output regression problems.\n\n⇨  No assumptions about the data\
    \ distribution.\n\n☹  Cons:\n\n  Computationally expensive as it requires storing\
    \ the entire dataset.\n\n  Sensitive to the choice of K and the distance metric.\n\
    \n  Performance can degrade with high-dimensional data (curse of dimensionality).\n\
    \nIllustrative Figure:\n\n![](images/image-9HF9JT2Q.jpg)\n\n## 2.10  Stepwise\
    \ Regression\n\nMain Concept: Stepwise regression is a method of fitting regression\
    \ models in which the choice of predictive variables is carried out by an automatic\
    \ procedure. This method involves adding or removing predictors based on specific\
    \ criteria (e.g., p-values, AIC, BIC) to find the most statistically significant\
    \ model.\n\nMain Purpose: The primary goal of stepwise regression is to build\
    \ a model that includes only the most significant predictors, improving model\
    \ interpretability and potentially enhancing prediction performance.\n\nWhen to\
    \ Use It:\n\n❑  When dealing with datasets that have many predictors.\n\n❑  When\
    \ the goal is to identify a subset of the most important predictors.\n\n❑  For\
    \ exploratory data analysis to select significant variables.\n\nReal-World Examples:\n\
    \n❑  Medical Research: Identifying the most important factors that contribute\
    \ to a particular health outcome.\n\n❑  Economics: Determining key economic indicators\
    \ that most significantly affect GDP growth.\n\nMath Background:\n\n❑  Forward\
    \ Selection: Starts with no predictors and adds them one by one, based on the\
    \ chosen criterion.\n\n❑  Backward Elimination: Starts with all predictors and\
    \ removes them one by one, based on the chosen criterion.\n\n❑  Bidirectional\
    \ Elimination: A combination of forward selection and backward elimination, adding\
    \ and removing predictors simultaneously based on the criterion.\n\nLoss Function:\n\
    \nCriteria for Adding or Removing Predictors:\n\n❑  p-value: Typically, a predictor\
    \ is added if its p-value is below a certain threshold and removed if it is above\
    \ a threshold.\n\n❑  AIC (Akaike Information Criterion): Lower values indicate\
    \ a better model.\n\n❑  BIC (Bayesian Information Criterion): Lower values indicate\
    \ a better model.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Can handle large numbers\
    \ of predictors.\n\n⇨  Helps in identifying significant predictors.\n\n⇨  Improves\
    \ model interpretability by reducing the number of predictors.\n\n☹  Cons:\n\n\
      Can be computationally intensive with many predictors.\n\n  Prone to overfitting\
    \ if not properly controlled.\n\n  Results can be sensitive to the initial model\
    \ and the order of predictor entry/removal.\n\nIllustrative Figure:\n\n![](images/image-DQS633WF.jpg)\n\
    \n## 2.11  Quantile Regression\n\nMain Concept: Quantile Regression is a type\
    \ of regression analysis used in statistics and econometrics that allows for estimating\
    \ the conditional quantiles (such as the median or the 90th percentile) of the\
    \ response variable. Unlike ordinary least squares (OLS) regression, which estimates\
    \ the mean of the dependent variable conditional on the independent variables,\
    \ quantile regression estimates the median or other quantiles, providing a more\
    \ comprehensive analysis of the relationship between variables.\n\nMain Purpose:\
    \ The primary goal of quantile regression is to provide a more complete view of\
    \ the relationship between independent and dependent variables by estimating different\
    \ points of the conditional distribution of the dependent variable. This is particularly\
    \ useful in situations where the relationship between variables varies across\
    \ different quantiles.\n\nWhen to Use It:\n\n❑  When the data has heteroscedasticity\
    \ (non-constant variance).\n\n❑  When you are interested in understanding the\
    \ impact of variables across different points of the outcome distribution.\n\n\
    ❑  When the relationship between the independent and dependent variables is not\
    \ uniform across all values of the dependent variable.\n\nReal-World Examples:\n\
    \n❑  Income Inequality Analysis: Examining how different factors affect income\
    \ at different points in the income distribution (e.g., median income vs. top\
    \ 10% income).\n\n❑  Housing Market Analysis: Understanding how property characteristics\
    \ influence the prices at different quantiles of the housing market (e.g., lower-priced\
    \ vs. higher-priced homes).\n\nMath Background:\n\n![](images/image-GR541BHA.png)\
    \  \n\n![](images/image-9291RPJM.png)\n\nThis function penalizes residuals asymmetrically,\
    \ depending on whether they fall above or below the quantile being estimated.\n\
    \nPros and Cons:\n\n☺  Pros:\n\n⇨  Provides a comprehensive view of the relationship\
    \ between variables.\n\n⇨  Robust to outliers.\n\n⇨  Can model different parts\
    \ of the conditional distribution.\n\n☹  Cons:\n\n  Computationally more intensive\
    \ than OLS.\n\n  Interpretation of results can be more complex.\n\n  Requires\
    \ more sophisticated tools and techniques for estimation and inference.\n\nIllustrative\
    \ Figure:\n\n![](images/image-0BRLQ0N3.png)\n\n## 3.  Classification Algorithms\n\
    \nClassification algorithms are used to categorize data into predefined classes\
    \ or labels. Common algorithms include logistic regression, decision trees, random\
    \ forests, and support vector machines. They are widely used in spam detection,\
    \ image recognition, and medical diagnosis, where the goal is to assign data points\
    \ to specific categories.\n\n## 3.1  Logistic Regression\n\nMain Concept: Logistic\
    \ regression is a statistical method for modeling the relationship between a dependent\
    \ binary variable and one or more independent variables."
  fmt: "\n❑ For modeling different types of outcomes, such as binary outcomes (logistic\
    \ regression), count data (Poisson regression), or proportion data (binomial regression).\n\
    \n❑ When interpretability of model coefficients is important.\n\nReal-World Examples:\n\
    \n❑ Healthcare: Modeling the number of patient visits to a hospital using Poisson\
    \ regression.\n\n❑ Finance: Predicting the probability of default on a loan using\
    \ logistic regression.\n\nMath Background:\n\n––––––––\n\n![](images/image-F57S1XOM.png)\n\
    \nCommon Link Functions and Distributions:\n\n❑ Identity Link (Normal Distribution):\
    \ For continuous outcomes.\n\n❑ Logit Link (Binomial Distribution): For binary\
    \ outcomes.\n\n❑ Log Link (Poisson Distribution): For count data.\n\nLoss Function:\n\
    \nThe loss function depends on the distribution of the response variable. For\
    \ example:\n\n❑ Logistic Regression: Uses log-likelihood for binomial distribution.\n\
    \n❑ Poisson Regression: Uses log-likelihood for Poisson distribution.\n\nPros\
    \ and Cons:\n\n☺ Pros:\n\n⇨ Flexible framework for different types of data and\
    \ distributions.\n\n⇨ Coefficients are interpretable.\n\n⇨ Well-established statistical\
    \ theory.\n\n☹ Cons:\n\n Assumes a specific distribution for the dependent variable.\n\
    \n Can be sensitive to outliers and influential data points.\n\n Requires careful\
    \ selection of link functions and distributions.\n\nIllustrative Figure:\n\n![](images/image-06VVHYGK.png)\n\
    \n## 2.9 K-Nearest Neighbors for Regression\n\nMain Concept: K-Nearest Neighbors\
    \ (KNN) for regression is a non-parametric, instance-based learning method used\
    \ to predict the value of a continuous target variable. It operates by finding\
    \ the K training samples closest in distance to the test sample and averaging\
    \ their target values.\n\nMain Purpose: The primary goal of KNN for regression\
    \ is to make predictions by leveraging the similarity (or distance) between the\
    \ data points in the feature space, if similar inputs have similar outputs.\n\n\
    When to Use It:\n\n❑ When the data has a simple structure and the relationship\
    \ between the features and target variable is local.\n\n❑ When a straightforward\
    \ and interpretable model is needed.\n\n❑ For small to medium-sized datasets,\
    \ KNN can be computationally expensive for large datasets.\n\nReal-World Examples:\n\
    \n❑ House Price Prediction: Predicting house prices based on the prices of nearby\
    \ houses with similar features.\n\n❑ Temperature Prediction: Predicting the temperature\
    \ at a given location based on temperatures at nearby locations.\n\nMath Background:\n\
    \n![](images/image-PKU4H4QZ.png)\n\nPros and Cons:\n\n☺ Pros:\n\n⇨ Simple to understand\
    \ and implement.\n\n⇨ Naturally handles multi-output regression problems.\n\n\
    ⇨ No assumptions about the data distribution.\n\n☹ Cons:\n\n Computationally\
    \ expensive as it requires storing the entire dataset.\n\n Sensitive to the choice\
    \ of K and the distance metric.\n\n Performance can degrade with high-dimensional\
    \ data (curse of dimensionality).\n\nIllustrative Figure:\n\n![](images/image-9HF9JT2Q.jpg)\n\
    \n## 2.10 Stepwise Regression\n\nMain Concept: Stepwise regression is a method\
    \ of fitting regression models in which the choice of predictive variables is\
    \ carried out by an automatic procedure. This method involves adding or removing\
    \ predictors based on specific criteria (e.g., p-values, AIC, BIC) to find the\
    \ most statistically significant model.\n\nMain Purpose: The primary goal of stepwise\
    \ regression is to build a model that includes only the most significant predictors,\
    \ improving model interpretability and potentially enhancing prediction performance.\n\
    \nWhen to Use It:\n\n❑ When dealing with datasets that have many predictors.\n\
    \n❑ When the goal is to identify a subset of the most important predictors.\n\n\
    ❑ For exploratory data analysis to select significant variables.\n\nReal-World\
    \ Examples:\n\n❑ Medical Research: Identifying the most important factors that\
    \ contribute to a particular health outcome.\n\n❑ Economics: Determining key economic\
    \ indicators that most significantly affect GDP growth.\n\nMath Background:\n\n\
    ❑ Forward Selection: Starts with no predictors and adds them one by one, based\
    \ on the chosen criterion.\n\n❑ Backward Elimination: Starts with all predictors\
    \ and removes them one by one, based on the chosen criterion.\n\n❑ Bidirectional\
    \ Elimination: A combination of forward selection and backward elimination, adding\
    \ and removing predictors simultaneously based on the criterion.\n\nLoss Function:\n\
    \nCriteria for Adding or Removing Predictors:\n\n❑ p-value: Typically, a predictor\
    \ is added if its p-value is below a certain threshold and removed if it is above\
    \ a threshold.\n\n❑ AIC (Akaike Information Criterion): Lower values indicate\
    \ a better model.\n\n❑ BIC (Bayesian Information Criterion): Lower values indicate\
    \ a better model.\n\nPros and Cons:\n\n☺ Pros:\n\n⇨ Can handle large numbers of\
    \ predictors.\n\n⇨ Helps in identifying significant predictors.\n\n⇨ Improves\
    \ model interpretability by reducing the number of predictors.\n\n☹ Cons:\n\n\
     Can be computationally intensive with many predictors.\n\n Prone to overfitting\
    \ if not properly controlled.\n\n Results can be sensitive to the initial model\
    \ and the order of predictor entry/removal.\n\nIllustrative Figure:\n\n![](images/image-DQS633WF.jpg)\n\
    \n## 2.11 Quantile Regression\n\nMain Concept: Quantile Regression is a type of\
    \ regression analysis used in statistics and econometrics that allows for estimating\
    \ the conditional quantiles (such as the median or the 90th percentile) of the\
    \ response variable. Unlike ordinary least squares (OLS) regression, which estimates\
    \ the mean of the dependent variable conditional on the independent variables,\
    \ quantile regression estimates the median or other quantiles, providing a more\
    \ comprehensive analysis of the relationship between variables.\n\nMain Purpose:\
    \ The primary goal of quantile regression is to provide a more complete view of\
    \ the relationship between independent and dependent variables by estimating different\
    \ points of the conditional distribution of the dependent variable. This is particularly\
    \ useful in situations where the relationship between variables varies across\
    \ different quantiles.\n\nWhen to Use It:\n\n❑ When the data has heteroscedasticity\
    \ (non-constant variance).\n\n❑ When you are interested in understanding the impact\
    \ of variables across different points of the outcome distribution.\n\n❑ When\
    \ the relationship between the independent and dependent variables is not uniform\
    \ across all values of the dependent variable.\n\nReal-World Examples:\n\n❑ Income\
    \ Inequality Analysis: Examining how different factors affect income at different\
    \ points in the income distribution (e.g., median income vs. top 10% income).\n\
    \n❑ Housing Market Analysis: Understanding how property characteristics influence\
    \ the prices at different quantiles of the housing market (e.g., lower-priced\
    \ vs. higher-priced homes).\n\nMath Background:\n\n![](images/image-GR541BHA.png)\
    \  \n\n![](images/image-9291RPJM.png)\n\nThis function penalizes residuals asymmetrically,\
    \ depending on whether they fall above or below the quantile being estimated.\n\
    \nPros and Cons:\n\n☺ Pros:\n\n⇨ Provides a comprehensive view of the relationship\
    \ between variables.\n\n⇨ Robust to outliers.\n\n⇨ Can model different parts of\
    \ the conditional distribution.\n\n☹ Cons:\n\n Computationally more intensive\
    \ than OLS.\n\n Interpretation of results can be more complex.\n\n Requires\
    \ more sophisticated tools and techniques for estimation and inference.\n\nIllustrative\
    \ Figure:\n\n![](images/image-0BRLQ0N3.png)\n\n## 3 Classification Algorithms\n\
    \nClassification algorithms are used to categorize data into predefined classes\
    \ or labels. Common algorithms include logistic regression, decision trees, random\
    \ forests, and support vector machines. They are widely used in spam detection,\
    \ image recognition, and medical diagnosis, where the goal is to assign data points\
    \ to specific categories.\n\n## 3.1 Logistic Regression\n\nMain Concept: Logistic\
    \ regression is a statistical method for modeling the relationship between a dependent\
    \ binary variable and one or more independent variables.\n"
  trans: "\n-   [用于建模不同类型的结果，例如二元结果（逻辑回归）、计数数据（泊松回归）或比例数据（二项回归）。]\n\n-   [当模型系数的可解释性很重要时。]\n\
    \n真实世界示例：\n\n-   [医疗保健：使用泊松回归来建模住院患者就医次数。]\n\n-   [金融：使用逻辑回归预测贷款违约的概率。]\n\n数学背景：\n\
    \n––––––––\n\n![](img/image-F57S1XOM.png)\n\n常见链接函数和分布：\n\n-   [恒等链接函数（正态分布）：用于连续结果。]\n\
    \n-   [Logit 链接函数（二项分布）：用于二元结果。]\n\n-   [对数链接函数（泊松分布）：用于计数数据。]\n\n损失函数：\n\n[损失函数取决于因变量的分布。例如：]\n\
    \n-   [逻辑回归：使用二项分布的对数似然。]\n\n-   [泊松回归：使用泊松分布的对数似然。]\n\n优缺点：\n\n☺ 优点：\n\n⇨ 对不同类型的数据和分布具有灵活性。\n\
    \n⇨ 系数具有可解释性。\n\n⇨ 统计理论已相当成熟。\n\n☹ 缺点：\n\n 假设因变量服从特定分布。\n\n 对离群点和有影响力的数据点敏感。\n\
    \n 需要慎重选择链接函数和分布。\n\n示意图：\n\n![](img/image-06VVHYGK.png)\n\n## 2.9 K-邻近回归\n\n\
    主要概念：K-邻近回归（KNN 回归）是一种非参数、基于实例的学习方法，用于预测连续目标变量的值。它通过找到与测试样本距离最近的 K 个训练样本，并对它们的目标值取平均来实现预测。\n\
    \n主要目的：KNN 回归的主要目标是利用特征空间中数据点之间的相似性（或距离），如果输入相似，输出也相似，从而进行预测。\n\n何时使用：\n\n-  \
    \ [当数据结构简单且特征与目标变量之间的关系是局部的时使用。]\n\n-   [当需要一个简单且可解释的模型时使用。]\n\n-   [对于小到中等规模的数据集，KNN\
    \ 可能在大规模数据集上计算开销较大。]\n\n真实世界示例：\n\n-   [房价预测：基于邻近房屋的价格和类似特征预测房价。]\n\n-   [温度预测：根据邻近位置的温度预测特定位置的温度。]\n\
    \n数学背景：\n\n![](img/image-PKU4H4QZ.png)\n\n优缺点：\n\n☺ 优点：\n\n⇨ 易于理解和实现。\n\n⇨ 自然支持多输出回归问题。\n\
    \n⇨ 对数据分布不作任何假设。\n\n☹ 缺点：\n\n 计算开销大，因为需要存储整个数据集。\n\n 对 K 的选择和距离度量敏感。\n\n 高维数据（维度诅咒）时性能会下降。\n\
    \n示意图：\n\n![](img/image-9HF9JT2Q.jpg)\n\n## 2.10 逐步回归\n\n主要概念：逐步回归是一种自动选择预测变量的回归模型方法。它通过根据特定标准（如\
    \ p 值、AIC、BIC）有选择地添加或删除预测变量，找到最具统计显著性的模型。\n\n主要目的：逐步回归的主要目标是构建一个仅包含最重要预测变量的模型，从而提高模型的可解释性并可能改善预测性能。\n\
    \n何时使用：\n\n-   [当处理包含大量预测变量的数据集时使用。]\n\n-   [当目标是识别最重要的预测变量子集时使用。]\n\n-   [用于探索性数据分析以筛选显著变量。]\n\
    \n真实世界示例：\n\n-   [医学研究：识别对特定健康结果最重要的因素。]\n\n-   [经济学：确定对 GDP 增长影响最大的关键经济指标。]\n\
    \n数学背景：\n\n-   [前向选择：从无预测变量开始，逐个添加预测变量，依据选定标准。]\n\n-   [后向消除：从所有预测变量开始，逐个删除预测变量，依据选定标准。]\n\
    \n-   [双向消除：前向选择与后向消除的结合，根据标准同时添加和删除预测变量。]\n\n损失函数：\n\n[选择添加或删除预测变量的标准：]\n\n-\
    \   [p 值：通常在 p 值低于特定阈值时加入预测变量，p 值高于阈值时删除。]\n\n-   [AIC（Akaike 信息准则）：数值越小，模型越好。]\n\
    \n-   [BIC（贝叶斯信息准则）：数值越小，模型越好。]\n\n优缺点：\n\n☺ 优点：\n\n⇨ 能处理大量预测变量。\n\n⇨ 有助于识别显著预测变量。\n\
    \n⇨ 通过减少变量数量提高模型可解释性。\n\n☹ 缺点：\n\n 当预测变量很多时计算开销可能较大。\n\n 如果控制不当，易产生过拟合。\n\n\
     结果对初始模型和预测变量的加入/删除顺序敏感。\n\n示意图：\n\n![](img/image-DQS633WF.jpg)\n\n## 2.11 量子回归\n\
    \n主要概念：量子回归是统计学和计量经济学中的一种回归分析方法，用于估计响应变量的条件量子（如中位数或 90% 分位点）。与普通最小二乘回归（OLS）估计条件均值不同，量子回归估计中位数或其他量子，从而提供更全面的变量关系分析。\n\
    \n主要目的：量子回归的主要目标是通过估计因变量条件分布的不同点，提供因变量与自变量之间关系的更完整视图。这在变量关系随分位数而变化的情形下特别有用。\n\n\
    何时使用：\n\n-   [当数据存在异方差（方差随观测值变化）时使用。]\n\n-   [当你想了解变量在结果分布不同点上的影响时使用。]\n\n-  \
    \ [当因变量与自变量的关系在不同的结果值上并不一致时使用。]\n\n真实世界示例：\n\n-   [收入不平等分析：研究影响收入的因素在收入分布的不同点（如中位收入与前\
    \ 10% 收入）上的影响。]\n\n-   [住房市场分析：理解房产特征如何影响不同价格区间（如低价房与高价房）的价格。]\n\n数学背景：\n\n![](img/image-GR541BHA.png)\
    \  \n\n![](img/image-9291RPJM.png)\n\n[该函数对残差进行非对称惩罚，取决于估计的量子是高于还是低于该量子。]\n\n\
    优缺点：\n\n☺ 优点：\n\n⇨ 提供变量关系的全面视图。\n\n⇨ 对离群点具有鲁棒性。\n\n⇨ 可以建模条件分布的不同部分。\n\n☹ 缺点：\n\
    \n 计算开销比 OLS 更大。\n\n 结果解释可能更为复杂。\n\n 需要更高级的工具和技术进行估计和推断。\n\n示意图：\n\n![](img/image-0BRLQ0N3.png)\n\
    \n## 3 分类算法\n\n分类算法用于将数据分类到预定义的类别或标签中。常见的算法包括逻辑回归、决策树、随机森林和支持向量机。它们广泛应用于垃圾邮件过滤、图像识别和医疗诊断等场景，目标是为数据点分配特定类别。\n\
    \n## 3.1 Logistic Regression\n\n主要概念：逻辑回归是一种统计方法，用于建模依赖变量（二元变量）与一个或多个自变量之间的关系。\n\
    \n"
