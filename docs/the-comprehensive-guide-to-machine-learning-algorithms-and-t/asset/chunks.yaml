    He holds a B.Sc. in mathematics from the University of Bahrain and an M.Sc. in
    human resources management (HRM) from Applied Science University (AUS) in Bahrain.
    His research interests include machine learning, MATH, and Human resources. He
    is currently working as the head of the human resources planning department.


