- raw: "❑  Graph Structure: Builds a graph to represent the relationships between\
    \ data points.\n\nLoss Function:\n\n![](images/image-JXNUXZJG.png)\n\nSteps in\
    \ UMAP:\n\n❑  Construct a high-dimensional fuzzy topological representation of\
    \ the data.\n\n❑  Create a low-dimensional embedding that maintains the topological\
    \ structure using optimization techniques.\n\n❑  Minimize the cross-entropy loss\
    \ between the high-dimensional and low-dimensional representations.\n\n❑  Optimize\
    \ the embedding using stochastic gradient descent or other optimization methods.\n\
    \nPros and Cons:\n\n☺  Pros:\n\n⇨  Preserves both local and global structure of\
    \ the data.\n\n⇨  Effective for visualizing and understanding complex data relationships.\n\
    \n⇨  Provides a flexible framework for exploring and analyzing high-dimensional\
    \ data.\n\n☹  Cons:\n\n  Computationally intensive for large datasets.\n\n \
    \ Requires careful tuning of parameters for optimal results.\n\n  Interpretation\
    \ of distances in the low-dimensional space can be challenging.\n\nIllustrative\
    \ Figure:\n\n![](images/image-4QXU30MS.png)\n\n## 7.5  Independent Component Analysis\
    \ (ICA)\n\nMain Concept: Independent Component Analysis (ICA) is a statistical\
    \ technique used for separating a multivariate signal into additive, independent\
    \ components. It assumes that the observed data are a linear combination of independent\
    \ source signals, which can then be estimated by maximizing statistical independence.\n\
    \nMain Purpose: To uncover hidden factors (independent components) that underlie\
    \ observed data, aiming to separate mixed signals into their original source components.\n\
    \nWhen to Use It:\n\n❑  When you have mixed signals that are assumed to be linear\
    \ combinations of independent sources.\n\n❑  Effective for blind source separation,\
    \ such as separating speech signals from background noise.\n\n❑  Suitable for\
    \ preprocessing data in domains like neuroscience, telecommunications, and image\
    \ processing.\n\nReal-World Examples:\n\n❑  Telecommunications: Separating mixed\
    \ signals in telecommunications to identify individual sources.\n\n❑  Neuroscience:\
    \ Analyzing brain imaging data to isolate neural signals.\n\n❑  Finance: Extracting\
    \ underlying factors influencing financial time series data.\n\nMath Background:\n\
    \n❑  Statistical Independence: Maximizes the statistical independence between\
    \ estimated components.\n\n❑  Objective Function: Typically involves maximizing\
    \ non-Gaussianity or minimizing mutual information.\n\n❑  Algorithm: Iterative\
    \ algorithms such as FastICA or JADE are commonly used to estimate independent\
    \ components.\n\nLoss Function:\n\nNon-Gaussianity Measure Commonly used to maximize\
    \ the non-Gaussianity of the estimated components.\n\nSteps in ICA:\n\n❑  Preprocess\
    \ the data to ensure zero mean and unit variance.\n\n❑  Initialize weight vectors\
    \ wi​ randomly or using predefined methods.\n\n❑  Update weight vectors iteratively\
    \ to maximize non-Gaussianity or minimize mutual information.\n\n❑  Normalize\
    \ weight vectors to obtain the independent components.\n\nPros and Cons:\n\n☺ \
    \ Pros:\n\n⇨  Uncovers hidden factors in data without requiring labeled examples.\n\
    \n⇨  Effective for separating mixed signals into their sources.\n\n⇨  Widely applicable\
    \ across different domains and signal types.\n\n☹  Cons:\n\n  Assumes linear\
    \ mixing and statistical independence, which may not always hold.\n\n  Sensitive\
    \ to noise and outliers in data.\n\n  Difficult to interpret the meaning of the\
    \ extracted components.\n\nIllustrative Figure:\n\n![](images/image-EU6XSPI4.png)![](images/image-0RLNETEO.png)\n\
    \n## 8.  Optimization Algorithms\n\nOptimization techniques are used to minimize\
    \ or maximize an objective function during model training. Methods like gradient\
    \ descent, stochastic gradient descent (SGD), and Adam are crucial for adjusting\
    \ model parameters to achieve the best performance. Optimization is central to\
    \ both traditional machine learning and deep learning.\n\n## 8.1  Particle Swarm\
    \ Optimization (PSO)\n\nMain Concept: Particle Swarm Optimization (PSO) is a population-based\
    \ stochastic optimization technique inspired by the social behavior of bird flocking\
    \ or fish schooling. It maintains a population of candidate solutions (particles)\
    \ and iteratively adjusts their positions and velocities towards better solutions\
    \ based on their own experience and the experience of neighboring particles.\n\
    \nMain Purpose: To find optimal solutions in a search space by iteratively updating\
    \ particles' positions and velocities based on their own best-known positions\
    \ and the best-known positions of their neighbors.\n\nWhen to Use It:\n\n❑  When\
    \ searching for solutions in complex and multimodal optimization problems.\n\n\
    ❑  Effective for problems where the objective function is noisy or non-differentiable.\n\
    \n❑  Suitable for parallel computing environments and problems with a large number\
    \ of variables.\n\nReal-World Examples:\n\n❑  Engineering: Optimizing the design\
    \ parameters of mechanical structures.\n\n❑  Finance: Portfolio optimization and\
    \ risk management.\n\n❑  Robotics: Trajectory planning and control.\n\nMath Background:\n\
    \n![](images/image-57P0SR4A.png)  \n\n![](images/image-LL8I1UVC.png)  \n\n![](images/image-25YIXNU2.png)\n\
    \nSteps in PSO:\n\n❑  Initialize a swarm of particles randomly within the search\
    \ space.\n\n❑  Evaluate the objective function for each particle.\n\n❑  Update\
    \ each particle's velocity and position based on its own experience and the experience\
    \ of its neighbors.\n\n❑  Repeat until convergence criteria are met or a maximum\
    \ number of iterations is reached.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Simple\
    \ to implement and parallelize.\n\n⇨  Does not require gradient information.\n\
    \n⇨  Can handle multimodal and noisy objective functions.\n\n☹  Cons:\n\n  May\
    \ suffer from premature convergence or stagnation in some cases.\n\n  Requires\
    \ careful tuning of parameters (such as inertia weight and acceleration constants).\n\
    \n  Performance is highly dependent on problem characteristics and parameter\
    \ settings.\n\nIllustrative Figure:\n\n![](images/image-A6S9CL54.png)\n\n## 8.2 \
    \ Genetic Algorithm\n\nMain Concept: Genetic Algorithms (GA) are stochastic optimization\
    \ algorithms inspired by natural selection and genetics. They operate by maintaining\
    \ a population of candidate solutions (individuals) encoded as chromosomes, which\
    \ then evolved over generations through selection, crossover, and mutation operations\
    \ to find optimal or near-optimal solutions to complex optimization problems.\n\
    \nMain Purpose: To solve optimization problems by mimicking the process of natural\
    \ evolution, iteratively improving candidate solutions based on their fitness.\n\
    \nWhen to Use It:\n\n❑  Suitable for optimization problems with complex, multimodal,\
    \ or non-linear objective functions.\n\n❑  Effective for problems where gradient-based\
    \ methods are not applicable or inefficient.\n\n❑  Useful for problems with multiple\
    \ objectives or constraints.\n\nReal-World Examples:\n\n❑  Engineering: Design\
    \ optimization in structural engineering and aerodynamics.\n\n❑  Manufacturing:\
    \ Production scheduling and resource allocation.\n\n❑  Finance: Portfolio optimization\
    \ and algorithmic trading strategies.\n\nMath Background:\n\n❑  Population: Maintain\
    \ a population of candidate solutions (individuals).\n\n❑  Selection: Choose individuals\
    \ based on their fitness (objective function value).\n\n❑  Crossover: Combine\
    \ genetic material (chromosomes) of selected individuals to create offspring.\n\
    \n❑  Mutation: Introduce random changes to individual chromosomes to maintain\
    \ diversity.\n\nLoss Function:\n\nObjective Function: Minimize or maximize the\
    \ objective function f(x) over the search space x.\n\nSteps in GA:\n\n❑  Initialization:\
    \ Generate an initial population of individuals randomly or using heuristics.\n\
    \n❑  Evaluation: Evaluate the fitness of everyone based on the objective function.\n\
    \n❑  Selection: Choose individuals probabilistically based on their fitness to\
    \ form the next generation.\n\n❑  Crossover: Create new individuals by combining\
    \ genetic material (chromosomes) of selected individuals.\n\n❑  Mutation: Introduce\
    \ random changes to individuals to maintain genetic diversity."
