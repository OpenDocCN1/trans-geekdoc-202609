- raw: "⇨  Combines the benefits of SMOTE and Tomek links, balancing the class distribution\
    \ and reducing noise and overlap.\n\n⇨  Improves classifier performance by providing\
    \ a cleaner and more representative dataset.\n\n☹  Cons:\n\n  Computationally\
    \ more intensive due to the combination of synthetic sampling and dataset cleaning\
    \ processes.\n\n  May still require careful parameter tuning to avoid removing\
    \ useful instances or generating non-representative synthetic samples.\n\nIllustrative\
    \ Figure:\n\n![](images/image-NBQLF2L6.png)\n\n## 16.  Fine-tune techniques for\
    \ LLMs\n\nFine-tuning involves adjusting pre-trained large language models on\
    \ specific tasks or datasets to enhance performance for applications. Techniques\
    \ include supervised fine-tuning with labeled data, transfer learning, and domain\
    \ adaptation. Fine-tuning allows LLMs to be customized for diverse applications,\
    \ from legal document analysis to customer support chatbots.\n\n## 16.1  LoRA\
    \ (Low-Rank Adaptation)\n\nMain Concept: LoRA (Low-Rank Adaptation) is a fine-tuning\
    \ technique for large language models (LLMs) that leverages low-rank matrix factorization\
    \ to adapt pre-trained models efficiently and effectively. By decomposing the\
    \ weight updates into low-rank matrices, LoRA aims to reduce the number of trainable\
    \ parameters and computational requirements, while maintaining high performance.\n\
    \nMain Purpose: To enable efficient and effective fine-tuning of large pre-trained\
    \ language models with reduced computational cost and memory usage.\n\nWhen to\
    \ Use It:\n\n❑  When there is a need to fine-tune large pre-trained language models\
    \ on specific tasks with limited computational resources.\n\n❑  For applications\
    \ that require adapting large models to new domains or tasks without retraining\
    \ the entire model.\n\nReal-World Examples:\n\n❑  Text Classification: Fine-tuning\
    \ a large pre-trained model for specific text classification tasks with limited\
    \ labeled data.\n\n❑  Sentiment Analysis: Adapting a language model to analyze\
    \ sentiment in a specific domain, such as financial or medical texts.\n\n❑  Question\
    \ Answering: Enhancing a pre-trained model’s performance on custom question-answering\
    \ datasets.\n\n❑  Machine Translation: Fine-tuning a multilingual model to improve\
    \ translation accuracy for specific language pairs or domains.\n\n❑  Named Entity\
    \ Recognition (NER): Adapting a pre-trained model for recognizing domain-specific\
    \ entities in text.\n\nMath Background:\n\n![](images/image-NISQMC0A.png)  \n\n\
    ![](images/image-N9ROYK0I.png)\n\nSteps in Using LoRA:\n\n❑  Pre-Training: Start\
    \ with a large pre-trained language model.\n\n❑  Matrix Factorization: Decompose\
    \ the weight updates into low-rank matrices A and B.\n\n❑  Fine-Tuning: Update\
    \ only the low-rank matrices A and BBB on the target task’s dataset while keeping\
    \ the original weights W fixed.\n\n❑  Evaluation: Assess the fine-tuned model’s\
    \ performance using appropriate metrics for the task.\n\n❑  Deployment: Deploy\
    \ the fine-tuned model for inference on the target task.\n\nPros and Cons:\n\n\
    ☺  Pros:\n\n⇨  Significantly reduces the number of trainable parameters, lowering\
    \ computational and memory requirements.\n\n⇨  Efficiently adapts large pre-trained\
    \ models to new tasks without extensive retraining.\n\n⇨  Maintains high performance\
    \ despite the reduced number of parameters.\n\n☹  Cons:\n\n  The approximation\
    \ may not capture all nuances of the task for extremely complex adaptations.\n\
    \n  Requires careful tuning of the rank r and scaling factor α\\\\alphaα to achieve\
    \ optimal performance.\n\nIllustrative Figure:\n\n![](images/image-NQ6U6EK6.png)\n\
    \n## 16.2  Quantized LoRA (QLoRA)\n\nMain Concept: QLoRA is an efficient finetuning\
    \ approach for large language models (LLMs) that significantly reduces memory\
    \ usage while maintaining the performance of full 16-bit finetuning. It achieves\
    \ this by backpropagating gradients through a frozen, 4-bit quantized pre-trained\
    \ language model into Low-Rank Adapters.\n\nMath Background:\n\n❑  Equation: W′=W+Q(A)Q(B),\
    \ Q(A), Q(B): Quantized versions of the low-rank matrices.\n\n❑  Objective: Optimize\
    \ the quantized matrices to retain performance while reducing memory usage.\n\n\
    Loss Function:\n\nCommonly Used: Cross-entropy loss, Mean Squared Error (MSE),\
    \ etc.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Further reduces memory footprint and\
    \ computational requirements.\n\n⇨  Suitable for deployment on edge devices.\n\
    \n☹  Cons:\n\n  Quantization can introduce approximation errors.\n\n  Requires\
    \ careful balance between compression and accuracy.\n\nWhen to Use It:\n\n❑  Edge\
    \ Deployment: When deploying models on devices with limited memory and computational\
    \ power.\n\n❑  High Efficiency: For scenarios where model size and speed are critical.\n\
    \nExample Use Cases:\n\n❑  Mobile Applications: Fine-tuning models for mobile\
    \ apps with strict memory and speed constraints.\n\n❑  IoT Devices: Deploying\
    \ models on Internet of Things (IoT) devices for real-time processing.\n\nIllustrative\
    \ Figure:\n\n––––––––\n\n![](images/image-530XNNV3.png)\n\n## 16.3  Parameter\
    \ Efficient Fine Tuning (PEFT)\n\nMain Concept: PEFT is an NLP technique that\
    \ adapts pre-trained language models efficiently to various applications by fine-tuning\
    \ only a small set of parameters, reducing computational and storage costs. It\
    \ combats catastrophic forgetting, adjusting key parameters for specific tasks,\
    \ and delivers comparable performance to full fine-tuning across modalities like\
    \ image classification and stable diffusion dream booth. It's a valuable approach\
    \ for high performance with minimal trainable parameters.\n\nMath Background:\n\
    \n❑  Equation: W′=W+ΔW, ΔW: Sparse or structured updates to the original weights.\n\
    \n❑  Objective: Minimize changes to the pre-trained weights while maximizing task-specific\
    \ performance.\n\nLoss Function:\n\nCommonly Used: Cross-entropy loss, Mean Squared\
    \ Error (MSE), etc.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Reduces the number of\
    \ trainable parameters.\n\n⇨  Maintains pre-trained model’s integrity and generalization\
    \ capabilities.\n\n☹  Cons:\n\n  Requires careful selection of parameters to\
    \ fine-tune.\n\n  May need multiple iterations to identify optimal parameters.\n\
    \nWhen to Use It:\n\n❑  Large Models: When fine-tuning large models where training\
    \ all parameters is impractical.\n\n❑  Transfer Learning: For adapting models\
    \ to new tasks with limited data.\n\nExample Use Cases:\n\n❑  Text Classification:\
    \ Adapting a pre-trained language model to classify texts into various categories.\n\
    \n❑  Speech Recognition: Fine-tuning models to recognize and transcribe specific\
    \ accents or dialects.\n\nIllustrative Figure:\n\n![](images/image-P0HC006D.png)\n\
    \n## 16.4  DeepSpeed\n\nMain Concept: DeepSpeed is a deep learning software library\
    \ that accelerates the training of large language models. It includes ZeRO (Zero\
    \ Redundancy Optimizer), a memory-efficient approach for distributed training.\
    \ DeepSpeed can automatically optimize fine-tuning jobs that use Hugging Face’s\
    \ Trainer API and offer a drop-in replacement script to run existing fine-tuning\
    \ scripts.\n\nMath Background:\n\n❑  Equation: Extends typical optimization algorithms\
    \ with distributed training enhancements.\n\n❑  Objective: Maximize training efficiency\
    \ and scalability for large models.\n\nLoss Function:\n\nCommonly Used: Task-specific\
    \ loss functions like cross-entropy, MSE, etc.\n\nPros and Cons:\n\n☺  Pros:\n\
    \n⇨  Significant speedup in training large models.\n\n⇨  Reduces memory usage\
    \ with optimizations like ZeRO.\n\n☹  Cons:\n\n  Requires a complex setup for\
    \ distributed training.\n\n  May need infrastructure support for large-scale\
    \ training.\n\nWhen to Use It:\n\n❑  Large Scale Training: For training very large\
    \ models across multiple GPUs or nodes.\n\n❑  High Performance Needs: When training\
    \ efficiency and speed are critical.\n\nExample Use Cases:\n\n❑  Language Modeling:\
    \ Training very large language models like GPT-3.\n\n❑  Image Classification:\
    \ Large-scale training for computer vision tasks.\n\nIllustrative Figure:\n\n\
    ![](images/image-U8EK6OO0.png)\n\n## 16.5  ZeRO (Zero Redundancy Optimizer)"
