    ❑  Stock Price Prediction: using historical price trends and some market indicators
    to predict future stock prices.


    Math Background


    ![](images/image-Q8FZ71ID.png)


    Pros and Cons


    ☺  Pros:


    ⇨  Effective in high dimensional spaces and when the number of dimensions exceeds
    the number of samples.


    ⇨  powerful to deal with overfitting, particularly in high-dimensional cases.


    ⇨  Diverse, with different kernel functions for modeling complex relationships.


    ☹  Cons:


      It might be challenging to tune the hyperparameters (e.g., C, ϵ) and choose
    the right kernel.


      intensive regarding the computational, notably with large datasets.


      It can be difficult to interpret the model results.


    Illustrative Figure


    ![](images/image-YI3VK4S7.png)


    ## 2.4  Decision Tree for Regression


    Main Concept: A decision Tree for regression is a supervised learning method utilized
    to predict continuous outputs. It creates a tree-like model of decisions by splitting
    the data into subsets based on the value of input features.


    Main Purpose: It aims to split the feature space into regions where the prediction
    is a constant value to minimize the mean squared error within each region.


    When to Use It:


    ❑  If the relationship between variables and the output variable is non-linear
    and complex.


    ❑  When the model interpretability is crucial.


    ❑  When dealing with datasets with a combination of numerical and categorical
    features.


    Real-World Examples:


    ❑  House Price Prediction: Predicting house prices based on size, location, and
    number of bedrooms. etc.


    ❑  Equipment Life Span predicting: predicting the remaining life of the industrial
    equipment based on the operating data.


    Math Background


    ![](images/image-FVG9PA37.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  Simple to understand and interpret.


    ⇨  Can deal with numerical and categorical data at the same time.


    ⇨  no need for normalization or scaling because it requires little data preprocessing.


    ☹  Cons:


      likely to overfit, mainly with deep trees.


      unstable in some cases, where little changes in data might result in a totally
    different tree.


      Biased towards features with more levels or categories.


    Illustrative Figure:


    ![](images/image-QAS8PJI4.png)![](images/image-E7MYH95Q.png)


    ## 2.5  Random Forest for Regression


    Main Concept: RF for regression is an ensemble learning method that builds several
    decision trees and incorporates them to obtain more accurate predictions. It integrates
    the predictions of several base estimators to optimize generalizability and robustness
    over a single estimator.


    Main Purpose: It aims to optimize the accuracy of the predictions and control
    overfitting by averaging several decision trees trained on different parts of
    the same training set.


    When to Use It:


    ❑  In the case of seeking for high predictive accuracy.


    ❑  In the case of dealing with datasets includes many features.


    ❑  If there is a need to prevent overfitting and optimize model stability.


    Real-World Examples:


    ❑  Environmental Modeling: forecasting the air quality based on environmental
    data like temperature, humidity, and pollutants.


    ❑  Economic predicting: using historical data and various influencing factors
    to Predict economic indicators like the growth rate of the GDP.


    Math Background


    ![](images/image-BV4UNGZ1.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  Predictions with high accuracy due to the ensemble technique.


    ⇨  Strong ability to prevent overfitting compared to the decision trees method.


    ⇨  The ability to handle large datasets with higher dimensionality.


    ☹  Cons:


      requires more resources and is computationally intensive.


      compared to single decision trees it is less interpretable.


      due to the large number of trees, it might be slower.


    Illustrative Figure:


    ![](images/image-12ZAQODD.jpg)


    ## 2.6  Neural Networks for Regression


    Main Concept: Neural Networks for regression are computational models that mimic
    the human brain''s structure, developed to forecast continuous target values.
    They are formed of interconnected layers of neurons (nodes) that process input
    data and learn sophisticated patterns through backpropagation and some other optimization
    techniques.


    Main Purpose: the main target of the NN is to model complex, non-linear relationships
    between input variables and a continuous output variable, offering high predictive
    accuracy.


    When to Use It:


    ❑  In the case that the relationship between input variables and the output variable
    is highly non-linear and complex.


    ❑  To handle big datasets with numerous features.


    ❑  In the case that the traditional regression models fail to capture the core
    patterns in the data.


    Real-World Examples:


    ❑  House Price forecasting: forecast house prices based on location, size, and
    number of bedrooms. etc.


    ❑  Stock Price Forecasting: Predicting future stock prices using historical price
    data and other market indicators.


    Math background:


    ![](images/image-PAPCG195.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  The ability to model complex and non-linear relationships.


    ⇨  Flexible with diverse architectures (e.g. convolutional, recurrent).


    ⇨  Handling big and high-dimensional datasets.


    ☹  Cons:


      Requires keen tuning of hyperparameters such as learning rate, number of layers,
    and number of neurons.


      Computationally intensive.


      Requires significant resources for training.


      likely to overfit if not correctly regularized.


    Illustrative Figure:


    ![](images/image-DOTOMH5N.png)


    ## 2.7  GBM (Gradient Boosting Machine)


    Main Concept: Gradient Boosting Machine (GBM) is an ensemble learning technique
    that builds multiple weak learners, typically decision trees, and combines them
    to form a strong predictive model. It iteratively adds trees to the model, each
    one correcting the errors of the previous trees by optimizing a loss function.


    Main Purpose: The primary goal of GBM for regression is to create a powerful predictive
    model that minimizes the prediction error by sequentially adding trees that reduce
    the residual errors of the previous trees.


    When to Use It:


    ❑  When high predictive accuracy is required.


    ❑  When the data has complex, non-linear relationships.


    ❑  For problems with a large amount of data and features.


    Real-World Examples:


    ❑  Insurance Premium Calculation: Predicting insurance premiums based on customer
    data and risk factors.


    ❑  Sales Forecasting: Predicting future sales based on historical sales data and
    other influencing factors.


    Math background:


    ![](images/image-LBKAY0RH.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  High predictive accuracy.


    ⇨  Can handle a mix of numerical and categorical features.


    ⇨  Robust to overfitting with proper regularization.


    ☹  Cons:


      Computationally intensive and can be slow to train.


      Requires careful tuning of hyperparameters (e.g., learning rate, number of
    trees).


      Less interpretable compared to simpler models.


    Illustrative Figure:


    ![](images/image-1DZDUSRB.png)


    ## 2.8  GLM (Generalized Linear Models)


    Main Concept: Generalized Linear Models (GLMs) extend linear regression by allowing
    the dependent variable to have a distribution other than a normal distribution.
    GLMs consist of three components: a linear predictor, a link function, and a variance
    function describing the distribution of the dependent variable.


    Main Purpose: The primary goal of GLMs is to provide a flexible framework for
    modeling different types of response variables, such as binary, count, and continuous
    outcomes, by using different link functions and distributions.


    When to Use It:


    ❑  When the dependent variable does not follow a normal distribution.'
  fmt: '

    When the is a need for a generalizable and solid model for predicting continuous
    outcomes.


    When balance between fitting the training data and maintaining generalization
    to new data is needed.


    Real-World Examples


    Forecasting Energy Consumption: Forecasting the usage of future energy based on
    historical data with various influencing factors.


    Stock Price Prediction: using historical price trends and some market indicators
    to predict future stock prices.


    Math Background

    ![](images/image-Q8FZ71ID.png)


    Pros and Cons


    ☺  Pros:


    ⇨  Effective in high dimensional spaces and when the number of dimensions exceeds
    the number of samples.


    ⇨  powerful to deal with overfitting, particularly in high-dimensional cases.


    ⇨  Diverse, with different kernel functions for modeling complex relationships.


    ☹  Cons:


      It might be challenging to tune the hyperparameters (e.g., C, ϵ) and choose
    the right kernel.


      intensive regarding the computational, notably with large datasets.


      It can be difficult to interpret the model results.


    Illustrative Figure

    ![](images/image-YI3VK4S7.png)


    ## 2.4  Decision Tree for Regression


    Main Concept: A decision Tree for regression is a supervised learning method utilized
    to predict continuous outputs. It creates a tree-like model of decisions by splitting
    the data into subsets based on the value of input features.


    Main Purpose: It aims to split the feature space into regions where the prediction
    is a constant value to minimize the mean squared error within each region.


    When to Use It:


    ❑  If the relationship between variables and the output variable is non-linear
    and complex.


    ❑  When the model interpretability is crucial.


    ❑  When dealing with datasets with a combination of numerical and categorical
    features.


    Real-World Examples:


    ❑  House Price Prediction: Predicting house prices based on size, location, and
    number of bedrooms. etc.


    ❑  Equipment Life Span predicting: predicting the remaining life of the industrial
    equipment based on the operating data.


    Math Background

    ![](images/image-FVG9PA37.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  Simple to understand and interpret.


    ⇨  Can deal with numerical and categorical data at the same time.


    ⇨  no need for normalization or scaling because it requires little data preprocessing.


    ☹  Cons:


      likely to overfit, mainly with deep trees.


      unstable in some cases, where little changes in data might result in a totally
    different tree.


      Biased towards features with more levels or categories.


    Illustrative Figure:

    ![](images/image-QAS8PJI4.png)![](images/image-E7MYH95Q.png)


    ## 2.5  Random Forest for Regression


    Main Concept: RF for regression is an ensemble learning method that builds several
    decision trees and incorporates them to obtain more accurate predictions. It integrates
    the predictions of several base estimators to optimize generalizability and robustness
    over a single estimator.


    Main Purpose: It aims to optimize the accuracy of the predictions and control
    overfitting by averaging several decision trees trained on different parts of
    the same training set.


    When to Use It:


    ❑  In the case of seeking for high predictive accuracy.


    ❑  In the case of dealing with datasets includes many features.


    ❑  If there is a need to prevent overfitting and optimize model stability.


    Real-World Examples:


    ❑  Environmental Modeling: forecasting the air quality based on environmental
    data like temperature, humidity, and pollutants.


    ❑  Economic predicting: using historical data and various influencing factors
    to Predict economic indicators like the growth rate of the GDP.


    Math Background

    ![](images/image-BV4UNGZ1.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  Predictions with high accuracy due to the ensemble technique.


    ⇨  Strong ability to prevent overfitting compared to the decision trees method.


    ⇨  The ability to handle large datasets with higher dimensionality.


    ☹  Cons:


      requires more resources and is computationally intensive.


      compared to single decision trees it is less interpretable.


      due to the large number of trees, it might be slower.


    Illustrative Figure:

    ![](images/image-12ZAQODD.jpg)


    ## 2.6  Neural Networks for Regression


    Main Concept: Neural Networks for regression are computational models that mimic
    the human brain''s structure, developed to forecast continuous target values.
    They are formed of interconnected layers of neurons (nodes) that process input
    data and learn sophisticated patterns through backpropagation and some other optimization
    techniques.


    Main Purpose: the main target of the NN is to model complex, non-linear relationships
    between input variables and a continuous output variable, offering high predictive
    accuracy.


    When to Use It:


    ❑  In the case that the relationship between input variables and the output variable
    is highly non-linear and complex.


    ❑  To handle big datasets with numerous features.


    ❑  In the case that the traditional regression models fail to capture the core
    patterns in the data.


    Real-World Examples:


    ❑  House Price forecasting: forecast house prices based on location, size, and
    number of bedrooms. etc.


    ❑  Stock Price Forecasting: Predicting future stock prices using historical price
    data and other market indicators.


    Math background:

    ![](images/image-PAPCG195.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  The ability to model complex and non-linear relationships.


    ⇨  Flexible with diverse architectures (e.g. convolutional, recurrent).


    ⇨  Handling big and high-dimensional datasets.


    ☹  Cons:


      Requires keen tuning of hyperparameters such as learning rate, number of layers,
    and number of neurons.


      Computationally intensive.


      Requires significant resources for training.


      likely to overfit if not correctly regularized.


    Illustrative Figure:

    ![](images/image-DOTOMH5N.png)


    ## 2.7  GBM (Gradient Boosting Machine)


    Main Concept: Gradient Boosting Machine (GBM) is an ensemble learning technique
    that builds multiple weak learners, typically decision trees, and combines them
    to form a strong predictive model. It iteratively adds trees to the model, each
    one correcting the errors of the previous trees by optimizing a loss function.


    Main Purpose: The primary goal of GBM for regression is to create a powerful predictive
    model that minimizes the prediction error by sequentially adding trees that reduce
    the residual errors of the previous trees.


    When to Use It:


    ❑  When high predictive accuracy is required.


    ❑  When the data has complex, non-linear relationships.


    ❑  For problems with a large amount of data and features.


    Real-World Examples:


    ❑  Insurance Premium Calculation: Predicting insurance premiums based on customer
    data and risk factors.


    ❑  Sales Forecasting: Predicting future sales based on historical sales data and
    other influencing factors.


    Math background:

    ![](images/image-LBKAY0RH.png)


    Pros and Cons:


    ☺  Pros:


    ⇨  High predictive accuracy.


    ⇨  Can handle a mix of numerical and categorical features.


    ⇨  Robust to overfitting with proper regularization.


    ☹  Cons:


      Computationally intensive and can be slow to train.


      Requires careful tuning of hyperparameters (e.g., learning rate, number of
    trees).


      Less interpretable compared to simpler models.


    Illustrative Figure:

    ![](images/image-1DZDUSRB.png)


    ## 2.8  GLM (Generalized Linear Models)


    Main Concept: Generalized Linear Models (GLMs) extend linear regression by allowing
    the dependent variable to have a distribution other than a normal distribution.
    GLMs consist of three components: a linear predictor, a link function, and a variance
    function describing the distribution of the dependent variable.


    Main Purpose: The primary goal of GLMs is to provide a flexible framework for
    modeling different types of response variables, such as binary, count, and continuous
    outcomes, by using different link functions and distributions.


    When to Use It:


    ❑  When the dependent variable does not follow a normal distribution.

