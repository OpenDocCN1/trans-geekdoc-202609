- raw: "❑  When dealing with time series data that have a clear seasonal pattern.\n\
    \n❑  For forecasting future values based on past values, including seasonal fluctuations.\n\
    \n❑  Suitable for data with trends, seasonality, and other cyclic behaviors.\n\
    \nReal-World Examples:\n\n❑  Retail Sales Forecasting: Predicting monthly sales\
    \ that have seasonal spikes during holidays.\n\n❑  Weather Forecasting: Forecasting\
    \ temperatures, precipitation, or other weather variables that exhibit seasonal\
    \ variations.\n\n❑  Electricity Demand: Predicting electricity consumption which\
    \ can vary seasonally.\n\n❑  Tourism: Forecasting tourist visits to a location\
    \ that often follows a seasonal pattern.\n\nMath Background:\n\n![](images/image-WL6YPEK7.png)\
    \  \n\n![](images/image-9QXAR9QQ.png)\n\nCombined SARIMA Model:\n\nSARIMA(p,d,q)\
    \ (P,D,Q) s\n\np: Order of the non-seasonal AR part.\n\nd: Degree of non-seasonal\
    \ differencing.\n\nq: Order of the non-seasonal MA part.\n\nP: Order of the seasonal\
    \ AR part.\n\nD: Degree of seasonal differencing.\n\nQ: Order of the seasonal\
    \ MA part.\n\ns: Length of the seasonal cycle.\n\nLoss Function:\n\n![](images/image-U0TGYZWO.png)\n\
    \nSteps in SARIMA:\n\n❑  Identification: Determine the values of p, d, q, P, D,\
    \ Q, and s using tools like ACF and PACF plots.\n\n❑  Estimation: Estimate the\
    \ parameters of the non-seasonal and seasonal components.\n\n❑  Diagnostic Checking:\
    \ Check the residuals of the model to ensure they are white noise.\n\n❑  Forecasting:\
    \ Use the model to make predictions about future values.\n\nPros and Cons:\n\n\
    Pros:\n\n⇨  Effectively captures both seasonal and non-seasonal patterns in the\
    \ data.\n\n⇨  Provides a comprehensive framework for forecasting time series with\
    \ complex seasonality.\n\n⇨  Well-established and widely understood in time series\
    \ analysis.\n\nCons:\n\n  Requires careful identification and tuning of many\
    \ parameters.\n\n  Computationally intensive, especially for long seasonal cycles.\n\
    \n  Can be complex to interpret and diagnose.\n\nIllustrative Figure:\n\n![](images/image-5RG56JTZ.png)\n\
    \n## 11.3  SARIMAX (Seasonal ARIMA with eXogenous variables)\n\nMain Concept:\
    \ SARIMAX is an extension of SARIMA that includes exogenous variables (predictors)\
    \ to model the influence of external factors on the time series. It integrates\
    \ both seasonal and non-seasonal components, as well as external regressors, to\
    \ provide a more comprehensive forecasting model.\n\nMain Purpose: To analyze\
    \ and forecast time series data by capturing both the temporal structures and\
    \ the effects of external variables.\n\nWhen to Use It:\n\n❑  When dealing with\
    \ time series data with seasonal patterns and external influencing factors.\n\n\
    ❑  For forecasting future values where exogenous variables play a significant\
    \ role.\n\n❑  Suitable for data with trends, seasonality, and external influences.\n\
    \nReal-World Examples:\n\n❑  Economics: Forecasting economic indicators like GDP\
    \ with additional predictors such as interest rates and inflation.\n\n❑  Sales\
    \ Forecasting: Predicting sales with external factors like marketing spend and\
    \ economic indicators.\n\n❑  Weather Forecasting: Predicting weather patterns\
    \ with exogenous variables like geographic factors.\n\n❑  Energy Demand: Forecasting\
    \ electricity consumption considering external variables like temperature and\
    \ population growth.\n\nMath Background:\n\n![](images/image-5N1AQJTM.png)  \n\
    \n![](images/image-UOLEJ637.png)\n\nCombined SARIMAX Model:\n\nSARIMAX(p,d,q)(P,D,Q)s+Xt\n\
    \np: Order of the non-seasonal AR part.\n\nd: Degree of non-seasonal differencing.\n\
    \nq: Order of the non-seasonal MA part.\n\nP: Order of the seasonal AR part.\n\
    \nD: Degree of seasonal differencing.\n\nQ: Order of the seasonal MA part.\n\n\
    s: Length of the seasonal cycle.\n\nXt​: Exogenous variables at time t.\n\n![](images/image-L0GNSSHI.png)\n\
    \nSteps in SARIMAX:\n\n❑  Identification: Determine the values of p, d, q, P,\
    \ D, Q, s, and select exogenous variables using tools like ACF and PACF plots.\n\
    \n❑  Estimation: Estimate the parameters of the non-seasonal, seasonal components,\
    \ and exogenous variables.\n\n❑  Diagnostic Checking: Check the residuals of the\
    \ model to ensure they are white noise.\n\n❑  Forecasting: Use the model to make\
    \ predictions about future values, incorporating the exogenous variables.\n\n\
    Pros and Cons:\n\n☺  Pros:\n\n⇨  Captures both seasonal and non-seasonal patterns\
    \ in the data.\n\n⇨  Accounts for the influence of external variables, leading\
    \ to more accurate forecasts.\n\n⇨  Well-suited for complex time series data with\
    \ multiple influencing factors.\n\n☹  Cons:\n\n  Requires careful identification\
    \ and tuning of many parameters.\n\n  Computationally intensive, especially for\
    \ long seasonal cycles and multiple exogenous variables.\n\n  Can be complex\
    \ to interpret and diagnose.\n\nIllustrative Figure:\n\n![](images/image-KFBM7NIL.png)\n\
    \n## 11.4  Exponential Smoothing\n\nMain Concept: Exponential Smoothing is a time\
    \ series forecasting method that applies weighted averages of past observations,\
    \ with the weights decaying exponentially as observations get older. This technique\
    \ is useful for making short-term forecasts.\n\nMain Purpose: To predict future\
    \ values in a time series by giving more weight to recent observations while still\
    \ considering past data.\n\nWhen to Use It:\n\n❑  When dealing with time series\
    \ data that may have trends or seasonal patterns.\n\n❑  For short-term forecasting\
    \ where recent data is more indicative of future values.\n\n❑  Suitable for data\
    \ without significant seasonality (simple exponential smoothing) or with trends\
    \ and seasonality (Holt-Winters).\n\nReal-World Examples:\n\n❑  Inventory Management:\
    \ Predicting future inventory requirements based on past sales data.\n\n❑  Finance:\
    \ Forecasting stock prices or economic indicators.\n\n❑  Energy Consumption: Predicting\
    \ future electricity usage.\n\n❑  Weather Forecasting: Short-term weather predictions.\n\
    \nMath Background:\n\n![](images/image-528N32O8.png)  \n\n![](images/image-32H92L59.png)\
    \  \n\n![](images/image-8AZW3M73.png)\n\nSteps in Exponential Smoothing:\n\n❑ \
    \ Model Selection: Choose the appropriate exponential smoothing model (simple,\
    \ Holt’s, or Holt-Winters).\n\n❑  Parameter Estimation: Estimate the smoothing\
    \ parameters (α, β, γ) using optimization techniques.\n\n❑  Model Fitting: Fit\
    \ the model to the historical data.\n\n❑  Diagnostic Checking: Check the residuals\
    \ of the model to ensure they are white noise.\n\n❑  Forecasting: Use the fitted\
    \ model to make predictions about future values.\n\nPros and Cons:\n\n☺  Pros:\n\
    \n⇨  Simple and easy to implement.\n\n⇨  Effective for short-term forecasting.\n\
    \n⇨  Can handle data with trends and seasonality (Holt-Winters).\n\n☹  Cons:\n\
    \n  Assumes linear relationships and may not perform well with non-linear patterns.\n\
    \n  Requires selection and optimization of multiple parameters.\n\n  May not\
    \ be suitable for long-term forecasting due to reliance on recent data.\n\nIllustrative\
    \ Figure:\n\n![](images/image-D31LUNY2.png)\n\n## 11.5  Deep AR\n\nMain Concept:\
    \ DeepAR is a probabilistic forecasting model based on autoregressive recurrent\
    \ neural networks (RNNs). It is designed to predict future values in time series\
    \ data by leveraging the power of deep learning. Unlike traditional methods, DeepAR\
    \ can handle multiple related time series and produce probabilistic forecasts.\n\
    \nMain Purpose: To forecast time series data with complex patterns, including\
    \ seasonality, trends, and non-linear relationships, while providing uncertainty\
    \ estimates.\n\nWhen to Use It:\n\n❑  When dealing with large collections of related\
    \ time series.\n\n❑  For probabilistic forecasting where prediction intervals\
    \ are important.\n\n❑  Suitable for complex time series data with non-linear patterns.\n\
    \nReal-World Examples:\n\n❑  Retail: Forecasting product demand across multiple\
    \ stores and products.\n\n❑  Finance: Predicting stock prices and financial metrics.\n\
    \n❑  Energy: Forecasting electricity demand across different regions.\n\n❑  Healthcare:\
    \ Predicting patient admissions or disease outbreaks.\n\nMath Background:\n\n\
    ![](images/image-GCURFS8I.png)  \n\n![](images/image-AE04CHR5.png)\n\nSteps in\
    \ DeepAR:\n\n❑  Data Preparation: Collect and preprocess the time series data\
    \ and covariates."
