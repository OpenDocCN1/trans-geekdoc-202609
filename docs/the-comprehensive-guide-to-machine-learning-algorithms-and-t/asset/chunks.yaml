- raw: "Main Purpose: To classify data into different categories by learning complex\
    \ patterns and relationships in the data through multiple layers of neurons.\n\
    \nWhen to Use It:\n\n❑  When you have large datasets and complex patterns.\n\n\
    ❑  Effective for both structured and unstructured data.\n\n❑  When feature extraction\
    \ is difficult and requires learning complex features.\n\nReal-World Examples:\n\
    \n❑  Image Recognition: Classifying images, such as identifying objects or people\
    \ in photos.\n\n❑  Natural Language Processing: Sentiment analysis, text classification,\
    \ and language translation.\n\nMath Background:\n\n❑  Structure: Consists of an\
    \ input layer, one or more hidden layers, and an output layer.\n\n❑  Activation\
    \ Functions: Common activation functions include ReLU (Rectified Linear\n\n![](images/image-94DU7A4K.png)\n\
    \nTypes of Neural Networks:\n\n❑  Feedforward Neural Networks (FNN): The simplest\
    \ type where connections do not form cycles.\n\n❑  Convolutional Neural Networks\
    \ (CNN): Specialized for processing grid-like topology data such as images.\n\n\
    ❑  Recurrent Neural Networks (RNN): Suitable for sequential data, such as time\
    \ series or natural language.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Can model complex\
    \ and non-linear relationships.\n\n⇨  Capable of learning from raw data without\
    \ needing manual feature extraction.\n\n⇨  Scalable to large datasets.\n\n☹  Cons:\n\
    \n  Requires a large amount of data and computational resources.\n\n  Often\
    \ seen as a \"black box\" due to lack of interpretability.\n\n  Prone to overfitting\
    \ if not properly regularized.\n\nIllustrative Figure:\n\n![](images/image-1H6B4QLW.png)\n\
    \n## 3.7  Gradient Boosting Machine (GBM) for Classification\n\nMain Concept:\
    \ Gradient Boosting Machine (GBM) is an ensemble learning technique that builds\
    \ models sequentially, each one correcting the errors of its predecessor. It combines\
    \ the predictions of multiple weak learners (typically decision trees) to produce\
    \ a strong learner.\n\nMain Purpose: To improve classification accuracy by reducing\
    \ the biases and variances in the model through iterative refinement.\n\nWhen\
    \ to Use It:\n\n❑  When you need high predictive accuracy.\n\n❑  Effective with\
    \ structured/tabular data.\n\n❑  Suitable when dealing with complex patterns and\
    \ interactions in data.\n\nReal-World Examples:\n\n❑  Credit Scoring: Predicting\
    \ the likelihood of a borrower defaulting on a loan.\n\n❑  Customer Churn Prediction:\
    \ Identifying customers likely to cancel a subscription.\n\nMath Background:\n\
    \n❑  Initialization: Start with an initial model, typically a simple model like\
    \ predicting the mean of the target variable.\n\n❑  Sequential Training: At each\
    \ step, fit a new model to the residual errors of the previous model.\n\n❑  Update:\
    \ Combine the new model with the previous models to update the prediction.\n\n\
    ![](images/image-1EVUCT4E.png)\n\nTypes of Gradient Boosting:\n\n❑  Gradient Boosting\
    \ for Classification: Typically uses decision trees as the base learners.\n\n\
    ❑  Gradient Boosting for Regression: Adapts the algorithm for continuous target\
    \ variables.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  High predictive accuracy.\n\n\
    ⇨  Robust to overfitting with proper regularization.\n\n⇨  Capable of handling\
    \ various types of data.\n\n☹  Cons:\n\n  Computationally intensive and slower\
    \ to train compared to other models.\n\n  Requires careful tuning of parameters\
    \ (e.g., learning rate, number of trees).\n\n  Less interpretable compared to\
    \ single decision trees.\n\nIllustrative Figure:\n\n![](images/image-T4IDOK9Q.png)\n\
    \n## 3.8  K-Nearest Neighbors for Classification\n\nMain Concept: K-Nearest Neighbors\
    \ (KNN) is a non-parametric, instance-based learning algorithm used for classification\
    \ (and regression). It classifies a data point based on how its neighbors are\
    \ classified, where \"neighbors\" are defined as the KKK closest training examples\
    \ in the feature space.\n\nMain Purpose: To classify data points based on the\
    \ majority class among the KKK nearest neighbors.\n\nWhen to Use It:\n\n❑  When\
    \ you have a small to medium-sized dataset.\n\n❑  Effective for data where similar\
    \ instances have similar outputs.\n\n❑  When you need a simple and interpretable\
    \ model.\n\nReal-World Examples:\n\n❑  Recommendation Systems: Suggesting products\
    \ based on the similarity of users' preferences.\n\n❑  Medical Diagnosis: Predicting\
    \ the presence of a disease based on patient symptoms and medical history.\n\n\
    Math Background:\n\nDistance Metric: Compute the distance between the input instance\
    \ and all training instances using a distance metric (e.g., Euclidean, Manhattan).\n\
    \n![](images/image-QWG7MNCP.png)\n\nTypes of KNN:\n\n❑  Classification KNN: Predicts\
    \ the class label of the input instance.\n\n❑  Regression KNN: Predicts the continuous\
    \ value for the input instance.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Simple to\
    \ understand and implement.\n\n⇨  Non-parametric and makes no assumptions about\
    \ the underlying data distribution.\n\n⇨  Naturally adapts to changes in data\
    \ distribution.\n\n☹  Cons:\n\n  Computationally expensive during prediction,\
    \ especially with large datasets.\n\n  Sensitive to the choice of KKK and the\
    \ distance metric.\n\n  Poor performance with high-dimensional data (curse of\
    \ dimensionality).\n\nIllustrative Figure:\n\n![](images/image-1K64BPT2.png)\n\
    \n## 3.9  Multiclass Naive Bayes\n\nMain Concept: Multiclass Naive Bayes extends\
    \ the Naive Bayes algorithm to handle multiclass classification problems, where\
    \ there are more than two possible classes.\n\nMain Purpose: To classify data\
    \ into one of several classes based on the likelihood of different features.\n\
    \nWhen to Use It:\n\n❑  For text classification in multiple categories.\n\n❑ \
    \ When features are independent.\n\nReal-World Examples:\n\n❑  Document Classification:\
    \ Categorizing documents into different topics.\n\n❑  Email Filtering: Classifying\
    \ emails into different folders like work, personal, and promotions.\n\nMath Background:\n\
    \n![](images/image-DEFL5D55.png)  \n\n![](images/image-TD6BKZEE.png)  \n\n![](images/image-2VZMP1TR.png)\n\
    \nPros and Cons:\n\n☺  Pros:\n\n⇨  Simple and fast.\n\n⇨  Works well with high-dimensional\
    \ data.\n\n☹  Cons:\n\n  Assumes feature independence.\n\n  Less accurate if\
    \ features are correlated.\n\nIllustrative Figure:\n\n![](images/image-ZY2XYKBD.png)\n\
    \n## 4.  Clustering algorithms\n\nClustering algorithms group similar data points\
    \ into clusters without predefined labels. Techniques like k-means, hierarchical\
    \ clustering, and DBSCAN are employed to identify inherent structures in data.\
    \ Clustering is useful in market segmentation, image compression, and anomaly\
    \ detection.\n\n## 4.1  K-Means\n\nMain Concept: K-Means is an unsupervised machine\
    \ learning algorithm used for clustering data into K distinct groups based on\
    \ feature similarity. The algorithm partitions the data into K clusters by minimizing\
    \ the sum of squared distances between data points and the centroid of their assigned\
    \ cluster.\n\nMain Purpose: The primary goal of K-Means clustering is to organize\
    \ data into homogeneous groups where the similarity within each group is maximized,\
    \ and the similarity between different groups is minimized.\n\nWhen to Use It:\n\
    \n❑  When you need to segment a large dataset into meaningful clusters.\n\n❑ \
    \ For exploratory data analysis to understand the inherent structure of the data.\n\
    \n❑  When working with relatively simple and small to medium-sized datasets.\n\
    \nReal-World Examples:\n\n❑  Customer Segmentation: Grouping customers based on\
    \ purchasing behavior for targeted marketing.\n\n❑  Image Compression: Reducing\
    \ the number of colors in an image by clustering pixel values.\n\nMath Background:\n\
    \n![](images/image-HTGXJ7WT.png)  \n\n![](images/image-Z7MLG9QL.png)\n\nPros and\
    \ Cons:\n\n☺  Pros:\n\n⇨  Simple and easy to implement.\n\n⇨  Efficient for small\
    \ to medium-sized datasets.\n\n⇨  Scales to large datasets if optimized properly.\n\
    \n☹  Cons:\n\n  Requires specifying the number of clusters (K) in advance.\n\n\
      Sensitive to initial centroid placement.\n\n  Assume clusters are spherical\
    \ and equally sized, which may not be true for real-world data.\n\nIllustrative\
    \ Figure:\n\n![](images/image-GWDD5JWV.png)\n\n## 4.2  Hierarchical Clustering"
  fmt: "\n# Main Purpose: To classify data into different categories by learning complex\
    \ patterns and relationships in the data through multiple layers of neurons.\n\
    \n## When to Use It:\n\n❑  When you have large datasets and complex patterns.\n\
    \n❑  Effective for both structured and unstructured data.\n\n❑  When feature extraction\
    \ is difficult and requires learning complex features.\n\n## Real-World Examples:\n\
    \n❑  Image Recognition: Classifying images, such as identifying objects or people\
    \ in photos.\n\n❑  Natural Language Processing: Sentiment analysis, text classification,\
    \ and language translation.\n\n## Math Background:\n\n❑  Structure: Consists of\
    \ an input layer, one or more hidden layers, and an output layer.\n\n❑  Activation\
    \ Functions: Common activation functions include ReLU (Rectified Linear\n\n![](images/image-94DU7A4K.png)\n\
    \n## Types of Neural Networks:\n\n❑  Feedforward Neural Networks (FNN): The simplest\
    \ type where connections do not form cycles.\n\n❑  Convolutional Neural Networks\
    \ (CNN): Specialized for processing grid-like topology data such as images.\n\n\
    ❑  Recurrent Neural Networks (RNN): Suitable for sequential data, such as time\
    \ series or natural language.\n\n## Pros and Cons:\n\n☺  Pros:\n\n⇨  Can model\
    \ complex and non-linear relationships.\n\n⇨  Capable of learning from raw data\
    \ without needing manual feature extraction.\n\n⇨  Scalable to large datasets.\n\
    \n☹  Cons:\n\n  Requires a large amount of data and computational resources.\n\
    \n  Often seen as a \"black box\" due to lack of interpretability.\n\n  Prone\
    \ to overfitting if not properly regularized.\n\n## Illustrative Figure:\n\n![](images/image-1H6B4QLW.png)\n\
    \n## 3.7  Gradient Boosting Machine (GBM) for Classification\n\nMain Concept:\
    \ Gradient Boosting Machine (GBM) is an ensemble learning technique that builds\
    \ models sequentially, each one correcting the errors of its predecessor. It combines\
    \ the predictions of multiple weak learners (typically decision trees) to produce\
    \ a strong learner.\n\nMain Purpose: To improve classification accuracy by reducing\
    \ the biases and variances in the model through iterative refinement.\n\n## When\
    \ to Use It:\n\n❑  When you need high predictive accuracy.\n\n❑  Effective with\
    \ structured/tabular data.\n\n❑  Suitable when dealing with complex patterns and\
    \ interactions in data.\n\n## Real-World Examples:\n\n❑  Credit Scoring: Predicting\
    \ the likelihood of a borrower defaulting on a loan.\n\n❑  Customer Churn Prediction:\
    \ Identifying customers likely to cancel a subscription.\n\n## Math Background:\n\
    \n❑  Initialization: Start with an initial model, typically a simple model like\
    \ predicting the mean of the target variable.\n\n❑  Sequential Training: At each\
    \ step, fit a new model to the residual errors of the previous model.\n\n❑  Update:\
    \ Combine the new model with the previous models to update the prediction.\n\n\
    ![](images/image-1EVUCT4E.png)\n\n## Types of Gradient Boosting:\n\n❑  Gradient\
    \ Boosting for Classification: Typically uses decision trees as the base learners.\n\
    \n❑  Gradient Boosting for Regression: Adapts the algorithm for continuous target\
    \ variables.\n\n## Pros and Cons:\n\n☺  Pros:\n\n⇨  High predictive accuracy.\n\
    \n⇨  Robust to overfitting with proper regularization.\n\n⇨  Capable of handling\
    \ various types of data.\n\n☹  Cons:\n\n  Computationally intensive and slower\
    \ to train compared to other models.\n\n  Requires careful tuning of parameters\
    \ (e.g., learning rate, number of trees).\n\n  Less interpretable compared to\
    \ single decision trees.\n\n## Illustrative Figure:\n\n![](images/image-T4IDOK9Q.png)\n\
    \n## 3.8  K-Nearest Neighbors for Classification\n\nMain Concept: K-Nearest Neighbors\
    \ (KNN) is a non-parametric, instance-based learning algorithm used for classification\
    \ (and regression). It classifies a data point based on how its neighbors are\
    \ classified, where \"neighbors\" are defined as the KKK closest training examples\
    \ in the feature space.\n\nMain Purpose: To classify data points based on the\
    \ majority class among the KKK nearest neighbors.\n\n## When to Use It:\n\n❑ \
    \ When you have a small to medium-sized dataset.\n\n❑  Effective for data where\
    \ similar instances have similar outputs.\n\n❑  When you need a simple and interpretable\
    \ model.\n\n## Real-World Examples:\n\n❑  Recommendation Systems: Suggesting products\
    \ based on the similarity of users' preferences.\n\n❑  Medical Diagnosis: Predicting\
    \ the presence of a disease based on patient symptoms and medical history.\n\n\
    ## Math Background:\n\nDistance Metric: Compute the distance between the input\
    \ instance and all training instances using a distance metric (e.g., Euclidean,\
    \ Manhattan).\n\n![](images/image-QWG7MNCP.png)\n\n## Types of KNN:\n\n❑  Classification\
    \ KNN: Predicts the class label of the input instance.\n\n❑  Regression KNN: Predicts\
    \ the continuous value for the input instance.\n\n## Pros and Cons:\n\n☺  Pros:\n\
    \n⇨  Simple to understand and implement.\n\n⇨  Non-parametric and makes no assumptions\
    \ about the underlying data distribution.\n\n⇨  Naturally adapts to changes in\
    \ data distribution.\n\n☹  Cons:\n\n  Computationally expensive during prediction,\
    \ especially with large datasets.\n\n  Sensitive to the choice of KKK and the\
    \ distance metric.\n\n  Poor performance with high-dimensional data (curse of\
    \ dimensionality).\n\n## Illustrative Figure:\n\n![](images/image-1K64BPT2.png)\n\
    \n## 3.9  Multiclass Naive Bayes\n\nMain Concept: Multiclass Naive Bayes extends\
    \ the Naive Bayes algorithm to handle multiclass classification problems, where\
    \ there are more than two possible classes.\n\nMain Purpose: To classify data\
    \ into one of several classes based on the likelihood of different features.\n\
    \n## When to Use It:\n\n❑  For text classification in multiple categories.\n\n\
    ❑  When features are independent.\n\n## Real-World Examples:\n\n❑  Document Classification:\
    \ Categorizing documents into different topics.\n\n❑  Email Filtering: Classifying\
    \ emails into different folders like work, personal, and promotions.\n\n## Math\
    \ Background:\n\n![](images/image-DEFL5D55.png)  \n\n![](images/image-TD6BKZEE.png)\
    \  \n\n![](images/image-2VZMP1TR.png)\n\n## Pros and Cons:\n\n☺  Pros:\n\n⇨  Simple\
    \ and fast.\n\n⇨  Works well with high-dimensional data.\n\n☹  Cons:\n\n  Assumes\
    \ feature independence.\n\n  Less accurate if features are correlated.\n\n##\
    \ Illustrative Figure:\n\n![](images/image-ZY2XYKBD.png)\n\n## 4.  Clustering\
    \ algorithms\n\nClustering algorithms group similar data points into clusters\
    \ without predefined labels. Techniques like k-means, hierarchical clustering,\
    \ and DBSCAN are employed to identify inherent structures in data. Clustering\
    \ is useful in market segmentation, image compression, and anomaly detection.\n\
    \n## 4.1  K-Means\n\nMain Concept: K-Means is an unsupervised machine learning\
    \ algorithm used for clustering data into K distinct groups based on feature similarity.\
    \ The algorithm partitions the data into K clusters by minimizing the sum of squared\
    \ distances between data points and the centroid of their assigned cluster.\n\n\
    Main Purpose: The primary goal of K-Means clustering is to organize data into\
    \ homogeneous groups where the similarity within each group is maximized, and\
    \ the similarity between different groups is minimized.\n\n## When to Use It:\n\
    \n❑  When you need to segment a large dataset into meaningful clusters.\n\n❑ \
    \ For exploratory data analysis to understand the inherent structure of the data.\n\
    \n❑  When working with relatively simple and small to medium-sized datasets.\n\
    \n## Real-World Examples:\n\n❑  Customer Segmentation: Grouping customers based\
    \ on purchasing behavior for targeted marketing.\n\n❑  Image Compression: Reducing\
    \ the number of colors in an image by clustering pixel values.\n\n## Math Background:\n\
    \n![](images/image-HTGXJ7WT.png)  \n\n![](images/image-Z7MLG9QL.png)\n\n## Pros\
    \ and Cons:\n\n☺  Pros:\n\n⇨  Simple and easy to implement.\n\n⇨  Efficient for\
    \ small to medium-sized datasets.\n\n⇨  Scales to large datasets if optimized\
    \ properly.\n\n☹  Cons:\n\n  Requires specifying the number of clusters (K) in\
    \ advance.\n\n  Sensitive to initial centroid placement.\n\n  Assume clusters\
    \ are spherical and equally sized, which may not be true for real-world data.\n\
    \n## Illustrative Figure:\n\n![](images/image-GWDD5JWV.png)\n\n## 4.2  Hierarchical\
    \ Clustering\n"
  trans: "\n# 主要目的：通过学习数据中的复杂模式和关系，使用多层神经元将数据分类为不同类别。\n\n## 何时使用：\n\n❑  当你拥有大型数据集和复杂模式时。\n\
    \n❑  同时适用于结构化和非结构化数据。\n\n❑  当特征提取困难且需要学习复杂特征时。\n\n## 实际应用示例：\n\n❑  图像识别：对图像进行分类，例如在照片中识别物体或人物。\n\
    \n❑  自然语言处理：情感分析、文本分类和语言翻译。\n\n## 数学背景：\n\n❑  结构：由输入层、一个或多个隐藏层和输出层组成。\n\n❑  激活函数：常见的激活函数包括\
    \ ReLU（整流线性单位）。\n\n![](img/image-94DU7A4K.png)\n\n## 神经网络类型：\n\n❑  前馈神经网络（FNN）：最简单的类型，连接不形成循环。\n\
    \n❑  卷积神经网络（CNN）：专为处理网格状拓扑数据（如图像）而设计。\n\n❑  循环神经网络（RNN）：适用于序列数据，如时间序列或自然语言。\n\n\
    ## 优缺点：\n\n☺  优点：\n\n⇨  可以建模复杂且非线性的关系。\n\n⇨  能从原始数据中学习，无需手动提取特征。\n\n⇨  可扩展到大规模数据集。\n\
    \n☹  缺点：\n\n  需要大量数据和计算资源。\n\n  由于缺乏可解释性，常被视为“黑盒”。\n\n  若未正确正则化，易发生过拟合。\n\n\
    ## 示例图：\n\n![](img/image-1H6B4QLW.png)\n\n## 3.7  梯度提升机器（GBM）用于分类\n\n主要概念：梯度提升机器（GBM）是一种集成学习技术，它按顺序构建模型，每个模型纠正前一个模型的错误。它结合多个弱学习者（通常是决策树）的预测，生成一个强学习者。\n\
    \n主要目的：通过迭代优化，降低模型的偏差和方差，从而提高分类准确性。\n\n## 何时使用：\n\n❑  当你需要高预测准确度时。\n\n❑  适用于结构化/表格数据。\n\
    \n❑  适合处理数据中的复杂模式和交互作用。\n\n## 实际应用示例：\n\n❑  信用评分：预测借款人是否可能违约。\n\n❑  客户流失预测：识别可能取消订阅的客户。\n\
    \n## 数学背景：\n\n❑  初始化：从一个简单的模型开始，通常是预测目标变量的均值。\n\n❑  顺序训练：在每一步，拟合一个新模型到前一个模型的残差上。\n\
    \n❑  更新：将新模型与之前的模型结合，更新预测。\n\n![](img/image-1EVUCT4E.png)\n\n## 梯度提升的类型：\n\n❑ \
    \ 分类梯度提升：通常使用决策树作为基学习者。\n\n❑  回归梯度提升：将算法适应连续目标变量。\n\n## 优缺点：\n\n☺  优点：\n\n⇨  预测准确性高。\n\
    \n⇨  通过适当正则化，对过拟合具有鲁棒性。\n\n⇨  能处理各种类型的数据。\n\n☹  缺点：\n\n  计算开销大，训练速度比其他模型慢。\n\n\
      需要仔细调整参数（如学习率、树的数量）。\n\n  相比单个决策树，可解释性较低。\n\n## 示例图：\n\n![](img/image-T4IDOK9Q.png)\n\
    \n## 3.8  K-最近邻（KNN）用于分类\n\n主要概念：K-最近邻（KNN）是一种非参数、实例基学习算法，用于分类（也用于回归）。它根据训练实例中最近的\
    \ KKK 个邻居的分类情况来判断新数据点的类别，其中“邻居”指在特征空间中距离最近的 KKK 个训练样本。\n\n主要目的：根据 KKK 个最近邻中多数类别来分类数据点。\n\
    \n## 何时使用：\n\n❑  当你拥有小到中等规模的数据集时。\n\n❑  适用于相似实例具有相似输出的数据。\n\n❑  当你需要一个简单且可解释的模型时。\n\
    \n## 实际应用示例：\n\n❑  推荐系统：根据用户偏好相似性推荐产品。\n\n❑  医疗诊断：根据患者症状和病史预测疾病的存在。\n\n## 数学背景：\n\
    \n距离度量：使用距离度量（如欧氏距离、曼哈顿距离）计算输入实例与所有训练实例之间的距离。\n\n![](img/image-QWG7MNCP.png)\n\
    \n## KNN 的类型：\n\n❑  分类 KNN：预测输入实例的类别标签。\n\n❑  回归 KNN：预测输入实例的连续值。\n\n## 优缺点：\n\n\
    ☺  优点：\n\n⇨  易于理解和实现。\n\n⇨  非参数，对数据分布不作任何假设。\n\n⇨  自然适应数据分布的变化。\n\n☹  缺点：\n\n\
      在预测时计算开销大，尤其是大数据集时。\n\n  对 KKK 和距离度量的选择敏感。\n\n  高维数据表现较差（维度诅咒）。\n\n## 示例图：\n\
    \n![](img/image-1K64BPT2.png)\n\n## 3.9  多类 Naive Bayes\n\n主要概念：多类 Naive Bayes\
    \ 将 Naive Bayes 算法扩展到处理多类分类问题，即存在多于两个可能类别的情况。\n\n主要目的：根据不同特征的可能性将数据分类到多个类别之一。\n\
    \n## 何时使用：\n\n❑  用于多类别的文本分类。\n\n❑  当特征之间相互独立时。\n\n## 实际应用示例：\n\n❑  文档分类：将文档按主题分类到不同类别中。\n\
    \n❑  邮件过滤：将邮件分类到工作、个人和促销等不同文件夹。\n\n## 数学背景：\n\n![](img/image-DEFL5D55.png)  \n\
    \n![](img/image-TD6BKZEE.png)  \n\n![](img/image-2VZMP1TR.png)\n\n## 优缺点：\n\n\
    ☺  优点：\n\n⇨  简单且快速。\n\n⇨  对高维数据表现良好。\n\n☹  缺点：\n\n  假设特征相互独立。\n\n  如果特征相关，准确率会下降。\n\
    \n## 示例图：\n\n![](img/image-ZY2XYKBD.png)\n\n## 4.  聚类算法\n\n聚类算法将相似的数据点分组为簇，无需预定义标签。k-means、层次聚类和\
    \ DBSCAN 等技术用于识别数据中的内在结构。聚类在市场细分、图像压缩和异常检测中有用。\n\n## 4.1  K-Means\n\n主要概念：K-Means\
    \ 是一种无监督机器学习算法，用于将数据分组为 K 个基于特征相似性的簇。算法通过最小化数据点与其所在簇中心的平方距离之和来实现聚类。\n\n主要目的：组织数据形成内部相似性最大、不同簇间相似性最小的均匀组。\n\
    \n## 何时使用：\n\n❑  当你需要将大数据集分割为有意义的簇时。\n\n❑  用于探索性数据分析，以了解数据的内在结构。\n\n❑  适用于相对简单且小到中等规模的数据集。\n\
    \n## 实际应用示例：\n\n❑  客户细分：根据购买行为将客户分组，以便进行精准营销。\n\n❑  图像压缩：通过聚类像素值来减少图像中的颜色数量。\n\
    \n## 数学背景：\n\n![](img/image-HTGXJ7WT.png)  \n\n![](img/image-Z7MLG9QL.png)\n\n\
    ## 优缺点：\n\n☺  优点：\n\n⇨  实现简单，易于实现。\n\n⇨  对小到中等规模数据集高效。\n\n⇨  若优化得当，可扩展到大规模数据集。\n\
    \n☹  缺点：\n\n  需要事先指定簇的数量（K）。\n\n  对初始中心的位置敏感。\n\n  假设簇是球形且大小相等，这在实际数据中可能不成立。\n\
    \n## 示例图：\n\n![](img/image-GWDD5JWV.png)\n\n"
