- raw: "❑  Classification Loss: Cross-Entropy Loss for individual models, averaging\
    \ the probabilities for the final prediction.\n\nTypes of Averaging:\n\n❑  Simple\
    \ Averaging: Directly averages the predictions from all base models.\n\n❑  Weighted\
    \ Averaging: Applies different weights to the predictions from each base model.\n\
    \nPros and Cons:\n\n☺  Pros:\n\n⇨  Simple and easy to implement.\n\n⇨  Reduces\
    \ variance and can improve model robustness.\n\n⇨  Enhances predictive performance\
    \ by combining diverse models.\n\n☹  Cons:\n\n  May not significantly improve\
    \ performance if base models are similar.\n\n  Choosing appropriate weights for\
    \ weighted averaging can be challenging.\n\n  It is less interpretable compared\
    \ to single models.\n\nIllustrative Figure:\n\n![](images/image-KZVU07BQ.jpg)\n\
    \n## 7.  Dimensionality reduction methods\n\nDimensionality reduction techniques\
    \ reduce the number of input features to simplify models and avoid overfitting.\
    \ Principal Component Analysis (PCA), t-SNE, and autoencoders are common methods.\
    \ These techniques help in visualizing high-dimensional data and improving computational\
    \ efficiency.\n\n## 7.1  Principal Component Analysis (PCA)\n\nMain Concept: Principal\
    \ Component Analysis (PCA) is a dimensionality reduction technique that transforms\
    \ a dataset into a set of linearly uncorrelated variables called principal components.\
    \ These components capture the maximum variance in the data, allowing for a more\
    \ compact representation.\n\nMain Purpose: To reduce the dimensionality of data\
    \ while retaining as much variance as possible. This helps in visualizing high-dimensional\
    \ data, reducing noise, and improving the performance of machine learning algorithms.\n\
    \nWhen to Use It:\n\n❑  When you need to reduce the number of features in a dataset.\n\
    \n❑  Effective for noise reduction, data compression, and visualization of high-dimensional\
    \ data.\n\n❑  Suitable for preprocessing data before applying machine learning\
    \ algorithms.\n\nReal-World Examples:\n\n❑  Finance: Risk management and portfolio\
    \ optimization.\n\n❑  Healthcare: Image processing and genomic data analysis.\n\
    \n❑  Marketing: Customer segmentation and behavioral analysis.\n\nMath Background:\n\
    \n![](images/image-EEZE2AMX.png)  \n\n![](images/image-1MU87DVL.png)  \n\n![](images/image-QCBL7UTG.png)\n\
    \nSteps in PCA:\n\n❑  Standardize the data.\n\n❑  Compute the covariance matrix.\n\
    \n❑  Perform eigen decomposition to obtain eigenvalues and eigenvectors.\n\n❑ \
    \ Sort eigenvectors by descending eigenvalues.\n\n❑  Select the top k eigenvectors\
    \ to form the principal components.\n\n❑  Transform the data using the selected\
    \ eigenvectors.\n\nPros and Cons:\n\n☺  Pros:\n\n⇨  Reduces dimensionality and\
    \ helps in data visualization.\n\n⇨  Removes noise and improves computational\
    \ efficiency.\n\n⇨  Captures the most important features of the data.\n\n☹  Cons:\n\
    \n  Assumes linearity in the data.\n\n  May lose interpretability of the original\
    \ features.\n\n  Sensitive to the scaling of the data.\n\nIllustrative Figure:\n\
    \n![](images/image-SDPOFSB6.png)\n\n![](images/image-APH34ZAU.png)\n\n## 7.2 \
    \ Linear Discriminant Analysis (LDA)\n\nMain Concept:\n\nLinear Discriminant Analysis\
    \ (LDA) seeks linear combinations of features that best separate classes.\n\n\
    Main Purpose:\n\nMaximize class separation.\n\nWhen to Use It:\n\n❑  Classification\
    \ tasks with labeled data.\n\n❑  Reducing feature space while maintaining class\
    \ separability.\n\nExample Use Cases:\n\n❑  Face Recognition: Distinguishing individuals\
    \ in images.\n\n❑  Medical Diagnosis: Classifying patients based on test results.\n\
    \nMath Background:\n\n❑  Compute within-class and between-class scatter matrices.\n\
    \n❑  Solve generalized eigenvalue problems for linear discriminants.\n\n❑  Project\
    \ data into the new subspace.\n\n❑  Objective: Maximize between-class variance\
    \ to within-class variance ratio.\n\nLoss Function:\n\nCommonly Used LDA maximizes\
    \ class separability metric, not a traditional loss function.\n\nPros and Cons:\n\
    \n☺  Pros:\n\n⇨  Enhances class separability.\n\n⇨  Reduces dimensionality for\
    \ classification.\n\n⇨  Computationally efficient.\n\n☹  Cons:\n\n  Assumes normally\
    \ distributed classes with identical covariances.\n\n  May not perform well if\
    \ assumptions are violated.\n\nIllustrative Figure:\n\n![](images/image-CYL4356Z.png)\n\
    \n## 7.3  t-Distributed Stochastic Neighbor Embedding (t-SNE)\n\nMain Concept:\
    \ t-Distributed Stochastic Neighbor Embedding (t-SNE) is a nonlinear dimensionality\
    \ reduction technique particularly well-suited for embedding high-dimensional\
    \ data into a low-dimensional space (typically 2D or 3D) for visualization. It\
    \ preserves the local structure of the data by converting high-dimensional Euclidean\
    \ distances into conditional probabilities that represent similarities.\n\nMain\
    \ Purpose: To visualize high-dimensional data in a way that captures the local\
    \ and global structure of the data, making it easier to identify patterns, clusters,\
    \ and anomalies.\n\nWhen to Use It:\n\n❑  When you need to visualize high-dimensional\
    \ data in a low-dimensional space.\n\n❑  Effective for exploring and understanding\
    \ the structure of data, such as clustering.\n\n❑  Suitable for preprocessing\
    \ before other machine learning tasks where understanding data structure is crucial.\n\
    \nReal-World Examples:\n\n❑  Finance: Visualizing stock market trends and identifying\
    \ clusters of similar financial instruments.\n\n❑  Healthcare: Analyzing gene\
    \ expression data and visualizing patient similarities.\n\n❑  Marketing: Understanding\
    \ customer segmentation and behavior patterns.\n\nMath Background:\n\n![](images/image-SOLFPICO.png)\
    \  \n\n![](images/image-W5SBKQPJ.png)  \n\n![](images/image-0A6LF1RU.png)\n\n\
    Steps in t-SNE:\n\n❑  Compute pairwise similarities in high-dimensional space.\n\
    \n❑  Initialize points in low-dimensional space.\n\n❑  Compute pairwise similarities\
    \ in low-dimensional space.\n\n❑  Minimize the KL divergence between the two distributions\
    \ using gradient descent.\n\n❑  Adjust points in low-dimensional space iteratively\
    \ to better reflect high-dimensional similarities.\n\nPros and Cons:\n\n☺  Pros:\n\
    \n⇨  Excellent for visualizing high-dimensional data.\n\n⇨  Captures complex structures\
    \ in data, such as clusters and manifolds.\n\n⇨  Preserves the local structure\
    \ of the data points.\n\n☹  Cons:\n\n  Computationally intensive and may require\
    \ significant time for large datasets.\n\n  Difficult to interpret distances\
    \ in low-dimensional space.\n\n  May produce different results with different\
    \ initializations or random seeds.\n\nIllustrative Figure:\n\n![](images/image-LPY4M6TN.png)\n\
    \n## 7.4  Uniform Manifold Approximation and Projection (UMAP)\n\nMain Concept:\
    \ Uniform Manifold Approximation and Projection (UMAP) is a nonlinear dimensionality\
    \ reduction technique that is used for visualizing high-dimensional data in a\
    \ low-dimensional space. It emphasizes preserving both the local and global structure\
    \ of the data, making it effective for various data exploration and analysis tasks.\n\
    \nMain Purpose: To reduce the dimensionality of data while maintaining meaningful\
    \ relationships between data points in both local and global contexts. UMAP is\
    \ particularly useful for high-dimensional data visualization and clustering.\n\
    \nWhen to Use It:\n\n❑  When you need to visualize high-dimensional data in a\
    \ lower-dimensional space.\n\n❑  Effective for discovering and visualizing clusters\
    \ and data patterns.\n\n❑  Suitable for preprocessing data before applying machine\
    \ learning algorithms, especially clustering and classification tasks.\n\nReal-World\
    \ Examples:\n\n❑  Genomics: Visualizing gene expression and single-cell RNA sequencing\
    \ data.\n\n❑  Image Processing: Analyzing and clustering images based on high-dimensional\
    \ features.\n\n❑  Social Networks: Exploring and understanding connections between\
    \ individuals in social networks.\n\nMath Background:\n\n❑  Topological Representation:\
    \ Constructs a topological representation of the data manifold.\n\n❑  Fuzzy Topological\
    \ Structure: Captures both local and global relationships between data points.\n\
    \n❑  Local Connectivity: Measures the distance between neighbors in the high-dimensional\
    \ space."
