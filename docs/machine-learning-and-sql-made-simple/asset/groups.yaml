    # Chapter 2: Creating and Manipulating Databases


    In Chapter 1, we learned the basics of SQL and how to retrieve data from a database.
    In this chapter, we will delve into the process of creating and manipulating databases.
    We will explore how to create a database, define tables, specify data types, insert
    data into tables, and modify existing data. By the end of this chapter, you will
    have a solid foundation in managing the structure and content of databases using
    SQL.


    # Section 1: Creating a Database


    To begin working with SQL, you need a database to store your data. Creating a
    database involves defining its structure and setting up the necessary tables.
    Follow these steps to create a database:


    +   1. Start by connecting to your database management system (DBMS) using the
    appropriate client or command-line interface.

    2. Use the CREATE DATABASE statement to create a new database. Provide a name
    for the database, and any additional options or configurations, if required.


    Example:'
  - '[PAGE 86]


    ```

    ```sql

    CREATE DATABASE bookstore;

    ```

    ```


    In this example, we create a database named "bookstore."


    # Section 2: Creating Tables and Specifying Data Types


    Once you have a database, you can create tables to organize and store your data.
    Tables consist of columns and rows, where columns define the attributes or properties
    of the data, and rows represent individual records. Here''s how you can create
    a table:


    +   1. Identify the attributes or properties that each record in your table should
    have. For example, if you are creating a "customers" table, you might include
    columns such as "customer_id," "first_name," "last_name," and "email."

    2. Use the CREATE TABLE statement to create the table. Specify the table name
    and define the columns along with their respective data types.


    Example:'
  - "[PAGE 87]\n\n```\n```sql\nCREATE TABLE customers (\n  customer_id INT,\n  first_name\
    \ VARCHAR(50),\n  last_name VARCHAR(50),\n  email VARCHAR(100)\n);\n```\n```\n\
    \nIn this example, we create a \"customers\" table with four columns: \"customer_id\"\
    \ of type INT (integer), \"first_name\" and \"last_name\" of type VARCHAR (variable-length\
    \ character), and \"email\" of type VARCHAR.\n\n# Section 3: Modifying Tables\n\
    \nOver time, you may need to modify the structure of your tables to accommodate\
    \ changing requirements. SQL provides various commands to alter tables and modify\
    \ their columns. Here are some common operations:\n\n+   1. Adding Columns: Use\
    \ the ALTER TABLE statement with the ADD COLUMN clause to add new columns to an\
    \ existing table."
  - '[PAGE 88]


    Example:


    ```

    ```sql

    ALTER TABLE customers

    ADD COLUMN phone_number VARCHAR(20);

    ```

    ```


    In this example, we add a new column called "phone_number" of type VARCHAR to
    the "customers" table.


    2. Modifying Columns: Use the ALTER TABLE statement with the ALTER COLUMN clause
    to modify the data type or other properties of an existing column.


    Example:


    ```

    ```sql

    ALTER TABLE customers

    ALTER COLUMN email SET NOT NULL;

    ```

    ```'
  - '[PAGE 89]


    In this example, we modify the "email" column of the "customers" table to disallow
    NULL values.


    # 3. Dropping Columns: Use the ALTER TABLE statement with the DROP COLUMN clause
    to remove columns from an existing table.


    Example:


    ```

    ```sql

    ALTER TABLE customers


    DROP COLUMN phone_number;

    ```

    ```


    In this example, we remove the "phone_number" column from the "customers" table.


    # Section 4: Inserting Data into Tables


    Now that we have created our tables, we can start populating them with data. The
    INSERT statement allows us to add new records into a table. Here''s how you can
    insert data:


    +   1. Identify the table into which you want to insert data.'
  - '[PAGE 90]


    2. Specify the columns for which you have values to insert.


    3. Provide the corresponding values for the specified columns.


    Example:


    ```

    ```sql

    INSERT INTO customers (customer_id, first_name, last_name, email)

    VALUES (1,''John'',''Doe'',''john.doe@example.com'');

    ```

    ```


    In this example, we insert a new record into the "customers" table with values
    for the columns "customer_id," "first_name," "last_name," and "email."


    You can insert multiple records at once by extending the VALUES clause with additional
    sets of values.


    # Section 5: Updating and Deleting Data


    In addition to inserting data, SQL allows you to update and delete existing data
    within your tables.'
  - '[PAGE 91]


    1. Updating Data: The UPDATE statement allows you to modify existing data in one
    or more columns of a table. Use the SET clause to specify the new values for the
    columns and the WHERE clause to filter the rows to be updated.


    Example:


    ```

    ```sql

    UPDATE customers


    SET email = ''johndoe@example.com''


    WHERE customer_id = 1;

    ```

    ```


    In this example, we update the "email" column of the "customers" table for the
    record with a "customer_id" of 1.


    2. Deleting Data: The DELETE statement enables you to remove one or more records
    from a table. Use the WHERE clause to specify the conditions that the rows must
    meet to be deleted.


    Example:


    ```

    ```sql

    DELETE FROM customers

    ```'
