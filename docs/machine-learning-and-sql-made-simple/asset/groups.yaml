    +   - Precision and Recall: Precision measures the proportion of true positives
    (correctly classified positives) out of the predicted positives. Recall measures
    the proportion of true positives out of the actual positives. Precision and recall
    are especially useful when dealing with imbalanced datasets.

    - F1 Score: The F1 score combines precision and recall into a single metric. It
    provides a balanced evaluation of the model''s performance by taking into account
    both false positives and false negatives.

    - Area Under the Receiver Operating Characteristic Curve (AUC-ROC): AUC-ROC quantifies
    the model''s ability to distinguish between classes. It represents the probability
    that the model ranks a randomly chosen positive instance higher than a randomly
    chosen negative instance.


