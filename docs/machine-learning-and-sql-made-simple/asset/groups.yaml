    ### 4. Model Training:


    Once the data is prepared, we can train a machine learning model using the labeled
    data in the case of supervised learning. The model learns the underlying patterns
    and relationships in the data and adjusts its internal parameters to make accurate
    predictions or decisions.


    ### 5. Model Evaluation:


    After training the model, it is crucial to evaluate its performance to assess
