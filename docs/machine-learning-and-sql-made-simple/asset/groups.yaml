    various parts of a SQL statement, such as the SELECT, FROM, WHERE, or HAVING clauses.
    The subquery is executed first, and its result is then used in the outer query.
    Subqueries can return a single value, a single row, or multiple rows.


    Example:


    ```sql

    SELECT employee_name, department

    FROM employees

    WHERE department IN (SELECT department FROM departments WHERE location = ''New
    York'');

    ```


    In this example, the subquery `(SELECT department FROM departments WHERE location
    = ''New York'')` retrieves the departments located in New York. The outer query
    then selects the employee name and department for employees working in those departments.


    ### Section 2: Types of Subqueries


    There are different types of subqueries based on their placement and the results
