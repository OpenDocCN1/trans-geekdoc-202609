    # Section 6: Combining Multiple Joins


    You can join more than two tables by extending the join clauses in your query.
    This allows you to retrieve data from multiple related tables in a single result
    set. Here''s an example:


    ```

    ```sql

    SELECT orders.order_id, customers.customer_name, products.product_name

    FROM orders

    INNER JOIN customers

    ON orders.customer_id = customers.customer_id

    INNER JOIN order_items

