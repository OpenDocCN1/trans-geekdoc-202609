    Q-Learning is a fundamental algorithm in reinforcement learning for estimating
    action values and learning optimal policies in a model-free setting. Q-Learning
    uses a table called the Q-table, which stores the action values for each state-action
    pair. The Q-table is updated iteratively based on the agent''s interactions with
    the environment using the Bellman equation:


    Q(s, a) = Q(s, a) + α * (r + γ * max[Q(s'', a'')] - Q(s, a))


    where Q(s, a) represents the action value for state s and action a, α is the learning
    rate, r is the received reward, γ is the discount factor, s'' is the next state,
    and a'' is the next action.


    # Example:


    Suppose we have an agent learning to navigate a maze. The agent starts in a particular
    state and explores the maze by taking actions (e.g., moving up, down, left, or
    right). It receives rewards based on reaching the goal state or penalties for
    hitting obstacles. Through repeated interactions, the agent updates its Q-table
    and learns an optimal policy for navigating the maze to maximize cumulative rewards.


