    # 4. Model Evaluation:


    After training a machine learning model, it is crucial to evaluate its performance.
    Model evaluation helps us understand how well the model generalizes to new, unseen
    data and whether it has learned meaningful patterns.


    # a) Evaluation Metrics for Regression:


    For regression tasks, evaluation metrics quantify the difference between the predicted
    and actual values. Some common metrics include:


    +   - Mean Squared Error (MSE): MSE calculates the average of the squared differences
    between the predicted and actual values. It penalizes larger errors more than
    smaller errors.


    +   - Root Mean Squared Error (RMSE): RMSE is the square root of the MSE and provides
    the average difference between the predicted and actual values.


    # b) Evaluation Metrics for Classification:'
  - '[PAGE 20]


    For classification tasks, evaluation metrics focus on the accuracy of class predictions.
    Some commonly used metrics include:


    +   - Accuracy: Accuracy measures the percentage of correctly classified instances
    out of the total instances.

    - Precision and Recall: Precision measures the proportion of true positives (correctly
    classified positives) out of the predicted positives. Recall measures the proportion
    of true positives out of the actual positives.

    - F1 Score: The F1 score combines precision and recall into a single metric and
    provides a balanced evaluation of the model''s performance.


    Now, let''s consider a practical example to illustrate the foundations of machine
