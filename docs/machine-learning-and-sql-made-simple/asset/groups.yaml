    department for the Sales department. The outer query selects the employee name
    for employees who have the same department and salary as the subquery result.


    # 2.3 Table Subqueries:


    A table subquery returns multiple rows and is used in the FROM clause as a derived
    table. It can be treated as a temporary table within the main query.


    Example:


    ```

    ```sql

    SELECT t1.employee_name, t2.department

    FROM (SELECT employee_name, department FROM employees WHERE salary > 50000) AS
    t1

    JOIN (SELECT department, location FROM departments WHERE location = ''New York'')
    AS t2

    ON t1.department = t2.department;

    ```

    ```


    In this example, the subqueries `(SELECT employee_name, department FROM employees
    WHERE salary > 50000)` and `(SELECT department, location FROM departments WHERE
    location = ''New York'')` create derived tables t1 and t2,'
