  mdcn: "\n## 第三章：使用 SELECT 查询数据\n\n在上一章中，我们使用 SQL 探索了创建和操作数据库的基础知识。现在，在第三章中，我们将重点关注\
    \ SELECT 语句，它是查询数据库数据的核心。SELECT 语句允许您根据各种条件和标准从表中检索特定信息。到本章结束时，您将对如何有效地查询和过滤数据有扎实的理解。\n\
    \n### 第 1 节：检索所有列\n\nSELECT 语句的最简单形式用于从表中检索所有列。以下是基本语法：\n\n```sql\nSELECT * FROM\
    \ table_name;\n```\n\n该语句返回指定表的所有行和列。星号 (*) 充当通配符，表示所有列。\n\n示例：\n\n```sql\nSELECT\
    \ * FROM customers;\n```\n\n在此示例中，我们检索 \"customers\" 表的所有记录和列。\n\n### 第 2 节：检索特定列\n\
    \n通常，您可能不需要表中的所有列。SELECT 语句允许您指定要检索的确切列。以下是语法：\n\n```sql\nSELECT column1, column2,\
    \ ... FROM table_name;\n```\n\n示例：\n\n```sql\nSELECT first_name, last_name FROM\
    \ customers;\n```\n\n在此示例中，我们仅从 \"customers\" 表中检索 \"first_name\" 和 \"last_name\"\
    \ 列。\n\n### 第 3 节：使用 WHERE 应用过滤器\n\n要检索满足特定条件的记录，您可以结合 SELECT 语句使用 WHERE 子句。WHERE\
    \ 子句允许您指定过滤条件。以下是语法：\n\n```sql\nSELECT column1, column2, ...\nFROM table_name\n\
    WHERE condition;\n```\n\n示例：\n\n```sql\nSELECT * FROM customers\nWHERE city =\
    \ 'New York';\n```\n\n在此示例中，我们检索 \"customers\" 表中 \"city\" 列等于 'New York' 的所有记录。\n\
    \n### 第 4 节：使用 ORDER BY 排序数据\n\nORDER BY 子句允许您根据一个或多个列按升序（默认）或降序对检索到的数据进行排序。以下是语法：\n\
    \n```sql\nSELECT column1, column2, ...\nFROM table_name\nORDER BY column1 [ASC|DESC],\
    \ column2 [ASC|DESC], ...;\n```\n\n示例：\n\n```sql\nSELECT * FROM customers\nORDER\
    \ BY last_name ASC, first_name ASC;\n```\n\n在此示例中，我们检索 \"customers\" 表中的所有记录，并根据\
    \ \"last_name\" 列按升序对它们进行排序。对于具有相同 \"last_name\" 的记录，我们根据 \"first_name\" 列按升序对它们进行排序。\n\
    \n### 第 5 节：使用 LIMIT 限制结果\n\nLIMIT 子句允许您限制结果集中返回的行数。这在处理大型数据集或仅需要特定数量记录时非常有用。以下是语法：\n\
    \n```sql\nSELECT column1, column2, ...\nFROM table_name\nLIMIT count;\n```\n\n\
    示例：\n\n```sql\nSELECT * FROM customers\nLIMIT 10;\n```\n\n在此示例中，我们检索 \"customers\"\
    \ 表中的前 10 条记录。\n\n### 第 6 节：使用 AND 和 OR 组合条件\n\n您可以使用 AND 和 OR 等逻辑运算符在 WHERE 子句中组合多个条件。这允许进行更复杂的过滤条件。以下是一个示例：\n\
    \n```sql\nSELECT * FROM customers\nWHERE city = 'New York' AND age > 30;\n```\n\
    \n在此示例中，我们检索 \"customers\" 表中 \"city\" 列为 'New York' 且 \"age\" 列大于 30 的记录。\n\n\
    通过掌握 SELECT 语句及其各种子句，您已获得了根据需求从数据库表中检索特定数据的能力。在本章中，我们涵盖了检索所有列、选择特定列、使用 WHERE 子句应用过滤器、使用\
    \ ORDER BY 排序数据、使用 LIMIT 限制结果以及使用逻辑运算符组合条件。\n\n在下一章中，我们将更深入地研究 WHERE 子句并探索更高级的过滤技术。您将学习比较运算符、逻辑运算符和通配符运算符等运算符。这些概念将使您能够执行复杂的数据查询并从数据库中提取有价值的见解。\n\
    \n## 第四章：高级过滤技术\n\n在之前的章节中，我们探索了 SQL 的基础知识并学习了如何使用 SELECT 语句检索数据。在本章中，我们将深入研究使用\
    \ WHERE 子句的高级过滤技术。这些技术将允许您对数据库表执行更复杂和精确的查询。到本章结束时，您将对比较运算符、逻辑运算符、通配符运算符以及如何有效地将它们组合起来有扎实的理解。\n\
    \n### 第 1 节：比较运算符\n\n比较运算符用于比较值并在 WHERE 子句中定义条件。它们允许您根据相等、不等和其他比较来过滤数据。以下是一些常用的比较运算符：\n\
    \n- 等于：=\n- 不等于：<>\n- 大于：>\n- 小于：<\n- 大于或等于：>=\n- 小于或等于：<=\n\n示例：\n\n```sql\n\
    SELECT * FROM employees\nWHERE salary > 50000;\n```\n\n在此示例中，我们检索 \"employees\"\
    \ 表中 \"salary\" 列大于 50000 的所有记录。\n\n### 第 2 节：逻辑运算符\n\n逻辑运算符允许您在 WHERE 子句中组合多个条件以创建更复杂的过滤条件。常用的逻辑运算符有：\n\
    \n- AND：如果所有指定条件都为真，则返回记录。\n- OR：如果任何指定条件为真，则返回记录。\n- NOT：否定一个条件，返回不满足指定条件的记录。\n\
    \n示例：\n\n```sql\nSELECT * FROM products\nWHERE category = 'Electronics' AND price\
    \ < 1000;\n```\n\n在此示例中，我们检索 \"products\" 表中 \"category\" 列为 'Electronics' 且 \"\
    price\" 列小于 1000 的所有记录。\n\n### 第 3 节：通配符运算符\n\n通配符运算符用于匹配文本或字符串值中的模式。当您想要搜索部分匹配给定模式的值时，它们特别有用。常用的通配符运算符有：\n\
    \n- %：匹配任意字符序列（零个或多个）。\n- _：匹配任意单个字符。\n\n示例：\n\n```sql\nSELECT * FROM customers\n\
    WHERE last_name LIKE 'Sm%';\n```\n\n在此示例中，我们检索 \"customers\" 表中 \"last_name\"\
    \ 列以 'Sm' 开头的所有记录。\n\n### 第 4 节：组合运算符\n\n为了创建更复杂的过滤器，您可以在 WHERE 子句中组合多个比较运算符、逻辑运算符和通配符运算符。这允许您根据特定需求构建复杂条件。\n\
    \n示例：\n\n```sql\nSELECT * FROM orders\nWHERE (order_date >= '2022-01-01' AND order_date\
    \ <= '2022-12-31')\n  AND (status = 'Shipped' OR status = 'Delivered');\n```\n\
    \n在此示例中，我们检索 \"orders\" 表中 \"order_date\" 介于 2022 年内的记录，且 \"status\" 为 'Shipped'\
    \ 或 'Delivered'。\n\n### 第 5 节：NULL 值\n\n在 SQL 中，NULL 表示缺失或未知数据。在处理 NULL 值时，使用特殊运算符：\n\
    \n- IS NULL：匹配 NULL 值。\n- IS NOT NULL：匹配非 NULL 值。\n\n示例：\n\n```sql\nSELECT * FROM\
    \ employees\nWHERE department IS NULL;\n```\n\n在此示例中，我们检索 \"employees\" 表中 \"\
    department\" 列包含 NULL 值的所有记录。\n\n通过理解和应用这些高级过滤技术，您可以构建更复杂和精确的查询。这使您能够从数据库表中提取所需确切的数据。在下一章中，我们将探讨连接表，从而能够将来自多个表的数据组合到单个结果集中。\n"
