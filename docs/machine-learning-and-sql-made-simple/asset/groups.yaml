    4. Operators: SQL uses operators to perform operations and comparisons. Some common
    operators include = (equal to), > (greater than), < (less than), AND, OR, and
    NOT.


    # Section 5: Basic SQL Commands


    Let''s explore some basic SQL commands that will help you retrieve data from a
    database:


    1. SELECT: The SELECT statement is used to retrieve data from a database. It allows
    you to specify the columns you want to retrieve and the table from which to retrieve
    them.


    Example:


    To retrieve all data from a table called "customers," you can use the following
    SQL statement:


    ```

    ```sql

    SELECT * FROM customers;

    ```

    ```'
  - '[PAGE 82]


    In this example, the asterisk (*) is a wildcard character that represents all
    columns in the "customers" table. This statement will return all records and columns
    from the table.


    2. WHERE: The WHERE clause is used to filter data based on specified conditions.
    It allows you to extract only the records that meet specific criteria.


    Example:


    To retrieve all customers from a table named "customers" who are located in the
    city "New York," you can use the following SQL statement:


    ```

    ```sql

    SELECT * FROM customers WHERE city = ''New York'';

    ```

    ```


    This statement will return all records from the "customers" table where the "city"
    column has the value ''New York''.


    3. ORDER BY: The ORDER BY clause is used to sort the retrieved data in ascending
    or descending order based on one or more columns.'
