    ## Chapter 7: Data Manipulation in SQL


    In the previous chapters, we focused on retrieving and analyzing data from database
    tables. In this chapter, we will explore the essential aspects of data manipulation
    in SQL. Data manipulation involves inserting, updating, and deleting records in
    your database tables. Understanding these operations is crucial for maintaining
    and modifying your data effectively. By the end of this chapter, you will have
    a solid understanding of how to manipulate data using SQL statements.


    ### Section 1: Inserting Data


    The INSERT statement is used to add new records to a table. It allows you to specify
    the values for each column or insert data from another table. Here''s the basic
    syntax:


    ```sql

    INSERT INTO table (column1, column2, ...)

    VALUES (value1, value2, ...);

    ```


    Example 1:


    ```sql

    INSERT INTO customers (customer_name, email, phone)

    VALUES (''John Smith'',''john@example.com'',''555-1234'');

    ```


    In this example, we insert a new record into the "customers" table with the specified
    values for the "customer_name," "email," and "phone" columns.


    ### Example 2:


    ```sql

    INSERT INTO customers (customer_name, email, phone)

    SELECT name, email, phone

    FROM old_customers;

    ```


    In this example, we insert records into the "customers" table by selecting data
    from the "old_customers" table. The column names in the SELECT statement should
    match the target table''s column names.


    ### Section 2: Updating Data


    The UPDATE statement is used to modify existing records in a table. It allows
    you to update specific columns or multiple columns simultaneously. Here''s the
    basic syntax:


    ```sql

    UPDATE table

    SET column1 = value1, column2 = value2, ...

    WHERE condition;

    ```


    Example:


    ```sql

    UPDATE employees

    SET salary = salary * 1.1

    WHERE department = ''Sales'';

    ```


    In this example, we update the "salary" column of employees in the "Sales" department
    by increasing their salary by 10%.


    ### Section 3: Deleting Data


    The DELETE statement is used to remove records from a table. It allows you to
    specify conditions to delete specific rows or delete all rows from a table. Here''s
    the basic syntax:


    ```sql

    DELETE FROM table

    WHERE condition;

    ```


    Example 1:


    ```sql

    DELETE FROM customers

    WHERE customer_id = 5;

    ```


    In this example, we delete the record from the "customers" table where the "customer_id"
    is equal to 5.


    Example 2:


    ```sql

    DELETE FROM orders

    WHERE order_date < ''2022-01-01'';

    ```


    In this example, we delete all records from the "orders" table where the "order_date"
    is before January 1, 2022.


    ### Section 4: Transaction Management


    Transactions allow you to group multiple SQL statements into a single unit of
    work. It ensures the integrity and consistency of your data by either committing
    all changes or rolling back if an error occurs. Transactions have four main properties
    known as ACID: Atomicity, Consistency, Isolation, and Durability.


    ```sql

    BEGIN TRANSACTION;

    ```


    -- SQL statements


    ```sql

    COMMIT;

    ```


    In this example, we start a transaction using the BEGIN TRANSACTION statement.
    We perform multiple SQL statements within the transaction and commit the changes
    using the COMMIT statement. If any errors occur or if we want to discard the changes,
    we can use the ROLLBACK statement.


    ### Section 5: Indexes for Data Manipulation Efficiency


    Indexes are database structures that improve the performance of data retrieval
    and manipulation operations. By creating indexes on columns, you can speed up
    searches and data manipulation tasks. Indexes are particularly useful when working
    with large tables or frequently updated tables. Here are a few key points about
    indexes:


    - Indexes are created using the CREATE INDEX statement, specifying the table name,
    column(s) to be indexed, and an optional index name.

    - Indexes can significantly improve the performance of SELECT, UPDATE, DELETE,
    and even INSERT operations.

    - However, indexes come with some overhead, as they require additional storage
    space and impact the speed of data modification operations (INSERT, UPDATE, DELETE).

    - It''s important to carefully choose the columns to index based on their frequency
    of use in search and join operations.

    - Regular maintenance of indexes is recommended to ensure optimal performance,
    as indexes can become fragmented or outdated over time.


    Example:


    ```sql

    CREATE INDEX idx_customers_email ON customers (email);

    ```


    In this example, we create an index named "idx_customers_email" on the "email"
    column of the "customers" table. This index can speed up searches and improve
    data manipulation performance when using the "email" column in queries.


    ### Section 6: Best Practices for Data Manipulation


    When performing data manipulation operations, it''s important to follow some best
    practices to ensure data integrity and efficiency:


    - Always backup your data before performing any data manipulation operation, especially
    when dealing with updates or deletions.

    - Use transactions when making multiple changes to maintain data consistency and
    ensure rollback capability in case of errors.

    - Write efficient and specific WHERE clauses to limit the scope of updates and
    deletions and avoid unintended changes.

    - Consider the impact of data manipulation operations on indexes and plan for
    index maintenance or reorganization if necessary.

    - Test your data manipulation operations on a small scale before applying them
    to large datasets to avoid unexpected consequences.


    By following these best practices, you can confidently manipulate your data while
    maintaining its integrity and optimizing performance.


    In the next chapter, we will delve into the world of database views. Views allow
    you to create virtual tables that present a customized or filtered view of your
    data. We will explore how to create, modify, and use views effectively in your
    SQL queries. Stay tuned for an exciting exploration of SQL views!

