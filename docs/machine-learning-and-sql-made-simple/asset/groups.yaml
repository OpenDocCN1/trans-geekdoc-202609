    # Section 3: Subqueries with Operators and Functions


    Subqueries can be used with various operators and functions to perform more advanced
    operations. Let''s explore a few examples:


    # 3.1 Subqueries with Comparison Operators:


    ```

    ```sql

    SELECT employee_name, salary

    FROM employees

    WHERE salary > (SELECT AVG(salary) FROM employees);

    ```

    ```


