  md: '# Chapter 9: SQL Subqueries


    In the previous chapters, we focused on manipulating data within tables and using
    views to simplify queries. In this chapter, we will explore an advanced feature
    of SQL called subqueries. Subqueries, also known as nested queries or inner queries,
    allow you to nest one query within another query. They provide a powerful way
    to retrieve and manipulate data by combining the results of multiple queries.
    In this chapter, we will dive into different types of subqueries and explore their
    applications in SQL.


    # Section 1: Introduction to Subqueries


    A subquery is a query that is embedded within another query. It can be used in
    various parts of a SQL statement, such as the SELECT, FROM, WHERE, or HAVING clauses.
    The subquery is executed first, and its result is then used in the outer query.
    Subqueries can return a single value, a single row, or multiple rows.


    Example:


    ```

    ```sql

    SELECT employee_name, department

    FROM employees

    WHERE department IN (SELECT department FROM departments WHERE location = ''New
    York'');

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'In this example, the subquery `(SELECT department FROM departments WHERE location
    = ''New York'')` retrieves the departments located in New York. The outer query
    then selects the employee name and department for employees working in those departments.


    # Section 2: Types of Subqueries


    There are different types of subqueries based on their placement and the results
    they return. Let''s explore three common types:


    # 2.1 Scalar Subqueries:


    A scalar subquery returns a single value and can be used in expressions or conditions.
    It is typically placed in the SELECT, WHERE, or HAVING clauses.


    Example:


    ```

    ```sql

    SELECT employee_name, (SELECT AVG(salary) FROM employees) AS avg_salary

    FROM employees;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'In this example, the subquery `(SELECT AVG(salary) FROM employees)` calculates
    the average salary of all employees. The outer query retrieves employee names
    and includes the average salary as a separate column.


    # 2.2 Row Subqueries:


    A row subquery returns a single row and can be used in expressions or conditions.
    It is typically placed in the SELECT, WHERE, or HAVING clauses.


    Example:


    ```

    ```sql

    SELECT employee_name

    FROM employees

    WHERE (department, salary) = (SELECT department, MAX(salary) FROM employees WHERE
    department = ''Sales'');

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'In this example, the subquery `(SELECT department, MAX(salary) FROM employees
    WHERE department = ''Sales'')` retrieves the maximum salary and corresponding
    department for the Sales department. The outer query selects the employee name
    for employees who have the same department and salary as the subquery result.


    # 2.3 Table Subqueries:


    A table subquery returns multiple rows and is used in the FROM clause as a derived
    table. It can be treated as a temporary table within the main query.


    Example:


    ```

    ```sql

    SELECT t1.employee_name, t2.department

    FROM (SELECT employee_name, department FROM employees WHERE salary > 50000) AS
    t1

    JOIN (SELECT department, location FROM departments WHERE location = ''New York'')
    AS t2

    ON t1.department = t2.department;

    ```

    ```


    In this example, the subqueries `(SELECT employee_name, department FROM employees
    WHERE salary > 50000)` and `(SELECT department, location FROM departments WHERE
    location = ''New York'')` create derived tables t1 and t2,'
  merge: -1
  img_proc: true
