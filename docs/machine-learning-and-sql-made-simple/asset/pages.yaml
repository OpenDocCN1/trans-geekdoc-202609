  md: '# Chapter 5: Joining Tables


    In the previous chapters, we focused on querying data from a single table. However,
    many real-world scenarios require combining data from multiple tables. In this
    chapter, we will explore the concept of joining tables in SQL. Joining tables
    allows you to merge related data and obtain a comprehensive view of your information.
    By the end of this chapter, you will understand different types of joins, how
    to join tables using common columns, and how to retrieve data from joined tables.


    # Section 1: Understanding Table Joins


    Table joins combine rows from two or more tables based on a related column between
    them. The most common types of joins are:


    +   - Inner Join: Returns only the matching rows between the tables.

    - Left Join: Returns all rows from the left table and the matching rows from the
    right table.

    - Right Join: Returns all rows from the right table and the matching rows from
    the left table.

    - Full Outer Join: Returns all rows from both tables, including the unmatched
    ones.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Section 2: Inner Join


    The INNER JOIN combines rows from two tables that have matching values in the
    specified column. The syntax for an inner join is as follows:


    ```

    ```sql

    SELECT columns

    FROM table1

    INNER JOIN table2

    ON table1.column = table2.column;

    ```

    ```


    Example:


    ```

    ```sql

    SELECT orders.order_id, customers.customer_name

    FROM orders

    INNER JOIN customers

    ```

    ```'
