  md: '2.1 Entities: An entity represents a distinct object or concept in the real
    world. It can be a physical object, a person, a place, or an abstract concept.
    Entities are represented by rectangles in an ERD.


    2.2 Relationships: Relationships define the associations between entities. They
    represent how entities interact or relate to each other. Relationships are depicted
    by diamond shapes in an ERD, and lines connect entities to represent the connections.


    2.3 Attributes: Attributes are the properties or characteristics of entities.
    They provide additional details or descriptions about entities or relationships.
    Attributes are represented by ovals or ellipses connected to the corresponding
    entity or relationship.


    2.4 Cardinality and Modality: Cardinality specifies the number of instances of
    one entity that can be associated with another entity through a relationship.
    Modality defines whether the participation of an entity in a relationship is mandatory
    (denoted by a solid line) or optional (denoted by a dashed line).


