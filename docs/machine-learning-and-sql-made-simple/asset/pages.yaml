    specific class. It is especially suitable for binary classification tasks, where
    there are only two possible classes.


    Logistic regression uses the logistic function (sigmoid function) to transform
    the linear combination of input features into a probability value between 0 and
    1. If the probability is above a predefined threshold, the input is classified
    into one class; otherwise, it belongs to the other class.


