  md: 'following columns: EmployeeID, EmployeeName, Department, DepartmentLocation,
    and ManagerName.


    # Step 1: First Normal Form (1NF):


    Break the repeating groups and ensure atomic values. Split the table into two
    tables: "Employees" (EmployeeID, EmployeeName, ManagerID, DepartmentID) and "Departments"
    (DepartmentID, Department, DepartmentLocation).


    # Step 2: Second Normal Form (2NF):


    Ensure that non-key columns are fully dependent on the entire primary key. In
    this example, the "ManagerName" column is dependent on the "ManagerID" column.
    So, we move the "ManagerName" column to the "Employees" table.


    # Step 3: Third Normal Form (3NF):


    Eliminate transitive dependencies. In this case, the "DepartmentLocation" is dependent
    on the "Department" column. To remove the transitive dependency, we create a separate
    "Locations" table with "DepartmentID" and "DepartmentLocation".


    The final normalized structure would consist of the following tables:


