  md: '# Chapter 11: SQL Transactions


    In the previous chapters, we explored SQL querying, data manipulation, and functions.
    In this chapter, we will dive into SQL transactions. A transaction is a sequence
    of one or more database operations that should be treated as a single logical
    unit. Transactions ensure data integrity and consistency by allowing multiple
    operations to succeed or fail together. In this chapter, we will learn about the
    concept of transactions, their properties, and how to use them effectively in
    SQL.


    # Section 1: Introduction to Transactions


    A transaction is a set of database operations that are executed as a single unit.
    It follows the ACID properties, which stand for Atomicity, Consistency, Isolation,
    and Durability.


    1.1 Atomicity: Atomicity ensures that a transaction is treated as a single indivisible
    operation. Either all the operations within a transaction are completed successfully,
    or none of them are. If any part of the transaction fails, the entire transaction
    is rolled back, and the database is left unchanged.


    1.2 Consistency: Consistency ensures that a transaction brings the database from
    one consistent state to another. It means that the data meets all the defined
    integrity constraints and business rules. The database remains in a consistent
    state before and after the transaction.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '1.3 Isolation: Isolation ensures that concurrent transactions do not interfere
    with each other. Each transaction is executed in isolation, as if it were the
    only transaction running on the database. This prevents data inconsistencies and
    conflicts caused by concurrent access.


    1.4 Durability: Durability guarantees that once a transaction is committed, its
    changes are permanent and will survive any subsequent system failures. The committed
    data is stored in a way that allows it to be recovered and restored even in the
    event of a system crash or power loss.


    # Section 2: Transaction Control Statements


    SQL provides transaction control statements to manage transactions explicitly.
    These statements allow you to define the boundaries of a transaction and control
    its behavior. The three main transaction control statements are:


    2.1 BEGIN TRANSACTION/START TRANSACTION: Marks the beginning of a transaction.
    It defines the starting point from which all subsequent operations are part of
    the same transaction.


    2.2 COMMIT: Commits the transaction and makes all its changes permanent. It indicates
    that the transaction has been completed successfully and all its modifications
    should be saved.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "2.3 ROLLBACK: Rolls back the transaction and cancels all its changes. It is\
    \ used to undo the effects of a transaction that has encountered an error or needs\
    \ to be canceled.\n\nExample:\n\n```\n```sql\nBEGIN TRANSACTION;\n  -- SQL statements\
    \ for the transaction\nCOMMIT;\n```\n```\n\nIn this example, we use the BEGIN\
    \ TRANSACTION statement to mark the beginning of a transaction. We include the\
    \ SQL statements that constitute the transaction. If everything executes successfully,\
    \ we commit the transaction using the COMMIT statement. If an error occurs or\
    \ the transaction needs to be canceled, we can roll it back using the ROLLBACK\
    \ statement.\n\n# Section 3: Transaction Isolation Levels\n\nTransaction isolation\
    \ levels determine how concurrent transactions interact with each other. SQL provides\
    \ different isolation levels to balance data consistency and transaction performance.\
    \ The commonly used isolation levels are:"
  merge: -1
  img_proc: true
- pgno: 158
  md: '3.1 READ UNCOMMITTED: Allows transactions to read uncommitted data from other
    transactions. It offers the lowest level of isolation but can result in dirty
    reads, non-repeatable reads, and phantom reads.


    3.2 READ COMMITTED: Allows transactions to read committed data from other transactions.
    It prevents dirty reads but can still result in non-repeatable reads and phantom
    reads.


    3.3 REPEATABLE READ: Ensures that the data read by a transaction remains consistent
    throughout the transaction. It prevents dirty reads and non-repeatable reads but
