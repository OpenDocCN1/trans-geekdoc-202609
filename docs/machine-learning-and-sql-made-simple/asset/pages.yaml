    ```

    ```


    In this example, we retrieve the customer name from the "customers" table and
    the order ID from the "orders" table. All customers are included, even if they
    don''t have any orders. The unmatched order IDs will have NULL values.


    # Section 4: Right Join


    The RIGHT JOIN returns all rows from the right table and the matching rows from
    the left table. If there are no matches, NULL values are included for the columns
    of the left table. The syntax for a right join is as follows:


    ```

    ```sql

    SELECT columns

    FROM table1

    RIGHT JOIN table2

    ```

    ```'
