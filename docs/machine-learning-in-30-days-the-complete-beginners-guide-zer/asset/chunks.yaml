- raw: 'While standard RNNs struggle with long-term dependencies, LSTMs (Long Short-Term
    Memory) and GRUs (Gated Recurrent Units) are designed to handle longer sequences
    effectively by introducing gated mechanisms that regulate the flow of information.


    ### LSTMs (Long Short-Term Memory)


    LSTMs introduce gates that regulate the flow of information:


    *   Forget Gate: Decides what information to discard from the cell state.


    *   Input Gate: Determines what new information to store in the cell state.


    *   Output Gate: Controls what information is passed to the next step, ensuring
    that only relevant details are retained.


    ### GRUs (Gated Recurrent Units)


    GRUs are a simplified version of LSTMs with only two gates (reset and update gates),
    making them computationally faster while retaining effectiveness for many sequential
    modeling tasks. GRUs often perform as well as LSTMs but require fewer parameters,
    making them a preferred choice for certain applications.


    ## Example: Predicting Stock Prices Using LSTM


    LSTMs are widely used in time-series forecasting, such as predicting stock prices
    based on historical data. This example demonstrates how LSTMs capture temporal
    patterns to make future predictions.


    ### Step 1: Load and Preprocess Stock Data


    import pandas as pd


    from sklearn.preprocessing import MinMaxScaler


    \# Load dataset


    df = pd.read\_csv("stock\_prices.csv")


    prices = df\[''Close''\].values.reshape(-1,1)


    \# Normalize the data


    scaler = MinMaxScaler()


    prices\_scaled = scaler.fit\_transform(prices)


    ### Step 2: Prepare Training Data


    def create\_sequences(data, seq\_length):


    X, y = \[\], \[\]


    for i in range(len(data) - seq\_length):


    X.append(data\[i:i+seq\_length\])


    y.append(data\[i+seq\_length\])


    return np.array(X), np.array(y)


    seq\_length = 10  # Using 10 days of data to predict the next day''s price


    X, y = create\_sequences(prices\_scaled, seq\_length)


    ### Step 3: Define the LSTM Model


    model = keras.Sequential(\[


    keras.layers.LSTM(50, return\_sequences=True, input\_shape=(seq\_length, 1)),


    keras.layers.LSTM(50, return\_sequences=False),


    keras.layers.Dense(25),


    keras.layers.Dense(1)


    \])


    model.compile(optimizer=''adam'', loss=''mean\_squared\_error'')


    ### Step 4: Train the Model


    model.fit(X, y, epochs=50, batch\_size=16, verbose=1)


    ### Step 5: Making Predictions


    predicted\_prices = model.predict(X)


    predicted\_prices = scaler.inverse\_transform(predicted\_prices)  # Convert back
    to original scale


    ### Step 6: Visualizing Predictions


    import matplotlib.pyplot as plt


    plt.figure(figsize=(10,6))


    plt.plot(df.index\[seq\_length:\], predicted\_prices, label="Predicted Prices")


    plt.plot(df.index\[seq\_length:\], prices\[seq\_length:\], label="Actual Prices")


    plt.xlabel("Days")


    plt.ylabel("Stock Price")


    plt.legend()


    plt.show()


    ## Conclusion


    Recurrent Neural Networks (RNNs) are powerful models designed for sequential data,
    making them ideal for text processing and time-series forecasting. While traditional
    RNNs struggle with long-term dependencies, LSTMs and GRUs effectively retain information
    over longer sequences. By implementing an LSTM model for stock price prediction,
    we demonstrated how deep learning can be applied to financial forecasting, showcasing
    how these models capture and leverage historical data patterns to predict future
    trends. In the next chapter, we will explore Transformer Networks and Attention
    Mechanisms, which have revolutionized NLP and sequence modeling.


    # Day 20: Introduction to Reinforcement Learning


    ## Basics of Reinforcement Learning


    Reinforcement Learning (RL) is a machine learning paradigm where an agent learns
    to make decisions by interacting with an environment. Unlike supervised learning,
    where the model is trained on labeled data, RL focuses on learning through trial
    and error with rewards and penalties guiding the learning process. The agent aims
    to maximize cumulative rewards over time by discovering optimal actions through
    exploration and exploitation. This iterative learning process enables RL agents
    to adapt dynamically to various situations, improving performance through continued
    interaction with their environment.


    ![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\297A23AA.tmp](image_rsrc40T.jpg)


    ### Key Concepts in Reinforcement Learning:


    1.  Agent: The learning entity that interacts with the environment and makes decisions
    based on experience and learned policies.


    2.  Environment: The external system with which the agent interacts (e.g., a game,
    a robot’s surroundings, or a stock market simulation). The environment provides
    feedback to the agent in the form of rewards.


    3.  State: A representation of the current situation in the environment. The state
    contains information necessary for the agent to make an informed decision.


    4.  Action: A move or decision the agent makes at each time step. The agent selects
    an action based on its policy and state.


    5.  Reward: A numerical value received after performing an action, indicating
    how good or bad the action was in the context of the given state. Positive rewards
    encourage the agent to continue certain behaviors, while negative rewards discourage
    suboptimal actions.


    6.  Policy: A strategy that defines how the agent chooses actions based on the
    current state. Policies can be deterministic (always taking the same action for
    a given state) or stochastic (choosing actions based on probabilities).


    7.  Value Function: Estimates the expected long-term reward of being in a particular
    state or taking a specific action. This helps the agent differentiate between
    short-term gains and long-term benefits, leading to more effective decision-making.


    ## Understanding Agents, Actions, and Rewards


    Reinforcement Learning revolves around the Markov Decision Process (MDP), which
    defines how an agent interacts with an environment over time. MDPs provide a mathematical
    framework for modeling decision-making problems where outcomes are partly random
    but influenced by the agent''s choices.


    ### The MDP consists of:


    *   States (S): The different conditions the agent can be in at any given time
    step.


    *   Actions (A): The available actions the agent can take in each state. The agent
    must explore different actions to identify the optimal choices.


    *   Transition Function (P): The probability of moving from one state to another
    after taking an action. Some environments have deterministic transitions, while
    others introduce uncertainty.


    *   Reward Function (R): The immediate feedback given to the agent for taking
    an action. This helps the agent adjust its behavior to maximize long-term rewards.


    *   Policy (π): The agent''s strategy for choosing actions based on its state.
    The policy is learned through interactions with the environment and evolves as
    the agent gathers more experience.


    A typical RL cycle works as follows:


    1.  The agent observes the current state of the environment.


    2.  It selects an action based on its current policy.


    3.  The environment responds by providing a reward and transitioning to a new
    state.


    4.  The agent updates its policy based on the reward received, refining its decision-making
    process.


    5.  This process repeats iteratively until the agent learns an optimal strategy
    that maximizes cumulative rewards over time.


