    * `随机森林` – 结合多个决策树的集成学习方法。\n* `支持向量机 (SVM)` – 为分类寻找最优边界。\n* `k-最近邻 (KNN)` – 一种非参数算法，用于分类和回归。\n\
    * `神经网络` – 受大脑启发，用于深度学习任务。\n\n### 关键 ML 公式\n\n* `均方误差 (MSE)`\n* `对数损失（二分类）`\n\
    * `梯度下降更新规则`\n\n### 特征工程最佳实践\n\n* 对数值特征进行归一化或标准化。\n* 将类别特征转换为数值（独热编码、标签编码）。\n\
    * 使用填充技术处理缺失值。\n* 移除相关特征以减少冗余。\n\n## 常见 ML 错误与修复\n\n即使是经验丰富的 ML 专家在训练模型时也会遇到问题。以下是一些常见错误及其解决方案：\n\
