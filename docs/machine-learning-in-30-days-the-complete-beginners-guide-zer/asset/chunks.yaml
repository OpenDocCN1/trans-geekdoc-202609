- raw: 'We will use the FrozenLake-v1 environment from OpenAI Gym, where the agent
    must navigate a frozen lake while avoiding holes. This environment requires the
    agent to balance exploration (trying new actions) and exploitation (choosing the
    best-known action) to reach the goal.


    \# Initialize the environment


    env = gym.make("FrozenLake-v1", is\_slippery=False)  # Disabling slipperiness
    for deterministic behavior


    \# Get environment details


    state\_size = env.observation\_space.n  # Number of states


    action\_size = env.action\_space.n  # Number of actions


    ### Step 3: Initialize Q-Table


    The Q-table stores the expected future rewards for each state-action pair. Over
    time, the agent refines these values to make better decisions.


    \# Initialize Q-table


    Q\_table = np.zeros((state\_size, action\_size))


    \# Set learning parameters


    learning\_rate = 0.8  # Alpha


    discount\_factor = 0.95  # Gamma


    epsilon = 1.0  # Exploration-exploitation tradeoff


    epsilon\_decay = 0.99  # Reduce exploration over time


    num\_episodes = 1000  # Training episodes


    ### Step 4: Train the RL Agent


    for episode in range(num\_episodes):


    state = env.reset()\[0\]  # Reset environment


    done = False


    while not done:


    \# Choose action: Explore (random) or Exploit (best known action)


    if random.uniform(0, 1) < epsilon:


    action = env.action\_space.sample()  # Explore


    else:


    action = np.argmax(Q\_table\[state, :\])  # Exploit


    \# Take action and receive reward


    new\_state, reward, done, \_, \_ = env.step(action)


    \# Update Q-table using the Bellman equation


    Q\_table\[state, action\] = Q\_table\[state, action\] + learning\_rate \* (


    reward + discount\_factor \* np.max(Q\_table\[new\_state, :\]) - Q\_table\[state,
    action\]


    )


    state = new\_state  # Move to the next state


    \# Reduce epsilon (exploration rate) gradually


    epsilon \*= epsilon\_decay


    ### Step 5: Test the Trained Agent


    After training, we evaluate the agent''s performance by making it play the game
    without learning. The goal is to see if the learned policy successfully guides
    the agent to achieve higher rewards.


    num\_test\_episodes = 10


    successes = 0


    for \_ in range(num\_test\_episodes):


    state = env.reset()\[0\]


    done = False


    while not done:


    action = np.argmax(Q\_table\[state, :\])  # Choose best action


    state, reward, done, \_, \_ = env.step(action)


    if reward == 1:


    successes += 1


    print(f"Agent succeeded in {successes} out of {num\_test\_episodes} games.")


    This simple RL agent learns to navigate the frozen lake by optimizing its policy
    over multiple episodes, demonstrating the power of reinforcement learning in solving
    sequential decision-making problems.


    ## Conclusion


    Reinforcement Learning (RL) allows agents to learn by interacting with their environment
    and optimizing actions based on rewards. Through the implementation of Q-learning
    and Deep Q-Networks (DQN), we demonstrated how RL can be applied to solve sequential
    decision-making problems. By continuously improving their policies through feedback,
    RL agents can tackle a wide range of real-world applications, from robotics to
    financial modeling. In the next chapter, we will explore Advanced Reinforcement
    Learning Techniques, including Policy Gradients and Actor-Critic methods, which
    further refine agent learning capabilities in complex environments.


    # Day 21: Natural Language Processing (NLP) with Python


    Natural Language Processing (NLP) is a field of artificial intelligence that enables
    computers to understand, interpret, and generate human language. It bridges the
    gap between human communication and machine intelligence by using computational
    techniques to analyze textual data. NLP plays a crucial role in applications like
    chatbots, machine translation, sentiment analysis, text classification, speech
    recognition, and search engines.


    ![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\59BC0948.tmp](image_rsrc40U.jpg)


    ### Why NLP Matters


    *   Automates text-based tasks: NLP automates processes such as email categorization,
    spam detection, and document summarization.


    *   Improves user experience: Voice assistants like Siri and Google Assistant
    rely on NLP to process user queries and respond effectively.


    *   Enhances business intelligence: Companies use NLP for sentiment analysis to
    understand customer feedback and improve services.


    ## Tokenization, Stemming, and Lemmatization


    ### Tokenization


    Tokenization is the process of breaking text into smaller units, such as words
    or sentences, which serve as input for further analysis.


    #### Implementing Tokenization in Python


    import nltk


    from nltk.tokenize import word\_tokenize, sent\_tokenize


    text = "Natural Language Processing is fascinating! It allows computers to understand
    human language."


    \# Word Tokenization


    words = word\_tokenize(text)


    print("Word Tokens:", words)


    \# Sentence Tokenization


    sentences = sent\_tokenize(text)


    print("Sentence Tokens:", sentences)


    ### Stemming


    Stemming is the process of reducing words to their root form. It removes suffixes
    like "ing", "ed", or "ly" but may not always produce meaningful words.


    #### Implementing Stemming


    from nltk.stem import PorterStemmer


    stemmer = PorterStemmer()


    stemmed\_words = \[stemmer.stem(word) for word in words\]


    print("Stemmed Words:", stemmed\_words)


    ### Lemmatization


    Lemmatization is a more advanced technique than stemming. It reduces words to
    their base or dictionary form, ensuring the resulting words have meaning.


    #### Implementing Lemmatization


    from nltk.stem import WordNetLemmatizer


    lemmatizer = WordNetLemmatizer()


    lemmatized\_words = \[lemmatizer.lemmatize(word) for word in words\]


    print("Lemmatized Words:", lemmatized\_words)


    ## Sentiment Analysis with Machine Learning


    Sentiment analysis is the process of determining whether a piece of text expresses
    a positive, negative, or neutral sentiment. This is widely used in analyzing customer
    feedback, social media trends, and brand reputation.


    ### Step 1: Load Data


    import pandas as pd


    from sklearn.model\_selection import train\_test\_split


    from sklearn.feature\_extraction.text import TfidfVectorizer


    from sklearn.naive\_bayes import MultinomialNB


    from sklearn.metrics import accuracy\_score


    \# Sample dataset


    data = {"text": \["I love this product!", "This is the worst experience ever.",
    "It''s okay, nothing special.", "Absolutely fantastic!", "Terrible, never buying
    again."\],


    "label": \[1, 0, 1, 1, 0\]}  # 1 = Positive, 0 = Negative


    df = pd.DataFrame(data)


    ### Step 2: Preprocess Data


    X = df\["text"\]


    y = df\["label"\]


    \# Convert text to numerical features


    vectorizer = TfidfVectorizer()


    X\_transformed = vectorizer.fit\_transform(X)


    ### Step 3: Train a Sentiment Analysis Model


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X\_transformed, y, test\_size=0.2,
    random\_state=42)


    \# Train Naïve Bayes classifier


    model = MultinomialNB()


    model.fit(X\_train, y\_train)


    ### Step 4: Evaluate Model Performance


    y\_pred = model.predict(X\_test)


    accuracy = accuracy\_score(y\_test, y\_pred)


    print(f"Model Accuracy: {accuracy:.2f}")


    ## Implementing Text Classification


    Text classification involves categorizing text into predefined labels, such as
    spam detection, news categorization, or topic classification.


    ### Step 1: Load and Preprocess Text Data


    text\_samples = \["Buy now! Limited offer.", "Breaking news: Stock market crashes!",
    "Your loan application is approved."\]


    labels = \["spam", "news", "finance"\]


    \# Convert text into numerical form


    vectorized\_samples = vectorizer.transform(text\_samples)


    ### Step 2: Train a Text Classification Model


    model.fit(X\_transformed, y)


    classified\_labels = model.predict(vectorized\_samples)


    print("Classified Labels:", classified\_labels)


    ## Example: Analyzing Twitter Sentiment Using NLP


    Social media platforms generate vast amounts of text data daily. By applying NLP
    techniques, we can analyze the sentiment of tweets and gauge public opinion on
    various topics.'
