    \n### 特征缩放\n\n机器学习模型通常要求特征具有相似尺度以提高收敛性和性能。特征缩放的常用方法有两种：\n\n*   `Standardization`（Z-score\
    \ 标准化）：将值转换为均值为 0、标准差为 1 的分布。\n*   `Min-Max Scaling`（最小最大归一化）：将值缩放到固定范围内，通常为 `[0,1]`。\n\
    \n### 示例：在 Python 中应用特征缩放\n\n```python\nfrom sklearn.preprocessing import StandardScaler,\
