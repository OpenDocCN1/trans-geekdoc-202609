- raw: 'Decision Trees are one of the most intuitive and interpretable machine learning
    algorithms used for both classification and regression tasks. They function by
    splitting data into branches based on decision rules, which makes them highly
    effective for capturing patterns in structured datasets. A decision tree is constructed
    using a series of binary splits, where each split is based on a feature that best
    separates the target classes.


    The structure of a decision tree consists of:


    *   Root Node: The topmost node representing the entire dataset.


    *   Decision Nodes: Intermediate nodes where the dataset is split based on feature
    values.


    *   Leaf Nodes: Terminal nodes that contain the final classification or prediction
    output.


    ![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\936578B1.tmp](image_rsrc408.jpg)


    The algorithm follows a recursive process known as recursive partitioning, where
    it selects the feature that results in the best separation of classes based on
    criteria such as Gini Impurity, Entropy, or Information Gain.


    ### Example of a Decision Tree Split


    If we want to classify patients as diabetic or non-diabetic based on blood sugar
    levels and BMI, a simple decision tree might look like this:


    1.  If Blood Sugar > 140 mg/dL → High risk of diabetes


    2.  If Blood Sugar ≤ 140 mg/dL and BMI > 30 → Moderate risk


    3.  If Blood Sugar ≤ 140 mg/dL and BMI ≤ 30 → Low risk


    This hierarchical structure allows decision trees to efficiently model complex
    relationships between features and the target variable.


    ## Overfitting and Pruning in Decision Trees


    One of the major drawbacks of decision trees is their tendency to overfit the
    training data, meaning they learn patterns that do not generalize well to unseen
    data. Overfitting happens when a decision tree grows too deep, capturing noise
    rather than meaningful patterns.


    To prevent overfitting, we use pruning techniques:


    1.  Pre-Pruning (Stopping Criteria): Stops tree growth when further splits do
    not significantly improve accuracy. This is controlled using hyperparameters such
    as max\_depth, min\_samples\_split, and min\_samples\_leaf.


    2.  Post-Pruning (Simplifying the Tree): Allows the tree to grow fully and then
    removes branches that have minimal impact on predictive performance.


    ### Example: Implementing Decision Tree with Pruning


    from sklearn.tree import DecisionTreeClassifier


    from sklearn.model\_selection import train\_test\_split


    from sklearn.metrics import accuracy\_score


    import pandas as pd


    \# Creating a sample dataset


    data = {


    ''Blood\_Sugar'': \[120, 150, 130, 170, 180, 90, 160, 145, 100, 115\],


    ''BMI'': \[28, 32, 27, 35, 38, 25, 36, 31, 22, 26\],


    ''Diabetes'': \[0, 1, 0, 1, 1, 0, 1, 1, 0, 0\]


    }


    df = pd.DataFrame(data)


    \# Splitting dataset


    X = df\[\[''Blood\_Sugar'', ''BMI''\]\]


    y = df\[''Diabetes''\]


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.2,
    random\_state=42)


    \# Training Decision Tree with depth restriction


    dt\_model = DecisionTreeClassifier(max\_depth=3, min\_samples\_split=2)


    dt\_model.fit(X\_train, y\_train)


    \# Making predictions


    y\_pred = dt\_model.predict(X\_test)


    \# Evaluating performance


    accuracy = accuracy\_score(y\_test, y\_pred)


    print(f"Decision Tree Accuracy: {accuracy:.2f}")


    By limiting the tree’s depth, we ensure that it generalizes well to new data instead
    of memorizing specific examples from the training dataset.


    ## Implementing Random Forest for Better Accuracy


    While decision trees are powerful, they are sensitive to small changes in data
    and can lead to high variance. Random Forests solve this problem by combining
    multiple decision trees, making predictions based on majority voting (for classification)
    or averaging (for regression).


    Random Forests introduce two key concepts:


    *   Bagging (Bootstrap Aggregating): Each tree is trained on a random subset of
    the data, reducing overfitting.


    *   Feature Randomness: At each split, only a random subset of features is considered,
    making each tree slightly different and improving generalization.


    ### Implementing a Random Forest Classifier


    from sklearn.ensemble import RandomForestClassifier


    \# Training a Random Forest model


    rf\_model = RandomForestClassifier(n\_estimators=100, max\_depth=4, random\_state=42)


    rf\_model.fit(X\_train, y\_train)


    \# Making predictions


    y\_pred\_rf = rf\_model.predict(X\_test)


    \# Evaluating performance


    accuracy\_rf = accuracy\_score(y\_test, y\_pred\_rf)


    print(f"Random Forest Accuracy: {accuracy\_rf:.2f}")


    By aggregating multiple decision trees, Random Forest models significantly improve
    accuracy and robustness, making them suitable for high-dimensional datasets.


    ## Example: Predicting Whether a Patient Has Diabetes Using a Decision Tree


    To illustrate decision tree classification, let’s apply it to a medical dataset
    where we predict whether a patient has diabetes based on various health metrics.


    import seaborn as sns


    import matplotlib.pyplot as plt


    \# Visualizing the decision tree


    from sklearn.tree import plot\_tree


    plt.figure(figsize=(12,6))


    plot\_tree(dt\_model, feature\_names=\[''Blood\_Sugar'', ''BMI''\], class\_names=\[''No
    Diabetes'', ''Diabetes''\], filled=True)


    plt.show()


    ### Explanation of the Visualization


    *   The root node contains the initial split based on the most important feature
    (e.g., Blood Sugar level).


    *   Branches represent different decision paths based on conditions (e.g., BMI
    values).


    *   Leaf nodes contain the final predictions (Diabetes or No Diabetes).


    The decision tree diagram allows us to understand how the model makes predictions
    and how different features contribute to classification.


    ## Conclusion


    Decision Trees and Random Forests are powerful tools for classification tasks.
    While decision trees offer interpretability, they are prone to overfitting, which
    can be addressed through pruning techniques. Random Forests, on the other hand,
    provide superior accuracy and stability by combining multiple decision trees using
    ensemble learning. Understanding these models and their applications helps in
    making informed decisions when dealing with structured data.


    # Day 9: Understanding Support Vector Machines (SVMs)


    ## Concept of Hyperplanes and Margins


    Support Vector Machines (SVMs) are among the most powerful and widely used supervised
    learning algorithms, primarily for classification tasks but also applicable to
    regression problems. They excel at handling both linearly and non-linearly separable
    data by mapping features into higher-dimensional spaces, allowing for better classification
    boundaries.


    ![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\17A4E08D.tmp](image_rsrc409.jpg)


    The core idea behind SVMs is the concept of hyperplanes and margins. A hyperplane
    is a decision boundary that separates different classes in a dataset. The optimal
    hyperplane is the one that maximizes the margin, which is the distance between
    the hyperplane and the nearest data points from each class. These nearest points,
    known as support vectors, play a critical role in defining the decision boundary.


    ### How SVMs Work:


    1.  Finding the Optimal Hyperplane: SVMs identify the hyperplane that maximizes
    the margin between classes, ensuring better generalization.


    2.  Handling Non-Linearly Separable Data: When data is not linearly separable,
    SVMs use a technique called the kernel trick to transform data into a higher-dimensional
    space where separation is possible.


    3.  Regularization and Soft Margins: SVMs allow for a certain degree of misclassification
    to avoid overfitting. This is controlled by a hyperparameter called C, which balances
    margin maximization and classification error minimization.


