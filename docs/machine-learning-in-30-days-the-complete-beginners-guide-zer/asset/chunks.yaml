    \ 对象，可以有效处理结构化数据，使用户能够清洗、分析和转换数据集。\n\n示例用法：\n\n```python\nimport pandas as pd\n\
    # 创建 DataFrame\ndata = {'Name': ['Alice', 'Bob', 'Charlie'], 'Age': [25, 30, 35]}\n\
