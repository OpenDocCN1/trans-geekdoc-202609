  trans: "\n\n我们将使用 OpenAI Gym 提供的 `FrozenLake-v1` 环境，其中智能体必须在冰面上导航的同时避开冰洞。该环境要求智能体平衡探索（尝试新动作）与利用（选择已知最佳动作）以到达目标。\n\
    \n# 初始化环境\n\n`env = gym.make(\"FrozenLake-v1\", is_slippery=False)`  # 关闭平滑性以实现确定性行为\n\
    \n# 获取环境详情\n\n`state_size = env.observation_space.n`  # 状态数量\n\n`action_size =\
    \ env.action_space.n`  # 动作数量\n\n### 步骤 3：初始化 Q 表\n\nQ 表存储每个状态-动作对的预期未来奖励。随着时间的推移，智能体会完善这些值以做出更好的决策。\n\
    \n# 初始化 Q 表\n\n`Q_table = np.zeros((state_size, action_size))`\n\n# 设置学习参数\n\n\
    `learning_rate = 0.8`  # Alpha\n\n`discount_factor = 0.95`  # Gamma\n\n`epsilon\
    \ = 1.0`  # 探索与利用的权衡\n\n`epsilon_decay = 0.99`  # 随时间减少探索\n\n`num_episodes = 1000`\
    \  # 训练迭代\n\n### 步骤 4：训练强化学习智能体\n\n```python\nfor episode in range(num_episodes):\n\
    \    state = env.reset()[0]  # 重置环境\n    done = False\n    while not done:\n \
    \       # 选择动作：探索（随机）或利用（已知最佳动作）\n        if random.uniform(0, 1) < epsilon:\n\
    \            action = env.action_space.sample()  # 探索\n        else:\n       \
    \     action = np.argmax(Q_table[state, :])  # 利用\n        # 执行动作并接收奖励\n     \
    \   new_state, reward, done, _, _ = env.step(action)\n        # 使用贝尔曼方程更新 Q 表\n\
    \        Q_table[state, action] = Q_table[state, action] + learning_rate * (\n\
    \            reward + discount_factor * np.max(Q_table[new_state, :]) - Q_table[state,\
    \ action]\n        )\n        state = new_state  # 移动下一个状态\n        # 逐渐减少 epsilon（探索率）\n\
    \        epsilon *= epsilon_decay\n```\n\n### 步骤 5：测试训练好的智能体\n\n训练完成后，我们通过让智能体在不学习的情况下玩来评估其性能。目标是查看学习到的策略是否成功引导智能体获得更高的奖励。\n\
    \n`num_test_episodes = 10`\n`successes = 0`\n\nfor _ in range(num_test_episodes):\n\
    \    state = env.reset()[0]\n    done = False\n    while not done:\n        action\
    \ = np.argmax(Q_table[state, :])  # 选择最佳动作\n        state, reward, done, _, _\
    \ = env.step(action)\n        if reward == 1:\n            successes += 1\n\n\
    print(f\"智能体在 {num_test_episodes} 局游戏中成功了 {successes} 次。\")\n\n这个简单的强化学习智能体通过在多次迭代中优化其策略来学习如何在冰面上导航，展示了强化学习在解决序列决策问题中的强大力量。\n\
    \n## 结论\n\n强化学习（RL）允许智能体通过与环境交互并根据奖励优化动作来学习。通过实现 Q-learning 和深度 Q 网络（DQN），我们展示了如何应用\
    \ RL 来解决序列决策问题。通过反馈不断改进策略，强化学习智能体可以应对广泛的现实世界应用，从机器人到金融建模。\n"
