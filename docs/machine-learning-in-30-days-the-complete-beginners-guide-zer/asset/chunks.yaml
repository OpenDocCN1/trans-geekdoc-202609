    ### 2\. Underfitting


    Issue: The model is too simple to capture patterns in the data. Fix:


    *   Increase model complexity (add more layers in neural networks).


    *   Train for more epochs.


    *   Use feature engineering to improve input data quality.


    ### 3\. Data Leakage


    Issue: The training data contains information from the test set, leading to unrealistic
    accuracy. Fix:


    *   Ensure a proper train-test split before model training.


    *   Avoid using future data as features.


    *   Perform cross-validation properly.


    ### 4\. Imbalanced Classes


    Issue: The dataset contains significantly more instances of one class than the
    other. Fix:


    *   Use oversampling (SMOTE) or undersampling techniques.


    *   Assign class weights during model training.


    *   Use evaluation metrics like F1-score and AUC-ROC instead of accuracy.


    ### 5\. Slow Training Time


    Issue: Model training takes too long, making experimentation difficult. Fix:


    *   Optimize model architecture and hyperparameters.


    *   Use GPU acceleration for deep learning.


    *   Apply distributed training for large-scale datasets.


    ## Interview Questions for Beginners


    Preparing for ML job interviews? Here are some fundamental questions:


    ### General Machine Learning Questions


    1.  What is the difference between supervised, unsupervised, and reinforcement
    learning?


    2.  Explain the bias-variance tradeoff.


    3.  What is cross-validation, and why is it important?


    4.  What is the purpose of feature selection, and how do you perform it?


    5.  What are the differences between L1 and L2 regularization?


    6.  Explain precision, recall, and F1-score.


    7.  What is gradient descent, and how does it work?


    ### Deep Learning Questions


    1.  What are activation functions, and why are they important?


    2.  Explain convolutional neural networks (CNNs) and their use cases.


    3.  What is the difference between LSTMs and GRUs?


    4.  What is transfer learning, and when should you use it?


    5.  How does batch normalization improve deep learning models?


