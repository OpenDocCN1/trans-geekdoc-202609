- raw: "Structured data refers to information that is organized in a fixed format,\
    \ typically in tables, spreadsheets, or relational databases. It follows a predefined\
    \ schema with rows and columns, making it easy to store, query, and analyze using\
    \ database management systems and analytical tools.\n\nExamples of structured\
    \ data:\n\n*   Customer transaction records in a retail store\n\n*   Employee\
    \ databases containing names, salaries, and job titles\n\n*   Financial statements\
    \ showing revenues and expenses\n\nStructured data is advantageous for machine\
    \ learning as it can be easily manipulated using programming languages like Python,\
    \ SQL, and libraries such as Pandas and NumPy.\n\n### Unstructured Data\n\nUnstructured\
    \ data, on the other hand, lacks a predefined format and does not fit neatly into\
    \ tables or relational databases. It includes text, images, audio, and video files.\
    \ Processing unstructured data requires specialized techniques, including natural\
    \ language processing (NLP) for text, computer vision for images, and speech recognition\
    \ for audio.\n\nExamples of unstructured data:\n\n*   Social media posts, emails,\
    \ and chat messages\n\n*   Medical imaging scans such as X-rays and MRIs\n\n*\
    \   Audio recordings and speech transcriptions\n\nHandling unstructured data often\
    \ involves feature extraction and transformation techniques to convert the raw\
    \ data into a structured format suitable for machine learning models.\n\n## Handling\
    \ Missing Data\n\nIn real-world datasets, missing values are a common issue and\
    \ must be handled carefully to prevent bias or inaccurate predictions. There are\
    \ several techniques to deal with missing data, depending on the context and severity\
    \ of the problem.\n\n### Methods to Handle Missing Data\n\n1.  Removing Missing\
    \ Data: If a dataset contains a few missing values that do not significantly impact\
    \ the analysis, removing rows or columns with missing data can be a straightforward\
    \ approach. However, this may result in the loss of valuable information if done\
    \ excessively.\n\nimport pandas as pd\n\ndf = pd.read\\_csv(\"data.csv\")\n\n\
    df\\_cleaned = df.dropna()  # Remove rows with missing values\n\n2.  Imputation\
    \ (Filling Missing Values): Instead of removing missing data, we can fill in the\
    \ gaps with meaningful values. This can be done using:\n\n    *   Mean or median\
    \ imputation for numerical data\n\n    *   Mode (most frequent value) for categorical\
    \ data\n\n    *   Forward fill (using previous values) or backward fill (using\
    \ next values) for time-series data\n\ndf\\[\"Age\"\\].fillna(df\\[\"Age\"\\].mean(),\
    \ inplace=True)  # Fill missing ages with the mean\n\n3.  Using Machine Learning\
    \ Models for Imputation: In some cases, missing values can be predicted using\
    \ machine learning models trained on existing data. Algorithms such as k-nearest\
    \ neighbors (KNN) or regression models can estimate missing values based on known\
    \ patterns.\n\nfrom sklearn.impute import KNNImputer\n\nimputer = KNNImputer(n\\\
    _neighbors=3)\n\ndf\\_imputed = pd.DataFrame(imputer.fit\\_transform(df))\n\n\
    ## Data Cleaning and Transformation\n\nOnce missing values are handled, further\
    \ data cleaning and transformation steps are necessary to prepare the dataset\
    \ for machine learning models.\n\n### Removing Duplicates\n\nDuplicate records\
    \ can distort analysis and should be removed to maintain data integrity.\n\ndf.drop\\\
    _duplicates(inplace=True)\n\n### Handling Outliers\n\nOutliers are extreme values\
    \ that deviate significantly from the dataset's overall distribution. Outliers\
    \ can skew model predictions and should be treated appropriately.\n\nimport numpy\
    \ as np\n\nz\\_scores = np.abs((df\\[\"Salary\"\\] - df\\[\"Salary\"\\].mean())\
    \ / df\\[\"Salary\"\\].std())\n\ndf\\_no\\_outliers = df\\[z\\_scores < 3\\] \
    \ # Keeping values within 3 standard deviations\n\n### Encoding Categorical Data\n\
    \nMachine learning models require numerical inputs, so categorical variables must\
    \ be converted into numerical representations. Two common encoding techniques\
    \ are:\n\n*   One-Hot Encoding (for nominal categorical variables, where no order\
    \ exists)\n\ndf = pd.get\\_dummies(df, columns=\\[\"Gender\"\\])  # Converts 'Male'\
    \ and 'Female' into binary columns\n\n*   Label Encoding (for ordinal categorical\
    \ variables, where order matters)\n\nfrom sklearn.preprocessing import LabelEncoder\n\
    \nencoder = LabelEncoder()\n\ndf\\[\"Education\\_Level\"\\] = encoder.fit\\_transform(df\\\
    [\"Education\\_Level\"\\])\n\n### Feature Scaling\n\nFeature scaling ensures that\
    \ numerical variables are in the same range, preventing features with large values\
    \ from dominating the learning process. Two common techniques are:\n\n*   Standardization\
    \ (Z-score normalization)\n\nfrom sklearn.preprocessing import StandardScaler\n\
    \nscaler = StandardScaler()\n\ndf\\_scaled = scaler.fit\\_transform(df)\n\n* \
    \  Min-Max Scaling (Rescaling values between 0 and 1)\n\nfrom sklearn.preprocessing\
    \ import MinMaxScaler\n\nscaler = MinMaxScaler()\n\ndf\\_scaled = scaler.fit\\\
    _transform(df)\n\n## Example: Filling Missing Values in a Dataset Using Pandas\n\
    \nLet’s consider an example where we load a dataset, identify missing values,\
    \ and use imputation techniques to fill in the missing data.\n\nimport pandas\
    \ as pd\n\nimport numpy as np\n\n\\# Creating a sample dataset with missing values\n\
    \ndata = {\n\n'Name': \\['Alice', 'Bob', 'Charlie', 'David', 'Eve'\\],\n\n'Age':\
    \ \\[25, np.nan, 30, np.nan, 40\\],\n\n'Salary': \\[50000, 60000, np.nan, 80000,\
    \ 90000\\]\n\n}\n\ndf = pd.DataFrame(data)\n\nprint(\"Original Dataset:\")\n\n\
    print(df)\n\n\\# Filling missing values with the mean of respective columns\n\n\
    df\\['Age'\\].fillna(df\\['Age'\\].mean(), inplace=True)\n\ndf\\['Salary'\\].fillna(df\\\
    ['Salary'\\].median(), inplace=True)\n\nprint(\"\\\\nDataset after handling missing\
    \ values:\")\n\nprint(df)\n\n## Conclusion\n\nUnderstanding data and applying\
    \ proper preprocessing techniques are critical steps in building high-performance\
    \ machine learning models. Handling missing values, cleaning and transforming\
    \ data, encoding categorical variables, and scaling numerical features improve\
    \ model accuracy and reliability. By mastering these techniques, you create a\
    \ solid foundation for effective machine learning projects.\n\n# Day 4: Exploratory\
    \ Data Analysis (EDA)\n\nExploratory Data Analysis (EDA) is one of the most crucial\
    \ steps in any data science and machine learning project. It involves understanding\
    \ the dataset by summarizing its key characteristics, visualizing trends, identifying\
    \ patterns, and detecting anomalies. Performing EDA allows data scientists to\
    \ make informed decisions before building machine learning models, ensuring that\
    \ the dataset is clean, well-structured, and prepared for analysis.\n\n![C:\\\\\
    Users\\\\anike\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\INetCache\\\\Content.MSO\\\
    \\B796C839.tmp](image_rsrc400.jpg)\n\nEDA is essential because raw data is often\
    \ messy, containing missing values, duplicate entries, or outliers that can significantly\
    \ affect the performance of machine learning models. By performing EDA, we can\
    \ identify and rectify such issues, leading to better model accuracy and insights.\n\
    \n## Visualizing Data with Matplotlib and Seaborn\n\nVisualization plays a crucial\
    \ role in EDA by allowing us to see trends, distributions, and relationships between\
    \ variables. Two of the most powerful libraries in Python for data visualization\
    \ are Matplotlib and Seaborn.\n\n### Matplotlib: The Foundation of Data Visualization\n\
    \nMatplotlib is a widely used visualization library that enables the creation\
    \ of static, animated, and interactive plots in Python. It provides fine-grained\
    \ control over visual elements, making it an excellent tool for producing high-quality\
    \ graphs and charts.\n\n#### Example: Creating a Simple Line Plot with Matplotlib\n\
    \nimport matplotlib.pyplot as plt\n\n\\# Sample Data\n\nyears = \\[2015, 2016,\
    \ 2017, 2018, 2019, 2020\\]\n\nsales = \\[500, 700, 800, 950, 1100, 1300\\]\n\n\
    \\# Creating the plot\n\nplt.plot(years, sales, marker='o', linestyle='-', color='b')\n\
    \nplt.xlabel('Year')\n\nplt.ylabel('Sales')\n\nplt.title('Sales Growth Over the\
    \ Years')\n\nplt.grid()\n\nplt.show()\n\n### Seaborn: High-Level Statistical Visualization"
