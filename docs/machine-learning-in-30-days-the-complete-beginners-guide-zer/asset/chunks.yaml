    \ 300, 50),\n    'max_depth': [None, 10, 20, 30],\n    'min_samples_split': [2,\
    \ 5, 10]\n}\n\n# 执行随机搜索\nrandom_search = RandomizedSearchCV(RandomForestClassifier(),\
    \ param_distributions=param_dist, n_iter=10, cv=3, scoring='accuracy', random_state=42)\n\
    random_search.fit(X_train, y_train)\n\n# 显示最佳参数\nprint(\"Best Parameters:\", random_search.best_params_)\n\
    ```\n\n随机搜索对于具有大量超参数的模型特别有用，因为它在探索范围和效率之间提供了良好的平衡。\n\n## 示例：为随机森林模型寻找最佳超参数\n\n\
    现在，让我们比较网格搜索（Grid Search）和随机搜索（Random Search）来优化随机森林模型。\n\n### 从网格搜索训练最佳模型\n\n\
    ```python\nbest_grid_model = grid_search.best_estimator_\nbest_grid_model.fit(X_train,\
    \ y_train)\ny_pred_grid = best_grid_model.predict(X_test)\naccuracy_grid = accuracy_score(y_test,\
    \ y_pred_grid)\nprint(f\"Grid Search Model Accuracy: {accuracy_grid:.2f}\")\n\
    ```\n\n### 从随机搜索训练最佳模型\n\n```python\nbest_random_model = random_search.best_estimator_\n\
    best_random_model.fit(X_train, y_train)\ny_pred_random = best_random_model.predict(X_test)\n\
    accuracy_random = accuracy_score(y_test, y_pred_random)\nprint(f\"Random Search\
