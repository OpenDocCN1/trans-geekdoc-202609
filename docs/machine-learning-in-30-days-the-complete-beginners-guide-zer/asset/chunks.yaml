    \ 8), cmap='gray')\n    axes[i].set_title(f\"Pred: {y_pred[i]}\")\n    axes[i].axis('off')\n\
    plt.show()\n```\n这种可视化有助于验证模型是否正确分类了手写数字。\n\n# 第 1 天：聚类引言\n聚类（Clustering）是机器学习中的一种无监督学习，根据相似性对数据点进行分组。与需要标签的分类不同，聚类算法通过识别模式和形成聚类来发现数据集中的内在结构。\n\
    \n聚类广泛应用于各个行业，用于市场细分、异常检测等。最流行的聚类技术是 K-Means 聚类和层次聚类。\n\n## K-Means 聚类\nK-Means\
    \ 聚类由于其简单高效，是最广泛广泛的算法之一。它将数据集划分为 `K` 个不同的、不重叠的簇，每个数据点都属于与其均值最近的簇。\n\n### K-Means\
    \ 工作原理：\n1. 在数据空间内随机初始化 `K` 个质心。\n2. 根据欧式距离将每个数据点分配给最近的质心。\n3. 通过计算分配给每个簇的所有点的平均来重新计算质心。\n\
    4. 重复步骤 2-3，直到质心不再变化或达到预定义的迭代限制。\n\n### 在 Python 中实现 K-Means\n```python\nimport\
    \ numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.cluster\
    \ import KMeans\nfrom sklearn.datasets import make_blobs\n\n# 生成合成数据集\nX, y =\
    \ make_blobs(n_samples=300, centers=4, cluster_std=0.6, random_state=42)\n\n#\
    \ 应用 K-Means 聚类\nkmeans = KMeans(n_clusters=4, random_state=42)\nkmeans.fit(X)\n\
    labels = kmeans.labels_\ncentroids = kmeans.cluster_centers_\n\n# 可视化聚类结果\nplt.scatter(X[:,\
    \ 0], X[:, 1], c=labels, cmap='viridis', alpha=0.6)\nplt.scatter(centroids[:,\
    \ 0], centroids[:, 1], marker='X', s=200, c='red', label='Centroids')\nplt.title(\"\
    K-Means Clustering\")\nplt.legend()\nplt.show()\n```\n\n## 层次聚类\n与 K-Means 不同，层次聚类可以在不指定簇数量的情况下创建层次结构。主要有两种：\n\
    \n1. **凝聚聚类（Agglomerative Clustering，自底而上）：**\n   - 每个数据点开始作为一个簇。\n   - 根据相似性迭代合并簇。\n\
    \   - 过程持续直到所有数据点聚为一个一类。\n2. **分裂聚类（Divisive Clustering，自顶而下）：**\n   - 从包含所有数据点的单一大簇开始。\n\
    \   - 迭代地将簇分成更小的子簇。\n   - 过程直到每个数据点都是自己的簇。\n\n### 在 Python 中实现层次聚类\n```python\n\
    from scipy.cluster.hierarchy import dendrogram, linkage\nfrom sklearn.cluster\
    \ import AgglomerativeClustering\n\n# 计算层次连接\nlinked = linkage(X, method='ward')\n\
    \n# 绘制树图\nplt.figure(figsize=(10, 5))\ndendrogram(linked)\nplt.title(\"Hierarchical\
    \ Clustering Dendrogram\")\nplt.xlabel(\"Data Points\")\nplt.ylabel(\"Distance\"\
    )\nplt.show()\n```\n\n## 聚类的现实世界应用\n聚类应用于许多领域，帮助组织从数据中获取意义的见解。常见应用包括：\n\n1. **营销中的客户细分**\n\
    \   - 根据购买行为、人口统计数据或偏好对客户进行分组。\n   - 有助于目标广告和个性化营销活动。\n2. **网络安全中的异常检测**\n   -\
    \ 通过检测网络流量中的异常行为识别欺诈活动或安全威胁。\n   - 用于金融欺诈、垃圾邮件过滤和网络入侵检测。\n3. **文档分类与主题建模**\n \
    \  - 将相似的文章、研究论文或新闻内容归类，便于检索。\n   - 用于推荐系统和搜索引擎。\n4. **医学诊断与疾病检测**\n   - 根据症状和病史对患者数据进行聚类，以识别疾病模式。\n\
    \   - 有助于诊断罕见病。\n\n"
