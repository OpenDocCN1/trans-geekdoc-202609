    \ 对手写数字分类\ndigits 数据集包含手写数字（0-9）的图像，我们可以使用 KNN 根据像素强度对它们进行分类。\n\n### 步骤 1：加载并可视化数据集\n\
    ```python\nimport matplotlib.pyplot as plt\nimport numpy as np\nfrom sklearn.datasets\
