    # Appendix


    ## ML Cheat Sheet


    Having a quick reference guide can be incredibly helpful when working on machine
    learning projects. Below are some essential concepts, formulas, and techniques:


    ### Common ML Algorithms


    *   Linear Regression – Predicts continuous values using a linear relationship
    between variables.


    *   Logistic Regression – Used for binary classification problems.


    *   Decision Trees – Models decisions based on feature splits.


    *   Random Forest – Ensemble learning method that combines multiple decision trees.


    *   Support Vector Machines (SVMs) – Finds the optimal boundary for classification.


    *   k-Nearest Neighbors (KNN) – A non-parametric algorithm used for classification
    and regression.


    *   Neural Networks – Inspired by the human brain, used for deep learning tasks.


    ### Key ML Formulas


    *   Mean Squared Error (MSE): ![](image_rsrc412.jpg)


    *   Log Loss (Binary Classification): ![](image_rsrc413.jpg)


    *   Gradient Descent Update Rule: ![](image_rsrc414.jpg)


    ### Feature Engineering Best Practices


    *   Normalize or standardize numerical features.


    *   Convert categorical features into numerical values (one-hot encoding, label
    encoding).


    *   Handle missing values using imputation techniques.


    *   Remove correlated features to reduce redundancy.


    ## Common ML Errors and Fixes


    Even experienced ML practitioners encounter issues when training models. Below
    are some common errors and their solutions:


    ### 1\. Overfitting


    Issue: The model performs well on training data but poorly on unseen data. Fix:


    *   Use more training data if possible.


    *   Apply L1/L2 regularization to reduce model complexity.


    *   Use dropout layers in neural networks.'
