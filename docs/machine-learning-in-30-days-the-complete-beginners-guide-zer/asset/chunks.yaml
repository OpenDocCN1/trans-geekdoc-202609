    \ detects specific attributes like horizontal or vertical edges.\n\n2.  Pooling\
    \ Layers:\n\n    *   Reduce the dimensionality of feature maps while preserving\
    \ essential information.\n\n    *   Max pooling retains the most important features\
    \ by selecting the maximum value in a small region.\n\n3.  Fully Connected Layers:"
