    ### 2. 欠拟合


    问题：模型太简单，无法捕捉数据中的模式。解决方法：

    - 增加模型复杂度（在神经网络中添加更多层）。

    - 增加训练轮数（epochs）。

    - 使用特征工程来提高输入数据的质量。


    ### 3. 数据泄露


    问题：训练数据包含来自测试集的信息，导致准确率不切实际。解决方法：

    - 在模型训练前确保进行适当的训练-测试划分。

    - 避免使用未来数据作为特征。

    - 正确执行交叉验证。


    ### 4. 类别不平衡


    问题：数据集中某一类的实例远多于另一类。解决方法：

    - 使用过采样（`SMOTE`）或欠采样技术。

    - 在模型训练期间分配类别权重。

    - 使用 `F1-score` 和 `AUC-ROC` 等评估指标代替准确率。


    ### 5. 训练时间过长


    问题：模型训练耗时过长，导致实验难以进行。解决方法：

    - 优化模型架构和超参数。

    - 在深度学习中使用 GPU 加速。

    - 针对大规模数据集应用分布式训练。


