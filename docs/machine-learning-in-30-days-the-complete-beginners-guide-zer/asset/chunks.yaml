    # Day 15: Introduction to Model Evaluation and Hyperparameter Tuning


    ## Train-Test Split and Cross-Validation


    Evaluating machine learning models effectively is a crucial step in ensuring their
    generalization and robustness when applied to new, unseen data. A well-evaluated
    model ensures that it does not just memorize training data but can make accurate
    predictions in real-world scenarios. Two of the most commonly used techniques
    for assessing a model’s performance are Train-Test Split and Cross-Validation,
    both of which play a pivotal role in estimating how well a model will perform
    on new inputs.


    ![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\DB6BE064.tmp](image_rsrc40J.jpg)


    ### Train-Test Split


    The Train-Test Split method divides a dataset into two distinct subsets:


    1.  Training Set – Used to train the model by learning patterns and relationships
    from the data.


    2.  Testing Set – Used to evaluate how well the trained model performs on unseen
    data.


    A typical ratio for splitting data is 80-20, where 80% of the dataset is used
    for training and the remaining 20% is reserved for testing. This approach helps
    ensure that the model has been exposed to sufficient data for learning while also
    having a separate portion for validation.


    #### Implementing Train-Test Split in Python


    from sklearn.model\_selection import train\_test\_split


    from sklearn.ensemble import RandomForestClassifier


    from sklearn.metrics import accuracy\_score


    import pandas as pd


    \# Load example dataset


    df = pd.read\_csv("dataset.csv")


    X = df.drop("target", axis=1)


    y = df\["target"\]


    \# Split data into training and testing sets


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.2,
    random\_state=42)


    \# Train a simple model


    model = RandomForestClassifier()


    model.fit(X\_train, y\_train)


    \# Evaluate model performance


    y\_pred = model.predict(X\_test)


    accuracy = accuracy\_score(y\_test, y\_pred)


    print(f"Model Accuracy: {accuracy:.2f}")


    While Train-Test Split is simple and effective, it may introduce high variance
    in small datasets, where the performance of the model can depend heavily on which
    data points fall into the training or testing set. To mitigate this issue and
    achieve a more reliable estimate of performance, we use Cross-Validation.


    ### Cross-Validation


    Cross-validation (CV) is a technique that enhances model evaluation by splitting
    the dataset multiple times into training and testing subsets, ensuring that every
    data point gets a chance to be in the testing set. This approach provides a more
    reliable estimate of model performance, helping to avoid issues such as overfitting
    or underfitting.


    The most commonly used method is K-Fold Cross-Validation, which works as follows:


    *   The dataset is divided into K subsets (folds).


    *   The model is trained on K-1 folds and tested on the remaining fold.


    *   This process is repeated K times, with a different fold used for testing in
    each iteration.


    *   The final model accuracy is the average performance across all K iterations.


    #### Implementing K-Fold Cross-Validation


    from sklearn.model\_selection import cross\_val\_score


    \# Perform 5-Fold Cross-Validation


    cv\_scores = cross\_val\_score(model, X, y, cv=5, scoring=''accuracy'')


    print(f"Cross-Validation Accuracy: {cv\_scores.mean():.2f}")


    By using Cross-Validation, we obtain a more stable estimate of our model’s performance,
    reducing the likelihood of overfitting.


    ## Hyperparameter Tuning with Grid Search and Random Search


    Every machine learning model has hyperparameters, which control its behavior and
    significantly impact performance. Instead of setting these values arbitrarily,
    we use Hyperparameter Tuning techniques to systematically explore different configurations
    and find the optimal combination.


    ### Grid Search


    Grid Search is an exhaustive method that systematically evaluates all possible
    combinations of hyperparameters in a predefined grid. This approach guarantees
    finding the best configuration but can be computationally expensive for models
    with many hyperparameters.


    #### Implementing Grid Search for Random Forest


    from sklearn.model\_selection import GridSearchCV


    \# Define hyperparameter grid


    param\_grid = {


    ''n\_estimators'': \[50, 100, 200\],


    ''max\_depth'': \[5, 10, 20\],


    ''min\_samples\_split'': \[2, 5, 10\]


    }


    \# Perform Grid Search


    grid\_search = GridSearchCV(RandomForestClassifier(), param\_grid, cv=3, scoring=''accuracy'')


    grid\_search.fit(X\_train, y\_train)


    \# Display best parameters


    print("Best Parameters:", grid\_search.best\_params\_)


    While Grid Search is effective, it becomes computationally infeasible when dealing
    with a large number of hyperparameters. In such cases, Random Search offers a
    more efficient alternative.


    ### Random Search


    Random Search selects hyperparameter combinations randomly from a defined range,
    reducing computational cost while still exploring a diverse set of configurations.'
