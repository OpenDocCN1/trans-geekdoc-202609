    )\nprices = df['Close'].values.reshape(-1,1)\n\n# Normalize the data\nscaler =\
    \ MinMaxScaler()\nprices_scaled = scaler.fit_transform(prices)\n```\n\n### Step\
    \ 2: Prepare Training Data\n\n```python\ndef create_sequences(data, seq_length):\n\
    \    X, y = [], []\n    for i in range(len(data) - seq_length):\n        X.append(data[i:i+seq_length])\n\
    \        y.append(data[i+seq_length])\n    return np.array(X), np.array(y)\n\n\
    seq_length = 10  # Using 10 days of data to predict the next day's price\nX, y\
    \ = create_sequences(prices_scaled, seq_length)\n```\n\n### Step 3: Define the\
    \ LSTM Model\n\n```python\nmodel = keras.Sequential([\n    keras.layers.LSTM(50,\
    \ return_sequences=True, input_shape=(seq_length, 1)),\n    keras.layers.LSTM(50,\
    \ return_sequences=False),\n    keras.layers.Dense(25),\n    keras.layers.Dense(1)\n\
    ])\nmodel.compile(optimizer='adam', loss='mean_squared_error')\n```\n\n### Step\
    \ 4: Train the Model\n\n```python\nmodel.fit(X, y, epochs=50, batch_size=16, verbose=1)\n\
    ```\n\n### Step 5: Making Predictions\n\n```python\npredicted_prices = model.predict(X)\n\
    predicted_prices = scaler.inverse_transform(predicted_prices)  # Convert back\
    \ to original scale\n```\n\n### Step 6: Visualizing Predictions\n\n```python\n\
    import matplotlib.pyplot as plt\nplt.figure(figsize=(10,6))\nplt.plot(df.index[seq_length:],\
    \ predicted_prices, label=\"Predicted Prices\")\nplt.plot(df.index[seq_length:],\
    \ prices[seq_length:], label=\"Actual Prices\")\nplt.xlabel(\"Days\")\nplt.ylabel(\"\
    Stock Price\")\nplt.legend()\n```\n"
  trans: "\n\n虽然标准的 `RNNs` 在处理长期依赖方面表现得吃力，但 `LSTMs`（长短期记忆）和 `GRUs`（门控循环单元）通过引入调节信息流的门控机制，能够有效地处理更长的序列。\n\
    \n### LSTMs（长短期记忆）\n\n`LSTMs` 引入了调节信息流的门控：\n\n* `Forget Gate`（遗忘门）：决定从单元状态丢弃哪些信息。\n\
    * `Input Gate`（输入门）：决定将哪些新信息存储在单元状态中。\n* `Output Gate`（输出门）：控制传递到下一步的信息，确保只保留相关的细节。\n\
    \n### GRUs（门控循环单元）\n\n`GRUs` 是 `LSTMs` 的简化版本，只有两个门（`reset` 门和 `update` 门），这使得它们在保持许多序列建模任务有效性的同时，计算速度更快。`GRUs`\
    \ 的性能通常与 `LSTMs` 相当，但所需的参数更少，因此成为某些应用中的优选。\n\n## 示例：使用 LSTM 预测股票价格\n\n`LSTMs`\
    \ 广泛应用于时间序列预测，例如根据历史数据预测股票价格。此示例演示了 `LSTMs` 如何捕捉时间模式以做出未来预测。\n\n### 步骤 1：加载并预处理股票数据\n\
    \n```python\nimport pandas as pd\nfrom sklearn.preprocessing import MinMaxScaler\n\
    \n# 加载数据集\ndf = pd.read_csv(\"stock_prices.csv\")\nprices = df['Close'].values.reshape(-1,1)\n\
    \n# 数据归一化\nscaler = MinMaxScaler()\nprices_scaled = scaler.fit_transform(prices)\n\
    ```\n\n### 步骤 2：准备训练数据\n\n```python\ndef create_sequences(data, seq_length):\n\
    \    X, y = [], []\n    for i in range(len(data) - seq_length):\n        X.append(data[i:i+seq_length])\n\
    \        y.append(data[i+seq_length])\n    return np.array(X), np.array(y)\n\n\
    seq_length = 10  # 使用 10 天的数据预测次天的价格\nX, y = create_sequences(prices_scaled, seq_length)\n\
    ```\n\n### 步骤 3：定义 LSTM 模型\n\n```python\nmodel = keras.Sequential([\n    keras.layers.LSTM(50,\
    \ return_sequences=True, input_shape=(seq_length, 1)),\n    keras.layers.LSTM(50,\
    \ return_sequences=False),\n    keras.layers.Dense(25),\n    keras.layers.Dense(1)\n\
    ])\nmodel.compile(optimizer='adam', loss='mean_squared_error')\n```\n\n### 步骤\
    \ 4：训练模型\n\n```python\nmodel.fit(X, y, epochs=50, batch_size=16, verbose=1)\n\
    ```\n\n### 步骤 5：进行预测\n\n```python\npredicted_prices = model.predict(X)\npredicted_prices\
    \ = scaler.inverse_transform(predicted_prices)  # 转换原始比例\n```\n\n### 步骤 6：可视化预测\n\
    \n```python\nimport matplotlib.pyplot as plt\nplt.figure(figsize=(10,6))\nplt.plot(df.index[seq_length:],\
    \ predicted_prices, label=\"Predicted Prices\")\nplt.plot(df.index[seq_length:],\
    \ prices[seq_length:], label=\"Actual Prices\")\nplt.xlabel(\"Days\")\nplt.ylabel(\"\
    Stock Price\")\nplt.legend()\n```\n\n"
