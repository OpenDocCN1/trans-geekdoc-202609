    \n    print(f\"Tweet: {tweet}\\nPredicted Sentiment: {label}\\n\")\n```\n\n##\
    \ 结论\n\n自然语言处理（NLP）使机器能够理解、处理和分析人类语言。在本章中，我们探索了分词、词干提取和词形还原，随后介绍了情感分析和文本分类。最后，我们实现了一个实中\
    \ Twitter 情感分析的真实案例，展示了 NLP 在分析社交媒体趋势方面的力量。在下一章中，我们将探索主题建模和命名实体识别（NER），这些技术有助于从非结构化文本数据中提取有价值的见解。\n\
    \n# 第 22 天：生成式 AI 与 Transformer 简介\n\n## 理解生成式 AI\n\n生成式 AI 是人工智能领域内一个快速发展的领域，侧重于创建新数据，而不仅仅是分析或分类现有数据。它使用机器学习模型来生成文本、图像、音乐、视频和其他模仿人类创造力的内容。生成式\
    \ AI 模型在文本生成、图像合成、视频创建、代码生成甚至药物发现等应用中特别有用。\n\n![C:\\Users\\anike\\AppData\\Local\\\
    Microsoft\\Windows\\INetCache\\Content.MSO\\50516696.tmp](img/image_rsrc40V.jpg)\n\
    \n### 生成式 AI 的主要应用：\n\n1. **文本生成**：为聊天机器人、内容创作和自动化故事生成类人文本。\n2. **图像合成**：使用 `DALL·E`\
    \ 和 `Stable Diffusion` 等模型创建真实的图像。\n3. **音乐作曲**：基于音符模式生成的 AI 作曲。\n4. **代码生成**：通过\
    \ `GitHub Copilot` 等 AI 驱动的编程助手实现编程。\n5. **药物发现**：为药物研究生成分子结构。\n\n生成式 AI 由深度学习架构驱动，特别是基于\
    \ Transformer 的模型，这些模型彻底改变了自然语言处理和内容生成领域。\n\n## Transformer 模型基础 (GPT, BERT)\n\
    \nTransformer 是一类深度学习模型，彻底改变了 NLP 和 AI 生成的内容。与顺序处理文本的传统模型不同，Transformer 使用自注意力机制一次性处理整个句子，使其能够捕捉文本中的长距离依赖和上下文关系。\n\
    \n### Transformer 的工作原理：\n\n1. **自注意力机制（Self-Attention Mechanism）**：使模型关注句子的不同部分。\n\
    2. **位置编码（Positional Encoding）**：由于 Transformer 并行处理标记，它保持了词的顺序。\n3. **多头注意力（Multi-Head\
    \ Attention）**：允许模型同时关注不同类型的信息。\n\n### 流行的 Transformer 模型：\n\n- **GPT（生成式预训练 Transformer）**：用于文本生成和聊天机器人。\n\
    - **BERT（基于 Transformer 的双向编码器表示）**：用于情感分析和分类。\n\n## 使用 Hugging Face 实现文本生成\n\n\
    Hugging Face 提供了一个易于使用的 `transformers` 库来实现强大的模型。\n\n### 第一 步：安装并导入库\n\n```bash\n\
    !pip install transformers\nfrom transformers import pipeline\n```\n\n### 第二 步：加载预训练模型\n\
    \n```python\n# 加载 GPT-2 模型\ntext_generator = pipeline(\"text-generation\", model=\"\
    gpt2\")\n```\n\n### 第三 步：生成文本\n\n```python\nprompt = \"Once upon a time,\"\ngenerated_text\
    \ = text_generator(prompt, max_length=50)\nprint(generated_text)\n```\n\n## 使用\
    \ GPT-2 生成文本示例\n\n为了进一步探索生成能力，让我们实现一个根据用户输入生成故事的程序。\n\n### 第一 步：定义故事生成函数\n\n```python\n\
    def generate_story(prompt, length=100):\n    generated = text_generator(prompt,\
    \ max_length=length, num_return_sequences=1)\n    return generated[0]['generated_text']\n\
    ```\n\n### 第二 步：提供自定义提示\n\n```python\nstory_prompt = \"In a hidden kingdom beneath\
    \ the ocean, there lived a mysterious creature who could predict the future.\"\
    \nprint(generate_story(story_prompt))\n```\n\n### 第三 步：针对特定场景微调模型\n\n为了提高生成文本的质量和相关性，你可以针对自定义数据对\
    \ GPT-2 进行微调。\n\n```python\nfrom transformers import GPT2Tokenizer, GPT2LMHeadModel\n\
    import torch\n\n# 加载预训练模型和分词器\nmodel = GPT2LMHeadModel.from_pretrained(\"gpt2\"\
    )\ntokenizer = GPT2Tokenizer.from_pretrained(\"gpt2\")\n\n# 准备输入文本\ntokenized_input\
    \ = tokenizer.encode(\"Custom training data goes here\", return_tensors=\"pt\"\
    )\n\n# 使用模型生成文本\noutput = model.generate(tokenized_input, max_length=100)\nprint(tokenizer.decode(output[0],\
    \ skip_special_tokens=True))\n```\n\n## 结论\n\n生成式 AI 和 Transformer 模型重新定义了机器交互和创建人类内容的方式。从使用\
    \ `GPT` 进行文本生成到使用 `BERT` 进行高级语言理解，这些模型正在改变内容创作、客户支持和自动化故事生成等各个行业。在本章中，我们探索了生成式\
    \ AI 的基础知识、Transformer 的工作原理，并使用 Hugging Face 的 `transformers` 库实现了 GPT-2 的文本生成。\n\
    \n"
