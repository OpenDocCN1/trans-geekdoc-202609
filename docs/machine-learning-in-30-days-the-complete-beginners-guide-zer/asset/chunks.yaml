    3.  输出层：根据学习到的表表示产生最终预测。\n4.  激活函数：引入非线性，使网络能够捕捉数据内部的复杂关系。\n5.  损失函数：衡量网络预测值与实际标签的匹配程度，引导训练过程。\n\
