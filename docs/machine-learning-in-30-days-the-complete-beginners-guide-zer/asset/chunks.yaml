    \n# Day 25: Debugging and Optimizing ML Models\n\n## Identifying Overfitting and\
    \ Underfitting\n\nOne of the biggest challenges in machine learning is ensuring\
    \ that a model generalizes well to unseen data. Two common problems that arise\
    \ in this context are overfitting and underfitting. These issues significantly\
    \ impact model performance and must be diagnosed early in the training process.\n\
    \n![C:\\\\Users\\\\anike\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\INetCache\\\
    \\Content.MSO\\\\139DBA0.tmp](image_rsrc40Y.jpg)\n\n### Overfitting\n\nOverfitting\
    \ occurs when a model learns the training data too well, including noise and outliers,\
    \ making it fail on new data. The model exhibits high accuracy on training data\
    \ but poor accuracy on validation or test data.\n\n#### Symptoms of Overfitting\n\
    \n*   High training accuracy but low test accuracy.\n\n*   Large gap between training\
    \ and validation loss.\n\n*   Model performs poorly on unseen data.\n\n#### Solutions\
    \ to Overfitting\n\n1.  Reduce Model Complexity – Use simpler models with fewer\
    \ parameters.\n\n2.  Regularization Techniques – Apply L1 (Lasso) or L2 (Ridge)\
    \ regularization to penalize large weights.\n\n3.  Dropout in Neural Networks\
    \ – Randomly drop connections during training to prevent reliance on specific\
    \ neurons.\n\n4.  Increase Training Data – More data helps reduce variance and\
    \ prevents the model from memorizing training samples.\n\n5.  Early Stopping –\
    \ Monitor validation loss and stop training when it starts increasing.\n\n###\
    \ Underfitting\n\nUnderfitting occurs when a model is too simple to capture the\
    \ underlying patterns in data, leading to poor performance on both training and\
    \ test sets.\n\n#### Symptoms of Underfitting\n\n*   Low accuracy on both training\
    \ and test sets.\n\n*   Training and validation losses remain high.\n\n*   The\
    \ model fails to capture the complexity of the dataset.\n\n#### Solutions to Underfitting\n\
    \n1.  Increase Model Complexity – Use deeper neural networks or more sophisticated\
    \ models.\n\n2.  Feature Engineering – Extract better features to help the model\
    \ learn meaningful patterns.\n\n3.  Increase Training Time – Train the model for\
    \ more epochs.\n\n4.  Reduce Regularization Strength – Excessive regularization\
    \ may prevent the model from learning useful patterns.\n\n## Handling Imbalanced\
    \ Data\n\nImbalanced data is a common problem in classification tasks where one\
    \ class is significantly more frequent than another. This can lead to biased models\
    \ that favor the dominant class and ignore minority cases.\n\n### Techniques to\
    \ Handle Imbalanced Data\n\n1.  Resampling Methods\n\n    *   Oversampling the\
    \ minority class: Duplicate or generate synthetic examples using techniques like\
    \ SMOTE (Synthetic Minority Over-sampling Technique).\n\n    *   Undersampling\
    \ the majority class: Reduce the number of majority class examples to balance\
    \ the dataset.\n\n2.  Class Weight Adjustment\n\n    *   Assign higher weights\
    \ to the minority class during training so that misclassifications are penalized\
    \ more.\n\nfrom sklearn.utils.class\\_weight import compute\\_class\\_weight\n\
    \nclass\\_weights = compute\\_class\\_weight('balanced', classes=\\[0, 1\\], y=train\\\
    _labels)\n\nmodel.fit(X\\_train, y\\_train, class\\_weight=dict(enumerate(class\\\
    _weights)))"
