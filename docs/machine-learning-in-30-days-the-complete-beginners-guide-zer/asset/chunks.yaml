    \ 准确率 |\n| --- | --- | --- |\n| 网格搜索 | 优化后的参数 | ~XX% |\n| 随机搜索 | 优化后的参数 | ~XX%\
    \ |\n\n通过微调超参数，我们可以显著提高模型的准确率和整体性能。\n\n## 结论\n\n模型评估和超参数调优是机器学习流程中的关键步骤，可确保最佳性能。训练-测试划分和交叉验证提供了准确率的稳健估计，而网格搜索和随机搜索有助于识别最佳超参数配置。通过利用这些技术，我们可以开发出高度优化且可靠的机器学习模型。\n\
    \n# 第 16 天：人工神经网络 (ANN) 简介\n\n## 神经网络的基础\n\n人工神经网络（ANN）是现代深度学习的基础，旨在模拟人类大脑处理信息的方式。ANN\
    \ 由层连接的节点（神经元）组成，这些节点处理并从输入数据中学习。\n\n![C:\\Users\\anike\\AppData\\Local\\Microsoft\\\
    Windows\\INetCache\\Content.MSO\\B0D47812.tmp](img/image_rsrc40K.jpg)\n\n### 神经网络的结构：\n\
    \n1. 输入层：接收用于处理原始数据。\n2. 隐藏层：使用权重连接和激活函数对输入数据进行复杂的变换。\n3. 输出层：产生最终的预测或分类。\n\n\
    神经元之间的每个连接都有一个关联权重，它决定了连接的强度。网络在训练过程中调整这些权重以最小化误差并提高准确率。\n\n### 神经网络如何学习：\n\n\
    * 前向传播：数据从输入到输出通过网络传递。\n* 损失函数：衡量预测值与实际值之间的差异。\n* 反向传播：使用梯度下降调整权重以最小化损失函数。\n\n\
    ## 理解激活函数\n\n激活函数为神经网络引入了非线性，使其能够学习复杂的模式。如果没有激活函数，ANN 将表现得像简单的线性模型，限制了它们捕捉数据中关系的能力。\n\
    \n### 常见的激活函数：\n\n1. Sigmoid 函数：\n    * 将输入值映射到 0 到 1 之间的范围。\n    * 用于二分类问题。\n\
    \    * 公式：![](img/image_rsrc40M.jpg)\n2. ReLU（整流线性单元）：\n    * 将负值替换为零。\n    *\
    \ 有助于防止梯度消失问题。\n    * 公式：![](img/image_rsrc40N.jpg)\n3. Tanh（双曲正切）：\n    * 输出\
    \ -1 到 1 之间的值。\n    * 适用于中心化数据。\n4. Softmax 函数：\n    * 将逻辑回归输出（logits）转换为多分类的概率分布。\n\
    \n## 使用 TensorFlow/Keras 实现简单的 ANN\n\n为了演示人工神经网络的工作原理，我们将使用 TensorFlow 和 Keras\
    \ 实现一个简单的 ANN，用于分类 MNIST 数据集的手写数字。\n\n### 第 1 ：导入所需的库\n\n```python\nimport numpy\
    \ as np\nimport tensorflow as tf\nfrom tensorflow import keras\nimport matplotlib.pyplot\
    \ as plt\n\n# 加载数据集\nfrom tensorflow.keras.datasets import mnist\n(X_train, y_train),\
    \ (X_test, y_test) = mnist.load_data()\n```\n\n### 第 2 ：预处理数据\n\n```python\n#\
    \ 将像素值归一化到 [0, 1]\nX_train, X_test = X_train / 255.0, X_test / 255.0\n# 将图像从 28x28\
    \ 展平为 784 个值的数组\nX_train = X_train.reshape(-1, 784)\nX_test = X_test.reshape(-1,\
    \ 784)\n```\n\n### 第 3 ：定义神经网络模型\n\n```python\n# 构建 ANN 模型\nmodel = keras.Sequential([\n\
    \    keras.layers.Dense(128, activation='relu', input_shape=(784,)),\n    keras.layers.Dense(64,\
    \ activation='relu'),\n    keras.layers.Dense(10, activation='softmax')\n])\n\
    ```\n\n### 第 4 ：编译模型\n\n```python\nmodel.compile(optimizer='adam', loss='sparse_categorical_crossentropy',\
    \ metrics=['accuracy'])\n```\n\n### 第 5 ：训练神经网络\n\n```python\n# 训练模型\nmodel.fit(X_train,\
    \ y_train, epochs=10, validation_data=(X_test, y_test))\n```\n\n### 第 6 ：评估模型性能\n\
    \n```python\n# 在测试集上评估\nloss, accuracy = model.evaluate(X_test, y_test)\nprint(f\"\
    Test Accuracy: {accuracy:.2f}\")\n```\n\n## 示例：使用神经网络预测手写数字\n\n一旦模型训练完成，我们就可以使用它对手写数字进行预测。\n\
    \n### 第 7 ：进行预测\n\n```python\n# 预测样本图像\nsample_image = X_test[0].reshape(1, 784)\n\
    prediction = model.predict(sample_image)\npredicted_label = np.argmax(prediction)\n\
    \n# 显示图像\nplt.imshow(X_test[0].reshape(28, 28), cmap='gray')\nplt.title(f\"Predicted\
    \ Label: {predicted_label}\")\nplt.show()\n```\n\n这演示了人工神经网络如何以高准确率对手写数字进行分类。\n\
    \n"
