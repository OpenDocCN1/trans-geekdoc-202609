    # Day 6: Multiple Linear Regression and Feature Selection


    ## Understanding Multiple Regression


    Multiple linear regression is an extension of simple linear regression that models
    the relationship between a dependent variable and multiple independent variables.
    Unlike simple linear regression, which considers only one predictor variable,
    multiple regression allows us to incorporate multiple factors that influence the
    target variable, making predictions more accurate and robust.


    ![C:\\Users\\anike\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\759EA495.tmp](image_rsrc402.jpg)


    The mathematical equation for multiple linear regression is given by:


    ![](image_rsrc403.jpg)


    Where:


    *   YY is the dependent variable (target to predict)


    *   X1,X2,...,XnX\_1, X\_2, ..., X\_n are independent variables (features)


    *   b0b\_0 is the intercept (constant term)


    *   b1,b2,...,bnb\_1, b\_2, ..., b\_n are the coefficients (weights assigned to
    each feature)


    *   ee is the error term (residual)


    Multiple regression is widely used in finance, healthcare, economics, and many
    other fields where multiple factors influence the outcome. It helps in identifying
    key drivers of trends and understanding how different variables contribute to
    changes in the target variable.


    ## Feature Selection Techniques


    Feature selection is an essential step in multiple regression to improve model
    performance, reduce overfitting, and enhance interpretability. Including irrelevant
    or redundant features can lead to inaccurate predictions and increase computational
    complexity. Some common techniques used for feature selection include:


    ### 1\. Filter Methods


    Filter methods use statistical techniques to evaluate the relationship between
    input features and the target variable. Some commonly used methods are:


    *   Correlation Matrix: Identifies features that are highly correlated with the
    target variable.


    *   Chi-Square Test: Measures the dependency between categorical input and output
    variables.


    *   ANOVA (Analysis of Variance): Evaluates the statistical significance of features.


    import pandas as pd


    import seaborn as sns


    import matplotlib.pyplot as plt


    \# Sample dataset


    data = {


    ''Feature1'': \[10, 20, 30, 40, 50\],


    ''Feature2'': \[2, 4, 6, 8, 10\],


    ''Target'': \[5, 9, 13, 17, 21\]


    }


    df = pd.DataFrame(data)


    \# Generating a correlation matrix


    correlation\_matrix = df.corr()


    sns.heatmap(correlation\_matrix, annot=True, cmap=''coolwarm'')


    plt.title(''Feature Correlation Matrix'')


    plt.show()


    ### 2\. Wrapper Methods


    Wrapper methods select features by training models with different subsets of features
    and evaluating their performance. Some common approaches are:


    *   Recursive Feature Elimination (RFE): Eliminates less important features iteratively.


    *   Forward Selection: Starts with no features and adds the most relevant one
    at each step.


    *   Backward Elimination: Starts with all features and removes the least significant
    ones step by step.


    from sklearn.feature\_selection import RFE


    from sklearn.linear\_model import LinearRegression


    \# Initializing the regression model


    model = LinearRegression()


    \# Performing Recursive Feature Elimination


    rfe = RFE(model, n\_features\_to\_select=2)


    X = df\[\[''Feature1'', ''Feature2''\]\]


    y = df\[''Target''\]


    rfe.fit(X, y)


    print("Selected Features:", X.columns\[rfe.support\_\])


    ### 3\. Embedded Methods


    Embedded methods integrate feature selection within the model training process.
    Some of the most effective techniques include:


    *   Lasso Regression (L1 Regularization): Shrinks less important feature coefficients
    to zero, effectively selecting only the most relevant features.


    *   Ridge Regression (L2 Regularization): Penalizes large coefficients to reduce
    model complexity and prevent overfitting.


    ## Regularization: Lasso and Ridge Regression


    Regularization techniques help prevent overfitting by adding a penalty term to
    the regression equation, controlling the magnitude of coefficients. The two most
    commonly used regularization methods are Lasso (L1) Regression and Ridge (L2)
    Regression.


    ### Lasso Regression (L1 Regularization)


    Lasso regression adds an absolute penalty to the loss function, forcing some feature
    coefficients to become exactly zero. This makes it useful for feature selection.


    ![](image_rsrc404.jpg)


    from sklearn.linear\_model import Lasso


    \# Training a Lasso Regression Model


    lasso = Lasso(alpha=0.1)


    lasso.fit(X, y)


    print("Lasso Coefficients:", lasso.coef\_)


    ### Ridge Regression (L2 Regularization)


    Ridge regression adds a squared penalty to the loss function, shrinking the coefficients
    but keeping all features in the model. This helps in managing multicollinearity
    and reducing overfitting.


    ![](image_rsrc405.jpg)


    from sklearn.linear\_model import Ridge


    \# Training a Ridge Regression Model


    ridge = Ridge(alpha=0.1)


    ridge.fit(X, y)


    print("Ridge Coefficients:", ridge.coef\_)


    ## Example: Applying Ridge Regression to Prevent Overfitting


    Let''s apply Ridge Regression on a dataset and evaluate its performance compared
    to ordinary least squares regression.


    import numpy as np


    from sklearn.model\_selection import train\_test\_split


    from sklearn.metrics import mean\_squared\_error


    \# Generating synthetic data


    np.random.seed(42)


    X = np.random.rand(100, 3) \* 10


    y = 5 + 2\*X\[:, 0\] + 3\*X\[:, 1\] + 1.5\*X\[:, 2\] + np.random.randn(100) \*
    2


    \# Splitting the data into training and testing sets


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.2,
    random\_state=42)


    \# Training Ridge Regression model


    ridge\_model = Ridge(alpha=1.0)


    ridge\_model.fit(X\_train, y\_train)


    \# Making predictions


    y\_pred = ridge\_model.predict(X\_test)


    \# Evaluating performance


    mse = mean\_squared\_error(y\_test, y\_pred)


    print("Mean Squared Error with Ridge Regression:", mse)


