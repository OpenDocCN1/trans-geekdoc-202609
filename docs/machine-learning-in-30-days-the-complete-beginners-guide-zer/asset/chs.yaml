  \ AI 研究做出贡献。\n\n# 附录\n\n## ML 快速查表\n\n在处理机器学习项目时，拥有一个快速参考指南非常有帮助。以下是一些核心概念、公式和技术：\n\
  \n### 常用 ML 算法\n\n* `回归` – 使用变量间的线性关系预测连续值。\n* `逻辑回归` – 用于二分类。\n* `决策树` – 基于特征划分建立决策模型。\n\
  * `随机森林` – 结合多个决策树的集成学习方法。\n* `支持向量机 (SVM)` – 为分类寻找最优边界。\n* `k-最近邻 (KNN)` – 一种非参数算法，用于分类和回归。\n\
  * `神经网络` – 受大脑启发，用于深度学习任务。\n\n### 关键 ML 公式\n\n* `均方误差 (MSE)`\n* `对数损失（二分类）`\n* `梯度下降更新规则`\n\
  \n### 特征工程最佳实践\n\n* 对数值特征进行归一化或标准化。\n* 将类别特征转换为数值（独热编码、标签编码）。\n* 使用填充技术处理缺失值。\n\
  * 移除相关特征以减少冗余。\n\n## 常见 ML 错误与修复\n\n即使是经验丰富的 ML 专家在训练模型时也会遇到问题。以下是一些常见错误及其解决方案：\n\
  \n### 1. 过拟合\n\n问题：模型在训练数据上表现良好，但在未知数据上表现糟糕。修复：\n\n* 尽可能使用更多训练数据。\n* 应用 `L1/L2 正则化`\
  \ 以降低模型复杂度。\n* 在神经网络中使用丢弃层 (dropout)。\n\n\n\n\n\n-   执行交叉验证以确保泛化能力。\n\n### 2. 欠拟合\n\
  \n问题：模型太简单，无法捕捉数据中的模式。解决方法：\n- 增加模型复杂度（在神经网络中添加更多层）。\n- 增加训练轮数（epochs）。\n- 使用特征工程来提高输入数据的质量。\n\
  \n### 3. 数据泄露\n\n问题：训练数据包含来自测试集的信息，导致准确率不切实际。解决方法：\n- 在模型训练前确保进行适当的训练-测试划分。\n- 避免使用未来数据作为特征。\n\
  - 正确执行交叉验证。\n\n### 4. 类别不平衡\n\n问题：数据集中某一类的实例远多于另一类。解决方法：\n- 使用过采样（`SMOTE`）或欠采样技术。\n\
  - 在模型训练期间分配类别权重。\n- 使用 `F1-score` 和 `AUC-ROC` 等评估指标代替准确率。\n\n### 5. 训练时间过长\n\n问题：模型训练耗时过长，导致实验难以进行。解决方法：\n\
  - 优化模型架构和超参数。\n- 在深度学习中使用 GPU 加速。\n- 针对大规模数据集应用分布式训练。\n\n## 初学者面试题\n\n正在准备机器学习的职场面试吗？这里有一些基础问题：\n\
  \n### 通用机器学习问题\n\n1. 监督学习、无监督学习和强化学习之间有什么区别？\n2. 解释偏差-方差权衡（bias-variance tradeoff）。\n\
  3. 什么是交叉验证？它为什么重要？\n4. 特征选择的目的是什么？如何进行特征选择？\n5. `L1` 和 `L2` 正正则化的区别？\n6. 解释精确率（precision）、召回率（recall）和\
  \ `F1-score`。\n7. 什么是梯度下降？它是如何工作的？\n\n### 深度学习问题\n\n1. 什么是激活函数？它们为什么重要？\n2. 解释卷积神经网络（`CNNs`）及其应用场景。\n\
  3. `LSTMs` 和 `GRUs` 之间有什么区别？\n4. 什么是迁移学习？什么时候应该使用它？\n5. 批标准化（batch normalization）是如何改进深度学习模型的？\n\
