  plt.show()\n```\n\n### 步骤 2：训练 KNN 模型\n```python\nfrom sklearn.model_selection import\
  \ train_test_split\nfrom sklearn.neighbors import KNeighborsClassifier\n\n### 划分数据集\n\
  X_train, X_test, y_train, y_test = train_test_split(digits.data, digits.target,\
