    # 金融科技、机器学习与人工智能在程序化决策中的应用及感知收益


    Muhammad Salim 博士

    巴林大学工商管理学院经济与金融系

    巴林，萨希尔，巴林王国

    电子邮箱：mselim@ubrain.edu.bh ORCID: 0000-0002-0571-5529


    摘要—本研究旨在考察金融科技（FinTech）、机器学习与人工智能（AI，或简称 FMAI）的感知收益。本研究基于一个概念模型，该模型旨在当公司引入金融科技、机器学习和人工智能以实施消费者利益时，保持消费者的满意度和收益。研究结果和发现表明，FMAI
    的应用显著提升了客户满意度。FMAI 的应用为消费者节省了时间，减少了与发行人的冲突，具有良好的友好性，并具有增加消费者对发行人和其他利益相关者满意度的潜力。


    如果学生不满，他们的表现将受到影响，最终他们计划转到另一所学校或大学。在大多数政府机构中，服务提供的模式相似，且系统往往极其僵化。如果他们得不到想要的，就会决定离开，或者对于其他服务或预约，客户可能会感到沮丧。本研究旨在通过引入基于金融科技、机器学习和人工智能（AI）的决策，为所有问题和困难提供解决方案。客户发现机器复杂且不愉快，而在满意度方面，代表和客户无需前往办公室或市场即可解决他们的问题。


    关键词—金融科技、机器学习与人工智能、程序化决策、消费者满意度、员工利益、公司政策。


    ## I. 引言


    某些情况对于公司、企业组织、学术机构和政府实体经常发生。例如，在售后阶段，某些客户会退回某些物品或更换他们想要的东西。每天处理此类问题可能会令人沮丧，挑战可能会让客户感到沮丧和愤怒。优秀的公司应该以最可能的方式提供日常服务，而不会产生成本、冲突和满意方面的困难。学生喜欢调整他们的学习计划。这可能包括更换学期、参加其他课程以及许多经常发生的其他事情。大多数时候，学生会感到失望和愤怒，因为他们无法实现想做的事情。因此，他们


    人工智能在金融科技中扮演着角色，尽管它曾被视为科幻小说的一部分。机器学习与监管活动被称为监管科技（RegTech），能够以最有效的方式完成许多工作，因此可以成为程序化决策技术的一部分
    [1]。机器学习也可以应用于金融数据分析或风险评估，并可以作为程序化决策的一部分进行 [2]。


    机器学习正在增长，并彻底改变生活、商业以及几乎所有人类活动的所有领域和方面。机器学习现在正促进这些领域的创新，例如产品营销、汽车驾驶、执行机器人活动，甚至接管人类的判断和决策
    [4]。


    ## 2020年决策辅助与支持国际会议 (DASA)


    金融科技可以带来新的范式，技术驱动的创新不仅限于金融领域，还能解决管理人员在决策过程中面临的技术和管理挑战 [6]。金融科技不仅是金融技术，更是一系列基于技术的创新产品——包括通过决策过程和


    或， $\Delta CS = \alpha_2, \Delta AST \dots$ (3)


    在方程 3 中，客户节省时间的额外增加将按 $\alpha_2$ 倍增加客户的满意度，且 $\alpha_2 > 0$。


    金融科技确实是技术协作经济中的“协作与共同融资”，在这种经济中，今天的决策是由服务提供者嵌入的 [5]。通过使用机器，普通的领导者可以做出更好的决策，在决策艺术方面表现更出色，特别是在决策成为公司政策并并在定期和统一的基础上一致的情况下。机器学习方法可预测违约风险
    [7]。因此，机器学习和人工智能可以为高效的程序化决策提供非常有用的工具。


