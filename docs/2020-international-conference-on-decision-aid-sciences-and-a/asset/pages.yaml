    entities introduce FinTech, Machine learning and AI in resolving the issues related
    to decision making, it is expected that the customers will save (ST), they do
    not need to make a trip to the office or the market place (TM), no have to deal
    with either unpleasant and regular customer service representatives (FCR), instead
    they will use FinTech, user Machine learning and AI (FAI), similar to Sad machines
