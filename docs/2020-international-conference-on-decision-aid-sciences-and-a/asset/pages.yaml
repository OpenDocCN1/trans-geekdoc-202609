    # IV. RESULTS AND FUTURE


    This is a conceptual framework and it is based on theoretical foundations. The
    step by developed model can easily be tested by experimental results will reflect
    true data in the world and the empirical results will reflect true significance
    of each of the independent variables.


    # V CONCLUSION


    In this study we have found that the application of Fintech, Machine learning
    and AI can be successful, effective and efficient. By developing a theoretical
    model, it has been shown that customers'' satisfaction as well as employees''
    benefit maximized


