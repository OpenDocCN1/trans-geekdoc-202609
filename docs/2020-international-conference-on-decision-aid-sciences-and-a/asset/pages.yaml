    or business or an academic institution or for an employer. Programed decisions
    by FMAI can play a significant role for implementing decisions in conventional
    service outlet where clients do not receive advice and services often, then they
    decide and buy item from others. For implementing various programmed decisions
    without any company knowledge, the introduction of


