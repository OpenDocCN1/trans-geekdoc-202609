  md: '# Application of FinTech, Machine learning and Artificial Intelligence in programmed
    decision making and the perceived benefits


    Dr. Muhammad Salim

    Department of Economics & Finance, College of Business Administration

    University of Bahrain

    Sakhir, Kingdom of Bahrain

    E-mail: mselim@ubrain.edu.bh ORCID: 0000-0002-0571-5529


    Abstract—The objective of this study is to examine the perceived benefits of FinTech,
    Machine Learning and Artificial Intelligence (AI) or FMAI). The study is based
    on a conceptual model, developed to stay in with consumers'' satisfaction and
    benefits when the company introduces FinTech, Machine Learning and AI for implementing
    the consumers'' benefits. The results and findings show that the application of
    FMAI significantly improves customer satisfaction. The application of FMAI saves
    time for the consumers, reduces the conflicts with the issuers, is friendly, and
    has the potential to increase consumers'' satisfaction with the issuers and other
    stakeholders.


