- fmt: "\nStep through the code of a library step-by-step if it does not work as expected.\
    \ while seemingly time-consuming, especially for larger libraries, this approach\
    \ often leads to the root cause of an issue. Xdebug supports such analysis by\
    \ providing you with the possibility to pause execution at any line and inspect\
    \ how things currently are in your application.\n\n## Unit testing\n\nWriting\
    \ unit tests for your libraries is another great way to spot bugs. Tests that\
    \ cover the entire functionality of a library can help find issues before they\
    \ start annoying.\n\n{notice} We have thoroughly gone through unit testing during\
    \ previous lessons.\n\nUsing tools like `PHPUnit` can help you generate reports\
    \ that give you very good insights into how your library functionality is tested,\
    \ you can generate a coverage report to have insights into how much of your library\
    \ is being covered in unit tests.\n\n![](image_rsrc3CU.jpg)\n\nPHPunit coverage\
    \ report\n\n## Logging solution\n\nUse PHP’s built-in error-logging functionality\
    \ to catch errors and exceptions as they occur in libraries. The file that this\
    \ produces is an invaluable resource during debugging. Set your library up to\
    \ log errors to a file, which you can then open and examine to find out what went\
    \ wrong.\n\nLet us examine an example of how to set up logging into a simple function\
    \ or PHP file.\n\n```php\n<?php  \n\n/**  \n* Error handler function to log errors\
    \ to a file.  \n */  \nfunction customErrorHandler($error_level, $error_message,\
    \ $error_file, $error_line) {  \n    $errorMessage = \"[\" . date(\"Y-m-d H:i:s\"\
    ) . \"] Error: {$error_message} in {$error_file} on line {$error_line}\\n\"; \
    \ \n    // Specify the path to the log file  \n    $logFile = \"/path/to/error_log.txt\"\
    ;  \n    // Append the error message to the log file  \n    error_log($errorMessage,\
    \ 3, $logFile);  \n}  \n\n// Set the error handler  \nset_error_handler(\"customErrorHandler\"\
    );  \n\n// Trigger an error for demonstration (this would normally come from your\
    \ application code)  \ntrigger_error(\"Sample error for logging demonstration\"\
    );\n```\n\nLet us break down this code snippet:\n\n*   The `customErrorHandler()`\
    \ function is to handle errors. It formats the error message and writes it to\
    \ a specific file.\n*   The `set_error_handler()` function is used to set the\
    \ `customErrorHandler()` as the error handler.\n*   The `error_log()` function\
    \ is used to write the error message to the file with error type `3`.\n*   The\
    \ `$logFile` variable holds the path of the file where you want to store error\
    \ messages.\n*   The `trigger_error()` function is used to trigger an error to\
    \ demonstrate how this works.\n\n## Documentation of the library\n\nThe documentation\
    \ for each library often includes lists of common bugs and their resolutions.\
    \ Whenever you get stuck with something, the first place you should be looking\
    \ at is the library documentation because even if it does not give you an answer\
    \ straight away, usually it gives tips about where to go next.\n\n## Go through\
    \ its source code\n\nIf you continue to face problems, then check out the source\
    \ code of the library. Most of the popular open-source PHP libraries have their\
    \ codes made available on platforms like GitHub. Experiencing going through code\
    \ can often help understand a library better and help identify probable issues.\n\
    \n![](image_rsrc3CV.jpg)\n\nA flowchart of source code review process\n\nDebugging\
    \ PHP libraries demands a proper understanding of the library’s structure and\
    \ the interactions of its components. The work is made easier by relying on tools\
    \ such as `Xdebug`, and `PHPUnit`, and adding comprehensive logging methods to\
    \ troubleshoot bugs. Always refer to the documentation and if need be delve into\
    \ the source code. Every debugging technique improves your ability to solve problems\
    \ and broadens your knowledge about the particular library and PHP.\n\n## Code\
    \ Quality Basics and Metrics in PHP\n\nYour code quality is a measure of how great\
    \ it has been written. Quality code is simple to read and maintain with no extra\
    \ complexities in a nutshell, quality code means:\n\n![](image_rsrc3CW.jpg)\n\n\
    Code Quality means in a nutshell\n\n*   **Readable**: Your code needs to be easy\
    \ for others (or you in the future) to understand. Indentation, comments and also\
    \ use of clear variable names improve readability.\n*   **Maintainable**: Simple\
    \ to update or maintain. This could be done through modular loosely coupled codes.\n\
    *   **Efficient**: The code requires using resources effectively and execution\
    \ of tasks swiftly.\n*   **Reliable**: Reliable code gives the same results over\
    \ and over again. It should deal with edge cases as well as potential errors smoothly.\n\
    \n### Importance of code quality\n\nConcentrating on code quality saves time and\
    \ effort in the long run. It reduces defects, makes the code easier to understand\
    \ and maintain, and increases the application’s overall performance. When working\
    \ on bigger projects or dealing with a team situation, code quality becomes even\
    \ more crucial because it influences how productive your team is and whether your\
    \ program stays stable.\n\n### Measuring code quality in PHP\n\nThere are many\
    \ tools available that help you measure PHP code quality. These metrics will provide\
    \ various ways to notify you about your code’s quality. Let’s study some important\
    \ metrics and their measuring tools.\n\n### Cyclomatic complexity\n\nThe cyclomatic\
    \ complexity determines the complexity of your code. It adds up independent pathways\
    \ through a program with higher cyclomatic complexity states more difficult-to-maintain\
    \ code. You can calculate the cyclomatic complexity of your PHP code by using\
    \ some handy tools like [PHPMD](https://github.com/phpmd/phpmd) (PHP Mess Detector).\n\
    \nYou have the `PHPMD` in the `composer.json` of the Jazzon library and you can\
    \ use it by invoking the following command, empty output means that everything\
    \ is good:\n\n![](image_rsrc3CX.jpg)\n\nPHPMD expected output\n\n### Code duplication\n\
    \nCode duplication is when you have the same code in a few places. Since updates\
    \ must be done on various parts of an application, duplicated codes might block\
    \ you from keeping up with your codebase.\n\nTools such as `PHPCP` (PHP Copy/Paste\
    \ Detector) or `PHP_codesniffer` can help one find duplicated code.\n\n![](image_rsrc3CY.jpg)\n\
    \nPHP_codesniffer output\n\n### NPath complexity\n\nThe NPath complexity relates\
    \ to the count of alternative execution paths through any function. It is arrived\
    \ at by counting the number of acyclic execution pathways throughout a function.\
    \ High NPath complexity just like cyclomatic complexity hints that the concerned\
    \ code is more complex.\n\nNPath complexity can also be found using `PHPMD`.\n\
    \n### Code coverage\n\nThe amount of code covered by unit tests is measured as\
    \ code coverage. A higher code coverage percentage indicates that more of your\
    \ code base has been tested, potentially leading to fewer errors.\n\n`PHPUnit`,\
    \ `Xdebug`, and `PCOV` can all create code coverage reports for your PHP code.\n\
    \n![](image_rsrc3CU.jpg)\n\nPHPunit coverage report\n\nAnother useful usage of\
    \ the coverage reporting functionality in `PHPUnit` is having insights into how\
    \ our classes/functions are behaving.\n\nFollowing for example is a report on\
    \ how the cover distribution and complexity of our Jazzon classes;\n\n![](image_rsrc3CZ.jpg)\n\
    \nPHPunit Classes coverage report\n\nAnd the following is for the functions:\n\
    \n![](image_rsrc3D0.jpg)\n\nPHPunit Functions coverage report\n\nUsing reports\
    \ like those can help you improve the overall code quality of your project.\n\n\
    ### Code quality in Jazzon library\n\nThe same metrics can be used to assess the\
    \ code quality of our Jazzon library. `PHPMD`, for example, can be used to examine\
    \ the cyclomatic complexity of the `JsonEncoder`, `JsonParser`, and `JsonValidator`\
    \ classes. `PHP_codesniffer` can also be used to detect code duplication among\
    \ these classes.\n\nAs shown in the following screenshot:\n\n![](image_rsrc3CY.jpg)\n\
    \nPHP_codesniffer output for Jazzon\n"
