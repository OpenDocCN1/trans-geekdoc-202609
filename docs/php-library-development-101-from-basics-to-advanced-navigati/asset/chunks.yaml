    Processed $amount using Stripe.\\\\n\");  \n\n        }  \n\n    }  \n\n    $paypal\
    \ \\= new PayPalGateway();  \n\n    $paypal\\->processPayment(100);  \n\n    $stripe\
    \ \\= new StripeGateway();  \n\n    $stripe\\->processPayment(150);\n\nWe will\
    \ see most of these practices and principles when implementing our library.\n\n\
    After defining the basic functions and classes we need for our library, it is\
    \ time to implement the logic of our function, then we will go through namespacing\
    \ and how to put everything together from our implemented functions into it is\
    \ classes with the correct namespaces. And in the chapter following that we will\
    \ write tests to make sure that our functions do what it is built to do.\n\n##\
    \ Implement Library Functions\n\nIn the previous lessons, we outlined the key\
    \ functions and classes that form the basis of our Jazzon library. Now, we are\
    \ going to dive into the actual implementation of these functions and classes.\n\
    \nIn this lesson, we are going to implement the actual functions of the library.\n\
    \n{warning} This is just a sample library to illustrate the process of creating\
    \ actual libraries, so we might depend on PHP built-in functions to simplify the\
    \ code. You need to do so in real life when needed especially if the language-specific\
    \ functions are optimized.\n\n### parse()\n\nWe are going to use $this->jsonValue\
    \ to reference our JSON string value that will be created when initializing the\
    \ class object.\n\n<?php  \n\n/\\*\\*  \n\n \\* Parses a JSON string and returns\
