    # PHP Library Development 101: From Basics to Advanced


    ## Preface


    I have been working with PHP for almost 10 years now, during this time I have
    used multiple frameworks and libraries from the community, and I have even contributed
    to some of the open-source projects.


    Mainly in the last 5 years, I have worked in companies where I had to build internal
