    \ `OrderProcessor` 的功能。\n\n```php\n<?php  \n\npublic function testOrderProcessorWithMockedPaymentGateway():\
    \ void  \n\n{  \n    // 为 PaymentGateway 创建一个模拟对象。  \n    $paymentGatewayMock\
