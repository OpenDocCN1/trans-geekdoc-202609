  trans: "\n另一方面，应用程序是完整的、自包含的软件产品，旨在执行特定任务或为用户提供特定服务而构建。PHP 库是可重用的组件，可以用于构建应用程序，而不是框架或应用程序那样是完整且自包含的产品。它们可以用于各种项目（如框架），或者与其他库轻松集成以构建整个应用程序。\n\
    \n## PHP 库是如何运作的？\n\nPHP 库通常是独立的实体，或者是更大包的一部分。在 PHP 语文中，一个包（package）通常不仅包含一个库，还包括配置文件和文档等额外资源。这些包可以使用\
    \ `Composer` 等包管理器进行下载或安装。一旦安装了库或包，你就可以在代码中使用库提供的 `functions`（函数）、`classes`（类）或\
    \ `modules`（模块）。某些情况下，库在使用需要先进行某些配置或初始化。\n\n通常情况下，要在代码中使用 PHP 库，你需要先使用 `require_once`\
    \ 或 `include_once` 关键字引入该库（你也可以使用 `require` 或 `include` 关键字）。\n\n例如，如果你想使用一个提供数据库操作函数的库：\n\
    \n```php\n<?php  \n\n// 将数据库库导入到你自己的文件中  \n\nrequire_once 'path/to/database-library.php';\
    \  \n\n// 实例化数据库对象  \n\n$db = new Database();  \n\n// 使用新创建的 DB 对象  \n\n$results\
    \ = $db->query(\"SELECT * FROM table\");\n```\n\n如果你使用 composer 来管理项目依赖项，它会将库安装在名为\
    \ `vendor` 的目录下，因此你可以直接在文件中加载该目录，例如：\n\n```php\n<?php  \n\n// 将数据库库导入到你自己的文件中\
    \  \n\nrequire_once __DIR__ . '../vendor/autoload.php';  \n\n// 实例化数据库对象  \n\n\
    $db = new Database();  \n\n// 使用新创建的 DB 对象  \n\n$results = $db->query(\"SELECT\
    \ * FROM table\");\n```\n\n我们已经探索了 PHP 世界中库的定义，以及它们与框架或应用程序的区别。在了解了库的运作方式后，现在让我们看看为什么我们需要它们以及存在哪些不同类型。\n\
    \n## 库的优势、风险和类型\n\n在本节中，我们将探索使用 PHP 库的一些优势以及它们流行的不同类型。\n\n### 使用库的优势\n\nPHP 库提供了许多优势，从代码重用到社区支持。它们可以轻松简化开发过程，并使构建高质量应用程序变得更加容易。让我们仔细观察其中的一些优势。\n\
    \n### 代码重用\n\n这指的是在多个项目中重用代码的能力，这可以通过使用 `classes`、`functions`或其他可重用组件来实现。PHP 库在这里起着至关重要的作用，因为它们提供了一种方便封装和分发重用代码的方法。想象开发者在构建多个需要发送电子邮件函数的项目时，而不是反复编写相同的代码，他们可以轻松地将其封装在库并在多个项目中重用，而无需每次都重新发明轮子。\n\
    \n![](img/image_rsrc3C0.jpg)\n\n#### 代码重用示例\n\n发送电子邮件的示例：\n\n```php\n<?php  \n\
    \n// 定义此类所在的命名空间  \n\n// 这允许我们避免不同库或应用程序部分之间的命名冲突。  \n\nnamespace MyEmailLibrary;\
    \  \n\n// 定义一个名为 EmailSender 的类  \n\nclass EmailSender {  \n\n    // 这些是私有属性，只能在此类内部访问和修改。\
    \  \n\n    // 它们将存储 SMTP 服务器的详细信息和凭据。  \n\n    private $smtpServer;  \n\n    private\
    \ $username;  \n\n    private $password;  \n\n    // 这是构造方法。当创建该类的实例时会自动调用它。 \
    \ \n\n    public function __construct($smtpServer, $username, $password) {  \n\
    \n        // 将传递的 SMTP 服务器详细信息和凭据存储在此类的私有属性中。  \n\n        $this->smtpServer =\
    \ $smtpServer;  \n\n        $this->username = $username;  \n        $this->password\
    \ = $password;  \n\n    }  \n\n    // 这是一个发送电子邮件的方法。它接受接收者地址、主题和邮件正文作为参数。  \n\n\
    \    public function sendEmail($to, $subject, $body) {  \n\n        // 这是使用存储的凭据连接到\
    \ SMTP 服务器的代码。  \n        // 然后，代码将使用提供的参数发送电子邮件。  \n        // 为了示例起见，省略了实际的邮件发送代码。相反，我们只是输出一条消息。\
    \  \n        // 输出消息表示邮件已发送。  \n\n        echo \"Email sent to $to with subject:\
    \ $subject\\n\";  \n\n    }  \n}  \n\n// 以下是该类的使用方式：  \n// 首先，创建一个 EmailSender\
    \ 类的实例，并传递 SMTP 服务器详细信息和凭据。  \n\n$emailSender = new EmailSender(\"smtp.example.com\"\
    , \"username\", \"password\");  \n\n// 使用创建的对象的 sendEmail 方法发送电子邮件。  \n\n$emailSender->sendEmail(\"\
    user@example.com\", \"Welcome!\", \"Thank you for joining us!\");\n```\n\n###\
    \ 模块化\n\n指的是将大型软件应用程序拆分为更小、更易管理的组件的能力，这些组件可以在各种项目中轻松重用。将应用程序拆分为较小的组件允许开发者创建用于执行特定任务（如身份验证、数据验证、文件处理或发送电子邮件）的\
    \ PHP 库。\n\n![](img/image_rsrc3C1.jpg)\n\n#### 软件开发中模块化的思维图\n\n让我们来看代码中模块化的示例，我们将使用之前发送电子邮件的示例：\n\
    \n```php\n<?php  \n\n// 我们将代码分为四个模块：身份验证、数据验证、文件处理和电子邮件。  \n\n// ===== 身份验证模块\
    \ =====  \n\n// 为身份验证模块定义命名空间  \n\nnamespace Modules\\Authentication;  \n\n//\
    \ 负责身份验证任务的类，例如登录功能  \n\nclass Authenticator {  \n\n    // 验证用户名和密码并登录用户的方法  \n\
    \n    public function login($username, $password) {  \n\n        // 验证用户名和密码的代码（为了简单起见已省略）\
    \  \n\n        return \"User $username logged in.\\n\";  \n\n    }  \n}  \n\n\
    // ===== 验证模块 =====  \n\n// 为数据验证模块定义命名空间  \n\nnamespace Modules\\DataValidation;\
    \  \n\n// 负责数据验证任务的类  \n\nclass Validator {  \n\n    // 验证电子邮件地址格式的方法  \n\n  \
    \  public function validateEmail($email) {  \n\n        // 使用 PHP 内置过滤器验证邮件格式\
    \  \n\n        return filter_var($email, FILTER_VALIDATE_EMAIL) !== false;  \n\
    \n    }  \n}  \n\n// ===== 文件处理模块 =====  \n\n// 为文件处理模块定义命名空间  \n\nnamespace Modules\\\
    FileHandling;  \n\n// 负责文件处理任务的类  \n\nclass FileHandler {  \n\n    // 读取文件并返回其内容的方法\
    \  \n\n    public function readFile($filePath) {  \n\n        // 使用 PHP 内置函数读取文件\
    \  \n\n        return file_get_contents($filePath);  \n\n    }  \n}  \n\n// =====\
    \ 电子邮件模块 =====  \n\n// 为电子邮件模块定义命名空间  \n\nnamespace Modules\\Email;  \n\n// 负责电子邮件相关任务的类，例如发送电子邮件\
    \  \n\nclass Emailer {  \n\n    // 发送电子邮件的方法（实现细节已省略）  \n\n    public function\
    \ sendEmail($to, $subject, $body) {  \n\n        // 发送电子邮件的代码（已省略）  \n\n     \
    \   return \"Email sent to $to with subject: $subject\\n\";  \n\n    }  \n}  \n\
    ```\n\n\n\n### 节省时间和成本\n\n"
- fmt: "\nWhen it comes to software development, time is money, and as libraries provide\
    \ reusable code they can greatly reduce the amount of time and effort required\
    \ to build an application. In return, this reduces the cost of development and\
    \ makes it easier to meet deadlines, as developers don’t need to spend more time\
    \ writing code that already exists and can be easily reused.\n\n```php\n<?php\
    \  \n\n// Without using a library:  \n\nclass ManualEmailSender {  \n\n    public\
    \ function sendEmail($to, $subject, $body) {  \n\n        // Manual code to connect\
    \ to SMTP server  \n        // Manual code to set up email headers and body  \n\
    \        // Manual code to send the email  \n        echo \"Email sent manually\
    \ to $to\\n\";  \n\n    }  \n}  \n\n// With using a library:  \n\nnamespace UsingLibrary;\
    \  \n\nuse MyEmailLibrary\\EmailSender;  // Assuming the EmailSender library exists\
    \ from our previous example  \n\nclass EfficientEmailSender {  \n\n    private\
    \ $emailer;  \n\n    public function __construct() {  \n        $this->emailer\
    \ = new EmailSender(\"smtp.example.com\", \"username\", \"password\");  \n   \
    \ }  \n\n    public function sendEmail($to, $subject, $body) {  \n        $this->emailer->sendEmail($to,\
    \ $subject, $body);  \n        echo \"Email sent using library to $to\\n\";  \n\
    \    }  \n}  \n\n// Using the two methods:  \n\n$manualSender = new ManualEmailSender();\
    \  \n\n$manualSender->sendEmail(\"user1@example.com\", \"Hello!\", \"Manually\
    \ sent this.\");  \n\n$efficientSender = new UsingLibrary\\EfficientEmailSender();\
    \  \n\n$efficientSender->sendEmail(\"user2@example.com\", \"Hello!\", \"Used a\
    \ library to send this.\");\n```\n\n### Consistency and standardization\nPHP developers\
    \ provide consistent and standard solutions for common problems, instead of each\
    \ developer writing their solution to the problem they can easily make use of\
    \ a well-established PHP library that has proven to work. This ensures that the\
    \ code is consistent and follows the best practices, which makes it easier for\
    \ other developers to understand and work with the code, helping in reducing the\
    \ likelihood of errors, and bugs, and improving the code’s readability.\n\n###\
    \ Improve code quality\nPHP libraries are typically written by experienced developers\
    \ who have a deep understanding of PHP and software development best practices.\
    \ This means the code in these libraries is often of a higher quality than code\
    \ that is written from scratch.\n\nTypically, PHP libraries are well-documented\
    \ and well-tested, which helps you ensure code quality. Developers can make use\
    \ of this advantage by using these resources to avoid common errors or mistakes.\n\
    \n### Community support\nMany PHP libraries have a large and active community\
    \ of developers who contribute to the codebase, provide support, and offer helpful\
    \ resources for library usage. This can be a valuable resource to developers using\
    \ the library, especially the ones who are new to a particular library, or who\
    \ need help on a specific issue.\n\n### Improve maintainability\nAs mentioned\
    \ in the previous benefit when using a well-established library you make use of\
    \ the community support provided there. You can benefit from the ongoing development\
    \ and maintenance of the library, and this means bugs and issues are more likely\
    \ to be identified and fixed quickly. And the library is more likely to be updated\
    \ with new improvements and features over time.\n\n### Enhance collaboration\n\
    The previous two benefits take us directly to this one, as sharing and using the\
    \ same library in different applications can enhance collaboration among developers.\
    \ This can lead to a more streamlined development process, as everyone uses the\
    \ same codebase and can collaborate more efficiently on improving it.\n\n### Types\
    \ of libraries\nWe have defined what libraries are and what are the benefits of\
    \ using them. Let’s explore the most popular PHP library types that exist.\n\n\
    ### Frameworks libraries\nPHP frameworks as we discussed before come with their\
    \ own set of libraries and tools that are specifically designed to work with the\
    \ framework. These libraries provide functionality that is needed by most web\
    \ applications such as caching.\n\nSome examples of framework libraries include:\n\
    * `Symfony` framework: Offers libraries for `Validation`, HTTP handling, and templating.\n\
    * `Laravel` framework: Offers libraries for authentication handling, routing,\
    \ and database access.\n\nSome of these libraries are actually shared between\
    \ both frameworks and others, but usually they are implemented in a different\
    \ way or use the same library. For example, both (`Symfony` & `Laravel`) rely\
    \ on the `PHPUnit` library for testing.\n\n![](image_rsrc3C2.jpg)\n\nSymfony/Laravel\
    \ frameworks uses `PHPUnit`\n\n#### SDK libraries\nSDK (Software Development Kit)\
    \ libraries are collections of tools and libraries that provide access to a third-party\
    \ service API. It makes it easy for developers to build applications that integrate\
    \ with these services.\n\nExamples of these SDK libraries are:\n* `Google SDK`\
    \ which provides access to Google APIs.\n* `Stripe SDK` which provides access\
    \ to the Stripe APIs.\n* `AWS SDK` which provides access to the AWS APIs.\n\n\
    #### Third-party libraries\nThird-party libraries which are known also as Utility\
    \ Libraries, are the most commonly used PHP libraries in PHP development. These\
    \ libraries are developed by third-party developers and add add functionality.\n\
    \nSome common libraries are:\n* `Guzzle`: A library for sending HTTP requests\
    \ and handling responses.\n* `Monolog`: A logging library for PHP applications.\n\
    * `Mailer`: A library built by Symfony core team for sending emails.\n\n#### Testing\
    \ libraries\nTesting libraries are a collection of libraries that provide the\
    \ ability to write automated tests for applications. These libraries are designed\
    \ to make it easier for developers to test their applications and make sure they\
    \ are functioning correctly.\n\nSome of the common testing libraries are:\n* `PHPUnit`:\
    \ The most popular testing framework for PHP.\n* `Behat`: A library for behavior-driven\
    \ development testing.\n* `Codeception`: Can be used for web applications acceptance\
    \ testing, and can be used for unit testing as well.\n\n#### Component libraries\n\
    These libraries are reusable components that can be used to build an entire web\
    \ application. These libraries are built to be modular and can be used in a wide\
    \ range of applications.\n\nSome common component libraries are:\n* `Doctrine`:\
    \ A database abstraction layer.\n* `Twig` or `Blade`: A PHP template engine.\n\
    \n#### Custom libraries\nThese libraries are developed in-house (in a specific\
    \ company or organization) by PHP developers for specific projects or purposes.\
    \ These libraries are designed to be used in a specific project or shared across\
    \ multiple projects inside the organization.\n\nExamples of these libraries can\
    \ be:\n* A library that sends emails in a specific way.\n* An authorization library\
    \ that determines a user or service level of access.\n"
