    \ $path . '.php';  \n});  \n\n// 使用 MyClass  \n\n$instance = new MyClass();\n\
    ```\n\n在这个版本的自动加载器中，命名空间分隔符（`\\\\`）被目录分隔符（`/`）替换。这使我们能够将命名空间与目录关联。类 `Jazzon\\\\\
    Parsers\\\\JsonParser`对应文件 `Jazzon/Parsers/JsonParser.php`。\n\n虽然初看开发自动加载器非常有用，但在实践中，你可能会使用\
    \ Composer 提供的自动加载器。Composer 是一个带有强大自动加载器的依赖管理器。\n\n### Composer 的自动加载器\n\n要使用\
    \ Composer 的自动加载器，请在项目根目录下创建一个 `composer.json` 文件。你可以在此指定项目类如何被自动加载。这是一个示例：\n\n\
    ```json\n{\n  \"autoload\": {\n    \"psr-4\": {\n      \"Jazzon\\\\\": \"src/\"\
    \n    }\n  }\n}\n```\n\n我们在这个 `composer.json` 文件中告诉 Composer 使用 PSR-4 标准并将 `Jazzon\\\
    ` 映射到 `src/`。现在，任何位于 `Jazzon` 命名空间的类都应该放在 `src/` 中。要使用它，只需在脚本开头引入以下代码：\n\n```php\n\
    <?php  \n\n// 引入 Composer 生成的加载器  \n\nrequire __DIR__ . '/vendor/autoload.php';\
    \  \n\n// 创建 Jazzon\\\\Parsers\\\\JsonParser 的新实例  \n\nnew Jazzon\\\\Parsers\\\
    \\JsonParser();\n```\n\n我们在本节中学了 PHP 自动加载的重要性、工作原理以及如何在应用程序中使用。我们查看了内置的 `spl_autoload_register`\
    \ 函数，学习了如何在加载器中处理命名空间，并研究了 Composer 加载器。\n\n自动加载是管理项目依赖和保持代码整洁组织的有用工具。我们将在未来的课程中继续构建我们的\
    \ Jazzon 库，并看到这些自动加载技术的实际应用。\n\n"
- fmt: "\n```php\n<?php  \n\n// This class has its own file \"MyFirstClass.php\" \
    \ \n\nclass MyFirstClass {  \n    // Class code here  \n}\n```\n\n* `MySecondClass.php`\n\
    \n```php\n<?php  \n\n// This class has its own file \"MySecondClass.php\"  \n\n\
    class MySecondClass {  \n    // Class code here  \n}\n```\n\n2. Class and Namespace\
    \ names are case-sensitive: `PSR-4` considers namespaces and class names to be\
    \ case-sensitive. This means that `MyClass` is NOT equal to `Myclass`, both are\
    \ considered completely two different classes.\n\n3. Namespace hierarchy <==>\
    \ directory structure: Your classes’ namespace hierarchy should correspond to\
    \ the directory structure of your filesystem. This approach establishes a natural\
    \ mapping between your namespaces and your file structure.\n\n```php\n<?php  \n\
    \n/**\n* An example of folder structure\nproject/\n  src/\n    MyNamespace/\n\
    \      SubNamespace/\n        MyClass.php\n*/  \n\n// Declare the `SubNamespace`\
    \ under the `MyNamespace` namespace  \nnamespace MyNamespace\\SubNamespace;  \n\
    \n// The namespace corresponds directly to the directory structure  \nclass MyClass\
    \ {  \n    // Class code here  \n}\n```\n\n4. The `.php` extension for class files:\
    \ The `.php` extension should be used for all class files.\n\n```php\n<?php  \n\
    \n// This class should be exist in a file called `MyClass.php`  \nclass MyClass\
    \ {  \n    // Class code here  \n}\n```\n\n### PSR-4 autoloading with Composer\n\
    \nThe PHP dependency management `Composer` is frequently used to implement the\
    \ `PSR-4` autoloading standard. In the `composer.json` file, you create a mapping\
    \ from namespaces to directories to configure `PSR-4` with `Composer`:\n\n```json\n\
    {\n  \"autoload\": {\n    \"psr-4\": {\n      \"Jazzon\\\\\": \"src/\"\n    }\n\
    \  }\n}\n```\n\nIn this example, any class in the `Jazzon` namespace will correspond\
    \ to a file in the `src/` directory. The `composer` will look for the file `src/Parsers/JsonParser.php`\
    \ to autoload the class `Jazzon\\Parsers\\JsonParser.php`.\n\n![](image_rsrc3CH.jpg)\n\
    \n#### JsonParser Autoloading\n\nAfter you have specified your namespaces, you\
    \ may build the autoloader file with `composer install` or `composer dump-autoload`.\
    \ Include the following code at the start of your PHP files to use `Composer`’s\
    \ autoloader:\n\n```php\n<?php  \n\n// Require the Composer autoloader, which\
    \ sets up class loading for your project.  \nrequire __DIR__ . '/vendor/autoload.php';\
    \  \n\n// Create an instance of the JsonParser class.  \n// Thanks to autoloader,\
    \ you don't need to require the class manually.  \n$parser = new Jazzon\\Parsers\\\
    JsonParser();\n```\n\nUnderstanding and implementing the `PSR-4` autoloading standard\
    \ is critical in current PHP development. It makes it easier to organize and manage\
    \ PHP classes, allowing for construction of more manageable and efficient applications.\
    \ We can simply implement `PSR-4` autoloading in our projects, such as the `Jazzon`\
    \ library, using `Composer`.\n\n## Composer and Autoloading\n\n`Composer` is a\
    \ must-have for modern PHP development. It is not only a dependency manager, but\
    \ it also provides a standardized framework for autoloading, which improves efficiency\
    \ when dealing with PHP projects. After looking into PHP namespaces and `PSR-4`\
    \ autoloading, let’s take a closer look at `Composer` and its relationship with\
    \ autoloading.\n\n`Composer` is a PHP dependency management tool that allows you\
    \ to define the libraries on which your project depends and will manage (install/update)\
    \ them for you. It maintains packages or libraries on a project basis, installing\
    \ them in a directory like `vendor`.\n\n### Composer and autoloading\n\nAside\
    \ from dependency management, `Composer` offers an important feature: it has a\
