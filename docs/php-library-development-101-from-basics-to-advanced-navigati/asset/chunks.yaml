    \ that adopt them.\n\n### Common patterns used in PHP libraries\n\nI. Singelton:\
    \ It is used to ensure that only one instance of a class should be created and\
    \ provide a global point of access to it. This pattern is commonly used for resource\
    \ management, logging, and database connections. Examples: - Monolog for logging\
    \ - PHP-DI for dependency injection.\n\nLet’s see an example of using the Singelton\
    \ pattern for creating a DB connection;\n\n<?php  \n\n// Declare a class named\
    \ Database to represent a database connection.  \n\nclass Database {  \n\n    //\
    \ Declare a private static variable to store the single instance of the Database\
    \ class.  \n\n    private static $instance;  \n\n    // Private constructor ensures\
    \ that the Database class cannot be instantiated from outside.  \n\n    private\
    \ function \\_\\_construct() {}  \n\n    // Declare a public static method to\
    \ get the single instance of the Database class.  \n\n    public static function\
    \ getInstance() {  \n\n        // Check if the instance is null. If so, create\
    \ a new instance of the Database class.  \n\n        if (self::$instance \\===\
    \ null) {  \n\n            self::$instance \\= new self();  \n\n            //\
    \ Initialize database connection here (this is just a comment; the connection\
    \ code would go here).  \n\n        }  \n\n        // Return the instance of the\
    \ Database class.  \n\n        return self::$instance;  \n\n    }  \n\n}  \n\n\
    // Get the single instance of the Database class.  \n\n$db \\= Database::getInstance();\
    \  \n\n// Dump the instance for debugging purposes.  \n\nvar\\_dump($db);\n\n\
    2.  Factory: Use this pattern whenever you want to create objects without specifying\
    \ their exact classes. It is useful when you want to create an object on runtime\
    \ based upon some conditions or the exact object type is unknown. Examples:\n\n\
    *   Laravel’s Factory class allows the easy creation of model instances.\n\n*\
    \   PHPUnit for PHP testing.\n\nAn example showcasing the Factory pattern in action;\n\
    \n<?php  \n\n// Declare an interface named Animal with a method speak.  \n\ninterface\
    \ Animal {  \n\n    public function speak();  \n\n}  \n\n// Declare a class named\
    \ Dog that implements the Animal interface.  \n\nclass Dog implements Animal {\
    \  \n\n    // Implement the speak method from the Animal interface.  \n\n    public\
    \ function speak() {  \n\n        echo \"Woof!\";  \n\n    }  \n\n}  \n\n// Declare\
    \ a class named Cat that implements the Animal interface.  \n\nclass Cat implements\
    \ Animal {  \n\n    // Implement the speak method from the Animal interface. \
    \ \n\n    public function speak() {  \n\n        echo \"Meow!\";  \n\n    }  \n\
    \n}  \n\n// Declare a class named AnimalFactory to create instances of animals.\
    \  \n\nclass AnimalFactory {  \n\n    // Declare a public static method to create\
    \ an Animal based on the provided type.  \n\n    public static function createAnimal($type)\
    \ {  \n\n        if ($type \\=== 'Dog') {  \n\n            // Return a new Dog\
    \ instance.  \n\n            return new Dog();  \n\n        } elseif ($type \\\
    === 'Cat') {  \n\n            // Return a new Cat instance.  \n\n            return\
    \ new Cat();  \n\n        }  \n\n        // Note: A more robust implementation\
    \ might include an else statement to handle unknown animal types.  \n\n    } \
    \ \n\n}  \n\n// Use the AnimalFactory to create a Dog.  \n\n$animal \\= AnimalFactory::createAnimal('Dog');\
    \  \n\n// Make the dog speak.  \n\n$animal\\->speak();\n\n3.  Adapter: Use this\
    \ pattern whenever you want two incompatible interfaces to work together. It is\
    \ useful when you also want to reuse existing code but it doesn’t quite fit your\
    \ current requirements. Examples:\n\n*   Guzzle for HTTP requests.\n\n*   Monolog\
    \ library also makes use of this pattern.\n\nAn example showcasing the Adapter\
    \ pattern in action;\n\n<?php  \n\n// Declare an interface named PaymentGateway\
    \ with a method pay.  \n\ninterface PaymentGateway {  \n\n    public function\
    \ pay($amount);  \n\n}  \n\n// Declare a class named Paypal to simulate a PayPal\
    \ payment.  \n\nclass Paypal {  \n\n    // Method to send a payment via PayPal.\
    \  \n\n    public function sendPayment($amount) {  \n\n        echo \"Paying via\
    \ PayPal: $amount\";  \n\n    }  \n\n}  \n\n// Declare a class named PaypalAdapter\
    \ that implements the PaymentGateway interface. This class acts as an adapter\
    \ for the Paypal class.  \n\nclass PaypalAdapter implements PaymentGateway { \
    \ \n\n    // Declare a private variable to store the Paypal instance.  \n\n    private\
    \ $paypal;  \n\n    // Constructor function to initialize the Paypal instance.\
    \  \n\n    public function \\_\\_construct() {  \n\n        $this\\->paypal \\\
    = new Paypal();  \n\n    }  \n\n    // Implement the pay method from the PaymentGateway\
    \ interface.  \n\n    public function pay($amount) {  \n\n        // Delegate\
    \ the payment process to the sendPayment method of the Paypal instance.  \n\n\
            $this\\->paypal->sendPayment($amount);  \n\n    }  \n\n}  \n\n// Create\
    \ a new PaypalAdapter instance.  \n\n$payment \\= new PaypalAdapter();  \n\n//\
    \ Make a payment of 50 via the PaypalAdapter.  \n\n$payment\\->pay(50);\n\n4.\
    \  Decorator: This enables you to add particular functionalities of an object\
    \ statically or dynamically at runtime just by enveloping it inside another object\
    \ that provides those functionalities. Examples:\n\n*   Guzzle makes use of it\
    \ by allowing the addition of middleware to modify the request/response objects.\n\
    \nAn example showcasing the Decorator pattern in action;\n\n<?php  \n\n// Define\
    \ an interface Logger that enforces the log method.  \n\ninterface Logger {  \n\
    \n    public function log($message);  \n\n}  \n\n// Implement the Logger interface\
    \ with a FileLogger which logs messages to a file.  \n\nclass FileLogger implements\
    \ Logger {  \n\n    public function log($message) {  \n\n        // Simulate logging\
    \ the message to a file.  \n\n        echo \"\\\\nLogging to file: $message\"\
    ;  \n\n    }  \n\n}  \n\n// Create a decorator for Logger to add database logging\
    \ functionality.  \n\nclass DatabaseLoggerDecorator implements Logger {  \n\n\
        private $logger;  // Hold an instance of Logger.  \n\n    // Constructor that\
    \ requires a Logger instance.  \n\n    public function \\_\\_construct(Logger\
    \ $logger) {  \n\n        $this\\->logger \\= $logger;  \n\n    }  \n\n    //\
    \ Overriding the log method to add database logging functionality.  \n\n    public\
    \ function log($message) {  \n\n        // Use the logger passed in the constructor\
    \ to log.  \n\n        $this\\->logger->log($message);  \n\n        // Add new\
    \ behavior: log the message to a database (simulated here).  "
