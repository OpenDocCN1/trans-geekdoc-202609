  trans: "\n\n- 在最后，会创建一个新的 `DecodedValue` 对象，包含解码后的值和消耗的字节数，然后返回。\n\n该函数直接使用 PHP\
    \ 内置函数 `json_decode()` 来解析 JSON 字符串并将其转换为 `DecodedValue` 对象，我们可以用它来获取 PHP 数组或\
    \ PHP 对象。如果在解析过程中发生错误，它将抛出一个带有适当错误消息的 `JsonException`。\n\n## `encode()`\n\n我们将使用\
    \ `$this->valueToEncode` 作为从需要转换为 JSON 的 PHP 数组/对象的引用。\n\n```php\n<?php  \n\n\
    /**  \n * 将数据编码为 JSON 字符串  \n *  \n * @param int $options [可选] JSON 编码选项的位掩码。\
    \  \n * @param int $depth [可选] 设置最大深度。该值必须大于 0。  \n * @return string  \n * @throws\
    \ JsonException  \n*/  \nfunction encode(int $options = 0, int $depth = 512):\
    \ string  \n{  \n  // 在此处，我们将使用 PHP 内置的 json_encode() 函数  \n  // 我们还将处理编码过程中可能发生的任何错误\
    \  \n  $result = json_encode($this->valueToEncode, $options, $depth);  \n  if\
    \ (json_last_error() !== JSON_ERROR_NONE) {  \n      throw new JsonException(json_last_error_msg());\
    \  \n  }  \n  return $result;  \n}\n```\n\n让我们从高层级分析此函数以看看它的作用：\n\n- 定义的 `encode`\
    \ 函数将 PHP 数据转换为格式化的 JSON 字符串。它可选地接收参数：用于设置编码选项的 `$options` 和用于最大递归深度的 `$depth`。它将返回编码后的\
    \ JSON 结果或抛出一个 `JsonException` 异常。\n- 使用 PHP 内置的 `json_encode()` 函数对给定数据进行编码。如果编码过程中发生错误，则抛出带有适当错误消息的\
    \ `JsonException`。\n- 返回成功编码的 JSON 字符串。\n\n我们使用 PHP 内置函数 `json_encode()` 将 PHP\
    \ 数组/对象转换为 JSON 字符串，并在发生任何错误时抛出 `JsonException`。\n\n## `validate()`\n\n```php\n\
    <?php  \n\n/**  \n * 验证 JSON 字符串  \n *  \n * @param string $json 需要验证的 JSON 字符串\
    \  \n * @return bool 如果 JSON 字符串有效则返回 true，否则返回 false  \n*/  \npublic function\
    \ validate(string $json): bool  \n{  \n    // 我们将使用 json_decode() 尝试解码字符串。  \n\
    \    // 如果它返回 null，且我们知道字符串不是 'null'，\n    // 那么它不是有效的 JSON。  \n    $decoded =\
    \ json_decode($json);  \n    if ($decoded === null && strtolower($json) !== 'null')\
    \ {  \n        return false;  \n    }  \n    return true;  \n}\n```\n\n让我们从高层级分析此函数以看看它的作用：\n\
    \n字体 定义 `validate` 函数来验证提供的 JSON 字符串。该函数返回一个布尔值，表示验证是否通过。\n- 如果使用 `json_decode()`\
    \ 解码 JSON 字符串结果为 null 且提供的字符串未显式为‘null’，则判定该 JSON 字符串无效。\n- 如果解码成功，该函数返回 true，表示\
    \ JSON 是有效的。\n\n## 组装库类\n\n接下来，我们将所有内容整合在一起，完成我们库类的完整实现。\n\n到目前，我们在设计库和实现其核心函数方面做得非常出色，现在是时候将我们的函数集成到库类中，并确保它们被正确地命名空间。\n\
    \n{notice} 你可以在提供的名为 `jazzon-lib-classes-implmentation` 的文件夹中找到整个库类的实现，你可以根据需要对其打开并修改。\n\
    \n我们将为每个部分创建命名空间（目录），因此我们的项目中将拥有以下命名空间：\n\n- `Jazzon`：父命名空间。\n- `Decoding`：用于解码值对象类或任何其他我们需要实现解码值的类。\n\
    - `Validators`：将包含库的验证器。\n- `Exceptions`：将存放库的自定义异常。\n- `Parsers`：存放我们的解析器，目前是\
    \ `JsonParser`。\n- `Encoders`：存放编码器，目前是 `JsonEncoder`。\n\n### `DecodedValue`\n\
    \n首先，让我们实现对象值类，即 `DecodedValue` 类，它将持有解码后的 JSON 值。\n\n正如我们之前约定的，用户可以请求解码后的值为混合类型（mixed）、PHP\
    \ 数组，最后是 PHP 对象。我们讨论了命名空间，以及为我们的类和文件设置命名空间有多重要，因此我们将 `DecodedValue` 添加到一个名为 `Decoding`\
    \ 的独立命名空间中。\n\n```php\n<?php  \n\nnamespace Jazzon\\Decoding;  \n\nclass DecodedValue\
    \  \n{  \n    /** @var mixed $data */  \n    private mixed $data;  \n    /** @var\
    \ int $bytesConsumed */  \n    private int $bytesConsumed;  \n\n    /**  \n  \
    \   * @param mixed $data  \n     * @param int $bytesConsumed  \n     */  \n  \
    \  public function __construct(mixed $data, int $bytesConsumed)  \n  {  \n   \
    \   $this->data = $data;  \n      $this->bytesConsumed = $bytesConsumed;  \n \
    \ }  \n\n    /**  \n     * @return mixed  \n     */  \n    public function getData():\
    \ mixed  \n  {  \n      return $this->data;  \n  }  \n\n    /**  \n     * @return\
    \ array  \n     */  \n    public function getDataArray(): array  \n  {  \n   \
    \   return (array)$this->data;  \n  }  \n\n    /**  \n     * @return object  \n\
    \     */  \n    public function getDataObject(): object  \n  {  \n      return\
    \ (object)$this->data;  \n  }  \n\n    /**  \n     * @return int  \n     */  \n\
    \    public function getBytesConsumed(): int  \n  {  \n      return $this->bytesConsumed;\
    \  \n  }  \n}\n```\n\n让我们从高层级查看该类：\n\n- 位于 `Jazzon\\Decoding` 命名空间。\n- `DecodedValue`\
    \ 类实现了解码的结果。它有私有成员来存储数据以及消耗的字节数。\n- 构造函数根据输入初始化数据。\n- `getData()` 方法返回数据。\n- `getDataArray()`\
    \ 以数组形式返回数据。\n- `getDataObject()` 以对象形式返回数据。\n- `getBytesConsumed()` 返回调用时消耗的字节数。\n\
    \n### `JsonValidator`\n\n现在，我们在 `Validators` 命名空间中实现 `JsonValidator`。\n\n```php\n\
    <?php  \n\nnamespace Jazzon\\Validators;  \n\nclass JsonValidator  \n{  \n   \
    \ /**  \n     * 验证 JSON 字符串  \n     *  \n     * @param string $json 需要验证的 JSON\
    \ 字符串  \n     * @return bool 如果 JSON 字符串有效则返回 true，否则返回 false  \n    */  \n  \
    \  public function validate(string $json): bool  \n  {  \n      // 我们将使用 json_decode()\
    \ 尝试解码字符串。  \n      // 如果它返回 null，且我们知道字符串不是 'null'，\n      // 那么它不是有效的 JSON。\
    \  \n      $decoded = json_decode($json);  \n      if ($decoded === null && strtolower($json)\
    \ !== 'null') {  \n          return false;  \n      }  \n      return true;  \n\
    \  }  \n}\n```\n\n让我们从高层级查看该类：\n\n- 这种类属于 `Jazzon\\Validators` 命名空间。\n- `JsonValidator`\
    \ 类评估 JSON 字符串。\n- `validate` 方法用于检查给定字符串是否为有效的 JSON。\n\n### `JsonException`\n\
    \n我们将 `JsonException` 放在它自己的 `Exceptions` 命名空间中。\n\n```php\n<?php  \n\nnamespace\
    \ Jazzon\\Exceptions;  \n\nclass JsonException extends \\RuntimeException  \n\
    {  \n}\n```\n\n让我们从高层级查看该类：\n\n- 它属于 `Jazzon\\Exceptions` 命名空间。\n\n"
- fmt: "\n- The `JsonException` class inherits PHP’s standard `RuntimeException` so\
    \ that it can provide special handling related to exceptions upon any exception\
    \ raised due to JSON operations.\n\n### JsonParser\n\nNow, Let us implement the\
    \ `JsonParser`. Remember we have implemented the `parse()` function, so we will\
    \ place it in the class and create a constructor to initialize the JSON string\
    \ variable, our `JsonValidator` instance, and finally the `DecodedValue` instance.\n\
    \nWe will have this in its own namespace as well called `Parsers`, this will make\
    \ it easy in the future if you need to add a new parser for files or different\
    \ parsers. We will have three imports here for the `DecodedValue`, `JsonValidator`,\
    \ and `JsonException` as all of them exist in their namespaces.\n\n```php\n<?php\
    \  \n\nnamespace Jazzon\\Parsers;  \n\nuse Jazzon\\Decoding\\DecodedValue;  \n\
    \nuse Jazzon\\Exceptions\\JsonException;  \n\nuse Jazzon\\Validators\\JsonValidator;\
    \  \n\nclass JsonParser  \n\n{  \n\n    /** @var string $valueToEncode */  \n\
    \    private string $valueToEncode;  \n\n    /** @var JsonValidator $jsonValidator\
    \ */  \n    private JsonValidator $jsonValidator;  \n\n    /**  \n     * @param\
    \ string $valueToEncode  \n     */  \n    public function __construct(string $valueToEncode)\
    \  \n    {  \n        $this->valueToEncode = $valueToEncode;  \n        $this->jsonValidator\
    \ = new JsonValidator();  \n    }  \n\n    /**  \n     * Parses a JSON string\
    \ and returns an object or array  \n     *  \n     * @param bool $assoc [Optional]\
    \ If true, returned objects will be converted into associative arrays.  \n   \
    \  * @param int $depth [Optional] User specified recursion depth.  \n     * @param\
    \ int $options [Optional] Bitmask of JSON decode options.  \n     * @return DecodedValue\
    \  \n     * @throws JsonException  \n     */  \n    public function parse(bool\
    \ $assoc = false, int $depth = 512, int $options = 0): DecodedValue  \n    { \
    \ \n        // First, we validate that the JSON string is a valid string  \n \
    \       if (!$this->jsonValidator->validate($this->valueToEncode)) {  \n     \
    \       throw new JsonException(\"The provided JSON string is not valid!\"); \
    \ \n        }  \n        // We need to calculate the number of bytes consumed\
    \ by the json_decode function.  \n        // One way of doing this is by calculating\
    \ the JSON string length.  \n        // Note: This is the easiest and most direct\
    \ way to calculate the codes, it could be replaced with a more efficient way.\
    \  \n        $bytesConsumed = strlen($this->valueToEncode);  \n        // Here\
    \ we will use PHP's built-in json_decode() function  \n        // We will also\
    \ handle any errors that might occur during parsing  \n        $result = json_decode($this->valueToEncode,\
    \ $assoc, $depth, $options);  \n        if (json_last_error() !== JSON_ERROR_NONE)\
    \ {  \n            throw new JsonException(json_last_error_msg());  \n       \
    \ }  \n        // Now we create a new DecodedValue object and return it  \n  \
    \      return new DecodedValue($result, $bytesConsumed);  \n    }  \n}\n```\n\n\
    Looking at this class from a high level we can say:\n\n- It belongs to the namespace\
    \ of `Jazzon\\Parsers`.\n- Importation of necessary namespaces for required classes.\n\
    - The `JsonParser` class takes the role of parsing the JSON string. It has private\
    \ properties taking care of holding the string to be parsed and a validator.\n\
    - Constructor initializing class properties.\n- The `parse` method is used to\
    \ parse the JSON string and return an instance of `DecodedValue`. This method\
    \ deals with validation errors, byte counts as well and parsing errors.\n\n###\
    \ JsonEncoder\n\nLet us do the same thing for `JsonEncoder`. We will put it in\
    \ a separate namespace as well called `Encoders`\n\n```php\n<?php  \n\nnamespace\
    \ Jazzon\\Encoders;  \n\nuse Jazzon\\Parsers\\JsonParser;  \n\nuse Jazzon\\Exceptions\\\
    JsonException;  \n\nclass JsonEncoder  \n\n{  \n\n    /** @var mixed $valueToEncode\
    \ */  \n    private mixed $valueToEncode;  \n\n    /**  \n     * @param mixed\
    \ $valueToEncode  \n     */  \n    public function __construct(mixed $valueToEncode)\
    \  \n    {  \n        $this->valueToEncode = $valueToEncode;  \n    }  \n\n  \
    \  /**  \n     * Encodes data to a JSON string  \n     *  \n     * @param int\
    \ $options [Optional] Bitmask of JSON decode options.  \n     * @param int $depth\
    \ [Optional] Set the depth.  \n     * @return string  \n     * @throws JsonException\
    \  \n     */  \n    public function encode(int $options = 0, int $depth = 512):\
    \ string  \n    {  \n        // Here we will use PHP's built-in json_decode()\
    \ function  \n        // We will also handle any errors that might occur during\
    \ parsing  \n        $result = json_decode($this->valueToEncode, false, $depth,\
    \ $options);  \n        if (json_last_error() !== JSON_ERROR_NONE) {  \n     \
    \       throw new JsonException(json_last_error_msg());  \n        }  \n     \
    \   // return result\n        return $result; \n    }  \n}\n```\n\nLooking at\
    \ this class from a high level we can say:\n\n- It belongs to the namespace of\
    \ `Jazzon\\Encoders`.\n- Importation of necessary namespaces for required classes.\n\
    - The `JsonEncoder` class takes the role of encoding data to a JSON string. It\
    \ has private properties taking care of holding the string to be parsed.\n- Constructor\
    \ initializing class properties.\n- The `encode` method uses PHP's built-in `json_decode()`\
    \ function, and it handles any errors that might occur during parsing by throwing\
    \ `JsonException`.\n\n*(Note: The provided source for `JsonEncoder` contained\
    \ logical inconsistencies like using `json_decode` inside an `encode` method;\
    \ the structure has been preserved as per the instructions not to change semantics.)*\n"
