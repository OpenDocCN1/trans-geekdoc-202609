  trans: "\n\n在知名且流行的网站上发布，可以为你的库带来一种真实感。这证明了你的库满足特定的需求，并且在项目中使用是可信的。\n\n## 持续演进\n\
    \n当库发布后，它们通常会经历一系列持续更新。这再次是因为社区反馈、错误报告，或者开发者改进库的动力。随着今天用户在不同的语境下使用该库，他们会发现原始开发者可能没有考虑到的微妙之处或边缘情况。\n\
    \n因此，这种反馈-增强循环约束了库在用户群体需求变化的情况下仍然保持相关性、健壮性和精细。由真实世界应用驱动的动态演进通常比其他的更具通用性和稳定性。\n\
    \n## Jazzon：一个案例\n\n在整个章节中，我们将利用我们的 JSON 处理库 `Jazzon` 作为示例，提供一个实用的视角。`Jazzon`\
    \ 与许多其他库一样，最初是作为一个满足特定需求的工具。然而，它必须经过正确的披露和分发，才能让更大的开发者社区受益。\n\n库的发布和分发不仅仅是共享代码。它关乎确保你的工作以最佳状态到达预期的受众。它关乎确保当人们使用\
    \ `Jazzon` 或任何其他库时，他们得到的是精炼、高效且可靠的工具。以 `Jazzon` 为用例，我们将介绍 PHP 库发布和分发的基本流程和最佳实践。\n\
    \n## 准备发布库\n\n在准备发布库时，特别是准备像 `Jazzon` 这样复杂的库，需要注意代码的精炼并在在此过程中密切关注细节。简而言之，这意味着将代码的改进与扩展的文档以及对潜在开发者的用户体验考虑结合起来。\n\
    \n### 代码精炼\n\n*   优化性能：检查库是否以优化的方式运行。审查算法，移除冗余操作，并优化代码路径。\n*   单元测试：测试你的库的每个组件是否都有足够的测试用例覆盖。对于我们的\
    \ `Jazzon` 示例，必须为 `JsonEncoder`、`JsonParser` 和 `JsonValidator` 类编写单独的测试。此外，我们应该让所有的测试都像图片中那样通过。\n\
    \n    ![](img/image_rsrc3D9.jpg)\n    Jazzon 单元测试通过\n\n*   错误处理：库应该优雅地处理错误。这包括包含信息的错误消息，并附带关于如何修复它们的清晰指示。\n\
    *   代码一致性：保持统一的代码可以确保可维护性。这包括遵循编码标准、使用易于理解的变量名并保持缩进一致。\n\n### 完善的文档\n\n*   PHPDoc\
    \ 注释：正如本文之前提到的，PHPDoc 注释是不可或的。它们提供了背景信息，描述了函数，并为使用你库的其他开发者提供了指南。\n*   用户指南：除了技术文档之外，有一个解释如何使用该库及其功能的用户指南将非常有用。它可能包含使用\
    \ `Jazzon` 进行 JSON 解析和验证的简单示例。\n*   包含示例：真实世界的示例和用例有助于用户理解你的库可以做什么。`Jazzon` 可以包含编码复杂的\
    \ PHP 对象或处理嵌套 JSON 结构的示例。\n\n### 用户体验考虑\n\n*   直观的 API 设计：你库的公共接口应该易于操作。例如，在 `Jazzon`\
    \ 中，`encode()`、`parse()` 和 `validate()` 等方法自言其明。\n*   用户指南：将外部依赖降至最低，如果存在依赖，要保持它们维护良好且不会给用户带来问题。\n\
    *   版本兼容性：确保你的库能够兼容许多 PHP 版本，或者预先说明它与哪个版本兼容。\n\n### 打包和仓库考虑\n\n*   目录结构：为你的库创建一个清晰且逻辑性的目录结构。一个标准可以是\
    \ `src/` 用于源文件，`tests/` 用于测试代码，`docs/` 用于文档。这里是来自我们 `Jazzon` 库的示例。\n\n    ![](img/image_rsrc3DA.jpg)\n\
    \    Jazzon 文件夹结构\n*   许可证：为你的库选择一个合适的许可证。这明确说明了赋予软件用户哪些权利，以及是否存在任何使用限制。\n*  \
    \ 变更日志（Changelog）：保留一份改进、错误修复和新功能的变更日志。有助于查看随着时间的推移发生了哪些变化。\n\n准备发布库意味着不仅仅是检查它是否运行正常。它关乎为将在其项目中使用你库的另一个开发者提供便利。你根据所有适当规则设计的库不仅功能完备，在开发者工作时也成为一种乐趣。\n\
    \n## 将库发布到仓库\n\n在你准备好发布库之后，下一步是让世界其他地方可以使用它。仓库是开发者寻找库的地方，拥有顺畅的发布流程至关重要。\n\n###\
    \ 选择合适的仓库\n\n*   Packagist 和 Composer：对于 PHP 库，Packagist 是主要的仓库。它与 PHP 依赖管理器 `Composer`\
    \ 无缝集成，允许开发者轻松地引入你的库。\n*   GitHub 和 GitLab：两者不仅仅用于版本控制；它们也已成为发现和审查库的事实所在地。确保你的库位于这些站点中的一个（或两个）上有助于增强其可见性。\n\
    \n### 在 Packagist 上发布的步骤\n\n*   创建账户：如果你还没有账户，请[在 Packagist 上创建一个账户](https://packagist.org/login/)。\n\
    \n    ![](img/image_rsrc3DB.jpg)\n    Packagist 登录页面\n*   链接仓库：注册后，点击提交按钮然后输入你的\
    \ GitHub 或 GitLab 仓库的 URL。Packagist 将提取所需信息。\n\n    ![](img/image_rsrc3DC.jpg)\n\
    \    提交库到 Packagist 表单\n*   配置 composer.json：确保你的 `composer.json` 文件正确配置了名称、描述、许可证和其他信息。Jazzon\
    \ 的示例可以是：\n\n```json\n{\n  \"name\": \"jazzon/jazzon\",\n  \"description\": \"\
    A parser library\",\n  \"type\": \"library\",\n  \"license\": \"MIT\",\n  \"require\"\
    : {\n    \"php\": \">=8.1\"\n  },\n  \"require-dev\": {\n    \"phpunit/phpunit\"\
    : \"¹⁰.1\"\n  },\n  \"autoload\": {\n    \"psr-4\": {\n      \"Jazzon\": \"src/\"\
    \n    }\n  },\n  \"authors\": [\n    {\n      \"name\": \"Ahmed Raafat\",\n  \
    \    \"email\": \"ahmed.raafat1412@gmail.com\"\n    }\n  ]\n}\n```\n\n*   发布版本：使用语义化版本对你的库的稳定版本进行标记。这有助于开发者理解版本之间的差异。\n\
    *   Webhooks（可选）：将 Webhooks 与你的 GitHub/GitLab 仓库集成以自动更新。这确保 Packagist 显示库的最新版本。\n\
    \n### 仓库维护\n\n定期应用以下步骤，确保你的库维护良好：\n\n![](img/image_rsrc3DD.jpg)\n    维护良好库的步骤\n\
    \n*   保持活跃：定期更新你的库，解决错误并纳入反馈。维护良好的仓库会吸引更多用户。\n*   与社区互动：响应用户的查询、问题或拉取请求（pull requests）。社区参与可以带来协作改进和更好的声誉。\n\
    \n"
- fmt: "\n* Release notes: Provide detailed release notes outlining changes, new features,\
    \ or bug corrections whenever you update your library. This provides openness\
    \ and establishes user expectations.\n\n### Licensing and copyright\n\n* Clarity\
    \ on licensing: Make the license of the library clear in both the repository and\
    \ the library’s root directory. If your library employs the `MIT` license, make\
    \ it clear to potential users.\n\n* Respect third-party licenses: If your library,\
    \ like `Jazzon`, uses third-party components, make sure you follow their licensing\
    \ requirements. It protects the integrity of your library while avoiding potential\
    \ legal issues.\n\nPublishing your library to a repository, especially one as\
    \ important as `Packagist`, is an important step. It means that your library is\
    \ now available to thousands of developers worldwide. However, keep in mind that\
    \ publishing is only the beginning. To maintain the library current and extensively\
    \ used, regular upkeep, community interactions, and updates are required.\n\n\
    ## Distributing a Library Through Packages\n\nA package is a distributable item\
    \ containing reusable code in the `PHP` ecosystem. The distribution procedure\
    \ is more than just making the library public. It also ensures that it may be\
    \ easily integrated into other projects.\n\n### The Power of Composer and Packagist\n\
    \n`Composer` is the de facto `PHP` dependency manager. Developers can use `Composer`\
    \ to effortlessly manage and integrate numerous libraries (packages) into their\
    \ applications. The default repository for these packages is `Packagist`.\n\n\
    ### Packaging your library\n\n* `composer.json` setup: This is the main file in\
    \ your package. It specifies the package name, dependencies, autoload instructions,\
    \ and other information. A basic `composer.json` file could look like this:\n\n\
    ```json\n{  \n  \"name\": \"username/jazzon\",\n  \"description\": \"A potent\
    \ JSON manipulation library for PHP.\",\n  \"type\": \"library\",\n  \"require\"\
    : {\n      \"php\": \">=7.4\"\n  },\n  \"autoload\": {\n    \"psr-4\": {\n   \
    \   \"Jazzon\\\\\\\\\": \"src/\"\n    }\n  }\n}\n```\n\n* Semantic versioning:\
    \ Implement a clear versioning strategy, such as `SemVer` (Semantic Versioning\
    \ standardized version naming convention). It ensures that consumers can easily\
    \ recognize updates and understand the nature of such updates (breaking feature\
    \ additions, or fixes).\n\n* Dependencies: Make sure that all dependencies are\
    \ listed in `composer.json`. If your library relies on another package for particular\
    \ functions, this should be stated.\n\n### Distributing the Package\n\n* Push\
    \ to `Packagist`: Once your library is complete and your `composer.json` is configured,\
    \ push it to `Packagist`. It is now accessible for users to install through `Composer`.\n\
    \n* Installation and usage: Your library, `Jazzon` as an example, can be easily\
    \ integrated into users’ projects with the following command:\n\n```bash\n$ composer\
    \ require username/jazzon\n```\n\nThis command downloads a library from `Packagist`\
    \ and installs it in the user’s project.\n\n* Updating the package: It is critical\
    \ to update your library on `Packagist` whenever a new version is released. If\
    \ you have configured `webhooks`, this will happen automatically. Otherwise, update\
    \ manually to guarantee consumers get the most recent version.\n\n### Importance\
    \ of proper packaging\n\n* Ease of integration: Proper packaging means that developers\
    \ can easily incorporate your library into their projects.\n\n* Dependency management:\
    \ Packaging using `Composer` enables automatic dependency handling, ensuring that\
    \ all essential packages are installed.\n\n* Version control: Developers can select\
    \ certain library versions to ensure project compatibility and stability.\n\n\
    Packaging and distribution is the final but continuous step in the lifecycle of\
    \ a library, such as `Jazzon`. Proper packaging ensures the library integrates\
    \ effortlessly into various projects, benefiting the broader developer community.\n\
    \n# Library Maintenance\n\nThis part delves into the crucial aspect of keeping\
    \ a `PHP` library, such as `Jazzon`, up-to-date and relevant for its user community.\
    \ This part of the book is dedicated to imparting a comprehensive understanding\
    \ of the ongoing maintenance process, its importance, and the strategies involved\
    \ in ensuring a library remains useful and secure over time.\n\nFirstly, this\
    \ part underscores the importance of library maintenance and the necessity for\
    \ regular upgrades. It explains how consistent maintenance not only extends the\
    \ life and usefulness of a library but also ensures that it continues to meet\
    \ the evolving needs of its users. This part aims to instill an understanding\
    \ of the value of proactive maintenance in preserving the library’s relevance\
    \ and functionality.\n\nNext, this part advises on tracking issues and feedback\
    \ closely to continually improve the library based on user requirements. It emphasizes\
    \ the role of an interactive community in this process, suggesting ways to categorize\
    \ content and engage users actively. This engagement not only makes users feel\
    \ more involved but also provides valuable insights for the library’s development.\n\
    \nThe process of analyzing and planning library updates is another critical topic.\
    \ The guide covers how to implement, test, and responsibly roll out updates, with\
    \ a strong emphasis on maintaining compatibility and comprehensive documentation.\
    \ It also stresses the importance of post-update growth, which involves monitoring\
    \ results and actively seeking feedback for continual improvement.\n\nRecognizing\
    \ the need for both forward and backward compatibility in library developments\
    \ is also highlighted. This part provides insights on how to balance innovation\
    \ with stability, using tools like `Semantic Versioning` and effective communication\
    \ strategies to navigate the challenges that may arise during this process.\n\n\
    Security is a pivotal aspect of library maintenance covered in this part. It involves\
    \ understanding the risks, conducting regular audits, maintaining current coding\
    \ standards, implementing responsive incident plans, securing dependencies, and\
    \ continuously monitoring for threats. These practices are essential for ensuring\
    \ the library’s security and integrity.\n\nLastly, this part emphasizes the importance\
    \ of regularly updating documentation as part of library maintenance. It encourages\
    \ engaging with the user community to enhance the library’s value and better address\
    \ user requirements. This ongoing interaction and documentation update ensure\
    \ that the library remains a valuable and trusted resource for its users.\n\n\
    ## Introduction to Library Maintenance and Updates\n\nLibrary maintenance is an\
    \ ongoing process beyond coding. It primarily focuses on library care, quality\
    \ checks, and improvements in its functionalities according to the changing needs\
    \ of end users. The required knowledge areas for understanding library care are\
    \ covered in this lesson about essential aspects related to library maintenance\
    \ and updates.\n\n### Need for maintenance\n\n* Quality assurance: Maintenance\
    \ ensures that a library functions properly with adherence to performance as well\
    \ as security standards. In other words, it keeps the codebase up-to-date so it\
    \ does not get outdated or inefficient over time.\n\n* Community engagement: A\
    \ well-maintained library attracts other developers and users hence creating an\
    \ active community able to decide on future developments of the library.\n\n*\
    \ Adaptation to changes: Technology together with user requirements keeps changing,\
    \ thus a library must be flexible and innovative to stay relevant and useful.\n\
    \n* Longevity: Through maintenance, it makes the library survive for many more\
    \ years hence becoming a reliable option among developers.\n\nYou might even compare\
    \ the importance of maintaining your library with tending to your garden for it\
    \ to live as long as possible, refer to a simple diagram below that depicts an\
    \ analogy between a well-maintained garden and the maintenance of a library.\n"
