  trans: "\n\n```php\n}\n\n}\n\n// 工具函数的命名空间。\n\nnamespace Jazzon\\Utils;\n\nclass\
    \ JsonUtils {\n    // 此类将包含与 JSON 相关的工具函数。\n    // 这种分离确保了工具函数不会弄乱其他类。\n    public\
    \ function someUtilityFunction($data) {\n        // ... 此处是工具函数的代码 ...\n    }\n\
    }\n```\n\n// 每个类都包含在自己的命名空间中并处理 JSON 的特定方面（解析、编码或工具函数），\n确保了关注点分离，并且每个类都具有单一职责。\n\
    通常，此脚本代表了如何根据功能需求或关注点分离原则，使用命名空间来组织类和功能。\n\n### 接口与抽象类\n\n在 PHP 库中实现模块化设计的另一种策略是使用接口和抽象类为每个模块定义通用的\
    \ API。这通过允许模块被轻松替换或扩展，有助于促进代码的可用性和模块化。\n\n例如，在我们的 `Jazzon` 库中，我们可以为 JSON 解析定义一个接口：\n\
    \n```php\n<?php\n// 定义命名空间有助于组织代码并避免冲突。\n\nnamespace Jazzon\\Parsing;\n\n// 接口是一种合约，规定了类应该如何结构。\n\
    // 此 `JsonParserInterface` 确保任何实现它的类都将拥有 `parse` 方法。\ninterface JsonParserInterface\
    \ {\n    // 此方法声明确保任何实现类必须提供\n    // 一个接收单个参数（JSON 数据）并提供所需功能的 'parse' 方法。\n \
    \   public function parse($json);\n}\n```\n\n然后，我们可以在我们的 `JsonParser` 类中实现这个接口：\n\
    \n```php\n<?php\n// 命名空间是分组相关类并避免命名冲突的一种。\n\nnamespace Jazzon\\Parsing;\n\n//\
    \ `JsonParser` 类实现了 `JsonParserInterface`，这意味着\n// 它必须为接口中声明的所有方法提供实现。\nclass\
    \ JsonParser implements JsonParserInterface {\n    // 实现 `JsonParserInterface`\
    \ 中的 `parse` 方法。\n    // 此方法将处理解析给定 JSON 字符串的逻辑。\n    public function parse($json)\
    \ {\n        // JSON 解析代码将放在此处，将输入的 JSON 字符串\n        // 转换为相应的 PHP 结构（如关联数组）。\n\
    \    }\n}\n```\n\n通过为 JSON 解析定义此通用接口，我们可以轻松地切换 `JsonParser` 类的不同实现，使库更具模块化和扩展性。\n\
    \n### 依赖注入 (DI)\n\n我们提到的模块化设计的另一个关键原则是松耦合，这意味着模块不应该直接相互依赖。实现这一点的方法是通过依赖注入，它允许模块依赖于接口而不是具体的实现。\n\
    \n例如，在我们的 `Jazzon` 库中，我们可以使用 DI 为 `JsonSerializer` 对象提供一个 `JsonParser` 对象，而不是让\
    \ `JsonSerializer` 对象创建它自己的 `JsonParser` 对象。\n\n```php\n<?php\n// 使用命名空间分组相关类并避免命名冲突。\n\
    \nnamespace Jazzon\\Encoding;\n\n// 导入 `JsonParserInterface` 用于在构造函数中类型提示。\nuse\
    \ Jazzon\\Parsing\\JsonParserInterface;\n\nclass JsonSerializer {\n    // 声明一个私有属性来存放我们的\
    \ `JsonParser` 实例。\n    // 这确保依赖关系仅在该类内可用。\n    private $jsonParser;\n\n    //\
    \ 依赖注入：我们正在将一个实现了\n    // `JsonParserInterface` 的对象注入到 `JsonSerializer` 类中。\n\
    \    // 这将 `JsonSerializer` 类与任何特定的解析器实现解耦。\n    public function __construct(JsonParserInterface\
    \ $jsonParser) {\n        $this->jsonParser = $jsonParser;\n    }\n\n    // 处理\
    \ JSON 编码的方法。\n    public function encode($data) {\n        // JSON 编码逻辑将放在此处，将输入的\n\
    \        // PHP 数据转换为相应的 JSON 字符串。\n    }\n}\n```\n\n通过将 `JsonParser` 依赖注入到 `JsonSerializer`\
    \ 中，\n我们实现了组件之间的松耦合，使系统\n更具维护性、灵活性且更容易测试。\n\n总而言之，此脚本演示了应用依赖注入来构建灵活、可维护且松耦合代码结构的积极意义。\n\
    \n最后，模块化设计是创建像我们的 `Jazzon` 库这样可维护且可扩展的 PHP 库的强大工具。通过使用命名空间、接口、抽象类和依赖注入，我们可以创建一个在各种应用程序中于理解、修改和使用的库。\n\
    \n# 命名空间与自动加载\n\n这部分深入探讨了命名空间和自动加载的关键方面。这一全面部分旨在增强读者在大型应用程序中管理和组织代码的理解与技能。它从对命名空间的深入检查开始，命名空间是封装的一种本质机制。读者将接触到命名空间声明、使用策略和其他相关主题的复杂性。\n\
    \n课程随后进展到对命名空间的更高级的探索。它涵盖了核心概念，如命名空间运算符、别名、导入。这种深度探讨使读者具备了处理命名空间复杂性所需的专业知识。\n\n\
    PHP 中的自动加载是一种自动类加载器机制，它对更整洁、更易维护的代码有显著贡献，是本部分的另一个关注重点。读者将学习 `spl_autoload_register`\
    \ 函数以及如何在自动加载器中管理命名空间，包括 `Composer` 自动加载器的实现。学习延伸到 PHP 的 `PSR-4` 自动加载标准，这是高效构建和加载\
    \ PHP 类的关键工具。提供了来自 `Jazzon` 库的实用示例来说说明 `PSR-4` 标准的能力和应用。\n\n此外，课程还探索了 PHP 依赖管理的基石\
    \ `Composer`，强调了它在自动加载中的重要作用。通过检查 `Jazzon` 库中 `Composer` 的使用，展示了它是如何提高 PHP 项目管理效率的。最后，本部分通过引导读者遵循\
    \ PHP 命名空间和自动加载的最佳实践而结束。这些实践侧重于提高代码可读性、防止名称冲突、维护结构一致性并高效管理依赖，如 `Jazzon` 库所示。\n\
    \n## 深入探讨命名空间\n\n在 PHP 中，命名空间用于让具有相同名称的项目可以共存而不产生冲突。对于 PHP 库和大型应用程序，我们需要系统地管理和组织代码，它们非常重要。我们稍后将讨论它们。\n\
    \n{notice} 不要担心用于说明的类；你将在后续章节中学习它们。\n\n### 什么是命名空间？\n\n假设你正在编写一本书，每章都专注于一个主题。每章的不同章节和子节可以有不同的名称。但如果它们位于各自章节的范围内，那么第一章可以重复其包含的任何章节名称，而不会与第二章产生冲突。PHP\
    \ 中的命名空间也是如此。\n\n"
- fmt: "\nPHP has the `namespace` keyword for declaring namespaces. The idea behind\
    \ these namespaces is to save code entities from making unwanted collisions because\
    \ of sharing a common name. You can use namespaces to side-step naming conflicts\
    \ while using classes, functions, and constants having identical names at various\
    \ locations.\n\n## Declaring namespaces\n\nTo declare a namespace, use the keyword\
    \ `namespace` followed by the name of your namespace. The most important thing\
    \ to remember is that the declaration of the namespace should come first in your\
    \ PHP file before any other code (excluding `declare` statements and comments).\n\
    \nExample:\n\n```php\n<?php  \n\n// Declare that the code in this file belongs\
    \ to the \"Jazzon\" namespace  \n\nnamespace Jazzon;\n```\n\nBy using the keyword\
    \ `namespace` followed by the name of a namespace (here `Jazzon`), it declares\
    \ its visibility henceforth towards all other codes in a particular given file.\n\
    \n## Using namespaced entities\n\nYou may access an entity defined inside a namespace\
    \ with either of the following three types:\n\n1. **Fully Qualified Name**: Include\
    \ the fully qualified name (FQN) of the class, function, or constant beginning\
    \ from the global namespace:\n\n```php\n<?php  \n\n// Instantiate a new instance\
    \ of the `DecodedValue` class from the `Jazzon\\Decoding` namespace  \n\n// by\
    \ providing `$data` and `$bytesConsumed` as constructor arguments  \n\n$result\
    \ = new \\Jazzon\\Decoding\\DecodedValue($data, $bytesConsumed);\n```\n\nThe backslash\
    \ preceding the class name (and separating from it with a backslash as well) tells\
    \ the script to reference this class’s global namespace location. Here, for example,\
    \ instantiates an instance of the `DecodedValue` class for the `Jazzon\\Decoding`\
    \ namespace. At its instantiation, constructor arguments `$data` and `$bytesConsumed`\
    \ are passed into the `DecodedValue` class.\n\n2. **Import with use**: Use the\
    \ `use` statement to import a class, function or constant and then it can directly\
    \ be used within your code without the namespace prefix:\n\n```php\n<?php  \n\n\
    // Import the `DecodedValue` class from the `Jazzon\\Decoding` namespace so it\
    \ can be referenced without the full namespace  \n\nuse Jazzon\\Decoding\\DecodedValue;\
    \  \n\n// Instantiate a new instance of the `DecodedValue` class (from the imported\
    \ namespace)   \n\n// by providing `$data` and `$bytesConsumed` as constructor\
    \ arguments  \n\n$result = new DecodedValue($data, $bytesConsumed);\n```\n\nLike\
    \ before, constructor arguments `$data` and `$bytesConsumed` are passed during\
    \ instantiation.\n\n3. **Aliasing or Importing with use**: When two classes of\
    \ the same name exist in one file, you could make an alias for either by using\
    \ the `as` keyword:\n\n```php\n<?php  \n\n// Import the `DecodedValue` class from\
    \ `AnotherLibrary\\Decoding`  \n\nuse AnotherLibrary\\Decoding\\DecodedValue;\
    \  \n\n// Import the `DecodedValue` class from `Jazzon\\Decoding` and give it\
    \ an alias \"JazzonDecodedValue\"   \n\n// to avoid name collisions with the above\
    \ import  \n\nuse Jazzon\\Decoding\\DecodedValue as XMLDecodedValue;  \n\n// Instantiate\
    \ a new instance of the `DecodedValue` class (from `AnotherLibrary\\Decoding`)\
    \   \n\n// by providing `$data` and `$bytesConsumed` as constructor arguments\
    \  \n\n$result = new DecodedValue($data, $bytesConsumed); // This is `AnotherLibrary\\\
    Decoding\\DecodedValue`  \n\n// Instantiate a new instance of the `DecodedValue`\
    \ class (from `Jazzon\\Decoding`) using its alias   \n\n// by providing `$data`\
    \ and `$bytesConsumed` as constructor arguments  \n\n$jazzonResult = new XMLDecodedValue($data,\
    \ $bytesConsumed); // This is `Jazzon\\Decoding\\DecodedValue`\n```\n\nHence,\
    \ aliases help us use both classes simultaneously (having identical names) from\
    \ different namespaces or libraries without any conflict between them. It ensures\
    \ a clear demarcation within the code block while avoiding potential ambiguities\
    \ or errors.\n\nNamespaces are a very important feature of PHP when developing\
    \ large and complex applications or libraries. It helps to organize your code,\
    \ avoid naming conflict, and promote the reusability of the code in other projects.\
    \ A good knowledge of how namespaces work can give an exponential increase in\
    \ the quality of your PHP code.\n\n## Advanced Namespaces in PHP\n\nIn the previous\
    \ lesson, we learned about namespaces from scratch. Now, let’s get into an advanced\
    \ usage of PHP namespaces. In this lesson, we will learn namespace operators,\
    \ namespace aliasing, and multiple classes importing and using global space.\n\
    \n### Namespace operators\n\nPHP has two types of namespace operators:\n\n1. `\\\
    ` - The fully qualified name operator to refer any global class, function, or\
    \ constant from within a given namespace or for accessing any class, function,\
    \ or constant by its fully qualified name where the fully qualified name includes\
    \ parent namespaces up to root:\n\n```php\n<?php  \n\n// Declare that the code\
    \ in this file belongs to the \"Jazzon\\Decoding\" namespace  \n\nnamespace Jazzon\\\
    Decoding;  \n\n// Instantiate a new instance of the `DecodedValue` class from\
    \ the `Jazzon\\Decoding` namespace  \n\n// by providing `$data` and `$bytesConsumed`\
    \ as constructor arguments  \n\n$result = new \\Jazzon\\Decoding\\DecodedValue($data,\
    \ $bytesConsumed);  \n\n// Using a global function from the global namespace \
    \ \n\n$value = \\str_replace(\" \", \"\", $value);\n```\n\n2. `namespace\\` -\
    \ To refer to the current namespace, use the keyword operator of namespace:\n\n\
    ```php\n<?php  \n\n// Declare that the code in this file belongs to the \"Jazzon\\\
    Decoding\" namespace  \n\nnamespace Jazzon\\Decoding;  \n\nfunction test() { \
    \ \n    return 'Jazzon\\Decoding namespace function';  \n}  \n\n// Call the test\
    \ function from the current namespace (Jazzon\\Decoding)  \n\necho namespace\\\
    test(); // Output: Jazzon\\Decoding namespace\n```\n\n### Aliasing and importing\
    \ namespaces\n\nYou’ll often need classes from other namespaces. Quite inconveniently,\
    \ it’s required to type every time a namespace in which a class was created. PHP\
    \ has introduced an operator that allows you to import/alias classes, functions,\
    \ and constants.\n\n### Classes aliasing and importing\n\nWe can get the class\
    \ from another namespace into this file using the keyword `use`:\n\n```php\n<?php\
    \  \n\n// Declare that the code in this file belongs to the \"Jazzon\\Parsers\"\
    \ namespace  \n\nnamespace Jazzon\\Parsers;  \n\n// Import the `DecodedValue`\
    \ class from `Jazzon\\Decoding` namespace  \n\nuse Jazzon\\Decoding\\DecodedValue;\
    \  \n\n// Instantiate a new instance of the `DecodedValue` class by providing\
    \ `$data` and `$bytesConsumed` as constructor arguments  \n\n$result = new DecodedValue($data,\
    \ $bytesConsumed);\n```\n\n### Classes aliasing/importing and renaming\n\nThere\
    \ are times when we import a class that there is the same name of the class exists\
    \ in different namespaces. In this way, to avoid clashing these classes, after\
    \ importing we can use the `as` keyword and give it an alias:\n\n```php\n<?php\
    \  \n\n// Declare that the code in this file belongs to the \"Jazzon\\Parsers\"\
    \ namespace  \n\nnamespace Jazzon\\Parsers;  \n\n// Import the `DecodedValue`\
    \ class from the `Jazzon\\Decoding` namespace and give it an alias \"DValue\"\
    \  \n\nuse Jazzon\\Decoding\\DecodedValue as DValue;  \n\n// Instantiate a new\
    \ instance of the `DecodedValue` class using its alias by providing `$data` and\
    \ `$bytesConsumed` as constructor arguments  \n\n$result = new DValue($data, $bytesConsumed);\n\
    ```\n\n### Group use declaration\n\nThe idea of group use declarations also came\
    \ about together with PHP 7 by allowing us to import many items from the same\
    \ namespace:\n\n```php\n<?php  \n\n// Declare that the code in this file belongs\
    \ to the \"Jazzon\\Parsers\" namespace  \n\nnamespace Jazzon\\Parsers;  \n\n//\
    \ Import multiple classes from the `Jazzon\\Decoding` namespace using a grouped\
    \ `use` statement  \n\nuse Jazzon\\Decoding\\{  \n    DecodedValue,  \n    AnotherClass,\
    \  \n    YetAnotherClass  \n};  \n\n// Instantiate a new instance of the `DecodedValue`\
    \ class by providing `$data` and `$bytesConsumed` as constructor arguments  \n\
    \n$result = new DecodedValue($data, $bytesConsumed);\n```\n"
  raw: "PHP has the namespace keyword for declaring namespaces. The idea behind these\
    \ namespaces is to save code entities from making unwanted collisions because\
    \ of sharing a common name. You can use namespaces to side-step naming conflicts\
    \ while using classes, functions, and constants having identical names at various\
    \ locations.\n\n### Declaring namespaces\n\nTo declare a namespace, use the keyword\
    \ namespace followed by the name of your namespace. The most important thing to\
    \ remember is that the declaration of the namespace should come first in your\
    \ PHP file before any other code (excluding declare statements and comments).\n\
    \nExample:\n\n<?php  \n\n// Declare that the code in this file belongs to the\
    \ \"Jazzon\" namespace  \n\nnamespace Jazzon;\n\nBy using the keyword namespace\
    \ followed by the name of a namespace (here Jazzon), it declares its visibility\
    \ henceforth towards all other codes in a particular given file.\n\n### Using\
    \ namespaced entities\n\nYou may access an entity defined inside a namespace with\
    \ either of the following three types:\n\n1.  Fully Qualified Name: Include the\
    \ fully qualified name (FQN) of the class, function, or constant beginning from\
    \ the global namespace:\n\n    <?php  \n\n    // Instantiate a new instance of\
    \ the DecodedValue class from the Jazzon\\\\Decoding namespace   \n\n    // by\
    \ providing $data and $bytesConsumed as constructor arguments  \n\n    $result\
    \ \\= new \\\\Jazzon\\\\Decoding\\\\DecodedValue($data, $bytesConsumed);\n\n \
    \   The backslash preceding the class name (and separating from it with a backslash\
    \ as well) tells the script to reference this class’s global namespace location.\
    \ Here, for example, instantiates an instance of the DecodedValue class for the\
    \ Jazzon\\\\Decoding namespace.\n\n    At its instantiation, constructor arguments\
    \ $data and $bytesConsumed are passed into the DecodedValue class.\n\n2.  Import\
    \ with use: Use the use statement to import a class, function or constant and\
    \ then it can directly be used within your code without the namespace prefix:\n\
    \n    <?php  \n\n    // Import the DecodedValue class from the Jazzon\\\\Decoding\
    \ namespace so it can be referenced without the full namespace  \n\n    use Jazzon\\\
    \\Decoding\\\\DecodedValue;  \n\n    // Instantiate a new instance of the DecodedValue\
    \ class (from the imported namespace)   \n\n    // by providing $data and $bytesConsumed\
    \ as constructor arguments  \n\n    $result \\= new DecodedValue($data, $bytesConsumed);\n\
    \n    Like before, constructor arguments $data and $bytesConsumed are passed during\
    \ instantiation.\n\n3.  Aliasing or Importing with use: When two classes of the\
    \ same name exist in one file, you could make an alias for either by using the\
    \ as keyword:\n\n    <?php  \n\n    // Import the DecodedValue class from AnotherLibrary\\\
    \\Decoding  \n\n    use AnotherLibrary\\\\Decoding\\\\DecodedValue;  \n\n    //\
    \ Import the DecodedValue class from Jazzon\\\\Decoding and give it an alias \"\
    JazzonDecodedValue\"   \n\n    // to avoid name collisions with the above import\
    \  \n\n    use Jazzon\\\\Decoding\\\\DecodedValue as XMLDecodedValue;  \n\n  \
    \  // Instantiate a new instance of the DecodedValue class (from AnotherLibrary\\\
    \\Decoding)   \n\n    // by providing $data and $bytesConsumed as constructor\
    \ arguments  \n\n    $result \\= new DecodedValue($data, $bytesConsumed); // This\
    \ is AnotherLibrary\\\\Decoding\\\\DecodedValue  \n\n    // Instantiate a new\
    \ instance of the DecodedValue class (from Jazzon\\\\Decoding) using its alias\
    \   \n\n    // by providing $data and $bytesConsumed as constructor arguments\
    \  \n\n    $jazzonResult \\= new XMLDecodedValue($data, $bytesConsumed); // This\
    \ is Jazzon\\\\Decoding\\\\DecodedValue\n\n    Hence, aliases help us use both\
    \ classes simultaneously (having identical names) from different namespaces or\
    \ libraries without any conflict between them. It ensures a clear demarcation\
    \ within the code block while avoiding potential ambiguities or errors.\n\nNamespaces\
    \ are a very important feature of PHP when developing large and complex applications\
    \ or libraries. It helps to organize your code, avoid naming conflict, and promote\
    \ the reusability of the code in other projects. A good knowledge of how namespaces\
    \ work can give an exponential increase in the quality of your PHP code.\n\n##\
    \ Advanced Namespaces in PHP\n\nIn the previous lesson, we learned about namespaces\
    \ from scratch. Now, let’s get into an advanced usage of PHP namespaces. In this\
    \ lesson, we will learn namespace operators, namespace aliasing, and multiple\
    \ classes importing and using global space.\n\n### Namespace operators\n\nPHP\
    \ has two types of namespace operators:\n\n1.  \\\\ - The fully qualified name\
    \ operator to refer any global class, function, or constant from within a given\
    \ namespace or for accessing any class, function, or constant by its fully qualified\
    \ name where the fully qualified name includes parent namespaces up to root:\n\
    \n    <?php  \n\n    // Declare that the code in this file belongs to the \"Jazzon\\\
    \\Decoding\" namespace  \n\n    namespace Jazzon\\\\Decoding;  \n\n    // Instantiate\
    \ a new instance of the DecodedValue class from the Jazzon\\\\Decoding namespace\
    \   \n\n    // by providing $data and $bytesConsumed as constructor arguments\
    \  \n\n    $result \\= new \\\\Jazzon\\\\Decoding\\\\DecodedValue($data, $bytesConsumed);\
    \  \n\n    // Using a global function from the global namespace  \n\n    $value\
    \ \\= \\\\str\\_replace(\" \", \"\", $value);\n\n2.  namespace\\\\ - To refer\
    \ to the current namespace, use the keyword operator of namespace:\n\n    <?php\
    \  \n\n    // Declare that the code in this file belongs to the \"Jazzon\\\\Decoding\"\
    \ namespace  \n\n    namespace Jazzon\\\\Decoding;  \n\n    function test() {\
    \  \n\n        return 'Jazzon\\\\Decoding namespace function';  \n\n    }  \n\n\
    \    // Call the test function from the current namespace (Jazzon\\\\Decoding)\
    \  \n\n    echo namespace\\\\test(); // Output: Jazzon\\\\Decoding namespace function\n\
    \n### Aliasing and importing namespaces\n\nYou’ll often need classes from other\
    \ namespaces. Quite inconveniently, it’s required to type every time a full namespace\
    \ in which a class was created and we call it again. PHP has introduced an operator\
    \ that allows you to import/alias classes, interfaces, functions, and constants\
    \ using the operator of use.\n\n### Classes aliasing and importing\n\nWe can get\
    \ the class from another namespace into this file by using the keyword use:\n\n\
    <?php  \n\n// Declare that the code in this file belongs to the \"Jazzon\\\\Parsers\"\
    \ namespace  \n\nnamespace Jazzon\\\\Parsers;  \n\n// Import the DecodedValue\
    \ class from the Jazzon\\\\Decoding namespace  \n\nuse Jazzon\\\\Decoding\\\\\
    DecodedValue;  \n\n// Instantiate a new instance of the DecodedValue class by\
    \ providing $data and $bytesConsumed as constructor arguments  \n\n$result \\\
    = new DecodedValue($data, $bytesConsumed);\n\n### Classes aliasing/importing and\
    \ renaming\n\nThere are times when we import a class that there is the same name\
    \ of the class exists in different namespaces. In this way, to avoid clashing\
    \ these classes, after importing we can use the as keyword and give it an alias:\n\
    \n<?php  \n\n// Declare that the code in this file belongs to the \"Jazzon\\\\\
    Parsers\" namespace  \n\nnamespace Jazzon\\\\Parsers;  \n\n// Import the DecodedValue\
    \ class from the Jazzon\\\\Decoding namespace and give it an alias \"DValue\"\
    \  \n\nuse Jazzon\\\\Decoding\\\\DecodedValue as DValue;  \n\n// Instantiate a\
    \ new instance of the DecodedValue class using its alias by providing $data and\
    \ $bytesConsumed as constructor arguments  \n\n$result \\= new DValue($data, $bytesConsumed);\n\
    \n### Group use declartion\n\nThe idea of group use declarations also came about\
    \ together with PHP 7 by allowing us to import many items from the same namespace:\n\
    \n<?php  \n\n// Declare that the code in this file belongs to the \"Jazzon\\\\\
    Parsers\" namespace  \n\nnamespace Jazzon\\\\Parsers;  \n\n// Import multiple\
    \ classes from the Jazzon\\\\Decoding namespace using a grouped \\`use\\` statement\
    \  \n\nuse Jazzon\\\\Decoding\\\\{  \n\n    DecodedValue,  \n\n    AnotherClass,\
    \  \n\n    YetAnotherClass  \n\n};  \n\n// Instantiate a new instance of the DecodedValue\
    \ class by providing $data and $bytesConsumed as constructor arguments  "
