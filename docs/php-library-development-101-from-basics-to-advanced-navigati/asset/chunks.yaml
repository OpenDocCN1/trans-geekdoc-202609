  trans: "\n\n拥有健全的测试策略是实现健壮软件架构的基石之一。通过测试框架的帮助，开发者不仅可以验证代码的正确性，还可以保护自己免受未来回归的影响，确保新更改不会导致旧更改失效。`PHPUnit`\
    \ 和 `Behat` 都是 PHP 生态系统中优秀的工具，使用它们将帮助你确保你的库不仅在功能上是健全的，在结构上也是如此。\n\n当你专门针对可测试性设计你的库架构时，你会更容易诊断问题、更快速地进行调试，并能够更有信地发布代码。此外，一个经过良好测试的库将提高项目在开发者社区中的声誉，从而确保用户能够信任其项目中该软件组件的可靠性。\n\
    \n### 跟进 PHP-FIG 建议\n\n`PSRs`（PHP 标准建议）是由 PHP 框架互操作性小组（`PHP-FIG`）提出的 PHP 库开发指南。遵循这些指南可以使你的库符合社区标准。\n\
    \n### 将将代码逻辑与框架解耦\n\n虽然框架能够快速开发，但将你库的核心功能从任何单一框架中隔离出来至关重要。这确保了使用多个 PHP 框架的用户可以轻松集成你的库。\n\
    \n例如，不要将日志库绑定到单个框架的日志系统，而是考虑实现 `PSR-3` 日志接口。\n\n### 在 PHP 中遵循 SOLID 原则\n\n`SOLID`\
    \ 原则是五种设计原则的缩写，旨在使软件设计更加清晰、灵活且易于维护，这些原则对于 PHP 库至关重要；\n\n| 原则 |  | 示例实现 |\n| ---\
    \ | --- | --- |\n| 单一职责 | 类/函数应该只有一个职责 | 分离 `User` 和 `UserNotification` 类 |\n\
    | 开/闭原则 | 对扩展开放，对修改关闭 | 为 `Shapes` 使用接口，在 `Square`、`Circle` 等中实现 |\n| 里氏替换原则 |\
    \ 子类应该增强而非替换父类 | 分离 `Shape` 接口，区分 `Rectangle` 和 `Square` 实现 |\n| 接口隔离 | 任何类都不应被强制实现未使用的方法\
    \ | 分离 `Workable` 和 `Eatable` 接口 |\n| 依赖倒置 | 依赖抽象，而非依赖具体实现 | 核心类依赖于 `SwitchableDevice`\
    \ 接口，而不是 `LightBulb` 类 |\n\n*   `SRP` (单一职责原则)：你库中的每个 PHP 类应该只有一个变化的理由。这确保了每个类都处理一个不同的问题。\n\
    \    *   考虑将一个同时负责数据验证和数据存储的类分为两个独立的类。\n*   `开/闭原则` (`OCP`)：PHP 类应该应对扩展开放但对修改关闭。这鼓励了更模块化的方法，允许在不更改现有代码的情况下进行简单扩展。\n\
    \    *   使用 `abstract` 类或可以在不更改源代码的情况下进行扩展的接口作为示例。\n*   `里氏替换原则` (`LSP`)：该原则规定超类对象可以与子类对象交换，而不影响程序的正确性。\n\
    \    *   例如，如果你在库中扩展了一个类或实现了一个接口，请确保派生类与基类兼容。\n*   `接口隔离原则` (`ISP`)：该原则规定客户端类不应被强制依赖于它们不使用的接口。\n\
    \    *   与其使用单一宽泛接口，不如将其拆分为更小、更关注的接口。\n*   `依赖倒置原则` (`DIP`)：该原则规定你应该依赖抽象而非具体的实现。这使得你的库能够扩展。\n\
    \n### PHP 的扩展性\n\n一个经过深思的分支策略可以确保主分支保持稳定。以下是一个策略示例：\n\n*   `Main/Master` 分支：此分支包含库的稳定版本。\n\
    *   `Development/Dev` 分支：这是所有新开发发生的地方。\n*   `Feature` 分支：每个新功能或功能都会创建一个新分支。完成后，将其合并到开发分支。\n\
    *   `Hotfix` 分支：用于必须应用到主分支的紧急修复。\n\n## 版本控制与协作\n\n版本控制系统是任何开发项目的骨干，在创建 PHP 库时尤为重要。\n\
    \n它们有助于：\n*   记录更改：每个更改都可能追溯到其来源，提供更好的调试和理解。\n*   促进协作：由于多个开发者可以在同一个库上工作，而不会覆盖彼此的更改，协作变得更加容易。\n\
    \n"
- fmt: "\n* **Automated testing**: When a pull request is made, integration with `CI/CD`\
    \ systems can automatically test the code.\n\n### Tagging and versioning with\
    \ Git\n\n* Use the following tags when your library has reached a critical milestone\
    \ or is ready for release:\n\n```bash\n$ git tag v1.0.0\n```\n\nThis is consistent\
    \ with the `SemVer` strategy, which assists users and developers in understanding\
    \ the library’s maturity and stability.\n\n### Collaborative tools beyond version\
    \ control\n\n* `Slack`, `Microsoft Teams` or `Discord` for team communication.\n\
    * `Trello` or `Jira` for the task and project management.\n* `Docker` is used\
    \ to provide consistent development environments.\n\nWhen developing PHP libraries,\
    \ it is critical to use version control, particularly `Git`. It not only provides\
    \ a seamless development process, but it also encourages participation and the\
    \ preservation of the library’s history. Accept tools and platforms that promote\
    \ collaboration and ease the development process for your library.\n\n## Security\
    \ in Library Design\n\nGood security is not tacked on to build strong, dependable\
    \ PHP libraries. The developer relies upon the fact that when he or she uses a\
    \ library, it works as advertised and isn’t riddled with vulnerabilities that\
    \ compromise his or her applications.\n\n### Important principles of good library\
    \ design security\n\n* **Defense in depth**: Don’t rely on one way to stop a threat.\
    \ Layer your defense so if one mechanism fails another can thwart the attack.\n\
    * **Principle of least privilege**: A component (function or method) should have\
    \ only enough privilege to perform its function.\n* **Fail securely**: Return\
    \ to a secure state instead of exposing the vulnerabilities when anything goes\
    \ wrong.\n* **Avoid security by obscurity**: The technique that relies on hiding\
    \ the internals of your library is not a good security technique. Even if an attacker\
    \ knows how to bypass the protection, good security must be effective.\n\n###\
    \ Common vulnerabilities and their mitigations\n\n* **Injection attacks**: Sanitize\
    \ and validate all inputs. Prevent `SQL` injections through parameterized queries.\
    \ Let us see this in examples;\n\nHere is a code snippet showing an `SQL` query\
    \ vulnerable to the injection attack, by directly incorporating user input:\n\
    ```php\nprepare(\"SELECT * FROM users WHERE username = :username\"); \n$stmt->execute(['username'\
    \ => $_GET['username']]);\n```\n\n* **Cross-Site Scripting (XSS)**: Escape all\
    \ outputs and use a `Content Security Policy` (`CSP`) if your library deals with\
    \ web content. Let us see this in examples;\n\nHere is a code snippet, we directly\
    \ printed the user input that can lead to `XSS` if it contains malicious scripts:\n\
    ```php\n<?php\n// Displaying user input\necho \"Hello,\" . $_GET['username'];\n\
    ```\n\nIn the following snippet, using `htmlspecialchars()` to escape user input,\
    \ preventing `XSS` attacks.:\n```php\n<?php\n// Safely escaping user input\necho\
    \ \"Hello,\" . htmlspecialchars($_GET['username'], ENT_QUOTES, 'UTF-8');\n```\n\
    \n* **Insecure dependencies**: Regularly update libraries and components that\
    \ your library relies on. Use `Composer`’s built-in security checker or similar\
    \ tools to watch out for known vulnerabilities.\n* **Insecure deserialization**:\
    \ Do not deserialize data from untrusted sources. If you have to, consider safe\
    \ data formats such as `JSON`. let us see a small example;\n\nDeserializing data\
    \ from untrusted sources can lead to security issues:\n```php\n// Unsafe deserialization\n\
    $data = unserialize($untrusted_data);\n```\n\nUsing safe data formats:\n```php\n\
    // Safe data format\n$data = json_decode($json_data);\n```\n"
  raw: "*   Automated testing: When a pull request is made, integration with CI/CD\
    \ systems can automatically test the code.\n\n### Tagging and versioning with\
    \ Git\n\n*   Use the following tags when your library has reached a critical milestone\
    \ or is ready for release:\n\n$ git tag v1.0.0\n\nThis is consistent with the\
    \ SemVer strategy, which assists users and developers in understanding the library’s\
    \ maturity and stability.\n\n### Collaborative tools beyond version control\n\n\
    *   Slack, Microsoft Teams or Discord for team communication.\n\n*   Trello or\
    \ Jira for the task and project management.\n\n*   Docker is used to provide consistent\
    \ development environments.\n\nWhen developing PHP libraries, it is critical to\
    \ use version control, particularly Git. It not only provides a seamless development\
    \ process, but it also encourages participation and the preservation of the library’s\
    \ history. Accept tools and platforms that promote collaboration and ease the\
    \ development process for your library.\n\n## Security in Library Design\n\nGood\
    \ security is not tacked on to build strong, dependable PHP libraries. The developer\
    \ relies upon the fact that when he or she uses a library, it works as advertised\
    \ and isn’t riddled with vulnerabilities that compromise his or her applications.\n\
    \n### Important principles of good library design security\n\n*   Defense in depth:\
    \ Don’t rely on one way to stop a threat. Layer your defense so if one mechanism\
    \ fails another can thwart the attack.\n\n*   Principle of least privilege: A\
    \ component (function or method) should have only enough privilege to perform\
    \ its function.\n\n*   Fail securely: Return to a secure state instead of exposing\
    \ the vulnerabilities when anything goes wrong.\n\n*   Avoid security by obscurity:\
    \ The technique that relies on hiding the internals of your library is not a good\
    \ security technique. Even if an attacker knows how to bypass the protection,\
    \ good security must be effective.\n\n### Common vulnerabilities and their mitigations\n\
    \n*   Injection attacks: Sanitize and validate all inputs. Prevent SQL injections\
    \ through parameterized queries. Let us see this in examples;\n\n    Here is a\
    \ code snippet showing an SQL query vulnerable to the injection attack, by directly\
    \ incorporating user input: \\`\\`\\`php prepare(“SELECT \\* FROM users WHERE\
    \ username = :username”); $stmt->execute(\\[‘username’ => $\\_GET\\[‘username’\\\
    ]\\]); \\`\\`\\`\n\n*   Cross-Site Scripting (XSS): Escape all outputs and use\
    \ a Content Security Policy (CSP) if your library deals with web content. Let\
    \ us see this in examples;\n\n    Here is a code snippet, we directly printed\
    \ the user input that can lead to XSS if it contains malicious scripts: \\`\\\
    `\\`php <?php\n\n    // Displaying user input directly echo “Hello,” . $\\_GET\\\
    [‘username’\\]; \\`\\`\\`\n\n    In the following snippet, using htmlspecialchars()\
    \ to escape user input, preventing XSS attacks.: \\`\\`\\`php <?php\n\n    //\
    \ Safely escaping user input echo “Hello,” . htmlspecialchars($\\_GET\\[‘username’\\\
    ], ENT\\_QUOTES, ‘UTF-8’); \\`\\`\\`\n\n*   Insecure dependencies: Regularly update\
    \ libraries and components that your library relies on. Use Composer’s built-in\
    \ security checker or similar tools to watch out for known vulnerabilities.\n\n\
    *   Insecure deserialization: Do not deserialize data from untrusted sources.\
    \ If you have to, consider safe data formats such as JSON. let us see a small\
    \ example;\n\n    Deserializing data from untrusted sources can lead to security\
    \ issues: \\`\\`\\`php <?php\n\n    // Unsafe deserialization data = unserialize(\\\
    _GET\\[‘data’\\]); \\`\\`\\`\n\n    Using JSON for data formats and json\\_decode\\\
    `\\` for deserialization is safer and avoids many of the vulnerabilities associated\
    \ withunserialize\\`: \\`\\`\\`php <?php\n\n    // Safe deserialization with JSON\
    \ data = jsondecode(\\_GET\\[‘data’\\]); \\`\\`\\`\n\n### Security in the development\
    \ lifecycle\n\n*   Security audits: Regularly run tools such as PhpStan and Psalm\
    \ for static analysis but consider more specialized ones like RIPS for a total\
    \ security audit.\n\n*   Code reviews: Ensure that thorough peer reviews are done\
    \ with an added focus on security. Another pair of eyes can always see security\
    \ issues that the original developer may miss.\n\n*   Continuous Integration (CI):\
    \ Make use of Continuous Integration (CI) processes which run a suite of security\
    \ checks each time changes are saved.\n\nThe following image elaborates on the\
    \ development cycle in a Conveyor Belt design;\n\n![](image_rsrc3DW.jpg)\n\nDevelopment\
    \ cycle in conveyor belt\n\n### Stay up-to-date about the latest trends in security\n\
    \nSecurity is never a constant, and as new vulnerabilities are discovered so do\
    \ attack techniques become found. Subscribe to PHP security forums, get involved\
    \ in developer communities and keep yourself informed about the latest threats\
    \ and protection techniques.\n\nDeveloping a secure PHP library is an ongoing\
    \ effort that requires proactive work towards security, knowledge of common weaknesses,\
    \ and keeping oneself up-to-date with changes in the threat as well as the defensive\
    \ landscape.\n\n## Performance Optimization\n\nBefore you make any modifications,\
    \ assess your library’s current implementation’s performance. This will act as\
    \ a reference point for improvement in later optimizations.\n\nProfiling tools:\
    \ Some of the tools that can help profile your PHP code to identify bottlenecks\
    \ or areas generally slow are Xdebug and Blackfire.io.\n\n### Optimize algorithms\
    \ and data structures\n\nGood underlying algorithms and data structures require\
    \ good libraries.\n\n*   Algorithm complexity: Always consider an algorithm suitable\
    \ for use concerning size. Remember both time and spatial complexity.\n\n*   Data\
    \ structures: The right data structure can greatly boost operations. Trees, heaps\
    \ and hash maps have their best use case.\n\n### Database intersections\n\nLibrary\
    \ interactions with a database can be optimized to boot performance by quite a\
    \ bit.\n\n*   Efficient queries: Have your queries as specific as possible. Do\
    \ not use SELECT \\* where avoidable; rather think of joins instead of multiple\
    \ queries.\n\n    ![](image_rsrc3DX.jpg)\n\n    Use of DB efficient queries\n\n\
    *   Caching: Save calls to the database that are used frequently. Tools like Redis\
    \ and Memcached can help store information in memory reducing retrieval times\
    \ on databases.\n\n    ![](image_rsrc3DY.jpg)\n\n    Use of Caching with DB\n\n\
    ### Minimize I/O operations\n\nInput/output processes, particularly disk reads\
    \ and writes, can be time-consuming. When possible, keep them to a minimum.\n\n\
    *   Buffered operations: Instead of instantly writing data, buffer it and write\
    \ it in pieces.\n\n    ![](image_rsrc3DZ.jpg)\n\n    A flowchart of I/O buffering\
    \ operation\n\n*   Asynchronous operations: Perform I/O operations asynchronously\
    \ if possible to avoid blocking the main thread.\n\n    ![](image_rsrc3E0.jpg)\n\
    \n    A flowchart of I/O asynchronous operation\n\n### Utilize modern PHP features\n\
    \nModern PHP versions include numerous performance enhancements. Check that you’re\
    \ up to date and using the features that improve performance.\n\n*   Just-In-Time\
    \ compilation (JIT): Available in PHP 8, JIT can greatly accelerate CPU-bound\
    \ activities.\n\n*   Preloading: Introduced in PHP 8, it allows the preloading\
    \ of often-used scripts into memory and therefore lowers file system read overhead.\n\
    \n### Consider hardware and hosting\n\nThe performance of your library isn’t just\
    \ the code. It’s also something to think about what environment it runs in.\n\n\
    *   Optimized servers: If your library is being hosted on a web server, consider\
    \ using server optimization software such as NGINX or LiteSpeed.\n\n*   Content\
    \ Delivery Networks (CDNs): CDNs can help libraries that serve content globally\
    \ distribute content more efficiently and thus lower load times.\n\n### Regular\
    \ performance testing\n\nPerformance isn’t a one-time affair. As you continue\
    \ updating your library, ensure its performance is tested regularly for no regressions.\n\
    \n*   Benchmarking: Compare the performance of your library against benchmarks\
    \ or any other related libraries in the ecosystem."
