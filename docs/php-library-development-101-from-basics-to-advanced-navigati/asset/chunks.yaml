  trans: "\n\n### 3. 命名空间映射 (Namespace Mapping)\n在你的 `composer.json` 文件中，将基础命名空间映射到\
    \ `src/` 目录。这是一个典型的策略，可以提高项目结构的统一性。\n\n```json\n{\n  \"autoload\": {\n    \"psr-4\"\
    : {\n      \"Jazzon\\\\\\\\\": \"src/\"\n    }\n  }\n}\n```\n\n### 4. 类的使用 (Class\
    \ Usage)\n为了避免混乱，请在文件顶部导入类，而不是在代码中使用完全限定名引用它们。\n\n```php\n<?php\n// 指定在该文件中将使用来自\
    \ \"Jazzon\\Parsers\" 命名空间的 JsonParser 类。\n// 这避免了在实例化类时需要使用完整的命名空间路径。\nuse Jazzon\\\
    Parsers\\JsonParser;\n// 实例化 JsonParser 类。\n// 由于由于上面的 \"use\" 语句，我们在这里不需要完整的命名空间路径。\n\
    $parser = new JsonParser();\n```\n\n命名空间和自动加载是 PHP 的核心组成部分，对于较大的应用程序尤其如此。通过采用最佳实践，你可以让代码库更加整洁、高效且易于管理。记住，结构良好、组织合理的代码库更容易被理解、调试和维护。\n\
    \n# 创建库组件 (Creating Library Components)\n\n在此部分中，重点是构建库的核心元素，针对特定的问题和用例进行定制。本书的这部分帮助读者识别并开发构成库的各种组件，例如函数、类、接口和\
    \ trait（特质）。它强调了优先考虑、完善和迭代这些组件的重要性，以有效解决库领域内的问题。\n\n这部分首先提供了关于创建 PHP 函数的最佳实践见解。这包括保持清晰的焦点、避免全局变量、使用描述性名称、应用类型提示（type\
    \ hinting）以及有效地处理异常。这些实践对于在 PHP 库中开发结构良好且可靠的函数至关重要。\n\n接下来将探讨类在 PHP 库中的作用。类在封装数据和函数方面是基础，这部分强调了遵循最佳实践的重要性，例如单一职责原则、实现依赖注入以及利用抽象类或接口。这些原则确保了创建设计良好、可维护且可扩展的类。\n\
    \n此外，这部分将引导读者掌握 Jazzon 库中基本函数的实现。它承认，虽然这些函数展示了 PHP 库构建的基础，但在实际应用中可能需要更复杂的、非内置的\
    \ PHP 函数。\n\n最后，这部分涵盖了将重要的库函数组装成类并将其组织到不同的命名空间中。这一过程对于实现库结构的清晰度和确保命名无冲突至关重要。通过有效地实现命名空间，指南展示了如何无缝使用来自不同命名空间的类，增强\
    \ PHP 库的整体功能和用户体验。\n\n## 库组件 (Library Components)\n\n在深入构建库的类和函数之前，定义库的组件至关重要，这意味着定义库将提供的不同部分或功能。\n\
    \n库组件是库的构建块，可以包括函数、类、接口和 trait。在库开发的早期定义这些组件至关重要，以便清晰地理解正在构建的内容。\n\n### 识别问题领域\
    \ (Identify the problem domain)\n\n第一步是识别库将解决的问题领域。这可能是一个特定的业务领域或一个特定的技术问题。\n\n\
    我们的 Jazzon 库旨在解决 PHP 中解析 JSON 数据的问题。因此，Jazzon 的问题领域与数据解析有关。\n\n### 识别用例 (Identify\
    \ the use cases)\n\n下一步是识别库的用例。用例是该库将被使用的特定场景或情况。\n\nJazzon 库的一个用例可能是解析来自 API\
    \ 的 JSON 响应并将其转换为 PHP 数组或对象。\n\n### 识别库组件 (Identify the library components)\n\n\
    一旦你识别了库的问题领域和用例，下一步就是定义库组件。正如我们之前说的，库组件是库将提供的部分或功能。\n\nJazzon 可能的某些组件包括：\n\n*\
    \ 一个将 JSON 字符串解析为 PHP 数组的函数。\n* 一个将 JSON 字符串解析为 PHP 对象的函数。\n* 一个将 PHP 数组转换为 JSON\
    \ 字符串的函数。\n* 一个将 PHP 对象转换为 JSON 字符串的函数。\n* 一个处理验证等功能的类。\n\n我们可以这样定义 Jazzon 的通用组件结构：\n\
    \n* `JsonParser` 类：负责将 JSON 字符串解析为数组或对象。\n\n```php\n<?php\n// JsonParser 类负责将\
    \ JSON 字符串解析为数据结构（数组或对象）。\nclass JsonParser {\n    // 解析方法的实现\n}\n```\n\n* `JsonEncoder`\
    \ 类：负责将数组或对象转换为 JSON 字符串。\n\n```php\n<?php\n// JsonEncoder 类负责将数据结构（数组或对象）编码为\
    \ JSON 字符串。\nclass JsonEncoder {\n    // 编码方法的实现\n}\n```\n\n* `JsonValidator`\
    \ 类：负责验证 JSON 数据的结构和完整性。\n\n```php\n<?php\n// JsonValidator 类提供验证 JSON 数据结构和完整性的方法。\n\
    class JsonValidator {\n    // 验证方法的实现\n}\n```\n\n* `JsonException` 类：处理 JSON 解析或编码错误的自定义类。\n\
    \n```php\n<?php\n// JsonException 类为 JSON 提供自定义异常处理。\nclass JsonException extends\
    \ Exception {\n    // 异常方法的实现\n}\n```\n\n通过定义库组件，你可以轻松地将开发过程拆分为更小、更容易管理的任务。\n\n\
    ![](img/image_rsrc3CM.jpg)\n\nJazzon 库中的组件关系\n\n### 组件排序 (Prioritize the components)\n\
    \n识别组件后，根据其重要性和复杂性对它们进行排序。这将帮助你关注最重要的组件，避免负担不堪。\n\n在 Jazzon 的情况下，解析函数可能是最重要的组件，因为它们是库的核心功能。\n\
    \n### 完善和迭代 (Refine and Iterate)\n\n最后，根据需要对库组件进行完善和迭代。当你开始开发时，可能会发现某些组件不再需要，或者需要新的组件。\n\
    \n假设我们的 Jazzon 库某些用户在处理无效 JSON 数据时遇到问题，可能需要在库中添加新的验证规则/组件。通过完善和迭代定义的库组件，你可以确保库满足用户需求并保持活力。\n\
    \n## 定义库函数 (Defining Library Functions)\n\n在 PHP 库开发中，函数和类是库组件的构建块。\n\n函数是执行特定任务的集。\n\
    \n类是创建具有共同属性和方法的蓝图。\n\n在本节中，我们将定义并设计 Jazzon 库预期的基本函数，本节的目标是让你了解在开始编写库函数时需要做什么。\n\
    \n{notice} 我们将在本章的稍后部分提供函数的实现。\n\n"
- fmt: "\n# Functions best practices\n\nSome good practices to keep in mind while\
    \ defining/designing the library functions:\n\n![](image_rsrc3CN.jpg)\n\n## Functions\
    \ best practices\n\n*   Keep functions small and focused on a small task to improve\
    \ code readability and maintainability.\n\n```php\n<?php\n// This function performs\
    \ one small, focused task: adding two numbers.\nfunction add(int $a, int $b):\
    \ int {\n    return $a + $b;\n}\n// Use the function to add 5 and 3.\n$result\
    \ = add(5, 3);\necho $result; // Outputs: 8\n```\n\n*   Avoid global variables\
    \ and use parameters to pass in data.\n\n```php\n<?php\n// Instead of using a\
    \ global variable, we pass the values as parameters to the function.\nfunction\
    \ multiply(int $x, int $y): int {\n    return $x * $y;\n}\n// Use the function\
    \ to multiply 6 by 4.\n$result = multiply(6, 4);\necho $result; // Outputs: 24\n\
    ```\n\n*   Use descriptive and constant names to make it easy to understand what\
    \ the function does.\n\n```php\n<?php\n// The function name clearly describes\
    \ its purpose: converting Fahrenheit to Celsius.\nfunction convertFahrenheitToCelsius(float\
    \ $fahrenheit): float {\n    return ($fahrenheit - 32) * (5/9);\n}\n// Use the\
    \ function to convert 98.6 Fahrenheit to Celsius.\n$celsius = convertFahrenheitToCelsius(98.6);\n\
    echo $celsius; // Outputs: 37\n```\n\n*   Use type hinting to ensure the correct\
    \ data type is passed to the function.\n\n```php\n<?php\n// Type hints ensure\
    \ that the function only accepts an array and returns an integer.\nfunction countElementsInArray(array\
    \ $items): int {\n    return count($items);\n}\n// Use the function to count the\
    \ number of items in an array.\n$arrayItems = ['apple', 'banana', 'cherry'];\n\
    $count = countElementsInArray($arrayItems);\necho $count; // Outputs: 3\n```\n\
    \n*   Use exception handling to gracefully handle errors and failures within a\
    \ function.\n\n```php\n<?php\n// This function safely divides two numbers, throwing\
    \ an exception if the divisor is zero.\nfunction safeDivide(int $numerator, int\
    \ $denominator): float {\n    if ($denominator === 0) {\n        throw new Exception(\"\
    Denominator cannot be zero.\");\n    }\n    return $numerator / $denominator;\n\
    }\n// Attempt to use the function to divide 8 by 0. This will trigger the exception.\n\
    try {\n    $result = safeDivide(8, 0);\n    echo $result;\n} catch (Exception\
    \ $e) {\n    echo $e->getMessage(); // Outputs: Denominator cannot be zero.\n\
    }\n```\n\n## Jazzon functions\n\nLet’s draw up the expected functions in our library:\n\
    \n*   `parse(bool $assoc = false, int $depth = 512, int $options = 0)` - responsible\
    \ for parsing the JSON string into a PHP array.\n\n```php\n<?php\n/**\n * Parses\
    \ a JSON string and returns an object or array\n *\n * @param bool $assoc [Optional]\
    \ If true, returned objects will be converted into associative arrays.\n * @param\
    \ int $depth [Optional] User specified recursion depth.\n * @param int $options\
    \ [Optional] Bitmask of JSON decode options.\n * @return mixed\n * @throws JsonException\n\
    \ */\nfunction parse(bool $assoc = false, int $depth = 512, int $options = 0):\
    \ string\n{\n    // parsing logic\n}\n```\n\n*   `getArray()` returns the PHP\
    \ array of the parsed JSON string.\n*   `getObject()` returns the PHP object of\
    \ the parsed JSON string.\n*   `encode(int $options = 0, int $depth = 512)` is\
    \ a function to convert the PHP array or object into a JSON string.\n\n```php\n\
    <?php\n/**\n * Encodes data to a JSON string\n *\n * @param int $options [Optional]\
    \ Bitmask of JSON encode options.\n * @param int $depth [Optional] Set the maximum\
    \ depth. Must be greater than zero.\n * @return string\n * @throws JsonException\n\
    \ */\nfunction encode(int $options = 0, int $depth = 512): string\n{\n    // encoding\
    \ logic\n}\n```\n\n*   `validate(string $json)` is a function that validates a\
    \ JSON string.\n\n```php\n<?php\n/**\n * Validates a JSON string\n *\n * @param\
    \ string $json The JSON string to validate\n * @return bool true if the JSON string\
    \ is valid, otherwise\n */\nfunction validate(string $json): bool\n{\n    // validation\
    \ logic\n}\n```\n\nThis is a starting point for our library, during the development\
    \ process we could refine and iterate as before to add more functions or remove\
