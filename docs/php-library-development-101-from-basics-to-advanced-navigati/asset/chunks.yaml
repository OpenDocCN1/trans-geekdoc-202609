    \n## Dependency Management\n\nIt is very common that when we build a PHP library,\
    \ we depend on external libraries and dependencies to help us with various tasks\
    \ in our library. So managing these dependencies is crucial to ensure our library\
    \ works as expected and makes it easy for developers to use. In this lesson, we\
    \ will cover some best practices while managing the development of PHP libraries.\n\
    \n### What are dependencies?\n\nDependencies involve any kind of external library\
    \ or package which your code depends upon to work. Libraries here can range from\
    \ very simple utility libraries to more complex ones.\n\nExamples:\n\n*   GuzzleHttp:\
    \ A library for making HTTP requests.\n\n*   PHPUnit: A testing framework.\n\n\
    *   Monolog: A logging library for PHP.\n\n![](image_rsrc3C7.jpg)\n\nInteraction\
    \ between PHP library and its dependencies\n\nTherefore, it’s always an important\
    \ task to manage the dependencies wisely so that there won’t be any such conflict\
    \ or compatibility issues in the future. And, to do that we use package manager.\n\
    \n### Using package manager\n\nA tool that helps us manage the dependencies of\
    \ our projects. There are several popular package managers available in PHP:\n\
    \n*   Composer: The most widely used PHP package manager.\n\n*   PECL: This is\
    \ a package manager specifically for PHP extensions.\n\n{notice} For this learning,\
    \ we will be using Composer.\n\nComposer is a command-line utility that allows\
    \ us to keep track of and manage all the dependencies and libraries we use in\
    \ our PHP projects. It does so by creating a composer.json file in your root directory,\
    \ listing out all the dependencies needed for your project.\n\n![](image_rsrc3C8.jpg)\n\
    \nA flowchart of managing dependencies using Composer\n\nTo install a new dependency\
    \ using Composer you just need to run a simple command:\n\n$ composer require\
    \ <library name>\n\nFor example, suppose we want to install GuzzleHTTP:\n\n$ composer\
    \ require guzzlehttp/guzzle\n\nThis will download it from Packagist and install\
    \ it into the vendor folder located at your root directory. The Composer also\
    \ adds the package information to the composer.json file.\n\n### Autoloading dependencies\n\
    \nAnd one of the most amazing things that Composer does for us is it automatically\
    \ loads our dependencies. It achieves this using a mechanism we already mentioned\
    \ called autoloading.\n\n{notice} We will learn about Autoloading more in future\
    \ lessons.\n\nEvery time we install new dependencies using Composer, it will create\
    \ an autoloader file for us or update an already existing one. This autoloader\
    \ contains mappings of class names and their path so PHP knows which class files\
    \ need to be loaded when they need to be used.\n\nTo use this autoloader, all\
    \ we have to do is to include the file at the top of our PHP file:\n\n<?php  \n\
    \n// Require and load the Composer autoloader, which will automatically load and\
    \ manage project dependencies.  \n\nrequire\\_once 'vendor/autoload.php';\n\n\
    It loads up the autoloader file and ensures that all our dependencies are loaded\
    \ in and available to be used.\n\n### Best practices\n\nHere are a few best practices\
    \ that we should follow while managing the dependencies in our PHP libraries:\n\
    \n*   Use only those dependencies that have active maintenance and a large user\
    \ base.\n\n*   Manage the dependencies using a package manager like Composer.\
    \ This will ensure compatibility with your codebase.\n\n*   Do not overuse too\
    \ many dependencies as this will make your library more complex.\n\n*   Keep track\
    \ of the dependency updates regularly, and update them to their latest version\
    \ to keep your code up-to-date, compatible, and secure.\n\nFollowing these practices\
    \ will help us create stable, secure, and easy-to-use libraries for other developers.\n\
    \nDependency management is one of the core aspects of PHP library development,\
    \ and we can quite easily manage our dependencies as well as keep them compatible\
    \ with our code by using a package manager such as Composer. Moreover, the best\
    \ practices of dependency management help us ensure that not only are libraries\
    \ easy to use but also stable and secure.\n\n## Setting up Library Project\n\n\
    Based on what we have discussed so far on setting up a project structure, let\
    \ us create our course library Jazzon structure. We will use composer to manage\
    \ dependencies like the PHPUnit for testing, a tests directory to hold all tests\
    \ for our library functions, and finally the src directory which will have all\
    \ the source code of the library.\n\n### Library project\n\nWe will start with\
    \ a sample class src/Jazzon.php and tests/JasonTest.php to show how all come together\
    \ from the beginning.\n\n![](image_rsrc3C9.jpg)\n\nInitial/Basic Jazzon library\
    \ project\n\nLet us see what these two classes will look like as a starting point.\n\
    \n*   Jazzon.php:\n\n<?php  \n\n// Define the namespace for this class  \n\nnamespace\
    \ Jazzon;  \n\nclass Jazzon  \n\n{  \n\n    // A method that accepts a name (with\
    \ a default value of \"Jazzon\") and returns a welcome message  \n\n    public\
    \ function welcome($name \\= \"Jazzon\")  \n\n    {  "
