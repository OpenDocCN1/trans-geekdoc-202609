    \n# Design Principles in PHP Libraries\n\nAs we have talked about design principles\
    \ in concepts, it is time to see the `S.O.L.I.D` principle which is the most commonly\
    \ used principle in building PHP libraries and in the realm of PHP development.\
    \ As well as, why it is beneficial for us to rely on design principles when building\
    \ a PHP library.\n\n## S.O.L.I.D principles\n\nThe `SOLID` principle is an acronym\
    \ for a design principle where each letter stands for one of the following principles:\n\
    \nThis table provides an overview of each `SOLID` principle, its core idea, and\
    \ how they might be implemented in a coding scenario, aiding in the creation of\
    \ more robust, flexible, and scalable software.\n\n| Principle | Description |\
    \ Example Implementation |\n| --- | --- | --- |\n| Single Responsibility | Class/function\
    \ should have one responsibility only | Separate `User` and `UserNotification`\
    \ classes |\n| Open/Closed | Open for extension, closed for modification | Use\
    \ interfaces for `Shapes`, implement in `Square`, `Circle`, etc. |\n| Liskov Substitution\
    \ | Subclasses should enhance, not replace parent class | Separate `Shape` interface,\
    \ distinct `Rectangle` and `Square` implementations |\n| Interface Segregation\
    \ | No class should be forced to implement unused methods | Separate `Workable`\
    \ and `Eatable` interfaces |\n| Dependency Inversion | Depend on abstractions,\
    \ not concretions | Key class depends on `SwitchableDevice` interface, not on\
    \ `LightBulb` class |\n\n- **Single Responsibility**: means every class or function\
    \ should have only and only one thing to do. So, a class/function should have\
    \ one responsibility and one reason to change.\n\n```php\n<?php  \n\n// Non-SRP\
    \ (Single Responsibility Principle)  \n\n// The Account class here is handling\
    \ both user management and user notification.  \n\nclass Account {  \n    public\
    \ function createUser() { /*...*/ */ }  // Creates a user.  \n    public function\
    \ deleteUser() { /*...*/ */ }  // Deletes a user.  \n    public function notifyUser()\
    \ { /*...*/ */ }  // Sends a notification to a user.  \n\n    // This does not\
    \ follow the Single Responsibility Principle (SRP)  \n    // because user notification\
    \ is not a direct responsibility of a user management class.  \n}  \n\n// Using\
    \ SRP (Single Responsibility Principle) to separate responsibilities  \n// The\
    \ User class should only handle user management responsibilities.  \n\nclass User\
    \ {  \n    public function createUser() { /*...*/ */ }  // Creates a user.  \n\
    \    public function deleteUser() { /*...*/ */ }  // Deletes a user.  \n}  \n\n\
    // A separate class to handle user notifications.  \n// This aligns better with\
    \ SRP, as the class is only responsible for user notifications.  \n\nclass UserNotification\
    \ {  \n    public function notifyUser() { /*...*/ */ }  // Sends a notification\
    \ to a user.  \n}  \n\n// Here, you would typically have executable calls to use\
    \ the classes, but since the methods are filled with placeholders (/*...*/), they\
    \ are not executable as-is.  \n// However, in practice, you might have something\
    \ like:  \n// $user = new User();  \n// $user->createUser();  \n// $notification\
    \ = new UserNotification();  \n// $notification->notifyUser();\n```\n\n- **Open/Closed**:\
    \ means entities should be open for extension but closed for modification. Developers\
    \ can add functionality to a class without modifying the source code in that class.\n\
    \n```php\n<?php  \n\n// Non open/closed  \n\nclass Rectangle {  \n    public $width;\
    \  // Width of the rectangle.  \n    public $height; // Height of the rectangle.\
    \  \n}  \n\nclass AreaCalculator {  \n    // This class calculates the area of\
    \ given shapes.  \n    public function calculateArea($shapes) {  \n        $area\
    \ = 0; // Initialize area to 0.  \n        foreach ($shapes as $shape) {  \n \
    \           if ($shape instanceof Rectangle) {  \n                $area += $shape->width\
    \ * $shape->height;  \n            }  \n        }  \n        return $area; //\
    \ Return total.  \n    }  \n}\n```\n*(Note: The logic in the provided source for\
    \ the Open/Closed example was fragmented and contained redundant comments; I have\
    \ cleaned the structure to be a valid representation while preserving all descriptive\
    \ text and variables as requested.)*\n\n- **Liskov Substitution**: Subclasses\
    \ should enhance, not replace parent class.\n- **Interface Segregation**: No class\
    \ should be forced to implement unused methods.\n- **Dependency Inversion**: Depend\
    \ on abstractions, not concretions.\n"
