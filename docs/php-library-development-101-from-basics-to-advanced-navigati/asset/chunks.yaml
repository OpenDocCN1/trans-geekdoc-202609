  trans: "\n\n-   漏洞告警监控：使用技术接收有关已知漏洞的通知。\n\n### 安全编码实践\n\n遵循安全编码标准和指南可以确保库对安全风险有强大的防御能力。\n\
    \n-   输入验证：始终对用户输入进行验证，以避免 SQL 注入、XSS 和其他漏洞。\n\n  让我们来看一个使用 `filter_var()` 等函数验证电子邮件地址的示例。像这样验证用户输入可以确保只处理格式正确的数据，从而帮助防止\
    \ SQL 注入和 XSS 攻击等常见漏洞。\n\n```php\n<?php\n// 输入验证示例\nif (filter_var($email, FILTER_VALIDATE_EMAIL))\
    \ {\n    // 邮箱有效\n} else {\n    // 邮箱无效\n}\n```\n\n-   加密：对于敏感数据，使用适当的加密。\n\n\
    \  下面的示例演示了如何使用 OpenSSL 的 `AES-128-CBC` 算法加密数据。这种加密对于保护敏感数据至关重要，确保确保即使数据被拦截，在没有正确密钥的情况下也无法读取。\n\
    \n```php\n<?php\n// 加密示例\n$encryptedData = openssl_encrypt(data, 'AES-128-CBC',\
    \ $key, 0, $iv);\n```\n\n-   身份验证与授权：建立稳健的身份验证和授权程序。\n\n  下面的基础示例使用 PHP 的 `password_verify`\
    \ 函数安全地将用户输入的密码与存储的哈希进行比较。这种身份验证方法对于维护安全的访问控制至关重要，确保只有经过验证的用户才能访问某些功能。\n\n```php\n\
    <?php\n// 身份验证示例\nif (password_verify($inputPassword, $storedPasswordHash)) {\n\
    \    // 密码正确，继续登录\n} else {\n    // 密码错误，拒绝访问\n}\n```\n\n### 应急响应计划\n\n当发生安全事件时，拥有一份计划可能有助于减轻损害。\n\
    \n![](img/image_rsrc3DR.jpg)\n\n应急响应计划的流程图\n\n-   立即响应：识别出事件后立即需要做什么。\n-   通信计划：如何将事件通知给用户和利益相关者？\n\
    -   事后分析：调查哪里出了问题，并确定未来如何避免此类问题发生。\n\n保持库的安全需要多样化的方法。理解风险、进行定期审计、监控依赖项、遵循安全编码实践以及拥有应急响应策略都是其中的一部分。一个维护良好且安全的库能够赢得用户的信任，并使更广泛的开发者社区受益。\n\
    \n## 维护中的文档与社区参与\n\n你的文档应该随着你的库同步变化。为了给用户提供清晰的信息，在文档中反映库中的所有变化至关重要。\n\n### 定期更新文档的原因\n\
    \n有多个理由说明你应该保持文档的更新。这里是显示此过程的流程图：\n\n![](img/image_rsrc3DS.jpg)\n\nPHP 库开发中文档更新过程的流程图\n\
    \n-   通知用户新功能或已弃的功能。\n-   对已知 Bug 提供修复方案或解释。\n-   回答常见问题或解释疑难点。\n\n### 利用社区反馈改进维护\n\
    \n你的用户群可能是一项重要资产。他们提供了新的视角，发现了隐藏的问题，并提供了真实的应用场景。\n\n你可以用来从社区收集反馈的某些参与平台包括：：\n\n\
    -   论坛与讨论板：人们讨论问题、分享解决方案和提供反馈的地方。\n-   调查问：收集关于库的使用、功能和潜在改进的系统性输入。\n-   社交媒体：社交媒体有助于快速公告和互动。\n\
    \n### 社区对库代码的贡献\n\n开源库经常从社区贡献中受益。这种参与可以包括从 Bug 修复到功能增强的所有内容。\n\n社区对库贡献的某些益处是：\n\
    \n-   多样化的视角有助于提供解决方案。\n-   更快速地检测和解决 Bug。\n-   由于更广泛的开发者群体，功能集得到了增强。\n\n### 保持清晰的通信渠道\n\
    \n活跃的用户群更有可能拥有响应及时的维护者。解决问题、认可贡献以及通知更新都是有效沟通的一部分。\n\n为了实现有效的沟通，你可以遵循某些良好实践：\n\n\
    -   对问题做出回应。\n-   认可贡献。\n-   通知更新。\n\n### 通过研讨会和教程教育用户\n\n通过研讨会和教程教育用户。这样做可以带来一些好处：\n\
    \n-   缩短用户的学习曲线。\n-   提供对复杂功能的深度解析。\n-   增强社区关系。\n\n"
- fmt: "\nImproving the performance of a PHP library is also a key focus. Developers\
    \ learn about best practices that ensure their library operates smoothly and efficiently,\
    \ thus making it stand out in its field. Performance optimization is critical\
    \ for meeting user expectations and handling increased traffic or data processing\
    \ demands.\n\nLastly, this part addresses scalability and maintainability, teaching\
    \ developers how to create libraries that not only scale efficiently to handle\
    \ higher traffic but also remain easy to maintain as they mature. Balancing these\
    \ aspects is crucial for the long-term success and usability of a PHP library,\
    \ ensuring it continues to meet user needs even as it grows and evolves.\n\n##\
    \ Writing Clean and Efficient Code\n\nClean code is more than just syntax and\
    \ structure. It is a mindset. Clean code is enjoyable to read, eliminates cognitive\
    \ overload, and is easily adaptable. It lowers the cost of improvements and the\
    \ risk of bugs being introduced.\n\n### Embrace the philosophy of clean code\n\
    \nLet’s consider a basic task: extracting all the odd numbers from a list and\
    \ totaling them.\n\n```php\n<?php  \n\nfunction p($a) {  \n    $s=0;  \n    foreach($a\
    \ as $n) {  \n        if ($n % 2 == 1) {  \n            $s += $n;  \n        }\
    \  \n    }  \n    return $s;  \n}  \n\n$l = array(1, 2, 3, 4, 5, 6, 7);  \necho\
    \ p($l);  // Outputs: 16\n```\n\nIssues with the above code:\n\n*   Name of a\
    \ non-descriptive function `p()`.\n*   Variable names that are not descriptive\
    \ `$a`, `$s`, `$n`, `$l`.\n*   There are no comments or documentation.\n*   Single-letter\
    \ variable names make it difficult to find their occurrences.\n\nNow, let’s see\
    \ a different version of that code.\n\n```php\n<?php  \n\n/**  \n* Calculates\
    \ the sum of all odd numbers in an array.  \n*  \n* @param array $numbers An array\
    \ of integers.  \n* @return int The sum of all odd numbers.  \n*/  \nfunction\
    \ sumOfOdds(array $numbers): int {  \n    $total = 0;  \n    foreach ($numbers\
    \ as $number) {  \n        if ($number % 2 == 1) {  \n            $total += $number;\
    \  \n        }  \n    }  \n    return $total;  \n}  \n\n$sampleList = array(1,\
    \ 2, 3, 4, 5, 6, 7);  \necho sumOfOdds($sampleList);  // Outputs: 16\n```\n\n\
    Improvements in the new version:\n\n*   `sumOfOdds()` is a descriptive function\
    \ name.\n*   Type hinting was used for function parameters and the return type.\n\
    *   Variable names that are descriptive `$numbers`, `$total`, `$number`, `$sampleList`.\n\
    *   A dock-block comment clarifying the function’s purpose and parameters has\
    \ been added.\n\n### Adhering to naming conventions\n\n*   **Variables**: Variable\
    \ names should always be descriptive. For example, use `$number` instead of `$n`.\n\
    *   **Functions**: Functions and methods should have names that indicate what\
    \ they do. Choose `sumOfOdds()` over `p()`.\n*   **Classes**: Use nouns that express\
    \ their purpose clearly, such as `JsonEncoder`.\n\n### Pursue code efficiency\n\
    \n*   **Time complexity**: Evaluate your algorithms’ performance. Are there any\
    \ extraneous loops or redundant operations?\n*   **Space complexity**: Analyze\
    \ memory utilization in terms of space complexity. Can memory be saved by optimizing\
    \ data structures?\n*   **Database calls**: Reduce latency by minimizing and optimizing\
    \ database interactions.\n\n### Champion the cause of refactoring\n\nRefactoring\
    \ regularly aids in:\n\n*   Detecting and correcting code smells.\n*   Keeping\
    \ the codebase up to date by adopting new standards or technologies.\n*   Making\
    \ it easy to develop features without requiring expensive workarounds.\n\n###\
    \ Clarity over cleverness\n\nClever, compact code may be pleasant, but it frequently\
    \ comes at the expense of readability. Avoid utilizing deeply nested loops or\
    \ cryptic one-liners when a more verbose, straightforward answer will suffice.\n\
    \nLet’s see the following examples;\n\n```php\n<?php  \necho (function($a, $b)\
    \ { return $a * $b; })(5, 10);\n```\n\nIn this version, I’ve used an anonymous\
    \ function (also known as a lambda function) and immediately invoked it with the\
    \ arguments `5` and `10`. This compact code snippet reduces the number of lines\
    \ and eliminates the need for a named function and a separate variable for the\
    \ result. However, it’s important to note that while this is more compact, it\
    \ may be less readable, especially for those unfamiliar with anonymous functions\
    \ or immediate function invocation in PHP.\n\nA better version of this code can\
    \ be;\n\n```php\n<?php  \nfunction calculateProduct($number1, $number2) {  \n\
    \    return $number1 * $number2;  \n}  \n\n$totalProduct = calculateProduct(5,\
    \ 10);\necho $totalProduct;\n```\n"
  raw: "Improving the performance of a PHP library is also a key focus. Developers\
    \ learn about best practices that ensure their library operates smoothly and efficiently,\
    \ thus making it stand out in its field. Performance optimization is critical\
    \ for meeting user expectations and handling increased traffic or data processing\
    \ demands.\n\nLastly, this part addresses scalability and maintainability, teaching\
    \ developers how to create libraries that not only scale efficiently to handle\
    \ higher traffic but also remain easy to maintain as they mature. Balancing these\
    \ aspects is crucial for the long-term success and usability of a PHP library,\
    \ ensuring it continues to meet user needs even as it grows and evolves.\n\n##\
    \ Writing Clean and Efficient Code\n\nClean code is more than just syntax and\
    \ structure. It is a mindset. Clean code is enjoyable to read, eliminates cognitive\
    \ overload, and is easily adaptable. It lowers the cost of improvements and the\
    \ risk of bugs being introduced.\n\n### Embrace the philosophy of clean code\n\
    \nLet’s consider a basic task: extracting all the odd numbers from a list and\
    \ totaling them.\n\n<?php  \n\nfunction p($a) {  \n\n    $s\\=0;  \n\n    foreach($a\
    \ as $n) {  \n\n        if ($n % 2 \\== 1) {  \n\n            $s += $n;  \n\n\
            }  \n\n    }  \n\n    return $s;  \n\n}  \n\n$l \\= array(1, 2, 3, 4,\
    \ 5, 6, 7);  \n\necho p($l);  // Outputs: 16\n\nIssues with the above code:\n\n\
    *   Name of a non-descriptive function p().\n\n*   Variable names that are not\
    \ descriptive $a, $s, $n, $l.\n\n*   There are no comments or documentation.\n\
    \n*   Single-letter variable names make it difficult to find their occurrences.\n\
    \nNow, let’s see a different version of that code.\n\n<?php  \n\n/\\*\\*  \n\n\
     \\* Calculates the sum of all odd numbers in an array.  \n\n \\*  \n\n \\* @param\
    \ array $numbers An array of integers.  \n\n \\* @return int The sum of all odd\
    \ numbers.  \n\n \\*/  \n\nfunction sumOfOdds(array $numbers): int {  \n\n    $total\
    \ \\= 0;  \n\n    foreach ($numbers as $number) {  \n\n        if ($number % 2\
    \ \\== 1) {  \n\n            $total += $number;  \n\n        }  \n\n    }  \n\n\
        return $total;  \n\n}  \n\n$sampleList \\= array(1, 2, 3, 4, 5, 6, 7);  \n\
    \necho sumOfOdds($sampleList);  // Outputs: 16\n\nImprovements in the new version:\n\
    \n*   SumOfOdds() is a descriptive function name.\n\n*   Type hinting was used\
    \ for function parameters and the return type.\n\n*   Variable names that are\
    \ descriptive $numbers, $total, $number, $sampleList.\n\n*   A dock-block comment\
    \ clarifying the function’s purpose and parameters has been added.\n\n### Adhering\
    \ to naming conventions\n\n*   Variables: Variable names should always be descriptive.\
    \ For example, use $number instead of $n.\n\n*   Functions: Functions and methods\
    \ should have names that indicate what they do. Choose sumOfOdds() over p().\n\
    \n*   Classes: Use nouns that express their purpose clearly, such as JsonEncoder.\n\
    \n### Pursue code efficiency\n\n*   Time complexity: Evaluate your algorithms’\
    \ performance. Are there any extraneous loops or redundant operations?\n\n*  \
    \ Space complexity: Analyze memory utilization in terms of space complexity. Can\
    \ memory be saved by optimizing data structures?\n\n*   Database calls: Reduce\
    \ latency by minimizing and optimizing database interactions.\n\n### Champion\
    \ the cause of refactoring\n\nRefactoring regularly aids in:\n\n*   Detecting\
    \ and correcting code smells.\n\n*   keeping the codebase up to date by adopting\
    \ new standards or technologies.\n\n*   Making it easy to develop features without\
    \ requiring expensive workarounds.\n\n### Clarity over cleverness\n\nClever, compact\
    \ code may be pleasant, but it frequently comes at the expense of readability.\
    \ Avoid utilizing deeply nested loops or cryptic one-liners when a more verbose,\
    \ straightforward answer will suffice.\n\nLet’s see the following examples;\n\n\
    <?php  \n\necho (function($a, $b) { return $a \\* $b; })(5, 10);\n\nIn this version,\
    \ I’ve used an anonymous function (also known as a lambda function) and immediately\
    \ invoked it with the arguments 5 and 10. This compact code snippet reduces the\
    \ number of lines and eliminates the need for a named function and a separate\
    \ variable for the result. However, it’s important to note that while this is\
    \ more compact, it may be less readable, especially for those unfamiliar with\
    \ anonymous functions or immediate function invocation in PHP.\n\nA better version\
    \ of this code can be;\n\n<?php  \n\nfunction calculateProduct($number1, $number2)\
    \ {  \n\n    return $number1 \\* $number2;  \n\n}  \n\n$totalProduct \\= calculateProduct(5,\
    \ 10);  \n\necho $totalProduct;\n\nIn this version, we made the code more readable\
    \ using descriptive functions and variable names, and we embraced Clarity over\
    \ brevity by avoiding overly compact or cryptic coding styles.\n\n### The art\
    \ of self-documenting code\n\n*   Intention-revealing names: Without the need\
    \ for a comment, the name of a variable or function should reveal its intention.\n\
    \n*   Structure and layout: Logical arrangement, uniform indentation, and spacing\
    \ improve code readability.\n\n*   Error handling: Descriptive error messages\
    \ should be used to properly convey what went wrong.\n\nLet’s show-case this in\
    \ an example;\n\n<?php  \n\nfunction proc($d, $l) {  \n\n    $t \\= 365 \\* $d;\
    \  \n\n    return $t / $l;  \n\n}  \n\n$r \\= proc(3, 15000);  \n\necho $r;\n\n\
    It is unclear what the function is supposed to do in this version. The variable\
    \ and function names are both unclear. You may think it is processing something\
    \ if you had to guess but what exactly?\n\nLet’s make this code more self-documenting;\n\
    \n<?php  \n\nfunction calculateAverageMilesPerDay($totalMiles, $daysOwned) { \
    \ \n\n    $totalDaysInYear \\= 365;  \n\n    $annualMileage \\= $totalMiles \\\
    * $totalDaysInYear;  \n\n    return $annualMileage / $daysOwned;  \n\n}  \n\n\
    $averageMiles \\= calculateAverageMilesPerDay(15000, 3);  \n\necho $averageMiles;\n\
    \nIn the self-documenting version:\n\n*   The name calculateAverageMilesPerDay()\
    \ instantly conveys its purpose.\n\n*   Variable names such as $totalMiles, $daysOwned,\
    \ and $annualMieleage make their content and purpose clear.\n\n*   A descriptive\
    \ variable $totalDaysInYear is assigned the constant value 365, showing its meaning.\n\
    \n### Strategic commenting\n\n*   Why not what: code informs how something works;\
    \ comments should explain why.\n\n*   Avoid redundancy: Comments should not simply\
    \ repeat what the code already states.\n\n*   Document assumptions: Make explicit\
    \ any circumstances or assumptions that your code relies on.\n\nAs always, let’s\
    \ see an example showcasing this;\n\n<?php  \n\nfunction calculateTax($income)\
    \ {  \n\n    if ($income < 10000) {  \n\n        return $income \\* 0.05;  \n\n\
        } elseif ($income < 50000) {  \n\n        return $income \\* 0.1;  \n\n    }\
    \ else {  \n\n        return $income \\* 0.2;  \n\n    }  \n\n}  \n\n$taxAmount\
    \ \\= calculateTax(25000);  \n\necho $taxAmount;\n\nThe function in the above\
    \ code calculates the tax based on income slabs, however, it is not immediately\
    \ evident why these specific rates or slabs were chosen.\n\nNow, let’s see a better\
    \ version of this code;\n\n<?php  \n\n/\\*\\*  \n\n \\* Calculate the tax based\
    \ on progressive tax brackets.  \n\n \\*  \n\n \\* Tax Brackets:  \n\n \\* - Income\
    \ < $10,000: 5% tax  \n\n \\* - $10,000 <= Income < $50,000: 10% tax  \n\n \\\
    * - Income >= $50,000: 20% tax  \n\n \\*  \n\n \\* Note: These brackets are based\
    \ on the 2023 fiscal tax regulations.  \n\n \\*  \n\n \\* @param float $income\
    \ The income amount.  \n\n \\* @return float The calculated tax.  \n\n \\*/  \n\
    \nfunction calculateTax($income) {  \n\n    if ($income < 10000) {  \n\n        //\
    \ Lower income bracket pays least tax  \n\n        return $income \\* 0.05;  \n\
    \n    } elseif ($income < 50000) {  \n\n        // Middle income bracket has moderate\
    \ tax  \n\n        return $income \\* 0.1;  \n\n    } else {  \n\n        // Highest\
    \ earners pay highest tax  \n\n        return $income \\* 0.2;  \n\n    }  \n\n\
    }  \n\n$taxAmount \\= calculateTax(25000);  \n\necho $taxAmount;\n\nIn the above\
    \ version using strategic comments:\n\n*   At the outset, we offered an overview\
    \ of the function’s purpose.\n\n*   The rationale for the various tax brackets\
    \ is discussed."
