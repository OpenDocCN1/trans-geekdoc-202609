  trans: "\n\nPHP 使用 `namespace` 关键字来声明命名空间。这些命名空间的设计理念是防止代码实体因共享相同名称而产生非预期的冲突。你可以使用命名空间，在不同位置使用名称相同的类、函数和常量时避开命名冲突。\n\
    \n## 声明命名空间\n\n要声明命名空间，请使用关键字 `namespace` 后紧跟你的命名空间名称。最需要记住的一点是，命名空间的声明应该位于 PHP\
    \ 文件的开头，在任何代码之前（`declare` 语句和注释除外）。\n\n示例：\n\n```php\n<?php  \n\n// 声明此文件中的代码属于\
    \ \"Jazzon\" 命名空间\n\nnamespace Jazzon;\n```\n\n通过使用关键字 `namespace` 以及命名空间名称（此处为\
    \ `Jazzon`），它声明了从此处开始对特定文件中所有其他代码的可见性。\n\n## 使用命名空间实体\n\n你可以通过以下三种类型之一访问在命名空间内部定义的实体：\n\
    \n1. **完全限定名（Fully Qualified Name）**：从全局命名空间开始，包含类、函数或常量的完全限定名（FQN）：\n\n```php\n\
    <?php  \n\n// 从 `Jazzon\\Decoding` 命名空间实例化 `DecodedValue` 类的一个新实例\n\n// 通过提供 `$data`\
    \ 和 `$bytesConsumed` 作为构造函数参数\n\n$result = new \\Jazzon\\Decoding\\DecodedValue($data,\
    \ $bytesConsumed);\n```\n\n类名之前的反斜杠（并同样用反斜杠分隔）告诉脚本引用该类的全局命名空间位置。在这里，例如，为 `Jazzon\\\
    Decoding` 命名空间实例化 `DecodedValue` 类的一个实例。在实例化时，构造函数参数 `$data` 和 `$bytesConsumed`\
    \ 被传递到 `DecodedValue` 类。\n\n2. **使用 use 导入**：使用 `use` 语句导入类、函数或常量，然后在代码中可以直接使用，而无需命名空间前缀：\n\
    \n```php\n<?php  \n\n// 从 `Jazzon\\Decoding` 命名空间导入 `DecodedValue` 类，以便在无需完整命名空间的情况下引用它\n\
    \nuse Jazzon\\Decoding\\DecodedValue;  \n\n// 实例化（来自导入的命名空间）`DecodedValue` 类的一个新实例\n\
    \n// 通过提供 `$data` 和 `$bytesConsumed` 作为构造函数参数\n\n$result = new DecodedValue($data,\
    \ $bytesConsumed);\n```\n\n与之前一样，构造函数参数 `$data` 和 `$bytesConsumed` 在实例化期间被传递。\n\
    \n3. **别名或使用 use 导入**：当一个文件中存在两个同名的类时，你可以使用 `as` 关键字为其中任一个创建别名：\n\n```php\n<?php\
    \  \n\n// 从 `AnotherLibrary\\Decoding` 导入 `DecodedValue` 类\n\nuse AnotherLibrary\\\
    Decoding\\DecodedValue;  \n\n// 从 `Jazzon\\Decoding` 导入 `DecodedValue` 类并给它起一个别名\
    \ \"JazzonDecodedValue\"  \n\n// 以避免与上述导入发生名称冲突\n\nuse Jazzon\\Decoding\\DecodedValue\
    \ as XMLDecodedValue;  \n\n// 实例化（来自 `AnotherLibrary\\Decoding`）`DecodedValue`\
    \ 类的一个新实例\n\n// 通过提供 `$data` 和 `$bytesConsumed` 作为构造函数参数\n\n$result = new DecodedValue($data,\
    \ $bytesConsumed); // 这是 `AnotherLibrary\\Decoding\\DecodedValue`  \n\n// 使用别名实例化（来自\
    \ `Jazzon\\Decoding`）`DecodedValue` 类的一个新实例\n\n// 通过提供 `$data` 和 `$bytesConsumed`\
    \ 作为构造函数参数\n\n$jazzonResult = new XMLDecodedValue($data, $bytesConsumed); // 这是\
    \ `Jazzon\\Decoding\\DecodedValue`\n```\n\n因此，别名帮助我们同时使用来自不同命名空间或库的同名类，而它们之间不会产生任何冲突。它确保了代码块内清晰的边界，同时避免了潜在的歧义或错误。\n\
    \n命名空间是开发大型复杂应用程序或库时，PHP 的一个非常重要的特性。它有助于组织代码、避免命名冲突，并提高代码在其他项目中的重用性。良好掌握命名空间的工作原理可以极大提升你\
    \ PHP 代码的质量。\n\n## PHP 中的高级命名空间\n\n在上一节中，我们从零开始学习了命名空间。现在，让我们进入 PHP 命名空间的高用法。在本节中，我们将学习命名空间运算符、命名空间别名以及多个类的导入和全局空间的使用。\n\
    \n### 命名空间运算符\n\nPHP 有两种类型的命名空间运算符：\n\n1. `\\` - 完全限定名运算符，用于从给定的命名空间内部引用任何全局类、函数或常量，或者通过其完全限定名（包含直到根目录的父命名空间）访问任何类、函数或常量：\n\
    \n```php\n<?php  \n\n// 声明此文件中的代码属于 \"Jazzon\\Decoding\" 命名空间\n\nnamespace Jazzon\\\
    Decoding;  \n\n// 从 `Jazzon\\Decoding` 命名空间实例化 `DecodedValue` 类的一个新实例\n\n// 通过提供\
    \ `$data` 和 `$bytesConsumed` 作为构造函数参数\n\n$result = new \\Jazzon\\Decoding\\DecodedValue($data,\
    \ $bytesConsumed);  \n\n// 使用全局命名空间中的全局函数\n\n$value = \\str_replace(\" \", \"\"\
    , $value);\n```\n\n2. `namespace\\` - 要引用当前命名空间，使用 namespace 关键字：\n\n```php\n\
    <?php  \n\n// 声明此文件中的代码属于 \"Jazzon\\Decoding\" 命名空间\n\nnamespace Jazzon\\Decoding;\
    \  \n\nfunction test() {  \n    return 'Jazzon\\Decoding namespace function';\
    \  \n}  \n\n// 从当前命名空间 (Jazzon\\Decoding) 调用 test 函数\n\necho namespace\\test();\
    \ // 输出: Jazzon\\Decoding namespace\n```\n\n### 命名空间的别名和导入\n\n你经常需要来自其他命名空间的类。很不方便的是，每次都需要输入创建该类的命名空间。PHP\
    \ 引入了一种运算符，允许你导入/别名类、函数和常量。\n\n### 类别名和导入\n\n我们可以使用 `use` 关键字将另一个命名空间的类导入到此文件中：\n\
    \n```php\n<?php  \n\n// 声明此文件中的代码属于 \"Jazzon\\Parsers\" 命名空间\n\nnamespace Jazzon\\\
    Parsers;  \n\n// 从 `Jazzon\\Decoding` 命名空间导入 `DecodedValue` 类\n\nuse Jazzon\\\
    Decoding\\DecodedValue;  \n\n// 通过提供 `$data` 和 `$bytesConsumed` 作为构造函数参数实例化 `DecodedValue`\
    \ 类\n\n$result = new DecodedValue($data, $bytesConsumed);\n```\n\n### 类别名/导入和重命名\n\
    \n有时我们导入的类在不同命名空间中存在同名的类。在这种情况下，为了避免这些类的冲突，我们在导入后可以使用 `as` 关键字给它起一个别名：\n\n```php\n\
    <?php  \n\n// 声明此文件中的代码属于 \"Jazzon\\Parsers\" 命名空间\n\nnamespace Jazzon\\Parsers;\
    \  \n\n// 从 `Jazzon\\Decoding` 命名空间导入 `DecodedValue` 类并给它起一个别名 \"DValue\"\n\n\
    use Jazzon\\Decoding\\DecodedValue as DValue;  \n\n// 使用别名通过提供 `$data` 和 `$bytesConsumed`\
    \ 作为构造函数参数实例化 `DecodedValue` 类\n\n$result = new DValue($data, $bytesConsumed);\n\
    ```\n\n### 分组导入声明\n\n分组导入的概念也是随着 PHP 7 出现的，允许我们从同一个命名空间导入多个项：\n\n```php\n<?php\
    \  \n\n// 声明此文件中的代码属于 \"Jazzon\\Parsers\" 命名空间\n\nnamespace Jazzon\\Parsers; \
    \ \n\n// 使用分组 `use` 语句从 `Jazzon\\Decoding` 命名空间导入多个类\n\nuse Jazzon\\Decoding\\\
    {  \n    DecodedValue,  \n    AnotherClass,  \n    YetAnotherClass  \n};  \n\n\
    // 通过提供 `$data` 和 `$bytesConsumed` 作为构造函数参数实例化 `DecodedValue` 类\n\n$result = new\
    \ DecodedValue($data, $bytesConsumed);\n```\n\n"
- fmt: "\n```php\n$result = new DecodedValue($data, $bytesConsumed);\n```\n\n### Using\
    \ global classes, functions, and constants\n\nAll qualified or unqualified class\
    \ names whose initial part is not specified using a backslash will be resolved\
    \ relative to the current namespace.\n\nConsequently, global classes will refer\
    \ to fully qualified names commencing with a backslash:\n\n```php\n<?php  \n\n\
    // Declare that the code in this file belongs to the \"Jazzon\\\\Parsers\" namespace\
    \  \n\nnamespace Jazzon\\\\Parsers;  \n\n// Instantiate the DateTime class from\
    \ the global namespace  \n\n$dateTime = new \\DateTime();\n```\n\nIn the case\
    \ of functions and constants, PHP will look to the current namespace for a function\
    \ or constant with that name. If it can’t find one, then it just grabs the global\
    \ function or constant:\n\n```php\n<?php  \n\n// Declare that the code in this\
    \ file belongs to the \"Jazzon\\\\Parsers\" namespace  \n\nnamespace Jazzon\\\\\
    Parsers;  \n\n// Use the strlen global function without the leading backslash\
    \  \n\n$value = strlen(\"Hello\");  \n\n// print out the value of the `$value`\
    \ variable  \n\necho $value;\n```\n\nBut if you want to be sure you’re pulling\
    \ in the global function, use its fully qualified name:\n\n```php\n<?php  \n\n\
    // Declare that the code in this file belongs to the \"Jazzon\\\\Parsers\" namespace\
    \  \n\nnamespace Jazzon\\\\Parsers;  \n\n// Use the strlen global function with\
    \ the leading backslash to ensure it's the global function  \n\n$value = \\strlen(\"\
    Hello\");  \n\n// print out the value of the `$value` variable  \n\necho $value;\n\
    ```\n\nWhile at first glance all these little details about PHP namespaces might\
    \ seem daunting - once they are mastered, this new tool provides an excellent\
    \ way to structure and organize your code better. By grasping how sophisticated\
    \ namespace capabilities work together, more effective and maintainable PHP code\
    \ is possible.\n\n## Autoloading in PHP\n\nSo far, we have dug deep into PHP namespaces\
    \ and examined their advanced usage. This lesson will look into another critical\
    \ PHP concept - Autoloading.\n\nIn PHP, autoloading is a technique that loads\
    \ PHP classes without human/manual inclusion via the `require` or the `include`\
    \ keywords. It tells PHP, That when I use a class that hasn’t been required or\
    \ included yet, go find the file that contains the class definition, and load\
    \ it.\n\n### Importance of autoloading\n\nManaging the dependencies between different\
    \ classes and files becomes increasingly difficult as your project grows in size.\
    \ You may find that you need to require multiple files at the start of your script,\
    \ which can be cluttered and difficult to maintain.\n\nHere is where autoloading\
    \ comes into play. With an autoloader, you simply utilize the classes you require,\
    \ and PHP will automatically load the necessary files. This will result in cleaner,\
    \ easier-to-maintain code.\n\n### The spl_autoload_register function\n\nPHP has\
    \ a function for registering autoloaders called `spl_autoload_register()`, you\
    \ can pass a callback function to `spl_autoload_register`, and it will be invoked\
    \ if you try to use a class that hasn’t yet been defined.\n\nFollowing is a simple\
    \ example of how to use `spl_autoload_register`;\n\nFirst let’s create a simple\
    \ class to use, `MyClass.php`:\n\n```php\n<?php  \n\n// Declare the class  \n\n\
    class MyClass {  \n\n    // Class constructor  \n\n    public function __construct()\
    \ {  \n        // This will be executed when a new instance of MyClass is created\
    \  \n        echo \"MyClass has been instantiated!\";  \n    }  \n\n    // Additional\
    \ methods and properties can be added here  \n}\n```\n\nThen, we have our `autoload.php`\
    \ file where we use the `spl_autoload_register` function to load our class:\n\n\
    ```php\n<?php  \n\n// Register a custom autoloader function  \n\nspl_autoload_register(function\
    \ ($class) {  \n    // Attempt to require a PHP file with the name of the class\
    \ from the current directory  \n    require __DIR__ . '/' . $class . '.php'; \
    \ \n});  \n\n// Create a new instance of MyClass.  \n// If 'MyClass.php' exists\
    \ in the current directory, it will be automatically loaded  \n\nnew MyClass();\n\
    ```\n\nThe `$class` parameter in the callback function will be the fully qualified\
    \ name of the class that needs to be loaded. This includes the namespace, so keep\
    \ directory structure and name in mind.\n\n### Autoloading and namespaces\n\n\
    We previously discussed PHP namespaces and how they may be used to group related\
