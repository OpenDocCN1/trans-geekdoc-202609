  trans: "\n\n最佳实践是编写优秀 PHPDoc 注释的基础。本课程将介绍这些技术，以确保你的文档脱颖而出。\n\n## 简洁且描述清晰\n\nPHPDoc\
    \ 旨在作为一个快速参考指南，而不是完整的手册。\n\n*   **要做**：提供简短的概述，立即明确代码的用途。\n\n    ```php\n    /**\n\
    \     * 计算用户的年龄。 \n     */\n    ```\n\n*   **不要**：用不必要的细节让注释块负担过重。\n\n    ```php\n\
    \    /**\n     * 此方法根据用户提供的出生日期来计算年龄。\n     */\n    ```\n\n## 文档公共 API\n\n公共 API\
    \ 是你的库或框架的门面。适当的文档确保使用者能够毫不费力地使用它们。\n\n*   为所有公共类、方法和属性提供 PHPDoc 注释。\n\n*   内部或私有方法可以有更宽松的文档要求。\n\
    \n## 一致的数据类型\n\n它确保了预期的输入和输出是清晰的。\n\n*   在 `@param` 和 `@return` 标签中，始终标明类型。\n\n\
    *   谨慎使用多类型声明。\n\n    ```php\n    /**\n     * @param int|string $value \n    \
    \ */\n    ```\n\n## 随更改更新\n\n过时的文档会引起困惑，弊大于利。\n\n*   当代码（特别是逻辑或参数）发生时，调整 PHPDoc\
    \ 注释。\n\n*   在代码库审计中，定期检查文档。\n\n## 避免冗余\n\n冗余信息会造成阻塞并分散注意力。\n\n*   如果函数名为 `setUsername()`，请避免在\
    \ PHPDoc 注释中编写“设置用户名”。\n\n*   相反，请包含条件、返回值或特殊实例。\n\n检查以下示例，并比较这两个函数的 PHPDoc；\n\
    \n```php\n<?php  \n\n/**  \n * 这是一个不该做法的示例：  \n *  \n * @param string $username\
    \ 要设置的用户名  \n * @return void  \n */  \npublic function setUsername($username)\
    \ {  \n    // ... implementation ...  \n}  \n\n// 对比：  \n\n/**  \n * 分配一个非空用户名。\
    \  \n *  \n * @param string $username 有效的字母数字用户名；最多 15 个字符。  \n * @throws InvalidArgumentException\
    \ 如果用户名为空或无效。  \n * @return void  \n */  \npublic function setUsername($username)\
    \ {  \n    if (empty($username) || !preg_match('/^[a-zA-Z0-9]{1,15}$/', $username))\
    \ {  \n        throw new InvalidArgumentException(\"Invalid username provided.\"\
    );  \n    }  \n    // ... further implementation ...  \n}\n```\n\n第一个示例中的注释没有提供方法名显而易见之外的信息。第二个示例中修改后的注释强调了用户名标准并指出了可能出现的异常，为开发者增加了价值。\n\
    \n## 注意异常\n\n帮助用户和开发者预测并处理问题。\n\n*   要指定可能抛出的异常，请使用 `@throw` 标签。\n\n*   为要抛出的异常提供要求。\n\
    \n    ```php\n    /**\n     * @throws InvalidArgumentException 如果 $username 为空。\
    \  \n     */\n    ```\n\n## 第三人称语气\n\n保持整个文档的一致性和清晰度。\n\n*   将“This method will\
    \ return the value”（此方法将返回该值）替换为“Returns the value”（返回该值）。\n\n```php\n<?php  \n\
    \n/**  \n * 这是一个不该做法的示例：  \n *  \n * This method will retrieve the total price\
    \ of the items in the cart.  \n *  \n * @return float  \n */  \npublic function\
    \ getTotalPrice() {  \n    // ... implementation ...  \n}  \n\n// 对比：  \n\n/**\
    \  \n * 这是一个正确做法的示例：  \n *  \n * Retrieves the total price of items.  \n *  \n\
    \ * @return float  \n */  \npublic function getTotalPrice() {  \n    // ... further\
    \ implementation ...  \n}\n```\n\n## 使用 Jazzon 最佳实践\n\n考虑以下场景，以我们的 Jazzon 库为背景：\n\
    \n```php\n<?php  \n\n/**  \n * 将值编码为 JSON。  \n *  \n * @param mixed $value 要编码的值。\
    \  \n * @return string 编码后的 JSON 字符串。  \n * @throws JsonEncodeException 如果编码失败。\
    \  \n */  \npublic function encode($value): string  \n{  \n    // ...  \n}\n```\n\
    \n清楚地看到，我们在为 `encode()` 函数编写 PHPDoc 注释块时采用了所有的最佳实践。\n\n采用 PHPDoc 最佳实践体现了你对清晰、专业和开发者友好的追求。在你继续开发像\
    \ Jazzon 这样的 PHP 库/应用程序时，使用这些策略来确保你的文档成为 PHP 社区的指南明灯。\n\n## 使用 PHPDoc 生成代码文档\n\
    \nPHPDoc 就像 Java 的 JavaDoc 一样，不仅关于编写注释，还关乎如何利用这些注释获取完整的文档。一旦你对代码编写了极其精确且注重细节的注释，下一步就涉及使用工具扫描这些注释并生成格式化、可读性强的文档。\n\
    \nPHPDocumentor（也称为 phpdoc）是创建文档的行业标准工具。\n\n### 安装\n\n遗憾的是，根据 phpdoc 文档，不建议通过\
    \ Composer 安装。为了此目的，我们将使用 `phive`。\n\n请确保先安装 `phive`。\n\n现在让我们使用 `phive` 安装 PHPDocumentor：\n\
    \n```bash\nphive install --force phpdoc\n```\n\n### 使用\n\n安装后，运行 PHPDocumentor\
    \ 只需要输入：\n\n```bash\nphp tools/phpDocumentor -d src/ -d tests/\n```\n\n使用 `-d`\
    \ 来指定你想要为哪些目录生成文档。默认情况下，此命令将查找当前目录下的 PHP 文件，读取它们的 phpdoc 注释并将 HTML 写入名为 `output`\
    \ 的文件夹中。\n\n找到 phpdoc 索引页\n\n在浏览器中打开此 `index.html` 将让你得到类似下面的的内容：\n\n### 输出格式配置\n\
    \n虽然 HTML 是默认输出格式，但 PHPDocumentor 也支持 PDF、CHM 和 XML。这种灵活性确保了你可以创建符合团队或客户要求的文档。\n\
    \n你可以通过在上述运行命令中添加 `--template` 选项来指定你想使用的格式：\n\n```bash\nphp tools/phpDocumentor\
    \ -d src/ -d tests/ --template=PDF\n```\n\n### 使用 phpdoc.xml 进行高级配置\n\n对于较大的项目，通常创建一个名为\
    \ `phpdoc.xml` 的配置文件更方便。这些文件可以指定搜索和忽略的目录，并构建模板。\n\n一个 `phpdoc.xml` 文件如下：\n\n```xml\n\
    <phpdocumentor>\n  <title>Jazzon Library Documentation</title>\n  <files>\n  \
    \  <directory>src/</directory>\n    <directory>tests/</directory>\n    <ignore>vendor/</ignore>\n\
    \  </files>\n</phpdocumentor>\n```\n\n通过这些配置，PHPDocumentor 将仅检查 `src` 和 `tests`\
    \ 目录，而忽略 `vendor` 目录中的任何文件。\n\n## 导航生成的文档\n\nPHPDocumentor 文档的主要优势是其可导航性。\n\n\
    *   类层次结构、方法摘要和文件结构直观地排列。\n\n*   可点击的连接引导读者查看相关的类、方法和属性。\n\n*   例如，颜色编码显示了可见性（公共、私有或保护）。\n\
    \n"
