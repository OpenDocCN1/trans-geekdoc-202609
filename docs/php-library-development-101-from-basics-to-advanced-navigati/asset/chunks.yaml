    \n# 理解 PHP 库的架构\n\n在这一部分，读者将沉浸在 PHP 生态系统中库设计的世界中。这部分旨在提供对如何创建结构良好、高效库的深度理解。它首先强调设计模式的使用，这对于开发可重复、可扩展且清晰的软件解决方案至关重要。鼓励读者获得这些模式的实践经验，这些模式对于开发健壮且模块化的\
    \ PHP 库至关重要。\n\n## 设计模式概述\n\n软件中的设计模式是解决软件设计中常见问题的复用方案。它们不是完成的设计，而是解决许多不同场景下出现问题的模板。\n\
    \n### 模式类型\n\n模式通常分为三类：\n\n| 类型 | 特征 | 示例 |\n| :--- | :--- | :--- |\n| 创建型 (Creational)\
    \ | 对象创建、抽象 | 单例模式 (Singleton)、抽象工厂 (Abstract Factory) |\n| 结构型 (Structural) |\
    \ 对象组合、关系 | 装饰器 (Decorator)、桥接 (Bridge) |\n| 行为型 (Behavioral) | 对象通信、职责 | 观察者\
    \ (Observer)、命令 (Command)、策略 (Strategy) |\n\n## 创建型模式\n\n创建型模式处理对象的创建机制，试图以适合情况的方式创建对象。\n\
    \n### 单例模式 (Singleton)\n\n单例模式将类的实例化限制为一个对象，并为其提供全局访问点。\n\n```php\n<?php \n\n\
    // 声明一个名为 Singleton 的类\nclass Singleton {  \n    // 声明一个静态私有变量 $instance。这将存储\
    \ Singleton 类的唯一实例。  \n    private static $instance;  \n\n    // 声明私有构造函数以防止 Singleton\
    \ 类的直接实例化。  \n    private function __construct() {}  \n\n    // 声明公共静态函数 getInstance\
    \ 来获取 Singleton 类的唯一实例。  \n    public static function getInstance() {  \n    \
    \  // 检查 $instance 变量是否为空。  \n      if (self::$instance === null) {  \n      \
    \  // 如果为空，创建 Singleton 类的类实例并存储在 $instance 变量中。  \n        self::$instance =\
    \ new self();  \n      }  \n      // 返回 Singleton 类的实例。  \n      return self::$instance;\
    \  \n    }  \n}\n\n// 获取 Singleton 类的唯一实例并存储在 $singleton 变量中。  \n$singleton =\
    \ Singleton::getInstance();  \n\nvar_dump($singleton);\n```\n\n### 工厂方法 (Factory\
    \ Method)\n\n工厂方法为父类中的创建对象提供接口，但允许子类更改创建对象的类型。\n\n```php\n<?php \n\n// 声明一个带有\
    \ describe 方法的接口 Product。  \ninterface Product {  \n    public function describe();\
    \  \n}  \n\n// 声明一个实现了 Product 接口的类 ConcreteProductA。  \n```\n\n"
- fmt: "\n```php\nclass ConcreteProductA implements Product {\n    // Implement the\
    \ describe method from the Product interface.\n    public function describe()\
    \ {\n        echo \"I'm product A!\";\n    }\n}\n\n// Declare a class named ProductFactory\
    \ for creating products.\nclass ProductFactory {\n    // Declare a public static\
    \ method named createProduct which takes a parameter $type.\n    public static\
    \ function createProduct($type) {\n        // Check if the $type parameter is\
    \ 'A'.\n        if ($type === 'A') {\n            // If it is, return a new instance\
    \ of the ConcreteProductA class.\n            return new ConcreteProductA();\n\
    \        }\n        // ... other products can be added here in similar fashion.\n\
    \    }\n}\n\n// Use the ProductFactory class to create a product of type 'A' and\
    \ store it in the $product variable.\n$product = ProductFactory::createProduct('A');\n\
    \n// Call the describe method on the $product object.\n$product->describe();\n\
    ```\n\n* Abstract Factory provides an interface for creating families of related\
    \ or dependent objects without specifying their concrete classes. Example:\n\n\
    ```php\n<?php\n// Declare an interface named Button with a method click.\ninterface\
    \ Button {\n    public function click();\n}\n\n// Declare an interface named Window\
    \ with a method open.\ninterface Window {\n    public function open();\n}\n\n\
    // Declare a class named ConcreteButtonA that implements the Button interface.\n\
    class ConcreteButtonA implements Button {\n    // Implement the click method from\
    \ the Button interface.\n    public function click() {\n        echo \"Button\
    \ A clicked!\";\n    }\n}\n\n// Declare a class named ConcreteWindowA that implements\
    \ the Window interface.\nclass ConcreteWindowA implements Window {\n    // Implement\
    \ the open method from the Window interface.\n    public function open() {\n \
    \       echo \"Window A opened!\";\n    }\n}\n\n// Declare an interface named\
    \ GUIFactory with methods createButton and createWindow.\ninterface GUIFactory\
    \ {\n    public function createButton();\n    public function createWindow();\n\
    }\n\n// Declare a class named ConcreteGUIFactoryA that implements the GUIFactory\
    \ interface.\nclass ConcreteGUIFactoryA implements GUIFactory {\n    // Implement\
    \ the createButton method from the GUIFactory interface.\n    public function\
    \ createButton() {\n        // Return a new instance of the ConcreteButtonA class.\n\
    \        return new ConcreteButtonA();\n    }\n    // Implement the createWindow\
    \ method from the GUIFactory interface.\n    public function createWindow() {\n\
    \        // Return a new instance of the ConcreteWindowA class.\n        return\
    \ new ConcreteWindowA();\n    }\n}\n// Create a new instance of the ConcreteGUIFactory\
    \ class and store it in the $factory variable.\n$factory = new ConcreteGUIFactory();\n\
    // Use the $factory object to create a button and store it in the $button variable.\n\
    $button = $factory->createButton();\n// Call the click method on the $button object.\n\
    $button->click();\n```\n\n* Structural: They deal with composition of objects\
    \ and help form large structures. Provides ways to identify relationships between\
    \ objects that simplify the design. Examples:\n\n* Decorator allows adding behavior\
    \ to an individual object, either statically or dynamically without affecting\
    \ the behavior of other objects of the same class. Example:\n\n```php\n<?php\n\
    // Declare an interface named Coffee with a method getCost.\ninterface Coffee\
    \ {\n    public function getCost();\n}\n\n// Declare a class named SimpleCoffee\
    \ that implements the interface.\nclass SimpleCoffee implements Coffee {\n   \
    \ // Implement the getCost method from the Coffee interface.\n    public function\
    \ getCost() {\n        // Return a cost of 10.\n        return 10;\n    }\n}\n\
    \n// Declare a class named MilkDecorator that implements the Coffee interface.\
    \ This class will act as decorator.\nclass MilkDecorator implements Coffee {\n\
    \    // Declare a protected variable to store the coffee instance that will be\
    \ decorated.\n    protected $coffee;\n    // Constructor to inject the Coffee\
    \ instance that will be decorated.\n    public function __construct(Coffee $coffee)\
    \ {\n        $this->coffee = $coffee;\n    }\n    // Implement the getCost method\
    \ from the Coffee interface.\n    public function getCost() {\n        // Return\
    \ the sum of the coffee's cost and an additional 2 for the milk.\n        return\
    \ $this->coffee->getCost() + 2;\n    }\n}\n// Create a new SimpleCoffee instance.\n\
    $coffee = new SimpleCoffee();\n// Decorate the $coffee instance with MilkDecorator.\n\
    $coffeeWithMilk = new MilkDecorator($coffee);\n// Output the cost of the coffee\
    \ with milk.\necho $coffeeWithMilk->getCost();\n```\n\n* Adapter allows classes\
    \ with incompatible interfaces to work together by creating an intermediate class\
    \ that translates requests from one to another. Example:\n\n```php\n<?php\n//\
    \ Old Interface\ninterface OldInterface {\n    public function oldRequest();\n\
    }\n\n// Old Class implementing Old Interface\nclass OldClass implements OldInterface\
    \ {\n    public function oldRequest() {\n        return \"Old request data\";\n\
    \    }\n}\n\n// New Interface\ninterface NewInterface {\n    public function request();\n\
    }\n\n// Adapter Class\nclass Adapter implements NewInterface {\n    private $old;\n\
    \    public function __construct(OldInterface $old) {\n        $this->old = $old;\n\
    \    }\n    // Adapt the oldRequest method to fit the new interface\n    public\
    \ function request() {\n        $oldData = $this->old->oldRequest();\n       \
    \ // Adapting the data from a string to an array\n        return ['adaptedData'\
    \ => $oldData];\n    }\n}\n// Usage\n$old = new OldClass();\n$adapter = new Adapter($old);\n\
    // The adapter now returns the old data in a new format\nprint_r($adapter->request());\n\
    ```\n\n* Bridge allows the separation between the object’s interface and its implementation\
    \ allowing the two to vary independently.\n\n* Behavioral: They focus on the communication\
    \ between objects and define how objects interrelate. They are more concerned\
    \ with algorithms and responsibilities assigned to different objects. Example:\n\
    \n* Observer defines a one-to-many dependency between objects so that when one\
    \ object state changes all its dependents are notified about this change automatically.\
    \ Example:\n\n```php\n<?php\n// Declare an interface named Observer with a method\
    \ update.\ninterface Observer {\n    public function update($message);\n}\n\n\
    // Declare a class named ConcreteObserver that implements the Observer interface.\n\
    class ConcreteObserver implements Observer {\n    // Implement the update method\
    \ from the Observer interface.\n    public function update($message) {\n     \
    \   // Display the received message.\n        echo \"Received: $message\";\n \
    \   }\n}\n\n// Declare a class named Subject to manage and notify its observers.\n\
    class Subject {\n    // Declare a private variable as an array to store observer\
    \ instances.\n    private $observers = [];\n    // Method to add an observer to\
    \ the Subject's list of observers.\n    public function addObserver(Observer $observer)\
    \ {\n```\n"
