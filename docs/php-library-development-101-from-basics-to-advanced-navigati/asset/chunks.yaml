      // We need to calculate the number of bytes consumed by the json\\_decode function.\
    \  \n\n  // One way of doing this is by calculating the JSON string length.  \n\
    \n  // Note: This is the easiest and most direct way to calculate the codes, it\
    \ could be replaced with a more efficient way.  \n\n  $bytesConsumed \\= strlen($this\\\
    ->jsonValue);  \n\n  // Here we will use PHP's built-in json\\_decode() function\
    \  \n\n  // We will also handle any errors that might occur during parsing  \n\
    \n  $result \\= json\\_decode($this\\->jsonValue, $assoc, $depth, $options); \
    \ \n\n  if (json\\_last\\_error() !== JSON\\_ERROR\\_NONE) {  \n\n      throw\
    \ new JsonException(json\\_last\\_error\\_msg());  \n\n  }  \n\n  // Now we create\
    \ a new DecodedValue object and return it  \n\n  return new DecodedValue($result,\
    \ $bytesConsumed);  \n\n}\n\nLet us break down this function from a high level\
    \ to see what it does:\n\n*   The parse method converts a JSON string to an object\
    \ or array. Other optional parameters that this method receives are $assoc, which\
    \ is used to determine whether an associative array needs to be returned rather\
    \ than an object, $depth for recursion depth and $options to select decode options.\
    \ It expects to return an instance of class DecodedValue if successful otherwise\
    \ throws a JsonException.\n\n*   Validation is done based on an assumed member\
    \ variable called jsonValidator. If not validated then throw back a JsonException.\n\
    \n*   Then, it computes the number of bytes a JSON string took with strlen().\n\
    \n*   It utilizes PHP’s built-in function to decode a JSON string, json\\_decode().\
    \ In case any decoding error occurs it throws a JsonException containing an error\
    \ description."
