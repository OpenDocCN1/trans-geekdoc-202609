    \  \n\n/\\*\\*  \n\n \\* Encodes data to a JSON string  \n\n \\*  \n\n \\* @param\
    \ int $options \\[Optional\\] Bitmask of JSON encode options.  \n\n \\* @param\
    \ int $depth \\[Optional\\] Set the maximum depth. It must be greater than zero.\
    \  \n\n \\* @return string  \n\n \\* @throws JsonException  \n\n\\*/  \n\nfunction\
    \ encode(int $options \\= 0, int $depth \\= 512): string  \n\n{  \n\n  // Here\
    \ we will use PHP's built-in json\\_encode() function  \n\n  // We will also handle\
    \ any errors that might occur during encoding  \n\n  $result \\= json\\_encode($this\\\
    ->valueToEncode, $options, $depth);  \n\n  if (json\\_last\\_error() !== JSON\\\
    _ERROR\\_NONE) {  \n\n       throw new JsonException(json\\_last\\_error\\_msg());\
    \  \n\n  }  \n\n  return $result;  \n\n}\n\nLet us break down this function from\
    \ a high level to see what it does:\n\n*   The defined encode function transforms\
    \ PHP data into formatted JSON string format. This optionally takes parameters:\
    \ $options for setting encode options and $depth for maximum recursion depth.\
    \ It will either return encoded JSON as a result or throw an exception of type\
    \ JsonException.\n\n*   Encodes the given data with PHP’s in-built json\\_encode()\
    \ function. If an error occurs while encoding, throws a JsonException with an\
    \ appropriate error message.\n\n*   Returns the successfully encoded JSON string.\n\
    \nWe use the PHP built-in function called json\\_encode() to convert the PHP array/object\
    \ into JSON string and throw a JsonException whenever an error happens.\n\n###\
    \ validate()\n\n<?php  \n\n/\\*\\*  \n\n \\* Validates a JSON string  \n\n \\\
    *  \n\n \\* @param string $json The JSON string to validate  \n\n \\* @return\
    \ bool Returns true if the JSON string is valid, false otherwise  \n\n\\*/  \n\
    \npublic function validate(string $json): bool  \n\n{  \n\n    // We'll use json\\\
    _decode() to try to decode the string.  \n\n    // If it returns null, and we\
    \ know the string is not 'null',  \n\n    // then it's not valid JSON.  \n\n    $decoded\
    \ \\= json\\_decode($json);  \n\n    if ($decoded \\=== null && strtolower($json)\
    \ !== 'null') {  \n\n        return false;  \n\n    }  \n\n    return true;  \n\
    \n}\n\nLet us break down this function from a high level to see what it does:\n\
    \n*   Defines the validate function to validate a provided JSON string. The function\
    \ returns a boolean value that indicates whether or not validation passed.\n\n\
    *   If decoding the JSON string with json\\_decode() results in null and the provided\
    \ string is not explicitly ‘null’, then it determines that the JSON string was\
    \ invalid.\n\n*   If the decoding is successful, the function returns true, indicating\
    \ the JSON is valid.\n\nNext, we are going to set everything together and have\
    \ a complete implementation of our library classes.\n\n## Assemble the Library\
    \ Classes\n\nWe have done a great job so far by designing the library and implementing\
    \ its core functions, and now it is time to integrate our functions into the library\
    \ classes and ensure they are properly namespaces.\n\n{notice} You can find the\
    \ whole library classes implementation in the provided folder called jazzon-lib-classes-implmentation,\
    \ you can open and modify it as you desire.\n\nWe will create namespaces (directories)\
    \ for every part so we will end up with the following namespaces in our project:\n\
    \n*   Jazzon The parent namespace.\n\n*   Decoding For the decoded value object\
    \ value class or any other classes we need to implement the decoded value.\n\n\
    *   Validators Will have the library validators.\n\n*   Exceptions Will hold the\
    \ library custom exceptions.\n\n*   Parsers To hold our parsers, for now, the\
    \ JsonParser.\n\n*   Encoders To hold our encoders, for now, the JsonEncoder.\n\
    \n### DecodedValue\n\nFirst, let us implement our object value class, the DecodedValue\
    \ class that will hold the decoded JSON value.\n\nAs we agreed before the user\
    \ can ask for the decoded value as it is mixed, or as a PHP array, and finally\
    \ as a PHP object. We discussed the namespacing and how important it is to have\
    \ namespaces for classes and files we have, so we going to add the DecodedValue\
    \ in it is a separate namespace called Decoding\n\n<?php  \n\nnamespace Jazzon\\\
    \\Decoding;  \n\nclass DecodedValue  \n\n{  \n\n    /\\*\\* @var mixed $data \\\
    */  \n\n    private mixed $data;  \n\n    /\\*\\* @var int $bytesConsumed \\*/\
    \  \n\n    private int $bytesConsumed;  \n\n    /\\*\\*  \n\n     \\* @param mixed\
    \ $data  \n\n     \\* @param int $bytesConsumed  \n\n     \\*/  \n\n    public\
    \ function \\_\\_construct(mixed $data, int $bytesConsumed)  \n\n    {  \n\n        $this\\\
    ->data \\= $data;  \n\n        $this\\->bytesConsumed \\= $bytesConsumed;  \n\n\
        }  \n\n    /\\*\\*  \n\n     \\* @return mixed  \n\n     \\*/  \n\n    public\
    \ function getData(): mixed  \n\n    {  \n\n        return $this\\->data;  \n\n\
        }  \n\n    /\\*\\*  \n\n     \\* Gets the decoded data as an array.  \n\n\
         \\*  \n\n     \\* @return array  \n\n     \\*/  \n\n    public function getDataAsArray():\
    \ array  \n\n    {  \n\n        return (array) $this\\->data;  \n\n    }  \n\n\
        /\\*\\*  \n\n     \\* Gets the decoded data as an object.  \n\n     \\*  \n\
    \n     \\* @return object  \n\n     \\*/  \n\n    public function getDataAsObject():\
    \ object  \n\n    {  \n\n        return (object) $this\\->data;  \n\n    }  \n\
    \n    /\\*\\*  \n\n     \\* @return int  \n\n     \\*/  \n\n    public function\
    \ getBytesConsumed(): int  \n\n    {  \n\n        return $this\\->bytesConsumed;\
    \  \n\n    }  \n\n}\n\nLet us look into this class from a high level:\n\n*   Class\
    \ is defined in the Jazzon\\\\Decoding namespace.\n\n*   The class DecodedValue\
    \ implements the result of a JSON decoding function call operation. It has private\
    \ data members to store decoded data and how many bytes were consumed during that\
    \ decoding activity.\n\n*   The constructor initializes data member values based\
    \ on input parameters passed during object creation.\n\n*   A method called getData\
    \ returns the stored decoded data.\n\n*   A method called getDataAsArray returns\
    \ the stored decoded data as a PHP array.\n\n*   A method called getDataAsObject\
    \ returns the stored decoded data as a PHP object.\n\n*   A method called getBytesConsumed\
    \ returns how many bytes were consumed while calling the decode function.\n\n\
    ### JsonValidator\n\nNow, implement the JsonValidator in a namespace called \\\
    `Validators\\`\\`.\n\n<?php  \n\nnamespace Jazzon\\\\Validators;  \n\nclass JsonValidator\
    \  \n\n{  \n\n    /\\*\\*  \n\n     \\* Validates a JSON string  \n\n     \\*\
    \  \n\n     \\* @param string $json The JSON string to validate  \n\n     \\*\
    \ @return bool Returns true if the JSON string is valid, false otherwise  \n\n\
         \\*/  \n\n    public function validate(string $json): bool  \n\n    {  \n\
    \n        // We'll use json\\_decode() to try to decode the string.  \n\n        //\
    \ If it returns null, and we know the string is not 'null',  \n\n        // then\
    \ it's not valid JSON.  \n\n        $decoded \\= json\\_decode($json);  \n\n        if\
    \ ($decoded \\=== null && strtolower($json) !== 'null') {  \n\n            return\
    \ false;  \n\n        }  \n\n        return true;  \n\n    }  \n\n}\n\nLooking\
    \ at this class from a high level we have:\n\n*   This class belongs to the Jazzon\\\
    \\Validators namespace.\n\n*   The JsonValidator class evaluates a JSON string.\n\
    \n*   The method, validate, is for checking if the given string is not in valid\
    \ JSON.\n\n### JsonException\n\nWe will have the JsonException in it is own namespace\
    \ called Exceptions\n\n<?php  \n\nnamespace Jazzon\\\\Exceptions;  \n\nclass JsonException\
    \ extends \\\\RuntimeException  \n\n{  \n\n}\n\nLooking at this class from a high\
    \ level we have:\n\n*   It belongs to the namespace of Jazzon\\\\Exceptions."
