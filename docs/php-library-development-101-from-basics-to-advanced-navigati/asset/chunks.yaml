  trans: "\n\n*   **入职引导**：PHPDoc 注释可以帮助新团队成员快速熟悉代码库。通过阅读注释，他们可以更容易地理解你的代码并缩短他们的学习曲线。\n\
    *   **文档生成**：通过你的 PHPDoc 注释，你可以使用工具生成 HTML（或其他格式）文档——这对于内部和外部用户都非常有用。\n\n### PHPDoc\
    \ 语法\n\nPHPDoc 注释以 `/**` 开始，以 `*/` 结束。这里是一个极其简单的 PHPDoc 注释示例：\n\n```php\n<?php\
    \  \n\n/**  \n * This function adds two numbers.  \n *  \n * @param int $a The\
    \ first number.  \n * @param int $b The second number.  \n *  \n * @return int\
    \ The sum of the two numbers.  \n */  \nfunction add($a, $b)  \n{  \n    return\
    \ $a + $b;  \n}  \n// call the add() function  \necho add(3, 5); // output: 8\n\
    ```\n\n你可以看到上面有一个 PHPDoc 块详细解释了 `add()` 函数，使用 `@param` 标签提到它的目的和参数，并通过 `@return`\
    \ 标签明确表示它返回一个 `int`。\n\n### PHPDoc 标签\n\nPHPDoc 有许多可用于语法的标签。以下是一些常用标签的列表：\n\n\
    *   `@param`：指定函数/方法的参数。\n*   `@return`：描述函数/方法的返回类型。\n*   `@var`：声明类属性类型。\n*\
    \   `@throws`：列出函数或方法可能抛出的异常。\n*   `@deprecated`：表示该元素不再使用，应避免使用。\n*   `@see`：表示指向另一个元素的链接。\n\
    \n对于每个标签，都列出了标签分类并在后是其描述。类型可以是任何有效的 PHP 类型或类名。\n\n下面是我们 Jazzon 库中的一个示例，使用了大部分这些标签。\n\
    \n```php\n<?php  \n\nclass JsonParser  \n{  \n    /** @var string $valueToEncode\
    \ */  \n    private string $valueToEncode;  \n    /** @var JsonValidator $jsonValidator\
    \ */  \n    private JsonValidator $jsonValidator;  \n    /**  \n     * Parses\
    \ a JSON string and returns an object or array  \n     *  \n     * @param bool\
    \ $assoc [Optional] If true, returned objects will be converted into associative\
    \ arrays.  \n     * @param int $depth [Optional] User specified recursion depth.\
    \  \n     * @param int $options [Optional] Bitmask of JSON decode options.  \n\
    \     * @return DecodedValue  \n     * @throws JsonException  \n     */  \n  \
    \  public function parse(bool $assoc = false, int $depth = 512, int $options =\
    \ 0): DecodedValue  \n    {  \n    }  \n}\n```\n\n如果你在大型代码库中或作为团队的一部分编写 PHP 代码，学习如何使用和编写\
    \ PHPDoc 块是必须的。PHPDoc 注释提高了代码的可读性和可维护性，便于向团队新成员介绍项目，并让你能够自动生成文档。为了充分发挥这些功能的作用——请在将其整合到日常开发流程之前，充分学习\
    \ PHPDoc 的语法及其基础标签。\n\n## 编写 PHPDoc 注释\n\nPHPDoc 注释作为 PHP 环境的重要组成部分，确保开发人员能够快速准确地理解代码的含义和复杂性。本课程将深入探讨编写\
    \ PHPDoc 注释的规范，专注于确保你的注释真正有效的方法和技术。\n\n### 为什么良好的 PHPDoc 注释很重要？\n\n在进入细节之前，了解为什么投入精力编写有效的\
    \ PHPDoc 注释是有益的很重要：\n\n*   **清晰性**：信息丰富的注释消除了歧义。它们确保开发者理解某段代码的作用。\n*   **缩短入职时间**：这些注释对于进入成熟项目的新团队成员或开发者来说是关键的指南。\n\
    *   **一致性**：统一的 PHPDoc 注释在整个代码库中呈现出专业、统一的形象，使代码看起来良好且规范。\n*   **辅助调试**：如果出现故障，PHPDoc\
    \ 注释可以提供代码原始意图的见解。\n\n让我们来看下面两个示例，看看 PHPDoc 注释有什么益处；\n\n![](img/image_rsrc3D3.jpg)\n\
    \n显示带有和不带 PHPDoc 函数示例\n\n如果我们看左边的一个，可以看到一个函数，但很难看出这些参数是什么、它返回什么类型、可能会产生哪些错误，最后这个函数是做什么的。\n\
    \n但通过右边的示例，我们可以从 PHPDoc 注释块清楚地理解这个函数是什么，并学习关于它的一切。\n\n### 从基础开始\n\nPHPDoc 注释以\
    \ `/**` 开始，以 `*/` 结束。你在这个结构中提供描述和各种标签来指示关于代码的特定信息。\n\n查看以下代码段示例：\n\n```php\n<?php\
    \  \n\n/**  \n * Calculates the area of a rectangle.  \n *  \n * @param float\
    \ $length The length of the rectangle.  \n * @param float $width The width of\
    \ the rectangle.  \n * @return float The calculated area.  \n */  \nfunction rectangleArea($length,\
    \ $width)  \n{  \n    return $length * $width;  \n}  \n// call the rectangleArea()\
    \ function  \necho rectangleArea(4, 5); // output: 20\n```\n\nPHPDoc 块描述了 `rectangleArea`\
    \ 函数的目的以及它通过该函数执行的工作。像 `@param` 等标签告诉了输入参数的类型和含义，而 `@return` 则告诉了计算后应该返回什么类型的数据。\n\
    \n### 编写描述性摘要\n\n第一个描述（在上面的示例中是：计算矩形面积”）是该函数/类功能的简要概述。这应该是简洁且具有描述性的。\n\n### 有效使用标签\n\
    \n*   `@param`：始终以类型、变量名，最后是描述开头。\n*   `@return`：描述返回类型。\n*   `@var`：对于类属性非常有用。\n\
    *   `@throws`：使用此标签描述你的方法或函数何时可能抛出异常。\n\n### 高级 PHPDoc 技术\n\n*   **多行描述**：如果函数行为复杂，不要害怕提供多行解释。\n\
    *   **使用 {} 处理复杂类型**：如果参数接受不同的类型，可以使用大括号。\n*   **文档间的链接**：你可以使用 `@see` 标签提供指向相似函数或方法的连接。\n\
    \n"
- fmt: "\nBest practices are the foundation of excellent PHPDoc comments. This lesson\
    \ will throw a light on these techniques to ensure that your documentation shines.\n\
    \n## Concise and descriptive\n\nPHPDoc is intended to be a quick reference guide\
    \ rather than a complete guidebook.\n\n*   Do: Provide a brief overview that immediately\
    \ clarifies the code’s purpose.\n\n    ```php\n    /**\n     * Calculates a user's\
    \ age. \n     */\n    ```\n\n*   Don’t: Overburden the comment block with unnecessary\
    \ details.\n\n    ```php\n    /**\n     * This method is used to calculate the\
    \ age of the user based on the date of birth they provide.\n     */\n    ```\n\
    \n## Document public APIs\n\nPublic APIs are the public face of your library or\
    \ framework. Proper documentation ensures that consumers can use them effortlessly.\n\
    \n*   Provide a PHPDoc comment for all public classes, methods, and properties.\n\
    \n*   Internal or private methods may have more lenient documentation requirements.\n\
    \n## Consistent data types\n\nIt ensures that the intended inputs and outcomes\
    \ are clear.\n\n*   In the `@param` and `@return` tags, always indicate the type.\n\
    \n*   Use multi-type declaration with caution.\n\n    ```php\n    /**\n     *\
    \ @param int|string $value \n     */\n    ```\n\n## Update with changes\n\nOutdated\
    \ documentation confuses and causes more harm than good.\n\n*   Adjust PHPDoc\
    \ comments whenever code, particularly logic or arguments, changes.\n\n*   In\
    \ codebase audits, review the documentation regularly.\n\n## Avoid redundancy\n\
    \nRedundant information clogs and distracts.\n\n*   Avoid writing sets the username\
    \ as the PHPDoc remark if the function name is `setUsername()`.\n\n*   Instead,\
    \ include conditions, return values, or special instances.\n\nCheck the following\
    \ example and compare the PHPDoc for both functions;\n\n```php\n<?php  \n\n/**\
    \  \n * This is an example of what NOT to do:  \n *  \n * @param string $username\
    \ The username to set  \n * @return void  \n */  \npublic function setUsername($username)\
    \ {  \n    // ... implementation ...  \n}  \n\n// vs.  \n\n/**  \n * Assigns a\
    \ non-empty username.  \n *  \n * @param string $username Valid alphanumeric username;\
    \ max 15 chars.  \n * @throws InvalidArgumentException If the username is empty\
