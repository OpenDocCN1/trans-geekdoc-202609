    \ initial version of the library is the custom exception class:\n\n```php\n<?php\
    \  \n\n// JsonException.php  \n\n/**  \n\n* Class JsonException  \n\n* A custom\
    \ exception class for handling JSON errors  \n\n*/  \n\nclass JsonException extends\
    \ \\RuntimeException  \n\n{  \n}\n```\n\n### Classes best practices\n\nWhen designing\
    \ classes we need to follow some practices to make it more clear and easy to maintain.\
    \ The same practices we talked about for functions we need to follow here too.\
    \ In addition to those practices we also need to keep the following in mind:\n\
    \n*   Use the single responsibility principle to ensure that a class has only\
    \ one responsibility.\n\n```php\n<?php  \n\n// This class is solely responsible\
    \ for managing users in the system.  \nclass UserManager  \n\n{  \n    // Function\
    \ to add a new user.  \n    public function addUser($user) {  \n        // Code\
    \ to add user goes here.  \n    }  \n    // Function to remove a user.  \n   \
    \ public function removeUser($user) {  \n        // Code to remove user goes here.\
    \  \n    }  \n}  \n// The `UserManager` class does not handle other responsibilities\
    \   \n// like managing products or orders.\n```\n\n*   Use dependency injection\
    \ over inheritance (when possible) to ensure that a class is not tightly coupled\
    \ to other classes. We can say these in different words and more accurately which\
    \ use composition over inheritance.\n\n```php\n<?php  \n\ninterface Logger { \
    \ \n    public function log($message);  \n}  \n// A File-based Logger.  \nclass\
    \ FileLogger implements Logger {  \n    public function log($message) {  \n  \
    \      echo $message;  \n    }  \n}  \n// The `OrderManager` is not tightly coupled\
    \ to the `FileLogger`. It simply requires something that can log.  \nclass OrderManager\
