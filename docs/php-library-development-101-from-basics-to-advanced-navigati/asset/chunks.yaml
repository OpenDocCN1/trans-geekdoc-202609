  trans: "\n在软件开发中，确保代码的韧性和稳定性至关重要。单元测试是实现这一目标的技术之一，它是被称为**测试驱动开发（TDD）**的更广泛测试策略的基础。\n\
    \n单元测试用于确保软件中的单个组件（或单元）能够正常工作。每个单元测试都关注应用程序中一个微小的、隔离的区域（通常是一个单个函数或方法），并在独立于其他组件的情况下评估其有效性。这种隔离的测试环境确保了每个组件在受控环境中按照预期执行，且不受程序其他组件引入的任何副作用的影响。\n\
    \n![](img/image_rsrc3CP.jpg)\n\n一个在 PHP 中使用 `PHPUnit` 的单元测试过程流程图\n\nPHP 开发者可以使用多种工具来帮助单元测试。`PHPUnit`\
    \ 是最流行、最强大且灵活的框架之一，它提供了在 PHP 项目中构建和执行单元测试所需的各种。`PHPUnit` 不仅允许开发者设计测试，还允许他们执行这些测试并生成可以指导未来开发的有用报告。\n\
    \n## 单元测试原则\n\n让我们从学习单元测试原则开始：\n\n1. **隔离**：每个测试都应该关注特定的函数或方法。在单元测试中应避免使用数据库或文件等外部依赖，因为它们可能会导致意之外的结果并阻碍测试执行。\n\
    \n```php\n<?php  \n\n// 等待测试的简单函数  \n\nfunction add($a, $b) {  \n\n    return\
    \ $a + $b;  \n\n}  \n\n// 对 `add` 函数的单元测试  \n\nfunction testAdd() {  \n    $result\
    \ = add(2, 3);  \n    // 检查结果是否符合预期\n    if ($result === 5) {  \n        echo\
    \ \"Test passed!\";  \n    } else {  \n        echo \"Test failed!\";  \n    }\
    \  \n}  \n\ntestAdd();  // 执行测试\n```\n\n* 定义了一个返回两个数字之和的简单 `add` 函数。\n* `add`\
    \ 的单元测试命名为 `testAdd()` 函数，专门编写作为一个隔离的单元测试。它用于检查已知输入与预期输出。\n* `testAdd()` 函数验证了\
    \ `add` 函数的正确性。\n\n2. **自动化**：单元测试应该是自动化的。这允许你在每次做出更改时轻松地重新运行测试，保证你的修改不会破坏任何当前功能。\n\
    \n让我们看看下面的示例：\n\n```php\n<?php  \n\n// File: Adder.php  \n\nclass Adder {  \n\
    \    public function add($a, $b) {  \n        return $a + $b;  \n    }  \n}  \n\
    \n// File: AdderTest.php  \n\nuse PHPUnit\\Framework\\TestCase;  \n\nclass AdderTest\
    \ extends TestCase {  \n    public function testAdd() {  \n        $adder = new\
    \ Adder();  \n        $this->assertEquals(5, $adder->add(2, 3));  \n    }  \n\
    }\n```\n\n* 我们定义了一个类 `Adder`，它有一个方法 `add`，提供两个数字之和。\n* 通过名为 `AdderTest` 的独立测试类对\
    \ `Adder` 类进行测试。这允许使用 `PHPUnit` 的 `TestCase` 类进行结构化测试。在上面的代码段中，`PHPUnit` 的 `assertEquals`\
    \ 方法确保了 `add` 函数实现了它的目标。\n\n3. **易读易写**：单元测试应该是简单直接的。它们起到了文档的作用，解释你的代码是如何工作的。\n\
    \n让我们检查下面的示例，仅通过阅读测试函数 `testSubtract()`，你就能知道我们代码的作用：\n\n```php\n<?php  \n\nfunction\
    \ subtract($a, $b) {  \n    return $a - $b;  \n}  \n\n// 对 `subtract` 函数的单元测试\
    \  \n\nfunction testSubtract() {  \n    $result = subtract(5, 3);  \n    // 检查结果是否符合预期\n\
    \    if ($result === 2) {  \n        echo \"Test passed!\";  \n    } else {  \n\
    \        echo \"Test failed!\";  \n    }  \n}  \n\ntestSubtract();  // 执行测试\n\
    ```\n\n## 单元测试的组件\n\n让我们看看典型 PHP 单元测试的一些基本组件：\n\n1. **测试类**：这是你存放测试方法的地方。`PHPUnit`\
    \ 中的测试类是继承自 `TestCase` 类的标准 PHP 类。\n2. **测试方法**：断言位于这些方法内部。\n3. **断言**：这些是用于验证代码行为是否符合预期的语句。\n"
- fmt: "\nAs we go along we will look at how we might incorporate unit tests into\
    \ our Jazzon library.\n\n# Write Tests for Libraries\n\nTesting is an essential\
    \ part of any software development process, and libraries are no different. By\
    \ implementing unit tests for our library components, we may detect possible errors\
    \ early, expedite updates, and simplify integration. In this lesson, we will look\
    \ at how to use `PHPUnit` to create unit tests for our Jazzon library components.\n\
    \n## Setting up PHPUnit\n\nBefore we begin writing tests, we must first install\
    \ `PHPUnit`. PHPUnit must be installed either locally or globally. Here is how\
    \ to use `Composer` to install it locally:\n\n```bash\ncomposer require --dev\
    \ phpunit/phpunit ^10.1\n```\n\nAfter installing `PHPUnit`, we can create a `phpunit.xml`\
    \ configuration file in the root of our project to hold any configs we need to\
    \ define for the tests:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\
    \ \n<phpunit bootstrap=\"vendor/autoload.php\" colors=\"true\">\n    <testsuites>\n\
    \        <testsuite name=\"Jazzon Test Suite\">\n            <directory>tests</directory>\n\
    \        </testsuite>\n    </testsuites>\n</phpunit>\n```\n\nThis configuration\
    \ file informs `PHPUnit` to use `Composer`’s autoloader to autoload our classes\
    \ and to look for tests in the `tests` directory.\n\n## Writing tests\n\nTake\
    \ a look at our library’s `JsonValidator` class. This class has a single method\
    \ `validate()` that checks whether a given string is a valid JSON or not.\n\n\
    ```php\n<?php \n\nnamespace Jazzon\\Validators;\n\nclass JsonValidator\n{\n  \
    \  /**\n     * Validates a JSON string\n     * \n     * @param string $json The\
    \ JSON string to validate\n     * @return bool Returns true if the JSON string\
    \ is valid, false otherwise \n     */\n    public function validate(string $json):\
    \ bool\n    {\n        // We'll use json_decode() to try to decode the string.\n\
    \        // If it returns null, and we know the string is not 'null',\n      \
    \  // then it's not valid JSON.\n        $decoded = json_decode($json);\n    \
    \    if ($decoded === null && strtolower($json) !== 'null') {\n            return\
    \ false;\n        }\n        return true;\n    }\n}\n```\n\nWe can write a new\
    \ test case to test this class, `JsonValidatorTest` which can be implemented as\
    \ the following:\n\n```php\n<?php\n// Define a namespace for the test. This helps\
    \ in organizing the code and avoiding name collisions.\nnamespace Jazzon\\Tests;\n\
    \n// Import the JsonValidator class from the Jazzon\\Validators namespace. This\
    \ will be tested in this test class.\nuse Jazzon\\Validators\\JsonValidator;\n\
    \n// Import the TestCase class from PHPUnit, which is the base class for all PHPUnit\
    \ tests.\nuse PHPUnit\\Framework\\TestCase;\n\n// Define a new test class, JsonValidatorTest,\
    \ that extends the TestCase class from PHPUnit.\nclass JsonValidatorTest extends\
    \ TestCase\n{\n    // Define a test method to ensure the validate method returns\
    \ true for valid JSON.\n    public function testValidateReturnsTrueForValidJson():\
    \ void\n    {\n        $validator = new JsonValidator();\n        $this->assertTrue($validator->validate('{\"\
    key\":\"value\"}'));\n    } \n\n    public function testValidateReturnsFalseForInvalidJson():\
    \ void\n    {\n        $validator = new JsonValidator();\n        $this->assertFalse($validator->validate('invalid-json'));\n\
    \    }\n}\n```\n"
  raw: "As we go along we will look at how we might incorporate unit tests into our\
    \ Jazzon library.\n\n## Write Tests for Libraries\n\nTesting is an essential part\
    \ of any software development process, and libraries are no different. By implementing\
    \ unit tests for our library components, we may detect possible errors early,\
    \ expedite updates, and simplify integration. In this lesson, we will look at\
    \ how to use PHPUnit to create unit tests for our Jazzon library components.\n\
    \n### Setting up PHPUnit\n\nBefore we begin writing tests, we must first install\
    \ PHPUnit. PHPUnit must be installed either locally or globally. Here is how to\
    \ use Composer to install it locally:\n\n$ composer require --dev phpunit/phpunit\
    \ ^10.1\n\nAfter installing PHPUnit, we can create a phpunit.xml configuration\
    \ file in the root of our project to hold any configs we need to define for the\
    \ tests:\n\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>  \n\n<phpunit bootstrap=\"\
    vendor/autoload.php\" colors=\"true\"\\>  \n\n    <testsuites\\>  \n\n        <testsuite\
    \ name=\"Jazzon Test Suite\"\\>  \n\n            <directory\\>tests</directory\\\
    >  \n\n        </testsuite\\>  \n\n    </testsuites\\>  \n\n</phpunit\\>\n\nThis\
    \ configuration file informs PHPUnit to use Composer’s autoloader to autoload\
    \ our classes and to look for tests in the tests directory.\n\n### Writing tests\n\
    \nTake a look at our library’s JsonValidator class. This class has a single method\
    \ validate() that checks whether a given string is a valid JSON or not.\n\n<?php\
    \  \n\nnamespace Jazzon\\\\Validators;  \n\nclass JsonValidator  \n\n{  \n\n    /\\\
    *\\*  \n\n     \\* Validates a JSON string  \n\n     \\*  \n\n     \\* @param\
    \ string $json The JSON string to validate  \n\n     \\* @return bool Returns\
    \ true if the JSON string is valid, false otherwise  \n\n     \\*/  \n\n    public\
    \ function validate(string $json): bool  \n\n    {  \n\n        // We'll use json\\\
    _decode() to try to decode the string.  \n\n        // If it returns null, and\
    \ we know the string is not 'null',  \n\n        // then it's not valid JSON.\
    \  \n\n        $decoded \\= json\\_decode($json);  \n\n        if ($decoded \\\
    === null && strtolower($json) !== 'null') {  \n\n            return false;  \n\
    \n        }  \n\n        return true;  \n\n    }  \n\n}\n\nWe can write a new\
    \ test case to test this class, JsonValidatorTest which can be implemented as\
    \ the following:\n\n<?php  \n\n// Define a namespace for the test. This helps\
    \ in organizing the code and avoiding name collisions.  \n\nnamespace Jazzon\\\
    \\Tests;  \n\n// Import the JsonValidator class from the Jazzon\\\\Validators\
    \ namespace. This will be tested in this test class.  \n\nuse Jazzon\\\\Validators\\\
    \\JsonValidator;  \n\n// Import the TestCase class from PHPUnit, which is the\
    \ base class for all PHPUnit tests.  \n\nuse PHPUnit\\\\Framework\\\\TestCase;\
    \  \n\n// Define a new test class, JsonValidatorTest, that extends the TestCase\
    \ class from PHPUnit.  \n\nclass JsonValidatorTest extends TestCase  \n\n{  \n\
    \n    // Define a test method to ensure the validate method returns true for valid\
    \ JSON.  \n\n    public function testValidateReturnsTrueForValidJson(): void  //\
    \ The \": void\" specifies the return type of the method as void.  \n\n    { \
    \ \n\n        // Instantiate the JsonValidator class to test its methods.  \n\n\
            $validator \\= new JsonValidator();  \n\n        // Assert that the validate\
    \ method returns true for a valid JSON string.  \n\n        $this\\->assertTrue($validator\\\
    ->validate('{\"key\": \"value\"}'));  \n\n    }  \n\n    // Define another test\
    \ method to ensure the validate method returns false for invalid JSON.  \n\n    public\
    \ function testValidateReturnsFalseForInvalidJson(): void  // The \": void\" specifies\
    \ the return type of the method as void.  \n\n    {  \n\n        // Instantiate\
    \ the JsonValidator class again to test its methods.  \n\n        $validator \\\
    = new JsonValidator();  \n\n        // Assert that the validate method returns\
    \ false for an invalid JSON string.  \n\n        $this\\->assertFalse($validator\\\
    ->validate('{\"key\": \"value\",}'));  \n\n    }  \n\n}\n\nIf we look at this\
    \ code from a high level we can recognize:\n\n*   We define a namespace for the\
    \ test, Jazzon\\\\Tests, and import two necessary classes (JsonValidator and TestCase).\n\
    \n*   We create a test class called JsonValidatorTest extends the TestCase class\
    \ from PHPUnit which is aimed to test what functionality is inside of the JsonValidator\
    \ class.\n\n*   We wrote a test function called testValidateReturnsTrueForValidJson\
    \ to guarantee whether the method, validate, identifies correctly valid JSON strings\
    \ or not.\n\n*   Also, we wrote a test function called testValidateReturnsFalseForInvalidJson\
    \ to ensure that a method named validate detects accurately-invalid JSON strings.\n\
    \nWhen we run these tests with the PHPUnit command ./vendor/bin/phpunit, PHPUnit\
    \ will automatically call each test method, and the tests will pass if all assertions\
    \ are true.\n\n{notice} You can find the library code including the implmentation\
    \ of all test cases in the jazzon-lib-classes-implmentation folder. You can see\
    \ in the ReadMe file how can you run the tests.\n\n### Best practices\n\nWhen\
    \ writing tests, keep the following best practices in mind:\n\n![](image_rsrc3CR.jpg)\n\
    \nBest practices for writing tests\n\n*   Test one thing at a time - Each test\
    \ should concentrate on a single aspect of the component under consideration.\
    \ This simplifies the writing and understanding of tests.\n\n    The following\
    \ testAdditionOperation function tests only the addition operation, where the\
    \ add function simply adds two numbers correctly.\n\n    <?php  \n\n    public\
    \ function testAdditionOperation(): void  \n\n    {  \n\n        // This test\
    \ only checks the addition operation.  \n\n        $result \\= $this\\->calculator->add(2,\
    \ 3);  \n\n        $this\\->assertEquals(5, $result);  \n\n    }\n\n*   Name your\
    \ tests clearly - The name of the test function should clearly describe what it\
    \ is testing. This can make debugging easier when a test fails.\n\n    The testEmailValidationAcceptsValidEmails\
    \ function is self-descriptive. It checks if the validator to an email successfully\
    \ accepts any valid email address.\n\n    <?php  \n\n    public function testEmailValidationAcceptsValidEmails():\
    \ void  \n\n    {  \n\n        // The name indicates we're testing email validation\
    \ for valid emails.  \n\n        $isValid \\= $this\\->emailValidator->isValid('example@example.com');\
    \  \n\n        $this\\->assertTrue($isValid);  \n\n    }\n\n*   Keep tests isolated\
    \ - Tests should not be dependent on one another. Each test should be able to\
    \ run autonomously and in any order.\n\n    In the following example, even if\
    \ the testDatabaseConnection function fails, the testDatabaseRetrievesData function\
    \ should be able to run without any issues.\n\n    <?php  \n\n    // Test A  \n\
    \n    public function testDatabaseConnection(): void  \n\n    {  \n\n        //\
    \ This test only checks the database connection.  \n\n        $isConnected \\\
    = $this\\->database->connect();  \n\n        $this\\->assertTrue($isConnected);\
    \  \n\n    }  \n\n    // Test B  \n\n    public function testDatabaseRetrievesData():\
    \ void  \n\n    {  \n\n        // This test only checks data retrieval.  \n\n\
    \        $data \\= $this\\->database->getData('SELECT \\* FROM users');  \n\n\
    \        $this\\->assertIsArray($data);  \n\n    }\n\n*   Test for edge cases\
    \ - Don’t only test the happy path. Test for edge cases and potential error situations\
    \ as well.\n\n    The function testStringProcessingHandlesEmptyStrings tests an\
    \ edge case when an input string passed to a function is empty. It verifies that\
    \ if such kind of a string gets processed then it does not break any functionality\
    \ and returns some expected result.\n\n    <?php  \n\n    public function testStringProcessingHandlesEmptyStrings():\
    \ void  \n\n    {  \n\n        // Edge case where the input string is empty. \
    \ \n\n        $processed \\= $this\\->stringProcessor->process('');  \n\n        $this\\\
    ->assertEquals('', $processed);  \n\n    }\n\n*   Use mocks and stubs as needed\
    \ - Use the fake objects and stub method to isolate the component you’re testing\
    \ when it depends on other components."
