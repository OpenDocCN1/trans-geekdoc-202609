    \ $result);  \n\n    }  \n\n}\n\nBy following good testability practices:\n\n\
    *   The Calculator class is a breeze to be tested, as it has been designed simply\
    \ and without hidden dependencies or side effects.\n\n*   We have tests written\
    \ (CalculatorTest) that guarantee the Calculator class will behave as intended.\n\
    \n### Don’t repeat yourself (DRY)\n\nWe discussed the benefits of PHP libraries\
    \ and one of those benefits was code reusability. This is what this design principle\
    \ is all about, it makes sure that we don’t write redundant code.\n\n![](image_rsrc3CE.jpg)\n\
    \nA Flowchart implementing DRY Principle in PHP library development\n\nConsider\
    \ a situation when you have functions that compute the area for different geometrical\
    \ shapes.\n\nThe following script has functions to compute areas for triangles,\
    \ rectangles, and squares as separate entities. Each shape function is implemented\
    \ separately and invoked with some values.\n\nLet’s look at the following basic\
    \ geometry functions that don’t adhere to the DRY principle;\n\n<?php  \n\n//\
    \ Here, we're defining a new function named \"triangleArea\".  \n\n// This function\
    \ calculates and returns the area of a triangle.  \n\nfunction triangleArea($base,\
    \ $height) {  \n\n    // This line calculates the area of a triangle using the\
    \ formula (base \\* height) / 2.  \n\n    // It then returns the computed area.\
    \  \n\n    return 0.5 \\* $base \\* $height;  \n\n}  \n\n// Here, we're defining\
    \ a new function named \"rectangleArea\".  \n\n// This function calculates and\
    \ returns the area of a rectangle.  \n\nfunction rectangleArea($width, $height)\
    \ {  \n\n    // This line calculates the area of a rectangle using the formula\
    \ width \\* height.  \n\n    // It then returns the computed area.  \n\n    return\
    \ $width \\* $height;  \n\n}  \n\n// Here, we're defining a new function named\
    \ \"squareArea\".  \n\n// This function calculates and returns the area of a square.\
    \  \n\nfunction squareArea($side) {  \n\n    // This line calculates the area\
    \ of a square using the formula side \\* side (or side^2).  \n\n    // It then\
    \ returns the computed area.  \n\n    return $side \\* $side;  \n\n}  \n\n// Calculate\
    \ and print the area of a triangle.  \n\ntriangleArea(5, 10);  \n\n// Calculate\
    \ and print the area of a rectangle.  \n\nrectangleArea(5, 20);  \n\n// Calculate\
    \ and print the area of a square.  \n\nsquareArea(5);\n\nNow, let’s say in all\
    \ these functions, besides computing the area, you also want to log it. If we\
    \ proceed to add the logging code straight inside each function, then it will\
    \ repeat itself, and the code will look like the following;\n\n<?php  \n\n// Function\
    \ to calculate and return the area of a triangle.  \n\nfunction triangleArea($base,\
    \ $height) {  \n\n    $area \\= 0.5 \\* $base \\* $height;  // Calculates the\
    \ area of the triangle.  \n\n    echo \"Calculated area: \" . $area . PHP\\_EOL;  //\
    \ Prints the calculated area.  \n\n    return $area;  // Returns the calculated\
    \ area.  \n\n}  \n\n// Function to calculate and return the area of a rectangle.\
    \  \n\nfunction rectangleArea($width, $height) {  \n\n    $area \\= $width \\\
    * $height;  // Calculates the area of the rectangle.  \n\n    echo \"Calculated\
    \ area: \" . $area . PHP\\_EOL;  // Prints the calculated area.  \n\n    return\
    \ $area;  // Returns the calculated area.  \n\n}  \n\n// Function to calculate\
    \ and return the area of a square.  \n\nfunction squareArea($side) {  \n\n    $area\
    \ \\= $side \\* $side;  // Calculates the area of the square.  \n\n    echo \"\
    Calculated area: \" . $area . PHP\\_EOL;  // Prints the calculated area.  \n\n\
        return $area;  // Returns the calculated area.  \n\n}  \n\n// Calculate and\
    \ print the area of a triangle.  \n\ntriangleArea(5, 10);  \n\n// Calculate and\
    \ print the area of a rectangle.  \n\nrectangleArea(5, 20);  \n\n// Calculate\
    \ and print the area of a square.  \n\nsquareArea(5);\n\nThe coding duplication\
    \ concerning area logging can be eliminated by having a specific logArea() function\
    \ outside the functions related to particular shapes. Instead, the calls to logArea()\
    \ are made within shape-specific functions, eliminating redundancy and easy maintenance.\n\
    \nSo, the following is the final code version adhering to the DRY principle.\n\
    \n<?php  \n\n// Function to log the calculated area.  \n\nfunction logArea($area)\
    \ {  \n\n    echo \"Calculated area: \" . $area . PHP\\_EOL;  // Prints the passed\
    \ area.  \n\n}  \n\n// Function to calculate and return the area of a triangle.\
    \  \n\nfunction triangleArea($base, $height) {  \n\n    $area \\= 0.5 \\* $base\
    \ \\* $height;  // Calculates the area of the triangle.  \n\n    logArea($area);  //\
    \ Calls the logArea function to print the calculated area.  \n\n    return $area;  //\
    \ Returns the calculated area.  \n\n}  \n\n// Function to calculate and return\
    \ the area of a rectangle.  \n\nfunction rectangleArea($width, $height) {  \n\n\
        $area \\= $width \\* $height;  // Calculates the area of the rectangle.  \n\
    \n    logArea($area);  // Calls the logArea function to print the calculated area.\
    \  \n\n    return $area;  // Returns the calculated area.  \n\n}  \n\n// Function\
    \ to calculate and return the area of a square.  \n\nfunction squareArea($side)\
    \ {  \n\n    $area \\= $side \\* $side;  // Calculates the area of the square.\
    \  \n\n    logArea($area);  // Calls the logArea function to print the calculated\
    \ area.  \n\n    return $area;  // Returns the calculated area.  \n\n}  \n\n//\
    \ Calculate and print the area of a triangle.  \n\ntriangleArea(5, 10);  \n\n\
    // Calculate and print the area of a rectangle.  \n\nrectangleArea(5, 20);  \n\
    \n// Calculate and print the area of a square.  \n\nsquareArea(5);\n\n### Simplicity\n\
    \nWe’ve discussed before that we need to keep our library as easy as possible\
    \ to maintain, and also the code is easy to read and understand by other developers,\
    \ therefore we need to make sure that the code should be written simply. Over-complicating\
    \ the code complicates the testing, debugging, and library maintenance.\n\nSome\
    \ attributes of a simple and clear code are: - Formatted code. - Decoupled code.\
    \ - Descriptive variables, classes, object names, and naming conventions. - Short\
    \ and clear functions and classes.\n\nCheck this non-descriptive code version;\n\
    \n<?php  \n\n// Function that queries the database to fetch and display information\
    \ based on a given ID.  \n\nfunction f($db, $i) {  \n\n    $q \\= $db\\->prepare(\"\
    SELECT \\* FROM t WHERE id = ?\");  // Prepares a SQL statement for execution,\
    \ where the \"?\" is a placeholder that will be bound later.  \n\n    $q\\->execute(\\\
    [$i\\]);  // Executes the prepared statement, replacing the \"?\" placeholder\
    \ with the value of $i.  \n\n    $r \\= $q\\->fetch();  // Fetches the next row\
    \ from the result set.  \n\n    echo $r\\['n'\\] . \" - \" . $r\\['e'\\];  //\
    \ Displays the 'n' and 'e' fields from the fetched row.  \n\n}  \n\n// Call the\
    \ function.  \n\n// Assuming $database is a PDO instance and the ID you want to\
    \ fetch is 1.  \n\n// f($database, 1);\n\nLet us make it more verbose and clear;\n\
    \n<?php  \n\n// Function that queries the database to fetch and display a user's\
    \ name and email based on a given user ID.  \n\nfunction fetchAndDisplayUser($database,\
