    \ in debugging: PPHPDoc comments can provide insight into the code’s original\
    \ intent if something breaks.\n\nLet’s look at the following two examples to see\
    \ how PHPDoc comments can be beneficial;\n\n![](image_rsrc3D3.jpg)\n\nExample\
    \ showing function with & without PHPDoc\n\nIf we look at the one on the left\
    \ we can see a function but it is hard to tell what these parameters are, what\
    \ return type it gives, any errors expected from it, and finally what the function\
    \ does.\n\nBut the example on the right we can clearly understand from the PHPDoc\
    \ comment block what this function is and learn everything about it.\n\n### Starting\
    \ with the basics\n\nA PHPDoc comment begins with /\\*\\* and ends with \\*/.\
    \ You offer descriptions and various tags within this structure to signal specific\
    \ information about your code.\n\nCheck the following snippet for example;\n\n\
    <?php  \n\n/\\*\\*  \n\n \\* Calculates the area of a rectangle.  \n\n \\*  \n\
    \n \\* @param float $length The length of the rectangle.  \n\n \\* @param float\
    \ $width The width of the rectangle.  \n\n \\* @return float The calculated area.\
    \  \n\n \\*/  \n\nfunction rectangleArea($length, $width)  \n\n{  \n\n    return\
    \ $length \\* $width;  \n\n}  \n\n// call the rectangleArea() function  \n\necho\
    \ rectangleArea(4, 5); // output: 20\n\nThe PHPDoc block describes the purpose\
    \ of this function rectangleArea and what kind of work it performs through this\
    \ function. Tags like @param tell about the type, and meaning of input parameters\
    \ given to the function whereas @return tells about what kind of data should be\
    \ returned after performing calculations.\n\n### Crafting descriptive summaries\n\
    \nThe first description (in the example above, Calculates the area of a rectangle)\
    \ is a brief overview of what the function/class does. This should be brief yet\
    \ descriptive enough that a developer can get a good sense from it at a glance.\n\
    \n### Using tags effectively\n\n*   @param: Always start with the type, then the\
    \ variable name, and finally a detailed description. Avoid duplicating the variable\
    \ name in the description if at all possible.\n\n    @param int $age The age of\
    \ the user.\n\n*   @return: Describe the type of the returned value and what it\
    \ represents.\n\n    @return bool True if the user is an adult, false otherwise.\n\
    \n*   @var: This is useful for class properties. Make a note of what the property\
    \ holds or represents.\n\n    /\\*\\* @var array $settings User-defined settings\
    \ \\*/\n\n*   @throws: Use this tag to describe when your method or function may\
    \ throw an exception.\n\n    @throws InvalidArgumentException If $age is negative.\n\
    \n### Advanced PHPDoc techniques\n\n*   Multi-line descriptions: If a function\
    \ has complicated behavior, don’t be afraid to provide multi-line explanations.\n\
    \n    <?php  \n\n    /\\*\\*  \n\n     \\* Calculates the user's age based on\
    \ birthdate.   \n\n     \\* Takes into account leap years.  \n\n     \\*   \n\n\
    \     \\* ...  \n\n     \\*/\n\n*   Using {} for complex types: Curly brackets\
    \ can be used if a parameter accepts different types.\n\n    <?php  \n\n    /\\\
