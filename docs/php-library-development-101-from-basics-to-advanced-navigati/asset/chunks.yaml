    \n# PHP 库中的设计原则\n\n在我们已经在概念中讨论过设计原则之后，现在是时候了解 `S.O.L.I.D` 原则，它是构建 PHP 库以及 PHP\
    \ 开发领域中最常用的原则。同时，了解在构建 PHP 库时依赖设计原则对我们有什么益处。\n\n## S.O.L.I.D 原则\n\n`SOLID` 原则是一个设计原则的缩写，每个字母代表以下原则之一：\n\
    \n下表概述了每个 `SOLID` 原则及其核心思想以及它们如何在编码场景中实现，这有助于创建更健壮、灵活且可扩展的软件。\n\n| 原则 | 说明 | 示例实现\
    \ |\n| --- | --- | --- |\n| 单职责原则 | 类/函数应该只有一个职责 | 分离 `User` 和 `UserNotification`\
    \ 类 |\n| 开/闭原则 | 对扩展开放，对修改关闭 | 为 `Shapes` 使用接口，在 `Square`、`Circle` 等中实现 |\n| 里氏夫替换原则\
    \ | 子类应该增强而非替换父类 | 分离 `Shape` 接口，区分 `Rectangle` 和 `Square` 实现 |\n| 接口隔离 | 任何类都不应被强制实现未使用的方法\
    \ | 分离 `Workable` 和 `Eatable` 接口 |\n| 依赖倒置 | 依赖抽象而非具体实现 | 关键类依赖 `SwitchableDevice`\
    \ 接口，而不是 `LightBulb` 类 |\n\n- **单一职责**：意味着每个类或函数应该只做一件事。因此，一个类/函数应该只有一个职责和一个改变的原因。\n\
    \n```php\n<?php  \n\n// 不符合 SRP (单一职责原则)  \n\n// 这里的 Account 类同时处理用户管理和用户通知。 \
    \ \n\nclass Account {  \n    public function createUser() { /*...*/ */ }  // 创建用户。\
    \  \n    public function deleteUser() { /*...*/ */ }  // 删除用户。  \n    public function\
    \ notifyUser() { /*...*/ */ }  // 向用户发送通知。  \n\n    // 这不符合单一职责原则 (SRP)  \n  \
    \  // 因为用户通知不是用户管理类的直接职责。  \n}  \n\n// 使用 SRP (单一职责原则) 来分离职责  \n// User 类应该只处理用户管理职责。\
    \  \n\nclass User {  \n    public function createUser() { /*...*/ */ }  // 创建用户。\
    \  \n    public function deleteUser() { /*...*/ */ }  // 删除用户。  \n}  \n\n// 另一个独立的类用于处理用户通知。\
    \  \n// 这更符合 SRP，因为该类只负责用户通知。  \n\nclass UserNotification {  \n    public function\
    \ notifyUser() { /*...*/ */ }  // 向用户发送通知。  \n}  \n\n// 在这里，你通常会有可执行调用来使用这些类，但由于方法中填充了占位符\
    \ (/*...*/)，它们无法直接执行。  \n// 然而，在实践中，你可能会像这样：  \n// $user = new User();  \n// $user->createUser();\
    \  \n// $notification = new UserNotification();  \n// $notification->notifyUser();\n\
    ```\n\n- **开/闭**：意味着实体应对扩展开放，但对修改关闭。开发者可以向类中添加功能，而无需修改该类的源代码。\n\n```php\n<?php\
    \  \n\n// 不符合开/闭\n\nclass Rectangle {  \n    public $width;  // 矩形的宽度。  \n   \
    \ public $height; // 矩形的高度。  \n}  \n\nclass AreaCalculator {  \n    // 此类计算给定形状的面积。\
    \  \n    public function calculateArea($shapes) {  \n        $area = 0; // 初始化面积为\
    \ 0。  \n        foreach ($shapes as $shape) {  \n            if ($shape instanceof\
    \ Rectangle) {  \n                $area += $shape->width * $shape->height;  \n\
    \            }  \n        }  \n        return $area; // 返回总计。  \n    }  \n}\n\
    ```\n*(注：所提供的开/闭示例源码中的逻辑是碎片化的且包含冗余注释；我已清理了结构以使其成为有效的表示，同时按照要求保留了所有描述性文本和变量。)*\n\
    \n- **里氏夫替换**：子类应该增强而非替换父类。\n- **接口隔离**：任何类都不应被强制实现未使用的方法。\n- **依赖倒置**：依赖抽象而非具体实现。\n\
    \n"
