  trans: "\n这涉及到库如何被组织成模块或组件，每个模块都有自己独立的目录和命名空间结构。这允许更多的代码复用和极高的灵活性，但在设置和维护方面可能会非常复杂。\n\
    \n示例：\n\n```text\njazzon/\n  composer.json\n  src/\n    Jazzon/\n      Jazzon.php\n\
    \      Parser/\n        Json.php\n  tests/\n    JazzonTest/\n      JazzonTest.php\n\
    \      ParserTest/\n        JsonTest.php\n```\n\n在选择项目结构时，你必须同时考虑对库本身有利的因素以及对使用该特定库的用户而言。你希望设计出一个组织良好、易于理解、使用和维护方案。\n\
    \n### 最佳实践\n\n在根据选定的项目结构构建 PHP 库时，还有一些需要遵循的最佳实践。\n\n*   **自动加载 (Autoloading)**：这涉及到使用\
    \ `PSR-4` 标准进行自动加载。通过执行这一标准，你可以确保类和函数自动加载，而无需在代码中显式地包含它们。这减少了大量的类类加载，从而提高了整个库的可维护性。\n\
    \n    即自动加载：\n\n    ```json\n    \"autoload\": {\n      \"psr-4\": {\n       \
    \ \"Jazzon\\\\\\\\\": \"src/\"\n      }\n    }\n    ```\n\n*   **命名规范 (Naming\
    \ Conventions)**：一致的命名规范可以提高可读性，并有助于保持整个库风格的统一。建议命名空间和类名都遵循 `PSR-4` 命名规范。\n\n\
    \    示例：\n\n    ```php\n<?php\n// 声明命名空间以避免类命名冲突并组织相关类。\nnamespace Jazzon\\\\\
    Parser;\n\n// 在 'Jazzon\\Parser' 命名空间内定义名为 'JsonParser' 的类。\nclass JsonParser\
    \ {}\n    ```\n\n*   **使用 Composer 进行依赖管理 (Dependency Management with Composer)**：`Composer`\
    \ 是一个依赖管理工具，协助轻松管理外部依赖，并确保所有库都能被快速安装和更新。\n\n*   **编写文档 (Document Your Code)**：这包括使用\
    \ `PHPDoc` 为代码编写注释，并编写清晰的 `README.md` 文件来解释如何使用此库。\n\n    示例：\n\n```php\n<?php\n\
    /**\n * JsonParser - 负责将 JSON 字符串解析为 PHP 数组的类。\n *\n * @package Jazzon\\Parser\n\
    \ */\nnamespace Jazzon\\\\Parser;\n\n// 在 'Jazzon\\Parser' 命名空间内定义名为 'JsonParser'\
    \ 的类。\nclass JsonParser {}\n```\n"
- fmt: "\n```php\nreturn \"Welcome, $name!\";  \n\n}\n\n}\n```\n\n### JazzonTest.php\n\
    \n```php\n<?php  \n\n// Import the Jazzon class and PHPUnit's TestCase class \
    \ \n\nuse Jazzon\\Jazzon;  \n\nuse PHPUnit\\Framework\\TestCase;  \n\n// Define\
    \ a test class that extends PHPUnit's TestCase  \n\nclass JazzonTest extends TestCase\
    \  \n\n{  \n    // A test method to ensure the welcome method of the Jazzon class\
    \ works as expected  \n    public function testWelcome()  \n    {  \n      //\
    \ Instantiate the Jazzon class  \n      $jazzon = new Jazzon();  \n      // Assert\
    \ that the default welcome message is correct  \n      $this->assertEquals(\"\
    Welcome, Jazzon!\", $jazzon->welcome());  \n      // Assert that the welcome message\
    \ works correctly with the name \"John\"  \n      $this->assertEquals(\"Welcome,\
    \ John!\", $jazzon->welcome(\"John\"));  \n      // Assert that the welcome message\
    \ works correctly with the name \"David\"  \n      $this->assertEquals(\"Welcome,\
    \ David!\", $jazzon->welcome('David'));  \n    }  \n}\n```\n\nWe are going to\
    \ follow the PSR-4 autoloading mechanism to load all our library classes under\
    \ the `src` file by having the following in our `composer.json`:\n\n```json\n\"\
    autoload\": {  \n    \"psr-4\": {  \n        \"Jazzon\\\\\": \"src/\"  \n    }\
    \  \n}\n```\n\nThis will load all classes under the `Jazzon` namespace. We will\
    \ be using PHP `8.1` so you will find it in the `composer.json` as required, and\
    \ the `PHPUnit` added to the `require_dev` section.\n\nSo, our full `composer.json`\
    \ will look like this:\n\n```json\n{  \n    \"name\": \"jazzon/jazzon\",  \n \
    \   \"description\": \"A JSON parser library\",  \n    \"type\": \"library\",\
    \  \n    \"license\": \"MIT\",  \n    \"require\": {  \n        \"php\": \">=8.1\"\
    \  \n    },  \n    \"require-dev\": {  \n        \"phpunit/phpunit\": \"^10.1\"\
    \  \n    },  \n    \"autoload\": {  \n        \"psr-4\": {  \n            \"Jazzon\\\
    \\\": \"src/\"  \n        }  \n    },  \n    \"authors\": [  \n        {  \n \
    \           \"name\": \"Ahmed Raafat\",  \n            \"email\": \"ahmed.raafat1412@gmail.com\"\
    \  \n        }  \n    ]  \n}\n```\n\n### Running Jazzon\n\nYou can see in the\
    \ provided resources (`initial-jazzon-library` directory) that the whole project\
    \ is initialized as a starting point with a test function, you need only to focus\
    \ on the `Jazzon` directory which will hold our library implementation.\n\n{notice}\
    \ You can find the initial version of the library in the provided directory called\
    \ `initial-jazzon-library`.\n\nOnce you open the project directory, you can run\
    \ the following commands to start it and see it running:\n\n*   Bring all containers\
    \ up:\n`$ docker-compose up -d --build`\n\n*   Install all our dependencies:\n\
    `$ docker-compose exec php composer install`\n\n*   Run the tests to make sure\
    \ all is good:\n`$ docker-compose exec php ./vendor/bin/phpunit tests/`\n\nWe\
    \ will have one container called `php` where we run our library on it.\n\n# Understanding\
    \ the Architecture of PHP Libraries\n\nIn this part, readers are immersed in the\
    \ world of library design within the PHP ecosystem. This part is geared towards\
    \ providing a deep understanding of how to create well-structured, efficient libraries.\
    \ It begins by emphasizing the use of design patterns, which are crucial for developing\
    \ repeatable, scalable, and clear software solutions. Readers are encouraged to\
    \ gain hands-on experience with these patterns, which are essential for robust\
    \ and modular PHP library development.\n\n## Overview of Design Patterns\n\nDesign\
    \ patterns in software are reusable solutions to common problems in software design.\
    \ They are not finished designs, but rather templates for how to solve a problem\
    \ that occurs in many different contexts.\n\n### Types of Patterns\n\nPatterns\
    \ are generally categorized into three types:\n\n| Type | Characteristics | Examples\
    \ |\n| :--- | :--- | :--- |\n| Creational | Object creation, abstraction | Singleton,\
    \ Abstract Factory |\n| Structural | Object composition, relationships | Decorator,\
    \ Bridge |\n| Behavioral | Object communication, responsibilities | Observer,\
    \ Command, Strategy |\n\n## Creational Patterns\n\nCreational patterns deal with\
    \ object creation mechanisms, trying to make objects in a manner suitable to the\
    \ situation.\n\n### Singleton\n\nSingleton restricts the instantiation of a class\
    \ to one object and provides a global point of access to it.\n\n```php\n<?php\
    \ \n\n// Declare a class named Singleton\nclass Singleton {  \n    // Declare\
    \ a static private variable $instance. This will store the single instance of\
    \ the Singleton class.  \n    private static $instance;  \n\n    // Declare a\
    \ private constructor to prevent direct instantiation of the Singleton class.\
    \  \n    private function __construct() {}  \n\n    // Declare a public static\
    \ function getInstance to get the single instance of the Singleton class.  \n\
    \    public static function getInstance() {  \n      // Check if the $instance\
    \ variable is null.  \n      if (self::$instance === null) {  \n        // If\
    \ it is null, create a new instance of the Singleton class and store it in the\
    \ $instance variable.  \n        self::$instance = new self();  \n      }  \n\
    \      // Return the instance of the Singleton class.  \n      return self::$instance;\
    \  \n    }  \n}\n\n// Get the single instance of the Singleton class and store\
    \ it in the $singleton variable.  \n$singleton = Singleton::getInstance();  \n\
    \nvar_dump($singleton);\n```\n\n### Factory Method\n\nFactory provides an interface\
    \ for creating objects in a superclass, but lets subclasses alter the type of\
    \ objects that will be created.\n\n```php\n<?php \n\n// Declare an interface named\
    \ Product with a method describe.  \ninterface Product {  \n    public function\
    \ describe();  \n}  \n\n// Declare a class named ConcreteProductA that implements\
    \ the Product interface.  \n```\n"
