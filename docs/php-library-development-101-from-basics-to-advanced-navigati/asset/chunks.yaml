    \           // Logic to log a transaction.  \n\n            echo $message;  \n\
    \n        }  \n\n    }  \n\n    // PayPal gateway that extends the abstract PaymentGateway.\
    \  \n\n    class PayPalGateway extends PaymentGateway {  \n\n        public function\
