    \ want to use by adding the `--template` option to the above run command:\n\n\
    ```bash\nphp tools/phpDocumentor -d src/ -d tests/ --template=PDF\n```\n\n###\
    \ Advanced configurations with phpdoc.xml\n\nFor bigger projects, it’s usually\
