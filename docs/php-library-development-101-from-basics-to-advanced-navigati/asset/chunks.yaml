  trans: "\n\n* 包含了指定这些税收法规来源的标记，这可能对未来的参考或更新有所益。\n* `function` 内部的注释提供了对每个条件背后逻辑的见解。\n\
    \n如果这样做了，未来的开发者（甚至是过段时间后回到代码的同一位开发者）将立即理解税收计算机制背后的逻辑。\n\n## 通过代码风格保持一致性\n\n* 采用风格指南：无论是\
    \ Python 的 `PEP 8`、PHP 的 `PSR` 还是其他指南，都都要严格不疑地遵守。\n* 自动化代码检查工具：诸如 `ESLint` 或 `Prettier`\
    \ 等工具可以强制执行一致风格并检测差异。\n\n考虑以下场景：你正在编写一个用于管理系统用户配置的库。\n\n```php\n<?php  \n\nfunction\
    \ addUsr($usr_data){  \n  $db_conn = new mysqli('localhost', 'user', 'password',\
    \ 'database');  \n  $stmt = $db_conn->prepare(\"INSERT INTO user_profiles (name,\
    \ age, email) VALUES (?, ?, ?)\");  \n  $stmt->bind_param(\"sis\", $usr_data['username'],\
    \ $usr_data['userAge'], $usr_data['mail']);  \n  $stmt->execute();  \n  $stmt->close();\
    \  \n  $db_conn->close();  \n}  \n\n$ud = ['username' => 'JohnDoe', 'userAge'\
    \ => 30, 'mail' => 'john.doe@example.com'];  \naddUsr($ud);\n```\n\n现在让我们看看遵循一致代码风格的改进后的版本：\n\
    \n```php\n<?php  \n\nfunction addUser($userData) {  \n    $databaseConnection\
    \ = new mysqli('localhost', 'user', 'password', 'database');  \n    $statement\
    \ = $databaseConnection->prepare(\"INSERT INTO user_profiles (name, age, email)\
    \ VALUES (?, ?, ?)\");  \n    $statement->bind_param(\"sis\", $userData['name'],\
    \ $userData['age'], $userData['email']);  \n    $statement->execute();  \n   \
    \ $statement->close();  \n    $databaseConnection->close();  \n}  \n\n$userData\
    \ = [  \n    'name'  => 'John Doe',  \n    'age'    => 30,  \n    'email' => 'john.doe@example.com'\
    \  \n];  \n\naddUser($userData);\n```\n\n在上面的修订版本中：\n* 遵循了命名规范。变量具有描述性并使用了 `camelCase`。\n\
    * 间距和缩进都是一致的。\n* 数组键标签标记正确。\n* 函数名以动词为基础，指示了它们的操作。\n\n当贯应用于整个代码库时，这种统一性可以显著提高代码的可读性和维护性。使用像\
    \ `PHP_CodeSniffer` 这样的工具在项目中强制此类风格将会有帮助。\n\n## 代码审查的价值\n\n* 疏忽：即使是经验丰富的开发者也会出错。审查确保每一处修改都经过了多双眼睛的审视。\n\
    * 知识传递：通过允许开发者分享想法、方法论和最佳实践，促进了学习。\n* 可维护性：审查有助于验证代码不仅功能正常，而且具有维护性并符合更广泛的架构。\n\
    \n代码审查的价值通常不是通过代码本身体现，而是通过审查过程中提供的输入。然而，我们可以展示一段示例 PHP 代码，然后演示开发者在代码审查期间可能收到的反馈。\n\
    \n```php\n<?php  \n\nfunction userAge($dob){  \n  $today = new DateTime();  \n\
    \  $bday = new DateTime($dob);  \n  $age = $today->diff($bday);  \n  return $age->y;\
    \  \n}  \n\n$usr_dob = \"1990-05-10\";  \necho userAge($usr_dob);\n```\n\n潜在的代码审查反馈可能是：\n\
    * 关于 `function` 名称歧义的注释可能是：\n    * “函数名 `userAge` 暗示它与用户对象或类相关。” “考虑重命名函数 `calculateAgeFromDOB`\
    \ 以明确其目的。”\n* 关于变量命名的注释可能是：\n    * `$user_dop` 应该更明确。为了更清晰起见，考虑将其更改为 `$userDateOfBirth`。”\n\
    * 关于错误处理的注释可能是：\n    * “如果提供的 `$dob` 不符合预期格式或无效会发生什么？” 设置错误检查来处理此类情况是一个好主意。”\n\
    * 关于内联文档的注释可能是：\n    * 在函数上方添加 doc 注释以描述其目的、接受的参数及其返回值。\n\n让我们将这些注释应用到最后的代码段中，这里是修订版本：\n\
    \n```php\n<?php  \n\n/**  \n * 根据出生日期计算年龄。  \n *  \n * @param string $dateOfBirth\
    \ 格式为 \"Y-m-d\"。  \n * @return int 以岁为单位的年龄。  \n */  \nfunction calculateAgeFromDOB($dateOfBirth)\
    \ {  \n    $today = new DateTime();  \n    $birthDate = new DateTime($dateOfBirth);\
    \  \n    $age = $today->diff($birthDate);  \n    if ($birthDate > $today) {\n\
    \        throw new \\Exception(\"日期不能在未来.\");\n    }  \n    return $age->y;  \n\
    }  \n\n$userDateOfBirth = \"1990-05-10\";  \necho calculateAgeFromDOB($userDateOfBirth);\n\
    ```\n\n检查修订版本：\n* 遵循了命名规范。变量具有描述性并使用了 `camelCase`。\n* 间距和缩进都是一致的。\n* 数组键标记正确。\n\
    * 函数名以动词为基础，指示了它们的操作。\n\n代码不仅仅是行。\n\n## 设计与架构\n\n库的架构影响其可扩展性和维护性。良好的架构可以确保你的库：\n\
    * 轻松适应变化\n* 与其他库良好协作\n* 利于新开发者理解\n\n### PHP 中的模块化设计\n\n采用模块化设计。使用 PHP 命名空间，将你的库组织成独立的模块。这不仅使源代码更易维护，还允许用户使用他们需要的部分。\n\
    \n### PHP 特的设计模式\n\n使用与属性兼容的设计模式。在 PHP 库中，`Singleton`、`Dependency Injection` 等模式被广泛用于增加重用性和灵活性。例如，使用\
    \ `Factory` 模式构建数据库连接或 HTTP 客户端，确保灵活性。\n\n## 使用 Composer 关注依赖管理\n\nComposer 改变了\
    \ PHP 管理。在设计库时要明确依赖关系，并在 `composer.json` 中精确列出它们。这避免了冲突并提供了平滑集成。\n\n让我们通过我们的 `Jazzon`\
    \ 库来看完整的 `composer.json` 示例：\n\n```json\n{\n  \"name\": \"jazzon/library\",\n\
    \  \"description\": \"一个面向 JSON 爱好者的 PHP 库。\",\n  \"type\": \"library\",\n  \"\
    require\": {\n    \"php\": \"⁷.4 || ⁸.0\",\n    \"monolog/monolog\": \"².2\"\n\
    \  },\n  \"require-dev\": {\n    \"phpunit/phpunit\": \"⁹.3\"\n  },\n  \"autoload\"\
    : {\n    \"psr-4\": {\n      \"Jazzon\\\\\": \"src/\"\n    }\n  },\n  \"license\"\
    : \"MIT\",\n  \"authors\": [\n    {\n      \"name\": \"Jazz Enthusiast\",\n  \
    \    \"email\": \"jazz@example.com\"\n    }\n  ],\n  \"minimum-stability\": \"\
    stable\",\n  \"prefer-stable\": true\n}\n```\n\n### 使用 PHP 测试框架\n\n"
- fmt: "\nHaving a sound testing strategy in hand is one of the cornerstones for attaining\
    \ resilient software architecture. With the help of testing frameworks, developers\
    \ can not only verify their code correctness but also keep themselves safe from\
    \ future regressions ensuring that new changes don’t make old changes fail. `PHPUnit`\
    \ and `Behat` are both great tools in the PHP ecosystem and using them should\
    \ help you ensure that your library is not only sound functionally but also structurally.\n\
    \nWhen you specifically design your library architecture with testability in mind,\
    \ you make it easier to diagnose problems, debug them more quickly and be able\
    \ to have more assured code releases. Also, a well-tested library will increase\
    \ the reputation of this project in front of the developers’ community, hence\
    \ being sure that users can trust the reliability of their software component\
    \ for their projects.\n\n### Stay updated with PHP-FIG recommendations\n\n`PSRs`\
    \ (PHP Standard Recommendations) are guidelines for PHP library development proposed\
    \ by the PHP framework Interop Group (`PHP-FIG`). Following these guidelines keeps\
    \ your library in line with community standards.\n\n### Decouple code logic from\
    \ frameworks\n\nWhile frameworks enable speedy development, it is critical to\
    \ isolate the essential functionality of your library from any single framework.\
    \ This ensures that users of multiple PHP frameworks can easily incorporate your\
    \ library.\n\nFor example, instead of tying a logging library to a single framework’s\
    \ logging system, consider implementing the `PSR-3` logger interface.\n\n### Embrace\
    \ the principles of SOLID in PHP\n\n`SOLID` principles, an abbreviation for five\
    \ design principles aimed at making software designs more clear, adaptable, and\
    \ maintainable, are critical for PHP libraries;\n\n| Principle | Description |\
    \ Example Implementation |\n| --- | --- | --- |\n| Single Responsibility | Class/function\
    \ should have one responsibility only | Separate `User` and `UserNotification`\
    \ classes |\n| Open/Closed | Open for extension, closed for modification | Use\
    \ interfaces for `Shapes`, implement in `Square`, `Circle`, etc. |\n| Liskov Substitution\
    \ | Subclasses should enhance, not replace parent class | Separate `Shape` interface,\
    \ distinct `Rectangle` and `Square` implementations |\n| Interface Segregation\
    \ | No class should be forced to implement unused methods | Separate `Workable`\
    \ and `Eatable` interfaces |\n| Dependency Inversion | Depend on abstractions,\
    \ not concretions | Key class depends on `SwitchableDevice` interface, not on\
    \ `LightBulb` class |\n\n*   `SRP` (Single Responsibility Principle): Each PHP\
    \ class in your library should only have one cause to change. This ensures that\
    \ each class handles a distinct issue.\n    *   Consider dividing a class that\
    \ is responsible for both data validation and data storage into two independent\
    \ classes.\n*   `Open-Closed Principle` (`OCP`): PHP classes should be open for\
    \ extension but closed for modification. This encourages a more modular approach,\
    \ allowing for simple extensions without requiring changes to existing code.\n\
    \    *   use `abstract` classes or interfaces that may be extended without changing\
    \ their source code as an example.\n*   `Liskov Substitution Principle` (`LSP`):\
    \ This states that objects of a superclass should be interchangeable with objects\
    \ of a subclass without impacting the program’s correctness.\n    *   For example,\
    \ if you extend a class or implement an interface in your library, make sure the\
    \ derived class is compatible with the base.\n*   `Interface Segregation Principle`\
    \ (`ISP`): This states that client classes should not be forced to rely on interfaces\
    \ that they do not use.\n    *   Instead of a single broad interface, divide it\
    \ into smaller, more focused interfaces.\n*   `Dependency Inversion Principle`\
    \ (`DIP`): This states that you should rely on abstractions rather than specific\
    \ implementations. This enables your library to scale.\n\n### Scalability in PHP\n\
    \nA well-thought-out branching strategy ensures that the primary branch remains\
    \ stable. Here is an example of a strategy:\n\n*   `Main/Master` branch: This\
    \ branch contains the library’s stable version.\n*   `Development/Dev` branch:\
    \ This is where all new developments take place.\n*   `Feature` branches: A new\
    \ branch is produced for each new feature or functionality. When finished, it\
    \ is merged into the development branch.\n*   `Hotfix` branches: These are used\
    \ for urgent fixes that must be applied to the main branch.\n\n## Version Control\
    \ and Collaboration\n\nVersion control systems are the backbone of any development\
    \ project, and they are especially important when creating PHP libraries.\n\n\
    They aid in:\n*   Recording changes: Every change may be traced back to its source,\
    \ providing better debugging and understanding.\n*   Facilitating collaboration:\
    \ Collaboration is made easier because multiple developers can work on the same\
    \ library without overwriting each other’s changes.\n"
  raw: "Having a sound testing strategy in hand is one of the cornerstones for attaining\
    \ resilient software architecture. With the help of testing frameworks, developers\
    \ can not only verify their code correctness but also keep themselves safe from\
    \ future regressions ensuring that new changes don’t make old changes fail. PHPUnit\
    \ and Behat are both great tools in the PHP ecosystem and using them should help\
    \ you ensure that your library is not only sound functionally but also structurally.\n\
    \nWhen you specifically design your library architecture with testability in mind,\
    \ you make it easier to diagnose problems, debug them more quickly and be able\
    \ to have more assured code releases. Also, a well-tested library will increase\
    \ the reputation of this project in front of the developers’ community, hence\
    \ being sure that users can trust the reliability of their software component\
    \ for their projects.\n\n### Stay updated with PHP-FIG recommendations\n\nPSRs\
    \ (PHP Standard Recommendations) are guidelines for PHP library development proposed\
    \ by the PHP framework Interop Group (PHP-FIG). Following these guidelines keeps\
    \ your library in line with community standards.\n\n### Decouple code logic from\
    \ frameworks\n\nWhile frameworks enable speedy development, it is critical to\
    \ isolate the essential functionality of your library from any single framework.\
    \ This ensures that users of multiple PHP frameworks can easily incorporate your\
    \ library.\n\nFor example, instead of tying a logging library to a single framework’s\
    \ logging system, consider implementing the PSR-3 logger interface.\n\n### Embrace\
    \ the principles of SOLID in PHP\n\nSOLID principles, an abbreviation for five\
    \ design principles aimed at making software designs more clear, adaptable, and\
    \ maintainable, are critical for PHP libraries;\n\n| Principle || Description\
    \ || Example Implementation |\n\n| --- | --- | --- |\n\n| Single Responsibility\
    \ || Class/function should have one responsibility only || Separate User and UserNotification\
    \ classes |\n\n| --- | --- | --- |\n\n| Open/Closed || Open for extension, closed\
    \ for modification || Use interfaces for Shapes, implement in Square, Circle,\
    \ etc. |\n\n| Liskov Substitution || Subclasses should enhance, not replace parent\
    \ class || Separate Shape interface, distinct Rectangle and Square implementations\
    \ |\n\n| Interface Segregation || No class should be forced to implement unused\
    \ methods || Separate Workable and Eatable interfaces |\n\n| Dependency Inversion\
    \ || Depend on abstractions, not concretions || Key class depends on SwitchableDevice\
    \ interface, not on LightBulb class |\n\n*   SRP (Single Responsibility Principle):\
    \ Each PHP class in your library should only have one cause to change. This ensures\
    \ that each class handles a distinct issue.\n\n    *   Consider dividing a class\
    \ that is responsible for both data validation and data storage into two independent\
    \ classes.\n\n*   Open-Closed Principle (OCP): PHP classes should be open for\
    \ extension but closed for modification. This encourages a more modular approach,\
    \ allowing for simple extensions without requiring changes to existing code.\n\
    \n    *   use abstract classes or interfaces that may be extended without changing\
    \ their source code as an example.\n\n*   Liskov Substitution Principle (LSP);\
    \ This states that objects of a superclass should be interchangeable with objects\
    \ of a subclass without impacting the program’s correctness.\n\n    *   For example,\
    \ if you extend a class or implement an interface in your library, make sure the\
    \ derived class is compatible with the base.\n\n*   Interface Segregation Principle\
    \ (ISP): This states that client classes should not be forced to rely on interfaces\
    \ that they do not use.\n\n    *   Instead of a single broad interface, divide\
    \ it into smaller, more focused interfaces.\n\n*   Dependency Inversion Principle\
    \ (DIP): This states that you should rely on abstractions rather than specific\
    \ implementations. This enables your library to remain adaptable and agile in\
    \ the face of change.\n\n    *   As an example, rather than concrete classes,\
    \ use interfaces or abstract classes as dependents.\n\n### Scalability in PHP\
    \ libraries\n\nYour library should scale gracefully as it grows:\n\n*   Optimize\
    \ database interactions: Make sure your library interacts with databases efficiently.\
    \ Use prepared statements, limit the number of searches, and cache results as\
    \ needed.\n\n*   Avoid global state: Global variables and Singleton patterns can\
    \ make scaling and testing challenging at times. Whenever possible, use dependency\
    \ injection or explicitly pass dependencies\n\n*   Leverage lazy loading: Instead\
    \ of loading all components at once, load them just as needed.\n\n### Incorporate\
    \ middleware architecture\n\nMiddlewares in PHP allow you to handle requests and\
    \ answers in layers (particularly with the introduction of frameworks like Slim\
    \ and Laravel). This is useful when developing plug-and-play features or filters.\n\
    \nAs an example, middleware could be used to implement authentication, logging,\
    \ or caching.\n\n![](image_rsrc3DU.jpg)\n\nA flowchart of Middleware architecture\
    \ in a PHP library\n\n### Extendability and plugin architecture\n\nCreate your\
    \ library in such a way that it may be readily extended or plugged into by others:\n\
    \n*   Provide hooks or events: Allow users to inject their logic at various times\
    \ by providing hooks or events.\n\n*   Offer clear API endpoints: Ensure that\
    \ your library provides unambiguous public methods and attributes that can be\
    \ used as entry points for extensions or plugins.\n\nCreating a PHP library is\
    \ a complex process that necessitates a thorough understanding of both universal\
    \ design principles and PHP-specific quirks. Continuous learning and adaptation\
    \ to new design paradigms and PHP capabilities will be critical in maintaining\
    \ the library’s architectural integrity as it progresses.\n\n## Version Control\
    \ and Collaboration\n\nVersion control systems are the backbone of any development\
    \ project, and they are especially important when creating PHP libraries for widespread\
    \ distribution.\n\nThey aid in:\n\n*   Recording changes: Every change may be\
    \ traced back to its source, providing for better debugging and understanding\
    \ of the library’s evolution.\n\n*   Facilitating collaboration: Collaboration\
    \ is made easier because multiple developers can work on the same library without\
    \ overwriting each other’s changes.\n\n### Selecting the right version control\
    \ system\n\nWhile there are several version control systems available, Git is\
    \ the most well-known and commonly utilized in PHP projects. Its dispersed nature\
    \ enables developers to work together seamlessly. Tools such as GitHub, GitLab,\
    \ and Bitbucket extend their collaborative capabilities by providing platforms\
    \ for hosting and managing code repositories.\n\n### Setting up Git for your library\n\
    \n*   Initialize a new Git repository:\n\n$ git init\n\n*   Add your project files:\n\
    \n$ git add .\n\n*   Commit your changes to Git:\n\n$ git commit -m \"Initial\
    \ commit for my PHP library\"\n\nRemember to commit regularly with applicable/clear\
    \ commit messages to track the evolution of your library.\n\n### Branching strategy\
    \ in version control\n\nA well-thought-out branching strategy ensures that the\
    \ primary branch remains stable. Here is an example of a common strategy:\n\n\
    *   Main/Master branch: This branch contains the library’s stable version.\n\n\
    *   Development/Dev branch: This is where all new developments take place.\n\n\
    *   Feature branches: A new branch is produced for each new feature or functionality.\
    \ When finished, it is merged into the development branch.\n\n*   Hotfix branches:\
    \ These are used for urgent fixes that must be applied to the main branch.\n\n\
    ![](image_rsrc3DV.jpg)\n\nLibrary branches workflow\n\n### Collaboration using\
    \ pull/merge requests\n\nWhen working with a team, pull requests (on GitHub) or\
    \ merge requests (on GitLab) are vital tools.\n\nThey permit:\n\n*   Code reviews:\
    \ Before merging code changes, team members can review them to ensure code quality.\n\
    \n*   Feedback loops: Suggestions and enhancements to the code can be made."
