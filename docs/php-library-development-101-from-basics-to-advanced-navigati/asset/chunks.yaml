    \ if you need to add a new parser for files or different parsers. We will have\
    \ three imports here for the DecodedValue, JsonValidator, and JsonException as\
    \ all of them exist in their namespaces.\n\n<?php  \n\nnamespace Jazzon\\\\Parsers;\
    \  \n\nuse Jazzon\\\\Decoding\\\\DecodedValue;  \n\nuse Jazzon\\\\Exceptions\\\
    \\JsonException;  \n\nuse Jazzon\\\\Validators\\\\JsonValidator;  \n\nclass JsonParser\
    \  \n\n{  \n\n    /\\*\\* @var string $valueToEncode \\*/  \n\n    private string\
    \ $valueToEncode;  \n\n    /\\*\\* @var JsonValidator $jsonValidator \\*/  \n\n\
        private JsonValidator $jsonValidator;  \n\n    /\\*\\*  \n\n     \\* @param\
    \ string $valueToEncode  \n\n     \\*/  \n\n    public function \\_\\_construct(string\
    \ $valueToEncode)  \n\n    {  \n\n        $this\\->valueToEncode \\= $valueToEncode;\
    \  \n\n        $this\\->jsonValidator \\= new JsonValidator();  \n\n    }  \n\n\
        /\\*\\*  \n\n     \\* Parses a JSON string and returns an object or array\
    \  \n\n     \\*  \n\n     \\* @param bool $assoc \\[Optional\\] If true, returned\
    \ objects will be converted into associative arrays.  \n\n     \\* @param int\
    \ $depth \\[Optional\\] User specified recursion depth.  \n\n     \\* @param int\
    \ $options \\[Optional\\] Bitmask of JSON decode options.  \n\n     \\* @return\
    \ DecodedValue  \n\n     \\* @throws JsonException  \n\n     \\*/  \n\n    public\
    \ function parse(bool $assoc \\= false, int $depth \\= 512, int $options \\= 0):\
    \ DecodedValue  \n\n    {  \n\n        // First, we validate that the JSON string\
    \ is a valid string  \n\n        if (!$this\\->jsonValidator->validate($this\\\
    ->valueToEncode)) {  \n\n            throw new JsonException(\"The provided JSON\
    \ string is not valid!\");  \n\n        }  \n\n        // We need to calculate\
    \ the number of bytes consumed by the json\\_decode function.  \n\n        //\
    \ One way of doing this is by calculating the JSON string length.  \n\n        //\
    \ Note: This is the easiest and most direct way to calculate the codes, it could\
    \ be replaced with a more efficient way.  \n\n        $bytesConsumed \\= strlen($this\\\
    ->valueToEncode);  \n\n        // Here we will use PHP's built-in json\\_decode()\
    \ function  \n\n        // We will also handle any errors that might occur during\
    \ parsing  \n\n        $result \\= json\\_decode($this\\->valueToEncode, $assoc,\
    \ $depth, $options);  \n\n        if (json\\_last\\_error() !== JSON\\_ERROR\\\
    _NONE) {  \n\n            throw new JsonException(json\\_last\\_error\\_msg());\
    \  \n\n        }  \n\n        // Now we create a new DecodedValue object and return\
    \ it  \n\n        return new DecodedValue($result, $bytesConsumed);  \n\n    }\
    \  \n\n}\n\nLooking at this class from a high level we can say:\n\n*   It belongs\
    \ to the namespace of Jazzon\\\\Parsers.\n\n*   Importation of necessary namespaces\
    \ for required classes.\n\n*   The JsonParser class takes the role of parsing\
    \ the JSON string. It has private properties taking care of holding the string\
    \ to be parsed and a validator.\n\n*   Constructor initializing class properties.\n\
    \n*   The parse method is used to parse the JSON string and return an instance\
    \ of DecodedValue. This method deals with validation errors, byte counts as well\
    \ and parsing errors.\n\n### JsonEncoder\n\nLet us do the same thing for JsonEncoder.\
    \ We will put it in a separate namespace as well called Encoders\n\n<?php  \n\n\
    namespace Jazzon\\\\Encoders;  \n\nuse Jazzon\\\\Parsers\\\\JsonParser;  \n\n\
    use Jazzon\\\\Exceptions\\\\JsonException;  \n\nclass JsonEncoder  \n\n{  \n\n\
        /\\*\\* @var mixed $valueToEncode \\*/  \n\n    private mixed $valueToEncode;\
    \  \n\n    /\\*\\*  \n\n     \\* @param mixed $valueToEncode  \n\n     \\*/  \n\
    \n    public function \\_\\_construct(mixed $valueToEncode)  \n\n    {  \n\n        $this\\\
    ->valueToEncode \\= $valueToEncode;  \n\n    }  \n\n    /\\*\\*  \n\n     \\*\
    \ Encodes data to a JSON string  \n\n     \\*  \n\n     \\* @param int $options\
    \ \\[Optional\\] Bitmask of JSON encode options.  \n\n     \\* @param int $depth\
    \ \\[Optional\\] Set the maximum depth. It must be greater than zero.  \n\n     \\\
    * @return string  \n\n     \\* @throws JsonException  \n\n     \\*/  \n\n    public\
    \ function encode(int $options \\= 0, int $depth \\= 512): string  \n\n    { \
    \ \n\n        // Here we will use PHP's built-in json\\_encode() function  \n\n\
            // We will also handle any errors that might occur during encoding  \n\
    \n        $result \\= json\\_encode($this\\->valueToEncode, $options, $depth);\
    \  \n\n        if (json\\_last\\_error() !== JSON\\_ERROR\\_NONE) {  \n\n            throw\
    \ new JsonException(json\\_last\\_error\\_msg());  \n\n        }  \n\n        return\
    \ $result;  \n\n    }  \n\n}\n\nLooking at this class from a high level we can\
    \ say:\n\n*   It belongs to the namespace Jazzon\\\\Encoders.\n\n*   Importing\
    \ Jazzon\\\\Exceptions\\\\JsonException for exception handling.\n\n*   The JsonEncoder\
    \ class encodes some data to a JSON string. It provides a constructor to set the\
    \ data that should be encoded and the method encode that will do the encoding.\n\
    \n*   The encode method uses PHP’s built-in function json\\_encode() for the encoding,\
    \ and it handles all possible errors for encoding by throwing JsonException when\
    \ any error occurs during the encoding process.\n\nAs mentioned before, you can\
    \ find the whole library implementation in the provided jazzon-lib-classes-implmentation\
    \ folder.\n\n# Testing and Debugging\n\nThis part of the book delves into the\
    \ crucial aspects of library testing and debugging in PHP, offering a comprehensive\
    \ learning path for enhancing code quality and reliability. This part is dedicated\
    \ to providing in-depth knowledge and practical skills in unit testing and debugging,\
    \ which are essential components of successful PHP project development.\n\nFirstly,\
    \ this part introduces the reader to the world of PHP unit testing. It covers\
    \ the principles, significance, and basic techniques necessary for conducting\
    \ effective unit testing. This foundational knowledge is crucial for ensuring\
    \ the reliability and functionality of PHP projects.\n\nThe lessons then focus\
    \ on how to write effective unit tests specifically for PHP library components.\
    \ It provides practical examples using PHPUnit, the popular testing framework\
    \ and imparts best practices for testing code effectively. Through these examples,\
    \ readers learn the intricacies of applying PHPUnit to develop unit tests for\
    \ the Jazzon library components, to verify that the core components of the library\
    \ function as intended.\n\nAdditionally, the importance of debugging throughout\
    \ the software development lifecycle is emphasized. Understanding how debugging\
    \ helps detect and correct flaws in code is crucial for any developer. This part\
    \ guides readers through selecting the best PHP debugging tools and techniques,\
    \ enabling them to quickly resolve issues and enhance development efficiency.\n\
    \nThe lessons also aim to improve the reader’s debugging skills, particularly\
    \ in the context of PHP libraries. It discusses the interactions between PHP libraries\
    \ and how to troubleshoot problems arising from these interactions. Furthermore,\
    \ it dives into the essence of PHP code quality, educating readers on how to measure\
    \ it using various metrics.\n\nFinally, the lessons provide insights and practical\
    \ strategies for maintaining high-quality code in PHP libraries. This comprehensive\
    \ approach to testing and debugging not only aids in building robust and error-free\
    \ libraries but also contributes significantly to the overall quality and maintainability\
    \ of PHP projects.\n\n## Introduction to Unit Testing"
