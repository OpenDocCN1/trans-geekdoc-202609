    \ $result);\n}\n```\n\n通过遵循良好的可测试性实践：\n\n- `Calculator` 类非常易于测试，因为它的设计简单，没有隐藏的依赖关系或副作用。\n\
    - 我们编写了测试（`CalculatorTest`），这些测试保证了 `Calculator` 类的行为符合预期。\n\n### 不要重复自己 (DRY)\n\
    \n我们讨论过 PHP 库的优点，其中一个优点就是代码的可重用性。这正是该设计原则的核心所在，它确保我们不编写冗余代码。\n\n![](img/image_rsrc3CE.jpg)\n\
    \n在 PHP 库开发中实现 DRY 原则的流程图\n\n考虑这种情况：你有用于计算不同几何形状面积的函数。\n\n以下脚本包含计算三角形、矩形和正方形面积的独立函数。每个形状函数都是独立实现的，并带有某些值调用。\n\
    \n让我们这些不符合 DRY 原则的这些几何函数：\n\n```php\n<?php\n// 这里，我们定义了一个名为 \"triangleArea\" 的新函数。\n\
    // 该函数计算并返回三角形的面积。\nfunction triangleArea($base, $height) {\n    // 这一行使用公式 (base\
    \ * height) / 2 计算三角形面积。\n    // 然后返回计算出的面积。\n    return 0.5 * $base * $height;\n\
    }\n\n// 这里，我们定义了一个名为 \"rectangleArea\" 的新函数。\n// 该函数计算并返回矩形的面积。\nfunction rectangleArea($width,\
    \ $height) {\n    // 这一行使用公式 width * height 计算矩形面积。\n    // 然后返回计算出的面积。\n    return\
    \ $width * $height;\n}\n\n// 这里，我们定义了一个名为 \"squareArea\" 的新函数。\n// 该函数计算并返回正方形的面积。\n\
    function squareArea($side) {\n    // 这一行使用公式 side * side (或 side²) 计算正方形面积。\n\
    \    // 然后返回计算出的面积。\n    return $side * $side;\n}\n\n// 计算并打印三角形的面积。\ntriangleArea(5,\
    \ 10);\n// 计算并打印矩形的面积。\nrectangleArea(5, 20);\n// 计算并打印正方形的面积。\nsquareArea(5);\n\
    ```\n\n现在，假设在所有这些函数中，除了计算面积，你记录记录日志。如果我们直接每个函数内部添加日志代码，那么它就会重复出现，代码看起来像如下：\n\n\
    ```php\n<?php\n// 计算并返回三角形面积的函数。\nfunction triangleArea($base, $height) {\n  \
    \  $area = 0.5 * $base * $height;  // 计算三角形面积。\n    echo \"Calculated area: \"\
    \ . $area . PHP_EOL;  // 打印计算出的面积。\n    return $area;  // 返回计算出的面积。\n}\n\n// 计算并返回矩形面积的函数。\n\
    function rectangleArea($width, $height) {\n    $area = $width * $height;  // 计算矩形面积。\n\
    \    echo \"Calculated area: \" . $area . PHP_EOL;  // 打印计算出的面积。\n    return $area;\
    \  // 返回计算出的面积。\n}\n\n// 计算并返回正方形面积的函数。\nfunction squareArea($side) {\n    $area\
    \ = $side * $side; // 计算正方形面积。\n    echo \"Calculated area: \" . $area . PHP_EOL;\
    \ // 打印计算出的面积。\n    return $area; // 返回计算出的面积。\n}\n```\n\n等待，让我们重新检查逻辑。提供的文本包含了几个重复的代码块和解释\
    \ DRY 的注释。我将在保持所请求格式的同时，整合核心逻辑。\n\n现在，假设在所有这些函数中，除了计算面积，你还想记录日志。如果我们直接每个函数内部添加日志代码，那么它就会重复出现……\n\
    \n提供的文本随后列出了相同逻辑的多个版本。根据指令，我将清晰地组织输出。\n\n### 简单性\n\n我们之前讨论过，需要让库尽可能易于维护，并且代码要让其他开发者容易阅读和理解，因此我们需要确保代码应该写得简单。过度复杂的代码会增加测试、调试和库维护的复杂性。\n\
    \n简单且清晰的代码的一些属性是：\n- 格式化的代码。\n- 解耦的代码。\n- 具有描述性的变量、类、对象名称。\n- 短而清晰的函数和类。\n\n检查这段没有描述性的代码：\n\
    \n```php\n<?php\n// 根据给定 ID 查询数据库获取信息的函数。\nfunction f($db, $i) {\n    $q = $db->prepare(\"\
    SELECT * FROM t WHERE id = ?\"); // 准备 SQL 语句，其中 \"?\" 是将要绑定的占位符。\n    $q->execute([$i]);\
    \ // 执行准备语句，将 \"?\" 占位符替换为 i 的值。\n    $r = $q->fetch(); // 从结果集中获取下一行。\n    echo\
    \ $r['n'] . \" - \" . $r['e']; // 显示获取行中的 'n' 和 'e' 字段。\n}\n\n// 调用函数。\n// 假设\
    \ $database 是一个 PDO 实例，你想获取的 ID 是 1。\n// f($database, 1);\n```\n\n让我们它变得更详细且清晰：\n\
    \n```php\n<?php\n// 根据给定的用户 ID 查询数据库并显示用户名和电子邮件的函数。\nfunction fetchAndDisplayUser($database,\
    \ $userId) {\n    $query = $database->prepare(\"SELECT * FROM users WHERE id =\
    \ ?\"); // 准备 SQL 语句，其中 \"?\" 是将要绑定的占位符。\n    $query->execute([$userId]); // 执行准备语句，将\
    \ \"?\" 占位符替换为 $userId 的值。\n    $result = $query->fetch(); // 从结果集中获取下一行。\n}\n\
    ```\n\n"
