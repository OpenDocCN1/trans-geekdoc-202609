    \    public function decode($data) {\n        return $this->formatter->decode($data);\n\
    \    }\n}\n\n// 使用 Jazzon 库的演示：\n// 创建 JSON 格式化器的实例。\n$formatter = new JsonFormatter();\n\
    \n// 将格式化器注入到 Jazzon 类。\n$jazzon = new Jazzon($formatter);\n\n// 使用 Jazzon 类将数据编码为\
