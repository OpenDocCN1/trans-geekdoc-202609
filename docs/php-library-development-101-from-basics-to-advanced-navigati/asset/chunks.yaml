    \  \n    // 在 OrderProcessor 中使用模拟的 PaymentGateway。  \n    $orderProcessor = new\
    \ OrderProcessor($paymentGatewayMock);  \n    $orderProcessed = $orderProcessor->processOrder(new\
    \ Order());  \n    $this->assertTrue($orderProcessed);  \n}\n```\n\n为库组件编写有效的测试是创建健壮可靠代码的关键部分。通过遵循最佳实践并专注于代码中每个部分的预期功能，你可以验证组件在各种条件下的运行是否正确。\n\
    \n## 库组件测试\n\n在本节中，我们将为库类编写所有其他需要的测试。\n\n{notice} 我们在上一节中已经实现了对 `JsonValidator`\
    \ 类的测试。你可以在提供的 `jazzon-lib-classes-implmentation` 文件夹中找到所有代码测试，并在你的机器上运行。\n\n\
    ### JsonEncoder 类测试\n\n`JsonEncoder` 类的 `encode()` 函数接收一个值并生成一个 JSON 编码字符串。让我们来看看如何测试该函数的某些基础用例；\n\
    \n```php\n<?php  \n\n// 为此测试类声明命名空间。  \nnamespace Jazzon\\Tests;  \n\n// 导入测试所需的类。\
    \  \nuse Jazzon\\Encoders\\JsonEncoder;  \nuse Jazzon\\Exceptions\\JsonException;\
    \  \nuse PHPUnit\\Framework\\TestCase;  \n\n// 定义继承自 PHPUnit TestCase 的测试类。  \n\
    class JsonEncoderTest extends TestCase  \n\n{  \n    // 测试编码数组是否返回了有效的 JSON。 \
    \ \n    public function testEncodeReturnsValidJsonForArray(): void  \n    {  \n\
    \        // 使用示例数组实例化 JsonEncoder。  \n        $encoder = new JsonEncoder(['key'\
    \ => 'value']);  \n        // 断言编码该数组得到的是预期的 JSON 字符串。  \n        $this->assertEquals('{\"\
    key\":\"value\"}', $encoder->encode());  \n    }  \n    // 测试编码畸格式数据是否抛出 JsonException。\
    \  \n    public function testEncodeThrowsJsonExceptionForMalformedData(): void\
    \  \n    {  \n        // 设置预期：将抛出一个 JsonException。  \n        $this->expectException(JsonException::class);\
    \  \n        // 使用畸格式数据实例化 JsonEncoder。  \n        $encoder = new JsonEncoder(\"\
    \\xB1\\x31\");  \n        // 尝试编码，这应该抛出预期的异常。  \n        $encoder->encode(); \
    \ \n    }  \n}\n```\n\n上面的代码段包含两个函数：\n\n- `testEncodeReturnsValidJsonForArray`\
    \ 函数确保通过 `JsonEncoder` 类编码的数组返回了有效的 JSON 字符串。\n- `testEncodeThrowsJsonExceptionForMalformedData`\
    \ 函数确保使用 `JsonEncoder` 类编码不当的数据时应该抛出 `JsonException`。\n\n### JsonParser 类测试\n\n\
    `JsonParser` 类的 `parse()` 函数接收一个 JSON 字符串并返回一个 `DecodedValue` 对象。让我们来看看如何测试该函数的某些基础用例；\n\
    \n```php\n<?php  \n\n// 为此测试类声明命名空间。  \nnamespace Jazzon\\Tests;  \n\n// 导入测试所需的类。\
    \  \nuse Jazzon\\Parsers\\JsonParser;  \nuse Jazzon\\Decoding\\DecodedValue; \
    \ \nuse Jazzon\\Exceptions\\JsonException;  \nuse PHPUnit\\Framework\\TestCase;\
    \  \n\n// 定义继承自 PHPUnit TestCase 的测试类。  \nclass JsonParserTest extends TestCase\
    \  \n\n{  \n    // 测试解析 JSON 是否返回 DecodedValue 实例。  \n    public function testParseReturnsDecodedValueForJson():\
    \ void  \n    {  \n        // 实例化 JsonParser。  \n        $parser = new JsonParser('{\"\
    key\":\"value\"}');  \n        // 解析 字符串。  \n        $result = $parser->parse();\
    \  \n        // 断言结果是 DecodedValue 的实例。  \n        $this->assertInstanceOf(DecodedValue::class,\
    \ $result);  \n        // 断言解析后的数据匹配预期的数组。  \n        $this->assertEquals(['key'\
    \ => 'value'], $result->getData());  \n    }  \n    // 测试解析无效 JSON 是否抛出 JsonException。\
    \  \n    public function testParseThrowsJsonExceptionForInvalidJson(): void  \n\
    \    {  \n        // 设置预期：将抛出一个 JsonException。  \n        $this->expectException(JsonException::class);\
    \  \n        // 使用无效 JSON 实例化 JsonParser。  \n        $parser = new JsonParser('invalid-json');\
    \  \n        // 尝试解析，这应该抛出预期的异常。  \n        $parser->parse();  \n    }  \n}\n\
    ```\n\n上面的代码段包含两个函数：\n\n- `testParseReturnsDecodedValueForJson` 函数确保 `JsonParser`\
    \ 解析有效的 JSON 返回 `DecodedValue` 实例。\n- `testParseThrowsJsonExceptionForInvalidJson`\
    \ 函数确保使用 `JsonParser` 解析无效数据时抛出 `JsonException`。\n\n### DecodedValue 类测试\n\n这个类看起来非常基础，但正如我们之前讨论的，测试每个可行的代码是最佳实践。\n\
    \n让我们来看看它的基础测试用例：\n\n```php\n<?php  \n\n// 为此测试类声明命名空间。  \nnamespace Jazzon\\\
