    \n### 类最佳实践\n\n在设计类时，我们需要遵循一些实践，使其更加清晰且易于维护。我们在讨论函数时谈到的相同实践也适用于这里。除了这些实践外，我们还需要考虑以下几点：\n\
    \n*   使用单一职责原则确保一个类只有一个职责。\n\n```php\n<?php  \n\n// 此类专门负责管理系统中的用户。  \nclass UserManager\
    \  \n\n{  \n    // 添加新用户的函数。  \n    public function addUser($user) {  \n     \
    \   // 在此处编写添加用户的代码。  \n    }  \n    // 移除用户的函数。  \n    public function removeUser($user)\
    \ {  \n        // 在此处编写移除用户的代码。  \n    }  \n}  \n// `UserManager` 类不处理其他职责  \n\
    // 例如管理产品或订单。\n```\n\n*   在可能的情况下，使用依赖注入而非继承，以确保类不会与其他类紧密耦合。我们可以用不同的、更准确的说法来表述，即“使用组合代替继承”。\n\
    \n```php\n<?php  \n\ninterface Logger {  \n    public function log($message);\
    \  \n}  \n// 基于文件的 Logger。  \nclass FileLogger implements Logger {  \n    public\
    \ function log($message) {  \n        echo $message;  \n    }  \n}  \n// `OrderManager`\
    \ 与 `FileLogger` 没有紧密耦合。它只需要一个可以记录的对象。  \nclass OrderManager {  \n    private\
    \ $logger;  \n    // 注入了 `Logger` 依赖，而不是强制 `OrderManager` 使用特定的 logger。  \n  \
    \  public function __construct(Logger $logger) {  \n        $this->logger = $logger;\
    \  \n    }  \n    public function createOrder() {  \n        // 创建订单的逻辑。  \n \
    \       $this->logger->log(\"Order created.\\n\");  \n    }  \n}  \n$orderManager\
    \ = new OrderManager(new FileLogger());  \n$orderManager->createOrder();\n```\n\
    \n*   在可能的情况下，使用抽象类或接口来定义通用功能，并确保相关类之间的一致性。\n\n```php\n<?php  \n\n// 定义所有支付网关通用功能的抽象类。\
    \  \nabstract class PaymentGateway {  \n    public abstract function processPayment($amount);\
    \  \n    // 所有支付网关的通用实用工具函数。  \n    protected function logTransaction($message)\
    \ {  \n        // 记录交易的逻辑。  \n        echo $message;  \n    }  \n}  \n// 扩展抽象类\
    \ `PaymentGateway` 的 PayPal 网关。  \nclass PayPalGateway extends PaymentGateway\
    \ {  \n    public function processPayment($amount) {  \n        // 通过 PayPal 处理支付的特定逻辑。\
    \  \n        $this->logTransaction(\"Processed $amount using PayPal.\\n\");  \n\
    \    }  \n}  \n// 扩展抽象类 `PaymentGateway` 的 Stripe 网关。  \nclass StripeGateway extends\
    \ PaymentGateway {  \n    public function processPayment($amount) {  \n      \
    \  // 通过 Stripe 处理支付的特定逻辑。  \n        $this->logTransaction(\"Processed $amount\
    \ using Stripe.\\n\");  \n    }  \n}  \n$paypal = new PayPalGateway();  \n$paypal->processPayment(100);\
    \  \n$stripe = new StripeGateway();  \n$stripe->processPayment(100);\n```\n\n"
- fmt: "\n- At the end, a new `DecodedValue` object is created along with the decoded\
    \ value and consumed bytes which then returns.\n\nThe function simply uses the\
    \ PHP built-in function `json_decode()` to parse the JSON string and convert it\
    \ to a `DecodedValue` object which we can use to either get the PHP array or PHP\
    \ object out of it. If an error happens during the parsing it throws a `JsonException`\
    \ with the appropriate error message.\n\n## `encode()`\n\nWe are going to use\
    \ `$this->valueToEncode` as the reference to the PHP array/object we need to convert\
    \ into JSON.\n\n```php\n<?php  \n\n/**  \n * Encodes data to a JSON string  \n\
    \ *  \n * @param int $options [Optional] Bitmask of JSON encode options.  \n *\
    \ @param int $depth [Optional] Set the maximum depth. It must be greater than\
    \ zero.  \n * @return string  \n * @throws JsonException  \n*/  \nfunction encode(int\
    \ $options = 0, int $depth = 512): string  \n{  \n  // Here we will use PHP's\
    \ built-in json_encode() function  \n  // We will also handle any errors that\
    \ might occur during encoding  \n  $result = json_encode($this->valueToEncode,\
    \ $options, $depth);  \n  if (json_last_error() !== JSON_ERROR_NONE) {  \n   \
    \   throw new JsonException(json_last_error_msg());  \n  }  \n  return $result;\
    \  \n}\n```\n\nLet us break down this function from a high level to see what it\
    \ does:\n\n- The defined `encode` function transforms PHP data into formatted\
    \ JSON string format. This optionally takes parameters: `$options` for setting\
    \ encode options and `$depth` for maximum recursion depth. It will either return\
    \ encoded JSON as a result or throw an exception of type `JsonException`.\n- Encodes\
    \ the given data with PHP’s in-built `json_encode()` function. If an error occurs\
    \ while encoding, throws a `JsonException` with an appropriate error message.\n\
    - Returns the successfully encoded JSON string.\n\nWe use the PHP built-in function\
    \ called `json_encode()` to convert the PHP array/object into JSON string and\
    \ throw a `JsonException` whenever an error happens.\n\n## `validate()`\n\n```php\n\
    <?php  \n\n/**  \n * Validates a JSON string  \n *  \n * @param string $json The\
    \ JSON string to validate  \n * @return bool Returns true if the JSON string is\
    \ valid, false otherwise  \n*/  \npublic function validate(string $json): bool\
    \  \n{  \n    // We'll use json_decode() to try to decode the string.  \n    //\
    \ If it returns null, and we know the string is not 'null',  \n    // then it's\
    \ not valid JSON.  \n    $decoded = json_decode($json);  \n    if ($decoded ===\
    \ null && strtolower($json) !== 'null') {  \n        return false;  \n    }  \n\
    \    return true;  \n}\n```\n\nLet us break down this function from a high level\
    \ to see what it does:\n\n- Defines the `validate` function to validate a provided\
    \ JSON string. The function returns a boolean value that indicates whether or\
    \ not validation passed.\n- If decoding the JSON string with `json_decode()` results\
    \ in null and the provided string is not explicitly ‘null’, then it determines\
    \ that the JSON string was invalid.\n- If the decoding is successful, the function\
    \ returns true, indicating the JSON is valid.\n\n## Assemble the Library Classes\n\
    \nNext, we are going to set everything together and have a complete implementation\
    \ of our library classes.\n\nWe have done a great job so far by designing the\
    \ library and implementing its core functions, and now it is time to integrate\
    \ our functions into the library classes and ensure they are properly namespaces.\n\
    \n{notice} You can find the whole library classes implementation in the provided\
    \ folder called `jazzon-lib-classes-implmentation`, you can open and modify it\
    \ as you desire.\n\nWe will create namespaces (directories) for every part so\
    \ we will end up with the following namespaces in our project:\n\n- `Jazzon`:\
    \ The parent namespace.\n- `Decoding`: For the decoded value object value class\
    \ or any other classes we need to implement the decoded value.\n- `Validators`:\
    \ Will have the library validators.\n- `Exceptions`: Will hold the library custom\
    \ exceptions.\n- `Parsers`: To hold our parsers, for now, the `JsonParser`.\n\
    - `Encoders`: To hold our encoders, for now, the `JsonEncoder`.\n\n### `DecodedValue`\n\
    \nFirst, let us implement our object value class, the `DecodedValue` class that\
    \ will hold the decoded JSON value.\n\nAs we agreed before the user can ask for\
    \ the decoded value as it is mixed, or as a PHP array, and finally as a PHP object.\
    \ We discussed the namespacing and how important it is to have namespaces for\
    \ classes and files we have, so we going to add the `DecodedValue` in it is a\
    \ separate namespace called `Decoding`\n\n```php\n<?php  \n\nnamespace Jazzon\\\
    Decoding;  \n\nclass DecodedValue  \n{  \n    /** @var mixed $data */  \n    private\
    \ mixed $data;  \n    /** @var int $bytesConsumed */  \n    private int $bytesConsumed;\
    \  \n\n    /**  \n     * @param mixed $data  \n     * @param int $bytesConsumed\
    \  \n     */  \n    public function __construct(mixed $data, int $bytesConsumed)\
    \  \n  {  \n      $this->data = $data;  \n      $this->bytesConsumed = $bytesConsumed;\
    \  \n  }  \n\n    /**  \n     * @return mixed  \n     */  \n    public function\
    \ getData(): mixed  \n  {  \n      return $this->data;  \n  }  \n\n    /**  \n\
    \     * Gets the decoded data as an array  \n     * @return array  \n     */ \
    \ \n    public function getDataArray(): array  \n  {  \n      return (array)$this->data;\
    \  \n  }  \n\n    /**  \n     * Gets the decoded data as an object  \n     * @return\
    \ object  \n     */  \n    public function getDataObject(): object  \n  {  \n\
    \      return (object)$this->data;  \n  }  \n\n    /**  \n     * @return int \
    \ \n     */  \n    public function getBytesConsumed(): int  \n  {  \n      return\
    \ $this->bytesConsumed;  \n  }  \n}\n```\n\nLet us look into this class from a\
    \ high level:\n\n- Class is in `Jazzon\\Decoding` namespace.\n- The class `DecodedValue`\
    \ implements the result of a decoding operation. It has private data members to\
    \ store data and how many bytes were consumed during that activity.\n- The constructor\
    \ initializes data member based on input parameters.\n- A method `getData()` returns\
    \ the stored data.\n- A method `getDataArray()` returns the stored data as an\
    \ array.\n- A method `getDataObject()` returns the stored data as an object.\n\
    - A method `getBytesConsumed()` returns how many bytes were consumed while calling\
    \ the decode function.\n\n### `JsonValidator`\n\nNow, implement the `JsonValidator`\
    \ in a namespace called `Validators`.\n\n```php\n<?php  \n\nnamespace Jazzon\\\
    Validators;  \n\nclass JsonValidator  \n{  \n    /**  \n     * Validates a JSON\
    \ string  \n     *  \n     * @param string $json The JSON string to validate \
    \ \n     * @return bool Returns true if the JSON string is valid, false otherwise\
    \  \n    */  \n    public function validate(string $json): bool  \n  {  \n   \
    \   // We'll use json_decode() to try to decode the string.  \n      // If it\
    \ returns null, and we know the string is not 'null',  \n      // then it's not\
    \ valid JSON.  \n      $decoded = json_decode($json);  \n      if ($decoded ===\
    \ null && strtolower($json) !== 'null') {  \n          return false;  \n     \
    \ }  \n      return true;  \n  }  \n}\n```\n\nLooking at this class from a high\
    \ level we have:\n\n- This class belongs to the `Jazzon\\Validators` namespace.\n\
    - The `JsonValidator` class evaluates a JSON string.\n- The method `validate`,\
    \ is for checking if the given string is not in valid JSON.\n\n### `JsonException`\n\
    \nWe will have the `JsonException` in it is own namespace called `Exceptions`\n\
    \n```php\n<?php  \n\nnamespace Jazzon\\Exceptions;  \n\nclass JsonException extends\
    \ \\RuntimeException  \n{  \n}\n```\n\nLooking at this class from a high level\
    \ we have:\n\n- It belongs to the namespace of `Jazzon\\Exceptions`.\n"
