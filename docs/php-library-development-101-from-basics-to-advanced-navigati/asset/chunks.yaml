  trans: "\n\n-   `JsonException` 类继承自 PHP 的标准 `RuntimeException`，以便在发生任何由于 JSON 操作引起的异常时，可以提供相关的特殊异常处理。\n\
    \n### JsonParser\n\n现在，让我们来实现 `JsonParser`。记住我们已经实现了 `parse()` 函数，因此我们将将其放置在类中，并创建一个构造函数来初始化\
    \ JSON 字符串变量、我们的 `JsonValidator` 实例，最后是 `DecodedValue` 实例。\n\n我们也将将其放在一个独立的命名空间\
    \ `Parsers` 中，这将使得以后如果需要为文件添加新的解析器或不同的解析器将变得非常方便。这里会有三个对 `DecodedValue`、`JsonValidator`\
    \ 和 `JsonException` 的导入，因为它们都存在各自的命名空间中。\n\n```php\n<?php  \n\nnamespace Jazzon\\\
    Parsers;  \n\nuse Jazzon\\Decoding\\DecodedValue;  \n\nuse Jazzon\\Exceptions\\\
    JsonException;  \n\nuse Jazzon\\Validators\\JsonValidator;  \n\nclass JsonParser\
    \  \n\n{  \n\n    /** @var string $valueToEncode */  \n    private string $valueToEncode;\
    \  \n\n    /** @var JsonValidator $jsonValidator */  \n    private JsonValidator\
    \ $jsonValidator;  \n\n    /**  \n     * @param string $valueToEncode  \n    \
    \ */  \n    public function __construct(string $valueToEncode)  \n    {  \n  \
    \      $this->valueToEncode = $valueToEncode;  \n        $this->jsonValidator\
    \ = new JsonValidator();  \n    }  \n\n    /**  \n     * 解析 JSON 字符串并返回对象或数组 \
    \ \n     *  \n     * @param bool $assoc [Optional] 如果为 true，返回的对象将转换为关联数组。  \n\
    \     * @param int $depth [Optional] 用户指定的递归深度。  \n     * @param int $options\
    \ [Optional] JSON 解码选项的位掩码。  \n     * @return DecodedValue  \n     * @throws JsonException\
    \  \n     */  \n    public function parse(bool $assoc = false, int $depth = 512,\
    \ int $options = 0): DecodedValue  \n    {  \n        // 首先，验证 JSON 字符串是否为有效字符串\
    \  \n        if (!$this->jsonValidator->validate($this->valueToEncode)) {  \n\
    \            throw new JsonException(\"The provided JSON string is not valid!\"\
    );  \n        }  \n        // 我们需要计算 json_decode 函数消耗的字节数。\n        // 做到此的一种方法是计算\
    \ JSON 字符串的长度。\n        // 注意：这是计算代码最简单、最直接的方法，可以被更高效的方法替换。  \n        $bytesConsumed\
    \ = strlen($this->valueToEncode);  \n        // 这里我们将使用 PHP 内置的 json_decode()\
    \ 函数  \n        // 我们还将处理解析过程中可能发生的任何错误  \n        $result = json_decode($this->valueToEncode,\
    \ $assoc, $depth, $options);  \n        if (json_last_error() !== JSON_ERROR_NONE)\
    \ {  \n            throw new JsonException(json_last_error_msg());  \n       \
    \ }  \n        // 现在我们创建一个新的 DecodedValue 对象并返回它  \n        return new DecodedValue($result,\
    \ $bytesConsumed);  \n    }  \n}\n```\n\n从高层角度来看这个类，我们可以说：\n\n-   它属于 `Jazzon\\\
    Parsers` 命名空间。\n-   导入了所需类所需的必要命名空间。\n-   `JsonParser` 类承担解析 JSON 字符串的角色。它拥有私有属性，负责持有待解析的字符串和一个验证器。\n\
    -   构造函数用于初始化类属性。\n-   `parse` 方法用于解析 JSON 字符串并返回 `DecodedValue` 实例。该方法处理验证错误、字节计数以及解析错误。\n\
    \n### JsonEncoder\n\n让我们对 `JsonEncoder` 执行相同的操作。我们将它也放在一个独立的命名空间 `Encoders` 中。\n\
    \n```php\n<?php  \n\nnamespace Jazzon\\Encoders;  \n\nuse Jazzon\\Parsers\\JsonParser;\
    \  \n\nuse Jazzon\\Exceptions\\JsonException;  \n\nclass JsonEncoder  \n\n{  \n\
    \n    /** @var mixed $valueToEncode */  \n    private mixed $valueToEncode;  \n\
    \n    /**  \n     * @param mixed $valueToEncode  \n     */  \n    public function\
    \ __construct(mixed $valueToEncode)  \n    {  \n        $this->valueToEncode =\
    \ $valueToEncode;  \n    }  \n\n    /**  \n     * 将数据编码为 JSON 字符串  \n     *  \n\
    \     * @param int $options [Optional] JSON 解码选项的位掩码。  \n     * @param int $depth\
    \ [Optional] 设置深度。  \n     * @return string  \n     * @throws JsonException  \n\
    \     */  \n    public function encode(int $options = 0, int $depth = 512): string\
    \  \n    {  \n        // 这里我们将使用 PHP 内置的 json_decode() 函数  \n        // 我们还将处理解析过程中可能发生的任何错误\
    \  \n        $result = json_decode($this->valueToEncode, false, $depth, $options);\
    \  \n        if (json_last_error() !== JSON_ERROR_NONE) {  \n            throw\
    \ new JsonException(json_last_error_msg());  \n        }  \n        // 返回结果\n\
    \        return $result; \n    }  \n}\n```\n\n从高层角度来看这个类，我们可以说：\n\n-   它属于 `Jazzon\\\
    Encoders` 命名空间。\n-   导入了所需类所需的必要命名空间。\n-   `JsonEncoder` 类承担将数据编码为 JSON 字符串的角色。它拥有私有属性，负责持有待解析的字符串。\n\
    -   构造函数用于初始化类属性。\n-   `encode` 方法使用 PHP 内置的 `json_decode()` 函数，并处理解析过程中可能发生的任何错误（通过抛出\
    \ `JsonException`）。\n\n"
- fmt: "\nIt is critical in software development to ensure the resilience and stability\
    \ of our code. Unit testing is one technique used to accomplish this, and it is\
    \ the foundation of a bigger testing strategy known as test-driven development\
    \ (TDD).\n\nUnit tests are used to ensure that individual components (or units)\
    \ in our software work properly. Each unit test focuses on a tiny, isolated section\
    \ of the application typically a single function or method and evaluates its validity\
    \ in isolation from other components. This isolated testing environment assures\
    \ that each component performs as expected in a controlled environment, devoid\
    \ of any side effects introduced by other components of the program.\n\n![](image_rsrc3CP.jpg)\n\
    \nA flowchart Unit Testing process using `PHPUnit` in PHP\n\nThere are several\
    \ tools accessible to PHP developers to help with unit testing. `PHPUnit` is one\
    \ of the most popular, strong, and flexible frameworks that provide the capability\
    \ required to build and perform unit tests in PHP projects. `PHPUnit` not only\
    \ allows developers to design tests, but it also allows them to execute those\
    \ tests and generate helpful reports that can be used to guide future development.\n\
    \n## Principles of a unit test\n\nLet’s begin by learning the principles of a\
    \ unit test:\n\n1. **Isolation**: Every test should focus on a particular function\
    \ or method. External dependencies, such as databases or files, should be avoided\
    \ in unit tests because they can result in unexpected results and impede test\
    \ execution.\n\n```php\n<?php  \n\n// A simple function to be tested  \n\nfunction\
    \ add($a, $b) {  \n\n    return $a + $b;  \n\n}  \n\n// A unit test for the `add`\
    \ function  \n\nfunction testAdd() {  \n    $result = add(2, 3);  \n    // Check\
    \ if the result is as expected  \n    if ($result === 5) {  \n        echo \"\
    Test passed!\";  \n    } else {  \n        echo \"Test failed!\";  \n    }  \n\
    }  \n\ntestAdd();  // Execute the test\n```\n\n* Defined a simple `add` function\
    \ returning a sum of two numbers.\n* Unit testing of `add` is named the `testAdd()`\
    \ function, specifically written as an isolated unit test. It is used for checking\
    \ known input versus expected output.\n* The `testAdd()` function which validates\
    \ the correctness of the `add` function.\n\n2. **Automation**: Unit tests should\
    \ be automated. This allows you to easily re-run your tests whenever you make\
    \ changes, guaranteeing that your modifications do not break any current functionality.\n\
    \nLet’s see the following example:\n\n```php\n<?php  \n\n// File: Adder.php  \n\
    \nclass Adder {  \n    public function add($a, $b) {  \n        return $a + $b;\
    \  \n    }  \n}  \n\n// File: AdderTest.php  \n\nuse PHPUnit\\Framework\\TestCase;\
    \  \n\nclass AdderTest extends TestCase {  \n    public function testAdd() { \
    \ \n        $adder = new Adder();  \n        $this->assertEquals(5, $adder->add(2,\
    \ 3));  \n    }  \n}\n```\n\n* We defined a class, `Adder`, having one method,\
    \ `add`, providing the sum of two numbers.\n* The `Adder` class is tested with\
    \ the help of a separate test class named `AdderTest`. This allows structured\
    \ testing using `PHPUnit`’s `TestCase` class. In the code snippet above, the method\
    \ `assertEquals` from `PHPUnit` ensures that the function `add` does what it intends\
    \ to do.\n\n3. **Easy to read & write**: Unit tests should be basic and straightforward.\
    \ They act as documentation, explaining how your code works.\n\nLet’s check the\
    \ following example where you can tell from just reading the test function `testSubtract()`\
    \ what our code does;\n\n```php\n<?php  \n\nfunction subtract($a, $b) {  \n  \
    \  return $a - $b;  \n}  \n\n// A unit test for the `subtract` function  \n\n\
    function testSubtract() {  \n    $result = subtract(5, 3);  \n    // Assert that\
    \ the result matches the expected output  \n    if ($result === 2) {  \n     \
    \   echo \"Subtraction test passed!\";  \n    } else {  \n        echo \"Subtraction\
    \ test failed!\";  \n    }  \n}  \n\ntestSubtract();  // Execute the test\n```\n\
    \n## Components of a unit test\n\nLet’s have a look at some of the basic components\
    \ of a typical PHP unit test:\n\n1. **Test class** - This is where you will keep\
    \ your test methods. A test class in `PHPUnit` is a standard PHP class that extends\
    \ the `PHPUnit TestCase` class.\n2. **Test method** - Assertions are used within\
    \ these methods.\n3. **Assertions** - These are statements that verify that the\
    \ code behaves as expected.\n\nHere’s an example of a unit test:\n\n```php\n<?php\
    \  \n// File: AdderTest.php  \n\nuse PHPUnit\\Framework\\TestCase;  \n\nclass\
    \ AdderTest extends TestCase {  \n    // ...\n}\n```\n*(Wait, let me re-format\
