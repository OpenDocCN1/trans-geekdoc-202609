    \ the click method on the $button object.\n$button->click();\n```\n\n* 结构型（Structural）：它们处理对象的组合并帮助形成大型结构。它们提供了识别对象之间关系的方法，从而简化设计。示例：\n\
    \n* 装饰器（Decorator）允许静态或动态地为单个对象添加行为，而不影响同类中其他对象的行为。示例：\n\n```php\n<?php\n// Declare\
    \ an interface named Coffee with a method getCost.\ninterface Coffee {\n    public\
    \ function getCost();\n}\n\n// Declare a class named SimpleCoffee that implements\
    \ the interface.\nclass SimpleCoffee implements Coffee {\n    // Implement the\
