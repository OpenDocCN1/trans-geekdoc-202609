    # Navigation example


    ## Incorporating Jazzon examples


    As the PHPDoc comments are written for the `Jazzon` classes, we can then execute
    the `PHPDocumentor` to produce full documentation. This documentation would provide
    the end-users with concise information concerning methods, properties, return
    types as well as other aspects of the `Jazzon` library. This document becomes
    invaluable to any developer working with the `Jazzon` library.


    {notice} You can find in the `jazzon-lib-classes-implmentation` folder how the
    PHPDoc tool is installed within the docker containers check the `docker-containers/php-fpm/Dockerfile`
    file on Lines `15-23`, and to be able to run it locally and see it in action,
    check the commands in the `ReadMe` file for running it.


    The process of createing documentation with `PHPDoc` is an amalgamation of creative
    work as well as automation. Though, most of the heavy-lifting task of creating
    documentation is done by `PHPDocumentor` – it falls upon the developers’ shoulders
    that their `PHPDoc` comments are well-written, useful and comprehensive. Doing
    so helps teams ensure they end up having high-quality, readable and professional
    documentation as an asset for current as well as future developers.


    ## Maintaining PHPDoc Comments and the Documentation


    Documentation is not a set-it-and-forget-it task, even when generated automatically.
    The documentation for your library or software should grow and change with it.


    ### Maintenance need


    The primary purpose of documentation is to support developers - be it in terms
    of getting them on board quickly, simplifying the understanding of the complexities
    of the library, or enabling easier debugging. When your documentation grows stale,
    these are some things that can happen:


    * Misconception or misunderstanding about functions.

    * Time wasted over deprecated or modified functions.

    * Ineffirciencies or mistakes due to outmoded procedures.


    ### Review PHPDocs


    Periodic reviews of `PHPDoc` comments, much like code reviews, can prove beneficial.


    * Regularly review comments, especially after significant code changes.

    * Train your team members to flag outdated or wrong comments.

    * Prioritize `PHPDoc` comments when making updates on the code. Whenever you update
    a method or function, ensure that the `PHPDoc` comment also gets updated.


    ### Versioning for documentation


    You need to version your documentation just like you do with your software.


    * You can release new versions of your software while creating and retaining its
    accompanying documentation.

    * Allow consumers to change between versions by ensuring there are explicit links
    or dropdowns.

    * Put the latest version in a stronger light and maintain older versions available
    for those who work with legacy systems.


    ### Automated checks


    Automation might take care of making sure every method and class contains a `PHPDoc`
    comment.


    * Add `PHP_CodeSniffer` to your `CI/CD` pipeline.

    * Create rules for checking whether the new code contains `PHPDoc` comments before
    merging it.

    * Run the `PHPDocumentor` on an ongoing basis to warn or provide issues on missing
    or bad-formed comments.


    ### Access of documentation


    Grant access and easy browsing options both to your colleagues, but also to some
    potential external developers/users.


    * Host documentation on a special subdomain or known platform.

    * Frequently back up your documentation.

    * Make sure all links included in the documentation are.


