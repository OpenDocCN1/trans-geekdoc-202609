    This pattern allows you to define a family of algorithms, encapsulate each one\
    \ as an object, and make them interchangeable. It is useful when you want to switch\
    \ out algorithms in runtime or when you want to vary an algorithm’s behavior based\
    \ on certain conditions. Examples:\n- Symfony `HTTPKernal` for handling HTTP requests.\n\
    - Laravel `Eloquent` for database access.\n\nAn example showcasing the Strategy\
    \ pattern in action;\n\n```php\n<?php  \n\n// Define an interface for sorting\
    \ strategies.  \n\ninterface SortStrategy {  \n\n    public function sort($array);\
    \  \n\n}  \n\n// Implement the ascending sort strategy.  \n\nclass AscendingSort\
    \ implements SortStrategy {  \n\n    public function sort($array) {  \n\n    \
    \    sort($array);  // Use PHP's built-in sort function.  \n\n        return $array;\
    \  \n\n    }  \n\n}  \n\n// Implement the descending sort strategy.  \n\nclass\
    \ DescendingSort implements SortStrategy {  \n\n    public function sort($array)\
    \ {  \n\n        rsort($array);  // Use PHP's built-in reverse sort function.\
    \  \n\n        return $array;  \n\n    }  \n}  \n\n// Define a context class to\
    \ use the sort strategy.  \n\nclass Context {  \n\n    private $sortStrategy;\
    \  // Hold the sort strategy instance.  \n\n    // Constructor requires a sort\
    \ strategy instance.  \n\n    public function __construct(SortStrategy $sortStrategy)\
    \ {  \n\n        $this->sortStrategy = $sortStrategy;  \n\n    }  \n\n    // Execute\
    \ the sort using the provided strategy.  \n\n    public function executeStrategy($array)\
    \ {  \n\n        return $this->sortStrategy->sort($array);  \n\n    }  \n}  \n\
    \n// Use the context to sort an array in ascending order.  \n\n$context = new\
    \ Context(new AscendingSort());  \n\n$result = $context->executeStrategy([3, 1,\
    \ 2]);  \n\nprint_r($result);\n```\n\n## Observer\n\nThis is mostly used in event-driven\
    \ programming which allows objects to be notified of changes by other objects.\
    \ It’s mostly found in libraries that handle user input or need to interact with\
    \ external systems. It’s useful when you want to decouple the objects and ensure\
    \ a change made on one object will not have any effect on others. Examples:\n\
    - Symfony’s `EventDispatcher` allows for easy creation and dispatching of events\
    \ to registered listeners.\n- Laravel `Eloquent` makes use of this pattern for\
    \ model events.\n\nAn example showcasing the Observer pattern in action;\n\n```php\n\
    <?php  \n\n// Define an Event class that maintains observers and notifies them.\
    \  \n\nclass Event {  \n\n    private $observers = [];  // Array to hold observer\
    \ instances.  \n\n    // Add an observer instance to the list.  \n\n    public\
    \ function addObserver($observer) {  \n\n        $this->observers[] = $observer;\
    \  \n\n    }  \n\n    // Notify all observers with a message.  \n\n    public\
    \ function notify($message) {  \n\n        foreach ($this->observers as $observer)\
    \ {  \n\n            $observer->update($message);  \n\n        }  \n    }  \n\
    }  \n\n// Define an Observer class that receives and processes messages.  \n\n\
    class Observer {  \n\n    private $name;  // Name for the observer.  \n\n    //\
    \ Constructor initializes the observer name.  \n\n    public function __construct($name)\
    \ {  \n\n        $this->name = $name;  \n\n    }  \n\n    // Update method to\
    \ simulate receiving a message.  \n\n    public function update($message) {  \n\
    \n        echo \"Observer $this->name received: $message\\n\"; \n\n    }  \n}\
    \  \n\n// Create an event and add observers.  \n\n$event = new Event();  \n\n\
    $event->addObserver(new Observer('A'));  \n\n$event->addObserver(new Observer('B'));\
    \  \n\n// Notify all observers with a message.  \n\n$event->notify('Event occurred!');\n\
    ```\n"
