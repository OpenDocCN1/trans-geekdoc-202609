  trans: "\n\n![](img/image_rsrc3DE.jpg)\n\n# 维护良好的花园与库维护的类比\n\n## 理解更新\n\n更新不仅意味着修复漏洞或添加新功能。它们体现了库对追求卓越的能量和投入。\n\
    \n* **漏洞修复**：快速解决漏洞可以建立用户信任，并消除不便。\n* **功能增强**：对现有功能进行增强或添加新功能可以保持库的吸引力和时效性。\n\
    * **安全更新**：定期修复安全漏洞对于确保库的完整性及其声誉至关重要。\n* **兼容性更新**：如果该库已被广泛使用，则需要更新以实现与多个平台、版本和依赖项的兼容。\n\
    * **性能优化**：专注于速度、效率和资源使用的更新有助于确保愉悦的用户体验。\n\n以下是库更新的不同侧面：\n\n![](img/image_rsrc3DF.jpg)\n\
    ### 库更新的不同维度\n\n维护和更新库是保持库健康、相关性和成功的关键。例行维护、对用户反馈的响应、对趋势的预测以及审慎的升级，使库在充满挑战的市场中保持活力。以下课程将深入探讨这些细微差别，提供良好库管理的概述。\n\
    \n## 监控并响应问题与反馈\n\n在软件开发世界中，特别是涉及库时，问题监控和响应是开发者的主要活动之一。它们有助于故障排除、实现新功能，并为用户提供库的最佳体验。\n\
    \n### 监控问题\n\n问题监控的一项活动是跟踪用户报告的问题和请求的。需要一个组织良好的系统来分析、优先排序并对所有报告的问题做出及时响应。\n\n\
    ![](img/image_rsrc3DG.jpg)\n#### 问题监控流程流程图\n\n* **问题分类**：不同类别的问题，如漏洞报告、增强请求和查询请求。\n\
    * **问题优先级**：需要逐一考虑紧急和重要程度。\n* **分配给团队成员**：让合适的团队成员处理问题的解决。\n\n通过 `Trello` 或 `Jira`\
    \ 等 Scrum 面板跟踪所有问题/任务的进度。\n\n### 用户反馈\n\n用户反馈信息的重要来源。它可能揭示库是如何使用的，以及哪些地方可以改进。\n\
    \n* **收集反馈**：使用 `GitHub`、论坛或直接用户调查来收集反馈。\n* **分析反馈**：寻找共同模式以及独特的用户请求或困难。\n* **深思回复**：认可用户的输入并提供实际的后续操作。\n\
    \n### 通信渠道\n\n需要有效的通信通道来实现透明度和协作。问题跟踪器、论坛、邮件列表——任何能让社区围绕你的库聚集起来的工具。\n\n### 自动化工具\n\
    \n有很多种自动化方法帮助你节省时间，同时仍掌控问题。自动化的漏洞跟踪、告警——有时甚至对那些反复提问的常见问题提供初始解决方案，都能帮助进一步提高速度。\n\
    \n利用 `GitHub Actions` 等工具，你可以自动化漏洞跟踪、为关键问题发送警报，甚至回答常见问题。这些自动化流程不仅节省了时间，还确保了问题得到及时且系统的处理。\n\
    \n你可以通过访问仓库视图上的 `Actions` 标签并点击“自行设置工作流”，在你的 `GitHub` 库仓库上设置工作流，你应该看到类似的内容：\n\n\
    ![](img/image_rsrc3DH.jpg)\n#### 找到工作流设置链接/按钮\n\n在新窗口打开后，你可以按照下面的说明添加你的工作流配置并将其提交到仓库，你应该会有像这样的视图：\n\
    \n![](img/image_src3DJ.jpg)\n#### 添加你的工作流\n\n你可以利用这种强大的工具完成一些事情，例如：\n\n* **自动标记**：自动化的一个有效用途是在问题被报告时对其进行分类。例如，使用\
    \ `GitHub Actions`，你可以根据问题标题中的特定关键词自动将问题标记为 `bug`。例如，此脚本如果问题标题中包含 `bug`，则会自动将新问题标记为\
    \ `bug`，从而简化分类过程。\n\n```yaml\nname: Automated Labeling\non:\n  issues:\n    types:\
    \ [opened]\njobs:\n  bug-labeling:\n    runs-on: ubuntu-latest\n    steps:\n \
    \     - uses: actions/checkout@v2\n      - name: Label Issue\n        uses: actions/github-script@v3\n\
    \        with:\n          github-token: ${{secrets.GITHUB_TOKEN}}\n          script:\
    \ |\n            const issueTitle = context.payload.issue.title;\n           \
    \ const bugKeywords = ['crash', 'error', 'bug'];\n            const isBug = bugKeywords.some(keyword\
    \ => issueTitle.includes(keyword));\n            if (isBug) {\n              github.issues.addLabels({\n\
    \                issue_number: context.issue.number,\n                owner: context.repo.owner,\n\
    \                repo: context.repo.repo,\n                labels: ['bug']\n \
    \             });\n            }\n```\n\n* **关键问题的自动告警**：为关键问题设置自动告警可确保紧急事项得到及时处理。`GitHub\
    \ Actions` 可用于在问题标记为 `critical` 时向相关团队成员或利益相关者发送通知。此工作流片段每当问题标记为 `critical` 时就会触发告警，便于立即关注高优先级问题。\n\
    \n```yaml\nname: Critical Issue Alert\non:\n  issues:\n    types: [labeled]\n\
    jobs:\n  issue-alert:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v2\n\
    \      - name: Send Alert for Critical Issue\n        uses: actions/github-script@v3\n\
    \        with:\n          github-token: ${{secrets.GITHUB_TOKEN}}\n          script:\
    \ |\n            const label = context.payload.label.name;\n            if (label\
    \ === 'critical') {\n              // 发送告警的代码（例如电子邮件、短信或 Slack 通知）\n         \
    \   }\n```\n\n* **常见问题的自动回复**：通常，用户有可以使用标准回答的常见查询。可以配置自动化工具提供这些初始解决方案，提供快速且一致的回复。以下工作流示例展示了如何自动回答常见问题，提升用户体验并减少重复性任务。\n\
    \n```yaml\nname: Automated Issue Response\non:\n  issues:\n    types: [opened]\n\
    jobs:\n  issue-response:\n    runs-on: ubuntu-latest\n    steps:\n      - uses:\
    \ actions/checkout@v2\n      - name: Respond to issue\n        uses: actions/github-script@v3\n\
    \        with:\n          github-token: ${{secrets.GITHUB_TOKEN}}\n          script:\
    \ |\n            const issueComment = `感谢您的报告！我们将进行调查.*;\n            github.issues.createComment({\n\
    \              issue_number: context.issue.number,\n              owner: context.repo.owner,\n\
    \              repo: context.repo.repo,\n              body: issueComment\n  \
    \          });\n```\n\n"
- fmt: "\nIn summary, by leveraging automation tools like `GitHub actions`, library\
    \ maintainers can successfully manage problems and interact with their community.\
    \ those tools help maintain an excessive stage of responsiveness and high quality\
    \ in library support and development.\n\nIt is an ongoing process of listening\
    \ and responding to concerns and comments. It requires being aware, connected\
    \ with your community’s expressed needs, sensitive as you attempt to meet those\
    \ needs, and prepared with the right tools. Being in touch with your community\
    \ in this manner can help you cultivate a more healthy atmosphere around your\
    \ library - one that supports better quality and user satisfaction.\n\n## Updating\
    \ Library for Improved Changes\n\nIt is not enough to just add new features or\
    \ address bugs when updating a library. It is a continual commitment to improve\
    \ the library’s overall quality, efficiency, and dependability. A well-managed\
    \ update process takes into account the user’s needs, compatibility, and long-term\
    \ viability.\n\n### Why updates?\n\n*   Meet user demands: As users’ needs evolve,\
    \ the library must adapt to fulfill those needs.\n*   Fix bugs: Regular updates\
    \ are required to address known bugs and maintain the library’s integrity.\n*\
    \   Enhance performance: Optimization and enhancements result in improved performance.\n\
    *   Compliance and standards: Adhering to the most recent standards and laws guarantees\
    \ that the library remains relevant and legal.\n*   Security: Keeping the library\
    \ up-to-date guarantees that it meets the most recent security standards.\n\n\
    ### The Process of updating\n\nThis process involves doing some steps to achieve\
    \ a reliable and production-ready library, and they are:\n\n![](image_rsrc3DK.jpg)\n\
    \nA flowchart of the process of updating a PHP library\n\n*   Analysis and planning:\
    \ Determine what needs to be updated and why.\n*   Development and testing: Put\
    \ the improvements into action and extensively test them.\n*   User notification\
    \ and documentation: Inform users about the updates and offer suitable documentation.\n\
    *   Deployment: Controlled deployment of updates to ensure compatibility with\
    \ current systems.\n*   Monitoring and feedback collection: Post-update monitoring\
    \ aids in the early detection of any potential concerns.\n\n### Considerations\
    \ for updating\n\n*   Backward compatibility: This is the process of ensuring\
    \ that changes do not break existing functionality.\n*   Testing: Thorough testing\
    \ is performed to guarantee that the new changes do not introduce new bugs.\n\n\
    \    The following code snippet demonstrates a basic unit test for a hypothetical\
    \ new feature using `PHPUnit`. The test checks if the `functionality` method of\
    \ the `NewFeature` class returns the expected result, ensuring the new feature\
    \ works as intended.\n\n```php\nassertEquals('Expected result', $feature->functionality());\
    \ } }\n```\n\n*   Documentation: Users must have updated documentation to reflect\
    \ new developments.\n\n    The following snippet shows how to document a new feature\
    \ in a PHP library. The `PHPDoc` comment provides a clear description of the method,\
    \ including its purpose, parameters, and return type, which is crucial for users\
    \ and developers to understand its functionality.\n\n```php\n<?php\n\n/**\n* New\
    \ Feature Functionality\n*\n* This method implements the new feature which provides\
    \ …\n*\n* @param type $param Description\n* @return type Description \n*/ \npublic\
    \ function functionality($param) { // Method implementation }\n```\n\nUpdating\
    \ a library needs meticulous preparation, execution, and monitoring. It is about\
    \ ongoing improvement, adjusting to new needs, and maintaining the library’s quality\
    \ and security. Understanding why and how to update is critical for every library\
    \ maintainer.\n\n## Maintain Library Compatibility and Backward Compatibility\n\
    \nIt is critical in the development and maintenance of software libraries to ensure\
    \ both forward and backward compatibility. This lesson will go through why compatibility\
    \ is important, the difficulties in maintaining it, and solutions for managing\
    \ compatibility while developing and enhancing your library.\n\n### Importance\
    \ of compatibility\n\n### User trust and adoption\n\n*   Stability: Users rely\
    \ on a library’s consistent behavior. Sudden changes can be confusing or break\
    \ existing code.\n*   Migration path: A straightforward migration process assists\
    \ users in adapting to new versions without disrupting their productivity.\n*\
    \   Longevity: Support for older versions builds trust and ensures that users\
    \ can continue to use the library even on legacy systems.\n\n### Challenges in\
    \ compatibility\n\n### Balancing innovation and stability\n\n*   Innovations:\
    \ New additions and updates are necessary for growth, yet they may bring incompatibilities.\n\
    *   Deprecation: Removing obsolete features necessitates careful planning and\
    \ communication.\n*   Dependencies: Changes in dependencies might influence compatibility.\n\
    \n### Strategies to maintain compatibility\n\nTo maintain the compatibility of\
    \ your library/project there a specific patterns you need to follow and apply\
    \ regularly which are:\n\n![](image_rsrc3DM.jpg)\n\nSteps to maintain the compatibility\
    \ of your library/project\n\n### Semantic versioning (SemVer)\n\n*   Clear versioning:\
    \ Following `SemVer` guidelines assists users in understanding the nature and\
    \ impact of changes.\n*   Version planning: Version planning promotes smooth transitions\
    \ by planning releases based on compatibility.\n\n### Comprehensive testing\n\n\
    *   Automated testing: Run tests regularly to ensure that new modifications do\
    \ not damage existing functionality.\n*   Cross-version testing: Evaluate compatibility\
    \ by testing with multiple versions.\n\n### Documentation and communication\n\n\
    *   Update documentation: Maintain documentation by modifications and deprecations.\n\
    *   Engage with users: Users are better prepared and provide more valuable input\
    \ when they are informed about planned changes.\n\n### Consider long-term support\
    \ (LTS) versions\n\n*   Stable releases: LTS versions provide a stable basis for\
    \ those who require long-term support.\n\nMaintaining compatibility in library\
    \ development is a difficult but necessary effort. It is necessary to strike a\
    \ delicate balance between delivering new features and keeping existing functionality.\n\
    \nIt is feasible to innovate without alienating consumers or generating needless\
    \ obstacles with careful planning, comprehensive testing, and open communication.\n\
    \n## Security Considerations in Library Maintenance\n\nSecurity is critical in\
    \ software development, and keeping a secure library up-to-date is an ongoing\
    \ process. This lesson examines the essential principles and methods that developers\
    \ must follow to ensure the security of their libraries throughout their lifecycle.\n\
    \n### Understanding security risks\n\nExternal and internal security threats might\
    \ both exist. Understanding these threats is the first step toward creating a\
    \ secure library.\n\n*   External risks: This includes hacker attacks, weaknesses\
    \ in third-party dependencies, and so on.\n*   Internal risks: This includes code\
    \ defects, insufficient testing, noncompliance with security requirements, and\
    \ so on.\n\n### Security auditing\n\nRegular security audits aid in identifying\
    \ and resolving any security concerns.\n\n![](image_rsrc3DN.jpg)\n\nA mind-map\
    \ diagram for Security Auditing in PHP library maintenance\n\n*   Static analysis:\
    \ Finding vulnerabilities by analyzing code without running it.\n*   Dynamic analysis:\
    \ Detecting issues by testing the library in runtime conditions.\n*   Automated\
    \ security testing: This refers to the use of automated tools to perform routine\
    \ security tests.\n\n### Dependency scanning\n\nLibraries frequently rely on third-party\
    \ libraries. It is critical to keep track of these dependencies and ensure that\
    \ they are up-to-date and safe.\n\n![](image_rsrc3DP.jpg)\n\nA flowchart of the\
    \ dependency scanning and updating process\n\n*   Regularly update dependencies:\
    \ Keep all dependencies up-to-date.\n"
