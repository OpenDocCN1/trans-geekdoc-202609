  trans: "\n如果库没有按照预期方式工作，请逐步步进库的代码。虽然这看起来很耗时（特别是对于较大的库而言），但这种方法通常能找到问题的根源。Xdebug\
    \ 支持此类分析，它让你能够在任何代码行暂停执行，并检查应用程序中的当前状态。\n\n## 单元测试\n\n为你的库编写单元测试是发现 Bug 的另一个绝方法。覆盖库整个功能的测试可以帮助在问题变得令人困扰之前就发现它们。\n\
    \n{notice} 我们在之前的课程中已经详细介绍过单元测试。\n\n使用 `PHPUnit` 等工具可以帮助你生成报告，让你对库功能是如何测试的有非常好的见解，你可以生成覆盖率报告，以了解库中有多少部分被单元测试覆盖。\n\
    \n![](img/image_rsrc3CU.jpg)\n\nPHPunit 覆盖率报告\n\n## 日志解决方案\n\n使用 PHP 内置的错误日志功能来捕获库中发生的错误和异常。由此产生的日志在调试期间是无价的资源。将你的库设置为将错误记录到文件中，然后你可以打开并检查它以找出出了什么问题。\n\
    \n让我们来看如何在简单的函数或 PHP 文件中设置日志的示例。\n\n```php\n<?php  \n\n/**  \n* 将错误记录到文件的错误处理函数。\
    \  \n */  \nfunction customErrorHandler($error_level, $error_message, $error_file,\
    \ $error_line) {  \n    $errorMessage = \"[\" . date(\"Y-m-d H:i:s\") . \"] Error:\
    \ {$error_message} in {$error_file} on line {$error_line}\\n\";  \n    // 指定日志文件的路径\
    \  \n    $logFile = \"/path/to/error_log.txt\";  \n    // 将错误消息追加到日志文件中  \n  \
    \  error_log($errorMessage, 3, $logFile);  \n}  \n\n// 设置错误处理器  \nset_error_handler(\"\
    customErrorHandler\");  \n\n// 触发一个错误以演示（这通常来自你的应用程序代码）  \ntrigger_error(\"Sample\
    \ error for logging demonstration\");\n```\n\n让我们来分解这段代码段：\n\n*   `customErrorHandler()`\
    \ 函数用于处理错误。它格式化错误消息并将其写入特定文件。\n*   `set_error_handler()` 函数用于将 `customErrorHandler()`\
    \ 设置为错误处理器。\n*   `error_log()` 函数用于将错误类型为 `3` 的错误消息写入文件。\n*   `$logFile` 变量保存你想要存储错误消息的文件路径。\n\
    *   `trigger_error()` 函数用于触发错误以演示其工作原理。\n\n## 库文档\n\n每个库的文档通常包含常见 Bug 列表及其解决方案。当你被某些问题困住时，你应该第一个查看的地方是库文档，因为即使它没有直接给你答案，通常也会提供关于下一步该去哪的提示。\n\
    \n## 检查源代码\n\n如果遇到问题，请检查其源代码。通过深入源代码，通常可以发现问题的根源。虽然这可能很耗时，但它往往是有效的。\n\n![](img/image_rsrc3CV.jpg)\n\
    \n源代码流程图\n\n通过 `Xdebug`、`PHPUnit` 等工具，可以更好地理解代码的结构。这些工具可以帮助你发现库中的问题。\n\n## 代码质量指标\n\
    \n代码质量的衡量决定了代码的健康程度。以下是关于代码质量的一些指标：\n\n![](img/image_rsrc3CW.jpg)\n\n代码质量指标\n\n\
    总而言之，代码质量意味着：\n- **可读性**：代码易于阅读。\n- **可维护性**：代码易于维护。\n- **高效性**：代码运行高效。\n- **可靠性**：代码运行可靠。\n\
    \n## 代码质量的重要性\n\n关注代码质量从长期来看可以节省时间。\n\n![](img/image_rsrc3CZ.jpg)\n\n类覆盖率报告\n\n\
    ![](img/image_rsrc3D0.jpg)\n\n函数覆盖率报告\n\n## 代码覆盖率\n\n单元测试覆盖的代码量被测量为覆盖率。较高的覆盖率百分比意味着代码库经过了更多的测试，可能减少错误。\n\
    \n`PHPUnit`、`Xdebug` 和 `PCOV` 都能为你的 PHP 代码创建覆盖率报告。\n\n![](img/image_rsrc3CU.jpg)\n\
    \nPHPunit 覆盖率报告\n\n## PHP 代码质量测量\n\n有很多工具可以帮助你测量 PHP 代码。\n\n![](img/image_rsrc3CX.jpg)\n\
    \nPHPMD 输出\n\n## 圈复杂度\n\n圈复杂度决定了代码的复杂度。高复杂度意味着代码难以维护。你可以使用 [PHPMD](https://github.com/phpmd/phpmd)\
    \ (PHP Mess Detector) 等工具来计算 PHP 代码的圈复杂度。\n\n![](img/image_rsrc3CX.jpg)\n\nPHPMD\
    \ 输出\n\n## 代码重复\n\n代码重复是指你在多处有相同的代码。由于必须对应用程序的不同部分进行更新，代码重复可能会阻碍维护。使用 `PHPCP`\
    \ (PHP 复制粘贴检测) 或 `PHP_codesiffer` 等工具可以帮助发现重复代码。\n\n![](img/image_rsrc3CY.jpg)\n\
    \nPHP_codesiffer 输出\n\n## NPath 复杂度\n\nNPath 复杂度与函数中执行路径的数量有关。它是通过计算整个函数的无环执行路径得出的。高\
    \ NPath 复杂度就像圈复杂度一样，提示代码较为复杂。\n\n可以通过 PHPMD 获取 NPath 复杂度。\n"
- fmt: "\nWe should make efforts to write code that is easy to read, maintain and\
    \ efficient as well as use these tools. This could be refactoring complex methods\
    \ down into simple ones, removing redundant code or adding components to show\
    \ the purpose of certain parts of our code.\n\nQuality coding needs to be focused\
    \ upon for any professional PHP development work. Although writing high-quality\
    \ code might require a little effort at first, the rewards in terms of maintainability\
    \ and reliability are worth it.\n\nWe can get an independent measure of the quality\
    \ of our PHP code and work on areas that need improvements using metrics and tools.\n\
    \n# Maintaining Code Quality in PHP Libraries\n\nAfter the high quality is achieved\
    \ in PHP libraries, still it’s not over. The maintenance of code at that level\
    \ of quality is very important as with time it matures. In this regard, code quality\
    \ maintenance involves incremental and continuous enhancements to the codebase\
    \ by reviewing new additions or modifications.\n\nMaintaining the quality of code\
    \ is an endless task. It comprises:\n\n### Regular code review\n\nCode reviews\
    \ can significantly improve your code quality. Another set of eyes looking over\
    \ your code might spot potential problems, issues, and improvements you didn’t\
    \ think of or see at first sight. Any substantial change should be reviewed by\
    \ another developer to ensure the PHP library is not being compromised in its\
    \ quality.\n\nWe can draw the process of regular code review in a flowchart as\
    \ follows:\n\n![](image_rsrc3D1.jpg)\n\nA flowchart of regular code review process\n\
    \n### Use automated tools\n\nAutomated tools help to identify issues that could\
    \ pass unnoticed during a manual review process. Tools like `PHPMD` (PHP Mess\
    \ Detector), `PHPCS` (PHP Code Sniffer), and `PHPCPD` (PHP Copy/Paste Detector)\
    \ can assist in maintaining the level of code quality across the PHP libraries\
    \ by identifying possible issues such as code smells, style inconsistency, duplicated\
    \ code, and others.\n\n### Writing tests\n\nAnother great way to validate the\
    \ quality of your code is by writing unit and functional tests for it. By writing\
    \ a test, you can be sure that your code behaves as expected, and also doesn’t\
    \ introduce any regressions caused by changes in your codebase.\n\nLet us assume\
    \ that we have written a very basic class called `StringUtility` which contains\
    \ one simple function that takes a string and returns the reverse of that string,\
    \ will call it `reverseString()`, and to achieve this we use a PHP built-in function\
    \ called `strrev()`.\n\n```php\n<?php  \n\nclass StringUtility {  \n\n    /**\n\
    \     * Reverses a given string.\n     *  \n     * @param string $input String\
    \ to be reversed.\n     * @return string Reversed string.\n     */  \n    public\
    \ function reverseString($input) {  \n        // Uses PHP's built-in strrev function\
    \ to reverse the string  \n        return strrev($input);  \n    }  \n}\n```\n\
    \nNow, we need to make sure that this function works as expected and returns what\
    \ it is expected to return. So, here is a simple PHPUnit class testing some cases/scenarios\
    \ for that function.\n\n```php\n<?php  \n\nuse PHPUnit\\Framework\\TestCase; \
    \ \n\n// Test class for StringUtility  \nclass StringUtilityTest extends TestCase\
    \ {  \n\n    private $stringUtility;  \n\n    // Setup method to initialize StringUtility\
    \ before each test  \n    protected function setUp(): void {  \n        $this->stringUtility\
    \ = new StringUtility();  \n    }  \n\n    // Test to verify reverseString method\
    \ with a regular string  \n    public function testReverseString() {  \n     \
    \   $result = $this->stringUtility->reverseString('hello');  \n        // Asserts\
    \ that the reversed string matches the expected output  \n        $this->assertEquals('olleh',\
    \ $result);  \n    }  \n\n    // Test to check reverseString method with an empty\
    \ string  \n    public function testReverseStringWithEmptyString() {  \n     \
    \   $result = $this->stringUtility->reverseString('');  \n        // Asserts that\
    \ reversing an empty string returns an empty string  \n        $this->assertEquals('',\
    \ $result);  \n    }  \n\n    // Test to check reverseString with a string containing\
    \ special characters  \n    public function testReverseStringWithSpecialCharacters()\
    \ {  \n        $result = $this->stringUtility->reverseString('h!e@l#l$o');  \n\
    \        // Asserts that the reversed string matches the expected output  \n \
    \       $this->assertEquals('o$l#le!h', $result);  \n    }  \n}\n```\n"
  raw: "We should make efforts to write code that is easy to read, maintain and efficient\
    \ as well as use these tools. This could be refactoring complex methods down into\
    \ simple ones, removing redundant code or adding components to show the purpose\
    \ of certain parts of our code.\n\nQuality coding needs to be focused upon for\
    \ any professional PHP development work. Although writing high-quality code might\
    \ require a little effort at first, the rewards in terms of maintainability and\
    \ reliability are worth it.\n\nWe can get an independent measure of the quality\
    \ of our PHP code and work on areas that need improvements using metrics and tools.\n\
    \n## Maintaining Code Quality in PHP Libraries\n\nAfter the high quality is achieved\
    \ in PHP libraries, still it’s not over. The maintenance of code at that level\
    \ of quality is very important as with time it matures. In this regard, code quality\
    \ maintenance involves incremental and continuous enhancements to the codebase\
    \ by reviewing new additions or modifications.\n\nMaintaining the quality of code\
    \ is an endless task. It comprises:\n\n### Regular code review\n\nCode reviews\
    \ can significantly improve your code quality. Another set of eyes looking over\
    \ your code might spot potential problems, issues, and improvements you didn’t\
    \ think of or see at first sight. Any substantial change should be reviewed by\
    \ another developer to ensure the PHP library is not being compromised in its\
    \ quality.\n\nWe can draw the process of regular code review in a flowchart as\
    \ follows:\n\n![](image_rsrc3D1.jpg)\n\nA flowchart of regular code review process\n\
    \n### Use automated tools\n\nAutomated tools help to identify issues that could\
    \ pass unnoticed during a manual review process. Tools like PHPMD (PHP Mess Detector),\
    \ PHPCS (PHP Code Sniffer), and PHPCPD (PHP Copy/Paste Detector) can assist in\
    \ maintaining the level of code quality across the PHP libraries by identifying\
    \ possible issues such as code smells, style inconsistency, duplicated code, and\
    \ others.\n\n### Writing tests\n\nAnother great way to validate the quality of\
    \ your code is by writing unit and functional tests for it. By writing a test,\
    \ you can be sure that your code behaves as expected, and also doesn’t introduce\
    \ any regressions caused by changes in your codebase.\n\nLet us assume that we\
    \ have written a very basic class called StringUtility {} which contains one simple\
    \ function that takes a string and returns the reverse of that string, will call\
    \ it reverseString(), and to achieve this we use a PHP built-in function called\
    \ strrev().\n\n<?php  \n\nclass StringUtility {  \n\n    /\\*\\*  \n\n     \\\
    * Reverses a given string.  \n\n     \\*  \n\n     \\* @param string $input String\
    \ to be reversed.  \n\n     \\* @return string Reversed string.  \n\n     \\*/\
    \  \n\n    public function reverseString($input) {  \n\n        // Uses PHP's\
    \ built-in strrev function to reverse the string  \n\n        return strrev($input);\
    \  \n\n    }  \n\n}\n\nNow, we need to make sure that this function works as expected\
    \ and returns what it is expected to return. So, here is a simple PHPUnit class\
    \ testing some cases/scenarios for that function.\n\n<?php  \n\nuse PHPUnit\\\\\
    Framework\\\\TestCase;  \n\n// Test class for StringUtility  \n\nclass StringUtilityTest\
    \ extends TestCase {  \n\n    private $stringUtility;  \n\n    // Setup method\
    \ to initialize StringUtility before each test  \n\n    protected function setUp():\
    \ void {  \n\n        $this\\->stringUtility \\= new StringUtility();  \n\n    }\
    \  \n\n    // Test to verify reverseString method with a regular string  \n\n\
        public function testReverseString() {  \n\n        $result \\= $this\\->stringUtility->reverseString('hello');\
    \  \n\n        // Asserts that the reversed string matches the expected output\
    \  \n\n        $this\\->assertEquals('olleh', $result);  \n\n    }  \n\n    //\
    \ Test to check reverseString method with an empty string  \n\n    public function\
    \ testReverseStringWithEmptyString() {  \n\n        $result \\= $this\\->stringUtility->reverseString('');\
    \  \n\n        // Asserts that reversing an empty string returns an empty string\
    \  \n\n        $this\\->assertEquals('', $result);  \n\n    }  \n\n    // Test\
    \ to check reverseString with a string containing special characters  \n\n    public\
    \ function testReverseStringWithSpecialCharacters() {  \n\n        $result \\\
    = $this\\->stringUtility->reverseString('h!e@l#l$o');  \n\n        // Asserts\
    \ that the reversed string matches the expected output  \n\n        $this\\->assertEquals('o$ll#e@h!',\
    \ $result);  \n\n    }  \n\n}\n\nSo, this test class contains 3 main functions:\n\
    \n*   testReverseString(): This tests the basic functionality of the function.\n\
    \n*   testReverseStringWithEmptyString(): Ensures the function handles empty strings\
    \ correctly.\n\n*   testReverseStringWithSpecialCharacters(): Ensures the function\
    \ works well with strings containing special characters.\n\n### Refactoring\n\n\
    Rearranging old code without changing its external behavior is what we call refactoring.\
    \ It’s an important approach to keeping - if not enhancing - the quality of the\
    \ code over time. When refactoring keep SOLID principles in mind, to make better\
    \ both the structure and maintainability of the code.\n\nLet us see an example\
    \ demonstrating how refactoring code can improve the readability and structure\
    \ of the code. In the following, example we have a generateReport() function that\
    \ handles multiple responsibilities (formatting, saving, and sending the report),\
    \ you can easily say that it violates the first principle (Single Responsibility\
    \ Principle) of the SOLID principles.\n\n<?php  \n\n// A class that generates\
    \ reports  \n\nclass ReportGenerator {  \n\n    // Method to generate a report\
    \ based on the provided data  \n\n    public function generateReport($data) {\
    \  \n\n        // Code to format the report  \n\n        // Code to save the report\
    \  \n\n        // Code to send the report  \n\n    }  \n\n}\n\nWe can refactor\
    \ that function and break the report generation process into separate classes,\
    \ each handling a single task. This not only makes the code more readable & structured\
    \ but also adheres to the single responsibility principle.\n\n<?php  \n\n// Class\
    \ for formatting reports  \n\nclass ReportFormatter {  \n\n    // Formats the\
    \ given data into a report  \n\n    public function format($data) {  \n\n        //\
    \ Code to format the report  \n\n    }  \n\n}  \n\n// Class for saving reports\
    \  \n\nclass ReportSaver {  \n\n    // Saves the given report  \n\n    public\
    \ function save($report) {  \n\n        // Code to save the report  \n\n    }\
    \  \n\n}  \n\n// Class for sending reports  \n\nclass ReportSender {  \n\n    //\
    \ Sends the given report  \n\n    public function send($report) {  \n\n        //\
    \ Code to send the report  \n\n    }  \n\n}  \n\n// The main class that generates\
    \ reports using the above components  \n\nclass ReportGenerator {  \n\n    private\
    \ $formatter;  \n\n    private $saver;  \n\n    private $sender;  \n\n    // Constructor\
    \ to initialize formatter, saver, and sender  \n\n    public function \\_\\_construct($formatter,\
