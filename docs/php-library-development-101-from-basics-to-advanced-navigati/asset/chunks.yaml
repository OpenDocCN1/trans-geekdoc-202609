    ;\n```\n\n### Interface Segregation\n\n- Interface Segregation: no clients should\
    \ be forced to depend on methods that don’t use. So every class must have an interface\
    \ that only includes the methods it needs.\n\nWe should not do:\n\n```php\n<?php\n\
    // This interface defines a blueprint for a 'Worker' type.\ninterface Worker {\n\
    \    // This function signature ensures that any implementing class must have\
