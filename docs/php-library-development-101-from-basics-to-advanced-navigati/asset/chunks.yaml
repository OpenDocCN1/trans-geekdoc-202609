  trans: "\n\n在后续过程中，我们将探讨如何将单元测试集成到我们的 Jazzon 库中。\n\n#为库编写测试\n\n测试是任何软件开发过程中不可或缺的一部分，库也不例外。通过为我们的库组件实现单元测试，我们可以及早发现可能的错误、加速更新并简化集成过程。在本节中，我们将学习如何使用\
    \ `PHPUnit` 为我们的 Jazzon 库组件创建单元测试。\n\n## 设置 PHPUnit\n\n在开始编写测试之前，我们必须首先安装 `PHPUnit`。PHPUnit\
    \ 必须安装在本地或全局环境中。以下是使用 `Composer` 在本地进行安装的方法：\n\n```bash\ncomposer require --dev\
    \ phpunit/phpunit ¹⁰.1\n```\n\n安装 `PHPUnit` 后，我们可以在项目根目录下创建一个 `phpunit.xml` 配置文件，用于存储我们为测试定义的任何配置：\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?> \n<phpunit bootstrap=\"vendor/autoload.php\"\
    \ colors=\"true\">\n    <testsuites>\n        <testsuite name=\"Jazzon Test Suite\"\
    >\n            <directory>tests</directory>\n        </testsuite>\n    </testsuites>\n\
    </phpunit>\n```\n\n该配置文件告诉 `PHPUnit` 使用 `Composer` 的自动加载器来加载我们的类，并在 `tests` 目录中查找测试。\n\
    \n## 编写测试\n\n查看我们库中的 `JsonValidator` 类。该类有一个方法 `validate()`，用于检查给定的字符串是否为有效的 JSON。\n\
    \n```php\n<?php \n\nnamespace Jazzon\\Validators;\n\nclass JsonValidator\n{\n\
    \    /**\n     * 验证 JSON 字符串\n     * \n     * @param string $json 需要验证的 JSON 字符串\n\
    \     * @return bool 如果 JSON 字符串有效则返回 true，否则返回 false \n     */\n    public function\
    \ validate(string $json): bool\n    {\n        // 我们将使用 json_decode() 尝试解码字符串。\n\
    \        // 如果它返回 null，且我们知道字符串不是 'null'，\n        // 那么它不是有效的 JSON。\n       \
    \ $decoded = json_decode($json);\n        if ($decoded === null && strtolower($json)\
    \ !== 'null') {\n            return false;\n        }\n        return true;\n\
    \    }\n}\n```\n\n我们可以编写一个新的测试用例来测试此类类，`JsonValidatorTest`，其实现如下：\n\n```php\n\
    <?php\n// 为测试定义命名空间。这有助于组织代码并避免命名冲突。\nnamespace Jazzon\\Tests;\n\n// 从 Jazzon\\\
    Validators 命名空间导入 JsonValidator 类。该将在此测试类中进行测试。\nuse Jazzon\\Validators\\JsonValidator;\n\
    \n// 从 PHPUnit 导入 TestCase 类，它是所有 PHPUnit 测试的基类。\nuse PHPUnit\\Framework\\TestCase;\n\
    \n// 定义一个新的测试类 JsonValidatorTest，它继承自 PHPUnit 的 TestCase 类。\nclass JsonValidatorTest\
    \ extends TestCase\n{\n    // 定义一个测试方法，确保 validate 方法对有效 JSON 返回 true。\n    public\
    \ function testValidateReturnsTrueForValidJson(): void\n    {\n        $validator\
    \ = new JsonValidator();\n        $this->assertTrue($validator->validate('{\"\
    key\":\"value\"}'));\n    } \n\n    public function testValidateReturnsFalseForInvalidJson():\
    \ void\n    {\n        $validator = new JsonValidator();\n        $this->assertFalse($validator->validate('invalid-json'));\n\
    \    }\n}\n```\n\n"
- fmt: "\nThe `testOrderProcessorWithMockedPaymentGateway` method aims to test the\
    \ class `OrderProcessor` in isolation from the `PaymentGateway` class. Creating\
    \ a mock of the `PaymentGateway` verifies the `OrderProcessor` functionality without\
    \ being dependent on the actual implementation of the payment gateway.\n\n```php\n\
    <?php  \n\npublic function testOrderProcessorWithMockedPaymentGateway(): void\
    \  \n\n{  \n    // Create a mock for the PaymentGateway.  \n    $paymentGatewayMock\
    \ = $this->createMock(PaymentGateway::class);  \n    // Configure the mock to\
    \ return true when the `processPayment` method is called.  \n    $paymentGatewayMock->method('processPayment')->willReturn(true);\
    \  \n    // Use the mocked PaymentGateway in the OrderProcessor.  \n    $orderProcessor\
    \ = new OrderProcessor($paymentGatewayMock);  \n    $orderProcessed = $orderProcessor->processOrder(new\
    \ Order());  \n    $this->assertTrue($orderProcessed);  \n}\n```\n\nWriting effective\
    \ tests for library components is a critical component of creating strong and\
    \ dependable code. You may verify that your components perform correctly under\
    \ various conditions by following best practices and focusing on what each piece\
    \ of your code is supposed to do.\n\n## Library Components Tests\n\nIn this lesson,\
    \ we are going to write all the other tests needed for our library classes.\n\n\
    {notice} We already implemented the tests for the `JsonValidator` class in the\
    \ previous lesson. And you can find all code tests in the provided `jazzon-lib-classes-implmentation`\
    \ folder to run on your machine.\n\n### JsonEncoder class tests\n\nThe `encode()`\
    \ function of the `JsonEncoder` class accepts a value and produces a JSON-encoded\
    \ string. Let’s see how we can test some of the basic cases for that function;\n\
    \n```php\n<?php  \n\n// Declare the namespace for this test class.  \nnamespace\
    \ Jazzon\\Tests;  \n\n// Import necessary classes for the test.  \nuse Jazzon\\\
    Encoders\\JsonEncoder;  \nuse Jazzon\\Exceptions\\JsonException;  \nuse PHPUnit\\\
    Framework\\TestCase;  \n\n// Define the test class which extends PHPUnit's TestCase.\
    \  \nclass JsonEncoderTest extends TestCase  \n\n{  \n    // Test that encoding\
    \ an array returns valid JSON.  \n    public function testEncodeReturnsValidJsonForArray():\
    \ void  \n    {  \n        // Instantiate the JsonEncoder with a sample array.\
    \  \n        $encoder = new JsonEncoder(['key' => 'value']);  \n        // Assert\
    \ that encoding this array gives the expected JSON string.  \n        $this->assertEquals('{\"\
    key\":\"value\"}', $encoder->encode());  \n    }  \n    // Test that encoding\
    \ malformed data throws a JsonException.  \n    public function testEncodeThrowsJsonExceptionForMalformedData():\
    \ void  \n    {  \n        // Set the expectation that a JsonException will be\
    \ thrown.  \n        $this->expectException(JsonException::class);  \n       \
    \ // Instantiate the JsonEncoder with malformed data.  \n        $encoder = new\
    \ JsonEncoder(\"\\xB1\\x31\");  \n        // Attempt to encode, which should throw\
    \ the expected exception.  \n        $encoder->encode();  \n    }  \n}\n```\n\n\
    The above snippet consists of two functions:\n\n- The function `testEncodeReturnsValidJsonForArray`\
    \ ensures that an array that has been encoded through the class `JsonEncoder`\
    \ returns a valid JSON string.\n- The function `testEncodeThrowsJsonExceptionForMalformedData`\
    \ makes sure that encoding improper data using the class `JsonEncoder` should\
    \ throw a `JsonException`.\n\n### JsonParser class tests\n\nThe `parse()` function\
    \ of the `JsonParser` class takes a JSON string and returns a `DecodedValue` object.\
    \ Let’s see how we can test some of the basic cases for that function;\n\n```php\n\
    <?php  \n\n// Declare the namespace for this test class.  \nnamespace Jazzon\\\
    Tests;  \n\n// Import necessary classes for the test.  \nuse Jazzon\\Parsers\\\
    JsonParser;  \nuse Jazzon\\Decoding\\DecodedValue;  \nuse Jazzon\\Exceptions\\\
    JsonException;  \nuse PHPUnit\\Framework\\TestCase;  \n\n// Define the test class\
    \ which extends PHPUnit's TestCase.  \nclass JsonParserTest extends TestCase \
    \ \n\n{  \n    // Test that parsing valid JSON returns a DecodedValue instance.\
    \  \n    public function testParseReturnsDecodedValueForValidJson(): void  \n\
    \    {  \n        // Instantiate the JsonParser with a sample JSON.  \n      \
    \  $parser = new JsonParser('{\"key\":\"value\"}');  \n        // Parse the JSON\
    \ and store the result.  \n        $result = $parser->parse();  \n        // Assert\
    \ that the result is an instance of DecodedValue.  \n        $this->assertInstanceOf(DecodedValue::class,\
    \ $result);  \n        // Assert that the parsed data matches the expected array.\
    \  \n        $this->assertEquals(['key' => 'value'], $result->getDataArray());\
    \  \n    }  \n    // Test that parsing invalid JSON throws a JsonException.  \n\
    \    public function testParseJsonExceptionForInvalidJson(): void  \n    {  \n\
    \        // Set the expectation that a JsonException will be thrown.  \n     \
    \   $this->expectException(JsonException::class);  \n        // Instantiate the\
    \ JsonParser with an invalid JSON string.  \n        $parser = new JsonParser('{\"\
    key\":\"value\",}');  \n        // Attempt to parse, which should throw the expected\
    \ exception.  \n        $parser->parse();  \n    }\n}\n```\n\nThe above snippet\
    \ consists of two functions:\n\n- `testParseReturnsDecodedValueForValidJson` is\
    \ a unit test assuring that parsing valid JSON string by the `JsonParser` class\
