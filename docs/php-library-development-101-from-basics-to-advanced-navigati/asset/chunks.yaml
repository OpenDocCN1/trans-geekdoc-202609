  trans: "\n\n# 函数最佳实践\n\n在定义/设计库函数时，请记住以下一些良好实践：\n\n![](img/image_rsrc3CN.jpg)\n\n\
    ## 函数最佳实践\n\n*   保持函数短小并专注于单一的小型任务，以提高代码的可读性和可维护性。\n\n```php\n<?php\n// 此函数执行一个微小且集中的任务：两个数字相加。\n\
    function add(int $a, int $b): int {\n    return $a + $b;\n}\n// 使用该函数将 5 和 3 相加。\n\
    $result = add(5, 3);\necho $result; // 输出: 8\n```\n\n*   避免使用全局变量，并使用参数传递数据。\n\
    \n```php\n<?php\n// 与使用全局变量，我们将值作为参数传递给函数。\nfunction multiply(int $x, int $y):\
    \ int {\n    return $x * $y;\n}\n// 使用该函数将 6 乘以 4。\n$result = multiply(6, 4);\n\
    echo $result; // 输出: 24\n```\n\n*   使用具有描述性的常量命名，以便于理解函数。\n\n```php\n<?php\n//\
    \ 函数名清晰地描述了它的目的：将华氏度转换为摄氏度。\nfunction convertFahrenheitToCelsius(float $fahrenheit):\
    \ float {\n    return ($fahrenheit - 32) * (5/9);\n}\n// 使用该函数将 98.6 华氏度转换为摄氏度。\n\
    $celsius = convertFahrenheitToCelsius(98.6);\necho $celsius; // 输出: 37\n```\n\n\
    *   使用类型提示以确保传递到函数的数据类型是正确的。\n\n```php\n<?php\n// 类型提示确保函数只接受数组并返回整数。\nfunction\
    \ countElementsInArray(array $items): int {\n    return count($items);\n}\n//\
    \ 使用该函数计算数组中的项数。\n$arrayItems = ['apple', 'banana', 'cherry'];\n$count = countElementsInArray($arrayItems);\n\
    echo $count; // 输出: 3\n```\n\n*   使用异常处理来优雅地处理函数内部的错误和失败。\n\n```php\n<?php\n//\
    \ 此函数安全地除法两个数字，如果除数为 0，则抛出异常。\nfunction safeDivide(int $numerator, int $denominator):\
    \ float {\n    if ($denominator === 0) {\n        throw new Exception(\"除数不能为零.\"\
    );\n    }\n    return $numerator / $denominator;\n}\n// 尝试使用该函数将 8 除以 0。这将触发异常。\n\
    try {\n    $result = safeDivide(8, 0);\n    echo $result;\n} catch (Exception\
    \ $e) {\n    echo $e->getMessage(); // 输出: 除数不能为零。\n}\n```\n\n## JSON 函数\n\n让我们列出库中预期的函数：\n\
    \n*   `parse(bool $assoc = false, int $depth = 512, int $options = 0)` - 负责将 JSON\
    \ 字符串解析为 PHP 数组。\n\n```php\n<?php\n/**\n * 解析 JSON 字符串并返回对象或数组\n *\n * @param\
    \ bool $assoc [可选] 如果为 true，返回的对象将转换为关联数组。\n * @param int $depth [可选] 用户指定的递归深度。\n\
    \ * @param int $options [可选] JSON 解码选项的位码。\n * @return mixed\n * @throws JsonException\n\
    \ */\nfunction parse(bool $assoc = false, int $depth = 512, int $options = 0):\
    \ string\n{\n    // 解析逻辑\n}\n```\n\n*   `getArray()` 返回解析后的 JSON 字符串的 PHP 数组。\n\
    *   `getObject()` 返回解析后的 JSON 字符串的 PHP 对象。\n*   `encode(int $options = 0, int\
    \ $depth = 512)` 用于将数据编码为 JSON 字符串。\n\n```php\n<?php\n/**\n * 将数组或对象编码为 JSON 字符串。\n\
    \ * @param int $options [可选] JSON 编码选项。\n * @param int $depth [可选] 最大深度。\n * @return\
    \ string\n * @throws JsonException\n */\nfunction encode(int $options = 0, int\
    \ $depth = 512): string\n{\n    // 编码逻辑\n}\n```\n\n*   `validate(string $json)`\
    \ 是验证 JSON 字符串的函数。\n\n```php\n<?php\n/**\n * 验证 JSON 字符串\n *\n * @param string\
    \ $json 要验证的字符串\n * @return bool 如果 JSON 字符串有效，否则为 false\n */\nfunction validate(string\
    \ $json): bool\n{\n    // 验证逻辑\n}\n```\n\n这是我们库中定义函数的起点。\n\n### 类\n\n类是面向对象编程的基础。它们允许我们将数据和函数封装到单个单元中。\n\
    \n例如，在我们的 Jazzon 库中，我们有一个名为 `DecodedValue` 的类，它可以表示解码后的结果：\n\n```php\n<?php\n\
    // DecodedValue.php\n/**\n * 表示解码结果。\n */\nclass DecodedValue\n{\n    /**\n  \
    \   * 解码的数据。\n     * @var mixed\n     */\n    private $data;\n\n    /**\n    \
    \ * 解码数据时的字节数。\n     * @var int\n     */\n    private $bytesConsumed;\n\n    /**\n\
    \     * 创建一个新的解码结果。\n     *\n     * @param mixed $data 解码的数据。\n     * @param int\
    \ $bytesConsumed 解码数据时的字节数。\n     */\n    public function __construct($data, $bytesConsumed)\n\
    \    {\n        $this->data = $data;\n        $this->bytesConsumed = $bytesConsumed;\n\
    \    }\n\n    /**\n     * 获取解码的数据。\n     *\n     * @return mixed\n     */\n  \
    \  public function getData()\n    {\n        return $this->data;\n    }\n\n  \
    \  /**\n     * 获取解码数据时的字节数。\n     *\n     * @return int\n     */\n    public function\
    \ getBytesConsumed()\n    {\n        return $this->bytesConsumed;\n    }\n}\n\
    ```\n\n另一个类将是 `JsonParser` 类，它为我们封装解析函数。正如我们在上一节中定义的，`parse()` 函数是该类的一部分：\n\n\
    ```php\n<?php\n// JsonParser.php\n/**\n * 解析 JSON 字符串并返回对象或数组\n */\nclass JsonParser\n\
    {\n    /**\n     * 解析 JSON 字符串并返回对象或数组\n     *\n     * @param bool $assoc [可选]\
    \ 如果为 true，返回的对象将转换为关联数组。\n     * @param int $depth [可选] 用户指定的递归深度。\n     * @param\
    \ int $options [可选] JSON 解码选项的位码。\n     * @return mixed\n     * @throws JsonException\n\
    \     */\n    public function parse(bool $assoc = false, int $depth = 512, int\
    \ $options = 0): string\n    {\n        // 解析逻辑\n    }\n}\n```\n\n这个 `JsonParser`\
    \ 还可以包含与解析算法相关的其他函数，例如我们需要添加一个从文件解析 JSON 的新功能，我们可以实现另一个名为 `parseFile(...)` 的过程。\n\
    \n{注意} 我们将在实现阶段遍历属于每个类的函数。\n\n我们还有另一个用于将 PHP 数组或对象解码为 JSON 的类。\n\n```php\n<?php\n\
    // JsonEncoder.php\n/**\n * JsonEncoder 类\n * 将数据编码为 JSON 字符串\n */\nclass JsonEncoder\n\
    {\n```\n\n"
