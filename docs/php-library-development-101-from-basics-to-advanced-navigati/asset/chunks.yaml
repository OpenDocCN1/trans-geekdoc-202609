    \ => 'David', 'age' => 30]`.\n\n```php\n<?php\n/**\n * Decode a JSON string into\
    \ an associative array.\n *\n * @param string $jsonString JSON string to be converted\
    \ to an array.\n * @return mixed Associative array representation of the JSON\
    \ or an error message.\n * @throws InvalidArgumentException If the JSON string\
    \ is invalid.\n */\nfunction decode($jsonString) {\n    // Decode the JSON string\n\
    \    $result \\= json_decode($jsonString, true);\n\n    // Check for JSON decoding\
    \ errors\n    if (json_last_error() !== JSON_ERROR_NONE) {\n        // Return\
    \ a clear error message to the user\n        return \"Invalid JSON string provided.\"\
    ;\n    }\n\n    // Return the decoded associative array\n    return $result;\n\
    }\n\n// Usage\nprint_r(decode('{\"name\": \"David\", \"age\": 30}')); // Expected\
    \ Output: Array ([name] => David [age] => 30 )\n```\n"
