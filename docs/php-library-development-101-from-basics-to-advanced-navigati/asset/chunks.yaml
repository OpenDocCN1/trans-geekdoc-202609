    你可以在下方截图的左侧看到导航栏，通过它可以轻松地在代码的不同部分之间进行；


    ![](img/image_rsrc3D7.jpg)


    # 导航示例


    ## 结合 Jazzon 示例


    由于 PHPDoc 注释是为 `Jazzon` 类编写的，我们可以运行 `PHPDocumentor` 来生成完整的文档。这些文档将为终端用户提供有关 `Jazzon`
    库的方法、属性、返回类型以及该库其他方面的简要信息。对于任何使用 `Jazzon` 库的开发者来说，这份文档都是无价之宝。


    {notice} 你可以在 `jazzon-lib-classes-implmentation` 文件夹中找到 PHPDoc 工具如何在 docker 容器中安装的，请检查
    `docker-containers/php-fpm/Dockerfile` 文件的第 `15-23` 行；为了能够在本地运行并查看其效果，请查看 `ReadMe`
    文件中的运行命令。


    使用 `PHPDoc` 创建文档的过程是创造性工作与自动化的结合。尽管如此，创建文档的大部分繁重工作由 `PHPDocumentor` 完成——但确保 `PHPDoc`
    注释编写得良好、有用且全面，是开发者的责任。这样做有助于团队确保最终获得高质量、可读性强且专业的文档，将其作为当前及未来开发者的资产。


    ## 维护 PHPDoc 注释和文档


    文档并不是一项“设置后一劳永逸”的任务，即使是自动生成的也是如此。你的库或软件的文档应该随之不断增长和变化。


    ### 维护需求


    文档的主要目的是支持开发者——无论是为了让他们快速上手、简化对库复杂性的理解，还是为了更容易进行调试。当你的文档过时时，可能会发生以下情况：


    * 对函数的误解或理解错误。

    * 在已弃用或修改的函数上浪费时间。

    * 因过时的流程导致效率低下或出现错误。


    ### 审查 PHPDocs


    定期审查 `PHPDoc` 注释（类似于代码审查）被证明是有有益的。


    * 定期审查注释，特别是在代码发生变更之后。

    * 训练你的团队成员标记过时或错误的注释。

    * 在更新代码时，优先考虑 `PHPDoc` 注释。每当你更新一个方法或函数时，请确保同时更新 `PHPDoc` 注释。


    ### 文档的版本控制


    你需要像管理软件一样对文档进行版本控制。


    * 你可以在发布软件新版本的同时，创建并保留相应的文档。

    * 通过确保存在显式链接或下拉菜单，允许用户在不同版本之间切换。

    * 突出最新版本，并为维护遗留系统的开发者保留旧版本的可用。


    ### 自动化检查


    自动化可以确保每个方法和类都包含 `PHPDoc` 注释。


    * 将 `PHP_CodeSniffer` 添加到你的 `CI/CD` 流水线。

    * 创建规则，在合并新代码之前检查其是否包含 `PHPDoc` 注释。

    * 定期运行 `PHPDocumentor`，对缺失或格式错误的注释发出警告或提供反馈。


    ### 文档访问


    为你的同事以及一些潜在的外部开发者/用户提供访问权限和方便的浏览选项。


    * 将文档托管在特殊的子域名或已知平台上。

    * 频繁备份你的文档。

    * 确保文档中包含的所有链接都是有效的。


    ### 社区参与


    为你的同事以及一些潜在的外部开发者/用户提供访问权限和方便的浏览选项。


    * 将文档托管在特殊的子域名或已知平台上。

    * 频繁备份你的文档。

    * 确保文档中包含的所有链接都是有效的。


