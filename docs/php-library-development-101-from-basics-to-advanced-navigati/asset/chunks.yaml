  raw: "xdebug.log\\=\"/path/to/your/logfile\"\n\n{notice} Check how we setup XDebug\
    \ for our Jazzon library by checking the docker-containers/php-fpm/Dockerfile\
    \ line 13, and the docker-containers/php-fpm/php-ini-local.ini lines 13-18 in\
    \ the provided jazzon-lib-classes-implmentation folder.\n\n### Debugging with\
    \ PHP debug bar\n\n[PHP Debug Bar](https://github.com/maximebf/php-debugbar) is\
    \ a debugging tool with a simple, user-friendly interface. It may display a wide\
    \ range of data such as memory use, execution time, errors, and database queries.\
    \ It is extremely simple to integrate into any project and may be expanded with\
    \ custom data collectors.\n\n### Error logging\n\nLogging errors is a useful tool\
    \ for determining what went wrong in your code. PHP includes error reporting procedures\
    \ such as eror\\_log(), which writes a message to the server’s error log or a\
    \ specified file.\n\nThe following example will print an error message to a specific\
    \ file;\n\n<?php  \n\n// Use the error\\_log function to write an error message\
    \ to a specified log file.  \n\n// The \"3\" argument indicates that the message\
    \ should be appended to the file specified in the next argument.  \n\nerror\\\
    _log(\"An error occurred\", 3, \"/path/to/my/error\\_log\");\n\nFurthermore, you\
    \ can utilize logging libraries like Monolog, which offers more complex capabilities\
    \ such as variable logging levels and handlers.\n\n### Using PHPUnit for debugging\n\
    \nAlthough PHPUnit is primarily a testing tool, it also includes debugging features.\
    \ For example, you can use PHPUnit to write tests that replicate the bug. This\
    \ can give you a better idea of what’s wrong and where the fault is in your code.\n\
    \nThe following is a very basic example of a unit test to confirm the sum of an\
    \ array value is correct, you can also add another unit test to test different\
    \ edge cases to make sure your code can handle various cases of errors.\n\n<?php\
    \  \n\nuse PHPUnit\\\\Framework\\\\TestCase;  // Use the TestCase class from PHPUnit.\
    \  \n\n// Define a test class that inherits from the PHPUnit TestCase class. \
    \ \n\nclass ArraySumTest extends TestCase  \n\n{  \n\n    // Define a test method\
    \ that will test the sum of an array.  \n\n    public function testArraySum():\
    \ void  \n\n    {  \n\n        // Declare an array with values 1, 2, and 3.  \n\
    \n        $array \\= \\[1, 2, 3\\];  \n\n        // Assert that the sum of the\
    \ values in the array equals 6.  \n\n        $this\\->assertEquals(6, array\\\
    _sum($array));  \n\n    }  \n\n}\n\nYou can generate some coverage reports with\
    \ PHPUnit to verify that you have all your code parts covered correctly.\n\n###\
    \ Profiling with XHProf\n\nProfiling is the practice of examining your code to\
    \ see which areas are slow and can be improved. XHProf is a PHP hierarchical profiler.\
    \ It displays call counts at the function level as well as inclusive and exclusive\
    \ metrics such as wall (elapsed) time, CPU time, and memory use.\n\n{warning}\
    \ The original XHProf doesn’t support PHP 8.x that is why you might need to use\
    \ a forked one such as [longxinH/xhprof](https://github.com/longxinH/xhprof),\
    \ we have it in our Jazzon library you can check the Dockerfile:16-23 and php-ini-local.ini:20-22\
    \ in the jazzon-lib-classes-implmentations folder.\n\nOur Jazzon consists of standalone\
    \ classes that users of the library can import when they need to. If we need to\
    \ profile it as functions/tests we need to analyze each function individually.\
    \ For that, we need to have for each function the following code:\n\n<?php  \n\
    \n// Start XHProf profiling  \n\nxhprof\\_enable();  \n\n// ... the function logic\
    \ here ....  \n\n// Stop XHProf profiling  \n\n$xhprof\\_data \\= xhprof\\_disable();\
    \  \n\n// Define the output directory (same as in your php.ini file)  \n\n$outputDir\
    \ \\= '/var/www/jazzon/xhprof\\_data';  \n\n// Ensure the directory exists  \n\
    \nif (!file\\_exists($outputDir) && !is\\_dir($outputDir)) {  \n\n    if (!mkdir($outputDir,\
    \ 0777, true) && !is\\_dir($outputDir)) {  \n\n        throw new \\\\RuntimeException(sprintf('Directory\
    \ \"%s\" was not created', $outputDir));  \n\n    }  \n\n}  \n\n// Generate a\
    \ unique file name  \n\n$profilingFile \\= $outputDir . '/profile\\_' . uniqid('',\
    \ true) . '.xhprof';  \n\n// Save the profiling data  \n\nfile\\_put\\_contents($profilingFile,\
    \ serialize($xhprof\\_data));\n\nRunning the test cases for the function that\
    \ has this profiling code should result in the following directory/file that has\
    \ the analysis data.\n\n![](image_rsrc3CT.jpg)\n\nXHProf analysis file\n\nTo be\
    \ able to visualize that data you need to use another GUI tool to show that, a\
    \ tool such as [XHProf Viewer](https://github.com/sugarcrm/xhprof-viewer) or [xhgui](https://github.com/perftools/xhgui).\n\
    \nWhen it comes to PHP debugging, the tools and techniques we have covered in\
    \ this lesson are just the tip of the iceberg. There are many more, and each instrument\
    \ or technique has advantages and disadvantages. Understanding these tools, practicing\
    \ with them, and incorporating them into your development workflow is the greatest\
    \ approach to becoming proficient in debugging.\n\n{quote} Remember good debugging\
    \ entails more than just bug fixes. It is also about figuring out why the bug\
    \ happened and how to avoid similar problems in the future.\n\n## Debugging PHP\
    \ Libraries\n\nDebugging in PHP libraries requires knowledge of the architecture\
    \ of a library and how all its components work together.\n\n### Understand the\
    \ architecture of the library\n\nTo start debugging PHP libraries, one should\
    \ understand on a deeper level how an architecture works. The code in libraries\
    \ is divided into different files and folders with each folder having a distinct\
    \ component. These components do certain functionality that help identify even\
    \ potential loopholes when debugging.\n\nUsing our Jazzon library as an example,\
    \ it works like any other normal library where code is spread across several classes\
    \ (JsonEncoder, JsonParser, JsonValidator, and DecodedValue). Understanding how\
    \ these classes work would bring out loopholes much faster.\n\nYou can see the\
    \ relation between the Jazzon library components in the following diagram:\n\n\
    ![](image_rsrc3CM.jpg)\n\nComponent relationship in Jazzon library\n\n### Error\
    \ reporting level\n\nSometimes PHP libraries can include a lot of code, and your\
    \ PHP settings’ level of error reporting might hide some important issues. Make\
    \ sure your level of error reporting is set to display all errors, warnings, and\
    \ notices that occur. This is done by including the following line: error\\_reportin(E\\\
    _ALL); at the top of your script or in the php.ini file.\n\n### Use debugging\
    \ tools\n\nNo doubt, debugging tools are essential equipment in any developer’s\
    \ toolkit, especially while working with complex languages such as PHP. Among\
    \ the most widely used debugging tools for PHP is Xdebug. It provides numerous\
    \ features that help not only to debug but also enhance and streamline the development\
    \ workflow.\n\nXdebug enables developers to set breakpoints. This allows a developer\
    \ to halt script execution at some point to evaluate the values of variables,\
    \ control flow and also understand what the application is doing at that particular\
    \ time. Stack traces also offer line-by-line information about the call hierarchy\
    \ of which function or method was called from where indicating an insight into\
    \ lower levels of behavior by an application. The real-time variable watch helps\
    \ developers track how values change so that they can see whether data is being\
    \ processed as it should be since changes in manipulated data sources are monitored.\n\
    \nIn addition, debugging tools like Xdebug also offer profiling functionalities.\
    \ Profiling helps in identifying the bottlenecks inside the code so that the application\
    \ runs smoothly and utilizes resources such as memory and CPU time optimally.\
    \ Through IDE integration of Xdebug, developers can exploit a graphical interface\
    \ to make their debugging experience more user-friendly and interactive.\n\n###\
    \ Step-by-step debugging"
