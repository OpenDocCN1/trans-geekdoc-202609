    \  \n\n        public function removeUser($user) {  \n\n            // Code to\
    \ remove user goes here.  \n\n        }  \n\n    }  \n\n    // The UserManager\
    \ class does not handle other responsibilities   \n\n    // like managing products\
    \ or orders.\n\n*   Use dependency injection over inheritance (when possible)\
    \ to ensure that a class is not tightly coupled to other classes. We can say these\
    \ in different words and more accurately which use composition over inheritance\\\
    *\\*.\n\n    <?php  \n\n    interface Logger {  \n\n        public function log($message);\
    \  \n\n    }  \n\n    // A File-based Logger.  \n\n    class FileLogger implements\
    \ Logger {  \n\n        public function log($message) {  \n\n            echo\
