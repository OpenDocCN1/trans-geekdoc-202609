    \  \n\n    // 测试 getData 方法返回正确的数据。  \n    public function testGetData(): void\
    \  \n    {  \n        // 断言返回的数据匹配预期的数组。  \n        $this->assertSame(['key' =>\
    \ 'value'], $this->decodedValue->getData());  \n    }  \n\n    // 测试 getDataAsArray\
    \ 方法以数组形式返回正确的数据。  \n    public function testGetDataAsArrayReturnsDataAsArray():\
    \ void  \n    {  \n        // 断言返回的数组匹配预期的数组。  \n        $this->assertSame(['key'\
    \ => 'value'], $this->decodedValue->getDataAsArray());  \n    }  \n\n    // 测试\
    \ getDataAsObject 方法以对象形式返回正确的数据。  \n    public function testGetDataAsObjectReturnsDataAsObject():\
    \ void  \n    {  \n        // 断言返回的对象匹配预期的对象。  \n        $this->assertEquals((object)['key'\
