    \ 创建一个包装了 FileLogger 的 DatabaseLoggerDecorator 实例。  \n\n$logger = new DatabaseLoggerDecorator(new\
    \ FileLogger());  \n\n// 使用 logger 记录一条消息。  \n\n$logger->log('Hello, world!');\n\
    ```\n\n## 策略模式 (Strategy)\n\n这种模式允许你定义一组算法，将每一个算法封装成对象，并使它们可以相互替换。当你想要在运行时切换算法，或者根据某些条件更改算法的行为时，这种模式非常有用。示例：\n\
    - Symfony 的 `HTTPKernal` 用于处理 HTTP 请求。\n- Laravel `Eloquent` 用于数据库访问。\n\n一个展示策略模式运行的示例：\n\
    \n```php\n<?php  \n\n// 定义一个排序策略的接口。  \n\ninterface SortStrategy {  \n\n    public\
    \ function sort($array);  \n\n}  \n\n// 实现升序排序策略。  \n\nclass AscendingSort implements\
    \ SortStrategy {  \n\n    public function sort($array) {  \n\n        sort($array);\
    \  // 使用 PHP 内置的 sort 函数。  \n\n        return $array;  \n\n    }  \n\n}  \n\n\
    // 实现降序排序策略。  \n\nclass DescendingSort implements SortStrategy {  \n\n    public\
    \ function sort($array) {  \n\n        rsort($array);  // 使用 PHP 内置的反 sort sort\
    \ 函数。  \n\n        return $array;  \n\n    }  \n}  \n\n// 定义一个使用排序策略的上下文类。  \n\
    \nclass Context {  \n\n    private $sortStrategy;  // 持有排序策略实例。  \n\n    // 构造函数需要一个排序策略实例。\
    \  \n\n    public function __construct(SortStrategy $sortStrategy) {  \n\n   \
    \     $this->sortStrategy = $sortStrategy;  \n\n    }  \n\n    // 使用提供的策略执行排序。\
    \  \n\n    public function executeStrategy($array) {  \n\n        return $this->sortStrategy->sort($array);\
    \  \n\n    }  \n}  \n\n// 使用上下文按升序排序一个数组。  \n\n$context = new Context(new AscendingSort());\
    \  \n\n$result = $context->executeStrategy([3, 1, 2]);  \n\nprint_r($result);\n\
    ```\n\n## 观察者模式 (Observer)\n\n这主要用于事件驱动编程，允许对象接收其他对象的更改通知。它通常出现在处理用户输入或需要与外部系统交互的库中。当你想要解耦对象并确保对一个对象的更改不会对其他对象产生影响时，这种模式非常有用。示例：\n\
    - Symfony 的 `EventDispatcher` 允许向注册的监听器轻松创建并分发事件。\n- Laravel `Eloquent` 在模型事件中使用了这种模式。\n\
    \n一个展示观察者模式运行的示例：\n\n```php\n<?php  \n\n// 定义一个 Event 类，用于维护观察者并对其发送通知。  \n\n\
    class Event {  \n\n    private $observers = [];  // 用于存储观察者实例的数组。  \n\n    //\
    \ 将观察者实例添加到列表。  \n\n    public function addObserver($observer) {  \n\n       \
    \ $this->observers[] = $observer;  \n\n    }  \n\n    // 向所有观察者分发消息。  \n\n   \
    \ public function notify($message) {  \n\n        foreach ($this->observers as\
    \ $observer) {  \n\n            $observer->update($message);  \n\n        }  \n\
    \    }  \n}  \n\n// 定义一个接收并处理消息的 Observer 类。  \n\nclass Observer {  \n\n    private\
    \ $name;  // 观察者的名称。  \n\n    // 构造函数初始化观察者名称。  \n\n    public function __construct($name)\
    \ {  \n\n        $this->name = $name;  \n\n    }  \n\n    // 模拟接收消息的更新方法。  \n\n\
    \    public function update($message) {  \n\n        echo \"Observer $this->name\
    \ received: $message\\n\"; \n\n    }  \n}    \n\n// 创建一个事件并添加观察者。  \n\n$event\
    \ = new Event();  \n\n$event->addObserver(new Observer('A'));  \n\n$event->addObserver(new\
    \ Observer('B'));  \n\n// 向所有观察者分发消息。  \n\n$event->notify('Event occurred!');\n\
    ```\n\n"
- fmt: "\n```php\nprotected function setUp(): void {\n    // Initializing the `$calculator`\
    \ property with a new instance of the `Calculator` class.\n    $this->calculator\
    \ = new Calculator();\n}\n\n// Defining a test named `testAdd`. By convention,\
    \ test method names should start with \"test\".\npublic function testAdd() {\n\
    \    // Calling the `add` method from the `$calculator` instance with arguments\
    \ 2 and 3, and storing the result.\n    $result = $this->calculator->add(2, 3);\n\
    \    // Using an assertion to check if the result of the addition is 5.\n    //\
    \ If it's not 5, the test will fail.\n    $this->assertEquals(5, $result);\n}\n\
    ```\n\nBy following good testability practices:\n\n- The `Calculator` class is\
    \ a breeze to be tested, as it has been designed simply and without hidden dependencies\
    \ or side effects.\n- We have tests written (`CalculatorTest`) that guarantee\
    \ the `Calculator` class will behave as intended.\n\n### Don’t repeat yourself\
    \ (DRY)\n\nWe discussed the benefits of PHP libraries and one of those benefits\
    \ was code reusability. This is what this design principle is all about, it makes\
    \ sure we don’t write redundant code.\n\n![](image_rsrc3CE.jpg)\n\nA Flowchart\
    \ implementing DRY Principle in PHP library development\n\nConsider a situation\
    \ when you have functions that compute the area for different geometrical shapes.\n\
    \nThe following script has functions to compute areas for triangles, rectangles,\
    \ and squares as separate entities. Each shape function is implemented separately\
    \ and invoked with some values.\n\nLet’s look at the following basic geometry\
    \ functions that don’t adhere to the DRY principle;\n\n```php\n<?php\n// Here,\
    \ we're defining a new function named \"triangleArea\".\n// This function calculates\
    \ and returns the area of a triangle.\nfunction triangleArea($base, $height) {\n\
    \    // This line calculates the area of a triangle using the formula (base *\
    \ height) / 2.\n    // It then returns the computed area.\n    return 0.5 * $base\
    \ * $height;\n}\n\n// Here, we're defining a new function named \"rectangleArea\"\
    .\n// This function calculates and returns the area of a rectangle.\nfunction\
    \ rectangleArea($width, $height) {\n    // This line calculates the area of a\
    \ rectangle using the formula width * height.\n    // It then returns the computed\
    \ area.\n    return $width * $height;\n}\n\n// Here, we're defining a new function\
    \ named \"squareArea\".\n// This function calculates and returns the area of a\
    \ square.\nfunction squareArea($side) {\n    // This line calculates the area\
    \ of a square using the formula side * side (or side^2).\n    // It then returns\
    \ the computed area.\n    return $side * $side;\n}\n\n// Calculate and print the\
    \ area of a triangle.\ntriangleArea(5, 10);\n// Calculate and print the area of\
    \ a rectangle.\nrectangleArea(5, 20);\n// Calculate and print the area of a square.\n\
    squareArea(5);\n```\n\nNow, let’s say in all these functions, besides computing\
    \ the area, you also want to log it. If we proceed to add the logging code straight\
    \ inside each function, then it will repeat itself, and the code will look like\
    \ the following;\n\n```php\n<?php\n// Function to calculate and return the area\
    \ of a triangle.\nfunction triangleArea($base, $height) {\n    $area = 0.5 * $base\
    \ * $height;  // Calculates the area of the triangle.\n    echo \"Calculated area:\
    \ \" . $area . PHP_EOL;  // Prints the calculated area.\n    return $area;  //\
    \ Returns the calculated area.\n}\n\n// Function to calculate and return the area\
    \ of a rectangle.\nfunction rectangleArea($width, $height) {\n    $area = $width\
    \ * $height;  // Calculates the area of the rectangle.\n    echo \"Calculated\
    \ area: \" . $area . PHP_EOL;  // Prints the calculated area.\n    return $area;\
    \  // Returns the calculated area.\n}\n\n// Function to calculate and return the\
    \ area of a square.\nfunction squareArea($side) {\n    $area = $side * $side;\
    \ // Calculates the area of the square.\n    echo \"Calculated area: \" . $area\
    \ . PHP_EOL; // Prints the calculated area.\n    return $area; // Returns the\
    \ calculated area.\n}\n```\n\nWait, let's re-examine the logic. The provided text\
    \ contains several repetitive blocks of code and comments explaining DRY. I will\
    \ consolidate the core logic while maintaining the requested formatting.\n\nNow,\
    \ let’s say in all these functions, besides computing the area, you also want\
    \ to log it. If we proceed to add the logging code straight inside each function,\
    \ then it will repeat itself...\n\nThe provided text then lists multiple versions\
    \ of the same logic. Based on the instructions, I will structure the output clearly.\n\
    \n### Simplicity\n\nWe’ve discussed before that we need to keep our library as\
    \ easy as possible to maintain, and also the code is easy to read and understand\
    \ by other developers, therefore we need to make sure the code should be written\
    \ simply. Over-complicating the code complicates the testing, debugging, and library\
    \ maintenance.\n\nSome attributes of simple and clear code are:\n- Formatted code.\n\
    - Decoupled code.\n- Descriptive variables, classes, object names.\n- Short and\
    \ clear functions and classes.\n\nCheck this non-descriptive code:\n\n```php\n\
    <?php\n// Function that queries the database to fetch information based on a given\
    \ ID.\nfunction f($db, $i) {\n    $q = $db->prepare(\"SELECT * FROM t WHERE id\
    \ = ?\"); // Prepares a SQL statement, where the \"?\" is a placeholder that will\
    \ be bound.\n    $q->execute([$i]); // Executes the prepared statement, replacing\
    \ the \"?\" placeholder with the value of i.\n    $r = $q->fetch(); // Fetches\
    \ the next row from the result set.\n    echo $r['n'] . \" - \" . $r['e']; //\
    \ Displays the 'n' and 'e' fields from the fetched row.\n}\n\n// Call the function.\n\
    // Assuming $database is a PDO instance and the ID you want to fetch is 1.\n//\
    \ f($database, 1);\n```\n\nLet us make it more verbose and clear:\n\n```php\n\
    <?php\n// Function that queries the database to fetch and display a user's name\
    \ and email based on a given user ID.\nfunction fetchAndDisplayUser($database,\
    \ $userId) {\n    $query = $database->prepare(\"SELECT * FROM users WHERE id =\
    \ ?\"); // Prepares a SQL statement, where the \"?\" is a placeholder that will\
    \ be bound.\n    $query->execute([$userId]); // Executes the prepared statement,\
    \ replacing the \"?\" placeholder with the value of $userId.\n    $result = $query->fetch();\
    \ // Fetches the next row from the result set.\n}\n```\n"
