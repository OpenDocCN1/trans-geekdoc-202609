    ## 研究背景


    ### 本研究之前的证据


    我们使用以下检索词在PubMed中进行了检索：“(machine learning OR artificial intelligence OR deep learning)
    AND (radiation oncology OR radiotherapy)”。我们重点关注2014年1月1日至2020年4月1日期间使用医学影像的英文文章。我们的检索确定了183篇文章。在同一次检索中，我们还确定了通过临床部署和测试人工智能（AI）工具进行最终用户验证的研究，无论是回顾性还是前瞻性。尽管深度学习在医学影像中的应用显示出巨大前景，但大多数研究仍处于概念验证阶段，通常在小队列中进行验证，且没有外部验证。此外，大多数研究仅限于计算机模拟测试，只有少数研究调查了模型在临床环境中的性能。关于真实世界临床实用性的证据不足，最终导致对开展前瞻性临床试验以临床评估模型的信心不足。


    ### 本研究的附加价值


    在本研究中，我们开发了一种多方面的深度学习模型临床验证策略，旨在弥合早期计算机模拟验证与大规模前瞻性临床试验之间的转化差距。该策略包括四个组成部分：(1)
    制定临床基准以了解当前的标准治疗；(2) 在大型外部队列中进行初步验证，以了解模型的泛化情况；(3) 功能验证，以研究模型对下游临床终点的影响；(4) 在模拟临床环境中进行最终用户测试，以评估模型在部署状态下的表现。虽然AI模型的计算机模拟验证可能提供临床实用性的证据，但通常需要在部署环境中衡量性能。我们的工作强调了同时进行这两种验证模式的价值，并为它们之间出现分歧的情况提供了见解，揭示了一些潜在问题，如评估指标的选择。


    ### 所有现有证据的启示


    我们的研究结果强调了更广泛采用类似验证策略的重要性，这些策略有助于弥合临床AI应用的转化差距。此类策略可能提供在医学中开展临床AI试验所需的高度信心，揭示模型弱点，并量化将AI输出提升到临床可接受水平所需的时间和精力。我们的结果还强调了在人类因素方面生成数据的重要性，因为我们对此领域理解不完整，同时还需要研究医生与AI输出的交互及其总体满意度。


