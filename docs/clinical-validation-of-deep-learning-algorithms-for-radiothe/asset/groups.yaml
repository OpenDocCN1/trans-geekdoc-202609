    ## 图4：最终用户测试的结果


    (A) 临床试验分割与从头分割、专家辅助（提供临床分割）和AI辅助（提供AI生成分割）分割之间的体积Dice分数。(B) 在最终用户测试期间向专家提出的定性问题的答案。(C)
    完成分割任务所需的时间。AI=人工智能。


    为了评估使用AI生成的分割所导致的辐射剂量变化，我们进行了剂量学分析（附录pp 45–46）。我们发现临床计划靶区体积与AI计划靶区体积在两个常见剂量指标上差异不显著：V95（p=0·37）和D95（p=0·47；附录p
    47）。


    使用RIDER^24（附录p 48）评估了同一患者两次独立CT扫描的模型稳定性。第一次扫描中AI与放射科医师的差异与第二次扫描中的相同比较无显著差异（VD，p=0·25；SD，p=0·29；附录p
    49）。放射科医师在两次扫描中的总肿瘤体积与AI模型的总肿瘤体积无显著差异（p=0·19；附录p 50）。在模型稳定性随种子点放置位置变化方面，中位预测表现出高稳定性，VD和SD的IQR均为0·02（附录p
    51）。关于跨CT时间帧的稳定性，我们发现3D和4D CT数据之间无显著差异（VD，辅助模型p=0·14，自动模型p=0·33；附录pp 36–38）。


    模型准确性是在含有已知体积结节^25的胸部模体CT上测量的（附录p 52）。平均而言，模型低估了结节体积0·4 cm³，即已知体积的12%。三个已发表的模型在相同数据^26上也显示出类似趋势（附录p
    53）。模型还被发现在对比增强图像上显著表现更佳（VD p=0·042；SD p=0·0043；附录p 66）。


    最后，通过专家评审检查了模型失败模式。这些包括遗漏了发现数据中原本采样不足的胸部淋巴结站（例如锁骨上淋巴结；附录p 67）、过度分割到心包和塌陷肺，以及容易受到膈肌周围运动伪影的影响（图3A）。


    八位专家被要求从头执行分割任务，或对提供的分割进行评分和编辑


    从基准测试开始，我们的结果强调了模型在识别具有大观察者间变异的挑战性病例方面的能力。虽然我们显示住院医师和主治医师之间的表现没有差异，但仍需进一步研究经验对人机交互的影响，以及这类模型在增强医师培训方面的潜力。


    我们的分层验证过程从最接近训练数据的单专家内部测试数据（Harvard-RT1）开始。我们报告了在相同数据上测试的45种不同模型与先前发表结果相比的显著改进。¹⁶
    在后续日益外部的数据集上相对稳定的背景下，多专家内部测试数据（Harvard-RT2）上的性能下降表明，分割变异性可能是治疗医师偏好和经验的函数。来自4D
    CT数据的结果暗示了模型与现代影像实践的相关性。来自诊断数据集的结果突出了放射科医师（解剖学知识）和放射肿瘤科医师（治疗目标）之间在肿瘤定义上的已知差异（附录pp
    42, 60）。这些发现引发了对AI标签外使用的进一步讨论，即在一个专业领域内开发的应用被部署到另一个领域，同时强调了放射科医师在放射治疗计划中输入的重要性。²⁸


    我们的功能验证和最终用户测试强调了超越常见几何测量来评估分割的重要性。与先前研究类似，²⁹ 我们的剂量学分析显示几何测量与剂量学测量之间没有相关性。这种关系可能受到影响剂量学测量的因素的干扰，包括剂量分布、放射治疗技术、射野布置和其他患者特定考虑因素。此外，我们还发现几何测量可能无法准确反映时间节省和其他定性终点（图5A）。我们的结果还突出了常见指标与肿瘤体积之间的不良相关性（图5B；附录p
    13）。因此，迫切需要结合定性医师评估与几何、剂量学和时间相关测量的新指标，以准确反映临床实用性和可接受性。³⁰


    模型失败模式可以通过警告自动检测，提示模型输出可能受影响，从而为自动化系统带来急需的信任。³¹ 在肿瘤定位失败方面，我们的自动模型在6%的验证案例中失败，这与类似肺癌诊断环境中的假阳性率一致。³²
    尽管这些失败需要回退到辅助模型，未来的迭代版本可能通过从其他来源（如临床记录）自动提取粗略的解剖肿瘤位置来增强，以确保准确的模型定位。最后，成像对比度对模型性能的确切影响仍不清楚，因为我们的模型在对比增强图像上显著表现更佳，尽管主要是在非对比数据上训练的（附录p
    65）。


    有几个局限性需要注意。我们的计算机模拟和最终用户测试都受其回顾性性质的限制。我们的许多发现数据依赖于单一人类专家。尽管这种方法使我们能够突出模型封装特定专家技能的能力，并将其作为决策支持与其他临床医生共享，但我们的模型可能获得了自然偏差。我们的放射科医师与放射肿瘤科医师的比较依赖于AI生成的分割，这可能并不能完全代表放射治疗分割。我们的剂量学分析可能并不总是反映临床现实，因为这种分析不允许手动编辑大体肿瘤体积与计划靶体积之间的中间体积，即临床靶体积。Lung-PET-CT-Dx的结果是在肿瘤边界框上计算的，因此应相应地进行解读。我们最终用户测试的设计不允许研究AI对观察者内变异性的影响，也没有纳入PET成像，而PET成像常用于非小细胞肺癌患者的放射治疗计划。最后，尽管对专家掩盖所提供分割的来源提高了AI模型评估的公平性，但这种设计没有测试人类对临床AI算法的偏见。


    未来的方向包括通过实验各种模型类型、架构、集成方法、多专家分割池化、外部基准验证和前瞻性测试来改进分割性能——无论是在计算机模拟还是临床上。为了能够分别报告淋巴结的分割结果，需要改进的数据管理策略，以明确地将淋巴结从合并的大体肿瘤体积分割中分离出来。


    在临床环境中对AI工具进行早期和彻底的测试对于成功转化为临床实践至关重要。我们的四部分验证策略能够揭示在临床中实施AI模型的下游后果，这些后果在典型的计算机模拟验证中可能被忽视。我们鼓励更广泛地采用类似的验证策略，以帮助弥合临床AI应用的转化差距。


