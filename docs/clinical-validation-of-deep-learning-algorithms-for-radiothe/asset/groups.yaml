    ## 引言


    肺癌是全球癌症相关死亡的主要原因。¹ 非小细胞肺癌（NSCLC）是最常见的肺癌类型，占所有诊断的85%。² 放射治疗在NSCLC的治疗中发挥关键作用，五分之一的早期患者和一半的晚期患者接受这种治疗方式。³
    放射治疗可作为一种单独治疗，与全身药物联合使用，可在手术前或手术后进行，并在姑息治疗中发挥作用。


    放射治疗的时间效益和成本效益受到一项昂贵的前期投入的影响：放射治疗计划。放射治疗计划对于最大化对癌症组织的辐射和最小化对正常组织的辐射至关重要。在图像采集之后，计划步骤包括图像配准、靶区和邻近器官的分割，以及剂量分布。手动分割靶区——即原发性肿瘤和受累淋巴结——是放射肿瘤学家完成的最耗时的计划任务之一。⁴
    这项细致的工作需要在体素基础上解读图像以勾画靶区体积。调强放射治疗和图像引导等先进放射治疗计划和实施技术的出现，使得对周围器官的剂量更小，但需要高精度的分割。⁵
    此外，靶区分割存在大量且文献充分记载的观察者间变异性，⁶,⁷ 即使在具有预设参数的放射治疗临床试验中也是如此。⁸ 最后，靶区分割的准确性可直接影响患者结局，分割不足会降低肿瘤控制率，分割过度会增加毒性风险。⁹


    已经提出了几种计算机辅助工具来帮助简化放射治疗计划。⁴ 对于分割任务，半自动化方法，包括分割图谱，在临床上具有不同程度的实用性。¹⁰ 构建图谱需要医生投入大量的时间和精力，而且图谱内容的异质性可能会降低性能。最近，人工智能（AI）方法——特别是深度学习——已被提出作为有前途的替代方案。¹¹
    深度学习算法可以自动从数据中学习特征表示，从而提高多种任务的性能。¹² 尽管研究已经探索了使用深度学习来自动化放射治疗靶区分割并提高其准确性和一致性，¹³
    但大多数仍处于概念验证阶段。因此，这些研究通常局限于小型内部队列的计算机模拟验证，没有外部验证。在众多有希望的结果中，只有少数研究显示了这些自动化系统的临床影响。¹⁴,¹⁵


    在本研究中，我们提出了一种可推广的治疗性AI算法临床验证策略，旨在弥合早期概念验证研究与前瞻性临床试验之间的差距。该策略包括四个主要组成部分：基准测试、初步验证、功能验证和最终用户测试（图1）。为了展示该策略的应用，我们开展了一项针对NSCLC放射治疗靶区勾画的深度学习模型临床验证研究。


    Lancet Digit Health 2022; 4: e657-66

