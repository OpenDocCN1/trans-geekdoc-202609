    # Research in context


    # Evidence before this study


    We searched PubMed using the following search terms: “(machine learning OR artificial
    intelligence OR deep learning) AND (radiation oncology OR radiotherapy)”. We focused
    on articles in English using medical imaging from Jan 1, 2014, to April 1, 2020.
    Our search identified 183 articles. Within the same search, we also identified
    studies that did end-user validation by deploying and testing artificial intelligence
    (AI) tools clinically, whether retrospectively or prospectively. Although deep
    learning applications in medical imaging have shown great promise, most studies
    remain at the proof-of-concept stage, often validated in small cohorts and without
    external validation. Additionally, most are confined to in silico testing, with
    only a few investigating model performance in clinical settings. This insufficient
    evidence on real-world clinical utility ultimately translates to poor confidence
    in pursuing prospective clinical trials to clinically assess models.


    # Added value of this study


    In this study, we developed a multifaceted strategy for the clinical validation
    of deep learning models, aimed at closing the translational gap that falls in
    between early in silico validation and larger-scale prospective clinical trials.
    The strategy comprises four components: (1) developing clinical benchmarks


    to understand the current standard of care; (2) primary validation in large external
    cohorts to understand the models’ generalisability profile; (3) functional validation
    to study the models’ effect on downstream clinical endpoints; and (4) end-user
    testing in simulated clinical settings to assess models in their deployed state.
    Although in silico validation of AI models might provide evidence of clinical
    utility, measuring performance within the deployment context is often needed.
    Our work underscores the value of performing both these validation modes and provides
    insight into instances where disagreements between them occur, shedding light
    on potential issues such as the choice of evaluation metrics.


    # Implications of all the available evidence


    Our findings highlight the importance of broader adoption of similar validation
    strategies that help close the translational gap for clinical AI applications.
    Such strategies might provide the high levels of confidence needed to pursue clinical
    AI trials in medicine, uncover model weaknesses, and quantify the time and effort
    needed to bring AI outputs to clinically acceptable levels. Our results also underscore
    the importance of generating data on human factors given our incomplete understanding
    of this area, together with studying physicians’ interactions with AI outputs
    and their overall satisfaction.


