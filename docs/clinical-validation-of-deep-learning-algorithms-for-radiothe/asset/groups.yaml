    ## 深度学习算法用于非小细胞肺癌放射治疗靶区勾画的临床验证：一项观察性研究


    Ahmed Hosny, Danielle S Bitterman, Christian V Guthier, Jack M Qian, Hannah Roberts,
    Subha Perni, Anurag Saraf, Luke C Peng, Itai Pashtan, Zezhong Ye, Benjamin H Kann,
    David E Kozono, David Christiani, Paul J Catalano, Hugo J W L Aerts*, Raymond
    H Mak*


    ## 摘要


    **背景** 人工智能（AI）和深度学习在简化临床任务方面显示出巨大潜力。然而，大多数研究仍局限于小型内部队列的计算机模拟验证，没有外部验证或真实世界临床实用性的数据。我们开发了一种深度学习模型临床验证策略，用于分割CT图像中的原发性非小细胞肺癌（NSCLC）肿瘤和受累淋巴结，这是放射治疗计划中一个耗时且专家间差异较大的步骤。


    **方法** 在这项观察性研究中，CT图像和分割数据收集自美国、荷兰、加拿大和中国的八个内部和外部来源，其中来自Maastro和Harvard-RT1数据集的患者用于模型发现（由单一专家分割）。验证包括观察者间和观察者内基准测试、初步验证、功能验证和最终用户测试，使用的数据集如下：multi-delineation、Harvard-RT1、Harvard-RT2、RTOG-0617、NSCLC-radiogenomics、Lung-PET-CT-Dx、RIDER和thorax
    phantom。初步验证包括在外部程度递增的数据集上进行逐步测试，使用重叠度量包括体积Dice（VD）和表面Dice（SD）。功能验证探讨了剂量学效应、模型失败模式、重测稳定性和准确性。最终用户测试由八位专家在模拟临床环境中评估自动分割。


    **结果** 我们纳入了2001年至2015年期间接受影像检查的2208名患者，其中787名患者用于模型发现，1421名用于模型验证，包括28名患者用于最终用户测试。模型表现优于观察者间基准（multi-delineation数据集；VD
    0·91 [IQR 0·83–0·92]，p=0·0062；SD 0·86 [0·71–0·91]，p=0·0005），并在观察者内基准范围内。对于初步验证，AI在内部Harvard-RT1数据（由分割发现数据的同一专家分割）上的表现为VD
    0·83（IQR 0·76–0·88）和SD 0·79（0·68–0·88），在观察者间基准范围内。在由其他专家分割的内部Harvard-RT2数据上的表现为VD
    0·70（0·56–0·80）和SD 0·50（0·34–0·71）。在RTOG-0617临床试验数据上的表现为VD 0·71（0·60–0·81）和SD
    0·47（0·35–0·59），在诊断性放射学数据集NSCLC-radiogenomics和Lung-PET-CT-Dx上结果相似。尽管这些几何重叠结果如此，模型产生的靶区体积在辐射剂量覆盖方面与专家相当。我们还发现，专家独立分割与AI辅助分割之间没有显著差异。AI辅助使分割时间缩短了65%（5·4分钟；p<0·0001），观察者间变异性（SD）降低了32%（p=0·013）。


    **解读** 我们提出了一种AI模型的临床验证策略。我们发现，计算机模拟的几何分割指标可能无法与模型的临床实用性相关联。专家的分割风格和偏好可能会影响模型性能。


