    # Introduction


    Lung cancer is the leading cause of cancer-related mortalities worldwide.¹ Non-small-cell
    lung cancer (NSCLC) is the most common type of lung cancer, accounting for 85%
    of all diagnoses.² Radiotherapy plays a key role in treating NSCLC, with one fifth
    of early-stage and half of late-stage patients receiving this treatment modality.³
    Radiotherapy can be administered as a sole treatment, with systemic agents, precede
    or follow surgery, and play a role in palliation.


    Radiotherapy’s time-effectiveness and cost-effectiveness is affected by an expensive
    upfront investment: radiotherapy planning. Radiotherapy planning is crucial in
    maximising radiation to cancer tissue and minimising radiation to normal tissue.
    After image acquisition, planning steps include image registration, target and


