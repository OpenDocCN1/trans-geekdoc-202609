- pgno: 1
  md: '# Research in context


    # Evidence before this study


    We searched PubMed using the following search terms: “(machine learning OR artificial
    intelligence OR deep learning) AND (radiation oncology OR radiotherapy)”. We focused
    on articles in English using medical imaging from Jan 1, 2014, to April 1, 2020.
    Our search identified 183 articles. Within the same search, we also identified
    studies that did end-user validation by deploying and testing artificial intelligence
    (AI) tools clinically, whether retrospectively or prospectively. Although deep
    learning applications in medical imaging have shown great promise, most studies
    remain at the proof-of-concept stage, often validated in small cohorts and without
    external validation. Additionally, most are confined to in silico testing, with
    only a few investigating model performance in clinical settings. This insufficient
    evidence on real-world clinical utility ultimately translates to poor confidence
    in pursuing prospective clinical trials to clinically assess models.


    # Added value of this study


    In this study, we developed a multifaceted strategy for the clinical validation
    of deep learning models, aimed at closing the translational gap that falls in
    between early in silico validation and larger-scale prospective clinical trials.
    The strategy comprises four components: (1) developing clinical benchmarks


    to understand the current standard of care; (2) primary validation in large external
    cohorts to understand the models’ generalisability profile; (3) functional validation
    to study the models’ effect on downstream clinical endpoints; and (4) end-user
    testing in simulated clinical settings to assess models in their deployed state.
    Although in silico validation of AI models might provide evidence of clinical
    utility, measuring performance within the deployment context is often needed.
    Our work underscores the value of performing both these validation modes and provides
    insight into instances where disagreements between them occur, shedding light
    on potential issues such as the choice of evaluation metrics.


    # Implications of all the available evidence


    Our findings highlight the importance of broader adoption of similar validation
    strategies that help close the translational gap for clinical AI applications.
    Such strategies might provide the high levels of confidence needed to pursue clinical
    AI trials in medicine, uncover model weaknesses, and quantify the time and effort
    needed to bring AI outputs to clinically acceptable levels. Our results also underscore
    the importance of generating data on human factors given our incomplete understanding
    of this area, together with studying physicians’ interactions with AI outputs
    and their overall satisfaction.


    adjacent organ segmentation, and dose distribution. The manual segmentation of
    the target—ie, primary tumour and involved lymph nodes—is one of the most time-consuming
    planning tasks done by radiation oncologists.⁴ This meticulous task requires interpreting
    images on a voxel-by-voxel basis to delineate the target volume. The advent of
    advanced radiotherapy planning and delivery techniques such as intensity-modulated
    radiotherapy and image guidance have enabled smaller doses to surrounding organs,
    but require high segmentation accuracy.⁵ Additionally, a large and well documented
    interobserver variability exists in target segmentation,⁶,⁷ even in radiotherapy
    clinical trials with prespecified parameters.⁸ Finally, the accuracy of target
    segmentation can directly affect patient outcomes, with under-segmentation decreasing
    tumour control and over-segmentation increasing toxicity risks.⁹


    Several computer-aided tools have been proposed to help streamline radiotherapy
    planning.⁴ For segmentation tasks, semi-automated approaches, including segmentation
    atlases, have had varying degrees of clinical utility.¹⁰ Curating atlases requires
    substantial time and effort on the physician’s part, and the heterogeneity of
    their contents might diminish performance. More recently, artificial intelligence
    (AI) methods—deep learning, specifically—have been proposed as promising alternatives.¹¹
    Deep learning algorithms can automatically learn feature representations from
    data, improving performance across multiple tasks.¹² Although studies have explored
    the use of


    deep learning to automate radiotherapy target segmentation and improve its accuracy
    and consistency,¹³ most remain at the proof-of-concept stage. As such, these studies
    are often confined to in silico validation in small internal cohorts without external
    validation. Among many promising results, only a few efforts show the clinical
    impact of these automated systems.¹⁴,¹⁵


    In this study, we present a generalisable clinical validation strategy for therapeutic
    AI algorithms with the aim of bridging early proof-of-concept studies and prospective
    clinical trials. The strategy comprises four main components: benchmarks, primary
    validation, functional validation, and end-user testing (figure 1). To show the
    application of this strategy, we present a study in clinically validating deep
    learning models for radiotherapy targeting for NSCLC.


    # Methods


    # Discovery data


    We used Maastro and Harvard-RT1 datasets for model development. Maastro included
    422 patients (stages I–IIIB; 290 [69%] male, 132 [31%] female; mean age 68 years
    [range 33–91]) with histologically proven NSCLC and treated with radiotherapy
    alone (n=196 [46%]) or with radiotherapy with chemotherapy (n=226 [54%]). Patients
    were treated at Maastro Clinic, Maastricht, Netherlands, between 2004 and 2010
    (appendix p 16). Harvard-RT1 included 501 patients (stages IA–IV; 263 [52%] male,
    236 [47%] female, 2 [<1%] unspecified;'
