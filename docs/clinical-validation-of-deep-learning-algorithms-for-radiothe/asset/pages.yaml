    model structure closely followed that of original implementation with encoder
    and decoder paths connected via skip connections. Architecture parameters (eg,
    convolution and pooling kernel sizes; appendix p 14) and model hyperparameters
    (eg, learning rate and batch size; appendix pp 6–7) were fine-tuned using nnU-Net
    (version 1.6.5).


    # Data preprocessing


    Data preprocessing involved resampling all data to a common voxel spacing of 1*1*3
    mm³, using linear interpolations for CT images and nearest-neighbour interpolations
    for segmentations. CT Hounsfield units were normalised by clipping to 0·5th and
    99·5th percentiles. Distributions of dataset characteristics, including gross
    tumour volume, CT image slice thickness, and use of intravenous contrast are given
    in the appendix (pp 62, 64–65). Data augmentation details during training are
    also given in the appendix (p 6).


    # Model development


    We used U-Nets, fully convolutional neural networks with CT volume inputs and
    corresponding binary segmentation outputs. Our assisted and automated pipelines
    consisted of four three-dimensional (3D) U-Net models for the localisation and
    segmentation of lungs, primary tumour, and involved lymph nodes (figure 2A, B).
    Overall


    # Metrics


    We used multiple metrics to assess model performance (appendix p 15), including
    VD (spatial overlap of two volumes, with 0 being no overlap and 1 being perfect
    overlap), as well as SD (fraction of surface within a threshold distance from
    another, with 0 being none of the surfaces within tolerance and 1 being entire
    surfaces within tolerance). We used the 75th percentile of interobserver variability
    (1·9 mm) as the threshold (appendix p 25–26).


    # Benchmarks


    We developed the interobserver benchmark using the multi-delineation dataset of
    20 patients (stages IA–IIIB; 12 [60%] male, 8 [40%] female; median age 67 years
    [IQR 57–71]) with histologically confirmed NSCLC referred for radiotherapy at
    Maastro Clinic. Manual tumour delineations were done by five radiation oncologists,
    in addition to R1 (appendix pp 18, 68). Comparisons were drawn between the two
    residents and four attendings involved in the interobserver benchmark. The intraobserver
    benchmark was developed using 21 randomly sampled patients from the Harvard-RT1
    test set. R1 did the segmentation task twice with a 3-month washout period.'
