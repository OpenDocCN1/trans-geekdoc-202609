    # End-user testing


    # Statistical analysis


    We recruited and obtained written informed consent (under protocol DF/HCC 20-328)
    from eight radiation oncologists (DSB, JMQ, HR, SP, AS, LCP, BHK, and RHM) from
    the Department of Radiation Oncology at Brigham and Women’s Hospital. Experts
    had varying degrees of experience: three attendings (1, 2, and 9 years of experience)
    and five residents (appendix pp 9–10). Data used were a random quartile-based
    subset of 28 patients in the RTOG-0617 dataset, further divided into two groups
    of 14 patients each (appendix p 44). In the first group, experts were asked to
    perform the segmentation task de novo. For the second group, experts were asked
    to rate and edit a provided segmentation while masked to its source. In this second
    group, for ten patients, automated segmentations from the assisted pipeline were
    provided (AI assisted). For four patients, clinical segmentations from RTOG-0617
    were provided


    All statistical tests done were non-parametric, with a two-tailed p value of less
    than 0·05 indicating significance. For two dependent groups, we used the Wilcoxon
    matched-pairs signed rank test. For two independent groups, we used the Mann-Whitney
    U rank test. For three or more independent groups, we used the Kruskal-Wallis
    H-test. For measuring correlation between two groups, we used the Spearman rank-order
    correlation coefficient. All analyses were done in python (version 3.8.0).


    # Role of the funding source


    The funders of the study had no role in study design, data collection, data analysis,
    data interpretation, or writing of the report.


    # Results


    Interobserver benchmark was VD 0·83 (IQR 0·77–0·88) and SD 0·72 (0·61–0·81; appendix
    pp 25–26). AI versus R1 yielded VD 0·91 (0·83–0·92) and SD 0·86 (0·71–0·91), a
    significant improvement over the benchmark with VD (p=0·0062) and SD (p=0·0005;
    appendix pp 27–28). Additionally, AI versus R1 was found to be inversely correlated
    with the IQR of variability among all six experts (Spearman’s r=–0·74; p=0·0002;
    appendix p 29). With AI segmentations as reference, non-significant differences
    were detected between residents and attendings (appendix p 30).


    Intraobserver benchmark was VD 0·88 (IQR 0·83–0·90) and SD 0·85 (0·80–0·93; appendix
    p 31). AI versus R1’s first read yielded VD 0·86 (0·83–0·87) and SD 0·79 (0·72–0·90),
    with similar results for the second read (appendix p 33). For VD, non-significant
    differences were observed when both results were compared with the benchmark.
    For SD, AI versus R1’s first read was non-significantly different than the benchmark,
    while AI versus R1’s second read was significantly lower (p=0·043; appendix pp
    32–33).


