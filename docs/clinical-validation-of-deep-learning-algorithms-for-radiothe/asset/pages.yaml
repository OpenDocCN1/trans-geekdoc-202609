  md: 'Starting with benchmarks, our results underscore the model’s ability in identifying
    challenging cases with large interobserver variability. Although we showed no
    difference in performance between residents and attending physicians, further
    work is needed to understand the effect of experience on human–AI interaction
    and the potential of such models to augment physician training.


    Our tiered validation process started with single-expert internal test data (Harvard-RT1)
    that most resembled the training data. We reported a significant improvement over
    previously published results with 45 different models tested on the same data.¹⁶
    The decrease in performance at the multi-expert internal test data (Harvard-RT2)
    in the context of its relative stability on subsequent increasingly external datasets
    suggest that segmentation variability might be a function of treating physician
    preference and experience. Results from 4D CT data imply the models’ relevance
    towards modern imaging practices. Results from the diagnostic datasets highlight
    known differences in tumour definition between radiologists (anatomical knowledge)
    and radiation oncologists (therapeutic goals; appendix pp 42, 60). These findings
    stimulate further discussion around the off-label use of AI, where applications
    developed within one specialty are deployed in another, while emphasising the
    importance of radiologist input in radiotherapy planning.²⁸


    Our functional validation and end-user testing underscore the importance of assessing
    segmentations beyond common geometric measures. Similar to previous studies,²⁹
    our dosimetric analysis showed no correlation between geometric and dosimetric
    measures. This relationship is likely to be confounded by factors affecting dosimetric
    measures including dose distribution, radiotherapy treatment technique, beam arrangement,
    and other patient-specific considerations. Additionally, we also found that geometric
    measures might not accurately reflect time savings and other qualitative endpoints
    (figure 5A). Our results also highlight undesired correlations between common
    metrics and tumour volume (figure 5B; appendix p 13). As such, an unmet need exists
    for new metrics that combine qualitative physician assessment with geometric,
    dosimetric, and time-related measures to accurately reflect clinical utility and
    acceptability.³⁰


    Model failure modes might be automatically detected with warnings that model outputs
    might be compromised, thereby bringing much needed trust into automated systems.³¹
    In terms of tumour localisation failures, our automated models failed in 6% of
    validation cases, in line with false-positive rates in similar lung cancer diagnostic
    settings.³² Although these failures require fallback onto assisted models, future
    iterations might be augmented through the automated extraction of rough anatomic
    tumour location from other sources such as clinical notes to ensure accurate model
    localisation. Finally, the exact effects of imaging contrast on model


    performance remain unclear, as our models significantly over-performed on contrast-enhanced
    images despite being trained primarily on non-contrast data (appendix p 65).


    Several limitations should be noted. Both our in silico and end-user testing are
    limited by their retrospective nature. Many of our discovery data relied on a
    single human expert. Although this method enabled us to highlight the model’s
    ability to encapsulate the skills of a given expert and share it with other clinicians
    as decision support, our models might have acquired a natural bias. Our radiologist
    versus radiation oncologist comparisons relied on AI-generated segmentations,
    which might not be fully representative of radiotherapy segmentations. Our dosimetric
    analysis might not always have reflected clinical reality because such analysis
    does not allow for manually editing the intermediate volume between gross tumour
    volume and planning target volume, namely the clinical target volume. Results
    from Lung-PET-CT-Dx were calculated on tumour bounding boxes, and should therefore
    be interpreted accordingly. The design of our end-user tests did not allow for
    studying AI effects on intraobserver variability, nor did we incorporate PET imaging,
    commonly used in radiotherapy planning for patients with NSCLC. Finally, although
    masking experts to the source of provided segmentations improved the fairness
    of the assessment of the AI model, this design did not test human bias towards
    a clinical AI algorithm.


    Future directions include improving segmentation performance—both in silico and
    clinically—through experimentation with various model types, architectures, ensemble
    approaches, pooling of multi-expert segmentations, validation on external benchmarks,
    and prospective testing. To enable separate reporting of segmentation results
    on lymph nodes, improved data curation strategies are needed to unambiguously
    isolate these from combined gross tumour volume segmentations.


    Early and thorough testing of AI tools in clinical environments is crucial for
    successful translation into clinical practice. Our four-component validation strategy
    allows for uncovering downstream consequences of implementing AI models in the
    clinic, those that might otherwise go unnoticed in typical in silico validation.
    We encourage the broader adoption of similar validation strategies that help close
    the translational gap for clinical AI applications.


