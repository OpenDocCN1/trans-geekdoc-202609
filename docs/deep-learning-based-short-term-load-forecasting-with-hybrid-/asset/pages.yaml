    # ABSTRACT


    +   Keywords:

    Deep learning

    hHybrid feature selection

    Long term load memory

    Power system

    Recurrent neural network


    The reliable and economic operation of the power system rely on an accurate prediction
    of short load. In this paper, a deep learning Based Short Term Memory (LSTM) with
    hybrid feature selection RMR-HFS-LSTM is compared. The objective of this study
    is to reduce the error of load prediction. The RMR-HFS is a combination of filter
    and wrapper feature selection introduced for selecting optimal subset of features.
    The information theory based mutual information filter selection is utilized to
    reduce dimensionality of diversity by finding and eliminating irrelevant features.
    The selected features of feature selection is tested using Recurrent Feature Elimination
    (RFE). The result shows LSTM improves the accuracy and load data using uncertainty
    experiments. The performance of the proposed method is conducted on European weather
    and load data using comparison against Multilayer Perceptron (MLP) and Recursive
    Neural Network (RNN). The results show that the proposed RMR-HFS-LSTM outperforms
    other models.


    # 1. Introduction


    The electricity load forecasting an important research area in the competitive,
    economic business due to an imbalance of electricity power demand and construction.
    Load forecasting is a prime task to provide power in system for making decisions
    on trading market, real time smart dispatch, smart grid automation and control
    [1]. The load forecasting should result in accurate outcome for achieving the
    stable and an efficient function of the power system. The electricity demand is
    highly fluctuating for satisfying electricity demand, so it should be generated
    when a demand for it. If the demand is known in advance, all the operational requirements
    for the generation of electricity may be met. The power system has several objectives,
    to provide the stable and safe power as per requirement at the right time, to
    save the operational cost, to maintain the maintenance cost, and the reliability
    of the power system and balance the power generation with the dynamic changes
    in load [5,2]. Over estimation or


    under estimation leads to complex financial implications to the power system [7].

    The uncertain and volatile nature of the load and the existence of the incomplete,
    non-homogeneous, redundant and irrelevant information in the load data makes it
    difficult to achieve an accurate forecast. Weather information has high impact
    on the load demand. The prediction of load considering the seasonal and weather
    information yield an accurate result [9,10]. The forecasting can be done at an
    hourly, daily, monthly and yearly basis. The load demand correlation with external
    factors such as humidity, temperature, wind speed, pressure, snowfall, cloud and
    the usage of home appliances by the ends [12]. In learning process, good quality
    of input is and only the relevant information is fed as input to the learning
    and prediction process. The feature selection is one of the dimensionality reduction
    technique which selects the relevant features from the list of original features
    based on the statistical characteristics of the features [13]. So, it retains
    the originality of the features.


