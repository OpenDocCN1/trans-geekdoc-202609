    # 3.2.4. Short term memory


    The short term memory is an extension of RNN. It is a special network designed
    to overcome the limitation of RNN it remembers for a long period in time. It effectively
    handles the vanishing and exploding gradient problems of RNN by making the backpropagation
    through time for the updating of the hidden state. Here, it retains the information
    of the sequence by using gates in the cell state. This is achieving the better
    forecasting performance with the time series data. It has a potential to understand
    the sequence dependency and temporal dependency in the non-linear time data of
    LSTM. The LSTM cell is composed of three gates.


