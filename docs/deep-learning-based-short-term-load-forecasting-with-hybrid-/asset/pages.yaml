    # 3. Proposed RMR-HFS-LSTM prediction model


    # 3.1. Significance of R-HFS


    The dataset with uncorrelated, unrelated and non-informative features may increase
    the dimension of dataset in which forces the model to overfit. It also causes
    complications for the forecasting models in generalizing the pattern. The model
    trained with too many features may not produce the accurate and robust results.
    It also observed that redundant features reduce the accuracy. The dataset may
    have many features. They are relevant, highly relevant and redundant features,
    weakly relevant and non-redundant, and strongly relevant features. The irrelevant
    features reduce the accuracy. These features should not be contributing to the
    forecasting accuracy. Instead, of that identifying the overfitting and reducing
    the accuracy. On the other hand, the strongly relevant and weakly relevant features
    help in forecasting. redundant features should be identified and removed.


    In this paper, the RLeeff Recursive Information Hybrid Feature Selection (RMR-HFS)
    is introduced for the improvement of short term load forecasting usinging and
    filter feature selection methods. The method based on information filter feature
    selection and recursive-based feature selection wrapper method are applied to
    identify the subset of features. Feature selection methods are not suitable for
    all cases. The proposed method where RLeeff and information theoretic mutual information
    feature selection are used to eliminate the redundant features. The RLeeff filter
    selection is used for feature selection. The method identifies the relevant and
    non-informative features by the relationship between each feature and target feature.
    RLeeff does not consider the relationship between features.


    Although, RMR and MI selects all the features it is general that the list of relevant
    features has many redundant features. The selection has the capacity of identifying
    and removing the redundant features using learning as a feature. So, the proposed
    method can improve the accuracy and avoid overfitting by using the recursive RFE
    base. The filter and wrapper selection method is proposed to avail the benefits
    of both feature selection. The optimal subset of features is given in for the
    deep learning LSTM model for load forecasting.


    # 3.2. RMR-HFS-LSTM architecture


    The proposed deep learning based model RMR-HFS-LSTM consists of three phases:
    data preprocessing, hybrid feature selection and prediction. In the first phase,
    the hourly electricity load and weather data are are treated as a single dataset.
    It is cleaned and normalized to prepare the data for further processing. The outliers
    and selection of dissimilar samples are eliminated. Then the instance based filter
    feature selection RLeeff and information theoretic mutual information feature
    selection are applied to identify the relevant features.'
