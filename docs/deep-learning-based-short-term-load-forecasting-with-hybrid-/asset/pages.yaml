    The proposed RMR-LSTM deep learning prediction model consists of preliminary data
    processing, hybrid feature selection and deep prediction.


    +   - The pre-processing stage handles the hourly time series electricity load
    and the associated weather data, by replacing the missing values with the past
    data, and reducing the data using min-max normalization.


