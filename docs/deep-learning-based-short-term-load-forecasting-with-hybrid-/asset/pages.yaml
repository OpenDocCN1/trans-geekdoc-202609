    # 2. Related works


    The review of related works investigated by various researchers is explored in
    this section. In [71], Marin et al. identified a novel long short term memory
    sequence generator for predicting the building load. The authors used an LSTM
    decoder model to approach the forecasting of both hourly and minute level load
    by CRFM and FCBM models. The results and consideration of the outliers in the
    results are not discussed. The CNN-based deep learning network presented in [24]
    worked well in forecasting and achieved better performance compared to ANN models
    like regression and ARIMA. The model is compared using a deep gradient boosting
    framework. Ku and Hu proposed a CNN deep energy load model for forecasting using
    random forest tree, DEC and LSTM. The result showed that the CNN deep energy load
    model outperformed other methods. The performance of the model was reduced by
    outliers. The consideration of the temporal dependency characteristics is missing.


