    RFE 的 RNN 以及带有 RFE 和 RFE 的 RNN 相比，带有 RMR-HFS 的 RNN 的预测负载更接近实际负载。


    图 (iii) 展示了带有特征选择的 LSTM 预测负载与实际负载的对比。图 (iv) 比较了包含特征选择的 LSTM。LSTM-RFS 的预测与实际值之间偏差很大。特征选择的引入了预测性能。图
    (ii) 比较了带有 RFE 的 LSTM 的实际负载与预测负载。它产生了比带有所有特征、带有 MI滤波器的 LSTM 更好的结果。图 (iii) 比较了带有
    MI滤波器的 LSTM 与不带特征选择的 LSTM 的预测。图 (vi) 显示了带有 RFE 的 LSTM 的实际负载与预测负载的对比。


    RMR-HFS 相比其他特征选择（RRelief、MI 和 RFE）对每种方法（MLP、RNN、LSTM）的优越性。总体而言，带有 RMR-HFS 的 LSTM
    实现了优于 MLP、RNN、RNN-HFS、带有 RRelief 的 RNN、带有 MI 的 RNN、带有 RFE 的 RNN、带有 RMR-HFS 的 LSTM、带有
    Relief 的 LSTM 以及带有 MI 的 LSTM 等方法的预测性能。如图 (v) 所示，图 (a) 的部分在图 (b) 中仅观察到 5 个样本。不同方法在训练样本和测试样本上的预测负载对比如图
    (b) 所示。它显示 RMR-LSTM 的图比其他方法更接近实际负载。它展示了所提方法 RMR-LSTM 优于其他方法的优越性能。


    预测模型的性能可以通过许多方式进行评估。MAPE 和 RMSE 被用作预测方法的额外评估指标。MAPE 和 RMSE 的计算如下：


    ```

    $$MAPE = \frac{100}{n} \sum_{t=1}^{n} \left| \frac{Y_t - F''_t}{Y_t} \right| ;
    \quad (12)$$

    ```


    ```

    $RMSE = \sqrt{\frac{1}{n} \sum_{t=1}^{n} [Y_t - F''_t]^2} ; \quad (13)$

    ```


    其中 ''n'' 代表实例数量，$Y_t$'' 代表观测时间的实际值，''$F''_t$'' 代表该时间的预测值。


    以 200 个样本为例，所有方法带与不带特征选择的实际与预测负载对比如图 (a) 所示。预测结果图显示了不带特征选择的 LSTM-R-HFS。带有所提方法
    RMR-HFS 的 LSTM 通过产生更接近实际的预测结果而优于其他方法。


