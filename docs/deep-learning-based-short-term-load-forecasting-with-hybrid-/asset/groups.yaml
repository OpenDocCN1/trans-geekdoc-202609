    ### 3.2.2 深度预测


    深度学习是处理时间序列数据的一种新兴技术。时间序列数据具有时间依赖性，并且对于相同的时间点具有不可预测的行为。通常，电力具有反复和波动的性质。某些方法对于处理时间序列是有效的，但在某些时刻无法产生准确的预测
    [44, 45]。深度学习可以通过自动学习输入和输出序列之间的映射来处理复杂性。深度学习能够很好地处理时间序列数据，并比传统方法提供更高的精度。


    其中 $c_t, h_t$ 和 $o_t$ 代表细胞状态、新状态和输出门的值。$W_f, W_i, W_c$ 和 $W_o$ 代表遗忘门、输入门和输出门的权重矩阵。$b_f,
    b_i, b_c$ 和 $b_o$ 分别代表偏置权重。


    使用 2000 年 1 月 1 日至 2012 年 12 月期间波兰和瑞典的电力数据和天气数据用于实验。天气为预测负载提供了重要信息，因此将负载天气数据集整合到一个格式中。负载数据包含
    31,848 行。数据集的特征为：$f_1$ 温度、$f_2$ 湿度、$f_3$ 降水量、$f_4$ 总降水量（高，有限范围）、$f_5$ 总降水量（低）、$f_6$
    总云覆盖率、$f_7$ 低云覆盖率、$f_8$ 中云覆盖率、$f_9$ 照时长、$f_{10}$ 短波辐射、$f_{11}$ 风速（10 mph）、$f_{12}$
    风向、$f_{13}$ 风阵、《f_{14}$ 风速（低 mph）、$f_{15}$ 风速 [90 mph]、$f_{16}$ 风向 [90 mph]、$f_{17}$
    风需求 [90 mph]。


    论文随后介绍了数据集的特征、LSTM、GRU 以及作为最先进的循环神经网络 MLP。RNN 和 MLP 是用于预测、时间序列预测和回归问题最合适的方法。在本文中，使用短记忆网络基于电力和天气数据进行负载预测。接下来的章节讨论了
    LSTM 的工作原理。


    ### 3.2.4 短记忆网络


    短期记忆是 RNN 的扩展。它是一种特殊的网络，旨在克服 RNN 在长时间记忆方面的局限性。它通过随反向传播更新隐藏状态，有效地处理了 RNN 的梯度消失和爆炸问题。在这里，它通过在细胞状态中使用门来保留序列信息。这使得时间序列数据实现了更好的预测性能。它具有理解
    LSTM 非线性时间数据中序列依赖性和时间依赖性的潜力。LSTM 单元由三个门组成。


    ![](img/8f28a644aa4b94b031efafb7a94e5d53_4_0.png)


    图 2. 长记忆网络的架构。


    ![](img/8f28a644aa4b94b031efafb7a94e5d53_4_1.png)


    数据集被分为训练集、验证集和测试集。由于时间结构，负载数据不是随机的，这里一个观测值之间存在某些依赖关系。因此，划分时间序列负载数据的方法是考虑 3 年的前
    26,304 (60%) 个观测值为训练数据集，接下来的 8760 (20%) 个观测值为验证数据集，最后 8784 (20%) 个观测值为测试数据集。为了提高


    预测的准确性，应用 MI 和 Relief 过滤选择方法来寻找相关且非冗余特征。然后，RFE 包装器使用此选定的特征列表。特征选择方法的特征列表如表 2 所示。Relief
    评价得分对于 3 个不重要的特征从 10 降到 0。因此，MI 特征 (f1, f3, f4, f5, f15, f16, f17, f18, f19, f20,
    f21, f22) 是最佳特征子集。互信息评价得分在 13 个特征后保持平稳。因此，这 13 个特征 (f1, f3, f4, f5, f15, f16,
    f17, f18, f19, f20, f21) 是最佳特征子集。RFE 包装器方法直接应用于原始数据，选出 9 个特征作为最优特征子集 (f1, f3,
    f4, f5, f15, f16, f17, f18, f19)。然后，在比较由 Relief 和互信息选出的特征后，为该方法选择了最佳特征。所提出的 R-RFE
    混合特征选择方法如研究所示使用了 9 个特征。

