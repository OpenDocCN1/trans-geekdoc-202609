    ### 3.2.1.1. Rleff


    The Recursive Regression (Rleff) feature selection is It randomly selects and
    removes features from the original instance. Then, it selects k number of features
    using the variance function.


    ```

    P(A|B) = P(difference|nearest instances)

    ```


    ```

    P(AG) = P(difference|nearest instances)

    ```


    ```

    P(AG|ABC) = P(difference of A and nearest instances)

    ```


    ```

    W[A] = P(AG|ABC) * (1 - P(A|B)) / (1 - P(A))

    ```


    The feature with the highest weight is considered as the best feature among other
    features. Rleff has the same time complexity as simple regression.


    ### 3.2.1.2. Mutual information selection


    The mutual information is a non linear correlation filter selection that calculates
    the correlation between two or more of features. The features have common information
    with other feature is called a dependent feature. On the other hand, the features
    with no common information are called independent features. The mutual information
    method utilizes the dependency between the features related to the target as a
    base for finding the relevant feature. The amount of information shared between
    features is called mutual information. If there are two features, then the mutual
    information between them is measured as I(A;B). When ''A'' and ''B'' are independent,
    the mutual information I(A;B) is 0. The data is in continuous. For continuous
    random variables, the mutual information of the feature ''A'' is calculated as


    ```

    I(A;B) = sum p(A,B) * log (p(A,B)/(p(A)p(B))) dB

    ```


    where ''a'' and ''b'' represents the number of values in ''A'' and ''B''. Then,
    the P(a,b) is the joint probability density of ''A'' and ''B''. The pa and pb
    are marginal probability density function of ''A'' and ''B''.


