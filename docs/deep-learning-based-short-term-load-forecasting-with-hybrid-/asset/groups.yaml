    Faisal 等人 [17] 设计了一种使用增强型卷积神经网络的极端学习机用于建筑预测，其不确定、波动和过拟合问题通过深度神经网络利用负荷聚合、空间分析和客户分类得到了有效处理。结果被离值隐藏，且未对离值进行处理。


