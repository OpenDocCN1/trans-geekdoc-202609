    # 电力系统研究


    期刊主页：www://www.elsevier.com/locale/epsr


    # 基于深度学习的混合特征选择短期负荷预测


    Siva Sankari Subbiah a*, Jayakumar Chinnappan b


    *计算机科学与工程系，Srinivasasa Institute of Technology and Management Studies, Chittoor
    637127, 印度

    ᵇ计算机科学与工程系，Sri Venkateswara College of Engineering, Nellore, 524017


    # 文章信息


    # 摘要


    - 关键词：

    - 深度学习

    - 混合特征选择

    - 长期负荷记忆

    - 电力系统

    - 循环神经网络


    电力系统的可靠且经济运行依赖于对短期负荷的准确预测。本文中对比了基于混合特征选择的深度学习长短期记忆（LSTM）模型 RMR-HFS-LSTM。本研究的目标是减少负荷预测误差。RMR-HFS
    是过滤式（filter）和包装式（wrapper）特征选择的结合，用于选择特征的最优子集。利用基于信息理论的互信息过滤选择，通过发现和消除无关特征来降低多样性维度。所选的特征通过递归特征消除（RFE）进行测试。结果显示，LSTM
    通过不确定性实验改进了负荷数据的准确性和负荷数据处理。在欧洲天气和负荷数据上对所提方法的性能进行了测试，并将其与多层感知器（MLP）和递归神经网络（RNN）进行了对比。结果表明，提出的
    RMR-HFS-LSTM 优于其他模型。


    # 1. 引言


    由于电力需求与建设之间的不平衡，电力负荷预测是竞争性经济性业务中的一个重要研究领域。负荷预测是为系统中的交易市场决策、实时智能调度、智能电网自动化和控制提供电力支持的首要任务
    [1]。为了实现电力系统的稳定和高效运行，负荷预测应产生准确的结果。为了满足电力需求，电力需求波动很大，因此应该在需求时发电。如果能够提前知道需求，就可以满足发电的所有运行要求。电力系统有几个目标：根据需要按时提供稳定安全的电力、节省运行成本、维持维护成本、确保电力系统的可靠性并平衡发电与负荷动态变化的平衡
    [5,2]。高估或低估会导致电力系统产生复杂的财务影响 [7]。


    负荷的不确定性和波动性，以及负荷数据中不完整、非均匀、冗余和无关信息的存在使得难以实现准确预测。天气信息对负荷需求影响很大。考虑季节和天气信息的负荷预测可以产生准确的结果
    [9,10]。预测可以按小时、每天、每月或每年进行。负荷需求与外部因素（如湿度、温度、风速、压力、降雪、云以及用户对家电的使用）相关 [12]。在学习过程中，只有高质量的输入且只有相关信息被作为输入到学习和预测过程中。特征选择是降维技术之一，它根据特征的统计特性从原始特征列表中选择相关特征
    [13]。因此，它保留了特征的原始性。


