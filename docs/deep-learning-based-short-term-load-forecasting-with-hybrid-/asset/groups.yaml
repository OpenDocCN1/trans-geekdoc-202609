    | NARX | nonlinear autoregressive exogenous inputs |

    | PDCNN | pooling deep neural network |

    | RFE | recurrent feature selection |

    | HFS | hybrid feature selection |

    | RLEf | RLEf, mutual information and recurrent feature selection - hybrid feature
    |

    | RMSE | mean square error |

    | STCM | support vector machine |

    | RNN | recurrent network |

    | SVM | support vector |

    | SVR | support vector regression |

    | VMD | variational mode decomposition |


    Faisal et al. [17] designed an extreme learning machine using the enhanced convolutional
    neural network for forecasting the building which uncertainty, volatility and
    overfitting problems were handled effectively by deep neural network using load
    aggregation, spatial analysis and customer classification. The result was hidden
    by outliers and no handling of outliers.


