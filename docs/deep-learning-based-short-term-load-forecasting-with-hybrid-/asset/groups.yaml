    大多数研究人员使用 MLP、RNN、CNN 和 LSTM 等深度学习方法。一些研究人员仅使用历史负荷数据而不使用外部特征来改进过程。其他研究人员利用正交特征来识别相关且非冗余的特征。因此，他们面临模型复杂性和维度问题。减少数据集维度以获得更好的预测准确率。负荷数据上的时间依赖性也是有助于预测的重要信息。数据也具有不确定性。在本文中，通过混合选择减少数据集维度以提高预测准确率，并且通过
    RNN 分析负荷数据上的时间依赖性考虑了不确定性问题。因此，提出的 RMR-HFS-LSTM 数据模型通过考虑不确定性、非线性和维度过拟合问题，改进了负荷预测性能。


    ## 3. 提出的 RMR-HFS-LSTM 预测模型


    ## 3.1. R-HFS 的意义


    包含不相关、无关和无信息特征的数据集可能会增加数据集维度，从而强制模型过拟合。它也会导致预测模型在泛化模式方面变得复杂。使用过多特征训练的模型可能无法产生准确稳健的结果。还观察到冗余特征会降低准确率。数据集可能具有许多特征。它们有相关特征、高度相关且冗余特征、弱相关且非冗余特征以及强相关特征。无关特征会降低准确率。这些特征不应该贡献于预测准确率，相反，会识别过拟合并降低准确率。另一方面，强相关和弱相关特征有助于预测。应该识别并移除冗余特征。


    在本文中，引入了递归消除信息混合特征选择（RMR-HFS），通过使用过滤特征选择方法来改进短期负荷预测。应用基于信息过滤特征选择和基于递归的特征选择封装方法（wrapper）来识别特征子集。特征选择方法并不适用于所有情况。提出的方法使用了
    RLeeff 和信息论互信息特征选择来消除冗余特征。RLeeff 过滤用于特征选择。RLeeff 方法通过每个特征与目标特征之间的关系识别相关和无信息特征。RLeeff
    不考虑特征之间的关系。


    尽管 RMR 和 MI 选择了所有特征，但相关特征列表包含许多冗余特征。选择具有识别冗余特征的能力。因此，提出的方法可以通过递归 RFE 提高准确率并避免过拟合。过滤和封装方法提供了特征选择的优势。最佳特征子集用于深度学习负荷预测模型。


    ## 3.2. RMR-HFS-LSTM 架构


    提出的基于深度学习的模型 RMR-HFS-LSTM 包含三个阶段：数据预处理、混合特征选择和预测。在第一阶段，小时电负荷和天气数据被视为单个数据集，进行清洗和归一化以准备进一步处理。消除了离群值和样本。然后应用
    RLeeff 和信息论互信息特征选择来识别相关特征。所选的 M 和 Rleff 特征结合（COMPS）以找到最相关的特征。然而，调优的封装选择改进过滤方法产生了最佳特征子集。在第三阶段，构建并训练
    LSTM 预测模型。在验证数据上使用时间序列交叉验证调整参数。最后，提出的 R-HFS-LSTM 在所有特征下与多个基准模型在 MAPE 和 MAE 等误差指标上进行了比较。结果所示。


    （注：原文后续存在大量重复段落，此处已按要求不再重复输出相同核心内容）

