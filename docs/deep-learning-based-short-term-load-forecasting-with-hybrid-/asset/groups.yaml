    另一方面，包装式特征选择根据学习模型选择特征子集 [15,14]。特征选择技术从提供给学习过程的输入数据中消除无信息、无关和冗余信息，可以提高分类器的性能。


    过去研究人员利用基于统计和人工智能的机器学习方法。现在使用深度学习方法以以最小的努力实现效率。基于深度学习的模型通过在输入层和输出层之间堆叠许多层，具有学习序列数据复杂性以及时空依赖关系的能力。例如，神经网络可以处理序列数据的非线性映射。但它面临梯度消失和梯度爆炸问题。神经网络利用反向传播生成导数
    [21]。当梯度很小时，学习变得变慢；而当梯度很大时，就会产生梯度爆炸问题。因此，使用 RNN LSTM 通过引入门控机制解决了这些问题。识别重要特征的重要性、最优滞后和任何最小层数将保证减少过拟合问题。LSTM
    可以通过考虑多个特征来捕捉大量高维数据。


    提出的 RMR-HFS-LSTM 包含了预处理、混合特征选择和深度预测。该深度学习模型通过考虑多个特征来捕捉大量高维数据。


    所提方法的 RMR-HFS-LSTM 在 MAPE 和 RMSE 指标上与 RNN 和 LSTM 进行了对比预测预测。RLEf、互信息和递归特征选择的混合特征选择通过消除无关和非信息特征，利用统计特性识别相关特征。


    本文其余部分的结构如下：第2节探讨了研究人员的工作；第3节描述了 RMR-HFS 特征选择和 RMR-LSTM 模型；第4节讨论了每个预测模型的结果；第5节给出了本研究的结论。


    # 2. 相关工作


    本节探讨了各种研究人员的相关工作。在 [71] 中，Marin 等人识别了一种新型长短期记忆生成器用于预测负荷。作者使用 LSTM 解码器通过 CRFM 和
    FCBM 模型对每小时和分钟级负荷进行预测。未讨论结果中的离值问题。[24] 中提出的 CNN 深度学习网络在预测方面运行良好，与 ANN 模型相比取得了更好的性能。该模型使用了深度提升框架。Ku
    和 Hu 提出了一种使用随机森林、DEC 和 LSTM 的 CNN 能量模型。结果显示 CNN 能量模型优于其他方法。模型的性能受离值影响。缺少对依赖性的考虑。


