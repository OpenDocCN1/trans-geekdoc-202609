    ## 用于肽修饰的预激活金属有机试剂


    Cecile Elgindy¹ and Lara R. Malins¹,*


    在本期 Chem Catalysis 中，Walczak 及其合作者引入了一种碳杂锡杂环（carbastannatrane）丙氨酸衍生物，通过 Stille
    交叉偶联反应利用 C-C、C-S 和 C-Se 键形成促进氨基酸侧链官能化。晚期肽修饰和大环化中的应用进一步凸显了这一新型构建单元的价值。


    阐明翻译后修饰（PTM）的结构和生物学后果，已促进对肽和蛋白质结构-活性关系的更好理解，并扩大了其治疗应用潜力。然而，鑒于 PTM 的广泛功能多样性，许多此类修饰仍不为人所理解，目前的局限性在于难以用化学方法复制其高度选择性的酶促安装。理想情况下，此类方法应具有位点选择性和残基特异性，采用温和反应条件（室温和生理
    pH），并适用于肽和更大的蛋白质结构——在没有专用酶协助的情况下，这是一项艰巨的任务。对原生和定制肽修饰的高效化学方法的吸引力，推动了开发新方法的浓厚兴趣。


