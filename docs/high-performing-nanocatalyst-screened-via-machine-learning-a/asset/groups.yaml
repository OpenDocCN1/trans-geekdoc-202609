    ## 预览


    ## 经机器学习筛选并通过实验验证的高性能纳米催化剂


    Qionghua Zhou¹, Qiang Li¹, and Jinlan Wang¹,*


    在本期 Chem Catalysis 中，Han 及其合作者结合第一性原理计算与机器学习技术，探寻用于氧还原反应（ORR）的三元电催化剂。预测出的有前景的
    PtFeCu 纳米粒子经实验验证，表现出高于商业 Pt/C 的活性与更持久的稳定性。


    质子交换膜（PEM）燃料电池是一种基于电化学反应的有前景的能量转换方式，其关键在于开发活性且稳定的氧还原反应（ORR）催化剂。通常，贵金属 Pt 催化剂在商业领域处于领先地位，而其他非贵金属催化剂仍处于早期阶段。1,2
    为了提高活性和稳定性并最大化原子利用率，已提出了各种 Pt 合金，3,4 由于协同效应，一些二元纳米粒子的 ORR 性能优于纯 Pt。5 然而，合金系统的多样性、多组成及各种比例变化可构成一个大型数据库，这对传统的试错方法构成巨大挑战。机器学习是材料设计领域在过去几年中迅速兴起的一项技术，尤其用于大规模化学空间筛选。6,7
    它基于数据统计而非量子力学计算，因此比第一性原理计算快数千倍。它已成功应用于析氢反应8 和氮固定9 等催化剂设计。尽管取得了成功，这种最先进方法的结果通常仍需要严格验证。


    在本期 Chem Catalysis 中，Han 及其合作者应用机器学习来寻找用于 ORR 的活性且耐用的三元电催化剂。10 通过进行第一性原理计算，他们构建了具有不同形貌、尺寸、组成和构型的
    PtFeCu 纳米粒子的 44,884 个原子局部环境。基于这些准确数据，利用神经网络（一种深度学习算法）对原子相互作用势数据进行了参数化。利用该势，作者通过
    PtFeCu 纳米粒子的壳层结构和合金组成探索了其稳定构型。绘制的三元相图显示，Pt 组分应大于 0.8 才能形成 Pt 皮壳结构，ORR 由此由表面 Pt
    位点催化；同时，位于核心的 Fe 和 Cu 原子可诱导应变效应以增强 Pt 的活性。催化性能基于计算氢电极模型（自由能图）进行评估，并与 d 带理论相关联。研究表明，通过在纳米粒子中混合不同尺寸的元素，应变场可以调制活性中心的
    d 带，从而达到火山图的最佳范围。因此，提出了 PtFe 含量高、Cu 含量低的模型，该模型与含氧中间体显示出适当的结合能，并被预测对 ORR 具有高活性。为验证机器学习预测，合成并测试了四种不同组成的合金纳米粒子。与理论预测一致，Pt0.78Fe0.15Cu0.07（776
    μA cm−2Pt 和 0.67 A mg−1Pt）的活性是商业 Pt/C（248 μA cm−2Pt 和 0.21 A mg−1Pt）的三倍，且更具特异性。关于稳定性，计算的离聚能和合金元素的分布表明，有限量的
    Cu 可以提高化学稳定性。同样，加速应力测试（AST）也表明，额外的 Cu 增强了 PtFeCu 催化剂的耐久性。因此，作者提出，其 ORR 电催化剂 Pt0.78Fe0.15Cu0.07
    在活性和稳定性方面均超过了 2020 年美国能源部的目标。


    这项工作展示了一种理论指导实验的系统研究，也是机器学习如何帮助优化纳米催化剂合金比例的良好示例，不仅可加速大型化学空间的筛选，还能弥合原子尺度计算与实尺度实验之间的差距。这对于催化剂设计尤为关键，因为反应发生在原子尺度，而观察相对宏观。在这项工作中，机器学习带来的海量数据帮助作者绘制了
    PtFeCu 纳米粒子中三层壳层的组成比例与构型之间的复杂关系，从而筛选出相图的最佳区域。此外，详细分析清楚地表明，杂原子在所设计催化剂的活性和稳定性中起着关键作用，包括表面应变和金属离聚。此后，该方法可应用于其他催化反应中的多元合金促进效应。借助数据库，可以通过大量催化模型分析结构-活性关系，并揭示电子结构和催化活性的深度调控机制。这项工作的成功方法揭示了数据驱动催化剂设计的光明前景。


