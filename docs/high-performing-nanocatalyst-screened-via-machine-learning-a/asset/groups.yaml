    # Previews


    # High-performing nanocatalyst screened via machine learning and confirmed experimentally


    Qionghua Zhou, 1 Qiang Li, 1 and Jinlan Wang 1,*


    In this issue of Chem Catalysis, Han and co-workers combine first-principles calculations
    with a machine-learning technique to search ternary electrocatalyst for oxygen
    reduction reaction. The predicted promising PtFeCu nanoparticles were validated
    by experimental tests, showing both higher activity and more durable stability
    than commercial Pt/C.


    The proton exchange membrane (PEM) fuel cells provide a promising way of energy
    conversion based on electrochemical reactions, and the key point is the development
    for active and stable catalysts for oxygen reduction reaction (ORR). Typically,
    the noble Pt catalysts take the lead in the commercial grade, and other non-noble
    catalysts are still in an early age.1,2 To improve the activity and stability
    and maximize the atomic efficiency, various Pt alloy have been proposed,3,4 and
    some binary nanoparticles have shown better ORR performance than that of pure
    Pt due to synergic effect.5 However, the diversity, multi-composition, and various
    ratio changes of the alloy systems can constitute a big database, which imposes
    a big challenge for traditional trial-and-error methods. Machine learning is a
    technique within materials design that has risen rapidly within the past few years,
    used especially in massive chemical space screening.6,7 It is based on statistics
    of data instead of quantum mechanical calculations, which makes it thousands of
    times faster than first-principles calculations. It has been successfully applied
    in catalyst design like hydrogen evolution reaction8 and nitrogen fixation.9 In
    spite of its success, the results from this state-of-art approach usually still
    need strict validations.


    In this issue of Chem Catalysis, Han and co-workers apply machine learning to
    find active and durable ternary electrocatalyst for ORR.10 By performing first-principles
    calculations, they prepared 44,884 atomic local environments of a PtFeCu nanoparticle
    with different morphology, size, composition, and configuration. Based on these
    accurate data, atomistic interaction potential data was parametrized by neural
    network, which is a deep-learning algorithm. Using this potential, the authors
    explored the stable configuration of a PtFeCu nanoparticle through its shell structures
    and alloying compositions. The mapped ternary phase diagram shows that Pt composition
    should be greater than 0.8 in order to form a Pt-skinned shell, upon which ORR
    is catalyzed by the surface Pt sites; meanwhile, Fe and Cu atoms located at the
    core can induce strain effect to enhance the activity of the Pt. The catalytic
    performance is evaluated based on computational hydrogen electrode model (free-energy
    diagrams) and correlated with d-band theory. It is suggested that by mixing different
    sized elements in a nanoparticle, the strain field can modulate the d bands of
    the active centers and, thus, reach the optimal range of the volcano plot. Consequently,
    PtFe high Cu low models, which show proper


    binding energies with oxygenate intermediates, are proposed to present high activity
    for ORR. To validate the machine-learning predictions, four different compositions
    of alloying nanoparticles were synthesized and tested. Consistent with the theoretical
    predictions, the Pt0.78Fe0.15Cu0.07 (776 μA cm−2Pt and 0.67 A mg−1Pt) exhibits
    activities three times bigger and more specific than commercial Pt/C (248 μA cm−2Pt
    and 0.21 A mg−1Pt). In regard to the stability, the calculated segregation energies
    and the distribution of the alloying elements indicate that the limited amount
    of Cu can improve chemical stability. Again, the accelerated stress test (AST)
    also shows that the additional Cu enhances the durability of PtFeCu catalyst.
    Thus, the authors proposed that their ORR electrocatalyst Pt0.78Fe0.15Cu0.07 surpassed
    the 2020 US Department of Energy''s target for both activity and stability.


    This work shows a systematic study of theory-guided experiment and a good example
    of how machine learning helps optimization of the alloy ratio of nanocatalysts,
    not only for accelerating the screening of large chemical space but also for bridging
    the gap between atomic-scale calculations and real-scale experiments. It is especially
    critical for catalyst design because the reaction happens in atomic scale, and
    the observations are relatively macroscopic. In this work, the massive data brought
    by machine learning help the authors to map the complex relationship among composition
    ratio and configuration of three shells in the PtFeCu nanoparticle, thereby screening
    out the best region of the phase diagram. In addition, the detailed analysis clearly
    demonstrates'
