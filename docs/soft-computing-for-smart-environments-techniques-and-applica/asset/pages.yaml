  img_proc: true
- pgno: 114
  md: '# 3.3 MCDM Methods for Decision-Making


    This part presents a hybrid methodology for assessing smart disaster response
    systems. For the purpose of this task, we find the integration of the two methods,
    fuzzy Decision-Making Trial and Evaluation Laboratory (DEMATEL) and fuzzy Evaluation
    based on Distance from Average Solution (EDAS), which are very well-known approaches
    to prioritize the main dimensions and their sub-indicators and evaluate specific
    alternatives for an MCDM problem. Figure 3.2 shows the research approach guiding
    this study in which the fuzzy DEMATEL method will be used as an initial development
    level of the analysis, which is then completed with the help of experts to calculate
    the weights of the main dimensions and their sub-indicators for the pairwise comparison
    matrix. Next, the fuzzy EDAS method is used to evaluate smart disaster response
    systems based on selected criteria. We present a brief overview of the methods
    used in this study, as presented in the following parts.


    ![](img/601db3e97ac605d993053e21bf375150_114_0.png)


    FIGURE 3.2

    General scheme of the applied approach.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 3.3.1 Fuzzy DEMATEL Method


    In 1973, the Battelle Memorial Institute’s Geneva Research Centre performed the
    DEMATEL procedure for the first time (Gabus and Fontela, 1972). DEMATEL is an
    expanded approach for constructing and evaluating a structural model in order
    to analyze the influence relationship between complicated criteria. In a hazy
    environment, however, making judgments based on complicated elements is difficult
    due to the difficulties in identifying them. The present work used the fuzzy DEMATEL
    approach for a more precise analysis. The original DEMATEL technique sought integrated
    solutions for the world’s fragmented and adversarial civilizations. The DEMATEL
    technique has recently gained popularity in Japan due to its capacity to pragmatically
    depict intricate causal links (Chang, Chang, and Wu, 2011). The DEMATEL approach
    is specifically based on digraphs, which split involved components into cause-and-effect
    groups. Digraphs, or directed graphs, are more valuable than undirected graphs
    because they illustrate the directed interactions between sub-systems. The digraph
    may reflect a fundamental idea of the contextual relationship between components
    of a system, where the values indicate the magnitude of the effect (Wan et al.,
    2021). Therefore, The DEMATEL is able to translate the link between cause-and-effect
    variables into a system’s understandable structural model. The DEMATEL is able
    to offer the most significant criterion that influences other criteria. The DEMATEL
    may simultaneously decrease the number of criteria for assessing the efficacy
    of a factor, allowing businesses to increase the effectiveness of certain factors
    based on the impact digraph map. The DEMATEL approach transforms the link between
    cause-and-effect variables into an intelligent system structure model (Nasrollahi
    et al., 2021).


    # 3.3.2 Fuzzy EDAS Method


    In 2015, Ghorabaee et al. introduced the EDAS approach, which is an acronym for
    the Evaluation based on Distance from Average Solution (Ghorabaee et al., 2015).
    The method’s validity was evaluated by comparing it to various MCDM approaches,
    including Vise Kriterijumska Optimizacija I Kompromisno Resenje (VIKOR), Technique
    for Order Preference by Similarity to Ideal Solution (TOPSIS), Simple Additive
    Weighting (SAW), and Complex Proportional Assessment (COPRAS). According to this
    test, the EDAS approach is reliable and has shown positive results. This strategy
    is quite beneficial for comparing criteria. Compared to compromise-based MCDM
    approaches such as VIKOR and TOPSIS, it is advantageous in this method to compute
    the distance between ideal and rare solutions in order to pick the optimal choice
    (Kar atop et al., 2021). In this chapter, EDAS was chosen due to its ease of use
    and reduced computing requirements, two of its most essential characteristics.'
  merge: -1
  img_proc: true
