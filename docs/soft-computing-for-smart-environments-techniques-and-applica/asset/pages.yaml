    FIGURE 6.1

    Illustrative representation of the used approach for evaluating smart campuses.


    # 6.2.2 TOPSIS Method


    In 1981, Yoon and Hwang created what is now known as the TOPSIS approach (Yoon
    and Hwang 1985). Alternatives are evaluated with the use of parameters by the
    procedure. The fundamental reasoning behind this approach is to find the positive
    and negative solutions that are most effective overall. The alternative that is
    the farthest away from the optimum positive solution is the one that is considered
    to be the best alternative. An ideal alternative is the closest to the optimal
    negative solution. TOPSIS assigns weights to choose options according to how close
    they are to both a positive ideal solution (PIS) and a negative ideal solution
    (NIS) simultaneously. The PIS prioritizes criteria of the “the more, the better”
    kind while giving less weight to those of the “the less, the better” variety,
    while the'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'NIS prioritizes criteria of the “the more, the better” variety while giving
    less weight to those of “the less, the better” variety. The distance to the PIS
    is cut down to a minimum, while the distance to the NIS is increased to its greatest
    possible level. The approach is one of the most extensively used ranking systems
    since it validates a large number of appropriate qualities (Bouslah et al. 2022).
    As a result, it has been widely used for actual choice issues in a variety of
    situations due to its widespread usefulness.


    # 6.2.3 Computational Steps of the Approach Used


    This part presents detailed steps to solve the problem of identifying sustainability
    indicators for smart campuses and providing steps for arranging some smart campuses.


    Step 1: The problem is studied in some detail in order to reach the points of
    importance and weakness and to identify the most important main aspects that affect
    the identification of sustainability indicators for the smart campus and the assessment
    of the smart campus. In this regard, some experts have agreed to help the authors
    compile data to solve the problem. Accordingly, some rules have been established
    for selecting experts, such as academic degrees and years of experience. Also,
    it was agreed on ways to communicate with experts, whether online or offline.


    Step 2: The most significant main criteria and sub-criteria affecting the selection
    of smart campuses are determined based on expert surveys and previous studies.
    C_j = {C1, C2, ..., Cn}, with j=1, 2...n. Let w = (w1, w2, ..., wn) be the vector
    set used for recognizing the criteria weights, where w_j > 0 and ∑_{j=1}^n w_j
    = 1.


    Step 3: The most significant available alternatives that can be used in the assessment
    process are determined, in addition to preparing a final list of these alternatives
    according to experts’ opinions. The group SC_i = {SC1, SC2, ..., SCm}, having
    i=1, 2..., m alternatives, is measured by n decision measurements of group C_j
    = {C1, C2, ..., Cn}, with j=1, 2, ..., n.


    Step 4: According to the study of the problem, its dimensions are organized in
    a hierarchical form between the main objective, sub-criteria, and the selected
    alternatives.


    Step 5: Linguistic variables that help experts evaluate the main criteria and
    sub-criteria are identified as presented in Table 6.1. Also, linguistic terms
    that help in evaluating alternatives are identified, as shown in Table 6.2.


    Step 6: Create the judgment matrices rendering to experts’ preferences (E_s) to
    measure the main criteria by each expert by using verbal terms as presented in
    Table 6.1, and then by using q-ROFNs as presented in Table 6.3.'
