  md: 'cutting-edge and very effective method for resolving issues that are connected
    to MCDM. In this method, the Euclidean distance is considered to be the most significant
    criterion in the assessment procedures. In its most basic version, CODAS computes
    the assessment ratings of alternatives by combining the taxicab distance and the
    Euclidean distance. This is done in order to provide the most accurate results
    possible. On the basis of the anti-ideal point, the Euclidean distance (the main
    measure) and the taxicab distance (the secondary measure) are computed in order
    to evaluate which option is the most appropriate (Bolturk and Kahraman, 2018).
    In this context, the alternative that involves a higher distance is the one that
    is recommended.


