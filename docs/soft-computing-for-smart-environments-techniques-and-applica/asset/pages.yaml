    study to assess several smart sustainable cities are discussed. Initially, six
    main criteria and thirty-one sub-criteria were identified to evaluate smart and
    sustainable cities. According to the results of the six main criteria, it is clear
    that the smart mobility criterion ranks first, with a weight of 0.236, followed
    by the smart economy criteria with a weight of 0.226. On the contrary, the smart
    people criterion ranks last with a weight of 0.040.


