- pgno: 77
  md: '# 2


    # A Conceptual Design and

    Evaluation Framework for Assessing

    Smart Health Technologies


    # 2.1 Introduction


    Personal and social health is very important. It is at the heart of happiness.
    From an economic standpoint, healthcare is one of the world’s most important industries.
    With new digital technology, modern healthcare is developing quickly, and more
    ailments are being cured. Smart technologies, such as broadband Internet and mobile
    communication technologies, wearable electronics, the Internet of Things, cloud
    computing, robotics, and others, provide new improvements to treatment approaches,
    and the health industry is altering as a result. Smart health refers to the provision
    of healthcare using smart technology to monitor residents’ health. Artificial
    intelligence and machine learning are becoming crucial assistants for health professionals
    in illness prevention, diagnosis, treatment, and post-treatment services, thanks
    to the capabilities of these smart technologies. As a result, smart technologies
    are at the forefront of health-tech research and development. This area is where
    universities, health institutions, and health technology corporations earn handsomely.
    Every day, the number of smart technology applications in healthcare grows. One
    of the goals of this chapter is to give advice and information on the usage of
    smart technology in the healthcare industry.


    Through improved health applications, the adoption and implementation of developing
    smart health technology may improve living circumstances. The most important accomplishment
    in smart health solutions is the balanced application of technology and engagement
    in human-based systems. Effective healthcare services such as customization of
    medicines via big data, robots in cure and care, and artificial intelligence help
    for physicians, and others are offered using smart health technology. Furthermore,
    smart health helps individuals with preventative care'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'and therapeutic services while also improving their living situations. Individuals
    who may have limited access to health services now have access to these services
    because of smart health solutions.


    Health is one of the most important areas where new digital technologies give
    these benefits. This area employs a variety of technologies, including cloud computing,
    the Internet of Things (IoT), big data, artificial intelligence (AI), and robots.
    The amount of data gathered in the area of health is quickly expanding because
    of the Internet of Things and the adoption of wearable health devices. Decision
    support systems that leverage big data analytics assist healthcare practitioners
    in making rapid and efficient judgments. Big data analytic tools and apps trigger
    new advances in patient behavior, treatment costs, and R&D. AI is also becoming
    one of the most widely employed technologies in the area of medicine. For instance,
    AI is used to analyze pathology data. With its capacity to access massive databases,
    AI assists clinicians in making therapy choices by scanning identical symptoms
    and their analysis findings in any nation across the globe.


    Poor healthcare technology has the potential to kill people. As a result, the
    region in which smart health technology will be implemented should be thoroughly
    analyzed before the most appropriate technology is chosen. Because these assessments
    are based on people''s desires and expectations, they might sometimes be hazy
    and imprecise. As a result, smart health solutions may be chosen based on carefully
    chosen parameters. This chapter also aims to present a paradigm for the healthcare
    industry in terms of smart health technology selection and assessment. As a result,
    smart health technology assessment is treated as a multi-criteria decision-making
    (MCDM) issue. The MCDM area comprises ideas and methods for achieving the “best
    suitable” answer for a decision scenario that fulfills several competing criteria.
    It is both a strategy and a set of procedures or approaches for assisting individuals
    who are confronted with various, non-uniform, and sometimes competing challenges
    in making choices that are acceptable to their own value judgments.


    The mixed structure of smart health technology assessment includes a set of contradicting
    criteria. It is tough to decide on and assess the material that is of an unclear
    nature. A fuzzy linguistic term set technique is used to deal with the ambiguity
    in this MCDM situation. This method may be used to help professionals make better
    decisions in difficult and ambiguous circumstances. It enables professionals to
    quickly convey their thoughts using words rather than figures, allowing them to
    pick the best option. It provides more realistic outcomes. This chapter suggests
    an integrated fuzzy linguistic MCDM framework to assess smart health technologies.
    The fuzzy Analytic Hierarchy Process weights the criteria (AHP), and alternatives
    are ranked with the fuzzy VIseKriterijumska Optimizacija I Kompromisno Resenje
    (VIKOR) method.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 2.2 MCDM Model


    In this part, a hybrid MCDM approach to evaluating smart health technologies has
    been presented. For the purpose of this task, we find fuzzy AHP and fuzzy VIKOR
    methods to be the best approach to solve this problem, prioritize criteria, and
    rank selected alternatives. Figure 2.1 indicates the research approach guiding
    this study, where the AHP method is used as an initial development level of the
    analysis, which is then completed with the help of experts to compute the weights
    of the key criteria and their sub-criteria for the pairwise comparison matrix.
    Then, the fuzzy VIKOR method is used to select the best alternative to smart health
    technologies based on the available criteria. To take scholars, undergraduates,
    interested parties, and researchers through our analysis process and attempt to
    provide a comprehensive context for our work, we then provide a detailed description
    of the fuzzy AHP and fuzzy VIKOR methods used in this study.


    # 2.2.1 Fuzzy Set Theory


    Zadeh (1975) began by outlining the theory’s central concept. Each element in
    a fuzzy set must be given a membership degree based on fuzzy set theory. Each
    element’s membership degree is inside a particular interval, which is often [0,
    1]. The most frequent fuzzy membership functions are monotone, triangular, and
    trapezoidal (Abdel-Basset, Gamal, and Teleb 2022). A triangular fuzzy number (TFN)
    is employed in most fuzzy settings owing to its ease of computation. TFN is also
    often used in most studies to represent a fuzzy number (Du and Li 2021). The membership
    grade function of a TFN B̃ = (B^l, B^m, B^u) is introduced as follows:


    ```

    μ_\tilde{B}(x) = { (x - B^l)/(B^m - B^l) ; (B^u - x)/(B^u - B^m) ; 0 }

    ```


    # 2.2.2 Fuzzy AHP


    In the 1970s, T.L. Saaty created the AHP approach (Liu, Eckert, and Earl 2020).
    The AHP that Saaty represents is known as a traditional AHP. AHP is a great strategy
    since it uses consistency measure to improve decision-making learning. The AHP
    technique is an MCDM methodology that examines the issue at many levels of hierarchy.
    Using a pairwise comparison matrix, this approach has the ability to identify
    quantitative and qualitative variables (Solangi, Longsheng, and Shah 2021). The
    pairwise comparison is the foundation of the AHP approach. The preferences are'
  merge: -1
  img_proc: true
