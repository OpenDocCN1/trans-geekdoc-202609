  md: '# 5.4 Model Implementation


    The applied approach being conducted is tested with a real-world issue about the
    selection of cloud services, which exhibits both its efficiency and accuracy.
    The primary objective of this chapter is to identify the cloud service that is
    superior to the others that are now accessible in terms of a number of different
    qualities and then choose that service as the most appropriate option. A genuine
    dataset that is used in the article (Jatoth, Gangadharan, and Fiore, 2017) has
    been used by our team. Running benchmark programs on a number of dynamically launched
    virtual machines (VMs) for a predetermined amount of time is what the Cloud Harmony
    dataset is used for in order to offer a performance assessment of various cloud
    services. In addition, the values of CPU, memory, disk performance, and I/O consistency
    of big cloud services based on various virtual cores are measured by this dataset.
    While collecting the data, we failed to consider the logically inconsistent data,
    which are defined as the data that are outside of the range or have very high
    values.


    Step 1: The problem was studied from all directions, and the main objective was
    determined, which is to evaluate some cloud service providers and the main dimensions
    affecting the selection of the best cloud service provider. In addition, four
    specialists were identified to collaborate with the authors, and four weights
    were assigned to determine each specialist’s impact: 0.2, 0.3, 0.3, and 0.2. In
    addition, the parameter was selected subjectively to represent the experts’ opinions
    on optimism and pessimism. In this instance, q=5 further illustrates the vagueness.


    Step 2: Five main dimensions have been identified that affect the selection of
    the best cloud service providers according to the opinions of experts and previous
    studies, which are CPU utilization, disk I/O consistency, disk utilization, memory
    utilization, and cost, and their abbreviations are CUTD1, DIOD2, SKUD3, MEMD4,
    and COSD5, respectively.


    Step 3: A final list of cloud service providers has been determined that will
    be evaluated according to the case study and according to the applicable study,
    namely, Azure, Soft Layer, Amazon, HP, Century Link, Google, Rackspace, Joynet,
    Linode, GoGrid, and City Cloud, and their abbreviations are CSP1, CSP2, CSP3,
    CSP4, CSP5, CSP6, CSP7, CSP8, CSP9, and CSP10, respectively.


    Step 4: A hierarchical structure of the problem is drawn to show the main objective
    of the problem, the dimensions that affect the problem, and the alternatives used
    as presented in Figure 5.3.


    Step 5: Linguistic terms and equivalent q-ROFNs are selected to prioritize the
    dimensions used as in Table 5.1. Also, some linguistic terminology and equivalent
    q-ROFNs have been defined to evaluate selected CSPs, as exhibited in Table 5.2.'
