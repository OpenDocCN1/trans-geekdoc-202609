    # 3.4 An Illustrative Example


    The performance evaluation of smart disaster response systems is used to illustrate
    the suggested paradigm. In the notion of smart cities, human existence has grown
    more intelligent as a result of vast technological development. One of the concerns
    of smart cities is a catastrophe response system. It has become vital to incorporate
    intelligence into disaster response systems to improve citizens’ quality of life
    and achieve more effective disaster response systems. A smart disaster response
    system is identical to several intelligent systems that offer intelligent services.
    The performance of intelligent systems must be evaluated from several perspectives
    in order to evaluate the system’s overall functioning and user satisfaction. In
    this chapter, the performance of the intelligent disaster response system will
    be assessed based on three dimensions: system usability, results and data management,
    and user activity. Accordingly, several smart disaster response systems were used
    in the assessment process, namely, SDRS1, SDRS2, SDRS3, SDRS4, SDRS5, SDRS6, and
    SDRS7.


    # 3.4.1 Model Implementation


    Step 1: Initially, four experts related to smart systems and decision-making were
    selected to help and collaborate with the authors in completing the questionnaires
    and data compilation. Communication with experts was conducted several times,
    including offline through interviews and online via the Internet.


    Step 2: The problem is organized in a hierarchical form between the objective,
    the main dimensions used, their sub-indicators, and the alternatives used, as
    presented in Figure 3.3.


    Step 3: Semantic terms and corresponding TFNs appropriate to express ambiguity
    in the problem are identified. First, some variables were presented to determine
    the priorities and weights of the main dimensions and sub-indicators, as presented
    in Table 3.1. Secondly, some variables were presented to evaluate the smart disaster
    response systems selected, as exhibited in Table 3.2.'
