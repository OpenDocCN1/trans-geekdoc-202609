- pgno: 81
  md: 'makes judgments based on true attributes. For example, in certain circumstances,
    human emotions are unreliable, and the analyst may be unable to apply accurate
    numerical values to examination judgments.


    # 2.2.3 Fuzzy VIKOR


    In MCDM, the VIKOR strategy is a more often used method for handling issues with
    many competing criteria. The low and simple computational steps are one of the
    reasons for this method’s high use for ranking alternatives compared to other
    MCDM approaches. The VIKOR technique offers and employs compromise solutions to
    rank alternatives based on incompatible and incompatible criteria. According to
    some writers, using a compromise solution is the method’s greatest benefit and
    strength compared to other techniques. The VIKOR technique is a compromise approach
    for ranking alternatives based on incompatible and incommensurable criteria (Opricovic
    and Tzeng 2004). The compromise solution refers to an approach that seeks a ranking
    order by balancing anticipated and pessimistic alternatives. Like other MCDM techniques,
    the VIKOR method may be integrated with fuzzy set theory (Hosseini, Paydar, and
    Hajiaghaei-Keshteli 2021). In the present chapter, we apply this technique to
    rank some of the smart health technologies.


    # 2.2.4 The Mathematical Steps of the Hybrid MCDM Framework


    The main steps of the hybrid approach, which combines the fuzzy AHP and fuzzy
    VIKOR methods, are briefly introduced as follows:


    +   - **Step 1:** A group of specialists is selected to share the basic information
    on the chosen problem of evaluating smart health technologies with the authors.
    Before all that, basic criteria must be established for the selection of specialists.
    First, the number of years of experience must not be less than 5 years in the
    field under study. Secondly, the academic degree of the participating specialists
    shall not be less than a master’s degree.

    +   - **Step 2:** The problem is carefully studied to determine the study’s main
    objective. Also, the main and sub-criteria affecting the problem are identified.
    Next, a range of smart health technologies is identified as alternatives.

    +   - **Step 3:** The problem is divided into several levels. The first level
    represents the main objective of the problem. The second level represents the
    basic criteria and their sub-factors that affect the selection of the best alternative.
    The third level represents the alternatives used, which are determined according
    to the problem.

    +   - **Step 4:** Linguistic terms and corresponding TFNs are identified for evaluating
    the main criteria and their sub-criteria as in Table 2.1. Also, linguistic terms
    and corresponding TFNs are selected to rank the selected alternatives as in Table
    2.2.'
