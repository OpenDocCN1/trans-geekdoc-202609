    This study conducted an evaluation of some public sector universities in one of
    the Arab countries on the basis of the sustainability criteria that were identified
    in the previous section. Thus, six smart campuses have been identified to be evaluated
    according to the approach used in this chapter, which is as follows: SC₁, SC₂,
