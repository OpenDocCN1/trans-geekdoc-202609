  md: 'Explanation 7.6. Let $\tilde{A}_i = (u_{\tilde{A}_i}, v_{\tilde{A}_i})$ $(i=1,
    2, ..., n)$ be set of IFNs, and $w = (w_1, w_2, ..., w_n)^T$ be weight vector
    of $\tilde{A}_i$ with $\sum_{i=1}^n w_i$; then, an intuitionistic fuzzy weighted
    average (IFWA) operator is established as in Eq. (7.13):


    $$\text{IFWA}(\tilde{A}_1, \tilde{A}_2, ..., \tilde{A}_n) = \left(\left(1 - \prod_{i=1}^n
    (1 - u_{\tilde{A}_i})^{w_i}\right), \prod_{i=1}^n v_{\tilde{A}_i}^{w_i}\right)
    \tag{7.13}$$


    Explanation 7.7. Let $\tilde{A}_i = (u_{\tilde{A}_i}, v_{\tilde{A}_i})$ $(i=1,
    2, ..., n)$ be set of IFNs, and $w = (w_1, w_2, ..., w_n)^T$ be weight vector
    of $\tilde{A}_i$ with $\sum_{i=1}^n w_i$; then, an intuitionistic fuzzy weighted
    geometric (IFWG) operator is established as in Eq. (7.14) (Xu and Yager, 2006):


    $$\text{IFWG}(\tilde{A}_1, \tilde{A}_2, ..., \tilde{A}_n) = \left(\prod_{i=1}^n
    u_{\tilde{A}_i}^{w_i}, 1 - \prod_{i=1}^n (1 - v_{\tilde{A}_i})^{w_i}\right) \tag{7.14}$$


    # 7.3 Methodology


    In this part, the model used to solve the problem of selecting the best sustainable
    resource is presented. The model used consists of two multi-criteria decision-making
    (MCDM) methods, the CRiteria Importance through Intercriteria Correlation (CRITIC)
    method, and the Combinative Distance-based ASsessment (CODAS) method. The model
    used is conducted under the IFS environment and using IFNS. Initially, the CRITIC
    method prioritizes criteria and determines their weights. Then, the CODAS method
    ranks and selects the best available alternatives. Figure 7.1 shows the steps
    of the approach used to evaluate several sustainable suppliers. In this regard,
    we provide a brief overview of the methods used in applying this chapter’s case
    study. This section is divided into several parts as follows.


    # 7.3.1 CRITIC Method


    CRITIC is a correlation-based approach that uses analytical testing to retrieve
    information underlying the decision criteria. It is well known that Diakoulaki,
    Mavrotas, and Papayannakis (1995) first introduced CRITIC to acquire objective
    weights in MCDM issues. It captures all preference'
