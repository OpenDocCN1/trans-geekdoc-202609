- pgno: 11
  md: '# Preface


    # Introduction


    Tiny sensors and processors may now be found in common things because of significant
    advancements and ongoing shrinking in computer technology. The dream of a smart
    environment is becoming a reality thanks to incredible advancements in fields
    such as portable appliances and devices, pervasive computing, wireless sensor
    networking, wireless mobile communications, machine learning–based decision-making,
    IPv6 support, human-computer interfaces, and agent technologies. A smart environment
    is a networked miniature world where sensor-enabled linked objects cooperate to
    improve the comfort of people’s lives. The terms smart and environment both relate
    to the capacity for independently acquiring and putting knowledge to use. As a
    result, a smart environment is one that has the ability to learn and use that
    information to adapt to the demands of its residents and enhance their experience
    in that environment. Integrating the Internet of Things (IoT) with smart surroundings
    has been the subject of several research projects. By enabling the user to monitor
    the environment from remote locations, the integration of IoT with a smart environment
    expands the possibilities of smart devices. Depending on the needs of the application,
    IoT may be integrated with various smart environments. Smart cities, smart homes,
    smart grids, smart buildings, smart transportation, smart health, and smart industries
    are the main categories into which the work on IoT-based smart environments may
    be divided.


    Despite the advancements in enabling IoTs while ensuring real-time monitoring,
    the application of decision analytics to find the sustained or most optimal option
    has not been explored in the relevant literature. For example, evaluating and
    then prioritizing a smart and sustainable city among many alternatives has not
    been a research focus in the smart environment–related literature. Governments
    and public organizations prioritize smart management practices in policies and
    programs for sustainable development, economic growth, and improved quality of
    life. As a result, selecting a smart and sustainable city should incorporate sustainable
    economic, social, and environmental goals, which is clearly a multi-criteria decision-making
    (MCDM) problem. Considering all those limitations in the existing knowledge area,
    this book has complied with different'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'MCDM techniques to assess, prioritize, and select the best possible smart environment
    among many of its competitors.


    The competitiveness of our proposed book lies in multiple facets. For example,
    our book is not only limited to a specific smart environment topic. It also has
    contents from waste management and disaster response systems to traditional supply
    chain management. In addition to conventional artificial intelligence-based approaches,
    this proposed book highlights the contributions of different optimization techniques,
    decision analytics (predictive and descriptive), and data science. This book will
    be the first in the literature to bridge the industrial engineering perspectives
    and computational intelligence for different digitalized (aka, smart) environments.


    # Contents


    This book is for undergraduate students, graduate students, researchers, and practitioners
    interested in the theory of multi-criteria analysis and its applications in management
    and engineering. This book develops intelligent machines to provide solutions
    to real-world problems that are not modeled or too difficult to model mathematically
    in smart applications. This book would be a reference for students seeking to
    attain a thorough knowledge in this field. Fresh researchers can take this book
    as a beginning point. In recent years, multi-criteria analysis has been widely
    used for decision-making purposes by institutions and enterprises.


    This book consists of eight chapters. A brief description of those chapters is
    as follows.


    # Chapter 1: An Innovative Framework to Evaluate Smart and Sustainable Cities
    Using Fuzzy MCDM Method


    This chapter aims to define the priorities of the dimensions of smart and sustainable
    cities and provide an idea of the areas in which smart and sustainable city planning
    should be invested and expanded. Furthermore, city or nation managers must draw
    comparisons among themselves using smart city characteristics’ priorities (weights),
    allowing them to identify benchmark possibilities. Furthermore, by using the city
    comparison data, officials in these cities should be able to identify areas that
    need development. This chapter proposes a multi-stage approach to assessing smart
    and sustainable city criteria. The proposed approach is based on applying the
    Analytical Network Process method and the Technique for Order of Preference by
    Similarity to Ideal Solution method (ANP-TOPSIS). In general, this chapter provides
    some recommendations for cities to understand'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'their position concerning other cities and to know what areas policymakers
    need to strengthen.


    # Chapter 2: A Conceptual Design and Evaluation Framework for Assessing Smart
    Health Technologies


    Through improved health applications, the adoption and implementation of developing
    smart health technology may improve living circumstances. The most important accomplishment
    in smart health solutions is the balanced application of technology and engagement
    in human-based systems. Poor healthcare technology has the potential to kill people.
    As a result, the region in which smart health technology will be implemented should
    be thoroughly analyzed before the most appropriate technology is chosen. Because
    these assessments are based on people’s desires and expectations, they might sometimes
    be hazy and imprecise. This chapter presents a paradigm for the healthcare industry
    regarding smart health technology selection and assessment. As a result, smart
    health technology assessment is treated as a multi-criteria decision-making (MCDM)
    issue. The MCDM area comprises ideas and methods for achieving the “best suitable”
    answer for a decision scenario that fulfills several competing criteria. It is
    both a strategy and a set of procedures or approaches for assisting individuals
    in making acceptable choices to their value judgments. A hybrid MCDM approach
    to evaluating smart health technologies has been presented. For this task, we
    find fuzzy AHP and fuzzy VIKOR methods to be the best approach to solve this problem,
    prioritize criteria, and rank selected alternatives.


    # Chapter 3: An Intelligent Approach for Assessing Smart Disaster Response Systems


    Disaster management is one of the most significant fields of study since it directly
    affects the quality of human life. One of the most important foundations of disaster
    management is responding to catastrophes in a way consistent with protecting residents’
    lives from their effects. Due to the significance of intelligent disaster response
    systems, their performance must be assessed using criteria that quantify the usefulness
    of these systems in various circumstances. As with other decision-making difficulties,
    evaluating smart disaster response systems is one of the decision-making challenges
    that provide difficulty under unpredictable settings. To account for any ambiguity
    in the assessment process, this chapter presents an integrated framework for evaluating
    the performance of the smart disaster response system in an uncertain environment.
    Multi-criteria decision-making (MCDM) is used for the issue of performance assessment
    based on a set of criteria. A hybrid methodology for assessing smart disaster
    response systems has been presented. For the purpose of this'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'task, we find the integration of the two methods, fuzzy Decision-Making Trial
    and Evaluation Laboratory (DEMATEL) and fuzzy Evaluation based on Distance from
    Average Solution (EDAS), which are very well-known approaches to prioritize the
    main dimensions and their sub-indicators and evaluate specific alternatives for
    an MCDM problem.


    # Chapter 4: A Facilitating Paradigm for Analyzing the Adaptation of Internet
    of Things Obstacles (IoTBs) to Waste Management in Smart Cities


    An IoT-enabled smart city is a viable option to meet the demands of urbanization;
    it has the ability to convert societies into smart communities by improving public
    services such as transportation, water management, smart buildings, healthcare,
    and education. This chapter intends to establish a knowledge of and analyze the
    level or severity of IoT hurdles impacting smart city waste management so that
    stakeholders may take proactive measures to install IoT-enabled technologies smoothly.
    This chapter aims to comprehend the IoT adoption situation of smart cities in
    underdeveloped nations and the different implementation issues that may be experienced.
    The building of an IoT network, with solid backing from services and technology,
    needs an integrated waste management control strategy for smart cities. Aside
    from the technological obstacles, a clear, standardized strategy for implementing
    IoT and an appropriate direction for smart city activities have not yet been offered.
    This chapter seeks to identify the key IoT obstacles (IoTBs) and their strengths
    as they pertain to trash management in smart cities. A multi-criteria decision-making
    (MCDM) technique was applied to accomplish these goals. The IoTBs are investigated
    using current literature and validated by specialists. Fuzzy DEMATEL examines
    the interaction between obstacles to demonstrate the intensity/strength of IoTBs
    impacting one another and managing waste management methods in smart cities.


    # Chapter 5: A Fusion Approach for Cloud Service Performance Assessment and Selection
    from Smart Data


    Cloud computing is a new way of allocating computer resources through the Internet.
    This computing paradigm delivers significant advantages to enterprises by relieving
    them of low-level activities associated with IT infrastructure setup and allowing
    them to start with limited resources and scale up as needed, freeing up time for
    innovation and the production of commercial value. Choosing a cloud service is
    an example of multi-criteria decision-making (MCDM), a process in which several
    aspects of QoS play an important part in the decision-making process. As a result,
    a more effective MCDM strategy could be necessary to cope with client'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'demands and rank cloud services according to their capabilities. In this chapter,
    we provide a systematic assessment approach for picking an ideal cloud service
    from a range of multiple comparable options, with the selection being made based
    on the QoS requirements associated with cloud services. Using this framework,
    customers can evaluate several cloud service providers according to their preferred
    choice and several other factors. This chapter proposes a hybrid MCDM approach
    for evaluating multiple cloud service providers (CSPs). The approach consists
    of two MCDM approaches: the entropy and the combined compromised solution (CoCoSo).
    The applied approach was carried out under the q-ROFS environment and using q-rung
    orthopair fuzzy numbers (q-ROFNs).


    # Chapter 6: An Evaluation Approach for Prioritizing Performance of Sustainability
    Indicators for Smart Campuses


    Higher education institutions have an urgent need to move toward adopting and
    establishing a smart framework employing spatial software for campus sustainability.
    Furthermore, the relevance and significance of building a smart spatial-based
    framework to analyze the appropriateness and sustainability performance of higher
    education institution campuses are derived from the worldwide adage “think globally,
    act locally.” A further rationale is a country-specific approach that offers a
    complete information repository for government and higher education institution
    managers. This chapter addresses this research vacuum by evaluating the relative
    relevance of spatial-based indicators that fit with the stakeholders’ degree of
    awareness and the nature of the local context in every given nation. This relative
    significance will assist the development of a method for smart university campuses
    to embrace the local environment to achieve a smart city objectively. An MCDM-blended
    approach is presented to prioritize sustainability indicators’ performance and
    assess the sustainability performance of smart campuses (SCs). The applied approach
    was carried out under q-rung orthopair fuzzy set (q-ROFS) environment and using
    q-rung orthopair fuzzy numbers (q-ROFNs). The approach used consists of two methods
    q-ROFS entropy and the q-ROFS Technique for Order of Preference by Similarity
    to Ideal Solution (q-ROFS TOPSIS).


    # Chapter 7: Sustainable Supplier Selection for Smart Supply Chain


    The phrase “sustainable supply chain management techniques” refers to a collection
    of tactical activities that may assist a corporation in achieving more sustainability
    in the economic, environmental, and social aspects of sustainability. These kinds
    of activities center on the process of implementing sustainable supply chain management,
    which significantly impacts the level of sustainability performance a firm achieves.
    It is'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'generally agreed upon that one of the most important aspects of sustainable
    supply chain management strategies is identifying sustainable vendors. This is
    because the activities of suppliers are essential to assisting downstream businesses
    in achieving a collaborative and sustained competitive advantage. In addition,
    the selection of a supplier may be thought of as a process of multi-criteria decision-making
    (MCDM), which is comprised of two stages: the calculation of the weights of the
    criteria and the ranking of the suppliers. The model used consists of two multi-criteria
    decision-making (MCDM) methods: the CRiteria Importance through Intercriteria
    Correlation (CRITIC) method and the Combinative Distance-based ASsessment (CODAS)
    method. The model used is conducted under the IFS environment and using IFNS.
    Initially, the CRITIC method prioritizes criteria and determines their weights.
    Then, the CODAS method ranks and selects the best available alternatives.


    # Chapter 8: Analyzing and Evaluating Smart Card Systems for Public Transportation


    The introduction of an integrated fare system has been met with several challenges.
    Formal public transportation services might sometimes be unreliable, inconvenient,
    or even dangerous in certain nations. As a result, many passengers are more inclined
    to utilize alternative modes of transportation provided by private companies.
    During the planning phase of the transition project, many elements of smart card
    systems, including all of their benefits and drawbacks for each kind of transportation,
    should be considered to ensure that the system is adopted in the most effective
    manner possible. Because of the nature of this kind of transition, it brings about
    contradictory goals. Because of this, the current problem area is suitable for
    applying multi-criteria decision-making (MCDM) methods since a dependable and
    rational decision support system is required to support authorities through the
    valuation of differences between the planned system and the existing one. It is
    essential to have access to a decision model in its own right for decision-makers
    to clearly understand the enhancements that may be accomplished by switching to
    a smart system. As a consequence, this chapter’s objective is to provide an MCDM
    framework that is both efficient and accurate in assessing and comparing the performance
    of various fare systems. The methodology is presented under an intuitionistic
    fuzzy environment. The methodology used consists of two MCDM methods, namely,
    the intuitionistic fuzzy CRiteria Importance through Intercriteria Correlation
    (IF-CRITIC) method and the Intuitionistic Fuzzy Preference Ranking Organization
    Method for Enrichment Evaluation II (IF-PROMETHEE II) method. The methodology
    used is performed under an intuitionistic fuzzy environment and using intuitionistic
    fuzzy numbers (IFNs).'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Authors


    **Mohamed Abdel-Basset** is an Associate Professor in the Faculty of Computers
    and Informatics, Zagazig University, Egypt. His work focuses on the application
    of multi-objective and robust metaheuristic optimization techniques. His current
    research interests include optimization, operations research, data mining, computational
    intelligence, applied statistics, decision support systems, robust optimization,
    engineering optimization, multi-objective optimization, swarm intelligence, evolutionary
    algorithms, and artificial neural networks.


    **Ripon K. Chakrabortty** is Program Coordinator for the Master of Decision Analytics
    and the Masters of Engineering Science Programs, and team leader of the Decision
    Support and Analytics Group at the School of Engineering and Information Technology,
    UNSW Canberra. His research interests cover a range of topics in operations research,
    project management, supply chain management, artificial intelligence, and information
    system management. Many organizations have funded his research programs.


    **Abduallah Gamal** is a Senior Researcher in the Faculty of Computers and Informatics
    in the Department of Operations Research at Zagazig University, Egypt. His research
    interests include computational intelligence, optimization, swarm intelligence,
    evolutionary algorithms, and neutrosophic sets and logic. He currently works on
    applying multi-criteria decision-making.'
  merge: -1
