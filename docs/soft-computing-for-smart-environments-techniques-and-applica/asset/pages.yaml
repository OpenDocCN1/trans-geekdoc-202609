    # 1.4 Application of the Suggested Methodology for the Case Study


    This part applies the suggested fuzzy ANP and fuzzy TOPSIS methodology to evaluate
    smart and sustainable cities. The cities assessed are as follows: Madrid, Paris,
    Berlin, Moscow, Hong Kong, Tokyo, Sydney, Los Angeles, Dubai, and New York, which
    are labeled City₁, City₂, City₃, City₄, City₅, City₆, City₇, City₈, City₉, and
    City₁₀, respectively. We will list the steps to implement the suggested approach,
    beginning with gathering data and determining the criteria to evaluate smart and
    sustainable cities.


    Step 1: A group of participants consisting of three experts in the field of smart
    sustainability have been identified. Experts collaborated with the authors throughout
    the research and study period.


    Step 2: A set of main and sub-criteria that affect the assessment of smart and
    sustainable cities have been identified. The main criteria identified are as follows:
    smart governance (SGC₁), smart economy (SCC₂), smart mobility (SMC₃), smart living
    (SLC₄), smart people (SPC₅), and smart environment (SEC₆). The sub-criteria determined
    are as follows: participation in decision-making (PDC₁₋₁), public and social services
    (SSC₁₋₂), transparent governance (TGC₁₋₃), innovative spirit (ISC₂₋₁), entrepreneurship
