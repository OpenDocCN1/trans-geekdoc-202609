  md: 'Step 15: Determine the positive and negative ideal solution A_j^* and A_j^-,
    respectively. If A_j are advantageous criteria, then A_j^* = max(A_ij) and A_j^-
    = min(A_ij). Then, if A_j are non-advantageous criteria, then


    A_j^* = min(A_ij) and A_j^- = max(A_ij)  (2.11)


    Step 16: Compute the group utility S_i by applying Eq. (2.12) and individual regret
    values R_i by applying Eq. (2.13) as follows:


    S_i = sum_{j=1}^{n} w_j * (A_j^* - A_ij) / (A_j^* - A_j^-)  (2.12)


    R_i = max [ w_j * (A_j^* - A_ij) / (a_j^* - A_j^-) ]  (2.13)


    w_j is the weight of all sub-criteria.


    Step 17: Compute the concordance index Q_j among the selected criteria and alternatives
    by applying Eq. (2.14).


    Q_j = v [ (S_i - S^*) / (S^- - S^*) ] + (1 - v) [ (R_i - R^*) / (R^- - R^*) ]  (2.14)


    where S^- = max_j S_j, S^* = min_j S_j, R^- = max_j R_j, R^* = min_j R_j, and
    v ∈ [0, 1] is generally 0.5.


    Step 18: Rank the smart health technologies in descending order according to the
    value Q_j computed by applying Eq. (2.14).


    Step 19: Conduct the two final necessities in the evaluation process of the smart
    health technologies by the VIKOR technique. Situation 1: (adequate advantage)
    by using Eq. (2.15):


    Q(A^2) - Q(A^1) ≥ 1 / (m - 1)  (2.15)


    where A^1 is rated as the top alternative rendering to Q and A^2 is rated second,
    and m is the count of substitutes. Situation 2 (appropriate stability): as the
    classification of Q, A^1 must be the maximum in the ranking of S and R. If one
    of the conditions is not changed, there is a set of explanations as follows:


    +   - If situation 2 is not chanced, then A^1 and A^2 are a compromise solution.'
