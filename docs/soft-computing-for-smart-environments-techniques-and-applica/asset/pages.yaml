  md: '# 5.3.1 Entropy Method


    Shannon and Weaver came up with the idea for the entropy weight technique in 1947,
    which is a weighing approach that evaluates the value dispersion that occurs during
    decision-making (Chodha et al., 2022). The entropy weight approach is used to
    determine the objective weights of the criteria and characteristics. Probability
    theory is used whenever uncertain information has to be computed (entropy) (Vaid
    et al., 2022). It evaluates the significance of each answer parameter independently,
    without taking into account the preferences of the individual making the decision.
    A higher weight index value is considered to have a greater value than a lower
    weight index value from the standpoint of the entropy weight measuring system.
    This method begins with determining the objectives (decision matrix), followed
    by determining the normalized decision matrix, the probability of the criteria
    or attribute occurring, the entropy value of the criteria or attribute, the degrees
    of divergence produced by each response, and finally, the entropy weight.


    # 5.3.2 CoCoSo Method


    In the CoCoSo technique, options are ranked according to compromise methods derived
    from the Weighted Sum Model (WSM) and Weighted Product Model (WPM) (Deveci, Pamucar,
    and Gokasar, 2021). As a result of a compromise, the final criteria function on
    which the ranking of alternatives is based was determined. It demonstrates that
    a combination of compromise tactics delivers objective outcomes when the ratings
    of options in the initial choice matrix have consistent values. However, when
    extreme values arrive at the location of the most important criterion in the initial
    choice matrix, the values of the WSM and WPM functions undergo drastic modifications
    (Torkayesh et al., 2021). This results in a disproportionate rise in the value
    function of the criteria for the evaluated option. Extreme values in the first
    choice matrix may develop for a variety of causes, including, but not limited
    to, disproportional disparities between the examined options, measurement mistakes,
    and biased specialist judgments (deliberate or accidental). Another drawback of
    WSM and WPM aggregation is that they disregard the interrelationships and reciprocal
    impact between the criteria.


    # 5.3.3 Computational Steps of the Applied Approach


    The computational steps of the approach used in the problem presented in this
    chapter are presented as follows:


    **Step 1:** The target case is carefully studied from all directions, and the
    most important key dimensions that affect the evaluation of cloud service'
