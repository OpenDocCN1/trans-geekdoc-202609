    entered in order to compare reasonably. It offers a practical answer. However,
    there is a rigorous consistency criterion to maintain the reasonableness of preference
    intensities between the compared items. In actual life, this condition for Saaty’s
    matrix is difficult to meet. Instead of the consistency criterion, Jandová and
    Talasová (2013) portrayed a weak consistency condition. The weak consistency criteria
    are quite natural and appropriate for Saaty’s scale linguistic descriptions. Another
    difficulty with the AHP is that it'
