- pgno: 261
  md: '# TABLE 8.8


    Description of Criteria


    | Criteria | Description |

    |---|---|

    | Transaction time, RRC₁ | The amount of time, in seconds that an individual user
    spends interacting with a system. |

    | Dwell time, DTC₂ | The amount of time, measured in seconds, that a public transportation
    vehicle’s door is left open at a certain stop. |

    | On-time performance, OTC₃ | A metric that is used to measure the capacity of
    different transport providers to arrive punctually at their respective destinations.
    It is a metric that may assess the presence of real-time information delivered
    to consumers and the correctness of that information. |

    | Ridership, RSC₄ | The total number of people using a certain mode of transportation
    at any given time. It gauges how easily the service may be used. |

    | Service reliability, SRC₅ | This system performance indicator calculates how
    likely it is that the system will fulfill a set of predetermined performance requirements.
    |

    | Service coverage, SOC₆ | The percentage of persons that may potentially benefit
    from the services that are being provided. This measure is connected to the number
    of different implementations of the system that are available. |

    | Safety, STC₇ | Examines how individuals feel about the many different payment
    methods, considering the importance of data and privacy protections for personal
    information and financial transactions. |

    | Security, SEC₈ | Assesses the degree of security mechanisms that have been put
    on infrastructure, as well as the efficiency with which these systems function.
    |

    | Transfer time/ delay, TTC₉ | The average amount of time, measured in minutes,
    is spent by riders of public transportation, which make their journey utilizing
    a combination of more than one method of transit and/or route. |

    | Transit time reliability, TRC₁₀ | The accuracy of the estimated travel time
    is calculated based on the frequency distribution of the departure and arrival
    timings. |


    **Step 3:** Based on the aspects of the problem, its goal, its criteria, and its
    alternatives, a hierarchical form of the problem was built as in Figure 8.2. **Step
    4:** Some linguistic terms were provided to help experts in evaluating the criteria
    as in Table 8.1. Also, some linguistic terms were provided to help experts in
    arranging the alternatives as in Table 8.2. **Step 5:** The decision matrices
    rendering to experts’ estimations (E₄) were created to appraise the criteria by
    each expert by utilizing linguistic terms created in Table 8.1 as exhibited in
    Table 8.9, and then by using IFNs according to Table 8.3 as presented in Table
    8.10. **Step 6:** The separate expert valuations on criteria were combined by
    applying IFWG operator in Eq. (8.1) according to Table 8.4 as presented in Table
    8.11.'
