    The TOPSIS technique was created by Hwang and Yoon in 1981 (Yoon and Hwang 1985).
    The goal of this strategy is to find the positive and negative gaps between appropriate
    and inappropriate solutions. The TOPSIS approach is an important MCDM method that
    has been utilized by many researchers, policymakers, stakeholders, and academics
    across a wide range of disciplines. However, since it fails to offer succinct
    information on the topic and contains ambiguous and undefined difficulties, this
