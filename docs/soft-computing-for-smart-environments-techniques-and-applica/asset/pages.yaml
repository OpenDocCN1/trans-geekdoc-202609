  md: '# 5.3 Model


    This section presents the steps of a hybrid MCDM approach for evaluating multiple
    cloud service providers (CSPs). The approach consists of two MCDM approaches:
    the entropy and the combined compromised solution (CoCoSo). The applied approach
    was carried out under the q-ROFS environment and using q-rung orthopair fuzzy
    numbers (q-ROFNs). Figure 5.2 shows the steps of the approach used in evaluating
    several CSPs. The approach is divided into three parts: data aggregation, determination
    of criteria weights using the entropy technique, and arranging the used alternatives
    according to their importance using the CoCoSo technique. In this regard, we provide
    a brief overview of the methods used in applying the case study for this chapter.
    This section is divided into several parts as follows.


    ![](img/601db3e97ac605d993053e21bf375150_176_0.png)


    FIGURE 5.2


    Diagrammatic representation of the applied approach for choosing cloud services.'
