    environmental, and social. The sub-factors that influence the solution of the
    problem have also been identified, namely, cost decreasing by smart technologies
    factor, product quality enhancement based on big data analytics factor, smart
    delivery to customer factor, improvement of supply flexibility factor, green design
    in a digital way factor, green purchasing based on a digital platform factor,
    green and smart manufacturing factor, green and smart logistics factor, smart
    working environment factor, employee’s improvement in a smart atmosphere factor,
    and social activities for encouraging smart technologies factor.


