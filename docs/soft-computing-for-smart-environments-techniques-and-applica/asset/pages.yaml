    # 8.3 Model Implementation


    The purpose of this chapter is to differentiate and verify some of the benefits
    of smart card systems that have been described in the literature. This will be
    accomplished by accurately comparing the old fare and smart card systems using
    opposing criteria. In light of this, the MCDM analysis takes into consideration
    not only the conventional system but also four other smart card systems, each
    of which has a distinct set of capabilities. In order to conduct an objective
    analysis, the technological parameters of the contactless smart cards have been
    standardized.


    Step 1: The problem was studied, and the main objective was determined, which
    is the analysis and evaluation of smart card systems, in addition to determining
    the main criteria that affect the selection of the best smart card system. Also,
    four experts agreed to participate in data collection, and an effective weight
    for each expert was determined as 0.2, 0.3, 0.3, and 0.2.


    Step 2: A set of five alternatives have been identified to be used in the evaluation
    process, including the traditional fare system and four smart card systems, namely,
    traditional fare system, smart card system 1, smart card system 2, smart card
    system 3, and smart card system 4 which are referred to by the following abbreviations
    SMS₁, SMS₂, SMS₁, SMS₂, and SMS₁, respectively. Also, a set of criteria were defined
    to evaluate the selected alternatives, as mentioned in Table 8.8.'
