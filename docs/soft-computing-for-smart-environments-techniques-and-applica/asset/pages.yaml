- pgno: 251
  md: '# 8


    # Analyzing and Evaluating Smart Card Systems for Public Transportation


    # 8.1 Introduction


    The choice regarding the expansion of public transportation is a difficult one,
    as it will have short-term and long-term major repercussions in terms of both
    the economy and the environment. The people in charge of making decisions need
    to consider a number of physical and intangible variables and investigate a number
    of potential enhancements. The demand for public transportation is growing worldwide,
    making it more essential than ever to have a standardized and interconnected public
    transit network. Public transportation is gaining more and more users as a result
    of a rise in population, an increase in the price of gasoline, an increase in
    the number of carbon emissions produced, and global warming. In recent years,
    an increasing number of countries have adopted a contactless smart card system
    as a mode of payment in public transportation services. These countries have done
    so on a large scale by integrating smart card systems across the country or on
    a small- to medium-scale capacity by integrating smart card systems in specific
    cities. In particular, the relevance of contactless payment systems increased
    during the pandemic because of their capacity to eliminate the need for direct
    contact with money and keypads, reducing the likelihood of contracting the COVID-19
    virus. Traditional paper tickets and magnetic cards are being phased out in favor
    of smart card systems, which are electronic devices that may store data and be
    used to process it as necessary. These systems are portable and durable. These
    systems need an automated fare collection and administration system in all of
    the public transportation hubs and provide consistent service throughout the city.
    Standards for Industry 4.0 also encourage economies to use already available technology,
    such as the Internet of Things (IoT). IoT enables numerous domains of innovation,
    and these innovations provide many chances for integrating smart cards into public
    transit networks. In many countries, the use of a contactless travel smart card
    has'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'become more prevalent, encompassing practically all forms of transportation
    and creating an integrated public transit system. These smart cards are also referred
    to as city cards.


    Fare-collecting automated systems provide customers and operators with a convenient
    and dependable service. The provision of a public transportation system that is
    both efficient and effective is a critical component to the achievement of success
    and the maintenance of sustainability in urban transport. Taking advantage of
    public transportation is important because it helps reduce traffic congestion
    during rush hours, shortens the total time spent during journeys, and improves
    the passenger experience. As a result, public transport authorities are encouraged
    to invest in technologies that improve the service quality of public transportation.
    As a result, transportation authorities that are working toward comparable objectives
    are attempting to include smart card systems into the fare collection procedures
    of public transit. Integrating these systems improves service quality by reducing
    the amount of time spent on at least the processes of payment, ticketing, and
    boarding. This indirectly prevents excess carbon emissions caused by transportation
    vehicles that are idling while waiting for payment processes.


    In order to construct an efficient nationwide integrated transportation system,
    intelligent systems such as those that use smart cards, for example, must be put
    in place. A complete purpose of an intelligent transport system is to enhance
    the operations of transportation systems, which will support the goals of improving
    efficiency and production in all areas. This improvement will be made possible
    by using an intelligent transport system. It is the goal of an integrated transportation
    system to achieve seamless cooperation between the various modes of transportation
    and create a clear and transparent system, with standardized fees and operating
    conditions for all kinds of transportation. Customers will benefit from an environment
    that is both secure and quick to pay, thanks to an efficient fare payment and
    administration system, which will also increase public transportation usage. As
    a consequence of greater customer satisfaction and time savings during payment
    and transit operations, adopting smart systems helps improve the utilization rate
    of public transportation systems. This improvement is brought about by an increase
    in the usage rate of public transportation systems.


    Nevertheless, the introduction of an integrated fare system has been met with
    several challenges. In certain nations, formal public transportation services
    might sometimes be unreliable, inconvenient, or even dangerous. As a result, many
    passengers are more inclined to utilize alternative modes of transportation provided
    by private companies. During the planning phase of the transition project, many
    elements of smart card systems, including all of their benefits and drawbacks
    for each kind of transportation, should be considered to ensure that the system
    is adopted in the most effective manner possible. Because of the nature of this
    kind of transition, it brings'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'about contradictory goals. Because of this, the current problem area is suitable
    for the application of multi-criteria decision-making (MCDM) methods since a dependable
    and rational decision support system is required to support authorities through
    the valuation of differences between the planned system and the existing one.
    It is essential to have access to a decision model in its own right for decision-makers
    to have a clear understanding of the enhancements that may be accomplished by
    switching to a smart system. As a consequence of this, the objective of this chapter
    is to provide an MCDM framework that is both efficient and accurate in order to
    assess and compare the performance of various fare systems.


    # 8.2 Methodology


    In this section, a methodology is presented to solve the problem of analyzing
    and evaluating smart card systems for public transportation. Also, the methodology
    is presented under an intuitionistic fuzzy environment. The methodology used consists
    of two MCDM methods, namely, the intuitionistic fuzzy CRiteria Importance through
    Intercriteria Correlation (IF-CRITIC) method and the intuitionistic fuzzy Preference
    Ranking Organization Method for Enrichment Evaluation II (IF-PROMETHEE II) method.
    The methodology used is performed under an intuitionistic fuzzy environment and
    using intuitionistic fuzzy numbers (IFNs). The methodology is divided into three
    stages. The first stage expresses the collection of data and the identification
    of final alternatives and evaluation criteria. The second stage is the stage of
    determining the priorities and weights of the criteria used in evaluating the
    selected alternatives using the IF-CRITIC method. The third stage is the stage
    of ranking the available alternatives according to their criteria using the IF-PROMETHEE
    II method. Figure 8.1 shows the steps of the methodology used to analyze and evaluate
    smart card systems for public transportation. Also, we provide a brief overview
    of the methods used in the methodology used. This section is divided into several
    parts as follows.


    # 8.2.1 PROMETHEE Method


    The PROMETHEE approach of MCDM is one that is well known and widely used. Brans
    was the one who first devised this methodology, and Vincke and Brans went on to
    refine it further (Brans and Vincke 1985). When compared to other multi-criteria
    techniques, the PROMETHEE ranking strategy is quite straightforward (Brans, Vincke,
    and Mareschal 1986). PROMETHEE is an outranking approach that is a methodology
    that uses binary relations to compare alternatives via weak preference'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/601db3e97ac605d993053e21bf375150_254_0.png)


    # FIGURE 8.1


    General illustration of the problem.


    (Agrawal 2021). Examples of phrases that are used in PROMETHEE are “as least as”
    and “as excellent as.” In order to successfully implement PROMETHEE, two different
    kinds of information are required. First are the weights, and then, there is the
    preference function of the decision-maker (Chai and Ngai 2020). The two variants
    of PROMETHEE that see the most application in the realm of research are PROMETHEE
    I and PROMETHEE II. On the contrary, PROMETHEE I only gives a partial ranking
    of the decision alternatives, whereas PROMETHEE II gives a full ranking of all
    of the options. In the course of this investigation, PROMETHEE II was designed
    to obtain credible outcomes by determining an exhaustive ranking of alternatives
    offered by providers. The PROMETHEE II approach is appropriate for addressing
    the MCDM issue (Goswami and Behera 2021).


    # 8.2.2 Mathematical Model


    In this part, the steps of the methodology used are presented, starting from the
    steps of data collection to the steps of determining the weights of the criteria
    and arranging the alternatives.


    Step 1: The case is to be studied from all dimensions, and the points affecting
    understanding the problem are determined. After that, the'
