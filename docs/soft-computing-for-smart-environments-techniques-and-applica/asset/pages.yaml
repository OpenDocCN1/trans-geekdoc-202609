- pgno: 19
  md: '# 1


    # An Innovative Framework to Evaluate

    Smart and Sustainable Cities

    Using Fuzzy MCDM Method


    # 1.1 Introduction


    Because of its scale and complexity, the notion of a sustainable and smart city
    is one of the most significant problems in today’s public policy. Cities were
    regarded as the major factors that may bring answers to the world’s difficulties
    during the UN-HABITAT-organized Seventh World Urban Forum (WUF7). The relevance
    of cities in terms of a sustainable future, equality, and quality of life was
    the emphasis of this organization. A unique section on “the need to integrate
    critical subjects for sustainable cities and human settlements in the post-2015
    Development Agenda” was added to the WUF7 declaration. Since the beginning of
    the twenty-first century, the popularity of the “smart and sustainable city” idea,
    which arose in the 1990s, has continuously increased. Even in Asia, Latin America,
    and Africa, there are numerous megacities with populations exceeding 20 million
    people when urban growth is considered on a global basis. They are responsible
    for over 80% of global GDP. They also use 80% of the world’s energy and produce
    at least 70% of carbon emissions.


    According to a United Nations Population Fund projection from 2008, 70% of the
    world’s population will be living in cities by 2050. Around 828 million people
    are believed to be living in substandard housing, and this figure is continuously
    rising. These issues pose several issues in city planning, growth, and operation.
    As a result, while developing action plans, city and nation administrators must
    think of innovative ways to improve their cities’ economic activity, energy consumption,
    environmental conditions, and quality of life. Because they offer services using
    ICT infrastructure, several cities are classified as smart cities. Furthermore,
    creating sustainable and smart cities requires providing citizens with the satisfying
    and flexible job and business possibilities, safe and affordable housing, a more'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'democratic society, transparent government, and a productive economy. It also
    entails investing in public transportation, increasing the proportion of green
    areas, and undertaking urban planning and governance via participatory mechanisms
    that allow all inhabitants to engage. Information city, sustainable city, talented
    city, wired city, digital city, and eco-city are all connected to the smart city
    idea.


    The California Institute for Smart Communities was one of the first groups to
    concentrate on how cities may be constructed to integrate information technology
    and how communities can be smart. The phrase “smart and sustainable city” is often
    used in the area of urban planning as a policy instrument. Smart management practices
    are prioritized by governments and public organizations in policies and programs
    for sustainable development, economic growth, and improved quality of life. As
    a result, smart and sustainable city methods should incorporate sustainable economic,
    social, and environmental goals. It’s also challenging to assess the success of
    smart and sustainable city features and dimensions. Many academics have used indicators-based
    methodologies to analyze the characteristics of urban smartness and sustainability,
    especially in recent years. They also attempted to use these strategies to bring
    these aspects together and assess worldwide cities. These studies attempt to compare
    a variety of global cities using various weighting techniques and a variety of
    smart and sustainable city features using a number of indicators ranging from
    20 to 80.


    This chapter aims to define the priorities of the dimensions of smart and sustainable
    cities, as well as to provide an idea of the areas in which smart and sustainable
    city planning should be invested and expanded. Furthermore, city or nation managers
    are required to draw comparisons among themselves using the priorities (weights)
    of smart city characteristics, allowing them to identify benchmark possibilities.
    Furthermore, by using the city comparison data, officials in these cities should
    be able to identify areas that need development.


