  md: '# 3.3.3 The Computational Steps of the Proposed Approach


    **Step 1:** A group of experts is identified to assist the authors and share information
    on assessing smart disaster response systems. Certain considerations are made
    in selecting experts according to the problem and its degree of importance. Let
    E = {E1, E2, ..., EK} be a set of experts, where EK denotes the kth expert, k=1,
    2, ..., K. K is the total number of experts.


    **Step 2:** The problem is organized as a whole so that the main objective of
    the problem is shown. Also, the most important influential dimensions and sub-indicators
    are selected. Besides, alternatives that can enter the evaluation process are
    negotiated.


    **Step 3:** Linguistic terms and corresponding appropriate fuzzy numbers are identified
    to prioritize key dimensions and sub-indicators, as presented in Table 3.1. Also,
    linguistic terms and corresponding suitable fuzzy numbers are identified to evaluate
    the selected alternatives, as exhibited in Table 3.2.


    **Step 4:** Construct a pairwise comparison matrix (D) between the dimensions
    and itself by each expert as in Eq. (3.1) by using the semantic terms in Table
    3.1 and then by using triangular fuzzy numbers (TFNs) as proved in Eq. (3.2).


