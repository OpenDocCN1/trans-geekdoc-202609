    # 2.5 Summary


    +   - This chapter provides a comprehensive description of smart health technologies.

    +   - This chapter reviews the importance and needs of assessing smart health
    technologies.

    +   - This chapter presents the most important criteria used in evaluating smart
    and sustainable health technologies after a comprehensive analysis of a number
    of research articles.

    +   - This chapter suggests an integrated fuzzy linguistic MCDM framework to assess
    smart health technologies. The fuzzy Analytic Hierarchy Process weights the criteria
    (AHP), and alternatives are ranked with the fuzzy VIseKriterijumska Optimizacija
    I Kompromisno Resenje (VIKOR) method.

    +   - This chapter presents a real case study evaluating a number of smart health
    technologies around the world.'
