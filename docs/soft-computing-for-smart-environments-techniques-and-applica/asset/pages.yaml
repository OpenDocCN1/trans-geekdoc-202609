- pgno: 169
  md: '# 5


    # A Fusion Approach for Cloud Service Performance Assessment and Selection from
    Smart Data


    # 5.1 Introduction


    Cloud computing is a new way of allocating computer resources through the Internet.
    This computing paradigm delivers significant advantages to enterprises by relieving
    them of low-level activities associated with IT infrastructure setup and allowing
    them to start with limited resources and scale up as needed, freeing up time for
    innovation and the production of commercial value. The advent of distributed computing
    sparked a boom in the development of cloud computing, which has continued to thrive.
    Cloud computing is a new paradigm in Internet-based computing that is adaptable
    and transforms how computing, storage, and service solutions are implemented.
    Cloud computing has made it possible to provide three primary service models:
    Infrastructure as a Service (IaaS), Software as a Service (SaaS), and Platform
    as a Service (PaaS). These models have been developed to cater to each customer''s
    specific requirements. Cloud computing is often broken down into three categories:
    public, private, and hybrid clouds. The deployment methodologies determine these
    categories.


    In today''s world, moving apps, data, and/or infrastructure to the cloud is a
    process that is almost certain to be difficult. The use of cloud computing is
    hampered by a number of barriers that prohibit it from delivering all of its promised
    benefits. These challenges are due to the fact that existing applications, data,
    and/or infrastructure have certain requirements and settings that the cloud provider
    must meet. Those challenges may be broken down into three categories. Each system
    in an organization has its own configuration performance and elements that impact
    workload parameters. This is true from the standpoint of an organization. Additionally,
    each cloud service provider provides its services with a variety of characteristics
    such as performance, affordability, and security'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'options to choose from. Because of this, it may be difficult for businesses
    to choose the cloud service provider that offers the features and capabilities
    that are the most suitable for their needs.


    In its most basic form, cloud computing is the provision of virtual services across
    a network. These services may then be used by users anywhere in the world on a
    pay-per-usage basis, with the amount of payment being determined by the customers''
    desired quality of service (QoS). Because of the cloud''s inherent flexibility
    and agility, top software companies such as Microsoft, Amazon, and Google now
    have the chance to move their present operations onto the cloud and expand their
    customer base as a result. It should come as no surprise that clients have various
    choices when it comes to selecting the finest cloud service providers to meet
    their QoS requirements, given the vast number of cloud service providers from
    whom they may choose. Because of the enormous progress made in cloud computing
    and the growing number of people using it, it is necessary to develop cloud service
    selection approaches that are both efficient and accurate on a worldwide scale.
    This is because raising the level of confidence between customers and service
    providers requires both parties to make an appropriate choice of a cloud service
    provider that meets their requirements. In this context, the key performance indicators
    (KPIs) for assessing cloud services are provided by the service measurement index
    (SMI), which is produced by the Cloud Service Measurement Initiative Consortium
    (CSMIC).


    Choosing a cloud service is an example of multi-criteria decision-making (MCDM),
    a process in which several aspects of QoS play an important part in the decision-making
    process. As a result, a more effective MCDM strategy could be necessary to cope
    with client demands and rank cloud services according to their capabilities. In
    this chapter, we provide a systematic assessment approach for picking an ideal
    cloud service from a range of multiple comparable options, with the selection
    being made based on the QoS requirements associated with cloud services. Using
    this framework, customers can evaluate several cloud service providers according
    to their preferred choice and several other factors.


    # 5.2 Mathematical Preliminary


    # 5.2.1 Inceptions


    Intuitionistic fuzzy sets (IFSs), Pythagorean fuzzy sets (PFSs), and q-rung orthopair
    fuzzy sets (q-ROFSs) are all terms that are discussed in this part, along with
    the associated ideas, techniques, and essential definitions.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 5.2.1.1 Intuitionistic Fuzzy Sets (IFSs)


    IFSs were first established by Atanassov in 1986 as an extension of fuzzy set
    theory. IFSs are separated from one another by the grade of membership and the
    grade of non-membership, the sum of which must be 1 or less than 1. This is addressed
    in detail in Explanation 5.1, which can be found in Atanassov (1999) and Alkan
    and Kahraman (2021).


    **Explanation 5.1:** Let be Y a constant set. An IFS ~E in Y is an object having
    the formula specified by:


    ~E = { (Y, U~E(Y), v~E(Y)) | Y ∈ Y } (5.1)


    where the function U~E: Y → [0, 1] designates the degree of membership of a component
    to the sets ~E, and v~E: Y → [0, 1] designates the degree of non-membership of
    a component to the sets ~E, with the condition that:


    0 ≤ U~E(Y) + v~E(Y) ≤ 1, for ∀ Y ∈ Y (5.2)


    The degree of uncertainty is computed as follows:


    π~E(Y) = 1 - U~E(Y) - v~E(Y) (5.3)


    **Explanation 5.2.** Let ~A = (U~A, v~A) and ~B = (U~B, v~B) be two intuitionistic
    fuzzy numbers (IFNs); then, the addition and multiplication procedures on these
    two IFNs are as follows:


    ~A ⊕ ~B = (U~A + U~B - U~A U~B, v~A v~B) (5.4)

    ~A ⊗ ~B = (U~A U~B, v~A + v~B - v~A v~B) (5.5)


    # 5.2.1.2 Pythagorean Fuzzy Sets (PFSs)


    In order to extend the capabilities of the IFSs, Yager created PFSs (Yager, 2013).
    It has two different membership degrees, which are referred to as membership and
    non-membership, respectively. In PFSs, the sum of the membership grade and the
    non-membership grade is considered; in IFSs, only the membership grade is considered.
    There is a possibility of having more than one membership grade and non-membership
    grade in PFSs. PFSs are clarified as specified in Explanation 5.3.


    **Explanation 5.3:** Let be Y a constant set. A PFS ~P in Y is an object having
    the formula assumed by:


    ~P = { (Y, U_P(Y), v_P(Y)) | Y ∈ Y } (5.6)'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'where the function $\mathcal{U}_p: Y \to [0,1]$ designates the degree of membership
    of a component $Y \in Y$ to the sets $\tilde{P}$, and $\vartheta_p: Y \to [0,1]$
    designates the degree of non-membership of a component $Y \in Y$ to the sets $\tilde{P}$,
    with the condition that:


    $$0 \le (\mathcal{U}_p(Y))^2 + (\vartheta_p(Y))^2 \le 1, \text{ for } \forall
    \ Y \in Y \tag{5.7}$$


    The degree of vagueness is calculated as follows:


    $$\pi_p(Y)=\sqrt{1-\mathcal{U}_p(Y)^2-\vartheta_p(Y)^2} \tag{5.8}$$


    **Explanation 5.4:** Let $\tilde{P}_1=\mathcal{U}_{P_1},\vartheta_{P_1}$ and $\tilde{P}_2=\mathcal{U}_{P_2},\vartheta_{P_2}$
    be two Pythagorean fuzzy numbers (PFNs); then, the addition and multiplication
    procedures on these two PFNs are as follows:


    $$\tilde{P}_1 \oplus \tilde{P}_2 = \left(\sqrt{\mathcal{U}_{P_1}^2+\mathcal{U}_{P_2}^2-\mathcal{U}_{P_1}^2\mathcal{U}_{P_2}^2},\vartheta_{P_1}\vartheta_{P_2}\right)
    \tag{5.9}$$


    $$\tilde{P}_1 \otimes \tilde{P}_2 = \left(\mathcal{U}_{P_1}\mathcal{U}_{P_2},\sqrt{\vartheta_{P_1}^2+\vartheta_{P_2}^2-\vartheta_{P_1}^2\vartheta_{P_2}^2}\right)
    \tag{5.10}$$


    # 5.2.1.3 q-Rung Orthopair Fuzzy Sets (q-ROFSs)


    In 2018, Yager gave presentations on q-ROFSs, in which grades of membership and
    non-membership were given. When using q-ROFS, the sum of the q$^{th}$ powers of
    both the membership and non-membership grades must not be more than 1 (Yager,
    2017). It is easy to see in Figure 5.1 that q-ROFSs have a membership degree extent
    that is much higher than that of IFSs and PFSs. q-ROFSs are clarified as specified
    in Explanation 5.5.


    **Explanation 5.5:** A q-ROFS $\tilde{Q}$ in a finite universe of discourse $Y
    = Y_1,Y_2,...,Y_n$ is cleared by Yager as follows (Yager, 2017):


    $$Q = \{\left(Y,\mathcal{U}_Q(Y),\vartheta_Q(Y)\right) | Y \in Y\} \tag{5.11}$$


    where the function $\mathcal{U}_Q: Y \to [0,1]$ describes the degree of membership
    of a component $Y \in Y$ to the sets $\tilde{Q}$, and $\vartheta_Q: Y \to [0,1]$
    describes the degree of non-membership of a component $Y \in Y$ to the sets $\tilde{Q}$,
    with the state that:


    $$0 \le \mathcal{U}_Q(Y) + \vartheta_Q(Y) \le 1, \text{ for } \forall \ Y \in
    Y \tag{5.12}$$'
