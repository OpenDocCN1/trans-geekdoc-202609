    # FIGURE 5.5


    Final ranking of the available CSPs.


    +   - This chapter reviews the importance and needs of assessing cloud service
    performance and smart data selection for cloud computing.

    +   - This chapter presents the most important criteria used in evaluating cloud
    service performance and smart data selection for cloud computing after a comprehensive
    analysis of a number of research articles.

    +   - This chapter suggests the steps of a hybrid MCDM approach for evaluating
    multiple cloud service providers (CSPs). The hybrid approach consists of two advanced
    MCDM techniques: entropy and the combined compromised solution (CoCoSo).

    +   - This chapter presents a real case study while evaluating cloud service performance
    and smart data selection for cloud computing.


