  md: '# 4


    # A Facilitating Paradigm for Analyzing the Adaptation of Internet of Things Obstacles
    (IoTBs) to Waste Management in Smart Cities


    # 4.1 Introduction


    The smart city is touted as a potential solution to the problems caused by urbanization
    in developing countries. In the last two decades, the relevance of smart cities
    has increased, and their progressive techniques are seen as an essential prerequisite
    for emerging countries. Numerous studies have attempted to describe the notion
    of a smart city, with the majority conceptualizing it as a multi-dimensional system
    designed to create sustainable communities. Smart cities need the combination
    of ICT and Internet technologies to change their design in diverse forms such
    as sophisticated infrastructure, transportation, environment, healthcare, and
    government to create a sustainable ecosystem. A smart city is the confluence of
    ICT technologies, sustainability, and technical, social, and economic performance
    metrics. The key stakeholders are government, service providers, policymakers,
    people, and developers. The Internet of Things (IoT) is the most significant technical
    breakthrough driving smart city projects worldwide. IoT-enabled technologies serve
    as a catalyst for the development of metropolitan communities to improve infrastructure,
    waste management, transportation, and the quality of human life. IoT technology
    should supply upgraded services and revamp current procedures in smart cities.
    A network, scalability, heterogeneity, coverage, and end-user interaction form
    the basis of the architecture of an IoT-enabled smart city.


    The United Nations projects that by 2050, about two-thirds of the world’s population
    will be urbanized (Mishra et al., 2022). Therefore, infrastructure and other far-reaching
    services will be required to meet the needs of an urbanized population. Suppose
    a city’s population expands at a pace of 3–5 percent per year. In that case, the
    quantity of garbage'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'created will double every decade, creating a dire scenario for smart cities
    and a significant financial burden for collection, disposal, and recycling. Prior
    research has shown that waste management is a significant problem for urban populations
    and that developing a sustainable environment is required to mitigate the danger
    to urban life.


    Both developed and developing countries use Internet technologies to promote sustainable
    growth and economic development. Despite the presence of several elements, the
    development of smart cities is an increasing part of economic growth and a means
    of meeting the requirements of the people. Developed countries have access to
    modern technology, enough resources, and a stable framework for developing smart
    cities; moreover, existing smart cities help and advise them in taking action.
    However, the situation in emerging nations is quite another. Due to financial,
    technological, and economic restrictions, underdeveloped nations struggle to undertake
    smart city development initiatives. Developing nations aspire to build smart cities
    to improve the living conditions of their citizens and communities. The working
    conditions of developing nations differ from those of developed nations; thus,
    it is necessary to build a structural framework that will assist developing nations
    in initiating and implementing IoT-enabled ecosystems in smart cities.


    Smart cities are required to apply IoT principles since it connects items and
    interacts intelligently with people in response to the tough environment. Effective
    trash management in smart cities is one of the most important IoT-based services
    that grows in importance every day. Previously, waste management used technology
    and models such as Geographical Information System (GIS), better routing and scheduling,
    and other techniques to optimize garbage collection, storage, and disposal procedures.
    These technologies are devoid of innovation, which IoT technology may remedy.
    Prior studies did not view stakeholders as an important element of IoT-enabled
    waste management techniques (policymakers, smart city planners, municipal administration,
    etc.) but rather as separate entities.


    An IoT-enabled smart city is a viable option to meet the demands of urbanization;
    it has the ability to convert societies into smart communities by improving public
    services such as transportation, water management, smart buildings, healthcare,
    and education. The adoption of IoT technology faces various obstacles, including
    scalability, security concerns, heterogeneity, architecture, and governance, among
    others. Few studies have been undertaken on IoT practices and implementation in
    the context of waste management; most of these studies concentrate on designing
    and optimizing IoT technology for trash-collecting techniques. In addition to
    trash collection, it is necessary to investigate the elements that impact waste
    management in smart cities. This chapter intends to establish a knowledge of and
    analyze the level or severity of IoT hurdles impacting smart city waste management
    so that stakeholders may take proactive measures to install IoT-enabled technologies
    in a smooth manner.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'This chapter is an effort to comprehend the IoT adoption situation of smart
    cities in underdeveloped nations and the different implementation issues that
    may be experienced. The building of an IoT network, with solid backing from services
    and technology, needs an integrated waste management control strategy for smart
    cities. Aside from the technological obstacles, a clear, standardized strategy
    for implementing IoT and an appropriate direction for smart city activities have
    not yet been offered. This chapter seeks to identify the key IoT obstacles (IoTBs)
    and their strengths as they pertain to trash management in smart cities. A multi-criteria
    decision-making (MCDM) technique was applied to accomplish these goals. The IoTBs
    are investigated using current literature and validated by specialists. Fuzzy
    DEMATEL examines the interaction between obstacles to demonstrate the intensity/strength
    of IoTBs impacting one another and managing waste management methods in smart
    cities.


    # 4.2 IoTBs and Waste Management in Smart Cities


    Previous research has highlighted impediments to IoT adoption in various industries
    (Sharma et al., 2020). To meet the needs of smart cities in emerging nations,
    it is vital to investigate IoTBs, which impact smart city waste management. The
    obstacles that prevent the adoption of the Internet of Things have been divided
    into three main groups, as shown in Figure 4.1.


    +   - **Security and privacy problems (IoTB₁)**

    +     It is comprehensible that systems may encounter several threats, such as
    cross-site scripting or side channels, that lead to vulnerabilities. Additionally,
    security risks and data loss may increase as a result of multi-tenancy. The fundamental
    challenge is achieving interoperability among networked devices and providing
    them with the best services via adaptive behavior while ensuring the security
    and privacy of end-users and their personal data (Papadakis et al., 2021). The
    IoT systems use network technologies such as RFID, NFC, and protocols such as
    ZigBee, Z-wave, and many more, which may lead to compatibility across communication
    standards. In this sense, data privacy and security have a detrimental impact
    on the waste management capabilities of IoT in smart cities since it may disclose
    the municipal corporations’ access to individual home data.

    +   - **Absence of regulatory norms, policies, and guidelines (IoTB₂)**

    +     A lack of regulatory norms and policies will lead to insecure standards
    and faulty guidance in performing actions. A legal framework needs to be robust
    to support IoT implementation.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# IoT obstacles to waste management in smart cities.


    ![](img/601db3e97ac605d993053e21bf375150_150_0.png)


    # FIGURE 4.1


    Common IoT barriers to waste management in smart cities.


    Researchers have shown that a proper legal framework contributes positively to
    waste management in smart cities, while the absence of regulations is harmful
    to the system.


    +   - **High energy consumption (IoTB₃)**

    +     Power consumption of Internet-of-Things devices is a major problem. For
    IoT deployment, RFID-equipped yet battery-less devices will be favored. With the
    rising demand for IoT devices, it is anticipated that the energy costs of value
    chains will continue to rise.

    +   - **Absence of shared information system (IoTB₄)**

    +     These obstacles restrict the provision of end-to-end waste management visibility
    in smart cities. Prior research on IoT-enabled infrastructure has primarily focused
    on smart bins and sensors, but it is necessary to configure an integrated platform
    of information systems such as DSS, PLM, and geospatial technology among devices,
    applications, and service providers for real-time data and information exchange.

    +   - **Shortage of IT infrastructure (IoTB₅)**

    +     Smart cities’ information technology (IT) infrastructure must be constructed
    to meet their needs. The updated technology'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'cannot be implemented without the appropriate architecture first being in place
    (Elahi et al., 2019).


    +   - **System failure problems (IoTB₆)**

    +     Data may be corrupted by causes outside an individual’s control, such as
    a server breakdown or failure. Data integrity refers to the protection of both
    data and the system. The data is regularly updated and is always accessible in
    its original format by end-users.

    +   - **Poor data availability (IoTB₇)**

    +     The instant accessibility of data ensures that people have immediate access
    to information. The IoT-enabled system aims to offer consumers data whenever they
    want it. Insufficient data availability may impede the flow of information.

    +   - **Shortage of technical knowledge between planners (IoTB₈)**

    +     It is possible that the authorities and policymakers lack the organizational
    capacities and professional skills necessary, which will affect the waste management
    system.

    +   - **Operational cost and extended payback period (IoTB₉)**

    +     Due to the high cost of specialists, smart devices, installation, maintenance,
    and training for imparting information to workers, costs are the primary issue
    of IoT stakeholders.

    +   - **Shortage of transparency (IoTB₁₀)**

    +     In an IoT-enabled system, responsibility for facilities to be supplied might
    be both ambiguous and transparent. The technology of smart cities increases the
    possibility of social isolation for residents.


    # 4.3 Data Collection and Methodology


    This part presents the fuzzy DEMATEL method for analyzing IoT obstacles to waste
    management in smart cities, prioritization, and weighting. Figure 4.2 illustrates
    the research approach guiding the study in which the fuzzy DEMATEL method will
    be used as an initial development level of the analysis, which is then completed
    with the help of experts to calculate the weights of the IoT obstacles to waste
    management in smart cities. Then, we present a brief overview of the method used
    in the study as follows.


    # 4.3.1 Fuzzy DEMATEL Technique


    The DEMATEL analysis is an all-encompassing approach that may be used to investigate
    the components of complex systems. In the early'
  merge: -1
