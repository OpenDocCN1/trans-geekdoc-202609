    # 2.3 An Illustrated Example


    The health industry has been one of the most influenced by technological advancements.
    Smart health apps are being introduced in several nations throughout the globe
    to keep up with this trend. In the sphere of healthcare, integrating the appropriate
    smart technology is critical. A mistake in this area might result in major issues.
    In this regard, one business intends to invest in the area of smart technology
    in the healthcare industry. They are aware, however, that there are several sorts
    of smart health technology on the market. They aim to figure out which smart technology
    is best for health. The organization examines several smart technologies on the
    market to obtain the greatest smart health technology product. They resolve to
    pursue their efforts scientifically. As a result, the smart health technology
    assessment model is built. Academic research and expert views are used to determine
    the criteria and alternatives. There are six options to choose from when it comes
    to smart health technology: H₁ stands for “cloud computing.” “Smart Sensors and
    the Internet of Things (IoT)” is the topic of H₂. H₃ stands for “big data.” H₄
    stands for “3D printers.” H₅ stands for “artificial intelligence.” H₆ stands for
    “robotics.”


    +   - **Cloud Computing:** It is possible for health professionals to remotely
    monitor individuals with chronic diseases by scanning their life data with tricorder
    devices and recording it in information systems using cloud information solutions.
    The main goal of cloud computing health applications is to be able to alert health
    institutions in the event of an emergency within minutes.

    +   - **Smart Sensors and the Internet of Things (IoT):** Sensors connected to
    mobile devices accurately read and interpret numerous parameters, which are then
    relayed to medical institutes. Healthcare practitioners may regulate the patient’s
    treatment and monitor health status outside of the hospital in this fashion. Biosensors
    are used to send medical data to online and mobile apps.

    +   - **Big Data:** Health service providers, health policymakers, software and
    hardware developers, and private sector service businesses'
