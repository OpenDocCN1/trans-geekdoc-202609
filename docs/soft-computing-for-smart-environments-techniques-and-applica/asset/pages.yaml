  md: '# 1.6 Summary


    +   - This chapter provides a comprehensive description of smart cities.

    +   - This chapter reviews the features of the smart city in terms of the characteristics
    and formation of smart cities.

    +   - This chapter presents the most important criteria used in evaluating smart
    and sustainable cities after a comprehensive analysis of a number of research
    articles.

    +   - This chapter presents a proposed hybrid approach to multi-criteria decision-making
    consisting of two fuzzy ANP-fuzzy TOPSIS methods.

    +   - This chapter presents a real case study evaluating a number of cities around
