- pgno: 32
  md: 'Step 3: Ten sustainable and smart cities were selected to be used in the evaluation
    process. These cities were selected from different continents of the world and
    the Middle East.


    Step 4: A network model regarding the goal, and criteria had been constructed
    as presented in Figure 1.4. The problem was charted into several different levels.
    After that, the inner and outer dependencies results of criteria with respect
    to each criterion have been constructed.


    ![](img/601db3e97ac605d993053e21bf375150_32_0.png)


    # FIGURE 1.4


    Structure of the problem''s criteria using the ANP method.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Step 5: The verbal vocabularies and their corresponding TFNs that experts use
    in evaluating criteria and alternatives are identified as shown in Tables 1.1
    and 1.2.


    Step 6: A decision matrix of the main criteria had been constructed distinctly
    for each expert to expose the effect of each criterion on the other by applying
    the verbal vocabularies in Table 1.1 according to Eq. (1.12) as exhibited in Table
    1.3. Then, a decision matrix has been constructed for each expert distinctly among
    the main criteria to expose the effect of each criterion on the other by TFNs
    in Table 1.1 according to Eq. (1.13), as exhibited in Table 1.4.


    Step 7: The geometric mean of the three comparison matrices created by the experts
    has been computed by using Eq. (1.14) as shown in Table 1.5.


    Step 8: The fuzzy weight of the six main criteria determined for each matrix had
    been calculated distinctly by applying Eq. (1.15) as presented in Table 1.5. Then,
    the weights of the six main criteria for each matrix are standardized distinctly
    by dividing each weight by the sum of the weights as presented in Table 1.5.


    Step 9: The CR has been computed for each matrix that has been constructed by
    each expert distinctly to confirm consistency of the pairwise comparisons by applying
    Eq. (1.16). Then, the consistency level has been ensured to be less than 0.1 for
    all the matrices in Table 1.5.


    Step 10: The concluding weights of the six main criteria had been computed by
    using the ordered weighted aggregation (OWA) operator of the concluding weights
    of all experts (i.e., W_local) as exhibited in Table 1.6 according to Eq. (1.17).


    Step 11: According to the previous steps for computing the local weights (W_local)
    of the six main criteria, pairwise comparison matrices had been created to present
    the internal correlation of each criterion and its effect on the other set of
    criteria by all experts as exhibited in Tables 1.7–1.18. Then, the concluding
    weights of the internal interdependency of the criterion and other criteria are
    presented in Table 1.19 according to Eq. (1.18).


    Step 12: The final weights of the six main criteria were calculated by multiplying
    the local weight computed from experts’ comparison matrices of criteria in Table
    1.6 by the weight of interdependence of criteria as presented in Table 1.19, and
    the final weights had been presented in Table 1.19 and Figure 1.5 according to
    Eq. (1.19).


    Step 13: According to the previous steps in which the weights of the six main
    criteria were calculated using the ANP method, the sub-criteria weights are calculated
    for each main criterion. Some results for calculating the weights of the sub-criteria
    of the smart governance criterion are presented in Tables 1.20–1.29. After that,
    the global weights of all the sub-criteria were calculated according to the extent
    to which they were affected by the value of the weight of its main criterion,
    as shown in Table 1.30 and Figure 1.6.'
