    # 6.5 Summary


    +   - This chapter provides a comprehensive description of smart campuses and
    their relevant merits.

    +   - This chapter reviews the importance and needs of assessing sustainability
    performance indicators for smart campuses.

    +   - This chapter presents the most important criteria for evaluating smart campuses
    after a comprehensive analysis of several research articles.

    +   - This chapter suggests the steps of a hybrid MCDM approach for evaluating
    sustainability indicators for smart campuses. The applied approach was carried
    out under q-rung orthopair fuzzy set (q-ROFS) environment and using q-rung orthopair
    fuzzy numbers (q-ROFNs).

    +   - The hybrid approach consists of two methods q-ROFS entropy and the q-ROFS
    Technique for Order of Preference by Similarity to Ideal Solution (q-ROFS TOPSIS).

    +   - This chapter presents a real case study while evaluating sustainability
    indicators for smart campuses.'
