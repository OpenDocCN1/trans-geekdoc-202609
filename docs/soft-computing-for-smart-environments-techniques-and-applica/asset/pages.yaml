    # 1.3 Solution Methodology


    In this part, a proposed multi-stage approach to assessing smart and sustainable
    city criteria is presented. The proposed approach is based on the application
    of the Analytical Network Process method and the Technique for Order of Preference
    by Similarity to Ideal Solution (ANP-TOPSIS) method. In general, this chapter
    provides some recommendations for cities to understand their position in relation
    to other cities and to know what areas policymakers need to strengthen. Then,
    these cities are differentiated by a multi-criteria scenario taking into account
    several aspects. Thus, the proposed framework consists of several stages, namely,
    the stage of data collection by volunteers and specialists, the stage of determining
    the weights of the criteria used in the study, and finally the stage of arranging
    the specified cities according to their importance from the specified standards.
    Also, the proposed approach adopts the fuzzy environment as an external framework
    for conducting the study using TFNs as shown in Figure 1.2.


    # 1.3.1 Connotation of ANP and TOPSIS


    The fuzzy ANP approach is used to calculate the final weights of the criteria
    and to build outer dependencies, i.e., relationships between elements belonging
    to various groups and criteria. The analytical hierarchy process (AHP) was initially
    established by Saaty (Saaty 2001) and is now known as the ANP. While the AHP uses
    a unidirectional hierarchical connection between decision levels, the ANP allows
    for more generic interrelationships between decision levels and components. The
    ANP feedback method substitutes hierarchies with networks in which interactions
    between levels are difficult to characterize as higher or lower, dominant or submissive,
    and direct or indirect. By including possible interactions, interdependencies,
    and feedback in the decision-making system, the technique assesses all connections
    between clusters of the network structure and items inside them. It deals with
    dependency between components by developing a “supermatrix” to get composite weights.
    A network structure’s node symbolizes a component (or cluster) with elements within
    it, a'
