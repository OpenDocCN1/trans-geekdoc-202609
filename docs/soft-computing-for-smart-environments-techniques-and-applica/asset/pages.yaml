  md: '# 7


    # Sustainable Supplier Selection

    for Smart Supply Chain


    # 7.1 Introduction


    The demand that has emerged in recent years from consumers for high levels of
    service delivered on time in conjunction with high levels of quality presents
    difficulties that were not there in the past. Companies are looking to form strategic
    partnerships within their supply chain to increase their chances of success in
    this industry. The process of analyzing and choosing suppliers in order to achieve
    the strategic objectives of the organization plays a vital role in this context.
    Before 1980, supplier selection was mostly driven by price considerations. Nevertheless,
    in recent years, in addition to economic reasons, environmental and social concerns
    have been required to be concurrently evaluated for the selection of suppliers.
    Environmental criteria are being included because of the rising concern over contamination
    of the environment on a worldwide scale. One other reason to include environmental
    factors in the limitations is that it will reduce the number of accessible resources.


    Additionally, over the last several years, due to the globalization of the market,
    the level of competition in many different sectors has dramatically grown, leading
    to unstable demand. There is also the problem that access to various providers
    is not the same throughout different periods. Furthermore, depending on the conditions,
    only a small number of possible suppliers would be able to satisfy the demand
    from producers. In order to thrive and expand in such an environment, manufacturers
    need to have an all-encompassing strategy. Small- and medium-sized businesses
    employ more than 60% of the workforce, and they are the primary source of job
    possibilities for society as a whole. Small- and medium-sized businesses account
    for more than 99% of all businesses worldwide. Both establishing a sustainable
    supply chain and maintaining the sustainable growth of small- and medium-sized
    businesses are vital guarantees for the stabilization of the national economy.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Due to the fact that they often have insufficient resources, small- and medium-sized
    businesses are very reliant on the supplemental resources provided by outside
    sources. Both the effectiveness of the procurement process and the quality of
    the product are determined by the performance of the supplier. Small- and medium-sized
    businesses have benefited greatly from careful attention paid to the selection
    of their suppliers, which has resulted in increased market competitiveness and
    continued sustainable growth. Nevertheless, much of the research on sustainable
    supplier selection has been conducted with big companies. The negotiating leverage
    and risk mitigation capabilities of small- and medium-sized businesses are distinct
    from those of big companies. This is because scale, money, and market limits all
    play a role. Large companies may have reliable manufacturing capacities and provide
    goods of a high standard. Still, they use economies of scale to drive up the extra
    expenses incurred by the transaction process for small- and medium-sized businesses.
    In addition, small- and medium-sized businesses with fewer resources should emphasize
    the process of monitoring their suppliers when choosing providers.


    The recent development and implementation of advanced smart technologies, such
    as the Internet-of-Things (IoT), big data analytics (BDA), and artificial intelligence
    (AI) techniques, have made it possible for all components in a supply chain to
    be perceptible, diagnosable, interpretable, predictable, controllable, and optimizable,
    which has accelerated the transformation of the traditional supply chain into
    a smart supply chain. The use of cutting-edge smart technology results in the
    creation of a supply chain that is not only designed to be quick and responsive
    but also individualized to be adaptable. It provides enhanced economic, environmental,
    and social sustainability by using smart technology as a critical facilitator
    for improving sustainable supply chain management practices. The use of smart
    technologies accomplishes this.


    The phrase “sustainable supply chain management techniques” refers to a collection
    of tactical activities that may assist a corporation in achieving more sustainability
    in the economic, environmental, and social aspects of sustainability. These kinds
    of activities center on the process of implementing sustainable supply chain management,
    which significantly impacts the level of sustainability performance a firm achieves.
    It is generally agreed upon that one of the most important aspects of sustainable
    supply chain management strategies is identifying sustainable vendors. This is
    due to the fact that the activities of suppliers are essential to assisting downstream
    businesses in achieving a collaborative and sustained competitive advantage. This
    is because the activities of suppliers give original inputs to organizational
    supply chains. In addition, the selection of a supplier may be thought of as a
    process of multi-criteria decision-making (MCDM), which is comprised of two stages:
    the calculation of the weights of the criteria and the ranking of the suppliers.'
