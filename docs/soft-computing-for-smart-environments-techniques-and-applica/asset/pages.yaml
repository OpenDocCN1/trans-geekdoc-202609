- pgno: 1
  md: '# Soft Computing for Smart Environments


    This book applies both industrial engineering and computational intelligence to
    demonstrate intelligent machines that solve real-world problems in various smart
    environments. It presents fundamental concepts and the latest advances in multi-criteria
    decision-making (MCDM) techniques and their application to smart environments.
    Though managers and engineers often use multi-criteria analysis in making complex
    decisions, many core problems are too difficult to model mathematically or have
    simply not yet been modeled.


    In response, as well as discussing AI-based approaches, *Soft Computing for Smart
    Environments* covers various optimization techniques, decision analytics, and
    data science in applying soft computing techniques to a defined set of smart environments,
    including smart and sustainable cities, disaster response systems, and smart campuses.


    This state-of-the-art book will be essential reading for both undergraduate and
    graduate students, researchers, practitioners, and decision-makers interested
    in advanced MCDM techniques for management and engineering in relation to smart
    environments.'
