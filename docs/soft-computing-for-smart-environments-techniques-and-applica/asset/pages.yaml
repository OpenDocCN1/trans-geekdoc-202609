    # 8.4 Results and Discussion


    This part discusses the results obtained from applying the methodology used to
    analyze and evaluate smart card systems for public transportation. The methodology
    used is divided into two parts. The first part refers to defining the priorities
    and weighting of the criteria. The second part refers to the arrangement of the
    alternatives according to the specified criteria.


    Initially, according to the results obtained to determine the priorities of criteria
    as presented in Table 8.13 and shown in Figure 8.3, it is found that the service
    reliability SRC₅ criterion has the highest weight by weight'
