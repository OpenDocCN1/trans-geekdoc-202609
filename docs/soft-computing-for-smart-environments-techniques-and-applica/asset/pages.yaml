  md: '# 6


    # An Evaluation Approach for Prioritizing Performance of Sustainability Indicators
    for Smart Campuses


    # 6.1 Introduction


    The quality of life for city residents is the primary focus of initiatives about
    smart cities. In order to accomplish this goal, the focus has been on a number
    of different domains, including the economic, operational, social, environmental,
    health, administrative, and governmental aspects, always adhering to the principles
    of providing citizens with effective and practical service. Despite this, the
    development process for smart cities is notoriously difficult due to the vast
    number of projects that fall under this category. Numerous imponderables come
    up, which usually results in the abandonment of ongoing projects or, at most,
    leads to a more modest reinterpretation of these initiatives. Very frequently,
    all that is left of the smart city is its name or the idea that was behind its
    inception. A university of medium size with a single campus is a sufficiently
    complex environment to be highly reflective of a city of medium size. It also
    strive to attain the same quality of life for their community as anticipated in
    a smart city.


    We conceived of the smart university as a model for universities that improves
    the quality of life by making intensive, global, efficient, and sustainable use
    of information technology to deliver services for the benefit of the entire university
    community. This idea was based on the factors that were discussed above. We are
    in a position to affirm that a university campus is an appropriate mock-up for
    a smart city initiative. A university campus is a representative, and in addition
    to serving as an example, guide, and case study with which to develop viable projects
    in our cities, the partial results would be useful in and of themselves to effectively
    and efficiently improve the quality of life of a large number of citizens. This
    is because the results of the smart city initiative would be based on the lessons
    learned from the university campus. It is possible that the planning'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'and execution of a smart university might have a beneficial effect on the campus
    of any institution. On the other hand, this presents a substantial obstacle; consequently,
    such initiatives sometimes fail to materialize. In order to successfully coordinate
    a smart university project, the entire endeavor must first be broken down into
    a series of smaller, more manageable projects. These projects may be spread out
    over several fiscal years, led by various teams, and incorporate various technological
    applications. Even when projects are completed successfully, the end result is
    often a dispersion of services that cannot connect with one another or generate
    new value-added services; eventually, a wide variety of technologies and services
    are reproduced and maintained.


    The high degree of dependency on non-renewable resources inside university campuses
    as a consequence of the absence of sustainable practices has led to certain institutions
    having a large carbon footprint. For instance, the majority of the nation''s public
    colleges get their source of electrical energy from oil. The vast majority of
    educational establishments at the university level are now participating in a
    variety of challenging activities. Some institutions consist of a number of campuses
    spread out throughout a state or other geopolitical territory in various places
    geographically. On the contrary, many of them have expanded beyond the scope of
    the initial master plan that was supposed to guide the phase plan of their campus
    expansion. Some of the difficulties that have been producing discussions and disputes
    within the previous several decades include the need for land, housing, and essential
    infrastructure between the campuses of higher education institutions and the adjacent
    community. The success that may be achieved in resolving these issues is directly
    proportional to the level of willingness shown by the heads of institutions and
    the community leaders, as well as the deployment of creative, smart spatial strategies.
    It is clear from the research that cities that can implement new technology and
    an innovative solution driven by smart technology will be able to overcome their
    issues. On the contrary, those who cannot do so face a greater number of challenges
    while making little progress.


    Unless higher education institutions embrace the smart campus sustainability model
    and evaluation procedures, most campuses will use a greater proportion of local
    oil, and other serious difficulties will intensify in the near future. The obstacles
    posed by limited data access for the evaluation process will also be addressed.
    The indicators will be based on environmental dimensions that may be obtained
    geographically and incorporated into the software for smart spatial techniques.
    Higher education institutions have an urgent need to move toward adopting and
    establishing a smart framework employing spatial software for campus sustainability.
    Furthermore, the relevance and significance of building a smart spatial-based
    framework to analyze the appropriateness and'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'sustainability performance of higher education institution campuses are derived
    from the worldwide adage “think globally, act locally.” A further rationale is
    a country-specific approach that offers a complete information repository for
    government and higher education institution managers. This chapter addresses this
    research vacuum by evaluating the relative relevance of spatial-based indicators
    that fit with the stakeholders’ degree of awareness and the nature of the local
    context in every given nation. This relative significance will assist the development
    of a method for smart university campuses to embrace the local environment in
    order to achieve a smart city objectively.


    # 6.2 Methodology


    In this part, the MCDM-blended approach is presented to prioritize the performance
    of sustainability indicators and to assess the sustainability performance of smart
    campuses (SCs). The applied approach was carried out under q-rung orthopair fuzzy
    set (q-ROFS) environment and using q-rung orthopair fuzzy numbers (q-ROFNs). The
    approach used consists of two methods q-ROFS entropy and the q-ROFS Technique
    for Order of Preference by Similarity to Ideal Solution (q-ROFS TOPSIS). Figure
    6.1 shows the steps of the approach used to evaluate several SCs. In this regard,
    we provide a brief overview of the methods used in applying this chapter’s case
    study. This section is divided into several parts as follows.


    # 6.2.1 Entropy Method


    The Shannon entropy, which was first created by Shannon, serves as the foundation
    for the entropy weight approach (Shannon 1948). Entropy is a measurement of the
    information disorder degree of a particular system and has the potential to fully
    use the information that is included in the original material. Although it overly
    relies on objective data, which cannot accurately reflect experts’ knowledge and
    practical experience, entropy weight can indicate useful information provided
    by the index (Xu et al. 2018). As a result, the results can sometimes be inconsistent
    with reality and individual comprehension. The Shannon entropy is a notion that
    has been developed in terms of probability theory and is presented as a measure
    of uncertainty in information (Delgado and Romero 2016). It is an excellent and
    easy option for our goal since the idea of entropy is well adapted to assessing
    the relative intensities of contrast criteria to reflect the average intrinsic
    information supplied for decision-making.'
