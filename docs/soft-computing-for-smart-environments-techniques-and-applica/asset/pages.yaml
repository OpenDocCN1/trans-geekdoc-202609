  md: '# 7.2 Mathematical Preliminary


    This part discusses fundamental aspects of intuitionistic fuzzy sets (IFSs), such
    as their operations and concepts, in further detail. Atanassov (1999) has developed
    IFSs, which are an extension of conventional fuzzy sets. IFSs defined by degrees
    of membership and non-membership enable decision-makers to voice their viewpoints
    with more flexibility. As stated in Explanation 7.1, the total of the membership
    and non-membership degrees of elements in an IFS is equal to or less than one.
    IFSs have been effectively applied to real-world issues in a variety of sectors
    owing to their characteristics.


    **Explanation 7.1:** Let X be a non-empty set. An IFS $\tilde{I}$ in X is an object
    having the formula specified by:


    $$\tilde{I}=\{(x, \mathcal{U}_I(x), \vartheta_I(x)) \mid x \in X\}$$ (7.1)


    where the function $\mathcal{U}_I : X \to [0, 1]$ designates the degree of membership
    of a component to the sets $\tilde{I}$, and $\vartheta_I : X \to [0, 1]$ designates
    the degree of non-membership of a component to the sets $\tilde{I}$, with the
    condition that:


    $$0 \le \mathcal{U}_I(x) + \vartheta_I(x) \le 1, \text{ for } \forall x \in X$$
    (7.2)


    The degree of uncertainty is computed as follows:


    $$\pi_I(x) = 1 - \mathcal{U}_I(x) - \vartheta_I(x)$$ (7.3)


    **Explanation 7.2:** Let $\tilde{A} = (\mathcal{U}_{\tilde{A}}, \vartheta_{\tilde{A}})$
    and $\tilde{B} = (\mathcal{U}_{\tilde{B}}, \vartheta_{\tilde{B}})$ be two intuitionistic
    fuzzy numbers (IFNs); then, some operations of two IFNs are defined as follows.


    $$\tilde{A} \oplus \tilde{B} = (\mathcal{U}_{\tilde{A}} + \mathcal{U}_{\tilde{B}}
    - \mathcal{U}_{\tilde{A}}\mathcal{U}_{\tilde{B}}, \vartheta_{\tilde{A}}\vartheta_{\tilde{B}})$$
    (7.4)


    $$\tilde{A} \otimes \tilde{B} = (\mathcal{U}_{\tilde{A}}\mathcal{U}_{\tilde{B}},
    \vartheta_{\tilde{A}} + \vartheta_{\tilde{B}} - \vartheta_{\tilde{A}}\vartheta_{\tilde{B}})$$
    (7.5)


    $$\lambda \tilde{A} = \big((1 - (1 - \mathcal{U}_{\tilde{A}})^{\lambda}), \vartheta_{\tilde{A}}^{\lambda}\big),
    \lambda > 0$$ (7.6)


    $$\tilde{A}^{\lambda} = (\mathcal{U}_{\tilde{A}}^{\lambda}, (1 - (1 - \vartheta_{\tilde{A}})^{\lambda})),
    \lambda > 0$$ (7.7)'
