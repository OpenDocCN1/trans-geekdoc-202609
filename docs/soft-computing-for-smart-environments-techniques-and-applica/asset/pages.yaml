  md: '# 3


    # An Intelligent Approach for Assessing Smart Disaster Response Systems


    # 3.1 Introduction


    Disaster management is one of the most significant fields of study since it directly
    affects the quality of human life. One of the most important foundations of disaster
    management is responding to catastrophes in a way consistent with the protection
    of residents’ lives from their effects. Consequently, the study of disaster response
    systems is regarded as one of the essential issues that must be researched and
    improved. Failure to respond appropriately to natural disasters is detrimental
    to human and economic life. The number of persons impacted by catastrophes who
    do not get enough aid is enormous. As a result of the world’s technical advancement,
    it was not possible to warn citizens of the impending disaster before it happened.
    Also, one of the most significant reasons for nation development retardation is
    the aftermath of catastrophes that have not been adequately addressed. Due to
    the escalation of natural catastrophes throughout time, academics are becoming
    more interested in ideas and innovations to avoid disasters and mitigate their
    negative impact on inhabitants’ lives.


    The Internet of Things (IoT) is one of the most influential parts of technology
    growth in the modern period since it has significantly contributed to several
    disciplines, including economics, healthcare, politics, industry, agriculture,
    and many more. Wireless Sensor Network (WSN) is one of the most commonly used
    technological solutions in the area of catastrophe detection; therefore, it has
    several socio-technical and economic flaws. WSNs aid specialized agencies (police,
    firefighters, and physicians) in responding to and managing catastrophes by gathering
    data from the disaster scene. Numerous technology technologies, such as social
    media, location-based systems, radiofrequency identification, and big data analytics
    (BDA), assist stakeholders in disaster management. The Internet of Things has
    proved its capacity to deliver more effective, intelligent, and adaptable disaster
    response solutions for varying circumstances.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In addition, it has become a very effective solution for decision-making difficulties
    and a support system for other disciplines, such as data mining science. Therefore,
    it is essential to focus on intelligent disaster response systems based on IoT
    capabilities.


    # 3.2 Smart Disaster Response Systems


    The destructive consequences of natural catastrophes prompted academics to assess
    response measures and create efficient techniques for maintaining the most effective
    response. Due to the recurrence of natural catastrophes, there is a growing interest
    in examining their consequences on the economic and social levels. This has led
    to an increased focus on investigating the identification of these catastrophes
    so that response centers may become more effective and lessen their impact on
    the state. A smart disaster response system, which is a crucial element in ensuring
    the safety of citizens, is one of the primary aspects of smart cities. Any city''s
    catastrophe response systems must take into account a number of factors.


    +   - The primary component of a disaster response system is comprised of localized
    communities that receive information from sensors and permit the exchange of this
    information to get aid.

    +   - Disaster data management enables the study of disaster-related information
    and maintains data in the event of any distortion through central servers.


    Unlike conventional disaster response systems, intelligent systems deal with calamities
    more effectively by effectively communicating the information supplied by the
    sensors to the reaction teams via more sophisticated communication methods. The
    key contribution of the intelligent disaster response system is the exchange of
    information in real time, which improves the timely reaction to the crisis. A
    smart disaster response system looks for appropriate items in real time based
    on the objectives of the communities that comprise the cooperation participants.
    After collecting data from local catastrophe communities, a centralized disaster
    management system conducts an exhaustive analysis of the data.


    The smart disaster reaction system comprises a local manager, an object application,
    and a disaster-responsive social network. Initially, a disaster-responsive social
    network, such as an online social network (OSN), enables members to communicate
    anytime and anywhere. The second component of the smart disaster response system
    is the local manager, which is called a super node. This system consists of five
    components, as in Figure 3.1: the object manager, object data manager, community
    manager, overlay manager,'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/601db3e97ac605d993053e21bf375150_113_0.png)


    # FIGURE 3.1


    General scheme of the smart disaster response system architecture.


    and localized disaster data processor. The object manager is accountable for managing
    the interaction of object data with the community manager and the object data
    manager through the online social network. Real-time administration of the data
    associated with objects such as locations by the object data manager. The community
    manager arranges the local community of responsive users who will get object data
    from the object data manager. Informed by the community manager, the overlay manager
    creates network configuration files for each member''s account in order to facilitate
    communication between them. Based on big data analytics and cloud computing, the
    localized disaster data processor controls the catastrophe information of the
    items and analyses the disaster scenario in real time. The third part of the system
    is the object application, which includes both an overlay controller and a catastrophe
    communicator. The overlay controller is the component that is accountable for
    maintaining the overlay connections between members and the configuration files
    produced by the overlay manager in the local manager. At the same time, the disaster
    communicator uses various sharing mechanisms to facilitate communication between
    members and ensure that everyone has access to relevant information.


    Due to the significance of intelligent disaster response systems, their performance
    must be assessed using criteria that quantify the usefulness of these systems
    in various circumstances. As with other decision-making difficulties, evaluating
    smart disaster response systems is one of the decision-making challenges that
    provide difficulty under unpredictable settings. In order to account for any ambiguity
    in the assessment process, this research intends to present an integrated framework
    for evaluating the performance of the smart disaster response system in an uncertain
    environment. Multi-criteria decision-making (MCDM) is used for the issue of performance
    assessment based on a set of criteria.'
