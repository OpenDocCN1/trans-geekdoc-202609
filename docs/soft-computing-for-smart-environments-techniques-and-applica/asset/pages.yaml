    environment criterion’s sub-criteria, it is found that the energy efficiency criterion
    ranks first with a weight of 0.224, followed by the environmental protection instruments
    criterion with a weight of 0.216, while the natural resource management criterion
    and smart building criterion rank last with a weight of 0.180 as presented in
    Table 6.12. Also, according to the results of the weighting of'
