- "# PHP 5.5 Web 开发实战\n\n\n\n\n\n# 介绍\n\n\n从零开始，教你 HTML、PHP、MySQL、CSS、JavaScript，开发一个在线阅读网站（可以当短篇小说网站、新闻网站），并且赚钱。\n\
  \n基于兴趣，想做什么就动手做，边做边学，理论后来再总结，自然醐醐灌顶。\n\n本书是开源书籍，采用 markdown 语法，书放在`github.com`。代码也是开源的，也在`github`。图片放在免费的七牛存储（`qiniu.com/code=lafkpsz1`）。如果发现错字或者意见，欢迎在\
  \ Issues 反馈，例子中的文章来自简书（`jianshu.io/users/30f226598e/latest`）、游苏赋（`jianshu.io/users/fc68a49ba/latest`），在此先说“谢谢”。\n\
  \nGitBook 在线阅读与下载：`www.gitbook.io/book/sinkcup/php-tutorial-create-reader`。简书在线阅读：`jianshu.io/notebooks/4779/latest`。书的\
  \ github：`github.com/sinkcup/php-tutorial-create-reader`。代码的 github：`github.com/sinkcup/php-ebook-reader`。知识共享署名-非商业性相同方式\
  \ 4.0 许可（`creativecommons.org/licenses/by-nc-sa/4.0/`）。\n\n本章教你做一个能运行的网站，并且带来收入，学会完以后就入门了，但离高手还远。\n\
  \n# 为什么学 PHP\n\n如果是想做网站，那看这本书就对了。\n\n## 哪些国际使用\n\n## 哪些国内公司使用\n\n# 语义化 HTML\n\n\
  # 语义化 HTML\n\n打开浏览器，访问一个网站，比如豆瓣（`douban.com`）是这样的：右键“查看源代码”，看到了一行的文本。是这样的：把这些代码复制下来，保存成`index.html`，用浏览器打开，看到了和`douban.com`一样的内容。这就是\
  \ HTML，写的时候是一行的文本，用浏览器打开，就会渲染成界面。\n\n下面开始开发一个“在线网站”，可以用来小说网站、博客、等等。先规划一下功能？\n\n\
  * 首页：显示列表，列表里显示每篇文章的标题、摘要。\n* 详情页：显示整篇文章。\n* 发表页：给出文本框，录入文章。\n\n首页的 HTML 代码如下：\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/transitional.dtd\">\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"Hans\">\n    <head>\n      \
  \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"/>\n  \
  \      <title>在线阅读</title>\n    </head>\n    <body>\n        <h1>在线阅读</h1>\n   \
  \     <div><a href=\"./add_article.html\">写文章</a></div>\n        <ul>\n        \
  \    <li><a href=\"./get_article.html?id=1\">不同的上网的方式的影响</a>\n                <p>摘要：通过不同的上网的方式体验和说明，试图探寻这种现象背后的原因。并为其他读者提供理论依据。偏硬，数据良好，不经任何加工和修饰，尤其是在\
  \ Windows 下，一口下去让人头皮麻。最新的产品通过润饰，但旧无法洗去……</p>\n            </li>\n            <li><a\
  \ href=\"http://tech.163.com/11/0401/15/\" target=\"_blank\">奇虎 360 上市员工平均身价 580\
  \ 万</a>\n...\n</html>\n```\n\n在浏览器中打开是这样的：能懂这些代码吗？如果看不懂，自学一下语法了，预计需要时间。教程：《`在线阅读教程`。注意：截图右上角有个“错误”，这是`Firefox`扩展，能保证写出\
  \ 100%标准的 HTML，特别方便。下载页面：`users.skynet.be/mgueury/mozilla/`。简书在线阅读：`jianshu.io/notebooks/4779/latest`。书的\
  \ github：`github.com/sinkcup/php-tutorial-create-reader`。代码的 github：`github.com/sinkcup/php-ebook-reader`（此处对应原文链接保持一致）。\n\
  \n在浏览器中打开是这样的：能懂这些代码吗？如果看不懂，自学一下语法了，预计需要时间。教程：《`在线阅读教程`。\n\n### 总结\n\n我的技术水平\n\n\
  ### \n\n### 语义化：最简 HTML\n\n### 总结\n\n### 解决 |\n\n### 解决的问题 |\n\n### 总结\n\n| HTML\
  \ |\n\n| 硬件 | OS | 市场占有率 |\n| --- | --- | --- |\n| x86 PC | Windows（个人使用￥400 起，公司使用￥1988\
  \ 起） | 90% |\n| --- | --- |\n| x86 PC | Linux（￥0） | 1% |\n| x86 Mac | OS X（￥0） |\
  \ 8% |\n\n\n\n\n\n这时候用浏览器访问[`localhost/`](http://localhost/)，就看到网站了。不过`localhost`代表本机，别人还是访问不了。所以别人要通过\
  \ IP 访问，比如我的电脑 IP 是`192.168.1.107`，那访问[`192.168.1.107/`](http://192.168.1.107/)即可。如图：\n\
  \n注意：这是内网 IP，在同一个内网里可以访问，比如学校等局域网环境。如果想对外提供网站服务，需要一个公网 IP。那时候就需要购买云服务器了，那是另一个话题“搭建生产环境服务器”，以后再说。\n\
  \nIP 都是数字太难记了，现在网站都是用域名啊。如何使用域名访问本网站呢？\n\n很简单，域名是由域名注册商出售的，在 google 中搜索`domain`即可，各家价格都差不多，`.com`后缀约$8/年，还有很多有意思的后缀，比如[douban.fm](http://douban.fm)、[zhi.hu](http://zhi.hu)、[github.io](http://github.io)、[jianshu.io](http://jianshu.io)。但国内域名注册商大部分都不正规，你购买了域名，会发现实际管理员邮箱是商家的，最重要的资产是域名转移码，都不在你手里，这就很危险，你买的东西却不属于你，仍然属于商家。而在国外购买域名就很正规，管理员邮箱、转移码都是你的。\n\
  \n常见的国外域名注册商支持支付宝的有：[godaddy.com](http://www.godaddy.com/China)、[resellerclub.com](http://www.resellerclub.com)，支持\
  \ VISA 的就很多了，比如`register.com`、`name.com`。\n\n网站正式运营的时候，需要购买顶级域名。现在只是学习开发，那申请一个免费的二级域名即可。提供免费二级域名的商家很多，比如花生壳[oray.com](http://oray.com/)，注册登录后，进入我的控制台——域名管理——壳域名——添加域名即可。比如我申请了一个`sinkcup.wicp.net`，指向`192.168.1.107`，如图：\n\
  \n现在一个网站就诞生啦！点“写文章”，然后“发表”，观察发生了什么。\n\n## 总结一下\n\n### 我的技术水平\n\n| HTML | 服务器部署 |\n\
  | --- | --- |\n| 语义化：最简 HTML | 管理员权限 GUI 或 CLI 安装包 |\n\n### 已解决的问题\n\n*   如何提供网站服务\n\
  \    安装`HTTP server`即可。\n*   通过 IP 访问网站，很难记怎么办\n    购买顶级域名，或者申请免费的二级域名。\n*   奇虎\
  \ 360 上市 员工平均身价 580 万\n    “360 员工全部进入北京二环以内。”现场一位北京记者的一句戏言，引发现场爆发出欢呼。奇虎总裁齐向东对本报表示，360\
  \ 此举，确实创造了中国互联网的员工致富神话。据了解，入职 9 个月以上的员工一般就能拿到股份，一般员工持股 4000 股左右，按照每股 34 美元减去相关费用计算，获利约\
  \ 70 多万元人民币。网易新闻，与你分享。[`163.fm/WqOcR`](http://163.fm/WqOcR)\n\n### 待解决的问题\n\n* \
  \  哪里能找到《计算机导论》？\n    找不到……我正在写的，还没完……有一本讲互联网的《浪潮之巅》，精彩，推荐阅读，但不是面向新生入门的，所以我才想到一本导论。\n\
  *   发表的文章怎么了？\n    且听下分解。\n\n### PHP 让内容起来\n\n### PHP 让内容起来\n\n发表的文章怎么了？\n因为那是静态网页，不能处理。这时候就需要\
  \ PHP 了。首先要配置`nginx`，发现请求了 PHP 文件时，传递给 PHP 程序处理。\nWindows：无需配置好了，启动`nginx`。\nLinux：按照图片进行修改。\n\
  ```\nsudo vi /nginx/sites-enabled/default\n```\n修改完毕，重启`nginx`。\n```\nsudo /etc/init.d/nginx\
  \ reload\n```\n然后开始写代码。修改“发表页”`article.html`的表单，提交到 PHP。\n```html\n<h1>写文章</h1>\n\
  <form action=\"add_article.php\" method=\"post\">\n```\n`add_article.php`收到数据，保存到哪里？最简单的方法：本地文件。\n\
  ```php\n<?php\n$input = $_POST;\n$file = './articles.json';\n$data = array();\n\
  if (file_exists($file)) {\n    $tmp = file_get_contents($file); //读取文件，变成字符串\n \
  \   if(!empty($tmp)) {\n        $data = json_decode($tmp, true); //解码成 array\n \
  \   }\n}\n$data[] = $input;\nfile_put_contents($file, json_encode($data)); //把字符串保存到文件\n\
  echo '保存成功';\n```能懂这些代码？如果看不懂，学一下 PHP，很简单。看这里：《PHP 手册[`www.php.net/manual/zh/firstpage.php`](http://www.php.net/manual/zh/firstpage.php)。然后把这些代码：[`github.com/sinkcup/php-ebook-reader/tree/0.2`](https://github.com/sinkcup/php-ebook-reader/tree/0.2)。在浏览器里访问，尝试录入一篇文章。如图：回到首页，刷新，看到文章列表，可以进去，如图：\n\
  \n## 总结一下\n\n### 我的技术水平\n\n| HTML | PHP | 数据存储 | HTTP 协议 |\n| --- | --- | --- |\
  \ --- |\n| 语义化：最简 HTML | 让内容起来 | 文件 | GET、POST |\n\n### 已解决的问题\n\n*   提交的内容跑哪里？\n\
  \    可以存到本地文件\n*   `GET`和`POST`有什么区别？用哪个？\n    简单的说：`GET`表示读，`POST`表示写。\n*   这个城市会有影响？\n\
  \    匿名用户：说法，房子有了，目前的步是 mini，套现后换路，还有妻子去香港，这就是计划。\n\n### 待解决的问题\n\n*   PHP 和 HTML\
  \ 混写，很乱，怎么解决？\n    且听分解。\n*   保存之后，在 Firefox 中页面码了？\n\n### 表现与逻辑分离\n\n### 表现与逻辑分离\n\
  \n### PHP 和 HTML 混写，很乱，怎么解决？\n\n一个页面分成文件，一个 PHP 做逻辑，一个 HTML 做模板。比如“首页”`index.php`分成：`index.php`和`index.html`。`index.php`代码如下：\n\
  \n```php\n<?php\n$articles = array();\n$file = './articles.json';\nif (file_exists($file))\
  \ {\n    $tmp = file_get_contents($file);\n    if (!empty($tmp)) {\n        $articles\
  \ = json_decode($tmp, true);\n    }\n}\n\n$d = array(); //d 是数据，后续用到\n$d['articles']\
  \ = $articles;\nrequire_once __DIR__ . '/index.html';\n```\n\n`index.html`代码如下：\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\n    PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n    \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"zh-Hans\">\n    <head>\n\
  \        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  />\n        <title>在线阅读</title>\n    </head>\n    <body>\n        <h1>在线阅读</h1>\n\
  \        <div><a href=\"./add_article.html\">写文章</a></div>\n        <?php\n    \
  \        if (!empty($d['articles'])) {\n                echo '<ul>';\n         \
  \       foreach ($d['articles'] as $k=>$v) {\n                    $id = $k + 1;\n\
  \                    echo '<li><a href=\"./get_article.php?id=' . $id . '\">' .\
  \ $v['title'] . '</a>';\n                    echo '<p>' . mb_substr($v['content'],\
  \ 0, 100, 'UTF-8') . '</p></li>';\n                }\n                echo '</ul>';\n\
  \            }\n        ?>\n    </body>\n</html>\n```\n\n保存之后，在 Firefox 中页面码了？打开`add_article.php`的源代码看一下，输出了“保存成功”，这不是网页。一个正常的网页包含`DOCTYPE\
  \ html`、`head`等内容，其中`head`里的`charset`声明了编码，浏览器才能正常显示。添加一个`notice.html`模板即可：\n\n\
  ```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\n    PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n    \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"zh-Hans\">\n    <head>\n\
  \        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  />\n        <title><?notice['msg']?></title>\n    </head>\n    <body>\n        <h1><?=$notice['msg']?>?></h1>\n\
  \        <p><a href=\"/\">首页</a></p>\n    </body>\n</html>\n```\n截图如下：代码下载：[`github.com/sinkcup/php-ebook-reader/tree/0.3`](https://github.com/sinkcup/php-ebook-reader/tree/0.3)\n\
  \n## 总结一下\n\n### 我的技术水平\n\n| HTML | PHP | 数据存储 | HTTP 协议 | 程序员的修养 | 等级 |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| 语义化：最简 HTML | 让内容起来 | 单机文件 | GET、POST | | 0.2\
  \ |\n| | | | | PC + Windows | |\n| | | | | | |\n| | 表现与 | | Unicode | | 0.3 |\n\n\
  ### 已解决的问题\n\n*   PHP 和 HTML 混写，很乱，怎么解决？\n    把 HTML 单独保存，PHP 中`require`即可，这样实现了表现与逻辑分离。\n\
  *   保存之后，在 Firefox 中页面码了？\n    HTML 中声明`charset`，浏览器才知道什么编码。\n*   `ANSI`与`ASCII`的区别，`UTF-8`与`Unicode`的区别，`GB2312`、`CP936`、`GBK`、`GB1830`的区别，为什么程序（`Android`、`iOS`、`Linux`、`OS\
  \ X`、`Windows`）都使用`Unicode`？\n    自行学习。\n*   百万薪的人怎么过日子的？\n    匿名用户：感谢大家的关注。很多朋友对行业[zhi.hu/3Rv9](https://zhi.hu/3Rv9)分享知乎\n\
  \n### 待解决的问题\n\n*   数据有多种方式，比如单机文件（`JSON`、`txt`）、单机数据库（`Access`）、网络数据库（`MySQL`/`MariaDB`、`Oracle`、`SQL\
  \ Server`）等等，根据项目进行选型。做 Web 一般采用开源免费的`MySQL`/MariaDB`，本书以`MySQL`为例。学校里应该学过`SQL`，如果没学过，请先学《SQL\
  \ 教程》。\n\n### MySQL\n\n```sql\nCREATE DATABASE `reader` DEFAULT CHARACTER SET utf8;\n\
  USE `reader`;\nCREATE TABLE `articles` (\n  `id` int(10) unsigned NOT NULL AUTO_INCREMENT,\n\
  \  `author` varchar(20) DEFAULT NULL,\n  `title` varchar(50) DEFAULT NULL,\n  `content`\
  \ text NOT NULL,\n  PRIMARY KEY (`id`)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\
  ```\n\n然后修改`add_article_submit.php`，把文章保存到数据库中。代码如下：\n\n```php\n<?php\n$input =\
  \ $_POST;\n$dsn = 'mysql:host=127.0.0.1;port=3306;dbname=reader;charset=utf8';\n\
  $user = 'root';\n$password = '1';\n$db = new PDO($dsn, $user, $password); //连接数据库\n\
  \n$sql = 'INSERT INTO `articles` (`author`, `title`, `content`) VALUES (' . '\\\
  '' . $input['author'] . '\\',\\'' . $input['title'] . '\\',\\'' . $input['content']\
  \ . '\\');';\n\n$stmt = $db->query($sql); //执行 SQL\n$id = $db->lastInsertId(); //获得自增\
  \ id\n\nif (!empty($id)) {\n    $notice = '保存成功';\n} else {\n    $notice = '出错了';\n\
  }\n$d = array();\n$d['notice'] = array(\n    'msg' => $notice,\n);\nrequire_once\
  \ __DIR__ . '/notice.html';\n```\n\n\n\n\n\n然后单篇阅读页`get_article.php`，根据`id`，查出一篇即可，这样比查出来所有文章合理多了。代码如下：\n\
  \n```php\n<?php\n$input = $_GET;\n$d = array();\nif (!isset($input['id']) || empty($input['id']))\
  \ {\n    $d['notice'] = array(\n        'msg' => '出错了：缺少参数',\n    );\n    require\
  \ __DIR__ . '/notice.html';\n    exit;\n}\n\n$dsn = 'mysql:host=127.0.0.1;port=3306;dbname=reader;charset=utf8';\n\
  $user = 'root';\n$password = '1';\n$db = new PDO($dsn, $user, $password);\n\n$sql\
  \ = 'SELECT `author`, `title`, `content` FROM `articles` WHERE id=' . $input['id']\
  \ . ' LIMIT 1';\n\n$stmt = $db->query($sql);\n$stmt->setFetchMode(PDO::FETCH_ASSOC);\n\
  $r = $stmt->fetchAll();\n\nif (empty($r)) {\n    $d['notice'] = array(\n       \
  \ 'msg' => '出错了：查无此文',\n    );\n    require __DIR__ . '/notice.html';\n    exit;\n\
  }\n\n$d = array();\n$d['article'] = $r[0];\nrequire_once __DIR__ . '/get_article.html';\n\
  ```\n\n代码下载：[`github.com/sinkcup/php-ebook-online-reader/tree/0.4.1`](https://github.com/sinkcup/php-ebook-online-reader/tree/0.4.1)\n\
  \n现在可以发表、查看首页、单篇阅读，功能都实现了。\n\n## 总结一下\n\n### 我的技术水平\n\n| HTML | PHP | 数据存储 | HTTP\
  \ 协议 | 程序员的自我修养 | 装备 | 等级 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 语义化\
