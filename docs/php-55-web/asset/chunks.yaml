    \nIP都是数字太难记了，现在网站都是用域名啊。如何使用域名访问本网站呢？\n\n很简单，域名是由域名注册商出售的，在google中搜索`domain`即可，各家价格都差不多，`.com`后缀约$8/年，还有很多有意思的后缀，比如[douban.fm](http://douban.fm)、[zhi.hu](http://zhi.hu)、[github.io](http://github.io)、[jianshu.io](http://jianshu.io)。但国内域名注册商大部分都不正规，你购买了域名，会发现实际管理员邮箱是商家的，最重要的资产是域名转移码，都不在你手里，这就很危险，你买的东西却不属于你，仍然属于商家。而在国外购买域名就很正规，管理员邮箱、转移码都是你的。\n\
    \n常见的国外域名注册商支持支付宝的有：[godaddy.com](http://www.godaddy.com/China)、[resellerclub.com](http://www.resellerclub.com)，支持VISA的就很多了，比如`register.com`、`name.com`。\n\
    \n网站正式运营的时候，需要购买顶级域名。现在只是学习开发，那申请一个免费的二级域名即可。提供免费二级域名的商家很多，比如花生壳[oray.com](http://oray.com/)，注册登录后，进入我的控制台——域名管理——壳域名——添加域名即可。比如我申请了一个`sinkcup.wicp.net`，指向`192.168.1.107`，如图：\n\
