    \ --- | --- |\n\n|  || 表现与业务分离 ||  || charset || Unicode ||  || 0.3 |\n\n### 已解决的问题\n\
    \n*   PHP和HTML混写，很乱啊，怎么解决？\n\n    把HTML单独保存，PHP中require即可，这样就实现了表现与业务逻辑分离。\n\n\
    *   保存之后，在Firefox中页面怎么乱码了？\n\n    HTML中需要声明charset，浏览器才知道用什么编码解析。\n\n*   ANSI与ASCII的区别，UTF-8与Unicode的区别，GB2312、CP936、GBK、GB18030的区别，为什么技术公司的程序（Android、iOS、Linux、OS\
    \ X、Windows）都使用Unicode？\n\n    请自行学习。\n\n*   【百万年薪的人都是怎么过日子的？】\n\n    匿名用户：感谢大家的关注。很多朋友对选对行业……[http://zhi.hu/3Rv9](http://zhi.hu/3Rv9)（分享自知乎）\n\
    \n### 待解决的问题\n\n*   查看`get_article.php`的代码，读一篇文章，却把所有文章取了出来，再取其中一篇，这样浪费性能啊，如果文章有成千上万篇，那怎么办？\n\
    \n    且听下回分解。\n\n# PDO MySQL\n\n# PDO MySQL\n\n## 如果文章有成千上万篇，该怎样保存？\n\n数据保存有多种方式，比如单机文件（JSON、txt）、单机数据库（SQLite、Access）、网络数据库（MySQL/MariaDB、Oracle、SQL\
    \ Server）等等，根据项目需要进行选型。做Web一般采用开源并且免费的MySQL/MariaDB，本书也以MySQL为例。\n\n学校里应该学过SQL，如果没学过，请先自学《SQL\
    \ 教程》[http://www.w3school.com.cn/sql/](http://www.w3school.com.cn/sql/)。\n\n自学：1天。\n\
    \n假设这个在线阅读项目叫做“reader”，需要一个“文章”表“articles”。建库建表代码如下：\n\n```\nCREATE DATABASE `reader`\
    \ DEFAULT CHARACTER SET utf8;\nUSE `reader`;\nCREATE TABLE `articles` (\n  `id`\
    \ int(10) unsigned NOT NULL AUTO_INCREMENT,\n  `author` varchar(20) DEFAULT NULL,\n\
    \  `title` varchar(50) DEFAULT NULL,\n  `content` text NOT NULL,\n  PRIMARY KEY\
    \ (`id`)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n然后修改`add_article_submit.php`，把文章保存到数据库中即可。代码如下：\n\
    \n```\n<?php\n$input = $_POST;\n$dsn = 'mysql:host=127.0.0.1;port=3306;dbname=reader;charset=utf8';\n\
    $user = 'root';\n$password = '1';\n$db = new PDO($dsn, $user, $password); //连接数据库\n\
    \n$sql = 'INSERT INTO `articles` (`author`, `title`, `content`) VALUES (' . '\\\
    '' . $input['author'] . '\\',\\'' . $input['title'] . '\\',\\'' . $input['content']\
    \ . '\\');';\n\n$stmt = $db->query($sql); //执行SQL\n$id = $db->lastInsertId();\
    \ //获得自增id\n\nif (!empty($id)) {\n    $notice = '保存成功';\n} else {\n    $notice\
    \ = '出错了';\n}\n$d = array();\n$d['notice'] = array(\n    'msg' => $notice,\n);\n\
    require_once __DIR__ . '/notice.html';\n```\n\n然后首页`index.php`把这些文章查出来即可，代码如下：\n\
    \n```\n<?php\n$dsn = 'mysql:host=127.0.0.1;port=3306;dbname=reader;charset=utf8';\n\
    $user = 'root';\n$password = '1';\n$db = new PDO($dsn, $user, $password);\n\n\
    $sql = 'SELECT `id`, `author`, `title`, `content` FROM `articles` LIMIT 10';\n\
    \n$stmt = $db->query($sql);\n$stmt->setFetchMode(PDO::FETCH_ASSOC);\n$articles\
    \ = $stmt->fetchAll();\n\n$d = array();\n$d['articles'] = $articles;\nrequire_once\
    \ __DIR__ . '/index.html';\n```"
  fmt: "\n这时候用浏览器访问[http://localhost/](http://localhost/)，就看到网站了。不过`localhost`代表本机，别人还是访问不了。所以别人要通过IP访问，比如我的电脑IP是`192.168.1.107`，那访问[http://192.168.1.107/](http://192.168.1.107/)即可。如图：\n\
