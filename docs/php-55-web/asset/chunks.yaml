    \n### 目录规划\n\n访问`index.php`是正常网页，但访问`index.html`看到了什么？\n如上所示，访问`index.html`会看到代码片段而不是正常的网页，这会给用户困惑。所以应该只访问`index.php`、`add_article.html`、`get_article.php`等文件，其他文件一律禁止。\n\
    \n如何禁止呢？\n项目里没有目录，所有文件都放在一起，是这样的：\n```\nadd_article.php\nget.html\nindex.php\n\
    ```\n\n改成下面的结构：\n```\nhtdocs/\n    add_article.php\n    get.html\n    index.php\n\
    res/\n    layout/\n        article.html\n        index.html\n```\n\n### Nginx\
    \ 配置\n\n找到`nginx`的配置文件，在这里：\n* Windows：`C:\\Windows\\Conf\\nginx.conf`\n* Linux：`/etc/nginx/sites-enabled/default`\n\
    \n修改其中的`root`，重启`nginx`即可。如图所示，目录变了，包含就变了。\n\n以前是：\n```\nrequire_once __DIR__\
    \ . '/index.html';\n```\n改成：\n```\nrequire_once __DIR__ . '../res/layout/index.html';\n\
    ```\n访问`index.html`会出现404错误，即“不存在”。而访问`index.php`是可以的。\n\n## 使用配置文件\n\n同一件事情重复做很多次浪费时间，是编程的大忌，违反了`DRY`原则（don't\
    \ repeat yourself）。使用配置文件解决此问题。\n\n配置文件什么格式？\n单独建一个`conf`目录，现在项目目录如下：\n```\nconf/\n\
    \    db.ini\nhtdocs/\n    add_article.html\n    get_article.php\n    index.php\n\
    res/\n    layout/\n        article.html\n        index.html\n```\n\n`db.ini`的内容如下：\n\
    ```\nhost=\"127.0.0.1\"\nport=\"3306\"\ndbname=\"reader\"\ncharset=\"utf8\"\n\
    username=\"root\"\npassword=\"1\"\n```\n\n然后每个页面解析配置文件，连接数据库，执行SQL。代码如下：\n```php\n\
    $conf = parse_ini_file(__DIR__ . '/conf/db.ini');\n$dsn = 'mysql:host=' . $conf['host']\
    \ . ';port=' . $conf['port'] . ';dbname=' . $conf['dbname'] . ';charset=' . $conf['charset'];\n\
    $db = new PDO($dsn, $conf['username'], $conf['password']);\n```\n如图所示：可以看到如果数据库地址、用户名、密码了，只用改`db.ini`即可，很方便。代码下载：[https://github.com/sinkcup/php-ebook-online-reader/tree/0.5.0](https://github.com/sinkcup/php-ebook-online-reader/tree/0.5.0)\n\
