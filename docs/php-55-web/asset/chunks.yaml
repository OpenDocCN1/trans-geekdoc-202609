    \n    且听下回分解。\n\n# 表现与业务逻辑分离\n\n# 表现与业务逻辑分离\n\n## PHP和HTML混写，很乱啊，怎么解决？\n\n一个页面分成两个文件即可，一个PHP做逻辑，一个HTML做模板。\n\
    \n比如“首页”`index.php`分成：`index.php`和`index.html`。`index.php`代码如下：\n\n```\n<?php\n\
    $articles = array();\n$file = './articles.json';\nif (file_exists($file)) {\n\
    \    $tmp = file_get_contents($file);\n    if (!empty($tmp)) {\n        $articles\
    \ = json_decode($tmp, true);\n    }\n}\n\n$d = array(); //d 是 data的意思，后续会用到\n\
    $d['articles'] = $articles;\nrequire_once __DIR__ . '/index.html';\n```\n\n`index.html`代码如下：\n\
