    # 15.2.4 FEATURES OF IoT-Based UAV Networks


    The IoT-based UAV networks'' features are the following [8]:


    +   a. Expense: The affordability of small UAVs within FANET (Flying Adhoc Network)
    stems from their reduced operational costs.


    +   b. Resilience: The presence of multiple UAVs ensures resilience in the event
    of a single UAV experiencing a mission failure.


    +   c. Acceleration: The increased number of UAVs results in executed mission
    completion.


    +   d. Scalability: The network of multiple UAVs exhibits scalability, allowing
    for the inclusion of additional UAVs within FANET. Consequently, this expansion
    facilitates the broadening of the mission''s coverage area [9].


    +   e. Reliability: Unfavourable atmospheric conditions can negatively impact
    A2G communication. In this scenarios, A2A communication can effectively address
    connectivity challenges, ensuring the dependability of the network.


    # 15.3 PERTinent WORK


    Within this segment, a compilation of pertinent endeavours concerning secure communication
    and authentication within IoT-based UAV networks is presented. While the number
    of published works in this domain may be limited, this chapter diligently strives
    to encompass the most significant contributions that are shown in Table 15.1,
    accompanied by a comparative analysis in Table 15.2.


    Lin et al. [10] examined the security and privacy issues relevant to the Internet
    of drones (IoD). They highlighted verifying the authenticity of drones and ground
    stations, safeguarding the identity and whereabouts privacy of drones, maintaining
    the confidentiality of data transferred from drones to the cloud, and ensuring
    secure data exchange among cooperating drones. The authors also provide remedies
    to protect the identity and location privacy of drones as well as the confidentiality
    of outsourced data.


    Teng et al. [11] introduced an authentication procedure aimed at facilitating
    communication between drones. This approach Elliptic Curve Cryptography (ECC)
    and Public Key Infrastructure (PKI). While their method offers certain security
    benefits, its implementation could be burdensome for devices with limited resources,
    such as drones.'
