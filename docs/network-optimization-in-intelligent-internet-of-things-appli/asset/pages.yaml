  md: '# # 1 IoT Networks

    Issues, Challenges, and Objectives


    Yogita Chhabra and Arpita Jadhav Bhatt


    # ## 1.1 INTRODUCTION


    “IoT is a network of physical objects with embedded technology that allows them
    to communicate, perceive, and respond to internal or external parameters or circumstances”
    (Gartner) [1–6]. IoT consists of tangible objects, including devices, cars, buildings,
    and machines with connectivity, sensors, and software installed to enable data
    collection, sharing, and analysis [7]. IoT is a vast network of unconnected devices
    that can communicate with one another and with individuals via the internet and
    share data over the internet without a human being present [1,3]. In addition
    to more complex systems such as transportation and utilities, these devices can
    comprise everyday objects as sensors and appliances.


    The network of interconnected devices enables real-time data collection and processing,
    delivering insightful information, and facilitates more efficient and effective
    decision-making. Challenges include security and data management [2,8]. By 2030,
    IoT insights estimate that there will be more than 50 billion connected devices
    globally, reflecting IoT technology’s rapid growth and proliferation [9].


    IoT has been a concept for decades, but in recent years it has grown quickly and
    has been widely adopted because of technological improvements, affordable sensors,
    and connectivity. As a result, things will essentially explode along with the
    number of connected devices. The number of internet-connected devices is likely
    to surpass 50 billion in the not-so-distant future [9]. As anticipated, IoT is
    expected to connect many devices, reaching billions and potentially trillions
    of interconnected things. IoT has become pervasive today, finding applications
    across diverse fields such as manufacturing, healthcare, agriculture, and transportation.
    It is a transformative driving innovation and efficiency in many industries [4].


    One of the major advantages of IoT is its capacity to open up new avenues for
    automation and optimization, which boosts productivity, lowers costs, and produces
    better results. For instance, IoT in healthcare can promote remote patient monitoring,
    enabling medical practitioners to deliver more individualized and prompt care
    [10]. IoT has the potential to streamline supply chains and production processes
    in the


    DOI: 10.1201/9781003045535-2'
  merge: -1
  img_proc: true
