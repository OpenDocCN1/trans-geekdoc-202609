  md: '# #17 Edge Computing-Based Design for IoT Security


    Parita Jain, Swati Sharma, Sangeeta Arora, Vikrant Shokeen, Puneet Kumar Aggarwal,
    and Mandeep Singh


    # ##17.1 INTRODUCTION


    By combining computing, storage, and network management tasks in a centralised
    way, cloud computing has become a popular method for businesses to achieve cost-effectiveness
    and flexibility. However, the centralised cloud computing architecture faces difficulties
    due to the growth of the Internet of Things (IoT) and mobile apps. When mobile
    devices connect to remote cloud servers to access sophisticated applications,
    they create additional loads on both access and backhaul networks, leading to
    high latency. The swift progress of IoT has resulted in fresh hurdles, including
    inflexible latency prerequisites, limitations in capacity, devices with restricted
    resources, the need for continuous services despite intermittent, and heightened
    security demands. These challenges are incompatible with the centralised cloud
    computing structure presently in use.


    # ###17.1.1 MOTIVATION


    There is a need to learn about edge computing-based architecture for IoT security
    due to IoT’s growing importance and its particular security difficulties. Edge
    computing (EC) is essential for IoT deployments because it provides advantages,
    including decreased latency, more scalability, and improved data privacy. One
    may address security issues, safeguard sensitive user data, and allow real-time
    threat detection by comprehending this paradigm. EC enhances resource efficiency,
    guards against DDoS assaults, assures legal compliance, and creates jobs in the
    growing IoT sector. It also assures reliable data processing, improves resilience,
    allows for secure device management, and future-proofs IoT systems, making it
    a crucial topic to investigate for complete IoT security.


    # ###17.1.2 CONTRIBUTION


    The chapter explains how the growing adoption of IoT technology produces enormous
    amounts of data that need further processing and analysis. Traditional cloud'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Edge Computing-Based Design for IoT Security


    computing, however, has drawbacks, including high network bandwidth requirements
    and high resource expenses for data transmission. The chapter also highlights
    how traditional cloud-based services lead to limited bandwidth, resulting in significant
    latency within the networks. This latency issue is particularly important in timesensitive
    IoT applications such as smart transportation, smart electricity grids, and smart
    cities where quick response times are critical, making it a crucial issue for
    IoT.


    IoT systems have issues due to the rising volume of data produced by IoT devices,
    the demand for quick processing and analysis, security concerns, and other factors.
    EC addresses resource issues and enhances system functionality by shifting computation
    jobs to the network''s edge. EC provides data processing and storage closer to
    the end user, lowering the value, bandwidth, and latency of data uploads. Implementing
    relevant security solutions locally, improves data privacy and prevents data leakage.
    EC helps IoT networks last longer by shifting computation from edge nodes. There
    has been research on EC and suggested architectures for IoT security, but more
    analysis and complex edge-based security designs are required.


    The remainder of this chapter is divided into the following sections: an overview
    of EC, outlining its meaning and contrasting it with other computing models, such
    as cloud computing, cloudlets, fog computing, and MEC is provided initially. In
    Section 17.2, various related concepts are addressed, and EC and cloud computing
    are discussed. The consideration of the security and privacy risks associated
    with EC for the IoT is discussed in Section 17.3, and possible remedies and preventive
    measures in Section 17.4 are also discussed. Additionally, a thorough examination
    of the security and privacy concerns for edge-enabled IoT is provided in this
    section. In Section 17.5, the difficulties of an edge computing-based architecture
    for IoT infrastructure are discussed, and in Section 17.6, some case studies to
    demonstrate the ideas are summarised. Finally, Section 17.7 concludes this chapter
    and includes a list of references.


    # 17.2 COMPUTING PARADIGMS ASSOCIATED WITH EDGE

    COMPUTING


    The section on EC in this chapter discusses different EC technologies as well
    as related computing paradigms. We compare various EC technology varieties well
    as EC and associated computing paradigms in this presentation.


    # 17.2.1 CLOUD COMPUTING


    Cloud providers like Google, IBM, Microsoft, and Amazon supply robust computing,
    storage, and networking infrastructure through visualisation techniques. It offers
    a pays-as-you-go pricing structure that gives customers access to remote computing
    capacity and data management services at a reasonable price. However, some essential
    applications require extremely low latency, which cloud-based apps cannot provide.
    The proliferation of IoT devices makes it necessary to install cloud resources
    close to the source. EC, which allows computer models to operate close to connected'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'devices, has emerged as a potential solution to address the growing need for
    high-bandwidth, low-latency, widely distributed, and confidential data.


    # 17.2.2 MOBILE COMPUTING


    The expansion of mobile devices has hindered the progression of cloud computing.
    With the help of the distributed computing model, mobile computing is utilised
    for location-based reminders and remote operation of mobile machinery. However,
    it encounters obstacles such as insufficient resources, communication latency,
    and balancing autonomy and interdependence. Fog and cloud computing have expanded
    the scope and accessibility of mobile computing, but they require more potent
    resources and virtualisation capabilities. The resource disparity between mobile
    computing, fog, and cloud computing has lessened with recent advancements in wireless
    protocols and mobile technology. However, precautions must be taken to guarantee
    safety when using a mobile device.


    # 17.2.3 MOBILE CLOUD COMPUTING


    Mobile cloud (MCC) enables the communication between cloud providers and mobile
    device users, allowing even low-end devices to access the resources of the cloud.
    MCC helps conserve mobile device battery life and run-intensive applications by
    processing and storing data in the cloud. MCC uses cloud computing and mobile
    technology''s flexibility and convenience to provide highly computational services.
    However, MCC has some drawbacks, including the generalised design not meshing
    well with decentralised apps, connectivity difficulties due to constant Internet
    connectivity, and latency issues, making it unsuitable for certain applications.
    Security concerns for mobile and cloud devices must also be considered.


    # 17.2.4 EDGE COMPUTING


    EC has become crucial for managing, storing, and processing data generated by
    connected devices, particularly IoT. Unlike MCC, EC is located at the periphery
