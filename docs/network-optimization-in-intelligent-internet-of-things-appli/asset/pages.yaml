    # 3.2.2 CORDON TOLLING


    Cordon tolling is also known as the cordon-pricing technique. There is a fee for
    entering a particular place and the primary purpose of tolling is to limit vehicle
    entry. Every entry point must be able to recognize cards and verify that they
    have paid, compensated, or will pay [20]. The toll applies to automobiles that
    either breach the cordon''s border or drive within its confines during high traffic
    volume. “Cordon” refers to a geographical boundary unequivocally delineated and
    encircles the tolling area [21]. The tolling scheme could consist of a flat price
    only during weekly travel times, defined as 7:00 a.m. to 6:00 p.m., on weekdays.
    This would be the most basic example. More complex systems may charge varying
    rates for vehicles at different times of the day, with varying types of cars,
    and at various points along the route (e.g., higher along the busiest thoroughfares
    than less crowded streets). Cordon pricing can increase revenue while easing traffic
    congestion in the cordon region. It is typically seen to be the most suitable
    for places with constrained road capacity, high demand, and drivers’ option to
    use other modes (like train) or adjust their travel plans to avoid peak hours
    when toll charges are high. Countries like London, Stockholm, and Singapore have
    adopted variations on the cordon-pricing principle [22].


    # 3.2.3 AREA-WIDE MIAGE TOLLING


    The complexity of distance-based tolling is significant and necessitates the implementation
    of uniform standards across the whole region and interoperability across countries.
    A road user tax is calculated using this method, which charges cars based on their
    VMT (vehicle miles traveled) [23]. The German truck toll is one example of this
    system; under this system, all trucks operating inside Germany must pay tolls
    depending on the distance they have gone within the country [24]. This tactic
    is comparable in some ways to the gas tax levied in the United States, in that,
    principle, the amount of tax owed by each vehicle is determined by the number
    of miles traveled. The primary goal is to control the mode of driving, while the
    secondary goal is to create income for the transportation system. The quantity
    of driving will be regulated to a lower degree.


    # 3.2.4 INTEGRATED SYSTEM MANAGEMENT


    In this far-reaching idea, the demand for transportation would be handled by the
    dissemination of information; passengers would have their pick of transportation
    modes and routes, as well as a variety of options for paying their trips [25].
    The price would provide an incentive for selecting the mode of transportation
    that is most efficient, and the market should determine how much capacity is available.
    It will be necessary to use highly complicated systems, such as communications
    between roadside infrastructure, vehicles, and travelers; nonetheless, it is anticipated
    that system users will be highly productive. The flexibility of the market and
    access to information are necessary prerequisites [26].'
