    # 11.9 LIMITATIONS OF EXISTING LIGHTWEIGHT CRYPTOGRAPHY


    Considering the above-mentioned work, we analyzed lightweight cryptographically
    secured algorithms for IoT security has certain limitations:


    +   **Secret key security:** By using lightweight cryptographic schemes, communicating
    entities share confidential information. However, the secret key is shared on
    the insecure classical channel which is susceptible to interception.


    +   **Algorithms:** The lightweight cryptographic algorithms are based on mathematical
    primitives. Despite the advantages, there is no provision for how these algorithms
    will safeguard IoT communications.


    +   **Key size:** The asymmetric schemes are popular as they provide secure key
    generation and distribution. However, to increase the security for asymmetric
    algorithms, as RSA, the key size should be increased. It makes encryption slower
    and increases the complexity.


    +   **Memory constraints:** The AES algorithm ensures safe communication. However,
    considering the IoT resource-constrained nature, AES is not acceptable due to
    high memory requirement to store larger blocks, key size, and s-boxes.


    # 11.10 CONCLUSION AND FUTURE WORK


    With the advent of IoT devices around us, connected to the internet is increasing
    rapidly. The major issues concerning these applications are security, privacy,
    and authentication. Given the need for lightweight cryptography schemes for devices
    with limited computational power, efficient sensing abilities, and energy constraints.
    From the review, we have analyzed that RSA and AES schemes impress by their more
    mathematical structures. On the other hand, hashing is considered the most suitable
    for ensuring authentication. In addition to that, block cipher techniques such
