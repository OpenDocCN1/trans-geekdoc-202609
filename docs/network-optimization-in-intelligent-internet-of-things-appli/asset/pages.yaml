  md: '# A Comprehensive IoT Security Framework Using Edge Computing


    # Architecture of IoTh


    ![](img/e0b54a8aa3102369506fc5feb80a6fde_305_0.png)


    Figure 16.5 Three, Four and Five-layer framework/architecture of IoT.


    These three layers combined up the whole system as shown in Figure 16.5. The sensing
    layer is tasked with acquiring data, the network layer enables communication and
    data transfer, and the application layer is used to make sense of the data gathered
    by the two layers.


    The sensing layer collects data using various devices like Radio-Frequency Identification
    (RFID) readers, sensors, wireless identification and sensing platforms (WISP),
    and actuators. Nodes will work together within a certain radio range to secure
    data communication in the IoT network. Data can be collected through the sensing
    layer and sent to the network layer. The network layer is in charge of transferring
    data between multiple networks. It supports internet access and computing devices
    like CC platforms and utilizes modern technologies such as 5G/LTE, Bluetooth,
    and Wi-Fi. This layer is essential for ensuring the data is routed and sent to
    the right destinations quickly and securely. The application layer serves different
    needs depending on requests sent from the network layer. It is home to a variety
    of IoT applications that are deployed by middleware functionalities. As fog/edge
    deployments become more widespread, applications that are made by different vendors
    will need to ensure compatibility and interoperability to function seamlessly
    within diverse and distributed network environments. [39].


    The three-layer architecture may seem straightforward, but when analysing the
    second layer, work can see the complexity of implementing services like data mining
    and analytics. This requires careful planning and consideration to ensure that
    the functionality of these services is retained while they are integrated into
    the architecture'
