    # 10.4.1 SIGNATURE-BASED IDS


    Attacks are identified by signature-based intrusion detection systems depending
    on specific network traffic patterns. Signatures are the patterns that the IDS
    recognize. Signature-based intrusion detection systems can easily spot attacks
    for whom the pattern (signature) is already present on the system. Despite this,
    it is hard to identify new attacks whose pattern (signature) is undiscovered.


    The [17] proposes an IDS to identify IDS and Virtual Network (VN) attacks. The
    authors suggest two types of called IDS routers and sensors. IDS have detection
    and firewall modules. Sensors or IDS detectors monitor and report harmful traffic
    to network nodes. IDS routers examine traffic for malicious packets. The IDS monitor
    sensor traffic and calculates the Received Signal Strength Indicator (RSSI), packet
    drop rate, and packet sending rate. Based on each node''s data, the 6LoWPAN Border
    Router''s (6BR) detection module decides if a node is malicious.


    IDS proposed in [18] using distributed monitoring for version number attacks (VNAs).
    It focuses on the DODAG version, DIO messages, and nodes'' rank. The method establishes
    various monitoring nodes that deliver a list of malicious nodes to DODAG by monitoring
    the RPL''s specification parameters. When IDS modules are installed in constrained
    devices, more storage and processing capabilities are required [19]. Designing
    IDS with the purpose of protecting all incoming lists, the roots network nodes
    to stop communicating with adversaries. Main and medium-sized networks function
    well, whereas large networks have excessive false positives/negatives. For large-scale
    networks, cross-monitoring each node with at least two nodes can be a solution.


    ELN [20] use artificial intelligence (AI) and ML on control premises to detect
