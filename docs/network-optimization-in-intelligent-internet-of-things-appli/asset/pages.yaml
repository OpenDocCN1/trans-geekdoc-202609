    # 10.3 RPL SECURITY ATTACKS


    RPL is vulnerable to various threats, some of which come from the traditional
    wireless sensor networks (WSNs). The RPL protocol is susceptible to both inside
    and external attacks. It is challenging to identify and defend against these attacks
    due to the vulner- able nature of nodes, LLN networks, and wireless networks;
    a lack of infrastructure; inadequate physical security; changing topology; unreliable
    connectivity; mobility of nodes; and resource limitations. The RPL protocol provides
    multiple configur- attentions to meet various mobility, heterogeneity, and topology
    changes. Resource-constrained nodes, changing topologies, and the wireless medium
    endure malicious attacks [12]. Examples of this information include the DODAG
    version, node rank, and IDs, although this list is not limited. A combination
    of attacks may have severe impacts like resource exhaustion of nodes, leading
    to a sig- nificant rate in communication packets and major degradation of the
    protocol''s data transfer efficiency. Figure 10.2 represents the classification
    of RPL attacks in various categories and subjet


    # 10.3.1 ATTACKS ON RESOURCES


    Attacks on resources usually cause legitimate nodes to conduct extra pro- cessing
    to drain their resources by exhausting node energy, memory, or computational'
