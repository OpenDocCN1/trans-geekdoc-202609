    power. It could influence network availability by saturating available connections
    and, hence, network lifespan, which can be greatly reduced. Direct and indirect
    attacks on resources are the two types of attacks.


    10.3.1.1 Direct Attacks: A malicious node produces the overload directly to degrade
    the network performance. The attacker does the resource depletion. This is typically
    accomplished when the storage mode is enabled by launching flooding attacks or
    overloading attacks on routing tables. The direct attack can be categorized into
    two attacks:


    Flooding Attack: This attack is carried out by flooding DIO and DIS messages.
    To join the network nodes, send the first message as a HELLO. DIO messages are
    called Hello messages in RPL and are used to send information about DODAG [13].
    This attack creates network congestion and may lead to node saturation.'
