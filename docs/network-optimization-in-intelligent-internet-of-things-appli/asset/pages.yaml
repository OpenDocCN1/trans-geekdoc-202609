    # 16.2 Edge-BA AUTHENT AND AUTHORIZATION FRAMEWORK


    Authentication and authorization are critical security measures that can help
    prevent various attacks, such as denied of service attacks [35]. IoT system architectures
    are anticipated to rely upon authentication and authorization mechanisms to ensure
    end-to-end security, but this is extremely difficult to achieve for various reasons.
    As an illustration, mutual authentication is complicated to set up due to the
    difficulty of establishing a direct trust. Moreover, numerous authentication methods,
    such as those utilizing digital signatures, are unsuitable for end devices in
    IoT. For example, Elseyed et al. (2023) proposed an illustration focusing on EGC
    servers as a proxy for authentication and authorization purposes [36]. In this
    concept, multi-factor authentication and authorization are implemented via control
    system pathways and an on-demand reputation monitoring service is used to confirm
    the identities of identities. To verify the information you know (such as a token
    or password), what you have, and/or what you are (such as biometrics), two-factor
    authentication often employs more than two separate authentication techniques.
    An IoT user sends an inquiry comprising physiological and identification data
    to the gateway during the authentication and authorization procedure. The gateway
    proceeds to authenticate the user and determine their level of authorization.


    Elseyed et al. (2023) proposed a novel control system gateway that acts as a proxy
    for identity surveillance services, multiple authentication methods and authorization,
    or, multi-factor certification. Verification forms various aspects of identity,
    including knowledge (e.g. username/password and security questions), possession
    (such as a token, a key, a certificate, or a smart fob), and/or-biometric metrics.
    In the authentication and authorization process, the IoT user submits a request
    along their biometric and identity information to the gateway, which then authenticates
    the user and determines their authorization level [36]. To mutually authenticate
    an IoT user and an IoT device, Sha et al.''s (2020) research suggests a solution
    that leverages an edge device as an intermediate [38].


