    changing rooms, hotel rooms, and Airbnb rentals. Although these devices are usually
    utilized for security, they are also sometimes used to breach privacy by recording
    you. A Wi-Fi jammer can prevent surveillance equipment from transmitting recorded
    clips over the Internet.


    +   e. Practical Demonstration in Rural Areas

    Our device is cheaper than the existing Wi-Fi jammers. This device can be used
    in rural schools/colleges to demonstrate network breaching and patch solutions
    to resolve issues. Basically, it can be used to teach children about working practices
    in a cheaper way.


    # 18.2 LITERATURE REVIEW


