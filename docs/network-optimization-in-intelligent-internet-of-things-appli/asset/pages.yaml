    # 16.2.2 ARCHITECTURE AT EDGE LAYER


    EGC brings forth a platform to propose and devise comprehensive and innovative
    sanctuary strategies for IoT applications. Such strategies are premeditated to
    meet the security requirements of endpoint devices to minimize the security burden
    placed on these devices by shifting the protection to the layer. By keeping safety
    apparatuses EGC, it is possible to reduce the security risks associated with the
    limited resources available on IoT devices. Edge-based architecture consists of
    many security architectures device-centric, user and terminal security.


    Device-centric: A device-oriented EGC security strategy for IoT devices is essential.
    Billions of IoT are tangible and physical objects that are embedded in the world
    and provide information, as well deciding to govern the physical realm. While
    user-centric IoT security focuses on protecting devices, device-centric IoT security
    tailors security measures to each specific device, considering factors such as
    resources, the sensitivity of the data it collects, and the potential impact of
    any actions. Moreover, device security can also be taken into account. Two notable'
