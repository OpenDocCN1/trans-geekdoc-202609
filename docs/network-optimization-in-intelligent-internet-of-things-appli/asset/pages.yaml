    it is expedient to develop lighter yet stronger cryptographic solutions. Based
    on AES primitive, the author [26] proposed a lightweight security enhancement
    scheme. Their work is based on a dynamic-key generation process based on time
    to provide authentication. Symmetric algorithms such as Height, Tiny Encryption
    Algorithm (TEA), and RC5 provide solutions for possible attacks such as saturation-related
    and differential attacks [5]. A secured IoT communication framework is'
