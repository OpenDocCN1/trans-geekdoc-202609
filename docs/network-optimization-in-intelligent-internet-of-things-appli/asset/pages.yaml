    10.3.2.1 Sub-Optimization Attacks: These attacks affect the network''s optimum
    convergence capability; that, they inhibit the construction of optimal routes,
    hence impacting network traffic and degrading network services.


    Routing Table Falsification: An adversary may attack by falsifying/forging the
    DAO control messages, forcing legitimate nodes to construct nonexistent downstream
    routes. As a result, when authorised nodes attempt to send data to nonexistent
    nodes, consequences can lead to unnecessary packet latency, packet drop, DAO inconsistency,
    and high control overhead results. This attack is only possible if the storage
    mode is enabled.


    Sinkhole: An attack of this kind is made in two parts (i) the malicious node pulls
    a large amount of traffic by advertising false information data; (ii) after receiving
    the traffic in an illegal way, it alters or drops it. In RPL networks, this attack
    may be executed by altering the rank value. Due to this forged advertising, other
    nodes wrongly choose a malicious node as an appropriate partner, while delivering
    higher performance. The attack changes the network''s topology or reduces its
    performance. Furthermore, the attacker can perform a blackhole attack if it decides
    to drop all communications [15].


    Wormhole: Wormhole attack uses two RPL attacker nodes, considered as nodes 1 and
    2, joined by a private network. Each packet received by node 1 is routed via the
    wormhole to node 2 and replayed afterwards. Wormhole attacks disrupt the routing
    route and are especially dangerous in RPL networks. When an adversary sends routing
    information through a tunnel to another portion of the network, that are truly
    false perceive each other as if they were neighbours. Consequently, based on the
    objective function, they cannot construct any optimal routes.


    Routing Information Reply: Valid control messages received from other nodes are
    saved by a node and sent later in the network. This attack is highly harmful because
    the topology and routing routes are frequently updated in dynamic networks. It
    will result in a topology.


    Worst Parent: This attack is the result of a “Rank attack,” which entails selecting
    the least preferred parent based is not optimized, leading to performance degradation.
    This attack is difficult to deal with child nodes depend on their parents to route
    packets, and neighbours cannot monitor it.


    10.3.2.2 Isolation Attacks: These types of attacks on the topology isolate either
    a single node or a group of nodes in the RPL network. This implies that such types
    of nodes cannot interact with their parents or the root


    Black hole: A malicious node discards all packets to transmit in a black hole
    attack. In combination with a sinkhole attack, this attack may be extremely harmful,
    and consequently, result in the loss of a substantial portion of the traffic.
    There is'
