  md: 'a central authority, such as a government or a bank. Blocks can be duplicated
    and disseminated across the network to mitigate the risk of failures, ensuring
    adaptability and enhancing data endurance.


    +   3. **Immutability**: Confirmed transactions cannot be erased within the blockchain
    system due to the interlinking of blocks through hash values.


    +   4. **Transparency**: Every participating node possesses identical privileges
    to access transaction data within the blockchain. In simpler terms, any node can
    engage with others while maintaining the integrity of confirmed transactions.
    However, there are no constraints imposed on the overall system''s operation.


    +   5. **Security**: Within blockchain''s framework of asymmetric cryptography,
    each transaction block is associated with a distinct cryptographic key, ensuring
    the preservation of data integrity. The core characteristics encompassing consensus
    algorithms, immutability, and anonymous identification ensure the entire chain''s
    dependability, privacy, and security. These attributes work cohesively to maintain
    the unaltered integrity of previous transactions.


    # ### 14.4.3 PROTOCOLS AND TECHNOLOGIES


    # #### 14.4.3.1 Consensus Protocol


    Blockchain ensures that all participants agree on the block to be added to blockchain.
    Blockchain networks utilize protocols to ensure the uniformity of state data among
    their members. These protocols define the criteria for validating a block or transaction
    and which participant has the authority to add transactions to the record through
    a process called ''mining''. The consensus blockchain algorithms are proof of
    work (PoW) and proof of stake (PoS). In PoW, cyber-attacks can be avoided by circulating
    a puzzle to every participant who may try to add a block to the blockchain. The
    participant has to spent efforts in the process. In PoS, the miner should have
    more cryptocurrency to have more processing. It decreased the computational expenses,
    unlike PoW, which demands greater processing power for puzzle resolution.


    # #### 14.4.3.2 Byzantine Fault Tolerance


    The scenario entails peers attempting to achieve consensus, yet within the peer
    group, there could be untworthy individuals who sabotage the consensus-building
    process. The tactics of these bettors encompass ignoring messages, disseminating
    false information, counterfeiting others'' messages, and engaging in ''two-face''
    behavior, where a node communicates contradictory viewpoints to different nodes.
    These approaches can potentially trigger Byzantine failures in networks that depend
    on consensus.


