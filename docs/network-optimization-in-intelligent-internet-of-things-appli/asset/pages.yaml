    # 10.6 LIMITATION WITH DL AND ML


    Deep learning can identify large-scale attacks in IoT with computing efficiency
    in a multilayer manner. DL delivers cutting-edge approaches, efficiency, and performance
    not attainable with conventional ML algorithms. A proposed or trained model for
    one kind of problem may not function when applied to another problem in the same
    area. Retraining of models is needed for applying models to the same kind of problem.
    ML-based techniques produce acceptable performance metrics without restrictions.
    Almost every ML algorithm contains hyperparameters whose values are specified
    before the learning process, and these parameters affect the learning system''s
    behaviour. Due to the fixed data sets used in supervised learning, the RL and
    reinforcement learning (DRL) are not stable [48]. Training in a simulated environment
    utilizes an infinite amount of training data and deterministic system dynamics
    and not accurately replicate real behaviour. For real-time data streaming in real-time
    applications, DRL and RL systems suffer from significant and unexpected delays
    in computing rewards and calculations. There are significant restrictions in DL
    techniques, such as no intra-layer connection, the network needs to be manually
    configured, and expensive models in terms of power usage and other computational
    resources [49]. Compiling complex ML algorithms is difficult since they need a
    lot of memory and energy when IoT systems. IoT devices have limited resources
    and extensive data collection [18, 50, 51].


    ML and DL also suffer from the butterfly effect, which is a situation in which
    a little alteration in a system''s takes results in turmoil in the output. Both
    ML and DL are sensitive to this impact in this situation. This problem exposes
    ML and DL algorithms used in IoT vulnerable to attacks in which adversaries alter
    input data to render the system unstable [52].


    RL methods have a longer convergence time, which may be inappropriate for real-time
    applications. Furthermore, timing is crucial for safety-critical systems, and
    the system cannot tolerate delays. Therefore, additional research is required
    to increase the convergence rate. Training time is another barrier to deep learning
    models; as the training dataset rows, training time increases significantly [53].


    There are issues with the lack of relevant and sufficient data sets for datriven
    ML and deep learning approaches. Data availability and data security is a major
    limitation. Learning techniques often example and utilize various attributes to
    generate data sets. If a training data collection has low-quality data that incorporates
    noise, deploying a comprehensive and accurate learning method may not be perfect.
    As a result, authentication of training data sets is a significant difficulty
    in ML approaches for successful IoT security [54]. Significant data sets are required
    to fully use ML algorithms in IoT systems, which are frequently difficult to collect
    depending on whether the system can recognize dangers and take appropriate steps.
    In this regard, data augmentation is a significant way to generate sufficient
    data collection based on existing actual data. However, there is a difficulty
    in that the generated new data samples must be correctly divided into different
    classes for ML algorithms to achieve optimum accuracy.'
