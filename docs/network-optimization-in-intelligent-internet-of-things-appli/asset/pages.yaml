    Network Optimization in Intelligent IoT Applications


    $T_R N$ signifies True Negative value means a total number of cases in which the
    predicted attack is not the same as the actual attack.


    $F_A P$ denotes False-Positive value, means the total number of cases in which
    prediction is attacked but actually it''s not there.


    $F_R N$ signifies False-negative value, means the total number of cases in which
    prediction is not attacked but actually it''s there.


    # 10.5.1 ACCURACY


    Accuracy is measured as successfully identifying correct attack instances to the
    total attack instances. It can be defined as follows:


    ```

    $accuracy = \frac{T_R P + T_R N}{T_R P + F_A P + T_R N + F_A N} \quad (10.1)$

    ```


    # 10.5.2 PRECISION


    It is defined as the ratio of true positive identified attack cases to total positive
    identified attack cases. It is calculated as given in Eq. (10.2):


    ```

    $precision = \frac{T_R P}{T_R P + F_A P} \quad (10.2)$

    ```


    # 10.5.3 RECALL


    It measures the actual attack cases which are predicted correctly, also called
    as sensitivity. It is the ratio of the number of attack cases that have been accurately
    classified to the total number of positive attack cases as shown in Eq. (10.3):


    ```

    $recall = \frac{T_R P}{T_R P + F_R N} \quad (10.3)$

    ```


    # 10.5.4 F1-SCORE


    F1-measure considers accuracy and recall and is defined as the harmonic mean of
    the two measures. Its value lies between 0 and 1. It can be calculated as follows:


    ```

    $F1 - score = \frac{2 \times (precision \times recall)}{precision + recall} \quad
    (10.4)$

    ```'
