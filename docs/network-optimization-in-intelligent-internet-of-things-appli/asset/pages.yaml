  md: '# Secure Communication and Authentication in IoT-UAV Networks


    UAV and the GCS. This aggressor strategically places themselves between the two
    entities, masquerading each side to potentially infiltrate data, introduce fraudulent
    information, or cause disturbances in the communication flow. This deceitful manoeuvre
    undermines the reliability and security of the communication pathway [19].


    # 15.4.3 REPLAY ATTACK


    In the context of an UAV network, a replay attack involves the playback of previously
    recorded data exchanges or communications. In this situation, a malicious actor
    captures data transmitted from UAVs and later replays it to the network or cause
    operational disruption. This could lead to unauthorised entry, propagation of
    inaccurate directives, or data manipulation, concurrently eroding the network''s
    dependability and security [19].


    # 15.4.4 BRUTE-FORCE ATTACK


    In IoT-UAV networks, a brute-force attack involves a systematic and exhaustive
    approach by a malicious intent to test all conceivable permutations of passwords
    or encryption keys. This endeavour is undertaken with the objective of unauthorised
    network entry. In this scenario, the attacker sets their sights on the security
    protocols within the UAV network integrated into the Internet of Things (IoT).
    By repeating trials of various combinations, the attacker strives to uncover the
    accurate password or key, compromising the network''s security posture and potentially
    obtaining command over the UAVs or gaining access to sensitive data. This attack
    capitalises on feasible or easily deductible passwords, or entity secures, underscoring
    the vital need for robust security measures to counteract such impending dangers
    effectively.[19].


    # 15.4.5 PHYSICAL CULTURE ATTACK


    In UAV networks, a physical capture attack entails a malicious individual physically
    seizing of an UAV to compromise its functioning, data, or payload. This attack
    commonly demands direct proximity to the UAV, granting the attacker the ability
    to manipulate its components, alter software configurations, or abscond with sensitive
    data. The attacker may employ diverse tactics, intercepting the UAV during flight,
    taking control while grounded, or utilising deceptive techniques to establish
    authority. This attack presents a notable menace to the security and reliability
    of UAV operations, highlighting the critical significance of implementing rigorous
    security measures to avert unauthorised access and tampering [19].


    # 15.4.6 SESSION KEY ATTACK


    In UAV networks, a session key attack involves a malevolent endeavour to undermine
    the security of session keys employed to encrypt and ensure the confidentiality
    of communication among elements within the UAV network. Within this attack category,
    an unapproved individual or entity strives to intercept, manipulate,'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'or exploit these session keys with the aim of gaining entry to the network
    without authorisation or deciphering encrypted data. Such an assault holds the
    potential to result in unapproved data access, unanticipated manipulation of UAVs,
    or the revelation of sensitive information. The prevention of session key attacks
    paramount importance to uphold the integrity and security of UAV networks, necessitating
    the implementation of resilient encryption protocols and stringent security measures
    [19].


    # 15.4.7 UN-TRACEABILITY


    Un-traceability within UAV networks pertains to the quality of guaranteeing that
    activities and transactions occurring in the network cannot be readily associated
    with particular UAVs or individuals. In this framework, un-traceability strives
    to obscure the source and destination of data or communication, delivering a degree
    of anonymity and confidentiality for both UAVs and their operators. This aspect
    thwarts the straightforward identification of which UAVs partake in specific actions
    by external observers, amplifying security measures and safeguarding confidential
    information [17].


    # 15.4.8 ANONYMITY


    Anonymity within UAV networks signifies a condition wherein the identities of
    entities, encompassing UAVs and operators, engaged in network communications and
    activities remain hidden or undisclosed. This trait strives to guarantee that
    actions and interactions occurring cannot be readily linked to particular individuals
    or devices. Through upholding anonymity, UAV networks elevate privacy and security
    measures, introducing complexity for unauthorised entities seeking to trace or
    pinpoint participants. As a result, sensitive information and operational integrity
    are safeguarded effectively [18].


