  md: 'resource-constrained nature of IoT with low memory power, limited battery,
    limited computational power, and real-time data access. To address these issues,
    lightweight cryptographic schemes need to be designed. The lightweight cryptographic
    schemes can be executed on IoT platforms like Radio Frequency Identification(RFID)
    and wireless sensor network (WSN). The lightweight schemes mainly consider small
    code measures, little block sizes, limited block sizes, and smaller key sizes.
    The major part involving the lightweight schemes is the hash function, distribution,
