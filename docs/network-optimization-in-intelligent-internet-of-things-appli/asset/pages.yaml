  md: '# 18.9.3 CLONEBeACON ATTACK


    An evil twin is a spoofing cyberattack that works by tricking users into connecting
    to a fakeWiFi AP that mimics a legitimate network. Once a user is connected to
    an "clone beacon" network, hackers can access everything from network traffic
    to private login credentials.


    For instance, we have mounted cloneBeacon attack on available network "RasPi",
    then multiple available networks will be shown for the same Wi-Fi as can be seen
    in Figure 18.7. Now, if a user gets connected to the fake network, his information
    will be stolen and stored in the database.


    # 18.10 CONCLUSION AND FUTURE WORK


    Wi-Fi jammers are devices that disrupt the normal functioning of a wireless network
    by specially crafted "deauthentication" packets to the network. They can be used
    for various purposes, including performing DoS attacks, stealing sensitive information
    transmitted over the wireless network, or disrupting critical communications.
    It is generally not legal to use a Wi-Fi jammer to disrupt the operation of a
    wireless network without the owner''s permission. In the proposed work, Wi-Fi
    jammer can deauth, beacon, and clone attack. Furthermore, it is simplified, portable,
    and cheaper than other devices in the market.


    In future, some attacks can be added to Wi-Fi jammer such as probe attack. Furthermore,
    personal information of users can be captured by interfering in the communication
    between the network and the user and cannot cast a dark shadow on the IoT security.


