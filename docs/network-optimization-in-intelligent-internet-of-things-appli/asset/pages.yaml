    # 17.2.4.1 Cloudlet Computing


    A concept first proposed by Carnegie Mellon University in 2009 brings data storage
    and processing cloud to user equipment (UE). Cloudlets, or mini data centres,
    are strategically placed near-edge devices to offer computing resources and storage
    for nearby UEs. Cloudlets allow for moving from mobile devices to local edge-of-network
    cloudlets using virtual machines. Although cloudlets have less processing capacity
    than traditional clouds, they use less power and have lower latency. Cloudlets''
    dependence on Wi-Fi connections and the need for mobile UEs to toggle between
    Wi-Fi and the mobile network is a significant drawback.


    # 17.2.4.2 Mobile Ad Hoc Cloud Computing (MACC)


    It is an alternative to cloud computing for enabling edge computing at the edge.
    MACC allows nearby devices to pool their computing resources and run computationally
    intensive applications. Unlike cloudlets, MACC is highly dynamic and lacks infrastructure
    a centralised cloud, relying on portable electronic devices for data storage,
    processing, and distribution. While MACC can carry out intensive computing, it
    does not support real-time IoT applications due to limited resources. MACC is
    based on the same concept as a mobile ad hoc network (MANET) and requires visitors
    to bind their mobile devices to use its facilities.


    # 17.2.4.3 Fog Computing


    A form of distributed computing paradigm called fog computing uses nodes to speed
    up data transfer and analysis between endpoints and the cloud. It makes it possible
    for computing, storage, networking, decision-making, and data administration to
    occur near users or IoT devices that need data processing, reducing latency and
    increasing availability. Fog computing could benefit from various industries,
    energy, manufacturing, transportation, healthcare, and smart cities. In contrast
    to EC, Fog computing uses a hierarchical structure to support cloud-to-things
    processing, networking, storage, control, and acceleration throughout the full
    continuum.


