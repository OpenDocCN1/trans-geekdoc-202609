    AD experience reduced memory, thinking, and ability to perform daily tasks. AD
    affects memory, cognition, and daily function. Amnesia is a common symptom that
    begins with mild forgetfulness and progresses to an inability to remember recent
    events or recognize familiar people.


    As the disease progresses, people may have problems thinking, judging, and making
    decisions. Difficult tasks like managing money or following instructions become
    difficult. AD can affect language skills, making communication difficult. Changes
    in mood, attitude, and behaviour are common, along with restlessness, confusion,
    and withdrawal from activities. These cognitive and behavioural affect daily functioning,
