    process proceeds for the subsequent block.


    # 14.4.2 CHARACTERISTICS


    The fundamental characteristics of blockchain that make it attractive for IoT
    systems are:


    +   * **Ledger:** It functions as a decentralized and communal database that holds
    records of all executed network transactions. The ledger guarantees entities''
    simultaneous authentication and confirmation of each transaction. Once transactions
    are completed, the information becomes immutable and cannot be altered or removed.


    +   * **Decentralization:** Blockchain employs a variety of consensus mechanisms
    to verify transactions and uphold the distributed ledger without the need for'
