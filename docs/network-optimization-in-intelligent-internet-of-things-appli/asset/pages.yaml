    # 4.4 SYMPTOM OF PEOPLE WITH AD


    People with AD usually have many symptoms that gradually worsen over time. Mental
    retardation is a common condition, particularly affecting the handling of recent
    events and new information. This may appear as forgetting the name, giving the
    wrong item, or repeating the question. Cognitive decline is not limited to memory
    but also includes language difficulties such as finding the right words or following
    a conversation. Problem-solving and decision-making skills are reduced, which
    leads to problems planning and organizing activities. Behavioral changes such
    as confusion, irritability, and mood swings are also common in people with AD.
    Some major symptoms of AD are as follows:


    +   - Loss of memory, recently events and new information.

    - Difficulty in language and communication, such as finding the right words or
    following a conversation.

    - Critical thinking and problem-solving skills.

    - Difficulty planning, organizing, and executing tasks.

    - Confusion and disorientation, especially related to time, place, and familiar
    surroundings.

    - Mood swings, sensitivity, and personality changes.

    - Loss of initiative and motivation.

    - Difficulty performing daily activities of daily living, such as dressing, bathing,
    and eating.

    - Withdrawn from social interaction and entertainment.

    - Problems with spatial awareness and perception.


