  md: '# Intrusion Detection System for RPL Protocol Attacks in IoT


    **Routing Table Overhead:** The proactive nature of RPL implies that the storing
    mode is activated, they generate and produce routing tables. Routing overflow
    involves false routes using DAO messages to overload a node’s routing table. This
    limits legitimate route building, affects network performance, and might cause
    memory overflow.


    10.3.1.2 Indirect Attacks: These attacks are those in which the hostile node attacks
    another node to an overloaded network. It consists of three types of attacks:


    **Increasing Rank Attack:** It intentionally increasing the RPL node’s rank to
    cause network loops. When the node wishes to modify its rank, it requires updating
    its node’s list by removing nodes with a higher rank with a low-rank value. When
    sending a packet to the root node, a node in a DODAG selects a parent from this
    list to reduce routing costs. A malicious node promotes a greater rank than it
    really has, which may lead to an attack if no loop avoidance method is used.


    **Inconsistency Attack:** An DAG node identifies a RPL inconsistency when the
    packet arrives with a ‘O’ bit from a higher rank and vice versa [14], the node
    does not maintain the rank relationship. This could lead to loop formation in
    the graph. This problem is managed via the Rank-Error ‘R’ flag bit. One of two
    ways may occur when a node detects an inconsistency: (i) the node rejects the
    packet and (ii) the node rejects the packet and restarts the timer. Consequently,
    control messages can be issued frequently. The malicious node only needs to change
    the flags or add new flags to the header to compromise the integrity of the network.
    The direct result of this attack is a reset of the targeted node’s DIO trickle
    timer. This also depletes the batteries of the nodes neighbourhood and influences
    the availability of connections. The attack affects the node’s whole neighbourhood
    because it needs to filter excessive traffic. Furthermore, tampering with genuine
    traffic makes a target node can discard all packets. This can lead to a black
    hole attack.


    **Version Number Modification:** The version number is sent down the DODAG graph
    without being altered in any, and the root node is the sole node that increases
    whenever there is a need for the rebuilding of the DODAG (also known as “global
    repair”). An earlier value implies that the node has not been updated to the new
    DODAG graph, whenever a DIO message is sent to the neighbours, an attacker may
    modify the version number by maliciously increasing this. An attack of this kind
    necessitates the needless rebuilding of the entire DODAG graph which can lead
    to exhaustion of node resources and congestion in the network. This attack has
    the possibility of causing several loops, leading to packet loss.


