  md: '# #10 A Study on Intrusion Detection System for RPL Protocol Attacks in Internet
    of Things


    Kajal Mittal and Payal Khurana Batra


    # ## 10.1 INTRODUCTION


    IoT (Internet of Things) represents a technological revolution that serves as
    a global network for connecting physical things to the Internet and facilitates
    the exchange of information and services.The future Internet will comprise heterogene
    linked devices that will expand the world''s borders with physical and virtual
    entities. It is predicted that in comparison to 2019, the USD 5 billion IoT investment
    would triple to reach USD 15 billion. The IoT investments in India are expected
    to reach ~USD 15 billion by 2021 compared to USD 5 billion in 2019 [1, 2]. Gartner
    estimates there would be a 21% hike from 2019 and around 5.8 billion endpoints
    in 2020 in the enterprise and automotive IoT market [3]. The industries are adopting
    IoT to increase profit and become the leading industry in the market.


    IoT empowers the development of various industrial applications and user-oriented
    IoT applications. IoT facilitates users living more smartly with the help of its
    applications, as smart agriculture, smart cities, smart environments, and many
    more. IoT is vulnerable to security threats and multiple vulnerabilities inherited
    from the standard communication protocols and the Internet''s foundations. A report
    revealed by Hewlett Packard [4] states that several vulnerabilities occur in 70%
    of the most frequently operated IoT devices. The drastic increase in the number
    of IoT attracts attackers'' attention and creates high security and privacy risks.


    Maximum IoT applications are enabled by Low Power and Lossy Networks (LLNs) using
    IPv6 low-power personal area networks (6LoWPAN). Low throughput and loss communication
    links are provided by the LLNs [5]. Due to the limited resources, LLNs constrain
    the use of 굉장 computers and communication technology. Furthermore, such networks
    employ-constrained devices (nodes) that are low power, low energy, and have onboard
    memory and processing capabilities [6]. The Internet Engineering Task Force (IETF)
    suggested the 6LoWPAN stack to enable interoperability and IPv6 functionality
    for IoT devices [7].'
