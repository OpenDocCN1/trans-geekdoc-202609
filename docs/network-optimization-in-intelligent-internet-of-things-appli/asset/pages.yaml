    A swarm of particles traveling a multidimensional search space is what the Particle
    Swarm Optimization (PSO) algorithm mimics. Each particle stands for a possible
    answer to the optimization issue. The algorithm iteratively adjusts the particles''
    velocities and positions based on the particles'' individual and collective best
    positions at that. The influence of the particle''s optimum positions on its movement
    is governed by the cognitive and social learning components ($c1$ and $c_2$).
    Exploration and exploitation are balanced according to the inertia weight ($w$).
    The particles eventually arrive at the best outcome as they explore and update
    the search space. When a predefined termination condition is met, usually after
    a predetermined number of iterations, the algorithm ends.


    # Algorithm: Particle Swarm Optimization (PSO)


    +   1. Initialize swarm of particles with arbitrary positions and velocities as
    $X(t)$ and $V(t)$, respectively.

    2. Position and Velocity of the particle is given by $X(t)=(x(t),y(t))$ and $V(t)=(v_x(t),v_y(t))$,
    respectively

    3. Repeat until the termination condition is met:

    Update each particle''s velocity:

    $V(t+1) = \omega V(t) + c_1 \cdot u_1(P_{best}-X(t)) + c_2 \cdot u_2(P_{gbest}-X(t))$

    where: $u_1(t)$ is the random number which takes a value between 0 and 1.

    $u_2(t)$ is the random number which takes a value between 0 and 1.

    Update particle''s position: $X(t+1)=X(t)+V(t+1)$, where $X(t)$ denote the position
    of particle $i$ in the search space at time step $t$; unless otherwise, $t$ denotes
    discrete time steps. The position of the particle is changed adding a velocity,
    $V(t)$, to the current position.

    Update the best position and fitness value for each particle if necessary.

    4. Return the best solution found.'
