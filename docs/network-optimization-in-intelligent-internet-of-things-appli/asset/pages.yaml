    also a grey hole (or selective forwarding attack) form of this technique in which
    the attacker discards a selective subset of the network trace.


    DAO Inconsistency: It arises when a node has a previously learned downward route
    from a DAO message, but this specific route is not valid in the child node''s
    routing table, hence delivers the packet to another neighbour.


    # 10.3.3 ATTACKS ON TRAFFIC


    10.3.3.1 Eavesdropping Attacks: The pervasiveness of RPL networks may enable the
    placement of malicious nodes engaged in eavesdropping activity such as:


    **Sniffing:** This attack involves listening to the network traffic. This attack
    seems quite frequent in wired and wireless networks, and it threatens communication
    confidentiality. The attacker could use a compromised device or a shared medium
    to directly capture packets to carry out this attack in wireless networks. Because
    of its passive nature, this attack is hard to detect. When the attacker is external,
    the only option to avoid sniffing is to secure communications.


    10.3.3.2 Traffic Analysis: This attack is possible when the packets are encrypted.
    Similar to sniffing attacks, by identifying parent-child links, the objective
    is to get information regarding the RPL network, such as a topology''s visibility.
    A malicious node could be able to initiate further attacks using the information
    collected as a result of this attack. The consequences are dependent on the attacker''s
    node rank.


    10.3.3.3 Misappropriation Attacks: The identity of a valid node is stolen in misapproximation
    attacks, and performance is overwhelmed. The RPL network is not significantly
    affected by these attacks. They enable the attacker to understand the network''s
    topology better, gain high access, or intercept a huge proportion of the traffic.
    They are, however, often utilized as a preliminary to other types of attacks,
    like those found in the earlier categories.


    10.3.3.4 Increased Rank: The lower the rank in a DODAG graph, the closer the node
    is to the root, and it is expected to manage more traffic. Misrepresenting its
    performance occurs when a malicious node purposefully broadcasts a lower value
    than possesses. Consequently, the attacker connects several valid nodes to the
    DODAG and brings in a significant portion of the traffic. An attacker may modify
    the rank value of the RPL protocol by falsifying DIO messages which lead to sinks
    and eavesdropping attacks.


    10.3.3.5 Identity Attack: Identity attacks are a combination of spoofing and Sybil
    attacks.


