    # 8.2.2 CAUSES OF NETWORK CONGESTION


    When there is a significant amount of data created by medical devices and wearables
    that needs to be communicated over the network, medical IoT network congestion
    may happen. The following categories can be used to classify the root causes of
    network congestion:


    +   High Network Traffic: One of the most frequent reasons for network congestion
    in medical IoT is high network traffic. The network infrastructure may get overloaded
    if too many devices are transmitting data at once, which could cause delays or
    interruptions in data flow.


    +   Insufficient Bandwidth: Another typical reason for network congestion in medical
    IoT is insufficient bandwidth. Network congestion can happen when there is not
    enough bandwidth available to manage the load produced by wearables and medical
    devices, which can cause delays or disruptions in the data transmission process.


    +   Network Topology: Network congestion in medical IoT can also be influenced
    by the network topology or the actual design of the network infrastructure. The
    effective transmission of data can be hampered by bottlenecks and congestion sites
    caused by improperly planned or configured network topologies.


    +   Network Security: Network congestion in medical IoT can also be caused by
    network security protocols. Security procedures can slow down data transfer and
    cause delays in medical treatment when they are too restrictive or improperly
    designed.


    +   Network Devices: In medical IoT, network hardware like routers, switches,
    and firewalls can potentially cause network congestion. These devices may create
    a network bottleneck when they become old or overworked, causing data transmission
    to be delayed or interrupted.'
