    # 4.2 LITERATURE SURVEY


    The use of data mining tools for the early prediction of AD has advanced because
    of several case studies and research findings. This research has investigated
    the possibilities for precise prediction models using various data sources, including
    clinical data, genetic markers, neuroimaging, and cognitive tests. Researchers
    monitored an older cohort for 10 years while detailed clinical data were gathered,
    including demographics, medical histories, and cognitive evaluations. Data mining
    techniques were used to predict AD trends. Certain demographic characteristics,
    including age and education level, together with cognitive performance significantly
    and accurately predicted the onset of AD [1]. Further, deep learning methods were
    used to analyse neuroimaging data to forecast the course of AD. A convolutional
    neural network (CNN) was used in the study to extract features from brain magnetic
    resonance imaging (MRI) data. Using the CNN-based model, it was possible to distinguish
    between healthy controls and people who would eventually develop AD with astonishing
    precision. The results demonstrated the promise of deep learning and neuroimaging
    for early AD prediction [2]. Many researchers used machine learning methods to
    forecast AD using a large dataset of genetic markers. They discovered gene variations
    linked to greater susceptibility to the disease by comparing the genetic profiles
    of people with and without AD.'
