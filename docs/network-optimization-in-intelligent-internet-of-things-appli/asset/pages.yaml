    solutions, (2) implementing a symmetric key onto the device, (3) handling and
    distribution of secure key, and (4) ensuring mutual authentication with variety
    and diversity of devices. Our research helps other researchers to find the best
    suitable lightweight cryptographic solutions for secure IoT communication frameworks.


