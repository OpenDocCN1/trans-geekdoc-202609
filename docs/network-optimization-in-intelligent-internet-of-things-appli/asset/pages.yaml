    Oracle Model (ROM).


    # 11.7.3 MULTI-FACTOR AUTHENTICATION SCHEMES


    The lightweight schemes are used for authentication such as multi-factor authentication
    based on ECC, XOR, and bitwise operations [39]. Other password schemes, graphical
    authentication schemes are also popular [40] for authenticating users. Similarly,
    many schemes based on three parameters [41] were proposed. These schemes are designed
    to overcome the drawbacks of previous schemes, such as stolen card attacks and
    offline password guessing attacks. The multi-factor schemes are classified according
    to authentication factors as (a) What you know, e.g. user credentials. (b) What
    you have, e.g. authorized smart card. (c) What you are, e.g. your biometric identity?
    Examples of multi-factor schemes are Google 2-step and FIDO U2F (universal two-factor)
    [42].


