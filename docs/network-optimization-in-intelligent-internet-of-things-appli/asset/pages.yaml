    # 11.4.1 SECURITY ISSUES


    To achieve a high-security IoT framework, the following issues need to be considered:


    +   - **Maintaining Data Integrity:** The IoT data needs to maintain the integrity
    of the network. Integrity ensures reliable communication between users. The IoT
    architectures must be capable of providing integrity. Integrity confirms that
    the data is safeguarded from unauthorized users.


    +   - **Maintaining Data Confidentiality:** It ensures the user''s confidential
    information cannot be leaked to any unauthorized user. The major concern of IoT
    smart objects is maintaining the confidentiality of data among communicating entities.
    In addition to that, important communication protocols such'
