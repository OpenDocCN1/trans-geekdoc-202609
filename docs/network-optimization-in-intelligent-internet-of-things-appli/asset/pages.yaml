    # 16.2. Edge Computing-Based Intrusion Detection System


    A multitude of IoT devices were breached by attackers in 2016 and utilized to
    execute a Distributed Denial of Service(DDoS) assault on multiple Domain Name
    System (DNS) servers by Dye Inc. This resulted in a considerable loss due to the
    disruption of internet connectivity across a large region. The advanced system
    could have detected the DDoS attack early and minimized the resulting damage.
    Edge-based intrusion detection systems demonstrate various benefits with the additional
    information available at the edge [33]. Figure 16.4 illustrates a conceptual design
    for such a system. This design incorporates a distributed traffic monitoring service
    that gathers live traffic data. Intrusion detection algorithms are executed on
    each edge device to analyse the traffic. Additionally, traffic information from
    various edge devices is examined to detect collaboration intrusion. The outcomes
    of finding procedure are enforced by the network managers installed at the edge
    endpoints.


    ![](img/e0b54a8aa3102369506fc5feb80a6fde_303_0.png)


