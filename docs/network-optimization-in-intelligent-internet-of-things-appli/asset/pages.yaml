    # 18.4 SYSTEM REQUIREMENT


    System requirements refer to the minimum specifications and capabilities that
    a computer or other electronic device must meet to run a particular software program
    or operating system. This section discusses both hardware and software requirement
    for Wi-Fi jammer.


    # 18.5 HARDWARE REQUIREMENT


    For building a Wi-Fi jammer, NODEMCU, charging module, and booster module are
    required as discussed below:


    # 18.5.1 NODEMCU


    NODEMCU is an open source IoT platform with inbuilt microcontroller and Wi-Fi
    module as shown in Figure 18.2. It contains ESP8266 Wi-Fi chip on it. It is programmed
    using Lua scripting language. LUA scripting language is a programming language
    used to program various ESP boards.


    # 18.5.2 BOSTER MODULE


    The booster module is a DC-DC connection that boosts the voltage from its input
    to its output shown in Figure 18.3. In our device, the booster module will enhance
    the battery voltage from 3.3V to 5V.


    # 18.5.3 CHARGING MODULE


    This module as shown in Figure 18.4 is mainly useful in charging rechargeable
    batteries using the constant charging method. The battery’s energy is used to
    power the device that it is connected to, and it will gradually decrease over
    time. When the battery’s charge is depleted, it needs to be recharged in order
    to continue providing power. A charging module, on the other hand, is a device
    that is used to charge the battery. It takes an external power source, such as
    a wall outlet or a USB port and converts it into the proper voltage and current
    to charge the battery.'
