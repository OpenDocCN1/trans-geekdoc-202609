    e. **Elevated altitude and prolonged endurance UAV:** UAV with boundless endurance.

    f. **Superspeed UAV:** UAV capable of covering distances exceeding 200 km.


    # 15.2.3 **CONNECTIONS in IoT-Based UAV NETWORKS***


    UAVs possess the capability to establish communication through data exchange amongst
    each independently, without relying on any existing infrastructure. Additionally,
    they can be seamlessly coordinated through a base station. There exist four categories
    of linkage, encompassing the subsequent [8]:


    +   a. **Air-2-Air communication (A2A):** Within A2A communication, single UAV
    has the capacity to share data with another UAV and assume the role of a relay
    node, thereby extending the range of connectivity.

    b. **Air-2-Ground communication (A2G):** In this connection, a drone possesses
    the capacity to transmit crucial data to the base station. Subsequently, the base
    station holds the capacity to issue specific task-related control commands to
    the UAVs.'
