  md: '# #15 Secure Communication and Authentication in IoT-Based UAV Networks


    Jatin Sharma, Pawan Singh Mehra, Diksha Chawla, Deeppakshi Dabas, and Aatif Jamshed


    # ##15.1 INTRODUCTION


    Unmanned Aerial Vehicles (UAVs) are aircraft that can fly autonomously and with
    self-guidance under remote control. These dynamic and fast-moving flying machines
    need consistent communication dependability, which may be attained by utilising
    the Mavlink protocol, which bridges the communication gap between UAVs and the
    Ground Control Station (GCS). The concept of the Internet of Things (IoT) describes
    a network of interconnected entities outfitted or acquired with flight controllers,
    detectors, and software, facilitating the exchange of information from drones
    via wireless communication. Consequently, drone swarms share similarities with
    the IoT framework. These networks comprise a collection of interlinked drones
    empowered by Internet connectivity while being gathered with integrated detectors
    and flight controllers. A total of 86,728 drones are enrolled in the US per FAA
    (Federal Aviation Administration) [1]. The drone market is projected to witness
    an annual growth of around 6.5%, potentially doubling by the year 2025. It has
    garnered significant attention across domains such as rescue operations, payload
    delivery logistics, photography, and others that are challenging for a single
    UAV to accomplish. Consequently, coordination among UAVs necessitates the exchange
    of commands to fulfil these multifaceted objectives. These networks of UAVs establish
    substantial volumes of data encompassing visual, telemetry, and detector measurements.
    Prevailing studies on secure UAV design predominantly center on computationally
    intensive methods. A primary shortcoming of prior research lies in the absence
    of an in-depth exploration into the entire cycle of attack and security concerns
    concerning UAV communication. To address these limitations, it is crucial to examine
    existing countermeasures and propose innovative approaches thoroughly. This chapter
    delves into both physical and logical attacks, presenting authentication strategies
    that offer insights into future directions.


    DOI: 10.1201/9781003045535-20'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# 15.1.1 MOTIVATION


    In spite of the evident benefits offered by UAV networks, their implementation
    is hampered by security considerations. The issue of UAV security was brought
    to the forefront in 2011 when the RQ-170 drone was gathered by Iran force [2].
    The potential for adversaries to launch network-based assaults whenever UAVs are
    engaged in tasks tasks such as combat communication and reconnaissance in perilous
    situations. An illustrative case emerged during the Russia-Ukraine conflict of
    2022 [3]; Ukrainian military units formed compact squads with the objective of
    directly engaging Russian UAVs by laser-based weaponry. An expert [4] elucidates
    how attackers can exploit vulnerabilities by interfering with the connections
    linking UAVs and base stations. UAVs containing confidential data related to military
    operations are susceptible to compromise. Particularly in security-sensitive contexts,
    encompassing surveillance, recovery, and heightened security measures is imperative.
    Existing studies often present only concise evaluations or surveys, focusing on
    a limited area of security threats or countermeasures. The absence of a comprehensive
    exploration in the drone network domain has prompted the need for this contemporary
    study. The work endeavours to bridge the discrepancies and address the security
    requirements. Therefore, there is a necessity for a preliminary investigation
    into authentication mechanisms.


    # 15.1.2 CONTRIBUTION


    +   * Presents a survey on secure communication and authentication in IoT-based
    UAV networks.

    * Provides a summary of related work.

    * This work compares with an existing survey using security parameters like mutual
    authentication, un-traceability, in a tabular layout.

    * This work discusses the state-of-art authentication techniques.


    # 15.1.3 OUTLINE OF THE CHAPTER


    The arrangement of the segments is structured as follows: Section 15.2 provides
    an over-view of UAVs. Section 15.3 delves into the pertinent work. Security requirements
    for secure communication and authentication in IoT-based UAV networks is discussed
    in Section 15.4. Section 15.6 describes the secure communication and authentication
    mechanisms. Lastly, Section 15.5 encapsulates the concluding remarks and future
    directions.


