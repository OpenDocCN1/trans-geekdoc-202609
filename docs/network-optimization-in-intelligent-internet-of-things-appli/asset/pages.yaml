- pgno: 251
  md: '# Empirical Study of the Concept Drift Driven Machine Learning


    ![](img/e0b54a8aa3102369506fc5feb80a6fde_251_0.png)


    FIGURE 13.1 Drift Detection and Anomaly Detection Framework.


    with its core function being “Drift_Adapt”. Within this function, “Drift_Adapt”,
    the primary focus is detecting concept drift in the streaming data. It employs
    input hyperparameter constants to update the ML model with new concept samples
    for drift adaptation.


    The OSAW model employs two distinct types of windows: sliding window (SW) utilized
    for concept detection and an Adaptive Window (AW) employed for storing fresh samples.
    The maximum size of the AW is represented as, the size of the SW is denoted as
    $p$. Additionally, for concept detection, a pair of threshold values (thv), $i$
    and $j$, is employed to signify the warning and drift levels, respectively.


    The core sequence of OSAW consists the subsequent key stages. As each fresh data
    instance, denoted as $k$ arrives in the new data stream, its associated SW, $SW_k$,
    incorporates samples ranging from $(k-p)_i$ to $k_i$. The accuracy metrics for
    both the ongoing and previous complete windows are indicated as $SW_k$, respectively,
    are computed and juxtaposed. Should there be a decrease in accuracy by $i$ cent
    from time of $k-p$ to $k$, the warning level is activated? Subsequently, the AW
    initiates the collection of incoming data instances as fresh samples (6–12). Furthermore,
    if the accuracy of the SW continues to diminish by $j$ per cent and reaches the
    drift level, the existing learner undergoes an update. This involves retraining
    the model using the newly accumulated concept samples from the AW (13–18).


    Additionally, the AW will persist in accumulating fresh data until one of the
    subsequent criteria is met, thereby ensuring the creation of a dependable and
    consistent learner: (1) If, in comparison to the point where the drift initially
    emerged, the accuracy of the new concept descends towards the threshold $i$, indicating
    the current learner'' incapacity to comprehend the new concept, necessitating
    an update. (2) The AW expands until it reaches the maximum size of $p_{max}$,
    a measure taken to'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 236 Network Optimization in Intelligent IoT Applications


    satisfy both memory and real-time requirements. This triggers an additional learner,
    updating the samples present in the AW to enhance the learner''s reliability further.
    After this potential drift detection and learner update, the system transitions
    back to its normal state, for any forthcoming drift detections (lines 26–35).


    Conversely, if the accuracy of the SW stabilizes or even increases to the regular
    level during the warning phase, it will be treated as a false alarm. Subsequently,
    the AW will be reset, and the system will revert to its normal state, to monitor
    any possible subsequent drift occurrences (lines 19–24).


    # Algorithm 13.1: Optimal Sliding and Adaptive Windowing (OSA)


