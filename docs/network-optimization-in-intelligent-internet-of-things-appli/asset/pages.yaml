    # 11.6.2 LIGHTWEIGHT HASH FUNCTION


    These cryptographic hash functions generate the fixed representation of the message.
    These hash functions are based on one-way hash function and collision resistance.
    The one-way hash function is defined as, H (m) is known by the adversary. It should
    be impossible to extract the message ''m''. The collision resistance ensures H
    (m) != H (m''). The secure messages digest and secure hash functions are used
    in a variety of applications as message authentication, intruder detection, and
    digital signature. SHA3 has fixed-length hash algorithms SHA3-224, SHA3-256, SHA3-384,
    and SHA3-512 [30]. NIST has recommended SPONGENT, PHOTON, QUARK, and Lesamnta-LW
    hash schemes. These hash functions are popular due to their capability to produce
    much smaller memory footprints.


    # 11.6.3 LIGHTWEIGHT INTEGRITY SCHEMES


