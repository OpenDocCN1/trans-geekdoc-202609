    (VTOL) craft are encompassed within this group.


    # 15.2.2.3 Wings-based [7]


    +   a. **Fixed-wing UAV:** This refers to a compact pilotless aircraft with stationary
    wings, requiring a runway for takeoff and landing. These aircraft exhibit substantial
    range and resilience.

    bb. **Rotary-wing UAV:** The rotary-wing vehicle may exist in singular or multirotor
    configurations, including VTOL UAVs. This wing design offers exceptional maneuvering
