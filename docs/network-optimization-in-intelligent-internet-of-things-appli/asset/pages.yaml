- pgno: 331
  md: 'Wi-Jammer, a Threat to IoT Networks


    # 18.3.1 TYPES OF ATTACKS


    Attacks mounted through Wi-Fi jammers come under Denial-of-Service (DoS) attacks.
    Under these attacks, malicious nodes interfere with legitimate network communication
    [6–8].


    # 18.3.1.1 Deauthentication Attack (Deauth)


    Denial-of-service attacks, such as a deauth attack, target user-to-wireless access
    point communication. In this attack, the attacker forces devices to lose access
    and reconnect to a network controlled by [9, 10].


    In other words, it is a type of DoS attack interfering with communication between
    routers and devices. One of the main purposes of deauthentication is to force
    the user already connected to the router or wireless access point to connect to
    an evil twin access point which can then be used for capturing network packets
    transferred between the user and the router.


    # 18.3.1.2 Clone Beacon


    A clone beacon attack is a spoofing cyberattack that tricks the user to connect
    to a fake Wi-Fi access point that appears be part of a legitimate network [11].
    The user gets access to information from network traffic, including login credentials.
    A clone beacon attack is a kind of wireless attack in which an attacker creates
    a replica or clone of a legitimate connection to devices into a fake access point.
    Once connected, the attacker can eavesdrop on the traffic passing between the
    victim''s device and the Internet, or launch further attacks against the victim,
    such as a man-in-the-middle attack or a phishing attack [12].


    # 18.3.1.3 Beacon


    The purpose of this attack is to confuse wireless clients by sending several fake
    beacon frames. This makes things difficult to find a genuine network, and prevents
    the wireless clients from connecting to their preferred networks [11]. A beacon
    is a signal periodically transmitted by wireless access points to announce the
    availability of a network. In a beacon attack, the attacker creates a fake beacon
    with the same network name (SSID) and other network parameters as the legitimate
    access point [12]. The fake beacon is transmitted on the same frequency and with
    the same power as the legitimate beacon, so devices within range may be deceived
    into connecting to the fake access point instead of the legitimate one.


    # 18.3.2 MOUNTING AN ATTACK


    This subsection presents the working of Wi-Fi jammer in a step-wise fashion:


    +   Step 1: Initially, a user and the router will maintain a connection between
    them. The user will first send the request for authentication and association.

    Step 2: Successful authentication refers to successfully completing the authentication
    process between a user and a Wi-Fi access point, which is router here.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'When a device wants to connect to a Wi-Fi network, it must go through an authentication
    and encryption process to establish a secure connection. The authentication process
    typically involves exchanging handshake messages between the client and the access
    point to verify their identities and establish a secure connection.


    Step 3: A successful association involves establishing a connection between a
    user and a Wi-Fi access point by sending an association request containing the
    client''s information.


    When a Wi-Fi client device wants to join a Wi-Fi network, it needs to perform
    an association process. During this process, depending on the client''s capabilities
    and supported encryption methods. The access point responds with an association
    response, indicating whether the association was successful or not.


    Step 4: A disassociation notification or deauthentication notification refers
    to a message sent by the access point to a connected client device, instructing
    it to disconnect from the Wi-Fi network.


    Deauthentication is a legitimate mechanism in Wi-Fi networks and is used by access
    points to terminate the connection of a client device. It can be initiated for
    various reasons, including security purposes, network management, or to enforce
    access control policies. The objective is to disrupt or block the wireless communication
    between the client and the access point, preventing successful authentication.


    ![](img/e0b54a8aa3102369506fc5feb80a6fde_332_0.png)


    FIGURE 18.1 Flow chart of mounting an attack.'
  merge: -1
  img_proc: true
