    He et al. [12] put forth an ECC-driven blind signature system for drone networks.
    This proxy signature, based on identification, intentionally omits any details
    about the drone''s identity acting as a delegated signer to preserve anonymity.
    However this particular approach doesn''t align with our authentication objectives
    and may expose vulnerabilities to harmful drone incursions. Furthermore, an effective
    proxy signature mechanism should possess comparable information about the proxy
    signer as it is the original signer.


    Tian et al. [13] introduced an authentication framework to establish secure communication
    among drones. This system incorporates an online/offline signature method and
    leverages mobile computing technology. In addition to ensuring robust authentication,
    the suggested strategy takes into account the imperative of safeguarding the privacy
    of drones'' identities and whereabouts. The authors fail to describe security
    features such as man-in-the-middle, mutual authentication, and.


    Huang and Savikin [14] proposed a novel technique for establishing charging stations
    for drones. This method employed a triangular-oriented strategy. Furthermore,
    charging stations that experienced lower foothold or remained unoccupied were
    systematically eliminated through recursive processes. It''s important to note
    that this research does not primarily address the aspects of communication and
    storage expenses.


    Gope et al. [15] put forth a proposal at guaranteeing the tangible safety of drones.
    This scheme relies on the deployment of physically unclonable functions and hash
    operations. While the scheme effectively safeguards the physical integrity of
    drones, it falls short in terms of preserving the privacy of their location.


    Zhang et al. [16] unleashed an efficient authentication and key agreement (AKA)
    blueprint, hinting entirely on a unidirectional secure hash function. Through
    this strategy, drones and users engage in reciprocal authentication. Despite its
    robustness against diverse security menaces, this strategy neglects the inclusion
    of measures for concealing location privacy or fortifying against physical vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '264 Network Optimization in Intelligent IoT Applications


    Alladi et al. [17] presented a novel authentication protocol reliant on Physical
    Unclonable Functions (PUFs) for 5G networks with drone assistance. This protocol
    enables a reciprocal authentication process between a drone and a base station,
    leading to the establishment of a confidential key. Nevertheless, their approach
    employs PUFs solely on the drone''s end, which falls short of constituting a fully
    authentication mechanism. The drone''s challenge-response pairs (CRPs) are retained
    open in the base station''s database, devoid of encryption. This presents a potential
    risk, such as the exposure of CRPs, giving the possibility of the base station
    being compromised or exploited by an unscrupulous insider.


    Rajasekaran et al. [18] presented an effective mutual authentication scheme with
    anonymity, aiming to mitigate privacy and security concerns while enhancing communication
    efficiency between the UAV and the user. The study introduces various strategies,
    including anonymous batch authentication within FANET, which streamlines the authentication
    process for a substantial cluster of drones concurrently, thereby minimizing computational
    burdens.


    Salam et al. [19] introduced the SELTHA (Secure, Efficient, and Lightweight TOTP-based
    Authentication) methodology with the aim of enhancing the security of drone communication,
    encompassing interactions with both ground control server and drone-to-drone connections.
    The methodology carries a trio of phases, forming a comprehensive procedure. The
    significance of ensuring communication security is paramount and carries critical
    importance, primarily due to the wireless nature the drone network inherent to
    the architecture of IoD. This wireless nature renders the drone network a highly
    appealing target for cybercriminals seeking to exploit vulnerabilities, particularly
    when security protocols are absent or weak protocols are in play.


    # 15.4 SECURITY REQUIREMENTS FOR SECURE COMMUNICATION AND AUTHENTICATION


    This section covers the security properties that are required for authentication
    in IoT-based UAV networks.


    # 15.4.1 MUTUAL AUTHENTICATION


    In the context of UAV and GCS, mutual authentication denotes a security procedure
    where both the UAV and GCS validate each other''s identities prior to initiating
    communication or sharing information. This mechanism guarantees the legitimacy
    and authorisation of both entities, thereby thwarting any unauthorised access
    and potential security vulnerabilities [19].


    # 15.4.2 MAN-IN-THE-MIDDLE ATTACK


    In the scenario of a man-in-the-middle attack targeting a UAV and a GCS, a malicious
    third party intervenes in and manipulates the communication link connecting the'
