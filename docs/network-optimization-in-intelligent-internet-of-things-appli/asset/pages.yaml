    # ## 14.4 BLOCKCHAIN


    # ### 14.4.1 OVERVIEW


    Blockchain technology (BCT) was first proposed by Satoshi Nakamoto [4]. In recent
    years, blockchain technology has gained momentum as a rising innovation in academic
    and industrial spheres. Blockchain provides common distributed immutable ledger
    technology [12]. Blockchain technology, without the involvement of the central
    trusted party, can record and verify transactions between participants. To overcome
    the disadvantage of centralized databases, decentralized architectures are used
    for peer-to-peer (P2P) communications among the nodes. Within blockchain technology,
    a ledger utilizes public cryptography to uphold an expanding series of information
    blocks. Every individual block within a blockchain is composed of a sequence of
    blocks, each holding a timestamp, random number, and certain transactions from
    the preceding block. The block is appended to the blockchain by the mining process.
    The miners performing the mining process add the new block to the blockchain.
    To create a block, designated nodes may engage in solving a computationally intensive
    cryptographic challenge called proof of work (PoW). The miner that successfully
    solves this challenge is responsible for adding the new block to the blockchain.


    The new block is added by securing SHA 256 [12]. Based on the data from its parent
    block, the hash of the parent block is connected and retained within the child
    block. The hash value is generated according to the content of the block; any
    changes in the block will change its hash value. In blockchain, private key security
    is provided for each node through digital signatures. As shown in the architecture
    of'
