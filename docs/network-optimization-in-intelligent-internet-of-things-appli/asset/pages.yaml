  md: '# 16 A Comprehensive IoT Security Framework Using Edge Computing Approaches
    and Challenges


    Chintan Singh, Himanshu Khajuria, and Biswa Prakash Nayak


    # 16.1 INTRODUCTION


    Over time, Internet Protocol mainly network and core of it have become increasingly
    interconnected; they have progressively become the destination of storage, processing,
    and network key functions. The bulk of information collected from Internet of
    Things (IoT) nodes are increasingly exponential, making careful processing of
    the data imperative to speed up response time and effectively distribute network
    congestion. The restrictions of the cloud''s big-data processing have recently
    come to light. By 2020, it is expected that 50 billion devices are be interconnected
    to the internal [1]. By enabling the ability to monitor, interpret, control, and
    optimize physical systems, IoT applications offer unprecedented levels of convenience
    to our users. Unfortunately, this opens up a new realm of cyber threats that can
    put our systems at risk [2].


    The lines between the physical and digital realms are blurring more and every
    day. With advances in sensing, communication, and microcontroller tech, we can
    now seamlessly blend the two together. This integration allows us to access, control,
    and monitor physical objects and environments around our surroundings. By combining
    the physical and the digital, we can develop more efficient and cost-effective
    solutions to our everyday problems [3]. IoT has beenizing technology, making it
    faster and more powerful. A robust and resilient architecture must be implemented
    to take advantage of these innovations. Fog/edge computing (FEGC) is a good fit
    for the problem, as it promises to deliver real-time control and analytics with
    millisecond response time. FEGC is ideal for developing and configuring a scalable
    and adaptable IoT system capable of providing reliable sensing, actuation, and
    analysis. Additionally, FEC can manage many geographically distributed “things”
    and schemes with self-motivated agility. In other words, FEGC ensures an efficient
    and reliable IoT system [4].'
