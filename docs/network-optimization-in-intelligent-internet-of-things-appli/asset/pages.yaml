    version is required of this algorithm. Another work on security challenges and
    lightweight cryptography was discussed by Thakor et al. [28]. The authors discussed
    that while collecting data from the physical environment, they become an attractive
    target for many authors. They emphasize that conventional cryptography is not
    acceptable for resource-constrained devices. Therefore, the authors discussed
    lightweight cryptography algorithms based on block cipher as (a) substitution-permutation
    network work, (b) Generalized Feistel Network (GFN), (c) nonlinear feedback feedback
    shift register (NLFSR), and (d) hybrid cipher. Reddy et al. [29] proposed a lightweight
    cryptographic scheme. Their protocol provides resistance against replay attacks,
