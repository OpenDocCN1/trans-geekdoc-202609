  md: '# 16.1.3 CYBER-PHYSICAL SYSTEM (CPhS/CPS)


    CPhS emerges for upcoming up-era engineering structure. The term "cyber-physical
    system" was attributed by Helen Gill in bout 2006 [16]. Although having no relation
    to physical processes, the terms "cyber-physical system" and "cyber security"
    are commonly used interchangeably. CPhS is the term used to describe the intimate
    integration of computations, algorithms, and physical devices. Embedded computers
    and network controls help to evaluate physical processes, typically using feedback
    loops, where the physical processes influence computations and administrators
    vice versa. The CPhS cyber-space focuses on computation and administrators. The
    CPhS upholds the traits listed below [6]:


    +   1. Adaptivity: The system can adapt to changing conditions or environments
    in order to achieve its goals or objectives.

    2. Integration: The physical components, sensors, actuators, and embedded processors
    are all integrated into a single and unified system that performs a specific task
    or tasks.

    3. Robustness: The system can operate reliably even in the presence of faults
    or noise.

    4. Real-time Response: The system is able to respond to time series data and provide
    accurate information that rely upon analysed datas.

    5. Scalability: The system can scale up or down when more or fewer components
    are needed.

    6. Security: The system is designed to protect data and is resistant to malicious
    cyber-attacks.


    Physical systems are connected to cyber systems through unifaces. Such unifaces
    are made of elements such as communication networks, transducers, effectors, digitizers,
    and synthesizers. Figure 16.2 demonstrates architecture based on the IoT devices
