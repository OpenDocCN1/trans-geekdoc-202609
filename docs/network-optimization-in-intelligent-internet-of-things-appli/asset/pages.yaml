    # 3.1 INTRODUCTION


    Tolls, which serve as a method of generating revenue for the nation''s transport
    network, are from becoming exceedingly common. To avoid stopping or slowing down
    and paying a toll, motorists and state transportation officials would prefer that
    vehicles not have to either of those toll [1]. In the last 15 years, numerous
    technologies, commonly called electronic toll collection (ETC), have allowed cars
    to enter and depart toll systems without interruption. Open Road Tolling (ORT)
    with e-tolling the favored approach now because it is more efficient, environmentally
    friendly, and secure than conventional toll collection [2]. In the past 10 years,
    growing urbanization and the prevalence of Internet-of-Vehicles (IoV) have led
    to the development of what are known as Intelligent Toll Gates (ITGs), which provide
    a reactive and computerized method for making toll payments at ITGs [3]. Toll
    collections can be made significantly more accessible with the more accessible
    ETC technology, which enables electronic transactions via device monitoring nodes.
    The sensing device statistics about smart vehicles (SVs), toll consumption, and
    high-occupancy vehicle (HOV) lane availability are provided by radio responder
    components [1]. They interact with one another using low-powered wireless connections
    recorded when a CSV is determined to have passed a toll unit. They are linked
    to the automotive identification number and the lanes'' utilization, enabling
    an intelligent and seamless money transfer between the vehicle owners (VO) and
    government authorities (GA) via 3rd access points [4]. Even legitimate toll accumulation
    through ETC makes it possible to have low latency, high quality of user experience,
    and lesser queue builds up at intermediate toll booths, it still challenges regarding
    security, privacy, and location-based attacks on VO-sensitive statistics in ecosystems
    that are based on IoV. A DDoS attacker has the potential to initiate device threats
    such as jamming, Sybil, and document erroneous notifications at ITGs. This leads
    to monetary failures for the VO and the GA [5–7]. Cybersecurity forecasts that
    the expenditures of cybersecurity threats will be multiplied by 2021, reaching
    $6 million worldwide. In 2015, these expenses were estimated to be $3 trillion
    [2].


