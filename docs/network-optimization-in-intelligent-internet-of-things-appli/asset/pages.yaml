    Wi-Fi networks. They operate by emitting radio frequency signals in the same frequency
    band as the Wi-Fi signal, causing interference and preventing devices within range
    from connecting to the network. In this section, Table 18.1 discusses the key
    findings of work done in the literature and its limitations.


