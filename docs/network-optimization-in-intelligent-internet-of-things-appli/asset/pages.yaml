  md: '# Network Optimization in Intelligent IoT Applications


    The peculiarities and hardware limits of networks linked with IoT devices provide
    several issues, particularly for routing protocols [8]. “The Routing over Low-power
    and Lossy Networks (ROLL) group created the RPL (IPv6 Routing Protocol for Low-Power
    and Lossy Networks) routing protocol in March 2012” [5]. RPL is a distance-based
    routing protocol presented in RFC6550 [9]. RPL is a proactive protocol that creates
    a destination-oriented Acyclic Graph (DAG) that connects nodes and the node border
    router) with low energy consumption mechanism and provides self-organizing and
    self-healing functionality to handle node failures. A route is constructed by
    sending information from node to node until the target destination is reached.
    Malicious nodes carry out their activities during route discovery or forwarding
    so that information routing might be vulnerable to various attacks [10]. RPL is
    vulnerable to various threats or attacks, and to provide seamless connectivity
    in IoT, it is required that communication should not be disruptive.


    This chapter presents a survey on attacks that can happen on RPL. This chapter
    focuses on the available solutions to handle the attacks using machine learning
    methods. This chapter will help readers to know about the various attacks and
    solutions available in the literature. The remaining chapter is arranged as follows:
    Section 10.2 presents an outline of the RPL protocol. Section 10.4 presents various
    security solutions based on an Intrusion Detection System (IDS). In Section 10.5,
    performance metrics are discussed. Section 10.6 discusses limitations with IDS
    based on machine learning (ML) and Deep Learning (DL) models. In Section 10.7,
    the conclusion is presented.


    # 10.2 Outline of RPL PROTOCOL


    Implementing a routing protocol for 6LoWPAN is challenging with respect to resource-constraint
    environment of nodes and low-power IoT devices. RPL facilitates data routing of
    nodes in a restricted resource environment efficiently and successfully [11].
    RPL protocol is a network layer protocol.


    RPL generates the network topology using a DAG (Destination-Oriented Graph), consisting
    of one or more DODAG. The DODAG is oriented towards the root node, the LBR (LLN
    border router), or the sink node. The objective function (OF) builds the DODAG
    in RPL and selects the preferred parent among the neighbours nodes. There are
    two main types of OF: (1) OF zero and (2) minimum rank OF, which considers the
    routing metrics such as ETX (Expected Transmission Count), and hop count to select
    the optimum path between child nodes and the root node of DODAG. The route selection
    depends on parameters such as available node power, throughput, DODAG link, latency,
    or reliability. DODAG in a Directed Acyclic Graph (DAG) is differentiated by the
    main factors: DODAG ID version, RPL Instance ID, and Rank. Furthermore, the sink
    nodes of every DODAG in a DAG are linked with each other. Every node selects the
    best suitable parent from the parent list and sets the node to maintain. Rank
    helps detect loops, differentiate parent nodes from sibling and child nodes, and
    build parent-child relationships. To avoid the formation of loops, RPL uses rule.
    RPL uses control messages to form'
