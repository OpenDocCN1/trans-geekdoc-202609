    # 18.3 JAMMING TECHNIQUES


    When a transmitter detects a faulty or busy signal at a receiver, a Wi-Fi jammer
    uses radio frequencies to make the communication medium busy by interfering with
    wireless communications [4]. Attacks on the physical layer are the ones that typically
    targeted by jamming; however, cross-layer attacks can also occur. In this section,
    we have elaborated on various types of jammers and the placement of jammers to
    maximize the jammed area.'
