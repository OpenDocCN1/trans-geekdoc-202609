    # 11. 5 RECENT LIGHTWEIGHT CRYPTOGRAPHY FOR IOT SECURITY


    # 11.5.1 ASYMMETRIC ENCRYPTION


    Public key (asymmetric) encryption is used to secure IoT communication by sharing
    secret keys with the legitimate user. The encryption is based on the mathematical
    framework, where public and private keys are generated randomly. Anyone with access
    to public keys can encrypt data, Recently, [19] analyzed that to the complexity
    of integer factorization, the popularity of public key encryption techniques as
    RSA is increasing continuously. The researchers [20] also focus on elliptic curve
    cryptography (ECC) due to its advantages in lightweight cryptography. In IoT,
    alternative approaches such as hyper-elliptic curve cryptography [21], NTRU [22],
    and Blue Ray [23] were proposed, which are based on the shorter key size.


    # 11.5.2 SYMMETRIC CRYPTOGRAPHY


    The single key is used at both ends to send and receive messages. The major challenge
    is to share secret keys with legitimate users. It is difficult to eavesdroppers
    in the communication channel; therefore, ensuring that keys are shared with only
    legitimate users is a difficult task. The symmetric key cryptography algorithm,
    such as advanced encryption standard (AES), is popular for encrypting data without
    sacrificing keys [3].


    # 11.5.3 HASHING


    Hash-based authentication is widely used for ensuring integrity, verification,
    and secure digital signature and hash-based biometric authentication. The efficiently
    implemented hashes are believed to be resistant to quantum adversaries. Hafizul
    and Prosanta [24] security issues in IoT communication have been prevalent for
    many years as IoT devices with the heterogeneous type of data sharing and generation.
    Therefore, the authors [25] work on securing multimedia communication. Their protocol
    use authentication to secure user credentials based on the two-step process. Therefore,
    it allows only authenticated users to access the communication channel.


    # 11.6 LIGHTWEIGHT SCHEMES FOR IOT


