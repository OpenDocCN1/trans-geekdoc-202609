    +   1. **Permissionless**: Individuals possessing computational capacity engage
    in open, public blockchain networks to connect transactions and contribute to
    the mining nodes and consensus mechanism, facilitating the incorporation of new
    transactions into the chain.

    2. **Permissioned**: Participation in the scheme is limited to authorized users
    who are eligible based on specific business requirements. Approved entries are
    expected to possess connections to pre-existing applications.

    3. **Public**: The permissionless proof-based security system of the public access
    chain ensures network dependability for all users, irrespective of their initial
    entry-level.

    4. **Private**: In a private blockchain network, there is enhanced flexibility
    through increased control over transaction rules, which can be altered through
    consensus agreement.


    # 14.5 REQUIREMENT of blockchain technology into the IoT realm emerges from crucial
    needs that aim to tackle the constraints and difficulties presented by conventional
    centralized systems. Below are fundamental rationales elucidating the necessity
    of blockchain within the IoT context.


    # 14.5.1 DECENTRALIZATION


    Conventional IoT frameworks frequently depend on central entities for validation
    and verification, a situation that can result in vulnerabilities and susceptibility
    to failures due to centralization. The distributed consensus mechanisms inherent
    in blockchain eradicate the necessity for intermediaries, nurturing trust and
    dependability among peers within a decentralized network.


    # 14.5.2 SMART CONTRACTS


    The smart contract feature of blockchain allows for automated and self-triggered
    agreements founded on predetermined conditions. This proves especially advantageous
    in IoT contexts, where devices can independently initiate actions in response
    to real-time data inputs, obviating the requirement for intermediaries.'
