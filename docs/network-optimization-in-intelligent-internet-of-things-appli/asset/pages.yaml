    # ## 11.1 INTRODUCTION


    The Internet of Things (IoT) is going to be an integral part of our lives in the
    next few years. The IoT includes heterogeneous devices that gather all the data
    using sensors, actuators, and gateways. IoT is envisioned to provide uninterrupted
    and accurate functioning of smart applications. The smart applications include
    automated vehicles, smart agriculture, healthcare, and surveillance systems. With
    the development and innovation of IoT communication, E-healthcare, automated cars,
    virtual reality, and Unmanned Aerial Vehicle (UAVs), security and surveillance
    cases become possible. IoT applications are beneficial. However, these applications
    are vulnerable to attacks, as an attacker can take control of automated vehicle
    by blocking traffic lights. Sending fraudulent messages. The open internet connectivity
    and physical systems increase the exposure to attacks such as data breaches, side-channel
    attacks, irregular/no updates of malware and ransomware, Man-in-the-Middle (MIMA),
    and impersonation attacks. These heterogeneous IoT applications generate, process,
    store, and transfer huge amounts of critical data. The deployment of large-scale
    IoT applications is possible only when we can utilize these applications to make
    critical decisions. The challenging task is to ensure the confidentiality, data
    security, and user authenticity.


    The aforementioned issues motivated our discussions to analyze security concerns,
    requirements, solutions, and challenges for the IoT communication framework. The
    classical security mechanisms which are PC-based face many challenges due to the'
