  md: '# Empirical Study of the Concept Drift Driven Machine Learning


    One of the main issues with ML algorithms for detecting anomalies is that the
    classifier learns to new/current traffic/data for predictions on recently trained
    data and that the classes become unbalanced as traffic changes over, decreasing
    the accuracy of the classifier predictions. This issue was addressed by [16] and
    [17]. As the classifier''s output suffers from concept drift, misclassification
    will rise. In order to achieve effective results, it is crucial to identify concept
    drifts. Concept drift techniques in artificial intelligence and data science generally,
    specifically in pattern detection and data stream mining, have significantly improved
    traditional ML. In the research, comprehensive concept drift surveys [18-21] have
    offered helpful information on how to deal with concept drift; however, particular
    study emphasis is solely on learning data stream, rather than examining concept
    drift adapting techniques.


    To improve the efficiency of classifiers in a real-world application, [22] proposed
    some strategies to deal with concept drift. [23] provided a general structure
    that incorporates concept adaptability and active learning. [24] proposed the
    unsupervised veiled clustering technique OLINDDA(Online_Novelty and Drift_Detection)
    to identify abnormalities in the network. The analysis was carried out using the
    KDD99 dataset, and the outputs illustrate the technique''s ability to handle data
    stream. [25] proposed an ensemble learning technique to prevent concept drift
    when identifying network anomalies. [26] classified abnormal traffic using an
    ANN-based classification algorithm in the concept drift network environment. Recent
    research [27] introduced the ARF (Adaptive_Random_Forest) technique, which enhances
    the RF (random forest) method with the concept drift detection approach, ADWIN
    [28]. Similar research may be found in [29], which employs the Hoeffding bound
    for identifying drift.


    After reading these publications (which are described in Table 13.1), it became
    clear that while little research has been done on the drift in IoT datasets or
    has been limited to a specific portion of the outdated dataset (KDD''99). These
    investigations lacked comprehensive depth, and it has been necessary to conduct
    a full analysis using both publicly accessible datasets (NSL-KDD and CIDDS (2017))
    and to offer a concept drift detection-based model. The discussion of a concept
    drift-based detection model follows in the next section.


    # 13.3 METHODOLOGY


    The entire architecture of the suggested IoT anomaly detection system is shown
    in Figure 13.1. In the first stage, the IoT data streams are sampled using the
    k-means cluster sampling to create a highly representative subset. The ML model
    processes the data streams in the following stage. Suppose a concept drift is
    detected in the new data streams. In that case, the ML model will undergo retraining
    using the new concept data samples acquired through the recommended adaptive window
    mechanism (OSAW). This process aims to align the ML model with the updated concept
    inherent in the new IoT traffic data.'
