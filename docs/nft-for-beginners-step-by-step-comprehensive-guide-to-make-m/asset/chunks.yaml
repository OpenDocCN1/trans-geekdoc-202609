    # 如何创建你的 NFT？


    创建你的 NFT 如此简单，真是令人惊讶。铸造 NFT 最常用的市场平台是 `OpenSea` 和 `Rarible`。尽管 `Rarible` 在总销售额上更为成功，但
    `OpenSea` 提供了高级功能，例如可以使用 `OpenSea` 交易所来创建你的 NFT 网商店。参与者可以将他们的艺术品放在网商店中，并在平台上创建目录，而无需具备任何区块链网络的先验知识。尽管如此，你应该意识到这将产生某些初始成本。区块链网络（通常是
    `Ethereum`）管理着 NFT。因此，为了将你的艺术品或物品代币化，你需要支付一笔被称为 `gas fee` 的网络费用。`Rarible` 允许创意人员在创建过程中在区块链上铸造
    NFT（链上）。这通常会导致较低的价格。如果你打算从少数 NFT 中赚取巨额利润，`Rarible` 通常是正确的选择。尽管如此，你可以使用 `OpenSea`
    的 `Collection Manager` 创建许多且更便宜的 NFT。`OpenSea` 参与者只需支付一次费用即可铸造一套新的 NFT。从这样的集合中，`OpenSea`
    高度中心化的单元可以生成无限数量的 NFT，并在出售之前将其留在线下。我们将引导你完成在 `OpenSea` 平台创建 NFT 的过程。


    ## 第 1 ：设置 MetaMask


    为了铸造你的 NFT，你首先需要创建一个数字钱包。这是你存储 NFT 的地方。在将来，它将同样用于支付区块链网络交易的 `gas fees`。访问 `metamask.io`
    下载软件或添加 Chrome 扩展程序。建立 `MetaMask` 钱包既简单又免费。如果将来需要找回钱包，请妥善记录 `seed phrase`。钱包不用于存储加密货币或
    NFT。相反，它们用于存储你的 `private key`，这是授权区块链交易所必需的。区块链技术存储加密货币和 NFT，而需要 `wallet ID` 来确定它们的所有者。


    ## 第 2：：将你的艺术品代币化


    创建钱包后就可以铸造 NFT 了。在 `opensea.io` 上，从列表菜单中选择 `Create` 选项。你就可以将钱包连接到 `OpenSea` 并开始操作。在为你的
    NFT 系列标记后，选择 `Add New Item` 标签页。你现在可以上传想要代币化的文件，并使用功能和统计数据进行自定义，使其与收藏中的其他作品区分开来。决定每个项目需要多少份副本，然后设置零售价格。


    ## 第 3：在市场上列出


    在营销你的第一个 NFT 之前，你必须授予 `OpenSea` 从你的账户出售物品的权限。由于这是区块链技术交易，你必须支付交易 `gas fee`。一旦你将
    `Ethereum` 转移到你的 `MetaMask` 账户，就可以进行交易了。此费用仅在第一次铸造 NFT 集合时需要。如果你还没有 `Ether`，你可以在
    `Coinbase` 或 `Gemini` 上购买并将其转移到你的 `MetaMask` 账户。既然你已经授权 `OpenSea` 销售，任何人现在可以在
    `OpenSea` 市场上找到并购买你的 NFT。你已经完成了任务！


    # 制作数字艺术所需的软件


    你需要记住两点：你需要什么样的功能，以及你愿意为软件支付多少钱。某些数字艺术软件包含了你处理图像所需的全部功能，从绘画到复杂的图像编辑。相比之下，其他软件的功能范围较窄，因此你必须决定想要通用软件还是专业软件。我们的推荐中，有些完全免费，有些需要一次性付款，而有些则需要持续订阅。无论你使用
    `Mac`、`Windows`、`iPad` 还是 `Linux`，都能找到合适的数字艺术程序。


    ### Photoshop

    长期以来，`Photoshop` 一一直是数字艺术软件无可争议的领导，但竞争对手的服务正在挑战它的地位。另一方面，`Photoshop` 对于数字艺术家来说仍然是非常有效且高效的软件。


    ### Affinity Photo

    在功能方面，`Affinity Photo` 并不完全匹配 `Photoshop`，特别是在内容感知填充方面。然而，一旦你熟悉了它，你会发现它能够处理许多数字艺术项目。


    ### Corel Painter

    `Corel Painter` 的最新版本有一系列新功能和特性，特别是对于 `Apple` 用户。`Painter` 适用于摄影艺术、美术、漫画和概念艺术的各种风格和处理。它有超过
    900 种笔刷可供选择，还有许多自定义选项。


    ### Rebelle 4

    功能包括笔刷预设大幅增加到 170 多个。`Rebelle 4` 被描述为“独一无二”的绘画软件，可以模拟颜料在现实世界中的反应方式。在 `Rebelle
    4` 上，你喜爱的笔刷甚至可以共享和下载。


    ### Clip Studio Paint Pro

    `Clip Studio Paint` 逐渐成为创建漫画和漫画书的标准软件。如果你想在数字艺术和绘画软件中获得自然且经典的感觉，那么这款软件就适合你。为了获得平滑、真实的笔触，`Clip
    Studio Paint` 采用了卓越的笔压感技术。以下是你数字艺术作品可能也可以考虑的其他几款软件列表：


    * `Artweaver 7`

    * `ArtRage 6`

    * `Krita`

    * `TwistedBrush Pro Studio`

    * `MediBang Paint Pro`

    * `Black Ink`

    * `Paintstorm Studio`


