    # 如果你是创作者或艺术家，如何进行销售？


    有多种方式可以售出你的作品。最常见的是传统方式，即售卖你的实体产品或在合同上报价。人们会为你所提供的服务付费，作为回报，他们获得了你提供的服务。从某种意义上说，他们是在购买你的时间。


    ## 销售作品的策略


    如果你是一个创作者或艺术家，并且希望大量销售你的作品，我们该如何销售和营销它呢？我们是出售创作的每一件作品，还是将其包装成更具吸引力的价格点？如果将其包装成更具吸引力的价格点，那会是什么？人们为单件艺术品付多少钱？这里没有规定，完全取决于你作为艺术家或创作者的决定。


    如果你想通过艺术过上体面的生活，那么将其小批量包装并出售可能更好。如果你定期出售少量数量的作品，你就能以更高的价格售出。这将鼓励更多人购买你的作品，但每笔交易赚取的钱会较少。


    然而，如果你将你的作品组合成一个高质量的手工收藏，那么你就可以每件作品收取更高的费用。如果你将作品包装成专辑或书籍格式，人们会支付更高的价格，因为他们购买的件数更少了。他们买得越多，单价就越便宜。这是一个增加利润率的好方法，因为你可以为那些愿意为你的最终收藏付钱的人每件作品收取更多费用。


    如果你希望拥有大规模销售的选择，也许你应该以较低的价格出售单件作品。如果你将它们组合成专辑或书籍格式，人们会为更少数量的作品支付更多钱。然而，出售少量作品将迫使你创作更多的艺术品或产品，才能获得与别人卖出一件作品等等的收入。否则，你在创作一件艺术品上花费的时间和精力将远比那些大批量销售的人多得多。


    如果你决定以较小件的形式出售作品，你需要设定价格，以便能够赚到足够的钱维持生活。如果你的艺术品非常有价值，且人们愿意投入大量资金购买多件，那么只要他们愿意持续购买，你就不需要制作那么多艺术。然而，如果市场对你艺术的需求不足或它并不流行，也许你应该出售更廉价的艺术品。这意味着，如果你想通过出售多件低价物品来获得销售，那么每件物品的售价必须非常高。


    # 作为 NFT 收藏者，我们如何评估 NFT 的价值？


    我们可以创建一个对社区和收藏者都合理的定价结构。要做到这一点，我们需要问自己以下几个问题：


    *   什么是好的 NFT？

    *   什么是坏的 NFT？

    *   好的 NFT 和坏的 NFT 有什么区别？

    *   我们如何知道一个 NFT 是否有价值？


    如果一个 NFT 是毫无价值的，它就无法被评估。你评估 NFT 的唯一方法是它在社区内是否有价值。如果社区中的某人看重它，也许你也可以。然而，如果它被大范围社区认为是毫无价值的，那么没有人会认为它有用。


    NFT 可能出于各种原因变得一不值。可能是因为该项目在很一段时间内几乎或没有进展，也可能是某人从初就没有打算完成该项目。从本质上说，判断一个 NFT 是否值钱有多容易。如果它在社区中确实具有某种价值，你就能看到它并可能供自己使用。


    如果你正在通过你拥有的 NFT 销售作品，那么你必须为你的作品建立一套评分系统。你需要决定，如果同一物品以 NFT 而非传统货币出现，是否想要收取更多费用。如果是的话，人们需要多付多少钱？确定一个
    NFT 价值最简单的方法就是看其他人为它支付了多少。这意味着，如果人们愿意为每份支付更高的金额，你就可以收取更高的佣金。任何基于市场价值的货币也是如此，取决于其当时的市场价值。你还需要知道创作该物品投入了多少时间和精力，以便为你的作品收取一个合理的价格。这将确保你赚够足够的钱来支付账单，并负担制作另一个所需的材料。


    # 好的 NFT 和坏的 NFT 有什么区别？


    NFT 本身是强大的，因为可以在区块链上以多种方式使用。它可以代表货币、投票权、所有权和/或社区内的成员身份证明。如果你希望你的币获得成功，你需要决定它如何在社区内被使用以及它如何让他们受益。如果你希望你的币被社区认可，你就需要给他们一些回报，让他们选择你的币，而不是他们可能接触到的其他任何币。从本质上说，你需要给他们提供价值。


    做到这一点的唯一方法是使用 NFT 创建一种个人可以使用的独特成就感。如果你在出售如 `Bitcoin` 或 `Darkcoin` 这样的 NFT，你只需创建代币并将其放在一个物理盒子里，不解释它是什么或如何运作。这不会持续多久，而且可能根本不会被使用，因为人们对他们看得见摸得着的东西感兴趣，而不是数字代币。


    你也可以出售数字代币，但这样你就是在出售数字代币，所以例如，人们没有理由不买 NFT 而购买它。如果你想作为 NFT 创建数字代币，你需要给他们一个购买的理由。这可以表现为除了收藏外没有实际用途的东西，也可能是一种只能用其他数字货币（如
    `Bitcoin`）购买的代币。这被称为 `ERC20` 代币，被许多没有该领域经验的人广泛使用。它让个人能够利用 `Bitcoin` 的价值在区块链上轻松地买卖商品。如果你希望你的币具有价值，你需要给他们一个用其他
    NFT 或数字货币来购买的理由。


    # NFT 交易与交换


    流动性和交易是任何金融市场的重要组成。某些币的流动性比其他币高，这意味着你可以轻松用其他流动性更好的币购买它们。NFT 是可以交易的，但你必须确保它们有足够的流动性让人们感兴趣；否则它们可能完全不会波动。


    你还需要将 NFT 上架到多个交易所，如果它们最终在错误的交易所上市，可能会大幅稀释它们的价值。NFT 可能会失去价值的原因是，人们可以在社区内轻松将其交换成价值得多的东西，或者与
    NFT 用途完全不同的价值。目前，接受 NFT 的交易所非常少。这种情况在未来可能会发生变化，但目前只有少数交易所宣布他们将接受 NFT。这意味着你可能需要建立自己的交易所，以便让更流行的非同质化代币上架其中。


    上述某些信息目前尚未经证实，并可能会发生变化。不要对任何事情想所当然。在做出任何决定之前，请咨询专家或阅读官方文献。


    '
