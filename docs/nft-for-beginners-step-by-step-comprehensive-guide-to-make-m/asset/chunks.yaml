  trans: '


    # 为什么 NFT 如此昂贵？


    传统的数字资产已经存在多年，但多年来并没有发生太大变化。然而，随着 NFT 的出现，未来几年它们可能会发生巨大变化。它们可以通过变得更加安全、获得开发者和游戏玩家的广泛采用，以及获得交易所和其他组织的更广泛支持来发生改变。因此，NFT
    的价值可能远高于传统的数字资产。这是因为它们有潜力创建游戏内物品的真实所有权，甚至在未来可以创建土地，甚至是汽车或房屋等有形资产的所有权。


    NFT 特别之处的另一个原因是，它们对于任何想在自己的游戏或平台上使用它们的人来说都是真正的开源。正因如此，开发者可以创建独特的游戏和应用程序，而不必担心在将
    NFT 与区块链或智能合约等技术结合时可能出现的版权侵权或其他法律问题。这是因为一切都内置在 NFT 协议中，而且一切都是开源的。


    ##效用

    NFT 的效用价值取决于它的使用方式。游戏属性和门票是高效用价值两个两个类别。例如，一艘稀有且强大的 `Crypto Space Commander` 战舰在
    `2019` 年以 `$45,250` 售出。NFT 门票的价值等于活动票的成本。然而，实现互操作性是非常困难的。90% 的 NFT 游戏玩家一次只玩游戏。这是因为开发者必须首先建立一个具有吸引力用地的庞大游戏生态系统。`Dapper
    Labs` 和 `Engin` 都在这一方向努力。尽管还有许多未知因素且需要大量的时间和精力，但整个行业都感到兴奋。


    ## 所有权历史

    NFT 的价值由发行者和前任所有者的身份决定。著名的艺术家或拥有声誉的企业也会创建或发行具有高所有权背景价值的 NFT。增加你的资产价值有两种方法。


    第一种与具有强大实的公司或个人合作发行 NFT 代币。这会自动吸引用户和流量进入生态系统。例如，第一个获得批准的代表 F1 赛车的 NFT 以 `$113,124`
    的价格售出。第二种选择是转售著名人物曾拥有的 NFT。目前很难确定前任所有者是谁，尽管这些是很有用的链上数据信息。为了增加 NFT 的价值，市场平台和卖家应该拥有一个易于使用的监控界面。例如，`OpenSea`
    将突出显示卖出 NFT 最赚钱的投资者地址，并列出他们拥有的其他 NFT。


    ## 未来价值

    NFT 的潜在价值由估值变化和未来现金流共同决定。投机驱动估值，有时是市场升值的主要动力。例如，在 `2017 年 12 月`，`CryptoKitty #18`
    的价格在短短三天内从 `9ETH` 跳升到 `253ETH`。有人可能认为基于估值的市场波动对 NFT 是有害的。然而，投机是人类存在的自然部分，也是当前金融体系不可或缺的一部分。NFT
    原所有者获得的利息或股息被称为未来现金流。例如，`SuperRare` 每当其作品在二级市场出售时，都会向 NFT 品的作者支付 `3%` 的版税。未来公司将从
    `Defi` 发明中借鉴创意。NFT 是可以租赁和抵押以获得进一步现金流的资产。在游戏中，玩家可以请求特定的游戏资产一天以完成任务。


    ## 流动性溢价

    NFT 价值更高是因为它有很大的流动性。流动性溢价是链上资产估值应高于链外生成资产的主要原因。任何拥有 `ETH` 的人可以在二级市场上无缝交换 `ERC`
    标准的 NFT，从而增加了潜在买家的数量。由于流动性降低了拥有 NFT 的风险，投资者倾向于投资交易量大的 NFT 类别。即使 NFT 在相关平台关闭后失去了效用价值，只要人们还能买卖它，高流动性的
    NFT 就能保留其价值。另一方面，不基于 `Ethereum` 的 NFT 标准面临缺乏流动性的问题，这些平台上产生的 NFT 价值经常会被折扣。为了增加互动和
    NFT 流动性，公司必须创建允许用户交易的代币经济模型。例如，体育赛事可能会导致玩家交换资产以在游戏中保持竞争力，而 NFT 资产如果闲置太久就会贬值。


    # 第 5 章：如何确定 NFT 的价值？


    ## 收藏品与共识

    关于收藏最重要需要理解的一点是，它们没有客观的内在价值。每当你购买股票时，你都在购买公司未来现金流的一部分。因此，你可以通过估计未来现金流并将其折现到现值来计算内在价值。虽然并非所有交易者都这样做，今天今天只有少数人这么做，但内在价值是可以估算的。另一方面，收藏品没有未来现金流，仅依赖共识来决定其价值。价值和销售性取决于群体根据对收藏品的评估而产生的集体需求。除非某物是一个群体的一部分，否则它不是收藏品，也不值得收藏。个人可能因为
    `Basquiat` 作品带给他们的感受而崇拜它。尽管如此，社区对创作者天才的认可产生了对作品的需求，导致原作价值数百万美元，而不是在街角只值 `$20`。虽然收藏品在金钱方面没有内在价值，它在买家对资产的情感感受方面可能有内在价值，这就是为什么任何普通收藏者的第一条规则是购买你喜欢的物品。至少，即使物品被证明是没用的，你也能从中获得一些快乐。


    ## 要点

    非同质化代币不仅仅是收藏品；它们还有许多现实世界的用途。稀缺性、效实用实体是决定 NFT 内在价值时注意的三个重要方面。非同质化代币收藏者和交易者可以在 `Binance`（全球领先的艺术家
    NFT 市场）找到多样化的 NFT，以及来自全球领先品牌和创者的溢价和盲盒收藏。加密货币领域从未静止。然而，每隔几年，一种新型加密货币就会对市场产生重大影响，导致估值飙升和许多新应用程序的出现。作为数字与现实世界的纽带，NFT
    已经渗透到去中心化领域的几乎每一个领域。NFT 如其名，是独特的代币，赋予所有者对特定资产的不可更改的所有权。NFT 在加密货币市场上非常受追捧，作为一种可能与艺术品、鞋子或视频游戏收藏品相关的资产类别。


