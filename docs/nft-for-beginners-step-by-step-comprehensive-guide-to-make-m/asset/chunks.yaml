    # 第 10 章：如何创建和出售你的 NFT？


    我知道你对 NFT 是否值得会有疑问。请先考虑一下传统艺术的世界。你看到画廊，以及人们为艺术品支付数十万甚至数百万美元，然后现实却给了你当头一击。在合适的情况下，只有极少数人能以此为生。即便如此，他们也必须与交易中的其他相关分享利益。


    NFT 存在于一个特殊的环境中。你，作为艺术家，对构成你作品的所有元素拥有完全的控制权。NFT 市场是外汇市场，它们向全世界展示你的作品。要售卖你的作品，你不需要去画廊或机构。你不需要被强制与中间人分享部分收益。事实上，NFT
    市场会随时向你更新你艺术品的销售情况。一旦你的艺术品 NFT 经过交易，你就可以从中获得合理的佣金。你还可以随时证明你作品的有效性，并证明在任何给定时间内你的艺术品只有一个真正的主人。总的来说，NFT
    艺术品生态系统让任何人买卖艺术品变得更容易。


    与大众认知相反，创建你的 NFT 很少或完全不需要技术知识。你可以使用 `OpenSea`、`ararible` 或 `Mintable` 等 NFT 市场在几分钟内为你的作品创建
    NFT。在开始构建 NFT 之前，你必须先将你的加密钱包连接到选择的 NFT 市场。你永远不需要共享任何其他信息，因为钱包地址就是你的登录信息。之后，进入市场的“构建”（Build）区域，上传你的艺术品，并通过点击必要的按钮完成流程。讨论就此结束。在你妈妈叫你下楼吃饭、你的宝宝开始哭泣或你的另一半想你之前，你就能准备好待售的
    NFT 艺术品。


    同质化（Fungible）意味着它可以被快速替换。一张独一无二的基·曼特勒新人卡不是普通的棒球卡，相反它是不可替代且非同质的。油是同质的，因为任何桶油和另一桶一样好。当非同质资产被代币化时，代币就成了资产重要数据的数字表示。代币存储在钱包中，每个钱包都有自己的地址。`Token
    IDs` 连接到区块链上的钱包地址，这是一个巨大的、公开访问的数据库，允许任何人验证数字所有权。


    NFT 开发最常用的网站是 `OpenSea` 和 `Rarible`。虽然 `Rarible` 的总销量最高，但 `OpenSea` 提供了额外的服务，例如使用
    `OpenSea` 交易所构建你自己的 NFT 网站的能力。用户可以在两个平台上上传他们的作品并建立收藏，而无需了解任何区块链技术。


    请记住，在开始之前会有一些初始成本。一个链（通常是 `Ethereum''s blockchain`）驱动着 NFT。要将你的艺术品代币化，你需要支付名为
    `gas` 的网络费用。在开发过程中，`Rarible` 允许艺术家在区块链上（链上）铸造 NFT。因此，未来的价格将会更低。如果你打算以天价出售少数几个
    NFT，`Rarible` 是你的最佳选择。另一方面，如果你想制作大量廉价的 NFT，可以使用 `OpenSea` 的集合管理器（Collection Manager）。用户可以支付一次性费用使用
    `OpenSea Collection Manager` 创建新系列。`OpenSea` 中心化团队可以在使用该系列出售之前在链外构建并存储无限数量的 NFT。在买家支付交易的
    `gas tax` 后，你的 NFT 将被置链并进行传输。这将引导你完成在 `OpenSea` 集合中制作自己 NFT 的步骤。


    ## 第 1 步 — 设置 MetaMask


    设置软件钱包是创建自己的 NFT 的第一步。你需要使用此钱包存储你的 NFT 并支付区块链 gas 费用。访问 `metamask.io` 获取软件或安装
    Chrome 扩展。创建 `MetaMask` 钱包是快速且免费的。只需保留你的 `seed phrase`（助记词），以防将来需要找回钱包。请记住，钱包并不存储加密货币或
    NFT；相反，它们存储你的 `private key`（私钥），这是批准交易所需的。加密货币和 NFT 都存储在区块链上，`wallet ID` 用于识别拥有什么。


    ## 第 2 步 — 将你的艺术代币化


    一旦设置好 `MetaMask` 钱包，你就可以创建 NFT 了。访问 `opensea.io` 并从菜单栏选择 `Build`。你现在可以使用 `OpenSea`
    连接你的 `MetaMask` 钱包。在给你的 NFT 系列命名后，点击 `Add New Item`（添加新项目）按钮。你现在可以上传想要代币化的文件并分配其属性和统计数据，使其与你的
    `array` 中其他部分区分开来。在确定每个项目需要的副本数量后，设定零售价格。


    ## 第 3 步 — 创建市场挂单


    在出售你的第一个 NFT 之前，你必须先授权 `OpenSea` 出售你账户中的产品。你可能需要支付费用才能出售第一个 NFT。


    '
- fmt: '

    # How to Create Your NFTs?


    It''s astonishing how straightforward it is to create your NFTs. The most common
    marketplace for minting NFTs is `OpenSea` and `Rarible`. But even though `Rarible`
    is more successful in overall sales, `OpenSea` provides premium features, such
    as the ability to use the `OpenSea` exchange to create your NFT webstore. Participants
    can put their pieces of art on the webstore and create catalogs on the platforms
    without having any prior knowledge of blockchain networks. Nevertheless, you should
    be aware that there will be certain initial costs. A blockchain network, usually
    `Ethereum`s, governs NFTs. So, to tokenize your art piece or item, you''ll be
    charged a network fee that is referred to as a `gas fee`. `Rarible` allows creatives
    to mint their NFTs on the blockchain during the creation process (on-chain). This
    results in lower prices regularly. `Rarible` is usually the right option if you
    intend to make a huge amount of money from a few NFTs. Nevertheless, you could
    use `OpenSea`''s `Collection Manager` to create numerous and cheaper NFTs. `OpenSea`
    participants will mint a new NFTs set for a one-time fee. From such a set, the
    `OpenSea` highly centralized unit could generate an endless number of NFTs and
    hold them off-chain before selling them. We will guide you through the process
    to create your NFTs in an `OpenSea` platform.


    ## Step 1: Set up MetaMask


    To mint your NFT, you''ll need to first create a digital wallet. This is where
    you store your NFTs. In the future, it will equally be used to pay for blockchain
    network transaction `gas fees`. Go to `metamask.io` to download the software or
    add the chrome extension. It''s easy and free to build a `MetaMask` wallet. Keep
    records of your `seed phrase` should you need to retrieve the wallet in the future.
    Wallets are not used to store crypto or NFTs. Instead, they are used to store
    your `private key`, which is necessary to authorize blockchain transactions. Blockchain
    technology stores both cryptos and NFTs, whereas the `wallet ID` is needed to
    determine who owns them.


    ## Step 2: Tokenize Your Art


    You can mint your NFTs when you''ve created a wallet. On `opensea.io`, select
    the `Create` option from the list menu. You may then connect your wallet to `OpenSea`
    and get to business. Select the `Add New Item` tab after giving your NFT series
    a label. You can now upload the file you would like to tokenize and customize
    it with features and statistics to set it apart from the rest of your collection.
    Decide how many copies of every item you''ll need, then set a retail price.


    ## Step 3: List on The Marketplace


    Before you can market your first NFT, you ought to grant `OpenSea` access to sell
    items from your account. Because this is a blockchain technology trade, you''ll
    have to pay a transaction `gas fee`. You''re set to make the transaction once
    you transfer `Ethereum` to your `MetaMask` account. This fee is only required
    the first time you mint an NFT collection. If you don''t already have `Ether`,
    you can buy it on `Coinbase` or `Gemini` and transfer it to your `MetaMask` account.
    Anybody can locate and buy your NFTs on the `OpenSea` market now that you''ve
    granted `OpenSea` permission to sell them. You''ve completed the task!


    # The Software Required to Make Digital Art


    You''ll like to keep two things in mind: what kind of features you need and how
    much you are willing to pay for the software. Certain digital art software contains
    all you need to work with images, from painting to complex image editing. In contrast,
    others have a more limited collection of capabilities, so you''ll have to determine
    whether you want general-purpose or specialized software. Some of our recommendations
    are entirely free in cost, some require a one-time payment, and others demand
    a continuing subscription. You can discover the right digital art program whether
    you use a `Mac`, `Windows`, `iPad`, or `Linux`.


    ### Photoshop

    For a long time, `Photoshop` has been the undisputed leader of the digital art
    software, but competitors'' services are challenging its dominance. `Photoshop`,
    on the other hand, remains a tremendously effective and efficient software for
    digital artists.


    ### Affinity Photo

    `Affinity Photo` doesn''t quite match `Photoshop` in terms of functionality, particularly
    with regards to content-aware fill. However, once you gain a sense of it, you''ll
    find it capable of handling many digital art projects.


    ### Corel Painter

    The latest edition of `Corel Painter` has a slew of new features and functions,
    especially for `Apple` users. `Painter` is effective for various styles and processes
    for photo art, fine art, manga, and concept art. There are over 900 brushes to
    choose from, as well as numerous customizable options.


    ### Rebelle 4

    Features include a massive boost in brush presets to more than 170. `Rebelle 4`
    is described as "one of a kind" paint software that simulates how the paint reacts
    in the real world. On `Rebelle 4`, your favorite brushes can even be shared and
    downloaded.


    ### Clip Studio Paint Pro

    `Clip Studio Paint` is gradually becoming the standard software for creating manga
    and comics. This is the software for you if you want a natural and classic feel
    bundled up in digital art and painting software. For smooth, realistic-looking
    pen strokes, `Clip Studio Paint` employs superior pen pressure detection. Here
    is a list of a few other software you may as well consider for your digital artworks:


    * `Artweaver 7`

    * `ArtRage 6`

    * `Krita`

    * `TwistedBrush Pro Studio`

    * `MediBang Paint Pro`

    * `Black Ink`

    * `Paintstorm Studio`

