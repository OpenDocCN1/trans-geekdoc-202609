    `ERC` 缩写代表以太坊请求建议（Ethereum Request for Comments）。任何人都可以创建标准，但由作者对其进行解释并在社区内推广其支持。由于以太坊基于区块链技术，没有任何人可以接管并对协议进行更改或调整。`ERC`
    的创建是为了让人们能够以太坊网络提供信息或引入新功能，因此 `ERC` 是程序员向网络提出更改的方式。数字 `721`、`998` 和 `1155` 代表这些提案的代码。`ERC721`
    由 Cryptokitties 在 2018 年引入，每个被领养、培养和养大的猫都由一个 `NFT` 代表。在这个标准之前，人们可以创建如 `Ether`
    等同质化代币，但通过 `ERC721`，程序员可以在同一个智能合约中创建不同属性、特征和类型的代币。`ERC721` 是允许创建和交换 `NFTs` 的 `NFT`
    标准。虽然它是最流行的跨平台、易于集成且可用的 `NFT` 标准，但根据用场景，它也存在若干低效率之处。`ERC998` 具有特殊操作，其创建目的是允许在网络中通过单笔捆绑交易传输多个
    `ERC721 NFTss`，而不是进行多次交易。通过这种标准，你不仅拥有一个 `NFT`，而且该 `NFT` 还可以包含你自己的 `NFTs`，就像某种包一样。如果一个
    `NFT` 被售出，依附在其上的所有代币也会一并出售。因此，转移 `NFT` 的组成部分意味着转移整个关联元素的层级结构。例如，一只 Cryptokitty
    可能拥有一个猫抓和一个可能包含同质化代币的食盆，在出售 Cryptokitty 时，与其相关的所有物品也会被售出。


    `ERC1155` 代币是一种标准代币，它可以在其控制范围内存储表现如 `ERC20` 或 `ERC721`（或两者兼有）的代币且位于相同的地址下。`ERC1155`
    由 Enjin 创建，这是一个以太坊平台，允许在同一个合约中创建非同质化代币和同质化代币。`NFT` 发行的标准化使得更高程度的互操作性成为可能，从而使用户受益。这意味着独特资产可以相对轻松地在不同应用程序之间传输。`ERC1155`
    的最佳例子可以在区块链游戏中找到。无需为每个游戏物品需要一个新合约，可以使用同一个合约创建多个物品。此外，例如，如果游戏中的武器和加密货币都是可收集的，你可以使用
    `ERC1155` 编写这两者，极大地减少了高效运行基于区块链的游戏所需的资源。


    ## 互操作性

    正如我们已经提到的，所有的 `NFTs` 使用相同的标准，是为了让它们能够处于同一层级并在同一个以太坊平台上运行。这使得 `NFTs` 跨多个生态系统进行传输，在这些生态系统中它们是立时可见且可交易的。因此，基于相同的使用特性——即通过标准化——互操作性允许
    `NFTs` 在开放市场上自由交易。


    ## 市场性

    这是全球用户首次可以创建 `NFTs`，并让这些代币能够立即在整个生态系统的市场中可用。在这里，人们可以购买、交易、出售和拍卖 `NFTs`。这种属性的程度体现在从封闭市场内的销售转变为具有开放自由经济的市场所提供的可能性。任何用户都可以非常轻松地在全球范围内创建并交易
    `NFTs`。


    ## 流动性

    这个术语用于描述频率。高流动性意味着物品销售得很快。要理解一个市场是有流动性的还是缺乏流动性的，最好的方法是看三个指标：成交量、订单簿深度以及买入和卖出价格之间的差，即买卖价差。


    ## 不可变性与可证明的稀缺性

    不可变性，顾其名，是区块链保持不变的能力。简单来说，区块链内部的数据无法被更改。在技术本质上，区块链被配置为不可变的数据库，无法操纵已存在的数据。每个区块都包含信息（例如交易详情），并使用一种称为哈希值（hash
    value）的加密原理。该哈希值由每个区块生成的字母数字字符串组成。每个区块不仅包含指向自己的哈希，还包含了前一个区块。这确保了区块在追溯上是配对的。区块链技术的这一特性确保没有人能入侵系统或更改存储在区块中的数据。最流行的哈希函数是
    `SHA256`，即安全 256 位哈希算法。哈希值保护着每段代码。哈希过程生成一个 64 个字符的字符串。无论输入的大小如何，被称为数字签名的固定长度字符串始终是相同的。这指的是录入的确切数据，而该哈希值的关键属性是它是无法被解码的。“不可变性”（immutable）一词被用来描述永远无法改变的事物。不可变性是为数字资产印上真实性的关键，同时也引入了稀缺性。不可变性意味着，例如，在游戏中属于特定某人的东西不能被移动或更改。


    ## 可编程性

    `NFTs` 是完全可编程的。例如，它们可以被编程为响应所有者采取的触发或动作。它们还可以响应外部触发因素，例如游戏的时间或分数。`NFTs` 的编程可能性是无限的。


    '
- fmt: '

    # How Does NFT Work?


    NFTs are created and issued using a variety of frameworks. ERC-721, a standard
    for the issuance and exchange of non-fungible assets on the Ethereum blockchain,
    is the most well-known of these frameworks. NFTs are built on Ethereum''s permanent
    blockchain, which means they can''t be changed. No one may take away the possession
    of an NFT or duplicate it. They''re also "permissionless," which means that anyone
    can make, purchase, or sell an NFT without requesting permission. Finally, each
    NFT is one-of-a-kind and can be used by everyone. Yes, it''s like a one-of-a-kind
    collectible card displayed in an always-open store window that everyone can appreciate.
    Yet, only one individual (or cryptocurrency wallet, to be precise) may possess
    at any given time.


    A virtual artwork, such as a picture, will be used as a case in this book. In
    the NFTs platform, it’s important to note, however, that it''s not just about
    that picture (which can easily be replicated). The fact that it exists as a digital
    entity on the blockchain is what distinguishes it. ERC-1155 is the latest and
    enhanced standard. It allows a specific contract to include both fungible and
    non-fungible tokens, which opens up a world of possibilities. The standardization
    of NFT issuance allows for greater interoperability that favors users in the long
    run. It essentially implies that specific assets can be easily shared among various
    applications. More will be explained on NFTs standardization later on in the book.


    If you want to store and admire the elegance of your NFTs, Trust Wallet is the
    place to go. Your NFT will have an address, just like other blockchain tokens.
    It''s worth remembering that NFTs can''t be duplicated or exchanged without the
    owner''s consent, including the NFT issuer. NFTs can be traded on open exchanges
    like OpenSea. These marketplaces bring buyers and sellers together, and each token
    has its meaning. NFTs, by their very nature, are subject to price fluctuations
    in response to market supply and demand. But how can such items be considered
    valuable? Like any other useful item, the value of a useful object is assigned
    by people who think it is valuable. Value is, in essence, a common belief. It
    makes no difference if it''s fiat currency, rare stones, or a car; they all have
    value, and people believe they do. Why not digital collectibles? This is how any
    valuable object becomes precious.


    ## Characteristics of NFTs


    - **Non-interoperable**: CryptoPunks cannot be used as characters in the CryptoKitties
    game, and vice versa. This also applies to collectibles like trading cards; a
    Blockchain Hero card will not work in the Gods Unchained trading card game.

    - **Indivisible**: NFTs are indivisible, unlike Bitcoin Satoshis, and cannot be
    split into smaller fractions. They only exist as a complete unit.

    - **Indestructible**: Each token cannot be lost, deleted, or reproduced since
    all NFT data is preserved on the blockchain through blockchain technology. The
    possession of these tokens is also unchangeable, implying that gamers and holders
    own their NFTs rather than the companies that make them. This is in contrast to
    purchasing music from the iTunes store, where consumers do not necessarily own
    the music, they are buying; instead, they are purchasing permission to listen
    to it.

    - **Verifiable**: Another advantage of storing past ownership data on the blockchain
    is that objects like digital art can be traced back to the original maker, eliminating
    the need for third-party authentication.


    ## NFTs Scarcity


    The maker of an NFT is in charge of determining the asset''s scarcity. Consider
    purchasing a ticket to a football match. The maker of an NFT may choose how many
    replicas there are, just like an event manager can decide the number of tickets
    to sell. 5000 General Admission tickets, for example, are often exact replicas.
    A ticket with an allocated seat, for example, can be issued in multiples that
    are very identical yet differs slightly. In another scenario, the creator may
    desire to make a one-of-a-kind NFT as a unique collectible. Each NFT will also
    have a specific identifier (like a bar code on a standard "ticket"), and only
    one holder in these scenarios. The NFTs’ planned scarcity is important, and it
    is up to the maker to decide. A maker may wish to make each NFT fully special
    to generate scarcity, or they may have good reasons to make thousands of copies.
    Keep in mind that all of this material is available to the general public.


    ## NFTs and Ethereum


    Ethereum allows NFTs to work for a variety of purposes:


    - It''s easy to show ownership history because transaction records and token metadata
    are publicly verifiable.

    - It''s almost impossible to "steal" possession of a transaction after it''s been
    verified.

    - Trading NFTs can be done peer-to-peer without the need for sites that are willing
    to accept big commissions.


    The "backend" of all Ethereum items is the same. To put it another way, all Ethereum
    products can communicate with one another, making NFTs accessible through products.
    You can simply purchase an NFT on one asset and sell it on another. You can display
    your NFTs on several assets at once as a maker, and each asset will have the most
    recent ownership details. Since Ethereum is never down, your tokens will still
    be available to sell.


    ## Fractional Ownership


    Creators of NFTs may also create "shares" for their assets. This allows traders
    and fans to own a piece of an NFT without having to purchase the entire asset.
    This expands the number of opportunities available to NFT minters and collectors.
    Fractionalized NFTs can be exchanged not only in NFT markets but even on DEXs
    such as `Uniswap`. This ensures there will be more buyers and sellers. The price
    of an NFT''s fractions may be used to determine its total price. You have a better
    chance of owning and profiting from the things you care about. It''s more difficult
    to be priced out of buying NFTs these days. You can learn more about Fractional
    NFT ownership on NIFTEX, NFTX.


    In principle, this will allow people to do things like own a Picasso painting.
    You''d become a shareholder in a Picasso NFT, which means you''d be able to vote
    on issues like profit sharing. It''s possible that having a fraction of an NFT
    would entitle you to participate in a decentralized autonomous organization (`DAO`)
    for asset management in the not-to-distant future. Ethereum-based organizations
    enable strangers, such as global asset owners, to collaborate safely without having
    to trust each other. This is because no money can be spent without the consent
    of the whole party. This is a developing market — NFTs, `DAOs`, and fractionalized
    tokens all progress at various rates. However, since they all speak the same language:
    Ethereum, all of their technology remains and can readily collaborate.


    # CHAPTER 4: Why Do NFTs Have Value?


    One of the key differences between cryptocurrencies and NFTs is that the supply
    of a cryptocurrency is fixed. The supply of an NFT can change depending on the
    creator’s intention. The economics behind supply and demand will dictate how much
    your token is worth. If there are a lot of tokens available, it will be more difficult
    for people to sell them for a high price because many other people are trying
    to sell their tokens as well. This concept is most important when thinking about
    digital collectibles (like CryptoKitties). When CryptoKitties was first released,
    there were very few kitties in circulation. Each kitty was worth a lot of money
    because there were very few kitties available. Now that there are thousands of
    CryptoKitties in circulation, the price of each kitty has decreased because it’s
    much easier for people to sell their kitties at a high price. After all, many
    other people are trying to sell their kitties as well.

