    # 资本利得税 —— NFT 潜在投资者的噩梦？


    资本主义的原则可能会助燃在线游戏中的虚拟土地争夺战。不过，既然我们谈到了这个话题，它也将带入“资本利得税”的形式让老山大叔（美国政府）也入其中。因为 `IRS`
    对此事的立场非常明确。关于此事，`IRS` 官方表示：“如果你将作为资本资产持有的虚拟货币兑换为其他财产（包括商品或其他虚拟货币），你将确认一项资本利得或亏损。”这意味着，如果这些潜在的
    NFT 投资者未能报告他们的投资，他们可能会在 `IRS` 处陷入大麻烦。这意味着尽管加密货币的名称中带有“货币”二字，但 `IRS` 并不承认其为货币。`IRS`
    将其视为一种正在被投资的资产。由于 `Bitcoin` 和 `Ether` 等加密货币具有价值快速增长的特长，2021 年价值几百美元的 `Bitcoin`
    或 `Ether` 到 2022 年可能非常接近千美元。因此，对于这种“资本资产”的持有者来说，在报税季，这可能会是一个相当大的冲击。由于 NFT 属于收藏品范畴，它们面临着更严苛的资本利得税率，即
    28%。例如，卖出价值 6900 万美元作品的艺术家 Beeple，预计必须为这笔交易缴纳数千万美元的税。Beeple 在得知这一事实后，其反应可能是许多潜在
    NFT 投资者都会产生的想法。Beeple 被引用原话说道：“噢，妈的，那税也太多了！”


    ## 第 18 章：你应该避免的 NFT 错误


    在你一头脑地冲入 NFT 世界之前，有一些你必须避免的常见错误。虽然 NFT 的创建和销售并没有持续多久，但可以看出，有些人正在一次又一次地犯同样的错误。所有这些错误对于你在这
    NFT 世界的成功来说都是毁灭性的。在你刚开始时可能会犯一些其他小错误，这没关系。只要你从中从中汲取教训，就可以。你需要做的是避免这些可能决定成败的巨大错误。


    ### 考虑过于短视


    是的，某些 NFT 在过去一年里以数百万的价格出售。但这并不意味着你创建 NFT 或投资 NFT 并在第一次就能赚到大笔钱。如果你试图通过 NFT 太快地赚太多钱，那么你很可能会失败并放弃整个念头。毫无疑问，NFT
    之旅程可以是非常令人兴奋的。但这并不意味着你在下周这个时候就会成为一名百万富翁。如果你以“快速致富”的态度进入 NFT 领域，你极可能会失败。通过 NFT
    成功的最佳方式是提供价值。你还需要足够的耐心，因为你可能无法立即卖出你的 NFT。保持营销努力的一致性，并花时间建立对未来有益的合作和伙伴关系。如果你对 NFT
    游戏是认真的，请长期投入。


    ### 对你的 NFT 推广不够


    仅仅创建你的 NFT 并将它们列在 `OpenSea` 上，并期待钱源源不断进来是不够的。`OpenSea` 上已经有数百万个 NFT 上架，其中大多数都在苦苦寻找买家。忘记掉“只要建立，他们自然会来”的概念吧。这是不会发生的。你需要制定一个营销计划并坚持执行。识别你的目标受众是谁，然后找到他们出没的地方。利用社交平台来加强你的
    NFT 推广。充分利用 `Discord` 论坛、`Clubhouse` 和 `Reddit` 来增加你的优势。尽你所能让你的 NFT 和你的才华传出去。有些人可能在
    NFT 上获得好运。他们可能将 NFT 列在 `OpenSea` 上并迅速售出，让人们求着买更多。这种情况非常罕见。你不能指望这种运气，所以务必有一个推广计划并付诸行动。


    ### 为你的 NFT 选择了错误的市场


    这是我们反复看到的另一个经典错误。NFT 创作者们懒得进行必要的研究，他们直接选择了 `OpenSea`，因为它是最大的平台。是的，`OpenSea` 确实有很多访问者（每月近
    4000 万且仍在增长），但这并不意味着它是你 NFT 的最佳平台。在使用某个 NFT 市场之前，你需要了解几点。最重要的一点是知道你的目标受众是否使用该市场。你还需要考虑你想创建的
    NFT 是否符合该市场的理念。随着不断有新的 NFT 市场不断涌现，你需要确定你正在考虑使用的市场是否安全。市场中社区规模很重要，但更重要的是社区是否响应并乐于帮助。不幸的是，已经存在一些诈骗性的
    NFT 网站。这些人只会向你收取费用来支付 `Ethereum` 等费用，而你永远卖不掉任何东西。为了避免这些诈骗 NFT 网站，使用 `Dapp Radar`
    网站来检查合法性。


    ### 廉价做 NFT


    你对你的 NFT 事业投入的越多，越好。许多人犯了一个错误，认为 NFT 世界是免费的，他们可以用最廉价的方式完成一切。虽然有些平台不收上架费，但大多数质量最好的平台都是收费的，所以你需要将此考虑在你的
    NFT 预算中。我们已经告诉过你多次，以太坊网络目前是最流行的 NFT 网络。如果你使用以太坊网络，你就必须支付 Gas 费。你还需要为你的 NFT 营销投入一些资金。除非你在社交媒体上拥有巨大的粉丝群，否则你需要使用社交媒体广告来展示你的
    NFT。这是一种相当廉且有效的方法。随着 NFT 变得更加流行，Gas 费和手续费可能会下降，但这无法保证，你不能依赖这种情况的发生。如果费用真的了，就把省下的钱用于更多的营销。你需要认真对待你的
    NFT 之旅，并做好投入的准备以获得最大的成功机会。


    ## 第 19 章：NFT 中的体育与电子竞技


    在一个领域，极客文化和运动员文化产生了交集：收藏。几十年前，日本街机厅曾有一种非常有趣且创新的视频游戏，名为 `Sega Card Gen ''10`。它的理念是：这是一款棒球视频游戏，你像向自动贩卖机投入美元一样插入棒球卡，这些卡片就会创建你的阵容。你就像在任何收藏品店购买卡片一样。根据棒球运动员的记录，视频游戏会评估他们在游戏中的表现。因此，拥有数据更出色的球员将有助于你在游戏中获胜。这种类型在亚洲仍然流行，目前最成功的形式可能是《三国大战战》。卡片的潜力依然存在，但不再需要实体。例如，你可以将
    NFT 交易卡与非常有价值的视频游戏 IP（如 `MLB` 系列）相结合，这些收藏品将让你在游戏中拥有一支强大的球队。游戏本身会激励球员卡的交易。


