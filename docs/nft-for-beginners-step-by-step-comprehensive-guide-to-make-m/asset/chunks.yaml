    # Video Game Assets


    Video game assets have been commodified for years. This is particularly noticeable
    in the mobile games market. In these environments, players can often use fake
    in-game money that can be purchased as assets within the game. This in-game currency
    can be earned by playing the game, but it can also be earned by spending actual
    real money. And people do this all the time. Mobile games are cheap to make and
    easy for casual players to adopt, and they are extremely lucrative.


    One kind of asset that is very popular in games is the “skin.” Skin is essentially
    a different way of dressing up your avatar. An avatar is a character you control
    in the game. If you are playing `Super Mario Bros`, Mario is your avatar. For
    many of these games, you are looking through the eyes of the Avatar; you''re experiencing
    the game in the first person. This means you don''t even see your skin. Only other
    players see your skin while you''re playing the game. You don''t even enjoy the
    aesthetic you earned or paid for.


    Consider the implications for a moment. People will pay real money to change their
    appearance for others. They hardly get to enjoy it. Some of these skins are particularly
    expensive or rare, or can only be acquired through some kind of accomplishment
    like winning a tournament. These skins are considered the same as wearing Gucci,
    or a mark of ability. They signal you are very good at this game and accomplished
    at it. You could think of them like medals on the chest of a military leader or
    merit badges on the sash of a scout. Just the honor of being able to express to
    others these sorts of things is incredibly valuable.


    In Belgium and The Netherlands, some of these virtual item systems have been outlawed
    or heavily regulated. Particularly, the concept of keys and loot crates. This
    is a way of selling digital assets through a psychological trick. Games occasionally
    give players loot crates. They promise that inside the crate is some kind of asset
    for the game the player might want. The player can only open the crates with a
    key. The only way to get a key is to purchase one with real money.


    Keep in mind, this is a digital asset. There is no actual crate. There is no actual
    key. Inside the crate, there is no asset. There is nothing inside of it. It doesn''t
    have an inside. It is a digital image of a crate. It is not a real crate. By buying
    the key and using it on the crate, all you have done is trigger a random number
    generator to select a random asset for you. Because these assets are tradable
    and valuable, and because they are granted through a random number generation
    system using real money, some governments have interpreted this to be a form of
    gambling.


    These games are often very popular with children. Because in most places you have
    to be an adult to gamble, this creates a legal complication that hasn''t been
    resolved yet. It is further made morally dubious on account that there is no regulation
    on it in the same way any ordinary casino is regulated, and there is no way to
    calculate the odds in a normal way. You can calculate the odds of winning games
    of poker or craps. But the back-end math that creates this asset production machine
    is completely invisible and we are utterly reliant on the goodwill of the game
    studio. The "loot" in these crates are essentially `NFTs`. A crate is an `NFT`
    that generates a different `NFT` when combined with a key `NFT`. If things are
    starting to sound weird to you, that is a great observation. It is going to get
    weird.


    # CHAPTER 20: NFT Stocks


    Bitcoin and other cryptocurrencies, like real money, are fungible, which means
    they may be traded or swapped for one another. For example, the value of one `Bitcoin`
    is always the same as the value of another `Bitcoin`. In the same vein, one unit
    of `Ether` is always equal to another unit of `Ether`. Because of their fungibility,
    cryptocurrencies are well-suited for use as a safe means of exchange in the digital
    economy, where they have gained widespread acceptance. Instead, they are digital
    representations of assets that have been compared to digital passports because
    each token includes a unique, non-transferable identity that allows it to be distinguished
    from the other tokens in circulation. They are also extendable, which means you
    may combine two `NFTs` to create a third, one-of-a-kind `NFT` by breeding them
    together. `NFTs`, like `Bitcoin`, include ownership information that allows token
    holders to be easily identified and transferred between one another.


    In addition, `NFTs` allow asset owners to provide information or characteristics
    related to the item. For example, in the case of coffee beans, tokens representing
    the beans may be classed as fair trade. Alternatively, artists may sign their
    digital artwork by including their signature in the information associated with
    it.


    `NFTs` were developed as a result of the `ERC-721` standard. `ERC-721` is a smart
    contract standard developed by some of the same individuals who were responsible
    for the `ERC-20` smart contract standard. It defines the bare minimum interface
    — including ownership details, security, and metadata — that is necessary for
    the exchange and distribution of gaming tokens. Taking the idea a step further,
    the `ERC-1155` standard lowers the transaction and storage costs associated with
    non-fungible tokens while also batching several kinds of non-fungible tokens into
    a single contract.


    `Cryptokitties`, maybe the most well-known use of `NFTs`, is a good example. `Cryptokitties`,
    which were introduced in November 2017 and have unique identification numbers
    on the `Ethereum` blockchain, are digital representations of cats. Each cat is
    one-of-a-kind and has a corresponding `ether` value. They breed amongst themselves
    and create new offspring, each of whom has a unique set of characteristics and
    values compared to their parents. Following its debut, `Cryptokitties` quickly
    gained a large following, with fans spending more than $20 million in `ether`
    to purchase, feed, and otherwise care for them in only a few short weeks. Some
    fans went so far as to spend upwards of $100,000 on the project. While the `Cryptokitties`
    case may seem to be inconsequential, the ones following it have far-reaching economic
    ramifications. For example, non-financial transactions (`NFTs`) have been utilized
    in both private equity and real estate transactions. Thus, incorporating several
    kinds of tokens into a single contract has many ramifications, one of which being
    the potential to serve as an escrow for various forms of `NFTs`, ranging from
    artwork to real estate, in a single financial transaction.


    ## The top three non-financial-transactions stocks


    Here is a list of the finest NFT stocks to invest in:


    ### Mattel, Inc.

    Playthings and other consumer products are the focus of `Mattel, Inc.`, which
    was established in 1945 and is headquartered in California. It now has a market
    capitalization of $7.6 billion. According to the news outlet `The New York Times`,
    `Reuters` reported on June 17th that the company will shortly launch a limited
    sale of `NFTs`. In addition, an auction of three works of digital art utilizing
    `NFTs` based on the blockchain will take place.


    ### Funko, Inc.

    `Funko, Inc.`, established in 2017, is a Washington-based company that manufactures
    and distributes pop culture consumer products. It has a market capitalization
    of $741 million and employs about 2,000 people. According to financial adviser
    `Bank of America`, the price objective for `Funko` shares has been increased from
    $12 to $30, which believes the company''s core business is doing well.

