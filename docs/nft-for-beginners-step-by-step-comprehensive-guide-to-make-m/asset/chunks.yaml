    # NFT 是被动收入投资


    这类代币的大部分价值来自二级市场，人们可以在那里将其交易或出售给他人以换取加密货币或其他 NFT。这就是为什么 NFT 更像是一种被动收入投资，而不是像购买具有投机价值的股票之类的支出。许多不同的游戏开发公司正寻求利用区块链技术来创建独特的收藏品；然而，我们只重点介绍了了目前众多项目中的三个。很容易理解为什么它们如此受欢迎，因为它们不仅收藏起来很有趣，还能为所有者提供被动收入。现在你已经了解了
    NFT 是什么样以及如何使用它们，让我们来看看今天该领域的主要参与者吧。


    ## 第 7 章：如何投资 NFT？


    加密货币领域正在趋于成熟，现在购买代币的途径比刚开始时多得多。如果你一直在考虑进入这一领域，这将帮助你规避一些可能让新手在追求加密财富之路上绊倒的难理解之处。非同质化代币（`NFTs`）试图通过将每个代币绑定到游戏或其他虚拟世界的特定单元来创建数字稀缺性。它们代表了没有内在价值的独特虚拟物品。明确的是，`NFTs`
    并不是代表公司股份的代币。相反，它们是可以在基于游戏的世界上进行所有和交易的特定游戏代币。你可以把 `CryptoKitties` 看作是类似的；它们是数字世界中数字猫的数字繁殖卡，但除了人们愿意支付的费用外，它们在现实世界中没有任何实际价值。虽然你可以购买代币在游戏中使用，但大多数
    `NFTs` 仅在加密交易所上交易，而不用于游戏内部。因此，如果你想玩一个游戏并获得在该游戏中作为奖励使用的代币，我建议你查看其原生代币。这是因为一旦项目完成，大多数
    `NFTs` 将变得几乎无用武处。现在由于我们已经涵盖了 `NFTs` 是什么以及它们与传统加密货币的区别，让我们来看一些你购买购买（并可能赢得）它们的方法。注意：这绝不是购买
    `NFT` 方式的详尽列表。这些仅仅是一些最流行的方法。


    ### 空投 (Airdrops)


    `NFTs` 经常通过空投发放。“空投”是指项目向用户免费发放代币。假设你足够幸运，找到了一个没有被过度认购的项目。在这种情况下，你可能只需持有现有的代币就能获得免费代币（这最近发生在
    `OmiseGo` 身上，他们为持有 `OMG` 发放了代币）。


    *   `NFT Tracker` — 一个跟踪所有活跃和即将推出的 `NFT` 项目的优秀网站。它定期更新，并允许你根据空投价格、截止日期等进行过滤。

    *   `Token Tracker` — 一个非常简单的网站，仅跟踪空投，但没有 `NFT Tracker` 那样的过滤功能。

    *   `CoinMarketCal` — 另一个寻找即将发生的加密活动（如空投）的优秀网站。这里的唯一缺点是它们没有像 `NFT Trackers` 那样采取任何特殊措施来区分它们。它们只是按时间倒序简单列出它们能找到的所有内容，没有过滤器或统计数据。


    ### 立即购买购 (Buy It Now)


    购买 `NFT` 最常见的方式是通过交易所。你很可以在任何支持它们的各大交易所上找到你正在寻找的代币。大多数代币都兼容 `ERC-721`，因此可以在 `IDEX`
    和 `ForkDelta` 等去中心化交易所（DEXes）上交易。然而，在进行任何交易之前，你应该双重检查，以确保一切都能正常运行。


    ### 交易 NFT 的一些建议


    *   **首先检查代币是否受支持！** 我遇到过的最大挫折是我当我进行第一次交易时，发现该交易对不受支持。查看你喜爱的交易所的费用表，如果你计划进行大量交易，请设置合适的费用。

    *   **阅读细则！** 许多交易所对你如何提取 `NFTs` 有限制，或者它们可能要求你在申请提取之前持有一定数量的该代币。例如，`Binance` 要求你提取的代币成交的
    100% 必须来自交易。

    *   **不要忘记特殊活动！** 经常会有竞赛和赠送活动获得免费的 `NFTs`，所以确保你也关注各种社区以获取这些信息。


    ### 自己创建！ (Create It Yourself!)


    最后，你也可以创建自己的非同质化代币。许多 `NFTs` 是 `ERC-721` 代币（一种特定的以太坊代币，被编程为非同质化），因此你可以遵循创建任何其他
    `ERC-721` 代币的相同步骤。不要让这个吓人的术语吓跑你！这是一个非常直接的过程——尽管很耗时。


    ## 为什么我需要花时间选择我的钱包？


    如果你只存储一种加密货币，似乎你不需要考虑你选择的钱包类型。然而，投资不仅仅是从交易所购买单个硬币或代币。你选择什么种的钱包将决定该特定钱包提供什么种的服务。


    *   **交易所 (Exchanges)** — 对于几乎每个代币，都有一个你可以购买或出售它的交易所。某些交易所提供多种币，而另一些则专注于少数特定的币。一种常见的交易所类型是加密货币兑加密货币（也称为“加密货币兑法币”）交易所。这些交易所通常允许你交易加密货币或法币。

    *   **硬件钱包 (Hardware Wallets)** — 硬件钱包是考虑到安全设计的物理设备。它们离线存储你的私钥，并通常内置了不同的安全功能。其中一些还允许你连接到并通过内置应用程序交易代币。这里的很大缺点是它们只适用于特定的加密货币，因此如果你有多种投资，你可能需要多个。

    *   **软件钱包 (Software Wallets)** — 软件钱包是在线存储你的私钥并将计算机连接到互联网的应用程序。这些钱包并不适合存储大量的加密货币，但它们允许你在任何交易所平台上使用任何币。这是存储加密货币最方便的方式，因为没有物理设备需要存储和管理。

    *   **纸钱包 (Paper Wallets)** — 纸钱包是可以打印的私钥纸质。这是存储加密货币最安全的方法，也是新投资者安全存储硬币的最简单方法。这里的唯一缺点是，纸钱包并不总是免受攻击，所以如果你计划使用，请务必只使用可靠的来源。

    *   **硬件安全模块 (Hardware Security Modules - HSM)** — 硬件安全模块并不总是被称为“钱包”，但它们的功能相似。它们通常被称为“私有交易所密钥”或“私钥”以及类似的术语。它们有时也被称为“冷钱包”或“隔离钱包”，但硬件安全模块并不离线存储私钥，因此从技术上讲它们不认为是冷钱包。

    *   **Mist/以太坊钱包 (Mist/Ethereum Wallet)** — Mist 和以太坊钱包相似，因为它们在线存储私钥。以太坊钱包还内置了交易所，允许在币之间进行交换。然而，它们必须购买自己的加密货币。


