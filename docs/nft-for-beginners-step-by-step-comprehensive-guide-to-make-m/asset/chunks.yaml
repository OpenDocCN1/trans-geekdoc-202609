    # 影响 NFT 价值的因素


    由于资产类别非常年轻，寻找非同质化代币（NFT）的准确价值非常困难。虽然像《娜丽莎》这样的实体作品和 NBA 球员卡之类的实物收藏品有固定价值，但考虑非同质化代币的交易者可能会很难判断特定资产或收藏品是否值得投资，以及他们是否真的想要或需要它。然而，随着
    NFT 在许多行业中获得关注并产生巨大价值，决定其价值的三个主要变量已经出现。


    ## 稀缺性

    这一因素决定了某个 NFT 有么稀有以及“难以寻找”。来自知名数字艺术家的独特作品或由知名人物开发的 NFT 都是稀缺性的例子。另一个不常见的的考虑因素是，此类
    NFT 对视频游戏可能产生的影响。人们被这类 NFT 的内在价值所吸引，由于 NFT 持有者还拥有区块链所有权证明，这种价值得到了增强。这建立了一种独特性，并定义了
    NFT 的溢价价值。首批 `CryptoKitties`、`Beeple` 的 `Everydays — The First 5000 Days` 等，都是对加密货币领域产生特殊影响的绝佳例子。


    ## 用途

    NFT 在现实世界中的用途决定了它的效用，无论是在物理还是数字环境中。例如，某些非同质化代币可以在游戏中作为虚拟领地、法术或角色，使它们不仅仅是收藏品。正如此，非同质化代币具有即时价值，这种价值根据底层项目的接受程度随时间而增长。随着去中心化游戏社区的增长，越来越多的玩家愿意花巨资购买一张特殊的卡片。`Euro
    2020 NFT Tickets`、`Decentraland` 房产，以及《巫师世界 Gwent 纸牌游戏》中的 `Geralt of Rivia` 等收藏卡都是这些
    NFT 的例子。


    ## 实体性

    某些 NFT 与实体物品相关，在实体性和所有权不可篡改性方面提供价值。原则上，任何可以由非同质化代币支持以建立所有权的物品都可以。但这并不意味着该物体变得稀有或昂贵。该物品为参与者提供的实用性、稀缺性和个人满足感将影响其内在价值。例如，拥有一个与明星一起参加独家活动的非同质化代币门票，从内在和个人角度来看都比拥有一个与瓶盖相关的非同质化代币更有吸引力。那些具有实体价值的
    NFT 特别适合根据市场实用性进行短期交易。因为像门票一样，这些 NFT 可能有有效期。其他收藏品，例如 NFT 绑定的限量版鞋子，随着可用产品数量的减少而随时间增值。


    ## 品牌

    没有品牌的收藏品将没有市场，因此其价值不会因为稀缺性而提高。品牌决定了大多数收藏品的价值。艺术家、主题的内在特质以及影响者的外在特质共同构了任何特定收藏品的品牌。主题是该收藏品的核心。这可能是一组日常作品，例如
    `Beeple''s Everydays: The First 5,000 Days`、8 位艺术品，或者像 `TopShot` 这样的体育明星。某些 NFT
    与影响者相关，例如带有 `Creator Coins` 的 `BitClout` 实验，它们象征着名人。由于创作者和主题是密不可分的，它们都是该物品的根本方面。一个
    `Beeple` 就是一个 `Beeple`，并且将永远是一个 `Beeple`。`LeBron` 的 `TopShot` 永远是 `LeBron` 的 `TopShot`。`Beeple`
    的作品价值以及 `LeBron TopShot` 的价值会随着他的成功而起伏。


    ## 稀缺性

    在讨论市场用户获得的价格之前，我们必须首先分析稀缺性。稀缺性是收藏品品牌产生价值的助推器。稀缺性具有类似于品牌的子类别：绝对稀缺性、相对稀缺性和可用性。由非同质化代币支持建立所有权的物品数量被称为绝对稀缺性。世界上只有
    10,000 个 `punks`。由于创作者和主题是密不可分的，它们都是物品的根本方面。一个 `Beeple` 就是一个 `Beeple`，并且永远是一个
    `Beeple`。`LeBron` 的 `TopShot` 永远是 `LeBron` 的 `TopShot`。`Beeple` 的作品价值以及 `LeBron
    TopShot` 的价值会随着他的成功而起伏。随着新版本的发布，`TopShot` 的数量预计会增加。相对稀缺性是指与整个集合相比的稀缺程度。只有 10,000
    个 `Cryptopunks`、88 个 `zombies`、24 个 `apes` 和 9 个 `aliens`。NFT 的一个主要特征是已知稀缺性。交易者确切知道特定产品有多少个。相比之下，体育卡、车辆或鞋子等商品可能不知道特定物品有多少个。创作者决定了绝对稀缺性和相对稀缺性，这可能会影响产品。如果品牌价值超过稀缺性，它将始终从稀缺性中受益。为了产生初始价值，品牌必须是独特的。绝对和相对稀缺性影响可用性，当强力需求触发时，稀缺性意味着供应有限，提供了上行的空间。


    ## 市场

    市场根据品牌和稀缺性决定价格。之前的价格、评估价格和二级交易都是影响价值的市场因素。之前的价格是物品价值的基石。评估价格通常作为未来价格的底价。这种原则经常例外，特别是当
    NFT 类别处于繁荣时期时，可能会对品牌产生负面影响。专家通过考虑之前的价格、艺术家和稀缺性来确定价格。二级交易也经常被用于确定房地产。在 `Cryptopunks`
    的情况下，任何特定的 `punk` 都可以作为其他 `punk` 的比较；然而，二级交易并不考虑物品的独特属性。一个 `ape` 的销售可以提供有关价值的线索，但不是一个具体的数字。


    ## 宏观

    另一个影响所有收藏市场的因素是经济，它与物品本身无关。当经济良好时，人们更愿意在各种物品上花钱。在定价方面，经济是一个独特且不可预测的因素。除了存在，加密货币是关于
    NFT 的另一个因素。当加密货币相对于货币表现良好时，NFT 的需求将增加。我相信如果加密货币市场失败，NFT 的需求将遭受损害。任何情况下，如果加密货币价格上涨，用加密货币购买的
    NFT 价值将会贬值。


    ## 拥有历史

    NFT 的价值由创作者和前持有者的身份决定。热门品牌的创作者或公司通常创建或发行具有巨大拥有历史的 NFT。有两种增加资产价值的方法。第一是与强大品牌的公司或人物合作
    NFT。例如，第一个代表 F1 赛车的授权 NFT 以 `$1,124` 拍卖。第二种选择是转售曾由影响力人物拥有的 NFT。尽管这些信息很有价值，目前很难确定前所有者是谁。为了提高非同质化代币的价值，市场和交易者可以提供简单的跟踪界面。例如，`OpenSea`
    可以突出投资 NFT 盈利的交易者的地址，并列出他们拥有的其他 NFT。


    ## 未来价值

    非同质化代币的未来价值使用价值变化和未来现金流计算。投机驱动价值并有时是价格飙升的主要决定因素。例如，`CryptoKitty #18` 的价格在短短三天内从
    `9ETH` 飙升到 `25ETH`。许多人认为基于价值的价格对 NFT 是有害的。然而，投机是人类行为的自然方面，也是现有金融体系的重要方面。创作者通过取得正确的平衡可以提高
    NFT 价值并吸引新用户。有限供应和投机影响定价。NFT 产品的价格表现图可以引导投机，也可以展示价值的增长。运动鞋市场 `StockX` 价值达十亿美元，因为它鼓励消费者对运动鞋价格进行下注，创造了一个独特的运动鞋市场。NFT
    初始所有者收到的利息或版税被称为未来现金流。例如，`SuperRare` 每次在 NFT 作品后期出售时都会向生产者支付 `3%` 的版税。公司可以从未来的
    DeFi 开发中借鉴想法。NFT 是可以租赁和抵押以获得更多现金流的资产。在游戏中，玩家可能会请求某个游戏资产使用一天以达到目标。


    ## 流动性溢价

    更大的流动性溢价意味着更高的 NFT 价值。流动性溢价是链上产品应该比离线开发的产品价值更高的因素。任何拥有 `ETH` 的人可以在二级市场上无缝交易 `ERC`
    标准 NFT，增加了可能买家的数量。由于流动性降低了持有 NFT 的风险，交易者会交易交易量大的资产类别。


    ---


    ## NFT 价值框架与机会

    NFT 的价值是通过四个因素计算的，其中某些因素之前解释过。


