    # CHAPTER 10: How to Create and Sell Your NFTs?


    I know you’ll have questions about whether or not NFTs are worthwhile. Consider,
    for a moment, the world of traditional art. You see art galleries and people paying
    hundreds of thousands or millions of dollars for artwork, and then reality hits
    you. Under the right conditions, only a very few will make a living doing it.
    Even then, they must divide the benefits with other parties involved in the deal.


    NFTs live in a special environment. You, the artist, have complete control over
    all of the strings that make up your work. NFT marketplaces are foreign marketplaces
    that display your work to the entire world. To sell your work, you don''t need
    to go to a gallery or an agency. You are not forced to share a portion of your
    earnings with middlemen. NFT marketplaces, in reality, keep you updated on the
    selling of your artwork at all times. You can earn a reasonable commission from
    your artwork''s NFT once it is traded. You may also prove the validity of your
    work at any time and that there is only one true owner of your artwork at any
    given time. Overall, the NFT artwork ecosystem makes it easier for anyone to purchase
    and sell art.


    Creating your NFTs requires little or no technological expertise, contrary to
    popular belief. You can create NFTs for your artwork in minutes using NFT marketplaces
    like `OpenSea`, `Rarible`, or `Mintable`. You must first link your crypto wallet
    to the NFT marketplace of choice before you can begin building your NFT. You''ll
    never have to share any other information because the wallet address would be
    your login information. After that, go to the marketplace''s "Build" area, upload
    your artwork, and complete the process by pressing the necessary buttons. That
    is the end of the discussion. You''ll get your NFT artwork ready to sell before
    your mother summons you downstairs for dinner, your baby begins to weep, or your
    better half misses you.


    Fungible means that it can be quickly replaced. A 1 of 1 Mickey Mantle rookie
    card is not just any baseball card, rather it''s irreplaceable and non-fungible.
    Oil is fungible because any barrel is as good as the next. When non-fungible assets
    are tokenized, the token becomes a digital representation of the asset''s important
    data. Tokens are stored in wallets, each of which has its address. `Token IDs`
    link to wallet addresses on the blockchain, a massive, publicly accessible database
    that allows anyone to verify digital ownership.


    The most common sites for NFT development are `OpenSea` and `Rarible`. Although
    `Rarible` has the most overall sales, `OpenSea` offers additional services, such
    as the ability to build your own NFT website using the `OpenSea` exchange. Users
    can upload their artwork and build collections on both platforms without knowing
    anything about blockchain technology.


    Remember that there will be some initial costs before you begin. A blockchain,
    usually `Ethereum''s blockchain`, powers NFTs. To tokenize your art, you''ll need
    to pay a network fee known as `gas`. During the development process, `Rarible`
    allows artists to mint NFTs on the blockchain (on-chain). As a result, the prices
    will be lower in the future. `Rarible` is your best bet if you intend on selling
    a few NFTs for astronomical prices. You can use `OpenSea`''s Collection Manager`,
    on the other hand, if you want to make a large number of inexpensive NFTs. Users
    can create a new set with `OpenSea Collection Manager` for a one-time fee. The
    `OpenSea` centralized team can build and store an infinite amount of NFTs off-chain
    before a sale is made using that set. Your NFT will be put on the chain and transferred
    after the buyer pays the transaction''s `gas tax`. This will guide you through
    the steps to make your own NFTs in an `OpenSea` set.


    ## 1st Step — Setup MetaMask


    Setting up a software wallet is the first step in creating your own NFT. You''ll
    need to use this wallet to store your NFTs and to pay blockchain gas fees. Go
    to `metamask.io` to get the software or install the chrome extension. It is fast
    and free to create a `MetaMask` wallet. Only keep hold of your `seed phrase` in
    case you need to retrieve the wallet in the future. Keep in mind that wallets
    do not store cryptocurrency or NFTs; rather, they store your `private key`, which
    is needed to approve transactions. Both cryptocurrencies and NFTs are stored on
    the blockchain and the `wallet ID` is used to identify who owns what.


    ## 2nd Step — Tokenize Your Art


    You''ll be able to make your NFTs once you''ve set up a `MetaMask` wallet. Go
    to `opensea.io` and pick `Build` from the menu bar. You can now use `OpenSea`
    to link your `MetaMask` wallet. Click the `Add New Item` button after giving your
    NFT set a name. You can now upload the file you want to tokenize and allocate
    its properties and statistics to set it apart from the rest of your `array`. Establish
    a retail price after determining how many copies of each item you need.


    ## 3rd Step — Make A Marketplace Listing


    You must first authorize `OpenSea` to sell products from your account before you
    can sell your first NFT. You would have to pay a `gas tax` since this is a blockchain
    purchase. You''re good to go if you send any `Ether` to your `MetaMask`. This
    fee is only needed when you create an NFT collection for the first time. You can
    buy `Ethereum` on `Coinbase` or `Gemini` and send it to your `MetaMask` wallet
    if you don''t already have any. Start with `Benzinga''s` guide to buying `Ethereum`
    if you''re new to cryptocurrencies. Anyone can find and buy NFTs on the `OpenSea`
    marketplace now that you''ve granted `OpenSea` permission to sell them. It''s
    over!


    There are three key ways to generate NFT gains in the industry: scalping, investing,
    and trading. For most people, investing in a platform like `Nifty Gateway`, `OpenSea`,
    or `Rarible` is their best bet for cashing in on the NFT bubble before it bursts.
    The majority of miners went home empty-handed during the California gold rush,
    but those who sold picks and shovels made a fortune. It could be worthwhile for
    you to build your own NFTs for your fans if you''re an artist or influencer. Logan
    Paul, a YouTuber, and professional boxer made $5 million in one day by selling
    3,000 NFTs for one `Ether` each. NFT FOMO has hit new heights. If you have a knack
    for forecasting resale demand, pick up a $300 `Nifty Gateway` bot from `Upwork`
    and get scalping!


    NFTs also represent real and digital objects. The NBA, for example, is tokenizing
    clips of the greatest basketball plays in history and selling them for a fortune
    — and they get a 5% share of all secondary market sales — another advantage of
    NFTs for makers. Tokenized pictures of 24 x 24-bit avatars make up the `crypto
