    # 所有权认证


    土地所有权是当今世界最大的问题之一。你可以通过查看记录轻松发现某人是否拥有某些土地，但要证明你拥有这些土地并不容易。例如，假设你拥有的土地并想将其卖给他人。为了做到这一点，你需要处理大量的文件并遵循非常复杂的流程。不仅如此，你还要为出售土地支付昂贵的税费。而且这一切之后，无法保证买家以后不会从你那里偷走土地。这是因为大多数时候人们可以伪造文件并制作假证。


    那么，NFT 如何帮助解决这个问题呢？NFT 有潜力为土地所有者创建数字身份，任何人都可以区块链进行验证。此外，我们还可以将信息存储在不可伪造或不可篡改的账本。因此，如果你试图出售土地，任何感兴趣的人都可以通过检查记录来验证你对该土地的所有权。此外，你还可以向感兴趣购买的人展示数字身份来证明你拥有土地，这比出示文件要容易得多。随着越来越多的平台建立在
    `Ethereum` 之上，我们将看到更多 NFT 的应用。


    # 第十七章：NFT 的暗面


    到目前为止，本书已经讨论了 NFT 的所有巨大益处，但没有任何东西是完美的。万物皆有缺陷。如果没有负面影响，也就没有所谓的好处。现在是时候谈谈 NFT 的暗面了。NFT
    的一些缺点源于其目前的结构组件，例如生产 NFT 所需功率对环境的影响。其他弊端则更具个人化，例如可能导致的财务变化。在这里我们将全面探讨 NFT 的潜在陷阱。


    ## NFT 与碳排放


    当 NFT 热潮达到新高度时，许多人并没有意识到这种虚拟交易形式对现实世界产生了影响。原因在于 NFT 的处理方式。区块链处理的每一个 NFT 都会同时消耗多台计算机的计算和电力。这不仅为进行这些操作的人带来了巨额的电费，还由于这种能量消耗产生了巨大的碳足迹。正如你可能猜到的，许多人批评这是一种浪费且有害的实践。


    讽刺的是，即使像 `Joanie Lemercier` 这样相当活跃的环保活动家和艺术家也卷入了这场闹剧。Lemercier 以批评化石燃料的使用和挑战他人减少碳足迹而闻名，然而在他将一些
    `NFT` 放在区块链上后，没多久就有人指责他是“伪君子”！他的艺术非常受欢迎，在短短几秒内，他就通过几个不同的 NFT 赚了数千美元——唯一的问题是，这些
    NFT 的处理消耗了 8.7 兆瓦时的能量。为了直观，这相当于一个美国家庭一年的消耗——而这一切是在几秒钟完成的！不用说，对于承诺为减少排放贡献力量的人来说，这种情况并不乐观。


    NFT 碳排放的主要缺陷在于 `Ethereum` 区块链，它和 `Bitcoin` 区块链一样，依赖数据挖掘来验证网络上传的交易区块。要验证掉区块中的 NFT，必须执行若干“工作量”过程，这些过程需要大量的计算能力来求解方程。因此，消耗大量的电力来“证明”一个
    NFT 是它所声称的：一段原始且独特的数据（音乐/艺术/游戏或任何其他数据）。艺术界的一些人对这一事实感到非常不安，他们已经记录并尽尽努力进行平衡。


    这种努力的成果之一是艺术家 `Jason Bailey` 发起的所谓“绿色 NFT”倡议。Bailey 先生致力于寻找一种让 NFT 生产更环保的方法，即创建一种他所称的“赏金系统”，该系统为那些寻求减少
    NFT 造成的碳排放的人提供激励。即使是 NFT 先驱和 `CryptoPunk` 的创始人 `Matt Hall` 和 `John Watkinson`
    也参与了这一努力，签署成为“法官小组”的一员，评审参与者减少碳足迹的努力。然而，目前为止，该项目仅处于传播问题问题的初始阶段。尽管有从电力到太阳能和水能的大规模改造建议，但现实中，解决这一困境的更直接、更有意义的解决方案尚未出现。


    ## NFT 风格的资本主义会夺走游戏的乐趣吗？


    随着在线游戏的爆炸，任何游戏玩家都会告诉你，它最棒的一点是你可以探索几乎无止境的在线世界，在这些世界上几乎任何人都可以做或获得任何东西。在这些游戏中，玩家会找到各种物品来增强体验。例如，在一个剑与魔法的游戏中，玩家不可避免地会获得盔甲、剑、盾牌、魔法道具等。获得必要的经验并能够正确装备你的角色需要技巧和脑筋。


    但等等——如果未来你只需要钱呢？是的，想象一下吧。顶尖玩家的定义不再取决于他们的技能，而是取决于万能的美元——呃，嗯，加密货币。与其与术士战斗以获得一颗用来杀死敌人的龙牙，如果你可以直接用加密货币购买这个——或任何其他重要物品呢？随着
    NFT 让人们可以使用现实世界的货币购买游戏中的物品，这正成为一种日益增加的可能性。


    '
