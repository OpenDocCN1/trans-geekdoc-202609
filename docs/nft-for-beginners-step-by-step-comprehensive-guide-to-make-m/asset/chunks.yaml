    # NFT 的起源


    NFT 的诞生以一种奇特的方式自视频游戏宇宙。视频游戏已成为规模庞大、成本高昂且在技术上令人印象深刻的工程。几年前，视频游戏在资金投入上已经超越了你好莱坞（Witkowski,
    2020）。视频游戏的问题在于它们是一项极具风险的业务。你可以投入数亿美元，但项目可能会在一个规模巨大且竞争激烈的领域内完全失败。这些游戏消耗了多年的人工，而这些人因其技术专业工作获得了丰厚的报酬。


    从传统上来说，视频游戏的一个问题是，你把它们卖掉后就结束了。你花费时间和资源创造了某种东西，然后几个人购买了它们，接着项目结束，你必须开始新项目，并再次承担同样的风险。视频游戏制作工作室逐渐引入了让游戏长期盈利的方法。这种经营模式的先驱之一是一款尽管已经发布多年但今天仍被游玩的游戏。它被称为
    `Team Fortress 2`。这款游戏通过向玩家出售物理世界中不存在的东西来获利。实际上，他们是在为该游戏出售 NFT。


    在游戏中，你可能扮演一个拿着火箭发射器的角色。然而，如果你向制作游戏的工作室支付仅两美元的极低价格，你就可以为你的游戏角色获得一种不同的武器。拥有 `TF2`
    的工作室 `Valve` 有权在任何时间为每一个人提供他们想要的任何角色的任何武器或服装的副本。由于他们对游戏及其内容拥有绝对控制权，因此他们有权向其中注入稀缺性。


    随着这类游戏中的物品被赋予非常精确的稀有度，这个想法演变得更加复杂。有些物品极其难以找到，有些则只能在极短的时间窗口获得，这对数量和流通创造了自然限制。这些虚构物品可以在同样由公司拥有的市场中进行交易和销售，公司也能从每笔交易中获得抽成。其中一些物品可能是装饰性的，可能对游戏体验产生某种影响，而另一些仅仅是为了改变美学并让它看起来更漂亮。人们支付了巨额真实的资金来购买这些东西。这使得游戏在最初发布后的多年里都能保持盈利，因为他们不断向市场中引入新的虚构物品，并可以留住原有的团队继续积累该项目的经验，而无需将他们转移到完全全新的项目中。所以，从这个角度来看，NFT
    已经以某种形式存在了，并且已经让许多人赚了大量的钱。


    # 体育收藏品的重生


    这种新形式的数字资产为体育收藏品点燃了巨大的新热情。正如人们喜欢拥有某物品的签名版一样，这也是创建数字签名的一种。`Payton Manning` 可以拿出他的超级碗赛戒指，通过在它们附近挥动
    3D 扫描仪对它们全部制作 3D 数字化模型，然后出售这些 3D 模型。可能有人在这本书出版之前就已经想到了这一点并开始了类似的销售。`NBA Top Shot`
    在过去两年中通过出售 NFT 创造了 2.3 亿美元的销售额。一段 `LeBron James` 扣掉 `Nemanja Bjelica` 的短视频以 208,000
    美售出。人们正为这些东西支付着疯狂的数字。


    我们正在见证体育卡片的回归。它们可以像艺术版画一样，以有限供应的方式创建。你可能会发现一张艺术版画，上面写着小标记，说明它是 200 张中的第 7 号。这告诉任何看它的人，这种特定的印刷品只存在
    200 份，拥有它是稀有的事情。他们可以生产有限数量的 `Mickey Mantle` 数字卡片，可能只有几百张。这种资产可以像不久前孩子和大人交易棒球卡片那样，轻松地与其他人交易。而互联网市场则大不同，因为每一张卡片始终处于完好状态。


    这些资产还可以以有趣的方式与智能合约结合。例如，一张独一无二的 `Wayne Gretzky` 卡片可能让所有者有权在 `NHL` 在线商店出售的所有 `Wayne
    Gretzky` 商品享受折扣。一张卡片可能让所有者在比赛中获得佳座。增加这些功能也使卡片的价值远超了仅仅的收藏价值。


    NFT 可以整合到奇幻体育联赛中，作为一种通过交易卡片来交易球员的方式。它增加了实际功能。目前，来自 NFT 最重要的价值是其非不可替代性，但还有创建它的真实人物。一个开发并出售
    NFT 的未知艺术家无法指望它价值很高。来自俄亥俄州辛辛那提的牙科保健员 `Jeff` 不会因为他的名字在上面就拥有一个非常有利可的 NFT。一个极其成功且有名的人，例如政治家、艺术家或运动员制作的
    NFT，会赋予它巨大的价值。正如我们所说，NFT 是数字签名，而签名才是重要的。这对于许多名人来说将是非常有利可图的，特别是那些发展了深厚收藏品文化领域的名人。这意味着特别是体育和极客文化相关的属性，他们正在做的事情是非常明智的。


