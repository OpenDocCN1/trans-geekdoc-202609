    # 第 16 章：NFT 的未来潜力


    拥有所有权、可以进行交换和交易的数字资产的想法并不新奇。加密收藏品本质上是设计为独的数字资产，每个代币只能存在一个实例。这为收藏品创造了一个市场，用户可以在那里购买和交易这些代币。加密收藏品的未来非常光光，随着越来越多的用户进入市场，尽管在它们被视为主流之前，仍需要克服一些关键性的挑战。在这里，我们将讨论
    NFT 的未来潜力以及它们将如何改变世界。


    ## 实物商品效用


    实物商品效用是指你可以使用某物品并从中获取价值的想法。这就是为什么许多实物商品具有转售价值。例如，如果你拥有你房子的数字资产，你可能可以将其作为贷款的押品。只要物理资产存在，数字资产就有价值。需要注意的是，目前还没有任何数字资产提供这种效用；然而，这是加密收藏品获得如此受欢迎的主要原因之一。


    ## 非同质化加密收藏品是所有权的证明


    加密收藏品被设计为独特的代币，这意味着它们不能被复制或伪造。这创建了一种非常独特的数字资产，可以作为某些实物商品的所有权证明。例如，如果你拥有一个模仿你宠物猫的
    `CryptoKitty`，那么这个代币在世界上永远存在一个实例。你可以将这个代币作为你宠物猫的所有权证明；然而，没有理由你不可以将其作为其他实物商品的所有权证明。在未来，我们可以看到这种效用被用于艺术、黄金、房地产以及许多其他实物商品。在区块链上存储你对实物商品的所有权是一个非常令人兴奋的概念。将其视为数字遗产吧。当你去世时，你的数字资产将转移给合法的所有者，这也是证明你是某物品所有者的一种方式。


    ### 保护数字文字内容


    互联网上文字内容的问题是它们可以很容易被复制和分享。然而，通过 `NFT`，这变得困难得多。如果你拥有一个代表你文字内容的数字资产，你就可以将其作为所有权证明。例如，如果你拥有你写的一篇博客文章或文章的数字资产，你就可以证明它是你的，而且它世界上只存在一个实例。同样的原理适用于艺术品和音乐。只要代币代表艺术品或音乐文件的所有权，那么这个代币世界上只会存在一个实例。


    ### 艺术品或音乐


    为了让艺术品真正独特，艺术家必须专门为该艺术品本身进行设计。这意味着每一个方面都必须由艺术家自己设计，这意味着他们对区块链上存在多少实例具有完全控制权。他们还对未来如何使用它们具有完全的控制权（例如在市场上出售它们）。只要艺术家为某件特定的艺术品设计了他们的艺术品，并且每件作品彼此都是独特设计的，那么在区块链上永远只会存在一个实例。这意味着你可以证明艺术品的所有权，而无担心被他人复制。同样的原理也适用于音乐。如果一个艺术家创作了一首特定的音乐并录制了它，他们也可以证明对那首特定音乐的所有权。艺术和音乐的主要区别在于，为了让一件艺术品是独特的，艺术家必须专门为那件艺术品进行设计；而音乐则更多是关于在历史的特定时间录制特定的声音。这意味着如果你拥有代表你的数字内容的代币，你就可以将其作为任何从该内容获取价值的实物商品的所有权证明。


    ## 交易 NFT


    加密收藏品不仅被设计为代表所有权的独特代币，还被设计为可收集的物品。这意味着人们会收集它们是因为他们想要它们。这意味着人们会收集它们是因为他们想要拥有它们并建立收藏。


    ，人们将通过繁殖 `Cryptoitties` 来建立收藏，并在交易所将其交易以换取 `ETH` 或其他货币。这就是为什么许多人们认为加密收藏品未来将成为主流。随着越来越多的用户进入市场，这将产生巨大的需求。未来，我们可以看到购买
    NFT 的价值转变，这类似于人们收集收藏卡或稀有硬币的方式。但在这发生之前，还有许多挑战需要克服。


    ## 解决数字伪造问题


    `NFT` 有潜力创建一个某种数字图书馆。你可以将你的音乐、艺术、书籍和收藏品存储在一个数字图书馆中，那里没有人可以伪造它们。只要你拥有该数字资产，没有人就能从你那里夺走。这是
    NFT 试图解决伪造问题的许多方法之一。例如，假设你拥有一个稀有的《权力的游戏》并想把它卖给某人。通过 NFT 的帮助，你可以将关于你数字资产的所有信息存储在安全的区块链上并卖给他人。此外，你还可以通过将其存储在数字图书馆来验证你数字资产的真实性，让其他人看到你是该数字资产的所有者。这是实物商品无法实现的。


    ## 解决数据所有权问题


    `NFT` 的另一个潜在用例是解决数据所有权问题。现在，许多中心化公司如 `Facebook`、`Google` 等拥有并存储我们的数据。即使我们想摆脱它们作为服务提供商，它们也不让我们访问自己的数据。例如，如果我正在使用
    `Facebook` 或 `Google` 服务，我对这些公司从我这里收集并为了其利益的数据没有任何权利（为了投放广告）。因此，他们在未经我的同意或知情的情况下收集我的个人信息，如位置历史、浏览历史等（非法）。但是，NFT
    可以帮助我们解决这个问题。我们可以创建自己的网站、博客或其他数字资产并存储在去中心化的平台上。然后，我们可以将这些数字资产卖给其他人。一旦交易完成，没有人能从你那里夺走你的数据。所以，如果你在使用
    `Facebook` 或 `Google` 服务，你不需要让他们访问你的数据（你也不需要向他们付费）。相反，你可以使用他们的服务并通过将你的数字资产卖给他们来获得报。这是我们尚未看到的
    NFT 的潜力。随着越来越多的平台建立在 `Ethereum` 之上，我们将在未来看到更多 NFT 的应用。


    '
