    \ can be implemented in a massively scalable, \"unstoppable\" manner, but we live\
    \ in a hybrid environment for the time being. \n\nAbstracting the Chain Away Many\
    \ ventures embraced the idea of \"abstracting away the blockchain\" in 2018 and\
    \ 2019, offering a centralized wallet with username-password protection to conceal\
    \ all the functionality of NFTs from users. This was a novel approach as it enabled\
    \ the same seamless onboarding as centralized applications. The issue was that\
    \ the NFT environment (digital worlds, wallets, and markets) had lost interoperability.\
    \ We've discovered that projects that integrate with the established NFT ecosystem,\
    \ even if it means sacrificing some usability in the short term, are more appealing\
    \ to the present group of early adopters. \n\nNFTs and Copyright The issue with\
    \ how NFTs are represented is that people appear to equate them to the world of\
    \ copyright, implying that the NFT grants you some kind of ownership over the\
    \ visual art for which you acquired the token. In reality, this isn't the case\
    \ because NFTs don't grant anyone any rights to the visual art; instead, they\
    \ serve as proof that you \"own\" the original virtual piece. Even though you\
    \ \"own\" the art, the final copyright owner retains control over its allocation.\
    \ Do you truly own anything with all that in your head? Both yes and no. The NFT\
    \ is your receipt for the virtual artwork, but it doesn't offer you any additional\
    \ rights, particularly under copyright. Only if the artist sells it to you together\
    \ with the NFT, the artist retains such rights (and in most cases, they will not\
    \ do so). People or corporations could theoretically claim an NFT on assets that\
    \ are not their own, robbing monetary benefits from artists that don't know or\
    \ care to do so. This might result in a wider distribution of works from these\
    \ \"authenticated\" copies, which would be harmful to the artist, including the\
    \ above financial loss from a missed chance to sell a legitimate NFT to your works.\
    \ Artists will be able to bring copyright infringements against the sale of any\
    \ NFTs (and the potential distribution of their works). NFTs appear to be cruising\
    \ the cryptocurrency craze, but one should be cautious and know what NFTs truly\
    \ imply in terms of possession, as well as the consequences for copyright. While\
    \ it might be great to \"own\" a \"signed\" copy of a piece of virtual artwork\
    \ when you acquire an NFT, its drawbacks are just that; it's a way to show that\
    \ you have ultimately acquired the genuine article, but that's it. "
