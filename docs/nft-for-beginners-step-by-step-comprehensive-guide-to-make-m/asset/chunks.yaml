    # 你必须规避的 NFT 骗局 常见的加密货币诈骗


    如果你落入这些 NFT 骗局，你将失去努力工作来的一切。想象一下你访问了一个通过 Google 搜索到的 `MetaMask` 链接，结果发现它是一个钓鱼链接；你将立即失去存入那个虚假钱包的所有资金。对于
    NFT 艺术家来说，类似的情况甚至更加糟糕。


    在 NFT 艺术世界中，你需要建立声誉，而你的声誉与你的地址直接挂钩。例如，在 `Rarible` 的首页，你会看到过去 30 天内销量最高的卖家与其地址关联在一起。假设你已经建立了声誉，一直非常努力，并进入了过去
    30 天的畅销者名单。然而，突然之间，你的钱包被黑客攻击了，你再无法使用那个钱包。除非你是一个拥有百万粉丝，否则这非常难以重建。


    如果你是像马克·库班（Mark Cuban）那样的人，且你的钱包被黑了，你只需要去 `Twitter` 通知你的粉丝你的钱包被黑了，并附上新钱包的地址链接即可。但如果你是一个新秀艺术家，或者只是刚进入
    NFT 领域，你可能已经工作和拼搏了一多年，建立了声誉。突然之间，你创建的地址以及与该地址绑定的声誉面临了风险。你无法再次使用那个钱包，情况甚至更糟。


    涉及到 NFT 时，你可以设置版税，因此如果你创建了艺术品并为每次 NFT 的转售设置了 10% 或 20% 的版税，这些版税将返回到创建该 NFT 的钱包中。所以，如果你创建了一个钱包、建立了声誉、出售了
    NFT，并且正在获得这些版税的版税，这些钱会回到原始钱包。如果你的钱包被黑了，或者你落入了这种钓鱼骗局，现在有人有了你钱包的访问权限，你再也无法使用它。你只能被迫放弃。


    ## 通用的加密货币世界


    这只是加密货币世界发生的情况的一小部分。加密世界充满了诈骗。哪里有钱，诈骗者就会去哪里。加密领域的生态系统充满了资金。还有可能发送到你邮箱的钓鱼链接。你可能会收到来自“Ledger”的诈骗邮件，说你的钱包被锁定，并要求你提供
    12 个词或 24 个词的助记词。永远不要分享你的助记词！永远不要！你在加密货币中唯一使用助记词的时刻是你自己初始化的时候。记住，你才是创建或恢复 Ledger
    钱包或其他钱包的人。


    所以，当你收到邮件时，它很可能是一个骗局。这种情况也可能出现在交易所中，例如 `Coinbase`。虚假邮件看起来像是来自 `Coinbase`，说你的账户被锁定，请更改密码并点击此链接继续。这是一个钓鱼骗局。所以，每当你收到一封邮件，如果不是由你发起的，请务必保持警惕。如果你确实收到了
    `Coinbase` 等网站的消息，可能是真实的，但验证这一信息的方法不是点击他们发送的链接，而是按照你通常的方式进入 App。不要回复任何非你发起的邮件或链接。


    ## 加密货币赠送骗局“埃隆·马斯克”


    “埃隆·马斯克”加密货币赠送骗局已从受害者手中盗走了至少 587,000 美元。这种类型是最常见的加密货币诈骗之一，通常出现在 `Twitter` 和 `YouTube`
    等社交媒体平台上。


    ### 它们是如何运作的？


    黑客会冒充或入侵知名公司或公众人物，并声称正在赠送加密货币。如果你想参加这些赠送，必须先向他们宣传的地址发送一定数量的加密货币。他们经常承诺返回你发送给他们的金额的双倍、三倍甚至更多。他们想让你觉得如果不这样做，就会错过一个巨大的机会。


