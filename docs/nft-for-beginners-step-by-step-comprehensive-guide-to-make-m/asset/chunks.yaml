- fmt: "\n# Demand Drives Scarcity\n\nThere was an assumption in the early days of\
    \ the non-fungible token community that users wouldn't worry about NFTs' observable\
    \ scarcity and would hurry to purchase them just because they were on a blockchain.\
    \ Instead, we assume that demand is affected by more conventional factors such\
    \ as utility and authenticity. \n\nThe clear one is utility: I'll purchase an\
    \ NFT ticket if it helps me to attend a meeting; I'll buy a work of art if I can\
    \ view it in a digital world, and I'll purchase an object if it grants me unique\
    \ skills in a game. The idea of authenticity encapsulates the tale behind an NFT.\
    \ What was the source of it? Who has owned it earlier? The stories of fascinating\
    \ NFTs become more nuanced as the field matures, and they begin to have a meaningful\
    \ effect on a token's value.\n\n## NFTs, Software-Generated Serial Number\n\n\
    An NFT is simply a software-generated serial number. “`this token ID`” belongs\
    \ to “`this address` according to the same software. However, there is no way\
    \ to check that the `token ID` is connected to the virtual asset (`JPG`, `MP4`,\
    \ etc.) because the `token ID` does not contain a hash of the virtual asset, and\
    \ the digital asset does not contain a verifiable digital signature. You just\
    \ have the issuer's word that they're related. NFTs are, at best, a form of \"\
    blank virtual proof\" in which the blank can only be completed and assented by\
    \ a third-party issuer. \n\nAt the very least, NFTs would be the virtual similitude\
    \ of autographs*` if the creator verified them. At least one site appears to deliver\
    \ autographed digital content (tweets), but it's unclear precisely what a digital\
    \ signature is or how to validate it before purchasing the NFT objectively. The\
    \ \"signature\" tends to be an acknowledgment that to sell a tweet, you should\
    \ connect to the `cent/valuables` site using your `Twitter` details, indicating\
    \ that the operator of the `Twitter` account initiated the sale process. It appears\
    \ to me to be unreliable, as I expected an authentic digital signature incorporated\
    \ in the token that can be checked with a public key. If this flaw is verified,\
    \ the `cent/valuables` token should resemble an \"unwashed worn sweatshirt,\"\
    \ suggesting that there is some sort of personal \"connection\" between the creator\
    \ and the token (though it is not a digital signature).\n\n## NFTs Aren't Decentralized\n\
    \nPeople could potentially mint their tokens and use \"suitably\" decentralized\
    \ sale and discovery services via trusted open-source clients. Nevertheless, in\
    \ the case of `Nifty` and other networks, that's not the case. A third party oversees\
    \ the minting operation (the \"main market\"). The third-party works as an agent\
    \ and takes a commission. It's possible that the third party is faking it, making\
    \ mistakes, or being hacked. This negates the initial advantages of using a decentralized\
    \ blockchain. \n\nThe same third-party oversees the reselling mechanism (also\
    \ known as the \"secondary market\"). In turn, peer-to-peer exchange of unique\
    \ items is not possible. You'll need a centralized forum where buyers and sellers\
    \ can meet and explore each other. To make buying and selling deals and connect,\
    \ they must first enroll on a third-party website. The public blockchain is only\
    \ used to keep track of transactions. An `SQL` database could store those serial\
    \ numbers, transactions, and users more effectively. You can be confident that\
    \ the NFT issuers' sites already store their details in `SQL` files, so why duplicate\
    \ the details and effort?\n\n## Wrap Up\n\nNFTs may be, at best, a form of \"\
    blank virtual proof\" in which the blank can only be completed and assented by\
    \ a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\nNFTs may be, at best, a form\
    \ of \"blank virtual proof\" in which the blank can only be completed and assented\
    \ by a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\nNFTs may be, at best, a form\
    \ of \"blank virtual proof\" in which the blank can only be completed and assented\
    \ by a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\nNFTs may be, at best, a form\
    \ of \"blank virtual proof\" in which the blank can only be completed and assented\
    \ by a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\nNFTs may be, at best, a form\
    \ of \"blank virtual proof\" in which the blank can only be completed and assented\
    \ by a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\nNFTs may be, at best, a form\
    \ of \"blank virtual proof\" in which the blank can only be completed and assented\
    \ by a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\nNFTs may be, at best, a form\
    \ of \"blank virtual proof\" in which the blank can only be completed and assented\
    \ by a third-party issuer. At the very least, NFTs would be the virtual similitude\
    \ of autographs* if the creator verified them. \n\n### Assets with Smart Contracts\n\
    \nThere was an illusion that because a smart contract was implemented, properties\
    \ be retained indefinitely. There will come a time when decentralized applications\
    \ can be massively scalable, but we live in a hybrid environment.\n\n### Abstracting\
    \ the Chain Away\n\nMany ventures embraced the idea of \"abstracting away the\
    \ blockchain\" in 2018 and 2019, offering a centralized wallet with username-password\
    \ to conceal all the functionality. The issue was that the NFT environment had\
    \ lost interoperability.\n\n### NFTs and Copyright\n\nThe issue with how NFTs\
    \ are represented is that people appear to equate them to the world of copyright,\
