    \ Your NFTs Enough It is just not enough to create your NFTs and list them on\
    \ OpenSea and expect the money to start rolling in. There are already millions\
    \ of NFTs listed on OpenSea and most of these are struggling to find buyers. \
    \ Forget about the “build it and they will come” concept. It is not going to happen.\
    \ You need to create a marketing plan and then stick to it. Identify who your\
    \ target audience is and then find out where they hang out.  Use social platforms\
    \ to leverage your NFT promotions. Use Discord forums, Clubhouse, and Reddit to\
    \ your advantage as well. Do whatever you can to get the word out about your NFTs\
    \ and the talents you have. Some people might get lucky with their NFTs. They\
    \ may list them on OpenSea and sell them quickly and have people begging for more.\
    \ Instances like this are very rare. You cannot count on this kind of luck, so\
    \ be sure to have a promotional plan and follow through with it. \n\nChoosing\
    \ the Wrong Marketplace for Your NFTs This is another classic mistake we see over\
    \ and over again. NFT creators cannot be bothered to do the necessary research\
    \ and they just opt for OpenSea because it is the biggest platform. Yes, OpenSea\
    \ does get a lot of visitors (nearly 40 million a month and growing), but this\
    \ does not mean it is the best platform for your NFTs. There are several things\
    \ you need to find out about an NFT marketplace before you use it. The most important\
    \ thing is knowing whether your target audience uses the marketplace or not. You\
    \ need to consider if the NFTs you want to create are a good fit for the ethos\
    \ of the marketplace as well. With several new NFT marketplaces emerging all of\
    \ the time, you need to ascertain whether the marketplace you are considering\
    \ using is safe. The size of the community in the marketplace is important, but\
    \ more important is whether the community is responsive and helpful. Unfortunately,\
    \ there are scam NFT websites already in existence. These people will just collect\
    \ fees from you to pay Ethereum for example, and you will never sell anything.\
    \ To avoid these scam NFT websites, use the Dapp Radar website to check for legitimacy.\
    \ \n\nDoing NFTs on the Cheap The more you can invest in your NFT venture, the\
    \ better. A lot of people make the mistake of thinking the world of NFTs is a\
    \ free one, and they can do everything on the cheap. While there are platforms\
    \ that do not have fees for listings, most of the best quality ones do, so you\
    \ need to factor this into your NFT budget. We have told you several times in\
    \ this book that the Ethereum blockchain network is, by far and away, the most\
    \ popular for NFTs. If you want to use the Ethereum network, then you are going\
    \ to have to pay gas fees.  You need to put some money behind your NFT marketing\
    \ as well. Unless you have a huge following on social media, you will need to\
    \ use social media ads to showcase your NFTs. This is a fairly inexpensive way\
    \ to achieve results pretty fast. While gas fees and listing fees may come down\
    \ as NFTs become even more popular, this cannot be guaranteed and you cannot rely\
    \ on this happening. If fees do come down in price, use the money you saved for\
    \ more marketing. You need to take your NFT journey seriously and be prepared\
    \ to invest in it for the maximum chance of success. \n\nCHAPTER 19:     Sports\
    \ and Esports in NFTs There is one place where nerd culture and jock culture overlap:\
    \ collecting. There was a very interesting and innovative video game available\
    \ in Japanese arcades some decades ago, called Sega Card Gen '10. The idea was\
    \ the following: it was a baseball video game where you would insert baseball\
    \ cards into the machine like you would a dollar bill into a vending machine,\
    \ and those cards would then create your lineup. You bought the cards just like\
    \ any other cards at any collectibles shop. Based on the baseball players' records,\
    \ the video game estimated the players' performance in the game itself. So, having\
    \ more accomplished players with better stats would help you win in the video\
    \ game. This genre still is popular in Asia, with perhaps the most successful\
    \ current form as Sangokushi Taisen. The potential of cards continues, but without\
    \ the actual physical object being necessary. You could, for example, combine\
    \ NFT trading cards with a very valuable video game property such as the MLB series,\
    \ and those collectibles would allow you to have a stronger team in the video\
    \ game. The game itself would incentivize the trading of players' cards. And for\
    \ people who have no interest in video games, it still increases the value because\
    \ as long as there are people who do play video games, they are willing to pay\
    \ for these sorts of things. "
