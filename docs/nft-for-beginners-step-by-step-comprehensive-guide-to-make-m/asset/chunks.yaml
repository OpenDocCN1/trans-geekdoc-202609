    NFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。


    NFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。


    ### 带有智能合约的资产


    曾有一种幻觉，认为因为实施了智能合约，属性就可以无限保留。未来去中心化应用可以实现大规模扩展，但我们现在生活在一个混合环境中。


    ### 抽象化区块链


    许多企业在 2018 年和 2019 年拥抱了“抽象化区块链”的想法，提供带有用户名和密码的中心化钱包以隐藏所有功能。问题在于 NFT 环境已经丢失了互操作性。


    ### NFT 与版权


    NFT 表现方式的问题在于，人们似乎将它们等同于版权世界，暗示 NFT 赋予了你对所获取代币的视觉艺术的某种所有权。事实上，事实并非如此，因为 NFT 并没有赋予任何人对视觉艺术的任何权利；相反，它们作为你“拥有”原作作品的证明。


