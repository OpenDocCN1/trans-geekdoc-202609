    # 历史与核心概念


    大多数书籍和文章都在讨论 NFT 的普及及其起源，通常从 `CryptoKitties`说起。但这个概念在更早就已经构思好了，因此现在我将带你开启那段旅程。让我们深入探讨
    NFT 的历史以及让这些 NFT 变成今天的核心概念。


    ## 比特币彩色币 (Bitcoin Colored Coins)

    比特币彩色币于 2012 年用于交易迷因艺术品。它们也被称为“中聪”（satoshis），这是比特币的最小单位，等于比特币的百分之一。它们还以比特币的创始人中本聪（Satoshi
    Nakamoto）的名字命名。这些彩色币当时仅限在非常小的圈子内使用，因此相对较不为人知。它们并没有持续多久，因为只有当每个人都认同某个价值时，它们才能代表价值。当无法达成共识时，这会导致严重的交易问题。


    ## Quantum (量子)

    一件名为 `Quantum` 的艺术品以高价售出。事实上，这件艺术品被认为是第一个 NFT。Kevin McCoy 和 Anil Dash 为数字艺术的存在创建了一个平台。他们在
    2014 年做到了这一点并展示了他们的想法，但并没有火起来。正因为如此，他们从未对自己的区块链想法申请专利，这也是为什么他们现在没有拥有这项技术。不过，他们并没有被忘记，Anil
    Dash 仍然活跃在加密货币和初创公司领域。他还不想将原始演示视频作为 NFT 出售。但 Kevin McCoy 已经准备好售出 `Quantum`，它的价值以及对技术和最终
    NFT 创建的帮助得到了认可。


    ## CounterParty (对手方)

    `CounterParty` 是 2014 年建立在区块链上的点对点金融平台。它处理迷因和卡牌交易。该公司的创建是因为创造者相信区块链技术，但没有想象到它将发挥多大的作用。当迷因开始出售时（从
    2015 年到 2016 年间的 `Pepe Frog` 开始），`CounterParty` 的用户开始增加。这促使这种迷因的稀有图像成为收藏品，人们非常愿意花费巨资来拥有一只稀有的
    `Pepe Frog`。正是这种人气说服了 `Force of Will` 的创造者在 2016 年在该平台上进行合作。`Force of Will` 是当时一种流行的交易卡牌游戏，他们需要一个销售卡牌的地方。这带来了另一一波销售热潮，最终展示了在网上便捷地买卖此类收藏品的价值。


    ## 以太坊 (Ethereum)

    `Ethereum` 创建于 2017 年，它不仅是一种加密货币，意义远于此。该公司因其功能而登上头条新闻，但随着 `CryptoKitties` 的发布，事情才真正开始快速发展。这是
    `Ethereum` 平台上的一个 NFT 游戏，允许用户使用区块链技术培育稀有的数字猫咪。该游戏的流行是 NFT 开始占据中心地位的催化剂。它是如此，以至于引发了大量的媒体关注，并在某种意义上，开始让更多人对在线收集产生兴趣。这催生了
    `CryptoPunks`，而现在根据你想要收集的内容，在各种市场平台上可以买卖的列表已是无止尽了。


    ## 碳排放问题

    NFT 需要大量的计算能力，因为它们是使用遵循 `proof-of-work`（工作量证明）协议的区块链创建的。这意味着一方向另一方证明他们完成了特定数量的工作。这是通过解决数学问题或交易来证明的。这听起来很复杂，事实也是。然而，所有这些求解都是在特定软件帮助下在后台运行这些方程的计算机完成的。通过解决这些方程，运行这些计算机的人或矿工将获得加密货币奖励，这就是让大量计算机一直运行的动力。交易以极快的速度解决，这导致在全球范围内建立了专门为此目的创建的服务器农场。服务器农场的发电主要由化石燃料驱动，因为它们大多位于电价廉廉的国家。这反过来产生了巨大的碳足迹，导致了许多对
    NFT 使用的抵触。这是许多人尽管 NFT 很流行但仍犹豫于创建和销售它们的主要原因。


    据报道，`Ethereum` 挖矿消耗的电量相当于爱尔兰整个国家，2018 年的一项研究发现，加密货币挖矿消耗的能量比开采黄金或铜还要多 (de la Garza,
    2021)。即使有这些研究，要准确计算 NFT 的碳足迹也是困难的，因为有许多因素需要考虑。运行这些计算机的区块链矿工遍在世界各地，因此很难确定在任何给定时间使用了多少能量。所以，目前无法确定每个
    NFT 的碳足迹。这并不意味着没有影响，或者它不是令人关注的原因。这是一个非常大的话题，特别是涉及到气候变化时。共识是所使用的电力必须是绿色的。加密货币公司对此表示同意，大多数公司都在做很多改变。甚至还有有些市场平台是绿色的并以此进行营销。一些公司也在研究一些解决方案，以更改货币的挖掘方式并大幅减少碳足迹。


    ## 绿色概念

    ![00007.jpeg](img/image_rsrc1TU.jpg)

    所有的挖矿都可以使用再生资源，但由于各种原因导致没有这样做。最大的原因是有许多国家使用化石燃料，且提供的电力非常廉价。这就是为什么许多服务器农场位于这些国家；由于挖矿的奖励是巨大的，关闭这些挖矿作业并强制它们使用太阳能或风能是困难的。`Ethereum`
    正在寻求用质押取代挖矿，这样消耗的能量要得多。一旦这一概念被应用，将节省 99.98% 的能量。(Ethereum, n.d.)。


    ## 权益证明 (Proof-of-Stake)

    我解释了 `proof-of-work` 协议是如何工作的，以及加密货币公司如何寻求用这种高能耗概念改为 `proof-of-stake`。但什么是 `proof-of-stake`？为了创建区块，交易仍然需要验证；这一点没有改变。但验证这些交易不需要巨大的挖矿能力，因为能量消耗很低。执行这些交易的硬件要求也很低；因此，低能耗使得验证者获得交易费用而非区块奖励，所以奖励是不同的、可扩展的，且不会促进大型矿场挖掘。它的原理是验证者需要质押一定数量的加密货币才能成为验证者。对于
    `Ethereum`，金额为 `32 ETH`，然后随机选择验证者来创建新区块或确认其他区块。使用这种验证类型的一个大安全优势是区块链不受 `51% 攻击`。这只有在矿工或矿池控制了网络
    51% 的交易解决能力并开始创建有利于自己的欺区块时才会发生。在 `proof-of-stake` 中，没有任何（即使是黑客）能够拥有 51% 的加密货币网络，即使他们拥有，攻击也没有意义，因为那也会损害他们自己的份额。


    ## 链外交易 (Off-Chain Transactions)

    链外交易是指发生在区块链之外的交易。它们可以通过将私钥交换到主流钱包或聘用第三方来完成。这就是 PayPal 为了履行其交易而所做的。链外交易可以立即完成，没有交易费，且安全性更高。但在某些时刻，这些交易需要被添加到区块链中记录在账本上。所以，这是有成本的，但并不巨大。目前这种最大的权衡是牺牲了信任度、透明度和去中心化，而这些正是区块链和加密货币创立的初衷。


    '
