- fmt: '

    - `NFT = Utility + Ownership History + Future Value + Liquidity Premium`


    Value is apportioned variably across these four factors based on the asset that
    the non-fungible token symbolizes. Traders may use this paradigm to determine
    whether a non-fungible token is worth investing in and by NFT creators to consider
    ways to raise the value of NFTs to draw users and traders. The main message is
    that NFTs open up a slew of new opportunities for both creators and asset holders
    to create value.


    ## Collectibles as Venture Capital


    Any collection purchased before a brand has been created should be considered
    an early-stage entrepreneurial investment (pre-seed or seed). Investing in collectibles
    before a firm is similar to investing in a `comp` before finding a product-market
    fit. You''re wagering on the creator, the subject, or both, becoming famous due
    to interest from a group of influencers. It''s even great if you''re an influencer
    yourself. In that instance, you''re a value-added `VC`.


    Scarcity must be considered when building a collection of collectible `VCs`. Complete
    scarcity would make the collectible class more appealing, and you must put your
    money into the reasonably uncommon products. In the event of a pre-brand collectible,
    there will be low market competition, similar to pre-seed and seed `VC`. Any comparisons
    that exist will impact current value, but they shouldn''t have too much of an
    impact on your overall appraisal of the collectible class. Anticipate a lot of
    zeros. You''re better off building a pretty varied portfolio, like with an early-stage
    startup, since most brands will never succeed. Therefore, the greatest hedge for
    any developing collection investment is to acquire things you love, not just those
    you anticipate will rise in value.


    ## CHAPTER 6: What Types of NFTs are Available?


    There are many different types of non-fungible tokens available, each with its
    unique purpose and value proposition. Tokens can be placed into four broad categories:
    tokens, collectibles, digital goods, notary services, and derivatives. All of
    these categories can be found on the Cryptassist exchange when it launches later
    this year. We will go over each one in more detail below.


    ### Tokens

    Tokens are the most basic type of NFTs; they represent something but have no use
    outside of that particular function. The best example is `CryptoKitties` — each
    token represents a unique cat, and you can breed them to create rare kittens or
    trade them with other players.


    ### Collectibles

    Collectible NFTs are similar to tokens but are often considered more valuable
    since they are only available in limited quantities. They usually have a narrative
    behind them that gives the token more meaning and value. Examples of collectibles
    include `CryptoKitties` (which have cute names like “The Goku” and “The Genesis”)
    and `Rare Pepes` (the frog memes that were created as a joke on Reddit). Collectibles
    can be further broken down into sub-categories depending on whether it’s digital
    or physical, while the most concrete example of a physical collectible is an in-game
    item for games like `Fortnite` or `Call of Duty`.


    ### Digital Goods

    Digital goods are essentially digital versions of collectibles. They are often
    short-lived items that have a defined quantity and have a finite supply. Examples
    of these include skins for `Fortnite` or games like `Candy Crush`, as well as
    rarer items like coins found in games like `Pokémon Go`, `Mega Man`, or `Hearthstone`.
    The most recent example of digital goods is `Crydee’s NFT Trading` with their
    `Denarium` version of the American Gold Eagles.


    ### Notary Services

    Notary service tokens are not limited to any particular object or digital product;
    rather, they simply represent the ability to act as a notary for something else.
    `Cryptassist` has already launched with notary services for two different areas:
    a notary service called “Everyone Can Notary,” which allows you to view and approve
    all documents submitted to the blockchain, and a notary service for banks that
    allows them to send electronic documents directly to the blockchain.


    ### Derivatives

    Like NFTs, derivatives are supposed to be more valuable than traditional financial
    assets. However, derivatives are unique in that they don’t represent an actual
    asset or exist on the blockchain. This means derivatives do not have any tangible
    value beyond their ability to represent an underlying asset (e.g., physical gold).
    On the other hand, traditional financial assets have value; however, the value
    of these assets is dependent on the stability of the financial market. The main
    use case for derivatives is as a hedge against price fluctuations in other asset
    classes. Currently, some derivatives being traded are futures and options; however,
    this space is evolving quickly, and traders are currently experimenting with some
    new concepts to create new derivative products.


    ## NFTs or Non-Fungible Tokens


    `NFTs` or `Non-Fungible Tokens` are a kind of digital collectible that can be
    purchased, sold, and traded on the blockchain. There are many different types
    of NFTs available today, but let’s dive into three of the most well-known:


    - `League of Legends Very Rare Skins` — These highly sought-after skins come with
    many in-game benefits for players. When you own one, you might be able to play
    as a different character than your own or access exclusive content. Some exclusive
    skins are only available by participating in a tournament.

    - `Cryptokitties` — `Cryptokitties` is an `Ethereum DApp` that uses `smart contracts`
    to emulate the ownership of unique digital cats. In the game, you can collect,
    breed, and trade your digital kitty to make new kittens or sell it to other players
    for `Ethereum`. The game has become so popular that at one point in December 2017,
    over $3 million worth of `Ether` was spent on kittens.

    - `Tetris Ultimate Drop` — This token gives you access to `Tetris ultimate drop
    mode`, which can be played on multiple devices like `Xbox One`, `PlayStation 4`,
    and Smartphones using a smartphone app. The game has over 20 million downloads
    in its lifetime, and it’s easy to see why there are so many Tetris fans out there.


    ## Who Is Behind NFTs?


    Now that you know what NFTs look like and how they are a type of digital collectible,
    let''s take a look at the key players in the space today:


    - `Coinsilium`: This company started as an investment firm but quickly transitioned
    into a crypto asset developer. They are working to combine the benefits of blockchain
    technology with traditional legal contracts, compliance, and asset management.
    They also have developed their NFT called `CoSi`.

    - `EverdreamSoft`: This is a game development company known for its game `Spells
    of Genesis` (`SoG`). The company has recently released its first blockchain-based
    `Trading Card Game` with an in-game marketplace. This allows players to trade
    they don’t want for in-game currency or other cards they might like.

    - `Enjin` (`www.enjincoin.io`): `Enjin` is a gaming community platform that gives
    game developers tools to create, manage, and promote their games. In addition
    to having an in-game currency system that can be used with games on the platform,
    they also have their `ERC-20` token called `ENJ`, which can be used for buying
    things within the `Enjin ecosystem`.

    - `Gameflip`: `Gameflip` is a marketplace where you can buy and sell video games
    for cryptocurrency tokens called `FLIPs`. You can also buy and sell in-game items,
    game keys, and digital downloads.

