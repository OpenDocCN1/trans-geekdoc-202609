- fmt: '

    # NFTs Are Passive Income Investments


    The bulk of the value for these types of tokens comes from the secondary market,
    where people can trade or sell them to others for cryptocurrency or other NFTs.
    This is why NFTs are more like a passive income investment as opposed to an expenditure
    like buying a share of stock that has a speculative value. Many different game
    development companies are looking to use blockchain technology to create unique
    collectibles; however, we’ve only highlighted three of the many out there today.
    It is easy to understand why they are so popular that they can be fun to collect,
    and they offer a passive income for their owners as well. Now that you understand
    what NFTs look like and how they’re used, let’s take a look at the key players
    in the space today.


    ## CHAPTER 7: How to Invest in NFTs?


    The cryptocurrency space is maturing, and there are now more avenues for you to
    purchase tokens than when it all began. If you’ve been considering entering the
    space, this will help navigate some of the less understood aspects that can trip
    newbies up in their pursuit of crypto riches. Non-Fungible Tokens (`NFTs`) look
    to create digital scarcity by tying each token to a particular unit in a game
    or another type of virtual world. They represent unique virtual items that have
    no intrinsic value. To be clear, `NFTs` are not tokens that represent shares of
    a company. Rather, they’re game-specific tokens that you can own and trade within
    a play-based world. Think of `CryptoKitties` in the same way; they’re digital
    breeding cards for digital cats in a digital world, but without any real value
    in the real world outside of what people are willing to pay for them. While you
    can buy tokens to use in a game, most `NFTs` are only traded on crypto exchanges
    and not used within the game itself. So, if you’re looking to play a game and
    get your hands on the tokens used as rewards in that game, I would recommend you
    look at the native token. That’s because most `NFTs` will be near useless once
    the project is completed. Now that we’ve covered what `NFTs` are and how they
    differ from traditional cryptocurrencies, let’s go through some of the ways that
    you can purchase (and potentially win) them. Note: this is by no means an exhaustive
    list of ways to purchase an `NFT`. These are just some of the most popular.


    ### Airdrops


    Oftentimes, `NFTs` are distributed via airdrop. An “airdrop” is when a project
    distributes tokens to users free of charge. Suppose you’re lucky enough to find
    one that isn’t heavily subscribed. In that case, you may be able to earn free
    tokens just for holding an existing coin (this happened recently with `OmiseGo`,
    where they distributed tokens for holding `OMG`).


    *   `NFT Tracker` — An awesome site that tracks all active and upcoming `NFT`
    projects. It’s updated regularly and lets you filter by airdrop price, deadline,
    and more.

    *   `Token Tracker` — A very simple site that only tracks airdrops but doesn’t
    have the filters of `NFT Tracker`.

    *   `CoinMarketCal` — Another great site to find upcoming crypto events like airdrops.
    The only downside here is that they don’t do anything special to differentiate
    between them as `NFT Trackers` does. They simply list everything they can find
    in reverse chronological order with no filters or stats.


    ### Buy It Now


    The most common way to purchase an `NFT` is through an exchange. You’ll likely
    be able to find the token you’re looking for on any of the major exchanges that
    support them. The majority of tokens are `ERC-721` compatible and, as a result,
    can be traded on the DEXes like `IDEX` and `ForkDelta`. However, you should double-check
    before making any trades to ensure that everything will work properly.


    ### A Few Tips for Trading NFTs


    *   **Check that the token is supported first!** The biggest frustration I’ve
    had is when I make my first trade and realize that the pair wasn’t supported.
    Check out your favorite exchange’s fee schedule and set an appropriate fee if
    you plan on making a lot of trades.

    *   **Read the fine print!** Many exchanges have restrictions on how you can withdraw
    `NFTs`, or they may require you to hold a certain amount of that token before
    requesting them. For example, `Binance` requires 100% volume of the tokens in
    your withdrawal to be from trades.

    *   **Don’t forget about special events!** There are quite often contests and
    giveaways to earn free `NFTs`, so make sure you follow the various communities
    for information on these as well.


    ### Create It Yourself!


    Finally, you can also create your non-fungible token. Many `NFTs` are `ERC-721`
    tokens (it’s a specific type of Ethereum token that is programmed to be non-fungible),
    and as such, you can follow the same steps used to create any other `ERC-721`
    token. Don’t let the scary term scare you off! It’s a fairly straightforward process
    — albeit time-consuming.


    ## Why Do I Need to Invest Time in Choosing My Wallet?


    It may seem like you do not need to think about the type of wallet you choose
    if you are only storing one cryptocurrency. However, there is more to an investment
    than just purchasing a single coin or token from an exchange. What you choose
    as far as a wallet for your coins will dictate what kind of services that particular
    wallet offers.


    *   **Exchanges** — For almost every token, there is an exchange that you can
    purchase or sell it on. Some exchanges offer a wide variety of coins while others
    focus on a few specific ones. A common type of exchange is a crypto to crypto
    (also referred to as “crypto to fiat”) exchange. These exchanges usually allow
    you to trade one cryptocurrency for another cryptocurrency or fiat currency (like
    `USD`).

    *   **Hardware Wallets** — Hardware wallets are physical devices that are designed
    with security in mind. They store your private keys offline and usually have several
    different security features built-in. Some of them also let you connect to the
    internet and exchange coins through a built-in app. A major downside here is that
    they only work with specific cryptocurrencies, so you may need more than one if
    you have investments in several ones.

    *   **Software Wallets** — Software wallets are software applications that store
    your private keys online and connect your computer to the internet. These wallets
    are not ideal for storing large amounts of cryptocurrency, but they allow you
    to use any coin on any exchange platform. This is the most convenient way to store
    cryptocurrency since there are no physical devices to store and manage.

    *   **Paper Wallets** — Paper wallets are paper copies of your private keys that
    you can print out. This is the safest way to store cryptocurrency and is the easiest
    way for new investors to safely store their coins. The only downside here is that
    paper wallets are not always immune to hacks, so it is important that you only
    use a trusted source if you plan on using one.

    *   **Hardware Security Modules (HSM)** — Hardware security modules aren’t always
    referred to as “wallets,” but they serve a similar function. They are often referred
    to as “private exchange keys” or “private keys” and similar terms. They are also
    sometimes referred to as “cold wallets” or “air-gapped wallets,” but hardware
    security modules do not store your private keys offline, so they are not technically
    considered to be cold wallets. own*   **Mist/Ethereum Wallet** — Mist and Ethereum
    Wallets are similar because they store your private keys online. Ethereum wallets
    also have a built-in exchange that allows you to swap between coins. However,
    they have to purchase their cryptocurrency.

