    # NFT’s Origins


    NFTs were born strangely out of the video game universe. Video games have become
    incredibly large, expensive, and technically impressive endeavors. Video games
    have eclipsed Hollywood in terms of money as of a few years ago (Witkowski, 2020).
    The problem with video games is they are incredibly risky businesses. You can
    spend hundreds of millions on it, and the thing can completely fail in an enormously
    large and competitive arena. These games take years of man-hours of people who
    are paid handsomely for their technical professional work.


    One problem with video games, traditionally, is you sell them, and then they are
    done. You spend time and resources to create something, then several people buy
    them, and then the project is over and you have to start on something new and
    take those same risks all over again. Video game production studios have slowly
    introduced ways to make games long-term profitable. One of the pioneers of this
    way of doing business was a game that''s still played today despite being years
    old. It''s called `Team Fortress 2`. This game makes its money by selling players
    things that don''t exist in the physical world. Effectively, they are selling
    NFTs for the game.


    In the game, you might be playing as a character who shoots a rocket launcher.
    However, if you pay the studio producing the game the low, low price of two actual
    dollars, you could have a different kind of gun for your character in the game.
    The studio owning `TF2`, `Valve`, has the power to give every single person a
    copy of any gun or costume for any character they want at any time. Because they
    have absolute control over the game and what''s in it, they have the power to
    inject scarcity into it.


    This idea has evolved even more as items in these kinds of games are given very
    precise rarity. Some are extremely difficult to find, and some can only be acquired
    during very small windows, creating a natural limit on the quantity and circulation.
    These make-believe items can be traded and sold in a marketplace that is also
    owned by the company, where they get a taste of every transaction. Some of these
    items might be cosmetic, they might have some kind of impact on the experience
    of the game, and some of them are just to change the aesthetic and make it look
    prettier. People pay very real money for this in vast amounts. This allows a game
    to stay profitable for years and years after the initial release as they introduce
    new make-believe items into their marketplace and can keep on the same staff with
    the same experience on this project without shifting them onto something completely
    new. So, when you look at it like that, NFTs have already been around in some
    form or another, and are already making a lot of people a lot of money.


    # Rebirth of Sports Collectibles


    This new form of digital assets has opened up a tremendous new enthusiasm for
    sports collectibles. In the same way, people enjoy having a signed copy of something,
    this is a way of creating digital signatures. `Payton Manning` can take his collection
    of Super Bowl rings, make a 3D digitized model of them all by waving a 3D scanner
    near them, and then sell those 3D models. Someone may have already thought of
    this and started similar sales before this book was even published. `NBA Top Shot`
    has made $230 million in sales in the last two years selling NFTs. A short video
    of `LeBron James` dunking on Nemanja Bjelica` sold for $208,000. People are paying
    crazy sums of money for these things.


    We are seeing the comeback of sports cards. They can be created with limited availability
    in the same way art prints are. You might find an art print with a little notation
    that it is print number seven of 200. This indicates to anyone looking at it that
    only 200 of this particular print exists, and it is a rare thing to have. They
    can produce a limited number of `Mickey Mantle` digital cards, with maybe only
    a few hundred in existence. And this sort of asset could be easily traded with
    others the same way kids and adults used to trade baseball cards not too long
    ago. And the internet market is quite a bit different because every single card
    is always in mint condition.


    These assets can also be bundled with smart contracts in interesting ways. For
    example, a one-of-a-kind `Wayne Gretzky` card might also entitle the owner to
    a discount on all `Wayne Gretzky` merchandise sold on the `NHL` online store.
    A card could entitle the owner to great seats at a game. Adding these features
    also increases the card''s value far beyond just collectability.


    NFTs could be integrated into fantasy sports leagues as a way of trading players
    by trading cards. It adds real function. At this moment, the most important value
    coming from an NFT is the non-fungibility, but also the real person who created
    it. An unknown artist who develops an NFT and sells it can''t expect it to be
    worth a lot. `Jeff`, the dental hygienist from Cincinnati Ohio, is not going to
    have a very profitable NFT just because his name is on it. An immensely successful
    and famous person, such as a politician or artist, or athlete who makes an NFT,
    gives it tremendous value. As we said, NFTs are digital signatures, and the signature
    is what matters. This is going to be very profitable for many celebrities, particularly
    celebrities in a field that has developed a strong culture of memorabilia collection.
    That means especially sports and geek culture-related properties are smart to
    be doing what they are doing.

    '
