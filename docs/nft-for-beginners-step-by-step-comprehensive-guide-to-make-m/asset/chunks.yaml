    # 第 13 章：NFT 的优缺点


    由于信息量庞大，我认为包含一个关于优缺点的章节可能会有所帮助，这样在你决定开始交易时就可以随手查阅。这绝不是为了阻止你利用加密货币领域迄今最大的机会。这仅仅是为了确保你在开始交易之前，已经做好了充分的准备并掌握了相关信息。这可以称是最后的检查，用以强化你想参与这一既令人兴奋又利润丰厚、且参与了技术历史事业的理由。


    ## 缺点


    ### 不可预测性

    收藏品的价格高昂，且从长期来看并不保值，因此由于这类交易具有不可预测的性质，它像是一场赌博。之所以如此，是因为它是如此新颖且令人兴奋，所以每个人想参与其中，尤其是投资者。这推高了价格，但尽管
    NFT 可以卖出高价，但价格已经回落。在某件作品上赚取百万收益并不有保证。对于任何新颖且令人兴奋的艺术品也是如此：每个人都涌入其中，流行程度使其变得昂贵。但这绝不是一个会破灭的泡沫，而是技术革命的开始，也是一种明智且无需大量体力劳动的赚钱新方式。


    ### 安全性

    如果输入信息错误或没有妥善保护密码，NFT 可能会被盗取或丢失。许多艺术家在不知情的情况下其作品被代币化，而目前尚不清楚在这一阶段如何收回所有权。然而，艺术界的伪造品情况也是如此。还存在艺术品来源被破坏的情况，这再次会影响一件艺术品历史的有效性。最安全的方法是遵守任何互联网交易的相同规则，因为这是其他在线支付中同样存在的问题。这并不是一种新型安全问题；它之所以被凸显出来，是因为每个人都需要确保他们遵循所需的协议，以保持他们的信息安全，从而能够安全地使用互联网。


    ## 优点


    ### 艺术家获益

    艺术家可以收取版税，并为他们无法被复制的作品获得报酬，这保证了艺术家能够得到照顾，且仿制品不会随处可见。作为一名 NFT 艺术家，这不仅是确保你的艺术作品被看到的良好方法，还能从每次转售中持续获利。这让实现热情的梦想并据此为生变得更容易。


    ### 将艺术带给每个人

    收藏品和艺术更具互动性和吸引力，有各种可以观察和欣赏的种类。NFT 正在让艺术收藏和欣赏成为每个人都能体验的经历。这就像是一场艺术和收藏品的复兴，拥有如此多的选择和新技术，令人兴奋。这正是现在及未来世界所需要的，希望它能够长久存在。


    ### 真实性

    所有权被添加到账本上并对物品进行验证，因此你可以保证获得价值不断增长的正品。区块链技术被整合到 NFT 的创建和使用中，因此交易被记录在账本上并追踪。所有权在每次销售中都会追踪。


    ### 易性

    NFT 很容易创建和出售，因为有许多市场可以选择，并有一系列功能和方便的分步说明可以遵循。这使得买卖加密数字艺术变得简单直接。


    ### 被动收入

    最后，交易 NFT 是获得被动收入的好方法。如果你是一个数字艺术家，你确实需要先创作一些东西铸造成 NFT，但投资回报足以让你不需要每天或每周都卖出一件作品。通过仅仅交易
    NFT，许多人在正确的作品即将走红之前低价买入，然后以更高的价格卖出，从而赚取数千甚至数百万。这归根结底取决于对市场正确趋势的关注。


    # 第 14 章：NFT 风险与诈骗


    ## 如何避免它们

    NFT 的炒作是真实的，许多热门项目已以数百美元的价格出售。虽然 NFT 领域如此令人兴奋，但我们也需要停下来并承认风险。正如 Garyvee 在推特上说的那样，97-99%
    的 NFT 项目将是赔钱，因此学习和保持耐心同样重要。我们还需要考虑并讨论这些负面因素。


    '
- fmt: '

    # NFT Major Trading Risks


    ## Buying A Replica

    We need to stop and think: are we getting the real deal? This is very similar
    to how traditional artworks. For example, if you have a `Picasso` that you feel
    is real, and everyone thinks it''s real, it will be worth millions of dollars.
    However, what happens when you have a professional come in to verify, and they
    find out that it is not real. Instantly that painting becomes worth five dollars.
    The same thing is happening in the NFT world; people do fall victim to this scam,
    and it’s likely will continue to happen.


    This account records showed hundreds of sales to buyers ranging from `0.116 Ethereum`
    to over `60 Ethereum` for a piece titled “NFT morons.” If you don’t want to be
    the morons, what you have to do is to look into the NFT you’re going to purchase,
    especially for those valuable ones. It''s not that hard. All you need to do is
    go to this piece and check its history: when it was sold, who placed the bid on
    it on all platforms.


    You may see that a fake account only has around `300` followers, but it’s no way
    for the real `Banksy` account to have this small number of followers. Let’s say
    if you’re a `King’s` fan, you can also search this account in the search bar of
    the platform. If any other profiles show up, you can also double-check or cross-check
    on social media. Almost all of these people with reputations have a reputation
    for a reason. They are probably going to be on `Instagram`, `Twitter`, `Facebook`,
    or all over. If you check those people’s social medial, you can probably find
    the link to their NFTs and bring you back to the same page you just found on the
    marketplaces. Now you can verify whether it’s the real NFT accounts. If you see
    something, and it looks to be too cheap and from a big artist, this is a red flag.
    If you come across a person of influence selling an NFT for `15 ETH`, pause for
    a second, go ahead, check the profile, the history, and cross-check with other
    social media.


    ## Liquid Market

    One of the biggest problems with the NFT market is that it is illiquid. When we
    look at the crypto markets, they are much more liquid, which means that when you
    buy crypto and things start going south, you can get out of your position or sell
    a quarter or all of it. However, in the NFT world, you cannot do that at the moment.
    It is an all-or-nothing sell.


    If we check crypto, it builds up support levels over time. For example, the `bitcoin`
    charts have moving averages, and we have a lot of data from the past to show us
    what range this crypto might be valued at. So, even if it starts to decrease,
    we can slowly get out of our position. But in the NFT art or gaming world, the
    prices for these NFTs have no support level. They can go from `$0` to `$100,000`
    just overnight.


    One crypto punk sold for more than `$700,000`, but if we check its history, we
    can see that it was only sold twice: it was sold for about `$2,000`, and then
    sold for about `$700,000`. Between these sales, there were bids, and this is how
    it got to this high price. It’s critical to check the NFTs’ value history. Is
    the NFT shot up overnight, or did it build value over time? It’s risky because
    if you pay `$1,000` or `$5,000` on an NFT and its market goes south, and you can''t
    just get out of your position. It is all or nothing under the illiquid market.
    When things go south, there are very few people that will want to buy your NFT
    that you paid thousands of dollars for. You might get nothing for that NFT. So,
    whenever you are going to purchase the NFT, go and look through the history to
    check the earlier sale prices, the bids, and the transfers.


    ![](image_rsrc1TW.jpg)


    Let’s look at this `CryptoKitty`; it was sold for `0.002 ETH` in `2018`, and the
    next sale is `600 ETH` in the same year, and we cannot see any support level of
    the prices here. Also, its prior bids were mostly around `0.2 ETH`. So, whoever
    paid `600 ETH` for this NFT is very likely to get stuck with it, and no one wants
    to buy it. Of course, it has the chance to be sold higher sometime in the future,
    but there''s a lot of risks and little reward. We''re risking putting money into
    an NFT that may not sell. So, it''s all about risk versus reward.


    When it comes to the NFT world, whether it is NFT art or game, it''s all about
    getting in early. It''s a lot more difficult now because it''s hard to predict
    which of these NFT collectibles and games will take off. It may be a little easier
    with NFT art since NFT art has a lot to do with reputation. When someone with
    a reputation sells NFT arts or collectibles, you already can predict that it likely
    will do well. For example, `Rick and Morty’s` creator, `Justin Roiland`, decided
    to sell NFTs on `Nifty Gateway`. In the beginning, his NFTs’ prices were only
    hundreds of dollars. If you were able to get in early, these pieces are selling
    thousands of dollars. It can still be risky when you''re getting in early since
    you don''t know if you''re getting your hands on something valuable.


    ## Wash Trades

    This happens when someone creates an NFT, lists it for sale, and then buys it
    back from themselves for a high price, creating the illusion that it is an NFT
    in demand. For example, if you see an NFT was sold for `500 ETH`, but when you
    check the history and find it was just created five days ago and now it’s sold
    for `500 ETH`, this is very fishy. For the real ones, if you go through the trading
    history, you will find that the real ones didn''t just go from zero dollars to
    `$1000` overnight. There are many offers along the way, and we''ll see that it
    will bid up the price. Also, if you ever see an account that is just having a
    ton of offers and sales from random addresses that no one can verify, it is likely
    a wash sale.


    In summary, be very cautious when you''re out there in this NFT world. When you
    are going to buy an NFT, make sure to check the history of the NFT and verify
    the creator.

