    # 第二章：NFT 是如何创建的？


    许多 NFT 是以太坊区块链上创建的，并使用 `ETH` 货币支付费用。但并不意味着这些 NFT 必须不断移动才能出售。NFT 存储在一个虚拟钱包中，该钱包随用户进入不同的平台，允许他们访问该钱包。


    你需要像 `MetaMask` 这样的应用程序，以便每个平台都能访问此钱包，从而确保买卖交易顺利进行。许多市场平台允许你在无需支付任何费用的情况下创建 NFT，例如
    `OpenSea` 和 `Mintbase`。大多数市场平台会向你收取称为“燃料费”（gas fees）的费用，作为 NFT 创建或铸造的成本。这些费用频繁变化，而且可能昂贵。但一旦支付了这些费用并将
    NFT 上传到网站，它就已完成创建并准备好出售。

