    # CHAPTER 3: How Does an NFT Work?


    Every non-fungible token consists of two parts. There is the token that lives
    on the blockchain, and then there is the asset itself, whether it''s a piece of
    digital art, a video, or any other kind of digital asset. Blockchains are grossly
    energy inefficient while they''re taking care of tokens and cryptocurrency alone,
    so the energy demands are part of the reason that digital assets are not stored
    on the blockchain along with the token that points to them. Any other token on
    the blockchain, such as `Bitcoin`, would be defined by its value rather than its
    unique characteristics. It''s the opposite with NFTs. They are defined by their
    unique properties rather than any innate value. The value of NFTs is that they
    are at the mercy of what people are willing to pay for them as are most collectibles.
    For example, if you bought a tweet that was minted as an NFT, that tweet would
    not be stored on the blockchain with the token. It would also remain on Twitter.
    However, if, for some reason, Twitter shuts down, your digital asset would go
    with it. The NFT you purchased would not bring it back, and there is no tangible
    asset to hold a claim to. Something else that happens is that unscrupulous individuals
    will mint copyrighted digital assets as NFTs and sell them. If you''re unfortunate
    enough to buy such a thing, and the government comes along and seizes the digital
    asset under the pretense of copyright law, your ownership of the token on the
    blockchain will not protect you. Still, this has not discouraged people from finding
    ways of monetizing NFTs, investing in NFTs, and collecting them as one-of-a-kind
    and unique items.


    ## The Question of What You Truly Own


    This is the part where logic and abstract thinking and philosophy all collide
    because it all depends on the virtual value and availability of the NFT. The value
    of cryptocurrency alone was hotly debated when it was a new thing. Many skeptics
    regarded it as imaginary money. After all, if you couldn''t hold it or put it
    in a vending machine, what case could you make that it was even real? It is a
    psychological rabbit hole you can go down into and never reach the bottom. Many
    concepts that people regard as concrete realities are just as intangible. Friendship,
    love, fear, or how about a marriage license? Does a marriage license guarantee
    your ownership of somebody else''s heart? The only thing the license guarantees
    is that you have some legal recourse when things don''t go as planned. The intangible
    realities represented by that license, things that cannot be governed or controlled
    by that license, are things that could be construed as not being real in the first
    place. But they''re very real to many people, and they build their lives around
    them. So just as a marriage license, a driver''s license, a hunting license, a
    business contract, or a deed to a tract of land, all point to intangible things
    that can''t be quantified, so a non-fungible token on blockchain points to something
    of value that a buyer or a collector could cherish very much. If it''s real to
    them, then it''s real enough. And as someone looking to get in on the NFT craze,
    if they''re willing to spend money on NFTs that you create, then it''s real enough.
    ![00006.jpeg](image_rsrc1TV.jpg)


    ## Blockchain


    Blockchain-based NFTs allow users to own digital assets. However, this ownership
    of digital assets is different than physical ownership because these types of
    assets only exist within specific, purpose-built contexts, such as marketplaces,
    games, and whatnot, making them more difficult to move, at least for now. When
    blockchain technology comes into play, it can provide a layer of coordination
    for digital assets, granting users’ ownership and permission to manage them and
    changing developers'' relationships with their assets. All of this is possible
    thanks to 6 key properties that set the rules for NFTs and represent the characteristics
    that make them unique.


    ### Standardization


    Standards serve to create a uniform set of rules that allow NFTs to integrate
    across platforms, to be interoperable, and to increase their utility value by
    extending their applicability. As with all types of technologies, standards represent
    repeatable and shared ways of operating within a context. Standards arise from
    the need to save time and resources by eliminating unnecessary processes and are
    universally recognized within the community. A reference standard is always necessary
    to ensure that everyone operates in a compliant manner. When tokenization of a
    digital asset takes place within blockchain, these tokens are enrolled through
    common, reusable, and inheritable standards. In other words, these are methods
    agreed upon and developed by developers that allow NFTs to operate in different
    ways. Each digital asset is represented differently — e.g., a game may represent
    its collection in an entirely different way than an event ticket. NFTs are based
    on a common, public system whose standards include basic features such as ownership,
    transfer, and access control. This means that several purchased NFTs can interoperate
    with each other within the same application if they are based on the same standard.
    Programmers can then create applications that use essentially the same code to
    have all tokens within a decentralized platform, such as Ethereum''s network.
    The three main NFT tokenization standards on the Ethereum blockchain are:


    - `ERC721`

    - `ERC998`

    - `ERC1155`

    '
