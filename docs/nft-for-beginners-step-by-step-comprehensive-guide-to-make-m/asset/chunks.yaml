    # 第 9 章：在哪里购买和投资 NFT？


    在正确的市场上出售你的 NFT 非常重要。在这里，我们将讨论一些最流行且最好的平台，你可以使用这些平台创建你的 NFT 并将其挂架出售。在做出最终决定之前，你必须了解每个市场可以为你提供什么。


    ## 自主型与精选平台


    你首先需要知道的是有两种 NFT 平台供你选择：


    - **自服务 NFT 市场**：当你使用自服务 NFT 市场时，你可以你可以创建任何类型的 NFT。这意味着你的 NFT 可以是像 `JPG`、`PNG`
    或 `GIF` 这样的图像文件、如 `MP4` 这样的视频文件、如 `MP3` 或 `WAV` 这样的音频文件等。使用自服务 NFT 平台的另一个优势是，你通常拥有创建版税的能力。版税是指当你的
    NFT 的原始购买者将其转让给其他买家时所收取的百分比。

    - **精选 NFT 市场**：在精选 NFT 市场中，只有获得授权创建或铸造 NFT 的艺术家才能使用。通常，你会在精选市场上找到最高质量的数字艺术 NFT，而不是更简单、质量较低的收藏品。


    ## NFT 市场的要求


    所有的 NFT 市场都会要求你设置加密钱包、在钱包中存入加密货币，并拥有该平台的用户账户。你需要加密钱包来存储你的 NFT，并支付给区块链网络等的任何挂架费用。大多数
    NFT 市场提供免费账户，你可以在其中创建你的代币。


    NFT 市场与不同的区块链网络合作。你需要检查某个 NFT 市场提供了哪些区块链网络选项。由于 `Ethereum` 区块链网络目前为止是列出 `NFTs`
    最流行的网络，你会发现大多数市场都提供对此的支持。某些 NFT 市场还会支持新兴的区块链网络，例如：


    - `Algorand`

    - `Binance Smart Chain`

    - `Cosmos`

    - `EOS`

    - `Flow`

    - `Hedera Hashgraph`

    - `Polkadot`

    - `Solana`

    - `Tezos`

    - `Tron`

    - `WAX`


    并不是所有的这些区块链网络都是互通的。有些是闭环的，例如 `Flow`。除非你想做一些除了数字艺术 NFT 之外的特殊事情，否则我们建议你使用 `Ethereum`
    区块链网络。


    ## 热门平台


    ### OpenSea

    他们声称是 NFT 市场上最大的（我们没有理由怀疑这一点）。在 `OpenSea` 上，你会看到不同类型的 NFT，例如：


    - 数字艺术

    - 域名（抗审查的）

    - 体育用品

    - 交易卡牌

    - 虚拟世界

    - 收藏品


    当你成为 `OpenSea` 的成员时，你可以购买、出售并寻找独有的 NFT，如 `ENS` 域名、`Axies`、`CryptoKitties` 等。对于上述提到的物品，`OpenSea`
    上有超过 700 个项目类别，以及诸如 `Ethereum Name Service` (`ENS`) 等其他项目。`OpenSea` 提供了一个铸造工具，你可以用它来创建系列和单个
    NFT。这是免费的，你不需要编写任何代码即可使用它。一旦你创建了 NFT，你就可以以固定价格出售它们，或者在 `OpenSea` 上为它们创建拍卖。


    ### Rarible

    `Rarible` 是另一个像 `OpenSea` 一样的自服务 NFT 市场。这个 NFT 市场是社区拥有的。社区成员可以持有 `ERC-20` `RARI`
    代币。如果成员在市场上活跃于买卖，`Rarible` 平台将用这种代币奖励他们。每周会有大约 75,000 个 `RARI` 分发。虽然 `Rarible`
    的重点是数字艺术，但他们允许成员铸造电影文件、书籍、音乐等的 NFT。`Rarible` 上的 NFT 创建者可以向平台上的任何人展示其挂架 NFT 的“预览”。完整的
    NFT 项目仅供购买者查看。在 `Rarible` 市场中，你可以看到每日畅销榜，可以让你的 NFT 出现在页面顶部，以便于吸引买家。你在 `Rarible`
    上创建 NFT 需要支付一小笔铸造费。你在这个市场上最高可以收取高达 30% 的版税。


    ### Mintable

    另一个著名的自服务 NFT 市场是 `Mintable`。在这里，用户可以交易艺术、照片、音乐、游戏资产等。`Mintable` 的独特之处在于它提供“无
    Gas 费”（gasless）铸造选项。`Mintable` 有三种不同的拍卖类型，分别是：


    - 定时拍卖

    - 传统拍卖

    - 现价购买拍卖


    `Mintable` 是基于以太坊的，只能使用 `Ether` 进行支付。NFT 创建者拥有 5% 的版税机制，当原始买将所有权转移给他人时赚取佣金。


    ### Nifty Gateway

    人们对 NFT 世界中的 `Nifty Gateway` 市场褒贬不一。它与其他所有 NFT 市场都不同，因为它允许用户使用信用卡支付。用户不需要拥有 `MetaMask`
    或加密钱包。`Nifty Gateway` 的目标是通过将中心化流程引入去中心化流程，让每个人都能使用 NFT。人们如此喜爱 NFT 的原因之一是因为去中心化。因此，`Nifty
    Gateway`并不是一个流行的 NFT 市场。


    ### SuperRare

    `SuperRare` 可能是最著名的精选 NFT 市场。`SuperRare` 旨在为其成员提供独一无二、稀有的限量版数字艺术。你需要获得 `SuperRare`
    的批准才能在其平台上铸造并挂架你的数字艺术。全球 NFT 交易者对 `SuperRare` 市场有许多赞誉。他们喜欢市场监管挂架行为，以确保只有最高质量的资产。


    ### Foundation

    `Foundation` NFT 市场旨在将 NFT 创建者、收藏家和加密原生用户聚集在一个特殊的社区中。`Foundation` 想要推动 NFT 文化，并声称它是新的创意经济。该市场专注于数字艺术。这是另一个精选平台。所有成员必须创建经过
    `Foundation` 管理层验证的。它是增长最快的 NFT 市场之一，交易额不断增加。当你在 `Foundation` 上铸造并挂架 NFT 时，你将在所有销售中获得
    10% 的版税。许多 NFT 投资者利用 `Foundation` 平台寻找新机会。他们购买 NFT 并以更高的价格出售。


    ## 小众 NFT 市场


    一些市场针对数字幻想足球牌和虚拟世界头像等小众 NFT。许多新的领域 NFT 市场不断出现，以满足增长的需求。最成熟的玩家是：


    - **Axie Infinity**：该市场为热门游戏 `Axie Infinity` 提供 NFT 卡通角色。该游戏允许玩家战斗、繁殖和交易被称为 `Axies`
    的数字宠物。有些人靠这个游戏生活。

    - **NBA Top Shot**：这是一个使用 `Flow` 的闭环小众 NFT 市场。在这里，用户可以出售和购买某些 NBA 精彩时刻视频的收藏卡牌。

    - **Sorare**：在 `Sorare` 小众 NFT 市场中，用户可以交易代表球员的虚拟卡牌。`Sorare` 是一款在全球范围内玩的幻想足球游戏。

    - **Valuables**：这个小众 NFT 市场专门从事推特推文的代币化。这是推特执行官杰克·多塞（Jack Dorsey）将其他的第一条推文作为 NFT
    出售的平台。

    - **Decentraland**：有一个小众市场供用户交易可穿戴、可穿戴物品和虚拟土地等游戏内物品。


