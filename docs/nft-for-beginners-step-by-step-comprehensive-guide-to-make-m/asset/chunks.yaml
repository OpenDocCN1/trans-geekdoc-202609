    # 引言


    “技术是真实的。影响也是真实且永久的。” 这是亿富级投资者、NBA 球队所有者马克·库班（Mark Cuban）的一番话，他正处于区块链和非同质化代币技术兴趣爆发的前沿。根据库班的说法，这种货币技术转变的影响是可衡量且持久的。一旦稳定下来，它将颠覆资金的投资、收集、玩耍和制造方式。无论是体育、娱乐、游戏、艺术、音乐还是时尚，非同质化代币都完美适用于任何行业或领域。在过去的几个月里，这项革命性的技术被讨论得越来越多，但并不是每个人都还了解它，它的潜力也尚未被完全想象。


    非同质化代币，更简单地称为 `NFTs`，是独特的数字资源。事实上，非同质化代币创造的是一种可验证的数字稀缺性，从而产生了独特的价值。那些对区块链、加密货币和代币有一定了解的人知道我们在说什么，并能够更好地理解这种技术。简单来说，你可以说同质化代币是由记录在
    `blockchain` 中的数字信息组成的，这些信息赋予了对象一种可识别为所有权的特定权利。代币本质上是防伪认证证书，而“同质化”指的是加密货币的可复制性和可交换性，例如
    2009 年创建的加密货币 `Bitcoin`，甚至是法定货币（美元、欧元、英镑等）。非同质化代币恰恰通过其非同质性——可区分的——也就是说，即它们的不可交换性。它们可以提供虚拟资产的独特表示，并且是真实、独特且加密的。


    例如，`.jpg` 文件中的图像可以被复制无数次，但代币不能，是代币本身赋予了图像价值，使其能够像最精美的艺术品一样被购买、出售和收藏。因此，购买的代币是媒体或数字作品的证明，而不是作品本身。因此，`NFTs`
    赋予了数字创作作品其作为物理作品所拥有的所有权利：稀缺性、真实性和所有权。这使得一个 `NFT` 如此与众不同。非同质化代币正在永远改变数字世界。这有点像艺术家为一个人创作了一件艺术品：许多人可能在网上欣赏它并赞赏它的美，但只有购买它的人才拥有所有权，包括转售并获利的能力。


    谈论 `NFT` 就像在提到一个正在指数级增长的平行宇宙。事实上，最近对 `NFT` 的描述使用了“狂热”和“泡沫”等词汇来描述现状。2020 年，`NFT`
    市场的交易量超过了 2.5 亿美元，是 2019 年的四倍，而且在本文写作时，它们仍在不断增长。这个世界迅速吸引了名人、国际艺术家、体育人物、数字创意人员、企业家、影响者以及许多人的关注。


    几个引人注目的案例在网络上流传。例如，很难不听说 NBA 的 `NFT` 平台 `NBA Top Shot` 如何将勒布朗·詹姆斯（Lebron James）的一段精彩扣篮视频以
    20.8 万美元出售，或者林赛·罗汉（Lindsay Lohan）如何将自己的照片卖出 5 万美元以上，并将收益捐给慈善。这些对非同质化代币产生兴趣的明星，通过使其进入主流并创造创额金额，让它们进入了焦点焦点。此外，`NFTs`
    几乎出现在每一个行业中，从商业和社交媒体到音乐、艺术、体育和娱乐。


    数字文件的独占性导致它们以数百万的价格出售。根据细粒化的价格分级原则，艺术家高价格出售他们最独特的作品，随后的作品以较低的价格出售。此外，`NFTs` 之所以伟大，恰是因为它们具有消除所有中间环节的能力：艺术家和买家以一种全新的方式建立直接接触。


    著名的合成器流行音乐女星、歌手 Grimes，也是知名企业家埃隆·马斯克（Elon Musk）的女友，她在最受欢迎的市场之一 `Nifty Gateway`
    上出售她的 `NFTs`，在不到 20 分钟内赚取了 580 万美元。该系列名为 `War Nymph`。它描绘了反乌托邦世界中拿着标枪、带有纹身和长精灵耳朵的有翅儿童。这位歌手先在推文中宣布了她的
    `NFTs` 拍卖，简单地写道：“进入虚空。”关于这个数字世界，她宣布：“数字领域让领域变得更稀缺、更珍贵。它提供了逃避和完美。有时我想要不完美，想要真实的生活。有时我想要完美。”


    和她一样，在音乐行业中，狮子乐队（Kings of Leon）最近也加入了这一狂热。他们在 `Yellowheart` 平台上发布了专辑 `When You
    See Yourself as an NFT`。该专辑以传统格式提供给所有人，但 `NFT` 版本的以 50 美元出售，每份都提供不同的福利：数字下载、演唱会门票和专辑的限量版黑胶片。通过这种方式，数字变成了物理，反之亦然，创造了独特且原始的供应。


    就在一多年前，推特创始人 杰克·多西（Jack Dorsey）也拍卖了他 2006 年首次推文的 `NFT`，推文内容是：“刚设置 Twitter”。它以
    290 万美元出售，并将收益捐给了慈善。他出售该 `NFT` 的平台是 `Valables by Cent`。如果连推特这样流行的平台创始人都进入了 `NFT`
    领域，我们可以假设那里很有潜力。


    # 第 1 章：什么是 NFT？


    2015 年，传奇说唱团体武当帮（The Wu-Tang Clan）产生了一个极其独特的想法。他们制作了一张只有一份的专辑。他们将其放在一个精美的盒子里。他们在拍卖会上将其卖给了出价最高的人。那张专辑被所谓的“制药兄弟”马丁·舒克里（Martin
    Shkreli）以 200 万美元购买。购买这张专辑带有条件：在发布 88 年之前，所有者不允许对其进行任何复制或分发。新所有者被允许客人听，但仅限于他们家里。这是一个极稀有的非同质化物理资产。武当帮的非正式领袖
    RZA 制作了可能是第一个真实的音乐非同质化代币。这是对 `NFT` 是什么的一个非常简单、清晰的例子。武当帮独一无二专辑 `Once Upon a Time
    in Shaolin` 与音乐 `NFT` 之间的区别在于，`NFTs` 以数字形式存在，分布在无数计算机系统中。


    '
- fmt: '

    # The Short Answer


    The first and best question you probably have is, what is a non-fungible token?
    Or even specifically, what does fungible even mean? Fungibility is the quality
    of a thing''s interchangeability and ease of replacement. A fungible thing is
    easily replaced with a copy. A non-fungible thing is not.


    Take an example like a mass-produced T-shirt. T-shirts are created off of an assembly
    line and most of them are the same. If your T-shirt rips, you can order another
    one and it will be completely indistinguishable from the one you owned before.
    Something that is not fungible would be something like an original piece of art
    by Magritte. An original item, something that is one of a kind, is as non-fungible
    as it gets.


    Now consider the following: that t-shirt that was replaced might not be fungible.
    If that t-shirt had a great deal of sentimental value to that person, it would
    be fungible for everybody else, but very non-fungible for the owner. What if it
    was an ordinary white undershirt that you can buy in packs of 10 for a few dollars,
    but you got that shirt at a Red-Hot Chili Peppers concert when the lead singer,
    Anthony Kiedis, took it off his body and threw it into the crowd, and you were
    the person who caught it. That makes it suddenly worth more than an ordinary shirt
    of the same design and manufacture. Now it has an experience attached to it, it
    has a celebrity attached to it. That shirt is more than just cotton fiber. That
    fungible shirt is now non-fungible.


    The penultimate form of fungibility is cash. Any $20 bill can be replaced with
    any other $20 bill, or replaced with two $10s or four $5s. The primary reason
    money was invented is because of this fungibility. Money is an exchange medium,
    a way of quantifying value and allowing people to exchange goods and services
    easily. Before cash, gold was the standard medium of exchange; something valuable
    that is easy to trade, difficult to forge, and nonperishable.


    Cryptocurrencies are also exchange mediums, like cash, but cryptos like `Bitcoin`
    and `Ethereum` are even more fungible than gold or cash. Any `bitcoin` is as good
    as any other `bitcoin`. They are perfectly fungible. Cash is only slightly less
    fungible because they have different serial numbers on them, and theoretically,
    you could be innocently holding a $20 bill that was stolen from a bank without
    knowing it. Trying to spend that bill with that serial number could lead to an
    uncomfortable conversation with the police through no fault of your own.


    We learned back in the days of Napster that data is infinitely replicable. When
    music was on discs, you had to pay money to print discs. You had to print the
    cover art, produce the plastic cases, and use trucks and boats to move all the
    parts and the final product between locations all over the world. When the final
    product went to market, there was limited shelf space. On the internet, a song
    in digital form can be copied hypothetically an infinite number of times and passed
    around to an infinite number of people, and the only cost is the server space
    and the electricity bill.


    Data of any kind is extremely fungible. As long as you can control the data from
    being corrupted, any copy of a song is replicable by an identical file, easily
    and cheaply.


    What cryptos do in general, and NFTs in particular is add scarcity to a digital
    world without scarcity. NFTs offer a new frontier of digital scarcity where one-of-a-kind
    digital assets exist and can be traded. That is the reason they have become a
    big deal and why reading this book is a good use of your time.


    ## Fungibility and Value


    To understand why NFTs and cryptocurrencies like `Bitcoin` and `Ethereum` are
    valuable, we have to talk about something a little abstract. We have to understand
    exactly what value is and where it comes from.


    To be short about it, value comes from us. Value comes from what humans want.
    Value does not exist outside of us. Value doesn''t exist intrinsically in things.


    Einstein''s great observation was that an object''s speed and direction in a space
    only makes sense in the context of other objects'' speed and direction. In a completely
    black void, it would be impossible to determine the speed or the direction of
    the object''s movement without other stuff like stars and planets to measure it
    against.


    Value and money work the same way. The value of a thing requires a comparison
    to other things. This sounds a bit heady right now, but this is much easier to
    understand than it seems at first.


    What is a bottle of water worth? 16 oz of reverse-osmosis filtered water in a
    plastic bottle costs more in Nevada than it does in Michigan (Wait, the original
    text says "Nevada" then "Michigan" - keeping original context).


    ## New Age of Digital Property


    Are you still confused about why someone would pay $69 million for a JPEG? This
    analogy should help you understand. Consider a famous painting like by Seurat.
    That''s the painting of all the people dressed up nicely and hanging out in a
    park, but if you get up close, you can see that the image is just dots. This very
    famous painting is in the possession of the Art Institute of Chicago and it is
    worth an estimated $650 million; considerably more than Beeple''s piece. You can
    find a JPEG of this French painting and download it for free. You could order
    a poster for around $20 and hang it on the wall. Yes, $20 for a copy. Not $650
    million for a copy. A poster print isn''t worth what the original is by a mile.


    Allow us to ask a stupid question and then answer it: Why is the original painting
    worth so much but a copy is worthless? Because it is the original. Consider a
    hypothetical, science fiction scenario. Imagine if there was a machine that could
    scan a painting and determine every exact brush stroke, then paint a replica,
    a perfect forgery down to the molecular level. The copy is so precise that the
    scanning machine couldn''t tell them apart. Let''s say this machine could produce
    thousands of these molecularly identical paintings in an assembly line. Logically,
    the paintings would all have the same value. They are the same. The only difference
    is that one is the original. That makes all the difference. The original painting
    would still be worth $650 million. The copies would be worth whatever slightly
    more expensive printed posters are worth.


    Where things come from matters. The T-shirt worn by Anthony Keitis is valuable
    for no other reason than he wore it. An NFT is valuable because of who made it
    or owned it.

    '
