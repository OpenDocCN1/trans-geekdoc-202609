    # 需求驱动稀缺


    在非同质化代币社区早期，曾有一种假设认为用户不会担心 NFT 可视的稀缺性，仅仅因为它们在区块链上就会急于购买。相反，我们假设需求受到更传统因素的影响，例如效用性和真实性。


    很明确的一是效用性：如果一张 NFT 票能帮我参加会议，我会购买它；如果我可以在数字世界中看到一件艺术品，我会购买它；如果一个物品能在游戏中赋予我独特的技能，我也会购买它。“真实性”这一概念涵盖了
    NFT 背后的故事。它的来源是什么？之前谁拥有过它？随着该领域日益成熟，迷人的 NFT 故事变得更加微妙，并开始对代币的价值产生有意义的影响。


    ## NFT，软件生成的序列号


    NFT 仅仅是软件生成的序列号。根据同一套软件，“`this token ID`”属于“`this address`”。然而，没有办法可以检查 `token
    ID` 是否连接到虚拟资产（`JPG`、`MP4` 等），因为 `token ID`并不包含虚拟资产的哈希值，而数字资产也不包含可验证的数字签名。你只能相信发行者的口言，认为它们是相关的。NFT
    最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。


    至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。至少有一个网站似乎提供带签名的数字内容（推文），但在客观购买 NFT 之前，尚不清楚数字签名究竟是什么，或者如何对其进行验证。“签名”往往倾向于一种确认，即要出售推文，你应该使用你的
    `Twitter` 详情连接到 `cent/valuables` 网站，这表明 `Twitter` 账户的操作者发起了销售过程。在我看来，这是不可靠的，因为我预想代币中会包含一个可以通过公钥进行检查的真实数字签名。如果这一缺陷得到证实，`cent/valuables`
    代币应该像一件“没洗过的旧运动衫”，这表明创作者与代币之间存在某种个人“联系”（尽管它并不是数字签名）。


    ## NFT 去中心化


    人们理论上可以铸造自己的代币，并通过受信任的开源客户端使用“适当的”去中心化销售和发现服务。然而，在 `Nifty` 和其他网络中，情况并非如此。第三方监督着铸造操作（“主市场”）。第三方充当代理并收取佣金。第三方可能会伪造、出错或被黑客攻击。这抵消了使用去中心化区块链的最初优势。


    同一个第三方监督着转售机制（也称为“二级市场”）。反之，独特物品的点对点交换是不可能的。你需要一个中心化的论坛，让买卖双方可以在那里见面并相互探索。为了达成买卖交易并建立联系，他们必须先在第三方网站上注册。公共区块链仅被用于跟踪交易。一个
    `SQL` 数据库可以更有效地存储这些序列号、交易和用户。你可以确信 NFT 发行者的网站已经在 `SQL` 文件中存储了他们的详细信息，那么为什么要重复这些细节和精力呢？


    ## 总结


    NFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。


    NFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。


