    # CHAPTER 16: Future Potentials of NFTs


    The idea of a digital asset that has ownership, which can be exchanged and traded,
    is not new. Crypto-collectibles are essentially digital assets that are designed
    to be unique, and only one instance of each token can exist. This has created
    a marketplace for collectibles where users can purchase and trade these tokens.
    The future of crypto-collectibles is very bright, with more and more users entering
    the market, although some key challenges need to be overcome before they can be
    considered mainstream. Here we will talk about the future potential of NFTs and
    how they will change the world.


    ## Physical Goods Utility


    Physical goods utility is the idea that you can use an item to derive value from
    it. This is why many physical goods have a resale value. For example, if you own
    a digital asset of your house, you can potentially use it as collateral for a
    loan. As long as the physical asset exists, the digital asset has value. It’s
    important to note that there are not any digital assets that currently offer this
    utility; however, this is one of the main reasons why crypto-collectibles have
    gained so much popularity.


    ## Non-Fungible Crypto-Collectibles are The Proof of Ownership


    Crypto-collectibles are designed to be unique tokens, which means that they cannot
    be duplicated or forged. This creates a very unique digital asset which can be
    used as proof of ownership for certain physical goods. For example, if you own
    a `CryptoKitty` that is modeled after your pet cat, then there will only ever
    be one instance of this token in existence. You could use this token as proof
    of ownership for your pet cat; however, there is no reason why you could not use
    it as proof of ownership for other physical goods. In the future, we could see
    this type of utility being used for art, gold, real estate, and many other physical
    goods. The idea that you can store your ownership of a physical good on the blockchain
    is a very exciting concept. Think of it as a digital inheritance. When you die,
    your digital assets are transferred to the rightful owners, and it’s also a way
    to prove that you are the owner of an item.


    ### Protecting Digital Written Content


    The problem with the written content on the internet is that it can be copied
    and shared with ease. However, with an `NFT`, this becomes a lot more difficult.
    If you own a digital asset that represents your written content, then you can
    use it as proof of ownership. For example, if you own the digital asset of a blog
    post or article that you have written, then you can prove that it is yours, and
    there is only one instance of it in existence. The same principle applies to artwork
    and music. As long as the token represents ownership of the artwork or music file,
    then there will only ever be one instance of this token in existence.


    ### Artwork or Music


    For the artwork to be truly unique, the artist must design it specifically for
    the piece of art itself. This means that every single aspect must be designed
    by the artist themselves, which means they will have complete control over how
    many instances exist on the blockchain. They will also have complete control over
    how they are used in the future (such as selling them on a marketplace). As long
    as an artist has designed their artwork for a specific piece of art and each piece
    is uniquely designed for each other, then there will only ever be one instance
    in existence on the blockchain. This means that you can prove ownership of the
    artwork without the risk of someone copying it. The same principle applies to
    music. If an artist creates a specific piece of music and records it, then they
    can also prove ownership over that specific piece of music. The key difference
    between art and music is that for a piece of art to be unique, the artist must
    design it specifically for that piece of art. Whereas with music, it’s more about
    recording the specific sound at a specific time in history. This means that if
    you own a token that represents your digital content, then you can use it as proof
    of ownership for any physical goods which derive value from this content.


    ## Trading NFTs


    Crypto-collectibles are not only designed to be unique tokens that represent ownership
    but are also designed to be collectible items. This means people will collect
    them because they want to own a large number of them and build up their collection.
    For example, people will buy `CryptoKitties` to build up their collection and
    add value to their collection by breeding them with other `CryptoKitties` or trading
    them on an exchange for `ETH` or other cryptocurrencies. This is why many people
    think crypto-collectibles will become a mainstream market in the future. As more
    and more users enter the market, it will create a huge demand for these tokens
    which could lead to an increase in their value. In the future, we could see a
    shift away from buying `NFTs` for their utility value, and instead, users will
    buy them as collectibles. This is similar to the way people collect trading cards
    or rare coins. However, there are still many challenges that need to be overcome
    before this can happen.


    ## Tackling the Issue of Digital Counterfeit Goods


    `NFTs` have the potential to create a digital library of sorts. You can store
    your music, art, books, and collectibles in a digital library where no one can
    counterfeit them. As long as you own the digital asset, no one can take it away
    from you. This is one of the many ways in which `NFTs` are trying to address the
    issue of counterfeit goods. For example, let’s say you own a rare copy of `Game
    of Thrones` and want to sell it to someone. With the help of `NFTs`, you can store
    all the details about your digital asset in a secure blockchain and sell it to
    someone else. In addition, you can also verify the authenticity of your digital
    asset by storing it in a digital library where other people can see you are the
    owner of that particular digital asset. This is something that cannot be done
    with physical goods.


    ## Tackling the Issue of Data Ownership


    Another potential use case for `NFTs` is tackling the issue of data ownership.
    Right now, many centralized companies own and store our data like `Facebook`,
    `Google`, etc. And they don’t give us access to our data even if we want to get
    rid of them as our service providers. For example, if I am using `Facebook` or
    `Google` services, I don’t have any rights over the data these companies collect
    from me and use for their benefit (to target ads). So, they are collecting my
    personal information like my location history, browsing history, etc., and selling
    it to third parties without my consent or knowledge (which is illegal). But, `NFTs`
    can help us solve this problem. We can create our digital assets like a website,
    blog, or any other digital asset and store them in a decentralized platform. Then,
    we can sell these digital assets to other people. Once the transaction is done,
    no one can take away your data from you. So, if you are using `Facebook` or `Google`
    services, you don’t have to give them access to your data (and you don’t have
    to pay them for it). Instead, you can use their services and get paid for them
    by selling your digital assets to them. This is the potential of `NFTs` that we
    haven’t seen yet. As more and more platforms are going to be built on top of `Ethereum`,
    we will see more applications of `NFTs` in the future.

