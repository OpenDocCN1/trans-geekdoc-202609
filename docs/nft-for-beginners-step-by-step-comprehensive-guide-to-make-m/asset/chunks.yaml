    # 第 12 章：NFT 与房地产


    以被称为 `Bitcoin` 的这种革命性数字货币形式为引领的区块链技术，代表了开发者在区块链技术之上构建新金融产品提供了前所未有的机会。这种新兴技术的一种应用就是用于房地产行业。基于区块链的货币为人们买卖物业创造了一种新方式，让他们不再受限于传统机构或银行的摆布。本文将探讨这些技术如何用于房地产交易，以提高透明度和效率，同时解决随着这些创新而出现的一些隐私疑虑。


    房地产由建筑、土地和其他实物资产组成。但对于大多数人来说，房地产的概念始于住房。正是这种特定资产激发了人们对这些技术的最大兴趣，许多人希望在能够使用基于区块链的交易服务后，以低价卖掉自己的房屋。区块链技术让我们有机会在真正的点对点层面上买卖物业。这意味着，我们不需要依赖大银行或昂贵的中介来提供这项服务。


    区块链技术为某些类型房产（如租赁房和停车位）的买卖开辟了新途径。通过这项技术，我们可以为卖方提供更高的回报，并增加对物业的需求，因为人们只会购买他们能够获利的东西。有一句老话：“如果你没有为产品付费，那么你就是产品。”这是我们在房地产交易中需要考虑的因素。


    区块链技术的推出在过去几年中是缓慢且渐进的，在房地产行业看到巨大变化之前，还有很长的路要走。全球的房地产开发商开始设计依赖区块链技术的创新，包括住宅和商业建筑。人们还希望将其他类型的资产整合到这个系统中。


    以太坊创始人 `Gavin Wood` 曾设想过未来房地产可以通过区块链技术进行交易。他那家专门开发 `Ethereum` 应用的公司 `Ethcore`
    设计了智能合约，帮助人们买卖物业，而无需向全世界展示他们的财务信息。匿名出售物业让那些可能对在网上展示自己的资产感到不适的人们能够进行销售，而无需披露过多关于他们自己或这笔私有资产的信息。


    ## 区块链在房地产中的益处


    首先，它让资产所有权的信息变得比以往任何时候都更加透明。现在，房地产行业存在许多问题。代理人会竭尽全力保护其客户的资产。结果是，没有单一的信息源可以告诉你关于你的物业价值及其值多少的所有信息。这使得人们很难、甚至不可能通过报纸或在线分类网站等传统渠道出售他们的物业。


    房地产市场信息的匮乏迫使许多房地产开发商创建了网站，通过其网站发布大量数据。问题是，这些海量数据对于可能没有时间筛选所有信息的普通人来说太困难了。


    一种解决方案是使用区块链技术。通过使用这项技术，任何卖方或买方都能够准确看到物业购买价格如何随时间变化。买方还能看到他们预计从物业中获得的收入，以及卖出后需要需要的任何税费。区块链技术还允许微支付，这意味着人们可以买卖小型物业区域，如停车位和储物柜。


    ## 挑战与未来展望


    房地产行业就像是西部西部。它充满了犯罪分子、腐败和贿赂。区块链并没有让任何事情变得更容易；它只是提供了帮助反击这些问题的工具。债券和衍生品是人们每天处理的金融工具。它们被大型公司用于出售承诺未来回报的证券来筹集资金。区块链技术的引入使这一过程更加高效。


    许多商人士想参与区块链开发，但他们不确定它是如何运作的。关于这项技术仍然存在一些误解，在将其应用于房地产行业之前需要解决这些问题。对于那些想在其之上构建金融产品的人来说，了解这些技术是如何运作的。。区块链技术的潜力让债券比以往任何时候都更加透明和高效。房地产行业也一样，但在看到这项技术被完全整合之前还需要几年时间。如果你想从基于区块链的资产中获利，你应该在早期购买它们。一旦它们上线，投资者可能会抢购并投入资金，从而大幅推高这些资产的价值。


    另一个严重问题是验证某些物业的所有权有多困难。例如，在许多司法管辖区，法规管理着产权的转移。这些法规旨在确保人们不会在不交税或通过其他非法方式的情况下出售房屋。区块链技术为人们提供了一种买卖物业而无需担心税的方法。这对于政府不够稳定或正在与财务问题斗争的国家特别有帮助。


    使用这项技术，房地产开发也将变得更加容易。在大多数开发商眼中没有价值的闲地可以用来确保所有政府员工在月底领取工资。房地产市场对全世界的人来说都至关重要。在区块链技术之上可以构建许多不同类型的产品，但还没有一个开发出来。要让这项技术突破，它必须整合到公众已经在使用的产品中。


    大部分，这些将是构建在区块链技术之上的房地产相关技术。人们想要安全地购买房地产，但该行业存在许多欺诈。现在，这是人们卖物业最常见的方式之一。相比之下，区块链技术可以帮助所有者免受欺诈。所有的交易都记录在公开的数据库中，在不被发现的情况下无法更改。这防止了欺诈的发生，也让人们出售假物业变得极其困难。


    '
- fmt: '

    # CHAPTER 13: Pros and Cons of NFTs


    Since the information is vast, I thought it might be helpful to include a segment
    on pros and cons so you have one handy when deciding to start trading. This is
    by no means a way to prevent you from wanting to take advantage of the biggest
    thing in cryptocurrency to date. This is merely to ensure that you are fully equipped
    and well informed before you start trading. It is a final check, as it were, to
    reinforce the reasons for wanting to be part of something exciting and very profitable,
    and also part of technological history.


    ## Cons


    ### Unpredictability

    Prices are high for collectibles and don’t hold value in the long term, so it
    is a gamble due to the unpredictable nature of this type of trade. This is happening
    because it is so new and exciting, so everyone wants to be a part of it, especially
    investors. This is pushing up prices, but even though NFTs can sell for a lot
    of money, the prices have come down. It is not always a guarantee to make millions
    on a piece. The same can be said about any artwork that is new and exciting: everyone
    rushes in to be part of it and the popularity makes it expensive. But it is by
    no means a bubble that will burst, just the start of the technological revolution
    and a new way to make money smartly and without a lot of hard labor involved.


    ### Security

    If details are entered incorrectly or passwords are not kept safe, then NFTs can
    be stolen or lost. Many artists have had their work tokenized without their knowledge,
    and it isn’t clear how one can reclaim ownership at this stage. However, the same
    can be said about forgeries in the art world. There are also cases of art provenance
    being corrupted, which again can impact the validity of a piece of art’s history.
    The safest way is to adhere to the same rules for any internet transaction as
    this is an issue with other online payments as well. It is not a new type of security
    issue; it is only highlighted because every person needs to ensure they follow
    the protocols needed to keep their information safe and secure so that they can
    use the internet safely.


    ## Pros


    ### Artist Benefit

    Artists can collect royalties and be paid for their work that can’t be copied,
    so it guarantees that artists are taken care of and knockoffs are not being found
    everywhere. As an NFT artist, not only is this a good way to ensure your artwork
    is seen but to also continuously earn from each resale. It’s making it easier
    to live that passionate dream and make a living off of it.


    ### Bringing Art to Everyone

    Collectables and art are more interactive and engaging, with a variety to look
    at and enjoy. NFTs are making art collections and appreciation something everyone
    can experience. It’s like an art and collectibles revival, with so many options
    and new technology that it is exciting. It’s just what the world needs now and
    going forward, and hopefully, it is here to stay.


    ### Authenticity

    Ownership is added to the ledger and verified against the item, so you are guaranteed
    an authentic item that increases in value. Blockchain technology is integrated
    into how NFTs are created and used, so transactions are put on a ledger and tracked.
    Ownership is tracked with each sale.


    ### Ease

    NFTs are easy to create and sell as there are so many marketplaces to choose from
    with a range of features and handy step-by-step instructions to follow. This makes
    buying and selling crypto digital art straightforward.


    ### Passive Income

    Finally, trading NFTs are a great way to bring in passive income. If you’re a
    digital artist, you do need to create something first to mint into an NFT but
    the return investment is enough for you not to need to sell a piece every day
    or week. By just trading in NFTs, many people are earning thousands if not millions
    by buying the right piece cheaply, just as it is about to trend, and then selling
    it for a higher price. It just comes down to keeping an eye on the market for
    the right trends.


    # CHAPTER 14: NFT Risks and Scams


    ## How to Avoid them

    The NFT hype is real, and many popular ones have been sold for hundreds of dollars.
    While as exciting as the NFT space is, we need to pause and acknowledge risks
    too. As Garyvee tweeted, 97-99% of NFT projects will be money losers, so learning
    and being patient are also important. We also need to consider and talk about
    the negatives.

    '
