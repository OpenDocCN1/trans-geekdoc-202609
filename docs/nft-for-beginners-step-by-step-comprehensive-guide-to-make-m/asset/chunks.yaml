    # Authenticating Land Ownership


    Land ownership is one of the biggest issues in the world today. You can easily
    find out if someone owns land or not by looking at their public records, but it’s
    not easy to prove you own the land. For example, let’s say you own land in Canada
    and want to sell it to someone else. To do that, you will have to go through a
    lot of paperwork and follow a very long process. Not only that, but you will also
    have to pay heavy taxes for selling your land. And after all this, there is no
    guarantee the buyer will not steal your land from you later on. This is because
    most of the time, people can forge their documents and make fake IDs.


    So, how can NFTs help solve this problem? NFTs have the potential to create digital
    identities for landowners which can be verified by anyone using blockchain technology.
    In addition, we can also store information about our lands in an immutable ledger
    that cannot be forged or tampered with. So, if you are trying to sell your land
    in Canada, then anyone interested in buying it can verify your ownership of that
    particular piece of land just by checking out the public records. In addition,
    you can also prove that you own land by showing your digital identity to the person
    who is interested in buying it. And this will be much easier than showing them
    your physical documents and proving that you own land. As more and more platforms
    are going to be built on top of `Ethereum`, we will see more applications of NFTs
    in the future.


    # CHAPTER 17: The Dark Side of NFT


    So far in this book, we have talked about all of the amazing benefits of NFTs
    but there isn’t anything in existence that can be quantified as perfect. All things
    have their flaws. There would be no such thing as an upside after all if there
    were not a downside to accompany it. And as such, it’s now time to talk about
    the dark side of NFTs. Some of the drawbacks of NFTs are due to their current
    structural components, such as impacts made on the environment from the sheer
    processing power needed to produce NFTs. Other’s downsides are more personal,
    such as changes in individual finances that could result. Here we will go on over
    the dark Side, exploring the potential pitfalls of NFTs in full.


    ## NFT and Carbon Emissions


    Just as the NFT craze is reaching new heights, many are not aware this virtual
    form of commerce has real-world effects on the environment. The reason is the
    nature of how NFTs are processed. Each NFT processed by the blockchain you see
    uses up the computation and electric power of several computers at once. This
    not only renders a hefty electric bill for those doing this processing but also
    creates a large carbon footprint from the expenditure of all of this power. And
    as you may have guessed, many have criticized it all as a wasteful and harmful
    practice.


    Ironically, even a rather vocal environmental activist and artist such as `Joanie
    Lemercier` has been caught up in this drama. Lemercier was known for criticizing
    the use of fossil fuels and challenging others to reduce their carbon footprint,
    yet after he placed some `NFT`, tokenized art on the blockchain, it wasn’t long
    before others were crying “hypocrite!” His art proved to be popular, and within
    mere seconds, he was making thousands of dollars off of several different NFTs
    — the only trouble is, the processing of these NFTs consumed some 8.7 megawatt-hours
    of energy in the process. Just to put all this into perspective, that’s about
    as much energy as the average American household consumes in one year — and this
    was done in mere seconds! Needless to say, such things do not bode so well for
    someone who has pledged to do their part in the reduction of carbon emissions.


    The major fault in NFTs carbon stars is the `Ethereum` blockchain, just like the
    `Bitcoin` blockchain, relies upon data mining, to verify blocks of data on the
    interlinked chain of transactions that are passed along on the network. To verify
    an NFT that has been dropped into the block, several “proof of work” processes
    have to be carried out that use a ton of computing power to solve equations. Therefore,
    a ton of electricity is consumed to “prove” an NFT to be what it claims to be:
    an original and unique piece of data (music/art/game/or whatever else that data
    implies). Some in the art world have been so disturbed by this fact that they
    have gone on the record to do all they can to counterbalance it.


    One of the fruits of this effort is the so-called “Green NFTs” initiative launched
    by artist, `Jason Bailey`. Mr. Bailey has championed the cause of finding a way
    to make the production of NFTs more environmentally friendly through the creation
    of what he refers to as a “bounty system,” which provides an incentive to those
    who are seeking to decrease carbon emissions caused by NFTs. Even NFT pioneers
    and `CryptoPunk` creators, `Matt Hall` and `John Watkinson`, have become a part
    of this effort, signing on to be part of a “panel of judges” who will judge the
    efforts of participants in reducing their carbon footprint. So far, however, the
    project is only at its initial stages of spreading awareness of the problem. Despite
    suggestions of massive overhauls from electric to solar and hydropower, in reality,
    a more immediate and meaningful solution to this dilemma is not yet in sight.


    ## Could NFT Styled Capitalism Take the Joy Out of Gaming?


    With the explosion of online gaming, any gamer will tell you the greatest thing
    about it is the fact you can explore virtually limitless online worlds, where
    just about anyone can do or acquire anything. In these games, players find all
    manner of items to enhance their experience. In a sword and sorcery game, for
    example, a player will inevitably acquire armor, swords, shields, magical items,
    and the like. It takes skill and brains to acquire the necessary experience and
    be able to equip your character right.


    But wait — what if in the future, all you need is money? Yes, just imagine it.
    The top players are not defined by their skill, but by the almighty dollar — er,
    um, cryptocurrency. Instead of battling warlocks to gain a dragon’s tooth with
    which you can slay your foes, what if you could just buy this — or any other important
    item — with cryptocurrency? With NFTs allowing folks to use real-world money to
    buy items in virtual games, this is becoming an increasing possibility. And if
    it does, whole sections of gaming might be unavailable to those who simply don’t
    have the money to equip characters or even access certain parts of gameplay.

