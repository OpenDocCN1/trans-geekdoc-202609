  trans: '


    # 简短回答


    你可能提出的第一个最好的问题是：什么是非同质化代币（NFT）？或者具体来说，“同质化”（fungible）到底是什么意思？同质性是指事物互换性和易于替换的特性。同质化的物品很容易被复制替换。而非同质化的物品则不然。


    以批量生产的 T 恤为例。T 恤是在流水线上生产的，大多数都是相同的。如果你的 T 恤破了，你可以再订一件，它与你之前拥有的那件完全无法区分。而非同质化的东西就像马格里特（Magritte）的艺术品原作。一件原作物品，一件独一无二的东西，就是极致非同质化的。


    现在考虑以下情况：那件被替换的 T 恤可能不是同质的。如果那件 T 恤对那个人有很大的情感价值，那么它对其他人来说是同质的，但对所有者来说是非常非同质的。如果它只是一件普通的白色内衣，你可以几美元买一包
    10 件装，但你是在红辣椒辣椒乐队演唱会上得到它的——当时主唱安东尼·基迪斯（Anthony Kiedis）脱下并扔进观众席，而你正是那个接住它的人。这让它突然比同设计同制造的普通衬衫更有价值。现在它附带了经历，带有了名人效应。那件衬衫不仅仅是棉纤维。那件原本同质的衬衫现在变成了非同质的。


    同质性的终极形式是现金。任何一张 20 美元纸钞都可以被任何其他一张 20 美元纸钞替换，或者被两张 10 美元或四张 5 美元纸钞替换。货币发明的首要原因就在于这种同质性。货币是一种交换媒介，一种衡量价值并允许人们方便交换商品的方法。在现金出现，黄金是标准的交换媒介；一种易交易、难伪造且不会腐变的贵金属。


    加密货币也是现金这样的交换媒介，但像 `Bitcoin` 和 `Ethereum` 这样的加密货币比黄金或现金更加同质。任何 `bitcoin` 都和任何其他
    `bitcoin` 一样。它们是完全同质的。现金的同质性略低，因为它们有不同的序列号，理论上讲，你可能在不知情的情况下拿着一张从银行被偷的 20 美元纸钞。尝试花费带有该序列号的钞票可能会导致你在完全没有过错的情况下与警察发生一段令人尴尬的对话。


    我们在 Napster 时代学到数据是无限可复制的。当音乐存储在光盘上时，你需要花钱制作光盘。你必须打印封面艺术、制作塑料壳，并使用卡车和船在世界各地的之间运输所有零件和最终产品。当最终产品上市时，货架空间是有限的。在互联网上，数字形式的歌曲理论上可以被复制无限次，并传给无限多的人，唯一的成本是服务器空间和电费。


    任何类型的数据都极具同质性。只要你能控制数据不被损坏，任何歌曲副本都可以通过相同的文件轻松且廉价地复制。


    加密货币总体来说，特别是 NFT，其作用是在一个没有稀缺性的数字世界中增加稀缺性。NFT 提供了一个数字稀缺性的新领域，在这里，独一无二的数字资产存在并可以交易。这就是它们成为大轰动的原因，也是为什么阅读这本书是非常值得时间的。


    ## 同质性与价值


    要理解为什么 NFT 以及像 `Bitcoin` 和 `Ethereum` 这样的加密货币有价值，我们必须谈论一些抽象的东西。我们必须准确理解什么是价值以及价值源自何处。


    简而言之，价值源于我们。价值源于人类的需求。价值并不存在我们之外。价值并不内在存在于事物之中。


    爱因斯坦伟大的观察是，物体在空间中的速度和方向只有在其他物体速度和方向的背景下才有意义。在完全黑暗的真空中，如果没有恒星和行星等其他物体作为参照，就不可能确定物体运动的速度或方向。


    价值和货币运作是一样的。一个事物的价值需要与其他事物进行比较。这听起来有点深奥，但它比看起来要容易理解。


    一瓶水值多少钱？瓶装的 16 盎司反渗透过滤水在内华达州的价格比密歇根州要贵（等等，原文先说是“Nevada”后说成“Michigan”——保持原文语境）。


    ## 数字财产的新时代


    你仍然困惑为什么有人会花 6900 万美元买一张 JPEG 吗？这个类比应该帮助你理解。考虑像修拉（Seurat）这样的名画。那幅画画的是所有穿着整齐、在公园里闲逛的人，但如果你近看，你会发现图像只是点。这幅非常著名的画由芝加哥艺术学院收藏，估计价值
    6.5 亿美元；远高于 Beeple 的作品。你可以找到这幅法国画的 JPEG 并免费下载。你可以花大约 20 美元订一张海报挂在墙上。是的，一个副本 20
    美元。而不是一个副本值 6.5 亿美元。海报印刷品的价值完全无法与原作相提。


    请允许我们问一个愚蠢的问题然后回答它：为什么原作值这么多钱，而副本却一文不值？因为它是原作。考虑一个假设的科幻场景。想象有一台机器，可以扫描一幅画并确定每一个笔触，然后画出一件复制品，一个到分子水平都完美的伪造品。这个复制品精确到扫描机器无法区分它们。假设这台机器可以在流水线上生产成千上万幅分子完全相同的画。从逻辑上讲，这些画的价值是相同的。它们是一样的。唯一的区别是其中一是原作。这决定了一切。原作画仍然值
    6.5 亿美元。而复制品只值那些略贵一点的海报副本的价格。


    事物的来源很重要。安东·基迪斯穿过的 T 恤之所以有价值，唯一的原因就是他穿过它。NFT 有价值是因为是谁制作或拥有过它。


    '
- fmt: "\n# CHAPTER 2: How are NFTs Created?\n\nMany NFTs are created on the Ethereum\
    \ blockchain using its `ETH` currency to pay for its use. But that doesn’t mean\
    \ these have to keep moving around to get sold. The NFT is held in a virtual wallet\
    \ that goes with the person to different platforms, allowing them access to this\
    \ wallet. \n\nAn application like `MetaMask` is needed so that each platform can\
    \ access this wallet for any buying and selling to take place smoothly. Various\
    \ marketplaces allow you to create NFTs without paying any fees, like `OpenSea`\
    \ and `Mintbase`. Most marketplace platforms charge you a fee, called ‘gas fees,’\
    \ for the cost of creation or minting of the NFT. These charges change frequently\
    \ and can be pricey. But once these fees are paid and the NFT is uploaded to a\
    \ site, then it has been created and is ready to be sold.\n"
