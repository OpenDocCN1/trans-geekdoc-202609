    # 第三章：NFT 是如何工作的？


    每一个非同质化代币都由两部分组成：一部分存在于区块链上的代币，另一个是资产本身，无论它是数字艺术品、视频还是任何其他数字资产。区块链在仅处理代币和加密货币时，能源效率极低，因此能源需求是数字资产没有与其指向的代币一同存储在区块链上的原因之一。区块链上的任何其他代币（如
    `Bitcoin`）都是根据其价值定义的，而不是根据其独特性。NFT 则恰恰相反。它们根据其独特属性定义，而不是任何内在价值。NFT 的价值就像大多数收藏品一样，取决于人们愿意为它们支付多少钱。例如，如果你购买了一条被铸造为
    NFT 的推文，这这条推文并与代币一起存储在区块链上，它仍然留在 Twitter 上。然而，如果由于某种原因 Twitter 关掉了，你的数字资产也会随之消失。你购买的
    NFT 无法让它回来，而且没有实物资产可以进行主张。还会发生另一种情况，即不法之徒会将受版权保护的数字资产铸造成 NFT 并出售。如果你足够不幸地买了这种东西，而政府以版权法的名义没收了该数字资产，那么你在区块链上代币的所有权并不能保护你。尽管如此，这并没有阻止人们寻找变现
    NFT 的方法、投资 NFT 以及将其作为独一无二的独特物品进行收藏。


    ## 关于你真正拥有什么的问题


    这是逻辑、抽象思维和哲学发生碰撞的部分，因为这完全取决于 NFT 的虚拟价值和可用性。加密货币的价值在它作为一种新事物出现时引发了激烈争论。许多怀疑者将其视为想象的货币。毕竟，如果你无法手握它或将其把它放入自动售卖机中，你凭什么理由证明它是真实的呢？这是一个你可以深陷其中且永远触不到底的心理黑洞。许多被人们视为具体现实的概念同样是无形的。友谊、爱、恐惧，或者婚姻证呢？结婚证能保证你对他人内心的所有权吗？该证书唯一保证的是，当事情没有按计划进行时，你有某些法律救济手段。该证书所代表的无形现实——那些无法通过该证书进行治理或控制的事——从一开始就可以被解释为不是真实的。但对许多人来说，它们是非常真实的，而且他们围绕它们建立生活。所以，就像结婚证、驾照、狩猎许可证、商业合同或土地契约一样，这一切都指向无法量化的无形事物，因此区块链上的非同质化代币指向了买家或收藏家可能非常珍的价值。如果它对他们来说是真实的，那么它就足够真实了。作为一个想要加入
    NFT 热潮的人，如果他们愿意为你创建的 NFT 花钱，那么它就足够真实了。![00006.jpeg](img/image_rsrc1TV.jpg)


    ## 区块链


    基于区块链的 NFT 允许用户拥有数字资产。然而，这种数字资产的所有权与物理所有权不同，因为这些类型的资产仅存在于特定的、专门构建的语文中，例如市场、游戏等，这使得移动变得困难，至少目前是如此。当区块链技术发挥作用时，它可以为数字资产提供一种协调层，授予用户的所有权和管理权限，并改变开发者与其资产之间的关系。这一切之所以成为可能，归功于
    6 个关键属性，这些属性为 NFT 设定了规则，并代表了使其独特的特征。


    ### 标准化


    标准的作用是创建一套统一规则，允许 NFT 跨平台集成、实现互操作性，并通过扩展其适用性来增加其实用价值。与所有类型的技术一样，标准代表了在特定范围内可重复和共享的操作方式。标准的产生是为了通过消除必要的流程以节省时间和资源的需求，并在社区内被普遍认可。参考标准总是必要的，以确保每个人都以合规的方式运行。当数字资产在区块链内进行代币化时，这些代币通过通用、可重用和可继承的标准注册。换句话说，这些是开发者约定并开发的方法，允许
    NFT 以不同的方式运行。每个数字资产的表示方式都不同——例如，游戏表示其集合的方式可能与活动票完全不同。NFT 基于一个通用的公共系统，其标准包括所有权、传输和访问控制等基本功能。这意味着，如果几个购买的
    NFT 基于相同的标准，那么它们可以在同一个应用程序内相互操作。程序员随后可以创建使用基本相同代码的应用程序，使去中心化平台（如以太坊网络）内的所有代币都能运行。以太坊区块链上的三个主要的
    NFT 代币化标准是：


    - `ERC721`

    - `ERC998`

    - `ERC1155`


    '
- fmt: "\nThe acronym `ERC` stands for Ethereum Request for Comments. Anyone can create\
    \ standards, but it is up to the author to explain them and promote support for\
    \ them within the community. Since Ethereum is based on blockchain technology,\
    \ there is not one person who can take over and make changes or adjustments to\
    \ the protocols. `ERC` was created so that people could provide information or\
    \ introduce new features to the Ethereum network, so `ERC` is how programmers\
    \ propose changes to the network. The numbers `721`, `998`, and `1155` represent\
    \ the codes for those proposals. `ERC721` was introduced in 2018 by Cryptokitties,\
    \ where each cat to be adopted, nurtured, and raised was represented by an `NFT`.\
    \ Before this standard, people could create fungible tokens such as `Ether`, but\
    \ with `ERC721`, programmers can create tokens with different properties, characteristics,\
    \ and types, all from the same smart contract. `ERC721` is the `NFT` standard\
    \ that allows `NFTs` to be created and exchanged. While it is the most popular\
    \ cross-platform, easy to integrate, and available `NFT` standard, it also has\
    \ several inefficiencies, depending on the use case. `ERC998` has a special operation\
    \ and was created to allow multiple `ERC721 NFTss` to be transferred within the\
    \ network in a single bundle transaction instead of making several. With this\
    \ standard, not only do you own an `NFT` but that `NFT` can also include your\
    \ own `NFTs`, as in a sort of bundle. If an `NFT` is sold, all the tokens attached\
    \ to it are sold as well. Thus, transferring the composition of the `NFT` means\
    \ transferring the entire hierarchy of associated elements. For example, a Cryptokitty\
    \ may own a scratching post and an eating dish that may contain fungible tokens,\
    \ and in selling the Cryptokitty, all of the items associated with it are also\
    \ sold.  \n\nThe `ERC1155` token is a type of standard token that can store, within\
    \ its control, tokens that can act as if they were an `ERC20` or `ERC721` token,\
    \ or both at the same time, under the same address. `ERC1155` was created by Enjin,\
    \ an Ethereum platform that allows non-fungible tokens and fungible tokens to\
    \ be created in the same contract. The standardization of `NFT` issuance makes\
    \ possible a higher degree of interoperability, which benefits users. It means\
    \ that unique assets can be transferred between different applications with relative\
    \ ease. The best example of `ERC1155` can be found in blockchain games. Instead\
    \ of requiring a new contract for each game item, multiple items can be created\
    \ using the same contract. Also, if, for example, both weapons and crypto coins\
    \ are collectible in the game, you can write both with `ERC1155`, drastically\
    \ reducing the resources needed to efficiently run blockchain-based games.\n\n\
    ## Interoperability\nAs we've already mentioned, all `NFTs` use the same standards\
    \ just so they can be on the same level and operate on the same Ethereum platform.\
    \ This enables the transfer of `NFTs` across multiple ecosystems where they are\
    \ immediately visible and tradable. Thus, based on the same usage characteristics\
    \ — i.e., through standardization — interoperability allows `NFTs` to be freely\
    \ tradable on open marketplaces.\n\n## Marketability\nThis is the first time that\
    \ users around the world can create `NFTs` that can be immediately available in\
    \ marketplaces across the ecosystem. Here, people can buy, trade, sell, and auction\
    \ `NFTs`. The extent of this property lies in the move from sales within closed\
    \ marketplaces to the possibilities offered by a marketplace that has an open\
    \ and free economy. The ease with which any user can create and then trade `NFTs`\
    \ around the world.\n\n## Liquidity\nThis term is used to describe how often.\
    \ High liquidity means that items are sold quickly. To understand if a market\
    \ is liquid or illiquid, the best way is to look at three indicators: trading\
    \ volume, the depth of the order book, and the amount that separates the bid and\
    \ ask price, which is known as the bid/ask spread.\n\n## Immutability and Provable\
    \ Scarcity\nImmutability, as the name implies, is the ability of a blockchain\
    \ to remain unchanged. To put it more simply, the data within the blockchain cannot\
    \ be changed. In its technical nature, blockchain is configured as an immutable\
    \ database, and it is not possible to manipulate the data already in. Each block\
    \ consists of information, such as the details of a transaction, and uses a cryptographic\
    \ principle called a hash value. That hash value consists of an alphanumeric string\
    \ generated by each block. Each block not only contains a hash referring to itself\
    \ but also incorporates the prior one. This ensures that the blocks are paired\
    \ retroactively. This is how this feature of blockchain technology ensures that\
    \ no one can intrude into the system or alter the data stored in the block. The\
    \ most popular hash function is `SHA256`, or `Secure Hash Algorithm 256`. The\
    \ hash value protects each block of code. The process of hashing generates a string\
    \ of 64 characters. Regardless of the size of the input, the fixed length of the\
    \ string, known as a digital signature, is always the same. This refers to the\
    \ exact data entered, and the key property of this hash value is that it cannot\
    \ be decoded. The word immutable is used to refer to something that can never\
    \ be changed. Immutability is the key that imprints authenticity in digital assets,\
    \ as well as introduces scarcity. Immutability means that what belongs to a particular\
    \ person in a game, for example, cannot be moved or changed.\n\n## Programmability\n\
    `NFTs` are fully programmable. They can, for example, be programmed to respond\
    \ to triggers or actions taken by the owner. They can also respond to external\
    \ triggers such as the time or score of a game. The programming possibilities\
    \ of `NFTs` are endless.\n"
