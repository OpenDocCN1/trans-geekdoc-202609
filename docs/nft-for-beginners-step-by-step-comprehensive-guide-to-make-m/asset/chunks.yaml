    交易所是购买加密货币最简单的方式。然而，如果你在多种币种中有很多投资，那么直接从区块链上购买你的加密货币可能是个好主意。这是因为你能够对自己的投资拥有更多控制权，例如根据每种币种的价格为每种币种创建一个个人损益表。这意味着一次只持有一种单一币种或代币！不过，这不是你处理加密货币的最佳方式，因为如果价格开始下跌，风险将极高。相反，你需要进行多元化，这是我们在上面已经讨论过的。


    ## 为什么我需要多元化？

    通过多元化，你可以消除投资中的大部分风险。如果一种货币的价格下跌，不会对你所有其他投资产生负面影响。此外，如果你在不同的时间购买币种，你可以分别卖出它们，这可以在不需要花费大量时间或精力的情况下增加收益。从本质地说，这是确保你在价格下跌时不会亏钱的好方法。大多数钱包和交易所都有内置功能，允许用户轻松地将币从交易所账户转移到他们控制的个人钱包中。它还减少了中心化公司对你加密货币的控制。HODL！——HODL
    的意思是“死死持有”，这正是当你的币种或代币价格下跌时你需要做的。持有你购买的货币，直到价格回升，因为如果你是低买高卖，价格下跌几乎是不可避免。当价格足够低时，你应该在最低价格卖出，这样即使价格下跌你也能盈利。


    ## 我该如何从亏损中恢复？

    为了帮助在市场下跌时防止额外损失，并在回升时转化为利润，最好是遵循以下步骤：

    - 等待你的币种或代币价格上涨 50% 或更多。

    - 等待至少 3 个月，然后利用这个机会一次性买入所有亏损的货币。由于你是同时购买所有这些加密货币的，它们的价值将比你逐个卖出要高得多。现在你已经投入了所有的买单，请等待市场再次上涨。一旦价格上涨
    50% 或更多，立即一次性卖掉所有的加密货币。你现在应该根据价格上涨获得利润了。这可能是从亏损中恢复最困难的部分。在等待投资中的每种币反弹时，保持耐心可能是困难的，尤其是如果它们每天下跌得越来越厉害。然而，在这些时期，耐心是有回报的，因为当市场开始回升时，你最终会看到收益。如果你能够等待并正确这样做，从长远来看这也是盈利最简单的方法！


    ## 我应该如何投资我的钱？

    现在我们已经涵盖了投资加密货币和山寨币的一些通用概念，让我们过一下一些如何投资资金的具体方案。无论你选择哪种方案，记住这些都是具有极高风险的早期项目是非常重要的。你必须理解，你是在自担风险进行投资，并且没有保证这些投资中的任何一个会有回报。


    - **HODL**：在谈论加密货币时，HODL 和 Hold 是表达“持有”的简单方式。在涉及你的投资时，这是需要记住的两个关键术语。HODL 意味着你应该持有你的加密资产，直到它们的价值上涨。换句话说，如果你以
    1 美元的价格购买了一种加密货币，在一周内它上涨到了 3 美元，那么按原价持有直到下一次价格变化。


    HOLD 是一个类似的术语，但可能与 HODL 互换使用。使用 hold 而不是 HODL 时，意味着你不想以任何代价卖出你的加密货币。它也可以意味着你想要长期持有你的币，但这与
    HODL 不同。Hold more closely（更密切地持有）是指对加密货币的坚定信念。


    - **买入并持有 (HODL)**：购买资产并希望其价格上涨是赚钱最简单的方法，但它仍然非常有风险。对于加密货币来说，价格极快地波动是非常容易的，如果你不小心，可能会损失所有的钱。


    - **低买高卖**：这种方法比仅仅购买资产并等待价格上涨需要更多技巧。对加密货币的基本面有深入理解，并有识别币种或代币何时被高估的能力是非常重要的。此外，你愿意持有你的投资至少
    6 个月或更久也是非常重要的。


    - **风险披露**：比特币和其他加密货币是投机性资产，波动性极高。通过投资加密货币来赚钱是不明智的，此内容仅供参考。作者不保证你的投资有任何回报。在决定投资任何加密货币之前，你应该始终进行尽职调查。


    ## 投资加密货币的简单方法是什么？

    开始投资加密货币可能很困难，但对于可能还没有打算全投入的新投资者来说，有很多很好的选择。以下是一些进入市场的最简单方法：


    - **购买币种或代币**：每天都有大量的代币销售和 ICO（首次代币发行）。这些机会可以为你提供投资加密货币的最佳方式，因为你几乎不需要成本就可以参与这些项目。然而，重要的是你要对每个机会进行彻底研究，并仅在符合你风险承受能力的情况下进行投资。


    - **加密投资**：几个加密货币投资平台允许你将小额加密货币投资到股票和债券等现实资产中。这是一个尝试水的好方法，而无需投资加密货币这样极高风险的项目。


    - **加密货币交易**：有很多交易所允许你多或少直接将你的加密货币交易为其他加密货币、法币甚至现实世界的投资。这些交易所提供极高的杠杆，通常由经验丰富的交易者维护。


    - **加密货币挖掘**：如果你对通过挖掘加密货币赚钱感兴趣，请研究挖掘加密货币获取有关如何开始的信息。


