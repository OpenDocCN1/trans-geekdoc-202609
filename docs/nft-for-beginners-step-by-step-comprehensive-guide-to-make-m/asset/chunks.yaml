    \ you like and follow. They look real, and very hard to tell what's fake or what's\
    \ real. The way they speak can sound very genuine, and at the end, they'll say\
    \ something like “reach out to me” or “send me money.” However, these are scams\
    \ too. YouTubers usually cannot get access to followers' emails. So, make sure\
    \ if you are not the one initiating, it is a scam. In the crypto space, always\
    \ make sure you are the one that asks for the information first. This kind of\
    \ scam goes worse in the YouTube comments. There are many scammers and impersonators\
    \ in the YouTube comments, trying to pretend that they're the Youtuber. They'll\
    \ say things like “thank you for your comment, reach out to me on WhatsApp,” or\
    \ “here's my phone number.” You will also see they spell WhatsApp in a funny way\
    \ like “Wha-t-sapp” because YouTube will detect it. But when they write it funnily,\
    \ YouTube doesn't detect it. These scammers are flooding the comments, and people\
    \ are responding to them and sending them money. It is easy to tell which accounts\
    \ are real or fake. If it's the creator of the video, there will be a gray area\
    \ behind the name. If you see no gray area behind the name, this comment is not\
    \ from the video's creator. You can also click on the profile, and it will show\
    \ you how many subscribers there are. If you click on a scammer profile, you'll\
    \ see there are zero or few subscribers. Whenever someone asks you to contact\
    \ them or ask you to send them money in crypto, you should always be the one initiating\
    \ first. \n\nCHAPTER 15:     Myths and Misconceptions About NFTs This chapter\
    \ will talk about myths since we've provided you with an overview of the concept. "
