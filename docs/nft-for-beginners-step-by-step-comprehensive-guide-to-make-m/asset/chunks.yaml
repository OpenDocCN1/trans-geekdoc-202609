    # The Capital Gains Tax — The Bane of the Would-Be NFT Investor?


    Tenets of capitalism could fuel a virtual land grab in online gaming. Well, while
    we are still on the subject, it will also bring in good old Uncle Sam in the form
    of the “Capital Gains Tax.” Because where the `IRS` stands on this matter is quite
    clear. As it pertains to this matter, the `IRS` has officially stated, “If you
    exchange virtual currency held as a capital asset for other property, including
    for goods or another virtual currency, you will recognize a capital gain or loss.”
    This means, if these would-be NFT investors fail to report their investment, they
    could end up in some big trouble with the `IRS`. It also means that although cryptocurrency
    has the word “currency” in it, the `IRS` does not recognize it as such. The `IRS`
    views it as an asset that is being invested in. And since cryptocurrencies such
    as `Bitcoin` and `Ether` have a knack for rapidly increasing in value, `Bitcoin`
    or `Ether` that was worth hundreds of dollars in 2021 could very well be closer
    to a thousand dollars in 2022. So, this very well could come back as quite a shock
    for the holder of this “capital asset” come tax time. And since NFTs are in the
    category of being collector’s items, they have an even more formidable capital
    gains, a tax rate of 28%. Beeple, the artist who sold some 69 million dollars,
    for example, is expected to have to pay taxes in the tens of millions for the
    sale. Beeple’s response, when informed of this fact, was perhaps one a lot of
    would-be NFT investors might have. Beeple is quoted as saying, “Holy s***, that’s
    a lot of taxes!”


    ## CHAPTER 18: NFT Mistakes You Should Avoid


    Before launching yourself head-first into the world of NFTs, there are some common
    mistakes you really must avoid. Although the creation and selling of NFTs have
    not been going on for too long, it is noticeable that some people are making the
    same mistakes over and over again. All of these mistakes can be catastrophic for
    your success in the NFT world. You are probably going to make other small mistakes
    when you are just starting and that’s OK. As long as you learn from these, it
    is fine. What you need to do is to avoid these very big mistakes that can mean
    the difference between success and failure.


    ### Thinking Too Short-Term


    Yes, some NFTs have sold for millions over the last year. But that doesn’t mean
    you can create NFTs, or invest in them, and make a substantial amount of money
    the first time around. If you try to make too much money too fast with NFTs, then
    it is very likely that you will fail and give up on the whole idea. There is no
    doubt the NFT journey can be an exciting one. This doesn’t mean you are going
    to be a millionaire by this time next week though. If you go into NFTs with a
    “get rich quick” attitude, then you are extremely likely to fail. The best way
    to succeed with NFTs is to provide value. You will also need to have a good degree
    of patience as you may not sell your NFTs right away. Be consistent with your
    marketing efforts and take the time to form collaborations and partnerships that
    will serve you well in the future. If you are serious about the NFT game, then
    commit to it for the longer term.


    ### Not Promoting Your NFTs Enough


    It is just not enough to create your NFTs and list them on `OpenSea` and expect
    the money to start rolling in. There are already millions of NFTs listed on `OpenSea`
    and most of these are struggling to find buyers. Forget about the “build it and
    they will come” concept. It is not going to happen. You need to create a marketing
    plan and then stick to it. Identify who your target audience is and then find
    out where they hang out. Use social platforms to leverage your NFT promotions.
    Use `Discord` forums, `Clubhouse`, and `Reddit` to your advantage as well. Do
    whatever you can to get the word out about your NFTs and the talents you have.
    Some people might get lucky with their NFTs. They may list them on `OpenSea` and
    sell them quickly and have people begging for more. Instances like this are very
    rare. You cannot count on this kind of luck, so be sure to have a promotional
    plan and follow through with it.


    ### Choosing the Wrong Marketplace for Your NFTs


    This is another classic mistake we see over and over again. NFT creators cannot
    be bothered to do the necessary research and they just opt for `OpenSea` because
    it is the biggest platform. Yes, `OpenSea` does get a lot of visitors (nearly
    40 million a month and growing), but this does not mean it is the best platform
    for your NFTs. There are several things you need to find out about an NFT marketplace
    before you use it. The most important thing is knowing whether your target audience
    uses the marketplace or not. You need to consider if the NFTs you want to create
    are a good fit for the ethos of the marketplace as well. With several new NFT
    marketplaces emerging all of the time, you need to ascertain whether the marketplace
    you are considering using is safe. The size of the community in the marketplace
    is important, but more important is whether the community is responsive and helpful.
    Unfortunately, there are scam NFT websites already in existence. These people
    will just collect fees from you to pay `Ethereum` for example, and you will never
    sell anything. To avoid these scam NFT websites, use the `Dapp Radar` website
    to check for legitimacy.


    ### Doing NFTs on the Cheap


    The more you can invest in your NFT venture, the better. A lot of people make
    the mistake of thinking the world of NFTs is a free one, and they can do everything
    on the cheap. While there are platforms that do not have fees for listings, most
    of the best quality ones do, so you need to factor this into your NFT budget.
    We have told you several times in this book that the `Ethereum` blockchain network
    is, by far and away, the most popular for NFTs. If you want to use the `Ethereum`
    network, then you are going to have to pay gas fees. You need to put some money
    behind your NFT marketing as well. Unless you have a huge following on social
    media, you will need to use social media ads to showcase your NFTs. This is a
    fairly inexpensive way to achieve results pretty fast. While gas fees and listing
    fees may come down as NFTs become even more popular, this cannot be guaranteed
    and you cannot rely on this happening. If fees do come down in price, use the
    money you saved for more marketing. You need to take your NFT journey seriously
    and be prepared to invest in it for the maximum chance of success.


    ## CHAPTER 19: Sports and Esports in NFTs


    There is one place where nerd culture and jock culture overlap: collecting. There
    was a very interesting and innovative video game available in Japanese arcades
    some decades ago, called `Sega Card Gen ''10`. The idea was the following: it
    was a baseball video game where you would insert baseball cards into the machine
    like you would a dollar bill into a vending machine, and those cards would then
    create your lineup. You bought the cards just like any other cards at any collectibles
    shop. Based on the baseball players'' records, the video game estimated the players''
    performance in the game itself. So, having more accomplished players with better
    stats would help you win in the video game. This genre still is popular in Asia,
    with perhaps the most successful current form as `Sangokushi Taisen`. The potential
    of cards continues, but without the actual physical object being necessary. You
    could, for example, combine NFT trading cards with a very valuable video game
    property such as the `MLB` series, and those collectibles would allow you to have
    a stronger team in the video game. The game itself would incentivize the trading
    of players'' cards. And for people who have no interest in video games, it still
    increases the value because as long as there are people who do play video games,
    they are willing to pay for these sorts of things.

    '
