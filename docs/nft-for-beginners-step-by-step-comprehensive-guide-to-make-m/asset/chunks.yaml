    # 传统数字艺术软件 (Adobe)


    现在，让我们深入探讨一下最流行的数字艺术软件。`Adobe Photoshop` 是最知名且最常用的数字艺术软件。它功能强大，更新频繁，并可用于制作从概念缩略图到漫画页面，甚至是照片合成（photo-bashed）作品的任何内容。`Photoshop`
    最初是摄影师设计的照片编辑软件。它逐渐成为许多其他行业（包括数字艺术）的标准。你可以使用该软件极其广泛的绘画工具、画刷、滤镜、插件和图层样式。由于其运行高效，它已成为娱乐行业所有数字艺术家的常用行业软件。如果你想在视频游戏、动画、长片或任何其他制作公司工作，`Photoshop`
    技能是必不可少的。它的学习曲线相当陡峭。如果你是新手，所有的功能可能会让你无从从从，你可能会在软件的技术领域迷失。然而，一旦你掌握了基础知识，将将无限！你可以以任何喜欢的风格创建任何内容，甚至可以修改图片！因为
    `Photoshop` 是最流行的数字艺术程序，网络上有许多 `Photoshop` 学习教程供你使用。不过，我们在下方提供了一份简短的入门指南，帮助你开启
    `adobe` 之之旅：


    ## 打开图像


    打开图像并创建新图像。要打开和创建图像：在菜单栏中，选择 `File > Open` 从头开始创建新图像；从菜单栏中选择 `File > New`。从下拉菜单中选择文档预设。你可以通过输入数值来更改预设的宽度和高度。


    ## 熟悉你的工作环境用户界面


    菜单栏（位于最顶部）显示 `File`、`Edit`、`Image` 以及其他菜单，用于访问一系列命令、修改和面板。`options bar`（位于菜单栏下方）显示你当前使用的工具的设置。编辑图像和制作艺术作品的工具位于
    `Tools` 面板（位于左侧）。相关的工具被归类在了一起。你将通过在面板中选择并按住某个工具，来发现该组中的相关功能。`document window`（位于中间）显示你当前正在工作的文件。`Document
    window` 以标签页形式显示许多打开的文档。


    ## 掌握缩放和平移动：更改你的图像视图


    在 `Tools` 面板中，你将找到 `Zoom` 工具。在设置栏中，在 `Zoom in` 和 `Zoom Out` 之间切换。你可以使用 `Hand`
    工具在大图像或放大图像上移动，该工具也包含在 `Tools` 面板中。


    ## 撤销命令


    撤销单个或多个步骤，并使用 `History` 面板。要撤销之前执行的任何操作，前往 `Edit > Undo` 或点击 `Control+Z` (Windows)
    或 `Command+Z` (macOS)。要重复之前执行的任何操作，前往 `Edit > Redo` 或点击 `Control+Z` (Windows)
    或 `Command+Z` (macOS)。多次选择 `Edit > Step Backward` 或在 `History` 面板中选择一个步骤来撤销多个步骤。


    ## 保存你的工作


    利用 `Save` 命令。


    # 将传统或非主流艺术数字化 NFT


    英国最富的当代艺术家达米彦·霍斯特（Damien Hirst）开始在 NFT 市场出售他的作品。霍斯特宣布，他参与 NFT 和加密货币销售是他迄为止参与过的最迷人的项目。在最近一次销售中，霍斯特通过将其
    7,481 幅版画拍卖给来自 67 个国家的 4,000 人，赚了 2,240 万美元。这个数字令人费解，因为考虑到总利润以及在如此不同的国家售出的巨大版画数量。加密货币的使用使得联系
    67 个国家的 4,000 名买家成为可能。随着更多传统艺术家投身 NFT，接受这一趋势只会加速，让以前未受教的艺术世界参与者更容易接触。佳士得纽约的战后及当代艺术专家诺亚·戴维斯表示：“NFT
    在艺术市场具有巨大的潜力。作为一种机制，NFT 改变我们获取所有权的方式潜力是无限的。销售结果显示了数字艺术世界的极大兴奋，以及这种艺术媒介在更大范围内无限可能。”


    数字艺术是一种历史悠久的艺术媒介，可以追溯到 20 世纪世纪 50 年代，当时个人首次接触计算机系统。在 NFT 和区块链技术出现之前，为仅通过数字方法创建的作品赋值是困难的。这一切意味着数字艺术并不是新鲜的；它只是对艺术界来说是新的，我们看到它正在追赶。“我们非常荣幸，现在有权利用我们的网络向世界介绍最具前瞻性的艺术家。”精品咨询公司
    Cromwell Art 的创始人 Wendy Cromwell 在这方面持积极态度。“艺术市场追随金钱，最终，艺术家也是如此，”她观察到。她认为未来未来传统艺术市场将维持
    NFT，因为随着 NFT 艺术质量的提高，收藏家将想要参与。


    # 你的 NFT 版权


    购买 NFT 的人无疑获得了购买和出售该特定 NFT 的能力。这就是他们能得到的全部。NFT 的所有权并不赋予任何知识产权。相反，它赋予了对所获数字文件的权益。无论这个数字文件是什么并不重要。NFT
    并不保证创建它的人最初具有法律权利这样做。许多平台正在解决这个问题。


    假设用户上传了受版权保护的作品；`SuperRare''s TOS` 包含了 `DMCA` 退款政策。如果有人花费 50 万美元购买了一件艺术品，结果该作品是非法的，且卖家兑现了加密货币、逃出国并挥霍了所有资金，买家将承担责任。有人认为补救措施是更多的加密货币和区块链账本，这可以追溯诈骗者的活动，但世界尚未到达那一步。换句话说，购买
    NFT 数字艺术作品类似于购买实体艺术品。基础物权仍由原始创作者或艺术家拥有。如果我去工作室购买了一幅我欣赏的画，我不能再将该图像出售给可口可乐用于他们的罐子上。那将是侵犯版权。如果我对艺术品拍照并出售
    NFT 副本，也会发生侵权行为。如果我从一个最初没有权利制作 NFT 的人那里获得它的 NFT 副本，他们（可能还有我）犯了带有技术色彩的基础版权侵权。买家，请加小心！


