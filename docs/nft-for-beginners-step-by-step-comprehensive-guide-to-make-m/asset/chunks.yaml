    # NFT 交易主要风险


    ## 购买仿品

    我们需要停下来思考：我们买到真品了吗？这与传统艺术品非常相似。例如，如果你有一幅你认为是真实的 `Picasso`（毕加索），大家都认为它是真的，它就会值数百万。然而，当专业人士来鉴定并发现它不是真的时，会发生什么？这幅画会瞬间变成五美元。NFT
    世界也发生着同样的事情；人们确实成了这种骗局的受害者，而且这种情况可能会继续发生。


    这个账户记录了数百次销售记录，其中一件名为“NFT morons”（NFT 傻子）的作品，买家价格从 `0.116 Ethereum` 到超过 `60 Ethereum`
    不等。如果你不想成为那些傻子，你必须做的就是研究你即将购买的 NFT，尤其是那些价值昂贵的作品。这并不难。你只需要查看这件作品并检查它的历史：它是什么时候卖出的，在所有平台上是谁对它出价的。


    你可能会看到一个假账号只有大约 `300` 个粉丝，但真实的 `Banksy` 账号不可能有如此少的粉丝。假设你是 `King` 的粉丝，你也可以在平台的搜索栏中搜索这个账户。如果出现了任何其他简介，你还可以在社交媒体上进行双重检查或交叉验证。几乎所有有声誉的人声誉是有原因的。他们可能会出现在
    `Instagram`、`Twitter`、`Facebook` 或到处。如果你检查这些人的社交媒体，你可能会找到他们 NFT 的链接，并带你回到你刚刚在市场上找到的同一个页面。现在你可以验证这是否是真实的
    NFT 账户。如果你看到某个东西看起来太便宜，而且来自一位大艺术家，这是一个红旗。如果你遇到一个有影响力的人以 `15 ETH` 出售 NFT，请停顿一下，去检查个人资料、历史，并与其他社交媒体进行交叉验证。


    ## 流动性市场

    NFT 市场最大的问题之一是它缺乏流动性。当我们观察加密货币市场时，它们的流动性高得多，这意味着当你购买加密货币且情况开始变糟时，你可以退出或卖掉四分之一或全部。然而，在
    NFT 世界中，你目前无法这样做。这是一种全有或无的出售。


    如果我们检查加密货币，它会随着时间的推移建立支撑位。例如，`bitcoin`（比特币）图表有移动平均线，我们有大量过去的数据告诉我们这种加密货币可能处于什么价值范围。因此，即使它开始下降，我们也可以慢慢退出。但在
    NFT 艺术或游戏世界中，这些 NFT 的价格没有支撑位。它们可以在一夜之间从 `$0` 飙到 `$100,000`。


    一个 crypto punk 卖了了 `$700,000`，但如果我们检查它的历史，我们可以看到它只被卖过两次：一次以大约 `$2,000` 卖出，然后以大约
    `$700,000` 卖出。在这些销售之间存在出价，这就是它达到如此高价的原因。检查 NFT 的价值历史至关重要。这枚 NFT 是一夜之间飙升的，还是随着时间推移建立价值的？这是风险的，因为如果你在一个
    NFT 上花费了 `$1,000` 或 `$5,000`，而它的市场变糟了，你无法退出。在缺乏流动性的市场中，它是全有或无的。当情况变糟时，很少有人想买你花费了数千美元购买的
    NFT。你可能对那个 NFT 什么也得不到。所以，每当你准备购买 NFT 时，都要查看历史检查早期的销售价格、出价和转账。


    ![](img/image_rsrc1TW.jpg)


    看看这个 `CryptoKitty`；它在 `2018` 年以 `0.002 ETH` 卖出，下一次销售是同年的 `600 ETH`，我们在这里看不到这些价格的任何支撑位。此外，它之前的出价大多在
    `0.2 ETH` 左右。因此，任何为这个 NFT 支付 `600 ETH` 的人都很可能被套，没人想买它。当然，它在未来某个时候有以更高价格卖出的机会，但有很多风险而回报很小。我们正在冒险把钱投入一个可能卖不出去的
    NFT 中。所以，这完全取决于风险与权衡。


    涉及到 NFT 世界，无论是 NFT 艺术还是游戏，关键在于早入场。现在要困难得多，因为很难预测这些 NFT 收藏品和游戏中哪一个会火起来。NFT 艺术可能会稍微一点，因为
    NFT 艺术与声誉有关。当有声誉的人出售 NFT 艺术或收藏品时，你已经可以预测它很可能会表现良好。例如，`Rick and Morty` 的创作者 `Justin
    Roiland` 决定在 `Nifty Gateway` 上出售 NFT。起初，他的 NFT 价格只有几百美元。如果你能尽早入场，这些作品正以数千美元出售。当你尽早入场时仍然是有风险的，因为你不知道自己拿到的是否是有价值的东西。


    ## 自倒交易 (Wash Trades)

    这种情况发生在某人创建一个 NFT，将其挂牌出售，然后以高价从自己手中买回，从而制造出该 NFT 很有需求的假象。例如，如果你看到某个 NFT 以以 `500
    ETH` 卖出，但当你检查历史发现它五天前才创建，现在就以 `500 ETH` 卖出，这非常可疑。对于真正的物品，如果你查看交易历史，你会发现真正的物品并不是一夜之间从零元变成
    `$1000` 的。在此过程中有很多报价，我们会看到它会推高价格。此外，如果你看到某个账户不断从无人能验证的随机地址进行大量报价和销售，这很可能是自倒交易。


    总之，当你身在这个 NFT 世界中时，要非常小心。当你准备购买 NFT 时，务确保检查 NFT 的历史并验证创作者。


    '
- fmt: "\n# NFT Scams You Must Avoid Common Crypto Scams\n\nIf you fall for these\
    \ NFT scams, you will lose everything that you worked so hard for. Imagine that\
    \ you visit a `MetaMask` link you googled, and it turned out to be the phishing\
    \ link; you will lose everything immediately that you just put it into that fake\
    \ wallet. A similar situation is even worse for NFT artists.\n\nIn the NFT art\
    \ world, you need to build a reputation, and your reputation is directly linked\
    \ to your address. For example, on the first page of `Rarible`, you will see the\
    \ top sellers over the last 30 days linked to their addresses. Let's say you built\
    \ up a reputation, have been working very hard, and made it to this top seller\
    \ list over the last 30 days. However, suddenly, your wallet has now been hacked,\
    \ and you can no longer use that wallet. This is very hard to rebuild unless you're\
    \ someone who has a million followers. \n\nIf you are someone like Mark Cuban,\
    \ and your wallet was hacked, you can just go to `Twitter` and notify your followers\
    \ that your wallet was hacked and put the new address link to your new wallet.\
    \ But if you're an up-and-coming artist, or you're just new in the NFT space,\
    \ you could have been working and grinding for over a year, building up a reputation.\
    \ All of a sudden, the address you created, the reputation tied to your address,\
    \ is at risk. You can no longer use that wallet, and it even gets worse. \n\n\
    When it comes to NFT, you can set royalties, so if you create art and set a 10\
    \ or 20% royalty for every time that NFT is resold. Those royalties will go back\
    \ to the wallet that created the NFT. So, if you created a wallet, built up a\
    \ reputation, sold NFTs, and you're getting royalties on those royalties that\
    \ will go back to the original wallet. If your wallet is hacked or if you fell\
    \ for this phishing scam, now someone has access to your wallet, and you can no\
    \ longer use that. You have to move on.\n\n## General Crypto World\n\nThis is\
    \ only a fraction of what goes on in the crypto world. The crypto world is filled\
    \ with scams. Wherever there is money, that is where scammers will go. The ecosystem\
    \ of the crypto space is filled with money. There are also phishing links that\
    \ can be sent to your email. You might get the scam from “Ledger” saying you're\
    \ locked out of your wallet and asking you to provide your 12 words or 24 words\
    \ seed phrase. Never share your seed phrases! Never! The only time you're ever\
    \ going to use your seed phrases in crypto is when you initiate it. Remember that\
    \ you are the one creating or restoring a ledger wallet or the other wallets.\n\
    \nSo, when you get the email, it’s probably a scam. It also can be seen in exchanges,\
    \ such as `Coinbase`. Fake emails look like they are from `Coinbase`, saying you\
    \ have been locked out of your account, change your password, click this link\
    \ go ahead. This is a phishing scam. So, whenever you receive an email, you are\
    \ not the one that initiated it; always be cautious. If you do ever get something\
    \ from a site like `Coinbase`, maybe it is real, but the way you verify this is\
    \ not by clicking the link you were sent, instead of entering the app the normal\
    \ way you normally do. Do not respond to emails or links that you did not initiate.\n\
    \n## Crypto Giveaway Scams ‘Elon Musk’\n\n‘Elon Musk’ crypto giveaway scams have\
    \ stolen at least $587,000 from victims. This type is one of the most prevalent\
    \ kinds of crypto scams and is usually found on social medial platforms like `Twitter`\
    \ and `YouTube`.\n\n### How do they work?\n\nThe hacker will impersonate or compromise\
    \ a prominent company or public figure and claim to be giving away crypto. If\
    \ you want to take part in these giveaways, you have to send an amount of crypto\
    \ first to the address they advertise. They often promise to send back double,\
    \ triple, or even more what you sent to them. They want you to feel you are going\
    \ to miss a huge opportunity if you don’t do this. Usually, they specify the exact\
    \ amount of crypto being given away, like “100,000 BTC giveaway.” Then they will\
    \ use fake accounts to comment and make it look like other people are receiving\
    \ the cryptocurrencies. Their goal is to make you fear missing out and rush to\
    \ send crypto to the scammers even before you consider carefully whether this\
    \ giveaway is real or not.\n\n### YouTube and Twitter Giveaways\n\nOn `YouTube`,\
    \ you may watch some live stream videos that a company or a celebrity is talking\
    \ about something entirely unrelated to NFT and crypto. But there are full of\
    \ bots in the comment section claiming they received a giveaway. You may even\
    \ see some fake giveaway accounts have blue verified checkmarks on `Twitter`,\
    \ making them look more legitimate. Some bots will reply to the tweets claiming\
    \ the giveaways are real, and they just received. What they are doing is to create\
    \ some “social proof” that the giveaways are legitimate.\n\n## Protecting Yourself\n\
    \nSo far, almost all types of crypto or NFT giveaways are scams. There is a similar\
    \ pattern that these fake giveaways follow: they pretend to be someone else, and\
    \ then ask you to send crypto before they give you more back. The best way to\
    \ protect yourself is to educate yourself and gain the ability to identify this\
    \ kind of scam. Crypto transactions are irreversible, which means that you cannot\
    \ get your money back. So, once your crypto is sent to those fake giveaway addresses,\
    \ it’s gone forever. This is also the reason that this kind of scam is highly\
    \ effective and keeps recurring. The bottom line is that if anything sounds too\
    \ good to be true, then it’s very likely a scam. Think twice before you sent your\
    \ crypto to others.\n\n### YouTube Impersonators\n\n![](image_rsrc1TX.jpg)\n\n\
    ### Message Example\n\nYou may receive some messages or emails like the above\
    \ from some Youtubers, but actually, they are not from the Youtubers you like\
    \ and follow. They look real, and very hard to tell what's fake or what's real.\
    \ The way they speak can sound very genuine, and at the end, they'll say something\
    \ like “reach out to me” or “send me money.” However, these are scams too. YouTubers\
    \ usually cannot get to followers' emails. So, make sure if you are not the one\
    \ initiating, it is a scam. In the crypto space, always make sure you are the\
    \ one that asks for the information first.\n\n# CHAPTER 15:     Myths and Misconceptions\
    \ About NFTs\n\nThis chapter will�talk about myths since we've provided you with\
    \ an overview of the concept.\n"
