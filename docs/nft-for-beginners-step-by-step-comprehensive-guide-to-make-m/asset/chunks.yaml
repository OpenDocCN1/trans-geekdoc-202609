- fmt: '

    # History and Key Concepts


    Most books and articles talk about the popularization of NFTs and their beginnings,
    starting with `CryptoKitties`. But the concept was conceived much earlier, so
    now I am going to take you on that journey. Let’s dive into the history of NFTs
    and the key concepts that make these NFTs what they are today.


    ## Bitcoin Colored Coins

    Bitcoin-colored coins were used in 2012 to trade meme artwork. They were also
    known as ‘satoshis,’ the smallest unit of Bitcoin and equivalent to one-hundredth
    of a Bitcoin. They were also named after Bitcoin’s creator, Satoshi Nakamoto.
    These colored coins were only used in very small circles and, hence, were relatively
    unheard of. They didn’t last long because they could only represent a value if
    everyone agreed on that value. This caused major transaction issues when an agreement
    couldn’t be reached.


    ## Quantum

    A piece of artwork called `Quantum` that was sold for a hefty price. Well, that
    piece of artwork is based on what is considered to be the first NFT. Kevin McCoy
    and Anil Dash created a platform for digital art to exist. They did this in 2014
    and presented their idea, but it didn’t take off. It’s for this reason that they
    never patented their blockchain idea and why they don’t own the technology today.
    They are not forgotten though, and Anil Dash is still around in cryptocurrency
    and startup circles. He doesn’t want to sell the original presentation video as
    an NFT just yet. But Kevin McCoy was quite prepared to sell `Quantum`, which is
    acknowledged for what it is and how it helped with the technology and ultimate
    NFT creation.


    ## CounterParty

    `CounterParty` is a financial platform that was peer-to-peer and built on the
    blockchain in 2014. It dealt with memes and card games trading. The company was
    created because the creators believed in blockchain technology but didn’t fathom
    how big a part it would play. When memes started being sold, starting with `Pepe
    Frog` between 2015 and 2016, `CounterParty` saw a rise in users. This spurred
    a rare image of this meme becoming the thing to collect, and people were quite
    prepared to spend a lot of money to own a rare `Pepe Frog`. It was this popularity
    that convinced the creators of `Force of Will` to collaborate on the platform
    in 2016. `Force of Will` was a popular trading card game at the time and they
    needed a place to sell their cards. This brought in another surge of sales, ultimately
    showcasing the value of being able to buy and sell such collections online and
    with ease.


    ## Ethereum

    `Ethereum` was created in 2017 as not just a cryptocurrency but much more. The
    company made its headlines based on what it was able to do, but things truly started
    taking off with the release of `CryptoKitties`. This was an NFT game on the `Ethereum`
    platform that allowed its users to breed rare digital cats using blockchain technology.
    The popularity of the game was the catalyst for NFTs to start taking center stage.
    It was so popular that it brought with it a lot of media attention, and in a sense,
    started getting more people interested in online collecting. This gave rise to
    `CryptoPunks`, and now the list is endless as to what you can buy and sell on
    various marketplace platforms, depending on what you want to collect.


    ## Carbon Emission Issue

    NFTs require a lot of computing power because they are created using blockchain
    transactions that follow the `proof-of-work` protocol. This simply means that
    one party proves to the other that a certain amount of work was done. It is proven
    by solving a mathematical problem or transaction. It sounds complex and it is.
    However, all of this solving is done with computers that run these equations in
    the background with the help of specific software. By solving these equations,
    the people running these computers or miners get rewarded in cryptocurrency, so
    that is the incentive to have a lot of computers running all the time. The transactions
    are solved at a rapid pace, which has given rise to server farms created just
    for this purpose around the world. Electricity generation at server farms is mostly
    powered by fossil fuels because they are mostly located in countries with cheap
    electricity costs. This in turn creates a huge carbon footprint, which is causing
    a lot of NFT usage pushback. It’s the main reason that many people are hesitant
    to create and sell NFTs despite their popularity.


    `Ethereum` mining is said to consume as much electricity as the country of Ireland,
    and a study done in 2018 found that cryptocurrency mining consumes more energy
    than extracting gold or copper (de la Garza, 2021). Even with these studies, it
    is difficult to calculate exactly what the carbon footprint of an NFT is because
    there are so many factors to consider. Blockchain miners, who are the ones running
    these computers, are located all over the world, so it is difficult to pinpoint
    just how much energy is being used at any given time. So, calculating the carbon
    footprint for each NFT is impossible to determine at the moment. That doesn’t
    mean that there is no impact or that it is not a cause for concern. It is quite
    a big talking point, especially with regards to climate change. The consensus
    is that the power being used needs to be green. Cryptocurrency companies are in
    agreement and most are doing a lot to make changes. There are even marketplace
    platforms that are green and market themselves this way. A few solutions are also
    being investigated by companies, like the `Ethereum` platform, to change the way
    the currency is mined and for its carbon footprint to be decreased drastically.


    ## Green Concepts

    ![00007.jpeg](image_rsrc1TU.jpg)

    All mining could be done using renewable resources, but there are various reasons
    as to why it’s not. The biggest reason is that there are a lot of countries that
    use fossil fuels and the electricity put out is very cheap. That’s why a lot of
    server farms are based in those countries; that, and the incentive to mine is
    a huge reward. It would be difficult to shut these mining operations down and
    force them to use solar or wind power because of the infrastructure costs. `Ethereum`
    is looking to replace mining with staking, which is much less energy-intensive.
    As much as 99.98% of energy will be saved once it gets this concept to be used.
    on other platforms. (Ethereum, n.d.).


    ## Proof-of-Stake

    I explained how the `proof-of-work` protocol works and how cryptocurrency companies
    are looking to replace this high-energy concept with `proof-of-stake`. But what
    is `proof-of-stake`? Transactions still need to be validated for new blocks to
    be created; that doesn’t change. But the validation of these transactions doesn’t
    need vast mining capacity because the energy consumption is low. The hardware
    required to do these transactions are also low; thus, the low-energy consumption
    and validators receive transaction fees, not block rewards, so the rewards are
    different, scalable, and don’t promote large farm mining. How it works is that
    validators need to stake a certain amount of cryptocurrency to become a validator.
    For `Ethereum`, that amount is `32 ETH` and then random validators are chosen
    to either create a new block or to check and confirm other blocks. A huge security
    plus of using this type of validation is that the blockchain is not susceptible
    to a `51% attack`. This can only happen if a miner or mining pool controls 51%
    of the network’s transaction-solving power and then starts creating fraudulent
    blocks that benefit itself and invalidating those that don’t. With `proof-of-stake`,
    no one, not even a hacker, would be able to own 51% of the cryptocurrency network,
    and even if they do, there wouldn’t be any point in attacking since that would
    attack their share as well.


    ## Off-Chain Transactions

    Off-chain transactions denote transactions that take place outside of the blockchain.
    They can be done by swapping private keys to a prevailing wallet or employing
    a third party. This is what PayPal does to honor its transactions. Off-chain transactions
    can be done immediately, with no transaction fees and better security. But at
    some point, these do need to be added to the blockchain to be recorded on the
    ledger. So, there is a cost, but it’s not huge. The biggest tradeoff for this
    at the moment is that it sacrifices trustworthiness, transparency, and decentralization,
    everything for which the blockchain and cryptocurrency were created.

    '
