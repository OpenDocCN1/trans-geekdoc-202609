  \    - 体育收藏品的重生\n    - 视频游戏资产\n- 第 19 章：NFT 股票\n    - Mattel, Inc.\n    - Funko,\
  \ Inc.\n    - PLBY Group\n    - 为什么非同质化代币很重要？\n    - 结语\n\n\n\n\n# 引言\n\n“技术是真实的。影响也是真实且永久的。”\
  \ 这是亿富级投资者、NBA 球队所有者马克·库班（Mark Cuban）的一番话，他正处于区块链和非同质化代币技术兴趣爆发的前沿。根据库班的说法，这种货币技术转变的影响是可衡量且持久的。一旦稳定下来，它将颠覆资金的投资、收集、玩耍和制造方式。无论是体育、娱乐、游戏、艺术、音乐还是时尚，非同质化代币都完美适用于任何行业或领域。在过去的几个月里，这项革命性的技术被讨论得越来越多，但并不是每个人都还了解它，它的潜力也尚未被完全想象。\n\
  \n非同质化代币，更简单地称为 `NFTs`，是独特的数字资源。事实上，非同质化代币创造的是一种可验证的数字稀缺性，从而产生了独特的价值。那些对区块链、加密货币和代币有一定了解的人知道我们在说什么，并能够更好地理解这种技术。简单来说，你可以说同质化代币是由记录在\
  \ `blockchain` 中的数字信息组成的，这些信息赋予了对象一种可识别为所有权的特定权利。代币本质上是防伪认证证书，而“同质化”指的是加密货币的可复制性和可交换性，例如\
  \ 2009 年创建的加密货币 `Bitcoin`，甚至是法定货币（美元、欧元、英镑等）。非同质化代币恰恰通过其非同质性——可区分的——也就是说，即它们的不可交换性。它们可以提供虚拟资产的独特表示，并且是真实、独特且加密的。\n\
  \n例如，`.jpg` 文件中的图像可以被复制无数次，但代币不能，是代币本身赋予了图像价值，使其能够像最精美的艺术品一样被购买、出售和收藏。因此，购买的代币是媒体或数字作品的证明，而不是作品本身。因此，`NFTs`\
  \ 赋予了数字创作作品其作为物理作品所拥有的所有权利：稀缺性、真实性和所有权。这使得一个 `NFT` 如此与众不同。非同质化代币正在永远改变数字世界。这有点像艺术家为一个人创作了一件艺术品：许多人可能在网上欣赏它并赞赏它的美，但只有购买它的人才拥有所有权，包括转售并获利的能力。\n\
  \n谈论 `NFT` 就像在提到一个正在指数级增长的平行宇宙。事实上，最近对 `NFT` 的描述使用了“狂热”和“泡沫”等词汇来描述现状。2020 年，`NFT`\
  \ 市场的交易量超过了 2.5 亿美元，是 2019 年的四倍，而且在本文写作时，它们仍在不断增长。这个世界迅速吸引了名人、国际艺术家、体育人物、数字创意人员、企业家、影响者以及许多人的关注。\n\
  \n几个引人注目的案例在网络上流传。例如，很难不听说 NBA 的 `NFT` 平台 `NBA Top Shot` 如何将勒布朗·詹姆斯（Lebron James）的一段精彩扣篮视频以\
  \ 20.8 万美元出售，或者林赛·罗汉（Lindsay Lohan）如何将自己的照片卖出 5 万美元以上，并将收益捐给慈善。这些对非同质化代币产生兴趣的明星，通过使其进入主流并创造创额金额，让它们进入了焦点焦点。此外，`NFTs`\
  \ 几乎出现在每一个行业中，从商业和社交媒体到音乐、艺术、体育和娱乐。\n\n数字文件的独占性导致它们以数百万的价格出售。根据细粒化的价格分级原则，艺术家高价格出售他们最独特的作品，随后的作品以较低的价格出售。此外，`NFTs`\
  \ 之所以伟大，恰是因为它们具有消除所有中间环节的能力：艺术家和买家以一种全新的方式建立直接接触。\n\n著名的合成器流行音乐女星、歌手 Grimes，也是知名企业家埃隆·马斯克（Elon\
  \ Musk）的女友，她在最受欢迎的市场之一 `Nifty Gateway` 上出售她的 `NFTs`，在不到 20 分钟内赚取了 580 万美元。该系列名为\
  \ `War Nymph`。它描绘了反乌托邦世界中拿着标枪、带有纹身和长精灵耳朵的有翅儿童。这位歌手先在推文中宣布了她的 `NFTs` 拍卖，简单地写道：“进入虚空。”关于这个数字世界，她宣布：“数字领域让领域变得更稀缺、更珍贵。它提供了逃避和完美。有时我想要不完美，想要真实的生活。有时我想要完美。”\n\
  \n和她一样，在音乐行业中，狮子乐队（Kings of Leon）最近也加入了这一狂热。他们在 `Yellowheart` 平台上发布了专辑 `When You\
  \ See Yourself as an NFT`。该专辑以传统格式提供给所有人，但 `NFT` 版本的以 50 美元出售，每份都提供不同的福利：数字下载、演唱会门票和专辑的限量版黑胶片。通过这种方式，数字变成了物理，反之亦然，创造了独特且原始的供应。\n\
  \n就在一多年前，推特创始人 杰克·多西（Jack Dorsey）也拍卖了他 2006 年首次推文的 `NFT`，推文内容是：“刚设置 Twitter”。它以\
  \ 290 万美元出售，并将收益捐给了慈善。他出售该 `NFT` 的平台是 `Valables by Cent`。如果连推特这样流行的平台创始人都进入了 `NFT`\
  \ 领域，我们可以假设那里很有潜力。\n\n# 第 1 章：什么是 NFT？\n\n2015 年，传奇说唱团体武当帮（The Wu-Tang Clan）产生了一个极其独特的想法。他们制作了一张只有一份的专辑。他们将其放在一个精美的盒子里。他们在拍卖会上将其卖给了出价最高的人。那张专辑被所谓的“制药兄弟”马丁·舒克里（Martin\
  \ Shkreli）以 200 万美元购买。购买这张专辑带有条件：在发布 88 年之前，所有者不允许对其进行任何复制或分发。新所有者被允许客人听，但仅限于他们家里。这是一个极稀有的非同质化物理资产。武当帮的非正式领袖\
  \ RZA 制作了可能是第一个真实的音乐非同质化代币。这是对 `NFT` 是什么的一个非常简单、清晰的例子。武当帮独一无二专辑 `Once Upon a Time\
  \ in Shaolin` 与音乐 `NFT` 之间的区别在于，`NFTs` 以数字形式存在，分布在无数计算机系统中。\n\n\n\n\n\n## 简短回答\n\
  \n你可能提出的第一个最好的问题是：什么是非同质化代币（NFT）？或者具体来说，“同质化”（fungible）到底是什么意思？同质性是指事物互换性和易于替换的特性。同质化的物品很容易被复制替换。而非同质化的物品则不然。\n\
  \n以批量生产的 T 恤为例。T 恤是在流水线上生产的，大多数都是相同的。如果你的 T 恤破了，你可以再订一件，它与你之前拥有的那件完全无法区分。而非同质化的东西就像马格里特（Magritte）的艺术品原作。一件原作物品，一件独一无二的东西，就是极致非同质化的。\n\
  \n现在考虑以下情况：那件被替换的 T 恤可能不是同质的。如果那件 T 恤对那个人有很大的情感价值，那么它对其他人来说是同质的，但对所有者来说是非常非同质的。如果它只是一件普通的白色内衣，你可以几美元买一包\
  \ 10 件装，但你是在红辣椒辣椒乐队演唱会上得到它的——当时主唱安东尼·基迪斯（Anthony Kiedis）脱下并扔进观众席，而你正是那个接住它的人。这让它突然比同设计同制造的普通衬衫更有价值。现在它附带了经历，带有了名人效应。那件衬衫不仅仅是棉纤维。那件原本同质的衬衫现在变成了非同质的。\n\
  \n同质性的终极形式是现金。任何一张 20 美元纸钞都可以被任何其他一张 20 美元纸钞替换，或者被两张 10 美元或四张 5 美元纸钞替换。货币发明的首要原因就在于这种同质性。货币是一种交换媒介，一种衡量价值并允许人们方便交换商品的方法。在现金出现，黄金是标准的交换媒介；一种易交易、难伪造且不会腐变的贵金属。\n\
  \n加密货币也是现金这样的交换媒介，但像 `Bitcoin` 和 `Ethereum` 这样的加密货币比黄金或现金更加同质。任何 `bitcoin` 都和任何其他\
  \ `bitcoin` 一样。它们是完全同质的。现金的同质性略低，因为它们有不同的序列号，理论上讲，你可能在不知情的情况下拿着一张从银行被偷的 20 美元纸钞。尝试花费带有该序列号的钞票可能会导致你在完全没有过错的情况下与警察发生一段令人尴尬的对话。\n\
  \n我们在 Napster 时代学到数据是无限可复制的。当音乐存储在光盘上时，你需要花钱制作光盘。你必须打印封面艺术、制作塑料壳，并使用卡车和船在世界各地的之间运输所有零件和最终产品。当最终产品上市时，货架空间是有限的。在互联网上，数字形式的歌曲理论上可以被复制无限次，并传给无限多的人，唯一的成本是服务器空间和电费。\n\
  \n任何类型的数据都极具同质性。只要你能控制数据不被损坏，任何歌曲副本都可以通过相同的文件轻松且廉价地复制。\n\n加密货币总体来说，特别是 NFT，其作用是在一个没有稀缺性的数字世界中增加稀缺性。NFT\
  \ 提供了一个数字稀缺性的新领域，在这里，独一无二的数字资产存在并可以交易。这就是它们成为大轰动的原因，也是为什么阅读这本书是非常值得时间的。\n\n### 同质性与价值\n\
  \n要理解为什么 NFT 以及像 `Bitcoin` 和 `Ethereum` 这样的加密货币有价值，我们必须谈论一些抽象的东西。我们必须准确理解什么是价值以及价值源自何处。\n\
  \n简而言之，价值源于我们。价值源于人类的需求。价值并不存在我们之外。价值并不内在存在于事物之中。\n\n爱因斯坦伟大的观察是，物体在空间中的速度和方向只有在其他物体速度和方向的背景下才有意义。在完全黑暗的真空中，如果没有恒星和行星等其他物体作为参照，就不可能确定物体运动的速度或方向。\n\
  \n价值和货币运作是一样的。一个事物的价值需要与其他事物进行比较。这听起来有点深奥，但它比看起来要容易理解。\n\n一瓶水值多少钱？瓶装的 16 盎司反渗透过滤水在内华达州的价格比密歇根州要贵（等等，原文先说是“Nevada”后说成“Michigan”——保持原文语境）。\n\
  \n### 数字财产的新时代\n\n你仍然困惑为什么有人会花 6900 万美元买一张 JPEG 吗？这个类比应该帮助你理解。考虑像修拉（Seurat）这样的名画。那幅画画的是所有穿着整齐、在公园里闲逛的人，但如果你近看，你会发现图像只是点。这幅非常著名的画由芝加哥艺术学院收藏，估计价值\
  \ 6.5 亿美元；远高于 Beeple 的作品。你可以找到这幅法国画的 JPEG 并免费下载。你可以花大约 20 美元订一张海报挂在墙上。是的，一个副本 20\
  \ 美元。而不是一个副本值 6.5 亿美元。海报印刷品的价值完全无法与原作相提。\n\n请允许我们问一个愚蠢的问题然后回答它：为什么原作值这么多钱，而副本却一文不值？因为它是原作。考虑一个假设的科幻场景。想象有一台机器，可以扫描一幅画并确定每一个笔触，然后画出一件复制品，一个到分子水平都完美的伪造品。这个复制品精确到扫描机器无法区分它们。假设这台机器可以在流水线上生产成千上万幅分子完全相同的画。从逻辑上讲，这些画的价值是相同的。它们是一样的。唯一的区别是其中一是原作。这决定了一切。原作画仍然值\
  \ 6.5 亿美元。而复制品只值那些略贵一点的海报副本的价格。\n\n事物的来源很重要。安东·基迪斯穿过的 T 恤之所以有价值，唯一的原因就是他穿过它。NFT\
  \ 有价值是因为是谁制作或拥有过它。\n\n\n\n\n\n# 第二章：NFT 是如何创建的？\n\n许多 NFT 是以太坊区块链上创建的，并使用 `ETH`\
  \ 货币支付费用。但并不意味着这些 NFT 必须不断移动才能出售。NFT 存储在一个虚拟钱包中，该钱包随用户进入不同的平台，允许他们访问该钱包。\n\n你需要像\
  \ `MetaMask` 这样的应用程序，以便每个平台都能访问此钱包，从而确保买卖交易顺利进行。许多市场平台允许你在无需支付任何费用的情况下创建 NFT，例如\
  \ `OpenSea` 和 `Mintbase`。大多数市场平台会向你收取称为“燃料费”（gas fees）的费用，作为 NFT 创建或铸造的成本。这些费用频繁变化，而且可能昂贵。但一旦支付了这些费用并将\
  \ NFT 上传到网站，它就已完成创建并准备好出售。\n\n\n\n\n## 历史与核心概念\n\n大多数书籍和文章都在讨论 NFT 的普及及其起源，通常从 `CryptoKitties`说起。但这个概念在更早就已经构思好了，因此现在我将带你开启那段旅程。让我们深入探讨\
  \ NFT 的历史以及让这些 NFT 变成今天的核心概念。\n\n### 比特币彩色币 (Bitcoin Colored Coins)\n比特币彩色币于 2012\
  \ 年用于交易迷因艺术品。它们也被称为“中聪”（satoshis），这是比特币的最小单位，等于比特币的百分之一。它们还以比特币的创始人中本聪（Satoshi Nakamoto）的名字命名。这些彩色币当时仅限在非常小的圈子内使用，因此相对较不为人知。它们并没有持续多久，因为只有当每个人都认同某个价值时，它们才能代表价值。当无法达成共识时，这会导致严重的交易问题。\n\
  \n### Quantum (量子)\n一件名为 `Quantum` 的艺术品以高价售出。事实上，这件艺术品被认为是第一个 NFT。Kevin McCoy 和\
  \ Anil Dash 为数字艺术的存在创建了一个平台。他们在 2014 年做到了这一点并展示了他们的想法，但并没有火起来。正因为如此，他们从未对自己的区块链想法申请专利，这也是为什么他们现在没有拥有这项技术。不过，他们并没有被忘记，Anil\
  \ Dash 仍然活跃在加密货币和初创公司领域。他还不想将原始演示视频作为 NFT 出售。但 Kevin McCoy 已经准备好售出 `Quantum`，它的价值以及对技术和最终\
  \ NFT 创建的帮助得到了认可。\n\n### CounterParty (对手方)\n`CounterParty` 是 2014 年建立在区块链上的点对点金融平台。它处理迷因和卡牌交易。该公司的创建是因为创造者相信区块链技术，但没有想象到它将发挥多大的作用。当迷因开始出售时（从\
  \ 2015 年到 2016 年间的 `Pepe Frog` 开始），`CounterParty` 的用户开始增加。这促使这种迷因的稀有图像成为收藏品，人们非常愿意花费巨资来拥有一只稀有的\
  \ `Pepe Frog`。正是这种人气说服了 `Force of Will` 的创造者在 2016 年在该平台上进行合作。`Force of Will` 是当时一种流行的交易卡牌游戏，他们需要一个销售卡牌的地方。这带来了另一一波销售热潮，最终展示了在网上便捷地买卖此类收藏品的价值。\n\
  \n### 以太坊 (Ethereum)\n`Ethereum` 创建于 2017 年，它不仅是一种加密货币，意义远于此。该公司因其功能而登上头条新闻，但随着\
  \ `CryptoKitties` 的发布，事情才真正开始快速发展。这是 `Ethereum` 平台上的一个 NFT 游戏，允许用户使用区块链技术培育稀有的数字猫咪。该游戏的流行是\
  \ NFT 开始占据中心地位的催化剂。它是如此，以至于引发了大量的媒体关注，并在某种意义上，开始让更多人对在线收集产生兴趣。这催生了 `CryptoPunks`，而现在根据你想要收集的内容，在各种市场平台上可以买卖的列表已是无止尽了。\n\
  \n### 碳排放问题\nNFT 需要大量的计算能力，因为它们是使用遵循 `proof-of-work`（工作量证明）协议的区块链创建的。这意味着一方向另一方证明他们完成了特定数量的工作。这是通过解决数学问题或交易来证明的。这听起来很复杂，事实也是。然而，所有这些求解都是在特定软件帮助下在后台运行这些方程的计算机完成的。通过解决这些方程，运行这些计算机的人或矿工将获得加密货币奖励，这就是让大量计算机一直运行的动力。交易以极快的速度解决，这导致在全球范围内建立了专门为此目的创建的服务器农场。服务器农场的发电主要由化石燃料驱动，因为它们大多位于电价廉廉的国家。这反过来产生了巨大的碳足迹，导致了许多对\
  \ NFT 使用的抵触。这是许多人尽管 NFT 很流行但仍犹豫于创建和销售它们的主要原因。\n\n据报道，`Ethereum` 挖矿消耗的电量相当于爱尔兰整个国家，2018\
  \ 年的一项研究发现，加密货币挖矿消耗的能量比开采黄金或铜还要多 (de la Garza, 2021)。即使有这些研究，要准确计算 NFT 的碳足迹也是困难的，因为有许多因素需要考虑。运行这些计算机的区块链矿工遍在世界各地，因此很难确定在任何给定时间使用了多少能量。所以，目前无法确定每个\
  \ NFT 的碳足迹。这并不意味着没有影响，或者它不是令人关注的原因。这是一个非常大的话题，特别是涉及到气候变化时。共识是所使用的电力必须是绿色的。加密货币公司对此表示同意，大多数公司都在做很多改变。甚至还有有些市场平台是绿色的并以此进行营销。一些公司也在研究一些解决方案，以更改货币的挖掘方式并大幅减少碳足迹。\n\
  \n### 绿色概念\n![00007.jpeg](img/image_rsrc1TU.jpg)\n所有的挖矿都可以使用再生资源，但由于各种原因导致没有这样做。最大的原因是有许多国家使用化石燃料，且提供的电力非常廉价。这就是为什么许多服务器农场位于这些国家；由于挖矿的奖励是巨大的，关闭这些挖矿作业并强制它们使用太阳能或风能是困难的。`Ethereum`\
  \ 正在寻求用质押取代挖矿，这样消耗的能量要得多。一旦这一概念被应用，将节省 99.98% 的能量。(Ethereum, n.d.)。\n\n### 权益证明\
  \ (Proof-of-Stake)\n我解释了 `proof-of-work` 协议是如何工作的，以及加密货币公司如何寻求用这种高能耗概念改为 `proof-of-stake`。但什么是\
  \ `proof-of-stake`？为了创建区块，交易仍然需要验证；这一点没有改变。但验证这些交易不需要巨大的挖矿能力，因为能量消耗很低。执行这些交易的硬件要求也很低；因此，低能耗使得验证者获得交易费用而非区块奖励，所以奖励是不同的、可扩展的，且不会促进大型矿场挖掘。它的原理是验证者需要质押一定数量的加密货币才能成为验证者。对于\
  \ `Ethereum`，金额为 `32 ETH`，然后随机选择验证者来创建新区块或确认其他区块。使用这种验证类型的一个大安全优势是区块链不受 `51% 攻击`。这只有在矿工或矿池控制了网络\
  \ 51% 的交易解决能力并开始创建有利于自己的欺区块时才会发生。在 `proof-of-stake` 中，没有任何（即使是黑客）能够拥有 51% 的加密货币网络，即使他们拥有，攻击也没有意义，因为那也会损害他们自己的份额。\n\
  \n### 链外交易 (Off-Chain Transactions)\n链外交易是指发生在区块链之外的交易。它们可以通过将私钥交换到主流钱包或聘用第三方来完成。这就是\
  \ PayPal 为了履行其交易而所做的。链外交易可以立即完成，没有交易费，且安全性更高。但在某些时刻，这些交易需要被添加到区块链中记录在账本上。所以，这是有成本的，但并不巨大。目前这种最大的权衡是牺牲了信任度、透明度和去中心化，而这些正是区块链和加密货币创立的初衷。\n\
  \n\n\n\n\n# 第三章：NFT 是如何工作的？\n\n每一个非同质化代币都由两部分组成：一部分存在于区块链上的代币，另一个是资产本身，无论它是数字艺术品、视频还是任何其他数字资产。区块链在仅处理代币和加密货币时，能源效率极低，因此能源需求是数字资产没有与其指向的代币一同存储在区块链上的原因之一。区块链上的任何其他代币（如\
  \ `Bitcoin`）都是根据其价值定义的，而不是根据其独特性。NFT 则恰恰相反。它们根据其独特属性定义，而不是任何内在价值。NFT 的价值就像大多数收藏品一样，取决于人们愿意为它们支付多少钱。例如，如果你购买了一条被铸造为\
  \ NFT 的推文，这这条推文并与代币一起存储在区块链上，它仍然留在 Twitter 上。然而，如果由于某种原因 Twitter 关掉了，你的数字资产也会随之消失。你购买的\
  \ NFT 无法让它回来，而且没有实物资产可以进行主张。还会发生另一种情况，即不法之徒会将受版权保护的数字资产铸造成 NFT 并出售。如果你足够不幸地买了这种东西，而政府以版权法的名义没收了该数字资产，那么你在区块链上代币的所有权并不能保护你。尽管如此，这并没有阻止人们寻找变现\
  \ NFT 的方法、投资 NFT 以及将其作为独一无二的独特物品进行收藏。\n\n## 关于你真正拥有什么的问题\n\n这是逻辑、抽象思维和哲学发生碰撞的部分，因为这完全取决于\
  \ NFT 的虚拟价值和可用性。加密货币的价值在它作为一种新事物出现时引发了激烈争论。许多怀疑者将其视为想象的货币。毕竟，如果你无法手握它或将其把它放入自动售卖机中，你凭什么理由证明它是真实的呢？这是一个你可以深陷其中且永远触不到底的心理黑洞。许多被人们视为具体现实的概念同样是无形的。友谊、爱、恐惧，或者婚姻证呢？结婚证能保证你对他人内心的所有权吗？该证书唯一保证的是，当事情没有按计划进行时，你有某些法律救济手段。该证书所代表的无形现实——那些无法通过该证书进行治理或控制的事——从一开始就可以被解释为不是真实的。但对许多人来说，它们是非常真实的，而且他们围绕它们建立生活。所以，就像结婚证、驾照、狩猎许可证、商业合同或土地契约一样，这一切都指向无法量化的无形事物，因此区块链上的非同质化代币指向了买家或收藏家可能非常珍的价值。如果它对他们来说是真实的，那么它就足够真实了。作为一个想要加入\
  \ NFT 热潮的人，如果他们愿意为你创建的 NFT 花钱，那么它就足够真实了。![00006.jpeg](img/image_rsrc1TV.jpg)\n\n\
  ## 区块链\n\n基于区块链的 NFT 允许用户拥有数字资产。然而，这种数字资产的所有权与物理所有权不同，因为这些类型的资产仅存在于特定的、专门构建的语文中，例如市场、游戏等，这使得移动变得困难，至少目前是如此。当区块链技术发挥作用时，它可以为数字资产提供一种协调层，授予用户的所有权和管理权限，并改变开发者与其资产之间的关系。这一切之所以成为可能，归功于\
  \ 6 个关键属性，这些属性为 NFT 设定了规则，并代表了使其独特的特征。\n\n### 标准化\n\n标准的作用是创建一套统一规则，允许 NFT 跨平台集成、实现互操作性，并通过扩展其适用性来增加其实用价值。与所有类型的技术一样，标准代表了在特定范围内可重复和共享的操作方式。标准的产生是为了通过消除必要的流程以节省时间和资源的需求，并在社区内被普遍认可。参考标准总是必要的，以确保每个人都以合规的方式运行。当数字资产在区块链内进行代币化时，这些代币通过通用、可重用和可继承的标准注册。换句话说，这些是开发者约定并开发的方法，允许\
  \ NFT 以不同的方式运行。每个数字资产的表示方式都不同——例如，游戏表示其集合的方式可能与活动票完全不同。NFT 基于一个通用的公共系统，其标准包括所有权、传输和访问控制等基本功能。这意味着，如果几个购买的\
  \ NFT 基于相同的标准，那么它们可以在同一个应用程序内相互操作。程序员随后可以创建使用基本相同代码的应用程序，使去中心化平台（如以太坊网络）内的所有代币都能运行。以太坊区块链上的三个主要的\
  \ NFT 代币化标准是：\n\n- `ERC721`\n- `ERC998`\n- `ERC1155`\n\n\n\n\n\n`ERC` 缩写代表以太坊请求建议（Ethereum\
  \ Request for Comments）。任何人都可以创建标准，但由作者对其进行解释并在社区内推广其支持。由于以太坊基于区块链技术，没有任何人可以接管并对协议进行更改或调整。`ERC`\
  \ 的创建是为了让人们能够以太坊网络提供信息或引入新功能，因此 `ERC` 是程序员向网络提出更改的方式。数字 `721`、`998` 和 `1155` 代表这些提案的代码。`ERC721`\
  \ 由 Cryptokitties 在 2018 年引入，每个被领养、培养和养大的猫都由一个 `NFT` 代表。在这个标准之前，人们可以创建如 `Ether`\
  \ 等同质化代币，但通过 `ERC721`，程序员可以在同一个智能合约中创建不同属性、特征和类型的代币。`ERC721` 是允许创建和交换 `NFTs` 的 `NFT`\
  \ 标准。虽然它是最流行的跨平台、易于集成且可用的 `NFT` 标准，但根据用场景，它也存在若干低效率之处。`ERC998` 具有特殊操作，其创建目的是允许在网络中通过单笔捆绑交易传输多个\
  \ `ERC721 NFTss`，而不是进行多次交易。通过这种标准，你不仅拥有一个 `NFT`，而且该 `NFT` 还可以包含你自己的 `NFTs`，就像某种包一样。如果一个\
  \ `NFT` 被售出，依附在其上的所有代币也会一并出售。因此，转移 `NFT` 的组成部分意味着转移整个关联元素的层级结构。例如，一只 Cryptokitty\
  \ 可能拥有一个猫抓和一个可能包含同质化代币的食盆，在出售 Cryptokitty 时，与其相关的所有物品也会被售出。\n\n`ERC1155` 代币是一种标准代币，它可以在其控制范围内存储表现如\
  \ `ERC20` 或 `ERC721`（或两者兼有）的代币且位于相同的地址下。`ERC1155` 由 Enjin 创建，这是一个以太坊平台，允许在同一个合约中创建非同质化代币和同质化代币。`NFT`\
  \ 发行的标准化使得更高程度的互操作性成为可能，从而使用户受益。这意味着独特资产可以相对轻松地在不同应用程序之间传输。`ERC1155` 的最佳例子可以在区块链游戏中找到。无需为每个游戏物品需要一个新合约，可以使用同一个合约创建多个物品。此外，例如，如果游戏中的武器和加密货币都是可收集的，你可以使用\
  \ `ERC1155` 编写这两者，极大地减少了高效运行基于区块链的游戏所需的资源。\n\n## 互操作性\n正如我们已经提到的，所有的 `NFTs` 使用相同的标准，是为了让它们能够处于同一层级并在同一个以太坊平台上运行。这使得\
  \ `NFTs` 跨多个生态系统进行传输，在这些生态系统中它们是立时可见且可交易的。因此，基于相同的使用特性——即通过标准化——互操作性允许 `NFTs` 在开放市场上自由交易。\n\
  \n## 市场性\n这是全球用户首次可以创建 `NFTs`，并让这些代币能够立即在整个生态系统的市场中可用。在这里，人们可以购买、交易、出售和拍卖 `NFTs`。这种属性的程度体现在从封闭市场内的销售转变为具有开放自由经济的市场所提供的可能性。任何用户都可以非常轻松地在全球范围内创建并交易\
  \ `NFTs`。\n\n## 流动性\n这个术语用于描述频率。高流动性意味着物品销售得很快。要理解一个市场是有流动性的还是缺乏流动性的，最好的方法是看三个指标：成交量、订单簿深度以及买入和卖出价格之间的差，即买卖价差。\n\
  \n## 不可变性与可证明的稀缺性\n不可变性，顾其名，是区块链保持不变的能力。简单来说，区块链内部的数据无法被更改。在技术本质上，区块链被配置为不可变的数据库，无法操纵已存在的数据。每个区块都包含信息（例如交易详情），并使用一种称为哈希值（hash\
  \ value）的加密原理。该哈希值由每个区块生成的字母数字字符串组成。每个区块不仅包含指向自己的哈希，还包含了前一个区块。这确保了区块在追溯上是配对的。区块链技术的这一特性确保没有人能入侵系统或更改存储在区块中的数据。最流行的哈希函数是\
  \ `SHA256`，即安全 256 位哈希算法。哈希值保护着每段代码。哈希过程生成一个 64 个字符的字符串。无论输入的大小如何，被称为数字签名的固定长度字符串始终是相同的。这指的是录入的确切数据，而该哈希值的关键属性是它是无法被解码的。“不可变性”（immutable）一词被用来描述永远无法改变的事物。不可变性是为数字资产印上真实性的关键，同时也引入了稀缺性。不可变性意味着，例如，在游戏中属于特定某人的东西不能被移动或更改。\n\
  \n## 可编程性\n`NFTs` 是完全可编程的。例如，它们可以被编程为响应所有者采取的触发或动作。它们还可以响应外部触发因素，例如游戏的时间或分数。`NFTs`\
  \ 的编程可能性是无限的。\n\n\n\n\n\n# NFT 是如何工作的？\n\nNFT 使用各种框架进行创建和发行。ERC-721 是以太坊区块链上发行和交换非同质化资产的标准，是这些框架中最广为人知的。NFT\
  \ 构建在以太坊的永久区块链上，这意味着它们是不可更改的。没有人可以夺走 NFT 的所有权或对其进行复制。它们还是“无许可性”的，这意味着任何人都可以在不请求许可的情况下制作、购买或出售\
  \ NFT。最后，每个 NFT 都是独一无二的，并且供所有人使用。是的，它就像一张独一无二的收藏卡，展示在永远开放的商店橱窗里，每个人都可以欣赏。然而，在任何给定时间内，只能由个人（准确地说，是一个加密货币钱包）拥有它。\n\
  \n本书将以虚拟艺术品（如一张画）作为案例。然而，在 NFT 平台上，需要注意的是，这不仅仅关乎那幅画（画可以很容易被复制）。它作为区块链上的数字实体存在的这一事实是其与众不同的之处。ERC-1155\
  \ 是最新且增强的标准。它允许特定合约同时包含同质化和非同质化代币，这开启了一个无限可能的世界。NFT 发行的标准化允许更强的互操作性，从远来看有利于用户。它本质上意味着特定资产可以轻松在各种应用程序之间共享。书中后后将介绍更多关于\
  \ NFT 标准化的内容。\n\n如果你想存储并欣赏你 NFT 的优雅，Trust Wallet 是你的首选。你的 NFT 将拥有一个地址，就像其他区块链代币一样。值得记住，如果没有所有者（包括\
  \ NFT 发行者）的同意，NFT 不能被复制或交换。NFT 可以在 OpenSea 等开放交易所进行交易。这些市场将买家和卖家聚集在一起，每个代币都有其意义。NFT\
  \ 根据其本质会随着市场供需的变化而产生价格波动。但此类物品如何被认为是有价值的呢？就像任何其他实用物品一样，有用物品的价值是由认为它有价值的人赋予的。价值本质上是一种共识。无论是法币、稀有宝石，还是汽车，它们都有价值，人们也相信它们有价值。为什么数字收藏品不行呢？这就是任何有价值物品变得珍贵的方式。\n\
  \n## NFT 的特性\n\n-   **不可互操作性**：CryptoPunks 不能作为 CryptoKitties 游戏的角色，反之亦然。这也适用于交易卡牌等收藏品；一张\
  \ Blockchain Hero 卡片在 Gods Unchained 交易卡牌游戏中无法运行。\n-   **不可分割性**：NFT 是不可分割的，与比特币的\
  \ Satoshis 不同，它们不能被分成更小的部分。它们只以完整单元的形式存在。\n-   **不可破坏性**：每个代币都无法丢失、删除或复制，因为所有 NFT\
  \ 数据都通过区块链技术保存在区块链上。这些代币的所有权也是不可更改的，这意味着玩家和持有者拥有他们的 NFT，而不是制作它们的公司。这与从 iTunes 商店购买音乐形成对比，在那里，消费者并不一定拥有他们购买的音乐；他们是在购买听音乐的许可。\n\
  -   **可验证性**：在区块链上存储过去所有权数据的另一个优势是，数字艺术等物品可以追溯到原始创作者，消除了对第三方认证的需要。\n\n## NFT 的稀缺性\n\
  \nNFT 的制作者负责资产的稀缺性。考虑购买足球比赛的门票。NFT 的制作者可以选择复制品的数量，就像活动经理可以决定出售门票的数量一样。例如，5000 张普通票通常是完全相同的复制品。例如，分配了座位的门票可以以倍数发行，它们非常相似但略有不同。在另一种情况下，创作者可能希望制作一个独一无二的\
  \ NFT 作为独特的收藏品。每个 NFT 还有一个特定的标识符（类似于标准“门票”上的条形码），并且在这些情况下只有一个持有者。NFT 的计划稀缺性是非常重要的，这取决于制作者的决定。制作者可能希望让每个\
  \ NFT 都完全特，以产生稀缺性，或者他们有充分理由制作数千份副本。请记住，所有这些材料对公众开放。\n\n## NFT 与以太坊\n\n以太坊允许 NFT\
  \ 用于多种目的：\n\n- 显示所有权历史很容易，因为交易记录和代币元数据是公开可验证的。\n- 在交易验证后，几乎不可能“窃取”交易所有权。\n- 交易 NFT\
  \ 可以点对点进行，不需要接受高额佣金的网站。\n\n所有以太坊项目的“后端”都是相同的。换句话说，所有以太坊产品都可以相互通信，使得通过产品访问 NFT 变得。你可以在一个资产上购买\
  \ NFT 并在另一个资产上出售它。作为制作者，你可以同时在多个资产上展示你的 NFT，每个资产都将拥有最新的所有权详情。由于以太坊从不宕机，你的代币仍然可以出售。\n\
  \n## 碎片所有权\n\nNFT 的创建者还可以为资产创建“份额”。这允许交易者和粉丝拥有 NFT 的一部分，而无需购买整个资产。这扩大了 NFT 铸造者和收藏者的可用机会。碎片化的\
  \ NFT 不仅可以在 NFT 市场中交换，甚至可以在像 `Uniswap` 这样的 DEX 上交换。这确保了会有更多的买家卖家。NFT 碎片的价格可能用于确定其总价格。你有更好的机会拥有并从你关心的事物中获利。如今，由于价格因素而无法购买\
  \ NFT 变得更加困难。你可以在 NIFT 了解更多关于碎片所有权的知识。\n\n从原则上说，这将允许人们像拥有毕加索画一样。你将成为毕加索 NFT 的股东，这意味着你可以对利润分配等问题进行投票。在不遥的将来，拥有\
  \ NFT 的份额可能会使你能够参与资产管理的去中心化自治组织 (`DAO`)。基于以太坊的组织让陌生人（如全球资产所有者）安全地合作，而无需相互信任。这是因为没有全体成员的同意，就没有资金可以花费。这是一个不断发展的市场——NFT、`DAO`\
  \ 和碎片化代币以不同的速度进步。然而，由于它们都说同一种语言：以太坊，它们的所有技术保持不变并可以随时协作。\n\n# 第 4 章：为什么 NFT 有价值？\n\
  \n加密货币与 NFT 的一个关键区别是加密货币的供应是固定的。NFT 的供应可以根据创建者的意图而改变。供需背后的经济学将决定你的代币价值。如果可用代币很多，人们以高价出售它们将变得更加困难，因为许多其他人也在试图出售他们的代币。这个概念在考虑数字收藏品（如\
  \ CryptoKitties）时最重要。当 CryptoKitties 最初发布时，流通中的猫很少。每只猫都很值钱，因为可用的猫非常少。现在有成千上万只 CryptoKitties\
  \ 在流通中，每只猫的价格下降了，因为人们现在更容易以高价出售他们的猫了。毕竟，许多其他人也在试图出售他们的猫。\n\n\n\n\n\n## 为什么 NFT 如此昂贵？\n\
  \n传统的数字资产已经存在多年，但多年来并没有发生太大变化。然而，随着 NFT 的出现，未来几年它们可能会发生巨大变化。它们可以通过变得更加安全、获得开发者和游戏玩家的广泛采用，以及获得交易所和其他组织的更广泛支持来发生改变。因此，NFT\
  \ 的价值可能远高于传统的数字资产。这是因为它们有潜力创建游戏内物品的真实所有权，甚至在未来可以创建土地，甚至是汽车或房屋等有形资产的所有权。\n\nNFT 特别之处的另一个原因是，它们对于任何想在自己的游戏或平台上使用它们的人来说都是真正的开源。正因如此，开发者可以创建独特的游戏和应用程序，而不必担心在将\
  \ NFT 与区块链或智能合约等技术结合时可能出现的版权侵权或其他法律问题。这是因为一切都内置在 NFT 协议中，而且一切都是开源的。\n\n##效用\nNFT\
  \ 的效用价值取决于它的使用方式。游戏属性和门票是高效用价值两个两个类别。例如，一艘稀有且强大的 `Crypto Space Commander` 战舰在 `2019`\
  \ 年以 `$45,250` 售出。NFT 门票的价值等于活动票的成本。然而，实现互操作性是非常困难的。90% 的 NFT 游戏玩家一次只玩游戏。这是因为开发者必须首先建立一个具有吸引力用地的庞大游戏生态系统。`Dapper\
  \ Labs` 和 `Engin` 都在这一方向努力。尽管还有许多未知因素且需要大量的时间和精力，但整个行业都感到兴奋。\n\n## 所有权历史\nNFT 的价值由发行者和前任所有者的身份决定。著名的艺术家或拥有声誉的企业也会创建或发行具有高所有权背景价值的\
  \ NFT。增加你的资产价值有两种方法。\n\n第一种与具有强大实的公司或个人合作发行 NFT 代币。这会自动吸引用户和流量进入生态系统。例如，第一个获得批准的代表\
  \ F1 赛车的 NFT 以 `$113,124` 的价格售出。第二种选择是转售著名人物曾拥有的 NFT。目前很难确定前任所有者是谁，尽管这些是很有用的链上数据信息。为了增加\
  \ NFT 的价值，市场平台和卖家应该拥有一个易于使用的监控界面。例如，`OpenSea` 将突出显示卖出 NFT 最赚钱的投资者地址，并列出他们拥有的其他 NFT。\n\
  \n### 未来价值\nNFT 的潜在价值由估值变化和未来现金流共同决定。投机驱动估值，有时是市场升值的主要动力。例如，在 `2017 年 12 月`，`CryptoKitty\
  \ #18` 的价格在短短三天内从 `9ETH` 跳升到 `253ETH`。有人可能认为基于估值的市场波动对 NFT 是有害的。然而，投机是人类存在的自然部分，也是当前金融体系不可或缺的一部分。NFT\
  \ 原所有者获得的利息或股息被称为未来现金流。例如，`SuperRare` 每当其作品在二级市场出售时，都会向 NFT 品的作者支付 `3%` 的版税。未来公司将从\
  \ `Defi` 发明中借鉴创意。NFT 是可以租赁和抵押以获得进一步现金流的资产。在游戏中，玩家可以请求特定的游戏资产一天以完成任务。\n\n### 流动性溢价\n\
  NFT 价值更高是因为它有很大的流动性。流动性溢价是链上资产估值应高于链外生成资产的主要原因。任何拥有 `ETH` 的人可以在二级市场上无缝交换 `ERC` 标准的\
  \ NFT，从而增加了潜在买家的数量。由于流动性降低了拥有 NFT 的风险，投资者倾向于投资交易量大的 NFT 类别。即使 NFT 在相关平台关闭后失去了效用价值，只要人们还能买卖它，高流动性的\
  \ NFT 就能保留其价值。另一方面，不基于 `Ethereum` 的 NFT 标准面临缺乏流动性的问题，这些平台上产生的 NFT 价值经常会被折扣。为了增加互动和\
  \ NFT 流动性，公司必须创建允许用户交易的代币经济模型。例如，体育赛事可能会导致玩家交换资产以在游戏中保持竞争力，而 NFT 资产如果闲置太久就会贬值。\n\
  \n# 第 5 章：如何确定 NFT 的价值？\n\n## 收藏品与共识\n关于收藏最重要需要理解的一点是，它们没有客观的内在价值。每当你购买股票时，你都在购买公司未来现金流的一部分。因此，你可以通过估计未来现金流并将其折现到现值来计算内在价值。虽然并非所有交易者都这样做，今天今天只有少数人这么做，但内在价值是可以估算的。另一方面，收藏品没有未来现金流，仅依赖共识来决定其价值。价值和销售性取决于群体根据对收藏品的评估而产生的集体需求。除非某物是一个群体的一部分，否则它不是收藏品，也不值得收藏。个人可能因为\
  \ `Basquiat` 作品带给他们的感受而崇拜它。尽管如此，社区对创作者天才的认可产生了对作品的需求，导致原作价值数百万美元，而不是在街角只值 `$20`。虽然收藏品在金钱方面没有内在价值，它在买家对资产的情感感受方面可能有内在价值，这就是为什么任何普通收藏者的第一条规则是购买你喜欢的物品。至少，即使物品被证明是没用的，你也能从中获得一些快乐。\n\
  \n## 要点\n非同质化代币不仅仅是收藏品；它们还有许多现实世界的用途。稀缺性、效实用实体是决定 NFT 内在价值时注意的三个重要方面。非同质化代币收藏者和交易者可以在\
  \ `Binance`（全球领先的艺术家 NFT 市场）找到多样化的 NFT，以及来自全球领先品牌和创者的溢价和盲盒收藏。加密货币领域从未静止。然而，每隔几年，一种新型加密货币就会对市场产生重大影响，导致估值飙升和许多新应用程序的出现。作为数字与现实世界的纽带，NFT\
  \ 已经渗透到去中心化领域的几乎每一个领域。NFT 如其名，是独特的代币，赋予所有者对特定资产的不可更改的所有权。NFT 在加密货币市场上非常受追捧，作为一种可能与艺术品、鞋子或视频游戏收藏品相关的资产类别。\n\
  \n\n\n\n\n## 影响 NFT 价值的因素\n\n由于资产类别非常年轻，寻找非同质化代币（NFT）的准确价值非常困难。虽然像《娜丽莎》这样的实体作品和\
  \ NBA 球员卡之类的实物收藏品有固定价值，但考虑非同质化代币的交易者可能会很难判断特定资产或收藏品是否值得投资，以及他们是否真的想要或需要它。然而，随着 NFT\
  \ 在许多行业中获得关注并产生巨大价值，决定其价值的三个主要变量已经出现。\n\n### 稀缺性\n这一因素决定了某个 NFT 有么稀有以及“难以寻找”。来自知名数字艺术家的独特作品或由知名人物开发的\
  \ NFT 都是稀缺性的例子。另一个不常见的的考虑因素是，此类 NFT 对视频游戏可能产生的影响。人们被这类 NFT 的内在价值所吸引，由于 NFT 持有者还拥有区块链所有权证明，这种价值得到了增强。这建立了一种独特性，并定义了\
  \ NFT 的溢价价值。首批 `CryptoKitties`、`Beeple` 的 `Everydays — The First 5000 Days` 等，都是对加密货币领域产生特殊影响的绝佳例子。\n\
  \n### 用途\nNFT 在现实世界中的用途决定了它的效用，无论是在物理还是数字环境中。例如，某些非同质化代币可以在游戏中作为虚拟领地、法术或角色，使它们不仅仅是收藏品。正如此，非同质化代币具有即时价值，这种价值根据底层项目的接受程度随时间而增长。随着去中心化游戏社区的增长，越来越多的玩家愿意花巨资购买一张特殊的卡片。`Euro\
  \ 2020 NFT Tickets`、`Decentraland` 房产，以及《巫师世界 Gwent 纸牌游戏》中的 `Geralt of Rivia` 等收藏卡都是这些\
  \ NFT 的例子。\n\n### 实体性\n某些 NFT 与实体物品相关，在实体性和所有权不可篡改性方面提供价值。原则上，任何可以由非同质化代币支持以建立所有权的物品都可以。但这并不意味着该物体变得稀有或昂贵。该物品为参与者提供的实用性、稀缺性和个人满足感将影响其内在价值。例如，拥有一个与明星一起参加独家活动的非同质化代币门票，从内在和个人角度来看都比拥有一个与瓶盖相关的非同质化代币更有吸引力。那些具有实体价值的\
  \ NFT 特别适合根据市场实用性进行短期交易。因为像门票一样，这些 NFT 可能有有效期。其他收藏品，例如 NFT 绑定的限量版鞋子，随着可用产品数量的减少而随时间增值。\n\
  \n### 品牌\n没有品牌的收藏品将没有市场，因此其价值不会因为稀缺性而提高。品牌决定了大多数收藏品的价值。艺术家、主题的内在特质以及影响者的外在特质共同构了任何特定收藏品的品牌。主题是该收藏品的核心。这可能是一组日常作品，例如\
  \ `Beeple's Everydays: The First 5,000 Days`、8 位艺术品，或者像 `TopShot` 这样的体育明星。某些 NFT\
  \ 与影响者相关，例如带有 `Creator Coins` 的 `BitClout` 实验，它们象征着名人。由于创作者和主题是密不可分的，它们都是该物品的根本方面。一个\
  \ `Beeple` 就是一个 `Beeple`，并且将永远是一个 `Beeple`。`LeBron` 的 `TopShot` 永远是 `LeBron` 的 `TopShot`。`Beeple`\
  \ 的作品价值以及 `LeBron TopShot` 的价值会随着他的成功而起伏。\n\n### 稀缺性\n在讨论市场用户获得的价格之前，我们必须首先分析稀缺性。稀缺性是收藏品品牌产生价值的助推器。稀缺性具有类似于品牌的子类别：绝对稀缺性、相对稀缺性和可用性。由非同质化代币支持建立所有权的物品数量被称为绝对稀缺性。世界上只有\
  \ 10,000 个 `punks`。由于创作者和主题是密不可分的，它们都是物品的根本方面。一个 `Beeple` 就是一个 `Beeple`，并且永远是一个\
  \ `Beeple`。`LeBron` 的 `TopShot` 永远是 `LeBron` 的 `TopShot`。`Beeple` 的作品价值以及 `LeBron\
  \ TopShot` 的价值会随着他的成功而起伏。随着新版本的发布，`TopShot` 的数量预计会增加。相对稀缺性是指与整个集合相比的稀缺程度。只有 10,000\
  \ 个 `Cryptopunks`、88 个 `zombies`、24 个 `apes` 和 9 个 `aliens`。NFT 的一个主要特征是已知稀缺性。交易者确切知道特定产品有多少个。相比之下，体育卡、车辆或鞋子等商品可能不知道特定物品有多少个。创作者决定了绝对稀缺性和相对稀缺性，这可能会影响产品。如果品牌价值超过稀缺性，它将始终从稀缺性中受益。为了产生初始价值，品牌必须是独特的。绝对和相对稀缺性影响可用性，当强力需求触发时，稀缺性意味着供应有限，提供了上行的空间。\n\
  \n### 市场\n市场根据品牌和稀缺性决定价格。之前的价格、评估价格和二级交易都是影响价值的市场因素。之前的价格是物品价值的基石。评估价格通常作为未来价格的底价。这种原则经常例外，特别是当\
  \ NFT 类别处于繁荣时期时，可能会对品牌产生负面影响。专家通过考虑之前的价格、艺术家和稀缺性来确定价格。二级交易也经常被用于确定房地产。在 `Cryptopunks`\
  \ 的情况下，任何特定的 `punk` 都可以作为其他 `punk` 的比较；然而，二级交易并不考虑物品的独特属性。一个 `ape` 的销售可以提供有关价值的线索，但不是一个具体的数字。\n\
  \n### 宏观\n另一个影响所有收藏市场的因素是经济，它与物品本身无关。当经济良好时，人们更愿意在各种物品上花钱。在定价方面，经济是一个独特且不可预测的因素。除了存在，加密货币是关于\
  \ NFT 的另一个因素。当加密货币相对于货币表现良好时，NFT 的需求将增加。我相信如果加密货币市场失败，NFT 的需求将遭受损害。任何情况下，如果加密货币价格上涨，用加密货币购买的\
  \ NFT 价值将会贬值。\n\n### 拥有历史\nNFT 的价值由创作者和前持有者的身份决定。热门品牌的创作者或公司通常创建或发行具有巨大拥有历史的 NFT。有两种增加资产价值的方法。第一是与强大品牌的公司或人物合作\
  \ NFT。例如，第一个代表 F1 赛车的授权 NFT 以 `$1,124` 拍卖。第二种选择是转售曾由影响力人物拥有的 NFT。尽管这些信息很有价值，目前很难确定前所有者是谁。为了提高非同质化代币的价值，市场和交易者可以提供简单的跟踪界面。例如，`OpenSea`\
  \ 可以突出投资 NFT 盈利的交易者的地址，并列出他们拥有的其他 NFT。\n\n### 未来价值\n非同质化代币的未来价值使用价值变化和未来现金流计算。投机驱动价值并有时是价格飙升的主要决定因素。例如，`CryptoKitty\
  \ #18` 的价格在短短三天内从 `9ETH` 飙升到 `25ETH`。许多人认为基于价值的价格对 NFT 是有害的。然而，投机是人类行为的自然方面，也是现有金融体系的重要方面。创作者通过取得正确的平衡可以提高\
  \ NFT 价值并吸引新用户。有限供应和投机影响定价。NFT 产品的价格表现图可以引导投机，也可以展示价值的增长。运动鞋市场 `StockX` 价值达十亿美元，因为它鼓励消费者对运动鞋价格进行下注，创造了一个独特的运动鞋市场。NFT\
  \ 初始所有者收到的利息或版税被称为未来现金流。例如，`SuperRare` 每次在 NFT 作品后期出售时都会向生产者支付 `3%` 的版税。公司可以从未来的\
  \ DeFi 开发中借鉴想法。NFT 是可以租赁和抵押以获得更多现金流的资产。在游戏中，玩家可能会请求某个游戏资产使用一天以达到目标。\n\n### 流动性溢价\n\
  更大的流动性溢价意味着更高的 NFT 价值。流动性溢价是链上产品应该比离线开发的产品价值更高的因素。任何拥有 `ETH` 的人可以在二级市场上无缝交易 `ERC`\
  \ 标准 NFT，增加了可能买家的数量。由于流动性降低了持有 NFT 的风险，交易者会交易交易量大的资产类别。\n\n---\n\n## NFT 价值框架与机会\n\
  NFT 的价值是通过四个因素计算的，其中某些因素之前解释过。\n\n\n\n\n\n- `NFT = 用途 + 所有权历史 + 未来价值 + 流动性溢价`\n\n\
  根据非同质化代币所代表的资产，价值在这四个因素之间进行灵活分配。交易者可以使用这一范式来判断非同质化代币是否具有投资价值，NFT 创作者则可以借此考虑提高 NFT\
  \ 价值的方法以吸引用户和交易者。核心信息是，NFT 为创作者和资产持有者创造价值开启了大量新机会。\n\n## 作为风险投资的收藏品\n\n任何在品牌建立之前购买的收藏品都应被视为早期创业投资（种子前轮或种子轮）。在一家公司成立之前投资收藏品，类似于在找到产品与市场匹配点（product-market\
  \ fit）之前投资一家 `comp`。你实际上是在赌注创作者、主题或两者都会因为某一群影响者的关注而成名。如果你本身就是影响者，那就更好了。在这种情况下，你就是一个增值型\
  \ `VC`。\n\n在构建收藏品 `VC` 组合时，必须考虑稀缺性。完全稀缺性会使收藏品类别更具吸引力，你必须将资金投入到合理且罕见的产品中。在品牌成立前的收藏品情况下，市场竞争将很低，类似于种子前和种子轮\
  \ `VC`。任何存在的比较都会影响当前价值，但它们不应该对你对收藏品类别的整体评估产生太大影响。预见到大量的“零”。你最好像建立初创公司一样建立多元化的组合，因为大多数品牌永远不会成功。因此，任何发展中的收藏品投资最大的对冲手段就是获取你喜欢的东西，而不仅仅是你预测价值会上升的东西。\n\
  \n# 第 6 章：有哪些类型的 NFT？\n\n目前有很多不同类型的非同质化代币，每种都有其独特的用途和价值主张。代币可以分为四大类：代币、收藏品、数字商品、公证服务和衍生品。所有这些类别都可以在\
  \ Cryptassist 今年晚时候运行时找到。我们将在下面详细介绍每一种。\n\n### 代币 (Tokens)\n代币是最基础的 NFT 类型；它们代表某些东西，但在特定功能之外没有用途。最好的例子是\
  \ `CryptoKitties` —— 每个代币代表一只独特的猫，你可以通过繁殖它们来创造稀有幼猫，或与其他玩家进行交易。\n\n### 收藏品 (Collectibles)\n\
  收藏性 NFT 与代币类似，但通常被认为更有价值，因为它们的数量有限。它们背后通常有一个叙事，这赋予了代币更多意义和价值。收藏品的示例包括 `CryptoKitties`（拥有像“The\
  \ Goku”和“The Genesis”这样可爱的名字）和 `Rare Pepes`（最初在 Reddit 上作为笑话创建的青蛙表情包）。收藏品可以根据是数字还是实体的进一步细分为子类别，而实体收藏品最具体的例子是像《堡垒之夜》或《使命召唤》等游戏中的游戏内物品。\n\
  \n### 数字商品 (Digital Goods)\n数字商品本质上是收藏品的数字版本。它们通常是生命周期短、具有定义数量且供应有限的物品。示例包括《堡垒之夜》或《糖果传奇》等游戏的皮肤，以及如《宝可梦\
  \ Go》、《战士》或《之地》等游戏中硬币等更稀有的物品。数字商品的最新示例是 `Crydee’s NFT Trading` 及其 `Denarium` 版本的美国金鹰金币。\n\
  \n### 公证服务 (Notary Services)\n公证服务代币不限于任何特定物体或数字产品；相反，它们仅仅代表了作为其他事物公证的能力。`Cryptassist`\
  \ 已经启动了两个不同领域的公证服务：一个名为“人人可证”（Everyone Can Notary）的公证服务，允许你查看并批准提交到区块链的所有文档；以及面向银行的公证服务，允许他们将电子文档直接发送到区块链。\n\
  \n### 衍生品 (Derivatives)\n像 NFT 一样，衍生品的价值高于传统的金融资产。然而，衍生品的独特之处在于它们不代表实际资产，也不存在于区块链上。这意味着衍生品在其代表底层资产（例如实物黄金）之外没有任何实体价值。另一方面，传统的金融资产是有价值的；这些资产的价值取决于金融市场的稳定性。衍生品的主要用例是作为其他资产类别价格波动的对冲。目前，交易的一些衍生品是期货和期权；然而，这一领域正在快速进化，交易者目前正在尝试一些新概念以创建新的衍生品产品。\n\
  \n## NFT 或非同质化代币\n\n`NFTs` 或 `Non-Fungible Tokens` 是一种数字收藏品，可以在区块链上进行购买、出售和交易。今天市有很多不同类型的\
  \ NFT，但让我们深入了解三个最著名的：\n\n- `联盟英雄极稀皮肤` —— 这些备受追求的皮肤为玩家提供了许多游戏内福利。当你拥有其中一个时，你可能可以玩不同于自己的角色，或访问专属内容。某些专属皮肤只能通过参加比赛获得。\n\
  - `Cryptokitties` —— `Cryptokitties` 是一个 `Ethereum DApp`，它使用 `smart contracts` 来模拟独特数字猫的所有权。在游戏中，你可以收集、繁殖和交易你的数字猫来制作新的幼猫，或将其出售给其他玩家以获得\
  \ `Ethereum`。该游戏变得非常流行，在 2017 年 12 月的某一天，超过 300 万美元的 `Ether` 花在了小猫身上。\n- `Tetris\
  \ Ultimate Drop` —— 这种代币让你访问 `Tetris ultimate drop mode`，该模式可以在 `Xbox One`、`PlayStation\
  \ 4` 和使用智能手机 App 的智能手机等多个设备上玩。该游戏下载量已超过 2000 万，难怪有这么多俄罗斯粉丝。\n\n## NFT 的幕后是谁？\n\n\
  现在你已经知道了 NFT 是什么样的以及它们是如何作为数字收藏品的，让我们来看看今天该领域的关键参与者：\n\n- `Coinsilium`: 这家公司最初是一家投资公司，但很快转变为加密资产开发者。他们正致力于将区块链技术的优势与传统的法律合同、合性和资产管理相结合。他们开发了名为\
  \ `CoSi` 的 NFT。\n- `EverdreamSoft`: 这是一个游戏开发公司，以其游戏《Spells of Genesis》（`SoG`）闻名。该公司最近发布了首个基于区块链的《卡牌游戏》，带有游戏内市场。这允许玩家将不需要的内容转换为游戏内货币或其他可能喜欢的卡。\n\
  - `Enjin` (`www.enjincoin.io`）：`Enjin` 是一个游戏社区平台，为游戏开发者提供创建、管理和推广游戏的工具。除了拥有可在平台游戏使用的游戏内货币系统外，他们还拥有名为\
  \ `ENJ` 的 `ERC-20` 代币，可在 `Enjin 生态系统内购买物品。\n- `Gameflip`: `Gameflip` 是一个市场，你可以在可以使用名为\
  \ `FLIPs` 的加密货币购买和出售视频游戏。你还可以买卖游戏物品、游戏密钥和数字下载。\n\n\n\n\n\n# NFT 是被动收入投资\n\n这类代币的大部分价值来自二级市场，人们可以在那里将其交易或出售给他人以换取加密货币或其他\
  \ NFT。这就是为什么 NFT 更像是一种被动收入投资，而不是像购买具有投机价值的股票之类的支出。许多不同的游戏开发公司正寻求利用区块链技术来创建独特的收藏品；然而，我们只重点介绍了了目前众多项目中的三个。很容易理解为什么它们如此受欢迎，因为它们不仅收藏起来很有趣，还能为所有者提供被动收入。现在你已经了解了\
  \ NFT 是什么样以及如何使用它们，让我们来看看今天该领域的主要参与者吧。\n\n# 第 7 章：如何投资 NFT？\n\n加密货币领域正在趋于成熟，现在购买代币的途径比刚开始时多得多。如果你一直在考虑进入这一领域，这将帮助你规避一些可能让新手在追求加密财富之路上绊倒的难理解之处。非同质化代币（`NFTs`）试图通过将每个代币绑定到游戏或其他虚拟世界的特定单元来创建数字稀缺性。它们代表了没有内在价值的独特虚拟物品。明确的是，`NFTs`\
  \ 并不是代表公司股份的代币。相反，它们是可以在基于游戏的世界上进行所有和交易的特定游戏代币。你可以把 `CryptoKitties` 看作是类似的；它们是数字世界中数字猫的数字繁殖卡，但除了人们愿意支付的费用外，它们在现实世界中没有任何实际价值。虽然你可以购买代币在游戏中使用，但大多数\
  \ `NFTs` 仅在加密交易所上交易，而不用于游戏内部。因此，如果你想玩一个游戏并获得在该游戏中作为奖励使用的代币，我建议你查看其原生代币。这是因为一旦项目完成，大多数\
  \ `NFTs` 将变得几乎无用武处。现在由于我们已经涵盖了 `NFTs` 是什么以及它们与传统加密货币的区别，让我们来看一些你购买购买（并可能赢得）它们的方法。注意：这绝不是购买\
  \ `NFT` 方式的详尽列表。这些仅仅是一些最流行的方法。\n\n### 空投 (Airdrops)\n\n`NFTs` 经常通过空投发放。“空投”是指项目向用户免费发放代币。假设你足够幸运，找到了一个没有被过度认购的项目。在这种情况下，你可能只需持有现有的代币就能获得免费代币（这最近发生在\
  \ `OmiseGo` 身上，他们为持有 `OMG` 发放了代币）。\n\n*   `NFT Tracker` — 一个跟踪所有活跃和即将推出的 `NFT` 项目的优秀网站。它定期更新，并允许你根据空投价格、截止日期等进行过滤。\n\
  *   `Token Tracker` — 一个非常简单的网站，仅跟踪空投，但没有 `NFT Tracker` 那样的过滤功能。\n*   `CoinMarketCal`\
  \ — 另一个寻找即将发生的加密活动（如空投）的优秀网站。这里的唯一缺点是它们没有像 `NFT Trackers` 那样采取任何特殊措施来区分它们。它们只是按时间倒序简单列出它们能找到的所有内容，没有过滤器或统计数据。\n\
  \n### 立即购买购 (Buy It Now)\n\n购买 `NFT` 最常见的方式是通过交易所。你很可以在任何支持它们的各大交易所上找到你正在寻找的代币。大多数代币都兼容\
  \ `ERC-721`，因此可以在 `IDEX` 和 `ForkDelta` 等去中心化交易所（DEXes）上交易。然而，在进行任何交易之前，你应该双重检查，以确保一切都能正常运行。\n\
  \n### 交易 NFT 的一些建议\n\n*   **首先检查代币是否受支持！** 我遇到过的最大挫折是我当我进行第一次交易时，发现该交易对不受支持。查看你喜爱的交易所的费用表，如果你计划进行大量交易，请设置合适的费用。\n\
  *   **阅读细则！** 许多交易所对你如何提取 `NFTs` 有限制，或者它们可能要求你在申请提取之前持有一定数量的该代币。例如，`Binance` 要求你提取的代币成交的\
  \ 100% 必须来自交易。\n*   **不要忘记特殊活动！** 经常会有竞赛和赠送活动获得免费的 `NFTs`，所以确保你也关注各种社区以获取这些信息。\n\
  \n### 自己创建！ (Create It Yourself!)\n\n最后，你也可以创建自己的非同质化代币。许多 `NFTs` 是 `ERC-721` 代币（一种特定的以太坊代币，被编程为非同质化），因此你可以遵循创建任何其他\
  \ `ERC-721` 代币的相同步骤。不要让这个吓人的术语吓跑你！这是一个非常直接的过程——尽管很耗时。\n\n## 为什么我需要花时间选择我的钱包？\n\n\
  如果你只存储一种加密货币，似乎你不需要考虑你选择的钱包类型。然而，投资不仅仅是从交易所购买单个硬币或代币。你选择什么种的钱包将决定该特定钱包提供什么种的服务。\n\
  \n*   **交易所 (Exchanges)** — 对于几乎每个代币，都有一个你可以购买或出售它的交易所。某些交易所提供多种币，而另一些则专注于少数特定的币。一种常见的交易所类型是加密货币兑加密货币（也称为“加密货币兑法币”）交易所。这些交易所通常允许你交易加密货币或法币。\n\
  *   **硬件钱包 (Hardware Wallets)** — 硬件钱包是考虑到安全设计的物理设备。它们离线存储你的私钥，并通常内置了不同的安全功能。其中一些还允许你连接到并通过内置应用程序交易代币。这里的很大缺点是它们只适用于特定的加密货币，因此如果你有多种投资，你可能需要多个。\n\
  *   **软件钱包 (Software Wallets)** — 软件钱包是在线存储你的私钥并将计算机连接到互联网的应用程序。这些钱包并不适合存储大量的加密货币，但它们允许你在任何交易所平台上使用任何币。这是存储加密货币最方便的方式，因为没有物理设备需要存储和管理。\n\
  *   **纸钱包 (Paper Wallets)** — 纸钱包是可以打印的私钥纸质。这是存储加密货币最安全的方法，也是新投资者安全存储硬币的最简单方法。这里的唯一缺点是，纸钱包并不总是免受攻击，所以如果你计划使用，请务必只使用可靠的来源。\n\
  *   **硬件安全模块 (Hardware Security Modules - HSM)** — 硬件安全模块并不总是被称为“钱包”，但它们的功能相似。它们通常被称为“私有交易所密钥”或“私钥”以及类似的术语。它们有时也被称为“冷钱包”或“隔离钱包”，但硬件安全模块并不离线存储私钥，因此从技术上讲它们不认为是冷钱包。\n\
  *   **Mist/以太坊钱包 (Mist/Ethereum Wallet)** — Mist 和以太坊钱包相似，因为它们在线存储私钥。以太坊钱包还内置了交易所，允许在币之间进行交换。然而，它们必须购买自己的加密货币。\n\
  \n\n\n\n\n交易所是购买加密货币最简单的方式。然而，如果你在多种币种中有很多投资，那么直接从区块链上购买你的加密货币可能是个好主意。这是因为你能够对自己的投资拥有更多控制权，例如根据每种币种的价格为每种币种创建一个个人损益表。这意味着一次只持有一种单一币种或代币！不过，这不是你处理加密货币的最佳方式，因为如果价格开始下跌，风险将极高。相反，你需要进行多元化，这是我们在上面已经讨论过的。\n\
  \n## 为什么我需要多元化？\n通过多元化，你可以消除投资中的大部分风险。如果一种货币的价格下跌，不会对你所有其他投资产生负面影响。此外，如果你在不同的时间购买币种，你可以分别卖出它们，这可以在不需要花费大量时间或精力的情况下增加收益。从本质地说，这是确保你在价格下跌时不会亏钱的好方法。大多数钱包和交易所都有内置功能，允许用户轻松地将币从交易所账户转移到他们控制的个人钱包中。它还减少了中心化公司对你加密货币的控制。HODL！——HODL\
  \ 的意思是“死死持有”，这正是当你的币种或代币价格下跌时你需要做的。持有你购买的货币，直到价格回升，因为如果你是低买高卖，价格下跌几乎是不可避免。当价格足够低时，你应该在最低价格卖出，这样即使价格下跌你也能盈利。\n\
  \n## 我该如何从亏损中恢复？\n为了帮助在市场下跌时防止额外损失，并在回升时转化为利润，最好是遵循以下步骤：\n- 等待你的币种或代币价格上涨 50% 或更多。\n\
  - 等待至少 3 个月，然后利用这个机会一次性买入所有亏损的货币。由于你是同时购买所有这些加密货币的，它们的价值将比你逐个卖出要高得多。现在你已经投入了所有的买单，请等待市场再次上涨。一旦价格上涨\
  \ 50% 或更多，立即一次性卖掉所有的加密货币。你现在应该根据价格上涨获得利润了。这可能是从亏损中恢复最困难的部分。在等待投资中的每种币反弹时，保持耐心可能是困难的，尤其是如果它们每天下跌得越来越厉害。然而，在这些时期，耐心是有回报的，因为当市场开始回升时，你最终会看到收益。如果你能够等待并正确这样做，从长远来看这也是盈利最简单的方法！\n\
  \n## 我应该如何投资我的钱？\n现在我们已经涵盖了投资加密货币和山寨币的一些通用概念，让我们过一下一些如何投资资金的具体方案。无论你选择哪种方案，记住这些都是具有极高风险的早期项目是非常重要的。你必须理解，你是在自担风险进行投资，并且没有保证这些投资中的任何一个会有回报。\n\
  \n- **HODL**：在谈论加密货币时，HODL 和 Hold 是表达“持有”的简单方式。在涉及你的投资时，这是需要记住的两个关键术语。HODL 意味着你应该持有你的加密资产，直到它们的价值上涨。换句话说，如果你以\
  \ 1 美元的价格购买了一种加密货币，在一周内它上涨到了 3 美元，那么按原价持有直到下一次价格变化。\n\nHOLD 是一个类似的术语，但可能与 HODL 互换使用。使用\
  \ hold 而不是 HODL 时，意味着你不想以任何代价卖出你的加密货币。它也可以意味着你想要长期持有你的币，但这与 HODL 不同。Hold more closely（更密切地持有）是指对加密货币的坚定信念。\n\
  \n- **买入并持有 (HODL)**：购买资产并希望其价格上涨是赚钱最简单的方法，但它仍然非常有风险。对于加密货币来说，价格极快地波动是非常容易的，如果你不小心，可能会损失所有的钱。\n\
  \n- **低买高卖**：这种方法比仅仅购买资产并等待价格上涨需要更多技巧。对加密货币的基本面有深入理解，并有识别币种或代币何时被高估的能力是非常重要的。此外，你愿意持有你的投资至少\
  \ 6 个月或更久也是非常重要的。\n\n- **风险披露**：比特币和其他加密货币是投机性资产，波动性极高。通过投资加密货币来赚钱是不明智的，此内容仅供参考。作者不保证你的投资有任何回报。在决定投资任何加密货币之前，你应该始终进行尽职调查。\n\
  \n## 投资加密货币的简单方法是什么？\n开始投资加密货币可能很困难，但对于可能还没有打算全投入的新投资者来说，有很多很好的选择。以下是一些进入市场的最简单方法：\n\
  \n- **购买币种或代币**：每天都有大量的代币销售和 ICO（首次代币发行）。这些机会可以为你提供投资加密货币的最佳方式，因为你几乎不需要成本就可以参与这些项目。然而，重要的是你要对每个机会进行彻底研究，并仅在符合你风险承受能力的情况下进行投资。\n\
  \n- **加密投资**：几个加密货币投资平台允许你将小额加密货币投资到股票和债券等现实资产中。这是一个尝试水的好方法，而无需投资加密货币这样极高风险的项目。\n\
  \n- **加密货币交易**：有很多交易所允许你多或少直接将你的加密货币交易为其他加密货币、法币甚至现实世界的投资。这些交易所提供极高的杠杆，通常由经验丰富的交易者维护。\n\
  \n- **加密货币挖掘**：如果你对通过挖掘加密货币赚钱感兴趣，请研究挖掘加密货币获取有关如何开始的信息。\n\n# 第 8 章：    NFT 交易、出售与交换\n\
  \n\n\n\n\n## 如果你是创作者或艺术家，如何进行销售？\n\n有多种方式可以售出你的作品。最常见的是传统方式，即售卖你的实体产品或在合同上报价。人们会为你所提供的服务付费，作为回报，他们获得了你提供的服务。从某种意义上说，他们是在购买你的时间。\n\
  \n### 销售作品的策略\n\n如果你是一个创作者或艺术家，并且希望大量销售你的作品，我们该如何销售和营销它呢？我们是出售创作的每一件作品，还是将其包装成更具吸引力的价格点？如果将其包装成更具吸引力的价格点，那会是什么？人们为单件艺术品付多少钱？这里没有规定，完全取决于你作为艺术家或创作者的决定。\n\
  \n如果你想通过艺术过上体面的生活，那么将其小批量包装并出售可能更好。如果你定期出售少量数量的作品，你就能以更高的价格售出。这将鼓励更多人购买你的作品，但每笔交易赚取的钱会较少。\n\
  \n然而，如果你将你的作品组合成一个高质量的手工收藏，那么你就可以每件作品收取更高的费用。如果你将作品包装成专辑或书籍格式，人们会支付更高的价格，因为他们购买的件数更少了。他们买得越多，单价就越便宜。这是一个增加利润率的好方法，因为你可以为那些愿意为你的最终收藏付钱的人每件作品收取更多费用。\n\
  \n如果你希望拥有大规模销售的选择，也许你应该以较低的价格出售单件作品。如果你将它们组合成专辑或书籍格式，人们会为更少数量的作品支付更多钱。然而，出售少量作品将迫使你创作更多的艺术品或产品，才能获得与别人卖出一件作品等等的收入。否则，你在创作一件艺术品上花费的时间和精力将远比那些大批量销售的人多得多。\n\
  \n如果你决定以较小件的形式出售作品，你需要设定价格，以便能够赚到足够的钱维持生活。如果你的艺术品非常有价值，且人们愿意投入大量资金购买多件，那么只要他们愿意持续购买，你就不需要制作那么多艺术。然而，如果市场对你艺术的需求不足或它并不流行，也许你应该出售更廉价的艺术品。这意味着，如果你想通过出售多件低价物品来获得销售，那么每件物品的售价必须非常高。\n\
  \n# 作为 NFT 收藏者，我们如何评估 NFT 的价值？\n\n我们可以创建一个对社区和收藏者都合理的定价结构。要做到这一点，我们需要问自己以下几个问题：\n\
  \n*   什么是好的 NFT？\n*   什么是坏的 NFT？\n*   好的 NFT 和坏的 NFT 有什么区别？\n*   我们如何知道一个 NFT 是否有价值？\n\
  \n如果一个 NFT 是毫无价值的，它就无法被评估。你评估 NFT 的唯一方法是它在社区内是否有价值。如果社区中的某人看重它，也许你也可以。然而，如果它被大范围社区认为是毫无价值的，那么没有人会认为它有用。\n\
  \nNFT 可能出于各种原因变得一不值。可能是因为该项目在很一段时间内几乎或没有进展，也可能是某人从初就没有打算完成该项目。从本质上说，判断一个 NFT 是否值钱有多容易。如果它在社区中确实具有某种价值，你就能看到它并可能供自己使用。\n\
  \n如果你正在通过你拥有的 NFT 销售作品，那么你必须为你的作品建立一套评分系统。你需要决定，如果同一物品以 NFT 而非传统货币出现，是否想要收取更多费用。如果是的话，人们需要多付多少钱？确定一个\
  \ NFT 价值最简单的方法就是看其他人为它支付了多少。这意味着，如果人们愿意为每份支付更高的金额，你就可以收取更高的佣金。任何基于市场价值的货币也是如此，取决于其当时的市场价值。你还需要知道创作该物品投入了多少时间和精力，以便为你的作品收取一个合理的价格。这将确保你赚够足够的钱来支付账单，并负担制作另一个所需的材料。\n\
  \n# 好的 NFT 和坏的 NFT 有什么区别？\n\nNFT 本身是强大的，因为可以在区块链上以多种方式使用。它可以代表货币、投票权、所有权和/或社区内的成员身份证明。如果你希望你的币获得成功，你需要决定它如何在社区内被使用以及它如何让他们受益。如果你希望你的币被社区认可，你就需要给他们一些回报，让他们选择你的币，而不是他们可能接触到的其他任何币。从本质上说，你需要给他们提供价值。\n\
  \n做到这一点的唯一方法是使用 NFT 创建一种个人可以使用的独特成就感。如果你在出售如 `Bitcoin` 或 `Darkcoin` 这样的 NFT，你只需创建代币并将其放在一个物理盒子里，不解释它是什么或如何运作。这不会持续多久，而且可能根本不会被使用，因为人们对他们看得见摸得着的东西感兴趣，而不是数字代币。\n\
  \n你也可以出售数字代币，但这样你就是在出售数字代币，所以例如，人们没有理由不买 NFT 而购买它。如果你想作为 NFT 创建数字代币，你需要给他们一个购买的理由。这可以表现为除了收藏外没有实际用途的东西，也可能是一种只能用其他数字货币（如\
  \ `Bitcoin`）购买的代币。这被称为 `ERC20` 代币，被许多没有该领域经验的人广泛使用。它让个人能够利用 `Bitcoin` 的价值在区块链上轻松地买卖商品。如果你希望你的币具有价值，你需要给他们一个用其他\
  \ NFT 或数字货币来购买的理由。\n\n# NFT 交易与交换\n\n流动性和交易是任何金融市场的重要组成。某些币的流动性比其他币高，这意味着你可以轻松用其他流动性更好的币购买它们。NFT\
  \ 是可以交易的，但你必须确保它们有足够的流动性让人们感兴趣；否则它们可能完全不会波动。\n\n你还需要将 NFT 上架到多个交易所，如果它们最终在错误的交易所上市，可能会大幅稀释它们的价值。NFT\
  \ 可能会失去价值的原因是，人们可以在社区内轻松将其交换成价值得多的东西，或者与 NFT 用途完全不同的价值。目前，接受 NFT 的交易所非常少。这种情况在未来可能会发生变化，但目前只有少数交易所宣布他们将接受\
  \ NFT。这意味着你可能需要建立自己的交易所，以便让更流行的非同质化代币上架其中。\n\n上述某些信息目前尚未经证实，并可能会发生变化。不要对任何事情想所当然。在做出任何决定之前，请咨询专家或阅读官方文献。\n\
  \n\n\n\n\n# 第 9 章：在哪里购买和投资 NFT？\n\n在正确的市场上出售你的 NFT 非常重要。在这里，我们将讨论一些最流行且最好的平台，你可以使用这些平台创建你的\
  \ NFT 并将其挂架出售。在做出最终决定之前，你必须了解每个市场可以为你提供什么。\n\n## 自主型与精选平台\n\n你首先需要知道的是有两种 NFT 平台供你选择：\n\
  \n- **自服务 NFT 市场**：当你使用自服务 NFT 市场时，你可以你可以创建任何类型的 NFT。这意味着你的 NFT 可以是像 `JPG`、`PNG`\
  \ 或 `GIF` 这样的图像文件、如 `MP4` 这样的视频文件、如 `MP3` 或 `WAV` 这样的音频文件等。使用自服务 NFT 平台的另一个优势是，你通常拥有创建版税的能力。版税是指当你的\
  \ NFT 的原始购买者将其转让给其他买家时所收取的百分比。\n- **精选 NFT 市场**：在精选 NFT 市场中，只有获得授权创建或铸造 NFT 的艺术家才能使用。通常，你会在精选市场上找到最高质量的数字艺术\
  \ NFT，而不是更简单、质量较低的收藏品。\n\n## NFT 市场的要求\n\n所有的 NFT 市场都会要求你设置加密钱包、在钱包中存入加密货币，并拥有该平台的用户账户。你需要加密钱包来存储你的\
  \ NFT，并支付给区块链网络等的任何挂架费用。大多数 NFT 市场提供免费账户，你可以在其中创建你的代币。\n\nNFT 市场与不同的区块链网络合作。你需要检查某个\
  \ NFT 市场提供了哪些区块链网络选项。由于 `Ethereum` 区块链网络目前为止是列出 `NFTs` 最流行的网络，你会发现大多数市场都提供对此的支持。某些\
  \ NFT 市场还会支持新兴的区块链网络，例如：\n\n- `Algorand`\n- `Binance Smart Chain`\n- `Cosmos`\n\
  - `EOS`\n- `Flow`\n- `Hedera Hashgraph`\n- `Polkadot`\n- `Solana`\n- `Tezos`\n-\
  \ `Tron`\n- `WAX`\n\n并不是所有的这些区块链网络都是互通的。有些是闭环的，例如 `Flow`。除非你想做一些除了数字艺术 NFT 之外的特殊事情，否则我们建议你使用\
  \ `Ethereum` 区块链网络。\n\n## 热门平台\n\n### OpenSea\n他们声称是 NFT 市场上最大的（我们没有理由怀疑这一点）。在 `OpenSea`\
  \ 上，你会看到不同类型的 NFT，例如：\n\n- 数字艺术\n- 域名（抗审查的）\n- 体育用品\n- 交易卡牌\n- 虚拟世界\n- 收藏品\n\n当你成为\
  \ `OpenSea` 的成员时，你可以购买、出售并寻找独有的 NFT，如 `ENS` 域名、`Axies`、`CryptoKitties` 等。对于上述提到的物品，`OpenSea`\
  \ 上有超过 700 个项目类别，以及诸如 `Ethereum Name Service` (`ENS`) 等其他项目。`OpenSea` 提供了一个铸造工具，你可以用它来创建系列和单个\
  \ NFT。这是免费的，你不需要编写任何代码即可使用它。一旦你创建了 NFT，你就可以以固定价格出售它们，或者在 `OpenSea` 上为它们创建拍卖。\n\n\
  ### Rarible\n`Rarible` 是另一个像 `OpenSea` 一样的自服务 NFT 市场。这个 NFT 市场是社区拥有的。社区成员可以持有 `ERC-20`\
  \ `RARI` 代币。如果成员在市场上活跃于买卖，`Rarible` 平台将用这种代币奖励他们。每周会有大约 75,000 个 `RARI` 分发。虽然 `Rarible`\
  \ 的重点是数字艺术，但他们允许成员铸造电影文件、书籍、音乐等的 NFT。`Rarible` 上的 NFT 创建者可以向平台上的任何人展示其挂架 NFT 的“预览”。完整的\
  \ NFT 项目仅供购买者查看。在 `Rarible` 市场中，你可以看到每日畅销榜，可以让你的 NFT 出现在页面顶部，以便于吸引买家。你在 `Rarible`\
  \ 上创建 NFT 需要支付一小笔铸造费。你在这个市场上最高可以收取高达 30% 的版税。\n\n### Mintable\n另一个著名的自服务 NFT 市场是\
  \ `Mintable`。在这里，用户可以交易艺术、照片、音乐、游戏资产等。`Mintable` 的独特之处在于它提供“无 Gas 费”（gasless）铸造选项。`Mintable`\
  \ 有三种不同的拍卖类型，分别是：\n\n- 定时拍卖\n- 传统拍卖\n- 现价购买拍卖\n\n`Mintable` 是基于以太坊的，只能使用 `Ether`\
  \ 进行支付。NFT 创建者拥有 5% 的版税机制，当原始买将所有权转移给他人时赚取佣金。\n\n### Nifty Gateway\n人们对 NFT 世界中的\
  \ `Nifty Gateway` 市场褒贬不一。它与其他所有 NFT 市场都不同，因为它允许用户使用信用卡支付。用户不需要拥有 `MetaMask` 或加密钱包。`Nifty\
  \ Gateway` 的目标是通过将中心化流程引入去中心化流程，让每个人都能使用 NFT。人们如此喜爱 NFT 的原因之一是因为去中心化。因此，`Nifty Gateway`并不是一个流行的\
  \ NFT 市场。\n\n### SuperRare\n`SuperRare` 可能是最著名的精选 NFT 市场。`SuperRare` 旨在为其成员提供独一无二、稀有的限量版数字艺术。你需要获得\
  \ `SuperRare` 的批准才能在其平台上铸造并挂架你的数字艺术。全球 NFT 交易者对 `SuperRare` 市场有许多赞誉。他们喜欢市场监管挂架行为，以确保只有最高质量的资产。\n\
  \n### Foundation\n`Foundation` NFT 市场旨在将 NFT 创建者、收藏家和加密原生用户聚集在一个特殊的社区中。`Foundation`\
  \ 想要推动 NFT 文化，并声称它是新的创意经济。该市场专注于数字艺术。这是另一个精选平台。所有成员必须创建经过 `Foundation` 管理层验证的。它是增长最快的\
  \ NFT 市场之一，交易额不断增加。当你在 `Foundation` 上铸造并挂架 NFT 时，你将在所有销售中获得 10% 的版税。许多 NFT 投资者利用\
  \ `Foundation` 平台寻找新机会。他们购买 NFT 并以更高的价格出售。\n\n## 小众 NFT 市场\n\n一些市场针对数字幻想足球牌和虚拟世界头像等小众\
  \ NFT。许多新的领域 NFT 市场不断出现，以满足增长的需求。最成熟的玩家是：\n\n- **Axie Infinity**：该市场为热门游戏 `Axie\
  \ Infinity` 提供 NFT 卡通角色。该游戏允许玩家战斗、繁殖和交易被称为 `Axies` 的数字宠物。有些人靠这个游戏生活。\n- **NBA Top\
  \ Shot**：这是一个使用 `Flow` 的闭环小众 NFT 市场。在这里，用户可以出售和购买某些 NBA 精彩时刻视频的收藏卡牌。\n- **Sorare**：在\
  \ `Sorare` 小众 NFT 市场中，用户可以交易代表球员的虚拟卡牌。`Sorare` 是一款在全球范围内玩的幻想足球游戏。\n- **Valuables**：这个小众\
  \ NFT 市场专门从事推特推文的代币化。这是推特执行官杰克·多塞（Jack Dorsey）将其他的第一条推文作为 NFT 出售的平台。\n- **Decentraland**：有一个小众市场供用户交易可穿戴、可穿戴物品和虚拟土地等游戏内物品。\n\
  \n\n\n\n\n# 第 10 章：如何创建和出售你的 NFT？\n\n我知道你对 NFT 是否值得会有疑问。请先考虑一下传统艺术的世界。你看到画廊，以及人们为艺术品支付数十万甚至数百万美元，然后现实却给了你当头一击。在合适的情况下，只有极少数人能以此为生。即便如此，他们也必须与交易中的其他相关分享利益。\n\
  \nNFT 存在于一个特殊的环境中。你，作为艺术家，对构成你作品的所有元素拥有完全的控制权。NFT 市场是外汇市场，它们向全世界展示你的作品。要售卖你的作品，你不需要去画廊或机构。你不需要被强制与中间人分享部分收益。事实上，NFT\
  \ 市场会随时向你更新你艺术品的销售情况。一旦你的艺术品 NFT 经过交易，你就可以从中获得合理的佣金。你还可以随时证明你作品的有效性，并证明在任何给定时间内你的艺术品只有一个真正的主人。总的来说，NFT\
  \ 艺术品生态系统让任何人买卖艺术品变得更容易。\n\n与大众认知相反，创建你的 NFT 很少或完全不需要技术知识。你可以使用 `OpenSea`、`ararible`\
  \ 或 `Mintable` 等 NFT 市场在几分钟内为你的作品创建 NFT。在开始构建 NFT 之前，你必须先将你的加密钱包连接到选择的 NFT 市场。你永远不需要共享任何其他信息，因为钱包地址就是你的登录信息。之后，进入市场的“构建”（Build）区域，上传你的艺术品，并通过点击必要的按钮完成流程。讨论就此结束。在你妈妈叫你下楼吃饭、你的宝宝开始哭泣或你的另一半想你之前，你就能准备好待售的\
  \ NFT 艺术品。\n\n同质化（Fungible）意味着它可以被快速替换。一张独一无二的基·曼特勒新人卡不是普通的棒球卡，相反它是不可替代且非同质的。油是同质的，因为任何桶油和另一桶一样好。当非同质资产被代币化时，代币就成了资产重要数据的数字表示。代币存储在钱包中，每个钱包都有自己的地址。`Token\
  \ IDs` 连接到区块链上的钱包地址，这是一个巨大的、公开访问的数据库，允许任何人验证数字所有权。\n\nNFT 开发最常用的网站是 `OpenSea` 和\
  \ `Rarible`。虽然 `Rarible` 的总销量最高，但 `OpenSea` 提供了额外的服务，例如使用 `OpenSea` 交易所构建你自己的 NFT\
  \ 网站的能力。用户可以在两个平台上上传他们的作品并建立收藏，而无需了解任何区块链技术。\n\n请记住，在开始之前会有一些初始成本。一个链（通常是 `Ethereum's\
  \ blockchain`）驱动着 NFT。要将你的艺术品代币化，你需要支付名为 `gas` 的网络费用。在开发过程中，`Rarible` 允许艺术家在区块链上（链上）铸造\
  \ NFT。因此，未来的价格将会更低。如果你打算以天价出售少数几个 NFT，`Rarible` 是你的最佳选择。另一方面，如果你想制作大量廉价的 NFT，可以使用\
  \ `OpenSea` 的集合管理器（Collection Manager）。用户可以支付一次性费用使用 `OpenSea Collection Manager`\
  \ 创建新系列。`OpenSea` 中心化团队可以在使用该系列出售之前在链外构建并存储无限数量的 NFT。在买家支付交易的 `gas tax` 后，你的 NFT\
  \ 将被置链并进行传输。这将引导你完成在 `OpenSea` 集合中制作自己 NFT 的步骤。\n\n## 第 1 步 — 设置 MetaMask\n\n设置软件钱包是创建自己的\
  \ NFT 的第一步。你需要使用此钱包存储你的 NFT 并支付区块链 gas 费用。访问 `metamask.io` 获取软件或安装 Chrome 扩展。创建\
  \ `MetaMask` 钱包是快速且免费的。只需保留你的 `seed phrase`（助记词），以防将来需要找回钱包。请记住，钱包并不存储加密货币或 NFT；相反，它们存储你的\
  \ `private key`（私钥），这是批准交易所需的。加密货币和 NFT 都存储在区块链上，`wallet ID` 用于识别拥有什么。\n\n## 第 2\
  \ 步 — 将你的艺术代币化\n\n一旦设置好 `MetaMask` 钱包，你就可以创建 NFT 了。访问 `opensea.io` 并从菜单栏选择 `Build`。你现在可以使用\
  \ `OpenSea` 连接你的 `MetaMask` 钱包。在给你的 NFT 系列命名后，点击 `Add New Item`（添加新项目）按钮。你现在可以上传想要代币化的文件并分配其属性和统计数据，使其与你的\
  \ `array` 中其他部分区分开来。在确定每个项目需要的副本数量后，设定零售价格。\n\n## 第 3 步 — 创建市场挂单\n\n在出售你的第一个 NFT\
  \ 之前，你必须先授权 `OpenSea` 出售你账户中的产品。你可能需要支付费用才能出售第一个 NFT。\n\n\n\n\n\n# 如何创建你的 NFT？\n\
  \n创建你的 NFT 如此简单，真是令人惊讶。铸造 NFT 最常用的市场平台是 `OpenSea` 和 `Rarible`。尽管 `Rarible` 在总销售额上更为成功，但\
  \ `OpenSea` 提供了高级功能，例如可以使用 `OpenSea` 交易所来创建你的 NFT 网商店。参与者可以将他们的艺术品放在网商店中，并在平台上创建目录，而无需具备任何区块链网络的先验知识。尽管如此，你应该意识到这将产生某些初始成本。区块链网络（通常是\
  \ `Ethereum`）管理着 NFT。因此，为了将你的艺术品或物品代币化，你需要支付一笔被称为 `gas fee` 的网络费用。`Rarible` 允许创意人员在创建过程中在区块链上铸造\
  \ NFT（链上）。这通常会导致较低的价格。如果你打算从少数 NFT 中赚取巨额利润，`Rarible` 通常是正确的选择。尽管如此，你可以使用 `OpenSea`\
  \ 的 `Collection Manager` 创建许多且更便宜的 NFT。`OpenSea` 参与者只需支付一次费用即可铸造一套新的 NFT。从这样的集合中，`OpenSea`\
  \ 高度中心化的单元可以生成无限数量的 NFT，并在出售之前将其留在线下。我们将引导你完成在 `OpenSea` 平台创建 NFT 的过程。\n\n## 第 1\
  \ ：设置 MetaMask\n\n为了铸造你的 NFT，你首先需要创建一个数字钱包。这是你存储 NFT 的地方。在将来，它将同样用于支付区块链网络交易的 `gas\
  \ fees`。访问 `metamask.io` 下载软件或添加 Chrome 扩展程序。建立 `MetaMask` 钱包既简单又免费。如果将来需要找回钱包，请妥善记录\
  \ `seed phrase`。钱包不用于存储加密货币或 NFT。相反，它们用于存储你的 `private key`，这是授权区块链交易所必需的。区块链技术存储加密货币和\
  \ NFT，而需要 `wallet ID` 来确定它们的所有者。\n\n## 第 2：：将你的艺术品代币化\n\n创建钱包后就可以铸造 NFT 了。在 `opensea.io`\
  \ 上，从列表菜单中选择 `Create` 选项。你就可以将钱包连接到 `OpenSea` 并开始操作。在为你的 NFT 系列标记后，选择 `Add New Item`\
  \ 标签页。你现在可以上传想要代币化的文件，并使用功能和统计数据进行自定义，使其与收藏中的其他作品区分开来。决定每个项目需要多少份副本，然后设置零售价格。\n\n\
  ## 第 3：在市场上列出\n\n在营销你的第一个 NFT 之前，你必须授予 `OpenSea` 从你的账户出售物品的权限。由于这是区块链技术交易，你必须支付交易\
  \ `gas fee`。一旦你将 `Ethereum` 转移到你的 `MetaMask` 账户，就可以进行交易了。此费用仅在第一次铸造 NFT 集合时需要。如果你还没有\
  \ `Ether`，你可以在 `Coinbase` 或 `Gemini` 上购买并将其转移到你的 `MetaMask` 账户。既然你已经授权 `OpenSea`\
  \ 销售，任何人现在可以在 `OpenSea` 市场上找到并购买你的 NFT。你已经完成了任务！\n\n# 制作数字艺术所需的软件\n\n你需要记住两点：你需要什么样的功能，以及你愿意为软件支付多少钱。某些数字艺术软件包含了你处理图像所需的全部功能，从绘画到复杂的图像编辑。相比之下，其他软件的功能范围较窄，因此你必须决定想要通用软件还是专业软件。我们的推荐中，有些完全免费，有些需要一次性付款，而有些则需要持续订阅。无论你使用\
  \ `Mac`、`Windows`、`iPad` 还是 `Linux`，都能找到合适的数字艺术程序。\n\n### Photoshop\n长期以来，`Photoshop`\
  \ 一一直是数字艺术软件无可争议的领导，但竞争对手的服务正在挑战它的地位。另一方面，`Photoshop` 对于数字艺术家来说仍然是非常有效且高效的软件。\n\n\
  ### Affinity Photo\n在功能方面，`Affinity Photo` 并不完全匹配 `Photoshop`，特别是在内容感知填充方面。然而，一旦你熟悉了它，你会发现它能够处理许多数字艺术项目。\n\
  \n### Corel Painter\n`Corel Painter` 的最新版本有一系列新功能和特性，特别是对于 `Apple` 用户。`Painter`\
  \ 适用于摄影艺术、美术、漫画和概念艺术的各种风格和处理。它有超过 900 种笔刷可供选择，还有许多自定义选项。\n\n### Rebelle 4\n功能包括笔刷预设大幅增加到\
  \ 170 多个。`Rebelle 4` 被描述为“独一无二”的绘画软件，可以模拟颜料在现实世界中的反应方式。在 `Rebelle 4` 上，你喜爱的笔刷甚至可以共享和下载。\n\
  \n### Clip Studio Paint Pro\n`Clip Studio Paint` 逐渐成为创建漫画和漫画书的标准软件。如果你想在数字艺术和绘画软件中获得自然且经典的感觉，那么这款软件就适合你。为了获得平滑、真实的笔触，`Clip\
  \ Studio Paint` 采用了卓越的笔压感技术。以下是你数字艺术作品可能也可以考虑的其他几款软件列表：\n\n* `Artweaver 7`\n* `ArtRage\
  \ 6`\n* `Krita`\n* `TwistedBrush Pro Studio`\n* `MediBang Paint Pro`\n* `Black Ink`\n\
  * `Paintstorm Studio`\n\n\n\n\n\n# 传统数字艺术软件 (Adobe)\n\n现在，让我们深入探讨一下最流行的数字艺术软件。`Adobe\
  \ Photoshop` 是最知名且最常用的数字艺术软件。它功能强大，更新频繁，并可用于制作从概念缩略图到漫画页面，甚至是照片合成（photo-bashed）作品的任何内容。`Photoshop`\
  \ 最初是摄影师设计的照片编辑软件。它逐渐成为许多其他行业（包括数字艺术）的标准。你可以使用该软件极其广泛的绘画工具、画刷、滤镜、插件和图层样式。由于其运行高效，它已成为娱乐行业所有数字艺术家的常用行业软件。如果你想在视频游戏、动画、长片或任何其他制作公司工作，`Photoshop`\
  \ 技能是必不可少的。它的学习曲线相当陡峭。如果你是新手，所有的功能可能会让你无从从从，你可能会在软件的技术领域迷失。然而，一旦你掌握了基础知识，将将无限！你可以以任何喜欢的风格创建任何内容，甚至可以修改图片！因为\
  \ `Photoshop` 是最流行的数字艺术程序，网络上有许多 `Photoshop` 学习教程供你使用。不过，我们在下方提供了一份简短的入门指南，帮助你开启\
  \ `adobe` 之之旅：\n\n## 打开图像\n\n打开图像并创建新图像。要打开和创建图像：在菜单栏中，选择 `File > Open` 从头开始创建新图像；从菜单栏中选择\
  \ `File > New`。从下拉菜单中选择文档预设。你可以通过输入数值来更改预设的宽度和高度。\n\n## 熟悉你的工作环境用户界面\n\n菜单栏（位于最顶部）显示\
  \ `File`、`Edit`、`Image` 以及其他菜单，用于访问一系列命令、修改和面板。`options bar`（位于菜单栏下方）显示你当前使用的工具的设置。编辑图像和制作艺术作品的工具位于\
  \ `Tools` 面板（位于左侧）。相关的工具被归类在了一起。你将通过在面板中选择并按住某个工具，来发现该组中的相关功能。`document window`（位于中间）显示你当前正在工作的文件。`Document\
  \ window` 以标签页形式显示许多打开的文档。\n\n## 掌握缩放和平移动：更改你的图像视图\n\n在 `Tools` 面板中，你将找到 `Zoom`\
  \ 工具。在设置栏中，在 `Zoom in` 和 `Zoom Out` 之间切换。你可以使用 `Hand` 工具在大图像或放大图像上移动，该工具也包含在 `Tools`\
  \ 面板中。\n\n## 撤销命令\n\n撤销单个或多个步骤，并使用 `History` 面板。要撤销之前执行的任何操作，前往 `Edit > Undo` 或点击\
  \ `Control+Z` (Windows) 或 `Command+Z` (macOS)。要重复之前执行的任何操作，前往 `Edit > Redo` 或点击\
  \ `Control+Z` (Windows) 或 `Command+Z` (macOS)。多次选择 `Edit > Step Backward` 或在 `History`\
  \ 面板中选择一个步骤来撤销多个步骤。\n\n## 保存你的工作\n\n利用 `Save` 命令。\n\n# 将传统或非主流艺术数字化 NFT\n\n英国最富的当代艺术家达米彦·霍斯特（Damien\
  \ Hirst）开始在 NFT 市场出售他的作品。霍斯特宣布，他参与 NFT 和加密货币销售是他迄为止参与过的最迷人的项目。在最近一次销售中，霍斯特通过将其 7,481\
  \ 幅版画拍卖给来自 67 个国家的 4,000 人，赚了 2,240 万美元。这个数字令人费解，因为考虑到总利润以及在如此不同的国家售出的巨大版画数量。加密货币的使用使得联系\
  \ 67 个国家的 4,000 名买家成为可能。随着更多传统艺术家投身 NFT，接受这一趋势只会加速，让以前未受教的艺术世界参与者更容易接触。佳士得纽约的战后及当代艺术专家诺亚·戴维斯表示：“NFT\
  \ 在艺术市场具有巨大的潜力。作为一种机制，NFT 改变我们获取所有权的方式潜力是无限的。销售结果显示了数字艺术世界的极大兴奋，以及这种艺术媒介在更大范围内无限可能。”\n\
  \n数字艺术是一种历史悠久的艺术媒介，可以追溯到 20 世纪世纪 50 年代，当时个人首次接触计算机系统。在 NFT 和区块链技术出现之前，为仅通过数字方法创建的作品赋值是困难的。这一切意味着数字艺术并不是新鲜的；它只是对艺术界来说是新的，我们看到它正在追赶。“我们非常荣幸，现在有权利用我们的网络向世界介绍最具前瞻性的艺术家。”精品咨询公司\
  \ Cromwell Art 的创始人 Wendy Cromwell 在这方面持积极态度。“艺术市场追随金钱，最终，艺术家也是如此，”她观察到。她认为未来未来传统艺术市场将维持\
  \ NFT，因为随着 NFT 艺术质量的提高，收藏家将想要参与。\n\n# 你的 NFT 版权\n\n购买 NFT 的人无疑获得了购买和出售该特定 NFT 的能力。这就是他们能得到的全部。NFT\
  \ 的所有权并不赋予任何知识产权。相反，它赋予了对所获数字文件的权益。无论这个数字文件是什么并不重要。NFT 并不保证创建它的人最初具有法律权利这样做。许多平台正在解决这个问题。\n\
  \n假设用户上传了受版权保护的作品；`SuperRare's TOS` 包含了 `DMCA` 退款政策。如果有人花费 50 万美元购买了一件艺术品，结果该作品是非法的，且卖家兑现了加密货币、逃出国并挥霍了所有资金，买家将承担责任。有人认为补救措施是更多的加密货币和区块链账本，这可以追溯诈骗者的活动，但世界尚未到达那一步。换句话说，购买\
  \ NFT 数字艺术作品类似于购买实体艺术品。基础物权仍由原始创作者或艺术家拥有。如果我去工作室购买了一幅我欣赏的画，我不能再将该图像出售给可口可乐用于他们的罐子上。那将是侵犯版权。如果我对艺术品拍照并出售\
  \ NFT 副本，也会发生侵权行为。如果我从一个最初没有权利制作 NFT 的人那里获得它的 NFT 副本，他们（可能还有我）犯了带有技术色彩的基础版权侵权。买家，请加小心！\n\
  \n\n\n\n\n# 为艺术家打造你的品牌\n\n## 定义你是谁\n尝试定义你作为一名艺术家的身份。你试图通过你的作品传达什么？你的作品对你来说意义何何？你的作品与众之处何在？回答这些关键问题，以更多地了解作为艺术家的自己。\n\
  \n思考你的艺术品牌真正包含什么，以及你的作品与他人的有何不同。这有助于人们记住你，并让你的艺术更易于接触。当你提到丙烯料时，`Liquitex` 品牌处于技术前沿。他们开发了世界上第一种无镉颜料，为艺术家在不牺牲色彩强度或亮度的情况下提供了更安全的选择。他们的品牌形象简单、易记，并有想要传达的信息。注意了，艺术家们！如果潜在客户和买家能够和你以及你的艺术产生共鸣，他们将更愿意投入你的业务。\n\
  \n## 你的目标是什么？\n作为一名艺术家，你希望通过你的品牌实现什么？你希望向公众分享你的艺术并获得更多艺术界的认可吗？还是你对兼职销售画作感兴趣？你想通过对艺术的热爱生活吗？\n\
  \n你必须首先确定你想实现的目标，以确保你正在采取适当的行动来实现这些目标。从财务角度来说，确定你的投资回报率，然后制定战略计划使该目标成为现实！\n\n##\
  \ 传播你的\n为什么不检查是否有合作艺术项目的机会，或者互相帮助接触更广泛的受众呢？或者，看看你社区是否有经验丰富的艺术家准备好根据他们的经验提供建议。你可以成为那个将网络中的艺术家聚集在一起的人。\n\
  \n除了与其他艺术家互动之外，为什么不尝试与你喜爱的创意产品的制作者建立联系呢？如果你真的想增加艺术的可见度，还有什么比与实现这一切的人合作更好的方法呢？艺术用品公司经常与艺术家合作开发新产品。关注你喜爱的艺术用品公司的产品和社交媒体网络是建立关系的绝佳方式。\n\
  \n## 易于接触\n无论你倾向于与观众面对面还是在线活动，你都必须让自己易于接触。从利用社交媒体等强大在线平台的优势开始。今天大多数人使用社交媒体在忙碌的生活中保持互动。\n\
  \n如果你还没有，请在粉丝待得最多的频道开设账户和/或页面。开始与你的朋友家人分享你的艺术；为你的艺术品牌创建一个 `Facebook` “业务主页”，提供更多关于人们在哪里可以发现你的艺术的信息——无论你有实体店面、通过网站销售艺术，还是使用如\
  \ `Etsy` 等其他在线资源。定期分享你最新创作努力的更新，以及任何待售的艺术品。为你所使用的许多艺术主题和平台创建 `Pinterest` 画板。用你作品的精美照片和视频保持你的\
  \ `Instagram` 账户更新。\n\n## 让他们想要再次回来获取更多\n现在我们已经涵盖了基本要素，你需要建立品牌忠诚度来留住你的粉丝和买家。无论你是否喜欢，品牌忠诚度不仅仅是试图向你的观众销售或分享你的艺术。你也想展示一点你自己。正如之前提到的，你希望人们对你作为艺术家以及你的品牌产生共鸣。\n\
  \n实现这一点的简单方法是利用社交媒体在更个人层面上与客户保持联系。分享激励你创作艺术的动力，以及任何重要的艺术设计和更新，以及你可以给其他艺术家的任何建议。\n\
  \n\n\n\n\n# 第 12 章：NFT 与房地产\n\n以被称为 `Bitcoin` 的这种革命性数字货币形式为引领的区块链技术，代表了开发者在区块链技术之上构建新金融产品提供了前所未有的机会。这种新兴技术的一种应用就是用于房地产行业。基于区块链的货币为人们买卖物业创造了一种新方式，让他们不再受限于传统机构或银行的摆布。本文将探讨这些技术如何用于房地产交易，以提高透明度和效率，同时解决随着这些创新而出现的一些隐私疑虑。\n\
  \n房地产由建筑、土地和其他实物资产组成。但对于大多数人来说，房地产的概念始于住房。正是这种特定资产激发了人们对这些技术的最大兴趣，许多人希望在能够使用基于区块链的交易服务后，以低价卖掉自己的房屋。区块链技术让我们有机会在真正的点对点层面上买卖物业。这意味着，我们不需要依赖大银行或昂贵的中介来提供这项服务。\n\
  \n区块链技术为某些类型房产（如租赁房和停车位）的买卖开辟了新途径。通过这项技术，我们可以为卖方提供更高的回报，并增加对物业的需求，因为人们只会购买他们能够获利的东西。有一句老话：“如果你没有为产品付费，那么你就是产品。”这是我们在房地产交易中需要考虑的因素。\n\
  \n区块链技术的推出在过去几年中是缓慢且渐进的，在房地产行业看到巨大变化之前，还有很长的路要走。全球的房地产开发商开始设计依赖区块链技术的创新，包括住宅和商业建筑。人们还希望将其他类型的资产整合到这个系统中。\n\
  \n以太坊创始人 `Gavin Wood` 曾设想过未来房地产可以通过区块链技术进行交易。他那家专门开发 `Ethereum` 应用的公司 `Ethcore`\
  \ 设计了智能合约，帮助人们买卖物业，而无需向全世界展示他们的财务信息。匿名出售物业让那些可能对在网上展示自己的资产感到不适的人们能够进行销售，而无需披露过多关于他们自己或这笔私有资产的信息。\n\
  \n## 区块链在房地产中的益处\n\n首先，它让资产所有权的信息变得比以往任何时候都更加透明。现在，房地产行业存在许多问题。代理人会竭尽全力保护其客户的资产。结果是，没有单一的信息源可以告诉你关于你的物业价值及其值多少的所有信息。这使得人们很难、甚至不可能通过报纸或在线分类网站等传统渠道出售他们的物业。\n\
  \n房地产市场信息的匮乏迫使许多房地产开发商创建了网站，通过其网站发布大量数据。问题是，这些海量数据对于可能没有时间筛选所有信息的普通人来说太困难了。\n\n\
  一种解决方案是使用区块链技术。通过使用这项技术，任何卖方或买方都能够准确看到物业购买价格如何随时间变化。买方还能看到他们预计从物业中获得的收入，以及卖出后需要需要的任何税费。区块链技术还允许微支付，这意味着人们可以买卖小型物业区域，如停车位和储物柜。\n\
  \n## 挑战与未来展望\n\n房地产行业就像是西部西部。它充满了犯罪分子、腐败和贿赂。区块链并没有让任何事情变得更容易；它只是提供了帮助反击这些问题的工具。债券和衍生品是人们每天处理的金融工具。它们被大型公司用于出售承诺未来回报的证券来筹集资金。区块链技术的引入使这一过程更加高效。\n\
  \n许多商人士想参与区块链开发，但他们不确定它是如何运作的。关于这项技术仍然存在一些误解，在将其应用于房地产行业之前需要解决这些问题。对于那些想在其之上构建金融产品的人来说，了解这些技术是如何运作的。。区块链技术的潜力让债券比以往任何时候都更加透明和高效。房地产行业也一样，但在看到这项技术被完全整合之前还需要几年时间。如果你想从基于区块链的资产中获利，你应该在早期购买它们。一旦它们上线，投资者可能会抢购并投入资金，从而大幅推高这些资产的价值。\n\
  \n另一个严重问题是验证某些物业的所有权有多困难。例如，在许多司法管辖区，法规管理着产权的转移。这些法规旨在确保人们不会在不交税或通过其他非法方式的情况下出售房屋。区块链技术为人们提供了一种买卖物业而无需担心税的方法。这对于政府不够稳定或正在与财务问题斗争的国家特别有帮助。\n\
  \n使用这项技术，房地产开发也将变得更加容易。在大多数开发商眼中没有价值的闲地可以用来确保所有政府员工在月底领取工资。房地产市场对全世界的人来说都至关重要。在区块链技术之上可以构建许多不同类型的产品，但还没有一个开发出来。要让这项技术突破，它必须整合到公众已经在使用的产品中。\n\
  \n大部分，这些将是构建在区块链技术之上的房地产相关技术。人们想要安全地购买房地产，但该行业存在许多欺诈。现在，这是人们卖物业最常见的方式之一。相比之下，区块链技术可以帮助所有者免受欺诈。所有的交易都记录在公开的数据库中，在不被发现的情况下无法更改。这防止了欺诈的发生，也让人们出售假物业变得极其困难。\n\
  \n\n\n\n\n# 第 13 章：NFT 的优缺点\n\n由于信息量庞大，我认为包含一个关于优缺点的章节可能会有所帮助，这样在你决定开始交易时就可以随手查阅。这绝不是为了阻止你利用加密货币领域迄今最大的机会。这仅仅是为了确保你在开始交易之前，已经做好了充分的准备并掌握了相关信息。这可以称是最后的检查，用以强化你想参与这一既令人兴奋又利润丰厚、且参与了技术历史事业的理由。\n\
  \n## 缺点\n\n### 不可预测性\n收藏品的价格高昂，且从长期来看并不保值，因此由于这类交易具有不可预测的性质，它像是一场赌博。之所以如此，是因为它是如此新颖且令人兴奋，所以每个人想参与其中，尤其是投资者。这推高了价格，但尽管\
  \ NFT 可以卖出高价，但价格已经回落。在某件作品上赚取百万收益并不有保证。对于任何新颖且令人兴奋的艺术品也是如此：每个人都涌入其中，流行程度使其变得昂贵。但这绝不是一个会破灭的泡沫，而是技术革命的开始，也是一种明智且无需大量体力劳动的赚钱新方式。\n\
  \n### 安全性\n如果输入信息错误或没有妥善保护密码，NFT 可能会被盗取或丢失。许多艺术家在不知情的情况下其作品被代币化，而目前尚不清楚在这一阶段如何收回所有权。然而，艺术界的伪造品情况也是如此。还存在艺术品来源被破坏的情况，这再次会影响一件艺术品历史的有效性。最安全的方法是遵守任何互联网交易的相同规则，因为这是其他在线支付中同样存在的问题。这并不是一种新型安全问题；它之所以被凸显出来，是因为每个人都需要确保他们遵循所需的协议，以保持他们的信息安全，从而能够安全地使用互联网。\n\
  \n## 优点\n\n### 艺术家获益\n艺术家可以收取版税，并为他们无法被复制的作品获得报酬，这保证了艺术家能够得到照顾，且仿制品不会随处可见。作为一名 NFT\
  \ 艺术家，这不仅是确保你的艺术作品被看到的良好方法，还能从每次转售中持续获利。这让实现热情的梦想并据此为生变得更容易。\n\n### 将艺术带给每个人\n收藏品和艺术更具互动性和吸引力，有各种可以观察和欣赏的种类。NFT\
  \ 正在让艺术收藏和欣赏成为每个人都能体验的经历。这就像是一场艺术和收藏品的复兴，拥有如此多的选择和新技术，令人兴奋。这正是现在及未来世界所需要的，希望它能够长久存在。\n\
  \n### 真实性\n所有权被添加到账本上并对物品进行验证，因此你可以保证获得价值不断增长的正品。区块链技术被整合到 NFT 的创建和使用中，因此交易被记录在账本上并追踪。所有权在每次销售中都会追踪。\n\
  \n### 易性\nNFT 很容易创建和出售，因为有许多市场可以选择，并有一系列功能和方便的分步说明可以遵循。这使得买卖加密数字艺术变得简单直接。\n\n###\
  \ 被动收入\n最后，交易 NFT 是获得被动收入的好方法。如果你是一个数字艺术家，你确实需要先创作一些东西铸造成 NFT，但投资回报足以让你不需要每天或每周都卖出一件作品。通过仅仅交易\
  \ NFT，许多人在正确的作品即将走红之前低价买入，然后以更高的价格卖出，从而赚取数千甚至数百万。这归根结底取决于对市场正确趋势的关注。\n\n# 第 14 章：NFT\
  \ 风险与诈骗\n\n## 如何避免它们\nNFT 的炒作是真实的，许多热门项目已以数百美元的价格出售。虽然 NFT 领域如此令人兴奋，但我们也需要停下来并承认风险。正如\
  \ Garyvee 在推特上说的那样，97-99% 的 NFT 项目将是赔钱，因此学习和保持耐心同样重要。我们还需要考虑并讨论这些负面因素。\n\n\n\n\n\
  \n# NFT 交易主要风险\n\n## 购买仿品\n我们需要停下来思考：我们买到真品了吗？这与传统艺术品非常相似。例如，如果你有一幅你认为是真实的 `Picasso`（毕加索），大家都认为它是真的，它就会值数百万。然而，当专业人士来鉴定并发现它不是真的时，会发生什么？这幅画会瞬间变成五美元。NFT\
  \ 世界也发生着同样的事情；人们确实成了这种骗局的受害者，而且这种情况可能会继续发生。\n\n这个账户记录了数百次销售记录，其中一件名为“NFT morons”（NFT\
  \ 傻子）的作品，买家价格从 `0.116 Ethereum` 到超过 `60 Ethereum` 不等。如果你不想成为那些傻子，你必须做的就是研究你即将购买的\
  \ NFT，尤其是那些价值昂贵的作品。这并不难。你只需要查看这件作品并检查它的历史：它是什么时候卖出的，在所有平台上是谁对它出价的。\n\n你可能会看到一个假账号只有大约\
  \ `300` 个粉丝，但真实的 `Banksy` 账号不可能有如此少的粉丝。假设你是 `King` 的粉丝，你也可以在平台的搜索栏中搜索这个账户。如果出现了任何其他简介，你还可以在社交媒体上进行双重检查或交叉验证。几乎所有有声誉的人声誉是有原因的。他们可能会出现在\
  \ `Instagram`、`Twitter`、`Facebook` 或到处。如果你检查这些人的社交媒体，你可能会找到他们 NFT 的链接，并带你回到你刚刚在市场上找到的同一个页面。现在你可以验证这是否是真实的\
  \ NFT 账户。如果你看到某个东西看起来太便宜，而且来自一位大艺术家，这是一个红旗。如果你遇到一个有影响力的人以 `15 ETH` 出售 NFT，请停顿一下，去检查个人资料、历史，并与其他社交媒体进行交叉验证。\n\
  \n## 流动性市场\nNFT 市场最大的问题之一是它缺乏流动性。当我们观察加密货币市场时，它们的流动性高得多，这意味着当你购买加密货币且情况开始变糟时，你可以退出或卖掉四分之一或全部。然而，在\
  \ NFT 世界中，你目前无法这样做。这是一种全有或无的出售。\n\n如果我们检查加密货币，它会随着时间的推移建立支撑位。例如，`bitcoin`（比特币）图表有移动平均线，我们有大量过去的数据告诉我们这种加密货币可能处于什么价值范围。因此，即使它开始下降，我们也可以慢慢退出。但在\
  \ NFT 艺术或游戏世界中，这些 NFT 的价格没有支撑位。它们可以在一夜之间从 `$0` 飙到 `$100,000`。\n\n一个 crypto punk\
  \ 卖了了 `$700,000`，但如果我们检查它的历史，我们可以看到它只被卖过两次：一次以大约 `$2,000` 卖出，然后以大约 `$700,000` 卖出。在这些销售之间存在出价，这就是它达到如此高价的原因。检查\
  \ NFT 的价值历史至关重要。这枚 NFT 是一夜之间飙升的，还是随着时间推移建立价值的？这是风险的，因为如果你在一个 NFT 上花费了 `$1,000` 或\
  \ `$5,000`，而它的市场变糟了，你无法退出。在缺乏流动性的市场中，它是全有或无的。当情况变糟时，很少有人想买你花费了数千美元购买的 NFT。你可能对那个\
  \ NFT 什么也得不到。所以，每当你准备购买 NFT 时，都要查看历史检查早期的销售价格、出价和转账。\n\n![](img/image_rsrc1TW.jpg)\n\
  \n看看这个 `CryptoKitty`；它在 `2018` 年以 `0.002 ETH` 卖出，下一次销售是同年的 `600 ETH`，我们在这里看不到这些价格的任何支撑位。此外，它之前的出价大多在\
  \ `0.2 ETH` 左右。因此，任何为这个 NFT 支付 `600 ETH` 的人都很可能被套，没人想买它。当然，它在未来某个时候有以更高价格卖出的机会，但有很多风险而回报很小。我们正在冒险把钱投入一个可能卖不出去的\
  \ NFT 中。所以，这完全取决于风险与权衡。\n\n涉及到 NFT 世界，无论是 NFT 艺术还是游戏，关键在于早入场。现在要困难得多，因为很难预测这些 NFT\
  \ 收藏品和游戏中哪一个会火起来。NFT 艺术可能会稍微一点，因为 NFT 艺术与声誉有关。当有声誉的人出售 NFT 艺术或收藏品时，你已经可以预测它很可能会表现良好。例如，`Rick\
  \ and Morty` 的创作者 `Justin Roiland` 决定在 `Nifty Gateway` 上出售 NFT。起初，他的 NFT 价格只有几百美元。如果你能尽早入场，这些作品正以数千美元出售。当你尽早入场时仍然是有风险的，因为你不知道自己拿到的是否是有价值的东西。\n\
  \n## 自倒交易 (Wash Trades)\n这种情况发生在某人创建一个 NFT，将其挂牌出售，然后以高价从自己手中买回，从而制造出该 NFT 很有需求的假象。例如，如果你看到某个\
  \ NFT 以以 `500 ETH` 卖出，但当你检查历史发现它五天前才创建，现在就以 `500 ETH` 卖出，这非常可疑。对于真正的物品，如果你查看交易历史，你会发现真正的物品并不是一夜之间从零元变成\
  \ `$1000` 的。在此过程中有很多报价，我们会看到它会推高价格。此外，如果你看到某个账户不断从无人能验证的随机地址进行大量报价和销售，这很可能是自倒交易。\n\
  \n总之，当你身在这个 NFT 世界中时，要非常小心。当你准备购买 NFT 时，务确保检查 NFT 的历史并验证创作者。\n\n\n\n\n\n# 你必须规避的\
  \ NFT 骗局 常见的加密货币诈骗\n\n如果你落入这些 NFT 骗局，你将失去努力工作来的一切。想象一下你访问了一个通过 Google 搜索到的 `MetaMask`\
  \ 链接，结果发现它是一个钓鱼链接；你将立即失去存入那个虚假钱包的所有资金。对于 NFT 艺术家来说，类似的情况甚至更加糟糕。\n\n在 NFT 艺术世界中，你需要建立声誉，而你的声誉与你的地址直接挂钩。例如，在\
  \ `Rarible` 的首页，你会看到过去 30 天内销量最高的卖家与其地址关联在一起。假设你已经建立了声誉，一直非常努力，并进入了过去 30 天的畅销者名单。然而，突然之间，你的钱包被黑客攻击了，你再无法使用那个钱包。除非你是一个拥有百万粉丝，否则这非常难以重建。\n\
  \n如果你是像马克·库班（Mark Cuban）那样的人，且你的钱包被黑了，你只需要去 `Twitter` 通知你的粉丝你的钱包被黑了，并附上新钱包的地址链接即可。但如果你是一个新秀艺术家，或者只是刚进入\
  \ NFT 领域，你可能已经工作和拼搏了一多年，建立了声誉。突然之间，你创建的地址以及与该地址绑定的声誉面临了风险。你无法再次使用那个钱包，情况甚至更糟。\n\n\
  涉及到 NFT 时，你可以设置版税，因此如果你创建了艺术品并为每次 NFT 的转售设置了 10% 或 20% 的版税，这些版税将返回到创建该 NFT 的钱包中。所以，如果你创建了一个钱包、建立了声誉、出售了\
  \ NFT，并且正在获得这些版税的版税，这些钱会回到原始钱包。如果你的钱包被黑了，或者你落入了这种钓鱼骗局，现在有人有了你钱包的访问权限，你再也无法使用它。你只能被迫放弃。\n\
  \n## 通用的加密货币世界\n\n这只是加密货币世界发生的情况的一小部分。加密世界充满了诈骗。哪里有钱，诈骗者就会去哪里。加密领域的生态系统充满了资金。还有可能发送到你邮箱的钓鱼链接。你可能会收到来自“Ledger”的诈骗邮件，说你的钱包被锁定，并要求你提供\
  \ 12 个词或 24 个词的助记词。永远不要分享你的助记词！永远不要！你在加密货币中唯一使用助记词的时刻是你自己初始化的时候。记住，你才是创建或恢复 Ledger\
  \ 钱包或其他钱包的人。\n\n所以，当你收到邮件时，它很可能是一个骗局。这种情况也可能出现在交易所中，例如 `Coinbase`。虚假邮件看起来像是来自 `Coinbase`，说你的账户被锁定，请更改密码并点击此链接继续。这是一个钓鱼骗局。所以，每当你收到一封邮件，如果不是由你发起的，请务必保持警惕。如果你确实收到了\
  \ `Coinbase` 等网站的消息，可能是真实的，但验证这一信息的方法不是点击他们发送的链接，而是按照你通常的方式进入 App。不要回复任何非你发起的邮件或链接。\n\
  \n## 加密货币赠送骗局“埃隆·马斯克”\n\n“埃隆·马斯克”加密货币赠送骗局已从受害者手中盗走了至少 587,000 美元。这种类型是最常见的加密货币诈骗之一，通常出现在\
  \ `Twitter` 和 `YouTube` 等社交媒体平台上。\n\n### 它们是如何运作的？\n\n黑客会冒充或入侵知名公司或公众人物，并声称正在赠送加密货币。如果你想参加这些赠送，必须先向他们宣传的地址发送一定数量的加密货币。他们经常承诺返回你发送给他们的金额的双倍、三倍甚至更多。他们想让你觉得如果不这样做，就会错过一个巨大的机会。\n\
  \n\n\n\n\n# 需求驱动稀缺\n\n在非同质化代币社区早期，曾有一种假设认为用户不会担心 NFT 可视的稀缺性，仅仅因为它们在区块链上就会急于购买。相反，我们假设需求受到更传统因素的影响，例如效用性和真实性。\n\
  \n很明确的一是效用性：如果一张 NFT 票能帮我参加会议，我会购买它；如果我可以在数字世界中看到一件艺术品，我会购买它；如果一个物品能在游戏中赋予我独特的技能，我也会购买它。“真实性”这一概念涵盖了\
  \ NFT 背后的故事。它的来源是什么？之前谁拥有过它？随着该领域日益成熟，迷人的 NFT 故事变得更加微妙，并开始对代币的价值产生有意义的影响。\n\n##\
  \ NFT，软件生成的序列号\n\nNFT 仅仅是软件生成的序列号。根据同一套软件，“`this token ID`”属于“`this address`”。然而，没有办法可以检查\
  \ `token ID` 是否连接到虚拟资产（`JPG`、`MP4` 等），因为 `token ID`并不包含虚拟资产的哈希值，而数字资产也不包含可验证的数字签名。你只能相信发行者的口言，认为它们是相关的。NFT\
  \ 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。\n\n至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。至少有一个网站似乎提供带签名的数字内容（推文），但在客观购买\
  \ NFT 之前，尚不清楚数字签名究竟是什么，或者如何对其进行验证。“签名”往往倾向于一种确认，即要出售推文，你应该使用你的 `Twitter` 详情连接到 `cent/valuables`\
  \ 网站，这表明 `Twitter` 账户的操作者发起了销售过程。在我看来，这是不可靠的，因为我预想代币中会包含一个可以通过公钥进行检查的真实数字签名。如果这一缺陷得到证实，`cent/valuables`\
  \ 代币应该像一件“没洗过的旧运动衫”，这表明创作者与代币之间存在某种个人“联系”（尽管它并不是数字签名）。\n\n## NFT 去中心化\n\n人们理论上可以铸造自己的代币，并通过受信任的开源客户端使用“适当的”去中心化销售和发现服务。然而，在\
  \ `Nifty` 和其他网络中，情况并非如此。第三方监督着铸造操作（“主市场”）。第三方充当代理并收取佣金。第三方可能会伪造、出错或被黑客攻击。这抵消了使用去中心化区块链的最初优势。\n\
  \n同一个第三方监督着转售机制（也称为“二级市场”）。反之，独特物品的点对点交换是不可能的。你需要一个中心化的论坛，让买卖双方可以在那里见面并相互探索。为了达成买卖交易并建立联系，他们必须先在第三方网站上注册。公共区块链仅被用于跟踪交易。一个\
  \ `SQL` 数据库可以更有效地存储这些序列号、交易和用户。你可以确信 NFT 发行者的网站已经在 `SQL` 文件中存储了他们的详细信息，那么为什么要重复这些细节和精力呢？\n\
  \n## 总结\n\nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \nNFT 最多只是一种“空白虚拟证明”的形式，其中的空白只能由第三方发行者来填写并认可。至少，如果创作者验证了它们，NFT 将是“*签名*”的虚拟相似物。\n\
  \n### 带有智能合约的资产\n\n曾有一种幻觉，认为因为实施了智能合约，属性就可以无限保留。未来去中心化应用可以实现大规模扩展，但我们现在生活在一个混合环境中。\n\
  \n### 抽象化区块链\n\n许多企业在 2018 年和 2019 年拥抱了“抽象化区块链”的想法，提供带有用户名和密码的中心化钱包以隐藏所有功能。问题在于\
  \ NFT 环境已经丢失了互操作性。\n\n### NFT 与版权\n\nNFT 表现方式的问题在于，人们似乎将它们等同于版权世界，暗示 NFT 赋予了你对所获取代币的视觉艺术的某种所有权。事实上，事实并非如此，因为\
  \ NFT 并没有赋予任何人对视觉艺术的任何权利；相反，它们作为你“拥有”原作作品的证明。\n\n\n\n\n\n# 第 16 章：NFT 的未来潜力\n\n\
  拥有所有权、可以进行交换和交易的数字资产的想法并不新奇。加密收藏品本质上是设计为独的数字资产，每个代币只能存在一个实例。这为收藏品创造了一个市场，用户可以在那里购买和交易这些代币。加密收藏品的未来非常光光，随着越来越多的用户进入市场，尽管在它们被视为主流之前，仍需要克服一些关键性的挑战。在这里，我们将讨论\
  \ NFT 的未来潜力以及它们将如何改变世界。\n\n## 实物商品效用\n\n实物商品效用是指你可以使用某物品并从中获取价值的想法。这就是为什么许多实物商品具有转售价值。例如，如果你拥有你房子的数字资产，你可能可以将其作为贷款的押品。只要物理资产存在，数字资产就有价值。需要注意的是，目前还没有任何数字资产提供这种效用；然而，这是加密收藏品获得如此受欢迎的主要原因之一。\n\
  \n## 非同质化加密收藏品是所有权的证明\n\n加密收藏品被设计为独特的代币，这意味着它们不能被复制或伪造。这创建了一种非常独特的数字资产，可以作为某些实物商品的所有权证明。例如，如果你拥有一个模仿你宠物猫的\
  \ `CryptoKitty`，那么这个代币在世界上永远存在一个实例。你可以将这个代币作为你宠物猫的所有权证明；然而，没有理由你不可以将其作为其他实物商品的所有权证明。在未来，我们可以看到这种效用被用于艺术、黄金、房地产以及许多其他实物商品。在区块链上存储你对实物商品的所有权是一个非常令人兴奋的概念。将其视为数字遗产吧。当你去世时，你的数字资产将转移给合法的所有者，这也是证明你是某物品所有者的一种方式。\n\
  \n### 保护数字文字内容\n\n互联网上文字内容的问题是它们可以很容易被复制和分享。然而，通过 `NFT`，这变得困难得多。如果你拥有一个代表你文字内容的数字资产，你就可以将其作为所有权证明。例如，如果你拥有你写的一篇博客文章或文章的数字资产，你就可以证明它是你的，而且它世界上只存在一个实例。同样的原理适用于艺术品和音乐。只要代币代表艺术品或音乐文件的所有权，那么这个代币世界上只会存在一个实例。\n\
  \n### 艺术品或音乐\n\n为了让艺术品真正独特，艺术家必须专门为该艺术品本身进行设计。这意味着每一个方面都必须由艺术家自己设计，这意味着他们对区块链上存在多少实例具有完全控制权。他们还对未来如何使用它们具有完全的控制权（例如在市场上出售它们）。只要艺术家为某件特定的艺术品设计了他们的艺术品，并且每件作品彼此都是独特设计的，那么在区块链上永远只会存在一个实例。这意味着你可以证明艺术品的所有权，而无担心被他人复制。同样的原理也适用于音乐。如果一个艺术家创作了一首特定的音乐并录制了它，他们也可以证明对那首特定音乐的所有权。艺术和音乐的主要区别在于，为了让一件艺术品是独特的，艺术家必须专门为那件艺术品进行设计；而音乐则更多是关于在历史的特定时间录制特定的声音。这意味着如果你拥有代表你的数字内容的代币，你就可以将其作为任何从该内容获取价值的实物商品的所有权证明。\n\
  \n## 交易 NFT\n\n加密收藏品不仅被设计为代表所有权的独特代币，还被设计为可收集的物品。这意味着人们会收集它们是因为他们想要它们。这意味着人们会收集它们是因为他们想要拥有它们并建立收藏。\n\
  \n，人们将通过繁殖 `Cryptoitties` 来建立收藏，并在交易所将其交易以换取 `ETH` 或其他货币。这就是为什么许多人们认为加密收藏品未来将成为主流。随着越来越多的用户进入市场，这将产生巨大的需求。未来，我们可以看到购买\
  \ NFT 的价值转变，这类似于人们收集收藏卡或稀有硬币的方式。但在这发生之前，还有许多挑战需要克服。\n\n## 解决数字伪造问题\n\n`NFT` 有潜力创建一个某种数字图书馆。你可以将你的音乐、艺术、书籍和收藏品存储在一个数字图书馆中，那里没有人可以伪造它们。只要你拥有该数字资产，没有人就能从你那里夺走。这是\
  \ NFT 试图解决伪造问题的许多方法之一。例如，假设你拥有一个稀有的《权力的游戏》并想把它卖给某人。通过 NFT 的帮助，你可以将关于你数字资产的所有信息存储在安全的区块链上并卖给他人。此外，你还可以通过将其存储在数字图书馆来验证你数字资产的真实性，让其他人看到你是该数字资产的所有者。这是实物商品无法实现的。\n\
  \n## 解决数据所有权问题\n\n`NFT` 的另一个潜在用例是解决数据所有权问题。现在，许多中心化公司如 `Facebook`、`Google` 等拥有并存储我们的数据。即使我们想摆脱它们作为服务提供商，它们也不让我们访问自己的数据。例如，如果我正在使用\
  \ `Facebook` 或 `Google` 服务，我对这些公司从我这里收集并为了其利益的数据没有任何权利（为了投放广告）。因此，他们在未经我的同意或知情的情况下收集我的个人信息，如位置历史、浏览历史等（非法）。但是，NFT\
  \ 可以帮助我们解决这个问题。我们可以创建自己的网站、博客或其他数字资产并存储在去中心化的平台上。然后，我们可以将这些数字资产卖给其他人。一旦交易完成，没有人能从你那里夺走你的数据。所以，如果你在使用\
  \ `Facebook` 或 `Google` 服务，你不需要让他们访问你的数据（你也不需要向他们付费）。相反，你可以使用他们的服务并通过将你的数字资产卖给他们来获得报。这是我们尚未看到的\
  \ NFT 的潜力。随着越来越多的平台建立在 `Ethereum` 之上，我们将在未来看到更多 NFT 的应用。\n\n\n\n\n\n# 所有权认证\n\n\
  土地所有权是当今世界最大的问题之一。你可以通过查看记录轻松发现某人是否拥有某些土地，但要证明你拥有这些土地并不容易。例如，假设你拥有的土地并想将其卖给他人。为了做到这一点，你需要处理大量的文件并遵循非常复杂的流程。不仅如此，你还要为出售土地支付昂贵的税费。而且这一切之后，无法保证买家以后不会从你那里偷走土地。这是因为大多数时候人们可以伪造文件并制作假证。\n\
  \n那么，NFT 如何帮助解决这个问题呢？NFT 有潜力为土地所有者创建数字身份，任何人都可以区块链进行验证。此外，我们还可以将信息存储在不可伪造或不可篡改的账本。因此，如果你试图出售土地，任何感兴趣的人都可以通过检查记录来验证你对该土地的所有权。此外，你还可以向感兴趣购买的人展示数字身份来证明你拥有土地，这比出示文件要容易得多。随着越来越多的平台建立在\
  \ `Ethereum` 之上，我们将看到更多 NFT 的应用。\n\n# 第十七章：NFT 的暗面\n\n到目前为止，本书已经讨论了 NFT 的所有巨大益处，但没有任何东西是完美的。万物皆有缺陷。如果没有负面影响，也就没有所谓的好处。现在是时候谈谈\
  \ NFT 的暗面了。NFT 的一些缺点源于其目前的结构组件，例如生产 NFT 所需功率对环境的影响。其他弊端则更具个人化，例如可能导致的财务变化。在这里我们将全面探讨\
  \ NFT 的潜在陷阱。\n\n## NFT 与碳排放\n\n当 NFT 热潮达到新高度时，许多人并没有意识到这种虚拟交易形式对现实世界产生了影响。原因在于 NFT\
  \ 的处理方式。区块链处理的每一个 NFT 都会同时消耗多台计算机的计算和电力。这不仅为进行这些操作的人带来了巨额的电费，还由于这种能量消耗产生了巨大的碳足迹。正如你可能猜到的，许多人批评这是一种浪费且有害的实践。\n\
  \n讽刺的是，即使像 `Joanie Lemercier` 这样相当活跃的环保活动家和艺术家也卷入了这场闹剧。Lemercier 以批评化石燃料的使用和挑战他人减少碳足迹而闻名，然而在他将一些\
  \ `NFT` 放在区块链上后，没多久就有人指责他是“伪君子”！他的艺术非常受欢迎，在短短几秒内，他就通过几个不同的 NFT 赚了数千美元——唯一的问题是，这些\
  \ NFT 的处理消耗了 8.7 兆瓦时的能量。为了直观，这相当于一个美国家庭一年的消耗——而这一切是在几秒钟完成的！不用说，对于承诺为减少排放贡献力量的人来说，这种情况并不乐观。\n\
  \nNFT 碳排放的主要缺陷在于 `Ethereum` 区块链，它和 `Bitcoin` 区块链一样，依赖数据挖掘来验证网络上传的交易区块。要验证掉区块中的 NFT，必须执行若干“工作量”过程，这些过程需要大量的计算能力来求解方程。因此，消耗大量的电力来“证明”一个\
  \ NFT 是它所声称的：一段原始且独特的数据（音乐/艺术/游戏或任何其他数据）。艺术界的一些人对这一事实感到非常不安，他们已经记录并尽尽努力进行平衡。\n\n\
  这种努力的成果之一是艺术家 `Jason Bailey` 发起的所谓“绿色 NFT”倡议。Bailey 先生致力于寻找一种让 NFT 生产更环保的方法，即创建一种他所称的“赏金系统”，该系统为那些寻求减少\
  \ NFT 造成的碳排放的人提供激励。即使是 NFT 先驱和 `CryptoPunk` 的创始人 `Matt Hall` 和 `John Watkinson`\
  \ 也参与了这一努力，签署成为“法官小组”的一员，评审参与者减少碳足迹的努力。然而，目前为止，该项目仅处于传播问题问题的初始阶段。尽管有从电力到太阳能和水能的大规模改造建议，但现实中，解决这一困境的更直接、更有意义的解决方案尚未出现。\n\
  \n## NFT 风格的资本主义会夺走游戏的乐趣吗？\n\n随着在线游戏的爆炸，任何游戏玩家都会告诉你，它最棒的一点是你可以探索几乎无止境的在线世界，在这些世界上几乎任何人都可以做或获得任何东西。在这些游戏中，玩家会找到各种物品来增强体验。例如，在一个剑与魔法的游戏中，玩家不可避免地会获得盔甲、剑、盾牌、魔法道具等。获得必要的经验并能够正确装备你的角色需要技巧和脑筋。\n\
  \n但等等——如果未来你只需要钱呢？是的，想象一下吧。顶尖玩家的定义不再取决于他们的技能，而是取决于万能的美元——呃，嗯，加密货币。与其与术士战斗以获得一颗用来杀死敌人的龙牙，如果你可以直接用加密货币购买这个——或任何其他重要物品呢？随着\
  \ NFT 让人们可以使用现实世界的货币购买游戏中的物品，这正成为一种日益增加的可能性。\n\n\n\n\n\n# 资本利得税 —— NFT 潜在投资者的噩梦？\n\
  \n资本主义的原则可能会助燃在线游戏中的虚拟土地争夺战。不过，既然我们谈到了这个话题，它也将带入“资本利得税”的形式让老山大叔（美国政府）也入其中。因为 `IRS`\
  \ 对此事的立场非常明确。关于此事，`IRS` 官方表示：“如果你将作为资本资产持有的虚拟货币兑换为其他财产（包括商品或其他虚拟货币），你将确认一项资本利得或亏损。”这意味着，如果这些潜在的\
  \ NFT 投资者未能报告他们的投资，他们可能会在 `IRS` 处陷入大麻烦。这意味着尽管加密货币的名称中带有“货币”二字，但 `IRS` 并不承认其为货币。`IRS`\
  \ 将其视为一种正在被投资的资产。由于 `Bitcoin` 和 `Ether` 等加密货币具有价值快速增长的特长，2021 年价值几百美元的 `Bitcoin`\
  \ 或 `Ether` 到 2022 年可能非常接近千美元。因此，对于这种“资本资产”的持有者来说，在报税季，这可能会是一个相当大的冲击。由于 NFT 属于收藏品范畴，它们面临着更严苛的资本利得税率，即\
  \ 28%。例如，卖出价值 6900 万美元作品的艺术家 Beeple，预计必须为这笔交易缴纳数千万美元的税。Beeple 在得知这一事实后，其反应可能是许多潜在\
  \ NFT 投资者都会产生的想法。Beeple 被引用原话说道：“噢，妈的，那税也太多了！”\n\n## 第 18 章：你应该避免的 NFT 错误\n\n在你一头脑地冲入\
  \ NFT 世界之前，有一些你必须避免的常见错误。虽然 NFT 的创建和销售并没有持续多久，但可以看出，有些人正在一次又一次地犯同样的错误。所有这些错误对于你在这\
  \ NFT 世界的成功来说都是毁灭性的。在你刚开始时可能会犯一些其他小错误，这没关系。只要你从中从中汲取教训，就可以。你需要做的是避免这些可能决定成败的巨大错误。\n\
  \n### 考虑过于短视\n\n是的，某些 NFT 在过去一年里以数百万的价格出售。但这并不意味着你创建 NFT 或投资 NFT 并在第一次就能赚到大笔钱。如果你试图通过\
  \ NFT 太快地赚太多钱，那么你很可能会失败并放弃整个念头。毫无疑问，NFT 之旅程可以是非常令人兴奋的。但这并不意味着你在下周这个时候就会成为一名百万富翁。如果你以“快速致富”的态度进入\
  \ NFT 领域，你极可能会失败。通过 NFT 成功的最佳方式是提供价值。你还需要足够的耐心，因为你可能无法立即卖出你的 NFT。保持营销努力的一致性，并花时间建立对未来有益的合作和伙伴关系。如果你对\
  \ NFT 游戏是认真的，请长期投入。\n\n### 对你的 NFT 推广不够\n\n仅仅创建你的 NFT 并将它们列在 `OpenSea` 上，并期待钱源源不断进来是不够的。`OpenSea`\
  \ 上已经有数百万个 NFT 上架，其中大多数都在苦苦寻找买家。忘记掉“只要建立，他们自然会来”的概念吧。这是不会发生的。你需要制定一个营销计划并坚持执行。识别你的目标受众是谁，然后找到他们出没的地方。利用社交平台来加强你的\
  \ NFT 推广。充分利用 `Discord` 论坛、`Clubhouse` 和 `Reddit` 来增加你的优势。尽你所能让你的 NFT 和你的才华传出去。有些人可能在\
  \ NFT 上获得好运。他们可能将 NFT 列在 `OpenSea` 上并迅速售出，让人们求着买更多。这种情况非常罕见。你不能指望这种运气，所以务必有一个推广计划并付诸行动。\n\
  \n### 为你的 NFT 选择了错误的市场\n\n这是我们反复看到的另一个经典错误。NFT 创作者们懒得进行必要的研究，他们直接选择了 `OpenSea`，因为它是最大的平台。是的，`OpenSea`\
  \ 确实有很多访问者（每月近 4000 万且仍在增长），但这并不意味着它是你 NFT 的最佳平台。在使用某个 NFT 市场之前，你需要了解几点。最重要的一点是知道你的目标受众是否使用该市场。你还需要考虑你想创建的\
  \ NFT 是否符合该市场的理念。随着不断有新的 NFT 市场不断涌现，你需要确定你正在考虑使用的市场是否安全。市场中社区规模很重要，但更重要的是社区是否响应并乐于帮助。不幸的是，已经存在一些诈骗性的\
  \ NFT 网站。这些人只会向你收取费用来支付 `Ethereum` 等费用，而你永远卖不掉任何东西。为了避免这些诈骗 NFT 网站，使用 `Dapp Radar`\
  \ 网站来检查合法性。\n\n### 廉价做 NFT\n\n你对你的 NFT 事业投入的越多，越好。许多人犯了一个错误，认为 NFT 世界是免费的，他们可以用最廉价的方式完成一切。虽然有些平台不收上架费，但大多数质量最好的平台都是收费的，所以你需要将此考虑在你的\
  \ NFT 预算中。我们已经告诉过你多次，以太坊网络目前是最流行的 NFT 网络。如果你使用以太坊网络，你就必须支付 Gas 费。你还需要为你的 NFT 营销投入一些资金。除非你在社交媒体上拥有巨大的粉丝群，否则你需要使用社交媒体广告来展示你的\
  \ NFT。这是一种相当廉且有效的方法。随着 NFT 变得更加流行，Gas 费和手续费可能会下降，但这无法保证，你不能依赖这种情况的发生。如果费用真的了，就把省下的钱用于更多的营销。你需要认真对待你的\
  \ NFT 之旅，并做好投入的准备以获得最大的成功机会。\n\n# 第 19 章：NFT 中的体育与电子竞技\n\n在一个领域，极客文化和运动员文化产生了交集：收藏。几十年前，日本街机厅曾有一种非常有趣且创新的视频游戏，名为\
  \ `Sega Card Gen '10`。它的理念是：这是一款棒球视频游戏，你像向自动贩卖机投入美元一样插入棒球卡，这些卡片就会创建你的阵容。你就像在任何收藏品店购买卡片一样。根据棒球运动员的记录，视频游戏会评估他们在游戏中的表现。因此，拥有数据更出色的球员将有助于你在游戏中获胜。这种类型在亚洲仍然流行，目前最成功的形式可能是《三国大战战》。卡片的潜力依然存在，但不再需要实体。例如，你可以将\
  \ NFT 交易卡与非常有价值的视频游戏 IP（如 `MLB` 系列）相结合，这些收藏品将让你在游戏中拥有一支强大的球队。游戏本身会激励球员卡的交易。\n\n\n\
  \n\n\n# NFT 的起源\n\nNFT 的诞生以一种奇特的方式自视频游戏宇宙。视频游戏已成为规模庞大、成本高昂且在技术上令人印象深刻的工程。几年前，视频游戏在资金投入上已经超越了你好莱坞（Witkowski,\
  \ 2020）。视频游戏的问题在于它们是一项极具风险的业务。你可以投入数亿美元，但项目可能会在一个规模巨大且竞争激烈的领域内完全失败。这些游戏消耗了多年的人工，而这些人因其技术专业工作获得了丰厚的报酬。\n\
  \n从传统上来说，视频游戏的一个问题是，你把它们卖掉后就结束了。你花费时间和资源创造了某种东西，然后几个人购买了它们，接着项目结束，你必须开始新项目，并再次承担同样的风险。视频游戏制作工作室逐渐引入了让游戏长期盈利的方法。这种经营模式的先驱之一是一款尽管已经发布多年但今天仍被游玩的游戏。它被称为\
  \ `Team Fortress 2`。这款游戏通过向玩家出售物理世界中不存在的东西来获利。实际上，他们是在为该游戏出售 NFT。\n\n在游戏中，你可能扮演一个拿着火箭发射器的角色。然而，如果你向制作游戏的工作室支付仅两美元的极低价格，你就可以为你的游戏角色获得一种不同的武器。拥有\
  \ `TF2` 的工作室 `Valve` 有权在任何时间为每一个人提供他们想要的任何角色的任何武器或服装的副本。由于他们对游戏及其内容拥有绝对控制权，因此他们有权向其中注入稀缺性。\n\
  \n随着这类游戏中的物品被赋予非常精确的稀有度，这个想法演变得更加复杂。有些物品极其难以找到，有些则只能在极短的时间窗口获得，这对数量和流通创造了自然限制。这些虚构物品可以在同样由公司拥有的市场中进行交易和销售，公司也能从每笔交易中获得抽成。其中一些物品可能是装饰性的，可能对游戏体验产生某种影响，而另一些仅仅是为了改变美学并让它看起来更漂亮。人们支付了巨额真实的资金来购买这些东西。这使得游戏在最初发布后的多年里都能保持盈利，因为他们不断向市场中引入新的虚构物品，并可以留住原有的团队继续积累该项目的经验，而无需将他们转移到完全全新的项目中。所以，从这个角度来看，NFT\
  \ 已经以某种形式存在了，并且已经让许多人赚了大量的钱。\n\n# 体育收藏品的重生\n\n这种新形式的数字资产为体育收藏品点燃了巨大的新热情。正如人们喜欢拥有某物品的签名版一样，这也是创建数字签名的一种。`Payton\
  \ Manning` 可以拿出他的超级碗赛戒指，通过在它们附近挥动 3D 扫描仪对它们全部制作 3D 数字化模型，然后出售这些 3D 模型。可能有人在这本书出版之前就已经想到了这一点并开始了类似的销售。`NBA\
  \ Top Shot` 在过去两年中通过出售 NFT 创造了 2.3 亿美元的销售额。一段 `LeBron James` 扣掉 `Nemanja Bjelica`\
  \ 的短视频以 208,000 美售出。人们正为这些东西支付着疯狂的数字。\n\n我们正在见证体育卡片的回归。它们可以像艺术版画一样，以有限供应的方式创建。你可能会发现一张艺术版画，上面写着小标记，说明它是\
  \ 200 张中的第 7 号。这告诉任何看它的人，这种特定的印刷品只存在 200 份，拥有它是稀有的事情。他们可以生产有限数量的 `Mickey Mantle`\
  \ 数字卡片，可能只有几百张。这种资产可以像不久前孩子和大人交易棒球卡片那样，轻松地与其他人交易。而互联网市场则大不同，因为每一张卡片始终处于完好状态。\n\n\
  这些资产还可以以有趣的方式与智能合约结合。例如，一张独一无二的 `Wayne Gretzky` 卡片可能让所有者有权在 `NHL` 在线商店出售的所有 `Wayne\
  \ Gretzky` 商品享受折扣。一张卡片可能让所有者在比赛中获得佳座。增加这些功能也使卡片的价值远超了仅仅的收藏价值。\n\nNFT 可以整合到奇幻体育联赛中，作为一种通过交易卡片来交易球员的方式。它增加了实际功能。目前，来自\
  \ NFT 最重要的价值是其非不可替代性，但还有创建它的真实人物。一个开发并出售 NFT 的未知艺术家无法指望它价值很高。来自俄亥俄州辛辛那提的牙科保健员 `Jeff`\
  \ 不会因为他的名字在上面就拥有一个非常有利可的 NFT。一个极其成功且有名的人，例如政治家、艺术家或运动员制作的 NFT，会赋予它巨大的价值。正如我们所说，NFT\
  \ 是数字签名，而签名才是重要的。这对于许多名人来说将是非常有利可图的，特别是那些发展了深厚收藏品文化领域的名人。这意味着特别是体育和极客文化相关的属性，他们正在做的事情是非常明智的。\n\
  \n\n\n\n\n# 视频游戏资产\n\n视频游戏资产已经商品化多年了。这在移动游戏市场中尤为明显。在这些环境中，玩家经常可以使用游戏内的虚拟货币，这些货币可以作为游戏资产被购买。这种游戏货币可以通过玩游戏获得，也可以通过花费真实的金钱获得。而且人们一直在这么做。移动游戏制作成本低，休闲玩家容易接受，而且利润极其丰厚。\n\
  \n游戏中非常流行的一种资产是“皮肤”。皮肤本质上是装扮你化身的一种不同方式。化身是你在游戏中受控你控制的角色。如果你在玩 `Super Mario Bros`，马里奥就是你的化身。对于其中许多游戏来说，你是通过化身的眼睛来观察的；你是在以第一人称视角体验游戏。这意味着你甚至看不到自己的皮肤。只有其他玩家在在你玩游戏时才能看到你的皮肤。你甚至无法享受自己赢得或付费购买的审美体验。\n\
  \n考虑一下其中的影响。人们会花真金钱在他人面前改变自己的形象，而他们几乎没有机会享受。其中某些皮肤特别昂贵或稀有，或者只能通过赢得锦赛之类的成就获得。这些皮肤被等同于穿戴古驰，或者是一种能力的标志。它们信号着你非常擅长这款游戏并已经取得了成就。你可以把它们想象成军事领袖胸前的勋章，或者童子军腰带上的荣誉章。仅仅是能够向他人表达这些事情的荣誉就具有极高的价值。\n\
  \n在比利时和荷兰，某些虚拟物品系统已被取缔或受到严格监管。特别是钥匙和抽奖箱（loot crates）的概念。这是一种通过心理诡术销售数字资产的方法。游戏偶尔会给玩家抽奖箱。他们承诺箱子里有玩家可能想要的某种游戏资产。玩家只能用钥匙打开打开箱子。获得钥匙的唯一方法是用真金钱购买。\n\
  \n请记住，这是数字资产。没有真实的箱子。没有真实的钥匙。箱子内部没有资产。它里面什么也没有。它没有内部空间。它只是一个箱子的数字图像。它不是真实的箱子。通过购买钥匙并将其用在箱子上上，你所做的只是触发了一个随机数生成器，来为你选择一个随机资产。由于这些资产是可交易且有价值的，而且它们是通过使用真金钱的随机数生成系统授予的，一些政府将其解读为赌博的形式。\n\
  \n这些游戏通常深受儿童青睐。因为在大多数地方，你必须成年才能赌博，这产生了一个尚未解决的法律困境。由于它没有像普通赌场那样受到监管，而且没有办法以正常方式计算胜率，这在道德上进一步变得疑点重重。你可以计算扑克或或骰子游戏的获胜率。但创造了这种资产生产机器的后端数学模型是完全不可见的，我们完全依赖游戏工作室的善意。这些箱子里的“利品”本质上是\
  \ `NFTs`。箱子是一个 `NFT`，当它与钥匙 `NFT` 结合时会生成一个不同的 `NFT`。如果你觉得这些听起来很奇怪，那是你非常敏锐的观察。事情会变得越来越诡。\n\
  \n# 第 20 章：NFT 股票\n\n比特币和其他加密货币像真钱一样，具有同质性，这意味着它们可以相互之间进行交易或交换。例如，一个 `Bitcoin` 的价值总是与另一个\
  \ `Bitcoin` 的价值相等。同样，一个单位的 `Ether` 总是等于另一个的 `Ether`。由于它们的同质性，加密货币非常适合作为数字经济中安全的交换媒介，它们在那里已获得广泛认可。相反，它们是资产的数字表示，被比作数字护照，因为每个令牌都包含一个独特的、不可传输的身份，使其能够与流通中的其他令牌区分来。它们还是可扩展的，这意味着你可能通过繁殖两个\
  \ `NFTs` 来创建一个第三个独一无二的 `NFT`。`NFTs` 像 `Bitcoin` 一样包含了所有权信息，允许令牌持有者之间易于识别和传输。\n\n\
  此外，`NFTs` 允许资产所有者提供与物品相关的信息或特征。例如，在咖啡豆的情况下，代表豆的令牌可能被归类为公平贸易。或者，艺术家可以在与其相关的信息中包含签名，对他们的数字作品签名。\n\
  \n`NFTs` 的开发是 `ERC-721` 标准产生的结果。`ERC-721` 是一个智能合约标准，由一些负责 `ERC-20` 智能合约标准的某些人员开发。它定义了游戏代币交换和发行所需的最小接口——包括所有权详情、安全性和元数据。将想法进一步，`ERC-1155`\
  \ 标准在降低与非同质化令牌相关的交易和存储成本的同时，还将将多种非同质化令牌合并到单个合约中。\n\n`Cryptokitties` 可能是 `NFTs` 最著名的用途，是一个很好的例子。`Cryptokitties`\
  \ 于 2017 年 11 月推出，在 `Ethereum` 区块网上具有唯一的识别码，是猫的数字表示。每只猫都是独一无二的，并有相应的 `ether` 价值。它们之间相互繁殖产生新的后代，每一个后代与其父母相比都有独特的特征和价值。在首次发布后，`Cryptokitties`\
  \ 迅速吸引了大量追随者，粉丝在几周内就花费了超过 2000 万 `ether` 来购买、喂养和照顾它们。\n\n\n\n\n\nPLBY Group PLBY\
  \ Group, Inc. 成立于 1953 年，总部位于加利福尼亚州，是一家市值 10 亿美元的娱乐与休闲服务公司。该公司成立于 1953 年，并在加利福尼亚州运营。此外，Playboy（该公司拥有的一个生活方式品牌）于\
  \ 7 月 9 日宣布，将与迈阿密海滩艺术收藏（Miami Beach Art Collection）合作，在展出 NFT 艺术品。消息发布后，股价立即上涨了\
  \ 2%。\n\n## 为什么非同质化代币很重要？\n\n与加密货币相对基础的概念相比，非同质化代币代表了巨大的进步。现代金融系统由针对各种资产类型的复杂交易和融资系统组成，涵盖从房地产、贷款合同到艺术品等。NFT\
  \ 通过创建物理资产的数字表示，为这一基础设施的重构迈出了重要的一步。诚然，真实资产的数字表示概念和唯一标识的使用并非新概念。然而，当这些理念与防篡智能合约区块链的优势相结合时，它们就变成了推动积极变革的强大力量。\n\
  \n市场效率可能是 NFT 最显著的优势。将实物转换为数字资产可以简化流程并消除对中间人的需求。在区块链上使用非同质化代币（NFTs）代表数字或物理艺术品，消除了对代理人的需求，并使艺术家能够直接与受众交流。它们还可能帮助提高企业运营效率。例如，供应链中的各种参与者与酒瓶的\
  \ NFT 进行通信将变得更加简单，并有助于追踪整个过程中酒瓶的产地、制造和销售情况。此类解决方案此前由咨询公司安永（Ernst & Young）为其的一位客户创建过。\n\
  \n非同质化代币也是身份管理背景下的理想用例。例如，考虑实际护照的情况，在每个出入点都必须出示。当个人的护照转换为具有独特标识特征的国家身份证（每个唯一）时，简化全球范围内司法管辖区的出入境程序就变得可能。此外，NFT\
  \ 可用于数字世界的身份管理，这是对早期用例的扩展。\n\n此外，非金融机构（NFTs）可以通过将房地产等有形资产碎片化来实现投资的民主化。例如，将数字房地产资产分给众多所有者，比将物理房地产资产分给许多所有者要简单得多。这种代币化伦理不必局限于房地产；它也适用于其他类型的资产，例如艺术品。结果是艺术品并不一定需要单一所有者。相反，多个人可能拥有艺术品的数字副本，每人负责画作的不同部分。此类协议具有增加公司价值和收入的潜力。\n\
  \n新市场和新投资类型的开发代表了非金融机构最引人注目的前景。想象一块划分为许多区域的房地产，每个区域都包含一组独特的特征和各种类型的物业。其中一个区域位于海滩附近，另一个是娱乐综合体，而另一个仍然是住宅区。一个\
  \ NFT 代表了一块独特的土地，每块土地的价值根据其独特特征而具有不同的估值。通过将基础性信息整合到每个 NFT 中，可以使原本复杂且官僚主义的房地产交易变得更加简单。运行在\
  \ `Ethereum` 区块链上的虚拟现实平台 `Decentraland` 已经实现了这一理念。随着非同质化代币（NFTs）变得越来越复杂并链接到金融基础设施，将相同的代币化地块理念可能变得可行，每个地块在现实世界中都有不同的价值和位置。\n\
  \n\n\n\n\n# 结论\n\nNFT 具有无限的潜力和可能性，近期创纪录的销量推动了技术的进步。目前阻碍广泛采用的障碍是人们对加密货币世界和区块链技术的缺乏广泛认知。“如果你教人们去品味它，让他们去体验，他们就不会被其所淹倒，”Develop\
  \ Your Base 的创建者 John G Fields 说道。\n\n## 安全与教育\n\n安全是这项培训的一部分，因为区块链领域的新用户需要知道如何保护他们的钱包和私钥，以防止黑客接触到他们价值巨大的数字资产。许多数字艺术品、收藏品和投资因其稀有性而具有极高价值，一旦丢失无疑将是毁灭性的。开发者和创作者必须确保在智能合约中加入强大的版权和许可机制，以确保数字资产的完整性。\n\
  \n## 加密钱包的可访问性\n\n目前大多数加密货币钱包极其复杂，对于缺乏经验的用户和主流初学者来说很难使用。尽管如此，`Coinbase Wallet`、`Pillar\
  \ Wallet`、`Enjin Wallet` 或 `WAX Wallet` (`WCW`) 等仍在不断开发和发布，以改善这一状况。\n\n`NGRAVE ZERO`\
  \ 是另一个值得关注的钱包，因为它是最“冷”、最安全的加密货币钱包，而且极其易用且使用无缝。`ZERO` 高质量的触摸屏不仅为用户存储和交易虚拟财产提供了一个安全的环境，还具有有趣的潜力，允许所有者通过微型便携设备向他人展示他们的虚拟收藏品和资产。\n\
  \n## 采用的未来\n\n大众教育的另一部分是看极客、技术宅和科学化的 NFT 以及区块链技术保持在什么程度。进一步的简化是至关重要的，以便不熟悉区块链的人能够轻松地使用和理解它。Jesse\
  \ Reich 博士（`Splinterlands` CEO）解释道挑战在于“如何让区块链对缺乏经验的用户是不可见的，同时对高级用户是易用的”。在《游戏与非同质化代币的未来》董事会上。\n\
  \n虽然像 `CryptoKitties` 等项目成功启动了新的区块链用户和增长，并在最近几个月内增加了 NFT 的使用场景，但仍有很长的路要走。NFT 的热情主要在游戏、艺术和收藏品等小众领域，但新企业日益将\
  \ NFT 扩展到我们物理存在的其他方面。\n\n## 市场扩张与投资\n\n随着更多主流品牌进入战场，我们可以看到 NFT 在虚拟和物理世界之间变得可以传输，例如\
  \ `Nike` 授权了名为 `CryptoKicks` 的 NFT 鞋子，这让使用户能够进行“繁殖”。正如 `Animoca Brands` CEO Yat\
  \ Siu 说得非常贴切的：“有多少游戏公司会说，让我们在虚拟游戏中使用那些 Nike 鞋子吧？如果数百万人意外地拥有了虚拟的 Nike 鞋子。”Yat Siu，`Animoca\
  \ Brands` CEO。\n\n随着越来越多的人意识到 NFT 能提供的价值和潜力，更多主流品牌、大投资者和风险资本公司开始关注并产生兴趣。`Morgan\
  \ Creek Digital` 的联合创始人 Anthony Pompliano 和 Jason Williams 对数字艺术 NFT 进行了一场“伟大的豪赌”，其表现优于实体艺术市场。\n\
  \n由于其产品周期极长以及提供各种变现模式的意愿，独立区块链游戏设计人员开始吸引风险投资。NFT 领域的新治理代币就像在 `Defi` 领域一样，正在创造兴趣，而且还没有证据表明会有令人兴奋的新\
  \ NFT 和 `Defi` 类型出现。\n\n## 最终展望\n\n然而，NFT 的未来道路并非一帆风顺，因为它们将面临潜在的监管障碍。加密领域仍然非常年轻，尽管项目不断来去，但需要通过产生许多新项目继续作为一个社区存在。\n\
  \n感谢阅读。\n\n"
