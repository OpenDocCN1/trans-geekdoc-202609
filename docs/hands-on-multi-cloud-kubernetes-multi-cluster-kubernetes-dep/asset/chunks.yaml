  trans: "\n\n# 管理 Secrets 和 ConfigMaps\n\n使用 FluxCD 管理 Secrets 和 ConfigMaps 是处理应用程序敏感数据和配置的重要组成部分。Secrets\
    \ 用于存储敏感数据，而 ConfigMaps 用于存储非敏感配置数据。FluxCD 可以通过其 Kustomize 集成管理这两种资源。以下是使用 FluxCD\
    \ 管理 Secrets 和 ConfigMaps 的分步骤指南：\n\n## 为应用程序配置创建新文件夹\n在你的 Git 仓库中创建一个新文件夹，用于存储应用程序的\
    \ Secrets 和 ConfigMaps。例如，你可以将此文件夹命名为 `config`。\n\n## 创建 ConfigMap YAML 文件\n在\
    \ `config` 文件夹中创建一个名为 `configmap.yaml` 的新文件，内容如下：\n\n```yaml\napiVersion: v1\n\
    kind: ConfigMap\nmetadata:\n  name: my-configmap\ndata:\n  my-key: my-value\n\
    \  another-key: another-value\n```\n将 `my-configmap` 替换为你所需的 `ConfigMap` 名称，并根据应用程序的需求在\
    \ `data` 下添加相应的键值对。\n\n## 创建 Secret YAML 文件\n如果你需要管理敏感数据，请在 `config` 文件夹中创建一个名为\
    \ `secret.yaml` 的新文件。由于以明文形式存储敏感数据是不安全的，你应该使用 `base64` 对值进行编码。可以使用以下模板：\n\n```yaml\n\
    apiVersion: v1\nkind: Secret\ntype: Opaque\nmetadata:\n  name: my-secret\ndata:\n\
    \  secret-key: c2VjcmV0LXZhbHVl\n```\n将 `my-secret` 替换为你所需的 `Secret` 名称，并根据需求在\
    \ `data` 下添加键值对。确保值已使用 `base64` 格式编码。要要对值进行 `base64` 编码，你可以使用如下命令：\n\n```bash\n\
    echo -n 'your-secret-value' | base64\n```\n\n## 创建 Kustomization 文件\n在 `config`\
    \ 文件夹中创建一个新的 `kustomization.yaml` 文件，内容如下：\n\n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\n\
    kind: Kustomization\nresources:\n  - configmap.yaml\n  - secret.yaml\n```\n如果你没有需要管理的\
    \ Secrets，请删除 `- secret.yaml` 这一行。\n\n## 更新主 Kustomization 文件\n在前面的步骤中创建的 `kustomization.yaml`\
    \ 文件中，添加对 `config` 文件夹的引用：\n\n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\n\
    kind: Kustomization\nresources:\n  - flux-system\n  - <APP_FOLDER>\n  - config\n\
    ```\n将 `<APP_FOLDER>` 替换为包含应用程序 Kubernetes 清文件的文件夹名称。\n\n## 提交并推送更改\n提交更改到 Git\
    \ 仓库并推送到远程。FluxCD 将检测到更改并将 ConfigMaps 和 Secrets 应用到到 Kubernetes 集群。\n\n## 在应用程序中使用\
    \ ConfigMaps 和 Secrets\n现在可以在应用程序的 Kubernetes 清文件中引用已创建的 ConfigMaps 和 Secrets。例如，在\
    \ Deployment 清文件中，你可以将 ConfigMap 或 Secret 挂载为卷或将它们作为环境变量：\n\n```yaml\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  name: my-deployment\nspec:\n  template:\n\
    \    spec:\n      containers:\n      - name: my-container\n        image: my-image\n\
    \        env:\n        - name: MY_CONFIG_KEY\n          valueFrom:\n         \
    \   configMapKeyRef:\n              name: my-configmap\n              key: my-key\n\
    \        - name: MY_SECRET_KEY\n          valueFrom:\n            secret KeyRef:\n\
    \              name: my-secret\n              key: secret-key\n        volumeMounts:\n\
    \        - name: config-volume\n          mountPath: /etc/config\n        - name:\
    \ secret-volume\n          mountPath: /etc/secret\nvolumes:\n  - name: config-volume\n\
    \    configMap:\n      name: my-configmap\n  - name: secret-volume\n    secret:\n\
    \      secretName: my-secret\n```\n\n在上述示例中，Deployment 清文件将 ConfigMap 挂载为 `/etc/config`\
    \ 卷，并将 Secret 挂载为 `/etc/secret` 卷。此外，它分别使用 ConfigMap 和 Secret 中的值设置环境变量 `MY_CONFIG_KEY`\
    \ 和 `MY_SECRET_KEY`。\n\n通过遵循这些步骤，可以使用 FluxCD 有效管理 Secrets 和 ConfigMaps。你在 Git\
    \ 仓库中对 ConfigMaps 和 Secrets 进行的任何更改都将被 FluxCD 自动检测并应用。这种方法确保了你的敏感数据和应用程序配置是版本控制、安全且易于管理的。\n\
    \n"
- fmt: "\n# Monitoring and Alerting with FluxCD\n\nMonitoring and alerting are essential\
    \ aspects of managing a Kubernetes cluster with FluxCD. By setting up monitoring\
    \ and alerting, you can gain insights into the health and performance of your\
    \ cluster, as well as be notified of any issues. FluxCD emits `Prometheus` metrics,\
    \ which can be used to monitor the system, and you can use alerting tools like\
    \ `Alertmanager` to send notifications based on these metrics. Below is a step-by-step\
    \ walkthrough to set up monitoring and alerting with FluxCD:\n\n## Install Prometheus\
    \ and Alertmanager\n\nIf you don't have `Prometheus` and `Alertmanager` installed\
    \ in your cluster, you can use the `kube-prometheus-stack` Helm chart to set them\
    \ up.\n\n## Configure Prometheus to Scrape FluxCD Metrics\n\nFluxCD components\
    \ (`source-controller`, `kustomize-controller`, `helm-controller`, and `notification-controller`)\
    \ expose metrics on the `/metrics` endpoint. You'll need to create a `ServiceMonitor`\
    \ resource to tell Prometheus to scrape metrics from these components. Create\
    \ a file called `service-monitor.yaml` with the following content:\n\n```yaml\n\
    apiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\nmetadata:\n  name:\
    \ fluxcd\n  namespace: flux-system\n  labels:\n    release: prometheus\nspec:\n\
    \  selector:\n    matchLabels:\n      app.kubernetes.io/part-of: flux\n  namespaceSelector:\n\
    \    matchNames:\n      - flux-system\n  endpoints:\n    - port: http-metrics\n\
    \      interval: 30s\n```\n\nThis configuration tells Prometheus to scrape metrics\
    \ from services in the `flux-system` namespace with the label `app.kubernetes.io/part-of:\
    \ flux`. Adjust the labels and namespace if you have a custom setup.\n\n## Apply\
    \ ServiceMonitor Resource\n\nApply the `service-monitor.yaml` file to your Kubernetes\
    \ cluster:\n\n```bash\nkubectl apply -f service-monitor.yaml\n```\n\n## Set up\
    \ Custom Alerts\n\nYou can create custom alerts based on FluxCD metrics using\
    \ `Prometheus` `Alertmanager`. First, create a new file called `flux-alerts.yaml`\
    \ with the following content:\n\n```yaml\napiVersion: monitoring.coreos.com/v1\n\
    kind: PrometheusRule\nmetadata:\n  name: fluxcd-alerts\n  namespace: flux-system\n\
    spec:\n  groups:\n    - name: FluxCD\n      rules:\n        - alert: FluxCDReconciliationFailure\n\
    \          expr: rate(flux_reconcile_failure_count{namespace=\"flux-system\"}[5m])\
    \ > 0\n          for: 10m\n          labels:\n            severity: warning\n\
    \          annotations:\n            summary: \"FluxCD reconciliation failure\"\
    \n            description: \"FluxCD has been failing to reconcile resources for\
    \ the last 10 minutes.\"\n```\n\nThis example creates an alert called `FluxCDReconciliationFailure`,\
    \ which will be triggered if the rate of reconciliation failures in the `flux-system`\
    \ namespace exceeds 0 for 10 minutes. You can customize the alert expression,\
    \ duration, and severity based on your requirements.\n\n## Apply the PrometheusRule\
    \ Resource\n\nApply the `flux-alerts.yaml` file to your Kubernetes cluster:\n\n\
    ```bash\nkubectl apply -f flux-alerts.yaml\n```\n\n## Configure Alertmanager to\
    \ Send Notifications\n\nYou can configure `Alertmanager` to send notifications\
    \ when an alert is triggered. This involves configuring receivers like email,\
    \ `Slack`, or `PagerDuty`.\n\n## Verify Monitoring and Alerting\n\nTo verify that\
    \ monitoring and alerting are working, you can check the metrics and alerts. By\
    \ following these steps, you can set up monitoring and alerting with FluxCD.\n\
    \n## Advanced FluxCD Features\n\nFluxCD offers several advanced features that\
    \ allow you to further customize and enhance your Git workflow:\n\n### Image Automation\n\
    FluxCD can automatically update your Kubernetes manifests when a new container\
    \ image is available in a container registry. This can be achieved using `ImageRepository`\
    \ and `ImagePolicy` custom resources, along with `ImageUpdateAutomation` resources.\n\
    \n### Notifications and Event Forwarding\nFluxCD's `notification-controller` can\
    \ send notifications to various channels like `Slack`, `Microsoft Teams`, `Discord`,\
    \ and others. You can configure the `notification-controller` using `Alert` and\
    \ `Provider` custom resources. Additionally, you can forward events to external\
    \ systems like `Elasticsearch`, `Sentry`, or custom APIs using `Event` and `Receiver`\
    \ custom resources.\n\n### Multi-tenancy\nFluxCD supports multi-tenancy, allowing\
    \ you to manage multiple tenants within a single Kubernetes cluster. Each tenant\
    \ can have its own Git repository, FluxCD instance, and restricted access to specific\
    \ namespaces or clusters.\n\n### Health Checks and Dependencies\nFluxCD can perform\
    \ health checks on your applications after a reconciliation. It uses Kubernetes'\
    \ built-in health checks (liveness and readiness probes) to determine if an application\
    \ is healthy after an update. Additionally, you can define dependencies between\
    \ applications, ensuring that they are updated in the correct order.\n\n### Garbage\
    \ Collection\nFluxCD can automatically remove Kubernetes resources that are no\
    \ longer present in the Git repository. This feature, known as garbage collection,\
    \ helps keep your cluster clean and prevents orphaned resources from consuming\
    \ resources and causing conflicts.\n\n### Cluster API Support\nFluxCD has built-in\
    \ support for managing Kubernetes clusters using the Cluster API (CAPI). With\
    \ this integration, you can manage the lifecycle of your Kubernetes clusters using\
    \ GitOps, including provisioning, scaling, and upgrading.\n"
  raw: "Monitoring and Alerting with FluxCD Monitoring and alerting are essential\
    \ aspects of managing a Kubernetes cluster with FluxCD.  By setting up monitoring\
    \ and alerting, you can gain insights into the health and performance of your\
    \ cluster, as well as be notified of any issues.  FluxCD emits Prometheus metrics,\
    \ which can be used to monitor the system, and you can use alerting tools like\
    \ Alertmanager to send notifications based on these metrics. Below is a step-by-step\
    \ walkthrough to set up monitoring and alerting with FluxCD: Install Prometheus\
    \ and Alertmanager If you don't have Prometheus and Alertmanager installed in\
    \ your cluster, you can use the kube-prometheus-stack Helm chart to set them up.\
    \ Configure Prometheus to Scrape FluxCD Metrics FluxCD components (source-controller,\
    \ kustomize-controller, helm-controller, and notification-controller) expose metrics\
    \ on the /metrics endpoint.  You'll need to create a ServiceMonitor resource to\
    \ tell Prometheus to scrape metrics from these components.  Create a file called\
    \ service-monitor.yaml with the following content: apiVersion: monitoring.coreos.com/v1\
    \ kind: ServiceMonitor metadata:   name: fluxcd   namespace: flux-system   labels:\
    \     release: prometheus spec:   selector:     matchLabels:       app.kubernetes.io/part-of:\
    \ flux   namespaceSelector:     matchNames:     - flux-system   endpoints:   -\
    \ port: http-metrics     interval: 30s This configuration tells Prometheus to\
    \ scrape metrics from services in the flux-system namespace with the label app.kubernetes.io/part-of:\
    \ flux.  Adjust the labels and namespace if you have a custom setup. Apply ServiceMonitor\
    \ Resource Apply the service-monitor.yaml file to your Kubernetes cluster: kubectl\
    \ apply -f service-monitor.yaml Set up Custom Alerts You can create custom alerts\
    \ based on FluxCD metrics using Prometheus Alertmanager.  First, create a new\
    \ file called flux-alerts.yaml with the following content: apiVersion: monitoring.coreos.com/v1\
    \ kind: PrometheusRule metadata:   name: fluxcd-alerts   namespace: flux-system\
    \ spec:   groups:   - name: FluxCD     rules:     - alert: FluxCDReconciliationFailure\
    \       expr: rate(flux\\_reconcile\\_failure\\_count{namespace=\"flux-system\"\
    }\\[5m\\]) > 0       for: 10m       labels:         severity: warning       annotations:\
    \         summary: \"FluxCD reconciliation failure\"         description: \"FluxCD\
    \ has been failing to reconcile resources for the last 10 minutes.\" This example\
    \ creates an alert called FluxCDReconciliationFailure, which will be triggered\
    \ if the rate of reconciliation failures in the flux-system namespace exceeds\
    \ 0 for 10 minutes.  You can customize the alert expression, duration, and severity\
    \ based on your requirements. Apply the PrometheusRule Resource Apply the flux-alerts.yaml\
    \ file to your Kubernetes cluster: kubectl apply -f flux-alerts.yaml Configure\
    \ Alertmanager to Send Notifications You'll need to configure Alertmanager to\
    \ send notifications when alerts are triggered.  This involves editing the Alertmanager\
    \ configuration, typically located in a ConfigMap or Secret. Refer to the Alertmanager\
    \ documentation for instructions on configuring various receivers like email,\
    \ Slack, or PagerDuty. Verify Monitoring and Alerting To verify that monitoring\
    \ and alerting are working correctly, you can use the Prometheus web UI to explore\
    \ the FluxCD metrics and check if the ServiceMonitor is correctly scraping the\
    \ data.  Access the Prometheus web UI by port-forwarding the Prometheus service\
    \ or by exposing it through an Ingress resource. kubectl -n <PROMETHEUS\\_NAMESPACE>\
    \ port-forward svc/prometheus-kube-prometheus-prometheus 9090:9090 Replace <PROMETHEUS\\\
    _NAMESPACE> with the namespace where you have installed Prometheus (usually monitoring\
    \ or prometheus). Once you have access to the Prometheus web UI, you can search\
    \ for FluxCD-specific metrics (such as flux\\_reconcile\\_failure\\_count) and\
    \ ensure they are being collected. Next, navigate to the Alertmanager web UI to\
    \ verify that your custom alerts have been loaded and are being evaluated.  Access\
    \ the Alertmanager web UI by port-forwarding the Alertmanager service or by exposing\
    \ it through an Ingress resource. kubectl -n <PROMETHEUS\\_NAMESPACE> port-forward\
    \ svc/prometheus-kube-prometheus-alertmanager 9093:9093 Replace <PROMETHEUS\\\
    _NAMESPACE> with the namespace where you have installed Prometheus. In the Alertmanager\
    \ web UI, you should see your custom alerts under the \"Alerts\" tab.  If an alert\
    \ is triggered, you should receive a notification through the configured receiver(s).\
    \ By following these steps, you can set up monitoring and alerting with FluxCD\
    \ to keep an eye on your cluster's health, performance, and stability.  This will\
    \ enable you to react quickly to issues and maintain a reliable and efficient\
    \ Kubernetes environment. \n\nAdvanced FluxCD Features FluxCD offers several advanced\
    \ features that allow you to further customize and enhance your GitOps workflow.\
    \  Some of these features include: Image Automation FluxCD can automatically update\
    \ your Kubernetes manifests when a new container image is available in a container\
    \ registry.  This can be achieved using ImageRepository and ImagePolicy custom\
    \ resources, along with ImageUpdateAutomation resources to update the Git repository.\
    \  With image automation, you can ensure that your applications always run the\
    \ latest container images without manual intervention. Notifications and Event\
    \ Forwarding FluxCD's notification-controller can send notifications to various\
    \ channels like Slack, Microsoft Teams, Discord, and others when specific events\
    \ occur.  You can configure the notification-controller using Alert and Provider\
    \ custom resources.  Additionally, you can forward events to external systems\
    \ like Elasticsearch, Sentry, or custom APIs using Event and Receiver custom resources.\
    \  This enables you to better integrate FluxCD with your existing monitoring and\
    \ alerting infrastructure. Multi-tenancy FluxCD supports multi-tenancy, allowing\
    \ you to manage multiple tenants within a single Kubernetes cluster.  Each tenant\
    \ can have its own Git repository, FluxCD instance, and restricted access to specific\
    \ namespaces or clusters.  This enables you to isolate tenants' resources and\
    \ configurations and enforce strict access control policies. Health Checks and\
    \ Dependencies FluxCD can perform health checks on your applications after a reconciliation.\
    \  It uses Kubernetes' built-in health checks (liveness and readiness probes)\
    \ to determine if an application is healthy after an update.  Additionally, you\
    \ can define dependencies between applications, ensuring that they are updated\
    \ in the correct order.  This is particularly useful when you have applications\
    \ that depend on other services or configurations to be deployed first. Garbage\
    \ Collection FluxCD can automatically remove Kubernetes resources that are no\
    \ longer present in the Git repository.  This feature, known as garbage collection,\
    \ helps keep your cluster clean and prevents orphaned resources from consuming\
    \ resources and causing conflicts.  Garbage collection can be enabled on a per-namespace\
    \ or global basis. Cluster API Support FluxCD has built-in support for managing\
    \ Kubernetes clusters using the Cluster API (CAPI).  With this integration, you\
    \ can manage the lifecycle of your Kubernetes clusters using GitOps, including\
    \ provisioning, scaling, and upgrading.  This allows you to treat your cluster\
    \ infrastructure as code, ensuring that your infrastructure is versioned, auditable,\
    \ and easily recoverable. These advanced features, combined with FluxCD's core\
    \ functionality, provide a comprehensive and flexible GitOps solution for managing\
    \ Kubernetes applications and infrastructure.  By utilizing these features, you\
    \ can further optimize your development and deployment workflows, enhance security\
    \ and compliance, and better integrate FluxCD with your existing toolchain. "
