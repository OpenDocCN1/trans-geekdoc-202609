    # 前言


    《Hands-On Multi-Cloud Kubernetes》是任何想要深入理解 Kubernetes 以及如何利用其管理多云基础设施人员的必备指南。本书通过八个详尽的章节，提供了设置
    Kubernetes 集群、管理部署与更新以及使用 `AWS` 和 `GCP` 工具的实战经验。


    读者将学习使用一系列强大的工具，包括 `Helm`、`FluxCD`、`Virtual Kubelet`、`Submariner` 和 `KubeFed`。通过
    GitOps 原则和工作流，他们将实践持续交付并学习管理秘密（Secrets）和配置映射（Config Maps）。他们将使用 `Virtual Kubelet`
    构建并部署无服务器集群，并学习如何在多个云环境中对其进行扩展。他们还将通过 `Submariner` 进入跨集群网络的世界，在其中将学习执行服务发现、负载均衡和监控网络指标。管理多集群
    Kubernetes 是一项艰巨的任务，但通过 `KubeFed`，读者将获得设置和部署多集群联邦所需的技能，管理自己的基础设施变得比以往任何时候都容易。通过使用
    `Jenkins` 构建多云 CI/CD 流水线，他们将执行端到端的多云操作，确保代码快速、高效地交付。


    最后，本书涵盖了 Kubernetes 的安全性，为读者提供了配置 `RBAC`、Kubernetes 网络策略以及在 Kubernetes 集群上保护数据的工具和知识。他们甚至将学习使用
    `Open Policy Agent` 来管理合规性，确保他们的基础设施既强大又安全。


    ## 在书中，你将学习如何：


    * 从基础到高阶概念和工具，学习多云 Kubernetes

    * 在多云基础设施上设置和管理 Kubernetes 集群

    * 使用 `Helm`、`FluxCD` 和 `Virtual Kubelet` 等强大工具

    * 利用 `Submariner` 实现跨集群网络、服务发现和负载均衡

    * 使用 `Jenkins` 构建 CI/CD 流水线，实现端到端的多云操作

    * 实践 GitOps 原则和工作流以实现持续交付

    * 使用 `Virtual Kubelet` 构建并部署无服务器集群

    * 使用 `KubeFed` 将多个 Kubernetes 集群作为一个单一实体管理

    * 通过 `RBAC`、网络策略和 `Open Policy Agent` 确保 Kubernetes 的安全性


    无论你是初学者还是经验丰富的者，《Hands-On Multi-Cloud Kubernetes》都是理解 Kubernetes 和管理多云基础设施的必备指南。通过本书，读者将获得必要的知识和技能，能够从容应对遇到的任何挑战。


