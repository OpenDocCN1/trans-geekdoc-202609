  trans: "\n\n# 滚动更新 (Rolling Updates)\n\nKubernetes 提供了一种名为“滚动更新”的重要功能，它能够以最小的中断更新应用程序。本质上，滚动更新通过在\
    \ Kubernetes 中逐渐用新实例替换旧旧实例来实现，确保始终有一定数量的副本可访问。通过这种方式，即使应用程序的新版本正在部署，用户也可以继续访问旧版本的一部分，而不会对其体验产生中断。滚动更新是管理和更新容器化应用的关键方面，Kubernetes\
    \ 为此提供了一种稳健且可靠的方法。通过减少停机时间并允许更无缝的部署过程，滚动更新有助于确保应用程序保持最新并按预期运行，同时为用户提供不间断的访问。通过\
    \ Kubernetes，开发者可以使用一系列强大的工具，使他们能够轻松有效地管理和更新容器化应用。以下是如何在多云 Kubernetes 集群中管理部署滚动更新的方法：\n\
    \n## 执行滚动更新\n要对特定部署执行滚动更新，你需要更新容器镜像：\n\n```bash\nkubectl set image deployment\
    \ <deployment-name> <container-name>=<new-image>\n```\n将 `<deployment-name>` 替换为部署名称，将\
    \ `<container-name>` 替换为要更新的容器名称，并将 `<new-image>` 替换为新镜像。例如，如果你有一个名为 `my-nodejs-app`\
    \ 的部署，其中包含名为 `my-nodejs-app` 的容器，并且你想将镜像更新到 1.1 版本，运行：\n\n```bash\nkubectl set\
    \ image deployment my-nodejs-app my-nodejs-app=<your-dockerhub-username>/my-nodejs-app:1.1\n\
    ```\nKubernetes 将逐渐用新实例替换旧实例，确保应用程序在整个更新过程中保持可用。\n\n## 监控发布状态\n你可以使用以下命令检查发布状态：\n\
    \n```bash\nkubectl rollout status deployment <deployment-name>\n```\n将 `<deployment-name>`\
    \ 替换为你的部署名称。\n\n## 暂停和恢复发布\n你可以暂停发布以一次性应用多个更改或调试问题，然后稍后恢复它：\n\n```bash\n# 暂停发布\n\
    kubectl rollout pause deployment <deployment-name>\n# 进行更改或调试问题\n# ...\n# 恢复发布\n\
    kubectl rollout resume deployment <deployment-name>\n```\n将 `<deployment-name>`\
    \ 替换为你的部署名称。\n\n## 回滚到之前的版本\n如果你在滚动更新后遇到问题，可以回滚到部署的上一个版本：\n\n```bash\nkubectl\
    \ rollout undo deployment <deployment-name>\n```\n将 `<deployment-name>` 替换为你的部署名称。\n\
    \n## 查看发布历史\n要查看部署的发布历史，运行：\n\n```bash\nkubectl rollout history deployment <deployment-name>\n\
    ```\n将 `<deployment-name>` 替换为你的部署名称。\n\n## 回滚到特定修订版本\n如果你想回滚到特定的修订版本，使用 `--to-revision`\
    \ 标记：\n\n```bash\nkubectl rollout undo deployment <deployment-name> --to-revision=<revision-number>\n\
    ```\n将 `<deployment-name>` 替换为部署名称并将 `<revision-number>` 替换为所需的修订版本。\n\n通过使用这些命令和技术，你可以有效地管理多云\
