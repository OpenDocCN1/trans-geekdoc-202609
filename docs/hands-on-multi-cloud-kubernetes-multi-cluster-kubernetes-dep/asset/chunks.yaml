    the synchronization status: flux get kustomizations This command will display
    the current status of your configured Kustomizations, showing if they are successfully
    synchronized with your cluster. From this point on, any changes you push to the
    Git repository will be automatically detected and applied by FluxCD.  You can
    also use the Flux CLI to perform actions such as pausing or resuming synchronization,
    or checking the status of resources in your cluster. '
  toc: []
  trans: "\n\n# 使用 FluxCD 实现持续交付\n\nFluxCD 通过自动化软件交付流水线的各个阶段来实现持续交付（CD）。当新代码被合并到主分支时，FluxCD\
    \ 会自动检测到更改并触发部署过程。随后，应用程序的新版本将以可重复且可预测的方式构建、测试并部署到生产环境。\n\nFluxCD 还包含许多高级功能，例如金丝雀发布、蓝绿部署和回滚。这些功能允许团队在将新版本发布到生产环境之前，以受控的方式对其进行测试。如果发生问题，FluxCD\
    \ 可以自动回滚到应用程序的上一个版本，确保尽地减少停机时间并保持系统的高可用性。\n\n以下是使用 FluxCD 执行持续交付的逐步指南：\n\n###\
    \ 1. 配置 Git 仓库\n为了为 Kubernetes 设置 FluxCD，您需要配置一个 Git 仓库，作为集群预期状态的“单一事实来源”。这可以是一个新的\
    \ Git 仓库，也可以是您用于存储 Kubernetes 清单（manifests）和 FluxCD 配置的现有仓库。\n\n### 2. 将 FluxCD\
    \ 连接到 Kubernetes 集群\n一旦设置好 Git 仓库，您需要将 FluxCD 连接到您的 Kubernetes 集群。要此操作，请运行以下命令，并将占位符替换为自己的信息：\n\
    \n```\nflux bootstrap <GIT_PROVIDER> --repository=<USERNAME>/<REPO_NAME> --path=<PATH_IN_REPO>\
    \ --personal\n```\n\n`GIT_PROVIDER` 应替换为您使用的 Git 提供商名称（例如 `github`、`gitlab`、`bitbucket`），`USERNAME`\
    \ 替换为您的用户名，`REPO_NAME` 替换为您创建的仓库名称，`PATH_IN_REPO` 替换为仓库中存储 FluxCD 配置的路径。`--personal`\
    \ 表示您正在使用个人仓库。\n\n### 3. 创建 FluxCD 配置\n将 FluxCD 连接到 Kubernetes 集群后，您需要在 Git 仓库中创建一个新文件夹来存储\
    \ FluxCD 配置。在该文件夹中，添加一个包含以下内容的 `kustomization.yaml` 文件：\n\n```yaml\napiVersion:\
    \ kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - flux-system\n\
    ```\n\n该文件将配置包含 `flux-system` 目录。\n\n### 4. 定义应用程序的 Kubernetes 清单\n接下来，在 Git 仓库中另一个创建新文件夹来存储您应用程序的\
    \ Kubernetes 清单。将应用程序的 Kubernetes YAML 文件（如部署、服务和 ingress 资源）添加到此文件夹中。\n\n###\
    \ 5. 同步应用程序的清单\n要将您的应用程序清单与 FluxCD 同步，请在您的应用程序文件夹中添加一个新的 `kustomization.yaml`\
    \ 文件，其内容如下：\n\n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\n\
    resources:\n  - <APP_MANIFEST_FILE_1>\n  - <APP_MANIFEST_FILE_2>\n  ...\n```\n\
    \n将 `<APP_MANIFEST_FILE_1>`、`<APP_MANIFEST_FILE_2>` 等替换为应用程序 Kubernetes 清单的文件名。\n\
    \n### 6. 将应用程序添加到 FluxCD 配置中\n在步骤 4 中创建的 `kustomization.yaml` 文件中，添加对应用程序文件夹的引用：\n\
    \n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\n\
    resources:\n  - flux-system\n  - <APP_FOLDER>\n```\n\n将 `<APP_FOLDER>` 替换为包含应用程序\
    \ Kubernetes 清单的文件夹名称。\n\n### 7. 提交并推送更改\n将更改提交到 Git 仓库并推送到远程仓库。FluxCD 将检测到这些更改并将其应用到连接的\
    \ Kubernetes 集群。\n\n### 8. 监控同步状态\n使用 Flux CLI 监控同步状态：\n\n```\nflux get kustomizations\n\
    ```\n\n此命令将显示您配置的 `Kustomizations` 的当前状态，显示它们是否已成功与集群同步。从现在开始，您推送到 Git 仓库的任何更改都将由\
    \ FluxCD 自动检测并应用。您还可以使用 Flux CLI 执行如暂停或恢复同步，以及检查集群中资源状态的操作。\n\n"
- fmt: "\n# Managing Secrets and ConfigMaps\n\nManaging Secrets and ConfigMaps with\
    \ FluxCD is an essential part of handling sensitive data and configurations for\
    \ your applications. Secrets store sensitive data, while ConfigMaps store non-sensitive\
    \ configuration data. FluxCD can manage both of these resources using its Kustomize\
    \ integration. Below is a step-by-step walkthrough to managing Secrets and ConfigMaps\
    \ with FluxCD:\n\n## Create New Folder for Application's Configuration\nCreate\
    \ a new folder in your Git repository that will store your application's Secrets\
    \ and ConfigMaps. For example, you can name this folder `config`.\n\n## Create\
    \ ConfigMap YAML File\nCreate a new file in the `config` folder called `configmap.yaml`\
    \ with the following content:\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n\
    \  name: my-configmap\ndata:\n  my-key: my-value\n  another-key: another-value\n\
    ```\nReplace `my-configmap` with the desired name for your `ConfigMap`, and add\
    \ key-value pairs under `data` as needed for your application.\n\n## Create Secret\
    \ YAML File\nIf you need to manage sensitive data, create a new file in the `config`\
    \ folder called `secret.yaml`. Since storing sensitive data in plain text is not\
    \ secure, you should encode the values using `base64`. You can use the following\
    \ template:\n\n```yaml\napiVersion: v1\nkind: Secret\ntype: Opaque\nmetadata:\n\
    \  name: my-secret\ndata:\n  secret-key: c2VjcmV0LXZhbHVl\n```\nReplace `my-secret`\
    \ with the desired name for your `Secret`, and add key-value pairs under `data`\
    \ as needed. Make sure to encode the values in `base64` format. To encode a value\
    \ in `base64`, you can use a command like the following:\n\n```bash\necho -n 'your-secret-value'\
    \ | base64\n```\n\n## Create Kustomization File\nIn the `config` folder, create\
    \ a new `kustomization.yaml` file with the following content:\n\n```yaml\napiVersion:\
    \ kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - configmap.yaml\n\
    \  - secret.yaml\n```\nRemove the `- secret.yaml` line if you don't have any Secrets\
    \ to manage.\n\n## Update Main Kustomization File\nIn the `kustomization.yaml`\
    \ file you created in the previous steps, add a reference to the `config` folder:\n\
    \n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\n\
    resources:\n  - flux-system\n  - <APP_FOLDER>\n  - config\n```\nReplace `<APP_FOLDER>`\
    \ with the name of the folder containing your application's Kubernetes manifests.\n\
    \n## Commit and Push Changes\nCommit the changes to the Git repository and push\
    \ them to the remote. FluxCD will detect the changes and apply the ConfigMaps\
    \ and Secrets to the connected Kubernetes cluster.\n\n## Use ConfigMaps and Secrets\
    \ in Application\nIn your application's Kubernetes manifests, you can now reference\
    \ the created ConfigMaps and Secrets. For example, in a Deployment manifest, you\
    \ can mount a ConfigMap or Secret as a volume or use them as environment variables:\n\
    \n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: my-deployment\n\
    spec:\n  template:\n    spec:\n      containers:\n      - name: my-container\n\
    \        image: my-image\n        env:\n        - name: MY_CONFIG_KEY\n      \
    \    valueFrom:\n            configMapKeyRef:\n              name: my-configmap\n\
    \              key: my-key\n        - name: MY_SECRET_KEY\n          valueFrom:\n\
    \            secret KeyRef:\n              name: my-secret\n              key:\
    \ secret-key\n        volumeMounts:\n        - name: config-volume\n         \
    \ mountPath: /etc/config\n        - name: secret-volume\n          mountPath:\
    \ /etc/secret\nvolumes:\n  - name: config-volume\n    configMap:\n      name:\
    \ my-configmap\n  - name: secret-volume\n    secret:\n      secretName: my-secret\n\
    ```\n\nIn the above demonstrated example, the Deployment manifest mounts the ConfigMap\
    \ as a volume at `/etc/config` and the Secret as a volume at `/etc/secret`. Additionally,\
    \ it sets the environment variables `MY_CONFIG_KEY` and `MY_SECRET_KEY` using\
    \ the values from the ConfigMap and Secret, respectively.\n\nBy following these\
    \ steps, you can effectively manage Secrets and ConfigMaps with FluxCD. Any changes\
    \ you make to your ConfigMaps and Secrets in your Git repository will be automatically\
    \ detected and applied by FluxCD. This approach ensures that your sensitive data\
    \ and application configurations are version-controlled, secure, and easily managed.\n"
  raw: 'Managing Secrets and ConfigMaps Managing Secrets and ConfigMaps with FluxCD
    is an essential part of handling sensitive data and configurations for your applications.  Secrets
