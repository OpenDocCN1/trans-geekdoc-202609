    security groups or firewall rules. Export KUBECONFIG Files To ensure proper communication
    with multiple Kubernetes clusters, it is essential to set the KUBECONFIG environment
    variable correctly.  This variable specifies the configuration file(s) that kubectl
    uses to connect to the cluster.  You can merge multiple KUBECONFIG files into
    a single file or use separate files for each cluster.  This provides flexibility
    in managing and accessing multiple clusters with a single kubectl installation.  By
    configuring KUBECONFIG, you can avoid errors and issues that may arise due to
    incorrect connection settings.  Properly setting up KUBECONFIG is a crucial step
    in the process of managing multiple Kubernetes clusters. For example, if you have
    separate KUBECONFIG files for AWS and GCP: export KUBECONFIG\_AWS=path/to/aws-kubeconfig.yaml
    export KUBECONFIG\_GCP=path/to/gcp-kubeconfig.yaml Deploy Submariner To deploy
    Submariner on multiple clusters, you can use subctl.  The first step is to replace
    the placeholders "CLUSTER\_NAME" and "BROKER" with the relevant values.  The broker
    cluster is usually one of the participating clusters, but it can also be a separate
    cluster.  Subctl is a command-line tool that simplifies the deployment and management
    of Submariner, a solution for connecting Kubernetes clusters.  By using subctl,
    you can ensure that your Submariner deployment is consistent and reliable across
    all clusters.  Once Submariner is deployed, you can start exploring its features
    such as cross-cluster service discovery and load balancing. AWS export KUBECONFIG=$KUBECONFIG\_AWS
    subctl join --kubeconfig $KUBECONFIG\_AWS --clusterid aws-cluster --natt=false
    --cable-driver aws-ec2 path/to/broker-kubeconfig.yaml GCP export KUBECONFIG=$KUBECONFIG\_GCP
    subctl join --kubeconfig $KUBECONFIG\_GCP --clusterid gcp-cluster --natt=false
    --cable-driver libreswan path/to/broker-kubeconfig.yaml The --natt=false flag
    disables NAT traversal for IPsec, which is not required when peering or VPN connections
    are used. Verify Submariner Deployment To ensure that Submariner has been successfully
    deployed, one can use the subctl tool.  This tool provides a simple and efficient
    way to check the status of Submariner components and resources: subctl show all
    --kubeconfig path/to/broker-kubeconfig.yaml You should see the clusters, endpoints,
    and gateways for both AWS and GCP. Test Connectivity Deploy a test application
    on each cluster and expose it as a Kubernetes service.  Then, use the exported
    service''s DNS name or IP address to test connectivity between the clusters. For
    example, deploy an NGINX service on the AWS cluster and a Busybox pod on the GCP
    cluster.  From the Busybox pod, use \`wgetorcurlto test connectivity to the NGINX
    service on the AWS cluster.  Replace<nginx-service-dns>\` with the appropriate
    DNS name or IP address of the NGINX service: \# On AWS cluster kubectl run nginx
    --image=nginx --port=80 --expose \# On GCP cluster kubectl run busybox --image=busybox
    --rm -it --restart=Never -- sh \# From the Busybox pod wget -qO- http://<nginx-service-dns>:80
    If the connectivity test is successful, you should see the default NGINX welcome
    page content in the Busybox pod. With this, you have successfully installed and
    configured Submariner in a multi-cloud environment with AWS and GCP.  Your Kubernetes
    clusters are now connected, and you can seamlessly deploy and manage applications
    across both cloud providers.  Remember to configure your application deployments
    and services to make the most of Submariner''s features, such as cross-cluster
    service discovery, load balancing, and network policy support. '
