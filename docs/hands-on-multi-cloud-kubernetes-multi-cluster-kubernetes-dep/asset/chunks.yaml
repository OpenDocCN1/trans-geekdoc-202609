- fmt: "\n# Setup and Configure MultiCluster Federation\n\nBefore starting, ensure\
    \ you have `kubectl` and `kubefedctl` installed on your machine. If you don't\
    \ have `kubefedctl`, you can download the appropriate release from the KubeFed\
    \ releases page.\n\n## Set up Kubernetes Clusters\n\nTo set up a federated Kubernetes\
    \ cluster, it is essential to have access to at least two Kubernetes clusters\
    \ that you want to federate. These clusters can be located on-premises or on different\
    \ cloud providers, or a combination of both.\n\nTo proceed, you need to ensure\
    \ that you have the `kubeconfig` files for each cluster that you want to federate.\
    \ The `kubeconfig` files will contain the necessary information that Kubernetes\
    \ needs to communicate with each cluster. For instance, if you have two clusters\
    \ that you want to federate, and their respective kubeconfig files are named `cluster1-kubeconfig.yaml`\
    \ and `cluster2-kubeconfig.yaml`, you can use these files to configure the Kubernetes\
    \ federation control plane.\n\nWith the configuration in place, you can begin\
    \ deploying and managing applications across the federated clusters.\n\n## Deploy\
    \ the KubeFed Control Plane\n\nIt is necessary to designate one of the clusters\
    \ as the \"host cluster.\" The host cluster will be responsible for deploying\
    \ and managing the KubeFed control plane, which in turn will oversee the federation\
    \ of other clusters. For instance, in this scenario, `cluster1` has been chosen\
    \ as the host cluster. This means that `cluster1` will serve as the central hub\
    \ for managing the other clusters in the federation, allowing for greater scalability\
    \ and flexibility in the deployment and management of applications across multiple\
    \ cloud environments.\n\nSet the `KUBECONFIG` environment variable to the kubeconfig\
    \ file of the host cluster:\n```bash\nexport KUBECONFIG=cluster1-kubeconfig.yaml\n\
    ```\n\nDeploy the KubeFed control plane in the host cluster:\n```bash\nkubectl\
    \ kubefed init my-federation --host-cluster-context=cluster1 --image=quay.io/kubernetes-multicluster/kubefed:v0.8.1\
    \ --dns-provider=\"google-clouddns\" --dns-zone-name=\"example.com.\" --etcd-persistent-storage=false\n\
    ```\n\nReplace `--dns-provider`, `--dns-zone-name`, and `--image` with the appropriate\
    \ values for your environment. For a production setup, you may want to use `--etcd-persistent-storage=true`\
    \ to store etcd data persistently.\n\n## Join Clusters to the Federation\n\nTo\
    \ federate the Kubernetes clusters, deploy the KubeFed control plane and utilize\
    \ the `kubefedctl` tool to join the clusters to the federation. This will enable\
    \ efficient management of the clusters as a single entity, allowing for the deployment\
    \ and management of applications across multiple clusters simultaneously.\n\n\
    Join `cluster1` (host cluster) to the federation:\n```bash\nkubefedctl join cluster1\
    \ --cluster-context=cluster1 --host-cluster-context=cluster1\n```\n\nJoin `cluster2`\
    \ to the federation:\n```bash\nkubefedctl join cluster2 --cluster-context=cluster2\
    \ --host-cluster-context=cluster1\n```\n\n## Verify Clusters are Federated\n\n\
    You can verify that the clusters are federated by checking the `KubeFedCluster`\
    \ resources in the host cluster:\n```bash\nkubectl get kubefedclusters -n kube-federation-system\n\
    ```\n\nYou should see both `cluster1` and `cluster2` listed as federated clusters.\n\
    \n## Deploy Federated Application\n\nNow that your clusters are federated, you\
    \ can deploy an application to all federated clusters. Create a `FederatedDeployment`\
    \ and `FederatedService` to deploy the application. For example, create a `federated-nginx.yaml`\
    \ file with the following contents:\n\n```yaml\napiVersion: types.kubefed.io/v1beta1\n\
    kind: FederatedDeployment\nmetadata:\n  name: nginx\nspec:\n  template:\n    metadata:\n\
    \      labels:\n        app: nginx\n    spec:\n      replicas: 2\n      selector:\n\
    \        matchLabels:\n          app: nginx\n      template:\n        metadata:\n\
    \          labels:\n            app: nginx\n        spec:\n          containers:\n\
    \          - name: nginx\n            image: nginx:1.14.2\n            ports:\n\
    \            - containerPort: 80\napiVersion: types.kubefed.io/v1beta1\nkind:\
    \ FederatedService\nmetadata:\n  name: nginx\nspec:\n  template:\n    spec:\n\
    \      selector:\n        app: nginx\n      ports:\n        - name: http\n   \
    \       port: 80\n          targetPort: 80\n```\n\nApply the `FederatedDeployment`\
    \ and `FederatedService` to the federated clusters:\n```bash\nkubectl apply -f\
    \ federated-nginx.yaml\n```\n\nThis will deploy the Nginx application in both\
    \ `cluster1` and `cluster2`.\n\n## Verify the Application Deployment\n\nTo verify\
    \ that the application is running in both clusters, switch the `KUBECONFIG` environment\
    \ variable to each cluster's kubeconfig file and check the resources.\n\nFor `cluster1`:\n\
    ```bash\nexport KUBECONFIG=cluster1-kubeconfig.yaml\nkubectl get deployments,svc\n\
    ```\n\nFor `cluster2`:\n```bash\nexport KUBECONFIG=cluster2-kubeconfig.yaml\n\
    kubectl get deployments,svc\n```\n\nYou should see the Nginx deployment and service\
    \ running in both clusters.\n\n## Clean Up\n\nTo remove the federation, you can\
    \ delete the `KubeFed` namespace and the `kubefedclusters` resources.\n\nDelete\
    \ the namespace:\n```bash\nkubectl delete ns kube-federation-system\n```\n\nDelete\
    \ the `kubefedclusters` resources:\n```bash\nkubectl delete kubefedclusters -A\n\
    ```\n\nAnd, you've successfully set up and configured Kubernetes multi-cluster\
    \ federation using KubeFed. You can now manage resources across multiple Kubernetes\
    \ clusters, making it easier to deploy and maintain applications in a multi-cluster\
    \ environment. Keep in mind that KubeFed is still a relatively young project,\
    \ and its functionality may continue to evolve over time. Be sure to stay up-to-date\
    \ with the latest developments and best practices for managing federated Kubernetes\
    \ clusters.\n"
