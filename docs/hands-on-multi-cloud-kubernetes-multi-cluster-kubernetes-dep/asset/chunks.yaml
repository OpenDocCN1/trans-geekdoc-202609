    # 核心概念：集群、节点与命名空间


    为了有效地管理多云 Kubernetes 部署，理解一些核心概念至关重要，包括 `Clusters`（集群）、`Nodes`（节点）和 `Namespaces`（命名空间）。在本节中，我们将详细解释这些概念，并介绍其他组件组件帮助你更好地理解
    Kubernetes。


    ## 集群 (Clusters)

    Kubernetes 环境如果没有 `cluster` 作为内核无法运行。它是计算机的集合，称为 `nodes`，相互协作为容器化应用程序的执行提供统一的平台。多个节点（可以是物理的或虚拟的，可以在本地也可以在云端）构成了一个
    `cluster`。`Clusters` 让你能够根据应用程序的需求管理和扩展应用，并自动处理负载均衡、扩展和更新等任务。


    以下是集群的主要组成部分：


    ### 控制平面 (Control Plane)

    `control plane`（控制平面）是负责管理集群整体状态的组件集合。它包含了 `Kubernetes API server`、分布式键值存储器 `etcd`，以及控制器（`controller
    manager`）和调度器（`scheduler`）等其他组件。


    ### 节点 (Nodes)

    被称为 `nodes` 的工作计算机是运行容器化应用程序的实体。构成集群的每个节点都负责运行容器运行时（如 `Docker`）以及名为 `kubelet`
    的 Kubernetes 代理。


    ### 节点 (Nodes)

    `Nodes` 是构成 Kubernetes `cluster` 的单个机器（物理或虚拟）。它们托管了容器化应用程序和工作负载。`Nodes` 可以根据其资源（如
    `CPU`、内存和存储）组织成组或“池”。节点有两种类型：


    #### 工作节点 (Worker Nodes)

    `Worker nodes`（工作节点）是分布式系统中不可或的一部分，负责执行容器化工作负载和应用程序。这些节点执行 `Docker` 等容器运行时和 `kubelet`
    代理。`kubelet` 代理连接到 `control plane` 以确保容器运行状态最优。`control plane` 是 Kubernetes 的关键组件，负责管理和监控集群的整体健康。特别是
    `kubelet` 代理负责执行来自 `control plane` 的指令并确保容器按预期运行。`control plane` 与 `worker nodes`
    之间的这种通信对于保证系统顺畅高效地运行至关重要。


    #### 主节点 (Master Nodes)

    在 Kubernetes `cluster` 中，`control plane` 由 `master nodes`（主节点）管理，它们监督整个集群的状态并促进工作节点之间的通信。`control
    plane` 的关键组件（如 `API server`、`etcd`、`controller manager` 和 `scheduler`）运行在这些 `master
    nodes` 上。这些组件共同工作以确保 Kubernetes `cluster` 的顺利运行。例如，`API server` 作为集群的主要接口，而 `etcd`
    提供分布式键值存储用于存储配置数据。`controller manager` 确保集群的期望状态与实际状态匹配，而 `scheduler` 则负责将负载分配给适当的工作节点。


    ## 命名空间 (Namespaces)

    `Namespaces`（命名空间）是在 Kubernetes `cluster` 内部组织和分离资源的一种。它们提供了一个虚拟边界，用于分组和隔离资源，如
    `pods`、`services` 和 `deployments`。`Namespaces` 在多租环境中特别有用，在这些环境中多个团队或项目共享同一个集群。命名空间的一些常见应用示例如下：


    * **分配资源**：通过向特定的 `namespaces` 分配资源（如 `CPU` 和 `memory`），你可以确保共享集群的各个团队或项目之间资源分配公平。

    * **访问控制**：`Namespaces` 赋予用户实现基于角色的访问控制 (`RBAC`) 的能力，从而让用户限制对 `namespace` 内特定资源访问的权限。

    * **命名空间的使用**：这允许你在单个集群内为开发、测试和生产创建不同的环境。这有助于防止冲突并保持隔离。


    ## Pod 节点 (Pods)

    Kubernetes 中的 `pod` 是系统中最小且最基础的单元。它可以包含一个或多个容器，代表一个正在运行的进程的单个实例。应用程序的需求将决定 `pod`
    是否应该自动创建、扩展或删除。`Pods` 是瞬态的，并具备这些能力。


    ## 服务 (Services)

    `Services`（服务）是将运行在 `pods` 中的应用程序暴露到网络的一种手段，无论是相对于集群内部还是外部。它们提供一致的 `IP` 地址以及 `DNS`
    名称，使得各种应用程序组件能够相互通信。


    ## 部署 (Deployments)

    `Deployments`（部署）是一种高层抽象，允许你以声明式的方式管理应用程序的期望状态。`Deployments` 也称为 `deployments`。它们通过确保所需数量的
    `replicas`（副本）处于运行状态，并根据需要自动滚动更新或回滚更改，有助于 `pod` 的生命周期管理。


    ## 配置映射与密钥 (ConfigMaps and Secrets)

    `ConfigMaps` 和 `Secrets` 分别用于存储配置数据敏感信息，这些信息可以在多个 pod 之间共享。`ConfigMaps` 用于存储配置数据。`Secrets`
    用于存储敏感信息。因此，你能够将配置数据与容器镜像解耦，这使得无需重新构建容器镜像即可更新和管理应用程序配置。


    ## 入口 (Ingress)

    `Ingress` 是一种 Kubernetes 资源，用于管理外部用户如何连接到集群内部运行的服务。它允许你根据主机名或路径等标准定义将 `HTTP` 和
    `HTTPS` 流量导向适当服务的规则。


    ## 持久化存储 (Persistent Storage)

    持久化存储是许多应用程序的重要组件，因为它允许数据跨多个 pod 进行存储和访问，即使在 pod 生命周期周期结束后也是如此。这使得持久化存储成为许多应用程序不可或缺的一部分。`Persistent
    Volumes (PV)`、`Persistent Volume Claims (PVC)` 和 `Storage Classes` 是 Kubernetes
    支持的不同类型持久化解决方案的示例。


    ## 资源配额 (Resource Quotas)

    通过为 `namespace` 设置资源配额，可以限制 `namespace` 使用计算能力、内存和存储空间等资源的能力。这防止了任何命名空间消耗过多资源，并确保共享集群的各个组或项目之间资源分配公平。


    ## 水平 Pod 自动伸缩 (Horizontal Autoscaler)

    这是 Kubernetes 的一项功能，根据 `CPU` 使用率或自定义指标自动伸缩 pod 副本的数量。`HPA` 是 `Horizontal Pod Autoscaler`
    的缩写。这有助于确保应用程序能够处理变化的流量，同时优化对可用资源的使用。


    ## 自定义资源定义 (Custom Resource Definitions)

    `Custom Resource Definitions`（简称 `CRDs`）通过定义新类型的自定义资源，赋予你扩展 Kubernetes `API` 功能的能力。因此，你将能够创建和管理针对你应用程序的自定义资源，就像管理内置
    Kubernetes 资源一样。


