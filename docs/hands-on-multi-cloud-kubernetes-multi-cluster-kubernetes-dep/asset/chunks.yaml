  trans: "\n\n# 在 Kubernetes 上部署应用程序\n\n现在你已经有了一个正在运行的多云 Kubernetes 集群，让我们来学习在集群上部署应用程序的过程。在本节中，我们将逐步介绍在多云\
    \ Kubernetes 集群上部署应用程序的步骤。首先，你需要确保你的集群已启动并运行。一旦验证了这一点，我们就可以进行部署过程。在示例演示中，我们将使用一个示例\
    \ Node.js 应用程序。在 Kubernetes 集群上部署应用程序可能是一个复杂的过程，但在正确的指导下，它可以简化。在我们情况下，我们将使用 Kubernetes\
    \ 来管理和调度我们的应用程序。Kubernetes 提供了一个用于部署、扩展和管理容器化应用的平台。通过 Kubernetes，你可以轻松管理应用程序从部署到扩展和维护的整个生命周期。我们将开始构建\
    \ Node.js 应用程序的 Docker 镜像，然后使用 Kubernetes 创建部署。一旦部署运行，我们就可以通过创建一个服务（Service）将应用程序暴露到互联网。最后，我们将测试应用程序以确保其按预期工作。遵循这些步骤，你将对如何在多云\
    \ Kubernetes 集群上部署应用程序有深入的理解。以下是部署应用程序的逐步操作指南：\n\n## 克隆示例应用程序\n\n从以下仓库克隆示例 Node.js\
    \ 应用程序：\n\n```bash\ngit clone https://github.com/kubernetes/examples.git\ncd examples/staging/nodejs/\n\
    ```\n\n## 创建 Dockerfile\n\n在 `nodejs` 目录中，创建一个包含以下内容的 `Dockerfile`：\n\n```file\n\
    FROM node:14\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nEXPOSE\
    \ 8080\nCMD [\"npm\", \"start\"]\n```\n\n## 构建 Docker 镜像\n\n为示例应用程序构建 Docker 镜像：\n\
    \n```bash\ndocker build -t my-nodejs-app:1.0 .\n```\n\n## 将 Docker 镜像推送到容器仓库\n\
    \n你需要将 Docker 镜像送到 AWS 和 GCP 都能访问的容器仓库。在示例演示中，我们将使用 Docker Hub。首先，登录 Docker Hub：\n\
    \n```bash\ndocker login\n```\n\n使用你的 Docker Hub 用户名为镜像打标签：\n\n```bash\ndocker\
    \ tag my-nodejs-app:1.0 <your-dockerhub-username>/my-nodejs-app:1.0\n```\n\n将\
    \ `<your-dockerhub-username>` 替换为你实际的 Docker Hub 用户名。现在，将镜像推送到 Docker Hub：\n\n\
    ```bash\ndocker push <your-dockerhub-username>/my-nodejs-app:1.0\n```\n\n## 创建部署\
    \ YAML 文件\n\n创建一个名为 `my-nodejs-app-deployment.yaml` 的新文件，包含以下内容：\n\n```yaml\n\
    apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: my-nodejs-app\nspec:\n\
    \  replicas: 3\n  selector:\n    matchLabels:\n      app: my-nodejs-app\n  template:\n\
    \    metadata:\n      labels:\n        app: my-nodejs-app\n    spec:\n      containers:\n\
    \      - name: my-nodejs-app\n        image: <your-dockerhub-username>/my-nodejs-app:1.0\n\
    \        ports:\n        - containerPort: 8080\n---\napiVersion: v1\nkind: Service\n\
    metadata:\n  name: my-nodejs-app\nspec:\n  type: LoadBalancer\n  ports:\n  - port:\
    \ 8080\n    targetPort: 8080\n    protocol: TCP\n  selector:\n    app: my-nodejs-app\n\
    ```\n\n将 `<your-dockerhub-username>` 替换为你实际的 Docker Hub 用户名。\n\n## 部署应用程序\n\n\
    将应用程序部署到你的多云 Kubernetes 集群中：\n\n```bash\nkubectl apply -f my-nodejs-app-deployment.yaml\n\
    ```\n\n## 监控部署\n\n检查部署状态：\n\n```bash\nkubectl rollout status deployment my-nodejs-app\n\
    ```\n\n一旦部署完成，你可以检查创建的 pod：\n\n```bash\nkubectl get pods -l app=my-nodejs-app\n\
    ```\n\n## 应用程序\n\n要访问应用程序，你需要获取 `my-nodejs-app` 服务的外部 IP 地址：\n\n```bash\nkubectl\
    \ get service my-nodejs-app\n```\n\n注意输出中的 `EXTERNAL-IP`：\n\n```\nNAME       \
    \      TYPE           CLUSTER-IP      EXTERNAL-IP     PORT(S)             AGE\n\
    my-nodejs-app   LoadBalancer   10.100.200.123  123.45.67.89    8080:32123/TCP\
    \   3m\n```\n\n打开浏览器并导航到端口 8080 的外部 IP 地址：`http://123.45.67.89:8080`（将 `123.45.67.89`\
    \ 替换为你服务的外部 IP 地址）。你应该能看到示例应用程序正在运行。\n\n## 扩展应用程序\n\n如有需要，你可以扩展应用程序的副本数量（replicas）：\n\
    \n```bash\nkubectl scale deployment my-nodejs-app --replicas=5\n```\n\n检查更新后的\
    \ pod 数量：\n\n```bash\nkubectl get pods -l app=my-nodejs-app\n```\n\n## 更新应用程序\n\
    \n要更新应用程序，请修改源代码，构建带有不同标签的新镜像，将其推送到 Docker Hub 并更新部署。例如：\n\n```bash\ndocker build\
    \ -t my-nodejs-app:1.1 .\ndocker tag my-nodejs-app:1.1 <your-dockerhub-username>/my-nodejs-app:1.1\n\
    docker push <your-dockerhub-username>/my-nodejs-app:1.1\nkubectl set image deployment\
    \ my-nodejs-app <your-dockerhub-username>/my-nodejs-app:1.1\n```\n\n## 清理资源\n\n\
    在完成后，运行以下命令删除应用程序相关的资源：\n\n```bash\nkubectl delete -f my-nodejs-app-deployment.yaml\n\
    ```\n\n## 管理部署\n\n无论是在多云 Kubernetes 集群还是单云集群中工作，管理部署的方法基本相同。在两种情况下，你都依赖同一个工具 `kubectl`\
    \ 来与部署进行交互。这意味着你不需要根据所使用的云供应商来调整方法。简单来说，一旦你掌握了单云集群的部署管理，就可以轻松地将这些技能应用到多云环境中。以下是一些常用的部署任务：\n\
    \n### 获取部署列表\n查看部署列表，运行：\n\n```bash\nkubectl get deployments\n```\n\n### 获取部署详细信息\n\
    要查看特定部署的详细信息，运行：\n\n```bash\nkubectl describe deployment <deployment-name>\n```\n\
    \n### 更新副本数量\n扩展部署时更改副本数量：\n\n```bash\nkubectl scale deployment <deployment-name>\
    \ --replicas=<number-of-replicas>\n```\n\n### 暂停和恢复部署\n你可以暂停部署以应用多次更改，然后恢复它：\n\
    \n```bash\n# 暂停部署\nkubectl rollout pause deployment <deployment-name>\n\n# 应用多次更改\n\
    kubectl set env deployment <deployment-name> KEY1=VALUE1 KEY2=VALUE2\nkubectl\
    \ set resources deployment <deployment-name> -c=<container-name> --limits=cpu=200m,memory=512Mi\n\
    \n# 恢复部署\nkubectl rollout resume deployment <deployment-name>\n```\n\n### 检查滚动状态\n\
    监控滚动状态：\n\n```bash\nkubectl rollout status deployment <deployment-name>\n```\n\
    \n### 查看滚动历史\n查看部署的滚动历史，运行：\n\n```bash\nkubectl rollout history deployment <deployment-name>\n\
    ```\n\n"
