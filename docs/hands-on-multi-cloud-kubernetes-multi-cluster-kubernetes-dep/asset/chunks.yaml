    # Installing and Configuring Submariner


    To deploy Submariner in a multi-cloud setup involving AWS and GCP, the following
    steps should be taken. It is assumed that Kubernetes clusters are already up and
    running on both cloud providers and that the necessary command-line tools (`aws`
    and `gcloud`) and `kubectl` are installed.


    ## Install Subctl


    `subctl` is a powerful command-line utility that simplifies the deployment and
    management of Submariner, a tool that provides cross-cluster network connectivity
    for Kubernetes. With `subctl`, users can easily deploy and manage Submariner across
    their clusters without having to manually configure network connectivity. The
    `subctl` utility is designed to streamline the process of deploying Submariner
    by automating many of the tasks involved. For example, `subctl` can automatically
    detect the various clusters in a user''s environment and configure the necessary
    components for Submariner to work seamlessly across them. It can also handle the
    deployment and management of the various Submariner components, including the
    `Broker`, `Gateway`, and `Route Agent`. Furthermore, `subctl` provides a simple
    and intuitive interface for managing Submariner. Users can easily check the status
    of their Submariner deployment, view logs, and perform various administrative
    tasks using the `subctl` command-line tool.


    Install it using the following commands:


    ```bash

    VERSION=$(curl --silent https://get.submariner.io/releases/latest/version)

    curl -L https://get.submariner.io/releases/${VERSION}/subctl-${VERSION}-linux-amd64.tar.xz
    | tar -xJf -

    sudo mv subctl-\*-linux-amd64/subctl /usr/local/bin/subctl

    rm -rf subctl-\*-linux-amd64

    ```


    Replace `"linux"` with `"darwin"` for macOS or `"windows"` for Windows in the
    download URL.


    ## Prepare AWS and GCP Clusters


    In order to deploy Submariner successfully, it is important to verify that the
    Kubernetes clusters in both AWS and GCP are properly configured with the necessary
    network settings. This involves checking that the clusters have the correct subnets,
    security groups, and routing configurations in place. Without these configurations,
    Submariner may not function properly or could encounter connectivity issues between
    the clusters. Therefore, it is crucial to ensure that all necessary network configurations
    are in place before deploying Submariner in a multicloud Kubernetes environment
    as below:


    ### AWS

    * VPC peering or VPN connection between the VPCs hosting the clusters

    * Security groups configured to allow IPsec traffic


    ### GCP

    * VPC Network Peering or VPN connection between the VPCs hosting the clusters

    * Firewall rules configured to allow IPsec traffic


    **Note**: Refer to your cloud provider''s documentation for setting up peering
    or VPN connections and configuring security groups or firewall rules.


    ## Export KUBECONFIG Files


    To ensure proper communication with multiple Kubernetes clusters, it is essential
    to set the `KUBECONFIG` environment variable correctly. This variable specifies
    the configuration file(s) that `kubectl` uses to connect to the cluster. You can
    merge multiple `KUBECONFIG` files into a single file or use separate files for
    each cluster. This provides flexibility in managing and accessing multiple clusters
    with a single `kubectl` installation. By configuring `KUBECONFIG`, you can avoid
    errors and issues that may arise due to incorrect connection settings. Properly
    setting up `KUBECONFIG` is a crucial step in the process of managing multiple
    Kubernetes clusters. For example, if you have separate `KUBECONFIG` files for
    AWS and GCP:


    `export KUBECONFIG=path/to/aws-config.yaml`

    `export KUBECONFIG=path/to/gcp-config.yaml`


    ## Deploy Submariner


    To deploy Submariner on multiple clusters, you can use `subctl`. The first step
    is to replace `CLUSTER_NAME` and `BROKER` with the relevant values. `subctl` is
    a command-line tool that simplifies the deployment and management of Submariner,
    connecting Kubernetes clusters. Once Submariner is deployed, you can start exploring
    its features such as cross-cluster service discovery.


    ### AWS

    ```bash

    subctl join --kubeconfig AWS --clusterid aws-cluster --natt=false --cable-driver
    aws-ec2

    ```


    ### GCP

    ```bash

    subctl join --kubeconfig GCP --clusterid gcp-cluster --natt=false --cable-driver
    libreswan

    ```

    The `--natt=false` flag disables NAT traversal for `IPsec`, which is not required
    when peering or VPN connections are used.


    ## Verify Submariner Deployment


    To ensure that Submariner has been successfully deployed, one can use the `subctl`
    tool. This tool provides a simple and efficient way to check the status of Submariner
    components and resources:


    ```bash

    subctl show all --kubeconfig path/to/broker-kubeconfig.yaml

    ```

    You should see the clusters, endpoints, and gateways for both AWS and GCP.


    ## Test Connectivity


    Deploy a test application on each cluster and expose it as a Kubernetes service.
    Then, use the service''s DNS name or IP address to test connectivity between the
    clusters. For example, deploy an NGINX service on the AWS cluster and a Busybox
    pod on the GCP cluster.


    ### AWS

    ```bash

    kubectl run nginx --image=nginx --port=80 --expose

    ```


    ### GCP

    ```bash

    kubectl run busybox --image=busybox --rm -it --restart=Never -- sh

    ```

    From the Busybox pod, use `wget` or `curl` to test connectivity to the NGINX service
    on the AWS cluster. Replace `<nginx-service-dns>` with the appropriate DNS name
    or IP address of the NGINX service:


    ```bash

    wget -qO- http://<nginx-service-dns>:80

    ```

    If the connectivity test is successful, you should see the default NGINX welcome
    page content in the Busybox pod.

    '
