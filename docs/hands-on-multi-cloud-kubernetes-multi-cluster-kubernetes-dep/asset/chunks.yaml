  trans: "\n\n# 安装和配置 FluxCD\n\n在多云 Kubernetes 上安装和配置 FluxCD 涉及多个步骤。以下是分步骤的详细指南，以帮助你在多云环境中设置\
    \ FluxCD：\n\n## 安装 Flux CLI\n第一步是在你的本地机器上安装 FluxCD 命令行界面 (`CLI`)。你可以从 FluxCD 的\
    \ GitHub 仓库下载最新版本的 `CLI`。要安装 Flux `CLI`，请根据你的操作系统，参考在 [`fluxcd.io/install/`](https://fluxcd.io/install/)\
    \ 上的说明进行进行操作。\n\n## 设置 Git 仓库\nFluxCD 使用 Git 仓库来存储你的 Kubernetes 清单（manifests）、Helm\
    \ 图表或其他基础设施配置文件。对于多云 Kubernetes，你可以选择为每个云提供者准备独立的 Git 仓库，或者使用单个仓库中的目录来组织你的清单文件。为每个集群或环境创建一个\
    \ Git 仓库，并将你的配置文件推送到这些仓库中。确保你能够从本地机器访问这些仓库，因为在 FluxCD 设置过程中，你需要提供仓库的 URL。\n\n\
    ## 验证 Kubernetes 集群的身份认证\n要将 FluxCD 部署到你的多云 Kubernetes 集群，你需要对每个集群进行身份验证。在你的 Kubernetes\
    \ 配置文件（通常位于 `~/.kube/config`）中为每个集群使用相应的凭据和上下文（context）。你可以使用 `kubectl config\
    \ use-context` 在不同的集群上下文之间切换。\n\n## 在多云 Kubernetes 集群上安装 FluxCD\n安装 `CLI` 并设置好仓库后，你现在可以在每个\
    \ Kubernetes 集群上安装 FluxCD。要执行此操作，请每个集群运行以下命令，并将 `<YOUR-GIT-REPOSITORY>` 替换为相应\
    \ Git 仓库的 URL：\n\n```\nflux bootstrap git --url <YOUR-GIT-REPOSITORY> --path=<PATH-TO-CLUSTER-CONFIGURATION>\
    \ [--token-auth] [--network-policy] [--private] [--version=<VERSION>]\n```\n\n\
    运行此命令之前，请确保已切换到每个集群相应的上下文。`--path` 标志可选可选，用于指定仓库中包含集群特定配置文件的子目录。其他可选标志可用于额外配置，例如使用个人访问令牌进行验证、设置网络策略或指定特定的\
    \ Flux 版本。\n\n## 为多云环境配置 FluxCD\n一旦在每个集群上安装了 FluxCD，你就可以配置它从相应的 Git 仓库同步所需的状态。要执行此操作，为每个集群创建一个\
    \ `Kustomization` 资源。该资源告诉 FluxCD 使用哪个 Git 仓库和路径进行同步，以及其他设置（如同步间隔）。下面是一个 `Kustomization`\
    \ 资源的示例：\n\n```yaml\napiVersion: kustomize.toolkit.fluxcd.io/v1beta2\nkind: Kustomization\n\
    metadata:\n  name: my-cluster\n  namespace: flux-system\nspec:\n  interval: 1m\n\
    \  path: ./path/to/cluster/configuration\n  prune: true\n  sourceRef:\n    kind:\
    \ GitRepository\n    name: my-git-repository\nvalidation: client\n```\n\n路径替换为\
    \ Git 仓库中集群特定配置文件的路径。为每个集群创建一个类似的 `Kustomization` 资源，并将这些文件提交到你的 Git 仓库。\n\n##\
    \ 监控和管理多云部署\n在多云 Kubernetes 集群上安装并配置 FluxCD 后，它现在会自动将 Git 仓库中的所需状态同步到集群。你可以使用\
    \ Flux `CLI` 监控同步状态并管理你的部署。要检查部署状态，请运行：\n\n```bash\nflux get kustomizations\n\
    ```\n\n要管理你的部署，只需更新 Git 仓库中的配置文件并提交更改，以触发 FluxCD 的新同步。你也可以使用 Flux `CLI` 自动化部署、监控健康检查并管理发布（rollouts）。\n\
    \n## 最佳实践\n以下是在多云环境中安装和配置 FluxCD 的一些额外建议和最佳实践：\n\n- 使用 Git 子模块（submodules）或 Git\
    \ 子目录来组织 Git 仓库中的配置文件。这可以使得管理大量的集群或环境变得更容易。\n- 使用 Git 分支（branches）管理不同版本的配置。例如，你可以为生产环境使用\
    \ `prod` 分支，为开发环境使用 `dev` 分支。\n- 使用 Git 标签（tags）标记文件的特定版本，例如特定的发布或热修复。\n- 使用 FluxCD\
    \ 的 GitOps 工具功能自动化管理 Kubernetes 资源，例如创建命名空间、RBAC 规则或密钥。\n- 使用 FluxCD 的高级功能（如金丝发布或渐进式交付）以受控的方式部署新功能或更新。\n\
    - 使用 Prometheus、Grafana 或 Kibana 等工具监控你的 FluxCD 安装和 Git 仓库，以获取部署状况和性能的洞察。\n\n\
    总而言之，在多云 Kubernetes 上安装和配置 FluxCD 涉及设置 Git 仓库、验证 Kubernetes 集群以及创建 Kustomization\
    \ 资源来定义系统的所需状态。部署 FluxCD 后，你可以自动化配置同步并使用 GitOps 工作流管理部署。通过遵循这些最佳实践并使用 FluxCD 的高级功能，你可以确保你的多云\
    \ Kubernetes 部署是一致、可靠且可扩展的。\n\n"
- fmt: "\n# Continuous Delivery with FluxCD\n\nFluxCD achieves CD by automating the\
    \ various stages of the software delivery pipeline. When new code is merged into\
    \ the main branch, FluxCD automatically detects the changes and triggers a deployment\
    \ process. The new version of the application is then built, tested, and deployed\
    \ to the production environment in a repeatable and predictable manner.\n\nFluxCD\
    \ also includes several advanced features such as canary releases, blue/green\
    \ deployments, and rollbacks. These features allow teams to test new versions\
    \ of their applications in a controlled manner before rolling them out to production.\
    \ In the event of a problem, FluxCD can automatically roll back to a previous\
    \ version of the application, ensuring that downtime is minimized and that the\
    \ system remains highly available.\n\nBelow is a step-by-step walkthrough to perform\
    \ continuous delivery with FluxCD:\n\n### 1. Configure the Git Repository\nIn\
    \ order to set up FluxCD for Kubernetes, you will need to configure a Git repository\
    \ to act as the \"single source of truth\" for your cluster's desired state. This\
    \ can be a new Git repository or an existing one that you will use to store your\
    \ Kubernetes manifests and FluxCD configuration.\n\n### 2. Connect FluxCD to Kubernetes\
    \ Cluster\nOnce you have set up your Git repository, you will need to connect\
    \ FluxCD to your Kubernetes cluster. To do this, run the following command, replacing\
    \ the placeholders with your own information:\n\n```\nflux bootstrap <GIT_PROVIDER>\
    \ --repository=<USERNAME>/<REPO_NAME> --path=<PATH_IN_REPO> --personal\n```\n\n\
    The `GIT_PROVIDER` should be replaced with the name of the Git provider you're\
    \ using (e.g., `github`, `gitlab`, `bitbucket`), `USERNAME` with your own username,\
    \ `REPO_NAME` with the name of the repository you've created, and `PATH_IN_REPO`\
    \ with the path in the repository where you'll store your FluxCD configuration.\
    \ The `--personal` flag indicates that you're using a personal repository.\n\n\
    ### 3. Create FluxCD Configuration\nOnce you have connected FluxCD to your Kubernetes\
    \ cluster, you'll need to create a new folder in your Git repository to store\
    \ your FluxCD configuration. Within this folder, add a `kustomization.yaml` file\
    \ with the following content:\n\n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\n\
    kind: Kustomization\nresources:\n  - flux-system\n```\n\nThis file will include\
    \ the `flux-system` directory in the configuration.\n\n### 4. Define Application's\
    \ Kubernetes Manifests\nNext, create another new folder in your Git repository\
    \ to store your application's Kubernetes manifests. Add your application's Kubernetes\
    \ YAML files, such as deployments, services, and ingress resources, to this folder.\n\
    \n### 5. Synchronize the Application's Manifests\nTo synchronize your application's\
    \ manifests with FluxCD, add a new `kustomization.yaml` file to your application's\
    \ folder with the following content:\n\n```yaml\napiVersion: kustomize.config.k8s.io/v1beta1\n\
    kind: Kustomization\nresources:\n  - <APP_MANIFEST_FILE_1>\n  - <APP_MANIFEST_FILE_2>\n\
    \  ...\n```\n\nReplace `<APP_MANIFEST_FILE_1>`, `<APP_MANIFEST_FILE_2>`, etc.,\
    \ with the filenames of your application's Kubernetes manifests.\n\n### 6. Add\
    \ Application to FluxCD Configuration\nIn the `kustomization.yaml` file you created\
    \ in step 4, add a reference to the application's folder:\n\n```yaml\napiVersion:\
    \ kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - flux-system\n\
    \  - <APP_FOLDER>\n```\n\nReplace `<APP_FOLDER>` with the name of the folder containing\
    \ your application's Kubernetes manifests.\n\n### 7. Commit and Push Changes\n\
    Commit your changes to the Git repository and push them to the remote. FluxCD\
    \ will detect the changes and apply them to the connected Kubernetes cluster.\n\
    \n### 8. Monitor Synchronization Status\nUse the Flux CLI to monitor the synchronization\
    \ status:\n\n```\nflux get kustomizations\n```\n\nThis command will display the\
    \ current status of your configured `Kustomizations`, showing if they are successfully\
    \ synchronized with your cluster. From this point on, any changes you push to\
    \ the Git repository will be automatically detected and applied by FluxCD. You\
    \ can also use the Flux CLI to perform actions such as pausing or resuming synchronization,\
    \ or checking the status of resources in your cluster.\n"
