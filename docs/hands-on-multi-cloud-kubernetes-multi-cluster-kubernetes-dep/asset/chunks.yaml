- fmt: "\n# Integrate Virtual Kubelet with Multi-cloud\n\nTo integrate Virtual Kubelet\
    \ with your multi-cloud environment consisting of AWS and GCP, you'll need to\
    \ set up Virtual Kubelet to work with AWS Fargate and Google Cloud Run. This section\
    \ will walk you through the process for both platforms. Note: You need to have\
    \ a Kubernetes cluster running on both AWS and GCP. This section assumes you have\
    \ `kubectl` and `helm` installed and configured to work with your clusters.\n\n\
    ## Install Virtual Kubelet on Kubernetes Clusters First\n\nFirst, you need to\
    \ install Virtual Kubelet on both your AWS and GCP Kubernetes clusters. You can\
    \ use the official Helm chart to install Virtual Kubelet. Add the Virtual Kubelet\
    \ Helm repository:\n\n```bash\nhelm repo add virtual-kubelet https://virtual-kubelet.github.io/charts\n\
    helm repo update\n```\n\n## Configure Virtual Kubelet for AWS Fargate\n\nTo use\
    \ Virtual Kubelet with AWS Fargate, you'll need to create an Amazon ECR repository\
    \ to store your container images, create an IAM role with the necessary permissions,\
    \ and configure Virtual Kubelet with the AWS provider. Follow the official AWS\
    \ Fargate provider guide to set up Virtual Kubelet for AWS Fargate.\n\n## Configure\
    \ Virtual Kubelet for Google Cloud Run\n\nTo use Virtual Kubelet with Google Cloud\
    \ Run, you'll need to enable the Cloud Run API, create a Google Cloud project,\
    \ and configure Virtual Kubelet with the Cloud Run provider. Follow the official\
    \ Google Cloud Run provider guide to set up Virtual Kubelet for Google Cloud Run.\n\
    \n## Deploy Workloads on AWS Fargate and Google Cloud Run\n\nWith Virtual Kubelet\
    \ installed and configured for both AWS Fargate and Google Cloud Run, you can\
    \ now deploy workloads to these platforms using standard Kubernetes manifests.\
    \ To deploy a workload on AWS Fargate, set the `spec.nodeName` field in your Kubernetes\
    \ manifests to the name of the Virtual Kubelet node representing AWS Fargate.\n\
    \n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: my-aws-fargate-pod\n\
    spec:\n  nodeName: virtual-kubelet-aws\n  containers:\n  - name: my-container\n\
    \    image: my-ecr-repo/my-image:latest\n```\n\nSimilarly, to deploy a workload\
    \ on Google Cloud Run, set the `spec.nodeName` field in your Kubernetes manifests\
    \ to the name of the Virtual Kubelet node representing Google Cloud Run.\n\n```yaml\n\
    apiVersion: v1\nkind: Pod\nmetadata:\n  name: my-gcp-cloudrun-pod\nspec:\n  nodeName:\
    \ virtual-kubelet-gcp\n  containers:\n  - name: my-container\n    image: gcr.io/my-gcp-project/my-image:latest\n\
    ```\n\n## Apply Manifests using kubectl\n\n```bash\nkubectl apply -f my-aws-fargate-pod.yaml\n\
    kubectl apply -f my-gcp-cloudrun-pod.yaml\n```\n\nBy following these steps, you\
    \ can integrate Virtual Kubelet with your multi-cloud environment on AWS and GCP.\
    \ This enables you to deploy and manage Kubernetes workloads across both platforms\
    \ using a consistent workflow and leveraging the benefits of serverless infrastructure.\n\
    \n# Deploying Serverless Clusters\n\nServerless clusters refer to a Kubernetes-like\
    \ environment where you don't need to manage the underlying nodes or infrastructure.\
    \ Instead, you rely on serverless platforms that abstract away the infrastructure\
    \ management, allowing you to focus on deploying and managing your applications.\
    \ Serverless platforms automatically scale the resources based on demand and only\
    \ charge for the resources consumed by your applications.\n\nVirtual Kubelet enables\
    \ you to create a serverless cluster experience by integrating serverless platforms\
    \ such as AWS Fargate and Google Cloud Run with Kubernetes. This allows you to\
    \ deploy Kubernetes workloads on serverless platforms, taking advantage of their\
    \ scalability, cost-efficiency, and reduced operational overhead. To deploy a\
    \ serverless cluster using Virtual Kubelet, follow the steps below:\n\n## Set\
    \ Up Kubernetes Cluster\n\nEnsure that you have a Kubernetes cluster up and running\
    \ on your preferred cloud provider or on-premises environment. This cluster will\
    \ act as the control plane for managing your serverless workloads.\n\n## Install\
    \ Virtual Kubelet on Kubernetes Cluster\n\nInstall Virtual Kubelet using `helm`,\
    \ as described in the previous section. Ensure that you've added the Virtual Kubelet\
    \ Helm repository and updated your helm repo.\n\n## Configure Virtual Kubelet\
    \ for Serverless Platform\n\nDepending on the serverless platform you want to\
    \ use, follow the appropriate provider guide:\n\n- For AWS Fargate, refer to the\
    \ AWS Fargate provider guide.\n- For Google Cloud Run, refer to the Google Cloud\
    \ Run provider guide.\n\n## Deploy Workloads on Serverless Platform\n\nWith Virtual\
    \ Kubelet installed and configured, you can deploy Kubernetes workloads on your\
    \ serverless platform. You need to set the `spec.nodeName` field in your Kubernetes\
    \ manifests to the name of the Virtual Kubelet node representing the serverless\
    \ platform. For example, if you're using AWS Fargate:\n\n```yaml\napiVersion:\
    \ v1\nkind: Pod\nmetadata:\n  name: my-serverless-pod\nspec:\n  nodeName: virtual-kubelet-aws\n\
    \  containers:\n  - name: my-container\n    image: my-ecr-repo/my-image:latest\n\
    ```\n\n## Apply Manifests using kubectl\n\n```bash\nkubectl apply -f my-serverless-pod.yaml\n\
    ```\n\n## Deploy/Manage Clusters and Serverless Workloads\n\nYou can use standard\
    \ Kubernetes tools like `kubectl` and the Kubernetes Dashboard to manage your\
    \ serverless workloads. You can also monitor and set up alerts using tools like\
    \ Prometheus and Grafana. By following these steps, you can create a serverless\
    \ cluster experience using Virtual Kubelet and your preferred serverless platform.\n"
