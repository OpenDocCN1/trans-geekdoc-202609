- fmt: "\n# Setting Up Kubernetes Cluster\n\nCreating a multi-cloud Kubernetes cluster\
    \ can offer several benefits, including increased availability, redundancy, and\
    \ flexibility. This section will walk you through the process of setting up a\
    \ multi-cloud Kubernetes cluster using AWS and GCP, two popular cloud providers.\
    \ We will be utilizing `kubeadm` to create the cluster and `Kops` to manage it.\
    \ However, this book assumes that you have already established the necessary infrastructure\
    \ and have credentials for both providers. By utilizing two different cloud providers,\
    \ we can reduce the risk of downtime and potential data loss. This setup also\
    \ allows for the distribution of workloads across multiple cloud platforms to\
    \ optimize resource usage. To successfully complete this task, you will need a\
    \ basic understanding of Kubernetes, AWS, and GCP. Additionally, you should have\
    \ prior experience setting up infrastructure on both cloud providers. With the\
    \ necessary prerequisites in place, we can now begin the process of setting up\
    \ our multi-cloud Kubernetes cluster.\n\n## Install Prerequisites\n\nTo utilize\
    \ Kubernetes, you must install several tools. The Kubernetes CLI tool, `kubectl`,\
    \ is necessary for managing and deploying applications on the cluster. Additionally,\
    \ you'll need `kubeadm`, a Kubernetes cluster bootstrapping tool that simplifies\
    \ the creation of a new Kubernetes cluster. `Kops`, another essential tool, is\
    \ used to operate Kubernetes clusters on Amazon Web Services (AWS). `AWS CLI`,\
    \ a command-line interface for AWS services, is also required to configure and\
    \ manage Kubernetes clusters on AWS. Similarly, the `Google Cloud SDK`, a command-line\
    \ tool, is necessary to manage and deploy Kubernetes clusters on Google Cloud.\
    \ By installing and utilizing these tools, you can efficiently deploy and manage\
    \ your Kubernetes cluster, making it easier to build, deploy, and scale your applications.\
    \ [Note: Please follow the official documentation for installing these tools for\
    \ your specific operating system.]\n\n## Configure AWS and GCP Credentials\n\n\
    After installing the `AWS CLI` and `Google Cloud SDK`, you need to configure the\
    \ credentials for both providers. To do this, follow the official documentation\
    \ for configuring the `AWS CLI` and configuring the `Google Cloud SDK`.\n\n##\
    \ Create Kubernetes Cluster Specification\n\nWith `Kops`, we can create a cluster\
    \ specification (a manifest in YAML format) that describes our desired cluster\
    \ configuration. Let us create a sample specification:\n\n```yaml\napiVersion:\
    \ kops.k8s.io/v1alpha2\nkind: Cluster\nmetadata:\n  name: my-multicloud-cluster.k8s.local\n\
    spec:\n  kubernetesVersion: v1.22.0\n  cloudProvider: aws\n  networking:\n   \
    \ calico:\n      crossSubnet: true\n  subnets:\n    - name: aws-subnet\n     \
    \ type: Private\n      zone: us-west-2a\n      id: subnet-xxxxxxxx\n    - name:\
    \ gcp-subnet\n      type: Private\n      zone: us-central1-a\n      id: subnet-yyyyyyyy\n\
    \  api:\n    loadBalancer:\n      type: Internal\n  additionalNetworkCIDRs:\n\
    \    - 10.128.0.0/9\n    - 10.0.0.0/8\n```\n\nReplace the `subnet-xxxxxxxx` and\
    \ `subnet-yyyyyyyy` placeholders with your AWS and GCP subnet IDs, respectively.\n\
    \n## Create the Kubernetes Cluster\n\nSave the YAML file as `multicloud-cluster.yaml`.\
    \ Then, use `Kops` to create the cluster:\n\n```bash\nkops create -f multicloud-cluster.yaml\n\
    kops create secret --name my-multicloud-cluster.k8s.local publickey -i ~/.ssh/id_rsa.pub\n\
    kops update cluster my-multicloud-cluster.k8s.local --yes\n```\n\nThis process\
    \ will take some time, as `Kops` will provision the necessary resources on both\
    \ AWS and GCP.\n\n## Validate the Cluster\n\nOnce the process is complete, you\
    \ can validate that your cluster is up and running:\n\n```bash\nkops validate\
    \ cluster --name my-multicloud-cluster.k8s.local\n```\n\n## Configure kubectl\
    \ to Use New Cluster\n\nTo start using your Kubernetes cluster, you'll need to\
    \ configure `kubectl`:\n\n```bash\nkops export kubecfg --name my-multicloud-cluster.k8s.local\n\
    ```\n\n## Test the Cluster\n\nYou can now deploy a sample application to ensure\
    \ everything is working correctly:\n\n```bash\nkubectl create deployment hello-world\
    \ --image=gcr.io/google-samples/node-hello:1.0\nkubectl expose deployment hello-world\
    \ --type=LoadBalancer --port=8080 --target-port=8080\n```\n\nAfter a few minutes,\
    \ you should see an external IP address for the `hello-world` service:\n\n```bash\n\
    kubectl get service\n# Note the EXTERNAL-IP in the output:\n# NAME        TYPE\
    \           CLUSTER-IP     EXTERNAL-IP     PORT(S)          AGE\n# hello-world\
    \ LoadBalancer   10.100.200.123  123.45.67.89   8080:32123/TCP   3m\n```\n\n##\
    \ Access the Sample Application\n\nOpen a browser and navigate to the external\
    \ IP address at port 8080: `http://<EXTERNAL-IP>:8080` (replace `1123.45.67.89``\
    \ with your service's external IP address). You should see a \"Hello, World!\"\
    \ message.\n\n## Clean Up Resources\n\nTo avoid incurring unnecessary costs, delete\
    \ the resources when you're done experimenting with the cluster:\n\n```bash\n\
    kubectl delete service hello-world\nkubectl delete deployment hello-world\n```\n\
    \nWait for the LoadBalancer to be deleted before proceeding with the next step.\
    \ To delete the cluster and all its associated resources, run:\n\n```bash\nkops\
    \ delete cluster my-multicloud-cluster.k8s.local --yes\n```\n\nAt this point,\
    \ you should have enough experience in deploying a Kubernetes cluster that extends\
    \ across various cloud providers using `kubeadm` and `Kops`. The cluster's specification\
    \ can be tailored to your specific needs, such as incorporating additional nodes\
    \ or utilizing distinct networking plugins. For further details on advanced configuration\
    \ possibilities, refer to the official Kops documentation.\n"
