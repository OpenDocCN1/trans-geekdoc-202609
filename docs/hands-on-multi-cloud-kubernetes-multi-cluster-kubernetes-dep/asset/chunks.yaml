  trans: "\n\n# 设置 Kubernetes 集群\n\n创建一个多云 Kubernetes 集群可以带来许多优势，包括提高可用性、冗余性和灵活性。本节将引导你通过使用\
    \ AWS 和 GCP 这两个流行的云提供商设置多云 Kubernetes 集群。我们将利用 `kubeadm` 来创建集群，并使用 `Kops` 对其进行管理。不过，本书假设你已经建立了必要的底层设施，并拥有了这两个云提供商的凭据。通过利用两个不同的云提供商，我们可以降低停机和潜在数据丢失的风险。这种设置还允许将工作负载分布在多个云平台上，以优化资源利用。要成功完成此任务，你需要对\
    \ Kubernetes、AWS 和 GCP 有基础了解。此外，你应该具备在两个云提供商上设置基础设施的经验。在具备必要的前提条件后，我们现在可以开始设置多云\
    \ Kubernetes 集群的过程。\n\n## 安装前提条件\n\n为了使用 Kubernetes，你必须安装几个工具。Kubernetes 命令行工具\
    \ `kubectl` 是在集群上管理和部署应用程序所必需。此外，你还需要 `kubeadm`，这是一个 Kubernetes 集群引导工具，它可以简化新\
    \ Kubernetes 集群的创建。`Kops` 是另一个本质工具，用于在 Amazon Web Services (AWS) 上运行 Kubernetes\
    \ 集群。`AWS CLI` 是 AWS 服务的命令行界面，也用于配置和管理 AWS 上的 Kubernetes 集群。同样，`Google Cloud SDK`\
    \ 作为一个命令行工具对于在 Google Cloud 上管理和部署 Kubernetes 集群也是必要的。通过安装和使用这些工具，你可以高效地部署和管理你的\
    \ Kubernetes 集群，使构建、部署和扩展应用程序变得更容易。[注意：请遵循官方文档为你的特定操作系统安装这些工具。]\n\n## 配置 AWS 和\
    \ GCP 凭据\n\n安装 `AWS CLI` 和 `Google Cloud SDK` 后，你需要配置这两个提供商的凭据。要此操作，请按照官方文档配置\
    \ `AWS CLI` 和配置 `Google Cloud SDK`。\n\n## 创建 Kubernetes 集群规范\n\n通过 `Kops`，我们可以创建一个集群规范（YAML\
    \ 格式的清单文件），描述我们期望的集群配置。让我们创建一个示例规范：\n\n```yaml\napiVersion: kops.k8s.io/v1alpha2\n\
    kind: Cluster\nmetadata:\n  name: my-multicloud-cluster.k8s.local\nspec:\n  kubernetesVersion:\
    \ v1.22.0\n  cloudProvider: aws\n  networking:\n    calico:\n      crossSubnet:\
    \ true\n  subnets:\n    - name: aws-subnet\n      type: Private\n      zone: us-west-2a\n\
    \      id: subnet-xxxxxxxx\n    - name: gcp-subnet\n      type: Private\n    \
    \  zone: us-central1-a\n      id: subnet-yyyyyyyy\n  api:\n    loadBalancer:\n\
    \      type: Internal\n  additionalNetworkCIDRs:\n    - 10.128.0.0/9\n    - 10.0.0.0/8\n\
    ```\n\n将占位符 `subnet-xxxxxxxx` 和 `subnet-yyyyyyyy` 分别替换为 AWS 和 GCP 子网 ID。\n\n##\
    \ 创建 Kubernetes 集群\n\n将 YAML 文件保存为 `multicloud-cluster.yaml`。然后，使用 `Kops` 创建集群：\n\
    \n```bash\nkops create -f multicloud-cluster.yaml\nkops create secret --name my-multicloud-cluster.k8s.local\
    \ publickey -i ~/.ssh/id_rsa.pub\nkops update cluster my-multicloud-cluster.k8s.local\
    \ --yes\n```\n\n此过程将花费一些时间，因为 `Kops` 将会在 AWS 和 GCP 上准备必要的资源。\n\n## 验证集群\n\n一旦过程完成，你可以验证集群是否已运行：\n\
    \n```bash\nkops validate cluster --name my-multicloud-cluster.k8s.local\n```\n\
    \n## 配置 kubectl 使用新集群\n\n要开始使用你的 Kubernetes 集群，你需要配置 `kubectl`：\n\n```bash\nkops\
    \ export kubecfg --name my-multicloud-cluster.k8s.local\n```\n\n## 测试集群\n\n你现在可以部署一个示例应用程序以确保一切正常工作：\n\
    \n```bash\nkubectl create deployment hello-world --image=gcr.io/google-samples/node-hello:1.0\n\
    kubectl expose deployment hello-world --type=LoadBalancer --port=8080 --target-port=8080\n\
    ```\n\n几分钟后，你应该能看到 `hello-world` 服务的外部 IP 地址：\n\n```bash\nkubectl get service\n\
    # 注意输出中的 EXTERNAL-IP:\n# NAME        TYPE           CLUSTER-IP     EXTERNAL-IP\
    \     PORT(S)          AGE\n# hello-world LoadBalancer   10.100.200.123  123.45.67.89\
    \   8080:32123/TCP   3m\n```\n\n## 访问应用程序\n\n打开浏览器并导航到端口 8080 上的外部 IP 地址：`http://<EXTERNAL-IP>:8080`（将\
    \ `1123.45.67.89` 替换为你服务的外部 IP 地址）。你应该能看到一条“Hello, World!”消息。\n\n## 清理资源\n\n为了避免产生不必要的费用，在完成对集群实验后请删除资源：\n\
    \n```bash\nkubectl delete service hello-world\nkubectl delete deployment hello-world\n\
    ```\n\n在继续下一步之前，等待 LoadBalancer 被删除。要删除集群及其所有关联资源，请运行：\n\n```bash\nkops delete\
    \ cluster my-multicloud-cluster.k8s.local --yes\n```\n\n"
- fmt: "\n# Deploying Applications on Kubernetes\n\nNow that you have a multi-cloud\
    \ Kubernetes cluster up and running, let's go through the process of deploying\
    \ an application on it. In this section, we will walkthrough the steps to deploy\
    \ an application on a multi-cloud Kubernetes cluster. First and foremost, you\
    \ need to ensure that your cluster is up and running. Once you have verified this,\
    \ we will proceed with the deployment process. For this sample demonstration,\
    \ we will use a sample Node.js application. Deploying an application on a Kubernetes\
    \ cluster can be a complex process, but with the right guidance, it can be simplified.\
    \ In our case, we will use Kubernetes to manage and orchestrate our application.\
    \ Kubernetes provides a platform for deploying, scaling, and managing containerized\
    \ applications. With Kubernetes, you can easily manage your application's lifecycle,\
    \ from deployment to scaling and maintenance. We will start by building a Docker\
    \ image of our Node.js application and then create a deployment using Kubernetes.\
    \ Once our deployment is up and running, we can expose our application to the\
    \ internet by creating a service. Finally, we will test our application to ensure\
    \ that it is working as expected. By following these steps, you will have a solid\
    \ understanding of how to deploy an application on a multi-cloud Kubernetes cluster.\
    \ Following is the step-by-step walkthrough to deploy applications:\n\n## Clone\
    \ the Sample Application\n\nClone the sample Node.js application from the following\
    \ repository:\n\n```bash\ngit clone https://github.com/kubernetes/examples.git\n\
    cd examples/staging/nodejs/\n```\n\n## Create Dockerfile\n\nIn the `nodejs` directory,\
    \ create a `Dockerfile` with the following content:\n\n```file\nFROM node:14\n\
    WORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nEXPOSE 8080\nCMD [\"\
    npm\", \"start\"]\n```\n\n## Build the Docker Image\n\nBuild the Docker image\
    \ for the sample application:\n\n```bash\ndocker build -t my-nodejs-app:1.0 .\n\
    ```\n\n## Push Docker Image to Container Registry\n\nYou will need to push the\
    \ Docker image to a container registry accessible by both AWS and GCP. For this\
    \ sample demonstration, we'll use Docker Hub. First, log in to Docker Hub:\n\n\
    ```bash\ndocker login\n```\n\nTag the image with your Docker Hub username:\n\n\
    ```bash\ndocker tag my-nodejs-app:1.0 <your-dockerhub-username>/my-nodejs-app:1.0\n\
    ```\n\nReplace `<your-dockerhub-username>` with your actual Docker Hub username.\
    \ Now, push the image to Docker Hub:\n\n```bash\ndocker push <your-dockerhub-username>/my-nodejs-app:1.0\n\
    ```\n\n## Create Deployment YAML File\n\nCreate a new file called `my-nodejs-app-deployment.yaml`\
    \ with the following content:\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  name: my-nodejs-app\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n\
    \      app: my-nodejs-app\n  template:\n    metadata:\n      labels:\n       \
    \ app: my-nodejs-app\n    spec:\n      containers:\n      - name: my-nodejs-app\n\
    \        image: <your-dockerhub-username>/my-nodejs-app:1.0\n        ports:\n\
    \        - containerPort: 8080\n---\napiVersion: v1\nkind: Service\nmetadata:\n\
    \  name: my-nodejs-app\nspec:\n  type: LoadBalancer\n  ports:\n  - port: 8080\n\
    \    targetPort: 8080\n    protocol: TCP\n  selector:\n    app: my-nodejs-app\n\
    ```\n\nReplace `<your-dockerhub-username>` with your actual Docker Hub username.\n\
    \n## Deploy the Application\n\nDeploy the application to your multi-cloud Kubernetes\
    \ cluster:\n\n```bash\nkubectl apply -f my-nodejs-app-deployment.yaml\n```\n\n\
    ## Monitor the Deployment\n\nCheck the status of the deployment:\n\n```bash\n\
    kubectl rollout status deployment my-nodejs-app\n```\n\nOnce the deployment is\
    \ complete, you can check the created pods:\n\n```bash\nkubectl get pods -l app=my-nodejs-app\n\
    ```\n\n## Access the Application\n\nTo access the application, you need to get\
    \ the external IP address of the `my-nodejs-app` service:\n\n```bash\nkubectl\
    \ get service my-nodejs-app\n```\n\nNote the `EXTERNAL-IP` in the output:\n\n\
    ```\nNAME             TYPE           CLUSTER-IP      EXTERNAL-IP     PORT(S) \
    \            AGE\nmy-nodejs-app   LoadBalancer   10.100.200.123  123.45.67.89\
    \    8080:32123/TCP   3m\n```\n\nOpen a browser and navigate to the external IP\
    \ address at port 8080: `http://123.45.67.89:8080` (replace `123.45.67.89` with\
    \ your service's external IP address). You should see the sample application running.\n\
    \n## Scale the Application\n\nIf needed, you can scale the number of replicas\
    \ for your application:\n\n```bash\nkubectl scale deployment my-nodejs-app --replicas=5\n\
    ```\n\nCheck the updated number of pods:\n\n```bash\nkubectl get pods -l app=my-nodejs-app\n\
    ```\n\n## Update the Application\n\nTo update the application, make changes to\
    \ the source code, build a new image with a different tag, push it to Docker Hub,\
    \ and update the deployment. For example:\n\n```bash\ndocker build -t my-nodejs-app:1.1\
    \ .\ndocker tag my-nodejs-app:1.1 <your-dockerhub-username>/my-nodejs-app:1.1\n\
    docker push <your-dockerhub-username>/my-nodejs-app:1.1\nkubectl set image deployment\
    \ my-nodejs-app my-nodejs-app=<your-dockerhub-username>/my-nodejs-app:1.1\n```\n\
    \n## Clean up Resources\n\nTo delete the resources associated with your application\
    \ when you're done, run:\n\n```bash\nkubectl delete -f my-nodejs-app-deployment.yaml\n\
    ```\n\n## Managing Deployments\n\nWhether you're working with a multi-cloud Kubernetes\
    \ cluster or a single-cloud one, managing deployments remains largely the same.\
    \ In both cases, you'll rely on the same tool, `kubectl`, to interact with your\
    \ deployments. This means that you won't need to worry about adjusting your approach\
    \ depending on which cloud provider you're working with. Simply put, once you've\
    \ mastered managing deployments in a single-cloud cluster, you'll be able to apply\
    \ those same skills to a multi-cloud environment without too much difficulty.\
    \ Below are some common tasks to manage deployments:\n\n### Get the List of Deployments\n\
    To see the list of deployments, run:\n\n```bash\nkubectl get deployments\n```\n\
    \n### Get Detailed Information of Deployment\nTo see detailed information about\
    \ a specific deployment, run:\n\n```bash\nkubectl describe deployment <deployment-name>\n\
    ```\n\n### Update Number of Replicas\nTo scale a deployment, change the number\
    \ of replicas:\n\n```bash\nkubectl scale deployment <deployment-name> --replicas=<number-of-replicas>\n\
    ```\n\n### Pause and Resume Deployment\nYou can pause a deployment to apply multiple\
    \ changes and then resume it:\n\n```bash\n# Pause the deployment\nkubectl rollout\
    \ pause deployment <deployment-name>\n\n# Apply multiple changes\nkubectl set\
    \ env deployment <deployment-name> KEY1=VALUE1 KEY2=VALUE2\nkubectl set resources\
    \ deployment <deployment-name> -c=<container-name> --limits=cpu=200m,memory=512Mi\n\
    \n# Resume the deployment\nkubectl rollout resume deployment <deployment-name>\n\
    ```\n\n### Check the Rollout Status\nMonitor the status of a rollout:\n\n```bash\n\
    kubectl rollout status deployment <deployment-name>\n```\n\n### View Rollout History\n\
    To view the rollout history of a deployment, run:\n\n```bash\nkubectl rollout\
    \ history deployment <deployment-name>\n```\n"
  raw: "Deploying Applications on Kubernetes Now that you have a multi-cloud Kubernetes\
    \ cluster up and running, let's go through the process of deploying an application\
    \ on it.  In this section, we will walkthrough the steps to deploy an application\
    \ on a multi-cloud Kubernetes cluster.  First and foremost, you need to ensure\
    \ that your cluster is up and running.  Once you have verified this, we will proceed\
    \ with the deployment process.  For this sample demonstration, we will use a sample\
    \ Node.js application. Deploying an application on a Kubernetes cluster can be\
    \ a complex process, but with the right guidance, it can be simplified.  In our\
    \ case, we will use Kubernetes to manage and orchestrate our application.  Kubernetes\
    \ provides a platform for deploying, scaling, and managing containerized applications.\
    \  With Kubernetes, you can easily manage your application's lifecycle, from deployment\
    \ to scaling and maintenance.  We will start by building a Docker image of our\
    \ Node.js application and then create a deployment using Kubernetes.  Once our\
    \ deployment is up and running, we can expose our application to the internet\
    \ by creating a service.  Finally, we will test our application to ensure that\
    \ it is working as expected.  By following these steps, you will have a solid\
    \ understanding of how to deploy an application on a multi-cloud Kubernetes cluster.\
    \ Following is the step-by-step walkthrough to deploy applications:: Clone the\
    \ Sample Application Clone the sample Node.js application from the following repository:\
    \ git clone https://github.com/kubernetes/examples.git cd examples/staging/nodejs/\
    \ Create Dockerfile In the nodejs directory, create a Dockerfile with the following\
    \ content: FROM node:14 WORKDIR /app COPY package\\*.json ./ RUN npm ci COPY .\
    \ . EXPOSE 8080 CMD \\[\"npm\", \"start\"\\] Build the Docker Image Build the\
    \ Docker image for the sample application: docker build -t my-nodejs-app:1.0 .\
    \ Push Docker Image to Container Registry You will need to push the Docker image\
    \ to a container registry accessible by both AWS and GCP.  For this sample demonstration,\
    \ we'll use Docker Hub. First, log in to Docker Hub: docker login Tag the image\
    \ with your Docker Hub username: docker tag my-nodejs-app:1.0 <your-dockerhub-username>/my-nodejs-app:1.0\
    \ Replace <your-dockerhub-username> with your actual Docker Hub username. Now,\
    \ push the image to Docker Hub: docker push <your-dockerhub-username>/my-nodejs-app:1.0\
    \ Create Deployment YAML File Create a new file called my-nodejs-app-deployment.yaml\
    \ with the following content: apiVersion: apps/v1 kind: Deployment metadata:  \
    \ name: my-nodejs-app spec:   replicas: 3   selector:     matchLabels:       app:\
    \ my-nodejs-app   template:     metadata:       labels:         app: my-nodejs-app\
    \     spec:       containers:       - name: my-nodejs-app         image: <your-dockerhub-username>/my-nodejs-app:1.0\
    \         ports:         - containerPort: 8080 \\--- apiVersion: v1 kind: Service\
    \ metadata:   name: my-nodejs-app spec:   type: LoadBalancer   ports:   - port:\
    \ 8080     targetPort: 8080     protocol: TCP   selector:     app: my-nodejs-app\
    \ Replace <your-dockerhub-username> with your actual Docker Hub username. Deploy\
    \ the Application Deploy the application to your multi-cloud Kubernetes cluster:\
    \ kubectl apply -f my-nodejs-app-deployment.yaml Monitor the Deployment Check\
    \ the status of the deployment: kubectl rollout status deployment my-nodejs-app\
    \ Once the deployment is complete, you can check the created pods: kubectl get\
    \ pods -l app=my-nodejs-app Access the Application To access the application,\
    \ you need to get the external IP address of the my-nodejs-app service: kubectl\
    \ get service my-nodejs-app Note the EXTERNAL-IP in the output: NAME          \
    \  TYPE           CLUSTER-IP       EXTERNAL-IP     PORT(S)          AGE my-nodejs-app\
    \   LoadBalancer   10.100.200.123   123.45.67.89     8080:32123/TCP   3m Open\
    \ a browser and navigate to the external IP address at port 8080: http://123.45.67.89:8080\
    \ (replace 123.45.67.89 with your service's external IP address).  You should\
    \ see the sample application running. Scale the Application If needed, you can\
    \ scale the number of replicas for your application: kubectl scale deployment\
    \ my-nodejs-app --replicas=5 Check the updated number of pods: kubectl get pods\
    \ -l app=my-nodejs-app Update the Application To update the application, make\
    \ changes to the source code, build a new Docker image with a different tag, push\
    \ it to Docker Hub, and update the deployment.  For example, update the image\
    \ tag to 1.1: \\# Build the new image docker build -t my-nodejs-app:1.1 . \\#\
    \ Tag the image with your Docker Hub username docker tag my-nodejs-app:1.1 <your-dockerhub-username>/my-nodejs-app:1.1\
    \ \\# Push the image to Docker Hub docker push <your-dockerhub-username>/my-nodejs-app:1.1\
    \ \\# Update the deployment to use the new image kubectl set image deployment\
    \ my-nodejs-app my-nodejs-app=<your-dockerhub-username>/my-nodejs-app:1.1 Clean\
    \ up Resources To delete the resources associated with your application when you're\
    \ done, run: kubectl delete -f my-nodejs-app-deployment.yaml This example demonstrated\
    \ how to deploy, update, scale, and access a sample application on a multi-cloud\
    \ Kubernetes cluster.  By following these steps, you can deploy your own applications\
    \ on your multi-cloud cluster. \n\nManaging Deployments Whether you're working\
    \ with a multi-cloud Kubernetes cluster or a single-cloud one, managing deployments\
    \ remains largely the same.  In both cases, you'll rely on the same tool, kubectl,\
    \ to interact with your deployments.  This means that you won't need to worry\
    \ about adjusting your approach depending on which cloud provider you're working\
    \ with.  Simply put, once you've mastered managing deployments in a single-cloud\
    \ cluster, you'll be able to apply those same skills to a multi-cloud environment\
    \ without too much difficulty. Below are some common tasks to manage deployments\
    \ on a multi-cloud Kubernetes cluster: Get the List of Deployments To see the\
    \ list of deployments in your cluster, run: kubectl get deployments Get Detailed\
    \ Information of Deployment To see detailed information about a specific deployment,\
    \ run: kubectl describe deployment <deployment-name> Replace <deployment-name>\
    \ with the name of your deployment. Update Number of Replicas To scale a deployment,\
    \ change the number of replicas: kubectl scale deployment <deployment-name> --replicas=<number-of-replicas>\
    \ Replace <deployment-name> with the name of your deployment and <number-of-replicas>\
    \ with the desired number of replicas. Pause and Resume Deployment You can pause\
    \ a deployment to apply multiple changes and then resume it: \\# Pause the deployment\
    \ kubectl rollout pause deployment <deployment-name> \\# Apply multiple changes\
    \ kubectl set env deployment <deployment-name> KEY1=VALUE1 KEY2=VALUE2 kubectl\
    \ set resources deployment <deployment-name> -c=<container-name> --limits=cpu=200m,memory=512Mi\
    \ \\# Resume the deployment kubectl rollout resume deployment <deployment-name>\
    \ Replace <deployment-name> and <container-name> with the names of your deployment\
    \ and container, respectively. Check the Rollout Status Monitor the status of\
    \ a rollout: kubectl rollout status deployment <deployment-name> Replace <deployment-name>\
    \ with the name of your deployment. View Rollout History To view the rollout history\
    \ of a deployment, run: kubectl rollout history deployment <deployment-name> Replace\
    \ <deployment-name> with the name of your deployment. These are some of the common\
    \ tasks for managing deployments in a multi-cloud Kubernetes cluster.  The kubectl\
    \ command provides many other options to manage deployments, such as applying\
    \ labels and annotations, updating configurations, and setting resource limits.\
    \  You can find more information on managing deployments in the official Kubernetes\
    \ documentation. "
