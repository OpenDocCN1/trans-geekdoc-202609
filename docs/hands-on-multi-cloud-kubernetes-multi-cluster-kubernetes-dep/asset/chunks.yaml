    kind: Kustomization resources: \- <APP\_MANIFEST\_FILE\_1> \- <APP\_MANIFEST\_FILE\_2>
    ... Replace <APP\_MANIFEST\_FILE\_1>, <APP\_MANIFEST\_FILE\_2>, etc., with the
    filenames of your application''s Kubernetes manifests. Add Application to FluxCD
    Configuration In the kustomization.yaml file you created in step 4, add a reference
    to the application''s folder: apiVersion: kustomize.config.k8s.io/v1beta1 kind:
    Kustomization resources: \- flux-system \- <APP\_FOLDER> Replace <APP\_FOLDER>
    with the name of the folder containing your application''s Kubernetes manifests.
    Commit and Push Changes Commit your changes to the Git repository and push them
    to the remote.  FluxCD will detect the changes and apply them to the connected
