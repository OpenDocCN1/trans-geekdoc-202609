    # 安装并配置 Submariner


    要在涉及 AWS 和 GCP 的多云设置中部署 Submariner，应采取以下步骤。假设两个云提供商上的 Kubernetes 集群已经运行，并且已安装必要的命令行工具（`aws`
    和 `gcloud`）以及 `kubectl`。


    ## 安装 subctl


    `subctl` 是一个强大的命令行实用程序，用于简化 Submariner 的部署和管理。Submariner 是为 Kubernetes 提供跨集群网络连接的工具。通过
    `subctl`，用户可以轻松跨集群部署和管理 Submariner，而无需手动配置网络连接。`subctl` 工具的设计旨在通过自动化许多相关任务来简化部署过程。例如，`subctl`
    可以自动检测用户环境中的各种集群，并为 Submariner 在这些集群之间的无缝运行配置必要的组件。它还可以处理各种 Submariner 组件的部署和管理，包括
    `Broker`、`Gateway` 和 `Route Agent`。此外，`subctl` 为管理 Submariner 提供了简单直观的界面。用户可以使用
    `subctl` 命令行工具轻松地检查 Submariner 部署状态、查看日志并执行各种管理任务。


    使用以下命令进行安装：


    ```bash

    VERSION=$(curl --silent https://get.submariner.io/releases/latest/version)

    curl -L https://get.submariner.io/releases/${VERSION}/subctl-${VERSION}-linux-amd64.tar.xz
    | tar -xJf -

    sudo mv subctl-\*-linux-amd64/subctl /usr/local/bin/subctl

    rm -rf subctl-\*-linux-amd64

    ```


    在下载 URL 中将 `"linux"` 替换为 macOS 的 `"darwin"` 或 Windows 的 `"windows"`。


    ## 准备 AWS 和 GCP 集群


    为了成功部署 Submariner，验证 AWS 和 GCP 中的 Kubernetes 集群已正确配置必要的网络设置。这涉及检查集群是否已配置了正确的子网、安全组和路由配置。如果没有这些配置，Submariner
    可能无法正常运行，或者在集群之间遇到连接性问题。因此，在如下多云 Kubernetes 环境中部署 Submariner 之前，确保所有必要的网络配置到位是至关重要的：


    ### AWS

    * 托管集群的 VPC 之间存在 VPC 对等连接（peering）或 VPN 连接

    * 配置安全组以允许 IPsec 流量


    ### GCP

    * 托管集群的 VPC 之间存在 VPC 网络对等或 VPN 连接

    * 配置防火墙规则以允许 IPsec 流量


    **注意**：请参考您的云提供商文档来设置对等或 VPN 连接，并配置安全组或防火墙规则。


    ## 导出 KUBECONFIG 文件


    为了确保与多个 Kubernetes 集群正常通信，正确设置环境变量 `KUBECONFIG`。该变量指定了 `kubectl` 连接集群所需的配置文件。你可以将多个
    `KUBECONFIG` 文件合并为一个文件，或者为每个集群使用单独的文件。这为使用单个 `kubectl` 安装管理和访问多个集群提供了灵活性。通过配置
    `KUBECONFIG`，可以避免因连接设置错误而可能产生的问题。正确设置 `KUBECONFIG` 是管理多个 Kubernetes 集群的关键步骤。例如，如果你为
    AWS 和 GCP 有单独的 `KUBECONFIG` 文件：


    `export KUBECONFIG=path/to/aws-config.yaml`

    `export KUBECONFIG=path/to/gcp-config.yaml`


    ## 部署 Submariner


    要在多个集群上部署 Submariner，你可以使用 `subctl`。第一步是将 `CLUSTER_NAME` 和 `BROKER` 替换为相关值。`subctl`
    是一个简化连接 Kubernetes 集群的部署和管理的命令行工具。一旦部署了 Submariner，你就可以开始探索它的功能，例如跨集群服务发现。


    ### AWS

    ```bash

    subctl join --kubeconfig AWS --clusterid aws-cluster --natt=false --cable-driver
    aws-ec2

    ```


    ### GCP

    ```bash

    subctl join --kubeconfig GCP --clusterid gcp-cluster --natt=false --cable-driver
    libreswan

    ```

    `--natt=false` 标志禁用了 `IPsec` 的 NAT 穿透，在使用对等或 VPN 连接时不需要该功能。


    ## 验证 Submariner 部署


    为了确保 Submariner 已成功部署，可以使用 `subctl` 工具。该工具提供了一种简单高效的方法检查 Submariner 组件和资源的状态：


    ```bash

    subctl show all --kubeconfig path/to/broker-kubeconfig.yaml

    ```

    你应该能看到 AWS 和 GCP 的集群、端点和网关。


    ## 测试连接性


    在每个集群上部署测试应用程序并将其暴露为 Kubernetes 服务。然后，使用服务的 DNS 名称或 IP 地址测试集群之间的连接性。例如，在 AWS 集群上部署一个
    NGINX 服务，在 GCP 集群上部署一个 Busybox pod。


    ### AWS

    ```bash

    kubectl run nginx --image=nginx --port=80 --expose

    ```


    ### GCP

    ```bash

    kubectl run busybox --image=busybox --rm -it --restart=Never -- sh

    ```

    从 Busybox pod 中，使用 `wget` 或 `curl` 测试到 AWS 集群上 NGINX 服务的连接性。将 `<nginx-service-dns>`
    替换为 NGINX 服务的相应 DNS 名称或 IP 地址：


    ```bash

    wget -qO- http://<nginx-service-dns>:80

    ```

    如果连接测试成功，你应该在 Busybox pod 中看到默认的 NGINX 欢迎页面内容。


