- fmt: "\n# Cross-cluster Networking with Submariner\n\nCross-cluster networking is\
    \ a crucial aspect of multi-cloud and hybrid cloud setups that allow services\
    \ and resources to communicate across different Kubernetes clusters. This is especially\
    \ important when dealing with large-scale deployments that span across different\
    \ regions or data centers. One of the tools that enable cross-cluster networking\
    \ is `Submariner`. It offers a secure and seamless way to connect Kubernetes clusters\
    \ and extends service discovery, networking, and load balancing capabilities across\
    \ them. By using `Submariner`, organizations can ensure that their applications\
    \ are running smoothly across different Kubernetes clusters, regardless of the\
    \ cloud provider or data center. This allows for better scalability, fault-tolerance,\
    \ and performance of applications running in multi-cloud or hybrid environments.\
    \ With the increasing popularity of cloud-native applications, cross-cluster networking\
    \ is becoming a critical aspect of infrastructure management, and tools like `Submariner`\
    \ are essential for effective implementation. Below is a step-by-step walkthrough\
    \ on implementing cross-cluster networking using `Submariner:\n\n## Create a Headless\
    \ Service\n\nTo enable cross-cluster communication, the first step is to establish\
    \ a headless service in the target cluster where the application you wish to expose\
    \ is located. In Kubernetes, a headless service is a type of service that lacks\
    \ a cluster IP, allowing you to expose your application's pods directly. This\
    \ is essential for cross-cluster networking because it enables direct communication\
    \ between the pods without any intermediary routing. A headless service allows\
    \ you to use Kubernetes DNS to access your application's pods. This means that\
    \ the pods can be accessed by their unique DNS names, which are based on their\
    \ pod names and the name of the headless service. This provides a consistent and\
    \ reliable way to communicate with your pods, even if they move between nodes\
    \ or clusters.\n\nFor example, let us see a simple Nginx deployment running in\
    \ your target cluster:\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
    \  name: nginx\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app:\
    \ nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n    spec:\n\
    \      containers:\n      - name: nginx\n        image: nginx:1.14.2\n       \
    \ ports:\n        - containerPort: 80\n```\n\n### Create a headless service for\
    \ the Nginx deployment\n\nTo establish a headless service for the Nginx deployment,\
    \ you can create a Kubernetes service of the `ClusterIP` type with a selector\
    \ that matches the label of the Nginx deployment. This will enable the service\
    \ to locate and communicate with the Nginx pods. In addition, by setting the `clusterIP`\
    \ field to `None`, you can create a headless service that returns the IP addresses\
    \ of the individual pods instead of a single IP address for the service. This\
    \ approach can be useful when you need to target individual pods directly.\n\n\
    ```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: nginx-headless\nspec:\n\
    \  type: ClusterIP\n  clusterIP: None\n  ports:\n  - name: http\n    port: 80\n\
    \  selector:\n    app: nginx\n```\n\n### Apply the YAML manifest to create the\
    \ headless service\n\nTo create a headless service using the YAML manifest, you\
    \ can apply the necessary configurations and settings. This process involves defining\
    \ the metadata and specifications for the headless service, including its name\
    \ and selector. Once applied, the headless service will be created and can be\
    \ accessed by its name. This enables communication with individual pods within\
    \ a Kubernetes cluster without relying on a single IP address, making it more\
    \ resilient and scalable.\n\n```bash\nkubectl apply -f nginx-headless-service.yaml\n\
    ```\n\n## Create SubmarinerExport Resource\n\nIn order to make the headless service\
    \ easily discoverable from other clusters, it is recommended to create a `SubmarinerExport`\
    \ resource in the target cluster. This resource is a customized element of the\
    \ `Submariner`'s `Lighthouse` project and is specifically designed to export services\
    \ across connected clusters. By creating this resource, the headless service can\
    \ be accessed from other clusters in a seamless manner, ensuring smooth functioning\
    \ of the entire cluster network. The `SubmarinerExport` resource is a crucial\
    \ tool for any organization that relies on multiple clusters for their operations.\
    \ By using this resource, administrators can export services from one cluster\
    \ to another and ensure that they are easily discoverable across different clusters.\
    \ This is particularly important for headless services that may be required to\
    \ communicate with other services or applications located in different clusters.\n\
    \n```yaml\napiVersion: lighthouse.submariner.io/v2alpha1\nkind: ServiceExport\n\
    metadata:\n  name: nginx-headless\n  namespace: default\n```\n\n### Apply the\
    \ YAML manifest to create the ServiceExport resource\n\nTo create a `ServiceExport`\
    \ resource, you can apply the YAML manifest that specifies the desired configuration.\
    \ This will define the exported service and make it available across multiple\
    \ clusters in a multicloud setup. By doing this, you can ensure that the service\
    \ is accessible across all clusters, regardless of the cloud provider they are\
    \ running on. The `ServiceExport` resource can be a valuable tool for managing\
    \ and scaling your Kubernetes cluster.\n\n```bash\nkubectl apply -f nginx-headless-export.yaml\n\
    ```\n\n## Access Service from Another Cluster\n\nAfter exporting the headless\
    \ service, you can access it from another connected cluster using its DNS name.\
    \ The format of the DNS name is `<service-name>.<namespace>.svc.clusterset.local`.\
    \ For our example, the DNS name would be `nginx-headless.default.svc.clusterset.local`.\n\
    \nTo test the connectivity, deploy a Busybox pod in the source cluster and use\
    \ `wget` or `curl` to access the Nginx service in the target cluster:\n\n```bash\n\
    # On source cluster\nkubectl run busybox --image=busybox --rm -it --restart=Never\
    \ -- sh\n\n# From the Busybox pod\nwget -qO- http://nginx-headless.default.svc.clusterset.local:80\n\
    ```\n\nIf the connectivity test is successful, you should see the default Nginx\
    \ welcome page content in the Busybox pod. You have now successfully implemented\
    \ cross-cluster networking using Submariner. Your Kubernetes resources can communicate\
    \ across clusters, allowing you to deploy and manage applications seamlessly across\
    \ multiple environments. This capability simplifies application development and\
    \ management, as well as enabling advanced use cases like disaster\n"
