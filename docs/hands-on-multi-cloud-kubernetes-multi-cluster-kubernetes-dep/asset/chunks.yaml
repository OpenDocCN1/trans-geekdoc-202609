    # Rolling Updates


    Kubernetes offers an important functionality called rolling updates which enables
    application updating with minimal interruption. Essentially, rolling updates work
    by gradually substituting older instances of the application with new ones in
    Kubernetes, ensuring that a certain number of replicas are always accessible.
    This way, even as the new version of the application is being deployed, users
    can continue to access a portion of the older version without any disruption to
    their experience. Rolling updates are a critical aspect of managing and updating
    containerized applications, and Kubernetes provides a robust and reliable method
    for doing so. By minimizing downtime and allowing for a more seamless deployment
    process, rolling updates help ensure that applications remain up-to-date and functioning
    as intended while still providing users with uninterrupted access. With Kubernetes,
    developers have access to a range of powerful tools that allow them to easily
    and effectively manage and update containerized applications. Below is how you
    can manage rolling updates for your deployments in a multi-cloud Kubernetes cluster:


    ## Perform Rolling Update

    To perform a rolling update for a specific deployment, you need to update the
    container image:


    ```bash

    kubectl set image deployment <deployment-name> <container-name>=<new-image>

    ```

    Replace `<deployment-name>` with the name of your deployment, `<container-name>`
    with the name of the container to update, and `<new-image>` with the new image.
    For example, if you have a deployment named `my-nodejs-app` with a container named
    `my-nodejs-app` and you want to update the image to version 1.1, run:


    ```bash

    kubectl set image deployment my-nodejs-app my-nodejs-app=<your-dockerhub-username>/my-nodejs-app:1.1

    ```

    Kubernetes will gradually replace the old instances with new ones, ensuring that
    the application remains available throughout the update process.


    ## Monitor Rollout Status

    You can check the status of the rollout using the following command:


    ```bash

    kubectl rollout status deployment <deployment-name>

    ```

    Replace `<deployment-name>` with the name of your deployment.


    ## Pause and Resume Rollout

    You can pause a rollout to apply multiple changes at once or to debug issues,
    and then resume it later:


    ```bash

    # Pause the rollout

    kubectl rollout pause deployment <deployment-name>

    # Make changes or debug issues

    # ...

    # Resume the rollout

    kubectl rollout resume deployment <deployment-name>

    ```

    Replace `<deployment-name>` with the name of your deployment.


    ## Rollback to Previous Version

    If you encounter issues after a rolling update, you can roll back to a previous
    version of the deployment:


    ```bash

    kubectl rollout undo deployment <deployment-name>

    ```

    Replace `<deployment-name>` with the name of your deployment.


    ## View Rollout History

    To view the rollout history of a deployment, run:


    ```bash

    kubectl rollout history deployment <deployment-name>

    ```

    Replace `<deployment-name>` with the name of your deployment.


    ## Rollback to Specific Revision

    If you want to roll back to a specific revision, use the `--to-revision` flag:


    ```bash

    kubectl rollout undo deployment <deployment-name> --to-revision=<revision-number>

    ```

    Replace `<deployment-name>` with the name of your deployment and `<revision-number>`
    with the desired revision number.


    By using these commands and techniques, you can effectively manage rolling updates
    for your deployments in a multi-cloud Kubernetes cluster, ensuring minimal downtime
    and a smoother update process.


    # Scaling and Autoscaling


    Kubernetes offers a scalable infrastructure for managing containerized applications
    by providing the ability to adjust the number of replicas of a deployment to meet
    the demands of varying workloads. This process of adjusting the number of replicas
    is known as scaling. In Kubernetes, scaling can be done manually or automatically.
    Automatic scaling is referred to as autoscaling, and it involves adjusting the
    number of replicas based on workload metrics, such as CPU utilization. Autoscaling
    is an essential feature in Kubernetes because it helps to optimize resource utilization
    while maintaining application performance. When the workload increases, autoscaling
    ensures that the application can handle the increased load by scaling up the number
    of replicas. Conversely, when the workload decreases, autoscaling reduces the
    number of replicas to avoid resource wastage. This automated process saves time
    and effort compared to manual scaling, and it ensures that the application is
    always running optimally. Below is how you can manage scaling and autoscaling
    in a multi-cloud Kubernetes cluster:


    ## Manual Scaling

    ### Scale a deployment:

    To manually scale a deployment, change the number of replicas using the `kubectl
    scale` command:


    ```bash

    kubectl scale deployment <deployment-name> --replicas=<number-of-replicas>

    ```

    Replace `<deployment-name>` with the name of your deployment and `<number-of-replicas>`
    with the desired number of replicas.


    ### Verify the scaling

    Check the updated number of pods:


    ```bash

    kubectl get pods -l app=<deployment-name>

    ```

    Replace `<deployment-name>` with the name of your deployment.


    ## Autoscaling

    To enable autoscaling, you need to use the Kubernetes Horizontal Pod Autoscaler
    (`HPA`). The `HPA` adjusts the number of replicas based on the observed CPU utilization
    or other custom metrics.


    ### Create an HPA resource

    To create an HPA resource, use the `kubectl autoscale` command:


    ```bash

    kubectl autoscale deployment <deployment-name> --min=<min-replicas> --max=<max-replicas>
    --cpu-percent=<target-cpu-utilization>

    ```

    Replace `<deployment-name>` with the name of your deployment, `<min-replicas>`
    with the minimum number of replicas, `<max-replicas>` with the maximum number
    of replicas, and `<target-cpu-utilization>` with the desired target CPU utilization
    percentage. For example, to create an HPA for a deployment named `my-nodejs-app`
    with a minimum of 3 replicas, a maximum of 10 replicas, and a target CPU utilization
    of 50%, run:


    ```bash

    kubectl autoscale deployment my-nodejs-app --min=3 --max=10 --cpu-percent=50

    ```


    ### Verify the HPA

    Check the created HPA resource:


    ```bash

    kubectl get hpa

    ```

    You should see the HPA resource with the target CPU utilization and the current
    number of replicas.


    ### Monitor the HPA

    To see detailed information about the HPA, run:


    ```bash

    kubectl describe hpa <hpa-name>

    ```

    Replace `<hpa-name>` with the name of your HPA resource, which is usually the
    same as the deployment name.


    ### Update the HPA

    To update the HPA configuration, such as changing the target CPU utilization or
    the minimum/maximum number of replicas, use the `kubectl edit` command:


    ```bash

    kubectl edit hpa <hpa-name>

    ```

    Replace `<hpa-name>` with the name of your HPA resource. This will open the HPA
    resource configuration in your default text editor. Make the necessary changes
    and save the file.


    ### Delete the HPA

    To remove the HPA and disable autoscaling, run:


    ```bash

    kubectl delete hpa <hpa-name>

    ```

    Replace `<hpa-name>` with the name of your HPA resource.


    By following these steps, you can effectively scale and autoscale your deployments
    in a multi-cloud Kubernetes cluster, ensuring that your applications can handle
    varying workloads and maintain optimal performance.

