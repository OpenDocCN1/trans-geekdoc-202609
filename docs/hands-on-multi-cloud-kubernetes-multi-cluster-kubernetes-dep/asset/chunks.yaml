    \ data:   fluent.conf: |     <source>       @type tail       path /var/log/containers/\\\
    *.log       pos\\_file /var/log/fluentd-containers.log.pos       tag kubernetes.\\\
    *       format json       read\\_from\\_head true     </source>     <match kubernetes.\\\
    *>       @type elasticsearch       host <elasticsearch-service-name>       port\
    \ 9200      logstash\\_format true      logstash\\_prefix fluentd      include\\\
    _tag\\_key true      type\\_name container\\_logs      <buffer>        flush\\\
