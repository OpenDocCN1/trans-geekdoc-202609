  trans: "\n\n# 使用 Submariner 实现跨集群网络\n\n跨集群网络是多云和混合云部署中的关键方面，它允许服务和资源跨不同的 Kubernetes\
    \ 集群之间进行通信。在处理跨越不同区域或数据中心的大规模部署时，这一点尤为重要。实现跨集群网络的工具之一是 `Submariner`。它提供了一种安全且无缝的方式连接\
    \ Kubernetes 集群，并跨集群扩展服务发现、网络和负载均衡能力。通过使用 `Submariner`，组织可以确保其应用程序在不同的云提供商或数据中心的不同\
    \ Kubernetes 集群中流畅运行。这使得运行在多云或混合环境中的应用程序具有更好的扩展性、容错性和性能。随着云原生应用的日益普及，跨集群网络正成为基础设施管理的关键环节，而\
    \ `Submariner` 等工具对于有效实现至关重要。以下是使用 `Submariner` 实现跨集群网络的逐步指南：\n\n## 创建无头服务（Headless\
    \ Service）\n\n要启用跨集群通信，第一步是在目标集群中建立无头服务，该集群位于你想暴露的应用。在 Kubernetes 中，无头服务是一种缺少集群\
    \ IP 的服务类型，允许你直接暴露应用程序的 Pod。这对于跨集群网络至关重要，因为它允许 Pod 之间在没有任何中间路由的情况下直接通信。无头服务允许你使用\
    \ Kubernetes DNS 访问你的应用程序 Pod。这意味着可以通过其唯一的 DNS 名称访问 Pod，这些名称是基于 Pod 名称和无头服务的名称生成的。这提供了一种与\
    \ Pod 通信的持续且可靠的方式，即使它们在节点或集群之间移动也是如此。\n\n例如，让我们来看一个运行在你的目标集群中运行的简单 Nginx 部署：\n\
    \n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: nginx\nspec:\n\
    \  replicas: 1\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n\
    \    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
    \      - name: nginx\n        image: nginx:1.14.2\n        ports:\n        - containerPort:\
    \ 80\n```\n\n### 为 Nginx 部署创建无头服务\n\n为 Nginx 部署建立无头服务，你可以创建一个 `ClusterIP` 类型的\
    \ Kubernetes 服务，其选择器（selector）应与 Nginx 部署的标签匹配。这将允许服务定位并与 Nginx Pod 通信。此外，通过将\
    \ `clusterIP` 字段设置为 `None`，你可以创建一个无头服务，它返回单个 Pod 的 IP 地址，而不是服务的单一 IP 地址。这种方法在你需要直接针对单个\
    \ Pod 时非常有用。\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: nginx-headless\n\
    spec:\n  type: ClusterIP\n  clusterIP: None\n  ports:\n  - name: http\n    port:\
    \ 80\n  selector:\n    app: nginx\n```\n\n### 应用 YAML 清单创建无头服务\n\n要使用 YAML 清单创建无头服务，你可以应用必要的配置和设置。此过程涉及定义无头服务的元数据和规范，包括名称和选择器。一旦应用，无头服务将被创建并可以通过其名称访问。这允许在不依赖单一\
    \ IP 地址的情况下与 Kubernetes 集群内的单个 Pod 通信，使其具韧性和扩展性。\n\n```bash\nkubectl apply -f\
    \ nginx-headless-service.yaml\n```\n\n## 创建 SubmarinerExport 资源\n\n为了让其他集群能够轻松发现无头服务，建议在目标集群中创建\
    \ `SubmarinerExport` 资源。该资源是 `Submariner` 的 `Lighthouse` 项目的自定义元素，专门设计用于跨连接集群导出服务。通过创建此资源，可以从其他集群无缝地访问无头服务，确保整个集群网络的顺畅运行。`SubmarinerExport`\
    \ 资源对于任何依赖多个集群进行的组织来说都是至关重要的工具。通过使用此资源，管理员可以将服务从一个集群导出到另一个集群，并确保它们在不同集群之间易于发现。这对于可能需要与位于不同集群的服务或应用程序通信的无头服务来说特别重要。\n\
    \n```yaml\napiVersion: lighthouse.submariner.io/v2alpha1\nkind: ServiceExport\n\
    metadata:\n  name: nginx-headless\n  namespace: default\n```\n\n### 应用 YAML 清单创建\
    \ ServiceExport 资源\n\n要创建 `ServiceExport` 资源，你可以应用指定所需配置的 YAML 清单。这将定义导出的服务并使其在多云设置中的多个集群可用。通过这样做，你可以确保服务无论运行在哪个云提供商上，在所有集群中可用。`ServiceExport`\
    \ 资源可以是管理和扩展 Kubernetes 集群的宝贵工具。\n\n```bash\nkubectl apply -f nginx-headless-export.yaml\n\
    ```\n\n## 从另一个集群访问服务\n\n导出无头服务后，你可以使用其 DNS 名称从另一个连接的集群访问它。DNS 名称的格式为 `<service-name>.<namespace>.svc.clusterset.local`。对于我们的示例，DNS\
    \ 名称将是 `nginx-headless.default.svc.clusterset.local`。\n\n要测试连通性，在源集群中部署一个 Busybox\
    \ Pod 并使用 `wget` 或 `curl` 访问目标集群中的 Nginx 服务：\n\n```bash\n# 在源集群上\nkubectl run\
    \ busybox --image=busybox --rm -it --restart=Never -- sh\n\n# 在 Busybox Pod 中\n\
    wget -qO- http://nginx-headless.default.svc.clusterset.local:80\n```\n\n如果连通性测试成功，你应该会在\
    \ Busybox Pod 中看到默认的 Nginx 欢迎页面内容。你现在已成功使用 Submariner 实现了跨集群网络。你的 Kubernetes 资源可以跨集群通信，允许你在不同环境中无缝地部署和管理应用程序。这种能力简化了应用程序的开发和管理，并支持了如灾难恢复等高级用例。\n\
    \n"
- fmt: "\n# Service Discovery\n\nService discovery is the process by which applications\
    \ and services within a distributed system can locate and communicate with each\
    \ other. In Kubernetes, service discovery is typically achieved through the use\
    \ of Kubernetes services, which provide stable IP addresses and DNS names to reach\
    \ the underlying application Pods. Submariner extends the native Kubernetes service\
    \ discovery capabilities to work across multiple connected clusters. It allows\
    \ services to be accessible and discoverable from other clusters within the connected\
    \ environment, making it easier to manage and scale applications across different\
    \ clusters or cloud providers.\n\nBelow is a step-by-step walkthrough on implementing\
    \ cross-cluster service discovery using Submariner:\n\n## Create Kubernetes Service\n\
    To demonstrate cross-cluster service discovery, let us look at a scenario wherein\
    \ you have a simple Nginx deployment running in your target cluster:\n\n```yaml\n\
    apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: nginx\nspec:\n  replicas:\
    \ 1\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n    metadata:\n\
    \      labels:\n        app: nginx\n    spec:\n      containers:\n      - name:\
    \ nginx\n        image: nginx:1.14.2\n        ports:\n        - containerPort:\
    \ 80\n```\n\nCreate a Kubernetes service for the Nginx deployment:\n\n```yaml\n\
    apiVersion: v1\nkind: Service\nmetadata:\n  name: nginx-service\nspec:\n  selector:\n\
    \    app: nginx\n  ports:\n    - protocol: TCP\n      port: 80\n      targetPort:\
    \ 80\n```\n\nApply the YAML manifest to create the service:\n```bash\nkubectl\
    \ apply -f nginx-service.yaml\n```\n\n## Export the Service\nTo make the Kubernetes\
    \ service discoverable from other clusters, create a `ServiceExport` resource\
    \ in the target cluster. This custom resource is part of the Submariner's Lighthouse\
    \ project and helps export services across connected clusters.\n\n```yaml\napiVersion:\
    \ lighthouse.submariner.io/v2alpha1\nkind: ServiceExport\nmetadata:\n  name: nginx-service\n\
    \  namespace: default\n```\n\nApply the YAML manifest to create the `ServiceExport`\
    \ resource:\n```bash\nkubectl apply -f nginx-service-export.yaml\n```\n\n## Discover\
    \ Service from Another Cluster\nAfter exporting the service, you can access it\
    \ from another connected cluster using its DNS name. The format of the DNS name\
    \ is `<service-name>.<namespace>.svc.clusterset.local`. For our example, the DNS\
    \ name would be `nginx-service.default.svc.clusterset.local`.\n\nTo test the service\
    \ discovery, deploy a Busybox pod in the source cluster and use `wget` or `curl`\
    \ to access the Nginx service in the target cluster:\n\n```bash\n# On source cluster\n\
    kubectl run busybox --image=busybox --rm -it --restart=Never -- sh\n\n# From the\
    \ Busybox pod\nwget -qO- http://nginx-service.default.svc.clusterset.local:80\n\
    ```\n\nIf the service discovery test is successful, you should see the default\
    \ Nginx welcome page content in the Busybox pod. You have now successfully implemented\
    \ cross-cluster service discovery using Submariner. Your Kubernetes services are\
    \ discoverable across clusters, allowing you to deploy and manage applications\
    \ seamlessly across multiple environments. This capability simplifies application\
    \ development and management, as well as enabling advanced use cases like disaster\
    \ recovery, load balancing, and multi-cloud deployments.\n\n# Load Balancing\n\
    Load balancing is an essential aspect of any Kubernetes environment, as it ensures\
    \ that network traffic is distributed evenly across multiple application instances\
    \ (`Pods`) for better availability, fault tolerance, and optimal resource utilization.\
    \ Kubernetes offers in-built support for load balancing through its `Services`,\
    \ which provides a stable entry point for the underlying `Pods`.\n\nHowever, in\
    \ a multi-cluster environment, it is important to ensure that traffic is not only\
    \ balanced within a single cluster but also across connected clusters. This is\
    \ where Submariner comes into play. Submariner is an open-source solution that\
    \ enables cross-cluster connectivity and service discovery. By leveraging built-in\
    \ Kubernetes capabilities with Submariner, you can distribute traffic across clusters.\n\
    \nBelow is a step-by-step walkthrough on implementing cross-cluster load balancing\
    \ using Submariner:\n\n## Deploy Application in Multiple Clusters\nTo demonstrate\
    \ cross-cluster load balancing, deploy the same application (e.g., Nginx) in multiple\
    \ clusters. In each cluster, create a Deployment and Service. For example, create\
    \ the following manifests:\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  name: nginx\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n\
    \      app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
    \    spec:\n      containers:\n      - name: nginx\n        image: nginx:1.14.2\n\
    \        ports:\n        - containerPort: 80\n```\n\n```yaml\napiVersion: v1\n\
    kind: Service\nmetadata:\n  name: nginx-service\nspec:\n  selector:\n    app:\
    \ nginx\n  ports:\n    - protocol: TCP\n      port: 80\n      targetPort: 80\n\
    ```\n\nApply the YAML manifests to create the Deployment and Service in each cluster:\n\
    ```bash\nkubectl apply -f nginx-deployment.yaml\nkubectl apply -f nginx-service.yaml\n\
    ```\n\n## Export the Services\nIn each cluster, create a `ServiceExport` resource\
    \ for the Nginx Service to make it discoverable from other clusters:\n\n```yaml\n\
    apiVersion: lighthouse.submariner.io/v2alpha1\nkind: ServiceExport\nmetadata:\n\
    \  name: nginx-service\n  namespace: default\n```\n\n## Access Service from Another\
    \ Cluster\nAfter exporting the Services, you can access them from any connected\
    \ cluster using the DNS name `<service-name>.<namespace>.svc.clusterset.local`.\
    \ Since multiple clusters have the same service exported, Submariner will load\
    \ balance the traffic across these services in different clusters.\n\nYou can\
    \ test this by deploying a Busybox pod in a source cluster and repeatedly using\
    \ `wget` or `curl` to access the Nginx service:\n\n```bash\n# On source cluster\n\
    kubectl run busybox --image=busybox --rm -it --restart=Never -- sh\n\n# From the\
    \ Busybox pod\nfor i in {1..10}; do wget -qO- http://nginx-service.default.svc.clusterset.local:80;\
    \ done\n```\n\nIf load balancing is working correctly, you should see responses\
    \ from different Nginx instances in the various clusters. You have now successfully\
    \ implemented cross-cluster load balancing using Submariner. Your application\
    \ traffic is distributed across multiple clusters, ensuring high availability,\
    \ fault tolerance, and optimal resource utilization.\n"
