  trans: "\n\n# 使用 Virtual Kubelet 进行扩展和自动扩缩\n\n通过使用 Kubernetes 的内置功能可以实现 Virtual\
    \ Kubelet 的手动和自动扩展，例如 `ReplicaSet`、`Deployment` 和 `HorizontalPodAutoscaler`。`Virtual\
    \ Kubelet` 将扩展任务委托给它所集成的无服务器平台，例如 `AWS Fargate` 或 `Google Cloud Run`。\n\n## 手动扩展\n\
    可以使用 Kubernetes 中的 `ReplicaSet` 或 `Deployment` 资源进行手动扩展。这些资源允许你为给定的应用程序指定所需的副本数量。\n\
    \n### 创建 Deployment\n通过在 Pod 规范中添加 `nodeName` 字段，创建一个指向代表你的无服务器平台的 Virtual Kubelet\
    \ 节点的 `Deployment`：\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
    \  name: my-serverless-app\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n\
    \      app: my-serverless-app\n  template:\n    metadata:\n      labels:\n   \
    \     app: my-serverless-app\n    spec:\n      nodeName: virtual-kubelet-aws \
    \ # 或 virtual-kubelet-gcp\n      containers:\n      - name: my-container\n   \
    \     image: my-ecr-repo/my-image:latest\n```\n\n### 使用 kubectl 应用 Deployment\n\
    使用 `kubectl` 应用 Deployment：\n```bash\nkubectl apply -f my-serverless-deployment.yaml\n\
    ```\n要手动扩展副本数量，使用 `kubectl scale` 命令：\n```bash\nkubectl scale deployment my-serverless-app\
    \ --replicas=5\n```\n此命令将副本数量增加到 5。\n\n## 自动扩展\n可以使用 Kubernetes 中的 `HorizontalPodAutoscaler`\
    \ (HPA) 资源实现自动扩展。HPA 根据观察到的 CPU 利用率或自定义指标自动调整副本 数量。\n\n首先，确保你的 Kubernetes 集群中安装并运行了\
    \ `metrics-server`。`HPA` 需要 `metrics-server` 来收集 CPU 和内存利用率数据。\n\n### 创建 HorizontalPodAutoscaler\
    \ 资源\n创建一个针对你的 `Deployment` 的 `HorizontalPodAutoscaler` 资源：\n\n```yaml\napiVersion:\
    \ autoscaling/v2beta2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: my-serverless-app-hpa\n\
    spec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name:\
    \ my-serverless-app\n  minReplicas: 1\n  maxReplicas: 10\n  metrics:\n  - type:\
    \ Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n\
    \        averageUtilization: 50\n```\n此 HPA 配置将尝试将所有副本的平均 CPU 利用率保持在 50%，根据需要将在\
    \ 1 到 10 之间缩缩副本数量。\n\n### 使用 kubectl 应用 HorizontalPodAutoscaler\n```bash\nkubectl\
    \ apply -f my-serverless-hpa.yaml\n```\n通过这些配置，你可以使用 `Virtual Kubelet` 手动和自动扩展运行在无服务器平台上的工作负载。扩展任务被委托给无服务器平台，确保你的应用程序根据需求进行高效扩展。\n\
    \n# 无服务器集群中的监控与日志记录\n\n使用 `Virtual Kubelet` 在无服务器集群中的监控和日志记录可以使用 `Prometheus`\
    \ 进行指标采集，并使用如 `Elasticsearch`、`Fluentd` 和 `Kibana` (EFK) 或 `Loki` 等日志聚合和分析解决方案。在本节中，我们将重点关注如何设置\
    \ `Prometheus` 来监控无服务器集群。请记住，监控无服务器平台可能与监控传统的 Kubernetes 节点不同，因为底层基础设施被抽象掉了。\n\
    \n## 使用 Prometheus 进行监控\n在你的 Kubernetes 集群中安装 `Prometheus`：你可以使用 `kube-prometheus-stack`\
    \ Helm chart 在你的集群中部署 `Prometheus`、`Grafana`、`Alertmanager` 以及相关的导出器。添加 Prometheus\
    \ Community Helm 仓库并安装 chart：\n\n```bash\nhelm repo add prometheus-community https://prometheus-community.github.io/helm-charts\n\
    helm repo update\nhelm install my-prometheus prometheus-community/kube-prometheus-stack\n\
    ```\n\n### 配置 Prometheus 从 Virtual Kubelet 抓取指标\n`Virtual Kubelet` 在 `/metrics`\
    \ 端点上以 `Prometheus` 格式暴露指标。你需要配置 `Prometheus` 来抓取这些指标。创建一个指向 Virtual Kubelet 节点的\
    \ `ServiceMonitor` 资源：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind:\
    \ ServiceMonitor\nmetadata:\n  name: virtual-kubelet\n  labels:\n    release:\
    \ my-prometheus\nspec:\n  selector:\n    matchLabels:\n      app: virtual-kubelet\n\
    \  endpoints:\n  - port: metrics\n    interval: 15s\n```\n\n使用 `kubectl` 应用 `ServiceMonitor`：\n\
    ```bash\nkubectl apply -f virtual-kubelet-servicemonitor.yaml\n```\n\n### 使用 Grafana\
    \ 可视化指标\n`kube-prometheus-stack` chart 包含了用于指标可视化的 `Grafana`。通过端口转发 `Grafana`\
    \ 服务访问 `Grafana` 仪表板：\n\n```bash\nkubectl port-forward svc/my-prometheus-grafana\
    \ 3000:80\n```\n打开浏览器并导航到 `http://localhost:3000`。使用默认凭（用户名：`admin`，密码：`prom-operator`）登录。你现在可以创建自定义仪表板，以可视化运行在\
    \ `Virtual Kubelet` 上的无服务器集群的指标。\n\n## 使用 EFK 或 Loki 进行日志记录\n为使用 `Virtual Kubelet`\
    \ 的无服务器集群设置日志解决方案可能需要你使用无服务器平台提供的原生日志解决方案，例如 AWS 的 `CloudWatch` 或 Google Cloud\
    \ 的 `Google Cloud Logging`。然而，你仍然可以通过配置 `Fluentd` 或 `Fluent Bit` 将日志转发到 `Elasticsearch`\
    \ 或 `Loki` 来收集应用程序日志。然后你可以使用 `Kibana` 或 `Grafana` 可视化日志。参考在 Kubernetes 集群中设置 `EFK`\
    \ 或 `Loki` 的文档。通过这些步骤，你可以使用 `Virtual Kubelet` 为无服务器集群设置监控和日志记录，从而获取应用程序的见。\n\n\
    ## 总结\n我们讨论了 `Virtual Kubelet` 的概念及其在多云环境中的优势。`Virtual Kubelet` 是一种允许将亚马逊云服务 (AWS)\
    \ 和 Google Cloud 平台 (GCP) 等各种云供应商集成到单个 Kubernetes 集群中的工具，使得在混合或多云环境中部署和管理应用程序变得更容易。要配合多云供应商使用\
    \ `Virtual Kubelet`，首先你需要创建一个 Kubernetes 集群并配置 `Virtual Kubelet`。接下来，你可以使用 `AWS\
    \ Fargate` 或 `Google Cloud Run` 等服务部署无服务器集群。`Virtual Kubelet` 允许根据应用程序需求对这些无服务器集群进行扩展和自动扩缩，从而降低成本并确保高可用性。`Virtual\
    \ Kubelet` 还提供了监控和日志记录功能，允许你监控跨云供应商的应用程序健康状况性能。`Virtual Kubelet` 系统将指标发送到 `Prometheus`\
    \ 或 `Datadog` 等监控系统，日志可以发送到 `Elasticsearch` 或 `Splunk` 等集中式日志解决方案。总之，`Virtual\
    \ Kubelet` 是一项强大的工具，可以帮助你更有效地将多个云供应商集成到单个 Kubernetes 集群中。\n\n# 第 5 章：使用 Submariner\
    \ 进行网络连接\n\n"
