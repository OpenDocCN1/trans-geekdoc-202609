    \ But one question always remains unanswered. What percentage of the amount actually\
    \ reaches the intended beneficiaries? Blockchain can make it easier to track the\
    \ distribution and delivery and each transaction is transparently recorded on\
    \ the blockchain. These subsidies can now be targeted at the farmers who are eligible\
    \ for them by using blockchain. We can see that smart contracts and blockchain\
    \ can be combined to benefit our farmers.\n\n# **35 Blockchain in the Hotel Industry**\n\
    \n![](Images/image00122.jpeg)\n\nTo prove his identity, a person must show his\
