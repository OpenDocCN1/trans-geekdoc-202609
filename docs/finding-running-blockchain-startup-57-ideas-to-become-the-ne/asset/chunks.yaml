    data sets they can. There is an obvious need for a neutral and transparent platform
    that can both benefit IoT device makers and AI ml startup founders. A trustless,
    reliable and secure blockchain platform that allows data to be traded seamlessly
    is the solution. There are two main benefits to a blockchain-based decentralised
    data marketplace. First, a continuously accessible data store for IoT device makers.
    The second benefit is a data marketplace that offers a wide range of searchable
