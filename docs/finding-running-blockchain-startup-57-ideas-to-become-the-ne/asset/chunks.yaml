- raw: "But with blockchain based loyalty points, the points can be redeemed at various\
    \ other partner outlets, thus increasing the usage and attractiveness of these\
    \ points to the customers. Very recently, a blockchain based loyalty program has\
    \ been launched by Singapore Airlines for its fliers. They have developed a digital\
    \ bullet named crispy in partnership with Microsoft and KPMG, where their fliers\
    \ can convert their air miles into units of payment that can be used at partner\
    \ outlets in Singapore. Customers are provided with a mobile app. Using this app,\
    \ the customers can convert their miles into units of payment, and use these units\
    \ to create resistance outlets by simply scanning a QR code. Last but not the\
    \ least, blockchain can be used in flight insurance payout using smart contracts.\
    \ Many airline carriers and their travel partners sell flight delay insurance\
    \ along with the flight tickets.\n\nBut when the flights get delayed, we even\
    \ don't know whom to approach to get our insurance claim. The whole claim process\
    \ is opaque. And no one knows what are the steps involved or what is the compensation\
    \ that they will get if their flight gets delayed. But with blockchain and smart\
    \ contracts, the process will be simplified. This has been implemented by AXA,\
    \ where fliers can buy flight delay insurance by paying a premium. Under this\
    \ insurance scheme. If the flight gets delayed by more than two hours, the smart\
    \ contract gets executed, an insurance claim amount gets automatically transferred\
    \ in the account of the flyers. for buying this smart contract based insurance.\n\
    \nA person needs to first register his flight details on the service providers\
    \ platform and fill their identity and account details. Then they can pay and\
    \ buy the insurance plan. And if the flight gets delayed more than the stipulated\
    \ time defined in the smart contract. An automatic payout is triggered by the\
    \ smart contract into the fly's bank account. This payout is done without any\
    \ manual intervention from any of the stakeholders involved, thus making it swift\
    \ and transparent.\n\n# **7\\. Blockchain Application in Artificial Intelligence\
    \ (AI)**\n\n![](Images/image00094.jpeg)\n\nYou interact with AI systems every\
    \ day, whether you realize it or not. Artificial intelligence is the basis of\
    \ all suggestions you see when you search for something on your favorite search\
    \ engine or shop online at your favourite ecommerce site. Many industry experts\
    \ have referred to artificial intelligence and blockchain as the biggest disruptors\
    \ in the next decade. Let's examine how the interplay between these two technologies\
    \ can make stakeholders happy. Blockchain with artificial intelligence will bring\
    \ you the first big advantage: better data models.\n\nAi needs data. Not just\
    \ data. It also requires a lot of data. Current business models based on AI are\
    \ dependent upon the data generated by these businesses and their associates.\
    \ Privacy is the first thing that comes to our minds when we hear data sharing.\
    \ This is why data sharing between these companies for an AI system to function\
    \ is so important. There are always risks of data breaches, misuse, and misappropriation.\
    \ AI is able to produce more accurate insights and predictions if it has more\
    \ data. An AI system must have unlimited access to all information in order to\
    \ function in a business environment. The blockchain can provide the necessary\
    \ data security assurance to these businesses. This will allow for uninterrupted\
    \ data access to AI systems. It will also make it easier for stakeholders to share\
    \ relevant data as it will be located in a distributed network without any single\
    \ entity. A common data mining platform can integrate data from all relevant departments\
    \ and stakeholders.\n\nThe AI analytical can then extract relevant insights. Smart\
    \ contracts will be used to determine the use of shared data. This reduces the\
    \ risk of data losing credibility and its value. AI systems can access this unbroken,\
    \ decentralised pool data and provide Smart Insights that are based on study patterns,\
    \ behaviours, and other relevant aspects. The large data pool will allow for more\
    \ accurate insights, which in turn will deliver real business value to all stakeholders.\
    \ Secure personal data and better data insights will be the second major advantage.\
    \ Blockchain is a secure way to store personal and private information of individuals.\
    \ This data can be used by AI systems to provide great insight when processed\
    \ smartly. A smart AI healthcare system could provide a precise diagnosis of your\
    \ problem based on your medical scans. The movie recommendations that Netflix\
    \ and Amazon make based on this information can also be provided.\n\nThese scenarios\
    \ make it very personal and important that the data feed into the AI systems of\
    \ service providers remains secure. In all possible scenarios. This is because\
    \ any breach could cause financial and legal havoc. With blockchain, this data\
    \ is encrypted. To secure this data, private keys are required to be protected.\
    \ This allows for better data security by service providers. In addition to better\
    \ insights for consumers. Blockchain with AI has a critical advantage. AI systems\
    \ can access large amounts of data and make decisions based on their relevancy.\
    \  \n\nBecause of the complexity involved, we humans often are not able to comprehend\
    \ the logic used to achieve specific results. Blockchain will allow AI-generated\
    \ diseases to be documented on the shared ledger, one data point at a time. It\
