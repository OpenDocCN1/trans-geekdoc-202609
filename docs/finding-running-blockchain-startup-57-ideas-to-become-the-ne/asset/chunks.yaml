    They can reach large numbers and get enough information to contact them and then
    recruit them. Distributed ledger technology can be used to proactively prove compliance
    by drug companies with legal and human rights issues. The blockchain will allow
    you to view the entire timestamp procedure for clinical trials. Their respective
    organizations can verify that no illegal or unethical means have been used by
    pharma companies to conduct these trials. This will bring trust and transparency
    to the system.


    # 14. Blockchain Application in Combating Fake News


    ![](Images/image00101.jpeg)


    It has been a great way to learn about the world through news reading and watching.
    News agencies are able to provide crucial information via newspapers, magazines
    and online blogs. However, not all of the information shared through these media
    channels is authentic and often fake. Fake news and false information are spreading
    faster than the original news due to the increasing ease of communication. These
    news offers look more convincing and interesting than the original news.


    Fake news can cause reputational damage to any organisation or person, regardless
    of their domain. Blockchain technology could revolutionize the way news is created
    and distributed to the masses. This technology could help curb fake news before
    it reaches people and even if it does manage to get through. Fake news can be
    easily identified by its provenance and authorship. Each piece of news is filtered
    through several stakeholders. They capture it and refine it until it is consumable
    to the readers.

