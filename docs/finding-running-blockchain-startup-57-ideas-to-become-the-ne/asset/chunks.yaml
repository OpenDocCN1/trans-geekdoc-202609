    that can lock or unlock the tractor based on the payment status.


    This would make renting of the high value equipment and machinery much easier
    without the intervention of the owner. For though, this renting or sharing can
    even be applied to other scenarios as well. For instance, machine to machine sharing
    can be done using the blockchain and smart contracts. For example, one device
    can temporarily rent out its disk space to other devices. As blockchain enables
    micro payments. borrower device would pay the owner device for the section of
    the disk Space used. In simple words, every device will have its own account on
    the internet. And it can get compensated through these micro payments for lending
    its resources to other devices whenever required.


    # 46 Blockchain Application in Sports Industry


    ![](Images/image00133.jpeg)


    Athletes face a lot of hurdles when it comes to funding their training and participating
    in sporting events across the world. basic requirements such as sports equipment,
    cost of registration in tournaments, and travel costs are just a few of the challenges
    that these rising stars have to face day in and day out. They are always looking
    for a solution that can help them to deal with these unwanted hassles so that
    they can focus completely on the sports. blockchain can be a potential solution
    to many of these issues, that these burning sportspersons have to go through.
    A blockchain based platform can solve these athletes by enabling them to raise
    funds for the activities. This platform can act as an intermediary between the
    athletes and the potential investors.


    In this blockchain powered system, the athletes will be required to upload their
    profiles stating their current achievements and their future sporting plans. On
    the other side, sports fans and small investors can access these profiles of the
    athletes on this blockchain platform. On this platform, they will decide or select
    the player that they want to invest on. And they can also define the conditions
    for their investment for each individual player, as they also seek future returns
    from these investments. Verse all the terms and conditions are agreed upon by
    both the parties, a smart contract will be signed between them containing all
    of these terms and conditions. Additionally, through this platform, investors
    and fans can also contribute funds to teams or clubs, who have an active need
    of funding for their projects, doping scandals or undermining the integrity of
    many sports players. For instance, during the 2016 Olympic Games in Rio de Janeiro,
    hackers leaked medical records of several athletes and made these files public
    insert unwanted and unprecedented events. Many of the athletes had to face reputational
    damage, and many of them were forced to go through lengthy investigations. Their
    medical records were analyzed to discern what medications were administered to
    them, and whether there was a legitimate reason for administering such medications.
    In such situations, even if an athlete is officially cleared of the doping charges,
    a whiff of doubt still hangs in the air with reputational damaging effects on
    the athlete. blockchain technology could provide the required cybersecurity and
    prevent cyber fraud by securing the medical records of these athletes.


    The platform will also maintain fairness in the sports world by ensuring that
    even the whole federations don''t manipulate the data of the athletes to hide
    doping cases. This blockchain technology can ensure clean sports by helping in
    this fight against doping while respecting the privacy of the athletes. sports
    industry is grappling with the challenges posed by counterfeit sports goods. The
    online ecosystem provides a perfect breeding ground for counterfeiters to sell
    fake products. blockchain technology has the potential to curb the entry of counterfeit
    sports goods into the market. The complete information from raw materials used
    for manufacturing of sports goods, till it reaches the retailer would be registered
    on the blockchain.

