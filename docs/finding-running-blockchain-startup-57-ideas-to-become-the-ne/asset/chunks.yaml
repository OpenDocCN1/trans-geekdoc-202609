    ### Final Approval

    It costs approximately 2 billion dollars to develop a single drug. Not because
    the trips are unsafe or ineffective, many do not get approval. Blockchain technology
    has the potential to have greater impact on data sharing and tracking, even though
    the data provided is not sufficient to prove the effectiveness of the drug. A
    shared distributed ledger is able to record all data interactions during clinical
    studies. This will increase credibility in clinical research. Frauds can undermine
    efforts in clinical research, as they do in many other cases. Blockchain implementation
    would help to increase transparency. This will increase trust between patients
    and research institutions, as well as within research committees. Blockchain can
    track all events that occur in clinical research. Blockchain will prevent data
    falsification and beautification. The blockchain will record and timestamp all
    information such as the protocol design, sample size, method of administering
    the drug, and data collection and analysis.


    If the researcher wishes to alter the sample size or revise the protocol, this
    can be done at any stage of the study. This information will all be documented
    and accessible easily on the blockchain. Every transaction in clinical research
    will be recorded on the blockchain. This will allow researchers to better manage
    their data. It is compulsory to obtain the code consent from a patient before
    clinical trials can begin. Research protocols must also comply with regulatory
    guidelines.


    FDA estimates that around 10% of clinical trials involved consent collection issues
    stemming from patients failing to obtain consent in writing, unapproved forms
    or expired consent. The document folder reported that consent forms must be obtained
    in order to ensure patient safety. In 2016, a patient died from an analgesic overdose.
    An investigation revealed that the patient was not asked for reconsent before
    the medication was administered.


    If the protocol has been revised, even the patient must give their consent. All
