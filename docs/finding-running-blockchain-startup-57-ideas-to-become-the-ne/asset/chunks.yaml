    The shared ledger will allow patients to access all of this information. This
    will protect the rights and ensure patient safety. A `smart contract` will be
    executed every time there is a change to the protocol. The patient will receive
    a consent form for his reconsent. The patient will automatically be enrolled in
    clinical trials after he has given his consent. All stakeholders, including investors,
    researchers, regulators, and pharmaceutical companies involved in clinical trial
    funding, will now have access to the consent proof and re consent. Blockchain
    can be used to track all doctor visits. All clinical trial results have not been
    reported. With the introduction of blockchain, all such data will now be stored
    on the shared ledger and can be viewed by other researchers. Recruitment of clinical
    trial participants is a significant task that accounts for almost 1/3 of the overall
    timeline for a clinical study.


    ### Patient Recruitment

    Patients data are largely protected in isolated individual databases that have
    limited interoperability or transferability. This makes it difficult to recruit
    patients. Pharma companies must reach out to physicians individually to try to
    recruit patients. Insufficient patients can also make it difficult for clinical
