    为了未来的成功，你需要实施预测性、规范性和自适应性的解决方案。为了从这些数据中提取可操作的见解，数据处理过程中还有一个额外的的步骤。这些 IoT 公司目前并不具备数据处理技能。许多
    AI 和 ML 初创公司已经掌握了这套技能，但缺乏必要的数据集。它们尝试从能够获取的最小数据集中提取见解。现在明确需要一个中立且透明的平台，能够让 IoT
    设备制造商和 AI ML 初创公司创始人都能受益。一个无需信任、可靠且安全的区块链平台，允许数据无缝交易，这就是解决方案。基于区块链的去中心化数据市场有两个主要优势：首先，为
    IoT 设备制造商提供了一个持续访问的数据存储器；第二个优势是一个提供广泛可搜索数据的数据市场，包括 AI 和 ML 初创公司。在这样的市场上，来自 IoT
    设备的数据可以被不同方交易和使用。在上面的图中，你可以看到三个智能设备：智能音箱系统、智能手表和智能咖啡机。


    设备制造商将在用户许可下，将这些设备记录的数据发布到区块链市场上。随后，这些数据会被 AI ML 企业从数据市场购买。这些公司随后使用这些专业算法来获取实用的见解。来自智能咖啡机的数据可以用于获取人们对咖啡品牌的偏好以及对咖啡浓度的偏好。这些见解可以卖给其他公司，例如为当地服务的咖啡馆。数据也可以卖给咖啡生产者，让他们更好地理解客户偏好并向市场引入新产品。来自无线音箱系统的数据也可以用于了解某些地区居民的口味偏好。活动公司可以出售这些关于当地音乐口味的见解来增加收入，并为客户提供定制化体验。


    从智能手表生成的见解可以卖给当地不同的医院，医院可以利用此开展各种健康计划和诊断测试，以改善患者的健康。简而言之，这个市场可以从产生的数据中创建一个正反馈循环，从而为所有相关利益者创造双赢的局面。对于终端用户来说，收益是间接的，他们可能以同意在市场上存储和共享数据为交换，以更廉的价格获得
    IoT 设备。市场上共享的数据将由用户的同意及其地理位置适用的法律框架决定。客户为这些设备支付的费用将取决于他们对制造商在数据收集和共享方面提供的同意程度。


    通常，当你考虑任何收集、处理或共享用户数据的系统时，脑中就会产生对数据隐私的怀疑。你会开始对所提供数据的误用或滥用产生怀疑。但在这种透明可靠的系统中，市场上共享的每一个数据点都是经过许可的，在没有用户许可的情况下不会共享数据。与目前的情况不同，这种安全的数据市场将通过访问获得许可的用户数据，带来数据民主化。从而解决了当今
    Web 生态系统中的关键问题之一，即我们的大部分数据被 Google 和 Facebook 等科技巨头持有，并在我们不知情或未经许可的情况下分享给第三方。市场主要将有两种形式的数据：第一种是设备收集的原始数据；第二种形式是
    AI 和 ML 公司利用各种算法生成的处理数据。因此，一个用于交易这些 IoT 设备产生数据的去中心化且透明的市场，必将对 IoT 设备的普及产生积极影响。这样的市场具有提高服务质量和产品多样性的潜力，因此对终端客户来说也是真正的福音。


    # 40. 区块链在 KYC 中的应用


    ![](img/image00127.jpeg)


    了解交易对象是银行以及保险公司、交易所等其他金融机构最重要的工作之一。这些金融机构依赖 `KYC`（了解你的客户）流程，因为该过程为他们提供了安全感，且 `KYC`
    验证也确保了另一方的真实性。当客户打算与金融机构合作时（例如银行），`KYC` 流程就会启动，首先金融机构和客户对某些关系条款达成一致。然后客户向该机构提交所需文件，如身份证明、信用卡信息、公用事业账单等，以进行
    `KYC 验证过程`。在收到这些文件后，机构对其进行分析并生成认证，客户将被验证为可以享受服务或被拒绝服务。每当客户与任何金融机构建立关系时，该过程就会重复。


    例如，如果客户想在银行开户，他必须与银行交换文件并经过 `KYC 流程`。在收到他的文件后，银行对其进行了验证，之后他被允许在银行开户。但当他打算与其他银行（例如
    B 银行和 C 银行）合作时，他必须再次交换文件，并再次与 B、C 两个银行进行 `KYC 验证过程`。这些多次验证非常耗时，同时导致了 `KYC 验证`成本的不必要增加。因此，自然地，需要一种可以使
    `KYC 流程简化`的解决方案。区块链技术可以提供所需的解决方案，并在这种情况下充当单一事实来源。在实施区块链后，客户只需经历一次 `KYC 流程`，这些
    `KYC 信息和验证`将被存储在区块链上。随后，他可以将此 `KYC 验证结果`分享给他打算合作的其他金融机构。现在让我们详细讨论 `KYC 验证`将如何在区块链上进行。为了理解这一点，让我们回到我们的示例。如果客户第一次联系银行，银行将启动核心
    `KYC 验证过程`，客户与银行共享其文件，然后由银行进行分析。


    一旦银行分析了这些文件，它们将以数字签名文档的形式存储在 A 银行为该客户创建的`智能合约`中，这包含了对该客户进行的`核心 KYC 验证`结果，即通过或拒绝。该客户的这个`智能合约`还将持有未来将验证该客户
    `KYC` 的其他银行或金融机构的详情。此外，客户用于 `KYC 验证`的每份文件都存储在银行的本地数据库中。每当客户打算与 B 银行合作时，他可以分享其原始`智能合约`的地址、各种
    `KYC 验证文件`以及 A 银行的验证结果。B 银行保留的验证结果也将存储在`客户智能合约`中，从而该`客户智能合约`将包含他合作过的金融机构的完整信息。

