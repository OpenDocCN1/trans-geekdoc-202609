    to fix the latest identified issues or add new functionalities. These upgrades
    in the IoT devices are not secure, and are prone to hacking, which can result
    in a compromised network. This lacunae in the security can be used by any hacker
    to introduce a harmful update, instead of the proposed update by the manufacturer.
    This leading to a serious security breach. But with the implementation of the
    blockchain, the whole network can be made secure and robust.


    It is much easier to validate the authenticity of the software update was blockchain
    is introduced into the network. blockchain can further ensure that all the devices
    on the network are updated and are using the latest software version released
    by the manufacturers. The third critical issue that blockchain mitigates is identity
    management. every device on the IoT network is authenticated for satisfying its
    identity management requirement. During the authentication process, only trusted
    devices are added onto the network, and unsecured or unauthorised devices are
    rejected.


    Though current IoT systems don''t have a fool proof mechanism to enforce these
    measures. But with the implementation of smart contracts, this can be made fool
    proof, and much more robust. The fourth critical issue that blockchain mitigates
    his privacy. IoT devices in the smart home network generally capture sensitive
    and very personal data of the users. Therefore, permission handling process is
