    这将使得资金支出流动，同时也让监控政府运营的社会审计机构能够成为平台的一部分。他们将能够看到区块链上在任何阶段由任何机构更新的任何信息。区块链技术将确保没有人能通过伪造文件来利用此类计划。政府也曾向各国公民发放过类似的补贴。例如，政府向农民发放了用于农业生产的肥料补贴。这些补贴可能会因为腐败而被误用，而且并不总能到达预期的接收者手中。区块链技术也可以补贴发放提供透明度。它将确保农民和目标群体获得计划中的福利。


    # 23. 区块链在电子健康记录 (EHR) 中的应用


    ![](img/image00110.jpeg)


    个人的电子健康记录是非结构化的，由其医疗提供者通过中央数据库进行管理。这些数据库不具有互操作性、不安全，且容易受到黑客攻击。尽管几乎每个医疗机构都配有电脑，每个人口袋都有手机，但我们在与新医生共享、交换和收集病史时仍然面临困难。当今的医疗系统面临的最大挑战，是在保护患者数据隐私和完整性的同时，在不同医疗提供者之间共享医疗数据。虽然医疗系统可能没有在各处数字化，但许多医疗提供者仍使用纸质处方和图表。对于患者和医疗提供者来说，在需要时找到这些处方变得非常困难。


    医疗系统是一系列缺乏互操作性的孤岛集合。即使是同一医院内不同的医疗系统也无法相互通信。你可以看到医疗提供者系统之间必须交互的困难性。在紧急情况下，患者可能难以获取其临床史并将其与新的提供者分享。为了确定问题的确切原因，必须重新进行所有的诊断测试。这可能导致治疗延迟或病情恶化。医生在治疗急诊患者时，很难判断患者是否对特定药物过敏。


    这意味着他必须更加谨慎，并进行药物过敏测试以确认这一点。如果给患者使用了任何未经医生批准的药物，后果可能会非常严重。医院药房无法看到所有的患者信息。医院药房很难预测满足其医院需求所需的库存。在发生意外发爆发或季节性疾病时，药剂师可能会出现短缺。药物短缺也会延迟治疗，导致医疗提供者和患者转向替代药物。这降低了治疗的有效性。远程医疗的效果并不理想。在线咨询要求患者填写所有的病史信息。患者无法通过远程技术与提供者共享健康信息。由于大多数咨询和健康报告都是写在纸上的，远程医疗是不可能的。


    现在让我们看看区块链技术如何帮助解决这些问题。每个患者在区块链网络上将有一个个人身份。在患者护理各个阶段产生的所有临床数据都将与此唯一身份关联。区块链技术能够提供一个真正的互操作网络。任何咨询将由启用区块链的患者电子健康链进行。安全地包含来自智能设备的数据，可用于跟踪健康信息。这些
    `EHR` 数据可以在需要时轻松地在不同的医疗提供者之间共享。


    这些数据将添加到患者的任何诊断测试中。


    这可以通过消除冗余的诊断测试来降低医疗成本。这些数据可以用于提供更好的患者护理。区块链技术将允许个人保留自己的电子健康记录。然而，`smart contracts`
    将限制这些记录的访问仅供授权的医疗提供者。这些医疗数据将属于患者或个人。为了获取患者数据，医院和研究机构将需要加密密钥。患者可以选择谁可以查看其数据以及查看多久。个人可以预授权医疗提供者在任何紧急情况下查看其信息。个人还可以选择匿名披露其身份或匿名共享数据，或者以伪匿名方式共享。这些个人还可以决定其信息的哪些部分应与护理者共享。


    区块链上的电子健康记录一旦实施，将成为医疗行业的共同骨干。它将减少医疗提供者和医院的间接成本。这种透明系统将允许政府识别那些需要健康计划的公民。医院可以授予药房必要的访问权限和控制权，以保持所需库存的更新。这将防止医疗服务的短缺和延迟。在紧急情况下，医生被允许查看患者的病史。他必须执行所有要求的测试，这可能导致治疗延迟。


    区块链上的这种 `EHR` 让医生能够轻松访问患者的病史。它可以用于辅助治疗并降低医疗成本。通过区块链上的 `EHR`，医疗提供者可以获知任何过敏或药物不兼容的情况。目前的情况要求医生再次进行药物过敏测试，因为过敏药物可能会进一步恶化患者的状况。


    让我们来看一个例子来说明。例如，如果患者对青霉素过敏，并且发生了细菌感染，他将看医生。医生将获得患者的病史，然后开具另一种药物以避免青霉素。这将避免任何不必要的医疗错误和其他健康并发症。分布式远程账本技术（hyperledger
    technology）的使用对于远程监控和远程医疗的采用和运行也关关。如果患者无法看医生，他可以共享他的病历并远程接收医生的建议。远程医疗可以帮助减少就诊次数并节省时间。


    `IoT` 设备可以与区块链结合使用，提供患者体征测量的实时数据，如心率和血压。这将允许更好的诊断。这项技术将允许医生快速跟进，使他们更容易发现严重健康状况的早期迹象。这项技术对于无法容易获得优质医疗服务的农村居民也将是一个巨大的福利。这项技术也是改善医疗提供者之间合作的大机会。患者数据可以在他们之间共享以获得专家建议。这在患者同意的情况下是可能的。消费者健康变量如
    `Apple Health Kits` 和手表正在带来医疗消费化的新纪元。

    '
