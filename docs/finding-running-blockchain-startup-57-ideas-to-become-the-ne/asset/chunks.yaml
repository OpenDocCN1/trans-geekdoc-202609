  trans: '

    这种实时信息将减少办理入住时的等待时间，并提高客人的满意度。追踪客人的移动可能被视为对隐私的侵犯。区块链提供解决方案。通过区块链，你可以识别并授权酒店访问某些信息，而不会损害隐私。如果客到达酒店后发现预订的房间与描述不符，几乎没有什么途径可以申诉，特别是在已经预付款的情况下。酒店追回由于不听从的客人造成的损失的能力也有限。可以使用区块链技术创建预设的规则和条件——智能合约。如果发生纠纷，可以执行合约并为受害者启动适当的补偿。


    2017 年有约 5500 万人陷入酒店预订诈骗。这种诈导致了 60 亿美元的损失。然而，区块链技术可以帮助防止此类欺诈。区块链可用于验证预订是否来自真实的酒店。现在让我们来讨论区块链在餐饮业的潜在应用。食品欺诈有许多案例。想象一下，如果你知道食物的来源，将获得多大的满足感。餐厅是食品供应链的一部分。蔬菜和水果等原材料都是食品供应链的一部分。这些材料由农民、分销商和牧场批发商生产，然后被送到餐厅用于烹饪菜品。区块链技术允许你追踪食物的来源和路径。这项技术还将提高餐厅的质量控制和食品安全。特殊食材（如无麸质食品）可以让某些餐厅脱颖而出。目前，他们或消费者没有办法证明其真实性。餐厅可以在区块链上提供证明和来源信息，以与客户建立信任。如提到的，区块链技术可以用于验证网上关于餐厅的评论是否真实可靠。


    # 36. 区块链在人力资源 (HR) 中的应用


    ![](img/image00123.jpeg)


    人力资源管理是区块链将颠覆另一个领域。因为员工是技术和知识的关键载体，他们是任何业务的重要组成部分。人力资源对于任何组织的持续发展至关重要。组织在招聘之前，确保人力资源的真实性至关重要。每个求职申请者必须提交一份详细说明其整个经历的简历。这包括个人详情和教育背景。人力资源部门随后会检查这些细节。这是一个漫长的过程，因为人力资源部门必须验证简历中列出的个人资历。


    区块链将使申请人的整个历史在线化。这包括但不限于他的教育证书和获得的技能、参加过的研讨会和会议、联系信息，以及在之前机构的工作经验或晋升、评估、表扬或奖励。甚至包括离开这些组织的原因。组织在面试合适的候选人之前，可以从区块链获取其所有的过去信息。这将使他们做出更好的招聘决策。


    招聘新员工是一个乏味且漫长的过程。被录用的个人必须完成大量书面工作，包括提交之前的记录、签署录取协议和签署保密协议。书面工作和多次审批贯穿他的整个职业生涯。当他更换职位、部门或晋升时，必须经过多级审批。当他加入新组织时，必须再次经历整个流程。随着区块链的引入，潜在雇主将获得所需的所有信息。


    这减少了验证和确认员工所需的时间和精力，并简化了整个招聘流程。目前的情况让员工难以估计和计算年度税。合同工受高复杂性的影响更大。区块链可以让每个人的生活变得更轻松。这些智能合约可以作为会计系统为个人计算税费。这可以被区块链网络上的任何人（如税务部门）轻松审计和查看。共享账本可以记录员工的工资储蓄、捐赠和免税以及其他收入来源。根据共享账本，员工可以记录他们的收入来源并节税。税额将在预定义的时间自动计算并扣除，无需任何人工干预。


    大多数组织仍使用纸质员工协议。人力资源部门验证并维护这些协议是强制性要求。智能合约使得自动化一切变得简单。协议的所有条件都可以在智能合约中预设。当满足所有条件时，智能合约将自动执行。


    如果员工晋升或符合奖金条件，智能合约将执行并向该员工发送自动奖金或晋升指令。对于希望聘用合同工的组织，可以使用智能合约预定义工作条件。当满足条件时，智能合约将执行，合同资源将收到自动付款。


    区块链技术可用于生物识别数据存储（如指纹和虹膜扫描），员工的考勤也可以存储在共享账本上。区块链还允许员工追踪其工作产生的费用。员工将快速获得部门批准并报销费用。今天，员工必须经过多个利益相关者才能报销公费。这可能导致员工感到沮丧且流程缓慢。这也会降低员工的生产力，因为他们必须经过一系列忘记所需审批的人。由于区块链的透明性和不可篡改性，索赔可以很容易结算。这将减少员工的烦恼，让他们把宝贵的时间花在生产性项目上。


    在验证考勤和收到的任何其他记录后，财务和人力资源部门及时发放员工工资是一项重要任务。工资的所有条件将在智能合约中定义。这允许员工在每周或每月收到工资。


    区块链可以从合规角度验证物品来源的真实性。考虑一家接收药品原材料的制药公司。相关部门必须验证材料的真实性。使用区块链技术验证供应商发送了真实的原材料将更容易。药物制造后，他们必须跟踪所有的物流和交付细节。这是一个需要人工、电子邮件和电话的任务。区块链允许他们实时跟踪整个项目的进度，简化流程。任何想申请新组织工作的人都想了解其文化、工作伦理和声誉。他想知道加入组织后可能会遇到哪些困难，例如延迟工资、工作与生活的平衡、周末等等。

