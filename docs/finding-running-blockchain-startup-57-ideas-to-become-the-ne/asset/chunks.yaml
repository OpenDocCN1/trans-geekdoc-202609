- raw: "International shipments and international trade require a number of steps\
    \ and documentation to ensure a successful trade. Let's take you through the entire\
    \ process of international trade. Export haulage is the first step. This involves\
    \ the movement goods from the exporter or shipper to the warehouse of the freight\
    \ forwarder. A freight forwarder acts as a link between the shipper and exporter,\
    \ transporting goods from one place to another. Export hauls are usually done\
    \ with a truck, train, or both. Depending on the distance between the warehouse\
    \ of the freight forwarder and the exporter's premises, the time taken to export\
    \ the goods can vary from a few hours to several days. A freight forwarder inspects\
    \ the goods once they reach their warehouse to ensure that there are no damages.\
    \ Before the goods can leave the country, they must be cleared by customs authorities\
    \ from the destination country. The customs brokers usually perform this process.\
    \ They require the submission of cargo details, such as the Bill of Lading commercial\
    \ invoice and packing list Certificate of Origin declaration packing declaration\
    \ form and manufacturing statement. The next step is loading the cargo onto the\
    \ ship. The freight forwarder coordinates this. Once the shipment arrives in the\
    \ importers' country, authorities in the destination country inspect the customs\
    \ documents. This clearance must be done by the freight forwarder, or the designated\
    \ customs broker. The cargo is delivered to the destination warehouse with all\
    \ the necessary paperwork and carrier bills. The next step is to transport the\
    \ goods from the warehouse at the destination of the receiver. A freight forwarder\
    \ can facilitate this. In some cases, the consignee/importer may also be able\
    \ to pick up the cargo.\n\nThis is the same process for ocean and air freight.\
    \ Let's now see the problems that this sector faces. How can blockchain make international\
    \ trade easier? Tracking the progress of any shipment can be a complicated process,\
    \ which is susceptible to human error and fraud. Blockchain can solve this problem.\
    \ It records all shipping transactions in an immutable encrypted format. All parties\
    \ involved in international trade can have access to this information, including\
    \ importers and exporters. It is also possible to share it with customs authorities\
    \ in near real-time. Through blockchain, all stakeholders can have real-time access\
    \ to the shipment's status and whereabouts via the internet. The relevant parties\
    \ will update the blockchain at each stage of the transaction. All parties will\
    \ have instant access to this information.\n\nBlockchain can eliminate delays\
    \ in documentation, such as customs clearance delays. We have a lecture that explains\
    \ how blockchain can be used to facilitate customs clearance. This lecture will\
    \ explain how blockchain can be used in customs. 10 perishable items like vaccines,\
    \ pharmaceutical drugs, and chemicals, as well as dairy products, are safe if\
    \ they are kept at the right temperature. These goods can be affected by temperature\
    \ fluctuations, which can reduce their effectiveness and make them unfit to consume.\
    \ IoT sensors that measure the temperature of cargo and keep it updated on the\
    \ blockchain will be installed to accomplish this. Temperature fluctuations will\
    \ be also recorded on the blockchain.\n\nIt will allow the buyer to make sure\
    \ that the goods received are at the right temperature as per the manufacturer's\
    \ instructions and are working properly. Smart contracts will be implemented.\
    \ The cost of payments will decrease and manufacturers will receive shipments\
    \ more quickly. International trade is complex due to many factors, such as distance\
    \ and different rules and regulations within different countries. This complexity\
    \ is compounded by the difficulty of knowing the other side. Letters of credit\
    \ have become a standard in international trade. A letter of credit is a guarantee\
    \ from a buyer's bank that the seller will receive payment on time. If the buyer\
    \ fails to pay the purchase price, the bank will cover the entire purchase amount.\n\
    \nA company in USC wants to import goods from an Australian supplier. He needs\
    \ to pay the invoice in advance, but he is hesitant because he wants to be sure\
    \ that the goods he receives will meet his expectations. The exporter is also\
    \ reluctant to ship the goods as he cannot guarantee payment for the goods. The\
    \ importer's bank will issue a letter to credit promising to pay the exporter\
    \ once all documents are received from the exporter. Letters of credit are a great\
    \ way to reduce risk for both the exporter and importer. There are some issues\
    \ that can cause delays in payments to exporters. Letter of credit are assessed\
    \ based on trade documents and not on actual delivery or quality. Consequently,\
    \ disputes can arise between trading parties if there is a mistake in the terminology\
    \ or interpretation of compliance requirements. The letter further requires the\
    \ bank to make sure that all documents submitted by the seller comply with the\
    \ terms and conditions of the letter. The issuing bank must therefore carefully\
    \ assess whether documents provided by the seller conform to the letter of credit.\n\
    \nPayment delays can occur when there are errors in the data entered in the letter\
    \ credit contracts. This can be simplified by a blockchain-based system. A smart\
    \ contract can be used to issue a letter credit between the bank or seller. This\
    \ will guarantee payment to the seller. Blockchain's network consensus mechanism\
