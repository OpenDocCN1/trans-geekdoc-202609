    care. The doctor is not allowed to see the patient''s medical history in emergency
    situations. He must perform all required tests, which can lead to delayed treatment.


    This `EHR` on Blockchain allows doctors to easily access patient''s medical history.
    It can be used to aid in treatment and reduce medical costs. Through the `EHR`
    on Blockchain, healthcare providers can be made aware of any allergies or drug
    incompatibilities. The current situation requires that a doctor performs the drug
    allergy test again as an allergic medicine could further worsen the patient''s
    condition.


    Let''s look at an example to illustrate it. If a patient is allergic to penicillin,
    for example, and he develops a bacterial infection, he will visit a doctor. The
    doctor will have access to thepatient’s medical history and will then prescribe
    another medication to avoid pencilling. This will take care of any unwelcome medical
    errors and other health complications. The use of distance distributed hyper ledger
    technology is also critical to the adoption and operation of remote monitoring
    and telemedicine. If the patient is not able to visit the doctor, he can share
    his medical records and receive advice from the doctor remotely. Telemedicine
    can help reduce visits to the clinic and save time.


    `IoT` devices can be used with blockchain to provide real-time data about vital
    patient measurements, such as heartbeat and blood pressure. This will allow for
    better diagnosis. This technology will allow doctors to follow up quickly, making
    it easier for them to spot early signs of serious health conditions. This technology
    will also be a great benefit to rural residents who don''t have easy access to
    quality medical care. This technology can also be a great opportunity to improve
    collaboration between healthcare providers. The patient''s data can be shared
    between them to receive expert advice. This is possible with the consent of the
    patient. Consumer health variables such as `Apple Health Kits` and watches, Phil
    Pitts'' help Pence, and `Apple Health Kits` are bringing about a new era in consumerization
    of healthcare.

