    # **3\. Blockchain and IoT in Carbon Emissions**


    ![](Images/image00090.jpeg)


    Carbon emissions lead to change in the environment, which results in serious health
    consequences for us. According to the US Environmental Protection Agency, carbon
    emissions in the form of carbon dioxide make up more than 80% of the emitted greenhouse
    gases. These carbon emissions raise global temperature by trapping solar energy
    in the atmosphere. This in turn alters weather patterns and water supplies for
    the changes and growing season for food crops and threatens coastal communities
    as chances of floods increase with the rising sea level. rising sea levels can
    also cause saltwater to infiltrate some freshwater systems, thus increasing the
    need for desalination, and more vigorous drinking water treatment. In summary,
    it is very important to fight against global warming and reduce these carbon emissions
    for a better and healthier tomorrow.


    Sustainability initiatives are gaining momentum, as organizations are becoming
    increasingly interested in monitoring their business practices. And many companies
    have even started recognizing that sustainability is beneficial for all. sustainability
    initiatives are not only good for the planet, but they''re also a great way to
    boost the brand image as these initiatives are getting noticed and appreciated
    by both consumers and investors. Research shows that supply chains are often responsible
    for a large share of a company''s overall greenhouse gas emissions, with transport
    or shipping being the major culprit. In fact, the greenhouse gas emissions through
    supply chain is four times higher than the company''s direct operations.


    Let''s understand how carbon emissions are calculated in the current scenario,
    but these businesses and organisations, organisations first need to identify all
    the carbon emission sources like transportation, emissions from electricity consumption
    hbse emissions and from other business operations, then they''re required to calculate
    the emissions from these sources. This is calculated by first noting down the
    energy consumption by every individual process of the company, then this rating
    is multiplied by the standard conversion factor to calculate the carbon footprints.
    For example, electricity grid provides the emission factor taking standard amount
    of carbon dioxide that would be released when you use one unit of the energy.
    This value could be different for different rates. Similarly, every fuel has its
    own emission factor. And you can use this value to calculate the carbon emissions
    from different modes of transport, business operations, etc.


    For example, there are six conversion factors for calculating emissions from one
    liter of petrol or using one litre of diesel as a fuel. After calculating the
    emissions from all the sources, they are all added up to find out the total emissions,
    but the problems that companies face in calculating the carbon emissions to these
    methods maybe since the calculation of carbon footprints is a manual process,
    and requires human intervention, chances of errors increase. Besides this, it
    is a time consuming process. Moreover, it is an approximate method. As a real
    time carbon emissions are not calculated, but they''re calculated on the basis
    of fuel, electricity, etc consumed using the standard conversion factor for each
    different fuel or electricity used. Now let''s understand how blockchain and IoT
    sensors can solve this problem of calculating carbon emissions accurately.


    There will be two types of IoT sensors to calculate carbon emissions. First, IoT
    smart metre can measure power consumption by the companies. This will ease the
    pain of companies manpower to take readings manually, which can be prone to manual
