    这将使农户能够应对任何自然灾害。这可以通过在适当地点储存收获的作物来实现，使其免受自然灾害的影响。这还节省了保险公司的费用并保护了农户的作物。农民还可以通过
    `IoT` 提高产量来获益。`IoT` 传感器可以通过 `blockchain` 监测农田作物的生长、收获和产量。`IoT` 传感器可用于为农民提供作物灌溉需求、土壤湿度和人工施肥需求的实时更新。农民可以利用这些信息来实现作物产量最大化。农民还必须依赖商人来销售他们的产品。由他们设定订单价格和数量。结果是农民无法获得公平的收入份额。尽管他们是链条中最重要的一环，但他们也是食物的生产者。`blockchain`
    将允许农民与消费者和零售商建立直接联系。`blockchain` 将允许小农户组织起来并共同进入市场，而无需任何中间环节。


    农业供应链是复杂且不透明。产品在到达最终目的地之前会多次易手。农民无法确定他们的产品是在哪里以及以何种价格出售的。这种信息的缺失使农民容易受到交易人的控制，他们可以规定数量和价格。`blockchain`
    将允许农民实现供应链的透明化，使他们对产品获得公平的补偿。在目前的环境，消费者在购买有机食品时往往持怀疑态度。要判断一个标记为有机的项目是否真正有机是不可能的
    `blockchain` 允许真正的有机食品品牌脱颖而出。由于这些产品是可追溯的，消费者可以相信他们获得的是高质量的产品，且投资是值得的。


    目前，农民可能需要几周才能收到货款。然而，随着 `smart contracts` 和 `blockchain` 的实施，情况已不再如此。一旦买家接受产品，付款将自动完成。对于所有人的经济增长，安全且正式的产权至关重要。世界上许多农民无法获得土地所有权或土地界定。许多农民对其居住或工作的土地没有法律所有权。这是贫困的主要原因。土地登记依赖手写签名、纸质文件和人工劳动来登记土地权。土地登记过程容易受到欺诈和腐败的影响，贫农遭受了痛苦。少数欺诈者诉诸暴力或贿赂来声称拥有贫农的土地。土地记录被腐败，导致贫农无法获得土地或获得的土地更少。这导致他们的收入减少。`blockchain`
    技术可以解决许多此类问题，并提供一种不可篡改的土地登记方式。


    保护农民免受欺诈和腐败是可能的。农民将通过不可篡改、透明的土地记录解决任何未来的土地纠纷。每块土地的地理坐标将被唯一编码并存储在 `blockchain`
    中，以实现基于 `blockchain` 的土地登记流程。每处物业还将一个由土地所有者拥有的 `smart key`。`smart contracts` 可以与
    `blockchain` 结合以加速土地权利转移和其他相关交易。这将允许农民获得快速贷款，因为他们可以证明对土地的所有权。抵押品通常由贷款人持有。在全球范围内，农业严重依赖政府对灌溉、电力种子的补贴。这些补贴将以较低的价格提供给农民。例如，在印度
    2018 年的预算中，拨了约 49 亿美元用于为农民提供补贴。但一个问题一直存在：金额的百分之几达到了预期受益者？`blockchain` 可以帮助跟踪交付，每笔交易都透明地记录在
    `blockchain` 上。


    # 酒店行业中的区块链


    ![](img/image0122.jpeg)


    为了证明身份，一个人在办理入住前必须出示护照和其他文件。这将增加办理入住所需。所有文件都可以使用 `blockchain` 技术存储在 `blockchain`
    上。当一个人入住酒店时，他们可以使用生物识别验证其身份。这可以通过扫描面部或指纹来实现，以确认他就是预订房间的人。这将消除对证明文件的需求，并降低丢失的风险。酒店和客户可以创建一个
    `smart contract`。当客户在酒店预订了符合其需求的房间后，将执行一个 `smart contract`。资金将从客户的银行账户中扣除，并给他一个房间数字钥匙。到达酒店后，客户可以通过他的数字钥匙进入房间。在这种情况下，不需要从前台进行确认。这将缩短等待时间。`blockchain`
    还可以用于在完成酒店住宿后奖励忠诚积分。


    许多酒店提供忠诚积分作为奖励。由于应用范围有限，这些积分很少使用。今天，忠诚积分无法在任何具有相同忠诚计划的其他酒店连锁店使用。将这些积分与其他酒店连锁或业务整合非常困难。`blockchain`
    技术将存储令牌或忠诚积分。你可以使用这种共享账本技术与他人自由兑换、交易或交换你的忠诚令牌。你还可以在其他行业中使用你的酒店令牌。你的酒店忠诚令牌可以用于预订机票、购买餐点或购买咖啡。预订酒店时，在线上的虚假或审核评论也是一个问题。任何人都可以在这些评论网站上发布酒店评论，但他们不需要验证该人员确实住过那里。客户来说，验证这些在线评论的真实性和准确性非常困难。`blockchain`
    技术可以通过验证评论来帮助解决这个问题。这允许你验证那些离开酒店的人确实在那里住过。它也让查看在线酒店评论变得更容易。


    在长途旅行后，在酒店前台排长队办理入住可能是令人沮丧的。房间空闲有很多原因。其中一个可能是房间尚未清洁。也可能是由于验证文件花费的时间。`blockchain`
    可以帮助减少这种脆弱性。想象一家酒店可以追踪其客人，并知道他们到达酒店的确切时间。


