    因此，你可以看到区块链技术允许同一客户与不同的银行合作。虽然文档交换和核心 KYC（了解您的客户）验证过程只需要执行一次，但洗钱对银行来说是一个巨大的挑战，犯罪分子通过毒品交易、恐怖活动、逃税、酒驾驾驶、绑架等非法活动获取巨额资金。现在，为了躲避执法部门的检测，这些犯罪分子通过洗钱来营造一种他们从非法活动获得的资金源自合法渠道的假象。


    银行或金融机构在这些洗钱程序的某个环节被用于将黑钱转化为白钱。他们进行洗钱的方法之一是先将积累的非法资金拆分成较小部分，然后将这些较小部分存入不相关的存款人的账户中。因此，任何政府或金融机构都有义务建立一个监管框架，使个人难以将从非法活动获得的资金转换为合法资产。主流金融生态系统的开发方式包含了许多检查和制衡机制，可以防止洗钱，而“了解您的客户”或
    KYC 验证过程是这些机构在这一方面实施的最检查之一。但 KYC 验证过程面临最大的挑战是其增加的监管成本，由这些金融机构承担。事实上，据估计，金融机构在
    KYC 验证上的年度成本约为 6000 万美元。


    此外，由于金融机构在反洗钱和 KYC 规定方面的不当行为而被征的罚款增加了这些成本。这些费用约为 100 亿美元。此外，KYC 验证对客户来说也是一个耗时且痛苦的经历。幸运的是，区块链技术具有解决这一
    KYC 验证问题的潜力。如果所有金融机构都采用区块链，客户的 KYC 数据就可以以安全、透明和无缝的方式在金融机构之间共享。


    区块链对金融机构的收益是巨大的。具体而言，该技术能够创建一个按顺序去中心化的银行间账本，金融机构可以通过它验证已对客户进行的 KYC 验证结果，从而避免进行冗余的
    KYC 验证。此外，可以降低 KYC 成本并在与特定客户合作的金融机构之间按比例分。这项技术对监管机构非常有帮助，因为分布式账本提供了金融机构在与其客户合作之前经过的
    KYC 过程透明记录。


    # 41. 区块链在土地登记中的应用


    ![](img/image00128.jpeg)


    房地产在全球范围内一直是投资的获利领域。土地作为该类别中最昂贵的资产，经常是各种欺诈、犯罪和纠纷的焦点。所有证和契据是土地登记过程中不可或缺的一部分，为买家提供了必要的安全保障。但在许多国家，即使是这些土地所有证也不是证明物业所有权的万无一失的方法，这是因为土地记录维护系统不透明、无效且低效。在当前情况下，许多发展中国家的土地登记过程是高度人工化和纸质密集型的，因此导致效率低下并容易受到篡改的影响。此外，土地登记过程涉及多个政府机构的认证和验证。土地所有权的转移需要重复和复制相同的流程和文书，从而导致处理时间延长和成本增加。但有了区块链，整个过程可以被精简。


    这就是为什么它受到了许多政府的关注，因为它能够以透明、安全和防篡改的方式记录土地所有权、变更、数字化地图、空间数据和结算记录。现在让我们看看区块链如何适用于土地登记。首先，土地的地理坐标将进行唯一代码编码并记录在区块链中。每处房产还可以构建一个智能密钥，该密钥由该块土地的所有者持有。此外，智能合约与区块链相结合可用于加速土地权利转让和其他相关交易。让我们通过一个现实场景来理解：X
    先生想从 White 先生处购买一个物业。X 先生和 Y 先生将约定一个智能合约，在约定资金进入 Wise 先生账户后，物业权将自动转给 X 先生。账本上这种透明且即时的标题变化也将加速物业注册过程。


    结果，这将导致土地登记成本的节省和效率的提高。实施区块链记录物业交易也有助于更好、更有效的物业管理。因为交易和其他相关信息将几乎实时更新。基于区块链的系统将包括相关政府部门、卖家和买家在内的所有利益相关者带到一个平台上。每当在区块链上启动土地登记或权属转移时，所有利益相关者都可以查看具有分布式所有权的交易。因此，基于区块链的智能合约系统提供了任务权限和不可篡改的土地所有权层。


    # 42. 区块链在制药行业中的应用 第一部分


    ![](img/image00129.jpeg)


    信任是医学专业的基础。当我们就医时，我们信任医生的建议，并服用处方药，深信药物将帮助我们从疾病中康复。大体上，它们确实如此。然而，事实并不总是如此。你购买的药物实际上可能是假冒，外观与正品相似。一些诈骗分子出于个人利益和金钱，利用制药供应链中的漏洞将这些假药引入系统。在这节课程中，我们将学习制药行业今天面临的挑战。


