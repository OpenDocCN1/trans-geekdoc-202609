- raw: "Aviation is experiencing tremendous growth. A greater number of passengers\
    \ are choosing it over other modes due to the availability of low-cost carriers.\
    \ New aircrafts are becoming operational to meet this growing demand. A commercial\
    \ plane's average life expectancy is between 25-30 years. It can also change hands\
    \ up to six times along its entire journey before it is decommissioned. Because\
    \ of its long life expectancy, each aircraft has to go through complex maintenance.\
    \ Every plane is subject to regular auditing to ensure it is fit for flight. \
    \ \n\nIt is difficult to trace and track the maintenance information due to increased\
    \ aircraft ownership and multiple changes of ownership. According to some top\
    \ officials at these aircraft manufacturers, 90% of maintenance records are still\
    \ on paper. This means that there are tonnes of paper-based documents. Redundancy\
    \ and delays are caused by paper-based manual records. The worst case scenario\
    \ is an increase in accidents because it is difficult to access the data when\
    \ you need it. However, there has been an evolution from paperbased record keeping\
    \ to electronic record keeping. These electronic records still face many challenges.\
    \ Electronic records can be spread across many databases that lack interoperability.\
    \ This leads to inefficiencies in process, wasted time retrieving required information,\
    \ and an opaque system.\n\nLet's look at some of the drawbacks to the current\
    \ aircraft maintenance records system. These electronic records are usually stored\
    \ in centralized databases that can be manipulated. This data is stored locally\
    \ in each stakeholder's database. It becomes difficult to find the aircraft information\
    \ needed to understand it in the event of an accident or audit. The aircraft maintenance\
    \ authority holds the aircraft maintenance data. It is therefore very difficult\
    \ for manufacturers and air carriers to access or retrieve this data when they\
    \ need it. Blockchain can be a great way to secure these maintenance records.\
    \ The implementation of this shared ledger tech can help bring transparency and\
    \ trust to the currently opaque and vulnerable system.\n\nAll information about\
    \ an aircraft, including manufacturing details, maintenance reports and operational\
    \ as well as transfer of ownership, can be recorded onto the blockchain. The blockchain\
    \ can store all information. Smart contracts allow for seamless access to records\
    \ for all parties. Let's now look at how blockchain can be used to address these\
    \ problems in the aviation industry. The following stakeholders will be involved\
    \ in aviation blockchain: aircraft manufacturers, airline company and flight auditor,\
    \ buyer, maintenance repair and overhaul provider, and buyer. The blockchain will\
    \ allow manufacturers to record details about aircraft manufacturing. This could\
    \ include information on the manufacturing process, the hydraulic and air conditioning\
    \ components and any other parts that were used in the manufacturing ear. Because\
    \ of its immutable nature, data stored on the blockchain cannot be altered. The\
    \ lifespan of an aircraft is between 25 and 30 years. Therefore, it is crucial\
    \ that it remains in good condition. Safety of passengers and crew is paramount.\
    \ Maintenance, repair and overhaul (MRO) service providers manage the aircraft's\
    \ safety and maintenance.\n\nThey will need to upload information on the aviation\
    \ blockchain. This includes the last repair date of aircraft components, what\
    \ has changed, the amount spent on maintenance activities, and a tentative date\
    \ for next maintenance service. All stakeholders can access the information held\
    \ by MRO service providers, making the entire process transparent. A clear view\
    \ of data would prevent any mishaps, since all stakeholders could monitor the\
    \ aircraft's health at any time during its life. Every record stored on the blockchain\
    \ has a time stamp, which makes it easy to retrieve any historical records if\
    \ needed. This data can be used by airline companies to inspect cabins and other\
    \ components before the aircraft takes off.\n\nThe blockchain allows airline companies\
    \ to record flight logs, passenger information, and inspection reports. The next\
    \ stakeholder in this aviation blockchain is the flight auditor. The next stakeholder\
    \ in this aviation blockchain is the flight auditor. He will inspect an aircraft's\
    \ health and make a decision on whether it is fit to fly. He can either give the\
    \ aircraft permission to fly or ask for maintenance. It will be recorded on the\
    \ common ledger, regardless of the judge's decision. Each aircraft can be sold\
    \ five to six times in its lifetime, with a total cost of millions. It is not\
    \ surprising that a buyer would want to carefully evaluate all the components\
    \ before he buys an aircraft. It would be easier for him with the help of blockchain\
    \ to view the entire journey of the aircraft, and make an informed decision about\
    \ its price and whether to sell it or pass it along to others.  \n\nSmart contracts\
    \ can be used to automate maintenance tasks and check status. The maintenance\
    \ schedules for different components may differ depending on their operation and\
    \ operating environment. A component that has to operate in harsh conditions and\
    \ requires frequent maintenance may need to be maintained. This is in contrast\
    \ to a component which is only operational for one leg. This could be supported\
    \ by a blockchain ledger that contains information about the installation, operation\
    \ conditions, and utilisation of each component. It would also make maintenance\
    \ transparent and robust. We can safely assume that blockchain technology will\
    \ have a significant impact on the aviation industry, allowing for greater efficiency\
    \ and simpler regulatory compliances.\n\n# **10\\. Blockchain Application in Beauty\
    \ Industry**\n\n![](Images/image00097.jpeg)\n\nThis is something that many of\
    \ us have experienced, particularly those with sensitive skin. It is almost impossible\
    \ for a consumer to determine which ingredient is causing your skin problems and\
    \ should therefore be avoided. This can lead to you believing that the product\
    \ or brand you are using is not right for you. You might even compare the ingredients\
    \ of similar products from different brands. However, this won't help and you\
    \ will never know what ingredient caused your negative reaction.\n\nAlthough it\
    \ may seem strange, cosmetic products are not subject to FDA regulation. Cosmetics\
    \ are not regulated like drugs. They can be sold only after the manufacturer has\
    \ tested them and made claims about their safety and effectiveness. Even the ingredients\
    \ do not need to be submitted to the government. This is a fact check. 85 chemicals\
