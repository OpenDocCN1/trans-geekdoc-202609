  trans: '

    航空业正经历着巨大的增长。由于廉价航空公司的出现，越来越多的乘客选择乘坐飞机而非其他交通方式。新飞机正在投入运营以满足这种日益增长的需求。商用飞机的平均预期寿命在
    25 到 30 年之间。在整个寿命期结束之前，它可能会转手多达六次。由于预期寿命较长，每架飞机都必须经过复杂的维护。每架飞机都必须接受定期审计，以确保其符合飞行标准。


    由于飞机所有权的增加和多次所有权的更变更，追溯和跟踪维护信息变得非常困难。根据这些飞机制造商的一些高层人员介绍，90% 的维护记录仍然是纸质的。这意味着有数以吨计的纸质文件。纸质手工记录会导致冗余和延迟。最糟糕的情况是事故率的增加，因为在需要数据时很难访问。然而，记录方式已经经历了从纸质记录向电子记录的演变。这些电子记录仍面临许多挑战。电子记录可能分布在许多缺乏互操作性的数据库中。这导致了流程效率低下、检索所需信息时浪费时间，以及系统不透明。


    让我们看看当前飞机维护记录系统的某些缺点。这些电子记录通常存储在可以被操纵的中央数据库中。这些数据本地存储在每个利益相关者的数据库中。在发生事故或审计时，很难找到理解所需的飞机信息。飞机维护机构持有飞机维护数据。因此，制造商和航空公司在需要时很难访问或检索这些数据。区块链可以是安全保护这些维护记录的极佳方法。这种共享账本技术的实施有助于为目前不透明且脆弱的系统带来透明度和信任。


    关于飞机的所有信息，包括制造细节、维护报告以及运营和所有权转让，都可以记录在区块链上。区块链可以存储所有信息。智能合约允许所有方无缝访问记录。现在让我们看看如何利用区块链解决航空业的这些问题。参与航空区块链的利益相关者包括：飞机制造商、航空公司和飞行审计、买家、维修大修服务供应商以及买家。区块链将允许制造商记录有关飞机制造的细节。这可能包括有关制造工艺、液压和空调组件以及在制造过程中使用的任何其他部件的信息。由于其不可篡改性，存储在区块链上的数据无法被更改。飞机的寿命在
    25 到 30 年之间。因此，保持其良好状态至关重要。乘客和机组人员的安全是首要任务。维护、修理和大修（MRO）服务供应商管理飞机的安全和维护。


    他们需要在航空区块链上上传信息。这包括飞机组件的最后维修日期、更改了什么、维护活动的支出金额以及下一次维护服务的预计日期。所有利益相关者都可以访问 MRO
    服务供应商持有的信息，使整个过程透明化。数据的清晰视图可以防止任何事故，因为所有利益相关者可以在飞机整个寿命的任何时候监控其健康状况。存储在区块链上的每条记录都有时间戳，这使得在需要时很容易检索任何历史记录。这些数据可以被航空公司用于在飞机起飞前检查客舱和其他组件。


    区块链允许航空公司记录飞行日志、乘客信息和检查报告。该航空区块链的下一个利益相关者是飞行审计员。他将检查飞机的健康状况并决定其是否符合飞行条件。他可以允许飞机飞行，也可以要求维护。无论判断者的决定如何，都将记录在公共账本上。每架飞机在其寿命内可以出售五到六次，总成本数百万美元。买家在购买飞机前想要仔细评估所有组件，这并不意外。在区块链的帮助下，他将更容易查看飞机的整个历程，并对其价格以及是否出售或转让给他人做出明智决策。


    智能合约可用于自动化维护任务并检查状态。不同组件的维护计划可能根据其运行情况和运行环境而异。必须在严苛条件下运行并需要频繁维护的组件可能需要进行维护。这与仅运行一个航程的组件形成对比。这可以通过包含每个组件的安装、运行条件和利用情况信息的区块链账本来支持。它还将使维护变得透明且稳健。我们可以安全地假设，区块链技术将对航空业产生重大影响，带来更高的效率和更简单的监管合规性。


    # 10. 区块链在美妆行业的应用


    ![](img/image00097.jpeg)


    这是我们许多人经历过的事情，特别是对于那些皮肤敏感的人来说。消费者几乎无法确定底底是哪种成分导致了你的皮肤问题并因此应该避免它。这可能导致你认为你正在使用的产品或品牌不适合你。你可能会比较不同品牌的相似产品的成分。然而，这并没有帮助，你永远不知道是哪种成分引起了你的负面反应。


    尽管看起来很奇怪，但化妆品不受 FDA 监管。化妆品不像药物那样受到监管。化妆品只有在制造商对其进行测试并对其安全有效性做出声明后才能销售。即使是成分也不需要提交政府。这是一个事实核查。平均人每年使用六次的个人护理产品中含有
    85 种化学物质。其由于缺乏监管和复杂的供应链。不法之的人正在利用化妆品行业获取利润。制造商无法知道客户收到的是真品还是假货。


    客户无法判断他们购买的是否正品，还是为他们喜爱的美妆品的仿制品支付了离谱的价格。区块链具有追踪整个供应链中美妆品的潜力。美容行业的所有利益相关者，包括原材料供应商和零售商，都可以在数字账本上记录相关信息。信息包括生产日期、成分、物流、运输日期和时间、原材料真伪日期、保质期等。所有利益相关者（包括客户）都可以通过共享数字账本访问有关产品的所有信息。

