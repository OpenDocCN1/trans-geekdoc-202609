  trans: '

    一旦追踪到源头，通知所有人并下架来自此特定供应商、农场或地点的最新产品就会变得容易得多。这将允许零售商在确定问题前先下架该类别的食品，从而挽救许多生命并减少零售商的财务损失。让我给你们举一个区块链的工业案例。以沃尔玛为例。沃尔玛最近对其一家商店的一包芒果进行了追溯测试。他们花费了六天时间找到芒果的来源。而他们使用区块链时，仅用了
    2.2 秒就定位到了原始农场。这项技术对于食品行业极其有用且强大。它将实现食品召回，并降低消费者的风险。


    # 32 基因组学中的 32 种区块链应用


    ![](img/image00119.jpeg)


    人类 DNA 充满了信息。它类似于计算机，数据存储在二进制位中。人类生命的密码以四个字母 `GNC` 的形式存储。基因组是细胞中 DNA 的总量。这非常有用。它可以用于为个人设计个性化药物。近年来，基因组测序的成本大幅下降，促进了遗传学行业的发展。基因组测序的成本预计在未来几年内将降至
    100 美元。


    今天的基因组测序非常高效，可以同时对大量 DNA 进行测序。然而，在管理、存储和传输 DNA 中包含的海量信息方面存在挑战。


    研究人员还面临存储在公共数据库中的 DNA 信息的安全可靠性问题。区块链可以是一个解决方案。它可以帮助研究人员和公司传输和存储来自 DNA 测序的海量数据。区块链的高安全性使其抵御欺诈和伪造。那些贡献遗传材料的人的隐私是另一个关注的问题。


    另一个重要问题是：谁控制他的数据？理想的情况是，个人直接或通过医生、研究小组、证人和其他授权方等信赖人士对自己的数据拥有控制权。然而，在当今的情况下，个人的遗传信息在他们不知情的情况下被卖给了研究公司。公司通过出售遗传数据获取巨额利润。


    目前基因组测序的费用约为 1,000 美元。基因组测序公司存储数据，然后将其出售给其他生物技术和制药公司用于研发。区块链的实施将确保个人数据安全地存储在区块链网络上。需要遗传数据的数据买家（如研究人员、制药公司和医疗机构）可以直接从个人那里获得其遗传信息。数据库将为个人共享数据支付费用。这降低了
    DNA 测序的成本并增加了数据的安全性。这是许多公司（如 `Nebula genomics`）正在采取的方向。将使用智能合约来实现。数据买家将收到遗传信息，数据所有者将自动付款。


    目前的情况是可用基因组数据很少，因为没有多少人进行过基因组测序。研究人员、医药和生物技术公司在获取基因组数据方面面临巨大障碍。他们需要大量的遗传数据来对遗传性疾病进行研究。


    研究人员通常对随机数据集感兴趣。他们寻求具有特定表型（如疾病状况）的人的基因组数据。没有表型信息的基因组数据并没有大用。数据质量是他们面临的另一个挑战。收集的数据质量往往令人怀疑，因为它们通常是通过中人个人基因公司收集的，这些公司报告数据。来自多个来源的数据可能采用不同的格式并以不同的方式编码，使得数据买家难以将其转换为可用格式。数据买家可以通过区块链直接与个人连接。对于他们来说，通过区块链从个人那里获取表型和基因型信息将非常简单。研究人员将通过以标准格式存储基因组数据来节省时间和金钱。


    # 33 医疗保险中的区块链应用


    ![](img/image00120.jpeg)


    在当今的环境下，患者和医疗提供者发现很难从保险公司获得付款。由于医疗保险欺诈数量的增加，保险公司可能很难评估理赔的有效性。今天低效且复杂的医疗和支付系统是所有这些问题的根源。系统缺乏透明度导致了数百万美元的浪费和未解决的争议。任何医疗保险提供者在确定医疗理赔的有效性之前必须检查和分析大量信息。这是由于欺诈理赔的数量不断增加。提交理赔并获得批准的整个过程需要长时间且极其复杂。在提交理赔之前，医疗提供者必须完成大量的书面工作。


    这增加了人为编辑的可能性。某些字段很有可能没有正确填写，或者某些可能完全缺失。提交不完整会导致理赔被保险公司拒绝，医疗提供者不得不重新开始流程。这可能导致延迟和运营成本增加。有时，患者可能有一份旧的或过期的保单。目前的系统可能复杂，很难找到需要的信息。医疗提供者在提供服务之前检查患者的状态有时是不可能的。让我们来看一个现实例子来解释这一概念。史夫发生了一场事故，需要住院。史夫由医院照顾并在几天后出院。医院准备了理赔单并提交给史夫的保险公司。保险公司审核理赔请求并验证其数据库中患者的详情。在处理请求后，保险公司发现保单已过期并拒绝了理赔。


    在这种情况下，医院联系患者告知他们最新的医疗保险公司。为了向新保险公司提交理赔，这是必须的。再次，这可能需要很长时间。很多时候，医疗提供者和患者并不知道患者保单中涵盖的所有条件和情况。患者和医疗提供者都受到此影响。这导致了医院和患者在填写和提交理赔时浪费了时间和精力的。这意味着患者负责支付医疗账单。区块链技术可以成为缺失的环节并提供解决方案。当这项技术实施时，所有利益相关者都将访问相同的信息。这意味着将有一个事实真相版本，没有任何差异。

    '
