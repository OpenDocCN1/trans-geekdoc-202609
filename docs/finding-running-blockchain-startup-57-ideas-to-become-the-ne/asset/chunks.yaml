- raw: 'Define controlled conditions. Because unwanted change in the environmental
    conditions can change the perceivable characteristics of the vine. For instance,
    optimal temperature for storing white wine is between 13 to 15 degrees centigrade.
    And for red wine, it is between 10 to 20 degrees centigrade. But if the temperature
    rises above the desired range, it can deteriorate the wind quality and change
    its colour. In the current scenario, there is no effective method to ensure that
    the wind remained in its desired conditions. During its transportation, blockchain
    and IoT can offer a solution to this issue. IoT sensors can be attached to wine
    bottles and cartons, which can then capture the temperature of wine during its
    transportation and upload it on the blockchain.


    Consequently, any change in the temperature will also be recorded on the blockchain.
    Thus, through blockchain, each and every stakeholders can ensure if the wind state
    at its right temperature during its transportation, find ways have traditionally
    been bought based on the trust for a particular manufacturer or a brand. Although
    the buyer shells out a fair sum of money to buy a fine wine, but he himself has
    no means to validate if the wine has been aged properly under the desired conditions.
    During the ageing process of wine undergoes a series of different chemical reactions
    to improve its taste and quality.


    These reactions can easily be affected by physical and chemical changes taking
    place in appropriate for temperature and darkness during the vine maturation,
    of why should be kept at the dark conditions. Because the UV light can damage
    wine by degrading stable organic compounds present in it. Just as direct sunlight
    can negatively affect your skin, it can also damage fine minds. Another very critical
    factor for ageing of fine is temperature. The recommended temperature for ageing
    vines lies within 13 to 15 degrees centigrade. Though if temperature is increased
    maturation process speeds up but it causes undesirable changes in the vine as
    well. Therefore, it is very important to maintain the recommended temperature
    range for perfect maturation of the vine.


    The next important factor is humidity 60 to 70% humidity is essential to ensure
