    Let''s now look at the challenges facing our food industry. This industry is confronted
    with the greatest challenge: the complexity of the global food supply chains.
    It is almost impossible for retailers to determine the exact origin of the product.
    Despite strict quality controls and measures taken by retailers, food-contamination
    is on the rise. The consequences of eating contaminated food items can be severe
    once they reach the shelves of big retailers or supermarkets. This poses a threat
    to the customers'' health and is a serious problem for supermarkets and retailers.
    These events can not only cause huge financial losses but also lead to a loss
    of trust, loyalty and a decline in the reputation of retailers.


    It is also difficult to find the source of a particular food item to stop it from
    becoming a problem. To locate the item and return to its source, it takes much
    paperwork and effort. Everything is labeled as contaminated by the customer until
    then. Sometimes, the producer may have sent good quality food but had to temper
    it by another player or link in the supply chain. It can be difficult to pinpoint
    the point in the supply chain where the contamination or adulteration occurred.
    Fraudsters exploit these loopholes in the complex food supply chain to their advantage.
    They deliberately alter labels and substitute products for economic profit. Because
    they are organic, few food products are expensive. However, customers cannot verify
    if the product is organic.


    ### Food Fraud and Consequences


    Fraud can happen in the raw materials or in specific ingredients or in the final
    product. Food fraud can have many repercussions. They can cause damage to brands
    and financial losses for retailers. Worst of all, they can lead to poor health.
    Certain products are well-known or have a particular origin. The French label
    on a wine bottle might indicate that it is French. However, the wine''s origin
    is actually from Spain. This is a true story, as millions of Spanish prime votes
    were sold as French wine.


    This does not apply to this case alone. We can easily find other examples and
    anecdotes about food throats if we look around. One example of this is a case
    of food fraud in the UK in 2013. Horse meat was mixed with beef, and the combined
    product was labelled and sold on the UK market as beef. Chinese infant formula
    food was contaminated by chemical plastic called `mela mind` in 2008. This landed
    1000s of children in hospital. `Kopi Luwak` coffee has been claimed to contain
    70% fake `Kopi Luwak` coffee. It is also more expensive than regular coffee and
    is at high risk of being counterfeited. Honey consistently ranks among the top
    10 most popular food fruits because honey is one of those sugars that is more
    expensive than other forms. It is often added to sugar syrups such as `corn syrup`
    or `cane sugar` to increase its volume. The virgin olive oil we consume may be
    mixed with other oils, such as `sunflower oil` or `peanut butter`. Peanut oil
    can also be added to the olive oil to cause severe health problems for people
    with peanut allergy.


    ### The Blockchain Solution


    Blockchain technology can close these loopholes in food industry. The distributed
    ledger technology allows for a digital shared view of all transaction data that
    is available to all permission members within the food supply chain. Each transaction
    is permanent and recorded only after agreement among members. This technology
    helps build trust among consumers by allowing them to see the transactions in
    a transparent and immutable way.


    Let''s now see how this technology works to improve food safety for consumers.
    There are many people involved in food supply chain management. Eight of these
    stakeholders must record relevant information on the digital ledger. This data
    is permanent and can be viewed by all permission members of the network.


    #### 1. Farmers

    The farmers who produce our food are the first to be included in the supply chain.
    They must store the following information on the blockchain: the location and
    altitude where the plants were grown. The information they need to store on the
    blockchain is the location or altitude at which the plants were grown, as well
    as the growth conditions such as temperature, humidity, soil, fertilizers used,
    and other information like the date of harvesting, dispatching to the next chain
    link, and so forth. To prove that their food is organic or free from cruelty,
    they will need to submit a certificate.


    #### 2. Food Processing

    The next step is food processing, which transforms food products from food producers
    into products that satisfy consumers'' needs. This is also known as food manufacturing.
    This stage of food manufacturing can be either ready-toeat for consumers or used
    as raw material to make other products. They are required to keep digital records
    on digital ledger. These include data about their location, raw materials, sampling
    details and analysis of the food. Also, they must keep track of the date of manufacturing.


    #### 3. Distributors

    Distributors act as an intermediary between food processing companies, wholesalers
    and retailers. The processor sends the distributor pallets or cartons of food.
    The distributor distributes the food through different channels to end customers.
    These channels could be retailers or wholesalers, which then provide the food
    products to end consumers. This stage requires information such as receiving data,
    inventory details, dispatch date, and storage conditions. The digital letters
    must be able to record even the optimal temperature range and any other conditions.
    The retailer must keep track of the items received, inventory details and sales
    information in the ledger.


    #### 4. Consumers

    The final link in the supply chain is the consumer. He should therefore have the
    right to all information regarding the foot. With the blockchain technology, he
    can see all information recorded on the digital ledger during its journey. It
    takes only seconds to track the origin and authenticity of the food before the
    consumer can add it to his shopping cart. Each food product is assigned a unique
    identification number or `QR code`. This `QR code` can be scanned using a smartphone,
    or entered into the company''s website. The entire history of the food can also
    be tracked, right from the time it was produced until it reaches the shelves at
    the store. According to the Centre for Disease Control and Prevention, 48 million
    Americans are sick each year from eating contaminated food. From these 48,128,000,
    I was paralysed. 3000 people have lost their lives to this disease. It is crucial
    to identify the source of a foodborne illness as soon as possible. However, due
    to the complexity of the supply chain and fragmented information, the traceback
    process can be slow. This could lead to many people losing their lives. Blockchain
    makes it possible to trace the origin of any product within a matter of seconds.


    The retailer can track the serial number of the contaminated food shipment easily
    back to the distributor, and then to the original supplier. The supplier will
    then be immediately flagged on the Blockchain and all those who have sourced the
    food item from this supplier will be informed of the danger. This is a more relevant
    example than the recent romaine lettuce outbreak in 2018, which saw the latest
    contamination with at least 200 people in 36 US states. It even led to five deaths.
    The cause of the lattice becoming infected was contaminated irrigation water.
    They had to spend months trying to find the source of the problem. It would have
    been easier to trace the source of the problem if all information had been stored
    on a digital ledger.

