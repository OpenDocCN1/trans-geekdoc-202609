    to help refugees and have joined hands with UN agencies and other nonprofit organisations
    in a public private Alliance named ID 2020 in 2017. The mission is to help you
    and achieve the goal of providing a legal identity to refugees, and millions of
    other people who lack any officially recognised proof of their existence. blockchain
    technology can help in tackling such problems in a humanitarian crisis, where
    government documents and the bank account are prerequisites to get a job and lead
    a secure life.


    Nearly 22 point 5 million refugees need daily support from NGOs, other organisations
    and government of asylum countries. But these organisations have to face many
    challenges while distributing these aids to refugees. They need to track if the
    funds are located for refugees are getting used in a proper manner, and there
    is no mismanagement of these funds. The United Nations World Food Program has
    started using Ethereum blockchain technology to direct these resources to refugees.
    This technology can lower the chance of fraud that occurs in charitable funds,
    and can avoid mismanagement of funds as well. The refuges are given cryptocurrency
    based vouchers that can be redeemed in the shops responsible for providing them
    resources. This has been implemented in Jordan.


    The shops in Jordan that provide aid to Syrian refugees are using blockchain technology
    at the cashier counters to verify the identity of these refugees. The cashiers
    verify the refugees by using an eye scan software that scans the eyes of the person
    and if the person is found to be refuting the coupons can be redeemed and he''s
    provided with the required it. Moreover, the money spent on transactions for refugees
    will be recorded on the blockchain. Thus the organisations can easily track if
    the funds are being used in the proper manner.


    # **6\. Blockchain Application in Airlines**


    ![](Images/image00093.jpeg)


    Currently travelers are required to show their IDs at multiple checkpoints from
    entering the airport to luggage drop off to buying stuff from the duty free shops.
    Further, the long queues at security checking and border control checkpoints are
    some of the other key pain points that travelers have to go through. blockchain
    technology has the potential to simplify this process, and eliminate the need
    to shuffle your bag repeatedly for taking out IDs and various other documents
    for verification. Now, let us understand how will this work with blockchain based
    system, a user will be able to create his own digital ID completely controlled
    by him.


    In other words, he can decide who can view his information stored on the ID, and
    he can even decide what part of the information should be shared with any specific
    viewer. First, the user will be required to download the blockchain based digital
    ID creator app for uploading his personal verification documents like passport,
    visa, etc. and biometric data like fingerprints eyes can invoice. This data will
    then be uploaded on the blockchain, and a unique hash will be generated for the
    users information. Now this data will be sent to a government agency for verification.
    This agency will check and verify the user''s data against the central database
    and will either approve it or disapprove it. The verification status of the uploaded
    documents and ID will get stored on the blockchain.


    Now when a user needs to take a flight after reaching the airport, he can then
    simply go to a self checking security booth, where the user will be required to
    share his verified digital ID. After this, the user''s biometrics like the fingerprint,
    or facial recognition will be captured by booth and will be verified against the
    verified digital ID provided by the user. On verification, a QR code will be generated,
    which can be scanned by the user through his mobile app, and can be used in further
    rounds of verification done at the airport, thus saving him a lot of precious
    time and unwanted hasten to take out his passport and other documents again and
    again to verify his credentials. In case of international travel, the user can
    also share his verified digital ID with the border agencies well before his arrival
    dates. This will initiate the risk assessment in advance, and the actual process
    will be much faster and smoother when the user actually arrives at the border
    site.


    As their digital IDs government verified, the user can even be saved from the
    hassle of showing the passport. Now we will look how blockchain can be used in
    baggage tracking What comes to your mind when you think of travel, packing your
    bags and leaving for that vacation, you have been planning all month long. With
    your bags ready, you leave for the airport, thinking about the wonderful beaches
    that you will hit or the unconquered mountains you will conquer. But as you leave
    your bags at the baggage drop encounter, a slight sense of skepticism creeps in
    and you become slightly worried about your luggage carrying all your important
    stuff and gears. You just wish that it gets loaded on the right plane. And in
    case you have a connecting flight you''re concerned reaches to a next level. And
    all of this happens because you have no clear visibility of your own luggage.


    In the current system, there is no way to track your luggage even at a single
    point during your whole journey. The main reason behind this is the lack of data
    exchange among the parties involved in the luggage transfer. The responsibility
    for every luggage item changes repeatedly during the journey. And when the beggar
    changes hands, the relevant information is uploaded and stored in the respective
    local and private systems. This information stored in the local systems is not
    shared with other stakeholders, thus making the best reading of any language difficult
    and complicated.


    This is especially applicable to multi stop flights. Because an increased number
    of airports and authorities are involved in the luggage transfer, which in turn
    makes the data sharing really difficult and confusing, but very not blockchain
    based system has a solution for this. In a blockchain based system. That data
    stored will be secured immutable and accessible to all the stakeholders involved.
    Each bag will be marked with a unique code or number and each traveler would be
    given a corresponding unique number to track his luggage. When the bag moves to
    a security scanner or tracking system, that data will be uploaded and recorded
    on the blockchain. every stakeholder of the block You can track the entire journey
    of the baggage. Through this, every passenger can see the location of the bags
    in real time.


    This will give him a mental satisfaction that his bags have been loaded into the
    right plane, even during multi stop flights. Further, it will also fasten the
    tracking of last package. As every stakeholder will have a clear picture of the
    luggage, its last tracking point and the authority responsible for it. Thus, leading
    to a significant improvement in the customer experience for the flyers. loyalty
    points and air miles are some of the very crucial ways through which airlines
    tap repeated customers. But in the current system, customers have to wait until
    they have substantial loyalty points accrued in the account. Further, the usage
    of these points is limited to very specific places, which leads to a lot of points
    left unused or getting expired.'
