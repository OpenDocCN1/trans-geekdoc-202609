    # 1. Blockchain and IoT for Smart Healthcare


    ![](Images/image00088.jpeg)


    Healthcare is an essential part of life. And technology is disrupting this space
    day in day and out. The current technology in healthcare and general practice
    of medicine can get enhanced with the use of IoT systems. Let''s understand how
    these IoT systems and smart devices can enhance the healthcare services and create
    a positive impact on our health. IoT health devices have the potential to collect
    real time information of the patient and report this to the physician remotely.


    The IoT devices can collect information like blood pressure, heart rate, blood
    glucose level, etc, of a patient and store it on the cloud. And then this information
    can be shared with the authorized physician. This technology can save unnecessary
    clinical visits, can allow healthcare providers to provide better care to their
    patients, and can even facilitate remote consultation. Essentially, these devices
    can improve access to healthcare resources, while reducing strain on healthcare
    systems, and can always give people better control over their own health.


    Another important advantage of IoT devices is that emergency situations like heart
    attack can be analyzed by the healthcare professionals remotely. The healthcare
    providers can even get access to the patient''s profiles way before the arrival
    because of which they can deliver essential care to the patients on time. In this
    way, associated losses are reduced and emergency health care is improved. But
    there are certain challenges that IoT devices face.


    And we will now see how blockchain can help in overcoming these challenges. IoT
    smart devices capture data in real time and store this data on the cloud. The
    biggest challenge of storing data on a centralized and cloud system is IT security
    and privacy. patient''s data in such a scenario is susceptible to hacking, which
    can compromise his personal health information. The patient''s data can then be
    used to create fake IDs to buy drugs and can even be used to file fraudulent insurance
    claims. blockchain can provide the required solution to solve security issues
    faced by IoT devices, as the data stored on blockchain will be resistant to hacking
    and tampering. In case, multiple IoT devices have to be integrated, it becomes
    a challenge because different devices have different data communication protocols,
    and different processing power, which slows down the whole process, thus reducing
    the scope of IoT in healthcare. blockchain offers a solution for this, but because
    of the limited processing power of IoT devices, these can be directly connected
    to the blockchain.


    As high computing power is required for communicating with doctrine. There needs
    to be an intermediary, which can connect these IoT smart devices to blockchain.
    This intermediate system can be a cloud system, which has high computational power
    and can collect the data from sensors and transfer it to the blockchain. In this
    blockchain powered system, a person will get a unique ID map to the blockchain,
    he can specify who can see his information collected from smart devices. In case
    of multiple IoT devices, he can also choose the IoT devices whose data should
    be shared with the healthcare provider. IoT smart help variables like fit bits,
    help bands, watches, blood glucose metre recorded daily data and activities of
    a user like calories, step counts, miles, heart rate, quality of sleep, blood
    pressure, blood glucose level, etc.


    With blockchain technology, all this daily data from a user''s smart health devices
    can be clubbed with users electronic health records. These devices collect the
    real time data of a user and because of which doctor can see patient''s condition
    in real time. As data is a quiet continuously, there is no need to conduct all
    the tests when patient visits the hospital. This will reduce the costs of conducting
    basic tests and will save valuable time for both doctor and the patient. This
    could really be a boon for emergency cases, where providing timely treatment is
    the biggest challenge.


    # 2. Blockchain and IoT for Smart Homes


    ![](Images/image00089.jpeg)


    Won''t you like a smart coffeemaker that prepares a perfect coffee for you, as
    soon as you wake up, or a microwave that can differentiate between a perfectly
    cooked pizza from a bone pizza, or a smart air conditioner that can send a maintenance
    service request on its own, in case it breaks down. All of this sounds exciting,
    right? Many of you might assume it to be a thing of the future. But this technology,
    the Internet of Things, or IoT has arrived, and is staring right in our faces.
    It is just a matter of some more time before it gets adopted on a mass level.
    smartphones, or IoT enabled whose via smart devices can talk to each other are
    soon going to take over our traditional homes. It is estimated that by 2020, each
    American will have 15 devices connected to a Wi Fi.


    So it is very crucial that a safe, flexible and robust method is explored to make
    it more user friendly and reliable for the owners of these future smart homes.
    In these super connected homes, there will be many situations where you will want
    to give limited access instead of complete access of your home to the other party.
    For example, when you hire a pet sitter for paying a half an hour visit to feed
    and look after your dog. In such a situation, you would want him to access your
    lobby only and not the entire house. into this IoT enabled smartphones. This pinpoint
    access is not visible. We can give the complete access of a home to the sitter
    through our mobile app. But we can choose what devices or services he can access
    and what devices and services should be kept off limits for him. But with blockchain
    technology, this is feasible.


    A blockchain powered smart home will give more power and flexibility to the user.
    after implementing this technology, the user will be able to easily grant and
    revoke access to any of the smart devices in his home. He can take a decision
    on the accessibility of each IoT device separately, he can further decide the
    duration for which each individual device can be accessed by the third party.
    Because of the decentralised property of the blockchain, the accessibility to
    these devices can be granted or evoked dynamically from anywhere on the globe,
    and that too, in a safe and secure manner. IoT represents a technological advancement
    when multiple small devices RFID tags are interlinked and connected via common
    medium. Often different wireless communication protocols are used by these IoT
    devices to interact with each other, thus making them vulnerable to hacking.


    This vulnerability of these devices results in serious security and privacy breach
    challenges. These challenges can be classified under these major five heads, network
    security, identity management, trust, privacy and resilience. These security issues
    are a big pain point for the IoT devices. But with the implementation of blockchain,
    these issues can be mitigated, and the IoT networks can be made more secure, reliable,
    and robust. The first important issue that blockchain mitigates is trust. Each
    device on the IoT network is given a unique device ID, which is created through
    a smart contract. Similarly, each user on the network is given a unique user ID
    or user can revoke or grant access to every IoT device separately based on his
    requirements. With blockchain and smart contracts, all data exchanged by the individual
    devices on the network is recorded as a transaction on the shared ledger. For
    better clarity, let us understand it through a real life scenario. Jamie caught
    a new thermostat for a smart tool. When the device is added onto the network.
    The device is given a unique Id say th one. His cousin Robert visits his home
    for the weekend. But Jamie had to leave for a colleague''s party. He gives access
    of the thermostat to his cousin so that he can feel comfortable in his home.

