    # 国际贸易流程


    国际运输和国际贸易需要许多步骤和文件来确保贸易的成功。让我们带您了解整个国际贸易流程。


    ## 流程

    出口转运是第一步。这涉及将货物从出口商或发货人运到货运代理的仓库。货运代理充当发货人与出口商之间的纽带，将货物从一个地方运输到另一个地方。出口转运通常通过卡车、火车或两者完成。根据货运代理仓库与出口商场所之间的距离，出口货物所需的时间可能从几小时到几天不等。货运代理在货物到达其仓库后会进行检查，以确保没有损坏。


    在货物离开国家之前，必须通过目的国海关当局的清关。通常由海关行人执行这一过程。他们要求提交货物详情，例如`提单`(Bill of Lading)、`商业发票`(commercial
    invoice)、`装箱单`(packing list)、`原产地证书`(Certificate of Origin)、`报关单`(declaration)、`包装申报单`(packing
    declaration form)和`制造声明`(manufacturing statement)。


    下一步是将货物装上船。这由货运代理协调。一旦货物到达进口国国家，目的国的当局将检查海关文件。这种清关必须由货运代理或指定的海关行人完成。货物连同所有必要的文件和承运单被运送至目的地仓库。下一步是将货物从目的地的仓库运输到接收者所在地。货运代理可以提供此类协助。在某些情况下，收货人/进口商也可以自行提取货物。


    海运和空运也遵循相同的流程。


    ## 国际贸易中的区块链

    区块链如何让国际贸易变得更容易？跟踪任何货物的进度可能是一个复杂的过程，容易受到人为错误和欺诈的影响。区块链可以解决这个问题。它以不可更改的加密格式记录所有运输交易。参与国际贸易的所有方（包括进口商和出口商）都可以访问这些信息。还可以与海关当局实时共享这些信息。通过区块链，所有利益相关者都可以互联网实时访问货物的状态和位置。相关方将在交易的每个阶段更新区块链。所有方都能立即获取这些信息。


    区块链可以消除文件方面的延误，例如清关延迟。我们有一个讲座解释了如何使用区块链来促进清关。这节讲座将解释如何在海关中使用区块链。10 种易腐物品（如疫苗、药物和化学品）以及乳制品，如果保持在适当温度下，就是安全的。这些货物可能会受到温度波动的影响，从而降低其效力并使其不适合消费。将安装测量货物温度并更新在区块链上的
    IoT 传感器来实现这一目标。温度波动也将记录在区块链上。


    这将允许买家确保收到的货物根据制造商的说明处于正确的温度并且运行正常。将实施智能合约。支付成本将降低，制造商将更快地收到货物。


    ## 信用证

    由于许多因素（如距离以及不同国家之间的规则和规定），国际贸易非常复杂。了解对方的困难加剧了这种复杂性。信用证已成为国际贸易中的标准。信用证是买方银行提供的一种担保，确保卖方将准时收到付款。如果买方未能支付货款，银行将支付整个金额。


    美国的一家公司想从澳大利亚供应商进口货物。他需要预先支付发票款，但他很犹豫，因为他想确保收到的货物符合他的预期。出口商也不愿发货，因为他无法保证收到货款。进口商银行将开具信用证，承诺在从出口商处收到所有文件后向出口商付款。信用证是降低出口商和进口商风险的极佳方法。


    一些问题可能会导致向出口商付款延迟。信用证的评估是基于贸易文件，而不是基于实际交付或质量。因此，如果术语或对合规性要求的解释出现错误，交易方之间可能会产生纠纷。信用证进一步要求银行确保卖方提交的所有文件都符合信用证的条款和条件。因此，发行银行必须仔细评估卖方提供的文件是否符合信用证。


    ## 基于区块链的支付

    当信用证合同中输入的数据出错时，可能会发生支付延迟。这可以通过基于区块链的系统来简化。可以使用智能合约在银行或卖方之间开具信用证。这将保证卖方获得付款。区块链的网络共识机制确保在任何时候只有一个版本的信用证草案。所有方都可以根据其访问权限查看并处理该版本。在经过出口商批准后，该版本已通过审查并接受。当签署信用证时，出口商与发行银行之间的合同即告建立。所有参与方现在都可以访问信用证流程。如果有任何差异，他们可以快速标记并解决。由于与货物相关的所有文件都在区块链上，他们也能看到。如果满足了所有条件，智能合约将执行，出口商将立即获得付款。通过海运或空运国际移动的货物涵盖运输期间的任何损失。


    ## 货运保险

    尽管这是一个复杂的过程，区块链已帮助解决了许多问题。区块链可以为货运保险带来许多益处，并使其更加愉快。区块链将允许所有方和保险公司连接并共享分布式账本，记录货物损失和货物暴露于不利状况的数据。货物将配备
    IoT 传感器，并将任何有关货物损失的信息上传到共享账本。如果货物沉没或加热超过设定温度，可能会损坏。所有这些信息将存储在区块链上。保险公司能够更好地评估和计算保险理赔范围。区块链。所有参与方（包括保险人）都可以访问与货物相关的所有文件。这将使任何理赔变得更容易。


    # 39. 区块链在 IoT 数据市场的应用


    ![](img/image00126.jpeg)


    如今 IoT 设备产生了大量数据。同时有多个设备。机器学习和人工智能在我们周围变得日益紧密，使产品和服务更加智能、更具个性化。数据是这些技术背后的动力。IoT
    设备制造商没有管理如此海量数据的技能。另一方面，基于 AI 和 ML 的公司正在寻找更多的训练数据来帮助他们创建更好的解决方案。IoT 设备制造商正在使用云解决方案来存储他们的海量数据。为了顺应未来潜在想法的浪潮，他们甚至使用商业智能工具和商业服务来增强这些数据。


