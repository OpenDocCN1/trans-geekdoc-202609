- raw: 'In fact, carbon trading approach has been initiated through blockchain with
    an intention to control pollution level by providing incentives to the companies
    achieving emission reductions. In this case, a carbon credit will be given to
    all organizations that grants a business to emit a certain amount of carbon emissions.
    All of these carbon credits would be maintained on a blockchain. These carbon
    credits on the blockchain can even be traded between two companies. In such a
    system, any transaction of carbon credits between the companies will be recorded
    on the digital ledger in a transparent and immutable manual.


    For the well carbon credits will be transferred from one company''s account to
    another automatic payment will be done to that company in return for these carbon
    credits using smart contracts. Say for example, there are two companies A and
    B, which have their own carbon permits. If Company A is under its carbon cap,
    and Company B is over its carbon cap, the company a can sell its surplus carbon
    credits to Company B, who seeks additional carbon credits for the carbon emissions.
    This can be a way to incentivize companies with low carbon emissions, and it can
    become a second revenue stream for these companies.


    The second advantage of carbon trading is that it will encourage the organisations
    to adopt carbon friendly energy practices that can reduce the carbon footprint.
    In fact, IoT sensors can be attached to vehicles that can track the real time
    carbon emissions from these vehicles. And this information can then be stored
    on the blockchain to ensure a better and safe environment. If carbon emissions
    exceed the stipulated limit, the smart contracts will get executed and an alert
    will be sent to the respective person or department. In every country, carbon
    emission norms are regulated by the respective pollution control regulatory body,
    vehicles are checked for the emissions. And if emissions are within a specified
    limit, a certificate is issued to the vehicle, which generally comes with an expiry
    date. However, this system has its own loopholes, the system only checks for the
    emissions of the date of the test.


    Also, the emissions from vehicle might change based on the age and condition of
    the vehicle. Other factors like adulteration of fuel, etc, might increase the
    pollution temporarily to an unacceptable level. Therefore, if IoT carbon sensors
    are attached to the vehicles, and information about carbon emissions is stored
    on the shared ledger, it will help regulatory bodies to keep a better track of
    carbon emissions by vehicles. The regulatory body can even issue warnings to vehicle
    owners whose carbon emissions exceeded the stipulated limits. In this way, our
    strict pollution check regime can be implemented and a concrete step can be taken
    towards a healthier environment.


    # **4\. Blockchain and IoT in Logistics**


    ![](Images/image00091.jpeg)


    In any supply chain, managing the transportation of products is a challenging
    task. Sometimes materials are improperly ship, which can result in sensitive products
    getting damaged. The success of any logistics company lies in the effective inventory
    management, warehousing, fast delivery and taking care of safe storage of the
    goods. Enter IoT and blockchain these technologies are ready to revolutionize
    the logistics domain, the transportation of food, chemicals and pharmaceutical
    drugs request temperature control, a strict predefined temperature is required
    to preserve the desired qualities of these products. Any fluctuation in the temperature
    can decrease the effectiveness of these products, and in some cases, can even
    make them unfit for consumption. Human error is the leading cause for mishaps
    but temperature fluctuations.


    Some of these errors are as called if the temperature sensitive container was
    to be shipped in the morning, but the shipment got delayed to late evening. This
    delay can cause unwanted fluctuations in the temperature. If in the packaging,
    the lid of the product bottle is not properly closed, it can cause the inside
    contents to get exposed to high environmental temperature. If the frozen packs
    are not compactly packed, leaving enough space between the product packings the
    products can melt in transit because of uneven cooling and getting exposed to
    higher temperature fluctuation in the temperature of the cold room can damage
    the pharmaceutical products in case the temperature falls below the acceptable
    temperature, thus reducing the effectiveness of the products.


    In a blockchain and IoT based logistics system, the product package will have
    two components. The first component will be a unique number assigned to the product
    package, which will be registered on the blockchain. Whenever the packet changes
    hands, the information will be recorded on the blockchain does the complete journey
    of the product from manufacturer till it reaches the customer will be recorded
    on the blockchain. The second component will be IoT temperature sensors, which
    will be attached to the package. These sensors will record the temperature of
    the product during its transportation and this information will be recorded on
    the blockchain. Besides any fluctuation in the temperature, will also be recorded
    on the blockchain. And an alert will be sent to all the relevant stakeholders
    involved in the supply chain.


    These IoT sensors can also monitor humidity conditions and physical shock in the
    storage area of the shipment. Subsequently, all the concerned stakeholders will
    be able to track this complete information on the blockchain, and then use this
    information to notify the Trump drivers and shippers of damaged shipments long
    before the arrival premise and ask for a new and undamaged shipment. Other IoT
    sensors that can be used during the transportation are those that can sense the
    location of the shipment and register that on the blockchain, thereby informing
    all the concerned stakeholders about the real time location of the shipment.


    These IoT sensors attached to shipment can even improve the supply chain security
    and protect the shipment against theft by detecting anomalies like root aviation,
    hijacking or tampering. The whole information will get registered on the blockchain,
    and we''ll send live alerts to the stakeholders involved. Most companies rely
    on enterprise resource planning or MRP software to support their business and
    supply chain inventory needs. The combination of IoT with DLP software''s can
    add business value by providing real time data, which can give existing earpiece
    real time visibility into the inventory of products and services. When this whole
    information gets adjusted on the blockchain, the manufacturers can have real time
    updates about the inventory of the enterprises, and therefore real time orders
    can be placed on the basis of predetermined conditions. In such a scenario, enterprises
    will receive the shipment without any delay, and thereby preventing any loss of
    sales. Thus, in turn, enhancing the customer experience for these enterprises.


    # **5\. Blockchain Application in Aiding Refugees**


    ![](Images/image00092.jpeg)


    Blockchain technology has a great potential in helping refugees as well. Many
    refugees who are forced to abandon their homes and countries don''t carry and
    doesn''t have access to important documents like birth and marriage certificates,
    passports, ID cards, etc. In short, they don''t have any document to prove their
    identity. While staying in asylum countries, it becomes difficult for refugees
    to get a job or to attend a college for higher education, as they have no means
    to verify their identity. Imagine a scenario where all these documents are present
    on the shared distributed ledger. These documents can never be forged or tampered,
    and the person can access them from anywhere in the globe. The situation of refugees
    in such a case will be much better than it is in today''s scenario.'
