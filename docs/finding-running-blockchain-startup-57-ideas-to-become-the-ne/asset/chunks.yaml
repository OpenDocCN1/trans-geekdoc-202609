    造假者只是在模仿发展中国家。缺乏足够的监管和执法是促使造假者制造假药的原因。即使在发达国家，对假药的惩罚也不足且被忽视。透明度的匮乏以及农产品供应链的整体复杂性，使得假药极易进入市场。


    # 43. 区块链在肉类行业中的应用


    ![](img/image00130.jpeg)


    由于鸡蛋价格廉廉、易于处理且富含蛋白质，鸡蛋消费日益增加。因此，随着对鸡蛋和鸡肉需求的增加，禽养殖的增长也能得到吸收。然而，鸡蛋和鸡肉的质量仍然是消费者关注的问题。为了获得更好的鸡蛋和鸡肉质量，需要进行更好的禽类生产。此外，与蛋和禽类相关的污染爆发是食品行业面临的一个大挑战。最近，2018
    年 4 月，来自卡罗来纳州某农场的 2.07 亿个可能受细菌污染的鸡蛋被召回。消费者在购买鸡蛋和鸡肉之前，心中会有疑问，例如：鸡在哪里以及如何饲养的？鸡在整个生命期间接受了哪些联邦抗生素和疫苗？它是放地饲养、无笼饲养还是在笼中饲养的？甚至是夜间牲收的位置。鸡在哪里加工的？最重要的是它是否符合食用标准。肉类行业涉及的所有利益相关者都将注册在区块链上，他们将根据要求在共享的不可篡账本上记录相关信息。


    这条供应链始于生产者，生产者必须提供此类信息，如牲畜农场的位置、蛋的孵化日期、给鸡的抗生素。其他细节如它们是放地饲养还是无笼饲养，以及鸡发往宰宰场的日期。为了更好地生产农产品，应对禽类进行妥善管理。因此，生产者必须维护禽类适当的体重，并关注其生长速度和饮水量。应通过
    IoT 设备采集的体温来评估禽类的压力水平。从疾病管理的角度来看，有必要识别病鸡，并在整个群受到影响之前将其隔离，因为疾病可能会在消费者了受影响的质量产品后也传染给人类。生产者还需提供证明其妥善管理禽类的证书。


    接下来是处理鸡和鸡蛋的加工商。他们随后需要提供信息：宰杀地点、包装和标签地点、加工禽类产品的存储条件、保质期以及发往下一个环节的调度日期。在此阶段，产品将获得一个唯一的识别码。由于鸡肉是易腐产品，在运输过程中需要保持低温以防止变质。IoT
    传感器将安装在包装上，感知产品温度并将其记录在区块链上。零售商从分销商处接收这些产品并将其卖给终端消费者。零售商将需要在账本上记录收到的物品、库存详情、存储详情和销售信息。消费者是食品供应链的最后一个环节，他们消耗这些食物，因此应该有全权了解有关食品的详细信息。


    通过区块链，消费者可以在购买前了解有关肉类的所有信息，如其健康状况、生活条件和加工细节，带给消费时只需通过智能手机发送唯一编号，即可获得他一直想知道的所有信息。产品的来源信息也可以在区块链上获取。甚至禽类的运输条件也会出现在区块链上。有了所有这些信息，他可以轻松验证自己购买的产品是否符合食用标准。


    # 44. 区块链在电力行业中的应用


    ![](img/image00131.jpeg)


    电力是另一个区块链将产生颠覆性的领域。基本上，它将改变电力的存储、分配和交易方式。让我们来了解区块链与电力行业结合的影响。区块链技术可以作为点对点（P2P）能源交易的理想平台，人们可以将从太阳能或风能等可再生能源产生的电力卖给他们的同伴或邻居。在目前的情况下，能源在集中发电设施中生产，然后通过能源公司运营的布线配电网络输送到工业和家庭使用。但通过区块链和智能合约，任何人交易和供应从可再生能源产生的能量将是可行的。在这个提议的系统中，将使用智能电表来测量产生和消耗的能量。这种基于区块链的系统中的能源交易活动通过智能合约执行。


    此外，将根据向能源购买者提供的能量向能源供应商自动支付。为了更好地理解，让我们来看一个现实场景。假设某人在家里屋顶安装了光伏太阳能电池板。这些光伏设备利用太阳能发电，如果产生了剩余电量，它将存储在微电网中。这些存储的剩余电量可以卖给同伴或当地企业。所有的能量交易都将在区块链上进行管理和存储。为了让这个系统运行，需要智能电表，它将记录产生和消耗的能量。根据消耗的能量，电力购买者将触发向供应商的支付，从而为可再生能源的点对点交易创造了一个完美的生态系统。为了更好地普及电动汽车，拥有易于获取和方便使用的充电站至关重要。许多电动汽车的前景者担心在长途通勤中，在没有电动汽车充电器的地方电池电量会耗尽。与传统燃料站相比，电动汽车充电站缺乏易的可用性往往是车辆购买者的关键决定因素之一。尽管人们正投入大量努力增加商业电动汽车充电站的数量。


    但在拥有足够的商业电动汽车充电站之前，还有很长的一路要走。但使用区块链作为替代解决方案正在实施。为了解决充电基础设施缺乏的问题，基于区块链的应用程序允许个人共享他们的私人电动汽车充电。通过点对点电动汽车充电平台，私人所有者可以在他们未使用时将充电设施向公众开放。作为回报，他们可以通过增加闲置充电的利用率来获得额外的收入。通过这些基于区块链的应用程序，电动汽车驾驶员可以寻找附近的可用充电处，并在电量耗尽前为汽车充电。


    # 45. 区块链在共享经济中的应用


    ![](img/image00132.jpeg)


