    it works through tuna fish tracking. `Blockchain`, `RFID tags` and `QR codes`
    can all be used to track and analyze the tuna fish''s journey from the bait to
    the plate. Once a tuna fish is caught, tracking of his movements will begin. A
    reusable `RFID tag` with a tracking number will be attached to the fish once it
    is aboard the ship. These `RFID readers` will also be installed at the port and
    at the processing plant. These devices will read the `RFID tag` information and
    upload it to the `blockchain`.


    After processing, the `RFID tags` will be removed. Instead, `QR codes` that are
    less expensive will be attached to the packaging. Each `QR code` will link to
    the specific fish''s information and the `RFID tag`. The `QR code` can be used
    by the customer to track the whole fish from the moment it is caught to the time
    it is served to him. `Blockchain` technology has the potential to make fish catch
    more transparent and traceable. Consumers can refuse to purchase illegally caught
    fish, or fish caught by slave labor. It won''t stop illegal fishing by itself.
    It will however make illegal fishing activities visible and possible to be taken
    action. to monitor and verify that there isn''t human trafficking. These NGOs
    can partner with local trusted and supported NGOs to capture and upload these
    conditions to the `blockchain`. The fraudulent food labelling is another critical
    problem facing the seafood industry. A report by a marine service organization
    found that one third of all seafood products sold in America was incorrectly labeled.
    The question is how can you ensure that the high-priced Atlantic salmon you bought
    last night under the wild quote was not just a tip, but a farm-grown salmon? To
    make more profit, deeper fish are labeled as being more expensive to ensure they
    get more fish. `Blockchain` allows a consumer to track the entire journey of the
    fish and ensures that any seafood or fish he buys is exactly as it says on the
    label. Additionally, fish can become unfit for human consumption if it is kept
    at a higher temperature than the recommended range. It can also become a breeding
    place for harmful bacteria at these temperatures. These additional details, such
    as temperature and temperature sensor attached to fish, can be logged by the sensors.
    `Blockchain` is also available. The unique `QR code` found on fish packaging can
    be scanned by the end consumer to verify that the fish was kept at the specified
    temperature throughout its chain. Buyers can also verify important information
    about the fish, such as its species, weight, harvest location, date and time,
    identity of producers, and how the seafood was handled. These data points must
    be stored and captured on the `blockchain` at all points in the supply chain.
    It is clear that blockchain can disrupt the fishing sector and make it more sustainable,
    transparent, and environmentally friendly.


    # 31. Blockchain in Food Safety


    ![](Images/image00118.jpeg)


    Is that food package labelled organic because you just bought organic? Is it a
    marketing trick to make you pay more for regular food by changing the label? Our
    food supply chain is constantly at risk from adulteration, which is affecting
    many people''s lives. There is no way to pinpoint the source of the problem. One
    in 10 people becomes a victim of contaminated food every year. This results in
    approximately 420 000 deaths each year. This class will examine the current challenges
    facing our food industry. We will also examine how blockchain can disrupt the
    industry and change the way it works.

