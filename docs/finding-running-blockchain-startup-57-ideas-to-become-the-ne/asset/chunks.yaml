    所有基于区块链的系统颁发的证书将保存在区块链上。在钻石出售之前，每笔交易和流程都将记录在区块链上。通过区块链技术，可以创建关于钻石历程的永久、不可篡改的记录。客户也可以轻松检查钻石上的唯一识别码，以验证其真实性和产地。就像钻石一样，区块链可以用于验证宝石和黄金的真实性。这允许您追踪这些珍贵金属的整个历程和产地。


    # 数字广告与营销中的 20 个区块链应用


    ![](img/image00107.jpeg)


    欺诈、不透明和过时的支付方式是数字广告面临的一些巨大挑战之一。由于数字广告行业缺乏透明度，广告商总是担心代理机构如何使用他们的资金。他们并不知道钱流向了哪里。他们不知道花费的广告费是否为他们带来了任何实际收益。广告被浏览这一事实本身并不意味着用户真的看到了它们。许多企业依赖这些点击和浏览量生存。


    这些“僵尸”被程序化为模拟真实用户的行为，以增加广告曝光率。广告商迫切希望找到一种透明高效的方式与潜在客户建立联系。了解传统数字广告的基础知识对于更好地理解拟定的解决方案至关重要。广告商（或希望接触客户的品牌）聘请数字代理机构来管理其广告活动。该广告活动旨在为品牌实现特定的目标。


    品牌支付费用让代理机构向其客户创建并分发数字广告内容。非工作支出是用于创建广告内容的资金。而用于分发广告内容的资金在数字广告中被称为“工作支出”。在创建广告内容并获得品牌批准后，代理机构接管控制权。内容被批准后，代理机构购买广告位或广告库存。将数字内容发布在目标受众消费的地方。广告机构可以直接从发布者处购买广告位，也可以通过中间商购买购买。发布者网站也可以是数字杂志或新闻网站。该协议适用于目标受众所在的网站。他们还可以通过广告交易平台（Ad
    Exchange）购买广告空间。


    广告交易平台列出库存和发布者，然后由这些广告机构购买。广告交易平台上的库存列表通常根据广告商的实时竞价进行分配。程序化购买（也称为购买这些广告位的实时竞价）在技术上被称为程序化购买。这一过程涉及一条很长的中间商链，特别是在程序化广告供应链的情况下。在示例中，供应链包含了广告机构、交易台需求平台、广告交易平台、供应侧平台（SSP）、发布者以及受众。由于这条供应链的存在，很难获取有关品牌在广告上支出的信息。链中的不同节点会收取隐藏费用、存在欺诈，且对流量的真实性缺乏透明度。一份行业报告显示，55%的程序化广告资金流向了中间商和技术平台。发布者仅获得资金的
    45%。


    品牌在程序化广告平台花费的资金中，自己只获得了 45%。其中许多发布者是销售虚假曝光的诈骗者。他们与拥有程序化机板的公司合作，产生虚假点击和流量来欺骗品牌。这些欺诈活动在
    2017 年让美国数字广告行业损失了 65 亿美元。透明度是艺术的关键。透明的系统将使品牌能够验证其正在与拥有真实流量的发布者合作。


    这就是为什么数字广告和区块链是完美结合。这就是区块链为系统带来透明度的方式。对于希望管理活动的品牌和发布者，将建立一个基于区块链的市场。数字广告内容将由品牌或高级广告机构放置在该平台上。这些内容可以是横幅、视频，甚至是文本。


    品牌还可以定义他们想要针对的群体。这包括他们的兴趣、位置、语言和预算。该平台将允许发布者找到这些品牌并爬取其内容。当用户访问发布者网站时，将根据其语言偏好、兴趣和其他偏好显示相关的广告。在这种情况下，品牌可以接触他们理想的客户。客户也将看到更相关的广告。该平台将构建在共享账本上。品牌可以追踪其广告在发布者网站上的每一次点击和浏览。品牌还可以验证广告曝光的位置。


    该平台使得去中心化和透明地共享信息成为可能。银行也可以确保资金花在了实际结果上。广告商和品牌一直担心广告支出缺乏透明度。区块链可以消除这种不确定性。他们可以确切看到预算花在了哪里。内容具体在哪里投放？为了解决广告库存购买不透明的问题，可以开发一个基于区块链的供应平台。正如我们之前讨论的，品牌无法清楚看到每个中间商的支出。基于区块链的平台将为品牌提供完整的账单，说明资金如何在所有参与者之间分配。


    它是透明的，区块链网络中的每个参与者都会知道每个方走了多少钱。通过实施这种不可篡改且透明的系统，品牌可以确保他们支付了公平准确的费用。去中心化的平台将确保广告供应链网络中的每个中间商都能获得其广告费用的份额。他们将无法像今天不透明的系统那样收取隐藏费用。这将消除数字媒体支出在媒体供应链中消失而非用于实际内容的问题。数据是新石油。它在使公司做出影响其盈利能力的明智决策方面发挥着重要作用。这些数据可以从在线和下的客户行为中收集。


    这些数据随后用于创建相关广告以吸引客户。这些广告往往无法吸引客户。区块链正在改变这一点，广告将变得更加有效。区块链允许消费者共享他们的数据并获得报酬。

