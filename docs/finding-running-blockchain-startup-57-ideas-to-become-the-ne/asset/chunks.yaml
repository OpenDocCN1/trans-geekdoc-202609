    # **40\. Blockchain Application in KYC**


    ![](Images/image00127.jpeg)


    Knowing that whom they are trading is one of the most important jobs of banks
    and other financial institutions like an insurance company stock exchange, etc.
    These financial institutions rely on KYC or know your customer process, as this
    process provides him with a sense of security for the KYC verification also ensures
    the authenticity of the other party involved. The KYC process is initiated when
    the customer intends to work with the financial institution for example, a bank
    initially the financial institution and the customer agree on certain terms of
    relationship. Then the customer sensor required documents like ID proofs, credit
    card information, utility bills, etc, to that institution to conduct the KYC verification
    process. After receiving these documents, the institution analyses them and generates
    certification, where the customer is either validated or rejected to avail the
    services. The process is repeated every time a customer initiates a relationship
    with any financial institution.


    For example, if a customer wants to open an account in banking, he has to exchange
    his documents with banking and has to go through the KYC process. After receiving
    his documents, bank even verified them, and after that, he is allowed to open
    an account in banking. But when he intends to work with other banks, let''s say
    bank B and bank See, he has to again exchange his documents and has to again go
    through KYC verification process with respective banks B and C. These multiple
    validations are time consuming and at the same time leads to unnecessary increase
    in the cost of KYC validation. So, quite naturally, there is a need for a solution
    that can make the KYC process is you. blockchain technology can provide the required
    solution and can act as a single point of truth in this case, after the implementation
    of blockchain, a customer will be required to undergo KYC process only once this
    KYC information and validation will then be stored on the blockchain. And later
    on, he can share this KYC verification result with the other financial institutions
    with which he intends to work. Now let''s discuss in detail how KYC verification
    will happen on the blockchain. To understand this, let''s come to our example.
    If the customer approaches banking for the first time, the bank, he will contact
    the core KYC verification process, the customer will share his documents with
    the bank, which will then be analysed by the bank.


    Once bank analyses these documents, these will be stored as digitally signed documents
    in the smart contract of that customer created by Bank A for the this will also
    include the result of the core KYC verification done for that customer that is
    where the verified or rejected. This smart contract for the customer will also
    hold details about other banks or financial institutions that will validate KYC
    of that customer in the future. Additionally, each of the documents of the customer
