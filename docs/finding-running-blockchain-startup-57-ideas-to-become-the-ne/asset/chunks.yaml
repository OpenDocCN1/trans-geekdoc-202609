    entity tries to exchange data with any of the devices in the smart home network,
    the user is required to authorise this exchange. This exchange can either be approved
    or rejected by the user using a smart contract.


    The user can even define a time limit for the data exchange, after which the data
    exchange status will be changed. Let us take a scenario to understand it in a
    better way. Jamie has a lovely dog named mellow. He knows that he will be late
    from work today. Therefore he hires Smith capacitor formulas evening book, Jimmy
    gives a digital key of the house to Smith. And that only for today, so as to avoid
    any unwanted accident. This time on maxes can only be given the implementation
    of blockchain, which is not possible otherwise. The fifth and last critical issue
    that blockchain mitigates is resilience. Resilience into the system is built through
    the detection and mitigation of unauthorised access and intrusion. For this purpose,
    a private blockchain network can be used, where network access to any unauthorised
    user will be prohibited, thus keeping the network robust and resilient.


    # 3. Blockchain and IoT in Carbon Emissions


    ![](Images/image0009.jpeg)


    Carbon emissions lead to change in the environment, which results in serious health
    consequences for us. According to the US Environmental Protection Agency, carbon
    emissions in the form of carbon dioxide make up more than 80% of the emitted greenhouse
    gases. These carbon emissions raise global temperature by trapping solar energy
    in the atmosphere. This in turn alters weather patterns and water supplies for
    the changes and growing season for food crops and threatens coastal communities
    as chances of floods increase with the rising sea level. rising sea levels can
    also cause saltwater to infiltrate some freshwater systems, thus increasing the
    need for desalination, and more water treatment. In summary, it is very important
    to fight global warming and reduce these emissions.


    Sustainability initiatives are gaining momentum, as organizations are becoming
    increasingly interested in monitoring their practices. Sustainability initiatives
    are not only good for the planet, but they''re also a great way to boost brand
    image. Research shows that supply chains are often responsible for a large share
    of company''s greenhouse gas emissions. In fact, gas emissions through transport
    is four times higher than company''s direct operations.


    Let''s understand how carbon emissions are calculated in the current scenario,
    but these businesses and organisations first need to identify all emission sources
    like electricity consumption. This is calculated by first noting down energy consumption
    by individual process, then this rating is multiplied by standard conversion factor
    to calculate carbon footprints. For example, electricity grid provides the emission
    factor taking standard amount of carbon dioxide that would be released when you
    use one unit of energy. This value could be different for different rates. Similarly,
    every fuel has its own emission factor. And you can use this value to calculate
    carbon emissions from different modes of transport, etc.


    For example, there are conversion factors for calculating emissions from one liter
    of petrol or using one litre of diesel as a fuel. After calculating the emissions
    from all the sources, they are all added up to find out the total emissions, but
    the problems that companies face in calculating carbon footprints to these methods
    maybe since the calculation is a manual process, and requires human intervention,
    chances of errors increase. Besides this, it is a time consuming process. Moreover,
    it is an approximate method. As real time carbon emissions are not calculated,
    but they''re calculated on the basis of fuel, electricity, etc consumed using
    standard conversion factor for each different fuel or electricity. Now let''s
    understand how blockchain and IoT sensors can solve this problem of calculating
    carbon emissions accurately.


    There will be two types of IoT sensors to calculate carbon emissions. First, IoT
    smart metre can measure power consumption by the companies. This will ease the
    pain of companies manpower to take readings manually, which can be prone to manual
    errors. Second IoT sensor can directly exchange information with environment and
    capture carbon emissions either by companies operations or during the transportation
    etc. The data collected from IoT sensors will be stored on the blockchain. As
    soon as the platform will receive the data smart contracts will get executed and
    will calculate the carbon footprints based on factors including type of electricity
    generator, and energy sources like diesel or coal metres efficiency conversion
    factor company''s total fuel consumption etc. Thus, smart contracts will help
    to create a reliable and authenticated carbon footprint report for a company.
    The company''s carbon footprint report will be stored on blockchain in a tamper
    proof manner for the blockchain can enable the companies to prepare their carbon
    footprint report with more accuracy and that too in reduced timeframe.

