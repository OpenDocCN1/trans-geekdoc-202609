  trans: '

    另一种情况是，员工可能对工作场所不满意，并发现某些做法不符合伦理。他应该有机会在一个平台上对他的公司进行评分，并在不披露身份的情况下表达他的顾虑。匿名性无法为任何评分和评论提供必要的信誉。这些评分和评论往往是虚假的。区块链允许在该公司工作过或目前在该公司的员工访问这些信息，而无需暴露他们的身份。区块链可以验证评论者确实在该公司工作。然而，他的身份不会被公开。这将让潜在的申请者在加入任何雇主之前更清楚地了解公司并做出明智的选择。


    # 37. 区块链在身份管理中的应用


    数字时代让我们能够通过在智能手机、平板电脑和笔记本电脑上点击几次完成许多日常任务。在进行任何交易时，我们需要证明自己的身份。这可以通过输入身份密码、密码、扫描生物特征（如指纹或视网膜扫描）或两者结合来实现。当我们在线交易时，会产生更多的数字足迹。这些数字足迹包含了关于我们的所有信息：姓名、地址、财务记录、位置、财务历史、个人兴趣和工作经历。这些个人数据的组合构成了我们的在线画像。我们对此没有控制权。在我们完成交易后，数据被存储在服务提供者的中央数据库中。这可能是银行、保险公司、雇主或如
    Amazon 或 Netflix 等任何订阅服务。我们对这些数据没有任何控制权，也不知道它们是如何被使用的，或者谁有权访问。目前的身份数据存储和捕获方式呈现了许多问题。让我们详细讨论每一个问题。正如我们已经提到的，个人数据被窃是访问任何服务的必要代价。


    在开设银行账户、申请贷款或注册数字钱包服务时，您需要向服务提供者提供身份证明。这些文件随后存储在每个服务提供者的中央数据库中。黑客可以通过将信息存储在这些中央数据库中来滥用您的隐私和机密。认知过载是第二个问题。如今的人无法依赖太多的在线服务。每个服务平台或应用程序都要求你注册
    ID 和密码以访问其平台。你创建一个画像来预订电影票；如果你想通过 Facebook 与学校朋友交流，则需要注册。


    我们每天都会接触许多服务提供者。要记住这些不同平台的所有密码和用户名是非常困难的。在这种情况下，用户的认知负担太重了。他需要记住许多细节。在这种情况下，用户有两个选择：其一，创建多个用户名和密码，然后将它们记录在手机或笔记本电脑上。破解任何使用单一密码和用户名的账户都会将风险扩散到所有账户。如果保持密码保密，安全风险将上升到下一个水平。缺乏透明度和控制是第三个问题。这些服务提供者在收集个人数据方面没有提供所需的透明度。用户未被告知其个人数据存储在何处以及如何存储，也不知道谁有权访问。收集的数据的安全性和安全性一直是用户感到疑虑的。许多服务提供者平台在用户不知情或未同意的情况下将数据出售给第三方。这些第三方使用这些数据向用户推销他们的产品和服务。


    这种数据共享证明了数据权力掌握数据库所有者手中，用户对自己的数据没有控制权。目前的身份管理系统是不可持续的，需要更强大的解决方案。区块链就是解决方案。它可以以透明、安全和可靠的方式管理用户的身份。通过这种基于区块链的身份系统，用户对自己的数据拥有完全的控制权。第三方可以通过这种主权身份系统访问并验证用户数据。数据保留在用户手中，而不是存储在服务提供者的服务器上。这消除了服务提供者滥用其数据的可能性。用户需要在智能手机上下载一个应用程序来实现自给自足。然后用户将被将其所有的身份证书上传到此平台上。


    一旦上传的文件被保存，就会生成一个唯一的哈希来识别用户。这些证书将发送给政府机构或经批准的政府机构进行验证。政府机构可以批准或拒绝这些文件。区块链将根据机构的标准和判断存储数字
    ID 的验证状态。如果用户需要通过其信息来验证服务提供者，他们可以提供相关信息的访问权限。这些加密数据存储在用户手中，不会存储在中央数据库中。这降低了数据泄露和攻击的风险。这些数字形式加密的数字身份将消除记忆多个密码和用户名的需求。这将减轻用户的认知负担。


    要向银行申请贷款，必须首先验证身份。这是一项耗时的任务，需要用户提供多份文件来证明身份。由于是人工处理，银行处理贷款需要几天，有时甚至是几周。新的、区块链驱动的身份管理系统允许用户授权银行访问其验证个人详情。银行随后验证文件并简化整个流程。该系统还将提高银行的效率并降低成本。该身份管理平台对从任何电子商务网站购买任何东西的人开放。它还可以用于申请高等教育。


    # 38. 区块链在国际贸易中的应用

