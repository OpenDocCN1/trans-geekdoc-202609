    所有这些额度都将维护在区块链上，碳排放较低的国家可以将其多余的排放额度卖给排放较高的国家。在这样的系统中，国家之间的任何碳信誉交易都将以透明且不可篡改的方式记录在数字账本上。智能合约的使用可以通过自动化谈判和协议流程来加速碳信誉的买卖。通过这种方式，可以实施严格的碳排放检查制度，并朝着更健康的环境采取具体步骤。区块链技术还可以促进点对点可再生能源交易平台的发展，消费者可以在这个区块链平台上相互购买、出售或交换可再生能源。


    这种基于区块链系统的能源交易活动将通过智能合约执行。根据向能源买家的能源供应情况向能源供应商进行自动支付。此外，区块链可以帮助筹集资金，并高效管理支持气候行动的点对点金融交易，同时确保资金以透明的方式分配给旨在采取气候行动的项目。


    # 54. 用于枪支控制的区块链


    ![](img/image00141.jpeg)


    美国在枪支方面无疑是一个非凡的国家。它是少数几个持枪权受宪法保护的国家之一。在发达国家中，美国的杀人率最高，这在很大程度上是因为获取枪支方便，许多美国人拥有火器。在美国，与枪支相关的死亡已达到流行水平。在
    2015 年至 2016 年期间，发生了超过 27,000 起涉及枪支的杀人案和约 45,000 起枪击自杀。如果考虑到所有受伤，每年有超过 10 万美国人因枪支死亡或受伤。美国死于枪击杀人的可能性是其他工业化国家居民的
    25 倍。事实上，致命枪伤的影响是糖尿病影响的三倍，几乎是脑疾病的四倍。


    因此，枪击杀人和自杀是美国持续的公共健康问题。在一个成为持枪者比成为汽车驾驶员更容易的国家，显然，目前的法律不足以确保公民免受潜在杀手的伤害。10 区块链可以作为一种解决美国及其他相关国家枪支控制问题的解决方案。区块链在枪支控制中的第一个应用是在执行背景检查，获得枪支需要进行背景检查。这些背景检查是通过查询国家即时刑事背景检查系统（即
    `NICS`）完成的。`NICS`是由联邦调查局（即 `FBI`）维护的一系列数据库。


    根据法律，患有精神健康问题的人不符合获得枪支的条件。这被设计为一个瞬时过程，大多数枪支背景检查只需要几分钟。如果查询结果为负面，那么枪支转移也会在几分钟内获得批准。然而，也存在
    `FBI` 需要更多时间进行调查的情况。一种正常情况可能是买者的名字恰好与某个罪犯相同，那么他的枪支背景检查可能会花费更长的时间。此外，在某些情况下，偏见和错误拒绝购买火器的情况也并不少见。


    根据 `FPS` 自己的记录，每年有约 3000 人正式通过了获得持枪执照所需的 `NICS` 背景检查，尽管他们实际上根据州法律被禁止购买许可证。为了最大限度地减少这些系统错误，可以建立一个基于区块链的注册系统来更高效地执行这些背景检查。关于人的信息，例如精神健康问题的历史和过往治疗记录，将存储在分布式账本上。通过背景检查的人可以拥有枪支。另一方面，未通过的人将被禁止这样做。此外，由于区块链是去中心化的，它更容易受到黑客攻击。因此，区块链技术可以降低美国现行枪支所有权系统的风险并缓解故障。


    区块链的第二个应用是枪支的追踪，从火器的制造到销售，了解其在任何时间点的位置对于确保其不会落入坏手至关重要。实施基于区块链的系统可以解决在整个过程中追踪枪支的挑战。在这个提议的系统中，目前拥有枪支或购买枪支的人将获得一个电子枪柜，类似于加密货币钱包。电子枪柜将与个人的生物识别数据（如视网膜扫描或指纹）相关。每当枪支被制造、购买或出售时，从一个电子枪柜到另一个的交易将以不可篡改和带有时间戳的方式记录在区块链上。此外，在交易之前，枪支买家必须通过背景检查。

    '
