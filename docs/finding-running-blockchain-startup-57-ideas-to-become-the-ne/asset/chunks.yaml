    # 37. Blockchain Application for Identity Management


    Today''s digital age allows us to do many of our daily tasks using just a few
    clicks and taps on our smartphones, tablets, and laptops. We are required to prove
    who we are wherever we transact. This can be done by entering a pin, a password,
    scanning our biometrics, such as fingerprints or retinal scans, or both. Digital
    footprints are created more often when we transact online. These digital footprints
    include all information about us: our names, addresses, financial records, locations,
    financial histories, personal interests, and work history. This combination of
    individual data creates our online profile. We have no control over it. After
    we make a transaction, our data is stored in the central databases of service
    providers. This could be a bank or an insurance company. An employer or any subscription
    service such as Amazon or Netflix. We don''t have any control over this data and
    have no idea how it is used or who has access to it. This current view of identity
    data storage and capturing presents many problems. Let''s discuss each one in
    detail. Personal data theft is, as we have already mentioned, a requirement to
    be able to access any service.


    You will need to provide identification documents to service providers when you
    open a bank account, apply for a loan or register for digital wallet services.
    These documents are then stored in the centralised databases of each service provider.
    Hackers can misuse your private and confidential information by storing it in
    these centralised databases. Cognitive overload is the second problem. One cannot
    depend on too many online services today. Each service platform or app requires
    that you register with an ID and password to access their platform. You create
    a profile to book movie tickets. You will need to register if you want to communicate
    with your school friends via Facebook.


    There are many service providers that we deal with every day. It is difficult
    to remember all the passwords and user names for these various platforms. In such
    a situation, the cognitive load on the user is too great. He is required to remember
    so many details. A user has two choices in such cases. One, create multiple usernames
    and passwords, and then note them down on his phone or laptop. Hacking any account
    with a single password and username can spread the risk to all accounts. If passwords
    are kept secretly, security risks rise to the next level. Lack of transparency
    and control is the third problem. These service providers do not provide the required
    transparency in how personal data is collected. The user is not informed about
    where and how his personal data are stored, nor who has access to it. The safety
    and security of data collected is something that users are always left in doubt.
    Many of these service-provider platforms sell data without users'' knowledge or
    consent to third parties. These third parties use the data to market their products
    and services to users.


    This data sharing proves that data power lies with database owner, and users have
    no control over their data. The current identity management system is not sustainable
    and needs a stronger solution. Blockchain is the solution. It can be used to manage
    the identity of users in a transparent, secure, and reliable way. The users have
    full control over their data with this blockchain-based Identity System. Our users
    data can be accessed and validated by third parties through this self-vereign
    identity system. The data remains with the user and is not stored on servers of
    service providers. This eliminates the possibility that service providers could
    misuse his data. A user will need to download an app for selfsufficiency on his
    smartphone in order to use this system. The user will then be asked to upload
    all of his identity certificates onto this platform.


    Once the uploaded file is saved, a unique hash is generated to identify the user.
    These certificates will be sent to the government agency or approved government
    agency for verification. The government agency can approve or reject these documents.
    The blockchain will store the status of the digital ID''s verification based on
    the agency''s criteria and judgment. If the user''s information is needed to authenticate
    a service provider by the user, they can give access to the relevant information.
    This encrypted data is stored with the user and does not get stored in centralised
    databases. This reduces the risk of data breaches and hacking. These digital identities,
    which are encrypted in digital form, will eliminate the need to remember multiple
    passwords and user names. This will reduce cognitive load for users.


    To apply for a loan from a bank, one must first authenticate his identity. This
    is a time-consuming task that requires multiple documents from the user to prove
    his identity. The bank takes days, sometimes even weeks to process the loan because
    it is manual. The new, blockchain-powered identity management system allows users
    to provide access to the bank to verify their personal details. The bank then
    verifies documents and streamlines the entire process. This system will also increase
    efficiency and reduce costs for banks. This ID management platform is available
    to anyone who orders anything from any ecommerce site. It can also be used to
    apply for higher education.


