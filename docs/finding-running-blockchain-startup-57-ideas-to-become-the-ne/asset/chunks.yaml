- raw: 'Once the origin has been tracked, it''s much easier to notify everyone and
    get the latest products off the shelves that were sourced from this particular
    supplier, farm, or location. This will save precious lives and save retailers
    financial loss by allowing them to take off food items from that category until
    they are identified. Let me give you an industrial example of blockchain. Let''s
    take Walmart as an example. Walmart recently conducted a traceback test of a mango
    pack in one of their stores. They took six days to find the source of the mangoes.
    They only took 2.2 seconds to locate the original farm when they used blockchain.
    This technology is extremely useful and powerful for the food industry. It will
    allow for food recalls, and reduce the risk to consumers.


    # **32 Blockchain Applications in Genomics**


    ![](Images/image00119.jpeg)


    The human DNA is full of information. It''s similar to computers where data are
    stored in binary digits. The code of human life is stored at GNC in four letters.
    Genome is the total amount of DNA in a cell. This can be very useful. It can be
    used to design personalised medicines for individuals. The cost of genome sequencing
    has fallen significantly in recent years which has resulted in advancements within
    the genetics industry. The cost of genome sequencing is expected to fall to $100
    in the coming years.


    Genome sequencing today is so efficient that it can sequence large amounts of
    DNA simultaneously. However, there are challenges in managing, storing and transmitting
    this vast amount of information contained within DNA.


    Researchers also face security and reliability issues with the DNA information
    stored in public databases. Blockchain can be a solution. It can aid researchers
    and companies in transmitting and storing the huge data from DNA sequencing. The
    high security of blockchain can make it resistant to fraud and fabrication. The
    privacy of those who contribute their genetic material is another concern.


    Another important question is: Who controls his data? The ideal situation is that
    the individual has control over his data either directly or through trusted persons
    such as doctors, research groups, witnesses, and other authorized parties. However,
    in today''s scenario, genetic information of individuals is sold to research companies
    without their knowledge. Companies are making huge profits by selling genetic
    data. Companies are making huge profits by selling genetic data.


    The current fee for sequencing a genome is approximately $1,000. The genome sequencing
    companies store the data and then sell it to other biotech and pharma companies
    for research and development. The implementation of blockchain will ensure that
    the individual''s data is securely stored on the blockchain network. Data buyers
    such as researchers, pharmaceutical companies, and healthcare organizations that
    require genetic data can obtain the individual''s genetic information directly
    from them. The database will pay the individual for sharing his data. This reduces
    the cost of DNA sequencing and increases the security of the data. This is the
    direction that many companies, such as Nebula genomics, are taking. Smart contracts
    will be used to accomplish this. Data buyers will receive the genetic information
    and data owners will be automatically paid.


    The current situation is that there is very little genome data available because
    not many people have had their genome sequenced. Researchers, pharma, and biotech
    companies face a significant obstacle in accessing genome data. They need a lot
    of genetic data to conduct their research on genetic diseases.


    Researchers are not usually interested in random data sets. They seek genomic
    data from people with particular phenotypes such as medical conditions. Genome
    data without phenotypic information is not very useful. The quality of the data
    is another challenge they face. The quality of the collected data is often questionable
    because it is usually collected through middlemen personal genomes companies,
    which alliances report data. Data from multiple sources can be in different formats
    and coded in different ways, making it difficult for data buyers to convert it
    into a usable format. Data buyers can connect directly to individuals through
    blockchain. It would be simple for them to obtain phenotypic and genotypic information
    from individuals as well as the blockchain. Researchers will be able to save time
    and money by storing their genomic data in standard formats.


    # **33\. Blockchain Application in Health Insurance**


    ![](Images/image00120.jpeg)


    Patients and healthcare providers are finding it difficult to get payment from
    insurance companies in today''s environment. Due to the increasing number of medical
    insurance frauds, it can be difficult for insurance companies to assess the validity
    of claims. Today''s inefficient and complex medical and payment systems are the
    root cause of all these problems. The lack of transparency in the system results
    in millions of dollars being wasted and unresolved disputes. Any provider of health
    insurance must inspect and analyze a large amount of information before he can
    determine the validity of a medical claim. This is due to the growing number of
    fraudulent claims. The entire process of submitting a claim and getting approval
    takes a long time and is extremely complex. Before submitting a claim, the healthcare
    providers must complete a lot of paperwork.


    This increases the likelihood of human editing. There is a high chance that certain
    fields might not be filled correctly or some may be missing entirely. Incomplete
    submissions result in the claim being rejected by the insurance company and the
    healthcare provider having to restart the process. This can lead to delays and
    increased overhead costs. Sometimes, a patient may have an old or expired insurance
    policy. The current system can be complex and it is difficult to find the necessary
    information. It is sometimes not possible for a health provider to check a patient''s
    status before rendering services. Let''s look at a real-life example to illustrate
    the concept. Steve was involved in an accident that required him to be admitted
    to hospital. Steve is taken care of by the hospital and discharged within days.
    The hospital prepares the insurance claim and submits it to Steve''s insurer.
    The insurer reviews the claim request and verifies the details of the patient
    in its database. After processing the request, the insurer discovers that the
    policy was out of date and rejects the claim.


    In this situation, the hospital contacts patient to inform them about the most
    recent health insurance company. This is necessary to submit the claim to the
    new insurance. Again, it can take a long time. Many times, the healthcare provider
    and the patient are unaware of all conditions and situations covered by the patient''s
    insurance policy. Both the patient and healthcare provider are affected by this.
    It can lead to lost time and effort for both the hospital and patient in filling
    out and submitting claims. It also means that patients are responsible for paying
    their medical bills. Blockchain technology can be the missing link and provide
    the solution. All stakeholders will be able to access the same information when
    this technology is implemented. This means that there will be one version of the
    truth, without any discrepancies. The distributed and shared ledger allows all
    parties to track and analyse each claim as well as the services provided against
    it.'
