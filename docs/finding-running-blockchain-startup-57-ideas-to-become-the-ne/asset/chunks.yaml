    # 43. Blockchain Application in Poultry Industry


    ![](Images/image00130.jpeg)


    Egg consumption is increasing day by day because it is inexpensive, easy to process
    and this rich source of protein. Consequently, growth in the poultry farming can
    also be absorbed. Because of this increased demand for eggs and chicken. But still,
    quality of eggs and chicken remain a concern for the consumers. For better quality
    of eggs and chicken, the better poultry production needs to be done. Additionally,
    outbreaks of contamination linked to eggs and poultry are a major challenge for
    the food industry. Recently, 207 million eggs from a North Carolina farm, possibly
    contaminated with bacteria were recalled in April 2018. The consumers before buying
    eggs and chicken have few questions in their mind, like where and how the chickens
    were raised. What were the Fed antibiotics and vaccinations that the chicken received
    during its life, whether it was raised free range, cage free, or in a cage, and
    even the location where the night stock was harvested. Where was the chicken processed,
    and most important is it fit for consumption. all the stakeholders involved in
    the poultry industry will be registered on the blockchain, and they will be required
    to record the relevant information on the shared immutable ledger.


    This supply chain starts with producers producer will have to provide information
    like location of the livestock farm date of hatching of eggs, antibiotics given
    to chicken. other details like whether they were raised free range or cage free
    and departure date of chicken to the slaughterhouse. The poultry should be managed
    properly for the better production of country items. And therefore producers have
    to take care towards maintaining proper body weight of poultry and to take care
    of it speed and water consumption. The stress levels in the poultry should be
    assessed through body temperatures that are captured through IoT devices. From
    a disease management outlook, it is necessary to spot disease poultry, and separate
    it before the entire flock is affected because the disease can spread to humans
    too. after consuming the affected quality products. The producers will also be
    required to provide certificates for the proof of managing poultry properly.


    Next comes the processes who process the chicken and eggs. The information then
    they will be required to provide his slaughter location packaging and labelling
    location storage conditions of the processed poultry product expiry date and dispatch
    date of the processed item to the next link. At this stage, the product will be
    given a unique identification number. Since chicken is a perishable product that
    needs to be kept at low temperature during its transportation in order to prevent
    it from getting spoiled. IoT sensors will be installed on the packets that will
    sense the temperature of the product and will record it on the blockchain. Retailers
    received these products from distributors and sell these to the end consumers.
    The retailer tailored will be required to record the received items, inventory
    details, storage details and sales information on the ledger. The consumer is
    the final link in the food supply chain who consumes this food therefore should
    have full rights to know the detailed information about the food.


    Through blockchain, a consumer can know all the information about the poultry
    like its health, its living conditions, and its processing details before buying
    and bring it to the consumer can simply send the unique number through a smartphone
    and can get all the information he always wanted to know. The information about
    provenance of the products will also be available on the blockchain. Even the
    transportation conditions of the poultry will also be available on the blockchain.
    With all this information at his disposal, he can easily validate if the product
    he is buying is fit for consumption or not.


    # 44. Blockchain Application in Power Industry


    ![](Images/image00131.jpeg)


    Power is another very crucial field that blockchain will disrupt. Basically, it
    will change the way how power is stored, distributed and traded. Let''s understand
    the implications of marrying blockchain with power industry. blockchain technology
    can be an ideal platform for peer to peer energy trading, where people can sell
    electricity generated from renewable sources like solar energy or wind energy
    to their peers or neighbours. In the current scenario, energy is produced in centralised
    electricity generation facilities, and is then delivered to industrial and domestic
    uses wire distribution networks operated by energy companies. But with blockchain
    and smart contracts, it will be feasible for anyone and everyone to trade and
    supply the energy generated from renewable sources. In this proposed system, smart
    metres would be used to measure the amount of energy produced and consumed. These
    energy trading activities in this blockchain based system will be executed through
    smart contracts.


    Additionally, automatic payments will be done to energy suppliers on the basis
    of energy supplied to energy buyers. For better understanding, let''s take a real
    life scenario. Let''s assume that a person has photovoltaic solar panels installed
    on the rooftop of his home. These photovoltaics will generate electricity using
    solar energy and in case surplus electricity is generated, it will get stored
    into a microplate. This stored surplus electricity can then be sold to peers or
    to local businesses. All these energy transactions will be managed and stored
    on the blockchain. For this system to work smart metres will be required, which
    will record the energy generated and energy consumed. Based on the energy consumed.
    payments will be triggered by electricity buyers to suppliers, thus creating a
    perfect ecosystem for peer to peer trading of renewable energy. For better adoption
    of electric vehicles, it is very critical to have charging stations easily available
    and accessible. Significant electric vehicle prospects have this fear of running
    out of battery power on large distance commutes where there is no electric car
    charger available. Lack of easy availability of electric vehicle charging stations
    as compared to traditional fuel stations is often a key deciding factor for vehicle
    buyers. Though a lot of efforts are being put to increase the number of commercial
    electric vehicle charging stations.


    But still, there is a long way to go before there are enough commercial electric
    vehicle charging stations. But using blockchain as an alternative solution is
    getting implemented. To tackle this lack of charging infrastructure. blockchain
    based applications are enabling individuals to share their private electric vehicle
    charges with others. Using peer to peer electric vehicle charging platforms. private
    owners can make the charges available for public during the times they are not
    being used by them. In return, they can earn some extra side income from their
    idle charges by increasing its utilisation. Using these blockchain based applications,
    drivers of electric vehicles can look for available charges in the vicinity and
    charge their cars before they run out of battery power. Enabling consumers to
    make the charges available for public use for a fee can significantly increase
    the number of available charging locations which in turn can lead to higher adoption
    of electric vehicles.


