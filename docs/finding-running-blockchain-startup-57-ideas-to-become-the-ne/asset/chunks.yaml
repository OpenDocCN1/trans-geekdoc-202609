    ust`，但可以由数千名投资者共同拥有。他们可以在未来交易这件艺术品。`Smart contracts`可以促进艺术品的拍卖过程。


    拍卖结束后。`smart contract`将分析所有的报价并确定最终的股份价格。这将确定在基于`blockchain`的艺术市场中，每位成功的投资者购买的股份总数。艺术家随后可以直接出售他们的艺术品。在这样的系统中，艺术家可以控制并设定价格。该系统还将显著增加艺术家的利润，因为向第三方收取的额佣金将大幅减少。`Blockchain`可以用于给艺术家的作品提供公平的补偿。


