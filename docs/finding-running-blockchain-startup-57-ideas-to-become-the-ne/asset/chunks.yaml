  trans: '

    难民可以使用这些文档来证明自己的身份，甚至可以申请工作或在大学接受高等教育。因此，像 `bit nation` 这样的初创公司正在利用区块链技术，在验证个人社交媒体账户后帮助难民获得数字身份，这些身份将由政府用于验证其身份。`essential`
    和 `Microsoft` 等公司也致力于帮助难民，并于 2017 年加入了一个名为 `ID 2020` 的公私合作联盟，该联盟由联合国机构和其他非营利组织组成。其使命是帮助你，并实现为难民以及数百万缺乏官方身份证明的人提供法律身份的目标。在人道主义危机中，区块链技术可以帮助解决此类问题，因为政府文件和银行账户是获得工作和过上安全生活的前提。


    大约 2250 万难民每天需要 NGO、其他组织和庇护国政府的支持。但这些组织在向难民发放援助时必须面对许多挑战。他们需要追踪分配给难民的资金是否得到了适当使用，并确保这些资金没有管理不善。联合国世界粮食计划已开始使用
    `Ethereum` 区块链技术将这些资源引导向难民。这项技术可以降低慈善基金发生欺诈的概率，并避免资金管理不善。难民获得基于加密货币的代金券，这些券可以在负责提供资源的商店进行兑换。这已经在约旦实施。


    约旦为叙利亚难民提供援助的商店在收银台使用区块链技术来验证这些难民的身份。收银员使用眼部扫描软件验证难民，该软件会扫描人的眼睛，如果确认身份无误，即可兑换优惠券并提供所需的物品。此外，难民交易花费的资金将记录在区块链上。因此，组织可以轻松地追踪资金是否被正确使用。


    # 6. 区块链在航空领域的中的应用


    ![](img/image00093.jpeg)


    目前，旅客从进入机场、行李托运到在免税店购物，需要在多个检查站出示身份证明。此外，安检和边境控制检查站的长长队列是旅客必须经历的其他一些关键痛点。区块链技术具有简化这一过程的潜力，并消除为了验证而反复翻包取出身份证明和其他各种文件的需要。现在，让我们了解一下基于区块链的系统将如何运作：用户将能够创建一个完全由自己控制的数字身份。


    换句话说，他可以决定谁可以查看存储在身份中的信息，甚至可以决定将哪些部分信息与特定的查看者共享。首先，用户需要下载基于区块链的数字身份创建应用，以上传他的护照、签证等个人验证文件，以及指纹、眼睛等生物识别数据。这些数据随后将上传到区块链上，并为用户信息生成一个唯一的哈希值。现在，这些数据将发送给政府机构进行验证。该机构将对照中央数据库对用户的数据进行检查和验证，并批准或拒绝。上传的文档和身份的验证状态将存储在区块链上。


    现在当用户到达机场需要乘坐飞机时，他只需去自助安检亭，用户在那里需要共享其经过验证的数字身份。之后，难民交易花费的资金将记录在区块链上。因此，组织可以轻松地追踪资金是否被正确使用。

