    # **41\. Blockchain Application in Land Registration**


    ![](Images/image00128.jpeg)


    The real estate has always been a lucrative sector for the purpose of investment
    around the globe. And land being the most expensive asset in this class has often
    been the focal point for various frauds, crimes and fights. Titles and deeds are
    an integral part of the land registration process, and provide the required safety
    net for the buyers. But in many countries, even these land titles are not a fool
    proof method to prove one''s ownership of the property, and this is because of
    the opaque, ineffective and inefficient land record maintenance system. In the
    current scenario, the land registration process in many of these developing countries
    is highly manual and paper intensive, thus, making it inefficient and vulnerable
    to temporary. And on top of that, land registration process involves multiple
    government bodies for authentication and verification. Transfer of land title
    requires the same processes and paperwork to be repeated and duplicated several
    times, thus, leading to an extended processing time and cost. But with blockchain,
    the whole process can be streamlined.


    And that''s why it has been garnering attention from many of the governments for
    its capability to record land titles, mutations, digitised maps, spatial data
    and settlement records in a transparent, secure and tamper proof manner. Now let''s
    see how the blockchain will work for land registrations. First of all, the geo
    coordinates of the land will be uniquely coded and recorded into the blockchain.
    Each property could also building to a smart key, which would be held by the owner
    of that piece of land. Further, smart contracts when combined with blockchain
    can be used to fasten the transfer of land entitlement and other related transactions.
    Let''s understand it through a real life scenario. Mr. X wants to buy a property
    from Mr. White. A smart contract will be agreed upon Mr. X and Mr. Y, where the
    title of the property will be transferred to Mr. X automatically on receipt of
    the agreed fund into Mr. Wise account. This transparent and immediate change a
    plan title in the ledger will also speed up the property registration process.


    And as a result, this would lead to cost savings and greater efficiencies for
    land registrations. The implementation of blockchain to record property transactions
    will also help in better and effective property management. As the transactions
    and other related information would be updated almost real time. A blockchain
    based system will bring all the stakeholders including the concerned government
    bodies, sellers and buyers on a single platform. And whenever a land registration
    or title transfer process is initiated on the blockchain, all the stakeholders
    can view the transaction with distributed owner rights. Thus, a blockchain based
    system with the smart contract provides a task parent and an immutable lay of
    the land ownership.


