- raw: 'Telecom plays a critical role in every aspect of our life. It affects every
    quadrant of our life, the way how we manage our business, the way we manage our
    day to day activities, the way we stay in touch with our loved ones, and the way
    we construct our collective human experiences that we call culture. In simple
    words, you can say telecom is a way of life. telecom has played a crucial role
    in shaping not only our society and culture, but it has also been instrumental
    in shaping the business and economics world as well. telecom is a huge industry,
    with its global market valued in trillions of dollars. But this industry is definitely
    not a cakewalk. For the telecom operators who run this show. They are being challenged
    by increasing costs and decreasing revenues. And on top of that, the ever growing
    competition always keeps them on their toes. Today, these telecom operators are
    in dire needs of reducing costs, exploring and implementing new revenue generation
    streams, and make their digital offerings more lucrative and competitive. Though
    this industry is in a technological transformation phase as it moves towards an
    augmented, virtualized and digitised environment. But there are still many loopholes
    in this industry that are unaddressed and blockchain technology has the potential
    to plug them in. blockchain technology has great applications for these communications
    service providers, or csps. In short, blockchain can help these csps through cost
    reduction, better efficiencies, and new value offerings. fraud is one of the biggest
    nightmares for most of these communications service providers. According to a
    recent survey report, it has been estimated that fraudulent activities cost these
    service providers 38 billion USD. Most of the frauds in this industry revolve
    around roaming and identity management and blockchain based solutions have the
    potential to reduce these foods and thus cost to the service providers. Let''s
    first discuss about roaming fraud. Currently, when a subscriber places a call
    from the roaming territory, now pattern roaming network service provider queries
    the host service provider about the roaming services that user has subscribed
    to. After that call, detail records are sent to the billing systems of the host
    service provider.


    After receiving these records, the host service provider is required to settle
    their accounts with the roaming service provider, in accordance with the agreed
    applicable roaming tariffs. roaming fraud occurs when a user uses the roaming
    services of the roaming service provider. And the host service provider is unable
    to charge the user for the services rendered. But the host service provider is
    liable to pay the roaming service provider for rendering the roaming services.
    There are primarily two reasons that lead to roaming frauds. The first one is
    the longer detection thing. Since roaming fraud occurs when the subscriber is
    not in the home territory, it takes a longer time to detect the fraud because
    of the delays in data exchange between the host and the roaming service providers.
    The second causes the longer response time post service provider has no control
    over the systems where this fraud takes place. Therefore, the time to respond
    to these fraudulent cases is comparatively longer than the time taken to respond
    to a fraud that has taken place in a system owned by the host service provider.


    Now let''s discuss how blockchain based solution can help to tackle this roaming
    throat. A permission blockchain would be implemented between the operators having
    a roaming agreement, the roaming agreement between these service providers would
    be implemented as a smart contract on the blockchain network. Whenever a user
    makes a call in the roaming network, the roaming service provider publishes the
    call detail records as a transaction on the blockchain network. When this transaction
    is broadcasted on the network smart contract gets executed and the predefined
    terms of the agreement are implemented. The whole service provider automatically
    calculates the billing amount for that coil and send this information to the roaming
    service provider. The implementation of blockchain and smart contract assists
    in prompt authorization and settlement in accordance with a pre agreed terms defined
    in the smart contract.


    Now let''s discuss the second fraud that is identity fraud. identity fraud happens
    when a particular subscriber uses a false identification or some other subscribers
    identity to access the telecom services. There are cases where improper identity
    proofs are submitted. The IDs provided have blurred data and the data is illegible.
    But still the IDS get approved without proper validations. There is still no universal
    database to verify the customer Details. Every telecom operator maintains its
    own database of frauds to identify the potential future fraud risks. These records
    are confined to the individual service providers database and are not available
    for other service providers. This leads to an inefficient identity fraud management
    system. Using blockchain based system, telecom providers can develop a solution
    for identity management that can be used across various devices, applications
    and organisations. There are numerous applications of IoT ranging from smart homes,
    smart cities, connected vehicles, smart entertainment, smart agriculture, etc.
    And this list is bound to grow further, it is estimated that by 2020, they would
    be around 200 billion connected devices.


    This could lead to an explosion of a huge amount of personal and professional
