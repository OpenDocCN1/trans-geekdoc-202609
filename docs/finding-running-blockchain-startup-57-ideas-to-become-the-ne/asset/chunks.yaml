    这些艺术品也正受到在线销售的追捧，比去年增长了 12%。在线买家经常面临风险，因为没有足够的专家来评估艺术品并验证其真实性。`Blockchain`可以通过安全地存储所有相关数据来验证艺术品的真实性。一个基于`blockchain`的系统。为了证明其真实性和来源，艺术家将把他们拥有其创作的证明上传到`blockchain`上。这种区块链的身份认证无法被篡改或删除。在将任何数据存储在`blockchain`上之前，画廊和艺术品出口等多个机构必须对其真实性进行验证、确认和测试。极少数的初创公司正在为金融领域创建分布式账本，允许艺术家上传真实性证书。每件艺术品都被分配了一个
    `ID` 标签。


    这个唯一的 `ID` 允许艺术家随时追踪艺术品的确切位置及其所有者。买家在购买之前也可以核实艺术品的来源并验证其真实性。这将增加该行业的透明度和信任度。买家可以通过扫描艺术品上的唯一
    `ID` 来验证在线购买的艺术品的真实性。在当今的市场中，投资艺术品是很困难的。只有富人才能买得起昂贵的艺术品。`Blockchain`技术使得接触艺术品成为可能。它还可以方便大量投资者拥有艺术品的所有权。艺术品的价格可以为`10,000,000
    ust`，但可以由数千名投资者共同拥有。他们可以在未来交易这件艺术品。`Smart contracts`可以促进艺术品的拍卖过程。


    拍卖结束后。`smart contract`将分析所有的报价并确定最终的股份价格。这将确定在基于`blockchain`的艺术市场中，每位成功的投资者购买的股份总数。艺术家随后可以直接出售他们的艺术品。在这样的系统中，艺术家可以控制并设定价格。该系统还将显著增加艺术家的利润，因为向第三方收取的额佣金将大幅减少。`Blockchain`可以用于为艺术家的作品提供公平的补偿。


