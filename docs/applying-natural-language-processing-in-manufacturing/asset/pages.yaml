    # 4. Case Study


    In the following, we describe a case study using NLP for downtime prediction in
    manufacturing environments. We develop a pipeline to predict the downtime of machine
    stops based on text comments from machine operators with events and alerts (A&E)
    data from production lines. We use the facility with regard to downtime. This
    information can be used by the department management to distribute production
    orders to other production schedules, maintenance or cleaning operations, or assign
    staff to different tasks. We examined data from multiple departments and production
    lines of a product.


    The data used in this case study comes from a production facility of consumer
    goods (step 0). The products manufactured in the production facility belonging
    to the same business unit. The individual operators are responsible for different
    steps in the production of the product. The individual lines within the department
    also differ from each, other, in the case of certain machines or other hierarchy.
    However, the production data is collected by the Line Events Data System (LEDS)
    of overseeing MES and stored in a central database. In addition to metadata on
    production, for all production events are


    The data also contains various errors. In spelling errors, there are comments,
    superfluous punctuation, and spaces. The quality of the data requires preparation
    (step 2) before use. All first text is stripped of punctuation, as it provides
    no information in content. All text is converted to lowercase and word (step 3).
    Stop words are not only not frequently used, but also examples of noise, which
    are removed after a frequency analysis. In the real data, there are 32,635 events
    in the light error category, 41,880 events in the medium error category, and 23,919
    events in the severe error category. We also classified the description of each
    event by nature. This method (step 5) provides additional little but is useful.


    Following preprocessing, we convert the text into a feature vector (step 6). We
    use two methods in this case TF-IDF and Bag-of-Words (BoW). Bow is a method to
    select features that create categories for each instance type. In NLP a Bow is
    a measure of number of occurrences. Each document is represented by the length
    and frequency of text, and a vector of a corresponding dimension length. Furthermore,
    we divide the data set into a training set and test set with the distribution
    80/20%, we use Gradient Boosting Decision Tree (GBDT) algorithms XGBoost [5] and
    LightGBM [11] classification for our models as in Fig. 3. XGBoost algorithms iterate
    over trees and fit to the limit of loss function with respect to the'
