    # ## 1. Introduction


    Industry 4.0, widely regarded as a development in manufacturing, is based on the
    ubiquitous acquisition, analysis and application of data and models in industrial
    settings. The fundamentals is the ability to derive knowledge from stupid data.
    In this now, the scheme is effectively applied to tabular data, data patterns
    or control sequences. In such contexts, natural language used in manufacturing
    is far more expressive and capable of transferring and knowledge [2]. However,
    an effective formalization and analysis of this knowledge is missing in manufacturing
    [18]. Instead of tapping into what is expressed in natural language, only numerical
    data from regular Industry 4.0 systems is harnessed. standardized questionnaires,
    fault reports and outlines are promoted to a limited scope. With lots of challenges
    in manufacturing, there is a variety of influencing factors that cannot be thought
    of in advance, which results in a loss of valuable natural data. Thus, Natural
    Language Processing (NLP), the art of formalizing natural language to distill
    knowledge [14], can serve as a valuable method and holds immense potential. To
    effectively use the knowledge inherent in natural conversation and texts in manufacturing
    -


    especially from data where the structure cannot be changed — this paper proposes
    a novel NLP pipeline for the application. Based on the developed NLP pipeline
    a case study with real industrial data is presented and exemplary, results are
    illustrated. In particular, comments from operators that are digitally recorded
    and describe failures from manufacturing are analyzed for increasing the accuracy
    of outcomes through NLP techniques. The approach can be applied to processing
    text-written comments by adding a predicted orthogonal corrector.


    This article is structured as follows: Section 2 discusses the current-of-the-art
    in Natural Language as well as one of the far few applications in manufacturing.
    Based on the state of keeping the knowledge Section 3 introduces the methods.
    The approach is to test with a case study in Section 4. Section 5 finds the findings
    are discussed by a brief summary and outlook in Section 6.


    # ## 2. Related Work


    A brief-of-the-art of NLP, as discussed in Section 2.1, and a general review of
    possible applications of NLP in manufacturing in Section 2.2.


