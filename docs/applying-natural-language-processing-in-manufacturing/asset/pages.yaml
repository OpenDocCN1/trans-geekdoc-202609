    We found that TF-IDF yields the better performance compared to Bag-Of-Words or
    Word2Vec. This indicates superior performance for more complex and accurate vectorization
    algorithms. The method for careful vectorization and sophisticated algorithms
    is, therefore, reinforced. When using Bag-Of-Words, XGBoost and LightGBM show
    very similar performance. When using TF-IDF, the LightGBM model provides the better
    results. Compared to the zero classification, both models demonstrate significant
    increase in performance.


    # 5. Summary & Outlook


    In our case, we used gradient boosting ML algorithms, to predict the severity
    of machine downtime. Based on this, it can be seen that the downtime comments
    with shop owners are willing to offer explicit reply with our request. However,
    the forecast lacks high accuracy for direct use in operations. The nature and
    information content of the data play a major role in the accuracy of the predictions.
    With 100,000 observations, the dataset is large enough for a particular NLP problem.
    This task is established by the division into training and test sets. Also missing
    are some features that could have impact on downtime, such as information about
    the product or randomness. In the future, autocorrection as well as the filtering
    of outliers could have a positive impact on the result. For outrection, a production
    or company-specific lexicon should be used, since the vocabulary is not covered
    with common implementations. The role model varies in length. Thus, the deployment
    method should be trained on the data set. Further experiments are needed. Larger
    datasets such as well of the data could lead to a more comprehensive approach.
    The use of a standardized comment format could have a positive effect on the result
    in the long term. Thus, industry readers are advised to keep standardized comment
    formats, the introduction of specific autocorrection lexicons and early data gathering
    for large scale NLP in publishing.


