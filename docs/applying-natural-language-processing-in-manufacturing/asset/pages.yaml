  md: '# State-of-the-art Natural Language Processing


    In manufacturing companies, text data is often available in an unorganized form.
    There is a relatively small amount of literature to sense of what is directly
    connected with NLP methods in combination with Machine Learning (ML) for relation
    data. Due to data acquisition on the shop floor and data scarcity despite powerful
    NLP algorithms, the application of NLP remains in the production domain. To order
    apply NLP in the production environment and ultimately tap into the unstructured
    available human knowledge of texts and spoken language, a general understanding
    of methods and requirements is essential.


    At the beginning of NLP, the textual documents have to be sorted, processed and
    filtered [14]. The texts are preprocessed in the preparation stage. Examples of
    preprocessing include the removal of unknown characters, words, and stemming.
    Lemmatization describes the grouping of words, such as “best” and “good” [20].
    Stop words which have no sense to search for or occur frequently in a document
    such as to search or for them (e.g., that, is, ...) are often referred to as a
    stop word. After the preparation, the tokenization takes place [25]. The vectorization
    is the embedding of words for the sake of representation (i.g. Word2Vec, fastText)
    or their frequency-based vectorization (i.g. One-Hot Encoding, TF-IDF [7]). This
    vectorization allows NLP to process documents and train the model. An evaluation
    metric can be determined and the algorithm or model can be adjusted.


    A typical process using NLP on textual data is shown in Fig. 1.


    BERT is deep meaningful algorithm that uses the left and right context of words
    and, thus, distinguishes words like “seat bank or money”. Eventually BERT can
    generate a deeper understanding of the text in unidirectional directions, such
    as: TF-IDF [8]. With the TF-IDF score, it is possible to calculate the relevance
    between a word and a document without taking into account the position of a word
    and its purpose, the frequency with which a word occurs in a document is not the
    document of a series of documents [4].


