    # Abstract


    Despite great potential in the data driven industry 4.0 and widely available data,
    data analysis is constrained to manual data, not the synthesis of knowledge. Although
    employee knowledge in manufacturing is often hidden, it is rarely formalized and
    effectively harnessed. To close this gap, we develop a NLP Natural Language Processing
    (NLP) pipeline to handle text information from machines. We provide them with
    this production process to reduce downtime. The resulting formalized knowledge
    could be used as a base for optimizing manufacturing processes.


