    # 2. Literature Review


    NLP is mainly in non-industrial sectors, where since collections of texts are
    already available. In the following, we describe some approaches of NLP the industrial
    sector in order to recognize the possibility of already existing solutions for
    their industrial applications. One approach is to train a scale-down language
    model with the goal of processing text that occurs in dialogues or not [7]. We
    use a ML method in this research, which filters relevant features from the text
    to summarize it automatically. A different application describes data-driven,
    editorial correction of human-understandable as well as informative texts through
    ML algorithms. Here, the authors used the case of automated reporting on the 2017
    Finnish local elections [15]'
