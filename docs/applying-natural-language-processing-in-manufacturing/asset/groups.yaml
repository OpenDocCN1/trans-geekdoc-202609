    # Marvin Carl et al. / Perdocia CIRP 115 (2022) 184–189


    前一个树的输出。XGBoost 和 LightGBM 的优势在于通过离线计算实现的扩展性和速度，以及它们处理数据稀疏性的能力。数据稀疏性可能由缺失值或特征编码引起，并可能导致传统算法中出现长序列
    [5, 12]。我们将模型定义为具有此类目标的多分类器。我们发现使用交叉验证中的网格搜索来调整超参数并寻找最佳假设。我们使用了准确率最高的方法进行评估。我们还考虑了
    F1 分数以及一对 ROC-AUC (ROC-AUC-OVO)。此外，我们还对数据使用零率分类器来从基准分类（步骤 7）设置我们模型的性能。


    | | 指标 | XGBoost | LightGBM |

    |---|---|---|---|

    | 词袋 (Bag-Of-Words) | 准确率 | 57.21% | 55.48% |

    | | 加权 F1 | 57.09% | 55.13% |

    | | ROC AUC | 74.11% | 73.77% |

    | TF-IDF | 准确率 | 58.87% | 62.06% |

    | | 加权 F1 | 58.28% | 62.10% |

    | | ROC AUC | 77.52% | 79.77% |

    | Word2Vec | 准确率 | 43.57% | 46.15% |

    | | 加权 F1 | 28.91% | 45.31% |

    | | ROC AUC | 60.92% | 62.85% |

    | 基准分类器 | | 34% | |


    ![](img/677d3822c8fe2c691b08becd97b8b870_4_0.png)


    图 3. 决策的流水线方法和建模。


    实验结果如表 2 所示。XGBoost 和 LightGBM 的准确率分别为 57.21% 和 55.48%，F1 分数分别为 57.09 和 55.13，ROC
    AUC 为 74.11 和 73.77。使用 TF-IDF 得到的 F1 分数为 58.28% (62.06%)，ROC AUC 为 77.52% (79.77%)，而
    Word2Vec 得到的 F1 分数为 43.57% (46.15%) 和 ROC AUC 为 60.92% (62.85%)。基准分类结果为 34%。


    我们发现与词袋或 Word2Vec 相比，TF-IDF 产生了更好的性能。这表明更复杂的准确的向量化算法性能卓越。因此，精细向量化和复杂算法的方法得到了加强。在使用词袋时，XGBoost
    和 LightGBM 显示出非常的性能。在使用 TF-IDF 时，LightGBM 模型提供了更好的结果。与零分类相比，两种模型的性能都有显著提高。


    ## 5. 总结与展望


    在我们的案例中，我们使用了梯度提升机器学习算法来预测机器停机的严重性。基于此，可以看出与店主之间的停机评论愿意根据我们的请求提供明确回复。然而，预测对于直接用于操作来说缺乏高准确性。数据的性质和信息内容对预测的准确性起着主要作用。凭借
    100,000 个观测值，该数据集对于特定的 NLP 问题来说足够大。该任务通过划分为训练集和测试集建立。一些缺失的特征会对停机产生影响，例如关于产品的随机性。未来，自动修正以及对异常值的过滤会对结果产生积极影响。为了纠正，应使用特定的词表。部署方法在数据集上进行训练。需要进一步的实验。更大的数据集会导致更全面的方法。因此，建议读者保持标准的格式，引入特定的词表并进行早期数据收集。


    ## 6. 总结与展望


    简而言之，制造业对 NLP 的需求显而易见。随着对知识和简单 NLP 流水线的意识增强，可以得到解决。因此，本文提出了一种基于文本描述的制造业 NLP 流水线案例。停机预测是监督学习应用的第一步。后续研究可以阐明使用无监督学习和强化学习的兴趣。此外，研究可以通过增加大量数据集的强化学习进行增强。未来，NLP
    在制造业中的全面应用有望带来更好的决策。


