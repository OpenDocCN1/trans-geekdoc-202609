    # 在制造业中应用自然语言处理


    Marvin May *a, Jan Heidinhöfer†a, Tom Körner‡, Luis Schäfer‡, Gisela Lanza§


    *卡尔斯鲁厄工业学院 (KIT), Karlsruhe, 72631 Karlsruhe, Germany 研究所


