    # 摘要


    尽管数据驱动的工业4.0具有巨大潜力且数据广泛可用，但数据分析仍局限于手动数据，而非知识的合成。虽然制造业中的员工知识往往是隐藏的，但很少能被形式化和有效利用。为了弥补这一差距，我们开发了一条自然语言处理（NLP）流水线来处理来自机器的文本信息。我们为其提供了这一生产流程以减少停机时间。生成的形式化知识可以作为优化制造工艺的基础。


    © 2022 作者。由 Elsevier B.V. 出版

    经同行评审的文章在 CC BY-NC-ND 许可下发布（https://creativecommons.org/licenses/by-nc-nd/4.0）

    同行评审由第10届 CIRP全球网络会议 — 制造工艺的材料方面（CIRP2022）科学委员会负责。


    *关键词*：自然语言处理；预测性维护；知识提取；机器学习；生产计划


    ## 1. 引言


    工业4.0 被广泛认为是制造业的一项发展，它基于工业环境中数据和模型的无处不在、分析和应用。其基础是从“愚笨数据”中推导出知识的能力。目前，该方案已有效地应用于表格数据、数据模式或控制序列。在这种背景下，制造业中使用的自然语言具有更高的表达力，并能够传递知识
    [2]。然而，制造业中缺乏对这种知识的有效形式化和分析 [18]。制造业并没有挖掘自然语言中表达的内容，仅利用了来自常规工业4.0系统的数值数据。标准化的问卷、故障报告和大纲仅被限制在有限的范围内。由于制造业面临许多挑战，存在各种无法预见的影响因素，导致了宝贵自然数据的流失。因此，自然语言处理（NLP）作为一种将自然语言形式化以提炼知识的艺术
    [14]，可以作为一种非常有价值的方法，并具有巨大的潜力。为了有效利用制造业中自然对话和文本中固有的知识——特别是那些结构无法更改的数据——本文提出了一种用于该应用的新型NLP流水线。基于开发的NLP流水线，本文展示了一个使用真实工业数据的案例研究，并说明性地展示了结果。特别地，对操作人员数字记录的、描述制造故障的评论进行了分析，通过NLP技术提高了结果的准确性。该方法可以通过添加预测的正交校正器来处理文本编写的评论。


    本文的结构如下：第2节讨论了自然语言的现状以及其在制造业中极少数的应用之一。基于知识保持的状态，第3节引入了相关方法。第4节通过案例研究进行测试。第5节对发现进行了讨论，第6节是简要的总结和展望。


    ## 2. 相关工作


    第2.1节讨论了自然语言处理（NLP）的现状，第2.2节对NLP在制造业中可能的应用应用进行了一般性综述。


