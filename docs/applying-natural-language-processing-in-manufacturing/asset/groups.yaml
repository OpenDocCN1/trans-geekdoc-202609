    ### 现代自然语言处理


    在制造业公司中，文本数据通常以无组织的形式存在。关于与机器学习（ML）结合的NLP方法直接相关的文献相对较少。由于车间的数据获取以及尽管有强大的NLP算法但数据稀缺，NLP的应用仍处于生产领域。为了在生产环境中应用NLP并最终利用非结构化的文本和口语人类知识，对方法和要求的通用理解至关重要。


    在NLP的开始，文本文档必须经过排序、处理和过滤 [14]。文本在准备阶段进行预处理。预处理的示例包括删除未知字符、单词和词干。词还原（Lemmatization）描述了如“best”和“good”等单词的分组。准备之后，进行分词。向量化是用于表示的单词嵌入（例如Word2Vec、fastText）或基于频率的向量化（例如独热编码、TF-IDF）。这种向量化允许NLP处理文档并训练模型。可以确定评估指标并调整算法或模型。使用NLP处理文本数据的典型过程如图1所示。


    BERT是一种深度意义的算法，它利用单词的左侧和右侧上下文，从而区分如“seat、bank或money”之类的词。通过TF-IDF得分，可以在不考虑单词位置的情况下计算单词与文档之间的相关性，单词在文档中出现的频率不是文档系列
    [4]。


    预训练模型被用于GPT算法。GPT-3是一个在所有结构中具有1750亿参数的深度神经网络。图中了Transformer [24]。它通过基于标记的标记进行预测。标记表示为Nigram或语言。因此，GPT-3还可以解决以前无法解决的NLP任务。


    这些算法没有在生产内的文本数据上进行训练，使用了不同的术语。这提出了在没有先验知识的情况下对文本进行向量化的挑战，具体的步骤如表1所示。


    表1. NLP与机器学习


    | NLP步骤 | 概述 |

    |---|---|

    | 1. 数据准备 | 分词、停用词删除、处理、词干、归一化 |

    | 2. 向量化 | 独热编码、TF-IDF、词袋、Word2Vec、fastText、BERT |

    | 3. 机器学习 | 监督学习（例如XGBoost、LightGB、随机森林）、无监督学习（例如Means-DS、期望最大化） |


    ![](img/677d3822c8fe2c691b08becd97b8b870_1_0)


    ## 2. 文献综述


    NLP主要位于非工业部门，因为那里已经有了大量的文本集合。在接下来，我们描述了工业领域的一些NLP方法，以识别其工业应用现有解决方案的可能性。一种方法是训练一个缩小的语言模型，目标是处理出现在对话中的文本
    [7]。我们在本研究中使用了机器学习（ML）方法，从文本中过滤相关特征并自动进行总结。另一种应用描述了通过机器学习算法对人类可理解及信息性文本进行数据驱动的编辑。在这里，作者使用了2017年芬兰地方选举自动报告的案例
    [15]

