    MES，该 MES 跟踪事件和生产数据。数据由系统在生产期间自动生成并以表格格式保存。数据通常包含有关事件、错误类型、生产信息和时间等的信息。在许多情况下，机器操作员或人员可以手动向附加信息中添加文本。那些操作机器或监督生产过程的人对某些潜在的、反复发生的事件具有更丰富的知识。因此，添加的注释包含重要信息。然而，它们并不遵循标准规范，格式和语言可能有所不同。此外，公司建立了自己的固定术语和缩写，生产文本偏离了预期的语言。语法和拼写错误是预料之中的，并且在繁忙的生产环境中经常被忽略。我们假设添加的文本包含有关事件的相关信息以及机器操作员提供的用于解决产生的问题的信息。我们假设以注释形式添加的内容可以对生产停机的预测做出重大贡献。基于这些提出的
