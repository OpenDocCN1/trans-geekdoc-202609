    在这种情况下，类内方差可以根据以下表达式通过它们的方差定义：


    `σ*[`D*`]²` = `w*`A*`` ⋅ `σ*[`A*`]²(`*k*`)` + `w*`B*`` ⋅ `σ*[`B*`]²(`*k*`)` (4.4)


    考虑到这种公式，大津法寻找的是代表强度级 `k` 的最优阈值，使得类内方差最小（公式 4.4）。因此，目标是确定每个对象的方差值，使其尽可能小，以减少它们的重叠。根据到为止定义的模型，算法可以尝试
    `k` 的所有可能值，并返回 `σ*[`D*`]²` 值最小的元素。然而，可以开发一种递归公式来实现更快的计算。这需要计算若干项，例如总方差以及对象或类之间的方差。


    分布的总方差计算整个直方图的方差。因此，其计算定义如下：


    $\sigma\_{T}^{2} = {\\sum\limits\_{i = 0}^{L - 1}{\\left( {i - \mu\_{T}} \right)^{2}
    \cdot h\left( i \right)}}$ (4.5)


    其中 `μ*[`T*`]` 代表表示分布的直方图的平均强度：


    $\mu\_{T} = {\\sum\limits\_{i = 0}^{L - 1}{i \cdot h\left( i \right)}}$ (4.6)


    最后，类间方差 `σ*[`E*`]²` 可以视为总方差 `σ*[`T*`]²` 与类内或对象方差 `σ*[`D*`]²` 之差。因此，`σ*[`E*`]²`
    由以下表达式定义：


    $\begin{array}{ccl} \sigma\_{E}^{2} & = & {\\sigma\_{T}^{2} - \\sigma\_{D}^{2}}
    \\ & = & {{{w\\left( k \\right)} \\cdot \\left( {{\\mu\_{A}\\left( k \\right)}
    - \\mu\_{T}} \\right)^{2}} - {\\left( {1 - {w\\left( k \\right)}} \\right) \\cdot
    \\left( {{\\mu\_{B}\\left( k \\right)} - \\mu\_{T}} \\right)}} \\ & = & {{w\\left(
    k \\right)} \\cdot \\left( {1 - {w\\left( k \\right)}} \\right) \\cdot \\left(
    {{\\mu\_{A}\\left( k \\right)} - {\\mu\_{B}\\left( k \\right)}} \\right)^{2}}
    \\ \\end{array}$ (4.7)


    由于总方差始终是常数且不依赖于强度级 `k`，计算最优阈值的效果仅取决于方差 `σ*[`E*`]²` 和 `σ*[`D*`]²`。因此，最小化类内方差 `σ*[`D*`]²`
    等价于最大化类间方差 `σ*[`E*`]²`。最大化 `σ*[`E*`]²` 的优势在于，它可以随着 `k` 值的迭代进行递归计算。在这种情况下，该递归方程定义如下，考虑到它们的初始值为
    `w*(1)` = `h*(1)` 和 `μ*`A*`` = 0。


    $\begin{matrix} {w\\left( {k + 1} \\right) = w\\left( k \\right) + h\\left( {k
    + 1} \\right)} \\ {\\mu\_{A}\\left( {k + 1} \\right) = \\frac{\\left( {w\\left(
    k \\right) \\cdot \\mu\_{A}\\left( k \\right) + \\left( {k + 1} \\right) \\cdot
    h\\left( {k + 1} \\right)} \\right)}{w\\left( {k + 1} \\right)}} \\ {\\mu\_{B}\\left(
    {k + 1} \\right) = \\frac{\\left( {\\mu\_{T} - w\\left( {k + 1} \\right) \\cdot
    \\mu\_{A}\\left( {k + 1} \\right)} \\right)}{1 - w\\left( {k + 1} \\right)}} \\
    \\end{matrix}$ (4.8)


    通过使用这些表达式，可以更新 `σ*[`E*`]²` 并随着强度级 `k` 的逐渐增加测试其值是否为最大。这种简单的优化方法可以无问题使用，因为函数 `σ*[`E*`]²` 是始终平滑且单峰的。程序
    4.1 显示了大津法的实现。在程序中，首先将彩色图像转换为灰度图像。然后根据公式 4.1–4.8 所示的步骤实现大津法。图 4.9 显示了原始图像以及通过程序
    4.1 获取的二值化结果。

