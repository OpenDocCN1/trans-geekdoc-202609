    ## 4.7 Labeling of Objects in Binary Images


    Object labeling is a classic image processing technique that is known in the literature
    and vision community as “region labeling”. A binary image is a numerical representation
    that presents only two classes of elements: ones (that indicate a specific object)
    and zeros (that correspond to the background). An example of a digital image with
    different objects is shown in [Figure 4.13](#C_007_c4.xhtml#f4_13). Under region
    labeling, the objective is to identify the number of binary objects contained
    in an image. The algorithm essentially consists of two steps: (1) temporary labeling
    of the objects and (2) the solution of multiple pixel labels belonging to the
    same object. The method is relatively complex (especially step 2). However, due
    to its moderate memory requirements, it represents a good choice for object labeling.
    The complete algorithm is described in [Algorithm 4.1](#C_007_c4.xhtml#a4_1).


    ![FIGURE 4.13 Binary image with different objects.](images/Fig04_13.jpg)


    ### 4.7.1 Temporary Labeling of Objects (Step 1)


    In the first step, the image is analyzed from left to right and from top to bottom.
    At each movement, each pixel `(x,y)` is assigned a temporary label. The value
    of the label depends on the type of neighborhood, which can be 4-neighbors or
    8-neighbors. For each case, the used mask can be as follows:


    $N_{4}\left( {x,y} \right) = \begin{bmatrix} \cdot & N_{2} & \cdot \\ N_{1} &
    \times & \cdot \\ \cdot & \cdot & \cdot \end{bmatrix}$

    $N_{8}\left( {x,y} \right) = \begin{bmatrix} N_{2} & N_{3} & N_{4} \\ N_{1} &
    \times & \cdot \\ \cdot & \cdot & \cdot \end{bmatrix}$ (4.10)


    where `×` identifies the current pixel at `(x,y)`. In the case of 4-neighbors,
    only the pixels `N[1]=I(x-1,y)` and `N[2]=I(x,y-1)` are considered, while in the
    case of 8-neighbors, the pixels `N[1]` through `N[4]` are considered. [Figure
    4.14](#C_007_c4.xhtml#f4_14) shows the complete process of step 1 carried out
    on an image and considers the 8-neighbor neighborhood as the criterion.


    ### 4.7.2 Propagation of Labeling


    It is considered that the pixel value of the object in a given position is `I(x,y)=1`,
