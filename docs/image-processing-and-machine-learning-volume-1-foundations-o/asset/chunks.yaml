    轮廓识别过程中的另一个复杂情况（参见图 4.19）发生在物体变薄到达到单像素极限并再次增大尺寸时。这种复杂性使得轮廓处理变得困难，因为某些像素会在不同的方向上被处理两次。因此，仅设置一个识别轮廓的起始点是不够的，在执行过程中还需要定义一个方向。


    ![图 4.19 轮廓轨迹表示为像素的有序序列，被视为起始点 p_{s}。像素可能在路径上出现多次。](img/Fig04_19.jpg)


    **图 4.19** 轮廓轨迹表示为像素的有序序列，被视为起始点 `p`[`s*]`]。像素可能在路径上出现多次。


    接下来，将介绍一种组合算法，与传统算法不同，它允许将二值图像中轮廓的识别与对象的标记相结合。


    ### 4.8.2 轮廓识别与对象标记的结合


    该方法集成了对象标记和轮廓识别过程的概念。其目标是单次执行这两种操作。在这种方法下，外轮廓和内轮廓都会被识别并标记。该算法的实现不需要任何复杂的数据结构，与其他类似方法相比，效率非常高。


    该算法的主要思想如图图 4.20 所示，其原理简单，并考虑了以下处理步骤：


    ![图 4.20 轮廓识别与对象标记的结合。(a) 从背景到物体的转换情况，该点是外边界的一部分；(b) 从物体到背景的转换情况，该像素是内边界的一部分；(c)
    物体中不属于轮廓的像素，并了其左邻居的标签。](img/Fig04_20.jpg)


    **图 4.20** 轮廓识别与对象标记的结合。(a) 从背景到物体的转换情况，该点是外边界的一部分；(b) 从物体到背景的转换情况，该像素是内边界的一部分；(c)
    物体中不属于轮廓的像素，并继承了其左邻居的标签。


    二值图像 `I`[`b*]`(*x*,*y*) 与对象标记过程一样，从左到右、从上到下进行处理。这确保了所有像素都得到了考虑。


    在图像处理过程中可能会出现以下情况：


    **情况 1。** 从背景到值为 1 且当前未标记的像素 `p`[`A*]` 的转换（图 4.20a）。当这种情况发生时，意味着像素 `p`[`A*]` 是物体外轮廓的一部分。因此，为它分配一个新的标签并处理该轮廓，标记属于它的每个像素。此外，所有与物体接触的背景像素都被赋予值
    -1。


    **情况 2。** 从属于对象的像素 `p`[`B*]` 到背景像素的转换（图 4.20b）。当这种情况发生时，意味着像素 `p`[`B*]` 属于内部轮廓。因此，处理该轮廓并标记像素。与上一种情况一样，与物体接触的背景像素被赋予值
    -1。


    **情况 3。** 当物体的像素不属于轮廓时，在这种情况下，像素被赋予其左邻居的标签值（图 4.20c）。


    在算法 4.2–4.4 中描述了结合轮廓识别和标记过程的完整算法流程。`LabelOutlineCombination` 逐行扫描图像，并在检测到属于外轮廓或内轮廓的像素时调用
    `OutlineTrace()` 函数。沿轮廓的像素标记以及周围的背景像素通过调用 `NextNode()` 函数在结构“Label Map” `ME` 中注册。


    ### 4.8.3 在 MATLAB 中的实现


    本节解释了如何实现算法 4.1 中描述的结合轮廓识别和对象标记的程序。


    首先，算法在处理二值图像时考虑消除图像之外的元素。这使得处理更加容易，因为外部像素在算法执行期间不被视为邻居。因此，对于维度为 `M` × `N` 的图像，处理考虑的是第
    2 到 `M` − 1 行以及第 2 到 `N` − 1 列。


    该算法实现在程序 4.2 中。它运行使用了两个函数：`OutlineTrace()`(程序 4.2) 和 `NextNode()`(程序 4.2)。`OutlineTrace()`
    函数允许你从参考点 `p`[`s*]` 处理内外轮廓。为此需要调用 `NextNode()`。如果不存在下一个点（在孤立像素时可能会发生），该函数将返回调用时的相同
    `p`[`s*]` 点。因此，如果是孤立像素，`OutlineTrace()` 将立即终止；如果不是如此，则在处理轮廓时连续调用 `NextNode()`。


    `OutlineTrace()` 函数定义了路径上的点 `p`[`p*]` 和 `p`[`c*]`，分别对应之前的位置和当前位置。因此，当 `p`[`c*]` = `p`[`p*]`
    时过程结束，这发生在程序在轮廓中完成回路（所有元素都已分析）。


    `NextNode()` 函数从当前点 `p`[`c*]`确定轮廓的下一个点。为此需要指定一个初始搜索方向 `d`。从该方向开始，函数顺时针以 7 个不同的方向搜索下一个轮廓像素。这些方向定义在算法
    4.4 表格的最后部分。在此过程中，当发现值为 0 的像素时，标签映射 `ME`(*x*,*y*)赋予值 -1。通过此操作，可以避免在搜索过程中再次通过该像素。


    检测到的轮廓存储在形式为 `Co(:,:,NCo)`的多维数组中，第一个参数定义包含轮廓图像的任意尺寸（与处理的二值图像尺寸一致），而 `NCo` 索引轮廓的数量（图
    4.21）。


    ![图 4.21 通过结合轮廓识别和对象标记算法获得的结果。(a) 原始图像，(b) 识别出的轮廓，以及(c) 标记的对象。](img/Fig04_21.jpg)


