    这些 Val(`*C*[`*D*]`→`*k*`) = `max`值可以被归一化序列，且与起点或参考点无关。因此，它们可以作为链之间比较的方法。如公式 4.16
    所示，问题在于这些值的计算会导致非常大的数值。链比较不能被视为一种可靠的方法，因为轮廓产生的旋转、缩放或变形可能会产生错误的结论。


    ### 4.9.5 傅里叶描述符


    描述轮廓的一种优雅方法是所谓的傅里叶描述符。它们考虑了一组描述物体轮廓的点（`*x*[`1]`,`*x*[`2]`,...,`*x*[`*M*]`)），其中
    `*x*[`i*]` = (`*x*`,`*y*`)可以被描述为复数序列（`*z*[`1]`,`*z*[`2]`,...,`*z*[`*M*]`)），其中：


    `*z*[`i*]` = `*x*[`i*]` + `j*y` (4.18)


    它被解释为一个实部为 `*x*`、虚部为 `*y*`的复数。从这个数据序列，可以构造一个一维周期函数 `f(*s*)` ∈ `ℂ`来描述轮廓的长度。函数 `f(*s*)`
    的傅里叶变换系数允许在频域描述物体的轮廓，其中对应低频率的系数描述了形状。


    ## 4.10 二值对象的特征


    如果你想向他人描述一个二值图像，最糟糕的策略无疑是说出图像包含的所有像素及其值（0 或 1）。这只会让对方困惑。描述图像的更好方法是使用所存在对象的特征，如对象的数量、面积、周长等。这些特征可以通过计算机处理整个图像或其某部分来轻松计算。此外，这些量可以用于区分不同类型的对象，使得模式识别技术成为可能。


    ### 4.10.1 特征


    二值对象的特征是特定的量化测量，可以通过直接计算其像素来获得。这种特征的一个简单例子是构成物体的像素数量，这可以通过简单计算涉及物体的元素数量来获得。为了唯一地描述一个物体，通常会将几个特征组合在一个向量中。这个向量代表了物体的签名（signature），可以用于分类。这组特征可以根据它们相对于其特征向量的差异来区分对象。特征尽可能应该具有鲁棒性（robust）。这意味着它们不应受到无关变化的影响，例如位移、缩放和旋转。


    ### 4.10.2 几何特征


    二值图像中的物体 `O` 可以被视为分布在二维网格上的值为 1 的点集 `*x*[`i*]` = (`*x*`,`*y*`)，即：


    `O` = {`*x*[`1]`,`*x*[`2]`,...,`*x*[`*N*]`} = {`*x*[`1]`,`*y*[`1]`),`*x*[`2]`,`*y*[`2]`),...,`*x*[`*N*]`,`*y*[`*N*]`}
    (4.19)


    对于大多数几何特征的计算，物体被视为一组在邻域下分组的 1 值。


    ### 4.10.3 周长


    物体 `O` 的周长由其外轮廓的长度决定。如图 4.24 所示，为了计算周长，必须考虑邻域类型，因为 4-邻域下的轮廓周长距离大于 8-邻域。


    在 8-邻域的情况下，水平或垂直移动（见图 4.24）的距离为 1，而对角线移动的距离为 $\sqrt{2}$。对于基于 8-邻域的链码 `C` = (`*c*[`1]`,`*c*[`2]`,...,`*c*[`*M*]`)定义的轮廓，周长的计算方式如下：


    $Perimeter(O) = \sum_{i = 1}^{M}{length(c_{i})}$ (4.20)


    其中：


    $length(c_{i}) = \{ 1 \text{ for } c=0,2,4,6; \sqrt{2} \text{ for } c=1,3,5,7
    \}$ (4.21)


    由公式 20 和 21 计算出的周长会产生一个高出真实距离的值。在这种情况下，实践中通常会对该值进行调整。因此，周长的新值通过如下方式调整得到：


    `U(*O*) = 0.95 * Perimeter(O)` (4.22)


    ### 面积


    物体 O 的面积可以通过简单累加构成物体的像素来计算。即：


    `Area(*O*) = N` (4.23)


    当需要确定面积的物体不是由像素集合描述，而是由围绕它的轮廓描述时，可以通过其内部来近似面积：


    $Area(O) = \frac{1}{2} \left| \sum_{i = 1}^{M}(x_{i} \cdot y_{(i+1)\mod M} - x_{(i+1)\mod
    M} \cdot y_{i}) \right|$ (4.24)


    其中 `*x*[`i*]` 和 `*y*[`i*]` 是点 `*x*[`1]`,`...,`*x*[`*M*]` 的坐标，这些点定义的轮廓由链码 `C` = (`*c*[`1]`,`*c*[`2]`,...,`*c*[`*M*]`)描述。面积和周长等几何特征对位移和旋转具有鲁棒性。然而，它们对缩放非常敏感。


    ### 4.10.5 紧凑性与圆度


    紧凑性定义为物体面积与其周长之间的关系。物体的周长 `U(*O*)` 通过乘以大于 1 的因子线性增长。另一方面，物体的面积呈二次增长。因此，物体 `O`
    的紧凑性 `C(*O*)` 关联了这两项。计算方式如下：


    $C(O) = \frac{Area(O)}{U^{2}(O)}$ (4.25)


    该度对于位移、旋转和缩放是不不变的。对于任何直径的圆物体，紧凑系数值为 $(1/4\pi)$。通过对前面的因子进行归一化，可以建立圆度特征：


    $R(O) = 4\pi\frac{Area(O)}{U^{2}(O)}$ (4.26)


    `R(*O*)` 评估物体与圆形元素的相似性。当物体为圆形时，`R(*O*)` 产生最大值（1），对于其他类型的对象，其值范围从 0 到 1。图 4.25
    显示了不同对象的圆度值。


    ![图 4.25 不同对象的圆度值。(a) 1.00, (b) 0.7415, 和 (c) 0.4303.](img/Fig04_25.jpg)


