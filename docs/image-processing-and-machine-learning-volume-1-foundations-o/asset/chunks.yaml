    The MATLAB image processing toolbox implements the `histeq` function, which allows
    equalizing the histogram of images to increase their contrast. `histeq` increases
    the contrast of an image by transforming the intensity levels of the image so
    that the histogram of the output image is close to a specific histogram considered
    as a reference. The function has the following structure:


    ```

    J = histeq(I, hgram)

    J = histeq(I, n)

    ```


    `J` =` histeq(I, hgram)` transforms the intensity values of the image `I` so that
    the cumulative histogram of image `J` is close to the one considered as reference
    `hgram`. The vector `hgram` must have a length that depends on the type of image
    and its characteristics. For example, for images of type uint8, we have a length
    of 256. To perform the transformation of the intensity levels of `I`, we select
    a function *f*[*T*] (pixel operation), which produces a cumulative histogram that
    minimizes the association defined by:


    $\\underset{i}{\\Sigma}\\left| {H\_{f\_{T}}\\left( {f\_{T}\\left( i \\right)}
    \\right) - H\_{\\text{hgram}}\\left( i \\right)} \\right|$ (1.28)


    where *H*[*f*[*T*]] is the cumulative histogram of the image transformed by the
    function *f*[*T*] and *H*[hgram] the cumulative histogram is considered a reference
    to which we want to approximate *H*[*f*[*T*]] by choosing *f*[*T*].


    If the vector `hgram` is not used in the function histeq, it is considered that
    the transformation performed on the image `I` is done so that its histogram approaches
    a response that is as flat as possible.


    `J` =` histeq(I, n)` transforms the intensity values of the image `I`, returning
    an image with only n different intensity values. The transformation is performed
    by mapping the intensity levels of image `I` to n different values of image `J`
    so that the histogram of `J` is approximately flat.'
  fmt: '

    The simplest binarization process that can be conducted by MATLAB is logical operations.
    The way to do this is by using the overloaded property of the logical operations.
    These operations, in the case of matrices (images), imply the evaluation of the
    logical condition for each element. The result of this operation produces ones
    and zeros for those elements that have fulfilled the logical condition. On the
    other hand, the elements with a value of zero represent those pixels whose evaluation
    of the condition is false. For example, we would have in the command line:


    ```

    >>B=A>128;

    ```


    The resulting matrix `B` will be composed of ones and zeros. Ones at those positions
    of `A` where the pixel values are greater than the threshold 128, while zeros
    at those points of `A` where the pixels did not meet the condition.


    ### 1.5.3 Contrast Adjustment with MATLAB


    MATLAB contains the function `imadjust`, which allows us to adapt the contrast
    of images to increase, decrease or adjust it. The function prototype presents
    the following structure:


    ```

    J=imadjust (I)

    J=imadjust(I,[low_in; high_in],[low_out; high_out])

    ```


    `J` =`imadjust(I)` maps the intensity values of the image `I` to new intensity
    values in image `J` such that from 1% of the data `s[low]=s[high]=1%` are considered
    to define the lower and upper limits of intensities of the image `I`. From these
    limits, it will be adjusted the contrast of the resulting image `J`. As already
    discussed above, the fact of not considering the limits of image `I`, but only
    a percentage, allows us to improve the contrast considering the complete amount
    of the data. Under such conditions, it is possible to improve the contrast of
    the image even in those cases where the contrast covers the entire image range
    but not significantly.


    `J` =`imadjust(I,[low_in; high_in],[low_out; high_out])` maps the values of the
    image `I` to new values of `J`, such that the values of image `low_in` and `high_in`
    are mapped to the new values `low_out` and `high_out` of image `J`. The values
    below `low_in` and `high_in` of the image `I` are not considered. It is possible
    to delimit the boundaries with the empty matrix `[]`, which means defining the
    boundaries with the permissible values for each type of image `[0,1]`.


    There are some additional variants of this function that, apart from considering
    the contrast enhancement, allow us to further scale the contrast by means of a
    parameter (SP). Through this parameter, it is possible to represent the way in
    which the images `I` and `J` are related when scaled. The structure of the function
    is as follows:


    ```

    J = imadjust(I,[low_in; high_in],[low_out; high_out], SP)

    ```


    This function transforms the values of `I` to obtain the values of `J`, as explained
    above. However, if `SP` is less than 1, the mapping is scaled up (brighter) for
    the `J` image values, while if `SP` is greater than 1, the scaling is done down
    (darker). For the case where `SP` is one, the adjustment is simply linear. [Figure
    1]


    ### 1.5.4 Histogram Equalization


    The goal of histogram equalization is to improve the contrast of an image by redistributing
    its intensity levels. This is done by finding a transformation function such that
    the histogram of the output image is uniform. In MATLAB, the `histeq` function
    is used to perform this operation.


    The syntax for `histeq` is:


    ```

    J = histeq(I, hgram)

    ```


    where `I` is the input image and `hgram` is an optional vector specifying the
    desired cumulative distribution. If `hgram` is not provided, the function uses
    a uniform distribution as the target cumulative distribution.


    The resulting image `J` will have a better contrast than the original `I`, especially
    in images with low contrast. This technique is particularly useful for enhancing
    the details in medical images.

    '
  trans: '


    MATLAB 可以执行的最简单的二值化过程是逻辑操作。实现这一点的方法是使用逻辑操作的重载属性。在矩阵（图像）的情况下，这些操作意味着对每个元素进行逻辑条件求值。该操作的结果是：满足逻辑条件的元素产生
    1，其余产生 0。相反，值为 0 的元素代表条件评估为假的像素。例如，我们在命令行中将得到：


    ```

    >>B=A>128;

    ```


    生成的矩阵 `B` 将由 1 和 0 组成。在 `A` 中像素值大于阈值 128 的位置为 1，而在 `A` 中不符合该条件的像素点处为 0。


    ### 1.5.3 使用 MATLAB 进行对比度调整


    MATLAB 包含 `imadjust` 函数，它允许我们调整图像的对比度以进行增加、减少或调整。该函数的原型呈现出如下结构：


    ```

    J=imadjust (I)

    J=imadjust(I,[low_in; high_in],[low_out; high_out])

    ```


    `J` =`imadjust(I)` 将图像 `I` 的强度值映射到图像 `J` 中的新强度值，其中 1% 的数据 `s[low]=s[high]=1%`
    被认为用于定义图像 `I` 强度的上下限。根据这些限制，将调整结果图像 `J` 的对比度。正如上文所述，不考虑图像 `I` 的具体限制而仅考虑百分比，这允许我们通过考虑完整数据量来提高对比度。在这种情况下，即使对比对比覆盖了整个图像范围但并不显著的情况下，也可以提高图像的对比度。


    `J` =`imadjust(I,[low_in; high_in],[low_out; high_out])` 将图像 `I` 的值映射到新值 `J`，使得图像
    `I` 的 `low_in` 和 `high_in` 值被映射到图像 `J` 的新值 `low_out` 和 `high_out`。图像 `I` 低于 `low_in`
    和 `high_in` 的值不被考虑。可以使用空矩阵 `[]` 来限定边界，这意味着使用每类图像的允许值 `[0,1]` 来定义边界。


    该函数还有一些变体，除了考虑对比度增强外，还允许我们通过参数 (SP) 进一步缩小对比度。通过此参数，可以表示图像 `I` 和 `J` 在缩放时的关系。函数的结构如下：


    ```

    J = imadjust(I,[low_in; high_in],[low_out; high_out], SP)

    ```


    该函数转换 `I` 的值以获得 `J` 的值，如上所述。然而，如果 `SP` 小于 1，则对图像 `J` 值放大（变亮），而如果 `SP` 大于 1，则进行缩小（变暗）。当
    `SP` 为 1 的情况下，调整是线性的。[图 1]


    ### 1.5.4 直方图均衡化


    直方图均衡化的目标是通过重新分布图像的强度级来提高对比度。这是通过寻找一个变换函数，使得输出图像的直方图是均匀的。在 MATLAB 中，使用 `histeq`
    函数执行此操作。


    `histeq` 的语法为：


    ```

    J = histeq(I, hgram)

    ```


    其中 `I` 是输入图像，`hgram` 是指定所需累积分布的可选向量。如果未提供 `hgram`，函数将使用均匀分布作为目标累积分布。


    生成的图像 `J` 将比原始图像 `I` 更好的对比度，特别是在低对比度图像中。这种技术对于增强医学图像中的细节特别有用。


