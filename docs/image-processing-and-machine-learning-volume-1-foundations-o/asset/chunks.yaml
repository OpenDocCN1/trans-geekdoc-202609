    *H*[*x*, *y*](*i*,*j*) = *H*[*x*](*i*) ⋅ *H*[*y*](*j*) (2.23)


    A prominent case is a Gaussian function *G*[*σ*](*x*,*y*) which can be partitioned
    as the product of two one-dimensional functions as follows:'
