    ## 1.4 Gamma Correction


    So far, in this book, the word “intensity” has been used several times, with the
    understanding that the pixel values of an image are somehow related to these concepts.
    However, how does the value of a pixel actually relate to the amount of light
    on a monitor or to the number of toner particles that the laser printer needs
    to form a certain intensity value on the paper? In general, the relationship between
    the intensity value of a pixel and its respective physical measurements is complex
    and, in all cases, non-linear. Therefore, it is important to know at least approximately
    the nature of these relationships and thus to be able to predict the appearance
    of images on different media.'
