    对比度的定义可以理解为给定图像中所使用的强度值范围，或者简之，就是图像中存在的像素的最大强度值与最小强度值之间的差。全对比图像使用了为图像定义的从 `0`
    到 `K − 1`（黑到白）的完整强度级范围。因此，使用直方图很容易观察图像的对比度。图 1.11 显示了通过生成的直方图观察图像的不同对比度设置。


    ![FIGURE 1.11 图显示了图像中不同的对比及其对直方图各自的影响。(a) 正常对比及其直方图 (c)；(b) 低对比度及其直方图 (d)。](img/Fig01_11.jpg)


    `FIGURE 1.11` 图显示了图像中不同的对比及其对直方图各自的影响。(a) 正常对比及其直方图 (c)；(b) 低对比度及其直方图 (d)。


    ### 1.3.2.3 动态范围


    在动态范围这一术语下，我们指的是图像中使用的不同像素的数量。当目标图像使用了所有可用强度值范围 `K` 时，图像呈现出理想情况。在这种情况下，整个强度值区域被完全覆盖。如果图像覆盖的强度值区域小于全范围（`a[min]=0`、`a[max]=K−1`），使得：


    `a[min]  > 0 or a[max]  < K  − 1` (1.9)


    它会产生一张动态范围较差的图像。之所以认为很差，是因为当该范围内的所有强度值都出现在图像中时，适当的动态范围达到最大（图 1.12）。


    ![FIGURE 1.12 图像中不同的动态范围及其对直方图的影响。(a) 高动态范围，(b) 20 强度级的低动态范围，(c) 仅有 8 个强度级的极低动态范围，(d)
    (a) 的直方图，(e) (b) 的直方图，以及 (f) (c) 的直方图。](img/Fig01_12.jpg)


    `FIGURE 1.12` 图像中不同的动态范围及其对直方图的影响。(a) 高动态范围，(b) 20 强度级的低动态范围，(c) 仅有 8 个强度级的极低动态范围，(d)
    (a) 的直方图，(e) (b) 的直方图，以及 (f) (c) 的直方图。


    只要不超过像素强度范围的最大值，图像的对比度就可以，但图像的动态范围不能很高（除非通过像素强度值的插值）。高动态范围对图像具有具有优势，因为通过后续处理步骤丢失图像质量的风险降低了。因此，数字相机和专业扫描仪的分辨率高于
    8 位，通常为 12–14 位，即使图像显示元素的正常分辨率为 256。


    ### 1.3.3 使用 MATLAB 计算图像直方图


    本节解释了图像处理工具箱中可以计算和显示包含的图像直方图的 MATLAB 函数 [5]。


    #### 1.3.3.1 MATLAB 命令行函数


    图像处理工具箱用于计算图像直方图的函数格式如下：


    ```

    [counts,x]=imhist(I, n)

    ```


    该函数计算并显示图像 `I` 的直方图。如果没有指定 `n`，直方图值的数量取决于涉及的类型。如果 `I` 对应灰度图像，函数将使用 256 个值进行计算和显示。如果
    `I` 代表二值图像，函数将仅用两个值计算直方图。


    如果指定了 `n`，则使用 `n` 个强度值而不是由类型指定的数值来计算并显示直方图。变量 `counts` 表示一个包含像素数量的向量。


    ### 1.3.4 直方图


