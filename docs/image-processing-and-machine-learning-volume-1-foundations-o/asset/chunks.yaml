- raw: 'The most natural way to represent images is by means of a matrix, in which
    each element of intensity or color corresponds to a position in the matrix. Using
    this representation, most programming languages can easily and elegantly manipulate
    images. A possible disadvantage of this representation is that the structure of
    the image is not considered. That is, it makes no difference whether the image
    contains a couple of lines or a complex scene, so the amount of memory needed
    to store it will only depend on its dimensions, not on its content.


    Binary objects can be represented as a logical mask, where inside an object will
    have the value of one and outside the value of zero ([Figure 4.22](#C_007_c4.xhtml#f4_22)).
    Because a logical value only needs one bit to be represented, such an array type
    is called a bitmap.


    ![FIGURE 4.22 Use of a binary image as a mask for the specification of regions.
    (a) Original image, (b) binary mask, and (c) masked image.](images/Fig04_22.jpg)


    [**FIGURE 4.22**](#C_007_c4.xhtml#f4_22b) Use of a binary image as a mask for
    the specification of regions. (a) Original image, (b) binary mask, and (c) masked
    image.


    ### 4.9.1 Length Encoding


    Under this code, pixels are grouped together into blocks and represented by the
    description of these blocks contained in the image. Therefore, a block is a sequence
    of pixels whose value is one and that are distributed along either a row or a
    column. The compact way to represent these blocks is through a vector such that:


    Block = row, column, length (4.11)


    [Figure 4.23](#C_007_c4.xhtml#f4_23) shows an image and its representation under
    length encoding. This type of representation, as can be seen, is easy and fast
    to calculate and is even still used as a compression method by the TIFF and GIF
    formats.


    ![FIGURE 4.23 Length encoding example. This encoding method groups the pixels
    with a value of one, considering the rows as the grouping direction.](images/Fig04_23.jpg)


    [**FIGURE 4.23**](#C_007_c4.xhtml#f4_23b) Length encoding example. This encoding
    method groups the pixels with a value of one, considering the rows as the grouping
    direction.


    ### 4.9.2 Chain Code


    The objects present in an image can be represented not only by describing their
    area (as was the case for length encoding) but also through their contours. A
    classic form of this type of representation is the so-called chain encoding or
    Freeman code. By this method, the contours are represented starting from a reference
    point **p**[*s*] as a sequence of numbers that represent the changes in position
    through the contour ([Figure 4.24](#C_007_c4.xhtml#f4_24)). Therefore, for a closed
    contour defined by the sequence of points *B* = (*x*[1],*x*[2],...*x*[*M*]), the
    corresponding chain code is produced as the sequence *C*[*C*] = (*c*[1],*c*[2],...,*c*[*M*]),
    where:


    ![FIGURE 4.24 Chain codes based on the (a) 4-neighbor (a) and 8-neighbor. To calculate
    the chain codes, it is necessary to process the contour starting from the starting
    or reference point ps. The relative position of the neighboring pixels belonging
    to the contour determines the encoded direction value.](images/Fig04_24.jpg)


    [**FIGURE 4.24**](#C_007_c4.xhtml#f4_24b) Chain codes based on the (a) 4-neighbor
    (a) and 8-neighbor. To calculate the chain codes, it is necessary to process the
    contour starting from the starting or reference point ***p****s*. The relative
    position of the neighboring pixels belonging to the contour determines the encoded
    direction value.


    $\\begin{array}{rcl} c\_{i} & = & {\\text{code}\\left( {\\Delta x\_{i},\\Delta
    y\_{i}} \\right)} \\\\ \\left( {\\Delta x\_{i},\\Delta y\_{i}} \\right) & = &
    \\left\\{ \\begin{matrix} {\\left( {x\_{i + 1} - x\_{i},y\_{i + 1} - y\_{i}} \\right)\\,\\text{for}\\,
    0 \\leq i < M\\operatorname{}} \\\\ {\\left( {x\_{1} - x\_{i},y\_{1} - y\_{i}}
    \\right)\\,\\text{for}\\, i = M} \\\\ \\end{matrix} \\right. \\\\ \\end{array}$
    (4.12)


    and the code (*Δ**x*[*i*],*Δ**y*[*i*]) is calculated from the data in [Table 4.1](#C_007_c4.xhtml#t4_1).


    [**TABLE 4.1**](#C_007_c4.xhtml#t4_1b) Value Calculation of Code (*Δ**x*[*i*], *Δ**y*[*i*])


    | *Δ**x*[*i*] || 1 || 1 || 0 || ‒1 || ‒1 || ‒1 || 0 || 1 |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    | *Δ**y*[*i*] || 0 || 1 || 1 || 1 || 0 || ‒1 || ‒1 || ‒1 |


    | código (*Δ**x*[*i*],*Δ**y*[*i*]) || 0 || 1 || 2 || 3 || 4 || 5 || 6 || 7 |


    Chain codes are compact in their definition since they specify only the absolute
    coordinates from a reference point **p**[*s*]. Furthermore, since the change in
    position between one point and another is specified by a parameter that has only
    eight possible values, it is feasible to use only 3 bits to encode each coefficient
    of the code.


    ### 4.9.3 Differential Chain Code


    Under the representation of chain code, it is not possible to compare two different
    objects. This is due, first, to the fact that the description is dependent on
    the starting point **p**[*s*]. Then, the fact that a 90° rotation produces the
    description of a totally different contour. One way to solve this issue is through
    the use of the differential chain code. In this approach, instead of representing
    the directions of pixels in the contour, the differential chain code registers
    the changes in direction along the contour. Therefore, for a chain code represented
    by the sequence *C*[*C*] = (*c*[1],*c*[2],...,*c*[*M*]), its differential chain
    code *C*[*D*] = (*c*^′[1],*c*^′[2],...,*c*^′[*M*]) is obtained so that each parameter
    *c*[*i*]^′ is calculated as follows:


    ${c^{\\prime}}\_{i} = \\left\\{ \\begin{matrix} {\\left( {c\_{i + 1} - c\_{i}}
    \\right){mod}\\operatorname{}\\text{8}\\,\\text{for}\\,\\text{0} \\leq i < M}
