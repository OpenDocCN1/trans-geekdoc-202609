    接下来，将讨论 Harris 算法编程中必须考虑的一些重要方面。第一个有趣的点出现在数组 `U(x,y)` 以及 `S(x,y)` 被初始化为零时。这种操作在那些具有某些特殊特征像素的应用中是标准情况，而这些像素的数量显然远少于图像的大小。


    考虑到上述，将数组初始化为零并将满足特定属性的元素放入其中要实用得多，且速度更快。所实现的平滑预滤波器是一个“箱形”（Box）类型滤波器，具有 3 × 3
    的掩码，而用于计算梯度的滤波器是等式 5.14 中定义的那些。在程序 5.1 中在图像和滤波器之间执行的所有操作都是通过书中之前章节详细讨论的 MATLAB
    `imfilter` 函数完成的。


    由于计算结构体矩阵元素元素的操作是逐元素处理的过程，因此是通过应用 MATLAB 点运算符来完成的，即考虑以下表达式：


    `A * B` (5.16)


    `A . B` (5.17)


    第一个 (5.16) 意味着图像 `A` 和 `B` 之间的矩阵乘法，而第二个 (5.17) 定义了矩阵 `A` 和 `B` 所有元素之间的点对点乘法。


    程序 5.1 的另一个重要部分由步骤 3 表示。它集成了为了选择区域内 `V(x,y)` 值最大的像素的必要指令。为了编写此过程，对图像进行逐像素的顺序处理，找到目标点周围建立的邻域块或区域的最大值。为了做到这一点，块的边界相对于相对于像素位置进行设置。在程序
    5.1 中，间隔被设置为 10。因此，考虑到两个方向，总大小为 20。一旦确定了边界，就会提取块并找到最大值。如果块的最大值对应于块的中心像素，则在 `S(x,y)`
    位置处设置为 1。因此，`S(x,y)` 中的 1 代表在图像中找到的角点。图 5.3 显示了在目标点周围考虑的邻域内寻找最大值的过程。


    一旦点存储在 `S(x,y)` 中，对其进行绘制。为了执行此过程，首先使用 MATLAB 常用的显示函数 `imshow` 显示图像。然后，使用 `hold`
    命令保持图像，并使用 `plot` 命令在上面逐个绘制点，在每个点放置一个加号 `+`。图 5.6 显示了在示例图像上执行程序 5.1 后检测到的角点位置。


