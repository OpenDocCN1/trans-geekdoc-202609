    Under these circumstances, the variance within classes can be defined in terms
    of their variances according to the following expression:


    `σ*[`D*`]²` = `w*[`A*`]((`*k*`)` ⋅ `σ*[`A*`]²(`*k*`)` + `w*[`B*`]((`*k*`)` ⋅ `σ*[`B*`]²(`*k*`)`
    (4.4)


    Considering this formulation, the Otsu method searches for the optimal threshold
    that represents the intensity level `k`, which minimizes the variance within the
    classes (Equation 4.4). Therefore, the objective is to determine the variance
    value of each object so small that it can minimize their overlap. With the models
    defined so far, an algorithm could attempt all the possible values of `k` and
    return the element for which the value of `σ*[`D*`]²` is minimum. However, it
    is possible to develop a recursive formulation that implies faster computation.
    This requires calculating several terms, such as the total variance and the variance
    between objects or classes.


    The total variance of the distribution calculates the variance of the entire histogram.
    Thus, its calculation is defined as follows:


    $\sigma\_{T}^{2} = {\\sum\limits\_{i = 0}^{L - 1}{\\left( {i - \mu\_{T}} \right)^{2}
    \cdot h\left( i \right)}}$ (4.5)


    where `μ*[`T*`]` represents the average intensity of the histogram that represents
    the distribution:


    $\mu\_{T} = {\\sum\limits\_{i = 0}^{L - 1}{i \cdot h\left( i \right)}}$ (4.6)


    Finally, the variance between classes `σ*[`E*`]²` can be considered as the subtraction
    between the total variance `σ*[`T*`]²` and the variance within the classes or
    objects `σ*[`T*`]²`. Therefore, `σ*[`E*`]²` is defined by the following expression:


    $\begin{array}{ccl} \sigma\_{E}^{2} & = & {\\sigma\_{T}^{2} - \\sigma\_{D}^{2}}
    \\ & = & {{{w\\left( k \\right)} \\cdot \\left( {{\\mu\_{A}\\left( k \\right)}
    - \\mu\_{T}} \\right)^{2}} - {\\left( {1 - {w\\left( k \\right)}} \\right) \\cdot
    \\left( {{\\mu\_{B}\\left( k \\right)} - \\mu\_{T}} \\right)}} \\ & = & {{w\\left(
    k \\right)} \\cdot \\left( {1 - {w\\left( k \\right)}} \\right) \\cdot \\left(
    {{\\mu\_{A}\\left( k \\right)} - {\\mu\_{B}\\left( k \\right)}} \\right)^{2}}
    \\ \\end{array}$ (4.7)


    Since the total variance is always constant and independent of the intensity level
    `k`, the effect of calculating the optimal threshold depends on only the variances
    `σ*[`E*`]²` and `σ*[`D*`]²`. Therefore, minimizing the variance within the classes
    `σ*[`D*`]²` is equivalent to maximizing the variance between the classes `σ*[`E*`]²`.
    The advantage of maximizing `σ*[`E*`]²` is that it can be computed recursively
    as the values of `k` are iterated. Under such conditions, the equations for this
    recursion are defined below, considering that their initial values are `w*(1)` = `h*(1)`
    and `μ*[`A*`](0)` = 0.


    $\begin{matrix} {w\\left( {k + 1} \\right) = w\\left( k \\right) + h\\left( {k
    + 1} \\right)} \\ {\\mu\_{A}\\left( {k + 1} \\right) = \\frac{\\left( {w\\left(
    k \\right) \\cdot \\mu\_{A}\\left( k \\right) + \\left( {k + 1} \\right) \\cdot
    h\\left( {k + 1} \\right)} \\right)}{w\\left( {k + 1} \\right)}} \\ {\\mu\_{B}\\left(
    {k + 1} \\right) = \\frac{\\left( {\\mu\_{T} - w\\left( {k + 1} \\right) \\cdot
    \\mu\_{A}\\left( {k + 1} \\right)} \\right)}{1 - w\\left( {k + 1} \\right)}} \\
    \\end{matrix}$ (4.8)


    By using these expressions, it is possible to update `σ*[`E*`]²` and test if its
    value is the maximum as the intensity level `k` increases progressively. This
    simple optimization method can be used without problems because the function `σ*[`E*`]²` is
    is always smooth and unimodal. [Program 4.1](#C_007_c4.xhtml#p4_1) shows the implementation
    of the Otsu method. In the program, a color image is first transformed into a
    grayscale image. Then the Otsu method is implemented according to the steps shown
    in Equations 4.1–4.8. [Figure 4.9](#C_007_c4.xhtml#f4_9) shows the original image
    and the binarization result obtained by [Program 4.1](#C_007_c4.xhtml#p4_1).

