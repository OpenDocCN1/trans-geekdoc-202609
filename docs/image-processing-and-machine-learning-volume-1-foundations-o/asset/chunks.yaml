    # 1 像素操作


    DOI: [10.1201/9781003287414-1](https://doi.org/10.1201/9781003287414-1)


    ## 1.1 引言


    像素操作是指对图像执行的操作，其中仅考虑图像中感兴趣的像素值 `p = I(x,y)` [1]。计算出的每个新像素值 `p′ = I′(x,y*)` 取决于相同位置原始像素
    `p = I(x,y)` 的值。因此，它独立于其他像素（例如其最近邻域）的值。新像素值通过函数 `f[I(x,y)]` 确定：


    `f[I(x,y)]→I′(x,y)` (1.1)


    图 1.1 显示了此类操作的表示。如果像上一个例子一样，函数 `f(⋅)` 独立于图像坐标，则它的值不依赖于像素位置，该函数被称为齐次函数。典型的齐次操作示例包括：


    ![图 1.1 像素操作的表示，其中结果像素仅取决于作用于原始像素函数的值](img/Fig01_01.jpg)


    **图 1.1** 像素操作的表示，其中结果像素仅取决于作用于原始像素函数的值。


    * 图像的对比度和照明变化

    * 某些照明曲线的应用

    * 图像的反转或补色

    * 图像的阈值分割

    * 图像的伽马校正

    * 图像的色彩变换


    另一方面，非齐次像素操作不仅考虑目标像素的值，还考虑它在图像中的相对位置，即 `I′(x,y)`。


    `g[I(x,y),x,y]→I′(x,y)` (1.2)


    使用非齐次操作对图像的一种频繁操作是根据像素在图像中的位置改变图像的对比度或照明。在这种情况下，某些图像像素将发生巨大变化，而其他元素仅产生微小影响。


    ## 1.2 改变像素强度值


    ### 1.2.1 对比与照明或亮度


    图像的对比度可以定义为整个图像中存在的不同强度值之间的关系 [2]。对比度与强度的分布有关。在这种情况下，某些图像像素会被强烈改变，而其他元素将表现出微小影响。如果如前一个例子所示，当强度值集中在较低强度处，则图像会变暗。反之，如果强度值集中在较高强度处，则图像会变亮。为了说明这些情况，通过齐次操作增加图像的对比度或亮度，这等同于作用于于像素像素的像素。因此，这种函数可以定义为：


    `f[I(x,y)]→I′(x,y)` (1.1)


    在 3] 这种情况下，使用齐次操作来图像的对比亮度，这种函数可以定义为：


    `f[I(x,y)]→I′(x,y)` (1.1)


