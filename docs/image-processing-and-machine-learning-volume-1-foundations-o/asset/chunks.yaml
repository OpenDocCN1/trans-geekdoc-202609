    5.14. All operations performed between images and filters in [Program 5.1](#C_008_c5.xhtml#p5_1)
    are performed by the MATLAB imfilter function discussed in detail in previous
    sections of this book.


    The operations executed for the calculation of the elements of the matrix of structures,
    as they are element-by-element processes, are carried out by applying the MATLAB
    dot operator, that is, considering the expressions


    *A* \* *B* (5.16)


    *A*. \* *B* (5.17)


    The first (5.16) implies matrix multiplication between the images *A* and *B*,
    while the second (5.17) defines point-to-point multiplication between all the
    elements of the matrices *A* and *B*.


    Another important part of [Program 5.1](#C_008_c5.xhtml#p5_1) is represented by
    step 3. It integrates the necessary instructions for selecting the pixels whose
    *V*(*x*,*y*) value is maximum within a region. To program this procedure, the
    image is sequentially processed pixel by pixel, finding the maximum value of a
    neighborhood block or region established around the point in question. To do this,
    the limits of the block are set relative to the pixel position in question. In
    the case of [Program 5.1](#C_008_c5.xhtml#p5_1), the interval is set equal to
    10. Therefore, considering both directions, the total size is 20. Once the limits
