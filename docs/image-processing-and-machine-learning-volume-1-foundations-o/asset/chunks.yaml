    ### 1.2.4 Segmentation by Threshold


    Segmentation by thresholding can be considered a special form of quantification
    in which the image pixels are divided into two classes depending on their relationship
    with a predefined threshold value *p*[th]. All pixels in the image assume two
    different values *p*[0] or *p*[1] depending on their relationship to the threshold,
    formally defined as:


    $f\_{\\text{th}}\\left( p \\right) = \\left\\{ \\begin{matrix} {p\_{0}\\text{~\\
    \\ si~}p < p\_{\\text{th}}} \\\\ {p\_{1}\\text{~\\ \\ si~}p \\geq p\_{\\text{th}}}
    \\\\ \\end{matrix} \\right.$ (1.7)


    where 0 < *p*[th] < *p*[max]. A frequent application of this operation is the
    binarization of a grayscale image by considering a *p*[0] = 0 y *p*[1] = 1. An
    example of applying segmentation by using thresholding on an image is shown in
    [Figure 1.5](#C_004_c1.xhtml#f1_5). The effect of binarization can be clearly
    seen in the resulting histogram of the image, where the whole distribution is
    divided into only two parts *p*[0] y *p*[1] as shown in [Figure 1.6](#C_004_c1.xhtml#f1_6).


    ![FIGURE 1.5 Example showing the application of segmentation by using thresholding
    on an image, considering p0 = 0, p1 = 1 y pth = 80. In addition, (c) and (d) show
    the respective histograms of (a) and (b).](images/Fig01_05.jpg)


    [**FIGURE 1.5**](#C_004_c1.xhtml#f1_5b) Example showing the application of segmentation
    by using thresholding on an image, considering *p*[0] = 0, *p*[1] = 1 y *p*[th]
    = 80. In addition, (c) and (d) show the respective histograms of (a) and (b).


    ![FIGURE 1.6 The effect of the binarization operation on the histogram. The threshold
    value is pth. (left) Original histogram and (right) histogram resulting from the
    operation, concentrating their values at two different points. p0 y p1.](images/Fig01_06.jpg)


    [**FIGURE 1.6**](#C_004_c1.xhtml#f1_6b) The effect of the binarization operation
    on the histogram. The threshold value is *p*[th]. (left) Original histogram and
    (right) histogram resulting from the operation, concentrating their values at
    two different points. *p*[0] y *p*[1].


    ## 1.3 Histogram and Pixel Operations


    In some cases, the effects of pixel operations can be easily detected through
    the histogram. Histograms can be considered as a statistical index of the image.
    It is usually used as an element to assist in the evaluation of important properties
    of an image \[[4](#C_004_c1.xhtml#r1_4)\]. Especially, errors produced in image
    acquisition are easily recognized through the use of histograms. In addition to
    the ability to deal with the problems mentioned above, it is also possible to
    pre-process the image based on the histogram to improve it or to highlight features
    of the image that will be extracted or analyzed in later processing steps (e.g.,
    by considering a pattern recognition system in the image).


    ### 1.3.1 Histogram


    Histograms are elements that describe the frequency at which the intensity values
    (pixels) of the image are distributed. In the simplest case, histograms are best
    understood when they describe the distribution of grayscale images. An example
    is shown in [Figure 1.7](#C_004_c1.xhtml#f1_7). For a grayscale image *I*(*u*,*v*)
    with intensities in the range \[0,*K*−1\] generate a histogram *H* with exactly
    *K* different values. Therefore, for a typical 8-bit grayscale image, a histogram
    will use *H* = 2⁸ = 256. Each element of the histogram is defined as *h*(*i*),  corresponding
    to the number of pixels in the image with an intensity value *i*, for all values
    of 0 ≤ *i* < *K*. This can be expressed as follows:


    ![FIGURE 1.7 (a) 8-bit intensity (grayscale) image and (b) its histogram.](images/Fig01_07.jpg)


    [**FIGURE 1.7**](#C_004_c1.xhtml#f1_7b) (a) 8-bit intensity (grayscale) image
    and (b) its histogram.


    *h*(*i*) = card¹{(*u*,*v*)|*I*(*u*,*v*)=*i*} (1.8)


    *h*(0) is then the number of pixels with the value 0, *h*(1) the number of pixels
    that have the value of 1, and so on, while finally *h*(255) represents the number
    of white pixels (with the maximum intensity value) in the image. As a result of
    the histogram calculation, a one-dimensional vector *h* with a length *K* is obtained,
    as shown in [Figure 1.8](#C_004_c1.xhtml#f1_8) where *K* = 16.


