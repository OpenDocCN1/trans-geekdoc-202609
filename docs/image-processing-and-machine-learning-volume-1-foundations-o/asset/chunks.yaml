    {I\left( {x,y + 1} \right)} & + \\ \end{matrix} & {I\left( {x + 1,y + 1} \right)}
    \\ \end{matrix} \end{bmatrix} \right.$ (2.2)


    也可以用紧凑的形式描述如下：


