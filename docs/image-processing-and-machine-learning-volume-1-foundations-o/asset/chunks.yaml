    ## 4.4 最佳阈值


    `median filter` 的使用并不总是允许消除直图中图中密度之间的重叠。在这种情况下，必须计算出一个产生最少对象 A 像素被分类为对象 B 的最佳阈值。这样，最佳阈值对应于两个分布之间的截距。图
    4.7 图显示了假设分布的最佳阈值。图中显示了具有重叠区域 `T` 的对象 A 和 B 的分布；从图中，交点清晰地代表了定义每个类别边界的位置。


