- raw: 'Gamma correction is a pixel operation that compensates for the different image
    acquisition conditions and allows the display of different characteristics by
    using a general space of intensities \[[7](#C_004_c1.xhtml#r1_7)\]. The expression
    gamma originally comes from classical photography, where there is an approximately
    logarithmic relationship between the amount of illumination and the resulting
    density of the photographic film. The so-called illumination function represents
    this relationship and is distributed over a relatively large region in the form
    of an ascending line (see [Figure 1.22](#C_004_c1.xhtml#f1_22)). The slope of
    the illumination function within its dispersion region is traditionally defined
    as the gamma of the photographic film. Later in the television industry, the problem
    of image distortion due to the nonlinearity of the cathode ray tube was confronted,
    and the concept of gamma was adopted to describe it. Therefore, the television
    signal is corrected by the television station before sending it to the receiver,
    which is called gamma correction, so this correction compensates for the distortion
    made by the TV.


    ![FIGURE 1.22 Illumination function for photography. The function relates the
    logarithmic magnitude of the illumination to the resulting photographic film density
    over a relatively large region. The slope of the function is defined as gamma
    (γ) of the photographic film \\gamma = \\frac{\\Delta D}{\\Delta B}.](images/Fig01_22.jpg)


    [**FIGURE 1.22**](#C_004_c1.xhtml#f1_22b) Illumination function for photography.
    The function relates the logarithmic magnitude of the illumination to the resulting
    photographic film density over a relatively large region. The slope of the function
    is defined as gamma (*γ*) of the photographic film $\\gamma = \\frac{\\Delta D}{\\Delta
    B}$.


    ### 1.4.1 The Gamma Function


    The basis for the gamma correction is the gamma function, which can be defined
    as follows:


    $\\begin{array}{ccl} b & = & {f\_{\\gamma}\\left( a \\right) = a^{\\gamma}} \\\\
    b & = & {f\_{\\gamma}\\left( a \\right) = a^{\\gamma}} \\\\ a & \\in & {{\\mathbb{R}},\\operatorname{}\\gamma
    > 0} \\\\ \\end{array}$(1.23)


    where the parameter γ is the so-called gamma factor. The gamma function is used
    only within the interval \[0,1\], and the function produces a value from (0,0)
    to (1,1). As shown in [Figure 1.23](#C_004_c1.xhtml#f1_23), when *γ* = 1, we have
    *f*[*γ*](*a*) = *a* (identity), generating a line from (0,0) to (1,1). For values
    of *γ* < 1, the function is displayed above the line. For the case *γ* = 1, if
    *γ* > 1, the function is below the line, where the curvature of the function increases
    in both directions (above and below the line) as long as *γ* is different from
    1.


    ![FIGURE 1.23 Gamma function b = aγ for different values of γ.](images/Fig01_23.jpg)


    [**FIGURE 1.23**](#C_004_c1.xhtml#f1_23b) Gamma function *b* = *a*^γ for different
    values of *γ*.


    The gamma function is controlled only by the parameter *γ* and behaves with monotonical
    increments in the interval \[0,1\], so it is invertible, such that:


    $a = f\_{\\gamma}^{- 1}\\left( b \\right) = b^{1/\\gamma} = f\_{\\overline{\\gamma}}\\left(
    b \\right)$ (1.24)


    The same is applicable to the case of the gamma value with $\\overline{\\gamma}
    = \\frac{1}{\\gamma}$.


    The specific values of *γ* for different devices are usually specified by the
    manufacturer and obtained from measurements. For example, the nominal values for
    *γ* of a standard cathode ray tube are between 1.8 and 2.8, with a typical value
    of 2.4 for a standard LCD monitor.


    ### 1.4.2 Use of Gamma Correction


    To illustrate the use of gamma correction, it is assumed that a camera distorts
    the image with a value *γ*[*c*]. It produces an output signal *s* because of the
    occurrence of the illumination value under the following relationship:


    *s* = *B*^(*γ*[*c*]) (1.25)


    To compensate for this distortion, we apply an inverse gamma correction to the
    camera output signal. ${\\overline{\\gamma}}\_{c}$ will allow us to recover the
    original signal. This operation can be formulated as follows:


    $b = f\_{{\\overline{\\gamma}}\_{c}}\\left( s \\right) = s^{1/\\gamma\_{c}}$ (1.26)


    From this formulation, it can be observed that:


    $b = s^{1/\\gamma\_{c}} = \\left( B^{\\gamma\_{c}} \\right)^{1/\\gamma\_{c}} =
    B^{\\frac{\\gamma\_{c}}{\\gamma\_{c}}} = B^{1} = B$ (1.27)


    The corrected signal *b* is identical to the light intensity. Under this operation,
    the distortion produced by the camera is eliminated. [Figure 1.24](#C_004_c1.xhtml#f1_24)
    shows an illustration of this process. The rule of thumb is to find the distortion
    *γ*[*D*] for the device in question and compensate for it through gamma correction
    ${\\overline{\\gamma}}\_{D}$.


    ![FIGURE 1.24 Principle of gamma correction. To correct the distortion \\gamma\_{c}
    presented by a camera, it is necessary to apply the gamma correction \\overline{\\gamma\_{c}}
    in such a way that the combination of both generates the elimination of the distortion.](images/Fig01_24.jpg)


    [**FIGURE 1.24**](#C_004_c1.xhtml#f1_24b) Principle of gamma correction. To correct
    the distortion *γ*[*c*] presented by a camera, it is necessary to apply the gamma
    correction $\\overline{\\gamma\_{c}}$ in such a way that the combination of both
    generates the elimination of the distortion.


    Everything discussed above assumes that all values are in the interval \[0,1\].
    Obviously, this is not always the case, particularly when dealing with digital
    images in the range \[0,255\]. Considering this, for applying the gamma correction,
    the only thing to do is to scale the image interval to values between 0 and 1
    and then apply the gamma correction as discussed in this section.


    ## 1.5 MATLAB Pixel Operations


    Once we have covered the theoretical foundations in previous sections, we will
    present how to use MATLAB tools to perform pixel operations on images. These tools
    involve using MATLAB as a programming language (.m file extension) and functions
    belonging to the image processing and computer vision toolboxes.


    ### 1.5.1 Changing Contrast and Illumination in MATLAB


    To increase the contrast using MATLAB, it is necessary to multiply the image by
    a positive constant so that the histogram of the resulting image becomes wider.
    The following command assumes that *A* is an image, and the contrast is raised
    by 50% so that the image is multiplied by 1.5, leaving its result in *B*.


    ```

    >>B=A*1.5;

    ```


    To increase the illumination of an image in MATLAB, add to the image the number
    of levels to which you want to increase the illumination. With this operation,
    we will make the histogram move in any direction according to the added number
    of levels. The following command assumes that we want to increase the illumination
    of image *A* by 10 levels, so we add 10 to this matrix, producing the result in
    *B*.


    ```

    >>B=A+10;

    ```


    ### 1.5.2 Segmenting an Image by Thresholding Using MATLAB


    Although segmentation and binary image processing will be covered in depth in
    another chapter, this section briefly introduces thresholding, but only as a pixel
    operation, and how to perform it using MATLAB commands.


    Using the functions of the MATLAB image processing toolbox, it is possible to
    segment an image depending on the intensity level of the objects presented in
    the scene.


    To perform the segmentation process by thresholding, it is only necessary to define
    the intensity level (threshold) from which the elements of the image can be classified
    into two classes. Those above this value will be considered as a particular class,
    while those below this value will be considered another class.


