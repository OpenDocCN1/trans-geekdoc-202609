    FIGURE 2.15 函数 $\delta$ 与滤波器 $H$ 卷积的结果。


    $H$ *\delta$ =$H$ (2.28)


    如果滤波器的属性和特性不可知，那么应用这一属性是有意义的。狄拉克δ塔函数被看作图像时，被可视化为坐标原点处的一个亮点，周围是无限多个黑点区域。图 2.13
    展示了二维狄拉克δ塔函数以及如何将其构想成图像。


