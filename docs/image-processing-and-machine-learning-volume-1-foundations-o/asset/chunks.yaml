    **图 4.14** 标记过程的传播。(a) 原始图像。在 (b) 中找到了其中一个第一个像素，其所有邻居像素均为 0。因此，该像素接收标签 2 (c)。在下一次迭代中
    (d)，一个邻居像素的标签为 2，因此当前像素将此值作为自己的标签。在 (e) 中，有两个标签为 2 和 5 的邻居像素，当前像素将采用其中一个值，并且所发生的冲突应被标记为
    2, 5。


    ### 4.7.3 邻接标记


    如果两个或多个邻居包含不同的标签，则会发生标签冲突；即组合在一起形成相同对象的像素具有不同的标签。例如，一个“U”型形状的物体其左侧和右侧被分配了不同的标签；这是因为在掩码沿图像移动的过程中，无法识别出该物体在底部是连接的。


    当同一个物体上出现两个不同的标签时（如前面的案例所示），就会发生标签冲突。这种冲突不会在步骤 1 中直接处理，而仅记录以便在步骤 2 中进一步处理。冲突的数量取决于图像的内容，并且只有在步骤
    1 完成后才能确定。


    作为第一步的结果，我们得到了一张像素被临时标记的图像，以及一个属于同一对象的像素之间检测到的冲突列表。图 4.15a 显示了步骤 1 后的图像结果；所有像素都有临时标签，而冲突通过圆圈记录并标记为
    `2, 4`、`2, 5` 和 `2, 6`。借此，我们得到了标签 `E = {2,3,4,5,6,7}` 和冲突 `C = {2,4,2,5,2,6}`，它们对应于图
    4.15b 所示的无向图的节点。


    ![图 4.15 标记标记过程中步骤 1 的结果。标签冲突用圆圈 (a) 表示，标签和 (b) 对应于图节点的冲突。](img/Fig04_15.jpg)


    **图 4.15** 标记标记过程中步骤 1 的结果。标签冲突用圆圈 (a) 表示，标签和 (b) 对应于图节点的冲突。


    ### 4.7.4 冲突解决（步骤 2）


    第二次扫描的任务是解决第一遍扫描记录的冲突。这个过程并不容易，因为两个临时属于不同对象的不同标签可能会通过第三个物体连接。这项任务等同于寻找图的连通分量，其中步骤
    1 计算的标签 `E` 代表图的节点，而冲突 `C` 代表它们的连接（图 4.15）。


    在统计属于同一物体的不同标签后，该物体每个像素的标签值将被替换为该物体内最小标签对应的通用标签（参见图 4.16）。


    ![图 4.16 第二步之后物体标记过程的结果。所有临时分配的标签都被替换为物体包含的最小数值标签](img/Fig04_16.jpg)


    **图 4.16** 第二步之后物体标记过程的结果。所有临时分配的标签都被替换为物体包含的最小数值标签


    在本节中，描述了通过标记来识别二值图像中存在物体数量的算法。执行该算法后的想法是为图像中包含的每个物体分配一个标签，以便于识别识别。


    ### 4.7.5 使用 MATLAB 实现物体标记算法


    本节解释了如何实现算法 4.1 中描述的物体标记程序。程序 4.1 在 MATLAB 中实现了算法所划分的三个步骤中的每一个步骤。在第一步中，从右到左、从上到下对图像进行处理。通常，在此过程中，根据像素是否没有已标记的邻居或有一个或多个已标记的邻居，为图像的每个像素分配一个临时标签。在第二步中，通过考虑属于具有邻域冲突区域的像素来解决记录的冲突。该过程通过两个嵌套的
    `for` 循环实现，允许对图像中的每个元素进行标签交换。用于标签交换的 for 循环由最小标签编号决定（与相关的其他标签进行比较）。在第三步中，重新分配标签。在第三步中，由于冲突的解决，几个标签被消除了。一旦获得了标签的绝对数量，使用
    for 循环重新分配标签将非常简单。


    为了实现这一点，使用了 `unique` 函数。


    ```matlab

    b = unique(A)

    ```


    其中 `A` 是矩阵，`b` 是一个包含唯一值的向量。


    图 4.17 显示了一系列物体的标记。这些结果是执行程序 `4.3` 的结果。


    ![图 4.17 执行程序 4.3 获得的物体标记。(a) 原始图像和 (b) 标记后的图像。](img/Fig04_17.jpg)


    **图 4.17** 执行程序 4 获得的物体标记。(a) 原始图像和 (b) 标记后的图像。]

