    ## 2.2 什么是滤波器？


    在图像中，噪声出现在局部强度级发生剧烈变化的地方（无论是显著增加还是减少）。相反，图像中也存在强度保持恒定的区域。图像滤波的第一个想法是消除噪声像素，用它们邻居的平均值来替换它们
    [1]。


