    ### 3.4.2 Sharpness Enhancement in Images


    If the Laplacian operator is applied to an image, we will obtain its edges. However,
    if what is desired is to improve the sharpness of an image, then it will be necessary
    to preserve the low-frequency information of the original image and emphasize
    the details present in the image through the Laplacian filter. To achieve this
    effect, it is necessary to subtract from the original image a scaled version of
    the Laplacian filter value. So, the image with improved sharpness would be defined
    as described in the following equation:


    *I*(*x*, *y*)[Enhanced] = *I*(*x*,*y*) − *w* ⋅ ∇²*I*(*x*,*y*) (3.28)


    [Figure 3.15](#C_006_c3.xhtml#f3_15) shows the concept by which the image improves
    its sharpness by making the presence of its edges more prominent. To facilitate
    the explanation, the figure considers only the one-dimensional case.


    ![FIGURE 3.15 Sharpening by applying the second derivative. By subtracting a factor
    from the second derivative of the function, it is possible to maximize the presence
    of the borders in the image.](images/Fig03_15.jpg)


    [**FIGURE 3.15**](#C_006_c3.xhtml#f3_15b) Sharpening by applying the second derivative.
    By subtracting a factor from the second derivative of the function, it is possible
    to maximize the presence of the borders in the image.


    The effect of improving the sharpness of an image can be carried out in a single
    execution. Considering *w* = 1, the model of enhancement can be defined as follows:


    *I*(*x*, *y*)[En] = *I*(*x*,*y*) − (1) ⋅ ∇²*I*(*x*,*y*) (3.29)


    If it is replaced by the Laplacian from Equation 3.29 with the expression of Equation
    3.27, the enhancement model is modeled as follows:


    $\\begin{array}{ccl} {I\\left( x,y)\_{\\mathit{En}} \\right.} & = & {5I\\left(
    x,y \\right) - \\left\\lbrack I\\left( x + 1,y \\right) + I\\left( x - 1,y \\right)
    \\right\\rbrack} \\\\ & + & {I\\left( x,y + 1 \\right) + I\\left( x,y - 1 \\right)}
    \\\\ \\end{array}$ (3.30)


    If Equation 3.30 is presented in the form of a filter, the coefficient matrix
    is defined as follows:


    $I{(x,y)}\_{Enhanced} = \\begin{bmatrix} 0 & {- 1} & 0 \\\\ {- 1} & 5 & {- 1}
    \\\\ 0 & {- 1} & 0 \\\\ \\end{bmatrix}$ (3.31)


    [Figure 3.16](#C_006_c3.xhtml#f3_16) presents the result of applying this filter
    to an image.


    ![FIGURE 3.16 Application of the Laplacian filter to improve the sharpness of
    an image. (a) Original image and (b) the image resulting from applying I{(x,y)}\_{\\text{Enhanced}}
    = I\\left( {x,y} \\right) - w \\cdot \\nabla^{2}I\\left( {x,y} \\right), considering
    w = 1.](images/Fig03_16.jpg)


    [**FIGURE 3.16**](#C_006_c3.xhtml#f3_16b) Application of the Laplacian filter
    to improve the sharpness of an image. (a) Original image and (b) the image resulting
    from applying *I*(*x*, *y*)[Enhanced] = *I*(*x*,*y*) − *w* ⋅ ∇²*I*(*x*,*y*), considering
    *w* = 1.


    ### 3.4.3 Use of MATLAB for the Implementation of the Laplacian Filter and the
    Enhancement of Sharpness


    In this section, the use of MATLAB to improve the sharpness of images is described.
    In this process, it is also necessary to calculate the Laplacian. The MATLAB code
    to improve the sharpness of an image can be divided into two simple steps. In
    the first step, the Laplacian filter is calculated from the filter described in
    [Figure 3.12](#C_006_c3.xhtml#f3_12). In the second step, the image sharpness
    is generated considering the information of low frequency contained in the original
    image minus the value of the Laplacian (see Equation 3.28), which incorporates
    the information that allows the enhancement of the details of the image. [Program
    3.2](#C_006_c3.xhtml#p3_2) shows the coding in MATLAB to improve the sharpness
    of an image using the Laplacian.


    The results of applying the code presented in [Program 3.2](#C_006_c3.xhtml#p3_2)
    are shown in [Figure 3.17](#C_006_c3.xhtml#f3_17). In this figure, it can be seen
    the difference between the original grayscale image and the image with contrast
    enhancement for *w* = 1.


    ![FIGURE 3.17 Results of applying the code of Program 3.2 to improve the sharpness
    of an image through the application of the Laplacian operator with MATLAB®, (a)
    original grayscale image, and (b) image with improved contrast for w = 1.](images/Fig03_17.jpg)


    [**FIGURE 3.17**](#C_006_c3.xhtml#f3_17b) Results of applying the code of [Program
    3.2](#C_006_c3.xhtml#p3_2) to improve the sharpness of an image through the application
    of the Laplacian operator with MATLAB^®, (a) original grayscale image, and (b)
    image with improved contrast for *w* = 1.


    ### 3.4.4 The Canny Filter


    A well-known method for detecting edges in images is the Canny filter \[[2](#C_006_c3.xhtml#r3_2)\].
    This method is based on the application of a series of filters in different directions
    and resolutions, which are finally combined into a single result. The method aims
    to achieve three different objectives: (a) to minimize the number of false edges,
    (b) to improve the location of edges in the image, and (c) to deliver an image
    whose edge width is only one pixel. The Canny filter is essentially a filter based
    on gradient methods, but, however, it also uses the second derivative, or Laplacian,
    as a criterion for edge location. Most of the time, this algorithm is used in
    its simple form, that is, setting only the smoothing parameter *σ*. [Figure 3.18](#C_006_c3.xhtml#f3_18)
    shows examples of the application of this algorithm using different values of
    the parameter *σ*.


    ![FIGURE 3.18 Canny’s algorithm applied to an image. (a) Original image, (b) image
    edges with \\sigma = 2, (c) image edges with \\sigma = 4, and (d) image edges
    with \\sigma = 6.](images/Fig03_18.jpg)


    [**FIGURE 3.18**](#C_006_c3.xhtml#f3_18b) Canny’s algorithm applied to an image.
    (a) Original image, (b) image edges with *σ* = 2, (c) image edges with *σ* = 4,
    and (d) image edges with *σ* = 6.


    ### 3.4.5 MATLAB Tools that Implement the Canny Filter'
