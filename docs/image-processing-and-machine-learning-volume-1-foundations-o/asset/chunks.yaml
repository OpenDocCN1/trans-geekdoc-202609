- raw: 'To calculate the median of the data that integrates the region of interest
    *R*(*x*,*y*), it is only necessary to execute two steps. First, arrange the intensity
    values of the image that correspond to the region of influence defined by the
    filter in vector form. Then, rearrange them in increasing order. If there are
    repeated values, they will also be repeated in the new arrangement. [Figure 2.21](#C_005_c2.xhtml#f2_21)
    demonstrates the computation of the median on a filter with a region of size 3 × 3.


    ![FIGURE 2.21 Calculation of the median considering a filter of size 3 \\times
    3.](images/Fig02_21.jpg)


    [**FIGURE 2.21**](#C_005_c2.xhtml#f2_21b) Calculation of the median considering
    a filter of size 3 × 3.


    Because a filter is normally defined as a matrix whose data set is odd, the median
    value always corresponds to the central value of the increasingly ordered vector
    corresponding to the region of interest  *R*(*x*,*y*).


    It can be said that the median filter does not produce or calculate a new value
    with which the pixel of the image will be replaced, but rather this is an existing
    value in the region of interest of the filter selected as a result of data rearrangement.
    [Figure 2.22](#C_005_c2.xhtml#f2_22) illustrates the effect of a median filter
    on two-dimensional structures. From the results of this figure, it can be seen
    in 2.22a and 2.22b that when the structures are smaller than half of the filter,
    they are removed. On the other hand, when they are equal to or larger than half,
    as in 2.22c and 2.22d, they remain practically unchanged. [Figure 2.23](#C_005_c2.xhtml#f2_23)
    finally shows, using images, the effect of the median filter to remove distortions
    such as salt and pepper.


    ![FIGURE 2.22 Effect of the median filter on structures can be seen in (a) and
    (b); when the structures are smaller than half the filter. They are eliminated,
    while when they are equal to or greater than half, as in (c ) and (d), they remain
    practically unchanged.](images/Fig02_22.jpg)


    [**FIGURE 2.22**](#C_005_c2.xhtml#f2_22b) Effect of the median filter on structures
    can be seen in (a) and (b); when the structures are smaller than half the filter.
    They are eliminated, while when they are equal to or greater than half, as in
    (c ) and (d), they remain practically unchanged.


    ![FIGURE 2.23 Results and comparison of the effect of the median filter. (a) The
    original image contaminated by salt and pepper noise (see Section 2.6). (b) Effect
    of the “Box” smoothing filter on the image (a). It can be seen how the filter
    is unable to eliminate the artifacts that distort the image; the only visible
    effect is their attenuation. (c) Median filter effect. It can be seen how this
    filter eliminates the noise present in the image.](images/Fig02_23.jpg)


    [**FIGURE 2.23**](#C_005_c2.xhtml#f2_23b) Results and comparison of the effect
    of the median filter. (a) The original image contaminated by salt and pepper noise
    (see [Section 2.6](#C_005_c2.xhtml#h2_6)). (b) Effect of the “Box” smoothing filter
    on the image (a). It can be seen how the filter is unable to eliminate the artifacts
    that distort the image; the only visible effect is their attenuation. (c) Median
    filter effect. It can be seen how this filter eliminates the noise present in
    the image.


    ### 2.8.3 Median Filter with Multiplicity Window


    The median filter considers, in its determination, a set of data. Therefore, if
    there is a value with a very small or very large value compared to the other data
    that is covered by the region of interest *R*(*x*,*y*) of the filter, it will
    not significantly alter the result. For this reason, the filter is very appropriate
    for removing salt and pepper noise.


    With the median filter, all the pixels considered in the region of interest of
    the filter have the same importance in determining the result. As has been mentioned
    in several parts of this chapter, a desirable behavior in a filter would be to
    give greater weight to the central coefficient of the filter that corresponds
    to the pixel of the image to be replaced.


    The median filter with a multiplicity window can be considered as a variant of
    the median filter, which, unlike the original, has a window *H* that gives different
    importance to each element depending on the corresponding coefficient of the filter
    matrix *H*. Thus, like linear filters, the matrix coefficients *H* scale their
    corresponding pixels in the image. However, the operation performed by this filter
    does not involve a multiplication of the filter coefficient by its corresponding
    pixel but multiplicity. In this context, it expresses the number of times the
    intensity value of the filter is presented where the median is calculated.


    Under such conditions, the matrix of coefficients indicates in its total sum the
    number of data that are considered for the calculation of the median. Therefore,
    the size of the data *T* to be considered for the calculation of the median is
    distributed in a window of 3 × 3 considering the following matrix:


    $H = \\begin{bmatrix} h\_{1} & h\_{2} & h\_{3} \\\\ h\_{4} & h\_{5} & h\_{6} \\\\
    h\_{7} & h\_{8} & h\_{9} \\\\ \\end{bmatrix}$ (2.33)


    *T* = *h*[1] + *h*[2] + *h*[3] + *h*[4] + *h*[5] + *h*[6] + *h*[7] + *h*[8] + *h*[9]


    $T = {\\sum\\limits\_{i = 1}^{9}h\_{i}}$


    As an example, consider if you have the filter *H* defined as:


    $H = \\begin{bmatrix} 1 & 3 & 2 \\\\ 2 & 4 & 1 \\\\ 1 & 2 & 1 \\\\ \\end{bmatrix}$
    (2.34)


    The data size *T* considered is as follows:


    $T = {\\sum\\limits\_{i = 1}^{9}h\_{i}} = 17$ (2.35)


    Once the amount of data to be considered is known, the same method used in [Section
    2.6.2](#C_005_c2.xhtml#h2_6_2) is applied to find the median of the data set.
    Therefore, if the data set defined by *T* is odd, the median is the central data
    of the collection ordered in increasing order, but if it is even, then the average
    of the central data of the collection will have to be calculated as it is shown
    in Equation 2.31. [Figure 2.24](#C_005_c2.xhtml#f2_24) illustrates the operation
    process of this filter.


    ![FIGURE 2.24 Calculation performed by the median filter with a multiplicity window
    of 3 \\times 3.](images/Fig02_24.jpg)


    [**FIGURE 2.24**](#C_005_c2.xhtml#f2_24b) Calculation performed by the median
    filter with a multiplicity window of 3 × 3.


    Considering this method, the coefficients of the matrix *H* must be positive,
    and if the coefficient in a certain position is zero, it will be noted that this
    pixel of the image will not be considered for the determination of the median.
    An example of this is the median cross filter defined in Equation 2.33, which,
    as its name implies, considers only the cross of the coefficient matrix data.


    $H = \\begin{bmatrix} 0 & 1 & 0 \\\\ 1 & 1 & 1 \\\\ 0 & 1 & 0 \\\\ \\end{bmatrix}$
    (2.36)


    ### 2.8.4 Other Non-Linear Filters


    The median filter and its multiplicity window variant are just a few examples
    of non-linear filters that are frequently used and easy to explain. By the name
    of non-linear, we group all those filters that do not have the property of linearity.
    There are a large number of them that comply with the characteristic of nonlinearity.
    Some examples are the corner detector and the morphological filters that will
    be described in later chapters. An important difference between non-linear filters
    is that the existing mathematical and theoretical basis for this type of filter
    is not the same as in the case of linear filters, which are based on convolution
    and their associated properties.


    ## 2.9 Linear Spatial Filters in MATLAB


    To explain the options that MATLAB implements for spatial filtering, we analyze
    the way in which the correlation and convolution operations are carried out in
    detail. Then, we will see the possible functions available in order to implement
    such operations in MATLAB.


    ### 2.9.1 Correlation Size and Convolution'
