- raw: 'The function of a linear filter is specified by the value of its coefficients.
    Since the coefficients can consist of different values, there are an infinite
    number of linear filters \[[6](#C_005_c2.xhtml#r2_6)\]. From the above, the question
    is: For what type of effect can a filter be used? And for a certain effect, what
    are the most suitable filters? In practice, there are two kinds of linear filters:
    smoothing filters and different filters.


    ### 2.5.1 Smoothing Filters


    The filters discussed in the preceding sections consider a smoothing effect over
    the original image. Every linear filter whose coefficient matrix consists only
    of positive coefficients has in some way a smoothing effect on an image. From
    this operation, it can be verified that the result is a scaled version of the
    average value of the region *R*(*x*,*y*) covered by the filter.


    ### 2.5.2 The “Box” Filter


    The box filter is the simplest and oldest of all the filters that perform smoothing
    on an image. [Figure 2.8](#C_005_c2.xhtml#f2_8) shows (a) the three-dimensional,
    (b) two-dimensional, and (c) mask functions implemented by this type of filter.
    Due to the sharp edges that it implements and its frequency behavior, the “Box”
    filter is a smoothing filter that is not highly recommended for applications.
    The filter, as can be seen in [Figure 2.8a](#C_005_c2.xhtml#f2_8), looks like
    a box (hence its name) and affects each pixel of the image in the same way (since
    all its coefficients have the same value). A desirable characteristic of a smoothing
    filter is that its effect on the image is invariant to rotation. Such a property
    is called isotropic.


    ![FIGURE 2.8 The Box filter for smoothing. (a) Three-dimensional, (b) two-dimensional,
    and (c) coefficient matrix that implements the filter.](images/Fig02_08.jpg)


    [**FIGURE 2.8**](#C_005_c2.xhtml#f2_8b) The Box filter for smoothing. (a) Three-dimensional,
    (b) two-dimensional, and (c) coefficient matrix that implements the filter.


    ### 2.5.3 The Gaussian Filter


    The Gaussian filter corresponds to a two-dimensional and discrete Gaussian function,
    which can be formulated as follows:


    $G\_{\\sigma}\\left( r \\right) = e^{\\frac{r^{2}}{2\\sigma^{2}}}\\,\\text{or}\\,\\,
    G\_{\\sigma}xy = e^{\\frac{x^{2} + y^{2}}{2\\sigma^{2}}}$ (2.8)


    where the standard deviation *σ* represents the influence radius of the Gaussian
    function, as shown in [Figure 2.9](#C_005_c2.xhtml#f2_9).


    ![FIGURE 2.9 The Gaussian filter for smoothing. (a) Three-dimensional, (b) two-dimensional,
    and (c) coefficient matrix that implements the filter.](images/Fig02_09.jpg)


    [**FIGURE 2.9**](#C_005_c2.xhtml#f2_9b) The Gaussian filter for smoothing. (a)
    Three-dimensional, (b) two-dimensional, and (c) coefficient matrix that implements
    the filter.


    In the Gaussian filter, the central element of the filter represents the maximum
    weight that participates in the linear combination of the operation, while the
    values of the other coefficients have less influence as they move away from the
    center of the filter.


    An important property of this filter is known as isotropy. A problem with the
    “Box” smoothing filter is that its attenuation also causes a degradation in important
    characteristics of the image, such as edges (regions of the image where there
    is a sudden change in intensity) or corners. The Gaussian filter is less harmful
    in this sense, allowing the smoothing of the regions where the intensity values
    are homogeneous without diluting the characteristics of the image.


    [Program 2.1](#C_005_c2.xhtml#p2_1) shows the MATLAB code to implement a filter
    3 × 3 that smooths the image by averaging neighboring pixels, as was discussed
    in Equation 2.4.


    ### 2.5.4 Difference Filters


    If a filter contains negative numbers as part of its coefficients, its operation
    can be interpreted as the difference between two different sums: The sum of all
    the linear combinations of the positive coefficients of the filter minus the sum
    of all the linear combinations due to the negative coefficients within the region
    defined by the filter *R*(*x*,*y*). If we express this operation mathematically,
    it can be defined as follows:


    $\\begin{array}{cl} {I^{\\prime}\\left( {x,y} \\right)} & {= {\\sum\\limits\_{{({i,j})}
    \\in R^{+}}{I\\left( {x + i,y + j} \\right) \\cdot \\left| {H\\left( {i,j} \\right)}
    \\right|}}} \\\\ & {- {\\sum\\limits\_{{({i,j})} \\in R^{-}}{I\\left( {x + i,y
    + j} \\right) \\cdot \\left| {H\\left( {i,j} \\right)} \\right|}}} \\\\ \\end{array}$
    (2.9)


    where *R*^+ refers to the part of the filter with positive coefficients *H*(*i*,*j*) > 0
    and *R*^− to the part of the filter with negative coefficients  *H*(*i*,*j*) < 0.
    As an example, it is shown in [Figure 2.10](#C_005_c2.xhtml#f2_10): the Laplace
    filter of size 5 × 5. It calculates the difference between the central point (the
    only positive coefficient with a value of 16) and the negative sum of 12 coefficients
    with values from ‒1 to –2. The remaining coefficients are zero and are not considered
    in the processing. This filter implements the function known as “the Mexican hat,”
    which has the following model:


    ![FIGURE 2.10 The Laplace (or Mexican hat) filter. (a) Three-dimensional, (b)
    two-dimensional, and (c) the coefficients that define the filter.](images/Fig02_10.jpg)


    [**FIGURE 2.10**](#C_005_c2.xhtml#f2_10b) The Laplace (or Mexican hat) filter.
    (a) Three-dimensional, (b) two-dimensional, and (c) the coefficients that define
    the filter.


    $M\_{\\sigma}\\left( r \\right) = \\frac{1}{\\sqrt{2\\text{π}}\\sigma^{3}}\\left(
    {1 - \\frac{r^{2}}{\\sigma^{2}}} \\right)e^{- \\frac{r^{2}}{2\\sigma^{2}}}$ (2.10)


    $M\_{\\sigma}\\left( {x,y} \\right) = \\frac{1}{\\sqrt{2\\text{π}}\\sigma^{3}}\\left(
    {1 - \\frac{x^{2} + y^{2}}{\\sigma^{2}}} \\right)e^{- \\frac{x^{2} + y^{2}}{2\\sigma^{2}}}$
    (2.11)


    The models expressed in Equation 2.11 correspond to the same formulation but in
    one-dimensional and two-dimensional cases. While with filters with positive coefficients,
    the effect obtained is smoothing, with difference filters (which have positive
    and negative coefficients), the effect is the opposite. Therefore, the differences
    between pixel intensity levels are enhanced. For this reason, these types of filters
    are normally used for edge detection.


    ## 2.6 Formal Characteristics of Linear Filters


    Until now, the concept of filters has been considered in a simple way so that
    the reader can get a quick idea of their characteristics and properties. Although
    this may be sufficient from a practical point of view, there are situations where
    the understanding of the mathematical properties of their operations allows to
    design and analyze more complex filters. The operation on which the filters are
    based is convolution. This operation and its characteristics will be discussed
    throughout this chapter.


    ### 2.6.1 Linear Convolution and Correlation


    The operation of a linear filter is based on an operation called linear convolution.
    This operation allows associating two continuous or discrete functions in one.
    For two two-dimensional discrete functions *I* and *H* the linear convolution
    is defined as follows:


    $I^{\\prime}\\left( {x,y} \\right) = {\\sum\\limits\_{i = - \\infty}^{\\infty}{\\sum\\limits\_{j
    = \\infty}^{\\infty}{I\\left( {x - i,y - j} \\right) \\cdot H\\left( {i,j} \\right)}}}$
    (2.12)


    Or in compact form:


    *I*^′ = *I* \* *H* (2.13)


    The expression in Equation 2.12 is very similar to the one defined in 2.6, with
    the exception of the limits in the summations for *i*, *j*, and the sign in the
    coordinates *I*(*x*−*i*,*y*−*j*). The first difference is explained by the fact
    that the filter *H*(*i*,*j*) defines a region *R*(*x*,*y*) of influence that contains
    a finite set of coefficients; outside this region, the coefficients are considered
    zero or not relevant, so the limit of the sum could be extended without altering
    the result of the calculation.


    Regarding the coordinates, Equation 2.12 can be reformulated again as follows:'
