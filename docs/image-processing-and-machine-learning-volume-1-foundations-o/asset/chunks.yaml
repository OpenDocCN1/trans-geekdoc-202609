    {x,y} \\right), (c) image I\_{y}^{2}\\left( {x,y} \\right), (d) image I\_{x}\\left(
    {x,y} \\right) \\cdot I\_{y}\\left( {x,y} \\right), (e) image of V\\left( {x,y}
    \\right), and (f) original image with the location of the “true corner points”.](images/Fig05_05.jpg)


    [**FIGURE 5.5**](#C_008_c5.xhtml#f5_5b) Application of the Harris algorithm to
    an artificially generated image with some partial results. (a) Original image,
    (b) image *I*[*x*]²(*x*,*y*), (c) image *I*[*y*]²(*x*,*y*), (d) image *I*[*x*](*x*,*y*) ⋅ *I*[*y*](*x*,*y*),
    (e) image of *V*(*x*,*y*), and (f) original image with the location of the “true
    corner points”.


    ## 5.3 Determination of Corner Points Using MATLAB


    Although MATLAB^® offers a function to identify features such as corners, in this
    section, we will implement the corner detection algorithm directly. The way to
    program the Harris algorithm will follow the steps indicated in [Algorithm 5.1](#C_008_c5.xhtml#a5_1).
    [Program 5.1](#C_008_c5.xhtml#p5_1) shows the MATLAB code that fully implements
    the Harris operator.'
