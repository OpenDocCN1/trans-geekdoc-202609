    ## 2.6 线性滤波器的形式特性


    到为止，滤波的概念是以简单的方式考虑的，以便读者快速了解它们的特性和属性。尽管从实际角度来看这可能足够了，但在某些情况下，理解操作的数学属性允许设计和分析更复杂的滤波器。滤波的基础操作是卷积。这种操作及其特性将在本章中讨论。


    ### 2.6.1 线性卷积与相关性


    线性滤波的操作基于一种称为线性卷积的操作。这种操作允许将连续或离散函数关联在一起。对于两个二维离散函数 `I` 和 `H`，线性卷积定义如下：


    $I^{\prime}\left( {x,y} \right) = {\\sum\\limits_{i = - \\infty}^{\infty}{\sum\\limits_{j
    = \\infty}^{\infty}{I\\left( {x - i,y - j} \\right) \\cdot H\\left( {i,j} \\right)}}}$
    (2.12)


    或者以紧凑形式：


    `I'' = I * H` (2.13)


