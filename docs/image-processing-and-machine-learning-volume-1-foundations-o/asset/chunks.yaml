    ## 4.4 The Optimal Threshold


    The use of the median filter does not always allow the elimination of the overlapping
    between two densities present in the histogram. In such circumstances, the optimal
    threshold must be calculated, which produces the least number of misclassified
    pixels. This is the set of pixels belonging to object A that are classified as
    if they belonged to object B and vice versa. In this way, the optimal threshold
    corresponds to the intercept between both distributions. [Figure 4.7](#C_007_c4.xhtml#f4_7)
    graphically shows the optimal threshold for a hypothetical example of distribution.
    The figure shows the distributions of two objects A and B that present an overlapping
    region T. From the figure; the intersection point clearly represents the best
    location to define the classification limit for each of the classes represented
    by their respective distributions.


    ![FIGURE 4.7 The optimal threshold for the binarization of two objects according
    to the overlapping of their distributions.](images/Fig04_07.jpg)


    [**FIGURE 4.7**](#C_007_c4.xhtml#f4_7b) The optimal threshold for the binarization
    of two objects according to the overlapping of their distributions.


    There are several approaches for determining the optimal threshold in the case
    of the overlapping of two distributions. Most of them operate iteratively, testing
    a certain threshold in such a way that the pixels of each object are closer to
    the average value of their respective intensities than to the average intensity
    value of the opposite object.


    ## 4.5 Otsu Algorithm


    The Otsu method is the most popular method for calculating the optimal threshold.
    The method allows the binarization of two classes using the histogram of image
    intensities. The method considers an image *I* of dimension *M* × *N* with *L* − 1
    gray scales. The histogram presents two overlapping areas from the distribution.
    The first corresponds to object A, which involves the intensity values from 0
    to *k*, while the second integrates the gray levels from *k* + 1 to *L* − 1. [Figure
    4.8](#C_007_c4.xhtml#f4_8) illustrates the distribution and its associated variables.


    ![FIGURE 4.8 Segmentation process of two distributions using the Otsu method.](images/Fig04_08.jpg)


    [**FIGURE 4.8**](#C_007_c4.xhtml#f4_8b) Segmentation process of two distributions
    using the Otsu method.


    The Otsu method starts by calculating the probabilities of each object or class:


    $\\begin{matrix} {P\\left( A \\right) = {\\sum\\limits\_{i = 0}^{k}{h\\left( i
    \\right) = w\_{A}\\left( k \\right) = w\\left( k \\right)}}} \\\\ {P\\left( B
    \\right) = {\\sum\\limits\_{i = k + 1}^{L - 1}{h\\left( i \\right) = w\_{B}\\left(
    k \\right) = 1 - w\\left( k \\right)}}} \\\\ \\end{matrix}$ (4.1)


    where *h*(*i*) represents the number of pixels of intensity *i* contained in the
    image. Under these conditions, the average intensity of each object can be calculated
    as follows:


    $\\begin{matrix} {\\mu\_{A}\\left( k \\right) = \\frac{1}{w\_{A}\\left( k \\right)}{\\sum\\limits\_{i
    = 0}^{k}{i \\cdot h\\left( i \\right)}}} \\\\ {\\mu\_{B}\\left( k \\right) = \\frac{1}{w\_{B}\\left(
    k \\right)}{\\sum\\limits\_{i = k + 1}^{L - 1}{i \\cdot h\\left( i \\right)}}}
    \\\\ \\end{matrix}$ (4.2)


    From these values, the variances can be obtained as follows:


    $\\begin{matrix} {\\sigma\_{A}^{2}\\left( k \\right) = \\frac{1}{w\_{A}\\left(
    k \\right)}{\\sum\\limits\_{i = 0}^{k}\\left( {i - \\mu\_{A}\\left( k \\right)^{2}
    \\cdot h\\left( i \\right)} \\right)}} \\\\ {\\sigma\_{B}^{2}\\left( k \\right)
    = \\frac{1}{w\_{B}\\left( k \\right)}{\\sum\\limits\_{i = k + 1}^{L - 1}\\left(
    {i - \\mu\_{B}\\left( k \\right)^{2} \\cdot h\\left( i \\right)} \\right)}} \\\\
    \\end{matrix}$ (4.3)'
