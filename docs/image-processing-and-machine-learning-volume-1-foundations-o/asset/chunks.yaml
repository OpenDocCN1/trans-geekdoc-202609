    #### 3.3.5.1 Sobel Operator


    The Sobel operator uses the filters described in [Table 3.1](#C_006_c3.xhtml#t3_1)
    to approximate the partial derivatives ∂*I*/∂*u* and ∂*I*/∂*v*. From the combination
    of these partial derivatives according to Equation 3.5, we obtain each pixel (*u*,*v*)
    the gradient value. Then, a pixel (*u*,*v*) is said to correspond to an edge of
    the image if the value of its gradient is greater than a pre-established threshold
    **U** as a criterion.


    The general call to the edge detection function that the image processing toolbox
    implements under the Sobel method is:


    ```

    [g,t]=edge(f, ‘sobel’, U, dir)

    ```


    where `f` is the image from which the edges will be extracted. `U` is a threshold
    that is used as the criterion to classify the edges. `dir` selects the direction
    of the gradient, which can be ‘horizontal’ if used *H*[*x*]^(*S*) or ‘*vertical*’
    if *H*[*y*]^(*S*)  is used. The option ‘`both`’, which is the default option,
    implies the calculation of both filters. As a result, the function obtains the
    image `g,` which, as stated above, contains the detected edges. `g` is a binary
    image where the edge pixels have the value of 1, while not edge pixels present
    the value of zero. If the threshold `U` is specified `t` =` U`. If `U` is not
    specified, the algorithm automatically determines one, uses it for edge detection,
    and returns its value in `t`.


    #### 3.3.5.2 Prewitt Operator


    The Prewitt operator uses the coefficient matrices specified in [Table 3.1](#C_006_c3.xhtml#t3_1)
    for edge detection. The general structure of this function is described as follows:


    ```

    [g,t]=edge(f, ‘prewitt’, U, dir)

    ```


    The parameters of this function are identical to those indicated in the Sobel
    case. The Prewitt operator is a little simpler (computationally speaking) in its
    implementation in relation to the Sobel case. Nevertheless, the results obtained
    are noisier. This is because the Sobel filter performs a smoothing operation on
    the data, which can be observed in the coefficients with value two in the row
    or column of the pixel on which the gradient is calculated.


    #### 3.3.5.3 Roberts Operator


    The Roberts operator uses the filters defined in [Table 3.1](#C_006_c3.xhtml#t3_1)
    to approximate the gradient magnitude at the pixel (*u*,*v*)). The general structure
    of this function is described as follows:


    ```

    [g,t]=edge(f, ‘roberts’, U, dir)

    ```


    The parameters of this function are identical to those described in the case of
    the Sobel operator. The Roberts operator represents one of the oldest methods
    for calculating the gradient in images. Although this method is the simplest to
    implement, it has limited functionality since it is non-symmetric. Therefore,
    it cannot detect edges that are directionally in multiples of 45°. As a comparison,
    [Figure 3.11](#C_006_c3.xhtml#f3_11) shows the result of applying the previous
    functions to each of the different operators to detect the edges in an image.
    In the figure, all the functions use the same threshold for all cases.


    ![FIGURE 3.11 Comparison of the different operators used for edge detection. (a)
    Original image, (b) edges detected by the Sobel operator, (c) Prewitt, and (d)
    Roberts. In all cases, a U = 0.05 has been used.](images/Fig03_11.jpg)


    [**FIGURE 3.11**](#C_006_c3.xhtml#f3_11b) Comparison of the different operators
    used for edge detection. (a) Original image, (b) edges detected by the Sobel operator,
    (c) Prewitt, and (d) Roberts. In all cases, a U = 0.05 has been used.


    ## 3.4 Operators Based on the Second Derivative


    Previously, the group of operators based on the first derivative has been described
    in [Section 3.2](#C_006_c3.xhtml#h3_2) as a way of approximating the gradient
    of the image. In addition to these filters, there are other types of operators
    that are based on the second derivative of the image function \[[8](#C_006_c3.xhtml#r3_8)\].
    In an image, intensity changes can be calculated by the value of the derivative
    in each direction (maximum gradient) or by the zero crossing of the second derivative
    (Laplacian) in any direction. As can be seen, the problem of using the first derivative
    as an approach for edge detection results in its difficult location when representing
    a highly directional method or when the edge is not well defined.


    Although the value of the gradient allows the detection of an edge, it is sometimes
    important to have information about whether the pixel presents a positive or negative
    transition of the gradient. This is equivalent to knowing if the pixel is on the
    dark or light side of the edge.


    ### 3.4.1 Edge Detection Using the Second-Derivative Technique


    This technique is based on finding what is called zero-crossing. A zero crossing
    is nothing more than the transition from positive to negative or vice versa and
    is estimated from the second derivative.


    The definition of a derivative for a one-dimensional function is as follows:


    $\\frac{\\partial f}{\\partial x} = f\\left( {x + 1} \\right) - f\\left( x \\right)$
    (3.22)


    Likewise, from Equation 3.22, it can be said that the second derivative is defined
    as:


    $\\frac{\\partial f^{2}}{\\partial x^{2}} = f\\left( {x + 1} \\right) - 2f\\left(
    x \\right) + f\\left( {x - 1} \\right)$ (3.23)


    The detection of edges by means of the second derivative is based on the zero
    crossing of the value of the gradient in any direction. To produce this effect,
    we use the Laplacian, which is insensitive to rotation and isotropic.


    $\\nabla^{2}I\\left( {x,y} \\right) = \\frac{\\partial^{2}I\\left( {x,y} \\right)}{\\partial
    x^{2}} + \\frac{\\partial^{2}I\\left( {x,y} \\right)}{\\partial y^{2}}$ (3.24)


    This filter uses second derivatives. Considering Equation 3.23 in expression 3.24
    of the Laplacian, we have:


    $\\frac{\\partial^{2}I\\left( {x,y} \\right)}{\\partial x^{2}} = I\\left( {x +
    1,y} \\right) - 2I\\left( {x,y} \\right) + I\\left( {x - 1,y} \\right)$ (3.25)


    $\\frac{\\partial^{2}I\\left( {x,y} \\right)}{\\partial y^{2}} = I\\left( {x,y
    + 1} \\right) - 2I\\left( {x,y} \\right) + I\\left( {x,y - 1} \\right)$ (3.26)


    Therefore, if the expressions 3.25 and 3.26 are replaced in 3.24, we have:


    $\\begin{array}{ccl} {\\nabla^{2}I\\left( {x,y} \\right)} & = & {I\\left( {x +
    1,y} \\right) + I\\left( {x - 1,y} \\right)} \\\\ & + & {I\\left( {x,y + 1} \\right)
    + I\\left( {x,y - 1} \\right) - 4I\\left( {x,y} \\right)} \\\\ \\end{array}$ (3.27)


    If the previous equation is expressed in terms of a filter, the matrix coefficients
    are defined as those shown in [Figure 3.12](#C_006_c3.xhtml#f3_12).


    ![FIGURE 3.12 Filter that represents the calculation of the Laplacian on an image,
    obtained from Equation 3.23](images/Fig03_12.jpg)


    [**FIGURE 3.12**](#C_006_c3.xhtml#f3_12b) Filter that represents the calculation
    of the Laplacian on an image, obtained from Equation 3.23'
