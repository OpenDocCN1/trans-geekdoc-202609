    the correlation operation of a function and a kernel, we move both sequences in
    such a way that their reference points coincide, as shown in [Figure 2.25b](#C_005_c2.xhtml#f2_25).
    From [Figure 2.25b](#C_005_c2.xhtml#f2_25), it can be seen that there are coefficients
    that do not have a corresponding coefficient with which to interact. To solve
    this, the simplest thing is to add zeros at the beginning and at the end of the
    function `f` (see [Figure 2.25c](#C_005_c2.xhtml#f2_25)) so that during the displacement
    of the kernel. Therefore, a corresponding coefficient between both sequences is
