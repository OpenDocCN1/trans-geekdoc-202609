  trans: '


    为了说明这些操作的执行方式，简单起见，我们考虑一维情况。因此，假设存在一个函数 `f` 和一个核 `k`，如图 2.25a 所示。对于函数与核之间的相关操作，我们移动两个序列，使得它们的参考点重合，如图
    2.25b 所示。从图 2.25b 中，可以看到某些系数没有与之进行交互的对应系数。为了解决这个问题，最简单的方法是在函数 `f` 的开头和末尾添加零（参见图
    2.25c），这样在位的的位移过程中，就能保证两个序列之间存在对应的系数。


    ![图 2.25 在函数 f 和核 k 之间执行的一维相关操作。(a) 函数和核，(b) 两个序列在参考点对齐以执行相关，(c) 给函数添加零以确保系数对应，(d)
    两个序列之间的乘积，以及 (e) 相关的“全”结果。](img/Fig02_25.jpg)


    **图 2.25** 在函数 `f` 和核 `k` 之间执行的一维相关操作。(a) 函数和核，(b) 两个序列在参考点对齐以执行相关，(c) 给函数添加零以确保系数对应，(d)
    两个序列之间的乘积，以及 (e) 相关的“全”结果。


    ### 相关操作


    相关操作通过将核向右移动来完成，其中每一步相关序列的值通过相加两个序列中对应系数的乘数值得到的。如图 2.25c 所示，相关序列的第一个元素的结果为零。相关序列的最后一个值由核在函数
    `f` 上实现的最后几何位移表示，使得核的最后一个值对应于原始函数 `f` 的最后一个值（不添加零）。这一过程在图 2.25d 中所示。


    如果我们按照描述执行该操作，将得到图 2.25e 所示的相关序列。需要注意的是，如果进行反过程，即保持核固定并由函数 `f` 执行位移，则结果将不相同，因此顺序是非常关重要的。


    要使用 MATLAB 中实现的函数，将数学操作与它们在结构中使用的参数相关起来至关重要。在这种情况下，如果操作是通过移动核 `k` 越过函数 `f` 并添加零来完成，则相关操作被认为是“full”（全）。


    另一种替代方案是考虑参考点位于核 `k` 的中心系数上。因此，结果将等于函数 `f` 的大小。这是因为核和函数之间的位移会较少。这种操作在 MATLAB 中被称为“same”。图
    2.26 展示了这种变体的相关过程。


    ![图 2.26 在函数 f 和核 k 之间执行的一维相关操作，假设参考点是核的中心系数。(a) 函数和核，(b) 两个序列在参考点对齐以执行相关，(c)
    给函数添加零以确保系数对应，(d) 两个序列之间的乘积，以及 (e) 相关的“相同”结果。](img/Fig02_26.jpg)


    **图 2.26** 在函数 `f` 和核 `k` 之间执行的一维相关操作，假设参考点是核的中心系数。(a) 函数和核，(b) 两个序列在参考点对齐以执行相关，(c)
    给函数添加零以确保系数对应，(d) 两个序列之间的乘积，以及 (e) 相关的的结果。


    ### 比较与变体


    如前所述，相关过程在图 2.26 中展开。需要注意的一个重要点是，将核 `k` 旋转 180 度会反转参考点。因此，“full”版本的卷积结果与相关结果完全相同，例外是序列顺序相反。因此，可以看出这两种操作之间存在密切的关系。


    同样，卷积也可以以“same”变体进行计算，唯一的考虑是核本身必须旋转。当它被反转时，会改变序列的顺序，但不会改变参考点。它相对于序列的两个端点是对称的。这在图
    2.28 中所示。


    ![图 2.28 旋转核以执行卷积。](img/Fig02_28.jpg)


    **图 2.28** 旋转核以执行卷积。


    这里讨论相同的概念可以扩展到图像情况。图 2.29 展示了具有“full”和“same”变体的相关和卷积操作。


    ![图 2.29 图像上的相关和卷积操作。(a) 原始图像 f 和核 k，(b) 为原始图像添加了“零”以确保每个核系数都有图像值，(c) 核与添加了零的图像进行相关的开始，(d)
    考虑添加了额外零的图像的“full”相关结果，(e) 与图像大小相同的“same”相关结果，未对原始图像添加零，与原始大小相同，(f) 旋转 180 度的原始图像和核以进行卷积，(g)
    全卷积结果，以及 (h) 与图像大小相同的“same”卷积结果。](img/Fig02_29.jpg)


