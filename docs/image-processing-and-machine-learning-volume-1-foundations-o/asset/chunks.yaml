    parts of the code. [Program 6.1](#C_009_c6.xhtml#p6_1) shows the commented code
    that implements the Hough transform used for line detection.


    In the first part, in addition to initializing some variables, the Hough transform
    indicated by steps 1–7 of [Algorithm 6.1](#C_009_c6.xhtml#a6_1) is implemented.


    The second part of Program 8.1 is made up of the necessary instructions for choosing
    the pixels whose value of `MRAcc` is maximum within a block considered as the
    neighborhood region. To program such an event, the matrix (to which the threshold
    `t`[`h`] was applied) is traversed sequentially, pixel by pixel, finding the maximum
    value of a neighborhood block or region `R`(`x`,`y`)) established around the point
    in question. To do this, the limits of the block relative to the pixel in question
    are set. In the case of [Program 6.1](#C_009_c6.xhtml#p6_1), the interval is set
    equal to 10, which, considering it in both directions, would be 20. Once the limits
    are established, the block is extracted and the maximum is found. If the maximum
    of the block corresponds to the central pixel of the block relative to that of
    the scanning process, a one is placed in that position in the `End` matrix in
    such a way that the indices where there are ones in `End` will correspond to the
    parameters that define the lines of the original image. [Figure 6.10](#C_009_c6.xhtml#f6_10)
    shows the process of finding the maximum within the considered neighborhood around
    the point in question.


    ![FIGURE 6.10 Process for obtaining the register of significant accumulators.
    Of all the points found by applying the threshold `th`, the one whose value `MRAcc`
    is the maximum in a defined neighborhood `R(x,y)`, is selected. In this case,
    the point value `P5` has the maximum value of `MRAcc` compared to the other values
    `P4`, `P6`, `P7`, `P8`, `P9`, and `P10` that are within the neighborhood region
    defined by `R(x,y).](images/Fig06_10.jpg)


    [FIGURE 6.10](#C_009_c6.xhtml#f6_10b) Process for obtaining the register of significant
    accumulators. Of all the points found by applying the threshold `th`, the one
    whose value `MRAcc` is the maximum in a defined neighborhood `R`(`x`,`y`)), is
    selected. In this case, the point value `P5` has the maximum value of `MRAcc`
    compared to the other values `P4`, `P6`, `P7`, `P8`, `P9`, and `P10` that are
    within the neighborhood region defined by `R`(`x`,`y`)).


    In the third part, the straight lines found by applying the Hough Transform are
    displayed. For this, it is considered that the values of the parameters `r` and
    `θ` represent the vector that is perpendicular to the straight line that represents
    the one detected in the parameter space of the image. To formulate the model of
    the line to display, the only thing to consider is that if the slope of the vector
    is defined by `m` = `p`[`y*]/`p`[`x*`], considering that `p`[`y*]` and `p`[`x*]`
    are its vertical and horizontal projection, respectively, the slope of the line
    detected, which is the normal to this vector, will be the inverse and opposite
    to that of the vector(−`p`[`x*]/`p`[`y*]). [Figure 6.11](#C_009_c6.xhtml#f6_11)
    shows an illustration of this process.


    ![FIGURE 6.11 Slope of the detected line, which is the inverse and opposite to
    that of the vector defined by the parameters of the Hough Transform.](images/Fig06_11.jpg)


    [FIGURE 6.11](#C_009_c6.xhtml#f6_11b) Slope of the detected line, which is the
    inverse and opposite to that of the vector defined by the parameters of the Hough
    Transform.


    It is important to mention that the images contained in [Figure 6.9](#C_009_c6.xhtml#f6_9).


    ## 6.5 Line Detection Using MATLAB


    MATLAB contains 3 functions: `hough`, `houghpeaks`, and `houghlines`.

