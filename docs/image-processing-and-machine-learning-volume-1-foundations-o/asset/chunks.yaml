    a point in the image where the gradient value is especially high in only one direction,
    a corner also has gradient values but more than one direction [[4](#C_008_c5.xhtml#r5_4)].


    The algorithms used for corner detection adopt the criterion of the first or second
    derivative over the image in `x` or `y` direction as an approximation of the gradient
    value. A representative algorithm of this class of methods is the Harris Detector.
    Although there are other detectors that have interesting features and properties,
    the Harris detector is currently the most used method. For this reason, this algorithm
    is explained in detail [[5](#C_008_c5.xhtml#r5_5)].


    ## 5.2 The Harris Algorithm


    The algorithm developed by Harris and Stephens is based on the idea that a corner
    is a point in the image where gradient value shows a high value in several directions
    simultaneously. This algorithm has the characteristic that it is robust when it
    classifies between corners and edges. In addition, this detector also presents
    a high degree of robustness with respect to orientation. Therefore, corner alignment
    does not matter [[6](#C_008_c5.xhtml#r5_6)].


    ### 5.2.1 Matrix of Structures


    The calculation of Harris algorithm is based on expansion of the first partial
    derivative in pixel `I(x,y)` in horizontal and vertical directions such that:


    $$I_{x}(x,y) = \frac{\partial I(x,y)}{\partial x} \quad I_{y}(x,y) = \frac{\partial
    I(x,y)}{\partial y}$$


    For each pixel of the image `(x,y)`, three different quantities are calculated
    that will be called `HE11(x,y)`, `HE22(x,y)` and `HE12(x,y)`, where:


    $$HE11(x,y) = I_{x}(x,y)^2$$

    $$HE22(x,y) = I_{y}(x,y)^2$$

    $$HE12(x,y) = I_{x}(x,y) \cdot I_{y}(x,y)$$


    These values can be interpreted as approximations of the elements of the matrix
    of structures defined as `HE` such that:


    $$\text{HE} = \begin{bmatrix} HE_{11} & HE_{12} \\ HE_{21} & HE_{22} \end{bmatrix}$$


    where `HE12` = `HE21`.


    ### 5.2.2 Filtering of the Matrix of Structures


    For the location of the corners using Harris algorithm, it is necessary to smooth
    the values of each of the elements of the matrix of structures by convolving them
    through a Gaussian filter `H(sigma)`, such that the matrix `HE` is redefined as
    the matrix `E`, such that:


    $$E = \begin{bmatrix} HE_{11} * H_{\sigma} & HE_{12} * H_{\sigma} \\ HE_{21} *
    H_{\sigma} & HE_{22} * H_{\sigma} \end{bmatrix} = \begin{bmatrix} A & C \\ C &
    B \end{bmatrix}$$


    ### 5.2.3 Calculation of Eigenvalues and Eigenvectors


    Due to its symmetry, the matrix `E` can be diagonalized in such way that:


    $$E'' = \begin{bmatrix} \lambda_{1} & 0 \\ 0 & \lambda_{2} \end{bmatrix}$$


    where `lambda1` and `lambda2` are the eigenvalues of the matrix `E`. These values
    are calculated according to:


    $$\lambda_{1,2} = \frac{tr(E)}{2} \pm \sqrt{\left( \frac{tr(E)}{2} \right)^{2}
    - \det(E)}$$


    where `tr(E)` implies the trace of the matrix `E` and `det(E)` the determinant
    of the matrix `E`. Developing the operations of the trace and determinant of Equation
    5.7, we obtain:


    $$\lambda_{1,2} = \frac{1}{2}\left( {A + B \pm \sqrt{A^{2} - 2AB + B^{2} + 4C^{2}}}
    \right)$$


    Both eigenvalues `lambda1` and `lambda2` are positive and contain important information
    about the local structures contained in the image. Within a region of the image
    whose homogeneous content is a given intensity value, the value of `E` will be
    equal to zero (`E=0`), so the eigenvalues in that region are also `lambda1` =
    `lambda2` = 0. However, at an intensity step with a value of `lambda1` > 0 and
    `lambda2` = 0, the eigenvalues represent the magnitude of the gradient, while
    the eigenvectors correspond to the direction. [Figure 5.1](#C_008_c5.xhtml#r5_1)
    shows how the `lambda1` and `lambda2` values deliver essential information about
    the structures contained in the image.


    ![FIGURE 5.1 Relationship of structures in an image and their eigenvalues.](images/Fig05_01.jpg)


    [**FIGURE 5.1**](#C_008_c5.xhtml#r5_1b) Relationship of structures in an image
    and their eigenvalues.


    A corner point has a high gradient value both in the principal direction, which
    corresponds to the value of both eigenvalues, and in the direction normal to the
    principal, which corresponds to the smallest of the eigenvalues. From the above,
    it can be concluded that for a point to be considered a corner, the eigenvalues
    `lambda1` and `lambda2` must have significant values. Therefore, for the identification
    of a corner, only the `lambda2` value that is the smallest is considered since
    if this value is large, then the value of `lambda1` will be too.


