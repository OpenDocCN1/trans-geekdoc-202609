    ### 1.2.1 对比与照明或亮度


    图像的对比度可以定义为整个图像中存在的不同强度值之间的关系 [2]。对比度与强度的分布有关。在这种情况下，某些图像像素将发生巨大变化。3 这种情况下。如果如前一个例子所示，当强度值集中在较低强度处，则图像会变暗。反之，如果强度值集中在较高强度处，则图像会变亮。为了说明这些情况，通过齐次操作增加图像的对比度或亮度，这等同于作用于于像素的像素。因此，这种函数可以定义为：


    `f[I(x,y)]→I′(x,y)` (1.1)


    对图像的一种频繁操作是根据像素在图像中的位置改变图像的对比度或照明。在这种情况下，某些图像像素将发生巨大变化，而其他元素将表现出微小影响。


    ### 1.2.2 结果的限制


    当使用齐次操作时，计算出的像素值可能会超过 8 位图像定义的范围。因此，新的像素值可能会落在 0–255 的范围之外。如果发生，图像数据类型会自动从 `uint8`
    变为 `double`。如果你用 C 等语言编写程序，需要通过适当的指令避免这种情况。当像素值超过上限时保护程序的一个示例如下：


    ```

    if (Ixy > 255)

    Ixy = 255;

    ```


    前面的操作将消除由于操作产生的任何额外。这种效果在文献中通常被称为“裁剪”（clamping）。使用齐次操作的另一个问题是，像素值小于 8 位灰度图像定义的下限。这发生在照明值降低到某些水平时，产生了负值。如果程序使用以下指令进行保护，也可以避免这一问题：


    ```

    if (Ixy < 0)

    Ixy = 0;

    ```


    ### 1.2.3 图像补色


    图像补色或反转被视为一种改变像素值相反方向的操作（乘以 -1），另一方面增加一个常量强度值。在这种操作下，结果落在允许范围内。对于取值范围 `[0,p[max]]`
    上的一个像素 `p = I(x,y)`，补色或反转操作定义为：


    `finv = p[max] − p` (1.6)


    在 MATLAB® 中实现图像的补色操作，需要执行所示代码：


    ```

    I=imread(''extension'');

    Ig=rgb2gray(I);

    IC=255-Ig;

    ```


    其中 `IC` 是存储在 `I` 中的图像对应的补色结果。图 1.4 显示了使用上述 MATLAB 代码对图像应用补色的效果。


    ![图 1.4 对图像应用补色像素操作的结果。(a) 原始灰度图像和 (b) 补色](img/Fig01_04.jpg)


