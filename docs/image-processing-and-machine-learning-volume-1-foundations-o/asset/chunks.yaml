- raw: '[**FIGURE 4.14**](#C_007_c4.xhtml#f4_14b) Propagation of the labeling process.
    (a) Original image. The first pixel in one is found in (b), all its neighboring
    pixels are zero. Therefore, the pixel receives the label of 2 (c). At the next
    iteration (d), a neighboring pixel has a label of 2, so the current pixel assumes
    this value as its label. In (e), there are two neighboring pixels with the labels
    2 and 5, one of these values will be assumed by the current pixel, and the collision
    that occurred should be registered 2, 5.


    ### 4.7.3 Adjacent Tagging


    If two or more neighbors contain different labels, then a label collision occurs;
    that is, pixels that are grouped together to form the same object have a different
    label. For example, an object with the shape of a “U” will have different labels
    assigned to the left and right sides; this is because, during the displacement
    of the mask along the image, it is not possible to identify that the object is
    connected in the down part.


    When two different labels are present on the same object (as in the previous case),
    a label collision occurs. This collision is not processed directly in step 1 but
    is only recorded for further processing in step 2. The number of collisions present
    depends on the content of the image and can only be known after step 1 has been
    completed.


    As a result of the first step, we have an image with the pixels temporarily labeled,
    as well as a list of detected collisions among pixels belonging to the same object.
    [Figure 4.15a](#C_007_c4.xhtml#f4_15) shows the result of an image after step
    1; all the pixels have a temporary label, while the collisions are registered
    and marked by circles in the correspondence 2, 4, 2, 5 and 2, 6. With this, we
    have the labels *E* = {2,3,4,5,6,7} and the collisions *C* = {2,4,2,5,2,6}, which
    correspond to the nodes of an undirected graph shown in [Figure 4.15b](#C_007_c4.xhtml#f4_15).


    ![FIGURE 4.15 Result of step 1 in the labeling process. Label collisions are represented
    by circles (a), labels and (b) collisions corresponding to nodes of a graph.](images/Fig04_15.jpg)


    [**FIGURE 4.15**](#C_007_c4.xhtml#f4_15b) Result of step 1 in the labeling process.
    Label collisions are represented by circles (a), labels and (b) collisions corresponding
    to nodes of a graph.


    ### 4.7.4 Collision Resolution (Step 2)


    The task of the second pass is to solve the collisions recorded in the first pass.
    This process is not easy since two different labels, tentatively belonging to
    two different objects, may be connected through a third object. This task is identical
    to the problem of finding connected components of a graph, where the labels *E*
    calculated in step 1 represent the nodes of the graph, while the collisions *C*
    their connections ([Figure 4.15](#C_007_c4.xhtml#f4_15)).


    After counting the different labels belonging to the same object, the value of
    the label of each pixel of that object is replaced by a general label corresponding
    to the smallest of those within it (see [Figure 4.16](#C_007_c4.xhtml#f4_16)).


    ![FIGURE 4.16 Result of the object labeling process after the second step. All
    temporarily assigned labels are replaced by the smallest numerical label contained
    in the object](images/Fig04_16.jpg)


    [**FIGURE 4.16**](#C_007_c4.xhtml#f4_16b) Result of the object labeling process
    after the second step. All temporarily assigned labels are replaced by the smallest
    numerical label contained in the object


    In this section, the algorithm to identify the number of objects present in a
    binary image through its labeling has been described. The idea after having performed
    this algorithm is to have a label for each object contained in the image in such
    a way that it can be easily identified.


    ### 4.7.5 Implementation of the Object Labeling Algorithm Using MATLAB


    This section explains how to implement the object labeling program described in
    [Algorithm 4.1](#C_007_c4.xhtml#a4_1). [Program 4.1](#C_007_c4.xhtml#p4_1) implements
    in MATLAB each of the three steps in which the algorithm has been divided. In
    the first step, the image is processed from right to left and from top to bottom.
    In general, during this process, a temporal label is assigned to each pixel of
    the image depending on whether it does not have labeled neighbors or has one or
    more. In the second step, the registered collisions are solved by considering
    the pixels that belong to the regions that have a neighborhood conflict. This
    process is implemented through two nested *for’s* that allow the label exchange
    for each of the elements in the image. The for loop used for the label exchange
    is determined by the label number whose value is the minimum (compared to the
    other in question). In the third step, the labels are reassigned. In this third
    step, several labels are eliminated due to the solution of collisions. Once the
    absolute number of labels is obtained, it would be very simple to use a for loop
    to reassign the labels so that they appear continuously. To implement this process,
    the `unique` function is used. The `unique` function obtains the sequence of unique
    values contained in an array; by unique, it means that no matter how many times
    this value is repeated in the array, it will only be presented once by the `unique`
    function. Its general syntax is:


    ```

    b = unique(A)

    ```


    where A is a matrix whose unique values contained in it are explored, while b
    is a vector that contains the values contained in the matrix without repetition;
    therefore, the value of b applied to our implementation will contain the labels
    that remained after performing the collision resolution process.


    [Figure 4.17](#C_007_c4.xhtml#f4_17) shows the labeling of a series of objects
    contained in a binary image. These results were obtained as a result of the execution
    of the program in MATLAB shown in 4.3.


    ![FIGURE 4.17 Labeling of objects obtained by the execution of the MATLAB® program
    4.3. (a) Original image and (b) labeled image.](images/Fig04_17.jpg)


    [**FIGURE 4.17**](#C_007_c4.xhtml#f4_17b) Labeling of objects obtained by the
    execution of the MATLAB^® [program 4.3](#C_007_c4.xhtml#p4_3). (a) Original image
    and (b) labeled image.


    ## 4.8 Object Borders in Binary Images


    Once the objects have already been labeled in a binary image, the next step could
    be the extraction of the contour or perimeter of each object. This process would
    seem to be simple since, at least intuitively, it would imply the registration
    of the pixels of an object on its border. However, as will be seen in this section,
    a series of elements are needed for the formulation of this algorithm, whose final
    objective is to make an organized description of a contour. Determining the contour
    of binary objects is one of the most frequent tasks in image analysis.


    ### 4.8.1 External and Internal Contours


    As will be seen in Chapter 10 on morphological operations, it is possible to extract
    the boundary of binary regions using differences between morphological operations.
    However, in this section, the problem is faced from a more advanced perspective
    since the idea is not only to determine the contour of a binary object but also
    to order it in a sequence that can be later used to determine different properties.
    An object can present only an outer contour characterized by pixels that belong
    to the object, while other elements are in contact with the background of the
    image. On the other hand, the object can also have different inner contours. These
    types of artifacts appear due to holes present in the main object as a consequence
    of a poor segmentation process (see [Figure 4.18](#C_007_c4.xhtml#f4_18)).


    ![FIGURE 4.18 Binary object with outer and inner contour.](images/Fig04_18.jpg)


    [**FIGURE 4.18**](#C_007_c4.xhtml#f4_18b) Binary object with outer and inner contour.'
