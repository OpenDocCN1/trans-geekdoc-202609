    ### 3.3.5.1 Sobel 算子


    Sobel 算子使用表 3.1 中描述的滤波器来近似偏导数 $\partial I/\partial u$ 和 $\partial I/\partial v$。根据方程
    3.5 对这些偏导数组合，我们得到了每个像素$(u,v)$的梯度值。然后，如果一个像素$(u,v)$的梯度值大于预设阈值`U`（作为标准），则认为该像素对应图像的边缘。


    图像处理工具箱在 Sobel 方法下实现的边缘检测函数的通用调用方式为：


    ```

    [g,t]=edge(f, ‘sobel’, U, dir)

    ```


    其中`f`是用于从中提取边缘的图像。`U`是用作分类边缘标准的阈值。`dir`选择梯度方向，如果使用$H[x]S)}$则可以选择‘horizontal’（水平），如果使用$H[y]S)}$则可以选择‘vertical’垂直垂直选项‘both’是默认选项，意味着同时计算两个滤波器。结果是函数获得了图像
    `g`，如上所述，该图像包含了检测到的边缘。`g`是一幅二值图像，边缘像素的值为 1，而非边缘像素的值为 0。如果指定了阈值`U`，则`t = U`。如果没有指定`U`，算法会自动确定一个阈值，将其用于边缘检测并将其值返回在`t`中。


    ### 3.3.5.2 Prewitt 算子


    Prewitt 算子使用表 3.1 指定的系数矩阵进行边缘检测。该函数的通用结构如下：


    ```

    [g,t]=edge(f, ‘prewitt’, U, dir)

    ```


    该函数的参数与 Sobel 案例所示的相同。与 Sobel 案例相比，Prewitt 算子的实现（从计算角度来说）简单一点。然而，得到的结果噪声更多。这是因为
    Sobel 滤波器对数据执行了平滑操作，这在计算梯度的像素行或列中值为 2 的系数中可以观察。


    ### 3.3.5.3 Roberts 算子


    Roberts 算子使用表 3.1 中定义的滤波器来近似像素$(u,v)$处的梯度幅值。该函数的通用结构如下：


    ```

    [g,t]=edge(f, ‘roberts’, U, dir)

    ```


    该函数的参数与 Sobel 算子案例中的描述相同。Roberts 算子是计算图像梯度的最老方法之一。尽管这种方法实现最简单，但由于是非对称的，它的功能有限。因此，它无法检测方向为
    45°倍数的边缘。作为对比，图 3.11 显示了将函数应用于不同算子以检测图像边缘的结果。图中，所有情况都使用相同的阈值。


    ## 3.4 基于二阶导数的算子


    之前，基于一阶导数的算子组已在 3.2 节中描述为近似图像梯度的方法。除了这些滤波器，还有其他基于图像二阶导数的算子。


    ### 3.4.1 使用二阶导数的边缘检测


    利用二阶导数检测边缘基于过交叉。过交叉只是从正变为负或反之的转换。


