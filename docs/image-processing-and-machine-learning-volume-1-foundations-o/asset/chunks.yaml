    **图 2.29** (#C_005_c2.xhtml#f2_29b) 图像上的相关和卷积操作。(a) 原始图像 `f` 和核 `k`，(b) 在原始图像上添加了“零”，以确保每个核系数都有对应的像素值，(c)
    开始对添加了零的图像与核进行相关，(d) 考虑了带有额外零图像的“完整”（full）相关结果，(e) 在不给原始图像添加零的情况下，与图像大小相同的“相同”（same）相关结果，其大小与原始图像相同，(f)
    旋转 180°的原始图像和核以进行卷积，(g) 卷积的完整结果，以及 (h) 与图像大小相同的“相同”（same）卷积结果。


    ### 2.9.2 图像边界的处理


    正如前面的章节中反复提到的，一个重要的问题是处理图像边界的方法。当使用滤波器对图像进行相关或卷积操作时，图像边缘的某些滤波器系数在图像中没有对应的强度值。如何处理这个问题对最终结果有一定影响。


    解决这个问题有四种替代方案：


    *   在边界处添加零行

    *   复制等于图像最后行或最后一列的数值行

    *   添加类似于图像在镜子中反射的行

    *   添加类似于图像循环重复自身的行


    接下来，将简要描述这些元素中的每一个。然后，这些概念将与 MATLAB 如何将此类解决方案整合到其函数中联系起来。


    *在边界处添加零行*。这种形式在上面已经提到过，作为图像边界问题的解决方案，即在图像上添加若干行零行（取决于滤波器的大小），以确保系数与像素的对应关系。在
    MATLAB 中，这种向图像添加零的选项是通过标志 `‘0’` 来考虑的。图 2.30 展示了这一过程。


    ![图 2.30 向图像添加零，以确保图像每个像素与每个滤波器系数的对应关系。](img/Fig02_30.jpg)


    **图 2.30** (#C_005_c2.xhtml#f2_30b) 向图像添加零，以确保图像每个像素与每个滤波器系数的对应关系。


    *复制等于图像最后行或最后一列的数值行*。在这种选项中，向图像添加了与图像边界行相同的行，换句话说，这意味着通过重复图像的最后一行或最后一列来增加图像的大小。根据需要进行若干次集成（取决于滤波器的大小）。这种替代方案比仅仅添加零更优。在
    MATLAB 中，此选项由 `‘replicate’` 标志定义。图 2.31 展示了这一过程。


    ![图 2.31 向图像添加零行，以确保图像每个像素与每个滤波器系数的对应关系。](img/Fig02_31.jpg)


    **图 2.31** (#C_005_c2.xhtml#f2_31b) 向图像添加零行，以确保图像每个像素与每个滤波器系数的对应关系。


    *添加类似于图像在镜子中反射的行*。在这种情况下，按照图像在镜子中反射的方式向图像添加行和列。此选项比之前的要复杂一点，因为行和列不是固定的，而是取决于滤波器。在
    MATLAB 中，此选项由 `‘symmetric’` 标志定义。图 2.32 展示了这一过程。


    ![图 2.32 向图像添加零，以确保图像每个像素与每个滤波器系数的对应关系。](img/Fig02_32.jpg)


    **图 2.32** (#C_005_c2.xhtml#f2_32b) 向图像添加零，以确保图像每个像素与每个滤波器系数的对应关系。


    *添加类似于图像循环重复自身的行*。在这种情况下，向图像添加行和列的方式就好像图像本身在上下、左右不断重复一样。在 MATLAB 中，此选项由 `‘circular’`
    标志定义。图 2.33 展示了这一过程。


    ![图 2.33 向图像添加零，以确保图像每个像素与每个滤波器系数的对应关系。](img/Fig02_33.jpg)


    **图 2.33** (#C_005_c2.xhtml#f2_33b) 向图像添加零，以确保图像每个像素与每个滤波器系数的对应关系。


    ### 2.9.3 用于线性空间滤波的 MATLAB 函数


    MATLAB 图像工具箱实现了用于图像线性滤波的 `imfilter` 函数，其结构如下：


    ```

    g=imfilter(f,H,filter_mode,border_options,result_size)

    ```


    其中 `g` 是滤波后的图像，`f` 是要用 `H` 滤波的图像。`filter_mode` 标志指定函数使用相关（‘corr’）还是卷积（‘conv’）进行滤波。`border_options`
    标志指的是函数解决边界问题的方法。其选项有 `replicate`、`symmetric` 和 `circular`，其影响已经在 2.8.2 节讨论过。`result_size`
    标志指示滤波结果的大小。其选项可以是 `same` 和 `full`。同样，这些选项的影响已经在 2.8.1 节中解释过。表 2.1 显示了标志及其可能选项的摘要。


    **表 2.1** (#C_005_c2.xhtml#t2_1b) imfilter 函数结构元素总结


    | 选项 | 描述 |

    | --- | --- |

    | *滤波模式* | |

    | `corr` | 使用相关性进行滤波。这是默认选项。 |

    | `conv` | 使用卷积进行滤波。 |

    | *边界选项* | |

    | `0` | 通过添加“零”来完成图像。 |

    | `replicate` | 通过添加等于图像边界行的行列来完成图像。这是默认选项。 |

    | `symmetric` | 通过添加镜像反射行和列得到的行和列来完成图像。 |

    | `circular` | 通过添加当图像视为周期信号时得到的行和列来完成图像，即图像在上下、左右重复。 |

    | *结果大小* | |

    | `full` | 结果滤波图像的大小为在边界添加了行列以确保像素-系数对应的图像大小。 |

    | `same` | 滤波结果的大小为原始图像的大小。这是默认选项。 |


    '
