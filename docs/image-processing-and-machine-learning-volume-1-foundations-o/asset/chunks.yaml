    the value 0, `h(1)` the number of pixels that have the value 1, and so on, while
    finally `h(255)` represents the number of white pixels (with the maximum intensity
    value) in the image. As a result of the histogram calculation, a one-dimensional
    vector `h` with a length `K` is obtained, as shown in [Figure 1.8](#C_004_c1.xhtml#f1_8)
    where `K=16`.


