    types of illumination. It is possible to observe that the pixels in image (a)
    cover the entire dynamic (0–255) width of the histogram (b). On the other hand,
    images (c) and (e) have histograms with intensity values concentrated in whiter
    colors (values close to 255) and in the darker colors (values close to 0), histograms
    (d) and (f), respectively.


