    of the image. In addition to these filters, there are other types of operators
    that are based on the second derivative of the image function.


    ### 3.4.1 Edge Detection Using the Second-Derivative


    The detection of edges by means of the second derivative is based on zero crossing.
    A zero crossing is nothing more than the transition from positive to negative
    or vice versa.

