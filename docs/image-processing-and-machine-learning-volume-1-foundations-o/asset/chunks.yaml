    ### 1.2.4 阈值分割


    阈值分割可以被看作量化的一种特殊形式，其中图像像素根据它们与预定义阈值值 `p[th]` 的关系被分为两类。图像中的所有像素根据其与阈值的关系，假设两个不同的值
