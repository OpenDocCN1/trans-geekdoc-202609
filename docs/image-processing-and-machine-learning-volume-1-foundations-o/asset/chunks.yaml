    在使用中值滤波器时，滤波器感兴趣区域内考虑的所有像素在确定结果方面具有相同的重要性。正如本章的几个部分提到的，滤波器的一种理想行为是赋予要替换图像像素所对应的滤波器中心系数更大的权重。


