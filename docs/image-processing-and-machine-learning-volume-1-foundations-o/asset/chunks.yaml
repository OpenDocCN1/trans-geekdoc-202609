    as input to the algorithm, which contains edge information (extracted using methods
    such as those explained in [Chapter 3](#C_006_c3.xhtml)). From now on, it will
    be used as a convention that a one in the image determines that the pixel is part
    of the border and a zero that it is part of the background.


