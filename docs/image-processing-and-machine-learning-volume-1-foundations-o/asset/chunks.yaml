    a different set of pixels in the image. If a histogram element is shifted as a
    consequence of an operation, then all pixels of the corresponding set will also
    be modified in the same way. When two histogram elements *h*(*p*[1]) y *h*(*p*[2])
    are joined together, their corresponding sets of pixels are also added together
    and are now non-separable.


    As a result of an operation such as those mentioned above, the histogram value
    can shift, with the effect that all pixels belonging to this intensity value change.
    However, what happens when two different intensity values coincide as a result
    of an operation? In that case, both sets of pixels are merged, and the full amount
    of both is added together to generate a single intensity value for the histogram.
    Once different intensity levels have been merged into one, it is not possible
    to differentiate the subsets of pixels. Consequently, it is not possible to divide
    them. From the above, it is possible to conclude that this process or operation
    is associated with a loss in the dynamics and information of the image.


    ### 1.3.6 Automatic Contrast Adjustment


    The objective of the automatic adaptation of the contrast is that the pixel values
    of an image are automatically modified in order to completely cover the allowed
    range of intensity values. To achieve this, a procedure is performed in which
    it is considered that the darkest pixel in the image is forced to take the smallest
    allowable value in the range of intensity values and the brightest pixel to the
    highest allowable value, while the rest of the pixels between these two values
    are linearly interpolated within this range \[[6](#C_004_c1.xhtml#r1_6)\].


    Considering that *p*[low] y *p*[high] are the current intensity values corresponding
    to the smallest and highest pixels of an image *I*, which has a set of intensity
    values defined by the Interval \[*p*[min],*p*[max]\]. To cover the full scale
    of intensity values of the image, the pixel with the lowest intensity contained
    in the image is considered as the smallest of the allowable range (zero for an
    8-bit grayscale image), and then the contrast (see [Figure 1.16](#C_004_c1.xhtml#f1_16))
    is modified by the factor:


    ![FIGURE 1.16 The auto-contrast operation, in which from Equation 1.10, the pixel
    value p is linearly interpolated from the interval \[plow, phigh\] to the interval
    \[pmin, pmax\].](images/Fig01_16.jpg)


    [**FIGURE 1.16**](#C_004_c1.xhtml#f1_16b) The auto-contrast operation, in which
    from Equation 1.10, the pixel value *p* is linearly interpolated from the interval
    \[*p*[low], *p*[high]\] to the interval \[*p*[min], *p*[max]\].


    $\\frac{p\_{\\text{max}} - p\_{\\text{min}}}{p\_{\\text{high}} - p\_{\\text{low}}}$
    (1.10)


    Therefore, the simplest function of contrast adaptation *f*[ac] is defined as
    follows:


    $f\_{ac} = \\left( {p - p\_{low}} \\right)\\left( \\frac{p\_{max} - p\_{min}}{p\_{high}
    - p\_{low}} \\right) + p\_{min}$ (1.11)


    For an 8-bit grayscale image, the function can be simplified to:


    $f\_{\\text{ac}} = \\left( {p - p\_{\\text{low}}} \\right) \\cdot \\left( \\frac{255}{p\_{\\text{high}}
    - p\_{\\text{low}}} \\right) + p\_{\\text{min}}$ (1.12)


    The value of the interval \[*p*[min],*p*[max]\] does not always mean that it is
    the maximum permissible range of image representation, but it can also represent
    any range of interest for an image representation. Under such conditions, this
    method originally planned to increase the contrast can also be used to represent
    the image within a particular permissible range *p*[low] and *p*[high]. [Figure
    1.17](#C_004_c1.xhtml#f1_17) shows the effect of the auto-contrast operation *p′*.


    ![FIGURE 1.17 The effect of the auto contrast operation. (a) Original image with
    low contrast, (b) enhanced image, (c) histogram of the original image, and (d)
    histogram of the enhanced image.](images/Fig01_17.jpg)


    [**FIGURE 1.17**](#C_004_c1.xhtml#f1_17b) The effect of the auto contrast operation.
    (a) Original image with low contrast, (b) enhanced image, (c) histogram of the
    original image, and (d) histogram of the enhanced image.


    As can be seen from [Figure 1.17](#C_004_c1.xhtml#f1_17), the self-adjustment
    of contrast performed by using Equation. 1.11 can produce that the extreme pixel
    values contained in the image change radically or very little the complete distribution
    of the resulting histogram. This is because the values of *p*[low] and *p*[high]
    from the original histogram involve a very small number of pixels that do not
    significantly represent the complete distribution. To avoid this problem, some
    fixed percentages (*s*[low],*s*[high]) are defined from which the distribution
    is considered significant for both the starting point (dark pixels) and the end
    element (light pixels) of the distribution. With these percentages, we calculate
    the new boundaries of the distribution. For this purpose, the lower boundary *a*[low]
    is considered the intensity value at which the number of pixels of lower intensities
    added together is greater than or equal to *s*[low]. Likewise, *a*[high] is the
    upper boundary intensity value at which the number of pixels of higher intensities
    added together is less than or equal to *s*[high]. See [Figure 1.18](#C_004_c1.xhtml#f1_18)
    for an illustration of the process. The values *a*[low] y *a*[high] depend on
    the image content and can be easily calculated from the cumulative histogram.
    *H*(*i*) of image *I*, such that:


    ![FIGURE 1.18 Auto-contrast operation considers percentage values to generate
    new boundaries. They now represent the significant values of the distribution.
    All values between 0 y alow as well as ahigh and 255 are ignored in the adjustment
    so that the resulting image reflects an improvement in contrast.](images/Fig01_18.jpg)


    [**FIGURE 1.18**](#C_004_c1.xhtml#f1_18b) Auto-contrast operation considers percentage
    values to generate new boundaries. They now represent the significant values of
    the distribution. All values between 0 y *a*[low] as well as *a*[high] and 255
    are ignored in the adjustment so that the resulting image reflects an improvement
    in contrast.


    *a*[low] = min {*i*|*H*(*i*)≥*M*⋅*N*⋅*s*[low]} (1.13)


    *a*[high] = max {*i*|*H*(*i*)≤*M*⋅*N*⋅(1−*s*[high])} (1.14)


    where *M* ⋅ *N* is the number of pixels in the image *I*. All values outside the
    interval *a*[low] y *a*[high] are not considered for contrast enhancement, while
    values within this range are linearly scaled to occupy the permissible range \[*p*[min],*p*[max]\].
    The pixel operation used to perform the auto-contrast operation can be formulated
    as follows:


    $f\_{\\text{mac}} = \\left\\{ \\begin{matrix} p & \\text{si}\_{\\text{low}} &
    {}\_{\\text{min}} \\\\ \\left( {p - a\_{\\text{low}}} \\right) & {\\text{si}a\_{\\text{low}}
    < p} & {< a\_{\\text{high}}} \\\\ p & \\text{si}\_{\\text{high}} & {}\_{\\text{max}}
    \\\\ \\end{matrix} \\right.$ (1.15)


    In practice, *s*[low] y *s*[high] are assigned the same value. They typically
    assume values within the interval \[0.5, 1.5\]. An example of this operation is
    provided by the popular image-processing program Photoshop, where the value of
    s is set to *s*[low] = 0.5 in order to perform auto-adjustment of the contrast
    in images.


    ### 1.3.7 Cumulative Histogram


    The cumulative histogram is a variant of the normal histogram. It provides important
    information for performing pixel-by-pixel operations on images (point operations),
    for example, to balance a histogram. The cumulative histogram *H*(*i*) is defined
    as:


    $H\\left( i \\right) = {\\sum\\limits\_{j = 0}^{i}{h\\left( j \\right)}}\\quad\\text{para}0
    \\leq i < K$ (1.16)


    The value of *H*(*i*) is then the sum of all the elements below the specified
    value *i* of the “classical” histogram *h*(*j*) with the values *j* = 0…*i*. or
    the value obtained considering the immediately preceding value'
