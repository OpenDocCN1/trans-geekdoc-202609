- raw: 'Within the search process, two important problems arise: pixels outside the
    image field and the search direction. The first problem occurs mainly when the
    search is carried out within the limits of the image, and due to the displacements,
    the selected pixel does not exist within the image. This situation is solved by
    adding a condition to the code that allows evaluating if the selected pixel exists
    within the limits defined for the image.


    The second problem appears when, in the local search, the displacement of the
    pixels takes a certain direction; however, in the opposite direction, there are
    pixels that, according to the similarity measure, correspond to the region to
    be seeded. Under these conditions, the search process should be able to modify
    the direction when searching in a determined direction has already been exhausted.
    To solve this, a list ***L*** is implemented to store the unselected pixels. The
    position of the pixel and its intensity are recorded in the list. Therefore, the
    list is used in the comparison. So, when a new pixel **pn** has been found locally,
    its intensity is compared with the elements contained in the list ***L***. From
    this comparison, it could happen that a distant pixel **pd** is similar to **pn**,
    which would imply that pixels with similar characteristics have already been exhausted
    in the vicinity of **pn**. Under such conditions, a change of direction is necessary.
    Each time a pixel with similar characteristics is found within the local search
    process, the information of this pixel is extracted from the list. This action
    determines that the pixel information is already part of the segmented region
    **R**. [Figure 4.11](#C_007_c4.xhtml#f4_11) shows the store process of the list
    ***L*** for an image. In the image, it can be seen how the search that begins
    in the seed pixel **s(x,y)** has followed the direction marked by the arrow, when
    pixels with the characteristics to be segmented are also found in opposite directions.


    ![FIGURE 4.11 Store process of list L for an image.](images/Fig04_11.jpg)


    [**FIGURE 4.11**](#C_007_c4.xhtml#f4_11b) Store process of list **L** for an image.


    In order to check if a pixel is similar to another, considering the intensity
    as a similarity criterion (as is the common case), two parameters are important
    for the region-growing segmentation method: (A) the maximum permissible dissimilarity
    and (B) the similarity of the segmented region.


    The maximum permissible dissimilarity (**Mp**) represents the maximum possible
    difference between two pixels that is considered similar. This element is considered
    a configuration parameter. Therefore, the searching process will be executed until
    the difference between the members of the list **L** and the new pixel **pn**
    is higher than **Mp**.


    The segmented region similarity (**Srs**) defines the average intensity of the
    region to be segmented. This parameter allows for more robust segmentations since
    its value is iteratively updated each time a new pixel is found within the segmented
    region R. The **Srs** parameter is calculated considering the following model:


    ${\\mathbf{S}\\mathbf{r}\\mathbf{s}\\left( {k + 1} \\right)} = \\frac{{\\mathbf{S}\\mathbf{r}{{\\mathbf{s}\\left(
    k \\right)} \\cdot \\left| \\mathbf{R} \\right|}} + {I\\left( {\\mathbf{p}\\mathbf{n}}
    \\right)}}{\\left| \\mathbf{R} \\right| + 1}$ (4.9)


    where the value of **S****r****s**(*k*+1) represents the updated value of **S****r****s**(*k*),
    while |**R**| corresponds to the number of elements currently part of the segmented
    region. Finally, *I*(**p****n**) defines the intensity of the new pixel **pn**.


    [Program 4.2](#C_007_c4.xhtml#p4_2) shows the MATLAB code that implements the
    region-growing segmentation method. [Figure 4.12](#C_007_c4.xhtml#f4_12) exhibits
    the original image and the image obtained as a result of the operation of [Program
    4.2](#C_007_c4.xhtml#p4_2).


    ![FIGURE 4.12 Results of the region growing segmentation method produced by Program
    4.2. (a) Original image and (b) the resulting image.](images/Fig04_12.jpg)


    [**FIGURE 4.12**](#C_007_c4.xhtml#f4_12b) Results of the region growing segmentation
    method produced by [Program 4.2](#C_007_c4.xhtml#p4_2). (a) Original image and
    (b) the resulting image.


    ## 4.7 Labeling of Objects in Binary Images


    Object labeling is a classic image processing technique that is known in the literature
    and vision community as “region labeling”. A binary image is a numerical representation
    that presents only two classes of elements: ones (that indicate a specific object)
    and zeros (that correspond to the background). An example of a digital image with
    different objects is shown in [Figure 4.13](#C_007_c4.xhtml#f4_13). Under region
    labeling, the objective is to identify the number of binary objects contained
    in an image. The algorithm essentially consists of two steps: (1) temporary labeling
    of the objects and (2) the solution of multiple pixel labels belonging to the
    same object. The method is relatively complex (especially step 2). However, due
    to its moderate memory requirements, it represents a good choice for object labeling.
    The complete algorithm is described in [Algorithm 4.1](#C_007_c4.xhtml#a4_1).


    ![FIGURE 4.13 Binary image with four elements.](images/Fig04_13.jpg)


    [**FIGURE 4.13**](#C_007_c4.xhtml#f4_13b) Binary image with four elements.


    ### 4.7.1 Temporary Labeling of Objects (Step 1)


    In the first step, the image is analyzed from left to right and from top to bottom.
    At each movement, each pixel (*x*,*y*) is assigned a temporary label. The value
    of the label depends on the type of neighborhood defined, which can be 4-neighbors
    or 8-neighbors. For each case, the used mask can `be` defined as follows:


    $N\_{4}\\left( {x,y} \\right) = \\begin{bmatrix} \\cdot & N\_{2} & \\cdot \\\\
    N\_{1} & \\times & \\cdot \\\\ \\cdot & \\cdot & \\cdot \\\\ \\end{bmatrix}\\
    N\_{8}\\left( {x,y} \\right) = \\begin{bmatrix} N\_{2} & N\_{3} & N\_{4} \\\\
    N\_{1} & \\times & \\cdot \\\\ \\cdot & \\cdot & \\cdot \\\\ \\end{bmatrix}$ (4.10)


    where × identifies the current pixel at position (*x*,*y*). In the case of 4-neighbors,
    only the pixels *N*[1] = *I*(*x*−1,*y*) and *N*[2] = *I*(*x*,*y*−1) are considered,
    while in the case of 8-neighbors, the pixels *N*[1], …, *N*[4] are considered.
    [Figure 4.14](#C_007_c4.xhtml#f4_14) shows the complete process of step 1 carried
    out on an image and considers the 8-neighbor neighborhood as the criterion.


    ### 4.7.2 Propagation of Labeling


    It is considered that the pixel value of the object in a given position is *I*(*x*,*y*) = 1,
    while for a given background position, it is *I*(*x*,*y*) = 0. In addition, it
    is also assumed that the pixels outside the image are zero or part of the background.
    The neighborhood region is considered horizontally first and then vertically,
    defining the upper left corner as the starting point. In the process, if the current
    pixel *I*(*x*,*y*)is one, then a new label is assigned to it, or an existing one
    is assigned to it of one of its neighbors *N*(*x*,*y*) already has one. Therefore,
    the choice of the type of neighborhood (4-neighbors or 8-neighbors) for the determination
    of labels has a great impact on the final result. [Figure 4.14](#C_007_c4.xhtml#f4_14)
    exhibits the process of propagation of labeling.


    ![FIGURE 4.14 Propagation of the labeling process. (a) Original image. The first
    pixel in one is found in (b), all its neighboring pixels are zero. Therefore,
    the pixel receives the label of 2 (c). At the next iteration (d), a neighboring
    pixel has a label of 2, so the current pixel assumes this value as its label.
    In (e), there are two neighboring pixels with the labels 2 and 5, one of these
    values will be assumed by the current pixel, and the collision that occurred should
    be registered 2, 5.](images/Fig04_14.jpg)'
