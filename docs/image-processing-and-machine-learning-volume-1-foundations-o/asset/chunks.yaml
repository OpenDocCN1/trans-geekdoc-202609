    ### 5.2.5 Determination of the Corner Points


    A pixel (*x*,*y*) is considered a potential corner point if the following condition
    is met:


    *V*(*x*,*y*) > *t*[*h*] (5.13)


    where *t*[*h*] is the threshold that determines the corner affinity. Its typical
    value is within the range of 900 to 10,000, depending on the context of the image.
    Therefore, from the application of Equation 5.13, we will have a binary matrix
    containing ones (true) where the condition was fulfilled and zeros (false) where
    it was not valid.


    To prevent the location of highly populated regions of corner points, which are
    calculated due to the high sensitivity of the value *α*, only those pixels whose
    value *V*(*x*,*y*) is the largest within a given neighborhood are selected. [Figure
    5.3](#C_008_c5.xhtml#f5_3) shows an illustration of this process.


    ![FIGURE 5.3 Process of obtaining the significant corners. For all the corners
