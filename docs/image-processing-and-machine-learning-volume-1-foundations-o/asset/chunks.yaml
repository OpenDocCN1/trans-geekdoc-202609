    # 1 Pixel Operations


    DOI: [10.1201/9781003287414-1](https://doi.org/10.1201/9781003287414-1)


    ## 1.1 Introduction


    Pixel operations refer to those operations performed on images where only the
    pixel value of interest `p = I(x,y)` from the image is considered [[1](#C_004_c1.xhtml#r1_1)].
    Each new pixel value calculated `p′ = I′(x,y*)` is dependent on the value of the
    original pixel `p = I(x,y)` at the same position. Thus, it is independent of the
    values of other pixels, such as its closest neighbors. The new pixel value is
    determined through a function `f[I(x,y)]`, so that:


    `f[I(x,y)]→I′(x,y)` (1.1)


    [Figure 1.1](#C_004_c1.xhtml#f1_1) shows a representation of this type of operation.
    If, as in the previous case, the function `f(⋅)` is independent of the image coordinates,
    its values do not depend on the pixel position, so the function is called homogeneous.
    Examples of typical homogeneous operations are:


    ![FIGURE 1.1 Representation of pixel operations, in which the resulting pixel
    depends only on the value of the function operating on the original pixel.](images/Fig01_01.jpg)


    [**FIGURE 1.1**](#C_004_c1.xhtml#f1_1b) Representation of pixel operations, in
    which the resulting pixel depends only on the value of the function operating
    on the original pixel.


    * Contrast and illumination changes in the image

    * Application of certain illumination curves

    * Inverting or complementing an image

    * Threshold segmentation of an image

    * Gamma correction of an image

    * The color transformation of an image


    On the other hand, non-homogeneous pixel operations consider not only the value
    of the pixel in question but also its relative position in the image, that is
    `I′(x,y)`.


    `g[I(x,y),x,y]→I′(x,y)` (1.2)


    A frequent operation performed on images using non-homogeneous operations is the
    changing of contrast or illumination of an image depending on the position of
    the pixel in the image. Under such conditions, some image pixels will be strongly
    altered, while other elements will present only small effects.


    ## 1.2 Changing the Pixel Intensity Value


    ### 1.2.1 Contrast and Illumination or Brightness


    The contrast of an image can be defined as the relationship between the different
    intensity values present in the whole image [[2](#C_004_c1.xhtml#r1_2)]. The contrast
    is related to how the intensity values are distributed [[3](#C_004_c1.xhtml#r1_3)].
    Suppose they are concentrated toward lower intensity values. In that case, the
    image will appear darker. In contrast, if the intensity values are concentrated
    toward higher intensity values, the image will appear bright or illuminated. To
    exemplify these conditions, we can present examples of increasing the contrast
    of an image by 50%, which would be equivalent to applying a homogeneous function
    that multiplies the pixel by 1.5. Another example can be to increase the illumination
    or brightness by 100 levels, which would be equivalent to employing a function
    that adds 100 units to the pixel in question. Thus, the homogeneous function can
    be defined as follows:


    `f[c](I(x,y)) = I(x,y) ⋅ 1.5` (1.3)


    `f[h](I(x,y)) = I(x,y) + 100` (1.4)


    The generic operator `f(⋅)`, which is used to modify the contrast or illumination
    in an image, can be formulated as follows:


    `I(x,y) = f(x,y) = c ⋅ I(x,y) + b;` (1.5)


    where `I(x,y)`, `f(x,y)`, `c`, and `b` are variables. [Figure 1.2](#C_004_c1.xhtml#f1_2)
    shows the effect of having applied the operation.


    ![.2 Representation of pixel operations, in which the resulting pixel depends
    only on the value of the function operating on the original pixel.](images/Fig01_02.jpg)


    [**FIGURE 1.2**](#C_004_c1.xhtml#f1_2b) Representation of pixel operations, in
    which the resulting pixel depends only on the value of the function operating
    on the original pixel.


    ### 1.2.2 Delimitation of Results


    When homogeneous operations are used, the calculated pixel value may exceed the
    limited value defined by 8-bit images. Therefore, new pixel values could fall
    outside the range of 0–255. If this happens, the image data type automatically
    changes from `uint8` to `double`. If you write programs in a language such as
    C, you need to avoid this by using appropriate instructions. One example to protect
    the program when the pixel value exceeds the upper limit is considered as follows:


    ```

    if (Ixy > 255)

    Ixy = 255;

    ```


    The previous operation will have the effect of eliminating any excess produced
    by the application of the operation on the image. This effect is often referred
    to in the literature as "clamping." Another problem in the use of homogeneous
    operations occurs when the calculated value of the pixel is less than the lower
    limit defined for 8-bit grayscale image. This can happen when the value of the
    illumination is reduced to some levels, producing negative values. This problem,
    as well as the previous one, is avoided if the program is protected with the following
    instructions:


    ```

    if (Ixy < 0)

    Ixy = 0;

    ```


    ### 1.2.3 Image Complement


    Image complement or inversion is considered a pixel operation in which the pixel
    value is altered in the opposite direction (by multiplying the pixel value by
    −1), while on the other hand, a constant intensity value is added. Under this
    operation, the result falls within the allowed range of values. For one pixel
    `p = I(x,y)` on range of values `[0,p[max]]` the complement or inversion operation
    is defined as:


    `f[inv](p) = p[max] − p` (1.6)


    To implement the complement operation of an image in MATLAB®, it is necessary
    to perform the code shown below:


    ```

    I=imread(''extension'');

    Ig=rgb2gray(I);

    IC=255-Ig;

    ```


    Where `IC` is the result of the complement corresponding to the image stored in
    `I`. [Figure 1.4](#C_004_c1.xhtml#f1_4) shows the effect of having applied the
    complement on an image using the previous code in MATLAB.


    ![FIGURE 1.4 Result of applying the complement pixel operation to an image. (a)
    Original grayscale image and (b) complement.](images/Fig01_04.jpg)

    '
