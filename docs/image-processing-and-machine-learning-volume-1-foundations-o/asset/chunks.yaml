    # 6 Line Detection


    DOI: [10.1201/9781003287414-6](https://doi.org/10.1201/9781003287414-6)


    ## 6.1 Structures in an Image


    An intuitive approach to finding structures in an image could consist of starting
    from a certain point belonging to an edge, step by step adding the pixels belonging
    to the entire edge, and with them determining the structure. The previous approximation
    can be tried both on images from gradient thresholding as well as images from
    segmentation. This approximation, however, will fail as it does not consider the
    fractures and ramifications in the edges due to the noise and the uncertainty
    inherent to the algorithms for calculating the gradient or the segmentation that
    do not incorporate any kind of criteria on the shapes that are sought in the image
    \[[1](#C_009_c6.xhtml#r6_1)\].


    A totally different approach is the global search for structures present in the
    image that somehow approximate or relate to a previously specified type of form.
    As can be seen in [Figure 6.1](#C_009_c6.xhtml#f6_1), to the eyes of a human,
    the types of structures present in the images are clearly distinguishable, despite
    the large number of added points. Until now, the responsible biological mechanism
    that allows relating and recognizing structures in the images perceived by humans
    or animals has been unknown. A technique that allows, at least from the computational
    point of view, to solve this problem is the so-called Hough transform \[[2](#C_009_c6.xhtml#r6_2)\],
    which will be treated in detail in this chapter.


    ![FIGURE 6.1 Existing biological mechanisms in humans allow geometric parametric
    structures to be clearly identified without uncertainty, despite the set of points
    added as noise to the images (a) and (b).](images/Fig06_01.jpg)


    [**FIGURE 6.1**](#C_009_c6.xhtml#f6_1b) Existing biological mechanisms in humans
    allow geometric parametric structures to be clearly identified without uncertainty,
    despite the set of points added as noise to the images (a) and (b).


    ## 6.2 Hough Transform


    The Hough Transform method, devised by Paul Hough and patented in the United States
    of America, is commonly known in the vision community as the Hough Transform \[[3](#C_009_c6.xhtml#r6_3)\].
    This transform allows locating parametric shapes from a distribution of points
    present in an image \[[4](#C_009_c6.xhtml#r6_4)\]. Parametric shapes are lines,
    circles, or ellipses, which can be described by using a few parameters. Because
    these types of objects (lines, circles, and ellipses), as shown in [Figure 6.2](#C_009_c6.xhtml#f6_2),
    are frequently presented in images, it is especially important to find them automatically.


    ![FIGURE 6.2 Parametric figures such as lines, circles, or ellipses are frequently
    present in images.](images/Fig06_02.jpg)


    [**FIGURE 6.2**](#C_009_c6.xhtml#f6_2b) Parametric figures such as lines, circles,
    or ellipses are frequently present in images.


    In this chapter, the use of the Hough Transform will be analyzed for the detection
    of lines on binary images produced by gradient thresholding because this is a
    frequent application in many vision or image processing systems \[[5](#C_009_c6.xhtml#r6_5)\],
    and it is also the case introduction that allows to analyze the capacities of
    this transform. A line in a two-dimensional space is described by using two real
    parameters expressed in Equation 6.1,


    *y* = *k**x* + *d* (6.1)


    where *k* represents the slope and the point of the axis where the line intercepts
    it (see [Figure 6.3](#C_009_c6.xhtml#f6_3)). A line that passes through two different
    points *p*[1] = (*x*[1],*y*[1]) and *p*[2] = (*x*[2],*y*[2]) must satisfy the
    following conditions:'
