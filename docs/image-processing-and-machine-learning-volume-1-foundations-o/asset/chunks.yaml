    图 4.7 根据分布重叠进行二值化的最佳阈值。


    在分布重叠的情况下，有几种确定最佳阈值的方法。它们大多数通过迭代操作，测试某个阈值，使得每个对象的像素接近其自身的平均强度而不是相反对象的平均强度。


    ## 4.5 Otsu 算法


    Otsu 方法是计算最佳阈值的常用方法。该方法使用图像强度直方图对两个类别进行二值化。该方法考虑一个维度为 `M×N` 具有 `L-1` 级的图像。直方图呈现了两个重叠区域：第一个对应对象
    A，涉及从 0 到 `k` 的强度值，而第二个整合了从 `k+1` 到 `L-1` 的灰度。图 4.8 说明了分布及其相关变量。


    ![图 4.8 使用 Otsu 方法分割两个分布的过程。](img/Fig04_08.jpg)


    图 4.8 使用 Otsu 方法分割两个分布的过程。


    Otsu 方法通过计算每个对象或类别的概率开始：


    $\begin{matrix} {P\left( A \right) = {\\sum\limits\_{i = 0}^{k}{h\left( i \right)}
    = w_{A}\left( k \right)} = w\left( k \right)}}} \\\\ {P\left( B \right) = {\\sum\limits\_{i
    = k + 1}^{L - 1}{h\left( i \right)} = w_{B}\left( k \right)} = 1 - w\left( k \right)}}}
    \\\\ \end{matrix}$ (4.1)


    其中 `h(i)` 代表图像中强度为 `i` 的像素数量。在条件下，每个对象的平均强度可以计算如下：


    $\begin{matrix} {\\mu_{A}\left( k \right) = \frac{1}{w_{A}\left( k \right)}{\\sum\limits\_{i
    = 0}^{k}{i \cdot h\left( i \right)}}} \\\\ {\\mu_{B}\left( k \right) = \frac{1}{w_{B}\left(
    k \right)}{\\sum\limits\_{i = k + 1}^{L - 1}{i \cdot h\left( i \right)}}} \\\\
    \\end{matrix}$ (4.2)


    从这些值中，可以获得如下方差：


    $\begin{matrix} {\\sigma_{A}^{2}\left( k \right) = \frac{1}{w_{A}\left( k \right)}{\\sum\limits\_{i
    = 0}^{k}\left( {i - \\mu_{A}\left( k \right)^{2} \cdot h\left( i \right)} \right)}}
    \\\\ {\\sigma_{B}^{2}\left( k \right) = \frac{1}{w_{B}\left( k \right)}{\\sum\limits\_{i
    = k + 1}^{L - 1}\left( {i - \\mu_{B}\left( k \right)^{2} \cdot h\left( i \right)}
    \right)}} \\\\ \\end{matrix}$ (4.3)


