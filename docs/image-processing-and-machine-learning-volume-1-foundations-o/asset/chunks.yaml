    ### 3.3.5 MATLAB 边缘检测函数


    图像处理工具箱提供了 `edge` 函数，它实现了前面章节讨论的不同算子（Sobel、Prewitt、Roberts）。对于这些算子中的某些，还可以指定计算的方向。该函数的通用结构如下：


