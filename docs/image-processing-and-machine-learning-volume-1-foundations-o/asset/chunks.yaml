    ## 5.4 Other Corner Detectors


    In this section, some other existing detectors that allow finding corners of an
    image will be analyzed. Among the approaches analyzed are the Beaudet operator,
    Kitchen & Rosenfeld, and Wang & Brady \[[7](#C_008_c5.xhtml#r5_7)\]. All the operators
    considered here are based on the computation of the Hessian matrix or the Hessian.
    For this reason, it is necessary to analyze certain details about this matrix.


    The Hessian matrix of a function *f* of *n* variables is a *n* × *n* square matrix
    that integrates the second partial derivatives of *f*. So given a real function
    *f* of two real variables:


    *f* = (*x*,*y*) (5.18)


    If all second partial derivatives of *f* exist, the Hessian matrix of *f* is defined
    as:


    *H*[*f*](*x*,*y*) (5.19)


    where


    $H\_{f}\\left( {x,y} \\right) = \\begin{bmatrix} \\frac{\\partial^{2}f\\left(
    {x,y} \\right)}{\\partial x^{2}} & \\frac{\\partial^{2}f\\left( {x,y} \\right)}{\\partial
    x\\partial y} \\\\ \\frac{\\partial^{2}f\\left( {x,y} \\right)}{\\partial x\\partial
    y} & \\frac{\\partial^{2}f\\left( {x,y} \\right)}{\\partial y^{2}} \\\\ \\end{bmatrix}$
    (5.20)


    The components of the Hessian are defined as:


    $I\_{xx} = \\frac{\\partial^{2}f\\left( {x,y} \\right)}{\\partial x^{2}}$ (5.21)


    $I\_{yy} = \\frac{\\partial^{2}f\\left( {x,y} \\right)}{\\partial y^{2}}$ (5.22)


    $I\_{xy} = \\frac{\\partial^{2}f\\left( {x,y} \\right)}{\\partial x\\partial y}$
    (5.23)


    ### 5.4.1 Beaudet Detector


    The Beaudet detector is an isotropic operator based on the calculation of the
    determinant of the Hessian. Therefore, if the Hessian is defined by Equation 5.20,
    its determinant is computed as follows:


    det (*H*[*f*](*x*,*y*)) = *I*[*x**x*]*I*[*y**y*] − *I*[*x**y*]² (5.24)


    Based on the calculation of the determinant, the Beaudet detector is defined as:


    $B\\left( {x,y} \\right) = \\frac{\\det(H\_{f}\\left( {x,y} \\right))}{\\left(
    {1 + I\_{x}^{2}\\text{+I}\_{y}^{2}} \\right)^{2}}$ (5.25)


    where *I*[*x*] and *I*[*y*] are defined as follows:


    $I\_{x} = \\frac{\\partial f\\left( {x,y} \\right)}{\\partial x}\\ \\text{y}\\
    I\_{y} = \\frac{\\partial f\\left( {x,y} \\right)}{\\partial y}$ (5.26)


    Similar to the gradients, under this operator, the points from *B*(*x*,*y*) that
    exceed a certain predetermined threshold will be considered corners. [Program
    5.2](#C_008_c5.xhtml#p5_2) shows the MATLAB program that fully implements the
    Beaudet detector.


    [Figure 5.7](#C_008_c5.xhtml#f5_7) shows the corners detected in an example image
    using the Beaudet algorithm. For didactical reasons, in the following examples,
    the same image will be used for analysis and comparison purposes.


    ![FIGURE 5.7 Location of corner points according to Beaudet’s algorithm.](images/Fig05_07.jpg)


    [**FIGURE 5.7**](#C_008_c5.xhtml#f5_7b) Location of corner points according to
    Beaudet’s algorithm.


    ### 5.4.2 Kitchen & Rosenfield Detector


    Kitchen & Rosenfeld proposed a corner detector based on the change of gradient.
    Under such conditions, the Kitchen and Rosenfeld detector can be computed using
    the following model:


    $KR\\left( {x,y} \\right) = \\frac{I\_{xx} \\cdot I\_{y}^{2} + I\_{yy} \\cdot
    I\_{x}^{2} - 2 \\cdot I\_{xy} \\cdot I\_{y}}{I\_{x}^{2} + I\_{y}^{2}}$ (5.27)


    In this approach, the corners are considered as those values that exceed a predetermined
    value considered as a threshold. [Program 5.3](#C_008_c5.xhtml#p5_3) shows the
    MATLAB program that fully implements the Kitchen & Rosenfeld operator.


    [Figure 5.8](#C_008_c5.xhtml#f5_8) shows the corners detected in an example image
    using the Kitchen & Rosenfeld algorithm.


    ![FIGURE 5.8 Location of the corner points according to the Kitchen & Rosenfeld
    algorithm.](images/Fig05_08.jpg)


    [**FIGURE 5.8**](#C_008_c5.xhtml#f5_8b) Location of the corner points according
    to the Kitchen & Rosenfeld algorithm.


    ### 5.4.3 Wang & Brady Detector


    The Wang & Brady operator for corner detection considers an image as a surface.
    Under such conditions, the algorithm searches for places in the image where the
    direction of an edge changes abruptly. To do this, a coefficient *C*(*x*,*y*)
    is defined where the change of direction is evaluated under the following expression:


    *C*(*x*,*y*) = ∇²*I*(*x*,*y*) + *c*|∇*I*(*x*,*y*)| (5.28)


    where *c* represents a parameter that calibrates the sensitivity of the algorithm.
