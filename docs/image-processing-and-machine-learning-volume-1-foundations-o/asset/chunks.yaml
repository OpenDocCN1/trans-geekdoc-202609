    It might be surprising in this context that adding a constant `b` to an image
    that is then convolved through the `H` window of a filter does not produce the
    same result as if the image was first convolved and then the constant `b` is added
    to it. That is:


    (`b`+`I`) * `H` ≠ `b` + `I` * `H` (2.17)


    The linearity of the filter operations due to the use of convolution is an important
    theoretical concept; however, in practice, the filter operations are involved
    in processes that limit this linearity. This fact is provoked by rounding errors
    or the restriction in the range of images to which they are restricted to visualize
    them (“Clamping”).


    #### 2.6.2.3 Associativity


    Convolution is an associative operator, which means that the grouping of operations
    can be changed without affecting the result. That is:


    `A` * (`B`* `C`) =(`A`*`B`B`)* `C` (2.18)


    The association of filters is important since the number of operations could be
    reduced. The filter can be broken down into smaller filters.


    #### 2.6.3 Separability


    An immediate consequence of Equation 18 is the possibility of describing a filter
    by smaller filters. Therefore, a two-dimensional filter can be decomposed into
    smaller filters such that:


    `I` * (`H`[1]**`H`[2]*) (2.19)


    The advantage of this is to increase the number of filters, all of them being
    smaller than the original.


    #### 2.6.3.1 x-y Separation


    Something frequent and important in the use of filters is the separation of a
    two-dimensional filter into two one-dimensional filters applied in two different
    directions on the image. If we assume we have two one-dimensional filters `H`[`*x*]`
    and `H`[`*y*]` that operate in each direction, then:


    $$H_{x}, H_{y}=\begin{bmatrix} 1 \\ 1 \\ 1 \end{bmatrix}$$ (2.20)


    If you want to use both filters, one with the other on image `I`, both can be
    used as follows:


    `I`*(`H`[`x*])**`H`[`y*]` (2.21)


    The same result can be obtained by applying the filter $H_{xy}$ on the image,
    such as follows:


    $$H_{xy} = H_{x} \ast H_{y} = \left[ \begin{smallmatrix} 1 \\ 1 \\ 1 \end{smallmatrix}
    \right] \left[ \begin{smallmatrix} 1 & 1 & 1 \end{smallmatrix} \right]$$ (22)


    Under such conditions, the “Box” `H`[`x**y*]` smoothing filter can be divided
    into two one-dimensional filters applied in two different directions. The convolution
    performed by the full filter `H`[`x**y*]` needs $3 \times 5 = 15$ operations per
    pixel in the original image. In the case of the two filters `H`[`x*]` and `H`[`y*]`,
    they require $3 + 5 = 8$ operations per pixel of the image, which is much less.


    #### 2.6.3.2 Gaussian Filter Separation


    A two-dimensional filter can be divided into two filters in the $x−y$ directions.
    Following this methodology, it can be generalized that if you have a function
    in two dimensions, it is also possible to divide it into two functions, where
    each function will deal with each dimension in particular. That is, mathematically:


    `H`[`x*,y*](*i*,j*) = `H`[`x*](*i*) \cdot `H`[`y*](*j*)` (2.23)

