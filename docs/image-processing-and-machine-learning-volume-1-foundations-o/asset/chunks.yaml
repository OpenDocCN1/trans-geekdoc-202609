    ## 5.4 Other Corner Detectors


    In this section, some other existing detectors that allow finding corners of an
    image will be analyzed. Among the approaches analyzed are the Beaudet operator,
    Kitchen & Rosenfeld, and Wang & Brady [[7](#C_008_c5.xhtml#r5_7)]. All the operators
    considered here are based on the computation of the Hessian matrix or the Hessian.
    For this reason, it is necessary to analyze certain details about this matrix.


    The Hessian matrix of a function `f` of `n` variables is an `n × n` square matrix
    that integrates the second partial derivatives of `f`. So given a real function
    `f` of two real variables:


    `f = (x,y)` (5.18)


    If all second partial derivatives of `f` exist, the Hessian matrix of `f` is defined
    as:


    `H[f](x,y)` (5.19)


    where


    $H_{f}\left( {x,y} \right) = \begin{bmatrix} \frac{\partial^{2}f\left( {x,y} \right)}{\partial
    x^{2}} & \frac{\partial^{2}f\left( {x,y} \right)}{\partial x\partial y} \\ \frac{\partial^{2}f\left(
    {x,y} \right)}{\partial x\partial y} & \frac{\partial^{2}f\left( {x,y} \right)}{\partial
    y^{2}} \\ \end{bmatrix}$ (5.20)


    The components of the Hessian are defined as:


    $I_{xx} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial x^{2}}$ (5.21)


    $I_{yy} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial y^{2}}$ (5.22)


    $I_{xy} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial x\partial y}$ (5.23)


