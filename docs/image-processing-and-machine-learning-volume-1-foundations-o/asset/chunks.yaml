    从根本上说，滤波器矩阵 `H(i,j)*` 与图像一样，是一个二维离散实函数。因此，掩码有其自己的坐标系，其原点位于中心位置。在这种情况下，我们将拥有正坐标或负坐标（参见图
    2.3）。需要注意的是，滤波器矩阵在其实定义坐标之外的系数为零。


    ![FIGURE 2.3 掩码网格及其对应的坐标系。](img/Fig02_03.jpg)


    **FIGURE 2.3** **图 2.3** 掩码网格及其对应的坐标系。


    ### 2.3.2 滤波器操作


    滤波器对图像的影响完全由矩阵 `H(i,j)*` 的系数决定。在图像上执行滤波过程的方法如图图 2.4 所示。该过程可以描述如下：


    ![FIGURE 2.4 线性滤波器。滤波器系数矩阵的原点位于原始图像 I 的像素 \left( {x,y} \right) 处。滤波器系数 H\left(
    {i,j} \right) 与图像的相应像素相乘，从而得到九不同的乘积。所有乘积相加，结果置于结果图像 I′ 的位置 \left( {x,y} \right)
    处。](img/Fig02_04.jpg)


    **FIGURE 2.4** **图 2.4** 线性滤波器。滤波器系数矩阵的原点位于原始图像 `I` 的像素 `(x,y)` 处。滤波器系数 `H(i,j)*`
    与图像的相应像素相乘，从而得到九不同的乘积。所有乘积相加，结果置于结果图像 `I′` 的位置 `(x,y)` 。


    对于图像的每个像素 `(x,y)`，执行以下步骤：


    1. 将滤波器矩阵 `H(i,j)*` 放置在原始图像 `I` 的像素 `I(x,y)` 处，使得其坐标中心 `H(0,0)` 与之重合。

    2. 位于滤波器矩阵 `H(i,j)*` 定义的区域 `R(x,y)` 内的图像像素与滤波器矩阵每个位置 `I′(x,y)` 的相应系数相乘，并将这些乘法的每个部分结果相加。

    3. 将结果置于结果图像的位置 `(x,y)` 处。


    换句话说，结果图像中的所有像素都使用以下方程计算：


    $I^{\prime}\left( {x,y} \right) = {\sum\limits\_{{({i,j})}eR{({x,y})}}{I\left(
    {x + i,y + j} \right) \cdot H\left( {i,j} \right)}}$ (2.5)


    对于尺寸为 3 × 3 的系数矩阵的典型滤波器，以下方程规定了其操作：


    $I^{\prime}\left( {x,y} \right) = {\sum\limits\_{j = - 1}^{1}{\sum\limits\_{i
    = - 1}^{1}{I\left( {x + i,y + j} \right) \cdot H\left( {i,j} \right) }}}}$ (2.6)


    由方程 2.6 建模的操作应用于图像的所有坐标 `(x,y)`。在这一点上必须考虑的重要点是，前面的方程并不字面上地适用于图像的所有像素。在图像边缘，存在某些元素，当以滤波器系数矩阵为中心时，这些元素没有对应关系，且无法建立明确的结果。这个问题将在第
    2.5.2 节](#C_005_c2.xhtml#h2_5_2) 中再次处理并给出解决方案。


    ## 2.4 在 MATLAB 中计算滤波器操作


    在了解了如何执行滤波器操作并被提醒考虑它们对图像边界的影响后，将展示如何通过 MATLAB® 编程实现此类类型的操作。


    空间滤波器在图像上的应用是通过在感兴趣的像素 `(x,y)`、其邻域像素与掩码系数 `[5]` 之间应用卷积来实现。空间滤波处理机制如图图 2.4 所示。该过程的主要在于滤波器坐标与属于图像的坐标之间的关系。该过程包括滤波器中心从左到右、从上到下的移动，对图像中的所有像素执行相应的卷积。图
    2.5 显示了该过程的插图。对于尺寸为 *m*  × *n* 的滤波器，我们有 *m* = 2*a* + 1 和 *n* = 2*b*，其中 *a* 和 *b*
    是非负整数。这意味着滤波器始终设计为奇数维度，最小为 3。


    ![FIGURE 2.5 滤波器应用。](img/Fig02_05.jpg)


    **FIGURE 2.5** **图 2.5** 滤波器应用。


    生成的像素 `(x,y)` 的值取决于图 2.6 所示的强度。操作计算如下：


    ![FIGURE 2.6 空间过程。](img/Fig02_06.jpg)


    **FIGURE 2.6** **图 2.6** 空间过程。


    ```

    \begin{array}{cl}

    I^{\prime}\left( {x,y} \right) = {\sum\limits\_{{({i,j})}eR{({x,y})}}{I\left(
    {x + i,y + j} \right) \cdot H\left( {i,j} \right)}}$ (2.5) \\

    I^{\prime}\left( {x,y} \right) = {\sum\limits\_{j = - 1}^{1}{\sum\limits\_{i =
    - 1}^{1}{I\left( {x + i,y + j} \right) \cdot H\left( {i,j} \right) }}}} (2.6)

    \end{array}

    ```


    实施时必须考虑的一个重要方面是图像边界对处理的影响。在图像边界，`H` 的某些滤波器系数没有 `I` 的某些元素对应。这个问题及其解决方法将在以后讨论。该问题的表示如图图
    2.7 所示。


    ![FIGURE 2.7 卷积中的边界问题。](img/Fig02_07.jpg)


    **FIGURE 2.7** **图 2.7** 卷积中的边界问题。


    一种简单的解决方案是在处理时仅考虑较小尺寸的图像。在这种方法下，如果我们有一张尺寸为 *M* × *N* 的图像，而不是在 1 到 *N* 和 1 到 *M*
    之间处理卷积，则通过移除图像边界来完成。因此，处理将从 2 到 *N* − 1 以及从 2 到 *M* − 1 进行。


    为了避免边界缺失的问题有两种替代方案。第一种是生成一个比原始 *M* − 2 × *N* − 1 小的结果图像。另一种方案是从原始图像复制行和列以定义缺失像素。


