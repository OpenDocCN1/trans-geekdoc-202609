    ### 2.8.4 其他非线性滤波器


    中值滤波器及其多重窗口变体只是常用且易于解释的非线性滤波器的例子。通过“非线性”这一名称，我们聚合所有不具有线性特性的滤波器。有大量符合非线性特性的滤波器，例如角点检测器和将在后续章节介绍的形态学滤波器。


