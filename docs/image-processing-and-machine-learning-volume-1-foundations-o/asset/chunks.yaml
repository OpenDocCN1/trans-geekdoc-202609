    ## 2.7 Add Noise to Images with MATLAB


    To test the effectiveness of filters on images, it is necessary to evaluate their
    effects on images that contain artifacts or structures (noise) that need to be
    removed. As is logical to suppose, it is difficult to obtain images naturally
    with these characteristics. That is, it is not easy to obtain these kinds of images
    from the moment they are taken with a digital camera or scanner \[[8](#C_005_c2.xhtml#r2_8)\].
    An easier way to get images with these characteristics is simply to artificially
    produce them, which means taking the image by some means and adding the artifacts
    through programming code.


    Using MATLAB, it is possible, through its programming elements, to induce noise
    in images. The type of noise that can be modeled and added can be as complex as
    necessary. In this section, it is shown how to do it in the case of salt and pepper
    noise. Salt and pepper noise simulates random elements from two categories, white
    (salt) and black (pepper) pixels, in an image. This type of noise will be used
    to test the effect of filters designed in the following sections.


    Due to the stochastic nature of this type of noise, it will be necessary to use
    some function in MATLAB that allows randomly giving a value between 1 and the
    maximum values that describe the size of the image and assigning it to the pair
    of elements that defines the position (*x*,*y*) of the pixel. Once the pixel is
    chosen, it is assigned a value that can be 255 (in the case of salt) or 0 (in
    the case of pepper). The MATLAB function that returns a pseudo-random number uniformly
    distributed between 0 and 1 is `rand`, whose format can be described as:


    ```

    y = rand

    ```


    where `y` assumes the value returned by the `rand` function, the value generated
    by `rand` is uniformly distributed between 0 and 1. Therefore, to cover the interval
    of interest, it is necessary to multiply it by the maximum limit of the interval.


    An important aspect is that if the image is only distorted by placing only pixels
    with values of 0 and 255 when making a visual analysis or simply its display,
    it becomes somewhat complicated to appreciate the noise pixels. For this reason,
    it is a better option to add structures. The structure with which you can contaminate
    the image to generate noise can really be any, although the rectangular one is
    generally chosen for its simplicity. An important observation is that the structure
    must, in any case, be smaller than the filter used. Otherwise, the filter will
    not have the capacity to eliminate distortion. In this case, a structure of 3 × 2
    is chosen since most of the filters proposed to explain their effects on images
    are of dimension 3 × 3. [Figure 2.16](#C_005_c2.xhtml#f2_16) shows the structure
    added as noise to the image, considering the relative position of the top left
    pixel.


    ![FIGURE 2.16 Structure added as noise in order to facilitate its visualization
    instead of the distortion of an individual pixel.](images/Fig02_16.jpg)


    [**FIGURE 2.16**](#C_005_c2.xhtml#f2_16b) Structure added as noise in order to
    facilitate its visualization instead of the distortion of an individual pixel.


    [Program 2.2](#C_005_c2.xhtml#p2_2) shows the MATLAB code that allows adding 2000
    noise points, where 1000 corresponds to intensity value structures 255 (salt)
    and 1000 corresponds to intensity value structures 0 (pepper).


    An important consideration is the need to protect the random position where the
    structure will be placed. If the structure is placed within the limits of the
    image, it will not be positioned within the image. To avoid this, the program
    checks if the structure is located in an appropriate position. This process guarantees
    that the structure will always be located in an appropriate position for its processing.
    [Figure 2.17](#C_005_c2.xhtml#f2_17) shows images that resulted from the execution
    of [Program 2.2](#C_005_c2.xhtml#p2_2).


