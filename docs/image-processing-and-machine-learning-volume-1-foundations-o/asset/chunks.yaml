    ### 1.3.8 直方图线性均衡化


    一个常见的问题是将不同的图像自适应到相同的强度级分布 `h[eq]`，这可能是是为了提高它们的打印质量，也为了能够对它们进行适当比较。平衡直方图意味着通过像素操作改变图像，使其所示的直方图尽可能地分布在所有强度级上（参见图
    1.20）。由于我们处理的是离散分布，这只在近似水平上是可能的，因为正如上文所讨论的，同性操作只能平移或合并属于特定强度级的像素点组。然而，一旦它们聚集在一起，就无法将它们分开。因此，无法从分布中消除直方图的峰值。在这种情况下，无法从原始直方图中产生一个所有灰度级均匀分布的理想直方图
    `h[eq]`。相反，只能变换图像使直方图显示出灰度级平衡分布的近似。这种近似可以通过累积直方图 `H(i)` 实现。这种变换的一个重要特征是，累积直方图的一个版本
    `H[eq]` 代表了平衡（目标）分布。显然，正如前述所示，这仅仅是一个近似。但是，通过这种方法可以使用像素操作平移直方图元素，使得图像的累积直方图至少近似为一个递增的线性函数，如图
    1.20 所示。


    ![图 1.20 直方图均衡化过程的表示。对具有原始直方图 h(i) 的图像使用像素操作，其主意是通过操作的效果获得直方图 heq(i)、累积直方图 H(i)
    以及由 Heq(i) 表示的平衡版本。](img/Fig01_20.jpg)


    **图 1.20** 直方图均衡化过程的表示。对具有原始直方图 `h(i)` 的图像使用像素操作，其目的是通过操作的效果获得直方图 `heq`、累积直方图
    `H(i)` 以及由 `Heq` 表示的平衡版本。


    平衡图像直方图所需的像素操作 `feq` 是根据其累积直方图计算的。对于一个分辨率为 `M` × `N` 像素范围在 `[0...K−1]` 的图像，该操作可以定义如下：


    $f_{\\text{eq}}\\left( p \\right) = \left\\lbrack {H\\left( p \\right) \\cdot
    \\frac{K - 1}{MN}} \\right\\rbrack$ (1.19)


    方程 1.13 中定义的函数呈现出单调行为，因为该函数对应于累积直方图实验，在这种行为中它是不断增加的。`H(p)` 和其他参数 `K`、`M`、`N` 仅为常量。如果图像的直方图已经良好地分布在所有强度级上，那么在应用平衡直方图的像素操作时就不会产生任何变化。图
    1.21 显示了图像在线性均衡化直方图后的结果。可以注意到，对于非活动像素（原始图像中不存在的强度值），当在累积直方图中考虑它们时，图形显示与其前一个相邻的值相同。例如，假设原始图像中没有强度级为
    10 的像素。它们在直方图中的值为 `h(10)` == 0，但它们在累积直方图中的值为 `H(10)` == `H(9)`。尽管这似乎是用于平衡直方图的像素操作（方程
    1.11）的负面影响，但结果是原始图像中不存在的强度值将会出现。


    ![图 1.21 通过正确操作 feq 将强度值 p 平移到 p′，使其尽可能近似累积直方图。](img/Fig01_21.jpg)


