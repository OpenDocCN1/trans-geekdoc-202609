- raw: 'The simplest binarization process that can be conducted by MATLAB is logical
    operations. The way to do this is by using the overloaded property of the logical
    operations. These operations, in the case of matrices (images), imply the evaluation
    of the logical condition for each element. The result of this operation produces
    ones and zeros for those elements that have fulfilled the logical condition. On
    the other hand, the elements with a value of zero represent those pixels whose
    evaluation of the condition is false. For example, we would have in the command
    line:


    ```

    >>B=A>128;

    ```


    The resulting matrix *B* will be composed of ones and zeros. Ones at those positions
    of *A* where the pixel values are greater than the threshold 128, while zeros
    at those points of A where the pixels did not meet the condition.


    ### 1.5.3 Contrast Adjustment with MATLAB


    MATLAB contains the function `imadjust`, which allows us to adapt the contrast
    of images to increase, decrease or adjust it. The function prototype presents
    the following structure:


    ```

    J=imadjust (I)

    J=imadjust(I,[low_in; high_in],[low_out; high_out])

    ```


    `J` =` imadjust(I)` maps the intensity values of the image `I` to new intensity
    values in image `J` such that from 1% of the data (*s*[low]\=*s*[high]\=1%) are
    considered to define the lower and upper limits of intensities of the image `I`.
    From these limits, it will be adjusted the contrast of the resulting image `J`.
    As already discussed above, the fact of not considering the limits of image `I`,
    but only a percentage, allows us to improve the contrast considering the complete
    amount of the data. Under such conditions, it is possible to improve the contrast
    of the image even in those cases where the contrast covers the entire image range
    but not significantly.


    `J` =` imadjust(I,[``low_in``;` `high_in],[low_out; high_out``])` maps the values
    of the image `I` to new values of `J`, such that the values of image `low_in`
    and `high_in` are mapped to the new values `low_out` and `high_out` of image `J`.
    The values below `low_in` and `high_in` of the image `I` are not considered. It
    is possible to delimit the boundaries with the empty matrix [], which means defining
    the boundaries with the permissible values for each type of image [0,1].


    There are some additional variants of this function that, apart from considering
    the contrast enhancement, allow us to further scale the contrast by means of a
    parameter (SP). Through this parameter, it is possible to represent the way in
    which the images `I` and `J` are related when scaled. The structure of the function
    is as follows:


    ```

    J = imadjust(I,[low_in; high_in],[low_out; high_out], SP)

    ```


    This function transforms the values of `I` to obtain the values of `J`, as explained
    above. However, if `SP` is less than 1, the mapping is scaled up (brighter) for
    the `J` image values, while if SP is greater than 1, the scaling is done down
    (darker). For the case where `SP` is one, the adjustment is simply linear. [Figure
    1.25](#C_004_c1.xhtml#f1_25) shows the effect of applying the `imadjust` function
    to an image.


    ![FIGURE 1.25 Result of applying the imadjust function. (a) Original image, (b)
    image resulting from applying the imadjust function, (c) histogram of the original
    image, and (d) histogram of the contrast-corrected image.](images/Fig01_25.jpg)


    [**FIGURE 1.25**](#C_004_c1.xhtml#f1_25b) Result of applying the imadjust function.
    (a) Original image, (b) image resulting from applying the imadjust function, (c)
    histogram of the original image, and (d) histogram of the contrast-corrected image`.`


    ### 1.5.4 Histogram Equalization Using MATLAB


    The problem of adapting different images to the same distribution of intensity
    levels, either to improve their print quality or to compare them properly, can
    be implemented using MATLAB. Equalizing a histogram, as already discussed in previous
    sections, means modifying it by using a pixel operation of the image in such a
    way that it shows a histogram with a desired distribution. To solve the equalization
    problem, the cumulative histogram is used, and among its properties is that it
    represents an equalized distribution. Obviously, the above statement is only an
    approximation. However, it is possible to use a pixel operation that shifts the
    histogram elements so that the cumulative histogram of the image shows at least
    approximately an increasing linear function.


    The required pixel operation *f*[eq](*p*) to equalize the histogram of an image
    is calculated from its cumulative histogram, which is defined by Equation 1.28.
    By implementing this process in a MATLAB program, one could equalize the histogram
    of an image in a linear way. [Program 1.1](#C_004_c1.xhtml#p1_1) shows the implementation
    of the linear equalization of the histogram of an image.


    The results shown in [Figure 1.26](#C_004_c1.xhtml#f1_26) were obtained after
    applying the code described in [Program 1.1](#C_004_c1.xhtml#p1_1). From the figure,
    the result of the contrast improvement can be clearly observed and can be analyzed
    by reviewing the corresponding histograms.


    ![FIGURE 1.26 Result of applying the code described in Program 1.1. (a) Original
