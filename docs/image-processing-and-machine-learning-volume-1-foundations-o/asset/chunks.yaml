    These Val(`*C*[`*D*]`→`*k*`) = `max` values can be considered as normalized sequences
    and independent from the start or reference point. Therefore, they can be used
    as a means of comparison between chain sequences. As can be seen in Equation 4.16,
    the problem is that the calculation of these values results in very large values.
    Chain comparison cannot be considered a reliable method since the rotations, scaling,
    or deformations produced in the contours may produce incorrect conclusions.


    ### 4.9.5 Fourier Descriptors


    An elegant approach to the description of contours is the so-called Fourier descriptors.
    They consider a set of points that describe the contour of an object (`*x*[`1]`,`*x*[`2]`,...,`*x*[`*M*]`)
    where `*x*[`i*]` = (`*x*`,`*y*`) can be described as a sequence of complex numbers
    (`*z*[`1]`,`*z*[`2]`,...,`*z*[`*M*]`) where:


    `*z*[`i*]` = `*x*[`i*]` + `j*y*` (4.18)


    It is interpreted as a complex number with a real part `*x*` and an imaginary
    part `*y*`. From this data sequence, it is possible to construct a one-dimensional
    periodic function `f(*s*)` ∈ `ℂ` that describes the length of a contour. The coefficients
    of the Fourier transform of the function `f(*s*)` allow describing the contour
    of an object in the frequency domain, where the coefficients corresponding to
    lower frequencies describe the shape.


    ## 4.10 Features of Binary Objects


    If you want to describe a binary image to another person, the worst strategy would
    undoubtedly be to say all the pixels contained in the image and their value, either
    zero or one. This will only confuse the person. A better way to describe the image
    would be to use the characteristics of the objects present, such as the number
    of objects, area, perimeter, etc. Such characteristics can be easily calculated
    by the computer by manipulating the entire image or a segment of it. In addition,
    these quantities can be used to discriminate different types of objects, making
    it possible to use pattern recognition techniques.


    ### 4.10.1 Features


    A characteristic of a binary object is a certain quantitative measure that can
    be obtained by direct calculation of its pixels. A simple example of this characteristic
    is the number of pixels that integrate the object, which can be obtained by simply
    counting the number of elements that involve the object. To univocally describe
    an object, several characteristics are normally combined in a vector. This vector
    represents the signature of the object and can be used for classification purposes.
    This set of characteristics can be used to discriminate between objects based
    on the differences that they present in relation to their characteristic vectors.
    Features, as far as possible, should be robust. This means that they must not
    be influenced by irrelevant changes, for example, displacement, scaling, and rotation.


    ### 4.10.2 Geometric Features


    An object `O` of a binary image can be considered as a distribution of points
    of value one `*x*[`i*]` = (`*x*`,`*y*`) located on a two-dimensional grid, that
    is:


    `O` = {`*x*[`1]`,`*x*[`2]`,...,`*x*[`*N*]`} = {`*x*[`1]`,`*y*[`1]`),`*x*[`2]`,`*y*[`2]`),...,`*x*[`*N*]`,`*y*[`*N*]`}
    (4.19)


    For the calculation of most of geometric characteristics, an object is considered
    as a set of ones that are grouped under neighborhood.


    ### 4.10.3 Perimeter


    The perimeter of an object `O` is determined by the length of its outer contour.
    As Figure 4.24 shows, for the calculation of perimeter, it is necessary to consider
    the type of neighborhood since the distance of perimeter of a contour under 4-neighborhood
    is greater than 8-neighborhood.


    In the case of 8-neighborhood, a horizontal or vertical movement (see Figure 4.24)
    has a distance of one, while diagonal movements have a distance of $\sqrt{2}$.
    For a contour defined by 8-neighborhood-based chain code `C` = (`*c*[`1]`,`*c*[`2]`,...,`*c*[`*M*]`),
    the perimeter can be calculated as follows:


    $Perimeter(O) = \sum_{i = 1}^{M}{length(c_{i})}$ (4.20)


    where:


    $length(c_{i}) = \{ 1 \text{ for } c=0,2,4,6; \sqrt{2} \text{ for } c=1,3,5,7
    \}$ (4.21)


    The perimeter calculated by Equations 20 and 21 produces a value that overcalculates
    the true distances. Under such conditions, in practice, this value is normally
    adjusted. Therefore, the new value of the perimeter defined as `U(*O*)` is calculated
    as follows:


    `U(*O*) = 0.95 * Perimeter(*O)` (4.22)


    ### 4.10.4 Area


    The area of an object `O` can be calculated simply by summing the pixels that
    integrate the object. That is:


    `Area(*O*) = N = |O|` (4.23)


    When the object whose area needs to be determined is not described by grouped
    set of pixels but by the contour that surrounds it, it is possible to approximate
    the area by the length of its closed exterior (only if it does not contain interior
    contours). Under such conditions, it can be computed as follows:


    $Area(O) = \frac{1}{2} \cdot \left| \sum_{i = 1}^{M}(x_{i} \cdot y_{(i+1)\mod
    M} - x_{(i+1)\mod M} \cdot y_{i}) \right|$ (4.24)


    where `*x*[`i*]` and `*y*[`i*]` are the coordinates of the points `*x*[`1]`,`...,`*x*[`*M*]`
    that are part of the closed contour that involves the object. The contour defined
    by these points is described by the chain code `C` = (`*c*[`1]`,`*c*[`2]`,...,`*c*[`*M*]`).
    Geometric features such as area and perimeter are robust to displacement and rotation.
    However, they are highly sensitive to scaling.


    ### 4.10.5 Compaction and Roundness


    Compaction is defined as the relationship between the area of an object and its
    perimeter. The perimeter `U(*O*)` of an object increases linearly by multiplying
    by a factor greater than one. On the other hand, the area of an object increases
    quadratically. Therefore, the compaction `C(*O*)` of an object `O` associates
    these two terms. It is calculated as follows:


    $C(O) = \frac{Area(O)}{U^{2}(O)}$ (4.25)


    This measure is invariant to displacements, rotations, and scaling. The compaction
    index has a value of $(1/4\pi)$ for a round object of any diameter. Through normalization
    of the previous factor, the roundness characteristic can be established as:


    $R(O) = 4\pi\frac{Area(O)}{U^{2}(O)}$ (4.26)


    `R(*O*)` evaluates how an object is similar to a round element. `R(*O*)` produces
    its maximum value (1) when it is a round object, while for other types of objects,
    the value ranges from 0 to 1. Figure 4.25 shows the roundness values for different
    types of objects.


    ![FIGURE 4.25 Roundness value for different objects. (a) 1.00, (b) 0.7415, and
    (c) 0.4303.](images/Fig04_25.jpg)

