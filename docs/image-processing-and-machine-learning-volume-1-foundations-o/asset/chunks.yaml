    # 3 Edge Detection


    DOI: [10.1201/9781003287414-3](https://doi.org/10.1201/9781003287414-3)


    Features in an image, such as edges, are detected through local changes in intensity
    or color \[[1](#C_006_c3.xhtml#r3_1)\]. They play an important role in image interpretation.
    The subjective “clarity” of an image is directly related to the discontinuities
    and sharpness of the structures present in it. The human eye gives an important
    weight to the edges of objects since it is through these that a person can differentiate
    the different characteristics as well as the delimitations of the real forms.
    Therefore, simple traces on images are enough to interpret the classes of the
    objects. For this reason, edges are very important topics for digital image processing
    and machine vision.


    ## 3.1 Borders and Contours


    Edges play a predominant role in human vision and probably also in other biological
    vision systems. The edges are not only noticeable, but it is also possible by
    means of a few edge lines to reconstruct the objects again ([Figure 3.1](#C_006_c3.xhtml#f3_1)).
    One of the main issues to be discussed is how edges originate in an image and
    how it is possible to locate them to be used in a post-processing stage.


    ![FIGURE 3.1 (a) Original image and (b) image with borders.](images/Fig03_01.jpg)


    [**FIGURE 3.1**](#C_006_c3.xhtml#f3_1b) (a) Original image and (b) image with
    borders.


    Roughly, edges can be thought of as points in an image where the intensity in
    each direction changes dramatically \[[2](#C_006_c3.xhtml#r3_2)\]. Depending on
    the intensity change presented in a specific pixel, it will be the value of the
    edge in the image for that point. The size of the change is normally calculated
    from the derivative and is used as one of the most important approaches to determining
    the edges of an image.


    ## 3.2 Edge Detection Using Gradient-Based Techniques


    Consider a single dimension and take as an example an image that has a white region
    in the center surrounded by a dark background, like [Figure 3.2a](#C_006_c3.xhtml#f3_2).'
