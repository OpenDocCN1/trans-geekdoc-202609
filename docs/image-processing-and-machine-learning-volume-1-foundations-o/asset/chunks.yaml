    and classification of objects and its robustness in determining edges, the filter
    is normally implemented in most commercial libraries and digital image processing
    tools. In MATLAB, the Canny algorithm can be calculated using the `edge` function.
    Its general structure is described as follows:


    ```

    BW = edge(I, ‘canny’, U, sigma);

    ```


    where `BW` is the image with the edges extracted, considering the Canny algorithm.
    `I` is the grayscale image from which the edges will be extracted. `U` is the
    threshold value from which the pixels are classified as edges. `sigma` represents
    the smoothing parameter (*σ*) that has the effect of minimizing the number of
    false edges.


