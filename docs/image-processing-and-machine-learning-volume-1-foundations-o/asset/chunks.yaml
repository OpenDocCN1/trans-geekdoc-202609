    在高斯滤波器中，中心元素代表参与操作的最大权重，而其他系数的值随着距离中心的增加而减小。该滤波器的一个重要属性是各向同性。“框”平滑滤波器的一个问题是会导致图像重要特征的退化，如边缘（强度突变的区域）。高斯滤波器在这方面危害较小，允许在强度值均匀的区域进行平滑而不稀释特征。


