    ## 5.4 其他角点检测器


    在本节中，将分析其他一些允许寻找图像角的现有检测器。分析的方法包括 Beaudet 算子、Kitchen & Rosenfeld 以及 Wang & Brady
    [7]。这里考虑的所有算子都是基于 Hessian 矩阵或 Hessian 值的计算。由于原因，有必要分析关于该矩阵的某些细节。


    $n$ 变量函数 `f` 的 Hessian 矩阵是一个 $n \times n$ 方阵，它整合了 `f` 的二阶偏导数。因此，给定关于两个实数的实函数 `f`：


    `f = (x,y)` (5.18)


    如果 `f` 的所有二阶偏导数都存在，则 `f` 的 Hessian 矩阵定义为：


    `Hf` (5.19)


    其中


    $H_{f}\left( {x,y} \right) = \begin{bmatrix} \frac{\partial^{2}f\left( {x,y} \right)}{\partial
    x^{2}} & \frac{\partial^{2}f\left( {x,y} \right)}{\partial x\partial y} \\ \frac{\partial^{2}f\left(
    {x,y} \right)}{\partial x\partial y} & \frac{\partial^{2}f\left( {x,y} \right)}{\partial
    y^{2}} \\ \end{bmatrix}$ (5.20)


    Hessian 的分量定义为：


    $I_{xx} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial x^{2}}$ (5.21)


    $I_{yy} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial y^{2}}$ (5.22)


    $I_{xy} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial x\partial y}$ (5.23)


    ### 5.4.1 Beaudet 检测器


    Beaudet 算子是基于 Hessian 矩阵的计算的。由于原因，有必要分析关于该矩阵的某些细节。


    $n$ 变量函数 `f` 的 Hessian 矩阵是一个 $n \times n$ 方阵，它整合了 `f` 的二阶偏导数。因此，给定关于两个实数的实函数 `f`：


    `f = (x,y)` (5.18)


    如果 `f` 的所有二阶偏导数都存在，则 `f` 的 Hessian 矩阵定义为：


    `Hf` (5.19)


    其中


    $H_{f}\left( {x,y} \right) = \begin{bmatrix} \frac{\partial^{2}f\left( {x,y} \right)}{\partial
    x^{2}} & \frac{\partial^{2}f\left( {x,y} \right)}{\partial x\partial y} \\ \frac{\partial^{2}f\left(
    {x,y} \right)}{\partial x\partial y} & \frac{\partial^{2}f\left( {x,y} \right)}{\partial
    y^{2}} \\ \end{bmatrix}$ (5.20)


    Hessian 的分量定义为：


    $I_{xx} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial x^{2}}$ (5.21)


    $I_{yy} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial y^{2}}$ (5.22)


    $I_{xy} = \frac{\partial^{2}f\left( {x,y} \right)}{\partial x\partial y}$ (5.23)


    Beaudet 检测器是基于 Hessian 矩阵的计算的。由于原因，有必要分析关于该矩阵的某些细节。


    根据等式 5.20，Beaudet 检测器的计算如下：


    `det(H) = I_{xx}I_{yy} - I_{xy}²` (5.24)


    各向同性情况下，Beaudet 检测器定义为：


    $B(x,y) = \frac{I_{xx}I_{yy} - I_{xy}²}{(I_{xx}² + 2I_{xy}² + I_{yy}²)²}$ (5.25)


    其中


    $I_{x} = \frac{\partial f}{\partial x}$ (5.26)


    $I_{y} = \frac{\partial f}{\partial y}$ (5.27)


    类似于梯度，在该算子下，超过某个预设阈值的 `B(x,y)` 被视为角。程序 5.2 显示了 audet 检测器的 MATLAB 程序。


    图 5.7 显示了在示例图像上检测到的角。出于教学目的，随后的示例将使用相同的图像。


    ![FIGURE 5.7 根据 Beaudet 算法的角点位置。(images/Fig05_07.jpg)


    `FIGURE 5.7` 根据 Beaudet 算法的角点位置。


    ### 5.4.2 Kitchen & Rosenfeld 检测器


    Kitchen & Rosenfeld 提出了一种基于梯度变化的角点检测器。在这种情况下，Kitchen & Rosenfeld 检测器可以使用以下模型计算：


    $KR(x,y) = \frac{I_{xx}I_{y}² + I_{yy}I_{x}² - 2I_{xy}I_{x}I_{y}}{I_{x}² + I_{y}²}$
    (5.27)


    在这种方法中，超过预设值的值被视为角。程序 5.3 显示了实现 Kitchen & Rosenfeld 算子的 MATLAB 程序。


    ![FIGURE 5.8 根据 Kitchen & Rosenfeld 算法的角点位置。(images/Fig05_08.jpg)


    `FIGURE 5.8` 根据 Kitchen & Rosenfeld 算法的角点位置。


    ### 5.4.3 Wang & Brady 检测器


    Wang & Brady 角点检测算子将图像视为表面。在这种情况下，算法搜索图像中边缘方向突变的地方。为了做到这一点，定义了一个系数 `C(x,y)`，在该表达式下评估方向的变化：


    `C(x,y) = ∇²I(x,y) + c|∇I(x,y)|` (5.28)


    其中 `c` 代表一个校准算法灵敏度的参数。


