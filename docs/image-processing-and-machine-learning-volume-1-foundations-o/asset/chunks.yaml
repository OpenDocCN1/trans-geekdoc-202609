    # 4 Segmentation and Processing of Binary Images


    DOI: [10.1201/9781003287414-4](https://doi.org/10.1201/9781003287414-4)


    ## 4.1 Introduction


    Image segmentation is considered an active field of research in the area of computer
    vision with an innumerable number of applications \[[1](#C_007_c4.xhtml#r4_1)\].
    The purpose of segmentation is to divide an image into regions that, according
    to some context, have some relationship or meaning. Various methods and approaches
    have been proposed in the literature for this purpose. The choice of a particular
    method depends on the characteristics of the application. The segmentation must
    be considered as a previous step for the description, recognition, or classification
    of objects contained in an image \[[2](#C_007_c4.xhtml#r4_2)\]. This chapter will
    analyze the most popular segmentation methods and their implementation.


    The binary images produced as a result of the segmentation process are images
    whose pixels only have one value out of two possible ones, or zero \[[3](#C_007_c4.xhtml#r4_3)\].
    Normally, this pixel classification corresponds to the object (values set to one)
    and the background (values set to zero), although obviously, such differentiation
    in real images is not always possible. In this chapter, the structure of binary
    images will also be analyzed, considering how to isolate each of the objects present
    in the image and how to describe them structurally. As a simple definition, an
    object will be defined as a group of pixels that are connected by some kind of
    neighborhood while its surroundings are bordered by pixels of value zero (the
    background).


    ## 4.2 Segmentation


    Segmentation is defined as the process of dividing the image into different regions
    so that the pixels in each region are similar (according to certain criteria)
    while they are different between the regions \[[4](#C_007_c4.xhtml#r4_4)\]. The
    objective is to distinguish between objects of interest and the rest of the image.
    In the simplest case, the segmentation is conducted by considering only two classes.
    The first class considers the object of interest, while the second class corresponds
    to the rest of the image, commonly known as the background. This process is also
    called binarization \[[5](#C_007_c4.xhtml#r4_5)\].


    The most commonly used criterion in segmentation is the homogeneity of grayscale
    regions, although for more advanced applications, color or texture can also be
    used. Segmentation is often the first step in a pattern recognition system. Its
    function is to isolate the objects of interest for later classification \[[6](#C_007_c4.xhtml#r4_6)\].


    There are many approaches to image segmentation, which can be divided according
    to the characteristics considered and the type of algorithm used. According to
    the characteristics, the segmentation methods include the intensity values of
    the pixels, the texture, or the magnitude of the gradient. Regarding the type
    of algorithm, segmentation techniques can be divided into contextual and non-contextual
    \[[7](#C_007_c4.xhtml#r4_7)\].


    Non-contextual techniques ignore the relationship between pixels and the object
    they are trying to isolate. In this way, the pixels are grouped considering some
    global characteristics of them, such as intensity level. Among the main techniques
    of this category is thresholding. In thresholding, each pixel is assigned to a
    particular category based on its intensity level, depending on whether it exceeds
    a predetermined level known as a threshold.


    Contextual techniques, different from non-contextual methods, additionally exploit
    the relationship between the pixel and the object to be isolated by incorporating
    homogeneity measures or criteria. In this way, a contextual method could group
    a set of pixels that have similar intensity and that, at the same time, are close
    to each other or that maintain the same direction according to their gradient
    value.


    ## 4.3 Threshold


    Thresholding is a segmentation technique that assumes that objects are integrated
    by pixels of homogeneous intensity. In this way, each pixel is compared with a
    pre-fixed threshold; if the pixel intensity value is higher, the pixel is considered
    to belong to a certain category, but if it is lower, it will correspond to another
    category. Under these circumstances, the quality of the segmentation will depend
    on the choice of the appropriate threshold value \[[8](#C_007_c4.xhtml#r4_8)\].


    In the ideal case of thresholding, the histogram that reflects the pixel distribution
    of the objects present in the image does not overlap, so a certain threshold value
    can divide both objects. [Figure 4.1a](#C_007_c4.xhtml#f4_1) shows an image containing
    two different square objects: A and B. Object A involves pixels with an intensity
    from a Gaussian distribution with a mean of 60 and a standard deviation of 10.
    Object B has pixels from a Gaussian distribution with a mean of 190 and a standard
    deviation of 10. [Figure 4.1b](#C_007_c4.xhtml#f4_1) shows the corresponding histogram
    of image 4.1a.'
