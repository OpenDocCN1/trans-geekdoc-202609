    its determinant is computed as follows:


    `det(H[f](x,y)) = I[x**x]I[y**y] - I[x**y]²` (5.24)


    Based on the calculation of the determinant, the Beaudet detector is defined as:


    $B\left( {x,y} \right) = \frac{\det(H_{f}\left( {x,y} \right))}{\left( {1 + I_{x}^{2}\text{+I}\_{y}^{2}}
    \right)^{2}}$ (5.25)


    where `I[x]` and `I[y]` are defined as follows:


    $I_{x} = \frac{\partial f\left( {x,y} \right)}{\partial x}\ \text{y}\ I_{y} =
