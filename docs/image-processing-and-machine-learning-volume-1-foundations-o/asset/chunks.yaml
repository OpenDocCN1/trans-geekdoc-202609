- raw: 'As mentioned before, a convolution is the same as a correlation with the filter
    pre-rotated 180°. The opposite also applies. A correlation gives the same result
    as a convolution with the filter pre-rotated 180°. The above is important since
    the image processing toolbox defines several special filters that have been pre-rotated
    to be used directly with the correlation (default option) when they were originally
    planned to perform convolution on the image.


    When we are working with a filter using convolution, there are two different options:
    one is to use the `filter_mode` (conv) flag of the `imfilter` function, and the
    other is to rotate the filter 180° and apply the `imfilter` function with its
    option default (corr). To rotate a matrix (in our case, a filter) with 180°, the
    following function can be used:


    ```

    Hr=rot90(H,2)

    ```


    where `Hr` is the filter rotated 180° and `H` is the filter to be rotated.


    [Figure 2.34](#C_005_c2.xhtml#f2_34) shows the use of the `imfilter` function
    and the effect of using the different options corresponding to the `border_options`
    flag, considering as filter `H`, a “Box” smoothing filter of 31 × 31, which was
    obtained by the following command in MATLAB:


    ![FIGURE 2.34 Effect of using the different options of the ‘border\_options’ flag.
    (a) Original image, (b) effect on the image using the option ‘0’, (c) effect on
    the image using the option ‘replicate’, (d) effect on the image using option ‘symmetric’,
    and (e) effect on image when using ‘circular’ option.](images/Fig02_34.jpg)


    [**FIGURE 2.34**](#C_005_c2.xhtml#f2_34b) Effect of using the different options
    of the ‘border\_options’ flag. (a) Original image, (b) effect on the image using
    the option ‘0’, (c) effect on the image using the option ‘replicate’, (d) effect
    on the image using option ‘symmetric’, and (e) effect on image when using ‘circular’
    option.


    ```

    H=ones(31,31)/(31*31);

    ```


    As can be seen from [Figure 2.34b](#C_005_c2.xhtml#f2_34), the `‘0’` option when
    adding rows and columns with zeros produces a smoothing effect from black to white
    in regions where the original image does not have black pixels. The same happens
    in [Figure 2.34e](#C_005_c2.xhtml#f2_34), where there are added equal rows and
    columns (`‘circular’`) as if it were repeated above and below, on one side and
    on the other.


    ### 2.9.4 MATLAB Functions for Non-Linear Spatial Filtering


    Non-linear filtering is based on the same mechanics as moving a mask along the
    image. However, unlike linear filtering, its operations do not consider the sum
    of multiplications between the filter coefficients and the image pixels. Another
    marked difference between linear and non-linear filtering is the role that plays
    the concept of masks or filter coefficients. In linear filters, filter coefficients
    determine the effect of the filter. On the other hand, in non-linear operations,
    the filter represents only the region of influence. Therefore, the mask symbolizes
    the pixels that will be considered in the processing and not the way in which
    they participate in the processing, as is the case in linear filtering. The image
    processing toolbox has two functions to perform non-linear filtering on images.
    These are: `nlfilter` and `colfilt`.


    The `nlfilter` function allows filtering using a non-linear operation on an image.
    Its general syntax is:


    ```

    B = nlfilter(A, [m n], @Fun);

    ```


    where `m` and `n` determine the size of the region of influence of the non-linear
    filter that will be processed across the image. `A` corresponds to the image to
    be filtered, while `B` will contain the filtered image. `fun` defines a user function
    that implements the operation of the filter. This function receives from `nlfilter`
    a matrix of `mxn` data and returns the result of the non-linear operation implemented
    on that data. The @ symbol is called the function handle, which is a MATLAB data
    type that contains information about the function that is being used as a reference
    to implement the operation.


    As an example, we will calculate the median filter using the `nlfilter` function.
    First, we need an image that contains salt and pepper noise. Therefore, considering
    the image exhibited in [Figure 2.35a](#C_005_c2.xhtml#f2_35), salt and pepper-type
    noise is added at 10%, obtaining [Figure 2.35b](#C_005_c2.xhtml#f2_35). This image
    has been produced using the following command:


    ![FIGURE 2.35 Use of the nlfilter function. (a) Original image, (b) image distorted
    with salt and pepper noise, and (c) image filtered by nlfilter using the function
    defined in Program 2.3 that implements the median spatial non-linear filter.](images/Fig02_35.jpg)


    [**FIGURE 2.35**](#C_005_c2.xhtml#f2_35b) Use of the nlfilter function. (a) Original
    image, (b) image distorted with salt and pepper noise, and (c) image filtered
    by nlfilter using the function defined in [Program 2.3](#C_005_c2.xhtml#p2_3)
    that implements the median spatial non-linear filter.


    ```

    Iruido=imnoise(I, ‘salt & pepper’, 0.1);

    ```


    For the filtering, we will use a median filter defined by a neighborhood of 5 × 5.
    The operation (median) will be implemented using `nlfilter,` which will receive
    a matrix of 25 data. From these data, the median value is computed. The function
    created to implement this function is specified in [Program 2.3](#C_005_c2.xhtml#p2_3).
    Once the function that will be used by the `nlfilter` function has been implemented,
    the image is filtered by using the following command:


    ```

    R = nlfilter(Iruido, [5 5], @mediana);

    ```


    [Figure 2.35](#C_005_c2.xhtml#f2_35) illustrates the images used for the filtering
    performed by `nlfilter` and the effects obtained after this process.


    The `colfilt` function performs the filtering by organizing the data in column
    form. This function is preferred over the `nlfilter` function since it achieves
    the calculation in a faster way.


    Considering a region of interest *m* × *n*, the `colfilt` function operates on
    an image *I* of size *M* × *N*, generating a matrix *A* of size *m**n* × *M**N*,
    in which each column corresponds to the pixels that form the area of interest
    centered on a position in the image. For example, the first column of matrix *A*
    involves the pixels that are part of the area of interest, centered on the pixel
    at the top left (0,0) of the image *I* of dimension *M* × *N*. The general syntax
    of this function is:


    ```

    g=colfilt(I,[m n], ‘sliding’, @Fun);

    ```


    where *m* and *n* represent the size of the considered region of interest or filter
    size. `‘sliding’` indicates that the mask *m*  ×  *n* is displaced along the entire
    image *I* performing a pixel-by-pixel operation. `fun` defines a user function
    that implements the operation of the filter. This function receives from `colfilt`
    the matrix *A* of *m**n* × *M**N* and returns, as a result, a vector of 1  ×  *M**N*
    (the size of the image *I*) product of the implemented non-linear operation.


    As an example, the median filter will be calculated again, but now with the `colfilt`
    function. As in the case of the `nlfilter` function, a filter with an area of
    interest of 5  ×  5 is selected. The function must be implemented so that it receives
    an array of size 25 × *M**N* and return, as a result, a 1 × *M**N* vector representing
    the medians of all the pixels in the image where the mask of 5 × 5 has been centered.
    [Program 2.4](#C_005_c2.xhtml#p2_4) shows the implementation of this function.


    ## 2.10 Binary Filter


    This filter is designed to work on binary images. It consists of a set of Boolean
    equations that allow for the removal of noise from white and black areas. The
    filter also has equations to reconstruct corners of figures that have degraded
    angles. In order to explain the operation of the filter equations, the binary
    image defined in [Figure 2.36](#C_005_c2.xhtml#f2_36) is used as an example during
    the explanations.


    ![FIGURE 2.36 A binary image used to exemplify the operation of the binary filter.](images/Fig02_36.jpg)'
