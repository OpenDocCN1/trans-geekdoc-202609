- raw: 'Fundamentally, the filter matrix *H*(*i*,*j*), like an image, is a two-dimensional
    discrete real function. Therefore, the mask has its own coordinate system, where
    the origin is its center. Under such conditions, we will have positive or negative
    coordinates (see [Figure 2.3](#C_005_c2.xhtml#f2_3)). It is important to note
    that the coefficients of the filter matrix outside its defined coordinates are
    zero.


    ![FIGURE 2.3 Mask grid and its corresponding coordinate system.](images/Fig02_03.jpg)


    [**FIGURE 2.3**](#C_005_c2.xhtml#f2_3b) *Mask grid and its corresponding coordinate
    system.*


    ### 2.3.2 Filter Operation


    The effect of a filter on an image is completely defined by the coefficients of
    the matrix *H*(*i*,*j*). The way in which the filtering process is carried out
    on the image is shown in [Figure 2.4](#C_005_c2.xhtml#f2_4). This process can
    be described as follows:


    ![FIGURE 2.4 Linear filters. The origin of the filter coefficient matrix is placed
    at the original image I pixel \\left( {x,y} \\right). The filter coefficients
    H\\left( {i,j} \\right) are multiplied by the corresponding pixels of the image,
    thus obtaining nine different products. All products are added, and the result
    is placed at the position \\left( {x,y} \\right) of the result image I′.](images/Fig02_04.jpg)


    [**FIGURE 2.4**](#C_005_c2.xhtml#f2_4b) Linear filters. The origin of the filter
    coefficient matrix is placed at the original image *I* pixel (*x*,*y*). The filter
    coefficients *H*(*i*,*j*) are multiplied by the corresponding pixels of the image,
    thus obtaining nine different products. All products are added, and the result
    is placed at the position (*x*,*y*) of the result image *I′*.


    For each pixel (*x*,*y*) of the image, the following steps are carried out:


    1.  The filter matrix *H*(*i*,*j*) is positioned on the original image *I* at
    pixel *I*(*x*,*y*) in such a way that its coordinate center *H*(0,0) coincides
    with it.


    2.  The pixels of the image that are located within the region *R*(*x*,*y*) defined
    by the filter matrix *H*(*i*,*j*) are multiplied by the corresponding coefficients
    for each position *I*^′(*x*,*y*) of the filter matrix, and the partial result
    of each of these multiplications is added.


    3.  The outcome is placed at the position (*x*,*y*) of the resulting image.


    In other words, all pixels in the resulting image are calculated using the following
    equation:


    $I^{\\prime}\\left( {x,y} \\right) = {\\sum\\limits\_{{({i,j})}eR{({x,y})}}{I\\left(
    {x + i,y + j} \\right) \\cdot H\\left( {i,j} \\right)}}$ (2.5)


    For a typical filter with a matrix of coefficients of size 3 × 3, the following
    equation specifies its operation:


    $I^{\\prime}\\left( {x,y} \\right) = {\\sum\\limits\_{j = - 1}^{1}{\\sum\\limits\_{i
    = - 1}^{1}{I\\left( {x + i,y + j} \\right) \\cdot H\\left( {i,j} \\right)}}}$
    (2.6)


    The operation modeled by Equation 2.6 is applied to all coordinates of the image
    (*x*,*y*). Something important that must be considered at this point is that the
    previous equation is not literally applicable to all the pixels of the image.
    At the edges of the image, there are elements at which, when centering the matrix
    of filter coefficients, these do not have correspondence, and a result cannot
    be clearly established. This problem will be dealt with again with its solutions
    in [Section 2.5.2](#C_005_c2.xhtml#h2_5_2).


    ## 2.4 Calculation of Filter Operations in MATLAB


    After knowing how to perform filter operations and being warned to consider their
    effects on the borders of the image, the way in which it is possible to implement
    this type of operation through programming in MATLAB^® will be shown.


    The application of the spatial filters on images is carried out by applying a
    convolution between the pixel of interest (*x*,*y*), its neighbors, and the coefficients
    of the mask \[[5](#C_005_c2.xhtml#r2_5)\]. The spatial filtering processing mechanism
    is shown in [Figure 2.4](#C_005_c2.xhtml#f2_4). The main part of this process
    lies in the relationship between the coordinates of the filter and those belonging
    to the image. The process consists of moving the center of the filter from left
    to right and from top to bottom, performing the corresponding convolution for
    all pixels in the image. [Figure 2.5](#C_005_c2.xhtml#f2_5) shows an illustration
    of this process. For a filter of size *m*  ×  *n*, we have that *m* = 2*a* + 1
    and *n* = 2*b* + 1, where *a* and *b* are non-negative integers. This means that
    filters are always designed in odd dimensions, with the smallest dimension being
    3 × 3. Although this is not a requirement, working with odd coefficient matrices
    facilitates the processing as there is a single center, and the operation is done
    symmetrically.


    ![FIGURE 2.5 Application of the spatial filter to an image.](images/Fig02_05.jpg)


    [**FIGURE 2.5**](#C_005_c2.xhtml#f2_5b) Application of the spatial filter to an
    image.


    The value of the new pixel (*x*,*y*) generated from the filter depends on the
    intensity values that correspond to the filter coefficients in a defined region
    *R*(*x*,*y*). Considering that we have the filter coefficients and the image intensity
    values shown in [Figure 2.6](#C_005_c2.xhtml#f2_6), the new pixel value is computed
    as follows:


    ![FIGURE 2.6 Spatial filtering process.](images/Fig02_06.jpg)


    [**FIGURE 2.6**](#C_005_c2.xhtml#f2_6b) Spatial filtering process.


    $\\begin{array}{cl} {I^{\\prime}\\left( {x,y} \\right)} & {= I\\left( {x - 1,y
    - 1} \\right) \\cdot H\\left( {- 1, - 1} \\right)} \\\\ & {+ I\\left( {x - 1,y}
    \\right) \\cdot H\\left( {- 1,0} \\right) + I\\left( {x - 1,y + 1} \\right) \\cdot
    H\\left( {- 1,1} \\right)} \\\\ & {+ I\\left( {x,y - 1} \\right) \\cdot H\\left(
    {0, - 1} \\right) + I\\left( {x,y} \\right) \\cdot H\\left( {0,0} \\right)} \\\\
    & {+ I\\left( {x,y + 1} \\right) \\cdot H\\left( {0,1} \\right) + I\\left( {x
    + 1,y - 1} \\right) \\cdot H\\left( {1, - 1} \\right)} \\\\ & {+ I\\left( {x +
    1,y} \\right)H\\left( {1,0} \\right) + I\\left( {x + 1,y + 1} \\right)H\\left(
    {1,1} \\right)} \\\\ \\end{array}$ (2.7)


    An important aspect of implementation that must be taken into account is the effect
    that the limits of the image have on the processing. In the limits of the image,
    several filter coefficients from *H* will not correspond to some elements from
    the image *I*. This problem and how it can be solved will be discussed later.
    A representation of this problem is shown in [Figure 2.7](#C_005_c2.xhtml#f2_7).


    ![FIGURE 2.7 Problem of the limits of the image in the processing of the convolution.
    In the pixel (0,0) of the image, if the filter is centered, there will be coefficients
    of H on which there are no correspondent pixels from the image.](images/Fig02_07.jpg)


    [**FIGURE 2.7**](#C_005_c2.xhtml#f2_7b) Problem of the limits of the image in
    the processing of the convolution. In the pixel (0,0) of the image, if the filter
    is centered, there will be coefficients of *H* on which there are no correspondent
    pixels from the image.


    A simple solution is to only consider a smaller size of the image in the processing.
    Under this approach, if we have an image of size *M* × *N* instead of processing
    the convolution between the image and filter from 1 to *N* and from 1 to *M*,
    the processing will be done by removing the image borders. Therefore, the processing
    will be conducted from 2 to *N* − 1 and from 2 to *M* − 1. Applying this, for
    each filter coefficient, there will be a corresponding pixel of the image.


    There are two alternatives to avoid the problem of the lack of correspondence
    within the limits of the image. The first is to generate a smaller result image
    compared to the original  *M* − 2 × *N* − 1 (we have previously discussed). Another
    option is to copy rows and columns from the original image in order to define
    the missing pixels.


    ## 2.5 Types of Linear Filters'
