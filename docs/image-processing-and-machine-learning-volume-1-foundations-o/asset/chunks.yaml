    # 5 Corner Detection


    DOI: [10.1201/9781003287414-5](https://doi.org/10.1201/9781003287414-5)


    Corners are defined as prominent points characterized by a high gradient value.
    However, different from edges, this high gradient value is not only presented
    in one direction but in distinct orientations \[[1](#C_008_c5.xhtml#r5_1)\]. Considering
    the previous definition, it is possible to visualize the corners as points in
    the image that belong to different edges at the same time.


    The corners can be used in a wide range of applications, such as the tracking
    of objects in video sequences (tracking), to order the structures of objects in
    stereoscopic vision, as reference points in the measurement of geometric characteristics
    of objects, or in the calibration of cameras for vision systems \[[2](#C_008_c5.xhtml#r5_2)\].
    Some of the advantages of the corners over other characteristics obtained from
    an image are their robustness to changes in perspective as well as their reliability
    in their location under different lighting conditions \[[3](#C_008_c5.xhtml#r5_3)\].


    ## 5.1 Corners in an Image


    Considering that corners define a robust and remarkable feature of an image, their
    localization, as will be seen later, is not easy. An algorithm for corner detection
    must meet some important aspects, such as:


    *   Detect “important” corners from “unimportant” ones


    *   Detect the corners in the presence of noise


    *   Fast execution to allow its implementation in real-time


    As is natural, there are several approaches that are capable of fulfilling these
    characteristics. Most of these schemes are based on measurements of the gradient
    at the point that is considered a potential corner. While an edge is defined as
    a point in the image where the gradient value is especially high but in only one
    direction, a corner also has high gradient values but in more than one direction
    simultaneously \[[4](#C_008_c5.xhtml#r5_4)\].


    The algorithms used for corner detection adopt the criterion of the first or second
    derivative over the image in the *x* or *y* direction as an approximation of the
    gradient value. A representative algorithm of this class of methods is the Harris
    Detector. Although there are some other detectors that have interesting features
    and properties, the Harris detector is currently the most frequently used method.
    For this reason, this algorithm is explained in more detail \[[5](#C_008_c5.xhtml#r5_5)\].


    ## 5.2 The Harris Algorithm


    The algorithm developed by Harris and Stephens is based on the idea that a corner
    is a point in the image where the gradient value shows a high value in several
    directions simultaneously. This algorithm has the characteristic that it is robust
    when it classifies between corners and edges. In addition, this detector also
    presents a high degree of robustness with respect to orientation. Therefore, the
    corner alignment does not matter \[[6](#C_008_c5.xhtml#r5_6)\].


    ### 5.2.1 Matrix of Structures


    The calculation of the Harris algorithm is based on the expansion of the first
    partial derivative in a pixel *I*(*x*,*y*) in the horizontal and vertical directions
    such that:


    $I\_{x}\\left( {x,y} \\right) = \\frac{\\partial I\\left( {x,y} \\right)}{\\partial
    x}\\ \\text{y}\\ I\_{y}\\left( {x,y} \\right) = \\frac{\\partial I\\left( {x,y}
    \\right)}{\\partial y}$ (5.1)


    For each pixel of the image (*x*,*y*), three different quantities are calculated
    that will be called HE[11](*x*,*y*), HE[22](*x*,*y*) and HE[12](*x*,*y*), where:


    HE[11](*x*,*y*) = *I*[*x*]²(*x*,*y*) (5.2)


    HE[22](*x*,*y*) = *I*[*y*]²(*x*,*y*) (5.3)


    HE[12](*x*,*y*) = *I*[*x*](*x*,*y*) ⋅ *I*[*y*](*x*,*y*) (5.4)


    These values can be interpreted as approximations of the elements of the matrix
    of structures defined as HE such that:


    $\\text{HE} = \\begin{bmatrix} \\text{HE}\_{11} & \\text{HE}\_{12} \\\\ \\text{HE}\_{21}
    & \\text{HE}\_{22} \\\\ \\end{bmatrix}$ (5.5)


    where HE[12] = HE[21].


    ### 5.2.2 Filtering of the Matrix of Structures


    For the location of the corners using the Harris algorithm, it is necessary to
    smooth the values of each of the elements of the matrix of structures by convolving
    them through a Gaussian filter *H*[*σ*], such that the matrix HE is redefined
    as the matrix *E*, such that:


    $E = \\begin{bmatrix} {\\text{HE}\_{11} \\ast H\_{\\sigma}} & {\\text{HE}\_{12}
    \\ast H\_{\\sigma}} \\\\ {\\text{HE}\_{21} \\ast H\_{\\sigma}} & {\\text{HE}\_{22}
    \\ast H\_{\\sigma}} \\\\ \\end{bmatrix} = \\begin{bmatrix} A & C \\\\ C & B \\\\
    \\end{bmatrix}$ (5.6)


    ### 5.2.3 Calculation of Eigenvalues and Eigenvectors


    Due to its symmetry, the matrix *E* can be diagonalized in such a way that:


    $E^{\\prime} = \\begin{bmatrix} \\lambda\_{1} & 0 \\\\ 0 & \\lambda\_{2} \\\\
    \\end{bmatrix}$ (5.7)


    where *λ*[1] and *λ*[2] are the eigenvalues of the matrix *E*. These values are
    calculated according to:


    $\\lambda\_{1,2} = \\frac{\\text{tr}\\left( E \\right)}{2} \\pm \\sqrt{\\left(
    \\frac{\\text{tr}\\left( E \\right)}{2} \\right)^{2} - \\det(E)}$ (5.8)


    where tr(*E*) implies the trace of the matrix *E* and det (*E*) the determinant
    of the matrix *E*. Developing the operations of the trace and determinant of Equation
    5.7, we obtain:


    $\\lambda\_{1,2} = \\frac{1}{2}\\left( {A + B \\pm \\sqrt{A^{2} - 2AB + B^{2}
    + 4C^{2}}} \\right)$ (5.9)


    Both eigenvalues *λ*[1] and *λ*[2] are positive and contain important information
    about the local structures contained in the image. Within a region of the image
    whose homogeneous content is a given intensity value, the value of *E* will be
    equal to zero (*E*\=0), so the eigenvalues in that region are also *λ*[1] = *λ*[2] = 0.
    However, at an intensity step change with a value of *λ*[1] > 0 and *λ*[2] = 0,
    the eigenvalues represent the magnitude of the gradient, while the eigenvectors
    correspond to the direction. [Figure 5.1](#C_008_c5.xhtml#f5_1) shows how the
    *λ*[1] and *λ*[2] values deliver essential information about the structures contained
    in an image.


    ![FIGURE 5.1 Relationship of structures in an image and their eigenvalues.](images/Fig05_01.jpg)


    [**FIGURE 5.1**](#C_008_c5.xhtml#f5_1b) Relationship of structures in an image
    and their eigenvalues.


    A corner point has a high gradient value both in the principal direction, which
    corresponds to the value of both eigenvalues, and in the direction normal to the
    principal, which corresponds to the smallest of the eigenvalues. From the above,
    it can be concluded that for a point to be considered a corner, the eigenvalues
    *λ*[1] and *λ*[2] must have significant values. Since *A*, *C* ≥ 0, it can then
    be seen that tr(*E*) > 0. With this and observing Equations 5.8 and 5.9, it can
    be noted that |*λ*[1]| ≥ |*λ*[2]|. Considering the above information and the concept
    that a corner point must have a significant magnitude in both eigenvalues, therefore,
    for the identification of a corner, only the *λ*[2] value that is the smallest
    is considered since if this value is large, then the value of *λ*[1] will be too.


    ### 5.2.4 Corner Value Function (***V***)'
