- raw: "[**FIGURE 2.29**](#C_005_c2.xhtml#f2_29b) Correlation and convolution operations\
    \ on images. (a) Original image *f* and kernel *k*, (b) original image to which\
    \ “zeros” have been added in order to guarantee that there is an image value for\
    \ each kernel coefficient, (c) start of the correlation of the kernel with the\
    \ image to which zeros have been added, (d) result of the ‘full’ correlation,\
    \ considering the image with the additional zeros, (e) result of the correlation\
    \ of the same size ‘same’ as the image, without add zeros to the original image,\
    \ it is the same size as the original, (f) original image and kernel rotated 180°,\
    \ to convolve the image, (g) full result of the convolution, and (h) result of\
    \ the convolution of the same size ‘same’ as the image.\n\n### 2.9.2 Handling\
    \ Image Borders\n\nAn important problem, as has been repeatedly mentioned in previous\
    \ sections, is the way in which the limits of the image should be processed. When\
    \ the correlation or convolution operation is applied to an image with a filter,\
    \ there will be filter coefficients at the edges of the image that do not have\
    \ a corresponding intensity value in the image. How this problem is treated has\
    \ some effect on the final result.\n\nThere are four alternatives to solve this\
    \ problem:\n\n*   \\- Adding lines of zeros on the borders\n\n*   \\- Replicating\
    \ lines of values equal to the last rows or columns of the image.\n\n*   \\- Adding\
    \ the lines similar to if the image was reflected in a mirror.\n\n*   \\- Adding\
    \ lines as if the image repeats itself cyclically.\n\nNext, each of these elements\
    \ will be briefly described. Then these concepts will also be associated with\
    \ the way in which MATLAB incorporates such solutions into its functions.\n\n\
    *Adding lines of zeros on the borders*. This form has already been mentioned above\
    \ as a solution to the border problem in images, in which lines of zeros are added,\
    \ as many as necessary (depending on the size of the filter), to guarantee the\
    \ coefficient-pixel correspondence. In MATLAB, this option to add zeros to the\
    \ image is considered with the flag of `‘0’`. [Figure 2.30](#C_005_c2.xhtml#f2_30)\
    \ illustrates this process.\n\n![FIGURE 2.30 Adding zeros to the image in order\
    \ to guarantee the correspondence of each filter coefficient per pixel of the\
    \ image.](images/Fig02_30.jpg)\n\n[**FIGURE 2.30**](#C_005_c2.xhtml#f2_30b) Adding\
    \ zeros to the image in order to guarantee the correspondence of each filter coefficient\
    \ per pixel of the image.\n\n*Replicating lines of values equal to the last rows\
    \ or columns of the image*. In this option, lines are added to the image that\
    \ are equal to the border lines of the image, which, in other words, would mean\
    \ increasing the size of the image by repeating the last row or column of the\
    \ image. They are integrated as many times as necessary (depending on filter size).\
    \ This alternative is preferred over just adding zeros. In MATLAB, this option\
    \ is defined by the `‘replicate’` flag. [Figure 2.31](#C_005_c2.xhtml#f2_31) illustrates\
    \ this process.\n\n![FIGURE 2.31 Add the last column or row, depending on the\
    \ case, to the image in order to guarantee the correspondence of each filter coefficient\
    \ per pixel of the image.](images/Fig02_31.jpg)\n\n[**FIGURE 2.31**](#C_005_c2.xhtml#f2_31b)\
    \ Add the last column or row, depending on the case, to the image in order to\
    \ guarantee the correspondence of each filter coefficient per pixel of the image.\n\
    \n*Adding the lines similar to if the image was reflected in a mirror*. In this\
    \ case, rows or columns are added to the image as if the image was reflected in\
    \ a mirror at its borders. This option is a bit more complicated to implement\
    \ than the previous ones since the rows or columns are not fixed like the previous\
    \ ones but rather vary depending on how many it will be necessary to add (depending\
    \ on the size of the filter) to the image. In MATLAB, this option is defined by\
    \ the `‘symmetric’` flag. [Figure 2.32](#C_005_c2.xhtml#f2_32) illustrates this\
    \ process.\n\n![FIGURE 2.32 Add columns or rows as appropriate to the image as\
    \ if the image were reflected in a mirror at the borders of the image in order\
    \ to guarantee the correspondence of each filter coefficient per pixel of the\
    \ image.](images/Fig02_32.jpg)\n\n[**FIGURE 2.32**](#C_005_c2.xhtml#f2_32b) Add\
    \ columns or rows as appropriate to the image as if the image were reflected in\
    \ a mirror at the borders of the image in order to guarantee the correspondence\
    \ of each filter coefficient per pixel of the image.\n\n*Adding lines as if the\
