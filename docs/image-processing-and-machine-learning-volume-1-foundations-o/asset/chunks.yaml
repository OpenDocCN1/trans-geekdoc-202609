- raw: '[**FIGURE 6.6**](#C_009_c6.xhtml#f6_6b) Fundamental idea of the Hough transform.
    (a) Image parameter space and (b) accumulator in Hough parameter space. As can
    be seen, the accumulation register matrix is the discretized version of the Hough
    parameter space. For each point in the parameter space of image (a), there is
    a line in the Hough parameter space. The operation that is carried out is additive,
    which means that each cell of the matrix is increased by a value of one as a line
    passes through it. In this way, the points that maintain a local maximum in the
    Hough parameter space represent the k and d values that represent the lines in
    the image parameter space.


    ### 6.2.3 Parametric Model Change


    So far, the basic idea of the Hough transform has been shown. However, the representation
    of the straight line defined in Equation 6.1 cannot be used due to the computational
    error caused in the vertical lines where *k* = ∞. A better option represents the
    use of the equation:


    *x* ⋅ cos (*θ*) + *y* ⋅ sin(*θ*) = *r* (6.6)


    which does not present any singularity and also allows a linear quantification
    of its parameters *r* and *θ*. [Figure 6.7](#C_009_c6.xhtml#f6_7) illustrates
    the singularity problem in Equation 6.1 and shows how to relate Equation 6.6 to
    the line problem. With the use of Equation 6.6 for the description of lines, the
    Hough parameter space varies. So, the parameter space of the coordinates *r* and
    *θ* and the point *p*[*i*] = (*x*[*i*],*y*[*i*]) of the image parameter space
    are related according to the equation:


    ![FIGURE 6.7 Different types of parameters that can be used to characterize lines.
    Option (a) shows the singularity for when trying to characterize a vertical line;
    in that case k = \\infty, when choosing the characterization of lines by this
    type of parameter, any type of line could be represented except those close to
    the vertical position. A better approach would be the use of Equation 6.6, which,
    in addition to not showing the singularity, allows a linear quantification of
    its parameters, where the relationship between the line and the parameters is
    characterized in (b), with the referred line being the normal to the vector defined
    by r and \\theta.](images/Fig06_07.jpg)


    [**FIGURE 6.7**](#C_009_c6.xhtml#f6_7b) Different types of parameters that can
    be used to characterize lines. Option (a) shows the singularity for when trying
    to characterize a vertical line; in that case *k* = ∞, when choosing the characterization
    of lines by this type of parameter, any type of line could be represented except
    those close to the vertical position. A better approach would be the use of Equation
