    the Harris algorithm will be discussed. The first interesting aspect occurs when
    the arrays *U*(*x*,*y*) as well as *S*(*x*,*y*) are initialized with zeros. This
    action is a standard situation in those applications where pixels with some special
    characteristics are located, which in quantity will obviously be much less compared
    to the size of the image.


    Considering the above, it is much more practical and faster to initialize the
    arrays with zeros and place elements inside that meet a certain property. The
    implemented smoothing prefilter is a “Box” type filter, with a mask of 3 × 3,
