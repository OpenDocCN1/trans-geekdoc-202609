    # 5 角点检测


    DOI: [10.1201/9781003287414-5](https://doi.org/10.1201/9781003287414-5)


    角点被定义为具有高梯度值的显著特征点。然而，与边缘不同，这种高梯度值不仅出现在一个方向上，而且出现在多个不同的方向上 [1]。考虑到之前的定义，可以将角点可视化为图像中同时属于不同边缘的点。


    角点可以用于许多领域，例如视频序列中的物体跟踪（跟踪）、立体视觉中物体结构的排序、作为物体几何特征测量的参考点，或视觉系统中摄像机的校准 [2]。角点相对于图像中获取其他特征的某些优点，是它们对视角变化具有鲁棒性，并且在不同光照条件下其位置具有可靠性
    [3]。


    ## 5.1 图像中的角点


    考虑到角点定义了图像中鲁棒且显著的特征，正如后文所示，它们的定位并不容易。角点检测算法必须满足一些重要方面，例如：


    * 从“不重要”角点中检测出“重要”角点

    * 在存在噪声的情况下检测角点

    * 快速执行以允许其实时实现


    自然地，有几种方法可以满足这些特性。这些方案中的大多数基于对被认为是潜在角点的梯度测量。边缘被定义为图像中梯度值仅在某一个方向特别高的点，而角点也具有梯度值，但方向多于一个
    [4]。


    用于角点检测的算法采用图像在 `x` 或 `y` 方向上的一阶或二阶导数作为梯度值的近似。这类方法的代表性算法是哈里斯检测器（Harris Detector）。尽管还有其他具有有趣特征和属性的检测器，但哈里斯检测器是目前最常用的方法。因此，本文对该算法进行了详细解释
    [5]。


    ## 5.2 哈里斯算法


    由 Harris 和 Stephens 开发的算法基于以下观点：角点是图像中在多个方向上具有高梯度的点。哈里斯检测器的一个优点是其光照不变性，使得它能够区分角点和边缘。此外，哈里斯检测器对旋转具有良好的鲁棒性
    [6]。


    ### 5.2.1 矩阵


    哈里斯算法的计算基于图像在 `x` 或 `y` 方向上的一阶或二阶导数作为梯度值的近似。对于图像中的每个像素，计算出五个量：


    $I_x, I_y, I_{xx}, I_{yy}, I_{xy}$


    其中，$I_x$ 和 $I_y$ 是图像在 $x$ 和 $y$ 方向上的一阶导数，$I_{xx}, I_{yy}, I_{xy}$ 是它们对应的二阶偏导数。然后，构建结构矩阵
    $M$：


    $M = \sum \begin{bmatrix} I_x² & I_x I_y \\ I_x I_y & I_y² \end{bmatrix}$


    其中 $\sum$ 表示在局部窗口内的求和。通过计算矩阵 $M$ 的特征值 $\lambda_1$ 和 $\lambda_2$ 来识别像素点的类型。特征值通过求解特征方程得到：


    $\lambda² - \text{tr}(M)\lambda + \det(M) = 0$


    得到：


    $\lambda_{1,2} = \frac{\text{tr}(M) \pm \sqrt{\text{tr}(M)² - 4\det(M)}}{2}$


    其中，$\text{tr}(M) = \sum (I_x² + I_y²)$，$\det(M) = \sum (I_x² I_y² - I_x² \cdot
    I_{xy}²)$。


    ### 5.2.2 平滑处理


    为了提高检测器对噪声的鲁棒性，需要对结构矩阵 $M$ 的元素进行平滑处理。通常使用高斯滤波器 $G$ 执行此操作：


    $M = G * \begin{bmatrix} I_x² & I_x I_y \\ I_x I_y & I_y² \end{bmatrix}$


    其中 $G$ 是高斯核：$G(x,y) = \frac{1}{2\pi\sigma²} e^{-\frac{x²+y²}{2\sigma²}}$。这有助于在局部范围内获得更稳健的梯度。


    ### 5.2.3 特征值与特征向量


    由于其对称性，矩阵 $E$ 可以对角化为如下：


    $E'' = \begin{bmatrix} \lambda_1 & 0 \\ 0 & \lambda_2 \end{bmatrix}$


    其中 $\lambda_1$ 和 $\lambda_2$ 是矩阵 $E$ 的特征值。根据特征值的大小，可以对像素点进行分类：


    - 如果 $\lambda_1$ 和 $\lambda_2$ 都很大，则该点是一个可能的角点。

    - 如果一个特征值很大而另一个特征值很小，则该点是一个边缘（或位于边缘上的点）。

    - 如果 $\lambda_1$ 和 $\lambda_2$ 都很小，则该点是一个平坦区域。


    ### 5.2.4 角点响应函数 (R)


    为了量化角点的强度，哈里斯引入了角响应函数 $R$：


    $R = \det(M) - k(\text{tr}(M))²$


    其中 $k$ 是一个常数（通常取值为 0.04）。


    - 当 $R > 0$ 时，该点可能是角点。

    - 当 $R < 0$ 时，该点是边缘。

    - 当 $|R|$ 较小时，该点是平坦区域。


