    ## 4.5 Otsu Algorithm


    The Otsu method is the most popular method for calculating the optimal threshold.
    The method allows binarization of two classes using the histogram of image intensities.
    The method considers an image `I` of dimension `M×N` with `L-1` gray scales. The
    histogram presents two overlapping areas from the distribution. The first corresponds
    to object A, which involves the intensity values from 0 to `k`, while the second
    integrates the gray levels from `k+1` to `L-1`. [Figure 4.8](#C_007_c4.xhtml#f4_8)
    illustrates the distribution and its associated variables.


