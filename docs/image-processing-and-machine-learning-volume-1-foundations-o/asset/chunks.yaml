- raw: '![FIGURE 6.3 Two points p1 and p2 that belong to the same line, to determine
    the equation of the line, it will be necessary to estimate the values k and d.](images/Fig06_03.jpg)


    [**FIGURE 6.3**](#C_009_c6.xhtml#f6_3b) Two points *p*1 and *p*2 that belong to
    the same line, to determine the equation of the line, it will be necessary to
    estimate the values *k* and *d*.


    *y*[1] = *k**x*[1] + *d* y *y*[2] = *k**x*[2] + *d* (6.2)


    where *k*, *d* ∈ ℜ. The objective, therefore, is to estimate the parameters *k*
    and *d* of a line that passes through different points belonging to the edges
    of an object. Faced with this situation, the question arises: How can it be determined
    what possible points a line encompasses? A possible approach would be to draw
    all the possible lines in an image and count exactly the points that pass over
    each one of them, and then delete all those lines that do not contain more than
    a certain number of points. The above is possible, however, because the number
    of possible lines that would be drawn on the image is very large, which would
    make it especially inefficient.


    ### 6.2.1 Parameter Space


    The Hough Transform solves the line detection problem in a slightly different
    way: by producing all possible lines that pass through a pixel that corresponds
    to an edge of the image \[[6](#C_009_c6.xhtml#r6_6)\]. Each line *L*[*p*] that
    passes through a point *p*[0] = (*x*[0],*y*[0]) has the following equation:


    *L*[*P*] : *y*[0] = *k**x*[0] + *d* (6.3)


    where the values of *k* and *d* are varied to draw all the possible lines that
    have *x*[0] and *y*[0] in common. The set of solutions for *k* and *d* of Equation
    6.3 corresponds to an infinite number of lines that pass through the points *x*[0]
    and *y*[0] (see [Figure 6.4](#C_009_c6.xhtml#f6_4)). For a given value of *k*,
    the corresponding solution of 6.3 is produced as a function of *d*, which would
    imply:


    ![FIGURE 6.4 Set of lines that pass through a common point p0. All possible lines
    Lp passing through p0 have the expression y\_{0} = kx\_{0} + d where the values
    k and d are variables and determine the difference between each of the defined
    lines.](images/Fig06_04.jpg)


    [**FIGURE 6.4**](#C_009_c6.xhtml#f6_4b) Set of lines that pass through a common
    point *p*0\. All possible lines *L*p passing through *p*0 have the expression
    *y*[0] = *k**x*[0] + *d* where the values k and d are variables and determine
    the difference between each of the defined lines.


    *d* = *y*[0] − *k**x*[0] (6.4)


    This represents a linear function, where *k* and *d* are the variables and *x*[0]
    and *y*[0] are the constants of the parameters considered in the function. The
    solution set {(*k*,*d*)} of Equation 6.4 describes the parameters of all possible
    lines that pass through the point *p*[0] = (*x*[0],*y*[0]).


    For a given pixel of the image *p*[*i*] = (*x*[*i*],*y*[*i*]), according to Equation
    8.4, there is a set of straight lines defined by:


    *R*[*i*] : *d* = *y*[*i*] − *k**x*[*i*] (6.5)


    Having as variable parameters *k* and *d* which define the parameter space also
    called the Hough space, while *x*[*i*] and *y*[*i*] are the fixed parameters also
    called the image parameter space. The way in which both spaces are related is
    summarized in [Table 6.1](#C_009_c6.xhtml#t6_1).


    [**TABLE 6.1**](#C_009_c6.xhtml#t6_1b) Fields of the Structure Returned by the
    houghlines Function


    | Field || Description |


    | --- | --- |


    | **point1** || It is a 2-element vector (*x*,*y*) that specifies the start of
    the segment. |


    | --- | --- |


    | **point2** || It is a 2-element vector (*x*,*y*) that specifies the end of the
    segment. |


    | **Theta** || Vector containing information on how linearly the parameter *θ*
    was divided. |


    | **rho** || Vector containing information on how linearly the parameter r was
    divided. |


    Each point *p*[*i*] in the image parameter space corresponds to a line in the
    Hough parameter space. Considering the above, we are interested in those points
    where the lines established in the Hough parameter space intersect, which will
    correspond to the values of *k* and *d* that represent the line of the image space
    that passes through the points that formulated the lines in the Hough parameter
    space. As shown in [Figure 6.5](#C_009_c6.xhtml#f6_5), the lines *R*[1] and *R*[2]
    intersect at the point *q* = (*k*[12],*d*[12]) in the Hough parameter space, which
    represent the points *p*[1] and *p*[2] in the parameter space of the image. So,
    the line in the image space will have a slope of *k*[12] and an intercept point
    on the y-axis of *d*[12]. The more lines in the Hough parameter space that intersect
    mean that the line in the image space will be made up of that number of points.
    So, it could be established that:


    If *N**R* is the number of lines that intersect in $\\left( {\\overline{k},\\overline{d}}
    \\right)$ of the Hough parameter space, then there will be *N**R* points that
    lie on the line defined by $y = \\overline{k}x + \\overline{d}$ in the image space.


    ### 6.2.2 Accumulation Records Matrix


    The method for locating lines in an image is based on finding the coordinates
    in the Hough parameter space where several lines are cut. To calculate the Hough
    transform, it is first necessary to discretize in a stepped manner the range of
    values corresponding to *k* and *d*. When counting cuts produced by the intersection
    of several lines in the Hough parameter space, an accumulation records matrix
    is used, where each cell is increased based on the number of lines that pass through
    that cell. In such a way that the final number *N*[*p*] stored in the register
    would mean that this specific line is made up of *N*[*p*] pixels of the image
    parameter space. [Figure 6.6](#C_009_c6.xhtml#f6_6) illustrates this process considering
    the one taken in [Figure 6.5](#C_009_c6.xhtml#f6_5) as an example.


    ![FIGURE 6.5 Relationship between the image parameter space and the Hough parameter
    space. (a) Image parameter space and (b) Hough parameter space. Points in the
    parameter space correspond to lines in the Hough parameter space, while the reverse
    is also true, a point in the Hough parameter space corresponds to a line in the
    image parameter space. In the image, the points p1 and p2 of the image parameter
    space correspond to the lines R1 and R2 in the Hough parameter space; likewise,
    the point q12 = (k12, d12) the Hough parameter space corresponds to the line L12
    of the image parameter space.](images/Fig06_05.jpg)


    [**FIGURE 6.5**](#C_009_c6.xhtml#f6_5b) Relationship between the image parameter
    space and the Hough parameter space. (a) Image parameter space and (b) Hough parameter
    space. Points in the parameter space correspond to lines in the Hough parameter
    space, while the reverse is also true, a point in the Hough parameter space corresponds
    to a line in the image parameter space. In the image, the points *p*[1] and *p*[2]
    of the image parameter space correspond to the lines *R*[1] and *R*[2] in the
    Hough parameter space; likewise, the point *q*[12] = (*k[1]*[2], *d*[12]) the
    Hough parameter space corresponds to the line L[12] of the image parameter space.


    ![FIGURE 6.6 Fundamental idea of the Hough transform. (a) Image parameter space
    and (b) accumulator in Hough parameter space. As can be seen, the accumulation
    register matrix is the discretized version of the Hough parameter space. For each
    point in the parameter space of image (a), there is a line in the Hough parameter
    space. The operation that is carried out is additive, which means that each cell
    of the matrix is increased by a value of one as a line passes through it. In this
    way, the points that maintain a local maximum in the Hough parameter space represent
    the k and d values that represent the lines in the image parameter space.](images/Fig06_06.jpg)'
