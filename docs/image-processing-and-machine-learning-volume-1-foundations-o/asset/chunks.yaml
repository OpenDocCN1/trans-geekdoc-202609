    ### 2.6.2 线性卷积的性质


    卷积的重要性源于其非常有趣的数学性质。正如本书后面将看到的，卷积、傅里叶分析以及它们在频域 [7] 的对应方法之间存在紧密的关系。


    #### 2.6.2.1 交换律


    卷积具有交换律，这意味着：


    `I` * `H` = `H` * `I`


    如果图像和滤波器在操作中交换位置，则代表相同的结果，因此图像 `I` 与系数矩阵 `H`(`*i*`,`*j*`) 卷积或反之均没有区别。两个函数可以可以换位置，获得相同的结果。


    #### 2.6.2.2 线性性


    该性质意味着了一些重要的特性。如果对图像使用常数 `a` 进行缩放，然后用系数矩阵 `H` 对此结果进行卷积，得到的结果与先对图像进行卷积、然后对该操作的结果进行
    `a` 缩放相同。即：


    (`a`⋅`I`) * `H` = `a` ⋅ (`I`**`H*`) (2.15)


    此外，如果逐像素相加两幅图像，然后对结果进行 `H` 卷积，得到的结果与先对两幅图像进行卷积、最后将每幅卷积图像的结果相加相同。即：


    (`I`[1]+`I`[2]) * `H` = (`I`[1]**`H*`) + (`I`[2]**`H*`) (2.16)


    在这种语境下，可能会惊讶的是，给图像加上常数 `b` 然后通过滤波器的 `H` 窗口进行卷积，产生的结果与先对图像进行卷积、然后加上常数 `b` 不同。即：


    (`b`+`I`) * `H` ≠ `b` + `I` * `H` (2.17)


    由于使用了卷积，导致滤波操作的线性化是一个重要的理论概念；但在实践中，滤波操作涉及会限制这种线性的过程。这一事实是由舍入误差或为了可视化而对图像范围设置的限制（“裁剪”Clamping）引起的。


    #### 2.6.2.3 结合律


    卷积是一个结合律运算符，这意味着可以改变操作的分组而不影响结果。即：


    `A` * (`B`* `C`) =(`A`*`B`B`)* `C` (2.18)


    滤波器的结合是非常重要的，因为可以减少操作次数。滤波器可以分解为更小的滤波器。


    #### 2.6.3 可分离性


    等式 18 的直接结果是有通过更小的滤波器来描述滤波器的。因此，二维滤波器可以分解为更小的滤波器，使得：


    `I` * (`H`[1]**`H`[2]*) (2.19)


    此处的优点是增加了滤波器的数量，且它们都原始滤波器小。


    #### 2.6.3.1 x-y 分离


    使用滤波器时经常且重要的一是将二维滤波器分解为在两个不同方向应用的一维滤波器。假设我们有两个在每个方向上操作的一维滤波器 `H`[`x*]` 和 `H`[`y*]`，那么：


    $$H_{x}, H_{y}=\begin{bmatrix} 1 \\ 1 \\ 1 \end{bmatrix}$$ (2.20)


    如果你在图像 `I` 上交替使用这两个滤波器，可以使用如下方法：


    `I`*(`H`[`x*])**`H`[`y*]` (2.21)


    通过在图像上应用滤波器 $H_{xy}$ 可以获得相同的结果，如下：


    $$H_{xy} = H_{x} \ast H_{y} = \left[ \begin{smallmatrix} 1 \\ 1 \\ 1 \end{smallmatrix}
    \right] \left[ \begin{smallmatrix} 1 & 1 & 1 \end{smallmatrix} \right]$$ (22)


    在这种情况下，“Box” `H`[`x**y*]` 平滑滤波器可以分解为在两个方向应用的一维滤波器。完整滤波器 `H`[`x**y*]` 执行的卷积每个像素需要
    $3 \times 5 = 15$ 次操作。对于两个滤波器 `H`[`x*]` 和 `H`[`y*]`，每个像素只需要 $3 + 5 = 8$ 次操作，少得多。


    #### 2.6.3.2 高斯滤波器分离


    二维滤波器可以分解为 $x−y$ 方向的两个滤波器。遵循这种方法，可以推广为：如果你有一个二维函数，也可以将其分解为两个函数，每个函数负责处理特定的维度。即，在数学上：


    `H``x*,y* = `H``x* \cdot `H``y*` (2.23)


