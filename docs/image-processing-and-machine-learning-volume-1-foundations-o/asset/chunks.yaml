    (b) alignment of both sequences at their reference point to perform correlation,
    (c) addition of zeros to the function to ensure correspondence of coefficients,
    (d) product between both sequences, and (e) ‘full’ result of the correlation.


    ### The Correlation Operation


    The correlation operation is performed by shifting the kernel to the right, where
    the values of the correlation sequence at each step are obtained by adding the
    multiplicand values of the corresponding coefficients of both sequences. As [Figure
    2.25c](#C_005_c2.xhtml#f2_25) shows, the result of the first element of the correlation
    sequence is zero. The last value of the correlation sequence is represented by
    the last geometric displacement achieved by the kernel on the function `f`, in
    such a way that the last value of the kernel corresponds to the last value of
    the original function of `f` (without adding zeros). This process is shown in
    [Figure 2.25d](#C_005_c2.xhtml#f2_25).


    If we execute the operation as described, the correlation sequence shown in [Figure
    2.25e](#C_005_c2.xhtml#f2_25) will be obtained. It should be noted that if the
    reverse process is conducted, that is, the kernel is kept fixed and the displacement
    is carried out by the function `f`, the result would not be the same, so the order
    is important.


    To use the functions implemented in MATLAB, it is important to associate the mathematical
    operations with the parameters used in their structure. Under such conditions,
    the correlation is considered ‘full’ if the operation is performed by moving the
    kernel `k` over the function `f`, with the addition of zeros.


    Another alternative is to consider that the reference point is in the central
    coefficient of the kernel `k`. Therefore, the result will be equal to the size
    of the function `f`. This is because there will be fewer displacements between
    the kernel and the function. This type of operation is called ‘same’ in MATLAB.
    [Figure 2.26](#C_005_c2.xhtml#f2_26) shows the process of correlation with this
    variant.


    ![FIGURE 2.26 One-dimensional correlation operation performed between a function
    f and the kernel k considering that the reference point is the central coefficient
