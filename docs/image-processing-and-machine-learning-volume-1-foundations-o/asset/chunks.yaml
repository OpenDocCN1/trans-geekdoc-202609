    ### 2.5.3 高斯滤波器


    高斯滤波器对应于二维离散高斯函数，其公式可以如下：


    $G_{\\sigma}\left( r \right) = e^{\frac{r^{2}}{2\\sigma^{2}}}\\,\text{or}\\,,
