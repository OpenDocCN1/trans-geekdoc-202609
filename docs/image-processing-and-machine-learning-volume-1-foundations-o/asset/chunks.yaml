    ### 1.3.5 像素操作对直方图的影响


    增加图像的亮度（给所有像素值加上一个正常数）会导致其直方图向右移动，使得值趋向于动态范围的上限（强度值 255）。另一方面，增加某些图像的对比度会导致相应的直方图在强度区间（0–255）内扩展其值。图像的补运算或反转会导致直方图自身反射，但相对于其原始位置相反。虽然上述情况看起来显而易见（即使是微不足道的），但详细讨论像素操作与由此产生的直方图之间的关系可能会有所帮助。

