    ### 1.2.4 Segmentation by Threshold


    Segmentation by thresholding can be considered a special form of quantification
    in which the image pixels are divided into two classes depending on their relationship
    with a predefined threshold value `p[th]`. All pixels in the image assume two
    different values `p[0]` or `p[1]` depending on their relationship to the threshold,
    formally defined as:


    $f_{\\text{th}}\\left( p \right) = \left\{ \begin{matrix} {p\_{0}\\text{~\\ \\
    si~}p < p_{\\text{th}}} \\\\ {p\_{1}\\text{~\\ \\ si~}p \geq p_{\\text{th}}} \\\\
    \\end{matrix} \right.$ (1.7)


    where 0 < `p[th]` < `p[max]`. A frequent application of this operation is the
    binarization of a grayscale image by considering a `p[0]` = 0 y `p[1]` = 1. An
    example of applying segmentation by using thresholding on an image is shown in
    [Figure 1.5](#C_004_c1.xhtml#f1_5). The effect of binarization can be clearly
    seen in the resulting histogram of the image, where the whole distribution is
    divided into only two parts `p[0]` y `p[1]` as shown in [Figure 1.6](#C_004_c1.xhtml#f1_6).


    ![FIGURE 1.5 Example showing the application of segmentation by using thresholding
    on an image, considering p0 = 0, p1 = 1 y pth = 80. In addition, (c) and (d) show
    the respective histograms of (a) and (b).](images/Fig01_05.jpg)


