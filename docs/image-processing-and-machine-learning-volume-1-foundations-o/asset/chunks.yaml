    [**FIGURE 4.19**](#C_007_c4.xhtml#f4_19b) The trajectory of the contour is represented
    as an ordered sequence of pixels, considered as a starting point *p*[*s*]. Pixels
    can appear on the path more than once.


    Next, a combined algorithm will be presented that allows, unlike traditional algorithms,
    to combine the identification of the contours and the labeling of the objects
    present in a binary image.


    ### 4.8.2 Combination of Contour Identification and Object Labeling


    This method integrates the concepts of object labeling and the process of contour
    identification. The objective is to perform a single execution of both operations.
    Under this approach, both the outer and inner contours are identified and also
    labeled. This algorithm does not need any complex data structures for its implementation
    and is very efficient compared to other similar methods.


    The main idea of this algorithm, which is illustrated in [Figure 4.20](#C_007_c4.xhtml#f4_20),
    is simple and considers the following processing steps:


    ![FIGURE 4.20 Combination of contour identification and object labeling. (a) Case
    when a transition from background to an object occurs, the point is part of the
    outer boundary; (b) case when the transition from object to background occurs,
    the pixel is part of the inner boundary; and (c) case of a pixel of the object
    which is not a contour and assumes the label of its left neighbor.](images/Fig04_20.jpg)


    [**FIGURE 4.20**](#C_007_c4.xhtml#f4_20b) Combination of contour identification
    and object labeling. (a) Case when a transition from background to an object occurs,
    the point is part of the outer boundary; (b) case when the transition from object
    to background occurs, the pixel is part of the inner boundary; and (c) case of
    a pixel of the object which is not a contour and assumes the label of its left
    neighbor.


    The binary image *I*[*b*](*x*,*y*), as in the object labeling process, is processed
    from left to right and from top to bottom. This ensures that all pixels are considered.


    The following situations may appear in the processing of an image:


    **Case 1.** The transition from the background to a pixel *p*[*A*] whose value
    is one and which currently remains unlabeled ([Figure 4.20a](#C_007_c4.xhtml#f4_20)).
    When this happens, it means that the *p*[*A*] pixel is part of the outer contour
    of the object. Therefore, a new label is assigned to it, and the contour is processed,
    labeling each of the pixels that belong to it. In addition, all background pixels
    that are in contact with the object are assigned the value of ‒1.


    **Case 2.** The transition from a pixel *p*[*B*] belonging to the object to a
    background pixel ([Figure 4.20b](#C_007_c4.xhtml#f4_20)). When this happens, it
    means that the pixel *p*[*B*] belongs to an interior contour. Therefore, the contour
    is processed, labeling the pixels. As in the previous case, the background pixels
    that are in contact with the object are assigned the value of ‒1.


    **Case 3.** When a pixel of the object is not part of the contour, in this case,
    a pixel is labeled with the label value of its left neighbor ([Figure 4.20c](#C_007_c4.xhtml#f4_20)).


    In algorithms 4.2–4.4 the complete process of the algorithm that combines the
    identification of contours and the labeling process is described. The **LabelOutlineCombination**
    process goes through the image row by row and calls the **OutlineTrace** function
    when a pixel belonging to an outer or inner contour is detected. The labeling
    of a pixel along the contours, as well as the surrounding background pixels, are
    registered in the structure “Label Map” *M**E*, by calling the **NextNode** function.


    ### 4.8.3 Implementation in MATLAB


    This section explains how to implement the program that combines the contour identification
    and object labeling described in [Algorithm 4.1](#C_007_c4.xhtml#a4_1).


    First, the algorithm considers, in the processing of the binary image, eliminating
    the elements outside the image. This makes the processing easier since the outside
    pixels are not considered neighbors during the execution of the algorithm. Therefore,
    the processing for an image of dimensions *M* × *N* considers the rows from 2
    to *M* − 1 and columns from 2 to *N* − 1.


    The algorithm is implemented in [Program 4.2](#C_007_c4.xhtml#p4_2). It uses in
    its operation two functions: OutlineTrace ([Program 4.5](#C_007_c4.xhtml#p4_5))
    and *i* **NextNode** ([Program 4.6](#C_007_c4.xhtml#p4_6)). The **OutlineTrace**
    function allows you to process the outer and inner contours from a reference point
    **p**[*s*]. To do this, the **NextNode** function is called. This function allows
    you to determine from a point **p**[*s*] the next point *p* on the contour trace.
    If the next point does not exist, which could happen when it is an isolated pixel,
    the function returns as a response the same **p**[*s*] point with which the function
    is called. Therefore, if it is an isolated pixel, the **OutlineTrace** function
    terminates immediately; if this is not the case, the **NextNode** function is
    called consecutively as the contour is processed completely.


    The **OutlineTrace** function defines the points **p**[*p*] and **p**[*c*] on
    the route, which corresponds to the previous position and the current position,
    respectively. Therefore, this process ends when **p**[*c*] = **p**[*p*], which
    happens when the procedure has made a complete turnaround in the contour (all
    elements have been analyzed).


    The **NextNode** function determines, from the current point **p**[*c*], the next
    point of the contour. To do this, it will be necessary to specify an initial search
    direction (*d*). Starting from this direction, the function performs a search
    for the next contour pixel in 7 different directions clockwise. These directions
    are defined in the final part of the table described in [Algorithm 4.4](#C_007_c4.xhtml#a4_4).
    During this process, when it finds a pixel with a value of zero, the label map
    ME(*x*,*y*) assigns the value of ‒1. With this action, it is avoided going through
    this pixel again during the search process.


    The detected contours are stored in a multidimensional array of the form `Co(:,:,NCo)`,
    where the first parameters define any size (consistent with the size of the binary
    image being processed) of the image containing the contour, while `NCo` indexes
    the number of contours ([Figure 4.21](#C_007_c4.xhtml#f4_21)).


    ![FIGURE 4.21 Results obtained by the algorithm that combines the identification
    of contours and labeling of objects. (a) Original image, (b) identified contours,
    and (c) labeled objects.](images/Fig04_21.jpg)


    [**FIGURE 4.21**](#C_007_c4.xhtml#f4_21b) Results obtained by the algorithm that
    combines the identification of contours and labeling of objects. (a) Original
    image, (b) identified contours, and (c) labeled objects.


