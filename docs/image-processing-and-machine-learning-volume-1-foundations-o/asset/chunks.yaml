    线性滤波的功能由其系数的值决定。由于系数可以由不同的值组成，因此存在无限多个线性滤波器 [6]。由此，问题是：滤波器可以用于什么种类型的效果？对于特定的效果，最合适的滤波器是什么？在实践中，线性滤波器有两种类型：平滑滤波器和差分滤波器。


    ### 2.5.1 平滑滤波器


    前面的节中讨论的滤波器考虑了对原始图像的平滑效果。任何系数矩阵仅由正系数组成的线性滤波器，都以某种方式对图像产生平滑效果。通过这种操作，可以验证其结果是滤波器所覆盖区域
    `R`(`x`,`y`)）的平均值的缩放版本。


    ### 2.5.2 “框”滤波器


    框滤波器是所有对图像进行平滑处理的滤波器中最简单、最古的一种。图 2.8 显示了 (a) 这种滤波器实现的三维、(b) 二维和 (c) 掩码函数。由于其实现的边缘尖锐且频率特性特殊，“框”滤波器是一种不被推荐应用的平滑滤波器。如图
    2.8a 所示，该滤波器看起来像一个框（因此得名），并以相同的方式影响图像的每个像素（因为它所有系数的值都相同）。平滑滤波器的理想特性是其对图像的影响不受旋转影响。这种属性被称为各向同性（isotropic）。


