    image, the intensity value 2 appears 9 times.


    The histogram shows important characteristics of an image, such as its contrast
    and dynamic range, which are attributed to the image acquisition and need to be
    evaluated for correcting levels so that image properties can be analyzed more
    clearly in the post-processing stages.


    Evidently, the histogram does not provide information about the spatial distribution
    of the pixels. Therefore, the information provided by the histogram presents a
    loss of information about the spatial relationship that the pixels had in the
    image. Under such conditions, it is impossible to reconstruct an image using only
    the information from its histogram. To exemplify this fact, [Figure 1.9](#C_004_c1.xhtml#f1_9)
    shows three different images that produce the same histogram.


