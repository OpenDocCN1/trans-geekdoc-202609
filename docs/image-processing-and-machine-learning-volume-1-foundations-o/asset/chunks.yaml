- raw: 'To exemplify the way in which these operations are carried out, the one-dimensional
    case is considered for simplicity. Therefore, it is assumed that there is a function
    *f* and a kernel *k*, as is shown in [Figure 2.25a](#C_005_c2.xhtml#f2_25). For
    the correlation operation of a function and a kernel, we move both sequences in
    such a way that their reference points coincide, as shown in [Figure 2.25b](#C_005_c2.xhtml#f2_25).
    From [Figure 2.25b](#C_005_c2.xhtml#f2_25), it can be seen that there are coefficients
    that do not have a corresponding coefficient with which to interact. To solve
    this, the simplest thing is to add zeros at the beginning and at the end of the
    function *f* (see [Figure 2.25c](#C_005_c2.xhtml#f2_25)) so that during the displacement
    of the kernel. Therefore, a corresponding coefficient between both sequences is
    guaranteed.


    ![FIGURE 2.25 One-dimensional correlation operation performed between a function
    f and the kernel k. (a) Function and kernel, (b) alignment of both sequences at
    their reference point to perform correlation, (c) addition of zeros to the function
    to ensure correspondence of coefficients, (d) product between both sequences,
    and (e) ‘full’ result of the correlation.](images/Fig02_25.jpg)


    [**FIGURE 2.25**](#C_005_c2.xhtml#f2_25b) One-dimensional correlation operation
    performed between a function *f* and the kernel *k*. (a) Function and kernel,
    (b) alignment of both sequences at their reference point to perform correlation,
    (c) addition of zeros to the function to ensure correspondence of coefficients,
    (d) product between both sequences, and (e) ‘full’ result of the correlation.


    The correlation operation is performed by shifting the kernel to the right, where
    the values of the correlation sequence at each step are obtained by adding the
    multiplicand values of the corresponding coefficients of both sequences. As [Figure
    2.25c](#C_005_c2.xhtml#f2_25) shows, the result of the first element of the correlation
    sequence is zero. The last value of the correlation sequence is represented by
    the last geometric displacement achieved by the kernel on the function *f*, in
    such a way that the last value of the kernel corresponds to the last value of
    the original function of *f* (without adding zeros). This process is shown in
    [Figure 2.25d](#C_005_c2.xhtml#f2_25).


    If we execute the operation as described, the correlation sequence shown in [Figure
    2.25e](#C_005_c2.xhtml#f2_25) will be obtained. It should be noted that if the
    reverse process is conducted, that is, the kernel is kept fixed and the displacement
    is carried out by the function *f*, the result would not be the same, so the order
    is important.


    To use the functions implemented in MATLAB, it is important to associate the mathematical
    operations with the parameters used in their structure. Under such conditions,
    the correlation is considered ‘full’ if the operation is performed by moving the
    kernel *k* over the function *f*, with the addition of zeros.


    Another alternative is to consider that the reference point is in the central
    coefficient of the kernel *k*. Therefore, the result will be equal to the size
    of the function *f*. This is because there will be fewer displacements between
    the kernel and the function. This type of operation is called ‘same’ in MATLAB.
    [Figure 2.26](#C_005_c2.xhtml#f2_26) shows the process of correlation with this
    variant.


    ![FIGURE 2.26 One-dimensional correlation operation performed between a function
    f and the kernel k considering that the reference point is the central coefficient
    of the kernel. (a) Function and kernel, (b) alignment of both sequences at their
    reference point to perform correlation, (c) addition of zeros to the function
    to ensure correspondence of coefficients, (d) product between both sequences,
    and (e) ‘same’ result of the correlation.](images/Fig02_26.jpg)


    [**FIGURE 2.26**](#C_005_c2.xhtml#f2_26b) One-dimensional correlation operation
    performed between a function *f* and the kernel *k* considering that the reference
    point is the central coefficient of the kernel. (a) Function and kernel, (b) alignment
    of both sequences at their reference point to perform correlation, (c) addition
    of zeros to the function to ensure correspondence of coefficients, (d) product
    between both sequences, and (e) ‘same’ result of the correlation.


    As a comparison, the same steps with which the ‘full’ correlation operation was
    developed are also established in [Figure 2.26](#C_005_c2.xhtml#f2_26). An important
    thing to note is that the result of this correlation has the same size as the
    sequence of the function *f*.


    In convolution, as already explained, a 180° rotation is verified on the kernel
    *k*. Then, the same process of correlation is applied. As with the correlation,
    the cases of ‘full’ and ‘same’ resulting from the operation are also applicable
    here. Thus, the operation will be ‘full’ or ‘same’ if it is used as a reference
    point, the initial coefficient of the kernel (‘full’) or the central coefficient
    (‘same’). [Figure 2.27](#C_005_c2.xhtml#f2_27) shows the computation process in
    the case of correlation.


    ![FIGURE 2.27 One-dimensional convolution operation performed between a function
    f and the kernel k rotated by 180°. (a) Function and kernel, (b) alignment of
    both sequences at their reference point to perform correlation, (c) addition of
    zeros to the function to ensure correspondence of coefficients, (d) product between
    both sequences, and (e) ‘full’ result of the correlation.](images/Fig02_27.jpg)


    [**FIGURE 2.27**](#C_005_c2.xhtml#f2_27b) One-dimensional convolution operation
    performed between a function *f* and the kernel *k* rotated by 180°. (a) Function
    and kernel, (b) alignment of both sequences at their reference point to perform
    correlation, (c) addition of zeros to the function to ensure correspondence of
    coefficients, (d) product between both sequences, and (e) ‘full’ result of the
    correlation.


    From the figure, it is evident that rotating the kernel *k* by 180° reverses the
    reference point. The other steps are the same as those shown for the correlation
    case. Another important observation from the result of the convolution in its
    ‘full’ version is that it is exactly the same as that of the correlation for the
    same case, with the exception that the order of the sequence is exactly the opposite.
    Therefore, it is noted there is a close relationship between both operations.
    Similarly, the convolution can be calculated in its ‘same’ variant with the sole
    consideration that the kernel itself will have to be rotated. When it is inverted,
    it will change the order of the sequence but not the reference point. It is symmetric
    in relation to the two ends of the sequence remaining in the same position. This
    is illustrated in [Figure 2.28](#C_005_c2.xhtml#f2_28).


    ![FIGURE 2.28 Rotation of the kernel to apply convolution.](images/Fig02_28.jpg)


    [**FIGURE 2.28**](#C_005_c2.xhtml#f2_28b) Rotation of the kernel to apply convolution.


    The same concepts discussed here can be extended to the case of images. [Figure
    2.29](#C_005_c2.xhtml#f2_29) illustrates the correlation and convolution operations
    with their ‘full’ and ‘same’ variants.


    ![FIGURE 2.29 Correlation and convolution operations on images. (a) Original image
    f and kernel k, (b) original image to which “zeros” have been added in order to
    guarantee that there is an image value for each kernel coefficient, (c) start
    of the correlation of the kernel with the image to which zeros have been added,
    (d) result of the ‘full’ correlation, considering the image with the additional
    zeros, (e) result of the correlation of the same size ‘same’ as the image, without
    add zeros to the original image, it is the same size as the original, (f) original
    image and kernel rotated 180°, to convolve the image, (g) full result of the convolution,
    and (h) result of the convolution of the same size ‘same’ as the image.](images/Fig02_29.jpg)'
