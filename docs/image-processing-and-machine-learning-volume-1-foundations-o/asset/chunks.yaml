    by interpolation of the pixel intensity values). High dynamics represent an advantage
    for an image because the risk of losing image quality through the following processing
    steps is reduced. For this reason, digital cameras and professional scanners have
    a resolution higher than 8 bits, usually 12–14 bits, even if the image display
    elements have a normal resolution of 256.


    ### 1.3.5 Effects of Pixel Operations on Histograms


    An increase in the illumination (to add a positive constant to all pixel values)
    of an image causes its histogram to be shifted to the right side so that the values
    will tend to approach the upper limit of the dynamic range (to intensity values
    of 255). On the other hand, an increase in the contrast of some images causes
    the respective histogram to extend its values within the interval of intensities
    (0–255). The complement operation on an image or inversion provokes the histogram
    to reflect itself, but in the opposite direction from its original position. Although
    the above cases seem straightforward (even trivial), it might be useful to discuss
    in detail the relationships between pixel operations and the histograms resulting
    from such operations.

