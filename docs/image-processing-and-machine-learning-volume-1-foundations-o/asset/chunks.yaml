    ## 6.4 Encoding the Hough Transform in MATLAB


    In this section, the Hough transform is implemented in the detection of lines
    using MATLAB^® as a programming language; however, it is worth mentioning that
    the tools already implemented in MATLAB that allow directly detecting the lines
    in the image by means of the Hough transform are not used in this section.


    For the implementation of the Hough transform, it is necessary to consider 3 different
    parts of the code. [Program 6.1](#C_009_c6.xhtml#p6_1) shows the commented code
    that implements the Hough transform used for line detection.


    In the first part, in addition to initializing some variables, the Hough transform
    indicated by steps 1–7 of [Algorithm 6.1](#C_009_c6.xhtml#a6_1) is implemented.


    The second part of Program 8.1 is made up of the necessary instructions for choosing
    the pixels whose value of **MRAcc** is maximum within a block considered as the
    neighborhood region. To program such an event, the matrix (to which the threshold
    *t*[*h*] was applied) is traversed sequentially, pixel by pixel, finding the maximum
    value of a neighborhood block or region *R*(*x*,*y*) established around the point
    in question. To do this, the limits of the block relative to the pixel in question
    are set. In the case of [Program 6.1](#C_009_c6.xhtml#p6_1), the interval is set
    equal to 10, which, considering it in both directions, would be 20. Once the limits
    are established, the block is extracted and the maximum is found. If the maximum
    of the block corresponds to the central pixel of the block relative to that of
    the scanning process, a one is placed in that position in the End matrix in such
    a way that the indices where there are ones in End will correspond to the parameters
    that define the lines of the original image. [Figure 6.10](#C_009_c6.xhtml#f6_10)
    shows the process of finding the maximum within the considered neighborhood around
    the point in question.


    ![FIGURE 6.10 Process for obtaining the register of significant accumulators.
    Of all the points found by applying the threshold th, the one whose value MRAcc
    is the maximum in a defined neighborhood R(x,y), is selected. In this case, the
    point value P5 has the maximum value of MRAcc compared to the other values P4,
    P6, P7, P8, P9, and P10 that are within the neighborhood region defined by R(x,y).](images/Fig06_10.jpg)


    [**FIGURE 6.10**](#C_009_c6.xhtml#f6_10b) Process for obtaining the register of
    significant accumulators. Of all the points found by applying the threshold *th*,
    the one whose value MRAcc is the maximum in a defined neighborhood *R*(*x*,*y*),
    is selected. In this case, the point value P5 has the maximum value of MRAcc compared
    to the other values P4, P6, P7, P8, P9, and P10 that are within the neighborhood
    region defined by *R*(*x*,*y*).


    In the third part, the straight lines found by applying the Hough Transform are
    displayed. For this, it is considered that the values of the parameters *r* and
    *θ* represent the vector that is perpendicular to the straight line that represents
    the one detected in the parameter space of the image. To formulate the model of
    the line to display, the only thing to consider is that if the slope of the vector
    is defined by *m* = *p*[*y*]/*p*[*x*], considering that *p*[*y*] and *p*[*x*]
    are its vertical and horizontal projection, respectively, the slope of the line
    detected, which is the normal to this vector, will be the inverse and opposite
    to that of the vector (−*p*[*x*]/*p*[*y*]). [Figure 6.11](#C_009_c6.xhtml#f6_11)
    shows an illustration of this process.


    ![FIGURE 6.11 Slope of the detected line, which is the inverse and opposite to
    that of the vector defined by the parameters of the Hough Transform.](images/Fig06_11.jpg)


    [**FIGURE 6.11**](#C_009_c6.xhtml#f6_11b) Slope of the detected line, which is
    the inverse and opposite to that of the vector defined by the parameters of the
    Hough Transform.


    It is important to mention that the images contained in [Figure 6.9](#C_009_c6.xhtml#f6_9)
    were obtained by executing [Program 6.1](#C_009_c6.xhtml#p6_1), in which what
    is described by the code can be observed graphically.


    ## 6.5 Line Detection Using MATLAB Functions


    MATLAB contains 3 functions: `hough`, `houghpeaks`, and `houghlines,` which, when
    applied sequentially, allow the detection of lines in an image [[7](#C_009_c6.xhtml#r6_7)\].
    The core of these functions is represented by the Hough transform implemented
    in the Hough function, while the other two `houghpeaks` and `houghlines` are used
    as helper detection and display functions.


    As explained, this set of functions must be used sequentially for a line detection
    application. The operations performed by each of these functions correspond to
    the parts into which [Program 6.1](#C_009_c6.xhtml#p6_1) was divided, coding in
    MATLAB for the same functionality.


    The `hough` function implements the Hough Transform, generating the array of accumulation
    registers; the `houghpeaks` function determines the registers whose maximum value
    defines the parameters of the detected lines; and finally, the `houghlines` function
    allows displaying the lines found by the combination of the `hough` and `houghpeaks`
    functions.


    The `hough` function allows calculating the Hough Transform on a binary image
    that, as a prerequisite, contains the edges of an image. The syntax of this function
    is:


    ```

    [H, theta, rho] = hough(BW);

    ```


    where `BW` is a binary image containing the edges. The function returns 3 different
    values that are `H`, which contains the array of accumulator registers, and two
    vectors `theta` and `rho` that contain information on how linearly the parameters
    *r* and *θ* were divided in the array of accumulator registers of `H`.


    When the Hough function is used with the syntax shown, it linearly divides the
    parameters *r* and *θ*, into 1997 values for the parameter *r* and 180 for the
    value of *θ*. So, the size of the accumulation records matrix will be 1997 × 180.
    The resolution of `rho` depends, as shown in Equation 6.9, on the size of the
    image, while that of `rho` is 1 degree, since there are 180 different indices
    to represent 180 degrees.


    The `houghpeaks` function allows you to locate the maximum values of the array
    of accumulation registers. The syntax of this function is:


    ```

    peaks = houghpeaks(H, numpeaks, ‘Threshold’, val);

    ```


    where `H` is the accumulator record array computed by the `hough` function. The
    value `numpeaks` is a scalar that specifies the number of maximum values to identify
    in `H`. If the value of `numpeaks` is omitted in the syntax, the default value
    is 1. `‘Threshold’` is a scalar that specifies the threshold from which the `H`
    values are considered maximum. A simple way to determine a threshold that is correct
    and suitable for the accumulation record array is to use a proportional part of
    the maximum value found. An example is represented by the expression 0.5\*max(H(:)),
    which implies that the defined threshold is 50% of the maximum value register.


    The function `houghpeaks` obtains as a result a matrix of dimensions *Q* × 2,
    where *Q* is a value from 0 to `numpeaks` (maximum value to identify) and 2 implies
    the indices corresponding to the parameters *r* and *θ* that define the accumulator
    register found as maximum.'
