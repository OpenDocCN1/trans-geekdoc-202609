    (a) Original image and (b) result image.](images/Fig04_09.jpg)


    [**FIGURE 4.9**](#C_007_c4.xhtml#f4_9b) Results of the Otsu method for binarization
    produced by [Program 4.1](#C_007_c4.xhtml#p4_1). (a) Original image and (b) result
    image.


    ## 4.6 Segmentation by Region Growth


    The region growth method is a segmentation algorithm based on the successive integration
    of pixels that are related according to a similarity criterion.


    Using this approach, a pixel in the image must be chosen as the starting point.
    Then, its neighboring pixels are analyzed to check if any of them are similar
    to it. If it is similar, the pixel is included as part of the segmented region.
    Otherwise, it will not be considered.


    Thus, the first step in the region growth method is to select an initial pixel
    or seed pixel **s**(x,y). Its selection is important since it must be contained
    in the region in which it is intended to segment. From the selection of this pixel,
    a local search is made around **s**(x,y) to find a pixel with similar characteristics.
    The similarity criteria are very diverse, and these could include texture, color,
    etc. The most common is intensity. Therefore, if the neighboring pixel is similar,
    it is included as part of the segmented region; otherwise, it is registered in
    a list ***L*** to subsequently consider such elements in the search for other
    pixels. Next, the region growth algorithm will be described step by step in order
    to describe the complete computational process.


    ### 4.6.1 Initial Pixel


    The initial pixel or seed pixel **s**(x,y) must be chosen in such a way that it
    is within the region on which it is desired to segment. However, if additional
    information is considered, such as its position, this situation could speed up
    the segmentation process. An easy way to select it is through an interactive method.
    Under this approach, the point is selected directly from the image. For this purpose,
    MATLAB^® implements the function `getpts`. This function has the following format:


    ```

    [y,x]=getpts();

    ```


    where x and y represent the coordinates selected interactively with the mouse;
    notice how the coordinates are inverted. This is because the information is delivered
    in a matrix, first the row (coordinate y) and then the column (coordinate x).
    It is important before using the `getpts` function to display the image using
    `imshow`. In this way, the current graphics identifier, as provided by `imshow`,
    can be utilized by `getpts`. Another issue of importance represents the fact that
    the `getpts` function returns the values of the coordinates of the graphic object
    provided by the image displayed using `imshow`. For this reason, values are frequently
    obtained with decimal numbers, which are not appropriate to serve as indices in
    the selection of a matrix element. Therefore, it is necessary to truncate or cast
    the content of the variable to an integer type.


    ### 4.6.2 Local Search


    Once the initial pixel **s**(x,y) is selected, the method performs a local search
    around it, checking similar pixels recursively. Therefore, the search process
    is carried out in neighborhood **V** around the four closest neighbors. Once a
    pixel has been found within the neighborhood with similar characteristics to the
    initial pixel, it replaces the role of the seed pixel, and the local search process
    is repeated.


    The best way to implement a 4-element search neighborhood is to define an array
    of the form **V** = \[‒1 0; 1 0; 0 ‒1; 0 1\]. Each line expresses a particular
    neighbor element, while the columns indicate the displacements in the direction
    of horizontal (*Δ**x*) and vertical (*Δ**y*). [Figure 4.10](#C_007_c4.xhtml#f4_10)
    illustrates the correspondence process between Matrix **V** and the neighborhood.


    ![FIGURE 4.10 Correspondence process between Matrix V and the neighborhood.](images/Fig04_10.jpg)


    [**FIGURE 4.10**](#C_007_c4.xhtml#f4_10b) Correspondence process between Matrix
    **V** and the neighborhood.'
