    ## 1.3 直方图与像素操作


    在某些情况下，像素操作的效果可以通过直方图很容易检测。直方图可以被视为图像的统计指数。它通常用作辅助评估图像重要属性的元素 [#C_004_c1.xhtml#r1_4]。特别是，图像采集过程中产生的错误通过直方图很容易被识别。除了处理上述问题的能力外，还可以基于直方图对图像进行预处理以改进图像，或者突出将在后续处理中提取或分析的图像特征（例如，通过考虑图像中的模式系统）。


    ### 1.3.1 直方图


    直方图是描述图像强度值（像素）分布频率的元素。在最简单的情况下，直方图在描述灰度图像的分布时最容易理解。示例如图 1.7 所示。对于一个强度范围在 [0,K-1]
    之间的灰度图像 `I(u,v)`，生成一个具有恰 `K` 个值的直方图 `H`。因此，对于典型的 8 位灰度图像，直方图将使用 `H=256`。直方图的每个元素定义为
    `h(i)`，对应于图像中强度值为 `i` 的像素数量，适用于所有 `0 ≤ i < K` 的值。


    ![图 1.7 (a) 8 位强度（灰度）图像和 (b) 它的直方图。(images/Fig01_07.jpg)**图 1.7** (a) 8 位强度（灰度）图像和
    (b) 它的直方图。`h(i)=I(u,v)=i`，`h(0)` 为值为 0 的像素数量，`h(1)` 为值为 1 的像素数量，以此此类推，最后 `h(255)`
    代表图像中白色像素（具有最大强度值）的数量。通过直方图计算，得到了一个长度为 `K` 的一维向量 `h`，如图 1.8 所示，其中 `K=16`。![图 1.8
    具有 16 个可能值的直方图向量。索引 0...15 代表强度值。(images/Fig01_08.jpg)**图 1.8** 具有 16 个可能值的直方图向量。索引
    `0...15` 代表强度值。直方图显示了图像的对比度和范围，这些是归因于图像的问题。因此，仅凭直方图无法提供关于像素空间分布的信息。为了说明这一事实，图
