- raw: '[**FIGURE 2.36**](#C_005_c2.xhtml#f2_36b) A binary image used to exemplify
    the operation of the binary filter.


    Using the window 3 × 3 shown in [Figure 2.37](#C_005_c2.xhtml#f2_37) as a processing
    reference, the new value *P*[0] will be obtained from *p* and pixels *a*,  *b*,  *c*,  *d*,  *e*,  *f*,  *g*,  *h*
    that are its neighbors. The computation process is similar to that used in linear
    filters, with the exception that, in this case, logical operations are used. Therefore,
    the elements can only have values of True (1) and False (0).


    ![FIGURE 2.37 Processing window used in the binary filter operation.](images/Fig02_37.jpg)


    [**FIGURE 2.37**](#C_005_c2.xhtml#f2_37b) Processing window used in the binary
    filter operation.


    The first step is to remove the noise or black artifacts from the white areas;
    for this propose, the following equation is used:


    *P*[0] = *p* + (*b*⋅*g*⋅(*d*+*e*)) + (*d*⋅*e*⋅(*b*+*g*)) (2.37)


    The result of this processing is shown in [Figure 2.38a](#C_005_c2.xhtml#f2_38).
    The second step is to remove the noise or white artifacts from the black areas,
    for which the equation is defined as follows:


    ![FIGURE 2.38 Binary filter operation. (a) Removal of black artifacts, (b) removal
    of white artifacts, (c) regeneration of corners of white elements, and (d) regeneration
    of corners on black objects.](images/Fig02_38.jpg)


    [**FIGURE 2.38**](#C_005_c2.xhtml#f2_38b) Binary filter operation. (a) Removal
    of black artifacts, (b) removal of white artifacts, (c) regeneration of corners
    of white elements, and (d) regeneration of corners on black objects.


    *P*[0] = *p* ⋅ (((*a*+*b*+*d*)⋅(*e*+*g*+*h*))+((*b*+*c*+*e*)⋅(*d*+*f*+*g*))) (2.38)


    The result of this process is shown in [Figure 2.38b](#C_005_c2.xhtml#f2_38).
    To reconstruct the corners of the white figure, four different equations must
    be used, one for each corner of the figure. That is:


    For the top right corner:


    $P\_{0} = \\overline{p} \\cdot d \\cdot f \\cdot g \\cdot \\overline{\\left( {a+b+c+e+h}
    \\right)} + p$ (2.39)


    For the lower right corner:


    $P\_{0} = \\overline{p} \\cdot a \\cdot b \\cdot d \\cdot \\overline{\\left( {c+e+f+g+h}
    \\right)} + p$ (2.40)


    For the top left corner:


    $P\_{0} = \\overline{p} \\cdot e \\cdot g \\cdot h \\cdot \\overline{\\left( {a+b+c+d+f}
    \\right)} + p$ (2.41)


    For the lower left corner:


    $P\_{0} = \\overline{p} \\cdot b \\cdot c \\cdot e \\cdot \\overline{\\left( {a+d+f+g+h}
    \\right)} + p$ (2.42)


    The result of these four operations is shown in [Figure 2.38c](#C_005_c2.xhtml#f2_38).
    Finally, from the last four equations, another four equations are necessary for
    the regeneration of the corners in the black figures. They are defined as follows:


    For the top right corner:


    $P\_{0} = p \\cdot \\left( {d + f + g} \\right) + \\overline{\\left( {a\\cdot
    b\\cdot c\\cdot e\\cdot h\\cdot p} \\right)}$ (2.43)


    For the lower right corner:


    $P\_{0} = p \\cdot \\left( {a + b + d} \\right) + \\overline{\\left( {c\\cdot
    e\\cdot f\\cdot g\\cdot h\\cdot p} \\right)}$ (2.44)


    For the top left corner:


    $P\_{0} = p \\cdot \\left( {e + g + h} \\right) + \\overline{\\left( {a\\cdot
    b\\cdot c\\cdot d\\cdot f\\cdot p} \\right)}$ (2.45)


    For the lower left corner:


    $P\_{0} = p \\cdot \\left( {b + c + e} \\right) + \\overline{\\left( {a\\cdot
    d\\cdot f\\cdot g\\cdot h\\cdot p} \\right)}$ (2.46)


    The result of these four operations, which define the final result of the binary
    filter processing, is shown in [Figure 2.38d](#C_005_c2.xhtml#f2_38).


    ### 2.10.1 Implementation of the Binary Filter in MATLAB


    This section shows how the binary filter can be implemented to operate on binary
    images. In the implementation of the filter, its operation was divided into four
    different functions, which must be applied sequentially.


    The first function, called `remove_black_noise` removes artifacts or black points
    that are considered noise. This function is shown in [Program 2.5](#C_005_c2.xhtml#p2_5).


    The function called `remove_white_point_noise` removes artifacts or white points
    that are considered noise. This function is shown in [Program 2.6](#C_005_c2.xhtml#p2_6).


    The function called `rebuild_white_corners` reestablishes the corners on white
    objects that have degraded angles. This function is shown in [Program 2.7](#C_005_c2.xhtml#p2_7).


    The function called `rebuild_black_corners` reestablishes the corners on black
    objects that have defined angles. This function is shown in [Program 2.8](#C_005_c2.xhtml#p2_8).


