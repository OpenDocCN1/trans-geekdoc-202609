  trans: '


    在搜索过程中，出现了两个重要问题：图像区域外的像素和搜索方向。第一个问题主要发生在图像限制范围内进行搜索时，由于位移，导致选定的像素不在图像内。这种情况通过在代码中添加一个条件来解决，该条件允许评估所选像素是否存在于图像定义的限制范围内。


    第二个问题出现在局部搜索中，像素的位移沿着某个特定方向；然而，在相反方向上，存在一些根据相似性度量与待种子区域相对应的的像素。在这种情况下，当在确定的方向上的搜索已经耗尽时，搜索过程应该能够修改方向。为了解决这个问题，实现了一个列表
    `L` 来存储未被选的像素。列表中记录了像素的位置和其强度。因此，该列表被用于比较。所以，当在局部找到一个新像素 `pn` 时，会将它的强度与列表 `L`
    中包含元素进行比较。通过这种比较，可能会出现远处的像素 `pd` 与 `pn` 相似，这意味着 `pn` 附近具有相似特征的像素已经耗尽。在这种情况下，必须改变方向。每当在局部搜索过程中发现具有相似特征的像素时，就会从列表中提取该像素的信息。此操作确定了该像素信息已经是分割区域
    `R` 的一部分。图 4.11 显示了图像列表 `L` 的存储过程。在图像中，可以看到从种子像素 `s(x,y)` 开始的搜索是如何遵循箭头标记的方向的，当在相反方向上也发现了具有待分割特征的像素时。


    ![FIGURE 4.11 图像列表 L 的存储过程。](img/Fig04_11.jpg)


    FIGURE 4.11 图像列表 `L` 的存储过程。


    为了检查一个像素是否与另一个相似，并将强度作为相似性标准（这是通常情况），两个参数对于区域增长分割方法非常重要：(A) 最大允许的不相似性和 (B) 分割区域的相似性。


    最大允许的不相似性 (`Mp`) 代表两个被认为相似的像素之间的最大差异。该元素被视为配置参数。因此，搜索过程将一直执行，直到列表 `L` 中的成员与新像素
    `pn` 之间的差异大于 `Mp`。


    分割区域相似性 (`Srs`) 定义了待分割区域的平均强度。该参数允许更稳健的分割，因为每当在分割区域 `R` 内发现新像素时，其值就会被迭代更新。`Srs`
    参数的计算考虑了以下模型：


    ${\\mathbf{S}\mathbf{r}\mathbf{s}\left( {k + 1} \right)} = \frac{{\\mathbf{S}\mathbf{r}{{\mathbf{s}\left(
    k \right)} \cdot \left| \mathbf{R} \right|}} + {I\left( {\\mathbf{p}\mathbf{n}}
    \right)}}{\left| \mathbf{R} \right| + 1}$ (4.9)


    其中 `Srs(k+1)` 的值代表 `Srs(k)` 的更新值，而 `|R|` 对应当前属于分割区域的元素数量。最后，`I(pn)` 定义了新像素 `pn`
    的强度。


    程序 4.2 显示了实现区域增长分割方法的 MATLAB 代码。图 4.12 展示了原始图像以及通过程序 4.2 操作获得的图像。


    ![FIGURE 4.12 由程序 4.2 产生的区域增长分割方法的结果。(a) 原始图像和 (b) 结果图像。](img/Fig04_12.jpg)


    FIGURE 4.12 由程序 4.2 产生的区域增长分割方法的结果。(a) 原始图像和 (b) 结果图像。


    ## 4.7 二值图像中的对象标记


    对象标记是一种经典的图像处理技术，在文献和视觉社区中被称为“区域标记”。二值图像是一种数值表示法，仅呈现两类元素：1（指示特定对象）和 0（对应背景）。具有不同对象的数字图像示例见图
    4.13。在区域标记下，目标是识别图像中包含的二值对象的数量。算法本质上包含两个步骤：(1) 对象的临时标记和(2) 属于同一对象的多个像素标记的求解。该方法相对复杂（特别是步骤
    2）。然而，由于其内存需求适中，它是对象标记的良好选择。完整算法在算法 4.1 中描述。


    ![FIGURE 4.13 具有不同对象的二值图像。](img/Fig04_13.jpg)


    ### 4.7.1 对象的临时标记（步骤 1）


    在第一步中，从左到右、从上向下对图像进行分析。每次移动时，每个像素 `(x,y)` 被分配一个临时标记。标记的值取决于邻域类型，可以是 4 域或 8 域。对于每种情况，使用的掩码如下：


    $N_{4}\left( {x,y} \right) = \begin{bmatrix} \cdot & N_{2} & \cdot \\ N_{1} &
    \times & \cdot \\ \cdot & \cdot & \cdot \end{bmatrix}$

    $N_{8}\left( {x,y} \right) = \begin{bmatrix} N_{2} & N_{3} & N_{4} \\ N_{1} &
    \times & \cdot \\ \cdot & \cdot & \cdot \end{bmatrix}$ (4.10)


    其中 `×` 代表当前像素 `(x,y)`。在 4 域情况下，只考虑 `N[1]=I(x-1,y)` 和 `N[2]=I(x,y-1)`，而在 8 域情况下，考虑`N[1]`到`N[4]`。图
    4.14 显示了在图像上执行步骤 1 的完整过程，并考虑 88 邻域作为准则。


    ### 4.7.2 标记的传播


    认为给定位置的对象的像素值为 `I(x,y)=1`，而对于给定的背景位置，`I(x,y)=0`。此外，还假设图像外的像素为零或属于背景。区域首先从水平方向考虑，然后是垂直方向，定义左上角为起始点。在过程中，如果当前的
    `I(x,y)` 为 1，则为它分配一个新标记，或者如果它的某个邻域 `N(x,y)` 已有标记，则为其分配一个现有标记。因此，在确定标记时选择邻域类型（4
    域或 8 域）对最终结果有很大影响。


    '
