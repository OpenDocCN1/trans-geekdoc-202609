- raw: '![FIGURE 4.1 Distribution of the intensities of the pixels that integrate
    two different objects in an image. (a) The two objects and (b) their distribution
    in the histogram.](images/Fig04_01.jpg)


    [**FIGURE 4.1**](#C_007_c4.xhtml#f4_1b) Distribution of the intensities of the
    pixels that integrate two different objects in an image. (a) The two objects and
    (b) their distribution in the histogram.


    From [Figure 4.1](#C_007_c4.xhtml#f4_1), both objects can be clearly segmented
    if a threshold of 128 is applied. Therefore, if the intensity of a certain pixel
    is greater than 128, this pixel belongs to object B. Otherwise, it is considered
    to belong to object A. [Figure 4.2](#C_007_c4.xhtml#f4_2) shows the result of
    this binarization.


    ![FIGURE 4.2 The result of the segmentation of Figure 4.1(a) considering the value
    of 128 as the threshold.](images/Fig04_02.jpg)


    [**FIGURE 4.2**](#C_007_c4.xhtml#f4_2b) The result of the segmentation of [Figure
    4.1(a)](#C_007_c4.xhtml#f4_1) considering the value of 128 as the threshold.


    In most cases, the distribution of the pixels does not maintain a division as
    clear as the one shown in [Figure 4.1](#C_007_c4.xhtml#f4_1). On the contrary,
    the distributions tend to have overlapping regions. Indeed, the magnitude of this
    overlapping determines the difficulty of the segmentation since the greater the
    extent, the more difficult it is to determine which pixels belong to one or another
    distribution. [Figure 4.3](#C_007_c4.xhtml#f4_3) shows an example of this case.


    ![FIGURE 4.3 Objects that overlap their distributions. (a) The two objects and
    (b) their distribution in the histogram.](images/Fig04_03.jpg)


    [**FIGURE 4.3**](#C_007_c4.xhtml#f4_3b) Objects that overlap their distributions.
    (a) The two objects and (b) their distribution in the histogram.


    In cases of overlapping in the distributions, it is not possible to find a threshold
    that satisfies a correct segmentation since the belonging of the pixels in the
    overlap is not clear. To illustrate such an effect on segmentation, the image
    presented in [Figure 4.3](#C_007_c4.xhtml#f4_3) is binarized, considering the
    threshold of 150, which approximately represents a division between the two modes
    produced by the distributions. The result of the binarization is shown in [Figure
    4.4](#C_007_c4.xhtml#f4_4). In the result, several pixels can be seen that could
    not be properly classified due to the existing overlap between the distributions
    of both objects.


    ![FIGURE 4.4 The result of the segmentation of Figure 4.3(a) considering the value
    of 128 as the threshold.](images/Fig04_04.jpg)


    [**FIGURE 4.4**](#C_007_c4.xhtml#f4_4b) The result of the segmentation of [Figure
    4.3(a)](#C_007_c4.xhtml#f4_3) considering the value of 128 as the threshold.


    The uncertainty caused by the overlapping of the distributions represents the
    cause of the poor results in the segmentation. An auxiliary technique for eliminating
    the overlap between distributions is the application of the median filter to the
    original image as a pre-processing method. [Figure 4.5](#C_007_c4.xhtml#f4_5)
    shows the image that results from the application of the median filter (applied
    in image 4.3a) and the separation effect on its final histogram. In the processing,
    a 3 × 3 neighborhood was used.


