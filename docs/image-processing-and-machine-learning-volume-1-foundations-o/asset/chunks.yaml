- raw: 'To save time, you could use the function implemented in the image processing
    toolbox that allows you to add different types of noise to an image. This section
    will only explain how to do it for a specific type of salt and pepper noise.


    The structure of the function is:


    ```

    g=imnoise(f, ‘salt & pepper’, 0.2);

    ```


    where `f` is the image that you want to contaminate with salt and pepper noise
    and 0.2 is the percentage of pixels (the number of pixels that will be salt and
    pepper) in the image that you want to contaminate, where 0.2, for example, indicates
    that 20% of the image pixels will be contaminated. `g` is the matrix that receives
    the image contaminated by the configured noise.


    ## 2.8 Spatial Non-Linear Filters


    The use of linear filters to smooth and remove distortions from images has a great
    disadvantage; structures present in the image, such as points, edges, and lines,
    are also degraded (see [Figure 2.18](#C_005_c2.xhtml#f2_18)). This effect cannot
    be avoided by using some combination of linear filter coefficients. Therefore,
    if you want to smooth an image without affecting the quality of the structures
    present in the image, the use of linear filters is not an alternative \[[9](#C_005_c2.xhtml#r2_9)\].
    This section presents and explains a special type of filter that allows solving
    this problem, at least in a better way than linear filters. Non-linear filters
    are able to eliminate noise without the undesired effects of distortions. Such
    filters are based on operations whose characteristics and properties are not linear.


    ![FIGURE 2.18 Linear smoothing degrades important structures in the image, such
    as edges (a) or lines (b).](images/Fig02_18.jpg)


    [**FIGURE 2.18**](#C_005_c2.xhtml#f2_18b) Linear smoothing degrades important
    structures in the image, such as edges (a) or lines (b).


    ### 2.8.1 Maximum and Minimum Filters


    Non-linear filters compute the result at a certain position (*x*,*y*) like the
    previous filters by using a certain region relative to the original image *R*.
    The simplest non-linear filters are the maximum and minimum filters. The maximum
    and minimum filters are correspondingly defined as:


    $\\begin{array}{cl} {I^{\\prime}\\left( {x,y} \\right)} & {= \\min\\left\\{ {I\\left(
    {x + i,y + j} \\right)\\text{|}\\left( {i,j} \\right) \\in R} \\right\\}} \\\\
    & {= \\text{min}\\left( {R\\left( {x,y} \\right)} \\right)} \\\\ \\end{array}$
    (2.29)


    $\\begin{array}{cl} {I^{\\prime}\\left( {x,y} \\right)} & {= \\text{max}\\left\\{
    {I\\left( {x + i,y + j} \\right)\\text{|}\\left( {i,j} \\right) \\in R} \\right\\}}
    \\\\ & {= \\text{max}\\left( {R\\left( {x,y} \\right)} \\right)} \\\\ \\end{array}$


    where *R*(*x*,*y*) represents the region relative to the position (*x*,*y*) defined
    by the filter (most of the time, it is a rectangle of 3 × 3). [Figure 2.19](#C_005_c2.xhtml#f2_19)
    shows the effect of the minimum filter on different image structures. As can be
    seen in the figure, the step of the image appears displaced to the right by the
    action of the minimum filter by an amount equal to the width of the region *R*(*x*,*y*)
    defined by the filter. On the other hand, a line is eliminated by the action of
    the filter as long as the width of the line is less than that defined by the filter.


    ![FIGURE 2.19 Effect of the minimum filter on different local shapes in an image.
    The original image is on top, and the result obtained by operating the filter
    is on the bottom. The value of A expresses the width of the filter used, which
    at the same time defines the region R considered by it. The step represented in
    image (a), due to the effect of applying the filter, is shifted to the right in
    A units. The line contained in image (b), if its width is less than that of A,
    disappears due to the effect of the filter operation.](images/Fig02_19.jpg)


    [**FIGURE 2.19**](#C_005_c2.xhtml#f2_19b) Effect of the minimum filter on different
    local shapes in an image. The original image is on top, and the result obtained
    by operating the filter is on the bottom. The value of A expresses the width of
    the filter used, which at the same time defines the region R considered by it.
    The step represented in image (a), due to the effect of applying the filter, is
    shifted to the right in A units. The line contained in image (b), if its width
    is less than that of A, disappears due to the effect of the filter operation.


    [Figure 2.20](#C_005_c2.xhtml#f2_20) shows the application of the minimum and
    maximum filters on an intensity image that was artificially contaminated with
    salt and pepper noise. The minimum filter eliminates the white points of the image
    because, in its operation, it finds the minimum of a region of influence *R*(*x*,*y*)
    defined by the filter, which, centered on the contaminated white pixel, will replace
    it with the minimum value found among its neighbors. In the same way, the pixels
    that have the minimum value allowed by the image (black or pepper) are enlarged
    in relation to the size A of the filter. The maximum filter naturally presents
    the opposite effect. That is, pixels representing distortions belonging to zero
    (pepper) or small intensity values will be eliminated, while white structures
    will also be increased. [Figure 2.20](#C_005_c2.xhtml#f2_20) shows the effect
    of applying the maximum and minimum filters to an image.


    ![FIGURE 2.20 Minimum and maximum filters. (a) The original image to which salt
    and pepper noise was artificially added (see Section 2.6), (b) image resulting
    from applying the 3 \\times 3 minimum filter, and (c) image resulting from applying
    the 3 \\times 3 maximum filter.](images/Fig02_20.jpg)


    [**FIGURE 2.20**](#C_005_c2.xhtml#f2_20b) Minimum and maximum filters. (a) The
    original image to which salt and pepper noise was artificially added (see [Section
    2.6](#C_005_c2.xhtml#h2_6)), (b) image resulting from applying the 3 × 3 minimum
    filter, and (c) image resulting from applying the 3 × 3 maximum filter.


    ### 2.8.2 The Median Filter


    Obviously, it is impossible to build a filter that can remove all the imperfections
    or noise from the image and, at the same time, keep intact image structures considered
    important. It is not possible to differentiate which structures are important
    for the observer and which are not. The median filter is a good compromise in
    this dilemma.


    The effect of fading edges on an image caused by the smoothing effect of linear
    filters is generally undesirable. The median filter allows you to remove artifacts
    and unwanted structures in the image without significantly affecting the edges.
    The median filter belongs to a special class of statistical filters, which, in
    addition to being non-linear, base their actions on some statistical-type operation.


    In statistics, the median is the value of a set of data that leaves the same number
    of elements before and after it. According to this definition, the set of data
    less than or equal to the median will represent 50% of the data, and those that
    are greater than the median will represent another 50% of the total from the sample
    data.


    Considering that *x*[1], *x*[2]⋯, *x*[*n*] is the total set of data ordered in
    increasing order, the median is defined as follows:


    $M\_{e} = x\_{\\frac{n + 1}{2}}$ (2.30)


    If *n* is odd, *M*[*e*] will be the central observation of the values once they
    have been ordered in increasing or decreasing order. If *n* is even, it will be
    the arithmetic average of the two central observations, that is:


    $M\_{e} = \\frac{x\_{\\frac{n}{2}} + x\_{\\frac{n + 1}{2}}}{2}$ (2.31)


    Therefore, it can be said that the median filter replaces each pixel of the image
    with the median of the intensity values within the region of influence *R*(*x*,*y*)
    defined by the filter. This can be expressed as follows:


    *I*^′(*x*,*y*) = *M*[*e*](*R*(*x*,*y*)) (2.32)'
