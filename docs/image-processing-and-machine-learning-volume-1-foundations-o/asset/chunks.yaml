    Histograms show important characteristics of an image, such as contrast and dynamics,
    which are problems that occur during image acquisition and have consequences for
    the subsequent processing steps. In the following, important concepts to consider
    regarding the acquisition of an image and its histogram are explained.


    #### 1.3.2.1 Lighting


    Illumination errors are recognized in the histogram because there are no pixels
    in the final or initial region of the intensity scale, while the middle regions
    of the histogram present a concentration of pixels with different intensity values.
