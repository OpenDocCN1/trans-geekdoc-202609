    # 二值滤波器操作


    图 2.36 用于示例二值滤波器操作的二值图像。


    使用图 2.37 所示的 3 × 3 窗口作为处理参考，新值 `P[0]` 将通过 `p` 以及其相邻像素 `a`, `b`, `c`, `d`, `e`,
    `f`, `g`, `h` 。计算过程与线性滤波器使用的过程相似，不同在于在这种情况下使用了逻辑运算。因此，元素只能有 True (1) 和 False (0)
    的值。


    ![FIGURE 2.37 二值滤波器操作中使用的窗口。](img/Fig02_37.jpg)


    图 2.37 二值滤波器操作中使用的窗口。


    第一步是从白色区域去除噪声或黑色伪影；为了这一目的，使用了以下方程：


    ```

    P[0] = p + (b·g·(d+e)) + (d·e·(b+g)) (2.37)

    ```


    该处理的结果如图图 2.38a 所示。第二步是从黑色区域去除噪声或白色伪影，方程定义如下：


    ![FIGURE 2.38 二值滤波器操作。(a) 去除黑色伪影，b) 去除白色伪影，c) 重建白色元素的角，(d) 重建黑色对象的角。](img/Fig02_38.jpg)


    图 2.38 二值滤波器操作。(a) 去除黑色伪影，b) 去除白色伪影，c) 重建白色元素的角，(d) 重建黑色对象的角。


    ```

    P[0] = p ⋅ ((((((a+b+d)⋅(e+g+h))((((b+c+e)⋅(d+f+g)))) (2.38)

    ```


    该过程的结果如图图 2.38b 所示。为了重建白色图形的角，必须使用四个不同的方程，每个图形每个角一个。即：


    对于右上角：

    ```

    P_0 = ¯p ⋅ d ⋅ f ⋅ g ⋅ ((a+b+c+e+h)) + p (2.39)

    ```

    对于右下角：

    ```

    P_0 = ¯p ⋅ a ⋅ b ⋅ d ⋅ ((c+e+f+h)) + p (2.40)

    ```

    对于左上角：

    ```

    P_0 = ¯p ⋅ e ⋅ g ⋅ h ⋅ ((a+b+c+d+f)) + p (2.41)

    ```

    对于左下角：

    ```

    P_0 = ¯p ⋅ b ⋅ c ⋅ e ⋅ ((a+d+f+g+h)) + p (2.42)

    ```


    这四次操作的结果如图图 2.38c 所示。最后，从最后四个方程中，还需要四个方程用于重建黑色图形的角。它们定义为：


    对于右上角：

    ```

    P_0 = p ⋅ (d+g) ⋅ ¯((a·b·c·e·h·p)) (2.43)

    ```

    对于右下角：

    ```

    P_0 = p ⋅ (a+d) ⋅ ¯((c·e·f·g·h·p)) (2.44)

    ```

    对于左上角：

    ```

    P_0 = p ⋅ (e+h) ⋅ ¯((a·b·c·d·f·p)) (2.45)

    ```

    对于左下角：

    ```

    P_0 = p ⋅ (b+c) ⋅ ¯((a·d·f·g·h·p)) (2.46)

    ```


    这四次操作定义了二值滤波器处理的最终结果，结果如图图 2.38d 所示。


    ## 2.10.1 在 MATLAB 中实现二值滤波器


    本节展示了如何实现二值滤波器以处理二值图像。在滤波器的实现中，其操作被分为四个不同的函数，必须按顺序应用。


    第一个函数 `remove_black_noise` 去除被视为噪声的伪影或黑点。该函数在程序 2.5 所示。


    函数 `remove_white_point_noise` 去除被视为噪声的伪影或白点。该函数在程序 2.6 所示。


    函数 `rebuild_white_corners` 建立角度退化的白色对象的角。该函数在程序 2.7 所示。


    函数 `rebuild_black_corners` 建立具有定义的黑色对象的角。该函数在程序 2.8 所示。


