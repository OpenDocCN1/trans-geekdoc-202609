    ## 1.6 Multi-Source Pixel Operations


    Sometimes it will be necessary to perform pixel operations where the intensity
    value of the resulting pixel depends not only on the pixel in question in an image
    but also on other pixels in different images. [Figure 1.28](#C_004_c1.xhtml#f1_28)
    shows a representation of such operations.


    ![FIGURE 1.28 Representation of pixel operations, in which the resulting pixel
    depends on the value of pixels from different images, keeping the same position.](images/Fig01_28.jpg)


    [**FIGURE 1.28**](#C_004_c1.xhtml#f1_28b) Representation of pixel operations,
    in which the resulting pixel depends on the value of pixels from different images,
    keeping the same position.


    As can be seen from [Figure 1.28](#C_004_c1.xhtml#f1_28), the resulting pixel
    is obtained from the application of a function that operates on the two pixels
    from two different images. It is also considered that all the pixels participating
    in the function are from two different images with the same position. The value
    from this operation represents the result, which is in the same position as its
    sources.


    ### 1.6.1 Logical and Arithmetic Operations


    Logical and arithmetic operations performed between images, such as addition,
    subtraction, AND, and OR, can be performed pixel by pixel. An important point
    to consider is the fact that these operations may result in values that are outside
    the permissible range for the image, so sometimes a change of scale is required.


    #### 1.6.1.1 Sum


    The sum of the two images *I*[*A*] and *I*[*B*] is defined as:


    *I*^′(*x*,*y*) = *I*[*A*](*x*,*y*) + *I*[*B*](*x*,*y*) (1.29)


    A common application of this operation is to superimpose one image on another
    to achieve a blending effect (see [Figure 1.29](#C_004_c1.xhtml#f1_29)), as well
    as to add an image with artifacts or dots in different positions to simulate noise
    patterns.


    ![FIGURE 1.29 Superposition of images by applying the sum operator between two
    images. (a) Image 1, (b) image 2, (c) superposition of images 1 and 2.](images/Fig01_29.jpg)


    [**FIGURE 1.29**](#C_004_c1.xhtml#f1_29b) Superposition of images by applying
    the sum operator between two images. (a) Image 1, (b) image 2, (c) superposition
    of images 1 and 2.


    #### 1.6.1.2 Subtract


    The difference between the two images *I*[*A*] and *I*[*B*] is defined as:


    *I*^′(*x*,*y*) = *I*[*A*](*x*,*y*) − *I*[*B*](*x*,*y*) (1.30)


    This operation is commonly used for image segmentation and enhancement. Another
    important use of image subtraction is in the case of movement detection \[[8](#C_004_c1.xhtml#r1_8)\].
    If two images taken at different times are considered, *T*[1] y *T*[2], and we
    obtain their difference. What we will find with it is the change in position of
    the pixels that were part of the object that changed its position. [Figure 1.30](#C_004_c1.xhtml#f1_30)
    shows an example of position change detection by subtracting two images taken
    at different time instants.


    ![FIGURE 1.30 Movement detection by subtracting images taken at different time
    instants. (a) Image 1 taken at instant 1, (b) image 2 taken at instant 2, and
    (c) subtraction of image 1 and 2.](images/Fig01_30.jpg)


    [**FIGURE 1.30**](#C_004_c1.xhtml#f1_30b) Movement detection by subtracting images
    taken at different time instants. (a) Image 1 taken at instant 1, (b) image 2
    taken at instant 2, and (c) subtraction of image 1 and 2.


    #### 1.6.1.3 AND and OR


    These operations are performed between binary images using the truth table for
    both logic functions. Therefore, in the case of AND, both pixels must be one in
    order to generate a pixel one in the resulting image, while in the case of the
    OR function with one of the pixels of the image being one is sufficient reason
    to generate one in the output image. For any other combination in both cases,
    the pixel will be zero in the output image. These functions have their main activity
    in block processing, where only those pixels considered in a certain region will
    be considered in the processing, while the others will be set to zero or simply
    not taken into account.


    ### 1.6.2 Alpha Blending Operation


    The alpha blending or compositing operation is used to combine two images, where
    each pixel of the resulting image is a linear combination of the pixels of the
    two images considered as sources. That is, if we have two images and we apply
    the alpha blending operation to combine them, each pixel of the resulting image
    will be a linear combination of both images, defined by the following equation:


    *I*[*R*](*x*,*y*) = (1−*α*) ⋅ *I*[*A*](*x*,*y*) + *α* ⋅ *I*[*B*](*x*,*y*) (1.31)


    By means of this operation, it is possible to blend two images. The background
    image is represented by the image *I*[*A*]. The image *I*[*B*] is considered transparent
    in the background *I*[*A*]. The association of these two images is controlled
    by the transparency factor *α*, which is defined in the interval \[0,1\]. [Figure
    1.31](#C_004_c1.xhtml#f1_31) shows the effect of applying this operation to two
    images, considering different values of *α*.


    ![FIGURE 1.31 Effect of applying the Alpha Blending operation. (a) Image IB, (b)
    image IA, (c) result image IR with α = 0.3, and (d) result image IR with α = 0.7.](images/Fig01_31.jpg)


    [**FIGURE 1.31**](#C_004_c1.xhtml#f1_31b) Effect of applying the Alpha Blending
    operation. (a) Image *I[B]*, (b) image *I[A]*, (c) result image *I[R]* with *α*
    = 0.3, and (d) result image *I[R]* with *α* = 0.7.


