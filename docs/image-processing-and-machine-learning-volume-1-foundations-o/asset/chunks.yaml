    While the contrast of an image can be high as long as the maximum value of the
    pixel intensity range is not exceeded, the dynamics of an image cannot be high
    (except by interpolation of the pixel intensity values). High dynamics represent
    an advantage for an image because the risk of losing image quality through the
    following processing steps is reduced. For this reason, digital cameras and professional
    scanners have a resolution higher than 8 bits, usually 12–14 bits, even if the
    image display elements have a normal resolution of 256.


    ### 1.3.3 Calculating the Histogram of an Image with MATLAB


    This section explains MATLAB functions that can be used to calculate and display
    the histogram of an image contained in the Image Processing Toolbox [[5](#C_004_c1.xhtml#r1_5)].


    #### 1.3.3.1 MATLAB Command Line Function


    The function of the image processing toolbox for calculating the histogram of
    an image has the following format:


    ```

    [counts,x]=imhist(I, n)

    ```


    This function calculates and displays the histogram of the `I` image. The number
    of histogram values if `n` is not specified depends on the type of image involved.
    If `I` corresponds to a grayscale image, the function will use 256 values for
    the calculation and display. If `I` represents a binary image, the function will
    calculate the histogram with only two values.


    If `n` is specified, the histogram is calculated and displayed using `n` intensity
    values instead of those specified by the image type. The variable `counts` symbolizes
    a vector that contains the number of pixels.


    ### 1.3.4 Histograms


