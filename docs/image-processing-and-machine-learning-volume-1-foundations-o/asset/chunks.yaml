    # 4 二值图像的分割与处理


    DOI: [10.1201/9781003287414](https://doi.org/10.1201/9781003287414)


    ## 4.1 引言


    图像分割是计算机视觉领域的一个活跃研究领域，具有无数应用。分割的目的是将图像划分为根据某些语境具有某种关联性或意义的区域。文献中为了这一目的提出了各种方法和途径。特定方法的选择取决于特征。分割被认为是对图像所包含物体进行描述、识别或分类的前期步骤。本章将分析最流行的分割方法及其实现。


    分割产生的二值图像是像素值只有两个值之一（即 1 或 0）的图像。通常，这种像素分类对应于物体（值设置为 1）和背景（值设置为 0），尽管显然，这种分类并不总是可行的。分割产生的二值图像是像素值只有两个值之一的图像，或者零。这种过程通常被称为二值化。


    ## 4.2 分割


    分割定义为将图像划分为不同的区域，使得每个区域在某些标准下是相似的，其目标是区分物体和图像的其余部分。在简单情况下，分割被分为两个类。


    分割定义为将图像划分为不同的区域，使得每个区域在某些标准下是相似的，其目标是区分物体和图像的其余部分（即背景）。


    图像分割有许多方法，可以根据所考虑的特征和算法类型进行分类。根据特征，分割方法包括像素强度值、纹理或梯度值。关于算法类型，分割技术可分为上下文和非上下文。


    非上下文技术忽略像素与其要隔离的物体之间的关系。在这种情况下，它们根据像素的全局特征（如强度水平）进行分组。该类的主要技术是阈值法。


    上下文技术与非上下文技术不同，它们还利用像素与其要隔离的物体之间的关系，引入相似性度量或标准。在这种情况下，上下文方法可以将一组强度相似且彼此相邻，或者梯度方向方向相同的像素组合在一起。


    ## 4.3 阈值


    阈值是一种假设物体是由具有均匀强度的像素组成的分割技术。在这种情况下，每个像素都与一个预设阈值进行比较；如果像素强度值较高，则认为该像素属于某个类别，如果较低，则属于另一个类别。在这种情况下，分割的质量取决于合适阈值的选择。


    在阈值的理想情况下，直方图反映了图像中物体的像素分布不重叠，因此某个阈值值就可以区分两个物体。

