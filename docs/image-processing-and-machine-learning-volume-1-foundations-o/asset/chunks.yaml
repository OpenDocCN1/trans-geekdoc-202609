    应用阈值后得到的图像，(e) 最大点的位置，以及 (f) 应用霍夫算法后得到的直线。


    在图 6.9e 中，可以从获得的极大点看出，最近的点（5 和 6）在实际上是连续的，它们代表了图 6.9a 中具有相同斜率（即 `θ` 值相同）的平行直线。


    ## 6.4 在 MATLAB 中编码霍夫变换


    在本节中，将使用 `MATLAB^®` 作为编程语言，在直线检测中实现霍夫变换；然而，值得提到，MATLAB 中已经实现的允许通过霍夫变换直接检测图像中直线的工具在本节中并未。


    为了实现霍夫变换，需要考虑代码的 3 个不同部分。程序 6.1 显示了用于直线检测的霍夫变换的注释代码。


    在第一部分，除了初始化一些变量外，还实现了算法 6.1 第 1–7 步所示的霍夫变换。


    程序 8.1 的第二部分由必要的指令组成，用于在被视为邻域区域的块内选择 `MRAcc` 值最大的像素。为了对该事件进行编程，将逐个像素按顺序遍历矩阵（该矩阵已应用了阈值
    `t`[`h`]），找到围绕目标点建立的邻域块或区域 `R`(`x`,`y`）的最大值。为了做到这一点，设置了块相对于目标像素的边界。在程序 6.1 中，间隔被设置为
    10，考虑到两个方向，它将是 20。一旦边界建立，就会提取该块并找到最大值。如果块的最大值对应于扫描过程中相对于该块的中心像素，则在 `End` 矩阵在该位置放置一个
    1，使得 `End` 中出现 1 的索引将对应于定义原始图像直线的参数。图 6.10 显示了在目标点考虑的邻域内寻找最大值的过程。


    ![图 6.10 获取显著累加器寄存器的过程。在所有通过阈值 `th` 找到的点中，选择在定义邻域 `R(x,y)` 内值 `MRAcc` 最大的点。在这种情况下，点值
    `P5` 与 `R(x,y)` 定义的邻域区域内的其他值 `P4`、`P6`、`P7`、`P8`、`P9` 和 `P10` 相比具有最大的 `MRAcc`
    值。](img/Fig06_10.jpg)


    图 6.10 获取显著累加器寄存器的过程。在所有通过阈值 `th` 找到的点中，选择在定义邻域 `R`(`x`,`y`）内值 `MRAcc` 最大的点。在这种情况下，点值
    `P5` 与 `R`(`x`,`y`）定义的邻域区域内的其他值 `P4`、`P6`、`P7`、`P8`、`P9` 和 `P10` 相比具有最大的 `MRAcc`
    值。


    在第三部分，显示了通过霍夫变换找到的直线。为此，认为参数 `r` 和 `θ` 的值代表与图像参数空间中检测到的直线正交的向量。为了构建要显示的直线模型，唯一需要考虑的是，如果向量的斜率由
    `m` = `p`[`y*]/`p`[`x*]` 定义，考虑到 `p`[`y*]` 和 `p`[`x*]` 分别是它的垂直和水平投影，则检测到的直线斜率（它是该向量的法线）将是该向量斜率的倒数且相反数(−`p`[`x*]/`p`[`y*]`）。图
    6.11 显示了该过程的插图。


    ![图 6.11 检测直线的斜率，它是由霍夫变换参数定义的向量斜率的倒数且相反数。](img/Fig06_11.jpg)


    图 6.11 检测直线的斜率，它是由霍夫变换参数定义的向量斜率的倒数且相反数。


