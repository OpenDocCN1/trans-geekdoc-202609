- raw: 'Volume 1 covers the fundamental concepts and techniques in image processing,
    starting with pixel operations and their properties and exploring spatial filtering,
    edge detection, image segmentation, corner detection, and geometric transformations.
    It provides a solid foundation for readers interested in understanding the core
    principles and practical applications of image processing. By focusing on these
    initial six chapters, the volume establishes the essential groundwork necessary
    for further exploration in the field. Building upon the knowledge gained from
    Volume 1, Volume 2 considers more advanced topics in image analysis. It covers
    a range of subjects, including morphological filters, color image processing,
    image matching, feature-based segmentation using the mean-shift algorithm, and
    finally, the application of singular value decomposition (SVD) for image compression.
    In addition to covering the advanced concepts and techniques of image processing,
    Volume 2 provides several important ML techniques as applied to the field. Recognizing
    the increasing significance of ML in image analysis and understanding its potential
    for enhancing image processing tasks, we have incorporated relevant ML approaches
    throughout Volume 2.


    The division into two volumes was aimed at ensuring that each volume could stand
    alone as a self-contained resource. This means that readers have the flexibility
    to review and study each volume independently, without necessarily relying on
    the other volume for context or understanding. By maintaining a self-contained
    structure, readers can approach the material in a modular manner, focusing on
    specific aspects or revisiting specific chapters as needed.


    Welcome to Volume 1 of our book. This volume serves as an introduction to the
    fundamental concepts and techniques in image processing. It lays the groundwork
    for understanding the core principles and practical applications of image processing.
    By focusing on these fundamental topics, Volume 1 aims to provide readers with
    a solid understanding of the core concepts and techniques in image processing.
    It forms the basis upon which you can further explore advanced topics and ML applications
    in Volume 2. Whether you are a student or a practitioner in the field, this volume
    will equip you with the necessary knowledge to approach image processing tasks
    with confidence and understanding.


    Many books on image processing techniques are geared toward readers with a strong
    mathematical background. Upon reviewing various related books, the authors noticed
    the need for a more general and less technical approach to these topics to attract
    a wider audience of readers and students. This book includes all the topics found
    in other similar books, but with a greater emphasis on explaining, putting into
    practice, and utilizing the methods, and less emphasis on the mathematical details.


    This book not only covers the key concepts and techniques of image processing
    but also provides a substantial amount of code and implementations. The authors
    view this as an important aspect of the book. Even those readers with strong mathematical
    abilities can struggle to fully grasp a particular approach until they see it
    in code. By implementing algorithms and methods in code, any confusion or uncertainty
    is removed, making the material easier to understand and transmit. With this approach,
    as the reader progresses through the book from simpler to more advanced methods,
    the focus on computation (the implemented code) allows them to see the various
    models and reinforce their mathematical understanding.


    Many comparable books only focus on the theoretical aspect, while those that cover
    practical implementations usually present a general approach to developing algorithms
    from scratch. Our teaching experience has shown that students understand the material
    faster when they have access to code that they can modify and experiment with.
    This book uses MATLAB^® as the programming language to implement the systems,
    due to its popularity among engineers and its extensive library collection for
    various disciplines. Other programming languages such as Java, R, C++, and Python
    are also used in engineering, but MATLAB stands out for its distinctive features.


    For beginner readers, the numerous computational methods used in image processing
    can be overwhelming due to the vast number of mathematical concepts and techniques
    involved. Some practical books attempt to address this issue by offering chapters
    on how to use pre-existing recipes. However, what if the assumptions of the problem
    are not met? In such cases, it becomes necessary to modify or adapt the algorithm.
    To accomplish this, it’s crucial that the book provides the conceptual understanding
    needed to appreciate and comprehend the underlying mathematics. The aim of this
    book is to strike a balance by offering a comprehensive yet accessible view of
    the most commonly used computational algorithms and popular image processing approaches,
    with a focus on rigor.


    Despite the heavy mathematical concepts involved in image processing methods,
    it is possible to utilize these models without a deep understanding of their mathematical
    foundations. For many readers, learning image processing through programming instead
    of a complex mathematical model is a more feasible goal. This book aims to fulfill
    this objective.


    The teaching of image processing can be effective by blending theoretical knowledge
    with hands-on computer exercises, allowing students to write their own code for
    processing image data. As image processing principles are widely used in various
    fields, such as ML and data analysis, there is a growing demand for engineers
    who are proficient in these concepts. Many universities respond to this need by
    offering comprehensive courses in image processing that cover the most widely
    used techniques. Image processing is perceived as a highly practical subject,
    inspiring students to see how image transformations can be transformed into code
    to produce visually appealing effects.


    The material has been compiled from a teaching perspective. For this reason, the
    book is primarily intended as a textbook for undergraduate and postgraduate students
    of Science, Electrical Engineering, or Computational Mathematics. It is appropriate
    for courses such as image processing, computer vision, artificial vision, advanced
    methods, and image understanding. The book was conceived as a complete course
    that can be covered in a semester.


    Volume 1 is organized in a way that allows readers to easily understand the goal
    of each chapter and reinforce their understanding through practical exercises
    using MATLAB programs. It consists of six chapters; the details of each chapter
    are described below.


    **[Chapter 1](#C_004_c1.xhtml)** explores pixel operations, their properties,
    and how they are applied in image processing. It also explains the relationship
    between image histograms and pixel operations and includes numerical examples
    using MATLAB to help illustrate the concepts.


    **[Chapter 2](#C_005_c2.xhtml)** focuses on the analysis of spatial filtering,
    which involves modifying each pixel of an image by considering not only its original
    value but also the values of its neighboring elements.


    In **[Chapter 3](#C_006_c3.xhtml)**, the concepts of the edges or contours of
    an image are described, which corresponds to an important component for image
    analysis. The main existing methods for locating edges, their properties, and
    particularities, which are implemented in MATLAB for the reader’s understanding,
    are also addressed.


    **[Chapter 4](#C_007_c4.xhtml)** covers the topic of image segmentation and the
    treatment of binary images. Segmentation involves isolating each individual binary
    object in an image. After isolating these objects, various properties such as
    the number of objects, their position, and the number of pixels that make up the
    object can be evaluated.'
