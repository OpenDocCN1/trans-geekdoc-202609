    如前所述，卷积等同于滤波器预先旋转 180°后的相关操作。反之亦然。相关操作的结果与滤波器预先旋转 180° 后的卷积结果相同。这一点非常重要，因为图像处理工具箱定义了几个特殊滤波器，这些滤波器在最初计划对图像执行卷积时，被预先旋转了
    180°，以便直接与相关操作（默认选项）配合。


    当我们使用卷积处理滤波器时，有两种不同的选项：一种是使用 `imfilter` 函数的 `filter_mode` (conv) 标记，另一种是将滤波器旋转
    180° 并以其默认选项（corr）应用 `imfilter` 函数。要将矩阵（在我们的案例中为滤波器）旋转 180°，可以使用以下函数：


    ```

    Hr=rot90(H,2)

    ```


    其中 `Hr` 是旋转了 180° 后的滤波器，而 `H` 是待旋转的滤波器。


    图 2.34 显示了 `imfilter` 函数的使用，以及在使用对应于 `border_options` 标记的不同选项时的效果，此处滤波器 `H` 是一个
    31 × 31 的“箱”平滑滤波器，该滤波器是通过 MATLAB 中的以下命令获得的：


    ![FIGURE 2.34 使用‘border\_options’ 标记不同选项的效果。(a) 原图，(b) 使用‘0’ 选项对图像的影响，(c) 使用‘replicate’
    选项对图像的影响，(d) 使用‘symmetric’ 选项对图像的影响，以及 (e) 使用‘circular’ 选项对图像的影响。](img/Fig02_34.jpg)


    FIGURE 2.34 使用‘border\_options’ 标记不同选项的效果。(a) 原图，(b) 使用‘0’ 选项对图像的影响，(c) 使用‘replicate’
    选项对图像的影响，(d) 使用‘symmetric’ 选项对图像的影响，以及 (e) 使用‘circular’ 选项对图像的影响。


    ```

    H=ones(31,31)/(31*31);

    ```


    从 图 2.34b 可以看出，在添加零行零列时使用 `‘0’` 选项会在原始图像没有黑色像素的区域产生从黑到白的平滑效果。在 图 2.34e 中也发生了相同的情况，那里添加了相等的行和列（‘circular’），就像在上下和两侧重复了一样。


    ### 2.9.4 用于非线性空间滤波的 MATLAB 函数


    非线性滤波的原理与掩码沿图像移动相同。然而，与线性滤波不同，它的操作不考虑滤波器系数与图像像素之间乘积之和。线性与非线性滤波之间的另一个显著区别是掩码或滤波器系数概念的作用。在线性滤波器中，滤波器系数决定了滤波的效果。而在非线性操作中，滤波器仅代表影响区域。因此，掩码代表在处理中将被考虑的像素，而不是它们参与处理的方式（如线性滤波中的那样）。图像处理工具箱有两个对图像进行非线性滤波的函数，它们是：`nlfilter`
    和 `colfilt`。


    `nlfilter` 函数允许使用非线性操作对图像进行滤波。其通用语法为：


    ```

    B = nlfilter(A, [m n], @Fun);

    ```


    其中 `m` 和 `n` 决定了跨图像处理的非线性滤波器影响区域的大小。`A` 对应于滤波的图像，而 `B` 将包含滤波后的图像。`fun` 定义了一个实现滤波器操作的用户自定义函数。该函数从
    `nlfilter` 接收一个 `mxn` 数据的矩阵，并返回在这些数据上实现的非线性操作结果。`@` 符号称为函数句柄，它是一种 MATLAB 数据类型，包含了用作引用以实现操作的函数信息。


    作为一个示例，我们将使用 `nlfilter` 函数计算中值滤波。首先，我们需要一张包含盐和椒噪声的图像。因此，考虑 图 2.35a 所示的图像，添加 10%
    的盐和椒噪声，得到 图 2.35b。该图像是通过以下命令生成的：


    ![FIGURE 2.35 使用 nlfilter 函数。(a) 原图，(b) 被盐和椒噪声失真的图像，以及 (c) 使用程序 2.3 中定义的函数通过 nlfilter
    滤波的图像，该函数实现了中空间非线性滤波。](img/Fig02_35.jpg)


    FIGURE 2.35 使用 nlfilter 函数。(a) 原图，(b) 被盐和椒噪声失真的图像，以及 (c) 使用程序 2.3 中定义的函数通过 nlfilter
    滤波的图像，该函数实现了中空间非线性滤波。


    ```

    I=imnoise(I, ‘salt & pepper’, 0.1);

    ```


