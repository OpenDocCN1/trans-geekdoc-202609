    reference point to perform correlation, (c) addition of zeros to the function
    to ensure correspondence of coefficients, (d) product between both sequences,
    and (e) ‘same’ result of the correlation.](images/Fig02_26.jpg)


    [**FIGURE 2.26**](#C_005_c2.xhtml#f2_26b) One-dimensional correlation operation
    performed between a function `f` and the kernel `k` considering that the reference
    point is the central coefficient. (a) Function and kernel, (b) alignment of both
    sequences at their reference point to perform correlation, (c) addition of zeros
    to the function to ensure correspondence of coefficients, (d) product between
    both sequences, and (e) ‘same’ result of the correlation.


    ### Comparison and MATLAB Variants


    As already explained, the process of correlation is developed in [Figure 2.26](#C_005_c2.xhtml#f2_26).
    An important thing to note is that rotating the kernel `k` by 180° reverses the
    reference point. Thus, the result of the convolution in its ‘full’ version is
    exactly the same as that of the correlation, with the exception that the order
    of the sequence is the opposite. Therefore, it is noted there is a close relationship
    between both operations.


    Similarly, the convolution can be calculated in its ‘same’ variant with the sole
    consideration that the kernel itself will have to be rotated. When it is inverted,
    it will change the order of the sequence but not the reference point. It is symmetric
    in relation to the two ends of the sequence remaining in the same position. This
