    + 1,y - 1} \right)} & + \\ \end{matrix}\operatorname{}} \\ \begin{matrix} {I\left(
    {x - 1,y} \right)} & + \\ \end{matrix} & \begin{matrix} {I\left( {x,y} \right)}
    & + \\ \end{matrix} & \begin{matrix} {I\left( {x + 1,y} \right)} & + \\ \end{matrix}
