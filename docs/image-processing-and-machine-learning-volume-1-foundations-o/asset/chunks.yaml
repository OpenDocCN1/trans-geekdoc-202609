    ### 2.9.2 Handling Image Borders


    An important problem, as has been repeatedly mentioned in previous sections, is
    the way in which the limits of the image should be processed. When the correlation
    or convolution operation is applied to an image with a filter, there will be filter
    coefficients at the edges of the image that do not have a corresponding intensity
    value in the image. How this problem is treated has some effect on the final result.


    There are four alternatives to solve this problem:


    * Adding lines of zeros on the borders

    * Replicating lines of values equal to the last rows or columns of the image.

    * Adding the lines similar to if the image was reflected in a mirror.

    * Adding lines as if the image repeats itself cyclically.


    Next, each of these elements will be briefly described. Then these concepts will
    also be associated with the way in which MATLAB incorporates such solutions into
    its functions.


    *Adding lines of zeros on the borders*. This form has already been mentioned above
    as a solution to the border problem in images, in which lines of zeros are added,
    as many as necessary (depending on the size of the filter), to guarantee the coefficient-pixel
    correspondence. In MATLAB, this option to add zeros to the image is considered
    with the flag of `‘0’`. [Figure 2.30](#C_005_c2.xhtml#f2_30) illustrates this
    process.


    ![FIGURE 2.30 Adding zeros to the image in order to guarantee the correspondence
    of each filter coefficient per pixel of the image.](images/Fig02_30.jpg)


    **FIGURE 2.30** (#C_005_c2.xhtml#f2_30b) Adding zeros to the image in order to
    guarantee the correspondence of each filter coefficient per pixel of the image.


    *Replicating lines of values equal to the last rows or columns of the image*.
    In this option, lines are added to the image that are equal to the border lines
    of the image, which, in other words, would mean increasing the size of the image
    by repeating the last row or column of the image. They are integrated as many
    times as necessary (depending on filter size). This alternative is preferred over
    just adding zeros. In MATLAB, this option is defined by the `‘replicate’` flag.
    [Figure 2.31](#C_005_c2.xhtml#f2_31) illustrates this process.


    ![FIGURE 2.31 Adding zeros to the image in order to guarantee the correspondence
    of each filter coefficient per pixel of the image.](images/Fig02_31.jpg)


    **FIGURE 2.31** (#C_005_c2.xhtml#f2_31b) Adding zeros to the image in order to
    guarantee the correspondence of each filter coefficient per pixel of the image.


    *Adding the lines similar to if the image was reflected in a mirror*. In this
    case, rows and columns are added to the image as the image was reflected in a
    mirror. This option is a bit complicated than the previous ones since rows and
    columns are not fixed but rather vary depending on the filter. In MATLAB, this
    option is defined by the `‘symmetric’` flag. [Figure 2.32](#C_005_c2.xhtml#f2_32)
    illustrates this process.


    ![FIGURE 2.32 Adding zeros to the image in order to guarantee the correspondence
    of each filter coefficient per pixel of the image.](images/Fig02_32.jpg)


    **FIGURE 2.32** (#C_005_c2.xhtml#f2_32b) Adding zeros to the image in order to
    guarantee the correspondence of each filter coefficient per pixel of the image.


    *Adding lines as if the image repeats itself cyclically*. In this case, rows and
    columns are added to the image as if the image was itself, repeated above and
    below, on one side and on the other. In MATLAB, this option is defined by the
    `‘circular’` flag. [Figure 2.33](#C_005_c2.xhtml#f2_33) illustrates this process.


    ![FIGURE 2.33 Adding zeros to the image in order to guarantee the correspondence
    of each filter coefficient per pixel of the image.](images/Fig02_33.jpg)


    **FIGURE 2.33** (#C_005_c2.xhtml#f2_33b) Adding zeros to the image in order to
    guarantee the correspondence of each filter coefficient per pixel of the image.


    ### 2.9.3 MATLAB Functions for the Implementation of Linear Spatial Filters


    The MATLAB image toolbox implements the function `imfilter` for linear filtering
    of images, which has the following structure:


    ```

    g=imfilter(f,H,filter_mode,border_options,result_size)

    ```


    Where `g` is the filtered image and `f` is the image to be filtered with `H`.
    The `filter_mode` flag specifies whether the function will use correlation (`‘corr’`)
    or convolution (`‘conv’`) for filtering. The `border_options` flag refers to the
    way in which the border problem will be solved by the function. The options are
    `replicate`, `symmetric` and `circular`, whose effects and implications were already
    discussed in Section 2.8.2. The `result_size` flag indicates the size of the result
    obtained by the filter. Its options can be `same` and `full`. Similarly, the effects
    of these options were already explained in 2.8.1. [Table 2.1](#C_005_c2.xhtml#t2_1)
    shows a summary of the flags and their possible options.


    **TABLE 2.1** (#C_005_c2.xhtml#t2_1b) Summary of the Elements of the Structure
    from the imfilter Function


    | Options | Description |

    | --- | --- |

    | *Filter mode* | |

    | `corr` | Filtering is implemented by using correlation. This option is used
    by default. |

    | `conv` | Filtering is implemented by using convolution. |

    | *Border options* | |

    | `0` | The picture is completed by adding “zeros”. |

    | `replicate` | The image is completed by adding rows or columns that are equal
    to the border rows and columns of the image. It’s the default option. |

    | `symmetric` | The image is completed with rows and columns equal to those obtained
    by mirror projection of the rows and columns of the reflected image. |

    | `circular` | The image is completed with rows and columns equal to those obtained
    if the image is considered as a periodic signal, in such a way that the image
    is repeated above and below, on one side and on the other. |

    | *Result size* | |

    | `full` | The resulting filtered image is the size of the image with the columns
    and rows added at the borders to ensure pixel-coefficient correspondence. |

    | `same` | The result of the filtered image is the size of the original image.
    It’s the default option. |

