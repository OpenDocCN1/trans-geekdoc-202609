    为了节省时间，你可以使用图像处理工具箱中实现的函数，该函数允许你向图像添加不同类型的噪声。本节将仅解释如何针对特定类型的盐粒噪声进行此类操作。


    该函数的结构为：


    ```

    g=imnoise(f, ‘salt & pepper’, 0.2);

    ```


    其中，`f` 是你想要添加盐粒噪声的图像，`0.2` 是你想要污染的图像像素的百分比（即图像中将变为盐粒噪声的像素数量），例如，`0.2` 表示图像中 20%
    的像素将被污染。`g` 是接收被所配置噪声污染的图像的矩阵。


    ## 2.8 空间非线性滤波器


    使用线性滤波器对图像进行平滑和去除失真处理有一个巨大的缺点：图像中存在的结构（如点、边缘和线）也会受到退化（参见图 2.18）。这种效果无法通过使用线性滤波器系数的组合来避免。因此，如果你想在不影响图像中存在结构质量的情况下平滑图像，使用线性滤波器并不是一种可行的方案[9]]。本节介绍并解释了一种特殊的滤波器，它可以解决这个问题，至少以一种比线性滤波器更好的方式。非线性滤波器能够在消除噪声，而不会产生不良的失真影响。此类滤波器基于特征和属性非线性的操作。


    ![图 2.18 线性平滑退化了图像中的重要结构，例如边缘 (a) 或线 (b)。](img/Fig02_18.jpg)


    图 2.18 线性平滑退化了图像中的重要结构，例如边缘 (a) 或线 (b)。


    ### 2.8.1 最大滤波器和最小滤波器


    非线性滤波器像之前的滤波器一样，通过使用相对于原始图像 `R` 的特定区域来计算特定位置（`x`,`y`）的结果。最简单的非线性滤波器是最大滤波器和最小滤波器。最大滤波器和最小滤波器分别定义为：


    $\begin{array}{cl} {I^{\prime}\left( {x,y} \right)} & {= \min\left\{ {I\left(
    {x + i,y + j} \right)\text{|}}\left( {i,j} \right) \in R} \right\}\}} \\ & {=
    \text{min}\left( {R\left( {x,y} \right)} \right)} \\ \\ \end{array}$ (2.29)


    $\begin{array}{cl} {I^{\prime}\left( {x,y} \right)} & {= \text{max}\left\{ {I\left(
    {x + i,y + j} \right)\text{|}}\left( {i,j} \right) \in R} \right\}\}} \\ & {=
    \text{max}\left( {R\left( {x,y} \right)} \right)} \\ \\ \end{array}$


    其中，`R`(`x`,`y`) 表示由滤波器定义的相对于位置（`x`,`y`）的区域（大多数情况下，它是 3×3 的矩形）。图 2.19 显示了最小滤波器对不同结构的影响。如图所示，由于最小滤波的作用，图像的阶梯似乎向右移动，其偏移量等于滤波器定义的区域
    `R`(`x`,`y`)的宽度。另一方面，只要线的宽度小于滤波器定义的宽度，该线就会被滤波的作用消除。


    ![图 19 最小滤波器对图像中不同局部形状的影响。原始图像在上方，通过滤波器操作获得的结果在下方。A 值表示滤波器的宽度，这同时也定义了它所考虑的区域 R。图像
    (a) 中表示的阶梯由于应用滤波的作用，向右移动了 A 个单位。图像 (b) 中包含的线如果其宽度小于 A，则由于滤波的作用而消失。](img/Fig02_19.jpg)


    图 19 最小滤波器对图像中不同局部形状的影响。原始图像在上方，通过滤波器操作获得的结果在下方。A 值表示滤波器的宽度，这同时也定义了它所考虑的 `R`。图像
    (a) 中表示的阶梯由于应用滤波的作用，向右移动了 A 个单位。图像 (b) 中包含的线如果其宽度小于 A，则由于滤波的作用而消失。


    图 20 显示了最小滤波器和最大滤波器在人工污染盐粒噪声的强度图像上的应用。最小滤波器消除了图像中的白点，因为在操作过程中，它找到了滤波器定义的影响区域 `R`(`x`,`y`)的最小值，该区域以受污染的像素为中心，将其替换为邻居中找到的最小值。同样，具有最小值的像素只要其宽度小于滤波器定义的宽度，就会被滤波的作用消除。最大滤波器则效果相反。![图
    20 最大和最小滤波器。(a) 人工添加了盐粒噪声的图像，(b) 应用 3×3 最小滤波的结果，(c) 应用 3×3 最大滤波的结果。](img/Fig02_20.jpg)


    ### 2.8.2 中值滤波器


    显然，无法构建一种滤波器能够在消除图像中所有伪影或噪声的同时，完全不影响图像结构。无法区分哪些结构是重要的，哪些不是。中值滤波器是这一困境的一个很好的折中方案。


    线性滤波器引起的边缘模糊效应通常是不希望的。中值滤波器可以在消除图像伪影和意外结构而不显著影响边缘。中值滤波器属于一类特殊的统计滤波器，它们不仅是非线性的，而且基于某些统计类型的操作。


    在统计学中，中位数是一组数据的值，在其前后具有相同数量的元素。根据这个定义，小于或等于中值的集合占据数据的 50%，而大于中值的数据占据总数据的另外 50%。


    考虑到 `x[1]`、`x[2]`...`x[n]` 是按升序排列的总数据集，中值的定义如下：


    $M_{e} = x_{\frac{n + 1}{2}}$ (2.30)


    如果 `n` 是奇数，`M[e]` 将是数值按升或降序排列后的中心观测值。如果 `n` 是偶数，它将两个中心观测值的算术平均值，即：


    $M_{e} = \frac{x_{\frac{n}{2}} + x_{\frac{n + 1}{2}}}{2}$ (2.31)


    因此，可以说中值滤波器用滤波器定义的影响区域 `R`(`x`,`y`)内的强度值中位数来替换图像的每个像素。这可以表示为：


    $I^\prime(x,y) \��= $Me)$ (2.32)

    '
