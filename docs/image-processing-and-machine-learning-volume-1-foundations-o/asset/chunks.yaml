    ## 1.3 Histogram and Pixel Operations


    In some cases, the effects of pixel operations can be easily detected through
    the histogram. Histograms can be considered as a statistical index of the image.
    It is usually used as an element to assist in the evaluation of important properties
    of an image [#C_004_c1.xhtml#r1_4]. Especially, errors produced in image acquisition
    are easily recognized through the use of histograms. In addition to the ability
    to deal with problems mentioned above, it is also possible to pre-process the
    image based on the histogram to improve it or to highlight features of the image
    that will be extracted or analyzed in later processing (e.g., by considering a
    pattern system in the image).


    ### 1.3.1 Histogram


    Histograms are elements that describe the frequency at which the intensity values
    (pixels) of the image are distributed. In the simplest case, histograms are best
    understood when they describe the distribution of grayscale images. An example
    is shown in [Figure 1.7](#C_004_c1.xhtml#f1_7). For a grayscale image `I(u,v)`
    with intensities in the range [0,K-1] generate a histogram `H` with exactly `K`
    values. Therefore, for a typical 8-bit grayscale image, a histogram will use `H=256`.
    Each element of the histogram is defined as `h(i)`, corresponding to the number
    of pixels in the image with an intensity value `i`, for all values of `0 ≤ i <
    K`.


    ![FIGURE 1.7 (a) 8-bit intensity (grayscale) image and (b) its histogram.](images/Fig01_07.jpg)


