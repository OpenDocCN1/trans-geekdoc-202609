    ### 1.3.8 Histogram Linear Equalization


    A frequent problem is the adaptation of different images to the same distribution
    *h*[eq] of intensity levels, either to improve their print quality or to be able
    to compare them properly. Balancing a histogram means, by using a pixel operation,
    changing the image in such a way that it shows a histogram, as far as possible,
    distributed over all intensity levels (see [Figure 1.20](#C_004_c1.xhtml#f1_20)).
    Since we are dealing with discrete distributions, this is only possible at the
    approximation level because, as already discussed above, the homogeneous operations
    can only shift or merge groups of pixels belonging to a certain intensity level.
    However, once they are together, it is not possible to separate them. Therefore,
    it is not possible to remove the histogram peaks from the distribution. Under
    such conditions, it is not possible to produce, from the original histogram, an
    ideal histogram *h*[eq], where all gray levels are equally distributed. Instead
    of this, it is possible only to transform the image so that the histogram shows
    an approximation to the balanced distribution of gray levels. Such an approximation
    can be achieved by the cumulative histogram *H*(*i*). An important feature of
    this transformation is that a version of the cumulative histogram *H*[eq] represents
    a balanced (target) distribution. Obviously, as presented in the previous statement,
    this is only an approximation. However, it is possible in this way to use a pixel
    operation that shifts the histogram elements in such a way that the cumulative
    histogram of the image shows at least approximately an increasing linear function,
    as exemplified in [Figure 1.20](#C_004_c1.xhtml#f1_20).


    ![FIGURE 1.20 Representation of the equalization process of a histogram. Using
    a pixel operation on an image with the original histogram h(i), the idea is to
    obtain the histogram heq(i), the cumulative histogram H(i) and the balanced version
    represented by Heq(i) as the effect of the operation.](images/Fig01_20.jpg)


    [**FIGURE 1.20**](#C_004_c1.xhtml#f1_20b) Representation of the equalization process
    of a histogram. Using a pixel operation on an image with the original histogram
    *h*(*i*), the idea is to obtain the histogram *h*[eq](*i*), the cumulative histogram
    *H*(*i*) and the balanced version represented by *H*[eq](*i*) as the effect of
    the operation.


    The pixel operation *f*[eq](*p*) required to balance the histogram of an image
    is calculated from its cumulative histogram. For an image with a resolution *M* × *N*
    pixels in the range of \[0...*K*−1\] the operation can be defined as follows:


    $f\_{\\text{eq}}\\left( p \\right) = \\left\\lbrack {H\\left( p \\right) \\cdot
    \\frac{K - 1}{MN}} \\right\\rbrack$ (1.19)


    The function defined in Equation 1.13 presents a monotonical behavior because
    this function corresponds to the cumulative histogram experiments, a behavior
    in which it is constantly incremented. *H*(*p*) and the other parameters *K*,
    *M*,  and *N* are only constants. An image whose histogram is already well distributed
    over all its intensity levels would not represent any change when applying the
    pixel operation that balances the histogram. [Figure 1.21](#C_004_c1.xhtml#f1_21)
    shows the result on an image after having equalized its histogram linearly. It
    can be noted that for inactive pixels (those intensity values that do not exist
    in the original image), when they are considered in the cumulative histogram,
    the graph presents the same value as its previous neighbor value. For example,
    consider that there are no pixels in the original image of intensity level 10.
    Their value in the histogram will be *h*(10) = 0, but their value in the cumulative
    histogram will be *H*(10) = *H*(9). This, although it would seem to be a negative
    consequence of the pixel operation used to balance the histogram (Equation 1.11).
    As a consequence, intensity values that do not exist in the original image will
    not finally appear in the balanced image.


    ![FIGURE 1.21 Through the use of the correct pixel operation feq the intensity
    value p is shifted to p′ in such a way that it best approximates the cumulative
    target histogram Heq(i).](images/Fig01_21.jpg)


    [**FIGURE 1.21**](#C_004_c1.xhtml#f1_21b) Through the use of the correct pixel
    operation *f*[eq] the intensity value *p* is shifted to *p*′ in such a way that
    it best approximates the cumulative target histogram *H*[eq](*i*).


    $fdD\\left( i \\right) = \\frac{H\\left( i \\right)}{H\\left( {K - 1} \\right)}
