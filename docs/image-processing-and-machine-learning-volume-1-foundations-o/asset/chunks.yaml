    ### 3.3.2 Roberts 算子


    Roberts 算子是用于定位图像中边缘的最古老的滤波器之一[6]。在本节中将对其进行描述。该滤波器的特点是它非常小，仅使用 2×2 系数矩阵来确定沿其对角线的两个不同方向的梯度。该算子的定义如下：


    $H_{1}^{R} = \begin{bmatrix} 0 & 1 \\ {- 1} & 0 \\ \end{bmatrix}\quad H_{2}^{R}
    = \begin{bmatrix} {- 1} & 0 \\ 0 & 1 \\ \end{bmatrix}$ (3.16)


