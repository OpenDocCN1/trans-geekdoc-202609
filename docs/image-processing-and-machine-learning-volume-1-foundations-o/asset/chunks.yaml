    0}{\\overset{i}{\\Sigma}}\\frac{h\\left( j \\right)}{\\text{Sum}\\left( h \\right)}
    = \\underset{j = 0}{\\overset{i}{\\Sigma}}\\text{hN}\\left( i \\right)$


    0 ≤ *i* < *K* (1.20)


    The function *f**d**D*(*i*) is, like the cumulative histogram, monotonically increasing,
