    ### 3.4.3 Use of MATLAB for the Laplacian


    In this section, the use of MATLAB to improve the sharpness is described. The
    Laplacian filter can be divided into two steps: first, the Laplacian is calculated,
    and second, it is used to enhance the original image.


    [Figure 3.17](#C_006_c3.xhtml#f3_17) shows the results of the Laplacian filter
    in MATLAB. The first step is to calculate the Laplacian of the image:


    ```matlab

    L = laplacian(double(I));

    ```


    The second step is to enhance the image:


    ```matlab

    I_enhanced = I - w * L;

    ```


    [FIGURE 3.17](#C_006_c3.xhtml#f3_17b) Results of the Laplacian filter in MATLAB.


    ### 3.4.4 The Canny Filter


    A well-known method for detecting edges in images is the Canny filter [[2](#C_006_c3.xhtml#r3_2)].
    This method is based on the application of a series of filters in different directions
    and resolutions, which are finally combined into a single result. The method aims
    to achieve three different objectives: (a) to minimize the number of false edges,
    (b) to improve the location of edges in the image, and (c) to deliver an image
    whose edge width is only one pixel. The Canny filter is essentially a filter based
    on gradient methods, but, however, it also uses the second derivative, or Laplacian,
    as a criterion for edge location. Most of the time, this algorithm is used in
    its simple form, that is, setting the smoothing parameter `σ`.


    ![FIGURE 3.18 Canny’s algorithm applied to an image. (a) Original image, (b) image
    edges with \sigma = 2, (c) image edges with \sigma = 4, and (d) image edges with
    \sigma = 6.](images/Fig03_18.jpg)


    [FIGURE 3.18](#C_006_c3.xhtml#f3_18b) Canny’s algorithm applied to an image. (a)
    Original image, (b) image edges with `σ = 2`, (c) image edges with `σ = 4`, and
    (d) image edges with `σ = 6`.


