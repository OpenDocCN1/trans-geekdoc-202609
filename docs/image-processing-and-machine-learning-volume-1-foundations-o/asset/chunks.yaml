    ![图 3.2 从图像的水平轮廓获得的一维情况的一阶导数。原始图像 (a) 和从图像中获得的水平轮廓的导数 (b)。](img/Fig03_02.jpg)


    图 3.2 从图像的水平轮廓获得的一维情况的一阶导数。原始图像 (a) 和从图像中获得的水平轮廓的导数 (b)。


    沿用沿图像中某条线的灰度轮廓可能如 图 3.2b 所示。我们将这个一维信号定义为 `f`(`u`)`。它的一阶导数定义如下：


    $f^{\prime}\left( u \right) = \frac{df}{du}\left( u \right)$ (3.1)


    因此，在强度增加的地方都会产生正向的提升，在强度减少的地方产生负向的提升。然而，导数对于像 `f`(`u`)` 这样的离散函数是未定义的，因此我们需要一种方法来计算它。


    众，函数在点 `x` 处的导数可以通过该特定点的切线斜率来解释。然而，对于离散函数，点 `u` 处的导数（该点的切线斜率）可以通过相邻点 `u` 之间的差值除以两点之间的距离值计算出来
    [3]，请参见 图 3.3。因此，导数可以近似如下：


    ![图 3.3 离散函数的一阶导数计算。通过相邻点 f\left( {u - 1} \right) 和 f\left( {u + 1} \right) 的直线斜率被用作计算
    f\left( u \right) 处切线斜率的间接方法。](img/Fig03_03.jpg)


    图 3.3 离散函数的一阶导数计算。通过相邻点 `f`(`u`−1) 和 `f`(`u`+1) 的直线斜率被用作计算 `f`(`u`)` 处切线斜率的间接方法。


    $\frac{df}{du}\left( u \right) \approx \frac{f\left( {u + 1} \right) - f\left(
    {u - 1} \right)}{2} = 0.5 \cdot \left( {f\left( {u + 1} \right) - f\left( {u -
    1} \right)} \right)$ (3.2)


    同样的过程也可以适用于图像列的垂直方向。


    ### 3.2.1 偏导数与梯度


    偏导数可以被认为是多维函数沿坐标轴的导数（关于其中一个函数变量），例如：


    $\frac{\partial I\left( {x,y} \right)}{\partial x}\text{and}\frac{\partial I\left(
    {x,y} \right)}{\partial y}$ (3.3)


    图像函数 `I`(`u`,`v`)` 关于变量 `u` 或 `v` 的偏导数可以定义为以下向量：


    $\nabla I\left( {x,y} \right) = \begin{bmatrix} \frac{\partial I\left( {x,y} \right)}{\partial
    x}\\ \frac{\partial I\left( {x,y} \right)}{\partial y}\end{bmatrix}$ (3.4)


    这种公式表示了函数 `I` 的梯度向量。该公式表示了 `I`(`x,y`)` 梯度的值：


    $|\nabla I\left( {x,y} \right)| = \sqrt{\left(\frac{\partial I\left( {x,y} \right)}{\partial
    x}\right)² + \left(\frac{\partial I\left( {x,y} \right)}{\partial y}\right)²}$
    (3.5)


    梯度值对图像的方向是敏感的，因此。


    ### 3.2.2 梯度


    对于图像中，用于定位边缘的梯度 `I`(`x,y`)` 方向是分量。根据 图 3.2 和 图 3.3，对于图像中，梯度分量是：


    $\nabla I\left( {x,y} \right) = \begin{bmatrix} \frac{\partial I\left( {x,y} \right)}{\partial
    x}\\ \frac{\partial I\left( {x,y} \right)}{\partial y}\end{bmatrix}$ (3.4)


    同样的过程也可以适用于图像列的垂直方向。


