    the corner points found in the image. [Figure 5.3](#C_008_c5.xhtml#f5_3) shows
    the process of finding the maximum value within the considered neighborhood around
    the point in question.


    Once the points are stored in *S*(*x*,*y*), they are plotted. To carry out this
    process, the image is first displayed using the well-known display function used
    by MATLAB: imshow. Then, using the hold on command, the image is maintained, and
    the points are drawn on it one by one using the plot command, placing a plus sign
