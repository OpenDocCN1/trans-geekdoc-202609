    that are used in a given image, or, in short, the difference between the maximum
    and minimum intensity values of the pixels present in the image. A full contrast
    image uses the full range of intensity levels defined for the image from 0 to
    *K* − 1 (black to white). It is, therefore, easy to observe the contrast of an
    image using a histogram. [Figure 1.11](#C_004_c1.xhtml#f1_11) shows different
    contrast settings in images from the histograms produced.


    ![FIGURE 1.11 The figures show different contrasts in images and their respective
    effects on the histogram. (a) Normal contrast and its histogram (c); and (b) low
    contrast and its histogram (d).](images/Fig01_11.jpg)


    [**FIGURE 1.11**](#C_004_c1.xhtml#f1_11b) The figures show different contrasts
    in images and their respective effects on the histogram. (a) Normal contrast and
    its histogram (c); and (b) low contrast and its histogram (d).


    #### 1.3.2.3 Dynamics


    Under the term dynamics, we understand the number of different pixels that are
    used in the image. The ideal case in an image is presented when the full range
    of available intensity values *K* is used for the image in question. In this case,
    the whole region of intensity values is covered completely. An image that covers
    a region of intensity values smaller than the full one (*a*[min]\=0,*a*[max]\=*K*−1)
    so that:


    *a*[min] > 0 or *a*[max] < *K* − 1 (1.9)


    It produces an image with poor dynamic. It is considered poor since an appropriated
    dynamic reaches its maximum when all intensity values in that range are present
    in the image ([Figure 1.12](#C_004_c1.xhtml#f1_12)).


    ![FIGURE 1.12 Different dynamics in an image and their effects on the histogram.
    (a) High dynamics, (b) low dynamics with 20 intensity levels, (c) very low dynamics
    with only 8 intensity levels, (d) histogram of (a), (e) histogram of (b), and
    (f) histogram of (c).](images/Fig01_12.jpg)


    [**FIGURE 1.12**](#C_004_c1.xhtml#f1_12b) Different dynamics in an image and their
    effects on the histogram. (a) High dynamics, (b) low dynamics with 20 intensity
    levels, (c) very low dynamics with only 8 intensity levels, (d) histogram of (a),
    (e) histogram of (b), and (f) histogram of (c).


    While the contrast of an image can be high as long as the maximum value of the
    pixel intensity range is not exceeded, the dynamics of an image cannot be high
    (except by interpolation of the pixel intensity values). High dynamics represent
    an advantage for an image because the risk of losing image quality through the
    following processing steps is reduced. For this reason, digital cameras and professional
    scanners have a resolution higher than 8 bits, usually 12–14 bits, even if the
    image display elements have a normal resolution of 256.


    ### 1.3.3 Calculating the Histogram of an Image with MATLAB


    This section explains MATLAB functions that can be used to calculate and display
    the histogram of an image contained in the Image Processing Toolbox \[[5](#C_004_c1.xhtml#r1_5)\].


    #### 1.3.3.1 MATLAB Command Line Function


    The function of the image processing toolbox for calculating the histogram of
    an image has the following format:


    ```

    [counts,x]=imhist(I, n)

    ```


    This function calculates and displays the histogram of the `I` image. The number
    of histogram values if `n` is not specified depends on the type of image involved.
    If `I` corresponds to a grayscale image, the function will use 256 values for
    the calculation and display. If `I` represents a binary image, the function will
    calculate the histogram with only two values.


    If `n` is specified, the histogram is calculated and displayed using n intensity
    values instead of those specified by the image type. The variable `counts` symbolizes
    a vector that contains the number of pixels.


    ### 1.3.4 Color Image Histograms


    Histograms of color images refer to brightness histograms. They are obtained over
    the planes from the color image, considering each plane as if it were an independent
    grayscale image.


    #### 1.3.4.1 Brightness Histograms


    The brightness histogram of an image is nothing more than the histogram of the
    corresponding grayscale version of the color image. Since the grayscale images
    are extracted from the color image, they represent the histograms of the different
    planes that compose it. [Figure 1.13](#C_004_c1.xhtml#f1_13) shows the luminosity
    histogram of a color image.


    ![FIGURE 1.13 Brightness histogram of a single plane from a color image. (a) Color
    image, (b) its grayscale version (luminance image), and (c) the corresponding
    histogram of (b).](images/Fig01_13.jpg)


    [**FIGURE 1.13**](#C_004_c1.xhtml#f1_13b) Brightness histogram of a single plane
    from a color image. (a) Color image, (b) its grayscale version (luminance image),
    and (c) the corresponding histogram of (b).


    #### 1.3.4.2 Color Component Histograms


    Although the luminance histogram considers all color components, it is possible
    that errors may not be detected in the image. The luminance histogram may appear
    adequate, even though some color planes are inconsistent.


    The histograms of each channel also give additional information on the color distribution
    in the image. For example, the blue channel (B) usually has a small contribution
    to the total luminance of the color image. To calculate the color component histograms,
    each color channel is considered an independent grayscale image from which each
    histogram is generated. [Figure 1.14](#C_004_c1.xhtml#f1_14) shows the luminance
    histogram *h*[LUM] and the histograms of each of the different color planes *h*[R],
    *h*[G] y *h*[B] for a typical RGB image.


    ![FIGURE 1.14 Histograms of the components from a color image. (a) Original RGB
    image, (b) histogram of Luminosity (hLUM), (c) histogram of the red channel (hR),
    (d) histogram of the green channel (hG), and (e) histogram of the blue channel
    (hB),](images/Fig01_14.jpg)


    [**FIGURE 1.14**](#C_004_c1.xhtml#f1_14b) Histograms of the components from a
    color image. (a) Original RGB image, (b) histogram of Luminosity (*h*[LUM]), (c)
    histogram of the red channel (*h[R]*), (d) histogram of the green channel (*h[G]*),
    and (e) histogram of the blue channel (*h[B]*),


    ### 1.3.5 Effects of Pixel Operations on Histograms


    An increase in the illumination (to add a positive constant to all pixel values)
    of an image causes its histogram to be shifted to the right side so that the values
    will tend to approach the upper limit of the allowed dynamic range (to intensity
    values of 255). On the other hand, an increase in the contrast of some images
    causes the respective histogram to extend its values within the interval of intensities
    (0–255). The complement operation on an image or inversion provokes the histogram
    to reflect itself, but in the opposite direction from its original position. Although
    the above cases seem straightforward (even trivial), it might be useful to discuss
    in detail the relationships between pixel operations and the histograms resulting
    from such operations.


    [Figure 1.15](#C_004_c1.xhtml#f1_15) illustrates the way in which each region
    of the image with a homogeneous intensity *i* belongs to element *i* in the histogram.
    This element *i* corresponds to all pixels having an intensity value of *i*.


    ![FIGURE 1.15 Histogram values corresponding to a different set of pixels in the
    image. If a histogram element is shifted as a consequence of an operation, then
    all pixels of the corresponding set will also be modified in the same way. When
    two histogram elements h(p1) y h(p2) are joined together, their corresponding
    sets of pixels are also added together and are now non-separable.](images/Fig01_15.jpg)'
