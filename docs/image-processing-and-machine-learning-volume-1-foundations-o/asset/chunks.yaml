- raw: "The `houghlines` function extracts the lines associated with the `BW` image\
    \ calculated by the Hough Transform, implemented from the combination of the `hough`\
    \ and `houghpeaks` functions. The syntax of this function is defined by:\n\n```\n\
    lines = houghlines(BW, theta, rho, peaks);\n```\n\nwhere `BW` is the binary image\
    \ in which the lines were detected through the Hough Transform, `theta` and `rho`\
    \ are the vectors that define the way in which the accumulating records matrix\
    \ was linearly divided and, at the same time, both calculated by the function\
    \ `hough`. On the other hand, `peaks` is a matrix that was calculated by the `houghpeaks`\
    \ function of dimension *Q* × 2, where *Q* is the number of lines detected and\
    \ 2 are the indices corresponding to the parameters *r* and *θ*.\n\nThe `houghlines\
    \ ` function returns, as a result, an array of structures called `lines`. A structure\
    \ is a grouping of data of different types under the same name. These data are\
    \ called fields and are accessed using the format:\n\n```\nName_of_the_structure.field1=3;\n\
    ```\n\nSo, in the example above, field1, part of the structure `Name_of_the_structure`\
    \ was assigned the value of 3. An array of structures is a set of index-driven\
    \ structures that can be accessed using the format\n\n```\nName_of_the_structure(1).field1=3;\n\
    ```\n\nwhere the value in parentheses refers to a structure identified by index\
    \ 1.\n\nThe fields that the `lines` structure has are `point1`, `point2`, `theta`,\
    \ and `rho`. Their meanings are summarized in Table 6.2.\n\n### 6.5.1 Example\
    \ of Line Detection Using MATLAB Functions\n\nAt the end of this section, an example\
    \ is established that integrates the way in which the functions of the MATLAB\
    \ image processing toolbox, described above, are used for the detection of lines\
    \ in an image.\n\nConsidering as image `Im` to which it is desired to extract\
    \ its lines as the one shown in [Figure 6.12a](#C_009_c6.xhtml#f6_12), its edges\
    \ are extracted by applying the function:\n\n![FIGURE 6.12 Detected lines by using\
    \ the Hough transform method. (a) original image and (b) detected lines.](images/Fig06_12.jpg)\n\
    \n[**FIGURE 6.12**](#C_009_c6.xhtml#f6_12b) Detected lines by using the Hough\
    \ transform method. (a) original image and (b) detected lines.\n\n```\nBW = edge(Im,’canny’,0.1,0.1);\n\
    ```\n\nResulting in image 6.12b. In this image, the Hough transform is applied\
    \ by executing the function:\n\n```\n[H, theta, rho] = hough(BW);\n```\n\nTo be\
    \ able to graph the array of accumulation registers `H`, we will first have to\
    \ convert this array from type `double` to type `uint8`, writing:\n\n```\nHu=uint8(H);\n\
    ```\n\nto then make the graph by executing the following sequence:\n\n```\nimshow(Hu,[],’XData’,theta,’YData’,rho,’InitialMagnification’,’fit’);\n\
    ```\n\nwhere the values of the `‘XData’` and `‘YData’` parameters replace the\
    \ normal indices of the `Hu` matrix and the combination of the `‘InitialMagnification’`\
    \ and `‘fit’` parameters allow the full-scale image of the window containing the\
    \ graph to be displayed. The result is shown in [Figure 6.13](#C_009_c6.xhtml#f6_13).\
    \ You can also improve the deployment by using the command:\n\n![FIGURE 6.13 The\
    \ matrix of the accumulator records of the Hough parameter space corresponding\
    \ to the original image of Figure 6.12(a)](images/Fig06_13.jpg)\n\n[**FIGURE 6.13**](#C_009_c6.xhtml#f6_13b)\
    \ The matrix of the accumulator records of the Hough parameter space corresponding\
    \ to the original image of [Figure 6.12(a)](#C_009_c6.xhtml#f6_12)\n\n```\naxis\
    \ on, axis normal\n```\n\nby applying the function:\n\n```\nP = houghpeaks(H,8,’threshold’,ceil(0.3*max(H(:))));\n\
    ```\n\nAt most, the 8 points with the highest value of the accumulation record\
    \ matrix `H` are obtained, considering 30% of the maximum value found as the threshold.\
    \ In order to display the maximum points found in the accumulation matrix, the\
    \ following command sequence is executed:\n\n```\nhold on\nx = theta(P(:,2));\n\
    y = rho(P(:,1));\nplot(x,y,’s’);\n```\n\nwhich allows retaining the image to place\
    \ objects on it and obtain the vectors of the `x` and `y` coordinates of the maximum\
    \ points. The image obtained by the previous sequence is shown in [Figure 6.13](#C_009_c6.xhtml#f6_13).\n\
    \nLastly, the lines corresponding to those of the parameters found by means of\
    \ the `houghlines` function are obtained. However, since placing all the found\
    \ line segments presupposes doing so by a repeat method, an .m file is programmed\
    \ that allows finding the line segments and displaying the lines one by one on\
    \ the `BW` border image. The .m file is shown encoded in [Program 6.2](#C_009_c6.xhtml#p6_2)\
    \ ([Figure 6.14](#C_009_c6.xhtml#f6_14)).\n\n![FIGURE 6.14 Image of edges, on\
    \ which the line segments found by the combination of the hough, houghpeaks, and\
    \ houghlines functions are placed. For the display of the lines, the code shown\
    \ in Program 6.2 was used.](images/Fig06_14.jpg)\n\n[**FIGURE 6.14**](#C_009_c6.xhtml#f6_14b)\
    \ Image of edges, on which the line segments found by the combination of the hough,\
    \ houghpeaks, and houghlines functions are placed. For the display of the lines,\
    \ the code shown in [Program 6.2](#C_009_c6.xhtml#p6_2) was used.\n\n## References\n\
    \n1.  [Duan](#C_009_c6.xhtml#r6_1b), D., Xie, M., Mo, Q., Han, Z., & Wan, Y. (2010).\
    \ An improved Hough transform for line detection. In 2010 International Conference\
    \ on Computer Application and System Modeling (ICCASM 2010) (Vol. 2, pp. V2–354).\
    \ IEEE.\n\n2.  [Illingworth](#C_009_c6.xhtml#r6_2b), J., & Kittler, J. (1988).\
    \ A survey of the Hough transform. *Computer vision, graphics, and image processing*,\
    \ 44(1), 87–116.\n\n3.  [Kiryati](#C_009_c6.xhtml#r6_3b), N., Eldar, Y., & Bruckstein,\
    \ A. M. (1991). A probabilistic Hough transform. *Pattern Recognition*, 24(4),\
    \ 303–316.\n\n4.  [Ballard](#C_009_c6.xhtml#r6_4b), D. H. (1981). Generalizing\
    \ the Hough transform to detect arbitrary shapes. *Pattern Recognition*, 13(2),\
    \ 111–122.\n\n5.  [Hassanein](#C_009_c6.xhtml#r6_5b), A. S., Mohammad, S., Sameer,\
    \ M., & Ragab, M. E. (2015). *A survey on Hough transform, theory, techniques\
    \ and applications*. arXiv preprint arXiv:1502.02160.\n\n6.  [Russ](#C_009_c6.xhtml#r6_6b),\
    \ J. C. (2011). *The image processing handbook* (6th ed.). CRC Press.\n\n7.  [McAndrew](#C_009_c6.xhtml#r6_7b),\
    \ A. (2017). *Introduction to digital image processing with MATLAB*. CRC Press.\
    \ \n\n# *Index*\n\n*   accumulation records matrix [*187*](#C_009_c6.xhtml#f6_5),\
    \ [187](#C_009_c6.xhtml#p187), [*188*](#C_009_c6.xhtml#f6_6)\n\n*   algorithm,\
    \ labeling [130–132](#C_007_c4.xhtml#p130)\n\n*   alpha blending operation [33](#C_004_c1.xhtml#p33),\
    \ [*34*](#C_004_c1.xhtml#f1_30)\n\n*   Beaudet detector [173–174](#C_008_c5.xhtml#p173),\
    \ [*182*](#C_008_c5.xhtml#f5_10) \n\n    *   location of corner points [*176*](#C_008_c5.xhtml#f5_7)\n\
    \n    *   MATLAB, implementation in [174–175](#C_008_c5.xhtml#p174)\n\n*   binary\
