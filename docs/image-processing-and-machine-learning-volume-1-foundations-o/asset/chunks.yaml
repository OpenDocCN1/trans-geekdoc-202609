    ![FIGURE 3.15 通过应用二阶导数的锐化。通过从函数的二阶导数减去一个因子，可以最大化图像中边缘的存在。](img/Fig03_15.jpg)


    FIGURE 3.15 通过应用二阶导数的锐化。通过从函数的二阶导数减去一个因子，可以最大化图像中边缘的存在。


    为了提高图像锐度的目标，可以通过使边缘更加明显来实现。为了方便解释，该图仅考虑了一维情况。


