    \n[FIGURE 6.12](#C_009_c6.xhtml#f6_12b) Detected lines by using the Hough transform\
    \ method. (a) original image and (b) detected lines.\n\n```\nBW = edge(Im,’canny’,0.1,0.1);\n\
    ```\n\nResulting in image 6.12b. In this image, the Hough transform is applied\
    \ by executing the function:\n\n```\n[H, theta, rho] = hough(BW);\n```\n\nTo be\
    \ able to graph the array of accumulation registers `H`, we will first have to\
    \ convert this array from type `double` to type `uint8`, writing:\n\n```\nHu=uint8(H);\n\
    ```\n\nto then make the graph by executing the following sequence:\n\n```\nimshow(Hu,[],’XData’,theta,’YData’,rho,’InitialMagnification’,’fit’);\n\
    ```\n\nwhere the values of the `‘XData’` and `‘YData’` parameters replace the\
    \ normal indices of the `Hu` matrix and the combination of the `‘InitialMagnification’`\
    \ and `‘fit’` parameters allow the full-scale image of the window containing the\
    \ graph to be displayed. The result is shown in [Figure 6.13](#C_009_c6.xhtml#f6_13).\
    \ You can also improve the deployment by using the command:\n\n![FIGURE 6.13 The\
    \ matrix of the accumulator records of the Hough parameter space corresponding\
    \ to the original image of Figure 6.12(a)](images/Fig06_13.jpg)\n\n[FIGURE 6.13](#C_009_c6.xhtml#f6_13b)\
    \ The matrix of the accumulator records of the Hough parameter space corresponding\
    \ to the original image of [Figure 6.12(a)](#C_009_c6.xhtml#f6_12)\n\n```\naxis\
    \ on, axis normal\n```\n\nby applying the function:\n\n```\nP = houghpeaks(H,8,’threshold’,ceil(0.3*max(H(:))));\n\
    ```\n\nAt most, the 8 points with the highest value of the accumulation record\
    \ matrix `H` are obtained, considering 30% of the maximum value found as the threshold.\
    \ In order to display the maximum points found in the accumulation matrix, the\
    \ following command sequence is executed:\n\n```\nhold on\nx = theta(P(:,2));\n\
    y = rho(P(:,1));\nplot(x,y,’s’);\n```\n\nwhich allows retaining the image to place\
    \ objects on it and obtain the vectors of the `x` and `y` coordinates of the maximum\
    \ points. The image obtained by the previous sequence is shown in [Figure 6.13](#C_009_c6.xhtml#f6_13).\n\
    \nLastly, the lines corresponding to those of the parameters found by means of\
    \ the `houghlines` function are obtained. However, since placing all the found\
    \ line segments presupposes doing so by a repeat method, an .m file is programmed\
    \ that allows finding the line segments and displaying the lines one by one on\
    \ the `BW` border image. The .m file is shown encoded in [Program 6.2](#C_009_c6.xhtml#p6_2)\
    \ ([Figure 6.14](#C_009_c6.xhtml#f6_14)).\n\n![FIGURE 6.14 Image of edges, on\
    \ which the line segments found by the combination of the `hough`, `houghpeaks`,\
    \ and `houghlines` are placed. For the display of the lines, the code shown in\
    \ Program 6.2.](images/Fig06_14.jpg)\n\n[FIGURE 6.14](#C_009_c6.xhtml#f6_14b)\
    \ Image of edges, on which the line segments found by the combination of `hough`,\
    \ `houghpeaks`, and `houghlines` are placed. For the display of the lines, the\
    \ code shown in [Program 6.2](#C_009_c6.xhtml#p6_2).\n\n## References\n\n1. [Duan](#C_009_c6.xhtml#r6_b),\
    \ Xie, M., Mo, Q., & Wan, Y. (2010). An improved Hough transform for line detection.\
    \ In 2010 International Conference on Application and System Modeling (ICASM)\
    \ (Vol. 2, pp. V2–354). IEEE.\n2. [Illingworth](#C_009_c6.xhtml#r6_2b), Kittler,\
    \ J. (1988). A survey of the Hough transform. Computer vision, graphics, and image\
    \ processing, 44(1), 87–116.\n3. [Kiryati](#C_009_c6.xhtml#r6_3b), Eldar, Y.,\
    \ & Bruckstein, A. M. (1991). A probabilistic Hough transform. Pattern Recognition,\
    \ 24(4), 303–316.\n4. [Ballard](#C_009_c6.xhtml#r6_4b), D. H. (1981). Generalizing\
    \ the Hough transform to detect arbitrary shapes. Pattern Recognition, 13(2),\
    \ 111–122.\n5. [Hassane](#C_009_c6.xhtml#r6_5b), A. S., Sameer, M., & Ragab, M.\
    \ E. (2015). A survey on Hough transform, techniques and applications. arXiv preprint\
    \ arXiv:1502.0260.\n6. [Russ](#C_009_c6.xhtml#r6_6b), J. C. (2011). The image\
    \ processing handbook (6th ed.). CRC Press.\n7. [McAndrew](#C_009_c6.xhtml#r6_7b),\
    \ A. (2017). Introduction to digital image processing with MATLAB. CRC Press.\n\
    \n## Index\n\n*   accumulation records matrix [187](#C_009_c6.xhtml#f6_5), [187](#C_009_c6.xhtml#p187),\
    \ [188](#C_009_c6.xhtml#f6_6)\n*   algorithm, labeling [130–132](#C_007_c4.xhtml#p130)\n\
    *   alpha blending operation [33](#C_009_c1.xhtml#p33), [34](#C_009_c1.xhtml#f1_30)\n\
    *   Beaudet detector [173–174](#C_009_c6.xhtml#p173), [182](#C_009_c6.xhtml#f5_10)\n\
    \    *   location of corner points [176](#C_009_c6.xhtml#f5_7)\n    *   MATLAB,\
    \ implementation in [174–175](#C_009_c6.xhtml#p174)\n*   binary filter [80–87](#C_005_c2.xhtml#p80)\n\
    \    *   image used to exemplify operation [80](#C_005_c2.xhtml#f2_36)\n    *\
    \   MATLAB, implementation in [82–87](#C_005_c2.xhtml#p82)\n    *   operation\
    \ [80](#C_005_c2.xhtml#f2_36)\n    *   processing window used [80](#C_005_c2.xhtml#f2_36)\n\
    \    *   rebuild_black_corners function [85–87](#C_005_c2.xhtml#p85)\n    *  \
    \ rebuild_white_corners function [84–85](#C_005_c2.xhtml#p84)\n    *   remove_black_noise\
    \ function [82](#C_005_c2.xhtml#p82)\n    *   remove_white_point_noise function\
    \ [83](#C_005_c2.xhtml#p83)\n*   binary images\n    *   features of objects [156–158](#C_007_c4.xhtml#p156)\n\
    \    *   labeling of objects [129–138](#C_007_c4.xhtml#indx-term21)\n    *   object\
    \ borders in [138–151](#C_007_c4.xhtml#indx-term22)\n    *   optimal threshold\
    \ [119](#C_007_c4.xhtml#p119)\n    *   Otsu algorithm [120–123](#C_007_c4.xhtml#p120)\n\
    \    *   representation of objects [151–155](#C_007_c4.xhtml#p151)\n    *   segmentation\
    \ [114–115](#C_007_c4.xhtml#p114)\n    *   thresholding [116–118](#C_007_c4.xhtml#p116)\n\
    *   Boolean equations [80](#C_005_c2.xhtml#indx-term28)\n*   bounding box [158](#C_007_c4.xhtml#p158)\n\
    *   box filter [44](#C_005_c2.xhtml#p44), [44](#C_005_c2.xhtml#f2_8)\n"
  trans: "\n\n`houghlines` 函数提取通过霍夫变换（Hough Transform）计算出的与 `BW` 图像相关的线条，该函数通过 `hough`\
    \ 和 `houghpeaks` 函数组合实现。该函数的定义如下：\n\n```\nlines = houghlines(BW, theta, rho, peaks);\n\
    ```\n\n其中，`BW` 是通过霍夫变换检测到线条的二值图像，`theta` 和 `rho` 是定义累加记录矩阵线性划分方式的向量，且这两者都由函数 `hough`\
    \ 计算。另一方面，`peaks` 是一个由 `houghpeaks` 函数计算的维度为 `Q` × 2 的矩阵，其中 `Q` 是检测到的线条数，2 分别对应于参数\
    \ `r` 和 `θ` 的索引。\n\n`houghlines` 函数返回的结果是一个名为 `lines` 的结构体数组。结构体是在相同名称对不同类型数据的分组。这些数据被称为字段（fields），并使用以下格式访问：\n\
    \n```\nName_of_the_structure.field1=3;\n```\n\n因此，在上面的示例中，结构体 `Name_of_the_structure`\
    \ 的一部分 `field1` 被赋值为 3。结构体数组是一组索引驱动的结构体，可以使用格式访问：\n\n```\nName_of_the_structure(1).field1=3;\n\
    ```\n\n其中括号中的值指的是索引为 1 的结构体。\n\n`lines` 结构体拥有的字段有 `point1`、`point2`、`theta` 和\
    \ `rho`。它们的含义总结在表 6.2 中。\n\n### 6.5.1 使用 MATLAB 函数进行线条检测的示例\n\n在本节最后，建立了一个示例，整合了如何使用上述\
    \ MATLAB 图像处理工具箱函数来检测图像中的线条。\n\n假设图像 `Im` 需要提取如图 6.12a 所示的线条，通过应用函数提取其边缘：\n\n\
    ![图 6.12 使用霍夫变换方法检测到的线条。(a) 原始图像和 (b) 检测到的线条。](img/Fig06_12.jpg)\n\n图 6.12 使用霍夫变换方法检测到的线条。(a)\
    \ 原始图像和 (b) 检测到的线条。\n\n```\nBW = edge(Im,’canny’,0.1,0.1);\n```\n\n生成图像 6.12b。在此图像中，通过执行函数应用霍夫变换：\n\
    \n```\n[H, theta, rho] = hough(BW);\n```\n\n为了能够绘制累加寄存器数组 `H`，我们首先需要将该数组从 `double`\
    \ 类型转换为 `uint8` 类型，写入：\n\n```\nHu=uint8(H);\n```\n\n然后执行以下序列制作图形：\n\n```\nimshow(Hu,[],’XData’,theta,’YData’,rho,’InitialMagnification’,’fit’);\n\
    ```\n\n其中参数 `XData` 和 `YData` 的值替换了 `Hu` 矩阵的普通索引，`InitialMagnification` 和 `fit`\
    \ 参数的组合允许显示包含图表的全比例图像。结果所示图 6.13。你也可以通过使用命令改进部署：\n\n![图 6.13 对应于图 6.12(a) 原始图像的霍夫参数空间累加记录矩阵](img/Fig06_13.jpg)\n\
    \n图 6.13 对应于图 6.12(a) 原始图像的霍夫参数空间累加记录矩阵\n\n```\naxis on, axis normal\n```\n\n\
    通过应用函数：\n\n```\nP = houghpeaks(H,8,’threshold’,ceil(0.3*max(H(:))));\n```\n\n\
    最多获得累加记录矩阵 `H` 中值最高的 8 个点，考虑将找到的最大值的 30% 作为阈值。为了显示累加矩阵中找到的最大点，执行以下命令序列：\n\n```\n\
    hold on\nx = theta(P(:,2));\ny = rho(P(:,1));\nplot(x,y,’s’);\n```\n\n这允许保留图像以便在其上方放置对象，并获得最大点的\
    \ `x` 和 `y` 坐标向量。上一个序列获得的图像所示图 6.13。\n\n最后，获取通过 `houghlines` 函数找到的参数对应的线条。然而，由于放置所有找到的线段假设通过重复方法进行，因此编写了一个\
    \ .m 文件，允许查找线段并逐个在 `BW` 边界图像上显示线条。该 .m 文件编码显示在程序 6.2（图 6.14）]。\n\n![图 6.14 通过\
    \ `hough`、`houghpeaks` 和 `houghlines` 组合找到的边缘线段。程序 6.2 中所示的代码](img/Fig06_14.jpg)\n\
    \n图 6.14 通过 `hough`、`houghpeaks` 和 `houghlines` 组合找到的边缘线段。程序 6.2 中所示的代码](#C_009_c6.xhtml#p6_2)\n\
    \n## 参考文献\n\n1. Duan, Xie, M., Mo, Q., & Wan, Y. (2010). 改进的霍夫变换。2010 年应用与系统建模国际会议(ICASM)(Vol.\
    \ 2, pp. V2–354). IEEE.\n2. Illingworth, Kittler, J. (1988). 霍夫变换述。计算机视觉、图形与图像处理,\
    \ 44(1), 87–116.\n3. Kiryati, Eldar, Y., & Bruckstein, A. M. (1991). 概率霍夫变换。模式识别,\
    \ 24(4), 303–316.\n4. Ballard, D. H. (1981). 用于检测任意形状的霍夫变换。模式识别, 13(2), 111–122.\n\
    5. Hassane, A. S., Sameer, M., & Ragab, M. E. (2015). 霍夫变换技术与应用述。arXiv preprint:1502.0260.\n\
    6. Russ, J. C. (2011). 图像处理手册(6 版).CRC Press.\n7. McAndrew, A. (2017). MATLAB\
    \ 数字图像处理导论。CRC Press.\n\n## 索引\n\n*   累加记录矩阵 187, 187, 188\n*   算法，标记 130–132\n\
    *   alpha 混合操作 33, 34\n*   Beaudet 检测器 173–174, 182\n    *   角点位置 176\n    * \
    \  MATLAB，实现 174–175\n*   二值滤波器 80–87\n    *   用于示例操作的图像 80\n    *   MATLAB，实现\
    \ 82–87\n    *   操作 80\n    *   使用的处理窗口 80\n    *   rebuild_black_corners 函数 85–87\n\
    \    *   rebuild_white_corners 函数 84–85\n    *   remove_black_noise 函数 82\n  \
    \  *   remove_white_point_noise 函数 83\n*   二值图像\n    *   对象特征 156–158\n    * \
    \  对象标记 129–138\n    *   对象边界 138–151\n    *   最优阈值 119\n    *   Otsu 算法 120–123\n\
    \    *   对象表示 151–155\n    *   分割 114–115\n    *   阈值化 116–118\n*   布尔方程 80\n\
    *   边界框 158\n*   box 滤波器 44, 44\n\n"
