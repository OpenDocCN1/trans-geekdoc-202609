    ### 2.6.2 Linear Convolution Properties


    The importance of convolution is due to its very interesting mathematical properties.
    As will be seen later in this book, there is a close relationship between convolution,
    Fourier analysis, and their corresponding methods at frequency \[[7](#C_005_c2.xhtml#r2_7)\].


    #### 2.6.2.1 Commutativity


    The convolution is commutative, which means that:


    *I* \* *H* = *H* \* *I*


    It represents the same result if the image and the filter exchange order positions
    in the operation, so there is no difference if the image *I* with the coefficient
    matrix *H*(*i*,*j*) is convolved or vice versa. Both functions can exchange positions,
    obtaining the same result.


    #### 2.6.2.2 Linearity


    This property implies some important properties. If an image is scaled with a
    constant *a* and then this result is convolved by the coefficient matrix *H*,
    the same result would be obtained as if the image was first convolved and the
    result of this operation was scaled by *a*. That is:


    (*a*⋅*I*) \* *H* = *a* ⋅ (*I*\**H*) (2.15)


    Furthermore, if two images are added pixel by pixel and then the result is convolved
    by *H*, it would give the same result as if both images were firstly convolved
    and finally the result of each convolved image is added. That is:


    (*I*[1]+*I*[2]) \* *H* = (*I*[1]\**H*) + (*I*[2]\**H*) (2.16)


    It might be surprising in this context that adding a constant *b* to an image
    that is then convolved through the *H* window of a filter does not produce the
    same result as if the image was first convolved and then the constant *b* is added
    to it. That is:


    (*b*+*I*) \* *H* ≠ *b* + *I* \* *H* (2.17)


    The linearity of the filter operations due to the use of convolution is an important
    theoretical concept; however, in practice, the filter operations are involved
    in processes that limit this linearity. This fact is provoked by rounding errors
    or the restriction in the range of images to which they are restricted to visualize
    them (“Clamping”).


    #### 2.6.2.3 Associativity


    Convolution is an associative operator, which means that the set of operations
    performed one by one in a sequence could change their grouping order without affecting
    the original result. That is:


    *A* \* (*B*\**C*) = (*A*\**B*) \* *C* (2.18)


    The association capacity of the filters is important since the application sequence
    of a set of filters could be reduced to one, which is normally carried out for
    the design of coefficient matrices. The opposite case is also valid, where a filter
    can be broken down into simpler operations performed by smaller filters.


    ### 2.6.3 Filter Separability


    An immediate consequence of Equation 2.18 is the possibility of describing a filter
    by the convolution of two or more filters that are tentatively simpler and smaller
    than the original. Therefore, the convolution performed by a “big” filter on an
    image could be decomposed by a sequence of convolutions performed by small filters
    such that:


    *I* \* *H* = *I* \* (*H*[1]\**H*[2]\**H*[3]…*H*[*n*]) (2.19)


    The advantage obtained by this separation is to increase the speed of the operations
    since, although the number of filters is increased, among all of them, being smaller
    and simpler, they perform fewer operations than the original filter.


    #### 2.6.3.1 x-y Separation


    Something frequent and important in the use of filters is the separation of a
    two-dimensional filter *H* into two one-dimensional filters that operate horizontally
    *H*[*x*] and *H*[*y*] vertically on an image. If we assume that we have two one-dimensional
    filters *H*[*x*] and *H*[*y*] that they operate in each of the directions, then:


    $H\_{x} = \\left\\lbrack {1\\operatorname{}\\operatorname{}\\operatorname{}\\operatorname{}1\\operatorname{}\\operatorname{}\\operatorname{}\\operatorname{}1\\operatorname{}\\operatorname{}\\operatorname{}\\operatorname{}1\\operatorname{}\\operatorname{}\\operatorname{}\\operatorname{}1}
    \\right\\rbrack\\,\\,\\text{or}\\,\\, H\_{y} = \\begin{bmatrix} 1 \\\\ 1 \\\\
    1 \\\\ \\end{bmatrix}$ (2.20)


    If you want to use both filters, one with the other on image *I*, both filters
    can be used as follows:


    *I*←(*I*\**H*[*x*])\**H*[*y*]\=*I*\**H*[*x*]\**H*[*y*] (2.21)


    The same result can be obtained by applying the filter *H*[*x**y*] on the image,
    which is the convolution of both directional filters *H*[*x*] and *H*[*y*], such
    as follows:


    $H\_{xy} = H\_{x} \\ast H\_{y} = \\left\\lbrack {\\begin{matrix} 1 \\\\ 1 \\\\
    1 \\\\ \\end{matrix}\\operatorname{}\\operatorname{}\\begin{matrix} 1 \\\\ 1 \\\\
    1 \\\\ \\end{matrix}\\operatorname{}\\operatorname{}\\begin{matrix} 1 \\\\ 1 \\\\
    1 \\\\ \\end{matrix}\\operatorname{}\\operatorname{}\\begin{matrix} 1 \\\\ 1 \\\\
    1 \\\\ \\end{matrix}\\operatorname{}\\operatorname{}\\begin{matrix} 1 \\\\ 1 \\\\
    1 \\\\ \\end{matrix}} \\right\\rbrack$ (2.22)


    Under such conditions, the “Box” *H*[*x**y*] smoothing filter can be divided into
    two one-dimensional filters applied in two different directions on the image.
    The convolution performed by the full filter *H*[*x**y*] needs 3 × 5 = 15 operations
    per pixel in the original image. In the case of the two filters *H*[*x*] and *H*[*y*],
    they require 3 + 5 = 8 operations per pixel of the image, which is much less.


