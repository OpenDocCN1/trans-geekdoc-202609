    在本节中，描述了使用 MATLAB 提高锐度。拉普拉斯滤波器可以分为两个步骤：首先，计算拉普拉斯，然后使用它来增强图像。


    图 3.17 显示了 MATLAB 中拉普拉斯滤波器的结果。第一步是计算图像的拉普拉斯：


    ```matlab

    L = laplacian(double(I));

    ```


    第二步是增强图像：


    ```matlab

    I_enhanced = I - w * L;

    ```


    FIGURE 3.17 MATLAB 中拉普拉斯滤波器的结果。


    ### 3.4.4 Canny 滤波器


    一种著名的边缘检测方法是 Canny 滤波器[2]。该方法基于在不同方向和分辨率上一系列滤波器，最终合并成单一结果。该方法旨在实现三个目标：(a) 减少边缘边缘，(b)
    提高图像边缘定位，以及(c) 输出边缘宽度只有一个像素的图像。Canny 滤波器本质上是一种基于梯度方法的滤波器，但它也使用二阶导数（拉普拉斯）作为边缘定位的标准。大多数情况下，该算法以简单形式使用，即设置平滑参数
    `σ`。


    ![FIGURE 3.18 应用 Canny 算法的图像。(a) 原图，(b) \sigma = 2 的图像边缘，(c) \sigma = 4 的图像边缘，以及
    (d) \sigma = 6 的图像边缘。(images/Fig03_18.jpg)


    FIGURE 3.18 应用 Canny 算法的图像。(a) 原图，(b) `σ = 2` 的图像边缘，(c) `σ = 4` 的图像边缘，以及 (d) `σ
    = 6` 的图像边缘。


