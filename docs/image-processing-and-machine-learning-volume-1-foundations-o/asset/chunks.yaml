    ### 3.3.2 The Roberts Operator


    The Roberts operator is one of the oldest filters used for locating edges in an
    image \[[6](#C_006_c3.xhtml#r3_6)\]. In this section, it will be described. A
    particularity of this filter is that it is extremely small, using only a 2 × 2
    coefficient matrix to determine the gradient in its two different directions along
    its diagonals. The operator is defined as follows:


    $H\_{1}^{R} = \\begin{bmatrix} 0 & \\underset{\\\_}{1} \\\\ {- 1} & 0 \\\\ \\end{bmatrix}\\quad
    H\_{2}^{R} = \\begin{bmatrix} {- 1} & 0 \\\\ 0 & \\underset{\\\_}{1} \\\\ \\end{bmatrix}$
    (3.16)


    This filter reacts particularly to the edges of the image that have a diagonal
    direction ([Figure 3.7](#C_006_c3.xhtml#f3_7)). However, this makes the filter
    not very selective in the direction of the gradient, mainly when it is calculated
    on regions with different orientations. The magnitude of the gradient is calculated
    as defined in Equation 3.5, considering both components *H*[1]^(*R*) and *H*[2]^(*R*).
    Nevertheless, due to the diagonal operation of the filter on the data, it can
    be considered that the magnitude of the gradient is formed as the resultant of
    two vectors (*H*[1]^(*R*) and *H*[2]^(*R*)) that are at 45°. [Figure 3.8](#C_006_c3.xhtml#f3_8)
    illustrates this operation.


