  trans: '


    ![图 6.3 属于同一条线的点 p1 和 p2，为了确定直线的方程，需要估计参数 k 和 d 的值。](img/Fig06_03.jpg)


    **图 6.3** 属于同一条线的两个点 `p`1 和 `p`2，为了确定直线的方程，需要估计参数 `k` 和 `d` 的值。


    `y[1] = k*x[1] + d`

    `y[2] = k*x[2] + d` (6.2)


    其中 `k`, `d` ∈ ℜ。因此，目标是估计通过属于物体边缘不同点的直线的参数 `k` 和 `d`。面对这种情况，问题随之产生：如何如何确定一条直线可能包含哪些点呢？一种可能的方法是在图像中画出所有可能的直线，并精确统计通过每条线的点数，然后删除所有点数未超过特定数量的直线。然而，上述方法是可行的，但因为在图像上绘制的可能直线数量非常大，这会使效率特别低下。


    ### 6.2.1 参数空间


    霍夫变换以一种稍微不同的方式解决了直线检测问题：通过产生所有通过图像边缘对应像素的可能直线 [6]。通过通过点 `p[0] = (x[0],y[0])` 的直线
    `L[p]` 具有以下方程：


    `L[P]: y[0] = k*x[0] + d` (6.3)


    其中通过改变 `k` 和 `d` 的值来画出所有共有 `x[0]` 和 `y[0]` 的可能直线。方程 6.3 中 `k` 和 `d` 的解集对应于无限多通过点
    `x[0]` 和 `y[0]` 的直线（见图 6.4）。对于给定的 `k` 值，6.3 对应的解是关于 `d` 的函数，这意味着：


    ![图 6.4 通过共同点 p0 的直线集。所有通过 p0 的可能线 Lp 具有表达式 y_{0} = kx_{0} + d，其中 k 和 d 的值是变量，决定了每条定义直线之间的差异。](img/Fig06_04.jpg)


    **图 6.4** 通过共同点 `p0` 的直线集。所有通过 `p0` 的可能线 `Lp` 具有表达式 `y[0] = k*x[0] + d`，其中 `k`
    和 `d` 的值是变量，决定了每条定义直线之间的差异。


    `d = y[0] - k*x[0]` (6.4)


    这是一个线性函数，其中 `k` 和 `d` 是变量，`x[0]` 和 `y[0]` 是函数中考虑的参数常量。方程 6.4 的解集{*k,d)} 了通过点 `p[0]
    = (x[0],y[0])` 的所有可能直线的参数。


    对于图像的给定像素 `p[i] = (x[i],y[i])`，根据方程 8.4，有一组由直线定义：


    `R[i]: d = y[i] - k*x[i]` (6.5)


    以变量参数 `k` 和 `d` 定义了参数空间（也称为霍夫空间），而 `x[i]` 和 `y[i]` 是固定参数（也称为图像参数空间）。这两个空间之间的关系方式总结在表
    6.1 中。


    **表 6.1** `houghlines` 函数返回的结构字段


    | 字段 | 描述 |

    | --- | --- |

    | **point1** || 它是一个 2 元素向量 (*x*,y*)，指定线段的起点。 |

    | **point2** || 它是一个 2 元素向量 (*x*,y*)，指定线段的终点。 |

    | **Theta** || 包含关于参数 *θ* 如何线性划分的信息的向量。 |

    | **rho** || 包含关于参数 *r* 如何线性划分的信息的向量。 |


    图像参数空间中的每个点 `p[i]` 对应于霍夫空间中的一条直线。在上述情况下，我们感兴趣的是霍夫空间中通过物体边缘不同点的直线，这些直线对应于图像参数空间中的
    `k` 和 `d` 值。正如图 6.4 所示，霍夫空间中的解集对应于通过点 `x[0]` 和 `y[0]` 的无限多直线。对于给定的 `k` 值，6.3 对应的解是关于
    `d` 的函数，这意味着：（此处由于原文重复，逻辑衔接）通过改变 `k` 和 `d` 的值来画出所有共有 `x[0]` 和 `y[0]` 的可能直线。这些直线直线的斜率
    `k` 和其在 y 轴上的截距 `d`。


    ### 6.2.2 累加矩阵


    霍夫变换定位直线的原理是首先离散 `k` 和 `d` 的范围。在霍夫空间中计数直线时，使用累加矩阵，其中每个单元格根据直线的数量而增加。霍夫空间中保持局部最大值的点对应于图像中的直线。图
    6.6 以图 6.5 为例说明了这一过程。


    ![图 6.5 图像参数空间与霍夫空间的关系。(a) 图像参数空间和 (b) 霍夫空间。参数空间中的点对应于霍夫空间中的直线，反之亦然，霍夫空间中的一个点对应于图像中的一条直线。图像中的点
    p1 和 p2 对应于霍夫空间中的直线 R1 和 R2；同样，霍夫空间中的点 q12 = (k12, d12) 对应于图像中的直线 L2。](img/Fig06_05.jpg)


    **图 6.5** 图像参数空间与霍夫空间的关系。(a) 图像参数空间和 (b) 霍夫空间。参数空间中的点对应于霍夫空间中的直线，反之亦然，霍夫空间中的一个点对应于图像中的一条直线。图像中的点
    `p[1]` 和 `p[2]` 对应于霍夫空间中的直线 `R[1]` 和 `R[2]`；同样，霍夫空间中的点 `q = (k[12],d[12])` 对应于图像中的直线
    `L[12]`。


    ![图 6.6 霍夫变换的基本原理。(a) 图像参数空间和 (b) 霍夫空间中的累加器。所示，累加器矩阵是霍夫参数空间的离散版本。对于图像 (a) 参数空间中的每个点，霍夫空间中都有一条直线。执行的操作是加性的，这意味着当直线通过它时，矩阵的每个单元格都会增加
    1。这样，霍夫空间中保持局部最大值的点对应于图像参数空间中的直线。](img/Fig06_06.jpg)

