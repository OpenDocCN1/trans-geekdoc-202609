    a region of intensity values smaller than the full one (`a[min]=0`, `a[max]=K−1`)
    so that:


    `a[min]  > 0 or a[max]  < K  − 1` (1.9)


    It produces an image with poor dynamic. It is considered poor since an appropriated
    dynamic reaches its maximum when all intensity values in that range are present
    in the image ([Figure 1.12](#C_004_c1.xhtml#f1_12)).


