    ### 3.4.2 图像锐度增强


    将拉普拉斯算子应用于图像，我们将得到边缘。然而，如果目的是提高图像的锐度，则需要保留原始图像的低频信息，并通过拉普拉斯滤波器增强图像中的细节。为了实现这一效果，有必要从原始图像减去一个缩放后的拉普拉斯滤波器值。因此，锐度提高后的图像如下方程所示：


    `I(x, y)[Enhanced] = I(x,y) - w · ∇²I(x,y)` (3.28)


