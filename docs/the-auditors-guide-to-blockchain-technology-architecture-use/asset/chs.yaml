  \ | | | 区块链上机密数据的存储是否得到充分控制和构建，以保障业务连续性和灾难恢复？ | | | | | | | | | | | | |\n\n## 与采购周期相关的欺诈计划\n\
  \n采购周期可能成为许多欺诈计划的目标，如果不利用良好实践和有效控制进行检查，可能会影响采购决策。区块链技术具有不可篡改、去中心化、分布式、防篡改和强制共识的特性，辅以围绕该技术的最佳实践和控制，使其成为减轻采购周期欺诈的绝佳工具。显然，如果采购决策无法以快捷、准确和防欺诈的方式最终敲定，极有可能导致组织无法实现其既定目标。\n\
  \n此外，从表 4.2 可以明显看出，从采购周期的最初阶段开始，就可能发生不同的欺诈计划，有时会导致重大的金钱和声誉损失。\n\n表 4.2 采购周期相关欺诈计划与良好实践及控制的映射\n\
  \n| **序号** | | | 采购周期阶段 | | | 欺诈计划 | | | 良好实践和/或控制 |\n| --- | --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- |\n| 1 | | | 订单申请 | | | 账单欺诈 | | | 提供多种支付选项。\
  \ |\n\n\n\n\n\n### 不必要的订单\n\n升级并将计费软件嵌入区块链网络。\n\n仅使用准确且实时的数据。\n\n### 选择供应商\n\n####\
  \ 价格操纵\n\n核实区块上注册供应商的身份。\n\n#### 利益冲突\n\n确保与交易相关的所有各方均知晓嵌入智能合约中的所有政策和标准。\n\n制定将供应商添加到区块链网络及从网络中移除的适当政策。\n\
  \n向公司或可用的举报热线报告任何形式的嫌疑或担忧。\n\n智能合约的设计应包含访问控制，仅允许获批的供应商和用户创建交易。\n\n### 报价与投标\n\n\
  #### 串标 价格操纵\n\n避免在区块链网络外进行交易。进一步审查那些看起来可疑地过低或过高的投标价格或提案。\n\n不要将合同拆分给出价相同的两个实体。\n\
  \n为员工提供培训，指导其如何遵循区块链网络上采购周期的政策和控制措施。\n\n### 发布采购订单\n\n#### 回扣与贿赂\n\n频繁更新反贿赂和反腐败政策。聘请独立第三方（如审计团队）验证交易并审查公司的控制措施和政策。\n\
  \n参考适用于该组织的反腐败政策和法律。\n\n确保禁止签署空白采购订单，并将其嵌入智能合约代码中。\n\n### 货物接收与交付\n\n#### 不当索赔 备用金\
  \ 滥用变更 滥用合同规格\n\n所有交易都应经过验证。所有已验证的交易都应记录在区块链账本上。相关各方之间的所有协议都应获批并嵌入智能合约。供应商和第三方供应商应在区块链网络上发布其交易和会计信息，以便于交易验证。\n\
  \n### 收到并批准发票\n\n#### 虚假发票\n\n审计师应确保发票、申购单和采购订单在智能合约中得到妥善处理，以确保完全合规。\n\n#### 虚报金额\n\
  \n在网络上根据折扣和原始采购订单条款对所有交易进行核实。\n\n#### 重复或虚高的发票\n\n核实已取消的采购订单是否反映在区块链网络上，以防止交付后对同一发票进行重复付款。\n\
  \n### 质量控制与接收报告\n\n#### 以次充好\n\n质量控制部门对货物检查的文档记录，应作为在适用智能合约中结束交易的标准。\n\n智能合约应将采购订单与商品收据信息进行核对，并将订单发送给应付账款团队进行最终审核和批准。\n\
  \n#### 虚假陈述与索赔\n\n与适用税收相关的规则应嵌入适用的智能合约中。\n\n智能合约中应嵌入验收流程，将订单的实际成本与采购订单上最初计算的原始金额进行核对。\n\
  \n### 付款\n\n#### 支票篡改\n\n所有付款都应通过智能合约中嵌入的流程进行；且付款应由区块链网络上的相关方授权 [[8]](#ch12.xhtml#r175)。\n\
  \n欺诈预测原型应嵌入智能合约，以检测欺诈活动 [[8]](#ch12.xhtml#r175)。\n\n通过提供适当且便捷的支付替代方案，并利用准确和实时的数据改善整体采购周期，与计费舞弊和下达多余订单相关的威胁应能得到大幅缓解。\n\
  \n## 公共部门与私营部门三式记账面临的挑战\n\n表 4.3 列出了组织成功实施三式记账系统面临的主要挑战。总体而言，技术采用旨在改善企业运营，以提高其有效性和效率。然而，组织转型工作通常会遇到利益相关者的抵制，从而在实施现代技术时产生新的挑战。用户对拟议的技术实施往往持消极态度，因为需要学习新技能和/或程序。此外，用户抵制也可能归因于对技术本身缺乏信心，因为区块链仍相对较新。与区块链应用审计相关的挑战也是另一个重要考量因素。总体而言，组织准备就绪对于企业背景下的区块链采用至关重要\
  \ [[1]](#ch12.xhtml#r168)。\n\n### 三式记账的影响及其挑战\n\n表 4.3 三式记账的影响及其挑战\n\n| 类别 | 影响\
  \ | 挑战 |\n| --- | --- | --- |\n| 财务 | 组织 | 需投入大量资金以开发和升级区块链技术，期望收益能随时间推移超过成本。 |\n\
  | | | 会计专业人士和审计专家需更新或拓展其目前有限的三式记账知识，这意味着额外的培训和职业发展成本。 |\n| 利益相关者 | 政府机构 | 引入新技术，加上不同利益相关者往往有不同的利益或优先事项，这将使聚合利益相关者的任务变得困难。\
  \ |\n| | 税务机关 | |\n| | 财政部 | |\n| | 决策者 | |\n| | 审计师 | |\n| | 外国投资者 | |\n| 技术 |\
  \ 组织/利益相关者 | 新举措往往需要大量时间才能全面推行。拟议技术也可能无法为其预期用例提供预期效益。 |\n| 政策实施 | 三式记账政策必须更新以保持相关性。\
  \ | 由于其增强了问责制和控制，政策可能对某些利益相关者产生负面影响。 |\n\n## 总结与结论\n\n本章简要回顾了会计记录从单式记账系统、复式记账系统到三式记账系统的历史。此外，还讨论了与三式记账出现相关的若干子主题；包括各种区块链组件如何与复式记账协同工作；三式记账对会计师和审计师的影响；以及三式记账在缓解财务欺诈方面的作用。本章提供的信息旨在帮助会计师和审计师更好地理解三式记账系统及其在会计/审计专业中的益处。\n\
  \n## 核心概念\n\n\n\n\n\n# 三式记账与区块链技术\n\n*   本章讨论了会计分录的历史，从印度 Chanakya 发起的单式记账系统，到 15\
  \ 世纪意大利经济学家 Luca Pacioli 开创的复式记账系统。三式记账最初由会计学者 Yuji 和金融密码学家 Ian Grigg 构想。除了借方和贷方分录外，Yuji\
  \ 建议引入第三层分录，并配合一套新的账户集合，以进一步说明收入的变化。\n\n*   实施基于区块链的会计系统，将复式记账和分布式记录转化为去中心化的公共记录，可为被审计实体记录的完整性提供高度的确定性。Ian\
  \ Grigg 开发了一种新理论——**“收据即交易”**，旨在防止交易欺诈并最大限度地减少内部文档中的无意错误。双方之间由金融密码支持的数字授权收据，可通过共同的第三方分录进行解读。\n\
  \n*   三式记账有助于确保源单据的真实性，可能会为具备区块链技能的会计师增加未来的就业机会。\n\n*   区块链技术凭借其不可篡改性、去中心化、分布式账本、共识机制和增强的安全性，有助于缓解\
  \ ACFE 欺诈分类中的各类欺诈手段，如财务报表欺诈、挪用现金欺诈、现金盗窃、登记付款计划、支票篡改、账单计划、薪资计划、费用报销计划、库存挪用及库存盗窃。\n\
  \n*   由于区块链的可追溯性特征，采购交易丢失的顾虑可轻松解决；在区块链网络上执行三式记账将有助于减少审计和采购周期中所用的时间和步骤。\n\n## 进阶理解活动\n\
