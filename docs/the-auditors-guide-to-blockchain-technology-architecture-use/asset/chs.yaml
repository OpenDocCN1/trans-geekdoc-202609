  \ [58]。 | 适用于：<br>• 家庭能源管理<br>• 认知无线电网络<br>• 软件资源管理<br>• 5G 移动边缘计算 [27]。 |\n\n####\
  \ 混合密码学\n\n非对称密码学有一个主要缺点；它比对称密码系统慢得多。因此，非对称密码系统主要用于加密少量数据，例如信用卡号。幸运的是，有一种更好的方法可以结合对称和非对称密码学，以获得两者的优势。所使用的技术称为混合密码学。假设发送方（Alice）想要在没有预先共享的密钥的情况下加密并发送一条长消息给接收方（Bob）。Alice\
  \ 使用一种（快速的）对称密码系统来选择一个随机密钥并加密明文。然后 Alice 使用 Bob 的公钥加密这个密钥。Alice 将密文和加密后的密钥发送给 Bob。Bob\
  \ 使用他的私有解密密钥解密该密钥，然后使用解密后的密钥解密密文。非对称密钥用于加密短密钥，而速度快得多的对称密钥用于加密较长的明文。因此，混合密码学（几乎）实现了对称密钥密码学的效率。在发送方和接收方之间没有预定密钥的情况下，可以使用混合密码学\
  \ [73]。\n\n#### 同态密码学\n\n\n\n“同态”一词最早由 Rivest、Adleman 和 Dertouzous 于 1978 年提出，作为一种无需解密即可进行加密的可能解决方案。同态加密是一种密码系统，用户可以在加密数据上进行计算。同态技术提供了数据隐私，因为它在处理数据时不会发生数据泄露，且数据只能由持有私钥的人访问\
  \ [1]。同态加密仍处于发展阶段。\n\n##### 椭圆曲线密码学\n\n椭圆曲线密码学是公钥密码学中的一种方法，基于有限域上椭圆曲线的代数结构 [45]。Neal\
  \ Koblit 和 Victor S. Miller 于 1985 年分别独立建议在密码学中实现椭圆曲线 [45]。\n\n椭圆曲线密钥是使用椭圆曲线方程计算的，密钥尺寸较小，占用内存空间较少，与\
  \ RSA 密码学相比速度更快 [23, 45]。椭圆曲线密钥交换 (ECKE) 可用于不安全信道上的通信 [16]。\n\n椭圆曲线密码学的优势在于使用 164\
  \ 位密钥即可实现安全性，这意味着它比 RSA 和 Diffie-Hellman 算法更安全，同时消耗的功率更低，从而使便携设备电池的利用更加高效 [23]。椭圆曲线密码学的缺点是其加密消息尺寸、算法的复杂性，以及与\
  \ RSA 相比实现起来更具挑战性 [23]。\n\n##### 零知识证明\n\n零知识证明和知识证明是识别密码的先进方式，也是密码学中的强大工具 [66]。在零知识证明系统中，验证者被证明者说服，确信某陈述为真，而无需披露实际信息，仅通过验证断言即可。进一步解释，“证明”或“证明系统”是双方之间的一种交互式协议，其中一方（证明者）试图说服另一方（验证者）某个给定陈述为真\
  \ [51]。证明者展示其知晓满足给定论证（证明性或知识性）的秘密值，而不向验证者透露该秘密（零知识性） [8]。\n\n要被视为零知识证明，必须满足以下标准\
  \ [39]：\n\n*   **完整性**：如果证明者的陈述为真，验证者将被说服。\n*   **可靠性**：如果证明者的陈述为假，验证者不会被说服。\n*\
  \   **零知识性**：如果信息为真，验证者除获知证明者的陈述为真外，不会获得任何其他信息。\n\n表 2.4 重点介绍了先进密码系统的优缺点及其在区块链技术中的应用。\n\
  \n表 2.4 先进密码系统对比\n\n| 密码系统 | 优点 | 缺点 | 应用 |\n| --- | --- | --- | --- |\n| 同态密码学\
  \ | • 提高银行交易、投票计算和云计算中的隐私保护。 • 有助于轻松检索用户的私人信息 [72]。 | • 方法复杂，因为它使用不同理想格的构造 [72]。\
  \ | • 区块链技术中的隐私保护：在区块链中实现同态密码学将允许对密文进行处理，这最终将实现交易隐私和机密性。 • 确保华为区块链中的隐私保护交易：华为的区块链解决方案使用同态加密的公钥来加密和保护用户的交易数据\
  \ [42]。 |\n| 椭圆曲线密码学 (ECC) | • 与其他密码系统相比，提供最高的每比特强度 [30]。 • 在 ECC 中，164 位密钥提供的安全性等同于\
  \ 1024 位密钥的 RSA。这意味着 ECC 需要更低的计算量和更小的内存 [30]。 • 在 RSA 中使用的相同密钥尺寸，在椭圆曲线密码学中提供更安全的密码系统，意味着\
  \ ECC 在使用时需要更小的内存 [30]。 • ECC 提供更高的速度，尽管私钥处理复杂，但公钥可以非常容易地计算 [30]。 | • 加密消息的尺寸明显大于\
  \ RSA 密码系统 [30]。 • 算法的复杂性和实现算法的难度增加了实现过程中出错的可能性 [30]。 • ECC 易受量子计算攻击，因为椭圆曲线离散算法问题的难度与从非对称密钥恢复对称密钥的复杂性相关，因为\
  \ ECC 用于生成非对称密钥和对称密钥 [80]。 | • 物联网：ECC 的主要应用在于物联网设备（手持设备），因为 ECC 因其能耗效率高和发热量低，适合资源受限的方案\
  \ [83]。 • 比特币：基于 ECC 的椭圆曲线数字签名算法 (ECDSA) 用于比特币。ECC 用于比特币加密货币，以确保只有合法所有者才能花费其资金。比特币使用\
  \ ECC 从私钥生成公钥。SECP256k1 是所使用的特定椭圆曲线，它是有限域上的曲线 [26]。 • 以太坊：比特币使用的椭圆曲线 SECP256k1 也被以太坊使用。因此，在比特币和以太坊中获取公钥的过程是相同的。EDSA\
  \ 应用于私钥以获得一个 64 字节的整数，即两个 32 字节的整数，表示椭圆曲线上的 X 和 Y 点，它们被连接在一起 [7]。 |\n| 零知识证明 | •\
  \ 易于实现，因为不涉及复杂的加密方法 [68]。 • 安全，因为无需任何参与者透露信息。 • 提高区块链的吞吐量和可扩展性 [68]。 • 取代低效的验证和认证方法；从而增强信息安全\
  \ [68]。 | • 需要大量计算能力 [68]。 | • Zcash：在区块链技术中，Zcash 是一个加密货币平台，使用零知识的一种特殊迭代（称为 zk-SNARKS），允许原始交易在网络共识规则下验证的同时保持完全加密\
  \ [43]。 • SNARKS 已被实施以确保区块链中的隐私 [43]。 |\n\n## 哈希函数\n\n哈希是区块链网络的基础。哈希函数将任意大小的输入文件、文本或图像转换为固定长度的加密输出。这种技术称为哈希。哈希允许用户随机选择输入数据，对数据进行哈希运算并获得相同的输出。即使输入发生微小变化，也会导致截然不同的输出\
  \ [33, 81] (图 2.2)。\n\n![图 2.2 哈希函数的工作原理。 ¶ 来源：[81]。](html/images/9781032078243_C002_002.jpg)\n\
  \n图 2.2 哈希函数的工作原理。 ¶ 来源：[81]。\n\n### 哈希是如何工作的？\n\n\n\n\n一串固定长度的数字和字母序列，它与输入不匹配，从而产生一个加密值，被称为**哈希**或**哈希值**。使用固定长度的输出增加了保护，因为任何试图解码哈希或破坏区块链的人，仅通过查看输出长度都无法预测输入是长还是短。\n\
  \n解哈希始于区块头中的可访问数据，因此也就是解决一个数学难题。每个区块头包含版本号、时间戳、前一个区块的哈希、默克尔根哈希、随机数和目标哈希。为了解决这个数学难题，区块创建者可能需要多次尝试，以决定使用哪串数字作为随机数。随机数是一串任意数字，它被应用到前一个区块的哈希上，然后再次进行哈希运算。如果哈希后的输出小于或等于目标哈希，则被批准为该难题的解，并将该区块添加到区块链中。构建满足目标哈希要求的哈希越复杂，解决该难题所需的时间就越长\
  \ [33]。\n\n### 哈希函数用在哪里？\n\n加密哈希函数在区块链上用于许多活动。部分活动列举如下 [81]：\n\n*   **保护区块头**：发布节点对区块头进行哈希运算。如果区块链网络使用工作量证明共识模型，发布节点会使用不同的随机数值对区块头进行哈希运算，直到满足难题规范。然后，当前区块头的哈希输出被存储在下一个区块的区块头中，从而保护当前区块头的数据。\n\
  *   **保护区块数据**：发布节点对区块数据进行哈希运算，哈希输出被存储在区块头中 [81]。\n*   **用于地址派生**：地址是一串简单的字母数字字符，作为转账中的“收款方”和“付款方”地址。地址是通过区块链网络用户的公钥，使用加密哈希函数并结合一些附加数据（如版本号或校验和）获得的\
  \ [81]（图 2.3）。\n\n    ![图 2.3 地址生成。 ¶ 来源：[81]。](html/images/9781032078243_C002_003.jpg)\n\
  \n    图 2.3 地址生成。 ¶ 来源：[81]。\n\n### 哈希函数的安全属性\n\n*   **原像抗性**：这意味着哈希函数是单向的。对于给定的输出值，要在计算上确定输入值非常困难。例如，对于给定的摘要，如果\
  \ `hash(x) = digest`，则不可能找到 `x` 的值。\n*   **第二原像抗性**：这意味着无法识别出具有特定输出的输入。加密哈希函数的构造方式使得，对于特定的输入，要在计算上找到一个产生相同输出的第二个输入值非常困难。例如，对于给定的\
  \ `x`，如果 `hash(x) = hash(y)`，则不可能以任何成功概率找到 `y`。\n*   **抗碰撞性**：这意味着在计算上很难找到产生相同输出值的两个输入。例如，如果\
  \ `hash(x) = hash(y)`，则不可能找到 `x` 和 `y` [81]。\n*   **非局部性**：这意味着在非局部哈希函数中，相似的输入会产生截然不同的输出。\n\
  *   **大状态空间**：哈希碰撞只能通过暴力搜索来确定。根据鸽巢原理，暴力搜索涉及测试尽可能多的输入。这个数字应该足够大，以使暴力搜索变得困难 [60]。\n\
  \n对哈希算法的成功攻击，是指能够违反该哈希函数任一安全属性的攻击。由于哈希函数产生的位长度较短，所有安全哈希函数都容易受到通用攻击。针对哈希函数的攻击包括暴力攻击、生日悖论攻击、差分攻击和长度扩展攻击\
  \ [5]。\n\n### 哈希函数的实际应用\n\n*   **密码验证**：大多数网站将密码以哈希形式保存，因为以明文形式保存密码被认为是不安全的。每当用户输入密码时，系统会对其进行哈希运算，并将输出与组织服务器上保存的哈希值集合进行比对。\n\
  *   **签名生成与认证**：签名认证是一种用于验证数字签名或消息完整性的加密方法。有效的数字签名为接收者提供了明确证据，证明消息是由已知发送者生成的，且在传输过程中未被篡改。\n\
  *   **数据认证与消息完整性**：哈希也用于确保从源发送到接收者的消息和数据在传输过程中未被修改。为实现这一点，源发布其数据的哈希版本和一个密钥，以便接收者可将计算出的哈希值与发布的哈希值进行比对，确保两者匹配\
  \ [32]。\n\n### 常见加密哈希函数\n\n**MD4** 由 Ronald L. Rivest 于 1990 年设计 [61]。它将长度短于 `2⁶⁴`\
  \ 位的输入消息转换为 128 位输出。它是第一个允许在 32 位处理器上高效使用逻辑运算和整数计算的加密算法。密码学家 Dobbertin 使用代数和优化方法攻击\
  \ MD4，导致出现“碰撞”。除几十字节外，整个消息都处于攻击者的控制之下。在 Den Boer 和 Bosselaers 发起攻击后，Rivest 立即建议了一个名为\
  \ MD5 的改进变体 [76]。\n\n**MD5** 由 Ronald L. Rivest 开发，他也设计了 MD4 [61]。MD5 算法使用可变长度的输入消息并产生\
  \ 128 位输出 [60]。输入消息被分割成 512 位块。输入消息经过填充，使其总长度能被 512 整除。根据需要添加尽可能多的前导零，以将消息长度最大化至比\
  \ 512 的倍数少 64 位。剩余位填充 64 位，表示原始消息的长度。MD5 算法在 128 位状态下运行，分为四个 32 位字，映射到一组固定常量。然后算法利用\
  \ 512 位消息块来改变状态 [59]。\n\nMD5 算法在 32 位处理器上具有快速优化，包含 64 次操作，分为四轮，每轮 16 次操作 [61]。这些操作基于非线性函数、模加和左旋转\
  \ [59]。与 MD4 相比，MD5 更安全，但比 MD4 慢 [41]。Boer 和 Bosselaers 证明了 MD5 不具备抗碰撞性 [76]。\n\n\
  MD4 和 MD5 在工业和军事领域都有广泛应用 [41]。尽管 MD5 容易受到攻击，但它仍被用作数据认证的校验和，以防止无意的欺诈。MD5 摘要用于区块链应用中，以保证文件在传输过程中未被修改。文件服务器拥有文件的\
  \ MD5 校验和，以便用户将该文件的校验和与接收到的文件进行匹配 [59]。\n\n\n\n\n#### SHA-256\n\n**SHA-256**：SHA-256\
  \ 由美国国家安全局（NSA）开发。缩写“SHA”代表安全哈希算法，“256”代表 256 位输出，即 32 字节 [75]。SHA-256 将长度短于 2⁶⁴\
  \ 位的输入消息转换为 256 位输出 [61]。它是对数字数据执行的一种数学函数。为了确认数据完整性，需将计算出的哈希值与预期的哈希值进行比较 [75]。该哈希函数的主要特性是抗碰撞性，要找到一次碰撞，该算法大约需要运行\
  \ 2¹²⁸ 次 [81]。然而，MD4 和 MD5 均不具备抗碰撞性 [76]。\n\nSHA-256 被用于许多区块链实现中 [81]。它用于比特币协议的各种功能，如比特币挖矿、默克尔树和比特币地址生成\
  \ [75]。\n\n##### 比特币挖矿\n\n当区块创建者必须生成前一个区块哈希时，会使用 SHA-256 [74]。为了生成前一个区块哈希，矿工使用以下公式\
  \ [75]：\n\n```\nPrevious Block Hash = SHA-256 (SHA-256 (Block Header))\n```\n\n\
  ##### 比特币地址生成\n\n公钥是比特币地址的基础。该密钥先由 SHA-256 哈希，再由 RIPEMD160（160 位竞赛完整性原语评估消息摘要）哈希。创建比特币地址的公式为\
  \ [75]：\n\n```\nBitcoin Address = RIPEMD160 (SHA256 (Public Key))\n```\n\nSHA-256\
  \ 还用于创建安全套接字层（SSL）证书。这些证书用于建立和验证网站及在线服务的安全通信。在 SSL 证书中，加密组件由 SHA-256 创建。服务器与互联网服务提供商（ISP）之间的安全连接称为“SSL\
  \ 握手”。信用卡号、登录详情及其他机密数据通过该链接受到 SHA-256 的保护。在该过程中，SHA-256 对所有用户信息进行哈希运算 [75]。\n\n\
  ## 默克尔树\n\n默克尔树由拉尔夫·默克尔构想 [82]。罗伯特·默克尔于 1979 年为默克尔树申请了专利。默克尔树通过为整组交易创建数字指纹，记录区块中的所有交易\
  \ [64]。默克尔树类似于书籍的索引部分，因为它们允许用户检查某笔交易是否包含在区块中。使用默克尔树的一些哈希函数示例包括 SHA-0、SHA-1、SHA-2、RIPEMD\
  \ 和 RIPEMD-160 [6]。\n\n### 默克尔树的工作原理\n\n默克尔根或根哈希是通过持续哈希成对节点以生成默克尔树而留下的哈希值 [64]。默克尔树中的每个节点都是一个哈希值\
  \ [82]。节点分为两类：叶子节点和非叶子节点。叶子节点是单笔交易的哈希值，非叶子节点是前一个哈希值的哈希值。因为默克尔树是二叉的，所以需要相等数量的叶子节点。如果交易数量为奇数，则最后一个哈希值会被复制，直到产生偶数个叶子节点\
  \ [64]。\n\n在 图 2.4 的一个区块中有四笔交易：A、B、C 和 D。每笔交易被哈希后存储在叶子节点中，分别为哈希 A、哈希 B、哈希 C 和哈希\
  \ D。通过分别哈希哈希 A 和哈希 B、哈希 C 和哈希 D，顺序成对的叶子节点被汇总，从而产生哈希 AB 和哈希 CD。哈希 AB 和哈希 CD 称为父节点。然后通过哈希哈希\
  \ AB 和哈希 CD（称为哈希 ABCD）来创建默克尔根。默克尔根随后存储在区块头中，用于检测交易数据是否被修改，从而维护数据完整性 [82]。如果进行了任何修改，默克尔根也会随之改变\
  \ [64]。\n\n![图 2.4 默克尔树结构。 ¶ 来源：[19]。](html/images/9781032078243_C002_004.jpg)\n\
  \n图 2.4 默克尔树结构。 ¶ 来源：[19]。\n\n### 默克尔树的优势\n\n默克尔树减少了对大量内存空间的需求；通过认证数据来证明完整性，且计算快速简便。区块链矿工/验证者在从其他成员接收交易时，可以稳定地计算哈希值。此外，区块链用户可以验证区块中的交易。因此，默克尔树管理只需在网络中分发少量信息\
  \ [64]。\n\n## 数字签名\n\n数字签名是传统手写签名的电子表示形式。数字签名用于证明数据已由声称的“签名人”签署，并可用于确定数据在签署后是否被修改。该签名由计算机中的一系列比特组成，可针对传输的数据或从存储中恢复的数据创建。\n\
  \n- **声称签名人**：在签名信息经过认证、确认签名人真实身份之前，签名人被称为声称签名人。\n- **密钥对持有者**：签名人也称为密钥对持有者，因为他们拥有一对公钥和私钥。\n\
  - **预期签名人**：打算在未来生成签名的个人或组织称为预期签名人 [29]。\n\n### 数字签名生成\n\n密钥对持有者使用私钥生成数字签名。在数字签名生成过程之前，使用哈希函数创建消息摘要。消息摘要是待签名数据的简洁版本，用作生成数字签名的输入。生成消息摘要后，选择一种数字签名算法，并获取与该算法相关的其他信息（例如椭圆曲线数字签名算法）。预期签名人使用私钥、消息摘要、数字签名算法和其他详细信息生成数字签名。签名人可使用公钥验证签名，以识别数字签名生成过程中的计算错误\
  \ [29]（图 2.5）。\n\n![图 2.5 数字签名生成。 ¶ 来源：[29]。](html/images/9781032078243_C002_005.jpg)\n\
  \n图 2.5 数字签名生成。 ¶ 来源：[29]。\n\n### 数字签名验证与确认\n\n验证者执行数字签名验证和确认过程。验证者使用声称签名人的公钥来验证数字签名。签名生成过程中使用的数字签名算法的域参数从声称签名人或证书颁发机构（CA）获取。为了检查和验证数字签名，需生成一个消息摘要。该消息摘要使用与数字签名生成中相同的哈希函数创建。使用数字签名算法、域参数、公钥和新的消息摘要来验证数字签名。\n\
  \n在批准已验证的数字签名之前，验证者必须对以下几点有保证：\n\n1. 签名人声称的身份。\n2. ECDSA（椭圆曲线数字签名算法）域参数的真实性。\n3.\
  \ 公钥的有效性。\n4. 私钥持有者即为声称签名人。\n\n获取上述四项保证的所有方法均详见 SP（特别出版物）800-89。\n\n\n\n\n如果验证和保障过程成功，则数字签名和签名数据将被视为有效（图\
  \ 2.6）。如果验证或保障过程失败，则数字签名将被视为无效 [29]。\n\n![图 2.6 数字签名验证与确认。 ¶ 来源：[29]。](html/images/9781032078243_C002_006.jpg)\n\
  \n图 2.6 数字签名验证与确认。 ¶ 来源：[29]。\n\n## 访问控制、身份管理和成员服务提供商\n\n实施访问控制是为了防止攻击者访问脆弱设备。访问控制模型由五个要素组成——主体、客体、客体所有者、操作和参考监视器。\n\
  \n各要素的描述如下：\n\n*   **主体**：主体是能够访问客体的活动实体。\n*   **客体**：客体是受访问控制的元素。\n*   **客体所有者**：客体所有者拥有客体并定义访问策略。\n\
  *   **操作**：操作是主体访问客体的方式。例如，读、写、删除等。\n*   **参考监视器/访问授权机构**：参考监视器决定授予或拒绝主体对客体的访问 [65]。\n\
  \n### 身份管理\n\n身份管理对用户进行标识、认证和授权，以访问组织的服务；例如，每个用户的访问级别、权限和限制，以验证其身份并访问服务 [77]。良好的身份管理模型有助于改善区块链的去中心化。一些分层身份管理模型包括传统模型、中心化模型、联合身份模型和以用户为中心的身份模型。这些典型模型容易受到攻击，因为它们拥有控制身份的中央权威机构，代表了单点故障\
  \ [36]。\n\n**自主身份（SSI）模型** 是自主身份领域身份模型开发的新方法。SSI 通过允许用户对其身份行使绝对控制权，提高了安全性和信任度 [36]。\n\
  \n自主身份模型的主要特征如下：\n\n*   **存在性**：个体拥有独立的存在，永远无法仅以数字形式存在。\n*   **持久性**：身份持续存在的时间取决于用户的意愿。\n\
  *   **可携带性**：身份信息必须易于携带。\n*   **控制权**：用户完全拥有其身份的所有权，并应能够管理这些身份。\n*   **访问权**：用户应能方便地访问其身份，无需任何中介协助，并知晓对其身份声明所做的任何更改。\n\
  *   **透明性**：用于控制身份的技术应在其运行、处理和重新配置方式上保持透明，并应向所有用户授予开放访问权限。\n*   **互操作性**：只要用户对其身份拥有绝对控制权，就可以广泛使用其身份。\n\
  *   **同意权**：身份信息仅在获得用户许可的情况下才能被交换或使用。\n*   **最小化**：为提高安全性，应使用最少的信息来完成必要工作，且数据暴露必须受到限制。\n\
  *   **保护性**：在用户权利与网络需求发生争议时，应优先考虑用户，从而保护其权利。\n\n自主身份模型架构包含三个角色，如下所示：\n\n*   **颁发者**：创建和颁发声明的实体称为颁发者。声明是实体做出的陈述。\n\
  *   **持有者**：保留和交换声明的实体称为持有者。\n*   **验证者**：验证身份持有者身份的第三方称为验证者 [36]。\n\n一系列身份管理模型（如\
  \ *Uport*、*Sovrin* 和 *ShoCard*）已被开发出来，旨在基于区块链和 SSI 技术改进去中心化功能，具体描述如下。\n\n*Uport*\
  \ 是一个基于 SSI 的开源平台，允许用户在智能合约上注册自己的身份。Uport 促进用户之间单向的身份交换。在该模型中，用户无需为受限用途暴露个人详细信息。Uport\
  \ 平台的隐私威胁目前仍不清楚。\n\n*Sovrin* 是一个联盟区块链。用户无需事先批准即可访问该区块链。Sovrin 身份拥有一组称为管理人的验证节点以达成共识，并使用去中心化标识符（包括单向和全向）。在\
  \ Sovrin 中，用户完全拥有其身份的所有权，并可选择想要与相关方共享的 SSI 特征。用户通过智能手机应用程序和软件控制代理与 Sovrin 通信。尽管该方法有诸多优势，但\
  \ Sovrin 平台并不常用，因为用户并不完全理解平台的功能，因此用户界面仍是一个有待解决的问题。\n\n*ShoCard* 是一个促进移动身份开发的平台，旨在实现跨区域的共享用户身份。ShoCard\
  \ 的基础设施专注于比特币区块链。该方法在联合身份模型（典型分层模型）中整合了移动应用程序、区块链和生物识别技术，同时考虑了隐私和安全因素。ShoCard 身份使用单向标识符，用户对其身份拥有绝对控制权。ShoCard\
  \ 的隐私威胁目前仍不清楚。用户通过智能手机应用程序与 ShoCard 基础设施通信，并对所有活动使用二维码扫描模式 [36]。\n\n### 成员服务提供商\n\
  \n成员服务提供商（MSP）是区块链身份管理中使用的去中心化元素，用于验证希望访问区块链网络的用户。MSP 向区块链网络的用户提供访问控制功能。\n\n成员服务的活动如下：\n\
  \n1.  用户身份验证\n2.  用户注册\n3.  基于用户角色授予访问权限\n\n当身份被颁发时，允许用户访问区块链网络。成员服务使用证书颁发机构（CA）协助身份管理和认证服务。证书颁发机构识别所有用户和应用程序\
  \ [12]。\n\n## 加密钱包\n\n钱包维护一份公钥和私钥列表，可由钱包用户轻松管理。这可以通过两种方式完成；即，监视区块链的本地副本，或与属于另一全节点用户的副本进行通信。换句话说，钱包从其可管理的交易中生成余额。通过使用私钥，当钱包引用一笔可由持有私钥的人解锁的交易，并带有该交易期望重新锁定的地址时，可通过钱包生成交易。钱包不存储币，但可以引用区块链上的任何交易。然而，钱包可能会存储其参与过的交易的本地列表、用户偏好以及不断更新的更新余额\
  \ [34]。\n\n## 钱包类型\n\n共有三种类型的软件钱包，分别是：\n\n*   **全节点钱包**：将整个区块链本地下载到全节点钱包中。交易在本地处理和验证，然后与其对等节点共享。\n\
  *   **轻节点钱包**：处理交易时使用与另一全节点的连接。\n*   **在线钱包**：仅存在于在线钱包网站上。数据交易通常不与本地客户端同步。\n\n\n\
  \n\n#### 硬件钱包\n\n*硬件钱包*是用于存储私钥和数据（如账户余额）的物理设备。硬件钱包的一个主要示例是 KeepKey，如图 2.7 所示。\n\n\
  ![图 2.7 硬件钱包示例。 ¶ 来源：[46]。](html/images/9781032078243_C002_007.jpg)\n\n图 2.7 硬件钱包示例。\
  \ ¶ 来源：[46]。\n\n硬件钱包通常是最安全的。因此，在被没收的情况下，需要所有者的配合才能解锁。然而，在丢失 PIN 码或设备的情况下，可以使用恢复功能。如果调查人员了解恢复步骤，则无需恢复\
  \ PIN 码即可访问币。\n\n#### 冷钱包或冷存储\n\n冷存储是指保持离线状态的任何密钥。它可以位于 USB 密钥、纸条或硬件钱包上。虽然可能存在存储在离线状态的密钥，并且需要将其导入钱包以转出资金，但离线钱包仍然能够从发送方接收币。这是因为币从未被“接收”，它仅在区块链上引用该地址。因此，存放在保险箱中的一张纸片上的地址及其私钥或备份，在完全离线的情况下仍然可以变得更“富有”（接收更多币）。\n\
  \n设置纸钱包非常简单。私钥可以写在一张纸上并存放在安全的地方，如银行保管箱。公钥/私钥地址对也可以在不联网的情况下生成。纸钱包非常安全，因为密钥对可以生成，且私钥永远不需要出现在钱包或计算机上，直到需要将接收到的资金转移到公钥地址为止。\n\
  \n一个用于生成公钥/私钥对的有用工具是名为 *WalletGenerator* 的免费应用程序，它是加密货币的通用纸钱包生成器 [34]（图 2.8 和图 2.9）。\n\
  \n![图 2.8 钱包生成器示例。 ¶ 来源：[78]。](html/images/9781032078243_C002_008.jpg)\n\n图 2.8\
  \ 钱包生成器示例。 ¶ 来源：[78]。\n\n![图 2.9 生成的公钥/私钥对，可打印在纸钱包中。 ¶ 来源：[78]。](html/images/9781032078243_C002_009.jpg)\n\
  \n图 2.9 生成的公钥/私钥对，可打印在纸钱包中。 ¶ 来源：[78]。\n\n### 密钥如何存储在钱包中？\n\n钱包以多种方式存储密钥。这些方法描述了从单个或多个私钥创建公钥的方式。理解密钥如何创建非常重要，因为它有助于追踪具有复杂交易需求的个人或组织使用的钱包。这些方法分为三大类：\n\
  \n*   **非确定性**：也称为类型 0 或*只是一堆密钥*（JBOK）。非确定性密钥以公钥/私钥对的简单列表形式存储。这种方法意味着有大量的密钥需要管理。这也意味着需要备份或妥善保管大量数据。\n\
  \n*   **确定性**：也称为类型 1 或种子钱包。在确定性钱包中，所有私钥都从基于随机数的单个种子获取。这种方法好得多，因为只需存储和备份种子即可恢复所有生成的私钥。这使得管理钱包变得容易得多。\n\
  \n*   **分层确定性**：也称为 HD 钱包。这是目前使用的最新钱包协议，并于 2016 年在 Bitcoin Core 中实现。与确定性钱包一样，所有私钥都从单个种子获取，但\
  \ HD 钱包中的密钥可以按层级结构生成自己的私钥和公钥。此外，种子可以备份，备份的种子可用于恢复整棵树的结构。种子通常由一系列 12 到 24 个单词表示 [34]。\n\
  \n## 星际文件系统\n\n星际文件系统（IPFS）是一种协议，允许媒体存储在分布式文件系统上 [40]。当文件被添加时，它会生成一个唯一的指纹（哈希值），并在网络中移除重复文件\
  \ [17]。\n\nIPFS 是一种去中心化文件系统，其核心功能是通过应用分布式哈希表（DHT）和 Merkle 有向无环图（DAG）数据结构创建的 [40]。\n\
  \nIPFS 本质上是一个去中心化的点对点共享应用程序，因为系统中没有上级节点，并且与典型的去中心化文件系统会保存文件直到用户删除不同，IPFS 仅保存正在使用的文件并确保它们保持不可变\
  \ [62]。因此，不常用的文件会自动从网络中删除。IPFS 的这一属性是其网络上似乎不可能发动成功的分布式拒绝服务攻击的主要原因 [56]。\n\nIPFS\
  \ 的子协议如下：\n\n*   **身份**确保处理节点的身份被生成并验证为真实。\n*   **网络**确保与其他网络的无缝连接，并可选择性地检查网络中发送消息的完整性。\n\
  *   **路由**确保网络中信息准确传递给预期接收者。\n*   **交换**确保数据分发无缝进行。*BitSwap* 用作节点获取所需区块的媒介。\n* \
  \  **对象**用于表示网络中的数据结构和通信层级。\n*   **文件**确保文件系统中存在清晰的层级结构。\n*   **命名**确保使用自我认证的可变名称系统\
  \ [17]。\n\nIPFS 有一个名为*星际命名系统*（IPNS）的名称服务。IPNS 允许通过用户易于识别和理解的名称来标识 IPFS 文件。这有助于用户在更新发生后轻松识别要下载的文件。\n\
  \nIPFS 的一项高级功能是它支持使用类似 GIT 的数据结构进行文件版本控制，GIT 是一种用于识别和跟踪文件中任何变更的软件，也用于增强多人软件开发过程中的协调工作。IPFS\
  \ 还利用目录和文件，通过称为用户空间文件系统（FUSE）的可挂载文件系统 [62]。\n\nIPFS 文件有以下四种类型：\n\n*   **Blob** 是存储在\
  \ IPFS 中的文件主要部分的表示。\n*   **List** 是由 Blob 和其他 List 组合而成的完整文件的表示，旨在压缩网络中的数据。\n* \
  \  **Tree** 是目录的表示。它包含 Blob、List、Tree 和 Commit 的组合。\n*   **Commit** 是网络上任何文件历史的快照。\n\
  \n由于网络中的每个文件都由其哈希值标识，因此需要类别的哈希值以下载任何文件。例如，要下载文件的快照，需要 IPFS Commit 的哈希值 [40]。\n\n\
  ### 智能合约\n\nNick Szabo 在 20 世纪 90 年代末在一篇题为《在公共网络上形式化和保护合作伙伴关系》的文章中提出了智能合约。智能合约是运行在区块链之上的安全且去中心化的程序。它代表了一种协议，当满足特定条件时，该协议可自动执行和强制执行。智能合约是一个去中心化框架。区块链机制的主要隐私优势使区块链成为智能合约的标准去中心化模型\
  \ [14]。\n\n### 智能合约生命周期\n\n\n\n\n\n### 智能合约\n\n智能合约是一旦部署后便在区块链上自主执行的软件。智能合约在区块链上的存储是公开的，因为区块链上的任何人都可以读取和使用智能合约。智能合约无法被篡改，且在区块链上永久存在。在区块链网络中，智能合约的执行由“工作者”（通常称为矿工或验证者）完成，他们通过执行智能合约获得加密货币作为报酬\
  \ [53]。\n\n设计分布式系统时，应考虑智能合约的以下特性：\n\n*   **智能合约具有不可变性**：智能合约一经部署便无法修改。因此，如果合约应用逻辑存在缺陷，该缺陷将永远存在，因为没有任何方式进行更新。\n\
  *   **智能合约是公开的**：在区块链应用中，核心原则之一是透明性。换句话说，存储在区块链中的记录对所有人可见，由于智能合约是区块链的一个组成部分，智能合约的“源代码”可以被任何人查看。因此，需要保密的方法和算法不应由智能合约实现。\n\
  *   **与智能合约相关的信息始终可用**：除了智能合约的代码外，所有区块链用户都可以查看合约变量持有的值、历史数据以及与该合约相关的所有交易。\n\n上述属性具有如下含义：\n\
  \n1.  智能合约不能用于存储私有数据，如私钥和受保护记录。\n2.  智能合约不能用于执行需要秘密信息的操作，例如创建数字签名。\n3.  智能合约不能用于生成秘密信息，例如生成密钥\
  \ [31]。\n\n### 开发者如何确保用户无法利用漏洞或非预期功能\n\n考虑到智能合约的内部代码一经部署便无法更改，强烈建议开发者通过测试程序、测量测试覆盖率、设置持续集成以及对合约执行安全审计，采用防御性编程技术，以确保用户无法利用漏洞或非预期功能\
  \ [53]。\n\n智能合约开发者应考虑设置“熔断开关”，即一段将使智能合约永久失效的代码。调用“熔断开关”应导致与智能合约关联的所有资金转移给合约所有者。熔断开关还应防止用户未来与该合约进行交互。值得注意的是，即使智能合约被“熔断”，该合约的代码和数据仍将保留在区块链上\
  \ [31]。\n\n### 图灵完备性\n\n图灵完备性是定义用于模拟图灵机的编程语言的一种属性。艾伦·图灵在 20 世纪 30 年代提出了图灵机的概念。以太坊虚拟机是图灵完备智能合约设备的著名示例\
  \ [67]。\n\n为验证是否需要图灵完备语言，需针对各种控制流机制（如循环和递归函数）对以太坊区块链进行评估。仅有 35.3% 的智能合约使用控制流机制。因此，使用非图灵完备智能合约是明智的。请注意，比特币平台使用非图灵完备语言\
  \ [44]。\n\n图灵完备性带来了不必要且繁重的攻击面。一个真实案例是 2016 年的去中心化自治组织（DAO）攻击，该攻击由图灵完备性触发。此次攻击窃取了\
  \ 360 万 ETH（以太币），相当于 5000 万美元。因此，图灵完备智能合约可能是高风险实现 [67]。\n\n### 不受信代码\n\n调用使用不受信代码构建的智能合约可能会导致意外风险和故障。这些调用可能将恶意代码引入智能合约。与不受信代码交互是不安全的。它可能破坏控制流，导致多种漏洞。\n\
  \n为将危险降至最低，建议仅将调用委托给受信合约。调用不受信合约时，应避免在调用后进行状态更改。建议在代码中使用 `call()`，而非使用 `transfer()`\
  \ 和 `send()` 函数 [25]。\n\n更详细的智能合约攻击讨论和最佳实践，请参见第 14 章。\n\n## 结论与建议\n\n本章讨论了各种区块链组件、密码学原理和算法、公有链与私有链以及开放链与封闭链的区别、默克尔树在区块链中的工作原理、区块链相关的访问控制概念、哈希算法的使用、智能合约和加密货币钱包。本章信息丰富，旨在让读者熟悉区块链平台的架构组件。\n\
  \n## 核心概念\n\n*   区块链网络通过链接多个节点并运行软件来创建，交易通过钱包发起请求。该交易被发送到区块链网络上的所有处理节点，每个处理节点根据区块链网络开发者给定的预定义规则验证交易。所有经过验证的交易随后被存储在一个区块中，并通过哈希进行保护。当网络中的其他处理节点确认哈希正确后，该区块被添加到区块链，标志着交易完成并确立了不可变性\
  \ [20]（图 2.10）。\n\n    ![图 2.10 区块链交易生命周期。 ¶ 来源：20 使用 Visio 创建。](img/9781032078243_C002_010.jpg)\n\
  \n    **图 2.10** 区块链交易生命周期。 ¶ 来源：[20] 使用 Visio 创建。\n\n*   存在许多重要的区块链相关角色和职责。这些包括用户、处理节点、区块链监管者、区块链开发者、区块链管理员和证书颁发机构。这些不同的参与者——尽管在网络角色上截然不同——却表现出协同效应。这些交互使得区块链交易能够在整个网络中成功生成。\n\
  \n*   区块链可分为四大类：公有、私有、开放和封闭。在开放区块链中，所有用户均可读取存储的数据，但在封闭区块链中，仅允许的参与者才能读取数据。\n\n* \
  \  共识算法是指随时间开发出的各种机制，旨在确保区块链交易达成一致。这是区块链的一个关键方面，因为它决定了区块链网络的速度、可靠性和进一步发展。尽管目前有多种共识机制作为共识算法可用，但仍有开发新机制的空间。\n\
  \n*   Nonce（一次性数）是一个随机数值，构成了工作量证明共识机制的核心。区块链网络中的处理节点旨在 PoW 过程中生成一个满足所需哈希值的 nonce（例如：以四个零开头的哈希）。一旦\
  \ PoW 过程产生合适的 nonce，其他参与节点即可轻松验证，从而达成 PoW 共识。经其他节点验证后，最先确定 nonce 值的节点将获得创建相应区块的权利并赚取区块奖励；通常为一笔加密货币。\n\
  \n\n\n\n\n# 区块链技术中的密码学\n\n密码学是区块链技术的重要组成部分。密码学中的算法主要分为两大类，即对称算法和非对称算法。在对称算法中，使用同一个密钥进行加密和解密；而在非对称算法中，使用两个密钥，即公钥和私钥，它们也被称为“密钥对”。加密使用公钥进行，解密使用私钥进行。在区块链技术中，密码学用于保护网络用户的身份、确保交易安全以及保护所有有价值的信息。\n\
  \n## 哈希函数\n\n哈希是一个固定长度的由数字和字母组成的加密值，它与输入不匹配。哈希函数的安全特性包括抗碰撞性、单向功能性、非局部性和大状态空间。哈希函数的例子有\
  \ `MD4`、`MD5` 和 `SHA256`。哈希函数用于密码验证、签名生成和认证、数据认证以及消息完整性。\n\n## 默克尔树\n\n默克尔树记录区块中的所有交易。默克尔树需要的内存空间较少。默克尔根是通过持续哈希成对节点以生成默克尔树而留下的哈希值，并存储在区块头中。默克尔根对交易数据进行认证并证明数据完整性。\n\
  \n## 数字签名\n\n数字签名用于证明身份。数字签名算法包含数字签名的生成和验证过程。数字签名使用私钥生成，使用公钥验证。在批准的已验证数字签名之前，验证者必须具备四项保证：声称签署人身份的确保、域参数真实性的确保、公钥有效性的确保，以及声称签署人是私钥所有者的确保。\n\
  \n## 访问控制与身份管理\n\n访问控制用于防止网络犯罪分子访问脆弱系统。身份管理用于识别、验证和授权用户访问组织的资源。与层级身份管理模型相比，自主身份模型通过允许用户控制其身份来提高安全性和信任度。其他一些身份模型包括\
  \ `ShoCard`、`UPort` 和 `Sovrin`。\n\n## 星际文件系统 (IPFS)\n\n星际文件系统可容纳点对点、去中心化的资源共享。其目标是通过无缝连接网络中所有设备到所需文件，消除因网络中某些单元缺少文件而产生的低效率。它还确保网络内共享文件的安全性。星际文件系统使用称为星际命名系统\
  \ (`IPNS`) 的命名服务。这是一种去中心化的域名系统 (`DNS`) 形式。它帮助用户以人类易于解读的方式为文件命名。\n\n## 成员服务提供商 (MSP)\n\
  \n成员服务提供商 (`MSP`) 为用户提供区块链网络的访问控制功能。`MSP` 使用证书颁发机构在区块链网络上验证和注册用户，并根据用户角色提供服务访问权限。\n\
  \n## 钱包类型\n\n存在不同类型的钱包：软件钱包、硬件钱包和冷钱包。熟悉钱包类型及其在便利性和安全性方面的不同特性非常重要。\n\n### 智能合约\n\n\
  智能合约具有透明性、用户认证协议和代币转移协议等特性。然而，智能合约一旦部署在区块链上就无法修改。智能合约不保护用户隐私，不应存储或被用于创建秘密信息。由于智能合约的弱点和漏洞，开发人员应使用防御性编程技术并实施“熔断开关”，以便在必要时使智能合约失效。\n\
  \n## 促进理解的活动\n\n使用您的网络浏览器，访问 `etherscan.io`（以太坊区块链浏览器）。花一些时间探索该平台，以更好地熟悉其内部运作；然后尝试回答以下问题：\n\
  \n1.  以太币的当前价格是多少？\n2.  交易发布的速度有多快？\n3.  点击 `etherscan.io` 上的一个交易链接，确定该交易的以太币余额和交易成本。\n\
