  \n## 摘要\n\n第 8 章是本书中涉及区块链应用设计、开发和测试的三章中的第一章。本章首先概述了一系列考量因素，区块链应用开发人员必须在设计过程中对其进行评估。这些因素包括：应用程序是需要功能繁多还是功能精简；应用程序需要在多大程度上进行专业化；应用程序的支持需要是中心化还是去中心化；以及应用程序需要在多大程度上具备可扩展性。此外，本章还介绍了一个虚构的案例研究，包含两个用户画像及其用户故事，旨在让读者熟悉创建用户画像及其用户故事的必要性，以此作为确定应用程序功能需求的第一步。随后，功能需求被转化为技术需求，进而引出创建与完成应用程序设计流程相关的具体任务和步骤的过程。\n\
  \n本章的第二部分简要讨论了一些流行的应用设计方法，如 Ancile 方法、本体驱动方法和模型驱动方法。本章讨论最后以一张表格总结了八个重要的区块链设计考量因素，包括属性和/或问题。\n\
  \n## 区块链设计指导原则与考量因素\n\n### 首先，我们是否需要区块链解决方案？\n\n正如前几章所讨论的，数据库应用程序是一种存储、操作和检索数据的计算机程序。数据范围可以从数字到复杂结构\
  \ [5]。区块链由一种数据结构组成，用于保存网络中交易的记录 [3]。重要的是要注意，虽然区块链是一种数据库，但数据库不一定是区块链 [5]。进一步解释，区块链技术与数据库技术之间存在显著差异，如下所示：\n\
  \n*   **存储**：区别于其他技术的主要特性是区块链存储记录的不可篡改性。为实现这种不可篡改性，它结合加密和共识机制，将数据存储在分布式节点中。虽然区块链设计为去中心化运行，但数据库始终是中心化的，这意味着它们运行在一台服务器上，用户无法下载它们。数据库通常经过安全防护，因为它们往往包含敏感的用户和业务数据。另一方面，区块链没有中心化结构。数据分布在整个网络中，网络的任何用户都可以下载它们\
  \ [3]。\n*   **共识与权限**：另一个需要考虑的要点是，区块链依赖共识概念，而数据库依赖权限。共识算法是一种规定在何种条件下可将数据应用于区块链的公式。尽管共识关注的是如何将新数据应用于区块链并进行验证，但去中心化指的是区块链不为单一实体所有这一理念。这确保了数据库不托管在属于单一组织的中央服务器上。任何想要下载区块链的机器都可以拥有一份副本\
  \ [5]。\n*   **管理**：数据库包含有关数据性质的详细信息。另一方面，区块链作为存储媒介，用于存放称为*区块*的捆绑信息块 [2]。\n*   **修改**：数据库是可修改的。这意味着如果用户拥有权限，他们可以记录、修改甚至删除已备份数据库中的记录。区块链包含一项额外的安全功能，使其难以被黑客攻击或篡改\
  \ [18]。\n*   **透明度**：区块链的另一个重要特性是，在开放的公共区块链情况下，用户可以访问区块链上的数据。另一方面，数据库因其中心化的本质，无法提供同等程度的透明度。\n\
  *   **成本**：由于数据库技术已存在数十年，传统数据库包的部署成本通常低于区块链解决方案。因此，传统数据库技术可能是企业更具成本效益的替代选择，特别是在考虑相关成本/收益分析中的各种人工成本时。\n\
  *   **人才获取**：由于区块链是一项相对较新的技术，目前可用于处理各种区块链开发应用的人才库较小。此外，雇佣合格区块链人才的相关获取成本目前相当可观。另一方面，数据库相关人才相对容易寻找。他们也具有成本效益，因此即使是小企业也能负担得起聘请数据库专家\
  \ [13]。\n*   **仅追加**：最后，区块链“仅追加”的特性将其与传统数据库区分开来。也就是说，新数据不会替换旧数据；相反，它们以一种可以追溯所有变更的方式被添加到数据库中。在传统关系型数据库中，除非经过专门设计，否则新数据不会替换旧数据。这是因为区块链将数据组织成区块，每个区块由时间戳和前一个数据区块的哈希值（或签名）标识。这使得跨时间关联数据和跟踪区块链上的变更成为可能。这种功能可以融入传统数据库中（例如银行的交易历史），但它不是传统数据库的必备特性\
  \ [5]。\n\n就实用性、速度和准确性而言，数据库技术往往是明显的赢家。然而，在创造性、认证和自动化方面，区块链可以提供额外优势。简而言之，对于信任、问责和验证，区块链通常是首选。另一方面，数据库非常适合高性能应用和服务。它也是需要扩展的应用程序的绝佳选择\
  \ [13]。\n\n### 应用程序需要是功能繁多还是功能精简？\n\n在开发去中心化应用（DApp）时，了解用户需求至关重要。如果无法满足用户标准，会使 DApp\
  \ 使用起来非常复杂和/或令人沮丧。为用户提供大量功能乍看似乎是一个合理的目标，但功能过多可能会让用户不知所措，从而不愿选择具有额外功能的应用程序 [22]。\n\
  \n\n\n\n渐进式 Web 应用（PWA）是一种现代网站，它通过浏览器提供原生应用的交互体验。即使计算机未连接互联网，PWA 也能正常工作。为了实现丰富的基于\
  \ Web 的交互，PWA 使用了推送通知、缓存和稳定连接等现代 Web 功能。应用设计中的 PWA 功能需要更长的设计时间。在短时间内设计具有额外功能的应用程序可能会产生问题。原生应用可直接访问设备硬件。与原生应用不同，Web\
  \ 无法完全访问设备的硬件功能。手机上可以实现硬件的完整功能，尽管由于 JavaScript 相关的限制，Web 浏览器上并不总是能使用这些功能。进一步解释说，JavaScript\
  \ 是单线程程序；这意味着在执行一个操作时，必须延迟另一个操作。在这种情况下，使用 `C` 语言或其他提供同时运行多条命令能力的编程语言编写的原生代码将是可行的\
  \ [23]。\n\n任何用户的首要任务都是以最小的干扰，有效且高效地使用应用程序。应用程序必须简单、直接且易于用户理解。用户界面是使应用程序简单化的第一步，但这种简洁性并不单纯取决于用户界面。此外，应用程序必须符合用户需求，并应专注于使\
  \ DApp 独具特色的不同功能。因此，应用程序功能和设计的大多数属性应当功能精简 [22]。\n\n### 协作与安全，哪个更重要？\n\n协作在建立和执行协作流程方面可带来显著的成本和时间节省，尤其是在参与协作的第三方之间存在信任问题时。协作流程可通过依赖受信任的第三方合作伙伴来执行\
  \ [7]。\n\n#### 为安全与隐私而设计\n\n由于区块链应用连接到没有中央权威的公共或私有网络，因此安全性和隐私性是在设计区块链应用时最基本的考量。除政府机密网络外，区块链应用像其他网络一样通常连接到互联网。因此，公司必须妥善实施安全和隐私措施。\n\
  \n区块链应用与其他基于互联网的应用类似，这就是为什么数据泄露被视为其主要风险之一。在区块链中，数字身份是一个有助于数据隐私的概念。使用唯一的数字身份有助于开发企业级区块链安全措施。通过使用智能合约，可以在\
  \ DApp 中增加一层额外的安全性。进一步解释说，智能合约是一种算法，负责确保如果用户请求满足某些条件，则将执行特定功能——如区块链交易、资金转账和消息触发\
  \ [10]。\n\n### 应用将保持一致性还是专业化？\n\n一致性是指始终以一致的方式行事或表现，或始终以相似方式执行的价值 [26]。一致性等同于统一性。这意味着一致的事物被认为是可靠的、井井有条的，并遵循特定的规则或假设\
  \ [20]。\n\n保持一致性是区块链技术的重要原则之一。通过进行更改或添加新功能，区块链的一致性性能可能会受到影响，从而导致利益相关者不满。因此，在设计区块链应用时，质量应保持在恒定水平，尤其是因为视觉质量仍是客户体验的主要组成部分\
  \ [1]。\n\n此外，当 DApp 中的相似元素具有标准化的外观并以相似方式运作时，可访问性和可学习性会提高。当设计保持一致时，用户可以将体验适应新情境，并快速发现新事物。这样，用户将专注于完成任务，而不是每次切换情境时都去理解产品用户界面的功能\
  \ [17]。\n\n作为一项新兴技术，区块链通过提供一致性来维护用户信任；因此，根据客户的偏好和厌恶做出设计决策，将有助于创建一个更一致、Bug 更少的应用程序\
  \ [1]。对于新用户来说，界面变得更容易学习。用户困惑减少，从而减少用户错误。一致性降低设计复杂性，节省用户时间和精力。此外，一致性有助于为任何应用程序建立清晰的形象\
  \ [26]。\n\n一致性有以下几种类型：\n\n*   **视觉一致性** 专注于使相似对象保持一致；它关乎颜色、形状、图标、字体和其他基本信息。视觉一致性对于创建强有力的视觉层级以及在各元素间建立关系也很重要\
  \ [26]。DApp 中包含的元素必须极其注重细节地制作。这些元素包括排版、符号、形状等 [20]。\n*   **功能一致性** 确保相同的结构以相同的方式表现。用户可以预测点击按钮会发生什么并执行特定功能\
  \ [26]。\n*   **内部一致性** 将视觉和功能一致性结合起来，以确保应用程序易用且易学 [20]。内部一致性适用于界面或品牌的各个方面，使它们在外观和行为上看起来像属于同一个系统。DApp\
  \ 中新增的功能应与 DApp 中已有的功能完全兼容 [26]。\n*   **外部一致性** 确保用户无论在哪个平台或系统上运行应用程序，都能获得相同的体验。例如，亚马逊用户同时使用亚马逊的移动应用和\
  \ Web 平台进行购买，因此亚马逊在两个平台上提供相同的用户体验 [20]。\n\n### 支持将是中心化还是去中心化？\n\n去中心化网络没有控制和管理整个网络的中央权威，这就是为什么利益相关者需要其他网络用户的许可才能制定或更改任何规则。然而，Facebook、Uber\
  \ 和 Instagram 等主要服务仍然是中心化的，因为用户无法修改预定义的规则。例如，Facebook 拥有更改其规则的完全权力，其用户必须遵守。读者应注意，中心化系统中始终存在单点故障风险。由于不存在单点故障，区块链为利益相关者提供了高水平的安全性\
  \ [9]。\n\n#### DApp 中去中心化的机制\n\n\n\n\n##### 去中心化系统中的数据存储\n\n在去中心化系统中，数据分布存储于网络各处，而非由中心节点收集汇总，旨在消除单点故障风险。临时消息传递和远程网络可用于在去中心化系统中传输数据。去中心化系统采用公钥加密方法提供可靠的认证机制。公钥对系统中所有用户可见，用于加密信息。去中心化系统中的每个节点或矿工都拥有数据的副本，这保证了数据平等，同时所有用户在去中心化环境中也受到平等对待。交易通过\
  \ `DApp` 广播至网络。消息在指定周期内实时传输，确保在必要时会重试传输消息 [15]。\n\n##### 区块链与去中心化应用的因素与特征\n\n与区块链和去中心化应用相关的因素与特征如下：\n\
  \n*   **开放访问**：中心化系统在其运营的某个阶段，会在技术上或逻辑上被控制方（第三方）锁定，对用户关闭。这意味着用户需要获得中央权限才能访问中心化应用。相反，由于去中心化应用具备开放访问能力且无中央权限控制，去中心化网络随时向用户和开发者开放\
  \ [9]。去中心化应用的管理应当独立，任何修改应由区块链用户的共识来管理 [15]。\n\n*   **非层级化**：借助区块链技术，基于非层级模式，每个用户拥有平等的权威与控制权。例如工作量证明挖矿系统，其中所有矿工在区块链上本质上是平等成员，但其贡献与网络算力成正比。\n\
  \n*   **透明性**：透明性确保每个用户在区块链上获取相同数量和层级的信息。第 7 章讨论了一个例外，即 `Hyperledger Fabric` 等区块链，根据各类隐私法律和最佳实践，具备向参与者隐藏信息的能力\
  \ [9]。\n\n##### 整体式还是模块化？\n\n模块化架构是指将问题的复杂性分解为更小、更易管理组件的方法。模块化架构包含一些准则、原则和模式，是一种设计风格，允许开发者将系统视为一组更小的物理组件。模块帮助开发者在设计和运行时阶段理解、扩展和控制系统。此外，模块具有清晰的业务结构，并通过公共接口传达其作用域。应用的物理组成是模块化架构的核心主题\
  \ [19]。\n\n组织通常倾向于选择模块化系统，而非紧耦合系统——即整体式应用。整体式应用拥有单一代码库，涵盖多个模块。模块分为业务或技术两类。整体式方法提供单一构建机制，包含整个系统及其依赖项。\n\
  \n一般来说，模块化流程可按以下方式执行。第一步是划分应用的功能。在划分功能并识别相应模块后，下一步是隔离模块以保持其独立性。接下来，重要的是在隔离模块后，将各项功能尽可能靠近其所需信息放置，以减少模块间通信。最后一步是消除模块间的直接通信\
  \ [4]。\n\n## 用户画像\n\n用户画像是基于用户类别分析构建的虚构角色，旨在反映可能以相似方式使用服务、产品、网站或应用的各类用户类型。用户画像用于构建关键用户群体的可信、准确形象以供参考。在理解和开发用户画像时，会评估定性和定量因素以及网络分析数据。创建用户画像有助于理解用户的期望、视角、行为和目标。\n\
  \n### 用户画像示例 1\n\nShaun 教授是加拿大某大学的系主任。Shaun 负责协助管理学生的课程注册流程和数据。作为系主任，Shaun 没有时间手动核查和验证学生手工填写的所有纸质注册表。此外，他在批准每位学生的申请前，还必须检查所有课程注册资格要求。他觉得这一过程极其耗时，因此效率极低。\n\
  \n### 用户画像示例 2\n\nAnika 是加拿大阿尔伯塔省一家医疗诊所的医生。作为医疗专业人员，她负责处理患者数据。每位医生每天平均接诊 20 位患者，医生们面临的一个大问题是难以识别患者，尤其是当老患者返院复诊时，医生不得不查找记录所有患者健康状况的具体文档。\n\
  \n## 用户故事\n\n用户故事是从最终用户角度出发，对应用功能的一种非正式、概括性描述。旨在解释应用功能如何为用户带来价值。`DApps` 可能面向不止一种用户。用户故事通过特定最终用户的视角审视产品能力，以反映某一客户群体的利益和诉求。\n\
  \n### Shaun 教授的用户故事\n\nShaun 对新的课程注册电子表单系统感到满意。他可以通过访问平台开始一天的工作，查看所有包含所需信息的课程注册申请电子表单（如学生的绩点、成绩、课程先修要求等），从而快速批准/拒绝注册申请。Shaun\
  \ 认为，这种方法比以前需要学生手工填写、他审核签字、再人工送至注册部门的纸质系统要高效得多。\n\n### Anika 医生的用户故事\n\nAnika 很高兴地发现，新的区块链\
  \ `DApp` 能有效保存每位患者的数据，且无需纸质病历。此外，`DApp` 还能为患者数据提供强有力的安全保障。每位医生均由系主任验证，只有他们（系主任和指定医生）拥有检索患者数据的访问权限。一旦医生批准新的患者数据，这些数据将作为一个区块存储在区块链驱动的平台上。\n\
  \n## 功能需求\n\n功能规范定义了应用在特定情况下的行为表现。这有助于确定 `DApp` 开发者必须纳入解决方案的所需设计特性和功能。主要的区块链功能需求决策包括：区块链是否需要是私有、公开、开放或封闭的，以及确定验证每个区块的最佳共识方法\
  \ [6]。\n\n## 技术需求与任务\n\n\n\n\n在完成上述功能（业务）需求的基础上，技术需求是指需要完成的技术（编码）过程。每项技术需求都包含一系列必须执行的更细粒度的任务。换句话说，相关任务反过来有助于满足技术需求并确定估算。如果某项任务难以轻松估算，应将其分解为子任务。对于每项任务，都会计算熟练开发人员完成该任务所需的估算时间\
  \ [16]。\n\n以下是 Shaun 博士用户故事可能所需任务的部分示例，以清单形式呈现：\n\n> **学生界面：**\n>\n> *   **前提条件：**\
  \ 该界面仅对参与研究方法课程的大学生可见。\n> *   **功能：** 参与的学生可通过填写电子表单注册研究方法（RM）课程。\n> *   **任务/所需技能集：**\n\
  >     1.  在界面上放置名为 `Register for Research Method` 的按钮。\n>         *   10 分钟 – 用户界面设计师完成该任务所需的估算时间。\n\
  >     2.  点击按钮应调用 `getRegForm()` 函数。\n>         *   30 分钟 – 后端开发人员完成该任务所需的估算时间。\n\
  >     3.  注册表单将打开，包含标签、文本框，提交按钮应放置在表单底部。\n>         *   20 分钟 – 用户界面设计师完成该任务所需的估算时间。\n\
  >     4.  点击按钮应调用 `setRegForm()` 函数，该函数将把请求存储在数据库中。\n>         *   30 分钟 – 后端开发人员完成该任务所需的估算时间。\n\
  >\n> **教师界面：**\n>\n> *   **前提条件：** 该界面仅对在埃德蒙顿协和大学注册并拥有批准研究方法请求所需权限的教授可见。\n> *  \
  \ **功能：** 教授可以查看、批准或拒绝研究方法的请求。\n> *   **任务/所需技能集：**\n>     1.  在界面上放置名为 `View Requests\
  \ for Research Method` 的按钮。\n>         *   10 分钟 – 用户界面设计师完成该任务所需的估算时间。\n>     2.\
  \  点击按钮应调用 `getAllRegForm()` 函数。\n>         *   30 分钟 – 后端开发人员完成该任务所需的估算时间。\n> \
  \    3.  任务 2 的结果将传递给 `showAllRegReq()` 函数。\n>         *   40 分钟 – 后端开发人员完成该任务所需的估算时间。\n\
  >     4.  任务 3 的结果——包含所有学生的成绩信息和注册电子表单——将以表格形式显示。\n>         *   30 分钟 – 用户界面设计师完成该任务所需的估算时间。\n\
  >     5.  `Approve`（批准）和 `Decline`（拒绝）按钮放置在表格每行的末尾。\n>         *   10 分钟 – 用户界面设计师完成该任务所需的估算时间。\n\
  >     6.  点击 `Approve` 将调用 `approveReq()` 函数，同样，点击 `Decline` 按钮将调用 `declineReq()`\
  \ 函数。\n>         *   30 分钟 – 后端开发人员完成该任务所需的估算时间。\n\n### 流行的应用程序设计方法\n\n本节介绍并简要讨论了若干可能适用于区块链应用程序开发的应用程序设计原则和方法。根据适用的应用程序设计考量，区块链应用程序设计利益相关者应调查并选择与其预期区块链用例最兼容的设计方法。\n\
  \n#### Ancile\n\n在隐私保护方法方面，Ancile 的主要目标是解决电子信息管理和处理中的数据保护和安全问题。这种设计方法使客户和第三方能够以安全、互操作且高效的方式访问和共享电子记录。Ancile\
  \ 框架提出了一种加密技术，通过仅在区块链上存储数据引用（哈希值），实现对区块链上信息的安全、多方访问，以达成这一目标。\n\n#### 本体驱动方法\n\n\
  针对区块链框架的设计，本体驱动的数据建模技术旨在追踪供应链中的对象，同时使企业能够了解分散在多个数据库中的数据，特别是在跨组织流程中。本体驱动方法的另一个优势是，它在区块链的组织运营中引入了系统化验证。该方法通过使用统一建模语言（UML）方法论，将业务流程中发现的数据模型转换为特定的面向对象编程（OOP）语言，从而实现这一目标。此外，源自\
  \ OOP 的形式本体被转换为智能合约代码，用于描述初始业务流程产生的数据。ODA 对 DApp 的设计和开发阶段均有用处 [24]。\n\n#### 面向 DApp\
  \ 的软件工程策略\n\n软件工程策略旨在确保项目所有者与开发人员之间的项目协议定义明确，且所有利益相关者清楚理解所需规格。该方法建议使用 UML 模型来描述\
  \ DApp 的需求和设计，例如用例图、类图和操作图。\n\n##### 模型驱动方法\n\n该模型适用于设计区块链应用程序的状态和行为。区块链建模涉及传统软件系统与区块链的交集，后者允许存储系统生成的任何数据在分布式账本上。采购订单、服务合同或任何其他类型的数据均可被包含并存储在分布式账本上。大多数情况下，地址或交易的生成源于软件端。基于流程的可视化编程语言是可视化设计技术的一种形式\
  \ [8]。\n\n##### 用户设计方法\n\n由于用户相关问题可能变得显著，专家们强调了提高用户对区块链技术的认知和意识的重要性。因此，随着区块链技术的不断发展，用户的输入和参与对于以用户为中心的设计至关重要。大多数用户难以掌握和理解区块链技术的内在价值，这构成了一个巨大的准入门槛。虽然以用户为中心的设计需要大量时间和成本，但它通过最小化重新设计阶段，实现了高效开发，从而改善了开发人员对用户行为的理解。\n\
  \n用户有多种方式参与设计过程。用户可以通过访谈、焦点小组和现场观察做出贡献；可提前提取标准并规划高效的任务序列。此外，可通过可用性测试和问卷高效量化用户满意度和易用性。\n\
  \n在以用户为中心的设计方法中，可用性测试被公认为确定最终用户面临的具体困难的重要方法。随着技术变得更加复杂，可用性测试已成为产品和服务创建中降低开发成本和高效吸引客户的关键组成部分\
  \ [14]。\n\n##### 设计流程\n\n\n\n图 8.1 中描述的方法展示了当前的分类法如何也可用于在设计过程的各个阶段指导系统设计。是否将信任授权去中心化——或者不去中心化——是该过程的第一步。区块链常用于不需要单一可信授权的场景；因此，授权可以是完全或部分去中心化的。考虑到区块链的局限性，下一个主要决策是否将计算和数据存储划分给链上和链下组件。随后，必须做出关于区块链配置的若干设计决策，包括区块链类型、共识协议、区块大小和频率。图\
  \ 8.1 中的指标仅显示了几个潜在设计决策阶段中的一个。某些决策对可扩展性（区块大小和频率）、安全性（共识协议）、成本效益（区块链类型）和性能（如数据结构）有重大影响。最后，确定在何处部署基于区块链的系统模块至关重要\
  \ [25]。\n\n![图 8.1 设计过程。 ¶ 来源：[25]。](html/images/9781032078243_C008_001.jpg)\n\n\
  图 8.1 设计过程。 ¶ 来源：[25]。\n\n## 区块链应用设计：良好实践与考量\n\n设计区块链应用的良好实践始于保持一致性，尤其是在处理新用户体验时。在\
  \ DApp 中，一旦交易发布到区块链上，就无法撤销或取消；因此，应让用户知晓区块链的**不可逆性**。此外，在使用应用的每一步中都必须引导用户，因为这最终将帮助用户避免错误和因用户操作导致的挫败感。\n\
  \n如前所述，应用设计中的一个重要考量是用户反馈。如果在设计过程中忽视这一点，DApp 开发人员很可能会误判区块链应用中所需的重要用户需求 [11, 12]。\n\
  \n表 8.1 列出了设计区块链应用时应考虑的重要设计因素 [21]。\n\n表 8.1 区块链应用设计问题与考量\n\n| **区块链** 设计考量 | 属性\
  \ |\n| --- | --- |\n| 性能 | • 资源利用的低效性，如与工作量证明共识相关的高能耗。<br>• 实时输出的过度延迟。 |\n| 可靠性\
  \ | • 因不应出现单点故障，故需高可用性。<br>• 降低次生故障的概率。<br>• 数字货币汇率固有的高波动性。 |\n| IT 安全 | • 通过适当的非对称加密进行用户识别和认证。<br>•\
  \ 使应用能够追踪和溯源（数字产品记忆）。<br>• 适用的区块链适配访问控制工具和授权。 |\n| 可扩展性/可延展性 | • 由于区块大小常受限制，潜在的低可扩展性。<br>•\
  \ 每笔交易都在所有网络节点上广播，并需要广泛的数据流进行过滤和选择性处理。<br>• 可延展性依赖于用于脚本编写的图灵完备语言。 |\n| 兼容性/互操作性\
  \ | • 由于众多的客户端实现和开源代码，可实现高兼容性。 |\n| 容错性 | • 区块链交易保持不变，因此任何节点的故障对所有其他节点都是透明的。 |\n\
  | 服务质量 | • 服务质量 (QoS) 决定了系统可靠地提供服务的能力，以及令区块链节点满意的响应时间和吞吐量。<br>• 对于节点间的关键数据交易，服务质量是必须的。\
  \ |\n| 故障管理 | • 区块链的设计必须能够抵御与攻击相关的故障。<br>• 应建立系统以识别故障原因并启动适当的恢复计划，使区块链能自动从故障中恢复。\
  \ |\n\n## 总结与结论\n\n本章探讨了与设计区块链应用相关的指导原则和考量，具体而言，应用设计过程应从创建用户画像开始。接下来，应基于用户画像创建用户故事，以帮助定义应用的功能性（业务）需求。基于所需的功能性需求，技术需求和任务将随之被定义。此外，本章还讨论了当前用于设计和/或构建区块链系统去中心化应用\
  \ (DApp) 的各种框架、流程或方法。因此，本章的主要目标是为审计人员提供一个基本理解，即在进入下一章重点关注的开发阶段之前，在区块链应用的设计阶段应考虑的相关因素。\n\
  \n## 核心概念\n\n*   基于用户画像和用户故事，必须考虑许多基本设计考量。这些包括与应用是否需要是单体式或模块化、中心化或去中心化；或应用应侧重于用户一致性还是专业化相关的决策。\n\
  *   通常，在设计区块链应用时，保持一致性是一种良好实践。各类一致性包括视觉、功能、内部和外部一致性。\n*   DApp 软件工程的主要目标是确保项目协议定义明确。可使用多种方法开发去中心化应用。Ancile\
  \ 项目的主要目标是通过以安全且互操作的方式让客户和第三方访问电子记录，来解决数据保护和安全问题。本体驱动方法 (ODA) 是一种设计方法，旨在追踪供应链中的对象，同时使组织能够理解分散在多个数据库中的数据。ODA\
  \ 对 DApp 的设计和开发阶段均有用处。\n*   软件工程策略涉及使用 UML 模型来描述 DApp 的需求和设计。虽然模型驱动方法对区块链应用的设计阶段和行为有用，但基于模型驱动的方法不一定需要使用智能合约。用户参与对于以用户为中心的设计至关重要，这可通过用户设计方法实现。在用户设计方法中，用户可通过访谈、焦点小组和现场观察为设计过程做出贡献。\n\
  *   区块链的**不可逆性**应向用户说清楚。在应用使用期间，必须引导用户完成每一步。这将帮助用户避免代价高昂或耗时的失误。如果在设计阶段忽视用户反馈，DApp\
  \ 往往会失败。\n*   应用应让用户易于理解和使用。除非有令人信服的理由不创建功能精简的应用，否则应用的功能和设计方面通常应功能精简。用户界面是使应用尽可能易于学习和使用的第一步。\n\
  \n## 促进理解的活动\n\n利用本章获得的区块链设计知识，在您的组织中启动一个区块链应用设计项目。请考虑以下问题：\n\n\n\n\n# 区块链应用设计步骤\n\
  \n1.  **识别问题**：贵组织是否存在可用区块链应用解决的问题？请通过简述问题来构建问题陈述，并描述该问题如何通过区块链应用解决。请注意，问题陈述不必仅用一句话描述，但一个简短的段落足以构建有效的问题陈述。以下视频将为感兴趣的读者提供关于问题陈述制定的更多信息。标题：*Identify\
  \ the Problem* [`www.youtube.com/watch?v=FPfEciCFtPc&ab_channel=GreggU`](https://www.youtube.com)\n\
  \n2.  **梳理设计考量**：阅读章节 *Blockchain Design Guiding Principles and Considerations*（区块链设计指导原则与考量），列出与区块链应用设计相关的考量因素。在贵企业中，讨论的哪些考量因素应优先考虑？\n\
  \n3.  **定义用户角色与故事**：承接上述步骤，开发用户角色和用户故事，作为区块链应用设计的第一步。\n\n4.  **制定需求**：接下来，尝试在团队环境中制定区块链应用设计的功能性和技术性需求。\n\
  \n5.  **定义任务**：定义协助满足技术需求的任务。\n\n6.  **评估设计方法**：评估本章讨论的设计方法。哪一种（或哪几种）最适合已识别的用例？\n\
  \n7.  **参考案例研究**：参考区块链案例研究，以更好地理解组织对区块链应用的需求。\n\n## 参考文献\n\n*   Anwar, H. (2019,\
