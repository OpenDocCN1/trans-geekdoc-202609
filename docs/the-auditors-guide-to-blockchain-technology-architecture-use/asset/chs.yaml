  \ HTTPS 连接。<br>• 适用于保护 Web 浏览器与电子商务网站之间的通信，以及无线 Web 应用 [74]。 |\n\n##### 非对称密码学算法\n\
  \n\n\n\n#### 非对称密码学\n\n非对称密码学也称为公钥密码学。这种革命性的密码学思想由 Whitfield Diffie 和 Martin Hellman\
  \ 于 20 世纪 70 年代提出。Diffie 和 Hellman 认为，可能存在开发一种密码系统的可能性，其中包含两个不同的密钥。公钥用于明文的加密，而私钥用于将密文解密为明文\
  \ [73]。在这种技术中，发送方（Alice）使用接收方（Bob）的公钥加密秘密消息，接收方使用其私钥解密消息。公钥可以为所有人所知，但私钥仅为接收方所知，并需要受到保护。密钥通过数字签名进行认证。只要私钥保持完好，非对称密码学既方便又提供更高的安全性。Diffie-Hellman\
  \ 密钥交换是最流行的密钥分发方法之一 [58]。\n\n###### Rivest Adi Adleman (RSA) 算法\n\n`Rivest Adi Adleman\
  \ (RSA)` 算法由 Ron Rivest、Adi Shamir 和 Leonard Adleman 于 1978 年发明。RSA 作为一种密码算法被引入，取代了安全性较低的美国国家标准局（NBS）算法。RSA\
  \ 算法基于因式分解问题，该问题在于将两个大素数的乘积进行因式分解在实际中具有困难性 [58]。也使用不同的加密密钥；即公钥（非对称密钥）和私钥（对称密钥）。RSA\
  \ 算法涉及三个步骤，即密钥生成、加密和解密。\n\n###### Elgamal 加密\n\n`Elgamal` 加密由 Taher Elgamal 于 1984\
  \ 年开发。非对称密钥加密是基于 Diffie-Hellman 密钥交换原理建立的。与 Diffie-Hellman 算法不同，Elgamal 密码系统是一个完整的加密和解密系统，依赖于离散对数问题。Elgamal\
  \ 算法由三个组件组成：密钥生成器、加密和解密 [58]。\n\n###### 背包算法\n\n`Knapsack algorithm` 是最早的公钥密码系统之一，由\
  \ Ralph Merkle 和 Martin Hellman 于 1978 年发明。在背包密码系统中，也执行三个过程：密钥生成、加密和解密。一些公钥密码系统是基于背包（或子集和）问题提出的\
  \ [58]。由于其 NP（非确定性多项式时间）完全性的性质以及加密和解密过程的高速度，背包密码系统曾被认为是最有前途的密码系统之一。然而，大多数基于背包的密码系统被认为是不安全的，因为这些密码系统中的加密函数本质上是线性的。\n\
  \n##### 非对称算法比较\n\n表 2.3 强调了各种非对称算法的优缺点及其应用。\n\n表 2.3 非对称算法比较\n\n| 算法 | 密钥长度 | 优点\
