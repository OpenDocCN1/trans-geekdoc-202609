  \ R |\n\n## 总结与结论\n\n区块链技术无疑是一个革命性的概念。它有潜力改变许多行业开展日常业务活动的方式。随着时代的变迁，测试和尝试新技术以跟上\
  \ IT 行业标准是明智之举。\n\n本章讨论了多个组织用例，包括区块链如何作为灾难恢复规划中的工具，帮助最大限度地减少附带损害。具体而言，在事后环境中，区块链可用于验证完整性并确保企业资源的可用性。在合同管理方面，区块链可用于自动化采购流程，同时消除第三方验证。关于产品变现，区块链带来的优势是具有更低交易费用的无现金支付系统的可用性。最后，供应链领域也在将区块链技术融入其流程方面取得了巨大进展。\n\
  \n使用 `COBIT 2019` 等成熟框架实施区块链技术，可以为优化区块链组织用例的收益提供有效且高效的方法，同时也能优化项目风险和资源利用。\n\n##\
  \ 核心概念\n\n*   区块链技术可为企业灾难恢复提供诸多益处。区块链最伟大的属性之一是透明度，这反过来可以进一步在组织内培养责任感和问责制。区块链系统比其他记录保存系统安全得多，因为它是一个以避免单点故障为目标的加密安全分布式账本系统。\n\
  \n\n\n\n\n# 区块链在组织管理中的应用\n\n## 合同管理\n组织中的合同管理围绕谈判采购条款和条件展开。采购欺诈发生在多个阶段，区块链通过自执行智能合约有可能消除此类欺诈。区块链还可以消除第三方交易费用。区块链的不可变性为合同条款和条件的任何修订提供了防篡改的审计追踪。\n\
  \n## 供应链管理\n为了赢得消费者信任并实现价值主张，制造商和商品商似乎都欢迎去中心化的分布式账本，批发和零售实体均可使用该账本以获得最佳效率、溯源性、透明度和业务便利性。区块链可对供应链产生重大影响的领域包括：最大限度减少假冒伪劣产品、降低经营成本，以及更有效的合规和质量管理。\n\
  \n## 资产管理\n资产管理的两大主要目标是长期增值客户资产，以及有效缓解客户投资组合风险。区块链技术通过实现开放协作（使添加新业务合作伙伴变得更容易），可提供多种解决方案以适应资产管理行业快速而根本的变化。通过采用区块链进行资产管理，技术确保了更高的一致性，因为所有数据块必须根据共识由所有处理节点验证。区块链技术的分布式结构还将为资产管理行业内的\
  \ B2B 交易带来更高的运营效率。\n\n## 身份与访问管理 / 安全性\n第三方供应商有权访问客户记录，将该信息转租给其他方会构成信息泄露威胁。区块链技术消除了对中介的需求，可在不透露任何身份信息的情况下，通过加密方式授权/认证特定主体，从而弥补安全漏洞。区块链的加密属性确保数据无法被未授权方访问。不可变的区块链安全且防篡改，减少或消除了洗钱等犯罪的机会。反洗钱（AML）监控可通过智能合约实现自动化。由于完整的交易历史实时更新，审计可更有效地执行。\n\
  \n## 基于 COBIT 2019 框架的实施\n使用 COBIT 2019 框架实施区块链，通过高效的治理和管理提供价值。实施区块链前应考虑若干挑战。这些缺点包括成本、组织内部接受度、易用性缺乏以及互操作性缺乏。COBIT\
  \ 2019 方法采用持续改进生命周期。该周期包含三个组件：持续改进、变更赋能和项目管理。遵循 COBIT 实施阶段可更有效地完成成功的区块链实施。\n\n#\
  \ 进一步理解活动\n\n有兴趣为组织开发区块链用例的读者，建议获取 ISACA 的 *COBIT 2019 Framework: Introduction and\
  \ Methodology* 作为通用 IT 治理和管理学习指南，以创建区块链业务案例。\n\n请特别关注 第 9 章（*“Getting Started with\
  \ COBIT: Making the case”*），熟悉必须作为区块链业务案例一部分的各种考量因素。在进一步评估组织中区块链系统的实施时，请考虑以下问题：\n\
  \n*   区块链实施能以哪些方式为组织提供更多“价值”？\n*   区块链实施可能缓解组织中哪些可能的业务挑战和“痛点”？\n*   可能会遇到哪些具体的区块链实施挑战？\n\
  *   区块链实施相关的“现状”如何？“未来状态”如何？该项目的愿景是什么？\n*   项目风险要素将如何管理？\n*   从成本/收益角度来看，区块链实施项目将如何评估？\n\
  *   谁将在组织中“倡导”（应为高层管理人员且为该计划的主要支持者）区块链实施项目？\n\n## 参考文献\n\n*   Mcisaac, J., Brulle,\
