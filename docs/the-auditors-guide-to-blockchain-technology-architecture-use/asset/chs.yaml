  \n#### 表 13.4 系统级攻击和最佳实践\n\n| **系统级攻击** | **适用攻击** | **最佳实践** |\n| --- | --- | ---\
  \ |\n|  | 整数/缓冲区溢出攻击 | • 开发人员应使用地址空间布局随机化（ASLR）和位置无关代码（PIE） [[10]](#ch21.xhtml#r456)。\
  \ |\n|  | 时间戳攻击 | • 使用节点的系统时间代替网络时间，以确保区块的上限得以保持。<br>• 在时间戳的情况下，应仅使用受信任的对等节点 [[22]](#ch21.xhtml#r468)。\
