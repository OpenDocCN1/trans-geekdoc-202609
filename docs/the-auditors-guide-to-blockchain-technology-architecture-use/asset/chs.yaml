  \ | [`ipfs.io/`](https://ipfs.io) |\n| **Ganache** | [`www.trufflesuite.com/ganache`](https://www.trufflesuite.com)\
  \ |\n| **Mist** | [`github.com/ethereum/mist/releases`](https://github.com) |\n\
