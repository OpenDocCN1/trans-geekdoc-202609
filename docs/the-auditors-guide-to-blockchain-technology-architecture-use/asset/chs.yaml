  \n\n\n\n\n# 12 区块链风险、治理合规、评估与缓解\n\nBikramjit Pandher, Manoj Kumar Nagavamshi, Poojaben\
  \ Prajapati and Vijay Kundru\n\nDOI: `10.1201/9781003211723-12`\n\n## 摘要\n\n本章讨论了总共十七种与区块链相关的风险、四项主要法规/标准以及十项基于\
  \ COSO 框架的区块链良好实践。本章呈现的风险、法规和良好实践应能使鉴证专业人员开展更相关、更有效的区块链相关风险评估。\n\n本章涵盖的主题包括：\n\n\
  *   **高层风险管理考量，例如：**\n    *   账本透明度风险\n    *   安全风险\n    *   运营风险\n    *   应用开发风险\n\
  \    *   加密货币与支付风险\n    *   监管合规风险\n*   **部分主要监管合规要求概述，包括：**\n    *   PCI DSS\n\
  \    *   HIPAA\n    *   GDPR\n    *   PIPEDA\n*   **基于 COSO 框架的区块链良好实践探讨**\n\n随着区块链技术的广泛应用，近年来报告了各类攻击事件。*Slowmist\
  \ Hacked* 报告称，2020 年发生了 122 起区块链相关攻击，造成总经济损失超过 37 亿美元。大多数攻击针对区块链的三大主要应用——加密货币交易所、区块链钱包和基于以太坊平台的去中心化应用\
  \ [10]。尽管区块链仍是一项年轻的技术，但该技术的快速发展伴随着一些安全风险。区块链相关的安全风险可能源于任何内部因素或外部实体 [21]。\n\n## 区块链技术风险\n\
  \n区块链通过将数据分布在多个节点上来存储数据，存储在账本上的数据可能被节点运营者访问。与区块链技术使用相关的潜在责任风险主要有三大类，即账本透明度、安全和运营风险。表\
  \ 12.1 显示了与区块链相关的主要风险及其子组成部分。\n\n### 表 12.1 主要区块链风险\n\n| **主要风险类别** | **风险子组成部分**\
