  \ and Evolution, 139–150.\n\n# 11 区块链系统实现\n\nBharghava Sai Nakkina, Deepthi Gudapati,\
  \ Naga Venkat Palaparthy and Sai Sreenath Sadupally\n\nDOI: [10.1201/9781003211723-11](http://doi.org/10.1201/9781003211723-11)\n\
  \n## 摘要\n\n本章重点关注区块链技术的实现层面。首先简要讨论了一些潜在的组织用例，例如区块链技术在灾难恢复、合同管理、产品变现、供应链监控、资产管理和合规管理中的应用。接着，以\
  \ `COBIT 2019` 实现方法为框架，本章介绍并讨论了 10 个通用的 IT 实现挑战；随后通过概述角色与职责，以及每个阶段的描述、目标、输入和输出，引导读者了解\
  \ `COBIT 2019` 实现的七个阶段。有意使用 `COBIT 2019` 实现方法的读者，强烈建议查阅 ISACA 网站 (ISACA.org) 上提供的多份\
  \ `COBIT 2019` 相关出版物，包括 *COBIT 2019 Implementation Guide*、*COBIT 2019 Design Guide*\
  \ 和 *COBIT 2019 Governance and Management Objectives* 指南，因为本章旨在提供区块链实现考量因素的高层级讨论。\n\
  \n## 简介\n\n在探讨区块链实现考量因素之前，下文将介绍一些内部实现用例，即区块链作为企业灾难恢复、产品代币化、供应链监控和资产管理的补充或增强手段的价值。下一节将介绍一些基于区块链公司的用例考量，随后深入探讨区块链平台的实现层面。\n\
  \n## 灾难恢复\n\n凭借其前沿技术应用，区块链技术可集成到 IT 灾难恢复 (DR) 计划中，并在紧急情况下发挥有效作用 [1]。灾难恢复是指记录、收集、保存和向公众及政府传播信息的过程，以便在紧急情况下做出迅速高效的决策。现有的应急处理机制在流程上已达到一定的自动化水平，但受阻于各独立工作机构所维护信息缺乏高效共享、一致性和完整性\
  \ [2]。灾难期间面临的一些挑战是各工作流程间的低效，这归因于活动的低可见性、缺乏透明度和信任，以及资源利用不当 [3]。\n\n灾难恢复规划和业务连续性规划是帮助组织为灾难发生做好准备的过程。灾难可能由自然灾害引发，如地震、海啸和洪水，也可能由人为事件引起，如安全漏洞、拒绝服务攻击以及因蓄意破坏导致的停电等。在当今的技术时代，IT\
  \ 系统在组织的业务运营中扮演着重要角色，因此需要确保这些系统持续有效且不间断地运行。运营连续性是优质业务重要属性的首位，因为非计划停机或服务突然中断会对组织造成巨大的财务和声誉影响\
  \ [4]。\n\n有时，企业高管会基于地理位置假设其业务是安全的，因为某些地区比其他地区更不易发生自然灾害——地震、洪水、风暴等。遗憾的是，并非所有灾难都以自然灾害的形式出现。灾难可能涉及管道爆裂和停水、网络攻击、停电或火灾。事实上，根据世界经济论坛\
  \ (WEF) 的一份报告，网络攻击的威胁排名第三，仅次于极端天气事件和自然灾害。WEF 报告特别强调了勒索软件这一网络威胁，并指出 64% 的恶意钓鱼邮件包含文件加密恶意软件\
  \ [32]。企业也因安全顾虑面临重大挫折。黑客通过窃取信息和/或部署勒索软件、后门或特洛伊木马等恶意程序进行攻击。这些活动中泄露的数据被用来向公司勒索钱财。这些灾难可能造成足以中止日常运营或摧毁企业的破坏。灾难恢复计划侧重于\
  \ IT 系统的连续性，而业务连续性计划则保证在危机或灾难时期业务运营的整体连续性 [4]。\n\n根据德克萨斯大学的数据，“遭受灾难性数据丢失的公司中有 94%\
  \ 无法生存——43% 永不重新开业，51% 在两年内倒闭”。许多灾难是不可避免的；然而，某些灾难的风险可以得到缓解。缓解这些风险的计划是将重大基础设施中断的影响降至最低。缺乏适当的规划将大幅增加恢复工作所投入的资源\
  \ [5]。\n\n灾难恢复计划 (DRP) 是一份至关重要的业务文档，描述了组织如何在非计划事件发生后迅速恢复工作。灾难恢复计划是业务连续性计划的重要组成部分，旨在协助公司恢复系统功能并防止数据丢失，以确保在事件发生后平稳恢复运营。主要目标是在关键系统的停机成本与业务连续性成本之间取得平衡。对于企业而言，灾难恢复是重中之重\
  \ [4]。\n\n### 高效灾难恢复计划的要素\n\n灾难可能发生在任何地方，对该地区人口造成严重打击。对企业而言，停机的影响往往更为显著。因此，组织应制定能够应对各类灾难的\
  \ DRP。高效 DRP 的典型要素应包含以下内容：\n\n*   **灾难恢复团队**：组织应组建团队制定灾难恢复计划。该团队负责创建、实施和维护 DRP。DRP\
  \ 应明确团队成员，描述各成员的角色并包含其联系信息。在发生灾难或紧急情况时，DRP 还应指明应联系谁。灾难发生时，所有员工应得到妥善通知，并能理解 DRP 的要求及其自身的职责\
  \ [6]。\n\n\n\n\n#### 灾难恢复计划组成部分\n\n*   **全面清单**：需对组织内目前正在使用的所有硬件、应用程序和软件进行全面的资产盘点。接下来，应根据系统对运营的关键程度以及发生中断时系统应恢复的顺序对其进行优先级排序。每台设备的信息——如序列号、技术支持信息和联系详情——也应包含在\
  \ DRP 中。还应记录一份包含维护对基于云的程序、CRM 系统或数据备份的访问所需的访问代码和密码的清单 [[7]](#ch19.xhtml#r398)。\n\
  \n*   **灾难风险的识别与评估**：灾难恢复团队应识别并评估组织面临的风险。这些识别和评估过程应涵盖自然灾害、人为紧急情况和与技术相关的事件。这将协助团队评估每组应用程序可接受的恢复点目标\
  \ (RPO) 和恢复时间目标 (RTO)。需要确定恢复计划和资源，以确保能在预定且适当的时间线内从灾难中恢复 [[8]](#ch19.xhtml#r399)。\n\
  \n*   **沟通计划**：在应对和恢复任何紧急情况、危机事件或灾难时，沟通至关重要。常规通信手段在灾难期间往往失效。为了联系员工，沟通团队需要制定并实施适当的协议和业务流程，以及应急预案，以防电子邮件平台、手机信号或电话线路中断。建立书面参考框架可确保组织、员工和利益相关者之间成功进行灾后响应和协作\
  \ [[7]](#ch19.xhtml#r398)。\n\n*   **备份与异地存储程序**：DRP 协议应确定备份什么、如何执行备份、备份地点以及备份频率。备份所有敏感应用程序、设施和记录至关重要。最新的财务报表、纳税申报表、当前的员工名单及其联系详情，以及库存、客户和供应商名单，都是需要通过定期系统备份来保护的数据的典型例子。日常运营所需的关键物资——如用于采购或薪资发放的公司支票——除\
  \ DRP 的纸质副本外，还应存放在异地位置 [[6]](#ch19.xhtml#r397)。\n\n*   **SLA 与敏感信息**：组织应与承接外包项目或技术的第三方公司保持服务级别协议\
  \ (SLA)。SLA 还应定义在紧急情况或灾难发生时预期的服务水平。与 DRP 启动时机相关的协议，以及确保数据保护的操作和技术程序，也应记录在案并妥善保存\
  \ [[8]](#ch19.xhtml#r399)。\n\n*   **DRP 的测试与维护**：灾难恢复规划是一个不断演进的过程，因为威胁和紧急情况在持续变化。一旦制定了灾难恢复计划，年度\
  \ DRP 审查和更新也应成为 DRP 维护流程的一部分。建议组织定期测试 DRP，以评估应急计划中记录的程序 [[6]](#ch19.xhtml#r397)。\n\
  \n总之，灾难恢复计划应清晰简练，重点关键在于恢复服务所需的关键活动/职能。DRP 应定期进行测试、审查和更新。DRP 团队应始终牢记：“就灾难恢复而言，计划的好坏取决于其上一次测试的效果”\
  \ [[8]](#ch19.xhtml#r399)。\n\n### 区块链技术在灾难恢复中的应用\n\n区块链技术可以成为组织灾难恢复的有效工具。任何恢复工具的主要目的是验证受损系统的完整性和资源的可用性。在很大程度上，在发生灾难时，区块链的作用可归因于完整性。以下章节描述了区块链如何在灾难期间帮助企业。\n\
  \n#### 数据完整性验证\n\n当组织遭遇灾难时，组织数据丢失的可能性非常高。文件系统可能损坏，某些服务器可能被毁，计算机系统可能报废。这些事件可能导致大量数据被销毁。当前受损的系统无法再被依赖以在事后正常运行。在这种情况下，将当前系统的完整性与通常设在灾难恢复站点的备份系统进行对比验证非常重要\
  \ [[9]](#ch19.xhtml#r400)。\n\n与其将大块数据写入区块链，不如计算整个系统的数学哈希值并将其存储在区块链上。该数学哈希值可与受损系统的数学哈希值进行比对。如果哈希值匹配，则无需从备份中恢复系统。这节省了时间和精力，恢复操作可转向其他工作，如灾难预防\
  \ [[9]](#ch19.xhtml#r400)。\n\n#### 可用性\n\n所需资源的可用性对于确保日常业务运营的连续性非常重要。灾难发生时，往往缺乏所需资源；这也会影响\
  \ IT 运营。例如，如果公司服务器遭遇拒绝服务 (DoS) 攻击，试图访问服务器的用户发出的任何请求都会被拒绝。在这种情况下，需要一台备用服务器来处理这些请求，同时将受攻击的服务器下线。这确保了资源的可用性和业务运营的持续进行\
  \ [[9]](#ch19.xhtml#r400)。\n\n使用区块链有助于数据的可用性。由于区块链是一种分布式账本系统，每个存储块（包含资源）的多个副本可以存储在不同位置。如果一个块发生故障或被篡改，其他块可用于继续运营\
  \ [[9]](#ch19.xhtml#r400)。\n\n#### 内存纠错\n\n内存纠错是一种常见的内存修复技术。在大多数情况下，使用纠错码 (ECC)\
  \ 来修正损坏的内存。在事后环境中，系统的重新校准非常重要；这包括检查计算机的数据存储是否存在 n 位损坏。数据损坏是由于从内存读取/写入数据时发生的无意单比特错误导致的。可以生成纠错码并将其存储在区块链上。在区块链上，该代码可用于检测和纠正错误。如果数据损坏，可使用区块链进行数据纠正\
  \ [[9]](#ch19.xhtml#r400)。\n\n#### 云存储\n\n在传统的云服务设置中，机密数据存储在中心化数据库上。一旦发生成功的网络攻击，中心化数据库会为黑客提供一个完美的“信息窝点”，所有数据集中在单一位置。如果没有分布式系统，黑客窃取数据所需的精力更少，因为所有数据都集中在一个位置，导致数据机密性遭到巨大破坏。区块链云存储解决方案提供了一种以分布式和去中心化方式存储数据的场所。`Salesforce`\
  \ 已启动了一个名为 `Salesforce Blockchain` 的类似概念，该概念构建在其 CRM 软件之上，利用智能合约和基于区块链的数据共享 [[10]](#ch19.xhtml#r401)。\n\
  \n## 合同管理\n\n\n\n\n## 合同管理\n\n合同管理——有时被称为采购管理——是组织中一项至关重要的流程，涉及与谈判合同相关的条款和条件。从本质上讲，合同管理流程允许多个参与方为共同目标而努力。如果任何一方无法履行其承诺，合同管理也会要求各方承担责任。对条款和条件的误解和欺骗是合同欺诈的主要原因。\n\
  \n### 合同管理中的欺诈\n\n采购系统是公共或私人实体采购商品和服务所涉及的流程、程序和实体的集合。有效采购政策的主要目标是实现资金的最大价值。采购流程必须杜绝欺诈至关重要。在不同的合同管理阶段，采购欺诈可能以多种方式发生。根据*舞弊审查师协会*（ACFE）的说法，欺诈主要发生在四个主要阶段\
  \ [[11]](#ch19.xhtml#r402)：\n\n*   **招标前阶段**：采购实体确定其需求并制定投标规格。这些规格反过来有助于理解和确定应将投标授予谁。欺诈可能以多种方式发生在此阶段。此类欺诈实例包括投标裁剪、投标拆分或不合理的采购方式。进一步解释，投标裁剪会导致有利于特定承包商的非竞争性投标。当合同方制定有利于某一承包商的投标规格时，就会发生投标裁剪。这导致非竞争性投标，因为一家投标承包商将比其他承包商更具优势。最后，投标拆分导致在未遵循适当程序的情况下将合同分包和/或转包。\n\
  \n*   **招标阶段**：在此阶段，采购实体准备招标文件并向投标人发出通知。投标人随后可提交投标以供评估。欺诈通过投标操纵、泄露其他投标人提交的投标数据或投标承包商之间的串通发生在此阶段。\n\
  \n*   **投标评审与授标阶段**：在此阶段，通过与投标人的讨论和/或进一步谈判来评估提交的投标。在做出决定前，投标人有机会重新评估其提交的投标。欺诈可能通过投标操纵（低价倾销）和/或泄露其他投标人提交的投标数据以使某些投标人比其他投标人更具优势而发生在此阶段。\n\
  \n*   **授标后与管理阶段**：在此最后的投标阶段，合同授予提交最具竞争力投标的投标人。合同修改有时发生在此阶段。欺诈可能通过成本虚报或变更指令滥用发生在此阶段。成本虚报是指承包商向合同方收取严重虚高的材料和/或人工成本。变更指令滥用是指承包商对授标合同实施欺诈性变更的情况。这些欺诈性变更是对合同所做的修正，会影响合同的范围。\n\
  \n前几节有助于演示欺诈如何在合同管理的各个阶段实施。因此，对公平投标流程和高效合同管理的需求可以通过实施区块链技术来解决，这提供了一种有效的方式来帮助缓解这些挑战。\n\
  \n### 区块链作为合同管理的工具\n\n区块链技术可以通过使用具备自我执行能力的智能合约来改变传统合同的结构。智能合约可以跟踪履约情况，且几乎不需要外部方的干预。除了防止欺诈，区块链的自主属性还可以降低运营成本，并使参与实体之间的合作更加容易和紧密。智能合约还消除了合同执行所需的中间人和第三方\
  \ [[11]](#ch19.xhtml#r402)。\n\n此类智能合约的代码编写方式是：如果满足一个条件（或失败），则将执行后续步骤。与合同法的所有方面一样，参与方必须同意特定的条款和条件。智能合约部署在区块链上，可由多方执行，结合智能合约的自动化特性，这也提供了审计追踪。审计追踪包含草稿版本（针对合同的每次修订），这些是合同文档的顺序版本和重复交易。该审计追踪有助于跟踪修正\
  \ [[12]](#ch19.xhtml#r403)。\n\n图 11.1 描绘了合同管理如何在以太坊区块链平台上进行管理：\n\n![图 11.1 自我执行合同示例。\
  \ ¶ 来源：[13]。](html/images/9781032078243_C011_001.jpg)\n\n图 11.1 自我执行合同示例。 ¶ 来源：[[13]](#ch19.xhtml#r404)。\n\
  \n如图 11.1 所示，智能合约阶段如下：\n\n*   **智能合约创建阶段**：在此阶段，合同所有者创建智能合约并应用哈希函数生成合同哈希。\n\n* \
  \  **智能合约签署阶段**：在此阶段，合同的参与签署人连同智能合约所有者/创建者使用其以太坊账户的私钥对合同哈希进行签名。这导致所有参与者各自的以太坊数字签名的创建。在此阶段，智能合约的三个主要要素被创建，即：(a)\
  \ 合同哈希，(b) 参与者的数字签名和 (c) 时间戳。\n\n*   **智能合约部署阶段**：在此阶段，生成的智能合约随后被部署到以太坊区块链网络上 [[13]](#ch19.xhtml#r404)。\n\
  \n图 11.2 说明了典型合同如何作为以太坊区块链上合同管理流程的一部分被签署。加密哈希应用于数字合同，随后使用以太坊账户的私钥生成数字签名。然后将合同部署到以太坊网络，由网络中的所有节点确认，从而被见证、发布和验证。要验证合同，需从网络获取其数字签名。将以太坊账户的公钥应用于签名以获得哈希。将获得的哈希与原始哈希进行比较，如果两个哈希相同，则合同验证通过\
  \ [[13]](#ch19.xhtml#r404)。\n\n![图 11.2 签署和验证合同。 ¶ 来源：[13]。](html/images/9781032078243_C011_002.jpg)\n\
  \n图 11.2 签署和验证合同。 ¶ 来源：[[13]](#ch19.xhtml#r404)。\n\n总之，在合同管理中使用智能合约技术将消除第三方交易费用，因为智能合约是具有跟踪交易能力并基于合同代码（也称为代码即法律）解决合同纠纷的自我执行实体。目前，包括*埃森哲*、*Icertis*、*Mindtree*\
  \ 和 *Konfidio* 在内的多个组织使用智能合约进行合同管理。例如，埃森哲使用 R3 Corda 技术和 Microsoft Azure 为合同提供区块链\
  \ [[30]](#ch19.xhtml#r421)。Icertis 的区块链框架在许可链和非许可链上部署合同 [[14]](#ch19.xhtml#r405)。\n\
  \n\n\n\n如前所述，区块链的一项关键特性是消除第三方交易费用。通过实施区块链，通常不再需要中介机构，因此也就没有与中介相关的费用或加价。此外，由于区块链是数字化且分布式的，数据可永久检索。由于智能合约是自动执行的，它们能够跟踪义务，从而取代人工审核。最后，大多数争议可根据合约规则自动解决\
  \ [13]。\n\n## 产品分发/变现\n\n第四次工业革命——也称为工业 4.0——是数据数字化的新时期，它推动了数据驱动型商业模式的增长及其适用技术的使用。分销行业——包括批发和零售——被定义为实体店或在线仓库，它们作为生产商和最终客户之间的中介。在转型过程中，该行业面临多重挑战，如客户偏好的转变、竞争加剧、数字/电子商务的颠覆以及房地产价格上涨\
  \ [15]。\n\n在当前的数字化时代，新的市场和供应链中的技术创新帮助企业更好地管理物流挑战以保持竞争力。为了赢得消费者信任并实现价值主张，制造商和商品商似乎都欢迎一种去中心化的分布式账本，批发和零售实体均可使用它来获得最佳效率、溯源、透明度和业务便利性\
  \ [15]。\n\n以下是区块链可能对产品销售和分发流程产生重大影响的关键领域：\n\n*   **客户支出**：使用传统银行系统意味着进行/接收涉及中介费用（如交易费和/或佣金）的定期付款。通过使用区块链系统，汇款相关成本可大幅降低。例如，从加拿大向亚洲汇款\
  \ `$100` 的手续费可能高达 `$4`，而使用区块链技术仅需几美分 [15]。\n\n*   **减少假冒伪劣产品并带来透明度**：区块链可用于维护保管日志记录，追踪物流过程中的每一步，确保供应链完整性。这对许多企业大有裨益，例如制药公司，假冒药品往往是一个主要问题\
  \ [15]。\n\n*   **降低业务成本**：区块链技术通过一次扫描提供所有所需信息，有助于减少产品供应链中的行政文书工作和运营成本 [15]。企业可能能够最大限度地减少在汇总、修改和交换数据方面的人工介入需求，从而使监管报告和审计记录更易于处理，减少人工干预。因此，员工将能够专注于增值任务\
  \ [31]。\n\n*   **合规与监管指南**：区块链的实施有助于追踪和监控大规模产品召回或缺陷产品。区块链技术还可以帮助降低产品的外部故障成本，即产品故障和召回给企业带来的成本\
  \ [15]。\n\n多年来，由于区块链技术能提供的潜在效益，其在各行业的实际应用不断增加。例如，在 COVID-19 大流行期间，泰国最大的音乐活动之一——*Mystic\
  \ Valley*——使用代币实现了 2020 年 11 月为期三天的全球活动的无现金支付。采用基于区块链的无现金支付的初衷是，因实施社交距离规则而限制客户接触\
  \ [16]。\n\n## 供应链管理\n\n由于假冒产品涌入某些市场数量不断增加，导致随之而来的产品质量丑闻，供应链行业内质量管理的重要性是一个重要考量因素。这一问题的根源似乎在于：传统的中心化信任体系似乎无法完全解决三大主要挑战，即：(a)\
  \ 供应链成员的自身利益；(b) 制造过程细节的不对称性；(c) 质量检测成本和技术局限性 [17]。\n\n正如第 6 章所述，区块链技术的引入为供应链质量管理带来了一些创新能力。首先，采用区块链技术解决供应链管理中缺乏信任的问题，已成为一个更易管理的课题。通过使用自动化质量管理智能合约，有可能开发出一种自动化智能系统，因为区块链技术将企业的治理模式转变为去中心化模式\
  \ [17]。迄今为止，沃尔玛、马士基和 IBM 等多家大型企业已将区块链技术应用于各自的供应链。例如，马士基和 IBM 正致力于跨境、跨方交易，旨在通过使用区块链技术提高流程效率\
  \ [18]。沃尔玛加拿大的 `DL Freight` 区块链管理发往 60 多家运输承运商的货运发票和付款。沃尔玛还一直在利用区块链技术，通过更好的区块链追踪能力来更好地管理食品新鲜度\
  \ [19]。\n\n### 区块链在当今供应链中的价值\n\n在大多数情况下，当今的供应链在没有区块链技术的情况下也能大规模运行。即便如此，供应链领域仍对该技术着迷。这项技术还激发了大量论文，并鼓励现有\
  \ IT 实体和初创公司推出有前景的试点项目，如交易认证以及记录保存的准确性和有效性。沃尔玛测试了一款旨在追踪从美国运往中国的猪肉货物的应用程序，并采用区块链技术进行食品追踪。Provenance——一家英国初创公司——最近筹集了\
  \ `$800,000` 资金，将区块链技术融入食品追踪中。它最近在东南亚供应链中率先实现了金枪鱼的追踪 [18]。\n\n## 利用区块链进行资产管理\n\n\
  资产管理是指代表他人管理各类资产的过程。简而言之，资产管理流程有两个主要目标：长期增值客户资产，以及有效缓解客户投资组合风险。资产管理企业包括但不限于银行、投资管理公司，如共同基金或投资咨询服务等。所管理的资产可能是金融资产、公共资产、基于信息系统的资产，甚至是设备。根据企业金融学会\
  \ (CFI) 的说法，所有企业都需要密切关注其所有资产，无论是流动性还是资本性质的。企业需要维护一份准确且更新的资产清单，其中包括每项资产的位置、状况、取得成本、税基和用途，以有效管理这些资产。准确的资产管理有助于企业更有效地识别和管理资产风险，同时确保资产摊销率得到正确计算，以及丢失、损坏或被盗资产能准确、及时地从公司财务记录中移除\
  \ [20]。第 5 章更详细地讨论了区块链在金融服务中的用例。\n\n### 区块链作为资产管理解决方案\n\n\n\n#### 区块链的分布式账本技术拥有多种解决方案，可适应资产管理行业快速而剧烈的变化，具体如下：\n\
  \n*   **实现开放协作**：区块链允许创建一个涉及第三方（如服务或解决方案提供商）的系统，从而进一步促进资产管理的开放协作活动。简而言之，区块链技术使添加新业务合作伙伴的任务变得更加容易。\n\
  \n*   **交易透明性与不可篡改性**：由于区块链交易不可变且防篡改，资产管理数据可在保持数据完整性的同时安全、透明地共享。\n\n*   **通过共识提高一致性**：区块链的分布式账本确保不存在不一致的记录，因为所有数据块都必须由所有处理节点根据商定的共识方法进行验证\
  \ [21]。\n\n*   **提高运营效率**：区块链技术的分布式结构为资产管理行业内的 B2B 交易提供了显著的效率提升。考量运营效率提升的主要因素是区块链基础设施本身。组织无需彼此持续发送信息，区块链参与者只需更新其当前的区块链状态，即可获取最新的区块链交易更新\
  \ [22]。\n\n*   **面向金融服务提供商的客户准入与了解你的客户 (KYC) 活动**：客户身份核查和准入活动可以说是在高度监管的资产管理行业中耗时最长的任务。验证新客户的身份、资产所有权、资金来源、国籍和风险概况以及投资适配性信息可能需要数天甚至数周。区块链还能促进更快的信息共享。由于区块链节点分布在不同组织中，KYC\
  \ 活动注定会像当前的消费者或企业信用检查一样普遍 [22]。区块链为金融服务提供商组织带来的其他益处可能包括更快的交易清算和证券交易结算、更有效的经纪商/交易商合规，以及通过智能合约大幅降低客户和资产管理实体的交易费用。第\
  \ 5 章将更详细地讨论这些问题。\n\n## 区块链在数据控制、安全、法律合规与保证中的应用\n\n除了区块链在各个领域提供的各种益处外，还有其他值得讨论的优势。区块链提供的一些关键特性包括数据控制、安全、法律合规和保证（审计）。这些益处将在下文讨论。\n\
  \n### 数据控制\n\n企业处理大量数据，如客户记录，包括个人身份信息 (PII) 或公司的内部和/或专有信息，这些通常是各类信息泄露的主要目标。当信息在组织的多个组织层级和系统层级间流动时，可能会“从缝隙中渗漏”。Facebook、Google\
  \ 或 Amazon 等中心化组织对消费者数据拥有相当大的控制权。这种控制权不在实际用户手中，而在组织手中，公司可随意利用。当第三方供应商创建拥有此类敏感信息间接访问权限的服务时，隐私、安全和透明度问题会加剧。这些公司与其关联方的运营不透明，让客户蒙在鼓里。区块链提供了一种去中心化解决方案，可对第三方身份进行加密验证。这最终将控制权交还给用户，因为它消除了授权或认证特定主体所需的中介\
  \ [23]。\n\n### 安全\n\n区块链有助于修复一些安全漏洞，通过提高弹性、加密、审计和透明度，从而解决信息安全的 CIA 三要素。区块链的全面加密确保数据无法被未授权方访问；这是中间人攻击的完美解决方案。区块链还可用作即时通讯应用和社交媒体平台中端到端加密的替代方案，通过保护用户的元数据来实现数据安全。这些元数据随机分布在网络中，避免了所有数据在单一点积累。围绕安全通讯的安全性仍在探索中，未来可能会取得重大进展\
  \ [24]。\n\n### 法律合规\n\n智能合约可编写特定条件，当满足其预定义标准时可自动执行。这消除了中介审查和执行合同的需求。区块链可用于土地登记程序，其中土地契约信息可在所有各方均已预先认证的账本上访问。人口普查报告、死亡记录或犯罪活动等公共记录也可通过区块链进行维护。\n\
  \n区块链提供了一个安全且防篡改的数据库。这有助于减少欺诈和洗钱等犯罪，而这些犯罪的防范对 KYC 和反洗钱 (AML) 至关重要。智能合约可自动化 AML 监控流程并提供实时更新\
  \ [25]。\n\n### 保证\n\n区块链有助于提供保证基线，可大幅减少传统审计任务。完整的交易历史或数字资产交换记录实时更新，并透明地提供给所有各方，形成有条理的可审计记录。由于交易通过前一个区块的哈希值相互链接，篡改几乎是不可能的。区块链的不可篡改特性确保欺诈和洗钱活动得到遏制\
  \ [26]。\n\n## 区块链实施挑战\n\n在探讨了区块链为日常生活做出贡献的几种方式后，很自然会问：“我们如何实施区块链技术？”。然而，答案并不那么简单。区块链已成为关注焦点，尤其是随着比特币和以太坊等加密货币的当前流行。尽管如此，区块链技术仍处于起步阶段。因此，区块链尚未在\
  \ IT 行业得到广泛采用。原因如下：\n\n*   **实施成本**：对于任何组织迁移到新技术解决方案，首要考虑的是实施成本。新区块链解决方案相关的费用是否会干扰组织内为其他\
  \ IT 项目分配的预算？是否会阻碍任何正在进行的项目？实施过程中是否存在隐性成本？在向区块链解决方案过渡时，确保资金充足至关重要。合适区块链解决方案的选择、实施和优化应经过周密规划，以避免过高的实施成本。\n\
  \n*   **组织内部的变革阻力**：高层管理批准和利益相关者对新 IT 项目的接受并非易事，因此需要所有利益相关者都支持实施区块链解决方案的计划。利益相关者可能因对实施后区块链收益能否实现存疑而反对实施区块链技术。如果想法被接受，另一个考量因素是组织最终用户对从“我们现在的做事方式”向增强版“区块链做事方式”过渡的反应。\n\
  \n\n\n\n\n## 区块链实施考量\n\n*   **培训考量**：在部署区块链解决方案之前，员工必须接受充分培训以使用适当的区块链框架。管理层应优先考虑从实施团队向员工的知识转移。这确保了新工作流投入使用后不会出现重大问题。有时，培训成本和流程未得到充分考虑，这反过来会减缓对变革的适应\
  \ [\\[27\\]](#ch19.xhtml#r418)。\n\n*   **易用性缺失**：如果提议的区块链解决方案不充分且与当前整体工作流不兼容，它很可能会产生易用性缺口，从而给最终用户带来新的挑战。如前所述，此类问题可能导致对变革的抵制或新技术的严重使用不足。此处的最佳建议是确保在实施的每个阶段都仔细考虑最终用户的顾虑、反馈和建议。\n\
  \n*   **数据隐私**：在实施期间和实施后，确保数据不暴露于潜在泄露风险中是一项重大责任。利益相关者可能会表达担忧，例如实施区块链等新 IT 解决方案导致网络安全威胁的可能性增加。此类担忧需要在规划和实施阶段得到充分讨论和解决。\n\
  \n*   **数据迁移**：采用区块链等新解决方案时，一个主要关注点是数据迁移能否成功。数据迁移是一项全面且细致的任务，涉及将海量数据（包括纸质数据）从遗留系统或基础设施迁移到基于区块链的系统。因此，数据迁移阶段需要周密的规划和审慎的方法。\n\
  \n*   **技术资源有限**：技术资源限制是 IT 预算和组织规模的函数。缺乏技术资源意味着基于区块链的技术实施可能会受到限制。这些技术资源由负责区块链实施的团队以及实施工具组成。由于区块链是一项新兴技术，并非所有组织都拥有能够成功实施区块链的内部团队。大多数情况下，这项任务通常涉及将实施过程外包给第三方供应商。\n\
  \n*   **互操作性**：在区块链解决方案的实施过程中，应仔细考虑互操作性问题，因为该过程涉及跨多个平台的信息流，并结合其他工具和技术。区块链解决方案应能轻松适应这些变化，以确保日常业务无故障运行\
  \ [\\[27\\]](#ch19.xhtml#r418)。\n\n当将现有的传统系统迁移到基于区块链的基础设施时，应通过适当的规划制定全面、系统的方法，以确保平稳过渡。这就是为什么我们建议使用公认的实施方法，例如下一节概述的方法。所有参与方之间的透明度和沟通也很重要。这确保了所有参与方对项目的全面承诺。\n\
  \n## 使用 COBIT 2019 方法进行区块链实施\n\n在企业内根据行业标准实施解决方案时，建立和维护企业信息与技术治理（EGIT）的适当环境至关重要。EGIT\
  \ 实施需要在管理层的正确指导、支持和监督下进行良好的治理和管理。利益相关者不当且不充分的支持可能会因缺乏问责制、责任和所有权的政策和程序而使 EGIT 计划脱轨。因此，由于上一节讨论的一些因素，这些改进可能无法成为既定的业务实践。因此，这些改进将缺乏角色和职责、持续运营以及符合监控等管理结构参数\
  \ [\\[28\\]](#ch19.xhtml#r419)。\n\n**COBIT 2019 实施的必要性**：《COBIT 2019 实施指南》确立了创建适当环境以促进\
  \ EGIT 实施的必要性，将其作为企业整体治理方法的一部分。适当的治理结构应由高层管理驱动。无论计划的性质如何——大规模或小规模——结构、程序、流程和实践都必须符合良好的治理原则，以协助高层管理确保更好的决策和授权模型，从而做出明智的决策。\n\
  \n下文讨论了在企业中首次实施基于区块链的基础设施的 COBIT 2019 方法。\n\n### 三层实施方法\n\nCOBIT 2019 生命周期有三个组成部分：**项目管理**、**变革赋能**和**持续改进**。这三个组成部分不是孤立的，而是相互依赖且并发的。每个组成部分都有助于为上述\
  \ EGIT 计划创建适当的环境。一旦项目或改进计划成功融入企业的日常运营，该周期即可完成或退出。\n\n项目管理包含与区块链实施相关的任务。它包括定义挑战和机遇、定义实施路线图、开发和执行区块链项目以及实现和审查其有效性等任务。\n\
  \n变革赋能是指一种整体且有条理的过程，旨在确保利益相关者做好准备并致力于将当前状态转变为未来的期望状态。它包含以下活动：（a）评估拟议变革对企业环境（包括员工和利益相关者）的影响；（b）定义未来状态愿景；（c）构建变革响应计划；以及（d）衡量因改进计划而产生的变革进度。\n\
  \n持续改进方法包含旨在改进企业产品、服务和流程的持续活动。这些活动是连续的，包括识别变革需求、评估当前和目标状态、构建改进、监控以及在整个实施周期中评估改进等任务\
  \ [\\[28\\]](#ch19.xhtml#r419)（**图 11.3**）。\n\n![图 11.3 COBIT 2019 持续实施生命周期。 ¶ 来源：[28]；COBIT\
  \ 2019 Implementation Guide, ISACA (2019), all rights reserved.](html/images/9781032078243_C011_003.jpg)\n\
  \n**图 11.3** COBIT 2019 持续实施生命周期。 ¶ 来源：[\\[28\\]](#ch19.xhtml#r419)；COBIT 2019 Implementation\
  \ Guide, ISACA (2019), all rights reserved.\n\n### COBIT 2019 实施方法\n\n如前所述，COBIT\
  \ 2019 实施周期的三个组成部分——即持续改进（CI）、变革赋能（CE）和项目管理（PM）——分布在七个阶段中。以下各节将描述上述七个阶段中的每一个，并给出持续改进、变革赋能和项目管理中的相关任务（**图\
  \ 11.4**）。\n\n![图 11.4 使用 COBIT 2019 实施周期进行区块链实施。 ¶ 来源：[28]。](html/images/9781032078243_C011_004.jpg)\n\
  \n**图 11.4** 使用 COBIT 2019 实施周期进行区块链实施。 ¶ 来源：[\\[28\\]](#ch19.xhtml#r419)。\n\n####\
  \ 阶段 1：驱动因素是什么？\n\n\n\n\n# 第一阶段：驱动因素是什么？\n\n本阶段识别变革驱动因素。变革驱动因素可定义为暗示需要变革的考量因素。变革驱动因素的例子包括行业趋势、绩效不足、组织目标或软件实施。\n\
  \n第一阶段的目的是了解拟议改进的范围，即区块链的实施，并了解区块链系统如何影响各利益相关者，以及采用该技术的就绪程度。表 11.1 和 11.2 描述了本阶段各利益相关者及其角色和职责。\n\
  \n##### 表 11.1 第一阶段：目标、描述、任务、输入、资源与输出\n\n| **第一阶段描述 – 驱动因素是什么？** |\n| :--- |\n|\
  \ **阶段目标** | 了解区块链的目标及其在当前治理方法下的背景。获得所有利益相关者的承诺。 |\n| **阶段描述** | 描述在组织中实施区块链解决方案的必要性。界定区块链在当前治理方法下的背景。此外，获得利益相关者的承诺和预算。\
  \ |\n| **持续改进 (CI) 任务** | 1. 识别当前的治理方法和 IT 痛点，这些痛点要求实施区块链平台。 2. 识别通过实施区块链来改进企业 IT\
  \ 治理 (EGIT) 的驱动因素和合规要求。 3. 识别组织内 IT 领域直接影响区块链实施的当前业务优先事项。 4. 确保执行董事会批准高层方法并接受不采取适当行动的风险。\
  \ |\n| **变革赋能 (CE) 任务** | *建立实施区块链解决方案的意愿：* 1. 将区块链的实施与组织内的企业变革赋能计划相结合。 2. 分析将实施区块链的当前环境。例如，管理风格、文化和态度。\
  \ 3. 确定会阻碍区块链技术实施的其他正在进行的举措。 4. 了解实施区块链技术的影响。 5. 识别来自整个组织的区块链实施项目利益相关者，如业务、开发、审计等部门。\
  \ 6. 确定利益相关者的承诺程度及其贡献带来的变革影响。 7. 利用痛点，I&T 治理董事会应在所有利益相关者中推广和传播原则和目标。 8. 灌输向区块链环境变革的必要性。\
  \ |\n| **项目管理 (PM) 任务** | *启动实施：* 1. 遵循 I&T 治理董事会，设定高层战略方向和目标。 2. 定义并分配所有利益相关者在实施项目中的适当角色。\
  \ 3. 制定区块链业务案例大纲，包含成功因素，以便检查绩效监控并报告改进。获得利益相关者的财务承诺。 |\n| **输入** | 1. 企业政策、战略、治理、审计报告和业务计划。\
  \ 2. 企业内正在进行/计划中的举措可能会造成阻碍。 3. 指出现有痛点的 I&T 治理董事会绩效报告。 4. 有用的行业概览、案例研究和成功案例。 5. 企业愿景和使命声明、市场定位和服务战略。\
  \ |\n| **输出** | 1. 区块链业务案例大纲。 2. 利益相关者的高层角色和职责。 3. 利益相关者的财务承诺。 4. 所有利益相关者之间的沟通，并确立实施区块链的必要性。\
