- "## 审计师的区块链技术指南：架构、用例、安全与保证\n\n\n\n![](img/cover.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n# 前言\n\n在企业严重依赖信息技术 (IT) 和数据的世界里，信息安全和保证专业人员的作用日益增强，这已不是秘密。埃德蒙顿协和大学\
  \ (CUE) 的信息系统保证管理硕士 (MISAM) 专注于 IT 的业务层面，即财务和技术相关审计。该课程遵循信息系统审计与控制协会的模范课程，因此 CUE\
  \ MISAM 毕业生在技术和会计/金融方面均具备出色技能。MISAM 学生在 CUE 完成学业的同时，通常还会攻读注册信息系统审计师 (CISA)、注册信息安全经理\
  \ (CISM) 或注册信息系统安全专家 (CISSP) 认证。在 MISAM 课程中，研究生在实践中学习，本书即是该教育环境的成果。\n\n本书是 CUE 教授\
  \ Shaun Aghili 博士在 CUE MISAM 课程中创新教学的成果。Shaun 在《本书背后的故事》中阐述了他编写此书的个人动机。让 48 名研究生从事项目工作，不仅提供区块链主题的背景知识，还在更多应用场景中进行探索，这值得关注。书中涵盖的主题广泛，使读者能够了解各个领域，无论是初学者还是该领域的专家都会感兴趣。Shaun\
  \ 依靠学生在完成学业时研究他们的课题。他还得到了研究生助教 Aman Dev Singh 先生和 Yetunde Akinsanmi 女士的编辑支持。本书是团队合作的成果，我向\
  \ Shaun 以及以各种方式为本书做出贡献的所有人表示赞赏。知识旨在被讨论和分享；这本关于区块链的书因将课堂讨论分享给加拿大阿尔伯塔省埃德蒙顿大学校园之外的更广泛受众而引人注目。愿阅读本书能加深并巩固您对区块链的理解。\n\
  \n**Alison Yacyshyn, PhD**\n\n*Mihalcheon 管理学院院长*\n\n*管理学院副教授*\n\n# 序言\n\n## 本书背后的故事\n\
  \n约在 2018 年，我研读了一些关于支持比特币和其他加密货币交易的分布式、去中心化、点对点网络的文章。虽然当时我对比特币价值的大幅上涨及其未来的可持续性（以及当时涌现的大量其他加密货币）持一定怀疑态度，但支持比特币的网络基础设施迅速成为我的研究兴趣领域。这种被称为区块链的网络结构，因其不可篡改、加密安全和去中心化的特性，正被许多研究人员和组织视为潜在的颠覆性创新。事实上，一些评论员预测，在未来十年或左右，区块链技术作为一种消费者友好、透明且去中心化的工具被纳入应用，很可能会以\
  \ 1990 年代互联网普及的方式影响信息技术领域。\n\n对区块链技术的初步研究促使我决定进一步深入了解它。我花费了接下来的一年时间参加在线区块链相关课程，并备考几个全新的区块链认证考试，涉及区块链基础、用例、架构和安全考量。这一举措使我对这项技术的现状、局限性和问题，以及其在供应链管理、去中心化金融、会计和审计、政府运营等领域的潜在用例有了更好的了解（仅举几例）。\n\
  \n\n\n\n# 前言\n\n2021 年 1 月，我组建了一个研究团队，成员来自我们信息系统安全与保障硕士项目的二年级研究生，他们当时正修读研究方法课程。作为我们最终的小组研究项目，我起草了一份关于区块链技术审计的书籍目录初稿；在那个时候，这一主题几乎未受到任何关注。随后，我将我的\
  \ 53 名研究生分成每组两到四人的小团队，并为每组分配了一个章节主题。在接下来的两个学期（共 26 周）里，在我的密切指导和监督下，每个团队研究并撰写了分配给他们的章节。大致在同一时期，当我的学生们忙于阅读、理解和分析与其分配章节相关的参考资料时，我开始围绕我们的新研究项目创建一份全面的书籍出版建议书。在撰写建议书的调研过程中，我很快发现，虽然互联网上有大量与区块链相关的资料，但专门聚焦于区块链技术的研究论文和出版书籍相对较少，尽管我找到了大量专注于各种加密货币（尤其是比特币）的书籍。我关于区块链审计书籍的建议书随后提交给\
  \ CRC Press 进行审核，令我欣喜的是，几个月后我收到了 CRC Press 的批准！\n\n您正在阅读的这本书就是这一努力的成果。当您研读本书各章节时，会看到每章作者的姓名；共有\
  \ 53 名聪慧且极具动力的研究生，他们来自加拿大阿尔伯塔省爱德蒙顿协和大学的信息系统安全与保障项目。\n\n## 谁应该阅读本书？\n\n这项工作的初衷是为对新兴技术知之甚少的\
  \ IT 保障专家创建一份全面的学习和参考指南。因此，本书可能极大地引起以下读者的兴趣：\n\n*   对深入了解区块链的类型、组件、挑战及潜在用例感兴趣的 IT\
  \ 和业务读者；\n*   为研究目的而有兴趣了解区块链技术的本科生和研究生；\n*   为评估和/或实施目的，有兴趣深入了解这一新兴技术各个方面的各类业务领导者；\n\
  *   寻求采用一本全面的教材用于区块链技术相关课程的本科和/或研究生级 IT 教师；\n*   寻求加深对该技术及其在商业、会计和审计领域潜在用例理解的会计师和外部审计师；\n\
  *   寻求获得区块链胜任能力的内部和信息系统审计师；\n*   寻找一本简明而全面的区块链参考书的个人；\n*   寻求高效学习区块链技术所有要点，作为进入利润丰厚的区块链相关就业市场第一步的个人。\n\
  \n## 本书如何惠及审计专业人士？\n\n正如书名明确所示，本书主要面向保障专业人士设计。它不仅为审计师理解区块链技术的机制和主要组件奠定了坚实基础，还探讨了这一新兴且具有潜在颠覆性技术的现状挑战，如其风险、漏洞和实施障碍。此外，本书还讨论了供应链管理、金融服务以及会计/审计等领域的多个潜在用例。目前还有许多其他潜在用例，特别是在政府领域，正在被调查研究中。然而，作为研究项目的顾问和监督者，我决定将我们的用例研究限制在我拥有先前非学术工作经验的领域和部门。因此，我真诚地相信，外部和内部审计师都能极大地扩展其区块链知识库，并将更高的有效性融入涉及这一快速发展技术的审计计划中。\n\
  \n## 如何阅读本书\n\n本书旨在既作为区块链技术的全面读物，也作为 IT 和保障专业人士的宝贵参考工具。虽然本书可以以很大的灵活性进行阅读或学习，但所有读者都必须从按顺序研读本书前三章开始。在网络和网络安全方面拥有丰富知识和经验的\
  \ IT 专业人士，会认为前三章中讨论的至少一些概念是复习性质的。然而，正如我总是提醒我的信息系统安全与保障学生的那样，成为某一领域专家的首要条件是扎实掌握其基础。一旦打下坚实基础，在此基础上构建将不再是一项过于困难的任务！\n\
  \n研读完前三章后，读者可以选择挑选其余最感兴趣和最有用的章节。快速浏览本书的目录应能让读者意识到，除了涵盖区块链基础知识外，本书还讨论了架构、安全方面、若干潜在用例和实施考量，以及若干区块链专用的审计工具和清单。\n\
  \n## 本书如何组织？\n\n本书每一章都遵循相似的整体组织结构，如下所示：\n\n*   每章作者/研究人员的姓名在其分配的章节开头披露。在研究项目的第一阶段，这些人员负责为每章搜索、汇编和分析数十篇参考文献。在研究项目的后期阶段，团队负责在我的编辑协助以及我的两位得力研究生助教\
  \ Aman Dev Singh 先生和 Yetunde Akinsanmi 女士的校编支持下撰写章节内容。2021 年春季学期在爱德蒙顿协和大学结束后，我花费数月时间对每章进行最终深度编辑，随后在妻子\
  \ Susan 的协助下，手稿最终准备好提交给 CRC 编辑。\n\n*   每章均以简短的*摘要*开始。类似于其在研究论文中的用途，摘要使读者在深入阅读前能快速了解每章的内容和范围。这样做的理由是让读者有选择地跳过可能不感兴趣的章节。例如，一些读者可能希望跳过技术性较强的章节，而技术导向较强的读者可能希望主要关注此类章节并跳过侧重某些用例的章节。如前所述，虽然第\
  \ 1 章至第 3 章应由所有读者阅读，但其余章节可按任意顺序学习，甚至某些读者可跳过某些章节。\n\n*   虽然所有章节都以摘要部分开始，但每章也以两个部分结尾，分别题为*总结与结论*，随后列出*核心概念*。包含这两个部分的理由有二：(a)\
  \ 它使对章节内容已有足够知识的读者能够放弃阅读整章，转而快速回顾其核心概念；(b) 这些部分可帮助读者根据需要快速回顾和记忆一些更重要的章节概念。\n\n\n\
  \n\n# 区块链技术：在无信任环境中建立信任\n\n**Harriet Tenge 和 Maureen Okello**\n\nDOI：[10.1201/9781003211723-1](http://doi.org/10.1201/9781003211723-1)\n\
  \n## 摘要\n\n本章是三章中的第一章，旨在让读者熟悉区块链技术的基本概念。第 1 章向读者介绍了区块链的基础概念，如拜占庭将军困境、其历史、其基本组成部分，以及其基本类型和属性。此外，本章还讨论了区块链技术与数据库技术的区别，以及区块链如何成为当前日益流行的零信任架构的合适补充。\n\
  \n本章讨论的主题包括：\n\n*   区块链历史\n*   区块链数据库与传统数据库\n*   CRUD 与区块链中的读写功能\n*   拜占庭将军困境\n\
  *   区块链类型（公有链、私有链、混合链、联盟链）\n*   区块链组件（网络、区块、共享账本和链接区块）\n*   区块链属性和优势\n*   区块链作为\
  \ ZTA 工具\n*   ZTA 和区块链最佳实践\n\n## 区块链定义\n\n区块链可被定义为一种防篡改且抗篡改的点对点分布式数字网络和去中心化共享账本。区块链之所以防篡改，是因为记录在其账本中的交易若不被轻易发现，就无法被更改。另一方面，抗篡改意味着该技术极其稳健，因为它建立在加密密钥之上，从而使得区块无法被修改。用户可以自由记录交易并相互共享数字文件，从而消除了对中介机构（如银行、托管机构或监管实体）的需求。区块链网络高度依赖于使用公钥和私钥加密的加密算法\
  \ [42]。区块链的去中心化点对点网络结构有助于防止任何单点故障，因为即使大量节点因某种网络故障或攻击而停止工作，网络仍能继续高效运行 [35]。第 2 章将更详细地介绍上述属性的各个组成部分。\n\
  \n尽管仍处于起步阶段，但自 2009 年首次亮相（比特币网络的开始）以来，区块链技术已经经历了多次改进和变革。该技术的起源将在下文讨论 [28]。\n\n##\
  \ 区块链历史\n\n在区块链技术于 2009 年声名鹊起之前，一个使用化名 *Satoshi Nakamoto*（中本聪）的个人（或可能是一群个人）发布了一份题为\
  \ *Bitcoin: A peer-to-peer electronic cash system*（《比特币：一种点对点的电子现金系统》）的白皮书。该文件提出将电子现金作为点对点网络中的支付手段，解决双重支付威胁，并进一步解释了区块链技术如何利用时间戳、哈希和群体共识的功能，在无需中央中介的情况下容纳电子现金系统\
  \ [28]。\n\n根据 Rose（2015 年；题为 *The Evolution of Digital Currencies: Bitcoin, A Cryptocurrency\
  \ Causing A Monetary Revolution*，《数字货币的演变：比特币，一种引发货币革命的加密货币》）的记载，比特币网络于 2009 年由\
  \ Satoshi Nakamoto 启动，后者随后从公共论坛消失。首笔比特币商业交易发生于 2010 年 5 月 22 日，当时比特币诞生约一年。居住在佛罗里达州的程序员\
  \ *Laszlo Hanyecz*（拉斯洛·哈内茨）以 10,000 BTC 购买了两个意大利辣香肠披萨，当时价值约 40 美元 [32]。\n\n2013\
  \ 年，在比特币创世区块被挖出后，以太坊创始人 *Vitalik Buterin*（维塔利克·布特林），一位俄裔加拿大程序员，发表了一篇题为 *A Next-Generation\
  \ Smart Contract and Decentralized Application Platform*（《下一代智能合约与去中心化应用平台》）的论文，介绍了具有智能合约功能的\
  \ *Ethereum*（以太坊）区块链平台 [8]。\n\n2014 年，爱沙尼亚共和国成为首个利用爱沙尼亚 *eID* 为其公民推出电子居留服务的国家；这是首个让世界上任何国家的个人成为另一个国家“数字居民”的平台\
  \ [21]。\n\n次年（2015 年），*Linux Foundation Project*（Linux 基金会项目）推出了其 *Hyperledger Fabric*（Hyperledger\
  \ Fabric），一个私有的、许可制的区块链框架 [26]。同年，以太坊区块链诞生，第一个版本被称为 *Frontier*（边疆）。此后，该技术不断升级，发布了\
  \ *Homestead*（家园）、*Metropolis Byzantium*（大都会拜占庭）和 *Ether 2.0*（以太 2.0）等新版本 [5]。\n\
  \n2016 年，*Walmart*（沃尔玛）与 *IBM* 合作应用该技术以更好地监控其食品供应链，进一步提升了区块链的知名度。当时，中国沃尔玛食品安全协作中心也报告了加强全球食品安全研究的意图，承诺项目费用约\
  \ 2500 万美元，为期五年。该系统将利用 RFID 标签和物联网传感器系统，追踪来自中国的猪肉产品、来自巴西的谷物出口、来自非洲的葡萄运输，以及沃尔玛美国商店的芒果和鸡蛋销售与供应情况\
  \ [17]。\n\n除了爱沙尼亚，许多政府目前也在努力将区块链的优势纳入其行政流程。印度的泰米尔纳德邦是首个宣布计划利用区块链技术向公民推出电子政务服务的邦。该项目名为\
  \ *Tamil Nadu Blockchain Policy 2020*（泰米尔纳德邦区块链政策 2020），计划将利用该邦的家庭数据库进行开发 [9]。阿拉伯联合酋长国（UAE）政府计划于\
  \ 2021 年上线，利用区块链技术转型约一半的政府服务。阿联酋政府旨在通过多项举措，每年节省 110 亿阿联酋迪拉姆（AED）的交易和文件成本、3980 亿\
  \ AED 的打印成本以及超过 7700 万个工时 [38]：\n\n*   *Smart Dubai*（智慧迪拜）—— 迪拜城市的数字化转型，提升市民和游客的生活体验\n\
  *   *Dubai Health*（迪拜健康）—— 改善医疗保健，为人民提供安全的环境\n*   *Ajman*（阿治曼）—— 通过扩大旨在为公民实现繁荣的绿色经济，建设一个拥有积极精神和态度的凝聚力社会\n\
  \n\n\n\n\n* **Sharjah** – 利用创新旅游策略，将夏尔迦（阿联酋的一座城市）推广为旅游枢纽。\n\n## 区块链技术与传统数据库解决方案\n\
  \n传统数据库使用中心化服务器，允许用户更改存储的数据。数据库的管理由管理员控制，管理员拥有授予用户访问数据权限的权力。数据库系统的一个弱点是，如果网络管理员的凭证泄露，数据可能会被篡改\
  \ [[14]](#ch09.xhtml#r014)。另一方面，如前所述，区块链提供了一种去中心化的网络结构，可以在无需中央机构或管理员的情况下建立，这也是大多数公有链的情况。表\
  \ 1.1 总结了区块链与传统数据库系统之间的一些关键特性和差异。\n\n### 表 1.1 区块链与传统数据库\n\n| **领域** | **区块链技术**\
  \ | **传统数据库** | **参考文献** |\n| --- | --- | --- | --- |\n| **CRUD 功能** | 仅允许两种功能：读取和写入交易。\
  \ | 允许用户执行四种 CRUD 功能：创建、读取、更新和删除。 | [[31,]](#ch09.xhtml#r037) [[37]](#ch09.xhtml#r037)\
  \ |\n| **架构** | 点对点、去中心化架构。也可能依赖星际文件系统（`IPFS`）：一种包含哈希表和 BitTorrent 协议的点对点分布式账本。\
  \ | 使用客户端-服务器架构。 | [[4]](#ch09.xhtml#r004), [[37]](#ch09.xhtml#r037) |\n| **数据完整性**\
  \ | 因其防篡改的加密属性，提供极佳的数据完整性。 | 数据可能因错误或恶意行为而被擦除和/或更改。 | [[37]](#ch09.xhtml#r037) |\n\
  | **权威性** | 缺乏中央权威的去中心化系统。 | 由选定管理员管理的中心化系统。 | [[37]](#ch09.xhtml#r037) |\n| **速度与性能**\
  \ | 比数据库技术慢，因为它需要签名验证、共识机制，且本质上是冗余的。 | 更快，可在给定时间内处理许多交易。也提供极佳的可扩展性。 | [[37]](#ch09.xhtml#r037)\
  \ |\n| **成本** | 实施通常更昂贵，且更难维护。 | 一种成熟技术，实施和维护难度较小。 | [[37]](#ch09.xhtml#r037) |\n\
  \n除了表 1.1 中概述的各种考量因素外，以下源自美国国家标准与技术研究院（`NIST`）文件 `NISTIR 8202` 的决策树，也是企业判断区块链实施是否适合各类实体的有用工具\
  \ [[42]](#ch09.xhtml#r042) （图 1.1）。\n\n![图 1.1 区块链与数据库决策树。 ¶ 来源：[42]。](html/images/9781032078243_C001_001.jpg)\n\
  \n图 1.1 区块链与数据库决策树。 ¶ 来源：[[42]](#ch09.xhtml#r042)。\n\n## 拜占庭将军困境\n\n拜占庭将军困境（`BZD`）是一个由\
  \ Lamport、Shostak 和 Pease 在 1982 年的一篇研究论文中首次讨论的概念。`BZD` 表示一种后勤困境，其核心是在无信任环境中克服通信挑战，以试图达成共同目标。解决拜占庭将军困境依赖的原则，正是区块链技术所基于的原则；即：通过使用密码学致力于维护安全通信，并在各参与群体间达成共识，以实现共同目标。\n\
  \n详细阐述而言，`BZD` 指一种假设情境：拜占庭军队的若干师团驻扎在一座被围困的城市外，准备进攻。在进攻前，所有将军必须通过相互同意就某一战略达成一致。为实现这一共识，将军们必须相互通信。每位将军必须通过信使安全地向其他将军发送计划和指令；在无信任环境中，这是一项极具挑战性的任务，因为这些信使携带的信息可能被被围困城市守军的间谍截获。该无信任环境中的另一个隐患是，至少有一位领军的拜占庭将军可能是叛徒，因此可能不会按约定方式执行约定的进攻\
  \ [[3]](#ch09.xhtml#r003)。\n\n为了对被围困城市发动成功的进攻，必须通过在拜占庭将军间实施安全通信协议，使每位将军均同意共同的进攻战略。此外，鉴于“叛徒将军”问题，共同进攻战略必须由最低数量的进攻将军执行（例如：67%，即\
  \ 图 1.2 中六位将军中的四位，方可成功执行）。\n\n![图 1.2 拜占庭将军困境示意图。](img/9781032078243_C001_002.jpg)\n\
  \n图 1.2 拜占庭将军困境示意图。\n\n尽管具有虚构和假设性质，拜占庭将军困境在无信任计算机网络环境中是一个极其相关的概念。换句话说，正如进攻的拜占庭将军所面临的情况一样，点对点网络代表了一种无信任环境，其中各网络节点也必须拥有安全通信协议，以达成执行网络目标所需的共识。源自拜占庭将军困境的一个相关概念是拜占庭容错（`BFT`）。`BFT`\
  \ 指一种状态：网络中的某些节点即使在其他节点失效或表现欺诈行为时，仍能继续运行。`BFT` 系统即使部分网络节点失效或表现欺诈，仍能继续运作 [[3]](#ch09.xhtml#r003)。下一节将简要讨论不同类型的区块链。\n\
  \n### 区块链类型\n\n区块链架构可分为四大类；即：公有链、私有链、混合链和联盟链 [[2]](#ch09.xhtml#r002)。以下章节将向读者介绍这些不同的区块链类型。公有链和私有链及其各自的子类别（即：开放或封闭）将在第\
  \ 2 章中更详细地讨论。\n\n* **公有链** 是无许可、共享且同步的账本，任何用户均可在无访问控制限制的情况下访问、加入或使用。比特币交易所是公有链的著名实例，任何人均可查看区块链并在其上进行买卖交易。公有链通常在区块创建过程中，需要大量处理节点的共识\
  \ [[24]](#ch09.xhtml#r024)。目前，大多数公有链依赖工作量证明（`PoW`）或权益证明（`PoS`）共识算法进行区块创建 [[2]](#ch09.xhtml#r002)。区块创建共识算法也将在第\
  \ 2 章中讨论。\n\n* **私有链** 则相反，是中心化、有许可的网络，通常由中央管理员（赞助组织）控制。此类区块链的有许可性质意味着，通过身份管理流程以及中央机构提供的访问控制，对区块链用户施加读写限制\
  \ [[2]](#ch09.xhtml#r002)。`Hyperledger Fabric`、`Hyperledger Sawtooth` 和 `R3 Corda`\
  \ 是私有网络的示例 [[16]](#ch09.xhtml#r016)，详见第 7 章。\n\n\n\n\n\n### 混合区块链\n\n*混合区块链*是指同时具备公有链和私有链特征的一类区块链。虽然这些混合类型通常不对所有人开放，但它们仍然提供了区块链所期望的完整性、透明性和安全性属性。在混合区块链应用中，成员负责决定谁可以参与，以及哪些交易可以被公众查看。这种受控访问与自由相结合的方式，使混合区块链应用具有高度的可定制性。在区块链治理方面，混合区块链通常由单一实体控制\
  \ [[11]](#ch09.xhtml#r011)。\n\n### 联盟型区块链\n\n*联盟型区块链*是一种半私有区块链（混合链），通常不是由单一实体治理，而是由一组公司共同治理。这类区块链应用通常跨越多个志同道合的赞助组织，共同追求共同的商业目标\
  \ [[41]](#ch09.xhtml#r041)。联盟链代表了完全开放、完全去中心化与中心化控制的区块链应用之间的一种折中方案。\n\n公有链和私有链的关键特征总结见表\
  \ 1.2。\n\n## 表 1.2：公有链与私有链对比\n\n| 领域 | 公有链 | 私有链 | 参考文献 |\n| --- | --- | --- | ---\
  \ |\n| **成员资格** | 对所有人开放。 | 由组织控制。授权用户需获许可方可参与。 | [[24]](#ch09.xhtml#r024) |\n|\
  \ **读取权限** | 参与者可读取。 | 用户通常可读取，但有时需要授权才能读取记录。 | [[41]](#ch09.xhtml#r041)[[24]](#ch09.xhtml#r024)\
  \ |\n| **写入权限** | 所有人均可在区块上写入。 | 管理员拥有在区块上写入的专有权利。 | [[40]](#ch09.xhtml#r040) |\n\
  | **用户身份** | 用户身份匿名。 | 参与者身份已知。 | [[24]](#ch09.xhtml#r024) |\n| **中心化权威** | 去中心化网络。\
  \ | 中心化。 | [[24]](#ch09.xhtml#r024), [[40]](#ch09.xhtml#r040) |\n| **共识协议** | 无许可。\
  \ | 有许可。 | [[24]](#ch09.xhtml#r024), [[40]](#ch09.xhtml#r040) |\n\n## 区块链组件：入门指南\n\
  \n区块链平台由一串区块组成，这些区块通过挖矿节点或验证节点的共识协议创建，并以链式结构安全地链接在一起。\n\n计算机网络可分为以下三种配置。每种网络类型都有其自身的优势和适用性\
  \ [[25]](#ch09.xhtml#r025)。总体而言，在大多数用例中，区块链是去中心化、分布式的点对点网络。\n\n### 中心化网络\n\n中心化网络由授权的中央管理员控制，由其对整个网络做出决策。网络中的单台服务器执行网络的处理功能。服务器将所有记录存储在单一位置，并从该位置管理网络，允许其他计算机连接并传输请求。中央服务器主要用于社交媒体、即时通讯和搜索引擎等大规模服务\
  \ [[25]](#ch09.xhtml#r025) (图 1.3)。\n\n![图 1.3 中心化网络拓扑。](img/9781032078243_C001_003.jpg)\n\
  \n图 1.3 中心化网络拓扑。\n\n一般来说，如果网络需要依靠中央服务器的更新和增强来运行，而无需单独更新每个工作站，则此类网络具有很高的价值。中央服务器速度快、易于开发，且在发现性能问题或安全漏洞时易于修补。\n\
  \n尽管中心化网络提供了许多优势，但这种类型的网络也面临一定的制约。主服务器控制整个网络，当服务器组件发生故障时，有时会成为单点故障。同样，中心化网络也面临恶意活动的威胁，使得服务器容易受到黑客攻击，黑客可访问交易和对等节点的凭证详情。在服务器带宽因成员同时发起请求而无法维持事件的情况下，系统性能也可能受到影响\
  \ [[25]](#ch09.xhtml#r025)。\n\n### 去中心化网络\n\n去中心化网络概念由保罗·巴兰于 1964 年提出，旨在帮助改善电信基础设施，并克服易受网络威胁的中央服务器故障问题\
  \ [[23]](#ch09.xhtml#r023)。该网络通过所谓的点对点结构化系统，将各个节点与不同的服务器互联。此外，该结构通过允许系统未受损部分在网络内某组件发生故障时继续运行，从而促进了容错性。在网络中经营业务的成员参与决策制定。与中心化网络相比，这赋予了成员更多的权力和自主权\
  \ (图 1.4) [[25]](#ch09.xhtml#r025)。\n\n![图 1.4 去中心化网络拓扑。](img/9781032078243_C001_004.jpg)\n\
  \n图 1.4 去中心化网络拓扑。\n\n去中心化网络被认为更可靠、更安全，因为系统更加多样化；从而允许信息存储在独立的计算机上，而不是存储在中央位置（更高的冗余性）。这些民主化平台的弹性和安全性使得黑客难以在网络中站稳脚跟。由于网络权力和控制掌握在网络参与者手中，该系统可被视为更值得信任\
  \ [[25]](#ch09.xhtml#r025)。另一方面，去中心化网络成本也更高，因为有多台服务器参与网络。因此，网络需要更多的维护以保持平台高效 [[1]](#ch09.xhtml#r001)。\n\
  \n### 分布式网络\n\n区块链是具有最高容错性（拜占庭容错）的分布式点对点网络。系统内部有节点在运行；因此，没有节点受到优待，因为每个节点都可以参与交易流程并记录数据\
  \ [[26]](#ch09.xhtml#r026)。网络由许多计算机构建，防止数据在节点未达成一致的情况下被篡改。分布式系统以去中心化的方式维护一个共享、复制和同步的数据库。此外，网络参与者通过共识管理并就存储在不可变账本中的交易更新达成一致。网络由参与者管理；因此，通常不需要中介或中央权威机构\
  \ (图 1.5) [[24]](#ch09.xhtml#r024)。\n\n![图 1.5 分布式网络拓扑。](img/9781032078243_C001_005.jpg)\n\
  \n图 1.5 分布式网络拓扑。\n\n分布式网络在响应操作时具有更高的延迟，因为网络通常分布在不同地理位置，从而导致反馈时间减少。该技术防篡改的特性使存储在账本上的数据不可变，且数据可在对等节点间以数字方式共享\
  \ [[10]](#ch09.xhtml#r010)。\n\n\n\n\n分布式账本结构面临的挑战之一是难以达成共识，因为在做出任何决定之前，网络中大多数参与者必须达成一致。使用绝对时间记录事件取决于这些事件的发生，但在分布式结构上这似乎是不可能的。此外，在分布式平台上设计和修正算法很难实现，因为节点缺乏共同时钟；因此，无法对命令进行时间排序。节点具有不同的延迟，在设计此类规则集时必须牢记这一点。节点难以获得系统的全局视图，因此系统依赖其他节点来做出明智的决策。广泛分布的网络计算机拥有众多参与者，它们在网络上共享资源。计算过程也称为网格计算，并将系统变成一台强大的超级计算机\
  \ [10]。\n\n## 区块链的特征\n\n#### 区块\n\n区块链平台由一系列交易组成，这些交易以区块的形式安全地捆绑在一起。通常，每个区块由记录的加密哈希值组成，该哈希值作为指向下一个区块的链接，创世区块除外——它是区块链的根，包含所有节点已知的信息。每个区块结构包含区块头和区块体\
  \ [35]。通常，区块头包含六个元素，如图 1.6 所示。\n\n![图 1.6 区块结构。 ¶ 来源：[42]。](html/images/9781032078243_C001_006.jpg)\n\
  \n图 1.6 区块结构。 ¶ 来源：[42]。\n\n正如图 1.6 所示，区块头指的是区块元数据，它包含时间戳、区块数据的哈希表示、前一个区块头的哈希值和一个随机数。前一个区块头的哈希值是一种加密方法，用于计算称为哈希摘要（消息摘要）的唯一输出。时间戳确保及时性，并在区块被视为有效之前通过一些测试。时间戳的一个示例表示为\
  \ `2018-02-24 21:27:29`。术语 nonce 是“Number Used Once”（仅使用一次的数字）的简称。其目的是提供一个唯一的随机区块标识符，以帮助避免重复区块。区块的哈希值是区块数据的哈希表示。最后，术语区块数据是指包含在区块内的交易列表、账本事件和附加数据\
  \ [39, 42]。\n\n### 共享账本\n\n区块链账本是一组交易的集合，它使对等体社区能够在无需中央权威机构的情况下共享交易记录。如前所述，区块链账本上的数据是不可变的，一旦发布，不允许更改交易记录。在公共区块链用例中，存储在账本中的交易是公开可用的。\n\
  \n### 链接区块\n\n链接区块通过前一个区块头的哈希摘要连接在一起，形成区块链。在恶意代理更改与前一个区块相关的任何信息的情况下，所有后续区块的哈希值也将随之改变，导致一种在区块链上易于检测的状态。链接区块由交易列表、时间戳、随机数、前一个区块的哈希值和区块头组成，有助于识别并拒绝任何被更改的区块\
  \ [42]。\n\n## 区块链的属性与优势\n\n区块链具有以下重要属性和优势：**共识** 使区块链能够在无信任环境中运行，通过每个参与者的同意达成协议\
  \ [24]。正在开发几种共识机制，在分布式网络中用于达成共识协议的两种主要机制是 `PoW`（首次用于比特币）和 `PoS`——`PoW` 最常见的替代品，需要低得多的能量消耗。权益证明（`PoS`）是一种共识模型，节点验证区块以赚取交易费用（另见第\
  \ 2 章） [29]。共识过程中多重签名的存在确认了大多数对等体同意某笔交易为有效。实用拜占庭容错（`PBFT`）是一种被证明有助于解决计算节点之间争议的算法，当某些节点无法产生与网络中其余节点相同的结果时。\
  \ **溯源** 允许参与者每次都了解数据发生的来源和所有权变更 [15]。这一概念源于艺术界，提供书面证据证明艺术品未被篡改、伪造、复制或盗窃 [6]。溯源使用户能够追踪数字账本中进行的任何交易的数据来源\
  \ [24]。 **不可变性** 或 **最终性** 指的是这样一个概念：存储在区块链中的数据无法被修改或删除，除非许多节点同意更改 [6]。区块链的不可变性质保护已记录的交易免受参与者篡改。在发生交易错误的情况下，必须使用新交易来撤销该错误。因此，这两笔交易都应可见\
  \ [15]。\n\n除了上述讨论的属性外，区块链还提供以下优势：区块链平台使用户在网络上交易时能够保持 **匿名**。保持匿名意味着用户的个人信息被伪装或不公开\
  \ [35]。参与者不知道网络上成员的实际姓名和地址。每个区块链网络用户（操作员）均可通过系统生成的地址进行识别 [24]。在法币世界中，在中央银行批准机构的支持下，银行系统在付款前授予许可。与这种传统模式相反，由于公共区块链的去中心化性质，不需要中介\
  \ [43]。信任通过基于共识设定规则在节点上共享和存储数据而在用户间分布，以确保安全 [20]。区块链还提供极高的 **透明度**，因为区块链应用采用时间戳指示区块被创建、注册和验证的时间\
  \ [13]。当每个节点保存一份交易记录副本时，就会发生透明度 [36]。网络上的任何人都可以随时公开查看存储的交易 [39]。不需要中央权威机构的协助来提高系统的透明度\
  \ [36]。\n\n\n\n作为在无信任环境中运作的有效手段，区块链网络参与者在开展业务时无需相互了解或信任 [42]。添加到区块链平台的节点可以以分布式方式协调并认证区块链的全部内容，而无需中央权威机构\
  \ [35]。无信任可进一步解释为：一种不依赖中介或代理即可运行的系统 [20]。正如后续章节所讨论，区块链供应链平台可通过对供应链中食品的溯源与追踪，提供高效的质量控制。例如，沃尔玛与\
  \ IBM 合作，利用通过二维码与产品包装关联的电子证书，试点食品追踪服务，以管理食品仓储和供应链网络。该软件支持采购主管通过查看基于农场来源、运输信息、门店温度、批次代码、土壤质量、化肥类型等详细信息，远程追踪过期食品和仓储温度。该系统能轻松检测并剔除任何食品缺陷或受污染产品，同时节省产品召回成本\
  \ [17]。基于区块链的供应链追踪系统还能降低跨境交易用例相关的交易成本 [37]。第 6 章详细讨论了区块链在供应链管理中的应用。区块链系统可实现更快的资金清算和结算。数字化网络在解决交易争议和对账方面也更加及时。进一步而言，区块链上的交易处理经验证极快；从几秒钟到几分钟不等\
  \ [35]。得益于这种迅速性，区块链被用于数字资产、汇款和在线支付 [43]。第 5 章更详细地讨论了基于区块链的交易结算。\n\n即使系统的任何组件因故障停止工作，区块链应用仍能继续高效运行，这得益于其去中心化的点对点网络配置。因此，避免了单点故障\
  \ [42]。\n\n区块链的引入也引发了一场范式转变，从传统的法币银行体系转向加密货币世界。**代币化** 代表了区块链中称为币或代币的可交易记账单位中的价值封装。换句话说，代币化是将物理和非物理资产转化为数字代币的方法。代币的使用可进一步增强在区块链平台内向参与者流通和分配奖励及权益。示例包括投票权、版权和效用\
  \ [9]。例如，公司可以对房地产或艺术品等资产进行代币化，以帮助解决影响此类资产固有的流动性问题 [19]。最后，区块链可提供**增强安全性**。区块链的共识机制确保记录在区块上的交易经成员达成一致，从而增强数据完整性。通过哈希方法提高安全性，每笔交易都使用哈希算法加密，并正确链接到前一笔交易。每个节点都持有网络上执行的交易副本，意味着数据一旦写入，就无法在这些不可变的区块链网络上被篡改\
  \ [36]。\n\n## 区块链作为 ZTA 工具\n\n区块链与一种称为**零信任架构**的模型有着某些值得注意的相似之处 [34]。ZTA 是一种安全理念，核心在于：组织不应自动信任其边界内外的任何事物\
  \ [18]。ZTA 中不存在隐含信任，这确保了信任级别根据上下文显式且动态地计算。ZTA 概念借鉴了多因素认证、加密、文件系统权限、用户位置信息以及用户寻求访问的应用程序等技术来计算信任。信任是扩展或访问在无信任环境中原本不可能实现的能力的前提。因此，信任是对信念保证相对强度的指示\
  \ [27]。\n\n表 1.3 将 ZTA 的一些关键特征与一些区块链最佳实践进行了比较。\n\n表 1.3 ZTA 与区块链最佳实践\n\n| **领域**\
  \ | **ZTA 最佳实践** | **参考文献** | **区块链如何适配零信任最佳实践** | **参考文献** |\n| --- | --- | ---\
  \ | --- | --- |\n| **身份与访问管理 (IAM)** | 鼓励将网络安全与身份访问管理原则相结合。 | [34] | 在私有区块链中提供安全的访问和身份管理。\
  \ | [42] |\n| **特权身份管理** | 遵循最小权限原则，授予完成任务所需的访问权限。 | [33] | 应用哈希函数和数字签名作为零知识证明原则，以验证并将用户及资源特权限制在必需范围内。\
  \ | [42] |\n| | 呼吁采取治理策略，例如基于最小权限原则限制资源访问。 | [30] | 权限区块链可设计为仅允许特定用户在区块链上记录交易，而任何成员均可读取。\
  \ | [42] |\n| **强认证** | 建议加密网络上的所有通信，以在零信任环境中维护机密性、完整性并提供源认证。<br>建议使用强认证来缓解横向移动和广域网通信相关风险，而非仅检查请求的源地址。\
  \ | [41]<br>[12] | 采用非对称密钥加密和对称密钥加密等密码学概念进行加密处理。 | [42] |\n| **系统监控安全** | 建议监控和衡量所有自有及关联资产的完整性与安全态势，以检测任何持续活动和流程变更。\
  \ | [33] | 区块链中的挖矿/验证节点有助于发布链上的新区块。挖矿或验证节点检查发布区块中所有交易的有效性，并拒绝包含无效交易的区块。 | [42] |\n\
  | **数据安全控制** | 认可在数据或资源周围构建安全控制，基于主机的防火墙不符合零信任模型，但利用自动化有助于理解每个应用程序的需求，从而将其编码在本地防火墙中。\
  \ | [12] | 每个创建的区块都经过哈希处理以生成代表该区块的摘要。哈希摘要通过保护节点中复制的交易来防止区块被篡改，链中每个节点都将拥有区块哈希的副本，从而检测任何变更。\
  \ | [42] |\n\n## 结论与建议\n\n\n\n\n本介绍性章节考察了区块链的基础知识、类型及其组成部分。本章的目标是为读者提供区块链的基本知识。涵盖的主题包括区块链起源、拜占庭将军问题以及区块链与传统数据库的区别。第\
  \ 1 章进一步重点介绍了区块链的基本属性和优势。第 1 章还讨论了区块链技术在零信任架构环境中的地位。区块链技术将长期存在，并且该技术拥有众多潜在用例，将在未来的章节中探讨。\n\
  \n## 核心概念\n\n本章的核心概念重点如下：\n\n*   **中本聪** 是一位个人（或可能是一组个人），在 2008 年发表关于比特币点对点自动化现金系统的论文后成为家喻户晓的名字。该论文提议使用电子现金支付作为传统银行系统的更好替代方案。中本聪于\
  \ 2009 年进一步推出了首个比特币，从那时起，该技术在过去十年半中不断发展。\n\n*   **区块链** 是一个去中心化、分布式、点对点的网络，拥有不可篡改的记录。防篡改架构使其成为一项特别稳健的技术。网络中的每笔交易都受到加密哈希算法的保护，防止数据被删除或篡改。因此，成员需要验证区块交易。\n\
  \n*   区块链的属性包括**共识**、**溯源**和**不可变性**。\n\n*   区块链包含各种组件，例如**区块**、**链接区块**和**共享账本**。\n\
  \n*   **拜占庭将军问题** 探讨了在无信任环境中运作的设防城市中的拜占庭将军理论。**拜占庭容错** 在区块链技术中具有相关性：它是源自拜占庭将军问题的相关概念，系统能够承受网络中此类故障。\n\
  \n*   区块链仅允许用户读取和写入交易。另一方面，传统数据库支持用户利用所有四种功能：创建、读取、更新和删除（**CRUD**）。\n\n*   **公有链**\
  \ 是无需许可、共享和同步的账本，任何用户均可在无访问控制限制的情况下访问、加入或使用。**私有链** 是通常由赞助组织控制的许可网络。**混合链** 结合了公有链和私有链的特性。**联盟链**\
  \ 通常是混合链，各组织参与管理网络。\n\n*   **零信任架构** 基于这样一个概念：组织不应自动信任外部和/或内部环境中的任何事物。ZTA 是一种防御模型，考虑网络外围、数据、应用程序、资产和服务等最关键方面。ZTA\
  \ 消除了对网络所有边界的信任。其目标是在无信任环境中将组织的风险暴露降至最低。从而确保实现机密性、完整性和可用性原则。区块链技术的使用与 ZTA 原则兼容。\n\
  \n## 促进理解的活动\n\n该练习旨在帮助读者更好地理解中本聪关于比特币作为点对点在线支付系统的白皮书。请在阅读白皮书时特别关注以下问题，白皮书可在以下网址获取：[`bitcoin.org/bitcoin.pdf`](https://bitcoin.org/bitcoin.pdf)\n\
