  \ Decentralized Applications. Birmingham: Packt Publishing.\n\n# 10 区块链应用的测试与审计\n\
  \nKaren Akshatha Franklin, Philip Samuel Panneer Selvam and Samhitha Keshireddy\n\
  \nDOI: [10.1201/9781003211723-10](http://doi.org/10.1201/9781003211723-10)\n\n##\
  \ 摘要\n\n本章是设计/开发/测试区块链应用三部曲的最后一章。假设遵循合理的区块链设计和开发原则、工具及最佳实践，在应用开发阶段和最终测试阶段严格遵循彻底的测试程序至关重要。本章讨论首先介绍了\
  \ 10 多种不同的区块链应用测试程序。虽然采用所有讨论的测试方法极有可能非常耗时且昂贵，但信息系统审计师和区块链测试专业人员需要采用多种测试程序，以确保区块链应用在全面部署前功能完备。\n\
  \n本章还讨论了各类缺陷的类型以及成功缺陷管理的四步策略。文中推荐了多种区块链测试应用和缺陷分析工具，并提供了下载链接。此外，还介绍和讨论了测试管理原则及相关概念的基础。\n\
  \n本章最后提供了一份基于印度 KPMG 开发框架的综合区块链应用审计清单。该清单应成为信息系统审计师在规划和实施区块链专项审计时的宝贵工具。\n\n## 为何测试区块链应用至关重要\n\
  \n区块链应用并非仅存在于加密货币的数字领域。这些应用需要与其他软件和系统集成，以确保区块链解决方案能够访问现实世界的数据和事件，如智能合约。区块链账本的不可篡改性和分布式特性，加上智能合约的引入，为企业提供了极具吸引力的解决方案。考虑到该技术相对较新，它确实伴随着自身的一系列当前缺陷和漏洞。基于智能合约的区块链平台大有可为，但缺乏测试、最佳实践和标准，使其架构可能变得脆弱并被黑客利用。与区块链系统集成的技术中存在安全漏洞。因此，所有区块链项目都应针对质量、合规、治理和风险价值进行测试和评估。\n\
  \n2016 年，去中心化自治组织宣布了针对以太坊的攻击，该攻击与黑客利用以太坊平台上的漏洞有关。该漏洞并非存在于智能合约中，却造成了总计 1.5 亿美元的损失。针对各类区块链的此类攻击证明，如果代码未针对每一种潜在威胁进行广泛测试，将会发生何种后果\
  \ [23]。\n\n要成功推出区块链解决方案，加入区块链生态系统的参与利益相关者之间必须存在信任。为确保这种信任，需要对区块链组件进行测试，以确保其正常工作，并确定与区块链框架集成的任何应用是否以可信方式交互。\n\
  \n因此，测试区块链应用对于向区块链的所有各个组件提供软件质量至关重要；因此，测试人员应采用基于最佳实践的测试方法套件 [15]。\n\n## 区块链常用测试工具\n\
  \n拥有实际系统代码访问权限的原始区块链开发人员使用一种称为 `emulation`（仿真） 的过程。仿真用于测试不同私有、公有和联盟链的整体性能。有许多仿真工具被用于测试不同平台。下面解释其中几种。\n\
  \n*   **`Ethereum Tester`**：一个以太坊驱动的开源库，有助于评估面向客户项目的初始性能。该工具还分析 API 操作、Web 集成、智能合约及其他区块链组件（如\
  \ DApps）的运行情况。\n\n*   **`Truffle`**：基于以太坊的区块链工具评估套件（即 Truffle Suite）的第一个组件。在 Truffle\
  \ 的开发环境中执行智能合约的部署、编译和测试。\n\n*   **`Corda Testing Tool`**：专为 R3 Corda 设计的开源环境，为单元测试和集成测试提供广泛功能。\n\
  \n*   **`Exonum Test Kit`**：一个使用 `Rust` 编程语言创建区块链的开源框架，重点测试交易逻辑。用于测试的测试工具包提供了 Java\
  \ 绑定工具，因为它是软件开发工具包（SDK）的一部分。\n\n*   **`BitcoinJ`**：一个基于 Java 的开源框架。使用 Java 设计，实现比特币协议（BTC\
  \ 网络）以与比特币网络交互并执行其他测试活动。该协议提供维护钱包的访问权限，允许用户在无需本地比特币核心副本的情况下发送/接收交易。\n\n*   **`Hyperledger\
  \ Composer`**：由 Linux 基金会提供的开源开发工具集和框架，支持交互式测试、自动化单元测试和系统测试。Hyperledger Composer\
  \ 使用 JavaScript 实现区块链交易 [21]。\n\n### 区块链实现测试中的挑战\n\n测试作为一个过程在软件开发生命周期中得以有效执行，因为存在缺陷穿透应用程序的可能性。为了实现区块链中的交易流程，分布式网络中的所有自治系统都需要协作和协调。\n\
  \n\n\n\n\n## 区块链测试概述\n\n存在多种设备，它们在不同的操作系统上运行各自的编程语言。通常，系统数量巨大，而针对区块链分布式架构的测试场景可能是一项艰巨的任务。因此，测试人员有可能针对同一场景得出不同但均正确的测试结果。考虑到区块链广泛的功能性、可扩展性和性能，要实现全面的测试覆盖率颇具挑战性。\n\
  \n在私有链和公有链中，最重要的考量方面是架构的网络安全。尽管区块链常被吹捧为交易最安全的平台，但安全漏洞仍然可能发生。因此，监控此类分布式网络中节点的连通性非常重要\
  \ [[8]](#ch18.xhtml#r367)。\n\n### 区块链测试阶段\n\n为遵循有效的测试方法论，必须考虑以下四个关键阶段，以实现区块链应用的质量保证：\n\
  \n*   **系统启动阶段**：强烈建议测试人员在最早阶段介入，以了解受影响的组件/模块，并将其与无缝运行的模块进行对比。这将指导测试人员为受影响的模块部署各种测试场景，并在后续阶段执行回归测试。\n\
  \n*   **测试设计保证阶段**：就区块链测试而言，关键设计策略应基于区块大小、交易、合约以及网络上的端点系统对等节点来考量。随后，测试人员需要根据这些应用需求开发和设计测试策略。\n\
  \n*   **测试计划阶段**：该阶段确定用于测试的测试用例和场景的详细摘要。此外，它有助于为测试模块选择所需的测试工具和方法论。\n\n*   **测试执行与结果验证**：最后阶段是根据测试计划中概述的方法，清晰阐述测试执行方法\
  \ [[24]](#ch18.xhtml#r383)。\n\n### 测试模型：功能测试\n\n功能测试专注于区块链的核心功能。此类测试涵盖整个网络架构以及节点/对等系统，以获取期望的验证和确认。区块大小为测试人员创建了许多检查点，且每个区块的有效载荷取决于具体应用。\n\
  \n每个区块可用于众多交易，因此必须考虑区块大小的增加及其对交易速率的影响。在此类场景下，生成的链不能限制在特定长度；因此极其需要充分的监控。\n\n在具有透明数据可用性的\
  \ P2P 网络中传输数据，要求测试加密和解密过程以确保交易完整性。区块链的不可篡改性要求测试交易的合法性 [[15]](#ch18.xhtml#r374)。区块链功能测试的主要策略如下。测试人员在某一阶段发现的问题，预期应在进入下一阶段前得到修正，这也能减少工作冗余。\n\
  \n*   **单元测试**：每个模块都需要根据应用的功能和结构单独进行测试。测试覆盖率应根据模块集成中涉及的功能来考量。\n\n*   **集成测试**：将通过单元测试的模块作为一个整体系统一起执行测试。下一步是进行集成测试，此时测试人员将查找缺失功能和/或模块接口方面的集成问题导致的错误\
  \ [[13]](#ch18.xhtml#r372)。\n\n*   **回归测试**：作为一种主要测试方法论已使用超过 20 年，通过网络仿真测试平台（如 `DETERLAB`\
  \ 和 `Emulab`）增强了分布式系统的测试。利用这些仿真测试平台，分布式系统可以部署并测试程序的可重复性 [[28]](#ch18.xhtml#r387)。\n\
  \n*   **API 测试**：作为中间件平台的 API 负责区块链数据的进出交易。区块链环境因内部和外部因素的交易而呈现临时性，这要求 API 必须经过全面测试。发生的交易应根据规则集进行验证，从而生成更新并分发到区块链网络。API\
  \ 测试专注于处理区块链上发生的交易的请求和响应。创建的规则将在每次交易发生时，从外部和内部环境触发至中间件应用 [[15]](#ch18.xhtml#r374)。\n\
  \n*   **性能/负载测试**：在将应用部署到生产环境前，测试区块链网络的性能和延迟至关重要。测试性能涉及的关键参数包括网络延迟、交易处理速度、区块大小和交易节点序列。测试网络规模及其处理交易的能力是必要的，因为这有助于在部署前识别性能瓶颈，并估算在期望环境中运行应用的成本\
  \ [[17]](#ch18.xhtml#r376)。在单独节点上进行负载测试，是为了检查特定节点是否有能力将交易卸载给其对等节点，这与通过使整个网络过载来测试所有节点形成对比。通过这种方式，可以评估所有节点组合的延迟、吞吐量和容量\
  \ [[26]](#ch18.xhtml#r385)。\n\n*   **智能合约测试**：智能合约是一组计算机规则或交易协议，当区块链上满足特定条件时会自动执行。因此，严格测试智能合约以确保其绝对完美运行至关重要。智能合约测试的关键测试程序包括业务逻辑的功能测试、节点测试以确保交易一致性，以及验证共识机制的有效性和随之而来的数据不可变性。可用\
  \ `Truffle`、`Mocha` 和 `Chai` 等测试框架来测试智能合约。智能合约测试涉及为每个合约模拟所有可能的预期和意外条件，测试所有业务逻辑组合，以及交易的正确触发和执行。在测试智能合约时利用测试驱动开发是避免智能合约出现任何错误或漏洞的正确方法。测试驱动开发涉及先编写测试用例，然后修改代码直到代码通过编写的测试\
  \ [[23]](#ch18.xhtml#r382)。\n\n*   **变异测试**：DeMillo、Lipton 和 Sayward 首先提出了变异测试，并基于称职程序员假设和耦合效应假设将其公开。称职程序员假设提出，大多数程序员犯的错误在进行少量修改后非常接近正确。耦合效应假设解释了复杂缺陷与简单缺陷相耦合，测试数据集将检测出系统中的所有故障（即许多简单缺陷的组合）。因此，变异测试是一个过程，测试人员通过改变应用源代码的特定组件来导致程序出错，以确保测试软件能够检测到所应用的变更\
  \ [[30]](#ch18.xhtml#r389)。\n\n\n\n\n\n#### 节点测试\n\n区块链的威力在于共享分布式账本在链的每个节点上都拥有相同的交易序列集合。因此，需要进行节点测试，以确保交易具有顺畅的一致性，并且与其他验证节点保持同步\
  \ [1]。为了测试交易的一致性，需要测试共识协议，以确保即使某些节点发生故障，交易也能被正确排序。在测试节点时，还需要测试弹性。这可以通过验证网络上重启或重新加入的任何节点是否与其他验证节点同步来完成\
  \ [22]。\n\n## 区块链缺陷管理考量\n\n缺陷可被归类为：与应用程序指定需求的任何偏差，或与预期行为的任何偏差（此类偏差可能给环境带来潜在威胁）[11]。软件测试不仅关乎区块链应用的质量保证、控制和验证，还有其他因素需要考量。拥有有效的质量保证和缺陷管理方法，对于确保区块链应用在发布前达到高标准至关重要\
  \ [9]。\n\n缺陷管理的基本目标是识别和检测系统中的缺陷，但这只是成功的一半。缺陷管理的关键步骤包括记录发现的缺陷、登记并跟踪缺陷，以及尽快组织和解决问题。建议在软件开发生命周期（SDLC）的早期阶段识别并修正系统中的任何安全或性能缺陷，因为这不仅能提供质量保证，还能节省大量资金、时间和精力。此外，在\
  \ SDLC 后期发现缺陷会使缺陷检测变得更加困难，解决起来也更具挑战性 [11]。\n\n### 四步缺陷管理策略\n\n缺陷管理应被视为企业的优先事项，因为它不仅融入企业文化，还影响客户满意度。\n\
  \n以下是识别差距并更接近零缺陷目标的四步策略。\n\n*   **缺陷可见性**：缺陷管理的这一部分围绕已发现的缺陷展开，旨在了解为有效的产品交付应做出何种决策。获得清晰可见性的标准是质量、时间、质量和特性。\n\
  *   **缺陷优先级排序**：一旦确认清晰可见性，优先级排序就是下一步。数据质量和获取正确信息对于缺陷优先级排序至关重要。发现的缺陷应根据其严重程度进行优先级排序，严重程度通过所获取的信息（如风险等级、缺陷范围及其分类）来衡量。\n\
  *   **缺陷解决**：在获得清晰可见性并获取准确信息后，可在 SDLC 过程中更早地做出及时且更快的决策，从而节省时间和金钱。团队可根据商定的方法，协作制定步骤以解决缺陷。\n\
  *   **缺陷分析**：完成上述步骤后，将进行分析过程，其中会考虑所有已识别缺陷的输入。通过此过程，团队将更接近实现零缺陷的“涅槃”目标。\n\n通过步骤 1-3，所有关键缺陷信息和纠正措施实施均被记录并收集，用于未来的缺陷预防。这些包括但不限于经验教训、根因分析方法及结果。系统具备记录缺陷分析过程以实现历史追溯的能力，对于更接近零缺陷目标至关重要\
  \ [10]。\n\n### 区块链缺陷类别\n\n区块链系统的可靠性深受缺陷影响。因此，研究和理解缺陷特征有助于设计高效工具，以预防、缓解和检测区块链系统上的缺陷。对缺陷进行分类有助于识别区块链应用环境中存在的弱点和漏洞。\n\
  \n以下是区块链系统和应用中普遍存在的各类缺陷：\n\n*   **并发缺陷**：并发缺陷是由程序中并发线程或进程之间引起的。基本上，此类缺陷导致同步问题。与\
  \ Mozilla 和 Apache 相比，此类缺陷通常在 Linux 内核中被识别出来。\n*   **环境与配置缺陷**：环境与配置缺陷是以第三方库的形式隐藏在操作系统中或配置文件中的缺陷。此类缺陷的发生率排名第二。通常需要数月时间来修复此类缺陷。\n\
  *   **硬分叉缺陷**：此类缺陷在突然的协议变更导致先前有效的交易变为无效交易（或反之亦然）时引发问题。这种系统行为的变化也会影响区块链协议中的共识 [29]。\n\
  *   **性能缺陷**：性能缺陷是可能导致性能下降的错误，最终损害软件性能和质量。这可能导致用户体验差、应用响应能力下降、系统吞吐量降低和计算资源浪费 [16]。性能缺陷的一个例子是在比特币中发现的一个高严重性性能缺陷。比特币区块链上的远程节点未能从其内存中移除无效交易。这导致了拒绝服务漏洞，因为远程节点无法清理交易，从而用被称为“失控资源消耗”的陈旧数据淹没受害者节点，最终可能导致节点关闭，从而降低区块链网络的性能\
  \ [5]。\n*   **回归缺陷**：在执行软件测试时，会识别出缺陷并随后采取修复措施。缺陷修复后，会进行回归测试，以确保近期的缺陷修复没有导致功能中断。通过此类测试发现的缺陷称为回归缺陷。回归缺陷难以处理，但必须在发布前解决。这些缺陷会增加项目成本、造成时间复杂性并降低项目的整体敏捷速度\
  \ [2]。\n*   **安全缺陷**：安全缺陷是软件弱点或漏洞，例如应用程序中的设计缺陷，威胁主体可能利用这些缺陷通过暴露漏洞来攻击整个区块链架构 [6]。区块链可能存在特定于应用的安全缺陷，如时序攻击和\
  \ DDOS 攻击，或缺失安全检查。安全缺陷通常需要最长时间来解决。\n*   **语义缺陷**：语义缺陷是由于程序员对系统缺乏透彻理解而发生的。这类缺陷难以识别，因为它们特定于应用程序。语义缺陷有时被称为主要运行时缺陷，因为超过\
  \ 70% 的报告缺陷属于语义缺陷；其中 23.9% 是由缺失用例（也称为疏忽条件缺陷）引起的。其他原因包括不正确的处理过程、异常处理、缺失功能、不正确的控制流或输入/输出问题\
  \ [29]。\n\n\n\n\n\n### 用户界面 (UI) Bug\n\nUI bug 会导致设计偏差或应用程序功能出现缺陷，从而导致糟糕的用户体验。UI\
  \ bug 的一个例子是 **Parity Multisig（多签）** bug，该 bug 导致作为所有 Parity 多签钱包共享组件部署的智能合约库代码中存在漏洞。在一次事件中，该\
  \ bug 暴露了一个漏洞，由于 Solidity 的默认公开策略，允许用户将自己设为库合约的所有者。随后，该用户使用 `kill()` 命令销毁了整个库，这冻结并封锁了\
  \ 587 个钱包的资金，当时总计高达 513,774.16 个以太币（约合 1.6 亿美元）[25]。\n\n## 以太坊智能合约中的 Bug\n\n作为最大的智能合约区块链平台，以太坊过去曾面临多个与\
  \ bug 相关的智能合约问题。不幸的是，由于目前缺乏成熟的框架和分类体系，很难识别智能合约中的 bug。现有工具仅有助于解决一小部分 bug 问题。对于新开发者来说，要完全理解\
  \ bug 造成的所有影响具有挑战性。正因如此，设计新的 bug 检测和解决方法变得更加困难。Bug 分类可采用适用的 NIST 框架执行；然而，在所有已识别的\
  \ bug 中，只有少数被归类为定义明确的类别，其余均归类为“其他类别”。Bug 检测标准是一个脆弱的过程，这使得开发者难以设计检测 bug 的工具和算法。为了解决这些局限性，以太坊开发者正持续发现和分析各种\
  \ bug 行为。\n\n有时，当收集和分析智能合约 bug 时，开发者会发现一些本质相同但名称不同的 bug，因为没有遵循的 bug 命名约定。因此，根据 bug\
  \ 造成后果的性质，将重复的 bug 合并在一起。\n\n两个值得注意的智能合约分析工具包括 **Slither**，它是检测 bug 的较有效分析工具之一，具有可接受的精确率。该工具可通过名为\
  \ `pip3` 的 Python 包轻松安装，并可在 [`github.com/crytic/slither`](https://github.com/crytic/slither)\
  \ 下载。**Remix** 是另一个用于 bug 检测且具有高精确率的分析工具。Remix 可通过 Remix IDE 平台安装，并可在 [`remix-wide.readthedocs.io/`](https://remix-wide.readthedocs.io)\
  \ 访问 [32]。\n\n除上述工具外，还有其他一些工具推荐用于 bug 分析和智能合约分析，如 表 10.1 所示。\n\n### 表 10.1：Bug 分析工具\n\
