  \ 位）[23]。<br>• 共享密钥不会通过主通信信道传输 [58]。 | • 缺乏认证 [58]。<br>• 易受中间人攻击 [23]。<br>• 易受量子计算攻击，因为密钥的安全性依赖于其难度\
