  \ 以太坊、Hyperledger 和 Corda：针对开发各类业务用例的能力与约束的并列对比\n\nManroop Kaur 和 Navjot Lnu\n\n\
  DOI： [10.1201/9781003211723-7](http://doi.org/10.1201/9781003211723-7)\n\n## 摘要\n\
  \n本章深入探讨了三种当前流行的区块链框架，即以太坊、Hyperledger 和 Corda。\n\n以太坊讨论部分首先介绍了以太坊的各个组件，这是一个拥有自身加密货币（以太币）的公有链。从历史上看，以太坊是第一个引入智能合约概念的区块链框架——这改变了区块链技术的游戏规则。本章第一部分还包含了以太坊智能合约和共识机制的特性与局限性，以及以太坊在医疗保健和供应链管理领域多个用例的简要讨论。\n\
  \n本章第二部分讨论了多个 Hyperledger 框架，如 Hyperledger Burrow、Fabric、Indy、Iroha 和 Sawtooth，旨在让读者更好地了解这些不同的私有、许可制\
  \ Hyperledger “变体”。此外，还介绍并讨论了多个 Hyperledger 相关工具。这些包括 Hyperledger Caliper、Composer、Cello、Explore\
  \ 和 Quilt。\n\n本章第三部分重点关注 Corda 框架，这是银行和金融服务行业流行的区块链框架。Corda 的各个组件也被介绍和讨论。本节还简要讨论了\
  \ Corda 智能合约、共识机制的特性，以及 Corda 在医疗保健、建筑和金融领域的多个用例。关于 Corda 网络中的用户隐私和 Corda 的局限性的简要讨论也包含在本章第三部分中。\n\
  \n最后，本章以这三个框架的并列对比作为结尾，采用易于参考的格式，并附带一个决策树，可作为决定采用最合适框架的第一步，具体取决于组织设想的用例。\n\n####\
  \ 以太坊\n\n以太坊项目是一个开源项目，最初由其创始人、俄裔加拿大人 Vitalik Buterin 于 2013 年提出，并于 2015 年正式启动。以太坊项目旨在提供一种替代协议，专门设计用于让人们构建去中心化应用。该项目的主要目标之一是，通过使用一种加载且无歧义的语言定义状态变更系统，并设计一种能够自主应用此类协议的系统，赋予自愿的个人在无信任环境中与其他自愿个人进行交易的能力。缺乏信任可能源于地理隔离、接口挑战，或者现有法定系统的不兼容、无能、不情愿、成本、风险、不便或腐败，而以太坊致力于为这些问题提供可行的解决方案。\n\
  \n以太坊是一个无许可、开放的区块链，集成了图灵完备编程语言，用于创建智能合约。作为一个具有内置编程语言的通用区块链，以太坊允许其用户将区块链用于他们想要创建的任何去中心化应用。术语\
  \ `图灵完备编程语言` 意味着以太坊可以支持所有类型的计算 [18]。以太坊通过允许用户制定其个性化的所有权规则集、状态转移函数和交易格式，赋予用户编写定制智能合约和去中心化应用的能力。换句话说，以太坊提供了一个通用的可编程区块链，封装在一个人人可用的开放客户端中。例如，以太坊可以构建完全值得信赖且透明的金融应用，因为它们运行在区块链上，并使用可以用数学方式定义的智能合约或交易类型。以太坊合约是用以太坊虚拟机代码（即\
  \ EVM 代码）编写的；一种低级的、基于栈的字节码语言。\n\n以太坊还拥有一种虚拟货币 `Ether`，也称为 ETH，用于支付区块链相关的交易费用。`Wei`\
  \ 是最小的以太币子面额，所有货币整数值均以此计数。1 个以太币等于 10¹⁸ Wei [7, 19]。\n\n从根本上说，以太坊的设计旨在做到简单、通用、模块化、敏捷、非歧视性和非审查性\
  \ [17]。除非能提供有价值的优势，否则以太坊协议倾向于不包含任何复杂的优化，从而保持其易于实现。此外，其内置的图灵完备脚本语言使用户能够使用可以用数学方式定义的智能合约或交易类型；从而使以太坊与所有类型的计算具有通用兼容性。再者，由于以太坊采用模块化设计，各部分可分离，因此允许用户在一处进行微小的协议修改，而不妨碍应用其余部分的运行。此外，以太坊协议具有灵活性，因为它们开放给可以显著增强以太坊可扩展性或安全性的修改。此外，以太坊协议力求不主动限制或约束明确的使用划分。协议的调节机制力求不针对特定的不受欢迎的应用，而是直接管理危害，从而避免歧视和审查\
  \ [17]。\n\n### 以太坊的组件\n\n为了透彻理解以太坊区块链的工作原理，有必要对其各个组件有基本的了解（图 7.1）。因此，将在以下部分简要解释以太坊的每个组件。\n\
  \n![图 7.1 区块与交易。 ¶ 来源： 15，使用 Microsoft PowerPoint 重绘。](img/9781032078243_C007_001.jpg)\n\
  \n图 7.1 区块与交易。 ¶ 来源： [15]，使用 Microsoft PowerPoint 重绘。\n\n`世界状态` 是 160 位地址与账户状态之间的映射。维护此映射的数据库后端称为\
  \ `状态数据库`。每个账户状态都有一个 20 字节的地址和一个状态转移，可直接在账户间转移价值和数据。账户状态包含以下四个字段：\n\n*   `Nonce`（随机数/交易计数）：一个标量值，表示从特定地址发送的交易数量，或特定以太坊账户创建的合约数量（带有关联代码）。它确保每笔交易仅被处理一次。\n\
  \n*   `Balance`（余额）：一个标量值，表示以太坊账户地址拥有的以太币数量。\n\n\n\n\n\n#### 以太坊账户组成\n\n##### 合约代码\n\
  当以太坊账户接收到消息调用时执行的代码。它还包含以太坊账户 EVM 代码的哈希值。由于以太坊账户的合约代码是不可变的，因此创建后无法更改。\n\n##### 账户存储\n\
  一个 256 位的根节点哈希，用于编码以太坊账户的存储内容。默认为空。\n\n#### 账户类型\n\n**外部拥有账户**和**合约账户**是以太坊中的两种账户类型。外部拥有以太坊账户由私钥控制。合约账户是由其合约代码控制的以太坊账户。\n\
  \n#### 交易\n\n**交易**是由以太坊范围外的参与者用加密方式签名的单个数据包，它存储一条从外部拥有账户发送给参与者的消息。软件工具用于构建和传播交易，而最终的外部参与者预期是人类。交易分为两种：\n\
  1. 导致消息调用的交易\n2. 导致创建带有关联代码的新账户的交易\n\n两种类型的交易都包含以下字段：\n\n*   消息接收者的 160 位地址。通过交易的签名来识别发送者。\n\
  *   **Nonce**：发送者发送的交易数量（标量值）。\n*   **GasPrice**：发送者为交易执行期间产生的所有计算成本支付的每单位 Gas 的以太币数量（标量值）。\n\
  *   **GasLimit**：执行交易时可以采取的最大计算步骤数（标量值）。在任何计算发生之前，Gas 费用会预先支付。\n*   **Value**：表示从发送者传输给接收者的以太币数量（标量值），在合约创建的情况下，也作为新建立账户的捐赠。\n\
  \n合约创建交易还包含一个无限字节数组，其中包含用于初始化账户的 EVM 代码。\n\n#### 区块\n\n**区块**是包含链上前一个区块哈希的交易批次。以太坊网络利用区块确保网络上的所有用户维护同步状态，并就交易的详细编年史达成共识。在以太坊网络上，每个区块都包含对其父区块的引用，以确保交易历史的保存。此外，区块内的交易也严格有序。\n\
  \n以太坊网络上的一个区块包含以下字段：\n\n*   **区块编号**：表示区块链长度（以区块为单位）的标量值。\n*   **时间戳**：表示区块创建时间的值。\n\
  *   **难度**：表示挖掘区块所需工作量的标量值。\n*   **MixHash**：与 Nonce 结合时，确认区块已进行足够计算的哈希值。\n*   **Nonce**：与\
  \ MixHash 结合时，确认区块已进行足够计算的哈希值。\n*   **父区块哈希**：前一个区块头的哈希值。\n*   **状态根**：表示所有交易执行并最终确定后整个系统状态的哈希值。\n\
  *   **交易列表**：包含该区块上每笔交易收据的列表。\n\n网络和矿工共同设定 Gas 限制以防止区块大小任意增大，因此网络中的每个区块都有定义的大小。由于空间和速度限制，任意大的区块大小会逐渐阻止性能较差的全节点跟上网络。挖掘新区块的矿工可以将\
  \ Gas 限制在父区块 Gas 限制的基础上向两个方向各调整最多 0.1%。由于数百笔交易可能同时发生、达成共识并同步，以太坊对提交进行了间隔，给所有网络用户充足的时间达成共识。在以太坊网络上，大约每\
  \ 15 秒提交一个区块，尽管交易请求每秒会到来几十次。一旦矿工挖出一个区块，它就会被传递给网络的其余部分，所有现有节点将新挖出的区块添加到其区块链的末尾。\n\
  \n#### 消息\n\n**消息**是以太坊网络中一个合约用来向其他合约发送消息的数据结构。消息仅存在于以太坊的执行环境中。它包含消息发送者、交易发起者、消息接收者、将要执行代码的以太坊账户（通常与接收者相同）的信息。此外，消息还包含以下字段：\n\
  \n*   **StartGas**：表示交易可用 Gas 的标量值。\n*   **GasPrice**：发送者为交易执行期间产生的所有计算成本支付的每单位\
  \ Gas 的以太币数量（标量值）。\n*   **Value**：表示除消息外，从发送者转移给接收者的以太币数量（标量值）。\n\n正如迄今所讨论的，通常消息类似于交易；然而，它是由合约而非外部参与者在接收者账户执行合约的特定代码后产生的\
  \ [17, 19]。\n\n### 智能合约\n\n网络参与者无需编写新代码即可使用 EVM 进行计算。然而，应用程序开发者利用 EVM 存储上传可重用的代码或程序。因此，这些程序被用于通过使用不同参数来请求执行代码片段。这些上传到网络并为满足请求而实现的程序被称为**智能合约**。\n\
  \n简单来说，智能合约是在以太坊区块链上运行的程序。它是位于以太坊区块链特定地址上的一组不同代码及其状态。这意味着智能合约拥有余额，并可以通过网络提交交易。智能合约不是由单个用户操作的；而是上传到网络上，并根据一组指令运行。\n\
  \n#### 以太坊虚拟机\n\nEVM 作为由链接计算机管理的实体运行，有助于以太坊客户端的平稳运行。以太坊账户和智能合约用于其操作的环境是以太坊协议；其存在的唯一原因是维持\
  \ EVM 协议的持续、不间断和不可逆活动。链中现存的每个区块仅按一种规范状态运行，EVM 定义了为任何区块定义新状态所遵循的规则。\n\n#### 智能合约的特征\n\
  \n网络上的任何人都可以设计和部署智能合约。所需的只是了解智能合约的编码语言，并拥有部署智能合约所需的足够 ETH。然而，它们在实施前必须经过编译，这使得以太坊虚拟机能够读取和存储合约。智能合约可以被视为开放\
  \ API，因为它们在以太坊上公开可用。智能合约可以通过在一个智能合约中调用其他智能合约来大幅扩展。智能合约可以构建其他合约。\n\n可用于编写智能合约的开发者友好型语言包括：\n\
  \n*   **Solidity**：基于 C++ 和 JavaScript，静态类型。支持继承和库。\n\n\n\n\n\n#### Vyper\n\n**Vyper**\
  \ 基于 Python，要求具备强类型技能。Vyper 使用的编译器代码简短且易于理解。为了使合约更安全且易于审计，与 Solidity 相比，Vyper 故意缺少某些功能。它不支持修饰符、继承、内联汇编、运算符重载、定点二进制数和递归调用。\n\
  \n#### Yul\n\n**Yul** 是一种用于编写以太坊代码的中间语言，而 **Yul+** 是 Yul 的进阶版本。对于以太坊新手，建议从 Solidity\
  \ 和 Vyper 入手。只有深刻了解智能合约安全最佳实践并知晓 EVM 工作细节的人员，才应考虑使用 Yul 和 Yul+。与 Yul 相比，Yul+ 具有额外功能。Yul\
  \ 支持 EVM 和 Ewasm；然而，Yul+ 最初是为设计乐观汇总合约而使用的。\n\n#### 智能合约的局限性\n\n按设计，智能合约无法发送 HTTP\
  \ 请求；因此，它们无法自行收集关于现实世界事件的数据。完全依赖从外部来源获取的信息极大地危及共识 [20]。在最坏的情况下，这会对安全性和去中心化产生重大影响。\n\
  \n### 共识机制\n\n对于像以太坊这样的区块链（本质上是一个分布式系统）要以安全的方式协同工作，网络节点必须就系统的当前状态达成一致。这种一致性，也称为数据库节点间的**共识**，是通过共识机制实现的。直到\
  \ 2021 年，以太坊使用 PoW（工作量证明）共识协议。以太坊接口使用的共识机制是 GHOST 协议（贪婪最重观察子树）的修改版，旨在通过将陈旧区块纳入最长链计算来解决网络中的陈旧区块问题\
  \ [17, 18]。\n\n2021 年，以太坊开始从 PoW 向权益证明（PoS）过渡。与工作量证明不同，验证者不需要巨大的算力，因为他们是随机选出的，且不进行竞争。验证者不需要挖掘区块；相反，他们在被选中时必须创建区块，在未被选中时验证提议的区块，这被称为**见证**。验证者因提出新区块和见证已见区块而获得奖励。\n\
  \n### 以太坊的局限性\n\n以太坊——与其他区块链一样——也存在局限性。它是一个公共区块链；因此继承了公共区块链的所有局限性。此外，以太坊相对较慢，因为矿工验证并向以太坊区块链网络添加一个区块需要\
  \ 12 秒。再者，以太坊智能合约使用 Solidity 编码语言，后者有其自身的局限性；因此以太坊也继承了 Solidity 语言的所有局限性。\n\n###\
  \ 以太坊用例\n\n以太坊是当今世界上许多行业最广泛接受的区块链框架之一。以太坊区块链技术极具前景的特性——如无需信任、支持历史不可篡改、完整性、透明性、机密性和可审计性的去中心化账本——为许多行业实现安全性和保障提供了巨大潜力。银行业、网络安全、审计、医疗保健和供应链管理等行业领域已开始将以太坊区块链的精髓应用于其当前的业务流程中。市场上许多应用程序已利用以太坊区块链。示例包括\
  \ **MetaMask**，一种网页浏览器插件，可启用设备进行点对点共享、代币交换和连接到以太坊网络；**Civic**，一种基于区块链的**安全身份和数据管理**应用程序；以及\
  \ **Compound Finance**，以太坊网络上用于算法化、高效货币市场的开源协议 [17]。\n\n下一节简要讨论来自各行业的一些现实世界用例。第\
  \ 4 章、第 5 章 和 第 6 章 将更详细地探讨其中一些潜在用例。\n\n医疗保健行业正致力于开发智能医疗交付模型，这些模型能将患者健康数据整合到数字记录中，并与护理提供者共享，以支持明智的决策过程。尽管电子病历（EMR）系统已存在，但它们异构且不一致，在有效实施访问控制和安全策略方面表现不佳。研究人员和开发人员提出了一些极具前景的方案，可支持基于以太坊的医疗解决方案，以增强个性化护理。其中一个提议的解决方案是\
  \ **MedRec**，一种统一的以患者为中心的 EMR 系统，它利用基于以太坊的去中心化网络来管理和整合患者病历与患者护理提供者。MedRec 声称能克服传统\
  \ EMR 系统或其他基于 IT 的医疗信息系统导致的、当前对充分的跨组织信息共享构成的局限和威胁。此外，它旨在最终通过减少直接第三方的介入，填补患者与医疗提供者之间的沟通鸿沟。它使用私有区块链和工作量证明共识模型来维护和保护网络。为提供工作量证明的参与者授予访问匿名化和聚合患者数据的权限。这确保了网络中患者健康数据的完整性、不可篡改性、透明性、可用性、机密性和可审计性\
  \ [3]。\n\n随着无线网络的进步和廉价计算机芯片的普及，将智能设备变为 **IoT 设备** 现已成为可行任务。所有 IoT 设备都需要相互交互和同步，以提供所需功能。单个\
  \ IoT 网络可连接数千或数万个 IoT 设备。管理如此庞大的设备集群颇具挑战。以太坊区块链可通过利用智能合约定制图灵完备代码来定义 IoT 设备的行为，从而管理\
  \ IoT 设备。此外，作为一个通用、开放、分布式和无许可的区块链，它在不损害网络安全的前提下提供了简便的数据同步 [7, 17, 19]。\n\n正如第 6\
  \ 章所讨论的，**供应链管理**是一项复杂的任务，需要透明度和可追溯性，以通过更密切的监控来降低相关风险。实施区块链解决方案可为供应链数据流以及买卖双方之间的责任划分带来极具前景的改进。成功交付制造最终产品的运作需要一个高效运行的供应链网络。对该网络的任何中断都可能导致整个供应链失效。此类故障通常伴随财务、声誉损失，有时甚至造成环境破坏。当前的供应链管理系统运行在中心化网络上，需要第三方进行管理。中心化网络增加了与数据安全、隐私、技术可靠性和数据存储互操作性相关的风险\
  \ [7, 17, 20]。\n\n### Hyperledger\n\n\n\n\n\n### Hyperledger\n\n**Hyperledger**\
  \ 是指一个开源项目，旨在推动区块链技术在不同行业的发展，以实现协同合作而非各自为政 [2, 16]。该协作由 **Linux 基金会** 发起，遍布全球，涵盖顶级金融、银行业、物联网、供应链、制造业和技术行业。2015\
  \ 年，参与该协作的所有公司同意共享资源，共同创建开源区块链技术，以帮助满足任何组织的需求 [2]。作为 Linux 基金会的一部分，Hyperledger 为技术领域提供了一种独特且协作的方式，来设计、验证并提供由区块链技术给出的特定领域解决方案。这些解决方案可在全球社区中协作实施\
  \ [16]。截至 2015 年 8 月，有 230 家公司是 Hyperledger 协作的成员，参与者约 28,000 人。Hyperledger 旨在构建一个环境，使\
  \ Hyperledger 的愿景能够变为现实 [2]。\n\n### Hyperledger 框架\n\nHyperledger 方法促进了标准构建块的重用，推动了组件的快速修改，并鼓励项目间的互操作性。本节简要概述了各种\
  \ Hyperledger 框架。\n\n#### Hyperledger Burrow\n\n**Hyperledger Burrow** 是为区块链客户设计的许可型智能合约指南，部分设计旨在满足\
  \ **以太坊虚拟机 (EVM)** 的规范。Burrow 最初由 **Monax** 设计和推荐，并于 2017 年被评为 Hyperledger 中使用率第四高的分布式账本平台。它提供了一种完全基于智能合约的高度确定性区块链设计。Burrow\
  \ 的访问限制层已被证明对用户大有裨益。用户可通过使用智能合约和基于 **安全原生操作** 的权限层来访问该层。\n\n共识引擎、**应用区块链接口 (ABCI)**、智能合约应用引擎和网关都是\
  \ Burrow 的组件。共识引擎有助于在节点间维护堆栈，并对网络中应用引擎的交易进行排序。**ABCI** 规定了在共识引擎和应用引擎之间建立稳定连接的接口要求。智能合约应用引擎通过提供可靠的确定性智能合约引擎，帮助开发者成功运行复杂的工业流程。网关通过为用户提供编程接口，改善了系统集成和用户界面\
  \ [2]。\n\n#### Hyperledger Fabric\n\n**Hyperledger Fabric** 可被定义为一种清单设计的分布式账本解决方案，能够在保持标准架构的同时，实现高度的机密性、灵活性、弹性和可扩展性。因此，Hyperledger\
  \ Fabric 提出的任何解决方案均可由任何行业实施 [16]。\n\n#### Hyperledger Indy\n\n**Hyperledger Indy**\
  \ 是专为去中心化身份而创建的分布式账本。Indy 是工具、库和可复用组件的存储库，可用于基于区块链或其他分布式账本创建和使用独立的数字身份。用户可在各种管理域、应用程序和组织部门中使用这些身份，这意味着合作伙伴、对手甚至竞争对手都可以依赖同一信息来源。Indy\
  \ 知道基本问题的答案，如“我在和谁打交道？”以及“我将如何测试关于通信中另一方的数据？”。\n\n#### Hyperledger Iroha\n\n**Hyperledger\
  \ Iroha** 是一个简单的区块链框架，旨在使分布式账本技术轻松融入基础设施项目。2016 年 10 月，Iroha 在与 Fabric 和 Sawtooth\
  \ 协作后，被宣布为 Hyperledger 的第三个分布式账本框架。Hyperledger Iroha 最初由日本的 **Soramitsu** 设计 [2]。\n\
  \n#### Hyperledger Sawtooth\n\n**Hyperledger Sawtooth** 是另一种可扩展的 Hyperledger 变体，旨在设计、部署和运行分布式账本。Sawtooth\
  \ 的功能依赖于另一种类型的共识，**时间流逝证明** 。与工作量证明相比，**PoET** 在资源更少（**PoW**）的情况下即可全功能运行 [16]。\n\
  \n### 使用 Hyperledger 的优势\n\n位于 **Linux 基金会** 旗下的 Hyperledger 项目充当“温室”，使来自不同领域和市场空间的开发者和用户能够在全球范围内协作。使用\
  \ Hyperledger 区块链的优势包括易用性、专业化、更高的效率、优质的内容交付以及知识产权的便捷处理。\n\n进一步解释，Hyperledger 通过其协作环境减少了采用公司所需的研究量，使用户更容易跟上所有新发展。这反过来又通过使用户能够高效地获取信息来简化沟通。\n\
  \nHyperledger 的温室结构也促进了更高程度的专业化。专业化使开发者能够将精力集中在较少的任务上，从而获得更深的专业知识。专业化还有助于提高生产力。由于在同一领域拥有专长的参与者彼此不竞争，他们有动力加入相关领域，帮助改进和贡献于\
  \ Hyperledger 的研发流程。\n\n温室组织中不同方的协作受到高度支持，因为这有助于减少为实现相同任务而投入的重复精力。它还激励各方创建可复用组件，以造福整个社区。\n\
  \n开源软件开发项目（如 Hyperledger 版本）通常被认为质量上乘，因为开发过程涉及深度代码审查和持续调试。Hyperledger 通过其技术指导委员会在软件开发生命周期的各个阶段审查所有项目，以维护代码质量。\n\
  \n最后，Hyperledger 通过采用标准化方法，以直接便捷的方式处理知识产权，消除了用户间复杂且昂贵的法律关系需求。由于所有用户明确定义了所有期望和条件，所有使用和设计\
  \ Hyperledger 技术的个人都可以在没有繁重法律限制的情况下参与，因为用户不太可能遇到与专有技术相关的隐性法律约束 [2]。\n\n### Hyperledger\
  \ 的设计理念\n\n分布式账本可能因不同用例而需要不同的参数。为应对多样性，所有 Hyperledger 项目旨在遵循相似的设计理念。Hyperledger\
  \ 的设计理念侧重于以下考量：\n\n*   **高度的安全性** 是分布式账本所需的关键方面之一。绝大多数区块链用例涉及敏感数据，或基于高价值交易。分布式账本因运行在大型代码库上且包含价值数据流，已成为攻击者的热门目标。由于分布式账本应具备广泛的特性和功能，同时仍能抵御持续的对手，维护区块链安全已成为一项持续的挑战。\n\
  \n\n\n\n\n### Hyperledger 特性\n\n*   **模块化与可扩展框架** 旨在实现由可复用构建块组成的模块化和可扩展框架。这种模块化允许开发人员在开发阶段检查各个组件并做出相应更改。模块化策略允许多个开发人员在不同模块上工作而互不干扰。这样，模块就可以在不同项目中复用。\n\
  \n*   **可扩展性** 允许区块链网络交互并共享信息，以建立更复杂、更稳健的网络。为满足这一需求，Hyperledger 智能合约和应用程序必须能在多个区块链网络间扩展。这种高水平的互操作性将使满足对区块链和分布式账本技术日益增长的需求变得更加容易。\n\
  \n*   **定义良好的 API 集** 是 Hyperledger 项目的另一特性，从而增强了所有系统间的互操作性。这组定义良好的 API 允许外部客户端和应用程序简单、轻松地与\
  \ Hyperledger 的核心分布式账本基础设施进行交互。\n\n### Hyperledger 工具\n\nHyperledger 生产并支持面向多种业务的区块链技术，包括提供工具和实用库。Hyperledger\
  \ 方法促进了标准构建块的复用，推动了组件的快速修改，并鼓励项目间的互操作性。\n\n**Hyperledger Caliper** 是一款区块链基准测试工具，通过将任意区块链实现与一组预定义用例进行比较来衡量其性能。Hyperledger\
  \ Caliper 生成的报告将资源利用率、交易延迟和每秒交易数（TPS）列为其众多性能指标中的几项。Hyperledger Caliper 是基于一组客观且普遍接受的规则，首个用于评估各种区块链解决方案性能的通用工具。Hyperledger\
  \ Caliper 并非旨在发布基准测试结果，而是设计为内部参考工具，以帮助选择组织应实施的、满足其特定需求的区块链技术。\n\n**Hyperledger Composer**\
  \ 是一个开放的开发工具集，支持对业务网络（包括参与者、资产和交易）进行建模。该模型使生成智能合约和区块链应用程序变得容易，允许在现有系统中快速集成——将部署时间从数月缩短至数周。Composer\
  \ 还支持对现有业务网络进行快速建模，并将现有数据和系统集成到区块链应用程序中。Composer 协助现有的 Hyperledger Fabric 基础设施。\n\
  \n**Hyperledger Cello** 为区块链生态系统带来了按需部署和管理模块。Cello 通过提供创建、管理和终止区块链的自动化方式，帮助企业快速采用区块链技术。Cello\
  \ 为用户提供实时仪表板，允许他们检查区块链系统状态、查看统计数据，并通过创建、配置或删除区块链来控制它们。Cello 主要支持的区块链实现是 Hyperledger\
  \ Fabric；但它未来也旨在支持 Hyperledger Sawtooth 等其他框架。\n\n**Hyperledger Explorer** 提供了一个可概览区块链网络的仪表板。它允许用户生成区块查询，以查看其中包含的详细信息。它还提供了网络活动的透明视图。借助\
  \ Explorer，用户可以识别、排查并快速解决生产问题。用户可以将 Explorer 与任何保证认证或授权的平台（无论是商业还是开源）协同使用。这种协作允许用户使用与其权限相关的功能。\n\
  \nHyperledger Composer、Cello 和 Explorer 协同工作，为使用 Hyperledger Fabric 部署解决方案提供了端到端的工具包，长期目标是支持所有其他\
  \ Hyperledger 框架。\n\n**Hyperledger Quilt** 是一款旨在为所有 Hyperledger 项目提供账本互操作性解决方案的工具，从而使\
  \ Hyperledger 成员的分布式账本解决方案、金融机构的私有账本、物联网公司的钱包以及供应链系统能够成功相互连接，以执行分布式原子交易 [[2]](#ch15.xhtml#r268)。\n\
  \n##### Hyperledger 智能合约\n\n智能合约任务可以像更新数据一样基础，也可以像完成带有多个约束的协议一样复杂。例如，智能合约可用于更新账户余额，也可用于验证账户中是否存在提款所需的资金。Hyperledger\
  \ 框架使用两种智能合约：已安装智能合约和链上智能合约。\n\n*   **已安装智能合约** 协助在网络启动前成功将业务逻辑安装到网络验证节点上。\n*  \
  \ **链上智能合约** 以交易的形式使用业务逻辑，该交易被提交到区块链，随后由后续交易调用。使用链上智能合约时，定义业务逻辑的代码被视为账本的一部分。\n\n\
  在五个 Hyperledger 框架中，只有一个不支持智能合约。支持智能合约的四个框架是 Hyperledger Burrow、Hyperledger Fabric、Hyperledger\
  \ Iroha 和 Hyperledger Sawtooth。在所有四个框架中，交易请求均由智能合约层处理。该层还负责验证请求，这是通过执行业务逻辑来实现的 [[12]](#ch15.xhtml#r278)。\n\
  \n### Hyperledger 架构\n\n如前所述，Hyperledger 项目基于一种强调模块化方法、互操作性、高度安全解决方案、无原生加密货币的代币无关方法，以及开发丰富且易用的应用程序编程接口（API）的设计理念。Hyperledger\
  \ 架构的组件包括：\n\n*   **共识层** 负责就请求达成一致，验证交易区块的有效性。\n*   **智能合约层** 管理交易处理请求，并实施业务逻辑以确定交易是否准确。\n\
  *   **通信层** 处理参与共享账本实例的节点间的点对点消息传输。\n*   **数据存储抽象** 允许其他模块访问和使用不同的数据存储。\n*   **加密抽象**\
  \ 允许以不影响其他模块的方式替换不同的加密算法或模块。\n*   **身份服务** 有助于在区块链实例设置期间创建可信根，在网络中的任何活动期间准入和注册身份或系统实体，以及管理删除、添加和终止等变更。它还提供认证和授权。\n\
  *   **策略服务** 负责管理系统中列出的不同策略。这些策略包括背书策略、共识策略或组管理策略。它与其他模块交互并依赖它们以成功实施这些策略。\n*   **API**\
  \ 允许客户端和应用程序建立到区块链的链接。\n*   **互操作** 允许各种区块链实例之间的互操作性 [[14]](#ch15.xhtml#r280)。\n\
  \n\n\n\n\n### Hyperledger 中的共识\n\n由于企业有不同的区块链需求，Hyperledger 社区采用四种不同类型的共识机制以确保模块化。Hyperledger\
  \ Fabric 使用 Apache Kafka，Hyperledger Indy 采用 RBFT，Hyperledger Iroha 基于 Sumeragi，而\
  \ Hyperledger Sawtooth 采用 PoET。前三种共识方法的运作遵循相似的方法，基于在几秒钟内提供容错性和最终性。然而，PoET 采用基于抽签的方法来选择共识，这在解决问题的同时减少了与共识相关的延迟\
  \ [13]。\n\n### Hyperledger 的局限性\n\n尽管 Hyperledger Fabric 被认为是最复杂和成熟的 Hyperledger\
  \ 项目，但 Hyperledger 项目仍处于起步阶段。正如一位 Hyperledger 开发人员所指出的，该项目经历了多次变更、升级、延期和复杂情况。然而，Hyperledger\
  \ 项目通过鼓励创新和冒险，提供了巨大的未来潜力 [15]。\n\n### Hyperledger 用例\n\n本节讨论了 Hyperledger 区块链可能具有清晰且引人注目的应用的几个现实场景。Hyperledger\
  \ 为每个场景都包含有效的技术；在某些情况下，概念验证已经创建完成。\n\n在申请贷款时，银行旨在将资金借给风险合理的借款人。贷款审核和批准流程要求银行从申请人那里收集私人、可识别个人身份的信息\
  \ (PII)，如名、姓、出生日期、政府身份证号码、年收入或月收入，以及申请人的资产和负债清单。银行使用此类 PII 信息来获取申请人的信用评分或信用等级。由于银行保留大量客户的\
  \ PII 信息，这使它们容易受到网络攻击。同时，借款人希望获得最优惠的利率，因此很可能会探索来自不同来源的各种贷款选项。然而，这增加了申请人 PII 被滥用的概率。针对这一使用场景，Hyperledger\
  \ Indy 提供了一种变革性的身份解决方案。Indy 允许申请人仅提供银行决策所需的详细信息，这种方式确保了真实性，建立了银行的信任，并满足了监管要求。\n\n\
  隐私、保密性和问责制是区块链在金融服务领域应用的驱动力。因此，金融服务提供商必须能够验证客户的合法身份，并允许他们根据监管要求（如反洗钱 (AML) 和/或了解你的客户\
  \ (KYC) 法规）进行交易。由于公共区块链可能会危及参与者的隐私和保密性，这些标准促进了许可型和私有区块链的采用。这些是联盟链在金融服务领域获得关注的主要原因，随之而来的还有巨大的交易量。交易后处理是该领域区块链的几个可设想用例之一，特别是在资本市场中。\n\
  \n自主身份识别是区块链应用中最有前景的方面之一。该属性基于这样一个概念：既然个人拥有自己的身份，他们也应该能够控制与之相关的数据。Hyperledger Indy\
  \ 是一个首先专注于自主身份的分布式账本。传统的企业身份识别解决方案，如 `2FA`、`IDPs`、`LDAP`、`OAuth` 等，与 Indy 具有各种共同属性，包括工业级密码学、丰富的身份元数据、复杂的访问控制和策略。Indy\
  \ 身份是分布式的，而非隔离和联邦式的。因为 Indy 身份可迁移，用户可以在任何使用分布式账本的地方使用它。在假设用户的情况下，这意味着如果五个系统支持 Indy\
  \ ID，`Lisa M. Private` 将不会拥有五个不同的身份。相反，Lisa 在区块链上预先存在的身份将被所有五个系统访问。由于 Lisa 是其身份的所有者，组织可以撤销\
  \ Lisa 的访问权限，但不能撤销她的身份 [2]。\n\n#### Corda\n\nCorda 平台是一个开源软件项目，最初于 2016 年 4 月推出，随后由软件公司\
  \ `R3` 于 2016 年 11 月正式发布。自发布以来，Corda 经历了从 Corda 1 到 Corda 4（撰写本文时的最新更新）的巨大转变。\n\n\
  Corda 的设计在众多行业的多元化全球联盟组织的协作下更新，监管参与是设计过程的重要组成部分。金融行业的需求构成了 Corda 设计的基础，但实地经验表明，Corda\
  \ 的技术适用范围远不止银行业 [10]。与“不允许型”区块链平台不同，Corda 平台旨在以隐私和法律确定性管理现实世界的交易；并与其他“许可型”区块链平台形成对比，在同一个开放网络上与多个参与者群体和相关应用程序共存和运行。Corda\
  \ 支持一种最终状态愿景，即现实世界的实体在没有技术约束或隐私损失的情况下管理合同和转移价值 [6]。\n\n`Corda 全球网络` 由 Corda 定义，连同一组标准、网络参数和相关治理流程。它允许任何组织或个人在开放网络上直接与任何其他人进行交易。Corda\
  \ 的架构从根本上设计为可扩展、持久、安全、稳定和可互操作。该架构还旨在依法强制执行模型，并在开放网络上自动化现实世界的交易，该网络可以在多个应用程序之间运行和互操作，同时专注于身份、交易目的、隐私和开放治理。网络的治理模型明确设计为反映平台不同用户群体的共同利益。Corda\
  \ 提供的平台允许以现实世界的货币转移和偿还现金负债，其中规则允许从平台管理的合同中进行负债结算。此外，该架构还支持原生资产和平台代币的提供，旨在促进采用和参与服务支付。该架构可以是全平台范围的，也可以是更广泛的\
  \ Corda 网络上特定业务网络的专用架构。该架构为所有行业领域定义了一个新的共享平台，允许新进入者和第三方提供新的创新产品和服务 [4, 6, 10]。\n\
  \n\n\n\n\n### Corda 平台概述\n\nCorda 是一个用于 `CorDApps` 编写和执行的平台；这些应用程序通过添加新功能来增强全局数据库。这些应用程序定义新的数据类型和节点之间新的协议流程，以及所谓的\
  \ `smart agreements`（智能协议）来确定变更。Corda 愿景中值得注意的一点是，通过一个通用的、共享的、开放治理的网络，为许多公司、供应商、客户和第三方实现广泛的\
  \ CorDApps，以便在同一平台上管理庞大且多样的协议范围。Corda 押注于这样一个观点：通过更好的数据、更少的差异以及公司间更快的细节协调所产生的节约将是巨大的。此外，部署这种典型的业务架构将为现有和新供应商定义一个新平台，以竞争满足其客户的需求。各种\
  \ Corda 软件解决方案需要共享通用标准并就特定的通用参数达成一致，这与不太有用的远程、非互操作、独立部署形成对比 [[6]](#ch15.xhtml#r272)。\n\
  \n#### Corda 平台的组件\n\nCorda 平台具有各种元素，下文将对其进行讨论，以便更好地理解其工作背后的整体概念。以下是其主要组件：\n\n*\
  \   **节点** 是 Corda 系统的一个软件部分，用于运行 `CorDApps`，并排列在一个经过身份验证的点对点网络中。\n*   **Corda 网络**\
  \ 是具有连接性的完全连接的点对点节点。所有通信都是直接的。因此，不提供全局广播或 Gossip 协议。通过传输层安全性 (TLS) 使用高级消息队列协议 (AMQP)\
  \ 进行安全、可靠且异步的通信。网络映射上的服务列出对等节点，就像目录服务一样。\n*   **状态** 是一个原子且不可变的对象，代表一个或多个 Corda\
  \ 节点在特定时间点已知的事件。状态可以包含任意信息，这使得节点能够代表任何实体。任意数据可以是库存、债券、贷款、KYC 数据或身份信息等。状态是 `UTXO`（未花费交易输出）和\
  \ `DAG`（有向无环图）节点。只有“未花费”状态决定世界的当前状态。“已花费”状态是世界状态历史的组成部分之一。状态是独一无二的。此外，它们只能被消费或花费一次。分布式账本状态是所有网络节点持有的每个状态的聚合。因为没有中央账本，且并非所有节点都知道所有状态，所以从每个参与者的角度来看，整体账本是主观的。在大多数情况下，至少有两个不同的节点持有相同的状态。\n\
  *   **双边账本** 是一个保险库——一个数据库，用于跟踪并考虑其所知道的所有当前和历史状态，由网络上的每个节点持有。简单来说，它是从每个节点视角出发的账本，包含其已知的所有当前陈述（即非历史）的集合。\n\
  *   **交易** 定义现有状态的消费和输出，这些输出向现有状态添加新数据以生成新状态；因此，状态是原子的，因为它们要么完全完成交易，要么完全不影响交易。交易具有包含多个阶段的生命周期，但不存在部分完成的“进行中”交易；尽管它们具有包含多个阶段的生命周期。Corda\
  \ 交易不像 SQL 交易或以太坊交易那样，传递命令和参数，由状态引擎“决定”新状态是什么。相反，它引用现有的输入和未来的输出。尚未被各方接受的交易被称为“提议交易”。发行交易可以向数据库添加新状态，而无需使用现有状态。此外，这些交易不是特定的（图\
  \ 7.2）。\n\n    ![图 7.2 Corda 中的现金发行交易。来源：6，使用 Microsoft PowerPoint 重绘；© R3 (www.r3.com)；https://www.corda.net/content/corda-platform-whitepaper.pdf.](img/9781032078243_C007_002.jpg)\n\
  \n    **图 7.2** Corda 中的现金发行交易。来源：[[6]](#ch15.xhtml#r272)，使用 Microsoft PowerPoint\
  \ 重绘；© R3 (www.r3.com)；https://www.corda.net/content/corda-platform-whitepaper.pdf。\n\
  \n*   **合约** 定义状态的特定属性，而不是描述状态的创建。属性像清单一样限制允许的状态转换。因此，可以验证提议的状态转换。简单来说，合约规定了允许的状态转换规则和提议的状态交易。交易中的一方或多方提出世界的新状态，合约接受这个新状态。合约还指代法律条文——即争议推定可被法院接受的概念。状态包含对合约的引用，并提及允许其创建和消费或阻止它们的代码。重要的是要注意，在\
  \ Corda 平台上，状态、交易和合约是基本的数据和事务元素。\n*   **命令** 是交易的元素，通过为交易提供意图来帮助指导解释。命令发出提议过渡状态的意图信号，以允许接收方对交易进行分类和考虑。智能合约也可以基于命令对其验证逻辑进行分支。特别是，命令通过指示交易目的、收集输入并列出使用其公钥签名所需的签署人，来对交易进行参数化。\n\
  *   **时间戳** 是断言，声称某事发生在给定的时间窗口内。窗口可以是开放或封闭的。分布式系统中没有真实的时间；只有许多不同步的时钟。因此，时间戳被定义为一个窗口，而不是一个精确的时间。\n\
  \n    对于智能合约代码的实现，合约逻辑应传达交易在时间线上的位置。这是通过时间戳实现的。时间戳的其他用途，如监管报告或用户界面中的事件排序，不需要任何义务。此外，即使它们与其他方观察到的时间不完全匹配，本地观察到的时间戳在某些情况下可能更可取。或者，如果需要时间线上的特定点且多方必须同意，则默认可以使用时间窗口的中点。虽然这可能与任何活动（如按键或口头共识）不完全一致，但通常很有帮助。\n\
  *   **附件** 是包含在交易中的 `.zip` 和 `.jar` 文件。附件可以由带有模板和参数的法律条文组成。它还包括交易信息文件，如货币定义、相应的状态定义、日历、财务信息以及合约代码。\n\
  *   **流程** 是轻量级进程，通过协调多步骤业务操作，帮助对等方就共享状态达成共识。换句话说，流程对监控交易状态发展的业务流程进行建模。流程必须包含适当的命令和所需交易参与者的列表，以授权智能合约，后者必须始终检查必要的签署人。流程可以被广泛复用，也可以即时创建。只要合约允许计划的状态变更，就可以立即生成针对特定情况的流程。流程的复杂度与涉及的参与方数量成正比。流程可以包含两方以上。例如，如果交易需要监管监督，流程将指示一个额外步骤来通知第三方——监管机构。\n\
  \n\n\n\n\n#### 共识\n\n**共识**是各方对共享状态获得确定性的过程。适用于 Corda 的共识机制有两个方面，即验证共识和唯一性共识。\n\n\
  #### 公证服务\n\n**公证服务**提供事件的可靠证据，类似于传统的公证人服务。简单来说，公证人维护一份关键的映射表，记录其输入状态及其交易。公证服务无需知晓状态和交易的内容。公证服务对交易唯一需要做的就是可靠地识别它。当节点将交易发送给公证服务时，可能发生两种情况之一。如果公证人的映射表包含任意一条状态，公证人将抛出异常。如果没有任何状态输入已被认定为已使用，公证人会将每条信息添加到映射表中，并对拟议交易进行签名。此过程提供了唯一性共识。可以要求公证人验证交易，以防止攻击者提交虚假交易发起可能的\
  \ DoS 攻击。在这种情况下，只有当其智能合约接受该交易时，公证人才会将其视为常规节点处理。\n\n#### 预言机\n\n**预言机**是关于外部世界的可信信息来源。为了确立一种货币，各方可能同意使用第三方报价。该第三方被称为预言机。预言机通过其签名有效担保交易中包含的信息。它还可应请求提供有效信息，从而使节点更容易构建经预言机批准的交易。此外，为了增加隐私，可以使用默克尔树和默克尔证明仅向预言机传输所需的最少信息。这被称为**交易撕离**\
  \ [6, 10]。\n\n##### Corda 智能合约\n\n作为 CorDApps 合约代码的一部分，智能合约逻辑确保状态转换在约定规则下是有效的。在\
  \ Corda 中，智能合约是一个纯函数，用于接受或拒绝拟议交易，并由更具体、可复用的函数组成。对于拟议交易中的每种状态类型，这些函数中的一个都将针对每笔拟议交易执行，所有各方有义务同意——根据每种状态的规则——拟议交易是允许的。因此，只有当包含的状态在所有合约代码上达成一致时，交易才有效。交易提议者负责生成满足每个包含的状态对象约束条件的交易。\n\
  \nCorda 使用一种名为 **Kotlin** 的编程语言来编写其智能合约。Kotlin 是一种通用的、静态类型的编程语言，具有跨平台实现和类型推断功能。Kotlin\
  \ 旨在完全兼容 Java，且基于 JVM 的 Kotlin 标准库版本即 Java 类库。同时，类型推断允许语法更加简洁。它主要为 JVM 设计，但也可编译为\
  \ JavaScript 或原生代码。得益于 JVM（Java 虚拟机）丰富的现有库和广泛的专业知识基础，以及行业标准的复用，金融机构能够在合约中复用其现有代码。标准化字节码使用户能够根据偏好，在合约语言设计中创新或复用知名语言\
  \ [6, 10]。\n\n#### Corda 的共识机制\n\nCorda 中的共识有两个方面，如下所示：\n\n*   共识的**交易有效性**方面确保各方能够确定拟议的定义输出状态的更新交易是有效的，方法是确保相关合约代码（必须是确定性的）通过拥有所有必需签名而成功验证。\n\
  *   共识的**交易唯一性**方面确保交易参与者能够确定正在考虑的交易是交易中输入的所有状态的唯一消费者。此外，它还确保不存在先前已达成一致的、使用了相同任何状态的其他交易。\n\
  \n然而，两笔有效交易可能同时存在，因此参与者需要一种方法来选择优先考虑哪笔交易。为此，在一组相互不信任的公证人参与者中需要一个观察者。许多人可以在同一网络中参与，同时拥有不同的特征和协议，这是\
  \ Corda 设计的一个独特功能。单个服务可以由许多相互不信任的节点通过拜占庭容错算法协调组成。\n\n重要的是要注意，此类唯一性服务只能确认之前的状态是否被消耗；在这种情况下，它们不应证明交易的有效性\
  \ [4, 6, 10]。\n\n#### Corda 用例\n\n随着区块链行业的快速扩展，企业对区块链在性能、安全性和用户友好性方面有更高的期望。Corda\
  \ 是被认为能满足所有这些需求的平台之一。下一节讨论 Corda 的三个用例。所有这些用例都展示了 Corda 解决各种挑战的能力。\n\n一个著名的 Corda\
  \ 应用是在**医疗保健行业**。医疗保健行业认识到对区块链的需求，因为即使是最好的医疗系统也可能变得碎片化。欺诈增加、理赔处理延迟和患者护理不令人满意都是碎片化的后果。\n\
  \n医疗保健系统已将使用电子健康记录（EHR）作为重中之重。Corda 区块链将允许系统之间相互通信，并提供全面的患者健康历史，而无需第三方验证服务。医疗保健可将每条记录保存在带时间戳、可审计且不可篡改的账本中。\n\
  \nCorda 也常用于**建筑业务**，因为其身份识别、隐私和工作流特性使其成为此类操作的理想选择。在建筑领域，承包商定期将工作转包给分包商。Corda 调整网络上数据分布的能力对于创建最适合行业现有参与者的区块链解决方案至关重要。Corda\
  \ 允许房地产开发商和承包商保存与其达成协议从事各项工作的对手方记录，并允许及时补偿这些方。Corda 还允许项目成员以统一且易访问的方式查看项目进度和达成的里程碑。此外，Corda\
  \ 的状态和合约框架有助于定义共享规则和数据结构，以及这些数据结构将如何随时间演变。这将有助于防止参与者产生分歧和/或犯错。即使参与者通过同一网络连接，Corda\
  \ 的按需知情数据分发也能防止其他方发现项目的具体细节 [18]。\n\nCorda 区块链的分布式账本和透明度还可以帮助**金融公司**高效可靠地获取最新的消费者数据。因此，组织绩效、非自动化数据收集、运营费用和处理时间均有所降低，而机构信任度得到提高。交易终局性、可扩展性、隐私、法律认可的参与方、开发人员生产力和企业集成是\
  \ Corda 为金融机构提供的一些优势。\n\n#### Corda 中的用户隐私\n\n\n\n\n\n##### Corda 隐私保护方法\n\nCorda\
  \ 采用多种方法来提升用户隐私，优于其他分布式账本系统。在 Corda 中，交易不会像许多其他区块链系统那样全局广播。此外，Merkle 树被用于构建交易结构，并且可以向已经知道\
  \ Merkle 根哈希的各方揭示单个子组件。此外，各方可以在无法看到交易全貌的情况下对其进行签名 [4, 10]。节点上的密钥管理服务生成并使用与身份无关的随机密钥。涉及流动性资产的大型交易图可以通过要求资产发行方使用新的引用字段在账本上重新发行资产来进行“修剪”。虽然这不是一个原子操作，但它有效地将资产的新旧版本解耦，这意味着节点在验证期间不会尝试探索原始的依赖图\
  \ [6]。\n\nCorda 的隐私保护侧重于利用安全硬件飞地对整个账本进行加密和验证。在发生故障时，它可以提供同态加密和零知识证明的优势，而无需牺牲可扩展性或可审计性。\n\
  \n#### Corda 的局限性\n\nCorda Network Foundation 为使业务网络能够注册而收取的高昂实施和运营成本，是阻碍全球 Corda\
  \ 网络（网络的网络）自然和加速增长的关键障碍。虽然大型金融机构不会反对这些费用，但许多较小的业务网络可能会拒绝加入，因为成本将超过使用 Corda DLT 技术的收益。因此，采用全球\
  \ Corda 网络的成本可能会限制其未来增长。此外，这些成本壁垒可能导致使用 Corda 开源版本的商业网络与使用企业版本的商业网络之间产生无法弥合的鸿沟 [9]。\n\
  \n## Ethereum、Hyperledger 和 Corda 的并列对比\n\n表 7.1 对比了本章涵盖的三种分布式技术：Ethereum、Hyperledger\
  \ 和 Corda。\n\n表 7.1 Ethereum、Hyperledger 和 Corda 的对比\n\n| **参数** | **Ethereum**\
  \ | **Hyperledger 框架** | **Corda** |\n| --- | --- | --- | --- |\n| 总体描述 | 一个利用通用区块链技术进行去中心化应用（DApps）开发和部署的平台。\
  \ | 模块化、可扩展且安全的平台，通过即插即用组件促进广泛行业适配其用例。 | 专门用于记录、管理和执行金融协议的分布式账本平台。 |\n| 管理机构 | 由所有开发者共同治理的开源平台。\
  \ | 由 Linux 基金会治理。 | 由 R3 治理。 |\n| 区块链权限模型 | 可作为无许可公有链或私有链运行。 | 作为有许可私有链运行。 | 作为有许可私有链运行。\
  \ |\n| 共识模型 | 使用工作量证明共识模型，并在账本层面实现。 | 根据节点需求部署可插拔共识模型，并在交易层面实现。 | 与 Hyperledger\
  \ 相同，但基于公证人节点。 |\n| 智能合约 | 使用自执行且严格的智能合约作为运行 DApps 的底层逻辑，该合约适用于网络上的每个节点。 | 支持仅在达成一致的各方间部署的个性化智能合约，单个节点可与不同各方拥有多个智能合约。\
  \ | 与 Fabric 相同，但仅适用于包含法律条文的金融协议。 |\n| 部署后的智能合约修正 | 一旦部署，几乎不可能编辑或修正智能合约。 | 需要详尽的流程来修正/更新。\
  \ | 需要节点级管理操作来编辑/更新。 |\n| 智能合约编程语言 | Solidity | Go, JavaScript (node.js) | Kotlin\
  \ |\n| 交易 | 用于促进交易的可靠性和可预测性。 | 用于促进交易的可扩展性、信任和透明度。 | 用于最大化与现有银行系统和银行遗留库的集成与互操作性。\
  \ |\n| 交易费用 | 包含交易费用。 | 无交易费用。 | 无交易费用。 |\n| 首选用例 | 通用应用。适合企业对消费者（B2C）应用。 | 专注于企业级应用。\
  \ | 专注于金融服务行业。 |\n| 内置货币 | 需要名为 Ether 的内置货币。 | 无 | 无 |\n| 可扩展性 | 随着用户数量增加，Ethereum\
  \ 已达到容量极限。可扩展性问题增加了网络使用成本，使得必须使用“扩容解决方案”。 | 无普遍的可扩展性问题。 | 高度可扩展。 |\n\n## 选择适合业务用例的正确框架的决策树\n\
  \n在考虑将区块链应用于业务流程之前，必须研究其可行性。R. Lewis 提出，只有涉及信任、共识和不可篡改性顾虑的用例，才应考虑将区块链作为有前景的解决方案。否则，没有可行的理由这样做。在完成可行性研究并决定是否将区块链技术应用于业务用例后，可参考\
  \ 图 7.3 中的决策树。\n\n![图 7.3 选择适合业务用例的正确框架的决策树。](img/9781032078243_C007_003.jpg)\n\n\
  图 7.3 选择适合业务用例的正确框架的决策树。\n\n## 总结与结论\n\n实施区块链的理念已从现代数字加密货币的底层技术演变为一类新的分布式和去中心化应用，它们能在无信任的点对点环境中有效运行。无信任、去中心化账本支持历史不可变性的特性，已成为许多行业实现安全和保障的日益流行的理念。\n\
  \n本章旨在简要介绍三种当前流行的区块链框架，即 Ethereum、Hyperledger 和 Corda。这些框架将区块链技术的优势应用于银行业、网络安全、审计、医疗保健、供应链管理、通信系统和物联网等当前业务流程中。如果有效利用，这些框架可以支持在数据分布式且去中心化的无信任环境中，保护网络、通信和数据的现有努力。要将这些区块链框架实施到任何特定的业务用例中，首先必须了解实施安全区块链网络的底层及相关机制和技术。\n\
  \n值得注意的是，这些框架在拥有所有隐私和安全特性的同时，也存在相关的漏洞和局限性。在考虑将本章讨论的任何框架应用于业务流程之前，必须研究其可行性。涉及信任、共识和不可变性顾虑的用例应探索区块链技术作为有前景的解决方案。否则，其他替代方案（如使用数据库技术）通常将证明更具成本效益。\n\
  \n## 核心概念\n\n\n\n\n\n# 区块链平台概述\n\n## 核心平台特性\n\n*   **Ethereum** 的主要目标是通过使用一种加载且无歧义的语言定义状态变更系统，并设计一个合理预期协议将自主应用的系统，使同意的个人能够在无信任环境中与另一个同意的个人进行交易。\n\
  *   **Ethereum** 通过允许用户制定其个性化的所有权规则、状态转换函数和交易格式，赋予用户编写定制智能合约和去中心化应用的能力。\n*   **Ethereum**\
  \ 提供了一个打包在开放客户端中的通用可编程区块链，可供所有人使用。\n*   目前，**Ethereum** 采用 `PoW` 共识协议，但已开始从工作量证明向权益证明过渡。与工作量证明不同，验证者不需要巨大的计算能力，因为他们是随机选择的，且不进行竞争。\n\
  \n*   **Hyperledger** 是一个开源项目，旨在推动区块链技术在不同行业的发展，致力于集体协作而非单打独斗。\n*   **Hyperledger**\
  \ 充当孵化器，帮助将来自全球各个领域和市场空间的开发者和用户聚集在一起。\n*   现有多个 **Hyperledger** 框架，如 `Hyperledger\
  \ Burrow`、`Fabric`、`Indy`、`Iroha` 和 `Sawtooth`。此外，还有一些相关工具，包括 `Hyperledger Caliper`、`Composer`、`Cello`、`Explore`\
  \ 和 `Quilt`。\n\n*   **Corda** 平台旨在以隐私和法律确定性管理现实世界的交易，并可在同一个开放网络上跨多个参与者群体及相关应用运行，这与其他“许可制”区块链平台形成对比。\n\
  *   金融行业的需求构成了 **Corda** 设计的基础，但实践经验表明，Corda 技术似乎广泛适用于银行业以外的用例。\n\n## 深入理解活动\n\n\
