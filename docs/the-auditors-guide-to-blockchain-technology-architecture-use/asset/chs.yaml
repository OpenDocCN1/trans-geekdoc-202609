  \ 4096 | • 高度安全的算法，因为从非对称密钥和模数生成对称密钥很困难。攻击者计算加密的逆运算也非常困难。 | • 存在许多对称密钥加密，其速度比任何当前可用的非对称加密都快得多\
  \ [58]。<br>• 生成密钥很复杂。过程相当慢 [23]。<br>• RSA 也易受量子计算攻击，因为它依赖于整数分解 [4]。 | • 数字签名：用于证明消息的真实性和完整性。<br>•\
  \ 用于 VPN 客户端和 VPN 服务器之间的安全连接。<br>• 传统上用于传输层安全性 (TLS) 和 Pretty Good Privacy (PGP)\
  \ 加密。<br>• 在 TLS 和 OpenSSL 中实现。<br>• 集成到 WolfCrypt 和 Cryptlib 等加密库中 [52]。 |\n| ElGamal\
