  \n# 15 区块链即服务\n\nRamya Bomidi, Srija Guntupalli, Sanober Mohammed and Bhargav Putturu\
  \ Theja\n\nDOI: [10.1201/9781003211723-15](http://doi.org/10.1201/9781003211723-15)\n\
  \n## 摘要\n\n本最后一章重点介绍区块链即服务应用。作为一项较新的技术，BaaS 应用是基于云的应用程序，使组织能够利用基于云的资源快速构建、实施、托管和管理各种区块链项目。在\
  \ BaaS 服务交付模型中——与其他云解决方案一样——硬件、软件采购和维护的责任转移给云服务提供商，以实现更大的便利性和更高的效率；从而使实体能够专注于区块链网络的逻辑和工作流。\n\
  \n本章讨论首先从云属性的总体概述开始，例如按需服务、广泛的网络访问、资源池化、快速弹性和可度量服务。接下来，将各种节省成本的特性、云部署模型（公有、私有和混合）、计算角色和服务模型（IaaS、PaaS\
  \ 和 SaaS）进行解释，以使读者熟悉云计算的全部属性和能力。\n\n本章的第二部分解释了什么是 BaaS 平台，其优势和挑战是什么，以及 BaaS 与其他计算方法（如无服务器计算和平台即服务\
  \ PaaS）有何不同。读者还将获得对 BaaS 应用程序如何运作的基本理解，以及选择 BaaS 提供商时应考虑的因素。本章还简要讨论了由 IBM 和 Oracle\
  \ 等实体提供的几个流行 BaaS 平台，以及正在开发中的几个 BaaS 应用程序。\n\n本章末尾根据框架、定价和特殊功能等因素，展示了九种 BaaS 产品的对比。此外，还简要讨论了研究人员提出的关于非商业\
  \ BaaS 平台以及 BaaS 背景下治理的研究。本节的最后一个活动旨在为有兴趣选择基于云的区块链解决方案的读者提供一些初步信息，以开展旨在在其自身组织环境中实施\
  \ BaaS 的商业案例。\n\n## 简介\n\n区块链技术的发展及其在商业中的应用促使许多企业尝试该技术。领先的企业和技术提供商开始提供区块链即服务，以鼓励和促进组织对该技术的采用。在深入探讨\
  \ BaaS 的细节之前，下一节将讨论云概念的初步理解，包括其特征、类型、部署模型和服务模型。以下各节提供关于区块链即服务概念的更多技术见解，包括工作模型、BaaS\
  \ 服务提供商对比以及一些业务用例。\n\n### 云计算简史\n\n云计算的普及度逐年持续增加。美国国家标准技术研究院 (NIST) 对云计算的定义指出，该技术是“一种模型，用于实现普遍、便捷、按需的网络访问，进入可配置的计算资源共享池（例如网络、服务器、存储、应用程序和服务），这些资源可通过最少的管理工作或服务提供商交互快速配置和释放”\
  \ [17]。简而言之，云计算可以粗略地描述为一种涉及互联网及其基础设施的更高效的计算使用方式 [3]。\n\n20 世纪 60 年代，John McCarthy\
  \ 首次向公众介绍了云计算的概念。然而，云计算的基本思想可以追溯到 20 世纪 20 年代最早的大型主机计算机的发明。借助大型主机计算机，用户可以通过集中式平台从任何地方访问数据和处理能力。20\
  \ 世纪 90 年代，互联网的爆发式普及导致虚拟计算机广泛可用，从而形成了现代云计算基础设施。随着越来越多的企业熟悉云服务，云计算的普及度不断提高。许多组织，如\
  \ Amazon、Microsoft、IBM 和 Google，已成为云计算服务市场的主要竞争者 [3]。\n\n## 云计算概览\n\n云模型由五个基本属性、四种部署模型和三种服务模型组成，具体描述如下\
  \ [16, 17]。\n\n### 云计算属性\n\n所有云服务提供商都应提供下列云计算的五个基本属性，以提供更好的服务质量和灵活性：\n\n*   **按需服务**：云服务设置为按需提供。因此，客户可以根据需要利用云服务，而无需直接依赖其服务提供商。\n\
  \n*   **广泛的网络访问**：广泛的网络访问属性使云客户能够使用云服务，而不会遇到带宽瓶颈。现代技术，如高级路由技术、负载均衡和多站点托管被用来对抗延迟。\n\
  \n*   **资源池化**：云的资源池化特性使云能够通过在设备上进行大量资本投资，然后利用云资产从庞大的云客户群中产生收入，从而保持财务可行性。这种安排还为各种客户提供了放弃大量资本支出、转而选择基于云的订阅的机会。因此，使用云服务可显著减少资本支出，同时增加组织的订阅费用。\n\
  \n*   **快速弹性**：云计算提供可扩展性，使云客户能够根据需求快速扩展或缩减。\n\n*   **可度量服务**：云系统采用按量付费。客户仅为所使用的云资源付费，不收取任何额外费用；这与水、燃气或电力等主要公用事业的概念相似。\n\
  \n### 云部署类型\n\n下文讨论的每种部署类型根据位置考量、定制能力和共享云服务，为用户提供独特的优缺点。因此，有四种基本类型的云部署模型 [36, 37]：\n\
  \n\n\n\n\n## 云计算部署模型\n\n*   **公有云**：公有云平台是云计算服务最常见的形式。如前所述，所有资源（如软件、硬件、人员和设施）均由云服务供应商管理和拥有，并提供给任何愿意支付这些服务费用的人；因此得名“公有云”。在公有云供应商中，Amazon\
  \ Web Services、Google 和 IBM 就是几个例子。\n\n*   **私有云**：与传统 IT 环境类似，私有云服务由各个组织拥有和运营，供该组织的客户和/或员工专用。远程访问\
  \ Web 连接使得此类平台也可供经批准的外部用户访问。与公有云服务相比，私有云平台通常具有更高的安全措施，因为此类平台仅供组织内部的可信用户访问。使用私有模型的主要优势包括更高的数据隐私和安全性。然而，组织需要花费资金购买实施私有云所需的软件和设备。私有云应用的一个常见例子是内部托管的\
  \ SharePoint 站点。\n\n*   **混合云**：混合云由公有云和私有云计算模型的组合构成。该模型的主要优势包括成本效益、更高的安全性和更高的部署灵活性。北美医疗保健行业是有效混合云的一个很好的例子，其中私有云解决方案提供安全性。相比之下，连接到医疗机构、保险提供商和其他相关方的公有云可以提供对潜在救命医疗数据的及时访问\
  \ [37]。\n\n*   **社区云**：也称为“亲和云”。采用社区模型时，云平台由具有相似业务目标的亲和群体共享。服务通常主要由亲和群体内部人员或第三方管理。使用社区云模型的主要优势是较小的资本投入。主要缺点是其共享资源。社区云的一个常见实例是游戏社区，如\
  \ PlayStation Network [23, 37]。\n\n## 云计算服务模型\n\n除了部署模型外，云计算还通过三种不同的服务模型提供——基础设施即服务\
  \ (IaaS)、平台即服务 (PaaS) 和软件即服务 (SaaS)——以满足组织内特定的业务挑战。所有三种模型均根据按使用付费策略部署 [35]。\n\n\
  *   **基础设施即服务 (IaaS)**：IaaS 代表无需物理访问硬件即可托管的数字服务器实例。作为一种即用即付系统，IaaS 平台提供包括存储和虚拟服务器在内的硬件相关资源。在其服务器实例内，授予客户高级管理权限，以及设置其网络安全级别的能力。IaaS\
  \ 提供使用最新技术的主要优势，从而为用户提供更快的服务访问速度。\n\n*   **平台即服务 (PaaS)**：PaaS 模型提供通过 Web 开发应用程序所需的基础设施和服务\
  \ [35]。由于开发人员不必预先确定可扩展性需求，PaaS 模型为应用程序开发人员提供了很大的灵活性和生产力。在互联网上，PaaS 为低成本、可靠和大规模的应用程序增长提供了支持。除了优势之外，PaaS\
  \ 云技术的主要缺点是用户会经历对特定 PaaS 平台的“锁定”，这使得平台过渡和变更有时变得非常具有挑战性 [38]。\n\n*   **软件即服务 (SaaS)**：SaaS\
  \ 类型提供所有 IaaS 和 PaaS 功能，以及完全或部分创建的特定软件。SaaS 主要以 Web 应用程序的形式提供，并包含一些 Web 存储或与非远程应用程序的其他网络连接。由于软件和其他组件托管在服务提供商的位置，用户可以通过\
  \ Web 浏览器访问软件服务 [35]。\n\n*   **共享责任**：在云计算中，客户和云服务提供商在物理安全、数据安全和控制方面共享责任。共享责任通常被称为客户和提供商之间的“职责分离”，以根据服务类型或部署模型保护服务\
  \ [23]。\n\n表 15.1 概述了基于各种云部署方案的客户与云服务提供商之间的共享责任。\n\n### 共享责任矩阵\n\n| 责任 | 基础设施即服务\
  \ (IaaS) | 平台即服务 (PaaS) | 软件即服务 (SaaS) |\n| --- | --- | --- | --- |\n| 治理、风险与合规\
  \ | 客户 | 客户 | 客户 |\n| 数据安全 | 客户 | 客户 | 客户 |\n| 应用安全 | 客户 | 客户 | 客户/服务提供商 |\n| 平台安全\
  \ | 客户 | 客户/服务提供商 | 服务提供商 |\n| 基础设施安全 | 客户/服务提供商 | 服务提供商 | 服务提供商 |\n| 物理安全 | 服务提供商\
  \ | 服务提供商 | 服务提供商 |\n\n*   **企业/客户责任**：云客户始终最终负责数据保护和账户访问控制 [23]。满足合规标准的要求对云服务提供商来说通常是一个挑战，因为他们必须遵守多项\
  \ IT 流程管理要求。重要的是要重申，云客户始终最终对适用的合规授令负责 [24]。\n\n*   **云服务责任 (CSR)**：无论服务类型如何，云提供商始终负责保护数据中心所在的物理设施\
  \ [23]。\n\n*   **按服务类型划分的责任**：监控和审计对于确保平台安全非常重要。IaaS 服务提供商仅管理设施；因此，客户负责实施必要的保护措施，以保护应用程序、虚拟机和数据。\n\
  \n尽管 PaaS 模型构建在 IaaS 模型之上，但云服务提供商负责操作系统 (OS) 维护，而客户负责数据和应用安全。在 PaaS 和 SaaS 模型中，当客户更新其安装的软件时，服务提供商共同承担更新硬件和确保适用安全控制的责任\
  \ [23, 24]。\n\n## 云计算角色与职责\n\n此外，了解云计算的各种属性和模型是必要的；但了解其主要角色和职责同样必要，如下所述 [21]。\n\n\
  *   **云服务提供商 (CSPs)**：云提供商是提供云服务的供应商。如前所述，此类实体拥有云计算数据中心，并管理其各种硬件、软件和人力资源，此外还负责监控服务提供和保障平台安全。云数据中心使云提供商能够构建、配置、部署和运营云服务\
  \ [21]。\n\n\n\n\n\n### 云角色\n\n*   **云客户**：云客户可以是购买或租赁各种云服务的个人或组织 [23]。\n\n*   **云用户**：云用户通常指随时随地在线使用计算服务的用户或企业。值得注意的是，“云用户”一词主要指应用程序的最终用户；而云客户则是购买并支付云服务费用的一方。例如，当一个组织购买\
  \ Office 365 订阅供使用时，该组织扮演客户角色，而使用该服务的用户则是云用户 [21, 23]。\n\n*   **云访问安全代理 (CASB)**：CASB\
  \ 是一个安全执行点，位于最终用户和云之间，充当独立的第三方身份和访问管理执行者。CASB 作为监控和管理云资源访问的中心点 [10]。\n\n*   **监管机构**：除了确保组织遵守其监管授权外，监管机构还维护组织的完整性。组织会接受监管机构在安全性和性能方面的审查\
  \ [23]。\n\n## 云计算的优势\n\n云计算为组织提供了许多好处。其中，成本降低是组织实施云存储解决方案所获得的主要收益，因为这些组织只需为所使用的服务付费。此外，云计算还能降低前期\
  \ IT 成本，并消除对负责维护服务器和本地基础设施的技术人员的需求。\n\n多租户的概念是云计算的另一个方面，涉及多个用户共享服务器和应用程序。以分布式和共享的方式使用云，不同的用户和应用程序可以更高效地协同工作，并通过共享通用基础设施来降低成本。\n\
  \n由于数据和应用程序不再存储在本地，即使失去对台式机或笔记本电脑的访问权限，数据也将始终可用。此外，即使发生服务故障，数据也不会丢失，因为云服务提供商会有备份\
  \ [26]。\n\n## 什么是 BaaS？\n\n得益于区块链的分布式、不可篡改和透明特性，开发区块链应用程序的趋势近年来日益流行。作为引入 IT 行业的各种创新之一，区块链即服务\
  \ 旨在支持云平台上的区块链功能。BaaS 概念是指一种基于云的“即服务”解决方案，旨在促进区块链平台的实施，允许用户从中央云构建、托管和管理区块链应用程序 [40]。\n\
  \n区块链即服务提供运营支持能力，就像 IaaS、PaaS 和 SaaS 云模型一样。BaaS 被视为区块链市场的一个重要里程碑，为分布式账本技术在商业世界的普及提供了强有力的机遇。此外，BaaS\
  \ 的概念模型源自 SaaS 云计算模型 [32]。\n\n通过采用 BaaS 模型，客户可以专注于业务网络的逻辑和工作流，从幕后硬件、软件和专业知识的责任中解脱出来，并将这些责任转移给服务提供商\
  \ [20]。目前市场上有多家 BaaS 服务提供商，如 IBM、Oracle 和 Microsoft，它们提供开箱即用或基于平台的 BaaS 解决方案。开箱即用的\
  \ BaaS 解决方案类似于可定制的 SaaS 解决方案，而基于平台的解决方案则允许客户自行管理和构建应用程序 [11]。一般来说，大多数大型公司提供的 BaaS\
  \ 实现都使用开源项目，如以太坊、Hyperledger Fabric、Quorum 和 R3 Corda [20]。\n\n### BaaS 模型如何工作？\n\
  \n要建立 BaaS 平台，组织需向服务提供商订阅区块链服务。区块链基础设施将按照客户需求进行设计，并由服务级别协议提供支持。该协议定义了带宽、监控、安全控制和基础设施维护的条款。根据客户的业务需求，服务提供商可基于任何分布式账本（如以太坊、Hyperledger\
  \ Fabric、R3 Corda、Chain Core 或 Quorum）配置区块链网络。服务提供商随后代表客户实施必要资源并支持所需技术。因此，客户可以专注于业务，而非性能和网络问题\
  \ [32]。\n\n在许多方面，Web 托管服务提供商和 BaaS 很相似。因为网站每天都会被许多用户访问，维护和基础设施问题可以由 Web 托管服务提供商（如\
  \ Amazon Web Services (AWS)、Microsoft Azure 或 Google）处理。同样，BaaS 使客户免于管理区块链应用程序的框架\
  \ [4]。\n\n### BaaS 的优势\n\n采用 BaaS 模型，公司无需投资在本地开发区块链平台，即可获得多项优势。这些优势将在下文讨论：\n\n*\
  \   **成本与时间节约**：在本地实施区块链技术可能涉及大量的前期资本投资。即使投资后，如果结果不符合预期，组织可能会遭受资本损失 [29]。然而，在 BaaS\
  \ 模式下，由于基础设施是外包的，公司无需投资进一步扩展组织 IT 基础设施。因此，客户无需在本地构建、管理和维护平台，从而节省了时间和金钱 [20]。\n\n\
  *   **人员成本降低**：由于实施 BaaS 架构所需的本地 IT 服务有限，客户的人员将不参与实施区块链所需的设备、电力和制冷管理。因此，招聘和培训员工的相关成本大幅降低，使组织现有的\
  \ IT 员工能够专注于业务需求。\n\n*   **易用性**：BaaS 提供对可定制模板的快速访问，可轻松集成到现有应用程序中，无需从头构建架构 [32]。因此，即使不需要任何技术专长，也能更轻松地管理和操作平台\
  \ [27]。\n\n*   **定价与客户支持**：通常，BaaS 服务提供商提供基于订阅的服务 [32]。因此，客户可以根据需求扩大或缩减服务级别，降低与按使用付费模型相关的风险。此外，BaaS\
  \ 提供商为客户提供全方位的支持服务，包括系统的补丁管理、监控和升级 [20]。\n\n### BaaS 面临的挑战\n\n尽管 BaaS 在成本、人员和易用性方面具有诸多优势，但\
  \ BaaS 的采用也可能给组织带来挑战。\n\n\n\n\n\n#### 隐私与数据合规\n\nBaaS 的实施可能会产生隐私和数据合规问题。考虑到第三方为\
  \ BaaS 提供托管服务，数据可能存储在多个网络中，从而引发合规方面的担忧。虽然过去几年区块链法规有所增加，但监管机构仍需填补重要的区块链特定监管空白 [29,\
  \ 32]。\n\n#### 选择有限\n\n目前，客户在选择 BaaS 服务提供商时，可选范围相对有限。例如，BaaS 主要由亚马逊、微软和甲骨文等大型公司主导，因为\
  \ BaaS 是一种基于云的服务 [29]。\n\n#### 资源可用性有限\n\n目前，市场上拥有区块链技术深度知识的人力资源有限。因此，缺乏适当规划和专业知识的资源可能会增加组织失败的概率\
  \ [32]。此外，区块链仍是一项新兴技术；因此，组织可能面临无法在其现有网络环境中正确实施所需 BaaS 需求的风险，这可能会增加 BaaS 计划集成相关的时间和成本\
  \ [29]。\n\n#### 对 BaaS 的当前及预期未来的关注度\n\nBaaS 通过增加对各种基于区块链技术项目的投资，推动了大大小小企业中区块链经济的市场增长。此外，去中心化应用的增加导致区块链技术在零售、金融和互联网银行等各个领域的使用不断上升。例如，大韩民国政府于\
  \ 2019 年投资约 8 亿美元用于扩展区块链技术 [5]。\n\n许多大型企业最近推出了其 BaaS 平台，包括 `IBM’s Blockchain` 和\
  \ `Amazon’s Managed Blockchain`。一般来说，提供区块链即服务的平台通常采用一种特定的区块链技术（如 `Hyperledger Fabric`\
  \ 或 `Ethereum`）作为其底层平台。例如，微软 Azure 的 `Ethereum Blockchain-as-a-Service (EBaaS)`\
  \ 是基于 `Ethereum` 框架构建的；而 `IBM’s blockchain` 则使用 `Hyperledger Fabric`。服务提供商管理 BaaS\
  \ 环境，以确保基础设施的灵活性、可操作性和可访问性。此外，服务提供商持续开发 BaaS 工具，以满足不断增长的市场需求 [30]。\n\n随着更多公司采用该技术，全球\
  \ BaaS 市场有望增长。市场覆盖亚太地区、非洲、中东、欧洲和拉丁美洲。在这些地区中，北美以 25.1 亿美元的市场规模领先，通过跨多个行业（包括金融服务、国防等）投资区块链解决方案。大量\
  \ BaaS 提供商还将区块链解决方案与人工智能 (AI) 和机器学习 (ML) 等先进技术相结合，以提升其安全功能。*Fortune Business Insight*\
  \ 预测，全球 BaaS 市场规模将在 2027 年达到 249.4 亿美元，在预测期内复合年增长率 (CAGR) 为 39.5%。尽管如此，BaaS 对中小企业\
  \ (SMEs) 的多重优势预计将在未来引领市场发展 [5]。\n\n由于在众多领域拥有巨大的潜在应用，BaaS 有望经历类似于 Web 应用的病毒式普及。区块链充当网络上共享信息的验证机制。Frontier\
  \ Solutions 总裁 Reshma Murthy 表示：“BaaS 将发挥非常重要的作用。软件即服务和基础设施即服务刚刚作为节省原本过于昂贵资源成本的方式出现。BaaS\
  \ 可以以同样的方式使用，并为组织提供了一个机会，在其行业内对区块链的接受程度尚未确定时尝试使用区块链” [20]。\n\n## BaaS 与无服务器计算有何不同？\n\
  \n术语 `Function-as-a-Service (FaaS)` 通常指无服务器计算。`FaaS` 服务器为在无服务器环境中托管业务提供基本服务。无服务器计算的核心思想涉及由第三方处理资源分配，以及计算与存储的解耦、实例的扩展。\n\
  \n无服务器计算和 BaaS 共同点很少。与无服务器计算不同，BaaS 依赖有状态交易。与 BaaS 中智能合约实现加密签名且不可篡改的消息不同，`FaaS`\
  \ 缺乏这一特性。然而，这两种技术都是分布式和事件驱动的 [39]。\n\n## BaaS 服务端能力\n\n区块链技术凭借其服务端功能，确保了数字交易的高度安全性和可靠性。如果没有适当的服务端安全性，任何恶意外部方完全访问系统的几率将会更高。\n\
  \n一般来说，去中心化应用是一种基于 `Ethereum` 的无服务器应用，它使用 HTML/JavaScript 前端并可与后端交互。去中心化应用 (DApp)\
  \ 有两个组件：一个充当 `Ethereum` 网络上服务器的智能合约，以及一个供用户与智能合约交互的界面 [12]。\n\n智能合约具有四个特性，包括可观察性、可验证性、隐私性和可强制执行性。这些属性通过创建高机密性、弹性和可扩展性，帮助智能合约记录交易。顺便提醒一下，智能合约平台的示例包括\
  \ `Hyperledger Fabric`、`Corda Enterprise` 和 `Ethereum`，后者在过去几年的使用量显著增加。每个智能合约具有不同的设置、共识机制和支持语言，以满足业务需求。智能合约提供用支持语言编写并在特定环境（如虚拟机和点对点网络）中执行的代币化功能\
  \ [22]。区块链数据库是一个验证数据库新增内容并可将新数据录入数据库的去中心化节点网络。通过达成共识，区块链免受篡改。开发人员可以使用区块链构建业务逻辑，并让该逻辑以特定编程语言编写、在执行环境中运行\
  \ [20]。\n\n## BaaS 与 PaaS 有何不同？\n\n\n\n\n虽然 SaaS 的概念是 BaaS 模型的核心，但由于基础设施支持的可用性，它可以在\
  \ PaaS 中显式重写 [27]。在考虑它们的相似点和差异时，比较 BaaS 和 PaaS 模型会变得更清晰。PaaS 模型用于创建应用程序，而无需管理其基础设施；而\
  \ BaaS 模型则利用区块链构建定制化应用程序 [38]。在成本降低、可扩展性和订阅制方面，BaaS 的优势与 PaaS 相似 [33]。与 BaaS 一样，PaaS\
  \ 也让企业能完全控制应用程序开发，而无需担心基础设施和存储问题 [27]。BaaS 模型还提供其他益处，包括增强的数据安全性、透明度、隐私性和不可篡改性 [2]。通常，BaaS\
  \ 服务将容器分发到云端，并利用它们创建点对点网络。这些容器包含作为分布式节点运行区块链所需的软件和数据 [20]。此外，BaaS 自行管理分叉和共识机制 [27]。\n\
  \n## BaaS 应用程序如何运行？\n\n凭借其透明的本质，区块链技术通过在整个网络中向公众传递信息，提供了一个值得信任的环境，同时促进了信任与完整性。BaaS\
  \ 在幕后提供了大部分应用程序和所需专业知识，使专注于业务逻辑变得更加容易。\n\n目前，四个主要层构成了 BaaS 平台的当前架构，即应用层、中间件层、区块链框架层和区块链基础设施层。通常，每一层可被视为一个单独的容器，其中包含多个功能组件。图\
  \ 15.1 展示了 BaaS 架构概览。\n\n![图 15.1 区块链即服务架构。 ¶ 来源：[22]。](html/images/9781032078243_C015_001.jpg)\n\
  \n图 15.1 区块链即服务架构。 ¶ 来源：[22]。\n\n*   **应用层**：在 BaaS 架构中，应用层是用户与支持其后端的 BaaS 服务进行交互的最高层级。随着区块链技术从其作为加密货币基础的传统角色演变，不同类型的工具支持网络执行必要功能。与所有平台一样，区块链应用程序构建在区块链基础设施之上。包括\
  \ `Amazon`、`Oracle` 和 `Samsung` 在内的多家区块链提供商，为客户提供预定义或通用的应用程序以供直接使用 [19]。这种方法对开发者更高效，且不要求完全理解区块链的内部机制。因此，BaaS\
  \ 提供商仅需部署运行在区块链基础设施上的去中心化应用程序。\n\n*   **中间件层**：中间件层作为接口层，允许 BaaS 应用层在 BaaS 架构中与区块链框架层连接。资源调度、数据分析、监控和访问控制服务被视为在该层内执行的基本操作活动。资源调度算法用于确定如何分配有限资源以确保最大化利用率。监控服务监控和审计网络性能，通知开发者网络中可能存在的任何问题。此外，区块链数据也可被记录和分析以改进区块链应用程序。在\
  \ BaaS 实现中，访问控制可通过使用正确的授权和认证措施避免未经授权的数据访问，从而提供高保障。通过提供这些操作服务，中间件层使 BaaS 具有高可靠性和可扩展性。\n\
  \n*   **区块链框架层**：区块链框架层是智能合约的服务器，在 BaaS 架构中承载智能合约平台。智能合约运行在支持用特定语言编写的代币化程序的平台上，并在满足特定条件时自动执行。该层支持\
  \ `Ethereum`、`Hyperledger Fabric`、`R3 Corda` 和其他平台 [22]。\n\n`Hyperledger Fabric`\
  \ 是一种广泛使用的分布式账本技术。许多提供 BaaS 服务的提供商（如 `Huawei`、`Oracle` 和 `IBM`）均采用 `Hyperledger\
  \ Fabric` 作为底层区块链平台。`Hyperledger Fabric` 是一个由 Linux 基金会和 `IBM` 管理的模块化区块链平台，在各个领域有众多应用。此外，`Hyperledger\
  \ Fabric` 是一个许可型公共网络，新成员必须经过筛选和批准才能加入。因此，只有经过批准的网络成员才拥有访问权限。在企业级区块链解决方案的背景下，这些能力尤为宝贵。另一种分布式账本技术是\
  \ `Ethereum`，一种公共且无许可的协议。`Ethereum` 为各类应用程序和交易提供通用平台。在 DLT 提供商中，`Quorum`（`Ethereum`\
  \ 的许可版本）促进了交易和智能合约的隐私保护。除了 `Ethereum` 和 `Hyperledger Fabric`，`R3 Corda` 也是一种许可型分布式账本技术协议，主要用于金融交易\
  \ [19]。\n\n*   **区块链基础设施层**：就基础设施而言，大多数提供商在供应商提供的硬件上运行其区块链平台。典型设置包括在提供商的云产品中托管区块链。大型\
  \ IT 服务提供商通常提供此类设置，因为它们拥有现成的云基础设施。也可能存在提供商在第三方基础设施上托管 BaaS 的情况。例如，`IBM` 为客户提供在其云中托管\
  \ BaaS 或使用 `AWS` 等第三方基础设施的选择 [19]。一般来说，BaaS 架构要求区块链平台的开发和实施，这涉及一个需要计算资源来实现智能合约的分布式网络。计算资源可以是物理机或虚拟机，也可以是\
  \ `docker`。例如，`Ethereum` 智能合约利用虚拟机，而 `Hyperledger Fabric` 智能合约则使用 `dockers`。智能合约应保持在沙箱中隔离，以防止病毒或漏洞的传播。区块链增长的两大限制是：部署区块链基础设施的复杂性，以及高昂的相关运营和维护成本。然而，BaaS\
  \ 摒弃了搭建基础设施的繁琐任务，使开发者能够专注于应用程序 [22]。\n\n### 共识机制\n\n\n\n大多数 BaaS 服务采用崩溃容错（CFT）或拜占庭容错（BFT）。目前，Hyperledger\
  \ Fabric 提供的 BaaS 最常用的共识机制是 `Kafka` 和 `Raft`，两者均为 CFT 排序服务。CFT 设置指定一个被假定为可信的领导节点。由于网络中的所有节点都将复制领导者的条目，因此领导者必须值得信任。由于\
  \ CFT 共识或排序服务仅可由获得授权的人员访问，因此领导者被推定为可信。如果当前领导者崩溃，将指定新领导者。通过利用交易终局性，CFT 还有助于加快共识进程。基于\
  \ Hyperledger Fabric 构建时，`Alibaba`、`Amazon`、`Huawei`、`Oracle`、`SAP`、`IBM` 和 `Samsung`\
  \ 可使用 Kafka CFT，而 `Raft` 仅由 `Baidu` 提供。\n\nQuorum 兼容 `Raft` 以及 `Istanbul BFT`——一种\
  \ BFT 共识的变体。与 CFT 算法（使用区块提议者或领导者决定是否批准区块）不同，`Istanbul BFT` 算法要求对每个区块进行多次投票。使用 BFT\
  \ 时，网络能够处理三分之一节点的故障。因此，在竞争对手或其他网络参与者不可信的情况下，可以使用 `Istanbul BFT`。大多数在其平台上提供 Quorum\
  \ 的 BaaS 供应商（如 `Alibaba` 和 Microsoft `Azure`）均使用 `Istanbul BFT` [19]。\n\n## 选择区块链即服务合作伙伴的标准\n\
  \n如今市场上有多家 BaaS 供应商。然而，选择最佳平台需要广泛的研究和分析。由于市场缺乏适当的指南和最佳实践，选择过程颇具挑战性。选择供应商时应考虑以下几个重要因素\
  \ [32]：\n\n*   **过往记录**：组织在选择供应商时，应选择在 BaaS 部署方面拥有丰富经验的供应商。可通过查察其投资组合、主要现有客户、审计结果和客户见证来获取供应商的过往经验。\n\
  *   **质量承诺**：质量承诺是组织为成功实施项目必须考虑的关键因素，因为低质量的基础设施可能导致业务失败。当消费者信任并购买产品和服务时，服务提供商应为其客户提供最优质的服务。因此，组织必须确保供应商遵守质量、既定流程和标准。\n\
  *   **易用性**：用户友好的流程和系统显著影响业务成果。因此，企业应确保启用区块链的系统易于员工采用。\n*   **集成性**：除了多层业务流程、工作流等，公司应采用可与系统集成且不干扰遗留网络的\
  \ BaaS。\n*   **流程控制**：考虑实施计划是否涵盖任何安全漏洞。控制数据流、计算资源、主动监控工具等几项关键控制，对于维护一个能抵御黑客攻击的安全环境至关重要。谈到分布式账本，组织应争取最稳健的结果。\n\
  *   **后端服务**：后端服务——主流技术和流行服务功能的集成——应进行广泛评估。企业应关注数据安全、成本控制、集成和流程控制等功能。\n*   **快速配置**：快速配置有助于快速部署区块链网络，同时将过程中的风险降至最低。Web\
  \ 浏览器差异、防火墙、数据库、硬件和应用服务器等障碍使网络快速部署变得复杂。因此，企业应确保 BaaS 供应商能有效、高效地部署和管理区块链环境，且错误或缺陷极少。\n\
  *   **数据安全**：企业必须确保数据受到保护，并保持在 BaaS 供应商建立的平台边界内。\n*   **成本控制**：企业还应审查供应商提供的定价和部署后支持选项。选择订阅价格合理的供应商，与评估隐性费用并根据预算限制做决定同等重要\
  \ [2]。\n\n## BaaS 平台\n\n如前几节所述，BaaS 模式使组织能享受智能合约平台的优势，而服务提供商通常处理基础设施。下文讨论几家可与企业集成的热门商业\
  \ BaaS 供应商。\n\n### IBM BaaS\n\n`IBM` 于 2017 年在 `IBM Cloud` 上提供基于 `Hyperledger Fabric`\
  \ 的 BaaS 解决方案，此后推出了两个平台版本：`IBM Blockchain Platform 2.5.2` 和 `IBM Blockchain Platform\
  \ for IBM Cloud`。`IBM Blockchain Platform 2.5.2` 允许在任何 `Kubernetes` 平台上部署区块链组件，而\
  \ `IBM Blockchain Platform` 仅允许部署在 `IBM Cloud Kubernetes` 集群上 [18]。`Kubernetes`\
  \ 在 `IBM BaaS` 架构中充当基础设施 [22]。开发人员可借助 `Bluemix` 创建区块链应用程序。使用 `Bluemix`、`Hyperledger\
  \ Fabric` 和 `IBM Cloud`，用户可开发 `DevOps` 并部署 `Chaincode`。同时，可使用 `Chaincode` 维护业务逻辑，`Chaincode`\
  \ 使用 `Go` 和 `Node.js` 编写。`IBM BaaS` 智能合约支持 `JavaScript`、`Go` 和 `Java` 语言 [27]。`IBM`\
  \ 区块链平台支持各种运营工具，以确保对平台的治理和灵活性 [22]。用户对区块链组件的操作、治理和实施拥有完全控制权。`IBM BaaS` 解决方案的主要目标是为企业提供高可用性、开箱即用的企业级就绪状态和灾难恢复选项\
  \ [27]。\n\n### Oracle\n\n`Oracle` 提供基于 `Hyperledger Fabric` 的 `Oracle Blockchain\
  \ Cloud Services (OBCS)`，这是一个开源平台。\n\n\n\n\n#### BaaS 解决方案概览\n\n##### Oracle BaaS\n\
  \nOracle 提供的 BaaS 解决方案具有两大核心能力：开箱即用的沙箱环境和独立软件供应商。开箱即用的沙箱环境面向开发者。独立软件供应商 (ISV) 使区块链技术的部署变得简单，无论是在入网引导还是智能合约生成方面，且不受供应商限制\
  \ [27]。平台采用基于组合的架构，这意味着所有系统和流程均设计为支持 API 启用。Oracle 区块链云服务运行在一个验证节点和账本的区块链网络上，通过执行代表业务逻辑的智能合约来响应查询。外部应用程序可通过客户端\
  \ SDK 或 REST API 调用交易或运行查询。达成共识后，交易将被添加到区块中。交易透明且共享，但可根据其等级限制访问权限。此前，排序节点由一组 Kafka\
  \ 和 Zookeeper 机器集群管理。然而，该架构在应用于云环境时日益显得资源密集。因此，推出了共识插件 RAFT 来管理排序服务，并使其做好面向企业级生产网络的准备。借助\
  \ RAFT，一组排序节点协同工作，基于动态领导者模型创建排序区块。因此，成员组织的参与最为公平和统一，即使节点数量庞大亦是如此。此外，Oracle 还提供更优质的加密服务以保护敏感信息\
  \ 12, [16]。\n\n### Microsoft Azure BaaS\n\n作为与 Consensys（一家领先的云计算服务提供商）合作的一部分，Microsoft\
  \ 也于 2015 年底在其 Azure 平台上提供了以太坊区块链即服务 (EBaaS)。Azure BaaS 支持 Ethereum、Corda、Quorum\
  \ 和 Hyperledger Fabric [27]。借助 Azure BaaS，客户还可部署带有分布式账本的企业级模板，且无需承担费用。然而，当在区块链上构建应用程序时，客户需自行负责开发和成本。Microsoft\
  \ Azure 在 BaaS 方面提供三种产品：Azure 区块链服务、Azure 区块链工作台和 Azure 区块链开发工具包 [12]。\n\n#### Azure\
  \ 区块链服务\n\nAzure 区块链服务是一项完全托管的区块链服务，允许客户在几分钟内创建和运行区块链网络。Azure 以简化的形式为基础设施管理和网络治理提供完整的端到端解决方案，并内置联盟网络。Azure\
  \ 区块链服务支持 Ethereum Quorum 账本，采用伊斯坦布尔拜占庭容错共识机制。客户无需关心底层基础设施，可专注于应用开发和业务逻辑。作为其退役计划的一部分，Azure\
  \ 区块链服务将于 2021 年 9 月由 Consensys 的 Quorum 区块链服务取代 [28]。\n\n#### Azure 区块链工作台 (ABW)\n\
  \nAzure 区块链工作台是一组 Azure 服务，允许企业开发和管理区块链应用程序，并将其业务流程跨组织传递。Microsoft 的 Azure 区块链工作台促进了区块链应用程序的开发，使开发人员能将精力集中在构建业务逻辑和智能合约上。Azure\
  \ 区块链工作台因其集成能力而广受欢迎，这些能力利用工作台的 Web 应用程序和 REST API 简化了区块链应用程序的创建。通过这些 API，客户可以替换不同的分布式账本技术、存储产品和数据库。此外，ABW\
  \ 可与所有主流 Microsoft 产品集成，包括 Excel、SharePoint、Office 365 等。\n\n#### Azure 区块链开发工具包\
  \ (ABDK)\n\n区块链开发工具包包含代码示例，是一个旨在与 Azure 服务集成的 GitHub 存储库。作为 Azure 平台的一部分，Microsoft\
  \ 提供了一个基于 Microsoft 无服务器技术并与 Microsoft 及第三方 SaaS 集成的区块链开发工具包。除了能够连接到多个数据源外，Azure\
  \ 区块链开发工具包还可与遗留应用程序和协议集成，例如 Excel、Office 365 等。借助 Azure 区块链工作台和 Azure 区块链开发工具包提供的\
  \ RESTful API，与区块链节点交互从未如此简单和安全 [12]。\n\n### Amazon AWS BaaS\n\n借助 Amazon Managed\
  \ Blockchain，AWS 提供了一个完全托管的平台即服务，用于利用开源分布式账本技术（如 Ethereum 或 Hyperledger Fabric）构建和部署区块链网络。该平台为客户提供多种实例类型选择，具有可定制的计算和内存容量，以适应其区块链应用程序需求。网络启动通过\
  \ AWS 区块链模板执行。网络可用后，Managed Blockchain 的投票 API 将允许成员就网络参与进行投票。随着新成员的加入，Managed Blockchain\
  \ 提供启动和配置多个对等区块链的能力，这些节点将处理交易请求并存储账本副本。作为托管区块链生态系统的一部分，AWS 密钥管理服务充当证书颁发机构。因此，加入\
  \ Managed Blockchain 的新用户无需设置硬件安全模块。凭借网络可扩展性，网络可适应增加的交易量和负载。此外，新成员无需特殊硬件即可加入云端。Amazon\
  \ Managed Blockchain 作为 Hyperledger Fabric 框架的一部分，用于增强“排序服务”，从而在区块链网络间建立信任。量子账本数据库\
  \ (QLDB) 记录区块链上所有未提交的交易，确保透明且安全的排序服务 [12]。\n\n### Alibaba BaaS\n\nAlibaba Cloud\
  \ 是当今市场上最著名且专利最丰富的供应商之一。其 BaaS 平台基于 Alibaba Cloud 容器服务的 Kubernetes 集群构建，支持 Hyperledger\
  \ Fabric、Ethereum 和金融级区块链技术蚂蚁链。除了支持公有部署外，该基础设施还支持私有部署。借助 Alibaba Cloud 区块链即服务，用户可创建生产级区块链环境，并可图形化管理运维操作。\n\
  \n得益于其分布式数据中心，Alibaba BaaS 在全球范围内提供服务。由于联盟区块链网络建立在多租户隔离原则之上，每个参与者均可独立管理其资源。此外，部署简单易行，易于与其他云服务和产品集成，并拥有灵活的生态系统，可支持广泛的应用程序和插件。Alibaba\
  \ Cloud 区块链即服务包含默认的 Anti-DDoS 基础防护服务。供应商提供的额外服务包括产品溯源、供应链金融和数据资产追踪，以跟踪数据所有权。该供应商提供的服务可定制以满足特定业务需求，同时保持先进的安全性和隐私保护\
  \ [1]。\n\n### Accenture\n\n\n\n\n\n#### Accenture BaaS 产品\n\n在 `Accenture` 的 BaaS\
  \ 产品方面，与市场上的其他提供商相比，该组织提供了不同的视角。公司的咨询服务旨在帮助组织清晰地理解并选择合适的 BaaS 解决方案。Accenture 的市场策略涵盖咨询、战略和实施。关于\
  \ BaaS 解决方案，Accenture 通过提供问卷和详尽的服务简报做出贡献，随后根据业务需求提供平台的设计和实施模型，以及平台的部署环境。此外，供应商还为开发人员提供高级培训以达成其目标\
  \ [2]。\n\n### 百度\n\n`Baidu`，中国流行的网络搜索引擎，推出了“超级链”区块链平台，现正为企业提供“百度可信” BaaS 平台 [2]。与微软不同，百度可信是一个自研平台。该服务利用分布式账本技术促进交易及其追踪。将构建进企业基础设施的区块链的每个组件都可以灵活地进行定制和配置。一个利用区块链技术的百度可信资产支持证券交易产品在中国诞生，并在资产证券化和资产交易业务中取得了成功\
  \ [13]。\n\n### 华为\n\n早在 2018 年初，`Huawei` 就推出了一个区块链即服务平台，称为区块链云服务（BCS）。借助华为 BCS，区块链连接的管理和部署变得更加容易，降低了区块链技术采用的门槛。BCS\
  \ 提供全生命周期管理和基于 GUI 的智能合约创建、部署与调试。通过将行业特定的区块链应用与区块链平台集成，确保了数据的完整性和准确性，保障了数据的可靠性和安全性。区块链网络可通过软件开发工具包（SDK）或\
  \ RESTful（表述性状态传递）API 访问，并可利用与区块链云服务关联的监控平台实时监控数据和资源，并在必要时发送通知。得益于华为云的高性能，区块链账本可高效且及时地存储。华为\
  \ BCS 的显著特点在于其降低故障风险和无供应商锁定的能力 [6]。\n\n### SAP BaaS\n\n`SAP 区块链服务`主要分为两大类：`SAP Cloud\
  \ Platform` 和 `SAP HANA Blockchain Services`。\n\n#### SAP Cloud Platform 区块链服务 (SCP)\n\
  \n使用 `SAP Cloud Platform (SCP) 区块链服务`，可以在云平台上快速高效地开发基于区块链的应用程序，且在与 SAP 环境集成时风险极低。SCP\
  \ 区块链服务支持 Hyperledger Fabric 和 MultiChain。\n\n#### SAP HANA\n\n`SAP HANA` 本身不运行在区块链上，而是配置连接的属性。与区块链平台不同，SAP\
  \ HANA 区块链服务不是一个区块链平台，而是将现有区块链平台连接到数据库的一种手段。SAP HANA 旨在利用 SAP 系统中的交易数据进行分析。SAP HANA\
  \ 平台可通过使用 SCP 区块链服务连接到分布式账本技术。借助 HANA 数据库，可使用 SQL 查询访问区块链数据。分析需要数据整合。因此，需要 SAP HANA\
  \ 区块链服务 [15]。\n\n表 15.2 提供了 BaaS 平台的对比。有关定价和功能的更多信息，请参阅访问链接。\n\n#### BaaS 平台对比\n\
