  \ | 区块链是否针对问责制、信息保护和交易有效性制定了充分有效的标准？ |\n| 17 | 节点信誉验证 | 节点是否具备适当的信誉验证程序？ |\n| 18\
  \ | 网络监控工具与资源 | 是否部署了足够的工具和资源来监控和分析网络？ |\n| 19 | 数据泄露检测机制 | 是否建立了检测网络数据泄露的有效机制？\
  \ |\n| 20 | 故障点识别与处理 | 网络是否有识别和处理可能故障点的方法论？ |\n\n## 总结与结论\n\n区块链技术正朝着全球市场的指数级增长迈进。作为本时代开创性且颠覆性的技术，组织绝不能低估充分测试和将有效审计方法论应用于区块链环境的重要性。随着业务依赖持续转型和客户满意度，若未纳入适当考量就将区块链技术植入企业架构，极可能产生不利影响。因此，在区块链应用的开发生命周期中，应强制执行有效的测试和缺陷管理原则，以实现平滑集成。\n\
  \n本章首先讨论了测试阶段需考虑的测试程序及随之而来的挑战。测试——作为一个过程——核心在于发现缺陷/漏洞。在本章后续章节中，介绍了各类漏洞分类及推荐测试工具。最后，展示并讨论了\
  \ `KPMG` 提出的审计框架。利用拟议的审计清单制定有效的审计框架和测试策略，将有助于构建安全的区块链应用。\n\n## 核心概念\n\n*   为了对数字化转型做出积极贡献，区块链技术必须经过成功测试，并与其他软件和技术成功集成。因此，应将在开发生命周期各阶段测试区块链应用的关键性纳入考量，因为这能暴露新区块链应用可能存在的漏洞。\n\
  *   为支持区块链应用的高效、高标准发布，应在有效且全面的测试方法论之外，实施质量保证和缺陷管理策略。文中讨论的四步缺陷管理策略有助于确定消除漏洞所应采取的纠正措施。\n\
  *   测试区块链应用至关重要，因为一旦区块链交易被处理，便无法撤销。利用本章讨论的工具识别出漏洞后，需对其进行妥善分类和记录。该文档能进一步帮助新开发人员理解漏洞的行为及其发生频率。可用且推荐使用开源工具进行漏洞分析和智能合约分析。不同工具采用不同的漏洞检测技术。例如，`Mythril`\
  \ 使用控制流检查，`Oyente` 通过源代码分析漏洞，`Securify` 使用基于 `UI` 的界面，`SmartCheck` 分析 `Solidity`\
  \ 源代码。\n*   在采用成熟测试方法论执行测试时，需考虑多个因素，如区块大小、链大小、负载、安全性、数据传输、区块添加及加密安全数据等。根据区块链应用的组件不同，会执行不同的软件测试方法论，如功能测试、API\
  \ 测试、集成测试、性能/负载测试和安全测试等。\n*   区块链测试存在不同的框架和工具。开发人员和测试人员应根据自身需求和目标选择测试区块链的工具和框架。\n\
  *   `Truffle` 是一款流行的 `Ethereum` 开发框架。偏好命令行界面的测试人员可使用 `Hyperledger Composer`。`Rust`\
  \ 程序员可考虑使用 `Exonum` 测试套件对交易逻辑执行测试。本章介绍的所有工具均可在 `Github` 上获取。\n*   世界正演变为日常活动迈向自动化环境的阶段。通过实施称为自动化测试的测试模型，降低了区块链应用中人工干预的需求。可能存在需要在固定时间间隔持续测试的业务场景。这些场景实现自动化并接受回归测试。\n\
  *   为跟踪和监控测试过程，必须建立高效的测试管理策略。测试管理包括对区块链应用整个测试过程的跟踪和维护。从最终用户视角测试成品应用以获取必要反馈至关重要。根据收到的反馈，部署区块链应用前需分配足够时间解决所有问题。\n\
  \n## 进阶理解活动\n\n以下阅读材料对计划为区块链应用制定内部审计策略的审计专业人员大有裨益。\n\n*   **区块链环境审计指南**\n*   **访问链接：**\
