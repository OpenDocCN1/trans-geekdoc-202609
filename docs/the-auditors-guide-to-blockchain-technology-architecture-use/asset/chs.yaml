  \ --- |\n\n\n\n\n\n#### 第 7 阶段：如何保持势头？\n\n实施生命周期的最后阶段是帮助维持已实施的区块链解决方案。这应通过有意识的强化、持续的沟通渠道以及所有利益相关者的承诺来完成。在必要时实施纠正措施和计划，并记录经验教训，以分享知识供未来参考（参见表\
  \ 11.13 和 11.14）。\n\n##### 表 11.13 第 7 阶段：目标、描述、任务、输入、资源和输出\n\n##### 第 7 阶段描述——如何保持势头？\n\
  \n| 阶段目标 | |\n| --- | --- |\n| 评估区块链实施项目的结果。记录并分享经验教训。基于经验教训，改进组织架构、流程、角色和职责，以便企业能够强化其\
  \ IT 目标。这应使组织能够在区块链实施后最佳地恢复业务。通过持续监控绩效和定期报告结果，在实施周期的迭代中保持势头。 | |\n\n| 阶段描述 | |\n\
  | --- | --- |\n| 实施周期的此阶段确定预期的区块链交付成果是否已达成。这可以通过召开反馈会议、研讨会或调查，向区块链实施团队和利益相关者征求回复来完成。集体反馈应与原始成功标准进行对比。这可用于新举措和开发新的改进项目。识别出的改进将用于迭代的下一步。企业应识别经验教训，巩固成功成果，并在未来对\
  \ IT 治理进行再投资。应开发并优化角色、职责、政策和程序，以使 EGIT（企业 IT 治理）能够有效运行并融入正常的日常运营中。 | |\n\n| 持续改进\
