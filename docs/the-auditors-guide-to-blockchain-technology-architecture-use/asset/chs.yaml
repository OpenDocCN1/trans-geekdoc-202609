  \n# 三式记账的出现：对会计师和审计师的启示\n\nIbukunoluwa Mabo, Oluwatobiloba Iroko and Oyegbenga Oyenekan\n\
  \nDOI: [10.1201/9781003211723-4](http://doi.org/10.1201/9781003211723-4)\n\n## 摘要\n\
  \n本章探讨了区块链技术在现代会计中的影响及其对会计和审计专业人士的潜在启示。在简要回顾财务会计演变历史（从单式记账到复式记账，再到如今的三式记账）之后，本章基于舞弊审查师协会（ACFE）舞弊树模型，提出了利用区块链作为反舞弊控制手段的建议，以帮助缓解财务报表舞弊、现金盗窃、存货舞弊和薪资舞弊方案。本章还包含一个面向内部和外部审计师的、聚焦区块链的采购循环审计模板。\n\
  \n## 会计分录的历史\n\n### 单式记账\n\n单式记账的最早记录可追溯至印度。在孔雀王朝时期（公元前 321 年至公元 185 年），Chanakya\
  \ 撰写了一本关于财务与管理的书籍，旨在保存账簿处理的方式与方法 [4]。即使在更优越的方法开发出来后，单式记账仍一直被广泛使用，直到 19 世纪中叶 [2]。\n\
  \n单式记账依赖会计的单边分录，即将财务事件记录在一本称为现金日记账的账簿中。小企业多采用单式记账交易，因为它们记录的交易量较小；特别是在以现金基础记录收入和支出方面\
  \ [26]。\n\n衡量一个会计系统是否有效，取决于记录保存得有多好，以及能多大程度满足内部和外部决策者的信息需求 [28]。因此，单式记账可能适用于业务活动量有限的小型经营单位。其优势在于不需要复杂的计算。单式记账会计制度的缺点是，它无法解决现代会计世界中提出的许多问题，因为现代会计需要通过广泛的司法会计分析来发现财务舞弊\
  \ [14]。\n\n### 复式记账\n\n复式记账体系始于 15 世纪，由一位名为 Luca Pacioli 的意大利经济学家创立。复式记账是指利用两类账户——借方和贷方，在会计账簿的两边记录交易。威尼斯人所实践和应用的伊斯兰会计实务，也可能影响了复式记账的形成\
  \ [9, 10]。\n\n复式记账的原则在于：每一笔借方分录都必须有相同金额或交易的相应贷方分录，每一笔贷方分录也必须有相同金额或交易的相应借方分录 [35]。\n\
  \n1494 年，Luca Pacioli 在威尼斯出版了第一部记账著作，题为 *Summa de Arithmetica, Geometria, Proportioni\
  \ et Proportinalita*（《算术、几何、比例与比例性汇编》），这是一本关于算术和几何的书。Luca Pacioli 的著作标志着复式记账会计制度的开端\
  \ [31]。Littleton (1927) 确定的导致系统记账出现的因素包括：识字率提高、货币与贸易发展、阿拉伯数字与十进制制的引入，以及私有财产所有权的显著增加\
  \ [27]。\n\n### 三式记账\n\n“三式记账”这一术语最初由会计专家 Yuji Ijiri 提出。在现有的借方和贷方分录基础上，Yuji 建议引入第三层分录，利用一组账户进一步阐释收入的变动。另一种三式记账理论由金融密码学家\
  \ Ian Grigg 提出。Grigg 于 2005 年在其网站上发表了题为 *Triple-entry Accounting*（《三式记账》）的文章 [16]。他提出了一个新理论——“收据即交易”，即为了防止交易舞弊并将内部文档中的无意错误降至最低，第三笔分录可以包含一个由金融密码支持、在双方之间进行数字授权的收据\
  \ [5]。三式记账出现在 Satoshi Nakamoto 2008 年的论文《Bitcoin: A Peer-to-Peer Electronic Cash\
  \ System》（《比特币：一种点对点的电子现金系统》）中 [6]。\n\n三式记账是一种现代且有效的方法，旨在解决影响现有会计系统的信任与问责核心问题 [16]。在三式记账中，企业组织需要在区块链结构上妥善执行内部交易，相应的分录将记录在一个公共共享账本中\
  \ [5]。\n\nJason Tyra 于 2014 年在 *Bitcoin Magazine*（《比特币杂志》）上发表了一段简短文字，认可 Grigg 提出的三式记账原则。自\
  \ Tyra 的文章发表以来，三式记账已成为一个日益被接受的概念 [6]。比特币常被用作描述三式记账系统的模型 [17]。Deloitte 于 2016 年发布的一篇简短文章指出，区块链三式记账的引入将成为会计领域的一个转折点\
  \ 5, [24]。因此，随着更多现代财务事件要求对信任进行去中心化和分布式管理，区块链的实施已成为必要 [9]。\n\n### 复式记账与三式记账的对比\n\n\
  实施基于区块链的会计系统，将复式记账和分布式记录转变为去中心化的公共记录，能为被审计单位记录的完整性提供高度的确定性 [6]。Dai 和 Vasarhelyi\
  \ 定义了一种可能的未来基于区块链的会计环境：在复式账簿记录交易所用的标准两笔分录之上，引入第三笔受密码学保护且可访问的分录到区块链中。Dai 和 Vasarhelyi\
  \ 定义的基于区块链的会计环境有望防止数据篡改和其他类型的财务舞弊，鼓励从基于抽样的评估向全量测试评估转变，并配合包括智能合约在内的其他创新，促进会计报告的实时有效生产\
  \ [8]。\n\n\n\n\n由于能够将智能合约和机器学习技术融入基于区块链的数据收集系统，因此有可能会有更多的交易记录和相关数据收集以自动化方式完成。例如，据预测，如果将通用信用评分应用于财务信息，若基于来自基于区块链的会计系统的实时财务信息而非目前可获得的定期报告，则可能会做出不同的决策\
  \ [6]。\n\n三式记账可通过区块链技术实现，因为支付、与（智能）合约相关的信息管理、商品和服务交换相关的交易以及许多其他多方会计交易均可执行 [9]。此外，区块链技术能满足所有会计法律要求和会计准则\
  \ [11]。使区块链技术成为实现三式记账的合适架构的一些组成部分包括：账本的不可篡改性、交易的透明性以及共识机制 [10]。\n\n在三式记账中，共享条目是交易记录完全可靠的来源。然而，共享交易存储库的本地副本可作为子账本纳入各交易方的总账\
  \ [17]。公共账本可由大型社区访问，交易可被对公司业绩感兴趣的公众用户和利益相关者追踪和知晓。重要的是要注意，一旦添加，交易无法从区块链中删除。如果需要修改不正确的区块，节点必须插入一个包含更正分录的新区块来更正前一个区块\
  \ [10]。\n\n需要采取一些步骤，以便在区块链系统中使用新的交易记录更新各方之间的共享记录，例如需要有两方参与。一方发起一个称为“请求”、“报价”或“交易草稿”的交易条目，另一方接受它。存在一个签名收集过程，其中一方在交易条目草稿上添加其签名，对手方通过会签予以接受，然后该条目由共享交易存储库处理。共享交易存储库检查以确定签名是否有效，并在确认有效后对条目进行签名。这会生成一个经过三方签名哈希处理的收据，所有各方持有相同的数据，且无法丢失或篡改\
  \ [17]。\n\n## 三式记账对会计师的影响\n\n从长远来看，三式记账的应用可能会对会计师和会计职业产生各种影响 [36]。三式记账实现了确认、计量、列报和披露的自动化，这取代了记录和编制财务报表等一些传统会计工作，从而增加了会计师利用区块链技术制定和执行指导财务会计的规则和准则的就业机会\
  \ [37]。三式记账在保证原始凭证的真实性和智能合约的真实性方面也很有效 [36]。此外，区块链的使用促进了智能合约的应用，智能合约允许高效有效的合约管理、减少税务违规并支持权责发生制会计\
  \ [21]。最后，在三式记账系统下，财务审计的成本有可能降低，因为这是一种解决影响现有会计系统的基础信任和公开性问题的新且更高效的方法 [36, 37]。\n\
  \n## 区块链对审计师的影响\n\n区块链技术为审计和鉴证职业提供了广泛的机遇和挑战。虽然传统审计和鉴证的重要性保持不变，但重要的是要注意，审计师的方法可能对得出更有效、更高效的审计结果产生重大影响。通过区块链技术出现的三式记账在审计职业中提出了一些基本问题，例如：审计专业人士需要学习和采用哪些可能的区块链相关技能组合，以保持相关性？\
  \ [3]。\n\n在审计和鉴证职业中使用三式记账的优势之一是进一步发展了控制测试层级，从而提高了审计的有效性，并改善了评估的内部结构和执行细节。拥有正确的控制组合可减少财务报表和记录中由错误和舞弊引起的风险水平，从而帮助审计师出具更好的审计报告。随着时间的推移，审计职业很可能会从个别评估转向开发测试算法——如智能合约——这些算法是自动化的，并通过分布式账本运行\
  \ [8]。\n\n此外，区块链网络上的近实时审计和财务报告可让审计师灵活地专注于复杂和高风险交易。由于区块链技术的透明性，获取审计信息变得更容易，审计证据也易于提取。每条数据都能存储在区块中，这强调了透明度和安全性，且免受外部人员篡改。这增加了对审计的信任，因为数据更安全\
  \ [37]。\n\n区块链技术也可能减少审计准备时间。由于网络的去中心化，区块链网络上的交易可缩短交易发生日期与验证日期之间的差距。然而，转向区块链网络审计意味着控制风险将下降，而固有风险可能增加。区块链技术的特性使审计证据不可篡改，从而减轻并改善了审计师的工作，最终导致更快的审计和财务报告\
  \ [3]。\n\n还必须注意，既然经过审计的财务报表是大型实体所需的工具，区块链技术将不会取代财务报告和财务报表审计。财务报告和审计在债权和股权融资、参与资本市场、并购等方面发挥着关键作用\
  \ [8]。财务报表反映管理层陈述，包括估计，其中许多可能不易在区块链上汇总 [37]。\n\n## 利用区块链技术缓解财务舞弊\n\n舞弊预防是全球组织成功的基本要求。根据\
  \ 2020 年《舞弊审师协会》（ACFE）《致各国报告》（RTTN），来自 125 个国家的 2,504 起案件中，2020 年舞弊造成的总损失超过 36 亿美元；这意味着每年因舞弊损失\
  \ 5% 的收入 [31]。在区块链技术上进行交易可大幅减少职业舞弊。下文包含 ACFE 舞弊手法的描述。\n\n### 财务报表舞弊\n\n\n\n\n###\
  \ 财务报表舞弊\n\n财务报表舞弊主要由管理层实施，是一种蓄意在组织财务报表中错报或遗漏重大数据，以欺骗财务报表使用者的计划 [13]。\n\n当组织使用分布式数字账本执行交易和存储数据时，财务报表舞弊可得到显著缓解。数字记录提供了供应链中商业网络成员之间交易的更高可见性和透明度。如前所述，区块链记录无法被篡改或删除，因此隐藏非法财务活动实际上变得不可能\
  \ [37]。因此，当组织使用分布式数字账本执行交易和存储数据时，财务报表舞弊可得到显著缓解。\n\n资产负债表上的某些项目无法完全量化，例如无形资产。例如，商誉、知识产权和公司声誉可能难以使用资产负债表的三式记账在区块链上显性量化\
  \ [36]。\n\n#### 窃取收入\n\n窃取收入是指在款项记录入账前被窃取的计划。在窃取收入计划中，员工试图通过删除发票或伪造贷项通知单来隐瞒盗窃行为\
  \ [13]。根据 RTTN 数据，窃取收入舞弊平均金额达 47,000 美元；约占所有职业舞弊的 11%。2020 年，窃取收入舞弊计划被评为中等风险 [31]。\n\
  \n如果交易在区块链技术上进行，窃取款项将变得越来越困难，因为大多数员工将没有加密密钥来访问款项；即使他们有，也必须提供身份证明，且他们的系统访问将是可见的。此外，由于交易在区块链系统上实时记录，几乎不可能在款项记录入账前将其窃取\
  \ [37]。\n\n#### 现金盗窃\n\n现金盗窃是指款项在特定期间内已录入组织账簿和记录后，被从组织处取走。现金盗窃可通过冲销交易、篡改现金盘点和伪造支票来实施\
  \ [13]。\n\n2020 年，现金盗窃舞弊占所有报告的职业舞弊案件的 8%。它造成了高达 83,000 美元的中位数损失。2020 年，现金盗窃舞弊计划被评为高风险\
  \ [31]。\n\n由于区块链技术的不可篡改特性，存储在账本中的记录无法被操纵或删除。每笔交易都被加上时间戳，并在验证和加密哈希后嵌入区块。哈希过程包含前一个区块的哈希值，将区块链接成网络中不可破坏的链条。如果员工篡改已记录的交易，区块链将断裂，原因将被轻易发现\
  \ [37]。\n\n#### 收款机支出计划\n\n收款机支出计划是指员工在收款机上制造虚假条目以欺诈性地取走现金。一个例子是欺诈性退款 [13]。2020\
  \ 年，收款机支出舞弊计划占所有报告的职业舞弊案件的 8%。它造成了 20,000 美元的中位数损失。2020 年，收款机支出舞弊计划被评为低风险 [31]。\n\
  \n收款机支出计划可通过区块链技术轻松缓解，因为区块链的去中心化网络提供了一个透明的平台，可在其中轻松识别和标记欺诈性数据和交易。链上记录的交易只能由拥有用户专属加密密钥的授权用户访问\
  \ [37]。\n\n#### 支票篡改\n\n这是一种个人通过挪用、伪造或修改本应支付给第三方的支票或电子支付，为自己谋取雇主资金的计划 [13]。2020\
  \ 年，支票篡改舞弊计划占所有报告的职业舞弊案件的 10%。它造成了 110,000 美元的中位数损失。2020 年，支票篡改舞弊计划被评为高风险 [37]。区块链赋能的智能合约在消除支票作为支付工具方面大有可为。\n\
  \n#### 虚假开支计划\n\n虚假开支计划是指个人通过提交虚构商品或服务的发票、虚高发票或个人采购发票，导致雇主付款的计划 [13]。2020 年，虚假开支舞弊计划占所有报告的职业舞弊案件的\
  \ 20%。它造成了 100,000 美元的中位数损失。2020 年，虚假开支舞弊计划被评为高风险 [31]。\n\n组织可使用基于区块链的费用和开支系统来验证费用并发放付款。在该系统中，费用由供应商创建的区块链验证记录来创建和记录\
  \ [37]。由于区块链技术的不可篡改性质，该系统中的交易无法被员工篡改。\n\n#### 工资单舞弊\n\n工资单舞弊是指个人通过制造虚假薪酬索赔，导致雇主发放付款的计划\
  \ [13]。2020 年，工资单舞弊计划占所有报告的职业舞弊案件的 9%。它造成了高达 62,000 美元的中位数损失。2020 年，工资单舞弊计划属于高风险\
  \ [31]。\n\n区块链的终局性和不可篡改性允许为商业交易和流程的每个阶段提供永久的、带时间戳的审计追踪。这有助于管理层消除因虚假索赔而发放付款的风险 [37]。\n\
  \n#### 费用报销舞弊\n\n在费用报销舞弊中，员工报销虚构或虚高的业务相关费用 [13]。2020 年，费用报销舞弊计划占所有报告的职业舞弊案件的 9%。它造成了高达\
  \ 100,000 美元的中位数损失。2020 年，费用报销舞弊计划被评为高风险 [31]。\n\n区块链技术允许对第三方进行独立验证。它创建了已发生的每笔交易的可验证记录；且这些交易只能在获得同意的情况下创建和/或修改。组织可使用基于区块链的费用系统来验证费用并进行付款。在该系统中，费用由供应商直接向组织收取，并在区块链网络上验证。整笔交易在网络上经过认证并执行。由于区块链技术的不可篡改性质，该系统中的交易无法被员工篡改\
  \ [37]。\n\n#### 库存挪用\n\n库存挪用是指员工滥用目标组织的非现金资产。区块链的去中心化和数据认证可防止参与者挪用库存资产。同样，库存盗窃是指员工窃取或挪用受害组织的非现金资产\
  \ [13]。如果组织的库存在区块链网络上数字化，由于交易在区块链网络上不可篡改，并由网络参与者通过共识进行认证和更新，库存的流动和使用将具有更好的可追溯性和透明度。\n\
  \n### 其他非 ACFE 相关的区块链威胁\n\n#### 双重支付攻击\n\n\n\n\n\n#### 双重支付\n\n双重支付是指在数字货币交易中出现的一种问题，即同一笔资金被多次花费，导致区块链网络中断和加密货币被盗\
  \ [20]。当区块被复制以窃取可信信息或货币，并使其看起来合法时，就会发生双重支付攻击 [19]。由于操纵复杂算法以使欺诈交易显得合法需要大量时间和严格流程，这是区块链中最难发生的攻击之一\
  \ [7]。\n\n双重支付攻击涉及花费一种加密货币，该货币对应的商品或服务交付已在先前的交易中完成。在双重支付攻击中，攻击者使用欺诈链以欺骗受害者并使攻击者受益的方式篡改目标交易\
  \ [18]。支付记录由交易组成，并通过现状链在网络中共享。双重支付攻击者在收到服务或产品后，利用伪造区块更改网络中的链状态。因此，如果双重支付攻击执行成功，将损害区块链的**不可篡改性**和**可信度**\
  \ [15]。\n\n可以使用 P2P 分布式时间戳服务器生成计算证明，利用共识机制确定性地验证交易，从而解决双重支付攻击 [29]。共识机制也称为工作量证明\
  \ [2]。实际上，该机制确保每个参与节点都验证交易 [29]。攻击者利用的算力越高，双重支付攻击成功的可能性就越大 [32]。\n\n#### 交易所黑客攻击\n\
  \n由于持有大量加密货币且缺乏万无一失的安全措施，加密货币交易所黑客攻击在过去十年中深受黑客青睐。为避免交易所钱包攻击，将加密货币存放在硬件钱包或纸钱包中更为安全，这将减少互联网接触点，使资金免受恶意在线黑客的侵害\
  \ [22]。第 2 章和第 3 章提供了关于加密钱包类型和安全功能的更多讨论。\n\n#### 社会工程学\n\n区块链聚焦的社会工程学采取多种不同形式，但目标始终如一：获取用户的私钥，或更具体地说，获取用户的加密货币。最流行的社会工程学类型之一是网络钓鱼，通常配合电子邮件使用。为避免成为社会工程学攻击的受害者，重要的是确保不公开向任何人透露登录凭证或私钥\
  \ [22]。\n\n#### 恶意软件\n\n由于设备被未经授权且不为人知地接管，隐秘挖矿会造成性能问题、增加能源消耗，并为其他恶意代码敞开大门。为防止恶意软件攻击，重要的是运行全面的恶意软件扫描和其他例行安全检查，以帮助确保用户计算机未感染恶意软件\
  \ [33]。\n\n## 拟议的采购周期区块链审计清单\n\n下面拟议的区块链审计清单的实施（表 4.1）有助于减少采购周期完成过程中与欺诈计划相关的问题。\n\
