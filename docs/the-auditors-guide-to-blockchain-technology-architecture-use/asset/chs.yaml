  \ R | C | C | C | C | C | R |\n\n#### 第二阶段：我们目前处于什么状况？\n\n第二阶段将区块链目标与企业的目标和战略相协调。它还对正在进行的项目进行优先级排序，以更好地与治理和管理目标保持一致。根据协调目标，应确定治理和管理目标具备产生预期结果的适当能力。管理层应通过对当前系统执行流程能力评估来识别任何不足。\n\
  \n应组建一支高效的区块链实施团队，配备合适的技能组合。团队成员应具备足够的专业知识和经验，并配备合适的内部和外部资源组合。区块链团队应为项目定义并承诺一个清晰的愿景。此外，应主动识别并解决实施区块链项目时可能引起摩擦的问题（表\
  \ 11.3 和 11.4）。\n\n##### 表 11.3 第二阶段：目标、描述、任务、输入、资源与输出\n\n| **第二阶段描述 – 我们目前处于什么状况？**\
  \ |\n| :--- |\n| **阶段目标** | 确保项目团队了解企业目标和 IT 职能，以从实施区块链中交付价值。识别实施区块链时可能涉及的关键流程。了解企业当前和未来的风险态度，以及\
  \ IT 风险状况对区块链实施的影响。确定当前的实施能力和企业的变革能力。 |\n| **阶段描述** | 识别并分析 I&T 在实施区块链的同时如何实现业务转型，并仍满足治理相关要求，如管理风险、安全顾虑、遵守法律法规要求。了解业务和治理驱动因素对风险评估的影响，这些影响源于在关键流程上实施区块链技术，同时确保业务/IT\
  \ 目标协调一致。应利用政策、标准和程序建立治理目标的绩效水平。 |\n\n\n\n\n\n### 第二阶段：我们现在处于什么位置？\n\n###### 持续改进\
  \ (CI) 任务\n\n*评估当前状态：*\n\n1. 确立 I&T 对企业实施区块链目标的贡献重要性。\n2. 识别实施区块链后，当前及未来解决方案相关的治理问题和弱点。\n\
  3. 识别并选择治理和管理目标以实施区块链。\n4. 评估实施过程中产生的价值实现、实施项目交付和运营风险。\n5. 识别目标以确保实施风险被规避，或风险接受立场已被定义。\n\
  6. 定义执行评估的方法，并记录对当前管理和治理目标如何应对实践的理解。\n\n###### 变革赋能 (CE) 任务\n\n*组建区块链实施团队：*\n\n\
  1. 从业务和 IT 部门组建一支拥有扎实知识、经验、公信力和权威以实施区块链的团队。团队成员可包括区块链架构师、区块链网络管理员、质量分析师、风险与合规、安全经理、CIO\
  \ 和治理委员会。\n2. 识别一名能够领导团队的区块链项目经理。\n3. 识别潜在的既得利益相关方以建立信任和适当的工作环境。\n4. 在团队内创建共同愿景，以授权实施区块链的变革。\n\
  \n###### 项目管理 (PM) 任务\n\n*定义问题和机会：*\n\n1. 审查并评估区块链用例、可行性及投资回报率 (ROI)。\n2. 向所有利益相关方分配角色和职责，并确保其承诺。\n\
  3. 识别执行这些任务时的挑战。\n\n###### 输入\n\n1. 区块链业务大纲。\n2. 高层角色和职责。\n3. 项目启动沟通。\n4. IT 流程描述、策略和标准。\n\
  5. BC 实施的 BCP、影响分析、法规要求、SLA 和 OLA。\n6. 审计报告、风险管理策略、绩效报告。\n\n###### 输出\n\n1. 经商定的对齐目标及对\
  \ I&T 的影响。\n2. 当前绩效水平和能力水平。\n3. 风险接受立场和风险概况。\n4. 实施团队的组建。\n5. 经评估的区块链用例。\n6. 对实施导致的问题和挑战的理解。\n\
