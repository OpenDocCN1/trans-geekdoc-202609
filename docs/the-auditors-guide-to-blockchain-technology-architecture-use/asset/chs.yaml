  \n# 2 区块链架构、组件与考量因素\n\nAafreen Fathima Altaf Hussain, Temitope Ipentan, Mahakpreet\
  \ Singh and Grace Moyo Adeyemi\n\n\n\n\n\nDOI: [10.1201/9781003211723-2](http://doi.org/10.1201/9781003211723-2)\n\
  \n## 摘要\n\n本章是三章中的第二章，旨在使读者熟悉与区块链相关的基础知识和组件。虽然第 1 章向读者介绍了区块链的基础概念、历史以及一些基本属性，但本章旨在提供关于区块链组件和基础概念的更详细信息；特别是涉及其加密安全属性和机制方面的内容。\n\
  \n本章讨论的主题包括：\n\n*   区块链参与者和角色\n*   各类区块链的扩展讨论（公有/私有 vs 开放/封闭）\n*   共识算法\n*   加密和哈希属性及考量\n\
  *   默克尔树\n*   数字签名\n*   访问控制/身份管理/成员服务提供商考量\n*   加密钱包\n*   星际文件系统 (IPFS)\n*   智能合约基础\n\
  \n## 区块链参与者和角色\n\n参与者可被视为区块链网络中仅次于区块链本身的最重要组件。区块链参与者以各种身份相互交互，以帮助生成各种区块链交易 [49]。\n\
  \n参与者可分为三大类——个人、组织和系统。个人是拥有平台访问权限并使用区块链网络的可识别参与者群体。示例包括员工、教师、学生或组织的客户。组织确定业务战略、产品或服务以及区块链用例。个人根据组织的授权和业务指令代表组织行事。系统或设备是构成业务网络的技术要素，可被视为一种独立的个人参与者。这些系统是业务网络的代理，代表业务执行操作，并负责完成大部分所需工作。系统参与者值得单独看待，因为越来越多的系统是自主的，越来越多地依赖人工智能能力\
  \ [9]。\n\n下文将讨论区块链参与者和角色的更细粒度分类 [16]：\n\n*   **区块链用户** 是有权加入区块链网络并与其他区块链参与者执行交易的参与者。\n\
  *   **区块链处理节点** 也是区块链的用户，其主要功能是根据商定的共识机制验证交易并创建区块链区块。重要的是要注意，虽然所有区块链处理节点都是用户，但并非所有用户都是处理节点。\n\
  *   **监管者** 是拥有权力监督网络内交易以确保合规的权威区块链网络参与者，但可能无法执行交易。\n*   **区块链开发者** 是创建应用程序以使用户能够在区块链网络上执行交易的程序员。此类应用程序作为用户与区块链通信的接口。\n\
  *   **区块链网络管理员：** 每个运行在私有区块链网络上的业务都必须有一名网络管理员。在其监督角色中，区块链管理员有权在区块链网络上创建、监控和管理交易。\n\
  *   **证书颁发机构** 是管理访问“许可型”区块链或验证区块链平台上各种交易所需证书的实体。\n\n### 区块链类型\n\n#### 公有区块链\n\n\
  如果区块链可供任何希望使用该区块链平台的参与者访问，则称为“公有”区块链。由于公有区块链提供开放访问，因此无需受信任的第三方中央注册机构来提供访问控制服务 [10]。公有区块链允许参与者保持匿名和使用化名，这是确保各种交易机密性和安全性的重要隐私属性。然而，在公有区块链中执行和记录的交易相关信息可被所有区块链用户查看。\n\
  \n虽然不受限制的访问和参与者匿名性可能是某些区块链用例所期望的属性，但公有区块链往往会遇到与可扩展性和隐私相关的问题。\n\n*   **可扩展性和性能问题**：公有区块链的特性在于任何人都可以作为用户加入区块链平台，这与传统交易系统相比可能导致扩展问题和性能不佳。\n\
  *   **信息可见性和共享方面的隐私挑战**：在公有区块链中，缺乏访问控制机制。因此，此类公有区块链面临隐私问题 [55]。\n\n#### 私有区块链\n\n\
  私有区块链是一个仅向亲和群体、联盟或有需求在彼此间共享区块链账本的组织开放的平台 [10]。要成为私有区块链的一部分，需要获得当前参与者或网络管理员的授权。由于在授予访问权限前需要验证身份，因此参与者的真实身份是已知的。这些属性有利于对共享信息实现更好的安全性和控制功能。性能和可扩展性也更易于管理，因为区块链的规模可由发起组织控制\
  \ [55]。私有区块链的其他属性包括：\n\n*   **参与受限**：只有特定数量的参与者可以参与共识过程。\n*   **用户权限**：写入访问权限由组织提供，而读取访问权限则受到限制或公开可用\
  \ [35]。\n*   **需要访问管理**：访问控理由受信任的中央机构管理。\n\n不同角色在使用中可能需要不同级别的访问权限。例如，参与区块创建共识、读取或创建交易以及执行智能合约等活动，可能需要根据不同权限集对参与者进行授权。因此，可能需要中央机构或群体来执行审查和批准流程\
  \ [24]。\n\n### 开放与封闭区块链\n\n除了私有和公有的区别外，区块链还可进一步细分为“开放”或“封闭”。在开放区块链中，任何用户都可以读取存储的数据，而在封闭区块链中，只有获许可的个人才拥有读取权限。\n\
  \n*   **公有且开放的平台**：公有且开放的平台授予任何人访问权和读取已写入数据的权利，因为不存在用户访问限制。公有/开放区块链的一个例子是比特币。\n\
  *   **公有且封闭的平台**：公有且封闭的平台允许任何人写入数据，但只有获许可的参与者可以读取区块链的数据。例如，在投票或竞选活动中，所有选民均可将其投票（写入）记录到区块链，但只有授权参与者——如投票箱创建者——才能访问（读取）投票或民调结果。\n\
  \n\n\n\n\n#### 私有与开放平台\n\n私有与开放平台允许所有人读取数据，但只有获许可的个人可以在私有与开放区块链上写入数据。它通常用于供应链场景，其中只有供应商可以将供应状态写入区块链，而任何私有区块链用户都可以监控存储在区块链上的状态和数据。\n\
  \n#### 私有与封闭平台\n\n私有与封闭平台仅授予认证成员区块链数据的读写权限，因为其中可能包含私密或敏感信息，例如健康相关、金融或敏感政府记录。\n\n\
  表 2.1 总结了各类区块链的读写权限。\n\n### 表 2.1 区块链类型间的读写权限\n\n| 公有与开放 | 公有与封闭 |\n| --- | ---\
  \ |\n| 所有人可读取数据。所有人可写入数据。示例：加密货币平台、博彩或视频游戏。 | 仅允许的参与者可读取数据。所有人可写入数据。示例：投票平台/记录或举报平台。\
  \ |\n\n| 私有与开放 | 私有与封闭 |\n| --- | --- |\n| 所有人可读取数据。仅管理员可写入数据。示例：供应链监控，如沃尔玛的 DL\
  \ Asset Track。 | 仅允许的参与者可读取数据。仅允许的参与者可写入数据。示例：军事或执法用例及金融记录。 |\n\n#### 共识\n\n简单来说，“共识”是指“普遍达成的协议”。与其通用含义相似，区块链的共识机制是整个系统的核心。共识驱动区块链应用基础设施，并管理处理节点间交易的信任以及整体区块链技术\
  \ [[10]](#ch10.xhtml#r053)，[[79]](#ch10.xhtml#r122)。它帮助处理节点维护区块链交易数据的一致性，并确保区块链副本包含相同的信息\
  \ [[38]](#ch10.xhtml#r081)。\n\n### 共识算法\n\n区块链网络采用多种算法。这些算法决定了区块链的速度、可靠性和可扩展性。这些算法包括但不限于以下内容：\n\
  \n#### 工作量证明\n\n**工作量证明** 是第一个，也是所有共识模型中最安全、最受信任的。它稳定且具有确保交易链不间断的强大能力。工作量证明的概念简单来说是：在处理节点能将交易添加到区块链网络之前，该节点必须证明它已经完成了一些工作，这主要包括利用算力解决数学难题。解决这些难题始终很困难，但验证其他处理节点完成的工作相对容易。PoW\
  \ 依赖于在提出接受值之前对已消耗资源的证明 [[15]](#ch10.xhtml#r058)。工作量证明是一个难以解决的问题，因为如前所述，它需要解决一个数学难题，这在图\
  \ 2.1 中有进一步解释。简而言之，PoW 类似于试图用一盒各式钥匙中的钥匙打开一扇锁着的门；然而，一旦通过试错过程找到了能开门的钥匙，其他人就很容易确认开锁所需的钥匙。\n\
  \n![Figure 2.1 Illustration explaining a nonce derivation for PoW.](img/9781032078243_C002_001.jpg)\n\
  \n**图 2.1** 解释 PoW 的 nonce 派生过程。\n\n基于哈希要求派生 nonce 值是工作量证明共识算法的基础。进一步解释，nonce 应产生一个在开头带有规定数量零的哈希输出（例如：四个零）。工作的难度在于派生\
  \ nonce 值有多难，而验证则相对容易，因为结果透明且易于被其他节点验证。然而，这一过程并不会让区块在添加到区块链后变得更安全。该算法的一个主要缺点是能源消耗率增加，对环境和交易验证时间产生不利影响。区块链网络中的这一验证过程需要多台服务器验证区块链上的交易；例如，进行支付的用户和接收支付的用户。据称，验证交易过程中的高能耗高达许多小国的总能耗\
  \ [[83]](#ch10.xhtml#r126)。该算法在小型公有区块链中也极易受到攻击 [[50]](#ch10.xhtml#r093)。\n\n图 2.1\
  \ 展示了 nonce 与生成哈希之间的直接关系。可以看出，虽然找到正确的 nonce 非常困难（解谜的唯一策略是试错过程），但只需输入派生出的 nonce 即可轻松确认和验证哈希，只需确认所需的哈希结果（要求前四位数字为零）。\n\
  \n#### 权益证明\n\n**权益证明** 是指一种负责证明节点在系统中拥有足够权益的机制。权益证明算法的创建是为了解决工作量证明算法的一些感知不足。权益证明算法通过要求验证者（矿工）质押加密货币作为参与前提，然后允许验证者向区块链网络添加区块以赚取交易费来运作。如果不诚实的验证者将无效交易添加到区块链网络，其质押的权益将作为惩罚而损失。权益证明作为工作量证明算法的一种替代方案\
  \ [[79]](#ch10.xhtml#r122)。与工作量证明算法不同，PoS 的能源效率显著更高。然而，持币较少的人可能无法频繁参与区块创建过程。换句话说，在网络中持有的权益越高，被选中在网络中验证区块的概率就越高\
  \ [[15]](#ch10.xhtml#r058)。\n\n#### 委托权益证明\n\n**委托权益证明** 算法是权益证明算法的进阶形式。详细来说，持有代币的参与者可以为“生产者”投票，得票最高的生产者将被允许生产区块。委托权益证明比权益证明更具优势，因为它确保了参与者与生产者之间的关注点分离，并确保网络内的适当治理\
  \ [[50]](#ch10.xhtml#r093)。委托权益证明高度依赖于区块链投票社区中的活跃用户 [[79]](#ch10.xhtml#r122)。\n\n\
  #### 燃烧证明\n\n**燃烧证明** 常用于启动新项目时，以维持初始代币分配的公平性。燃烧证明是工作量证明算法的一种替代方案，但不浪费能源。将原生货币或另一条区块链的货币发送到一个钱包地址。然后区块链矿工可以获得其所在区块链等量的货币\
  \ [[27]](#ch10.xhtml#r070)。\n\n#### 经过时间证明\n\n**经过时间证明** 算法利用可信执行环境，通过保证的等待时间提供随机性和安全性。节点根据自上次获得创建区块机会以来等待了多久来被允许验证交易\
  \ [[79]](#ch10.xhtml#r122)。经过时间证明依赖于一种称为软件保护扩展 (SGX) 的专用硬件，它允许应用程序在受保护的运行时环境中运行可信代码。它支持用户级代码分配飞地（内存私有区域），并保护这些代码免受高权限进程的侵害。\n\
  \n\n\n\n\n### 共识机制\n\n#### Proof of Importance (PoI)\n\n与权益证明算法不同，PoI 不仅依赖用户在区块链网络中的质押量。相反，它通过密切监控代币的流动和使用情况来建立信任和重要性。因为它决定了网络中哪些节点有资格向区块链添加新区块，所以它与权益证明非常相似。然而，重要性证明还通过使用图论来确定每个节点的评级，从而考虑节点的重要性\
  \ [79]。\n\n#### Proof of Storage (PoS)\n\n存储证明机制衍生出了多种变体，如空间证明、时空证明、复制证明等。它允许将存储容量外包作为参与网络的条件\
  \ [15]。\n\n#### Proof of Authority (PoA)\n\n权威证明主要设计用于许可网络，根据验证者在区块链中的声誉和身份来选择交易验证者。有意向的验证者必须提供必要的文件以披露其身份和声誉\
  \ [50]。\n\n#### Proof of Activity (PoACT)\n\n活动证明通过结合工作量证明和权益证明算法，以统一但伪随机的方式选择利益相关者，以实现最大安全性。这种混合组合也确保了能源效率。\n\
  \n#### Proof of Deposit (PoD)\n\n存款证明简单指其他想要参与区块链的节点所作支付的证据 [8]。存款证明支付被称为保证金，在任何节点创建新区块之前需要缴纳\
  \ [3]。\n\n#### Ordering-based Consensus (OBC)\n\n基于排序的共识与权威证明概念相似，因为基于排序的共识机制也主要用于许可网络。然而，它根据节点的身份服务来选择参与网络的节点\
  \ [21]。身份服务指一种系统，其中处理节点因作为经过验证机构的成员而被识别并被视为可靠。\n\n#### Proof of Capacity (PoC)\n\
  \n容量证明也称为硬盘挖矿，因为它利用硬盘空间进行挖矿。PoC 是一种共识机制，允许网络中的处理节点验证交易，并根据可用硬盘空间确定挖矿权利。拥有更多闲置硬盘空间的节点可以挖掘可用的加密货币\
  \ [13]。\n\n#### Practical Byzantine Fault Tolerance (PBFT)\n\n实用拜占庭容错最早由 Miguel\
  \ Castro 和 Barbara Liskov 提出，旨在通过投票机制在分布式系统中实现共识，如果状态发生变化，则提供安全性和活性 [63]。然而，由于需要发送的消息数量会随着网络增长呈指数级增加，因此它不可扩展。该算法适用于异步系统（如互联网），并对系统进行优化，使其更高效、更有效\
  \ [21]。\n\n最大消息数计算如下：\n\n```\nM = 1 + 3F + 3F + (2F) (3F + 1) + 3F + 1\n```\n\n\
  ```\nF = (n - 1) / 3\n```\n\n其中：\n\n- `M` = 最大消息数\n- `F` = 最大允许故障节点数\n- `N` = 活跃共识节点数\n\
  \nPBFT 应与企业组织联盟一起使用，其中每个组织代表网络上的一个节点。在 PBFT 中，区块创建者可能不是任何特殊矿工，但提交给链的提议区块将是最受认可的区块\
  \ [47]。\n\n#### Simplified Byzantine Fault Tolerance (SBFT)\n\n简化拜占庭容错是对实用拜占庭容错\
  \ (PBFT) 的改进。它所需的消息量约为 PBFT 的三分之一，并能更快地达成共识——通常在 0.2 秒内。SBFT 共识中的每个节点都可以自主行动，无需与其他节点通信\
  \ [62]。\n\nSBFT 的消息计数计算如下：\n\n```\nM = (3f + 1) (2f + 1) + 1\n```\n\n其中：\n\n- `M`\
  \ = 最大消息数\n- `F` = 允许故障节点数\n\n#### Delegated Byzantine Fault Tolerance (DBFT)\n\n\
  委托拜占庭容错由一种名为 NEO 的加密货币推广。它使用“记账人”——一组节点——通过代理投票达成共识，以在网络中生成更多区块。通过代理达成共识是指一种机制，其中被选为发言人的记账人提议其区块进行验证。发言人随后将区块发送给网络中的其他代表，以确认该区块有效。当三分之二的代表确认其有效性时，该区块将被添加到网络中。一旦共识确认，极少被撤销。交易生成速度也非常高——约每秒\
  \ 1,000 笔交易 [63]。\n\n其容错计算如下：\n\n```\nF = (n - 1) / 3\n```\n\n其中：\n\n- `F` = 允许故障节点数\n\
  \n#### Federated Byzantine Fault Tolerance\n\n联邦拜占庭容错用于国家间的关键金融交易。该协议中的节点保留一组公开受信的对等节点，并仅传播那些由最受信任节点验证的交易\
  \ [13]。\n\n## 密码学入门\n\n密码学是在第三方（称为对手）存在的情况下保护信息的科学。密码学的主要目标是通过提供机密性、完整性、认证和抗抵赖性来确保数据安全\
  \ [11]。如果双方（Alice 和 Bob）想要通信，Alice（此处称为发送者）使用不安全的通信信道向接收者 Bob 发送消息。该信道可以是计算机网络或电话线。如果消息包含机密信息，它可能被窃听者拦截并读取，或者更糟，消息可能被对手篡改，而\
  \ Bob（接收者）可能无法检测到这种操纵。密码学的目标之一是提供防止此类攻击发生的方法。\n\n读者应熟悉以下密码学相关术语和概念：\n\n- **Cryptosystem（密码系统）**：指加密和解密过程中所用密钥及技术的完整规范\
  \ [49]。\n- **Cryptoanalysis（密码分析）**：攻击者试图破解密码系统时使用的技术。成功的攻击可能从密文中恢复明文（或部分明文），然后用原始消息的部分内容替换，或伪造数字签名。Cryptology（密码学）常被用作指代密码分析的通用术语\
  \ [49]。\n- **Confidentiality（机密性）**：只有拥有密钥的人才能访问消息。如果消息在传输过程中被拦截，应受到保护，不被未授权方访问。机密性可使用高级加密标准\
  \ (AES) 和 RC4 等算法实现 [37]。\n- **Data integrity（数据完整性）**：消息接收者应能确认消息在传输过程中未被损坏、更改或截断，无论是故意还是意外。任何人都不应能用虚假消息更改原始消息或其部分内容。\n\
  - **Data authentication（数据认证）**：消息的来源应可由接收者验证。不应有人冒充发送者 (Alice) 向接收者 (Bob) 发送消息。发送者和接收者在发起通信时应能相互识别（实体认证）。消息认证码\
  \ (MAC) 算法可用于实现数据完整性和认证 [37]。\n\n\n\n\n\n### 不可抵赖性\n\n发送方事后不应否认发送过该消息。应确保消息的来源无法被否认。\n\
  \n### 分组密码与流密码\n\n**分组密码与流密码**是密码系统的组成部分。在分组密码中，明文被分割成称为“分组”的固定块。分组是一串比特，具有固定长度。此外，加密和解密是一次一个分组地进行的。相反，流密码密码系统使用密钥流构建其密钥，加密过程从明文和密钥流构造密文，解密则使用密文和密钥流进行\
  \ [73]。\n\n现代密码学的两大主要类别是对称密码学和非对称密码学。\n\n#### 对称密码学\n\n**对称密码学**为受信任的各方提供了一个秘密通信通道。假设\
  \ Alice 和 Bob 已商定一个密钥。稍后当 Alice 和 Bob 决定互发秘密消息时，该密钥被用于将消息转换为无密钥无法处理的乱码形式。原始消息通常称为“明文”，而乱码消息称为“密文”。此过程称为“加密”。Bob\
  \ 接收密文并使用密钥将其转换回明文的过程称为“解密” [68]。在对称加密中，通信双方使用单个密钥来加密明文和解密密文，且双方均知晓该密钥。加密和解密算法是公开的。因此，必须妥善保管密钥。对称密码学的主要问题是密钥分发问题。密钥分发必须在信息传输之前完成。因此，通信双方（Alice\
  \ 和 Bob）之间需要一个秘密通道以及身份认证来分发密钥材料。\n\n##### 对称密码学算法\n\n###### 高级加密标准 (AES)\n\n**高级加密标准\
  \ (AES)** 于 1998 年由美国国家标准与技术研究院 (NIST) 推荐作为易受攻击的数据加密标准 (DES) 的替代品。AES 是一种对称分组密码，使用\
  \ 128、192 和 256 位的可变密钥长度。如果密钥长度和分组长度均为 126 位，AES 将执行 9 轮处理；如果密钥和分组长度为 192 位，则执行\
  \ 11 轮处理。\n\n如果密钥和分组长度均为 256 位，AES 将执行 13 轮处理 [2]。\n\n处理轮涉及四个步骤：\n\n1.  **字节代换**\
  \ – 在此步骤中，使用 S 盒执行逐字节替换。\n2.  **行移位** – 执行简单置换。\n3.  **列混淆** – 一种替换方法，将行移位步骤中每列的数据与矩阵算法相乘。\n\
  4.  **轮密钥加** – 将轮密钥与数据进行异或运算。\n\n###### Blowfish\n\n**Blowfish** 是 Bruce Schneider\
  \ 于 1993 年设计的一种算法。它是一种 64 位分组密码，密钥长度可变，范围从 32 位（4 字节）到 448 位（56 字节）。它是现有所有加密算法中最高效的算法\
  \ [22]。Blowfish 算法包含两个步骤 [2]：\n\n1.  **密钥扩展** – 密钥扩展步骤将 448 位转换为 4168 字节。P 数组包含\
  \ 18 个 32 位子密钥。有四个 32 位 S 盒，每个均包含 256 个条目。\n2.  **数据加密** – 数据加密使用异或运算完成。总共执行 16\
  \ 轮数据加密。\n\n###### RC4\n\n**RC4** 是由 Ronald Rivest 开发的一种对称算法。RC4 的密钥长度可变，范围从 1 到\
  \ 256 字节。RC4 算法涉及两个阶段，即密钥生成和加密。由加密密钥生成的可变加密使用两个数组（状态数组和密钥数组）及合并操作结果。生成伪随机字节以产生密钥流，该密钥流通过异或运算实现密文与明文的相互转换。异或是一种用于比较两个二进制位的逻辑运算。若两者有显著差异，则产生值\
  \ 1；若两位相等，则结果为 0 [22]。\n\n对称密钥算法的各种优缺点及其应用总结见 表 2.2。\n\n##### 对称算法比较\n\n表 2.2 对称算法比较\n\
