  \n本阶段实施拟议的区块链解决方案。这应通过日常活动以及建立措施来完成，以确保业务目标与区块链实施流程保持一致，并对其绩效进行衡量。\n\n区块链在核心持续改进周期中实施，变更响应计划也随之实施。在区块链解决方案实施期间，对团队进行指导和辅导对于实现对愿景的承诺非常重要。\n\
  \n如果已达到目标，最初设定的区块链需求和目标应予以修订和分析。通过提高意识、参与、沟通以及管理层对区块链实施愿景的承诺来维持成功（参见表 11.9 和表 11.10）。\n\
