  \ 3. 管理层在董事会监督下，为追求目标而建立结构、汇报路线以及适当的权限和责任。 | 区块链可能是一种有助于促进有效控制环境的工具（例如，通过极少的人工干预记录交易）。然而，该组成部分中的许多原则主要涉及人类行为，例如管理层倡导诚信和道德，即使有其他技术，区块链也无法对此进行评估。更大的\
  \ | 应在适当的时候充分利用区块链技术固有的属性，如其不可篡改性和溯源性，以进一步促进组织对诚信和道德价值观的承诺。 *涉及运营风险 — 见 [表 12.1]*\
  \ *---------------------------------------------* 组织应致力于招聘和留住高素质的区块链专业人员，包括区块链解决方案架构师、区块链应用开发人员，以及区块链安全与保障专家。招聘流程\
  \ |\n| | 4. 组织表现出致力于吸引、培养和留住与目标相一致的胜任人员。 5. 组织要求个人对其在追求目标过程中的内部控制责任负责。 | 挑战在于参与区块链的其他实体或人员之间的流程交织，以及如何因此管理控制环境。\
  \ | 应包含确保被录用人员不仅具备所需的区块链相关技能，而且认同组织道德价值观和未来愿景的流程。 *涉及应用开发风险 — 见 [表 12.1]* *-------------------------------------------*\
  \ 与所有其他组织职位一样，每个区块链职位必须包含一份精确的责任和权限清单，而这反过来应作为区块链专业人员年度绩效考核的指标。每个区块链职位还必须明确指出，在实现预期的区块链相关组织目标时，区块链专家将以何种方式被追责。\
  \ *涉及运营风险 — 见 [表 12.1]* |\n| 风险评估 | 6. 组织以足够的清晰度规定目标，以便识别和评估与目标相关的风险。 7. 组织识别整个实体范围内对目标实现构成的风险，并分析风险作为确定风险应如何管理的基础。\
  \ 8. 组织在评估目标实现风险时，考虑舞弊的可能性。 | 区块链创造了新的风险，同时通过促进问责制、维护记录完整性和提供不可反驳的记录（即个人或组织无法否认或争辩其授权/发送消息或记录的角色），有助于缓解现有风险。\
  \ | 组织应为每个预期的区块链应用开发一份全面的区块链用例。用例应包括项目的预期目标、架构考量，以及初步的用例风险评估。 *涉及运营风险 — 见 [表 12.1]*\
  \ *---------------------------------------------* 在初步风险评估之后，区块链项目应接受频繁的（年度）风险评估，以确定其潜在的风险脆弱性。\
  \ |\n\n\n\n\n\n## 结论与建议\n\n在本章中，我们讨论了各种区块链风险。读者应注意，本章的风险讨论绝非全面，因为我们面对的是一项快速发展的技术，目前正通过大量用例进行试验。采用新技术总伴随着对未知威胁的担忧。区块链技术创建了不可篡改的交易审计追踪，并提高了实体的效率。除了收益之外，区块链技术也带来了众多风险。为了应对这些风险，企业应考虑建立稳健的风险管理策略、治理和控制框架。主要风险包括以下几点：\n\
  \n*   **账本透明度风险**：区块链最重要且最有用的属性之一，是该技术能够通过其各种加密和控制机制提供的透明度程度。尽管如此，这种账本透明度也可能转化为若干风险。\n\
  *   **安全风险**：分布式账本技术虽以安全性卓著称，但并非 100% 万无一失。区块链需要采取预防措施，以在风险较低的情况下安全运行。\n*   **运营风险**：运营风险是指因内部流程、人员或系统控制缺陷或不足，甚至重大外部事件而导致的潜在损失。\n\
  *   **应用开发风险**：将区块链实施到新技术（如物联网和人工智能）中时，未知的开发风险也会随之出现。\n\n---\n\n### 风险评估与变更控制（原则\
  \ 9）\n\n持续的区块链风险评估还必须考虑区块链相关的欺诈风险。欺诈风险是指为获取经济利益而故意滥用该技术。欺诈风险适用于内部和外部攻击。 *[与安全风险相关\
  \ – 见表 12.1]*\n\n作为风险管理流程的一部分，组织还必须实施有效的变更控制流程，以帮助确保所有区块链相关变更均经 IT 指导委员会妥善批准，且所有变更均有完善文档记录。\
  \ *[与运营和安全风险相关 – 见表 12.1]*\n\n### 控制活动（原则 10–12）\n\n区块链可作为一种工具，帮助促进控制活动。区块链和智能合约可以成为高效、有效开展全球业务的有力手段（例如，通过最大限度地减少人为错误和欺诈机会）。然而，区块链的协作特性可能引入额外的复杂性，特别是在技术去中心化、且无单一责任方对内部财务报告控制（ICFR）范围内的系统负责时。\n\
  \n区块链平台必须具备适当的内部控制机制，以帮助确保每个组织区块链通过有效且高效地实现其预期目标来提供“价值”。根据 COBIT 2019，“价值”可定义为在优化风险和资源利用的同时，为组织提供最大预期收益（COBIT\
  \ 讨论见第 11 章）。 *[与运营风险相关 – 见表 12.1]*\n\n组织必须确保其通用 IT 控制（如防火墙、入侵检测和/或防御技术、身份管理工具等）已妥善实施并正常运行，以便实施适当的区块链专用安全控制。\
  \ *[与安全风险相关 – 见表 12.1]*\n\n必须制定适当的区块链相关政策和程序并定期审查，以帮助确保通过相关控制的相关且有效实施，使区块链充分安全且正常运行。\
  \ *[与安全风险相关 – 见表 12.1]*\n\n### 信息与沟通（原则 13–15）\n\n区块链的固有属性促进了交易的增强可见性和数据的可用性，并能为管理层创造新途径，以更快、更有效的方式向关键利益相关者传达财务信息。管理层在应用区块链时需考虑的一个方面是：支持财务账簿和记录的信息是否可用，以及区块链上交易信息的相关可审计性。\n\
  \n组织应致力于利用其区块链技术，在适当的情况下，进一步改善与内部和外部利益相关方的数据和信息流动。 *[与运营和合规风险相关 – 见表 12.1]*\n\n\
  具体而言，为确保区块链相关控制正常运行而设定的目标和分配的职责，必须通过自上而下和自下而上的管理方法，有效传达给员工以及内部和外部审计职能部门等。 *[与运营和合规风险相关\
  \ – 见表 12.1]*\n\n### 监控活动（原则 16–17）\n\n区块链承诺能更频繁地、针对更多主题、以更详细的方式促进监控，这可能会大幅改变实践。结合物联网设备使用智能合约和标准化业务规则，可能会改变监控的执行方式。\n\
  \n组织应致力于通过使用区块链组件——如智能合约、区块链的各种固有加密工具，以及区块链连接物联网接口设备的能力——来优化和自动化区块链相关的监控活动。 *[与运营和安全风险相关\
  \ – 见表 12.1]*\n\n内部和/或外部审计职能部门应旨在制定有效的审计方法，以协助检测和报告各种区块链相关缺陷及相关建议。这将有助于迅速解决这些缺陷。\
  \ *[与运营、安全和合规风险相关 – 见表 12.1]*\n\n\n\n\n\n## 加密货币与支付风险\n\n所有加密货币作为价值存储手段的当前不稳定性和波动性，是新加密货币项目的重大风险。\n\
  \n## 监管合规风险\n\n作为一种仍处于起步阶段的发展中技术，影响区块链用例的监管要求在未来几十年将不断演变。因此，审计专业人员需要随时掌握未来的监管授令、变更和/或更新。\n\
  \n本章还重点关注四项不同的监管要求——PCI-DSS、HIPAA、GDPR、PIPEDA——以及区块链如何帮助强制执行或遵守这些法规。在区块链实现中，每项监管要求的处理方式各不相同。例如，PCI-DSS\
  \ 利用非对称加密密钥，GDPR 要求实施智能合约，而 PIPEDA 和 HIPAA 分别使用可信第三方 (TTP) 和点对点网络。\n\n除此之外，本章还介绍了若干映射至\
  \ COSO 框架的实践，用于高效管理和开发组织的各种内部控制机制，以实现其预期目标并改善绩效。\n\n## 深入理解练习\n\n从互联网上下载并研读德勤的《区块链与内部控制》文档（使用\
  \ Google 搜索引擎定位该文档）。\n\n1. 如果您的组织已采用 COSO 治理模型并有意采用区块链技术，通过研读该文档您能获得哪些额外的关键要点？\n\
  \n2. 对《区块链与内部控制》文档的回顾，以何种方式帮助您更好地理解本章讨论的拟议 COSO 风险框架？\n\n3. 如果在考虑区块链用例或区块链审计计划，本章讨论的\
  \ 17 种风险以何种方式影响或塑造您的区块链风险评估？\n\n## 参考文献\n\n* Advise Tech. (2021). 3 Major Provisions.\
