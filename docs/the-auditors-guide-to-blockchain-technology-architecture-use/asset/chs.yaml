  \n\n\n\n\n## 加密货币与支付风险\n\n*   **加密货币估值与波动性**\n*   **缺乏中介机构在资金转账丢失时提供客户支持**\n\n##\
  \ 监管合规风险\n\n*   **新法律及/或现有法规的更新或扩展可能导致合规风险。**\n\n## 账本透明度风险\n\n区块链最重要且最有用的属性之一，是该技术能够通过其各种加密和控制机制提供的透明度程度。尽管如此，这种账本透明度也可能转化为以下多种风险：\n\
  \n*   **违反数据隐私**：分布式账本的透明度特性与数据隐私之间存在内在冲突。在区块链上披露私人数据极有可能违反相关司法管辖区的数据隐私法律。违反数据隐私法律的处罚在某些司法管辖区比在其他地区更为严厉。因此，使用区块链的实体需要仔细评估其数据保护责任，以保持对各种适用隐私法律的合规性。\n\
  \n*   **内幕交易与市场滥用**：如果区块链被用于存储机密的市场相关信息，可能会助长多种金融犯罪——包括内幕交易、抢先交易、泄露内幕消息和市场操纵。欧洲证券和市场管理局（ESMA）担心区块链的共享和公开特性可能会鼓励金融市场操纵和其他不公平行为。\n\
  \n*   **身份盗窃**：尽管透明度在确保数据完整性方面很有用，但账本透明度也引入了身份盗窃的威胁。具体而言，如果仅需要私钥即可转移资产，且没有中央账本机构可在接到故障通知后冻结访问权限，那么私钥本身就会成为非法活动的目标\
  \ [23]。\n\n## 区块链安全风险\n\n维护系统的机密性、完整性和可用性（CIA 三要素）是信息技术的一大关注点。鉴于区块链技术的高关注度，必须采取预防措施，为参与企业确保一个更安全的平台。区块链安全风险包括：\n\
  \n*   **数据错误/员工安全风险**：尽管本质上是去中心化的，区块链仍需要一定的人工交互以产生准确结果。例如，使用区块链系统的企业会使用由员工操作的服务器或自动化系统。此类系统受密码保护；因此，用户凭证可能被窃取或泄露。其他与员工相关的风险包括疏忽、欺诈，或因区块链安全操作员因缺勤等情况无法履行职责而导致的安全问题。此外，某些数据完整性问题（如欺诈性或被篡改的输入数据）可能在区块创建共识过程中未被标记，从而被原样存储，导致后续的数据完整性问题或攻击。\n\
  \n*   **黑客风险**：恶意攻击者能够发起多种区块链相关攻击，涉及静态数据、传输中数据或端点钱包攻击。第 13 章和第 14 章详细讨论了主要的区块链和智能合约攻击。第\
  \ 3 章讨论了加密钱包的特性、优势和漏洞。\n\n*   **供应商与供应链安全风险**：第三方实体通常提供供应商解决方案，如支付处理、智能合约、钱包等。此类第三方创建的工具和平台可能存在各种漏洞，如未经测试或薄弱的代码、不充分的安全性或软件缺陷\
  \ [12, 19]。\n\n### 运营风险\n\n运营风险是指因内部流程、人员、系统控制缺陷或不适当，甚至重大外部事件而导致的潜在损失。显然，重大运营故障也可能导致严重的安全漏洞和/或企业的重大声誉损失。与区块链相关的运营风险包括：\n\
  \n*   **代码缺陷**：一旦代码错误被部署到区块链平台上，该错误可能会传播到整个网络节点。完美的代码极其罕见；因此，错误或漏洞将始终对应用程序的性能或安全性产生负面影响。正如第\
  \ 14 章所讨论的，代码缺陷应被视为智能合约开发和实施中的主要运营（也是安全）风险。\n\n*   **关键人员风险**：在任何商业组织中，都有了解软件代码结构的关键人物或专家。作为普通人，这些关键人物可能会生病、疲劳、精神不稳或被腐蚀。无论原因如何，如果对关键人物的信任被打破，账本的安全性和可靠性将面临风险\
  \ [23]。\n\n*   **灾难恢复/业务连续性风险**：由于技术的分布式特性带来的内置冗余，区块链技术具有灵活性。然而，围绕区块链构建的某些业务流程可能存在漏洞，从而导致网络攻击。为降低此类风险，企业需要将适当的区块链相关事件响应考量纳入其灾难恢复和业务连续性计划中。\n\
  \n*   **智能合约风险**：部署在区块链网络上的智能合约将以一致的方式向网络参与者应用规则和程序。智能合约有潜力用于在区块链网络上编码复杂的商业、法律和金融安排。当将这些安排从物理框架映射到数字框架时，可能会出现多种安全风险。因此，智能合约必须具备异常处理能力。在区块链框架上以编程输出形式实施的异常处理的后果，必须针对网络内所有其他智能合约在全球范围内进行测试。第\
  \ 14 章详细讨论了智能合约漏洞和攻击 [6]。\n\n*   **区块链共识风险**：`consensus` 机制作为分布式系统的骨干。特别是，当多个节点或进程就数据项或状态达成一致时，共识机制即适用。区块的形成发生在分布在全球的数千台计算机达成协议时\
  \ [19]。还必须注意，分布式共识协议（如工作量证明）提供的是概率性最终性。概率性最终性是指随着交易后区块链上新增区块的增加，交易的确定性也随之增加 [3]。\n\
  \n共识适用于节点必须维护数据项通用状态的情况。在 `permissionless` 区块链中，节点大多是匿名的。有时，有效交易与无效交易不匹配，导致 `fork`（分叉）。区块链分叉是由软件协议的变更引起的——如添加新的篡改交易区块。表\
  \ 12.2 描述了分布式基础设施中与共识相关的风险 [4]。\n\n### 表 12.2 分布式基础设施中的共识风险\n\n| **风险** | **描述**\
  \ |\n| --- | --- |\n| **崩溃故障** | 进程或系统中途以不可逆方式停止的风险。 |\n| **遗漏故障** | 遗漏风险因多种原因发生，如缓冲区溢出、发射机故障、MAC\
  \ 层冲突、接收机超出范围（影响和传输缺陷）。 |\n\n\n\n\n\n| **安全故障** | | | 安全攻击后发生安全故障的风险。共识信息可能因安全故障而损坏。\
  \ |\n| **软件故障** | | | 软件设计和建模缺陷引入了软件故障风险。此外，崩溃或遗漏风险等其他风险也可能由此类故障引发。 |\n| **拜占庭故障**\
  \ | | | 需要共识的系统中发生故障的风险，该故障可能针对不同的系统参与者表现为不同的症状或问题。拜占庭故障可能导致检测系统失灵，从而降低容错能力。 |\n\
  | **时间故障** | | | 因未能在截止时间前完成而产生的时间风险。可能会生成正确的结果，但延迟会导致结果过时，从而变得毫无用处。 |\n| **环境扰动**\
  \ | | | 因无法响应环境变化而产生的风险。结果是，正确的结果可能失去其相关性。环境参数示例包括一天中的时间、网络拓扑、用户需求等。预计分布式系统能适应环境。\
  \ |\n\n## 区块链应用开发风险\n\n这类风险源于区块链技术仍处于起步阶段，因此仍属于“进行中的工作”。因此，区块链应用开发风险值得特别关注。第 8 章、第\
  \ 9 章 和 第 10 章 更详细地讨论了区块链应用设计、开发和测试的考量因素。区块链开发风险包括：\n\n*   **区块链协议难以集成**：根据德勤的报告，在项目中实施区块链协议面临一些重大挑战。例如，`Hyperledger\
  \ Fabric` 和 `Ethereum` 的集成可能存在问题，因为 `Hyperledger Fabric 协议` 和 `Ethereum 协议` 之间应存在一个集成层以促进信息共享。然而，在两个不同的企业系统之间实施集成层可能是一项具有挑战性的任务\
  \ [6]。\n\n*   **缺乏标准化**：当一种技术拥有多种多样的框架时，会导致缺乏标准化。目前，所有区块链平台——包括加密货币平台——都饱受缺乏标准化之苦\
  \ [12]。\n\n*   **区块链人才稀缺**：根据 *Janco Associates* 2019 年新就业市场报告，大量区块链职位空缺。区块链开发人员的薪资范围为\
  \ 119,000 美元至 176,000 美元。据 *Januaitis* 称，“2019 年将创造 96,000 个新 IT 职位，区块链将占这些职位的 5%\
  \ 至 8%”。LinkedIn 也将区块链开发确定为排名第一的 IT 新兴职位。据 KPMG 美国区块链负责人 Arun Ghosh 称，“区块链相关职位发布突然增加的原因之一是，许多企业项目正从\
  \ 2017 年的概念验证转向 2018 年的试点，再到今年的生产系统” [16]。\n\n## 加密货币与支付考量\n\n*   **加密货币估值虚高**：目前加密货币估值呈现剧烈的价格波动，反映了当前的投资者心理，因为越来越多的实体和投资者将加密货币作为另类资产类别。这种当前的加密货币定价不稳定性和波动性是新加密货币项目面临的最重大风险之一\
  \ [12]。\n\n*   **缺乏提供网络级客户支持的中介机构**：正如前几章所讨论的，在大多数公共区块链网络中，没有网络级客户支持来解决“转账丢失”支付（错误发出或接收的付款）问题。\n\
  \n## 区块链监管合规风险\n\n影响区块链用例的监管要求将在未来几十年内不断演变。因此，审计专业人员需要及时了解未来的监管授令、变更和/或更新。不确定的 IT\
  \ 监管环境带来了其自身的区块链用例挑战和风险。下一节讨论四项可能适用于区块链用例的主要监管授令。\n\n## 监管合规考量\n\n监管要求是指组织强制遵守与其业务流程相关的法律、法规、指南和规范。违反监管合规通常会导致法律制裁，其中可能包括巨额罚款。本章讨论四项重要的监管要求，包括\
  \ `支付卡行业数据安全标准 (PCI DSS)`、`健康保险流通与责任法案 (HIPAA)`、`通用数据保护条例 (GDPR)` 和 `个人信息保护和电子文档法案\
  \ (PIPEDA)` [18]。\n\n### 支付卡行业数据安全标准\n\n任何涉及以现金支付交易商品和服务的业务都需要拥有安全的信任链。系统中的每位客户都相信其用户数据被安全地使用和存储。因此，为了维护客户信任和安全控制，防止安全漏洞和信用卡欺诈，大多数支付卡网络运营商于\
  \ 2004 年共同成立了 `支付卡行业安全标准委员会 (PCI SSC)`。随后，`PCI DSS` 标准于 2004 年 12 月 15 日发布 [15]。\n\
  \n根据该标准，遵循一套标准化的实践和安全措施来保护信用卡持卡人的数据。此外，用户数据由服务提供商和商户监管。例如，每当客户和商户之间发生购买行为时，零售商都需要存储支付卡信息和交易数据，并通过网络将其发送给发卡行。同时，将数据保留在商户的基础设施中，并通过网络传输至发卡行进行认证，会增加网络安全漏洞的可能性。此类漏洞会严重影响持卡人、商户和发卡行。\n\
  \n为克服此类问题，`PCI DSS` 实施了 12 项主要安全要求，分为六大类 [15]：\n\n1.  **构建并维护安全网络**\n\n    *   通过安装和维护防火墙配置来保护持卡人数据。\n\
  \    *   更新供应商提供的默认密码，因为攻击者可轻松访问这些密码。\n\n2.  **保护持卡人数据**\n\n    *   存储在商户基础设施中的持卡人数据需要受到保护。\n\
  \    *   通过公共网络传输给发卡行的持卡人数据需要加密。\n\n3.  **维护漏洞管理计划**\n\n    *   使用病毒定义已更新的防病毒软件。\n\
  \    *   在系统和应用程序周围开发并维护安全环境。\n\n4.  **实施强访问控制措施**\n\n    *   只有业务需要才应有权访问持卡人数据。\n\
  \    *   每个获得计算机访问权限的个人都必须获得唯一 ID。\n    *   必须限制对持卡人数据服务器的物理访问。\n\n5.  **定期监控和测试网络**\n\
  \n    *   所有对持卡人数据的访问都需要被全程跟踪和监控。\n    *   所有安全程序应在系统和流程中定期测试。\n\n6.  **维护信息安全政策**\n\
  \n    *   必须为员工和承包商制定针对信息安全的政策。\n\n#### 与支付卡处理相关的区块链考量\n\n\n\n\n\n##### 支付卡交易身份验证\n\
  \n在任何支付卡交易中，最关键的步骤涉及持卡人的识别。持卡人的识别和授权需要一个多步骤的过程，涉及多个第三方实体。因此，私有区块链中使用了一种默认的数字身份验证技术，称为\
  \ `public-key cryptography`（公钥加密）。数字签名用于公钥加密中以验证个人身份，表明个人是否拥有签署数字资产的正确密钥，并证明其真实性。\n\
  \n在验证过程中，涉及两个基本密钥：`public`（公钥）和 `private`（私钥）密钥。持卡人使用私钥——该密钥保密（如信用卡 PIN 码）。公钥的作用是从数学上验证与私钥相关的交易，证明使用私钥生成的签名。\n\
  \n###### 使用公钥识别所有者的步骤\n\n1.  持卡人在购买产品时，提交卡片进行支付，并借助私钥（PIN 码）签名，从而生成一个数字令牌。\n2. \
  \ 为了验证过程，公钥和数字令牌被发送给商户的银行。\n3.  公钥和私钥共同帮助商户的银行验证数字令牌 [[11]](#ch20.xhtml#r434)。\n\
  \n第 2 章更详细地讨论了各种加密概念。\n\n### 健康保险流通与责任法案\n\n为确保医疗记录的机密性并提高医疗服务质量，美国国会于 1996 年颁布了一项名为\
  \ `Health Insurance Portability and Accountability Act (HIPAA)`（健康保险流通与责任法案）的法案\
  \ [[23]](#ch20.xhtml#r446)。该法案针对医疗服务，将患者信息的保护置于至关重要的地位。总体而言，由于持续的数据传输使其容易遭受攻击，医疗行业的信息安全面临挑战。因此，区块链技术可以帮助保护患者信息。\n\
  \n《健康保险流通与责任法案》的重要条款包括：\n\n1.  **流通性**：流通性条款提供可获得且可续保的健康保障，并在规定准则内，为转换雇主资助健康计划的个人取消了预先存在条款的限制。\n\
  2.  **医疗补助诚信计划/欺诈与滥用**：医疗补助诚信计划 (MIP) 为医疗保险和医疗补助服务中心 (CMS) 的诚信计划确保了资金来源，并扩展了其聘请反欺诈承包商的权力。\n\
  3.  **行政简化**：在行政简化标准中，交易和代码集、标识符、安全和隐私规则在整个医疗行业中得到实施 [[1]](#ch20.xhtml#r424)。\n\n\
  #### 与 HIPAA 相关的区块链考量\n\n当信息存储在单个服务器或实体上时，传统的信息所有权方式仍然适用。这与区块链技术的典型属性形成对比，后者通常提倡数据对公众公开。此外，区块链可能由多个实体控制，这作为一种验证存储信息未被篡改状态的方式。此外，通过网络上其他计算机提供的加密算法进行加密和验证，将交易数据区块添加到链中。\n\
  \n如果网络上大多数节点达成共识，则该区块被视为有效。这种共识导致新区块被添加到链中，随后在整个网络中更新。由于区块链通常设置为去中心化网络，它们作为一种安全机制，确保区块链数据不被操纵或破坏。区块链上的交易是安全的、可信的、可审计的和不可变的。如果考虑\
  \ 51% 攻击场景，区块链若在单一实体系统下运行，篡改数据将变得简单得多。\n\n区块链不仅因为去中心化而成为可靠工具，还可以提供访问控制，以确保其区块中包含的信息不被泄露。区块链不仅仅关注单一的去中心化技术，还结合了加密算法、数学和经济模型，并与点对点网络协作，共同协助保护数据安全\
  \ [[5]](#ch20.xhtml#r428)。尽管如此，在考虑与健康信息相关的区块链用例时，必须极其强调对适当且高效的访问控制、加密以及合规要求的需求。\n\
  \n### 通用数据保护条例\n\n2018 年 5 月，基于 `1995 Data Protection Directive`（1995 年数据保护指令），`General\
  \ Data Protection Regulation Act`（通用数据保护条例）在欧盟 (EU) 生效。GDPR 通过一项法案实现了两个目标：即欧盟成员国之间个人数据的自由流动，以及基于《基本权利宪章》第\
  \ 8 条规定的数据保护权，建立基本权利保护框架 [[9]](#ch20.xhtml#r432)。\n\nGDPR 规定了以下七项主要原则 [[2]](#ch20.xhtml#r425)：\n\
  \n*   **合法性、公平性和透明度**：当组织收集数据时，必须说明收集这些数据的原因以及将在何处处理。为使个人数据处理合法，需要指定称为“合法依据”的处理基本规则。个人数据处理必须始终公平且合法。透明度与公平性的根本性相关联。数据处理应对相关人员清晰、公开且诚实。\n\
  *   **目的限制**：个人数据的使用应受到限制，并为特定目的进行处理。换句话说，个人应知晓其数据将如何以及为何目的被处理。\n*   **数据最小化**：为实现特定目的，仅应使用完成特定任务所需的最少量数据。根据\
  \ GDPR，个人有权*更新*不足以实现目的的不完整数据。个人还可以基于*被遗忘权*，在任何想要删除数据时要求删除数据。\n*   **准确性**：个人有权要求在\
  \ 30 天内清除或更正不完整数据。\n    *   为维护准确性，应考虑以下事项：\n        *   为确保数据准确，应考虑采取合理步骤。\n  \
  \      *   个人数据的来源和状态应合法。\n        *   考虑是否有必要定期更新信息。\n        *   为确保数据准确，仔细考虑任何质疑。\n\
  *   **存储限制**：合法公平收集的个人数据，如果未在指定时间范围内处理，不得存储不确定的时期。存储未使用的数据可能会产生风险。\n*   **完整性和保密性**：薄弱的信息安全使组织系统和服务面临风险。提供完整性和保密性的安全措施应寻求确保以下几点：\n\
  \    *   数据仅可由授权个人访问、更改、删除。\n    *   数据应就数据处理而言保持准确性和完整性。\n    *   数据应保持可访问和可用（即，如果个人数据发生任何情况，如篡改或删除，组织应能恢复并还原原始数据）。\n\
  *   **问责制**：如果个人数据发生任何情况，控制者必须负责。问责制是组织展示对个人数据尊重的机会。\n\n\n\n\n\n#### 区块链在 GDPR 中的考量\n\
  \n由于区块链中加密技术的实施，医疗系统中的数据泄露可以被预防，或至少大幅减少。智能合约可在多机构环境下作为电子病历（EMR）的记录管理系统实施。该实施结果证明，区块链能够通过提供用户保留数据源指针的解决方案，确保个人数据的高可用性和完全控制权。个人数据的访问和进一步处理可通过分布式账本技术由第三方进行管理。提供给数据主体的私钥可基于类别对用户数据实施针对第三方的访问控制。多层系统提供了对个人数据更多的控制。用户与服务提供方或购买方之间的数据交换存储在智能合约中，访问层作为区块链与离线存储之间的连接。以下框架将使用户能够控制并拥有个人数据，而服务提供方则是拥有委托权限的“客人”。用户仅更改权限集，通过实施变更即可授予对相应数据的访问权限。在最后一步，仅当个人数据经由特定可信机构（如政府）验证后——这些机构可验证个人数据——该数据的哈希值才会存储在哈希存储层中。在持续进行的过程中，已验证数据的哈希值被存储在区块链上\
  \ [[9]](#ch20.xhtml#r432)。\n\n### 个人信息保护和电子文档法案\n\n为保护私营部门组织内的个人信息，加拿大于 2001 年通过了一项联邦法律——PIPEDA，并于\
  \ 2004 年 1 月 1 日全面实施。为根据 PIPEDA 保护信息，企业必须遵循以下十项公平原则 [[8]](#ch20.xhtml#r431)，[[20]](#ch20.xhtml#r443)：\n\
  \n*   **问责制**：组织负责保护个人的个人信息，并应指定一名对组织合规性负责的个人。首席隐私官将处理围绕这些数据的政策和程序相关的问题与关切。\n* \
  \  **明确目的**：收集信息的目的应在收集时界定。组织应制定目的声明。\n*   **同意**：必须在收集信息时获得个人的知情或同意。经同意的使用将避免未来可能出现的问题。\n\
  *   **限制收集**：为特定目的收集的信息应仅用于该既定目的。误导或欺骗个人是不可接受的。\n*   **限制使用、披露和保留个人信息**：组织应仅将信息用于最初收集时的特定目的，且一旦特定用途结束，必须销毁该信息。\n\
  *   **准确性**：个人的信息应准确、完整且最新。\n*   **安全保障**：组织应负责保护个人信息免遭丢失、盗窃和未经授权的访问。必须与有权访问信息的第三方签署保密协议。\n\
  *   **公开性**：组织的隐私政策应随时可供任何人查阅。\n*   **个人访问**：个人有权知晓其数据如何被访问、使用和披露。\n*   **质疑合规性**：个人应能通过组织的首席隐私官解决任何关于合规性的质疑。\n\
  \n#### 区块链在 PIPEDA 中的考量\n\n可见性是公有区块链的关键特性之一，它允许所有人查看区块链上的信息。由于 PIPEDA 法案侧重于隐私权，公有区块链的基本属性（即可见性）使其难以满足数据主体在使用、披露、收集和同意方面的权利。\n\
  \n解决上述问题的方法是使用加密技术（详见第 2 章），通过匿名化区块链上个人的身份来保护用户的隐私权，即将所有个人身份信息存储在链下，以保护公有区块链上的私人信息。\n\
  \n以下方法通过将数据访问限制为仅限所需的`可信第三方 (TTP)`来提供隐私保护。存储在链上的个人信息需要由可信第三方对该交易详情进行哈希处理并存储在链上。在哈希过程中，观察者无法从交易本身收集个人信息。然而，上述过程要求交易双方均验证链上数据的哈希值，并将其与链下记录进行匹配。通过以下方法，公有区块链能够保持交易详情的私密性\
  \ [[8]](#ch20.xhtml#r431)。\n\n## COSO 框架\n\n1985 年，`特雷德韦委员会赞助组织委员会` (COSO) 成立，旨在赞助国家舞弊财务报告委员会，由`美国会计协会\
  \ (AAA)`、`美国注册会计师协会 (AICPA)`、`财务主管国际协会 (FEI)`、`内部审计师协会 (IIA)` 和 `美国会计师协会`（现`管理会计师协会\
  \ (IMA)`）共同赞助。\n\nCOSO 框架的关键目标是高效、有效地开发和管理内部控制机制，在应对市场和运营环境变化的同时，提高实现组织目标的可能性。更新框架的目标是增强其在日益复杂和全球化的商业环境中的相关性，使全球组织能够更好地设计、实施和评估内部控制。COSO\
  \ 框架为组织提供了显著收益，例如：增加了对控制措施将风险降至可接受水平的信心，以及支持合理决策的可靠信息。\n\nCOSO 的关键目标是为三个相互关联的主题提供思想领导力：企业风险管理\
  \ (ERM)、内部控制和舞弊威慑。内部控制是由组织的董事会、管理层和员工执行的一个过程，旨在为实现与运营、报告和合规相关的目标提供合理保证。\n\n根据 COSO，内部控制的目标包括运营目标（确保实体运营的有效性和效率）、财务报告目标和合规目标。\n\
  \nCOSO 框架由以下五个组成部分构成：\n\n*   **控制环境**：控制环境下描述了一套标准、流程和结构，为在整个组织中实施内部控制提供了基础。良好的控制环境为内部和外部利益相关者提供可靠的财务报告，并有助于确保道德行为。\n\
  *   **风险评估**：在实现实体目标的过程中，组织将面临众多内部和外部风险。风险评估要求一个动态且迭代的过程，用于在组织环境中识别和评估风险。风险评估要求管理层考虑内外部环境可能变化的影响，并采取必要行动以管理潜在影响。\n\
  \n\n\n\n\n### 控制活动\n控制活动在政策、程序和标准中进行描述，这些文件帮助各级管理层缓解已识别的风险，以实现组织目标。控制活动的性质可以是预防性的，也可以是检查性的，具体取决于环境。\n\
  \n### 信息与沟通\n实体在履行职责和执行目标时，需要适当的信息流。管理层利用来自内部和外部来源的重要信息，以支持内部环境中其他组成部分的运作，而沟通则是分享必要信息所必需的。\n\
  \n### 监控活动\n监控活动是独立的、持续的评估，旨在核实内部控制的五个组成部分，包括影响每个组成部分内原则的控制措施。持续评估建立在实体不同层级的业务流程之上，能提供及时信息。独立评估则根据风险评估的结果定期进行\
  \ [17]。\n\n表 12.3 列出了 COSO 内部控制的五个组成部分，并细分为十七项原则 [17]。\n\n表 12.3 内部控制的五个组成部分与十七项原则\n\
  \n| **组成部分** | **原则** |\n| --- | --- |\n| **控制环境** | 1. 表现出对诚信和道德价值观的承诺。 2. 行使监督责任。\
  \ 3. 建立结构、权限和责任。 4. 表现出对胜任能力的承诺。 5. 强制问责 |\n| **风险评估** | 6. 明确合适的目标。 7. 识别和分析风险。\
  \ 8. 评估舞弊风险。 9. 识别和分析重大变化。 |\n| **控制活动** | 10. 选择和开发控制活动。 11. 选择和开发针对技术的通用控制。 12.\
  \ 通过政策和程序部署控制活动。 |\n| **信息与沟通** | 13. 使用相关信息。 14. 内部沟通。 15. 外部沟通 |\n| **监控活动** |\
  \ 16. 实施持续和/或独立评估。 17. 评估并沟通缺陷。 |\n\n## 基于 COSO 的区块链良好实践建议清单\n\n表 12.4 中呈现的拟议区块链相关良好实践清单，是基于\
  \ COSO 的原则以及 COSO 近期发布的指导文件《区块链与内部控制》编制而成的。\n\n表 12.4 推荐的区块链良好实践\n\n| **COSO 组成部分**\
