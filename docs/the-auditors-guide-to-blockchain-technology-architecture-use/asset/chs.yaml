  \n# 3 区块链代币与加密货币\n\nLavanya Vaddi, Jaskaran Singh Chana and Gurjot Singh Kocher\n\
  \nDOI: [10.1201/9781003211723-3](http://doi.org/10.1201/9781003211723-3)\n\n## 摘要\n\
  \n\n\n\n\n## 区块链治理与分叉\n\n本书前三章旨在为读者提供对区块链技术各种属性和组件的基本理解。对于许多公有区块链实现而言，代币或加密货币的使用构成了一大优势。因此，本章旨在首先让读者熟悉各种区块链治理类型及考量因素，以便解释区块链中“分叉”的概念。同样重要的是要注意，永久性或硬性区块链分叉往往会导致一种新型加密货币的诞生。本章提供了此类事件的若干示例。\n\
  \n本章还讨论了各种区块链代币类型，如权益型代币和实用型代币，以及当前的代币标准，如 `ERC 20`、`223` 和 `721`。本章最后一个主要部分为读者概述了一些更流行的加密货币类型，如\
  \ `Bitcoin`、`Ether`、`Ripple`、`Litecoin` 和 `Monero` 等。最后，还简要讨论了一些主要的当前加密货币交易平台，如\
  \ `Bittrex`、`Coinbase` 和 `Bitfinex`。\n\n正如章节中所述，截至 2020 年 2 月，已创建近 5,400 种加密货币，总市值超过\
  \ 2 亿美元。尽管目前市场上大多数加密货币的长期表现和可持续性仍高度不确定，但审计师和有志于成为区块链专业人士的人士熟悉本章讨论的较流行加密货币的基本属性非常重要。\n\
  \n### 区块链治理\n\n正如前几章所讨论的，区块链技术在满足客户需求方面为其提供了重要的优势和控制权。组织治理被定义为组织据以达成并实施与追求其目标相关决策的制度。治理结构被所有参与者或用户所接受并遵循。尽管治理机构通常具有中心化性质，但区块链是一个点对点的去中心化系统，会随着时间的推移和需求不断演进。\n\
  \n区块链治理是区块链适应不断变化的环境和需求的制度。适应性和可升级性构成了区块链治理的关键特征。广义上讲，区块链治理通常涉及以下四个核心主体：\n\n*  \
  \ **核心开发者** 负责维护支持区块链的基础代码。\n*   **节点运营商** 是持有区块链完整记录副本的一组运营商。代码开发者依赖节点运营商接受他们提供的功能。节点运营商做出与在节点上实施代码开发者提供的功能相关的决策。\n\
  *   **代币持有者** 包括区块链代币的客户/用户。投资者构成了这一利益相关者群体的主要部分，他们拥有就功能实施、升级等进行投票的权利。\n*   **区块链团队**\
  \ 由主要负责筹资和项目开发任务的公司或非政府组织（NGO）组成。这些团队主要由投资者和支持者组成，他们与节点运营商和代码开发者就区块链的运行进行协商 [[31]](#ch11.xhtml#r158)。\n\
  \n#### 流行的区块链治理策略\n\n**链下治理** 在用户、矿工和组织之间保持平衡。该治理体系具有中心化性质，由开发区块链的核心各方做出各种治理相关决策。未参与区块链核心开发的各方缺乏做出治理相关决策的知识和专长；因此，该技术遵循直接治理方法，即每个人对每项决策直接投票。`Bitcoin`\
  \ 和 `Ethereum` 是这些治理技术的示例。为了弥补链下治理的缺点，后来开发了链上治理系统中讨论的新技术。\n\n**终身仁慈独裁者** 是最简单的治理策略，其中单个人（原始创建者/首席开发者）的垄断地位在区块链治理决策方面占据主导地位，例如\
  \ `Ethereum` 的创建者 `Vitalik Buterin`。\n\n**核心开发团队治理** 常用于最著名的核心开发者负责做出决策和区块链结构规划的情况。尽管任何客户都有权请求功能，但最终决定权仍掌握在核心开发者手中。\n\
  \n**开放治理** 是 `Hyperledger` 和 `Corda` 采用的一种技术，其中团队由客户社区通过民主方式共同选举产生。该当选团队负责做出各种区块链治理相关决策。\n\
  \n**链上治理** 可能在基于区块链的系统中更受青睐，以帮助确保没有用户或用户群体能够将其意志强加于区块链。用户之间的交互规则在此类治理中被定义。交互完全基于区块链基础设施的规则，称为“代码即规则”。规则集可以分层，一个规则集可以作为其他规则的基础。当规则和决策过程被编码进区块链系统的基础设施中时，该治理模型被称为链上治理。在链上治理中，共识通过直接投票方案达成。投票结果按算法计算并根据区块链协议运行\
  \ [[28]](#ch11.xhtml#r155)。不需要节点用户的参与，因为该过程遵循链上流程。这导致决策更加有效，从而降低了硬分叉的可能性。链上治理也存在一些挑战，如可扩展性。随着区块链网络的持续增长，以有效且高效的方式执行治理规则将变得越来越困难\
  \ [[31]](#ch11.xhtml#r158)。\n\n### 区块链分叉\n\n区块链分叉可能对加密货币产生重大影响。事实上，永久性分叉可能成为新加密货币诞生的原因。例如，2017\
  \ 年 8 月，`Bitcoin` 社区出现分歧，导致 `Bitcoin` 区块链上发生 `Bitcoin Cash` 分叉。2016 年 7 月，`Ethereum`\
  \ 社区的大部分成员作为对 `DAO` 攻击的回应修改了共识规则，导致出现两条链和两种加密货币；一种是 `Ethereum Classic`，另一种是 `Ether`。分叉可被定义为共识规则的修改，这可能导致也可能不导致区块链网络分裂和新版本区块链的出现。去中心化是区块链的显著特征之一。区块链分叉是去中心化的含义之一（图\
  \ 3.1）[[33]](#ch11.xhtml#r160)。\n\n![图 3.1 区块链分叉示意图。](img/9781032078243_C003_001.jpg)\n\
  \n图 3.1 区块链分叉示意图。\n\n#### 分叉发生的原因\n\n由于部分用户对现有区块链存在分歧，区块链分裂为不同的实例。偶尔，当不同时间生成不同区块时，会观察到短期的不确定性。其他时候，则表现为共识规则的修改，这可能导致区块链的新版本出现。分叉可能为新型攻击铺平道路，并通过跨链分析威胁数据保护。总体而言，任何后续分叉都会损害信任并引发不确定性\
  \ [[33]](#ch11.xhtml#r160)。\n\n#### 分叉的类型\n\n\n\n\n\n### 区块链分叉\n\n区块链分叉主要分为两类：基于过程的分叉和基于协议的分叉。由于分叉是指网络中存在两条或多条活跃链的状态，许多分叉会产生即时影响并迅速消失，而有些分叉则会永久分裂。随着共识规则的变更，旧版区块链的部分追随者会决定坚持使用原版本，而另一些则选择升级到新版本；因此，区块链发生分裂，产生该区块链的两个版本。如果区块具有相同的接受集，且网络状态由共识相关资源的分配决定，则该分叉称为基于过程的分叉。接受集是指区块获批以便追加到区块链的标准。\n\
  \n当新区块的接受标准出现差异时，会产生基于协议的分叉。这些差异是由共识规则集的变更引起的。如果两个或多个共识相关节点同时发现新区块，基于过程的分叉属于非故意分叉。这被称为概率区块竞争，该状况会在短时间内得到解决。故意造成的基于过程的分叉则稍微复杂且难以解决。当共识相关节点在掌握新区块存在信息的情况下成功创建新区块时，就会出现这种现象。这种现象称为\
  \ `selfish mining`（自私挖矿）。基于过程的分叉可能导致主导版本中的交易被记录或完全删除。如果系统中存在漏洞，基于协议的分叉也可能非故意地出现。如果用户账户存在漏洞，区块可能会即使被其他用户拒绝的情况下仍被追加到区块链，从而导致新区块链的创建。如果部分用户选择修改规则集并继续使用新版本的协议，则会出现故意的协议分叉。如前所述，这在许多情况下会导致新加密货币的产生。\n\
  \n`Persistence analysis`（持久性分析）是指尽管因分叉而解体，区块链依然存在并保持连续性的特性。基于过程的分叉的持久性分析及结果取决于共识相关资源的分配和区块传播速度。基于协议的分叉的持久性分析及结果则额外取决于协议的变更。\n\
  \n基于协议的分叉分为三类：软分叉、硬分叉和强制分叉。\n\n##### 硬分叉\n\n`Hard forks`（硬分叉）与软分叉相反。接受区块的规则变得更宽松。这就是为什么使用新协议生成的区块通常会被旧协议实现拒绝的原因。\n\
  \n##### 软分叉\n\n`A soft fork`（软分叉）被描述为共识协议的修改，其中规则集变得更严格。符合新协议的区块肯定会被旧协议实现批准。\n\n\
  ##### 强制分叉\n\n`A forced fork`（强制分叉）将导致链分裂。新旧规则完全不同。强制分叉的特定风险在于，新区块将仅被客户端的一个子群批准\
  \ [[33]](#ch11.xhtml#r160)。\n\n#### The DAO 攻击事件\n\n2016 年左右，一个名为 DAO 的去中心化自治组织部署在以太坊上。最初，DAO\
  \ 获得了可观的众筹资金；发布 28 天内筹集的以太币约合 1.5 亿美元。其市值很快达到 10 亿美元。从结构上看，它拥有一个基于代码的内部资本 DAO；一个自主运行的系统，依赖用户执行其无法自行完成的任务。与此同时，管理\
  \ DAO 的智能合约中的漏洞被攻击者利用，约 30% 的资金被盗。攻击者执行了多笔提款交易，并将资金转移到另一个 DAO 中。\n\n针对攻击的应对提案被提交出来，建议冻结\
  \ DAO 及其子 DAO（由攻击者创建）中的以太币。其他提案包括硬分叉并将资金转移到新的 DAO。在这些讨论中，攻击者发布了一封公开信，称根据 DAO 智能合约中的原则代码法律，以太币是合法获取的。最终，由于并非所有人都达成一致，宣布了一个有争议的以太坊硬分叉，诞生了两条链：以太坊和以太坊经典。由于主要利益相关者跟随了该变更，分叉成功\
  \ [[29]](#ch11.xhtml#r156)。\n\n攻击者创建的子 DAO 被称为 `dark DAO`（黑暗 DAO），尽管大部分资金被追回，攻击者仍净赚约\
  \ 850 万美元 [[8]](#ch11.xhtml#r135)。\n\n## 区块链中的代币\n\n代币由各种加密货币发行，可被视为具有一定价值的单位。代币在验证区块的激励、区块链平台的使用等方面有许多用例。它们也用于代表资产所有权或利润分享等\
  \ [[24]](#ch11.xhtml#r151)。\n\n表 3.1 展示了代币就其角色、目的和益处而言的优势。\n\n表 3.1 加密代币用途与价值快速指南\n\
  \n| 代币可扮演的角色 | 目的 | 提供的益处 |\n| --- | --- | --- |\n| 权利 | 引导参与 | 产品使用、投票、治理、所有权、贡献\
  \ |\n| 价值交换 | 经济创造 | 工作奖励、购买、消费 |\n| 通行费 | 利益相关 | 运行智能合约、安全押金、使用费 |\n| 功能 | 丰富用户体验\
  \ | 加入网络、与用户连接、使用激励 |\n| 货币 | 无摩擦交易 | 支付单位、交易单位 |\n| 收益 | 分配利益 | 利润分享、福利分享、通胀收益\
  \ |\n\n### 代币类型\n\n代币是以太坊上去中心化网络中受智能合约约束的可编程资源 [[10]](#ch11.xhtml#r137)。这些也可被视为价值隔间，用于将资源的责任转移给同一区块链上的其他节点监管者\
  \ [[24]](#ch11.xhtml#r151)。`initial coin offering`（ICO，首次代币发行）是一种通过网络上众多资助者的大量小额捐款为任务筹集资产的技术。这是一种新数字货币起步的方式。ICO\
  \ 考虑了大量协议以在可用区块链上创建代币 [[25]](#ch11.xhtml#r152)。加密代币和加密货币的主要区别在于，货币拥有自己的区块链，而代币没有。代币建立在现有区块链之上\
  \ [[10]](#ch11.xhtml#r137)。广义上讲，加密货币代币可根据其覆盖的领域分为五种不同类型 [[4]](#ch11.xhtml#r131)。\n\
  \n*   **Security tokens**（证券型代币）是具有内在价值的资源或资产的组成部分。例如，由英国皇家造币厂的黄金储备支持，并与芝加哥商品交易所合作，利用两家初创公司以\
  \ `Royal Mint Gold`（皇家造币厂黄金）代币进行交易的区块链技术，开发了一种新的黄金支持加密货币。单个皇家造币厂黄金代币在数字上代表 1 克真实黄金。用户可在机构平台上购买和交易代币，所有交易均记录在区块链上\
  \ [[12]](#ch11.xhtml#r139)。\n\n\n\n\n\n### 代币类型\n\n*   **支付代币**负责提供支付服务。这些代币通常基于信用卡信息生成，以防止第三方攻击。例如，Ripple\
  \ 和效用结算币（UTC）被视为支付代币。人们设计了各种算法来生成支付代币，如数学可逆算法、静态表或单向不可逆加密函数。\n\n*   **通用平台代币**允许客户创建“应用”，并在满足特定原则时自动化交换。这些代币用于购买各类商品的平台，如服装、音乐会门票、书籍等。[10]。\n\
  \n*   **权益代币**被定义为参与清算和行使可行权利（如分红和投票）的数字化凭证。权益代币将股份的有益权益授予代币持有者，该权益可在无需股份正式权利人批准的情况下转让给任何其他用户[17]。证券代币兼具同质化和非同质化代币的属性。涉及的代币标准为\
  \ `ERC-1400`、`R-token`[25]。\n\n*   **效用代币**将对服务的数字化控制权分配给持有者。如果代币在接收时即处于工作状态，则无需任何背书[10]。持有效用代币的客户将有权利用企业规定的各种功能来交换代币[25]。效用代币负责提供对服务或产品的访问权限。例如\
  \ `Filecoin` 和 `Golem`。\n\n### 代币标准\n\n以太坊中主要被接受的代币标准包括 `ERC-20`、`ERC-721`、`ERC-777`\
  \ 和 `ERC-1155`。\n\n#### ERC-20\n\n**ERC-20** 截至撰写本文时是唯一被广泛接受的 ERC 标准。ERC-20 是支持代币转账主要功能的常规标准。ERC-20\
  \ 授予代币权限，随后可由链上的第三方用户使用。ERC-20 是一种协议接口，要求通过 API 实现六个强制函数、三个可选函数和两个事件[10]。ERC-20\
  \ 协议定义了一种转账方法，用于将代币从一个钱包转移到另一个钱包[34]。典型功能包括代币的交易、转账、共享和兑换。所有这些功能均通过函数的实现获得，利用智能合约模拟数字代币[21]。事件是用于追踪代币的日志。这六个函数为\
  \ `total supply`、`balance of`、`transfer`、`transfer from`、`approve` 和 `allowance`；两个事件为：`transfer`\
  \ 和 `approval`。最初，去中心化应用（DApps）拥有各自的代币标准。后来，随着 ERC-20 的推出，所有 DApps 都开始使用 ERC-20[25]。交易将调用转账方法的数据部分，其中包含转账金额和接收方钱包。ERC-20\
  \ 会导致代币余额更新，该余额存储在智能合约存储中。此外，转账方法后会跟随一个转账事件来保存日志。日志在以下部分进行解析：合约地址、数值、发送方和接收方地址。总体而言，ERC-20\
  \ 描述了代币相关的社会行为[34]。\n\n#### ERC-223\n\n**ERC-223** 与 ERC-20 向后兼容。ERC-223 是 ERC-20\
  \ 的改进版本，修正了其缺陷。ERC-20 标准的主要缺陷在于它无法支持某些代币接收机制。因此，引入了一个名为 `tokenFallBack` 的新函数[26]。\n\
  \n#### ERC-721\n\n**ERC-721** 是一种非同质化标准。在此标准下，每个代币都是特定的，并便于追踪不同的资产。这些代币由包含 10 个强制函数和\
  \ 3 个事件的智能合约控制[10]。如前所述，函数利用智能合约来实现数字代币的功能。强制函数命名为：`symbol`、`name`、`totalSupply`、`balanceOf`、`ownerOf`、`approve`、`takeOwnership`、`tokenOfOwnerByIndex`、`transfer`\
  \ 和 `tokenMetadata`。事件是用于追踪代币的日志[21]。共有三个事件，分别为 `Transfer`、`ApprovalForAll` 和 `Approval`。非同质化意味着代币是独一无二的，不能被另一物品替代。非同质化代币具有独特性。它们不能被分割成更小的部分，且不可互换[25]。ERC-721\
  \ 标准可用于检测近期流行的 *Deepfake*（深度伪造）视频。Deepfake 视频具有危害性，因为它们有能力制造虚假现实，从而误导观众。因此，识别和对抗\
  \ Deepfake 视频至关重要。为实现这一目标，必须为用户提供访问数字内容可信数据源头的权限。应当有可能追溯内容的真实性。利用区块链技术的真实性证明可为这一问题提供解决方案。通常，公有链更适合用于\
  \ Deepfake 场景[16]。NFT 提供数字证书作为所有权的标记，从而给出认证证明。NFT 不向购买者提供任何版权或原始副本，这也是 NFT 被视为拥有“炫耀权利”的原因[37]。\n\
  \n#### ERC-777 和 ERC-1155\n\n**ERC-777** 增加了许多先进功能，并与 ERC-20 标准向后兼容。需要实现 13 个 ERC-777\
  \ 强制函数和 5 个事件。**ERC-1155** 是一种多代币标准。各种标准的代币可在单个合约中一次性发送。它需要实现 6 个强制函数和 4 个事件[10]。ERC-1400\
  \ 是一种受限标准。ERC-777 属于部分同质化，不可交换[24]。\n\n## 以太坊 Gas 与 EIP 1559\n\n当涉及以太坊区块链平台时，为了有效处理交易或执行协议，会收取交易或处理费。此交易费被称为\
  \ **Gas**（燃料费）。\n\n以太坊一直在开发更有效的解决方案，以应对以太坊平台上急剧上涨的 Gas 费用。截至 2021 年，以太坊已实施其最新的 Gas\
  \ 相关协议，名为以太坊改进提案 1559（EIP 1559）[32]。EIP 1559 是一项与 Gas 相关的以太坊网络升级，它要求每次使用以太币支付 Gas\
  \ 费时，该部分以太币必须被销毁[13]。此外，以太坊网络为在该网络上完成的每笔交易设定了基础 Gas 费用，旨在为所有用户提供快捷服务[13]。希望比标准处理时间更快完成交易的客户，可为验证者添加\
  \ **小费** 以加速其交易。简单来说，这笔小费可视为餐厅中为获得快捷高效服务而给服务员的小费。Gas 与餐厅案例的主要区别在于，小费是在服务提供*之前*支付的。\n\
  \n## 区块链代币用例\n\n\n\n\n将敏感信息替换为代币（token）的过程称为代币化。信用卡的任何唯一信息，如主账号（`PAN`）、安全码、有效期等，均可进行代币化。要理解代币化的概念，涉及信用卡或借记卡的交易是很好的例子。每当个人刷借记卡或信用卡时，`PAN`\
  \ 都会通过生成随机字母数字 ID 进行代币化。这样，虽然有交易记录，但真实的 `PAN` 号码不会存储在系统中。该代币被发送给处理器，处理器在授权交易前会对该\
  \ ID 进行解码（detokenize）。就代币的有效性而言，它仅对特定个人有价值；因此，对任何第三方均无用处。\n\n区块链代币的用途涵盖赌博、游戏、忠诚度积分到各类市场等多个领域\
  \ [10]。此外，代币还应用于赌场筹码、文化活动中的饮料买卖、门禁审批和洗衣币 [24, 27]。以下是几个用例示例：\n\n*   **房地产资产**可利用基于区块链的代币进行代币化。2018\
  \ 年，总部位于纽约的资产管理公司**Elevated Returns** 首次实现了房地产代币化。该公司在以太坊区块链上发行了价值 1800 万美元的产品，对应科罗拉多州阿斯彭的一家度假村（St.\
  \ Regis）。最初计划将 50% 的度假村作为单一资产出售；但后来调整为通过代币销售出售 18.9% 的所有权。销售通过 **Indiegogo** 完成，**Templum\
  \ Markets LLP** 作为合作伙伴。\n\n*   **艺术品代币化**专注于为知名艺术家的艺术品生成代币。通常，特定机构负责有限数量印刷品的所有权；因此，这些限量印刷品可相应地进行代币化。下一步，公司向公众提供印刷品以换取代币。最后，在直接销售的情况下，一旦赎回所需数量的代币，印刷品将实物交付至邮寄地址。艺术品代币化还使个人能够与其他人共同拥有某幅画作的部分所有权。\n\
  \n*   **黄金资产代币化**以数字代币形式提供黄金的部分所有权。假设黄金由公司 A 拥有；存放黄金的金库由公司 B 拥有。A 与 B 之间维护一份合同，用于黄金所有权登记。每售出一个代币，公司\
  \ A 拥有的黄金所有权数量就会转移给金库公司 B。代币持有者可使用数字签名或证书证明其所有权以赎回黄金。摩根大通宣布将在其名为 **Quorum** 的区块链网络上对金条进行代币化。\n\
  \n*   **货物代币化**旨在消除因提单（`B/L`）问题导致的交付延迟或货物提取问题。进一步解释，若货物在运输过程中丢失或错放，`B/L` 可作为所有权证明。**CargoX**\
  \ 推出了一个基于以太坊的开放系统，称为 **Smart B/L**。最初承运人使用应用程序创建 Smart B/L，随后由出口商接收。当出口商收到付款时，进口商将\
  \ Smart B/L 代币的所有权转移给新的货物所有者。进口商可向承运人出示代币以主张货物所有权 [36]。\n\n## 加密货币\n\n截至 2020 年\
  \ 2 月，据报告加密货币用户总数达 1.06 亿。到 1 月，加密货币交易所注意到采用率增长了 15.7% [15]。截至 2020 年 4 月，约有 5,392\
  \ 种加密货币在交易，总市值达 2010 亿美元 [5]。根据来自 24 家不同交易所的数据，比特币价格飙升是用户数量增加的主要原因 [15]。所有加密货币都具备若干共同特征。这些特征分为两类：交易特征和货币特征。\n\
  \n加密货币的**交易特征**包括**不可逆性**，即交易一旦完成，永远无法撤销或更改。**匿名性**意味着加密货币账户与用户的实时个人信息无关。另一个属性是**安全性**，因为只有持有私钥的用户才能控制资金。最后一个属性是**无许可性**，因为加密货币平台确实是无许可的。任何人都可以免费下载并使用它们\
  \ [4]。\n\n加密货币还具备**货币特征**，如**控制货币供应的能力**。另一个重要区别在于：在银行账户中，法币代表资金托管人（银行）对账户持有者的债务；而加密货币代表其自身，因为它不使用任何金融中介\
  \ [4]。\n\n广义上讲，加密货币也可分为两大类：公有和私有。此分类基于可追踪性。进一步解释，**公有加密货币**提供用户匿名性，但交易易于追踪。**私有加密货币**提供隐私保护，使交易难以追踪。私有加密货币隐藏交易细节；这意味着虽然它们拥有公开账本，但关于发生的交易的信息会被稍作混淆，以保护最终用户的隐私。\n\
  \n顾名思义，**山寨币**被用作其他数字货币的替代品。绝大部分山寨币依赖于与比特币相同或相似的区块链创新，旨在改进某些特定的区块链属性 [30]。山寨币因分叉或\
  \ ICO 而演变 [9, 14]。\n\n加密货币在区块链去中心化网络中作为交换媒介发挥作用。溢出效应评估某一加密货币受到的单位冲击将如何影响其他加密货币的价格\
  \ [20, 22]。数字货币市场及其他货币市场中的溢出效应是待研究的主要课题。由于加密货币作为资产类别出现时间较短，关于加密货币多元化最佳实践、对冲策略及/或加密货币与股票、债券等其他传统资产类别相关性的研究尚不充分。加密货币目前是免税的法定货币；然而，这一免税趋势正日益遭到多个主要政府的反对\
  \ [19, 20]。\n\n### 流行的加密货币类型\n\n下一节讨论目前各交易所上一些更流行的加密货币。读者应注意，以下简短的加密货币讨论仅围绕有限数量的当前流行加密货币展开，绝非详尽无遗。\n\
  \n\n\n\n#### 加密货币概览\n\n##### 比特币\n*比特币*由中本聪于 2009 年创立。许多用户将其视为一种投资资产。作为一个无许可的数字现金系统，比特币存在交易费用。为了快速交易，交易费用较高。如果创建了一个新区块，矿工将获得奖励。比特币有时被称为通货紧缩货币。比特币供应量上限为\
  \ 2100 万枚。随着矿工创建更多区块，奖励也相应持续减少。由于 2017 年 8 月的一次分叉，比特币催生了*比特币现金* [4]。由于其平台安全性的记录以及过去十年价值的惊人飙升，比特币目前是最流行的加密货币形式\
  \ [3]。\n\n##### 以太币（以太坊）\n*以太币*是以太坊的数字货币。以太坊由出生于俄罗斯的加拿大人维塔利克·布特林于 2015 年构想。以太坊是一个平台，用户可在其上开发和执行称为*去中心化应用*（DApps）的应用程序\
  \ [4]。DApps 托管在以太坊上，可用于支付社交媒体、游戏和金融等服务。每个 DApp 都有不同的代币，可用以太币购买。*去中心化金融*，也称为*DeFi*，因以太坊而诞生。DeFi\
  \ 代币用于在以太坊上运行的智能合约上运行的协议中 [40]。撰写本文时，以太坊仅需 14 至 15 秒即可创建一个新区块，并计划在不久的将来进行重大性能改进。比特币和以太坊的一个主要区别在于，比特币专注于成为一种全球去中心化数字货币，而以太坊是一个去中心化计算平台。如前所述，由于\
  \ 2017 年发生分叉，以太坊平台分裂为两个：以太坊和以太坊经典。以太坊平台遵循点对点架构，从而实现高安全性和容错性 [4, 38]。\n\n##### IoTA\n\
  *IoTA*市值超过 140 亿美元。2017 年 12 月，IoTA 被认为是第六大数字货币。它使用*Tangle*，这是一种用于对交易进行分类的有向无环图。IoTA\
  \ 利用区块在必要时允许特定资金的交易。它还利用自主机器经济进行无手续费交易。可扩展性、去中心化和模块化是 IoTA 的其他一些特性 [14]。\n\n#####\
  \ 瑞波币\n*瑞波币*由瑞波公司于 2012 年创立。与比特币不同，瑞波币能够通过使用极少量的能量执行涉及高计算量的复杂区块生成任务。在区块创建方面，瑞波币目前比比特币快约\
  \ 1000%，比以太坊快 300%。瑞波币的交易成本相对较低。瑞波币使用*瑞波网*向供应商和银行传递支付信息 [3]。美国证券交易委员会（SEC）已对瑞波币及其两名员工提起诉讼，指控其通过未注册的证券发行筹集高达\
  \ 13 亿美元。撰写本文时，SEC 诉讼的状态仍未可知 [26]。\n\n##### 莱特币\n*莱特币*的开发旨在解决比特币的一些缺点。查理·李于 2011\
  \ 年 10 月创立了莱特币。莱特币用于降低币挖掘所需的算力。莱特币使用*Scrypt*算法作为其共识机制。莱特币创建区块的速度更快；其奖励计划在大约 4 年内达到\
  \ 8.4 亿莱特币时减半。与比特币相比，交易费用也低得多 [4]。\n\n##### 门罗币\n*门罗币*的主要目标是隐私和不可追踪性。它由尼古拉斯·范·萨伯哈根于\
  \ 2014 年 4 月设计。与比特币类似，交易费随交易货币而变化。门罗币的特性包括*环机密交易*（RingCT）、*隐形地址*和*环签名*。对于每笔交易，隐形地址确保发送者使用一次性地址。隐藏发送者和接收者身份的特性称为环签名。RingCT\
  \ 定义了在门罗币中隐藏交易金额的方式。RingCT 于 2017 年 1 月首次使用；随后，它成为每笔门罗币交易的强制要求。在门罗币中，交易无法被追踪。门罗币的主要优势是动态可扩展性\
  \ [4, 9]。\n\n##### 达世币\n*达世币*于 2014 年 1 月发布。它最初被称为*Xcoin*，后来品牌重塑为*Darkcoin*。其当前名称是\
  \ Digital 和 Cash 两个单词的混合组合而成的 Dash。作为山寨币的一种，它源自莱特币，而莱特币本身又是比特币的衍生品。达世币相对于比特币的主要优势在于，它提供了更完善的隐私保护，并能更快地处理商业交易。换句话说，它提供了一种成本更低、速度更快、隐私性更强且更安全的交易处理方式\
  \ [12, 14]。\n\n##### 恒星币\n*恒星币*由恒星发展基金会于 2014 年创建。恒星币的开发者是 Joyce Kim 和 Jed McCaleb，后者也是瑞波币的开发者之一。瑞波币使用拜占庭容错（BFT）算法进行交易。恒星币的货币称为*XLM*或*流明*。恒星币不使用矿工，并回收其交易费用。它还拥有一个分布式交易所\
  \ [4]。\n\n##### EOS\n*EOS*是一个于 2018 年 6 月推出的开源平台。其加密货币 EOS（以太坊操作系统）与以太坊非常相似。EOS\
  \ 通过 40 亿美元的 ICO 启动。凭借其高容量，EOS 每秒可处理多达 4000 笔交易。EOS 代币用于购买区块链的带宽和存储。持有代币的用户有机会就各种治理问题进行投票\
  \ [4]。\n\n##### 泰达币\n*泰达币*是一种有争议的加密货币，被定位为*稳定币*，这意味着最初其等值被设计为参照现实世界资产来衡量。具体而言，一枚泰达币被设计为始终等于\
  \ 1 美元。泰达币于 2014 年以*Realcoin*之名由初创公司创始人 Craig Sellars、Brock Pierce 和 Reeve Collins\
  \ 创立。泰达币没有交易费用。它是市场上交易量最大的加密货币之一，因为存在用构成美元的 Realcoin 购买其他加密货币的可能性 [4]。\n\n#####\
  \ Neo\n*Neo*最初称为*Ant shares*，由*Da hongfi*开发。Neo 采用拜占庭容错机制运行，这使其在 2021 年初的表现比以太坊快得多。Neo\
  \ 每秒可处理 10,000 笔交易，而以太坊每秒仅能处理 15 笔。Neo 不可分割，因此仅以整数形式存在 [18]。\n\n##### 玩具币\n*玩具币*构成了一类为娱乐而开发的币种。例如*Jesuscoin*、*Dogecoin*、*Shitcoin*、*Satancoin*等。投资者过去不太关注这类币种，因为它们缺乏严肃的目的。在某一时刻，狗狗币成功获得了\
  \ 4.5 亿美元的投资。特斯拉 CEO 埃隆·马斯克和网站*Reddit*主要推动了狗狗币的流行及其随后的明星地位 [4, 9]。\n\n##### 元币\n\
  *元币*是构建在不同加密货币平台之上的协议。*Counterparty*例如就是一个点对点金融网络，提供其自有货币*XCP*，并具有无需中介的同等优势。其目的是以互联网使信息生成和交换民主化的相同方式，使货币民主化\
  \ [1]。\n\n## 加密货币交易所\n\n\n\n\n\n### 流行的加密货币交易所\n\n以下部分简要讨论了几个较受欢迎的加密货币交易所。\n\n*\
  \   **Bittrex** 是一个加密货币交易平台。总部位于瑞士苏黎世，Bittrex 旨在提供一种安全的加密货币交换方式。\n\n*   **Poloniex**\
  \ 是由 Tristan D’Agosta 于 2014 年建立的加密货币交易平台。总部位于特拉华州，Poloniex 曾在 2014 年遭遇黑客攻击。平台上托管的比特币被黑客窃取。据估计，12.5%\
  \ 的比特币供应量被盗。为避免未来发生此类情况，Poloniex 已转向冷存储以保管资金。此外，它要求用户使用双因素认证 [6]。按日交易量计算，Poloniex\
  \ 目前是最大的山寨币交易所 [11]。\n\n*   **Kraken** 自 2011 年以来一直是最古老、最大的比特币交易平台。它通过旨在通过增加加密货币采用来提供金融自由而声名鹊起。Kraken\
  \ 提供的 API 具有通用性。其 API 的作用是在无需共享登录信息的情况下提供对 Kraken 账户的访问。这些 API 仅提供有限且受控的访问权限，通常由经验丰富的交易者用于其机器人与\
  \ Kraken 账户通信 [39]。\n\n*   **Coinbase** 的目标是根据公司说法，自 2012 年成立以来，开发一个高效、公平且可访问的透明金融系统。其独特功能包括可以说是最受信任，以及最易于使用。Coinbase\
  \ 触达超过 7000 家机构，包括超过 4300 万经过验证的用户，以及在 100 多个国家拥有超过 115,000 个生态系统合作伙伴。Coinbase 于\
  \ 2021 年上市 [2]。\n\n*   **Bitfinex** 的独特功能包括点对点融资、保证金交易和场外交易（OTC）选项。Bitfinex 拥有自己的代币\
  \ UNUS SED LEO，提供多种福利，包括 P2P 借贷费用减免以及交易手续费折扣。它提供最先进的数字资产交易服务和全球流动性提供商 [1]。\n\n*\
  \   **Binance** 于 2017 年在中国成立，但后来迁至开曼群岛。2021 年，按日交易量计算，Binance 被视为世界上最大的加密货币交易所。Binance\
  \ 由高频交易软件创造者 Changpeng Zhao 创立。撰写本文时，Binance 正接受美国司法部和国税局的调查 [35]。\n\n## 总结与结论\n\
  \n区块链技术有潜力将整个行业从中心化文化转变为去中心化结构。为了制约这一特性，开发了不同的治理系统，并且正在开发更多系统。多年来开发了不同的代币，并有不同的标准管理它们，其中目前\
  \ ERC-20 最为突出。\n\n加密货币的引入是为了促进在各种区块链平台上进行去中心化金融交易。示例包括以太币、比特币、门罗币、狗狗币等。本章最后几节为读者提供了一些流行加密货币和加密货币交易所的快速概览。\n\
  \n## 核心概念\n\n*   **区块链治理** 是区块链适应不断变化的时代和需求的系统。区块链治理的主要特征是适应性和可升级性。通常有四个关键主体参与区块链治理，即核心开发者、节点运营者、代币持有者和区块链团队。\n\
  \n*   **分叉** 是生成新加密货币的原因。由于部分用户对当前区块链存在分歧，区块链分裂为独立的数据库实例。这导致新加密货币的演变，而部分用户选择继续沿用旧区块链，部分用户决定跟随新分叉。\n\
  \n*   **加密代币** 与 **加密货币** 的主要区别在于，货币拥有自己的区块链，而代币没有，因为代币是在已有的区块链上创建的。根据预期用途，代币可分为多种类型，其中一些包括证券型、支付型、实用型和权益型代币。\n\
  \n*   **代币标准** 可被视为创建、转移和执行代币操作的接口。最被广泛接受的代币标准是 ERC-20、ERC-223 和 ERC-721，其中 ERC-721\
  \ 是唯一的非同质化标准。\n\n*   **Gas** 是以太坊交易结构中收取的交易费。2021 年，随着 EIP-1559 的引入，飙升的 Gas 费用得到了改革。为了加快以太坊上紧急交易的速度，用户可以包含小费。\n\
  \n*   **以太坊** 是仅次于比特币的最著名加密货币。GHOST 协议构成了以太坊链的基础。以太坊与比特币的主要区别在于，以太坊是一个平台，而非货币。以太币是以太坊的货币。\n\
  \n*   基于可追溯性属性，加密货币可分为公开型和私有型。公开型加密货币实现匿名性但仍可追踪（例如：比特币），而私有型加密货币被设计为不可追踪。\n\n* \
  \  存在许多交易平台，包括 Bittrex、Coinbase 和 Poloniex。2021 年，许多加密货币和交易所正接受各种政府实体的调查或严格审查，例如美国证券交易委员会、美国司法部和国税局。\n\
  \n## 进一步理解的活动\n\n有兴趣进一步了解正在进行的加密货币革命的读者，建议观看标题为 *Inside The Cryptocurrency Revolution*\
  \ 的 YouTube 视频，网址为：[`www.youtube.com/watch?v=u-vrdPtZVXc`](https://www.youtube.com)，以获得更好的加密货币视角。\n\
  \n阅读本章并观看视频后，请思考以下问题：\n\n*   在您个人看来，各国将在什么时间范围内以及以何种方式对加密货币交易征税？\n\n*   在您看来，基于区块链的货币对于组织可能面临哪些交易挑战？\n\
  \n*   Vitalik Buterin（以太坊创始人）在哪些方面可能影响加密货币市场的整体增长和普及？\n\n*   本章讨论的加密货币中，哪些可能在未来十年内依然存在？\n\
  \n*   考虑到贵企业的目标和长远规划，基于其基本属性，本章讨论的哪些加密货币最有可能在未来被贵组织采用？\n\n## 参考文献\n\n*   *About\
