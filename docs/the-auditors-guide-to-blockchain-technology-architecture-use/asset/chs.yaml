  \n# 14 智能合约漏洞、攻击与审计考量\n\nMaheswar Sharma, Keerthana Kasthuri, Parvinder Singh and\
  \ Nynisha Akula\n\nDOI: [10.1201/9781003211723-14](http://doi.org/10.1201/9781003211723-14)\n\
  \n## 摘要\n\n顾名思义，本章重点关注区块链技术中最脆弱的组件之一，即智能合约。本章通过审视此类安全漏洞的根本原因，讨论了总共九种与智能合约相关的攻击。这些攻击包括重入攻击、访问控制、算术运算、未检查返回值、DoS、不良随机性、竞争条件、短地址和时间戳依赖攻击。\n\
  \n除了编码错误和攻击讨论外，本章还讨论了七种不同的智能合约审计方法。虽然——取决于预期的用例——在智能合约开发过程中并不一定需要使用所有七种审计方法，但审计人员需要对这些审计方法有基本的了解，以便能够在智能合约发布前推荐合适的智能合约测试和评估组合。如前所述，在第\
  \ 2 章和第 9 章中提到，在智能合约的编码和测试过程中必须极其谨慎，因为智能合约开发类似于固件开发，一旦部署，有缺陷的智能合约无法再通过应用软件补丁来修复。因此，唯一可行的解决方案是终止该智能合约——假设其设计中添加了此类终止开关——并用一个功能完善的智能合约来替换有问题的智能合约。\n\
  \n信息系统审计师也会发现智能合约审计模板是规划和实施智能合约审计的有用工具。\n\n## 智能合约安全考量\n\n智能合约已成为区块链技术中的一项重大编程突破。智能合约是在以太坊等平台上执行的计算机程序，`Solidity`\
  \ 是用于编译以太坊虚拟机上使用代码的编程语言。\n\n智能合约在区块链上被视为“公开”的，用户可以通过创建交易与智能合约进行交互。在处理智能合约程序时，需要熟悉与检测和避免智能合约代码主要缺陷相关的安全风险。在本节中，我们将考察代码执行过程中常见的已知安全漏洞\
  \ [1]。\n\n### 重入攻击\n\n重入攻击被视为最灾难性的智能合约攻击策略之一。这种攻击方法可能会破坏合约或促成敏感信息的窃取。当用户构建的功能允许外部函数在处理其后果之前调用另一个不受信任的智能合约时，就会发生重入攻击。该漏洞允许攻击者执行主函数的递归回调，导致非预期的循环重复多次。`Single`\
  \ 函数和 `cross` 函数是攻击者用来破坏合约或获取有价值信息的两种不同类型的重入攻击（图 14.1）[7]。\n\n![Figure 14.1  A sample\
  \ code explaining the flaws leading to the reentrancy attack [14]. ¶ Source: [25].](html/images/Figure14_1.jpg)\n\
  \n图 14.1  解释导致重入攻击缺陷的示例代码 [14]。 ¶ 来源：[25]。\n\nSolidity 的 call 构造（在 EVM 字节码中转换为 `CALL`\
  \ 指令）会导致被调用者代码的一小部分被执行——正如 fallback 函数中所定义的那样。因此，当使用 call 构造时，创建者可能会假设一个原子值转移，其中可以执行另一个合约的代码。通过使用“Y”账户的地址调用“X”函数\
  \ `ping`，2 `wei`（以太币的最小面额）被转移到“Y”账户，此外，“Y”的 fallback 函数被调用。由于 fallback 函数再次使用 Y\
  \ 的地址调用 `ping` 函数，在合约“X”的变量 `sent` 被设置之前，又转移了 2 `wei`。这种循环将持续到初始调用的所有 `gas`（在以太坊区块链平台上进行交易或执行合约所需的费用）被消耗殆尽或达到调用栈限制\
  \ [14]。\n\n#### 真实案例场景\n\n通过研究 DAO（去中心化自治组织）案例可以看到重入攻击的影响，该组织由开发人员创立，旨在实现决策自动化并促进加密货币交易。DAO\
  \ 是以太坊早期开发过程中的主要受害者之一。重入攻击发挥了关键作用，合约的总价值达 1.5 亿美元 [7]。\n\n### 访问控制\n\n通常，智能合约具有受保护的功能，这意味着所有者和其他授权用户由其地址标识。访问控制系统可以部署在由所有者或受信任的第三方管理的智能合约上\
  \ [4]。在以太坊智能合约中，访问控制的目的是限制对合约组件的访问 [6]。\n\n访问控制的漏洞在于攻击者可以阻止用户获得访问权限，或授予他人执行货币转账和/或合约自毁等操作的权限\
  \ [5]（图 14.2）。\n\n![Figure 14.2  A sample code explaining the flaws leading to access\
  \ control vulnerability [5]. ¶ Source: [25].](html/images/Figure14_2.jpg)\n\n图 14.2\
  \  解释导致访问控制漏洞缺陷的示例代码 [5]。 ¶ 来源：[25]。\n\n在上述示例的 `line 3` 中，通过执行公共函数 `ABC()`，原始所有者被修改为\
  \ `msg.sender`（`line 4`），而无需验证代码。攻击者还可以省略 `line 7` 中的 `only owner` 以提取合约中的所有以太币\
  \ [5]。\n\n#### 真实案例场景\n\n\n\n\n\n## 以太坊智能合约漏洞分析\n\n### 奇偶校验钱包漏洞\n\n奇偶校验钱包是以太坊智能合约中常见的多重签名加密货币钱包，用于设置提款限额、交易日志记录和创建所需签名的规则集\
  \ [10]。攻击者利用奇偶校验钱包中的漏洞窃取了 150,000 ETH。攻击者向合约发送了两笔交易：第一笔交易用于获取多重签名钱包的所有权，第二笔用于转移所有资金。随后，攻击者在第一笔交易中调用了\
  \ `initWallet` 函数。该函数没有检查以确保合约初始化后不会被再次调用。攻击者通过利用奇偶校验钱包漏洞获得了钱包的完全所有权，并将全部价值转移到了攻击者的账户\
  \ [11]。\n\n### 算术溢出/下溢\n\n以太坊虚拟机（EVM）为整数指定了固定大小的数据类型，这意味着整型变量只能表示特定范围的数字。例如，`uint8`\
  \ 只能存储 0–255 范围内的数字。尝试将 256 存储到 `uint8` 中会导致溢出，因为其最大值为 255，结果将变为 0。\n\n在 Solidity\
  \ 编程语言中，无符号整数表示为 `uint256`。每个 `uint256` 限制为 256 位大小，代表从 0 到 2²⁵⁶ – 1 的整数值。在合约中，如果分配的整数值大于给定范围，整数会重置为\
  \ 0；如果值小于范围，则会在范围内分配一个较大的值。例如，当一个正数从 0 中减去时，将导致整数变为 2²⁵⁶−1 [8]。\n\n当分配的值增量超出给定范围时，智能合约会产生溢出和下溢漏洞，使合约容易受到算术溢出或下溢攻击。Solidity\
  \ 可以处理高达 256 位的数字，将此数字加 1 可能导致溢出（图 14.3）[7]。\n\n![Figure 14.3  Sample coding flaw\
  \ leading to arithmetic over/underflow attacks [7]. ¶ Source: [25].](html/images/Figure14_3.jpg)\n\
  \n**图 14.3** 导致算术溢出/下溢攻击的示例编码缺陷 [7]。来源：[25]。\n\n为了利用该缺陷，攻击者将使用参数调用函数（批量转账）。攻击者可以在\
  \ `_value`（第 2 行）中输入负值，这可能导致反向交易；即金额将从接收方账户扣除并记入发送方账户。攻击者可以在接收方函数中输入两个地址，使代币智能合约向两个地址发送以太币。通过使用标量数据类型代替复合数据类型，可以避免此漏洞\
  \ [7]。\n\n#### 真实案例场景\n\n**4chan's Group** 使用智能合约创建了 **Proof of Weak Hands Coin**（POWH）。尽管它被设置为庞氏骗局，但人们仍继续投资。然而，POWH\
  \ 代币的开发者未能保护所有操作，也无法针对溢出和下溢攻击建立足够的防护。通过利用这一编码疏忽，一名未知黑客窃取了价值至少 1,000,000 美元的 2000\
  \ ETH [8]。\n\n### 未检查的返回值\n\n在 Solidity 中有多种执行外部调用的方式，其中 `transfer` 是常用于向外部账户发送以太币的方法之一。`send`\
  \ 函数也被使用，它执行消息调用，并将以太币转移到指定地址。另一方面，对于更灵活的外部调用，Solidity 中直接使用 `CALL` 操作码。如果这些操作中的任何一个成功或失败，`call`\
  \ 和 `send` 函数将返回一个布尔值指示状态。如果外部调用失败，执行 `call` 和 `send` 函数的交易不会返回（revert），调用函数的执行将自然继续，而函数将返回布尔值\
  \ `false`。开发者期望外部调用失败时会发生返回，从而未能检查 `false` 返回值（图 14.4）[1]。\n\n![Figure 14.4  A sample\
  \ code explaining the flaws leading to the vulnerability of unchecked return value\
  \ [1]. ¶ Source: [25].](html/images/Figure14_4.jpg)\n\n**图 14.4** 解释导致未检查返回值漏洞缺陷的示例代码\
  \ [1]。来源：[25]。\n\n上述示例代表一个游戏合约，获胜者获得 `winPrice` 数量的以太币，并留下少量供任何人提取。在第 11 行，`send`\
  \ 在未验证响应的情况下被使用。无论以太币是否发送成功，交易失败的获胜者都将导致 `payedOut` 被设置为 `true`。如果合约故意提供回退函数或耗尽\
  \ gas，交易可能会失败。此处的漏洞在于任何人都可以使用 `withdrawLeftOver` 函数提取 `WinnerPrice` [1]。\n\n####\
  \ 真实案例场景\n\n**Etherpot** 是一个智能合约彩票。由于区块哈希的错误使用而失败。在 Etherpot 中，使用区块的哈希值——具体为决策区块——来决定获胜者。理论上，获胜者可以在任何时候被计算并报告为获胜者。但在获胜者在决策区块的\
  \ 256 个区块内退出之前，区块哈希函数返回 0。该合约受到未检查调用值的影响 [1]。\n\n### DoS 攻击\n\n拒绝服务攻击可以采取以下几种形式：\n\
  \n*   **区块 Gas 限制 DoS**：以太坊区块链上的每个区块都有 Gas 限制。区块 Gas 限制的优势在于防止攻击者构建无限交易循环。然而，如果交易的\
  \ Gas 消耗达到此限制，交易将失败。这可能以多种方式导致 DoS 攻击 [15]。\n\n*   **通过区块填充进行的网络 Gas 限制 DoS**：无论智能合约是否包含无界循环，恶意行为者都可以使用一系列高\
  \ Gas 价格的交易，阻止其他交易在多个区块中被区块链处理。攻击者发布了多笔消耗整个 Gas 限制的交易。攻击者试图用大量交易填满整个区块，如果这些交易中的\
  \ Gas 价格很高，就可以阻止其他交易被处理 [15]。\n\n*   **意外回滚 DoS**：当用户尝试向另一个用户转账且功能依赖于交易成功时，会发生 DoS（拒绝服务）攻击。如果资金被转移到攻击者创建的智能合约，这允许攻击者创建一个回退函数以回滚所有付款（图\
  \ 14.5）[15]。\n\n![Figure 14.5A sample code explaining the flaws leading to DoS with\
  \ unexpected revert vulnerability [15]. ¶ Source: [25].](html/images/Figure14_5.jpg)\n\
  \n**图 14.5** 解释导致意外回滚 DoS 漏洞缺陷的示例代码 [15]。来源：[25]。\n\n\n\n\n\n#### 通过 Revert 实现的拒绝服务\n\
  \n在这种情况下，如果攻击者从一个带有回退函数的智能合约进行竞价，该函数会撤销所有支付。他们将永远无法获得退款，且没有人能够再出价超过他们。在 Revert 数组函数代码中，用户希望通过遍历数组来支付一组用户，并希望确保每位用户都能得到公平支付。问题在于，如果某笔支付失败，整个函数将被回滚，导致无人获得补偿\
  \ [15]。\n\n#### 真实案例场景\n\n一个收集了大量以太币的庞氏骗局是 *GovernMental*。它曾一度积累了 1100 个以太，但容易受到\
  \ DoS 漏洞攻击。为了提取以太币，合约修改涉及消除一个主要映射。删除该映射的 Gas 开销达到了区块 Gas 上限，因此这 1100 个以太无法被提取 [1]。\n\
  \n### 随机数生成不佳\n\n某些智能合约需要随机数生成器。随机数生成可以通过多种方式实现，例如使用秘密值、基于挖矿统计数据生成随机数，或使用外部随机数生成器预言机。由于智能合约代码在区块链上可见，使用外部预言机是随机数生成的唯一安全方式（图\
  \ 14.6） [16]。\n\n![Figure 14.6  A sample code with flaws leading to bad randomness\
  \ vulnerability [17]. ¶ Source: [25].](html/images/Figure14_6.jpg)\n\n图 14.6  包含导致随机数生成不佳漏洞的示例代码\
  \ [17]。 ¶ 来源：[25]。\n\n上述代码将随机数作为基于智能合约的赌博游戏的一部分，仅使用区块链上前一个区块的哈希值作为随机性来源，该哈希值在区块创建后对所有人公开。以太坊仅存储最近\
  \ 256 个区块哈希，对于更早的哈希将返回 0。因此，攻击者可以为之前的 256 个区块创建一个智能合约，检查当前区块是否为中奖区块。如果是，攻击者调用函数领取奖品\
  \ [17]。\n\n#### 真实案例场景\n\n*Smart Billions* 彩票及其他在线游戏和彩票，依赖不可预测的数据（如“区块创建时间”）作为体育赛事门票的随机性来源。在此，攻击者或区块矿工可以调整发布时间以操纵结果\
  \ [18]。\n\n### 竞态条件\n\n竞态条件是一种发生在多用户环境中的攻击，用户对竞态代码的执行会导致不良事件 [1]。当矿工与智能合约的参与者竞争，通过更改合约中的权限，将矿工的交易插入到原始交易之前时，可能会发生区块链竞态条件\
  \ [2]。\n\n在以太坊区块链上，区块由以太坊节点处理的交易池形成。当矿工解决“工作量证明”机制时，区块才有效。以太坊平台上的交易费被称为“Gas”，其价格由矿工设定。通常，矿工决定哪笔交易应被包含在区块中，并根据每笔交易的“Gas\
  \ 价格”从一组有序交易中选择。如前所述，以太坊是一个公共区块链，允许用户查看其他用户的待处理交易。攻击者可以查看包含合约中工作量证明解决方案的交易，从而从交易中获取数据。随后，攻击者可以创建一笔\
  \ Gas 价格更高的交易并将其包含在区块中，以获取合约中的以太币。在竞态条件中，潜在的攻击向量可能修改合约中的权限，这种修改可能对解题者产生不利影响 [1]。\n\
  \n根据 2021 年以太坊更新（EIP-1559），最新的交易费方法是将费用拆分为基础费用和“小费”，其中基础费用根据每笔交易的一组算法自动计算。此外，交易现在直接发送到网络，而不是发送给矿工。进一步解释，“小费”指用户为加快交易处理而自愿支付的额外费用。这种最新的交易费方法还能防止恶意行为者垃圾交易（图\
  \ 14.7） [10]。\n\n![Figure 14.7  Sample coding flaw leading to a race condition vulnerability\
  \ [1]. ¶ Source: [25].](html/images/Figure14_1.jpg)\n\n图 14.7  导致竞态条件漏洞的示例代码缺陷 [1]。\
  \ ¶ 来源：[25]。\n\n上述合约包含 *2 个以太* 以及第 *2 行* 中其 SHA-3 哈希值的原像。例如，如果任何用户发现了哈希值的解，他们可以使用相应参数调用\
  \ `solve()` 函数来获取以太币。另一方面，攻击者可能正在监视交易池，寻找提交解决方案的人。一旦攻击者知晓解决方案，攻击者会提交一笔 Gas 价格更高的交易。攻击者随后在原始解题者之前挖出该交易，解决工作量证明机制并获得\
  \ 900 个以太币。在此漏洞中，存在矿工被贿赂或矿工本身就是攻击者的可能性 [1]。\n\n#### 真实案例场景\n\n*Bancor* 是一个知名平台，它促进了在以太坊区块链上无需\
  \ *买家* 和 *卖家* 干预即可进行数字资产交换 [3]。Ivan Bogatty 及其团队成员记录了一次针对 Bancor 的攻击。由于以太坊的公开性质，交易在广播到网络时对所有人可见\
  \ [1]。这些交易位于待处理交易部分，等待被打包。如果攻击者有足够的时间抢跑待处理交易，并以略高于原价的价格买入订单，该攻击者就能获利 [3]。\n\n###\
  \ 短地址攻击\n\n短地址攻击是针对第三方应用程序执行的攻击。短地址或参数攻击展示了攻击者如何操纵参数以访问合约中的代币。尽管现实中尚无此类攻击的案例，但本节解释的概念场景有助于说明此类攻击中参数如何被操纵\
  \ [1, 26]。\n\n短地址攻击允许攻击者绕过长度小于指定长度的参数；例如，发送一个 35 个十六进制字符的地址，而不是 40 个十六进制字符。在这种情况下，以太坊虚拟机默认会在该地址末尾填充零以匹配预期长度。当第三方应用程序未验证输入时，这会导致攻击（图\
  \ 14.8） [1]。\n\n![Figure 14.8  Sample coding flaw leading to short address attack\
  \ [13]. ¶ Source: [25].](html/images/Figure14_8.jpg)\n\n图 14.8  导致短地址攻击的示例代码缺陷 [13]。\
  \ ¶ 来源：[25]。\n\n如前所述，短地址的主要缺陷是接受长度小于预期长度的地址。参考上述代码，第 6 行允许攻击者从 `_amount` 参数中窃取字节，当智能合约代码执行时，它转移的代币数量比预期多\
  \ 256 倍。\n\n\n\n\n为了进一步扩展，ERC20 标准通常用于在以太坊上创建代币。根据 `GOLEM` 的技术团队称，短地址攻击允许攻击者传递一个小于指定长度的参数。应用程序二进制接口（ABI）规范会在末尾添加零来补齐地址所需的长度。在此攻击中，向短地址添加了\
  \ 1 字节的零。当解析器遍历整个地址时，如果发生下溢，则会添加一个额外的零使其成为 `uint256`，并调用 `transfer` 函数。在这里，`transfer`\
  \ 函数中的金额乘以 256（或 2 的 8 次方），并相应地转移代币 [1]。\n\n### 时间戳依赖\n\n时间戳依赖是另一种可被恶意矿工利用的漏洞。这是由于智能合约中对时间记录的不完美解读导致的，其结果是以太坊网络脱离了同步的全球时钟。例如，以太坊智能合约使用当前时间戳生成随机数，并根据结果发放奖励。其工作原理如下：当智能合约使用时间戳生成随机数时，恶意矿工会在区块验证前后\
  \ 30 秒内发布一个时间戳，从而改变合约的执行结果以使其获利。因此，随机数生成器的结果可以被篡改（图 14.9）[8]。\n\n![图 14.9  导致时间戳依赖漏洞的编码缺陷示例\
  \ [8]。 ¶ 来源：[25]。](html/images/Figure14_9.jpg)\n\n图 14.9  导致时间戳依赖漏洞的编码缺陷示例 [8]。\
  \ ¶ 来源：[25]。\n\n上图所示的 `Run.sol` 合约代码片段利用区块的时间戳值生成一个随机整数，随后将其纳入一个关键计算过程中。在 `第 2 行`\
  \ 中，区块的时间戳被作为随机数分配给私有变量 `salt`。然后 `salt` 变量被用于计算随机函数参数 `x`、`y` 和 `seed` 的值。代码在 `第\
  \ 4 行` 实现了调用随机函数的条件。区块的时间戳被用于确定随机函数的返回值，并将其赋给变量 `roll`。然后对变量 `roll` 进行状态测试；如果通过，则执行\
  \ `submit` 函数作为关键调用。恶意矿工将通过调整本地系统的时间戳来利用此调用 [8]。\n\n#### 真实案例场景\n\n`GovernMental`\
  \ 是一个积累了大量以太币的庞氏骗局。`GovernMental` 合约按轮次收集玩家的以太币，并且每局游戏只向单个获胜者支付奖金。合约奖励给每轮中最后加入的玩家（至少晚一分钟）。该游戏的持续赢家是一名矿工，他能够调整时间戳，使其看起来像该玩家是最后加入的\
  \ [9]。\n\n## 智能合约审计考量\n\n### 智能合约审计\n\n智能合约审计旨在验证底层代码。此类审计有助于识别漏洞，并确保在合约部署到区块链之前对合约代码进行审查。目前，智能合约审计方法采用\
  \ (i) 交易样本以分析重大错报风险，(ii) 年度时间点审计方法，以及 (iii) 回溯审计方法。\n\n企业组织采用智能合约以提高业务效率。审计师可以选择从不同供应商处购买数据分析工具。审计师还可以集成多种审计工具，以实现透明及时的审计报告\
  \ [19, 25]。\n\n表 14.1 概述了各种智能合约测试/审计方法及其各自的优势和挑战，以帮助确保新智能合约按照其预期目的运行。\n\n表 14.1\
  \ 智能合约审计技术摘要\n\n| **方法论** | **定义** | **优势** | **挑战** |\n| --- | --- | --- | ---\
  \ |\n| 控制流分析 | 用于评估有价值的编译时知识的传统编译器优化方法 [32]。 | 可用于多种编译器 [32]。 | 大量误报。分析无法编译的代码 [35]。\
  \ |\n| 专家代码分析 | 由 `Solidity` 编码专家审查代码的准确性和潜在缺陷 [17]。 | “全新视角”审视代码以检测任何问题 [17]。 |\
  \ 由人工执行，而非自动化工具；因此存在更高概率某些缺陷可能无法被检测到 [17]。 |\n| 污点分析 | 旨在对具有用户可控输入且已被“污染”的变量进行分类，并将其追踪到通常称为“汇聚点”的潜在薄弱函数\
  \ [34]。 | 可轻松识别 Web 应用程序缺陷 [34]。 | 污点分析工具未解决关键需求。泄露其设置、程序和内部关注点的知识 [33]。 |\n| 动态代码分析\
  \ | 动态代码分析的功能类似于攻击者，通过将恶意代码注入程序所需函数中来尝试发现漏洞 [8]。 | 静态分析无法识别的漏洞可通过动态分析方法识别 [8]。 |\
  \ 当代码更新时，智能合约用户无法保证新代码将实现与原始合约代码相同的逻辑 [27]。 |\n| 手动代码分析 | 开发者在合约永久部署前逐行手动检查代码 [29]。\
  \ | 有助于减少测试配置的数量 [29]。 | 可手动检查的追踪路径有限 [29]。 |\n| 基于漏洞的扫描 | 基于漏洞的扫描有助于识别导致智能合约安全攻击的安全问题和漏洞\
  \ [8]。 | 管理安全问题和漏洞管理。智能合约包含许多现实世界的漏洞，如重入、未检查的外部调用、时间戳依赖 [8]。 | 基于漏洞的扫描挑战涉及隐私和性能问题的编纂\
  \ [24]。 |\n| 符号执行 | 包含简单计算的正常执行的扩展。符号执行不需要任何现实世界的对象作为语义，因为它使用编程语言中的任意符号 [23]。 |\
  \ 与其他分析方法相比相对简单 [23]。 | 约束求解问题 [20]。 处理循环时存在问题，因为它永不终止 [20]。 |\n\n正如表 14.1 所示，所有审计方法都有其优缺点。因此，重要的是要注意，为了高度确信智能合约将实现其预期目的，开发团队或智能合约审计团队应考虑采用表\
  \ 14.1 中提出的一些审计方法论。\n\n\n\n\n以下部分提供了上一节介绍的各类测试/审计方法所用工具的基本相关信息。\n\n### 控制流分析工具\n\
  \n#### McCabe IQ\n\n可利用流程图和带注释的源代码清单，对攻击图中的每个特性进行详细审查。路径信息会经过测试，以确保所显示的控制流路径准确、稳定且符合规范\
  \ [31]。\n\nMcCabe IQ 的数据字典功能是另一种策略，可用于更彻底地调查程序代码中使用的禁用函数。用户可在数据字典中扫描数据元素和函数调用，并对包含这些调用的函数内的路径进行分类\
  \ [31]。该工具可在 GitHub 上获取：[`github.com/PyCQA/mccabe`](https://github.com/PyCQA/mccabe)。\n\
  \n#### 以太坊虚拟机\n\nEVM 由一个建立在具有自定义指令格式的栈上的单一虚拟机组成。每条指令均表现为一个单字节操作码。在数据栈上传递参数。用于将常量压入栈的\
  \ push 指令是唯一例外。这些常量直接转换为指令的字节。由于 EVM 具有用于简单块入口的显式标记，因此检索基本块边界是可行的 [30]。该工具可在 GitHub\
  \ 上获取：[`github.com/exthereum/evm`](https://github.com/exthereum/evm)。\n\n### 污点分析工具\n\
  \n#### TAJ\n\nJava 污点分析 (TAJ) 是一种旨在以足够可靠性生成低误报率，并具有足够通用性以允许评估大型应用程序的方法。TAJ 提供了一系列策略，可在极大型程序上产生实际效果，尽管它们受限于给定的时间或内存预算。当实现极其庞大且最终用户仍希望分析在有限时间内终止或保持在指定内存使用水平内时，TAJ\
  \ 主张采用优先级方法，将研究重点放在可能参与污点传播的 Web 应用程序部分上 [27]。该工具可在 GitHub 上获取：[`github.com/TJAndHisStudents/TaintFlowAnalysis`](https://github.com/TJAndHisStudents/TaintFlowAnalysis)。\n\
  \n#### DYTAN\n\n动态污点分析因数据流和控制流而能充分管理程序内的知识流，并支持在不同维度上定制分析。通过动态污点技术可避免 SQL 注入攻击，攻击者会向\
  \ Web 服务器发送恶意构造的字符串以进入底层数据库。大多数基于动态污点的 SQL 注入防范方法通过污染和监控来自用户的不安全输入文件来工作。一旦查询字符串提交给数据库，就会对其进行审查，以确保该字符串或其片段未使用任何已损坏的数据生成\
  \ [28]。该工具可在 GitHub 上获取：[`github.com/behzad-a/Dytan`](https://github.com/behzad-a/Dytan)。\n\
  \n### 动态代码分析工具\n\n#### MAIAN\n\n动态工具 MAIAN 考虑智能合约的执行轨迹，即在区块链上运行合约时记录的序列。MAIAN 还结合漏洞类别考虑执行轨迹。每次交易都会请求智能合约运行一个函数，从而导致针对给定输入的执行路径被利用。因此，执行轨迹可能具有连锁效应。因此，为在智能合约的指定执行轨迹上查找漏洞利用，MAIAN\
  \ 工具使用系统化技术。MAIAN 由两大主要组件组成，即符号分析和具体验证。符号分析组件的输入为合约字节码、分析规范及漏洞类别。MAIAN 持续执行直到到达具有漏洞属性集的不确定轨迹。所有执行均在\
  \ EVM 上进行，这将简化智能合约字节码的符号执行。每条执行轨迹均以符号变量作为输入，以便符号分析组件在合约暴露出漏洞时返回给定符号变量的具体值。具体验证的作用是验证符号分析的结果，并确认在智能合约中发现的\
  \ Bug 的准确性。分析期间，MAIAN 不会影响主以太坊区块链上合约的状态 [8]。该工具自 2018 年 3 月起已在 GitHub 上以 MIT 许可证提供\
  \ [21]。\n\n#### ContractLarva\n\n该工具用于智能合约的运行时验证。用户可使用动态事件自动机 (DEA) —— ContractLarva\
  \ 使用的一种规范语言 —— 来证明给定智能合约的属性。该工具通过接收给定合约的规范作为输入来生成一个新的 Solidity 合约。新合约的功能与原始合约相同，但向合约中添加了代码以检查运行时验证，并在观察到任何违规时做出相应反应。尽管\
  \ ContractLarva 已在许多智能合约上实现以部署运行时验证和恢复，但它面临许多需要解决的挑战 [27]。该工具可在 GitHub 上以 Apache-2.0\
  \ 许可证获取 [21]。\n\n### 基于漏洞的扫描工具\n\n#### Mythril\n\n一款用于分析智能合约的自动化工具。分析基于字节码。它使用污点分析和控制流分析来查找漏洞。Mythril\
  \ 使用命令行作为界面 [22]。通过该工具发现的漏洞均有详细记录和文档说明。ConsenSys 于 2017 年 9 月在 GitHub 上开发并维护 Mythril，采用\
  \ MIT 许可证 [21]。\n\n#### Securify\n\n另一款基于用户界面的自动化安全分析工具，用于基于字节码的以太坊智能合约，可检测重入、输入验证等漏洞\
  \ [22]。如果检测到某种模式，该工具可提供额外保证，即合约代码具备相应的安全属性。该工具采用 Java 编写，自 2018 年起已在 GitHub 上以 Apache\
  \ 2.0 许可证提供 [21]。\n\n#### SmartCheck\n\n一款开源、基于用户界面的自动化工具，可运行 Solidity 源代码并检查漏洞及其他安全问题\
  \ [22]。SmartCheck 将代码转换为可扩展标记语言 (XML) 语法，并将漏洞指定为 XQuery 路径表达式，用于在 XML 树中搜索模式。该工具的最新版本为闭源，其漏洞检查模式数量是之前的两倍。该工具采用\
  \ Java 编写，可通过 SmartCheck 公司网站访问 [21]。\n\n### 符号执行工具\n\n#### DART\n\n符号执行领域较早的工具之一，能够通过动态分析执行随机测试，以查找由库函数引起的\
  \ Bug。DART 使用单路径测试输入（不采用路径选择机制）来检查违规、断言、崩溃和非终止等标准错误 [20]。该工具在 GitHub 上公开可用。DART\
  \ 软件开发工具包包含 VM、dart2js、核心库等。\n\n#### Manticore\n\n\n\n\n\n#### 一种能够发现组合路径的符号执行工具\n\
  \nManticore 将 Solidity 代码编译为字节码，以分析漏洞的执行轨迹并在源代码中报告它们。**Trail of Bits** 公司开发了该工具以使用\
  \ Python API。自 2017 年起，该工具在 GitHub 上以 AGPL-3.0 许可证公开可用 [21]。\n\n#### Oyente\n\n\
  一种用作参考点并用于各种项目的工具。它以符号方式执行字节码，并检查多次执行的合约的执行轨迹。使用 Oyente 需要一个 Solidity 编译器来获取字节码。Oyente\
  \ 是一个用 Python 编程语言编写的命令行工具。自 2016 年起，该工具在 GitHub 上以 GPL-3.0 许可证公开可用 [21]。\n\n表 14.2\
  \ 总结了所讨论的工具及其目的和分析方法。\n\n### 表 14.2：工具及其目的和分析方法调查\n\n| 工具 | 目的 | 分析方法 |\n| :---\
