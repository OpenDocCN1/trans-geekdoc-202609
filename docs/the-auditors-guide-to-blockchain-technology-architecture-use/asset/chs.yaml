  \n# 13 区块链用户、网络和系统级攻击及缓解措施\n\nNishtha Baria, Dharmil Parmar and Vidhi Panchal\n\n\
  DOI: [10.1201/9781003211723-13](http://doi.org/10.1201/9781003211723-13)\n\n## 摘要\n\
  \n本章是两章中的第一章，旨在对当前已知的区块链技术攻击进行安全与保障方面的技术讨论。下一章将仅关注智能合约漏洞和攻击，而本章涵盖用户级、系统级和网络级的区块链漏洞及随之而来的攻击。\n\
  \n用户级攻击包括私钥被盗以及利用区块链特定恶意软件在用户级发起安全漏洞。读者应注意，虽然所有区块链节点都是用户，但并非所有用户都是节点。节点级攻击主要源于共享漏洞和成员服务提供商（`MSP`）漏洞。\n\
  \n此外，本章还介绍并讨论了总共八种节点/网络级攻击和四种系统级攻击。本章还为读者提供了针对各级别（用户/节点/网络/系统）所讨论的各种攻击的一些建议缓解技术。\n\
  \n本章最后将讨论针对每种所讨论攻击的一些安全最佳实践，以及以太坊、Hyperledger 和 Corda 固有安全措施的简要探讨。\n\n## 简介\n\n\
  自 2009 年左右诞生以来，区块链技术一直在不断扩展和变革。通过创造额外价值，区块链有潜力像 1990 年代的互联网一样颠覆行业并重塑商业结构。区块链的积极成果在很大程度上归功于其分布式和去中心化账本特性；然而，事物皆有两面性，区块链技术也不例外。攻击者利用区块链运行环境的去中心化性质，采用各种手段发动多种攻击。随着区块链技术的发展，与该技术相关的攻击也在不断演变。简而言之，区块链日益增长的普及度引发了新的安全和隐私担忧。\n\
  \n区块链攻击分为四个层级。用户级攻击包括由用户错误发起或导致的攻击。网络级攻击是由于网络属性错误或对网络控制不当导致的攻击。节点级攻击是由节点上的损坏任务引起的攻击。最后，系统级攻击是常见系统编码错误的结果。攻击与缓解相辅相成，因此本章也讨论了必要的缓解技术。\n\
  \n## 区块链用户、网络和系统级攻击及缓解措施\n\n### 用户级攻击\n\n用户级攻击是由用户之间的交互引起的攻击。通常，这些用户级攻击是由于用户的疏忽大意而发生，从而导致私钥泄露。用户级攻击也可能是恶意软件存在的结果。此外，当软件未定期更新导致出现意外漏洞时，也可能发生面向用户的攻击。充分关注用户级安全有助于预防其中一些用户级攻击\
  \ [16]。\n\n#### 私钥被盗\n\n正如第 2 章所述，加密数据需要两把密钥。一把是公钥（所有人可见），另一把是私钥（仅限特定用户）。公钥加密使用一对密钥进行加密过程，首先利用公钥加密数据，随后加密后的数据只能借助私钥解密。私钥加密则相反，利用私钥加密信息，利用公钥解密数据。一旦密钥泄露或被盗，用户的区块链账户也极有可能被攻破，从而导致从受损账户发起未经授权的交易\
  \ [16]。\n\n###### 缓解措施\n\n*   **硬件钱包**是维护密钥及与区块链相关的各种钱包公共地址的硬件设备。从技术上讲，硬件钱包是用于存储交易详情的\
  \ USB 类型驱动器，无需电池即可操作 [33]。硬件钱包是存储私钥较为安全和合适的方法之一。部分硬件钱包品牌包括 `Ledger`、`Ledger Nano\
  \ S`、`Ledger Nano X`、`Trezor` 等 [21]。\n\n*   **软件钱包**是可安装在操作系统上的计算机程序。软件钱包有时被称为**桌面钱包**，提供更好的隐私性、易用性、无第三方介入和保密性\
  \ [33]。软件钱包也可下载到移动设备、台式机或笔记本电脑上。软件钱包中维护的密钥连接互联网，因此若钱包被黑客攻击，密钥易遭窃取。桌面钱包通常用于持有频繁交易或其他交易用途所需的少量加密货币，因其用户友好度较高。软件钱包品牌包括\
  \ `Coinbase`、`Gemini` 和 `Blockfi` [20]。\n\n*   **纸钱包**是以二维码形式打印在纸上的钱包。纸钱包因存在若干固有缺陷而面临诸多风险；值得注意的包括无法转移部分资金和不可重复使用。通常，纸钱包主要用于冷存储目的\
  \ [33]。部分纸钱包品牌包括 `Bitcoin Paper wallet`、`Wallet Generator` 和 `Mycelium` 等 [4]。\n\
  \n*   **云钱包**可在线访问，私钥存储在云端，可通过互联网访问。云钱包分两类——**托管**和**非托管**。非托管钱包将资金和资产置于程序控制之下。云钱包虽易受\
  \ DDoS 攻击，但适合处理小额余额和交易。部分云钱包品牌包括 `Coinbase`、`Binance` 和 `Meta Mask` [33]。\n\n####\
  \ 恶意软件\n\n用户通过易受各类恶意软件攻击的计算机与区块链网络通信。用户机器上存在恶意软件可能以多种方式破坏区块链的防护措施。若用户私钥保存在设备上，恶意软件可能接管用户账户。感染用户机器的恶意软件可能获取其他区块链用户的\
  \ IP 地址，并利用此信息以这些用户为目标。受感染的计算机还可能被用于加密劫持——即恶意软件利用计算机的算力资源为攻击者执行工作量证明计算以获利 [26]。\n\
  \n以下章节描述一些流行的区块链相关恶意软件的属性。\n\n##### ElectroRAT\n\n\n\n\n\n##### 网络犯罪分子开发虚假加密货币应用程序\n\
  \n根据安全公司 `Intezer Labs` 的说法，网络犯罪分子开发虚假加密货币应用程序，旨在诱骗用户在其计算机上下载一种新型恶意软件，最终目的是窃取受害者的资金。这些虚假应用程序被称为\
  \ `Jamm`、`eTrade/Kintum` 和 `DaoPoker`。这些应用程序分别在名为 `jamm.to`、`kintum.io` 和 `daopker.com`\
  \ 的专用网站上展示。前两个应用程序似乎是一个简单的加密货币交易平台，而第三个则是一个加密货币游戏应用程序。根据 Intezer 研究人员的说法，这些应用程序还包含一个惊喜，即一种名为\
  \ `ElectroRAT` 的新型恶意软件，它隐藏在应用程序中，具备记录按键、截屏、从存储上传文件、导入文件以及在受害者控制台执行命令等能力。该恶意软件旨在捕获加密货币钱包密钥，随后耗尽受害者的资金。已安装木马化应用程序的用户应尽快卸载进程并删除所有相关文件，将剩余资金转移到新的加密钱包，并更新密码\
  \ [8]。\n\n##### PCASTLE\n\n`Trend Micro` 首先注意到一波使用 `PCASTLE` 的攻击，这是一种混淆的 PowerShell\
  \ 脚本，主要针对中国境内的系统。`XMRig` 是一种加密货币挖矿恶意软件，曾在 2018 年的多次攻击中被使用。据该安全公司称，在此之后，该活动达到高峰然后趋于平稳\
  \ [5]。在其最基本的形式中，PCASTLE 恶意软件是一种加密货币挖矿木马。当 PCASTLE 木马到达服务器时，它会启动 XMRig 挖矿工具并开始挖掘\
  \ `Monero`（门罗币），这是其首选的加密货币。所有获得的代币都会被转发到攻击者的加密货币钱包。拥有中国 IP 地址的机器占 PCASTLE 攻击的 92%\
  \ [15]。当一种传播方法成功时，第一层 PowerShell 脚本会通过计划任务或 `RunOnce` 注册表键下载。第一层的 PowerShell 脚本将尝试获取脚本中包含的\
  \ URL 列表。PowerShell 命令将被下载、执行并保存为新的计划任务。作为计划任务的一部分，将运行一个 PowerShell 脚本，该脚本将下载并运行第二层\
  \ PowerShell 脚本。下载并执行第三层 PowerShell 脚本后，恶意软件会将设备信息发送到其命令与控制 (C&C) 服务器。基于上述系统信息，第三层\
  \ PowerShell 脚本将下载加密货币挖矿包，并将其加载到自己的 PowerShell 进程中。它还将下载 PCASTLE 脚本部分，该部分负责其他任务，如传播。该活动采用的传播技术与之前的活动类似，但都在单个\
  \ PowerShell 脚本 (PCASTLE) 中，还采用了 `EternalBlue`（永恒之蓝）漏洞利用，以及暴力破解和哈希传递方法。只要存在可感染的系统，感染循环就会持续。例如，该活动利用了一个已修补漏洞的利用代码。因此，在遗留或嵌入式系统中使用虚拟补丁是个好主意。此外，应实施有效的多层防御策略。例如，应实施额外的保护协议，如活动检测，以检测和防止异常例程、未经授权的程序或脚本的执行。\n\
  \n沙箱通过包含不受信任的数据和 Shellcode，有助于防止与恶意软件相关的流量，而防火墙和入侵防御系统可以阻止与恶意软件相关的流量。身份验证和加密机制有助于避免目标应用程序被未经授权地篡改。更强健的账户凭证可以有效减少暴力破解和字典攻击。系统的适当修补和更新非常重要。具有行为监控功能的\
  \ Trend Micro 端点安全解决方案，如 `Smart Protection Suites` 和 `Worry-Free Business Security`\
  \ 解决方案，就是可以帮助保护用户和企业免受这些挑战的工具示例，它们通过检测恶意文件、脚本和消息，以及封锁所有相关的恶意 URL 来实现防护 [3]。\n\n\
  ##### Lemon Duck\n\n根据 `Cisco Talos` 的说法，Lemon Duck 加密货币挖矿恶意软件最近加大了其运营力度，并采用了许多可能被恶意软件检测软件检测到，但对最终用户不明显的技术。Lemon\
  \ Duck 漏洞利用包含加密货币挖矿载荷，它利用计算机资源来挖掘 Monero 虚拟货币。为了在网络中传播，该恶意软件使用多种方法，包括发送受感染的 RTF\
  \ 文件、`psexec`、`WMI` 和 `SMB` 漏洞利用，包括臭名昭著的 `Eternal Blue`（永恒之蓝）和 `SMBGhost` 威胁，这些威胁会损害\
  \ Windows 10 设备。某些版本还支持远程桌面协议 (RDP) 暴力破解。该恶意软件还使用 `Mimikatz` 等工具，帮助僵尸网络增加其挖矿池中的系统数量。PowerShell\
  \ 加载脚本用于传播病毒，该病毒通过 SMB、电子邮件或外部 USB 驱动器从其他受感染系统复制而来。利用 BlueKeep 漏洞的代码也通常存在。该恶意软件拥有由主模块下载和控制的可执行模块，主模块通过\
  \ HTTP 与 C2 服务器交互。挖掘加密货币的恶意软件在被盗计算周期和电力消耗方面代价高昂。虽然组织应专注于保护其最重要的资产，但不应忽视那些不专门针对其基础设施的风险。为了识别诸如加密货币挖矿程序等新的资源窃取威胁，防御者必须持续保持警惕，并跟踪其网络内系统的活动\
  \ [36]。\n\n##### 勒索软件\n\n勒索恶意软件，通常称为勒索软件，是一种阻止个人使用网络或访问文件的恶意软件，要求支付赎金以便用户重新获得对数据库和系统的访问权限。换句话说，勒索软件通常通过加密并冻结受害者的计算机系统来工作，然后索要赎金以解锁。不遵守要求会导致数据永久丢失。网络钓鱼邮件附件、损坏的软件应用、损坏的外部介质和被攻陷的网站都是勒索软件传播的途径。在某些情况下，黑客利用了远程桌面协议和其他不需要任何用户参与的方法。\n\
  \n2019 年 5 月 7 日，美国巴尔的摩市发现其联邦系统遭到了 `RobbinHood` 勒索软件的攻击，该软件锁定了大量关键文件。该市被迫关闭其系统以防止勒索软件扩散，但在那之前，勒索软件已感染了语音信箱、电子邮件和停车费数据库。根据电脑勒索信的打印件，该市只能以每个系统\
  \ 3 个比特币或总共 13 个比特币的价格找回被劫持的数据。初始攻击的后果预计将使该市损失 1000 万美元，此外还因无法处理支付而损失了 800 万美元 [38]。\n\
  \n###### 缓解措施\n\n\n\n\n组织需要制定事件响应计划，以应对勒索软件攻击。应定期执行系统和网络扫描，并将防病毒产品设置为自动更新特征库。为防止网络钓鱼攻击渗透网络，需考虑部署反垃圾邮件解决方案。强烈建议在所有来自外部来源的邮件中使用警示横幅，提醒收件人点击链接和打开附件的风险。如果条件允许，还应考虑使用集中式补丁管理工具。为避免在勒索软件高发系统区域（如临时文件）执行程序，应用程序白名单和有效的软件限制策略\
  \ (SRP) 是必要的。使用虚拟机、逻辑和物理网络隔离以及数据隔离是其他值得考虑的技术。最后，最小权限原则也应严格执行 [27]。\n\n####### 实施系统更新\n\
  \n区块链是作为一款运行在用户计算机上的软件而创建的。该程序必须定期更新，因为区块链程序员会发布更新，用户必须认真下载并安装。未能执行升级的后果因更新类型而异。如果补丁仅为改进功能，未能升级应限制或取消用户访问和与区块链交互的选项。然而，如果更新解决了安全漏洞，未能安装可能会危及用户的区块链账户或整个区块链基础设施\
  \ [26]。\n\n### 节点级攻击\n\n区块链节点与区块链用户类似，因为它们对区块链的保存和维护具有相同的影响。因此，节点容易遭受几乎所有针对用户的潜在攻击。为保护节点，应实施安装防病毒软件、修补和更新软件、验证所有软件配置等做法。\n\
  \n根据 Poston (2020) 的研究，存在许多值得注意的节点级威胁，如下所示 [25]：\n\n*   **软件误配置** 是指软件中的错误或缺陷，可能是有意或无意的，使节点容易受到攻击。\n\
  *   **拒绝服务攻击** 影响处理节点，因为这些节点拥有在区块链中执行共识的权力。因此，针对节点的 DoS/DDoS 攻击可能将大量共识控制权交到攻击者手中。\n\
  *   **恶意交易** 对区块链执行数据交易的能力产生负面影响，这些交易有时来自不可信来源，使区块链容易受到注入攻击等攻击。\n*   **针对区块链的恶意软件**\
  \ 允许攻击者窃取私钥、监控地址、发起 DDoS 攻击，以及/或者过滤或阻碍通信或交易处理。\n*   **共享漏洞** 是另一种可能影响区块链有效运行的威胁。进一步解释，节点是区块链基础设施不可或缺的一部分。区块链平台建立在节点之上，因为节点执行存储、传播和保存区块链数据等功能。\n\
  \n每个节点都是一个用户，这意味着所有适用于用户的安全顾虑也适用于节点。即便如此，由于节点对区块链的参与度更高，安全漏洞对节点的影响可能比对用户更大 [28]。如果节点的私钥被盗，该账户可被用于以攻击者的最佳利益行事来攻击共识算法。如果足够多的节点被攻破（超过\
  \ 50%），攻击者将能够控制区块链 [25]。换句话说，如果一个节点被攻破，可能导致其他节点也被攻破。例如，如果攻击者获得大量节点的访问权限，则攻击者可以篡改共识算法、可用交易或区块，使其有利于攻击者。这种针对节点的攻击称为\
  \ **51% 攻击**。该攻击将控制权交给攻击者，从而削弱并破坏整个生态系统 [2]。\n\n节点未能保持其自身区块链程序副本的最新状态，也可能对区块链安全产生重大影响。节点未能安装功能升级可能导致区块链网络中断，影响共识的达成，导致出现两个保护力度较弱的网络\
  \ [25]。\n\n###### 缓解措施\n\n区块链网络应在其区块创建过程中获取节点共识。在实践中，分叉区块链可能因善意或恶意原因而出现。区块链协议设定为接受拥有最大“工作量”的区块链。构建分叉区块链并使其积累比实际区块链更多工作量的攻击者，可以利用\
  \ 51% 攻击。检查点机制旨在抵御此类攻击，它要求节点定期存储特定区块，并拒绝接受不包含这些区块的任何分叉链 [26]。\n\n一种有助于缓解 51% 攻击的新方法是休眠证明，一种提议的共识协议，无论攻击者的算力如何，均能提供强有力的保护。该建议方法的核心思想是通过引入休眠期\
  \ (AP)，使网络节点退出所有操作。每个广播区块都将被视为初始区块 (IB)，且在 AP 完成前不会被验证。在该新设计中，AP 分为两个阶段，以在大规模 PoW\
  \ 攻击事件中执行两项不同的职责。第一阶段涉及在预定时间内对预定数量的 IB 执行验证测试。第二阶段仅在第一阶段成功时触发。AP 完成后，新验证并选定的区块被添加到区块链，使矿工能够恢复挖矿\
  \ [31]。\n\n由于处理节点也积极参与区块链的维护和安全，它们不仅可能受到与用户类似的安全问题影响，还可能以其他多种方式遭受攻击，例如 MSP 服务配置错误。\n\
  \n**成员服务提供商 (MSP)** 是用于管理区块链网络身份的基本组件。提供商的工作是认证想要加入区块链网络的客户端。MSP 决定谁将使用区块链以及他们在许可型区块链中拥有什么权限。因此，如果存在任何错误或区块链的某部分未正常运行，可能导致访问控制失败。这种失败会使区块链环境容易受到攻击，例如\
  \ DoS/DDoS 攻击。如果 DoS/DDoS 攻击使网络的 MSP 瘫痪，网络可能变得不可用，因为入侵者可以通过攻破 MSP 来控制网络的访问控制。因此，MSP\
  \ 应实施针对 DDoS、勒索软件和其他形式攻击的安全措施 [25]。\n\n\n\n\n### 区块链网络攻击\n\n在区块链网络中，处理节点负责交易处理，并提供区块创建、账本管理等不同服务。矿工将已批准的交易添加到区块中，节点发送和接收这些已批准的交易。攻击者试图在网络中寻找缺陷加以利用，并用于发起各种网络层面的攻击。以下章节将讨论各种网络层面的攻击，包括多数派（51%）攻击、自私挖矿、DDoS\
  \ 及其他攻击，并探讨相应的攻击缓解技术。\n\n#### 成员服务安全\n\n为了在成员服务中增加一层安全防护，`Intel SGX Technology`（英特尔\
  \ SGX 技术）大有裨益。英特尔软件防护扩展（SGX）的远程佐证功能有助于识别区块链上的可信节点。支持 SGX 的成员服务还可改善隐私保护和抵御恶意攻击的防御能力。最后，采用这种硬件辅助技术也可能有助于实现问责制。然而，由于硬件成本高昂，这种方法并不适用于所有成员服务应用\
  \ [13]。\n\n另一种方法是将疑似恶意节点列入黑名单。通常，黑名单上的节点被用作僵尸网络大军的一部分来发动攻击。然而，由于此类恶意节点的数量通常相当庞大，可以考虑采用白名单机制，尽管由于涉及的节点数量往往很大，扩展该过程可能颇具挑战。当物联网服务与设备之间存在隐性信任时，白名单系统将具有可扩展性。受信任的实体通过这种方法在智能合约层面被添加到受信任列表中。因此，任何时候网络上只允许最值得信任的用户。建议的信任方法利用隐性区块链共识过程来建立信任，从而消除了对第三方在两个通信方之间建立信任的需求。该信任范式很简单。它通过将白名单或黑名单\
  \ IP 地址放在公共以太坊区块链上，然后将其传播给其他节点，来宣告 DDoS 攻击 [34]。\n\n#### 网络设计缺陷\n\n区块链网络可以运行在公司的内部网络基础设施上，甚至可以运行在互联网上。使用该基础设施的区块链网络应以满足区块链用户需求的方式进行设计。需要更大的带宽来减少或避免点对点通信的延迟。例如，区块链的设计初衷是允许节点以点对点的方式通信。如果节点位于具有不同安全级别的网络段中，这可能会违反组织的网络安全协议。这可能导致通信重复，或通信被阻断而无法到达其某些对等节点。因此，必须妥善设置网络基础设施，从而保护区块链免受某些攻击\
  \ [17]。\n\n#### 整体网络安全薄弱\n\n区块链网络通过常规网络基础设施进行交互，这意味着区块链的防护取决于底层网络的安全性。因此，即使是针对网络基础设施的物理攻击也可能危及区块链的防护。拥有通信链路或网络组件访问权限的攻击者可能会破坏区块链的运行，从而降低其安全性。组织通信基础设施的物理安全应得到有效保护。网络薄弱的逻辑安全也会影响区块链。私有链可能依赖底层网络的安全控制（防火墙、分段等），并可能变得容易受到攻击者绕过这些控制的攻击。对防火墙和其他组件的控制也可能允许攻击者对区块链网络进行分段，使其容易受到攻击\
  \ [17]。\n\n#### 51% 攻击与双重支付攻击\n\n在该类攻击中，有一组矿工获得了网络大部分的 `hash rate`（算力）。该算力是指区块链网络处理能力的度量单位，进而可能实现区块链操纵，例如阻止交易被验证，从而使其无效。利用这种攻击模式，一条分离链被引入网络，从而使其看起来像一条合法链。此时便启用了\
  \ `double-spending`（双重支付）攻击。双重支付是指恶意用户发送交易的副本使其看起来合法，从而使数字代币能够被花费多次。如前所述，在区块链策略中，适用最长链规则。如果恶意用户在网络中拥有超过\
  \ 50% 的总算力，恶意用户将能够在区块链网络中运行最长链，这正是 51% 攻击所需的比例 [30]。\n\n51% 攻击还能使攻击者通过限制交易和/或取消区块来控制加密货币的价格。过去几年中发生过多起此类攻击事件。2016\
  \ 年，一个名为 `GHash.IO` 的比特币矿池曾获得超过 51% 的总算力控制权。在另一事件中，一个名为 `51 crew` 的攻击者团伙使用相同的攻击方法劫持了两条以太坊区块链。2018\
  \ 年 5 月，恶意矿工获得了 `Bitcoin Gold`（比特黄金）超过 51% 的算力控制权。最后，2018 年 6 月，一些区块链货币也遭到了攻击，其中包括\
  \ `Monacoin`、`Zencash`、`Verge` 和 `Litecoin Cash` [29]。\n\n针对这类攻击，有多种缓解技术，其中一些包括延迟区块提交惩罚、PirlGuard\
  \ 和合并挖矿。以下各节将简要解释这些缓解技术。\n\n##### 延迟区块提交惩罚系统\n\n`A penalty system for delayed block\
  \ submissions`（延迟区块提交惩罚系统）是 Horizen（2018 年）提出的一种安全概念，旨在修改中本聪提出的共识，以保护网络免受 51% 攻击。中本聪共识是一组规则，它结合了拜占庭容错点对点网络上的工作量证明共识算法，以验证区块链网络的真实性。惩罚系统提议大幅增加攻击成本，以阻止潜在攻击者或节点的欺骗行为。因此，根据区块对区块链网络隐藏的时间长度施加惩罚。时间是根据区块之间的间隔长度计算的。在向整个网络通报持续分叉期间，矿工、参与者和交易所被限制执行欺诈性交易，直到延迟被消除。这种方法的主要关注点在于私有挖掘的链，而不关心正遭受分叉困扰的网络\
  \ [30]。\n\n\n\n\n\n##### 延迟工作量证明\n\n**延迟工作量证明** 是针对双重支付问题的另一种控制技术；这是由 **Komodo**\
  \ 提供的一种安全解决方案，也是 dPoW 共识方法开发的催化剂。为了防御针对 Komodo 区块链的 51% 攻击，Komodo 链授权整个链来监管恶意活动。进一步解释，增加了一层额外的安全性，从而防止攻击者执行\
  \ 51% 攻击，因为该安全链的关键属性是它不识别最长链规则。此外，还利用公证节点来验证哈希值对于网络是否安全。作为 dPoW 实施的一部分，全球选出 64 个特殊节点来执行所需任务\
  \ [18]。\n\n##### PirlGuard 系统\n\n**PirlGuard 系统** 是为 Pirl 区块链开发的一种安全协议，旨在解决 51%\
  \ 攻击问题。该系统受 Horizen 惩罚系统启发，一旦攻击者通过私下挖矿过程创建了一条替代的更长链，并将其提交给处理节点，PirlGuard 系统将检测到欺诈尝试并丢弃恶意节点。然后，恶意对等节点将受到惩罚，被要求挖掘一定数量的惩罚区块。惩罚区块的数量根据攻击者通过私下挖矿创建的区块数量来确定。负责公证区块链的\
  \ Pirl 主节点也充当此类惩罚的执行者，以维护 Pirl 区块链上公平客观的共识机制。\n\n##### ChainLocks\n\n**ChainLocks**\
  \ 是为 DASH 加密货币开发的一种安全技术，旨在提供针对双重支付攻击的保护，同时提供即时交易确认。为了扩展活跃链，每个参与者都需要对广播的区块进行签名。独特的区块由大多数参与者（60%\
  \ 或以上）验证，并生成 P2P 消息（**CLSIG**），以通知网络中每一个其他节点有关该事件。除非有足够数量的成员确认其有效性，否则无法生成 **CLSIG**。因此，有效的真实性签名包含在消息中，网络中的所有节点都可以验证签名。一旦达到确认，交易就无法作废或撤销。除了\
  \ 51% 攻击，ChainLock 技术还有助于缓解各种安全问题，例如自私挖矿。\n\n##### 合并挖矿\n\n**合并挖矿** 是另一种对低算力加密货币有益的技术。此类加密货币的算力可以通过将其引导至具有更高算力的其他一种或多种货币来增加。这种合并过程有助于缓解\
  \ 51% 攻击。该过程涉及将区块链分类为父链和辅助链，其中两个网络是顺序进行的。此外，另一个好处是矿工能够同时挖掘多个区块，同时增强网络安全性。重申一下，使用合并挖矿技术构建了额外的安全性，因为两种加密货币的所有矿工都为总算力做出了贡献。中本聪原则的假设是区块链网络将始终包含大多数诚实节点。然而，这一假设被证明是错误的，因为除了矿池之外，单个攻击者也可能实现超过一半的网络算力\
  \ [30]。\n\n### DoS 攻击\n\n在区块链上执行 DoS 攻击极其困难，因为区块链没有单点故障。这种类型的攻击只有在网络中存在可促进攻击的瓶颈时才会发生\
  \ [1]。通常，区块链在特定大小范围内并以特定速率创建区块。攻击者可以创建大量垃圾交易，从而可能削弱网络。交易容量可能成为故障点，从而招致可能的 DoS 攻击。下文讨论的\
  \ DoS 攻击类别包括交易洪水攻击、出块者 DoS 攻击、许可链 MSP DoS 攻击和人为难度增加攻击。\n\n*   **交易洪水攻击** 围绕向网络发送大量交易，从而增加等待添加到区块的交易队列大小。\n\
  \n*   **人为难度增加** 基于攻击者试图通过投入额外计算资源暂时增加区块链上工作量证明共识的难度级别，以推高所有其他节点的 PoW 难度，然后在 PoW\
  \ 难度增加后移除额外计算资源，从而在区块链上制造流量拥堵。\n\n*   **出块者 DoS 攻击** 涉及对权益证明区块链上的下一个出块者执行传统的 DoS\
  \ 攻击，以阻止区块被添加到链上。\n\n*   **许可链成员服务提供商 DoS 攻击**，顾名思义，是指对许可链 MSP 发起 DoS 攻击，以导致用户被拒绝访问区块链。\n\
  \n针对各种类型 DoS 攻击的缓解措施因其实施方式而异。对于交易洪水攻击，用户应尝试通过故意创建额外区块或等待攻击结束来清除队列中的洪水交易。对于人为难度增加，应持续监控并相应调整难度级别，以尽量减少攻击的影响。对于许可链成员服务提供商\
  \ DoS 攻击，可以对节点应用传统的 DoS 保护技术。此类传统做法包括构建更强大的网络基础设施，或更加重视更强的网络安全 [32, 24]。\n\n####\
  \ 日食攻击\n\n在日食攻击中，单个节点与网络的其余部分隔离。因此，日食攻击助长了双重支付 [24]。攻击者使用虚假的连接请求，强制连接重启，从而显著增加开销。在这种类型的攻击中，攻击者设法完全控制节点对分布式账本和网络操作的视图\
  \ [7]。攻击者通常会对隔离节点执行双重支付攻击，或者可能执行拒绝服务攻击。攻击者也可能选择利用该节点的计算资源为自己的利益服务，这与区块链的共识算法有关。为了执行有效的日食攻击，攻击者可能需要适当的位置、额外的算力、规模或恶意软件。位置在日食攻击中很有帮助，因为攻击者可能有能力在用户消息到达区块链网络的其余部分之前，使用\
  \ WiFi 网络或物理电缆拦截这些消息。\n\n\n\n\n为了缓解日蚀攻击，应增加连接数量，从而降低攻击者能够控制用户所连接的所有节点的概率。可以使用白名单策略，将连接限制在已知或受信任的节点上。适当的缓解策略应提高日蚀攻击更容易被检测到的几率，从而缩短其持续时间。如果可能的话，另一个有用的策略是使用许可制的私有区块链（取决于用例），以减少恶意节点进入网络的可能性，从而使此类基于规模的攻击更难以实施\
  \ [32]。\n\n#### 重放攻击\n\n在重放攻击中，攻击者伪造两个有效方之间的消息交换，从而获取访问权限。换句话说，攻击者窃取哈希密钥并再次使用它，使自己看起来像是一个有效用户\
  \ [12]。为了帮助确保合法用户的真实性和权威性，交易时会使用数字签名，因为攻击者无法伪造数字签名，从而使伪造交易失效。攻击者利用重放攻击获取当前交易，并将其作为最新交易重新提交给区块链。由于初始交易是合法的，其数字签名的有效性会被区块链接受。通过重放交易导致资金发送给攻击者，攻击者便能获得双重支付\
  \ [26]。\n\n重放攻击涉及在两条不同区块链上存在相同的交易。例如，当加密货币分叉为两种独立货币时，用户可能在两个账本上拥有相同的资产。为了进行交易，用户可以选择任一条链。攻击者在一个账本上嗅探交易数据，并将其在另一个账本上重放。例如，在以太坊中，在一条区块链上签名的交易对所有以太坊区块链都是可接受的。因此，用户在测试网络上进行的交易可能被攻击者在公共网络上复制。因此，以太坊通过在交易中使用\
  \ `chainID` 采取了防止重放攻击的对策 [29]。\n\n一些区块链使用一次性公私钥对，而其他区块链则使用基于椭圆曲线的加密，以帮助改进对重放攻击的检测\
  \ [12]。通过在每笔交易期间在区块链中使用 nonce（一次性数字）或唯一值，安全性可以得到显著提高。添加 nonce 值的机制是这样工作的：被重放的交易应具有新的\
  \ nonce，否则将不被接受。请注意，攻击者任何篡改 nonce 值的尝试都会导致数字签名无效，从而导致区块链网络拒绝该交易 [26]。\n\n#### 路由攻击\n\
  \n路由攻击涉及将两个或更多隔离的群体分割开来。一旦实现，信息传输就会被延迟。这种攻击策略有助于执行 51% 攻击、DOS 攻击和双重支付攻击。去中心化可用于防止此类攻击。如果一个连接被入侵，则所有其他节点都会受到影响，但如果存在去中心化，可以移除受影响的那个节点，从而阻止攻击\
  \ [24]。\n\n为了缓解路由攻击，可以创建多宿主节点。这意味着节点与两个或更多不同的网段保持连接，以增加攻击者分割网络的难度。连接到不同网段中其他节点的节点越多，攻击者需要控制的通信通道就越多。如果用户使用受信任的通信或为与其他网段中的节点通信而选择的已知路由，则攻击者将无法使用边界网关协议来破坏节点通信。使用加密通信通道也有助于确保攻击者没有机会监控网络以影响网络通信。此外，网络统计监控应当有效，以便检测攻击者试图制造大量网络延迟的尝试，因为这是发起各种攻击的前提条件\
  \ [26]。\n\n#### 女巫攻击\n\n女巫攻击是指操纵在线系统，攻击者试图在特定区块链网络上运行多个节点。在这里，所有节点均由一人（攻击者）控制，攻击者可能会选择拒绝区块传输，从而阻止用户向网络添加数据\
  \ [1]。在女巫攻击中，恶意用户建立大量伪造节点，这些节点在网络上的其他节点看来似乎是真实的。网络上用于验证未经授权交易的虚假节点充当损害网络的参与者。互联网协议地址、虚拟机等各种设备被用作攻击网络的欺诈节点。女巫攻击者旨在通过创建各种虚假身份来破坏\
  \ P2P 网络，其假设是每个参与节点代表单个真实身份。因此，攻击者获得了拒绝传输区块的能力，从而覆盖真实节点 [30]。在发生大规模女巫攻击的场景中，攻击者控制网络大部分的算力。攻击者可能会更改交易的编号，从而阻止交易被确认。因此，可能会启用双重支付攻击。\n\
  \n共识算法有助于防止此类攻击，因为它使得攻击者因成本过高而难以实施女巫攻击。此外，可以对向网络添加数据的参与者进行验证和授权，以核实网络参与者的诚实度。最后，使用许可制或私有区块链可以防止攻击者在区块链上创建虚假账户\
  \ [1]。\n\n### 区块链系统层攻击\n\n区块链系统层攻击发生在区块链基础设施的系统层。此类攻击的根本原因通常可追溯到后端的编码错误。系统层区块链攻击包括整数溢出、时间扭曲、缓冲区越界和竞争条件攻击，下文将进一步解释\
  \ [26]。\n\n#### 整数/缓冲区溢出攻击\n\n缓冲区溢出攻击涉及未经授权的代码执行，因为黑客会使用缓冲区未包含的内存空间，从而导致函数指针执行恶意脚本。缓冲区溢出是最常见的任意代码执行漏洞类型之一。在大多数情况下，黑客可以利用缓冲区溢出覆盖应用程序内存中的敏感设置，导致访问权限提升\
  \ [10]。\n\n\n\n\n##### 缓冲区溢出攻击\n\n缓冲区溢出攻击被用于*比特币黑客攻击*。由于比特币是一种加密货币，它必须验证交易，即发送方钱包中的价值数量是否小于发送方钱包中的金额。一个整数溢出问题允许异常大的交易金额绕过旨在检测此类情况的一组内部控制。入侵者利用这一缺陷发起了一笔转账，将\
  \ 1840 亿枚比特币发送到攻击者控制的账户。此举使攻击者控制了有史以来创建的所有比特币供应量的 98%，实际上摧毁了该货币的价值。比特币网络决定回滚区块链以撤销攻击。这是一个关键决定，因为分布式账本旨在不可更改，但回滚操作是维护加密货币价值完整所必需的。该漏洞利用演示了在部署前对区块链程序进行彻底的端点保护的重要性。整数溢出漏洞是一个众所周知的编程问题，本可以在安全审计期间被发现\
  \ [26]。\n\n###### 缓解措施\n\n缓冲区溢出是由编程错误引起的；因此，控制它们的理想方法是更好地教育开发人员如何避免它们。安全编码教科书和各种相关最佳实践都涉及了缓冲区溢出。采用内存安全的编程语言、框架和库（它们能提供可能导致缓冲区溢出的函数的安全版本）是缓解缓冲区溢出漏洞的技术示例。应用程序设计师应采用\
  \ `ASLR`（地址空间布局随机化）和 `PIE`（位置无关可执行文件）；两者都利用可执行文件和地址放置来限制缓冲区溢出攻击的威胁。`ASLR` 最初是为返回导向编程而创建的，其工作原理是通过随机化内存位置使结构偏移量更难以确定\
  \ [35]。编译器标志和扩展也应被使用。然而，这些技术均无法提供绝对的安全性；因此，应定期采取分层安全方法，涉及安全团队的代码审查和应用程序安全审计 [10]。\n\
  \n#### 时间戳攻击\n\n区块链节点具有内置计数器，允许它们跟踪网络时间。在引导阶段，通过从相邻对等节点获取版本消息并确定其中位数来计算网络时间。如果相邻节点的中位时间因任何原因超过\
  \ 70 分钟，网络时间计数器将重置为系统时间，从而为网络犯罪分子创造了机会。攻击者可以通过修改每个区块上的时间戳来操纵区块的网络时间。结果，该区块将与网络断开连接\
  \ [23]。\n\n*Verge 黑客攻击*使用了时间戳攻击。进一步解释，*Verge* 是一种致力于保护用户隐私的加密货币。Verge 通过创造性地组合其某些内置功能而被黑客攻击，例如其难度更新、灵活的时间戳和共识算法。攻击者利用这三个组件控制了\
  \ Verge 区块链。由于区块链上缺乏同步时间服务器，节点可以接受时间戳比当前时间滞后 2 小时的区块或交易。黑客利用这一特性，将隔块的时间戳改为一小时前，使\
  \ Verge 区块的生成速度看起来比预期慢得多。结果，攻击者挖矿算法（`scrypt`）的复杂度大大降低。因此，`scrypt 挖矿` 变得异常简单，从而允许黑客利用不到网络\
  \ 10% 的处理资源发动 51% 攻击。Verge 通过将时间戳窗口从 2 小时缩减至 15 分钟，找到了修复该问题的解决方案。结果，攻击者对挖矿难度的影响被降低。从这次漏洞利用中吸取的最重要教训是，复杂性可能会损害安全性。Verge\
  \ 加密货币中结合的上述三个要素促成了此次攻击。该黑客事件还展示了时间扭曲攻击的成功潜力，以及频繁调整挖矿难度的危险 [26]。\n\n###### 缓解措施\n\
  \n锁定时间帧的上限是限制时间戳攻击的关键组成部分，使用系统时间而非网络时间也是如此。此外，接受的时间帧应仅限于已知和受信任的用户 [22]。\n\n####\
  \ 缓冲区越界攻击\n\n缓冲区是软件在处理或传输前使用的临时存储区域。然而，一些程序员忽视了对它们的充分保护。因此，缓冲区攻击仍然是最常见的攻击之一。当读取和写入操作在缓冲区内存区域之外执行时，会发生越界读取和写入。未经授权的安全漏洞和写入软件的其他部分可能导致不可预见的后果\
  \ [37]。\n\n*EOS 漏洞*利用了缓冲区越界攻击。进一步解释，EOS 是一个开源智能合约系统。作为智能合约平台，EOS 软件必须能够解码和执行智能合约文件。由于其解析函数中存在缓冲区越界写入缺陷，恶意智能合约能够滥用\
  \ EOS 区块链软件。该缺陷由 *Qihoo 360* 研究人员发现并报告给 EOS 开发人员。他们的概念验证表明，其地址空间布局随机化（`ASLR`）可通过远程\
  \ Shell 绕过。结果，区块链网络及所有运行它的节点可能被完全攻破。EOS 开发人员能够在其 *GitHub* 页面上提供补丁，而无需担心该弱点被利用，因为\
  \ EOS 尚未发布。发现的漏洞强调了外部代码审查的重要性，以及不安全的智能合约平台如何允许恶意智能合约滥用区块链软件的节点 [26]。\n\n###### 缓解措施\n\
  \n使用一种能防止此漏洞发生或提供易于避免此漏洞的构造的语言，是一个很好的第一步。此外，在运行或编译程序时，使用能够消除或抵消缓冲区溢出和越界的工具或扩展也极为推荐。在循环中使用缓冲区时，需要检查缓冲区边界，以确保不允许写入已分配空间之外\
  \ [11]。\n\n#### 竞态条件攻击\n\n\n\n\n\n##### 竞态条件攻击与区块链安全最佳实践\n\n###### 竞态条件漏洞\n\n黑客利用系统竞态条件从在线银行、经纪公司、加密货币交易所，甚至免费的星巴克咖啡中窃取资金！在计算和区块链术语中，竞态条件是指最初应按顺序执行的两段代码以乱序方式执行的任何情况。进一步解释，在此类攻击中，调度算法能够在线程执行之间切换，因此难以预测执行序列将是什么样子。当竞态条件影响攻击者利用的安全组件，从而在适当的控制完成之前创建出执行敏感事件的情况时，竞态条件被视为一种漏洞。由于这一事实，竞态条件漏洞有时被称为\
  \ `time of check/time of use`（检查时间/使用时间）漏洞。换一种说法，为了绕过访问限制，可以采用竞态条件攻击。黑客经常对金融机构网站发起竞态条件攻击。如果在资金转账、现金提取或信用卡支付等关键功能上发现竞态条件，黑客可能会获取大量资金\
  \ [[19]](#ch21.xhtml#r465)。\n\n###### Lisk 漏洞\n\n`Lisk 漏洞` 涉及一起竞态条件攻击。Lisk 是一种容易遭受攻击的代币，该攻击利用了两个内置功能。进一步展开，Lisk\
  \ 使用用户公钥 SHA-256 哈希的最后 64 位作为其区块链地址。在用户执行交易之前，该地址不会在区块链上链接到特定的公钥。由于向账户汇款不会将地址链接到公钥，因此该系统变得脆弱。一些仅有正余额的账户保持未被触动状态。找到可链接到特定地址的公钥最多需要\
  \ 2 的 64 次方次操作，“错误”可能允许黑客认领一个单独的地址。\n\n在发现该问题后，Lisk 开发人员发布了通知，概述了该问题并鼓励个人采取措施将其账户地址链接到公钥。然而，Lisk\
  \ 仍然容易遭受此类利用，包括竞态条件，即攻击者试图在为其提供资金的首笔交易和发送价值以认领它的交易之间获取地址 [[26]](#ch21.xhtml#r472)。\n\
  \n###### 缓解措施\n\n应锁定资源，以确保两个进程同时发生，并且不会因乱序执行而引发问题。此外，遵守安全编码和安全原则（如最小权限原则），并定期检查代码，将降低软件被攻破的几率\
  \ [[19]](#ch21.xhtml#r465)。\n\n### 区块链安全最佳实践\n\n各种攻击及其最佳实践列在 表 13.1–13.4 中。\n\n\
  #### 表 13.1 基于用户的攻击和最佳实践\n\n| **基于用户的攻击** | **适用攻击** | **最佳实践** |\n| --- | --- |\
  \ --- |\n|  | 私钥丢失 | • 可使用钱包来解决私钥安全问题，因为钱包可用于存储私钥。<br>• 应采用密钥轮换策略来解决私钥丢失问题 [[33]](#ch21.xhtml#r479)。\
