  \ C | C | C | R |\n\n#### 第三阶段：我们想要达到什么位置？\n\n本阶段评估当前企业环境，作为实施区块链解决方案的一个步骤。它设定改进目标并执行差距分析，以识别潜在区块链解决方案的价值。应在本阶段制定适合区块链项目的高层变革赋能计划。还应创建有效的沟通策略，以解决各个群体对愿景、收益、影响、目的和利益相关方参与的关切。\n\
  \n应制定区块链路线图以实现实施愿景。应记录来自各团队成员的反馈并采取适当行动（参见 **表 11.5** 和 **表 11.6**）。\n\n**表 11.5**\
  \ 第三阶段：目标、描述、任务、输入、资源和输出\n\n##### 第三阶段描述 – 我们想要达到什么位置？\n\n| 阶段目标 | 确定区块链项目目标范围内流程的能力。确定“现状”与“目标状态”之间的差距，并将其转化为改进机会。利用这些信息创建详细的区块链业务案例和实施区块链的高层项目计划。\
  \ |\n| :--- | :--- |\n| 阶段描述 | 基于对当前状态流程能力的评估以及将目标与企业目标对齐，应确定实施区块链的适当目标能力。应评估当前状态与未来状态实施之间的差距，并识别改进措施。\
  \ |\n\n###### 持续改进 (CI) 任务\n\n*定义改进目标：*\n\n1. 基于企业绩效和合规性，决定实施过程中流程的目标能力水平。\n2. 内部基准测试以识别可采用的最佳实践。\n\
  3. 对目标水平进行合理性检查，判断什么是可取的/可实现的，以创造积极影响。\n\n*分析差距：*\n\n1. 将当前能力水平与目标能力水平进行比较。\n2.\
  \ 寻找模式以识别可通过区块链实施解决的改进根本原因。\n\n*识别潜在改进：*\n\n1. 汇总实施过程中当前状态与拟议未来状态之间的差距。\n2. 识别通过区块链实施可能产生的风险，并确保其被接受在一定水平内。\n\
  \n###### 变革赋能 (CE) 任务\n\n*描述并沟通成果：*\n\n1. 确保利益相关方有参与的意愿。\n2. 制定沟通策略以优化变革认知度。\n3.\
  \ 强调实施区块链的愿景和收益。\n4. 在沟通中将计划目标与其实施实现方式联系起来。\n\n###### 项目管理 (PM) 任务\n\n1. 设定项目方向，以及实施区块链的方向范围。\n\
  2. 识别因实施可能产生的风险。将范围调整至最优水平。\n3. 考虑因该变革赋能可能产生的影响。\n4. 确保预算并定义角色和职责。\n\n###### 输入\n\
  \n1. 经商定的目标及对对齐目标的影响。\n2. 风险接受和风险概况。\n3. 利益相关方分析。\n4. 内部和外部能力基准。\n5. 核心团队已组建并分配了角色和职责。\n\
  6. 挑战和成功因素。\n\n###### 输出\n\n1. 改进机会描述。\n2. 高层项目计划。\n3. 跟踪项目和绩效的指标。\n4. 详细业务案例。\n\
