  \ | **最佳实践** |\n| --- | --- | --- |\n|  | 51% 攻击（多数攻击） | • 延迟区块提交的惩罚制度将要求任何用户为延迟区块提交支付罚款。会考虑区块被隐藏的时间长短，并据此处以罚款。<br>•\
