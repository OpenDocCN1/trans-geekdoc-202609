- pgno: 96
  md: 'is based on isolating different levels of information through text transformations.
    We find that after randomly shuffling words in the LLM-generated responses, we
    observe a minimal decline in classification accuracy. This suggests that a substantial
    portion of distinctive features is encoded in the word-level distribution. We
    then highlight distinct sets of characteristic phrases that are consistently associated
    with each LLM. We also find that markdown formatting contributes to a moderate
    degree of idiosyncrasies in LLMs following post-training.


    At the same time, we obtain over 90% accuracy when the word distribution is disrupted
    through transformations that preserve semantics, such as rephrasing or translating.
    Even with the most aggressive transformation – summarizing, classification accuracy
    remains well above chance-level guess. This finding implies that semantic information
    also shapes the idiosyncrasies in LLMs. Through open-ended language analysis,
    we provide further insights into these characteristics. For instance, ChatGPT
    has a preference for detailed, in-depth explanations, whereas Claude produces
    more concise and direct responses, prioritizing clarity.


    Last, we discuss the broader implications of our findings. One should be cautious
    when using synthetic data to train LLMs, as we show that many of these idiosyncrasies
    can be inherited in such a process. Our framework also serves as a tool for assessing
    model similarities among frontier models, either open-source or proprietary. In
    addition, we discuss how the idiosyncrasies in LLMs can be used maliciously to
    manipulate voting-based leaderboards, therefore highlighting the need for more
    robust evaluation methodologies.


    # 5.3 Evaluating Idiosyncrasies in LLMs


    Large Language Models (LLMs) share several core characteristics. The majority
    of them are based on the Transformer architecture [1], which we consider in this
    paper. Second, they are trained using an auto-regressive objective [2], where
    they predict the next token in a sequence based on preceding context. Lastly,
    their training datasets significantly overlap, often incorporating vast and diverse
    sources such as Common Crawl, Wikipedia and Stack Overflow. Given these similarities,
    it is natural to ask: do LLMs speak in the same way? If not, how can we effectively
    measure the degree of their differences?


    To address these questions, we construct a synthetic task focused on classifying
    outputs from different LLMs. Consider N LLMs, denoted as f1, …, fN, where each
    fi takes an input prompt p and outputs a text completion o. For a given dataset
    D of prompts, the outputs produced by each LLM fi are denoted as Oi. We approach
    this problem with a straightforward setup. For N output sets Oi, we formulate
    a N-way classification task, where the objective is to predict which LLM produced
    each output. If outputs of different LLMs were drawn from the same distribution,
    classification accuracy would not be better than random chance. Thus, we use the
    classification performance of this synthetic task as a measure of idiosyncrasies
    in LLMs.


    Our task is formulated as a sequence classification problem, for which fine-tuning
    BERT-style models is a common approach [251]. In this work, we fine-tune a more
    recent and competitive sequence embedding model based on decoder-only Transformers:
    LLM2vec [207]. We attach a N-way classification head to the extracted embeddings
    and use LoRA-based fine-tuning to both the model weights and the linear head.
    Input sequences are truncated to a maximum length of 512 tokens. We evaluate the
    model’s performance on a held-out validation set and report the'
