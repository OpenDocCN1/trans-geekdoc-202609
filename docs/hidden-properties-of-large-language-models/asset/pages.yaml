    # 5.4.3 Semantics


    **Rewriting.** One potential reason for the high classification accuracy is the
    unique writing style (e.g., word choice, sentence structure) of each LLM. To isolate
    this factor, we leverage another LLM (e.g., GPT-4o mini) to rewrite LLM responses.
    Our rewriting approaches include (see Chapter 5.7.10 for example responses after
    rewriting):


    +   - Paraphrasing: *Paraphrase the above text while maintaining the semantic
    meaning of the original text.*

    +   - Translating: *Translate the above text into Chinese.*

    +   - Summarizing: *Summarize the above text in one paragraph.*'
