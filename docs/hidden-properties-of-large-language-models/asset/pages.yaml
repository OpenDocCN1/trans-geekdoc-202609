    # 3.7 Related Work


    **Network Pruning and Sparsity.** Pruning is a popular technique for compressing
    neural networks through the elimination of weights, yielding sparse networks [77,
    78]. It can be broadly categorized into *structured* and *unstructured* approaches.


    Structured pruning methods [50, 51, 55, 93, 94, 125, 142], sometimes referred
    to as activation pruning [49, 67], remove entire structured components of a network,
    facilitating efficient GPU speedups. Some existing methods [46, 47] have explored
    structured pruning based on activation statistics of neuron/filter output, e.g.
    percentage of zero activations [48] and activation mean [119]. Recently, [112]
    have studied structured pruning of LLMs. [56, 91] and [60] have demonstrated the
    existence of prompt-dependent and task-specific sparsity in the structural components
    of LLMs, e.g., attention heads and MLP neurons.


    Unstructured methods [66, 81, 116, 117, 118, 123] like magnitude pruning operate
    at the individual weight level, maintaining performance even at higher sparsity
    levels. Existing pruning methods usually require either modifications to the training
    procedure [68, 85], retraining the pruned networks to regain accuracy [54, 74],
    or an even more computationally intensive iterative retraining process [80, 82].
    However, scaling these methods to LLMs with billions of parameters presents a
    challenge, as the required training process demands substantial computational
    resources [64, 106].


    **Pruning with Limited Data.** Most related to our approach is a recent line of
    work on pruning with limited data [73, 75, 76, 83]. Such methods require no modification
    to the original training procedure and also no retraining of the pruned networks
    on the full training dataset. The primary aim of these methods is to preserve
    performance during the pruning procedure, assuming access to a limited and small
    amount of data, also referred to as the calibration data. In order to mitigate
    the accuracy drop, a layer-wise reconstruction problem [73] is solved to minimize
    the change of output evaluated on the calibration data. Existing solvers [75,
    84] for the layer-wise reconstruction problem rely on heavy computation of second-order
    Hessian inverses, which do not scale to the large hidden state size of LLMs. SparseGPT
    [59] develops an efficient weight update procedure for LLMs via synchronized second-order
    Hessian updates.


    **Emergent Properties of LLMs.** Our work is also related to recent studies on
    the existence of large magnitude outlier features in large language models [90,
    120, 135, 136, 137, 138]. [58]'
