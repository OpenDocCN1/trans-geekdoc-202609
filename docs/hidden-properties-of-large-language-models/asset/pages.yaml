    # Why these layers and tokens?


    The fact that these activations act as biases may explain why LLMs store them
    at certain layers and tokens:


    +   - The tendency of these activations to appear at the starting token could
    be attributed to the fact that every autoregressive training instance contains
    an initial token. Since LLMs are based on next word prediction, the starting token
    is the only token used in all forward passes within a sequence.

    +   - The existence of these activations in delimiter tokens might be due to the
    relatively low semantic value of these tokens, rendering them a low-cost option
    for storing such biases. Conversely, tokens with rich semantics would risk significant
    loss of input information, if they are repurposed to store biases.

    +   - The fact that massive activations emerge only after a few initial layers
    may be because LLMs would require some initial layers to process the meaning of
    the tokens associated with massive activations. At these layers, their semantics
    may be transferred to other token positions via self-attention, and preserved
    moving forward.


