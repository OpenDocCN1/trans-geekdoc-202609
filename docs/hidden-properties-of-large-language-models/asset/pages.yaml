  md: 'Equation 4.2, we decompose the attention output at each token $k$ into two
    parts: value updates from the tokens $\mathcal{C}$ where attention is concentrated;
    and value updates aggregated from other tokens.


    Attention$(Q, K, V)_k = \sum_{i \le k} p_i^k v_i = \sum_{i \in \mathcal{C}} p_i^k
    v_i + \sum_{i \notin \mathcal{C}} p_i^k v_i \quad (4.2)$


    where $p_i^k$ is the attention distribution of query token $k$ to token $i$, and
    $v_i$ is the value state of token $i$.


    Figure 4.10 visualizes the decomposed value updates and the attention output in
    LLaMA2-7B, with the input prompt “Summer is warm. Winter is cold.”. In this case,
    the set $\mathcal{C}$ consists of token `Summer` and the first period token. We
    can see that the value updates from $\mathcal{C}$ are nearly identical across
    tokens, i.e., they serve as additive bias terms, although not explicitly imposed.
    Furthermore, we note that this pattern of value update is strikingly similar across
    various inputs. We refer the reader to Chapter 4.8.7 for additional analysis.
    Overall, our results indicate that LLMs use massive activations to allocate substantial
    attention at certain tokens. These tokens are then utilized to form a constant
    bias term when computing the attention output.


    # 4.5.3 Explicit Attention Biases Eliminate Massive Activations


    Given the strong need of LLMs to learn implicit attention biases during pretraining,
    we thus experiment with directly augmenting self-attention with additional bias
    terms. Intriguingly, we find that models augmented with explicit attention biases
    do not exhibit massive activations.


    **Formulation.** The idea is to model such attention biases explicitly, except
    not through repurposing existing tokens in the input sequence. Thus we introduce
    additional *learnable* parameters $\mathbf{k}''$, $\mathbf{v}'' \in \mathbb{R}^d$
    for each head. Specifically, given input query, key and value matrices $Q, K,
    V \in \mathbb{R}^{T \times d}$, the augmented attention with explicit attention
    biases is computed as:


    Attention$(Q, K, V; \mathbf{k}'', \mathbf{v}'') = \text{softmax}\left( \frac{Q
    \begin{bmatrix} K^T & \mathbf{k}'' \end{bmatrix}}{\sqrt{d}} \right) \begin{bmatrix}
    V \\ \mathbf{v}''^T \end{bmatrix} \quad (4.3)$


    where $\mathbf{k}''$ and $\mathbf{v}''$ are each concatenated with the key and
    value matrices $K/V$. The proposed attention can be used as a drop-in replacement
    of standard attention, without modifying other parts of Transformers, e.g., positional
    embeddings and MLP blocks.


    **Results.** We train three GPT-2 models: the standard model, GPT-2 prepended
    with a sink token [190] and GPT-2 with explicit attention biases. See Chapter
    4.8.8 for training setups. We find that the three models have the same performance
    at convergence but differ significantly in the status of massive activations,
    as demonstrated in Figure 4.11. Notably, in GPT-2 with explicit attention biases,
    massive activations disappear, as compared to the default GPT-2 and one with a
    sink token.


