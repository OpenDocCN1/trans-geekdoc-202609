  md: '[183] found sparse activation patterns in ViTs that attract attention to certain
    tokens. Our work provides an in-depth analysis as to why these patterns emerge,
    specifically in relation to massive activations.


    **Biases in self-attention.** There can be various notion of biases in the self-attention
    mechanism. First, simple additive bias terms can be used in linear layers for
    computing the query, key and value states [182]. Second, position biases can be
    inserted in self-attention to encode positional information of each token [180,
    181]. There are also variants of biases with manually designed softmax operator
    [164, 187, 194]. Our work reveals that LLMs, even with standard self-attention
    formulation, would impose implicit bias components in the attention computation
    through massive activations.


