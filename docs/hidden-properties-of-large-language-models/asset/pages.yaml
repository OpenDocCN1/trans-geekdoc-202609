  md: 'image datasets). [234] conducted hypothesis testing on sets of model outputs
    to check whether the underlying LLMs were identical. The most relevant work to
    us is [235], which proposed VibeCheck to understand user-aligned traits in LLM
    outputs. They found that LLMs often vary in styles, such as being more formal
    or friendly. In contrast, our work aims to identify broader generalizable patterns
    to interpret the high classification performance.


    # 5.7 Additional Results


    # 5.7.1 Implementation Details


    # 5.7.2 Response Generation


    We report our procedure for generating responses from chat APIs, instruct LLMs,
    and base LLMs. For chat APIs, we access a stable version of each model, including
    GPT-4o-2024-08-06, Claude-3.5-Sonnet-20241022, Grok-Beta, Gemini-1.5-Pro-002,
    and DeepSeek-Chat, through its official API between November 28, 2024, and February
    6, 2025, generating responses with their default sampling setting. For instruct
    LLMs, we use greedy decoding to sample outputs. For base LLMs, we set the temperature
    to T = 0.6 and apply a repetition penalty of 1.1 to avoid repetitive completions.


    # 5.7.3 Training Setup


    In this part, we describe our fine-tuning process using the text embedding models
    on LLM responses. We use the first 512 tokens of each generated response for training
    and evaluation. To perform sequence classification, we add a linear layer as the
    classification head on top of each text embedding model. For ELMo, BERT, LLM2vec,
    this layer is applied to the average embeddings over all tokens in a sequence.
    For T5 and GPT-2, we follow the original setups [2, 208] and apply the head on
    the output of the last token.


    For smaller text embedding models, such as ELMo, BERT, T5, and GPT-2, we fine-tune
    the entire model along with the classification head, searching over base learning
    rates {3e-3, 1e-3, 3e-4, 1e-4, 3e-5, 1e-5, 3e-6, 1e-6}. For the largest LLM2vec
    model, we employ the parameter-efficient LoRA [134] fine-tuning method with a
    rank of 16, LoRA α of 32, a dropout rate of 0.05, and a base learning rate of
    5e-5. Table 5.11 details our basic training recipe.


    # 5.7.4 Prompts for Open-ended Language Analysis


    We detail the procedures of our open-ended language analysis in Section 5.4.3.
    Given the same input, we sample a pair of responses from two LLMs and present
    them, along with an analysis prompt (see Figure 5.11a), to an LLM judge for comparison.
    To avoid the LLM judge exploiting any prior knowledge of the models, we anonymize
    model identities using an index distribution. This process is repeated for 35
    response pairs, yielding a set of detailed analyses. Finally, we use the summarization
    prompt (see Figure 5.11b) to distill these analyses into 5 bullet points that
    characterize the idiosyncrasies of each model.'
