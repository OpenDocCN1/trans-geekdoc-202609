    # 4.8.6 Attention LayerNorm


    Our analysis in Section 4.5.2 indicates that tokens associated with massive activations
    have drastically different key and value states. In this part, we investigate
    how attention layernorm plays a crucial role in this process.


    Preliminaries. There are two specific types of layer normalization commonly used
    in LLMs. One is the standard layer normalization [31]. Suppose we have a feature
    vector x ∈ ℝ^d, LayerNorm will normalize this feature to fix the mean and variance
    and then re-scale with element-wise affine transformation:


    x̄_i = (x_i - μ)/σ * g_i + b_i,    where μ = (1/d) Σ_{i=1}^d x_i,    σ = sqrt(
    (1/d) Σ_{i=1}^d (x_i - μ)^2 ).    (4.4)


    where g, b ∈ ℝ^d are parameters of the affine transform, also called the gain
    and bias.


    In addition to the original LayerNorm, a variant of layer normalization has also
    been used in LLaMA2 and Mistral models. Specifically, Root Mean Square Normalization
    (RMSNorm) [176]'
