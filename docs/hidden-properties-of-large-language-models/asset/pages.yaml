    # **Generalization to out-of-distribution responses.**


    We find that our classifiers generalize robustly to responses beyond their training
    distribution. To evaluate this, we collect responses from instruct LLMs across
    four diverse datasets: *i.e.*, UltraChat, Cosmopedia [274], LmsysChat [275], and
    WildChat [278]. These datasets originate from different sources and are designed
