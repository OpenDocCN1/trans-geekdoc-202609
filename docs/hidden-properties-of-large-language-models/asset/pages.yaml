  md: '# 4.8.10 Registers are Biases in Masked Autoencoders


    In Masked Autoencoders (MAEs) [193], a dummy token is added to ViTs during pretraining.
    In one fine-tuning pipeline of MAEs, fine-tuning is done based on the average
    pooled features of all patch tokens. In these MAE models, this dummy token is
    equivalent to a register token. Here we maintain the register token features as
    constant across the output features of all layers in ViTs, which we denote as
    Fix-Reg-Mean. These fixed values are computed as the average register features
    over 10k ImageNet training images. Table 4.6 shows the results. We can see that
    setting register features to fixed values does not affect model performance. This
    result further supports our argument that registers function as biases within
    ViTs.


