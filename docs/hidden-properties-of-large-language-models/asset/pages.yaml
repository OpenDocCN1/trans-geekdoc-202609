- pgno: 26
  md: 'defined as follows:


    Attention(Q, K, V) = softmax( (Q K^T) / sqrt(d_k) ) V  (2.3)


    Here the output of the attention head is a tensor of the same shape as the query,
    key and value representations, Q, K and V, which is B × T × D_h.


    It is important to note that in decoder-only Transformers, each token is restricted
    to attending only to itself and all preceding tokens in the sequence. A causal
    mask is applied to the attention scores (i.e., the inner product of query and
    key states), to prevent the model from attending to future tokens. In practice,
    this can be achieved by masking out the attention scores of the future tokens
    (e.g., setting them to −∞) before applying the softmax operation.


    As the name suggests, multi-head self-attention involves multiple self-attention
    heads. Each head uses a different linear projection layers to obtain the query,
    key and value representations. In practice, the outputs of all the self-attention
    heads are then concatenated together into a single tensor of shape B × T × D.
    Then the concatenated embeddings are transformed via a output linear projection.
    Formally, the multi-head self-attention block is defined as follows: (suppose
    we have h heads)


    head_i = Attention(X W_i^Q, X W_i^K, X W_i^V)  (2.4)


    where W_i^Q, W_i^K, W_i^V ∈ ℝ^{D×D_h} are the linear projection matrices for the
    i-th head.


    MultiHead(Q, K, V) = Concat(head_1, ..., head_h) W^O  (2.5)


    where W^O ∈ ℝ^{h D_h × D} is the output linear projection matrix. The output of
    the multi-head self-attention block is a tensor of shape B × T × D, where D is
    the embedding dimension. This is the same as the input hidden states X coming
    from the previous layer.


    # Feed-Forward Network (FFN)


    Besides the multi-head self-attention block, each Transformer block also contains
    a sub-block consisting of a feed-forward network (FFN). Different from self-attention
    blocks, FFN blocks are applied to each token position separately in parallel.
    The FFN consists of fully-connected layers with a non-linear activation function,
    such as GeLU [42].


    FFN(x) = GeLU(X W^{up}) W^{down}  (2.6)


    where W^{up} ∈ ℝ^{D×D_FFN} is a up projection layer that projects the feature
    embedding vectors to a larger dimension D_FFN from D. W^{down} is a down projection
    layer that projects the intermediate FFN hidden states back to the same dimensions
    as the input tensor X.


    It is worth noting that recent LLMs (e.g., Llama [22, 23, 25]) use a variant of
    the FFN [27], which is defined as follows:


    FFN(x) = (SiLU(X W^{gate}) · X W^{up}) W^{down}  (2.7)


    where W^{gate}, W^{up} ∈ ℝ^{D×D_gate} are two linear projection layers of the
    same shape. The output of these two linear projection layers are then multiplied
    in a point-wise manner. Here SiLU is a non-linear activation function proposed
    in [43]. Mathematically, this activation function is defined as SiLU(x) = x ·
    sigmoid(x).'
