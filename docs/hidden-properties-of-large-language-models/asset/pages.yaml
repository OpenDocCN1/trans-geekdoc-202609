  md: '# Chapter 1


    # Introduction


    Large Language Models (LLMs) are a class of machine learning models trained with
    self-supervision on enormous amounts of text. The origin of LLMs began with the
    Transformer [1] model introduced in 2017. This model removed recurrence, used
    purely self-attention, and was originally designed for neural machine translation.
    In 2019, GPT-2 [2] was released by OpenAI, which brought widespread attention
    to LLMs. By design, GPT-2 is a decoder-only Transformer and trained with an auto-regressive
    objective on large corpora. Although small in size compared to today’s models,
    GPT-2 showed strong performance on various tasks, such as translation, summarization
    and simple question answering. More importantly, its simple design made it easy
    to scale and to perform inference with prompt-based natural language inputs. Since
    then, the development of LLMs has followed scaling laws, where larger models trained
    on more data generally perform better. Later models, such as GPT-3 [3] in 2020
    and GPT-4 [4] in 2023, continue to showcase amazing capabilities achievable by
    LLMs.


    To date, LLMs have made a substantial impact on our daily lives. Chatbots based
    on LLMs, like ChatGPT [5] and DeepSeek [6], are now being widely used all around
    the world. They have also spurred various applications, such as Cursor and Manus,
    that are aimed to significantly improve the human workflow. Even more, the goal
    of achieving Artificial General Intelligence (AGI) feels closer than ever, thanks
    to ever-increasing performance of LLMs. For researchers in machine learning and
    deep learning, the success of LLMs has led to a paradigm shift - from training
    supervised models to large-scale self-supervised representation learning. Another
    important lesson learnt from the development of LLMs is the importance of scaling
    laws - simple and scalable methods coupled with more compute and data, which continue
    to shape progress in AI beyond language domain, e.g., Sora [7] and Whisper [8].


    While the impact of LLMs is undeniable, our primary mode of interaction and even
    much academic research on these models remain frustratingly superficial. In most
    real-world applications, users interact with these models through black-box APIs
    – providing a question as input and receiving an answer from APIs or chatbots
    in return. While this interface is convenient, there is little visibility into
    the internal processes behind generating these responses. In academic research,
    much of the focus on LLMs remains at the black-box level, examples include fine-tuning
    models for better performance [24, 134], developing new prompting strategies [9,
    11, 33], and building evaluation benchmarks for new tasks [12, 35]. While these
    efforts are necessary and important, they offer limited insight into how LLMs
    actually function. Beyond performance, a scientific'
