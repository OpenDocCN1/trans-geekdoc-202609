    Further, we conduct intervention analysis to analyze the role of registers. We
    replace *all* register features at the output of *every* layer with their means,
    averaged over 10k ImageNet training images. This intervention removes the intended
    purpose of registers to aggregate global input information [191]. Table 4.5 shows
    the results. We find that ViTs with fixed register features achieve accuracy comparable
    to original models, suggesting that registers act as learned biases in ViTs. This
    leads to constant key and value states at register tokens, effectively introducing
    bias terms to self-attention (extra k'' and v'' in Equation 4.3). Thus a ViT with
    register tokens function equivalently to a standard ViT augmented with explicit
    attention biases.


    To summarize our findings:


    *Massive activations exist in many but not all ViTs. Similar to those in LLMs,
    these activations act as constant biases. We also show the recently proposed register
    tokens have a similar function.*


    # 4.7 Related Work


    **Intriguing properties of autoregressive Transformers.** [135] observed that
    in GPT-2’s penultimate layer, there are feature dimensions containing activations
    with magnitudes up to 3,000. They found that these few dimensions dominate several
    standard measures for evaluating representation similarity. [163] found that the
    feature norm of the initial token in GPT-2 grows much faster than other tokens.
    [90] and [189] demonstrated the existence of outlier weights in the LayerNorm
    of GPT-2 and LLaMA2-13B and showed that setting them to zero leads to catastrophic
    drop in model performance. Notably, the feature dimension of this weight in LLaMA2-13B
    (i.e., 2100) corresponds to that of a massive activation (Figure 4.2).


    **Outlier features.** Various existing works in quantization [57, 58, 150, 154,
    184] have studied the existence of outlier features in LLMs. [58] showed that
    outlier features have large activation values in most of their sequence dimensions.
    While massive activations can be seemingly similar to outlier features, we discussed
    their fundamental differences in Section 4.3.3. More importantly, we show that
    massive activations can not be attributed to the existence of outlier features.


    **Attention concentration patterns.** [195], [196] and [136] discovered that attention
    in BERT [18] tends to focus on the “separate” token [SEP]. [190] showed that LLMs
    assign most of the attention to the starting word token. [191] revealed the existence
    of attention artifacts in ViTs.'
