    and WildChat capture real-world user interactions, while UltraChat consists primarily
    of synthetic responses. For each dataset, we train a classifier on a group of
    model responses and evaluate the classifier across all four datasets. We use instruct
    LLMs for this experiment. As shown in Table 5.3, our classifiers generalize well
    across different datasets, indicating that they learn very robust and transferable
    patterns.


