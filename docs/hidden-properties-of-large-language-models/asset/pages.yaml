    # 5.7.7 Characteristic Phrases


    We provide additional results for characteristic phrases as presented in Section
    5.4.1. We follow the same methodology in Figure 5.6 to extract characteristic
    phrases of instruct and base LLMs. Specifically, we train a four-way logistic
    regression classifier on the TF-IDF features of their responses and use the coefficients
    to select important phrases of each model.


    As shown in Figure 5.14, each instruct LLM contains quite distinct characteristic
    phrases. For example, Llama frequently employs terms “including” and “such as”
    to introduce specific examples in the output, whereas Gemma tends to engage with
    users using phrases “let me” and “know if”. In contrast, the extracted phrases
    from base LLMs are less distinctive, primarily consisting of common words such
    as “the”, “to”, and “you”.


    Figure 5.15 illustrates the distribution of first word choices in instruct and
    base LLMs. Similar to chat APIs (Figure 5.7), instruct LLMs display varied distributions.
    However, base LLMs exhibit substantial overlap in their most frequent first words,
    e.g., “the”, “and”, “of”, “to”, and “in”.'
