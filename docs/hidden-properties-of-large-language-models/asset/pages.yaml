  md: '# Chapter 2


    # Background


    In this chapter of the thesis, we will provide an overview of the background information
    necessary to understand the content of this thesis. We will introduce the basic
    concepts of what constitutes a Large Language Model (LLM). We will then discuss
    the process and key elements of building these models, including their architecture,
    training, and inference procedures.


    # 2.1 Definition


    A Large Language Model (LLM) is a machine learning model trained to understand
    and generate natural language. By its definition, these models are able to take
    text sequences as inputs and generate natural language outputs. It is worth noting
    that many of the frontier LLMs [13, 14] are now extended to take multimodal inputs,
    such as images and audios and also generate multimodal outputs. In this thesis,
    we will focus on the text-in and text-out LLMs.


    LLMs are statistical models that assign a probability distribution to a sequence
    of input tokens. Tokens represent the basic text units, for example, words and
    sub-words. We use x1, x2, …, xT to denote a sequence of tokens. The LLM predicts
    the next token by outputting a probability distribution


    $P(x_t|x_1, x_2, \dots, x_{t-1})$  (2.1)


    over the vocabulary of tokens. Due to the chain rule of probability, the joint
    probability of a sequence of tokens can be expressed as:


    $P(x_1, x_2, \dots, x_T) = P(x_1)P(x_2|x_1)P(x_3|x_1, x_2)\dots P(x_T|x_1, x_2,
    \dots, x_{T-1})$  (2.2)


    Note that each term here can be treated as a classification task. This probability
    is obtained via the Transformer model. In practice, training LLMs is done by maximizing
    the log-likelihood over a large corpus of the text data. Through this autoregressive
    training process, the model learns to understand natural language and generate
    coherent text.


    # 2.2 Architecture


    LLMs are based on the Transformer architecture [1], which has driven most of the
    progress in AI over the past decades. While there are recent advances in language
    modeling architecture, for'
