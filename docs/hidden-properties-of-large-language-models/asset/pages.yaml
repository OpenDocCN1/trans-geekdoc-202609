    Figure 4.4: Three largest activation magnitudes and the median magnitude at each
    layer in LLMs.


    # 4.3.1 Which Layers?


    We determine the layers whose output hidden states exhibit massive activations.
    In Figure 4.4, we visualize the three largest activation magnitudes and the median
    of the hidden state output of each layer, with results averaged over 100 sequences.
    We examine three models: LLaMA2-7B, 13B and Phi-2 [161] (see Chapter 4.8.4 for
    more LLMs). In all cases, each of the top three activations comes from the same
    position in the hidden state across most of the middle layers. Generally, we observe
    the following:


    *Massive activations exist and remain as largely constant values throughout most
    of the intermediate layers. They emerge in the initial layers and start to diminish
    in the last few layers.*


    In LLaMA2-7B, massive activations first appear in layer 2 and remain nearly constant
    values until layer 30. Intriguingly, for LLaMA2-7B and 13B, massive activations
    emerge very rapidly from one layer of computation, e.g., layer 2 and layer 4 respectively.
    This means that they do not emerge as a result of gradual accumulation through
    many layers, and are caused by a rather different mechanism.


    # 4.3.2 Which Feature and Sequence Dimensions?


    We determine the locations of massive activations within hidden states, i.e.,
    their feature and sequence dimensions. Since we have shown that their values largely
    stay constant in middle layers, we take on any such layer for this analysis.


    **LLaMA2-7B.** In this model, massive activations are identified in two feature
    dimensions (1415 and 2533). Regarding sequence dimensions, we find that *massive
    activations appear at: 1. the starting word token, 2. the token representing the
    first period ( . ) or newline token ( \n ) in the sequence.* Figure 4.1 illustrates
    these findings for LLaMA2-7B. This is also consistent on long sequences. In cases
    where the input contains a “ . ” or “\n” token, four massive activations are observed.
    For the less common scenario where neither “ . ” nor “\n” is present, we can see
    two massive activations, both of which are associated with the initial token.


