- pgno: 132
  md: '# Chapter 6


    # Conclusion


    In this dissertation, we conducted a thorough and systematic study of Large Language
    Models (LLMs), despite their inherently complex and opaque nature. Through this
    work, we uncovered several important hidden properties of LLMs and revealed the
    internal mechanisms behind these properties. These findings significantly advance
    our understanding of LLMs and offer valuable insights for the development of future
    models.


    The weight space is a fundamental component of deep learning models, with modern
    LLMs often comprising billions of parameters. In Chapter 3, we demonstrate the
    intrinsic sparsity of the LLM weight space. We examine the counterintuitive phenomenon
    that the popular magnitude pruning method fails drastically on LLMs. We find that
    magnitude pruning overlooks emergent activation outliers common in LLMs. Motivated
    by this, we propose Wanda, a simple pruning approach that jointly considers weight
    magnitudes and input activations. We use Wanda to find efficient and sparse subnetworks
    from pretrained LLMs, without inducing any changes to the preserved weights.


    Unlike static weight parameters, activations are dynamic, and LLMs use these internal
    representations to encode input data. In Chapter 4, we reveal the widespread presence
    of massive activations – structured outliers in the activation space of LLMs.
    We conduct a comprehensive analysis of these activations. Through intervention
    analysis, we show these activations function as crucial, input-agnostic biases.
    Furthermore, we find that they are closely connected to the attention concentration
    patterns, and we propose an alternative attention formulation that augments self-attention
    with learnable key and value embeddings. We show that pretraining with this modified
    attention mechanism eliminates massive activations.


    Finally, LLMs are interesting because of their ability to generate natural language
    outputs. In Chapter 5 of the thesis, we examine the output behaviors of LLMs,
    where we are mainly motivated by understanding the differences between models
    beyond benchmark performance. We develop a conceptually simple framework to evaluate
    idiosyncrasies in LLM generations – a synthetic classification task with a goal
    of predicting the origin of a given output. Using this framework, we find that
    outputs from different LLMs are highly distinguishable: they can be distinguished
    with extremely high accuracies. We further identify concrete forms of these idiosyncrasies,
    including word-level distributions, formatting style and high-level semantics.
    Finally, we discuss how our findings have implications for the use of synthetic
    data, model similarity inference, and the design of more reliable evaluation protocols.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'While this dissertation is centered on large language models (LLMs), the problems
    investigated and methodologies used span a diverse range of topics, including
    sparsity, pruning, quantization, deep learning architectures, and linguistics.
    By examining these topics through the lens of LLMs, the insights and approaches
    developed in this thesis provide a solid foundation for future research efforts
    aimed at understanding advanced deep learning models. This will be increasingly
    relevant as the field continues to evolve.


    # 6.1 Future Directions


    We conclude this thesis by discussing several potential future directions based
    on our findings.


    # Sparsity and efficiency


    Researchers have long studied sparsity in neural networks. However, sparse neural
    network face a practicicle challenge where unstructured sparsity is not natively
    supported by modern GPU hardware. This leads to a significant gap between theoretical
    and practical efficiency. Therefore an important question is how to bridge this
    gap and unlock the potential of sparsity for accelerating LLMs. One promising
    direction is via a special type of sparsity, called structured sparsity. Structured
    sparsity [139] is a type of fine-grained weight sparsity that is supported by
    latest NVIDIA GPUs. However, as we have shown in Chapter 3, structured sparse
    LLMs are not as effective as unstructured sparse ones. Moreover, there still remains
    a large performance gap between structured sparse models and their dense counterparts.
    A natural question is whether we can leverage the insights from our work to design
    more effective pruning methods for structured sparsity.


    Another promising direction is to explore the sparse property beyond weight parameters.
    Some of the questions we can ask are: are the activations of LLMs also sparse?
    If so, can we leverage the activation sparsity to make the training or inference
    of LLMs more efficient? Moreover, this analysis can be extended to the gradients
    during training. If gradients are sparse, we can significantly reduce the communication
    cost in distributed training, which is highly desirable as we continue to scale
    up LLMs.


    # Low-precision training


    In addition to sparsity, quantization is another important direction for improving
    the efficiency of deep learning models. Unlike sparsity, which is less explored
    in the context of LLMs, quantization has been widely studied and adopted, especially
    for model development. However, most of the existing methods rely on post-training
    quantization, where a pretrained full-precision model is quantized after training.
    Low-precision training has been less explored, due to the training instability
    that arises from low-precision weights and activations. Our findings in Chapter
    4 reveal one such bottleneck: the existence of extreme activation outliers.


    This raises a natural question: how can we better understand the training dynamics
    under low-precision regimes, and can we develop methods to improve their stability?
    At the moment, we are seeing 8-bit floating-point (8-bit FP) as the most common
    low-precision format for pretraining LLMs [6]. In the future, we may see even
    lower precision formats, such as 4-bit floating point or even binary representations.
    In these extereme quantization settings, what are the fundamental challenges,
    and how can we design effective mitigation strategies? We hope our work can provide
    some valuable insights on these directions.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Evaluating frontier models


    We are living in an era where frontier LLMs are being developed at a rapid race,
    with frequent model releases and steady increase in benchmark performance. However,
    this raises a key challenge: how should we meaningfully evaluate progress, especially
    as benchmarks can be saturated over time. Moreover, recent studies highlight limitations
    and potential flaws in popular benchmarks [28]. Our work in Chapter 5 explores
    one aspect of this question, where we propose a framework to evaluate and understand
    model differences. Going forward, how do we capture these differences in a scalable
    way remains a question, given that reasoning models have much longer outputs and
    agentic systems can have long trajectories. Ultimately, the research community
    needs to find fair and reliable methods to evaluate these advanced models, which
    is important for guiding the future development of frontier models.'
