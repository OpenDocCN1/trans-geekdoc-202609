    # 5.3.1 Main Observations


    We observe surprisingly high accuracies by neural networks to classify LLM outputs.
    This observation is robust across different settings, e.g., across model families
    and sizes.


    We describe the LLMs we use to generate the output datasets O₁,...,N. For a comprehensive
    and fair comparison across model families, we categorize three groups of LLMs:


    +   1. Chat APIs (“chat”): This category includes state-of-the-art LLMs that are
    primarily accessible via APIs. We consider GPT-4o [13], Claude-3.5-Sonnet [15],
    Grok-2 [16], Gemini-1.5-Pro [263], and DeepSeek-V3 [6]. For simplicity, we refer
    to them as ChatGPT, Claude, Grok, Gemini and DeepSeek. Their architectures and
    weights remain proprietary and undisclosed, with the exception of DeepSeek.

    +   2. Instruct LLMs (“instruct”): These models are trained to generate high-quality
    responses from human instructions. We consider four LLMs of similar sizes across
    different families: Llama3.1-8b [25], Gemma2-9b [198], Qwen2.5-7b [261] and Mistral-v3-7b
    [173]. We will refer to them as Llama, Gemma, Qwen and Mistral.

    +   3. Base LLMs (“base”): These are base versions of instruct LLMs. They are
    obtained by pretraining on extensive text corpora without any post-training stage.


    Throughout the paper, we refer to these three categories as “chat”, “instruct”,
    and “base” respectively. For a given prompt dataset, we collect 11K text sequences,
    splitting them into 10K for training and 1K for held-out validation. The same
    split is used across all LLMs. For chat APIs and instruct LLMs, we generate outputs
    from UltraChat [225], a diverse dialogue and instruction dataset. For base LLMs,
    we synthesize new texts using prompts from FineWeb [223], a high-quality LLM pretraining
    dataset. More details on response generation are in Appendix 5.7.2.


    **Across model families.** In Table 5.1, we report the results for classifying
    outputs from various combinations of chat APIs (Table 5.1a) and instruct / base
