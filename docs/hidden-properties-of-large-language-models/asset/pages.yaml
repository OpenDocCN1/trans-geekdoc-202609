- pgno: 93
  md: '# 4.9 Conclusion and Discussion


    Autoregressive training of large Transformers has brought significant advances
    in natural language processing. This study reveals the widespread existence of
    *massive activations* in these Large Language Models (LLMs). The values of these
    activations are input agnostic but crucial for model performance, despite their
    extremely rare quantity. We establish a close connection between massive activations
    and the self-attention mechanism. We show that LLMs use them to implement an implicit
    form of biases for attention computation. Our findings also generalize well to
    Vision Transformers (ViTs). We hope the new results presented in this work contribute
    to a deeper understanding of today’s large-scale foundation models.


    We discuss some practical implications and future directions of this work. First,
    the presence of activations with large magnitudes has been widely known as a major
    challenge in effectively quantizing LLMs [57, 58]. This paper identifies a new
    type of outlier activations in LLMs, and we hope our findings will be of value
    to research on LLM compression. Second, attention maps that allocate excessive
    attention probabilities to a few fixed tokens may be undesirable for mechanistic
    interpretability [186]. Our proposed attention formulation could make the resulting
    attention maps in LLMs more interpretable, and potentially benefit downstream
    applications [191]. Finally, our investigation of the new attention formulation
    is focused on its effects on massive activations, and our experiments were limited
    to a small GPT-2 model due to computational resource constraints. It would be
    interesting to see how our results generalize to models at larger scales, and
    how our attention formulation could affect the training stability [167] of modern
    LLMs.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Chapter 5


    # Idiosyncrasies in Large Language Models


    # 5.1 Overview


    In this work, we unveil and study idiosyncrasies in Large Language Models (LLMs)
    – unique patterns in their outputs that can be used to distinguish the models.
    To do so, we consider a simple classification task: given a particular text output,
    the objective is to predict the source LLM that generates the text. We evaluate
    this synthetic task across various groups of LLMs and find that simply fine-tuning
    existing text embedding models on LLM-generated texts yields excellent classification
    accuracy. Notably, we achieve 97.1% accuracy on held-out validation data in the
    five-way classification problem involving ChatGPT, Claude, Grok, Gemini, and DeepSeek.
    Our further investigation reveals that these idiosyncrasies are rooted in word-level
    distributions. These patterns persist even when the texts are rewritten, translated,
    or summarized by an external LLM, suggesting that they are also encoded in the
    semantic content. Additionally, we leverage LLM as judges to generate detailed,
    open-ended descriptions of each model’s idiosyncrasies. Finally, we discuss the
    broader implications of our findings, including training on synthetic data, inferring
    model similarity, and robust evaluation of LLMs. Code is available at github.com/locuslab/llm-idiosyncrasies.


    # 5.2 Introduction


    As the adoption of generative models such as LLMs accelerates, it becomes increasingly
    important to understand the origin and provenance of such generated content. While
    a great deal of past work has focused on the classification of human-written and
    AI-written content [228, 243, 244, 245], there has been little work on classifying
    between content generated by different LLMs, either between the outputs of entirely
    different models or between those of different variants of the same model family.
    If possible, the ability to distinguish between source models in this manner would
    be valuable for a number of applications: it could shed light on the relative
    uptake of different LLMs, beyond what is reported by individual companies, and
    on the nature of data used to build different models. Additionally, it could offer
    insights into what features the output generation are most “unique” to each LLM.


    In this paper, we investigate whether LLMs exhibit idiosyncrasies that enable
    their outputs to'
