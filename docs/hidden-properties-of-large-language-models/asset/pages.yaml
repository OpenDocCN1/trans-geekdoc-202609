    Figure 3.1: Illustration of our proposed method Wanda (Pruning by Weights and
    activations), compared with the magnitude pruning approach. Given a weight matrix
    W and input feature activations X, we compute the weight importance as the elementwise
    product between the weight magnitude and the norm of input activations (|W| ·
    ||X||₂). Weight importance scores are compared on a per-output basis (within each
    row in W), rather than globally across the entire matrix.


    considered another popular approach for compressing neural networks. However,
    it has received relatively little focus in compressing LLMs. This seems to contradict
    the trend of model compression in the pre-LLM era, where both approaches have
    received large amounts of research effort. A quick review of existing pruning
    methods reveals a possible reason: they typically require retraining [74, 95],
    training from random initializations [67, 70, 79] or even an extensive iterative
    process [69, 80]. The sheer amount of computational resources required by LLMs
    limits these methods. A recent LLM pruning approach, SparseGPT [59], does not
    require traditional retraining, but still demands a computationally intensive
    weight update process.


    The argument concerning the need for retraining and weight update does not fully
    capture the challenges of pruning LLMs. One might reasonably expect to obtain
    a fairly high-performing initialization point for retraining using existing popular
    pruning methods. However, a recent study [59] finds that magnitude pruning [66],
    a well-established pruning approach, fails dramatically on LLMs even with relatively
    low levels of sparsity. Considering the past success of magnitude pruning on smaller
    networks, this result suggests that LLMs, despite having 100 to 1000 times more
    parameters, are substantially more difficult to prune directly.


    In this work, we address this challenge by introducing a straightforward and effective
    approach, termed Wanda (Pruning by Weights and activations). This technique successfully
    prunes LLMs to high degrees of sparsity without any need for modifying the remaining
    weights. We are motivated by an observation from a recent study [58], where a
    small subset of hidden state features are exceptionally large in magnitude, a
    property unique to LLMs. We find that augmenting the standard weight magnitude
    pruning metric with the input activations, is surprisingly effective as a measure
    for evaluating the weight importance. Specifically, we introduce a novel pruning
    metric, where each weight is evaluated by the product of its magnitude and the
    norm of the corresponding input activations, estimated using a small set of calibration
    data. Our method uses this metric to induce sparsity in pretrained LLMs by comparing
    weights locally within each output of linear layers and removing lower priority
    weights. Our approach is computationally efficient, able to be executed in a single
    forward pass, and requires minimal memory overhead.


    We empirically evaluate Wanda on the widely adopted LLaMA [22] and LLaMA-2 [23]'
