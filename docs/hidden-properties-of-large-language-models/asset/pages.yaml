  md: '# Chapter 4


    # Massive Activations in Large Language Models


    # 4.1 Overview


    We observe an empirical phenomenon in Large Language Models (LLMs)—very few activations
    exhibit significantly larger values than others (e.g., 100,000 times larger).
    We call them *massive activations*. First, we demonstrate the widespread existence
    of massive activations across various LLMs and characterize their locations. Second,
    we find their values largely stay constant regardless of the input, and they function
    as indispensable bias terms in LLMs. Third, these massive activations lead to
    the concentration of attention probabilities to their corresponding tokens, and
    further, implicit bias terms in the self-attention output. Last, we also study
    massive activations in Vision Transformers. Code is available at https://github.com/locuslab/massive-activations.


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_56_0.png)


    Figure 4.1: Activation Magnitudes (z-axis) in LLaMA2-7B. x and y axes are sequence
    and feature dimensions. For this specific model, we observe that activations with
    massive magnitudes appear in two fixed feature dimensions (1415, 2533), and two
    types of tokens—the starting token, and the first period (.) or newline token
    (\n).'
