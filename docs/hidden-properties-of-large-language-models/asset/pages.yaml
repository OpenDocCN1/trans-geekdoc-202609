    # 5.4 Concrete Idiosyncrasies in LLMs


    We have shown that modern neural networks can achieve excellent accuracies in
    classifying which LLM generates a given response. Here we leverage classical text
    similarity metrics – ROUGE-1 [266], ROUGE-L [266], and BERTScore [18] – to quantify
    lexical differences between LLM outputs. We compute the mean F1-score for each
    metric across all response pairs generated by any two different chat API models
    given the same prompt. For comparison, we also measure the similarity between
    responses sampled within the same model. As shown in Table 5.7, responses from
    different LLMs exhibit lower text similarities than those from the same model.


    |  | across LLMs | within an LLM |

    |---|---|---|

    | ROUGE-1 | 0.499 | 0.660 |

    | ROUGE-L | 0.256 | 0.414 |

    | BERTScore* | 0.220 | 0.482 |


    Table 5.7: **Text similarity scores.** We evaluate the text similarity of LLM
    outputs using ROUGE-1, ROUGE-L, and BERTScore. * We follow [267] to rescale BERTScore
    with respect to the human baseline. The results indicate that responses from different
    LLMs exhibit low lexical similarity.


    In the following, we identify concrete idiosyncrasies in LLMs across three dimensions:
    words and letters, markdown formatting elements, and semantic meaning. For each
    dimension, we apply text transformations to isolate potential idiosyncrasies and
    assess their impacts on classification performance. We then highlight specific
    patterns within each dimension that distinguish LLMs.'
