    LLMs are not as effective as unstructured sparse ones. Moreover, there still remains
    a large performance gap between structured sparse models and their dense counterparts.
    A natural question is whether we can leverage the insights from our work to design
    more effective pruning methods for structured sparsity.


    Another promising direction is to explore the sparse property beyond weight parameters.
    Some of the questions we can ask are: are the activations of LLMs also sparse?
    If so, can we leverage the activation sparsity to make the training or inference
    of LLMs more efficient? Moreover, this analysis can be extended to the gradients
    during training. If gradients are sparse, we can significantly reduce the communication
    cost in distributed training, which is highly desirable as we continue to scale
    up LLMs.


    ## Low-precision training


    In addition to sparsity, quantization is another important direction for improving
    the efficiency of deep learning models. Unlike sparsity, which is less explored
    in the context of LLMs, quantization has been widely studied and adopted, especially
    for model development. However, most of the existing methods rely on post-training
    quantization, where a pretrained full-precision model is quantized after training.
    Low-precision training has been less explored, due to the training instability
    that arises from low-precision weights and activations. Our findings in Chapter
    4 reveal one such bottleneck: the existence of extreme activation outliers.


    This raises a natural question: how can we better understand the training dynamics
    under low-precision regimes, and can we develop methods to improve their stability?
    At the moment, we are seeing 8-bit floating-point (8-bit FP) as the most common
    low-precision format for pretraining LLMs [6]. In the future, we may see even
    lower precision formats, such as 4-bit floating point or even binary representations.
    In these extreme quantization settings, what are the fundamental challenges, and
    how can we design effective mitigation strategies? We hope our work can provide
    some valuable insights on these directions.

