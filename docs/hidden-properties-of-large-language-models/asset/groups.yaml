    ## 4.5.3 Explicit Attention Biases Eliminate Massive Activations


    Given the strong need of LLMs to learn implicit attention biases during pretraining,
    we thus experiment with directly augmenting self-attention with additional bias
    terms. Intriguingly, we find that models augmented with explicit attention biases
    do not exhibit massive activations.


    **Formulation.** The idea is to model such attention biases explicitly, except
    not through repurposing existing tokens in the input sequence. Thus we introduce
    additional *learnable* parameters $\mathbf{k}''$, $\mathbf{v}'' \in \mathbb{R}^d$
    for each head. Specifically, given input query, key and value matrices $Q, K,
    V \in \mathbb{R}^{T \times d}$, the augmented attention with explicit attention
    biases is computed as:


    $$\text{Attention}(Q, K, V; \mathbf{k}'', \mathbf{v}'') = \text{softmax}\left(
    \frac{Q \begin{bmatrix} K^T & \mathbf{k}'' \end{bmatrix}}{\sqrt{d}} \right) \begin{bmatrix}
    V \\ \mathbf{v}''^T \end{bmatrix} \quad (4.3)$$


    where $\mathbf{k}''$ and $\mathbf{v}''$ are each concatenated with the key and
    value matrices $K/V$. The proposed attention can be used as a drop-in replacement
    of standard attention, without modifying other parts of Transformers, e.g., positional
    embeddings and MLP blocks.


