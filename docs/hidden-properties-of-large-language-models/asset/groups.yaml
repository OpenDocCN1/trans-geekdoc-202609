    in Figure 5.2.


    We count the occurrence of a markdown formatting element in each response. We
    then plot the distribution of these counts over all responses in Figure 5.8. Each
    model exhibits a unique way to format its responses. For instance, Claude (yellow)
    has a high density at zero in the bold text and header count distributions, indicating
    that it generates many responses without bold texts or headers. On the contrary,
    other LLMs exhibit lower values at zero and thus decorate text with these formatting
