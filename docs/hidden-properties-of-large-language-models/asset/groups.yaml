    # Post-Training


    Post-training is the process of refining and optimizing the pretrained LLMs. While
    pretraining LLMs learn general language representations, pretrained LLMs are not
    able to follow human instructions and produce coherent texts. Therefore, in order
    for these models to be useful in practice, post-training is a critical process
    that aligns these pretrained models with human preferences.


    There are two popular post-training paradigms: supervised fine-tuning and the
    alignment stage. Supervised fine-tuning (SFT) is the process of adapting pretrained
    LLMs to specific tasks or domains by training them on curated datasets of interest.
    For instance, one can fine-tune a pretrained LLM on dialogue data for it to become
    a helpful assistant. SFT is typically done via supervised learning, meaning that
    the training data consists of input-output pairs. However, in many cases, labeled
    data is resource intensive to collect. What’s more, supervised fine-tuning is
    not able to generalize well outside the training domain. In practice, SFT is often
    used in conjunction with alignment approaches.


    The alignment stage aims to adapt LLMs to better match human preferences. Typically,
    this is done via reinforcement learning (RL) fine-tuning to learn from feedback
    data, such as reinforcement learning from human feedbacks (RLHF) [26] and reinforcement
    learning from AI feedbacks (RLAIF) [29]. The model is optimized via reward signals
    that reflect the quality of their own generations. This reinforcement learning
    process encourages the model to produce outputs that are more helpful and aligned
    with human values.


    # 2.4 Inference


    We describe the inference procedure of LLMs. It typically consists of two main
    steps: pre-filling and decoding.


    # Pre-filling


    This is the stage where the model processes the entire input prompt before autoregressive
    decoding. In the pre-fill stage, the model receives the full prompt and passes
    all the input tokens through the network in a single forward pass. No prediction
    is performed in this stage. During pre-filling, the key and value states of the
    input tokens at each Transformer layer are cached for the decoding stage. These
    key and value states are also known as KV cache, which allows the model to reuse
    key and value states of existing processed tokens in the sequence without recomputation.


    # Decoding


    Decoding is the process of generating the output sequence token by token in an
    autoregressive fashion. At each token prediction, the model predicts the next
    token by sampling from the predicted probability distribution over the entire
    vocabulary. There can be various sampling strategies. One common strategy is greedy
    decoding, a deterministic process where the token with the highest probability
    is always selected as the next token. Another popular method is temperature sampling,
    which uses a temperature parameter to control the randomness of the probability
    distribution: a higher temperature means more random outputs, while a lower temperature
    makes the output more deterministic.'
