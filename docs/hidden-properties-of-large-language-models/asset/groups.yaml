    # 3.5 Experiments


    Models and Evaluation. We evaluate Wanda on the two most widely adopted LLM model
    families: LLaMA 7B/13B/30B/65B [22] and LLaMA-2 7B/13B/70B [23] (LLaMA-2 34B is
    not released). Results for prior LLM families can be found in Chapter 3.8.2. We
    measure the performance of pruned models on zero-shot tasks and language modeling.
    For zero-shot evaluation, we use seven tasks from EleutherAI LM Harness [52].
    Following previous works on LLM compression [57, 59], we evaluate the perplexity
    on the held-out WikiText [63] validation set.


    Baselines. We compare Wanda with two prior pruning approaches. Magnitude pruning
    [66] is a simple and strong baseline in which weights are discarded based on their
    magnitudes. SparseGPT [59] is a second-order pruning method for LLMs, based on
    solving a layer-wise reconstruction problem. In Chapter 3.8.3, we compare with
    additional pruning methods.


    Both Wanda and SparseGPT require calibration data to estimate input statistics
    (see Table 3.1). To control this variable factor, we use the exact same set of
    calibration data as SparseGPT, which consists of 128 sequences with context length
    size sampled from C4 training set [36]. In Chapter 3.8.4, we provide additional
    analysis on the number of calibration samples.


    Sparsity. For all pruning methods, we focus on pruning the linear layers (skipping
    the first embedding layer and the final classification head), which account for
    around 99% of the total LLM parameters. We impose a uniform sparsity for all linear
    layers. We evaluate three types of sparsity: unstructured sparsity, structured
    4:8 and 2:4 sparsities. The magnitude pruning baseline is extended to structured
    N:M sparsity in a similar spirit to our method, as described in the previous section.


