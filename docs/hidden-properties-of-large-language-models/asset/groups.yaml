    #### 关于 LLM 评判员的消融实验。


    这里我们证明 5.4.3 节图 5.9 中的发现在多个 LLM 评判员下保持一致。具体来说，我们将 LLM 评判员从 ChatGPT 更换为 Claude、Grok
