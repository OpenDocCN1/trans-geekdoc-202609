    ## 评估前沿模型


    我们正生活在一个前沿大语言模型以快速竞赛速度发展的时代，模型发布频繁，基准性能稳步提升。然而，这引发了一个关键挑战：我们应如何有意义地评估进展，尤其是随着基准测试可能随时间饱和。此外，最近的研究强调了流行基准的局限性和潜在缺陷
    [28]。我们在第 5 章的工作探讨了这一问题的某个方面，其中我们提出了一个框架来评估和理解模型差异。展望未来，如何以可扩展的方式捕捉这些差异仍然是一个问题，因为推理模型具有更长的输出，而智能体系统可能具有长轨迹。最终，研究社区需要找到公平可靠的方法来评估这些先进模型，这对于指导前沿模型未来的发展至关重要。


