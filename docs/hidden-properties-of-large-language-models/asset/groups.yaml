    ### 4.8.6 注意力层归一化


    我们在第 4.5.2 节中的分析表明，与大规模激活相关的 token 具有截然不同的键和值状态。在本部分中，我们研究注意力 LayerNorm 在此过程中如何发挥关键作用。


    预备知识。常见于 LLM 的有两种特定的层归一化类型。一种是标准层归一化 [31]。假设我们有一个特征向量 x ∈ ℝ^d，LayerNorm 将归一化该特征以固定均值和方差，然后通过逐元素仿射变换重新缩放：


    x̄_i = (x_i - μ)/σ * g_i + b_i,    where μ = (1/d) Σ_{i=1}^d x_i,    σ = sqrt(
    (1/d) Σ_{i=1}^d (x_i - μ)^2 ).    (4.4)


    其中 g, b ∈ ℝ^d 是仿射变换的参数，也称为增益和偏置。


    除了原始 LayerNorm 外，LLaMA2 和 Mistral 模型中也使用了一种层归一化的变体。具体来说，是均方根归一化（RMSNorm）[176]


    对于 LayerNorm 和 RMSNorm 来说，当 $x \in \mathbb{R}^d$ 中的少数激活具有显著大的幅度时，归一化步骤中的分母，即 $\sigma$
    in Equation 4.4 和 RMS(x) in Equation 4.5，因此会变大。事实上，分母几乎由这少数大规模激活决定。大的分母会将所有正常值推向零，同时保留大规模激活的异常值特性。这将有效地创建由少数大规模激活决定的截然不同的归一化特征。图
    4.37 显示了 RMSNorm 和 LayerNorm 中两个激活轨迹。我们可以看到归一化步骤（中间）如何保留 token Who 和 \n 中的异常激活，并且在这两个
    token 处的归一化特征变得极其相似。


    ### 4.8.7 隐式注意力偏差


    在第 4.5.2 节中，我们已展示与大规模激活相关的 token 的值更新往往在很大程度上相同。在这里，我们通过检查 LLaMA2-7B 模型中的额外输入提示和层来扩展这些发现。我们使用四个输入提示：“Are
    you cold?\n Grab a jacket.”、“Will it snow?\n Check the forecast.”、“Did she call?\n
    I missed it.” 和 “''I am doing well. Thank you for asking.''”。我们在图 4.38、图 4.39
    和图 4.40 中分别可视化了第 3 层、第 15 层和第 30 层中的值更新。我们关注输入序列的后半部分，位于与大规模激活相关的两个 token 之后。我们可以看到，在同一层中，值更新
    $\sum_{i\in C} p_i^k v_i$ 在不同输入序列之间显示出显著的相似性。


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_84_0.png)


