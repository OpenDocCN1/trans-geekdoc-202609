    Figure 4.47, 4.48 and 4.49 detail the layer-level analysis results for all ViTs
    examined in this paper (also summarized in Table 4.8). Different from LLMs, some
    ViTs do not exhibit massive activations, e.g., MAE ViT-B/L and DINOv2 ViT-S. For
