    Chapter 3  This chapter highlights the first hidden property we uncover in LLMs
    – their weight space is significantly sparser than previously believed. Model
    pruning is a popular approach for reducing the computation requirements for neural
    networks, where magnitude pruning has become a well-established popular pruning
    method. However, prior work has found that the widely used magnitude pruning approach
    fails catastrophically on pruning LLMs. By carefully designing experiments analyzing
    the internal representation of LLMs, we identify a key limitation of magnitude
    pruning: it fails to take into account the emergent outlier features that occur
    frequently in the activation space of LLMs.


    Based on this key insight, we develop a novel, straightforward yet effective pruning
    method, termed Wanda (*Pruning by Weights and Activations*), designed to induce
    sparsity directly in pretrained LLMs. Our method prunes weights based on the product
    of their magnitudes and the corresponding input activations, applied on a *per-output*
    basis. We show that Wanda significantly outperforms the established baseline of
    magnitude pruning and performs competitively against prior state-of-the-art method
    involving intensive weight update. Our results demonstrate, *for the first time*,
    that effective sparse sub-networks can be obtained directly from pretrained LLMs,
    revealing that their weight space is inherently sparse.


    Chapter 4  This chapter presents our study on a unique type of structured outliers
    we observe in LLMs’ activation space. We show that in the residual hidden states
    of large Transformers, very few activations exhibit significantly larger values
    than others (e.g., 100,000 times larger). We call these structured outlier activations
    *massive activations*. We examine a wide range of popular LLMs and find the widespread
    existence of massive activations, suggesting that they are an inherent property
    of LLMs. We answer several important questions on massive activations. First,
    we show that they appear as constants across most intermediate models, and can
    be found mostly in fixed feature dimensions, first token and mostly delimiter
    tokens. Next, we conduct intervention analysis and find that their values largely
    stay constant regardless of the inputs, and they function as indispensable bias
    terms in these models.


    Furthermore, we find that massive activations are closely connected to an intriguing
    attention concentration pattern. Specifically, massive activations in the residual
    hidden states cause attention probabilities in subsequent layers to concentrate
    heavily on the corresponding tokens. When computing the self-attention output,
