    ## Chapter 5


    In this chapter, we shift our focus to the output-level behaviors of LLMs, where
    we aim to characterize differences between models in a novel and principled way.
    While most recent LLM releases place a heavy emphasis on improvements in benchmark
    scores, benchmarks alone are not sufficient to capture the nuanced distinctions
    between models—especially as benchmarks become saturated over time. Our study
    is driven by the fundamental question: *How can we effectively characterize and
    understand differences in the outputs of various LLMs?*


    To address this, we design a conceptually simple classification framework in which
    a neural network is trained to predict the source model of a given generated text,
    with each LLM treated as a separate class. We use the accuracy of the classifier
    as the quantitative indicator of how distinguishable the models’ outputs are.


