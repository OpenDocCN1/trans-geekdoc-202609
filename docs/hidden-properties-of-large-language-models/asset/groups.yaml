    ## 第三章


    本章重点介绍了我们在大语言模型中发现的第一个隐藏特性——其权重空间比之前认为的要稀疏得多。模型剪枝是一种用于降低神经网络计算需求的流行方法，其中幅度剪枝已成为一种成熟且流行的剪枝方法。然而，先前的工作发现，广泛使用的幅度剪枝方法在剪枝大语言模型时会出现灾难性失败。通过精心设计实验分析大语言模型的内部表示，我们确定了幅度剪枝的一个关键局限性：它未能考虑到在大语言模型激活空间中频繁出现的涌现异常特征。


    基于这一关键洞察，我们开发了一种新颖、直接且有效的剪枝方法，称为 Wanda（*按权重和激活进行剪枝*），旨在直接在大语言模型预训练模型中诱导稀疏性。我们的方法基于权重的幅度与其对应的输入激活的乘积进行剪枝，按
    *逐输出* 方式应用。我们表明，Wanda 在性能上显著优于幅度剪枝的既定基线，并且与涉及密集权重更新的先前最先进方法相比具有竞争力。我们的结果 *首次*
    证明，可以直接从预训练的大语言模型中获得有效的稀疏子网络，揭示了其权重空间本质上是稀疏的。


    ## 第四章


    本章介绍了我们对在大语言模型激活空间中观察到的一种独特结构化异常值的研究。我们表明，在大型 Transformer 的残差隐藏状态中，只有很少的激活值表现出比其他激活值显著更大的值（例如，大
    100,000 倍）。我们将这些结构化异常激活称为 *大规模激活*。我们检查了广泛流行的各种大语言模型，发现大规模激活普遍存在，这表明它们是大语言模型固有的属性。我们回答了关于大规模激活的几个重要问题。首先，我们表明它们在大多数中间模型中表现为常数，并且主要存在于固定的特征维度、第一个
    token 以及大部分分隔符 token 中。接下来，我们进行干预分析，发现它们的值在很大程度上与输入无关保持不变，并且在这些模型中充当不可或缺的偏置项。


    此外，我们发现大规模激活与一种有趣的注意力集中模式密切相关。具体而言，残差隐藏状态中的大规模激活会导致后续层中的注意力概率高度集中在相应的 token 上。在计算自注意力输出时，这会导致隐式偏置项的形成，该偏置项是通过聚合这些高度关注的
    token 的值更新而创建的。基于这一关键洞察，我们表明，之前提出的几种 Transformer 修复方法——例如添加额外的可学习 token（例如，寄存器）——可以在一种替代的注意力公式下统一起来。值得注意的是，我们证明了这种替代公式是无异常值的：大规模激活在预训练期间不再出现。这对于低精度训练和推理来说极其有益，而低精度训练和推理是降低前沿人工智能模型开发成本的一种广泛流行的方法。


    ## 第五章


    在本章中，我们将重点转向大语言模型的输出级行为，我们旨在以一种新颖且原则性的方式表征模型之间的差异。虽然大多数最近的大语言模型发布都非常强调基准分数的改进，但仅靠基准不足以捕捉模型之间细微的差异——尤其是随着时间的推移基准变得饱和时。我们的研究由一个基本问题驱动：*我们如何有效地表征和理解各种大语言模型输出的差异？*


    为解决这一问题，我们设计了一个概念上简单的分类框架，其中神经网络被训练以预测给定生成文本的源模型，每个大语言模型被视为一个独立类别。我们使用分类器的准确率作为衡量模型输出可区分程度的定量指标。


    基于我们新颖的框架，我们证明了大语言模型中存在明显的特异性。通过微调强大的句子嵌入模型，我们实现了显著高的分类准确率，揭示了大语言模型输出包含强烈的模型特定特征。为了进一步分析这些差异，我们提出了一种原则性方法，通过文本转换来分离贡献因素。我们的研究结果表明，这些特异性根植于各个层面，包括词分布、格式风格和高层语义。我们通过讨论我们的研究结果对大语言模型可靠开发和评估的更广泛影响来结束本章。


    ## 第二章 背景


    在本论文的这一章中，我们将提供理解本论文内容所需的背景信息概述。我们将介绍构成大语言模型（LLM）的基本概念。然后我们将讨论构建这些模型的过程和关键要素，包括其架构、训练和推理程序。


    ### 2.1 定义


    大语言模型（LLM）是一种训练用于理解和生成自然语言的机器学习模型。根据其定义，这些模型能够将文本序列作为输入并生成自然语言输出。值得注意的是，许多前沿大语言模型
    [13, 14] 现在已扩展为接受多模态输入，例如图像和音频，并生成多模态输出。在本论文中，我们将关注文本输入和文本输出的大语言模型。


    大语言模型是统计模型，为输入 token 序列分配概率分布。Token 表示基本文本单元，例如，词和子词。我们使用 $x_1, x_2, \dots, x_T$
    表示 token 序列。大语言模型通过输出概率分布来预测下一个 token


    $$

    P(x_t|x_1, x_2, \dots, x_{t-1}) \tag{2.1}

    $$


    在 token 词汇表上。由于概率的链式法则，token 序列的联合概率可以表示为：


    $$

    P(x_1, x_2, \dots, x_T) = P(x_1)P(x_2|x_1)P(x_3|x_1, x_2)\dots P(x_T|x_1, x_2,
    \dots, x_{T-1}) \tag{2.2}

    $$


    请注意，这里每个项都可以被视为一个分类任务。该概率是通过 Transformer 模型获得的。实际上，训练大语言模型是通过最大化文本数据大型语料库上的对数似然来完成的。通过这种自回归训练过程，模型学会理解自然语言并生成连贯的文本。


    ### 2.2 架构


    大语言模型基于 Transformer 架构 [1]，该架构推动了过去几十年人工智能领域的大部分进展。虽然语言建模架构有近期进展，但对于


    定义如下：


    $$

    \text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)
    V \tag{2.3}

    $$


    这里注意力头的输出是一个与查询、键和值表示 Q、K 和 V 形状相同的张量，即 $B \times T \times D_h$。


    需要注意的是，在仅解码器 Transformer 中，每个 token 仅限于关注自身和序列中所有先前的 token。对注意力分数（即查询和键状态的内积）应用因果掩码，以防止模型关注未来
    token。实际上，这可以通过在应用 softmax 操作之前屏蔽未来 token 的注意力分数（例如，将其设为 −∞）来实现。


    顾名思义，多头自注意力涉及多个自注意力头。每个头使用不同的线性投影层来获得查询、键和值表示。实际上，所有自注意力头的输出随后被连接成一个形状为 $B \times
    T \times D$ 的单一张量。然后通过输出线性投影转换连接后的嵌入。形式上，多头自注意力块定义如下：（假设我们有 h 个头）


    $$

    \text{head}_i = \text{Attention}(X W_i^Q, X W_i^K, X W_i^V) \tag{2.4}

    $$


    其中 $W_i^Q, W_i^K, W_i^V \in \mathbb{R}^{D \times D_h}$ 是第 $i$ 个头的线性投影矩阵。


    $$

    \text{MultiHead}(Q, K, V) = \text{Concat}(\text{head}_1, \dots, \text{head}_h)
    W^O \tag{2.5}

    $$


    其中 $W^O \in \mathbb{R}^{h D_h \times D}$ 是输出线性投影矩阵。多头自注意力块的输出是一个形状为 $B \times
    T \times D$ 的张量，其中 $D$ 是嵌入维度。这与来自前一层的输入隐藏状态 $X$ 相同。


    #### 前馈网络（FFN）


    除了多头自注意力块之外，每个 Transformer 块还包含一个由前馈网络（FFN）组成的子块。与自注意力块不同，FFN 块并行地分别应用于每个 token
    位置。FFN 由具有非线性激活函数的全连接层组成，例如 GELU [42]。


    $$

    \text{FFN}(x) = \text{GELU}(X W^{\text{up}}) W^{\text{down}} \tag{2.6}

    $$


    其中 $W^{\text{up}} \in \mathbb{R}^{D \times D_{\text{FFN}}}$ 是一个上投影层，将特征嵌入向量从 $D$
    投影到更大的维度 $D_{\text{FFN}}$。$W^{\text{down}}$ 是一个下投影层，将中间 FFN 隐藏状态投影回与输入张量 $X$ 相同的维度。


    值得注意的是，最近的大语言模型（例如，Llama [22, 23, 25]）使用 FFN 的变体 [27]，定义如下：


    $$

    \text{FFN}(x) = (\text{SiLU}(X W^{\text{gate}}) \cdot X W^{\text{up}}) W^{\text{down}}
    \tag{2.7}

    $$


    其中 $W^{\text{gate}}, W^{\text{up}} \in \mathbb{R}^{D \times D_{\text{gate}}}$
    是形状相同的两个线性投影层。然后这两个线性投影层的输出以逐点方式相乘。这里 SiLU 是一个在 [43] 中提出的非线性激活函数。数学上，该激活函数定义为
    $\text{SiLU}(x) = x \cdot \text{sigmoid}(x)$。

