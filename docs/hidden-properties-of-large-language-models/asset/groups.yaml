    # Evaluating frontier models


    We are living in an era where frontier LLMs are being developed at a rapid race,
    with frequent model releases and steady increase in benchmark performance. However,
    this raises a key challenge: how should we meaningfully evaluate progress, especially
    as benchmarks can be saturated over time. Moreover, recent studies highlight limitations
    and potential flaws in popular benchmarks [28]. Our work in Chapter 5 explores
    one aspect of this question, where we propose a framework to evaluate and understand
    model differences. Going forward, how do we capture these differences in a scalable
    way remains a question, given that reasoning models have much longer outputs and
    agentic systems can have long trajectories. Ultimately, the research community
    needs to find fair and reliable methods to evaluate these advanced models, which
    is important for guiding the future development of frontier models.'
