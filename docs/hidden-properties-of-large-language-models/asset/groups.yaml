  - '[PAGE 93]


    # 4.9 Conclusion and Discussion


    Autoregressive training of large Transformers has brought significant advances
    in natural language processing. This study reveals the widespread existence of
    *massive activations* in these Large Language Models (LLMs). The values of these
    activations are input agnostic but crucial for model performance, despite their
    extremely rare quantity. We establish a close connection between massive activations
    and the self-attention mechanism. We show that LLMs use them to implement an implicit
    form of biases for attention computation. Our findings also generalize well to
    Vision Transformers (ViTs). We hope the new results presented in this work contribute
    to a deeper understanding of today’s large-scale foundation models.


    We discuss some practical implications and future directions of this work. First,
    the presence of activations with large magnitudes has been widely known as a major
    challenge in effectively quantizing LLMs [57, 58]. This paper identifies a new
    type of outlier activations in LLMs, and we hope our findings will be of value
    to research on LLM compression. Second, attention maps that allocate excessive
    attention probabilities to a few fixed tokens may be undesirable for mechanistic
    interpretability [186]. Our proposed attention formulation could make the resulting
    attention maps in LLMs more interpretable, and potentially benefit downstream
    applications [191]. Finally, our investigation of the new attention formulation
    is focused on its effects on massive activations, and our experiments were limited
    to a small GPT-2 model due to computational resource constraints. It would be
    interesting to see how our results generalize to models at larger scales, and
    how our attention formulation could affect the training stability [167] of modern
    LLMs.'
