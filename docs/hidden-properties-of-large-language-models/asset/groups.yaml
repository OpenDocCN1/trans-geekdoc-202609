    ### 5.4.1 Words and Letters


    ### Text shuffling.


    To decouple the effects of words and letters from other factors, we remove special
    characters in LLM-generated responses, such as punctuations, markdown elements,
    and excessive white spaces. This ensures that each response consists solely of
    words separated by a white space. Additionally, we apply two shuffling strategies
    to the preprocessed text: word-level and letter-level shuffling. These transformations
    disrupt the natural order and force the classifier to learn patterns from raw
    text statistics. Table 5.8 presents the classification results.


    Classifiers trained on responses without special characters achieve accuracies
    close to those using the original responses, i.e., 95.1% for chat APIs, 93.8%
    for instruct LLMs, and 75.4% for base LLMs. Likewise, using word-shuffled responses
    yields high accuracies comparable to the original ones. Further, we plot the frequencies
    of several commonly used words from five chat APIs in Figure 5.5 (left). We observe
    distinct patterns among models, even for frequent English words: Claude has much
    lower frequencies for words like “the”, “and”, “to”, and “of” than other chat
    APIs. These results suggest that special characters and word order are not essential
    for distinguishing LLMs; word choices reflect substantial idiosyncrasies across
    models.


    In contrast, shuffling at the letter level results in a substantial drop in accuracy
    (49%-56%), approaching chance-level performance. This indicates that letter-level
    statistics alone are not sufficient for predicting LLM identities. To qualitatively
    visualize distinctions in letter distributions


