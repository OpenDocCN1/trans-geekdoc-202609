    ### 引言


    大语言模型（LLMs）是一类通过自监督方式在海量文本上训练的机器学习模型。LLM的起源始于2017年提出的Transformer [1] 模型。该模型去除了循环结构，完全使用自注意力机制，最初是为神经机器翻译而设计的。2019年，OpenAI发布了GPT-2
    [2]，使LLM受到广泛关注。按设计，GPT-2是一个仅包含解码器的Transformer，以自回归目标在大规模语料库上进行训练。尽管与当今模型相比规模很小，GPT-2在翻译、摘要和简单问答等各种任务上展现了强大的性能。更重要的是，其简单设计使其易于扩展，也便于通过基于提示的自然语言输入进行推理。此后，LLM的发展遵循了缩放定律，即在更多数据上训练的更大模型通常表现更好。后来的模型，如2020年的GPT-3
    [3] 和2023年的GPT-4 [4]，持续展示了LLM所能实现的惊人能力。


    迄今为止，LLM已对人们的日常生活产生了重大影响。基于LLM的聊天机器人，如ChatGPT [5] 和DeepSeek [6]，如今已在全球范围内被广泛使用。它们还催生了各种旨在显著改善人类工作流程的应用，例如Cursor和Manus。更进一步，得益于LLM性能的不断提升，实现通用人工智能（AGI）的目标比以往任何时候都更近了。对于机器学习和深度学习领域的研究者而言，LLM的成功带来了一场范式转变——从训练监督模型转向大规模自监督表示学习。从LLM的发展中获得的另一个重要教训是缩放定律的重要性——简单且可扩展的方法加上更多的算力和数据，这一原则持续推动着AI在语言领域之外的进步，例如Sora
    [7] 和Whisper [8]。


