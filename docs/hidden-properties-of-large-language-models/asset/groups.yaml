    ## 第5章

    ### 大型语言模型中的特异性

    ### 5.1 概述


    在本研究中，我们揭示并研究了大型语言模型（LLMs）中的特异性——其输出中可用于区分模型的独特模式。为此，我们考虑一个简单的分类任务：给定特定文本输出，目标是预测生成该文本的源LLM。我们在各种LLM组上评估此合成任务，发现仅对LLM生成的文本进行现有文本嵌入模型的微调即可获得出色的分类准确率。值得注意的是，在涉及ChatGPT、Claude、Grok、Gemini和DeepSeek的五分类问题中，我们在保留的验证数据上实现了97.1%的准确率。进一步的调查表明，这些特异性根植于词级分布。这些模式即使在文本被外部LLM重写、翻译或总结时仍然存在，表明它们也编码在语义内容中。此外，我们利用LLM作为评判者来生成每个模型特异性的详细、开放式描述。最后，我们讨论了研究结果的更广泛影响，包括在合成数据上训练、推断模型相似性以及LLM的稳健评估。代码可在
    github.com/locuslab/llm-idiosyncrasies 获取。


    ### 5.2 引言


    随着诸如LLM等生成模型的采用加速，了解此类生成内容的来源和出处变得越来越重要。虽然过去大量工作集中在人类撰写内容和AI撰写内容的分类上 [228, 243,
    244, 245]，但在对不同LLM生成的內容进行分类方面的工作很少，无论是完全不同模型的输出，还是同一模型家族不同变体的输出。如果可能，以这种方式区分源模型的能力对于许多应用非常有价值：它可以揭示不同LLM的相对采用情况，超出各公司报告的内容，以及用于构建不同模型的数据的性质。此外，它还可以提供有关输出生成哪些特征对每个LLM最“独特”的见解。


    在本文中，我们研究LLM是否表现出能够使其输出可区分的特异性，其依据是通过文本转换来分离不同层级的信息。我们发现，在随机打乱LLM生成响应的词语后，分类准确率仅有微小下降。这表明大量独特特征编码在词级分布中。然后我们强调了一组与每个LLM始终相关联的特征短语。我们还发现，Markdown格式在后训练后LLM的特异性中贡献了适度的程度。


    与此同时，当通过保留语义的转换破坏词分布时，例如改写或翻译，我们仍获得超过90%的准确率。即使在最激进的转换——总结——下，分类准确率仍然远高于随机猜测水平。这一发现表明语义信息也塑造了LLM中的特异性。通过开放式语言分析，我们进一步深入了解了这些特征。例如，ChatGPT偏好详细、深入的解释，而Claude则产生更简洁、直接的响应，优先考虑清晰度。


    最后，我们讨论了研究结果的更广泛影响。在使用合成数据训练LLM时应谨慎，因为我们表明其中许多特异性可在该过程中继承。我们的框架也可作为评估前沿模型、无论是开源还是专有模型之间相似性的工具。此外，我们讨论了LLM中的特异性如何被恶意利用来操纵基于投票的排行榜，从而凸显了对更稳健评估方法的需求。


    ### 5.3 评估LLM中的特异性


    大型语言模型（LLMs）共享若干核心特征。它们大多数基于Transformer架构 [1]，本文考虑该架构。其次，它们使用自回归目标进行训练 [2]，即基于前文上下文预测序列中的下一个token。最后，它们的训练数据集高度重叠，通常包含Common
    Crawl、Wikipedia和Stack Overflow等庞大且多样的来源。鉴于这些相似性，自然会问：LLM是否以相同的方式“说话”？如果不是，我们如何有效地衡量它们差异的程度？


    为解决这些问题，我们构建了一个合成任务，专注于对不同LLM输出进行分类。考虑N个LLM，记为 f1, …, fN，其中每个 fi 接收输入提示 p 并输出文本补全
    o。对于给定的提示数据集 D，每个LLM fi 产生的输出记为 Oi。我们以简单设置处理此问题。对于N个输出集 Oi，我们制定一个N路分类任务，其目标是预测每个输出由哪个LLM产生。如果不同LLM的输出来自同一分布，分类准确率不会优于随机猜测。因此，我们将此合成任务的分类性能用作LLM特异性的衡量标准。


    我们的任务被表述为序列分类问题，微调BERT风格模型是常见方法 [251]。在本工作中，我们微调了一个基于解码器仅Transformer的更新且更具竞争力的序列嵌入模型：LLM2vec
    [207]。我们在提取的嵌入上附加N路分类头，并使用LoRA-based微调同时对模型权重和线性头进行微调。输入序列截断为最大长度512个token。我们在保留的验证集上评估模型的性能并报告分类准确率。额外的训练细节在附录5.7.1中提供。


