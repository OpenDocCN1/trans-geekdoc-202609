    Newswise — Sepsis is a serious medical condition caused by an overwhelming immune
    response to infection. The body’s infection-fighting chemicals, which are normally
    good, can cause damage to the blood vessels and organs.


    Sepsis is one of the leading causes of death in hospitals. Although there have
    been recent advances in sepsis treatment, researchers are still working hard to
    identify new ways to prevent and treat this complex disease.


    Researchers at Washington University School of Medicine in St. Louis recently
    published a study that may change how sepsis is diagnosed and treated. Their work
    suggests that two different types of immune cells are involved in the progression
    of sepsis: one cell type that’s protective and another that’s harmful. These findings
    could help doctors identify who is most at risk for severe complications from
    the disease.


    “The results from our study show that there are two distinct populations of monocytes,”
    said co-author Dr. Michael Jaffe, professor of medicine at Washington University.
    “One population promotes inflammation and is associated with worse outcomes; the
    other helps resolve inflammation and promotes healing.”


    Monocytes are a type of white blood cell that are part of the innate immune system.
    They play a key role in fighting off bacteria and viruses. When someone has sepsis,
    their monocytes become activated. That means they increase in number and start
    producing cytokines, which are small proteins that regulate the body’s immune
    response. Typically, when the body encounters an infection, these cytokines signal
    the immune system to fight back. But too many cytokines produced too quickly can
    result in a hyperinflammatory state, which can lead to organ failure and death.


    In the past, doctors have used blood tests to diagnose sepsis. However, those
    tests only measure the overall levels of cytokines in a person’s blood. The new
    study suggests that it might be possible to determine whether someone has a particular
    type of monocyte that could make them more susceptible to sepsis. If so, doctors
    could potentially use this information to personalize treatments and improve patient
    outcomes.


    “Our findings suggest that there may be opportunities to develop therapies that
    target specific monocyte subsets,” said co-author Dr. Daniel Levy, assistant professor
    of medicine at Washington University. “This could potentially reduce the risk
    of developing sepsis or even improve outcomes once someone already has sepsis.”


    There’s still much to learn about how these monocyte subsets contribute to sepsis
    development and progression, but the results of this study provide promising insights
    into why some patients respond differently to treatment than others.


