    ## 5.5 Implications


    In this section, we explore the broader implications of our framework, regarding
    synthetic data and model similarity.


    **Idiosyncrasies via synthetic data.** Using synthetic data has become a common
    practice when training frontier LLMs [242, 258, 273]. We conduct supervised fine-tuning
    (SFT) on two base LLMs (Llama3.1-8b and Gemma2-9b) using Ultrachat, i.e., dialogues
    generated by ChatGPT. After the SFT stage, we train a classifier to distinguish
    between responses from two fine-tuned models. We find that SFT on the same synthetic
    dataset significantly reduces the classification accuracy from 96.5% to 59.8%,
    narrowing down the differences between these two models.


    In addition, we generate responses from Llama3.1-8B and Gemma2-9B in instruct
    LLMs using UltraChat prompts. Then we fine-tune Qwen2.5-7B base LLM on each set
    of responses respectively. Interestingly, responses from the two resulting fine-tuned
    models can be classified with 98.9% accuracy, suggesting that each fine-tuned
    model retains the unique characteristics in its SFT data. These findings suggest
    that training with synthetic data can propagate the idiosyncrasies in the source
    model.


    **Inferring model similarity.** Our framework offers a quantitative approach for
    assessing similarities between proprietary and open-weight LLMs. Given a set of
    N LLMs, we omit one model and train a classifier on responses from the remaining
    N − 1 models. We then evaluate which LLM the classifier associates the responses
    of the excluded model with. The model that is most frequently predicted as the
    source is considered the closest match to the excluded LLM. This process is repeated
    for each of the N models. For this analysis, we include the open-weight Phi-4
    [242] alongside 5 chat API models. Notably, Phi-4 uses a substantial amount of
    synthetic data in its training.


    Results are shown in Figure 5.10. Intriguingly, for Claude, Grok, and Gemini,
    we observe a strong tendency for their outputs to be classified as ChatGPT. For
    instance, when Grok is the excluded model, 82.8% of its responses are classified
    as ChatGPT. In addition, responses from ChatGPT and DeepSeek are frequently identified
    as coming from Phi-4, with 55.9% and 76.0% of their responses respectively. In
    turn, most of Phi-4’s outputs are classified as originating from ChatGPT or DeepSeek.


    **Robust evaluation of LLMs.** Our findings reveal a potential vulnerability in
    widely used LLM evaluation methodologies. It has become a common strategy to incorporate
    human judgement in evaluating LLMs, for instance, Chatbot Arena [276]. It is a
    voting-based leaderboard where users submit preferences of the responses from
    two random models. This benchmark has gained significant traction and is now a
    key reference point for frontier model development. However, exploiting the idiosyncratic
    property of LLM outputs, a malicious attacker can identify the model behind the
    candidate responses and consistently vote for the target model, thereby manipulating
    the leaderboard rankings. Concurrent work by [277] has demonstrated the feasibility
    of this attack in simulation. We hope our work brings attention to potential weaknesses
    in current evaluation pipelines, as they can misguide model development and optimization
    efforts [28].


    image datasets). [234] conducted hypothesis testing on sets of model outputs to
