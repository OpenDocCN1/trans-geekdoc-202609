    ## 后训练


    后训练是对预训练大语言模型进行精炼和优化的过程。虽然预训练使大语言模型学习到通用的语言表征，但预训练模型无法遵循人类指令并生成连贯的文本。因此，为了使这些模型在实践中可用，后训练是将预训练模型与人类偏好对齐的关键过程。


    目前有两种流行的后训练范式：监督微调和对齐阶段。监督微调（SFT）是通过在精选的数据集上训练来将预训练大语言模型适配到特定任务或领域的过程。例如，可以在对话数据上微调预训练大语言模型，使其成为一个有用的助手。SFT
    通常通过监督学习进行，这意味着训练数据由输入-输出对组成。然而，在许多情况下，标注数据的收集成本很高。此外，监督微调在训练域之外泛化能力不佳。实践中，SFT
    通常与对齐方法结合使用。


    对齐阶段旨在使大语言模型更好地匹配人类偏好。通常这通过强化学习（RL）微调来实现，以从反馈数据中学习，例如来自人类反馈的强化学习（RLHF）[26]和来自AI反馈的强化学习（RLAIF）[29]。模型通过反映其生成质量的奖励信号进行优化。这种强化学习过程鼓励模型生成更有帮助且与人类价值观一致的输出。


    ## 2.4 推理


    我们描述大语言模型的推理过程。它通常包括两个主要步骤：预填充和解码。


    ### 预填充


    这是模型在自回归解码之前处理整个输入提示的阶段。在预填充阶段，模型接收完整的提示并在一次前向传播中将所有输入 token 通过网络。此阶段不进行预测。在预填充期间，每个
    Transformer 层中输入 token 的键和值状态会被缓存以供解码阶段使用。这些键和值状态也称为 KV 缓存，它使模型能够在序列中重用已处理 token
    的键和值状态，而无需重新计算。


    ### 解码


    解码是以自回归方式逐 token 生成输出序列的过程。在每次 token 预测时，模型通过从整个词表上的预测概率分布中采样来预测下一个 token。可以有各种采样策略。一种常见策略是贪心解码，这是一种确定性过程，其中概率最高的
    token 总是被选为下一个 token。另一种流行的方法是温度采样，它使用温度参数来控制概率分布的随机性：温度越高输出越随机，而温度越低输出越确定。


    ## 第3章


    ## 一种简单而有效的大型语言模型剪枝方法


    ### 3.1 概述


    随着规模的增大，大型语言模型（LLMs）成为网络剪枝方法的自然候选：这些方法在力求保持性能的同时丢弃一部分网络权重。然而，现有方法要么需要重新训练，这对于十亿参数级别的
    LLM 来说很少负担得起，要么需要解决依赖二阶信息的权重重构问题，这也可能计算成本高昂。在本文中，我们介绍了一种新颖、简单而有效的剪枝方法，称为 Wanda（按权重和激活进行剪枝），旨在为预训练
    LLM 引入稀疏性。受近期关于 LLM 中涌现的大幅值特征的观察启发，我们的方法按每个输出为基础，剪枝幅值乘以对应输入激活值最小的权重。值得注意的是，Wanda
    无需重新训练或权重更新，剪枝后的 LLM 可直接使用。我们在 LLaMA 和 LLaMA-2 上对 Wanda 方法进行了全面评估，涵盖多种语言基准。Wanda
    在已建立的幅值剪枝基线上显著优于，且与涉及大量权重更新的最新方法相比具有竞争力。代码可在 https://github.com/locuslab/wanda
    获取。


    ### 3.2 引言


    大型语言模型 [3, 4] 近期凭借其在多种复杂语言基准 [86, 105, 107] 上的卓越性能重塑了 NLP 领域。然而，这些模型拥有数十亿参数，通常需要大量的计算资源。为了使
    LLM 民主化，人们付出了大量努力来降低其高昂的计算成本。迄今为止的许多显著进展都集中在模型量化上，即将参数量化为较低位表示的过程。快速发展的 LLM 量化研究
    [57, 58, 87, 154] 为这些模型带来了实质性的资源节省 [111, 150]。


    网络剪枝 [66, 77, 78] 另一方面，通过从模型中移除特定权重来缩小网络规模——本质上将其设为零。与量化一起，它常被视为压缩神经网络的另一种流行方法。然而，在压缩
    LLM 方面它受到了相对较少的关注。这似乎与 LLM 时代之前的模型压缩趋势相矛盾，当时这两种方法都获得了大量研究投入。对现有剪枝方法的快速回顾揭示了一个可能的原因：它们通常需要重新训练
    [74, 95]、从随机初始化训练 [67, 70, 79] 或甚至耗时的迭代过程 [69, 80]。LLM 所需的庞大计算资源限制了这些方法。一种最近的
    LLM 剪枝方法 SparseGPT [59] 不需要传统的重新训练，但仍需要计算密集型的权重更新过程。


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_31_0.png)


    图 3.1：我们提出的 Wanda 方法（按权重和激活进行剪枝）与幅值剪枝方法的对比示意图。给定权重矩阵 W 和输入特征激活 X，我们将权重重要性计算为权重幅值与输入激活范数之间的逐元素乘积（|W|
    · ||X||₂）。权重重要性分数按每个输出为基础进行比较（W 中每一行内），而不是在整个矩阵中全局比较。


    关于需要重新训练和权重更新的论点并不能完全概括剪枝 LLM 的挑战。人们可以合理地期望使用现有流行的剪枝方法获得一个性能相当高的重新训练初始化点。然而，最近的一项研究
    [59] 发现，幅值剪枝 [66] 这种成熟的剪枝方法在 LLM 上即使在相对较低的稀疏度下也会严重失效。考虑到幅值剪枝在较小网络上的过去成功，这一结果表明
    LLM 尽管拥有 100 到 1000 倍的参数，直接剪枝要困难得多。


    在本文中，我们通过引入一种简单而有效的方法 Wanda（按权重和激活进行剪枝）来解决这一挑战。该技术能够在无需修改剩余权重的情况下将 LLM 剪枝到高度稀疏。我们受近期研究
    [58] 中的一个观察结果启发，其中一小部分隐藏状态特征的幅值异常大，这是 LLM 独有的特性。我们发现，用输入激活增强标准权重幅值剪枝指标，作为评估权重重要性的度量是出乎意料地有效。具体来说，我们引入了一种新颖的剪枝指标，其中每个权重由其幅值与对应输入激活的范数之积来评估，该范数使用少量校准数据估计得出。我们的方法使用该指标通过在每个线性层的每个输出内局部比较权重并移除优先级较低的权重，从而在预训练
    LLM 中引入稀疏性。我们的方法计算高效，能够在一次前向传播中执行，且内存开销极小。


