    ## 4.9 结论与讨论


    大型 Transformer 的自回归训练为自然语言处理带来了重大进展。本研究揭示了 *大规模激活* 在这些大型语言模型（LLM）中的广泛存在。这些激活的值与输入无关，但对模型性能至关重要，尽管其数量极为稀少。我们在大规模激活与自注意力机制之间建立了密切联系。我们表明，LLM
    利用它们来实现注意力计算的一种隐式偏置形式。我们的发现也很好地推广到了视觉 Transformer（ViT）。我们希望本工作呈现的新结果有助于更深入地理解当今的大规模基础模型。


    我们讨论本工作的一些实际意义和未来方向。首先，大幅值激活的存在已被广泛认为是有效量化 LLM 的主要挑战 [57, 58]。本文识别了 LLM 中一种新型的异常值激活，我们希望我们的发现对
    LLM 压缩研究有价值。其次，将过多注意力概率分配给少数固定 token 的注意力图可能对机制可解释性不利 [186]。我们提出的注意力公式可以使 LLM
    中产生的注意力图更具可解释性，并可能有益于下游应用 [191]。最后，我们对新注意力公式的研究聚焦于其对大规模激活的影响，并且由于计算资源限制，我们的实验仅限于一个较小的
    GPT-2 模型。有趣的是，看看我们的结果如何推广到更大规模的模型，以及我们的注意力公式如何影响现代 LLM 的训练稳定性 [167]，将会很有意思。


