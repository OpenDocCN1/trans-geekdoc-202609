    在公式4.2中，我们将每个token $k$ 处的注意力输出分解为两部分：来自注意力集中的token集合 $\mathcal{C}$ 的值更新；以及从其他token聚合的值更新。


    $$\text{Attention}(Q, K, V)_k = \sum_{i \le k} p_i^k v_i = \sum_{i \in \mathcal{C}}
    p_i^k v_i + \sum_{i \notin \mathcal{C}} p_i^k v_i \quad (4.2)$$


    其中 $p_i^k$ 是查询token $k$ 对token $i$ 的注意力分布，$v_i$ 是token $i$ 的值状态。


    图4.10可视化了LLaMA2-7B中分解后的值更新和注意力输出，输入提示为“Summer is warm. Winter is cold.”。在这种情况下，集合
    $\mathcal{C}$ 由token `Summer` 和第一个句号token组成。我们可以看出，来自 $\mathcal{C}$ 的值更新在不同token之间几乎相同，即它们充当了加性偏置项，尽管没有被显式施加。此外，我们注意到这种值更新的模式在各种输入中惊人地相似。我们请读者参阅第4.8.7节以获取更多分析。总体而言，我们的结果表明，LLM使用大规模激活在某些token上分配大量注意力。这些token随后在计算注意力输出时被用来形成一个恒定的偏置项。


    ## 4.5.3 显式注意力偏置消除大规模激活


    鉴于LLM在预训练期间学习隐式注意力偏置的强烈需求，我们因此尝试直接用额外的偏置项来增强自注意力。有趣的是，我们发现带有显式注意力偏置增强的模型不会表现出大规模激活。


    **形式化表述。** 其思想是显式地对这类注意力偏置进行建模，但并非通过重新利用输入序列中的现有token来实现。因此，我们为每个头引入额外的*可学习*参数
    $\mathbf{k}''$、$\mathbf{v}'' \in \mathbb{R}^d$。具体来说，给定输入查询、键和值矩阵 $Q, K, V \in
    \mathbb{R}^{T \times d}$，带有显式注意力偏置的增强注意力计算如下：


    $$\text{Attention}(Q, K, V; \mathbf{k}'', \mathbf{v}'') = \text{softmax}\left(
    \frac{Q \begin{bmatrix} K^T & \mathbf{k}'' \end{bmatrix}}{\sqrt{d}} \right) \begin{bmatrix}
    V \\ \mathbf{v}''^T \end{bmatrix} \quad (4.3)$$


    其中 $\mathbf{k}''$ 和 $\mathbf{v}''$ 分别与键矩阵和值矩阵 $K/V$ 拼接。所提出的注意力可以作为标准注意力的即插即用替代品，无需修改Transformer的其他部分，例如位置嵌入和MLP块。


    **结果。** 我们训练了三个GPT-2模型：标准模型、前置了sink token [190] 的GPT-2以及带有显式注意力偏置的GPT-2。训练设置见第4.8.8节。我们发现这三个模型在收敛时具有相同的性能，但在大规模激活的状态上存在显著差异，如图4.11所示。值得注意的是，与默认GPT-2和带有sink
    token的GPT-2相比，带有显式注意力偏置的GPT-2中大规模激活消失了。


    图4.12显示了每层最大的三个激活幅度。值得注意的是，在带有显式注意力偏置的情况下，GPT-2中的顶部激活幅度随着层数加深而逐渐增大。这些结果表明，显式注意力偏置抵消了LLM发展


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_69_0.png)


    图4.13：CLIP和DINOv2中的ViT-L存在大规模激活，但MAE中没有。


    序列维度的必要性。在这两个模型中，有极少数激活（少于四个）的幅度显著大于其他激活。此外，这些激活位于特定的特征维度，并出现在随机的patch token中。然而，我们在MAE
    ViT-L中没有观察到大规模激活。在该模型中，一个特征维度（927）在所有token上表现出均匀的大值。


    ### 大规模激活在ViT中是偏置。


    图4.14显示了CLIP和DINOv2 ViT-L中每层的三个最大激活幅度和中位数，在1k张图像上取平均。我们发现大规模激活在不同图像中持续存在，并且它们的值在平均值附近基本保持不变。值得注意的是，与LLM不同，大规模激活只有在ViT的较后阶段才开始出现。


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_69_1.png)


    图4.14：CLIP和DINOv2 ViT-L中每层的三个最大激活幅度和中位数幅度。


    按照我们在第4.4节中的方法，我们对CLIP ViT-L进行了干预分析。我们将两个最大的大规模激活分别修改为零和均值。干预在第13层进行，该层是此模型中大规模激活首次出现的层。结果如表4.4所示，我们在ImageNet上评估了零样本准确率。我们可以看到，将大规模激活设为零会导致准确率显著下降，而将其设为均值则导致可忽略不计的准确率下降。这些结果表明，大规模激活在ViT中充当固定但至关重要的偏置，这与我们在第4.4节中的观察一致。


    | 干预 | ImageNet准确率 (%) |

    |---|---|

    | 原始 | 75.5 |

    | 设为零 | 59.8 |

    | 设为均值 | 75.5 |


    表4.4：CLIP ViT-L中大规模激活的干预分析。


    ### 寄存器在ViT中是偏置。


    最近，[191]提出用额外的可学习token增强标准ViT，并将其命名为寄存器token。他们表明，使用寄存器token训练ViT可以得到平滑的注意力图，由此产生的模型族即DINOv2-reg，在下游性能上优于DINOv2。检查DINOv2-reg中最大的ViT-G模型，我们观察到大规模激活的存在，如图4.15所示。然而，与标准ViT不同，大规模激活不出现在patch
    token中，而是专门出现在一个固定的寄存器token中，即寄存器3。这表明该模型使用寄存器3来存储这些激活。图4.16可视化了最后一层中[CLS] token的注意力分布。我们发现大部分注意力被分配给了寄存器3，这与我们之前在注意力模式中的发现（第4.5.1节）相呼应。


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_70_0.png)


    图4.15：DINOv2-reg ViT-G中的大规模激活。


    | ImageNet准确率 (%) | ViT-S | ViT-B | ViT-L | ViT-G |

    |---|---|---|---|---|

    | 原始 | 81.9 | 84.8 | 86.3 | 87.0 |

    | 修复寄存器均值 | 81.7 | 85.0 | 86.2 | 87.0 |


    表4.5：我们将每层的所有寄存器特征固定为其均值，并评估干预后的ViT。


    ![](img/78fbbd4ea983a7880ad6673ac3886adf_71_0.png)


    图4.16：[CLS] token的平均注意力。


    进一步，我们进行干预分析以分析寄存器的作用。我们将*每一层*输出处的*所有*寄存器特征替换为其均值，该均值在10k张ImageNet训练图像上取平均。这种干预消除了寄存器聚合全局输入信息的预期目的[191]。表4.5显示了结果。我们发现具有固定寄存器特征的ViT取得了与原始模型相当的准确率，这表明寄存器在ViT中充当学习到的偏置。这导致寄存器token处具有恒定的键和值状态，有效地为自注意力引入了偏置项（公式4.3中的额外k''和v''）。因此，带有寄存器token的ViT在功能上等同于带有显式注意力偏置增强的标准ViT。


    总结我们的发现：


    *大规模激活存在于许多但并非所有ViT中。与LLM中的激活类似，这些激活充当恒定偏置。我们还表明，最近提出的寄存器token具有类似的功能。*


    ## 4.7 相关工作


    **自回归Transformer的有趣性质。** [135]观察到，在GPT-2的倒数第二层中，存在一些特征维度，其激活幅度高达3,000。他们发现，这些少数维度主导了几项用于评估表示相似性的标准度量。[163]发现GPT-2中初始token的特征范数比其他token增长得快得多。[90]和[189]证明了GPT-2和LLaMA2-13B的LayerNorm中存在离群权重，并表明将它们设为零会导致模型性能灾难性下降。值得注意的是，LLaMA2-13B中该权重的特征维度（即2100）与一个大规模激活的特征维度相对应（图4.2）。


    **离群特征。** 各种现有的量化工作[57, 58, 150, 154, 184]研究了LLM中离群特征的存在。[58]表明，离群特征在其大部分序列维度上具有较大的激活值。虽然大规模激活看起来可能与离群特征相似，但我们在第4.3.3节中讨论了它们的根本区别。更重要的是，我们表明大规模激活不能归因于离群特征的存在。


    **注意力集中模式。** [195]、[196]和[136]发现BERT [18]中的注意力倾向于集中在“分隔”token [SEP]上。[190]表明LLM将大部分注意力分配给起始词token。[191]揭示了ViT中注意力伪影的存在。


