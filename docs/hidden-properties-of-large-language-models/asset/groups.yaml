    ## 3.7 相关工作


    ### 网络剪枝与稀疏性。

    剪枝是一种通过消除权重来压缩神经网络的流行技术，从而产生稀疏网络[77, 78]。它大致可以分为*结构化*和*非结构化*两类方法。


    结构化剪枝方法[50, 51, 55, 93, 94, 125, 142]，有时被称为激活剪枝[49, 67]，会移除网络的整个结构化组件，从而促进高效的GPU加速。一些现有方法[46,
    47]已经探索了基于神经元/滤波器输出的激活统计信息的结构化剪枝，例如零激活百分比[48]和激活均值[119]。最近，[112]研究了LLMs的结构化剪枝。[56,
    91]和[60]证明了LLMs的结构化组件（例如注意力头和MLP神经元）中存在依赖于提示（prompt-dependent）和特定任务（task-specific）的稀疏性。


    非结构化方法[66, 81, 116, 117, 118, 123]如幅度剪枝在单个权重级别上操作，即使在较高的稀疏度下也能保持性能。现有的剪枝方法通常需要修改训练过程[68,
    85]、重新训练剪枝后的网络以恢复精度[54, 74]，或者需要计算量更大的迭代式重新训练过程[80, 82]。然而，将这些方法扩展到具有数十亿参数的大语言模型（LLMs）是一个挑战，因为所需的训练过程需要大量的计算资源[64,
    106]。


    ### 有限数据剪枝。

    与我们方法最相关的是最近一系列关于有限数据剪枝的工作[73, 75, 76, 83]。这类方法不需要修改原始训练过程，也不需要在整个训练数据集上重新训练剪枝后的网络。这些方法的主要目标是在剪枝过程中保持性能，假设可以访问有限且少量的数据，这些数据也称为校准数据。为了缓解精度下降，研究人员通过解决逐层重建问题[73]来最小化在校准数据上评估的输出变化。现有的逐层重建问题求解器[75,
    84]依赖于对二阶Hessian逆矩阵的大量计算，这无法扩展到LLMs的大规模隐藏状态尺寸。SparseGPT [59]通过同步的二阶Hessian更新，为LLMs开发了一种高效的权重更新流程。


    ### LLMs的涌现特性。

    我们的工作还与最近关于大型语言模型中存在大幅值异常特征的研究有关[90, 120, 135, 136, 137, 138]。[58]


