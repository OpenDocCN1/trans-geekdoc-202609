    # Chapter 6


    # Conclusion


    In this dissertation, we conducted a thorough and systematic study of Large Language
    Models (LLMs), despite their inherently complex and opaque nature. Through this
    work, we uncovered several important hidden properties of LLMs and revealed the
    internal mechanisms behind these properties. These findings significantly advance
    our understanding of LLMs and offer valuable insights for the development of future
    models.


    The weight space is a fundamental component of deep learning models, with modern
    LLMs often comprising billions of parameters. In Chapter 3, we demonstrate the
    intrinsic sparsity of the LLM weight space. We examine the counterintuitive phenomenon
    that the popular magnitude pruning method fails drastically on LLMs. We find that
    magnitude pruning overlooks emergent activation outliers common in LLMs. Motivated
    by this, we propose Wanda, a simple pruning approach that jointly considers weight
    magnitudes and input activations. We use Wanda to find efficient and sparse subnetworks
    from pretrained LLMs, without inducing any changes to the preserved weights.


    Unlike static weight parameters, activations are dynamic, and LLMs use these internal
    representations to encode input data. In Chapter 4, we reveal the widespread presence
    of massive activations – structured outliers in the activation space of LLMs.
    We conduct a comprehensive analysis of these activations. Through intervention
    analysis, we show these activations function as crucial, input-agnostic biases.
    Furthermore, we find that they are closely connected to the attention concentration
    patterns, and we propose an alternative attention formulation that augments self-attention
    with learnable key and value embeddings. We show that pretraining with this modified
    attention mechanism eliminates massive activations.


    Finally, LLMs are interesting because of their ability to generate natural language
    outputs. In Chapter 5 of the thesis, we examine the output behaviors of LLMs,
    where we are mainly motivated by understanding the differences between models
    beyond benchmark performance. We develop a conceptually simple framework to evaluate
    idiosyncrasies in LLM generations – a synthetic classification task with a goal
    of predicting the origin of a given output. Using this framework, we find that
    outputs from different LLMs are highly distinguishable: they can be distinguished
    with extremely high accuracies. We further identify concrete forms of these idiosyncrasies,
    including word-level distributions, formatting style and high-level semantics.
    Finally, we discuss how our findings have implications for the use of synthetic
    data, model similarity inference, and the design of more reliable evaluation protocols.'
