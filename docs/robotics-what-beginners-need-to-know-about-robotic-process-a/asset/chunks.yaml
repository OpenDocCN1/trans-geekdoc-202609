    changing. When combined, these are going to work off a high-performance computer
    that is inside of the complex vehicle. Though still being tested, driverless trucks
    are now also been created thanks to current improvements in autonomous automobiles.
    The government of the United Kingdom already passed Legislation on startup testing
    of self-driving trucks in 2018. A non-self-driving truck is going to be followed
    by a fleet of self-driving trucks. The Freightliner Inspirations is being tested
    at the same time by an automobile corporation in Germany called Daimler. This
    will be a semi-autonomous truck used on the highway. One of the big factors that
    influence if a vehicle can be driverless is if the mapping is working properly.
    In general, maps of the area where a vehicle will be driving are generally pre-programmed.
    This map is going to include street lights and curb heights so that the vehicle
