    # Chapter 8: Autonomous Vehicles


    Self-driving cars are also known as robot cars or autonomous cars or even driverless
    cars. They are vehicles that will sense the environment they are in and move without
    human input or very little human input. Autonomous cars are going to come with
    a variety of sensors that will help them to evaluate their surroundings like initial
    measurement units, `GPS`, odometry, sonar, computer vision, `Lidar`, and radar.
    There are also advanced control systems that will interpret the sensory information
    to identify the proper navigation path and any obstacles or signs that may be
    in the car''s path.


    ## Benefits

    Some benefits are going to include increased safety and reduced cost. They will
    also increase mobility, reduce crime, and increase customer satisfaction. Safety
    benefits are also going to include a reduction in collisions and injuries that
    are going to lead to costs because of these collisions. Increase in traffic flow
    is predicted because of automated cars while also providing enhanced mobility
    for the poor, elderly, disabled, and children. They are going to make travel easier
    because drivers are not going to have to drive and navigate the entire time while
    also lowering their fuel consumption, as well as the need for a parking space.


    ## Challenges

    Some problems that are coming up with self-driving cars are safety, liability,
    and technology. Whenever someone is in the car, they are going to have a desire
    to control the vehicle. Not only that, but there are legal frameworks and government
    regulations that researchers have to go through. Then, it is going to make people
    feel like they have lost their privacy, which will then lead to security concerns
    like hackers or terrorism. Add on top of that, people losing their jobs because
    there is no longer a need for a driver to be behind the wheel. It will also cause
    an increase in suburbanization travel because it is going to be more convenient.


    ## Semi-Automated Vehicles

    The level of automation is one of the basis of many vehicles. They may be classified
    as fully autonomous or fully manually—driven vehicles. Semi-automated vehicles
    are what they are known as. It will take some time before the technology and infrastructure
    are fully developed for a fully automated vehicle, but while this is being researched,
    vehicles will increase based on their level of automation. Semi-automated vehicles
    are going to have an advantage over fully automated vehicles because the driver
    is still in control of the vehicle.


    ## Fields of Application


    ### Automated Trucks

    Many companies are doing testing of automated technology in semi-trucks. In 2016,
    Uber bought a self-driving trucking company, `Otto`, wherein they had to demonstrate
    their trucks on the highway before Uber bought them. Then, in 2017, a San Francisco-based
    startup announced that they were going to be partnering with a truck manufacturer
    by the name of `Peterbilt` so that they can deploy and test automated technology
    in the `Peterbilt` vehicles. `Waymo` is supposedly doing testing of automated
    technology in trucks, but the project has no provided timeline. Also, in 2018,
    San Francisco-based `Starsky Robotics` completed a driverless trip to Florida
    for seven miles. This made them the first player in the game of a driverless truck
    on a public road.


    Over in Europe, truck platooning is starting to be considered with the `Safe Road
    trains for the Environment` approach. `Lockheed Martin` along with funding that
    is coming from the United States Military has developed an automated truck conveying
    system that is going to place a truck in the lead that is run by a human and then
    there are going to be trucks that follow it autonomously. This is being developed
    as part of the Army’s `Autonomous Mobility Applique System (AMAS)`. In 2014, this
    system consisted of an automated driving package that will be installed in up
    to nine different types of vehicles that will have to go through at speeds of
    40 mph over driving for 55,000 hours. In 2017, `AMAS` was starting the plans to
    field up to 200 trucks that are part of a rapid fielding program.


    ### Transport Systems

    Transport systems that are created for automated cars are starting to be operated
    in cities, such as parts of the UK, France, Italy, and Belgium, and in the Netherlands,
    Spain, and Germany, they are publically testing them in traffic.


    The UK launched a public trial for an automated pod, `LUTZ Pathfinder`, located
    in Milton Keynes. `PSA Peugeot- Citroen` has been allowed to run trials in Paris
    by the government of France on the summer of 2014. The experiments were planned
    to move on by 2016 to cities like Strasbourg and Bordeaux. The alliance that is
    between the companies from France, `Valeo` and `THALES`, has been allowing for
    tests of their own to be run.


    Over in New Zealand, using automated vehicles for public transportation have been
    already planned in cities such as Tauranga and Christchurch. Then, in China, an
    automated minibus has been produced which can seat 14 people without a driving
    seat. There have been over 100 vehicles produced, and 2018 marked the first year
    for a commercial automated service available in China. These mini-buses should
    move on to level four, and this is going to be a driverless environment on a closed
    road.

