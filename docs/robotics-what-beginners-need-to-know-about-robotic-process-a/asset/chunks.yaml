    # 第 4 章：关于机器人流程自动化你需要了解的一切


    机器人流程自动化也称为 `RPA`，它正以业务流程自动化技术的形式迅速出现，这种技术将基于机器人和人工智能运行的程序。在大多数传统的工作流自动化工具中，通常会有一位开发者创建一个完成任务所需的自动化化的动作列表，并通过内部应用程序接口或
    `API` 与系统后端进行接口连接。它还可以使用专门的脚本语言。


    这种情况将会有所不同，因为 `RPA` 系统将通过观察用户的操作来开发动作列表，并将这些列表放置在应用程序的图形用户界面中，然后通过直接在 `GUI` 中重复任务来执行自动化。这将能够消除障碍，使自动化能够应用于那些可能不包含
    `API` 的项目。在技术层面，`RPA` 工具将具有与图形用户界面工具某些相同的技术。这些工具可以对与 `GUI` 相关的交互进行编程，并且通常通过重复用户执行过的动作来实现。


    `RPA` 工具与其他系统不同，它们包含了能够在多个应用程序运行之间及运行期间处理数据的功能。例如，当你收到一封附有发票的邮件时，数据可以被提取并输入到跟踪财务状况的系统中。


    ## 演变历史


    `RPA` 被认为是一项重技术进步，由于这种解决方案，它需要新的程序平台出现，以便在大型企业中使用时更加成熟、稳健、可扩展，甚至更加可靠。当你看到技术自屏幕抓取（screen
    scraping）以来取得了巨大的进步时，通过观察一个学术研究中经常引用的例子，你可以更好地理解它。


    用户使用名为 `Xchanging` 的平台——这总部位于英国、在全球范围内提供业务处理、采购服务和技术的全球性公司——有一个名为 `Poppy` 的拟人化机器人。从这个例子中可以看出其才华水平以及使用的易用性，特别是在一些更现代的技术平台上。正因如此，用户可能不会将其视为一个假设的程序化服务，而是一个实体或物体。得益
    `RPA` 的无代码平台，这将是将 `RPA` 与屏幕抓取区分开来的特征之一。


    ## 部署托管


    托管 `RPA` 服务将符合程序机器人的比喻，每个机器人动作都有自己的工作场所，类似于人类工人。机器人可以使用计算机上看到的控制按钮来采取行动并执行任务。通常，这些动作发生在受控环境中，而不是显示器上，因为机器人不需要物理屏幕来查看其结果。相反，它将以电子方式解释结果，因此它们不需要显示在屏幕上。


    如果这些现代解决方案无法大规模部署，那么它的可用性将受到限制，只能管理少数物理硬件和相关成本。将 `RPA` 实施到大型企业中，每当与传统的非 `RPA`
    解决方案相比时，都节省了大量资金。当然，`RPA` 也有它的风险。批评意见包括抑制创造力的风险，甚至可能导致现有的程序产生更复杂的维护环境。


    ## RPA 对就业的影响


    当你查看《哈佛商业评论》（`Harvard Business Review`）及其对 `RPA` 的观点时，你会发现他们认为大多数运营小组将采用 `RPA`，同时向为其工作的员工承诺，机器人不会导致失业。相反，工人将接受重新培训，以便他们可以花时间做更有趣的事情。


    根据一项学术研究，工人不应该觉得自动化是对其知识的威胁，而应将其视为队友。在同一项研究中，你还可以看到，技术部署后，并没有导致人数减少，而是相同的人数产生了更高的生产力。


    另一方面，一些分析师认为 `RPA` 对于外包其工作的业务流程来说是一个风险。这将为国内地区被认为是熟练流程设计师的人创造高价值的工作，但将减少离岸低技能工人的可用机会。


    ## 对社会的影响


    更多的学术研究已经完成，并预测 `RPA` 和其他技术进步将帮助开启一个生产力更高、方法更高效的新时代，使全球劳动力市场受益。尽管如此，这些不能直接归功于
    `RPA`。


    许多研究人员或协会认为，到 2035 年，所有工作的 35% 将被自动化。同时，伦敦政治学院（`LSE`）论文的作者 Willcocks 教授谈到了工作满意度和智力刺激的增加，这可以描述为技术进步释放了人类。这种对机器人接管人类日常平凡和重复性工作的引用，让他们能够去做更有趣或更有意义的事情。


    ## RPA 与机器人技术


    正如你在本章早期看到的机器人流程自动化将使机器人能够自动执行任务，这样它们就不需要每天接受如何执行某事的培训。这将帮助人类转向更有趣、更有意义的事情，提高所制造产品的质量。这将导致公司更多地关注客户服务和其他他们可能短板的领域，因为他们现在有了资源重新培训员工从事另一份工作。


