- fmt: "\n## 2. Robots can take the place of a human in a factory. This means that\
    \ people will need to locate a new job or they will have to be retrained to do\
    \ a different job. In the event that robots replace humans in a variety of fields,\
    \ this can lead to a high unemployment rate because not everyone can be trained\
    \ to do maintenance on robots.\n\n## 3. As stated, robots require maintenance\
    \ and repair, which is going to cost money. Plus, their programs will have to\
    \ be updated regularly because the requirements for the job may change. The machines\
    \ will have to be made to be smarter. In the event that there is a breakdown,\
    \ the cost of repair is going to be high. This means that the procedures have\
    \ to be restored, lost code of data recovered, and this can not only be costly\
    \ but time-consuming as well.\n\n## 4. Robots store a lot of data. However, getting\
    \ access to the data is going to be harder than if you were pulling it out of\
    \ a human brain. Robots are built to complete repetitive tasks, but they are not\
    \ going to get better the longer that they do it like a human will.\n\n## 5. Robots\
    \ are not going to act in a way that is not already built into their programming.\
    \ With how robots are being used today, people are going to easily be able to\
    \ become dependent on machines which will end up causing them to lose control\
    \ of their mental capacities. If the wrong hands took control of a robot, that\
    \ robot could be used for destruction.\n\n## 6. A robot is not intelligent or\
    \ sentient. They cannot improve upon their jobs unless they are programmed to\
    \ do so. They cannot think or have emotions. This severely limits how robots can\
    \ assist or communicate with humans.\n\n## Real-world Applications\nRobots are\
    \ no longer science fiction; they are very real and in the world that we live\
    \ in today. No, they are not trying to take over the world like some of the movies\
    \ that we see, but they are working side by side with us and helping to improve\
    \ our lives and making it so that we can improve the lives of those that we are\
    \ working for. Below, you are going to see some real-world applications of robots\
    \ and how they are helping make our world a better place:\n\n1. **Bionic legs**\
    \ : bio-mechatronics is a revolutionary work being done by Hugh Herr who is the\
    \ head of the biomechatronics research group at `MIT`. Herr is a double amputee\
    \ who used human physiology with electro-mechanics to create a bionic limb for\
    \ someone who has physical disabilities. His bionic achievements have included\
    \ gait-adaptive knee prostheses for transfemoral amputees and a variety of impedance\
    \ ankle-foot exoskeletons for gait pathology, which is also known as drop foot\
    \ that can be caused by cerebral palsy, strokes, or multiple sclerosis. He has\
    \ even done his own bionic legs which is the first foot and calf system.\n\n2.\
    \ **Hospital robots** : `Atheon`'s focus is on the healthcare industry. By using\
    \ autonomous mobile robots, they have helped with the transportation of heavy\
    \ materials like laundry, clinical supplies, and cleaning products. On top of\
    \ that, the `TUG` machines can safely remove hazardous waste. Being that regulations\
    \ require that medical centers have to track all drugs, particularly narcotics,\
    \ `Aethon` robots can deliver medicine as a part of an `IOT` (Internet of Things)\
    \ scenario. Plus, it has `RFID` chips and barcodes on all the medicines that are\
    \ going to enable it to track the medicines in real time.\n\n3. **Robot valets**\
    \ : Smart garage vendors like `Boomerang` provide a unique approach to the garage.\
    \ `Boomerang` functions like an elevator to park your car. These are primarily\
    \ in locations where real estate is expensive, such as `San Francisco`, `Miami`,\
    \ and `Chicago`.\n\n4. **Parking lot robots** : `Serva-TS` works like a forklift\
    \ that can shuffle vehicles through a parking lot. \n\n5. **Factory robots** :\
    \ Boston's `Rethink Robotics` introduced robots that can work alongside humans\
    \ to do pick and pack.\n\n6. **Collaborative robots** : Denmark’s `Universal Robots`\
    \ have brought out a whole line of collaborative robots to the world market. These\
    \ robots are programmable to handle repetitive tasks.\n\n7. **Robotic factory\
    \ painter** : `ABB Robotics` has come up with a line of robotic painters. There\
    \ is a hollow wrist in `IRB580` that is compact and is a fast and accurate painting\
    \ robot. This robot helps increase productivity and presents more efficiency.\n\
    \n8. **Collaboration** : `KUKA` systems have launched collaborative robotics that\
    \ is meant to meet the needs of the growing market. This robot features sensory\
    \ capabilities for safety, simple operator control, and faster teaching. There\
    \ are a few applications to these robots that include inspection, testing, measuring,\
    \ palletizing, machining, and fastening.\n\n9. **Humanoid robots** : The Intelligent\
    \ Robotics Laboratory’s director, Professor `Hiroshi Ishiguro`, (the laboratory\
    \ is part of the Department of Systems Innovation in the Graduate School of Science\
    \ at the `Osaka University` in Japan) has created an android that goes by the\
    \ name of `Geminoid`. `Geminoid` looks exactly like Professor `Ishiguro`.\n\n\
    10. **Humanoids helping humans** : Even though these robots look humanoid and\
    \ are considered to be cute, they are not all invented to do household chores\
    \ or entertain. `Honda` and `Toyota` created a walking assisted device for those\
    \ that are physically impaired or elderly. `Cyberdyne`’s `HAL` (Hybrid Assistive\
    \ Limb) system is the only robotic device that can help to teach the brain how\
    \ to move the limb that it is replacing. On top of that, the medical applications\
    \ have full body `HAL` systems that are going through research and development\
    \ to enhance or protect the human body for situations like disaster recovery,\
    \ harsh environments, or circumstances where humans need to have superior strength\
    \ and endurance.\n\n## Chapter 2: Five Reasons Why Experts Warn Us about Robots\n\
    \ experts condone the use of robots and others do not. Then, some experts are\
    \ somewhere in the middle:\n\n1. **Elon Musk** : `Elon Musk` is a billionaire\
    \ and a techpreneur who has been issuing warnings to the public when it comes\
    \ to the dangers of artificial intelligence being used for military robots.\n"
