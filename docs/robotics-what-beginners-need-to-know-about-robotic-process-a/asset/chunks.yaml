    # Chapter 4: Everything You Need to Know about Robotic Process Automation


    Robotic process automation is also known as `RPA` and is quickly emerging in the
    form of business process automation technology which is going to be based on the
    programs that robots and artificial intelligence work on. In most traditional
    workflow automation tools, there is going to be a developer that will create a
    list of actions that have to be automated for a task to be completed while being
    interfaced to the back of the system through the use of an internal application
    program or `API`. It can also use dedicated scripting languages.


    This is going to be different because `RPA` systems will develop action lists
    by watching what users do and they will be placed in the application’s graphical
    user interface before they execute the automation through repetition of the task
    directly in the `GUI`. This will be able to remove the barrier that will allow
    automation to be used in projects that may not contain `API` for this reason.
    `RPA` tools are going to have some of the same techniques that are seen in graphical
    user interface tools on a technical level. The tools can program the interactions
    that are tied to the `GUI` and usually do so by repeating the actions that were
    done by the user.


    `RPA` tools will be different from other systems which include features that can
    enable data to be dealt with between and during the running of several applications.
    Take for example, when you receive an email that has an invoice attached. The
    data can be extracted and then typed into a system that is going to keep track
    of the finances.


    ## History of Evolution


    `RPA` is noted as a major technological advancement, and it is because of this
    solution that it will require new program platforms that are coming out to be
    more mature, resilient, scalable, and even reliable when being used by large enterprises.
    When you look at how far technology has come since screen scraping, you will be
    able to understand it better when you look at an example that is often cited in
    academic studies.


    A platform that users use known as `Xchanging` – a global company based out of
    the UK which provides business processing, procurement services, and technology
    throughout the world – has an anthropomorphized robot that goes by the name `Poppy`.
    From this example, the level of genius and how user-friendly it is to use, especially
    in some of the more modern technology platforms, can be seen. Because of this,
    users could see it not as a hypothetical programmed service, but as an entity
    or thing. Thanks to the code-free platform of `RPA`, it will be one of the biggest
    things that set `RPA` apart from screen scraping.


    ## Deployment Hosting


    Hosting `RPA` services is going to align with a metaphor for programmed robots
    where every robotic movement has its own workplace, similar to human workers.
    Robots can use the same controls that are seen on a computer to take action and
    execute tasks. Typically, these actions are going to occur in a controlled environment
    and not on a display because a robot is not going to require physical screens
    to see their outcomes. Instead, it will interpret the outcomes electronically
    so that they do not need to be displayed on a screen.


    If these modern solutions could not be deployed on a large scale, then its availability
    will be limited and can only manage a few physical hardware and associated costs.
    Implementing `RPA` into major enterprises has helped save a lot of money whenever
    it has been likened to the more traditional non-`RPA` solutions. Of course, `RPA`
    has its hazards. Criticism includes the risk of suppressing creativity and can
    even end up making more complex maintenance environments out of the programs that
    already exist.


    ## The Impact of RPA on Employment


    When you look at the `Harvard Business Review` and what they said about `RPA`,
    you will see that they believe most operations groups will adopt `RPA` while making
    a promise to those that work for them that robots are not going to result in unemployment.
    Rather, the workers will be retrained so that they can spend their time doing
    something more interesting.


    According to an academic study, workers shouldn’t feel that automation is a threat
    to their knowledge, but acknowledge them as teammates. In the same study, you
    can also see that instead of resulting in a lower headcount, when technology has
    been deployed, there has been more productivity with the same number of people.


    On the other hand, some analysts believe that `RPA` is going to be a risk to business
    processes that outsource their work. This will create high-value jobs for those
    that are considered skilled process designers in onshore locations, but it is
    going to decrease the available opportunities that are there for low skilled workers
    offshore.


    ## Impacts on Society


    More academic studies have been done and have projected that `RPA` and other technological
    advances will help to usher in a new era of more productivity and more efficient
    methods that will benefit the global labor market. These gains cannot be directly
    attributed to `RPA` alone though.


    Many researchers or associations believe that up to 35% of all jobs are going
    to be automated by 2035. At the same time, Professor `Willcocks`, who is the author
    of an `LSE` paper, spoke about an increase in job satisfaction and intellectual
    stimulation which can be characterized as technology taking technology advances
    out of humankind. This reference to robots taking over people’s daily mundane
    and repetitive workload leaves them to do something more interesting or meaningful.


    ## RPA and Robotics


    As you have seen earlier in this chapter, robotics process automation is going
    to make to where robots can automate their tasks so that they do not have to be
    trained on how to do something each day. This is going to help humans move on
    to doing something that is more interesting and meaningful, which is going to
    make the production quality of products being made go up. This will then result
    in companies putting more focus on customer service and other areas where they
    may be lacking because they now have the resources to retrain their employees
    to do another job.

    '
