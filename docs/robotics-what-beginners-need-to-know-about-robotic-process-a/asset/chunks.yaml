- fmt: "\n# Chapter 7: Machine Learning\n\n‘Machine learning’ refers to the subfield\
    \ found in PC (Personal Computer) science where PCs are given the tools needed\
    \ to learn without being programmed by a person. The evolution of this study included\
    \ pattern recognition and learning theory that can be found in the artificial\
    \ intelligence field. The machines are going to explore the study and learn how\
    \ to construct algorithms and make predictions with the data that is provided\
    \ for these algorithms like overcoming the static programming instructions. These\
    \ instructions are going to be driven by data for predictions or decisions by\
    \ using basic inputs of data to build a model. Algorithms are invented in computing\
    \ tasks and carried out with optimum performance. This is where you typically\
    \ employ machine learning. An example of this is the sorting that your email does\
    \ in an effort to keep your email secure. Machine learning tends to overlap with\
    \ PC statistics where predictions are made through a PC that has strong ties to\
    \ optimize mathematical equations. This also makes it to where theories, methods,\
    \ and applications dominate the field. Data mining, which uses data analysis,\
    \ is often confused with machine learning. Unsupervised learning is what you also\
    \ call data analysis. Even if it is unsupervised, machine learning should also\
    \ learn to create a baseline for its behavior before finding meaningful anomalies.\
    \ In the data analytic field, machine learning is going to be used to create methods\
    \ that are complex along with algorithms that are going to be used in predictions.\
    \ These predictions are known as predictive analytics when used commercially.\
    \ The predictions are going to enable researchers, analysts, engineers, and data\
    \ scientists to make reliable decisions as a way to uncover any insights that\
    \ may be hidden by learning from data trends and historical relationships. Back\
    \ in 2016, machine learning was made a buzzword for the Gartner hype cycle while\
    \ it was at the peak of its inflated expectations. Due to the fact that finding\
    \ patterns is difficult, there is often not enough training to go around.\n\n\
    ## Tasks and Problems\n\nDepending on the learning’s nature, you can classify\
    \ machine learning into three categories:\n\n1. **Unsupervised learning**: labels\
    \ are not going to be given for the learning algorithms that are used which are\
    \ going to leave it to find its own structure in the input. You can use unsupervised\
    \ learning as a goal in finding patterns that are hidden in the data that you\
    \ are using or as a means to an end.\n2. **Supervised learning**: your PC is going\
    \ to be given inputs as well as the outcome that you are going to want so that\
    \ the PC can learn a general rule in how to map out the input and outcomes.\n\
    3. **Reinforcement learning**: there is going to be a PC program that works with\
    \ a dynamic environment to perform specific goals such as when you play a game\
    \ against an opponent. Feedback will be given to you by the program in terms of\
    \ rewards and punishments as it navigates the space of the problem.\n\nThere is\
    \ semi-supervised learning that is going to fall between supervised and unsupervised.\
    \ This is going to be when you are going to give training signals that are not\
    \ complete with the training set so that the program has to do some of the work.\
    \ Transduction is going to be whenever the principle takes on the entire problem\
    \ such as learning times. But this is not going to work whenever targets are missing.\
    \ \n\nMachine learning also includes categories such as learning, where the program\
    \ is going to learn the inductive bias of the program based on experiences that\
    \ have happened before. Developmental learning is going to be the same as robot\
    \ learning where the program is going to be able to generate its own sequence\
    \ from the learning situations that it is put through so that it can learn novel\
    \ skills by interactions with humans and other programs and self-exploration.\n\
    \nYet another category of machine learning is going to happen when you consider\
    \ what the outcome is from the machine learning system:\n\n1. **Classification\
    \ of inputs**: is going to be divided into at least two classes where the user\
    \ is going to have to produce a model that is going to take the inputs that are\
    \ not seen by the user from these classes. This is going to usually happen in\
    \ supervised learning, such as when your email filters between spam and not spam.\n\
    2. **Reversion**: is also going to be supervised for the outcomes to be continuous\
    \ instead of being discrete.\n3. **Clustering**: is going to take the input sets\
    \ and divide them into various groups. However, the difference between clustering\
    \ and classification is that the groups are not going to be known to the user\
    \ before they are made, which makes this an unsupervised task.\n4. **Density estimation**:\
    \ is going to locate the distribution for the inputs in that space.\n5. **Dimensionality\
    \ reduction**: takes the input and simplifies it so they can be mapped to the\
    \ lowest dimension.\n6. **Topic modeling**: will take a problem from the program\
    \ that is inserted by a user and tasked to see if the documents that were inserted\
    \ cover related topics.\n\nA classification machine learning model is going to\
    \ be able to be validated by a technique that uses accuracy estimation such as\
    \ a `holdout`. A `holdout` is going to split the data when training and testing\
    \ your set before evaluating the model. However, if you look at `n-fold cross-validation`,\
    \ then you are going to see that the data will randomly be split into subsets\
    \ where `k` instances are going to be used in training the model while `k-instance`\
    \ is going to be used in testing. Along with this, `holdout` and `cross-validation`\
    \ method is going to use samples for instances where assessing the model’s accuracy.\n\
    \nMetrics for evaluating models include:\n- `Accuracy`\n- `Specificity`\n- `Sensitivity`\n\
    - `True negative rate`\n- `True positive rate`\n- `False positive rate`\n- `False\
    \ negative rate`\n- `Total operating characteristic`\n- `Area under the curve`\n\
    \n## Neural Networks\n\nMachine learning often brings up ethical questions. Due\
    \ to the fact that the output is based on the exhibits that are going to use,\
    \ the responsibility that comes from collecting data is going to be a big part\
    \ of machine learning. Statistics and PC science have applications coming out\
    \ that are going to be used. Neural networks are biologically inspired to enable\
    \ PC to learn from data. \n\n### Perceptrons and Architecture\n\nNeural networks\
    \ work with an artificial neuron known as a `perceptron`, which was developed\
    \ in the 60s by Frank Rosenblatt. But when we look at it today, it is going to\
    \ be used like other models of artificial neurons. Your main neuron is going to\
    \ be known as the `sigmoid neuron`. To understand the `sigmoid neuron`, you have\
    \ to understand the `perceptors`. `Perceptrons` take several binary inputs and\
    \ give you a single binary outcome. Rosenblatt came up with a single rule that\
    \ will be used when dealing with the outcome of `perceptors`. This is where `weights`\
    \ came in as a way to express the real number, and they bring importance to the\
    \ inputs and outcomes. The outcome for the neuron is going to either be 0 or 1\
    \ and determine the weight of the sum and if it is less than or greater than the\
    \ `threshold value`. Your `threshold value` is going to be a real number that\
    \ is going to be used in the parameters for the neuron.\n\nThink of the `perceptron`\
    \ as a device that makes its decisions by weighing the evidence. For example,\
    \ if you want to go on a family outing, there are several things that you are\
    \ going to look at to determine if you are going to be able to go the outing as\
    \ planned:\n1. Is the car big enough for everyone that wants to go?\n2. Is the\
    \ weather going to be good?\n3. What do you need to pack for the amount of time\
    \ that you are going to be out?\n\nEach factor is going to be represented by a\
    \ binary variable. By looking at the `weights` and the `threshold` for your problem,\
    \ you can create different models for the decision-making process. Your `perceptron`\
    \ is going to be what decides if you go on your outing or not. When you drop the\
    \ `threshold`, you are going to most likely go on your outing with your family.\
    \ Keep in mind that your `perceptron` is not going to be a complete model of the\
    \ decision-making process that a human can do. However, your `perceptron` is going\
    \ to be able to weigh different evidence to make the decisions that you need to\
    \ make, which should seem plausible for a complex network of `perceptors` that\
    \ make small decisions that you may not notice are being made.\n\n### The Sigmoid\
    \ Function\n\nWhile a learning algorithm sounds like the way to go, how are you\
    \ going to create an algorithm for a neural network? Think about if you have a\
    \ network for your `perceptors` that you can use to solve problems. The inputs\
    \ for the network are like the raw pixel data that is scanned into the program\
    \ so that the network can learn `weights` and `biases` for the outcome to be classified\
    \ correctly.\n\nIf you make any changes to the `weight` in the network, your outcome\
    \ is going to correspond with the change that you made. However, the reality of\
    \ `perceptors` is that when a change is made to the `weights`, there is the possibility\
    \ that the `perceptron` is going to flip completely due to that change. This change\
    \ is going to cause the behavior of your entire network to change into a more\
    \ complex behavior.\n\nSo, while the `step function` is not obvious, you can overcome\
    \ the problem by bringing in a new neuron known as the `sigmoid neuron`. This\
    \ activation function falls between zero and one. It is defined by this equation:\n\
    \n```\nsigma(z) = 1 / (1 + e^-z)\n```\nor\n```\nsigma(z) = 1 / (1 + exp(-sum(wj\
    \ * xj) - b))\n```\n\nThe more you add to the examples that train the program,\
    \ the more the network is going to be able to learn more options. The `sigmoid\
    \ neuron` is going to be used because it can take any value that falls between\
    \ zero and one. This is vitally important. The derivative of the `sigmoid neuron`\
    \ is defined by this equation:\n\n```\nd(sigma)/dz = sigma(z) * (1 - sigma(z))\n\
    ```\n\n## Big Data\n\nIt seemed that 2012 was the year that the big data technologies\
    \ came around and were everything to everyone. But in 2013 big data analytics\
    \ became a thing. When you get a hold of substantial amounts of data, you are\
    \ going to manage it, but you are also going to pull out the most useful information\
    \ from the collections, and this is a more difficult challenge. Big data is not\
    \ only going to change the tools you use but it is also going to change the way\
    \ that people think about extraction and interpretation of data. Usually, data\
    \ science is going to be trial and error, which is impossible whenever working\
    \ with datasets that are larger and heterogeneous. However, the more data that\
    \ is available, there are usually going to be fewer options that are going to\
    \ be constructed for the predictive models due to the fact that there are not\
    \ going to be many tools that are capable of processing a huge amount of information\
    \ in a reasonable amount of time. Also, the traditional statistical solutions\
    \ are going to focus on analytics that is static, which is going to limit the\
    \ analysis samples that are frozen in time and are typically going to give you\
    \ results that are surpassed and unreliable. However, other alternatives are going\
    \ to fix the problems you have about research domains that are going to be expanded,\
    \ and this is machine learning. Statistics and PC science have applications coming\
    \ out that are going to be used.\n"
