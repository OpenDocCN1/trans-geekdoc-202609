  trans: "\n\n# 第 5 章：移动机器人\n\n移动机器人是能够移动的机器人。这些机器人通常被列为信息工程以及机器人学的一个子领域。移动机器人可以在环境中移动，而不会被困在某处。移动机器人可以是自主的，也可以是\
    \ AMR（自主移动机器人）。这意味着它们可以在没有人类或机电设备引导的情况下，在不受控制的环境中导航。另一方面，移动机器人将依赖于引导软件，这些软件使其能够在受控环境中覆盖预设的路线。这类车辆被称为自动引导运输车辆或简称\
    \ AGV。\n\n相比之下，工厂机器人大部分是静止的，因为它们配合关节臂和抓取器组件工作（它们也可以与末端执行器一起工作），这些组件由于固定在自己的工作空间上而无法移动。移动机器人在工厂和商业环境中变得越来越普通。医疗中心已经开始使用移动机器人，它们可以沿着预定的路线移动人类工人因太重而无法移动的产品。仓库已开始安装移动机器人系统，以便将材料从货架高效地移动到履单区。目前的研究以及大多数大学通常集中在移动机器人上。安全和军事领域也使用了移动机器人。\n\
    \n家用移动机器人包括可以执行园艺或吸尘等家庭任务的娱乐机器人。移动机器人的模块将是控制器、控制程序、执行器和传感器。控制器通常是一个与远程或笔记本电脑连接的微处理器。程序将是某种脚本语言，如\
    \ `C` 或 `C++`。传感器将取决于机器人设置的条件。这些条件可能包括处理技能、感知触碰的传感器、感知与物体的距离、根据其位置形成地图，甚至是避免碰撞，以及任何数量的其他应用。\n\
    \n## 分类\n\n移动机器人分为以下几类：\n\n1. **它们运行的环境**\n    - 极地机器人的发明是为了在跨越冰雪和充满深渊的气候中导航。\n\
    \    - 在陆地或家庭中使用的机器人通常称为无人地面车辆或 UGV。它们通常在履带或轮子上移动，但也可以涵盖带腿的机器人。这些机器人由两条或更多腿组成。\n\
    \    - AUVs（自主水下机器人）是水下机器人的称呼。\n    - UAV（无人机）是空中机器人的称呼。\n\n2. **它们用于移动的设备**\n\
    \    - 履带\n    - 轮子\n    - 腿\n\n## 机器人导航\n\n1. **物理远程或遥操作**：这种机器人是物理遥控的，驱动员通过开关或其他远程控制设备对其下达命令。远程设备将直接插入机器人，或者作为笔记本电脑或其他操作手段的附件。遥操作机器人将用于确保操作员的安全。几个远程手动控制机器人的例子有\
    \ Robotics Design 的 Anatroller ARI - 50 和 ARI - 100。还有 KumoTek 的 MK-705 Rosterbot\
    \ 和 Foster-Miller 的 Talon。\n\n2. **受保护的遥操作**：这种遥操作机器人受到保护，可以检测并绕过障碍，但会在驱动的同时进行导航。手动遥操作机器人可以与此比较。仅提供受保护遥操作的移动机器人不多（如果有的话）。\n\
    \n3. **循线车**：它们会遵循嵌入天花板或地板或涂画的视觉线条。它们还会遵循铺设在地面上的电线。许多此类机器人运行在基础算法上即“保持线条在传感器中心”。这些机器人不会绕过障碍；相反，它们会停止并等待阻塞路径的物体被移除。你仍然可以买循线车，因为它们是由\
    \ Transbot、FMC、Egemin、HK Systems 以及其他几家生产的。这样的机器人在机器人协会中仍然流行，因为它们是学习机器人学的第一步。\n\
    \n4. **自主随机机器人**：具有随机运动的自主机器人即使感知到墙壁也会撞上墙壁。\n\n5. **自主引导机器人**：它们拥有关于目的地的少量数据，以及到达目标或路线上需要停止的任何地方的信息。得益于至少一种以下方法，可以确定机器人当前的位置——传感器、视觉、全球定位系统、激光和双目视觉。这些定位系统通常使用蒙特卡洛/马尔可夫定位、相对位置和三角测量法来确定平台相对于下一个目标路径的精确位置。这种机器人可以从传感器收集带有位置和时间戳的读数。以\
    \ PatrolBot 为例，这种机器人充当保安，紧急情况发生时向指挥中心发送通知，操作电梯并响应警报。其他自主引导机器人可以使用医院。计算机科学家 Ahmed\
    \ Elgammal 博士、生物学家 Simeon Kotchomi 博士和工程师邹庆泽博士在 2013 年帮助艺术家 Elizabeth Demaray\
    \ 创造了一个能够为盆栽寻找水和阳光的自主机器人。\n\n"
- fmt: "\n# Chapter 6: Artificial Intelligence\n\nArtificial intelligence, otherwise\
    \ known as AI, is often referred to as machine intelligence and it is the intelligence\
    \ that is commonly shown in machines as opposed to the natural intelligence that\
    \ is usually seen in humans and various other mammals. When it comes to computer\
    \ science, artificial intelligence research is going to be listed as a study of\
    \ intelligence that is shown by devices that can perceive the environment around\
    \ it in order to take actions that can maximize its chances of being successful\
    \ in reaching its goals.\n\nInformally, the word artificial intelligence will\
    \ usually be linked to a machine that can copy a human’s cognitive function, problem-solving\
    \ or learning. Definitions often remove how AI has the capability of using intelligence\
    \ in completing tasks. This is considered to be a phenomenon that is known as\
    \ the AI effect which can be lead to the quip that is found in Tesler’s Theorem\
    \ that states “AI is whatever hasn’t been done yet.” Take, for example, special\
    \ recognition through vision has become known as conventional technology. Modern\
    \ machines are now capable of things that classify them as AI because they can\
    \ successfully understand human speech while also competing in high-level strategic\
    \ games like chess. They can also autonomously operate cars and are intelligent\
    \ enough to deal with routing in military simulations and content delivery networks.\n\
    \n## Classification of Artificial Intelligence\n\nArtificial intelligence was\
    \ classified into three different classes by Kaplan and Haenlein, which they borrowed\
    \ from the management literature – humanized artificial intelligence, human-inspired,\
    \ and analytical.\n\n*   **Analytical artificial intelligence**: is going to only\
    \ have characteristics that are consistent with cognitive as well as emotional\
    \ intelligence when it comes to understanding, as well as recognizing, cognitive\
    \ elements and human emotions that are factored into the decisions they make.\n\
    *   **Humanized AI**: shows characteristics of every competency (emotional, cognitive,\
    \ emotional, and social intelligence) as well as being self-aware and self-conscious\
    \ enough to have interaction with others. \n*   **Human-inspired artificial intelligence**:\
    \ must all have human-like appearance besides its perceptive, social, and cognitive\
    \ abilities. They must be able to clearly communicate with the use of natural\
    \ language. And the latest advancement called olfaction brings the roots much\
    \ closer to humans since they can now recognize smells.\n\n## History and Evolution\n\
    \nSometime around 1956 was the first foundation of artificial intelligence as\
    \ an academic discipline. Multiple waves of optimism were experienced in the following\
    \ years, which have also been followed by many failures and even funding problems.\
    \ This was named the AI winter, but it was quickly replaced by new AI approaches,\
    \ triumphs, and more funding given to robotic research. For much of its history,\
    \ artificial intelligence experimentation has been able to be separated into subfields\
    \ that typically fail to keep in contact with each other.\n\nThe subfields can\
    \ typically be sorted out based on their technical considerations and even a specific\
    \ set of goals while using particular tools or even analytical differences. These\
    \ subcategories can also be created based off of social factors that the institution\
    \ or researchers are interested in.\n\nArtificial research’s traditional goals\
