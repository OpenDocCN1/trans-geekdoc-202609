    ## 引言

    接下来的章节将讨论你对机器人技术需要了解的一切知识。当你观察周围的世界时，越来越多的机器人技术被应用到我们的生活中。由于机器人技术在我们的生活中变得越来越重要，因此了解机器人是如何工作的以及一些关于机器人的常见误应对你至关重要。书中包含了许多主题，你将读到一些专家以及他们对机器人技术的看法。在决定将其斥为骗局或更糟糕的某些之前，了解关于机器人的一切知识是至关重要的。


    ## 第一章：机器人基础

    机器人技术被认为是一门详尽的科学与工程分支。机器人技术涵盖了不同的工程领域，如电子学、信息学、机械工程、计算机科学等！它通常与机器人的使用、它们如何被发明、如何运行以及用于控制机器人的计算机系统有关。它还包括传感器的反馈以及机器人必须处理的信息。机器人技术被用于创建通过复制人类动作来取代人类的机器。机器人可以在许多情况下用于许多用途。然而，当你观察今天的社会时，它们可以用于人类不应该进入的危险环境，例如炸弹的探测甚至拆除炸弹。机器人还可以被用于制造过程，在这些过程中，由于空间、空气质量或其他许多危险情况，人类将无法生存，且极可能无法危险。机器人可以采取几乎任何形式，它们甚至可以被制成外形像人类。据说这样做有助于人们接受机器人，因为它们复制了通常由人类执行的行为。某些机器人可以复制起重、说话、行走、感知以及人类所能做的几乎任何事情。今天看到的许多机器人将受到它们将要工作环境的灵感。这些机器人将对自然做出贡献，因为它们对生物仿生领域做贡献。创造机器人的概念可以追溯到古典时代。然而，对此的研究以及创造完美机器人的潜力直到
    20 世纪初才真正付诸行动。在整个历史上，人们一直认为机器人将模仿人类行为，并像人类每天一样处理任务。现在，得益于技术的进步，你可以看到机器人技术是一个快速发展的领域。


    ### 词源

    “robotics”一词源于“robot”。这个词是由捷克作家卡雷尔·卡佩克（Karel Capek）在 1920 年发表的作品中引起公众关注的。“robot”的起源可以追溯到斯拉夫语词汇“robota”，意为劳动或工作。在卡佩克的剧中，它出现在一个制造机器人的工厂，这些生物被误认为是人类（人形的概念）。然而，“robot”这个词并不是卡佩克创造的，而是他的兄弟约瑟夫（Josef）创造的。但是，当你查阅《牛津英语词典》时，“robotics”一词是由艾萨克·阿西莫（Isaac
    Asimov）在 1941 年发表的一篇科幻小说首次使用的。阿西莫由于电子设备中的技术和科学，并没有意识到自己正在创造新词。因此，他假设“robotics”将仅指机器人的工作。


    ### 历史

    1948 年，诺伯特·维纳（Norbert Wiener）首次创立了控制论原理，这是机器人技术的基础。第一台全自动机器人出现在 20 世纪。第一个可编程数字机器人命名为
    `Unimate`，它于 1961 年投入使用，从压铸机中取出汽车零件并进行堆叠。今天，全球范围内都在商业和工厂作业中使用机器人，它们执行任务比人类更廉价、更准确、更可靠。它们还被用于不适合人类的工作，因为这些工作太单调、危险或肮脏。机器人被用于大规模生产、制造、采矿、运输、包装、手术、地球和太空探索、安全、武器以及实验室研究。


