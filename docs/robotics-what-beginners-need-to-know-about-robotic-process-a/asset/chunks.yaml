    嗯，机器人基本上就是会移动的计算机。因此，如果它们被黑客攻击，其威胁将比静态电脑被攻击大得多。每当一台静态电脑被攻击时，黑客只能窃取信息并利用该系统攻击其他系统。然而，每当一个机器人被攻击时，它就可以被用来伤害他人甚至杀死他们，因为它可以移动。同时，一些机器人带有摄像头和麦克风，因为它们可以被用作间谍工具。有些人仍然认为这只会发生在电影或书籍中，但风险和威胁是真实的，而且已经有机器人伤害人类或破坏财产的证据。例如，美国劳工部有一份机器人相关事件清单，这些事件已导致数十人死亡。在过去的
    14 年里，机器人手术与美国的 144 例死亡有关。2016 年，一个中国机器人撞破了玻璃窗，并伤了站在附近的人。机器人的智能、力量和功能越强大，其威胁就越大。波士顿动力（Boston
    Dynamics）发布过一段视频，展示了一个机器人进行特技动作，以此展示公司的先进技术。现在，想象一下这项技术被黑客攻击。如果一个拥有这种强度和智能的机器人被攻击并接收到恶意指令，会发生什么？话如此，友好机器人的安全防护很容易被绕过，一个曾经乐于且受信任的机器人可能会变得恶意并伤害财产或人员。


    ### 2. 史芬·霍金

    已有超过 1000 名技术专家、研究人员和科学家写了一封信，对自主武器的危险发出警告。这封信由苹果公司联合创始人史蒂夫·沃兹尼克（Steve Wozniak）、史芬·霍金（Stephen
    Hawking）和埃隆·马斯克（Elon Musk）签署。


    这封信在 2015 年的一场国际人工智能会议上提交。它的出现是因为失控机器人是最近辩论的热的话题。在涉及禁止特定的自主武器时，联合国多个委员会对此进行了激烈讨论。科学专家一直试图禁止将人工智能用于可能脱离人类控制的武器中。他们还补充说，正如化学家和生物学家对制造生物或化学起源的武器不感兴趣一样，人工智能研究人员也不会对制造
    AI 武器产生兴趣，也不希望其他研究人员通过制造这些武器来嘲笑他们的领域。意识专家丹尼尔·丹尼特（Daniel Dennett）、谷歌 AI 首席德米斯·哈萨比斯（Demis
    Hassabis）以及麻理工学院教授诺姆·乔姆斯基（Noam Chomsky）也支持了这封信。史芬·霍金教授表示：“受限于缓慢生物演化的人类无法与[人工智能]竞争，并会被取代。”


    ### 3. 伊恩·皮尔森博士

    皮尔森博士是一位自封的未来学家和发明家，他声称 AI 最终将比人类聪明十亿倍，而与它融合是我们的最佳选择。


    皮尔森说：“我们会训练[人工智能]变得像我们一样，训练它像我们一样感受情感，但它并不会像我们。它会有点像《星际迷航》中的外星人——行动上更聪明、更有计谋。它对人类漠无表情，将我们视为野蛮人。因此，当它决定进行自己的病毒实验时，它会把我们当成实验鼠对待。”最终，友好机器人的安全防护很容易被绕过，一个曾经乐于且受信任的机器人可能会变得恶意并伤害财产或人员。


    ### 4. 欧洲

    今年早些时候，欧洲正在考虑为机器人提供法律地位。这项提议提交给了欧洲的最高监管机构——欧洲委员会。


    医学科学、伦理、法律、机器人技术和人工智能领域的 150 多名专业人士参与了辩论。在寄给欧洲委员会的一封信中，这些专家表示，该提议似乎并非受现实世界的影响，而是受科幻小说的影响。反对的人认为，如果为机器人提供法律地位，将允许制造商、所有者和技术人员声称对造成的任何损害不负责。委员会一名发言人表示：“人工智能可以为我们的社会和经济带来巨大利益……但也引发了一些问题，例如与未来工作有关的问题。”审查提议的专家表示，这归功于早些时候的科小说和煽动性的新闻发布。机器人伦理专家娜塔·内维扬斯（Nalie
    Nevejans）在法国阿尔图大学工作，她是签署该信的专家之一。她认为机器人拥有法律地位不仅没有帮助，而且是不恰当的。没有人类操作员，机器人不可能成为社会的一部分，这短期内不会改变。内维扬斯被报道曾说：“法律人格将模糊人与机器之间的关系，使立法者能够逐步转向向机器人赋予权利。这在我们开发它们的过程中完全是适得其反的。”欧洲应该为人工智能和机器人技术制定规则，以促进创新并确保公民的安全。


    ### 5. 澳大利亚和加拿大的总理

    已有数百名专家呼吁政府禁止具有决定人类生死的能力的机器人武器化。


