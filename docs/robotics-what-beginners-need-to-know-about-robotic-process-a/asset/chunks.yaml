    # 专家对我们的未来如何看？


    机器人专家丹尼拉·鲁（Daniela Rus）希望拥有一个每个人都能拥有机器人的世界，无论他们在经济阶梯中处于什么位置。鲁是马萨诸理工学院（MIT）计算机科学与人工智能实验室的主任，据报道她曾表示尽管机器人技术取得了巨大进展，但这一梦想尚未实现。


    “但请记住，仅仅在二十年前，计算还是少数专家的任务，因为电脑体型巨大、价格昂贵且难以使用，”鲁说。现在，每个人都在使用电脑，单是这一点就说明了技术已经进步到足以将人工智能带给世界。机器人技术仍处于婴儿阶段，但它们每天都在取得进展。


    如今，亚马逊（Amazon）拥有超过 80,000 台在履行中心工作的机器人。尽管有如此多的机器人为亚马逊工作，亚马逊的首席技术官并没有用机器人取代人类的想法。“人类在创造性解决问题、抽象和概括方面非常出色。机器人则非常擅长处理数据、提取数据、搬运重物以及精准移动。我们必须思考如何构建将这些组件的优势结合在一起的系统。”——
    泰·布拉迪（Tye Brady）。


    来自 Neurala 的海瑟·艾姆斯（Heather Ames）透露，他们正在与摩托拉解决方案（Motorola Solutions）合作，使用用于寻找失踪儿童的人工智能。警察制服上的摄像头将收到失踪儿童的描述，这样在孩子迷失时会有更多的人在寻找。这套系统也将用于寻找可疑包裹。


    Airware 的巴迪·米基尼（Buddy Michini）表示，无人机将能够帮助急救人员评估灾难性事件。“他们可以利用无人机获取发生情况的概况，并将[帮助]放置在，比如倒塌最严重的建筑处。”米基尼还表示，Airware
    将无人机派往意大利，帮助应对最近的地震。


    机器人甚至被放置在人体上，以增强人类必须使用的技能。这样做是为了让任何有身体残障的人恢复他们可能失去的能力。这些机器人的首次应用是在士兵身上，让他们在搬运超过
    100 磅的物品时不会感到疲劳。机器不会控制用户，而是会跟随他的动作。因此，如果他们走过崎岖的地形，它将结合机器人和人类的力量，让他们协同工作。


    ## 机器人如今如何被使用


    今天，可以在医疗领域看到机器人。它们如此精确，已经成为手术的绝佳工具。机器人做的切口比人类能做的要整洁得多，一旦伤口愈合，从远处看是看不出来的。医生们不再需要担心切错位置或切入患者身体太深。机器人可以被程序为在特定位置以特定深度进行切除。它们在推进医学发现和寻找新信息方面也很有帮助，这些以后可以帮助救命。


    工厂里也能找到机器人。它们被用于汽车和零件焊接在一起。由于它们的精确性和准确性，很容易让它们的工作看起来像是由专业人士焊接的一样。机器人很棒的一点是，它们也不会受到强光或焊炬热量的干扰。因此，它们可以做得比人类更多。唯一的缺点是，它们需要程序更新来保持运行并跟上最新技术。


    机器人还被用于家庭娱乐和休闲。人们可以购买各种家用机器人套件。其中一些套件将制造一个跟随线条或描迹线条的机器人。另一些套件将制造一个可以判断自己是在地板上还是桌子上，以及在撞到东西之前能走多远的机器人。这类机器人将具有光敏传感器和开关传感器。甚至还有用于清洁的机器人，例如吸尘地板。有些机器人甚至将用于娱乐。这些机器人可以为你提供娱乐。


    ## 机器人的优势


    尽管人们如何认为，机器人对我们的生活非常有帮助。以下是机器人在生活中提供帮助的方式：


    1. 机器人执行任务的速度比人类更快，而且它们一致且准确。

    2. 机器人可以帮助患有抑郁症的患者并保持活跃。

    3. 大多数机器人是自动的，因此它们不受人类的干扰。这意味着它们可以执行对人类来说危险的任务。

    4. 机器人可以被用于生产产品和组装汽车。机器人还用于计划、汽车和设备。

    5. 新产生的工作是为了创造和维修机器人。

    6. 由于它们是机器，机器人工作不需要睡觉。

    7. 机器人可以应对敌对环境。机器人的制造使得大气不会影响它们的性能或物理状态。它们可以在许多领域取代人类，甚至可以程序化自我管理。

    8. 机器人可以被程序引导到地球中心。它们可以挖掘燃料，并用于采矿。机器人还可以被用于探索人类无法到达的地方。人类的任何局限性机器人都可以克服。

    9. 机器人可以用于耗时和重复性的任务。机器人不会感到无聊，因此它们在工作方面不会损失质量。它们的时间速度参数可以进行调整，使其反应更快。机器人将不受会对人类产生负面影响的事的影响。

    10. 机器人可以不停止地运行。它们可以在长时间不需要维护的情况下工作很长时间，这意味着它们的产出率高于大多数人类。

    11. 机器人手不会像人手那样颤抖。机器人工作的零件比人类小且更灵活。这使得它们在手术中非常完美。

    12. 机器人的制造是为了能够在最恶劣环境下工作，如太空、水下或火灾。当人类的安全受到质疑时，可以使用机器人。机器人还可以被制造成任务所需的任何尺寸。

    13. 机器人的存在是为了完成人们不想完成的工作。许多机器人探测器被送到太空后从未返回。它们被制造得比人类更强大。机器人甚至被用于战争，以消除让人们面临风险的需求。


    ## 机器人的缺点


    当然，机器人也有它们的缺点：


    1. 机器人需要电力才能运行。人们可能会失去工厂工作，但即使被机器人取代，机器人也需要维护来保持运行。创造和购买机器人将花费巨资。此外，机器人需要的程序和硬件在以后将花费更多资金。


