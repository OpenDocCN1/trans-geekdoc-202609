- fmt: '

    # Planning

    Planning Set goals and how they can be achieved is figured out by intelligent
    planning. The goals must visualize the future. The actions made should match the
    goals. When it comes to classical planning problems, one agent is going to assume
    that it is the system that is acting inside the world by allowing the agents to
    be certain of the consequences for its actions. However, if the agent is only
    the actor, then it will require the agent to act without any certainty. This calls
    for the agent to assess their environments and makes predictions, but also, they
    must evaluate its predictions and adapt based on these assessments. Multi-agent
    planning will use cooperation and competition of multiple agents to reach a specific
    goal. Emergent behavior is going to be used by swarm intelligence and evolutionary
    algorithms.


    ## Approaches

    There are no established theories that guide the AI research going on. Researchers
    constantly disagree about many issues. Some long-standing questions that have
    not been answered is:

    - “Should artificial intelligence simulate natural intelligence by studying psychology
    or neurobiology?”

    - “Or is human biology as irrelevant to AI research as bird biology is to aeronautical
    engineering?”

    - “Can intelligent behavior be described using simple, elegant principles?”

    - “Or does it necessarily require solving a large number of completely unrelated
    problems?”


    ### Cybernetics and brain simulation

    During the 1940s and 1950s, there were a number of researchers that explored how
    neurobiology, cybernetics, and information theory tied together. Some of these
    researchers built machines that would use electronic networks to exhibit rudimentary
    intelligence, such as `W. Grey Walter’s turtles` or `Johns Hopkins Beast`. England’s
    `Ratio Club` and Princeton University’s `Teleological Society` held meetings where
    many researchers got together. It was not until 1960 that this approach was abandoned,
    even though, in the 1980s, some elements of it were brought back.


    ### Symbolic

    Whenever access to digital computers was made possible, AI began to explore how
    symbol manipulation could be reduced by human intelligence. `CMU`, `MIT`, and
    `Stanford` are the center of the research. Good old-fashioned AI, or `GOFAI` for
    short, is the name John Haugel gave to these symbolic approaches to AI. It was
    during the 60s that symbolic approaches started to achieve success when it came
    to simulating a high-level program in thinking in a small demonstrative program.
    Approaches are based on cybernetics as well as artificial neural networks that
    were either pushed into the background or abandoned completely. Research in the
    60s and 70s was convinced that symbolic approaches would eventually create a machine
    with artificial general intelligence and that was thought to be the goal of their
    field.


    ### Cognitive Simulation

    In an attempt to formalize them, Herbert Simon and Allen Newell, both economists,
    studied the human problem-solving skills. Their work laid the foundation for artificial
    intelligence along with operations research, management science, and cognitive
    science. Their research team was using results that they got from psychological
    experiments in order to develop skills that would help simulate the techniques
    that people needed to solve problems. This tradition started at `CMU` and eventually
    ended up circulating through `Soar` architecture during the 1980s.


    ### Scruffy or Anti-logic

    MIT researchers discovered that ad-hoc solutions are required in solving difficult
    problems through natural language processing and vision and these researchers
    argued that any general or simple principles could not capture every aspect of
    intelligent behavior. Roger Schank was the one to describe the teams’ anti-logic
    approaches using the word `scruffy` (not neat). Since commonsense knowledge bases
    have to be built by hand, it became an example of scruffy AI, and this was a complicated
    concept at one time.


    ## Applications

    Any intellectual task can be related to artificial intelligence. The `AI effect`
    is a phenomenon wherein you no longer consider a technique to be artificial intelligence
    if it has become mainstream. Self-driving cars and drones are just some of the
    modern AI high profile examples. You can also see them in targeting for online
    advertisements, judicial decisions, predicting of flight delays, spam filtering,
    image recognition, online assistants, search engines when games are played like
    `chess` or `Go`, the proving of mathematical theorems, the creation of art, and
    medical diagnosis.


    Social media is slowly taking over TV as a source to reach out to young people,
    which mean that the big news organizations have to become reliant on social media
    platforms to get people to read the news. Even major publishers are using artificial
    intelligence to generate a higher volume of traffic and effectively post more
    stories.


    ### Healthcare

    Findings have suggested that up to 16 billion dollars can be saved if AI is used
    in diagnosing patients. In 2016, a groundbreaking study in California, with the
    help of AI, saw the creation of a formula to determine correctly the right dosage
    of immunosuppressant drugs needed by an organ patient. Thanks to the doctor’s
    assistance, the healthcare industry has been slowly entered by artificial intelligence.
    An AI developed by `Microsoft` has already helped doctors in finding how to treat
    cancer properly. According to `Bloomberg Technology`, there has already been a
    huge number of drugs and research linked to cancer that has been developed. To
    be more detailed, over 800 vaccines and medicines have been made to treat cancer
    supposedly. However, this can have a negative effect on doctors since finding
    the right medication for the patient from too many options can be difficult.


    `Hanover` is an on-going project by `Microsoft`. Memorizing all the researchers
    and studies about cancer and helping predict the most effective combination of
    drugs is the main goal. Fighting myeloid leukemia is a project that is currently
    being worked on. This type of cancer is fatal, and there has been no improvement
    in its treatment over the decades. One study has also found that the ability of
    AI to locate skin cancer can be compared to a trained doctor. Another study has
    also been conducted where AI is used in finding and monitoring several patients
    that are at higher risk. The AI asks questions to each patient based on the information
    collected from live doctor-and-patient interactions. Surgeons also conducted a
    study at the National Medical Center for children located in Washington. The team
    of surgeons used an autonomous robot under their supervision to perform surgery
    on the bowel of a pig. They observed that the robot did much better than a skilled
    doctor.


    ### Automotive

    Advancements in AI have contributed to the growth of the industry. Some of the
    already developed self-driving cars don''t have breaks or steering wheels. Another
    factor that is influencing driverless automobile is how safe the passenger is.
    In order to make driverless automobile, engineers have to program it so that it
    can handle situations that bring higher risks. These may include head-on pedestrian
    collisions. They aim to keep both the pedestrian and passenger safe. There is
    a possibility that the car has to decide to place someone in danger. In other
    words, the car may have to decide to save its passengers or the pedestrian. The
    program is going to be a crucial part of creating a successful driverless car.


    ### Finance and Economics

    Financial institutions have used artificial networks for a long time to detect
    changes or claims that are not inside of the customer’s normal spending. These
    charges are then flagged for human investigation. Since 1987, banking has been
    using artificial intelligence every time a Fraud Prevention Taskforce is set up
    by `Security Pacific Bank` so that unauthorized use of credit cards can be countered.
    Financial services also use AI in programs like `Moneystream` and `Kasisto`. Banks
    now use AI to manage properties, invest in stocks, maintain the bookkeeping, and
    organize operations. Whenever a business is not taking place, or any changes have
    happened overnight, AI can react to it. A simulated financial trading competition
    took place in 2001 wherein a robot beat a human. It also monitors the user’s behavioral
    patterns; thus, helping reduce financial and fraud crimes.


    ### Video Games

    Video games also use artificial intelligence so that `NPC` can have dynamic, purposeful
    behavior. On top of that, pathfinding also uses AI techniques. Some studies think
    `NPCs` in video games can solve problems for production tasks.


    ### Military

    In 2015, militaries around the world had been spending money amounting to $7.5
    billion on robotics from $5.1 billion. Military drones have become a useful asset
    because of the autonomous actions that they present the military. Vladimir Putin
    said in 2017 that, “whoever becomes the leader in artificial intelligence will
    become the ruler of the world.” Many AI researchers are keeping themselves from
    AI’s military applications.

