  trans: '


    领先的人工智能人物也向他们的总理发送了信函，以参加 2017 年 11 月举行的特定常规武器公约会议。这些信还得到了史蒂芬·霍金的支持，他在葡萄牙的一次技术会议上发出了警告，称人工智能可能会毁灭世界。这些公开信的某些签名者包括来自渥太华大学的伊恩·凯尔（Ian
    Kerr）教授以及墨尔本大学的蒂姆·鲍尔德温（Tim Baldwin）教授。加拿大总理贾斯汀·特鲁多表示：“那些剥夺人类在决定目标合法性和部署致命武力方面具有实质性控制的致命性自主武器系统，正处于明确道德底线错误的一面。”


    寄给加拿大和英国的每封信都强调，机器学习和人工智能取得的惊人进展已使得机器能够在没有人类干预的情况下独立执行困难的操作。这些进步帮助了教育、交通、医疗保健和基础设施的许多改进。然而，积极的转变也将带来危险的后果，这些后果最终将要求高度的道德关注。正如机器人公司警告的那样，自主武器系统将代表至少
    1/3 战争革命。因此，为了防止这种情况发生，为了禁止这些系统，寄给英国和加拿大的每封信都在呼建立一项新的国际协议。每封信都总结道：“如果开发出来，它们将允许比任何时候都更大的规模和比人类理解快的时间的时间进行武装冲突。其致命的后果是，决定谁生死的将是机器而不是人。”


    加拿大外交部长将国际禁令、1996 年的《渥华条约》以及这项禁令进行了对比。完全禁止自主武器可能是可能的。但是，如果所有国家共同努力，禁令将是有效的。“涉及到禁令，我认为不可能实现国际禁。这将取决于国家，”阿比舒尔·普拉卡（Abishur
    Prakash）告诉《新闻周刊。“俄罗斯、中国和伊朗等国家可能将国际禁视为西方试图加强控制的尝试。如果这些国家不禁止它们，那么美国和加拿大等国会将禁止杀手机器人视为对它们自身国家安全的威胁。”


    # 第三章：关于机器人的十大神话


    机器人仍然被误解，这意味着会有关于它们的神话，因为人们会编造信息来帮助自己稍微理解机器人。在这一章中，我们将检查这些神话并消除它们，这样你就不必继续对机器人产生疑问，从而更近一步理解它们。


    ## 1. 机器人将夺走人类的工作


    每家主要的物流和制造公司都认为机器人将提高其运营效率以及在那里工作的人的生活质量。因此，当涉及机器人技术时，人类将继续是业务的关键部分。


    制造业和物流公司的员工应该将机器人视为使用精密工具增强其产出的工匠，因为他们在执行正在进行的工作时会产生更大的满足感。特斯拉汽车（Tesla Motors）就是一个例子，该公司使用机器人执行对那里工作的人构成威胁的任务。工人监督机器人的运行，并确保他们产出的工作质量达到标准并符合特斯拉汽车的预期。在特斯拉汽车，装配线上的机器人胶水、铆钉和焊接汽车零件，同时由人类进行监视。特斯拉的每位员工都可以为自己自豪，因为他们是制造业新时代的一部分，机器人正被用于革新。


    ## 2. 机器人很昂贵


    现代家庭应用将是人们每天购买时毫不思考的几件家用硬件。这些设备中的每一都得益于数十年的改进以及在领域开发的数百万台设备，这分摊了成本。同样的原理也适用于机器人。问题是，几乎每个机器人都是专门的，并且需要成本昂贵的硬件。


    执行器（actuators）将是机器人最昂贵的部件之一。这些执行器的价格不像处理器或传感器的价格那样下降。例如，Willow Garage 分出的工厂 Perception。在它被谷歌收购之前，这家初创公司在识别和从集装箱中取出箱子方面接近人类速度。尽管如此，这个机器人系统使用了廉价的传感器，如摄像头或微软制造的
    `Kinect` 设备。然而，机器人仍然需要一个昂贵的机器人手臂，该手臂必须由传统的执行器驱动。


    好消息是，在执行系统方面，我们很有可能看到很多创新。它将像降低电器成本一样降低机器人的成本。一个非常有前景的领域将涉及放置在关节上的传感器，这使得机器人能够以安全且经过计算的方式控制其运动。像卡内基基梅梅隆大学（`CMU`）分出的
    `IAM robotics`、`Redwood Robotics` 和 `Modbot` 这样的团体正在寻找独特的方法来减少机器人所需的电机、齿轮和传感器的数量并简化它们。通过这种方法，机器人的价格将大幅降低，这将降低占据整个机器人成本的大臂成本。


    ## 3. 高级操作据说是机器人的用途


    就像 `CNC`（数控机）机器一样，机器人是可编程的，通过调用新程序，机器人将从一个运行引用更改到另一个。得益于精心的设计，可以将灵活性整合到整个系列零件中。


    传感器技术已经先进，这允许它简化零件呈现。视觉系统可以识别和定位零件，并减少对手工工具的需求。力感有助于机器人调整，以便它们能够执行需要精度的组装任务。更现代的机器人可以有效地处理中等量的制造。制造机器人的编程和切换非常快，最终导致了高效的经济生产。


    ## 4. 由于机器人非常复杂，机器人编程很难


    机器人通过离线编程或教导器（teach pendants）进行编程。通过教导器，编写机器人的人将引导机器人通过一系列步骤进行精调，并存储每个需要存储的点。然后机器人将运行此程序，并在再次运行之前检查是否有碰撞。它将继续运行，直到编写机器人的人对所教授的动作完全满意，并且它在运行时没有任何问题。


    离线编程意味着用户可以使用模型来完成和修改稍后由机器人使用的移动。模型对程序的响应程度将决定在安装到机器人上后需要多少次修改。


    '
- fmt: '

    ### 5. Robot systems are complex, and the programs are difficult to support

    Robots are extremely reliable compared to other machines that are being used in
    commercial and factory settings. Robotics vendors have quoted an average time
    between failures at 62,000 numbers or more in about seven years. Robot cells are
    usually going to include other equipment on top of all the lower reliability sensors.
    However, overall, dedicated automated equipment will still be more complex than
    the cell.


    ### 6. Robots do whatever I tell them to do

    Robots that are built to respond to voice commands are out there. However, they
    are far and few in between because the practical applications for it are limited.
    Right now, it is more efficient and cost-effective to program a robot and control
    them through automation. Therefore, in the end, this myth is plausible, but it
    is not practical right now.


    ### 7. Robots are machines built to look like a human

    What a robot looks like is going to depend on the source of the robot. According
    to Merriam-Webster, the definition of a robot is “a machine that looks like a
    human being and performs various complex acts of a human being; also: a similar
    but fictional machine whose lack of capacity for human emotions is often emphasized.”


    There are other definitions for a robot, but in the end, the robot is going to
    be built to display a design that is going to be efficient for the work that it
    is doing.


    ### 8. Robots are strong but they are not agile

    In 2015, researchers at Stanford Universty’s Biomimetics and Dexterous Manipulation
    Lab built a gecko-bot that could pull up to 2,000 times its weight which is the
    equivalent of a human pulling a whale across the land.


    Of course, robots are going to be stronger than humans, but that does not mean
    that they are not as agile as humans. The Ecole Polytechnique Federale in Switzerland
    invented a robotic gripper that could carry 80 times its weight and was dexterous
    enough to pick up an egg or a single piece of paper. This gripper was the first
    to use electroadhesion and sensors that would allow the robot to adapt to the
    situations that it was placed in. Robots are starting to perform all kinds of
    fine motor skills that allow them to perform jobs that humans were doing, and
    they are doing so without pause.


    ### 9. Robots are smart, but they cannot determine intent

    Robots are built to be smart enough to replace jobs that humans do every day,
    and it is predicted that by 2040, smart robots are going to outnumber humans.


    AI bots can transcribe speech better than most professional transcribers, and
    they can also spot cancer on a tissue slide better than human epidemiologists.
    Artificial intelligence is even creating robots that can teach themselves to be
    smarter! So, in turn, as a robot gets smarter and learns more, it is going to
    be able to learn intent and make themselves smarter.


    ### 10. Robots can learn, but they cannot be self-evolved

    As you’ve seen, robots are strong and smart, but you may think that they cannot
    evolve. However, you’re wrong.


    A Norwegian robot learned how to self-evolve while 3-D printing the next generation
    of itself. Experts located at the University of Oslo said, “Where artificial intelligence
    programs – not humans – innovate new products.” In other words, because technology
    is constantly evolving, it means that there are going to be robots that are going
    to be able to self-evolve and get smarter than when they were first created. As
    you can see, there are plenty of myths that have been proven false about robots,
    and there are plenty of other myths out there that still need to be disproven.
    So, just because you do not understand robots does not mean that you need to make
    up things about them. It is easier to go online and look for what you are want
    to know than to believe a lie and make yourself look like a fool when you are
    talking about something you are not an expert on.

    '
