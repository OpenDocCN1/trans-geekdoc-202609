    # 第 13 章：机器学习与人工智能


    人工智能是一个新兴领域，随着时间的推移变得越来越流行。人工智能帮助为许多问题找到解决方案，例如我们想在哪里吃饭、如何解决全球食品短缺问题以及明天的天气将如何。起初，人工智能仅仅是科幻小说，一些人仍然认为它只不过是科幻小说。然而，人工智能将每天出现在我们身边，包括你正在使用的那部手机！例如，你正在使用一台
    `iPhone`，并点击中间按钮询问 `Siri` 问题。好，猜猜怎么着——`Siri` 就是人工智能。你收到的关于可能的欺诈收费的银行通知也是如此。英特尔的机器学习总监
    `Nidhi Chappell` 据报道曾说：“人工智能基本上是让机器能够理解、学习并与外部世界进行互动，而无需人类对其进行特定的编程。”


    人工智能不仅让我们的生活变得更加便利，而且提升了生活质量。生物识别可以衡量运动员的表现、受伤的严重程度以及这最终将如何影响他们的上场时间。另一方面，农民们正在使用它来了解需要给作物浇多少水以获得最高的产量。医生甚至在使用它来检测疾病并追踪患者的治疗过程。


    你应该将人工智能术语视为一个伞形术语，机器学习将属于其中，因为将使用各种技术和工具，允许计算机通过基于你获得的数据的数学算法进行思考。然而，在这个伞下，你还会发现机器学习的子集，它使用被称为深度学习的神经网络模型，这些模型将使用图像以便被正在使用的程序进行处理和识别。


    “想象一下一个正在长大的孩子。那个孩子观察世界，留意人们如何互动，学习社会规范——而没有被明确地告知规则，”`Chappell` 说。“这与人工智能是一样的。它是机器在没有显式编程的情况下自主学习。”人们还认为人工智能至少能够做到三件事：

    1. 根据其在程序中发现的识别采取行动。

    2. 通过任何可以检测到的数据模式观察世界。

    3. 识别我们周围世界中的模式。


    可以这样想：你准备在 `Facebook` 上发布一张照片。因为人脸识别算法，`Facebook` 将建议你在照片中标记朋友，这样他们也能看到这张照片。不仅如此，它还会根据你发布的照片建议页面和活动。所以，如果你发布了一张你和最好的朋友在湖边游泳的照片，你将开始看到与游泳有关的内容，因为
    `Facebook 的算法` 将根据照片假设你喜欢游泳。机器总是会尝试变得更聪明，这将导致人们更快地做出决定并更快地完成研究。


    ## 安抚怀疑者


    人们总是对他们不理解的事情持怀疑态度。这主要是因为他们担心机器会像电影《终结者》中描述的那样接管一切。然而，`Chappell` 据报道说，计算机及其学习方式最终将以比人们意识到的多多的方式帮助人类。“人工智能实际上增强了人类的行为。我们并不是在取代人类，而是在用更多的智能来增强他们。这让我们的生活变得更容易。”


    人工智能让我们不再需要查地图来确定自己在哪里以及要去哪里。你只需要输入地址，就会告诉你要去哪里。不仅如此，每次路线变化时手机都会更新，这样你就不会去不存在的地方或使用耗时的路线。机器学习和人工智能将应用于医学、金融和教育领域。它将继续推动社会进步，减少网络骚扰。人工智能还将帮助解决如
    `Zika` 病毒的问题，通过观察蚊子种群确定哪些它们最可能携带疾病。


    ## 数据管理


    一些复杂的学习将产生需要机器学习的数据。这意味着计算机性能越高，学习得越快。`Chappell` 在谈到机器学习的复杂性时说：“给机器的数据越多，机器预测的情况就越准确。”学习越复杂，数据需求就越高。因此，计算机学习得越多，到位的数据需求就越多。总而言之，”英特尔数据中心集团总经理兼执行总裁
    `Diane Bryant` 说，“人工智能无处不在。它正在改变人们与世界互动的方式。”


    ## 结语


    感谢你读到《机器人》的最后。这本书应该是启发性的，并为你提供了实现目标所需的所有工具，无论你的目标是什么。下一步是利用你在这里获得的知识，继续学习更多关于人的知识，或者决定你是否希望在生活中使用机器人。并不是所有的机器人都是邪恶的，但这取决于你如何研究并判断这是否是你愿意承担风险。机器人已经在生活中无处不在，随着技术的不断发展，你可能会在生活中看到更多机器人。然而，与此同时，随着我们看到的科技进步，书中列出的风险可能不会发生。没有人知道未来会发生什么，你可能是那个帮助机器人向前发展并变得比现在更好的的人之一！最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在亚马逊上的评价！


    '
