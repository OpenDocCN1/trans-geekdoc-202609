    1. 如果有人构成威胁，则应连续占据两个方格，然后占据剩余的正格；否则，

    2. 如果某步移动可以“叉叉”同时创建两个线程，则应该执行该步移动；否则，

    3. 如果中心方格是空的，则应该占据它；否则，

    4. 如果你的对手决定占据角落，你应该占据另一个角落；否则，

    5. 如果有任何空闲角落，占据其中一个；否则，

    6. 占据任何空方格。


    许多 AI 算法都可以从它们收集的数据中学习，这可以帮助它们通过学习新的启发式方法来增强自身，或者帮助它们编写其他算法。下文将描述你熟悉的一些学习器，包括最近邻、决策树和贝叶斯网络，它们可能很有帮助——只要能给它们无限的内存、时间和数据，它们就可以近似任何函数，包括任何最能描述整个世界的数学函数组合。这些学习器可以通过考虑每个可能的假设并将其与数据进行匹配，从而演变为无所不知。在实践中，由于组合爆炸现象，考虑每种可能性是不可能的，组合爆炸意味着问题越大，解决问题所需的时间就会指数级增长。事实上，许多
    AI 研究包括发现如何识别并避免那些最可能没有用的广泛可能性。例如，假设你正在看地图，并试图找到从家乡到最近大都市的最短行驶路线。在大多数情况下，你可以跳过所有小城镇或任何偏离路线的地方；得益于路径规划算法，这是
    AI 也会做的事情。这样一来，每条路线都得到了规划，你就不必担心在到达目的地上浪费时间。


    ## 问题

    人工智能的总体目标之一是创建一种技术，让其他机器和计算机能够以智能的方式工作。实现这一点的总体问题是模拟智能，这必须被分解为子问题。这些子问题将由研究人员期望智能系统展示的一系列特定特征组成。这些特征描述在下。


    ## 问题解决与推理

    早期研究人员创建了算法，展示了人类在进行逻辑推断或解决谜题时所使用的逐步推理方法。在 20 世纪 80 年代后期甚至 90 年代初，AI 研究人员又创建了一种处理不确定和不完整信息的新方法。这种方法采用了一种基于经济学和概率的思想。随后发现，这些算法在解决大型推理问题时是不够的，因为它们会遇到组合爆炸，这意味着问题越大，运行速度就呈指数级变慢。事实上，人类极少使用逐步归约法——而早期的
    AI 研究人员将其作为模型。人类通常使用直觉判断来解决他们的问题。


    ## 知识表示

    知识工程和知识表示将成为经典 AI 研究的基础。已经有一些专家系统尝试拼凑专家在某些特定领域所拥有的显性知识。此外，一些项目试图收集普通人拥有的常识，并将其整合进一个包含广泛世界知识的数据库中。其中就全面的常识知识库，它将包含事件、时间、情况、对象和状态之间发生的属性、类别、对象和关系。它还包含了因果关系、知识以及许多尚未充分研究的领域。


    “存在什么”的表示是本体论，它将属性、概念、关系和对象整合在一起，以便程序代理可以解释它们。它们的语义将通过个体、描述逻辑概念、角色来捕获，并通常在 Web
    本体语言（OWL）中实现为属性、个体和类。上层本体是最通用的本体，它充当领域本体之间的中介，试图为所有其他知识提供基础。一些形式化的知识表示可以用于临床决策支持、基于内容的索引与检索、场景解释，以及知识发现等许多其他领域。


    知识表示最困难的问题包括：


    1. **限定性问题与默认推理**：许多人对工作假设是有意识的。例如，当你和某说话时脑中出现了一只鸟，你通常可以在脑海中看到那只鸟，并描述得足够清楚，让别人知道你在想什么。然而，你认为关于鸟的知识可能并不适用于所有的鸟。1969
    年，约翰·麦卡锡（John McCarthy）将此问题识别为限定性问题：因为对于 AI 研究人员可以表示的任何常识规则，存在大量的例外。几乎没有什么像抽象逻辑那样被简单地标记为真假。AI
    研究必须探索该问题的每一个解决方案。

    2. **常识知识的范围**：人类所知的原子事实数量是巨大的。有一些研究项目试图构建基于常识的完整知识，但这需要大量辛苦的本体工程，必须一个一个概念地手工构建。

    3. **某些常识的非符号形式**：大多数人所知的无法表示为可以口头表达的事实或陈述。例如，一个下棋高手。他们会避免某些位置，因为觉得太容易受到攻击；或者艺术评论家看一眼画作就知道它们是伪作。这些是非符号的机制，它们不是意识思维。这种类型的知识为意识知识提供了背景、支持和信息。正如这个非符号推理问题一样，人们希望情境
    AI、统计 AI 或计算智能能够提供一种表示这类知识的方法。


