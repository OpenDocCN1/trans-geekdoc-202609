    # 第 6 章：人工智能


    人工智能，又称为 AI，通常被称为机器智能，它是指在机器中展现的智能，与通常在人类及各种其他哺乳动物中看到的自然智能相对。在计算机科学领域，人工智能研究被归类为对设备所示智能的研究，这些设备能够感知周围环境并采取行动，以最大限度地增加其实现目标的概率。


    从非正式的角度来说，“人工智能”一词通常与能够模仿人类认知功能、解决问题或学习能力的机器相关联。定义往往忽略了 AI 如何利用智能来完成任务的能力。这种现象被认为是“AI
    效应”，它导致了特斯勒定理（Tesler’s Theorem）中的俏话：“AI 就是任何尚未实现的事情。”例如，通过视觉实现的特殊识别已成为一种常规技术。现代机器已经能够完成一些被归类为
    AI 的事情，因为它们可以成功理解人类语言，同时在国际象棋等高级策略游戏中竞争。它们还能自主驾驶汽车，并足够智能处理军事模拟和内容分发网络中的路由问题。


    ## 人工智能的分类


    Kaplan 和 Haenlein 将人工智能分为三类，这些分类是借自管理学文献——人性化人工智能、人类启发型和分析型。


    *   **分析型人工智能**：在理解和识别决策中所涉及的认知元素和人类情感时，其特征仅具有与认知及情感智能一致的特性。

    *   **人性化 AI**：表现出每种能力（情感智能、认知智能、情感智能和社交智能）的特征，并且具有足够的自我意识和自我认知来与他人进行交互。

    *   **人类启发人工智能**：除了感知、社交和认知能力外，必须都具有类人的外表。它们必须能够使用自然语言进行清晰交流。而名为“嗅觉”的最新进展使根源更贴近人类，因为它们现在可以识别气味了。


    ## 历史与演变


    1956 年左右，人工智能作为一个学术学科首次奠定。在随后的几年里，人们经历了多次乐观主义浪潮，随之而来的是许多失败甚至是资金问题。这被称为“AI 寒冬”，但它很快被新的
    AI 方法、胜利以及对机器人研究的更多资金所取代。在历史的大部分时间内，人工智能实验可以分为若干子领域，这些子领域通常无法保持联系。


    这些子领域通常根据其技术考虑因素，甚至是特定的目标，通过使用特定的工具或分析差异进行分类。这些子类别也可以根据机构或研究人员感兴趣的社会因素来创建。


    人工智能传统的目标或问题包括操作和移动物体的能力、自然语言处理、感知、学习、表示、规划、知识和推理。该领域的长期目标之一是通用智能。方法包括传统的符号 AI、统计方法和计算智能。AI
    使用多种工具，包括数学和搜索优化、人工神经网络，以及由于统计学（如经济学和概率）产生的方法。AI 领域经常借鉴语言学、哲学、心理学、信息工程、数学、计算机科学等。


    人工智能建立在一个假设之上：人类的智能“可以被描述得如此精确，以至于使机器能够模拟它”。正是这种哲学论点，引发了关于大脑的其他讨论，以及在设计提供人类相同智能所需系统的机器人和其他机器人时涉及的任何伦理问题，这些问题产生了自古以来一直通过神话、哲学和虚构小说被彻底探讨的问题。一些人认为，如果进步不受停止，AI
    将是人类的危险。然而，也有人认为，AI 与其他技术革命不同，在审查失业问题时将引发巨大的问题。


    在 21 世纪，随着计算机能力、理论理解和大量数据方面的技术进步，AI 技术和方法论经历了复兴。人工智能方法已成为这一快速发展行业的重要组成部分，并帮助解决了计算机科学、运筹学和程序工程中需要其关注的多个问题。


    ## 早期里程碑与理论框架


    处理思想的机器人自古以来就详细记录于故事中，并出现在虚构作品中，如卡雷尔·恰佩克的《R.U.R》或玛丽·雪莱编写的《弗兰肯斯坦》。这些人物及其命运带来了一些与现在讨论人工智能原则时产生的问题相同的问题。


    对机器人推理的研究最初始于理论家和数学统计学家。对数学逻辑的检查导致了艾伦·图灵（Alan Turing）的计算理论，该理论认为机器通过`1` 和 `0`
    等符号的切换，可以模拟任何合理的数学推演行为。正是这种洞察形成了丘奇-图灵论题（Church-Turing thesis），即任何形式的形式推理都可以由数字计算机模拟。结合信息学、控制论和神经生物学的最新发现，研究人员开始考虑电子大脑的发展是一种可能。图灵提出：“如果人类无法区分来自机器和人类的响应，那么机器就可以被视为智能生物。”


    图灵完备人工神经元的正式设计被认为是人工智能领域的的第一项工作。它由麦卡洛（McCulloch）和皮茨（Pitts）于 1943 年创建。


    人工智能研究领域始于 1956 年在达特茅学院举行的一次会议。参加者包括来自 CMU 的艾伦·纽威尔（Allen Newell）、来自 MIT 的约翰·马卡锡（John
    McCarthy）、来自 CMU 的赫尔伯特·西蒙（Herbert Simon）、来自 IBM 的亚瑟·萨缪尔（Arthur Samuel）和来自 MIT
    的马文·明斯基（Marvin Minsky），他们都被认为是人工智能的领袖和创始人。


    ## 进展与挑战


    现代机器已经能够完成一些被归类为 AI 的事情，因为它们可以成功理解人类语言，同时在国际象棋等高级策略游戏中竞争。它们还能自主驾驶汽车，并足够智能处理军事模拟和内容分发网络中的路由问题。


    人工智能的长期目标之一是通用智能。方法包括传统的符号 AI、统计方法和计算智能。AI 使用多种工具，包括数学和搜索优化、人工神经网络，以及由于统计学（如经济学和概率）产生的方法。


    在 21 世纪，随着计算机能力、理论理解和大量数据方面的技术进步，AI 技术和方法论经历了复兴。人工智能方法已成为这一快速发展行业的重要组成部分，并帮助解决了计算机科学、运筹学和程序工程中需要其关注的多个问题。


    1997 年，`Deep Blue` 击败了世界冠军卡斯帕夫。2011 年，`Watson` 赢得了问答节目 `Jeopardy`。2012 年左右，`deep
    learning` 开始占据主导。2016 年，`AlphaGo` 击败了职业围棋手。次年，`AlphaGo` 再次击败头号冠军。彭博的杰克·克拉克（Jack
    Clark）甚至说由于关注或使用 AI 的程序和项目数量增加，人工智能在 2015 年表现非常出色。此外，自 2011 年以来，图像处理任务的错误率下降。根据克拉克的说法，神经网络的可能是这种剧变的原因。2017
    年的一项调查显示，每五家公司中就有一家将 AI 纳入其流程中。中国政府在 2016 年增加了资金。这导致了研究产出的快速增加和信息的巨大供应，使观察者认为中国已成为人工智能领域的强国。


