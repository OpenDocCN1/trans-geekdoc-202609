    # Machine Learning and Robotics

    Now that you know what machine learning is, it shouldn’t surprise you that this
    term has heated up interest in robotics and has not altered much over the past
    years. But how does machine learning relate to robots? Robotics has only a few
    developments currently that led to other developments, including machine learning.
    Here are five current machine learning applications that can be seen in robotics:


    ### 1. Computer vision

    there are some that would say that robot vision or machine vision is the correct
    term because ‘robot seeing’ is going to involve more than computer algorithms.
    Roboticists and engineers have studied what type of camera hardware will allow
    a robot to process the physical data around them. Robot vision and machine vision
    is closely linked. They can be credited to the creation of automatic inspection
    systems and robot guidance. The two only has a small difference in kinematics
    that is applied to robot vision, which will encompass the comment frame calibration
    and the robot’s ability to affect its environment physically.


    An influx in big data has helped to push forward the advances of computer vision,
    which has further helped machine learning based on structured prediction learning
    techniques at many universities.


    ### 2. Imitation learning

    imitation learning is closely related to observational learning which is a behavior
    that can be seen in infants and toddlers. Imitation learning is considered an
    umbrella category for reinforcement learning or the challenge of getting an agent
    to act in the world to maximize its rewards. This approach has common features,
    namely probabilistic models and Bayesian. The question, in the end, is whether
    imitation learning is going to be able to be used for humanoid robots.


    An important part of robotics, imitation learning has characteristics of mobility
    outside of factory settings in domains such as search and rescue and construction,
    making it challenging to program robotic solutions manually.


    ### 3. Self-Supervised learning

    generating their own training examples will be allowed to robots because of self-supervised
    learning approaches so that they can improve their performances. This is going
    to include priority training as well as data captured close range that is going
    to be used to translate ambiguous sensor data that is long range. Robots with
    optical devices have this installed on them so they can reject and detect objects.


    Cornell and Stanford created a solid example called `Watch-Bot` that uses a laptop
    and laser pointer, 3D sensor, and a camera to find normal human activities, which
    are patterns that are going to be learned through methods of probability. To target
    a reminder, a laser pointer is used by `Watch-Bot` in objects. In a test, humans
    are reminded by the bot almost 60% of the time, but the robot has no concept of
    what it is doing or why it is doing it.


    ### 4. Medical and assistive technologies

    an assistive robot is a device that can sense and process sensory information
    before performing an action that is going to end up benefiting a person with disabilities
    and seniors. These movement therapy robots will provide a therapeutic and diagnostic
    benefit. Since they are still cost-prohibitive for hospitals abroad and in the
    United States, they are still not being out in the lab.


    Some of the early examples of assistive technologies are a desktop vocational
    assistant robot or the `DeVAR`. It was Stanford and Palo Alto Veterans Affairs
    Rehabilitation Research and Development who developed `DeVAR` in the early 1990s.
    There are still studies done on machine learning-based robotic assistive technologies.
    The `MICO` robotic arm is one example. It is an assistive machine with an autonomy
    that uses a `Kinect` sensor to observe the world. These implications are going
    to be more complex, but they are going to provide the world with smarter assistive
    robots that can adapt better to the needs of the user. The advancement in machine
    learning can also be seen in the medical world. Though medical facilities don’t
    use it yet, robotics has been advancing at a rapid pace.


    ### 5. Multi-Agent learning

    multi-agent learning has some key components, namely negotiation and coordination,
    which will involve robots based on machine learning that are created with the
    goal of finding equilibrium strategies and adapting to a robot’s shifting landscape.
    For example, no-regret learning tools, which involve weighted algorithm, are included
    in multi-agent learning approaches that are going to help boost the learning outcomes
    that are tied into the multi-agent learning and planning that is found in distributed
    control systems that are market-based.


    In late 2014, a more solid example of an algorithm that is being used for distributed
    robots or agents was made in the lab of MIT for decision and information systems.
    Robots were able to collaborate to build a more inclusive and better learning
    model that was done by a single robot with the basis of building exploration and
    the way that the rooms are laid out while autonomously building a knowledge base.
    Catalogs are made by every robot which they then combine to the datasets of other
    robots, where the standard algorithm is outperformed by the distributed algorithm
    when making this sort of knowledge base. This sort of machine learning approach,
    while this is not a perfect system, is going to allow robots to compare catalogs
    and reinforce mutual observations while correcting any omissions or overgeneralizations,
    which will play a role in multiple robotic applications in the near future.


    # What the Future Holds

    As you saw above, machine learning-based approaches in robotics are starting to
    be combined with challenges and contracts that are put out by military innovators
    or sponsors that are working for major robotics manufacturers or even startups,
    while an increase in investments is being seen by auto manufacturers on the next
    generation of autonomous vehicles. Because of what machine learning can do, it
    is being used to help further advance robotics and make robots more complex when
    it comes to dealing with data and how they interpret this data.

    '
