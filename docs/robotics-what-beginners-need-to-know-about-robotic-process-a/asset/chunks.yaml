    # 规划

    智能规划负责设定目标以及实现这些目标的方法。目标必须使未来可视化。所采取的应当与目标匹配。在经典规划问题中，一个智能体会假设自己是世界上运行的系统，从而允许智能体对其行动的后果充满确定。然而，如果智能体仅仅是执行者，那么它要求智能体在没有任何确定性的情况下行动。这要求智能体评估其环境并做出预测，同时，它们必须评估自己的预测并根据这些评估进行调整。多智能体规划将利用多个智能体的合作与竞争来达到特定目标。群体智能和进化算法将使用涌现行为。


    ## 方法

    目前还没有指导正在进行的 AI 研究的成熟理论。研究人员对许多问题经常存在分歧。一些尚未得到解决的长久问题包括：

    - “人工智能是否应该通过学习心理学或神经生物学来模拟自然智能？”

    - “或者人类生物学对 AI 研究来说就像鸟类生物学对航空工程一样毫无无关？”

    - “智能行为是否可以使用简单、优雅的原理来描述？”

    - “或者它是否必然要求解决大量完全无关的问题？”


    ### 控制论与大脑模拟

    在 20 世纪 40 年代和 50 年代，许多研究人员探索了神经生物学、控制论和信息论是如何联系在一起的。其中一些研究人员制造了使用电子网络展示原始智能的机器，例如
    `W. Grey Walter’s turtles` 或 `Johns Hopkins Beast`。英国的 `Ratio Club` 和普林斯顿大学的 `Teleological
    Society` 会过会议，许多研究人员在此聚会。直到 1960 年，这种方法才被遗弃，尽管在 20 世纪 80 年代，它的某些元素被重新带回。


    ### 符号

    只要能够访问数字计算机，AI 就开始探索如何通过人类智能减少符号操作。`CMU`、`MIT` 和 `Stanford` 是研究的中心。老派 AI，或简称 `GOFAI`，是
    John Haugel 对这些符号化 AI 方法的命名。正是在 60 年代，符号化方法在通过小型演示程序中模拟高级程序思维方面开始取得成功。这些方法基于控制论以及人工神经网络，后者要么被推向背景，要么被完全遗弃。20
    世纪 60 年代和 70 年代的研究坚信，符号化方法最终将创造出具有通用人工智能的机器，这被认为是他们领域的目标。


    ### 认知模拟

    为了尝试将它们形式化，两位都是经济学家 Herbert Simon 和 Allen Newell 研究了人类解决问题的技能。他们的工作与运筹学、管理科学和认知科学一起为人工智能奠定了基础。他们的研究团队利用从心理实验中获得的结果来开发帮助模拟人们解决问题所需技术的技能。这种传统始于
    `CMU`，并最终在 20 世纪 80 年代通过 `Soar` 架构流传。


    ### 粗糙或反逻辑

    MIT 的研究人员发现，在通过自然语言处理和视觉解决困难问题时，需要特时的解决方案，这些研究人员认为，任何通用或简单的原理都无法捕捉到智能行为的每一个方面。Roger
    Schank 是第一个用 `scruffy`（不整洁）一词描述该团队反逻辑方法的人。由于常识知识库必须手动构建，它成了“粗糙 AI”的例子，这在曾是一个复杂的概念。


    ## 应用

    任何智力任务都可以与人工智能有关。`AI effect` 是一种现象，即当某项技术成为主流时，你就不再认为其为人工智能。自动驾驶汽车和无人机只是现代 AI
    高关注度例子中的几个。你也可以在在线广告投放、司法决策、航班延误预测、垃圾邮件过滤、图像识别、在线助手、玩 `chess` 或 `Go` 等游戏时的搜索引擎、数学定理的证明、艺术创作以及医学诊断中看到它们。


    社交媒体正在缓慢接管电视机，成为接触年轻人的来源，这意味着大型新闻机构必须依赖社交媒体平台让人们阅读新闻。即使是主要的出版商也在使用人工智能来产生更高的流量，并有效地发布更多故事。


    ### 医疗保健

    发现表明，如果使用 AI 诊断患者，可以节省高达 160 亿美元。2016 年，加利福尼亚的一项在 AI 帮助下进行的突破性研究创建了一个公式，用于正确判断器官患者所需的免疫抑制剂药物的正确剂量。得益于医生的协助，医疗保健行业已逐步进入人工智能。`Microsoft`
    开发的一项 AI 已经帮助医生找到了如何正确治疗癌症。根据 `Bloomberg Technology`，已经开发了大量与癌症相关的药物和研究。详细来说，据制造了
    800 多种用于治疗癌症的疫苗和药物。然而，这会对医生产生负面影响，因为从太多选择中为患者找到正确的药物可能是困难的。


    `Hanover` 是 `Microsoft` 的一个进行中的项目。主要目标是记住所有关于癌症的研究人员和研究，并帮助预测最有效的药物组合。对抗骨髓性血病是一个目前正在进行的项目。这种癌症是致命的，几十年来其治疗一直没有改善。另一项研究还发现，AI
    定位皮肤癌的能力可以与受过训练的医生相比。还进行了另一项研究，将 AI 用于发现和监控几个风险较高的患者。AI 根据从现场医生那里收集的信息向每位患者提问。


    ### 汽车

    AI 的进步对该行业做出了贡献。一些已经开发的自动驾驶汽车没有刹车或方向盘。影响自动驾驶汽车的另一个因素是乘客的安全。为了制造自动驾驶汽车，工程师必须对其进行编程以处理更高风险的情况。这些可能包括碰撞碰撞。他们的目标是确保行人和乘客的安全。AI
    有可能决定让某人处于危险。换句话说，汽车可能必须决定拯救乘客还是行人。


    ### 金融与经济

    金融机构长期以来一直使用人工网络来检测不属于客户正常消费的异常。这些费用随后会被标记进行人工调查。自 1987 年以来，每当 `Security Pacific
    Bank` 建立欺诈预防小组时，银行就会使用人工智能应对信用卡未经授权的使用。金融服务在使用 `Moneystream` 和 `Kasisto` 等程序。银行现在使用
    AI 管理财产、投资股票、维护会计和组织运营。当业务没有进行或晚上发生任何变化时，AI 可以做出反应。2001 年举行了一场模拟金融交易竞赛，机器人赢了人类。它还监控用户的行为模式；从而减少金融欺诈犯罪。


    ### 游戏

    游戏也使用人工智能使 `NPC` 具有动态、有目的的行为。此外，路径寻找也使用 AI 技术。一些研究认为游戏中的 `NPC` 可以解决生产任务中的问题。


    ### 军事

    2015 年，世界各国军队在机器人方面的支出达到了 75 亿美元，此前为 51 亿美元。由于军事无人机呈现出的自主行动，它们已成为一种有用的资产。弗拉基米·普京在
    2017 年说，“谁在人工智能领域取得领先，谁就统治世界。”许多 AI 研究人员正让自己远离 AI 的军事应用。


