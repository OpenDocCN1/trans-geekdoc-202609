    \ the lives of those that we are working for. Below, you are going to see some\
    \ real-world applications of robots and how they are helping make our world a\
    \ better place: \n\n1.  Bionic legs : bio-mechatronics is a revolutionary work\
    \ being done by Hugh Herr who is the head of the biomechatronics research group\
    \ at MIT. Herr is a double amputee who used human physiology with electro-mechanics\
    \ to create a bionic limb for someone who has physical disabilities. His bionic\
    \ achievements have included gait-adaptive knee prostheses for transfemoral amputees\
    \ and a variety of impedance ankle-foot exoskeletons for gait pathology, which\
    \ is also known as drop foot that can be caused by cerebral palsy, strokes, or\
    \ multiple sclerosis. He has even done his own bionic legs which is the first\
    \ foot and calf system. \n\n2.  Hospital robots : Atheon's focus is on the healthcare\
    \ industry. By using autonomous mobile robots, they have helped with the transportation\
    \ of heavy materials like laundry, clinical supplies, and cleaning products. On\
    \ top of that, the TUG machines can safely remove hazardous waste. Being that\
    \ regulations require that medical centers have to track all drugs, particularly\
    \ narcotics, Aethon robots can deliver medicine as a part of an IOT (Internet\
    \ of Things) scenario. Plus, it has RFID chips and barcodes on all the medicines\
    \ that are going to enable it to track the medicines in real time. \n\n3.  Robot\
    \ valets : Smart garage vendors like Boomerang can provide a unique approach to\
    \ robotic garages. Robots are programmed to get your car and park it for you so\
    \ that they can maximize the space that is inside the garage. Boomerang functions\
    \ similar to an elevator with a service called Robotic Valet. These garages are\
    \ primarily in locations where real estate is expensive, such as San Francisco,\
    \ Miami, and Chicago. \n\n4.  Parking lot robots : Serva-TS works like a warehouse\
    \ forklift that is going to shuffle vehicles through a parking lot like a deck\
    \ of cards is shuffled. This system works in the Dusseldorf airport and can retrofit\
    \ older garages by gaining 40 percent of usable space in the process. \n\n5. \
    \ Factory robots : Boston's Rethink Robotics introduced robots that can work alongside\
    \ humans to do warehouse activities like pick and pack. \n\n6.  Collaborative\
    \ robots : Denmark’s Universal Robots have brought out a whole line of collaborative\
    \ robots to the world market. These robots are programmable and are invented to\
    \ handle repetitive tasks which help to free up people to do more advanced activities.\
    \ \n\n7.  Robotic factory painter : ABB Robotics has come up with a line of robotic\
    \ painters. There is a hollow wrist in IRB 580 that is compact and is a fast and\
    \ accurate painting robot. This robot helps increase productivity and presents\
    \ more efficiency to painting companies. \n\n8.  Collaboration : the KUKA systems\
    \ have launched collaborative robotics that is meant to meet the needs of the\
    \ growing market. This robot features sensory capabilities for safety, simple\
    \ operator control, and faster teaching. There are a few applications to these\
    \ robots that include inspection, testing, measuring, palletizing, machining,\
    \ and fastening. \n\n9.  Humanoid robots : The Intelligent Robotics Laboratory’s\
    \ director, Professor Hiroshi Ishiguro, (the laboratory is part of the Department\
    \ of Systems Innovation in the Graduate School of Engineering Science at the Osaka\
    \ University in Japan) has created an android that goes by the name of Geminoid.\
    \ Geminoid looks exactly like Professor Ishiguro. \n\n10.  Humanoids helping humans\
    \ : Even though these robots look humanoid and are considered to be cute, they\
    \ are not all invented to do household chores or entertain. Honda and Toyota created\
    \ a walking assisted device for those that are physically impaired or elderly.\
    \ Cyberdyne’s HAL (Hybrid Assistive Limb) system is the only robotic device that\
    \ can help to teach the brain how to move the limb that it is replacing. On top\
    \ of that, the medical applications have full body HAL systems that are going\
    \ through research and development to enhance or protect the human body for situations\
    \ like disaster recovery, harsh environments, or circumstances where humans need\
    \ to have superior strength and endurance. \n\nChapter 2: Five Reasons Why Experts\
    \ Warn Us about Robots Some experts condone the use of robots and others do not.\
    \ Then, some experts are somewhere in the middle: \n\n1.  Elon Musk : Elon Musk\
    \ is a billionaire and a techpreneur who has been issuing warnings to the public\
    \ when it comes to the dangers of artificial intelligence being used for military\
    \ robots. There is rapid adoption of robot technology that is occurring in our\
    \ society and the consequences that it will have on our society in the event that\
    \ these robots are not secure. But what is the big deal if our robotics technology\
    \ is not secure? "
