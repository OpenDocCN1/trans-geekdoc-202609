    # Chapter 10: Drones


    UAV or uncrewed aerial vehicles are commonly called drones, which are aircraft
    that do not require human piloting. UAVs are part of the uncrewed aircraft systems
    which can include UAVs that are controlled from the ground or a system of communications
    that happens between the two. The way that the UAV flies may operate based off
    of various degrees of autonomy, which is either going to be controlled from a
    distant control or autonomously through an onboard computer.


    Drones were originally used for missions that were too dangerous or dirty for
    humans, and they were mostly used in military applications, but their use quickly
    spread to commercial, recreational, scientific, agricultural, and other applications,
    such as surveillance, product delivery, policing, peacekeeping, photography, smuggling,
    and racing.


    ## Drones and Robotics Onboard Computers


    The next generation of drones and robots will be smarter, faster, and lighter
    than those that came before them. This is only possible thanks to the streamlined
    solutions that are going to combine several computing functions into a single
    board. Qualcomm drones and robotic technology is going to make it possible to
    reduce the onboard computer footprint while still presenting a strong connection,
    long battery life, and advanced processing power. With a smaller footprint, there
    is going to be less complexity to the design, which means that drones will be
    more affordable for a wider audience.


    ### Single Board Technology

    With sleeker engineering, the drones are going to be lighter and easier to use
    thanks to `Snapdragon Flight`. This technology will integrate 4K high-resolution
    camera support along with a highly accurate location positioning and even real-time
    flight controls which will all be mounted on a single board; thus, enabling the
    OEMs to be smaller and more robust.


    ### Heterogeneous Platform

    Building smart drones and robotic components with a heterogeneous platform will
    help OEMs create safer and lighter drones and robots that will ultimately reduce
    the cost of the robot, which is going to open it up to more consumers.


    ### Autonomous Flight

    OEM can be made to be self-aware and autonomous thanks to the advancements that
    have been made in technology. Because of the advanced technology platform, it
    will combine sensors that are built in with 3D environment mapping, which will
    allow the drone to fly on its own.


    ### Low Power

    By combining several components on a single board, the board is going to provide
    low power and lightweight solution that will help to present advanced flight connectivity
    and controls.


    ### Reliable Programs

    The `Snapdragon Navigator` programs will provide intelligent navigation by allowing
    drones to see and react to objects that may be in their path as they are flying,
    which is going to provide safer and more reliable navigation.


    ### Intelligent Motor Controller

    `Snapdragon flight` will include intelligent motor control as well as a 500Hz
    latitude processing that will make the flight experience more stable while increasing
    battery life and reducing the strain that is placed on the engine.


    ### Position Control

    Because of the advanced position control, the flights are smoother than they have
    been and this will work by combining the `GPS`, sonar sensors, inertial measurement
    unit, as well as a barometer sensor which is going to help in in supporting enhanced
    air stability.


    ### Bi-Directional Detection

    To avoid collisions and flight path obstacles, bi-directional detection will be
    used along with the assistance of an electronic speed controller that will recognize
    any propeller obstructions and even provide flights that can be both indoors and
    outdoors.


    ### Advanced Wi-Fi

    `Snapdragon flight` uses an 801 process that will support highly advanced Wi-Fi
    to allow the drone to know exactly where it is, which is going to be helpful when
    it is being used for police or military matters.


    ## Real-World Application


    Drones have become helpful because they can be sent into situations where humans
    should not be going because it is too dangerous or too dirty. Here are some real-world
    applications in which drones are being used:


    1. **Warfare**: drones first started out in the military and are still being used
    today. The military has the most cutting-edge features to date and use drones
    in wartime for surveillance to gather intel without anyone knowing about it. Drones
    are also used for airstrikes.

    2. **Policing**: it is a possibility that you will be tasered from above before
    too long if you get into an altercation with the police. Police in North Dakota
    use drones to taser culprits as well as deploy tear gas in the state’s effort
    to crack down harder on crime.

    3. **Firefighting**: while this may give you images of drones dropping water onto
    brushfires, you’re a little bit off. Drones are being used to drop fire into the
    brushfire. This is called controlled burning and is meant to stop the wildfire
    from spreading further by burning off bushes that they could feed off of. This
    is also used to maintain biodiversity. Back in 2007, drones were being used to
    help with the Southern California wildfires. Drones would use sensor technology
    to search through the smoke and figure out how big the blaze was.

    4. **Newsgathering machine**: multiple news agencies have brought in drones to
    be their “eye in the sky”.

    5. **Oil exploration**: many big oil and gas companies are fully supportive of
    the use of drones in search for new oil deposits. Right now, the only places that
    this kind of aircraft is cleared to be operated in this manner are some of the
    most distant places known to the United States.

    6. **Selfie bot**: this one is aimed more for the millennials than anyone else.
    There is not one technology trend that the millennials will not adopt when it
    comes to their obsession with selfies. With this one, you will strap the camera
    onto the drone and let it fly around whatever event that you are attending.


    Even Amazon has found a way to get in on the drone game by making deliveries with
    drones. As technology continues to advance, it is likely that we are going to
    start to see drones play a larger role in air refueling processes, rescue missions,
    and even as distant tour guides.

