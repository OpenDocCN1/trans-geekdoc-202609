    # Chapter 9: Speech Recognition


    Speech recognition is an interdisciplinary subfield that falls under computational
    linguistics, which will be used in the development of methodologies and techniques
    that will help machines to recognize and translate spoken language into text.
    This is also known as computer speech recognition, speech to text (STT), or automatic
    speech recognition (ASR). Speech recognition will incorporate the knowledge and
    research needed for computer science, linguistics, and electrical engineering.


    Some systems will require training to take place where the speaker is going to
    read the vocabulary or text into the system. The voice of the person will then
    be analyzed by the system and be used in fine-tuning the recognition of the speech
    of that person, which will help increase accuracy. A speaker dependent system
    uses training while a speaker independent system does not require training.


    Speech recognition applications will include things like voice dialing, call routing,
    simple data entry, the determining of the speaker’s characteristics, aircraft,
    speech to text processing, preparation of structured documents, and domotic appliance
    control search. The term voice recognition refers to the identification of the
    speaker instead of what they are saying. By recognizing the speaker, the task
    of translation in systems is going to be simplified.


    When you look at speech recognition from a technological perspective, it has a
    long history with multiple waves of innovations. One of the most recent waves
    is thanks to big data and deep learning. These advances not only can be seen due
    to the surge of academic papers that have been published but also by the worldwide
    industry adoption with the different deep learning methods that have been used
    when it comes to designing and deploying these speech recognition systems. You
    can see this innovation in companies like SoundHound, Microsoft, IBM, Amazon,
    and Apple.


    ## Speech Recognition in Robotics


    Have you ever seen a robot speak? This is possible thanks to speech recognition!
    As we mentioned earlier, speech recognition will be classified into two different
    categories: Speaker independent and Speaker dependent.


    Systems that are speaker dependent will be trained by one person, and that person
    is going to be the one who is using the system. These systems are efficient and
    can get a high command count; however, the system will only give responses to
    the person that has trained the system.


    Speaker independent systems will be trained to respond to words of an individual
    who speaks. The voice input device will be mounted on a controller; therefore,
    the commands being given related to movement are going to be given by voice and
    then converted into digital form. This is going to be done by an analog to digital
    converter. The commands will be inputted into a microphone, and then electrical
    signals can change the voice into the movements. Once these digital signals are
    given to the robotic controller, then the filtering device will be used to take
    the data in the form of voice. To improve accuracy and voice, there will be a
    conversion modeling process that will form a system response.


    ## System Recognition Circuit


    To train the circuit of up to 40 words, you will think about it like this. You
    will be pressing `1` in order to train the system in that first word. By pressing
    any number, a red LED is going to go out. These numbers will then be displayed
    on a digital display. Once you press the pound button, it will train the system.
    By pressing the pound button, it will be sending signals to a chip that is going
    to listen to training words and will then turn the LED on.


    To do a test, the next step will be to say the word that you want the system to
    recognize; this will be when the microphone is used. Once the word is accepted,
    the LED is going to blink. You will do this for all 40 words, and you should see
    each word entered on the display.


    Speech recognition systems can be broken down into four distinct parts:


    1. Speech recognition will be using the separated audio.

    2. Linear separation of sources.

    3. Computation of missing features from an output which is going to be after it
    has been filtered.

    4. Multiple channels after it have been filtered.


    Once the machine has filtered the speech, the robot will carry out the command
    that is being asked. As technology advances, robots will be able to use speech
    recognition programs not only to take commands but also to communicate with humans
    and even other robots when it comes to completing tasks.

    '
