- fmt: "\nLetters have also been sent by leading AI figures to their prime ministers\
    \ for the Conference on the Convention on Certain Conventional Weapons which took\
    \ place in November of 2017. These letters were also endorsed by Stephen Hawking\
    \ who, at Portugal’s technology conference, sent out a warning that AI could destroy\
    \ the world. Some of the signatures on these open letters included Professor Ian\
    \ Kerr from the University of Ottawa as well as Professor Tim Baldwin from the\
    \ University of Melbourne. Prime Minister Justin Trudeau of Canada stated, “Lethal\
    \ autonomous weapons systems that remove meaningful human control from determining\
    \ the legitimacy of targets and deploying lethal force sit on the wrong side of\
    \ a clear moral line.” \n\nEach letter sent to Canada and the UK highlighted that\
    \ the spectacular advances that have come from machine learning and artificial\
    \ intelligence have led to machines being able independently to perform difficult\
    \ operations without human intervention. These advancements have helped lead to\
    \ many improvements in education, transportation, health care, and infrastructures.\
    \ However, positive transformations are also going to have dangerous outcomes,\
    \ too, which are going to end up demanding heightened moral attention. Autonomous\
    \ weapon systems, as warned by robotic corporations, will be the representative\
    \ of at least 1/3 of the warfare’s revolution. So, to keep this from happening,\
    \ to ban these systems, each letter sent to the UK and Canada is calling for a\
    \ new international agreement. Each letter concluded, “If developed, they will\
    \ permit armed conflict to be fought at a scale greater than ever, and at timescales\
    \ faster than humans can comprehend. The deadly consequence of this is that machines\
    \ – not people – will determine who lives and who dies.” \n\nAn international\
    \ ban on landmines, The Ottawa Treaty in 1996, and this ban were compared to each\
    \ other by Canada’s Minister of Foreign Affairs. Completely banning autonomous\
    \ weapons may be impossible. However, if all countries cooperate, the ban will\
    \ be effective. “When it comes to a ban, I think it’s impossible to have an international\
    \ ban. It will be country-specific,” Abishur Prakash told Newsweek. “Countries\
    \ like Russia, China, and Iran may see an international ban as an attempt by the\
    \ West to assert control. If these countries don’t ban them, then countries like\
    \ the United States and Canada would see a ban on killer robots as a threat to\
    \ their own national security.”\n\n# Chapter 3: Ten Myths about Robots\n\nRobots\
    \ are still misunderstood which means that there are going to be myths about them\
    \ because people are going to be making up information to help themselves understand\
    \ robots a little bit more. In this chapter, we are going to examine some of these\
    \ myths and put them to rest so that you do not have to continue to wonder about\
    \ robots, and thus, will be one step closer to understanding them.\n\n## 1. Robots\
    \ will take jobs away from people\n\nEach major logistics and the manufacturing\
    \ company believe that robots are going to improve the efficiency of their operations\
    \ and the quality of life for those that are working there. Therefore, humans\
    \ are going to keep being a key part of the business whenever it comes to robotics.\n\
    \nWorkers in manufacturing and logistics companies should look at robots as craftsmen\
    \ who use precision tools to enhance their output as they create greater satisfaction\
    \ when it comes to the job that is being done. Tesla Motors is an example of a\
    \ company that uses robots to do tasks that are going to be a threat to the humans\
    \ working there. The workers oversee the operations of the robot and make sure\
    \ that the quality of work that they are putting out is up to par and is what\
    \ is expected from Tesla Motors. At Tesla Motors, the robots working on the assembly\
    \ line glue, rivet, and weld automotive parts together all while being watched\
    \ by a human. Each worker at Tesla can be proud of themselves because they are\
    \ part of a new era in manufacturing where the robots are being used to revamp.\n\
    \n## 2. Robots are expensive\n\nmodern day household applications are going to\
    \ be just a few pieces of household hardware that people purchase every day without\
    \ a second thought. Each of these pieces of equipment has evolved thanks to decades\
    \ of improvement and a million units in the field that have been developed which\
    \ has spread the costs out. The same principle is applied to robots. The issue\
    \ is that almost every robot is going to be specialized and will require hardware\
    \ that is going to cost a lot.\n\nThe actuators are going to be one of the most\
    \ expensive parts that a robot needs to have. The price of these actuators is\
    \ not coming down like the price of processors or sensors. Take, for example,\
    \ Willow Garage spinout factory Perception. Before it was bought out by Google,\
    \ this startup got close to human speed when it came to spotting and removing\
    \ boxes from containers. Though, this robotic system uses sensors that are inexpensive\
    \ like cameras or the `Kinect` devices that are built by Microsoft. However, the\
    \ robot is still going to require an expensive robotic arm that has to be powered\
    \ by conventional actuators. \n\nThe good news is that there is a chance that\
    \ we are about to see a lot of innovation when it comes to the actuation systems.\
    \ It is going to help bring down the cost of robots as it did for appliances.\
    \ One of the very promising areas will involve the sensors that are placed on\
    \ the joints which then allow the robot to control its motions in safe and calculated\
    \ ways. There are groups like Carnegie Mellon University’s (`CMU`) spinout `IAM\
    \ robotics`, `Redwood Robotics`, and `Modbot` that are searching for unique ways\
    \ to reduce the number and simply the motors, gears, and sensors that a robot\
    \ needs. By doing this, the price of robots is going to dramatically be reduced\
    \ which will help to reduce the costs of the arms which will end up dominating\
    \ the cost of the entire robot.\n\n## 3. High-level operations are what robots\
    \ are supposedly used\n\nLike a `CNC` (Computer Numerical Control) machine, robots\
    \ are programmable, where the robot will be changed over from one running reference\
    \ to a different one through the process of calling on a new program. Thanks to\
    \ careful designs, it is possible for flexibility to be incorporated into an entire\
    \ family of parts through the end stage stimulus. If completely necessary, a robot\
    \ can exchange their “hands” like that of a `CNC` machine which can change the\
    \ tools that it needs to do its job.\n\nThe technology of sensors has already\
    \ advanced, which allows it to simplify the part presentation. Vision systems\
    \ can identify and locate parts as well as reduce the need for hand tools. Forced\
    \ sensing helps robots adjust so that they can do assembly tasks that require\
    \ precision. More modern robots can be used effectively to handle up to medium\
    \ volume manufacturing. Manufacturing robots are programmed and switched out quickly,\
    \ which ends up resulting in high-speed economical production.\n\n## 4. The programming\
    \ in robots is hard because of how complex they are\n\nRobots are programmed through\
    \ programs offline or teach pendants. With the pendant, the person who is programming\
    \ the robot is going to take the robot and will be sent through a series of steps\
    \ as it is fine-tuned and stores every point that needs to be stored. The robot\
    \ will then go through this program and check to see if there are any collisions\
    \ before it runs through it again. It will continue to run through it until the\
    \ person programming the robot is completely satisfied with the motion that is\
    \ being taught and that it will run without any issues.\n\nOffline programming\
    \ means that the user can use a model to complete and modify any movements that\
    \ will later be used by the robot. How well the model responds to the program\
    \ is going to determine how many modifications it needs after it has been installed\
    \ on the robot.\n"
