  raw: 'Chapter 6: Artificial Intelligence Artificial intelligence, otherwise known
    as AI, is often referred to as machine intelligence and it is the intelligence
    that is commonly shown in machines as opposed to the natural intelligence that
    is usually seen in humans and various other mammals. When it comes to computer
    science, artificial intelligence research is going to be listed as a study of
    intelligence that is shown by devices that can perceive the environment around
    it in order to take actions that can maximize its chances of being successful
    in reaching its goals. Informally, the word artificial intelligence will usually
    be linked to a machine that can copy a human’s cognitive function problem-solving
    or learning. Definitions often remove how AI has the capability of using intelligence
    in completing tasks. This is considered to be a phenomenon that is known as the
    AI effect which can be lead to the quip that is found in Tesler’s Theorem that
    states “AI is whatever hasn’t been done yet.” Take, for example, special recognition
    through vision has become known as conventional technology. Modern machines are
    now capable of things that classify them as AI because they can successfully understand
    human speech while also competing in high-level strategic games like chess. They
    can also autonomously operate cars and are intelligent enough to deal with routing
    in military simulations and content delivery networks. Artificial intelligence
    was classified into three different classes by Kaplan and Haenlein, which they
    borrowed from the management literature – humanized artificial intelligence, human-inspired,
    and analytical. Analytical artificial intelligence is going to only have characteristics
    that are consistent with cognitive as well as emotional intelligence when it comes
    to understanding, as well as recognizing, cognitive elements and human emotions
    that are factored into the decisions they make. Humanized AI shows characteristics
    of every competency (emotional, cognitive, emotional, and social intelligence)
    as well as being self-aware and self-conscious enough to have interaction with
    others. Human-inspired artificial intelligence must all have human-like appearance
    besides its perceptive, social, and cognitive abilities. They must be able to
    clearly communicate with the use of natural language. And the latest advancement
    called olfaction brings the roots much closer to humans since they can now recognize
    smells. Sometime around 1956 was the first foundation of artificial intelligence
    as an academic discipline. Multiple waves of optimism were experienced in the
    following years, which have also been followed by many failures and even funding
    problems. This was named the AI winter, but it was quickly replaced by new AI
    approaches, triumphs, and more funding given to robotic research. For much of
    its history, artificial intelligence experimentation has been able to be separated
    into subfields that typically fail to keep in contact with each other. The subfields
    can typically be sorted out based on their technical considerations and even a
    specific set of goals while using particular tools or even analytical differences.
    These subcategories can also be created based off of social factors that the institution
    or researchers are interested in. Artificial research’s traditional goals or problems
    include the ability to manipulate and move objects, natural language processing,
    perception, learning, representation, planning, knowledge, and reasoning. One
    of the long-term goals of the field is general intelligence. Approaches include
    traditional symbolic AI, statistical methods, and computational intelligence.
    AI uses various tools including mathematical and search optimization, artificial
    neural networks, and methods that are created because of statistics like economics
    and probability. The AI field regularly draws on linguistics, philosophy, psychology,
    information engineering, mathematics, computer science, and so much more. Artificial
    intelligence was established on the claim that the intelligence of humans “can
    be so precisely described that a machine can be made to simulate it.” It is because
    of this philosophical argument that other discussions about the brain and any
    ethics that are involved in designing androids and other robotics that are provided
    with the systems needed to have intelligence the same as humans, which produce
    problems that have been thoroughly explored thanks to myths, philosophy, and fiction
    ever since antiquity. Some people believe AI is a danger to humanity if the progress
    is unabated. However, there are others that think AI, unlike other technological
    revolutions, is going to cause a massive issue when examining unemployment. In
    the 21st century, AI technology and methodology have seen a resurgence when it
    comes to following some of the technology advances that have taken place in computer
    power, theoretical understanding, and large amounts of data. Artificial intelligence
    methods have become a vital part of this rapidly advancing industry and have helped
    to solve multiple problems that are more demanding of their attention in computer
    science, operations research, and programs engineering. History Thought processing
    androids have been detailed in stories ever since antiquity and have taken up
    residence in fiction like in R.U.R by Karel Capek or Frankenstein by Mary Shelley.
    These characters and their fates have brought about some of the same issues that
    are now being discussed when it comes to the principles of artificial intelligence.
    The study of reasoning for androids first started with theorists and math statisticians.
    The examination of the logistics of math eventually led to the theory of computation
    by Alan Turing which would suggest that a machine can copy any plausible act of
    mathematical deduction through the shuffling of symbols such as 1 and 0. It was
    this insight that made it to the Church-Turing thesis, where any process of formal
    reasoning can be simulated by digital computers. Going along with information,
    cybernetics, and neurobiology’s current discoveries, researchers have been led
    to consider the electronic brain’s development a possibility. Turing proposes
    that “if a human cannot distinguish between responses that come from a machine
    and a human, then the machine could be considered the intelligent being.” The
    formal design for Turing – complete artificial neurons – was recognized to be
    the first work in artificial intelligence. It was created in 1943 by McCulloch
    and Pitts. The field of artificial intelligence research was first started at
    a workshop that was taking place at Dartmouth College in 1956. Those that attended
    were Allen Newell from CMU, John McCarthy from MIT, Herbert Simon from CMU, Arthur
    Samuel from IBM, and Marvin Minsky from MIT all of which would be considered the
    leaders and founders of artificial intelligence research. These professors and
    their students would go on to produce programs that the press would consider to
    be astounding, and the computers would learn checkers strategies, and by 1959,
    they were supposedly playing better than humans. They could also solve word problems
    in algebra, speak English, and prove logical theorems. The Department of Defense
    of the United States heavily funded researches about AI around the mid-60s. They
    also established many laboratories around the world. The founders have a very
    optimistic view of the future of artificial intelligence. As predicted by Herbert
    Simon, “machines will be capable, within twenty years, of doing any work a man
    can do.” This was agreed by Marvin Minsky who added, “Within a generation... the
    problem of creating ‘artificial intelligence’ will be substantially solved.” The
    difficulties of some of the tasks are what they have failed to recognize; hence,
    slowing down then progress. Due to the pressure from the US Congress and Sir James
    Lighthill’s criticism, the US and British governments both cut off any artificial
    intelligence exploratory research. AI winter was what it was known for the next
    couple of years. This was the time when it was difficult to get funding for a
    program intended for artificial intelligence. Due to the expert systems’ commercial
    success, the research for artificial intelligence was brought back in the early
    80s. Expert systems are a kind of AI program which focuses on stimulating the
    analytical and knowledge of the human experts. AI’s market hit more than 1 billion
    dollars in 1985. During this time, the funding for the academic research was restored
    by the governments of the US and Britain, who became inspired by the Fifth Generation
    computer project of Japan. However, artificial intelligence once again fell in
    1987 due to the Lisp Machine market collapse. This led to the second and longer
    hiatus of AI. In the late 90s and early twenty-first century, logistics like medical
    diagnosis and data mining started using AI. Due to the greater emphasis on solving
    specific problems and evolvement in AI’s computational power, AI’s return was
    a success. This made artificial intelligence closer to other fields. The researchers
    and their mathematical methods also made a commitment to scientific standards.
    For the first time in 1997, Garry Kasparov, the reigning world chess champion,
    was beaten by a computer chess-playing system named Deep Blue. An exhibition match
    was made on a quiz show, Jeopardy , in 2011 where two of the greatest champions
    were defeated with a significant difference by IBM’s system Watson. Around 2012,
    improvements to perception and algorithms, faster computers, deep learning, and
    data-hungry advances began to dominate accuracy benchmarks. The Xbox 360 has a
    3D body motion interface which was provided by Kinect. Algorithms that use a lot
    of AI research were used in Xbox One. Smartphones even have intelligent personal
    assistants. Four out of five Go matches was won by AlphaGo held on March 2016
    against the Go champion. Beating a professional Go player that doesn’t have a
    handicap made him the first Go-playing computer system. The next year, AlphaGo
    once again won against the number one champion who had been the winner for two
    consecutive years in the Future of Go Summit. Since Go is more complex than chess,
    this was a major milestone and finally completed the development of artificial
    intelligence. Jack Clark from Bloomberg even said that artificial intelligence
    had a great year in 2015 due to an increase in the number of programs and projects
    that focus on or use AI. Also, since 2011, image processing tasks’ error rates
    drastically fell. The increase in neural networks, according to Clark, may be
    the reason for this drastic change. An increase in research datasets and tools
    and the rise in cloud computing infrastructures made the neural networks more
    affordable A survey in 2017 showed how AI was incorporated in one out of five
    companies to be used in their processes. The government funding was increased
    by China in 2016. It resulted in the rapid increase of research output and the
    huge supply of information which made China a superpower in AI, as believed by
    observers. The Basics of AI AI typically studies its surroundings and takes actions
    so that their goals are reached. The goal of an AI can be something as simple
    as winning a game or as complex as doing a mathematical equation. These goals
    can be induced, or they can be defined explicitly. The goals can be induced implicitly
    if the AI is programmed for reinforcement learning through a reward system for
    good behavior and punishments for bad. On the other hand, an evolutionary system
    can help to induce goals through a fitness function in order to mutate and preferentially
    replicate a high scoring AI system, which is going to be similar to how animals
    evolve to achieve goals like finding food or how a dog can be bred through artificial
    selection because it possesses specific traits. There are some AI systems like
    the nearest neighbor that will reason through analogy, but these systems are not
    usually given goals. But to a certain degree, the goals are going to be implicit
    in their training data. Some systems can be benchmarked should the non-goal system
    be framed as a system whose goal is to successfully accomplish a narrow classification
    task. AI mostly revolves around the use of algorithms. Simpler algorithms can
    be seen below the more complex algorithms. Simple algorithms are like a game of
    tic tac toe. '
