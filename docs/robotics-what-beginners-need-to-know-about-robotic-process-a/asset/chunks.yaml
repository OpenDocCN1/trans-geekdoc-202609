    # 第 8 章：自动驾驶车辆


    自动驾驶汽车也被称为机器人汽车、自主式汽车甚至无人驾驶汽车。它们是能够感知所处环境并在无需人类输入或仅需少量人类输入的情况下移动的车辆。自动驾驶汽车将配备各种传感器，帮助它们评估周围环境，例如惯性测量单元、`GPS`、里程计、声纳、计算机视觉、`Lidar`
    和雷达。此外，还有先进的控制系统可以解释感应信息，以识别正确的导航路径以及车辆路径上可能任何障碍物或标志。


    ## 优势

    一些优势将包括提高安全性和降低成本。它们还将提高流动性、减少犯罪，并提高客户满意度。安全方面的优势还包括减少碰撞以及减少因碰撞导致的成本。由于自动汽车的出现，预计交通流量将会增加，同时为贫人、老年人、残障人士和儿童提供更便利的出行。它们将使旅行变得更容易，因为驾驶员不需要全程驾驶和导航，同时还能降低油耗以及对停车位的需求。


    ## 挑战

    自动驾驶汽车面临的一些问题是安全、责任和技术。每当有人在车内时，他们都会产生控制车辆的欲望。不仅如此，研究人员还必须通过法律框架和政府法规。此外，这会让人们觉得失去了隐私，从而导致黑客攻击或恐怖主义等安全忧虑。在此基础上，由于不再需要驾驶员坐在方向盘后，人们可能会失去工作。由于更加方便，这也会导致郊区化旅行的。


    ## 半自动车辆

    自动化程度是许多车辆的基础。它们可以被归类为全自动或全手动驱动车辆。半自动车辆是它们的统称。在技术和基础设施完全开发出全自动车辆之前还需要一段时间，但在这一研究期间，车辆将根据其自动化程度不断增加。半自动车辆将比全自动车辆具有优势，因为驾驶员仍然控制着车辆。


    ## 应用领域


    ### 自动卡车

    许多公司正在对半挂车进行自动化技术测试。2016 年，Uber 购买了一家自动驾驶卡车公司 `Otto`，在 Uber 购买它们之前，他们已经在公路上展示了卡车。随后，2017
    年，一家位于旧金山的初创公司宣布他们将与一家名为 `Peterbilt` 的卡车制造商合作，以便在 `Peterbilt` 车辆中部署和测试自动化技术。据报道，`Waymo`
    正在对卡车进行自动化技术测试，但该项目尚未提供时间表。此外，2018 年，位于旧金山的 `Starsky Robotics` 完成了通往佛罗里达的七英里无人之旅。这使他们成为公共道路上无人驾驶卡车竞争中的第一个参与者。


    在欧洲，通过“环境安全道路列车”方法开始考虑卡车编队。洛克希德·马丁（Lockheed Martin）在美国军方的资下开发了一种自动卡车运输系统，该系统将一辆由人类驾驶的卡车置于前方，然后其他车辆自动跟随。这是陆军
    `自主移动应用系统 (AMAS)` 开发的一部分。2014 年，该系统由一个自动驾驶软件包组成，可安装在多达九种不同类型的车辆中，必须以 40 英里的速度行驶
    55,000 小时。2017 年，`AMAS` 开始计划部署多达 200 辆卡车，作为快速实地计划的一部分。


    ### 运输系统

    为自动汽车创建的运输系统开始在城市中运行，例如英国、法国、意大利和比利时的部分地区，在荷兰、西班牙和德国，他们正在交通中进行公开测试。


    英国在米尔顿凯恩斯（Milton Keynes）启动了自动客舱 `LUTZ Pathfinder` 的公测。法国政府在 2014 年夏季允许 `PSA Peugeot-Citroen`
    在巴黎进行试验。这些实验计划在 2016 年扩展到斯特拉斯拉斯堡和波尔多等城市。由法国公司 `Valeo` 和 `THALES` 组成的联盟也允许进行自己的测试。


    在新西兰，在陶朗加和基督城等城市，已经计划使用自动驾驶车辆进行公共交通。随后，在中国生产出了一种可以容纳 14 人且没有驾驶座的自动微型巴士。产出的此类车辆已超过
    100 辆，2018 年是中国可用商业自动服务的第一年。这些微型巴士应该将发展到四级水平，这将是封闭道路上的无人驾驶环境。


    '
