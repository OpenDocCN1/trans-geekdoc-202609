- fmt: "\n# Chapter 5: Mobile Robots\n\nMobile robots are robots that are capable\
    \ of locomotion. These robots are typically listed as a subfield to information\
    \ engineering as well as robotics. Mobile robots can move throughout their environment\
    \ and not be stuck in one place. Mobile robots can be autonomous or AMR (autonomous\
    \ mobile robots). This indicates that they can navigate through an uncontrolled\
    \ environment without guidance from human or electromechanical devices. On the\
    \ other hand, mobile robots are going to depend on guidance software that is going\
    \ to make it so that they can cover a route that has been pre-programmed while\
    \ in a controlled environment. These types of vehicles are known as autonomous\
    \ guided vehicles or AGVs.\n\nBy contrast, factory robots are going to mostly\
    \ be stationary because they work with a jointed arm and a gripper assembly (they\
    \ can also work with an end-stage stimulus) that cannot be moved because it is\
    \ attached to its workspace. Mobile robots are starting to be more ordinary in\
    \ factory and commercial settings. Medical centers have begun to use mobile robots\
    \ that can follow a predetermined route to move product that is too heavy for\
    \ human workers to move. Warehouses have started to install mobile robotic systems\
    \ so that the materials from the shelves can be efficiently moved to the fulfillment\
    \ zones. Current researches, as well as most universities, most often concentrate\
    \ on mobile robots. The security and military fields also make use of mobile robots.\n\
    \nDomestic mobile robots include entertainment robots that can perform household\
    \ tasks like gardening or vacuuming. The modules for mobile robots will be the\
    \ controller, the control programs, actuators, and sensors. The controller is\
    \ usually going to be a microprocessor that is tied to a distant control or a\
    \ laptop. The programs will be a scripting language of some sort like `C` or `C++`.\
    \ Sensors will depend on the conditions set for the robot. The conditions could\
    \ include processing skills, sensors to sense what is being touched, how close\
    \ they are to something, forming a map based off of its location, or even the\
    \ avoidance of collisions, and any number of other applications.\n\n## Classification\n\
    \nMobile robots fall under the following classifications:\n\n1. **The environment\
    \ where they travel**\n    - Arctic robots were invented to navigate across ice\
    \ and abyss-filled climates.\n    - Robots that are used on land or in the home\
    \ are usually called Unmanned Ground Vehicles or UGVs. They are typically going\
    \ to move on tracks or wheels but can also cover the robots that have legs. These\
    \ robots will consist of two or more legs.\n    - AUVs, autonomous underwater\
    \ vehicles, are what underwater robots are called.\n    - UAVs, uncrewed aerial\
    \ vehicles, are what aerial robots are called.\n\n2. **The device they use to\
    \ move**\n    - tracks\n    - wheels\n    - legs\n\n## Robot Navigation\n\n1.\
    \ **Physical distant or tele-op**: this robot is physically teleoperated and is\
    \ commanded by the driver by using a switch or other distant control devices.\
    \ The distant is going to either be plugged into a robot directly or act as an\
    \ attachment to a laptop or some other means of operation. A tele-op’d robot will\
    \ be utilized to make sure that the operator is safe. A few examples of distant\
    \ manual robots are the Robotics Design’s Anatroller ARI - 50 and ARI - 100. There\
    \ is also KumoTek’s MK-705 Rosterbot and Foster-Miller’s Talon. \n\n2. **Guarded\
    \ tele-op**: this teleop robot is guarded and can detect and move around obstacles\
    \ but is going to navigate as it is driven. A manual tele-op robot can be compared\
    \ to this. There are not many moving robots that present only guarded tele-op\
    \ (if there are any). \n\n3. **Line-following car**: They would follow a visual\
    \ line that was embedded on the ceiling or floor or painted. They would also follow\
    \ an electric wire that was laid out on the floor. Many of these robots function\
    \ on a basic algorithm that was to “keep the line in the center sensor.” These\
    \ robots wouldn’t move around obstacles; instead, they’d stop and wait until whatever\
    \ was blocking their path was removed. You can still buy line following cars because\
    \ they are produced by Transbot, FMC, Egemin, HK Systems, and several more. Robots\
    \ like this are still popular in robotic societies because they are the first\
    \ step taken when learning about robotics. \n\n4. **Autonomously randomized robot**:\
    \ autonomous robots that have random motions are going to bounce off walls even\
    \ if they sense the walls.\n\n5. **Autonomously guided robot**: They have a little\
    \ bit of data about its destination and the information needed to reach its goal\
    \ or any places that it will need to stop on its route. Knowledge of where the\
    \ robot is currently can be determined thanks to at least one of the following\
    \ methods – sensors, vision, global positioning systems, lasers, and Stereopsis.\
    \ These location systems will typically use the Monte-Carlo/Markov localization,\
    \ relative position, and triangulation to figure out exactly where the platform\
    \ is for the robot to the next goal’s path. This robot can collect readings from\
    \ their sensors that are stamped with both location and time. Take, for example,\
    \ a PatrolBot. This robot acts as security that sends a notification to the command\
    \ center when emergencies happen, operates the elevators, and responds to alarms.\
    \ Other autonomously guided robots can be used in a hospital. Dr. Ahmed Elgammal,\
    \ a computer scientist, Dr. Simeon Kotchomi, a biologist, and Dr. Qingze Zou,\
    \ an engineer, helped the artist, Elizabeth Demaray, to create an autonomous robot\
    \ that has a capability of looking for water and sunlight for a potted plant back\
    \ in 2013.\n\n## Sliding Autonomy\n\nSome of the more capable robots are combined\
    \ with several stages of navigation under a system that is known as sliding autonomy.\
    \ Manual mode can be seen to most robots that are guided independently, such as\
    \ the hospital robot, HelpMate. The Motivity autonomous operating system has been\
    \ used with MapperBot, SpeciMinder, PatrolBot, and many other robots that present\
    \ a range of autonomy that can go from being manually operated to a guarded mode.\n\
    \n## History\n\n| Time Period |\n| --- |\n| 1939 - 1945 |\n| 1948 - 1949 |\n|\
    \ 1961 - 1963 |\n| 1969 |\n| 1970 |\n| 1976 |\n| 1980 |\n| Early 1980s |\n| 1983\
    \ |\n| 1986 |\n| 1987 |\n| 1988 |\n| 1989 |\n| 1990s |\n| 1991 |\n| 1993 - 1994\
    \ |\n| 1994 |\n| 1995 |\n| 1995 |\n| 1996 |\n| 1996 - 1997 |\n| 1999 |\n| 2001\
    \ |\n| 2002 |\n| 2003 |\n| 2004 |\n| 2005 |\n| 2006 |\n| 2008 |\n| 2010 |\n| 2016\
    \ |\n| 2017 |\n"
