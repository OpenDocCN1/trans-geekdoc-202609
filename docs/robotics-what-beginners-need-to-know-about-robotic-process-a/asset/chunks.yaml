    人们对机器人技术有很多疑问，在本章中，我们将回答一些初学者对机器人提出的常见问题，这些问题在书的前尚未解答。


    ### 1. 机器人多模型感知中常见的传感器融合算法有哪些？它们如何通过传感器融合来改进其位置估计？


    目前，最佳选择之一是 `Kalman filters`（卡尔曼滤波）以及粒子滤波器（particle filter）。当你处理初始位置或线性测量值时，`Kalman
    filter` 将非常有用。即使初始位置未知且没有非线性测量值，`particle filter` 派上用场。然而，它需要大量的计算量，而这是 `Kalman
    filters` 不需要完成的。无论你使用哪种传感器，你都必须对机器人的状态进行建模，以估计它们的传播，并根据已获得的任何测量值来更新估计结果。


    ### 2. 机器人能够取代老师吗？


    不能！机器人可以从事体力工作，并协助老师安排教学和进行管理，这就是为什么老师会使用音视频记录工具。任何东西无法取代老师与学生及家长之间建立的关系。当学生度过艰难时期时，机器人无法像老师那样展现同样的共情心。归根结底，机器人只不过是一本会说话的教科书。


    ### 3. 人工智能在未来有哪些潜在的用途？


    在科学领域，将出现更强大的计算机，它们能够完成现在做的事情，由于处理能力的提高，速度会更快。这些计算机将帮助科学家发现大型数据集中的重要模式。计算机不仅对科学家，对世界上几乎每个人来说都是极其な工具，因为它们可以访问我们原本无法获得的信息。当你谈到
    `artificial intelligence`（人工智能）这个词时，计算机的使用是为了更好地理解人类大脑是如何经历决策过程的。了解人类大脑如何做决策有助于研究人员和创造者制造出遵循相同过程的机器人。看看
    `AI` 已经取得了如此巨大的进展，`AI` 在未来拥有无限可能似乎是非常可信的。


    ### 4. 我们会看到机器人科学在教学中扮演重要角色吗？


    是的。我们已经看到技术如何帮助老师更好地教学生，而机器人可以介入并帮助制定教学计划，以针对那些无法按照老师目前教学方式学习的学生。机器人可以帮助老师实现个性化教学，甚至更好地管理自己的时间，以便在整一年的教学中完成他们想做的一切。就像医疗领域一样，机器人帮助老师的可能性是无限的。


    ### 5. 人工智能和机器学习是如何定义的？


    `artificial intelligence`（人工智能）是机器模仿人类行为中所表现智能的能力。`AI` 技术无非是试图模仿人类行为的算法。然而，`Machine
    learning`（机器学习）是一门科学和工程，它为计算机提供了无需显式编程即可学习的能力。


    ### 6. 智能辅助是人工智能在客户服务唯一应用之一吗？还是有其他人工智能影响客户服务的方式？


    `AI` 技术的前端应用将使客户关服务的智能助手成为关键，但还有其他应用在发挥作用。之一是应用 `AI` 直接支持联络代理而非取代他们。在客户服务互动过程中，将使用自然语言和语音识别来寻找相关信息，并对代理应如何做出做出建议。


    ### 7. 是否会在某个时间点呼叫中心将不再存在？目前是这样？


    不会。然而，取决于机器人如何改变技术，未来道路可能会发生变化。由于机器人技术，更简单的任务可以通过数字渠道处理，自动化很可能让机器人与呼叫中心协同工作。


    ### 8. 机器人流程自动化（RPA）与人工智能之间的区别是什么？


    在回答这个问题之前，你必须了解背景。如果公司说计划将人工智能集成到业务流程中，`RPA` 和 `AI` 是同一件事。在其他情况下，`RPA` 解决方案将执行诸如复制和粘贴到
    `Excel` 等简单任务。然后，更先进的 `RPA` 解决方案将使用 `machine learning`（机器学习）来观察和学习。`Artificial
    intelligence`（人工智能）描述了并非每个 `RPA` 解决方案都是智能的。


    ### 9. 为什么专家关注机器人领域的伦理问题？


    自 1950 年代引入第一个机器人以来，它们已成为现代生活的一部分。机器人现在被用于工厂、战争，甚至用于照顾老年人或儿童。机器人在家庭和社会中的存在影响着人类行为。这些方法旨在提高对机器人伦理问题的意识。机器人的普及是通过科幻小说完成的。


    ### 10. 机器人是如何发展的？未来它们可能变得多复杂？


    当你查看 `Robotics`（机器人技术）的百科时，你会看到五代机器人。第一代出现在 1980 年以前，是精确的机械设备，这种机器人没有任何外部传感器或
    `artificial intelligence`（人工智能）。第二代出现在 1980 年到 1990 年之间，具有计算机控制并可以编程，它们还有视觉系统、位置传感器。第三代出现在
    1990 年代中期及以后，是自主的移动机器人，这些机器人带有导航系统或遥操作 `artificial intelligence`。最后，第四代和第五代是未来将看到的预测性机器人，这些机器人将获得某些人类特征，例如幽默。


    ### 11. 为什么要观察机器的潜在道德地位？


    即使机器人是复杂的、自主且智能的，其行为也将由人类决定。然而，如果我们假设机器人未来可能会变得更加复杂，那么它们的算法性质将是一个需要从伦理角度关注的问题。机器人开发和利用的问题在于，其他技术创新可能无意中伤害人类。归根结底，问题不仅是机器人必须遵守某些伦理规范，而且某些规范必须被编写到实际机器人中。这种需求对于机器人伤害人类的方式是明显的。关于具有增强自主能力的机器人的有趣问题引发了对其道德地位的问题。机器人是否应该获得给予人类和动物的道德尊重和豁免？取决于机器人研究未来的进展，你不能排除未来机器人拥有感知、情感甚至道德地位的可能性。这些高智能自主机器人的快速发展将挑战目前根据道德地位对生物的分类。它是相同的还是会像动物权利运动那样发生深刻的变化？


    ### 12. 机器人技术是如何监管的？


    记住，机器人是复杂的生物，这引发了当机器人故障并伤害某人时，谁需要承担法律和伦理责任的问题。机器人和其他技术一样，将被用于善恶目的。机器人继续受到伦理和法律监管，因为它们仍然是新的，研究领域变化迅速，它们对世界的影响无法预测的。机器人研究和项目没有特定的指南，特别是那些直接影响人类的项目。此外，机器人没有通用的行为准则。然而，在法律法规方面，机器人与其他产品受到相同对待。


    ### 13. 有人建议错误将会发生。这是真的吗？


    每当你部署 `RPA`，它都遵循规则。在 `RPA` 早期，客户之一是一家电信公司，能够向订购的客户发送信息。在测试阶段，加入了一个循环。当它最终上线时，他们忘记删除该循环；因此，它向每个人发送了“4”。这是一个可能出现问题并导致大规模故障的例子。这就是为什么在测试时必须非常小心。


    ### 14. 客户可能会追求哪些被视为“易得之果”的机会领域？你认为下一个机会在哪里？


    `RPA` 不是特定流程的解决方案，也不是所有问题的答案。它是自动化流程和系统间隙的完美工具。每当你寻找机会时，很有可能会有大量人员执行基于规则的工作，且输入的数据必须是结构化的。因此，呼叫中心不适合大规模
    `RPA`，而更适合代理辅助解决方案，机器人位于代理的桌面。如果你希望在自动化方面产生更大的影响，你应该关注人力资源部门等地方，因为他们负责审查员工和处理工资。


    ### 15. 创建和实施 RPA 解决方案的成本是多少？


    业务案例模型没有价格；因此，没有给出具体的整体价格。然而，对于更多企业来说，单个机器人许可的常见范围大约在每年 $2000 到 $15000 之间。但这仅仅是许可费用，仅占总拥有成本的一小部分。机器人可以完成你部署任何工作。如果你在正常工作时间内工作，那么将获得
    1:1 的比例，即一个机器人完成一个全职的工作量。然而，如果你 24/7 工作，你可以获得 20 个全职的工作量。


