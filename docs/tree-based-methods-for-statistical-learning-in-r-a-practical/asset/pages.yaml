    Such a *totally randomized tree* [Geurts et al., 2006] can be useful in detecting
    potential outliers and anomalies, as will be discussed in Section 7.8.5. Extra-trees
    can be fit in R via the **ranger** package. In Python, an implementation of the
    extra-trees algorithm is provided by the **sklearn.ensemble** module.


    # ## 7.8.5 Anomaly detection with isolation forests


    While the proximities of an RF can be used to detect novelties and potential outliers,
    they''re rather computationally expensive to compute and store, especially for
    large data sets; also, as previously mentioned, many RF implementations do not
    support proximities. A more general approach to anomaly detection, called an *isolation
    forest*, was proposed in Liu et al. [2008]. An isolation forest is essentially
    an ensemble of *isolation trees* (IsoTrees). IsoTrees are similar to extra-trees
    with \(K=1\) (Section 7.8.4), except that the splitting variables are also chosen
    at random; hence, IsoTrees are unsupervised in the sense that the tree building
    process does not make use of any response variable information.


    So how does it work? Isolation forests are quite simple actually. The core idea
    is to “isolate” anomalous observations, rather than creating a profile for “normal”
    ones—the latter seems to be the more common approach taken by other methods in
    practice. Isolation forests assume that


    +   1) anomalies are rare in comparison to “normal” observations;


    +   2) anomalies differ from “normal” instances in terms of the values of their
    features.


    In other words, isolation forests assume anomalies are “few and different” [Liu
    et al., 2008]. If anomalies are “few and different”, then they are susceptible
    to *isolation* (i.e., easy to separate from the rest of the observations).


    In an IsoTree, observations are recursively separated until all instances are
    isolated to their own terminal node; since the split variables and split points
    are determined completely at random, no response information is needed. Anomalous
    observations tend to be easier to isolate with fewer random partitions compared
    to normal instances. That is to say, the relatively few instances of anomalies
    tend to have shorter path lengths in an IsoTree when compared to normal observations.
    The path length to each observation can be computed for a forest of independently
    grown trees and aggregated into a single *anomaly score*. The anomaly score for
    an arbitrary observation \(\boldsymbol{x}\) is given by'
