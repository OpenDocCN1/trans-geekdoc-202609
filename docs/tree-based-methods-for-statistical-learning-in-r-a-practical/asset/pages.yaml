    # 1.4.9 Mayo Clinic primary biliary cholangitis study


    This example concerns data from a study by the Mayo Clinic on primary biliary
    cholangitis (PBC) of the liver conducted between January 1974 and May 1984; follow-up
    continued through July 1986. PBC is an autoimmune disease leading to destruction
    of the small bile ducts in the liver. There were a total of N = 418 patients whose
    survival time and censoring indicator were known (I’ll discuss what these mean
    briefly). The goal was to compare the drug D-penicillamine with a placebo in terms
    of survival probability. The drug was ultimately found to be ineffective; see,
    for example, Fleming and Harrington [1991, p. 2] and Ahn and Loh [1994] (the latter
    employs a tree-based analysis). An additional 16 potential covariates are included
    which I’ll investigate further as predictors in Section 3.5.3.


    Below, I load the data from the survival package [Therneau, 2021] and do some
    prep work. For starters, I’ll only consider the subset of patients who were randomized
    into the D-penicillamine and placebo groups; see ?survival::pbc for details. Second,
    I’ll consider the small number of subjects who underwent liver transplant to be
    censored at the day of transplant⁹:


    ```

    library(survival)

    ```


    ```

    pbc2 <- pbc[!is.na(pbc$trt), ] # omit non-randomized subjects

    pbc2$id <- NULL # remove ID column

    ```'
