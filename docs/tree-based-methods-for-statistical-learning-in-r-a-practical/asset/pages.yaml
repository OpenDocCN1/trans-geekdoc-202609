- pgno: 199
  md: '# Algorithm 5.1 Bagging for classification and regression trees.


    +   1) Start with a training sample, $d_{trn} = \{(x_i, y_i)\}_{i=1}^N$, and specify
    integers $n_{min}$ (the minimum node size of a particular tree), and $B$ (the
    number of trees in the ensemble).


    +   2) For $b$ in $1, 2, \dots, B$:


    +   a) Select a bootstrap sample $d_{trn}^\star$ of size $N$ from $d_{trn}$.


    +   b) **Optional:** Keep track of which observations from $d_{trn}$ were not
    selected to be in $d_{trn}^\star$; these are called the _out-of-bag_ (OOB) observations.


    +   c) Fit a decision tree $\mathcal{T}_b$ to $d_{trn}^\star$ by recursively splitting
    each terminal node until the minimum node size ($n_{min}$) is reached.


    +   3) Return the ensemble of trees: $\{\mathcal{T}_b\}_{b=1}^B$.


    +   4) To obtain the bagged prediction for a new case $x$, denoted $\widehat{f}_B(x)$,
    pass the observation down each tree—which will result in $B$ separate predictions
    (one from each tree)—and aggregate as follows:


    +   • Classification: $\widehat{f}_B(x) = vote\{\mathcal{T}_b(x)\}_{b=1}^B$, where
    $\mathcal{T}_b(x)$ is the predicted class label for $x$ from the $b$-th tree in
    the ensemble (in other words, let each tree vote on the classification for $x$
    and take a majority/plurality vote at the end).


    +   • Regression: $\widehat{f}_B(x) = \frac{1}{B} \sum_{b=1}^B \mathcal{T}_b(x)$
    (in other words, we just average the predictions for case $x$ across all the trees
    in the ensemble).


    Bagging has the same structural form as (5.1) with $\beta_0 = 0$ and $\{\beta_b
    = 1/B\}_{b=1}^B$, and where each tree is induced from an independent bootstrap
    sample of the original training data and grown to near maximal depth (as specified
    by $n_{min}$).


    An important aspect of how the trees are constructed in bagging is that they are
    induced from independent bootstrap samples, which makes the bagging procedure
    trivial to parallelize. See Boehmke and Greenwell [2020, Sec. 10.4] for details
    and an example using the Ames housing data (Section 1.4.7) in R using the wonderful
    **foreach** package [Revolution Analytics and Weston, 2020].'
  merge: -1
  img_proc: true
