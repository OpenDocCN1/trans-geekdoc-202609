    # ## 3.4 Conditional inference trees


    Conditional inference trees provide a unified framework for unbiased recursive
    partitioning based on conditional inference, the same idea behind permutation
    tests, and is general enough to handle data of many different types (e.g., continuous,
    categorical, ordinal, censored, multivariate, and more). CTree uses a general
    two-stage process for recursive partitioning based on null significance tests,
    which is described in Algorithm 3.1 below.


    The next two sections dive a bit deeper into steps 1)–2), respectively.


    # ### 3.4.1 Selecting the splitting variable


    Step 1) of Algorithm 3.1 is to decide whether there is any (statistically significant)
    association between the response and any of the $m$ predictors. This is accomplished
    via $m$ partial tests of hypothesis $H_0^j : D(\boldsymbol{Y}|X_j) = D(\boldsymbol{Y})$,
    for $j = 1, 2, \dots, m$. The test statistic used for assessing the association
    between each feature and the response depends on the scale on which both are measured
    (e.g., multivariate, censored, continuous, ordinal, or nominal categorical). For
    example, if $X$ and $Y$ are both univariate continuous, then a correlation-based
    test can be carried out. If $X$ is categorical and $Y$ is continuous, then a $K$-sample
    test—like an ANOVA $F$-test or Kruskal-Wallis test—can be used. And so on.


    In practice, the predictors will often be measured on different scales; hence,
    different test statistics need to be employed. Consequently, the test statistics
    associated with each test cannot be directly compared without biasing the selection
    of the splitting variable. Fortunately, using $p$-values provides a'
