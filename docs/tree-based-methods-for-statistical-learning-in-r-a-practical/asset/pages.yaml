    nodes in a CART-like regression tree (built using the package **rpart**); see
    [Neufeld et al., 2021] for details.


    CART-like decision trees are implemented in many other open source languages as
    well. Scikit-learn''s **sklearn.tree** module offers extensive decision tree functionality


