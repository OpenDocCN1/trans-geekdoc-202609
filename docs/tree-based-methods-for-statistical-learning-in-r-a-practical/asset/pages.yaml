- pgno: 221
  md: 'Permutation-based VI scores exist in various forms and was made popular in
    Breiman [2001] for random forests (Chapter 7), before being generalized and extended
    in Fisher et al. [2018]. A general permutation-based VI procedure is outlined
    in Algorithm 6.1 below. The idea is that if we randomly permute the values of
    an important feature in the training data, the training performance would degrade
    (since permuting the values of a feature effectively destroys any relationship
    between that feature and the target variable). This of course assumes that the
    model has been properly tuned (e.g., using cross-validation) and is not overfitting.


    The permutation approach uses the difference between some baseline performance
    measure (e.g., R^2 or RMSE for regression, Brier score or log loss for probability
    estimation, and AUC for discrimination) and the same performance measure obtained
    after permuting the values of a particular feature in the training data (Note
    that the model is NOT refit to the training data after randomly permuting the
    values of a feature). It is also important to note that this method may not be
    appropriate when you have, for example, highly correlated features (since permuting
    one feature at a time may lead to unlikely or unrealistic data instances).


    # Algorithm 6.1 General steps for constructing permutation-based VI scores for
    any type of supervised learning model.


    Let x_1, x_2, ..., x_p be the features of interest and let M_orig be the baseline
    performance metric for the trained model; for brevity, I''ll assume smaller is
    better (e.g., classification error or RMSE). The permutation-based importance
    scores can be computed as follows:


    +   1) For i = 1, 2, ..., p:


    +   (a) Permute the values of feature x_i in the training data.


    +   (b) Recompute the performance metric on the permuted data, denoted M_perm.


    +   (c) Record the difference from baseline using VI(x_i) = M_perm - M_orig.


    +   2) Return the VI scores VI(x_1), VI(x_2), ..., VI(x_j).


    Algorithm 6.1 can be improved or modified in a number of ways. For instance, the
    process can (and should) be repeated several times and the results averaged together.
    This helps to provide more stable VI scores, and also the opportunity to measure
    their variability. Rather than taking the difference in step (c), Molnar [2019,
    sec. 5.5.4] argues that using the ratio M_perm/M_orig makes the importance scores
    more comparable across different problems. It''s also possible to assign importance
    scores to groups of features (e.g., by'
  merge: -1
  img_proc: true
- pgno: 222
  md: "permuting more than one feature at a time); this would be useful if features\
    \ can be categorized into mutually exclusive groups, for instance, categorical\
    \ features that have been one-hot encoded.\n\n# 6.1.2 Software\n\nThe permutation\
    \ approach to variable importance is implemented in several R packages, including:\
    \ vip [Greenwell et al., 2021a], iml [Molnar and Schratz, 2020], ingredients [Biecek\
    \ and Baniecki, 2021], and mnmpf [Jones, 2018]. Further details, some comparisons,\
    \ and an in-depth explanation of vip are provided in Greenwell and Boehmke [2020].\
    \ Starting with version 0.22.0, scikit-learn's inspection module provides an implementation\
    \ of permutation importance for any fitted model.\n\n# 6.1.3 Example: predicting\
    \ home prices\n\nTo illustrate the basic steps, let's compute permutation importance\
    \ scores for the Ames housing bagged tree ensemble (ames.bag) from Section 5.5.1.\
    \ I'll start by writing a simple function to compute the RMSE, the performance\
    \ metric of interest, and use it to obtain a baseline value for computing the\
    \ permutation-based importance scores.\n\n```\nrmse <- function(predicted, actual,\
    \ na.rm = TRUE) {\n  sqrt(mean((predicted - actual) ^ 2, na.rm = na.rm))\n}\n\
    (baseline.rmse <- rmse(predict(ames.bag, newdata = ames.trn),\n              \
    \         actual = ames.trn$Sale_Price))\n```\n\n```\n#> [1] 10.6\n```\n\nTo get\
    \ more stable VI scores, I'll use 30 independent permutations for each predictor;\
    \ since the permutations are done independently, Algorithm 6.1 can be trivially\
    \ parallelized across repetitions or features. This is done using a nested for\
    \ loop in the next code chunk:\n\n```\nnperm <- 30 # number of permutation to\
    \ use per feature\nxnames <- names(subset(ames.trn, select = -Sale_Price))\nvi\
    \ <- matrix(nrow = nperm, ncol = length(xnames))\ncolnames(vi) <- xnames\nfor\
    \ (j in colnames(vi)) {\n  for (i in seq_len(nrow(vi))) {\n    temp <- ames.trn\
    \ # temporary copy of training data\n    temp[[j]] <- sample(temp[[j]]) # permute\
    \ feature values\n    pred <- predict(ames.bag, newdata = temp) # score permuted\
    \ data\n    permuted.rmse <- rmse(pred, actual = temp$Sale_Price) ^ 2\n    vi[i,\
    \ j] <- permuted.rmse - baseline.rmse # smaller is better\n  }\n}\n```"
