  md: '# 8.7.2 Histogram binning


    Finding the optimal split for a numeric feature in a decision tree can be slow
    when dealing with many unique values; the more unique values a numeric predictor
    has, the more split points the tree algorithm has to search through. A much faster
    alternative is to bucket the numeric features into bins using histograms.


    The idea is to first bin the input features into integer-valued bins (255–256
    bins seems to be the default across many implementations) which can tremendously
    reduce the number of split points to search through. Histogram binning is implemented
    in a number of popular GBM implementations, including XGBoost (Section 8.8.1),
    LightGBM (Section 8.8.2), and the sklearn.ensemble module. LightGBM''s online
    documentation lists several earlier references to this approach; visit https://lightgbm.readthedocs.io/en/latest/Features.html
    for details.


    # 8.7.3 Explainable boosting machines


    Explainable boosting machine (EBM) is an interpretable model developed at Microsoft
    Research [Nori et al., 2019]. In particular, an EBM is a tree-based, cyclic gradient
    boosting generalized additive model (GAM) with automatic interaction detection.
    The authors claim that EBMs are often as accurate as current state-of-the-art
    algorithms (like RFs and GBMs) while remaining completely interpretable. And while
    EBMs are often slower to train than other modern algorithms, they are extremely
    compact and fast at prediction time, which makes them attractive for deploying
    in a production process.


    In essence, an EMB fits a GAM of the form:


    ```

    g(E[y|x]) = β₀ + Σⱼ fⱼ(xⱼ), (8.6)

    ```


    where g is a link function that connect the random and systematic component (e.g.,
    adapts the GAM to different settings such as classification, regression, or Poisson
    regression), and fⱼ is a function of predictor xⱼ. Compared to a traditional GAM,
    an EBM:


    +   estimates each feature function fⱼ(xⱼ) using tree-based ensembles, like gradient
    tree boosting or bagging;


    +   can automatically detect and include pairwise interaction terms of the form
    fᵢⱼ(xᵢ, xⱼ).


    The overall boosting procedure is restricted to train on one feature at a time
    in a “round-robin” fashion using a small learning rate to ensure that feature'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'order does not matter, which helps limit the effect of collinearity or strong
    dependencies among the features.


    EBMs are considered “glass box” or highly interpretable models because the contribution
    of each feature (or pairwise interaction) to a final prediction can be visualized
    and understood by plotting $f_j(x_j)$, similar to a PD plot (Section 6.2.1). And
    since EBMs are additive models, each feature contributes to predictions in a modular
    way that makes it easy to reason about the contribution of each feature to the
    prediction [Nori et al., 2019]. The simple additive structure of an EBM comes
    at the cost of longer training times. However, at the end of model fitting, the
    individual trees can be dropped and only the $f_j(x_j)$ and $f_{ij}(x_i, x_j)$
    need to be retrained, which makes EBMs faster at execution time. EBMs are available
    in the interpret package for Python. For more info, check out the associated GitHub
    repository at https://github.com/interpretml/interpret.


    # 8.7.4 Probabilistic regression via natural gradient boosting


    Many classification tasks are inherently probabilistic. For example, probability
    forests (Section 7.2.1) can be used to obtain consistent probability estimates
    for the different class outcomes (i.e., Pr(y = j|x)). Regression tasks, on the
    other hand, are typically not probabilistic and the predictions correspond to
    some location estimate of y|x; that is, the distribution of y conditional on a
    set of predictor values x. For instance, the terminal nodes in a regression tree—
    which are used to compute fitted values and predictions—provide an estimate of
    the conditional mean E(y|x). Often, it is of scientific interest to know about
    the probability of specific events conditional on a set of features, rather than
    a single point estimate like E(y|x). In the ALS example, rather than using an
    estimate of the conditional mean $\widehat{f}(x) = \widehat{\text{E}}(\text{dFRS}|x)$
    to predict ALS progression for a new patient, it might be more useful to estimate
    Pr(dFRS < c|x), for some constant c. This is where probabilistic regression/forecasting
    comes in.


    Probabilistic regression models provide estimates of the entire probability distribution
    of the response conditional on a set of predictors, denoted $\mathcal{D}_\theta(y|x)$,
    where $\theta$ represents the parameters of the conditional distribution. For
    example, the normal distribution has $\theta = (\mu, \sigma)$; examples include
    generalized additive models for shape, scale, and location (GAMLSS) [Rigby and
    Stasinopoulos, 2005], Bayesian additive regression trees (BART) [Chipman et al.,
    2010], and Bayesian deep learning. While several approaches to probabilistic regression
    exist, many of them are inflexible (e.g., GAMLSS), computationally expensive (e.g.,
    BART), or inaccessible to non-experts (e.g., Bayesian deep learning) [Duan et
    al., 2020]. Natural gradient boosting (NGBoost) extends the simple ideas of gradient
    boosting to probabilistic regression by treating'
  merge: -1
