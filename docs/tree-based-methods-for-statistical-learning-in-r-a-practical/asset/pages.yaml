  md: 'handful of predictions, the most extreme ones, for example. However, generating
    explanations for the entire training set, or a large enough sample thereof, can
    be useful for generating aggregated global model summaries. For example, Shapley-based
    dependence plots [Lundberg et al., 2020] show how a feature''s value impacts the
    prediction of every observation in a data set of interest.


    # 6.3.3 Software


    Various flavors of Shapley values are starting to become widely available in R.
    Implementations of Sample SHAP, for example, are provided in fastshap, iml, and
    iBreakDown [Biecek et al., 2021]. Maksymiuk et al. [2021] discuss several others.


    The shap module in Python is arguably one of the first and most well known implementations
    of Shapley values for statistical and machine learning. It offers several different
    flavors of Shapley explanations, including Tree SHAP, Kernel SHAP [Lundberg and
    Lee, 2017], Sample SHAP, and many more specific to different applications, like
    deep learning.


    # 6.3.4 Example: predicting home prices


    In the example below, I''ll use fastshap to estimate feature contributions for
    the record in the test set with the highest predicted sale price using R = 100
    Monte Carlo repetitions. Note that fastshap''s explain() function includes an
    adjustment argument to ensure the efficiency property; see https://github.com/bgreenwell/fastshap/issues/6
    for details.


    As with pdp, fastshap defines its own autoplot() method for automatically producing
    various ggplot2-based Shapley plots; IMO it''s far better (and more flexible)
    to manually produce your own plots from the raw output. In the code chunk below,
    I use explain() and autoplot() to produce a bar plot of the feature contributions
    for the training observation with the highest predicted sale price:


    ```

    library(fastshap)

    library(ggplot2)


    # Find observation with highest predicted sale price

    pred <- predict(ames.bag, newdata = ames.tst)

    highest <- which.max(pred)

    ```


    An alternative way to visualize individual feature contributions using a waterfall
    chart is given in Section 8.9.1.'
