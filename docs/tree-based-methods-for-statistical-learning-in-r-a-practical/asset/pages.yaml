  md: "A simple R implementation of Algorithm 6.3 is given below. Here, obj is a fitted\
    \ model with scoring function f (e.g., predict()), nsim is the number of Monte\
    \ Carlo repetitions to perform, feature gives the name of the corresponding feature\
    \ in x to be explained, and X is the training set of features.\n\n```\n```r\n\
    sample.shap <- function(f, obj, R, x, feature, X) {\n  phi <- numeric(R) # to\
    \ store Shapley values\n  N <- nrow(X) # sample size\n  p <- ncol(X) # number\
    \ of features\n  b1 <- b2 <- x\n  for (m in seq_len(R)) {\n    w <- X[sample(N,\
    \ size = 1), ]\n    ord <- sample(names(w)) # random permutation of features\n\
    \    swap <- ord[seq_len(which(ord == feature) - 1)]\n    b1[swap] <- w[swap]\n\
    \    b2[c(swap, feature)] <- w[c(swap, feature)]\n    phi[m] <- f(obj, newdata\
    \ = b1) - f(obj, newdata = b2)\n  }\n  mean(phi) # return approximate feature\
    \ contribution\n}\n```\n```\n\nTo illustrate, let's continue with the Ames housing\
    \ example (ames.bag). Below, I use the sample.shap() function to estimate the\
    \ contribution of the value of Gr_Liv_Area to the prediction of the first observation\
    \ in the learning sample (ames.trn):\n\n```\n```r\nX <- subset(ames.trn, select\
    \ = -Sale_Price) # features only\nset.seed(2207) # for reproducibility\nsample.shap(predict,\
    \ obj = ames.bag, R = 100, x = X[1, ],\n            feature = \"Gr_Liv_Area\"\
    , X = X)\n#> [1] -6.7\n```\n```\n\nSo, having Gr_Liv_Area = 1474 helped push the\
    \ predicted sale price down toward the baseline average; in this case, the baseline\
    \ average is just the average predicted sale price across the entire training\
    \ set: f̃ = $181.53 (don't forget that I rescaled the response in this example).\n\
    \nIf there are p features and m instances to be explained, this requires 2 × R\
    \ × p × p × m computations (or calls to the scoring function f). In practice,\
    \ this can be quite computationally demanding, especially since R needs to be\
    \ large enough to produce good approximations to each ϕi (x*). How large does\
    \ R need to be to produce accurate explanations? It depends on the variance of\
    \ each feature in the observed training data, but typically R ∈ [30, 100] will\
    \ suffice. The R package fastshap [Greenwell, 2021a] provides an optimized implementation\
    \ of Algorithm 6.3 that only requires 2mp calls to f; see the package documentation\
    \ for details.\n\nSample SHAP can be computationally prohibitive if you need to\
    \ explain large data sets (optimized or not). Fortunately, you often only need\
    \ to explain a"
