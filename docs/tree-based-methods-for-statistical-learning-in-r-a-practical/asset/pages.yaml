    # 7.9.4 Example: class imbalance (the good, the bad, and the ugly)


    As discussed in Section 7.2.1, we often don’t want to predict a class label, but
    rather the probability of belonging to a particular class—the latter has the benefit
    of providing some indication of uncertainty (e.g., if we predicted Jack to have
    a 15% chance of surviving his voyage on the Titanic, then we also estimate that
    he has an 85% chance of not surviving). Some models, however, can give you poor
    estimates of the class probabilities. *Calibration* addresses the issue by allowing
    you to better calibrate the probabilities of a fitted model, or provide estimated
    probabilities for models that are unable to naturally produce them in the first
    place (support vector machines, for example).


    Calibration refers to the degree of agreement between observed and predicted probabilities,
    and its utility is well-discussed in the statistical literature (even if not commonly
    practiced); see, for example, Rufibach [2010], Austin and Steyerberg [2014], and
    Niculescu-Mizil and Caruana [2005]—the latter discusses calibration in a broader
    context and includes some discussion on calibrating RFs. A well calibrated (binary)
    probability model should produce accurate class probabilities such that among
    those probability estimates close to, say, 0.7, approximately 70% actually belong
    to the positive class, and so on.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "Unless the trees are grown to purity, RFs generally produce consistent and\
    \ well-calibrated probabilities [Malley et al., 2012, Niculescu-Mizil and Caruana,\
    \ 2005], while boosted trees (Chapter 8) do not*. However, we'll see shortly that\
    \ that's not always the case. Furthermore, calibration curves can be useful in\
    \ comparing the performance of fitted probability models.\n\nReal binary data\
    \ are often unbalanced. For example, in modeling loan defaults, the target class\
    \ (default on a loan) is often underrepresented. This is expected since we would\
    \ hope that most people don't default on their loan over the course of paying\
    \ it off. However, many practitioners perceive class imbalance as an issue that\
    \ affects “accuracy.” In actuality, the problem is usually that the data are balanced\
    \ [Matloff, 2017, p. 193].\n\nIn this example, I'm going to simulate some unbalanced\
    \ data. In particular, I'm going to convert the Friedman 1 benchmark regression\
    \ data (Section 1.4.3) into a binary classification problem using a latent variable\
    \ model. Essentially, I'll treat the observed response values as the linear predictor\
    \ of a logistic regression model and convert them to probabilities. We can then\
    \ use a binomial random number generator to simulate the observed class labels.\
    \ The important thing to remember about this simulation study is that we have\
    \ access to the true underlying class probabilities!\n\nA simple function to convert\
    \ the Friedman 1 regression problem into a binary classification problem, as described\
    \ above, is given below. (Note that the line d$y <- d$y - 23 shifts the intercept\
    \ term and effectively controls the balance of the generated 0/1 outcomes—here,\
    \ it was chosen to obtain a 0/1 class balance of roughly 0.95/0.05.)\n\n```\n\
    gen_binary <- function(...) {\n  d <- treemisc::gen_friedman1(...) # regression\
    \ data\n  d$y <- d$y - 23 # shift intercept\n  d$prob <- plogis(d$y) # inverse\
    \ logit to obtain class probabilities\n  #d$prob <- exp(d$y) / (1 + exp(d$y))\
    \ # same as above\n  d$y <- rbinom(nrow(d), size = 1, prob = d$prob) # 0/1 outcomes\n\
    \  d\n}\n\n# Generate samples\nset.seed(1921) # for reproducibility\ntrn <- gen_binary(100000)\
    \ # training data\ntst <- gen_binary(100000) # test data\n```\n\nLet \\(N = N_0\
    \ + N_1\\) be the number of observations in the learning sample, where \\(N_0\\\
    ) and \\(N_1\\) represent the number of observations that belong to class 0 and\
    \ class 1, respectively. If the learning sample is a random (i.e., representative)\
    \ sample form the population of interest, then we can estimate the true"
  merge: -1
  img_proc: true
- pgno: 312
  md: "class priors from the data using \\(\\pi_i = N_i/N\\), for \\(i = 1, 2\\);\
    \ this was discussed for CART-like decision trees in Section 2.2.4. There are\
    \ three scenarios to consider:\n\n+   a) the data form a representative sample,\
    \ and the observed class frequencies reflect the true class priors in the population\
    \ (**the good**);\n+   b) the class frequencies have been artificially balanced,\
    \ but the true class frequencies/priors are known (**the bad**);\n+   c) the class\
    \ frequencies have been artificially balanced, and the true class frequencies/priors\
    \ are unknown (**the ugly**).\n\nIn the code chunk below I use an independent\
    \ sample of size \\(N = 10^6\\) to estimate \\(\\pi_1\\) (i.e., the *prevalence*\
    \ of observations in class 1 in the population):\n\n```\n(pi1 <- proportions(table(gen_binary(1000000)$y))[\"\
    1\"])\n```\n\n```\n#> 1\n#> 0.0498\n```\n\nNext, I'll define a simple calibration\
    \ function that can be used for *isotonic calibration*; for a brief overview of\
    \ different calibration methods, see Niculescu-Mizil and Caruana [2005], Kull\
    \ et al. [2017]. Note that there are many R and Python libraries for calibration;\
    \ for example, `val.prob()` from R package **rms** [Harrell, Jr., 2021] and the\
    \ **sklearn.calibration** module.\n\n```\nisocal <- function(prob, y) { # isotonic\
    \ calibration function\n  ord <- order(prob)\n  prob <- prob[ord] # put probabilities\
    \ in increasing order\n  y <- y[ord]\n  prob.cal <- isoreg(prob, y)$yf # fitted\
    \ values\n  data.frame(\"original\" = prob, \"calibrated\" = prob.cal)\n}\n```\n\
    \nTo start, let's fit a default RF to the original (i.e., unbalanced) learning\
    \ sample. Note that I exclude the prod column when specifying the model formula.\n\
    \n```\nlibrary(ranger)\n# Fit a probability forest (omitting the prob column)\n\
    set.seed(1446) # for reproducibility\n(rfo1 <- ranger(y ~ . - prob, data = trn,\
    \ probability = TRUE,\n                verbose = FALSE))\n```\n\n```\n#> Ranger\
    \ result\n#>\n#> Call:\n#> ranger(y ~ . - prob, data = trn, probability = TRUE,\
    \ verbose = FA...\n#>\n```"
