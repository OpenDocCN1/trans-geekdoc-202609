  md: 'where \(\tilde{y} = 2y - 1 \in \{-1, +1\}^d\) and \(f\) refers to half the
    log odds for \(y = +1\). With binomial deviance, there is no closed-form solution
    to the line search (8.5) in Algorithm 8.1, and approximations are often used instead.
    For example, a single Newton-Rhapson step yields


    \(\gamma_{jb} = \sum_{\boldsymbol{x}_i \in R_{jb}} \tilde{y}_i / \sum_{\boldsymbol{x}_i
    \in R_{jb}} |\tilde{y}_i| (2 - |\tilde{y}_i|) \).


    The final approximation \(\widehat{f}(\boldsymbol{x})\), which is half the logit
    for \(y = +1\), can be inverted to produce a predicted probability. The binomial
    deviance can also be generalized to the case of multiclass classification [Friedman,
    2001].


    More specialized loss functions also exist when dealing with other types of outcome
    variables. For example, Poisson loss (Table 8.1) can be used when modeling counts
    (which are always positive integers). Ridgeway [1999] showed how gradient boosting
    is extendable to the exponential family\(^e\), via likelihood-based loss functions,
    as well as Cox proportional hazards regression models for censored outcomes. Greg
    Ridgeway is also the original creator of the R package **gbm**, which is arguably
    the first open source implementations of gradient boosted decision trees.


    # TABLE 8.1: Common loss functions for gradient tree boosting. The top and bottom
    sections list common loss functions used for ordered and binary outcomes, respectively.


    | Loss name | Loss function | Negative gradient |

    |---|---|---|

    | Least squares | \(\frac{1}{2} [y_i - f(\boldsymbol{x}_i)]^2\) | \(y_i - f(\boldsymbol{x}_i)\)
    |

    | Least absolute deviation | \(|y_i - f(\boldsymbol{x}_i)|\) | \(\text{sign }
    [y_i - f(\boldsymbol{x}_i)]\) |

    | Poisson deviance\(^f\) | \(y_i f(\boldsymbol{x}_i) - e^{f(\boldsymbol{x}_i)}\)
    | \(y_i - e^{f(\boldsymbol{x}_i)}\) |

    | Exponential | \(\exp [-y_i f(\boldsymbol{x}_i)]\) | \(y_i \exp [-y_i f(\boldsymbol{x}_i)]\)
    |

    | Binomial deviance\(^g\) | \(\log [1 + \exp (-2\tilde{y}_i f(\boldsymbol{x}_i))]\)
    | \(2\tilde{y}_i / (1 + \exp [2\tilde{y}_i f(\boldsymbol{x}_i)])\) |


    \(^d\)This re-encoding is done for computational efficiency and also results in
    the same population minimizer as exponential loss (i.e., Adaboost.M1 from Section
    5.2.4); see Bühlmann and Hothorn [2007] for details. \(^e\)The exponential family
    includes many common loss functions as a special case; for example, the Gaussian
    family is equivalent to using LS loss, the Laplace distribution is equivalent
    to using LAD loss, and the Bernoulli/binomial family is equivalent to using binomial
    deviance (or log loss). \(^f\)Here, \(y_i \in \{0, 1, 2, ...\}\) is a non-negative
    integer (e.g., the number of people killed by mule or horse kicks in the Prussian
    army per year, or the number of calls to a customer support center on a particular
