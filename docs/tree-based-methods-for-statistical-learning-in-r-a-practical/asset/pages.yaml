    ties\(^\text{b}\) typically handled at random. Class probability estimates for
    categorical outcomes can also be obtained from bagged tree ensembles and a discussion
    of different approaches is deferred to Section 7.2.1; often, the class proportions
    from each tree are just averaged across all the trees in the bagged ensemble (similar
    to regression).'
