    # 7.9.5 Example: partial dependence with Spark MLlib


    In this section, I''ll look at a well-known bank marketing data set available
    from the UC Irvine Machine Learning Repository [Moro et al., 2014]. The data concern
    the direct marketing campaigns of a Portuguese banking institution, which were
    based on phone calls. Often, more than one contact to the same client was required,
    in order to assess if the product, a bank term deposit, would be subscribed or
    not; hence, this is a binary classification problem with response variable y taking
    on values yes/no depending on whether or not the client did/did not subscribe
    to the bank term deposit. For details and a description of the different columns,
    visit https://archive.ics.uci.edu/ml/datasets/Bank+Marketing.


    Furthermore, I''ll do the analysis via one of the R front ends to Apache Spark
    and MLlib: SparkR" [Venkataraman et al., 2016]. Starting with Spark 3.1.1, SparkR
    also provides a distributed data frame implementation that supports common data
    wrangling operations like selection, filtering, aggregation, etc. (similar to
    using data.table or dplyr with R data frames, but on large data sets that don''t
    fit into memory. For instructions on installing Spark, visit https://spark.apache.org/docs/latest/sparkr.html.


    While the bank marketing data contain 21 columns on 41,188 records, this is by
    no means “Spark territory.” However, you may find yourself in a situation where
    you need to use Spark MLlib for scalable analytics, so I think it’s useful to
    show how to perform common statistical and machine learning tasks in Spark and
    MLlib, like fitting RFs, assessing performance, and computing PD plots.


    To start, I''ll download a zipped file containing a directory with the full bank
    marketing data set. The code downloads the zipped file into a temporary directory,
    unzips it, and reads in the CSV file of interest. (If the following code does
    not work for you, then you may find it easier to just manually download the bank-additional-full.csv
    and read it into R on your own.)'
