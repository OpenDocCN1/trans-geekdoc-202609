    FIGURE 8.12: Coefficient path as a function of the $L_1$-penalty as $\lambda$
    varies. The top axis indicates the number of nonzero coefficients (i.e., number
    of trees) at the current value of $\lambda$. Here, we have one coefficient per
    tree in the full ensemble (the intercept is forced to be zero here).


    boosting, we need to make sure we include the initial fit $f_0(\boldsymbol{x})$,
    which is stored in the "init" component of the output from `lsboost()`. Recall
    that for LS loss $f_0(\boldsymbol{x}) = \bar{y}$, the mean response in the training
    data. This can be done in one of two ways:


    +   1) arbitrarily add it to the predictions from the first tree;

    +   2) include it as an offset when fitting the LASSO and generating predictions.


    In this example, I''ll include the initial fit as an offset in the call to `isle_post()`.


    The results are displayed in Figure 8.12 which contains the coefficient paths
    as a function of the $L_1$-penalty as $\lambda$ varies. The top axis indicates
    the number of nonzero coefficients (i.e., number of trees) at the current value
    of $\lambda$. Here, the smallest test error for the LASSO-based post-processed
    GBM is 25.9% and corresponds to 84 trees; see Figure 8.13. The post-processing
    has significantly reduced the number of trees in this example resulting in a substantially
    more parsimonious model while maintaining accuracy. Sweet!


    ```

    library(treeemisc)

    # Fit a LASSO model to the individual training predictions

    preds.trn <- predict(lsb.fit, newdata = X.trn, individual = TRUE)

    ```'
