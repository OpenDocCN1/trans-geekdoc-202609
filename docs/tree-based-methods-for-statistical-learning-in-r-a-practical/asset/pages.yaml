    # 7.4 Hyperparameters and tuning


    RF is one of the most useful *off-the-shelf* statistical learning algorithms you
    can know. By off-the-shelf, I mean a procedure that can be used effectively without
    much tweaking or tuning. Don''t get me wrong, you can (and should try to) improve
    performance with a bit of tuning, but relative to other algorithms, the RFs often
    do reasonably well at their default settings. In contrast, *gradient tree boosting*
    (Chapter 8) can often outperform RFs, but typically require a lot more tuning.


    The most important tuning parameter in an RF is $m_{try}$. But I''d argue that
    the typical defaults (i.e., $m_{try} = \lfloor \sqrt{p} \rfloor$ for classification
    and $m_{try} = \lfloor p/3 \rfloor$ for regression) are quite good. For selecting
    $m_{try}$, a simple heuristic is to try the default, half of the default, and
    twice the default, and pick the best [Liaw and Wiener, 2002]. According to Liaw
    and Wiener [2002], the results generally do not change dramatically, and even
    setting $m_{try} = 1$ can give very good performance for some data. Setting $m_{try}
    < p$ also lessens the computational burden of split variable selection (e.g.,
    CART''s exhaustive search for the best split), making RFs more computationally
    efficient than bagged tree ensembles, especially for larger data sets. On the
    other hand, if you only suspect a small fraction of the predictors to be “important,”
    then larger values of $m_{try}$ may give better generalization performance.


    The number of trees in the forest ($B$) is arguably not a tuning parameter. You
    just need to make sure enough trees are aggregated for the error to stabilize
    (see, for example, Figure 7.6). However, it can be wasteful to fit more trees
    than necessary, especially when dealing with large data sets. For this reason,'
