- pgno: 351
  md: 'the parameters \(\theta\) as targets for a multiparameter boosting algorithm
    similar to gradient boosting (Algorithm 8.1). We say “multiparameter” because
    NGBoost fits a separate model for each parameter at every iteration.


    The “natural” in “natural gradient boosting” refers to the fact that NGBoost uses
    something called the *natural gradient*, as opposed to the ordinary gradient.
    The natural gradient provides the direction of steepest descent in *Riemannian
    space*; this is necessary since gradient descent in the parameter space is not
    gradient descent in the distribution space because distances don’t correspond.
    The important thing to remember is that NGBoost approximates the gradient of a
    proper scoring rule—similar to a loss function, but for predicted probabilities
    and probability distributions of the observed data—as a function of \(\theta\).
    Compared to alternative probabilistic regression methods, NGBoost is fast, flexible,
    scalable, and easy to use. An example, albeit in Python, is given in Section 8.9.2.
    NGBoost is available in the **ngboost** package for Python. For more info, check
    out the NGBoost GitHub repository at https://github.com/stanfordmlgroup/ngboost.


    # ## 8.8 Specialized implementations


    In this section, I’ll take a look at three specialized implementations of GBMs
    that are quite popular for supervised learning tasks, probably due to their availability
    across platforms and ability to scale to incredibly large data sets, even on a
    single machine where the data cannot fit into memory.


    # ### 8.8.1 eXtreme Gradient Boosting: XGBoost


    XGBoost [Chen and Guestrin, 2016] is one of the most popular and scalable implementations
    of GBMs. While XGBoost follows the same principles as the standard GBM algorithm,
    there are some important differences, a few of which are listed below:


    +   - more stringent regularization to help prevent overfitting;

    +   - a novel sparsity-aware split finding algorithm;

    +   - weighted quantile sketch for fast and approximate tree learning;

    +   - parallel tree building (across nodes within a tree);

    +   - exploits out-of-core processing for maximum scalability on a single machine;'
