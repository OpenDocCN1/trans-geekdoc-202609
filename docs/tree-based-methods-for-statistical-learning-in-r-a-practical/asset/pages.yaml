    Right: original sample with three observations replaced by outliers.


    The code chunk below applies the gi.test() function, using both the identity and
    rank transformations, to 100 random samples from X and Y for sample sizes ranging
    from 10–100; note that each sample includes three outlying Y values. For each
    sample size, the approximate power of each test is computed as the proportion
    of times out of 100 that the null hypothesis was rejected'
