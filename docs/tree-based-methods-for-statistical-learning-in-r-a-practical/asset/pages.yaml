    greatest reduction in SSE (p. 58) is selected to split the node. On the other
    hand, if either $x_i$ or $x_j$ is nominal, select the variable with the smallest
    $p$-value from the associated curvature tests. For details, see Algorithm 2 in
    Loh [2002].


    Using a split variable selected from an interaction test does not guarantee that
    the interacting variable will be used to split one of the child nodes. While it
    may be intuitive to force this behavior to highlight the specific interaction
    in the tree, Loh [2002] argues that letting variables compete at each individual
    split can lead to shorter trees.


    # 4.2.3 Non-constant fits


    In contrast to CART and CTree, GUIDE is not restricted to fitting a constant in
    each node. This generality is due to the fact that the residuals are used to select
    the splitting variable. Hence, any model that produces residuals can be used to
    construct the tree. The GUIDE software (Section 4.9) allows a wide range of regression
    models to be used in each node: simple linear regression, Poisson regression,
    regression for censored outcomes, and more. The benefit to fitting non-constant
    models in each node is the potential reduction in tree size and increase to predictive
    accuracy. Of course, the same idea can be applied to exhaustive search procedures
    like CART, but this can be too computationally expensive. By abandoning a fully-exhaustive
    search criteria, GUIDE can afford to fit a richer class of models in the nodes,
    while substantially reducing split variable selection bias—a win-win, so to speak.


    Fitting non-constant models in the nodes of the tree means that the predictors
    can potentially serve more than one role during tree construction. In particular,
    predictors can compete for splits and/or serve as a regressor in terminal node
    fits. For simplicity, GUIDE only allows ordered features to serve as regressors,
    unless the categorical variables are dummy encoded and treated as numeric [Loh,
    2002, p. 371].


    Borrowing the same terminology in Loh [2002], there are four basic roles a predictor
    can serve:'
