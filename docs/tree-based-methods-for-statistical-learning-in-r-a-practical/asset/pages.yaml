  md: '+   1) Take the proportion of votes for each class over the entire forest.


    +   2) Average the class probabilities from each tree in the forest. (In this
    case, \(n_{min}\) should be considered a tuning parameter; see, for example, Malley
    et al. [2012].)


    The first approach can be problematic. For example, suppose the probability that
    \(\boldsymbol{x}\) belongs to class \(j\) is \(\text{Pr}(Y=j|\boldsymbol{x})=0.91\).
    If each tree correctly predicts class \(j\) for \(\boldsymbol{x}\), then \(\widehat{\text{Pr}}(\boldsymbol{x})=1\),
    which is incorrect. If \(n_{min}=1\), the two approaches are equivalent and neither
    will produce consistent estimates of the true class probabilities (see, for example,
    Malley et al. [2012]). Which approach is better for probability estimation? Hastie
    et al. [2009, p. 283] argue that the second method tends to provide improved estimates
    of the class probabilities with lower variance, especially for small \(B\).


    Malley et al. [2012] make a similar argument for the binary case, but from a different
    perspective. In particular, they suggest treating the 0/1 outcome as numeric and
    fitting a regression forest using the standard MSE splitting criterion (an example
    of a so-called *probability machine*). It seems strange to use MSE on a 0/1 outcome,
    right? Not really. Recall from Section 2.2.1 that the Gini index for binary outcomes
    is equivalent to using the MSE. Malley et al. recommend using a minimum node size
    equal to 10% of the number of training cases: \(n_{min} = [0.1 \times N]\). However,
    for probability estimation, it seems natural to treat \(n_{min}\) as a tuning
    parameter. Devroye et al. [1997, Chap. 21–22] provide some guidance on the choice
    of \(n_{min}\) for consistent probability estimation in decision trees.


    The predicted probabilities can be converted to class predictions (i.e., by comparing
    each probability to some threshold), which gives us an alternative to hard voting
    called *soft voting*. In soft voting, we classify \(\boldsymbol{x}\) to the class
    with the largest averaged class probability. This approach to classification in
    RFs tends to be more accurate since predicted probabilities closer to zero or
    one are given more weight during the averaging step; hence, soft voting attaches
    more weight to votes with higher confidence (or smaller standard errors; Section
    7.7).


