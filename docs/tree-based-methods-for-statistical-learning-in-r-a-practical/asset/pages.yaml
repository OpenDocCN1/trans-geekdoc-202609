    like imputation? Feelders [2000] suggests that imputation (especially multiple
    imputation), if done properly, tends to outperform trees based on surrogate splits.
    However, one should still consider whether or not the potential for improved performance
    outweighs the additional effort required in specifying an appropriate imputation
    scheme. Feelders further notes that with “...moderate amounts of missing data
    (say 10% or less) one can avoid generating imputations and just use surrogate
    splits.”


    # 2.8 Variable importance


    In practice, it may be useful, or even necessary, to reduce the number of features
    in a model. One way to accomplish this is to rank them in some order of importance
    and use a subset of the top features. Loh [2012] showed that using a subset of
    only the important variables can lead to increased prediction accuracy. Reducing
    the number of features can also decrease model training time and increase interpretability.
    However, lack of a proper definition of “importance” has led to many variable
    importance measures being proposed; see Greenwell and Boehmke [2020] for some
    discussion and further references.


    Decision trees probably offer the most natural model-specific approach to quantifying
    the importance of predictors. In a binary decision tree, at each node A, a single
    predictor is used to partition the data into two homogeneous groups. The chosen
    predictor is the one that maximizes (2.3). The relative importance of predictor
    x is the sum of the squared improvements over all internal nodes of the tree for
    which x was chosen as the primary splitter; see Breiman et al. [1984] for details.
    This idea also extends to regression trees and ensembles of decision trees, such
    as those discussed in Chapters 5–8.


    When surrogate splits are enabled, they can be accounted for in the quan-'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'tification of variable importance. In particular, a variable may appear in
    the tree more than once, either as a primary or surrogate splitter. The variable
    importance measure for a feature is the sum of the gains associated with each
    split for which it was the primary variable, plus the gains (adjusted for agreement)
    associated with each split for which it was a surrogate. The notation is a bit
    involved, but the interested reader is pointed to Loh and Zhou [2021, Sec. 3].


    Including surrogate information can help improve interpretation when you have
    strongly correlated or redundant features. For instance, imagine two features
    x1 and x2 that are essentially redundant. If we only counted gains where each
    variable was a primary splitter, these two features would likely split the importance,
    with neither showing up as important as they should. Comparing the variable importance
    rankings with and without competing splitters (i.e., non-primary splitters) can
    also be informative. Variables that appear to be important, but rarely split nodes,
    are probably highly correlated with the primary splitters and contain very similar
    information.


    The relative variable importance standardizes the raw importance values for ease
    of interpretation. The relative importance is typically defined as the percent
    improvement with respect to the most important predictor, and is often reported
    in statistical software. The relative importance of the most important feature
    is always 100%. So, if x3 is the most important feature, and the relative importance
    of another feature, say x5, is 83%, you can say that x5 is roughly 83% as important
    as x3.


    It is well known, however, that CART-like variable importance scores are biased;
    see Loh and Zhou [2021] for a thorough (and more recent) review. According to
    Loh and Zhou, a variable importance procedure is said to be unbiased if all predictors
    have the same mean importance score when they are independent of the response.
    Solutions to CART''s variable importance bias, which really stems from CART''s
    split selection bias (Section 2.4.2), are discussed in several places throughout
    this book; see, for example, the discussion in Section 7.5.1.


    # 2.9 Software and examples


    Packages rpart and tree [Ripley, 2021] provide modern implementations of the CART
    algorithm in R, although rpart is recommended over tree, and so we won''t be discussing
    the latter. The name rpart comes from the acronym for (binary) Recursive PARTitioning.
    Beyond simple classification and regression trees, rpart can also be used to model
    Poisson counts (e.g., the number of occurrences of some event per unit of time),
    and censored outcomes. Note'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'that **rpart** is extendable^k and several R packages on CRAN extend **rpart**
    in various ways. For example, **rpartScore** [Galimberti et al., 2012] can be
    used to build classification trees for ordinal responses within the same CART-like
    framework, and **rpart.LAD** [Dlugosz, 2020] can be used to fit regression trees
    based on _least absolute deviation_ [Breiman et al., 1984, Sec. 8.11]. The **treemisc**
    package provides some utility functions to support **rpart**, for example, to
    implement pruning based on the 1-SE rule (Section 2.5.2.1). The R package **treevalues**
