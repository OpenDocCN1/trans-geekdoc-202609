- pgno: 21
  md: 'related to a set of predictors, \(\boldsymbol{x}\), through a model with additive
    error:


    \(Y = f(\boldsymbol{x}) + \epsilon, \quad (1.1)\)


    where \(\epsilon\) is a random variable with mean zero (i.e., E(\(\epsilon\))
    = 0) and is assumed to be independent of \(\boldsymbol{x}\). Note that the response
    is also a random variable here since it is a function of \(\epsilon\). The function
    \(f(\boldsymbol{x})\) is fixed and represents the systematic part of the relationship
    between Y and \(\boldsymbol{x}\). As almost always the case, the true relationship
    between Y and \(\boldsymbol{x}\) is often statistical in nature (i.e., not deterministic)
    and the additive error helps to capture the non-deterministic aspect of this relationship
    (e.g., unobserved predictors, measurement error, etc.).


    Since we assume E(\(\epsilon\)) = 0, it turns out that \(f(\boldsymbol{x})\) can
    be viewed as a conditional expectation:


    \(E(Y|\boldsymbol{x}) = f(\boldsymbol{x}),\)


    where we can interpret \(f(\boldsymbol{x})\) as the mean response for all observations
    with predictor values equal to \(\boldsymbol{x}\). In the case of J-class classification
    (Section 1.1.2.3), we can still view \(f(\boldsymbol{x})\) as a conditional mean;
    in this case it''s the conditional proportion corresponding to a particular class:
    E(Y = j|\(\boldsymbol{x}\)), which can be interpreted as an estimate of Pr(Y =
    j|\(\boldsymbol{x}\))—the probability that Y belongs to class j given a particular
    set of predictor values \(\boldsymbol{x}\). In this sense, class probability estimation
    is really a regression problem.


    The term “supervised” in supervised learning refers to the fact that we use labeled
    training data\(^c\) \(\{y_i, \boldsymbol{x}_i\}_{i=1}^N\) and an algorithm to
    learn a reasonable mapping between the observed response values, y_i, and a set
    of predictor values, \(\boldsymbol{x}_i\). Without a labeled response column,
    the task would be unsupervised (Section 1.1.1.3), and the analytic goal would
    be different.


    An estimate \(\hat{f}(\boldsymbol{x})\) of \(f(\boldsymbol{x})\) can be used for
    either description or prediction (or both). I’ll briefly discuss the meaning of
    each in turn next.


    # 1.1.2.1 Description


    In supervised learning, descriptive tasks are often concerned with determining
    which features have the most impact on \(\hat{f}(\boldsymbol{x})\) and how. For
    example, in supervised learning problems, we are often interested in determining


    +   - which predictors are the most “important” for prediction (feature importance);

    +   - the marginal impact of each predictor (or a subset of the important ones)
    on the predicted outcome (feature effects).


    \(^c\)The labels here are provided by the response values \(\{y_i\}_{i=1}^N\).'
