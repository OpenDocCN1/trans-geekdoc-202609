- pgno: 279
  md: 'to the construction of each tree. Rotating the feature space allows adaptive
    nonparametric learning algorithms, like decision trees, to learn potentially interesting
    patterns in the data that might have gone unnoticed in the original feature space.
    Applying PCA to all the predictors prior to the construction each tree, even when
    using sampling with replacement, won''t be enough to diversify the ensemble. Instead,
    prior to the construction of each tree, the predictor set is randomly split into
    K subsets, PCA is run separately on each, and a new set of linearly extracted
    features is constructed by pooling all the principal components (i.e., the rotated
    data points). K is treated as a tuning parameter, but the value of K that results
    in roughly three features per subset seems to be the suggested default [Kuncheva
    and Rodríguez, 2007]. Rotation forests can be thought of as a bagged tree ensemble
    with a random feature transformation applied to the predictors prior to constructing
    each tree. In this sense, PCA can be thought of as a feature extraction method.
    By performing PCA on random subsets of features prior to fitting each tree, rotation
    forests can improve the performance of a bagged tree ensemble. In this case, the
    derived features come from PCA applied to random subsets of the data, and while
    other feature extraction methods have also been considered, PCA was found to be
    the most suitable [Kuncheva and Rodríguez, 2007].


    Rotation forests have been shown to be competitive with RFs and can achieve better
    performance on data sets with mostly quantitative variables; although, this seems
    to be true mostly for smaller ensemble sizes [Rodríguez et al., 2006, Kuncheva
    and Rodríguez, 2007]. However, most comparative studies I''ve seen seem to focus
    on classification accuracy for comparison, which we know is not the most appropriate
    metric for comparing models in classification settings. Rotation forests are available
    in the R package rotationForest [Ballings and Van den Poel, 2017].


