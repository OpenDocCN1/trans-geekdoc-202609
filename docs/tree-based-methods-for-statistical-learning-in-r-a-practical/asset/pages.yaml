  md: '# 6.2.2 Interaction effects


    While partial dependence can be used to help visualize potential interaction effects,
    it is often desirable to know where to look in the first place. To that end, Friedman
    and Popescu [2008] proposed a model-agnostic method, called the H-statistic, for
    identifying predictors that are involved in interactions with other variables,
    the strength of those interactions, as well as the identities of the other variables
    with which they interact.


    For example, to test for the presence of an interaction effect between predictors
    \(x_j\) and \(x_k\), we can use the statistic


    ```

    \( H^2_{jk} = \sum_{i=1}^N [\bar{f}_{jk}(x_{ij}, x_{ik}) - \bar{f}_j(x_{ij}) -
    \bar{f}_k(x_{ik})]^2 / \sum_{i=1}^N \bar{f}_{jk}(x_{ij}, x_{ik}) . \quad (6.4)
    \)

    ```


    In essence, (6.4) measures the fraction of variance of \(\bar{f}_{jk}(x_j, x_k)\)—the
    joint partial dependence of \(y\) on \(x_j\) and \(x_k\)—not captured by \(\bar{f}_j(x_j)\)
    and \(\bar{f}_k(x_k)\) (the individual partial dependence of \(y\) on \(x_j\)
    and \(x_k\), respectively) over the training data (or representative sample thereof).
    Note that \(H^2_{jk} \ge 0\), with zero indicating no interaction between \(x_j\)
    and \(x_k\). To determine whether a single predictor, \(x_j\), say, interacts
    with any other variables, a similar \(H\)-statistic can be computed. Unfortunately,
    these statistics are not widely implemented; the R `gbm` package [Greenwell et
    al., 2021b], probably has the most efficient implementation (see `?gbm::interact.gbm`
    for details), but it''s only available for GBMs (Chapter 8).


    According to Friedman and Popescu [2008], only predictors with strong main effects
    (e.g., high relative importance) should be examined for potential interactions;
    the strongest interactions can then be further explored via two-way PD plots.
    Be warned, however, that collinearity among predictors can lead to spurious interactions
    that are not present in the target function.


    A major drawback of the \(H\)-statistic (6.4) is that it requires computing both
    the individual and joint partial dependence functions, which can be expensive;
    the fast recursion method of Section 8.6.1 makes it feasible to compute the \(H\)-statistic
    for binary decision trees (and ensembles of shallow trees). A simpler approach,
    based on just the joint partial dependence function, is discussed in Greenwell
    et al. [2018].


    # 6.2.3 Individual conditional expectations


    PD plots can be misleading in the presence of strong interaction effects [Goldstein
    et al., 2015] (akin to interpreting a main effect in a linear model that''s'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'also involved in an interaction term). To overcome this issue, Goldstein, Kapelner,
    Bleich, and Pitkin developed the concept of individual conditional expectation
    (ICE) plots. ICE plots display the estimated relationship between the response
    and a predictor of interest for each observation. Consequently, the PD plot for
    a predictor of interest can be obtained by averaging the corresponding ICE plots
    across all observations.


    As described in [Goldstein et al., 2015], when the individual curves have a wide
    range of intercepts and consequently overlay each other, heterogeneity in the
    model can be difficult to discern. For that reason, Goldstein, Kapelner, Bleich,
    and Pitkin suggest centering the ICE plots to produce a centered ICE plot (or
    c-ICE plot for short). They also suggest other modifications, like derivative
    ICE plots (or d-ICE plots), to further explore the presence of interaction effects.
    Centered ICE plots are obtained after shifting the ICE curves up or down by subtracting
    off the first value from each curve, effectively pinching them together at the
    beginning.


    # 6.2.4 Software


    PD plots and ICE plots (and many variants thereof) are implemented in several
    R packages. Historically, PD plots were only implemented in specific tree-based
    ensemble packages, like randomForest [Breiman et al., 2018] and gbm. However,
    they were made generally available in package pdp, which was soon followed by
    iml and ingredients, among others; these packages also support ICE plots; the
    R package ICEbox [Goldstein et al., 2017] provides the original implementation
    of ICE plots and several variants thereof, like c-ICE and d-ICE plots. PD plots
    and ICE plots were also made available in scikit-learn''s inspection module, starting
    with versions 0.22.0 and 0.24.0, respectively.


    # 6.2.5 Example: predicting home prices


    Using the Ames housing bagged tree ensemble, I''ll show how to construct PD plots
    and ICE curves by hand and using the pdp package. To start, let''s construct a
    PD plot for above grade square footage (Gr_Liv_Area), one of the top predictors
    according to permutation-based VI scores from Figure 6.1 (p. 207).


    The first step is to create a grid of points over which to construct the plot.
    For continuous variables, it is sufficient to use a fine enough grid of percentiles,
    as is done in the example below. Then, I simply loop through each grid point and
    1) copy the training data, 2) replace all the values of Gr_Liv_Area in the copy
    with the current grid value, and 3) score the modified copy of the training data
    and average the predictions together. Lastly, I simply plot the grid points'
