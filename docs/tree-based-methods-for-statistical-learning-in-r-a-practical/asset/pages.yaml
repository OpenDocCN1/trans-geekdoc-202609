  md: '# 4.2.3.2 Bootstrap bias correction


    It is difficult to achieve unbiased split variable selection in regression trees
    that employ regression models in the nodes because the predictors can be used
    for splitting, referred to as a “split” variable, or as a regressor in the models,
    where it’s referred to as a “fit” variable [Loh, 2014].


    When non-constant models are fit to the nodes, the split variable selection procedure
    in GUIDE is heavily biased towards the _c_- and _s_-variables. This is because
    the _n_-variables, which are used for both splitting and as regressors, are uncorrelated
    with the resulting residuals (a property of _ordinary least squares_).


    Loh [2002, Algorithm 5] proposed a bootstrap calibration procedure to help correct
    the split variable selection bias in this situation. I’ll omit the details, but
    the basic idea is to shrink the _p_-values associated with the chi-square tests
    for the _n_-variables.


    # 4.3 A GUIDE for classification


    GUIDE for classification is not that different from its regression counterpart.
    Instead of residuals, the categorical outcome is used directly in the chi-square
    tests for split variable selection. Also, once a splitting variable, say _x_<sup>∗</sup>,
    is selected, the optimal split point is found using an exhaustive search, similar
    to CART’s approach based on a weighted sum of Gini impurities (see Section 2.2.1).


    # 4.3.1 Linear/oblique splits


    Although orthogonal (or binary) splits are more interpretable, Loh [2009] makes
    a compelling case for splits based on linear combinations of predictors (which
    are referred to as either _linear splits_ or _oblique splits_, since they are
    no longer orthogonal to the feature axes). An oblique split on two continuous
    features, _x<sub>i</sub>_ and _x<sub>j</sub>_, takes the form _ax<sub>i</sub>_+_bx<sub>j</sub>_≤_c_,
    where _a_, _b_, and _c_ are constants determined from the data; see Loh [2009,
    Sec. 3] for details.'
  merge: -1
  img_proc: true
