    habits die hard. Package names are in bold text (e.g., **rpart**), inline code
    and function names are in typewriter font (e.g., `apply()`), and file names are
    in sans serif font (e.g., path/to/filename.txt). In situations where it may not
    be obvious which package a function belongs to, I''ll use the notation `foo::bar()`,
    where `bar()` is the name of a function in package `foo`.


    I often allude to the documentation and help pages for specific R functions. For
    example, you can view the documentation for function `foo()` in package `bar`
    by typing `?foo::bar` or `help("foo", package = "bar")` at the R console. It''s
    a good idea to read these help pages as they will often provide more useful details,
    further references, and example usage. For base R functions—that is, functions
