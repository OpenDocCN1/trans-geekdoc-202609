  md: "![](img/2c227bfb3620dc3d159fa5e6598afa30_305_0.png)\n\nFIGURE 7.23: Boxplot\
    \ of variable importance scores across all $m = 21$ RF fits.\n\npredictor of survivability\
    \ in these models, followed by passenger class (`pclass`) and passenger age (`age`).\
    \ The remaining features are comparatively less important, with no discernible\
    \ difference between the number of siblings/spouses aboard (codesibsp) and the\
    \ number of parents/children aboard (`parch`).\n\nIt's natural to look at feature\
    \ effect plots after examining the importance of each variable (i.e., main effects).\
    \ A common feature effect plot is the partial dependence plot (Section 6.2.1),\
    \ or PD plot for short. Following a similar strategy, we can compute the partial\
    \ dependence for each feature across all $m = 21$ fitted RFs, and display the\
    \ results on the same graph.\n\nThe code snippets below rely on the `pdp` package\
    \ for constructing each partial dependence curve; for details, see Greenwell [2021b].\
    \ To start, I define a simple prediction wrapper for extracting predictions from\
    \ a fitted `ranger` model; see `?ranger::predict.ranger` for details on computing\
    \ and extracting predictions from a `\"ranger\"` object. Note that PD plots are\
    \ essentially constructed from averaged predictions, so the function below returns\
    \ the average predicted probability of survival:\n\n```\npfun <- function(object,\
    \ newdata) { # mean(prob(survived=1|x))\n  mean(predict(object, data = newdata)$predictions[,\
    \ \"1\"])\n}\n```\n\nSince there are $m = 21$ imputed data sets, I'm essentially\
    \ computing $m = 21$ 3-way PD plots (i.e., visualizing a 3-way interaction effect),\
    \ which can"
