  md: 'handles variable selection, nonlinear relationships, and interactions between
    predictors;


    +   rule-based models, like Certifiable Optimal RuLE ListS [Angelino et al., 2018],
    or CORELS for short, which are very much like decision trees, but with an emphasis
    on producing a small number of simple rules (i.e., short sequences of yes or no
    questions).


    Decision trees remain one of the most flexible and practical tools in the data
    science toolbox, whether for description or prediction. While they are most commonly
    used for prediction problems in an ensemble (see Chapters 5–8), individual decision
    trees are still one of the most useful off-the-shelf analytic tools available
    (e.g., they can be used for missing value imputation, description, and variable
    ranking and selection, to name a few).


    The rest of this book is split into two parts:


    **Part I:** Individual decision trees. Common decision tree algorithms, like CART
    (Chapter 2), CTree (Chapter 3), and GUIDE (Chapter 4), are brought into focus.
    I’ll discuss both the basics and the nitty-gritty details which are often glossed
    over in other texts, or buried in the literature. These algorithms form the building
    blocks upon which many current state-of-the-art prediction algorithms are built.
    Such algorithms are the focus of Part II.


    **Part II:** Decision tree ensembles. While Part I will highlight several useful
    decision tree algorithms, it will become apparent that individual trees rarely
    make good predictors, at least when compared to other popular algorithms, like
    neural networks and random forests (Chapter 7). Fortunately, we can often improve
    their performance by combining the predictions from several hundred or thousand
    individual trees together. There are several ways this can be accomplished, and
    Chapter 5 presents two popular and general strategies: bagging and boosting. Chapters
    7–8 then dive deeper into specialized versions of bagging and boosting, respectively.


    Each chapter contains numerous software examples that help solidify the main concepts,
    typically, only involving minimal package use and developing ideas from scratch.
    Tree-specific software and longer examples, however, are typically reserved for
    the end of each chapter, after the main ideas have been presented.'
