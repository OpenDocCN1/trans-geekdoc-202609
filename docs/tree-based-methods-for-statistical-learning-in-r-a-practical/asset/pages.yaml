  md: 'the issue, GUIDE adopts the same cost-complexity pruning strategy used in CART
    (revisit Section 2.5 for the details). Loh [2002] showed via simulation that pruning
    can reduce the variable selection bias in exhaustive search procedures like CART,
    provided there are no interaction effects.


    # 4.5 Missing values


    GUIDE solves the problem of missing values by assigning missing categorical values
    to a new “missing” category. The same happens to ordered variables during the
    construction of the chi-square tests; their missing values are then mapped back
    to $-\infty$ for split point selection. Hence, the split $x^* \le c$ will always
    send missing values to the left child node. If informative enough, missing values
    can be isolated completely by choosing $c = -\infty$. See Loh et al. [2020] for
    more details and comparisons with other approaches to handling missing values.


    # 4.6 Fitted values and predictions


    For constant fits, the fitted values and predictions are obtained in the same
    way as CART and CTree. For example, if $y$ is continuous, then the average within-node
    response is used. For classification, the within node class proportions can serve
    as predicted class probabilities. For non-constant fits, the fitted values and
    predictions for new observations depend on the model fit to each node (e.g., polynomial
    regression or $k$-nearest neighbor). The latter tend to produce shorter and more
    accurate trees, but are more computationally intensive and less interpretable.


