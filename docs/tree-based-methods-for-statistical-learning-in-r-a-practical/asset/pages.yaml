  md: 'In the following section, I''ll discuss a general way to estimate Shapley values
    for any supervised learning model using a simple Monte Carlo approach.


    # 6.3.2.2 Monte Carlo-based Shapley explanations


    Except in special circumstances, like Tree SHAP, computing the exact Shapley value
    is computationally infeasible in most applications. To that end, Štrumbelj and
    Kononenko [2014] suggest a Monte Carlo approximation, which I''ll call Sample
    SHAP for short, that assumes independent features^c. Their approach is described
    in Algorithm 6.3 below.


    Here, a single estimate of the contribution of feature $x_i$ to $f(x^*) - \bar{f}$
    is nothing more than the difference between two predictions, where each prediction
    is based on a set of “Frankenstein instances”^d that are constructed by swapping
    out values between the instance being explained ($x^*$) and an instance selected
    at random from the training data ($w^*$). To help stabilize the results, the procedure
    is repeated a large number, say, $R$, times, and the results averaged together:


    ```

    Algorithm 6.3 Approximating the $i$-th feature''s contribution to $\hat{f}(x^*)$
    for some instance with predictor values $x^* = (x_1, x_2, \dots, x_p)$.


    1) For $j = 1, 2, \dots, R$:


    (a) Select a random permutation $\mathcal{O}$ of the sequence $1, 2, \dots, p$.


    (b) Select a random instance $w$ from the set of training observations $X$.


    (c) Construct two new instances as follows:


    * $b_1 = x^*$, but all the features in $\mathcal{O}$ that appear after feature
    $x_i$ get their values swapped with the corresponding values in $w$.


    * $b_2 = x^*$, but feature $x_i$, as well as all the features in $\mathcal{O}$
    that appear after $x_i$, get their values swapped with the corresponding values
    in $w$.


    (d) $\phi_{ij}(x^*) = f(b_1) - f(b_2)$.


    2) $\phi_i(x^*) = \frac{1}{R} \sum_{j=1}^R \phi_{ij}(x^*)$.

    ```'
  merge: -1
  img_proc: true
