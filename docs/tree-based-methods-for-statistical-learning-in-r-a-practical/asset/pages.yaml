  md: "package and split the observations into train/test sets using the same 70/30\
    \ split as before:\n\n```\ndata(spam, package = \"kernlab\")\nset.seed(852) #\
    \ for reproducibility\nid <- sample.int(nrow(spam), size = floor(0.7 * nrow(spam)))\n\
    spam.trn <- spam[id, ] # training data\nspam.tst <- spam[-id, ] # test data\n\
    ```\n\nRather than writing our own bagger function, I'll construct a bagged tree\
    \ ensemble using a basic for loop that stores the individual trees in a list called\
    \ spam.bag. Note that I turn off cross-validation (xval = 0) when calling rpart()\
    \ to save on computing time. The code is shown below.\n\n```\nlibrary(rpart)\n\
    \nB <- 500 # number of trees in ensemble\nctrl <- rpart.control(minsplit = 2,\
    \ cp = 0, xval = 0)\nN <- nrow(spam.trn) # number of training observations\nspam.bag\
    \ <- vector(\"list\", length = B) # to store trees\nset.seed(900) # for reproducibility\n\
    for (b in seq_len(B)) { # fit trees to independent bootstrap samples\n  boot.id\
    \ <- sample.int(N, size = N, replace = TRUE)\n  boot.df <- spam.trn[boot.id, ]\
    \ # bootstrap sample\n  spam.bag[[b]] <- rpart(type ~ ., data = boot.df, control\
    \ = ctrl)\n}\n```\n\nNow that we have the individual trees, each of which was\
    \ fit to a different bootstrap sample from the training data, we can obtain predictions\
    \ and assess the performance of the ensemble using the test sample set. To that\
    \ end, I'll loop through each tree to obtain predictions on the test set (spam.tst),\
    \ and store the results in an N x B matrix, one column for each tree in the ensemble.\
    \ I then compute the test error as a function of B by cumulatively aggregating\
    \ the predictions from trees 1 through B by means of voting (e.g., if we are computing\
    \ the bagged prediction using only the first three trees, the final prediction\
    \ for each observation will simply be the the class with the most votes across\
    \ the three trees).\n\nTo help with the computations, I'll write two small helper\
    \ functions, vote() and err(), for carrying out the voting and computing the misclassification\
    \ error, respectively:\n\n```\nvote <- function(x) names(which.max(table(x)))\n\
    err <- function(pred, obs) 1 - sum(diag(table(pred, obs))) /\n  length(obs)\n\
    ```\n\nNext, I obtain the N x B matrix of predictions and cumulatively aggregate\
    \ them across all the trees in the ensemble to compute the test error as a function\
    \ of the number of trees:"
