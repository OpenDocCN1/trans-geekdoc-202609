  md: '# Chapter 4: Generalized, unbiased, interaction detection, and estimation (GUIDE).


    GUIDE itself has a rather long and interesting history, and evolved out of several
    earlier well-known tree algorithms—like QUEST [Loh and Shih, 1997] and CRUISE
    [Kim and Loh, 2001]j. If you''re interested in a more thorough overview of the
    history of tree-based algorithms, I highly encourage you to read Loh [2014].


    # 1.2.2 The anatomy of a simple decision tree


    In this section, I''ll look at the basic parts of a typical decision tree (perhaps
    tree topology would''ve been a cooler section header).


    A typical (binary) decision tree is displayed in Figure 1.3. The tree is made
    up of nodes and branches; the path between two consecutive branches is called
    an edge. The nodes are the points at which a branch occurs. Here, we have three
    internal nodes, labeled I1, I2, and I3, and five terminal (or leaf) nodes, labeled
    L1, L2, L3, L4, and L5. The tree is binary because it only uses two-way splits;
    that is, at each node, a split results in only two branches, labeled “Yes” and
    “No”k. The path taken at each internal node depends on whether or not the corresponding
    split condition is satisfied. For example, an observation with x1 = 0.33 and x5
    = 1.19 would find itself in terminal node L2, regardless of the values of the
    other predictors.


    The split conditions (or just splits) for an ordered predictor x have the form
    x < c vs. x ≥ c, where c is in the domain of x (typically the midpoint between
    two consecutive x values in the learning sample); note that the same type of splits
    are used for ordered factors since we just need to preserve the natural ordering
    of the categories (e.g., x < medium vs. x ≥ medium)l. Splits on (unordered) categorical
    variables have the form x ∈ S1 vs. x ∈ S2, where S = S1 ∪ S2 is the full set of
    unique categories in x.


    Each tree begins with a root node containing the entire learning sample. Starting
    with the root node, the training data are split into two non-overlapping groups,
    one going left, and the other right, depending on whether or not the first split
    condition is satisfied by each observation. The process is repeated on each subgroup
    (or child node) until each observation reaches a terminal node.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'At each node in a tree, we can compute several quantities that may be of interest,
    for example:


    +   - the number (or fraction) of observations from the learning sample in that
    node;

    +   - for classification models, the number of observations classified correctly
    (or incorrectly) in that node (as determined by the majority class in that node).

    +   - for probabilistic models, the proportion of observations in that node belonging
    to each class;

    +   - the current fitted or predicted value if this were a leaf or terminal node
    (e.g., the mean response or class proportions).


    The terminal nodes themselves are usually characterized by a statistical summary
    of the training response values in each, like the sample mean for regression,
    a frequency table for classification, or the Kaplan-Meier estimator/curve for
    censored outcomes (see the example in Section 1.4.9). These summaries can be used
    to produce fitted values and predictions for new observations". For example, if
    the response is continuous (i.e., a regression tree), then new observations that
    occupy a terminal node might be assigned a predicted value equal to the mean response
    of the training observations defining that node.


    # 1.2.2.1 Example: survival on the Titanic


    To further illustrate, let''s look at the tree diagram in Figure 1.4. This CART-like
    decision tree was constructed using the well-known Titanic data set and is trying
    to separate passengers who survived from those who didn''t using readily available
    information about each. The data, which I''ll revisit in Section 7.9.3, contain
    N = 1,309 observations (i.e., passengers) on the following six variables:


    +   - survived: binary indicator of passenger survival (the response);

    +   - pclass: integer specifying passenger class (i.e., 1–3);

    +   - age: passenger age in years;

    +   - sex: factor giving the sex of each passenger (i.e., male/female);

    +   - sibsp: integer specifying the number of siblings/spouses aboard;

    +   - parch: integer specifying the number of parents/children aboard.


    The variable pclass is commonly treated as nominal/categorical, but here the natural
    ordering has been taken into account. The tree split the passengers into six relatively
    homogeneous groups (terminal nodes) based on four of the above'
