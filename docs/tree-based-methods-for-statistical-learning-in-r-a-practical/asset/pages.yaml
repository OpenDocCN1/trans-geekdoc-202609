  md: "# Algorithm 8.1 Vanilla gradient tree boosting algorithm.\n\n+   1) Initialize\
    \ $f_0(\\boldsymbol{x}) = \\arg \\min_\\theta \\sum_{i=1}^N L(y_i, \\theta)$ (a\
    \ constant).\n\n+   2) For $b$ in $1, \\dots, B$ do the following:\n\n+   a) Compute\
    \ the negative gradient, evaluated at the training data, to be used as the current\
    \ working response\n+   \n+   $y_{ib}^* = - \\left[ \\frac{\\partial L(y_i, f(\\\
    boldsymbol{x}_i))}{\\partial f(\\boldsymbol{x}_i)} \\right]_{f(\\boldsymbol{x}_i)=f_{b-1}(\\\
    boldsymbol{x}_i)}, \\quad i=1, 2, \\dots, N.$\n\n+   b) Fit a regression tree\
    \ with $J_b$ terminal node regions using CART's level-wise tree growing strategy:\
    \ $R_{jb}, j=1, 2, \\dots, J_b$.\n\n+   c) Update the terminal node predictions\
    \ using\n+   \n+   \\(\\gamma_{jb} = \\arg \\min_\\gamma \\sum_{\\boldsymbol{x}_i\
    \ \\in R_{jb}} L(y_i, f_{b-1}(\\boldsymbol{x}_i) + \\gamma), \\quad j=1, 2, \\\
    dots, J_b.\\)\n\n+   d) Update $f_b(\\boldsymbol{x})$ as\n+   \n+   \\(f_b(\\\
    boldsymbol{x}) \\leftarrow f_{b-1}(\\boldsymbol{x}) + \\sum_{j=1}^{J_b} \\gamma_{jb}\
    \ I(\\boldsymbol{x} \\in R_{jb}).\\)\n\n+   3) Return \\(\\widehat{f}(\\boldsymbol{x})\
    \ = f_B(\\boldsymbol{x})\\).\n\nConsequently, there is little need to be concerned\
    \ with transformations of the features in most tree-based ensembles. For outcomes\
