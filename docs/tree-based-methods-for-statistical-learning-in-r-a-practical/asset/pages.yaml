    # 7.8.5.1 Extended isolation forests


    An *extended isolation forest* [Hariiri et al., 2021] improves the consistency
    and reliability of the anomaly score produced by a standard isolation forest by
    using random oblique splits (in this case, hyperplanes with random slopes)—as
    opposed to axis-oriented splits—which often results in improved anomaly scores.
    The tree in Figure 7.17 is from an extended isolation forest fit using the **eif**
    package [Hariiri et al., 2021], which is also available in R.


    # 7.8.5.2 Example: detecting credit card fraud


