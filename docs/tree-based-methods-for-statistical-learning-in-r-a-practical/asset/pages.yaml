    # 3.4.6 Fitted values and predictions


    For univariate regression and classification trees, fitted values and predictions
    are obtained in the same manner as they are in CART. For example, the within-terminal
    node class proportions can be used for class probability estimates. For regression,
    the within-terminal node sample mean of the response values can be used as the
    fitted values or for predicting new observations.


    However, CTree is quite flexible and can handle many other situations beyond simple
    classification and regression. With censored outcomes, for example, each terminal
    node can be summarized using the Kaplan-Meier estimator; see Section 3.5.3. The
    median survival time can be used for making predictions.


    # 3.4.7 Imbalanced classes


    Unlike CART, CTree cannot explicitly take into account prior class probabilities,
    nor can it account for unequal misclassification costs. However, it can assign
    increased weight to specific observations (for brevity, I omitted the case'
  merge: -1
