  md: '![](img/2c227bfb3620dc3d159fa5e6598afa30_200_0.png)


    FIGURE 5.2: A simple schematic of the process for building a bagged tree ensemble
    with four trees.


    # 5.1.1 When does bagging work?


    In general, bagging helps to improve the accuracy of unstable procedures that
    are adaptive, nonlinear functions of the training data [Breiman, 1996a]. Let \(\widehat{f}\)
    represent an individual model (e.g., a single decision tree) trained to the learning
    sample and \(\widehat{f}_B\) represent a bagged ensemble thereof. Specifically,
    if small changes in \(d_{trn}\) lead to small changes in \(\widehat{f}\), then
    \(\widehat{f}_B \approx \widehat{f}\) and not much is gained in terms of improvement.
    On the other hand, if small changes in \(d_{trn}\) lead to large changes in \(\widehat{f}\),
    then \(\widehat{f}_B\) will often be an improvement over \(\widehat{f}\). In the
    latter case, we often call \(\widehat{f}\) an unstable model. Breiman [1996b]
    noted that algorithms like neural networks, CART, and subset selection in linear
    regression were unstable, while algorithms like \(k\)-nearest neighbor methods
    were stable; the MARSProcedure [Friedman, 1991], an extension of CART, can also
    be considered as unstable predictors and therefore potentially benefit from bagging).


    Unpruned CART-like decision trees are particularly unstable predictors; that is,
    the tree structure will often vary heavily from one sample to the next. Hence,
    bagging is often most successful when applied to unpruned decision trees that
    have been grown to maximal (or near maximal) depth.


    # 5.1.2 Bagging from scratch: classifying email spam


    To illustrate, let’s return to the email spam example first introduced in Section
    1.4.5. In the code snippet below, we load the data from the kernlab'
