- pgno: 203
  md: '# 5.1.3 Sampling without replacement


    Inducing trees from independent learning sets that are bootstrap samples from
    the original training data imitates the process of building trees on independent
    samples of size N from the true underlying population of interest. While bagging
    traditionally utilizes bootstrap sampling (i.e., sampling with replacement) for
    training the individual base learners, it can sometimes be advantageous to use
    subsampling without replacement; Breiman [1999] referred to this as pasting. In
    particular, if N is “large enough,” then bagging using random subsamples of size
    N/2 (i.e., sampling without replacement) can be an effective alternative to bagging
    based on the bootstrap [Friedman and Hall, 2007]. Strobl et al. [2007b] suggest
    using a subsample size of 0.632 times the original sample size N—because in bootstrap
    sampling about 63.2% of the original observations end up in any particular bootstrap
    sample.


    This is quite fortunate since sampling half the data without replacement is much
    more efficient and can dramatically speed up the bagging process. Applying this
    to the email spam data from the previous section, which only required modifying
    one line of code in the previous example, resulted in a minimum test error of
    5.21%, quite comparable to the previous results using the bootstrap but much faster
    to train.


    Another reason why subsampling can sometimes improve the performance of bagging
    is through “de-correlation.” Recall that bagging can improve the performance of
    unstable learners through variance reduction. As discussed in more detail in Section
    7.2, correlation limits the variance-reducing effect of averaging. The problem
    here is that the trees in a bagged ensemble will often be correlated since they
    are all induced off of bootstrap samples from the same training set (i.e., they
    will share similar splits and structure, to some degree). Using subsamples of
    size N/2 will help to de-correlate the trees which can further reduce variance,
    resulting in improved generalization performance. A more effective strategy to
    de-correlate trees in a bagged ensemble is discussed in Section 7.2.


    # 5.1.4 Hyperparameters and tuning


    Bagged tree ensembles are convenient because they don’t require much tuning. That’s
    not to say that you can’t improve performance by tuning some of the tree parameters
    (e.g., tree depth). However, in contrast to gradient tree boosting (Chapter 8),
    increasing the number of trees (B) does not necessarily lead to overfitting (see
    Figure 5.4 on page 193), and isn’t really a tuning parameter—although, computation
    time increases with B, so it can be advantageous to monitor performance on a validation
    set to determine when performance has plateaued or reached a point of diminishing
    return.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 5.1.5 Software


    Bagging is rather straightforward to implement directly, as is seen in this chapter.
    Nonetheless, several R packages exist which can be used to implement Algorithm
    5.1. The R package ipred [Peters and Hothorn, 2021], which stands for improved
    predictors, implements bagged decision trees using the rpart package and supports
    classification, regression, and survival problems. The R package adabag [Alfaro
    et al., 2018] also implements bagging via rpart, but only supports classification
    problems. In Python, bagging is implemented in scikit-learn''s sklearn.ensemble
    module and can be applied to any base estimator (i.e., not just decision trees).


    In general, I think it''s more efficient to use random forest software to implement
    bagging, especially in R. This is because random forest software typically builds
    the entire ensemble using highly efficient and compiled code, whereas ipred, for
    example, utilizes existing tree software and builds the ensemble in a way similar
    to what we did in the email spam example. A regression example using random forest
    software to implement bagging is given in Section 5.5. Random forest is the topic
    of Chapter 7.


    # 5.2 Boosting


    Recall that bagging reduces variance by averaging several unstable learners together.
    Boosting, on the other hand, was originally devised for binary classification
    problems as a way to boost the performance of weak learners—a model that only
    does slightly better than the majority vote classifier (i.e., a model that always
    predicts the majority class in the learning sample). So how does boosting improve
    the performance of a weak learner? The basic idea is quite intuitive: fit models
    in a sequential manner, where each model in the sequence is fit on a resampled
    version of the training data that gives more weight to the observations that were
    previously misclassified, hence, “boosting” the performance of the previous models.
    Each successive model in a boosting sequence effectively homes in on the rows
    of data where the previous model had the largest errors.


    Several different flavors of boosting exist, and the procedure has evolved quite
    a bit since its initial inception for binary classification. In the following
    section, I’ll discuss one of the earliest and most popular flavors of boosting
    for binary classification: AdaBoost.M1 [Freund and Schapire, 1996]. It’s important
    to call out that AdaBoost.M1, along with its many variants, assumes that the base
    learners (in our case, binary classification trees) can incorporate case'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'weights. A more general (and flexible) boosting strategy will be covered in
    Chapter 8.


    # 5.2.1 AdaBoost.M1 for binary outcomes


    AdaBoost.M1—also referred to as *Discrete AdaBoost* in Friedman et al. [2000]
    due to the fact that the base learners each return a discrete class label—fits
    an additive model of the form


    ```

    C(\boldsymbol{x}) = \text{sign} \left( \sum_{b=1}^B \alpha_b C_b(\boldsymbol{x})
    \right)

    ```


    where \(\{\alpha_b\}_{b=1}^B\) are coefficients that weight the contribution of
    each respective base learner \(C_b(\boldsymbol{x})\) and


    ```

    \text{sign}(x) = \begin{cases} +1 & \text{if } x > 0 \\ -1 & \text{if } x < 0
    \\ 0 & \text{otherwise} \end{cases}

    ```


    In essence, classifiers in the sequence with higher accuracy receive more weight
    and therefore have more influence on the final classification \(C(\boldsymbol{x})\).


    The details of AdaBoost.M1 are given in Algorithm 5.2. The crux of the idea is
    this: start with an initial classifier built from the training data using equal
    case weights \(\{w_i = 1/N\}_{i=1}^N\), then increase \(w_i\) for those cases
    that have been most frequently misclassified. The process is continued a fixed
    number of times (\(B\)).


    Like bagging, boosting is a *meta-algorithm* that can be applied to any type of
    model, but it’s often most successfully applied to shallow decision trees (i.e.,
    decision trees with relatively few splits/terminal nodes). While bagging relies
    upon aggregating the results from several unstable learners, boosting tends to
    benefit from sequentially improving the performance of a weak learner (like a
    simple decision stump). In the next section, I’ll code up Algorithm 5.2 and apply
    it to the email spam data for comparison with the previously obtained bagged tree
    ensemble.


    While AdaBoost.M1 was one of the most accurate classifiers at the time\(^c\),
    the fact that it only produced a classification was a severe limitation. To that
    end, Friedman et al. [2000] generalized the AdaBoost.M1 algorithm so that the
    weak learners return a class probability estimate, as opposed to a discrete class


    \(^c\)In fact, shortly after its introduction, Leo Breiman referred to AdaBoost
    as the “...best off-the-shelf classifier in the world.”'
  merge: -1
  img_proc: true
- pgno: 206
  md: "# Algorithm 5.2 Vanilla AdaBoost.M1 algorithm for binary classification.\n\n\
    +   1) Initialize case weights \\(\\{w_i = 1/N\\}_{i=1}^N\\).\n+   \n+   2) For\
    \ \\(b = 1, 2, \\dots, B\\):\n+   \n+   a) Fit a classifier \\(C_b(\\boldsymbol{x})\\\
    ) to the training observations using case weights \\(w_i\\).\n+   \n+   b) Compute\
    \ the weighted misclassification error\n+   \\[\n+   err_b = \\frac{\\sum_{i=1}^N\
    \ w_i I(y_i \\neq C_b(\\boldsymbol{x}))}{\\sum_{i=1}^N}.\n+   \\]\n+   \n+   c)\
    \ Compute \\(\\alpha_b = \\log(1/err_b - 1)\\).\n+   \n+   d) Update case weights:\
    \ \\(\\{w_i \\leftarrow \\exp[\\alpha_b I(y_i \\neq C_b(\\boldsymbol{x}))]\\}_{i=1}^N\\\
    ).\n+   \n+   3) Return the weighted majority vote: \\(C(\\boldsymbol{x}) = \\\
    text{sign}\\left(\\sum_{b=1}^B \\alpha_b C_b(\\boldsymbol{x})\\right)\\)\n\nlabel;\
    \ the contribution to the final classifier is half the logit-transform of this\
    \ probability estimate. They refer to this procedure as Real AdaBoost. Other generalizations\
    \ (e.g., to multi-class outcomes) also exist. In Chapter 8, I’ll discuss a much\
    \ more flexible flavor of boosting, called stochastic gradient tree boosting,\
    \ which can naturally handle general outcome types (e.g., continuous, binary,\
    \ Poisson counts, censored, etc.).\n\n# 5.2.2 Boosting from scratch: classifying\
    \ email spam\n\nTo illustrate, let’s apply AdaBoost.M1 (Algorithm 5.2) to the\
    \ email spam data and show how it “boosts” the performance of an individual rpart\
    \ tree; I’ll continue with the same train/test splits from the previous example\
    \ in Section 5.1.2. For this example, I’ll use \\(B = 500\\) depth-10 decision\
    \ trees. Since AdaBoost.M1 requires \\(y \\in \\{-1, +1\\}\\), I’ll re-code the\
    \ response (type) so that type = \"spam\" corresponds to \\(y = +1\\):\n\n```\n\
    spam.trn$type <- ifelse(spam.trn$type == \"spam\", 1, -1)\nspam.tst$type <- ifelse(spam.tst$type\
    \ == \"spam\", 1, -1)\nspam.xtrn <- subset(spam.trn, select = -type)  # feature\
    \ columns only\nspam.xtst <- subset(spam.tst, select = -type)  # feature columns\
    \ only\n```\n\nFollowing the previous example on bagging, I’ll use a simple for\
    \ loop and list() to sequentially construct and and store the fitted trees, respectively."
