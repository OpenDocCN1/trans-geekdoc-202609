  md: '# 3.3 A quick digression into conditional inference


    This section offers a quick detour into the essentials of a general framework
    for conditional inference procedures commonly known as *permutation tests*; our
    discussion follows closely with Hothorn et al. [2006b]a, which is based on the
    theoretical results derived by Strasser and Weber [1999] for a special class of
    *linear statistics*. For a more traditional take on (nonparametric) permutation
    tests, see, for example, Davison and Hinkley [1997, Sec. 4.3].


    Suppose $\{(X_i, Y_i)\}_{i=1}^N$ are a random sample from some population of interest,
    where $X$ and $Y$ are from sample spaces $\mathcal{X}$ and $\mathcal{Y}$, respectively,
    which may be multivariate (hence the **bold** notation) and measured at arbitrary
    scales (e.g., ordinal, nominal, continuous, etc.). Our primary interest is in
    testing the null hypothesis of independence between $X$ and $Y$, namely,


    $H_0 : D(Y|X) = D(Y)$,


    where $D()$ is the distribution function for $Y$.


    There are a number of ways to carry out such a test. For example, if $X$ and $Y$
    are both $N \times 1$ continuous variables, then a simple correlation test based
    on the Pearson correlation coefficient, or Spearman''s $\rho$, can be used. If
    $X$ and $Y$ are both $N \times 1$ nominal categorical variables, then a simple
    chi-square test is appropriate. And so on.


    It would be rather convenient to have a standard approach to testing $H_0$, regardless
    of the shape or scale of $X$ and $Y$. To that end, Strasser and Weber [1999] suggest
    using a linear statistic of the general form


    $T = \text{vec} \left( \sum_{i=1}^N g(X_i) h(Y_i)^\top \right) \in \mathbb{R}^{pq
    \times 1}, \quad (3.1)$


    where $\text{vec}()$ is the *matrix vectorization operator* that I''ll explain
    in the examples that follow, $g : \mathcal{X} \to \mathbb{R}^{p \times 1}$ is
    a transformation function specifying a possible transformation of the $X$ values,
    and $h : \mathcal{Y} \to \mathbb{R}^{q \times 1}$ is called the *influence function*
    and specifies a possible transformation to the $Y$ values. Appropriate choices
    for $g()$ and $h()$ allow us to perform general tests of independence, including:'
