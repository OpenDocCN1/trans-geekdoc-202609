  md: 'where, for example, $SSE_A = \sum_{i=1}^{N_A} (y_i - \bar{y})$ is the SSE within
    node $A$; recall that $N_A$ is the number of training records in node $A$. This
    is equivalent to choosing the split that maximizes the between-groups sum-of-squares
    in an *analysis of variance* (ANOVA); in fact, in **rpart**, this split rule is
    referred to as the "anova" method (see `?rpart::rpart`). Note the similarities
    and differences between Equations (2.3) and (2.6).


    To speed up the search for the best split, open source implementations, like **rpart**
    and scikit-learn''s **sklearn.tree** module, do not directly search for splits
    that maximize (2.6) directly, but rather an equivalent proxy that''s more efficient
    to compute. For example, it can be shown that


    $SSE_A = SSE_{A_L} + SSE_{A_R} + \frac{N_{A_L}N_{A_R}}{N_A} (\bar{y}_L - \bar{y}_R)^2,
    \quad (2.7)$


    where $\bar{y}_L$ and $\bar{y}_R$ give the sample mean for the left and right
    child nodes of $A$, respectively. This implies that maximizing (2.6) is equivalent
    to maximizing the last term in (2.7), which makes sense, since we want the child
    nodes to be as different as possible (i.e., a greater difference in the mean responses).


    In the regression case, we don''t have to worry about priors or node probabilities.
    The terminal nodes are summarized by the mean response in each (the sample median
    is another possibility), and these are used for producing fitted values and predictions.
    For example, if a new observation $\mathbf{x}$ were to occupy some node terminal
    node $A$, then $\hat{f}(\mathbf{x}) = \sum_{i=1}^{N_A} y_{i,A} / N_A$, where $y_{i,A}$
    denotes the $i$-th response value from the learning sample that resides in terminal
    node $A$.


    Aside from being useful in their own right, regression trees, as presented here,
    serve as the basic building blocks for *gradient tree boosting* (Chapter 8), one
    of the most powerful tree-based ensemble algorithms available.


