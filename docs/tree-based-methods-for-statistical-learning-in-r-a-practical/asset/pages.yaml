- pgno: 242
  md: 'are highly misleading. For example, the standard approach to computing permutation-based
    VI scores involves independently permuting individual features. This implicitly
    makes the assumption that the observed features are statistically independent.
    In practice, however, features are often not independent which can lead to nonsensical
    VI scores. One way to mitigate this issue is to use the conditional approach described
    in Strobl et al. [2008b]; Hooker et al. [2019] provides additional alternatives,
    such as permute-and-relearn importance. Unfortunately, to the best of my knowledge,
    this approach is not yet available for general purposes. A similar modification
    can be applied to PD plots [Parr and Wilson, 2019].


    I already mentioned that PD plots can be misleading in the presence of strong
    interaction effects. As discussed earlier, this can be mitigated by using ICE
    plots instead. Another alternative would be to use accumulated local effect (ALE)
    plots [Apley and Zhu, 2020]. Compared to PD plots, ALE plots have the advantage
    of being faster to compute and less affected by strong dependencies among the
    features. The downside, however, is that ALE plots are more complicated to implement.
    ALE plots are available in the ALEPlot [Apley, 2018] and iml packages in R.


    Hooker [2007] also argues that feature importance (which concerns only main effects)
    can be misleading in high dimensional settings, especially when there are strong
    dependencies and interaction effects among the features, and suggests an approach
    based on a generalized functional ANOVA decomposition—though, to my knowledge,
    this approach is not widely implemented in open source software.


    # 6.5 Final thoughts


    IML is on the rise, and so is IML-related open source software. There are simply
    too many methods and useful packages to discuss in one chapter, so I only just
    covered a handful. If you’re looking for more, I’d recommend starting with the
    IML awesome list hosted by Patrick Hall at


    https://github.com/jphall663/awesome-machine-learning-interpretability.'
