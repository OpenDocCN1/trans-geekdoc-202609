    # ## 7.2.2 Subsampling (without replacement)


    While a traditional RF (Algorithm 7.1) uses bootstrap sampling (i.e., sample with
    replacement), it can be useful to subsample the training data without replacement,
    prior to constructing each tree. This was noted in Section 5.1.3 for bagged tree
    ensembles, and that discussion equally applies to RFs as well. Furthermore, as
    I''ll discuss in Section 7.5, subsampling with replacement can help eliminate
    certain bias in computing predictor importance, resulting in variable importance
    scores that can be used reliably for variable selection even in situations where
    the potential predictors vary in their scale of measurement or their number of
    categories. Most RF software includes the option to use subsampling with or without
    replacement.'
