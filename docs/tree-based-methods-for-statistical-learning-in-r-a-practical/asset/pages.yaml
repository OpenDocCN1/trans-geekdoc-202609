    You can change any of these parameters via `rpart()`''s `control` argument, or
    by passing them directly to `rpart()` via the ... (pronounced dot-dot-dot) argument.
    For example, the two calls to `rpart()` below are equivalent. Each one fits a
    classification tree but changes the default complexity parameter from 0.01 to
    0 (`cp = 0`) and the number of internal cross-validations from ten to five (`xval
    = 5`); see `?rpart::rpart.control` for further details about all the configurable
    parameters.


    ```

    ctrl <- rpart.control(cp = 0, xval = 5) # can also be a names list

    tree <- rpart(Edibility ~ ., data = mushroom, control = ctrl)

    tree <- rpart(Edibility ~ ., data = mushroom, cp = 0, xval = 5)

    ```


    Another useful option in `rpart()` is the `parms` argument, which controls how
    nodes are split in the tree; it must be a named list whenever supplied. Below
    we print the `tree$parms` component, which in this case is a list containing the
    class priors, loss matrix, and impurity function used in constructing the tree.


    ```

