  md: '# 8.9 Software and examples


    GBMs are implemented in a number of open source software packages. The original
    implementation of GBMs was called MART(tm), for *multiple additive regression
    trees*n. The R package **gbm** was probably one of the first available open source
    implementations of Friedman''s original GBM algorithm, with extensions to boosting
    likelihood-based models, like exponential family and proportional hazards regression
    models. Another general R package for boosting is **mboost** [Hothorn et al.,
    2021a], which implements boosting for optimizing general risk functions utilizing
    component-wise (penalized) least squares estimates as base-learners for fitting
    various kinds of generalized linear and generalized additive models to potentially
    high-dimensional data (i.e., with **mboost** you can specify different base-learners
    for individual predictors).


    The **sklearn.ensemble** module implements Friedman''s original GBM algorithm
    with some additional optimizations, like early stopping and the option to use
    histogram binning.


    XGBoost, LightGBM, and CatBoost are available in both R and Python, and all three
    support early stopping; the R packages **xgboost** and **lightgbm** are both available
    on CRAN (at least at the time of writing this book). H2O''s implementation of
    GBM also supports early stopping. Several benchmarks [Pafka, 2019, 2021] comparing
    these as well as several other GBM implementations, are available from Szilard
    Pafka at `https://github.com/szilard/GBM-perf`. Check out his other repositories
    on GitHub for fantastic talks on GBMs and other machine learning algorithms and
    their implementations.


    # 8.9.1 Example: Mayo Clinic liver transplant data


    In this example, I''ll return to the PBC data introduced in Section 1.4.9, where
    the goal is to model survival in patients with the autoimmune disease PBC. In
    Section 3.5.3, I fit a CTree model to the randomized subjects using log-rank scores.
    Here, I''ll use the GBM framework to boost a *Cox proportional hazards* (Cox PH)
    model; see Ridgeway [1999] for details.


    The Cox PH model is one of the most widely used models for the analysis of survival
    data. It is a semi-parametric model in the sense that it makes a parametric assumption
    regarding the effect of the predictors on the hazard


