    While **randomForest** is a close port of Breiman’s original Fortran code, the
    **ranger** package is far more scalable and implements a number of modern extensions
    and improvements discussed in this chapter (e.g., RF as a probability machine,
    Gini-corrected importance, quantile regression, case-specific RFs, extra-trees,
    etc.). Another scalable implementation is available from **h2o** [LeDell et al.,
    2021]. RFs are also part of Spark’s MLlib library [Meng et al., 2016], which includes
    several R and Python interfaces (in particular, **SparkR**, **sparklyr**, and
    **pyspark**; an example using **SparkR** is provided in Section 7.9.5).


    In Python, RFs, extra-trees, and isolation forests are available in the **sklearn.ensemble**
    module. Julia users can fit RFs via the **DecisionTree.jl** package. The official
    GUIDE software (Section 4.9) has the option to construct an RF from individual
    GUIDE trees; see Loh et al. [2019] and Loh [2020] for details.


