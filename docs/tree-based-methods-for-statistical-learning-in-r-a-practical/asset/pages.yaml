    Note that this is the same tree that was displayed in Figure 2.2 (p. 43). The
    output from printing an "rpart" object can seem intimidating at first, especially
    for large trees, so let''s take a closer look. The output is split into three
    sections. The first section gives N, the number of rows in the learning sample
    (or root node). The middle section, starting with node), indicates the format
    of the tree structure that follows. The last section, starting at 1), provides
    a a brief summary of the tree structure. All the nodes of the tree are numbered,
    with 1) indicating the root node and lines ending with a * indicating the terminal
    nodes. The topology of the tree is conveyed through indented lines; for example,
    nodes 2) and 3) are nested within 1); the left and right child nodes for any node
    numbered x are always numbered 2x and 2x + 1, respectively.


    For each node we can also see the split that was used, the number of observations
    it captured, the deviance or loss (in this case, the number of observations misclassified
    in that node), the fitted value (in this case, the classification given to observations
    in that node), and the proportion of each class in the node. Take node 2), for
    example. This is a terminal node, the left child of node 1), and contains 88 of
    the N = 200 observations (two of which are genuine banknotes). Any observation
    landing in node 2) will be classified as counterfeit with a predicted probability
    of 0.977.


