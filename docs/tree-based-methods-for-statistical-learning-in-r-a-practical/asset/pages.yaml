- pgno: 164
  md: '# 4.1 Introduction


    GUIDE evolved from earlier tree growing procedures, starting with the *fast and
    accurate classification tree* (FACT) algorithm [Loh and Vanichsetakul, 1988].
    FACT was novel at the time for its use of *linear discriminant analysis* (LDA)
    to find splits based on linear combinations of two predictors. FACT only applies
    to classification problems, and any node based on linear splits is partitioned
    into as many child nodes as there are class labels (i.e., FACT can use multiway
    splits). Split variable selection for continuous variables is based on comparing
    ANOVA-based *F*-statistics; LDA is applied to the variable with the largest *F*-statistic
    to find the optimal split point (i.e., $x \le c$ vs. $x > c$, where $c$ is in
    the domain of $x$) to partition the data. Categorical predictors are converted
    to ordinal variables by using LDA to project their dummy encoded vectors onto
    the largest discriminatory coordinate (also called the *canonical variate* in
    *canonical analysis*); the final splits are expressed back in the form $x \in
    S$, where $S$ is a subset of the categories of $x$. Since FACT depends on ANOVA
    *F*-tests for split variable selection, it is only unbiased if all the predictors
    are ordered (i.e., it is biased towards nominal categorical variables) [Loh, 2014].


    The *quick, unbiased, and efficient statistical tree* (QUEST) procedure [Loh and
    Shih, 1997] improves upon the bias in FACT by using chi-square tests for categorical
    variables (i.e., by forming contingency tables between each categorical variable
    and the response). Like CART, QUEST only permits binary splits. Let $J_t$ be the
    number of response categories in any particular node $t$. Whenever $J_t > 2$,
    QUEST produces binary splits by merging the $J_t$ classes into two *super classes*
    before applying the *F*- and chi-square tests to select a splitting variable.
    The optimal split point for ordered predictors is found using either an exhaustive
    search (like in Chapter 2) or *quadratic discriminant analysis* (QDA). For categorical
    splitting variables, the optimal split point is found in the same way after converting
    the dummy encoded vectors to the largest discriminatory coordinate as in FACT.


    Kim and Loh [2001] introduced the *classification rule with unbiased interaction
    selection and estimation* (CRUISE) algorithm, as a successor to QUEST. In contrast
    to QUEST, however, CRUISE allows multiway splits depending on the number of response
    categories in a particular node. Also, while QUEST uses *F*-tests for ordered
    variables and chi-square tests for nominal, CRUISE uses chi-square tests for both
    after discretizing the ordered variables. For split variable selection, CRUISE
    uses a two-step procedure involving testing both *main effects* and *two-way interactions*
    at each node.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'CRUISE was later succeeded by GUIDE [Loh, 2009]a, which improves upon both
    QUEST and CRUISE by retaining their strengths and fixing their main weaknesses.
    One of the drawbacks of CRUISE is that the number of interaction tests greatly
    outnumbers the number of main effect tests; for example, with k features, there
    are k main effect tests and k (k − 1) pairwise interaction tests. Since most of
    the p-values come from the interaction tests, CRUISE is biased towards selecting
    split variables with potentially weak main effects, relative to the other predictors.
    GUIDE, on the other hand, restricts the number of interaction tests to only those
    predictors whose main effects are significant based on Bonferroni-adjusted p-values.


    The next two sections cover many of the details associated with GUIDE for standard
    regression and classification, respectively; but note that GUIDE has been extended
    to handle several other situations as well (e.g., censored outcomes and longitudinal
    data). In general, GUIDE uses a two-step procedure when selecting the splitting
    variables. Consequently, GUIDE involves many more steps compared to CART (Chapter
    2) and CTree (Chapter 3). The individual steps themselves are not complicated
    (most of them involve transformations of continuous features and what to do when
    interaction tests are significant), but for brevity, I’m only going to cover the
    nitty-gritty details, while pointing to useful references along the way.


    Note that the official GUIDE software—which is freely available, but not open
    source—has evolved quite a lot over the years; the GUIDE program is discussed
    briefly in Section 4.9. Consequently, some of the fine details on the various
    GUIDE algorithms may have changed since their original publications. Any important
    updates are likely to be found in the revision history for the official GUIDE
    software:


    http://pages.stat.wisc.edu/~loh/treeprogs/guide/history.txt.


    If you’re interested in going deeper on GUIDE for regression and classification,
    I encourage you to read Loh [2002] (the official reference to GUIDE for regression),
    Loh [2009] (the official reference to GUIDE for classification), Loh [2011] (an
    updated overview with some comparisons to other tree algorithms), and Loh [2012]
    (variable selection and importance). The current GUIDE software manual is also
    useful and can be obtained from the GUIDE website:


    http://pages.stat.wisc.edu/~loh/guide.html.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 4.2 A GUIDE for regression


    Whether building a classification tree or a regression tree, GUIDE uses chi-square
    tests throughout. This is convenient since chi-square tests are quick to compute,
    and can detect a large variety of patterns (e.g., curvature and interaction effects).
    Consequently, the response and any ordered features must be converted to nominal
    categorical before attempting to split a nodeᵇ. Under the hood, GUIDE treats regression
    problems like a classification problem. In particular, at any node in the tree,
    GUIDE fits a model (e.g., a constant or a linear regression model) to the available
    data and computes the residuals. The sign of the residuals (i.e., positive/negative
    residuals are mapped to +1/−1) is used as a binary response to partition the node.
    In contrast to CART, GUIDE can fit either constant or non-constant fits in the
    terminal nodes. Both strategies are discussed in the sections that follow.


    # 4.2.1 Piecewise constant models


    Using piecewise constant models is equivalent to a standard regression tree, where
    a constant (e.g., the average response value) is used to summarize each terminal
    node. Let \(N_t\) be the number of observations in an arbitrary node \(t\), and
    let \(y_{t,1}, y_{t,2}, \dots, y_{t,N_t}\) be the available response values in
    \(t\). The residuals for node \(t\) are nothing more than the difference between
    the observed response values and their sample mean: \(r_{t,j} = y_{t,j} - \sum_{i=1}^{N_t}
    y_{t,i} / N_t\). The residuals can then be dichotomized at zero using their sign
    to create a new binary response variable in node \(t\):


    ```

    \(y''_{t,j} = \left\{ \begin{array}{ll} 1 & \text{if } r_{t,j} > 0 \\ -1 & \text{if
    } r_{t,j} < 0 \end{array} \right.\)

    ```


    Similarly, at any node \(t\), ordered features (e.g., an ordered categorical or
    continuous feature) are also converted to non-ordered (i.e., nominal) categoricals
    by discretizing them into either three or four intervals, depending on the sample
    size in node \(t\) (\(N_t\)).


    Like CTree, GUIDE uses statistical tests (chi-square tests in particular) to select
    the splitting variable. However, unlike CTree, GUIDE employs a two-stage approach
    that tests for both main effects (called _curvature tests_) and two-way interaction
    effects between all pairs of features. The details are quite


    ᵇ I mentioned the dangers of “dichotomia” in Section 3.5.2, but keep in mind that
    discretizing the predictors is only used here for split variable selection, and
    full predictor information is used in selecting the split point and making predictions.'
  merge: -1
  img_proc: true
