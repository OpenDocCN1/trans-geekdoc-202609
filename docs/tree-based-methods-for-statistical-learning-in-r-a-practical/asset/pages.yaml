  md: 'Hastie et al. [2009, p. 363] suggest that $4 \le J \le 8$ (or $2 \le d \le
    3$) works well in general (with results not being too sensitive to different values
    in this range) and that $J > 10$ is rarely necessary. In many cases, a simpler
