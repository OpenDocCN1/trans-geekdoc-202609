    \ { # y should be coded as 0/1\n  p <- mean(y) # proportion of successes (or 1s)\n\
    \  2 * p * (1 - p) # Gini index\n}\n```\n\nTo find the optimal split \\( S = \\\
    {x, c\\} \\), where \\( x \\) is an ordered (but numeric) feature and \\( c \\\
