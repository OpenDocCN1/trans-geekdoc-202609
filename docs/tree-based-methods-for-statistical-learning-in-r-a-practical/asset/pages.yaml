  md: 'number of predictors by bundling mutually exclusive features together (i.e.,
    they rarely take nonzero values simultaneously). Both of these features allow
    LightGBM to speed up the training process, while maintaining accuracy.


    LightGBM is available in both C, R, and Python. For details, visit the LightGBM
    GitHub repository at https://github.com/microsoft/LightGBM. Without access to
    GPUs, XGBoost and LightGBM are among the most efficient GBM implementations. If
    you have access to GPUs, XGBoost currently seems to have a slight edge. Like XGBoost,
    LightGBM can also be run in random forest mode; consult the LighGBM documentation
    for details.


    # 8.8.3 CatBoost


    While XGBoost and LightGBM seem to be the most popular implementations of GBMs,
    they didn''t initially handle categorical variables as well as another GBM variant
    called CatBoost [Dorogush et al., 2018, Prokhorenkova et al., 2017]. One of the
    main selling points of CatBoost is the ability to handle categorical variables
    without the need for numerically encoding them. From the CatBoost website:


    > Improve your training results with CatBoost that allows you to use non-numeric
    factors, instead of having to pre-process your data or spend time and effort turning
    it to numbers.

    > https://catboost.ai/


    They also claim that CatBoost works reasonably well out of the box with less time
    needed to be spent on hyperparameter tuning.


    In CatBoost, a process called quantization is applied to numeric features, whereby
    values are divided into disjoint ranges or buckets—this is similar to the approximate
    tree growing algorithm in XGBoost whereby numeric features are binned. Before
    each split, categorical variables are converted to numeric using a strategy similar
    to mean target encoding, called ordered target statistics, which avoids the problem
    of target leakage and reduces overfitting. CatBoost is currently available as
    a command line application in C++, but R and Python interfaces are also available.
    For further details and resources, visit the CatBoost website at https://catboost.ai/.


    Both XGBoost and LightGBM now support categorical features.'
