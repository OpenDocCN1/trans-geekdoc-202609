  md: "variables produce binary splits of the form \\( x \\in S \\) vs. \\( x \\notin\
    \ S \\), where \\( S \\) is a subset of the unique categories of \\( x \\).\n\n\
    Finding the optimal split point can be done using any number of strategies, including\
    \ those discussed in Chapter 2 (e.g., maximizing reduction in node impurity).\
    \ However, the choice of impurity function depends on the scale of the response\
    \ (e.g., the Gini index for classification and sum of squares for regression).\
    \ For this reason, CTree uses the same conditional inference framework for selecting\
    \ the optimal split point as it does for selecting the optimal splitting variable.\
    \ Instead of using \\( p \\)-values, however, the optimal split point is chosen\
    \ using the individual test statistics (since we don’t have to worry about different\
    \ scales).\n\nNote that for continuous predictors, CTree chooses a cut point from\
    \ the observed predictor values. This is in contrast to CART, which uses the midpoints\
    \ of the observed values; see, for example, Breiman et al. [1984, p. 30]. Other\
    \ tree algorithms have different methods for selecting the split point values\
    \ for ordered features (e.g., C4.5, which is discussed in the online complements),\
    \ but this detail rarely matters in practice.\n\nEvery binary partition induces\
    \ a two-sample test between the response values in each group (e.g., \\(\\{Y_i\
    \ | X_{ji} \\in S\\}\\) and \\(\\{Y_i | X_{ji} \\notin S\\}\\)). The conditional\
    \ inference framework discussed in Section 3.3 is employed again at this step,\
    \ and a test statistic (3.3) is computed for each possible split. The split associated\
    \ with the largest test statistic is used to partition the data, before returning\
    \ to step 1) of Algorithm 3.1.\n\n# 3.4.2.1 Example: New York air quality measurements\n\
    \nContinuing with the New York air quality example, let’s find the optimal split\
    \ point for Temp, the feature selected previously in step 1) of Algorithm 3.1\
    \ (p. 122), to partition the root node. The code chunk below computes the test\
    \ statistics for testing \\( H_0 : D(\\text{Ozone}|\\text{Temp} \\le c) = D(\\\
    text{Ozone}) \\), for each unique value of Temp; the results are plotted in Figure\
    \ 3.2.\n\n```\n```r\nset.seed(912) # for reproducibility\nxvals <- sort(unique(aq$Temp))\
    \ # potential cut points\nsplits <- matrix(0, nrow = length(xvals), ncol = 2)\n\
    colnames(splits) <- c(\"cutoff\", \"chisq\")\nfor (i in seq_along(xvals)) {\n\
    \  x <- ifelse(aq$Temp <= xvals[i], 0, 1) # binary indicator\n  y <- aq$Ozone\n\
    \  # Ignore pathological splits or splits that are too small\n  if (length(table(x))\
    \ < 2 || any(table(x) < 7)) {\n    res <- NA\n  } else {\n    res <- gi.test(x,\
    \ y)[\"chisq\"]\n```\n```"
