    In this sample, 125 subjects died (i.e., experienced the event of interest) and
    the remaining 187 were considered censored (i.e., we only know they did not die
    before dropping out, receiving a transplant, or reaching the end of the study
    period).


    In survival studies (like this one), the dependent variable of interest is often
    *time until some event occurs*; in this example, the event of interest is death.
    However, medical studies cannot go on forever, and sometimes subjects drop out
    or are otherwise lost to follow-up. In these situations, we may not have observed
    the event time, but we at least have some partial information. For example, some
    of the subjects may have survived beyond the study period, or perhaps some dropped
    out due to other circumstances. Regardless of the specific reason, we at least
    have some partial information on these subjects, which survival analysis (also
    referred to as *time-to-event* or *reliability analysis*) takes into account.


    The scatterplot in Figure 1.10 shows the survival times for the first ten subjects
    in the PBC data, with an indicator for whether or not each observation was censored.
    The first subject, for example, was recorded dead at $t = 400$ days, while subject
    two was censored at $t = 4,500$ days.


    In survival analysis, the response variable typically has the form


    $Y = \min(T, C)$,


    where $T$ is the survival time and $C$ is the *censoring time*. In this book,
    I''ll only consider right censoring (the most common form of censoring), where
    $T \ge Y$. In this case, all we know is that the true event time is at least as
    large as the observed time$^a$. For example, if we were studying the failure time
    of some motor in a machine, we might have observed a failure at time $t = 56$
    hours, or perhaps the study ended at $t = 100$ hours, so all we know is that the
    true failure time would have occurred some time after that.


    To indicate that a particular observation is censored, we can use a censoring
    indicator:


    * Left censoring and *interval censoring* are other common forms of censoring.'
