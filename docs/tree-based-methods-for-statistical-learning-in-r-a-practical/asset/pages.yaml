    Looking at a single metric (or metrics) does not paint a full picture, so it can
    be helpful to look at specific visualizations, like calibration curves, to further
    assess the accuracy of the model''s predicted probabilities (lift charts can also
    be useful). The leftmost plot in Figure 7.26 shows the actual vs. predicted probabilities
    for the test set, as well as the isotonic-based calibration curve from the above
    RF. In this case, the RF seems to be doing a reasonable job in terms of accuracy.
    The model seems well-calibrated for probabilities below 0.5, but seems to have
    a slight negative bias for probabilities above 0.5, which makes sense since most
    of the probability mass is concentrated near zero (as we might have expected given
    the true class frequencies).


    To naively combat the perceived issue of unbalanced class labels, the learning
    sample is often artificially rebalanced (e.g., using down sampling) so that the
    class outcomes have roughly the same distribution. In general, THIS IS A BAD IDEA
    for probability models, and can lead to serious bias in the predicted probabilities—in
    fact, any algorithm that requires you to remove good data to optimize performance
    is suspect. Nonetheless, sometimes the data have been artificially rebalanced
    in a preprocessing step outside of our control, or maybe you decided to down sample
    the data to reduce computation time (in which case, you should try to preserve
    the original class frequencies, or at least store them for adjustments later).
    In any case, let''s see what happens to our predictions when we down sample the
    majority class.'
