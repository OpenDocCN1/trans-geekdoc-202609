    # 1.2.1 A brief history of decision trees


    Decision trees have a long and rich history in both statistics and computer science,
    and have been around for many decades. However, decision trees arguably got their
    true start in the social sciences. Motivated by the need'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'for finding interaction effects in complex survey data, Morgan and Sonquist
    [1963] developed and published the first decision tree algorithm for regression
    called automatic interaction and detection (AID). Starting at the root node, AID
    recursively partitions the data into two homogeneous subgroups, called child nodes,
    by maximizing the between-node sum of squares, similar to the process described
    in Section 2.3. AID continues successively bisecting each resulting child node
    until the reduction in the within-node sum of squares is less than some prespecified
    threshold.


    Messenger and Mandell [1972] extended AID to classification in their theta automatic
    interaction detection (THAID) algorithm. The theta criterion used in THAID to
    choose splits maximizes the sum of the number of observations in each modal category.


    The chi-square automatic interaction detection (CHAID) algorithm, introduced in
    Kass [1980], improved upon AID by countering some of its initial criticisms; CHAID
    was original developed for classification and later extended to also handle regression
    problems. Similar to the decision tree algorithms discussed in Chapters 3–4, CHAID
    employs statistical tests and stopping rules to select the splitting variables
    and split points. In particular, CHAID relies on chi-squared tests, which require
    discretizing ordered variables into bins. Compared to AID and THAID, CHAID was
    unique in that it allowed multiway splits (which typically require larger sample
    sizes, otherwise the child nodes can become too small rather quickly) and included
    a separate category for missing values.


    Despite the novelty of AID, THAID, and CHAID, it wasn’t until Breiman et al. [1984]
    introduced the more general classification and regression tree (CART) algorithmh,
    that tree-based algorithms started to catch on in the statistical community. CART-like
    decision trees are the topic of Chapter 2. A similar tree-based algorithm, called
    C4.5 [Quinlan, 1993], which evolved into the current C5.0 algorithmi, has become
    very similar to CART in many regards; hence, I focus on CART in this book and
    discuss the details of C4.5/C5.0 in the online supplementary material.


    CART helped generate renewed interest in partitioning methods, and we’ve seen
    that evolution unfold over the last several decades. While the history is rife
    with advancements, the first part of this book will focus on three of the most
    important tree-based algorithms:


    +   Chapter 2: Classification and regression trees (CART).


    +   Chapter 3: Conditional inference trees (CTree).'
  merge: -1
  img_proc: true
