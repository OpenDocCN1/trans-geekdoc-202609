    ```

    $$\delta = \begin{cases} 1 & \text{if } T \le C \\ 0 & \text{if } T > C \text{
    (i.e., censored)} \end{cases}$$

    ```


    where \(\delta = 1\) implies that we observed the true survival time and \(\delta
    = 0\) indicates a right censored observation (i.e., we only know the subject survived
    past time \(C\)). A common cause for right censoring in medical studies is that
    the study ended before the event of interest (e.g., death) occurred or perhaps
    some of the individuals dropped out or were lost to follow-up; in either case,
    we only have partial information. As we''ll see, several classes of decision tree
    algorithms can be extended to handle right censored outcomes. Examples are provided
    in Sections 3.5.3 (single decision tree) and 8.9.1 (ensemble of decision trees).


    A common summary of interest in survival studies is the _survival function_:


    ```

    $S(t) = \text{Pr}(T > t), \quad (1.3)$

    ```


    which describes the probability of surviving longer than time \(t\). The Kaplan-Meier
    (or product limit) estimator is a nonparametric statistic used for estimating
    the survival function in the presence of censoring (if there isn''t any censoring,
    then we could just use the ordinary _empirical distribution function_).'
