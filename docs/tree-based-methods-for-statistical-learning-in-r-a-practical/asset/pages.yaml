- pgno: 260
  md: 'some RF implementations have the option to "stop early" if the validation error
    stops improving; the R package **h2o** [LeDell et al., 2021] includes an RF implementation
    that supports early stopping with a wide variety of performance metrics. Such
    early stopping can be based on an independent test set, cross-validation, or the
    OOB error.


    What about using the OOB error estimate or tuning? Although its been argued that
    the OOB error tends to overestimate the true error in certain cases (see, for
    example, Mitchell [2011]), Janitza and Hornung [2018] noted that the overestimation
    seems to have little to no impact on tuning parameter selection, at least in their
    simulations. If ordinary cross-validation is too expensive, and you don''t have
    access to separate validation and test sets, then using the OOB error is a certainly
    reasonable thing to do, and in many cases, more efficient.


    To illustrate, I carried out a small simulation using the Friedman 1 benchmark
    problem introduced in Section 1.4.3. For these data, there are 10 possible values
    for the \(m_{try}\) parameter. For each value, I generated 100 separate train
    and test sets of \(N = 1,000\) observations each. For each repetition, I computed
    the OOB and test MSE and plotted the results; the results are displayed in Figure
    7.7. In this example, you can see that the OOB error is quite in line with the
    test error, and both suggest an optimal value of \(m_{try}\) around 5 or 6 (the
    traditional default here, indicated by a dashed vertical line, is \(m_{try} =
    \lfloor 10/3 \rfloor = 3\)).


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_260_0.png)


    FIGURE 7.7: OOB and test error vs. \(m_{try}\) for the Friedman benchmark data
    using \(N = 2000\) with a 50/50 split. The dashed line indicates the standard
    default for regression; in this case, \(m_{try} = 3\).'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 7.5 Variable importance


    Breiman [2002] proposed two measures of variable importance for RFs:


    +   A measure based on the mean decrease in node impurity (Section 7.5.1), which
    I''ll refer to as the impurity-based measure. Originally, only the Gini splitting
    criterion (Section 2.2.1) was used. This variable importance measure was discussed
    for general tree ensembles in Section 5.4.


    +   A novel permutation-based measure (Section 7.5.2), which I''ll refer to as
    the OOB-based permutation measure. This variable importance measure was discussed
    for general use in any supervised learning model in Section 6.1.1.


    While these variable importance measures were originally introduced for the classification
    case, they naturally extend to the regression case as well. Note that many other
    measures have also been defined. An up-to-date and thorough overview of quantifying
    predictor importance in different tree-based methods is given in Loh and Zhou
    [2021].


    # 7.5.1 Impurity-based importance


    As discussed in Section 5.4, the importance of any predictor can be measured by
    aggregating the individual variable importance scores across all the trees in
    the forest. For an arbitrary feature \(x\), we can use the total decrease in node
    impurities from splitting on \(x\) (e.g., as measured by MSE for regression or
    the Gini index for classification), averaged over all \(B\) trees in the forest:


    \(\text{VI} (x) = \frac{1}{B} \sum_{b=1}^B \text{VI}_{T_b} (x) , \quad (7.3)\)


    where \(\text{VI}_{T_b} (x)\) is the relative importance of \(x\) in tree \(T_b\)
    (Section 2.8). Since averaging helps to stabilize variance, \(\text{VI} (x)\)
    tends to be more reliable than \(\text{VI}_{T_b} (x)\) [Hastie et al., 2009, p.
    368].


    The split variable selection bias inherent in CART-like decision trees also affects
    the impurity-based importance measure in their ensembles (7.3). The bias tends
    to result in higher variable importance scores for predictors with more potential
    split points (e.g., categorical variables with many categories). Several authors
    have proposed methods for eliminating the bias when the Gini index is used as
    the splitting criterion; see, for example, Sandri and Zuccolotto [2008] and the
    references therein. An interesting (and rather simple) approach'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'is provided in Sandri and Zuccolotto [2008], and later modified in Nembrini
    et al. [2018] for RFs.


    The idea in Sandri and Zuccolotto [2008] is to realize that the impurity-based
    importance measure from a single CART-like decision tree can be expressed as the
    sum of two components:


    \(\text{VI}_{T_b}(x) = \text{VI}_{T_b}^{true}(x) + \text{VI}_{T_b}^{bias}(x),\)


    where \(\text{VI}_{T_b}^{true}(x_i)\) is the part attributable to informative
    splits and is related to the “true” importance of \(x_i\), and \(\text{VI}_{T_b}^{bias}(x_i)\)
    is the part attributable to uninformative splits and is a source of bias. The
    algorithm they propose attempts to eliminate the bias in \(\text{VI}_{T_b}(x_i)\)
    by subtracting off an estimate of \(\text{VI}_{T_b}^{bias}(x_i)\). This is done
    many times and the results averaged together. The basic steps are outlined in
    Algorithm 7.2 below.


    # Algorithm 7.2 Bias-corrected Gini importance.


    +   1) For \(r = 1, 2, \dots, R\):

    +      1) Given the original \(N \times p\) matrix of predictor values \(\mathbf{X}\),
    generate an \(N \times p\) matrix of *pseudo predictors* \(\mathbf{Z}_r\) using
    one of the following techniques:

    +         - Randomly permuting each column of the original predictor values \(\mathbf{X}\)
    (hence, the \(j\)-th column of \(\mathbf{Z}_r\) can be obtained by randomly shuffling
    the values in the \(j\)-th column of \(\mathbf{X}\)).

    +         - Randomly permuting the rows of \(\mathbf{X}\); this has the advantage
    of maintaining any existing relationships between the original predictors.

    +      2) Apply the ensemble procedure (e.g., bagging, boosting, or RF) using
    \(\bar{\mathbf{X}}_r = (\mathbf{X}, \mathbf{Z}_r)\) as the set of available predictors
    (i.e., use both the original predictors, as well as the randomly generated pseudo
    predictors).

    +      3) Use Equation 7.3 to compute both \(\text{VI}(x_i)\) and \(\text{VI}(z_i)\);
    that is, compute the usual impurity-based variable importance measure for each
    predictor \(x_i\) and pseudo predictor \(z_i\), for \(i = 1, 2, \dots, p\).

    +   2) Compute the bias-adjusted impurity-based importance measure for each predictor
    \(x_i\) (\(i = 1, 2, \dots, p\)) as \(\text{VI}^*(x_i) = R^{-1} \sum_{r=1}^R (\text{VI}(x_i)
    - \text{VI}(z_i))\).'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Algorithm 7.2 can be used to correct biased variable importance scores from
    a single CART-like tree or an ensemble thereof. Also, while the original algorithm
    was developed for the Gini-based importance measure, Sandri and Zuccolotto [2008]
    suggest it is also effective at eliminating bias for other impurity measures,
    like cross-entropy and SSE. One of the drawbacks of Algorithm 7.2., however, is
    that it effectively doubles the number of predictors to 2p and requires multiple
    (R) iterations. This can be computationally prohibitive for large data sets, especially
    for tree-based ensembles. Fortunately, Nembrini et al. [2018] proposed a similar
    technique specific to RFs that only requires a single replication. I''ll omit
    the details, but the procedure is available in the ranger package for R (which
    has also been ported to Python and is available in the sklearn package [Flynn,
    2021]); an example is given in Figure 7.8.


    Even though our quick-and-dirty crforest() function in Section 7.2.3 used bootstrap
    sampling, the actual CRF procedure described in Strobl et al. [2007b], and implemented
    in R packages party and partykit, defaults to growing trees on random subsamples
    of the training data without replacement (by default, the size of each sample
    is given by [0.632N]), as opposed to bootstrapping. Strobl et al. [2007b] showed
    that this effectively removes the bias in CRFs due to the presence of predictor
    variables that vary in their scale of measurement or their number of categories.


    # 7.5.2 OOB-based permutation importance


    RFs offer an additional (and unbiased) variable importance method; the approach
    is quite similar to the more general permutation approach discussed in Section
    6.1.1, but it''s based on permuting observations in the OOB data instead. The
    idea is that if predictor x is important, then the OOB error will go up when x
    is perturbed in the OOB data. In particular, we start by computing the OOB error
    for each tree. Then, each predictor is randomly shuffled in the OOB data, and
    the OOB errors are computed again. The difference in the two errors is recorded
    for the OOB data, then averaged across all trees in the forest.


    As with the more general permutation-based importance measure, these scores can
    be unreliable in certain situations; for example, when the predictor variables
    vary in their scale of measurement or their number of categories [Strobl et al.,
    2007a], or when the predictors are highly correlated [Strobl et al., 2008b]. Additionally,
    the corrected Gini-based importance discussed in Nembrini et al. [2018] has the
    advantage of being faster to compute and more memory efficient.


    Figure 7.8 shows the results from three difference RF variable importance measures
    on the simulation example from Section 3.1; the simulation comparing the split
    variable selection bias between CART and CTree. Here, we'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'can see that the traditional Gini-based variable importance measure is biased
    towards the categorical variables, while the corrected Gini and permutation-based
    variable importance scores are relatively unbiased.


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_264_0.png)


    FIGURE 7.8: Average feature importance ranking for three RF-based variable importance
    measures. Left: the traditional Gini-based measure. Middle: the OOB-based permutation
    measure. Right: The corrected Gini-based measure.


    The next two sections discuss more contemporary permutation schemes for RFs that
    deserve some consideration.


    # 7.5.2.1 Holdout permutation importance


    One drawback to computing variable importance in general is the lack of a natural
    cutoff that can be used to discriminate between “important” and “non-important”
    predictors. A number of approaches based on null hypothesis testing and thresholding
    have been developed for addressing this problem; see, for example, Altmann et
    al. [2010] and Loh and Zhou [2021, Sec. 6]. Janitza et al. [2018] argued that
    the null distribution of the OOB-based permutation measure is not necessarily
    symmetric; in particular, for irrelevant features. This makes the OOB-based permutation
    variable importance scores less suitable for selecting relevant features using
    a hypothesis-driven approach. Instead, Janitza et al. [2018] propose a method
    referred to as holdout variable importance, which has a symmetric null distribution
    for both relevant and irrelevant predictors. The idea is to split the data into
    two halves, grow an RF on one half, and use the leftover half to compute a permutation-based
    variable importance score. This method is available in the R package ranger.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 7.5.2.2 Conditional permutation importance


    A major drawback of permutation-based importance measures is the inherent assumption
    of independent features (e.g., the features are uncorrelated). For example, if
    x1 and x2 have a strong dependency, then it doesn’t make sense to randomly permute
    x1 while holding x2 constant (or vice versa). To this end, [Strobl et al., 2008b]
    describe a conditional permutation importance measure that adjusts for correlations
    between predictor variables. In particular, the conditional permutation importance
    of each variable is computed by permuting within a grid defined by the covariates
    that are associated with the variable of interest. According to Strobl et al.
    [2008b], the resulting variable importance scores are conditional in the sense
    of coefficients in a regression model, but represent the effects of a variables
    in both main effects and interactions. When missing values are present in the
    predictors, the procedure described in Hapfelmeier et al. [2014] can be used to
    measure variable importance. While this idea applies in general to any type of
    RF, its implementations currently seem limited to the conditional inference trees
    and forest provided by the party and partykit packages in R; see, for example,
    ?partykit::varimp.


    # 7.6 Casewise proximities


    So far in this book, we’ve mainly discussed tree-based methods for supervised
    learning problems. However, not every problem is supervised. For example, it is
    often of interest to understand how the data clusters—that is, whether the rows
    of the data form any “interesting” groups. (This is an application of unsupervised
    learning.) Many clustering methods rely on computing the pairwise distances between
    any two rows in the data, but the challenge becomes choosing the right distance
    metric. Euclidean distance (i.e., the “ordinary” straight-line, or “as the crow
    flies” distance between two points), for example, is quite sensitive to the scale
    of the inputs. It’s also rather awkward to compute the Euclidean distance between
    two rows of data when the features are a mix of both numeric and categorical types.
    Fortunately, other distance (or distance-like) measures are available which more
    naturally apply to mixed data types.


    Another useful output that can be obtained from an RF, provided it’s implemented,
    are pairwise case proximities. RF proximities are distance-like measures of how
    similar any two observations are, and can be used for


    +   - clustering in supervised and unsupervised (Section 7.6.3) settings;'
  merge: -1
  img_proc: true
- pgno: 266
  md: '+   - detecting outliers/novel cases (Section 7.6.1);

    +   - imputing missing values (Section 7.6.2).


    To compute the proximities between all pairs of training observations in an RF,
    do the following:


    +   1) pass all of the data, both training and OOB, down each tree;

    +   2) every time records i and j cohabitate in the same terminal node of a tree,
    increase their proximity by one;

    +   3) At the end, normalize the proximities by dividing by the number of trees
    in the forest.


    So how does this measure similarity between cases? Recall that RFs (and bagged
    decision trees in general) intentionally build deep, overgrown decision trees.
    In order for two observations to land in the same terminal node, they have to
    satisfy all of the same conditions leading to it. If two observations occupy the
    same terminal node across a majority of the trees in the forest, then they are
    likely very similar to each other in terms of feature values. Note that using
    all the training data can lead to unrealistic proximities. To circumvent this,
    proximities can be computed on only the OOB cases. It is also possible to compute
    proximities for new cases (an example application is given in Section 7.6.4).


    The end result is an N x N proximity matrix, where N is the sample size of the
    data set proximities are being computed for. As it turns out, this matrix is symmetric
    (since prox (i, j) = prox (j, i)), positive definite (i.e., has all positive eigenvalues),
    and bounded above by one, with the diagonal elements equal to one (since prox
    (i, i) = 1). Consequently, for any two cases i and j, we can treat 1 - prox (i,
    j) as a squared distance-like metric, which can be used as input into any distance-based
    clustering algorithm. For example, Shi et al. [2005] used RF proximities to help
    identify fundamental subtypes of cancer. A brief example using the Swiss banknote
    data is provided in Section 7.6.3.1.


    The proximities from an RF provide a natural measure of similarity between records
    when the predictor variables are of mixed types (e.g., numeric and categorical)
    and measured on different scales; they are invariant to monotone transformations
    and naturally support categorical variables. The biggest drawback, as with any
    pairwise distance-like metric, is that it requires storing an N x N matrix; although,
    since the casewise proximity matrix is symmetric, you only need to store the upper
    or lower triangular part (see, for example, ?treemisc::proximity). Proximities
    are also not implemented in most open source RF software. However, if you can
    obtain the N x B matrix of terminal node assignments (which is available in most
    open source RF software), then it is rather straightforward to compute the proximities
    yourself; an example, specific to the R package ranger [Wright et al., 2021],
    can be found at https://mnwright.github.io/ranger/r/oob-proximity-matrix/, while
    a'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'C++ implementation is available in treemisc''s `proximity()` function. The
    next two sections discuss more specific uses of proximities that are useful in
    a supervised learning context.


    # 7.6.1 Detecting anomalies and outliers


    Outliers (or anomalies) are generally defined as cases that are removed from the
    main body of the data. In the context of an RF, Leo Breiman defined outliers as
    cases whose proximities to all other cases in the data are generally small. For
    classification, he proposed a simple measure of “outlyingness” based on the RF
    proximity values. Define the average proximity from case m in class j to the rest
    of the training data in class j as


    ```

    prox^*(m) = \sum_{k \in class j} prox^2(m, k),

    ```


    where the sum is over all training instances belonging to class j. The outlyingness
    of case m in class j to all other cases in class j is defined as


    ```

    out(m, j) = \frac{N}{prox^*(m)},

    ```


    where N is the number of training instances. Generally, a value above 10 is reason
    to suspect the case of being an outlier [Breiman, 2002]. Obviously, this measure
    is limited to smaller data sets and RF implementations where proximities can be
    efficiently computed. In Section 7.8.5, I’ll look at a specialized RF extension
    that’s more suitable for detecting outliers and anomalies, especially in higher
    dimensions. An interesting use case for the proximity-based outlyingness measure
    is presented in the next section.


    # 7.6.1.1 Example: Swiss banknotes


    An interesting use case for the proximity-based outlyingness measure is in detecting
    potentially mislabeled response classes in classification problems. Consider,
    for example, the Swiss banknote data from Section 1.4.1. Before fitting a default
    RF, I switched the label for observation 101; this observation is supposedly a
    counterfeit banknote (y = 1), but I switched the class label to genuine (y = 0).
    The proximity-based outlyingness scores are displayed in Figure 7.9. There are
    two obvious potential outliers, labeled with their corresponding row number. Here,
    you can see that the counterfeit banknote I mislabeled as genuine (observation
    101) received the largest outlier score. Observation 70 is also interesting and
    worth investigating; perhaps it was also mislabeled?'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/2c227bfb3620dc3d159fa5e6598afa30_268_0.png)


    FIGURE 7.9: Proximity-based outlier scores for the Swiss banknote data. The largest
    outlier score corresponds to observation 101, which was a counterfeit banknote
    that was mislabeled as genuine.


    # 7.6.2 Missing value imputation


    Many decision tree algorithms can can naturally handle missing values; CART and
    CTree, for example, employ surrogate splits to handle missing values (Section
    2.7). Unfortunately, the idea does not carry over to RFs. I suppose that makes
    sense: searching for surrogates would greatly increase the computation time of
    the RF algorithm. Although some RF software can handle missing values without
    casewise deletion (e.g., the h2o package in both R and Python), most often they
    have to be imputed or otherwise dealt with.


    Breiman also developed a clever way to use RF proximities for imputing missing
    values. The idea is to first impute missing values with a simple method (such
    as using the mean or median for numeric predictors and the most common value for
    categorical ones). Next, fit an initial RF to the N complete observations and
    generate the N × N proximity matrix. For a numeric feature, the initial imputed
    values can be updated using a weighted mean over the non-missing values where
    the weights are given by the proximities. For categorical variables, the imputed
    values are updated using the most frequent non-missing values where frequency
    is weighted by the proximities. Then just iterate until some convergence criterion
    is met (typically 4-6 runs). In other words, this method just imputes missing
    values using a weighted mean/mode with more weight on non-missing cases.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'Breiman [2002] noted that the OOB estimate of error in RFs tends to be overly
    optimistic when fit to training data that has been imputed. As with proximity-based
    outlier detection, this approach to imputation does not scale well (especially
    since it requires fitting multiple RFs and computing proximities). Further, this
    imputation method is often not as accurate as more contemporary techniques, like
    those implemented in the R package **mice** [van Buuren and Groothuis-Oudshoorn,
    2021].


    Perhaps the biggest drawback to proximity-based imputation, like many other imputation
    methods, is that it only generates a single completed data set. As discussed in
    van Buuren [2018, Chap. 1], our level of confidence in a particular imputed value
    can be expressed as the variation across a number of completed data sets. In Section
    7.9.3, I’ll use the CART-based multiple imputation procedure discussed in Section
    2.7.1 and show how we can have confidence in the interpretation of the RF output
    by incorporating the variability associated with multiple imputation runs.


    # 7.6.3 Unsupervised random forests


    As it turns out, RFs can be used in unsupervised settings as well (i.e., when
    there is no defined response variable). In this case, the goal is to cluster the
    data, that is, see if the rows from the learning sample form any “interesting”
    groups.


    In an unsupervised RF, the idea is formulate a two-class problem. The first class
    corresponds to the original data, while the second class corresponds to a synthetic
    data set generated from the original sample. There are two ways to generate the
    synthetic data corresponding to the second class [Liaw and Wiener, 2002]:


    +   1) a bootstrap sample is generated from each predictor column of the original
    data;

    +   2) a random sample is generated uniformly from the range of each predictor
    column of the original data.


    These two data sets are then stacked on top of each other, and an ordinary RF
    is used to build a binary classifier to try and distinguish between the real and
    synthetic data. (A necessary drawback here is that the resulting data set is twice
    as large as the original learning sample.) If the OOB misclassification error
    rate in the new two-class problem is, say, ≥ 40%, then the columns look too much
    like independent variables in the eyes of the RF; in other words, the dependencies
    among the columns do not play a large role in discriminating between the two classes.
    On the other hand, if the OOB misclassification rate is lower, then the dependencies
    are playing an important role. If there is some discrimination between the two
    classes, then the resulting proximity matrix'
  merge: -1
  img_proc: true
