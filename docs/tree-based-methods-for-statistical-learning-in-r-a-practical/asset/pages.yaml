    Consequently, setting cp = 1 will always result in a tree with no splits. The
    default, cp = 0.01, has been shown to be useful at “pre-pruning” the trees in
    a way such that the cross-validation step results in only the removal of 1–2 layers,
    although it can also occasionally over-prune. In practice, it seems best to set
    cp = 0, or some other number smaller than the default, and use the cross-validation
    results to choose an optimal subtree.


    Using the 1-SE rule would suggest a tree with 5, or possibly 7, splits. However,
    since our main objective is to construct a simple rule-of-thumb for classifying
    the edibility of mushrooms, it seems like the simpler model with only a single
    split (i.e., a decision stump) will suffice; it only misclassifies 3% of the poisonous
    mushrooms as edible. To prune an rpart tree, use the prune() function with a specified
    value of the complexity parameter:


