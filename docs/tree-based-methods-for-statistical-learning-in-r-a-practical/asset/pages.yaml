    tree algorithm will work (e.g., GUIDE or CTree); I''ll use CTree in Section 7.2.3
    to build an RF from scratch. Also, the traditional RF algorithm used the Gini
    splitting criterion (2.1) for classification and the SSE splitting criterion (2.6)
    for regression. However, many other splitting criteria can be used to great affect.
    For example, Ishwaran et al. [2008] proposed several splitting rules more appropriate
    for right-censored outcomes, including a log-rank splitting rule that splits nodes
    by maximization of the log-rank test statistic; see also Segal [1988], LeBlanc
    and Crowley [1992].


