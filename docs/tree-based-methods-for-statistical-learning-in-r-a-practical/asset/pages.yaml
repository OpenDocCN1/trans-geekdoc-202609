  md: 'tree, there may be several competing splits that result in nearly the same
    decrease in node impurity and different samples may lead to different choices
    among these similar performing split contenders.


    To illustrate, let’s look at six independent samples of size _N_ = 3,220 from
    the email spam data described in Section 1.4.5 (≈ 70% training sample), and fit
    a CART-like tree to each using a maximum of four splits. The results are displayed
    in Figure 2.29. Note the difference in structure and split variables across the
    six trees.


    Fortunately, tree stability isn’t always as problematic as it sounds (or looks).
    According to Zhang and Singer [2010, p. 57], “...the real cause for concern [in
    practice] regarding tree stability is the psychological effect of the appearance
    of a tree.” Even though the structure of the tree can vary from sample to sample,
    Breiman et al. [1984, pp. 156–159] argued that competitive trees, while differing
    in appearance, can give fairly stable and consistent predictions. Strategies for
    improving the stability and performance of decision trees are discussed in Chapters
    5–8.


    Instability is not a feature specific to trees, though. For example, traditional
    model selection techniques in linear regression—like forward selection, backward
    elimination, and hybrid variations thereof—all suffer from the same problem. However,
    averaging can improve the accuracy of unstable predictors, like overgrown decision
    trees, through variance reduction [Breiman, 1996a]; more on this in Chapter 5.


    # ## 2.11 Recommended reading


    First and foremost, I highly recommend reading the original CART monograph [Breiman
    et al., 1984]. For a more approachable and thorough discussion of CART, I’d recommend
    Berk [2008, Chap. 3] (note that there’s now a second edition of this book). I
    also recommend reading the vignettes accompanying the rpart package; R users can
    launch these from an active R session, as mentioned throughout this chapter, but
    they’re also available from rpart’s CRAN landing page: https://cran.r-project.org/package=rpart.
    Scikit-learn’s sklearn.tree module documentation is also pretty solid: https://scikit-learn.org/stable/modules/tree.html.
    There’s also a fantastic talk by Dan Steinberg about CART, called “Data Science
    Tricks With the Single Decision Tree,” that can be found on YouTube: https://www.youtube.com/watch?v=JVbU_tS6zKo&feature=youtu.be.'
