- pgno: 246
  md: 'aging the predictions across all the trees in the ensemble. For classification,
    a plurality vote among the individual trees is used.


    Unfortunately, correlation limits the variance-reducing effect of averaging. Take
    the following example for illustration. Suppose $\{X_i\}_{i=1}^N \stackrel{iid}{\sim}
    (\mu, \sigma^2)$ is a random sample from some distribution with mean $\mu$ and
    variance $\sigma^2$. Let $\bar{X} = \sum_{i=1}^N X_i / N$ be the sample mean.
    If the observations are independent (as is the usual annotation of a random sample),
    then $\text{E}(\bar{X}) = \mu$ and $\text{V}(\bar{X}) = \sigma^2 / N$. In other
    words, the variance of the average is less than the variance of the sample elements.
    This of course assumes that the $X_i$ are uncorrelated. If the pairwise correlation
    between any two observations is $\rho = \rho(X_i, X_j) (i \neq j)$, then


    $$ \text{V}(\bar{X}) = \rho \sigma^2 + \frac{1-\rho}{N} \sigma^2, $$


    which converges to $\rho \sigma^2$ as $N \to \infty$. In other words, regardless
    of sample size, correlation limits the variance-reducing effect of averaging.
    This is illustrated in Figure 7.1, where each boxplot is constructed from 30,000
    sample means, each of which is based on a sample of size $N = 30$ from a centered
    Gaussian distribution with specified pairwise correlation (x-axis); note the increasing
    variability in the sample means as we go from $\rho = 0$ to $\rho = 1$ (left to
    right).


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_246_0.png)


    FIGURE 7.1: 100 simulated averages from samples of size $N = 30$ with pairwise
    correlation increasing from zero to one.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Similarly, bagging a set of correlated predictors (i.e., models producing similar
    predictions) will only reduce the variance to a certain point. Since each tree
    is built using an independent bootstrap sample from the original training data,
    the trees in the bagged ensemble will be somewhat correlated. If we can reduce
    correlation between the trees, the trees will be more diverse and averaging can
    further improve the prediction and generalization performance of the ensemble.


    Figure 7.2 shows six bagged decision trees applied to the email spam training
    data; each tree was constrained to a max depth of three to help with the visualization.
    Since each tree was induced from an independent bootstrap sample from the same
    training set, the trees are naturally very similar to each other. Notice, for
    example, that the path to terminal node 15 (highlighted in green) is the same
    in four of the six trees, albeit the split points are slightly different. The
    performance of the combined ensemble might improve if we could make the trees
    more diverse.


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_247_0.png)


    FIGURE 7.2: Six bagged decision trees applied to the email spam training data.
    The path to terminal node 15 is highlighted in each tree.


    Luckily, Leo Breiman and Adele Cutler thought of a clever way to reduce correlation
    in a bagged tree ensemble; that is, make the trees more diverse. The idea is to
    limit the potential splitters at each node in a tree to a random subset of the
    available predictors, which will often result in a much more diverse ensemble
    of trees. In essence, bagging constructs a diverse tree ensemble by introducing
    randomness into the rows via sampling with replacement, while an RF further increases
    tree diversity by also introducing randomness into the columns via subsampling
    the features.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'In other words, an RF is just a bagged tree ensemble with an additional layer
    of randomness produced by selecting a random subset of candidate splitters prior
    to partitioning the data at every node in every tree—extremely randomized trees
    (Section 7.8.4), take this randomization a step further in an attempt to reduce
    variance even more. Let \( m_{try} \le p \) be the number of candidate splitters
    selected at random from the entire set of \( p \) features prior to each split
    in each tree. Setting \( m_{try} << p \) can often dramatically improve performance
    compared to bagged decision trees; note that setting \( m_{try} = p \) will results
