- pgno: 373
  md: the shallower nature of the individual trees, GBMs can also scale incredibly
    well; see, for example, Pafka [2021]. For these reasons, GBMs are quite popular
    in applied practice and are often used in the winning entries for many supervised
    learning competitions with tabular data sets. Just keep in mind that, unlike RFs,
    GBMs are quite sensitive to several tuning parameters (e.g., the learning rate
    and number of boosting iterations), and these models should be carefully tuned
    (ideally, with some form of early stopping, especially if you're working with
    a large learning sample, using a fairly small learning rate with a large number
    of boosting iterations, and/or tuning lots of parameters).
