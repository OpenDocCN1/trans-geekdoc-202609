- pgno: 132
  md: 'The next step is to construct a test statistic for testing \( H_0 \). In order
    to do this, we can standardize the (possibly multivariate) linear statistic using
    \( \mu \) and \( \Sigma \). Let \( c() \) be a function that maps \( \boldsymbol{T}
    \in \mathbb{R}^{pq \times 1} \) to the real line (i.e., a scalar or single number).
    Hothorn et al. [2006b] suggest using a quadratic form or the maximum of the absolute
    values of the standardized linear statistic:


    ```

    \( c_q = c_q(\boldsymbol{T}, \mu, \Sigma) = (\boldsymbol{T} - \mu) \Sigma^+ (\boldsymbol{T}
    - \mu)^\top ,\)

    \( c_m = c_m(\boldsymbol{T}, \mu, \Sigma) = \max \left| \frac{\boldsymbol{T} -
    \mu}{\text{diag}(\Sigma)^{1/2}} \right| ,\)

    (3.3)

    ```


    where \( \Sigma^+ \) denotes the Moore-Penrose inverse of \( \Sigma \).


    In order to construct \( p \)-values for testing \( H_0 \), we need to know the
    sampling distribution of \( c_q \) and \( c_m \). Resampling approaches can be
    used to approximate the sampling distribution to any desired accuracy by evaluating
    the test statistic under all possible permutations \( S \). This is often not
    feasible in practice as there are \( N! \) possible permutations to consider.
    However, approximations based on a random sample of permutations can be used to
    great effect; see Davison and Hinkley [1997, Sec. 4.3] for details on traditional
    permutation tests. For certain special cases, the exact sampling distribution
    of some test statistics is obtainable for small to moderate sample sizes [Hothorn
    et al., 2006b].


    For larger sample sizes, a normal approximation can be used, regardless of the
    choice for \( g() \) and \( h() \). In particular, Strasser and Weber [1999] showed
    that the conditional distribution of \( \boldsymbol{T} \) tends to a multivariate
    normal distribution with mean \( \mu \) and covariance \( \Sigma \) as \( N \to
    \infty \). Consequently, the proposed test statistics, \( c_q \) and \( c_m \),
    also have asymptotic approximations. For example, \( c_q \) has an asymptotic
    \( \chi^2(df) \) distribution with degrees of freedom (\( df \)) given by the
    rank of \( \Sigma \); if \( p=q=1 \), then asymptotically (i.e., as \( N \to \infty
    \)), \( c_q \sim \chi^2(1) \) and \( c_m \sim N(0, 1) \). With the conditional
    distribution of the test statistic in hand—whether asymptotic, approximate, or
    exact—we can compute a \( p \)-value (\( p \)) for testing \( H_0 \), where we
    would reject \( H_0 \) whenever \( p \le \alpha \), where \( \alpha \) is some
    prespecified threshold.


    Akin to a “one size fits all” approach to statistical tests of independence, this
    is a powerful idea that opens the door to a wide range of possibilities. For example,
    if the outcome is censored, then \( h() \) can be chosen to map the response values
    to \( log \text{-} rank \text{ } scores \), which can be obtained in R using the
    `logrank_trafo()` function from package `coin`; see, for example, Hothorn et al.
    [2006b] or the “A Lego System for Conditional Inference” vignette from package
    `coin` mentioned earlier.


    Enough with the mathematical jujitsu; let’s illustrate the main ideas with some
    concrete examples.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# 3.3.1 Example: X and Y are both univariate continuous


    The simplest case occurs when **X** and **Y** are both univariate continuous variables;
    in the univariate case, we drop the bold notation and just write _X_ and _Y_.
    In this case, _p_ = _q_ = 1 and \( T = \sum_{i=1}^N g(X_i) h(Y_i) \). If we take
    _g_() and _h_() to be the identity function (e.g., _g_(_X<sub>i</sub>_) = _X<sub>i</sub>_),
    then


    ```

    T = \sum_{i=1}^N X_i Y_i,\

    \mu = \left( \sum_{i=1}^N X_i \right) \bar{Y},\\

    \sigma^2 = S_Y^2 \sum_{i=1}^N X_i^2 - S_Y^2 \left( \sum_{i=1}^N X_i \right)^2
    / N,

    ```


    where \(\bar{Y} = \sum_{i=1}^N Y_i / N\) and \(S_Y^2 = \sum_{i=1}^N (Y_i - \bar{Y})^2
    / (N - 1)\) are the sample mean and variance of _Y_, respectively. Since _T_ is
    univariate, the standardized test statistics (3.3) are \(c_m = \left| (T - \mu)
    / \sqrt{\Sigma} \right|\) and \(c_q = c_m^2\); hence, it makes no difference which
    test statistic we use in this case, as the results will be identical.


    Let''s revisit the New York air quality data set (Section 1.4.2) to demonstrate
    the required computations in R. Let _X_ = `Temp` and _Y_ = `Ozone` be the variables
    of interest. To test the null hypothesis of general independence between _X_ and
    _Y_ at the \(\alpha = 0.05\) level, I''ll use the quadratic test statistic (_c<sub>q</sub>_),
    and compute a _p_-value for the test using an asymptotic \(\chi^2 (1)\) approximation.
    I''ll also choose _g_() and _h_() to be the identity function. The first line
    removes any rows with a missing response value, which I''ll be using later.


    ```

    aq <- airquality[!is.na(airquality$Ozone), ]

    N <- nrow(aq) # sample size

    gX <- aq$Temp # g(X)

    gY <- aq$Ozone # h(Y)

    Tstat <- sum(gX * gY) # linear statistic

    mu <- sum(gX) * mean(gY)

    Sigma <- var(gY) * sum(gX ^ 2) - var(gY) * sum(gX) ^ 2 / N


    # Quadratic test statistic (1.3)

    (cq <- ((Tstat - mu) / sqrt(Sigma)) ^ 2)

    #> [1] 56.1


    1 - pchisq(cq, df = 1) # p-value

    #> [1] 6.94e-14

    ```'
