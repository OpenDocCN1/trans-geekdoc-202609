  md: "```\nlibrary(isotree)\n\n# Fit a default isolation forest\nccfraud.info <-\
    \ isolation.forest(ccfraud.trn[, -31], nthreads = 1,\n                       \
    \          seed = 2223)\n\n# Compute anomaly scores for the test observations\n\
    head(scores <- predict(ccfraud.info, newdata = ccfraud.tst))\n\n#>   1   2   3\
    \   4   5   6\n#> 0.320 0.341 0.324 0.325 0.340 0.325\n```\n\nAlthough this isn't\
    \ necessarily a classification problem, we can treat the anomaly scores as probabilities\
    \ and construct informative graphics. While a precision-recall (PR) curve$^k$\
    \ could be useful here, I think a simple cumulative lift chart$^l$ would be more\
    \ informative. Below I compute both; see Figure 7.18.\n\nLooking at the lift chart,\
    \ for example, we can see that if we were to audit 5% of the highest scoring transactions\
    \ in the test set, then we will have found roughly 87% of the fraudulent cases.\n\
    \nThe PR curve doesn't look good, as you might expect after looking at the lift\
    \ chart. For example, even though we can identify roughly 87% of the fraudulent\
    \ transactions by looking at only 5% of the test sample, that still leaves more\
    \ than 1300 non-fraudulent transactions that also have to be audited. In this\
    \ example, it seems that we're not able to detect the majority of frauds without\
    \ accepting a large number of false positives.\n\n```\n#cutoff <- sort(unique(scores))\n\
    # Compute precision and recall across various cutoffs\ncutoff <- seq(from = min(scores),\
    \ to = max(scores), length = 999)\ncutoff <- c(0, cutoff)\nprecision <- recall\
    \ <- numeric(length(cutoff))\nfor (i in seq_along(cutoff)) {\n  yhat <- ifelse(scores\
    \ >= cutoff[i], 1, 0)\n  tp <- sum(yhat == 1 & ccfraud.tst$Class == 1) # true\
    \ positives\n  tn <- sum(yhat == 0 & ccfraud.tst$Class == 0) # true negatives\n\
    \  fp <- sum(yhat == 1 & ccfraud.tst$Class == 0) # false positives\n  fn <- sum(yhat\
    \ == 0 & ccfraud.tst$Class == 1) # false negatives\n  precision[i] <- tp / (tp\
    \ + fp) # precision (or PPV)\n  recall[i] <- tp / (tp + fn) # recall (or sensitivity)\n\
    }\nprecision <- c(precision, 0)\nrecall <- c(recall, 0)\n```\n\n$^k$Precision\
    \ (or positive predictive value) is directly proportional to the prevalence of\
    \ the positive outcome. PR curves are not appropriate for case-control studies\
    \ (e.g., which also includes case-control sampling—like down sampling—with imbalanced\
    \ data sets) and should only be used when the true class priors are reflected\
    \ in the data.\n\n$^l$The cumulative gains (or lift) chart shows the fraction\
    \ of the overall number of cases in a given category “gained” by targeting a percentage\
    \ of the total number of cases."
