  md: "In scenarios b)-c), we cannot estimate $\\pi_0$ and $\\pi_1$ from the learning\
    \ sample; however, in scenario b) we might have estimates of $\\pi_0$ and $\\\
    pi_1$, perhaps from historical data. If the data have been artificially balanced,\
    \ then it's possible to use good estimates of $\\pi_0$ and $\\pi_1$ to “correct”\
    \ (or adjust) the output predicted probabilities. With CART and GUIDE, it's possible\
    \ to provide the true priors and let the tree algorithm handle the adjustment\
    \ (we saw how this is handled in CART in Section 2.2.4 and provided an example\
    \ with **rpart** using the letter image recognition example in Section 2.9.5).\
    \ What if no priors argument is available in your software? Fortunately, you can\
    \ apply a simple adjustment to the output predicted probabilities, as discussed\
    \ in Matloff [2017, pp. 197-198]. A simple function to adjust the predicted probabilities\
    \ is given below. Here, **p** is a vector of predicted probabilities for the positive\
    \ class (i.e., $\\widehat{\\Pr}(Y=1|x)$), **observed.ratio** is the ratio of the\
    \ observed class frequencies (i.e., $N_0/N_1$), and **true.ratio** is the ratio\
    \ of the true class priors (i.e., $\\pi_0/\\pi_1$.\n\n```\n```r\nprob.adjust <-\
    \ function(p, observed.ratio, true.ratio) {\n  f.ratio <- (1 / p - 1) * (1 / observed.ratio)\n\
    \  1 / (1 + true.ratio * f.ratio)\n}\n```\n```\n\nLet's try this out on an RF\
    \ fit to a down sampled version of the training data. Below I artificially balance\
    \ the classes by removing rows corresponding to the dominant class (i.e., y =\
    \ 0):\n\n```\n```r\ntrn.1 <- trn[trn$y == 1, ]\ntrn.0 <- trn[trn$y == 0, ]\ntrn.down\
    \ <- rbind(trn.0[seq_len(nrow(trn.1)), ], trn.1)\ntable(trn.down$y)\n#>\n#>  \
    \ 0   1\n#> 5018 5018\n```\n```\n\nNext, I'll fit another (default) RF, but this\
    \ time to the down samples training set. I then apply the adjustment formula to\
    \ the predicted probabilities for the positive class in the test set:\n\n```\n\
    ```r\nset.seed(1146) # for reproducibility\nrfo2 <- ranger(y ~ . - prob, data\
    \ = trn.down, probability = TRUE)\n\n# Predicted probabilities for the positive\
    \ class: P(Y=1|x)\nprob2 <- predict(rfo2, data = tst)$predictions[, 2]\nmean((prob2\
    \ - tst$y) ^ 2) # Brier score\n#> [1] 0.0756\n\nmean((prob2 - tst$prob) ^ 2) #\
    \ MSE\n#> [1] 0.0538\n```\n```"
