- pgno: 352
  md: '+   employs the deep-learning concept of *dropout* to mitigate the problem
    of *overspecialization* [Vinayak and Gilad-Bachrach, 2015].


    With these differences, XGBoost can scale to billions of rows in distributed or
    memory-limited settings (e.g., a single machine), hence the “extreme” in extreme
    gradient boosting. It has also been shown to be more accurate than the more traditional
    implementation of GBM (e.g., the R package **gbm**). There are a number of interfaces
    to XGBoost, including R, Python (with a scikit-learn interface), Julia, Scala,
    Java, Ruby, and C++. There’s also a command-line interface. General tuning strategies
    for XGBoost (with examples in R) are given in Boehmke and Greenwell [2020, Section
    12.5.2]. For more details, including installation, visit the XGBoost GitHub repository
    at https://github.com/dmlc/xgboost.


    In contrast to ordinary GBMs, which use CART-like regression trees for the base
    learners (i.e., splits are determined using the sum of squares criteria described
    in Section 2.3), XGBoost uses a regularized second-order approximation to the
    loss function in its split search algorithm. Let $g_{jb}$ (defined previously
    in Section 8.2) and $h_{jb} = \partial^2 L(y_i, f_{b-1})/\partial f_{b-1}^2$ be
    the gradient and *hessian* (i.e., second-order gradient) values of the loss function
    $L$ at the $b$-th iteration evaluated at the $j$-th observation (what a mouthful!).
    Further, let $I_L$ and $I_R$ be the set of observations in the left and right
    daughter nodes resulting from split $s$. The set of instances in the parent node
    is denoted by $I = I_L \cup I_R$. In XGBoost, splits are selected that result
    in the largest gain (or reduction in loss) which can be written as


    $\mathcal{L}_{split} = \frac{1}{2} \left[ \frac{(\sum_{i \in I_L} g_i)^2}{\sum_{i
    \in I_L} h_i + \lambda} + \frac{(\sum_{i \in I_R} g_i)^2}{\sum_{i \in I_R} h_i
    + \lambda} - \frac{(\sum_{i \in I_I} g_i)^2}{\sum_{i \in I_I} h_i + \lambda} \right]
    - \gamma.$ (8.7)


    For brevity, I dropped the $b$ subscript in $g_i$ and $h_i$. Here, $\gamma \in
    [0, \infty)$ is the minimum gain required to make a further split in the tree,
    with larger values resulting in a more conservative algorithm (i.e., fewer splits).
    Similarly, $\lambda \in [0, \infty)$ can be viewed as an $L_2$ penalty (similar
    to the one used in *ridge regression*), with larger values resulting in a more
    conservative algorithm. Both parameters provide a form regularization that constrains
    the model’s complexity and guards against overfitting. Eventually, XGBoost included
    an additional regularization parameter, $\alpha \in [0, 1)$, which acts as an
    $L_1$ penalty (similar to the one used in the LASSO). Consequently, these can
    be viewed as additional hyperparameters to be tuned.


    Aside from the exhaustive greedy search employed by CART, XGBoost provides an
    optional approximate search algorithm that is more efficient in distributed settings
    or when the data cannot easily fit into memory. In essence, the continuous feature
    values are mapped to buckets formed by the percentiles of each feature’s distribution
    in the training data. The best split for each'
