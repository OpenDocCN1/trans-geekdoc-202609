    in the right side of Figure 2.17. This makes only one possibility for \(\alpha_3
    = (3916/8124 - 120/8124) / (2 - 1) \approx 0.467\), which results in the root
    node after pruning the decision stump, \(\mathcal{T}_{\alpha_3}\). In the end,
    we have the following sequence of \(\alpha\) values: \((\alpha_1 = 0.003, \alpha_2
    = 0.009, \alpha_3 = 0.467)\). In practice, we would use cross-validation, or some
    other validation procedure, to select a reasonable value of the complexity parameter
    \(\alpha\) from this sequence. The next two sections discuss choosing \(\alpha\)
    using \(k\)-fold cross-validation.


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_92_0.png)


    FIGURE 2.17: Optimal subtrees in the sequence with minimum cost-complexity. Since
    the original tree contains only three splits, there are only two possible subtrees,
    not counting the tree with zero splits. Here the category names have been truncated
    to three letters to fit more compactly in the display.'
