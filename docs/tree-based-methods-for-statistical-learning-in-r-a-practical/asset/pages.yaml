    # ## 4.3.2 Priors and misclassification costs


    Like CART, GUIDE can incorporate different priors and unequal misclassification
    costs. See Section 2.2.4 and Loh [2009] for details.


    # ## 4.3.3 Non-constant fits


    Similar to GUIDE for regression, we can increase flexibility by fitting non-constant
    models in the nodes of the classification tree. For increased accuracy, or a greater
    reduction in the size of the tree, Loh [2009] suggests fitting either a kernel
    density estimate or a k-nearest neighbor model to each node. Owing to the flexibility
    of these models, however, GUIDE dispenses with linear splits when allowing non-constant
    fits. When there are weak main effects, but strong two-way interaction effects,
    classification trees constructed with non-constant fits can achieve substantial
    gains in accuracy and tree compactness. Although'
