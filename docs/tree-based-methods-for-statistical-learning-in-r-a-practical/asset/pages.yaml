  md: 'The coin package implements the conditional inference procedures briefly discussed
    in Section 3.3; in short, coin provides a common framework for general tests of
    independence, including: two-sample tests, K-sample tests, and correlation-based
    tests, for continuous, nominal, ordered, and multivariate data.


    If you''re not an R user, then you may be out of luck, as I''m unaware of any
    non-R implementations of CTree—all the more reason to be open to more than one
    opensource language!


    Although there are many differences between `partykit::ctree()` and `party::ctree()`,
    both will produce the same tree almost every time under the default settings.
    For more information on the differences between the two, see Section 7.4 of `partykit`''s
    "ctree: Conditional Inference Trees" vignette, which can be viewed in R by calling
    `utils::vignette("ctree", package = "partykit")`.


    The following examples illustrate the basic use of `party` and `partykit` for
    unbiased recursive partitioning via conditional inference. I''ll confirm the results
    I computed manually in previous sections, as well as construct conditional inference
    trees for new data sets, including both regression and survival examples.


    # ## 3.5.1 Example: New York air quality measurements


    In earlier sections, we used our own `gi.test()` function to split the root node
    of the `airquality` data set. Using conditional inference, we found that the first
    best split occurred with `Temp <= 82`. Now, let''s use `partykit` to apply Algorithm
    3.1, and recursively split the `airquality` data set until we can no longer reject
    the null hypothesis of general independence between `Ozone` and any of the five
    numeric features at the `alpha = 0.05` level.


    You can use `ctree_control()` to specify a number of parameters governing the
    CTree algorithm; in the code chunk below, we stick with the defaults; see `?partykit::ctree_control`
    for a description of all the parameters that can be set. In this chapter, we used
    the quadratic form of the test statistic `c_q` for steps 1)–2) of Algorithm 3.1,
    which is the default in both `party` and `partykit` (`teststat = "quad"`). We
    also stick with the default Bonferroni adjusted `p`-values. To specify `alpha`,
    set either the `alpha` or `mincriterion` arguments in `ctree_control()`, where
    the value of `mincriterion` corresponds to `1 - alpha` (only the `mincriterion`
    argument is available in `party`); both packages use a default significance level
    of `alpha = 0.05`. In `party`''s implementation of `ctree()`, the transformation
    functions `g()` and `h()` can be specified via the `xtrafo` and `ytrafo` arguments,
    respectively; in `partykit`''s implementation, only `ytrafo` is available.'
