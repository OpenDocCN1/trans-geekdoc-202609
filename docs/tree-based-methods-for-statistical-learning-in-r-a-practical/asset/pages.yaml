- pgno: 13
  md: '# Preface


    Welcome to *Tree-based methods for statistical learning (with examples in R)*.
    Tree-based methods, as viewed in this book, refer to a broad family of algorithms
    that rely on *decision trees*, of which this book attempts to provide a thorough
    treatment. This is not a general statistical or machine learning book, nor is
    it an R book. Consequently, some familiarity with both would be useful, but I’ve
    tried to keep the core material as accessible and practical as possible to a broad
    audience (even if you’re not an R programmer or master of statistical and machine
    learning). That being said, I’m a firm believer in learning by doing, and in understanding
    concept through code examples. To that end, almost every major section in this
    book is followed-up by general programming examples to help further drive the
    material home. Therefore, this book necessarily involves a lot of code snippets.


    # Who is this book for?


    This book is primarily aimed at researchers and practitioners who want to go beyond
    a fundamental understanding of tree-based methods, such as decision trees and
    tree-based ensembles. It could also serve as a useful supplementary text for a
    graduate level course on statistical and machine learning. Some parts of the book
    necessarily involve more math and notation than others, but where possible, I
    try to use code to make the concepts more comprehensible. For example, Chapter
    3 involves a bit of linear algebra and intimidating matrix notation, but the math-oriented
    sections can often be skipped without sacrificing too much in the way of understanding
    the core concepts; the adjacent code examples should also help drive the main
    concepts home by connecting the math to simple coding logic.'
  merge: -1
  img_proc: true
