  md: "# 8.9.2 Example: probabilistic predictions with NGBoost (in Python)\n\nIn addition\
    \ to ngboost, I'll require some additional packages: pandas [The Pandas Development\
    \ Team, 2020], for reading and manipulating data; numpy [Harris et al., 2020],\
    \ for basic numeric computations on arrays; and scipy, for basic statistical functions\
    \ (like computing probabilities from distributions). In the Python chunk below,\
    \ I load all the functionality I need before reading in the ALS data and splitting\
    \ it into the same train/test sets used in the previous examples (note that the\
    \ test set indicator used for splitting the data is included as a column named\
    \ testset).\n\n```\nimport numpy as np\nimport pandas as pd\nimport scipy.stats\n\
    from ngboost import NGBoostRegressor\nfrom ngboost.dists import Normal\n```\n\n\
    ```\n# Read in ALS data and split into train/test sets\nurl = \"https://web.stanford.edu/~hastie/CASI_files/DATA/ALS.txt\"\
    \nals = pd.read_csv(url, sep = \"\")\nals_trn = als[als[\"testset\"] == False]\n\
    als_tst = als[als[\"testset\"] == True]\nX_trn = als_trn.drop([\"testset\", \"\
    dFRS\"], axis=1) # features only\nX_tst = als_tst.drop([\"testset\", \"dFRS\"\
    ], axis=1) # features only\n```\n\nNext, I initialize a NGBoostRegressor object,\
    \ called ngb, with several parameters. In this example, I'll assume the distribution\
    \ of dFRS conditional on a set of predictor values is normally distributed with\
    \ some (unknown) mean and standard deviation, but note that ngboost supports several\
    \ other distributions for regression and classification (yes, ngboost can also\
    \ be used for classification tasks as well). As with ordinary GBMs, I also specify\
    \ the number of base estimators and the learning rate. (The default base learner\
    \ in ngboost is a depth-3 regression tree).\n\n```\nngb = NGBoostRegressor(Dist=Normal,\
    \ n_estimators=2000, learning_rate=0.01,\n                           verbose_eval=0,\
    \ random_state=1601)\n```\n\nNow I can fit the actual model by calling the fit()\
    \ on our ngb object. Here, I provide the test set to the validation parameters\
    \ and use early stopping to determine at which iteration (or tree) the procedure\
    \ should stop. Here, the procedure will stop if there has been no improvement\
    \ in the negative log-likelihood (the default scoring rule in ngboost) in five\
    \ consecutive rounds.\n\n```\n_ = ngb.fit(X_trn, Y=als_trn[\"dFRS\"], X_val=X_tst,\n\
    \              Y_val=als_tst[\"dFRS\"], early_stopping_rounds=5)\n```\n\n```\n\
    # => Early stopping achieved.\n```"
