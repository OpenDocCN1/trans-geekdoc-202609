  md: 'To illustrate, I''ll continue with the ALS example from Section 8.9.2°. Below,
    I read in the ALS data and split it into train/test sets using the provided testset
    indicator column; the -1 keeps the indicator column out of the train/test sets.


    ```

    # Read in the ALS data

    url <- "https://web.stanford.edu/~hastie/CASI_files/DATA/ALS.txt"

    als <- read.table(url, header = TRUE)

    ```


    ```

    # Split into train/test sets

    trn <- als[!als$testset, -1] # training data w/o testset column

    tst <- als[als$testset, -1] # test data w/o testset column

    X.trn <- subset(trn, select = -dFRS)

    X.tst <- subset(tst, select = -dFRS)

    y.trn <- trn$dFRS

    y.tst <- tst$dFRS

    ```


    Next, I call on our lsboost() function to fit a GBM using B = 1000 depth-2 trees
    with a shrinkage factor of v = 0.01 and a subsampling rate of 50%. I also compute
    test predictions from each individual tree and compute the cumulative MSE as a
    function of the number of trees. (Warning, the model fitting here will take a
    few minutes.)


    ```

    library(treemisc)

    ```


    ```

    set.seed(1122) # for reproducibility

    lsb.fit <- lsboost(X.trn, y = y.trn, shrinkage = 0.01, ntree = 1000,

    depth = 2, subsample = 0.5)

    ```


    ```

    # Mean squared error function

    mse <- function(y, yhat, na.rm = FALSE) {

    mean((y - yhat) ^ 2, na.rm = na.rm)

    }

    ```


    ```

    # Compute test MSE as a function of the number of trees

    preds.tst <- predict(lsb.fit, newdata = X.tst, individual = TRUE)

    mse.boost <- apply(seq_len(ncol(preds.tst)), FUN = function(ntree) {

    # Only aggregate predictions from first B/ntree trees

    pred.ntree <- rowSums(preds.tst[, seq_len(ntree), drop = FALSE]) +

    lsb.fit$init # don''t forget to add on the initial fit/mean response

    mse(y.tst, yhat = pred.ntree)

    })

    ```


    Next, I''ll call upon the isle_post() function from package treemisc to post-process
    our fitted GBM using the LASSO. There''s one important difference between this
    example and the previous ones applied to bagging and RF: with


    °A special thanks to Trevor Hastie for clarification and sharing code from Efron
    and Hastie [2016, pp. 346–347], which greatly helped in producing this analysis
    (which is a detailed recreation of their example) and building out treemisc''s
    isle_post() function.'
