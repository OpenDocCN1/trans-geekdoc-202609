  md: "method to computing partial dependence using simple data wrangling operations,\
    \ which can be more efficient if you're working in SQL or Spark.\n\nIn essence,\
    \ we can generate all of the modified training copies in a single stacked data\
    \ frame using a cross-join, score it once, then aggregate the predictions into\
    \ the partial dependence values. Below is an example using base R, but it should\
    \ be rather straightforward to translate to data.table [Dowle and Srinivasan,\
    \ 2021], dplyr [Wickham et al., 2021b], SparkR [Venkataraman et al., 2016], sparklyr\
    \ [Luraschi et al., 2021], or any other language that can perform simple cross-joins—provided\
    \ you can hold the resulting Cartesian product in memory! (An example of how to\
    \ accomplish this in Spark is provided in Section 7.9.5).\n\nTo illustrate, I'll\
    \ construct the partial dependence of sale price on both above grade and first\
    \ floor square footage. I still need to construct a grid of points over which\
    \ to construct the plot; here, I'll use a Cartesian product between the percentiles\
    \ of each feature using expand.grid().\n\n```\nx1.grid <- quantile(ames.trn$Gr_Liv_Area,\
    \ prob = 1:30 / 31)\nx2.grid <- quantile(ames.trn$First_Flr_SF, prob = 1:30 /\
    \ 31)\ndf1 <- expand.grid(\"Gr_Liv_Area\" = x1.grid,\n                  \"First_Flr_SF\"\
    \ = x2.grid) # Cartesian product\n```\n\nIn the next step, I perform a cross-join\
    \ between the grid of plotting values (df1) and the original training data with\
    \ the plotting features removed (df2)^b:\n\n```\ndf2 <- subset(ames.trn, select\
    \ = -c(Gr_Liv_Area, First_Flr_SF))\n# Perform a cross-join between the two data\
    \ sets\npd <- merge(df1, df2, all = TRUE) # Cartesian product\ndim(pd) # print\
    \ dimensions\n#> [1] 1845900 81\n```\n\nThen, I simply score the data and aggregate\
    \ by computing the average prediction within each grid point, as shown in the\
    \ example below:\n\n```\npd$yhat <- predict(ames.bag, newdata = pd) # might take\
    \ a few minutes!\npd <- aggregate(yhat ~ Gr_Liv_Area + First_Flr_SF, data = pd,\n\
    \                FUN = mean)\n```\n\nThe code snippet below constructs a false\
    \ color level plot of the data with contour lines using the built-in lattice package;\
    \ the results are displayed in Figure 6.3. Here, you can see the joint effect\
    \ of both features on the predicted sale price.\n\nb BE CAREFUL as the resulting\
    \ data set, which is a Cartesian product, can be quite large!"
