  md: '$f_b (x) \leftarrow f_{b-1} (x) + \nu \sum_{j=1}^{J_b} \gamma_{jb} I (x \in
    R_{jb})$


    where \(\nu \in (0, 1]\) is a shrinkage, or regularization parameter, sometimes
    also referred to as the learning rate. The two parameters \(B\) and \(\nu\) are
    not independent. Each one can control the degree of fit and thus affect the best
    value of the other. Decreasing \(\nu\) increases the best value for \(B\) but
    can also result in an appreciable increase in generalization performance. All
    else held constant, by decreasing the learning rate, you have to fit more trees
    to reach optimal performance, which results in a smoother performance curve. It
    is generally the case that for small shrinkage parameters, say, \(\nu = 0.001\),
    there is a fairly long plateau in which predictive performance is at its best,
    making it harder to overfit compared to using a relatively larger learning rate.


