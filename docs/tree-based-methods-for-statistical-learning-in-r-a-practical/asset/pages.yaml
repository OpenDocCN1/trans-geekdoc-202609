    # ## 2.5 Building a decision tree


    In the previous sections, we talked about the basics of splitting a node (i.e.,
    partitioning some subset of the learning sample). Building a CART-like decision
    tree starts by splitting the root node, and then recursively applying the same
    splitting procedure to every resulting child node until a saturated tree is obtained
    (i.e., all terminal nodes are pure) or other stopping criteria are met. In essence,
    the partitioning stops when at least one of the following conditions are met:


    +   - all the terminal nodes are pure;

    +   - the specified maximum tree depth has been reached;

    +   - the minimum number of observations that must exist in a node in order for
    a split to be attempted has been reached;

    +   - no further splits are able to decrease the overall lack of fit by a specified
    factor;

    +   - and so forth.


    This often results in an overly complex tree structure that overfits the learning
    sample; that is, it has low bias, but high variance.


    To illustrate, consider a random sample of size \( N = 500 \), generated from
    the following sine wave with Gaussian noise:


    ```

    \( Y = \sin(X) + \epsilon, \)

    ```


    where \( X \sim \mathcal{U}(0, 2\pi) \) and \( \epsilon \sim \mathcal{N}(0, \sigma=0.3)
    \). A scatterplot of the data, along with the true response function, is shown
    in Figure 2.12.'
