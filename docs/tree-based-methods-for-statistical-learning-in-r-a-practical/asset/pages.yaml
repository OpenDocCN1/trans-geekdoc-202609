- pgno: 272
  md: 'proximity (i.e., are more similar) to \(\mathbf{x}_0\). Note that most open
    source RF software provide the option to specify case weights for the training
    observations, which are used to weight each row when taking bootstrap samples
    (but many implementations do not provide proximities). While the idea of case-specific
    RFs makes sense, it has a couple of limitations. First off, it requires fitting
    \(N_{tst} + 1\) RFs, which can be expensive whenever \(N\) or \(N_{tst}\) are
    large. Second, it requires computing \(N \times N_{tst}\) proximities from an
    RF, which aren''t always available from software.


    Case-specific RFs are relatively straightforward to implement with traditional
    RF software, provided you can compute proximity scores. The R package **ranger**
