    # ## 3.6 Final thoughts


    CTree is one of the more important developments in recursive partitioning in the
    last two decades; other important developments are discussed in Chapter 4, as
    well as the online complements to this book. In summary, compared to CART, CTree:


    +   - uses adjusted statistical tests to separately determine the split variable
    and split point at each node (CART just uses an exhaustive search);

    +   - provides unbiased split variable selection;

    +   - does not require pruning (or much tuning);

    +   - can naturally take into account the nature of the data—for example, when
    the variables are of arbitrary type (e.g., multivariate, ordered, right-censored,
    etc.).


    If CTree is competitive with CART in terms of accuracy, doesn’t require post pruning,
    and provides unbiased split variable selection, then why is CART still so popular?
    As pointed out in the rejoiner to Loh [2014], “This seems to tie in with a third
    bad effect: Many authors who propose or apply tree algorithms either are not aware
    of—or choose to ignore—similar work in that area. It'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'happens that even recent papers do not refer to work carried out from 2000
    onward, therefore ignoring more than a decade of active development that may be
    highly relevant.” Another important factor is software availability. Many tree
    algorithms do not have easy to use opensource implementations. For example, of
    the 99 tree algorithms considered by Rusch and Zeileis (see their discussion at
    the end of Loh [2014]), roughly one-third had free opensource implementations
    available (including CART and CTree). CART-like decision trees are also broadly
    implemented across a variety of opensource platforms (see Section 2.9). CTree,
    on the other hand, is only available in R—as far as I’m aware.


    Should you be concerned about biased variable selection when using CART-like decision
    trees? Certainly. However, as pointed out in Loh’s rejoiner in Loh [2014], “...selection
    bias may not cause serious harm if a tree model is used for prediction but not
    interpretation, in some situations.” While biased variable selection can lead
    to more spurious splits on irrelevant features, if the sample size is large and
    there are not too many such variables, pruning with cross-validation is often
    effective at removing them.'
  merge: -1
