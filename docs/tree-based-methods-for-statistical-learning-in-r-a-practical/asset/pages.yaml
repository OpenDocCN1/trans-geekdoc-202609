  md: '(i.e., \(L_{i,j} = 1\) for all \(i \neq j\)), \(R(\mathcal{T})\) is simply
    the proportion of observations misclassified in the learning sample.


    Building a tree to minimize \(R(\mathcal{T})\) will always lead to a saturated
    tree, resulting in a model with little or no bias but often high variance (i.e.,
    overfitting the learning sample). Instead, we penalize the complexity (or size)
    of the tree by minimizing


    \(R_\alpha(\mathcal{T}) = R(\mathcal{T}) + \alpha|\mathcal{T}|,\)


    where \(\alpha \ge 0\) is a tuning parameter controlling the trade-off between
    the complexity of the tree, \(|\mathcal{T}|\), and how well it fits the training
    data, \(R(\mathcal{T})\). In this sense, \(R_\alpha(\mathcal{T})\) can be viewed
    as a penalized objective function similar to what''s used in *regularized regression*;
    see, for example, Hastie et al. [2009, Chap. 3] or Bøhmeke and Grewell [2020,
    Chap. 6]. When \(\alpha = 0\), no penalty is incurred, resulting in the most complex
    tree \(\mathcal{T}_0\). On the other extreme, we can always find a large enough
    value of \(\alpha\) that results in a decision tree with no splits (i.e., the
    root node). Choosing the right value of \(\alpha\) is important and can be done
    using cross-validation or other methods; a specific cross-validation approach
    is covered in Section 2.5.2.


    Breiman et al. [1984, Chap. 10] showed that for each \(\alpha\), there exists
    a unique smallest subtree, denoted \(\mathcal{T}_\alpha\), that minimizes \(R_\alpha(\mathcal{T})\).
    This result is important because it guarantees that no two equally sized subtrees
    of \(\mathcal{T}_0\) will have the same value of \(R_\alpha(\mathcal{T})\). To
    obtain \(\mathcal{T}_\alpha\), start pruning \(\mathcal{T}_0\) by successively
    collapsing the internal node that produces the smallest per-node increase to \(R(\mathcal{T})\),
    and continue until reaching the root node. This process results in a (finite)
    sequence of nested subtrees (see Figure 2.14 on page 73 for an example) that contains
    \(\mathcal{T}_\alpha\); for details, see Breiman et al. [1984, Chap. 10] or Ripley
    [1996, Sec. 7.2].


