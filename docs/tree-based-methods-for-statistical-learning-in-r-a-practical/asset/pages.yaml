- pgno: 63
  md: 'Now that we have some notion of node impurity, we can define a measure for
    the quality of a particular split. In essence, the quality of an ordered split
    \( S = \{x, c\} \) (see Figure 2.3), often called the \( gain \) of \( S \), denoted
    \( \Delta \mathcal{I}(S, A) \), is defined as the degree to which the two resulting
    child nodes, \( A_L \) and \( A_R \), reduce the impurity of the parent node \(
    A \):


    ```

    \(\Delta \mathcal{I}(S, A) = p(A) i(A) - [p(A_L) i(A_L) + p(A_R) i(A_R)]\)

    \(= p(A) i(A) - p(A_L) i(A_L) - p(A_R) i(A_R) \). (2.3)

    ```


    Here, \( p(A) \), \( p(A_L) \), and \( p(A_R) \) correspond to the expected proportion
    of new observations in nodes \( A \), \( A_L \), and \( A_R \), respectively.
    For example, we can interpret \( p(A_L) \) as the probability of a case falling
    in the left child node \( A_L \). If \( A \) is the root node, then \( p(A) =
    1 \); otherwise, we can estimate it with \( N_A/N \). For the two-class problem
    (i.e., \( J = 2 \)), we can estimate \( p(A_L) \) and \( p(A_R) \) with the corresponding
    proportion of training cases in \( A_L \) and \( A_R \), respectively. For instance,
    we can estimate \( p(A_L) \) with \( N_{A_L}/N \).


    In essence, we want to find the split \( S \) (i.e., \( x < c \) vs. \( x \ge
    c \)) associated with the maximum gain: \( S_{best} = \arg \max_S \Delta \mathcal{I}(S,
    A) \). To this end, CART performs an exhaustive search through all features and
    potential splits therein, and chooses the split with maximal gain to partition
    \( A \) into two child nodes. This process is then repeated recursively in each
    resulting child node until a *saturated tree* has been constructed (i.e., no more
    splits are possible) or some suitable stopping criteria have been met (e.g., the
    specified maximum depth of the tree has been reached). While CART''s approach
    to choosing the best split seems complicated, we''ll implement it in R from scratch
    and apply it to the Swiss banknote data set in Section 2.2.2.


    # 2.2.1.1 So which is it in practice, Gini or entropy?


    For binary trees, Breiman [1996c] noted that the Gini index tends to prefer splits
    that put the most frequent class into one pure node, and the remaining classes
    into the other. Both entropy and the twoing splitting rules, on the other hand,
    put their emphasis on balancing the class sizes in the two child nodes. In problems
    with a small number of classes (i.e., \( J = 2 \)), the Gini and entropy criteria
    tend to produce similar results.


    Géron [2019, pp.183–184] echoes similar thoughts to Breiman''s: “So should you
    use Gini impurity or entropy? The truth is, most of the time it does not make
    a big difference: they lead to similar trees. Gini impurity is slightly faster
    to compute, so it is a good default. However, when they differ, Gini impurity
    tends to isolate the most frequent class in its own branch of the tree, while
    entropy tends to produce slightly more balanced trees.”'
  merge: -1
