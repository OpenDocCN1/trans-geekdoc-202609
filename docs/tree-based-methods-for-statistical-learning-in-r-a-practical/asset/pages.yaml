- pgno: 34
  md: 'While I have a strong appreciation for the power of base R (i.e., the core
    language), I''m extremely appreciative of, and often rely on, the amazing ecosystem
    of contributed packages. Nonetheless, I''ve decided to keep the use of external
    packages to a minimum (aside from those packages related to the core tree-based
    methods discussed in this book), and instead rely on vanilla R programming as
    much as possible. This choice was made for several (highly opinionated) reasons:


    +   it will make the book easier to maintain going forward, as the code examples
    will (hopefully) continue to work for many years to come without much modification;


    +   using standard R programming constructs (e.g., `for` loops and their apply-style
    functional replacements, like `lapply()`) will make the material easier to comprehend
    for non-R programmers, and easier to translate to other open source languages,
    like Julia and Python;


    +   it emphasizes the basic concepts of the methods being introduced, rather than
    focusing on current best coding practices and cool packages, of which there are
    many. (Please don''t send me hate mail for using `sapply()` instead of `vapply()`
    or the family of map functions available in `purrr` [Henry and Wickham, 2020].)


    Note that I''ve tried to be as aggressive as possible in terms of commenting upon
    the various code snippets scattered throughout this book and the online supplementary
    material. You should pay careful attention to these comments as they often link
    a particular line or section of code to a specific step in an algorithm, try to
    explain a hacky approach I''m using, and so on.


    Each chapter includes one or more software sections, which highlight both R and
    non-R implementations of the relevant algorithms under discussion. Additionally,
    each chapter also contains R-specific software example sections (usually at the
    end of each chapter), which demonstrate use of relevant tree-specific software
    on actual data (either simulated or real).


    There are many great resources for learning R, but I would argue that the online
    manual, “An Introduction to R”, which can be found at https://cran.r-project.org/doc/manuals/r-release/R-intro.html,
    is a great place to start. Book-wise, I think that Matloff [2011] and Wickham
    [2019] are some of the best resources for learning R (note that the latter is
    freely available to read online). If you''re interested in a more hands-on introduction
    to statistical and machine learning with R, I''ll happily self-promote Boehmke
    and Greenwell [2020].'
