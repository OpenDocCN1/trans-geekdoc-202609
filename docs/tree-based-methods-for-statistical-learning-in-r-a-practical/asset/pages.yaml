    (PDPs) can tell us; see Section 6.2.1. In a nutshell, PDPs are low-dimensional
    graphical renderings of the prediction function so that the relationship between
    the outcome and predictors of interest can be more easily understood. PDPs, along
    with other interpretability techniques, are discussed in more detail in Chapter
    6. For now, I''ll just introduce the pdp package [Greenwell, 2021b], and show
