  md: 'implementation of the classification and regression tree (CART)a procedures
    proposed in Breiman et al. [1984]. But don’t let the words “classification” and
    “regression” in the name CART fool you; the procedure is general enough to be
    applied to many different types of data (e.g., categorical, continuous, multivariate,
    count, and censored outcomes). However, the primary focus of this chapter will
    be on standard classification and regression.


    Figure 2.1 shows two separate scatterplots, each of which has been divided into
    three non-overlapping rectangular regions. The left plot contains N = 200 Swiss
    banknotes (Section 1.4.1) that have been identified as either genuine (purple
    circles) or counterfeit (yellow triangles). The x-axis and y-axis correspond to
    the length (in mm) of the top and bottom edges of each bill, respectively. Clearly
    there’s some separation between the classes using just these two features. We
    could use these three regions to classify new banknotes as either genuine or counterfeit
    according to the majority class in whichever region they belong to. For example,
    any banknote that lands in Region 3 will be classified as counterfeit, since the
    majority of training observations that occupy it are counterfeit. In this way,
    the top and right edges of Region 2 form a decision boundary that can be used
    for classifying new Swiss banknotes.


    Similarly, the right plot shows the relationship between temperature (degrees
    F), wind speed (mph), and ozone level (the response, measured in ppb) for the
    New York air quality data (Section 1.4.2); brighter points indicate higher ozone
    readings. The regions were selected in a way that tries to minimize the response
    variance within each, subject to some additional constraints. To predict the ozone
    level for a new data point x, we could use the average response rate from whichever
    region x falls in (i.e., the prediction surface is a step function).


    This is the overall goal of CART, that is, to divide the feature space into non-overlapping
    rectangular regions that have similar response rates in each, which can then be
    used for description or prediction. For example, from a description standpoint,
    we can see that counterfeit Swiss banknotes tend to have abnormally longer top
    and bottom edges.


    In more than two dimensions (i.e., more than two predictors), the disjoint regions
    are formed by hyperrectangles. Why rectangular regions? Rectangular regions are
    simpler and more computationally feasible to find; they also tend to yield a more
    interpretable model that can be represented using a convenient tree diagram. In
    particular, we want the resulting regions to be as homogeneous as possible with
    respect to the response variable. The challenge is in defining the regions. For
    example, how many regions should we use and where should we draw the lines? Obviously
    we could continue refining each


    a As mentioned in Section 1.2, the term “CART” is trademarked; hence, all the
    open source implementations go by other names. For brevity, I’ll use the acronym
    CART to refer to the broad class of implementations that follow the original ideas
    in Breiman et al. [1984], which includes rpart and scikit-learn’s sklearn.tree
    module scikit-learn.'
