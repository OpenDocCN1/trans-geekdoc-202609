  md: '# # Ensemble algorithms


    > > You know me, I think there ought to be a big old tree right there.

    > > And let''s give him a friend. Everybody needs a friend.

    > >

    > > Bob Ross


    This chapter serves as a basic introduction to *ensembles*; specifically, ensembles
    of decision trees, although the ensemble methods discussed in this chapter are
    general algorithms that can also be applied to non-tree-based methods. The idea
    of ensemble modeling is to combine many models together in an attempt to increase
    overall prediction accuracy. As we''ll see in this chapter, how the individual
    models are created and combined differs between the various ensembling techniques.


    Have you ever watched the show *Who Wants to be a Millionaire*? If not, the game
    is very simple. A contestant is asked a series of multiple choice questions (each
    with four choices) of increasing difficulty, with a top prize of $1,000,000. The
    contestant is allowed to use three “lifelines,” a form of assistance to help the
    contestant with difficult questions. Over the years, a number of different lifelines
    were made available (e.g., the contestant could choose to randomly eliminate two
    of the incorrect answers). One of the most useful lifelines (IMO) involved polling
    the audience. If the contestant chose this lifeline, each audience member was
    able to use a device to cast their vote as to what they thought was the correct
    answer. The proportion of votes for each multiple choice answer was displayed
    to the contestant who could then choose to go with the popular vote or not. This
    lifeline was notorious for its accuracy; according to some sources, Regis Philbin
    (one of the hosts) once stated that the audience is right 95% of the time!


    So why was polling the audience so accurate? As it turns out, this phenomenon
    has been observed for centuries and is often referred to as *the wisdom of the
    crowd*. In particular, it is often the case that the aggregated answers from a'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'large, diverse group of individuals is as accurate, if not more accurate, than
    the answer from any one individual from the group. For an interesting example,
    try looking up the phrase "Francis Galton Ox weight guessing" in a search engine.
    Another neat example is to ask a large number of individuals to guess how many
    jelly beans are in a jar, after you''ve eaten a handful, of course. If you look
    at the individual guesses, you''ll likely notice that they vary all over the place.
    The average guess, however, tends to be closer than most of the individual guesses.


    In a way, ensembles use the same idea to help improve the predictions (i.e., guesses)
    of an individual model and are among the most powerful supervised learning algorithms
    in existence. While there are many different types of ensembles, they tend to
    share the same basic structure:


    ```

    f_B (x) = \beta_0 + \sum_{b=1}^B \beta_b f_b (x) , \quad (5.1)

    ```


    where \( B \) is the size of the ensemble, and each member of the ensemble \(
    f_b (x) \) (also called a *base learner*) is a different function of the input
    variables derived from the training data.


    In this chapter, our interests lie primarily in using decision trees for the base
    learners—typically, CART-like decision trees (Chapter 2), but any tree algorithm
    will work. As discussed in Hastie et al. [2009, Section 10.2], many supervised
    learning algorithms (not just ensembles) can be seen as some form of additive
    expansion like (5.1). A single decision tree is one such example of an additive
    expansion. For a single tree, \( f_b (x) = f_b (x; \theta_b) \), where \( \theta_b
    \) collectively represents the splits and split points leading to the \( b \)-th
    terminal node region, whose prediction is given by \( \beta_b \) (i.e., the terminal
    node mean response for ordinary regression trees). Other examples include *single-hidden-layer
    neural networks* and MARS [Friedman, 1991], among others.


    There exist many different flavors of ensembles, and they all differ in the following
    ways:


    +   * the choice of the base learners \( f_b (x) \) (although, in this book, the
    base learners will always be some form of decision tree);

    +   * how the base learners are derived from the training data;

    +   * the method for obtaining the estimated coefficients (or weights) \( \{\beta_b\}_{b=1}^B
    \).


    The ensemble algorithms discussed in this book fall into two broad categories,
    to be discussed over the next two sections: *bagging* (Section 5.1), short for
    **b**ootstrap **agg**regat**ing**), and *boosting* (Section 5.2). First, I''ll
    discuss bagging, one of the simplest approaches to constructing an ensemble.'
