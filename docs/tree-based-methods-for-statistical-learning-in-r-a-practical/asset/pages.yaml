- pgno: 18
  md: 'features in an attempt to make an accurate prediction (or classification).
    For example, “Is systolic blood pressure less than 120 mm Hg?” or “Does it have
    three leaves?”. The answer to each question determines the next follow-up question.
    For example, in trying to determine whether or not a particular plant in your
    backyard is poison ivy, if you answered yes to whether or not it has three leaves”,
    the next question you (or the decision tree) might ask is “Does it have notched
    leaves?”, and so forth. The overall idea is to ask a series of good and intelligent
    questions using the available data that will hopefully lead to an accurate prediction.
    What mostly differs between the various decision tree algorithms I’ll discuss
    in this book is the nature of the questions asked and how they’re determined given
    a set of training observations.


    Compared to other nonparametric algorithms, there’s also a bit more transparency
    in how decision trees make predictions. For example, in classifying poison ivy,
    a decision tree might use a simple rule such as, “If it has three leaves AND and
    the leaves are notched, then it’s likely poison ivy.” Being able to interpret
    the output from a model is crucial in understanding how a model makes predictions
    and conveying the results to others.


    But we don’t often just ask random questions, whether we’re playing twenty questions
    or trying to determine if a particular plant is poison ivy. Our inquiries tend
    to have a hierarchy, in that we often start with the most general questions that
    we think will narrow down the possibilities the most, then follow up with more
    refined questions to home in on the answer. Decision trees work in a similar way
    in that the first handful of questions tends to be the most important, while the
    questions further down the tree are just smaller refinements to further improve
    accuracy.


    I’ll return to talking about trees in Section 1.2. Next, I’ll turn the discussion
    to some basic (but important) ideas in statistical and machine learning.


    # 1.1 Select topics in statistical and machine learning


    This section is intended to provide a (very) brief overview of a handful of topics
    from statistical and machine learning that will be useful to know for some of
    the material to come. Select topics, like the bias-variance tradeoff and right
    censoring, are important to several areas and examples in this book, and so I’ll
    spend the next few sections highlighting some of these important ideas. This is
    by no means intended to act as a primer, or even just a basic introduction to
    statistical and machine learning in general, but rather to highlight key topics


    a “Leaves of three, let it be.” is a common rule of thumb for avoiding contact
    with poison ivy.'
