    data.


    Each plot shows a relatively nonlinear monotonic effect on the predicted log hazard
    rate. For example, the predicted log hazard tends to increase with increasing
    serum bilirubin (mg/dl). The heterogeneity in the individual c-ICE curves for
    some of the predictors (e.g., age) suggests the presence of potential interaction
    effects. We can use Friedman''s H-statistic (Section 6.2.2) to quantify the strength
    of potential pairwise interaction effects. The gbm function interact.gbm() can
    be used to obtain these statistics; see ?gbm::interact.gbm for details. Here,
    I create a simple wrapper function, called gbm.2way(), which uses interact.gbm()
    with R''s built-in combn() function to measure the interaction strength between
    all possible pairs of predictors:


    ```

    gbm.2way <- function(object, data, var.names = object$var.names,

    n.trees = object$n.trees) {

    var.pairs <- combn(var.names, m = 2, simplify = TRUE)

    h <- combn(var.names, m = 2, simplify = TRUE, FUN = function(x) {

    interact.gbm(object, data = data, i.var = x, n.trees = n.trees)

    })

    res <- as.data.frame(t(var.pairs))

    res$h <- h}

    ```'
