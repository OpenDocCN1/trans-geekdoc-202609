    The following subsections highlight some notable extensions to the RF algorithm.
    Note that this is by no means an exhaustive list, so I tried to choose extensions
    that have been shown to be practically useful and that also have available (and
    currently maintained) open source implementations.


    # 7.8.1 Oblique random forests


    As briefly mentioned in Section 4.3.1, linear (or oblique) splits—which are splits
    based on linear combinations of the predictors—can sometimes improve'
