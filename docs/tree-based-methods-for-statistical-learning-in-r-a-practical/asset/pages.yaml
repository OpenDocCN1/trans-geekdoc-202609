    # 7.10 Final thoughts


    Yikes, that was a long chapter, but necessarily so. While RFs were originally
    introduced in Breiman [2001], many of the ideas have been seen before. For example,
    the term “random forest” was actually coined by Ho [1995], who used the random
    subspace method to combine trees grown in random subspaces of the original features.
    Breiman [2001] references several other attempts to further improve bagging by
    introducing more diversity among the trees in a “forest.”


    Leo Breiman was a phenomenal statistician (and theoretical probabilist) who had
    a profound impact on the field of statistical and machine learning. If you’re
    interested in more of his work, especially on the development of RF, and the many
    collaborations it involved, see Cutler [2010]. Adele Cutler, a close collaborator
    with Breiman on RFs, still maintains their original RF website at https://www.stat.berkeley.edu/~breiman/RandomForests/.
    This website is still one of the best references to understanding Breiman’s original
    RF and includes links to several relevant papers and the original Fortran source
    code.'
