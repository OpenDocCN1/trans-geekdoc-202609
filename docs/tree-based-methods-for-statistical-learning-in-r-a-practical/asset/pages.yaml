  md: 'distinct values, CART will consider $k - 1$ potential splits.$^{\text{b}}$
    Typically, the midpoints of any two consecutive unique values are used as potential
    split points; for example, if $x$ has unique values $\{1, 3, 7\}$ in the learning
    sample, then CART will consider $\{2, 5\}$ for potential split points. With $k
    - 1$ potential splits to consider, which one does CART choose to partition the
    data? Ideally, it’d be the split that gives the “best separation” of the class
    labels (e.g., genuine and counterfeit banknotes, or edible and poisonous mushrooms).
    So how do we define the goodness of a particular split? Enter node impurity measures.


    Ideally, we want the two resulting child nodes, $A_L$ and $A_R$, to be as homogeneous
    as possible with respect to the class labels (e.g., all 0s or all 1s, if possible).
    To that end, we’d like to construct some function $i(A)$ that measures the *impurity*
    of a particular node $A$. At one extreme, $A$ could be a *pure node*, that is,
    contain either all 0s or all 1s, in which case $i(A) = 0$. At the other extreme,
    the class labels in $A$ are uniformly distributed (i.e., a 50/50 mix of 0s and
    1s)—this is a worst-case scenario and the worst split possible. In this situation,
    the impurity function, $i(A)$, should be at a maximum.


    Two common measures of node impurity used in CART are the *Gini index* and *cross-entropy*
    (or just *entropy* for short). For a response with $J$ classes, these are defined
    as:


    ```

    i (A) = \left\{ \begin{array}{ll} \sum_{j=1}^J p_j (A) (1 - p_j (A)) & \text{Gini
    index} \\ - \sum_{j=1}^J p_j (A) \log (p_j (A)) & \text{Cross-entropy} \end{array}
    \right., \quad (2.1)

    ```


    where $p_j (A)$ is the expected proportion of observations in $A$ that belong
    to class $j$; note that $i (A)$ is a function of the $p_j (A)$ ($j = 1, 2, \dots,
    J$). To avoid problems with $\log (0)$ in (2.1), we define $0 \log (0) \equiv
    0$.


    Another splitting measure, called the *twoing splitting rule* [Breiman et al.,
    1984, pp. 104–106], is only implemented in proprietary software (at least I’m
    not aware of any open source implementations of CART that support it). The twoing
    method tends to generate more balanced splits than the Gini or cross-entropy methods.
    For a binary response, the twoing criterion is equivalent to the Gini index. See
    Breiman [1996c] for additional details.


    Before continuing, we need to introduce some more notation. Let $N$ be the number
    of observations in the learning sample and $N_j$ be the number of observations
    that belong to class $j$ (i.e., $\sum_{j=1}^J N_j = N$). Similarly, let $N_A$
    be the number of observations in node $A$, and $N_{j,A}$ be the'
