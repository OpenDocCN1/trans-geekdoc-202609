- pgno: 138
  md: '# Algorithm 3.1 Unbiased recursive partitioning via conditional inference.


    +   1) Individually test the null hypothesis of independence between each of the
    \( m \) features \( X_1, X_2, \dots, X_m \) and the response \( Y \) using the
    conditional inference approach outlined in Section 3.3. If none of these hypotheses
    can be rejected at a prespecified \( \alpha \) level, then stop the procedure
    (i.e., no further splits occur). Otherwise, select the predictor \( X_j \) with
    the “strongest association” to \( Y \), as measured by the corresponding multiplicity
    adjusted \( p \)-values (e.g., Bonferroni corrected \( p \)-values).


    +   2) Use \( X_j \), the partitioning variable selected in step 1), to partition
    the data into two disjoint subsets (or child nodes), \( A_L \) and \( A_R \).
    For each possible split \( S \), a standardized test statistic (3.3) is computed,
    and the partition associated with the largest test statistic is used to partition
    the data into two child nodes.


    +   3) Repeat steps 1)–2) in a recursive fashion on the resulting child nodes
    until the global hypothesis in step 1) cannot be rejected at a prespecified \(
    \alpha \) level.


    standard scale by which to compare the strength of association between each feature
    and the response, and results in an unbiased method for selecting split variables,
    regardless of the scale on which each variable is measured [Hothorn et al., 2006c].


    In particular, if we have \( m \) features, \( X_1, X_2, \dots, X_m \), then we
    construct \( m \) general tests of independence \( H_0^j : D(\mathbf{Y}|X_j) =
    D(\mathbf{Y}) \), for \( j = 1, 2, \dots, m \), using the conditional inference
    framework briefly discussed in Section 3.3. The features themselves can be measured
    on different scales; hence, we compare the \( m \) tests on the basis of their
    \( p \)-values. Since this involves multiple hypothesis tests, the \( p \)-values
    need to be adjusted to keep the overall *family-wise error rate* \( \le \alpha
    \). The simplest approach is to use a *Bonferroni adjustment*; that is, multiply
    each \( p \)-value by the total number of tests: \( p_j^* = m \times p_j \), where
    \( m \) is the number of features being considered and \( p_j \) is the \( p \)-value
    from the \( j \)-th test of independence \( H_0^j \). (R has a built-in function
    for adjusting \( p \)-values using a number of different approaches; see `?stats::p.adjust`
    for details.) The predictor associated with the test having the smallest adjusted
    \( p \)-value meeting a pre-selected threshold (\( \alpha \)) is chosen as the
    splitter.


    d For an overview of the problems associated with multiple tests of hypothesis,
    see Shaffer [1995] and Wright [1992]—the latter discusses the use of adjusted
    \( p \)-values.'
