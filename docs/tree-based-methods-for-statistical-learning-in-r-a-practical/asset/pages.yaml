- pgno: 276
  md: 'α-quantile of Y|x as Qα(x). In other words, Pr (Y ≤ y|Qα(x)) = α. Compared
    to the conditional mean, the quantiles give a more useful summary of the distribution.
    For example, α = 0.5 corresponds to the median. If the conditional distribution
    of Y|x were symmetric, then the conditional mean and median would be the same.
    However, if Y|x is skewed, then, compared to the conditional median, the conditional
    mean can be a misleading summary of what a typical value of Y|x is. Furthermore,
    estimating Pr (Y ≤ y|Qα(x)) for various values of α can give insight into the
    variability around a single point estimate, like the conditional median. This
    is the idea behind *quantile regression*.


    The same idea can applied to an RF, and was formerly introduced in Meinshausen
    [2006] as *quantile regression forests* (QRF). In a QRF, the conditional distribution
    of Y|x is approximated by the weighted mean


    ```

    \hat{F}(y|\boldsymbol{x}) = \sum_{i=1}^N w_i(\boldsymbol{x}) I(Y_i \le y) ,

    ```


    where I(expression) is the indicator function that evaluates to one whenever *expression*
    is true, and zero otherwise. The weights w_i(x) are estimated from the terminal
    node observations across all the tress in the forest and are defined in Meinshausen
    [2006]. In contrast to a traditional regression forest, this requires storing
    all the observations in each node, as opposed to just the mean.


    As it turns out, there''s not much difference between QRFs and RFs, aside from
    what information gets stored for each tree and how fitted values and predictions
    are obtained. RFs only need to keep track of the terminal node means. To estimate
    the full conditional distribution of Y|x, QRFs need to retain all observations
    across all terminal nodes.


