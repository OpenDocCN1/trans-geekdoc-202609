  md: "For AdaBoost.M1, we also have to collect and store the \\(\\{\\alpha_b\\}_{b=1}^B\\\
    ) coefficients in order to make predictions later. Note that `predict.rpart()`\
    \ returns a factor—in this case, with factor levels \"-1\" and \"1\"—which needs\
    \ to be coerced to numeric before further processing; this is the purpose of the\
    \ `fac2num()` helper function in the code below⁴:\n\n```\nlibrary(rpart)\n\n#\
    \ Helper function to coerce factors to numeric\nfac2num <- function(x) as.numeric(as.character(x))\n\
    \n# Apply AdaBoost.M1 algorithm\nB <- 500 # number of trees in ensemble\nctrl\
    \ <- rpart.control(maxdepth = 10, xval = 0)\nN <- nrow(spam.trn) # number of training\
    \ observations\nw <- rep(1 / N, times = N) # initialize weights\nspam.ada <- vector(\"\
    list\", length = B) # to store sequence of trees\nalpha <- numeric(B) # hold coefficients\n\
    for (i in seq_len(B)) { # for b = 1, 2, ..., B\n  spam.ada[[i]] <- rpart(type\
    \ ~ ., data = spam.trn, weights = w,\n                         control = ctrl,\
    \ method = \"class\")\n\n  # Compute predictions and coerce factor output to +1/-1\n\
    \  pred <- fac2num(predict(spam.ada[[i]], type = \"class\"))\n  err <- sum(w *\
    \ pred != spam.trn$type) / sum(w) # weighted error\n  if (err == 0 | err == 1)\
    \ { # to avoid log(0) and dividing by 0\n    err <- (1 - err) * 1e-06 + err *\
    \ 0.999999\n  }\n  alpha[i] <- log((1 / err) - 1) # coefficient from step 2) (c)\n\
    \  w <- w * exp(alpha[i] * (pred != spam.trn$type)) # update weights\n}\n```\n\
    \nNext, I'll generate predictions for the test data (`spam.tst`) using the first\
    \ \\(b\\) trees (where \\(b\\) will be varied over the range \\(1, 2, \\dots,\
    \ B\\)) and compute the misclassification error for each; note that I'm using\
    \ the same `err()` function defined in the previous example for bagging:\n\n```\n\
    spam.ada.preds <- sapply(seq_len(B), FUN = function(i) {\n  class.labels <- predict(spam.ada[[i]],\
    \ newdata = spam.tst,\n                          type = \"class\")\n  alpha[i]\
    \ * fac2num(class.labels)\n}) # (N x B) matrix of un-aggregated predictions\n\n\
    # Compute test error as a function of number of trees\nspam.ada.err <- sapply(seq_len(B),\
