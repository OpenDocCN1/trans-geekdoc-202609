    # 2.5.1 Cost-complexity pruning


    The idea of pruning a decision tree is similar to the process of backward elimination
    in multiple linear regression. In essence, we build a large tree with too many
    splits, denoted T0, and then prune it back by collapsing internal nodes until
    we find some optimal subtree, denoted Topt, that meets a certain criterion, like
    having the smallest cross-validation error.


    Let {A_k}_{k=1}^K be the terminal nodes of some tree T, where |T| = K is the number
    of terminal nodes, or size of T. Recall that the overall goal of CART is to extract
    homogenous subgroups (i.e., terminal nodes). In this sense, the overall quality
    (or risk) of the tree depends on the quality of its terminal nodes. We define
    the risk of the tree to be R(T) = sum_{k=1}^K p(A_k) x r(A_k), where r(A_k) is
    some measure of the quality of the k-th terminal node; see (2.4) on page 55. For
    regression trees, R(T) is the error sum of squares (SSE). For classification trees
    based on the observed class priors and equal misclassification costs'
