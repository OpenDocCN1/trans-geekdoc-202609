  md: "# Algorithm 5.3 Stagewise additive modeling\n\n+   1) Initialize $f_b(\\boldsymbol{x}_i;\
    \ \\theta_b) = 0$ (a constant).\n+   \n+   2) For $b = 1, 2, \\dots, B$\n+   \n\
    +      a) Optimize the loss for a single basis function; in particular, solve\n\
    +   \n+      $$\n+      (\\beta_b, \\theta_b) = \\arg \\min_{\\beta_b, \\theta_b}\
    \ \\sum_{i=1}^N L(y_i, f_{b-1}(\\boldsymbol{x}_i) + \\beta f(\\boldsymbol{x}_i;\
    \ \\theta_b)).\n+      $$\n+   \n+      b) Set $f_b(x) = f_{b-1}(\\boldsymbol{x}_i)\
    \ + \\beta_b f(\\boldsymbol{x}_i)$.\n\nderived in an equivalent way that conforms\
    \ to exactly the same structure as (5.1).\n\nThe boosting procedure discussed\
    \ in Chapter 8 follows the forwards stagewise fitting approach more explicitly\
    \ and includes AdaBoost as a special case, so more on this later. The R package\
    \ **gbm** [Greenwell et al., 2021b] (originally by Greg Ridgeway) implements AdaBoost.M1\
    \ via this approach.\n\n# 5.2.5 Software\n\nDifferent flavors of AdaBoost (e.g.,\
    \ Discrete AdaBoost, Real AdaBoost, and Gentle AdaBoost) are available in the\
    \ R package **ada** [Culp et al., 2016]; AdaBoost.M1 and AdaBoost.SAMME are also\
    \ implemented in the R package **adabag**, as well as scikit-learn's **sklearn.ensemble**\
    \ module. While R's implementations utilize CART-like decision trees for the base\
    \ learner (using **rpart**), scikit-learn's implementation allows you to boost\
    \ any compatible scikit-learn model that supports case weights. As mentioned in\
    \ the previous section, the R package **gbm** implements AdaBoost.M1 as a forward\
    \ stagewise additive model; more on **gbm** in Chapter 8.\n\nA boosting strategy\
    \ similar to AdaBoost is used to boost C5.0 decision trees and is available via\
    \ the **C5.0** package."
