    # 5.6 Final thoughts


    Loh [2014] compared the accuracy of single decision trees to tree ensembles using
    both real and simulated data sets. He found that, on average, the best single-tree
    algorithm was about 10% less accurate than that of a tree ensemble. Nonetheless,
    tree ensembles will not always outperform a simpler individual tree [Loh, 2009].
    These points aside, tree ensembles are a powerful class of models that are highly
    competitive in terms of state-of-the-art prediction accuracy. Chapters 7–8 are
    devoted to two powerful tree ensemble techniques.


    It is also worth pointing out that while tree-based ensembles often out perform
    carefully tuned individual trees (like CART, CTree, and GUIDE), they are less
    interpretable compared to a single decision tree; hence, they are often referred
    to as black box models. Fortunately, post-hoc procedures exist that can help us
    peek into the black box to understand the relationships uncovered by the model
    and explain their output to others. This is the topic of Chapter 6.'
