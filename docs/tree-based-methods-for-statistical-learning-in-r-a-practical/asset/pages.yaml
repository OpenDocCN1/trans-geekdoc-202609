  md: 'feature is found by searching through this reduced set of candidate split values.
    For details, see Chen and Guestrin [2016]. A modification for weighted data, called
    a weighted quantile sketch, is also discussed in Chen and Guestrin [2016].


    Around early 2017, XGBoost introduced fast histogram binning (Section 8.7.2) to
    even further push the boundaries of scale and computation speed. In contrast to
    the original approximate tree learning strategy, which generates a new set of
    bins for each iteration, the histogram method re-uses the bins over multiple iterations,
    and therefore is far better suited for large data sets. XGBoost also introduced
    the option to grow trees leaf-wise, as opposed to just level-wise (the default),
    which can also speed up fitting, albeit, at the risk of potentially overfitting
    the training data (Section 8.7.1).


    Sparse data are common in many situations, including the presence of missing values
    and one-hot encoding. In such cases, efficiency can be obtained by making the
    algorithm aware of any sparsity patterns. XGBoost handles sparsity by learning
    an optimal “default” direction at each split in a tree. When an observation is
    missing for one of the split variables, for example, it is simply passed down
    the default branch. For details, see Chen and Guestrin [2016].


    One drawback of XGBoost is that it does not currently handle categorical variables—they
    have to be re-encoded numerically (e.g., using one-hot encoding). However, at
    the time of writing this book, XGBoost has experimental support for categorical
    variables, although it’s currently quite limited. An example of using XGBoost
    is given in Section 8.9.4. Note that XGBoost can also be used to fit RFs in a
    distributed fashion; see the XGBoost documentation for details.


    # 8.8.2 Light Gradient Boosting Machine: LightGBM


    LightGBM [Ke et al., 2017] offers many of the same advantages as XGBoost, including
    sparse optimization, parallel tree building, a plethora of loss functions, enhanced
    regularization, bagging, histogram binning, and early stopping. A major difference
    between the two is that LightGBM defaults to building trees leaf-wise (or best-first).
    Unlike XGBoost, LightGBM can more naturally handle categorical features in a way
    similar to what’s described in Section 2.4. In addition, the LightGBM algorithm
    utilizes two novel techniques, gradient-based one-side sampling (GOSS) and exclusive
    feature bundling (EFB).


    GOSS reduces the number of observations by excluding rows with small gradients,
    while the remaining instances are used to estimate the information gain for each
    split; the idea is that observations with larger gradients play a more important
    role in split selection. EFB, on the other hand, reduces the'
