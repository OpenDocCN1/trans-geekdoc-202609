  md: 'that will help introduce more advanced topics later in the book. This book
    does assume, however, that readers have at least some general background or exposure
    to common topics in statistics and machine learning (like hypothesis testing,
    cross-validation, and hyperparameter tuning). If you''re looking for a more thorough
    overview of statistical and machine learning, I''d suggest starting with James
    et al. [2021]. For a deeper dive, go with Hastie et al. [2009]. Both books are
    freely available for download, if you choose not to purchase a hard copy. Harrell
    [2015] and Matloff [2017], while more statistical in nature, offer valuable takes
    on several concepts fundamental to statistical and machine learning, and I highly
    recommend each.


    # 1.1.1 Statistical jargon and conventions


    To start, let''s introduce ourselves to some of the notation used throughout the
    book; additional mathematical notation will be introduced when necessary in the
    chapters that follow. Since this book is primarily concerned with fitting tree-based
    models for prediction and description, I''ll often be talking about independent
    variables (what we use to predict) and dependent variables (what we want to predict).
    The independent variables are referred to as either features or predictors (maybe
    even as covariatesb or regressors at one point or another). The dependent variable
    is referred to as the response, target, or outcome variable. Generic features
    are denoted by x or x1, x2, and so on, and the response variable using y. In most
    cases, bold symbols typically refer to matrices (usually uppercase Latin letters)
    or column vectors (usually lowercase Latin letters). For example, X typically
    represents an N × p matrix of p features from a data set with N rows (or observations/records);
    xi denotes the i-th row of X, whereas x (or sometimes x0) refers to the p predictor
    values of a (single) generic observation.


    As far as variable types go, this book is mainly concerned with three:


    +   • Nominal categorical (i.e., categorical where the order of categories doesn''t
    matter). Examples include gender, eye color, zip code, or blood type.


    +   • Ordered categorical (i.e., categorical where the order of categories matters).
    Examples include socioeconomic status (e.g., low < middle < high), age range (e.g.,
    [0-10yrs.] < [11-20yrs.] < ...), or satisfaction rating (e.g., not satisfied <
    somewhat satisfied < very satisfied). Ordered categorical variables are sometimes
    referred to as ordinal.


    +   • Ordered numeric. Examples include age or temperature measured on a continuum,
    height, weight, or concentration.


    bTechnically, a covariate refers to a predictor that we think is related to the
    response, but whose effect is not of direct interest (e.g., we may not care to
    interpret its effect, but we include it to improve the overall model; think analysis
    of covariance).'
