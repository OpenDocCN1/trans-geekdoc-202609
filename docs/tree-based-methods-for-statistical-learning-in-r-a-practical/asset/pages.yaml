    that \( \lfloor x \rfloor \) is just \( x \) rounded down to the nearest integer.
    As we''ll see in Section 7.4, generalization performance is typically most sensitive
    to the value of \( m_{try} \), but the default is usually in the ballpark, and
    the tuning space for \( m_{try} \) is simple since \( m_{try} \in \{1, 2, \dots,
    p\} \), where \( p \) is the total number of available features.


