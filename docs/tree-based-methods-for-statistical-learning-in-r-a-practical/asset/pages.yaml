- pgno: 225
  md: "Mathematical gibberish aside, computing partial dependence (6.2) in practice\
    \ is rather straightforward. To simplify, let \\(\\mathbf{z}_s = x_1\\) be the\
    \ predictor variable of interest with unique values \\(\\{x_{1i}\\}_{i=1}^k\\\
    ). The partial dependence of the response on \\(x_1\\) can be constructed by following\
    \ the basic steps outlines in 6.2.\n\n# Algorithm 6.2 A simple algorithm for constructing\
    \ the partial dependence of the response on a single predictor \\(x_1\\).\n\n\
    +   1) For \\(i \\in \\{1, 2, \\dots, k\\}\\):\n+   \n+      (a) Copy the training\
    \ data and replace the original values of \\(x_1\\) with the constant \\(x_{1i}\\\
    ).\n+   \n+      (b) Compute the vector of predicted values from the modified\
    \ copy of the training data.\n+   \n+      (c) Compute the average prediction\
    \ to obtain \\(\\bar{f}_1(x_{1i})\\).\n+   \n+   2) Plot the pairs \\(\\{x_{1i},\
    \ \\bar{f}_1(x_{1i})\\}_{i=1}^k\\).\n\nAlgorithm 6.2 can be quite computationally\
    \ intensive since it involves \\(k\\) passes over the training records. Fortunately,\
    \ the algorithm is trivial to parallelize. It can also be easily extended to larger\
    \ subsets of two or more features as well. See Greenwell [2017] for additional\
    \ details and examples.\n\n# 6.2.1.1 Classification problems\n\nTraditionally,\
    \ for classification problems, partial dependence functions are on a scale similar\
    \ to the logit; see, for example, Hastie et al. [2009, pp. 369—370]. Suppose the\
    \ response is categorical with \\(J\\) levels; then for each class we compute\n\
    \n```\n\\(f_j(x) = \\log [p_j(x)] - \\frac{1}{J} \\sum_{j=1}^J \\log [p_j(x)],\
    \ \\quad j = 1, 2, \\dots, J, \\quad (6.3)\\)\n```\n\nwhere \\(p_j(x)\\) is the\
    \ predicted probability for the \\(j\\)-th class. Plotting \\(f_j(x)\\) helps\
    \ us understand how the log-odds for the \\(j\\)-th class depends on different\
    \ subsets of the predictor variables. Nonetheless, there's no reason partial dependence\
    \ can't be displayed on the raw probability scale. The same goes for ICE plots\
    \ (Section 6.2.3). A multiclass classification example of PD plots on the probability\
    \ scale is given in Section 6.2.6."
