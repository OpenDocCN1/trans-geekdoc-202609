- pgno: 326
  md: '# 8.1 Steepest descent (a brief overview)


    In parametric modeling (i.e., where the form of the prediction function is known
    in advance), we are often concerned with estimating the parameters of a prediction
    function $f(x; \theta)$, where $\theta \in \mathbb{R}^p$ is a $p$-dimensional
    vector of fixed but unknown parameters (e.g., the coefficients in a linear regression
    model). We do this by minimizing the “loss” in using $f(x; \theta)$ to predict
    $y$ on a set of training data, where the loss function is defined as


    ```

    $$ L(\theta) = \sum_{i=1}^N L[y_i, f(x_i; \theta)] . $$

    ```


    The goal is to minimize $L(\theta)$ with respect to $\theta$. A simple example
    is least squares regression, where loss is defined as the sum of squared residuals
    (which I’ll refer to henceforth as LS loss) and is minimized as a function of
    the coefficients $\theta$. LS loss is analytically tractable and easy to solve
    for linear models. A more general approach for any differentiable loss function
    is to use numerical optimization methods to solve


    ```

    $$ \theta^* = \arg \min_{\theta} L(\theta) . \quad (8.1) $$

    ```


    A popular method for solving (8.1) is the method of _steepest descent_, a special
    case of the more general method of _gradient descent_. Gradient descent is a general
    class of iterative optimization algorithms that express the solution to (8.1)
    as a sum of components:


    ```

    $$ \theta^* = \sum_{b=0}^B \theta_b , $$

    ```


    where $\theta_0$ is some initial guess and $\{\theta_b\}_{b=1}^B$ are successive
    “steps” or “boosts” towards the optimal solution $\theta^*$, and are found through
    the update equation


    ```

    $$ \theta_b = \theta_{b-1} + \gamma \Delta \theta_{b-1} , $$

    ```


    where $\Delta \theta_{b-1} = -\partial L(\theta) / \partial \theta$ is the _negative
    gradient_ of $L(\theta)$ with respect to $\theta$ and represents the direction
    of “steepest descent” of $L(\theta)$, and $\gamma > 0$ is the _step size_ taken
    in that direction. Steepest descent methods differ in how $\gamma$ is determined.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Here''s a pretty common analogy for explaining gradient descent without any
    math or fancy notation. Imagine trying to reach the bottom of a large hill (i.e.,
    trying to find the global minimum) blindfolded. Without being able to see, and
    assuming you''re not playing Marco Polo, you''ll have to rely on what you can
    feel on the ground around you (i.e., local information) to find your way to the
    bottom. Ideally you''d feel around the ground at your current location (\(\theta_{b-1}\))
    to get a sense of the direction of steepest descent (\(\Delta \theta_{b-1}\))—the
    fastest way down—and proceed in that direction while periodically reassessing
    which direction to go using the current local information available. How far you
    go in each direction is determined by your step size \(\gamma_b\).


    This simple analogy glosses over a number of details, like getting stuck in a
    hole (i.e., finding a local minimum), but hopefully the basic idea of gradient
    descent is relatively clear: to find the global minimum of \(L(\theta)\), we take
    incremental steps in the direction of steepest descent, provided by the negative
    gradient of \(L(\theta)\) evaluated at the current point. The step size to take
    at each iteration can be fixed or estimated by solving another minimization problem:


    ```

    \gamma_b = \arg \min_{\gamma} L(\theta_{b-1} - \gamma \Delta \theta_b) . \quad
    (8.2)

    ```


    In the latter case, finding \(\gamma_b\) by minimizing (8.2) is referred to as
    the “line search” along the direction of \(\Delta \theta_b\), and the overall
    procedure is referred to as the method of steepest descent. It’s worth noting
    that oftentimes the solution to (8.2) is found via a simple approximation (e.g.,
    using a single Newton-Raphson step).


    # 8.2 Gradient tree boosting


    Now, what does steepest descent have to do with boosting decision trees? Imagine
    trying to find some generic prediction function \(f\) such that


    ```

    f^* = \arg \min_f L(f) ,

    ```


    where \(L(f) = \sum_{i=1}^N L[y_i, f(x_i)]\) is a loss function evaluated over
    the learning sample and encourages \(f\) to fit the data well [James et al., 2021,
    p. 302].


    In contrast to (8.1), the parameters to be optimized here are the \(N\) fitted
    values \(f \in \mathbb{R}^N\) from \(f(x_i)\) found at each iteration evaluated
    at the training data \(x_i\):'
  merge: -1
  img_proc: true
- pgno: 328
  md: '$$ \boldsymbol{f} = \{ f(\boldsymbol{x}_i) \}_{i=1}^N . $$


    Steepest descent in “function space” can be used to find the optimal \(\widehat{\boldsymbol{f}}\)
    as the sum of \(B\) \(N\)-dimensional component vectors:


    $$ \boldsymbol{f}_B = \sum_{b=0}^B \boldsymbol{f}_b, \quad \boldsymbol{f}_b \in
    \mathbb{R}^N, $$


    where, similar to before, \(\boldsymbol{f}_0\) is an initial guess, and each component
    \(\boldsymbol{f}_b\) depends on the current estimate \(\boldsymbol{f}_{b-1}\),
    and so forth. Steepest descent finds the next update using


    $$ \boldsymbol{f}_b = \boldsymbol{f}_{b-1} - \gamma \boldsymbol{g}_b, $$


    where


    $$ \boldsymbol{g}_b = \left\{ \left[ \frac{\partial L(f)}{\partial f} \right]_{f=f_{b-1}(\boldsymbol{x}_i)}
    \right\}_{i=1}^N \quad (8.3) $$


    is a length \(N\) column vector whose \(j\)-th component (\(g_{jb}\)) is the gradient
    of \(L(\boldsymbol{f})\) evaluated at \(f = f_{b-1}(\boldsymbol{x}_j)\).


    One drawback is that the gradient components \(\boldsymbol{g}_b\) in (8.3) are
    only defined at the observed training observations \(\boldsymbol{x}_i\) (\(i=1,2,\dots,N\)),
    whereas we want the final prediction function \(f_M(\boldsymbol{x})\) to be defined
    at new data points; otherwise, how would we make new predictions? Further, the
    procedure does not take into account the fact that observations with similar feature
    values are likely to have similar predictions [Ridgeway, 1999]. To this end, Friedman
    [2001] proposed using a class of functions that make use of the director information
    to approximate the gradient at each step. In gradient tree boosting (the focus
    of this chapter), for example, a regression tree is used to approximate the gradient
    at each step. In particular, at each step, we fit a \(J\)-terminal node regression
    tree\(^\text{b}\), which has the form


    $$ f(\boldsymbol{x}_i; \boldsymbol{\theta}, \boldsymbol{R}) = \sum_{j=1}^J \theta_j
    I(\boldsymbol{x}_i \in R_j), $$


    where \(\boldsymbol{\theta} = \{ \theta_j \}_{j=1}^J\) represents the terminal
    node estimates (i.e., the mean response in each terminal node), \(\boldsymbol{R}
    = \{ R_j \}_{j=1}^J\) represents the disjoint regions'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'that form the $J$ terminal nodes, and $I(\cdot)$ is the usual indicator function
    that evaluates to one whenever its argument is true (and zero otherwise). By fitting
    a model—a regression tree, in this case—to the observed negative gradient means
    we can define it at new data points. Using regression trees, the update becomes


    ```

    f_b (\boldsymbol{x}) = f_{b-1} (\boldsymbol{x}) + \gamma_b \sum_{j=1}^J \theta_j
    I(\boldsymbol{x} \in R_{jb})

    = f_{b-1} (\boldsymbol{x}) + \sum_{j=1}^J \gamma_j I(\boldsymbol{x} \in R_{jb})
    .

    ```


    Consequently, the line search for choosing the step size $\gamma_b$ is equivalent
    to updating the terminal node estimates using the specified loss function:


    ```

    \{\gamma_{jb}\}_{j=1}^J = \arg \min_{\{\gamma_j\}_{j=1}^J} \sum_{i=1}^N L \left[
    y_i, f_{b-1} (\boldsymbol{x}_i) + \sum_{j=1}^J \gamma_j I (\boldsymbol{x} \in
    R_{jb}) \right] . \quad (8.4)

    ```


    Following Friedman [2001], since the $J$ terminal node regions are disjoint, we
    can rewrite (8.4) as


    ```

    \gamma_{jb} = \arg \min_{\gamma} \sum_{\boldsymbol{x}_i \in R_{jb}} L[y_i, f_{b-1}
    (\boldsymbol{x}_i) + \gamma] , \quad (8.5)

    ```


    which is the optimal constant update for each terminal node region, $\{R_{jb}\}_{j=1}^J$,
    based on the specified loss function $L$ and the current iteration $f_{b-1}(\boldsymbol{x}_i)$.
    Solving (8.5) is equivalent to fitting a *generalized linear model* with an *offset*
    [Efron and Hastie, 2016, p. 349]. This step is quite important since, for some
    loss functions, the original terminal node estimates will not be accurate enough.
    For example, with *least absolute deviation* (LAD) loss (see Section 8.2.0.1),
    the observed negative gradient, $\boldsymbol{g}_b$, only takes on integer values
    in $\{-1, 1\}$; hence, the fitted values are not likely to be very accurate. In
    summary, the “line search” step (8.5) modifies the terminal node estimates of
    the current fit to minimize loss.


    c Roughly speaking, an offset is an adjustment term (in this case, a fixed constant)
    to be added to the predictions in a model; this is more common in generalized
    linear models where it’s added to the *linear predictor* with a fixed coefficient
    of one (rather than an estimated coefficient).'
