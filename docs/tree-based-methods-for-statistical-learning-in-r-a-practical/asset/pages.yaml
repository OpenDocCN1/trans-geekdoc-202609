  md: "# Gradient boosting machines\n\n> One step at a time is all it takes to get\
    \ you there.\n> \n> Emily Dickinson\n\nI like RFs because they're powerful and\
    \ flexible, yet conceptually simple: average a bunch of “de-correlated” trees\
    \ together in the hopes of producing an accurate prediction. However, RF is not\
    \ always the most efficient or most accurate tree ensemble to use. Gradient tree\
    \ boosting provides another rich and flexible class of tree-based ensembles that,\
    \ at a high level, I think is also conceptually simple. However, with gradient\
    \ tree boosting, the devil is in the details.\n\nIn Section 5.2.1, we were introduced\
    \ to AdaBoost.M1, a particularly simple boosting algorithm for binary classification\
    \ problems. Boosting initially started off as a way to improve the performance\
    \ of weak binary classifiers. Over time, boosting has evolved into an incredibly\
    \ flexible procedure that, like RFs, can handle a wide array of supervised learning\
    \ problems.\n\nIn this chapter, I’ll walk through the basics of the most currently\
    \ popular flavor of boosting: stochastic gradient boosting, also known as a gradient\
    \ boosting machine (or GBM for short)a. Although GBMs are meant to be more general,\
    \ in this book, GBM generally refers to stochastic gradient boosted decision trees.\n\
    \na.This flavor of boosting goes by several names in the literature. For example,\
    \ the R package gbm [Greenwell et al., 2021b] fits this class of models, but stands\
    \ for generalized boosted models."
