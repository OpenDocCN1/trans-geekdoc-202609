- pgno: 372
  md: "be explored further by using another feature (or features) to help color the\
    \ plot.\n\n```\nshap.age <- data.frame(\"age\" = bank.trn[, \"age\"],\n      \
    \                     \"shap\" = shap.trn[, \"age\"])\n```\n\n```\n# Shapley dependence\
    \ plot for age\ncols <- palette.colors(3, palette = \"Okabe-Ito\")\nggplot(shap.age,\
    \ aes(age, shap)) +\n  geom_point(alpha = 0.1) +\n  geom_smooth(se = FALSE, color\
    \ = cols[2]) +\n  geom_hline(yintercept = 0, linetype = \"dashed\", color = cols[3])\
    \ +\n  xlab(\"Age (years)\") + ylab(\"Shapley value\")\n```\n\n![](img/2c227bfb3620dc3d159fa5e6598afa30_372_0.png)\n\
    \nFIGURE 8.16: Shapley dependence plot for age from the XGBoost model fit to the\
    \ bank marketing data; a nonparametric smooth is also shown (yellow curve). Any\
    \ point below the horizontal dashed blue line corresponds to a negative contribution\
    \ to the predicted outcome).\n\n# ## 8.10 Final thoughts\n\nGBMs are a powerful\
    \ class of machine learning algorithms that can achieve state-of-the-art performance,\
    \ provided you train them properly. Due to the existence of efficient libraries\
    \ (like XGBoost and Microsoft's LightGBM) and"
  merge: -1
