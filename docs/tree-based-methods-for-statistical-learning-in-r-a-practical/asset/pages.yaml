    # ## 8.4.1 Column subsampling


    Column subsampling is another technique that can be used to improve model performance
    and speed up fitting. Similar to column subsampling in an RF, a subsample of columns
    can be used for building each individual tree\(^j\). Apparently subsampling the
    columns prior to building each tree, can reduce the chances of overfitting even
    more than traditional row subsampling [Chen and Guestrin, 2016].


    To illustrate, consider the test MSE curves for the ALS data displayed in Figure
    8.3. In this example, subsampling the columns appears to outperform subsampling
    the rows (here, I arbitrarily chose a subsampling rate of 0.3). In practice these
    parameters need to be tuned, but it''s probably safe and more computationally
    efficient in practice to just deal with one of these two hyperparameters. If you''re
    dealing with a really wide data set, it may be more efficient to consider column
    subsampling, or both column subsampling and row subsampling if you have many rows
    as well.


