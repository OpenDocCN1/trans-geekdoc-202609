    # 2.9.5 Example: letter image recognition


    The goal of this example is to build an image classifier using a simple decision
    tree that incorporates additional information about the true class priors for
    a multiclass outcome with J = 26 classes. The letter image recognition data, which
    are available in R via the mlbench package [Leisch and Dimitriadou., 2021]^v,
    contains 20,000 observations on 17 variables. Each observation corresponds to
    a distorted black-and-white rectangular pixel image of a capital letter from the
    English alphabet (i.e., A–Z). A total of 16 ordered features was derived from
    each image (e.g., statistical moments and edge counts) which were then scaled
    to be integers in the range 0–15. The objective is to identify each letter using
    the 16 ordered features. Frey and Slate [1991] first analyzed the data using Holland-style
    adaptive classifiers, and reported an accuracy of just over 80%.


    To start, I''ll load the data and split it into train/test sets using a 70/30
    split:


    ```

    library(treeisc) # for prune_se()


    data(LetterRecognition, package = "mlbench")

    lr <- LetterRecognition # shorter name for brevity

    set.seed(1051) # for reproducibility

    trn.ids <- sample(nrow(lr), size = 14000, replace = FALSE)

    lr.trn <- lr[trn.ids, ] # training data

    lr.tst <- lr[-trn.ids, ] # test data

    ```


    Next, I''ll use rpart() to fit a classification tree that''s been pruned using
    the 1-SE rule with 10-fold cross-validation, and see how accurate it is on the
    test sample:


    ```

    set.seed(1703) # for reproducibility

    lr.cart <- rpart(letter ~ ., data = lr.trn, cp = 0, xval = 10)

    lr.cart <- prune_se(lr.cart, se = 1) # prune using 1-SE rule


    # Compute accuracy on test set

    pred <- predict(lr.cart, newdata = lr.tst, type = "class")

    sum(diag(table(pred, lr.tst$letter))) / length(pred)

    ```


    ```

    #> [1] 0.813

    ```


    vThe data are also available from the UCI Machine Learning Repository: https://archive.ics.uci.edu/ml/datasets/Letter+Recognition.'
