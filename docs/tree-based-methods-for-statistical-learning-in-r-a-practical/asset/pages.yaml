    Don''t be confused by the fact that the cp values between printcp() (and hence
    the $cptable component of an "rpart" object) and plotcp() don''t match. The latter
    just plots the geometric means of the CP column listed in printcp() (these relate
    to the \(\beta_i\) values used in the k-fold cross-validation procedure described
    in Section 2.5). Any cp value between two consecutive rows will produce the same
    tree. For instance, any cp value between 0.002 and 0.001 will produce a tree with
    five splits. Also, these correspond to a scaled version of the complexity values
    \(\alpha_i\) from Section 2.5. Note that rpart scales the CP column, as well as
    the error columns, by a factor inversely proportional to the risk of the root
    node, so that the associated training error ("rel error") for the root node is
    always one (i.e., the first row in the table); which in this case is 1 / (3916/8124)
    ≈ 2.075. Dividing through by this scaling factor should return the raw \(\alpha_i\)
    values; the first three correspond to the values I computed by hand back in Section
