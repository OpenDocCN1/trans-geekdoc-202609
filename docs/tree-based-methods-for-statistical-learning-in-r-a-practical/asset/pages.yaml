    # ## 2.2.1 Splits on ordered variables


    Let’s first discuss in general how CART finds the “best” split for an ordered
    variable. A hypothetical split S of an arbitrary node A into left and right child
    nodes, denoted A_L and A_R, respectively, is shown in Figure 2.3. If A contains
    N observations, then S partitions A into subsets A_L and A_R with node sizes N_L
    and N_R, respectively; note that N_L + N_R = N. Since the splitting process we’re
    about to describe applies to any node in a tree, we can assume without loss of
    generality that A is the root node, which contains the entire learning sample
    (that is, all of the training data that will be used in constructing the tree).
    For now, I’ll assume that all of the features are ordered, which includes both
    continuous and ordered categorical variables (I’ll discuss splits for nominal
    categorical features in Section 2.4). The first step is to partition the root
    node in a way that “best separates” the individual class labels into two child
    nodes; I’ll discuss ways to measure how well a particular split separates the
    class labels momentarily.


