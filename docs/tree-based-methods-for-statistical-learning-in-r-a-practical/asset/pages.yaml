- pgno: 368
  md: "XGBoost does not work with R data frames. The `xgb.train()` function, in particular,\
    \ only accepts data as an \"xgb.DMatrix\" object. An XGBoost DMatrix is an internal\
    \ data structure used by XGBoost, which is optimized for both memory efficiency\
    \ and training speed; see `?xgboost::xgb.DMatrix` for details. We can create such\
    \ an object using the **xgboost** function `xgb.DMatrix()` (note that I separate\
    \ the predictors and response in the calls to `xgb.DMatrix()`):\n\n```\nlibrary(xgboost)\n\
    \nxnames <- setdiff(names(bank.ohе), \"y\")\ndm.trn <- xgb.DMatrix(bank.trn[,\
    \ xnames], label = bank.trn[, \"y\"])\ndm.tst <- xgb.DMatrix(bank.tst[, xnames],\
    \ label = bank.tst[, \"y\"])\n```\n\nXGBoost has a lot of parameters, so it can\
    \ be helpful to construct a list of such for use when calling the fitting function\
    \ `xgb.train()`. Below, I create a list containing several boosting and tree-specific\
    \ parameters:\n\n```\nparams <- list(\n  eta = 0.01, # shrinkage/learning rate\n\
    \  max_depth = 3,\n  subsample = 0.5,\n  objective = \"binary:logistic\", # for\
    \ predicted probabilities\n  eval_metric = \"rmse\", # square root of Brier score\n\
    \  nthread = 8\n)\n```\n\nFinally, I can fit an XGBoost model. I'll fit two in\
    \ total, one without early stopping and one with, starting with the no early stopping\
    \ version below. But first, I'll define a \"watch list,\" which is just a named\
    \ list of data sets to use for evaluating model performance after each iteration\
    \ that we can use to determine the optimal number of trees ($k$-fold cross-validation\
    \ could also be used via **xgboost**'s `xgb.cv()` function):\n\n```\nwatch.list\
    \ <- list(train = dm.trn, eval = dm.tst)\n\n# Train an XGBoost model without early\
    \ stopping\nset.seed(1100) # for reproducibility\nbank.xgb.1 <-\n  xgb.train(params,\
    \ data = dm.trn, nrounds = 3000, verbose = 0,\n            watchlist = watch.list)\n\
    \n(best.iter <- which.min(bank.xgb.1$evaluation_log$eval_rmse))\n\n#> [1] 1296\n\
    ```\n\nOut of 3,000 total iterations, we really only needed to build 1,296 trees,\
    \ which can be expensive for large data sets (regardless of which fancy scalable\
    \ implementation you use). While XGBoost is incredibly efficient, it is still\
    \ wasteful to fit more trees than potentially necessary. To that end, I can turn\
    \ on early stopping (Section 8.3.1.1) to halt performance once it detects"
  merge: -1
  img_proc: true
- pgno: 369
  md: "the potential for overfitting. In XGBoost, early stopping will halt training\
    \ if model performance has not improved for a specified number of iterations (early_stopping_rounds).\n\
    \nIn the code chunk below, I fit the same model (random seed and all), but tell\
    \ XGBoost to stop the training process if the performance on the test set (as\
    \ specified in the watch list) has not improved for 150 consecutive iterations\
    \ (5% of the total number of requested iterations):\n\n```\nset.seed(1100) # for\
    \ reproducibility\n(bank.xgb.2 <-\n  xgb.train(params = dm.trn, nrounds = 3000,\
    \ verbose = 0,\n            watchlist = watch.list, early_stopping_rounds = 150))\n\
    ```\n\n```\n## ######## xgboost\n## > raw: 1.7 Mb\n## > xgb.attributes:\n## >\
    \ best_iteration, best_msg, best_ntreelimit, best_score, niter\n## > niter: 1445\n\
    ## > best_ntreelimit : 1296\n## > best_iteration : 1296\n## > best_score : 0.274\n\
    ## > best_msg : [1296] train-rmse:0.274552 eval-rmse:0.273857\n```\n\nIn this\
    \ case, using early stopping resulted in the same optimal number of trees (e.g.,\
    \ 1,296), but only required 1,446 boosting iterations (or trees) in total, a decent\
    \ savings in terms of both computation time and storage space (1.7 Mb for early\
    \ stopping compared to 3.6 Mb for the full model)! The overall training results\
    \ are displayed in Figure 8.14 below.\n\n```\npalette(\"Okabe-Ito\")\nplot(bank.xgb.1$evaluation_log[,\
    \ c(1, 2)], type = \"l\",\n     xlab = \"Number of trees\",\n     ylab = \"RMSE\
    \ (square root of Brier score)\")\nlines(bank.xgb.1$evaluation_log[, c(1, 3)],\
    \ type = \"l\", col = 2)\nabline(v = best.iter, col = 2, lty = 2)\nabline(v =\
    \ bank.xgb.2$niter, col = 3, lty = 2)\nlegend(\"topright\", legend = c(\"Train\"\
    , \"Test\"), inset = 0.01, bty = \"n\",\n       lty = 1, col = 1:2)\npalette(\"\
    default\")\n```\n\nUnlike R's gbm package or Python's sklearn.inspection module,\
    \ XGBoost does not support the recursion method for fast PD and ICE plots. However,\
    \ XGBoost does support Tree SHAP (Section 6.3.2.1), which we can use to construct\
    \ Shapley-based variable importance and dependence plots. In R, these can be obtained\
    \ at prediction time by specifying predcontrib = TRUE in the call to predict().\n\
    \nI've seen several online blog posts suggest a value of early_stopping_rounds\
    \ equal to 10% of the total number of requested iterations, but no evidence or\
    \ citations as to why."
  merge: -1
  img_proc: true
- pgno: 370
  md: "![](img/2c227bfb3620dc3d159fa5e6598afa30_370_0.png)\n\nFIGURE 8.14: RMSE (essentially,\
    \ the square root of the Brier score) from an XGBoost model fit to the bank marketing\
    \ data. According to the independent test set (yellow curve), the optimal number\
    \ of trees is 1,296 (vertical dashed yellow line). Early stopping, which reached\
    \ the same conclusion, would’ve stopped training at 1,446 trees (vertical dashed\
    \ blue line), which roughly halves the training time in this case.\n\nBelow, I\
    \ compute Tree SHAP values for the entire training set and use that to form Shapley-based\
    \ variable importance scores; here, I’ll follow Lundberg et al. [2020] and the\
    \ shap module’s approach by computing the mean absolute Shapley value for each\
    \ column. (Note that it is not necessary to use the entire learning sample for\
    \ doing this, and a large enough subsample should often suffice, especially when\
    \ dealing with hundreds of thousands or millions of records.) A dot plot of the\
    \ top 10 Shapley-based importance scores is displayed in Figure 8.15. Note that\
    \ I need to specify the optimal number of trees (ntreelimit = best.iter) when\
    \ calling predict():\n\n```\nshap.trn <- predict(bank.xgb, newdata = dm.trn, ntreelimit\
    \ = best.iter,\n                    predcontrib = TRUE, approxcontrib = FALSE)\n\
    shap.trn <- shap.trn[, -which(colnames(shap.trn) == \"BIAS\")]\n\n# Shapley-based\
    \ variable importance\nshap.vi <- colMeans(abs(shap.trn))\nshap.vi <- shap.vi[order(shap.vi,\
    \ decreasing = TRUE)]\ndotchart(shap.vi[1:10], xlab = \"mean(|SHAP value|)\",\
    \ pch = 19)\n```\n\nFor comparison, I computed the usual aggregated tree-based\
    \ importance scores from the boosted model; this is what’s given by the Gain column\
    \ in the"
  merge: -1
  img_proc: true
