    ```


    Specifying a loss matrix in `rpart` isn''t well-documented, unfortunately. For
    binary outcomes, the matrix has the following structure:


    \( L = \begin{bmatrix} TP & FP \\ FN & TN \end{bmatrix}, \)


    where rows represent the observed classes and columns represent the assigned classes.
    Here, TP, FP, FN, and TN stand for *true positive*, *false positive*, *false negative*,
    and *true negative*, respectively; for example, a false negative is the case in
    which the tree misclassifies a 1 as a 0. The order of the rows/columns correspond
    to the same order as the categories when sorted alphabetically or numerically.


    Since there is no cost for correct classification, we take \( TP = TN = 0 \).
    Setting \( FP = FN = c \), for some constant \( c \) (i.e., treat FPs and FNs
    equally), will always result in the same splits (although, the internal statistics
    used in selecting the splits will be scaled differently). When misclassification
    costs are not equal, specify the appropriate values in the loss matrix. For example,
    the following tree would treat false negatives (i.e., misclassifying poisonous
    mushrooms as edible) as five times more costly than false positives (i.e., misclassifying
    edible mushrooms as poisonous). We could also obtain the same tree by computing
    the altered priors based on this loss matrix and supplying them via the `parms`
    argument, but this is left as an exercise to the reader.


    ```

    ```r

    levels(mushroom$Edibility) # inspect order of levels

    (loss <- matrix(c(0, 5, 1, 0), nrow = 2)) # loss matrix

    rpart(Edibility ~ ., data = mushroom, parms = list("loss" = loss))

    ```

