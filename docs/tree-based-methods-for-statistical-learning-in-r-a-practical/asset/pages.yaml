- pgno: 23
  md: '# 1.1.2.3 Classification vs. regression


    Supervised learning tasks generally fall into one of two categories: classification
    or regression. Regression is used in a very general sense here, and often refers
    to any supervised learning task with an ordered outcome. Examples of ordered outcomes
    might be sale price or wine quality on a scale of 0–10 (essentially, an ordered
    category).


    In classification, the response is categorical and the objective is to “classify”
    new observations into one of J possible categories. In the mushroom classification
    example (Section 1.4.4), for instance, the goal is to classify new mushrooms as
    either edible or poisonous on the basis of simple observational attributes about
    each (like the color and odor of each mushroom). In this example, J = 2 (edible
    or poisonous) and the task is one of binary classification. When J > 2, the task
    is referred to as multiclass classification.


    # 1.1.2.4 Discrimination vs. prediction


    Pure classification is almost never the goal, as we are usually not interested
    in directly classifying observations into one of J categories. Instead, interest
    often lies in estimating the conditional probability of class membership. That
    is to say, it is often far more informative to estimate {Pr(Y = j|x0)}j=1J as
    opposed to predicting the class membership of some observation x0. Even when the
    term “classification” is used, the underlying goal is usually that of estimating
    class membership probabilities conditional on the feature valuesd.


    Frank Harrell, a prominent biostatistician, couldn’t have said it better:


    > > It is important to distinguish prediction and classification. In many decision
    making contexts, classification represents a premature decision, because classification
    combines prediction and decision making and usurps the decision maker in specifying
    costs of wrong decisions. The classification rule must be reformulated if costs/utilities
    or sampling criteria change. Predictions are separate from decisions and can be
    used by any decision maker.


    Classification is best used with non-stochastic/deterministic outcomes that occur
    frequently, and not when two individuals with identical inputs can easily have
    different outcomes. For the latter, modeling tendencies (i.e., probabilities)
    is key.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Classification should be used when outcomes are distinct and predictors are
    strong enough to provide, for all subjects, a probability near 1.0 for one of
    the outcomes.


    Frank Harrell

    https://www.fharrell.com/post/classification/


    A related issue, known as class imbalance is discussed in Section 7.9.4.


    # 1.1.2.5 The bias-variance tradeoff


    The terms overfitting and underfitting are used throughout this book (more so
    the former), but what do they mean? Overfitting occurs when your model is too
    complex, and has gone past any signal in the data and is starting to fit the noise.
    Underfitting, on the other hand, refers to when a model is too simple and does
    not adequately capture any of the signal in the data. In both cases, the model
    will not generalize well to new data.


    A model that is overfitting the learning sample often exhibits lower bias but
    has higher variance when compared to a model that is underfitting, which often
    exhibits higher bias but lower variance. This tradeoff is more specifically referred
    to as the bias-variance tradeoff. Excellent discussions of this topic can be found
    in Matloff [2017, Sec. 1.11] and Hastie et al. [2009, Sec. 7.2–7.3]; the latter
    provides more of a theoretical view.


    For the additive error model (1.1) with constant variance \(\sigma^2\), Hastie
    et al. [2009] show that the mean square prediction error for an arbitrary observation
    \(\boldsymbol{x}_0\) can be decomposed into


    ```

    \(\text{E} \left[ \left( Y - \hat{f}(\boldsymbol{x}_0) \right)^2 \mid \boldsymbol{x}
    = \boldsymbol{x}_0 \right] = \sigma^2 + \text{Bias}^2 \left[ \hat{f}(\boldsymbol{x}_0)
    \right] + \text{V} \left[ \hat{f}(\boldsymbol{x}_0) \right] ,\)

    ```


    where \(\sigma^2\) represents irreducible error that we cannot do anything about,
    regardless of how well we estimate \(f(\boldsymbol{x}_0)\). Normally, increasing
    the complexity of \(\hat{f}\) will cause the squared bias (middle term) to decrease
    and the variance (last term) to increase, and vice versa.


    For illustration, consider the data displayed in Figure 1.1, which consists of
    a random sample of \(N = 100\) observations from a simple quadratic model with
    additive Gaussian noise:


    ```

    \(Y = 1 + 0.5X^2 + \epsilon ,\)

    ```


    where \(X \sim \mathcal{U}(0, 1)\), and \(\epsilon \sim \mathcal{N}(0, \sigma
    = 0.1)\). Figure 1.1 also shows the fitted mean response from three linear models:
    a simple linear regression model'
