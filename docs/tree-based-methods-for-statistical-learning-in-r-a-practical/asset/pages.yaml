- pgno: 197
  md: '# 5.1 Bootstrap aggregating (bagging)


    Bagging [Breiman, 1996a] is a *meta-algorithm* based on aggregating the results
    from multiple bootstrap samples. In the context of machine learning, this means
    aggregating the predictions from different base learners derived from independent
    bootstrap samples. When applied to unstable learners that are adaptive to the
    data, like overgrown/unpruned decision trees, the aggregated predictions can often
    be more accurate than the individual predictions from a single base learner trained
    on the original learning sample.


    While bagging is a general algorithm, and can be applied to any type of base learner,
    it is most often successfully applied to decision trees, in particular, trees
    that have been fully grown to near-maximal depth without any pruning. As we learned
    in Chapter 2, unpruned decision trees are considered unstable learners and have
    high variance (i.e., the predictions will vary quite a bit from sample to sample),
    which often results in overfitting and poor generalization performance. However,
    through averaging, bagging can often stabilize and reduce variance while maintaining
    low bias, which can result in improved performance.


    We''ll illustrate the effect of bagging through a simple example. Consider a training
    sample of size $N = 500$ generated from the following sine wave with Gaussian
    noise:


    $Y = \sin(X) + \epsilon,$


    where $X \sim \mathcal{U}(0, 2\pi)$ and $\epsilon \sim \mathcal{N}(0, \sigma =
    0.3)$. Figure 5.1 (left) shows the prediction surface from a single (overfit)
    decision tree grown to near full depth.$^a$ In contrast, Figure 5.1 (right) shows
    a bagged ensemble of $B = 1000$ such trees whose predictions have been averaged
    together; here, each tree was induced from a different bootstrap sample of the
    original data points. Clearly the individual tree is too complex (i.e., low bias
    and high variance) and will not generalize well to new samples, but averaging
    many such trees together resulted in a smoother, more stable prediction. The MSE
    from an independent test set of 10,000 observations was 0.173 for the single tree
    and 0.1 for the bagged tree ensemble; the optimal MSE for this example is $\sigma^2
    = 0.3^2 = 0.09$.


    The general steps for bagging classification and regression trees are outlined
    in Algorithm 5.1. To help further illustrate, a simple schematic of the process
    for building a bagged tree ensemble with four trees is given in Figure 5.2. Note
    that bagged tree ensembles can be extended beyond simple classification and regression
    trees. For example, it is also possible to bag *survival trees* [Hothorn


    $^a$In this example, each tree was fit using rpart() with minsplit = 2 and cp
    = 0.'
