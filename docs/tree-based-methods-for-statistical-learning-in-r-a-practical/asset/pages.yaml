    To get a sense of a predictor''s effect on the model output, in terms of Shapley
    values, we can construct a Shapley dependence plot; this is nothing more than
    a plot of a feature''s Shapley values against the raw feature values in a particular
    sample. Below, I construct a Shapley dependence plot for age (Figure 8.16); a
    nonparametric smooth is also displayed (yellow curve). Here, you can see that
    individuals in the age range 30–50 (roughly) generally correspond to negative
    Shapley values, meaning they tend to drive the predicted probability of subscribing
    towards the average baseline. Whereas younger and older individuals tend to have
    age contribute a positive effect. The non-constant variance in the scatter plot
    suggests potential interaction effects, which could'
