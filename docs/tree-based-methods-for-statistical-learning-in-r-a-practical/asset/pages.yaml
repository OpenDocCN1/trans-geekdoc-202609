    with predictor \( x \) at node \( t \). The variable importance score for \( x
    \) is


    \(\text{VI}(x) = \sum_t \sqrt{N_t}q_t(x) ,\)


    where \( N_t \) is the sample size in node \( t \); see Loh [2012] for details.
    Later, Loh et al. [2015] suggest using \( N_t \) rather than its square root to
    weight the chi-square statistics, which increases the probability that the feature
    used to split the root node has the largest importance score. This approach is
    approximately unbiased unless there is a mix of both ordered and nominal categorical
    variables. Loh and Zhou [2021] provide an improved version for regression that
    ensures unbiasedness.


    While there are a number of approaches to computing variable importance (especially
    from decision trees), few include thresholds for identifying the irrelevant (or
    pure noise) features. In GUIDE, any feature \( x \) with a variable importance
    score less than the 0.95-quantile of the approximate null distribution of \(\text{VI}(x)\)
    is considered unimportant. For example, running GUIDE in variable importance mode
    (with default settings, which caps the total number of splits at four) on the
    Ames housing data flagged 64 of the 80 features as being highly important, 4 as
    being less important, and 12 as being unimportant. The results are displayed in
    Figure 4.6 (p. 174).


    As previously mentioned, the GUIDE software continues to evolve and the details
    mentioned above may not correspond exactly with what''s currently implemented.
    Fortunately, Loh and Zhou [2021] give a relatively recent account of GUIDE''s
    approach to variable importance, and provide a thorough comparison against other
    tree-based approaches to computing variable importance, including CART, CTree,
    and many of the tree-based ensembles discussed later in this book.


    # ## 4.8 Ensembles


    Although I''ll defer the discussion of ensembles until Chapter 5, it''s worth
    noting that GUIDE supports two types of GUIDE-based tree ensembles: *bagging*
    (Section 5.1) and random forest (Chapter 7).'
  merge: -1
  img_proc: true
