    In many cases, predictors that weren''t used in the tree will have a non-zero
    importance score. The reason is that surrogate splits are also incorporated into
    the calculation. In particular, a variable may effectively appear in the tree
    more than once, either as a primary or surrogate splitter. The variable importance
    measure for a particular feature is the sum of the gains associated with each
    split for which it was the primary variable, plus the gains (adjusted for agreement)
    associated with each split for which it was a surrogate. You can turn off surrogates
    by setting `maxsurrogate = 0` in `rpart.control()`.


    How does _k_-fold cross-validation (Section 2.5.2) in **rpart** work? The `rpart()`
    function does internal 10-fold cross-validation by default. According to **rpart**''s
    documentation, 10-fold cross-validation is a reasonable default, and has been
    shown to be very reliable for screening out “pure noise” features. The number
    of folds (_k_) can be changed, however, using the `xval` argument in `rpart.control()`.


    You can visualize the cross-validation results of an "rpart" object using `plotcp()`,
    as illustrated in Figure 2.21 for the `mushroom.tree` object. A good rule of thumb
    in choosing `cp` for pruning is to use the leftmost value for which the average
    cross-validation score lies below the horizontal line; this coincides with the
    1-SE rule discussed in Section 2.5.2.1. The columns labeled "`xerror`" and "`xstd`"
    provide the cross-validated risk and its corresponding standard error, respectively
    (Section 2.5).


    ```

    plotcp(mushroom.tree, upper = "splits", las = 1) # Figure 2.21

    mushroom.tree$cptable # print cross-validation results

    ```


