  md: 'Suppose, for whatever reason, we considered misclassifying a yes as a no (i.e.,
    predicting that someone will not default on their next payment, when in fact they
    did) to be five times more costly than predicting a no as a yes. In GUIDE, it’s
    as easy as setting up a loss matrix text file. For this example, I created a file
    called credit_loss.txt (in the same /guide-v38.0/credit directory as before) with
    the following two lines:


    ```

    0 5

    1 0

    ```


    This corresponds to the following loss (or misclassification cost) matrix


    | | No | Yes |

    |---|---|---|

    | No | 0 | 5 |

    | Yes | 1 | 0 |


    where \( L_{i,j} \) denotes the cost of classifying an observation as class \(
    i \) when it really belongs to class \( j \). Note that GUIDE sorts the class
    values in alphabetical order (i.e., "no" then "yes"). Re-running the previous
    program, but specifying the cost matrix file when prompted, leads to the much
    more useful tree structure shown in Figure 4.8. Although the overall test accuracy
    dropped from 82.21% to 60.00%, the accuracy within the class of interest (the
    true positive rate or sensitivity) increased from 7.49% to 17.79%—a significant
    improvement. I’ll leave it to the reader to explore further with linear splits
    and non-constant fits to see if the results can be improved further.


    # 4.10 Final thoughts


    This chapter introduced the GUIDE algorithm for building classification and regression
    trees. GUIDE was developed to solve three problems often encountered with exhaustive
    search procedures (like CART):


    +   1. split variable selection bias;

    +   2. insensitivity to local interactions;

    +   3. overly complex tree structures.


    Like CTree, GUIDE solves the first problem by decoupling the search for split
    variables from the split point selection using statistical tests; in contrast
    to CTree, GUIDE exclusively uses one-df chi-square tests throughout. In selecting
    the splitting variable, GUIDE also looks at two-way interaction effects that can
    potentially mask the importance of a split when only main effects are considered.
    Moreover, GUIDE can often produce smaller and more accurate tree'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'structures by allowing splits in linear combinations of (two) predictors, and
    fitting more complex (i.e., non-constant) models in the nodes (e.g., k-nearest
    neighbor or polynomial regression). Although this can lead to much shorter tree
    structures, the trees themselves are not necessarily simpler to interpret (e.g.,
    is the GUIDE-based regression tree for the Ames housing example based on stepwise
    regression fits actually that simple to interpret?). Fortunately, the post-hoc
    interpretation procedures outlined in Chapter 6 are model-agnostic, and allow
    us to easily interpret various aspects of any supervised learning model (including
    GUIDE-based decision trees with complex terminal node summaries).


    GUIDE is not just for simple classification and regression problems, and can be
    used in all sorts practical situations, including:


    +   - quantile regression;

    +   - Poisson regression (i.e., for modeling count data and rates);

    +   - multivariate outcomes;

    +   - censored outcomes;

    +   - longitudinal data [Loh and Zheng, 2013] (e.g., when multiple subjects are
    continually measured over time);

    +   - propensity score grouping;

    +   - variable reduction;

    +   - subgroup identification [Loh et al., 2015];

    +   - and more.


    For more, visit Wei-Yin Loh''s website at http://pages.stat.wisc.edu/~loh/guide.html.
    An example of the effectiveness of riluzole, a drug approved for the treatment
    of ALS (Amyotrophic Lateral Sclerosis) by the US FDA, can be found in Loh and
    Zhou [2020]g.'
