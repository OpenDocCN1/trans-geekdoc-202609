    line program. Compiled binaries for QUEST, CRUISE, and GUIDE are freely available
    from http://pages.stat.wisc.edu/~loh/guide.html and are compatible with most major
    operating systems. If you''re comfortable with the terminal, GUIDE is straightforward
    to install and use; see the available manual for installation specifics and example
    usage. Although it''s a terminal application, GUIDE will optionally generate R
    code that can be used for scoring after a tree has been fit. This makes it easy
    to run simulations and the like after the tree has been built. My only criticism
    of GUIDE is that it''s not currently available via easy-to-use open source code
    (like R or Python); if it were, it''d probably be much more widely adopted by
    practitioners.


    As discussed in the previous section, GUIDE is a command line program that requires
