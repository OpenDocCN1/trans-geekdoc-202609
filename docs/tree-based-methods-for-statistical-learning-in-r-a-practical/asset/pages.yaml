  md: '+   - correlation tests, similar to the Pearson and Spearman''s rank correlation
    tests;

    +   - two-sample tests, similar to the $t$-test and Wilcoxon rank-sum test;

    +   - more general $K$-sample tests, similar to the one-way ANOVA $F$-test and
    Kruskal-Wallis test;

    +   - independence tests for contingency tables of arbitrary dimension;

    +   - and many more.


    Typically, $g()$ and $h()$ are chosen to be the identity function (e.g., $g(\mathbf{X}_i)
    = \mathbf{X}_i$).


    Any test of $H_0$ based on (3.1) requires knowledge of the sampling distribution
    of $\mathbf{T}$, which is rarely (if ever) known in practice. However, under the
    null hypothesis ($H_0$), we can dispose of this dependency by fixing the predictor
    values, and *conditioning* on all possible permutations $S$ of the response values—whence
    the term conditional inference. This principle leads to test procedures known
    as permutation tests.


    Let $\mu_h = \text{E}(h(\mathbf{Y}_i)|S) = \sum_{i=1}^N h(\mathbf{Y}_i)/N$ be
    the conditional expectation for the influence function with corresponding \(q
    \times q\) covariance matrix


    ```

    \Sigma_h = \text{V}(h(\mathbf{Y}_i)|S)

    = \sum_{i=1}^N [h(\mathbf{Y}_i) - \text{E}(h(\mathbf{Y}_i)|S)] [h(\mathbf{Y}_i)
    - \text{E}(h(\mathbf{Y}_i)|S)]^\top .

    ```


    Strasser and Weber [1999] derived the conditional mean (\(\mu\)) and variance
    (\(\sigma^2\)) of \(\mathbf{T}|S\), which are:


    ```

    \mu = \text{E}(\mathbf{T}|S) = \text{vec} \left( \left( \sum_{i=1}^N g(\mathbf{X}_i)
    \right) \mu_h^\top \right) \in \mathbb{R}^{pq \times 1},


    \sigma^2 = \text{V}(\mathbf{T}|S) = \frac{N}{N-1} \text{V}_h \otimes \left( \sum_{i=1}^N
    g(\mathbf{X}_i) \otimes g(\mathbf{X}_i)^\top \right)

    - \frac{1}{N-1} \text{V}_h \otimes \left( \sum_{i=1}^N g(\mathbf{X}_i) \right)
    \otimes \left( \sum_{i=1}^N g(\mathbf{X}_i) \right)^\top \in \mathbb{R}^{pq \times
    pq},

    (3.2)

    ```


    where \(\otimes\) denotes the *Kronecker product*. While the equations listed
    in (3.1)–(3.2) might seem very complex, they simplify quite a bit in many standard
    situations—specific examples are given in Sections 3.3.1–3.3.2.'
