  md: "![](img/2c227bfb3620dc3d159fa5e6598afa30_297_0.png)\n\nFIGURE 7.20: Test RMSE\
    \ for the RFO and RFO.4.5 fits. The dashed lines correspond to the post-processed\
    \ versions of each model. Note how the RFO model only experienced a marginal increase\
    \ in performance compared to the RFO.4.5 model.\n\ntimating the optimal value\
    \ for the penalty parameter \\(\\lambda\\) (it might be helpful to read the help\
    \ page for ?glmnet::coef.glmnet):\n\n```\nres <- rfo.4.5.post$results # post-processing\
    \ results on test set\nlambda <- res[which.min(res$mse), \"lambda\"] # optimal\
    \ penalty parameter\ncoefs <- coef(rfo.4.5.post$lasso.fit, s = lambda)[, 1L]\n\
    int <- coefs[1L] # intercept\ntree.coefs <- coefs[-1L] # no intercept\ntrees <-\
    \ which(tree.coefs == 0) # trees to remove\n\n# Remove trees corresponding to\
    \ zeroed-out coefficients\nrfo.4.5.def <- deforest(rfo.4.5, which.trees = trees)\n\
    \n# Check size of each object\nc(\n  \"RFO.4.5\" = format(object.size(rfo.4.5),\
    \ units = \"MB\"),\n  \"RFO.4.5 (deforested)\" = format(object.size(rfo.4.5.def),\
    \ units = \"MB\")\n)\n\n#>\n#>   RFO.4.5 RFO.4.5 (deforested)\n#>   \"1 Mb\" \"\
    0.1 Mb\"\n```"
