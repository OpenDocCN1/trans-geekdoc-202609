    region in the left side of Figure 2.1 by making more partitions, but this would
    eventually lead to overfitting.


    The term “binary recursive partitioning” is quite descriptive of the general CART
    procedure, which I’ll discuss in detail in the next section for the classification
    case. The word binary refers to the binary (or two-way) nature of the splits used
    to construct the trees (i.e., each split partitions a set of observations into
    two non-overlapping subsets). The word recursive refers to the greedy nature of
    the algorithm in choosing splits sequentially (i.e., the algorithm does not look
    ahead to find splits that are globally optimal in any sense; it only tries to
    find the next best split). And of course, partitioning refers to the way splits
    attempt to partition a set of observations into non-overlapping subgroups with
    homogeneous response values.


