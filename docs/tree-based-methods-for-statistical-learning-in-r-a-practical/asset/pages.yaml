    \(\alpha = \alpha_1\). Starting with \(\mathcal{T}_{\alpha_1}\), we then continue
    this process by finding \(\alpha_2\) in the same way we found \(\alpha_1\) for
    the full tree \(\mathcal{T}\). The process is continued until reaching the root
    node. It might sound confusing, but we''ll walk through the calculations using
