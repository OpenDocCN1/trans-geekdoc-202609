    \ interaction detection, and estimation_ (GUIDE), which was introduced in Loh\
    \ [2002, 2009]. Unfortunately, GUIDE seems much less adopted among practitioners\
    \ and researchers when compared to other algorithms with easy-to-use open source\
    \ implementations, like CART (e.g., **rpart**) and CTree (e.g., **partykit**).\n\
    \nLike CTree, GUIDE is based on statistical tests of hypothesis striving to achieve\
    \ unbiased split variable selection. In particular, GUIDE was specifically designed\
    \ to solve three problems that can adversely affect the interpretability of decision\
    \ trees:\n\n+   1) split variable selection bias;\n+   \n+   2) insensitivity\
    \ to local interactions;\n+   \n+   3) overly complicated tree structures (like\
