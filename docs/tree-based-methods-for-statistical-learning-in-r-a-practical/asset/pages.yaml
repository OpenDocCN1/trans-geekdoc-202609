  img_proc: true
- pgno: 123
  md: 'splits are used in the first place. While some decision tree algorithms allow
    multiway splits (e.g., CHAID and C4.5/C5.0), this is not a good strategy in general
    as the data would be fragmented too quickly, and the search for locally optimal
    splits becomes more challenging.


    **Trees contain complex interactions.** CART finds splits in a sequential manner,
    and all splits in the tree depend on any that came before it. Once a final tree
    structure has been identified, the resulting prediction equation can be written
    using a linear model in indicator functions. For example, the prediction equation
    for the tree diagram in Figure 2.9 (p. 63) can be written as follows:


    ```

    \widehat{\text{Ozone}} = 75.41 \times I(\text{Temp} \ge 82.50) + 55.60 \times
    I(\text{Temp} < 82.50 \ \& \ \text{Wind} < 7.15), \ + 22.33 \times I(\text{Temp}
    < 82.50 \ \& \ \text{Wind} \ge 7.15)

    ```


    where \( I(\cdot) \) is the *indicator function* that evaluates to one whenever
    its argument is true, and zero otherwise. The right-hand side can be re-written
    more generally as \( f(\text{Temp}) + f(\text{Temp, Wind}) \), where the second
    term explicitly models an interaction effect between Temp and Wind. As you can
    imagine, a more complex tree with a larger number of splits easily leads to a
    model with high-order interaction effects. The presence of high-order interaction
    effects can make interpreting the main effects (i.e., the effect of individual
    predictors) more challenging.


    **Biased variable selection.** As briefly discussed in Section 2.4.2, CART''s
    split selection strategy is biased towards features with many potential split
    points, such as categorical predictors with high cardinality. More contemporary
    decision tree algorithms, like those discussed in Chapters 3-4, are unbiased in
    this sense.


    **Trees are essentially step functions.** Trees can have a hard time adapting
    to smooth and/or linear response surfaces. Recall the twonorm problem from Section
    1.1.2.5, where the optimal decision boundary is linear. I fit an pruned **rpart**
    tree to the same sample using 10-fold cross-validation and the 1-SE rule; the
    resulting decision boundary (along with the optimal Bayes rule) is displayed in
    Figure 2.28 (p. 110). Of course, I could increase the number of splits resulting
    in smaller steps, but in practice this often leads to overfitting and poor generalizability.
    This lack of smoothness causes more problems in the regression setting.


    **Trees are noisy.** A common criticism of decision trees is that they are considered
    *unstable predictors*; this was also noted in the original CART monograph; see
    Breiman et al. [1984, Section 5.5.2]. By unstable, I mean high variance or, in
    other words, the tree structure (and therefore predictions) can vary, often wildly,
    from one sample to the next. For example, at any node in a particular'
