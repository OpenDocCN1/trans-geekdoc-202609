- pgno: 298
  md: "Notice the impact this had on reducing the overall size of the fitted model.\
    \ This can often lead to a much more compact model that's easier to save and load\
    \ when memory requirements are a concern.\n\nWe can't just use the “deforested”\
    \ tree ensemble directly; remember, the estimated LASSO coefficients imply a reweighting\
    \ of the remaining trees! To obtain the reweighted predictions from the “deforested”\
    \ model, we need to do a bit more work. Here, I’ll create a new prediction function,\
    \ called predict.def(), that will compute the reweighted predictions from the\
    \ remaining trees using the estimated LASSO coefficients—similar to how predictions\
    \ in a linear model are computed.\n\nTo test it out, I’ll stack the learning sample\
    \ (ames.trn) on top of itself 100 times, resulting in N = 205,100 observations\
    \ for scoring. Below, I compare the prediction times for both the original (i.e.,\
    \ non-processed) and “deforested” RFO.4.5 fits:\n\n```\names.big <- # stack data\
    \ on top of itself 100 times\ndo.call(\"rbind\", args = replicate(100, ames.trn,\
    \ simplify = FALSE))\n```\n\n```\n# Compute reweighted predictions from a ``deforested''\
    \ ranger object\npredict.def <- function(rf.def, weights, newdata, intercept =\
    \ TRUE) {\n  preds <- predict(rf.def, data = newdata,\n                   predict.all\
    \ = TRUE)$predictions\n  res <- if (isTRUE(intercept)) { # returns a one-column\
    \ matrix\n    cbind(1, preds) %*% weights\n  } else {\n    preds %*% weights\n\
    \  }\n  res[, 1, drop = TRUE] # coerce to atomic vector\n}\n```\n\n```\n# Scoring\
    \ time for original RFO.4.5 fit\nsystem.time({ # full random forest\n  preds <-\
    \ predict(rfo.4.5, data = ames.big)\n})\n#> user system elapsed\n#> 37.15 2.64\
    \ 13.35\n```\n\n```\n# Scoring time for post-processed RFO.4.5 fit using updated\
    \ weights\nweights <- coefs[coefs != 0] # LASSO-based weights for remaining trees\n\
    system.time({\n  preds.post <- predict.def(rfo.4.5.def, weights = weights,\n \
    \                           newdata = ames.big)\n})\n#> user system elapsed\n\
    #> 4.17 0.73 4.47\n```"
  merge: -1
  img_proc: true
- pgno: 299
  md: "The final model contains only 93 trees and achieved a test RMSE of 26.59, while\
    \ also being orders of magnitude faster to initially train. The computational\
    \ advantages are easier to appreciate on even larger data sets.\n\nIn summary,\
    \ I used the LASSO to post-process and “deforest” a large ensemble of shallow\
    \ trees (which trained relatively fast), producing a much smaller ensemble with\
    \ fewer trees that scores faster compared to the default RFO. While the default\
    \ RFO model had a slightly smaller test RMSE of 24.72 compared to the “deforested”\
    \ RFO.4.5 test RMSE of 111.29, the difference is arguably negligible (especially\
    \ when you take the differences in both training and scoring time into account).\n\
    \n# 7.9.3 Example: survival on the Titanic\n\nIn this example, I’ll walk through\
    \ a simple RF analysis of the well-known Titanic data set, where the goal is to\
    \ understand survival probability aboard the ill-fated Titanic. A more thoughtful\
    \ analysis using logistic regression and spline-based techniques is provided in\
    \ Harrell [2015, Chap. 12].\n\nSeveral versions of this data set are publicly\
    \ available; for example, in the R package titanic [Hendricks, 2015]. Here, I’ll\
    \ use a more complete version of the data° which can be loaded using the getHdata()\
    \ from package Hmisc [Harrell, 2021]; the raw data can also be downloaded from\
    \ https://hbiostat.org/data/. In this example, I’ll only consider a handful of\
    \ the original variables:\n\n```\nt3 <- read.csv(\"https://hbiostat.org/data/repo/titanic3.csv\"\
    ,\n               stringsAsFactors = TRUE)\nkeep <- c(\"survived\", \"pclass\"\
    , \"age\", \"sex\", \"sibsp\", \"parch\")\nt3 <- t3[, keep] # only retain key\
    \ variables\n```\n\nNote that roughly 20.09% of the values for age, the age in\
    \ years of the passenger, are missing:\n\n```\nsapply(t3, FUN = function(x) mean(is.na(x)))\n\
    #> survived  pclass     age     sex   sibsp   parch\n#>  0.000   0.000   0.201\
    \   0.000   0.000   0.000\n```\n\nFollowing Harrell [2015, Sec. 12.4], I use a\
    \ decision tree to investigate which kinds of passengers tend to have a missing\
    \ value for age. In the example below, I use the partykit package to apply the\
    \ CTree algorithm (Chapter 3) using a missing value indicator for age as the response.\
    \ From the tree output we can see that third-class passengers had the highest\
    \ rate of missing age values (29.3%), followed by first-class male passengers\
    \ with no siblings or\n\n° A description of the original source of these data\
    \ is provided in Harrell [2015, p. 291]."
  merge: -1
  img_proc: true
- pgno: 300
  md: "spouses aboard (22.8%). This makes sense, since males and third-class passengers\
    \ supposedly had the least likelihood of survival (“women and children first”).\n\
    \n```\n```r\nlibrary(partykit)\n```\n```\n\n```\n```r\n# Fit a conditional inference\
    \ tree using missingness as response\ntemp <- t3 # temporary copy\ntemp$age <-\
    \ as.factor(ifelse(is.na(temp$age), \"y\", \"n\"))\nt3.ctree <- ctree(age ~ .,\
    \ data = temp)\n```\n```\n\n```\n```\n#>\n#> Model formula:\n#> age ~ survived\
    \ + pclass + sex + sibsp + parch\n#>\n#> Fitted party:\n#> [1] root\n#> | [2]\
    \ pclass <= 2\n#> | | [3] sibsp <= 0\n#> | | | [4] sex in female: n (n = 135,\
    \ err = 6%)\n#> | | | [5] sex in male\n#> | | | | [6] pclass <= 1: n (n = 123,\
    \ err = 23%)\n#> | | | | [7] pclass > 1: n (n = 122, err = 11%)\n#> | | [8] sibsp\
    \ > 0: n (n = 220, err = 3%)\n#> | [9] pclass > 2: n (n = 709, err = 29%)\n#>\n\
    #> Number of inner nodes: 4\n#> Number of terminal nodes: 5\n```\n```\n\n```\n\
    ```r\n# plot(t3.ctree) # plot omitted\n```\n```\n\n# ## 7.9.3.1 Missing value\
    \ imputation\n\nNext, I'll use the CART-based multiple imputation procedure outlined\
    \ in Section 2.7.1 to perform m = 21 separate imputations for each missing age\
    \ value. Why did I choose m = 21? White et al. [2011] propose setting m >= 100f,\
    \ where f is the fraction of incomplete cases*. Since age is the only missing\
    \ variable, with f = 0.201, I chose m = 21. Using multiple different imputations\
    \ will give us an idea of the sensitivity of the results of our (yet to be fit)\
    \ RF.\n\n```\n```r\nlibrary(mice)\n```\n```\n\n```\n```r\nset.seed(1125) # for\
    \ reproducibility\nimp <- mice(t3, method = \"cart\", m = 21, minbucket = 5,\n\
    \    printFlag = FALSE)\n```\n```\n\n```\n```r\n# Display nonparametric densities\n\
    densityplot(imp)\n```\n```"
