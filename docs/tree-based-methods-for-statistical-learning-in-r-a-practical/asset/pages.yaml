    # 2.3 Regression trees


    Up to this point, our discussion of splitting nodes applies primarily to the case
    of CART-like classification trees. In CART, regression trees are constructed in
    nearly the same way as classification trees. The only real difference is that
    rather than finding the predictor/split combination that gives the greatest reduction
    in the within-node impurity, we look for the predictor/split combination that
    gives the greatest reduction in node sum of squared errors (SSE):


    \(\Delta \mathcal{I}(S, A) = SSE_A - (SSE_{A_L} + SSE_{A_R}),\)'
