- pgno: 148
  md: 'weights from the formulas in Section 3.3, so see the references listed there
    for full details). For instance, we can assign higher weights to observations
    associated with higher misclassification costs. There is a drawback to this approach,
    however. Increasing the case weights essentially corresponds to increasing the
    sample size $N$ in the statistical tests used in Algorithm 3.1, which will result
    in smaller $p$-values. Consequently, the resulting tree can be much larger since
    more splits will be significant. Decreasing $\alpha$ and/or employing the tuning
    strategy discussed in Section 3.4.5 can help, but it can be a difficult balancing
    act.


    # 3.4.8 Variable importance


    In contrast to the impurity-based variable importance measure used in CART (Section
    2.8), CTree uses a _permutation_-based framework similar to the procedure outlined
    in Algorithm 6.1 (p. 205). This is not the same “permutation” as in “permutation
    test,” but rather, in how the individual feature columns are randomly permuted,
    one at a time, before recording the difference in prediction performance (as compared
    to the baseline performance when none of the feature columns are permuted).


    # 3.5 Software and examples


    Conditional inference trees are available in the **party** package via the **ctree()**
    function.<sup>f</sup> However, the **partykit** package contains an improved re-implementation
    of **ctree()** and is recommended for fitting individual conditional inference
    trees in general. The **ctree()** function in **partykit** is much more modular
    and written almost entirely in R; this flexibility seems to come at a price, however,
    as **partykit::ctree()** can be much slower than **party::ctree()** (the latter
    of which is implemented in C). It’s also worth noting that **partykit** is quite
    extensible and allows you to coerce tree models from different sources into a
    standard format that **partykit** can work with (e.g., importing trees saved in
    the _predictive model markup language_ (PMML) format [Data Mining Group, 2014]).
    A good example of this is the R package **C5.0** [Kuhn and Quinlan, 2021], which
    provides an interface to C5.0 (C5.0, which evolved out of C4.5, is discussed in
    the online complements).


    The R package **boot** [Canty and Ripley, 2021] can be used to carry out general
    permutation tests, as well as more general bootstrap procedures; for permutation
    tests, see the example code in Davison and Hinkley [1997, Sec. 4.3].


    <sup>f</sup>The package name is apparently a play on the words “partition y”.'
