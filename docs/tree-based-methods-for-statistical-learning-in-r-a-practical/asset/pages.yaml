  md: "a portion of the original learning sample isn't used—these observations are\
    \ referred to as out-of-bag (or OOB for short). The OOB data associated with a\
    \ particular tree can be used to obtain an unbiased estimate of prediction error.\
    \ The OOB errors can then be aggregated across all the trees in the forest to\
    \ obtain an overall out-of-sample, albeit unstructured, estimate of the overall\
    \ prediction performance of the forest.\n\nSince bagging/bootstrapping involves\
    \ sampling with replacement, the probability that a particular case is not selected\
    \ in a particular bootstrap sample is\n\n\\(\\text{Pr}(\\text{case } i \\notin\
    \ \\text{bootstrap sample } b) = \\left(1 - \\frac{1}{N}\\right)^N .\\)\n\nAs\
    \ \\(N \\to \\infty\\) it can be shown that \\(\\left(1 - \\frac{1}{N}\\right)^N\
    \ \\to e^{-1} \\approx 0.368\\). In other words, on average, each bootstrap sample\
    \ contains approximately \\(1 - e^{-1} \\approx 0.632\\) of the original training\
    \ records; the remaining \\(e^{-1} \\approx 0.368\\) observations are OOB and\
    \ can be used as an independent validation set for the corresponding tree. This\
    \ is rather straightforward to observe without a mathematical derivation. The\
    \ code below computes the proportion of non-OOB observations in \\(B = 10000\\\
    ) bootstrap samples of size \\(N = 100\\), and averages the results together:\n\
    \n```\n```\nset.seed(1226) # for reproducibility\nN <- 100 # sample size\nobs\
    \ <- 1:N # original observations\nres <- replicate(10000, sample(obs, size = N,\
    \ replace = TRUE))\ninbag <- apply(res, MARGIN = 2, FUN = function(boot.sample)\
    \ {\n  mean(obs %in% boot.sample) # proportion in bootstrap sample\n})\nmean(inbag)\n\
    #> [1] 0.634\n```\n```\n\nLet \\(w_{b,i} = 1\\) if observation \\(i\\) is OOB\
    \ in the \\(b\\)-th tree and zero otherwise. Further, if we let \\(B_i = \\sum_{b=1}^B\
    \ w_{b,i}\\) be the number of trees in the forest for which observation \\(i\\\
    ) is OOB, then the OOB prediction for the \\(i\\)-th training observation is given\
