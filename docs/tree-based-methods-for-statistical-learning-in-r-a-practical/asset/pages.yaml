    Note that rotations are only applied to numeric features and can be sensitive
    to both scale and outliers, hence, rescaling the numeric features is often required;
    see Blaser and Fryzlewicz [2016] for several recommendations. Random rotation
    forests are not generally available in open source software, but you can find
