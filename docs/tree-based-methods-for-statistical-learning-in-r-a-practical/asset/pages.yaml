    # 1.1.3 Unsupervised learning


    In unsupervised learning, there is no working response y; hence, the learning
    sample comprises just features {x_i}_{i=1}^N. The general goal is to determine
    whether not the data form any “interesting groups;” for example, whether or not
    the data form natural clusters. A useful application is in detecting outliers
    or anomalies. An example of using decision trees for the purpose of anomaly detection
    is given in Section 7.8.5. Another example, related to the identification of potentially
    mislabeled response values, is given in Section 7.6.1.


    # 1.2 Why trees?


    There are a number of great modeling tools available to data scientists. But what
    makes a modeling tool good? Is being able to achieve competitive accuracy all
    that matters? Of course not. According to the late Leo Breiman, a good modeling
    tool, at a minimum, should:


    +   - be applicable to both classification (binary and multiclass) and regression;

    +   - be competitive in terms of accuracy;'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - be capable of handling large data sets;

    +   - handle missing values effectively.


    Additionally, Leo also believed that good modeling tools should be able to:


    +   - tell you which predictors are important;

    +   - tell you how the predictors functionally relate to the response;

    +   - tell you if and how the predictors interact;

    +   - tell you how the data cluster;

    +   - tell you if there are any novel cases or outliers.


    As we''ll see throughout this book, tree-based methods naturally check a lot of
    these boxes. While individual trees are particularly capable of handling a wide
    range of problems, their main disadvantage is that they don''t often perform as
    well compared to more complex models, like NNs or SVMs; however, in Part II of
    this book, I''ll discuss powerful ways to combine decision trees into *ensembles*
    that are quite competitive with current state-of-the-art algorithms, while still
    adhering to several of the features of a good modeling tool outlined above.


    Table 1.1 compares several characteristics of different statistical learning algorithms;
    this is a modified recreation of Table 10.1 from Hastie et al. [2009, p. 351].
    MARS, which stands for *multivariate adaptive regression splines* [Friedman, 1991],
    can be thought of as an extension of *linear models* that automatically handles
    variable selection, nonlinear relationships, and interactions between predictors;
    MARSis discussed in the online supplementary material on the book website. Note
    how tree-based methods tend to have a lot of desirable properties. The idea of
    tree-based ensembles is hopefully to retain many of these useful properties while
    improving predictive performance.


    Table 1.1 is not in full agreement with Table 10.1 from Hastie et al. [2009, p.
    351], on which it is based. For example, individual trees receive a 🟡 for predictive
    performance in Table 1.1, indicating that they can be fairly accurate in certain
    problems, especially modern decision tree algorithms, like GUIDE (Chapter 4).


    Trees also make great *off-the-shelf* modeling tools. The term off-the-shelf,
    at least as it’s used here, implies a procedure that can be usefully applied to
    a wide range of data sets without requiring much in the way of pre-processing


    §The terms “MARS” is actually trademarked and licensed to Salford Systems (which
    was acquired by Minitab in 2017), hence, open source implementations often go
    by different names. For example, a popular open source implementation of MARSis
