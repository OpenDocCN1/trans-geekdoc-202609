  md: '# ## 8.7 Specialized topics


    # ### 8.7.1 Level-wise vs. leaf-wise tree induction


    There two strategies to consider when growing an individual decision tree that
    we have yet to discuss:


    +   - Level-wise (also referred to as _depth-wise_ or _depth first_) tree induction
    is used by many common decision tree algorithms (e.g., CART and C4.5/C5.0, but
    this probably depends on the implementation) and grows a tree level by level in
    a fixed order; that is, each node splits the data by prioritizing the nodes closer
    to the root node.


    +   - Leaf-wise tree induction (also referred to as _best-first_ splitting), on
    the other hand, grows a tree by splitting the node whose split leads to the largest
    reduction of impurity.


    When grown to maximum depth, both strategies result in the same tree structure;
    the difference occurs when trees are restricted to a maximum depth or number of
    terminal nodes. Leaf-wise tree induction, while not specific to boosting, has
    primarily only been evaluated in that context; see, for example, Friedman [2001]
    and Shi [2007].


    Figure 8.7 gives an example of a tree grown level-wise (left) and leaf-wise (right).
    Notice how the overall tree structures are the same, but the order in which the
    splits are made (i.e., _S_<sub>1</sub>–_S_<sub>4</sub>) is different. In general,
    level-wise growth tends to work better for smaller data sets, whereas leaf-wise
    tends to overfit. Leaf-wise growth tends to excel in larger data sets where it
    is considerably faster than level-wise growth. This is why some modern GBM implementations—like
    LightGBM (Section 8.8)—default to growing trees leaf-wise.


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_348_0.png)


    **FIGURE 8.7:** Hypothetical decision tree grown level-wise/depth-first (left)
    and leaf-wise/best-first (right).'
  merge: -1
  img_proc: true
