- pgno: 93
  md: '# 2.5.2 Cross-validation


    Once the sequence \(\alpha_1, \alpha_2, ..., \alpha_{k-1}\) has been found, we
    still need to estimate the overall risk/quality of the corresponding sequence
    of nested subtrees, \(R_{\alpha_i}(\mathcal{T})\), for \(i = 1, 2, ..., k - 1\).
    Breiman et al. [1984, Chap. 11] suggested picking \(\alpha\) using a separate
    validation set or \(k\)-fold cross-validation. The latter is more computational,
    but tends to be preferred since it makes use of all available data, and both tend
    to lead to similar results. The procedure described in Algorithm 2.1 below follows
    the implementation in the **rpart** package in R (see the “Introduction to Rpart”
    vignette):


    # Algorithm 2.1 \(K\)-fold cross-validation for cost-complexity pruning.


    +   1) Fit the full model to the learning sample to obtain \(\alpha_1, \alpha_2,
    ..., \alpha_{k-1}\).


    +   2) Define \(\beta_i\) according to


    \(\beta_i = \left\{ \begin{array}{ll} 0 & i = 1 \\ \sqrt{\alpha_{i-1}\alpha_i}
    & i = 2, 3, ..., m - 1 \\ \infty & i = m \end{array} \right.\)


    Since any value of \(\alpha\) in the interval \((\alpha_i, \alpha_{i+1}]\) results
    in the same subtree, we instead consider the sequence of \(\beta_i\)’s, which
    represent typical values within each range using the geometric midpoint.


    +   3) Divide the data into \(k\) groups (or folds), \(D_1, D_2, ..., D_k\), with
    approximately \(k/N\) observations in each (\(N\) being the number of rows in
    the learning sample). For \(i = 1, 2, ..., k\), do the following:


    +   a) Fit the full model to the learning sample, but omit the subset \(D_i\),
    and find the sequence of optimal subtrees \(\mathcal{T}_{\beta_1}, \mathcal{T}_{\beta_2},
    ..., \mathcal{T}_{\beta_k}\).


    +   b) Compute the prediction error from each tree on the validation set \(D_i\).


    +   4) For each subtree, aggregate the results by averaging the \(k\) out-of-sample
    prediction errors.


    +   5) Return \(\mathcal{T}_\beta\) from the initial sequence of trees based on
    the full learning sample, where \(\beta\) corresponds to the \(\beta_i\) associated
    with the smallest prediction error in step 4).'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 2.5.2.1 The 1-SE rule


    When choosing \(\alpha\) with \(k\)-fold cross-validation, Breiman et al. [1984,
    Sec. 3.4.3] recommend using the 1-SE rule, and argue that it is useful in screening
    out irrelevant features. The 1-SE rule suggests using the most parsimonious tree
    (i.e., the one with fewest splits) whose cross-validation error is no more than
    one standard error above the cross-validation error of the best model. This of
    course requires an estimate of the standard error during cross-validation. A heuristic
    estimate of the standard error can be found in Breiman et al. [1984, pp. 306–309]
    or Zhang and Singer [2010, pp. 42–43], but the formula isn''t pretty! Applying
    cost-complexity pruning using cross-validation, with or without the 1-SE rule,
    would almost surely remove all of the nonsensical splits seen in Figure 2.11.
    (In fact, this was the case after applying 10-fold cross-validation using the
    1-SE rule.)


    # 2.6 Hyperparameters and tuning


    There are essentially three hyperparameters associated with CART-like decision
    trees:


    +   1) the maximum depth or number of splits;

    +   2) the maximum size of any terminal node;

    +   3) the cost-complexity parameter \(cp\).


    Different software will have different names for these parameters and different
    default values. Arguably, \(cp\) is the most flexible and important tuning parameter
    in CART, and a good strategy is to relax the maximum depth and size of the terminal
    nodes as much as possible, and use cost-complexity pruning to find an optimal
    subtree using \(k\)-fold cross-validation, or some other validation procedure.
    In some cases, Chapter 7, for example, trees are intentionally grown to maximal
    or near maximal depth (in some cases, leaving only a single observation in each
    terminal node).


    # 2.7 Missing data and surrogate splits


    One of the best features of CART is the flexibility with which missing values
    can be handled. More traditional statistical models, like linear or logistic regression,
    will often discard any observations with missing values. CART,'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'through the use of surrogate splits, can utilize all observations that have
    non-missing response values and at least one non-missing value for the predictors.
    Surrogate splits are essentially splits using other available features with non-missing
    values. The basic idea, which is fully described in Breiman et al. [1984, Sec.
    5.3], is to estimate (or impute) the missing data point using the other available
    features.


    Consider the decision stump in Figure 2.18, which corresponds to the optimal tree
    for the Swiss banknote data when using all available features.


    What if we wanted to classify a new observation which had a missing value for
    diagonal? The surrogate approach finds surrogate variables for the missing splitter
    by building decision stumps, one for each of the other features (in this case,
    length, left, right, bottom, and top), to predict the binary response, denoted
    below by y*, formed by the original split:


    ```

    y* = \begin{cases} 0 & \text{if diagonal} \ge 140.65 \\ 1 & \text{if diagonal}
    < 140.65 \end{cases}

    ```


    ![](img/2c227bfb3620dc3d159fa5e6598afa30_95_0.png)


    FIGURE 2.18: Decision stump for the Swiss banknote example.


    For each feature, the optimal split is chosen using the procedure described in
    Section 2.2.1. (Note that when looking for surrogates, we do not bother to incorporate
    priors or losses since none are defined for y*.) In addition to the optimal split
    for each feature, we also consider the majority rule, which just uses the majority
    class. Once the surrogates have been determined, they''re ranked in terms of misclassification
    error, and any surrogate that does worse'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'than the majority class is discarded. Some implementations, like R’s rpart
    package, further require surrogate splits to send at least two observations to
    each of the left and right child nodes.


    Returning to the Swiss banknote example, let’s find the surrogate splits for the
    primary split on diagonal depicted in Figure 2.18. We can find the surrogate splits
    using the same splitting process as before, albeit with our new target variable
    y*:


    ```

    bn2 <- treemisc::banknote # load Swiss banknote data

    bn2$y <- ifelse(bn2$diagonal >= 140.65, 1, 0) # new target

    bn2$diagonal <- NULL # remove column

    features <- c("length", "left", "right", "bottom", "top")

    res <- sapply(features, FUN = function(feature) {

    find_best_split(bn2, x = feature, y = "y", n = nrow(bn2))

    })

    rownames(res) <- c("cutpoint", "gain")

    res[, order(res["gain", ], decreasing = TRUE)]


    #>

    #>       bottom   right     top    left  length

    #> cutpoint 9.550 129.850 10.950 130.050 215.1500

    #> gain     0.343  0.169  0.157  0.137  0.0344

    ```


    In this case, the ranked surrogate splits—in descending order of importance—are
    bottom, right, top, left, and length; the corresponding split points for each
    are also shown in the output (we’ll verify these results in Section 2.9 using
    real tree software). If we were to use the decision stump in Figure 2.18 to classify
    a new banknote with a missing value for diagonal, the tree would use the next
    best surrogate split instead (in this case, whether or not bottom >= 9.550).


    For each surrogate, we could also compute its agreement and adjusted agreement
    with the primary split, which are used in rpart’s definition of variable importance
    (Section 2.8). The agreement between a primary split and its surrogate is just
    the proportion of observations they send in the same direction. The adjusted agreement
    adjusts this proportion by subtracting the number of observations sent one way
    or another using the majority rule. An example is given in Section 2.9.


    # 2.7.1 Other missing value strategies


    Aside from being able to handle missing predictor values directly, classification
    trees can be extremely useful in examining patterns of missing data [Harrell,
    2015, Sec. 3.2]. For example, CART can be used to describe observations that tend
    to have missing values (a description problem). This can be done by growing a
    classification tree using a target variable that’s just a binary'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'indicator for whether or not a variable of interest is missing; see Harrell
    [2015, pp. 302–304] for an example using real data in R.


    It can also be informative to construct missing value indicators for each predictor
    under consideration. Imagine, for example, that you work for a bank and that part
    of your job is to help determine who should be denied for a loan and who should
    not. A missing credit score on a particular loan application might be an obvious
    red flag, and indicative of somebody with a bad credit history, hence, an important
    indicator in determining whether or not to approve them for a loan. A similar
    strategy for categorical variables is to treat missing values as an actual category.
    As noted in van Buuren [2018, Sec. 1.3.7], the missing value indicator method
    may have its uses in particular situations but fails as a generic method to handle
    missing data (e.g., it does not allow for missing data in the response and can
    lead to biased regression estimates across a wide range of scenarios).


    Imputation—filling in missing values with a reasonable guess—is another common
    strategy, and trees make great candidates for imputation models (e.g., they’re
    fully nonparametric and naturally support both classification and regression).


    Using CART for the purpose of missing value imputation has been suggested by several
    authors; see van Buuren [2018, Sec. 3.5] for details and several references. A
    generally useful approach is to use CART to generate *multiple imputations* [van
    Buuren, 2018, Sec. 3.5] via the *bootstrap method* (see Davison and Hinkley [1997]
    for an overview of different bootstrap methods); multiple imputation is now widely
    accepted as one of the best general methods for dealing with incomplete data [van
    Buuren, 2018, Sec. 2.1.2].


    The basic steps are outlined in Algorithm 2.2; also see `?mice::cart` for details
    on its implementation in the **mice** package [van Buuren and Groothuis-Oudshoorn,
    2021]. Here, it is assumed that the response $y$ corresponds to the predictor
    with incomplete observations (i.e., contains missing values) and that the predictors
    correspond to the original predictors with complete information (i.e., no missing
    values).


    As described in Doove et al. [2014] and van Buuren [2018, Sec. 3.5], this process
    can be repeated $m$ times using the bootstrap to produce $m$ imputed data sets.
    As noted in van Buuren [2018, Sec. 3.5], Algorithm 2.2 is a form of *predictive
    mean matching* [van Buuren, 2018, Sec. 3.4], where the “predictive mean” is instead
    calculated by CART, as opposed to a regression model. An example using CART for
    multiple imputation is provided in Section 7.9.3.


    But what if you’re using a decision tree as the model, and not just as a means
    for imputation: should you rely on surrogate splits or a different strategy,


    Unless stated otherwise, a bootstrap sample refers to a random sample of size
    $N$ with replacement from a set of $N$ observations; hence, some of the original
    obervations will be sampled more than once and some not at all.'
  merge: -1
