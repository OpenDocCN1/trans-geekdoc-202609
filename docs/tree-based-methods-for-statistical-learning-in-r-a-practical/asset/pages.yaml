- pgno: 211
  md: "# 5.3 Bagging or boosting: which should you use?\n\nAmong tree-based ensembles,\
    \ it is generally regarded that boosting outperforms bagging (and its variants,\
    \ like the random forest procedure discussed in Chapter 7). However, this is not\
    \ always the case and, as discussed briefly in this chapter and in Chapter 8,\
    \ boosting tends to require more work up front in terms of tuning in order to\
    \ see the gains, whereas bagged tree ensembles tend to perform well right out\
    \ of the box with little to no tuning$^{\text{f}}$; this is especially true for\
    \ random forests. My opinion is summarized by the following relationship:\n\n\
    Gradient boosted trees ≥ Random forest > Bagged trees > Single tree.\n\nSo, while\
    \ boosted tree ensembles tend to outperform their bagged counterparts, I don’t\
    \ often find the performance increase to be worth the added complexity and time\
    \ associated with the additional tuning. It’s a trade off that we all must take\
    \ into consideration for the problem at hand. It should also be noted that sometimes\
    \ a single decision tree is the right tool for the job, and an ensemble thereof\
    \ would be overkill; see, for example, Section 7.9.1.\n\n# 5.4 Variable importance\n\
    \nRecall from Section 2.8 that the relative importance of predictor $x$ is essentially\
    \ the sum of the squared improvements over all internal nodes of the tree for\
    \ which $x$ was chosen as the partitioning variable. This idea also extends to\
    \ ensembles of decision trees, such as bagged and boosted tree ensembles. In ensembles,\
    \ the improvement score for each predictor is averaged across all the trees in\
    \ the ensemble. Because of the stabilizing effect of averaging, the aggregated\
    \ tree-based variable importance score is often more reliable in large ensembles;\
    \ see Hastie et al. [2009, p. 368], although, as we’ll see in Chapter 7, split\
    \ variable selection bias will also affect the variable importance scores often\
    \ produced by tree-based ensembles using CART-like decision trees."
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 5.5 Importance sampled learning ensembles


    Tree-based ensembles (especially those discussed in Chapters 7-8) often do a good
    job in building a prediction model, but at the end of the day can involve a lot
    of trees which can limit their use in production since they can require more memory
    and take longer to score new data sets.


    To help overcome these issues, Friedman and Popescu [2003] introduced the concept
    of *importance sampled learning ensembles* (ISLEs). Many of the tree-based ensembles
    discussed in this book—including bagged tree ensembles—are examples of ISLEs.
    The main point here is that ISLEs can sometimes benefit from post-processing via
    a technique called the LASSO, which stands for *least absolute shrinkage and selection
    operator* [Tibshirani, 1996]. Such post-processing can often maintain or, in some
    cases, improve the accuracy of the original ensemble while dramatically improving
    computational performance (e.g., lower memory requirements and faster training
    times). For full details, see Friedman and Popescu [2003], Hastie et al. [2009,
    Sec. 16.3.1], and Efron and Hastie [2016, 346–347].


    The idea is to use the LASSO to select a subset of trees from a fitted ensemble
    and re-weight them, which can result in an ensemble with far fewer trees and (hopefully)
    comparable, if not better, accuracy. This is important to consider in real applications
    since tree ensembles can sometimes require many thousands of decision trees to
    reach peak performance, often resulting in a large model to maintain in memory
    and slower scoring times (aspects that are important to consider before deploying
    a model in a production process).


    The LASSO-based post-processing procedure essentially involves fitting an \(L_1\)-penalized
    regression model of the form


    ```

    \(\min_{\{\beta_b\}_{b=1}^B} \sum_{i=1}^N L \left[ y_i, \sum_{b=1}^B \widehat{f}_b(\boldsymbol{x}_i)
    \beta_b \right] + \lambda \sum_{b=1}^B |\beta_b|,\)

    ```


    where \(\widehat{f}_b(\boldsymbol{x}_i)\) (\(b = 1, 2, \dots, B\)) is the prediction(s)
    from the \(b\)-th tree for observation \(i\), \(\beta_b\) are fixed, but unknown
    coefficients to be estimated via the LASSO, and \(\lambda\) is the \(L_1\)-penalty
    to be applied.


    The wonderful and efficient **glmnet** package [Friedman et al., 2021] for R can
    be used to fit the entire LASSO regularization path\(^\S\); that is it efficiently
    computes the estimated model coefficients for an entire grid of relevant \(\lambda\)
    values.


    \(^\S\)The **glmnet** package actually implements the entire *elastic net* regularization
    path for many types of generalized linear models. The LASSO is just a special
    case of the elastic net, which combines both the LASSO and ridge (i.e., \(L_2\))
    penalties.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'The optimal value of \(\lambda\) can be chosen via cross-validation or an independent
    test set.


    Note that not all ensembles will perform well with post-processing. As discussed
    in Hastie et al. [2009, section 16.3.1], the individual trees should cover the
    space of predictors where needed and and be sufficiently different from each other
    for the post-processor to be effective. Strategies for different tree ensembles
    are provided in Friedman and Popescu [2003] (e.g., using smaller subsamples when
    sampling without replacement, like 5–10%, and shallower trees for bagged tree
    ensembles). The next example shows how to apply this post-processing strategy
    to a bagged tree ensemble using the Ames housing data (Section 1.4.7).


    # ## 5.5.1 Example: post-processing a bagged tree ensemble


    To illustrate, let’s return to the Ames housing example. Below, I’ll load the
    data into R and apply the same 70/30 split from the previous example. Note that
    I continue to rescale Sale_Price by dividing by 1000; this is strictly for plotting
    purposes.


    ```

    ```r

    ames <- as.data.frame(AmesHousing::make_ames())

    ames$Sale_Price <- ames$Sale_Price / 1000 # rescale response

    set.seed(2101) # for reproducibility

    id <- sample.int(nrow(ames), size = floor(0.7 * nrow(ames)))

    ames.trn <- ames[id, ] # training data/learning sample

    ames.tst <- ames[-id, ] # test data

    ames.tst <- subset(ames.tst, select = -Sale_Price) # features only

    ```

    ```


    Next, I’ll fit a bagged tree ensemble using the **randomForest** package [Breiman
    et al., 2018] (computational reasons for doing so are discussed in Section 5.1.5).
    Random forest, and its open source implementations, are not discussed until Chapter
    7. For now, just note that the **randomForest** package, among others, can be
    used to implement bagged tree ensembles by tweaking a special parameter, often
    referred to as \(m_{try}\) (to be discussed in Section 7.2), and setting this
    parameter equal to the number of total predictors will result in an ordinary bagged
    tree ensemble). This will be much more efficient than relying on the **ipred**
    package and will also allow us to obtain predictions from the individual trees,
    rather than just the aggregated predictions. Examples of post-processing an RF
    and boosted tree ensemble are given in Sections 7.9.2 and 8.9.3, respectively.


    Here, I’ll fit two models, each containing \(B = 500\) trees:


    +   • a standard bagged tree ensemble where each tree is fully grown to bootstrap
    samples of size \(N\) (**ames.bag**);'
