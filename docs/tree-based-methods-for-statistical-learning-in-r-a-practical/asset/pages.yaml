    # The treemisc package


    Along with the companion website, there''s also a companion R package, called
    treemisc [Greenwell, 2021c], that houses a number of the data sets and functions
    used throughout this book. Installation instructions and documentation can be
    found in the package''s GitHub repository at


    https://github.com/bgreenwell/treemisc.'
