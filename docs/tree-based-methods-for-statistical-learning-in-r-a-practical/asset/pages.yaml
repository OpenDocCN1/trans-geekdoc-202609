    for deciding splits; see, for example, Hastie et al. [2009, Section 9.2.3]. However,
    misclassification error can be a useful measure of the risk associated with a
    tree and is used in decision tree pruning (Section 2.5).


    cTechnically, we should use p_j (A) \propto \pi_j (N_{j,A}/N_j), where \pi_j represents
    the true proportion of class j in the population of interest (called the prior
