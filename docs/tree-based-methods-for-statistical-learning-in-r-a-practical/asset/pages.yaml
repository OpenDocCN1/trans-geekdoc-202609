  md: 'A special problem with classifiers illustrates an important issue. Users of
    machine classifiers know that a highly imbalanced sample with regard to a binary
    outcome variable y results in a strange classifier. For example, if the sample
    has 1,000 diseased patients and 1,000,000 non-diseased patients, the best classifier
    may classify everyone as non-diseased; you will be correct 0.999 of the time.
    For this reason the odd practice of subsampling the controls is used in an attempt
    to balance the frequencies and get some variation that will lead to sensible looking
    classifiers (users of regression models would never exclude good data to get an
    answer). Then they have to, in some ill-defined way, construct the classifier
    to make up for biasing the sample. It is simply the case that a classifier trained
    to a 1/2 prevalence situation will not be applicable to a population with a 1/1,000
    prevalence. The classifier would have to be re-trained on the new sample, and
    the patterns detected may change greatly.


    Frank Harrell

    https://www.fharrell.com/post/classification/


    Fortunately, CART can flexibly handle imbalanced class labels without changing
    the learning sample. At a high level, we can assign specific unequal losses or
    penalties on a one-by-one basis to each type of misclassification error; in binary
    classification, there are two types of misclassification errors we can make: misclassify
    a 0 as a 1 (a false positive) or misclassify a 1 as a 0 (a false negative). The
    CART algorithm can account for these unequal losses or misclassification costs
    when deciding on splits and making predictions. Unfortunately, it seems that many
    practitioners are either unaware, or fail to take advantage of this feature.


    Our discussion of splitting nodes in Section 2.2.1 implicitly made several assumptions
    about the available data. For instance, estimating \( p_j(A) \) with \( N_{j,A}/N_A
    \), the proportion of observations in node \( A \) that belong to class \( j \),
    assumes the training data are a random sample from some population of interest.
    In particular, it assumes that the true prior probability of observing class \(
    j \), denoted \( \pi_j \), can be estimated with the observed proportion of class
    \( j \) observations in the training data; that is, \( \pi_j \approx N_j/N \).
    If the observed class proportions are off (e.g., the data have been downsampled
    or the minority class has intentionally been over-sampled to over-represent rare
    cases), then \( N_{j,A}/N_A \) is no longer a reasonable estimate of \( p_j(A)
    \). Instead, we should be using \( p_j(A) \propto \pi_j N_{j,A}/N_j \), where
    we scale the \( \{p_j(A)\}_{j=1}^J \) to sum to one. Note that if we take \( \pi_j
