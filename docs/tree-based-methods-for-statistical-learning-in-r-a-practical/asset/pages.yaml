- pgno: 22
  md: 'For example, in the Ames housing data (Section 1.4.7), we may be interested
    in determining which predictors are most influential on the predicted sale price
    in a fitted model. We may also be interested in how a particular feature (e.g.,
    overall house size) functionally relates to the predicted sale price from a fitted
    model.


    Questions like these are relatively straightforward to glean from simpler models,
    like an additive linear model or a simple decision tree. However, this type of
    information is often hidden in more complicated nonparametric models—like neural
    networks (NNs) and support vector machines (SVMs)—which unfortunately has given
    rise to the term “black box” models. In Chapter 6, I’ll look at several model-agnostic
    techniques that can be helpful in extracting relevant descriptive information
    from any supervised learning model.


    # 1.1.2.2 Prediction


    As the name implies, prediction tasks are concerned with predicting future or
    unobserved outcomes. For example, we may be interested in predicting the sale
    price for a new home given a set of relevant features. This could, in theory,
    be a useful starting point in setting the listing price for a home, or trying
    to help infer whether or not a particular house is under- or over-valued. Great
    care must be taken in such problems, however, as the outcome variable (the sale
    price of homes, in this case) can be complex in nature and the available data
    may not be enough to adequately capture sudden changes in the distribution of
    future response values; a bit more on this in Section 1.4.7.


    It should be stressed that prediction and description often go hand in hand. Description
    helps provide transparency in how a model’s predictions are generated. Transparency
    helps reveal potential issues and biases and therefore can help increase trust
    or distrust in a model’s predictions. Would you feel comfortable putting a model
    into production if you did not have some understanding as to how different subsets
    of features contribute to the model’s predictions?


    Single decision trees, while often great descriptors, seldom make for good predictors,
    at least when compared to more contemporary techniques. Nonetheless, as we’ll
    see in Part I of this book, single decision trees are sometimes the right tool
    for the job, but it just so happens that more accurate decision trees tend to
    be harder to interpret. This is especially true for the decision trees discussed
    in Chapter 4, which are flexible enough to achieve good performance, but often
    pay a price in interpretability.'
