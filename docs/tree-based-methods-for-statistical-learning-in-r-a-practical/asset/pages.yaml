    \(\hat{\theta}\), estimated from \(N\) training records, then the jackknife estimate
    of the variance of \(\hat{\theta}\) is given by:


    ```

    \(\hat{V}_{jack} \left( \hat{\theta} \right) = \frac{N-1}{N} \sum_{i=1}^N \left(
    \hat{\theta}_{(i)} - \hat{\theta}_{(\cdot)} \right)^2, \quad (7.4)\)

    ```


    where \(\hat{\theta}_{(i)}\) is the statistic of interest using all the \(N\)
    training observations except observation \(i\), and \(\hat{\theta}_{(\cdot)} =
    \sum_{i=1}^N \hat{\theta}_{(i)} / N\).


