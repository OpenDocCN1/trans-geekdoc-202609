    sampled before each split) and \( n_{min} \) (the minimum size of any terminal
    node) depend on the type of outcome:


    +   - For classification, the typical defaults are \( m_{try} = \lfloor \sqrt{p}
    \rfloor \), where \( p \) is the number of features, and \( n_{min} = 1 \).


    +   - For regression, the typical defaults are \( m_{try} = \lfloor p/3 \rfloor
    \) and \( n_{min} = 5 \).


