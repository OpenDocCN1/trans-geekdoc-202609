  md: '# 3.4.3 Pruning


    Unlike CART and other exhaustive search procedures, CTree uses statistical stopping
    criteria (e.g., Bonferroni-adjusted _p_-values) to determine tree size and does
    not require pruning—although, pruning can still be beneficial in certain circumstances
    (see Section 3.4.5). That''s not to say that CTree doesn''t overfit. As we''ll
    see in Sections 3.4.5 and 3.5, the threshold \(\alpha\) has a direct impact on
    the size and therefore complexity of the tree and is often treated as a tuning
    parameter.


    # 3.4.4 Missing values


    Similar to CART, CTree can use the idea of surrogates to handle missing values,
    but it is not the default in current implementations of CTree. By default, observations
    which can''t be classified to a child node because of missing values are either
    1) randomly assigned according to the node distribution (as in the newer **partykit**
    package [Hothorn and Zeileis, 2021]), or 2) go with the majority (as in the older
    **party** package [Hothorn et al., 2021b].


    Observations with missing values in predictor _X_ are simply ignored when computing
    the associated test statistics during step 1) of Algorithm 3.1 (p. 122). Similarly,
    missing values associated with the splitting variable are also ignored when computing
    the test statistics in step 2). Once a split has been found, surrogates can be
    constructed using an approach similar to the one described in Section 2.7 for
    CART, in particular, creating a binary decision stump using the binary split in
    question as the response and trying to find the best splits associated with it
    using Algorithm 3.1 (p. 122).


    # 3.4.5 Choice of \(\alpha\), \(g()\), and \(h()\)


    From an inferential standpoint, \(\alpha\) is the prespecified nominal level of
    the general independence tests used for feature selection in step 1) of Algorithm
    3.1, which controls the probability of type I error. Recall that the type I error
    (or a _false positive_) occurs when we reject a true null hypothesis—or in our
    case, when we conclude that **_X_** and **_Y_** are not independent, when in fact
    they are (i.e., potentially using an irrelevant splitting variable). Obviously,
    we want the probability of a type I error to be low, which is why we fix \(\alpha\)
    to a small number (e.g., \(\alpha = 0.05\)).


    Although \(\alpha\) controls the probability of falsely rejecting _H_<sub>0</sub>
    in each node, we still need to consider the _statistical power_ of each test;
    that is, the probability of rejecting _H_<sub>0</sub> when it is false. In the
    context of recursive partitioning, power essentially dictates the chance of selecting
    a relevant predictor at each node. As noted in Hothorn et al. [2006c], the general
    tests of independence'
