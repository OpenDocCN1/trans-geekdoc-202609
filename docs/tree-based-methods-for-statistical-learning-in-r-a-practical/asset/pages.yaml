    # 2.4.3 To encode, or not to encode?


    When dealing with categorical data, we are often concerned with how to encode
    such features. In linear models, for example, we often employ dummy encoding or
    effect encoding, depending on the task at hand. Similarly, one-hot-encoding (OHE),
    closely related to dummy encoding, is often used in general machine learning problems
    outside of (generalized) linear models. And there are plenty of other ways to
    encode categorical variables, depending on the algorithm and task at hand.'
