    # ## 3.5.2 Example: wine quality ratings


    Ordinal outcomes are common in scientific research and everyday practice. In medical
    and epidemiological studies, for example, the ordinal response often represents
    the levels of a standard measurement scale such as severity of pain (e.g., none
    < mild < moderate < severe) [Harrell, 2015, p. 311].


    In this example, I''ll take up the wine quality data introduced in Section 1.4.8.
    The goal is to model the quality of red wines based solely on physicochemical
    tests, like acidity, and interpret the results. The target variable, the quality
    of the wine, is an ordinal variable from 0–10 derived from wine tasting by human
    experts. Note that in this data set, however, we only have observed ratings in
    the range 3–9. See `?treemisc::wine` for additional background and column information.


    As mentioned in Section 1.4.8, this is a well-known data set and is often used
    in statistical learning tutorials. However, many individuals treat this as a classification
    problem by arbitrarily dichotomizing the wine quality score and treating it as
    a binary classification problem. This is poor statistical practice and results
    in loss of information. Such “dichotomania” [Senn, 2005] is unfortunately also
    prevalent in medical and epidemiological research.'
