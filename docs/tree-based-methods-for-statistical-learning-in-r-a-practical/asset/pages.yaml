    # 3.2 Early attempts at unbiased recursive partitioning


    The basic idea behind unbiased recursive partitioning is to separate the split
    search into two sequential steps: 1) selecting the primary split variable, then
    2) selecting an optimal split point. Typically, the primary splitter is selected
    first by comparing appropriate statistical tests (e.g., a chi-square test if both
    X and Y are nominal, or a correlation-type test if X and Y are both univariate
    continuous). Once a splitting variable has been identified, the optimal split
    point can be found using any number of approaches, including further statistical
    tests, or the impurity measures discussed in Section 2.2.1.


    The idea of using statistical tests for split variable selection in recursive
    partitioning is not new. In fact, the CTree algorithm discussed later in this
    chapter'
