    \ illustration of finding splits.) Since this is a classification problem, we\
    \ can use cross-entropy or the Gini index to measure the goodness of each split;\
    \ here, we’ll use the Gini index and leave implementing cross-entropy as an exercise\
    \ for the reader.\n\nA simple R function for computing the Gini index in the two-class\
    \ case is given below. This function takes the binary target values as input,\
