  md: "function (or hazard rate) at time t, often denoted \\(\\lambda(t)\\), but makes\
    \ no assumption regarding the shape of \\(\\lambda(t)\\); since little is often\
    \ known about \\(\\lambda(t)\\) in practice, the Cox PH model is quite useful.\
    \ The hazard rate—also referred to as the *force of mortality* or *instantaneous\
    \ failure rate*—is related to the probability that the event (e.g., death or failure)\
    \ will occur in the next instant of time, given the event has not yet occurred\
    \ [Harrell, 2015, Sec. 17.3]; it's not a true probability since \\(\\lambda(t)\\\
    ) can exceed one. Studying the hazard rate helps understand the nature of risk\
    \ of time.\n\nExtending Algorithm 8.1 to maximize Cox's log-partial likelihood\
    \ (which is akin to minimizing an appropriate loss function) allows us to relax\
    \ the linearity assumption, which assumes that the (possibly transformed) predictors\
    \ are linearly related to the log hazard, and fit a richer class of models based\
    \ on regression trees. Below, I load the **survival** package and recreate the\
    \ same pbc2 data frame I used in Section 3.5.3:\n\n```\nlibrary(survival)\n\n\
    # Prep the data a bit\npbc2 <- pbc[!is.na(pbc$strt), ] # use randomized subjects\n\
    pbc2$id <- NULL # remove ID column\n# Consider transplant patients to be censored\
    \ at day of transplant\npbc2$status <- ifelse(pbc2$status == 2, 1, 0)\nfacs <-\
    \ c(\"sex\", \"spiders\", \"hepato\", \"ascites\", \"trt\", \"edema\")\nfor (fac\
    \ in facs) { # coerce to factor\n  pbc2[[fac]] <- as.factor(pbc2[[fac]])\n}\n\
    ```\n\nNext, I'll fit a boosted PH regression model using the **gbm** package;\
    \ details on the deviance/loss function used in Algorithm 8.1 can be found in\
    \ the **gbm** package vignette: `vignette(\"gbm\", package = \"gbm\")`. Here,\
    \ I use \\(B = 3000\\), a maximum tree depth of three, and a learning rate of\
    \ \\(\\nu = 0.001\\). The optimal number of trees (**best.iter**) is determined\
    \ using 5-fold cross-validation.\n\n```\nlibrary(gbm)\n\nset.seed(1551) # for\
    \ reproducibility\npbc2.gbm <- gbm(Surv(time, status) ~ ., data = pbc2,\n    \
    \            distribution = \"coxph\", n.trees = 3000,\n                interaction.depth\
    \ = 3, shrinkage = 0.001,\n                cv.folds = 5)\n\n(best.iter <- gbm.perf(pbc2.gbm,\
    \ method = \"cv\", plot.it = FALSE))\n\n#> [1] 1934\n```\n\nBelow, I construct\
    \ a Cleveland dot plot of the overall variable importance scores (Section 5.4)\
    \ using **gbm**'s summary method; the results are displayed in Figure 8.8:"
