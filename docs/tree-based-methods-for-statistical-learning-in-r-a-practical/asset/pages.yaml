    \ - obs) ^ 2))\n}\n\n# Compute train RMSE\nrmse(predict(ames.tree, newdata = ames.trn),\
    \ obs = ames.trn$Sale_Price)\n#> [1] 23.4\n\n# Compute test RMSE\nrmse(predict(ames.tree,\
