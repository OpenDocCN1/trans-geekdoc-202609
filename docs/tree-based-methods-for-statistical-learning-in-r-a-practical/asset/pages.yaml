    There are two prediction methods for NGBRegressor objects: `predict()`, which
    returns point predictions as one would expect from a standard regression model,
    and `pred_dist()`, which returns a distribution object representing the conditional
    distribution of $Y|x_i$ for each observation $x_i$ in the scoring data set. First,
    let’s compute point predictions for the entire data set and the corresponding
    MSE for comparison with our earlier GBM models on these data. Here, the results
    are rather similar in terms of accuracy.


    ```

    pred = ngb.predict(X_test)

    np.mean(np.square(als_test["dFRS"].values - pred))

    #> 0.26773677346012037

    ```


    Of more interest in probabilistic regression is an estimate of the conditional
    distribution itself, rather than some point estimate like the mean. In this case,
    I need estimates of the mean and standard deviation (since those parameters uniquely
    define a normal distribution). These are easily obtainable from the `params` component
    of the output from `pred_dist()`.


    Below, I estimate these parameters for the first observation in the test set ($x_1$)
    and use them to estimate Pr (dFRS < 0|$x_1$). The estimated mean and standard
    deviation (i.e., location and scale parameters of the normal distribution) for
    each observation of interest can also be used to obtain prediction intervals.


    ```

    dist = ngb.pred_dist(X_test.head(1)).params

    dist

    #> {''loc'': array([-0.4649206]), ''scale'': array([0.43861847])}

    scipy.stats.norm(dist["loc"][0], scale=dist["scale"][0]).cdf(0)

    #> 0.8554199300698616

    ```


    # 8.9.3 Example: post-processing GBMs with the LASSO


    Recall from Section 5.5 that it is possible to reduce the number of base learners
    in a fitted ensemble via post-processing with the LASSO (hopefully without sacrificing
    accuracy). We saw this using the Ames housing data with a bagged tree ensemble
    and RF in Sections 5.5.1 and 7.9.2, respectively.


    It may seem redundant to include another ISLE post-processing example, but there’s
    a subtle difference that can be overlooked with GBMs: the initial fit $f_0(x)$
    in Step 1) of Algorithm 8.1 essentially represents an offset.'
