  md: 'predictive accuracy, even if they do make the tree harder to interpret. Many
    decision tree algorithms support linear splits (e.g., CART and GUIDE) and Breiman
    [2001] even proposed a variant of RFs that employed linear splits based on random
    linear combinations of the predictors. This approach did not gain the same traction
    as the traditional RF algorithm based on univariate splits. In fact, I''m not
    aware of any open source RF implementations that support his original approach
    based on random coefficients.


    Menze et al. [2011] proposed a variant, called *oblique random forests* (ORFs),
    that explicitly learned optimal split directions at internal nodes using linear
    discriminative models§, as opposed to random linear combinations. Similar to *random
    rotation ensembles* (Section 7.8.3), ORFs tend to have a smoother topology; see,
    for example, Figure 7.16. Menze et al. [2011] even go as far as to recommend the
    use of ORFs over the traditional RF when applied to mostly numeric features. Nonetheless,
    the idea of non-axis oriented splits in RFs has still not caught on. The only
    open source implementation of ORFs that I''m aware of is in the R package **obliqueRF**
    [Menze and Splitthoff, 2012], which has not been updated since 2012.


    A more recent approach, called *projection pursuit random forest* (PPforest) [da
    Silva et al., 2021a] uses splits based on linear combinations of randomly chosen
    inputs. Each linear combination is found by optimizing a projection pursuit index
    [Friedman and Tukey, 1974] to get a projection of the features that best separates
    the classes; hence, this method is also only suitable for classification. PPforests
    are implemented in the R package **PPforest** [da Silva et al., 2021b]. Individual
    *projection pursuit trees* (Pptrees) [Lee et al., 2013], which are used as the
    base learners in a PPforest, can be fit using the R package **PPtreeViz** [Lee,
    2019] (which seems to have superseded the older **PPtree** package).


    # 7.8.2 Quantile regression forests


    The goal of many supervised learning algorithms is to infer something about the
    relationship between the response and a set of predictors. In regression, for
    example, the goal is often to estimate the conditional mean E (Y|**x**), for some
    observation **x**. In a typical regression tree, an estimate of the conditional
    mean is given by the mean response associated with the terminal node observation
    **x** falls into. In an RF, the terminal node means are simply averaged across
    all the trees in the forest.


    The conditional mean response, however, provides only a limited summary of the
    conditional distribution function F (y|**x**) = Pr (Y ≤ y|**x**). Denote the


    §Similar to the LDA-based approach used in GUIDE (Section 4.3.1). However, GUIDE
    restricts itself to linear splits in only two features at a time to help with
    interpretation and reduce the impact of missing values.'
