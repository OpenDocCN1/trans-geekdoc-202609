- pgno: 20
  md: 'I''ll often refer to ordered numeric variables as either numeric or continuous,
    and both ordered categorical and numeric variables collectively as ordered variables;
    note that ordered categorical variables can arbitrarily be mapped to integers
    as long as the original ordering is preserved (for example, low < med < high →
    1 < 2 < 3).


    Many tree-based algorithms only make the distinction between ordered and nominal
    variables. Categorical variables, whether ordered or nominal, will often be referred
    to as *factors* (e.g., temperature was recorded as an ordered factor with levels:
    freezing < cold < warm < hot). There''s also the concept of *censored variables*
    (usually the response), but I''ll defer discussion of censored outcomes to the
    example in Section 1.4.9.


    The *learning sample*, also called the *training data*, is often denoted by \(\boldsymbol{d}_{trn}
    = \{(\boldsymbol{x}_i, y_i)\}_{i=1}^N\), where \(N\) is the sample size, and \(\boldsymbol{x}_i\)
    is the \(i\)-th row of training features (e.g., \(x_{1i}, x_{2i}, \dots\)).


    On the rare occasion where I''m referring to a *random variable*, I''ll typically
    use an upper case Latin letter (e.g., \(Y\) or \(X\)) or the lowercase Greek letter
    \(\epsilon\); other Greek letters, like \(\beta\) or \(\theta\), will generally
    represent the fixed, but unknown parameters of a model. The operators E and V
    will denote the expected value (i.e., mean) and variance of a random variable,
    respectively. Several probability distributions are also used throughout this
    book and are denoted using a mix of capital letters (sometimes in a calligraphic
    font) and Greek letters, for example:


    +   \bullet \(\mathcal{U}(0, 1)\) represents a continuous uniform distribution
    over the interval \([0, 1]\).

    +   \bullet \(N(\mu, \sigma)\) represents a normal (or Gaussian) distribution
    with mean \(\mu\) and standard deviation \(\sigma\).

    +   \bullet \(\chi^2_\nu\) represents a chi-squared distribution with \(\nu\)
    degrees of freedom.


    To say that \(X_1, X_2, \dots, X_p\) are a random sample from some arbitrary distribution
    \(\mathcal{D}\), parameterized by \(\boldsymbol{\theta}\), I''ll write \(\{X_i\}_{i=1}^N
    \stackrel{iid}{\sim} \mathcal{D}(\boldsymbol{\theta})\); the *iid* stands for
    *independently and identically distributed*.


    Whenever possible, I try to emphasize words and terms you may be unfamiliar with
    using *italicized text*, and I encourage you to “google” them for more details,
    but not knowing them should not distract you from the fundamental ideas presented
    throughout this book.


    # 1.1.2 Supervised learning


    Supervised learning can often be thought of as an exercise in *function approximation*.
    For simplicity, we often assume that the response variable, \(Y\), is'
