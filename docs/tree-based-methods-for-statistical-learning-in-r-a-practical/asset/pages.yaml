- pgno: 224
  md: 'Although permutation importance is most naturally computed on the training
    data, it may also be useful to do the shuffling and measure performance on new
    data. This is discussed in depth in Molnar [2019, sec. 5.2]. Next, I’ll discuss
    a general technique for interpreting the effect of an individual feature (main
    effect) or combination of features (interaction effect).


    # ## 6.2 Feature effects


    While determining predictor importance is a crucial task in any supervised learning
    problem, ranking variables is only part of the story, and once a subset of “important”
    features is identified it is often necessary to assess the relationship between
    them (or subset thereof) and the response. This can be done in many ways, but
    in practice it is often accomplished by constructing plots of partial dependence
    or individual conditional expectation; see Friedman [2001] and [Goldstein et al.,
    2015], respectively, for details.


    # ### 6.2.1 Partial dependence


    Partial dependence (PD) plots (or PDPs) help visualize the relationship between
    a subset of the features (typically 1–3) and the response while accounting for
    the average effect of the other predictors in the model. They are particularly
    effective with black box models like random forests, support vector machines,
    and neural networks.


    Let \(\boldsymbol{x} = \{x_1, x_2, \dots, x_p\}\) represent the predictors in
    a model whose prediction function is \(\widehat{f}(\boldsymbol{x})\). If we partition
    \(\boldsymbol{x}\) into an interest set, \(\boldsymbol{z}_s\), and its compliment,
    \(\boldsymbol{z}_c = \boldsymbol{x} \setminus \boldsymbol{z}_s\), then the “partial
    dependence” of the response on \(\boldsymbol{z}_s\) is defined as


    ```

    \(f_s(\boldsymbol{z}_s) = E_{\boldsymbol{z}_c} \left[ \widehat{f}(\boldsymbol{z}_s,
    \boldsymbol{z}_c) \right] = \int \widehat{f}(\boldsymbol{z}_s, \boldsymbol{z}_c)
    p_c(\boldsymbol{z}_c) d\boldsymbol{z}_c, \quad (6.1)\)

    ```


    where \(p_c(\boldsymbol{z}_c)\) is the marginal probability density of \(\boldsymbol{z}_c\):
    \(p_c(\boldsymbol{z}_c) = \int p(\boldsymbol{x}) d\boldsymbol{z}_s\). Equation
    (6.1) can be estimated from a set of training data by


    ```

    \(\bar{f}_s(\boldsymbol{z}_s) = \frac{1}{n} \sum_{i=1}^n \widehat{f}(\boldsymbol{z}_s,
    \boldsymbol{z}_{i,c}), \quad (6.2)\)

    ```


    where \(\{\boldsymbol{z}_{i,c}\}_{i=1}^N\) are the values of \(\boldsymbol{z}_c\)
    that occur in the training sample; that is, we average out the effects of all
    the other predictors in the model.'
