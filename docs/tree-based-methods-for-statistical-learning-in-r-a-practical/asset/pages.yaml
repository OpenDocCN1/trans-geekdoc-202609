    # 1.5 There ain''t no such thing as a free lunch


    Too often, we see papers or hear arguments claiming that some cool new algorithm
    A is better than some existing algorithms B and C at doing D. This is mostly baloney,
    as any experienced statistician or modeler would tell you that no one procedure
    or algorithm is uniformly superior across all situations. That being said, you
    should not walk away from this book with the impression that tree-based methods
    are superior to any other algorithm or modeling tool. They are powerful and flexible
    tools for sure, but that doesn''t always mean they''re the right tool for the
    job. Consider them as simply another tool to include in your modeling and analysis
    toolbox.


    # 1.6 Outline of this book


    This book is about decision trees, both individual trees (Part I) and ensembles
    thereof (Part II). There are a large number of decision tree algorithms in existence,
    and entire books have even been dedicated to some. Consequently, I had to be quite
    selective in choosing the topics to present in detail in this book, which has
    mostly been guided by my experiences with tree-based methods over the years in
    both academics and industry. As mentioned in Loh [2014], “There are so many recursive
    partitioning algorithms in the literature that it is nowadays very hard to see
    the wood for the trees.”


    I’ll discuss some of the major, and most important tree-based algorithms in current
    use today. However, due to time and page constraints, several important algorithms
    and extensions didn’t make the final cut, and are instead discussed in the (free)
    online supplementary material that can be found on the book website. These methods
    include:


    +   - C5.0 [Kuhn and Johnson, 2013, Sec. 14.6], the successor to C4.5 [Quinlan,
    1993], which is similar enough to CART that including it in a separate chapter
    would be largely redundant with Chapter 2;

    +   - MARS, which was briefly mentioned in Section 1.2 (see Table 1.1), is essentially
    an extension of linear models (and CART) that automatically'
