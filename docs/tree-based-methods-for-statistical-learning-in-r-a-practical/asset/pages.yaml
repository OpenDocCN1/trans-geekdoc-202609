- pgno: 286
  md: '$s(\boldsymbol{x}, N) = 2^{-\frac{1}{B} \sum_{b=1}^B h_b(\boldsymbol{x}) /
    c(N)},$ (7.9)


    where \(N\) is the sample size, \(h_b(\boldsymbol{x})\) is the path length to
    \(\boldsymbol{x}\) in the \(b\)-th tree, and \(c(N)\) is the *average path length
    of unsuccessful searches*; in a binary tree constructed from \(N\) observations,
    \(c(N)\) is given by


    \(c(N) = 2H(N-1) - 2(N-1)/N,\)


    where \(H(i)\) is the \(i\)-th *harmonic number* (https://mathworld.wolfram.com/HarmonicNumber.html).


    Let \(\bar{h}(\boldsymbol{x}) = \frac{1}{B} \sum_{b=1}^B h_b(\boldsymbol{x})\)
    be the average path length for instance \(\boldsymbol{x}\) across all trees in
    the forest, and note that \(0 < s(\boldsymbol{x}, N) \le 1\) and \(0 < \bar{h}(\boldsymbol{x})
    \le N - 1\). A few useful relationships regarding (7.9) are worth noting:


    +   - \(s(\boldsymbol{x}, N) \to 0.5\) as \(\bar{h}(\boldsymbol{x}) \to c(N)\);

    +   - \(s(\boldsymbol{x}, N) \to 1\) as \(\bar{h}(\boldsymbol{x}) \to 0\);

    +   - \(s(\boldsymbol{x}, N) \to 0\) as \(\bar{h}(\boldsymbol{x}) \to N - 1\).


    Since the assumption is that anomalies are easier to isolate, they are likely
    to have shorter path lengths on average. Hence, any instance \(\boldsymbol{x}\)
    with values of \(s(\boldsymbol{x}, N)\) close to one tend to be highly anomalous.
    If \(s(\boldsymbol{x}, N)\) is much smaller than 0.5, then it is safe to regard
    \(\boldsymbol{x}\) as a “normal” instance. If all the instances return a value
    close to 0.5, then it is safe to say the sample does not really contain any anomalies.
    Note that these are just guidelines.


    Isolation forests are a top-performing unsupervised method for detecting potential
    outliers and anomalies [Domingues et al., 2018]. Compared to other outlier detection
    algorithms, isolation forests are scalable (e.g., they have relatively little
    computational and memory requirements), fully nonparametric, and do not require
    a distance-like matrix. The Anti-Abuse AI Team at LinkedIn uses isolation forests
    to help detect abuse on LinkedIn (e.g., fake accounts, account takeovers, and
    profile scraping) [Verbus, 2019].


    Let’s illustrate the overall idea with a simple simulated example. Consider the
    data in Figure 7.17 (left). Here, the points \(\{(x_{1i}, x_{2i})\}_{i=1}^{2000}\)
    were independently sampled from a standard normal distribution. However, I changed
    the first observation to \((x_{11}, x_{21}) = (5.5, 5.5)\) (purple point), which
    is quite anomalous compared to the rest of the sample.


    A single IsoTree from an isolation forest is displayed in Figure 7.17 (right),
    along with the path taken by \(\boldsymbol{x}\) (in purple). Here \(\boldsymbol{x}\)
    has a path length of two and you can see that the path \(\boldsymbol{x}\) takes
    in the tree is relatively shorter than most of the other available paths.'
