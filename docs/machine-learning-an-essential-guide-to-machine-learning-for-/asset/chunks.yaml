- raw: "If the breach is ever discovered, the upper management will just keep quiet\
    \ about it and move on with their business, which is exactly what Facebook did\
    \ until the Cambridge Analytica scandal. In fact, a March 2018 interview with\
    \ Facebook’s platform operations manager, Sandy Parakilas, shows that breaches\
    \ and unauthorized data harvesting were common in 2011 and 2012 while he worked\
    \ there[\\[40\\]](#part0000_split_025.html#_ftn40). When he tried to warn a Facebook\
    \ executive he was told, “Do you really want to see what you’ll find?” The implication\
    \ was that the company is legally more protected if it doesn’t try to audit data\
    \ leaks because then it would have to stop them, hurting Facebook’s bottom line.\
    \ This is why Mark Zuckerberg can go in front of the Congress and repeat a variation\
    \ of “I don’t know” with a perfectly straight face for hours on end – he really\
    \ doesn’t know, since other people down the chain actually call the questionable\
    \ shots.\n\nThankfully, it seems the European Union regulators are starting to\
    \ wake up from the stupor and catch on to the Big Data shenanigans. General Data\
    \ Protection Regulation (GDPR) is a 2016 set of regulations applying to all companies\
    \ that serve EU citizens and set to go into effect on May 25, 2018. Sprawling\
    \ over 200 pages[\\[41\\]](#part0000_split_025.html#_ftn41), GDPR calls the protection\
    \ of personal data a fundamental right and says, “The processing of personal data\
    \ should be designed to serve mankind”. GDPR forbids companies from holding more\
    \ personal data than necessary and demands it be held for the least time possible\
    \ while giving the users “the right to be forgotten”, an ability to go in and\
    \ have everything about them deleted from the company’s servers. GDPR also forbids\
    \ “automated decision-making and profiling” done by machines on the basis of personal\
    \ data, such as when someone applies for a credit card and gets automatically\
    \ denied based on a score or profile. Fines for Big Data companies that breach\
    \ GDPR are most certainly not a slap on the wrist, going up to 20 million euros\
    \ or 4% of their annual worldwide turnover, whichever is higher.\n\n##   \n\n\
    Chapter 15 – Shadow profiles\n\nIn the meantime, Facebook will keep gathering\
    \ data, even on those people who don’t care about Facebook or even have a profile.\
    \ The exact same scheme we saw happen with Target happens once again as Facebook\
    \ collects tidbits of private data on people who are being referenced in people’s\
    \ contacts, messages and content. These people are constantly being tracked without\
    \ even realizing it and while they think they’re anonymous. This is called “shadow\
    \ profile” and goes way beyond what anyone could ever imagine, giving Facebook\
    \ an uncanny ability to match up new users with lifelong friends and schoolmates\
    \ almost instantly[\\[42\\]](#part0000_split_025.html#_ftn42).\n\nShadow profiles\
    \ were accidentally revealed in 2013 when users could download a file showing\
    \ them all the data Facebook had on them. The file had all the data on all the\
    \ user’s friends as well, including data the friends didn’t publicly share with\
    \ Facebook. That same year Facebook experienced another embarrassment as 6 million\
    \ phone numbers from users who never shared them with the platform got leaked.\
    \ Remember what we talked about: Big Data plus a bit of social engineering leads\
    \ to massive privacy breaches. Mark Zuckerberg would get grilled in 2013 by the\
    \ House Energy and Commerce Committee on the topic of shadow profiles, where he\
    \ stated that he didn’t really know what they were and dodged all questions with\
    \ a variation of “I don’t know”[\\[43\\]](#part0000_split_025.html#_ftn43). As\
    \ we saw previously, executives benefit a lot by just letting things run on their\
    \ own while not being involved in anything. \n\nHow exactly are shadow profiles\
    \ made? It’s due to “metadata”, a strange and subtle concept, so let’s take a\
    \ detour and explain what that is. The definition is “data about data” but we\
    \ can say it’s everything impersonal about an event. For example, when we have\
    \ a phone conversation with someone the content is private data, but how long\
    \ the phone call lasted is metadata. While private data is generally protected\
    \ from intrusion, metadata is barely considered, and that’s exactly what companies\
    \ such as Facebook jumped on. They realized having enough metadata reveals private\
    \ data with a high degree of certainty. It’s as if the company is able to peek\
    \ into private messages and conversations by simply knowing when and where they\
    \ were sent. Go back to the start of this chapter and reread the Target incident\
    \ – private and metadata reveal one another. \n\nNow let’s imagine Alice and Bob\
    \ chatting through Facebook’s Messenger. If it’s the smartphone app, both of them\
    \ already allowed the app to access almost everything on their device in order\
    \ to install it: contacts, files, Wi-Fi and GPS information, camera, microphone,\
    \ accelerometer (device that shows how quickly the device is being tilted) and\
    \ much more. With the app simply having access to any one of those metadata categories\
    \ across millions of people, Facebook can track people in all sorts of ways. For\
    \ example, knowing the names of Wi-Fi networks both Alice and Bob come across\
    \ during the day lets Facebook know how close they are to one another; tracking\
    \ the accelerometer lets Facebook see whether Alice and Bob like to jog and mark\
    \ the place where the phones sit still during the night as their homes; if the\
    \ app keeps track of the strength of a Wi-Fi signal it’s possible to know if it’s\
    \ in the other room, behind a door and much more. It all comes down to casting\
    \ as wide of a net as possible and grabbing absolutely all metadata.\n\nThe narrow\
    \ AI that processes both Alice’s and Bob’s messages will constantly jot down notes\
    \ on what is being said, so let’s assume they mention Jack, who doesn’t have a\
    \ Facebook profile and doesn’t even use the internet. The AI scans both Alice’s\
    \ and Bob’s contacts and finds the same phone number that refers to “Jack Wilshere”,\
    \ concluding that it’s the same person and starts building around it. The AI will\
    \ scan faces in photos and thanks to the tagging function have a much easier time\
    \ finding Jack, look for keywords in conversations and reference contacts to figure\
    \ out everything about him, including love affairs and family relationships. In\
    \ this way Jack is being tracked because people who know him are careless with\
    \ their data while he thinks he’s off the grid. The official explanation for all\
    \ of this background activity is Facebook’s “People You May Know” feature. On\
    \ the PC it’s a bit different thanks to different privacy tools people can use,\
    \ with the Like buttons across websites tracking the person as long as they’re\
    \ logged into Facebook and possibly even when logged out.\n\nThe Facebook apps\
    \ (including Instagram and WhatsApp) might also be listening to not just the smartphone\
    \ owners but everyone else around them, as suggested in 2016 by Kelli Burns, a\
    \ mass communication professor from South Florida. She discussed certain topics\
    \ around her smartphone and later found ads for those exact topics. Other users\
    \ tried this themselves and got similar results, such as leaving the smartphone\
    \ next to a Spanish radio broadcast to get ads in Spanish the next day. Facebook\
    \ introduced this feature in 2014 as a way to quickly identify what was happening\
    \ around the user and help them write their updates; for example someone who’s\
    \ watching a hockey game could start typing, “I’m at a h…” and the AI would autocomplete\
    \ the Facebook update based on just the noise. Facebook tried to calm the controversy\
    \ by stating “we never store raw audio”, meaning there’s contextual processing\
    \ by the AI, which is again how Facebook can claim nobody is being spied on –\
    \ it’s not done by a human. There is simply no downside to data mining users until\
    \ the cows come home.\n\n##   \n\nChapter 16 – Windows 10"
