    The hidden compartments inside the cabinet allowed a chess player to remain comfortably
    seated and even slide his seat around on rails, letting the Mechanical Turk owner
    open cabinets and show various cogs and wires in action to skeptics. Chess pieces
    were held to the board with strong magnets that also moved strings attached to
    the miniature chess board inside the cabinet, letting the hidden chess master
    see what’s going on and respond with his own moves. The Turk’s left arm could
    move and the hand open and close through a series of levers, allowing the hidden
    player to keep the match going. If the piece was improperly placed or snatched
    from beneath the automaton’s hand, it would continue the motion and the owner
    would intervene to complete the move. Mechanical Turk will later be equipped with
    a voice box that could exclaim, “Check!” for added effect.


    Chess proved to be a popular game for the display of machine intelligence and
    in 1890 a Spanish inventor Leonardo Torres y Quevado created a simple toy that
    could mate a human opponent in a king-and-rook versus king end game situation.
    The toy was actually just a circuit, wire and a switch and sometimes took 50 moves
    to resolve a situation that might have otherwise taken 15-20 but it inevitably
    always won. It took another 70 years for this tinkering with toys and chess boards
    to become an actual science.


    Started in 1959 by Arthur Samuel, an MIT graduate with a penchant for computers,
    machine learning is a field of science that focuses on making computers that can
    evaluate their environment and change their actions accordingly to become more
    efficient. Working with the smallest amounts of memory and processing power, Arthur
    had his checkers-playing program calculate the chances of any given move winning
    the match and then let it play against itself thousands of times until it optimized
    and recorded as many moves as it could. That was enough, the machine learned just
    like a human would.


    While Samuel’s program was never able to learn beyond amateur level, this was
    the first example ever of machine learning coming to life, and it happened with
    astounding clarity. Machine learning scientists had their appetites whetted and
    now they were hungry for more. How do we make a professional checkers-playing
    program? How about an unbeatable one? This is where they ran into trouble, as
    it turns out computers scale poorly and simply stacking hundreds or thousands
    of the same program or device in hope order will appear on its own produces total
    chaos as the machine has no idea how to tie it all together. The raw power was
    there but something was missing – coordination.


    A supercomputer cluster that would try matching the processing potential of a
    human brain would literally require an entire output of a 10-megawatt power plant,
    consuming power roughly equal to what a typical US household spends in a year[\[2\]](#part0000_split_025.html#_ftn2)
    and there would again be no guarantee that the machine would actually provide
    anything worthwhile. Programmers quickly realized that a machine capable of learning
    would have to somehow mimic the brain’s natural design and flexibility. In 2009,
    Stanford University’s Kwabena Boahen made a prototype Neurogrid computer with
    transistors that misfired 30-90% of the time and still produced consistent output
    by looking for consensus amidst all the noise and random signals. That version
    of Neurogrid had a million transistors, equaling ![](images/00001.jpeg) of neurons
    in a mouse brain[\[3\]](#part0000_split_025.html#_ftn3). Not knowing how to make
    them coordinated, scientists focused on just making a machine that could beat
    a human in a board game.


    Chess-playing programs were made all the way back in the 1970s, but the advance
    in computing power helped them see millions of combinations ahead of their human
    opponents. Going back to square one, scientists looked at how to solve chess and
    make a machine that could see all the moves, all the time. The thing is, with
    adding more squares the problems becomes exponentially more complex and it wouldn’t
    be until 1990s that a real challenger would appear to defeat Gary Kasparov, the
    best chess player at the time.


    In February 1996, IBM’s Deep Blue chess program played Gary in a highly publicized
    6-match bout, narrowly losing 2-4. The rematch would be held next year and the
    upgraded algorithm was twice as fast, but Gary couldn’t stay psychologically stable.
    After forfeiting a game that he could have drawn, Gary never recovered and ultimately
    lost 2-1 with 3 draws. Computer analysis of chess has helped us understand different
    opening and endings, upending many chess axioms that had previously held for centuries
    but smart board game playing machines would creep on to dominate another one,
    Go.


    Go is an ancient Chinese game that emphasizes strategic thinking played on a board
    measuring 19 times 19 tiles, with white and black pieces (stones) set by two players
    taking turns. The objective of the game is to surround the opponent’s stone with
    one’s own, at which point the captured pieces are removed from the game. In 2014,
    an AI computer program managed to beat an expert Go player, though, by having
    a 4-move advantage, prompting researchers to boldly claim they’ll beat humans
    within 10 years.


    The main difference between chess and Go is that the latter has many more combinations
    of board states and thus requires exponentially more computational power. While
    Deep Blue could assign value to board states and propose the best move, Go would
    require something much better – Monte Carlo tree search. This decision-making
    algorithm is currently used in some video games where opponents have incomplete
    information (such as poker) to estimate the most promising courses of action,
    simulate them to their conclusion and learn from the outcome. The Monte Carlo
    tree search starts by the program choosing a random move for itself and trying
    to predict the strongest move for the opponent, then branching out with the strongest
    move for itself and so on. The more complex the game, the more time it takes for
    the algorithm to go through all the possible moves, updating the win rate of all
    moves as it reaches the end of the game.


    For human players, being good at Go has nothing to do with knowing the value of
    any given move but feeling the overall shape and position of all pieces. It’s
    been shown that masterful Go moves and strategies look symmetrical and pleasing
    to the eye, which is what has captured the imagination of generations of players.
    However, the program was let to run and collect enough data on all the possible
    moves, eventually playing against itself until it became strong enough to face
    the best of the best.


    It was in January 2016 that Google’s AlphaGO, an expert Go playing program, ran
    through enough iterations and finally faced Lee Sedol, the best Go player in modern
    history, winning 3-0. Commentators watching the matches noted Lee Sedol showed
    a lot of mental vulnerability while AlphaGO played a flawless game. It’s not a
    surprise, since AlphaGO ran on 170 graphics cards and 1,200 CPUs both during the
    training and the game itself, which required a special fiber optic cable laid
    down to the room where the two would play,[\[4\]](#part0000_split_025.html#_ftn4)
    and the use of neural networks.


