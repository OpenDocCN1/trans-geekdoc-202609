    # Windows 10 遥测与数据挖掘


    我们已经看到 Target 和 Facebook 如何收集所有人的数据，因此只要我们避开折扣店和社交网络，我们的私人数据和元数据就应该是安全的，对吧？远非如此，因为正是当所有其他公司开始采取行动时，我们才会彻底失去对隐私的控制。当微软这家最大的软件公司之一开始通过
    Windows 侵入性地收集私人数据时，我们即将经历一场剧变，付费产品和服务将全方位袭来——我们离不开它们，而它们却会 24/7 不间断地收割我们的私人数据。在本案中，争议的根源在于遥测。


    ## 什么是遥测？


    遥测是元数据的一个子集，代表某个程序或设备的使用情况，例如，某个用户启动特定程序或在设备上打开同一文件的次数。每当我们使用的程序或应用崩溃，且我们有选项向开发者发送崩溃报告时，我们实际上就是在发送遥测数据以帮助他们弄清发生了什么。这是遥测的一种合法用途，但请注意，这意味着存在实际原因（崩溃），用户会收到通知并必须执行操作以发送数据，此后遥测收集即停止。


    遥测收集听起来不一定坏，但当它大规模进行时，所有人的私人数据都会陷入危险，甚至包括那些不使用该产品或服务的人，正如我们在 Facebook 和 Target
    身上所见。例如，了解用户在 `Windows 10` 上双击图标或更改设置的平均时间，可以显示其过去、现在或未来的残疾情况；对用户语音的分析可以指示出用户自己都未察觉的焦虑、压力或心理问题。这仅仅是两个数据点，但如果一个人每天使用
    `Windows 10`，它就会了解一切。


    ## Windows 10：“最后”的操作系统


    `Windows 10` 是微软将要生产的最后一个操作系统，基于 `Windows 8` 设计，通过持续的强制更新保持常青。`Windows 10` 于 2015
    年发布时，在为期 1 年的时间内免费提供给所有人，这足以暗示其中存在某种数据挖掘的阴谋。目前 `Windows 10` 家庭版售价 119 美元，这是面向最不懂技术用户的最基础版本，并收集大量旨在画像和投放广告的数据。因此，`Windows
    10` 既有价格标签，又显示广告，还挖掘用户数据，让微软通过一个产品和一个用户获得三重收入来源。


    ## 广告整合


    `Windows 10` 在桌面、“开始”菜单内以及 `Edge` 浏览器中包含个性化广告。即使用户购买了更高级的版本，他们仍会看到广告，包括电脑闲置时通过称为
    `Windows Spotlight` 的功能从 `Bing` 下载的屏保广告。此功能虽可关闭，但好奇的用户也可点击右上角“点赞”或“点踩”，以训练 AI
    下次展示什么内容。广告也会从任务栏弹出，并可能出现在“操作中心”（在旧版 Windows 中称为“控制面板”）中。一个名为“获取 Office”的特殊程序随
    `Windows 10` 预装，并定期显示 `Microsoft Office` 广告。这些功能虽可禁用，但有用户反映它们可能会在更新后自动重新启用。


    ## Windows 应用商店限制


    `Windows 10` 上的所有程序均通过 `Windows Store` 购买，并受到严格保护，防止用户干预。这通常意味着几乎无法自定义：无鼠标宏、无覆盖层、无模组。在其他版本的
    Windows 上如果程序出问题通常有变通办法，但在 `Windows 10` 上则没有。此外，微软针对 `Windows Store` 购买的官方政策是“所有购买均为最终交易，不可退款”[[44]](#part0000_split_025.html#_ftn44)。


    ## 全面数据收集


    `Windows 10` 收集计算机上及连接到计算机的所有硬件和所有软件的所有遥测数据，包括网络和 Wi-Fi 名称。用户个人数据从数据经纪人处购买、与合作伙伴公司共享并从中获取、从用户的公开社交媒体帖子和公开可用来源（如政府数据库）获取。这些数据包括用户的兴趣和收藏、内容消费、语音数据（“可能包含背景声音”）、文本和图像数据、联系人和关系、社交数据（“点赞、点踩、事件”）、位置数据及其他输入，例如使用
    `Xbox` 的 `Kinect` 时的骨骼线框。


    ## Cortana：虚拟助手


    我们才刚刚热身，因为关键在于 `Windows 10` 的虚拟助手 `Cortana`。以电子游戏系列“光环”中的助手命名，`Cortana` 本应成为吸引用户的杀手级功能，类似于
    `Xbox` 的 `Kinect`。


    `Cortana` 是一个专注于语音识别和用户意图理解的弱人工智能，在服务条款中拥有专门章节。`Cortana` 的理念是用户可使用语音搜索网页、打开文件、添加日程等，且随使用次数增加而变得更聪明。为实现这一点，她通过分析“通话、短信和电子邮件历史”来研究人际关系，追踪用户联系的人，就日期和任务提供建议，深入
    `Edge` 历史记录以了解用户，并与第三方服务（如 `Office 365`、`LinkedIn` 和 `Uber`）共享和获取数据。`Cortana`
    了解到的用户信息存储在“笔记本”中，用户可访问并手动编辑其中的错误信息，这是其监督学习的一部分。


    ## 隐私政策透明度


    所有这些数据挖掘行为均在微软隐私声明中直接承认，隐藏在十几个“了解更多”按钮下的大量要点中[[45]](#part0000_split_025.html#_ftn45)。明确地说，`Windows
    10` 是一款出色的生产力工具，Facebook 是与远方亲友保持联系的方式，而 Target 则应有尽有；问题在于它们不受约束、隐蔽地收集私人数据，且作为一个全有或全无的提议。这些公司在收集私人数据方面没有任何指导原则，除非最有利可图；它们通常不在乎数据在它们用完后会怎样，且经常共享、出售或疏忽大意地留存数据，任由任何人通过社会工程学手段获取访问权限。遥测收集以前也有，但从未像
    `Windows 10` 这样赤裸裸且彻底。最糟糕的是，用户正为此付费，却感觉自己捡了大便宜。


    # 第 17 章 – 生物识别


    如果收获的私人数据仅围绕消息、联系人和文件名，那还好；但当一家公司开始收集真正的个人数据（如 DNA）并遭窃取时会怎样？现在我们进入生物识别的世界，即用于准确识别个人的私人信息，如指纹、声纹和面部形状。指纹已被用于追踪罪犯几个世纪，但它们绝非确凿证据，且总存在误差范围，尽管
    CSI（犯罪现场调查）剧集里不这么演。比对两个指纹意味着在两者上选择任意数量的参考点并查看是否匹配；如果足够多的点匹配，进行比对的法医专家就有相当把握认为是同一人。然而，同卵双胞胎可能拥有相同的指纹，如果我们实现了稳定的克隆技术，克隆体推测也将拥有相同的指纹。立法滞后于现状到近乎滑稽的地步，甚至未将克隆纳入考量，因此保护我们的生物识别数据尽可能多地取决于我们自己。


    '
