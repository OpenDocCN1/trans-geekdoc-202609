    \ harvesting scheme of the decade out of the water. Nobody understood the true\
    \ meaning of the Cambridge Analytica scandal, not the Congress, not the general\
    \ public nor media pundits and Mark wasn’t about to tell. An outside company,\
    \ Cambridge Analytica got ahold of enormous amounts of personal data from unsuspecting\
    \ Facebook users that was then fed into a machine to have it try and predict the\
    \ voting behavior of those people. In short, it was about machine learning. \n\
    \nThis book will explain the concepts, methods and history behind machine learning,\
    \ including how our computers became vastly more powerful but infinitely stupider\
    \ than ever before and why every tech company and their grandmother want to keep\
    \ track of us 24/7, siphoning data points from our electronic devices to be crunched\
    \ by their programs that then become virtual crystal balls, predicting our thoughts\
    \ before we even have them. Most of it reads like science fiction because in a\
    \ sense it is, far beyond what an average person would be willing to believe is\
    \ happening.\n\nThere’s a lot of dry math and programming lingo in machine learning,\
    \ but seeing how this is a read intended for beginners, I’ve cut it all down as\
    \ much as possible and pushed it to the very end of this book while keeping the\
    \ concepts intact. There is no need for any particular expertise or education\
    \ to understand this book, but if the reader has either it is my hope they’ll\
    \ find this book an insightful and enjoyable read.\n\n##   \n\nChapter 1 – What\
    \ is machine learning?\n\nThe actual definition of machine learning is “having\
    \ a computer do a task and giving it an experience that makes the computer do\
    \ the task better.” It’s like if we taught the machine how to play a video game\
    \ and let it level up on its own. The idea is to avoid manually changing the code\
    \ in the program, but rather to make it in such a way that it can build itself\
    \ up, adapt to user inputs in real time and just have a trusted human check in\
    \ on it every once in a while. If things go awry, shut it all down, see where\
    \ the problem arose and restart the updated project.\n\nThere can be a human involved\
    \ from the start if the machine learning involves supervised learning, in which\
    \ a person helps the program recognize patterns and draw conclusions on how they’re\
    \ related; otherwise, it’s unsupervised learning, where the program is left to\
    \ find meaning in a mass of data fed to it. Email spam filters are a great example\
    \ of supervised learning, where we’ll click the “Spam” button and the machine\
    \ will learn from it, looking for similarities in the incoming emails to deal\
    \ with spam before we do. An example of unsupervised machine learning would be\
    \ a trend analysis program that looks at the stock market trying to figure out\
    \ why a certain stock moved and when it will move again. Any human would be at\
    \ a loss as to why the trends happened, so the machine’s answer is as good as\
    \ any. If its predictions make us a fortune, we keep the program running.\n\n\
    There are different subtypes of machine learning, each of which can be used as\
    \ supervised or unsupervised with different efficiency:\n\n*   classification\
    \ has the machine provide a model that labels incoming data based on what previous\
    \ data was labeled as (spam filters classify emails as “spam” or “non-spam”)\n\
    \n*   regression analysis is a way to crunch statistical data and produce a prediction\
    \ of future trends based on how variables relate to one another\n\n*   density\
    \ estimation shows the underlying probability for any given distribution (such\
    \ as the Bob and Fred example mentioned below)\n\n*   dimension reduction is a\
    \ way to simplify inputs and find common properties (for example, a book sorting\
    \ algorithm that would try to sort books into genres based on keywords in titles)\n\
    \n*   clustering has the program cluster data and label clusters on its own\n\n\
    *   learning to learn (aka meta learning) gives a set of previously tried machine\
    \ learning models to a program, and lets it choose the most suitable one and improve\
    \ upon it."
