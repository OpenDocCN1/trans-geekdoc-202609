    # Tech companies are already eyeing biometrics as a supposedly unhackable way
    to phase out passwords that can be guessed or smartphones that can be stolen.


    The latest iPhone models are already using home buttons that recognize fingerprints
    and allow facial scanning to unlock the device. Social networks (again Facebook)
    are well underway on gathering enormous swaths of biometrics on all their users
    but now other industries have started doing it as well, all under the guise of
    added convenience.


    In 2017, Caliburger installed fast food kiosks in Pasadena with facial recognition
    where the customers simply need to smile to bring up their purchase history, with
    plans to eliminate cash and card payments and make it all about biometrics.


    In Jinan, China facial recognition cameras film jaywalkers, scan the police records,
    bring up their pictures on public billboards and shame them in front of everyone.
    The plan is to eventually have a “good citizen score” for all Chinese, a value
    of how much they benefit the society. The stated goal is to “make it hard for
    the discredited to take a single step”[\[46\]](#part0000_split_025.html#_ftn46).


    History has shown that there is no such thing as a perfect security measure. All
    security relies on deterrence and being able to annoy the potential thief until
    they give up and find an easier target. This means that if a villain is determined
    enough there is no such security measure that will stop him, with the added problem
    being that biometrics can’t be changed. Identity theft in a society ruled by a
    narrow AI and biometrics is a truly frightening prospect as the victim now has
    no way to get a new identity and lead a normal life. Even the person’s likeness
    is enough to get them into trouble.


    There already exists a narrow AI that can scan a person’s face and overlay it
    on top of someone else’s head, making it seem like Elvis or Mother Theresa are
    back, saying and doing all sorts of outrageous things. This process is known as
    “deepfake” and is doable with a simple open source program called `FakeApp`. Developed
    by Google’s AI division in 2015, this program uses neural networks to process
    biometric data of target and victim and splice them together. A New York Times
    reporter tried swapping his face with Jake Gyllenhaal’s with the help of an expert[\[47\]](#part0000_split_025.html#_ftn47)
    and got passable results in just 3 days and about $90, the cost of electricity
    and renting a remote server for the program. Of course, the higher the likeness
    the better the results, but we’re living in outrageous times where even an obvious
    fake video can spark a public outcry. For now the program requires thousands of
    high definition photos of both faces for best results but we shouldn’t count on
    laziness of villains to keep us safe.


    # Chapter 18 – Self-replicating machines


    Colonizing an inhospitable environment is a road paved with bones of pioneers
    and frontier builders, as shown by how the colonization of the New World went.
    In 1607, a group of 104 men set sail to what is now the United States and founded
    Jamestown, the capital of Virginia, to extract resources and start a colony. Within
    10 years, 80% of them were dead due to starvation, disease and the militant rule
    of John Smith, who eventually had to marry an Indian chief’s daughter, Pocahontas,
    to give the colonists at least some respite. It’s only when the colonists started
    growing and selling tobacco that settlers started pouring in, having been promised
    free land if they voluntarily gave themselves to indentured servitude to farm
    said tobacco in hellish conditions.


    If we were to venture to the surface of Mars we’d have to face the exact same
    or even worse circumstances: sending waves of colonists to certain death, with
    each new wave having slightly higher chances of survival until they managed to
    make a self-sustainable economy that would prop up the living conditions, create
    comforts to have women voluntarily go, have them reproduce and then reduce infant
    mortality to the point where the colonist population is self-sustainable as well.
    But what if we had intelligent machines to do the initial settlement for us?


    Enter Von Neumann, a Hungarian scientist from the early 20th century who theorized
    about self-replicating structures having sort of a mechanical DNA before DNA was
    discovered. He imagined a machine that would carry a blueprint of itself and could
    construct a printer that would read the blueprint and replicate it. Simply make
    a couple million of these puppies on Earth, send them to Mars and wait a couple
    decades. They will scan the surface, mine it for materials and multiply, just
    like a living organism would, creating shelters, roads, and mapping the environment
    for the initial wave of settlers who now have solid chances of making it.


    Von Neumann also considered the idea of self-replicating space probes that could
    study, guide or destroy the evolution of alien lifeforms to suit the needs of
    humanity, which inspired Arthur Clarke to write his “2001: A Space Odyssey” wherein
    a black monolith helps primates ascend to humans and then “star children” (that’s
    why the closing scene depicts a baby floating in space). Stanley Kubrick made
    the novel into a movie, which is a real treat for the eyes and the brain. But
    how do we turn off Von Neumann machines? Let’s just say scientists haven’t worked
    out all the kinks yet.


    The idea of self-replicating intelligent machines consumed scientists of that
    time to the point some denied any existence of extraterrestrial intelligence simply
    because they would have thought of making Von Neumann machines themselves and
    we’d already have encountered them. The other camp of scientists replied that
    any intelligent aliens would be aware how dangerous Von Neumann machines are to
    themselves and wouldn’t make them in the first place, bringing us back to square
    one and making this debate no more scientific than two kids screaming at each
    other in the playground, “My dad can lift infinity elephants more than your dad!”


    In any case, waves of Von Neumann machines would still take a lot of resources,
    but what if we made them microscopic? Here’s where we meet nanobots (or nanites),
    tiny and hopefully intelligent robots that can manipulate matter on a molecular
    level. No one has created nanobots yet but nano-motors and switches have been
    created and tested. Four Israeli computational biologists published a research
    paper[\[48\]](#part0000_split_025.html#_ftn48) in 2012 where they talk about creating
    smart, programmable drugs that only go after diseased cells. For now these scientists
    have made a `NOR` logic gate (both inputs need to be negative) inside an `E. coli`
    cell that glows green if certain genes are working as they should but that can
    just as easily become a drug that goes into each cancer cell and looks to see
    if the genes are all right – if not, boom goes the cell. The same research paper
    shows how to create `NOT`, `AND` and `OR` logic gates inside the cell, which is
    all we’d need to create a computer, albeit a living one.


    In theory nanobots are able to take anything and turn it into anything else given
    enough time. This would open the doors to actual alchemy as nanobots turn lead
    into gold, stones into diamonds and twigs into titanium. The human race would
    never again want for anything and we’d live in a paradise, or at least that’s
    what the idea is. The most important application for nanobots is in medicine,
    as we’d be able to give the patient a capsule filled with nanobots that dissolves
    in the stomach and pretty much makes them immortal.

    '
