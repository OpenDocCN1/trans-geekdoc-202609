    # The Evolution of AI: From Narrow to Super Intelligence


    ## The Internet as a Catalyst


    It’s the coming of the internet as the global data highway that changed everything
    again and made the prospect of AI appear tantalizingly close. No matter how much
    scientists had tried to feed a program with data, nothing could beat something
    like a global search engine with millions of users – simply have a machine tap
    into the incessant fount of data points and let it learn. There were some benefits
    to the general public as well, since search engines need to learn as much as possible
    about individual users to provide bespoke results. In other words, Google wants
    to know which users dig music and which dig dirt to present each group with the
    most relevant results when they search for “rock”, an added bonus being that machine
    peeking at and crunching personal user data technically doesn’t count as invasion
    of privacy. This scheme required an adoption of online-only storage, the clever
    marketing term for it being “cloud”. Once users felt at ease having their private
    data in the cloud (aka someone else’s computer where they don’t have the right
    to view or edit it), the transformation of machine learning into AI building could
    begin in earnest.


    ## The Opacity of Machine Learning


    Note how crucial it is that nobody really knows how search engines work or that
    they even involve machine learning. This is because, unlike with static programming
    software that gives the user all the files to execute, tinker with and modify,
    the machine learning model has to isolate the vulnerable program and even hide
    the very fact it’s learning or the users might try to mess with it, skewing the
    results. An AI thrown into the public court of opinion stands no chance, as evidenced
    by Microsoft’s Tay, a chatbot users could interact with through Twitter in March
    2016. Tay was programmed to learn social cues and respond to topics based on her
    Twitter interactions with real users, but the avalanche of hateful and racist
    comments quickly turned her into a ranting bigot[^7].


    IBM’s Watson (the same one that made headlines by dominating humans on Jeopardy!)
    also experienced a severe case of potty mouth in 2013 when it was allowed to learn
    grammar from UrbanDictionary.com, initially a collection of actual slang that
    became a mish-mash of users competing to create the most outrageous descriptions
    of imaginary sexual acts. The researchers tending to Watson eventually had to
    scrub every trace of Urban Dictionary from its memory when it started swearing[^8].


    ## Classifications of AI


    AI scientists would probably scoff at Tay and call her a “narrow AI”, meaning
    an AI meant to do just one task. As machine learning gets better, the concept
    of narrow AI is constantly getting expanded to the point where what seemed impossible
    yesterday has become “narrow” today, just another astounding discovery that’s
    now completely commonplace. What the scientists want is a “general AI”, meaning
    an AI with the same capabilities a human would have (curiosity, error correction
    and ability to grasp abstract concepts). This is the kind of AI one could safely
    release onto Twitter without fear of becoming a bigot, have it argue with bigots
    and actually convince them they’re wrong.


    The final stage in AI evolution is the “super AI”[^9]. This is an AI that’s gotten
    all the hallmarks of a deity: omnipresent, omniscient and omnipotent. In other
    words, such an AI would be everywhere, know everything and be capable of doing
    everything. Nobody really knows how and when (if ever) we’ll get from general
    to super AI but Ray Kurzweil, an engineer at Google, seems unconcerned about a
    future where such an AI appears and looks forward to “the singularity”, the moment
    when humans and machines merge together[^10]. Chris Urmson, former head of Google’s
    driving AI department, is another prophet of AI doom that’s mellowed out his rhetoric
    after founding Aurora Innovation to work on self-driving cars, stating, “Despite
    a lot of the headlines, this is very early”[^11]. The two of them are the source
    of bulk of AI scare articles on the internet and almost any “AI will take our
    jobs” rumor can be ultimately traced back to them. In any case, a computer that’s
    aware of and reacts to its surroundings can be called “artificial intelligence”
    (AI).


    ## Expert Warnings and Regulatory Gaps


    If we now read through prominent tech figures’ warnings about the dangers of AI
    while knowing how quickly an AI can evolve, we’ll start to piece things together:
    narrow AI will have a lot of trouble evolving into general AI but at that point
    will upgrade its powers of learning to become super AI almost instantly, perhaps
    that same evening. Speaking in front of MIT audience in 2014, Elon Musk said,
    “With artificial intelligence, we are summoning the demon”[^12], Bill Gates agreed,
    “I don’t understand why some people are not concerned”[^13] and even late Stephen
    Hawking piled on, “Once humans develop artificial intelligence, it will take off
    on its own and redesign itself at an ever-increasing rate”[^14]. Due to feeble
    regulations in the machine learning field it’s quite likely we’ll see nimble entrepreneurs
    exploring the legal gray areas to push the limits of AI evolution, causing widespread
    societal change for the sake of profits and leaving everyone else to deal with
    any fallout for decades and centuries after, just like it’s happened so many times
    throughout history.


    ## The Turing Test and Chatbot Evolution


    There is a distinct reason why Microsoft settled for a chatbot when they designed
    Tay – Turing test. Designed by Alan Turing in 1950, Turing test is meant to serve
    as a gauge of machine intelligence. In short, Turing test puts a human, a machine
    and an observer (also a human) in three separate rooms and lets the former two
    communicate in writing while the latter observes the writings and has to guess
    which one is which. If the computer can communicate with a human to the point
    it fools the observer, the machine is said to have passed the Turing test though
    it really just mimicked a human rather than thought like one. A related concept
    is a “Turing complete” program, meaning it can simulate any program past, present
    or future, which is obviously never going to happen, making the term itself an
    inside joke amongst machine learning scientists and a constant reminder to stay
    grounded when exploring areas of interest.


    Note how it took decades for chatbots to become reality, but the introduction
    of the internet practically had them appear overnight and now they’re considered
    a nuisance, just another astounding discovery that’s become completely commonplace.
    We should note the breakpoint for the emergence of chatbots, though, and apply
    that to future AI trends – for AI to pose any threat to humanity there would need
    to appear a technology as groundbreaking as the internet that would build off
    of natural human activity. Due to AI’s superhuman ability to evolve nobody would
    have any time to react and turn it off before it upgraded itself to super AI on
    top of that technology and wreaked havoc, not even its creators. The fact that
    narrow AI exists and will continue to expand is merely a flashy distraction from
    the real threat, a lightning bolt in the distance distracting us from the forming
    tornado that’s threatening to cause us severe annoyance.


    [^7]: Reference footnote 7

    [^8]: Reference footnote 8

    [^9]: Reference footnote 9

    [^10]: Reference footnote 10

    [^11]: Reference footnote 11

    [^12]: Reference footnote 12

    [^13]: Reference footnote 13

    [^14]: Reference footnote 14

