    如果违规行为被发现，高层管理人员只会对此保持沉默并继续照常经营业务，这正是 Facebook 在剑桥分析公司丑闻曝光前所做的事情。事实上，2018 年 3
    月 Facebook 平台运营经理 Sandy Parakilas 接受采访时表示，在他任职期间（2011 年和 2012 年），数据泄露和未经授权的数据收集非常普遍[\[40\]](#part0000_split_025.html#_ftn40)。当他试图警告一位
    Facebook 高管时，对方回应道：“你真的想看看你会发现什么吗？” 言下之意是，如果公司不主动审计数据泄露，在法律上会更有保护，因为一旦审计就必须制止泄露，这会损害
    Facebook 的利润。这就是为什么马克·扎克伯格可以在国会听证会上花费数小时，面不改色地重复“我不知道”的变体——他真的不知道，因为层级链条下端的其他人才是真正做出那些可疑决策的人。


    值得庆幸的是，欧盟监管机构似乎开始从麻木中清醒过来，并察觉到大数据的花招。《通用数据保护条例》（GDPR）是一套适用于所有为欧盟公民提供服务的公司的 2016
    年法规，于 2018 年 5 月 25 日生效。这份长达 200 多页的法规[\[41\]](#part0000_split_025.html#_ftn41)
    将个人数据保护称为一项基本权利，并规定：“个人数据的处理应旨在服务于人类”。GDPR 禁止公司持有超出必要范围的个人数据，并要求在尽可能短的时间内持有数据，同时赋予用户“被遗忘权”，即能够要求从公司服务器中删除关于他们的所有信息。GDPR
    还禁止基于个人数据由机器进行的“自动化决策和画像”，例如某人申请信用卡时根据评分或画像被自动拒绝。违反 GDPR 的大数据公司面临的罚款绝非微不足道，最高可达
    2000 万欧元或其全球年营业额的 4%，以较高者为准。


    ## Chapter 15 – Shadow profiles（影子档案）


    与此同时，Facebook 将继续收集数据，甚至包括那些不关心 Facebook 甚至没有个人资料的人。我们在 Target 身上看到的完全相同的模式再次发生：Facebook
    收集那些在人们的联系人、消息和内容中被提及之人的私人数据碎片。这些人在毫无察觉的情况下被持续追踪，而他们自以为是匿名的。这被称为“影子档案”，其程度远超任何人的想象，赋予了
    Facebook 一种不可思议的能力，能几乎瞬间将新用户与毕生好友和同学匹配起来[\[42\]](#part0000_split_025.html#_ftn42)。


    影子档案于 2013 年意外曝光，当时用户可以下载一个文件，显示 Facebook 掌握的关于他们的所有数据。该文件还包含了用户所有朋友的数据，包括朋友们未公开分享给
    Facebook 的数据。同年，Facebook 又经历了一次尴尬事件：600 万个用户从未与平台分享过的电话号码泄露了。还记得我们讨论过的吗：大数据加上一点社会工程学就会导致大规模隐私泄露。2013
    年，马克·扎克伯格因影子档案问题接受众议院能源和商务委员会的质询，他声称自己不太清楚影子档案是什么，并用“我不知道”的变体躲避了所有问题[\[43\]](#part0000_split_025.html#_ftn43)。正如我们之前所见，高管们通过让事情自行发展而不参与其中获益良多。


    影子档案究竟是如何制作的？这归因于“元数据”，一个奇特而微妙的概念，所以让我们绕个道来解释一下。定义是“关于数据的数据”，但我们可以将其理解为事件中一切非个人的信息。例如，当我们与某人通电话时，通话内容是私人数据，但通话持续了多长时间就是元数据。虽然私人数据通常受到保护免受侵入，但元数据几乎不被考虑在内，这正是
    Facebook 等公司抓住的机会。他们意识到，拥有足够的元数据可以高度确定地揭示私人数据。这就像公司仅通过知道私人消息和对话的发送时间和地点，就能窥探其内容。回到本章开头重读
    Target 事件——私人数据和元数据相互揭示。


    现在让我们想象 Alice 和 Bob 通过 Facebook Messenger 聊天。如果是智能手机应用，为了安装它，他们俩已经允许该应用访问设备上几乎所有内容：联系人、文件、Wi-Fi
    和 GPS 信息、相机、麦克风、加速度计（显示设备倾斜速度的装置）等。仅凭应用拥有跨数百万人的任意一类元数据的访问权限，Facebook 就能以各种方式追踪人员。例如，知道
    Alice 和 Bob 白天接触到的 Wi-Fi 网络名称，让 Facebook 知道他们彼此有多近；追踪加速度计让 Facebook 知道 Alice 和
    Bob 是否喜欢慢跑，并将夜间手机静止的位置标记为他们的家；如果应用持续跟踪 Wi-Fi 信号强度，甚至可以知道手机是否在隔壁房间、门后等。这一切归根结底于撒下尽可能大的网，抓取绝对所有的元数据。


    处理 Alice 和 Bob 消息的弱人工智能会不断记录对话内容，假设他们提到了 Jack，他没有 Facebook 个人资料甚至不使用互联网。AI 扫描
    Alice 和 Bob 的联系人，发现指向“Jack Wilshere”的相同电话号码，断定是同一个人并开始围绕它构建档案。AI 将扫描照片中的人脸，并借助标记功能更容易地找到
    Jack，在对话中查找关键词并参考联系人以弄清关于他的一切，包括风流韵事和家庭关系。通过这种方式，Jack 因为认识他的人对数据不加防范而被追踪，而他自以为不在网络雷达上。官方对所有这些后台活动的解释是
    Facebook 的“你可能认识的人”功能。在 PC 端情况略有不同，因为人们可以使用不同的隐私工具，网站上的“点赞”按钮会在用户登录 Facebook 时追踪他们，甚至可能在登出时也追踪。


    Facebook 应用（包括 Instagram 和 WhatsApp）可能不仅在监听智能手机所有者，还在监听他们周围的所有人，这正如 2016 年南佛罗里达大学大众传播学教授
    Kelli Burns 所暗示的。她在智能手机旁讨论某些话题，后来发现针对这些确切话题的广告。其他用户自己尝试后得到了类似结果，例如将智能手机放在西班牙语广播旁，第二天收到西班牙语广告。Facebook
    于 2014 年引入此功能，作为快速识别用户周围发生的事情并帮助他们撰写动态的方式；例如，正在看冰球比赛的人可以开始输入“我在一场 h……”，AI 仅凭噪音就能自动完成
    Facebook 动态。Facebook 试图通过声明“我们从不存储原始音频”来平息争议，意思是 AI 进行了上下文处理，这又是 Facebook 声称没有人被监视的方式——因为不是由人类完成的。在牛回家之前，挖掘用户数据简直没有任何坏处。


    ## Chapter 16 – Windows 10

