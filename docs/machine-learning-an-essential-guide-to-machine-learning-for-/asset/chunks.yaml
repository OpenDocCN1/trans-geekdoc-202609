    # Pepper：医疗保健机器人


    Pepper 是一款可爱的、售价 3 万欧元、高及胸口的机器人，被吹捧为医疗保健的未来。由比利时公司 ZoraBots 开发，并在两家比利时医院作为接待员进行测试，Pepper
    会说 20 种语言（尽管她会俏皮地说：“一次只能说一种”），并能识别人类的年龄，将他们引导至正确的科室。此前，Pepper 曾现身于法国商场和日本商店，还曾与青少年一起入读日本一所高中[¹⁹]，帮助他们学习英语。她还能理解人们的情绪，并对他们的笑话发笑，让他们感觉好些。如果一切都失败了，Pepper
    胸前的平板电脑可用于提供更多信息。


    ## 其他安卓机型


    有些安卓机型太昂贵且娇气，不适合家用，例如本田的 Asimo，它能上下楼梯，仅被保留在展厅和技术会议上作为新奇玩具。Asimo 本意是用于危机区域（如福岛关闭反应堆阀门），以取代人类科学家，但它未能胜任，无法应对废墟，却能以
    5-6 英里/小时的速度奔跑并使用手语[²⁰]。其他机器人公司放弃了说话和微笑，选择动物形态来制造稳定的行走机器人，例如波士顿动力公司及其 Big Dog。


    ## Big Dog 与 SpotMini 的演变


    Big Dog 于 2008 年首次展示，酷似一只无头的四条腿狗，脚掌被短桩取代[²¹]。它能以 2-3 英里/小时的速度在雪地和冰面上上下坡行走，在滑倒或被推搡时能自行恢复平衡，且能背负货物完成所有这些动作，暗示它将用于战区运送物资。Big
    Dog 的设计历经多年演变，最终于 2018 年 2 月成为 SpotMini，头部被替换为带夹具的柔性机械臂，甚至能在科学家试图阻止的情况下开门[²²]。2018
    年 5 月，波士顿动力公司发布了一段视频，展示 SpotMini 穿过其仓库之一，走到室外，进入下一栋楼，上下一段楼梯，然后完全自主地一路返回[²³]。


    ## 机器人学中的共情与意识


    在波士顿动力公司的视频中，我们可以看到科学家们骚扰、阻挠和阻碍 Big Dog 和 SpotMini，尽管它们没有意识，却让我们为这些可怜的东西感到难过。我们会对其他生物产生共情，这是人类存在的重要组成部分，但似乎我们也能为表现出足够活力的机器人感到惋惜。如果这种虐待发生在真实动物身上，我们肯定想制止，但机器人有什么不同？是什么让我们拥有意识，而这些自主机器人却不适用？哲学家们试图解释意识的起源已有数千年，却从未找到实际答案，所以让我们把整个机器学习领域变得复杂一万倍，把意识也加进去吧。


    ## 法律隐含义：AI 与言论自由


    法律专家已经在讨论 AI 是否应享受《第一修正案》保护，拥有言论自由权。在 2016 年题为“Siri-ously? Free speech rights
    and artificial intelligence”（认真吗？Siri？言论自由权利与人工智能）的文章中，法学教授 Toni M. Massaro 和
    Helen Norton[²⁴] 指出，“宪法变革似乎不可避免”，《第一修正案》不要求说话者必须是人类，也不要求言论必须有意义，但这并不意味着汽车警报器拥有言论自由。换句话说，智能且有意识的说话者受到保护，但用于播放语音或声音的工具则不受保护，这意味着如果机器进化得足够先进，我们可能会发现自己在给机器提供《第一修正案》保护，甚至允许它们诽谤人类而无法追责。还记得我们提到的意识吗？这就像我们打开一个货运集装箱，里面装满了麻烦（开了一罐蠕虫），结果发现里面还有一个潘多拉魔盒，我们又把它打开了。


    ## 陪伴型安卓机器人


    安卓机器人似乎也正走向我们的卧室。对于许多因严重残疾或极度缺乏自信而无法与异性交谈的人来说，逼真的陪伴娃娃可能是唯一的床伴，尽管它们很奇怪，却能在无人能及时给予安慰时提供慰藉。结合
    Sophia 进行对话的能力以及 Pepper 解读情绪和提供医疗保健的能力，陪伴型安卓机器人也许有一天会成为养老院和护士的全面替代品。


    # 第 10 章——自动驾驶汽车


    不仅是典型的房屋地面，生活本身就是混乱、无序且不可预测的，迫使我们投入巨大努力仅能勉强维持秩序，AI 在应对这种局面时也不会比我们强到哪里去。在进入下一个话题——自动驾驶汽车时，请记住这一点。自动驾驶汽车正风靡一时，埃隆·马斯克的特斯拉是最著名的例子。我们或许应该花点时间解释这股热潮背后的细微差别。目前没有汽车能真正自动驾驶（除非我们算上谷歌汽车，据谷歌
    2018 年报告[²⁵]称，它们能完美自主行驶），而且无人驾驶汽车无论如何都是非法的，意味着车内必须有驾驶员，尽管他不必双手握方向盘。特斯拉官网展示的视频[²⁶]也表明了这一点，视频中驾驶员双手离开方向盘。


    ## “自动驾驶”的误称


    “自动驾驶”这个名称是一个宣传噱头，这些汽车要么作为穿梭巴士沿人工编程、精心规划的城市路线行驶，要么由一群技术人员乘坐车队在后紧随监督，一有麻烦立即介入。一旦这些车离开整齐的城市“游乐场”进入碎石路，其行为就会崩溃，骑乘起来不比普通雪橇强多少。特斯拉公司谨慎地将其自动驾驶功能称为“Autopilot”（自动辅助驾驶），这意味着他们清楚
    AI 的局限性，且必须有驾驶员在场并双手握方向盘，否则汽车会蜂鸣几次并滑行停车。


    ## 特斯拉 Autopilot 的工作原理


    特斯拉 Autopilot 通过不断扫描车道线并保持车辆在车道中央行驶，同时感知附近是否有其他车辆或行人并自动调整速度来工作。这在理论上听起来很棒，但当特斯拉
    Autopilot AI 出现漏洞时，生命就会逝去。2018 年 5 月，一辆特斯拉在瑞士提契诺撞上护栏并起火燃烧，导致驾驶员死亡[²⁷]。五天前，另一辆特斯拉在佛罗里达州劳德代尔堡撞上混凝土墙并起火，导致前排两名青少年死亡，后排一人受伤[²⁸]。特斯拉使用锂离子电池，在碰撞中受挤压或扭曲时倾向于剧烈爆炸，这加剧了事故后果。


    ## 挑战与责任


    虽然由人类驾驶员引起的车祸和死亡事故数不胜数，但我们习惯了应对粗心大意的驾驶员，例如起诉他们或吊销执照，但我们该如何应对在道路上行为异常的 AI？另一个问题是，如果自动驾驶
    AI 被编程为严格遵守交通法规，而周围没有任何人类驾驶员遵守法律，这会导致 AI 汽车成为混乱的根源。我们理所当然地期望获得一个强大且稳健的 AI 驾驶助手，帮助我们减少通勤中花费的时间和精力，但在可预见的未来，这似乎既不可能也不太可能实现。


    [¹⁹]: part0000_split_025.html#_ftn19

    [²⁰]: part0000_split_025.html#_ftn20

    [²¹]: part0000_split_025.html#_ftn21

    [²²]: part0000_split_025.html#_ftn22

    [²³]: part0000_split_025.html#_ftn23

    [²⁴]: part0000_split_025.html#_ftn24

    [²⁵]: part0000_split_025.html#_ftn25

    [²⁶]: part0000_split_025.html#_ftn26

    [²⁷]: part0000_split_025.html#_ftn27

    [²⁸]: part0000_split_025.html#_ftn28


