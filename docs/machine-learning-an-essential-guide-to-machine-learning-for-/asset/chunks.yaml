- raw: "The stated reason for all this data canvassing is that “we use the information\
    \ we have to improve our advertising and measurement systems so we can show you\
    \ relevant ads on and off our Services and measure the effectiveness and reach\
    \ of ads and services”. We can see here that Facebook is actually building a detailed\
    \ profile of a user to show him ads but the most revealing expression is found\
    \ in this paragraph, “We use the information we have to help verify accounts and\
    \ activity, and to promote safety and security on and off of our Services, such\
    \ as by investigating suspicious activity or violations of our terms or policies.\
    \ We work hard to protect your account using teams of engineers, automated systems,\
    \ and advanced technology such as encryption and machine learning.” There it is,\
    \ an admission Facebook is using machine learning though it’s mentioned in the\
    \ context of profile security.\n\nNot to be outdone by Target, Facebook also started\
    \ leveraging its enormous user base and their data to figure out how likely they\
    \ are to jump brands and try something new. An April 2018 Gizmodo article[\\[36\\\
    ]](#part0000_split_025.html#_ftn36) refers to a new service Facebook is starting\
    \ to offer to everyone who wants to advertise on their platform – loyalty prediction.\
    \ The idea is to have AI analyze consumer behavior until the platform can recognize\
    \ people who want to try something new, whether it’s a new PC, smartphone or candy\
    \ bar and aggressively target them with related ads. The backbone of the process\
    \ is machine learning algorithm known as FBLearner Flow[\\[37\\]](#part0000_split_025.html#_ftn37).\
    \ That blog post is replete with quotables, such as, “Many of the experiences\
    \ and interactions people have on Facebook today are made possible with AI” and,\
    \ “When you log in to Facebook, we use the power of machine learning to provide\
    \ you with unique, personalized experiences”. It’s a great read but best stay\
    \ within the top 2-3 paragraphs on that page to avoid the opaque programming lingo\
    \ beneath it. \n\nNow let’s revisit the Cambridge Analytica scandal and take a\
    \ moment to see it through the eyes of an aware consumer, someone who understands\
    \ the machine learning and data mining that’s happening on the backend. In a Motherboard\
    \ article[\\[38\\]](#part0000_split_025.html#_ftn38) published 28 January 2017,\
    \ we get to read the story of a psychology professor Michal Kosinski, who developed\
    \ a Facebook personality test in 2008 that measured a person in five ways: openness,\
    \ conscientiousness, extroversion, agreeableness and neuroticism, also known as\
    \ the OCEAN score. These five traits weren’t something new and the professor didn’t\
    \ invent the test but simply found a way to harvest and crunch publicly available\
    \ user data using machine learning.\n\nSoon enough millions of Facebook users\
    \ had gone through the test, giving the professor the largest set of psychological\
    \ data ever created. At every point in time the sharing of person’s data was willing\
    \ and explicit but we’ll see how quickly everything went out of control and that\
    \ there are no controls once private data is gathered. Because at that point Facebook\
    \ users’ likes were public, the professor and his trusty machine learning companions\
    \ could compare the likes and the OCEAN score of any given user, drawing conclusions\
    \ from those who did the personality test and using one to predict the other.\
    \ As users kept doing the personality test, the program became better and better\
    \ at predicting almost everything about a person, down to whether their parents\
    \ were divorced, using only likes. The trick was that users’ friends’ data was\
    \ public as well, so by sharing their own data people also shared the information\
    \ on likes of everyone in their contact list without them knowing or agreeing\
    \ to it.\n\nJust like we saw with Target’s data mining, after a certain point\
    \ it doesn’t matter if a single user shields his privacy if enough users have\
    \ had their privacy breached. This is exactly what happened here as well and professor\
    \ Kosinski soon wielded immense power: knowing 68 likes allowed him to correctly\
    \ guess the person’s skin color, sexual orientation and whether they were Republican\
    \ or Democrat with 85-95% accuracy. The professor theorized that knowing 300+\
    \ likes of any given person would give him the power to know that person better\
    \ than they know themselves. The process worked the other way too, for example\
    \ knowing how many contacts someone has is a reliable way to predict their extroversion\
    \ score.\n\nProfessor Kosinski would eventually get approached by a certain company,\
    \ Cambridge Analytica (unrelated to the Cambridge University he was working for,\
    \ the name was probably chosen to give it an air of authority), with an offer\
    \ to sell his research and data, which he apparently did. The only reason why\
    \ we know about any of this is that Facebook got caught and the news outlets drummed\
    \ it into the public consciousness due to political implications in the 2016 US\
    \ elections. As it turns out, Facebook has known all along there are data leaks\
    \ like the Cambridge Analytica one but never really planned on doing anything\
    \ about it and just hoped the storm blew over. Finally, let’s have these two charming\
    \ ladies from Codecademy recap the entire story[\\[39\\]](#part0000_split_025.html#_ftn39).\n\
    \n##   \n\nChapter 14 – Big Data\n\nNeither the Target nor Cambridge Analytica\
    \ psychological profiling would be possible without the massive cluster of user\
    \ information known as “Big Data”, which is when a company has so much data that\
    \ it becomes impossible to process, store and secure all of it. A Big Data company\
    \ has to desperately throw money at getting more engineers, hardware and storage\
    \ facilities just to try and manage it. At some point the company simply can’t\
    \ keep up and has to start leaking data, which is exactly what shady persons are\
    \ waiting for. The hacking portrayed in movies usually shows a hunched over figure\
    \ in a dimly lit room furiously typing on a keyboard for several minutes and then\
    \ excitedly shouting, “I’m in through their firewall!” but the reality is much\
    \ more incredible. 99% of all “hacking” is actually just social engineering, meaning\
    \ the hacker finds out the front desk worker at a company is named Cindy and a\
    \ top-level manager named Mark is on vacation in Aruba, maybe even through Facebook.\n\
    \nThe hacker calls the front desk and says, “Hey Cindy, it’s Mark from upper management,\
    \ I’m on a vacation here in Aruba and need to quickly log into my workstation\
    \ but I forgot my password. Can you help me out?” Cindy has these situations happen\
    \ to her all the time so she simply patches “Mark” to the tech department where\
    \ he repeats his spiel once more and gets all the access he could ever want. That’s\
    \ it, breaching a Big Data network is incredibly easy and thinking that anyone’s\
    \ data is safe, whether on Facebook, Twitter or any other social network, is quite\
    \ laughable. These companies are so big that it’s simply impossible to maintain\
    \ the safety of users’ data while their workers are underpaid and jaded to the\
    \ point where they just clock in and clock out. "
