    # 第 12 章 – 数据挖掘


    2017 年，亚马逊将 Alexa 的代码开源，允许任何人制作自己的 Alexa 版本并将其嵌入自家产品：LG 推出了搭载 Alexa 的冰箱，能推荐食谱；大众汽车在部分车型中让
    Alexa 成为仪表盘助手；美泰甚至想把它塞进玩具里。哪怕是最牵强的借口，也足以让 Alexa 植入各种随机产品，目的只有一个：全天候收割数据并分析消费者行为。这种前所未有的隐私入侵背后的终极原因，堪称超级反派的阴谋——就是为了投放完美的广告。


    广告有什么用？它们出现在我们的显示器、电视屏幕和智能手机显示屏上，塞进我们喜爱的广播节目和邮箱里。无论我们看向哪里，都能看到广告在兜售我们毫无兴趣的东西。这些广告代表了传统的“霰弹枪式”营销：公司只是尽可能多地向我们大致方向发射广告，祈祷至少有一发命中。正如我们所想，这种营销成本高昂，但公司别无他法，只能持续向古怪、离谱、尴尬的广告注资，指望总有管用的。得益于机器学习，我们可能正逼近一个未来：计算机能生产极其廉价的广告，这些广告根据我们的行为被可怕地精准定制，并在效果最强的精确时刻投放。事实上，我们可能已经身处这样一个未来之中。


    消费者行为的一个特点是，大多数购买是自动完成的，但重大生活事件能打破这些习惯，让我们处于尝试新事物的边缘。这意味着，费列罗（Fig Newtons）的广告不一定针对从未尝试过该产品的人，而是针对那些喜欢甜食、且因经历离婚、购车或怀孕等重大生活事件而可能尝试新事物的人。广告公司如何分辨谁是谁？数据挖掘登场了：尽可能多地收集人们的数据，让计算机尝试预测他们的行为、欲望和动机，从而在恰当的时机向他们投放恰到好处的广告。当然，广告对我们从不起作用，但机器能学会如何具有说服力，正如下面的故事所示。


    2012 年《纽约时报》一篇题为“公司如何窃取你的秘密”[\[35\]](#part0000_split_025.html#_ftn35)的文章详细描述了安德鲁·波尔（Andrew
    Pole）的经历。他是一名统计学家，2002 年受雇于塔吉特（Target），致力于通过聚合数据、甚至直接从第三方购买个人数据包，来发掘塔吉特顾客的秘密，包括他们开什么车、在网上讨论什么话题、偏好哪个牌子的苹果酱。是的，从用户那里收集的个人数据在市场上被买卖，其漏洞在于：如果分析客户数据的是机器，而阅读输出结果的人类看不到任何个人身份信息（如姓名或地址），就不算侵犯隐私。进入塔吉特的每位顾客都会被打上唯一编号，被追踪、记录和分析，以形成个性化的客户画像，进而通过优惠券、广告或优惠活动精准营销以刺激购买。


    在一次尝试中，安德鲁试图找出光顾塔吉特的哪些女性怀孕了，以便诱导她们购买婴儿相关产品。得益于那些在塔吉特登记婴儿派对、从而暴露自己怀孕身份的女性，安德鲁利用机器学习过程列出了
    25 种产品（如棉球和锌补充剂），这些产品能识别女性是否怀孕以及怀孕多久，从而让塔吉特在女性可能需要这些产品的确切时刻发送特别优惠。通过了解她们的婚姻状况、是网购还是周末逛店等诸多因素，塔吉特的计算机能爬取数据，估算出任何一位孕妇成为毛巾、尿布、无香润肤露或其他任何商品的常客的最高概率场景，并建议最佳广告形式。


    随后，安德鲁将同一逻辑应用于塔吉特所有的女性顾客，最终以高度确定性发现了哪些人怀孕了——即使她们未向任何人透露，甚至自己都不知情。这是一场随时可能爆发的隐私丑闻，正如后来
    Facebook 和剑桥分析（Cambridge Analytica）发生的那样，但塔吉特视其为招揽新顾客的绝佳途径。当撰写该文的《纽约时报》记者联系塔吉特置评时，对方简短回复：“我们开发了一系列研究工具，使我们能深入洞察不同客群细分市场的趋势和偏好”，实质上证实了文章的发现，随后将该记者列入黑名单。


    这种局面正是大型企业梦寐以求的：在道德灰色地带运作，在立法者睡大觉时创造性地规避隐私法以获取竞争优势。我们将看到完全相同的模式再次上演，但请先注意：无论某位女性如何保护隐私，只要其他女性把一切都暴露无遗，就危及了所有女性的隐私。这意味着存在一个特定的人口临界点，超过这个临界点后，单个个人做什么、是否被追踪都无关紧要，因为普遍行为趋势适用于所有人。如果我们想阻止数据挖掘，必须齐心协力，否则毫无效果。好吧，那我们避开塔吉特、沃尔玛或其他连锁店，全网购好了。数据挖掘者不会因此退缩，他们早已准备好一种特殊的“仓鼠轮”：社交网络。


    # 第 13 章 – 社交网络


    乍一看完全无害，社交网络似乎是与同龄人、朋友和远方家人保持联系的最佳方式。分享照片、发送消息、语音或视频聊天——全免费！哇，谁能不用社交网络？只有一个小问题——网站靠什么维持运营？托管网站要花钱，雇佣各类员工维护也要花钱。像
    Facebook 这样的社交网络从哪弄来这么多钱，为什么身价数十亿？如果产品或服务是免费的，用户的私人数据就是被收割并变现的商品。


    从 Reddit 到 Facebook，社交网络在数据挖掘方面堪称迄今最大胆的心理学实验。用户不仅自愿免费暴露最私密的思想和行为，还让第三方利用和出售私人数据大发横财。了解了本书讨论的内容，似乎不可思议竟会有数百万人报名参加、被标记、追踪和操控，但这正是正在发生的事。在大规模收割个人数据方面，Facebook
    无疑是最恶劣的违规者，但 Twitter 和 Instagram 也是有力竞争者。我们可以看看 Facebook 的服务条款（截至 2018 年 5 月现行版本），了解它们收集何种数据：


    *   访问频率和时长

    *   分享、查看或互动内容的频率和类型

    *   上传文件的数据，如时间戳或文件名

    *   他人提供的关于用户的数据，如你的电话号码

    *   用户与谁互动、互动多少以及互动什么内容

    *   信用卡信息，如账单和收货地址

    *   用于连接 Facebook 的所有设备的数据，如 Wi-Fi 名称、使用语言和电池电量

    *   拥有“赞”按钮的网站提供的数据，以查看用户访问了什么以及在那里做了什么

    *   来自第三方的数据，如广告商显示用户是否点击了广告

    *   Facebook 旗下其他公司收集的关于用户的数据


    '
