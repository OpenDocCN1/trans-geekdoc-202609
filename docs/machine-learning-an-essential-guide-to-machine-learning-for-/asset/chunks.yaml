    # Pepper: The Healthcare Robot


    Pepper is a cutesy €30,000 chest-high robot that is touted as the future of healthcare.
    Developed by Belgian firm ZoraBots and tested in two Belgian hospitals as a receptionist,
    Pepper can talk in 20 languages (though she will quip, “Only one at a time”) and
    recognize the age of the human to direct them to the correct department. Featuring
    prior to that in French malls and Japanese shops, Pepper also enrolled in a Japanese
    high school alongside teenagers[^19] to help them learn English. She can also
    understand emotions of people and laugh at their jokes to make them feel better.
    If all else fails, Pepper has a tablet on her chest that can be used for more
    information.


    ## Other Android Models


    Some android models are too expensive and finicky for home use, such as Honda’s
    Asimo that can walk up and down stairs, and are reserved for showrooms and tech
    conferences as a novelty toy. Meant to be used in crisis areas (such as Fukushima
    to close reactor valves) instead of human scientists, Asimo didn’t live up to
    the task and can’t handle going over rubble but can run at the speed of 5-6 mph
    and use sign language[^20]. Other robot companies eschewed talking and smiling,
    opting for animal forms to make a stable walking robot, such as Boston Dynamics
    and their Big Dog.


    ## Big Dog and SpotMini Evolution


    Showcased in 2008, Big Dog resembles a headless four-legged dog with stubs instead
    of paws[^21]. It can walk up and down hill through snow and ice at 2-3 mph, regaining
    balance on its own when it slips or when pushed, all of this while carrying packs
    on its back, implying it would be used for delivering supplies in combat zones.
    The Big Dog design would evolve throughout the years, ending up in February 2018
    as SpotMini with a clamp on a flexible arm instead of a head, capable of opening
    doors despite a scientist trying to stop it[^22]. In May 2018 Boston Dynamics
    released a video of their SpotMini going through one of their warehouses, outside,
    into the next building, up and down a flight of stairs and then all the way back
    on its own[^23].


    ## Empathy and Consciousness in Robotics


    Across Boston Dynamics videos we can see the scientists annoying, deterring and
    obstructing Big Dog and SpotMini, making us feel bad for the poor things, as mindless
    as they are. We empathize with other living beings and that’s an essential part
    of human existence, but it appears we’re also capable of feeling sorry for robots
    that show enough zest. We’d certainly want to stop that kind of abuse if it were
    to be done to a real animal, but what makes robots different? What makes us conscious
    that doesn’t apply to these autonomous robots? Philosophers have been trying to
    explain the origin of consciousness for thousands of years and never found an
    actual answer, so let’s just make the entire machine learning field ten thousand
    times more complicated by adding consciousness to the mix.


    ## Legal Implications: AI and Free Speech


    Legal experts are already discussing whether an AI should enjoy First Amendment
    protection and have the right to free speech. In a 2016 article titled “Siri-ously?
    Free speech rights and artificial intelligence” law professors Toni M. Massaro
    and Helen Norton[^24] note that “constitutional change seems inevitable” and that
    the First Amendment doesn’t require the speaker to be human or speak anything
    meaningful, but that doesn’t mean car alarms have the freedom of speech. In other
    words, intelligent and conscious speakers are protected but tools for playing
    back speech or sound aren’t, meaning that we might find ourselves giving First
    Amendment protection to machines if they evolve enough and even let them slander
    humans without recourse. Remember when we mentioned consciousness? This is like
    if we opened a freight container of worms and found a Pandora’s Box in there only
    to open that as well.


    ## Companion Androids


    It also seems androids are on their way to our bedrooms. For many people who have
    a crippling disability or devastating lack of confidence to talk to the fairer
    sex, lifelike companion dolls might be the only bedfellows, as strange as they
    are, giving them comfort when nobody else can. Combined with Sophia’s ability
    to hold a conversation and Pepper’s to read emotions and supply healthcare, companion
    androids might one day become a comprehensive replacement for nursing homes and
    nurses in general.


    # Chapter 10 – Self-driving Cars


    Not just a typical house floor, but life itself is messy, chaotic and unpredictable,
    having us invest tremendous effort just to keep things in barely functioning order
    and AI wouldn’t fare any better in dealing with it than we already do. Let’s keep
    that in mind as we go into our next topic – self-driving cars. Self-driving cars
    are all the rage, with Elon Musk’s Tesla being the most prominent example. We
    should probably take a moment to explain the nuances behind this fad. There are
    currently no cars that can drive themselves (unless we count Google cars that,
    according to a 2018 report by Google[^25], drive on their own flawlessly) and
    driverless cars are illegal anyways, meaning there has to a driver present, though
    he doesn’t have to have his hands on the wheel. Tesla’s own webpage showcases
    a video[^26] saying as much when a driver is shown with his hands off the wheel.


    ## The "Self-Driving" Misnomer


    The moniker “self-driving” is a publicity trick where cars either function as
    shuttles along manually programmed and carefully plotted city routes or are closely
    supervised by a throng of technicians riding in a caravan behind them that jump
    in at the first sign of trouble. As soon as one of those cars goes outside its
    neat urban playpen and onto gravel its behavior falls apart and it’s no more useful
    for riding than a common sled. The Tesla company is careful to call Tesla’s self-driving
    function “autopilot”, meaning they’re aware of the AI limitations and that there
    needs to be a driver present with both hands on the wheel or the car beeps a few
    times and comes to a rolling stop.


    ## How Tesla Autopilot Works


    A Tesla autopilot works by constantly scanning the road for lines and keeping
    the car between them while sensing if there’s other traffic or pedestrians nearby
    and automatically adjusting its speed. That sounds great on paper, but when there
    are bugs in a Tesla autopilot AI, lives will be lost. In May 2018 a Tesla smashed
    into a Ticino, Switzerland guardrail and burst into flames, killing its driver[^27].
    Another Tesla struck a concrete wall in Lauderdale, Florida five days earlier
    and also caught fire, killing two teens in the front seat and wounding the third
    in the back[^28]. The accidents weren’t helped by the fact Tesla uses lithium-ion
    batteries that have a tendency to violently explode when crushed or twisted, as
    in a crash.


    ## Challenges and Liability


    While there are plenty of car accidents and fatalities caused by human drivers,
    we’re used to dealing with careless drivers, for example by suing them or taking
    away their licenses, but what do we do with AI misbehaving on the road? Another
    problem is if autopilot AI is programmed to follow the letter of the traffic law
    to a T but no human driver around them obeys the law, making the AI car the cause
    of mayhem. We rightfully expect to get a powerful and robust AI driving assistant
    to help us cut down on time and energy spent during a commute but that doesn’t
    seem possible or likely in the near future.


    [^19]: part0000_split_025.html#_ftn19

    [^20]: part0000_split_025.html#_ftn20

    [^21]: part0000_split_025.html#_ftn21

    [^22]: part0000_split_025.html#_ftn22

    [^23]: part0000_split_025.html#_ftn23

    [^24]: part0000_split_025.html#_ftn24

    [^25]: part0000_split_025.html#_ftn25

    [^26]: part0000_split_025.html#_ftn26

    [^27]: part0000_split_025.html#_ftn27

    [^28]: part0000_split_025.html#_ftn28

