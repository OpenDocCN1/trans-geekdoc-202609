    # The very idea of surgery using sharp blades would look like caveman technology


    The very idea of surgery using sharp blades would look like caveman technology
    as the nanobots rush into the patient’s bloodstream and start scanning individual
    cells, comparing everything they find to the genetic blueprint they’d carry and
    restoring any damage. If any infection or parasites were found nanobots would
    literally disassemble and turn them into fuel for themselves or living tissue
    to repair the body. As long as nanobots are active, and by definition they would
    be able to replicate themselves indefinitely, the person would heal from any wound
    and become immune to any poison. This would actually be the closest we’d come
    to making humans that would have the same regenerative abilities as Wolverine
    or Deadpool. Are there any dangers in such nanobot use? Sure there are and once
    again science fiction writers are way ahead of us.


    Greg Bear’s 1985 award-winning short story “Blood Music”[\[49\]](#part0000_split_025.html#_ftn49)
    talks about a researcher who injects himself with medical nanobots he was working
    on in a desperate attempt to save his project when the superiors find out just
    how far along he is. These nanobots are capable of learning and soon organize
    into intelligent cell groups, each eventually becoming as smart as a human. The
    nanobots then reach general AI levels of intelligence, expanding within his body
    and fixing everything to their liking until they discover the blood-brain barrier.
    The parent company tries to intervene but it’s already too late and nanobots assume
    control. They have a different view on life and evolution but it’s best to leave
    the plot twist and ending unspoiled – let’s just say things grow out of hand very
    quickly.


    For now there’s not even a theory on how we’d be able to communicate with nanobots
    or tell them what we want them to do, which is a bit of a snag. Because nanobots
    would be equally capable of fixing and destroying everything we love we’d simply
    have to let them loose and cross our fingers for the best. If they turn into malicious
    goblins that chomp down everything, the entire world would be on the brink of
    irreversible collapse. Again, writers have come up with a catchy name for the
    scenario – “gray goo”.


    The gray goo scenario asks us to imagine nanobots that have the ability to replicate
    themselves but for whatever reason went haywire – instead of healing people or
    creating works of science they’re simply multiplying and processing everything
    around them into goo. Not very poetic but scarily realistic, though the author
    of the phrase, Eric Drexler, in his 1986 book “Engines of Creation”[\[50\]](#part0000_split_025.html#_ftn50),
    admits that this should have already happened with living organisms if they had
    infinite resources. Eric will later go on to say, “I regret coining the phrase”
    as it took the spotlight away from everything else he’s said.


    # Conclusion


    Throughout this book we’ve covered machine learning, AI, data mining, Big Data,
    nanobots and related concepts. Each of these topics is much more complex than
    the news outlets would let us believe and promises to become more intricate as
    time goes on and private companies push forward into legal gray areas. The sources
    presented herein show that AI panic spread by mainstream news sources is largely
    unfounded (though it does draw in clicks and sells news) and nobody can really
    tell if and when we’ll be in trouble due to AI. Companies that employ machine
    learning end up hiring more workers rather than less, pointing towards a future
    where we’ll all be more productive thanks to narrow AI. Also, it’s the rampant
    invasion of privacy underlying machine learning that’s the actual source of danger,
    such as data mining and Big Data, which are thankfully starting to be curbed in
    the EU. Drivers are also nowhere near losing their jobs to AI vehicles, as there
    will always be enough gravel and dirt roads to haul freight on.


    We need to be prepared for the emergence of machines, let alone intelligent and
    autonomous ones. Just like expecting parents baby-proof their home to make sure
    the young one can safely explore and mature without getting hurt or causing undue
    damage, the AI and androids have been coming for at least 50 years but we haven’t
    done anything to machine learning-proof our society and culture. There is no public
    discussion on the impact the machines have on human social structures, no safeguards
    for the protection of human private data (save the GDPR) and biometrics and no
    clear legal boundaries for AI rights and responsibilities, meaning anyone can
    do whatever they want, which private companies do all the time. Rest assured that
    Cambridge Analytica data leak is just the tip of the scandal iceberg and everything
    is back to being business as usual.


    It’s time for the general public to start a thorough, reasonable debate on what
    to do with machine learning, where we want to see it go and how we envision our
    lives in the future. We need to involve our loved ones in a discussion on gaming,
    internet or social media addiction and guide them through the troublesome waters
    of adulthood so we can all become that much wiser. Otherwise, machines might slowly
    overpower and replace our thinking capacities to become our unfeeling, uncaring
    masters rather than reliable servants and companions. The worst part is, we might
    grow to like such servitude.


    This book has tried to clarify some of the most common machine learning concepts
    and misconceptions to the point a layman reader can get involved in a debate and
    hold their ground with an expert. Nobody has all the right answers, not even the
    smartest scientists working on these machines, but we should all get involved
    and tackle the issue headfirst because there’s no running away from it. If this
    book has made the reader inspired and emboldened to discuss machine learning,
    then it’s done its job and hopefully turned out this hodge-podge of dry topics
    into an entertaining read.


    # Glossary


    **AI** – Independent program that can learn from the environment and adapt to
    it. So far only narrow AI exists, such as one found in a Roomba. Scientists aim
    for the general AI and fear the super AI.


    **Algorithm** – Set of instructions for a machine. Same input always produces
    the same result.


    **AlphaGO** – Google’s Go playing neural network. Handily defeated the world’s
    best human player in 2016 using Monte Carlo tree search.


    **Arthur Samuel** – MIT graduate that jumpstarted machine learning as a science.
    Created an intelligent checkers playing program that could learn by playing against
    itself.


    **Autopilot** – What “self-driving” cars actually do. Best described as automated
    shuttles.


    **Big Data** – Massive amount of private data that reveals behavior trends and
    is impossible to safeguard. May also include metadata. Exists on the cloud.


    **Big Dog** – Four legged robot that can walk on its own and regain balance. Owner
    company was later bought by Google.


    **Biometrics** – Measures of a person’s body, including height, shape of the face
    and fingerprints, used to identify them.


    **Brute force** – Problem solving that blindly goes through options one by one
    until a solution is found. Precursor to machine learning.


    **Cambridge Analytica** – Company that bought private Facebook data Michal Kosinski
    gathered through his Facebook personality test. Unrelated to Cambridge University.


    **Closed source** – Program code that’s obfuscated but still usable. Only the
    company that made it can view, edit and share it on its own terms. Opposite of
    open source.


    **Cloud** – A marketing term for someone else’s computer. Users usually have no
    right to their private data on the cloud.


    **Cortana** – Narrow AI exclusive to Windows 10. Uses all data present on the
    system.


    **Data mining** – Gathering private data from naïve users through obscure means,
    such as Facebook tracking logged in users across websites through Like buttons.


    **Deep Blue** – IBM’s chess playing computer program that defeated then-best human
    player, Gary Kasparov, in 1996. Worked by brute force.

