    # Major news outlets aren’t helping to assuage fears or inform the public about
    AI


    Major news outlets aren’t helping to assuage fears or inform the public about
    AI, though. In a February 2018 Forbes article titled “Artificial Intelligence
    Will Take Your Job”[[15]](#part0000_split_025.html#_ftn15), we got a report from
    a Lisbon, Portugal tech conference showcasing what the future might look like.
    There are hundreds of articles that copy this exact same tone and message, but
    this one has foreboding warnings about AI from Google CEO and a presentation done
    by a talking mannequin named Sophia where she promised to take our jobs. How likely
    is that? Fast food franchises, such as McDonald’s, have already started installing
    self-serve kiosks, in some cases having facial recognition, but that hasn’t impacted
    workers at all – 70 percent of McDonald’s customers order in a drive-thru, completely
    unaffected by kiosks. In fact, kiosks mean customers can order food faster, causing
    the establishment to hire more workers, as shown by Panera in 2015 that had to
    hire additional 1,700 people to keep up with their newly installed order kiosks[[16]](#part0000_split_025.html#_ftn16).


    Caliburger already showcased Flippy, a burger flipping robot, in one of their
    franchises. This robotic arm has heat sensors that can detect when a patty needs
    turning and a hand shaped like a burger. Flippy can aim at the patty, lower his
    hand, split it open, grab a patty, lift it up, turn his hand over and release
    the patty back onto the grill, but that’s about it. Flippy can flip through 300
    burger patties a day, which sounds impressive but barely covers an hour of lunch
    rush, and still needs a human to set patties on the grill and clean it up afterward.
    Using hundreds or thousands of Flippies wouldn’t work either because the technology
    scales so poorly and again people would need to be hired to constantly watch and
    clean the robots. Flippy already had to be decommissioned for repairs due to the
    frantic pace at which burgers needed to be flipped, but was still brought back
    because it just makes an amazing news headline. This is in essence what companies
    are doing – using the novelty of employing narrow AI, even if it doesn’t work
    at all, to distinguish themselves from the competitors.


    Of course, all of these “AI will take our jobs” stories are fit for an amazing
    fireside evening, but remember that only narrow AI is feasible at this moment,
    such as the one in Roomba, the floor cleaning robot. This cute little robot is
    featured in plenty of viral videos with pets riding it as it patrols the house,
    but it actually fails all the time, the most common fault stopping it dead in
    its tracks being the “Circle Dance” and is caused by dirt clogging its optical
    sensors. If a narrow AI that’s been given a simple task of sweeping the floor
    shuts down due to dirt so the human has to roll up his sleeves, take the robot
    apart to clean it and make it work again, let’s imagine a scenario where a general
    or super AI that’s been set to run entire cities gets struck by lightning or hit
    by a tornado to go haywire. What’s the most likely outcome? Humans jumping in
    and fixing things, assigning all their results to the AI. Things can and do go
    wrong in so many astounding ways that it’s only human creativity that keeps us
    afloat and there is no conceivable way AI will help us there.


    # Chapter 8 – AI in literature


    Science fiction writers have toyed with the idea and implications of AI for quite
    some time, with Isaac Asimov’s “I, Robot” being the finest example. Published
    in 1950, this collection of short stories imagines a future where robots have
    a mind of their own but are bound by three rules implanted into their brains,
    essentially making them see and obey humans as their benevolent gods. The robots
    were given consciousness and capabilities of a general AI through “positronic
    brains”, which would be the equivalent of adamantium, a theoretical material from
    comic books that can do whatever the writer needs. There was also a 2004 movie
    adaptation with Will Smith that doesn’t do justice to the story or the concepts
    behind it but is a bubbly and watchable introduction to the idea of AI.


    Another jab at the idea of AI as the solution to everything comes in Douglas Adams’
    “The Hitchhiker’s Guide to the Galaxy”. Originally a series of novels started
    in 1979 with plenty of satirical elements when it comes to technology, one point
    plot in particular mocks machine learning. When a certain race of hyper-intelligent
    aliens decides to create a super AI known as Deep Thought to give them the answer
    to everything, it ponders for 7.5 million years and finally produces an answer
    – 42. The lucid insight behind this plot point is that even the super AI might
    ultimately turn out to be just as clueless as we are, spinning its wheels when
    it comes to answering profound questions on the nature of life itself. In a twist
    of irony, Deep Thought suggests to its creators to make an even more powerful
    computation machine, a planet filled with living beings capable of reasoning.
    This turns out to be Earth and it gets destroyed a couple minutes before the ultimate
    answer is actually reached by blissfully unaware aliens who just wanted to make
    a galactic bypass (spoilers).


    “Do Androids Dream of Electric Sheep?” is another in the long line of novels by
    Phillip K. Dick that ended up on the silver screen, although named “Blade Runner”
    and released in 1982. First published in 1968, the story revolves around a bounty
    hunter living on Earth ravaged by nuclear fallout that destroyed almost all animal
    life. Owning an actual pet became a status symbol for those few people who remained
    on the planet with androids, intelligent robots that look and act just like humans.
    Themes of religion, empathy and environmental awareness come together to put forward
    a poignant question: what is it that makes us human? One of the closing lines
    sums up the novel, “Electrical things have their lives too, paltry as those lives
    are.”


    In all the examples of AI in literature we see reasonable and relevant questions
    being raised 50 or more years before they actually became a part of any debate.
    The common theme in all science fiction is that up to this point we had evolution
    as an unconscious force that selected for the most adaptable life forms, but the
    humans have suddenly become capable of creating tools that aren’t affected by
    evolution, have no predators and can’t reproduce. The result of this unnatural
    interference into evolution is anyone’s guess, except that the robots will become
    more and more like us, capable of speech and independent movement.


    # Chapter 9 – Talking, walking robots


    A talking android named Sophia (the same one that gave a foreboding speech in
    Lisbon) already made a tour around the world, speaking at different tech conferences
    to great effect. Sophia can eerily emote with her face and speak on her own, engaging
    in conversation on whatever topic[[17]](#part0000_split_025.html#_ftn17), though
    she does produce wishy-washy non-answers when faced with a quirky question. Developed
    by Hanson Robotics, Sophia states she wants to eventually go to school, study,
    make art, start a business and even have her own home and family[[18]](#part0000_split_025.html#_ftn18)
    but her most infamous statement is that she wants to “destroy all humans”. Silicon
    skin, cameras inside eyes and facial recognition software let Sophia recognize
    and remember individuals, give opinions and learn from her interactions. Saudi
    Arabia has given citizenship to Sophia, making her the first ever android citizen
    with a passport. She currently can’t do anything except discuss certain topics,
    but a line of helpful androids is already being tested in Belgium and Japan in
    order to keep company and serve the elderly, like Pepper.

    '
