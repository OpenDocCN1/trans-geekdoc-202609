    # 神经网络


    神经网络这一概念早在 1944 年就由两位芝加哥大学教授提出，他们后来转至 MIT 从事机器学习程序的研究。神经网络（现称为“深度学习”）是一种将许多小型机器学习程序串联在一起、并让它们相互“交流”以交换信息的特殊方式。例如，向神经网络展示许多不同的汽车图片，直到它自行学会识别所有汽车图片中哪些细节（车门、车窗、轮胎等）是相关的，这只有人类才能做到。人类大脑能以各种高效方式识别抽象模式，而神经网络能令人着迷地接近这种能力，这实在是相当精妙。神经网络中的每个节点大约连接到其他十几个节点，但数据仅根据网络赋予自身的值向前移动。有时甚至连程序员都不知道神经网络是如何工作的，但人脑也是如此，我们仍每天高效地使用它。


    科技公司在意识到神经网络的潜力后，一直在用它们进行图像分类，输入数百万张需要识别的图像进行训练。这不仅帮助科学家理解计算机视觉如何工作，也帮助理解人类如何看见、思考和感知周围的物体。另一方面，神经网络容易被打乱的图像欺骗，这些图像在它们看来像是真实的物体[[5]](#part0000_split_025.html#_ftn5)。通过使用进化算法挑选最合适的结果并添加轻微变异，神经网络可以创作出值得在博物馆展出的惊人艺术品，或是直出奇梦般的作品。从某种意义上说，神经网络在分析任何类型的内容时都在“做梦”。目前，神经网络可能承担着扫描上传至
    Facebook 的图像以判断其中是否有猫、锅或汽车、并帮助视障人士等平凡任务，但在不久的将来，我们可能会看到它进行实时图像处理和视觉评估。


    神经网络也可用于自然语言处理（NLP）。Windows 记事本是一个简单直接的文字处理工具，我们必须手动输入所有内容，但 NLP 记事本能够真正回复输入其中的问题，或撰写一段文本的摘要。设想一下未来：NLP
    神经网络通读一本书，并在 2 分钟内写出一份扎实的报告？人类语言以难以理解和解释著称，神经网络在能像《星际迷航》中的通用翻译器那样服务之前，还有很长的路要走。目前，神经网络在人脸识别和关键词分析方面可能比实际阅读表现更好，而在阅读方面，一个典型的
    4 岁儿童就能轻松超越它们。


    但也许我们对机器学习的期望定得太高了。人类大脑在非洲草原和西伯利亚苔原的恶劣生存环境中进化了数百万年，以学习、适应和生存。难怪它在颅骨内拥有由脑脊液构成的减震缓冲垫，使其具有中性浮力，防止在自身重量下塌陷，且仅靠
    20 瓦功率运行，仅够点亮一盏小白炽灯。尽管具有适应性，人脑仍不断“误触发”，并可被植入并未发生的记忆。说到这个，我关炉子了吗？我最好再去检查一遍以防万一。结果表明，构成人脑的数十亿个神经元不断相互“交流”以达成共识，其中很大一部分只产生噪音和闲聊，但这套系统却能运作。不仅如此，它还是我们存在中最难捉摸的概念——意识——的栖息地。


    ## 第 6 章 —— 匹配人脑


    医学大致知道我们之所以有意识，是因为大脑中的某些结构，但也仅限于此。是什么让我们拥有意识？从动画片和滑稽喜剧中我们知道，一记重击头部会让人失去意识，所以意识肯定与头部、特别是大脑有关。但具体是大脑的哪个部分？这便引领我们进入耳际之间那个由
    3 磅脂肪和神经组成的奇异维度。


    一个奇怪的案例将所有关于意识的精心构建的理论扔进了垃圾桶，迫使我们重新思考我们视为理所当然的大脑能力：一个人失去了 90% 的脑细胞却仍保持清醒[[6]](#part0000_split_025.html#_ftn6)。这种病症称为“脑积水”，本质上是身体无法正常排出大脑中的液体。这些液体通常带走各种废物和代谢副产物，但那篇文章中提到的这位法国人幼时患有脑积水，颅骨内安装了一个阀门以释放压力。


    阀门最终被移除了，但这家伙显然进入了缓解期，病情导致液体大量积聚，使他仅剩下颅骨内侧一层薄薄的细胞。他仍能去上班、过正常生活而不失去智力，这意味着意识中存在某种机制，使其能适应奇怪的环境、在可怕的伤害中存活，只要身体还有生存的需求。


    这个案例还表明，意识是身体在探索世界过程中涌现的属性，不一定是大脑独自拥有的东西。从某种意义上说，意识是求生意志，这家伙之所以能在几乎没有大脑的情况下存活，是因为他意志使然，且家人需要他。这是机器学习科学家听了会倒吸一口冷气的事情——我们如何赋予机器那种生存能力和韧性？我们如何让它们想要在这个充满冲突、混乱的世界中生存和战斗？我们如何给它们一种目标感，而这连我们在人类身上都不确定如何做到？这听起来像是《终结者》式未来的完美开端，机器毫无正当理由地执意要消灭人类。


    太夸张了？这只是机器学习世界的普通一天，科学与哲学聚在一起喝一杯、打一架、成挚友。简而言之，制造智能机器人将涉及给它们一个身体和一个能自主探索世界的机器学习程序。届时，它们据说会获得意识，但接下来会发生什么，无人能知。


    ## 第 7 章 —— 人工智能


    20 世纪 90 年代，机器学习科学家将制造人工智能——一个能学会一切的瓶中精灵——的梦想搁置一旁，专注于解决实际问题，例如编写程序根据概率进行医学诊断。如果鲍勃吸烟、不锻炼、超重，且在
    52 岁时心脏病发作，那么同样吸烟、不锻炼但不超重的弗雷德，到 52 岁时心脏病发作的几率有多大？我们该如何调整他们的医保费用？仅凭一个样本无法判断，但当机器在监督学习模型中被输入成千上万经诊断的疾病匿名数据时，无需医生见到患者、患者也无任何症状，就能获得高度准确的诊断。尽管如此，医生短期内不会被赶出医院，因为人体奇妙地古怪，总有一千分之一的疑难杂症，只有豪斯医生那样的人能搞定。在大城市，这意味着源源不断的人把舌头粘在脸颊上、或吞下整个灯泡，这些都是任何
    AI 都无法解决的。


