  trans: '

    进行如此大规模数据收集的既定理由是：“我们利用掌握的信息来改进我们的广告和衡量系统，以便在我们的服务内外向您展示相关广告，并衡量广告和服务的有效性及覆盖面”。我们可以看到，Facebook
    实际上正在建立详细的用户画像以投放广告，但最令人深省的表述见于这一段：“我们利用掌握的信息帮助验证账号和活动，并在我们的服务内外促进安全与保障，例如通过调查可疑活动或违反我们条款或政策的行为。我们由工程师团队、自动化系统以及加密和机器学习等先进技术组成的队伍，努力保护您的账号安全。”
    这里明确承认了 Facebook 正在使用机器学习，尽管是在账号安全的语境下提到的。


    Facebook 也不甘落后于 Target，也开始利用其庞大的用户群及其数据，推断用户跳槽品牌、尝试新事物的可能性。2018 年 4 月的一篇 Gizmodo
    文章[\[36\]](#part0000_split_025.html#_ftn36) 提到，Facebook 正开始向所有想在其平台投放广告的人提供一项新服务——忠诚度预测。其思路是让
    AI 分析消费者行为，直到平台能识别出想要尝试新事物的人群，无论是新电脑、智能手机还是糖果，然后积极向他们投放相关广告。这一流程的核心是名为 `FBLearner
    Flow` 的机器学习算法[\[37\]](#part0000_split_025.html#_ftn37)。那篇博客文章充满了引人注目的论述，例如：“人们今天在
    Facebook 上的许多体验和互动，都是借助 AI 实现的”以及，“当您登录 Facebook 时，我们利用机器学习的力量为您提供独特、个性化的体验”。这篇文章很值得一读，但最好只读前
    2-3 段，以免陷入其下方晦涩难懂的编程术语泥沼。


    现在让我们重温剑桥分析公司丑闻，并花一点时间从一个知情消费者的角度来审视它——一个了解后端正在发生的机器学习和数据挖掘的人。在一篇发表于 2017 年 1
    月 28 日的 Motherboard 文章[\[38\]](#part0000_split_025.html#_ftn38) 中，我们可以读到心理学教授
    Michal Kosinski 的故事，他在 2008 年开发了一种 Facebook 性格测试，从五个维度衡量一个人的特质：开放性、尽责性、外向性、宜人性和神经质，也称为
    OCEAN 得分。这五大特质并非新事物，教授也并未发明该测试，只是找到了一种利用机器学习收集和处理公开可用用户数据的方法。


    很快，数百万 Facebook 用户参与了测试，使教授拥有了有史以来最大的心理数据集。在每一个时间点，个人数据的分享都是自愿且明确的，但我们将看到一切是如何迅速失控的，以及一旦收集了私人数据，就不存在任何控制手段。因为当时
    Facebook 用户的“赞”是公开的，教授和他可靠的机器学习伙伴可以比较任何特定用户的“赞”和 OCEAN 得分，从参与性格测试的人群中得出结论，并用其中一个来预测另一个。随着用户持续进行性格测试，该程序仅凭“赞”就越来越擅长预测一个人的几乎所有信息，甚至包括其父母是否离婚。诀窍在于用户朋友的数据也是公开的，因此人们在分享自己数据的同时，也在不知情或未经同意的情况下，分享了其通讯录中所有人“赞”的信息。


    正如我们在 Target 的数据挖掘案例中所见，在某个节点之后，如果有足够多的用户隐私被泄露，单个用户是否保护隐私已不再重要。这正是这里发生的情况，教授 Kosinski
    很快掌握了巨大的力量：了解 68 个“赞”就能让他以 85%-95% 的准确率正确猜出一个人的肤色、性取向以及他们是共和党还是民主党支持者。教授推测，了解任何特定人物的
    300 多个“赞”，将赋予他比该人自我认知更深入了解该人的能力。该过程也可反向运作，例如，了解某人有多少联系人，是预测其外向性得分的可靠方法。


    教授 Kosinski 最终被一家特定公司——剑桥分析公司（与他任职的剑桥大学无关，该名称很可能是为了赋予其权威感而选用）——接洽，提出购买他的研究和数据，他显然同意了。我们之所以知道这一切，仅仅是因为
    Facebook 被抓住了，新闻媒体因 2016 年美国大选的政治影响将其推向公众视野。事实证明，Facebook 一直都知道存在像剑桥分析公司这样的数据泄露，但从未真正打算采取行动，只是希望风波平息。最后，让我们请
    Codecademy 的这两位迷人女士来复盘整个故事[\[39\]](#part0000_split_025.html#_ftn39)。


    ## 第 14 章 – 大数据


    如果没有被称为“大数据”的海量用户信息集群，Target 的案例和剑桥分析公司的心理画像都将无法实现。当一家公司拥有的数据量大到无法处理、存储和保护所有数据时，就是大数据。大数据公司不得不拼命投入资金招聘更多工程师、采购硬件和存储设施，仅仅是为了尝试管理这些数据。在某个节点，公司根本无法跟上，只能开始泄露数据，这正是不法分子伺机而动的时刻。电影中描绘的黑客攻击通常显示一个驼背的身影在昏暗的房间里疯狂敲击键盘几分钟，然后兴奋地大喊：“我突破他们的防火墙了！”但现实要不可思议得多。99%
    的所有“黑客攻击”实际上只是社会工程学，即黑客发现某公司前台叫 Cindy，高层经理 Mark 正在阿鲁巴度假，甚至可能通过 Facebook 发现这些信息。


    黑客给前台打电话说：“嘿 Cindy，我是上层管理的 Mark，我在阿鲁巴度假，需要快速登录我的工作站，但忘了密码。你能帮我一下吗？”Cindy 经常遇到这种情况，所以她直接把“Mark”转接给技术部门，他在那里重复一遍说辞，就能获得他想要的所有权限。就是这样，攻破大数据网络简直易如反掌，认为任何人的数据在
    Facebook、Twitter 或任何其他社交网络上是安全的，简直是天方夜谭。这些公司大到根本无法在员工薪资微薄、心灰意冷、只知打卡上下班的情况下，维护用户数据的安全。

