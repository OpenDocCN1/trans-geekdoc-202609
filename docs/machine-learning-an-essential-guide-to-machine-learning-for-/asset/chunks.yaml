    # Windows 10 Telemetry and Data Mining


    We’ve seen how Target and Facebook gather data on everyone, so as long as we steer
    clear of discount stores and social networks our private and metadata should be
    safe, right? Not even close, because it’s when all the other companies start jumping
    into action that we get a complete stranglehold on our privacy. When one of the
    biggest software companies, Microsoft, starts intrusively gathering private data
    through Windows we’re about to experience a sea change, a total onslaught of paid
    products and services that we can’t do without and yet they’ll be harvesting our
    private data 24/7. In this case the source of controversy is telemetry.


    ## What is Telemetry?


    Telemetry is a subset of metadata and represents usage of some program or device,
    for example, how many times any given user has started a certain program or opened
    the same file on a device. Every time a program or app we’re using crashes and
    we have the option to send a crash report to the developers, we’re actually sending
    telemetry to help them figure out what happened. That’s a legitimate way to use
    telemetry but note how this means there’s an actual cause (crash), the user is
    notified and has to perform an action to send data, after which telemetry gathering
    stops.


    Telemetry collection doesn’t necessarily sound bad, but when it’s done on a massive
    scale the private data of everyone gets endangered, even of those who don’t use
    the product or service, just like we saw happening with Facebook and Target. For
    example, knowing the average time for the user to double-click an icon or change
    a setting on `Windows 10` can show past, present or future disabilities; voice
    analysis of users can indicate anxiety, stress or psychological problems that
    the users don’t even know about. Those are only two data points, but if a person
    is using `Windows 10` on a daily basis it gets to know everything.


    ## Windows 10: The "Last" Operating System


    `Windows 10` is the last operating system Microsoft will ever produce, based on
    `Windows 8` design and kept evergreen through constant, mandatory updates. `Windows
    10` was initially given out for free to everyone during a 1-year period when it
    was released in 2015, which should be enough of a hint that there was some kind
    of a data mining ploy there. Right now `Windows 10` sells for $119 for Home edition,
    which is the most basic version meant for the least knowledgeable user, and gathers
    massive swaths of data aimed at profiling and serving ads. So, `Windows 10` comes
    with a price tag, displays ads and also data mines its users, giving Microsoft
    a triple source of income through one product and one user.


    ## Advertising Integration


    `Windows 10` includes personalized ads on the desktop, within the Start Menu and
    in the `Edge` browser. Even if the user bought one of the heftier versions they’re
    still going to see ads, including a screensaver ad when the computer is idling
    thanks to the feature known as `Windows Spotlight` that downloads them from `Bing`.
    This feature can be turned off, though a curious user can also click the top right
    corner and “like” or “dislike” to teach the AI on what to show next time. Ads
    will pop up from the taskbar too and may appear in the Action Center (known as
    Control Panel in previous Windows versions). A special program known as “Get Office”
    comes with `Windows 10` and regularly displays an ad for `Microsoft Office`. These
    features can be disabled though some users reported they might get automatically
    re-enabled after an update.


    ## Windows Store Restrictions


    All programs on `Windows 10` are purchased through the `Windows Store` and are
    heavily protected from user interference. This generally means little in the way
    of customization: no mouse macros, overlays or modding. If there’s anything wrong
    with a program on other versions of Windows there’s usually a workaround, but
    with `Windows 10` there are none. Also, the official Microsoft policy for `Windows
    Store` purchase is “all purchases are final and non-refundable”[[44]](#part0000_split_025.html#_ftn44).


    ## Comprehensive Data Collection


    `Windows 10` gathers all telemetry on all hardware and all software on and connected
    to the computer, including networks and Wi-Fi names. Personal data on users is
    purchased from data brokers, shared with and gotten from partner companies, taken
    from user’s public social media posts and publicly available sources, such as
    government databases. This data includes user’s interests and favorites, content
    consumption, voice data (“may include background sounds”), text and image data,
    contacts and relationships, social (“likes, dislikes, events”), location data
    and other inputs, such as skeletal wireframe when using `Xbox`’s `Kinect`.


    ## Cortana: The Virtual Assistant


    We’re just getting warmed up because the kicker is in `Windows 10` virtual assistant,
    `Cortana`. Named after an assistant from “Halo” video game series, `Cortana` was
    supposed to be the killer feature that will draw users in, something like `Xbox`’s
    `Kinect`.


    `Cortana` is a narrow AI focused on speech recognition and user intent understanding,
    warranting a special section in terms of service. The idea behind `Cortana` is
    that the user can use his voice to search the web, open files, add calendar dates
    and so on, with her getting smarter with repeated use. To achieve that, she studies
    relationships by analyzing “call, text message, and email history”, keeps track
    of people the user contacts with, gives suggestions on dates and tasks, taps into
    `Edge` history to learn about the user, and shares data with and gets it from
    third-party services, such as `Office 365`, `LinkedIn` and `Uber`. Things `Cortana`
    learns about the user are stored in the Notebook, where the user can access and
    manually edit if something’s incorrect, which is a part of her supervised learning.


    ## Privacy Policy Transparency


    All of this data mining is admitted to right there in the Microsoft Privacy Statement,
    under a dozen “Learn More” buttons that hide reams of bullet points[[45]](#part0000_split_025.html#_ftn45).
    To be clear, `Windows 10` is a great productivity tool, Facebook is a way to stay
    in touch with distant friends and relatives, while Target has everything in one
    place; the problem is in their unabated, covert collection of private data that
    comes as an all-or-nothing proposal. These companies have no guiding principle
    on collection of private data except what makes the most profit, they usually
    don’t care what happens with data once they’ve had their way with it and often
    share, sell or leave it neglected for anyone to social engineer their access to.
    Telemetry gathering was done before but there was never such a blatant and thorough
    example as with `Windows 10`. Worst of all, users are paying for it and feel like
    they got a great deal.


    # Chapter 17 – Biometrics


    It’s all good if the harvested private data revolves around messages, contacts
    and filenames; what happens when a company starts gathering truly personal data,
    such as DNA, and those get stolen? Now we enter the world of biometrics, private
    information such as the person’s fingerprints, tone of voice and shape of the
    face used to positively identify them. Fingerprints have been used for centuries
    to track down criminals, but they’re not conclusive by any means and there’s always
    a margin for error, despite what we see on CSI. Comparing two fingerprints means
    choosing an arbitrary number of reference points on both and seeing if they match;
    if enough do then the forensics expert doing the comparison is fairly certain
    it’s the same person. However, identical twins may have identical fingerprints
    and if we ever achieve stable cloning, clones will presumably have identical fingerprints
    too. Legislation is so hilariously behind the present that it’s not even considering
    cloning, so it’s up to us to protect our biometric data as much as possible.

    '
