    # AI 的演进：从弱人工智能到超级智能


    ## 互联网作为催化剂


    正是互联网作为全球数据高速公路的到来，再次改变了一切，让 AI 的前景显得触手可及。无论科学家们如何尝试向程序喂入数据，没有什么能比得上拥有数百万用户的全球搜索引擎
    —— 只需让机器接入源源不断的数据点并让其学习即可。这对普通大众也有一些好处，因为搜索引擎需要尽可能多地了解个别用户，以提供定制化的结果。换句话说，Google
    想知道哪些用户喜欢音乐（rock），哪些喜欢泥土（rock），以便当他们搜索 "rock" 时，向每个群体呈现最相关的结果；额外的好处是，机器窥视并处理个人用户数据在技术上不算侵犯隐私。这一机制要求采用纯在线存储，其巧妙的营销术语是“云端”。一旦用户习惯了将私人数据放在云端（即别人的电脑上，他们无权查看或编辑），机器学习向
    AI 构建的转型便可真正开始。


    ## 机器学习的不透明性


    请注意，没有人真正知道搜索引擎如何工作，甚至不知道它们涉及机器学习，这有多么关键。这是因为，与提供所有文件供用户执行、摆弄和修改的静态编程软件不同，机器学习模型必须隔离脆弱的程序，甚至隐藏其正在学习的事实，否则用户可能会试图搞破坏，导致结果失真。一个被扔进舆论法庭的
    AI 毫无胜算，微软的 Tay 便是明证，这是一个用户可于 2016 年 3 月通过 Twitter 与之互动的聊天机器人。Tay 被编程为学习社交线索并根据与真实用户的
    Twitter 互动来回应话题，但铺天盖地的仇恨和种族主义评论迅速将她变成了一个咆哮的偏执狂[⁷]。


    IBM 的 Watson（就是那个在《危险边缘》节目中击败人类而登上头条的）在 2013 年也经历了严重的“脏话缠身”，当时它被允许从 UrbanDictionary.com
    学习语法，该网站最初是真实俚语的集合，后来变成了用户竞相创造最离谱的虚构性行为描述的大杂烩。照看 Watson 的研究人员最终不得不从其记忆中清除 Urban
    Dictionary 的所有痕迹，因为它开始骂脏话[⁸]。


    ## AI 的分类


    AI 科学家可能会对 Tay 嗤之以鼻，称其为“弱人工智能”，意指只能完成单一任务的 AI。随着机器学习的进步，弱人工智能的概念在不断扩展，以至于昨天看似不可能的事情今天已变成“弱”人工智能，只是另一个如今已司空见惯的惊人发现。科学家们追求的是“通用人工智能”，意指拥有人类同等能力的
    AI（好奇心、纠错能力和理解抽象概念的能力）。这是那种可以放心发布到 Twitter 上而不必担心变成偏执狂、能与偏执狂辩论并真正说服他们认错的 AI。


    AI 演进的最终阶段是“超级人工智能”[⁹]。这是一个拥有神祇所有标志的 AI：无所不在、全知全能。换句话说，这种 AI 将无处不在、知晓一切、并能做任何事。没人真正知道如何以及何时（甚至是否）能从通用
    AI 走向超级 AI，但 Google 工程师 Ray Kurzweil 似乎对出现这种 AI 的未来毫不担忧，并期待着“奇点”时刻，即人类与机器融合的时刻[¹⁰]。Google
    无人驾驶 AI 部门前负责人 Chris Urmson 是另一位 AI 末日论先知，他在创立 Aurora Innovation 从事自动驾驶汽车研发后软化了言辞，称“尽管标题党很多，但这还处于非常早期”[¹¹]。他们俩是网上绝大多数
    AI 恐慌文章的源头，几乎任何“AI 将夺走我们的工作”谣言最终都能追溯到他们。无论如何，一台能感知并对周围环境做出反应的计算机就可以称为“人工智能”（AI）。


    ## 专家警告与监管真空


    如果我们现在了解 AI 进化有多快，再回读科技界名人的警告，就会开始拼凑出全貌：弱人工智能将难以进化为通用人工智能，但一旦达到该点，其学习能力将升级，几乎瞬间（也许就在那个晚上）成为超级人工智能。2014
    年在 MIT 听众面前，Elon Musk 说：“有了人工智能，我们就是在召唤恶魔”[¹²]，Bill Gates 附和道：“我不明白为什么有些人不担心”[¹³]，甚至已故的
    Stephen Hawking 也加入战团：“一旦人类开发出人工智能，它将自行起飞，并以不断加快的速度重新设计自己”[¹⁴]。由于机器学习领域监管薄弱，我们极有可能看到灵活的企业家探索法律灰色地带，推动
    AI 进化的极限，为利润引发广泛的社会变革，而将后果留给其他人在未来几十年甚至几个世纪中应对，正如历史上无数次发生的那样。


    ## 图灵测试与聊天机器人的演进


    Microsoft 在设计 Tay 时选择聊天机器人有其独特原因 —— 图灵测试。由 Alan Turing 于 1950 年设计，图灵测试旨在作为衡量机器智能的标准。简而言之，图灵测试将一个人类、一台机器和一个观察者（也是人类）置于三个单独的房间，让前两者通过书面交流，而观察者观察文字并猜测哪个是哪个。如果计算机能与人类交流到欺骗观察者的程度，则被认为通过了图灵测试，尽管它其实只是模仿人类而非像人类那样思考。一个相关概念是“图灵完备”程序，意指它可以模拟过去、现在或未来的任何程序，这显然永远不会发生，使该术语本身成为机器学习科学家间的内部梗，时刻提醒他们在探索感兴趣领域时保持脚踏实地。


    请注意，聊天机器人花了数十年才成为现实，但互联网的引入几乎让它们一夜之间出现，现在它们被视为一种骚扰，只是另一个已变得完全司空见惯的惊人发现。不过我们应该注意聊天机器人出现的临界点，并将其应用于未来的
    AI 趋势 —— 要让 AI 对人类构成任何威胁，需要出现一种像互联网一样具有开创性的技术，建立在自然的人类活动之上。加上 AI 超乎寻常的进化能力，没人会有时间反应并将其关闭，在它利用那项技术将自己升级为超级
    AI 并大肆破坏之前，甚至连它的创造者也来不及。弱人工智能的存在及其持续扩展，仅仅是转移视线的花哨干扰，是远处的一道闪电，分散了我们对正在形成、威胁要给我们带来严重麻烦的龙卷风的注意力。


    [⁷]: 参考脚注 7

    [⁸]: 参考脚注 8

    [⁹]: 参考脚注 9

    [¹⁰]: 参考脚注 10

    [¹¹]: 参考脚注 11

    [¹²]: 参考脚注 12

    [¹³]: 参考脚注 13

    [¹⁴]: 参考脚注 14


