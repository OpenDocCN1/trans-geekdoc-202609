- raw: "Machine learning is an iterative science thanks to the capability of any given\
    \ computer to run through a program thousands of times in a single day, slightly\
    \ changing with each new pass until the result is measurably better. If that sounds\
    \ like the evolution of living things, it’s because that’s exactly what it is.\
    \ In theory, a program that’s taught how to self-learn and is then left on its\
    \ own will become exponentially smarter, quickly surpassing animal and human intelligence.\
    \ It’s at this point that we find ourselves falling down the rabbit hole: do we\
    \ have the right to edit or kill such a program? Does it have human rights and\
    \ free will or is it bound to the will of its creator? Can it feel pain? Would\
    \ it try to usurp our place? Will it become conscious?\n\n## Chapter 2 – What’s\
    \ the point of machine learning?\n\nIt’s a typically human thing to try something\
    \ new and get hurt in all sorts of hilarious ways, like touching a hot stove.\
    \ We do these things because we’re ultimately driven by curiosity: the unyielding\
    \ need to know, feel and experience. We want to know what will happen when we\
    \ touch the hot stove and the pain we felt made us pull our hand back, teaching\
    \ us something about how the world works. The minor burn will eventually fade\
    \ away but the experience will stay, just like in a video game. In the meantime\
    \ you’d better get some ointment.\n\nThanks to our body and the way it provides\
    \ feedback, our brain will experience a constantly changing environment that will\
    \ have it adapt and learn new skills, such as cooking, skiing and confidently\
    \ walking a dog, driven by that same curiosity that made us touch a hot stove.\
    \ Later on we might even connect the dots and figure out that the sun, a candle\
    \ and a torch sear just the same merely based on us having touched a hot stove.\
    \ These abilities of curiosity, error correction and understanding abstract concepts\
    \ seem to be rooted in the biology of all living things and is what brought our\
    \ civilization to this stage. But could a computer be made to learn the same abilities?\n\
    \nTrying to answer this simple question is what’s been powering programmers and\
    \ scientists for several decades to come up with better smartphones, sturdier\
    \ cameras and lighter drones. No matter where we are, these three devices are\
    \ all around us in some form: a personal assistant we can carry in the pocket,\
    \ a powerful recording device that sits in the palm of the hand and a programmable\
    \ machine that does work on its own but can also be controlled remotely. Bit by\
    \ bit, we gave our stupid machines the ability to think, see and move, taking\
    \ care of the most mundane tasks we do. But now they’re also starting to get smarter.\n\
    \n## Chapter 3 – A world with no updates\n\nAs many proud Windows 10 users can\
    \ confirm, we live in a world of constant, life-changing updates. Our software\
    \ is now “evergreen” – always downloading, installing and refreshing itself behind\
    \ the scenes. Once an operating system goes evergreen, programs working on it\
    \ must follow to avoid compatibility issues, so now our Chrome and Firefox also\
    \ start wasting our time, bandwidth and disk space by constantly updating. Nothing\
