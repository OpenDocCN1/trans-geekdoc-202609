- raw: "In 2017, Amazon made Alexa’s code open source, allowing anyone to make their\
    \ own version of Alexa and bake it into their product: LG made a fridge with Alexa\
    \ that can spout recipes, Volkswagen made Alexa a dashboard assistant in some\
    \ models and Mattel wants to put it in toys. Even the flimsiest excuse is enough\
    \ to put Alexa in all sorts of random products, all so it can harvest data 24/7\
    \ and analyze consumer behavior. The ultimate reason for this unprecedented invasion\
    \ of our privacy is worthy of a supervillain plot – it’s about making the perfect\
    \ ad.\n\n##   \n\nChapter 12 – Data mining\n\nWhat’s the point of ads? They’re\
    \ on our monitors, TV screens and smartphone displays, inside our favorite radio\
    \ broadcasts and mailboxes. No matter where we turn, we’ll find ads constantly\
    \ hawking something we’re not interested in. Those ads represent the traditional\
    \ shotgun approach where companies simply propel as many as they can in our general\
    \ direction and hope at least one hits. As we can imagine, this kind of marketing\
    \ costs a lot but companies just don’t know any better and keep pumping money\
    \ into wacky, bizarre and embarrassing ads, hoping anything works. Thanks to machine\
    \ learning we might be nearing a future where computers produce dirt cheap ads\
    \ that are scarily tailored to our behavior and applied at the exact moment when\
    \ they’ll have the strongest effect. In fact, we might already be living in one\
    \ such future.\n\nOne thing about consumer behavior is that most purchases are\
    \ done automatically, but there are major life events that can break these habits\
    \ and put us on the cusp of trying new things. This means Fig Newtons ads aren’t\
    \ necessarily aimed at people who’d never try Fig Newtons but at those who like\
    \ sweets and might try something different because they’re undergoing a major\
    \ life event, such as divorce, car purchase or pregnancy. How does the advertising\
    \ company know which person is which? Enter data mining, harvesting as much data\
    \ about people to have computers try and predict their behavior, desires and motivations\
    \ to target them with just the right kind of ad at just the right moment. Of course,\
    \ ads would never work on us but machines can learn to be persuasive, as illustrated\
    \ by the following story.\n\nA 2012 New York Times article titled “How Companies\
    \ Learn Your Secrets”[\\[35\\]](#part0000_split_025.html#_ftn35) details how Andrew\
    \ Pole, a statistician employed at Target in 2002, worked on discovering the secrets\
    \ of Target customers by aggregating and in some cases outright purchasing packages\
    \ of personal data from third parties, including what cars they drive, what topics\
    \ they discuss online and preferred applesauce brands. Yes, personal data collected\
    \ from users is bought and sold on the market, with the loophole being that there’s\
    \ no invasion of privacy if a machine is analyzing customer data and humans reading\
    \ the outputs don’t get to see any personally identifiable bits, such as names\
    \ or addresses. Any customer entering Target is tagged with a unique number, tracked,\
    \ recorded and analyzed to reach a personalized customer profile that can be targeted\
    \ with coupons, ads or offers to incentivize purchases. \n\nIn one instance Andrew\
    \ tried to discover which of the women visiting Target were pregnant to hook them\
    \ into buying baby-related products. Thanks to women who outed themselves as pregnant\
    \ by registering for baby showers at Target, Andrew used the machine learning\
    \ process to arrive at a list of 25 products, such as cotton balls and zinc supplements,\
    \ that identified whether a woman was pregnant and how far along she was, allowing\
    \ Target to send her special offers at the exact times when the woman might need\
    \ them. By knowing their marital status, whether they shop online or on weekends\
    \ and many other factors, Target’s computers could crawl through the data and\
    \ estimate a scenario with the highest likelihood any given pregnant woman will\
    \ become a regular shopper for towels, diapers, unscented lotion or whatever else\
    \ and suggest the best kind of ad.\n\nAndrew then applied the same logic to all\
    \ of Target’s female customers and eventually discovered, with a high degree of\
    \ certainty, which of them were pregnant even if they didn’t reveal that to anyone\
    \ or if they were unaware of being pregnant. This was a privacy scandal waiting\
    \ to explode, just like what happened with Facebook and Cambridge Analytica, but\
    \ Target saw it as a great way to recruit new shoppers. When the New York Times\
    \ reporter who wrote the article contacted Target for comment they tersely replied\
    \ with, “We’ve developed a number of research tools that allow us to gain insights\
    \ into trends and preferences within different demographic segments of our guest\
    \ population,” essentially confirming the article’s findings and then blackballed\
    \ the reporter.\n\nThis kind of situation is just how a major corporation would\
    \ want it to play out: operating in moral gray areas and creatively skirting around\
    \ privacy laws to gain a competitive edge while the legislators are asleep at\
    \ the wheel. We’ll see this exact same pattern play out again but for now note\
    \ how it didn’t matter if a woman protected her privacy because all the other\
    \ women that revealed everything about themselves endangered the privacy of every\
    \ other woman. This means there is a certain breakpoint of population after which\
    \ it doesn’t matter what a single person does and if they’re tracked or not because\
    \ the general behavior trends apply to everyone. If we want to stop data mining,\
    \ we need to do it all together or it won’t have any effect at all. Fine, so we’ll\
    \ avoid Target, Walmart or any other store chain and do all our shopping online.\
    \ The data miners won’t be deterred by that and have prepared a special kind of\
    \ hamster wheel: social networks.\n\n##   \n\nChapter 13 – Social networks\n\n\
    At first glance completely innocuous, social networks seem like the best way to\
    \ keep in touch with our peers, friends and distant family. Share pictures, send\
    \ messages, do a voice or video chat – all of it for free! Wow, how could anyone\
    \ not use social networks? Except there’s one tiny question – how does the website\
    \ pay for all that? Hosting a website costs money, as does hiring all sorts of\
    \ staff to maintain it. Where does a social network like Facebook get all this\
    \ money and why is it worth billions? If a product or service is free, the user’s\
    \ private data is what’s being harvested and sold for profit.\n\nRanging from\
    \ Reddit to Facebook, social networks are by far the most daring psychological\
    \ experiment when it comes to data mining. Not only are users revealing their\
    \ most intimate thoughts and actions but they’re doing it willingly for free,\
    \ allowing some third party to get rich using and selling private data. Knowing\
    \ what we’ve discussed in this book it seems preposterous anyone would actually\
    \ sign up to be tagged, tracked and manipulated, but that’s exactly what people\
    \ are doing by the millions. Facebook is by far the most egregious offender when\
    \ it comes to harvesting personal data on an unprecedented level, but Twitter\
    \ and Instagram are serious contenders too. We can take a look at Facebook’s terms\
    \ of service (current as of May 2018) to see what kind of data they collect:\n\
    \n*   frequency and duration of visit\n\n*   frequency and type of content shared,\
    \ viewed or interacted with\n\n*   data about files uploaded, such as timestamps\
    \ or file names\n\n*   data other people provide about the user, such as your\
    \ phone number\n\n*   who the user interacts with, how much and about what\n\n\
    *   credit card information, such as billing and shipping addresses\n\n*   data\
    \ from all devices used to connect to Facebook, such as Wi-Fi names, language\
    \ used and battery strength\n\n*   data from websites that have the Like button\
    \ to see what the user visited and what he did there\n\n*   data from 3rd parties,\
    \ such as an advertiser showing if the user clicked an ad\n\n*   data gathered\
    \ about the user by other companies owned by Facebook"
