- raw: "Neural networks is a concept proposed way back in 1944 by two University of\
    \ Chicago professors who eventually transferred to MIT to work on machine learning\
    \ programs. Neural networks (now called “deep learning”) are a special way to\
    \ tie many small machine learning programs together and let them chat between\
    \ themselves to exchange information. For example, a neural network can be shown\
    \ many different pictures of cars until it teaches itself to recognize which details\
