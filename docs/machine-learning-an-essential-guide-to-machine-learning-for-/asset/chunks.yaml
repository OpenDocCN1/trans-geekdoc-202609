    # Neural networks


    Neural networks is a concept proposed way back in 1944 by two University of Chicago
    professors who eventually transferred to MIT to work on machine learning programs.
    Neural networks (now called “deep learning”) are a special way to tie many small
    machine learning programs together and let them chat between themselves to exchange
    information. For example, a neural network can be shown many different pictures
    of cars until it teaches itself to recognize which details in all the car images
    are relevant (doors, windows, tires, etc.) in a way only a human can. It’s actually
    quite brilliant how the human brain can recognize abstract patterns in all sorts
    of efficient ways and how fascinatingly close neural networks come to that. Each
    of the nodes within a neural network is connected to about a dozen other nodes
    but the data only moves forward based on the value the network assigns to itself.
    At times not even the programmers know how the neural network works, but the same
    could be said for the human brain and yet we still use it on a daily basis to
    great effect.


    Tech companies have been using neural networks for image sorting after realizing
    their potential, feeding them millions of images of what they need to recognize.
    This helps scientists realize not just how the computer vision works but also
    how humans see, think and perceive objects around them. On the other hand, neural
    networks can be easily fooled with scrambled images that appear to them as real
    objects[[5]](#part0000_split_025.html#_ftn5). By using evolutionary algorithms
    that pick the most fitting results and add a slight mutation, the neural network
    can produce an astounding work of art worthy of a museum exhibition or something
    straight out of a vivid dream. In a sense, neural networks are dreaming whenever
    they analyze any kind of content. For now, a neural network might have the mundane
    task of scanning images uploaded to Facebook to determine if it has cats, pots
    or cars and help the visually impaired, but in the near future we might see it
    do real-time image processing and visual evaluation.


    Neural networks can also be used for natural language processing (NLP). Windows
    Notepad is a simple, straightforward tool for word processing where we have to
    type everything manually, but a NLP Notepad would be able to literally reply to
    questions typed into it or write out a summary of a block of text. How about a
    future where an NLP neural network goes through a book and writes a solid report
    in 2 minutes? Human language being notoriously difficult to understand and explain,
    neural networks still have a long way to go before they can serve like universal
    translators from Star Trek. For now neural networks might do better in face recognition
    and keyword analysis than actual reading, where a typical 4-year-old overtakes
    them easily.


    But maybe we’re setting the bar too high for machine learning. The human brain
    has been evolving for millions of years in the harshest living conditions of African
    savannahs and Siberian tundras to learn, adapt and survive. No wonder it has a
    shock-absorbing cushion made of spinal fluid inside the skull that gives it neutral
    buoyancy, preventing it from caving in under its own weight, and runs on 20 watts
    of power, enough to merely brighten a small incandescent light bulb. Despite its
    adaptability, the human brain misfires all the time and can be made to remember
    things that didn’t happen. Speaking of which, did I turn the stove off? I’d better
    go check again for just in case. As it turns out, billions of neurons the human
    brain is comprised of constantly chat between themselves to reach a consensus
    while a good portion of them produce nothing but noise and chatter yet this system
    works. Not only that, but it’s home to the most elusive concept in our existence
    – consciousness.


    ## Chapter 6 – Matching the human brain


    Medicine has a rough idea that we are conscious due to some structures in the
    brain, but that’s about it. What is it that makes us conscious? We know from cartoons
    and slapstick comedies that a blow to the head can make a person unconscious,
    so consciousness must have something to do with the head, the brain in particular.
    But which part of the brain is that? This is where we enter the bizarre dimension
    between our ears that consists of 3 pounds of fat and nerves.


    One strange case of a person losing 90% of his brain cells and still remaining
    conscious[[6]](#part0000_split_025.html#_ftn6) is what threw all the carefully
    constructed theories about consciousness in the dumpster and forced us to rethink
    the capabilities of the brain we took for granted. The condition is called “hydrocephaly”
    and is essentially the body not properly draining fluids from the brain. These
    fluids normally take away all sorts of waste and metabolic byproducts, but in
    the case of the Frenchman who had hydrocephaly as a kid and is mentioned in that
    article, he had a valve installed in the skull to release the pressure.


    The valve was eventually removed but the guy apparently entered remission and
    the condition led to such a fluid buildup that he lost all but a tiny layer of
    cells lining the inside of his skull. He was still able to go to work and lead
    a regular life without losing his intelligence, meaning there is something in
    the consciousness that makes it adapt to strange circumstances and survive horrific
    injuries as long as there’s still a need for the body to survive.


    This case also shows that consciousness is an emergent property of a body that
    has to navigate the world, not necessarily something a brain has on its own. In
    a sense, consciousness is the will to live and the guy was able to survive almost
    without a brain because he willed it so and his family needed him. This is the
    kind of thing machine learning scientists would gasp at upon hearing – how do
    we give our machines that kind of survivability and resilience? How do we make
    them want to live and fight in this conflicted, messy world? How do we give them
    a sense of purpose, something we’re not sure how to do with humans? This sounds
    like the perfect introduction to a Terminator future, with machines hell-bent
    on eradicating humans for no good reason.


    Too much? It’s just another day in the machine learning world where science and
    philosophy get together for a drink, start a fight and become best pals. In short,
    making a smart robot would involve giving them a body and a machine learning program
    that could navigate the world on its own. At that point, they would supposedly
    become conscious, but there’s no telling what would happen next.


    ## Chapter 7 – Artificial Intelligence


    During the 1990s, machine learning scientists put their dream of making an artificial
    intelligence, a genie in a bottle that could be made to learn everything, on the
    back burner and focused on solving practical problems, such as making programs
    that could set a medical diagnosis based on probabilities. If Bob smokes, doesn’t
    exercise, is overweight and gets a heart attack at 52, what are the chances Fred,
    who smokes and doesn’t exercise but isn’t overweight, will get one too by the
    time he’s 52 and how much should we modify their health insurance costs? Based
    on just one sample it’s impossible to tell, but when the machine is fed anonymous
    data from thousands and thousands of diagnosed illnesses in supervised learning
    models it’s possible to get highly accurate diagnoses without any doctor setting
    eyes on the patient or the patient feeling any symptoms. Still, doctors won’t
    be getting kicked out of hospitals any time soon since human bodies are so wonderfully
    weird that there’s always that one-in-a-thousand case only the likes of Dr. House
    can fix. In a major city this means a constant stream of people who glued their
    tongue to their cheek or swallowed an entire light bulb, something no kind of
    AI could solve.

