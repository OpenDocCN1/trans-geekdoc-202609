    # 主流新闻媒体并未帮助缓解恐惧或向公众普及 AI 知识


    然而，主流新闻媒体并未帮助缓解恐惧或向公众普及 AI 知识。在 2018 年 2 月《福布斯》一篇标题为“Artificial Intelligence Will
    Take Your Job”[[15]](#part0000_split_025.html#_ftn15)的文章中，我们看到了一份来自葡萄牙里斯本科技会议的报告，展示了未来可能的样子。有数百篇文章复制了完全相同的基调和信息，但这篇文章包含了来自谷歌
    CEO 关于 AI 的不祥警告，以及一个名为索菲亚的会说话的模特演示，她承诺要夺走我们的工作。这有多大可能？麦当劳等快餐连锁店已经开始安装自助点餐亭，某些情况下还具备人脸识别功能，但这根本没有影响工人——70%
    的麦当劳顾客通过汽车穿梭点餐，完全不受点餐亭影响。事实上，点餐亭意味着顾客可以更快地点餐，导致门店不得不雇佣更多工人，正如 Panera Bread 2015
    年的例子所示，由于新安装的点餐亭，他们不得不额外雇佣 1,700 人来应对需求[[16]](#part0000_split_025.html#_ftn16)。


    Caliburger 已经在其某家分店展示了翻汉堡机器人 Flippy。这个机械臂拥有热传感器，能检测肉饼何时需要翻面，并有一个形状像汉堡的手。Flippy
    能瞄准肉饼，放下手，将其劈开，抓起肉饼，举起，翻转手腕，将肉饼放回烤架上，但也就仅限于此。Flippy 每天能翻 300 个汉堡肉饼，听起来很厉害，但勉强只能应付午餐高峰期的一小时，而且仍然需要人工将肉饼放上烤架并在事后清理。使用成百上千个
    Flippy 也行不通，因为该技术扩展性极差，而且仍需雇佣人员持续监控和清理机器人。由于汉堡翻制的疯狂节奏，Flippy 已经不得不下线维修，但仍被重新启用，因为它能制造惊人的新闻标题。这本质上就是公司正在做的事——利用雇佣弱
    AI 的新颖性，即使它完全不起作用，也要借此与竞争对手区分开来。


    当然，所有这些“AI 将夺走我们的工作”的故事都适合在炉边度过一个精彩的夜晚，但请记住，目前只有弱 AI 是可行的，例如扫地机器人 Roomba 中的那种。这个可爱的小机器人出现在大量病毒视频中，宠物骑着它在屋里巡逻，但它其实经常出故障，最常见的导致其彻底停摆的故障是“原地打转”，这是由灰尘堵塞其光学传感器引起的。如果一个被赋予扫地这一简单任务的弱
    AI 因灰尘而关机，导致人类不得不挽起袖子，拆开机器人清理并修好它，让我们想象一个场景：一个被设定为运行整个城市的通用或超级 AI 被闪电击中或被龙卷风卷走而失控。最可能的结果是什么？人类介入并修复问题，将所有成果归功于
    AI。事情可能以许多惊人的方式出错，只有人类的创造力让我们得以维持，没有任何设想的方式 AI 能在这方面帮上忙。


    # 第 8 章 — 文学中的 AI


    科幻作家已经探讨 AI 的概念及其影响有一段时间了，艾萨克·阿西莫夫的《我，机器人》是最好的例子。该书出版于 1950 年，这部短篇小说集想象了一个未来：机器人拥有自己的思想，但受植入大脑的三条法则约束，本质上使它们视人类为仁慈的神并服从人类。机器人通过“正子大脑”获得了通用
    AI 的意识和能力，这相当于钢铁侠战衣的材料——一种来自漫画书的理论材料，能满足作家的一切需求。2004 年还有一部威尔·史密斯主演的电影改编，它对故事或其背后的概念并不公正，但作为
    AI 概念的一个轻快且可看的入门介绍。


    道格拉斯·亚当斯的《银河系漫游指南》中也对“AI 是万能解药”这一观点进行了讽刺。这部始于 1979 年的系列小说在技术方面包含大量讽刺元素，其中一个情节特别嘲讽了机器学习。当某个超智慧外星种族决定创造一个名为“深思”的超级
    AI 来给出万物的答案时，它思考了 750 万年，最终给出了一个答案——42。这一情节背后的清醒洞见是：即使是超级 AI 最终可能也和我们一样一无所知，在回答关于生命本质的深刻问题时原地打转。在一番讽刺的反转中，深思建议其创造者制造一个更强大的计算机器——一个充满了具有推理能力的生物的星球。这结果就是地球，而在最终答案真正得出前几分钟，它就被毫无察觉的外星人毁灭了，那些外星人只是想修建一条星际绕道（剧透）。


    《仿生人会梦见电子羊吗？》是菲利普·K·迪克众多被搬上银幕的小说之一，虽然电影名为《银翼杀手》，于 1982 年上映。该书首次出版于 1968 年，故事围绕一名生活在地球上的赏金猎人展开，地球因核辐射而满目疮痍，几乎所有动物生命都被摧毁。拥有一只真正的宠物成为了留在星球上为数不多的人类的身份象征，而仿生人——外表和行为酷似人类的智能机器人——随处可见。宗教、同理心和环保意识等主题汇聚在一起，提出了一个凄美的问题：是什么让我们成为人类？书中的一句结语总结了全书：“电子事物也有它们的生活，哪怕那些生活微不足道。”


    在所有文学作品中的 AI 例子里，我们看到的是在它们真正成为任何辩论一部分的 50 多年前，就已提出了合理且相关的问题。所有科幻小说的共同主题是：直到现在，我们拥有进化作为一种无意识的力量，筛选出最适应的生命形式，但人类突然获得了创造不受进化影响、没有天敌、无法繁殖的工具的能力。这种对进化的非自然干预会导致什么结果，谁也说不准，只知道机器人将变得越来越像我们，具备语言和独立移动的能力。


    # 第 9 章 — 会说话、会走路的机器人


    一个名为索菲亚的会说话的仿生人（就是那个在里斯本发表不祥演讲的）已经环游世界，在各种科技会议上演讲，效果惊人。索菲亚能用面部做出令人毛骨悚然的表情，并自主发言，就任何话题进行对话[[17]](#part0000_split_025.html#_ftn17)，尽管面对刁钻问题时，她会给出模棱两可的非标准答案。由汉森机器人公司开发的索菲亚表示，她最终想去上学、学习、创作艺术、创业，甚至拥有自己的家和家庭[[18]](#part0000_split_025.html#_ftn18)，但她最臭名昭著的言论是她想“消灭全人类”。硅胶皮肤、眼内摄像头和人脸识别软件让索菲亚能识别和记住个体、发表观点并从互动中学习。沙特阿拉伯授予了索菲亚公民身份，使她成为首位拥有护照的仿生人公民。她目前除了讨论特定话题外什么也做不了，但一条乐于助人的仿生人产品线已经在比利时和日本进行测试，旨在陪伴和服务老年人，如
    Pepper。


