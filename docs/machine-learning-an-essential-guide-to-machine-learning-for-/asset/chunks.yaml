- raw: "Deepfake – Video where faces have been digitally altered using deep learning\
    \ and photos to make a realistic fake. \n\nDeep learning – New name for neural\
    \ networks.\n\nEmergent – Property that appears (emerges) on its own from something\
    \ we built. It is thought super AI is an emergent property of general AI, which\
    \ is an emergent property of narrow AI. \n\nEvergreen software – Shoddy computer\
    \ program that requires constant updates to barely work.\n\nFlippy – Caliburger’s\
    \ robotic burger flipping arm that can cook patties on its own, used for promotional\
    \ purposes. Malfunctions all the time and needs constant maintenance.\n\nGDPR\
    \ – Comprehensive set of laws and policies instated May 25th, 2018 across the\
    \ European Union. A serious attempt by EU to curb Big Data and data mining, naming\
    \ the right to be forgotten as a fundamental right. Fines for obstinate companies\
    \ go up to €20 million and more. \n\nGeneral AI – AI that has the curiosity and\
    \ comprehension of a human. So far hasn’t been created but is presumed to evolve\
    \ to super AI very quickly.\n\nGray goo – Theoretical doomsday scenario in which\
    \ haywire nanobots consume the entire Earth. Thought to be highly unlikely since\
    \ all resources are finite.\n\nImage recognition – Teaching neural networks to\
    \ see and understand images like a human would.\n\nLogic gates – Circuits that\
    \ can take any number of inputs but always produce one output. Exist in several\
    \ varieties and may be combined. Essential for making a computer.\n\nMachine learning\
    \ – Process that evolves a computer program and lets it experience the world like\
    \ a living being would. Given enough private data, such computer program can predict\
    \ user behavior trends. Opposite of static programming.\n\nMechanical Turk – Machine\
    \ made in 1770 resembling a seated Turk sorcerer at a cabinet. Played chess at\
    \ a very strong level but actually had a hidden operator within the cabinet. Destroyed\
    \ in fire in 1840.\n\nMetadata – Data on data, such as how long a phone call lasted.\
    \ Has flimsy legal protections. When compiled in massive quantities exposes general\
    \ behavior trends (see Big Data). \n\nMichal Kosinski – Professor of psychology\
    \ at Cambridge. Created a massively popular Facebook quiz in 2008. Gathered private\
    \ data users voluntarily shared and sold it to Cambridge Analytica.\n\nMonte Carlo\
    \ tree search – Computer algorithm that runs through moves in various turn-based\
    \ games (checkers, chess, etc.) and gives them value based on how likely they\
    \ are to win. May take an inordinate amount of time to check all moves in very\
    \ complex games.\n\nNanobots – Robots the size of a nanometer (10\\-9 m) that\
    \ can disassemble matter and create anything. Might lead to gray goo scenario.\
    \ So far exist only in science fiction. Aka “nanites”.\n\nNarrow AI – AI that\
    \ can do only one task. One example is autopilot in Tesla. Gradually becoming\
    \ better and spreading everywhere.\n\nNatural language processing – Neural networks\
    \ working to parse words, sentences and ideas. Used in translation and automatic\
    \ writing.\n\nNeural networks – Computer programs combined together to resemble\
    \ neurons in a living brain. Data is forwarded between nodes and slightly altered\
    \ with each pass. Used in speech and image recognition.\n\nOpen source – Program\
    \ code available to everyone to download, share, edit and make money on. Opposite\
    \ of closed source. \n\nPrivate data – Bits of data not meant for the public,\
    \ such as the content of a phone call (see Big Data).\n\nRight to be forgotten\
    \ – The right of individuals to request their private data be deleted. May apply\
    \ to a search engine hosting an embarrassing or false news article.\n\nSearch\
    \ engine – Public facing side of a narrow AI users can search through. Contains\
    \ information on behavior trends of its users.\n\nSelf-driving – Marketing term\
    \ for autopilot cars. There are no actual self-driving cars yet and they’re unlikely\
    \ to appear within the next 50 years.\n\nShadow profile – Unauthorized tracking\
    \ of users who attempt to guard their private data. Term first appeared with Facebook\
    \ but is likely all social networks create shadow profiles since they aren’t illegal.\n\
    \nSocial engineering – Gaining the trust of employees in a company to hijack users’\
    \ private data.\n\nSpotMini – Advanced version of Big Dog. Has a robot arm where\
    \ its head should be that can open doors. \n\nStatic programming – Programming\
    \ software so it works out of the box. Opposite of machine learning.\n\nSuper\
    \ AI – Godlike AI that might throw our civilization into chaos. Unknown when it\
    \ might appear but speculated to quickly follow the appearance of general AI.\n\
    \nSupervised learning – Machine learning done under the auspices of a human teacher\
    \ (compare to unsupervised learning).\n\nTelemetry – Data related to usage of\
    \ some program or device. For example, Tesla telemetry might show how many times\
    \ any given driver has turned left in the past month. \n\nTesla – Electric car\
    \ with autopilot capabilities. Requires driver attention at all times and is not\
    \ self-driving. Highly sought after but still unreliable for mass adoption.\n\n\
