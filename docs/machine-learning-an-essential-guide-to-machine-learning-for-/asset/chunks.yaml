    # The Dream of Self-Driving Cars


    The dream is to step into a self-driving car with a blanket and take a 2-hour
    nap while the car hums along to the workplace and then do the same thing on the
    way back. This is the promise implied in the idea of self-driving cars, but that’s
    not how they work at all. In fact, if one Tesla drives into a wall at a certain
    spot on the highway we can be sure others will do so as well, as seen in the CBS
    News video[[29]](#part0000_split_025.html#_ftn29) where a Tesla driver tests his
    car near the same spot where another Tesla had an accident and experiences the
    exact same erratic behavior.


    The official explanation for why a Tesla might swerve into a concrete divider
    in autopilot mode is that “they can’t see the lines clearly”, which shows us just
    how reliable the driving AI is. But even if it messes up once in a while it’s
    still going to do its best to keep the driver safe, right? Right? If self-driving
    cars catch on we might be nearing a future where we’ll buy a car that will decide
    to drive us off a cliff or smash us into a wall in order to kill us on purpose.
    This is an ethics issue called “The Trolley Problem”, in which the car AI might
    have to decide on the spot whether to do nothing, thus causing several lives to
    be lost, or intentionally kill one person to save the rest.


    ## The Trolley Problem


    The Trolley Problem depicts a scene in which a trolley is hurtling down a rail
    towards five people. They don’t have time to move out of the way and the trolley
    can’t be stopped – their death is guaranteed. There is a railroad junction between
    the trolley and the group of people, and we’re standing right next to the lever
    that can shift the junction and redirect the trolley onto the second rail. The
    only problem is there’s another person on the second rail. What do we do: let
    five people die or kill one to save the rest?


    The Trolley Problem raises the issues of morality: who gets to decide if they
    have the right to take anyone’s life and how do we measure which life is more
    valuable. What if there are five old people on the first and a young pregnant
    woman on the second rail? Now let’s imagine an imperfect driving AI with sensors
    that can get clogged by dirt and might not see the lines clearly that gets to
    decide who lives and who dies, amplify it by a million and we get a never-ending
    pile up, a vehicular Wild West unlike anything we’ve seen in the history of civilization.
    These are the kinds of dilemmas AI scientists find themselves in as their AI groomed
    by machine learning has to exit sterile labs into the real world.


    ## Liability and Terms of Service


    If a car that’s using machine learning decided to kill a person, who would be
    responsible: programmers who made the fundamental code, engineers that worked
    on the chassis or the salesman who sold it? The most realistic scenario is that
    any such AI-driven car will come with a waiver that says the driver is willing
    to get killed if AI decides one life is worth less than any other random person’s.
    Just like with Facebook’s terms of service everyone is going to gloss over those
    contracts, signing off their lives to the whim of an AI to try out a shiny new
    toy.


    ## Impact on Truck Drivers


    What about truck drivers? This is another field where driving AI is promised to
    upset the economy, but yet again we see marketing ploys and a lot of AI puffery.
    There are around 3.5 million truck drivers in the US, with the economy desperately
    wanting 20,000 more per year[[30]](#part0000_split_025.html#_ftn30) and 29 states
    depending on their incessant travel up and down the country. Low barrier to entry
    (pretty much just a driver’s license, criminal records don’t matter) makes truck
    driving a stressful and dirty but legitimate and legal source of income for many
    people. One 2016 article from The Guardian[[31]](#part0000_split_025.html#_ftn31)
    essentially paints the picture of self-driving fleets of trucks that leave all
    the truck drivers in the world scrounging for crumbs, proposing universal basic
    income as a solution (as is customary for The Guardian).


    Though convoys of self-driving trucks have successfully navigated shorter routes,
    it was always a publicity stunt done under heavy surveillance and escort of engineers
    ready to jump in, the same as we mentioned being done with cars. For example,
    this article[[32]](#part0000_split_025.html#_ftn32) celebrates cross-EU travel
    of a convoy of trucks made by different manufacturers. What’s the catch? The trucks
    were “semi-automated”, meaning there was a driver present in each, which kind
    of makes the achievement itself irrelevant. For the majority of readers who only
    read the headline and just skim the rest the conclusion would be that AI will
    replace truck drivers, but for the astute reader who knows that self-driving vehicles
    just don’t exist and they aren’t legally allowed on the road without a human driver,
    the entire article comes out as a fluff piece.


    But what would happen if insurance companies see self-driving trucks as safer
    and start charging human drivers extra for the luxury? Perhaps self-driving cars,
    erratic as they are, will eventually come about as a result of economic incentives
    that will make driving a vehicle ourselves become an expensive hobby, a luxury
    just like horseback riding that was once commonplace but is now considered a status-signaling
    pastime. The best way to know what’s going to happen is to constantly pay attention
    to legislation and note how it reacts to self-driving cars – if the laws ban them
    there’s no way Google or Tesla will dare push for it and the dream of driverless
    traffic will be dead in its tracks.


    Right now the dangers of AI are much more mundane and the biggest challenge for
    users is retaining their online privacy (even Google’s “self-driving” Waymo car
    has cameras watching the passengers) and wresting for control over their private
    data in an increasingly online-only world where machines want to learn everything
    about us.


    # Chapter 11 – Personal Voice-Activated Assistants


    Alexa and Siri, the two most popular personal assistants, show the capabilities
    of machine learning that is always on and always listening, springing into action
    at a moment’s notice with perfect answers. Here’s where we enter the murky waters
    of data mining and Terms of Service nobody reads, except hapless 3rd world freelancers
    who get paid peanuts to write them.


    Alexa and Siri work by constantly analyzing background noise and waiting to hear
    keywords. It’s impossible for either of them to work properly without being always
    on and always listening, but the catch is again that the algorithm is listening,
    not a human. When things go awry, Alexa can start doing random things that show
    just what happens when AI has a bad day. In a recent bizarre case of malfunction,
    Alexa happened to mistake background conversation as a command to record and send
    it to a contact[[33]](#part0000_split_025.html#_ftn33).


    The convoluted official explanation is that the Alexa microphones strewn about
    the house happened to hear a couple words from a distant conversation and interpreted
    them as a command to start recording, then another couple words to send the recording
    to a contact. Even when it’s working properly, Alexa reveals all the dirty laundry
    as her terms of service[[34]](#part0000_split_025.html#_ftn34) mention third party
    services being able to tap into the analyzed voice stream and gather data, which
    is no surprise – if a company can make money and the users are willing to share
    their private data, it’s a given they’ll do it. Why not?

    '
  trans: '


    # 自动驾驶汽车的梦想


    梦想是裹着毯子走进一辆自动驾驶汽车，在车子嗡嗡作响驶向工作地点的途中睡上 2 小时午觉，回程时再来一次。这就是自动驾驶汽车概念中隐含的承诺，但它们的实际运作方式完全不是这样。事实上，如果一辆特斯拉在高速公路的某个特定地点撞上墙壁，我们可以确信其他特斯拉也会如此，正如
    CBS 新闻视频[[29]](#part0000_split_025.html#_ftn29) 所展示的，一位特斯拉车主在另一辆特斯拉发生事故的同一地点附近测试自己的车，结果经历了完全相同的异常行为。


    官方对特斯拉在自动驾驶模式下为何会冲向混凝土分隔带的解释是“它们看不清车道线”，这让我们看清了驾驶 AI 到底有多可靠。但即使它偶尔搞砸了，它仍然会竭尽全力保障驾驶员安全，对吧？对吧？如果自动驾驶汽车普及开来，我们可能正逼近一个这样的未来：我们购买的汽车会决定驾驶我们冲下悬崖，或故意将我们撞向墙壁以致我们于死地。这是一个被称为“电车难题”的伦理问题，在这种情境下，汽车
    AI 可能必须即时决定：是什么都不做，导致数条人命丧生；还是故意牺牲一人以挽救其余众人。


    ## 电车难题


    电车难题描绘了这样一个场景：一辆电车在轨道上飞驰，前方有五个人。他们来不及避让，电车也无法停下——他们的死亡已成定局。电车与这群人之间有一个铁路道岔，我们就站在能够拨动道岔、将电车引向第二条轨道的杠杆旁。唯一的问题是第二条轨道上还有一个人。我们该怎么办：眼睁睁看着五人死亡，还是杀一人救其余众人？


    电车难题引发了道德层面的问题：谁有权决定是否拥有剥夺他人生命的权利？我们如何衡量哪条生命更有价值？如果第一条轨道上是五位老人，第二条轨道上是一位年轻孕妇，又该如何？现在让我们设想一个不完美的驾驶
    AI，其传感器可能被污垢堵塞、可能看不清车道线，却拥有决定谁生谁死的权力；将这种情况放大一百万倍，我们将面临一场永无止境的连环相撞，一场文明史上从未见过的车辆版“狂野西部”。这些正是
    AI 科学家们面临的困境：他们通过机器学习训练出的 AI 必须走出无菌实验室，步入真实世界。


    ## 责任归属与服务条款


    如果一辆使用机器学习的汽车决定杀死一个人，谁该负责：编写基础代码的程序员、研发底盘的工程师，还是推销它的销售员？最现实的情景是，任何此类 AI 驱动的汽车都将附带一份免责声明，内容大意是驾驶员愿意接受被杀的命运，如果
    AI 判定一条命不如其他任何随机路人的命有价值。就像 Facebook 的服务条款一样，每个人都会草草浏览这些合同，将自己的生死交托给 AI 的一时兴起，只为体验一把崭新的玩具。


    ## 对卡车司机的影响


    卡车司机又该如何？这是驾驶 AI 承诺将颠覆经济的另一个领域，但我们再次看到了营销噱头和大量的 AI 吹捧。美国约有 350 万卡车司机，经济迫切需要每年新增
    2 万名[[30]](#part0000_split_025.html#_ftn30)，且 29 个州依赖他们不知疲倦地在全国南北穿梭。入行门槛低（几乎只需一张驾照，犯罪记录不予考究），使得卡车驾驶成为许多人虽辛苦肮脏却合法正当的收入来源。《卫报》2016
    年的一篇文章[[31]](#part0000_split_025.html#_ftn31) 基本勾勒出这样的图景：自动驾驶卡车车队横行，让全世界的卡车司机只能四处讨生活，并照例提出全民基本收入作为解决方案（这是《卫报》的惯常套路）。


    尽管自动驾驶卡车车队已成功完成短途行驶，但那始终是在工程师们严密监控和随时准备接管的护航下进行的宣传噱头，正如我们提到的汽车测试一样。例如，这篇文章[[32]](#part0000_split_025.html#_ftn32)
    赞扬了由不同制造商生产的卡车车队跨欧盟行驶。问题在哪里？这些卡车是“半自动化”的，意味着每车都有驾驶员在场，这在很大程度上使得该成果本身失去了意义。对于只看标题、略读正文的大多数读者来说，结论会是
    AI 将取代卡车司机；但对于知道自动驾驶车辆根本不存在、且法律不允许无人驾驶车辆在无人类驾驶员的情况下上路的敏锐读者来说，整篇文章不过是一篇软文。


    但如果保险公司认为自动驾驶卡车更安全，开始向人类驾驶员收取额外费用以享受这份“奢侈”，会发生什么？也许自动驾驶汽车——尽管它们反复无常——最终会因经济激励而出现，导致自己开车变成一项昂贵的爱好、一种奢侈品，就像骑马曾经普遍但现在被视为一种彰显身份的消遣一样。了解未来走向的最佳方式是持续关注立法动态，留意其对自动驾驶汽车的反应——如果法律禁止它们，谷歌或特斯拉就不敢强推，无人驾驶交通的梦想就会在起跑线上夭折。


    目前 AI 的危险要平庸得多，用户面临的最大挑战是保住在线隐私（即使是谷歌的“自动驾驶” Waymo 汽车也装有监视乘客的摄像头），以及在一个日益纯在线化、机器渴望了解我们一切的世界里，夺回对私人数据的控制权。


    # 第 11 章——个人语音助手


    Alexa 和 Siri 这两款最流行的个人助手，展示了时刻在线、时刻聆听的机器学习能力，它们能在瞬间弹出完美答案。这里我们进入了数据挖掘和无人阅读的服务条款的浑浊水域，除了那些拿着微薄报酬撰写条款的倒霉第三世界自由职业者，没人去读它们。


    Alexa 和 Siri 通过持续分析背景噪音、等待唤醒词来工作。如果不时刻开启、时刻聆听，它们根本无法正常运作，但问题在于监听的是算法，而非人类。当出故障时，Alexa
    会开始做一些随机的事情，展示出 AI “心情不好”时会发生什么。在最近一个离奇的故障案例中，Alexa 竟将背景对话误认为是录制并发送给联系人的指令[[33]](#part0000_split_025.html#_ftn33)。


    官方给出的复杂解释是：屋里散落的 Alexa 麦克风碰巧听到了远处对话中的几个词，将其解读为开始录制的指令，接着又听到几个词，解读为将录音发送给联系人的指令。即使正常工作时，Alexa
    也会暴露所有隐私，因为其服务条款[[34]](#part0000_split_025.html#_ftn34) 提到第三方服务能够接入分析后的语音流并收集数据，这不足为奇——如果公司能赚钱且用户愿意分享隐私数据，它们理所当然会这么做。为什么不呢？


    '
