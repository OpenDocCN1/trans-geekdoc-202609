- raw: "Tech companies are already eyeing biometrics as a supposedly unhackable way\
    \ to phase out passwords that can be guessed or smartphones that can be stolen.\
    \ The latest iPhone models are already using home buttons that recognize fingerprints\
    \ and allow facial scanning to unlock the device. Social networks (again Facebook)\
    \ are well underway on gathering enormous swaths of biometrics on all their users\
    \ but now other industries have started doing it as well, all under the guise\
    \ of added convenience. In 2017, Caliburger installed fast food kiosks in Pasadena\
    \ with facial recognition where the customers simply need to smile to bring up\
    \ their purchase history, with plans to eliminate cash and card payments and make\
    \ it all about biometrics. In Jinan, China facial recognition cameras film jaywalkers,\
    \ scan the police records, bring up their pictures on public billboards and shame\
    \ them in front of everyone. The plan is to eventually have a “good citizen score”\
    \ for all Chinese, a value of how much they benefit the society. The stated goal\
    \ is to “make it hard for the discredited to take a single step”[\\[46\\]](#part0000_split_025.html#_ftn46).\n\
    \nHistory has shown that there is no such thing as a perfect security measure.\
    \ All security relies on deterrence and being able to annoy the potential thief\
    \ until they give up and find an easier target. This means that if a villain is\
