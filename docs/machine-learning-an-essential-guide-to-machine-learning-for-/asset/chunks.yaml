    \ mortality to the point where the colonist population is self-sustainable as\
    \ well. But what if we had intelligent machines to do the initial settlement for\
    \ us?\n\nEnter Von Neumann, a Hungarian scientist from the early 20th century\
    \ who theorized about self-replicating structures having sort of a mechanical\
