    \ an astounding work of art worthy of a museum exhibition or something straight\
    \ out of a vivid dream. In a sense, neural networks are dreaming whenever they\
    \ analyze any kind of content. For now, a neural network might have the mundane\
    \ task of scanning images uploaded to Facebook to determine if it has cats, pots\
    \ or cars and help the visually impaired, but in the near future we might see\
    \ it do real-time image processing and visual evaluation.\n\nNeural networks can\
    \ also be used for natural language processing (NLP). Windows Notepad is a simple,\
    \ straightforward tool for word processing where we have to type everything manually,\
    \ but a NLP Notepad would be able to literally reply to questions typed into it\
    \ or write out a summary of a block of text. How about a future where an NLP neural\
    \ network goes through a book and writes a solid report in 2 minutes? Human language\
    \ being notoriously difficult to understand and explain, neural networks still\
    \ have a long way to go before they can serve like universal translators from\
    \ Star Trek. For now neural networks might do better in face recognition and keyword\
    \ analysis than actual reading, where a typical 4-year-old overtakes them easily.\
    \ \n\nBut maybe we’re setting the bar too high for machine learning. The human\
    \ brain has been evolving for millions of years in the harshest living conditions\
    \ of African savannahs and Siberian tundras to learn, adapt and survive. No wonder\
    \ it has a shock-absorbing cushion made of spinal fluid inside the skull that\
    \ gives it neutral buoyancy, preventing it from caving in under its own weight,\
    \ and runs on 20 watts of power, enough to merely brighten a small incandescent\
    \ light bulb. Despite its adaptability, the human brain misfires all the time\
    \ and can be made to remember things that didn’t happen. Speaking of which, did\
    \ I turn the stove off? I’d better go check again for just in case. As it turns\
    \ out, billions of neurons the human brain is comprised of constantly chat between\
    \ themselves to reach a consensus while a good portion of them produce nothing\
    \ but noise and chatter yet this system works. Not only that, but it’s home to\
    \ the most elusive concept in our existence – consciousness.\n\n## Chapter 6 –\
    \ Matching the human brain\n\nMedicine has a rough idea that we are conscious\
    \ due to some structures in the brain, but that’s about it. What is it that makes\
    \ us conscious? We know from cartoons and slapstick comedies that a blow to the\
    \ head can make a person unconscious, so consciousness must have something to\
    \ do with the head, the brain in particular. But which part of the brain is that?\
    \ This is where we enter the bizarre dimension between our ears that consists\
    \ of 3 pounds of fat and nerves.\n\nOne strange case of a person losing 90% of\
    \ his brain cells and still remaining conscious[\\[6\\]](#part0000_split_025.html#_ftn6)\
    \ is what threw all the carefully constructed theories about consciousness in\
    \ the dumpster and forced us to rethink the capabilities of the brain we took\
    \ for granted. The condition is called “hydrocephaly” and is essentially the body\
    \ not properly draining fluids from the brain. These fluids normally take away\
    \ all sorts of waste and metabolic byproducts, but in the case of the Frenchman\
    \ who had hydrocephaly as a kid and is mentioned in that article, he had a valve\
    \ installed in the skull to release the pressure.\n\nThe valve was eventually\
    \ removed but the guy apparently entered remission and the condition led to such\
    \ a fluid buildup that he lost all but a tiny layer of cells lining the inside\
    \ of his skull. He was still able to go to work and lead a regular life without\
    \ losing his intelligence, meaning there is something in the consciousness that\
    \ makes it adapt to strange circumstances and survive horrific injuries as long\
    \ as there’s still a need for the body to survive.\n\nThis case also shows that\
    \ consciousness is an emergent property of a body that has to navigate the world,\
    \ not necessarily something a brain has on its own. In a sense, consciousness\
    \ is the will to live and the guy was able to survive almost without a brain because\
    \ he willed it so and his family needed him. This is the kind of thing machine\
    \ learning scientists would gasp at upon hearing – how do we give our machines\
    \ that kind of survivability and resilience? How do we make them want to live\
    \ and fight in this conflicted, messy world? How do we give them a sense of purpose,\
    \ something we’re not sure how to do with humans? This sounds like the perfect\
    \ introduction to a Terminator future, with machines hell-bent on eradicating\
    \ humans for no good reason.\n\nToo much? It’s just another day in the machine\
    \ learning world where science and philosophy get together for a drink, start\
    \ a fight and become best pals. In short, making a smart robot would involve giving\
    \ them a body and a machine learning program that could navigate the world on\
    \ its own. At that point, they would supposedly become conscious, but there’s\
    \ no telling what would happen next.\n\n## Chapter 7 – Artificial Intelligence\n\
    \nDuring the 1990s, machine learning scientists put their dream of making an artificial\
    \ intelligence, a genie in a bottle that could be made to learn everything, on\
    \ the back burner and focused on solving practical problems, such as making programs\
    \ that could set a medical diagnosis based on probabilities. If Bob smokes, doesn’t\
    \ exercise, is overweight and gets a heart attack at 52, what are the chances\
    \ Fred, who smokes and doesn’t exercise but isn’t overweight, will get one too\
    \ by the time he’s 52 and how much should we modify their health insurance costs?\
    \ Based on just one sample it’s impossible to tell, but when the machine is fed\
    \ anonymous data from thousands and thousands of diagnosed illnesses in supervised\
    \ learning models it’s possible to get highly accurate diagnoses without any doctor\
    \ setting eyes on the patient or the patient feeling any symptoms. Still, doctors\
    \ won’t be getting kicked out of hospitals any time soon since human bodies are\
    \ so wonderfully weird that there’s always that one-in-a-thousand case only the\
    \ likes of Dr. House can fix. In a major city this means a constant stream of\
    \ people who glued their tongue to their cheek or swallowed an entire light bulb,\
    \ something no kind of AI could solve."
