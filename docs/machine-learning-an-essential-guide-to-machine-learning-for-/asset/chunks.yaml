    \ and wait a couple decades. They will scan the surface, mine it for materials\
    \ and multiply, just like a living organism would, creating shelters, roads, and\
    \ mapping the environment for the initial wave of settlers who now have solid\
    \ chances of making it. \n\nVon Neumann also considered the idea of self-replicating\
    \ space probes that could study, guide or destroy the evolution of alien lifeforms\
    \ to suit the needs of humanity, which inspired Arthur Clarke to write his “2001:\
    \ A Space Odyssey” wherein a black monolith helps primates ascend to humans and\
    \ then “star children” (that’s why the closing scene depicts a baby floating in\
