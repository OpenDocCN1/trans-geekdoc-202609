    # Machine learning is an iterative science


    Machine learning is an iterative science thanks to the capability of any given
    computer to run through a program thousands of times in a single day, slightly
    changing with each new pass until the result is measurably better. If that sounds
    like the evolution of living things, it’s because that’s exactly what it is. In
    theory, a program that’s taught how to self-learn and is then left on its own
    will become exponentially smarter, quickly surpassing animal and human intelligence.
    It’s at this point that we find ourselves falling down the rabbit hole: do we
    have the right to edit or kill such a program? Does it have human rights and free
    will or is it bound to the will of its creator? Can it feel pain? Would it try
    to usurp our place? Will it become conscious?


    ## Chapter 2 – What’s the point of machine learning?


    It’s a typically human thing to try something new and get hurt in all sorts of
    hilarious ways, like touching a hot stove. We do these things because we’re ultimately
    driven by curiosity: the unyielding need to know, feel and experience. We want
    to know what will happen when we touch the hot stove and the pain we felt made
    us pull our hand back, teaching us something about how the world works. The minor
    burn will eventually fade away but the experience will stay, just like in a video
    game. In the meantime you’d better get some ointment.


    Thanks to our body and the way it provides feedback, our brain will experience
    a constantly changing environment that will have it adapt and learn new skills,
    such as cooking, skiing and confidently walking a dog, driven by that same curiosity
    that made us touch a hot stove. Later on we might even connect the dots and figure
    out that the sun, a candle and a torch sear just the same merely based on us having
    touched a hot stove. These abilities of curiosity, error correction and understanding
    abstract concepts seem to be rooted in the biology of all living things and is
    what brought our civilization to this stage. But could a computer be made to learn
    the same abilities?


    Trying to answer this simple question is what’s been powering programmers and
    scientists for several decades to come up with better smartphones, sturdier cameras
    and lighter drones. No matter where we are, these three devices are all around
    us in some form: a personal assistant we can carry in the pocket, a powerful recording
    device that sits in the palm of the hand and a programmable machine that does
    work on its own but can also be controlled remotely. Bit by bit, we gave our stupid
    machines the ability to think, see and move, taking care of the most mundane tasks
    we do. But now they’re also starting to get smarter.


    ## Chapter 3 – A world with no updates


    As many proud Windows 10 users can confirm, we live in a world of constant, life-changing
    updates. Our software is now “evergreen” – always downloading, installing and
    refreshing itself behind the scenes. Once an operating system goes evergreen,
    programs working on it must follow to avoid compatibility issues, so now our Chrome
    and Firefox also start wasting our time, bandwidth and disk space by constantly
    updating. Nothing really works anymore, but it’s going to as soon as the update
    completes.


    Software we’re using is made through static programming, where a team of smart
    dudes lock themselves in a room and hammer out lines of code, package them into
    files and organize everything into a neat package. This is the old school way
    of programming and it’s being stretched to its absolute limits. The biggest threat
    are hackers who can instantly find flaws in the code and exploit them to steal
    private data: credit card numbers, login information and message content. What’s
    the best way to thwart hackers? Of course, with even more updates that don’t necessarily
    bring new features but are meant to simply keep the code flowing, turning users
    into unpaid testers of shoddy features.


    Other villains just want to watch the spinner turn, so they create viruses that
    inject themselves into files to wreak havoc. That’s another problem with static
    programming – changing just one bit in computer code ruins the entire thing and
    the program might fail catastrophically, like if a human got out of the bed on
    the wrong foot and the house instantly collapsed. If we now imagine a piece of
    software that has to deal with millions of users all over the globe and thousands
    of changing variables (like Windows 10), static programming means we’ll soon need
    an army of programmers fixing bugs and constantly tweaking the instructions to
    get a reliably working computer.


    Unless the worldwide product or service is a smash hit or we have millions of
    dollars to power through its growing pains, it’s never going to return a profit.
    But what if we could give a computer curiosity, error correction and understanding
    of abstract concepts to make it “smarter” and let it run on its own? Would it
    be possible to actually get a piece of software that required minimal programming
    and maintenance yet paid itself off in spades? This is the quadrillion dollar
    question and what all tech companies have been working on for decades. This is
    why machine learning is becoming such a big deal.


    ## Chapter 4 – History of machine learning


    There is a rich history of humans trying to make machines that can think for themselves
    or at least put forward dazzling displays of human-like thinking. The Mechanical
    Turk, made by Wolfgang von Kempelen in 1770 and destroyed in a fire in 1840, is
    probably the most famous example. It was comprised of a mannequin seated at a
    4x3x2 foot cabinet and a chess table on top, with the entire display being one
    solid whole (the mannequin couldn’t be separated from the table) that could roll
    around on wheels. The cabinet’s door could be opened, showing a great mass of
    cogs and wiring going every which way, and the inventor would always allow the
    spectators to peek into the interior of the machine before a chess match at a
    distance, shining from the back with a candle to convince them there’s nobody
    inside.


    The Turk would first appear at an Austrian palace, aggressively beating all challengers
    and later touring European cities to great amazement. Its inventor didn’t appreciate
    the attention it got and reluctantly displayed it, claiming it was one of his
    lesser inventions. The Turk always played white pieces but was a fairly strong
    chess player, managing to impress Benjamin Franklin and beating Napoleon Bonaparte.
    The legend says Napoleon tried cheating by making an illegal move, which the Turk
    would punish by returning the piece where it started and making its own move.
    Napoleon kept repeating the same illegal move until the Turk knocked all the pieces
    off the board, at which point Napoleon played a regular match, losing in 19 moves.
    Another story goes that Napoleon tied a scarf around the mannequin’s head to stop
    it from seeing but it beat him nonetheless.


    The Turk would change several owners, tour the UK, and offer the opponents a handicap
    (Turk played with one pawn less). It would go to the United States too, where
    Edgar Allan Poe wrote a lengthy report on it[^1] and its secrets, “It is quite
    certain that the operations of the Automaton are regulated by mind, and by nothing
    else. Indeed this matter is susceptible of a mathematical demonstration, a priori.
    The only question then is of the manner in which human agency is brought to bear.”
    He also added, “The Automaton does not invariably win the game. Were the machine
    a pure machine this would not be the case — it would always win. The principle
    being discovered by which a machine can be made to play a game of chess, an extension
    of the same principle would enable it to win a game — a farther extension would
    enable it to win all games — that is, to beat any possible game of an antagonist.”
    Was the Mechanical Turk the very first intelligent machine or just an elaborate
    parlor trick?


    [^1]: [part0000_split_025.html#_ftn1]

