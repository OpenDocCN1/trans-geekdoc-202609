  \\ \\end{aligned}\n```\n\n(6.50)\n\n以及\n\n```\n\\begin{aligned} {\\mu(\\theta_{1},\\\
  ldots,\\theta_{s}) = {\\sum\\limits_{l = 1}^{s}{\\widetilde{q}}_{l}}} & {\\exp(\
  \ - \\theta_{l}Z_{l}),\\quad\\nu_{j}(\\theta_{j}) = {\\widetilde{q}}_{j}Z_{j}\\\
  exp( - \\theta_{j}Z_{j}),} \\\\ & {\\text{\\quad\\quad}j = \\overline{1,s}.} \\\\\
  \ \\end{aligned}\n```\n\n(6.51)\n\n利用这些记号，经验平衡约束可写为\n\n```\n\\begin{array}{r} {{\\\
  sum\\limits_{h = 1}^{R}\\frac{\\psi_{j}^{(h)}(\\theta_{1},\\ldots,\\theta_{s})}{\\\
  varphi^{(h)}(\\theta_{1},\\ldots,\\theta_{s})}} + \\frac{\\nu_{j}(\\theta_{j})}{\\\
  mu(\\theta_{1},\\ldots,\\theta_{s})} + S\\lbrack j\\rbrack = 0,\\text{\\quad\\quad}j\
  \ = \\overline{1,s}.} \\\\ \\end{array}\n```\n\n(6.52)\n\n## 2. 区间型归属概率\n\nRPM-QuaRand\
  \ 模型的熵最优估计问题可利用广义玻尔兹曼信息熵 (6.16–6.18) 提出。这种估计问题的形式涉及比前一种更多的约束条件（其中一些为不等式）。因此它进入了有限维数学规划问题的范畴，最优性条件由\
  \ Kuhn–Tucker 定理 \\[134\\] 定义。\n\n如果我们使用广义费米信息熵 (6.1.2) 作为目标函数，则可以显著简化熵最优估计问题的求解过程。模型参数和测量噪声的归属概率的区间性质被嵌入到熵函数中，这使得估计问题成为一个约束优化问题。与之前一样，最优性条件可利用拉格朗日乘子法推导得出。\n\
  \n问题 (6.21, 6.22) 的拉格朗日函数形式为\n\n```\n\\begin{array}{r} {L_{F} = H_{F}(P,Q) + {\\\
  sum\\limits_{j = 1}^{s}\\theta^{(j)}}\\left( {y\\lbrack j\\rbrack - \\hat{s}\\lbrack\
  \ j\\rbrack - {\\sum\\limits_{h = 1}^{R}{\\sum\\limits_{i = 1}^{V_{h}}p_{i}^{(h)}}}z_{i}^{(h)}\\\
  lbrack j\\rbrack + \\zeta_{j}^{-} + Z_{j}q_{j}} \\right).} \\\\ \\end{array}\n```\n\
  \n(6.53)\n\n一阶最优性条件由不等式组给出\n\n```\n\\begin{aligned} \\frac{\\partial L}{\\partial\
  \ p_{i}^{(h)}} & {= \\ln\\, p_{i}^{(0,h)}\\frac{1 - p_{i}^{(h)}}{p_{i}^{(h)}} -\
  \ {\\sum\\limits_{j = 1}^{s}\\theta_{j}}z_{i}^{(h)}\\lbrack j\\rbrack,} \\\\ h &\
  \ {= \\overline{1,R},\\, i = \\overline{1,V_{h}};} \\\\ \\end{aligned}\n```\n\n\
  (6.54)\n\n```\n\\begin{array}{r} {\\frac{\\partial L}{\\partial q_{j}} = \\ln\\\
  , q_{j}^{0}\\frac{1 - q_{j}}{q_{j}} - \\theta_{j}Z_{j} = 0,\\text{\\quad\\quad}j\
  \ = \\overline{1,s}.} \\\\ \\end{array}\n```\n\n(6.55)\n\n然后，由拉格朗日乘子参数化的模型参数和测量噪声的熵最优归属概率具有如下形式\n\
  \n```\n\\begin{aligned} p_{i}^{(h),*} & {= \\frac{p_{i}^{(h,0)}}{p_{i}^{(h,0)} +\
  \ \\exp\\left( {{\\sum\\limits_{j = 1}^{s}\\theta_{j}}z_{i}^{(h)}\\lbrack j\\rbrack}\
  \ \\right)},} \\\\ h & {= \\overline{1,R},\\quad i = \\overline{1,V_{h}},} \\\\\
  \ q_{j}^{*} & {= \\frac{q_{j}^{0}}{q_{j}^{0} + \\exp(\\theta_{j}Z_{j})},\\text{\\\
  quad\\quad}j = \\overline{1,s}.} \\\\ \\end{aligned}\n```\n\n(6.56)\n\n显然，熵最优归属概率位于单位区间内。为求拉格朗日乘子，将表达式\
  \ (6.56) 代入经验平衡约束 (6.22)。与前一种情况类似，引入以下记号：\n\n```\n\\begin{aligned} {S\\lbrack j\\\
  rbrack} & {= \\hat{s}\\lbrack j\\rbrack + \\zeta_{j}^{-} - y\\lbrack j\\rbrack,}\
  \ \\\\ {\\varphi_{j}(\\theta_{j})} & {= Z_{j}\\frac{q_{j}^{0}}{q_{j}^{0} + \\exp(\\\
  theta_{j}Z_{j}},} \\\\ {\\psi_{j}^{(h)}(\\theta_{1},\\ldots,\\theta_{s})} & {= {\\\
  sum\\limits_{i = 1}^{V_{h}}\\frac{p_{i}^{(h,0)}}{p_{i}^{(h,0)} + \\exp\\left( {{\\\
  sum\\limits_{l = 1}^{s}\\theta_{l}}z_{i}^{(h)}\\lbrack l\\rbrack} \\right)}}.} \\\
  \\ \\end{aligned}\n```\n\n(6.57)\n\n然后经验平衡方程可写为\n\n```\n\\begin{array}{r} {{\\sum\\\
  limits_{h = 1}^{R}\\psi_{j}^{(h)}}( \\theta_{1},\\ldots,\\theta_{s}) + \\varphi_{j}(\\\
  theta_{j}) + S\\lbrack j\\rbrack = 0,\\text{\\quad\\quad}j = \\overline{1,s}.} \\\
  \\ \\end{array}\n```\n\n(6.58)\n\n方程 (6.52, 6.58) 的左端包含严格单调递减函数，这保证了唯一解的存在性。 （这一事实的证明留给感兴趣的读者）。\
  \ 第 7 章 下面描述了解决此类乘性方程的算法。\n\n# 第 7 章 随机化机器学习的计算方法\n\nDOI: [10.1201/9781003306566-7](https://doi.org/10.1201/9781003306566-7)\n\
  \n广义随机化机器学习问题以函数熵-线性规划的形式表述，这使我们能够得到由拉格朗日乘子参数化的最优解结构。为了计算它们的值，我们必须求解具有所谓的带参数积分分量的非标准非线性方程，只能数值求得。因此，不可能从解析上估计计算过程的重要参数，如\
  \ Lipschitz 常数、Hölder 常数、光滑度等。为求解这些方程，我们的思路是将随机化方法扩展到用于求解 RML 问题的计算算法。随机化方法本身早已被提出并反复使用；参见\
  \ \\[135\\]。然而，随机化问题导向算法的主要特性在实现过程中产生。以下，我们将基于“分组”蒙特卡洛模拟开发求解经验平衡方程和计算多维积分的算法，该模拟使用异构结构计算辅助工具实现。\n\
  \nRML 问题的一个重要特殊类包括具有归属概率和线性模型的机器学习问题。对于此类问题，可以得到由拉格朗日乘子参数化的最优解的结构表示。所得平衡约束具有非线性形式，但不含积分分量。为求解这些方程，将采用乘性算法\
  \ \\[140, 142\\]。\n\n## 7.1 RML 和 ML 过程中的平衡方程类\n\n在 第 4 章 和 第 5 章 中，我们已为 RPM-Orig、RPM-Rel\
  \ 和 RPM-CauRand 模型推导出经验平衡方程，其中变量的角色由拉格朗日乘子扮演。对这些方程的分析（更具体地说，对构成其分量的函数）使我们能够分离出两类非线性方程以供进一步研究。\n\
  \n### 1. 具有积分分量的方程\n\n\n\n\n\n该类方程出现在 RML 过程的 RPM-Orig 和 RPM-Rel 模型中（5.74–5.76）。请注意，所考虑的方程包含由拉格朗日乘子参数化的定积分多维积分。例如，对于具有原始参数的\
  \ RPM（RPM-Orig），积分分量具有形式\n\n$$\\\\begin{array}{r} {\\\\mathbb{M}\\_{j}(\\\\theta)\
  \ - \\\\mathbf{y}^{(j)} = 0,\\\\text{\\\\quad\\\\quad}j = \\\\overline{1,s},} \\\
