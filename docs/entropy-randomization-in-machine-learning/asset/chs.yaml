  mu,j}} & {= {\\\\sum\\\\limits_{\\\\nu = 1}^{s}q_{\\\\nu,\\\\mu}}u_{i,\\\\nu},\\\
  \\text{\\\\quad\\\\quad}\\\\mu = \\\\overline{1,r};} \\\\\\\\ i & {= \\\\overline{1,m},\\\
  \\quad j = \\\\overline{1,s}.} \\\\\\\\ \\\\end{aligned}$$  \n\n(3.36)\n\n对矩阵 `Q`\
  \ 和 `T` 进行 *向量化*（参见 [115]) 以得到相应的向量 `q` 和 `t`。用 `∇Q` 表示信息交叉熵泛函 `H(Q,T | U)` 的梯度，其分量为\
  \ (3.2.2)，用 `∇T` 表示信息交叉熵泛函 `H(Q,T | U)` 的梯度，其分量为 (3.33–3.36)。\n\n算法 `max H[1]` 具有以下结构。\n\
  \n* *a). 初始步骤：*\n\n$$\\\\begin{array}{r} {\\\\mathbf{q}^{0} > \\\\mathbf{0},\\\\\
  quad\\\\mathbf{t}^{0} > \\\\mathbf{0}.} \\\\\\\\ \\\\end{array}$$\n\n* *b). 第 n\
  \ 次迭代步骤：*\n\n$$\\\\begin{array}{r} {X^{n} = U\\\\, Q^{n}\\\\, T^{n},} \\\\\\\\ \\\
  \\end{array}$$\n\n$$\\\\begin{array}{r} \\\\left. H(Q^{n},T^{n}\\\\, \\\\middle|\
  \ \\\\, U) = {\\\\sum\\\\limits_{i = 1}^{m}{\\\\sum\\\\limits_{j = 1}^{r}x_{ij}^{n}}}\\\
  \\ln\\\\frac{x_{ij}^{n}}{u_{ij}} = H^{n}; \\\\right. \\\\\\\\ \\\\end{array}$$\n\
  \n$$\\\\begin{array}{r} {\\\\mathbf{q}^{(n + 1)} = \\\\left\\\\{ \\\\begin{array}{r}\
  \ {\\\\mathbf{q}^{n} + \\\\gamma_{\\\\mathbf{q}}\\\\nabla_{Q}(\\\\mathbf{q}^{n},\\\
  \\mathbf{t}^{n})\\\\text{if}\\\\,\\\\mathbf{q}^{(n + 1)} \\\\geq \\\\mathbf{0},}\
  \ \\\\\\\\ {\\\\mathbf{q}^{n}\\\\text{if}\\\\,\\\\mathbf{q}^{(n + 1)} < \\\\mathbf{0};}\
  \ \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r}\
  \ \\\\left. \\\\text{\\\\quad\\\\quad}\\\\mathbf{q}^{(n + 1)}\\\\Rightarrow Q^{(n\
  \ + 1)}; \\\\right. \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} {\\\\mathbf{t}^{(n\
  \ + 1)} = \\\\left\\\\{ \\\\begin{array}{r} {\\\\mathbf{t}^{n} + \\\\gamma_{\\\\\
  mathbf{t}}\\\\nabla_{T}(\\\\mathbf{q}^{n},\\\\mathbf{t}^{n})\\\\text{if}\\\\,\\\\\
  mathbf{t} \\\\geq \\\\mathbf{0},} \\\\\\\\ {\\\\mathbf{t}^{n}\\\\text{if}\\\\,\\\
  \\mathbf{t}^{(n + 1)} < \\\\mathbf{0}.} \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\
  \\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} \\\\left. \\\\text{\\\\quad\\\\quad}\\\
  \\mathbf{t}^{(n + 1)}\\\\Rightarrow T^{(n + 1)}; \\\\right. \\\\\\\\ \\\\end{array}$$\n\
  \n$$\\\\begin{array}{r} {X^{(n + 1)} = U\\\\, Q^{(n + 1)}\\\\, T^{(n + 1)};} \\\\\
  \\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} \\\\left. H(Q^{(n + 1)},T^{(n + 1)}\\\
  \\, \\\\middle| \\\\, U) = {\\\\sum\\\\limits_{i = 1}^{m}{\\\\sum\\\\limits_{j =\
  \ 1}^{r}x_{ij}^{(n + 1)}}}\\\\ln\\\\frac{x_{ij}^{(n + 1)}}{u_{ij}} = H^{(n + 1)}.\
  \ \\\\right. \\\\\\\\ \\\\end{array}$$\n\n* *c). 停止条件：*\n\n$$\\\\begin{array}{r}\
  \ {\\\\text{If}\\\\,\\\\, H^{(n + 1)} - H^{(n)} \\\\leq \\\\delta,\\\\,\\\\text{then}\\\
  \\, STOP.} \\\\\\\\ \\\\end{array}$$\n\n### 3.2.2 信息交叉熵泛函的近似\n\n在某些情况下，缩减矩阵 `Q`\
  \ 的元素可通过在点 `x[0] = a` 邻域内对数函数的近似以足够精度确定，其中 `a ≥ a[min]`：\n\n$$\\\\begin{array}{r}\
  \ {\\\\ln x < \\\\ln a + \\\\frac{1}{a_{min}}(x - a).} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(3.37)\n\n对于 `a = x[ij]`，该公式给出信息交叉熵泛函的以下近似表达式：\n\n$$\\\\begin{aligned} \\\
  \\left. H_{1}(Q,T\\\\, \\\\middle| \\\\, U) \\\\approx \\\\sum_{i = 1}^{s}\\\\sum_{j\
  \ = 1}^{m} \\\\right. & {\\\\left\\\\lbrack x_{ij}^{2}(Q,T\\\\, \\\\middle| \\\\\
  , U) - x_{ij}(Q,T\\\\, \\\\middle| \\\\, U)u_{ij} \\\\right\\\\rbrack =} \\\\\\\\\
  \ & \\\\left. \\\\widetilde{H}(Q,T\\\\, \\\\middle| \\\\, U). \\\\right. \\\\\\\\\
  \ \\\\end{aligned}$$  \n\n(3.38)\n\n该等式可写成矩阵形式\n\n![](img/math3_159.jpg)\n\n其中 ⌈`A`,\
  \ `B`⌋ 表示 Frobenius 内积 [115]，\n\n![](img/math3_161.jpg)\n\n矩阵 `Q` 和 `T` 的元素将在固定数据矩阵\
  \ `U` 下，在所有非负矩阵 `Q` 和 `T` 的集合上最小化泛函 `H̃1`，即\n\n$$\\\\begin{array}{r} \\\\left. ({\\\
  \\widetilde{Q}}^{*},{\\\\widetilde{T}}^{*}) = \\\\arg\\\\min_{(Q,T) \\\\geq 0}{\\\
  \\widetilde{H}}_{1}(Q,T\\\\, \\\\middle| \\\\, U). \\\\right. \\\\\\\\ \\\\end{array}$$\
  \  \n\n(3.41)\n\n该问题通过涉及泛函 `H̃1` 对矩阵 `Q` 和 `T` 的梯度分量的算法求解。\n\n利用上述矩阵微分规则，推导出泛函 `H̃1`\
  \ (3.41) 的梯度的以下表达式：\n\n$$\\\\begin{array}{r} {\\\\bigtriangleup_{Q}(Q,T) = \\\\\
  frac{\\\\left. \\\\partial{\\\\widetilde{H}}_{1}(Q,T\\\\, \\\\middle| \\\\, U) \\\
  \\right.}{\\\\partial X}\\\\frac{\\\\partial X}{\\\\partial Q} = 2TPQT - TP,} \\\
  \\\\\\ \\\\end{array}$$  \n\n(3.42)\n\n$$\\\\begin{array}{r} {\\\\bigtriangleup_{T}(Q,T)\
  \ = \\\\frac{\\\\left. \\\\partial{\\\\widetilde{H}}_{1}(Q,T\\\\, \\\\middle| \\\
  \\, U) \\\\right.}{\\\\partial X}\\\\frac{\\\\partial X}{\\\\partial T} = 2Q^{\\\
  \\intercal}PQT - Q^{\\\\intercal}P,} \\\\\\\\ \\\\end{array}$$  \n\n(3.43)\n\n其中\
  \ `P = X X^⊺` 且 `△Q` 和 `△T` 分别表示对矩阵 `Q` 和 `T` 的梯度。根据 (3.42, 3.43)，函数 `H̃(Q,T | U)`\
  \ 对矩阵 `Q` 和 `T` 的梯度是维度为 (`s × r`) 的矩阵。\n\n为最大化泛函 `H̃1`，应用带非负性检查的梯度下降法，其中对矩阵 `U`\
  \ 和 `T` 进行非负性检查。\n\n算法 `max H̃[1]` 具有以下结构。\n\n* *a) 初始步骤：*\n\n$$\\\\begin{array}{r}\
  \ {T^{0} > 0,\\\\quad Q^{0} > 0.} \\\\\\\\ \\\\end{array}$$\n\n* *b) 第 n 次迭代步骤：*\n\
  \n\n\n\n\n$$\\\\begin{array}{r} {X^{n} = U\\\\, Q^{n}\\\\, T^{n},} \\\\\\\\ \\\\\
  end{array}$$  \n\n$$\\\\begin{array}{r} \\\\left. H(Q^{n},T^{n}\\\\, \\\\middle|\
  \ \\\\, U) = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\_{j = 1}^{r}x\\\
  _{ij}^{n}}}\\\\ln\\\\frac{x\\_{ij}^{n}}{u\\_{ij}} = H^{n}; \\\\right. \\\\\\\\ \\\
  \\end{array}$$  \n\n$$\\\\begin{array}{r} {Q^{(n + 1)} = \\\\left\\\\{ \\\\begin{aligned}\
  \ \\\\left. Q^{n} + \\\\gamma\\_{Q} \\\\bigtriangleup\\_{Q}(\\\\widetilde{H}(Q^{n},T^{n}\\\
  \\, \\\\middle| \\\\, U) \\\\geq 0 \\\\right. & {\\\\text{if~}Q^{(n + 1)} \\\\geq\
  \ 0,} \\\\\\\\ Q^{n} & {\\\\text{if~}Q^{(n + 1)} < 0;} \\\\\\\\ \\\\end{aligned}~\
  \ \\\\right.} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r} {T^{(n + 1)}\
  \ = \\\\left\\\\{ \\\\begin{aligned} \\\\left. T^{n} + \\\\gamma\\_{T} \\\\bigtriangleup\\\
  _{T}(\\\\widetilde{H}(Q^{n},T^{n}\\\\, \\\\middle| \\\\, U) \\\\geq 0 \\\\right.\
  \ & {\\\\text{if~}T^{(n + 1)} \\\\geq 0,} \\\\\\\\ T^{n} & {\\\\text{if~}T^{(n +\
  \ 1)} < 0;} \\\\\\\\ \\\\end{aligned}~ \\\\right.} \\\\\\\\ \\\\end{array}$$  \n\
  \n$$\\\\begin{array}{r} {X^{(n + 1)} = U\\\\, Q^{(n + 1)}\\\\, T^{(n + 1)};} \\\\\
  \\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r} \\\\left. H(Q^{(n + 1)},T^{(n +\
  \ 1)}\\\\, \\\\middle| \\\\, U) = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\\
  _{j = 1}^{r}x\\_{ij}^{(n + 1)}}}\\\\ln\\\\frac{x\\_{ij}^{(n + 1)}}{u\\_{ij}} = H^{(n\
  \ + 1)}. \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n*c) 停止条件：*\n\n$$\\\\begin{array}{r}\
  \ {\\\\text{If}\\\\,\\\\, H^{(n + 1)} - H^{n} \\\\leq \\\\delta,\\\\,\\\\,\\\\text{then}\\\
  \\, STOP.} \\\\\\\\ \\\\end{array}$$  \n\n算法 **max *H*[1]** 或 **max *H̃*[1]** 给出熵最优的投影矩阵\
  \ `Q`((*s* × *r*) )^(*). 因此，可以确定矩阵 `Y`((*m* × *r*) )^(*) (1.5) 以传递到矩阵 `U` 的压缩过程的第二阶段，该过程由投影矩阵\
  \ `B`((*n* × *m*)) 和 `A`((*m* × *n*)) 刻画。\n\n非负矩阵 `B` 和 `A` 的最优元素由下式给出\n\n$$\\\\\
  begin{array}{r} \\\\left. (B^{\\*},A^{\\*}) = \\\\arg\\\\max\\_{(B,A) \\\\geq 0}H\\\
  _{2}(B,A\\\\, \\\\middle| \\\\, Y^{\\*}). \\\\right. \\\\\\\\ \\\\end{array}$$ \
  \ \n\n(3.44)\n\n与第一阶段类似，该问题将使用基于投影梯度下降的迭代算法求解（梯度下降与所有负元素截断的组合）。\n\n函数 `H2` 相对于矩阵\
  \ `B` 和 `A` 的元素的梯度具有分量\n\n$$\\\\begin{aligned} \\\\frac{\\\\left. \\\\partial H\\\
  _{2}(B,A\\\\, \\\\middle| \\\\, Y^{\\*}) \\\\right.}{\\\\partial a\\_{i,\\\\beta}}\
  \ & {= {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\_{j = 1}^{r}\\\\frac{\\\
  \\left. \\\\partial s\\_{ij}(B,A\\\\, \\\\middle| \\\\, Y^{\\*}) \\\\right.}{\\\\\
  partial g\\_{ij}}}}\\\\frac{\\\\left. \\\\partial g\\_{ij}(B,A\\\\, \\\\middle|\
  \ \\\\, Y^{\\*}) \\\\right.}{\\\\partial a\\_{i,\\\\beta}},} \\\\\\\\ & {\\\\quad\
  \ i = \\\\overline{1,n},\\\\, j = \\\\overline{1,r},\\\\,\\\\beta = \\\\overline{1,n},}\
  \ \\\\\\\\ \\\\end{aligned}$$  \n\n(3.45)\n\n$$\\\\begin{aligned} \\\\frac{\\\\\
  left. \\\\partial H\\_{2}(B,A\\\\, \\\\middle| \\\\, Y^{\\*}) \\\\right.}{\\\\partial\
  \ b\\_{\\\\beta,\\\\alpha}} & {= {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\\
  _{j = 1}^{r}\\\\frac{\\\\left. \\\\partial s\\_{ij}(B,A\\\\, \\\\middle| \\\\, Y^{\\\
  *}) \\\\right.}{\\\\partial g\\_{ij}}}}\\\\frac{\\\\left. \\\\partial g\\_{ij}(B,A\\\
  \\, \\\\middle| \\\\, Y^{\\*}) \\\\right.}{\\\\partial b\\_{\\\\beta,\\\\alpha}},}\
  \ \\\\\\\\ {i =} & {\\\\overline{1,n},\\\\, j = \\\\overline{1,r},\\\\,\\\\beta\
  \ = \\\\overline{1,n},\\\\,\\\\alpha = \\\\overline{1,m},} \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(3.46)\n\n其中\n\n$$\\\\begin{array}{r} {\\\\frac{\\\\left. \\\\partial s\\\
  _{ij}(B,A\\\\, \\\\middle| \\\\, Y^{\\*}) \\\\right.}{\\\\partial g\\_{ij}} = \\\
  \\ln\\\\frac{g\\_{ij}}{y\\_{ij}^{\\*}} + 1,\\\\text{\\\\quad\\\\quad}i = \\\\overline{1,n},\\\
  \\, j = \\\\overline{1,r};} \\\\\\\\ \\\\end{array}$$  \n\n(3.47)\n\n$$\\\\begin{aligned}\
  \ \\\\frac{\\\\left. \\\\partial g\\_{ij}((B,A\\\\, \\\\middle| \\\\, Y^{\\*}))\
  \ \\\\right.}{\\\\partial a\\_{i,\\\\beta}} & {= {\\\\sum\\\\limits\\_{\\\\alpha\
  \ = 1}^{m}b\\_{\\\\beta,\\\\alpha}}y\\_{\\\\alpha,j}^{\\*},\\\\text{\\\\quad\\\\\
  quad}\\\\beta = \\\\overline{1,n};} \\\\\\\\ \\\\frac{\\\\left. \\\\partial g\\\
  _{ij}((B,A\\\\, \\\\middle| \\\\, Y^{\\*})) \\\\right.}{\\\\partial b\\_{\\\\beta,\\\
  \\alpha}} & {= a\\_{i,\\\\beta}y\\_{\\\\alpha,j}^{\\*},\\\\text{\\\\quad\\\\quad}\\\
  \\beta = \\\\overline{1,n},\\\\alpha = \\\\overline{1,m};} \\\\\\\\ i & {= \\\\\
  overline{1,m},\\\\quad j = \\\\overline{1,r}.} \\\\\\\\ \\\\end{aligned}$$  \n\n\
  (3.48)\n\n对矩阵 `B` 和 `A` 进行 *向量化*，并引入相应的向量 `b` 和 `a`。用 `∇B` 表示相对信息熵 `H2` 的梯度，其分量为\
  \ (3.46–3.48)，用 `∇A` 表示相对熵泛函 `H2` 的梯度，其分量为 (3.48)。\n\n算法 **max *H*[2]** 具有以下结构。\n\
  \n*a) 初始步骤：*\n\n$$\\\\begin{array}{r} {\\\\mathbf{b}^{0} > \\\\mathbf{0},\\\\quad\\\
  \\mathbf{a}^{0} > \\\\mathbf{0}.} \\\\\\\\ \\\\end{array}$$  \n\n*b) 第 n 次迭代步骤：*\n\
  \n$$\\\\begin{array}{r} {G^{n} = A^{n}B^{n}Y^{\\*},} \\\\\\\\ \\\\end{array}$$ \
  \ \n\n$$\\\\begin{array}{r} \\\\left. H(B^{n},A^{n}\\\\, \\\\middle| \\\\, Y^{\\\
  *}) = {\\\\sum\\\\limits\\_{i = 1}^{n}{\\\\sum\\\\limits\\_{j = 1}^{r}g\\_{ij}^{n}}}\\\
  \\ln\\\\frac{g\\_{ij}^{n}}{y\\_{ij}^{\\*}} = H^{n}; \\\\right. \\\\\\\\ \\\\end{array}$$\
  \  \n\n$$\\\\begin{array}{r} {\\\\mathbf{b}^{(n + 1)} = \\\\left\\\\{ \\\\begin{array}{r}\
  \ {\\\\mathbf{b}^{n} + \\\\gamma\\_{\\\\mathbf{b}}\\\\nabla\\_{B}(\\\\mathbf{b}^{n},\\\
  \\mathbf{a}^{n})\\\\text{if}\\\\,\\\\mathbf{b}^{(n + 1)} \\\\geq \\\\mathbf{0},}\
  \ \\\\\\\\ {\\\\mathbf{b}^{n}\\\\text{if}\\\\,\\\\mathbf{b}^{(n + 1)} < \\\\mathbf{0};}\
  \ \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r}\
  \ \\\\left. \\\\text{\\\\quad\\\\quad}\\\\mathbf{b}^{(n + 1)}\\\\Rightarrow Q^{(n\
  \ + 1)}; \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r} {\\\\mathbf{a}^{(n\
  \ + 1)} = \\\\left\\\\{ \\\\begin{array}{r} {\\\\mathbf{a}^{n} + \\\\gamma\\_{\\\
  \\mathbf{a}}\\\\nabla\\_{A}(\\\\mathbf{b}^{n},\\\\mathbf{a}^{n})\\\\text{if}\\\\\
  ,\\\\mathbf{a} \\\\geq \\\\mathbf{0},} \\\\\\\\ {\\\\mathbf{a}^{n}\\\\text{if}\\\
  \\,\\\\mathbf{a}^{(n + 1)} < \\\\mathbf{0};} \\\\\\\\ \\\\end{array}~ \\\\right.}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r} \\\\left. \\\\text{\\\\quad\\\
  \\quad}\\\\mathbf{a}^{(n + 1)}\\\\Rightarrow A^{(n + 1)}; \\\\right. \\\\\\\\ \\\
  \\end{array}$$  \n\n$$\\\\begin{array}{r} {G^{(n + 1)} = A^{(n + 1)}B^{(n + 1)}Y^{\\\
  *};} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r} \\\\left. H(B^{(n + 1)},A^{(n\
  \ + 1)}\\\\, \\\\middle| \\\\, Y^{\\*}) = {\\\\sum\\\\limits\\_{i = 1}^{n}{\\\\\
  sum\\\\limits\\_{j = 1}^{r}g\\_{ij}^{(n + 1)}}}\\\\ln\\\\frac{g\\_{ij}^{(n + 1)}}{y\\\
  _{ij}^{\\*}} = H^{(n + 1)}. \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n*c) 停止条件：*\n\
  \n$$\\\\begin{array}{r} {\\\\text{If}\\\\,\\\\, H^{(n + 1)} - H^{(n)} \\\\leq \\\
  \\delta,\\\\,\\\\,\\\\text{then}\\\\, STOP.} \\\\\\\\ \\\\end{array}$$  \n\n## 3.3\
  \ 并行过程的熵优化\n\n### 3.3.1 定义和结构\n\n直接-逆投影过程的并行实现导致矩阵等式\n\n$$\\\\begin{array}{r} {U\\\
  _{(m \\\\times s)}Q\\_{s \\\\times r} = Y\\_{(m \\\\times r)},\\\\quad B\\_{(n \\\
  \\times m)}Y\\_{(m \\\\times r)} = Z\\_{(n \\\\times r)},} \\\\\\\\ {Z\\_{(n \\\\\
  times r)}W\\_{(r \\\\times s)} = D\\_{(n \\\\times s)},\\\\quad E\\_{(m \\\\times\
  \ n)}D\\_{(n \\\\times s)} = X\\_{(m \\\\times s)}.} \\\\\\\\ \\\\end{array}$$ \
  \ \n\n(3.49)\n\n这些公式中的第一链，涉及用矩阵 `Q`((*s* × *r*)) 的直接投影和用矩阵 `B`((*n* × *m*)) 的逆投影，得出缩减矩阵\
  \ `Z`((*n* × *r*))。第二链，涉及用矩阵 `W`((*r* × *s*)) 的直接投影和用矩阵 `E`((*m* × *n*)) 的逆投影，得出矩阵\
  \ `X`((*m* × *s*))。\n\n由等式 (3.49) 可得\n\n$$\\\\begin{array}{r} {X\\_{(m \\\\times\
  \ s)} = E\\_{(m \\\\times n)}\\\\left\\\\{ {\\\\left\\\\lbrack {B\\_{(n \\\\times\
  \ m)}\\\\left( {U\\_{(m \\\\times s)}Q\\_{(s \\\\times r)}} \\\\right)} \\\\right\\\
  \\rbrack W\\_{(r \\\\times s)}} \\\\right\\\\}.} \\\\\\\\ \\\\end{array}$$  \n\n\
  (3.50)\n\n这里圆括号、方括号和花括号表示投影操作的顺序。矩阵 `X`((*m* × *s*)) 的元素具有形式\n\n\n\n\n\n$$\\\\begin{array}{r}\
  \ {x\\_{ij} = {\\\\sum\\\\limits\\_{\\\\mu = 1}^{n}e\\_{i,\\\\mu}}{\\\\sum\\\\limits\\\
  _{\\\\nu = 1}^{r}w\\_{\\\\nu,j}}{\\\\sum\\\\limits\\_{\\\\beta = 1}^{m}b\\_{\\\\\
  mu,\\\\beta}}{\\\\sum\\\\limits\\_{\\\\alpha = 1}^{s}u\\_{\\\\beta,\\\\alpha}}q\\\
  _{\\\\alpha,\\\\nu},\\\\text{\\\\quad\\\\quad}i = \\\\overline{1,m},\\\\, j = \\\
  \\overline{1,s}.} \\\\\\\\ \\\\end{array}$$\n\n(3.51)\n\n### 3.3.2 最优性条件与算法\n\n\
  为衡量变换后矩阵 `X`(*m* × *s*) 与原始矩阵 `U`(*m* × *s*) 的偏差，选择 *信息交叉熵*\n\n$$\\\\begin{array}{r}\
  \ \\\\left. \\\\mathcal{H}(X\\\\, \\\\middle| \\\\, U) = - {\\\\sum\\\\limits\\\
  _{i = 1}^{m}{\\\\sum\\\\limits\\_{j = 1}^{s}s\\_{ij}}}(X\\\\, \\\\middle| \\\\,\
  \ U), \\\\right. \\\\\\\\ \\\\end{array}$$\n\n(3.52)\n\n其中\n\n$$\\\\begin{array}{r}\
  \ {s\\_{ij} = x\\_{ij}\\\\ln\\\\frac{x\\_{ij}}{u\\_{ij}}.} \\\\\\\\ \\\\end{array}$$\n\
  \n(3.53)\n\n由于 (3.51)，信息交叉熵 (3.52) 是矩阵 (`Q`, `B`, `W`, `E`) ≥ 0 的标量函数，即\n\n$$\\\\\
  begin{array}{r} {\\\\mathcal{H} = \\\\mathcal{H}(Q,B,W,E).} \\\\\\\\ \\\\end{array}$$\n\
  \n(3.54)\n\n矩阵的最优元素通过最大化函数 `ℋ` 得到：\n\n$$\\\\begin{array}{r} {(Q^{\\*},B^{\\*},W^{\\\
  *},E^{\\*}) = \\\\arg\\\\max\\_{(Q,B,W,E) \\\\geq 0}\\\\mathcal{H}(Q,B,W,E).} \\\
  \\\\\\ \\\\end{array}$$\n\n(3.55)\n\n该问题将使用投影梯度下降的坐标式方案求解。\n\n在并行程序中，有一对矩阵 (`Q`,\
  \ `B`) 用于相对于第一个变量 (*r* < *s*) 降低原始矩阵 `U`，以及一对矩阵 (`W`, `E`) 用于相对于第二个变量 (*n* < *m*)\
  \ 压缩矩阵 `U`。坐标式投影梯度下降方案中的每个迭代步由两个子步组成，分别与 (`Q`, `B`)-梯度上的迭代和 (`W`, `E`)-梯度上的迭代相关。\n\
  \n根据 (3.51–3.53)，函数 `ℋ`(`Q`, `B`, `W`, `E`) 的梯度具有分量\n\n$$\\\\begin{array}{r} {\\\
  \\frac{\\\\partial\\\\mathcal{H}}{\\\\partial q\\_{\\\\alpha,\\\\nu}} = {\\\\sum\\\
  \\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\_{j = 1}^{s}\\\\frac{\\\\partial s\\_{ij}}{\\\
  \\partial x\\_{ij}}}}\\\\,\\\\frac{\\\\partial x\\_{ij}}{\\\\partial q\\_{\\\\alpha,\\\
  \\nu}},} \\\\\\\\ {\\\\frac{\\\\partial\\\\mathcal{H}}{\\\\partial b\\_{\\\\mu,\\\
  \\beta}} = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\_{j = 1}^{s}\\\\\
  frac{\\\\partial s\\_{ij}}{\\\\partial x\\_{ij}}}}\\\\,\\\\frac{\\\\partial x\\\
  _{ij}}{\\\\partial b\\_{\\\\mu,\\\\beta}},} \\\\\\\\ {\\\\frac{\\\\partial\\\\mathcal{H}}{\\\
  \\partial w\\_{\\\\nu,j}} = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\\
  _{j = 1}^{s}\\\\frac{\\\\partial s\\_{ij}}{\\\\partial x\\_{ij}}}}\\\\,\\\\frac{\\\
  \\partial x\\_{ij}}{\\\\partial w\\_{\\\\nu,j}},} \\\\\\\\ {\\\\frac{\\\\partial\\\
  \\mathcal{H}}{\\\\partial e\\_{i,\\\\mu}} = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\\
  sum\\\\limits\\_{j = 1}^{s}\\\\frac{\\\\partial s\\_{ij}}{\\\\partial x\\_{ij}}}}\\\
  \\,\\\\frac{\\\\partial x\\_{ij}}{\\\\partial e\\_{i,\\\\mu}},} \\\\\\\\ \\\\end{array}$$\n\
  \n(3.56)\n\n其中\n\n$$\\\\begin{aligned} & {\\\\frac{\\\\partial s\\_{ij}}{\\\\partial\
  \ x\\_{ij}} = \\\\ln\\\\frac{x\\_{ij}}{u\\_{ij}} + 1,} \\\\\\\\ & {\\\\frac{\\\\\
  partial x\\_{ij}}{\\\\partial q\\_{\\\\alpha,\\\\nu}} = w\\_{\\\\nu,j}{\\\\sum\\\
  \\limits\\_{\\\\mu = 1}^{n}e\\_{i,\\\\mu}}{\\\\sum\\\\limits\\_{\\\\beta = 1}^{m}b\\\
  _{\\\\mu,\\\\beta}}u\\_{\\\\beta,\\\\alpha},\\\\text{\\\\quad\\\\quad}\\\\alpha\
  \ = \\\\overline{1,s},\\\\,\\\\nu = \\\\overline{1,r};} \\\\\\\\ & {\\\\frac{\\\\\
  partial x\\_{ij}}{\\\\partial b\\_{\\\\mu,\\\\beta}} = e\\_{i,\\\\mu}{\\\\sum\\\\\
  limits\\_{\\\\nu = 1}^{r}w\\_{\\\\nu,j}}{\\\\sum\\\\limits\\_{\\\\alpha = 1}^{s}u\\\
  _{\\\\beta,\\\\alpha}}q\\_{\\\\alpha,\\\\nu},\\\\text{\\\\quad\\\\quad}\\\\mu =\
  \ \\\\overline{1,n},\\\\,\\\\beta = \\\\overline{1,s};} \\\\\\\\ & {\\\\frac{\\\\\
  partial x\\_{ij}}{\\\\partial w\\_{\\\\nu,j}} = {\\\\sum\\\\limits\\_{\\\\mu = 1}^{n}e\\\
  _{i,\\\\mu}}{\\\\sum\\\\limits\\_{\\\\beta = 1}^{m}b\\_{\\\\mu,\\\\beta}}{\\\\sum\\\
  \\limits\\_{\\\\alpha = 1}^{s}u\\_{\\\\beta,\\\\alpha}}q\\_{\\\\alpha,\\\\nu},}\
  \ \\\\\\\\ & {\\\\frac{\\\\partial x\\_{ij}}{\\\\partial e\\_{i,\\\\mu}} = {\\\\\
  sum\\\\limits\\_{\\\\nu = 1}^{r}w\\_{\\\\nu,j}}{\\\\sum\\\\limits\\_{\\\\beta =\
  \ 1}^{m}b\\_{\\\\mu,\\\\beta}}{\\\\sum\\\\limits\\_{\\\\alpha = 1}^{s}u\\_{\\\\\
  beta,\\\\alpha}}q\\_{\\\\alpha,\\\\nu},\\\\text{\\\\quad\\\\quad}\\\\mu = \\\\overline{1,n}.}\
  \ \\\\\\\\ \\\\end{aligned}$$\n\n(3.57)\n\n应用 *矩阵向量化*，过渡到相应的向量 `q`、`b`、`w` 和 `e`。用\
  \ `∇[q]`、`∇[b]`、`∇[w]` 和 `∇[e]` 表示相对于这些向量的梯度的分量。\n\n算法 `max ℋ` 具有以下结构。\n\n* *a)\
  \ 初始步：*\n\n$$\\\\begin{array}{r} {\\\\mathbf{q}^{0} > \\\\mathbf{0},\\\\quad\\\\\
  mathbf{b}^{0} > \\\\mathbf{0},\\\\quad\\\\mathbf{w}^{0} > 0,\\\\quad\\\\mathbf{e}^{0}\
  \ > 0.} \\\\\\\\ \\\\end{array}$$\n\n* *b) 第 n 次迭代步：*\n\n$$\\\\begin{array}{r} {X^{n}\
  \ = E^{n}\\\\left\\\\{ {\\\\left\\\\lbrack {B^{n}\\\\left( {UQ^{n}} \\\\right)}\
  \ \\\\right\\\\rbrack W^{n}} \\\\right\\\\},} \\\\\\\\ \\\\end{array}$$\n\n$$\\\\\
  begin{array}{r} {\\\\mathcal{H}^{n} = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\
  \\limits\\_{j = 1}^{s}x\\_{ij}^{n}}}\\\\ln\\\\frac{x\\_{ij}^{n}}{u\\_{ij}};} \\\\\
  \\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} {\\\\mathbf{q}^{(n + 1)} = \\\\left\\\
  \\{ \\\\begin{array}{r} {\\\\mathbf{q}^{n} + \\\\gamma\\_{\\\\mathbf{q}}\\\\nabla\\\
  _{\\\\mathbf{q}}(\\\\mathbf{q}^{n},\\\\mathbf{b}^{n},\\\\mathbf{w}^{n},\\\\mathbf{e}^{n})\\\
  \\,\\\\text{if}\\\\,\\\\mathbf{q} \\\\geq \\\\mathbf{0},} \\\\\\\\ {\\\\mathbf{q}^{n}\\\
  \\,\\\\text{if}\\\\,\\\\mathbf{q}^{(n + 1)} < \\\\mathbf{0};} \\\\\\\\ \\\\end{array}~\
  \ \\\\right.} \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} \\\\left. \\\\\
  text{\\\\quad\\\\quad}\\\\mathbf{q}^{(n + 1)}\\\\Rightarrow Q^{(n + 1)}; \\\\right.\
  \ \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} {\\\\mathbf{b}^{(n + 1)} =\
  \ \\\\left\\\\{ \\\\begin{array}{r} {\\\\mathbf{b}^{n} + \\\\gamma\\_{\\\\mathbf{b}}\\\
  \\nabla\\_{\\\\mathbf{b}}(\\\\mathbf{q}^{n},\\\\mathbf{b}^{n},\\\\mathbf{w}^{n},\\\
  \\mathbf{e}^{n})\\\\,\\\\text{if}\\\\,\\\\mathbf{b}^{(n + 1)} \\\\geq \\\\mathbf{0},}\
  \ \\\\\\\\ {\\\\mathbf{b}^{n}\\\\text{if}\\\\,\\\\mathbf{b}^{(n + 1)} < \\\\mathbf{0};}\
  \ \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r}\
  \ \\\\left. \\\\text{\\\\quad\\\\quad}\\\\mathbf{b}^{(n + 1)}\\\\Rightarrow B^{(n\
  \ + 1)}; \\\\right. \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} {\\\\mathbf{w}^{(n\
  \ + 1)} = \\\\left\\\\{ \\\\begin{array}{r} {\\\\mathbf{w}^{n} + \\\\gamma\\_{\\\
  \\mathbf{w}}\\\\nabla\\_{\\\\mathbf{w}}(\\\\mathbf{q}^{(n + 1)},\\\\mathbf{b}^{(n\
  \ + 1)},\\\\mathbf{w}^{n},\\\\mathbf{e}^{n})\\\\,\\\\text{if}\\\\,\\\\mathbf{w}\
  \ \\\\geq \\\\mathbf{0},} \\\\\\\\ {\\\\mathbf{w}^{n}\\\\text{if}\\\\,\\\\mathbf{w}^{(n\
  \ + 1)} < \\\\mathbf{0};} \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\\ \\\\end{array}$$\n\
  \n$$\\\\begin{array}{r} \\\\left. \\\\text{\\\\quad\\\\quad}\\\\mathbf{w}^{(n +\
  \ 1)}\\\\Rightarrow W^{(n + 1)}; \\\\right. \\\\\\\\ \\\\end{array}$$\n\n$$\\\\\
  begin{array}{r} {\\\\mathbf{e}^{(n + 1)} = \\\\left\\\\{ \\\\begin{array}{r} {\\\
  \\mathbf{e}^{n} + \\\\gamma\\_{\\\\mathbf{e}}\\\\nabla\\_{\\\\mathbf{e}}(\\\\mathbf{q}^{(n\
  \ + 1)},\\\\mathbf{b}^{(n + 1)},\\\\mathbf{w}^{n},\\\\mathbf{e}^{n})\\\\,\\\\text{if}\\\
  \\,\\\\mathbf{e}^{(n + 1)} \\\\geq \\\\mathbf{0},} \\\\\\\\ {\\\\mathbf{e}^{n}\\\
  \\text{if}\\\\,\\\\mathbf{e}^{(n + 1)} < \\\\mathbf{0};} \\\\\\\\ \\\\end{array}~\
  \ \\\\right.} \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} \\\\left. \\\\\
  text{\\\\quad\\\\quad}\\\\mathbf{e}^{(n + 1)}\\\\Rightarrow E^{(n + 1)}; \\\\right.\
  \ \\\\\\\\ \\\\end{array}$$\n\n$$\\\\begin{array}{r} {X^{(n + 1)} = E^{(n + 1)}\\\
  \\left\\\\{ {\\\\left\\\\lbrack {B^{(n + 1)}\\\\left( {UQ^{(n + 1)}} \\\\right)}\
  \ \\\\right\\\\rbrack W^{(n + 1)}} \\\\right\\\\};} \\\\\\\\ \\\\end{array}$$\n\n\
  $$\\\\begin{array}{r} {\\\\mathcal{H}^{(n + 1)} = {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\
  \\sum\\\\limits\\_{j = 1}^{s}x\\_{ij}^{(n + 1)}}}\\\\ln\\\\frac{x\\_{ij}^{(n + 1)}}{u\\\
  _{ij}}.} \\\\\\\\ \\\\end{array}$$\n\n* *c) 停止条件：*\n\n$$\\\\begin{array}{r} {\\\\\
  text{If}\\\\,\\\\,\\\\mathcal{H}^{(n + 1)} - \\\\mathcal{H}^{(n)} \\\\leq \\\\delta,\\\
  \\,\\\\text{then}\\\\, STOP.} \\\\\\\\ \\\\end{array}$$\n\n## 3.4 在矩阵范数和信息容量约束下熵的降低\n\
  \n在应用数据矩阵的熵降低时，希望得到具有确定性质的降维矩阵。就 EDR 方法而言，这意味着对投影矩阵的类引入一些限制，这间接影响得到的降维矩阵。考虑投影矩阵的一些有用特征。\n\
  \n\n\n\n\n### 1. 矩阵的 Frobenius 范数\n\n上面，已假设直接 `Q` 和逆 `T` 投影矩阵具有非负元素。这种假设是由于使用交叉熵来表征它们之间的“距离”。然而，在应用相关机器学习问题中，缩小投影矩阵的类通常是有意义的。这可以通过考虑\
  \ Frobenius 矩阵范数来实现：\n\n![](img/math3_268.jpg)\n\n### 2. 数据矩阵的信息容量\n\n在降维过程中，数据矩阵中包含的部分信息会丢失。因此，应该以某种方式对其进行度量。引入非负矩阵\
  \ `A[n × q]` 的 *信息容量* `ℐ(A)` 的概念，其由下式给出\n\n$$\\begin{array}{r} {\\mathcal{I}(A)\
  \ = {\\sum\\limits_{i = 1}^{n}{\\sum\\limits_{j = 1}^{q}a_{ij}}}\\ln a_{ij}.} \\\
  \\ \\\\ \\end{array}$$\n\n(3.59)\n\n显然，信息容量对应于取相反符号的熵。\n\n### 3. 交叉熵约减算法\n\n数据矩阵的降维过程是最小化交叉熵：\n\
  \n$$\\begin{array}{r} \\left. H(Q,T\\, \\middle| \\, U)\\Rightarrow\\min\\limits_{Q,T},\
  \ \\right. \\\\ \\\\ \\end{array}$$\n\n(3.60)\n\n其中\n\n$$\\begin{array}{r} \\left.\
  \ H(Q,T\\, \\middle| \\, U) = {\\sum\\limits_{i = 1}^{m}{\\sum\\limits_{j = 1}^{s}x_{ij}}}(Q,T\\\
  , \\middle| \\, U)\\ln\\frac{\\left. x_{ij}(Q,T\\, \\middle| \\, U) \\right.}{u_{ij}},\
  \ \\right. \\\\ \\\\ \\end{array}$$\n\n(3.61)\n\n$$\\begin{array}{r} \\left. x_{ij}(Q,T\\\
  , \\middle| \\, U) = {\\sum\\limits_{\\mu = 1}^{r}{\\sum\\limits_{\\nu = 1}^{s}t_{\\\
  mu,j}}}q_{\\nu,\\mu}u_{i,\\nu},\\text{\\quad\\quad}i = \\overline{1,m};\\, j = \\\
  overline{1,s}, \\right. \\\\ \\\\ \\end{array}$$\n\n(3.62)\n\n受以下约束条件限制：\n\n* —投影矩阵的非负值，\n\
  \n$$\\begin{array}{r} {Q \\geq 0,\\text{\\quad\\quad}T \\geq 0;} \\\\ \\\\ \\end{array}$$\n\
  \n(3.63)\n\n* —投影矩阵范数的上界（`a`, `b`），\n\n$$\\begin{array}{r} {n_{Q}(Q) = {\\sum\\\
  limits_{i = 1}^{s}{\\sum\\limits_{j = 1}^{r}q_{ij}^{2}}} \\leq a,\\quad n_{T}(T)\
  \ = {\\sum\\limits_{i = 1}^{r}{\\sum\\limits_{j = 1}^{s}t_{ij}^{2}}} \\leq b;} \\\
  \\ \\\\ \\end{array}$$\n\n(3.64)\n\n* —信息容量的 `δ`-可容许减小，\n\n$$\\begin{array}{r} {\\\
  frac{\\left. \\mathcal{I}(U) - \\mathcal{I}(Y(Q \\middle| U)) \\right.}{\\mathcal{I}(U)}\
  \ \\leq \\delta.} \\\\ \\\\ \\end{array}$$\n\n(3.65)\n\n在此不等式中，\n\n$$\\begin{array}{r}\
  \ \\left. \\mathcal{I}(Y(Q\\, \\middle| \\, U)) = {\\sum\\limits_{i = 1}^{m}{\\\
  sum\\limits_{j = 1}^{r}y_{ij}}}(Q\\, \\middle| \\, U)\\ln y_{ij}(Q\\, \\middle|\
  \ \\, U), \\right. \\\\ \\\\ \\end{array}$$\n\n(3.66)\n\n$$\\begin{array}{r} \\\
  left. y_{ij}(Q\\, \\middle| \\, U) = {\\sum\\limits_{\\nu = 1}^{s}u_{i,\\nu}}q_{\\\
  nu,j}. \\right. \\\\ \\\\ \\end{array}$$\n\n(3.67)\n\n由于目标函数（熵-双线性形式）的性质以及由二次熵不等式指定的约束，交叉熵约减问题\
  \ (3.60)–(3.64) 是非凸的；详情参见 [134, 171]。因此，存在一定（先验未知）的局部最优解个数，该问题应作为全局优化问题处理。\n\n将问题\
  \ (3.60)–(3.64) 视为非负象限 `R+` 上的局部最小化问题。这里变量是矩阵 `Q` 和 `T` 的元素，每个矩阵包含 `rs` 个条目。利用 *矩阵向量化*，即通过行顺序连接过渡到复向量，构造对应于矩阵\
  \ `Q`、`T` 和 `U` 的向量 `q`、`t` 和 `u`。然后交叉熵最小化问题可以表示为\n\n$$\\begin{array}{r} \\left.\
  \ \\mathcal{H}(\\mathbf{q},\\mathbf{t}\\, \\middle| \\,\\mathbf{u})\\Rightarrow\\\
  min, \\right. \\\\ \\\\ \\end{array}$$\n\n(3.68)\n\n$$\\begin{aligned} & {(\\mathbf{q},\\\
  mathbf{t}) \\in R_{+}^{(2sr)},} \\\\ & {N_{Q}(\\mathbf{q}) = - {\\widetilde{N}}_{Q}(\\\
  mathbf{q}) + a \\geq 0,\\quad N_{T}(\\mathbf{t}) = - {\\widetilde{N}}_{T}(\\mathbf{t})\
  \ + b \\geq 0,} \\\\ & \\left. \\mathcal{I}_{Y}(\\mathbf{q}) = I_{Y}(\\mathbf{q}\\\
  , \\middle| \\,\\mathbf{u}) - \\gamma(\\delta) \\geq 0,\\quad\\gamma(\\delta) =\
  \ (1 - \\delta)I_{U}. \\right. \\\\ \\end{aligned}$$\n\n(3.69)\n\n回想一下，问题 (3.68)\
  \ 被视为局部优化问题，对于该问题 Karush–Kuhn–Tucker 条件是必要的。该问题的 Lagrange 函数形式为\n\n$$\\begin{array}{r}\
  \ {L(\\mathbf{q},\\mathbf{t},\\alpha,\\beta,\\gamma) = \\mathcal{L}(\\mathbf{q},\\\
  mathbf{t},\\gamma) - \\left\\langle \\alpha,\\mathbf{q} \\right\\rangle - \\left\\\
  langle \\beta,\\mathbf{t} \\right\\rangle,} \\\\ \\\\ \\end{array}$$\n\n(3.70)\n\
  \n其中 `α` = `{α[1],…,α[r*s]}`，`β` = `{β[1],…,β[r*s]}`，且 `γ` = `{γ[1],γ[2],γ[3]}`\
  \ 是与相应约束相关的 Lagrange 乘子。\n\n函数\n\n$$\\begin{array}{r} {\\mathcal{L}(\\mathbf{q},\\\
  mathbf{t},\\gamma) = \\mathcal{H}(\\mathbf{q},\\mathbf{t}) - \\gamma_{1}N_{Q}(\\\
  mathbf{q}) - \\gamma_{2}N_{T}(\\mathbf{t}) - \\gamma_{3}\\mathcal{I}_{Y}(\\mathbf{q})}\
  \ \\\\ \\\\ \\end{array}$$\n\n(3.71)\n\n将被称作截断 Lagrange 函数。\n\n假设在问题 (3.68, 3.70)\
  \ 中存在局部最小点 (`q*`, `t*`) 以及邻域\n\n$$\\begin{array}{r} {\\mathcal{O}_{(\\mathbf{q}^{*},\\\
  mathbf{t}^{*})}(\\mathbf{q},\\mathbf{t}) \\in \\|\\mathbf{q}^{*} - \\mathbf{q}\\\
  |^{2} + \\|\\mathbf{t}^{*} - \\mathbf{t}\\|^{2} \\leq \\varrho} \\\\ \\\\ \\end{array}$$\n\
  \n(3.72)\n\n使得问题 (3.68)，(3.70) 在集合 (3.72) 上变得凸。然后 Kuhn–Tucker 条件 [134] 在集合 (3.72)\
  \ 上关于截断 Lagrange 函数 (3.71) 得到满足，即\n\n$$\\begin{aligned} & {\\nabla_{\\mathbf{q}}\\\
  mathcal{L}(\\mathbf{q},\\mathbf{t},\\gamma) \\geq \\mathbf{0},\\text{\\quad\\quad}\\\
  nabla_{\\mathbf{t}}\\mathcal{L}(\\mathbf{q},\\mathbf{t},\\gamma) \\geq \\mathbf{0},}\
  \ \\\\ & {\\mathbf{q} \\otimes \\nabla_{\\mathbf{q}}\\mathcal{L}(\\mathbf{q},\\\
  mathbf{t},\\gamma) \\geq \\mathbf{0},\\text{\\quad\\quad}\\mathbf{t} \\otimes \\\
  nabla_{\\mathbf{t}}\\mathcal{L}(\\mathbf{q},\\mathbf{t},\\gamma) \\geq \\mathbf{0},}\
  \ \\\\ & {\\mathbf{q}^{*} \\geq \\mathbf{0},\\text{\\quad\\quad}\\mathbf{t}^{*}\
  \ \\geq \\mathbf{0},} \\\\ & {\\nabla_{\\gamma}\\mathcal{L}(\\mathbf{q},\\mathbf{t},\\\
  gamma) \\leq \\mathbf{0},\\text{\\quad\\quad}\\gamma \\otimes \\nabla_{\\gamma}\\\
  mathcal{L}(\\mathbf{q},\\mathbf{t},\\gamma) = \\mathbf{0},} \\\\ & {\\gamma \\geq\
  \ \\mathbf{0}.} \\\\ \\end{aligned}$$\n\n(3.73)\n\n该方程和不等式系统可使用乘性算法 [143] 求解。引入以下记号：\n\
  \n$$\\begin{aligned} & {\\mathbf{G}_{\\mathbf{q}}(\\mathbf{q},\\mathbf{t},\\gamma)\
  \ = \\mathbf{1} - \\theta\\nabla_{\\mathbf{q}}\\mathcal{L}(\\mathbf{q},\\mathbf{t},\\\
  gamma),} \\\\ & {\\mathbf{G}_{\\mathbf{t}}(\\mathbf{q},\\mathbf{t},\\gamma) = \\\
  mathbf{1} - \\theta\\nabla_{\\mathbf{t}}\\mathcal{L}(\\mathbf{q},\\mathbf{t},\\\
  gamma),} \\\\ & {\\mathbf{K}_{\\gamma}(\\mathbf{q},\\mathbf{t},\\gamma) = \\mathbf{1}\
  \ + \\theta\\nabla_{\\gamma}\\mathcal{L}(\\mathbf{q},\\mathbf{t},\\gamma).} \\\\\
  \ \\end{aligned}$$\n\n(3.74)\n\n乘性算法，以下简称为 **带约束的最小交叉熵 (MCEC)**，具有以下结构。\n\n* *a)\
  \ 初始步骤：*\n\n$$\\begin{array}{r} {\\mathbf{q}^{0} > \\mathbf{0},\\quad\\mathbf{t}^{0}\
  \ > \\mathbf{0}.} \\\\ \\\\ \\end{array}$$\n\n* *b) 第 n 次迭代步骤：*\n\n$$\\begin{array}{r}\
  \ {\\mathbf{q}^{(n + 1)} = \\mathbf{q}^{n} \\otimes \\mathbf{G}_{\\mathbf{q}}(\\\
  mathbf{q}^{n},\\mathbf{t}^{n},\\gamma^{n}),} \\\\ \\\\ \\end{array}$$\n\n\n\n\n\n\
  $$\n\\begin{array}{r} {\\mathbf{t}^{(n + 1)} = \\mathbf{t}^{n} \\otimes \\mathbf{G}_{\\\
  mathbf{t}}(\\mathbf{q}^{n},\\mathbf{t}^{n},\\gamma^{n});} \\\\ \\end{array}\n$$\n\
  \n$$\n\\begin{array}{r} \\left. \\mathbf{t}^{(n + 1)}\\rightarrow T^{(n + 1)}; \\\
  right. \\\\ \\end{array}\n$$\n\n$$\n\\begin{array}{r} {\\gamma^{n + 1} = \\gamma^{n}\
  \ \\otimes \\mathbf{K}_{\\gamma}(\\mathbf{q}^{n},\\mathbf{t}^{n},\\gamma^{n})} \\\
  \\ \\end{array}\n$$\n\n$$\n\\begin{array}{r} \\left. \\mathbf{q}^{(n + 1)}\\rightarrow\
  \ Q^{(n + 1)}; \\right. \\\\ \\end{array}\n$$\n\n$$\n\\begin{array}{r} \\left. \\\
  mathbf{t}^{(n + 1)}\\rightarrow T^{(n + 1)}; \\right. \\\\ \\end{array}\n$$\n\n\
  $$\n\\begin{array}{r} {X^{(n + 1)} = U\\, Q^{(n + 1)}\\, T^{(n + 1)};} \\\\ \\end{array}\n\
  $$\n\n$$\n\\begin{array}{r} \\left. H(Q^{(n + 1)},T^{(n + 1)}\\, \\middle| \\, U)\
  \ = {\\sum\\limits_{i = 1}^{m}{\\sum\\limits_{j = 1}^{r}x_{ij}^{(n + 1)}}}\\ln\\\
  frac{x_{ij}^{(n + 1)}}{u_{ij}} = H^{(n + 1)}. \\right. \\\\ \\end{array}\n$$\n\n\
  * *c) 停止条件：*\n\n$$\n\\begin{array}{r} {H^{(n + 1)} - H^{(n)} \\leq \\Delta.} \\\\\
  \ \\end{array}\n$$\n\n该算法在初始点为正的情况下收敛到局部最小值 \\[143\\]。\n\n## 3.5 线性模型学习中降维效率的估计\n\
  \n线性静态模型被广泛用于描述 RML 问题中的对象。详细考虑原始和降维输入学习集合的这种描述。\n\n### 3.5.1 线性模型\n\n线性静态对象具有单个输出\
  \ *z* 和 *s* 个输入 **u** ∈ *R*^(*s*)。该对象的状态由具有参数权重 **a** 的 *s* 个属性表征。对象的数学模型是随机化的，即参数\
  \ **a** 是区间类型的随机变量：\n\n$$\n\\begin{array}{r} {\\mathbf{a} \\in \\mathcal{A} = \\\
  left\\{ \\mathbf{a}^{-} \\leq \\mathbf{a} \\leq \\mathbf{a}^{+} \\right\\}.} \\\\\
  \ \\end{array}\n$$\n\n(3.75)\n\n这些参数的概率特性由概率密度函数 (PDF) *P*(**a**) 刻画。由于对象是线性和静态的，其模型的输出\
  \ *z* 与输入具有线性关系：\n\n$$\n\\begin{array}{r} {z = \\left\\langle \\mathbf{u},\\mathbf{a}\
  \ \\right\\rangle,} \\\\ \\end{array}\n$$\n\n(3.76)\n\n其中 ⟨,⟩ 表示向量的标量积。\n\n假设存在一个由\
  \ *m* 个此类对象组成的输入学习集合 \U0001D4B0，其状态由属性空间 *R*^(*s*) 中的向量 **u**^((1)), …, **u**^((*m*))\
  \ 刻画，输出由向量 **y** = {*y*[1],…,*y*[*m*]} 刻画。由于对象的线性性，模型的输出形式为\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{z} = U\\mathbf{a},\\text{\\quad\\quad}\\mathbf{z} = \\left\\{ z_{1},\\\
  ldots,z_{m} \\right\\},} \\\\ \\end{array}\n$$\n\n(3.77)\n\n其中 *U* = *U*[(*m* × *s*)]\
  \ 是尺寸为 (*m* × *s*) 的非负矩阵，且\n\n$$\n\\begin{array}{r} {\\mathbf{z} \\in \\mathcal{Z}\
  \ = \\lbrack\\mathbf{z}^{-},\\mathbf{z}^{+}\\rbrack,\\text{\\quad\\quad}\\mathbf{z}^{-}\
  \ = U\\mathbf{a}^{-};\\,\\,\\mathbf{z}^{+} = U\\mathbf{a}^{+}.} \\\\ \\end{array}\n\
  $$\n\n(3.78)\n\n一个常见的假设是对象的输出包含由随机向量 $\\overline{\\xi} = \\left\\{ \\xi_{1},\\ldots,\\\
  xi_{m} \\right\\}$ 描述的测量误差，该向量为区间类型，即\n\n$$\n\\begin{array}{r} {\\overline{\\xi}\
  \ \\in \\mathcal{K} = \\left\\{ {\\overline{\\xi}}^{-} \\leq \\overline{\\xi} \\\
  leq {\\overline{\\xi}}^{+} \\right\\},} \\\\ \\end{array}\n$$\n\n(3.79)\n\n其概率密度函数为\
  \ $L(\\overline{\\xi}).$ 此外，假设模型参数和测量噪声的 PDF 都是连续可微的。\n\n模型的观测输出被某些噪声扭曲，形式为\n\n\
  $$\n\\begin{array}{r} {\\mathbf{v} = \\mathbf{z} + \\overline{\\xi} = U_{(m \\times\
  \ s)}\\,\\mathbf{a} + \\overline{\\xi}.} \\\\ \\end{array}\n$$\n\n(3.80)\n\n向量 **v**\
  \ 属于 *m* 维平行六面体\n\n$$\n\\begin{array}{r} {\\mathcal{V} = \\lbrack\\mathbf{v}^{-},\\\
  mathbf{v}^{+}\\rbrack,\\text{\\quad\\quad}\\mathbf{v}^{-} = \\mathbf{z}^{-} + {\\\
  overline{\\xi}}^{-};\\,\\,\\mathbf{v}^{+} = \\mathbf{z}^{+} + {\\overline{\\xi}}^{+}.}\
  \ \\\\ \\end{array}\n$$\n\n(3.81)\n\nRML 过程产生对应 PDF 的估计 *P̂*(**a**) 和 $\\hat{L}(\\\
  overline{\\xi})$。这是利用学习集合 (\U0001D4B0,**y**) 和随机化模型 (3.80) 完成的。所得估计用于实现该模型，即生成随机向量\
  \ **v** ∈ *R*^(*m*) 的集合 \U0001D4B1。生成此类集合是随机化机器学习问题之一 \\[145\\]，进一步称为 *RML 的 s 问题*。\n\
  \n在许多情况下，属性空间的维度 *s* 对于现有计算能力来说非常高。因此，将该空间降至给定维度 *r* < *s* 是有意义的。\n\n引入输入数据矩阵 *W*[(*m* × *r*)]，它将表征在降维属性空间\
  \ *R*^(*r*) 中 *m* 个对象的集合 \U0001D4B2，以及具有参数 **b** = {*b*[1],…,*b*[*r*]} ∈ *R*^(*r*)\
  \ 的随机化模型：\n\n$$\n\\begin{array}{r} {\\mathbf{w} = W_{(m \\times r)}\\mathbf{b},\\\
  text{\\quad\\quad}\\mathbf{b} \\in R^{r},\\,\\, \\mathbf{w} \\in R^{m}.} \\\\ \\\
  end{array}\n$$\n\n(3.82)\n\n参数向量 **b** 由区间类型的随机分量组成，即\n\n$$\n\\begin{array}{r} {\\\
  mathbf{b} \\in \\mathcal{B} = \\lbrack\\mathbf{b}^{-},\\mathbf{b}^{+}\\rbrack,}\
  \ \\\\ \\end{array}\n$$\n\n(3.83)\n\n其 PDF 为 *B*(**b**)。观测向量形式为\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{t} = \\mathbf{w} + \\overline{\\zeta},\\text{\\quad\\quad}\\overline{\\\
  zeta} \\in R^{m}.} \\\\ \\end{array}\n$$\n\n(3.84)\n\n随机向量 $\\overline{\\zeta}$\
  \ 描述测量误差且为区间类型，即\n\n$$\n\\begin{array}{r} {\\overline{\\zeta} \\in \\mathcal{J}\
  \ = \\lbrack{\\overline{\\zeta}}^{-},{\\overline{\\zeta}}^{+}\\rbrack,} \\\\ \\\
  end{array}\n$$\n\n(3.85)\n\n其 PDF 为 $Q(\\overline{\\zeta}).$ 最后，\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{t} \\in \\mathcal{T} = \\lbrack\\mathbf{t}^{-},\\mathbf{t}^{+}\\rbrack,\\\
  text{\\quad\\quad}\\mathbf{t}^{-} = W\\mathbf{b}^{-} + {\\overline{\\zeta}}^{-},\\\
  ,\\, \\mathbf{t}^{+} = W\\mathbf{b}^{+} + {\\overline{\\zeta}}^{+}.} \\\\ \\end{array}\n\
  $$\n\n(3.86)\n\n所有表征模型参数和测量噪声的 PDF 均假定为连续可微函数。PDF *B*(**b**) 的估计以及相应集合 \U0001D4AF\
  \ 的生成是另一个随机化机器学习问题，称为 *RML 的 r 问题*。\n\n### 3.5.2 比较 RML 的 *s* 与 *r* 问题\n\n这些问题将通过三阶段方法进行比较，如下。第一阶段，使用学习集合\
  \ (\U0001D4B0,**y**) 和 (\U0001D4B2,**y**) 分别由 RML 过程求解 *s* 和 *r* 问题。该阶段得到模型参数和测量噪声的熵最优\
  \ PDF，*s* 问题为 *P*^(\\*)(**a**) 和 $L^{\\*}(\\overline{\\xi})$，*r* 问题为 *B*^(\\*)(**b**)\
  \ 和 $Q^{\\*}(\\overline{\\zeta})$。第二阶段，利用线性模型 (3.80, 3.84) 计算在集合 \U0001D49E = \U0001D4B1\
   ∩ \U0001D4AF 上归一化的 PDF *F**s* 和 *F**r*。最后，第三阶段计算 Kullback–Leibler 相对熵 \\[102\\\
  ]，它表征 PDF *F**s* 和 *F**r* 之间的绝对差异。该方法称为 *s&r 比较* (SRC)。\n\n考虑 *第一阶段*，并回顾求解 *s* 问题的\
  \ RML 过程；参见由 (3.80) 描述的模型。\n\n为了在最大不确定性下获得最佳估计（学习质量最高），最大化定义在 PDF *P*(**a**) 和 $L(\\\
  overline{\\xi})$ 上的熵泛函，\n\n\n\n\n\n$$\\begin{array}{r} \\left. \\mathcal{H}\\lbrack\
  \ P(\\mathbf{a}),L(\\overline{\\xi})\\rbrack = - {\\int_{\\mathcal{A}}P}(\\mathbf{a})\\\
  ,\\ln P(\\mathbf{a})d\\mathbf{a} - {\\int_{\\mathcal{K}}L}(\\overline{\\xi})\\ln\
  \ L(\\overline{\\xi})d\\overline{\\xi}\\Rightarrow\\max, \\right. \\\\ \\end{array}$$\n\
  \n(3.87)\n\n受约束条件\n\n$$\\begin{array}{r} {{\\int_{\\mathcal{A}}P}(\\mathbf{a})d\\\
  mathbf{a} = 1,\\text{\\quad\\quad}{\\int_{\\mathcal{K}}L}(\\overline{\\xi})d\\overline{\\\
  xi} = 1,} \\\\ \\end{array}$$\n\n(3.88)\n\n以及\n\n$$\\begin{array}{r} {\\mathcal{M}\\\
  left\\{ \\mathbf{z} \\right\\} = {\\int_{\\mathcal{A}}U}P(\\mathbf{a})d\\mathbf{a}\
  \ + {\\int_{\\mathcal{K}}\\overline{\\xi}}L(\\overline{\\xi})d\\overline{\\xi} =\
  \ \\mathbf{y}.} \\\\ \\end{array}$$\n\n(3.89)\n\n这是一个熵-线性函数规划问题 \\[138\\]。其解的形式为\n\
  \n$$\\begin{aligned} & {P^{\\*}(\\mathbf{a}) = \\pi^{- 1}(\\overline{\\theta})\\\
  exp\\left\\langle - \\overline{\\theta},U\\,\\mathbf{a} \\right\\rangle,} \\\\ &\
  \ {L^{\\*}(\\overline{\\xi}) = \\varpi^{- 1}(\\overline{\\theta})\\exp\\left\\langle\
  \ - \\overline{\\theta},\\overline{\\xi} \\right\\rangle,} \\\\ \\end{aligned}$$\n\
  \n(3.90)\n\n其中\n\n$$\\begin{aligned} {\\pi(\\overline{\\theta})} & {= {\\int_{\\\
  mathcal{A}}\\exp}\\left\\langle - \\overline{\\theta},U\\,\\mathbf{a} \\right\\\
  rangle d\\mathbf{a},} \\\\ {\\varpi(\\overline{\\theta})} & {= {\\int_{\\mathcal{K}}\\\
  exp}\\left\\langle - \\overline{\\theta},\\overline{\\xi} \\right\\rangle d\\overline{\\\
  xi}.} \\\\ \\end{aligned}$$\n\n(3.91)\n\n拉格朗日乘子 $\\overline{\\theta}$ 由平衡方程 (3.89)\
  \ 求得：\n\n$$\\begin{array}{r} {{\\int_{\\mathcal{A}}U}P^{\\*}(\\mathbf{a})d\\mathbf{a}\
  \ + {\\int_{\\mathcal{K}}\\overline{\\xi}}L^{\\*}(\\overline{\\xi})d\\overline{\\\
  xi} = \\mathbf{y}.} \\\\ \\end{array}$$\n\n(3.92)\n\n因此，RML 的 *s*\\-问题的解给出了两个熵最优的\
  \ PDF *P*^(\\*)(**a**)（模型参数）和 $L^{\\*}(\\overline{\\xi})$（测量噪声）。\n\n在 *第二阶段*，使用线性模型\
  \ (3.80)，其参数和测量噪声相互独立。观测向量 **v** 的概率密度函数 *F*(**v**) 的形式为\n\n$$\\begin{array}{r}\
  \ {F(\\mathbf{v}) = {\\int_{\\mathcal{K}}G}(\\mathbf{v} - \\overline{\\xi})L^{\\\
  *}(\\overline{\\xi})d\\overline{\\xi},} \\\\ \\end{array}$$\n\n(3.93)\n\n其中 *G*( • )\
  \ 是向量 **z** (3.80) 的密度。根据该等式，\n\n$$\\begin{array}{r} {\\mathbf{a} = {(U^{\\intercal}U)}^{-\
  \ 1}\\, U^{\\intercal}\\mathbf{z}.} \\\\ \\end{array}$$\n\n(3.94)\n\n因此，\n\n$$\\\
  begin{array}{r} {P^{\\*}({(U^{\\intercal}U)}^{- 1}\\, U^{\\intercal}\\mathbf{z})\
  \ = \\eta(\\mathbf{z}),} \\\\ \\end{array}$$\n\n(3.95)\n\n其中向量 **z** 定义在集合 \U0001D4B5\
  \ (3.78) 上。对该函数进行归一化，得到向量 **z** 的 PDF\n\n$$\\begin{array}{r} {G(\\mathbf{z}) = \\\
  frac{\\eta(\\mathbf{z})}{{\\int_{\\mathcal{Z}}\\eta}(\\mathbf{z})}d\\mathbf{z}}\
  \ \\\\ \\end{array}$$\n\n(3.96)\n\n该 PDF 在集合 \U0001D4B5 (3.78) 上归一化。\n\n好，等式 (3.93)\
  \ 给出了 *s*\\-问题随机化模型的 PDF *F*(**v**)， **v** ∈ \U0001D4B1 (3.81)。记其为 *F**s*。\n\n使用类似的程序对\
  \ *r*\\-问题 (3.82–3.84) 进行处理，数据矩阵使用缩减后的 *W* (3.75)，求得在集合 \U0001D4AF (3.86) 上归一化的\
  \ PDF *F**r*。\n\n为比较 PDF *F**s* 和 *F**r*，引入集合\n\n$$\\begin{array}{r} {\\mathcal{C}\
  \ = \\mathcal{V}{\\cap \\mathcal{T}},} \\\\ \\end{array}$$\n\n(3.97)\n\n并在该集合上对这些函数进行归一化。归一化后的\
  \ PDF 的形式为\n\n$$\\begin{array}{r} {{\\widetilde{F}}_{s}(\\mathbf{c}) = \\frac{F_{s}(\\\
  mathbf{c})}{{\\int_{\\mathcal{C}}F_{s}}(\\mathbf{c})d\\mathbf{c}},} \\\\ {{\\widetilde{F}}_{r}(\\\
  mathbf{c}) = \\frac{F_{r}(\\mathbf{c})}{{\\int_{\\mathcal{C}}F_{r}}(\\mathbf{c})d\\\
  mathbf{c}}.} \\\\ \\end{array}$$\n\n在 *第三阶段*，将使用 Kullback–Leibler 散度作为 PDF *F̃**r*\
  \ 与 *F̃**s* 之间 *绝对信息误差 Δ* 的度量：\n\n$$\\begin{array}{r} {KL({\\widetilde{F}}_{s},{\\\
  widetilde{F}}_{r}) = {\\int_{\\mathcal{C}}{\\widetilde{F}}_{r}}(\\mathbf{c})\\ln\\\
  frac{{\\widetilde{F}}_{r}(\\mathbf{c})}{{\\widetilde{F}}_{s}(\\mathbf{c})} = \\\
  Delta \\geq 0.} \\\\ \\end{array}$$\n\n(3.98)\n\n注意，最小值 *Δ* = 0 在 *F̃**r* = *F̃**s*\
  \ 时取得。\n\n此外，引入 *相对信息误差 δ* 的形式为\n\n$$\\begin{array}{r} {\\delta = \\frac{\\Delta}{H_{s}\
  \ + H_{r}},} \\\\ \\end{array}$$\n\n(3.99)\n\n其中\n\n$$\\begin{aligned} H_{s} & {=\
  \ {\\int_{\\mathcal{C}}{\\widetilde{F}}_{s}}(\\mathbf{c})\\ln{\\widetilde{F}}_{s}(\\\
  mathbf{c})d\\mathbf{c},} \\\\ H_{r} & {= {\\int_{\\mathcal{C}}{\\widetilde{F}}_{r}}(\\\
  mathbf{c})\\ln{\\widetilde{F}}_{r}(\\mathbf{c})d\\mathbf{c}.} \\\\ \\end{aligned}$$\n\
  \n(3.100)\n\n这些等式是定义在支撑集 \U0001D49E (3.97) 上的 PDF *F̃*[*s*] 和 *F̃*[*r*] 的信息熵。\n\n\
  ## 3.6 EDR 在二分类问题中效率的估计\n\nEDR 方法将通过计算实验在真实数据上与主成分分析 (PCA) 和随机投影 (RP) 方法进行表征和比较效率，该实验针对具有线性分类器的二分类问题。\n\
  \n### 3.6.1 线性分类器\n\n### 3.6.2 计算实验方案\n\n遵循 \\[162, 190\\]，EDR 方法通过求解原始属性空间和缩减属性空间中的二分类问题，并在分类准确率\
  \ (3.107) 方面与 PCA 和 RP 方法进行比较，从而进行了实验研究。为了使结果稳定，使用了蒙特卡洛模拟和交叉验证。\n\n实验包含若干阶段：\n\n\
  1. 在原始空间中求解分类问题；\n2. 在 PCA 缩减空间中求解分类问题；\n3. 在 RP 缩减空间中求解分类问题；\n4. 在 EDR 缩减空间中求解分类问题。\n\
  \n阶段 2–4 依次针对维度每次减少 1 实现，即 *r* = *s* − 1, …, 1，其中 *r* 表示缩减空间的维度。阶段 4 对 *δ* 的不同取值实现，即信息容量的允许下降量。\n\
  \n实验研究用的 Python 程序在 OS Linux 上开发，使用了 `numpy 1.14.3`、`scipy 1.1.0`、`sklearn 0.19.1`\
  \ 库。通过 scikit-learn 库 \\[128\\] 的相应类 `PCA` 和 `GaussianRandomProjection` 进行主成分分析和随机投影方法降维。分类问题使用支持向量机\
  \ \\[70\\] 求解，即使用线性核的 `SVC` 类。\n\n实验研究基于两组数据集如下。第一组 (*simulation*) 是一个包含 100 个对象、10\
  \ 个属性的合成数据集。数据由 `make_classification` 函数 \\[26\\] 生成，参数为 `n_classes=2`、`n_clusters_per_class=2`、`n_informative=10`、`n_redundant=0`\
  \ 和 `class_sep=1.0`。该函数在维度为 `n_informative` 的空间中生成点，围绕超立方体的边缘呈正态分布（零均值、单位方差），并加入少量噪声。\n\
  \n第二组数据集 (*heart*) 由心脏病研究中收集的真实数据组成 \\[2\\]。该数据集包含 270 个对象、13 个属性。\n\n所有实验中，数据均归一化到区间\
  \ \\[0,1\\]。\n\n### 3.6.3 实验结果\n\n\n\n\n\n所有实验均采用自助法 \\[70\\] 进行交叉验证。更具体地说，从原始数据集中随机选择\
  \ 30 个对象 2 次；其中 20 个用于学习分类器，其余 10 个用于测试；对每个样本的结果取平均值。然后重复实验 10 次，结果也取平均值。每个阶段的降维均针对整个学习样本（30\
  \ 个对象）进行。\n\n问题 (3.32)–(3.35) 使用非负正交集上的约束优化方法 `SLSQP` \\[97\\] 求解，由 `scipy` 库中的\
  \ `minimize` 函数实现，参数为 `ftol=1e-4` 和 `maxiter=1000`。请注意，对于某些 `δ` 值，在给定的优化参数下该方法未得到解。在这种情况下，使用找到的最后一个解。\n\
  \n#### 1. ε 随对象数（样本量 m）的依赖关系\n研究三种降维方法对此依赖关系十分重要，以便确定其应用范围。众所周知，熵最大化方法及其衍生方法，特别是\
  \ `EDR` 方法，通常在属性空间维度相比之下数据量有限的情况下使用。在“大数据”的情况下，其应用没有根本限制，但计算困难会显著增加。至于 `PCA`，对于大量数据（足够大的\
  \ `m`）及其异质性，方法变得不稳定 \\[136\\]。\n\n对 `simulation` 数据集在小样本量下的分类准确率进行了研究。结果分别列于 表 3.1、表\
  \ 3.2、表 3.3 中，`$m = \\overline{5,10}.$` 对于这些集合中的每一个，属性空间被降维至大小 `$r = \\overline{5,10}.$`\n\
