  \n$$\\\\begin{array}{r} \\\\left. \\\\mathbf{y}(t) = {\\\\int\\_{\\\\mathcal{T}}K}(t\
  \ - \\\\tau\\\\, \\\\middle| \\\\,\\\\mathbf{a},\\\\mathbf{b},\\\\mathbf{c})\\\\\
  ,\\\\mathbf{x}(\\\\tau)\\\\, d\\\\tau, \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n\
  (4.75)\n\nwhere the matrix\n\n$$\\\\begin{array}{r} \\\\left. K(t\\\\, \\\\middle|\
  \ \\\\,\\\\mathbf{a},\\\\mathbf{b},\\\\mathbf{c}) = \\\\mathcal{L}^{( - 1)}\\\\\
  left\\\\{ K(s\\\\, \\\\middle| \\\\,\\\\mathbf{a},\\\\mathbf{b},\\\\mathbf{c}) \\\
  \\right\\\\}. \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(4.76)\n\n### 4.3.3 Nonlinear\
  \ dynamic models with power nonlinearities\n\nConsider an object whose \\[(SI,FB)–EO\\\
