  \n因此，不等式 (7.113) 以不小于 *P*(*N*, *m*) 的概率成立。\n\n### 3.\n考虑 (7.3) 中的第二项。以下估计成立：\n\n\
  $$\\begin{array}{r} \\left. v\\left. \\sum\\limits_{i = 1}^{N} \\right|\\phi(\\\
