- "# 机器学习中的熵随机化\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  # Preface\n\n文明发展的根本重要属性之一在于知识的积累，并进一步转化为提取新知识的解决方案。这种转化以不同方式实现，包括从积累的数据中提取知识。`model`\
  \ 作为积累知识的基本工具，具有定量测量的特征。然而，除了定量（数字）数据之外，还可能存在非定量数据，例如音频、视频、图形、文本和其他数据。最终，知识提取和积累的问题归结为对由\
  \ `estimating` 其特征而形式化的 `model` 的知识。这一过程可以解释为使用数据对 `model` 进行 `learning`。由于 `model`\
  \ 学习是通过使用计算机器进行数据处理来执行的，因此 `model` 与其计算机实现之间的概念差异相应消失，导致一种自然的信念，即学习的客体是计算机器。这种方法解释了\
  \ `Machine Learning` (`ML`) 的出现，这是一个术语甚至是一门科学，其出发点是数学统计、优化、数值方法和信息技术的理论基础。\n\n通常，机器学习的一般问题被分解为以下三类问题：分类（将对象分配到适当的仓库）、聚类（将或多或少同质的对象分组）和动态回归（恢复因果数据与效应数据之间的关系）。机器学习的关键阶段是对这些问题解决方案的可能变化进行\
  \ `prediction`。根据现代理解，机器学习产生的是“学习”到的确定性模型，并配备了经验概率可靠性估计。因此，问题涉及经验概率机器学习。\n\n本书发展了机器学习的一个新分支，称为\
  \ `Randomized Machine Learning` (`RML`)，\n\n实际解决这些问题需要一个工具包，一方面集成了数学和算法方法，另一方面面向高性能计算系统的软件实用程序。计算机机器的资源和能力每年翻一番。因此，巨量的数据被积累和存储，既有自然格式也有数字格式，例如，目前积累的数据量达到数十亿\
  \ petaflops。存在大型数据中心，旨在在很长一段时间内积累和存储这些数据。除了存储之外，对积累的数据该做什么？科学界正在努力勾勒出处理和利用这些数据的方法。\n\
  \n一种可能的方式由 G. Piatetsky-Shapiro 于 1991 年提出，作为 `Data Mining (DM)` 的概念；参见 [55, 191]。在此概念中，建议在用户友好的信息技术环境中整合数学统计和概率论的不同方法，而与知识的定性描述、也许定量描述以及适当的数据数组相关联的基本问题的陈述则留给研究者。开创性的数据挖掘实验发现了数据的一系列负面特征（错误、可靠性、充分性、使用不同尺度、时间不规则性等），这使所得知识的可信度受到质疑。这些特征对于大量异构数据变得更加重要。这种数据在广义上的验证被证明是一个严峻的挑战。\n\
  \n\n\n\n\n# 数据科学与机器学习概述\n\nThe data problem magnetized a part of the scientific\
  \ community so much that the first volume of *Journal of Data Science* appeared\
  \ in 2002, announcing a new branch of science called *Data Science* (*DS*). This\
  \ branch was intended to absorb *all* sciences related to data usage and processing.\n\
  \nIn 2008, *Nature* editor C. Lynch prepared a special issue \\[28\\] devoted to\
  \ the problem of large amounts of data, formulating the concept of *Big Data* (*BD*).\
  \ It was expected to develop an information technology environment with processing\
  \ methods for the large arrays of numerical, audio, video and text data.\n\nThe\
  \ physical core of all concepts involving data is a computing machine implementing\
  \ computational algorithms for data processing and knowledge extraction. The necessary\
  \ tool kit forms the subject of the ML concept, which is based on the methods and\
  \ algorithms of probability theory and statistics, optimization, automata theory\
  \ and discrete mathematics, theory of dynamic systems, and more. Even this short\
  \ list of related disciplines shows that the ML concept is to create a synthetic\
  \ tool kit for solving data processing problems.\n\n*ML* has a history of over 60\
  \ years and a rich experience in solution of many problems. The first publication\
  \ on the subject dates back to 1957 when F. Rosenblatt created the MARK I perceptron;\
  \ see \\[156\\]. The notion of empirical risk, which is the basis for the *ML* procedures,\
  \ was introduced by Ya. Tsypkin in the monograph \\[176\\]. A fundamental tool to\
  \ form empirical risk is the so-called *Vapnik–Chervonenkis dimension* (*VC dimension*)\
  \ suggested by the authors in \\[179\\]. The method of potential functions for the\
  \ classification and pattern recognition problems was published in 1970; see \\\
  [12\\]. We also refer to the monographs \\[57, 21\\] popular in the ML community.\n\
  \nThe modern *ML* concept employs the *deterministic* parametrization of models\
  \ and estimates using data arrays with hypothetical properties. The quality of estimation\
  \ is characterized by empirical risk functions, and minimization yields the corresponding\
  \ optimal estimates in terms of the chosen empirical risk; the details can be found\
  \ in \\[180\\].\n\nGenerally, real problems solved by *ML* procedures are immersed\
  \ in an *uncertain environment*. If the matter concerns data, they are obtained\
  \ with errors, omissions and dubious validity. Model design and parametrization\
  \ is a subjective non-formalizable process that depends on the individual knowledge\
  \ of a researcher. Therefore, a mass application of *ML* procedures causes a rather\
  \ high uncertainty. Empirical risk minimization gives parameter estimates for an\
  \ existing data array within an adopted parameterized model; in other words, these\
  \ estimates are conditional. There is no clarity about their behavior with other\
  \ data arrays or within another parametrization model.\n\nDue to the above-mentioned\
  \ circumstances, it is necessary to simulate the uncertainty somehow. An approach\
  \ involves *randomized* uncertainty simulation, which stems from a randomized representation\
  \ of model parameters and data measurement errors. This means that model characteristics\
  \ are assumed to be random whereas data are assumed to contain random errors. In\
  \ contrast to the existing ML procedures, such randomized machine learning (RML)\
  \ procedures give best estimates for the probability density functions (PDFs) of\
  \ the random parameters and measurement noises under maximum uncertainty (entropy).\n\
  \nThis book suggests using **information entropy** to characterize the quality of\
  \ learning under uncertain conditions. In a series of works \\80, 157, [81\\], E.\
  \ Jaynes demonstrated two principal properties of entropy that were reflected by\
  \ the RML procedures. First, by the first law of thermodynamics, entropy is a natural\
  \ functional describing the processes of universal evolution. Second, by the second\
  \ law of thermodynamics, entropy maximization yields the worst state of the evolutionary\
  \ process under the worst external influences on it. Since randomization is a model\
  \ of uncertainty, the RML procedures with entropy as Shannon's measure of uncertainty\
  \ \\[165\\] allow us to obtain solutions under maximum uncertainty.\n\nThis book\
  \ includes ten chapters covering the general issues of data generation and qualitative\
  \ specifics, as well as the theoretical foundations of randomized machine learning\
  \ and its applications to the problems of classification and dynamic regression.\n\
  \n# Chapter 1\n\nChapter 1 is of methodological character, discussing machine learning\
  \ problems in general as a tool for knowledge extraction and further transformation\
  \ into solutions. We consider the structure of a machine learning procedure that\
  \ represents a man-machine system with feedback. The basic elements of this system\
  \ are data blocks, parameterized models and algorithms. We introduce the main notions\
  \ related to these blocks in a rigorous way. Data arrays are described by a fixed-dimension\
  \ matrix consisting of the vectors of observable input variables or by a matrix\
  \ containing a “sliding” set of vectors. A parameterized model is defined by a parameterized\
  \ input–output mapping with a formal description in terms of a vector functional\
  \ whose properties have a close relation to the qualitative peculiarities of a corresponding\
  \ applied problem. In addition, we introduce the notions of deterministic and probabilistic\
  \ ML algorithms that are used for model parameter estimation. In the former case,\
  \ these are empirical risk minimization algorithms and in the latter case, likelihood\
  \ maximization algorithms (or relative likelihood minimization algorithms). Section\
  \ 1.4 presents the main material of this chapter, devoted to the concept of a randomized\
  \ machine learning procedure based on maximization of an information entropy functional\
  \ on a set configured by an existing data array. The information entropy functional\
  \ is defined on the class of probability density functions for the characteristics\
  \ of the parameterized model and measurement noises that simulate data errors. Finally,\
  \ we discuss the relation between the maximization principle of the information\
  \ entropy functional and the minimization principle of the log-likelihood ratio.\
  \ Several examples illustrate the cognitive capabilities of randomized models.\n\
  \n# Chapter 2\n\nChapter 2 deals with data, to be more precise, data sources and\
  \ primary data processing. We consider analog and digital data sources. Analog sources\
  \ generate deterministic and also random functions. Some background on the classes\
  \ of deterministic and random functions is given, with focus on analog-to-digital\
  \ conversions. Such conversions (amplitude and time quantization) cause errors.\
  \ According to standard assumptions, they are random with definite probability density\
  \ functions. We also estimate quantization errors. Certain types of digital data\
  \ are studied, namely, audio, graphical and text data as well as official government\
  \ statistics. The technology used to generate data depends on their nature. In particular,\
  \ audio data conversion is often performed by a pulse-code modulator with subsequent\
  \ spectral representation using the discrete Fourier transform. There exist two\
  \ methods to convert images into digital form—bit image graphics (arrays or matrices\
  \ of pixels) and vector graphics (mathematical models of primitives). A special\
  \ class of data is texts, as their digital representation contains word-usage frequency\
  \ characteristics and also semantic features. Among important primary data processing\
  \ methods, we mention restoration methods for missing data and reduction methods\
  \ for data arrays. In the former group of methods, our analysis covers the methods\
  \ of interpolation, design of auxiliary models and entropy decomposition.\n\n\n\n\
  \n\n# 第三章\n\n为模型学习准备数据的一个重要阶段是降低其维度。该阶段在第三章中进行了讨论。更具体地说，第三章中概述了常见的数据降维方法，例如数据矩阵的奇异分解、PCA\
  \ 和随机投影。第三章特别关注直接和逆投影的方法及其以顺序和并行过程形式实现的问题。投影矩阵通过最小化 Kullback–Leibler 散度进行优化，同时考虑对数据矩阵施加的信息容量约束。降维中的一个关键问题是估计其在求解\
  \ RML 问题时的效率。考虑了用于预测和二元分类的线性模型的效率估计技术。第三章的最后一段专门讨论熵随机投影方法，其中投影矩阵被假定为随机。引入了数据矩阵的紧凑性指标的概念，即其行之间的平均距离。将投影矩阵的概率密度函数的优化问题表述为在对投影矩阵的紧凑性指标施加约束的条件下最大化相应的熵泛函的问题。考虑了该方法的一种改进，其中已知的投影矩阵是从给定集合中随机选择的。\n\
  \n# 第四章\n\n第四章专门讨论 RML 过程中的随机参数模型。随机模型的一个区别特征使其成为一个独立类别，即其输出形式为随机向量的集合或随机轨迹。我们考虑随机参数模型（RPMs）的两个子类，即单输入-集合输出模型和（单输入，反馈）-集合输出模型。两个子类的\
  \ RPM 都使用参数化向量泛函来描述，其性质（连续性、可微性、有界性等）与被建模对象的性质一致。我们研究了具有区间型参数的线性和非线性版本（幂和多项式非线性）。由于\
  \ RPM 的输出是随机事件的集合，我们引入经验概率特征（经验均值、方差、PDF、中位数、*α*\\-分位数、置信区间和概率）以及 *k*\\-矩和 *k*\\\
  -均值特征用于定量评估。\n\n# 第五章\n\n在阅读了第一章–第四章之后，读者将进入第五章，该章详细处理了模型参数和测量噪声的 PDF 的熵鲁棒估计问题。该问题是\
  \ RML 过程的核心。RPM 可能具有所谓的原始参数，属于 *n*\\-维平行六面体，以及属于 *n*\\-维非负单位立方体的相对非负参数。测量误差也适用相同的分类。参数和噪声由相应的\
  \ PDF 刻画。输出数据数组与 RPM 的输出集合的数值特征，即其 *k*\\-均值保持平衡。熵鲁棒估计算法被表述为一个泛函熵线性规划问题。我们证明该问题属于\
  \ Lyapunov 型优化问题类；因此，可以使用 Gateaux 导数和 Lagrange 乘子求解。我们建立了相应估计问题的最优性条件，从而得出由 Lagrange\
  \ 乘子参数化的最优 PDF 的结构表示。后者由以通用形式书写的平衡方程的解定义。这些方程的一个特点在于所谓的积分项，即确定 RPM 的输出集合的 *k*\\\
  -均值特征的参数化 Riemann 积分。\n\n# 第六章\n\n第六章考虑了 RPM 的一种特殊情况——具有非随机化参数的模型。回顾一下，不确定的模型参数和测量噪声位于给定区间内。因此，它们可以转换为属于非负单位立方体的非负辅助变量。这些变量被解释为原始参数和噪声属于相应原始区间的概率。换句话说，辅助变量（属于的概率）是非随机化的，因此参数化模型输出的向量或轨迹由这些概率的值定义。用于估计属于概率的\
  \ ML 算法被表述为在由经验平衡方程定义集合上信息熵的约束最大化问题。ML 算法的性质取决于所考虑的参数化模型类。如果模型是线性的，则 ML 算法简化为熵线性规划问题。在一般情况下，它简化为熵非线性规划问题。\n\
  \n# 第七章\n\n第七章集中于随机机器学习的计算方法，旨在求解 RPM 的泛函熵线性规划问题以及熵非线性规划问题，以估计非随机化模型参数属于相应区间的概率。这些问题的最优性条件被表述为非线性经验平衡方程。对于泛函熵线性规划问题，这些方程包含积分项。我们的思路是通过最小化残差函数来求解方程，即解被简化为在紧集上的最小化问题。该问题有一些特殊性：关于目标残差函数的信息以其算法计算的值的形式提供。相当一部分计算包括使用\
  \ Monte Carlo 方法对非线性指数函数进行数值积分。我们估计了实现给定精度所需的随机序列的大小。残差最小化问题被视为在由连续函数的不等式系统定义的紧集上的全局最小化问题的特例。该系统的求解过程也采用\
  \ Monte Carlo 方法，更准确地说，采用分组 Monte Carlo 迭代。该过程生成具有非负单位立方体上均匀分布的随机向量包，对所得向量进行过滤以构建属于可接受紧集的向量包，并为每个包选择记录。通过分析记录序列，我们估计残差函数的某些数值特征（Hölder\
  \ 常数）。所述算法具有几乎必然收敛性（概率为 1）。在有限次迭代下，我们计算精确全局最小值的 *r*\\-邻域以及迭代过程达到该邻域的概率。熵非线性规划问题使用具有\
  \ *p*\\-活动变量的乘法算法求解。最后，研究了其收敛性（包括收敛速率）并给出一系列示例。\n\n\n\n\n\n`RML` 算法为模型参数和测量误差的 `PDFs`\
  \ 提供了熵最优估计。`RML` 过程的下一阶段是利用最优 `PDFs` 生成随机参数和测量噪声。一般来说，这个问题是 `Monte Carlo` 方法的传统问题。关于生成具有经典\
  \ `PDFs`（`Gaussian`、均匀等）的随机序列，已有大量文献。困难在于需要生成具有任意形式给定 `PDF` 的随机序列和随机向量时出现。这些困难对于高维随机向量更为明显。\n\
  \nChapter 8 专门讨论具有任意形式给定 `PDFs` 的随机向量生成问题。本章首先综述了具有某些典型 `PDFs` 的随机序列的现有生成方法。主要关注的是\
  \ `Metropolis–Hastings` 算法，作为生成具有给定 `PDF` 的随机向量的最流行方法。我们提出了一种基于给定 `PDF` 的逐步逼近以及随后利用随机混合形成均匀分布随机向量的新生成方法。逼近阶段包括以下两个步骤。第一步是选择覆盖\
  \ `PDF` 支持的最优网格大小。这里的优化是通过计算 `PDF` 的 `Lipschitz` 常数来实现的。第二步处理逐步逼近问题，即选择在网格节点上替代\
  \ `PDF` 真实值的常数。我们考虑了该选择的两种方案，即最小化积分二次误差泛函的常数以及网格节点角值的平均常数。在结束 Chapter 7 时，我们展示了所建议方法的实验仿真结果，将其与\
  \ `Metropolis–Hastings` 算法在三个轻量级 `PDF` 测试上进行比较——`Gaussian` 分布、`Laguerre` 分布和伪伽马分布。\n\
  \n`RML` 问题被简化为计算密集型过程，需要大量资源。Chapter 9 描述了一种信息技术和软件工具的总体架构，用于开发实现 `RML` 过程的计算环境。所建议的架构是异构的，保证了对不同类型计算设备的有效利用。我们考虑了实现\
  \ `RML` 过程的信息技术及其软件模块，用于解决全局优化问题、生成具有给定 `PDF` 的随机向量以及对随机化预测集合进行统计处理。\n\nChapter\
  \ 10 演示了如何使用 `RML` 过程进行熵分类。更具体地说，我们研究了将异构对象分类为两个类别的分类问题，其中分类是针对现有数据阵列以熵最优概率进行的。在某种意义上，软分类是对硬分类的一种替代，在硬分类中，对某一类别的归属是唯一确定的。在不确定的条件下（机器学习问题中很常见），硬分类往往会造成相当大的误差。随机化软分类过程使用具有随机参数的神经网络作为\
  \ `RPM`，嵌入到由一组独立随机向量描述的带误差的测量加性模型中。`RML` 算法被表述为神经网络参数和测量误差的连续可微 `PDFs` 类上的泛函熵线性规划问题。我们提出了一种基于\
  \ `Monte Carlo` 方法实现上述熵最优 `PDFs` 的对象归属概率求解程序。最后，提供了几个数值示例来说明新的软分类方法。\n\nChapter\
  \ 11 考虑了 `RML` 过程在动态回归和随机化预测中的应用。恢复变量组之间动态关系的特征是一类广泛的问题，既存在于理论研究背景下，也存在于应用中。这项研究的实用目标是基于变量之间的动态关系进行预测，而不是寻找关系本身。我们研究了在人口统计和宏观经济研究某些领域出现的动态回归问题的例子。特别关注世界人口的随机化动态模型和能源系统中电力负荷的预测。\n\
  \n本书的材料是在多年积累中形成的，伴随着信息熵最大化方法的发展及其在科学和工程不同领域的应用。我们认识到我们的研究实际上是机器学习（更具体地说，是一个名为随机化机器学习的新分支）是最近形成的。由于信息熵是表征随机参数\
  \ `PDFs` 的自然泛函，它可以用作变分原理的泛函，意义如下：最佳 `PDF` 对应于最大信息熵。另一方面，信息熵被解释为不确定性的度量。这两种信息熵的基本属性的整合产生了随机化（熵最优）解的概念。\n\
  \n作者感谢 B.T. Polyak 教授和 B.S.Darkhovsky 教授富有成效的讨论，这些讨论促进了作者对随机化机器学习概念的系统理解，并且（同样重要）使作者免于潜在的错觉和错误。本书的出版离不开尤戈尔斯克信息技术研究所及其所长\
  \ S. 博士、A.B. Melnikov 教授的支持。特别感谢 A.S. Aliev，Cand. Sci. (Eng.)，进行实验研究。\n\n最后，作者对\
  \ A.Yu. Mazurov，Cand. Sci. (Phys.-Math.) 表示感谢，他仔细翻译了俄文文本，并提供了持续的反馈和与出版商的谈判。\n\n\
  代表作者，\n\nYuri S. Popkov\n\nMoscow, 2022\n\n# CHAPTER 1 GENERAL CONCEPT OF MACHINE\
  \ LEARNING\n\nDOI: [10.1201/9781003306566-1](https://doi.org/10.1201/9781003306566-1)\n\
  \n机器学习过程是生成面向问题的支持不同决策的信息工具箱的核心要素。这些过程形成中的一个重要方面是在由对真实对象或现象运行的不完美知识以及各种数据缺陷（误差、不完整、遗漏等）引起的不确定性下对其进行结构化。在本章中，我们将机器学习工具箱分为三种方法论方法，每种方法都基于根本不同的原理——确定性、概率性和随机化。第一种方法涉及确定性模型、测量数据阵列和非随机参数估计。第二种方法基于模型参数和测量噪声的随机起源假设及其概率特征，用于构建非随机参数估计。在这两种方法中，被学习模型保持确定性，其参数值是学习得到的最佳估计。最后，第三种方法源于模型参数和测量噪声的人工随机化以及对其\
  \ `PDFs` 的估计。\n\n## 1.1 Transformation of Knowledge into Decisions\n\n\n\n\n\n一个个体必不可少、有用且有时是喜爱的活动就是做出短期、中期和长期的决策。与此同时，我们希望了解个体的准则，即其做出某项决策的动机背景。不幸的是，并不存在发现这种背景的通用或科学依据的方法。也许这种方法原则上是不可能的，因为个体决策是个性化的，其动机是隐含的。即使是提问程序或民意调查技术也无法保证个体在回答时是坦诚的。表面上看，人们可以考虑某些集体（平均）决策及其动机。\n\
  \n个体的决策会影响物质、自然和精神世界中的某些对象，从而改变其时空状态。个体的动机机制与这些过程并行演化，但时间尺度不同。结果是出现了新的决策，往往由其他动机引起。\n\
  \n换句话说，动机及其所基于的决策在循环程序 `M`→`D`（*动机–决策*）中相互作用，反馈回路 `FL` 是其“结构”的关键要素。`M`→`D` 程序的功能阶段及其顺序在\
  \ 图 1.1 中示出。\n\n![Figure 1.1](img/fig1_1.jpg)\n\nFigure 1.1\n\n个体动机（`IM`）构成了决策过程（`DM`）的基础，该过程聚焦于所研究对象（`O`）或问题的演化。这导致对象中出现信息，特别是以新数据（`D`）的形式出现，新数据补充了对其的现有知识（`K`）。让我们接受一个“大胆”的假设，即动机建立在个体积累的知识之上。在后续内容中，知识将被解释为一种抽象的智力基础，其中包括功利理解上的知识、作为大脑皮层下过程产物直觉、个人和公共经验、关于对象的数据等等。然而，知识是一种被动物质，本身不会激活动机。利用知识，有必要形成世界图景，即为决策建模当前情况。模型源于现有数据与个体对其情况特征的信念的结合。代表动机原因因素的情况是一组模型的某些可测量特征（*参数*）及其之间的关系。\n\
  \n为了根据可用数据对模型进行定量描述，模型参数必须进行 *估计*。在这种情况下，可以解决不同的问题并预测其未来趋势。`M`→`D` 循环的反馈回路由机器学习（`ML`）程序实现，该程序具有设计定量模型和组织动机决策信息支持所需的工具包。\n\
  \n因此，`ML` 程序在 `M`→`D` 转换中找到了方法论、算法和信息技术层面的内容，如 图 1.1 所示。\n\n从一开始就请注意，这一逻辑链条仅仅是本专著中富有成效的动机机制的一个版本，并不声称具有普遍价值。\n\
  \n作为一个例子，似乎很合适考虑用于个体交通行为建模的 `M`→`D` 程序 \\[125\\]。实现这种行为的众多行为实际上构成了城市交通网络中的交通流。\n\
  \n在这里，将分析交通行为的两个方面，即个体行为和集体行为。前者基于个体对交通工具、出行目标和路线的动机。这些动机可以与出行时间、成本、舒适度水平和其他特征相关。存在众多影响个体动机的因素。它们可以针对每个个体而具体。因此，个体动机的环境本质上是不确定的。\n\
  \n另一方面，交通工具使用者（包括私人交通和公共交通）非常多，他们的动机和交通决策是独立的。因此，随机框架适合于模拟相应的不确定性。实际上，我们无法追踪每个个体的动机和决策，但可以通过个体动机的某些指标来表征其集体动机。由于不确定性模型的随机性，这些特征是概率性的，更具体地说，是交通事件的概率分布函数。交通事件的广泛指标是出行时间。就该指标而言，集体动机由所谓的再安置函数表征，该函数描述了个体按出行时间的分布。经过归一化后，该函数可以被视为出行时间利用的概率分布函数。\n\
  \n上述指标反映了某些平均个体固有的集体动机。但它们与对当前交通状况的真实评估及其预测无关。然而，前者和后者是交通决策的不可分割的组成部分。不可能为每个个体考虑这些组成部分的程序部分。我们只能研究集体决策，例如路线的选择。如果从某个地点存在一组有限的可接受路线，则路线选择的概率可以是估计和预测的聚合结果。\n\
  \n`M`→`D` 程序的另一个例子是人口与经济在人口经济系统中的相互作用过程（图 1.2(a)–c）。由于智力，人口是自我发展的工具，这导致了不同类型人类活动的产生。经济活动代表其中一种类型。据假设，经济动机个体是自我发展的主要工具。\n\
  \n![Figure 1.2](img/fig1_2.jpg)\n\nFigure 1.2\n\n参与经济活动，人口依赖于其结果。评估经济状况和预测决策可能后果在这个过程中发挥关键作用。人口的内部状态也会相应改变。\n\
  \n存在一种包含人口和经济活动的闭环，其中包含评估、预测和反馈。请注意与动机和决策相互作用程序的明显类比；参见 图 1.1 中的结构图。\n\n经济作为宏观对象将资源转化为产品（见\
  \ 图 1.2(a)）。劳动，即人们在经济领域的劳动活动，是资源。经济生产并被人口消费的某种产品（以某种形式，见 图 1.2(b)）改变了人口的结构——其内部聚类和定量形式，以及群体的状态。结果，其他不同规模的群体在发展的新螺旋中参与经济过程。\n\
  \n\n\n\n\n因此，可以谈论一个整体的人口-经济（`PE`）系统，该系统由人口（`P`）子系统和经济（`E`）子系统组成，二者形成闭环，如图 1.2(c)所示。对该整体系统进行分析的一个重要领域涉及情势评估（状态估计）和预测，即随时间推移的演化。对每个子系统，这些问题由相应的科学研究。例如，人口的结构动态是宏观人口学的主题。一大批经济学科（政治经济学、宏观和微观经济学、数理经济学等）研究经济结构的形成和演化。注意，影响人口子系统中不同过程的经济因素在宏观人口学中被视为与元系统影响相关的外部因素。实际上，在经济学科中也出现了类似的情况。经济子系统的行为是在人口子系统再生产一定数量和结构的劳动资源这一条件下研究的。\n\
  \n特别地，人口学研究的一个流行方向是在给定的经济情景下预测人口状态指标，该情景以定量形式描述[40]。而且，这些情景反映了某些经济目标，这些目标（通常）与预测期内人口的潜在变化无关。但这些变化会显著影响要实现经济发展的指标。上述反馈关系客观存在，试图忽视它往往会导致无法实现的预测。\n\
  \n另外，请注意该对象的另一个特点，该对象使用 `ML` 程序进行估计和预测。其每个部分都有内部行为（在没有元系统影响的情况下）和受扰行为（在元系统施加的某些影响下）。在此背景下，我们指的是状态（平衡、循环、吸引子等）、其稳定性和其他属性。然而，当人口和经济子系统联合成一个整体系统时，后者可能获得与这些部分初始属性不同的新属性。这种系统效应特别体现在每个子系统内部存在非线性关系的情况下，以及一个子系统影响另一个子系统的通道中存在非线性的情况下。结果，整体系统可能具有其他平衡以及其他非平衡过程。对于这样的系统，状态估计和预测实际上不是一个平凡的问题。这里由于环境的不确定性水平很高而出现了额外的困难，对于单独的子系统以及整个系统都是如此。这种不确定性的来源是个体，即两个子系统的主要组成部分，具有其动机、社会和职业特征以及行为反应。\n\
  \n因此，似乎这里的情况与之前的例子相似。人口-经济系统无法复制，即在该系统中运行的内部过程即使在相同的操作条件下也不会重复。该系统是自发展的，这排除了其过程的真实重复性。因此，伴随人口-经济系统运行的不确定性是通过使用可用信息进行参数估计的仿真模型再现的。\n\
  \n## 1.2 机器学习程序的结构\n\n嵌入 `ML` 程序中的方法和算法相当多样。然而，它们都具有相同的 methodological 方向和结构。后者被理解为将知识转化为信息决策支持的功能阶段序列。该程序的结构如图\
  \ 图 1.3 所示。该程序包括以下四个阶段。\n\n![Figure 1.3](img/fig1_3.jpg)\n\nFigure 1.3\n\n第一阶段（`PM`）在于开发一个数学模型，该模型描述所研究对象的运行机制及其输入输出的测量模型。对象的数学模型将其知识转化为具有明确特征列表的结构。该阶段不能在如此一般的陈述中被形式化。然而，通常存在关于对象类别和需要使用数学框架建模的问题的先验信息。这里“类别”是指具有一组共同属性的对象或问题的集合。如果该集合已知，则可以为相应类别构建概念模型[68]。这样的模型由相互关联的概念列表组成，这些概念描述了给定类别，连同这些概念的属性、特征和分类。概念建模的一个重要组成部分是反映给定类别对象内部运行过程的规律性[16]。换句话说，概念模型系统化和结构化了关于所研究对象类别和问题的现有知识。形成此类类别是一个非平凡的问题，其复杂性本质上取决于其描述中的抽象程度。例如，系统总论操作抽象集合及其关系（分层系统、反馈等）[119]。通过这种描述性方法产生的类别具有相当高的能力（因为它们包含了大量系统），但其概念模型通常是不可构造的。相反，任何试图向抽象类别添加特定属性的尝试都会降低新类别的能力，尽管在构造性意义上会产生更好的概念模型。一个很好的例子是受控技术系统类别[91]。\n\
  \n在大多数情况下，概念模型表示一个图，其中节点对应于其功能元素，弧对应于它们之间的相互关系。事实上，这种对概念模型的理解首次在[54]中引入。进一步复杂化和更深入地具体化不同系统类别固有的属性，勾勒出向更有效的描述的逐渐过渡，即称为本体[169]的专门结构化列表。尽管如此，图形和本体对类别的描述仍保留在功能元素的水平上。这些元素使用各种数学工具进行描述，具体取决于其运行机制中嵌入的规律性以及其特征。在\
  \ `parametric characteristics` 的情况下，元素的数学模型是函数关系（用于描述静态元素）或不同类型的微分方程系统（用于描述动态元素）[50,\
  \ 161]。一种相当有效的静态关系参数化方法涉及神经网络[96]。这些模型的基本元素和参数调优算法的相对简单性使得神经网络能够用于高维空间。\n\n有时，为方便起见，对象的动态使用具有\
  \ `functional characteristics` 的数学模型来描述。例如，该类别包括由积分方程或函数级数定义的模型[111, 137, 146, 152]。在这些模型中，函数特征由积分方程的核或函数级数扮演。\n\
  \n\n\n\n\n对于有限状态对象，合适的模型是自动机 [72, 107]、非线性顺序机 [18, 177]，以及按照一定规则运行的动态智能系统 [126]。\n\
  \n本阶段的一个重要要素是对测量进行建模。对象的输入和输出的实际测量包含误差，因此有必要以某种方式模拟它们。根据标准假设，独立随机过程是对测量误差来源的相当充分的模拟模型。存在两种对误差对对象模型可观测输出影响的结构表示，即加性和乘性。适当表示的选择取决于用于测量对象输出和输入的设备的设计特性。\n\
  \n`ML` 过程的第二阶段 (`PE`) 用于利用作为 *learning* 序列生成的真实数据来估计数学模型的特征。事实上，该阶段可以用众多方法实现。如果模型特征是不确定参数，则相应的估计方法构成了数理统计\
  \ [11, 34, 90] 的研究对象。当数学模型具有函数特征时，例如积分方程的核或函数级数的脉冲响应特征，就会产生日益复杂化的估计问题。当然，在这种情况下可以对估计问题进行有限维近似。但这种方法往往导致所得近似的维数很高，从而需要更大的关于对象运行的数据量。\n\
  \n`ML` 过程将估计问题视为相对于模型相应特征，即参数或函数，经验风险泛函的最小化。这里“经验”一词意味着该泛函是为学习序列设计的。对对象输入和输出的数据包赋予了重要作用。在模型特征固定的情况下，输入数据用于生成其输出，然后在经验风险泛函方面与真实输出进行比较。该泛函取决于模型特征，因此其变化也会影响泛函的值。经验风险最小化产生模型特征的估计。这样计算出的模型及其特征对于所考虑的学习序列和泛函是\
  \ *optimal* 的。\n\n在 `ML` 过程的第三阶段 (`MT`) 中，优化的“学习”模型在其他回顾性输入和输出数据包上进行测试。测试在于根据所接受的准则，将对象的真实输出与优化模型生成的输出进行比较。如果优化模型在测试数据包上表现出令人满意的质量水平，则该模型可在正常运行模式下使用。\n\
  \n`ML` 过程的最后一个（第四）阶段（`MI` 阶段）旨在积累经验，即为 `PM` 阶段的参数化模型的结构修正以及为 `PE` 阶段的估计算法的改进提供新的知识。\n\
  \n请注意，该过程在不确定性下运行，该不确定性由对所研究对象及其数学模型的有限知识、包含对象运行信息的有限大小的学习序列、测量误差等引起。因此，`ML` 过程的每个阶段都基于关于不确定性性质的某些假设。\n\
  \n## 1.3 机器学习过程的主要概念\n\n如 `Fig. 1.3` 中的框图所示，`ML` 过程由四个阶段组成，即模型的选取和参数化（`PM` 阶段）；形成输入（原因）和输出（效应）数据阵列并使用这些阵列估计模型参数（`PE`\
  \ 阶段）；形成用于优化模型测试的数据阵列（`MT` 阶段）；以及生成优化模型（`MI` 阶段）。\n\n如前所述，第一阶段——*模型的选取和参数化*——是非形式化的，仅涉及对所研究对象、现象或问题的可用知识。该选择给出\
  \ *n* 维输入向量 $\\overset{\\rightarrow}{x}(t) \\in \\mathfrak{X},$ 的元素，其中 \U0001D51B\
  \ 表示输入函数空间，以及 *m* 维输出向量 $\\overset{\\rightarrow}{y}(t) \\in \\mathfrak{Y},$ 的元素，其中\
  \ \U0001D51C 表示输出函数空间；*t* 是标量参数。\n\n这些向量的元素可以在连续时间 *t* ∈ \U0001D4AF = [*t*[0], *T*]\
  \ 中测量，也可以在离散时间中以任意步长 $\\left\\{ t_{0},t_{1},\\ldots,t_{s} \\right\\} \\in \\widetilde{\\\
  mathcal{T}},$ 测量，或以固定步长 *h* $\\left\\{ t_{0},t_{0} + h,\\ldots,t_{0} + sh \\right\\\
  } \\in {\\widetilde{\\mathcal{T}}}_{h}.$ 暂时考虑最后提到的测量方案，它产生输入和输出数据的二维阵列，其大小分别为 (*n* × *s*)\
  \ 和 (*m* × *s*)，即\n\n$$\n\\begin{array}{r} {\\mathbb{X} = \\left\\{ {\\overset{\\\
  rightarrow}{x}}^{(0)},\\ldots,{\\overset{\\rightarrow}{x}}^{(s)} \\right\\},\\quad\\\
  quad\\mathbb{Y} = \\left\\{ {\\overset{\\rightarrow}{y}}^{(0)},\\ldots,{\\overset{\\\
  rightarrow}{y}}^{(s)} \\right\\}.} \\\\ \\end{array}\n$$\n\n(1.1)\n\n此外，定义以下包含当前\
  \ *ϱ* 个测量向量的输入阵列：\n\n$$\n\\begin{array}{r} {\\mathbb{X}_{\\varrho}^{(j)} = \\left\\\
  { {\\overset{\\rightarrow}{x}}^{(j - \\varrho)},{\\overset{\\rightarrow}{x}}^{(j\
  \ - \\varrho + 1)},\\ldots,{\\overset{\\rightarrow}{x}}^{(j)} \\right\\},\\quad\\\
  quad\\varrho \\leq j \\leq s.} \\\\ \\end{array}\n$$\n\n(1.2)\n\n在第一阶段，还使用向量泛函 *Ω̂*\
  \ 的相当一般描述来选择具有参数 $\\overset{\\rightarrow}{a} \\in R^{p}$ 的模型，该泛函将输入空间 \U0001D51B\
  \ 映射到输出空间 $\\hat{\\mathfrak{Y}}$ 如下：\n\n$$\n\\begin{array}{r} {{\\hat{\\overset{\\\
  rightarrow}{y}}}^{(j)}(\\mathbb{X}_{\\varrho}^{(j)},\\overset{\\rightarrow}{a})\
  \ = \\hat{\\Omega}\\left( {\\mathbb{X}_{\\varrho}^{(j)},\\overset{\\rightarrow}{a}}\
  \ \\right).} \\\\ \\end{array}\n$$\n\n(1.3)\n\n在此表达式中，变量 *ϱ* 是影响输出向量的输入向量的数量。如果\
  \ \U0001D71A > 0，则所考虑的泛函表征所研究对象、现象或问题的动态特性，即某种意义上的“记忆”。在 \U0001D71A = 0 的情况下，模型在第\
  \ *j* 次观测（测量）中的输出仅取决于第 *j* 次观测（测量）中的输入向量。这种关系对于静态对象、现象或问题是典型的。\n\n模型 (1.3) 的参数 $\\\
  overset{\\rightarrow}{a}$ 被假定为 *deterministic* 但值未知。这些值是利用 `ML` 算法基于可用数据和关于其先验性质的某些假设来估计的。`ML`\
  \ 算法执行某些泛函的最小化，这些泛函具有定性解释，并源自所接受的假设。请注意，无论选择何种泛函，`ML` 算法都为模型的确定性特征产生估计。\n\n其中一种假设将数据和参数视为实数或整数的\
  \ *deterministic* 集合，而不对它们的性质做出额外假设。然后，模型参数的最优估计以 *vector loss function* 的形式进行\n\
  \n\n\n\n\n$$\\\\begin{array}{r} \\\\left. {\\\\overset{\\\\rightarrow}{e}}^{(j)}(\\\
  \\overset{\\\\rightarrow}{a}\\\\, \\\\middle| \\\\, X^{(j)},{\\\\overset{\\\\rightarrow}{y}}^{(j)})\
  \ = {\\\\overset{\\\\rightarrow}{y}}^{(j)} - {\\\\hat{\\\\overset{\\\\rightarrow}{y}}}^{(j)}(X^{(j)},\\\
  \\overset{\\\\rightarrow}{a}),\\\\quad j = \\\\overline{1,s}, \\\\right. \\\\\\\\\
  \ \\\\end{array}$$  \n\n(1.4)\n\nand the closeness of the PM output to the output\
  \ data of the object is characterized by its norm known as *the empirical risk*,\
  \ i.e.,\n\n$$\\\\begin{array}{r} \\\\left. \\\\mathcal{Q}\\_{X,Y}(\\\\overset{\\\
  \\rightarrow}{a}) = \\\\frac{1}{s}{\\\\sum\\\\limits\\_{j = 1}^{s}{\\\\|{\\\\overset{\\\
  \\rightarrow}{e}}^{(j)}(}}\\\\overset{\\\\rightarrow}{a}\\\\, \\\\middle| \\\\,\
  \ X^{(j)},{\\\\overset{\\\\rightarrow}{y}}^{(j)})\\\\|. \\\\right. \\\\\\\\ \\\\\
  end{array}$$  \n\n(1.5)\n\nThe empirical risk minimization methods are defined by\
  \ the family of ML algorithms [53, 106, 188] in which\n\n$$\\\\begin{array}{r} {\\\
  \\hat{\\\\overset{\\\\rightarrow}{a}}(X,\\\\overset{\\\\rightarrow}{y}) = \\\\arg\\\
  \\min\\\\mathcal{Q}\\_{X,Y}(\\\\overset{\\\\rightarrow}{a}).} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(1.6)\n\nAn additional hypothesis about the properties of the data and parameters\
  \ often lies in the assumption that the data *Z* = (*X*, *Y*) and the parameters\
  \ $\\\\overset{\\\\rightarrow}{a}$ are *random objects* with a joint probability\
  \ density function $P(Z,\\\\overset{\\\\rightarrow}{a}).$ Here *Z* denotes the universe\
  \ of data and $\\\\overset{\\\\rightarrow}{a}$ is a random vector. In this case,\
  \ the observable data arrays represent samples *Z*^((*j*)) from the universe *Z*.\
  \ Note that each of them is random and independent with the PDF $P(Z^{(j)},\\\\\
  overset{\\\\rightarrow}{a}).$\n\nThe joint probability density function\n\n$$\\\\\
  begin{array}{r} {L(Z^{(1)},\\\\ldots,Z^{(s)};\\\\overset{\\\\rightarrow}{a}) = {\\\
  \\prod\\\\limits\\_{j = 1}^{s}P}(Z^{(j)},\\\\overset{\\\\rightarrow}{a})} \\\\\\\
  \\ \\\\end{array}$$  \n\n(1.7)\n\nis called the *likelihood* function for a sample\
  \ {*Z*^((1)),…,*Z*^((*s*))} [41, 51]. Under a fixed sample, the likelihood function\
  \ depends on the parameter $\\\\overset{\\\\rightarrow}{a}.$ A quite natural estimate\
  \ of this parameter is the vector that maximizes the likelihood function. Instead\
  \ of the likelihood function, a convenient approach is to use its logarithm *L̃* = log *L*,\
  \ i.e.,\n\n$$\\\\begin{array}{r} {\\\\hat{\\\\overset{\\\\rightarrow}{a}}(Z^{(1)},\\\
  \\ldots,Z^{(s)}) = \\\\arg\\\\max\\_{\\\\overset{\\\\rightarrow}{a}}\\\\widetilde{L}(Z^{(1)},\\\
  \\ldots,Z^{(s)};\\\\overset{\\\\rightarrow}{a}).} \\\\\\\\ \\\\end{array}$$  \n\n\
  (1.8)\n\nThe hypothesis about the random origin of the pair (*Z*, $\\\\overset{\\\
  \\rightarrow}{a}$) also has another interpretation related to the accumulation of\
  \ information about this pair during experiments. Here, we mean its characteristics\
  \ expected *before experiments* and the real characteristics obtained *after experiments*.\
  \ To describe this evolution, Bayes suggested the concept of conditional probability,\
  \ distinguishing between the *prior* and *posterior* probabilistic characteristics\
  \ of the data and parameters. As a result, the posterior conditional probability\
  \ density function (or simply posterior conditional density) $\\\\left. p({\\\\\
  mathbb{Z}}\\\\, \\\\middle| \\\\,\\\\overset{\\\\rightarrow}{a}) \\\\right.$ of\
  \ data under fixed parameters, the prior conditional probability density function\
  \ $\\\\left. w(\\\\overset{\\\\rightarrow}{a}\\\\, \\\\middle| \\\\,{\\\\mathbb{Z}})\
  \ \\\\right.$ of parameters under fixed data, and the prior probability density\
  \ function *g*(ℤ) were introduced accordingly. They have a clear relation defined\
  \ by Bayes' formula\n\n$$\\\\begin{array}{r} \\\\left. p({\\\\mathbb{Z}}\\\\, \\\
  \\middle| \\\\,\\\\overset{\\\\rightarrow}{a}) = \\\\frac{\\\\left. w(\\\\overset{\\\
  \\rightarrow}{a}\\\\, \\\\middle| \\\\,{\\\\mathbb{Z}})g({\\\\mathbb{Z}}) \\\\right.}{\\\
  \\left. {\\\\int\\\\limits\\_{\\\\mathbb{Z}}w}(\\\\overset{\\\\rightarrow}{a}\\\\\
  , \\\\middle| \\\\,{\\\\mathbb{Z}})g({\\\\mathbb{Z}})d{\\\\mathbb{Z}} \\\\right.}.\
  \ \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(1.9)\n\nThe posterior conditional density\
  \ maximization methods are defined by the family of Bayesian ML algorithms\n\n$$\\\
  \\begin{array}{r} \\\\left. \\\\hat{\\\\overset{\\\\rightarrow}{a}}({\\\\mathbb{Z}})\
  \ = \\\\max\\_{\\\\overset{\\\\rightarrow}{a}}p({\\\\mathbb{Z}}\\\\, \\\\middle|\
  \ \\\\,\\\\overset{\\\\rightarrow}{a}). \\\\right. \\\\\\\\ \\\\end{array}$$  \n\
  \n(1.10)\n\nBoth of the families (1.8, 1.10) employ the joint probability density\
  \ functions of the data and parameters under the accepted hypotheses about the probabilistic\
  \ properties of random objects.\n\n## 1.4 Principles of Randomized Machine Learning\
  \ Procedure\n\nThe RML concept rests on two principles as follows. The first principle\
  \ is the computer simulation principle for the *ensembles* of randomized decisions,\
  \ vectors or trajectories caused by uncertainty. In other words, the existing uncertainty\
  \ is compensated through the generation of an *ensemble* of decisions, vectors or\
  \ trajectories. However, it is desirable to generate *optimal* ensembles in a certain\
  \ sense, not any ensembles. This leads to the second principle known as the optimization\
  \ principle for the generated ensembles, which *maximizes information entropy*.\n\
  \nThe following examples illustrate the new properties arising in the randomized\
  \ models.\n\nSummarizing the aforesaid, one of the implementation principles of\
  \ the RML concept lies in the generation of the ensembles of random events (decisions,\
  \ vector or trajectories) with desired probabilistic characteristics. They are generated\
  \ using the model (1.3) with the randomized parameters **a** obeying a desired PDF.\
  \ In other words, it is necessary to generate an ensemble of the random vectors\
  \ **a** with given PDFs.\n\nThe second fundamental principle of the RML concept\
  \ is the optimization principle of the randomized model adopted to calculate the\
  \ optimal PDFs of the model parameters. Here an important stage consists on the\
  \ choice of an appropriate quality functional. In our case, this (often debatable)\
  \ question has a well-justified answer. As emphasize earlier, the RML concept is\
  \ a tool to obtain best decisions under maximum uncertainty. Recall that the uncertain\
  \ knowledge about an object under study is described by randomized model parameters,\
  \ uncertain data by additional noises and uncertain estimates by probability density\
  \ functions.\n\nIn the sequel, **the information entropy functional** will be used\
  \ to characterize the quality of a randomized model. The maximum of this entropy\
  \ corresponds to the highest uncertainty of our knowledge about the object and noises\
  \ intrinsic to measured data. An interpretation of information entropy as a measure\
  \ of uncertainty (with the minus sign, as a measure of information) was first suggested\
  \ by C. Shannon in his pioneering paper [165], which motivated intensive research\
  \ in mathematics, statistical thermodynamics, communication theory and other fields\
  \ of science. A next surge of interest in information entropy is related to the\
  \ name of E. Jaynes [80], who proved that the entropy maximization principle yields\
  \ best solutions under maximum uncertainty. In particular, this principle allows\
  \ to find best solutions under the worst-case probabilistic characteristics of data\
  \ measurement noises [66, 88, 109, 141, 153, 157]. This feature of the information\
  \ entropy maximization principle is treated as the “entropy”-robust property of\
  \ the resulting solutions.\n\n# CHAPTER 2 DATA SOURCES AND MODELS\n\nDOI: [`10.1201/9781003306566-2`](https://doi.org/10.1201/9781003306566-2)\n\
  \n\n\n\n\n对于机器学习流程，数据很重要，如其来源、充分性程度（测量误差）、体积、属性和特征。我们将数据理解为与特定时间相关联的数字集合，并以适当的属性组织在数组中。如果数据源不是自然起源的（例如，模拟示波图），则数据必须转换为结构化的数值数组。\n\
  \n尽管 ML 流程涉及数值数据，但在许多情况下，考虑描述数据样本的函数的一般属性的信息是有用的。数据的特征与这些数据中测量的源对象的状态密切相关。存在模拟和数字数据源。\n\
  \n模拟源的特征是连续自变量的函数。它们使用模拟传感器测量，并且大多表示空间分布对象的时域和/或空域函数。此类函数及其共同属性的类别会产生从中抽取的样本的一些属性。\n\
  \n数字源包含数字传感器，其输出所有测量的数据，具有幅度（电平）和时间量化。一种特殊情况是二进制数字源，其中数字量化器只有两个电平， resulting 数据表示与离散时间相关联的零和一的序列。\n\
  \n根据进一步的使用，数据可以从一个类别转换到另一个类别。例如，模拟数据使用模数转换器（`ADCs`）转换为数字数据，以便进一步进行计算机处理。有时，有必要将数字数据转换为模拟数据，这由数模转换器（`DACs`）执行。此类转换器在音频、视频和图形数据处理领域得到广泛应用。\n\
  \n一个关键问题在于数据的充分性和自变量完整性。如果自变量是时间，则完整的数据包含固定时间区间上所有时间的数字。数据充分性与测量误差有关，这些误差通常由具有适当属性的随机误差描述。\n\
  \n## 2.1 模拟数据源\n\n模拟源是测量系统（模拟传感器），即一种换能器，它将真实过程的某个指标变换为标量函数 `x(t)` 或向量函数 `x→(t)`，该函数定义在时间区间\
  \ `\U0001D4AF = [t[0], T]` 上；该区间内的时间 `t` 为实数。模拟传感器的一些示例包括测量速度的转速表、测量加速度的加速度计、测量物质光谱组成的光谱仪等。\n\
  \n### 2.1.1 确定性函数\n\n首先，简要考虑确定性函数的一般属性。\n\n1. 恒等公理：`ρ\U0001D4AF = 0` 仅当 `t[i] =\
  \ t[j]`。\n\n2. 对称公理：`ρ\U0001D4AF = ρ\U0001D4AF`。\n\n3. 三角公理：`ρ\U0001D4AF + ρ\U0001D4AF\
  \ ≥ ρ\U0001D4AF`，其中 `t[i] < t[j] < t[k]`。\n\n这样的函数总可以在时间区间 `\U0001D4AF` 上定义。因此，`\U0001D4AF\
  ` 构成一个度量空间。该度量空间（实数）当然非常简单。然而，标量和向量函数的度量空间可以通过类比构造。元素 `t*` 是序列 `t[0], t[1], …` 的极限，如果\
  \ `ρ(t[n], t*) → 0` 当 `n → ∞`。\n\n考虑两个度量空间 `\U0001D4B4` 和 `\U0001D4AF`，以及取值于 `\U0001D4B4\
  ` 的函数 `y = x(t)`。函数 `x(t)` 被称为 *在点 `t* ∈ \U0001D4AF` 处连续*，如果对于任意 `ε > 0` 存在 `δ >\
  \ 0`，使得对于满足不等式 `ρ\U0001D4AF < δ` 的任意其他点 `t ∈ \U0001D4AF`，都有 `ρ\U0001D4B4, x(t*))\
  \ < ε`。根据连续函数 `x(t)` 的定义，收敛 `t[n] → t*` 蕴含收敛 `x(t[n]) → x(t*)`。\n\n如果此性质适用于 `\U0001D4AF\
  ` 中的所有点 `t`，则相应的函数 `x(t)` *在 \U0001D4AF 上一致连续*。用 `C((0))` 表示所有这些函数的类。\n\n连续性（和一致连续性）可以推广到函数\
  \ `x(t)` 的导数，前提是它们存在。相应地，产生具有确定光滑程度的 *光滑函数* 的类。光滑程度是给定类函数存在的导数的最大阶数。例如，类 `C((1))`\
  \ 包含连续可微函数（一阶导数），而类 `C((r))` 包含 `r` 阶导数。记为 `C((∞))` 的光滑函数的重要子类由 *解析函数* 组成，它们在其定义域上可无限次微分。特别地，在时间区间\
  \ `\U0001D4AF` 上定义的解析函数 `x(t)` 在该区间上具有无限多个导数 `x((k))(t), k = 1, 2, ...`。在区间 `\U0001D4AF\
  ` 的任意点 `t[0]` 处，它可以展开为一致收敛的泰勒级数：\n\n$$\n\\begin{array}{r}\n{x(t) = x(t_{0}) + \\\
  left. ~{\\sum\\limits_{i = 1}^{\\infty}\\frac{d^{i}x(t)}{dt^{i}}} \\right|_{t_{0}}{(t_{0}\
  \ - t)}^{i},\\quad t_{0} \\in \\mathcal{T}.}\n\\\\\n\\end{array}\n$$\n\n(2.1)\n\n\
  可以为连续性这一函数的定性属性赋予某种定量特征。更具体地说，可以引入所谓的 *连续模*\n\n$$\n\\begin{array}{r}\n\\left. \\\
  omega(h) = \\max_{|t_{i} - t_{j}| \\leq h} \\middle| x(t_{i}) - x(t_{j}) \\middle|\
  \ . \\right.\n\\\\\n\\end{array}\n$$\n\n(2.2)\n\n如果函数 `x(t)` 的连续模为\n\n$$\n\\begin{array}{r}\n\
  {\\omega(h) \\leq Hh^{s},\\quad(H,s) \\geq 0,}\n\\\\\n\\end{array}\n$$\n\n(2.3)\n\
  \n则它属于连续 Hölder 函数，其中 `H` 和 `s` 为 Hölder 常数。\n\n如果函数 `x(t)` 的连续模为\n\n$$\n\\begin{array}{r}\n\
  {\\omega(h) \\leq Lh,\\quad L \\geq 0,}\n\\\\\n\\end{array}\n$$\n\n(2.4)\n\n则它属于连续\
  \ Lipschitz 函数，其中 `L` 为 Lipschitz 常数。\n\n任何函数的一个重要特征是其在时间区间 `\U0001D4AF` 上的变差，更具体地说，这种变差是有限还是无限。变差有限的函数构成有界变差函数类。为了定义此性质，考虑时间区间\
  \ `\U0001D4AF` 的任意划分，划分为有序点序列 `t[0], t[1], …, t[n]` 以及函数 `x(t)` 在这些点处的增量（减量）。如果\n\
  \n$$\n\\begin{array}{r}\n\\left. \\left. \\sum\\limits_{i = 0}^{n} \\right|x(t_{i\
  \ + 1}) - x(t_{i}) \\middle| = X_{\\mathcal{T}} < + \\infty \\right.\n\\\\\n\\end{array}\n\
  $$\n\n(2.5)\n\n对于 `\U0001D4AF` 上的任意点序列成立，则 `x(t)` 属于 *有界变差* 函数类。值 `X[\U0001D4AF\
  ]` 称为函数 `x(t)` 在时间区间 `\U0001D4AF` 上的全变差。\n\n有界变差函数类包括具有额外属性的函数。例如，连续函数和具有任意光滑程度的函数都属于有界变差函数类。如果函数\
  \ `x(t)` 是单调的，即表达式\n\n$$\n\\begin{array}{r}\n\\frac{x(t_{i}) - x(t_{j})}{t_{i} -\
  \ t_{j}}\n\\\\\n\\end{array}\n$$\n\n对于 `\U0001D4AF` 中的任意 `t[i], t[j]` 具有相同符号或为零，则它属于有界变差函数类，其总导数为\
  \ `X[\U0001D4AF] = x(T) − x(t[0])`。请注意，所考虑的类还包含具有跳跃（简单）间断的函数。\n\n用于研究上述函数类的属性并生成与之相关的合理的离散数据集的不同近似方法。近似方法操作近似质量泛函和来自给定类的近似函数\
  \ `xa` 的基本概念。以下泛函被广泛使用：\n\n* Chebyshev 泛函\n\n\n\n\n\n$$\\\\begin{array}{r} \\\\\
  left. C = \\\\max\\_{\\\\mathcal{T}} \\\\middle| x(t) - x\\_{a}(t) \\\\middle| ;\
  \ \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(2.6)\n\n*   积分二次泛函\n\n$$\\\\begin{array}{r}\
  \ \\\\left. J\\_{2} = \\\\left. \\\\int\\\\limits\\_{\\\\mathcal{T}} \\\\right|x(t)\
  \ - x\\_{a}(t) \\\\middle| {}\\_{2}dt; \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n\
  (2.7)\n\n*   归一化积分二次泛函\n\n$$\\\\begin{array}{r} {\\\\Delta\\_{2} = \\\\frac{\\\\\
  left. \\\\left. \\\\int\\\\limits\\_{\\\\mathcal{T}} \\\\right|x(t) - x\\_{a}(t)\
  \ \\\\middle| {}\\_{2}dt \\\\right.}{{\\\\int\\\\limits\\_{\\\\mathcal{T}}x^{2}}(t)dt\
  \ + {\\\\int\\\\limits\\_{\\\\mathcal{T}}x\\_{a}^{2}}(t)dt}.} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(2.8)\n\n与离散数据有直接关系的初等逼近函数是分段常数函数，也称为阶梯函数\n\n$$\\\\begin{array}{r} {x\\_{c}(t)\
  \ = \\\\left\\\\{ \\\\begin{aligned} {x(t\\_{0})} & {\\\\text{for}\\\\, t\\_{0}\
  \ \\\\leq t < t\\_{0} + h,} \\\\\\\\ {x(t\\_{0} + h)} & {\\\\text{for}\\\\, t\\\
  _{0} + h \\\\leq t < t\\_{0} + 2h,} \\\\\\\\ \\\\cdots & \\\\cdots \\\\\\\\ {x(t\\\
  _{0} + (n - 1)h)} & {\\\\text{for}\\\\, t\\_{0} + (n - 1)h \\\\leq t < T.} \\\\\\\
  \\ \\\\end{aligned}~ \\\\right.} \\\\\\\\ \\\\end{array}$$  \n\n(2.9)\n\n作为其参数，阶梯函数包含采样时间\
  \ `h`，其可以根据泛函 (2.6)–(2.8) 的可接受值来选择。对于某些函数类，例如连续或光滑函数，阶梯函数具有渐近行为的有益性质，\n\n$$\\\\\
  begin{array}{r} {\\\\lim\\\\limits\\_{h\\\\rightarrow 0}x\\_{c}(t) = x(t).} \\\\\
  \\\\ \\\\end{array}$$  \n\n(2.10)\n\n请注意，此极限根据对应函数 `x(t)` 的性质进行解释。\n\n### 2.1.2\
  \ 随机函数\n\n模拟源可能产生随机起源的函数。遵循 [65]，将采用两个密切相关的概念，即 *随机函数 `x(t)` (随机向量函数 $\\\\overset{\\\
  \\rightarrow}{x}(t))$* 和 *随机过程 `X(t)` (向量随机过程 $\\\\overset{\\\\rightarrow}{X}(t))$*。过程表示随机函数\
  \ `x(t)` 的集合。在某些条件下，在某种意义上可观测的随机过程称为该随机函数的 *样本*（样本函数）或 *实现*。下面将考虑标量函数。\n\n对于固定的\
  \ `t`，`x(t)` 给出随机变量的一个值，而 `X(t)` 给出该随机变量值的集合。随机函数完全由任意有限组随机变量值的全部可能概率论关系定义：\n\n\
  $$\\\\begin{array}{r} {x(t\\_{1}),x(t\\_{2}),\\\\ldots,x(t\\_{n}),\\\\quad t\\_{i}\
  \ \\\\in \\\\mathcal{T},\\\\, i = \\\\overline{1,n},\\\\, n = 1,2,\\\\ldots,} \\\
  \\\\\\ \\\\end{array}$$  \n\n(2.11)\n\n即，由相应的概率分布定义。换句话说，随机函数 `x(t)`，`t` ∈ \U0001D4AF\
  ，由相应的分布族描述\n\n$$\\\\begin{array}{r} {P\\_{t\\_{1},\\\\ldots,t\\_{n}}(\\\\eta\\_{1},\\\
  \\ldots,\\\\eta\\_{n}),\\\\text{\\\\quad\\\\quad}t\\_{i} \\\\in \\\\mathcal{T},\\\
  \\, i = \\\\overline{1,n},\\\\, n = 1,2,\\\\ldots,} \\\\\\\\ \\\\end{array}$$  \n\
  \n(2.12)\n\n其中 `η[1]`，…，`η[n]` 表示随机变量的值。\n\n每个概率分布函数被视为随机变量集合 (2.11) 的联合概率分布函数。这种处理在某些必要条件下是合理的，即所谓的分布族\
  \ (2.12) 的 *相容性条件*，由下式给出\n\n$$\\\\begin{aligned} {P\\_{t\\_{1},\\\\ldots,t\\_{n},t\\\
  _{(n + 1)},\\\\ldots,t\\_{(n + p)}}(\\\\eta\\_{1},\\\\ldots,\\\\eta\\_{n},} & {+\
  \ \\\\infty,\\\\ldots, + \\\\infty) = P\\_{t\\_{1},\\\\ldots,t\\_{n}}(\\\\eta\\\
  _{1},\\\\ldots,\\\\eta\\_{n});} \\\\\\\\ {P\\_{t\\_{1},\\\\ldots,t\\_{n}}(\\\\eta\\\
  _{1},\\\\ldots,\\\\eta\\_{n})} & {= P\\_{t\\_{i\\_{1}},\\\\ldots,t\\_{i\\_{n}}}(\\\
  \\eta\\_{i\\_{1}},\\\\ldots,\\\\eta\\_{i\\_{n}}),} \\\\\\\\ \\\\end{aligned}$$ \
  \ \n\n(2.13)\n\n其中 `i[1]`，…，`i[n]` 构成索引 1, 2, …, `n` 的任意排列。\n\n函数集 `P[t[1], …, t[n]](η[1],\
  \ …, η[n])` 称为随机函数 `x(t)` 的 *有限维分布*。\n\n应用中通常涉及多个随机函数，下面将其视为随机向量 $\\\\overset{\\\
  \\rightarrow}{x}(t) = \\\\left\\\\{ x\\_{1}(t),\\\\ldots,x\\_{m}(t) \\\\right\\\\\
  }$ 的元素。随机向量完全由以下形式的有限维概率分布族定义\n\n$$\\\\begin{aligned} {P\\_{t\\_{1},\\\\ldots,t\\\
  _{n}}(\\\\eta\\_{11},} & {\\\\eta\\_{12},\\\\ldots,\\\\eta\\_{nm}) = \\\\mathbf{P}\\\
  \\left\\\\{ x\\_{1}(t\\_{1}) < \\\\eta\\_{11},x\\_{2}(t\\_{1}) < \\\\right.} \\\\\
  \\\\ & {\\\\left. < \\\\eta\\_{12},\\\\ldots,x\\_{m}(t\\_{n}) < \\\\eta\\_{nm} \\\
  \\right\\\\}.} \\\\\\\\ \\\\end{aligned}$$  \n\n(2.14)\n\n随机函数 `x(t)` 的有限维概率分布可以通过有限维概率密度函数\
  \ `w[t[1], …, t[n]](η[1], …, η[n])` 定义：\n\n$$\\\\begin{array}{r} {P\\_{t\\_{1},\\\
  \\ldots,t\\_{n}}(\\\\eta\\_{1},\\\\ldots,\\\\eta\\_{n}) = {\\\\int\\\\limits\\_{-\
  \ \\\\infty}^{\\\\eta\\_{1}}\\\\cdots}{\\\\int\\\\limits\\_{- \\\\infty}^{\\\\eta\\\
  _{n}}\\\\,}w\\_{t\\_{1},\\\\ldots,t\\_{n}}(y\\_{1},\\\\ldots,y\\_{n})dy\\_{1}\\\\\
  cdots dy\\_{n}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.15)\n\n特别地，这意味着公式\n\n$$\\\\begin{aligned}\
  \ {w\\_{t\\_{1},\\\\ldots,t\\_{n}}(\\\\eta\\_{1},\\\\ldots,\\\\eta\\_{n})} & {=\
  \ {\\\\int\\\\limits\\_{- \\\\infty}^{\\\\infty}\\\\cdots}{\\\\int\\\\limits\\_{-\
  \ \\\\infty}^{\\\\infty}w\\_{t\\_{1},\\\\ldots,t\\_{n},t\\_{(n + 1)},\\\\ldots,t\\\
  _{(n + p)}}}(\\\\eta\\_{1},\\\\ldots,} \\\\\\\\ & {\\\\eta\\_{n},y\\_{1},\\\\ldots,y\\\
  _{p})dy\\_{1}\\\\cdots dy\\_{p},} \\\\\\\\ \\\\end{aligned}$$  \n\n(2.16)\n\n其可视为有限维概率分布的相容性条件\
  \ (2.1.2)。\n\n分析有限维概率密度函数（或分布）的有用工具是其 *特征函数 `Φ[t[1], …, t[n]](u[1], …, u[n])`*，其表示概率密度函数的傅里叶变换\
  \ [48]：\n\n$$\\\\begin{aligned} {\\\\Phi\\_{t\\_{1},\\\\ldots,t\\_{n}}(u\\_{1},\\\
  \\ldots,u\\_{n})} & {= {\\\\int\\\\limits\\_{- \\\\infty}^{\\\\infty}\\\\cdots}{\\\
  \\int\\\\limits\\_{- \\\\infty}^{\\\\infty}\\\\exp}\\\\left( {j{\\\\sum\\\\limits\\\
  _{k = 1}^{n}\\\\eta\\_{k}}\\\\, u\\_{k}} \\\\right) \\\\times} \\\\\\\\ {\\\\times\
  \ w\\_{t\\_{1},\\\\ldots,t\\_{n}}} & {(\\\\eta\\_{1},\\\\ldots,\\\\eta\\_{n})\\\\\
  , d\\\\eta\\_{1}\\\\cdots d\\\\eta\\_{n},} \\\\\\\\ & {j = \\\\sqrt{- 1}.} \\\\\\\
  \\ \\\\end{aligned}$$  \n\n(2.17)\n\n变量 `u[1]`，…，`u[n]` 取值于空间 `R^(n)`。如果概率密度函数满足某些解析条件（见\
  \ [48]），则可通过傅里叶积分利用其特征函数恢复如下：\n\n$$\\\\begin{aligned} {w\\_{t\\_{1},\\\\ldots,t\\\
  _{n}}(\\\\eta\\_{1},\\\\ldots,\\\\eta\\_{n})} & {= \\\\frac{1}{{(2\\\\pi)}^{n}}{\\\
  \\int\\\\limits\\_{- \\\\infty}^{\\\\infty}\\\\cdots}{\\\\int\\\\limits\\_{- \\\\\
  infty}^{\\\\infty}\\\\exp}\\\\left( {- {\\\\sum\\\\limits\\_{k = 1}^{n}\\\\eta\\\
  _{k}}\\\\, u\\_{k}} \\\\right) \\\\times} \\\\\\\\ & {\\\\times \\\\Phi\\_{t\\_{1},\\\
  \\ldots,t\\_{n}}(u\\_{1},\\\\ldots,u\\_{n})\\\\, du\\_{1}\\\\cdots du\\_{n}.} \\\
  \\\\\\ \\\\end{aligned}$$  \n\n(2.18)\n\n这些随机函数的定义足以满足我们对随机函数在 `n` 个点处的值感兴趣的情况，即自变量\
  \ (`t[1]`, …, `t[n]`) ∈ \U0001D4AF 的值。然而，如果集合 \U0001D4AF 包含时间 `t` 的所有实值，则即使任意多个形式的有限维概率分布\
  \ (2.12, 2.1.2) 也无法说明随机函数的构造性质，如连续性、可微性等。\n\n在某些应用中，随机函数以有限维概率分布形式完成的完整描述变得冗余。只需要知道其数值特征——矩函数\n\
  \n$$\\\\begin{array}{r} {m\\_{i\\_{1},\\\\ldots,i\\_{s}}(t\\_{1},\\\\ldots,t\\_{s})\
  \ = \\\\mathcal{M}{\\\\prod\\\\limits\\_{k = 1}^{s}\\\\left\\\\lbrack {x(t\\_{k})}\
  \ \\\\right\\\\rbrack^{i\\_{k}}},\\\\quad i\\_{k} \\\\geq 0,\\\\,\\\\, k = \\\\\
  overline{1,s}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.19)\n\n\n\n\n\n值 `$q = {\\sum\\\
  limits_{k = 1}^{s}i_{k}}$` 称为矩函数的阶。在矩函数类中，阶为 1 和 2 的矩函数占有特殊地位，即\n\n### 均值\n\n$$\n\
  \\begin{array}{r} {m(t_{1}) = m_{1}(t_{1}) = \\mathcal{M}\\left\\{ x(t_{1}) \\right\\\
  };} \\\\ \\end{array}\n$$\n\n(2.20)\n\n### 相关函数\n\n$$\n\\begin{array}{r} {R(t_{1},t_{2})\
  \ = m_{11}(t_{1},t_{2}) = \\mathcal{M}\\left\\{ \\lbrack x(t_{1}) - m(t_{1})\\rbrack\\\
  lbrack x(t_{2}) - m(t_{2})\\rbrack \\right\\}.} \\\\ \\end{array}\n$$\n\n(2.21)\n\
  \n若 `t[1] = t[2] = t`，则 `R(t, t) = sigma²` 为固定 `t` 时随机变量 `x(t)` 的方差。若 `R(t[1], t[2])\
  \ = 0`，则随机函数 `x(t)` 的取值 `x(t[1])` 和 `x(t[2])` 不相关。在随机变量 `x(t[1])` 和 `x(t[2])` 的二维联合概率分布为高斯且不相关条件成立的特殊情形下，随机变量\
  \ `x(t[1])` 和 `x(t[2])` 相互独立。\n\n连续性是函数的重要性质。对于随机函数，该性质具有概率意义，可形式化为所有对 `x(t[1]),\
  \ x(t[2])` 的分布。在集合 `mathcal{T}` 上引入距离 `rho(t[1],t[1])=|t[1]-t[2]|`。随机函数 `x(t), t\
  \ in mathcal{T}`, 在点 `t^*` 处称为 *随机连续* 的，如果对所有 `epsilon > 0`，\n\n$$\n\\begin{array}{r}\
  \ \\left. \\mathbf{P}\\left\\{ \\middle| x(t^{*}) - x(t) \\middle| > \\varepsilon\
  \ \\right\\}\\rightarrow 0\\quad\\text{as}\\,\\,\\rho(t^{*},t)\\rightarrow 0. \\\
  right. \\\\ \\end{array}\n$$\n\n(2.22)\n\n若条件 (2.22) 对所有值 `t in mathcal{T}` 成立，则相应函数\
  \ `x(t)` 在 `mathcal{T}` 上随机连续。\n\n根据定义 (2.22)，随机连续性是一种“渐近”性质，仅需声明。更具构造性的定义应涉及某些定量值。事实上，*一致随机连续性*\
  \ 构成了这种性质。随机函数在 `mathcal{T}` 上一致随机连续，如果对任意 `epsilon > 0`，存在 `delta > 0` 使得\n\n$$\n\
  \\begin{array}{r} {\\mathbf{P}\\left\\{ \\middle| x(t) - x(\\widetilde{t}) \\middle|\
  \ > \\varepsilon \\right\\} < \\varepsilon} \\\\ \\end{array}\n$$\n\n(2.23)\n\n\
  对满足不等式 `rho(t, tilde{t}) < epsilon` 的所有对 `(t, tilde{t})` 成立。\n\n由于集合 `mathcal{T}`\
  \ 是紧的，随机函数在 `mathcal{T}` 上的随机连续性蕴含其在 `mathcal{T}` 上的一致随机连续性。\n\n考虑若干类随机函数（过程）。\n\
  \n### 1. 高斯随机函数\n\n在许多应用中，具有高斯有限维概率分布的随机函数起着关键作用。就有限维分布而言，随机函数可由随机 `n` 维向量 `overset{rightarrow}{x}\
  \ = { x(t_{1}),...,x(t_{n}) }.` 描述。随机向量 `overset{rightarrow}{x}` 服从高斯分布，如果其特征函数可表示为\n\
  \n$$\n\\begin{array}{r} {\\Phi(\\overset{rightarrow}{u}) = \\mathcal{M}\\left\\\
  { \\exp\\left( {j\\left\\langle \\overset{rightarrow}{u},\\overset{rightarrow}{x}\
  \ \\right\\rangle} \\right) \\right\\} = \\exp\\left( {j\\left\\langle \\overset{rightarrow}{u},\\\
  overset{rightarrow}{m} \\right\\rangle - \\frac{1}{2}\\left\\langle G\\,\\overset{rightarrow}{u},\\\
  overset{rightarrow}{u} \\right\\rangle} \\right).} \\\\ \\end{array}\n$$\n\n(2.24)\n\
  \n这里 `overset{rightarrow}{m}` 表示向量 `overset{rightarrow}{x}` 对应元素的 `n` 维均值向量；`overset{rightarrow}{u}`\
  \ 是定义在 `R^{(n)}` 上的 `n` 维实变量向量；`G` 表示非负定实对称矩阵（相关矩阵）；最后，`langle bullet, bullet rangle`\
  \ 表示相应向量的标量积。\n\n高斯随机函数的矩可通过展开其特征函数计算。若仅中心矩 (`m1 = 0`) 足够，则\n\n$$\n\\begin{aligned}\
  \ {\\Phi(\\overset{rightarrow}{u})} & {= \\exp\\left( {- \\frac{1}{2}\\left\\langle\
  \ G\\,\\overset{rightarrow}{u},\\overset{rightarrow}{u} \\right\\rangle} \\right)\
  \ = 1 - \\frac{1}{2}\\left\\langle G\\,\\overset{rightarrow}{u},\\overset{rightarrow}{u}\
  \ \\right\\rangle + \\frac{1}{2^{2}2!}\\left\\langle G\\,\\overset{rightarrow}{u},\\\
  overset{rightarrow}{u} \\right\\rangle^{2} - \\ldots} \\\\ & {+ {( - 1)}^{n}\\frac{1}{2^{n}n!}\\\
  left\\langle G\\,\\overset{rightarrow}{u},\\overset{rightarrow}{u} \\right\\rangle^{n}\
  \ + \\ldots.} \\\\ \\end{aligned}\n$$\n\n(2.25)\n\n因此，奇数阶矩函数为\n\n$$\n\\begin{array}{r}\
  \ {m_{i_{1},\\ldots,i_{s}}(t_{1},\\ldots,t_{s}) = 0,\\text{\\\\quad\\\\quad}{\\\
  sum\\limits_{k = 1}^{s}i_{k}} = 2n + 1;} \\\\ \\end{array}\n$$\n\n(2.26)\n\n偶数阶矩函数形式为\n\
  \n$$\n\\begin{aligned} {m_{i_{1},\\ldots,i_{s}}(t_{1},\\ldots,t_{s})} & {= \\frac{\\\
  partial^{2n}}{\\partial t_{1}^{i_{1}}\\cdots\\partial_{s}^{i_{s}}}\\left( {\\frac{1}{2^{n}n!}\\\
  left\\langle G\\,\\overset{rightarrow}{u},\\overset{rightarrow}{u} \\right\\rangle}\
  \ \\right),} \\\\ {\\sum\\limits_{k = 1}^{s}i_{k}} & {= 2n.} \\\\ \\end{aligned}\n\
  $$\n\n(2.27)\n\n高斯随机函数在不同（理论和应用导向）研究中具有极其重要的意义。事实上，在相当不苛刻的条件下，大量独立随机函数的小值之和可由高斯随机函数近似，而与项的概率论性质无关。这一重要结果——正态相关定理——是中心极限定理的推广\
  \ [166]。\n\n### 2. 具有独立增量的随机过程\n\n具有独立增量的随机过程的研究始于布朗运动及其适当的数学模型维纳过程。后来，在具有独立增量的过程类中发展了广义的数学模型并进行了积分。\n\
  \n随机过程 `overset{rightarrow}{x}(t), t in mathcal{T},` 取值于 `R^{(n)}`，称为具有独立增量的过程，如果对任意\
  \ `n`，`t[0] <= t[1] <= ... <= t[n] = T`，随机向量 `overset{rightarrow}{x}(t_{0}),overset{rightarrow}{x}(t_{1})\
  \ - overset{rightarrow}{x}(t_{0}),...,overset{rightarrow}{x}(t_{n}) - overset{rightarrow}{x}(t_{n\
  \ - 1})` 互为独立。\n\n向量 `overset{rightarrow}{x}(t_{0})` 称为过程的初始状态（值），其概率分布称为过程的初始分布。定义具有独立增量的过程，只需定义初始分布\
  \ `P_{0}(mathcal{B}) = mathbf{P}\\left\\{ overset{rightarrow}{x}(t_{0}) in mathcal{B}\
  \ \\right\\},` 以及向量 `Delta overset{rightarrow}{x}(t,h) = overset{rightarrow}{x}(t\
  \ + h) - overset{rightarrow}{x}(t),` 的分布集合 `P(t,h,mathcal{B}) = mathbf{P}\\left\\\
  { Delta overset{rightarrow}{x}(t,h) in mathcal{B} \\right\\}`，其中 `t in mathcal{T}`，`h\
  \ > 0`，且 `mathcal{B} in R^{(m)}` 为基本事件集。\n\n如果分布 `P(t, h, mathcal{B})` 与 `t` 无关，即\
  \ `P(t, h, mathcal{B}) = P(h, mathcal{B})`，则相应的具有独立增量的过程称为 *齐次* 的。\n\n\n\n\n\n考虑具有独立增量的一些过程的例子。让我们从\
  \ `Brownian motion` 开始。对于该过程，概率分布 `P(t, h, ℬ)` 是高斯的。该过程的物理模型是液体中小颗粒的运动，可以用高倍显微镜观察到。这样的颗粒具有恒定的运动，其路径代表一条非常复杂的折线，具有混乱方向的线段。这种运动可以用颗粒与液体分子的碰撞来解释。颗粒相对于每个分子的尺寸具有相对较大的尺寸，并且每秒遭受大量与它们的碰撞。颗粒的可见运动称为布朗运动。在粗略近似下，颗粒因碰撞而产生的位移可以认为彼此独立，因此布朗运动可以被视为具有独立增量的过程。由于位移很小，我们可以假设其总和满足中心极限定理；换句话说，布朗运动可以用具有独立增量的高斯随机过程来描述。\n\
  \n特别地，均质布朗随机过程由两个参数 `m` 和 `σ` 定义：\n\n$$\n\\begin{array}{r} {\\mathcal{M}\\left\\\
  { x(t) \\right\\} = mt,\\quad\\mathcal{M}\\left\\{ x^{2}(t) \\right\\} = \\sigma^{2}t.}\
  \ \\\\ \\end{array}\n$$\n\n(2.28)\n\n对于 `m` = 0 和 `σ` = 1，布朗运动过程称为 `the standard\
  \ Wiener process`。\n\n现在考虑 `Poisson processes`。一种具有独立增量的随机连续过程，取非负整数值，如果对于任意 (`s`,\
  \ `t`) > 0 且 `s` < `t`，变量 `x(t) - x(s)` 服从泊松概率分布，则称为泊松过程。\n\n设 `x(t[0])` = 0。则变量\
  \ `x(t)` 具有概率分布\n\n$$\n\\begin{array}{r} {\\mathbf{P}\\left\\{ x(t) = m \\right\\\
  } = \\frac{a^{m}(t)}{m!}\\exp( - a(t)),\\quad\\mathcal{M}\\left\\{ x(t) \\right\\\
  } = a(t).} \\\\ \\end{array}\n$$\n\n(2.29)\n\n由此可得\n\n$$\n\\begin{aligned} {\\mathbf{P}\\\
  left\\{ x(t) - x(s) = m \\right\\}} & {= \\frac{[a(t) - a(s)]^{m}}{m!}\\exp\\left(\
  \ - [a(t) - a(s)] \\right),} \\\\ & {\\quad m = 0,1,2,\\ldots} \\\\ \\end{aligned}\n\
  $$\n\n(2.30)\n\n如果过程是均质的，则\n\n$$\n\\begin{aligned} & {a(t) = at,} \\\\ {\\mathbf{P}\\\
  left\\{ x(t) - x(s) = m \\right\\}} & {= \\frac{a^{m}{(t - s)}^{m}}{m!}\\exp( -\
  \ a(t - s)),} \\\\ {s < t,} & {m = 0,1,2,\\ldots} \\\\ \\end{aligned}\n$$\n\n(2.31)\n\
  \n#### 3. Markov processes\n\n`Markov process` 的概念基于关于非遗传系统（也称为“无后效”系统）的假设。在每个时刻\
  \ `t`，这样的系统具有某个状态 `x(t)`，它仅取决于其在先前时刻 `s` < `t` 的状态 `x(s)`。所有允许的状态形成某个集合 `B` ∈ `X`，其中\
  \ `X` 是系统的相空间。假设系统是随机演化的，即其在时刻 `t` 的状态不能由在先前时刻 `s` 的状态唯一确定，从而是随机的。用 `P(s, x, t,\
  \ B)` 表示在条件 `x(s) = x` 下事件 `{ x(t) ∈ B(s < t) }` 的概率，通常称为 `the transition probability`\
  \ 或系统状态在时刻 `t` 属于集合 `B` 的条件概率，给定其在相空间 `X` 中在时刻 `s` 的状态为 `x`。\n\n假设在状态 `x(s)` 和 `x(t)`\
  \ 之间存在中间状态 `x(u)`，其中 `s` < `u` < `t`。用 `P(s, x, u, y, t, B)` 表示在给定 `x(s) = x` 且\
  \ `x(u) = y` 的条件下事件 `{ x(t) ∈ B }` 的条件概率。利用条件概率的一般性质，写出\n\n$$\n\\begin{array}{r}\
  \ {P(s, x, t, B) = \\int_{X}P(s, x, u, y, t, B)\\, P(s, x, u, y)\\, d y.} \\\\ \\\
  end{array}\n$$\n\n(2.32)\n\n对于非遗传系统，一个自然的假设是\n\n$$\n\\begin{array}{r} {P(s, x, u,\
  \ y, t, B) = P(u, y, t, B).} \\\\ \\end{array}\n$$\n\n(2.33)\n\n在这种情况下，等式 (2.34)\
  \ 取形式\n\n$$\n\\begin{array}{r} {P(s, x, t, B) = \\int_{X}P(u, y, t, B)\\, P(s, x,\
  \ u)\\, d y.} \\\\ \\end{array}\n$$\n\n(2.34)\n\n这是 `the Chapman–Kolmogorov equation`，它是马尔可夫过程理论的基础\
  \ [47, 65, 166]。\n\n马尔可夫过程称为 `homogeneous` 如果转移概率仅取决于参数 `t` 和 `s` 的差，即\n\n$$\n\\\
  begin{array}{r} {P(s, x, t, B) = P(t - s, x, B) = P_{t - s}(x, B).} \\\\ \\end{array}\n\
  $$\n\n(2.35)\n\n对于齐次马尔可夫过程，Chapman–Kolmogorov 方程 (2.34) 可以写成更简单的形式\n\n$$\n\\begin{array}{r}\
  \ {P_{u + v}(x, B) = \\int_{X}P_{u}(x)P_{v}(y, B)\\, d y.} \\\\ \\end{array}\n$$\n\
  \n(2.36)\n\n本节给出的定义很宽泛，从而涵盖了来源和性质不同的马尔可夫过程。在下文中，我们将讨论一些分类原则和某些马尔可夫过程类。第一个分类属性在于观察到马尔可夫过程的系统的相空间。从这个观点看，初等马尔可夫过程是具有有限或可数个允许状态的过程。在后一种情况下，通过对转移概率施加一些解析约束，我们可以线性化\
  \ Chapman–Kolmogorov 方程并获得其线性化对应物。对于一般相空间，可以以广义的方式定义马尔可夫过程类，使转移概率具有更符合实际系统行为的性质。这种观点允许引入以下马尔可夫过程类：\n\
  \n1. `Jump processes.` 它们对应于过程在相空间的某一点移动的想法，在该点停留随机一段时间，然后跳到空间的另一点，等等。\n\n2. `Processes\
  \ with discrete interference of events.` 这些过程由其轨迹在随机时间发生简单不连续的随机跳变的动态系统生成。\n\n3.\
  \ `Diffusion processes.` 它们代表在有限维动态系统中在小时间段内具有布朗运动的过程。\n\n4. `Markov processes with\
  \ independent increments.` 这种过程的来源是有限维动态系统，它们在小时间段内表现得像具有独立增量的过程。\n\n对于上述马尔可夫过程类，也有可能对\
  \ Chapman–Kolmogorov 方程进行线性化，将其转化为线性偏微分方程或积分微分方程。\n\n### 2.2 Digital Source of Data\n\
  \n\n\n\n\n事实上，数字数据由十进制或二进制数字的数组表示。它们是使用数字测量设备生成的。然而，我们经常处理的是模拟测量设备。那么这些数组就是对所研究对象或现象的初始模拟信息的数字转换结果。换句话说，如图\
  \ 2.1 所示，模拟-数字转换器（`ADC`）放置在所研究对象或现象之后。例如，如果所研究对象在一个给定的时间间隔 `\U0001D4AF` 上运行，从而产生一个连续过程，则\
  \ `ADC` 将该过程转换为数字数组。`ADC` 对初始连续过程进行幅度和时间量化。照片是另一个例子，其中视觉图像充当模拟源。然而，照片使用带有扫描的略有不同的\
  \ `ADC` 转换为数字数组。\n\n![Figure 2.1](img/fig2_1.jpg)\n\nFigure 2.1\n\n### 2.2.1 Amplitude\
  \ and time quantization\n\n幅度量化将一个函数的某个值集合分解为有限数量的子集。如果所考虑的函数是标量的，则问题涉及量化区间。对于向量函数，量化概念与将其分量值集合分解为基本体积密切相关。最简单的量化类型是将模拟函数的范围\
  \ `Δϕ = ϕ[max] − ϕ[min]` 除以一个整数，并向上或向下舍入到最接近的整数。作为规则，量化以二进制代码进行。范围 `Δϕ` 被 `2^(n)`\
  \ 除，其中 `n` 表示寄存器长度（或数字位数）。每个幅度由长度为 `n` 的零和一序列编码。\n\n时间量化，进一步称为时间采样（在我们的情况下，函数的自变量是时间），是使用脉冲发生器执行的。请注意，采样率必须至少是函数频谱最大频率的两倍。\n\
  \n因此，模拟函数（信息、信号）的值由对应于离散时间点的二进制数字序列表示。\n\n幅度量化是对模拟函数值的非线性变换 [197]。图 2.2 显示了执行模拟函数幅度量化的非线性元件的特性。幅度量化可以是均匀的和非均匀的。在前一种情况下，量化步长\
  \ `h[k] = y[k + 1] − y[k]` 是一个常数 `h`。在非均匀幅度量化下，该步长取决于幅度。非均匀幅度量化降低了数字数据生成的相对误差。图\
  \ 2.3(a)–图 2.3(c) 展示了具有不同舍入规则的量化器的特性：*a*—向上舍入到最接近的整数，*b*—向下舍入到最接近的整数和 *c*—舍入到基本区间的中间。\n\
  \n![Figure 2.2](img/fig2_2.jpg)\n\nFigure 2.2\n\n![Figure 2.3](img/fig2_3.jpg)\n\
  \nFigure 2.3\n\n时间采样不会引起测量误差，而幅度量化会因舍入而伴随误差 `ε`。为了估计该误差，必须选择一个模型。考虑两种模型，即确定性和随机性。在第一种模型框架内，上述舍入规则导致最大误差\n\
  \n```\n\\begin{array}{r}\n{\\varepsilon_{max} = h.}\n\\\\\n\\end{array}\n```\n\n\
  (2.37)\n\n换句话说，它与量化步长 `h` 相同。假设量化误差为随机变量，我们必须声明其概率密度函数（PDF）。例如，设该变量在区间 `[- h/2,\
  \ h/2]` 上服从均匀分布，即\n\n```\n\\begin{array}{r}\n{p(\\varepsilon) = \\left\\{ \\begin{aligned}\n\
  \\frac{1}{h} & {\\text{for}\\,\\left| \\varepsilon \\middle| \\leq \\frac{h}{2},\
  \ \\right.}\n\\\\\n0 & {\\text{for}\\,\\left| \\varepsilon \\middle| > \\frac{h}{2}.\
  \ \\right.}\n\\\\\n\\end{aligned}~ \\right.}\n\\\\\n\\end{array}\n```\n\n(2.38)\n\
  \n由于 PDF 具有对称性，量化误差的均值为零，而其方差为\n\n```\n\\begin{array}{r}\n{\\sigma^{2} = \\frac{1}{h}{\\\
  int\\limits_{- h/2}^{h/2}\\varepsilon^{2}}d\\varepsilon = \\frac{h^{2}}{12}.}\n\\\
  \\\n\\end{array}\n```\n\n(2.39)\n\n有趣的是，所得到的估计值明显小于确定性模型（2.37）的估计值。然而，请记住，该量化误差估计基于均匀分布和与模拟函数不相关的假设。\n\
  \n### 2.2.2 Audio data\n\n声音信号的数字转换由 `ADC` 执行，它将模拟信号转换为数字音频数据。这些转换使用不同类型的数字调制。脉冲编码调制（`PCM`）和增量调制（`DM`）最为广泛。\n\
  \n`PCM` 将模拟信号 `x(t)` 的瞬时幅度序列（图 2.4(a)）转换为对应于离散时间 `nΔ` 的具有固定步长 `h` 的量化值（图 2.4(b)）。每个值\
  \ `x[PC][nΔ]` 被转换为二进制代码，如图 2.4(c)所示。这种调制器输出具有时间绑定的 0 和 1 的数据包。\n\n![Figure 2.4](img/fig2_4.jpg)\n\
  \nFigure 2.4\n\n`PCM` 的精度取决于步长 `h` 和量化幅度数 `N`。最大量化值为 `(N − 1)h`。二进制代码组合的数量为 `n =\
  \ log[2h]`，其中 `[ ⋅ ]` 表示整数部分算子。\n\n`DM` 是 `PCM` 的一种特殊类型，它也以时间离散采样和幅度量化的形式表示模拟信号。根据假设，音频信号中的采样之间存在关系。因此，可以仅使用一个数字来量化相邻采样。图\
  \ 2.5(a)–图 2.5(b) 说明了增量调制器的操作。作为其输出，该调制器（见图 2.5(a)）生成脉冲的二进制序列，对于正差值为 `+1`，对于负差值为\
  \ `−1`。\n\n![Figure 2.5](img/fig2_5.jpg)\n\nFigure 2.5\n\n声音信号的数字表示有以下两种用途。首先，用于提高声音质量并进一步转换回模拟形式。其次，用于形成定量测量的属性以表征声音信号\
  \ [124]。在此背景下，尤其要注意信号的频谱组成及其基本参数。\n\n再次考虑由连续函数 `x(t)` 描述的模拟信号。设该函数在无限区间 `(−∞, +∞)`\
  \ 上有定义且平方可积。那么该函数的傅里叶变换由下式给出\n\n```\n\\begin{aligned}\n{\\Phi_{1}(\\nu)} & {= {\\\
  int\\limits_{- \\infty}^{+ \\infty}x}(t)\\exp( - 2\\pi\\iota\\nu t)dt = \\Phi(2\\\
  pi\\nu),}\n\\\\\n{\\Phi_{2}(\\omega)} & {= \\frac{1}{\\sqrt{2\\pi}}{\\int\\limits_{-\
  \ \\infty}^{+ \\infty}x}(t)\\exp( - \\iota\\omega t)dt = \\sqrt{2\\pi}\\Phi(\\omega),}\n\
  \\\\\n{\\Phi(\\omega)} & {= {\\int\\limits_{- \\infty}^{+ \\infty}x}(t)\\exp( -\
  \ \\iota\\omega t)dt.}\n\\\\\n\\end{aligned}\n```\n\n(2.40)\n\n这里 `\\iota = \\sqrt{-\
  \ 1}`，`ν` 表示线性频率（以 Hz 为单位），而 `ω = 2πν` 是角频率（以 rad/s 为单位）。公式（2.40）包含复指数\n\n```\n\\\
  begin{array}{r}\n{\\exp( - \\iota\\omega t) = \\cos(\\omega t) - \\iota\\sin(\\\
  omega t).}\n\\\\\n\\end{array}\n```\n\n(2.41)\n\n函数 `Φ(ω)` 对于 `ω ∈ (−∞, +∞)` 是连续的。\n\
  \n\n\n\n\n真实的模拟信号定义在有限时间区间 \U0001D4AF = \\[0, *T*\\] 上。对该信号进行数字化变换后得到一组量化值序列，称为采样，其形式为\n\
  \n$$\n\\begin{array}{r} {x\\lbrack n\\Delta\\rbrack = {\\int\\limits\\_{- \\infty}^{+\
  \ \\infty}x}(\\tau)\\,\\delta(n\\Delta - \\tau)d\\tau,} \\\\ \\\\ \\end{array}\n\
  $$\n\n(2.42)\n\n其中 *δ*( • ) 表示狄拉克函数，$\\Delta = \\frac{T}{N - 1},$ 且 *N* 为采样数。因此，模拟信号在有限时间区间\
  \ \U0001D4AF 上的数字表示由一个 *N*\\-维向量 **x** 描述，其元素为 *x*\\[*n**Δ*\\] (2.42)。根据 (2.40)，该信号的傅里叶变换由下式给出\n\
  \n$$\n\\begin{aligned} {\\Psi(\\omega) = \\Psi\\left( {\\frac{2\\pi}{T}k} \\right)}\
  \ & {\\Psi(k) = {\\sum\\limits\\_{n = 0}^{N - 1}x}\\lbrack n\\Delta\\rbrack\\,\\\
  exp\\left( {-\\iota\\frac{2\\pi}{T}k\\, n} \\right) =} \\\\ {= {\\sum\\limits\\\
  _{n = 0}^{N - 1}x}\\lbrack n\\Delta\\rbrack} & {\\left\\lbrack {\\cos\\left( {\\\
  frac{2\\pi}{T}kn} \\right) - \\sin\\left( {\\frac{2\\pi}{T}kn} \\right)} \\right\\\
  rbrack,} \\\\ & {\\quad k = \\overline{0,N-1},} \\\\ \\end{aligned}\n$$\n\n(2.43)\n\
  \n并称为离散傅里叶变换 (DFT)。显然，DFT 作为数字信号的离散谱由向量 $\\overline{\\Psi}$ 刻画，其元素为 *Ψ*(*k*) (2.2.2)。注意，该向量的维数与由数字采样组成的向量\
  \ **x** 的维数一致 (2.42)；参见 Figs. 2.6(a) 和 2.6(b)。\n\n![Figure 2.6](img/fig2_6.jpg)\n\
  \nFigure 2.6\n\n向量 $\\overline{\\Psi}$ 决定了所考虑的声音信号的能量频率分布。通常，区间 Δ 足够小以保留模拟信号在时间区间\
  \ \U0001D4AF 上的信息特征。随后，向量 $\\overline{\\Psi}$ 具有相当高的维数，这使得离散谱在应用中的使用变得复杂。在此向量基础上，有必要得到一个降维向量\
  \ **z**，其维数与初始向量 $\\overline{\\Psi}$ 相比显著更小。一个简单（尽管不是最客观和最具信息量的）解法是指定少量区间 \\[0, *k*[1]\\\
  ], \\[*k*[1] + 1, *k*[2]\\], …, \\[*k*[*s*] + 1, *N* − 1\\] 并构造所谓的能量谱，即向量 **z**，其元素为\n\
  \n$$\n\\begin{array}{r} {z_{j} = {\\sum\\limits\\_{i = 0}^{k_{1}}\\Psi}(i) + {\\\
  sum\\limits\\_{i = k_{(j - 1)} + 1}^{k_{j}}\\Psi}(i),\\quad\\quad j = \\overline{2,m},\\\
  quad m \\ll (N - 1).} \\\\ \\\\ \\end{array}\n$$\n\n(2.44)\n\n则总能量形式为\n\n$$\n\\\
  begin{array}{r} {E = {\\sum\\limits\\_{k = 0}^{N - 1}\\Psi}(k).} \\\\ \\\\ \\end{array}\n\
  $$\n\n(2.45)\n\n### 2.2.3 图形数据\n\n图形数据是 2D 模拟单色或彩色图像数字化的结果。此类图像的例子包括绘画、手稿、照片和视频图像等。图像通过两种方式转换为图形数据，即使用位图（光栅）图形和矢量图形。\n\
  \n*位图* 图形数据表示固定大小 *像素* 的矩阵。模拟图像的数字化通过空间离散化进行。更具体地说，图像被分割成单独的元素（像素），每个像素关联 2D 坐标和灰度等级（对于单色图像）或颜色调色板（对于彩色图像）。坐标和调色板具有数字形式。空间离散化将图形数据表达为有限维度的矩阵，其中每一行包含一定数量具有适当颜色的像素，颜色在数字尺度上表示。在硬件层面，模拟图像的位图转换由扫描仪实现。位图图形数据的示例见\
  \ Fig. 2.7(a)。\n\n![Figure 2.7](img/fig2_7.jpg)\n\nFigure 2.7\n\n*矢量* 图形数据涉及对称为\
  \ *基元* 的基本图形对象的数学描述。其中此类对象包括点、直线、某些曲线、样条、圆、多边形等。矢量图形基元的示例见 Fig. 2.7(b)。矢量数据相对于位图数据的最大优势在于能够在不损害图像原始质量的情况下实现相当简单的缩放。\n\
  \n在大多数情况下，模拟图像被转换为数字以便使用计算机、智能手机、视频和照相机等数字设备进行进一步自动处理。考虑标准（固定格式）文档的图像，例如账单和银行文件、财政文件、投票选票和问卷。这些文档具有明确的结构，包含待填写的字段。换句话说，有用的图形数据仅包含在相应框中。因此，无需扫描整个文档，只需扫描所需字段即可。因此，此类文档的位图表示具有固定结构，其字段的位图表示也是如此。\n\
  \n请注意，矢量格式经常被转换为位图格式。与此同时，反向转换计算量很大。\n\n### 2.2.4 文本数据\n\n文本是用于数字化的特殊对象，其本质上与上述对象不同。音频、视频和图形对象的信息完全由物理测量反映。相比之下，文本是某些规则及其人类感知的整合结果。因此，与其他类型对象不同，文本具有意义作为其显著属性。事实上，意义的概念是模糊的，这导致其以数值特征的隐式描述出现。\n\
  \n因此，文本数据是由某种文本模型产生的数值数据 [167]。我们将文本模型理解为用于表征文本的一组数值指标。除了易于计算的指标外，还存在所谓的语法树（或图表）和语义网络，其构造过程具有巨大的计算复杂度。\n\
  \n文本建模涉及文本的不同类型信息，即文本相关信息和外部信息。以下文本相关信息类型较为常见：\n\n* 文本元素的频率特征（在基本情况下，文档中是否存在来自给定列表的词语（术语））；\n\
  * 文档中词语的相互位置。词语根据给定语言的语法规则具有确定的顺序，从而形成组和句子。词语的相互位置包含一些有用信息；\n* 文档的格式。通常在出版前文本会被适当排版。单独的词语、句子甚至段落可以设置为不同类型（粗体、斜体等）或对齐；\n\
  * 文档的逻辑结构。文档通常由章节、节、小节和段落组成。这种文档的逻辑结构反映了文本的意义；\n* 对其他文档的引用。文档经常引用其他文档（例如以超文本链接或文献引用的形式）。\n\
  \n外部信息包括关于来源、作者、文档创建或修改日期、主题分类、用户对文档的行为（例如用户的访问率等）的信息。\n\n\n\n\n\n文档的频率特征最广泛使用，首先是同质属性的直方图，例如关键词条目的向量\
  \ [160]。在这种情况下，必须为所有分析的文档管理一个通用的术语表。每个文档表示为一个向量，其元素显示相应术语在文档中出现的次数。该向量的维度非常大，与术语表中的总术语数相匹配。\n\
  \n在一般设置中，该向量的一个元素表示术语在文档中的信息权重。实际上，术语的信息权重以更广的意义处理，具有附加属性，例如字母短序列的信息权重（例如两个字母的组合）、音节、单词或规范形式词组合\
  \ [175]。元素的权重通常使用其在文本中出现的某些统计特征来定义，并带有反映该元素在给定文档中的格式和位置的某些系数。\n\n在文本数值表征的第一阶段，扩展的术语权重允许分离出适用于文档的最合适的词集（bag）。词袋模型于\
  \ 1975 年提出，至今仍是常用的文本模型 [170]。在此模型框架内，文本表示为一组词，不考虑其顺序。每个词在此集合中被赋予一定的权重。因此，文档的模型由有限的词-权重对集组成。注意，权重可以分配给词（术语）或词干。存在以下标准的权重分配方法\
  \ [93]：\n\n* `the binary method (BI)`. 该方法仅定义某些术语在文档中的存在或不存在；\n* `the number of\
  \ term entries in a document`. 如果一个术语在文本中多次出现，则所考虑的文档很可能与该术语具有语义关系；\n* `the term\
  \ frequency (TF)`. 词频计算为术语条目数除以文档中的总词数；\n* `the logarithmical term frequency (LOGTF)`.\
  \ 该方法将术语的权重定义为 1 + log (`TF`)，其中 `TF` 为词频。由于信息权重分配的对数尺度，该模型对文档高估具有更高的稳定性；\n* `the\
  \ inverse document frequency (IDF)`. 该参数是词频的倒数。\n\n一种传统的方法是使用由术语-权重矩阵描述的文档集合来分析文本。\n\
  \n### 2.2.5 政府统计数据\n\n存在许多对象由政府统计服务使用与特定时间尺度相关的问题导向登记册进行评估。首先，注意对经济系统（宏观指标、劳动资源、GDP、财政等）、人口系统（生育率、死亡率和迁移率）以及环境系统（大气、地球、水、土壤等）的测量和国家评估。相当一部分统计测量是针对一个国家的各个地区进行的。\n\
  \n政府统计系统实施所有测量参数的获取、分析和结构化，以及根据接受的登记册将其进一步转换为数据。这些阶段中的每一个，从从现有来源获取信息到以表格形式对数据进行结构化，都伴随着不可避免的错误，也导致政府统计数据出现错误。存在两种类型的错误，即系统性错误和覆盖错误。前者由于将初始信息转换为数据的<|message|>\
  \ 方法不完善而发生，而后者由于目标对象与实际观察的元素之间不匹配而发生。\n\n为了阐明这一点，让我们考虑一个形成数据以计算人均国民收入的例子。这个问题似乎很简单：只需将货币形式的年\
  \ GDP 除以适龄人口数量即可。然而，货币形式的年 GDP 是使用广义价格计算的，而广义价格由某些模型定义。这些模型输入变量和特征（参数）的测量和估计存在误差（通常解释为随机变量）。因此，年\
  \ GDP 是按月计算的算术平均值，具有估计方差。适龄人口的情况类似，因为其规模在一年中不可预测地变化。换句话说，计算的年 GDP 值同时包含两种类型的错误。\n\
  \n考虑该情况的以下数学模型。用 `x` 表示与时间 `t` 相关联的感兴趣的指标。假设该指标取决于 `n` 个因素，`y[1]`，…，`y[n]`。这种假设导致覆盖错误：没有证据表明所接受的因素集（即其数量和含义）对于定义指标\
  \ `x` 是完整的。\n\n形成指标 `x` 的下一步是建模因素与 `x` 之间的参数化关系，即\n\n$$\n\\begin{array}{r}\n{x =\
  \ F(\\mathbf{y},\\mathbf{a}),}\n\\end{array}\n$$\n\n(2.46)\n\n其中 `a` = `{a[1],…,a[p]}`\
  \ 作为参数起作用。函数 `F` 及其参数化是通过专业知识选择的。正是这一阶段由于专家的知识有限、不完整和主观而引入系统性错误。\n\n事实上，政府统计系统具有分布式结构，并涉及对初始信息的各种初级处理方法。结合人为因素，这些特征几乎排除了对政府统计错误进行充分估计的可能性。剩下的替代方案是使用专家评估，其范围相当大，从\
  \ 5% 到 20%。\n\n现有错误本质上影响 (a) 输入和输出数据之间关系估计特征，以及 (b) 涉及政府统计数据的其他问题的解决方案。\n\n## 2.3\
  \ 缺失数据的恢复方法\n\n数字源生成与时间尺度绑定的数据序列。实践中常见的情况是存在不同的时间尺度或对于某个时间尺度的遗漏。然而，为了进一步使用数据序列，人们通常需要执行其同步（缩减为同一尺度）或恢复缺失数据。事实上，数据同步和恢复是密切相关的问题，其解决方案采用类似的方法。详细考虑其中的一些方法。\n\
  \n### 2.3.1 插值\n\n数字数据源生成模拟函数 `x(t)` 的值序列，其自变量为有限集。作为规则，这些值与具有步长 `h` 的某个时间尺度相关联。取另一个函数\
  \ `y(t)`，其生成的序列值在不同的时间尺度中，步长为 `s` < `h`，使得 {`h/s`} 为整数。然后我们自然会得到这些函数的同步，即有必要以步长\
  \ `s` 恢复 `x(t)` 在区间 [`i h`, (`i` + 1)`h`] 内的值（所谓的 数据插值问题）。解决该问题的经典方法是构造一个相当简单的函数\
  \ `z(t)`，使得其在 `h` 尺度中的值与函数 `x(t)` 在同一尺度中的值一致，即 `z[0]` = `x[0]`, …, `z[i h]` = `x[i\
  \ h]`。\n\n\n\n\n\n考虑一个任意的实函数 `x(t)` ∈ `R`，其定义在区间 \U0001D4AF = [0, T] 上。在空间 `R` 中选取一组有限的初等（简单）函数\
  \ `{φk}[0]^(n)`，使得它们线性无关。在大多数情况下，这是一组幂函数 1, t, t², …；或三角函数 1, sin t, cos t, sin\
  \ 2t, cos 2t, …；或指数函数 1, exp(α[1]t), exp(α[2]t), …，其中 {α[i]} 表示一个数列。\n\n利用前 n +\
  \ 1 个函数 `{φk}[0]^(n)`，构造所有可能的线性组合\n\n$$\n\\begin{array}{r}\n{a_{0}\\varphi_{0}(t)\
  \ + a_{1}\\varphi_{1}(t) + \\cdots + a_{n}\\varphi_{n}(t) = \\psi(t)}\n\\\\\n\\\
  end{array}\n$$\n\n(2.47)\n\n其中系数 `a[0]`，…，`a[n]` 为实数。在插值理论中，这些系数按以下方式计算。选取变量 t 的\
  \ n + 1 个值，即 `t[0]`，…，`t[n]`，它们称为插值节点。令函数 `x(t)` 及其插值函数 `ψ(t)` 在这些节点处取相同的值。这导致线性方程组\n\
  \n$$\n\\begin{array}{r}\n{x(t_{j}) = a_{0}\\varphi_{0}(t_{j}) + a_{1}\\varphi_{1}(t_{j})\
  \ + \\cdots + a_{n}\\varphi_{n}(t_{j}),\\quad\\quad j = \\overline{0,n}.}\n\\\\\n\
  \\end{array}\n$$\n\n(2.48)\n\n节点应选取使得行列式\n\n$$\n\\begin{array}{r}\n{\\Delta = \\\
  left| \\begin{array}{lll}\n{\\varphi_{0}(t_{0})} & \\cdots & {\\varphi_{n}(t_{0})}\n\
  \\\\\n\\cdots & \\cdots & \\cdots\n\\\\\n{\\varphi_{0}(t_{n})} & \\cdots & {\\varphi_{n}(t_{n})}\n\
  \\\\\n\\end{array} \\right| \\neq 0.}\n\\\\\n\\end{array}\n$$\n\n(2.49)\n\n成立。则该系统具有唯一解\n\
  \n$$\n\\begin{array}{r}\n{a_{i} = \\frac{{\\sum\\limits_{j = 0}^{n}x}(t_{j})\\Delta_{ij}}{\\\
  Delta},\\quad\\quad i = \\overline{0,n},}\n\\\\\n\\end{array}\n$$\n\n(2.50)\n\n\
  其中 `Δ[i j]` 给出元素 (i j) 的代数余子式。因此，根据 (2.47)，\n\n$$\n\\begin{array}{r}\n{\\psi(t)\
  \ = x(t_{0})\\Phi_{0}(t) + x(t_{1})\\Phi_{1}(t) + \\ldots + x(t_{n})\\Phi_{n}(t).}\n\
  \\\\\n\\end{array}\n$$\n\n(2.51)\n\n函数 `Φi` 是函数 `ϕi` 的线性组合，且不依赖于函数 `x(t)`。由于在插值节点处等式\
  \ `x(t[j]) = ψ(t[j])` 成立，函数 `Φi` 满足以下条件：\n\n$$\n\\begin{array}{r}\n{\\Phi_{i}(t_{j})\
  \ = \\left\\{ \\begin{aligned}\n0 & {\\text{for}\\, i \\neq j,}\n\\\\\n1 & {\\text{for}\\\
  , i = j.}\n\\\\\n\\end{aligned}~ \\right.}\n\\\\\n\\end{array}\n$$\n\n(2.52)\n\n\
  参见，例如，专著 [17] 中对精细插值过程及其性质的讨论。\n\n作为背景信息，考虑在应用中广泛使用的一些插值函数类。首先，*拉格朗日插值多项式*。考虑幂函数序列\
  \ 1, t, t², …, t^(n), … 作为基函数。该序列在任何区间上都是线性无关的。为了定义函数 `ψ(t)` (2.47)，求出函数 `Φi`，它们是函数\
  \ `ϕ0`，…，`ϕn` 的线性组合并满足条件 (2.52)。换句话说，利用基序列的元素，需要构造一个在点 `t[0]`，…，`t[i−1]` 处消失且在点\
  \ `t[i]` 处取值为 1 的多项式。这样的多项式具有形式\n\n$$\n\\begin{array}{r}\n{\\Phi_{i}(t) = A(t -\
  \ t_{0})(t - t_{1})\\cdots(t - t_{i - 1})(t - t_{i + 1})\\cdots(t - t_{n}).}\n\\\
  \\\n\\end{array}\n$$\n\n(2.53)\n\n由于 `Φi = 1`，可得\n\n$$\n\\begin{array}{r}\n{1 =\
  \ A(t_{i} - t_{0})(t_{i} - t_{1})\\cdots(t_{i} - t_{i - 1})(t_{i} - t_{i + 1})\\\
  cdots(t_{i} - t_{n}).}\n\\\\\n\\end{array}\n$$\n\n(2.54)\n\n随后，\n\n$$\n\\begin{array}{r}\n\
  {\\Phi_{i}(t) = \\frac{(t - t_{0})(t - t_{1})\\cdots(t - t_{i - 1})(t - t_{i + 1})\\\
  cdots(t - t_{n})}{(t_{i} - t_{0})(t_{i} - t_{1})\\cdots(t_{i} - t_{i - 1})(t_{i}\
  \ - t_{i + 1})\\cdots(t_{i} - t_{n})}.}\n\\\\\n\\end{array}\n$$\n\n(2.55)\n\n而拉格朗日插值多项式由下式给出\n\
  \n$$\n\\begin{aligned}\n{\\psi(t) = L_{n}(t)} & {= x(t_{0})\\frac{(t - t_{1})\\\
  cdots(t - t_{n})}{(t_{0} - t_{1})\\cdots(t_{0} - t_{n})} +}\n\\\\\n& {+ x(t_{1})\\\
  frac{(t - t_{0})(t - t_{2})\\ldots(t - t_{n})}{(t_{1} - t_{0})(t_{1} - t_{2})\\\
  ldots(t_{1} - t_{n})} + \\cdots +}\n\\\\\n& {+ x(t_{n})\\frac{(t - t_{0})\\ldots(t\
  \ - t_{n - 1})}{(t_{n} - t_{0})(t_{n} - t_{1})\\ldots(t_{n} - t_{n - 1})}.}\n\\\\\
  \n\\end{aligned}\n$$\n\n(2.56)\n\n引入函数\n\n$$\n\\begin{array}{r}\n{\\omega_{n}(t)\
  \ = {\\prod\\limits_{i = 0}^{n}{(t - t_{i})}}}\n\\\\\n\\end{array}\n$$\n\n(2.57)\n\
  \n并将拉格朗日插值多项式写为\n\n$$\n\\begin{array}{r}\n{L_{n}(t) = {\\sum\\limits_{i = 0}^{n}x}(t_{i})\\\
  frac{\\omega_{n}(t)}{(t - t_{i})\\omega_{n}^{\\prime}(t_{i})}.}\n\\\\\n\\end{array}\n\
  $$\n\n(2.58)\n\n在应用意义上，拉格朗日插值多项式有些不便，因为增加一个新节点需要形成一个新的多项式。这一缺点在牛顿表示的插值多项式中不存在。更具体地说，*牛顿插值多项式*\
  \ 涉及如下的差商概念 [17]。\n\n考虑 n + 1 个节点以及相同数量的函数 `x(t)` 的值，即 `x(t[0])`，…，`x(t[n])`。函数\
  \ `x(t)` 在节点 `t[i−1]`、`t[i]` 处的第一个差商为值\n\n$$\n\\begin{array}{r}\n{\\Delta_{i - 1,i}\
  \ = \\frac{x(t_{i}) - x(t_{i - 1})}{t_{i} - t_{i - 1}}.}\n\\\\\n\\end{array}\n$$\n\
  \n(2.59)\n\n高阶差商递归计算。m 阶差商的一般公式为\n\n$$\n\\begin{array}{r}\n{\\Delta_{i - 1,i,i +\
  \ 1,\\ldots,i + m} = \\frac{\\Delta_{i,i + 1,\\ldots,i + m} - \\Delta_{i - 1,i,i\
  \ + 1,\\ldots,i + m - 1}}{t_{i + m} - t_{i}}.}\n\\\\\n\\end{array}\n$$\n\n(2.60)\n\
  \n将拉格朗日插值多项式表示为\n\n$$\n\\begin{array}{r}\n{L_{n}(t) = L_{0}(t) + (L_{1}(t) - L_{0}(t))\
  \ + \\ldots + (L_{n}(t) - L_{n - 1}(t)).}\n\\\\\n\\end{array}\n$$\n\n(2.61)\n\n\
  显然，这就是恒等式 `Ln = Ln`。可以证明 [17]\n\n$$\n\\begin{array}{r}\n{L_{i}(t) - L_{i - 1}(t)\
  \ = \\Delta_{0,\\ldots,i}\\omega_{i}(t),}\n\\\\\n\\end{array}\n$$\n\n(2.62)\n\n\
  其中 `ωi = (t−t[0])⋯(t−t[i])`。则拉格朗日插值多项式的牛顿表示 `Nn` 可写为\n\n$$\n\\begin{aligned}\n&\
  \ {L_{n}(t) = N_{n}(t) = x(t_{0}) + \\Delta_{0,1}(t - t_{1}) + \\ldots +}\n\\\\\n\
  & {\\quad\\quad + \\Delta_{0,\\ldots,n}(t - t_{0})(t - t_{1})\\cdots(t - t_{n -\
  \ 1}).}\n\\\\\n\\end{aligned}\n$$\n\n(2.63)\n\n再次指出，有兴趣的读者可从专著 [17] 中获得关于插值多项式的深入知识。\n\
  \n### 2.3.2 辅助动态模型\n\n在本小节中，我们描述一种基于数据源数学模型的缺失数据（在时间尺度上）恢复方法。令 `\U0001D4B3[h]^(N)\
  \ = {x[0],x[h],…,x[N h]}` 为绑定到步长为 `h` 的时间尺度上的数值数据包。利用这些数据，构造阶梯函数 `x̃(t)`，其形式为\n\n\
  $$\n\\begin{array}{r}\n{\\widetilde{x}(t) = x\\lbrack ih\\rbrack\\quad\\text{for~}ih\
  \ \\leq t < (i + 1)h,\\quad i = \\overline{0,N-1}.}\n\\\\\n\\end{array}\n$$\n\n\
  (2.64)\n\n考虑一个以上述阶梯函数为输入、输出 `y(t)` 形式为的动态系统\n\n$$\n\\begin{array}{r}\n\\left. y\\\
  lbrack nh\\rbrack = \\mathcal{L}(x\\lbrack ih\\rbrack,\\mathbf{a}\\, \\middle| \\\
  , 0 \\leq i < n). \\right.\n\\\\\n\\end{array}\n$$\n\n(2.65)\n\n\n\n\n\n在该表达式中，ℒ\
  \ 表示一个泛函，其表征了具有参数 **a** ∈ *R*^(*m*) 的系统的动态特性，其中 *m* 是参数向量的维数。参数 **a** 实际上会影响函数 *y*(*t*)，即\
  \ *y*(*t*, **a**)。对于向量 **a** 的元素取某些值时，系统在离散时刻 *ih* 输出数据包 \U0001D4B4[*h*]^(*N*) = {*y*\\\
  [0,**a**\\],*y*\\[*h*,**a**\\],…,*y*\\[(*N*−1)*h*,**a**\\]}。\n\n定义数据包 \U0001D4B3\
  [*h*]^(*N*)、\U0001D4B4[*h*]^(*N*) 之间的总残差为\n\n$$\\\\begin{array}{r} {J(\\\\mathbf{a})\
  \ = {\\\\sum\\\\limits\\_{i = 0}^{N}{(x\\\\lbrack ih\\\\rbrack - y\\\\lbrack ih,\\\
  \\mathbf{a}\\\\rbrack)}^{2}}.} \\\\\\\\ \\\\end{array}$$\n\n(2.66)\n\n该残差的最小值给出最优参数，在该参数下，以上所述数据包在\
  \ *h*\\-尺度的节点处的差异尽可能小（以泛函 *J* (2.66) 为准），即\n\n$$\\\\begin{array}{r} {\\\\mathbf{a}^{\\\
  *} = \\\\arg\\\\min J(\\\\mathbf{a}).} \\\\\\\\ \\\\end{array}$$\n\n(2.67)\n\n将最优参数代入\
  \ (2.65) 得到数据包 \U0001D4B4[*s*]^(*N**r*) = {*y*^(\\*)\\[0\\],*y*^(\\*)\\[*s*\\],…,*y*^(\\\
  *)\\[(*l*−1)*s*\\],*y*^(\\*)\\[*h*\\],*y*\\[*h*+*s*\\],…,*y*^(\\*)\\[*h*+(*l*−1)*s*\\\
  ];*y*^(\\*)\\[2*h*\\],*y*^(\\*)\\[2*h*+*s*\\],…,*y*^(\\*)\\[*N**h*\\]}，其中 *s* < *h*，*h*/*s* = *r*\
  \ 且 *r* 为整数。\n\n该方法将以具有脉冲响应 *w*(*t*, **a**)、*t* ≥ 0 的线性动态系统为例进行说明。设\n\n$$\\\\begin{array}{r}\
  \ {w(t) = a\\_{1}\\\\exp( - a\\_{2}t),} \\\\\\\\ \\\\end{array}$$\n\n(2.68)\n\n\
  其中 *a*[1]、*a*[2] 为区间型未知参数，即分别属于某些区间 0 < *a*[1] ≤ *a*[1]^+ 和 *a*[2]^− ≤ *a*[2] ≤ *a*[2]^+\
  \ 的参数。一般而言，这些区间的极限是未知的。求得它们的一种可能方法是在 *a*[1]^+、*a*[2]^− 和 *a*[2]^+ 上对 *J* (2.66)\
  \ 进行全局最小化（或若全局最小值不存在则计算一个可接受的小值）。\n\n向该系统的输入供给阶跃函数 *x̃*(*t*) 以产生输出\n\n$$\\\\begin{array}{r}\
  \ {y(t) = a\\_{1}{\\\\int\\\\limits\\_{0}^{t}\\\\exp}( - a\\_{2}(t - \\\\tau))\\\
  \\widetilde{x}(\\\\tau)d\\\\tau.} \\\\\\\\ \\\\end{array}$$\n\n(2.69)\n\n区间 \\[0,*t*\\\
  ] 包含整数个子区间 *N* = {*t*/*h*} 且 *t* = *N**h* + *μ*，其中 0 ≤ *μ* < (*N* + 1)*h*。于是表达式\
  \ (2.69) 可写为\n\n$$\\\\begin{array}{r} {y(t) = \\\\frac{a\\_{1}}{a\\_{2}}\\\\exp(\
  \ - a\\_{2}t)\\\\,{\\\\sum\\\\limits\\_{i = 0}^{N}x}\\\\lbrack ih\\\\rbrack\\\\\
  exp(a\\_{2}ih)\\\\left( {\\\\exp(a\\_{2}h) - 1} \\\\right).} \\\\\\\\ \\\\end{array}$$\n\
  \n(2.70)\n\n系统在 *h*\\-尺度节点处的输出为\n\n$$\\\\begin{array}{r} {y\\\\lbrack ih\\\\rbrack\
  \ = \\\\frac{a\\_{1}}{a\\_{2}}\\\\left( {\\\\exp(a\\_{2}h) - 1} \\\\right)\\\\exp(\
  \ - a\\_{2}ih)\\\\,{\\\\sum\\\\limits\\_{j = 0}^{i}x}\\\\lbrack jh\\\\rbrack\\\\\
  exp(a\\_{2}jh).} \\\\\\\\ \\\\end{array}$$\n\n(2.71)\n\n因此，总残差泛函 (2.66) 的形式为\n\n\
  $$\\\\begin{array}{r} \\\\left. J(a\\_{1},a\\_{2}) = {\\\\sum\\\\limits\\_{i = 0}^{N}{\\\
  \\sum\\\\limits\\_{j = 0}^{i}\\\\left( {A\\_{i,j}(a\\_{1},a\\_{2})x\\\\lbrack jh\\\
  \\rbrack} \\\\right)^{2}}}\\\\Rightarrow\\\\min, \\\\right. \\\\\\\\ \\\\end{array}$$\n\
  \n(2.72)\n\n其中\n\n$$\\\\begin{array}{r} {A\\_{i,j} = \\\\left\\\\{ \\\\begin{aligned}\
  \ {\\\\frac{a\\_{1}}{a\\_{2}}\\\\left( {\\\\exp(a\\_{2}h) - 1} \\\\right)\\\\exp(a\\\
  _{2}h(j - i))} & {\\\\text{for}\\\\, j < i,} \\\\\\\\ {\\\\frac{a\\_{1}}{a\\_{2}}\\\
  \\left( {\\\\exp(a\\_{2}h) - 1} \\\\right) - 1} & {\\\\text{~for}\\\\, j = i.} \\\
  \\\\\\ \\\\end{aligned}~ \\\\right.} \\\\\\\\ \\\\end{array}$$\n\n(2.73)\n\n注意，泛函\
  \ (2.72) 具有相当复杂的结构，不利于对其性质如唯一最小值、凸性（凹性）等进行解析研究。因此，在应用中应使用数值全局最小化方法来恢复（或与其它数据包同步）缺失数据。\n\
  \n一旦参数 *a*[1] 和 *a*[2] 计算出来，步长为 *s* 的缺失数据可由下式恢复\n\n$$\\\\begin{aligned} {y\\\\lbrack\
  \ ih + ks\\\\rbrack} & {= \\\\frac{a\\_{1}}{a\\_{2}}\\\\exp( - a\\_{2}(ih + ks))\\\
  \\,{\\\\sum\\\\limits\\_{i = 0}^{N}x}\\\\lbrack ih\\\\rbrack\\\\exp(a\\_{2}ih)\\\
  \\left( {\\\\exp(a\\_{2}h) - 1} \\\\right),} \\\\\\\\ i & {= \\\\overline{0,N},\\\
  \\,\\\\, k = \\\\overline{0,M},\\\\,\\\\, M = \\\\left\\\\{ h/s \\\\right\\\\}.}\
  \ \\\\\\\\ \\\\end{aligned}$$\n\n(2.74)\n\n### 2.3.3 空间熵分解\n\n如前所述，由政府统计部门形成的数据与一定的空间单元（区域）相关联，每个区域都有一组属性，即指标。此类区域的维度和这些指标的值信息之间往往相互关联。在许多情况下，研究的区域越小，其指标信息的可及性就越差。这导致了一个相当紧迫的“传播”问题，即利用关于后者的一些间接信息，将大区域的可用国家指标传播到其内部的小区。\n\
  \n考虑由 *I* 个区域组成的经济空间 \U0001D53C。每个区域 *i* 包含 *M*[*i*] 个区，如 Fig. 2.8 所示。设区域 *i* 及其内部的区\
  \ (*i*, *j*) 由唯一的齐次指标 *S*[*i*] 和 *S*[*i**j*] 表征，分别。例如，可能的指标列表包括人口规模、生产密度、服务配备等。区域和区指标\
  \ *S*[*i*] 和 *S*[*i**j*] 满足平衡约束\n\n$$\\\\begin{array}{r} {S\\_{i} = {\\\\sum\\\\\
  limits\\_{j = 1}^{M\\_{i}}S\\_{ij}},\\\\text{\\\\quad\\\\quad}i = \\\\overline{1,I}.}\
  \ \\\\\\\\ \\\\end{array}$$\n\n(2.75)\n\n![Figure 2.8](img/fig2_8.jpg)\n\nFigure\
  \ 2.8\n\n每个区域因此每个区都生产 *r* 种类型的商品或处置 *r* 种类型的资源。假设对于每种商品（资源）类型 *k*，区域 *i* 的生产函数依赖于所有区域的状态指标，即\
  \ $\\\\overset{\\\\rightarrow}{S} = \\\\left\\\\{ S\\_{1},\\\\ldots,S\\_{I} \\\\\
  right\\\\}.$ 用 $Q\\_{ik}(\\\\overset{\\\\rightarrow}{S}),\\\\, i = \\\\overline{1,I},\\\
  \\, k = \\\\overline{1,r}.$ 表示这些函数。同一假设也适用于区；用 *q**i**j**k* 表示其生产函数，其中 \U0001D54A\
   = {*S*[11],…,*S*[1, *M*[1]];…;*S*[*I*, 1],…,*S*[*I*, *M*[*I*]]}。于是资源约束具有形式\n\n\
  $$\\\\begin{array}{r} {{\\\\sum\\\\limits\\_{j = 1}^{M\\_{i}}q\\_{ijk}}(\\\\mathbb{S})\
  \ = Q\\_{ik}(\\\\mathbf{S}),\\\\text{\\\\quad\\\\quad}i = \\\\overline{1,I},\\\\\
  ,\\\\, k = \\\\overline{1,r}.} \\\\\\\\ \\\\end{array}$$\n\n(2.76)\n\n假设区域指标 **S**\
  \ 已知而区指标 \U0001D54A 未知。问题是求出区指标，同时考虑由 (2.75) 和 (2.76) 给出的平衡和资源约束。区指标的总数量为 $m = {\\\
  \\sum\\\\limits\\_{i = 1}^{I}M\\_{i}},$ 因为按假设每个区和区域都有单一指标。此外，问题共包含 (*r* + 1)*I*\
  \ 个平衡和资源约束，且 *m* > (*r* + 1)*I*。因此，满足等式 (2.75, 2.76) 的区指标集合众多。\n\n获得唯一的区指标集合的一种方法源于熵最大化原理。事实上，熵是区域指标在相应区之间分布的不确定性度量\
  \ \\[138\\]，即\n\n$$\\\\begin{array}{r} {H(\\\\mathbb{S}) = - {\\\\sum\\\\limits\\\
  _{i = 1,j = 1}^{I,M\\_{i}}S\\_{ij}}\\\\ln\\\\frac{S\\_{ij}}{a\\_{ij}e},} \\\\\\\\\
  \ \\\\end{array}$$\n\n(2.77)\n\n其中 \U0001D54A 是表征区指标分布的矩阵，其元素为 *S*[*i**j*]。具有最高不确定性的分布\
  \ **S** 对应于在平衡和资源约束 (2.75, 2.76) 下熵 *H* 的最大值。关于感兴趣区域内各区的任何先验信息均可纳入熵函数 *H* 的参数 *a*[*i**j*]\
  \ 中。\n\n\n\n\n\n因此，区域指标在各区间的分布，称为*熵分解*，是优化问题的解\n\n$$\\\\begin{array}{r} \\\\left.\
  \ H(\\\\mathbb{S})\\\\Rightarrow\\\\max,\\\\quad\\\\mathbb{S} \\\\in D, \\\\right.\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(2.78)\n\n其中\n\n$$\\\\begin{array}{r} {D = \\\\\
  left\\\\{ S\\_{ij} \\\\middle| {\\\\sum\\\\limits\\_{j = 1}^{M\\_{i}}S\\_{ij}} =\
  \ S\\_{i};\\\\,\\\\,{\\\\sum\\\\limits\\_{j = 1}^{M\\_{i}}q\\_{ijk}}(\\\\mathbb{S})\
  \ = Q\\_{ik}(S),\\\\quad i = \\\\overline{1,I},\\\\,\\\\, k = \\\\overline{1,r}\
  \ \\\\right\\\\}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.79)\n\n在此一般表述中，所有区域和区都通过相应的生产函数相互关联。另一个极端情况是所有区域和区都是孤立的，即区域和区生产函数仅依赖于其自身区域或区的状态指标：\n\
  \n$$\\\\begin{array}{r} {q\\_{ijk}(\\\\mathbb{S}) = q\\_{ijk}(S\\_{ij}),\\\\quad\
  \ Q\\_{ik}(\\\\mathbf{S}) = Q\\_{ik}(S\\_{i});\\\\,\\\\, i = \\\\overline{1,I}\\\
  \\,\\\\, k = \\\\overline{1,r}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.80)\n\n对于孤立区域，熵分解问题\
  \ (2.78) 归结为 *I* 个形式为的优化问题\n\n$$\\\\begin{array}{r} \\\\left. H\\_{i}(\\\\mathbb{S}\\\
  _{i})\\\\Rightarrow\\\\max,\\\\quad\\\\mathbb{S}\\_{i} \\\\in D\\_{i}, \\\\right.\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(2.81)\n\n其中\n\n$$\\\\begin{array}{r} {H\\_{i}(\\\
  \\mathbb{S}\\_{i}) = - {\\\\sum\\\\limits\\_{j = 1}^{M\\_{i}}S\\_{ij}}\\\\ln\\\\\
  frac{S\\_{ij}}{a\\_{ij}e},} \\\\\\\\ \\\\end{array}$$  \n\n(2.82)\n\n$$\\\\begin{array}{r}\
  \ {D\\_{i} = \\\\left\\\\{ S\\_{ij} \\\\middle| {\\\\sum\\\\limits\\_{j = 1}^{M\\\
  _{i}}S\\_{ij}} = S\\_{i},\\\\,\\\\,{\\\\sum\\\\limits\\_{j = 1}^{M\\_{i}}q\\_{ijk}}(S\\\
  _{ij}) = Q\\_{ik}(S\\_{i}),\\\\quad i = \\\\overline{1,I},\\\\,\\\\, k = \\\\overline{1,r}\
  \ \\\\right\\\\}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.83)\n\n这些区的生产函数 `q[i j k]`\
  \ 形成其状态指标的非线性函数。然而，如果经济处于均衡的邻域，则生产函数的线性表示就成为这些函数的完全充分描述，即\n\n$$\\\\begin{array}{r}\
  \ {q\\_{ijk}(S\\_{ij}) = c\\_{ijk}S\\_{ij},\\\\text{\\\\quad\\\\quad}i = \\\\overline{1,I},\\\
  \\,\\\\, k = \\\\overline{1,r}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.84)\n\n这里 `c[i\
  \ j k]` 表示区 (`i`, `j`) 中商品 `k` 的特定产出。在这种情况下，可行集 `D[i]` (2.83) 由线性等式系统给出\n\n$$\\\\\
  begin{array}{r} {D\\_{i} = \\\\left\\\\{ S\\_{ij} \\\\middle| {\\\\sum\\\\limits\\\
  _{j = 1}^{M\\_{i}}S\\_{ij}} = S\\_{i};\\\\,\\\\,\\\\,{\\\\sum\\\\limits\\_{j = 1}^{M\\\
  _{i}}c\\_{ijk}}S\\_{ij} = Q\\_{ik}(S\\_{i}),\\\\quad i = \\\\overline{1,I},\\\\\
  ,\\\\, k = \\\\overline{1,r} \\\\right\\\\}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.85)\n\
  \n考虑具有线性生产函数的熵分解过程的特殊性，针对一个区域 (`I` = 1) 和一种资源类型 (`r` = 1)：\n\n$$\\\\begin{aligned}\
  \ {H\\_{1}(\\\\mathbb{S}\\_{1})} & \\\\left. = - {\\\\sum\\\\limits\\_{j = 1}^{M\\\
  _{1}}S\\_{1j}}\\\\ln\\\\frac{S\\_{1j}}{a\\_{1j}e}\\\\Rightarrow\\\\max, \\\\right.\
  \ \\\\\\\\ {\\\\sum\\\\limits\\_{j = 1}^{M\\_{1}}S\\_{1j}} & {= S\\_{1},\\\\quad{\\\
  \\sum\\\\limits\\_{j = 1}^{M\\_{1}}c\\_{1j1}}S\\_{1j} = Q\\_{11}(S\\_{1}).} \\\\\
  \\\\ \\\\end{aligned}$$  \n\n(2.86)\n\n该问题由以下参数表征：先验概率 `a[1 j]`；区域的状态指标 `S[1]`；特定生产率\
  \ `c[1 j 1]` 和区域的生产函数 `Q[11]`。问题的解，即区域状态指标在其各区间的熵最优分布，取决于这些参数。\n\n引入新变量以略微减少问题中的参数个数。记\n\
  \n$$\\\\begin{array}{r} {w\\_{1j} = \\\\frac{S\\_{1j}}{S\\_{1}},\\\\text{\\\\quad\\\
  \\quad}h\\_{1j1} = \\\\frac{c\\_{1j1}}{Q\\_{11}(S\\_{1})},\\\\,\\\\, j = \\\\overline{1,M\\\
  _{1}}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.87)\n\n如果区域指标 `S[1]` 已给定，则变量 `h[1 j 1]`\
  \ 也已固定。以此记号，熵分解问题可写为\n\n$$\\\\begin{aligned} {H(\\\\mathbf{w})} & \\\\left. = -\
  \ {\\\\sum\\\\limits\\_{j = 1}^{M}w\\_{j}}\\\\ln\\\\frac{w\\_{j}}{a\\_{j}e}\\\\\
  Rightarrow\\\\max, \\\\right. \\\\\\\\ {\\\\sum\\\\limits\\_{j = 1}^{M}w\\_{j}}\
  \ & {= 1;\\\\quad{\\\\sum\\\\limits\\_{j = 1}^{M}h\\_{j}}\\\\, w\\_{j} = q,} \\\\\
  \\\\ \\\\end{aligned}$$  \n\n(2.88)\n\n其中 `q` = 1/`S[1]` 且下标 `i` = `k` = 1 被省略。\n\
  \n使用拉格朗日乘数法求解该问题。拉格朗日函数形式为\n\n$$\\\\begin{array}{r} {L(\\\\mathbf{w},\\\\mu,\\\\\
  lambda) = H(\\\\mathbf{w}) + \\\\mu(1 - {\\\\sum\\\\limits\\_{j = 1}^{M}w\\_{j}})\
  \ + \\\\lambda(q - {\\\\sum\\\\limits\\_{j = 1}^{M}h\\_{j}}\\\\, w\\_{j}).} \\\\\
  \\\\ \\\\end{array}$$  \n\n(2.89)\n\n拉格朗日函数的 一阶最优性条件给出方程\n\n$$\\\\begin{aligned}\
  \ w\\_{j} & {= a\\_{j}\\\\exp( - \\\\mu - \\\\lambda\\\\, h\\_{j}) = a\\_{j}\\\\\
  , u\\\\, z^{h\\_{j}};} \\\\\\\\ & {u = \\\\exp( - \\\\mu),\\\\, z = \\\\exp( - \\\
  \\lambda).} \\\\\\\\ \\\\end{aligned}$$  \n\n(2.90)\n\n考虑到 (2.88) 中的平衡和资源约束，写出拉格朗日乘数\
  \ `λ` 的方程：\n\n$$\\\\begin{array}{r} {{\\\\sum\\\\limits\\_{j = 1}^{M}a\\_{j}}\\\\\
  , z^{h\\_{j}}\\\\,(h\\_{j} - q) = 0,\\\\text{\\\\quad\\\\quad}j = \\\\overline{1,M}.}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(2.91)\n\n设\n\n$$\\\\begin{array}{r} {c\\_{j} =\
  \ a\\_{j}(h\\_{j} - q),\\\\text{\\\\quad\\\\quad}j = \\\\overline{1,M},} \\\\\\\\\
  \ \\\\end{array}$$  \n\n(2.92)\n\n并将方程 (2.91) 变换为\n\n$$\\\\begin{array}{r} {f(z)\
  \ = {\\\\sum\\\\limits\\_{j = 1}^{M}c\\_{j}}z^{h\\_{j}} = 0,\\\\quad z > 0.} \\\\\
  \\\\ \\\\end{array}$$  \n\n(2.93)\n\n按如下方式排序参数 `h[j]`：\n\n$$\\\\begin{array}{r}\
  \ {0 < h\\_{1} < h\\_{2} < \\\\cdots < h\\_{l} < q < h\\_{l + 1} < \\\\cdots < h\\\
  _{M}.} \\\\\\\\ \\\\end{array}$$  \n\n(2.94)\n\n于是，\n\n$$\\\\begin{array}{r} {c\\\
  _{j} < 0\\\\quad\\\\text{for~}j = \\\\overline{1,l}\\\\quad\\\\text{and}\\\\quad\
  \ c\\_{j} > 0\\\\quad\\\\text{~for~}j = \\\\overline{l+1,M}.} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(2.95)\n\n考虑具有任意符号系数 `c[j]` 的方程 (2.93)。注意它有根 `z[0]` = 0。因此，该方程可写为\n\n$$\\\
  \\begin{array}{r} {f(z) = z^{h\\_{1}}f\\_{1}(z) = 0,\\\\,\\\\,\\\\, z > 0,} \\\\\
  \\\\ \\\\end{array}$$  \n\n(2.96)\n\n其中函数\n\n$$\\\\begin{array}{r} {f\\_{1}(z) =\
  \ c\\_{1} + {\\\\sum\\\\limits\\_{j = 2}^{M}c\\_{j}}z^{h\\_{j} - h\\_{1}}} \\\\\\\
  \\ \\\\end{array}$$  \n\n(2.97)\n\n没有零根。\n\n现在考虑在系数 `c[j]` 按照 (2.95) 排序的情况下的方程 (2.96,\
  \ 2.97)，即\n\n$$\\\\begin{array}{r} {c\\_{j} < 0\\\\,\\\\,\\\\text{for}\\\\,\\\\\
  , j = 1,\\\\ldots,l,\\\\text{\\\\quad\\\\quad}c\\_{j} > 0\\\\,\\\\,\\\\text{for}\\\
  \\,\\\\, j = l + 1,\\\\ldots,M.} \\\\\\\\ \\\\end{array}$$  \n\n(2.99)\n\n因此，已证明在条件\
  \ (2.95) 下，方程 (2.98) 具有唯一正解。\n\n### 表 2.1：区域状态指标\n\n| no. | `c̃[j]` | `S[j]` | `S̃[j]`\
