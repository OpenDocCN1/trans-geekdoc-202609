  \\hat{L}}\\_{max}^{(i)} - {\\\\hat{L}}\\_{min}^{(i)}},} \\\\\\\\ {\\\\tau\\_{r}^{(i)}\\\
  \\lbrack n\\\\rbrack} & {= \\\\frac{{\\\\hat{\\\\tau}}\\_{r}^{(i)}\\\\lbrack n\\\
  \\rbrack - {\\\\hat{\\\\tau}}\\_{min}^{(i)}}{{\\\\hat{\\\\tau}}\\_{max}^{(i)} -\
  \ {\\\\hat{\\\\tau}}\\_{min}^{(i)}},} \\\\\\\\ t\\_{r}^{(i)} & {= \\\\frac{1}{24}{\\\
  \\sum\\\\limits\\_{n = 1}^{24}\\\\tau\\_{r}^{(i)}}\\\\lbrack n\\\\rbrack,} \\\\\\\
  \\ \\\\end{aligned}$$  \n\n(11.34)\n\n\n\n\n\nwhere${\\\\hat{L}}\\_{min}^{(i)} =\
  \ \\\\min\\\\limits\\_{n}{\\\\hat{L}}^{(i)}\\\\lbrack n\\\\rbrack$, ${\\\\hat{L}}\\\
  _{max}^{(i)} = \\\\max\\\\limits\\_{n}{\\\\hat{L}}^{(i)}\\\\lbrack n\\\\rbrack$,\
