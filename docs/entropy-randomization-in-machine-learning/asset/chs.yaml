  \ \\middle| \\frac{\\partial\\phi(\\mathbf{w},\\mathbf{z})}{\\partial w_{k}} \\\
  middle| \\,\\max_{(\\zeta,\\mathbf{w}) \\in I^{n}}\\|\\zeta - \\mathbf{w}\\|. \\\
  right. \\\\ \\end{array}$$\n\n(7.119)\n\n任意随机点与其最近邻之间的距离不超过基本立方体的对角线，即\n\n$$\\begin{aligned}\
