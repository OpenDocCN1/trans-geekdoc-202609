  \ - \\\\tau\\\\, \\\\middle| \\\\,\\\\mathbf{b})\\\\,{\\\\int\\_{\\\\mathcal{T}\\\
  _{\\\\tau}}C}(t - \\\\lambda\\\\, \\\\middle| \\\\,\\\\mathbf{c})\\\\,\\\\mathbf{y}(\\\
  \\lambda)\\\\, d\\\\tau d\\\\lambda. \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n\
  (4.73)\n\nUsing the Fourier transform \\[43\\], write the solution of this equation\
  \ in the frequency domain (i.e., in terms of image functions):\n\n$$\\\\begin{aligned}\
  \ & \\\\left. \\\\mathbf{Y}(s) = K(s\\\\, \\\\middle| \\\\,\\\\mathbf{a},\\\\mathbf{b},\\\
  \\mathbf{c})\\\\,\\\\mathbf{X}(s), \\\\right. \\\\\\\\ & \\\\left. K(s\\\\, \\\\\
  middle| \\\\,\\\\mathbf{a},\\\\mathbf{b},\\\\mathbf{c}) = \\\\left( I - F(s\\\\\
  , \\\\middle| \\\\,\\\\mathbf{b})C(s\\\\, \\\\middle| \\\\,\\\\mathbf{c}) \\\\right)^{(\
  \ - 1)}G(s\\\\, \\\\middle| \\\\,\\\\mathbf{a}). \\\\right. \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(4.74)\n\nHere *s* = *α* + *ι**ω* and $\\\\iota = \\\\sqrt{- 1},$ whereas\
  \ *α* and *ω* are real variables. Transition from the frequency domain to the time\
