  neq k}^{t}x_{n_{r}}}.} \\\\ \\end{array}$$\n\n(7.123)\n\n利用 (7.106–7.108)，写出\n\n\
  $$\\begin{array}{r} \\left. \\max_{\\mathbf{w} \\in I^{n}}\\max_{k} \\middle| \\\
  frac{\\partial\\phi}{\\partial w_{k}} \\middle| \\leq G^{2}\\exp(G). \\right. \\\
  \\ \\end{array}$$\n\n(7.124)\n\n则估计式 (7.119) 取形式\n\n$$\\begin{array}{r} \\left.\
