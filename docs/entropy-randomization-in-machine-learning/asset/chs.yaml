  \ 04.07.2016 (*i* = 2), 05.07.2016 (*i* = 3) as learning collection. Let us denote\
  \ *learning interval* \U0001D4AF[*l*] = \\[*n*^−, *n*^+\\] = \\[1, 24\\].\n\n![Figure\
  \ 11.5: Load L\\_{r}^{(i)}\\\\lbrack n\\\\rbrack and temperature deviation \\\\\
  tau\\_{r}^{(i)}\\\\lbrack n\\\\rbrack.](img/fig11_5.jpg)\n\nFigure 11.5: Load *L*[*r*]^((*i*))\\\
