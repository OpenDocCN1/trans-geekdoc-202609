  \ 具有振荡过程，在 2018 年后达到恒定水平。\n\n# 附录 A 最大熵估计 (MEE) 及其渐近效率\n\nDOI: [10.1201/9781003306566-A](https://doi.org/10.1201/9781003306566-A)\n\
  \n## A.1 最大熵估计问题的陈述\n\n\n\n\n\n考虑一个标量连续函数 `φ`(`x`, `θ`)，其参数为 `θ` = {`θ`[1],…,`θ`[*n*]}。假设该函数是具有输入\
  \ `x` 和输出 `y` 的对象模型的一个特征。设 `x`^((*r*)) = {`x`[1],…,`x`[*r*]} 和 `y`^((*r*)) = {`y`[1],…,`y`[*r*]}\
  \ 为给定的测量值。注意后者是在随机误差 `ξ` = {`ξ`[1],…,`ξ`[*r*]} 下获得的，在一般情况下，不同时间瞬时不同。\n\n因此，经过 `r`\
  \ 次测量后，模型和观测由方程描述\n\n$$\n\\begin{aligned}\n\\hat{\\mathbf{y}} & {= \\Gamma(\\mathbf{x}^{(r)},\\\
  theta),} \\\\\n\\hat{\\mathbf{v}} & {= \\hat{\\mathbf{y}} + \\xi,} \\\\\n\\end{aligned}\n\
  $$\n\n(A.1)\n\n其中向量函数 `Γ`(`x`^((*r*)), `θ`) 的分量为 $\\varphi(x\\lbrack t\\rbrack,\\\
  theta),\\, t = \\overline{1,r};$ $\\hat{\\mathbf{v}}$ 表示包含对象输出测量噪声的模型观测输出。\n\n估计问题表述如下：*求最大化广义信息熵泛函的\
  \ PDFs `P*`(`θ`) 和 `Q*`(`ξ`) 的最大熵估计*\n\n$$\n\\begin{aligned}\n& {\\mathcal{H}\\\
  lbrack P(\\theta),Q(\\xi)\\rbrack = - {\\int_{Q}P}(\\theta)\\ln P(\\theta)d\\theta\
  \ -} \\\\\n& \\left. \\quad - {\\sum\\limits_{t = 1}^{r}{\\int_{\\Xi_{t}}Q_{t}}}(\\\
  xi\\lbrack t\\rbrack)\\ln Q_{t}(\\xi\\lbrack t\\rbrack)\\Rightarrow\\max \\right.\
  \ \\\\\n\\end{aligned}\n$$\n\n(A.5)\n\n*受以下条件约束*\n\n* —由下式给出的 PDFs 的归一化条件\n\n$$\n\
  \\begin{array}{r}\n{{\\int_{\\Theta}P}(\\theta)d\\theta = 1;\\quad{\\int_{\\Xi_{t}}Q_{t}}(\\\
  xi\\lbrack t\\rbrack)d\\xi\\lbrack t\\rbrack = 1,\\, t = \\overline{1,r}.} \\\\\n\
  \\end{array}\n$$\n\n(A.6)\n\n和\n\n* —经验平衡条件\n\n$$\n\\begin{aligned}\n& {\\Phi\\\
  lbrack P(\\theta),Q(\\xi)\\rbrack = \\mathbf{y}^{(r)},} \\\\\n{\\Phi\\lbrack P(\\\
  theta),Q(\\xi)\\rbrack =} & \\left\\{ \\Phi_{1}\\lbrack P(\\theta),Q(\\xi)\\rbrack,\\\
  ldots,\\Phi_{r}\\lbrack P(\\theta),Q(\\xi)\\rbrack \\right\\} \\\\\n{\\Phi_{t}\\\
  lbrack P(\\theta),Q(\\xi)\\rbrack = \\int_{\\Theta}} & {\\varphi(x\\lbrack t\\rbrack,\\\
  theta)P(\\theta)d\\theta + \\int_{\\Xi_{t}}Q_{t}(\\xi\\lbrack t\\rbrack)\\xi\\lbrack\
  \ t\\rbrack d\\xi\\lbrack t\\rbrack,} \\\\\n& {\\text{\\quad\\quad}\\quad t = \\\
  overline{1,r}.} \\\\\n\\end{aligned}\n$$\n\n(A.7)\n\n优化问题 (A.1–A.1) 是 Lyapunov 型\
  \ [77, 174]：此类问题具有积分泛函和积分约束。因此，模型参数和测量噪声的熵最优 PDF 具有形式\n\n$$\n\\begin{aligned}\n\\\
  left. P^{\\*}(\\theta\\, \\middle| \\,\\mathbf{y}^{(r)}\\,\\mathbf{x}^{(r)}) \\\
  right. & {\\frac{\\exp\\left( {- {\\sum\\limits_{j = 1}^{r}\\lambda_{j}}(\\mathbf{y}^{(r)},\\\
  mathbf{x}^{(r)})\\varphi(x\\lbrack j\\rbrack,\\theta)} \\right)}{\\mathcal{P}(\\\
  lambda(\\mathbf{y}^{(r)}),\\mathbf{x}^{(r)})},} \\\\\n\\left. Q_{t}^{\\*}(\\xi\\\
  lbrack t\\rbrack\\, \\middle| \\,\\mathbf{y}^{(r)}\\,\\mathbf{x}^{(r)}) \\right.\
  \ & {\\frac{\\exp\\left( {\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})\\xi\\\
  lbrack t\\rbrack} \\right)}{\\mathcal{Q}_{t}(\\lambda_{t}(\\mathbf{y}^{(r)}),\\\
  mathbf{x}^{(r)})},\\quad t = \\overline{1,r}.} \\\\\n\\end{aligned}\n$$\n\n(A.8)\n\
  \n其中\n\n$$\n\\begin{aligned}\n{\\mathcal{P}(\\lambda(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})\
  \ = \\int_{\\Theta}} & {\\exp\\left( {- \\sum_{j = 1}^{r}\\lambda_{j}(\\mathbf{y}^{(r)},\\\
  mathbf{x}^{(r)})\\varphi(x\\lbrack j\\rbrack,\\theta)} \\right)d\\theta,} \\\\\n\
  {\\mathcal{Q}_{t}(\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})} & {\\int_{\\\
  Xi_{t}}\\exp\\left( {\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})\\xi\\lbrack\
  \ t\\rbrack} \\right)d\\xi\\lbrack t\\rbrack,} \\\\\n& {\\quad t = \\overline{1,r}.}\
  \ \\\\\n\\end{aligned}\n$$\n\n(A.9)\n\n由于等式 (A.1) 和 (A.1)，熵最优 PDF 由拉格朗日乘子 `λ`[1],…,\
  \ `λ`[*r*] 参数化，其代表经验平衡方程的解\n\n$$\n\\begin{array}{r}\n{\\frac{\\mathcal{G}(\\lambda(\\\
  mathbf{y}^{(r)},\\mathbf{x}^{(r)}))}{\\mathcal{P}(\\lambda(\\mathbf{y}^{(r)},\\\
  mathbf{x}^{(r)}))} + \\frac{\\mathcal{E}_{t}(\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)}))}{\\\
  mathcal{Q}_{t}\\left( {\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})} \\right)}\
  \ = y\\lbrack t\\rbrack,\\quad t = \\overline{1,r},} \\\\\n\\end{array}\n$$\n\n\
  (A.10)\n\n其中\n\n$$\n\\begin{aligned}\n{\\mathcal{G}(\\lambda(\\mathbf{y}^{(r)},\\\
  mathbf{x}^{(r)})) = \\int_{\\Theta}} & {\\varphi(x\\lbrack t\\rbrack,\\theta)\\\
  exp\\left( {- \\sum_{j = 1}^{r}\\lambda_{j}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})\\\
  varphi(x\\lbrack j\\rbrack,\\theta)} \\right)d\\theta,} \\\\\n{\\mathcal{E}_{t}(\\\
  lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)}))} & {\\int_{\\Xi_{t}}\\exp\\left(\
  \ {- \\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})\\xi\\lbrack t\\rbrack} \\\
  right)d\\xi\\lbrack t\\rbrack,} \\\\\n& {\\quad t = \\overline{1,r}.} \\\\\n\\end{aligned}\n\
  $$\n\n(A.11)\n\n这些方程的解 `λ*`(`y`^((*r*))), `x`^((*r*))) 依赖于用于构建 PDF 最大熵估计的样本 (`y`^((*r*))),\
  \ `x`^((*r*))。\n\n## A.2 隐式函数 `θ`(`\\widetilde{\\mathbf{y}}^{(r)}`, `x^{(r)}`) 的存在性\n\
  \n根据平衡方程 (A.10), (A.1)，其第二项是每次测量 `t` 中噪声的均值。噪声及其特征通常被假定为与测量无关，即在表达式 (A.3) 中，\n\n\
  $$\n\\begin{array}{r}\n{\\Xi_{t} = \\Xi = \\lbrack\\xi^{-},\\xi^{+}\\rbrack.} \\\
  \\\n\\end{array}\n$$\n\n(A.12)\n\n因此，噪声的均值由下式给出\n\n$$\n\\begin{array}{r}\n{\\overline{\\\
  xi} = \\frac{\\mathcal{E}_{t}(\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)}))}{\\\
  mathcal{Q}_{t}\\left( {\\lambda_{t}(\\mathbf{y}^{(r)},\\mathbf{x}^{(r)})} \\right)}\
  \ \\in \\Xi.} \\\\\n\\end{array}\n$$\n\n(A.13)\n\n平衡方程可以写成\n\n$$\n\\begin{aligned}\n\
  & \\left. \\quad W_{t}(\\lambda\\, \\middle| \\,\\widetilde{y}\\lbrack t\\rbrack,\\\
  mathbf{x}^{(r)}) = {\\int_{\\Theta}\\left( {\\varphi(x\\lbrack t\\rbrack,\\theta)\
  \ - \\widetilde{y}\\lbrack t\\rbrack} \\right)} \\times \\right. \\\\\n& {\\times\
  \ \\exp\\left( {- {\\sum\\limits_{j = 1}^{r}\\lambda_{j}}({\\widetilde{\\mathbf{y}}}^{(r)},\\\
  mathbf{x}^{(r)})\\varphi(x\\lbrack j\\rbrack,\\theta)} \\right)d\\theta = 0,} \\\
  \\\n& {\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\\
  quad}\\text{\\quad\\quad}t = \\overline{1,r},} \\\\\n\\end{aligned}\n$$\n\n(A.14)\n\
  \n其中\n\n$$\n\\begin{array}{r}\n{\\widetilde{y}\\lbrack t\\rbrack = y\\lbrack t\\\
  rbrack - \\overline{\\xi},\\text{\\quad\\quad}{\\widetilde{\\mathbf{y}}}^{(r)} =\
  \ \\left\\{ \\widetilde{y}\\lbrack 1\\rbrack,\\ldots,\\widetilde{y}\\lbrack r\\\
  rbrack \\right\\}.} \\\\\n\\end{array}\n$$\n\n(A.15)\n\n在向量形式中，方程 (A.2) 由下式描述\n\n\
  $$\n\\begin{array}{r}\n\\left. \\mathbf{W}(\\lambda\\, \\middle| \\,,{\\widetilde{\\\
  mathbf{y}}}^{(r)},\\mathbf{x}^{(r)}) = \\mathbf{0}. \\right. \\\\\n\\end{array}\n\
  $$\n\n(A.16)\n\n方程 (A.16) 定义了一个隐式函数 `λ`(`\\widetilde{\\mathbf{y}}^{(r)}`, `x^{(r)}`)。该隐式函数的存在性和性质取决于雅可比矩阵的性质\n\
  \n$$\n\\begin{array}{r}\n\\left. J_{\\lambda}(\\lambda\\, \\middle| \\,\\mathbf{y}^{(r)},\\\
  mathbf{x}^{(r)}) = \\left\\lbrack \\frac{\\partial W_{t}}{\\partial\\lambda_{i}},\\\
  , \\middle| \\,(t,i) = \\overline{1,r} \\right\\rbrack, \\right. \\\\\n\\end{array}\n\
  $$\n\n(A.17)\n\n其元素为\n\n\n\n\n\n$$\\\\begin{aligned} & {\\\\frac{\\\\partial W\\\
  _{t}}{\\\\partial\\\\lambda\\_{i}} = {\\\\int\\_{Q}\\\\left( {\\\\varphi(x\\\\lbrack\
  \ t\\\\rbrack,\\\\theta) - \\\\widetilde{y}\\\\lbrack t\\\\rbrack} \\\\right)}\\\
  \\varphi(x\\\\lbrack i\\\\rbrack,\\\\theta) \\\\times} \\\\\\\\ & {\\\\quad \\\\\
  times {\\\\sum\\\\limits\\_{j = 1}^{r}\\\\exp}\\\\left( {- {\\\\sum\\\\limits\\\
  _{j = 1}^{r}\\\\lambda\\_{j}}\\\\varphi(x\\\\lbrack j\\\\rbrack,\\\\theta)} \\\\\
  right)d\\\\theta.} \\\\\\\\ \\\\end{aligned}$$  \n\n(A.18)\n\n## A.3 最大熵估计的渐近有效性\n\
  \nMEE 给出输入和输出数据数组的熵最优 PDFs（A.1），每个数组的大小为 *r*。为方便起见，考虑由指数拉格朗日乘子 *z* = exp ( − *λ*)\
  \ 参数化的 PDFs。则等式 (A.1) 取形式\n\n$$\\\\begin{aligned} {P^{\\*}\\\\left( {\\\\theta,\\\
  \\,\\\\mathbf{z}(\\\\mathbf{y}^{(r)},\\\\mathbf{x}^{(r)})} \\\\right)} & {= \\\\\
  frac{\\\\prod\\_{j = 1}^{r}{\\\\lbrack z\\_{j}(\\\\mathbf{y}^{(r)},\\\\mathbf{x}^{r})\\\
  \\rbrack}^{\\\\varphi(x\\\\lbrack j\\\\rbrack,\\\\theta)}}{\\\\int\\_{\\\\Theta}\\\
  \\prod\\_{j = 1}^{r}{\\\\lbrack z\\_{j}(\\\\mathbf{y}^{(r)},\\\\mathbf{x}^{r})\\\
  \\rbrack}^{\\\\varphi(x\\\\lbrack j\\\\rbrack,\\\\theta)}d\\\\theta},} \\\\\\\\\
  \ {Q\\_{t}^{\\*}(\\\\xi\\\\lbrack t\\\\rbrack,\\\\, z\\_{t}(\\\\mathbf{y}^{(r)},\\\
  \\mathbf{x}^{(r)}))} & {= \\\\frac{{\\\\lbrack z\\_{t}(\\\\mathbf{y}^{(r)},\\\\\
  mathbf{x}^{(r)})\\\\rbrack}^{\\\\xi\\\\lbrack t\\\\rbrack}}{\\\\int\\_{\\\\Xi\\\
  _{t}}{\\\\lbrack z\\_{t}(\\\\mathbf{y}^{(r)},\\\\mathbf{x}^{(r)})\\\\rbrack}^{\\\
  \\xi\\\\lbrack t\\\\rbrack}d\\\\xi\\\\lbrack t\\\\rbrack},} \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(A.21)\n\n$$\\\\begin{aligned} & {\\\\quad t = \\\\overline{1,r}.} \\\\\\\
  \\ \\\\end{aligned}$$  \n\n(A.22)\n\n因此，PDF 的结构显著依赖于指数拉格朗日乘子 **z** 的取值，而后者又取决于数据数组\
  \ **y**^((*r*)) 和 **x**^((*r*))。\n\n引理 1 可应用于逆矩阵的范数 $\\\\|\\\\left\\\\lbrack \\\\\
  frac{\\\\partial\\\\Phi}{\\\\partial\\\\mathbf{z}} \\\\right\\\\rbrack^{- 1}\\\\\
  |$。结果为\n\n$$\\\\begin{array}{r} {\\\\left( {\\\\|\\\\frac{\\\\partial\\\\Phi}{\\\
  \\partial\\\\mathbf{z}}\\\\|} \\\\right)^{- 1} \\\\leq \\\\|\\\\left\\\\lbrack \\\
  \\frac{\\\\partial\\\\Phi}{\\\\partial\\\\mathbf{z}} \\\\right\\\\rbrack^{- 1}\\\
  \\| \\\\leq \\\\alpha\\\\left( {\\\\|\\\\frac{\\\\partial\\\\Phi}{\\\\partial\\\\\
  mathbf{z}}\\\\|} \\\\right)^{- 1}.} \\\\\\\\ \\\\end{array}$$  \n\n(A.31)\n\n其中\n\
  \n$$\\\\begin{array}{r} \\\\left. \\\\|\\\\frac{\\\\partial\\\\Phi}{\\\\partial\\\
  \\mathbf{z}}\\\\| = r\\\\max\\_{t,j} \\\\middle| \\\\frac{\\\\partial\\\\Phi\\_{t}}{\\\
  \\partial z\\_{j}} \\\\middle| . \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(A.32)\n\
  \n# 附录 B 线性动态回归模型（LDR）结构特征的近似估计\n\nDOI: [10.1201/9781003306566-B](https://doi.org/10.1201/9781003306566-B)\n\
  \n考虑形如的线性动态回归模型（LDR）\n\n$$\\\\begin{array}{r} {\\\\hat{x}\\\\lbrack n\\\\rbrack\
  \ = a\\_{0} + {\\\\sum\\\\limits\\_{k = 1}^{p}a\\_{k}}\\\\,\\\\hat{x}\\\\lbrack\
  \ n - k\\\\rbrack + a\\_{p + 1}f\\\\lbrack n\\\\rbrack + \\\\varepsilon\\\\lbrack\
  \ n\\\\rbrack,\\\\quad n = \\\\overline{p,N},} \\\\\\\\ \\\\end{array}$$  \n\n(B.1)\n\
  \n其中 `x̂[n]` 和 `f[n]` 分别表示模型的输出和输入；`p` 是该模型的阶数；`ε[n]` 给出测量噪声；最后，`a_k,k = \\overline{0,p+1},`\
  \ 是一些模型参数。\n\n设\n\n$$\\\\begin{array}{r} {f\\\\lbrack 0\\\\rbrack,f\\\\lbrack 1\\\
  \\rbrack,\\\\ldots,f\\\\lbrack N\\\\rbrack,\\\\text{\\\\quad\\\\quad}x\\\\lbrack\
  \ 0\\\\rbrack,x\\\\lbrack 1\\\\rbrack,\\\\ldots,x\\\\lbrack N\\\\rbrack} \\\\\\\\\
  \ \\\\end{array}$$  \n\n(B.2)\n\n为关于研究对象输入 `f[n]` 和输出 `x[n]` 的一些可用数据。\n\n利用这些数据和方程\
  \ (B.1)，我们写出以下向量-矩阵形式的回归方程：\n\n$$\\\\begin{array}{r} {\\\\mathbf{x} = X\\_{(p +\
  \ 2)}\\\\mathbf{a} + \\\\varepsilon,} \\\\\\\\ \\\\end{array}$$  \n\n(B.3)\n\n其中：\n\
  \n* 向量 `x` = {`x[p]`…`x[N]`}, `a` = {`a[0]`…`a[(p+1)]`}, 和 `ε` = {`ε[p]`…`ε[N]`};\n\
  * 矩阵\n\n$$\\\\begin{array}{r} {X\\_{(p + 2)} = \\\\left( \\\\begin{array}{llllll}\
  \ 1 & {x\\\\lbrack p - 1\\\\rbrack} & {x\\\\lbrack p - 2\\\\rbrack} & \\\\cdots\
  \ & {x\\\\lbrack 0\\\\rbrack} & {f\\\\lbrack p\\\\rbrack} \\\\\\\\ 1 & {x\\\\lbrack\
  \ p\\\\rbrack} & {x\\\\lbrack p - 1\\\\rbrack} & \\\\cdots & {x\\\\lbrack 1\\\\\
  rbrack} & {f\\\\lbrack p + 1\\\\rbrack} \\\\\\\\ \\\\cdots & \\\\cdots & \\\\cdots\
  \ & \\\\cdots & \\\\cdots & \\\\cdots \\\\\\\\ 1 & {x\\\\lbrack N - 1\\\\rbrack}\
  \ & {x\\\\lbrack N - 2\\\\rbrack} & \\\\cdots & {x\\\\lbrack N - p\\\\rbrack} &\
  \ {f\\\\lbrack N\\\\rbrack} \\\\\\\\ \\\\end{array} \\\\right).} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(B.4)\n\n向量 `x` 和矩阵 `X[(p+2)]` 由数据 (B.2) 组成。\n\n## B.1 阶数 p\n\n该模型的阶数 `p`\
  \ 通过基于数据 (B.2) 计算变量 `x` 的自相关函数 `r(k)` 来选择：\n\n$$\\\\begin{aligned} {r(k)} & {= \\\
  \\frac{c\\_{k}}{\\\\sigma^{2}},\\\\quad c\\_{k} = \\\\frac{1}{N + 1}{\\\\sum\\\\\
  limits\\_{n = 0}^{N + 1 - k}\\\\left( {x\\\\lbrack n\\\\rbrack - \\\\overline{x}}\
  \ \\\\right)}\\\\left( {x\\\\lbrack n + k\\\\rbrack - \\\\overline{x}} \\\\right),}\
  \ \\\\\\\\ \\\\sigma^{2} & {= \\\\frac{1}{N}{\\\\sum\\\\limits\\_{n = 0}^{N}x^{2}}\\\
  \\lbrack n\\\\rbrack.} \\\\\\\\ \\\\end{aligned}$$  \n\n(B.5)\n\n阶数 `p` 是使 `r(k)` > `δ` = 0.1\
  \ 的最大 `k` 值。\n\n## B.2 参数范围\n\nLDR 参数的 PDFs 的近似区间通过计算 LS 估计和残差偏差的样本方差得到。 (B.3) 的\
  \ LS 估计形式为\n\n$$\\\\begin{array}{r} {\\\\hat{\\\\mathbf{a}} = \\\\left( {X\\_{(p\
  \ + 2)}^{\\\\intercal}X\\_{(p + 2)}} \\\\right)^{- 1}X^{\\\\intercal}\\\\mathbf{x}.}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(B.6)\n\n残差偏差由向量描述\n\n$$\\\\begin{array}{r} {\\\
  \\mathbf{e}\\_{ls} = \\\\mathbf{x} - X\\_{(p + 2)}\\\\hat{\\\\mathbf{a}},} \\\\\\\
  \\ \\\\end{array}$$  \n\n(B.7)\n\n残差偏差的样本方差为\n\n$$\\\\begin{array}{r} {\\\\sigma^{2}\
  \ = \\\\frac{1}{N - p}{\\\\sum\\\\limits\\_{n = p}^{N}e^{2}}\\\\lbrack n\\\\rbrack.}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(B.8)\n\n模型参数的标准差为\n\n$$\\\\begin{array}{r} {s\\\
  _{a\\_{k}} = \\\\sqrt{\\\\sigma^{2}Q\\_{kk}},\\\\quad k = \\\\overline{0,p+1},}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(B.9)\n\n其中 `Q[k k]` 表示协方差矩阵 `Q` = (`X[(p+2)]^⊺X[(p+2)]`)^( − 1)\
  \ 的对角元素。\n\n鉴于 LS 估计的渐近正态性，参数范围按规则选择\n\n$$\\\\begin{array}{r} {\\\\left\\\\{ a\\\
  _{k}^{-},a\\_{k}^{+} \\\\right\\\\} = \\\\left\\\\{ {a\\_{k} - 3s\\_{a\\_{k}},a\\\
  _{k} + 3s\\_{a\\_{k}}} \\\\right\\\\},\\\\quad k = \\\\overline{0,p+1}.} \\\\\\\\\
  \ \\\\end{array}$$  \n\n(B.10)\n\n# 参考文献\n\n* [1] 数据集。\n* [2] KEEL 数据集仓库。 https://sci2s.ugr.es.\
