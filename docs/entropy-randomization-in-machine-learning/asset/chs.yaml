  \ 上存在若干局部极小值。因此，问题 (7.16) 归结为该函数的全局最小化。\n\n## 具有解析函数的方程\n\n\n\n\n\n该类平衡方程出现在具有 RPM-QuaRand\
  \ 模型的 ML 问题中。表征这些模型参数的归属概率可以是归一化的或区间类型的。在前一种情况下，基于 ML 的估计算法被表述为广义玻尔兹曼信息熵的约束最大化问题。在后一种情况下，选择广义费米信息熵似乎更为方便。\n\
  \n将归一化归属概率的经验平衡方程 (6.52) 写成形式\n\n$$\\begin{array}{r} {m_{j}(\\mathbf{v}) = {\\sum\\\
  limits_{h = 1}^{R}\\frac{\\beta^{(h)}(v_{1},\\ldots,v_{s};\\, j)}{\\alpha^{(h)}(v_{1},\\\
  ldots,v_{s})}} + \\gamma_{j}(v_{1},\\ldots,v_{s}) = 0,\\quad j = \\overline{1,s},}\
  \ \\\\ \\end{array}$$\n\n(7.17)\n\n其中\n\n$$\\begin{aligned} {\\alpha^{(h)}(v_{1},\\\
  ldots,v_{s})} & {= {\\sum\\limits_{k = 1}^{V_{h}}p_{k}^{(h,0)}}{\\prod\\limits_{l\
  \ = 1}^{V_{h}}v_{l}^{z_{k}^{(h)}\\lbrack l\\rbrack}},} \\\\ {\\beta_{k}^{(h)}(v_{1},\\\
  ldots,v_{s};\\, j)} & {= {\\sum\\limits_{k = 1}^{V_{h}}z_{k}^{(h)}}\\lbrack j\\\
  rbrack p_{k}^{(h,0)}{\\prod\\limits_{l = 1}^{V_{h}}v_{l}^{z_{k}^{(h)}\\lbrack l\\\
  rbrack}},} \\\\ {\\gamma_{j}(v_{1},\\ldots,v_{s})} & {= S\\lbrack j\\rbrack + \\\
  frac{q_{j}^{0}Z_{j}v_{j}^{Z_{j}}}{{\\sum\\limits_{l = 1}^{s}q_{j}^{0}}v_{j}^{Z_{l}}}\
  \ - y\\lbrack j\\rbrack,} \\\\ v_{l} & {= \\exp( - \\theta_{l}),\\text{\\quad\\\
  quad}l = \\overline{1,s}.} \\\\ \\end{aligned}$$\n\n(7.18)\n\n这些方程中的变量定义在非负象限 *R*[+]^(*s*)\
  \ 上。有时，它们被称为指数拉格朗日乘子。\n\n考虑区间归属概率的经验平衡方程 (6.58) 并用变量 (*v*[1],…, *v*[*s*]) ≥ 0 表示它们\
  \ (7.18)。引入以下记号：\n\n$$\\begin{aligned} {\\varrho_{j}^{(h)}(v_{1},\\ldots,v_{s})}\
  \ & {= {\\sum\\limits_{i = 1}^{V_{h}}\\frac{p_{i}^{(h,0)}}{p_{i}^{(h,0)} + {\\prod\\\
  limits_{l = 1}^{s}v_{l}^{z_{i}^{(h)}\\lbrack l\\rbrack}}}},} \\\\ {\\vartheta_{j}(v_{j})}\
  \ & {= Z_{j}\\frac{q_{j}^{0}}{q_{j}^{0} + v_{j}^{Z_{j}}},} \\\\ {\\omega\\lbrack\
  \ j\\rbrack} & {= \\vartheta_{j}(v_{j}) + \\hat{s}\\lbrack j\\rbrack + \\zeta_{j}^{-}\
  \ - y\\lbrack j\\rbrack.} \\\\ \\end{aligned}$$\n\n(7.19)\n\n将方程 (6.58) 写为\n\n$$\\\
  begin{array}{r} {n_{j}(\\mathbf{v}) = {\\sum\\limits_{h = 1}^{R}\\varrho_{j}^{(h)}}(v_{1},\\\
  ldots,v_{s}) + \\omega\\lbrack j\\rbrack = 0,\\text{\\quad\\quad}j = \\overline{1,s}.}\
  \ \\\\ \\end{array}$$\n\n(7.20)\n\n经验平衡方程的最终形式使我们能够识别这些方程的一些一般性质，这对于选择合适的计算方法是有益的。\n\
  \n### 7.2 用于全局优化的蒙特卡洛分组迭代\n\nRPM-Orig 和 RPM-Rel 模型的 RML 算法旨在求解经验平衡方程，其中变量的角色由拉格朗日乘子或取值在单位非负立方体内的辅助变量扮演。设计数值方法的方法是从残差函数（通常是二次范数）的最小化出发。在\
  \ RML 问题中，残差函数与变量之间存在算法定义的关联，这一问题特征最终将其简化为全局最小化问题。在这种条件下，蒙特卡洛方法似乎是 RML 算法设计的一个合适的工具。\n\
  \n大量文献已发表，涉及蒙特卡洛方法在不同全局优化问题中的应用。关于这些问题及其求解方法的一些见解可从 \\135, 158, 171–[173, 196, 199\\\
  ] 获得。\n\n与现有方法不同，这里提出的思想是使用 *简单蒙特卡洛模拟*，即在非负单位立方体上生成具有均匀分布的独立随机向量。\n\n### 7.2.1 全局优化问题的规范形式\n\
  \n考虑全局最小化问题\n\n$$\\begin{aligned} & \\left. f(\\mathbf{x})\\Rightarrow\\text{globmin}\
  \ \\right. \\\\ & \\text{subject~to~the~following~constraints:} \\\\ & {\\mathbf{x}\
  \ \\in \\mathcal{G}_{\\mathbf{x}} = \\left\\{ \\mathbf{x}:\\mathbf{g}(\\mathbf{x})\
  \ \\leq \\mathbf{0},\\, \\mathbf{x} \\in R^{d} \\right\\},\\quad\\mathbf{g} \\in\
  \ R^{r},\\, r < d.} \\\\ \\end{aligned}$$\n\n(7.21)\n\n目标函数 *f*(**x**) 满足 Hölder\
  \ 条件，常数为 *H* > 0 和 *w* > 0，即其连续模具有形式\n\n$$\\begin{array}{r} \\left. \\omega(t) =\
  \ \\max_{(\\widetilde{\\mathbf{v}},\\widetilde{\\mathbf{y}}) \\in R^{d}\\mspace{2mu}:\\\
  |\\widetilde{\\mathbf{v}} - \\widetilde{\\mathbf{y}}\\| \\leq t} \\middle| f(\\\
  widetilde{\\mathbf{v}}) - f(\\widetilde{\\mathbf{y}}) \\middle| \\leq Ht^{w}. \\\
  right. \\\\ \\end{array}$$\n\n(7.22)\n\n(7.22) 中的函数 **g**(**x**) 假定为连续的。\n\n将问题\
  \ (7.21) 写成 *规范形式* 为\n\n$$\\begin{aligned} & \\left. F(\\mathbf{z})\\Rightarrow\\\
  text{globmin} \\right. \\\\ \\end{aligned}$$\n\n(7.23)\n\n$$\\begin{aligned} & \\\
  text{subject~to~the~following~constraints:} \\\\ & {\\mathbf{z} \\in \\mathcal{K}_{\\\
  mathbf{z}} = \\mathcal{G}_{\\mathbf{z}}{\\cap Z_{+}^{d}},} \\\\ & {Z_{+}^{d} = \\\
  left\\{ \\mathbf{z}:\\mathbf{0} \\leq \\mathbf{z} \\leq \\mathbf{1} \\right\\} \\\
  subset R^{d},} \\\\ & {\\mathcal{G}_{\\mathbf{z}} = \\left\\{ \\mathbf{z}:\\mathbf{w}(\\\
  mathbf{z}) \\leq \\mathbf{0},\\, \\mathbf{z} \\in Z_{+}^{d} \\right\\},\\quad\\\
  mathbf{w} \\in R^{r},\\, r < d.} \\\\ \\end{aligned}$$\n\n(7.24)\n\n原始问题与其规范形式之间的关系由变量的连续可微双射变换定义，即\n\
  \n$$\\begin{array}{r} {\\mathbf{z} = \\mathcal{T}(\\mathbf{x}),\\text{\\quad\\quad}\\\
  mathbf{x} = \\mathcal{T}^{( - 1)}(\\mathbf{z}).} \\\\ \\end{array}$$\n\n(7.25)\n\
  \n事实上，有相当多的变换满足这些条件，例如\n\n$$\\begin{aligned} & {\\mathbf{z} = \\left\\{ \\frac{1}{1\
  \ + exp( - a_{i}x_{i})},\\, \\middle| \\, i = \\overline{1,d} \\right\\},} \\\\\
  \ & {\\mathbf{x} = \\left\\{ \\frac{1}{a_{i}}\\ln\\frac{z_{i}}{1 - z_{i}},\\, \\\
  middle| \\, i = \\overline{1,d} \\right\\}.} \\\\ \\end{aligned}$$\n\n(7.26)\n\n\
  由于变换 (7.26) 的连续性，函数 *F*(**z**) 在 \U0001D4A6[**z**] 上有下界，即存在常数 *c* 使得\n\n$$\\begin{array}{r}\
  \ {F^{\\*} \\geq c.} \\\\ \\end{array}$$\n\n(7.30)\n\n常数 *c* 通常是未知的，但在某些特殊全局最小化问题中等于\
  \ 0。例如，这发生在函数 *F*(**z**) 定义为某个方程组左右两边残差的问题中。\n\n函数 *F*(**z**) 也满足 Hölder 条件，其他常数为\
  \ *L* 和 *p*，即\n\n$$\\begin{array}{r} \\left. \\omega(h) = \\max_{(\\mathbf{v},\\\
  mathbf{y}) \\in \\mathcal{K}_{\\mathbf{x}}\\mspace{2mu}:\\|\\mathbf{v} - \\mathbf{y}\\\
  | \\leq h} \\middle| F(\\mathbf{v}) - F(\\mathbf{y}) \\middle| \\leq Lh^{s}. \\\
  right. \\\\ \\end{array}$$\n\n(7.31)\n\n用 *ℤ*^(*) 表示所有全局最小点 **z**^(*) 的集合，并用 *F*(**z**^(*)) = *F*^(*)\
  \ 表示问题 (7.23) 中的全局最小值。换句话说，假设全局最小值不是在唯一点取得，而是在有限集合 ℤ^(*) 上取得。\n\n\n\n\n\n如何理解问题\
  \ `(7.23)` 的 `solution`？该问题至关重要，因为其明显性在实际计算过程中消失了。实际上，即使计算精度任意高，也无法获得全局最小值 `F^*`\
  \ 的精确值。我们可以谈论进入精确全局最小值值的某个 `r`-邻域。换句话说，问题涉及 `r`-邻域内的近似全局最小值 `F̃^*`。在开始时，我们已声明采用\
  \ `Monte Carlo` 方法进行全局最小化。因此，值 `F̃^*` 以某个概率进入 `r`-邻域，该概率小于或等于 1。\n\n还要注意，计算是通过迭代过程实现的，该过程表示为具有编号\
  \ `k` 的步骤序列。每一步都会产生一个中间结果。在问题 `(7.23)` 中，中间结果是值 `$\\\\widetilde{F_{1}^{*},\\\\ldots,\\\
  \\widetilde{F_{k}^{*},\\\\ldots}}$`。假设在某一步 `k^*`，近似全局最小值 `F̃[k^*]^ *` 已进入 `r`-邻域。尽管如此，该事件是随机的，可能发生的情况是，在步骤\
  \ `(k^* + 1)`，该值会离开邻域。为了提高近似全局最小化的可靠性，引入一个正数 `ϱ`，它表征在首次于步骤 `k^*` 进入后，值 `F̃[k^*]^\
  \ *`、`F̃[(k^* + k[1])]^ *`、…、`F̃[(k^* + k[ϱ])]^ *` 保持在 `r`-邻域内的步骤数。\n\n### 7.2.2\
  \ 方法思想和解的概念\n\n考虑问题 `(7.23)` 的简化表述，其中可行集为 `d` 维立方体 `Z[+]^(d)`。该问题由一种算法求解，该算法表示为构造记录序列的迭代过程\n\
  \n在步骤 `k`，算法生成一批 `\U0001D4B5[k]`，其中包含 `N[k] = M[k]^(d)` 个独立随机向量 `z¹, …, z^(N[k])`，它们服从\
  \ `Z[+]^(d)` 上的均匀分布。这里 `M[k]` 表示随机生成器在步骤 `k` 为每个 `d` 个坐标产生的区间 `[0, 1]` 上独立均匀分布随机变量的数量。\n\
  \n对于第 `k` 批，算法计算函数 `$F(\\\\mathbf{z}^{j}),\\\\, j = \\\\overline{1,N_{k}},$` 的值以及其最小值\
  \ `F[k]^ *`（第 `k` 个记录）和参数 `z[k]^ *`。由于蒙特卡洛模拟的随机性，值 `F[k]^ *` 也是随机的。\n\n过渡到步骤 `(k\
  \ + 1)` 包括按规则增加随机向量的数量\n\n```\n\\begin{array}{r} {M_{k + 1} = \\alpha M_{k},\\quad\\\
  quad\\alpha > 1,} \\\\ \\end{array}\n```\n(7.32)\n\n并为第 `(k + 1)` 个包计算新的记录 `F[k\
  \ + 1]^ *`。这产生一个单调递减序列\n\n```\n\\begin{array}{r} {\\mathcal{F} = \\left\\{ F_{0}^{*}\
  \ \\geq \\ldots, \\geq F_{k}^{*},\\ldots \\right\\}.} \\\\ \\end{array}\n```\n(7.33)\n\
  \n除了记录序列 (7.33) 外，算法还构造其递减序列\n\n```\n\\begin{array}{r} {\\mathcal{U} = \\left\\\
  { u_{1},\\ldots, \\, u_{k},\\ldots \\right\\},} \\\\ \\end{array}\n```\n(7.34)\n\
  \n其中 `u[k]=|F[k]^ *−F[k + 1]^ *|`。\n\n当随机变量序列 `u[k]` 在 `ρ` 个连续步骤内保持在原点给定的 `δ`-邻域内时，算法停止，即其终止前的步骤数为\n\
  \n```\n\\begin{array}{r} {\\tau = \\min\\left\\{ k:\\max_{k - \\rho \\leq s \\leq\
  \ k}u_{s} \\leq \\delta \\right\\}.} \\\\ \\end{array}\n```\n(7.35)\n\n在下文中，该算法将被称为\
  \ `GFS algorithm (Generation, Filtration, Selection)`。\n\n`The solution of the problem\
  \ (7.23)` 由四元组表示\n\n```\n\\begin{array}{r} {S = \\left\\{ F_{\\tau}^{*},\\mathbf{z}_{\\\
  tau}^{*},r_{\\tau}^{*},\\mathbf{P}(\\mathcal{E}_{r_{\\tau}}) \\right\\},} \\\\ \\\
  end{array}\n```\n(7.36)\n\n其中\n\n* `F[τ]^ *`、`z[τ]^ *` 分别表示在停止时间 `τ` 时的近似全局最小值及其参数；\n\
  * `r[τ]^ *` 是在停止时间 `τ` 时精确全局最小值邻域大小的估计值；\n* 事件\n\n```\n\\begin{array}{r} {\\mathcal{E}_{r_{\\\
  tau}^{*}} = \\left\\{ F_{\\tau}^{*} - F^{*} \\leq r_{\\tau} \\right\\},} \\\\ \\\
  end{array}\n```\n(7.37)\n\n其中 `F^*` 给出集合 `Z[+]^(d)` 上精确全局最小值；\n* `P(ℰ[r[τ]^ *])`\
  \ 表示事件 (7.37) 的估计概率。\n\n实际算法涉及严格单调递减子序列\n\n```\n\\begin{array}{r} {\\mathbb{F}^{*}\
  \ = \\left\\{ F_{1}^{*} > \\ldots, > F_{k}^{*},\\ldots \\right\\}} \\\\ \\end{array}\n\
  ```\n(7.38)\n\n序列 `ℱ^*` (7.33)。下面的理论分析基于探索序列 `ℱ^*` 的性质。由于 `\U0001D53D^*` 构成 `ℱ^*`\
  \ 的子序列，在定性上分析结果对子序列 `\U0001D53D^*` 保持不变。\n\n### 7.2.3 随机序列 ℱ 和 \U0001D4B0 的概率特征\n\
  \n对由简单蒙特卡洛模拟的包生成的随机序列进行研究，是研究 GFS 算法在计算方面的基本性质的重要阶段。这些性质包括收敛性分析（特别是收敛条件）和所得解 `[35]`\
  \ 的数值特征估计。\n\n**1. 包 \U0001D4B5[k] 的概率特征**\n\n在每个阶段 `k`，算法生成一个包含 `N[k]` 个独立随机向量的包\
  \ `\U0001D4B5[k]`，其在 `d` 维立方体上服从均匀分布。包 `\U0001D4B5[k]` 的来源是随机生成器：在步骤 `k`，它为每个 `d`\
  \ 个坐标产生 `M[k]` 个独立均匀分布在区间 `[0, 1]` 上的随机变量数组（简单蒙特卡洛模拟）。结果，在步骤 `k` 时，我们有一个 `(M[k])^(d)`\
  \ 个随机向量的包，它们服从单位立方体上的均匀分布。\n\n考虑单位立方体 `Z[+]^(d)` (7.23) 及其使用具有步长的 `virtual` 均匀格点划分\n\
  \n```\n\\begin{array}{r} {\\eta_{k} = M_{k}^{- q}} \\\\ \\end{array}\n```\n(7.39)\n\
  \n对于每个 `d` 个坐标。这里 `q` 指定格点参数，使得\n\n```\n\\begin{array}{r} {0 < \\gamma \\leq q \\\
  leq \\beta < 1.} \\\\ \\end{array}\n```\n(7.40)\n\n用 `P(M[k], d, q)` 表示存在一个不包含在步骤\
  \ `k` 生成的随机 `(M[k])^(d)` 个向量中的 `virtual` 元素立方体的概率。该概率可以估计如下。\n\n**2. 序列 ℱ^* 的概率性质**\n\
  \n考虑“准全局”最小值序列 `ℱ^* = {F[0]^ *,…,F[k]^ *,…}` 和相应的参数序列 `\U0001D4B5^* = {z[0]^ *,…,z[k]^\
  \ *,…}`。\n\n用 `ℤ^*` 表示函数 `F(⋅)` 在单位立方体上的所有全局最小点集合。引入任意点 `z` 与紧集 `ℤ^*` 之间的距离 `l(⋅)`，形式为\n\
  \n```\n\\begin{array}{r} {l(\\mathbf{z},{\\mathbb{Z}}^{*}) = \\min_{\\mathbf{y}\
  \ \\in {\\mathbb{Z}}^{*}}\\|\\mathbf{z} - \\mathbf{y}\\|.} \\\\ \\end{array}\n```\n\
  (7.46)\n\n注意，上界 (7.53)–(7.54) 依赖于参数 `q`，它影响具有边长 (7.39) 的每个坐标的 `virtual` 元素立方体的体积。式\
  \ (7.40) 中的常数 `β` 和 `γ` 应调整以达到关于所需邻域大小和相应概率的可接受结果。\n\n### 7.2.4 GFS 算法的收敛性\n\n利用记录序列\
  \ `F[k]^ *` 的概率特征，我们可以建立其收敛性的以下结果。\n\n### 7.2.5 递减序列 \U0001D4B0 的研究\n\n\n\n\n\n\
  对于 Hölder 型函数，上界 (7.53) 以概率 `1 − Q(M[k], d, q)` 成立；见推论 2。 因为 `rk + 1 < rk`，\n\n\
  $$\n\\begin{array}{r}\n\\left. u_{k} = \\middle| F_{k + 1}^{*} - F_{k}^{*} \\middle|\
  \ \\leq DM_{k}^{- p}. \\right.\n\\\\\n\\end{array}\n$$\n\n(7.66)\n\n于是，对于充分大的 `k`，\n\
  \n$$\n\\begin{array}{r}\n{u_{k} \\approx DM_{k}^{- p}.}\n\\\\\n\\end{array}\n$$\n\
  \n(7.67)\n\n对该近似表达式两边取对数：\n\n$$\n\\begin{array}{r}\n{v_{k} = \\log u_{k} \\approx\
  \ \\log D - p\\log M_{k}.}\n\\\\\n\\end{array}\n$$\n\n(7.68)\n\n`vk` 关系的一个例子对于一个计算过程示于\
  \ 图 7.2。\n\n![Figure 7.2](img/fig7_2.jpg)\n\nFigure 7.2\n\n考虑一列独立随机变量 `ζ[k]`，均值为零，方差有限\
  \ `σ²`。 将该序列加到近似表达式的右端以模拟 `v[k]` 序列的随机性，即\n\n$$\n\\begin{array}{r}\n{v_{k} = A -\
  \ Bn_{k} + \\zeta_{k},}\n\\\\\n\\end{array}\n$$\n\n(7.69)\n\n其中\n\n$$\n\\begin{array}{r}\n\
  {A = \\log D,\\quad\\quad B = p,\\quad n_{k} = \\log M_{k}.}\n\\\\\n\\end{array}\n\
  $$\n\n(7.70)\n\n与 Hölder 常数相关的参数 `A` 和 `B` 以及 `σ²` 都是未知的。 它们的估计值 `Â(k)`、`B̂(k)`\
  \ 和 `σ̂²(k)` 将利用关于序列 `{F[k]^*}` 元素的可用信息，基于最小二乘法构造。 这很容易实现，因为 (7.69) 表示一个 *线性* 模型（在此上下文中，请再次注意对数-对数尺度下的线性回归\
  \ (7.69) 直接源于上界 (7.53)）。\n\n有了这些估计，我们还可以估计相应邻域的大小 `rk`，即精确全局最小值的邻域。 根据 (7.53)，\n\
  \n$$\n\\begin{array}{r}\n{r_{k}(q) = \\log{\\hat{A}}^{(k)}M_{k}^{(\\frac{{\\hat{B}}^{(k)}}{q})}.}\n\
  \\\\\n\\end{array}\n$$\n\n(7.71)\n\n显然，关系 `rk` 在区间 `[γ, β]` (7.40) 上单调递减。 故其在 `q\
  \ = β` 处取得最小值。 在停止时刻 `τ` 处邻域的估计大小为\n\n$$\n\\begin{array}{r}\n{r_{\\tau}(\\beta)\
  \ = \\log{\\hat{A}}^{(\\tau)}M_{\\tau}^{(\\frac{{\\hat{B}}^{(\\tau)}}{\\beta})},}\n\
  \\\\\n\\end{array}\n$$\n\n(7.72)\n\n其概率 (7.54) 的下界（见推论 2）具有形式\n\n$$\n\\begin{array}{r}\n\
  {P\\left\\{ 0 \\leq F_{\\tau}^{*} - F^{*} \\leq r_{\\tau} \\right\\} \\geq M_{\\\
  tau}^{\\beta d}\\exp\\left( {- M_{\\tau}^{(1 - \\beta)d}} \\right).}\n\\\\\n\\end{array}\n\
  $$\n\n(7.73)\n\n### 7.2.6 一般形式的容许集 \U0001D4A6(z)\n\n到目前为止，我们考虑了全局最小化问题，其中变量 **z**\
  \ 的定义域与容许集重合。 现在让我们处理一般情形，其中容许集 `\U0001D4A6(z)` (7.23) 表示单位立方体 `\U0001D4B5[+]^(d)`\
  \ 的一部分。 更具体地说，它形成单位立方体与由连续函数描述的不等式系统所描述的子集 `\U0001D4A2` 的交集。\n\n所研究的容许集的体积更小，因此其虚拟划分中的基本立方体数目减少。\
  \ 然而，该数目必然不超过单位立方体划分中此类立方体的数目。 因此，导出的概率估计（从而算法收敛性的命题）对于由连续函数系统定义且具有正 Lebesgue 测度的紧集仍然有效。\n\
  \n考虑单位立方体中的容许域 `\U0001D4A6[z]` (7.23)。 假设它不包含孤立点且其 `d` 维 Lebesgue 测度 `ν` 非零，即 `0\
  \ < ν[0] ≤ ν ≤ 1`。\n\n首先，分析值 `ν` 已知的情形。 那么，从单位立方体上均匀分布的独立随机向量序列中生成的特定向量落入容许域的概率为\
  \ `ν`。 设在第 `k` 步生成 `N[k]` 个独立随机向量，均匀分布于 `Z+` 上，其中 `N̂[k]` 个向量在容许域内。 用 `κ[N[k]]`\
  \ 表示生成的向量在容许集 `\U0001D4A6[z]` 内的出现频率，即\n\n$$\n\\begin{array}{r}\n{\\kappa_{N_{k}}\
  \ = \\frac{{\\hat{N}}_{k}}{N_{k}}.}\n\\\\\n\\end{array}\n$$\n\n(7.74)\n\n根据大数定律，对于任意（充分小的）`ϵ\
  \ > 0`、`η > 0` 和给定的值 `ν`，存在一个数 `N0`，使得对于所有 `N[k] > N0`，偏差 `|κ[N[k]]−ν|` 小于 `ϵ ν`\
  \ 的概率不小于 `(1 − η)`。\n\n因此，对于 `N[k] > N0`，不等式\n\n$$\n\\begin{array}{r}\n{\\kappa_{N_{k}}\
  \ \\geq (1 - \\epsilon)\\nu}\n\\\\\n\\end{array}\n$$\n\n(7.75)\n\n以不小于 `(1 − η)`\
  \ 的概率成立。 故由 `N[k]` 个向量组成的包中容许向量的数目 `N̂[k]` 满足不等式\n\n$$\n\\begin{array}{r}\n{{\\\
  hat{N}}_{k} \\geq N_{k}(1 - \\epsilon)\\nu}\n\\\\\n\\end{array}\n$$\n\n(7.76)\n\n\
  的概率不小于 `(1 − η)`。\n\n因此，在所有包含生成向量数目 `N[k]` 的公式中，我们应将其（对于 `N[k] > N0`）替换为数目 `N̂[k]\
  \ = (1 − ϵ)ν N[k]`。\n\n现在估计数目 `N0`。 对于 `η > 0`，利用条件定义函数 `c(η)`\n\n$$\n\\begin{array}{r}\n\
  {\\frac{1}{\\sqrt{2\\pi}}{\\int_{- c(\\eta)}^{c(\\eta)}\\exp}( - x^{2}/2)dx = 1\
  \ - \\eta.}\n\\\\\n\\end{array}\n$$\n\n(7.77)\n\n则数目 `N0` 可由关系式求得\n\n$$\n\\begin{array}{r}\n\
  {N_{0}(\\epsilon,\\eta,\\nu) \\geq \\frac{c^{2}(\\eta)(1 - \\nu)}{\\epsilon^{2}\\\
  nu}.}\n\\\\\n\\end{array}\n$$\n\n(7.78)\n\n其次，考虑值 `ν` 未知但我们已知满足 `0 < ν[0] ≤ ν` 的值\
  \ `ν[0]` 的情形。 用 `ν[0]` 代替 (7.78) 中的 `ν` 可得到在该频率下容许向量的频率与未知值 `ν` 的偏差至多为 `ϵ ν` 且概率不小于\
  \ `(1 − η)` 的最小生成向量数估计。 在此情形下，对于 `N > N0`，值 `ν` 可估计为\n\n$$\n\\begin{array}{r}\n\
  {\\hat{\\nu} = \\kappa_{N},}\n\\\\\n\\end{array}\n$$\n\n(7.79)\n\n并且以不小于 `(1 − η)`\
  \ 的概率，`|κ[N]−ν|≤ϵ ν`，即\n\n$$\n\\begin{array}{r}\n{\\frac{\\kappa_{N}}{1 - \\epsilon}\
  \ \\geq \\nu \\geq \\frac{\\kappa_{N}}{1 + \\epsilon}.}\n\\\\\n\\end{array}\n$$\n\
  \n(7.80)\n\n该估计的下界可代替公式 (7.78) 中的 `ν` 使用。\n\n### 7.2.7 GFS 算法的逻辑结构\n\nGFS 算法用于计算问题\
  \ (7.23) 规范形式下的全局最小值。 它包含两个过程，`SeqLocMin` 和 `EstProb`。 `SeqLocMin` 过程产生记录序列及其递减量并包含停止规则。\
  \ `EstProb` 过程估计精确全局最小值邻域的最小尺寸并计算落入该邻域的概率下界。\n\n这些过程由 `k` 个步骤组成，每个步骤执行 `t` 次操作。\
  \ 因此，成对指标 `(k, t)` 将与每个过程的阶段相关联。\n\n#### SeqLocMin 过程\n\n1. *生成*—随机向量包的创建：\n   1.\
  \ `(k, 1)` 生成 `N[k]` 个独立随机向量，均匀分布于单位立方体上；\n   2. `(k, 2)` 形成包 `\U0001D4B5[k] = {z¹,…,z^(N[k])}`\
  \ 由这些随机向量组成。\n\n2. *过滤*—容许向量的选择：\n   1. `(k, 3)` 从包 `\U0001D4B5[k]` 中选择属于容许集 `\U0001D4A6\
  [z]` 的向量并形成大小为 `Ñ[k]` 的容许包 `${\\widetilde{\\mathcal{Z}}}_{k}$`。\n\n\n\n\n\n###\
  \ 3. *Selection*—definition of the quasi global minimum for the packet and calculation\
  \ of the decrements:\n\n1. (*k*, 4) calculate the values $F({\\widetilde{\\mathbf{z}}}^{i}),\\\
  , i = \\overline{1,{\\widetilde{N}}_{k}},$ of the objective function for the vectors\
  \ from the packet ${\\widetilde{\\mathcal{Z}}}_{k};$\n\n2. (*k*, 5) choose the minimum\
  \ value $F_{k}^{*} = \\min F({\\widetilde{\\mathbf{z}}}^{i}),\\, 1 \\leq i \\leq\
  \ {\\widetilde{N}}_{k};$\n\n3. (*k*, 6) calculate the decrements `u[k]=|F[k + 1]*−F[k]*|`\
  \ and the decrement logarithms `v[k]=log u[k]` and `n[k]=log N[k]`; form the sequences\
  \ `\U0001D4B0={u[k]}`, `\U0001D4B1={v[k]}`, `\U0001D4A9={n[k]}`.\n\nIf `v[k] ≤ log\
  \ δ`, the value `v[k]` is included in the sequence ${\\widetilde{\\mathcal{V}}}.$\
  \ As soon as the sequence ${\\overset{\\text{˜}}{\\mathcal{V}}}_{k}$ accumulates\
  \ `ρ` elements, `k = τ` and the algorithm stops. Then a transition to the `EstProb`\
  \ procedure is performed.\n\n#### **EstProb procedure**\n\nThe computational scheme\
  \ of this procedure consists in the following.\n\n1. *Parameter estimation for the\
  \ regression model of decrements*:\n\n    1. (*τ*, 1) using sequences `\U0001D4A9\
  ` and `\U0001D4B1`, estimate parameters `Â[τ]` and `B̂[τ]` by the least-squares\
  \ method.\n\n2. *Estimation of solution characteristics (quality indicators)*:\n\
  \n    1. (*τ*, 2) estimate the size `r[τ]` (7.72) for the neighborhood of the global\
  \ minimum value;\n\n    2. (*τ*, 3) calculate the lower bound for the probability\
  \ `P̂[τ]` (7.73).\n\nThe logical structure of the GFS algorithm is presented in\
  \ Fig. 7.3.\n\n![Figure 7.3](img/fig7_3.jpg)\n\nFigure 7.3\n\n### 7.2.8 Experimental\
  \ study of GFS algorithm\n\nAccording to the previous subsections, the probabilistic\
  \ properties of the GFS algorithm established by analytical study possess an asymptotical\
  \ character. In other words, they hold for a sufficiently large number of iterations.\
  \ Even the estimates derived under a finite number of steps assume that it is great\
  \ enough. The aim of an experimental study, which always has a finite number of\
  \ steps, is to test the operability of this algorithm in typical problems. More\
  \ specifically, we will check the estimates for the size of the exact global minimum\
  \ neighborhood and the probability of getting into it. Recall that these estimates\
  \ have been obtained using the least-squares-based estimation of the Hölder constants\
  \ for the objective function. Therefore, in the course of a computational experiment,\
  \ we will confirm or doubt the hypothesis about the linear regression in the log-log\
  \ scale.\n\nIn the general statement, the GFS algorithm is intended for solving\
  \ the global minimization problems in which it is possible to calculate the values\
  \ of the associated functions (the objective function and constraints). Below we\
  \ will consider the entropy estimation problem for the PDFs of the parameters of\
  \ a randomized model that possesses these properties. Let us begin the experimental\
  \ study of the GFS algorithm with test problems using analytical functions.\n\n\
