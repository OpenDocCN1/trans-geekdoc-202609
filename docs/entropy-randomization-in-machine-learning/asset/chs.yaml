  \n### 4.\n现在转向不等式 (7.3)。它们在结构上与不等式 (7.3) 相似，唯一的区别在于函数 *φ*(**w**, **z**) (7.98)。因此，\n\
  \n$$\\begin{array}{r} \\left. \\left. \\sum\\limits_{i = 1}^{N} \\right|v^{i} -\
  \ v \\middle| \\middle| \\varphi(\\zeta,\\mathbf{z}) \\middle| \\leq \\max_{\\zeta\
  \ \\in I^{n}} \\middle| \\varphi(\\zeta,\\mathbf{z}) \\middle| \\left. \\sum\\limits_{i\
