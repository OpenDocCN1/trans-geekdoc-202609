  (6.35)\n\n其中 **x**\\[*j*\\] = {*x*\\[*j*\\],…,*x*\\[*j*−*K*[*h*]\\]}。\n\n因此，模型输出与参数之间的关系本质上是非线性的，更具体地说是幂函数。\n\
  \n### 3. 具有结构化幂非线性的动态模型\n\n对于此类动态模型，函数描述具有以下形式：\n\n\n\n\n\n$$\\\\begin{array}{r}\
  \ {s\\\\lbrack j\\\\rbrack = {\\\\sum\\\\limits\\_{h = 1}^{R}{\\\\sum\\\\limits\\\
  _{n = 0}^{K\\_{h}}w\\_{h}}}\\\\lbrack n\\\\rbrack x^{h}\\\\lbrack j - n\\\\rbrack,\\\
  \\text{\\\\quad\\\\quad}j > K.} \\\\\\\\ \\\\end{array}$$  \n\n(6.36)\n\n(另见 图 4.11b。)\
  \ 其动态特性由脉冲特性 $w\\_{h}\\\\lbrack n\\\\rbrack,\\\\, h = \\\\overline{1,R},$ 描述，具有有限的“记忆”\
