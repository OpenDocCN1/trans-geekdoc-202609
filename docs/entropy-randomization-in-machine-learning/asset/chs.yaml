  $$\n\n(11.79)\n\n### 11.4.7 热喀斯特湖面积演化的随机化预测\n\n热喀斯特湖面积的时间演化在超过可用面积和气候参数数据的时间间隔的时间间隔上进行预测。在所考虑的情况下，每个预测间隔的开始都指\
  \ 2008 年。我们考虑以下三个时间间隔：\n\n* —短期，2008 年至 2013 年之间（$n = \\overline{35,40}$）；\n* —中期，2008\
  \ 年至 2018 年之间（$n = \\overline{35,45}$）；\n* —长期，2008 年至 2023 年之间（$n = \\overline{35,50}$）。\n\
  \n热喀斯特湖面积的时间演化使用训练好的随机化模型的组合（见 Fig. 11.13）在上述指定的预测间隔上进行预测。该组合中的模型以其参数的熵最优 PDF、辅助随机序列和测量噪声为特征。测量噪声的\
  \ PDF 在训练间隔上的时间瞬间是不同的：它们取决于时间瞬间和相应的拉格朗日乘子。例如，*LDRR-LA* 的测量噪声具有 PDF $Q_{n}^{\\*}(\\\
  xi\\lbrack n\\rbrack,\\theta_{n}),\\, n = \\overline{0,34}.$ 对于预测过程，我们应用对拉格朗日乘子取平均的\
  \ PDF。\n\n好吧，复合模型的块由以下 PDF 表征：\n\n* 对于 *LDRR-LA*，$P^{*}(a)$ 和 $Q^{*}(\\xi,\\overline{\\\
  theta}),\\,\\,\\overline{\\theta} = \\frac{1}{34 - p}{\\sum\\limits_{n = p}^{34}\\\
