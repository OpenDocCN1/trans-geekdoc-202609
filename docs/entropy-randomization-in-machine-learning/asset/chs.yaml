  \ {c_{n}^{(h)} = w_{h}\\\\lbrack n\\\\rbrack,\\\\text{\\\\quad\\\\quad}n = \\\\\
  overline{0,K_{h}}.} \\\\\\\\ \\\\end{array}$$  \n\n(6.34)\n\n利用隶属概率 **p**，将参数向量\
  \ **c**^((*h*)) 写成形式 (6.29)。将这些等式代入 (6.31) 得到模型方程\n\n$$\\\\begin{array}{r} {s\\\\\
  lbrack j\\\\rbrack = {\\\\sum\\\\limits_{h = 1}^{R}\\\\left( {\\\\left\\\\langle\
  \ \\\\mathbf{c}_{-}^{(h)},\\\\mathbf{x}\\\\lbrack j\\\\rbrack \\\\right\\\\rangle\
