  \ \\right)^{n + 1}G\\exp(G)\\left\\lbrack {1 + \\frac{l}{N}(1 + G^{2})} \\right\\\
  rbrack = \\widetilde{\\kappa}(N,n)\n\\right.\n\\\\\n\\end{array}\n$$\n\n(7.132)\n\
  \n以不小于 *P*(*N*, *m*) (7.117) 的概率成立。\n\n上界 *N*（或 *M*）的值可由条件计算得出\n\n$$\n\\begin{array}{r}\n\
  {N^{\\*} = \\max(\\widetilde{\\epsilon}(N,n) = \\delta;\\,\\, \\widetilde{\\kappa}(N,n)\
  \ = \\delta).}\n\\\\\n\\end{array}\n$$\n\n(7.133)\n\n## 7.4 具有 *p*-活动变量的乘性算法\n\n\
  RML 和 ML 程序中出现的许多问题都归结为非线性方程组，例如平衡方程 (7.9–7.12)。让我们说明一种求解此类方程的方法，这些方程与多面体上的熵最大化问题相关\
  \ [140]。\n\n考虑一组等式，将其解释为数据 **q** ∈ *R*^(*r*) 与线性参数模型输出 **y** ∈ *R*^(*n*) 之间的平衡约束：\n\
  \n$$\n\\begin{array}{r}\n{T\\mathbf{y} = \\mathbf{q},\\quad(T,\\mathbf{y}) \\geq\
  \ 0,\\,\\,\\mathbf{q} \\geq \\varepsilon > 0,\\text{\\quad\\quad}r < n.}\n\\\\\n\
  \\end{array}\n$$\n\n(7.134)\n\n这里 *T* 表示秩为 *r* 的满秩矩阵。对于系统 (7.134)，存在解集，并且在其中存在唯一解，该解最大化熵\n\
  \n$$\n\\begin{array}{r}\n{H(\\mathbf{y}) = - {\\sum\\limits_{i = 1}^{n}y_{i}}\\\
  ln\\frac{y_{i}}{ea_{i}},\\text{\\quad\\quad}e = 2.71,}\n\\\\\n\\end{array}\n$$\n\
  \n(7.135)\n\n其中 *a*[1], …, *a*[*n*] 作为参数起作用。\n\n考虑熵 (7.135) 的以下约束优化问题：\n\n$$\n\\\
  begin{aligned}\n& \\left. H(\\mathbf{y})\\Rightarrow\\max, \\right.\n\\\\\n& {T\\\
  ,\\mathbf{y} = \\mathbf{q}.}\n\\\\\n\\end{aligned}\n$$\n\n(7.136)\n\n相应的拉格朗日函数具有形式\n\
  \n$$\n\\begin{array}{r}\n{L(\\mathbf{y},\\overline{\\lambda}) = H(\\mathbf{y}) +\
  \ {\\sum\\limits_{k = 1}^{r}\\lambda_{k}}\\left( {q_{k} - {\\sum\\limits_{i = 1}^{n}t_{ki}}y_{i}}\
  \ \\right).}\n\\\\\n\\end{array}\n$$\n\n(7.137)\n\n一阶最优性条件为\n\n$$\n\\begin{aligned}\n\
  {\\nabla_{y_{i}}L(\\mathbf{y},\\overline{\\lambda})} & {\\frac{\\partial H(\\mathbf{y})}{\\\
  partial y_{i}} - {\\sum\\limits_{k = 1}^{r}\\lambda_{k}}t_{ki} = 0,\\quad i = \\\
  overline{1,n};}\n\\\\\n{\\nabla_{\\lambda_{k}}L(\\mathbf{y},\\overline{\\lambda})}\
  \ & {q_{k} - {\\sum\\limits_{i = 1}^{n}t_{ki}}y_{i} = 0,\\quad k = \\overline{1,r}.}\n\
  \\\\\n\\end{aligned}\n$$\n\n(7.138)\n\n第一组方程给出变量 **y** 与拉格朗日乘子 $\\overline{\\lambda}$\
  \ 之间的关系，形式为\n\n$$\n\\begin{array}{r}\n{y_{i}(\\overline{\\lambda}) = \\frac{a_{i}}{{\\\
  sum\\limits_{k = 1}^{r}\\exp}(t_{k}i\\lambda_{k})},\\text{\\quad\\quad}i = \\overline{1,n}.}\n\
  \\\\\n\\end{array}\n$$\n\n(7.139)\n\n该关系使我们能够从拉格朗日函数 (7.137) 的定义中消去原变量 **y**，从而得到对偶函数（取决于对偶变量——拉格朗日乘子）的以下表达式：\n\
  \n$$\n\\begin{array}{r}\n{\\widetilde{L}(\\overline{\\lambda}) = L\\lbrack\\mathbf{y}(\\\
  overline{\\lambda}),\\overline{\\lambda}\\rbrack.}\n\\\\\n\\end{array}\n$$\n\n(7.140)\n\
  \n其梯度的元素为\n\n$$\n\\begin{array}{r}\n{\\nabla_{\\lambda_{k}}\\widetilde{L}(\\overline{\\\
  lambda}) = q_{k} - {\\sum\\limits_{i = 1}^{n}y_{i}}(\\overline{\\lambda}),\\text{\\\
  quad\\quad}k = \\overline{1,r}.}\n\\\\\n\\end{array}\n$$\n\n(7.141)\n\n就对偶函数而言，最优性条件\
  \ (7.138) 的第二组可以写成\n\n$$\n\\begin{array}{r}\n{\\nabla_{\\lambda_{k}}\\widetilde{L}(\\\
  overline{\\lambda}) = 0,\\text{\\quad\\quad}k = \\overline{1,r}.}\n\\\\\n\\end{array}\n\
  $$\n\n(7.142)\n\n因此，平衡约束具有形式\n\n$$\n\\begin{array}{r}\n{{\\widetilde{B}}_{k}(\\\
  overline{\\lambda}) = \\frac{1}{q_{k}}{\\sum\\limits_{i = 1}^{n}t_{ki}}\\frac{a_{i}}{{\\\
  sum\\limits_{j = 1}^{r}\\exp}\\left( {\\lambda_{j}t_{ji}} \\right)} = 1,\\quad\\\
  overline{\\lambda} \\in R^{r},\\text{\\quad\\quad}k = \\overline{1,r}.}\n\\\\\n\\\
  end{array}\n$$\n\n(7.143)\n\n通常将这些方程用非负变量 $z_{k} = \\exp(\\lambda_{k}),\\, k = \\\
  overline{1,r},$ 即指数拉格朗日乘子进行变换是方便的。然后方程 (7.143) 化为\n\n$$\n\\begin{array}{r}\n{B_{k}(\\\
  mathbf{z}) = \\frac{1}{q_{k}}{\\sum\\limits_{i = 1}^{n}t_{ki}}a_{i}\\left( {\\prod\\\
  limits_{j = 1}^{r}z_{k}^{- t_{ji}}} \\right) = 1,\\quad\\mathbf{z} \\in R_{+}^{r},\\\
  text{\\quad\\quad}k = \\overline{1,r}.}\n\\\\\n\\end{array}\n$$\n\n(7.144)\n\n现在，对于对偶函数\
  \ (7.140)，Hessian 矩阵具有形式\n\n$$\n\\begin{array}{r}\n\\left. \\Gamma(\\overline{\\\
  lambda}) = \\lbrack\\nabla_{\\lambda_{j},\\lambda_{l}}\\widetilde{L}(\\overline{\\\
  lambda})\\, \\middle| \\,(j,l) = \\overline{1,r}\\rbrack, \\right.\n\\\\\n\\end{array}\n\
  $$\n\n(7.145)\n\n其中\n\n$$\n\\begin{array}{r}\n{\\nabla_{\\lambda_{j},\\lambda_{l}}\\\
  widetilde{L}(\\overline{\\lambda}) = - {\\sum\\limits_{i = 1}^{n}t_{kj}}\\frac{\\\
  partial y_{j}}{\\partial\\lambda_{l}}.}\n\\\\\n\\end{array}\n$$\n\n(7.146)\n\n原变量表达式\
  \ (7.139) 意味着不等式\n\n$$\n\\begin{array}{r}\n{\\frac{\\partial y_{j}}{\\partial\\\
  lambda_{l}} \\leq 0,}\n\\\\\n\\end{array}\n$$\n\n(7.147)\n\n对所有 *λ* ∈ *R*^(*r*)\
  \ 成立。因此，Hessian 矩阵 (7.143) 由非负元素组成。考虑到 (7.145)，二次型 $K = \\left\\langle \\Gamma\\\
  overline{\\lambda},\\, \\overline{\\lambda} \\right\\rangle$ 对任意 $\\overline{\\\
  lambda} \\in R^{r}$ 都是严格正定的。这意味着对偶函数 *L̃* 是严格凸的。方程组 7.143 保证其解的有界性，即存在常数 *c* > 0\
  \ 使得 $\\left| \\overline{\\lambda} \\middle| \\leq c < \\infty. \\right.$ 因此，*L̃* ≥ *L*[min]。\n\
  \n为求解方程 (7.138)，利用具有 *p*-活动变量的乘性算法如下。\n\n*初始步骤：*\n\n$$\n\\begin{array}{r}\n{\\mathbf{z}^{0}\
  \ > \\mathbf{0}.}\n\\\\\n\\end{array}\n$$\n\n*迭代步骤：*\n\n$$\n\\begin{aligned}\nz_{k_{1}(s)}^{(s\
  \ + 1)} & {= z_{k_{1}(s)}^{s}B_{k_{1}(s)}^{\\gamma}(\\mathbf{z}^{s}),}\n\\\\\n\\\
  cdots & {= \\cdots\\cdots\\cdots,}\n\\\\\nz_{k_{p}(s)}^{(s + 1)} & {= z_{k_{p}(s)}^{s}B_{k_{p}(s)}^{\\\
  gamma}(\\mathbf{z}^{s})}\n\\\\\nz_{k}^{(s + 1)} & {= z_{k}^{s},\\quad k \\neq k_{1}(s),\\\
  ldots,k_{p}(s),}\n\\\\\n& {(k,k_{1}(s),\\ldots,k_{p}(s)) \\in \\overline{1,n}.}\n\
  \\\\\n\\end{aligned}\n$$\n\n(7.148)\n\n进一步的分析需要算法 (7.148) 在变量 *λ*[*k*] = ln *z*[*k*]\
  \ 下的加性形式。该形式写成如下。\n\n*初始步骤：*\n\n$$\n\\begin{array}{r}\n{{\\overline{\\lambda}}^{0}\
  \ \\in R^{n}.}\n\\\\\n\\end{array}\n$$\n\n*迭代步骤：*\n\n$$\n\\begin{aligned}\n\\lambda_{k_{1}(s)}^{(s\
  \ + 1)} & {= \\lambda_{k_{1}(s)}^{s} + \\gamma\\ln{\\widetilde{B}}_{k_{1}(s)}({\\\
  overline{\\lambda}}^{s}),}\n\\\\\n\\cdots & {= \\cdots\\cdots\\cdots,}\n\\\\\n\\\
  lambda_{k_{p}(s)}^{(s + 1)} & {= \\lambda_{k_{p}(s)}^{s} + \\gamma\\ln{\\widetilde{B}}_{k_{p}(s)}({\\\
  overline{\\lambda}}^{s})}\n\\\\\n\\lambda_{k}^{(s + 1)} & {= \\lambda_{k}^{s},\\\
  quad k \\neq k_{1}(s),\\ldots,k_{p}(s),}\n\\\\\n& {(k,k_{1}(s),\\ldots,k_{p}(s))\
  \ \\in \\overline{1,n},}\n\\\\\n\\end{aligned}\n$$\n\n(7.149)\n\n其中 ${\\widetilde{B}}_{k}(\\\
  overline{\\lambda}) = B_{k}(\\exp(\\overline{\\lambda})),\\, k = \\overline{1,r}.$\n\
  \n此类算法的一个主要困难是选择活动变量。该选择可以通过循环规则来组织，例如对于 *p* = 1，\n\n$$\n\\begin{array}{r}\n{k_{1}(s)\
  \ = s(\\text{mod}\\, n + 1).}\n\\\\\n\\end{array}\n$$\n\n(7.150)\n\n更有效的方法涉及残差反馈，即\n\
  \n\n\n\n\n$$\\\\begin{array}{r} \\\\left. \\\\vartheta_{k}(\\\\mathbf{z}^{s}) =\
  \ \\\\middle| 1 - B_{k}(\\\\mathbf{z}^{s}) \\\\middle| ,\\\\text{\\\\quad\\\\quad}k\
  \ = \\\\overline{1,n}. \\\\right. \\\\\\\\ \\\\end{array}$$  \n(7.151)\n\n引入以下记号：\n\
  \n$$\\\\begin{aligned} \\\\frac{r}{p} & {= I + \\\\delta,\\\\text{\\\\quad\\\\quad}\\\
  \\rho = s\\\\lbrack\\\\text{(}mod)\\\\,(I + 1)\\\\rbrack,} \\\\\\\\ I & {= \\\\\
  left\\\\lbrack \\\\frac{r}{p} \\\\right\\\\rbrack,\\\\text{\\\\quad\\\\quad}0 \\\
  \\leq \\\\delta \\\\leq p - 1.} \\\\\\\\ \\\\end{aligned}$$  \n(7.152)\n\n这里 \\\
  [ ⋅ \\] 表示值  ⋅  的整数部分。考虑指标集\n\n$$\\\\begin{array}{r} {K = \\\\left\\\\{ 1,\\\\ldots,r\
  \ \\\\right\\\\},\\\\text{\\\\quad\\\\quad}K_{m}(s) = \\\\left\\\\{ k_{1}(s),\\\\\
  ldots,k_{m}(s) \\\\right\\\\},} \\\\\\\\ \\\\end{array}$$  \n(7.153)\n\n其中\n\n$$\\\
  \\begin{array}{r} {m = \\\\left\\\\{ \\\\begin{array}{r} {1,\\\\ldots,p\\\\text{if}\\\
  \\,\\\\rho < I;} \\\\\\\\ {1,\\\\ldots,\\\\delta\\\\text{if}\\\\,\\\\rho = I.} \\\
  \\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\\ \\\\end{array}$$  \n(7.154)\n\n令\n\n\
  $$\\\\begin{aligned} {P_{m - 1}(s)} & {= \\\\left\\\\lbrack {{\\\\underset{v = 1}{\\\
  \\overset{\\\\rho}{\\\\cup}}K_{p}}(s - v)} \\\\right\\\\rbrack{\\\\cup K_{m - 1}}(s),}\
  \ \\\\\\\\ {G_{m - 1}(s)} & {= K\\\\smallsetminus P_{m - 1}(s),} \\\\\\\\ \\\\end{aligned}$$\
  \  \n(7.155)\n\n其中 `K`0 = `P`0 = `G`0 = ⌀.\n\n现在我们可以陈述活动变量的选择规则：*活动变量的包由残差最大的 p\
  \ 个变量的指标构成*，即\n\n$$\\\\begin{array}{r} {k_{m}(s) = \\\\arg\\\\max_{i \\\\in G_{m\
  \ - 1}(s)}\\\\vartheta_{i}(\\\\mathbf{z}^{s}).} \\\\\\\\ \\\\end{array}$$  \n(7.156)\n\
  \n该规则得到不等式链\n\n$$\\\\begin{array}{r} {\\\\vartheta_{k_{p}(s)}(\\\\mathbf{z}^{s})\
  \ < \\\\vartheta_{k_{p - 1}(s)}(\\\\mathbf{z}^{s}) < \\\\cdots\\\\vartheta_{k_{1}(s)}(\\\
  \\mathbf{z}^{s}).} \\\\\\\\ \\\\end{array}$$  \n(7.157)\n\n应用规则 (7.156, 7.157) 使所有变量在\
  \ (`I` + 1) 次迭代中变为活动，并在周期 (`I` + 1) 下再次出现。\n\n我们对算法 (7.149) 的收敛性分析将从以下重要概念开始。\n\n\
  迭代过程 (7.149) 的收敛条件由 **定理 1** 定义。*假设：*\n\n*(a) 函数 `$\\\\Phi_{k}(\\\\overline{\\\\\
  lambda}) = \\\\ln{\\\\widetilde{B}}_{k}(\\\\overline{\\\\lambda}),\\\\,(k = \\\\\
  overline{1,n}),$` 连续可微；*\n\n*(b) 雅可比矩阵 `$J({\\\\overline{\\\\lambda}}^{*}) = \\\\\
  left\\\\lbrack \\\\frac{\\\\partial\\\\Phi_{k}(\\\\overline{\\\\lambda})}{\\\\partial\\\
  \\lambda_{i}} \\\\right\\\\rbrack_{{\\\\overline{\\\\lambda}}^{*}}$` 是 Hurwitz 矩阵；*\n\
  \n*(c) 集合 `G`[`λ`] 是紧集；*\n\n*(d) 存在 `ε` > 0 使得不等式 `$\\\\|\\\\overline{\\\\lambda}(t)\
  \ - {\\\\overline{\\\\lambda}}^{*}\\\\| \\\\leq \\\\varepsilon,$` 其中 `$\\\\overline{\\\
  \\lambda}(t)$` 是系统 (7.156) 在初始条件 `$\\\\overline{\\\\lambda}(0) = {\\\\overline{\\\
  \\lambda}}^{0},$` 下的解，对所有 `${\\\\overline{\\\\lambda}}^{0} \\\\in G_{\\\\lambda}$`\
  \ 从某个 `t` > 0 开始成立。*\n\n*则由算法 (7.4) 生成的过程是 `G`[`λ`]\\-收敛的。*\n\n在该定理的假设下，算法 (7.149)\
  \ 给出系统 (7.158) 解的 Euler 多边形近似。\n\n*证明.* 在 `G`[`λ`] 中选取可数稠密点集 `{*ζ*[*s*]}`。设 `t`[1]\
  \ 为系统 (7.158) 在初始条件 `ζ`[1] 下的解进入点 `${\\\\overline{\\\\lambda}}^{*};$` 的 `ε`/2-邻域的第一个时刻；该时刻\
  \ `t`[1] 由条件 (*d*) 存在。选取点 `ζ`[1] 的邻域 `\U0001D4A2`[1]，使得其内的点沿系统 (7.158) 的轨迹在时间 `t`[1]\
  \ 后到达点 `${\\\\overline{\\\\lambda}}^{*}$` 的 3`ε`/4-邻域。注意条件 (*a*) 保证了解对初始条件的连续依赖性。\n\
  \n选取不属于 `\U0001D4A2`[1] 的点 `ζ`[2]。与点 `ζ`[1] 类似，对点 `ζ`[2] 定义 `t`[2] 和邻域 `\U0001D4A2\
  `[2]。继续此过程得到集合 `G`[`λ`] 由开集 `\U0001D4A2`[1]、 `\U0001D4A2`[2]、 ... 覆盖的情形。由于条件 (*c*)，可以从这些集合中选取有限子覆盖\
  \ `\U0001D4A2`[*i*[1]]、 …、 `\U0001D4A2`[*i*[*m*]]。令 `T` = min {`t`[*i*[1]]…,`t`[*i*[*m*]]}。最后，利用条件\
  \ (*a*)，取足够小的 `γ` > 0，使得在区间 0、 `T` 上系统 (7.158) 的解可被 Euler 多边形以精度 `ε`/4 近似。\n\n#\
  \ 第 8 章 在紧集上具有给定概率密度函数的随机向量的生成方法\n\nDOI: [10.1201/9781003306566-8](https://doi.org/10.1201/9781003306566-8)\n\
  \nRML 过程的最后阶段是使用熵最优随机模型生成随机向量或轨迹的集合。在此至关重要的是能够生成具有任意形式给定 PDFs 的这些随机对象的方法。在一般表述中，随机序列和随机向量的生成问题对于蒙特卡洛方法来说是经典的。存在许多用于生成具有给定概率特征的“标准”随机数序列的方法，如均匀、高斯、泊松分布等\
  \ \\159, [168\\]。然而，当涉及服从任意形式 PDFs 的序列以及高维随机向量的序列时，只能提出很少的方法。本章开始时，我们将对生成方法进行简要综述，不求详尽，但能深入了解这些方法背后的主要概念。我们的注意力将集中在一种用于生成在紧集上定义的\
  \ PDFs 的随机向量的方法上。它用 `n`\\-维分段常数函数逼近给定的 PDF，其中步长取决于该 PDF 的 Lipschitz 常数。随机对象生成的一个重要方面是进行统计检验，以验证所生成对象的概率特性是否与给定的\
  \ PDF 相匹配。\n\n## 8.1 随机对象生成方法的综述\n\n生成随机变量、向量和轨迹的问题具有日益增长的重要性，因为蒙特卡洛方法是在数值积分、优化、控制和机器学习等不同问题的求解中真正的工具，包括随机机器学习。因此，让读者熟悉文献中经常提到的一些生成方法是有用的。本综述分为两部分，第一部分致力于随机变量的生成，第二部分致力于随机向量的生成。\n\
  \n### 8.1.1 随机变量\n\n### 8.1.2 随机向量\n\n## 8.2 具有给定概率密度函数的随机向量的直接生成方法\n\n该方法使用对给定\
  \ PDF 的阶梯函数近似，随后在随机选择的初等立方体内生成均匀分布的独立随机向量。考虑 PDF `w`(**x**)， **x** ∈ `Q` ⊂ `R`^(`n`)。\n\
  \n### 8.2.1 单位立方体 `Q`\n\n为单位立方体 `Q` 的每个坐标引入步长为 `h` 的均匀格点。于是该立方体被划分为体积为 `V`[`i`] = `h`^(`n`)\
  \ 的初等立方体。设 (1/`h`) 为整数值。则初等立方体的数量为 `N` = (1/`h`)^(`n`) 且 `$i = \\\\overline{1,N}.$`\
  \ 对每个初等立方体，引入步长为 `η` 的另一格点。结果，每个初等立方体由体积为 `v`[`i`]^(`j`) = `η`^(`n`) 的内部子立方体组成。用\
  \ `M` = (1/`η`)^(`n`) 表示其数量，`$j = \\\\overline{1,M}.$` 假设所有初等立方体的总体积与所有子立方体的总体积一致。在每个内部子立方体中选取任意点\
  \ **x**[`i`]^(`j`) 并定义值\n\n$$\\\\begin{array}{r} {C_{i} = \\\\frac{1}{M}{\\\\sum\\\
  \\limits_{j = 1}^{M}w}(\\\\mathbf{x}_{i}^{j}).} \\\\\\\\ \\\\end{array}$$  \n(8.15)\n\
  \n对于足够大的 `M`，\n\n\n\n\n\n$$\\\\begin{array}{r} {\\\\left. C_{i} \\\\right.\\\\sim\\\
  \\frac{1}{V_{i}}{\\\\int_{V_{i}}w}(\\\\mathbf{x})d\\\\mathbf{x}.} \\\\\\\\ \\\\\
  end{array}$$  \n\n(8.16)\n\n因此，\n\n$$\\\\begin{array}{r} {\\\\left. C_{i} \\\\right.\\\
  \\sim w(\\\\mathbf{x})\\\\quad\\\\text{if}\\\\,\\\\mathbf{x} \\\\in V_{i}.} \\\\\
  \\\\ \\\\end{array}$$  \n\n(8.17)\n\n记 ${\\\\overline{\\\\xi}}^{i},\\\\, i = \\\\\
  overline{1,N},$ 为服从基本立方体上均匀分布的独立随机向量。此类向量的密度在基本立方体内部为 1/*V*[*i*]，外部为 0。这些向量可使用方法\
  \ (8.6, 8.7) 生成。\n\n设 *β* 为不依赖于 $\\\\left\\\\{ {\\\\overline{\\\\xi}}^{i} \\\\right\\\
  \\}$ 的整数随机变量，取值为 1, …, *N*，其概率为 *p*[*i*] = *C*[*i*]*V*[*i*]。则生成的向量具有形式\n\n$$\\\\\
  begin{array}{r} {\\\\mathbf{x} = {\\\\sum\\\\limits_{i = 1}^{N}{\\\\overline{\\\\\
  xi}}^{i}}\\\\Lambda(\\\\beta = i),} \\\\\\\\ \\\\end{array}$$  \n\n(8.18)\n\n其中\
  \ *Λ*(*A*) 表示集合 *A* 的示性函数。向量 **x** 的 PDF 可写为\n\n$$\\\\begin{aligned} & \\\\left.\
  \ P(\\\\mathbf{x} = d\\\\mathbf{x}) = {\\\\sum\\\\limits_{i = 1}^{N}P}(\\\\mathbf{x}\
  \ = d\\\\mathbf{x}\\\\, \\\\middle| \\\\,\\\\beta = i)P(\\\\beta = i) = \\\\right.\
  \ \\\\\\\\ & {\\\\left. \\\\text{\\\\quad\\\\quad}{\\\\sum\\\\limits_{i = 1}^{N}C_{i}}d\\\
  \\mathbf{x}\\\\Lambda(V_{i}) \\\\right.\\\\sim{\\\\sum\\\\limits_{i = 1}^{N}w}(\\\
  \\mathbf{x})d\\\\mathbf{x}\\\\Lambda(V_{i}).} \\\\\\\\ \\\\end{aligned}$$  \n\n\
  (8.19)\n\n## 8.2.2 紧集 *Q*\n\n### 1. *Q*—平行六面体 Π\n\n考虑集合 *P**i* = {**x**:**a**≤**x**≤**b**}，其中\
  \ **a** 和 **b** 为给定向量。用 $l_{i} = b_{i} - a_{i},\\\\, i = \\\\overline{1,n}.$ 表示其边的长度。在该集合上引入非均匀格网，可按每个坐标固定\
  \ *K* 个元素设计，也可按固定步长 *h* 设计。前一种情况下，各坐标步长不同，即\n\n$$\\\\begin{array}{r} {h_{i} = l_{i}/K;}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(8.20)\n\n后一种情况下，各格网元素数不同，即\n\n$$\\\\begin{array}{r}\
  \ {K_{i} = l_{i}/h.} \\\\\\\\ \\\\end{array}$$  \n\n(8.21)\n\n事实上，固定步长的情况已在上面讨论过。因此，我们将研究前一种具有可变步长的情况。由于格网在每个坐标上具有相同数量的元素，全部基本平行六面体\
  \ *Π*[*i*] 的数量为 *N* = *K*^(*n*)。基本平行六面体具有相同的体积\n\n$$\\\\begin{array}{r} {V = {\\\
  \\prod\\\\limits_{i = 1}^{n}h_{i}}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.22)\n\n在每个平行六面体内部，引入另一个每个坐标有\
  \ *M* 个元素的格网。则每个坐标的格网步长为\n\n$$\\\\begin{array}{r} {\\\\eta_{i} = h_{i}/M,} \\\\\\\
  \\ \\\\end{array}$$  \n\n(8.23)\n\n第 *j* 个内部子平行六面体 *π*[*i*]^(*j*) 的体积为\n\n$$\\\\\
  begin{array}{r} {v = {\\\\prod\\\\limits_{i = 1}^{n}\\\\eta_{i}}.} \\\\\\\\ \\\\\
  end{array}$$  \n\n(8.24)\n\n（这里 *j* 表示第 *i* 个基本平行六面体内部的内部子平行六面体的索引）。基本平行六面体 *Π*[*i*]\
  \ 内部全部内部子平行六面体 *π*[*i*]^(*j*) 的数量为\n\n$$\\\\begin{array}{r} {L = M^{n}.} \\\\\\\\\
  \ \\\\end{array}$$  \n\n(8.25)\n\n在 *π*[*i*]^(*j*) 中任取一点 **x**[*i*]^(*j*) 并计算值\n\
  \n$$\\\\begin{array}{r} {C_{i} = \\\\frac{1}{M}{\\\\sum\\\\limits_{j = 1}^{M}w}(\\\
  \\mathbf{x}_{i}^{j}).} \\\\\\\\ \\\\end{array}$$  \n\n(8.26)\n\n当 *M* 足够大时，\n\n\
  $$\\\\begin{array}{r} {\\\\left. C_{i} \\\\right.\\\\sim\\\\frac{1}{V_{i}}{\\\\\
  int_{V_{i}}w}(\\\\mathbf{x})d\\\\mathbf{x}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.27)\n\
  \n该生成过程的其余部分与单位立方体的情况组织方式相同；见上文。\n\n### 2. 任意紧集 *Q*\n\n在这种情况下，将集合 *Q* 置于平行六面体 *Π* = {**x**:**a**≤**x**≤**b**}\
  \ 中。边的定义可以任意，但需满足 *Q* ⊂ *Π*。一种更高效的生成随机向量的方法是将集合 *Q* 置于形为平行六面体 *Π*^(\\*)* 的包围盒中。这些可能性在\
  \ Figs. 8.1(a) 和 8.1(b) 中示出 (*a*—任意平行六面体 *Π*，*b*—包围盒)。显然，包围盒的构造需要预先计算极值点 (*A*, *B*, *C*, *D*)。\n\
  \n![Figure 8.1](img/fig8_1.jpg)\n\nFigure 8.1\n\n回想一下，PDF *w*(**x**) 在集合 *Q* 上定义。引入形如\n\
  \n$$\\\\begin{array}{r} {W(\\\\mathbf{x}) = \\\\left\\\\{ \\\\begin{aligned} {w(\\\
  \\mathbf{x})} & {\\\\text{if}\\\\,\\\\mathbf{x} \\\\in Q,} \\\\\\\\ 0 & {\\\\text{if}\\\
  \\,\\\\mathbf{x} \\\\in \\\\Pi\\\\smallsetminus Q.} \\\\\\\\ \\\\end{aligned}~ \\\
  \\right.} \\\\\\\\ \\\\end{array}$$  \n\n(8.28)\n\n的辅助 PDF。显而易见，平行六面体 Π 构成了 PDF\
  \ *W*(**x**) 的定义域。我们将使用第 2 项的生成过程对 PDF *W*(**x**) 进行处理。注意 *W*(**x**) = 0 在基本平行六面体\
  \ *Π*[*i*] 上以及在集合 *Π*^(\\*) ∖ *Q* 内的内部子平行六面体 *π*[*i*]^(*j*) 上。因此，由 (8.2.1) 得 *P*(**x** = *d***x**) = 0。\n\
  \n## 8.3 给定概率密度函数的近似\n\n针对给定概率密度函数的随机向量生成过程具有近似 *accuracy* 和格网 *step* 这样的重要方面。\n\
  \n### 1. 近似精度估计\n\n考虑 PDF *w*(**x**)，其中 **x** ∈ *Q* ⊂ *R*^(*n*). 集合 *Q* 是紧的，即具有非零体积\
  \ *V*[*Q*] ≠ 0。假设集合 *Q* 置于 *n*\\-维平行六面体 *Π* 中。函数 *w*(**x**) 是平方可积的。\n\n为了生成具有 PDF\
  \ *w*(**x**) 的随机向量，将其用分段常数函数 *g*(**x**)， **x** ∈ *Π* 近似。此近似的质量由泛函\n\n$$\\\\begin{array}{r}\
  \ \\\\left. J(A) = \\\\middle| {\\\\int_{A}\\\\left( {w(\\\\mathbf{x}) - g(\\\\\
  mathbf{x})} \\\\right)}d\\\\mathbf{x} \\\\middle| , \\\\right. \\\\\\\\ \\\\end{array}$$\
  \  \n\n(8.29)\n\n衡量，其中 *A* 表示 *Π* 中任意集合。\n\n在体积为 *V*[*Π*] 的集合 Π 上定义每个坐标步长为 $h_{k},\\\
  \\, k = \\\\overline{1,n},$ 的均匀格网。该格网的每个元素都是边长为 *h*[*k*] 的基本平行六面体 $\\\\Pi_{i},\\\
  \\, i = \\\\overline{1,N},$。不失一般性，假设\n\n$$\\\\begin{array}{r} {N = \\\\frac{V_{\\\
  \\Pi}}{V_{\\\\Pi_{i}}} = \\\\frac{V_{\\\\Pi}}{\\\\prod\\\\limits_{k = 1}^{n}h_{k}}.}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(8.30)\n\n并且该值是整数。注意所有基本平行六面体 *Π*[*i*] 具有相同的体积。在每个集合\
  \ *Π*[*i*] 中，用常数 *B*[*i*] 替换函数 *w*(**x**) 。对所有基本平行六面体执行此操作后，得到分段常数线性逼近函数 *g*(**x**).\n\
  \n考虑 *Π* 中的某一集合 *A* ∈ *Π*。它被基本平行六面体的并集覆盖，即\n\n$$\\\\begin{array}{r} {A = {\\\\underset{i\
  \ = 1}{\\\\overset{N}{\\\\cup}}\\\\Pi_{i}}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.31)\n\
  \n然后，利用 Cauchy–Bunyakovsky–Schwarz 不等式，写出上界\n\n$$\\\\begin{array}{r} {J(A) \\\\\
  leq \\\\sqrt{{\\\\int_{A}\\\\left( {w(\\\\mathbf{x}) - g(\\\\mathbf{x})} \\\\right)^{2}}d\\\
  \\mathbf{x}{\\\\int_{A}\\\\Lambda}(A)d\\\\mathbf{x}}.} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(8.32)\n\n这里 *Λ*(*A*) 表示集合 *A* 的示性函数。由 (8.32) 可得\n\n$$\\\\begin{array}{r}\
  \ {{\\\\int_{A}\\\\left( {w(\\\\mathbf{x}) - g(\\\\mathbf{x})} \\\\right)^{2}}d\\\
  \\mathbf{x} \\\\leq {\\\\sum\\\\limits_{i = 1}^{N}{\\\\int_{\\\\Pi_{i}}\\\\left(\
  \ {w(\\\\mathbf{x}) - B_{i}} \\\\right)^{2}}}d\\\\mathbf{x}.} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(8.33)\n\n因此，\n\n$$\\\\begin{array}{r} {\\\\sup\\\\limits_{A}J(A) \\\\leq\
  \ {\\\\sum\\\\limits_{i = 1}^{N}{\\\\int_{\\\\Pi_{i}}\\\\left( {w(\\\\mathbf{x})\
  \ - B_{i}} \\\\right)^{2}}}d\\\\mathbf{x}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.34)\n\
  \n作为结果，常数 *B*[1], …, *B*[*N*] 的最佳估计可通过最小化泛函\n\n\n\n\n\n$$\\\\begin{array}{r} \\\\\
  left. {\\\\sum\\\\limits\\_{i = 1}^{N}{\\\\int\\_{\\\\Pi\\_{i}}\\\\left( {w(\\\\\
  mathbf{x}) - B\\_{i}} \\\\right)^{2}}}d\\\\mathbf{x}\\\\Rightarrow\\\\min\\_{B\\\
  _{1},\\\\ldots,B\\_{N}} \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(8.35)\n\nsubject\
  \ to the condition\n\n$$\\\\begin{array}{r} {V\\_{\\\\Pi\\_{i}}{\\\\sum\\\\limits\\\
  _{i = 1}^{N}B\\_{i}} = 1.} \\\\\\\\ \\\\end{array}$$  \n\n(8.36)\n\nThis equality\
  \ expresses the normalization condition of the PDF. The solution of the minimization\
  \ problem is given by\n\n$$\\\\begin{array}{r} {B\\_{i}^{\\*} = \\\\frac{1}{V\\\
  _{\\\\Pi\\_{i}}}{\\\\int\\_{\\\\Pi\\_{i}}w}(\\\\mathbf{x})d\\\\mathbf{x}.} \\\\\\\
  \\ \\\\end{array}$$  \n\n(8.37)\n\nThus, the described approximation procedure yields\
  \ the optimal piecewise constant PDF *g*^(\\*)(**x**) with the approximation accuracy\n\
  \n$$\\\\begin{array}{r} {\\\\sup\\\\limits\\_{A}J(A) \\\\leq \\\\sqrt{V\\_{\\\\\
  Pi}}\\\\sqrt{{\\\\sum\\\\limits\\_{i = 1}^{N}{\\\\int\\_{\\\\Pi\\_{i}}\\\\left(\
  \ {w(\\\\mathbf{x}) - B\\_{i}^{\\*}} \\\\right)^{2}}}d\\\\mathbf{x}} \\\\leq \\\\\
  delta.} \\\\\\\\ \\\\end{array}$$  \n\n(8.38)\n\n## 2. Optimization of lattice step\
  \ (estimation of Lipschitz constant)\n\nThe procedure suggested below employs an\
  \ estimate of the Lipschitz constant for the function *w*(**x**), which is assumed\
  \ to be continuous. We have *B*[*i*]^(\\*) = *w*(**x**[*i*]^(\\*)), where **x**[*i*]^(\\\
  *) ∈ *Π*[*i*] but the point **x**[*i*]^(\\*) is unknown. Let the function *w*(**x**)\
  \ satisfy the Lipschitz condition with a constant *L*, i.e.,\n\n$$\\\\begin{array}{r}\
  \ {\\\\max\\_{\\\\mathbf{x} \\\\in \\\\Pi\\_{i}}\\\\left( {w(\\\\mathbf{x}) - B\\\
  _{i}^{\\*}} \\\\right)^{2} \\\\leq L^{2}\\\\|\\\\mathbf{x} - \\\\mathbf{x}\\_{i}^{\\\
  *}\\\\|.} \\\\\\\\ \\\\end{array}$$  \n\n(8.39)\n\nThe integral form of this inequality\
  \ on the intervals \\[0, *h*[1]\\] × \\[0, *h*[2]\\] × ⋯ × \\[0, *h*[*n*]\\] can\
  \ be written as\n\n$$\\\\begin{array}{r} {{\\\\int\\_{|pi\\_{i}}\\\\left( {w(\\\\\
  mathbf{x}) - B\\_{i}^{\\*}} \\\\right)^{2}}d\\\\mathbf{x} \\\\leq L^{2}{\\\\int\\\
  _{0}^{h\\_{1}}\\\\cdots}{\\\\int\\_{0}^{h\\_{n}}\\\\left( {x\\_{1}^{2} + \\\\cdots\
  \ + x\\_{n}^{2}} \\\\right)}dx\\_{1}\\\\cdots dx\\_{n} =} \\\\\\\\ {L^{2}\\\\left(\
  \ {\\\\frac{h\\_{1}^{3}}{3}h\\_{2}h\\_{3}\\\\cdots h\\_{n} + \\\\frac{h\\_{2}^{3}}{3}h\\\
  _{1}h\\_{3}\\\\cdots h\\_{n} + \\\\cdots + \\\\frac{h\\_{n}^{3}}{3}h\\_{1}h\\_{2}\\\
  \\cdots h\\_{n - 1}} \\\\right) = L^{2}\\\\varrho.} \\\\\\\\ \\\\end{array}$$  \n\
  \n(8.40)\n\nThe variable *ϱ* is independent of the index *i* of an elementary parallelepiped\
  \ because all of them have the same sizes. Taking into account (8.40), transform\
  \ inequality (8.34) into\n\n$$\\\\begin{array}{r} {\\\\sup J(A) \\\\leq L\\\\sqrt{V\\\
  _{\\\\Pi}{\\\\sum\\\\limits\\_{i = 1}^{N}\\\\varrho}} = L\\\\sqrt{V\\_{\\\\Pi}N\\\
  \\varrho}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.41)\n\nThen\n\n$$\\\\begin{array}{r}\
  \ {V\\_{\\\\Pi} = NV\\_{\\\\Pi\\_{i}} = N{\\\\prod\\\\limits\\_{j = 1}^{n}h\\_{j}}.}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n(8.42)\n\nHence, using (8.40), the right-hand side\
  \ of inequality (8.41) can be reduced to\n\n$$\\\\begin{array}{r} {L\\\\sqrt{V\\\
  _{\\\\Pi}N\\\\varrho} = L\\\\sqrt{V\\_{\\\\Pi}}N\\\\varrho = L\\\\sqrt{V\\_{\\\\\
  Pi}^{2}}\\\\frac{\\\\varrho}{\\\\prod\\\\limits\\_{j = 1}^{n}h\\_{j}} = \\\\frac{L}{\\\
  \\sqrt{3}}V\\_{\\\\Pi}\\\\sqrt{\\\\sum\\\\limits\\_{j = 1}^{n}h\\_{j}^{2}}.} \\\\\
  \\\\ \\\\end{array}$$  \n\n(8.43)\n\nDenote *h* = max[1 ≤ *j* ≤ *n*]*h*[*j*]. Then\
  \ it follows from (8.41, 8.43) that\n\n$$\\\\begin{array}{r} {\\\\sup J(A) \\\\\
  leq L\\\\sqrt{n/3}hV\\_{\\\\Pi}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.44)\n\nFor a\
  \ given approximation accuracy *δ* of the PDF *w*(**x**), the corresponding maximum\
  \ lattice step is\n\n$$\\\\begin{array}{r} {h = \\\\frac{\\\\delta}{L\\\\sqrt{\\\
  \\frac{n}{3}}V\\_{\\\\Pi}}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.45)\n\nThe maximum\
  \ step for the longest edge of the parallelepiped allows us to find the number *N*\
  \ of points and, using it, the steps *h*[*j*] for all other coordinates.\n\n## 3.\
  \ Rough estimate of step\n\nThe estimation method of the Lipschitz constant *L*\
  \ and the maximum step *h* for elementary parallelepipeds design rests on the assumption\
  \ that the integral in (8.37) can be calculated analytically (without errors). Unfortunately,\
  \ this is not always the case. A given PDF often has a complex structure, which\
  \ requires numerical calculation of the integral in formula (8.37). Such calculations\
  \ are performed using an inner lattice with a step *η*[*i*] that is considerably\
  \ smaller than the step *h*[*i*] of the main lattice.\n\nThe step *η*[*i*] can be\
  \ chosen using a simple technique as follows. First, specify a certain step *η*[*i*]^(*j*),\
  \ and calculate the number *M*[*i*]^(*j*) = *l*[*i*]/*η*[*i*]^(*j*) of points in\
  \ the integral sum *S*[*i*]^(*j*). Then repeat these operations, and check the variability\
  \ of the resulting integral sums. If |*S*[*i*]^(*j*)−*S*[*i*]^((*j* − 1))|≤*δ*,\
  \ where *δ* is a given accuracy, then stop further partition of the inner lattice.\
  \ The integral can be estimated by\n\n$$\\\\begin{array}{r} {{\\\\int\\_{\\\\Pi\\\
  _{i}}\\\\left( {w(\\\\mathbf{x}) - {\\\\hat{B}}\\_{i}^{\\*}} \\\\right)^{2}}d\\\\\
  mathbf{x} \\\\leq {\\\\hat{J}}\\_{i} = S\\_{i}^{j^{\\*}} + \\\\delta/2.} \\\\\\\\\
  \ \\\\end{array}$$  \n\n(8.46)\n\nHere *j*^(\\*) denotes the index of the inner\
  \ lattice for which the calculations are stopped. Then, according to (8.38),\n\n\
  $$\\\\begin{array}{r} {\\\\sup\\\\limits\\_{A}J(A) \\\\leq \\\\sqrt{V\\_{\\\\Pi}}\\\
  \\sqrt{{\\\\sum\\\\limits\\_{i = 1}^{N}{\\\\hat{J}}\\_{i}} + N\\\\delta/2}.} \\\\\
  \\\\ \\\\end{array}$$  \n\n(8.47)\n\nThe constants *B̂*[1]^(\\*), …, *B̂*[*N*]^(\\\
  *) and the estimates *Ĵ*[1], …, *Ĵ*[*N*] are obtained numerically.\n\nBecause\
  \ all the calculations have a rough character, it makes sense to consider an accuracy\
  \ estimate based on another metric. Let $A \\\\subseteq {\\\\underset{i = 1}{\\\\\
  overset{N}{\\\\cup}}Q\\_{i}}.$ Since *V*[*Q*[*i*]] is independent of *i*,\n\n$$\\\
  \\begin{array}{r} \\\\left. \\\\sup\\\\limits\\_{A}J(A) \\\\leq V\\_{Q}{\\\\sum\\\
  \\limits\\_{i = 1}^{N}\\\\max\\_{\\\\mathbf{x} \\\\in Q\\_{i}}} \\\\middle| w(\\\
  \\mathbf{x} - C\\_{i}) \\\\middle| . \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n\
  (8.48)\n\nThe optimal constants $C\\_{i},i = \\\\overline{1,N},$ are yielded by\
  \ solving the optimization problem\n\n$$\\\\begin{array}{r} \\\\left. {\\\\sum\\\
  \\limits\\_{i = 1}^{N}\\\\max\\_{\\\\mathbf{x} \\\\in Q\\_{i}}} \\\\middle| w(\\\
  \\mathbf{x} - C\\_{i}) \\\\middle| \\\\Rightarrow\\\\max\\_{C\\_{1},\\\\ldots,C\\\
  _{N}}. \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(8.49)\n\nThe solution has the\
  \ form\n\n$$\\\\begin{array}{r} {{\\\\widetilde{C}}\\_{i} = \\\\frac{\\\\max\\_{\\\
  \\mathbf{x} \\\\in Q\\_{i}}w(\\\\mathbf{x}) + \\\\min\\_{\\\\mathbf{x} \\\\in Q\\\
  _{i}}w(\\\\mathbf{x})}{2}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.50)\n\nRecall that\
  \ these constants are used to construct an approximating function for the PDF. Hence,\
  \ they must be normalized in the following way:\n\n$$\\\\begin{array}{r} {C\\_{i}^{\\\
  *} = \\\\frac{{\\\\widetilde{C}}\\_{i}}{V\\_{Q}{\\\\sum\\\\limits\\_{i = 1}^{N}{\\\
  \\widetilde{C}}\\_{i}}}.} \\\\\\\\ \\\\end{array}$$  \n\n(8.51)\n\nIn the final\
  \ analysis, the error can be estimated as\n\n$$\\\\begin{array}{r} \\\\left. \\\\\
  sup\\\\limits\\_{A}J(A) \\\\leq V\\_{Q}{\\\\sum\\\\limits\\_{i = 1}^{N}\\\\max\\\
  _{\\\\mathbf{x} \\\\in Q\\_{i}}} \\\\middle| w(\\\\mathbf{x} - C\\_{i}^{\\*}) \\\
  \\middle| . \\\\right. \\\\\\\\ \\\\end{array}$$  \n\n(8.52)\n\nConsequently, we\
  \ have derived two estimates for the approximation error, (8.47) and (8.52). In\
  \ applications, it is necessary to calculate both estimates and compare them with\
  \ a given accuracy. If at least one of the estimates fails, calculations should\
  \ be repeated with a smaller lattice step.\n\n# CHAPTER 9 INFORMATION TECHNOLOGIES\
  \ OF RANDOMIZED MACHINE LEARNING\n\nDOI: [10.1201/9781003306566-9](https://doi.org/10.1201/9781003306566-9)\n\
  \nBy now the computer systems of various performance levels have evolved towards\
  \ a heterogeneous structure that is characterized by an availability of computing\
  \ devices of different types. A standard system includes a universal multi-core\
  \ processor in combination with a massive-parallel architecture accelerator (also\
  \ called a computational processor or a coprocessor). An overwhelming majority of\
  \ modern high-performance systems is based on the concept of horizontal scaling,\
  \ integrating thousands of heterogeneous computation modules within a uniform organization.\n\
  \n\n\n\n\n计算模块的异构架构极大地增加了计算机系统高效利用的复杂性，这通常被理解为所有计算设备的几乎 100% 负载。这里的主要困难在于架构特性，以及在许多情况下，针对不同类型计算设备可用的应用程序编程接口（`API`）存在显著差异。对于大规模并行加速器，前者因素导致了需要并行数据处理并使用相应的算法。后者因素决定了实现不同编程模型的软件工具在开发和集成方面具有很高的复杂性。\n\
  \n因此，当代计算机科学的一个重要问题是提出针对广泛的异构计算机系统的新算法和技术开发与实现方法。\n\n在最近的时期，机器学习已达到一定的成熟水平，现在可应用于许多曾被认为无法解决或计算过于密集的实际问题。当前该科学的许多进步都集中在软件工程领域，这是由于大多数实际问题具有很高的计算复杂性。这些是高维优化问题，需要高效的计算算法。\n\
  \n在某些方面，随机的机器学习对计算效率提出了更苛刻的要求，这与该理论基础上的困难数学问题有关。因此，`RML` 方法的高效实现依赖于利用异构结构计算系统的并行计算。\n\
  \n## 9.1 现代计算机系统的架构\n\n基于冯·诺依曼架构的当代计算机系统可以根据处理器数量和类型、内存容量和结构以及加速器（协处理器）的存在而具有不同的配置。这些系统可以使用内存的逻辑结构进行分类，该结构定义了由处理器执行的程序代码的内存访问规则。这种方法区分了两类系统，即具有共享内存和分布式内存的系统。当然，这种分类存在一定的缺点，但为系统导向算法的开发和分析提供了方便且高效的计算机系统表示。\n\
  \n在此分类中，处理器访问的内存地址空间要么是统一的，要么是独立的。这一特性决定了利用计算机系统资源适当的*编程模型*。\n\n请注意，所研究的分类并非唯一。存在允许用户将物理上分布式内存的计算机系统视为具有统一地址空间的系统的技术。相反，具有分布式内存的系统可以在具有共享内存的系统上进行仿真。\n\
  \n到目前为止，在这些类别中已广泛使用两种标准编程模型，即基于*共享内存*的模型和基于*消息传递*的模型。前者模型具有统一地址空间的优势，因为它直接使用共享内存进行处理器之间的数据传输。后者模型包含数据阻塞机制，数据块以消息的形式发送到其他处理器。目前，这些机制的详细组织并不那么重要：请注意，消息传输比直接内存访问操作更慢。这一特性必须在算法开发过程中予以考虑。\n\
  \n首先，计算机系统的进一步发展旨在减少解决现有问题所需的时间，或提出和解决更大规模的新问题（或当前问题）。历史上，计算机性能的提升使用了两种方法，最终形成了*垂直*和*水平扩展*的概念。垂直扩展是通过提高单个计算模块的性能来实现的，而水平扩展则是通过增加计算模块的数量来实现的。\n\
  \n通常，计算模块代表具有共享内存的单处理器或多处理器系统，即具有统一地址空间的计算机系统，可被任何处理器访问。这种一般描述涵盖了常见的单处理器工作站，也涵盖了相当大的多处理器计算机系统。\n\
  \n在初始阶段，计算模块是在垂直扩展的概念下开发的，因为微电子的快速发展带来了越来越快的处理器和内存模块。一旦达到物理极限，使得单个处理器的进一步提速成为不可能，演进就转向了水平扩展，即多核处理器。请注意，水平扩展也用于增加对共享内存具有相同访问权限的处理器数量。\n\
  \n在具有共享内存的大型多处理器系统设计方面的积累经验表明，在通用内存模型框架内，许多处理器无法以良好的效率使用。因此，计算机性能理论上无限增长的唯一途径是对在共享内存模型下运行的计算模块进行水平扩展。显然，在上层，具有这种架构的系统代表了具有分布式内存的系统。大多数现代高性能计算机系统都是按照这一原则和架构设计的。\n\
  \n结果，不同计算机系统层级的程序并行执行成为提高其性能的基本方法。程序代码并行化的实际可行性导致了并行计算这一新科学的兴起。该科学研究程序并行执行的硬件工具，以及与此类系统高效利用相关的广泛问题。\n\
  \n现代计算机系统在硬件层面和系统软件（操作系统）层面都支持程序并行性。此类计算机系统的用户开发的程序是使用其操作系统提供的功能来实现和执行的。因此，我们可以识别出实现给定算法的程序的三个主要层；见\
  \ Fig. 9.1。\n\n![Figure 9.1](img/fig9_1.jpg)\n\nFigure 9.1\n\n底层负责硬件支持（*硬件层*）；根据冯·诺依曼架构，该层可以用指令处理节点（处理器）和用于指令和数据的存储内存来描述。当然，实际系统具有更复杂的组织，但此简单图表足以满足我们的详细程度。第二层称为*系统层*，形成系统软件，用于用户不考虑其功能的情况下对所有硬件工具进行抽象操作。最后，用户（或应用软件）占据架构的最高层级，这被称为*用户层*。\n\
  \n现在让我们更深入地讨论该架构的元素，如 Fig. 9.2 所示。由处理器执行的指令具有一定的组织结构并按顺序到来，从而形成*执行线程*。这是计算机系统硬件级并行化的主要概念\
  \ [45]。\n\n![Figure 9.2](img/fig9_2.jpg)\n\nFigure 9.2\n\n\n\n\n\n并行是通过同时执行多个命令或线程来实现的。这里一种广泛采用的方法就是所谓的\
  \ `simultaneous multi-threading`（`SMT`），尤其是英特尔开发的超线程技术。这种方法允许在单个处理器（`processor core`）上执行多个线程，从而实现并非物理而是逻辑上的并行化。尽管如此，性能仍可获得相当大的提升，因为在大多数程序中，执行过程也包括潜在操作（与内存和存储设备的工作）。等待其完成时，处理器可以执行来自另一个线程的多个命令。如果存在许多可用的处理器或核心（在大规模计算机系统术语中称为\
  \ `processing elements`（`PEs`）），则可以为线程组织真正的并行。\n\n用户通过相应的软件工具提供的应用程序编程接口（`API`）来管理硬件工具（就我们而言，是处理器线程）。因此，对于用户而言，处理器线程作为物理对象以不依赖硬件支持的逻辑对象的形式呈现。这些对象实现了计算机系统用户创建的程序代码。此类对象的主要对象是操作系统的线程和进程。\n\
  \n`process` 是操作系统执行的基本元素，由特殊的程序对象实现。所有当代操作系统都可以通过同时执行来运行多个进程。程序代码在处理器中执行，而对于单个处理器来说，真正的并行是不可能的。然而，在这种情况下，可以组织逻辑并行。\n\
  \n为了安全执行，操作系统的进程在计算机内存中彼此隔离。特别是，这一特性对其交互施加了一些限制，这些限制是通过特殊机制实现的。这些机制的具体形式会带来计算成本，因为必须保证所有进程的安全运行。因此，进程是一个“重量级”对象，在其创建、运行和消除过程中消耗了相当大的计算资源。与此同时，`thread`\
  \ 是一个“轻量级”程序对象，它在进程的资源共享模型（内存、文件描述符等）的框架内运行。因此，线程在运行中不需要太多资源。一个进程至少包含一个线程。\n\n作为系统级的基本对象，线程和进程也为用户友好的算法和程序开发定义了一个抽象层。因此，由操作系统实现的计算机系统的系统级架构具有层次组织。根据该架构，系统级的主要任务是\
  \ `to map` 系统对象到硬件对象，即在处理器上直接支持系统（逻辑）线程在硬件线程内的执行。\n\n当代操作系统是多任务的，这意味着它们可以通过在它们之间共享内存地址空间来支持许多同时运行的处理器，以保证它们的安全执行。这导致了\
  \ `tasks` 的并行执行，从而产生逻辑并行。物理并行可以通过计算设备（处理器）对进程或线程的真实执行来实现。因此，为了成功并行化多个进程，计算机系统必须拥有多个计算设备（处理器或核心）。\n\
  \n请注意，多任务可以用单个计算设备实现，例如基于时间共享：操作系统在固定时间内执行每个进程，然后挂起它并切换到另一个进程。显然，这种方法不会带来真正的性能提升，并行的优势也无法获得。\n\
  \n## 9.2 通用多线程架构\n\n软件开发的一个重要方面在于设计和分析由软件产品实现的相应算法。上面描述的计算机系统的总体架构（特别是系统级）决定了在用户级分析并开发应用软件的可能方法。对于支持并行的计算机系统而言，开发高效算法的问题变得更加紧迫\
  \ \\45, [69, 183\\]。\n\n历史上，旨在并行计算机系统的算法是通过考虑最低实现层进行分析的，即将“计算”分解为具有编程语言直接对应物的基本操作。在如此详细的规定之后，进一步的分析集中在硬件工具（硬件级），并详细规定到处理器及其内部结构，以便找到对具体计算机系统最有效的利用。\n\
  \n对算法的详细开发和分析方法导致了不同理论的出现，其主要目标是提出并行算法的通用分析程序。在此背景下，请注意一种使用图论技术进行建模和分析的 `model of\
  \ computations` 或 `model of programs` 的原创方法 \\[62, 183\\]。\n\n计算机系统在广义上的进步，即整个硬件和软件技术范围，已经达到这样一个阶段：许多算法和方法变得标准化。换句话说，它们以软件工具或技术形式存在高效实现，并得到现代计算机系统所有基本架构的支持。还请注意，其中大量技术是商业化的，这保证了高质量、可靠性和效率。\n\
  \n正如许多科学领域的历史所表明的那样，由于工具的发展，可以在这些工具定义的新抽象层上考虑新问题。因此，需要“更高层次”的方法来开发和分析面向现代计算机系统的算法。鉴于计算机系统的总体架构（参见\
  \ Section 8.1），我们认为期望的方法应涉及用户层：在这种情况下，算法可以在可用的抽象层下有效地表述并进一步分析。\n\n算法中的计算是相应程序运行的结果。在文献中，程序和算法的概念几乎没有区分。然而，我们将区分它们，将算法视为包含抽象操作和操作数的抽象事物，而实现该算法的程序则处理其执行环境提供的实际操作。\n\
  \n将虚拟线程视为实现计算的基本抽象对象。该对象位于计算机系统架构的用户层。这里所有的计算都具有抽象意义。也可以根据给定算法的详细程度进一步指定和研究这些概念和相关对象。\n\
  \n假设计算机系统的用户层提供了一定数量的此类虚拟线程，并且在共享内存模型内为它们提供并行执行的可能性，从而定义了虚拟 `multithread execution\
  \ environment`。根据任务（算法）的具体情况，这种面向并行的计算环境的一般表示有助于在基本元素上更有效地分析算法的不同特征（在一方面），并有助于用户层到系统层的有效映射（在另一方面）。\n\
  \n\n\n\n\n有趣的是，如今类似的思路在不同的技术中盛行，因此抽象被“绑定”到相应的实现对象。例如，请注意众所周知的程序平台，如 `Java`、`MPI`、`OpenMP`\
  \ 等。在这里，可以视为所考虑的虚拟线程的抽象，与实现它们的程序对象具有唯一对应关系。特别是，这适用于 `Java` 和 `OpenMP` 线程以及 `MPI`\
  \ 进程。所建议的方法由于其抽象性，提供了具有各种实现能力的必要且充分的工具。\n\n这种方法可以轻松扩展，垂直扩展（随着线程中计算量的增加，导致计算粒度更高）以及水平扩展（随着线程数量的增加）。此外，通过考虑多个虚拟执行环境，可以对具有不同内存结构的计算机系统进行建模，例如分布式内存。\n\
  \n所述的虚拟计算机系统架构，后文称为 *通用多线程架构 (UMA)*，属于高层架构，可以使用现有技术在所有计算机系统上高效实现。由于这种通用性，该架构可用于并行算法的开发和分析（见\
  \ 图 9.3）。\n\n![图 9.3](img/fig9_3.jpg)\n\n图 9.3\n\n现代计算机系统通常具有异构结构，即其计算模块包含不同类型的计算设备。这类设备的主要类型是通用中央处理器和具有大规模并行架构的计算协处理器（加速器）。然而，所有这些设备都涉及线程作为指令执行的基本元素；对于用户而言，线程代表虚拟（逻辑）对象，在执行期间映射到硬件线程。\n\
  \n可以以几种模式与加速器工作，这些模式具有由具体设备或设备系列的实现所决定的逻辑和物理方面。例如，众所周知的大规模并行架构 `MIC` [7] 或 `CUDA`\
  \ [6]，按如下方式将处理器用作卸载模式：当前计算任务被“卸载”到处理器并在其上执行，然后结果被发送回调用程序。这种组织方式允许设备从调用程序的不同线程异步运行。\n\
  \n对于设计为具有异构架构的计算模块集合的系统，存在三个并行实现层级（见 图 9.4），即\n* 计算模块层级，由操作系统进程在系统层实现；\n* 中央处理器层级，由处理器线程实现；\n\
  * 加速器层级，由加速器线程实现。\n\n![图 9.4](img/fig9_4.jpg)\n\n图 9.4\n\n因此，并行性具有分层的三级结构，这是现代计算机系统的典型特征。通用多线程架构位于更高的抽象层，提供用于并行算法开发和分析的通用抽象接口。此外，该接口的主要对象可以由占据三级架构中不同层级的对象实现（描述）。\n\
  \n## 9.3 随机机器学习的 信息技术\n\n信息技术包括计算机方法和工具，旨在用于数据存储、处理、提取和传输 [103]。问题涉及硬件工具（计算机、存储设备、电信设备）以及软件工具，如果它们构成具有必要用户功能的完整技术。硬件工具通常分为计算机硬件和通信硬件；软件工具分为系统软件和应用软件。根据这种结构分类，随机机器学习的\
  \ 信息技术占据应用软件层级。\n\n任何技术都旨在解决某些实际任务或问题。我们将以一般意义理解解决方案，因为在许多情况下初始问题与抽象主题领域相关。这种情况出现在基础研究中，因为主题领域大多由抽象框架定义（例如不同的数学构造）。预期结果——问题的解决方案——也必须属于同一主题领域。\n\
  \n信息技术实现的结果显然与计算机系统主题领域相关，代表该主题领域的产物。因此，旨在解决特定问题的 信息技术可以被视为对应主题领域的工具，在一方面补充基本工具，在另一方面为更高层技术形成中间层。\n\
  \n机器学习过程（见 第 1 章 和 图 1.3）可以描述为具有以下阶段的抽象技术：\n1. 参数化模型开发 (`PM`)；\n2. 参数估计 (`PE`)；\n\
  3. 模型测试 (`MT`)；\n4. 模型实现 (`MI`)。\n\n第二和第三阶段共同构成 *模型学习 (`ML`)*。\n\n该技术基于上述引入的抽象数学方法，它们是基本工具。因此，数学工具与抽象技术阶段之间存在对应关系，如\
  \ 图 9.5 所示。在数学工具层级，`PM` 阶段与前面讨论的数学建模方法相关联。模型学习阶段通过陈述相应的优化问题来实现。根据图表，模型实现阶段在数学工具中没有对应物。此外，还要注意，对于实际问题，结果优化问题无法解析求解，唯一的选择在于数值求解。\n\
  \n![图 9.5](img/fig9_5.jpg)\n\n图 9.5\n\n这些问题的解决属于计算机（信息）技术主题领域，该领域补充了解决初始问题所需的工具。特别是，它们实现了模型学习和实现的阶段。\n\
  \n考虑这些工具的详细情况，如 图 9.6 所示。所研究技术的元素通过执行环境的程序对象实现，取决于当前或目标计算机系统的架构。现代计算机系统可用的具体技术种类繁多。因此，这里采用最大可能抽象其具体细节的方法似乎最有成效。\n\
  \n![图 9.6](img/fig9_6.jpg)\n\n图 9.6\n\n**1. 模型开发 (`MD`)**\n\n该模块根据对建模现象的现有认识构建参数化模型。如前所述，为了成功解决实际问题，可以勾勒出模型类型的狭窄范围。该模块输出已开发的模型\
  \ (`M`)。\n\n**2. 模型学习 (`ML`)**\n\n模型学习模块接收模型 `M` 作为其输入数据。该模块的主要任务是估计模型参数（模块 `PE`）并测试模型本身（模块\
  \ `MT`）。两个模块都使用数据 (`D`) 操作，这些数据在技术实现阶段以计算机形式表示，可以分为学习数据 (`LD`) 和测试数据 (`TD`)。该模块输出最优\
  \ PDFs (`F`)，即模型参数的 PDFs `F[*P*]` 和测量噪声的 PDFs `F[*Q*]`。\n\n\n\n\n\n`ML` 块由于其任务而“负载”最重，首先是求解优化问题。我们已在本书前几章中讨论了该问题的固有困难。因此，`ML`\
  \ 块必须包含高效的全局优化算法或能够访问这些算法。\n\n### 3. 模型实现 (MI)\n\n模型实现块产生一个学习后的模型，即配备了前一阶段计算得到的函数\
  \ `F[*P*]` 和 `F[*Q*]` 的模型 `M`。模型实现包括生成输出集合（`EG` 块），并在集合分析（`EA`）块中进一步计算其特征。对于模型实现和测试（见前一阶段），集合是通过产生大量随机变量的实现（采样）而生成的，其\
  \ `PDFs` 已给定。因此，这些块必须能够访问具有任意 `PDFs` 的随机变量的相应生成算法。\n\n所描述的 `RML` 技术可以以独立的程序模块的形式实现，这些模块以手动模式相互通信或通过更大规模的技术进行通信。此类技术是在为解决特定实际任务而设计的信息系统中实现的。对与信息系统架构相关的所有问题的全面处理超出了本书的范围。我们只会讨论一些理论方面，并以最一般的形式考虑它们。\n\
  \n信息系统（`IS`）通常被定义为集成不同资源（人力、技术、财务）并用于数据存储、检索和处理的系统 [3, 39]。信息系统的主要组成部分在于软件资源，其可通过类比于计算机系统的架构进行分类。由于系统级软件已标准化且广泛使用，`IS`\
  \ 中受其任务影响的最重要部分作为应用软件在用户级实现。请注意，用户将以抽象意义来理解，因为信息系统可以由人类或其他系统使用。这种方法在程序系统设计和开发中是常规的\
  \ [59, 78]。\n\n用户通过用户界面与 `IS` 交互（见 Fig. 9.7），该界面将相应地以抽象意义来考虑。该界面确定了系统用户可接受的操作集合，即代表了给定系统的抽象“控制面板”。因此，系统功能与控制功能在逻辑层面上分离，并且通常在物理层面上分离。\n\
  \n![Figure 9.7](img/fig9_7.jpg)\n\nFigure 9.7\n\n用户界面控制程序系统，并显然以所需的用户友好形式展示操作结果。再次，我们将坚持以下抽象考虑。如果用户是人类，则用户友好的界面由图像、图表、数字以适当方式显示组成；这也适用于“控制面板”，它们现在例如通过窗口界面组织，具有诸如推送按钮、复选框、输入字段等控制元素。对于外部系统，不需要窗口界面，但我们仍然具有与人类用户相同的原则：数据以外部系统输入规范所规定的形式表示，控制通过两侧控制元素的链接来实现。\n\
  \n在所述方法下，有必要在逻辑上（并且通常在物理上）将系统的功能分离为松散耦合的模块，以获得更高的可靠性并降低程序系统设计的复杂性。存在几种解决此问题的有效方法，例如\
  \ Model-View-Controller (`MVC`) 设计。这种软件架构模式识别了通过相应接口通信的三个抽象子系统（组件），即 Model、View\
  \ 和 Controller [99]；见 Fig. 9.7 中的图表。这里的主要思想是用户通过 Controller 提供的功能控制程序系统，并通过 View\
  \ 读取有关系统操作的信息。该架构模式意味着信息表示（视图）和控制设备可能存在多重性，取决于问题的具体性。程序系统的概念功能主要集中在 Model 中。\n\n\
  所述的一般方案在几乎所有与程序系统相关的领域中占主导地位。由于其抽象性，它可以在任何计算机系统上使用软件技术实现。\n\n该方法的一个显著特征是其对系统组件的普遍性。换句话说，该方法对整个系统有效，也对只要以智能方式设计和实现就对其组件有效。特别地，作为程序组件实现的\
  \ `RML` 技术可以成为更大系统的组件，通过其控制和视图子系统的接口集成到后者中。\n\n最一般地说，`RML` 组件可以表示为一个对象，其在输入端接收数据和“知识”，然后实现随机化模型（`RM`）。在此上下文中，所有提到的事物都被视为相应抽象对象的程序实现：知识被封装到模型对象中（见\
  \ Fig. 9.6），而随机化模型则封装到学习模型对象中，其中最优 `PDFs` 由 `RML` 程序组件定义。\n\n对于 Fig. 9.6 中 `RML`\
  \ 技术的结构图，最耗资源的运算是\n\n* 优化；\n* 生成具有给定 `PDFs` 的随机变量；\n* 随机化模型的输出集合分析。\n\n因此，这些运算应使用具有并行计算潜力的高性能计算机系统实现。尽管它们可能由于计算机系统的架构特性而存在结构差异，这决定了用户对其操作的通用方法。我们将相应地分离出计算机系统的基本配置如下：\n\
  \n* 工作站，配备单个多核中央处理器和单个大规模并行加速器（在现代条件下，为图形适配器）；\n* 多处理器计算模块或若干此类模块，每个模块包含若干中央处理器并且可能包含若干加速器；\n\
  * 超级计算机级的计算机系统，包含数千或数万个计算模块。\n\n这种方法导致了为不同计算机系统配置实现程序模块以实现并行计算潜力的实现问题（见 Fig. 9.8）。通用多线程架构作为解决这些问题的有效算法的基础；此外，在使用系统级软件技术进行智能实现时，它将降低此类算法及相关技术的程序复杂性。\n\
  \n![Figure 9.8](img/fig9_8.jpg)\n\nFigure 9.8\n\n## 9.4 包迭代的实现\n\n如前所述，实现 `RML`\
  \ 技术的主要困难是为随机化模型的熵最优 `PDFs` 求解全局优化问题。考虑 Chapter 6 中所述的全局优化方法的一些一般实现方面。\n\n\n\n\n\
  \n数据包迭代方法需要大量的计算。然而，它们是相似的并且涉及非常多的*数据元素*，对于这些数据元素，需要计算特定函数的值。因此，*数据并行*在这里似乎很自然。我们的想法是根据\
  \ `UMA` 为每个数据元素使用虚拟线程来实现计算。\n\n算法每个阶段中的数据元素通过不同的对象实现。在生成阶段，它们具有随机点的序列号（索引）；在过滤和选择阶段，数据元素就是这些点本身（见\
  \ Fig. 9.9）。\n\n![Figure 9.9](img/fig9_9.jpg)\n\nFigure 9.9\n\n在特定设备上实现算法时，可以以不同的方式将虚拟线程映射到硬件线程；其中一些在\
  \ Fig. 9.9 中进行了说明。映射过程包括在计算机系统的实际系统级对象中实现虚拟线程，即线程和进程。存在不同的实现方法，例如，“手动”控制此过程涉及虚拟线程到真实线程的期望映射的一些特征。另一种方法采用自动映射，该映射由系统级软件或实现算法的中间用户级软件执行。\n\
  \n通用处理器支持少量线程；在这种情况下，虚拟线程在真实线程中的执行（通过以进程或线程的形式实现）可以按组组织，以便每个组的虚拟线程按顺序执行。大规模并行加速器支持同时执行数百个线程，但虚拟线程映射到加速器的真实线程的方式类似，尽管其数量极高。在实践中，映射机制完全自动化，线程调度由计算机系统的系统级软件执行。\n\
  \n在多线程方法下，全局优化算法涉及与算法每个阶段中数据元素数量相对应的非常多的虚拟线程。该算法已成功在 `OpenMP` 和 `CUDA` 平台上实现，这证明了该方法的效率。值得注意的是，其主要优势在于良好的可扩展性。\n\
  \n# 第 10 章 熵分类\n\nDOI: [10.1201/9781003306566-10](https://doi.org/10.1201/9781003306566-10)\n\
  \n分类构成了机器学习和数据分析中的一个核心问题。对象通过根据其特征（属性）将其与两类或若干类别之一关联来进行分类。二元（二分类）分类问题作为进一步推广到实际应用中若干类的基本陈述而存在。\n\
  \n本章致力于在随机化机器学习框架内解决二元分类问题。我们将简要回顾现有的分类方法（以及它们的一些缺点），然后详细描述熵分类方法，特别是该方法的应用，并给出一系列数值示例。\n\
  \n## 10.1 标准分类方法\n\n对象分类是一个具有“学习者”的学习问题。换句话说，存在一个带有标记答案的学习样本，算法利用它来识别最重要的属性并将其值与适当的类别关联。\n\
  \n分类算法可能因其对学习样本的处理、分类错误的表示、收敛速度等而有所不同。在本节中，我们将概述最广泛的分类算法，即\n\n*   决策树 (`DT`)；\n\
  *   `k`-最近邻 (`kNN`)；\n*   朴素贝叶斯；\n*   线性分类器（逻辑回归、支持向量机等）。\n\n感兴趣的读者可以在机器学习的经典书籍中找到有关这些和其他分类方法的更多信息，例如\
  \ \\10, [118, 180, 194\\] 为俄文和 \\[21, 57\\] 为英文。\n\n### 10.1.1 决策树\n\n决策树是对象属性值的分支层次结构。分支在属性值的进一步分组不再细化信息时停止，即不产生不同类别。因此，最终每个决策树的最后一层上的每个叶都包含同一类别的成员。\n\
  \n决策树的概念由 Breiman 及其同事开创 \\[23\\]。随着时间的推移，原算法不断发展和修改。如今，决策树是世界上最流行的分类方法，其修改版 `C4.5`\
  \ 在十大数据分析算法中排名第一 \\[193\\]。\n\n对于决策树设计，主要困难是选择适当的分支准则，即应考虑属性的顺序。由于最优决策树设计是一个 `NP-complete`\
  \ 问题 \\[75\\]，分支准则通常基于“贪婪”启发式，例如信息增益 \\[117\\] 和基尼不纯度 \\[23, 57\\]。\n\n决策树具有清晰的含义和结果的简单解释。此外，它们不需要特殊的数据准备，并且可以在没有辅助工具的情况下应用于大量数据。然而，决策树设计存在相当大的缺点如下。\n\
  \n首先，决策树可能因过度详细的划分而被重新学习。这种效应即使对于相对简单的问题也可能发生 \\[110\\]。其次，决策树设计对输入数据非常敏感：学习样本中的微小变化可能会极大地改变决策树的最终结构，尤其是在数据分散的情况下。\n\
  \n因此，决策树易于实现并且通常作为解决方案的粗略近似，但其他分类算法会产生更好的结果。\n\n### 10.1.2 `k`-最近邻\n\n事实上，`k`-最近邻\
  \ (`kNN`) 属于基于学习样本对象之间距离的度量分类器组。该方法采用以下思想：每个新对象都与邻居中最普遍的类别相关联。注意可以考虑一个或几个邻居（例如 `k`\
  \ 个邻居），权重相等或根据与被分类对象的距离而不同 \\[37, 194\\]。\n\n与其他度量分类器一样，`k`-最近邻基于紧凑性假设，该假设声称在适当选择的相似性度量下，相似的对象更倾向于同一类而不是不同类。也就是说，类在对象空间中形成紧凑的局部子集\
  \ \\[14\\]。\n\n在应用中，对象之间的距离通常定义为欧几里得距离，这对于数值属性具有高效率。另一方面，对于具有分类的（特别是二元的）属性的问题，`k`-最近邻可能比其他分类算法，例如决策树\
  \ \\[33\\] 的结果更差。\n\n\n\n\n\n限制该分类器适用性的另一个重要因素与维度灾难有关 [19]。如果一个问题具有高维，并且对象之间的距离被计算为所有属性上偏差的总和，那么根据大数定律，这些和值以高概率取接近的值。换句话说，在多维空间中所有对象几乎彼此之间的距离相同，这使得选择最优的邻居数\
  \ `k` 变得复杂。\n\n就收敛速度而言，`k`-Nearest Neighbor 仅对相对较小的样本表现出良好的结果。因为解基于最近邻的已知类别，所以对每个新对象进行分类时，有必要存储并计算该对象与学习样本中所有其他对象的距离，对于非常大的数据量（`N`\
  \ > > 10³）而言，这是一个极其困难的程序 [198]。\n\n因此，尽管具有直观的解释并且在数值属性空间中效率很高，`k`-Nearest Neighbor（以及其他度量分类器）只能用于狭窄范围的分类问题。\n\
  \n### 10.1.3 Naive Bayes\n\n朴素贝叶斯分类器（简称为 Naive Bayes 或 Simple Bayes）是基于著名的贝叶斯定理和后验概率最大化原理的贝叶斯分类器一般组中的一个特例\
  \ [10, 180]。对于每个待分类对象，首先需要计算每个可能类别上的似然函数。利用这些函数和不同类别代表出现的概率，下一步是计算类别本身的后验概率。最终，对象将被关联到具有最高后验概率的类别\
  \ [44, 57]。\n\n与之前考虑的算法不同，贝叶斯分类器允许构建一个概率模型 `p(c|x[1],x[2]…x[n])`，用于类别变量 `c`，该变量依赖于属性变量\
  \ `x[1]`, `x[2]`…`x[n]`。贝叶斯定理可以正式表述如下：\n\n$$\n\\begin{array}{r}\n\\left. p(c \\\
  middle| x_{1},x_{2}\\ldots x_{n}) = \\frac{\\left. p(c)p(x_{1},x_{2}\\ldots x_{n}\
  \ \\middle| c) \\right.}{p(x_{1},x_{2}\\ldots x_{n})}, \\right.\n\\\\\n\\end{array}\n\
  $$\n\n(10.1)\n\n其中分子 `p(c)p(x[1],x[2]…x[n]|c)` 给出模型 `p(c, x[1], x[2]…x[n])` 的联合概率；分母\
  \ `Z = p(x[1], x[2]…x[n])`，是一个与变量 `c` 无关的归一化常数。\n\nNaive Bayes 因其涉及对象属性独立性的假设而得名：在这种情况下，它们的联合概率可以写成所有分量的简单乘积。在该假设下，公式\
  \ (10.1) 简化为\n\n$$\n\\begin{array}{r}\n\\left. p(c \\middle| x_{1},x_{2}\\ldots\
  \ x_{n}) = \\frac{1}{Z}p(c){\\prod\\limits_{i = 1}^{n}p}(x_{i}). \\right.\n\\\\\n\
  \\end{array}\n$$\n\n(10.2)\n\nNaive Bayes 是一个分类规则，选择具有最大后验概率的类别，即\n\n$$\n\\begin{array}{r}\n\
  \\left. C_{naive} = \\arg\\max_{c}p(c \\middle| x_{1},x_{2}\\ldots x_{n}). \\right.\n\
  \\\\\n\\end{array}\n$$\n\n(10.3)\n\n因此，每个新对象都是利用整个学习样本的信息进行分类，更具体地说，是似然函数和类别的先验概率。然而，在实践中这些函数的解析形式通常是未知的，并且似然函数和类别概率是通过学习样本经验恢复的（请注意，一般情况下类别可能具有不同的概率）。\n\
  \n尽管偏离了最优贝叶斯分类器 [44] 并需要经验恢复函数，Naive Bayes 仍然是一种广泛且高效的分类算法，尽管它倾向于重新学习（尤其是对于小的学习样本）\
  \ [155]。\n\n### 10.1.4 Linear classifiers\n\n线性分类器是一种构建属性空间中线性分离面的分类算法。对于二维对象（二个属性）的二分类，分离面表示一条线；对于三维对象，表示一个平面；在一般情况下，表示一个超曲面\
  \ [57, 180]。\n\n设来自集合 `X` 的对象由数值属性 `f[j]:X→R`，`j=1,… ,n`，在空间 `R^(n)` 中描述。用 `Y =\
  \ {-1,1}` 表示二分类情况下的类别标签集合。那么线性分类器是一个分类算法 `a:X→Y`，形式为\n\n$$\n\\begin{array}{r}\n\
  {a(x,w) = sign\\left( {{\\sum\\limits_{j = 1}^{n}w_{j}}f_{j}(x) - w_{0}} \\right)\
  \ = sign{< {x,w} >},}\n\\\\\n\\end{array}\n$$\n\n(10.4)\n\n其中 `< x, w >` 给出对象属性描述与权重向量\
  \ `w = (w[0], w[1], …, w[n])` 的标量积。\n\n相应地，机器学习的主要目标是“调整”权重向量：给定学习样本 `X^(m) = {(x[1],y[1]),…,(x[m],y[m])}`，需要构造上述形式的算法，使其最小化经验风险泛函\n\
  \n$$\n\\begin{array}{r}\n\\left. Q(w) = {\\sum\\limits_{i = 1}^{m}\\left[\\lbrack\
  \ {a(x_{i},w) \\neq y_{i}} \\right\\rbrack}\\rightarrow min_{w}. \\right.\n\\\\\n\
  \\end{array}\n$$\n\n(10.5)\n\n为了解决优化问题 (10.5)，引入间隔\n\n$$\n\\begin{array}{r}\n{M(x_{i})\
  \ = y_{i}{< {x_{i},w} >}.}\n\\\\\n\\end{array}\n$$\n\n(10.6)\n\n这是一个数值，表示对象浸入对应类别的程度。`M(x[i])`\
  \ 的值越小，对象 `x[i]` 越接近类别的分离面，因而分类错误的概率越高。由于间隔 `M(x[i])` 仅在错误情况下取负值，经验风险泛函可以写成\n\n\
  $$\n\\begin{array}{r}\n{Q(w) = {\\sum\\limits_{i = 1}^{m}\\left\\lbrack {M(x_{i})\
  \ < 0} \\right\\rbrack}.}\n\\\\\n\\end{array}\n$$\n\n(10.7)\n\n因此，为了解决问题 (10.5)，我们必须在给定的不等式系统中找到最大可行子系统。该问题是\
  \ NP-完全的，并且可能存在无限多个解，因为即使最小数量的错误也可以在不同的对象子集上实现。然而，在大多数应用中，获得该问题的精确解（更不用说所有解）并无实际意义。为了正确学习分类器，获得足够接近精确值的近似解就足够了\
  \ [[187]。\n\n对于粗略解，阈值损失函数被不同连续近似所取代\n\n$$\n\\begin{array}{r}\n{\\left\\lbrack {M\
  \ < 0} \\right\\rbrack \\leq L(M),}\n\\\\\n\\end{array}\n$$\n\n(10.8)\n\n随后最小化经验风险泛函的上界，即\n\
  \n$$\n\\begin{array}{r}\n{Q(w) \\leq \\widetilde{Q}(w) = {\\sum\\limits_{i = 1}^{m}L}\\\
  left( {M(x_{i}) < 0} \\right).}\n\\\\\n\\end{array}\n$$\n\n(10.9)\n\n引入损失函数的连续近似后，我们可以采用众所周知的数值优化方法，如梯度下降和凸规划技术，这大大加快了学习过程。此外，在一系列情况下，通过连续近似可以提高线性分类器的泛化能力\
  \ [[105]。\n\n让我们提及常见的近似函数 `L(M)` 及其相关方法。\n\n* **Fisher's Linear Discriminant** 是一种二次近似，形式为\n\
  \n$$\n\\begin{array}{r}\n{L(M) = {(1 - M)}^{2}.}\n\\\\\n\\end{array}\n$$\n\n(10.10)\n\
  \n在从每个对象的属性向量中减去对应类别的中心向量条件下使用 [52]。\n\n\n\n\n\n### 单层感知器\n`Single-Layer Perceptron`\
  \ 是由 sigmoid 函数近似得到的\n\n$$\n\\begin{array}{r} {L(M) = \\frac{2}{1 + e^{\\alpha M}}.}\
  \ \\\\ \\end{array}\n$$\n\n(10.11)\n\n常用于神经网络，但需要额外的启发式方法以避免重新学习 \\[122, 187\\]。\n\
  \n### 逻辑回归\n`Logistic Regression` 是如下形式的对数近似\n\n$$\n\\begin{array}{r} {L(M) = \\\
  log(1 + e^{- M}).} \\\\ \\end{array}\n$$\n\n(10.12)\n\n允许计算属于不同类别的概率。在类别似然函数上做出相当强的假设下，使用该损失函数的经验风险最小化等价于似然最大化\
  \ \\[73, 187\\]。\n\n### 支持向量机\n`Support Vector Machines` 是如下形式的分段线性近似\n\n$$\n\\\
  begin{array}{r} {L(M) = \\left( {1 - M} \\right)_{+}.} \\\\ \\end{array}\n$$\n\n\
  (10.13)\n\n与二次正则化一起使用。相应的优化问题由特殊的二次规划方法求解 \\[57, 180\\]。\n\n### 指数近似\n`Exponential\
  \ Approximation` 由下式给出\n\n$$\n\\begin{array}{r} {L(M) = \\exp( - M).} \\\\ \\end{array}\n\
  $$\n\n(10.14)\n\n用于提升算法，例如 AdaBoost \\[56\\]。受大负边际的强调影响，即对数据离散具有很强的敏感性。\n\n## 10.2\
  \ 组合算法\n\n正如机器学习学科受应用发展的证明，仍然没有一种唯一的分类算法能够对任何大小的学习样本、属性空间的任何维度和分离面的任何形式都产生最佳结果。这一结论推动了集成机器学习方法领域的研究，也称为组合算法。\n\
  \n组合算法的核心思想是将若干基本分类器的预测联合起来，每个分类器都是使用可用的学习样本构建的 \\[163\\]。也许，这一方法的第一个例子是 Condorcet\
  \ 陪审团定理（1784 年），其陈述如下：由陪审团进行的基于多数投票的正确决策的概率，其中每个陪审员都有独立的意见，并且以大于 0.5 的概率选择正确结果，随着陪审员数量的增加而增加并趋于\
  \ 1。\n\n集成方法的另一个例子是群体智慧（1906 年），该原则由 F. Galton 在以下竞赛中发现。县集市上近 800 人的群体在将他们的个人猜测平均后准确猜出了牛的重量。平均值比大多数人群成员的估计更接近牛的真实屠宰重量。\n\
  \n考虑用于构建分类问题的组合算法的最广泛方法，即 bagging \\[22\\] stacking \\[192\\] 和 boosting \\[56\\\
  ]。\n\n### 10.2.1 Bagging\n\nBagging（自助聚合）的思想是通过生成新的随机数据数组集合来复制一个小的学习样本以供进一步学习。然后每个样本用于学习多个独立分类器，并将结果聚合以获得最终的高精度预测。\n\
  \nBagging 算法可能在用于生成子样本的方法以及用于聚合或加权基本分类器结果的方法上有所不同。传统的聚合方法包括简单多数投票、均值和中值、用于提取高精度分类器的加权平均等\
  \ \\[79\\]。\n\nBagging 的必要前提是选择具有不相关误差的不同基本分类器。在这种情况下，基本分类器的误差相互补偿，从而产生更好的预测 \\\
  [22\\]。\n\n在此背景下，还请注意随机子空间方法（RSM）\\[163\\]，它与标准 bagging 的不同之处在于以下特征：随机样本也是使用来自对象属性描述的随机子集生成的。该方法在冗余的虚假属性和相对较小的学习样本大小下具有高效率。\n\
  \n### 10.2.2 Stacking\n\nStacking 的概念进一步发展了聚合泛化的思想，用于基本分类器产生的结果，但使用在它们的预测上学习的单独辅助模型。\n\
  \n通常，对于 stacking，学习样本被分为两个子样本，第一个用于学习独立的基本分类器，而第二个用于测试它们。之后，基本分类器的预测和真实答案被用作学习元分类模型输入数据\
  \ \\[192\\]。\n\n在 stacking 的优点中，我们提到可以设计基本分类器的非线性组合以实现高精度预测。\n\n### 10.2.3 Boosting\n\
  \nBoosting 是通过使用初始样本构建加权学习子样本来对基本分类器的组合进行迭代顺序改进的程序。在每次新迭代中，对先前组合产生错误结果的复制赋予更高的权重。因此，算法强调学习样本中最困难的复制。\n\
  \nBoosting 概念也采用基本分类器，但与 bagging 不同，在每次连续迭代中，学习样本由前几次迭代的分类结果定义（而不是随机）。这种方法即使使用弱基本分类器也证明更有效\
  \ \\[25\\]。\n\n由于实现简单、通用性强、尤其是泛化能力好，提升算法仍然是最流行的机器学习方法之一，与支持向量机（SVM）和神经网络一起。提升的缺点是传统上对学习样本大小（10⁴–10⁶\
  \ 复制）有严格要求 \\[187\\]。\n\n## 10.3 熵分类\n\n现在让我们描述熵鲁棒的分类器学习方法。这种方法与传统的机器学习问题在优化表述上有所不同，并且成功地结合了经典的个体分类器和集成方法的优点。\n\
  \n### 10.3.1 问题表述\n\n考虑一组待分配到两个类别的对象。将所有可用数据分为两个样本，即学习样本 `ℰ` = {*e*[1],…,*e*[*h*]}\
  \ 和测试样本 `\U0001D4AF` = {*t*[1],…*t*[*r*]}。这些样本（子集合）中对象的百分比将在下面讨论。\n\n两个子集合中的对象都有向量表示；对于每个对象，对应向量的元素是表征它的变量-属性，即\n\
  \n$$\n\\begin{array}{r} {\\mathcal{E} = \\left\\{ \\mathbf{e}^{(1)},\\ldots,\\mathbf{e}^{(h)}\
  \ \\right\\},\\quad\\quad\\mathcal{T} = \\left\\{ \\mathbf{t}^{(1)},\\ldots,\\mathbf{t}^{(r)}\
  \ \\right\\}.} \\\\ \\end{array}\n$$\n\n(10.15)\n\n我们的分析将仅限于定量属性，但建议的方法可以扩展到分类属性的情况。\n\
  \n两个子集合的向量具有相同的维度：(`e`^((*i*)), `t`^((*j*))) ∈ `R`^(*n*)。子集合 `ℰ` 用于学习，而子集合 `\U0001D4AF\
  ` 用于测试。\n\n两个子集合中的对象根据其所属的适当类别进行标记：如果对象 `e`[*l*] 或 `t`[*k*] 是第一类（第二类）的成员，则它具有标签\
  \ 1（标签 0，分别）。因此，学习子集合由答案向量 `y` = {*y*[1],…,*y*[*h*]} 刻画，由一和零组成；测试子集合由答案向量 `z` =\
  \ {*z*[1],…,*z*[*r*]} 刻画。这些向量中元素的索引对应于学习和测试样本中对象的索引。\n\n\n\n\n\n分类器学习问题是设计一个算法 `a`:ℰ→`y`，该算法基于学习样本，利用对象的属性描述来恢复对象的类别。\n\
  \n### 10.3.2 学习阶段\n\n由于学习子集的存在，我们可以假设存在一个函数（某种决策规则）`F`:ℰ→**y**。学习问题在于选择近似函数 `F̂`(**a**)\
  \ 的适当形式和参数。函数 `F̂`(**a**) 表示决策规则模型。\n\n遵循熵分类概念，决策规则由随机化参数模型（RPM）描述，即具有随机化参数 **a**\
  \ 的模型。它具有输入向量 {**e**^((1)),…,**e**^((*h*))} 和输出 $\\hat{\\mathbf{y}}(\\mathbf{a})$，该输出取决于随机化参数\
  \ **a**。\n\n作为此类模型选择单层感知器 [63]，即\n\n$$\n\\begin{array}{r} {{\\hat{y}}^{(i)}(\\mathbf{a})\
  \ = \\text{sigm}\\,\\left( \\left\\langle \\mathbf{e}^{(i)},\\mathbf{a} \\right\\\
  rangle \\right),\\text{\\quad\\quad}i = \\overline{1,n},} \\\\ \\end{array}\n$$\n\
  \n(10.16)\n\n其中\n\n$$\n\\begin{aligned} {\\text{sigm}(x_{i})} & {= \\frac{1}{1 +\
  \ \\exp\\lbrack - \\alpha(x_{i} - \\Delta)\\rbrack},} \\\\ x_{i} & {= \\left( \\\
  left\\langle \\mathbf{e}^{(i)},\\mathbf{b} \\right\\rangle \\right),} \\\\ \\mathbf{a}\
  \ & {= \\left\\{ \\mathbf{b},\\alpha,\\Delta \\right\\}.} \\\\ \\end{aligned}\n\
  $$\n\n(10.17)\n\n具有斜率 *α* 和阈值 Δ 参数的 Sigmoid 函数的图像显示在 Fig. 10.1 中。函数 sigm(*x*) 在区间\
  \ [1/2, 1] 内的值对应于第一类；在区间 0, 1/2) 内对应于第二类。\n\n![Figure 10.1: Structure of single-layer\
  \ neural network.\n\nFigure 10.1: Structure of single-layer neural network.\n\n\
  在随机化模型 (10.16, 10.17) 中，参数 **a** = {*a*[1],…,*a*[(*n* + 2)]} 为区间类型，其概率特性由集合 \U0001D49C\
  \ 上的联合概率密度函数 `P`(**a**) 刻画，即\n\n$$\n\\begin{aligned} a_{k} & {\\in \\mathcal{A}_{k}\
  \ = \\lbrack a_{k}^{-},a_{k}^{+}\\rbrack,\\text{\\quad\\quad}k = \\overline{1,n+2},}\
  \ \\\\ \\mathcal{A} & {= \\otimes_{k = 1}^{n + 2}\\mathcal{A}_{k}.} \\\\ \\end{aligned}\n\
  $$\n\n(10.18)\n\n由于参数 **a** 具有随机性，对于每个对象 *e*[*i*] 存在随机数 *ŷ*^((*i*))(**a**) 的集合\
  \ ${\\hat{\\mathcal{Y}}}^{(i)}$，其来自区间 [0,1]。将其均值定义为\n\n$$\n\\begin{array}{r} {\\\
  mathcal{M}\\left\\{ {\\hat{y}}^{i}(\\mathbf{a}) \\right\\} = {\\int_{\\mathcal{A}}P}(\\\
  mathbf{a})\\text{sigm}\\,\\left( \\left\\langle \\mathbf{e}^{(i)},\\mathbf{a} \\\
  right\\rangle \\right)d\\mathbf{a},\\text{\\quad\\quad}i = \\overline{1,h}.} \\\\\
  \ \\end{array}\n$$\n\n(10.19)\n\n因此，根据一般的 RML 过程 [144, 150]，分类问题可写为如下形式：\n\n$$\n\
  \\begin{array}{r} \\left. \\mathcal{H}\\lbrack P(\\mathbf{a})\\rbrack = - {\\int_{\\\
  mathcal{A}}P}(\\mathbf{a})\\,\\ln P(\\mathbf{a})d\\mathbf{a}\\Rightarrow\\max \\\
  right. \\\\ \\end{array}\n$$\n\n(10.20)\n\n受约束于\n\n* PDF 归一化条件\n\n$$\n\\begin{array}{r}\
  \ {{\\int_{\\mathcal{A}}P}(\\mathbf{a})d\\mathbf{a} = 1} \\\\ \\end{array}\n$$\n\
  \n(10.21)\n\n和\n\n* 输出平衡约束\n\n$$\n\\begin{array}{r} {{\\int_{\\mathcal{A}}P}(\\\
  mathbf{a})\\text{sigm}\\,\\left( \\left\\langle \\mathbf{e}^{(i)},\\mathbf{a} \\\
  right\\rangle \\right)d\\mathbf{a} = y_{i},\\text{\\quad\\quad}i = \\overline{1,h},}\
  \ \\\\ \\end{array}\n$$\n\n(10.22)\n\n其中 `P`(**a**) 属于所有连续可微函数类 ℂ¹。\n\n方程 (10.20–10.22)\
  \ 构成了一个函数熵-线性规划问题，其具有解析解——熵最优 PDF `P*`(**a** | *θ*)，由拉格朗日乘子 *θ* 参数化，即\n\n$$\n\\\
  begin{array}{r} \\left. P^{\\*}(\\mathbf{a}\\, \\middle| \\,\\theta) = \\frac{\\\
  exp\\left\\lbrack {- {\\sum\\limits_{i = 1}^{h}\\theta_{i}}{\\hat{y}}^{(i)}(\\mathbf{a})}\
  \ \\right\\rbrack}{\\mathcal{P}(\\theta)}, \\right. \\\\ \\end{array}\n$$\n\n(10.23)\n\
  \n其中 *ŷ*^((*i*))(**a**) 由 (10.2) 给出，且\n\n$$\n\\begin{array}{r} {\\mathcal{P}(\\\
  theta) = {\\int_{\\mathcal{A}}\\exp}\\left\\lbrack {- {\\sum\\limits_{i = 1}^{h}\\\
  theta_{i}}{\\hat{y}}^{(i)}(\\mathbf{a})} \\right\\rbrack.} \\\\ \\end{array}\n$$\n\
  \n(10.24)\n\n拉格朗日乘子由平衡约束 (10.22) 计算得出。这里一种可能的方法是采用 *L*²\\-norm 最小化方程 (10.22) 的一般残差函数。\n\
  \n### 10.3.3 测试阶段\n\n该阶段利用测试子集 \U0001D4AF，其对象由答案向量 **z** = {*z*[1],…,*z*[*r*]} 刻画，具有已知的分类（其属于第一类或第二类）。向量\
  \ **z** 将用于测试过程的质量评估。后者本身涉及子集 \U0001D4AF 以及学习阶段得到的决策规则模型。\n\n需要根据公式 (10.23, 10.24)\
  \ 测试具有模型参数熵最优 PDF 的随机化决策规则 (10.16, 10.17)。该过程执行大小为 *N* 的蒙特卡洛模拟序列，在每次模拟中生成一个服从熵最优\
  \ PDF `P*`(**a**) 的随机向量 **a**。\n\n假设作为此类模拟的结果，测试子集中第一个对象被分配 *N*[1] 次到第一类和 *N* − *N*[1]\
  \ 次到第二类，…，第 *k* 个对象被分配 *N*[*k*] 次到第一类和 *N* − *N*[*k*] 次到第二类，依此类推。在足够多的模拟次数下，定义经验概率\n\
  \n$$\n\\begin{aligned} p_{1}^{(1)} & {= \\frac{N_{1}}{N},\\ldots,p_{1}^{(k)} = \\\
  frac{N_{k}}{N},\\ldots,...} \\\\ p_{2}^{(1)} & {= \\frac{N - N_{1}}{N},\\ldots,p_{2}^{(k)}\
  \ = \\frac{N - N_{k}}{N},\\ldots,...} \\\\ \\end{aligned}\n$$\n\n(10.25)\n\n因此，对于测试样本中的每个对象\
  \ *i*，测试算法可以写成以下形式。\n\n*Step 1-i.* 按照最优 PDF，生成熵最优决策规则模型 (10.23, 10.24) 的输出值集合，其中包含\
  \ *N* 个来自区间 {0,1} 的随机数。\n\n*Step 2-i.* 对于模型的每一次实现（即对于大小为 *N* 的集合中的每个参数向量），使用公式 (10.16,\
  \ 10.17) 计算决策规则值。如果所得值超过 1/2，则对象 `t`^((*i*)) 被分配到第一类；否则分配到第二类。\n\n*Step 3-i.* 根据公式\
  \ (10.25) 求出属于这些类的经验概率。\n\n通过此过程，每个对象可以以一定的概率被分配到两个类之一，这反映了可用数据以及近似决策规则模型的固有不确定性。\n\
  \n请注意，通常学习和测试子集的对象被视为独立的复制品。在此假设下，Step 1-i 可以组织为一个共同的预处理程序来生成一组随机变量，该变量将以相同的方式用于所有测试对象。\n\
  \n可以通过引入一个阈值概率来进行硬分类转换，当对象被分配到相应类时的概率超过该阈值。用于正确硬分类的对象数量取决于该阈值。如易证实，对于超过 0.5 的阈值，一些对象未被分类，但分类结果具有更高的可靠性。另一方面，对于小于\
  \ 0.5 的阈值，所有对象都被分类（因为两个概率之和为 1），但结果可能类似于猜测，如果所属概率彼此接近。\n\n\n\n\n\n### 10.3.4 数值示例\n\
  \n#### 1. 四维对象的分类\n\n考虑由四个属性表征的对象，即向量 `e` 和 `t` 的元素。\n\n设学习样本由三个对象组成，每个对象由四个属性描述（见\
  \ 表 10.1）。\n\n表 10.1\n\n|  |\n| --- |\n| *i* || `e[1]^{(i)}` || `e[2]^{(i)}` ||\
  \ `e[3]^{(i)}` || `e[4]^{(i)}` |\n|  |\n| --- |\n| 1 || 0.11 || 0.75 || 0.08 ||\
  \ 0.21 |\n| 2 || 0.91 || 0.65 || 0.11 || 0.81 |\n| 3 || 0.57 || 0.17 || 0.31 ||\
  \ 0.91 |\n|  |\n\n随机决策规则模型 (10.16, 10.17) 的参数为 `α` = 1.0 和 `Δ` = 0。学习答案向量为 `y` =\
  \ {0.18; 0.81; 0.43}（同前，`y[i]` < 0.5 对应第二类，`y[i]` ≥ 0.5 对应第一类）。熵最优 PDF (10.23) 的拉格朗日乘子取值为\
  \ `${\\overline{\\theta}}^{*} = \\left\\{ 0.2524;\\, 1.7678;\\, 1.6563 \\right\\\
  }.$` 参数属于区间 `a_i ∈ [ - 10,10], i = \\overline{1,4}.`\n\n对于此学习子集，熵最优 PDF 的形式为\n\n\
  $$\n\\begin{aligned}\n& {\\quad P^{*}(\\mathbf{a},\\overline{\\theta}) = \\frac{\\\
  exp\\left( {- {\\sum\\limits_{i = 1}^{3}\\theta_{i}}y_{i}(\\mathbf{a})} \\right)}{\\\
  mathcal{P}(\\overline{\\theta})},} \\\\\n& {y_{i}(\\mathbf{a}) = \\left( {1 + \\\
  exp( - {\\sum\\limits_{k = 1}^{4}e_{k}^{(i)},a_{k})} \\right)^{( - 1)}.} \\\\\n\\\
  end{aligned}\n$$\n\n(10.26)\n\nPDF `P*(a, \\overline{\\theta}*)` 在第三和第四维度固定值下的二维截面在\
  \ 图 10.2 中示出。\n\n![Figure 10.2: Two-dimensional cutset of entropy-optimal PDF P^{*}(\\\
  mathbf{a},{\\overline{\\theta}}^{*}).](img/fig10_2.jpg)\n\n图 10.2： 熵最优 PDF $P^{*}(\\\
  mathbf{a},{\\overline{\\theta}}^{*})$ 的二维截面。\n\n让我们演示如何使用已学习模型为新对象获得预测。在此阶段，利用对象子集\
  \ `\U0001D54B` = {`t[1]`,…,`t[r]`}，其中每个元素由向量 `t^{(j)}` ∈ `R^{(4)}` 表征。首先生成一个由 (500\
  \ × 4) 维度的四维随机向量 `t^{(i)}, i = \\overline{1,500},` 组成的数组，其元素在区间 [0, 1] 上独立均匀分布。然后应用测试阶段小节中描述的分类算法。\n\
  \n对象 `t[i]` 属于第一类和第二类的经验概率 `p[1]^{(i)}`、`p[2]^{(i)}` 在 图 10.3 中给出。\n\n![Figure 10.3:\
  \ Empirical probabilities of belonging to different classes for Example 1.](img/fig10_3.jpg)\n\
  \n图 10.3： 示例 1 中属于不同类的经验概率。\n\n对于每个复制体，软分类过程已分配对象属于第一类和第二类的概率。注意，对于每个对象，这些概率之和为\
  \ 1。\n\n进一步的决策制定（硬分类，即将每个对象分配到适当类）可以通过引入“可靠分类”的阈值来实现。例如，选择 0.75 的阈值；然后所有以高于 0.75\
  \ 的概率属于第一类的对象（或以低于 0.25 的概率属于第二类的对象）将被分配到前者类，具有一定的可靠性水平。\n\n可靠性水平针对每个新的分类问题单独指定。它是算法的超参数之一，通常使用交叉验证或滑动控制\
  \ [118, 187] 进行调整。\n\n#### 2. 二维对象的分类\n\n考虑二维随机对象分类的更直观示例。\n\n设来自示例 1 的学习样本对象的对象由其属性描述的前两个分量表征。学习样本由三个对象组成，每个对象由两个属性描述（见\
  \ 表 10.1）。参数 `α` 和 `Δ` 以及随机参数 `a` 的区间与示例 1 相同。\n\n求解方程组 (10.22) 并使用熵最优 PDF (10.23)\
  \ 得到拉格朗日乘子 `${\\overline{\\theta}}^{*} = \\left\\{ 9.6316, - 18.5996 \\right.$,\
  \ 16.7502}.` 对于此学习子集，熵最优 PDF `P*(a | \\overline{\\theta})` 的形式为\n\n$$\n\\begin{aligned}\n\
  & {\\quad P^{*}(\\mathbf{a}) = \\frac{\\exp\\left( {- {\\sum\\limits_{i = 1}^{3}\\\
  theta_{i}}y_{i}(\\mathbf{a})} \\right)}{\\mathcal{P}(\\overline{\\theta})},} \\\\\
  \n& {y_{i}(\\mathbf{a}) = \\left( {1 + \\exp( - {\\sum\\limits_{k = 1}^{2}e}{(i)}_{k},a_{k})}\
  \ \\right)^{( - 1)}.} \\\\\n\\end{aligned}\n$$\n\n(10.27)\n\n熵最优 PDF `P*(a, \\overline{\\\
  theta}*)` 在 图 10.4 中示出。\n\n![Figure 10.4: Two-dimensional entropy-optimal PDF P^{*}(\\\
  mathbf{a},{\\overline{\\theta}}^{*}).](img/fig10_4.jpg)\n\n图 10.4： 二维熵最优 PDF $P^{*}(\\\
  mathbf{a},{\\overline{\\theta}}^{*})$。\n\n与示例 1 类似，使用 500 个随机对象的样本，由二维向量描述，在区间 [0,\
  \ 1] 上具有独立均匀分布。其他参数与示例 1 相同。对象 `t[i]` 属于第一类和第二类的经验概率 `p[1]^{(i)}`、`p[2]^{(i)}` 在\
  \ 图 10.5 中给出。\n\n![Figure 10.5: Empirical probabilities of belonging to different\
  \ classes for Example 2.](img/fig10_5.jpg)\n\n图 10.5： 示例 2 中属于不同类的经验概率。\n\n与示例 1\
  \ 类似，图 10.5 中的图具有经验归属概率的相当大的离散。这是由故意较小的学习样本大小引起的。然而，这些结果比随机猜测要好得多。\n\n为此，将所有待分类的随机对象放在同一图表上，并为其硬分类选择可靠性水平。红色将用于所有与第一类相关的对象，绿色将用于与第二类相关的对象。此外，颜色强度将指示在软分类情况下给定对象的经验概率有多大。对象的硬分类结果在\
  \ 图 10.6 中给出，阈值分别为 0.5（上）和 0.4（下）。\n\n![Figure 10.6: Classification diagram for\
  \ Example 2.](img/fig10_6.jpg)\n\n图 10.6： 示例 2 的分类图。\n\n该图上的分类结果证明，对象组之间的界限根据可靠性水平而得到细化。这使我们能够分离出亮红色和绿色点的区域（第一类和第二类）。在两种情况下，对应类的对象都位于学习对象周围的黑色圆圈内。\n\
  \n因此，可靠性水平的适当变化为熵软分类结果的统计处理提供了一种可能的机制。\n\n# 第 11 章 动态回归与预测问题中的随机机器学习\n\nDOI: [10.1201/9781003306566-11](https://doi.org/10.1201/9781003306566-11)\n\
  \n\n\n\n\nThe restoration of relations between two groups of variables is a basic\
  \ class of problems arising in econometric research. Generally, these problems are\
  \ treated as *static regression problems*, which involve retrospective data. In\
  \ many cases one needs to restore a relation and also to forecast its future dynamics.\
  \ As “future” data are unavailable for some period of time, such forecasts assist\
  \ in making more or less reasonable decisions. An obvious recommendation here is\
  \ to use *dynamic regressions*, which have a remarkable property of looking into\
  \ the future. In other words, given some initial conditions at a time `t[0]`, a\
  \ dynamic regression generates trajectories on a time interval [`t[0]`, `t`], where\
  \ `t` > `t[0]`. A dynamic regression rests on a parameterized dynamic model with\
  \ a two-stage procedure as follows. First, like for a static regression, it is necessary\
  \ to estimate regression parameters based on retrospective data on a time interval\
  \ [`t[-]`, `t[0]`], where `t[-]` < `t[0]`. In fact, this stage implements machine\
  \ learning of the model. Then, the resulting model acts as a generator of forecasted\
  \ trajectories on a second time interval [`t[0]`, `t[+]`].\n\nIn this chapter, we\
  \ will apply RML procedures for estimating the probabilistic characteristics of\
  \ parameterized dynamic models. Recall that the general concept of randomized machine\
  \ learning employs randomized parameters with entropy-optimal PDFs. Due to this\
  \ circumstance, a randomized dynamic model generates an ensemble of entropy-optimal\n\
  \n## 11.1 Restoration of Dynamic Relationships in Applications\n\nMany real processes\
  \ are dynamic in the sense that at each time their state depends on the past states\
  \ on some time interval, often considered as memory. Researchers often discriminate\
  \ between processes with finite and infinite memory. The latter case is convenient\
  \ for mathematical analysis whereas the hypothesis about finite memory is efficient\
  \ for a numerical study of a process. In the sequel, the term “processes” will indicate\
  \ dynamic processes.\n\nA process `Y(t)` is generated by some object in accordance\
  \ with an internal transformation mechanism of observable input actions `X(τ)`,\
  \ `τ ∈ \U0001D4AF` and unobservable factors `F(t)` with hypothetical properties.\
  \ Recall that a rather general descriptive formalism for a dynamic process is a\
  \ functional `ℬ[X(τ), F(τ); τ ∈ \U0001D4AF]` that characterizes a relation between\
  \ the object's output at a time `t` and its input `x(τ)` and factors `F(τ)` on a\
  \ time interval `\U0001D4AF = [t[-], t]`, i.e.,\n\n```\n\\begin{array}{r}\n{Y(t)\
  \ = \\mathcal{B}\\lbrack X(\\tau),F(\\tau);\\,\\tau \\in \\mathcal{T}\\rbrack,\\\
  quad\\quad t \\geq t\\_{-}.}\n\\end{array}\n```\n\n(11.1)\n\nThe need to model the\
  \ relation (11.1) occurs in many applications. Consider some of them in detail.\n\
  \n## 11.2 Randomized Model of World Population Dynamics\n\nThe state of World population\
  \ is characterized by its size `E(t)` measured in *billions of people* on a calendar\
  \ time. The population size `v(t) = dE(t)/dt` varies due to the impact of fertility\
  \ and mortality processes, since World population is an isolated system. Fertility\
  \ and mortality are measured by the numbers of newborns `B` and decedents `M` per\
  \ unit time (the flows of newborns and decedents, respectively):\n\n```\n\\begin{array}{r}\n\
  {B(E) = bE,\\quad\\quad M(E) = mE.}\n\\end{array}\n```\n\n(11.2)\n\nThe birth `b`\
  \ and mortality `m` coefficients change during observation, i.e., are time-varying\
  \ functions\n\n```\n\\begin{array}{r}\n{b = b(t),\\quad\\quad m = m(t).}\n\\end{array}\n\
  ```\n\n(11.3)\n\nAs a first approximation, consider the linear functions\n\n```\n\
  \\begin{array}{r}\n{b(t) = b_0 + b_1 t,\\quad\\quad m(t) = m_0 + m_1 t.}\n\\end{array}\n\
  ```\n\n(11.4)\n\nConsequently, the flows of fertility and mortality depend on time:\n\
  \n```\n\\begin{array}{r}\n{B(t) = (b_0 + b_1 t)E(t),\\quad\\quad M(t) = (m_0 + m_1\
  \ t)E(t).}\n\\end{array}\n```\n\n(11.5)\n\nThe difference between these flows, the\
  \ so-called reproduction flow, determines the dynamics of the population size, which\
  \ are described by the following differential equation with variable coefficients:\n\
  \n```\n\\begin{array}{r}\n{\\frac{dE(t)}{dt} = (r + ut)E(t),\\quad\\quad r = b_0\
  \ - m_0,\\quad u = b_1 - m_1;\\,\\, E(t_0) = E_0.}\n\\end{array}\n```\n\n(11.6)\n\
  \nHere `t[0]` and `E[0]` denote the initial time and initial population size, respectively;\
  \ the parameter `r` characterizes the constant component of the population reproduction\
  \ rate and parameter `u` its rate of change over time.\n\nEquation (11.6) with the\
  \ initial condition `E[0]` has the solution\n\n```\n\\begin{array}{r}\n{E(t) = E_0\\\
  exp\\left( {(r + ut)t} \\right).}\n\\end{array}\n```\n\n(11.7)\n\nThe measurements\
  \ of population size are performed on a calendar time with a step `h`. According\
  \ to the UN standard, `h = 5` years. Then `t = t[0] + n h`, and\n\n```\n\\begin{array}{r}\n\
  \\left. E\\lbrack t_0 + nh\\rbrack = E_0\\exp\\left( {(r + uhn)nh} \\right) = E\\\
  lbrack t_0 + nh\\, \\middle| \\, r,u,E_0\\rbrack,\\quad n = 0,1,.... \\right.\n\\\
  end{array}\n```\n\n(11.8)\n\nThe fertility and mortality coefficients are estimated\
  \ through indirect measurements that contain errors. Thus, the resulting flow rate\
  \ and its change over time are supposed to be random variables defined on the intervals\n\
  \n```\n\\begin{array}{r}\n{\\mathcal{J}_r = \\lbrack r^-,r^+\\rbrack,\\quad\\quad\
  \ \\mathcal{J}_u = \\lbrack u^-,u^+\\rbrack.}\n\\end{array}\n```\n\n(11.9)\n\nThe\
  \ values inside these intervals are characterized by a joint probability density\
  \ function (PDF) `P(r, u)` defined on the rectangle\n\n```\n\\begin{array}{r}\n\
  {\\mathcal{J} = \\mathcal{J}_r{\\cup \\mathcal{J}_u}.}\n\\end{array}\n```\n\n(11.10)\n\
  \nThe parameters of the model (11.8) are estimated by measuring the real population\
  \ size `E[real][n h]` on some time interval. These measurements have errors simulated\
  \ by random noises `ξ[n h] = ξ[n]`, which are specified on the corresponding intervals\
  \ `Ξ[n] = [ξ[n]^-, ξ[n]^+]`. The noises are supposed to be independent with a PDF\
  \ `qn`, i.e., their joint PDF on the observation interval `[0,N]` is given by\n\n\
  ```\n\\begin{array}{r}\n{Q(\\overline{\\xi}) = {\\prod\\limits_{n = 0}^{N}q_n}(\\\
  xi\\lbrack nh\\rbrack).}\n\\end{array}\n```\n\n(11.11)\n\nTherefore, the *randomized*\
  \ model of World population dynamics can be described by\n\n```\n\\begin{array}{r}\n\
  \\left. v\\lbrack t_0 + nh\\rbrack = E\\lbrack t_0 + nh\\, \\middle| \\, r,u,E_0\\\
  rbrack + \\xi\\lbrack nh\\rbrack,\\quad\\quad n = 0,1,... \\right.\n\\end{array}\n\
  ```\n\n(11.12)\n\nThis RM is a basis of RML procedures for estimating the PDFs `P(r,\
  \ u)` (parameters) and `Q(\\overline{\\xi})` (noises), testing and randomized forecasting\
  \ of World population. In all stages, retrospective data are used:\n\n* on the estimation\
  \ interval `\U0001D4AF[est] = [1960 − 1995]` (see Table 11.1);\n* on the testing\
  \ interval `\U0001D4AF[tst] = [1995 − 2015]` (see Table 11.2). These are the UN\
