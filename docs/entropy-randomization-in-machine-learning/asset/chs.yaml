  eta,\\overline{\\vartheta}),\\,\\overline{\\vartheta} = \\frac{1}{34 - p}{\\sum\\\
  limits_{n = p}^{34}\\vartheta_{n}}$；\n* 对于 *LDRR-P*，$V^{*}(c)$，$Z^{*}(\\zeta,\\\
  overline{\\lambda})$，和 $G^{*}(\\chi,\\overline{\\lambda}),\\,\\overline{\\lambda}\
  \ = \\frac{1}{34 - p}{\\sum\\limits_{n = p}^{34}\\lambda_{n}}.$\n\n这些 PDF 在相应的预测间隔上采样，并且通过蒙特卡洛模拟生成轨迹（湖泊面积变化）的预测集合。\n\
