  \ \\\\overline{1,24}.} \\\\\\\\ \\\\end{aligned}$$\n\nwhere\n\n\n\n\n\n$$\n\\begin{array}{r}\n\
  {{\\widetilde{h}}_{r}^{(i)}(\\eta) = {\\sum\\limits_{n = 1}^{24}\\eta_{n}}(2T_{r}^{(i)}[n\
