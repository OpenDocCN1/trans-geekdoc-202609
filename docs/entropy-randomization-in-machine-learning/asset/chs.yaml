  \n## 6.2 动态 RPM-QuaRand 模型的函数描述\n\n如前一节所述，隶属概率的估计问题通常表示为具有熵目标函数的有限维非线性规划问题。这些问题的非线性是由表征模型\
  \ (6.5) 的泛函 \U0001D4AE 的非线性引起的。考虑在离散时间区间 \U0001D4AF 上测量的单输入单输出模型。\n\n### 1. 具有非结构化幂非线性的动态模型\n\
  \n此类模型的函数描述具有以下形式\n\n$$\\\\begin{aligned} {s\\\\lbrack j\\\\rbrack = {\\\\sum\\\\\
  limits_{h = 1}^{R}{\\\\sum\\\\limits_{(n_{1},\\\\ldots,n_{h}) = 0}^{K_{h}}w_{h}}}}\
  \ & {\\\\lbrack n_{1},\\\\ldots,n_{h}\\\\rbrack x\\\\lbrack j - n_{1}\\\\rbrack\\\
  \\cdots x\\\\lbrack j - n_{h}\\\\rbrack,} \\\\\\\\ & {j \\\\geq maxK_{h}.} \\\\\\\
  \\ \\\\end{aligned}$$  \n\n(6.24)\n\n(另见 Fig. 4.8。)\n\n其动态和非线性特性由多维脉冲特性 $w_{h}\\\
  \\lbrack n_{1},\\\\ldots,n_{h}\\\\rbrack,\\\\, h = \\\\overline{1,R},$ 反映，具有有限的“记忆”\
  \ *K*[*h*]，即\n\n$$\\\\begin{aligned} {w_{h}\\\\lbrack n_{1},\\\\ldots,n_{h}\\\\\
  rbrack} & {\\\\neq 0,\\\\quad\\\\text{for}\\\\,\\\\, 0 \\\\leq (n_{1},\\\\ldots,n_{h})\
  \ \\\\leq K_{h};} \\\\\\\\ {w_{h}\\\\lbrack n_{1},\\\\ldots,n_{h}\\\\rbrack} & {=\
  \ 0,\\\\quad\\\\text{for}\\\\,\\\\,(n_{1},\\\\ldots,n_{h}) > K_{h}.} \\\\\\\\ \\\
  \\end{aligned}$$  \n\n(6.25)\n\n将脉冲特性的纵坐标作为模型参数。变量的字典序排列给出\n\n$$\\\\begin{array}{r}\
  \ \\\\left. (n_{1},\\\\ldots,n_{h})\\\\rightarrow v,\\\\text{\\\\quad\\\\quad}v\
  \ = \\\\overline{1,V_{h}},\\\\,\\\\, V_{h} = (K_{h} + 1)\\\\, h, \\\\right. \\\\\
  \\\\ \\\\end{array}$$  \n\n(6.26)\n\n定义由脉冲特性 *w*[*h*]\\[*n*[1], …, *n*[*h*]\\] 的纵坐标组成的向量\
  \ **c**^((*h*)) = {*c*[1]^((*h*)),…,*c*[*V*[*h*]]^((*h*))}。对乘积 *x*\\[*j* − *n*[1]\\\
  ]⋯*x*\\[*j* − *n*[*h*]\\] 执行类似操作。引入另一个向量\n\n$$\\\\begin{array}{r} {\\\\mathbf{X}^{(h)}\\\
  \\lbrack j\\\\rbrack = \\\\left\\\\{ x_{1}^{(h)}\\\\lbrack j\\\\rbrack,\\\\ldots,x_{V_{h}}^{(h)}\\\
  \\lbrack j\\\\rbrack \\\\right\\\\}} \\\\\\\\ \\\\end{array}$$  \n\n(6.27)\n\n由字典序排列的乘积\
  \ *x*\\[*j* − *n*[1]\\]⋯*x*\\[*j* − *n*[*h*]\\] 组成。则模型方程 (6.1.2) 可变换为\n\n$$\\\\\
  begin{array}{r} {s\\\\lbrack j\\\\rbrack = {\\\\sum\\\\limits_{h = 1}^{R}\\\\left\\\
  \\langle \\\\mathbf{c}^{(h)},\\\\mathbf{X}^{(h)}\\\\lbrack j\\\\rbrack \\\\right\\\
  \\rangle}.} \\\\\\\\ \\\\end{array}$$  \n\n(6.28)\n\n作为所有这些操作的结果，原非线性模型 (6.1.2)\
  \ 已被简化为其线性类似物 (6.28)，维度大大提高。\n\n利用 第 6.3 节 中的隶属概率 **p**，令参数向量 **c**^((*h*)) 写为\n\
  \n$$\\\\begin{aligned} {\\\\mathbf{c}^{(h)} = \\\\mathbf{c}_{-}^{(h)} + C^{(h)}\\\
  \\mathbf{p}^{(h)},\\\\,\\\\, C_{h} =} & \\\\left. \\\\text{diag}\\\\,\\\\lbrack(c_{i}^{(h,\
  \ + )} - c_{i}^{(h, - )})\\\\, \\\\middle| \\\\, i = \\\\overline{1,V_{h}}\\\\rbrack,\
  \ \\\\right. \\\\\\\\ & {h = \\\\overline{1,R}.} \\\\\\\\ \\\\end{aligned}$$  \n\
  \n(6.29)\n\n将 (6.29) 代入 (6.28) 得到方程\n\n$$\\\\begin{aligned} {s\\\\lbrack j\\\\rbrack}\
  \ & {= \\\\hat{s}\\\\lbrack j\\\\rbrack + {\\\\sum\\\\limits_{h = 1}^{R}\\\\left\\\
  \\langle C_{h}\\\\,\\\\mathbf{p}^{(h)},\\\\mathbf{X}^{(h)}\\\\lbrack j\\\\rbrack\
  \ \\\\right\\\\rangle},} \\\\\\\\ {.\\\\hat{s}\\\\lbrack j\\\\rbrack} & {= {\\\\\
  sum\\\\limits_{h = 1}^{R}\\\\left\\\\langle \\\\mathbf{c}_{-}^{(h)},\\\\mathbf{X}^{(h)}\\\
  \\lbrack j\\\\rbrack \\\\right\\\\rangle}.} \\\\\\\\ \\\\end{aligned}$$  \n\n(6.30)\n\
  \n### 2. 具有结构化幂非线性的动态模型\n\n对于此类动态模型，函数描述具有以下形式：\n\n$$\\\\begin{array}{r} {s\\\\\
  lbrack j\\\\rbrack = {\\\\sum\\\\limits_{h = 1}^{R}{\\\\sum\\\\limits_{n = 0}^{K_{h}}\\\
  \\left( {w_{h}\\\\lbrack n\\\\rbrack x\\\\lbrack j - n\\\\rbrack} \\\\right)^{h}}},\\\
  \\text{\\\\quad\\\\quad}j > K.} \\\\\\\\ \\\\end{array}$$  \n\n(6.31)\n\n(另见 Fig.\
