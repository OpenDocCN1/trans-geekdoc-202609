  \ | 0.0145 | 0.0169 |\n\n### 2.3.4 缺失数据的随机恢复方法\n\n#### 1. 缺失数据随机恢复程序的结构\n\n\n\n\n\
  \n考虑机器学习问题的信息支持（`infoware`）的组成部分和属性。学习集合包含关于对象 `O` 的功能的一些数据 `O`（Fig. 2.10）以及测量的输入\
  \ `x(t)` ∈ `R^(m)` 和输出 `y(t)` ∈ `R^(n)`。变量 `x(t)` 和 `y(t)` 分别包含测量误差 `η(t)` ∈ `R^(m)`\
  \ 和 `ξ(t)` ∈ `R^(n)`。通常，关于它们的信息具有假设性特征。一种常见假设是它们以加性形式出现在学习集合中：\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{x}(t) = \\mathbf{x}^{0}(t) + \\eta(t);\\quad\\quad\\mathbf{y}(t) = \\\
  mathbf{y}^{0}(t) + \\xi(t),} \\\\ \\end{array}\n$$\n\n(2.100)\n\n![Figure 2.10](img/fig2_10.jpg)\n\
  \nFigure 2.10\n\n其中 `x⁰(t)` 和 `y⁰(t)` 为纯变量。\n\n假设输入和输出在相同的时间尺度 `t = k h` 下测量，步长为\
  \ `h`，且在相同的时间区间 `\U0001D4AF = [0, T]` 上。因此，真实的学习集合由描述对象 `O` 的输入和输出的数据矩阵组成。\n\n输入和输出的数据数组可能存在遗漏；参见\
  \ Fig. 2.11 中的区间 `[k⁻, k⁺]`。此类遗漏有三种可能情况：输出数据中的遗漏、输入数据中的遗漏以及两种类型数据中的遗漏（不一定在同一时刻）。\n\
  \n![Figure 2.11: Example of missing data ensemble (MDE).](img/fig2_11.jpg)\n\nFigure\
  \ 2.11: Example of missing data ensemble (MDE).\n\n缺失数据随机恢复的主要思想是用缺失数据集合（MDE）替换现有的遗漏，即输入和输出分量的随机值（见\
  \ Fig. 2.11），在考虑可用测量的情况下进行优化。这是通过对象的随机化参数模型（RPM）完成的，其概率特性（其参数的概率密度函数（PDF））通过最大熵估计（MEE）获得。细节将在\
  \ Appendix A 中介绍。\n\n优化后的 MDE 由最优 PDF 的采样生成 [64]。该 MDE 可直接用于解决不同的机器学习问题。此外，还可以确定优化后\
  \ MDE 的数值特征，如均值、中位数、方差管、区间数据集合等。 Figure 2.11 给出了该方法的说明。\n\n如果遗漏出现在输出数据中，则该过程采用输入数据\
  \ `x[k h]`、`RPM-O` 模型和存在遗漏的输出数据 `\\widetilde{y}[k h]` 来计算熵最优 PDF（Fig. 2.12(a)），并用于生成恢复输入数据的集合\
  \ `\U0001D4B4`。\n\n![Figure 2.12: Diagrams of RPMs.](img/fig2_12.jpg)\n\nFigure\
  \ 2.12: Diagrams of RPMs.\n\n输入数据中存在的遗漏使用额外的 `RPM-I` 模型进行恢复，输入由优化后的独立随机向量 `η[k h]`\
  \ 的序列和存在遗漏的输入数据 `\\widetilde{x}[k h]` 表示。该序列和参数的 PDF 通过 MEE 获得。然后使用这些函数生成随机向量 `η[k\
  \ h]` 的集合 `ℰ` 和恢复输入数据的集合 `\U0001D4B3`；见 Fig. 2.12(b)。\n\n最后，考虑输入和输出数据同时存在遗漏的情况。首先，恢复随机向量\
  \ `η[k h]` 的集合 `ℰ` 和输入数据的集合 `\U0001D4B3`。其次，它们被用于恢复输出数据的集合 `\U0001D4B4`（Fig. 2.12(c)）。\n\
  \n缺失数据随机恢复方法集合将用 `RRMD` 表示（Random Restored Missing Data）。\n\n### 2. MDE 的优化算法\n\n\
  #### a. 输出数据中的遗漏\n\n考虑离散观测时间区间 `τ = [0, N]` 在此区间上，存在一组无遗漏的输入数据 `x ∈ R^(m)`，`x[0]`，…，`x[N]`，以及一组存在遗漏的输出数据\
  \ `y ∈ R^(n)`，`y[0]`，…，`y[k⁻ − 1]`，`y[k⁺ + 1]`，…，`y[N]`。数据 `y[k⁻]`，…，`y[k⁺]` 缺失。\n\
  \n构造矩阵\n\n$$\n\\begin{array}{r} {X_{(k - \\varrho)} = \\left[ {\\mathbf{x}[k - \\\
  varrho],\\mathbf{x}[k - \\varrho + 1],\\ldots,\\mathbf{x}[k]} \\right] } \\\\ \\\
  end{array}\n$$\n\n(2.101)\n\n由输入数据集得到，其中 `ρ < N` 为参数。\n\n输出数据包含区间类型的加性误差 `ξ[k] ∈\
  \ R^(n)`：\n\n$$\n\\begin{array}{r} {\\xi[k] \\in \\Xi_{k} = [\\xi^{-},\\xi^{+}].\
  \ } \\\\ \\end{array}\n$$\n\n(2.102)\n\n误差的概率特性由 PDF `Qk` 刻画，`k = \\overline{0,N}`，假定为连续可微。\n\
  \n一般情况下，对象 `O` 的输入和输出关系由随机化参数动态模型 `RDM-O` 描述，其形式为\n\n$$\n\\begin{array}{r} {\\hat{\\\
  mathbf{y}}[k] = \\mathbb{B}\\left( {\\mathbf{a},X_{(k - \\varrho)}} \\right),} \\\
  \\ \\end{array}\n$$\n\n(2.103)\n\n其中 `\U0001D539` 为具有随机参数 `a ∈ R^(r)` 的非线性泛函，参数为区间类型：\n\
  \n$$\n\\begin{array}{r} {\\mathbf{a} \\in \\mathcal{A} = [\\mathbf{a}^{-},\\mathbf{a}^{+}].\
  \ } \\\\ \\end{array}\n$$\n\n(2.104)\n\n这些参数的概率特性由 PDF `P(a)` 刻画，假定为连续可微。\n\n`RDM-O`\
  \ 的观测输出为\n\n$$\n\\begin{array}{r} {\\mathbf{v}[k] = \\hat{\\mathbf{y}}[k] + \\xi[k],\\\
  quad\\quad k = \\overline{0,N}.} \\\\ \\end{array}\n$$\n\n(2.105)\n\n为确定最优 PDF，应用\
  \ [148] 中提出的随机化机器学习（`RML`）算法。在所考虑的情况下，其形式为\n\n$$\n\\begin{aligned} & {\\quad\\mathcal{H}[\
  \ P(\\mathbf{a}),Q(\\xi)] = - {\\int_{\\mathcal{A}}P}(\\mathbf{a})\\ln P(\\mathbf{a})d\\\
  mathbf{a} -} \\\\ & \\left. - {\\sum\\limits_{k = 0}^{T}{\\int_{\\Xi_{k}}Q_{k}}}(\\\
  xi[k])\\ln Q_{k}(\\xi[k])d\\xi[k]\\Rightarrow\\max, \\right. \\\\ & {\\quad{\\int_{\\\
  mathcal{A}}P}(\\mathbf{a})d\\mathbf{a} = 1;\\quad{\\int_{\\Xi_{k}}Q_{k}}(\\xi[k])d\\\
  xi[k] = 1,\\, \\, k = \\overline{0,N},} \\\\ & {\\quad{\\int_{A}P}(\\mathbf{a})\\\
  mathbb{B}\\left( {\\mathbf{a},X_{(k - \\varrho)}} \\right)d\\mathbf{a} + {\\int_{\\\
  Xi_{k}}Q_{k}}(\\xi[k])\\xi[k] d\\xi[k] = \\mathbf{y}[k],} \\\\ & {\\quad k \\neq\
  \ k^{-},\\ldots,k^{+};k = \\overline{0,N}.} \\\\ \\end{aligned}\n$$\n\n(2.106)\n\
  \nPDF 是连续可微的，且问题 (2.106) 属于 Lyapunov 型泛函优化问题类 [77]。因此，可以构造由拉格朗日乘子 `{θ^{(0)},…,θ^{(k⁻\
  \ − 1)},θ^{(k⁺ + 1)},…,θ^{((N))}}` 参数化的解析解：\n\n$$\n\\begin{aligned} & {P^{\\*}(\\\
  mathbf{a},\\theta) = \\frac{\\exp\\left[ - {\\sum\\limits_{k = 0}^{N}\\langle}\\\
  theta^{(k)},\\mathbb{B}\\left( \\left. \\mathbf{a},X_{(k - \\varrho)} \\right\\\
  rangle \\right)} \\right]}{\\mathcal{P}(\\theta)},} \\\\ & {\\quad\\quad Q_{k}^{\\\
  *}(\\xi[k],\\theta^{(k)}) = \\frac{\\exp\\left( {- \\left\\langle \\theta^{(k)},\\\
  xi[k] \\right\\rangle} \\right)}{\\mathcal{Q}_{k}(\\theta^{(k)})},} \\\\ & {\\quad\\\
  text{\\quad\\quad}k \\neq k^{-},\\ldots,k^{+};\\quad k = \\overline{0,N}.} \\\\\
  \ \\end{aligned}\n$$\n\n(2.107)\n\n\n\n\n\nHere\n\n$$\\begin{aligned} & {\\mathcal{P}(\\\
  theta) = {\\int_{\\mathcal{A}}\\exp}\\left\\lbrack {- {\\sum\\limits_{k = 0}^{N}\\\
  langle}\\theta^{(k)},\\mathbb{B}\\left( \\left. \\mathbf{a},X_{(k - \\varrho)} \\\
  right\\rangle \\right)} \\right\\rbrack d\\mathbf{a},} \\\\ & {\\text{\\quad\\quad}\\\
  mathcal{Q}_{k}(\\theta^{(k)}) = {\\int_{\\Xi_{k}}\\exp}\\left( {- \\left\\langle\
  \ \\theta^{(k)},\\xi\\lbrack k\\rbrack \\right\\rangle} \\right)d\\xi\\lbrack k\\\
  rbrack,} \\\\ & {\\text{\\quad\\quad}\\quad k \\neq k^{-},\\ldots,k^{+};\\quad k\
  \ = \\overline{0,N}.} \\\\ \\end{aligned}$$\n\n(2.108)\n\nThe Lagrange multipliers\
  \ are determined from the system of equations\n\n$$\\begin{array}{r} {\\frac{\\\
  mathbf{M}_{k}(\\theta)}{\\mathcal{P}(\\theta)} + \\frac{\\mathbf{N}_{k}(\\theta^{(k)})}{\\\
  mathcal{Q}_{k}(\\theta^{(k)})} = \\mathbf{y}\\lbrack k\\rbrack,\\text{\\quad\\quad}k\
  \ \\neq k^{-},\\ldots,k^{+};k = \\overline{0,N},} \\\\ \\end{array}$$\n\n(2.109)\n\
  \nwhere\n\n$$\\begin{aligned} {\\mathbf{M}_{k}(\\theta) = \\int_{\\mathcal{A}}}\
  \ & {\\exp\\left\\lbrack {- {\\sum\\limits_{k = 0}^{T}\\left\\langle \\theta^{(k)},\\\
  mathbb{B}\\left( {\\mathbf{a},X_{(k - \\varrho)}} \\right) \\right\\rangle}} \\\
  right\\rbrack\\mathbb{B}\\left( {\\mathbf{a},X_{(k - \\varrho)}} \\right)d\\mathbf{a},}\
  \ \\\\ \\end{aligned}$$\n\n(2.110)\n\n$$\\begin{aligned} & {\\mathbf{N}_{k}(\\theta^{(k)})\
  \ = {\\int_{\\Xi_{k}}\\exp}\\left( {- \\left\\langle \\theta^{(k)},\\xi\\lbrack\
  \ k\\rbrack \\right\\rangle} \\right)\\xi\\lbrack k\\rbrack d\\xi\\lbrack k\\rbrack.}\
  \ \\\\ \\end{aligned}$$\n\n(2.111)\n\n**b. Omissions in input data**\n\nRestoring\
  \ omissions in input data is more difficult than the ones in output data. Really,\
  \ the origin mechanism of input data and the source of its excitation are both unknown.\
  \ In terms of the approach adopted here, this means that the model generating input\
  \ data and also the process exciting it are unknown. All these factors increase\
  \ the level of uncertainty in the problem, motivating the choice of randomization.\n\
  \nThe randomized approach consists in using a sequence of independent random vectors\
  \ $\\zeta\\lbrack k\\rbrack \\in R^{q}\\\\, \\,(k\\overline{0,N})$ with special\
  \ probabilistic characteristics, and a randomized parametric model, the choice of\
  \ which is determined by its complexity.\n\nWell, consider the observation interval\
  \ *τ* = \\[0, *N*\\] and an input data set **x** ∈ *R*^(*m*) with omissions **x**\\\
  [0\\], …, **x**\\[*k*^− − 1\\], **x**\\[*k*^+ + 1\\], …, **x**\\[*T*\\]. The data\
  \ **x**\\[*k*^−\\], …, **x**\\[*k*^+\\] are missing.\n\nTo restore the missing input\
  \ data, assume that they are the result of transforming a sequence of independent\
  \ random vectors *ζ*\\[*k*\\] ∈ *R*^(*q*), *k* ∈ *τ*. Let the vectors *ζ*\\[*k*\\\
  ] be of the interval type, i.e.,\n\n$$\\begin{array}{r} {\\zeta\\lbrack k\\rbrack\
  \ \\in \\mathcal{Z}_{k} = \\lbrack\\zeta^{-}\\lbrack k\\rbrack,\\zeta^{+}\\lbrack\
  \ k\\rbrack\\rbrack,\\text{\\quad\\quad}k = \\overline{0,N},} \\\\ \\end{array}$$\n\
  \n(2.112)\n\nDue to the uncertainty and insufficient knowledge about the process\
  \ and its transformation, choose the randomized parametric (RPM-I) model\n\n$$\\\
  begin{array}{r} {\\hat{\\mathbf{x}}\\lbrack k\\rbrack = \\mathbb{F}\\left( {\\mathbf{c},Z_{(k\
  \ - \\rho)}} \\right),} \\\\ \\end{array}$$\n\n(2.113)\n\nwhere \U0001D53D is a\
  \ nonlinear vector functional with random parameters **c** ∈ *R*^(*s*) and *Z*[(*k* − *ρ*)]\
  \ is the input matrix of dimensions (*q* × *ρ*) composed of the column vectors *ζ*\\\
  [*k*\\] ∈ *R*^(*q*), i.e.,\n\n$$\\begin{array}{r} {Z_{(k - \\rho)} = \\left\\lbrack\
  \ {\\zeta\\lbrack k - \\rho\\rbrack,\\zeta\\lbrack k - \\rho + 1\\rbrack,\\ldots,\\\
  zeta\\lbrack k\\rbrack} \\right\\rbrack.} \\\\ \\end{array}$$\n\n(2.114)\n\nIntroduce\
  \ the matrix\n\n$$\\begin{array}{r} {Z = \\left\\lbrack {Z_{( - \\rho)},Z_{(1 -\
  \ \\rho)},\\ldots,Z_{(N - \\rho)}} \\right\\rbrack,} \\\\ \\end{array}$$\n\n(2.115)\n\
  \nwhich characterizes the input of the RPM-I model (2.113) on the time interval\
  \ $k = \\overline{0,N}.$ The matrix *Z* is random and of the interval type:\n\n\
  $$\\begin{array}{r} {Z \\in \\mathcal{Z} = {\\underset{k = 0}{\\overset{N}{\\cup}}\\\
  mathcal{Z}_{k}} = \\lbrack Z^{-},Z^{+}\\rbrack.} \\\\ \\end{array}$$\n\n(2.116)\n\
  \nThe random parameters of this model are\n\n$$\\begin{array}{r} {\\mathbf{c} \\\
  in \\mathcal{C} = \\lbrack\\mathbf{c}^{-},\\mathbf{c}^{+}\\rbrack.} \\\\ \\end{array}$$\n\
  \n(2.117)\n\nThe probabilistic properties of the parameters **c** and matrix *Z*\
  \ (2.115) are characterized by a joint probability density function (PDF) *W*(**c**, *Z*)\
  \ with the domain of definition\n\n$$\\begin{array}{r} {\\mathcal{F} = \\mathcal{C}{\\\
  cup \\mathcal{Z}}.} \\\\ \\end{array}$$\n\n(2.118)\n\nThis function is assumed to\
  \ be continuously differentiable.\n\nLet the available input data **x**\\[*k*\\\
  ] contain errors *η*\\[*k*\\] ∈ *R*^(*m*) of the interval type:\n\n$$\\begin{array}{r}\
  \ {\\eta\\lbrack k\\rbrack \\in \\mathcal{E}_{k} = \\lbrack\\eta^{-},\\eta^{+}\\\
  rbrack.} \\\\ \\end{array}$$\n\n(2.119)\n\nThe probabilistic properties of the errors\
  \ are characterized by PDFs $G_{k}(\\eta\\lbrack k\\rbrack),k = \\overline{0,N},$\
  \ which are assumed to be continuously differentiable as well.\n\nThe observed output\
  \ of the RPM-I model is given by\n\n$$\\begin{array}{r} {\\mathbf{z}\\lbrack k\\\
  rbrack = \\hat{\\mathbf{x}}\\lbrack k\\rbrack + \\eta\\lbrack k\\rbrack,\\text{\\\
  quad\\quad}k = \\overline{0,N}.} \\\\ \\end{array}$$\n\n(2.120)\n\nClearly, the\
  \ missing input data are restored using a model similar to RDM-O, but with the random\
  \ input *ζ*\\[*k*\\].\n\nApply the RML algorithm \\[148\\] for determining the PDFs\
  \ *W*(**c**, *Z*) and $G_{k}(\\zeta\\lbrack k\\rbrack),\\, k = \\overline{0,N}.$\
  \ In the case under consideration, this algorithm has the form\n\n$$\\begin{aligned}\
  \ & {\\quad\\mathcal{H}\\lbrack W(\\mathbf{c},Z),G(\\eta)\\rbrack = - {\\int_{\\\
  mathcal{F}}W}(\\mathbf{c},Z)\\ln W(\\mathbf{c},Z)\\, d\\mathbf{c}\\, dZ -} \\\\\
  \ & \\left. - {\\sum\\limits_{k \\in \\mathcal{K}}{\\int_{\\mathcal{E}_{k}}G_{k}}}(\\\
  eta\\lbrack k\\rbrack)\\ln G_{k}(\\eta\\lbrack k\\rbrack)d\\eta\\lbrack k\\rbrack\\\
  Rightarrow\\max, \\right. \\\\ & {\\quad{\\int_{\\mathcal{F}}W}(\\mathbf{c},Z)\\\
  , d\\mathbf{c}\\, dZ = 1;\\quad{\\int_{\\mathcal{E}_{k}}G_{k}}(\\eta\\lbrack k\\\
  rbrack)d\\eta\\lbrack k\\rbrack = 1,} \\\\ & {\\quad{\\int_{\\mathcal{F}}W}(\\mathbf{c},Z)\\\
  mathbb{F}\\left( {\\mathbf{c},Z_{(k - \\rho)}} \\right)d\\mathbf{c}\\, dZ + {\\\
  int_{\\mathcal{E}_{k}}G_{k}}(\\eta\\lbrack k\\rbrack)\\eta\\lbrack k\\rbrack d\\\
  eta\\lbrack k\\rbrack = \\mathbf{x}\\lbrack k\\rbrack,} \\\\ & {\\quad k \\in \\\
  mathcal{K},} \\\\ \\end{aligned}$$\n\n(2.121)\n\nwhere the indexing set $\\mathcal{K}\
  \ = \\overline{0,N}$ does not include *k* = *k*^−, …, *k*^+.\n\nThis problem belongs\
  \ to the same class as (2.106). Its solution is given by\n\n$$\\begin{array}{rll}\
  \ & {W^{\\*}(\\mathbf{c},Z,\\lambda) = \\frac{\\exp\\left\\lbrack {- {\\sum\\limits_{k\
  \ \\in \\mathcal{K}}\\langle}\\lambda^{(k)},\\mathbb{F}\\left( \\left. \\mathbf{c},Z_{(k\
  \ - \\rho)} \\right\\rangle \\right)} \\right\\rbrack}{\\mathcal{W}(\\lambda)},}\
  \ & \\\\ & {G_{k}^{\\*}(\\eta\\lbrack k\\rbrack,\\lambda^{(k)}) = \\frac{\\exp\\\
  left( {- \\left\\langle \\lambda^{(k)},\\eta\\lbrack k\\rbrack \\right\\rangle}\
  \ \\right)}{\\mathcal{G}_{k}(\\lambda^{(k)})},} & \\\\ & {k \\in \\mathcal{K},}\
  \ & \\\\ \\end{array}$$\n\n(2.122)\n\nwhere\n\n$$\\begin{aligned} {\\mathcal{W}(\\\
  lambda) = \\int_{\\mathcal{F}}} & {\\exp\\left\\lbrack {- \\sum\\left\\langle \\\
  lambda^{(k)},\\mathbb{F}\\left( \\left. \\mathbf{c},Z_{(k - \\rho)} \\right\\rangle\
  \ \\right) \\right.} \\right\\rbrack d\\mathbf{c},\\quad\\mathcal{G}_{k}(\\lambda^{(k)})\
  \ =} \\\\ & {\\,\\, = int_{\\mathcal{E}_{k}}\\exp\\left( {- \\left\\langle \\lambda^{(k)},\\\
  eta\\lbrack k\\rbrack \\right\\rangle} \\right)d\\eta\\lbrack k\\rbrack.} \\\\ \\\
  end{aligned}$$\n\n(2.123)\n\nIn the equalities presented above, *λ*^((*k*)) is the\
  \ vector of Lagrange multipliers corresponding to the *k*th balance constraint.\
  \ This vector satisfies the system of equations\n\n\n\n\n\n$$\n\\begin{array}{r}\
  \ {\\frac{{\\widetilde{\\mathbf{M}}}_{k}(\\lambda)}{\\mathcal{W}(\\lambda)} + \\\
  frac{{\\widetilde{\\mathbf{S}}}_{k}(\\lambda^{(k)})}{\\mathcal{G}_{k}(\\lambda^{(k)})}\
  \ = \\mathbf{x}\\lbrack k\\rbrack,\\quad k \\neq k^{-},\\ldots,k^{+};k \\in \\mathcal{K},}\
  \ \\\\ \\end{array}\n$$\n\n(2.124)\n\nwhere\n\n$$\n\\begin{aligned} & {{\\widetilde{\\\
  mathbf{M}}}_{k}(\\lambda) = {\\int_{\\mathcal{F}}\\exp}\\left\\lbrack {- {\\sum\\\
  limits_{k \\in \\mathcal{K}}\\langle}\\lambda^{(k)},\\mathbb{F}\\left( \\left. \\\
  mathbf{c},Z_{(k - \\rho)} \\right\\rangle \\right)} \\right\\rbrack\\mathbb{F}\\\
  left( {\\mathbf{c},Z_{(k - \\rho)}} \\right)d\\mathbf{c}dZ,} \\\\ & {{\\widetilde{\\\
  mathbf{S}}}_{k}(\\lambda^{(k)}) = {\\int_{\\mathcal{E}_{k}}\\exp}\\left( {- \\left\\\
  langle \\lambda^{(k)},\\eta\\lbrack k\\rbrack \\right\\rangle} \\right)\\eta\\lbrack\
  \ k\\rbrack d\\eta\\lbrack k\\rbrack.} \\\\ \\end{aligned}\n$$\n\n(2.125)\n\n###\
  \ 3. 输入和输出数据中的遗漏\n\n在这种情况下，前几段所述的程序必须依次使用：首先是算法 `(2.121)`，然后是算法 `(2.106)`。\n\n单独或依次应用的算法产生：\n\
  \n* 熵最优的参数概率密度函数 `P*`(**a**) 和 `W*`(**c**)；\n* 测量噪声的熵最优概率密度函数 `Q[k]*`(*ξ*[*k*])\
  \ 和 `G[k]*`(*η*[*k*])，其中 $k = \\overline{1,N};$\n* 随机输入序列的熵最优概率密度函数 `$K_{k}^{*}$`(*ζ*[*k*])，*k\
  \ = $\\overline{1,N}$.*\n\n### 3. 最优概率密度函数的采样\n\n采样将概率密度函数转化为适当的随机向量序列。在所考虑的程序中，这是实现缺失数据段上随机向量集合的一种方式。\n\
  \n生成具有给定概率密度函数的随机向量序列的通用方法已在 `[36]` 中描述。它旨在采样 RPM-O 和 RPM-I 模型对应的随机参数向量序列以及测量噪声向量序列，并使用蒙特卡洛方法\
  \ `[159]` 生成恢复数据的集合。\n\n集合的一些有用特征如下：\n\n* —恢复输出数据和输入数据的经验概率密度函数 `$\\mathcal{P}_{k}({\\\
  hat{\\mathbf{v}}}_{rst}\\lbrack k\\rbrack)$` 和 `$\\mathcal{W}_{k}({\\hat{\\mathbf{z}}}_{rst}\\\
  lbrack k\\rbrack)$`；\n* —经验概率分布\n\n$$\n\\begin{aligned} {\\mathfrak{P}_{k}({\\hat{\\\
  mathbf{v}}}_{rst}^{(i)}\\lbrack k\\rbrack)} & {= {\\sum\\limits_{j = 1}^{i}\\mathcal{P}_{k}}({\\\
  hat{\\mathbf{v}}}_{rst}^{(j)}\\lbrack k\\rbrack)\\quad\\text{(for~the~output~data)}}\
  \ \\\\ {\\mathfrak{W}_{k}({\\hat{\\mathbf{z}}}_{rst}^{(i)}\\lbrack k\\rbrack)} &\
  \ {= {\\sum\\limits_{j = 1}^{i}\\mathcal{W}_{k}}({\\hat{\\mathbf{v}}}_{rst}^{(j)}\\\
  lbrack k\\rbrack)\\quad\\text{(for~the~input~data)}.} \\\\ \\end{aligned}\n$$\n\n\
  (2.126)\n\n代表随机轨迹集合的积分特征的恢复数据集可用于解决机器学习问题。\n\n#### 1. 使参数和噪声的概率密度函数最大化的数据 (max-pn)\n\
  \n* —恢复的输出数据：\n\n$$\n\\begin{aligned} {{\\hat{\\mathbf{y}}}_{rst}\\lbrack k\\rbrack}\
  \ & {= \\mathbb{B}(\\mathbf{a}^{*},X_{(k - \\rho)}),\\quad\\mathbf{a}^{*} = \\arg\\\
  max P^{*}(\\mathbf{a}),} \\\\ {\\xi_{rst}\\lbrack k\\rbrack} & {= \\arg\\max Q_{k}^{*}(\\\
  xi\\lbrack k\\rbrack),} \\\\ {{\\hat{\\mathbf{v}}}_{rst}\\lbrack k\\rbrack} & {=\
  \ {\\hat{\\mathbf{y}}}_{rst}\\lbrack k\\rbrack + \\xi_{rst}\\lbrack k\\rbrack,\\\
  text{\\quad\\quad}k = \\overline{0,N}.} \\\\ \\end{aligned}\n$$\n\n(2.127)\n\n*\
  \ —恢复的输入数据：\n\n$$\n\\begin{aligned} {{\\hat{\\mathbf{x}}}_{rst}\\lbrack k\\rbrack}\
  \ & {= \\mathbb{F}(\\mathbf{c}^{*},Z_{(k - \\rho)}^{*}),\\quad\\mathbf{c}^{*} =\
  \ \\arg\\max W^{*}(\\mathbf{a}),} \\\\ Z_{(k - \\rho)}^{*} & {= \\lbrack\\zeta^{*}\\\
  lbrack k - \\rho\\rbrack,\\ldots,\\zeta^{*}\\lbrack k\\rbrack\\rbrack,\\quad\\zeta^{*}\\\
  lbrack k\\rbrack = \\arg\\max K_{k}^{*}(\\zeta\\lbrack k\\rbrack),} \\\\ {\\eta_{rst}\\\
  lbrack k\\rbrack} & {= \\arg\\max G_{k}^{*}(\\eta\\lbrack k\\rbrack),} \\\\ {{\\\
  hat{\\mathbf{z}}}_{rst}\\lbrack k\\rbrack} & {= {\\hat{\\mathbf{x}}}_{rst}\\lbrack\
  \ k\\rbrack + \\eta_{rst}\\lbrack k\\rbrack,\\text{\\quad\\quad}k = \\overline{0,N}.}\
  \ \\\\ \\end{aligned}\n$$\n\n(2.128)\n\n### 2. 使 $k = \\overline{0,N}$ 时观测轨迹的经验概率密度函数最大化的数据\
  \ (max-ePDF)\n\n* —恢复的输出数据：\n\n$$\n\\begin{array}{r} {{\\check{\\mathbf{v}}}_{rst}\\\
  lbrack k\\rbrack = \\arg\\max\\mathcal{P}_{k}({\\hat{\\mathbf{v}}}_{rst}\\lbrack\
  \ k\\rbrack),\\text{\\quad\\quad}k = \\overline{0,N}.} \\\\ \\end{array}\n$$\n\n\
  (2.129)\n\n* —恢复的输入数据：\n\n$$\n\\begin{array}{r} {{\\check{\\mathbf{z}}}_{rst}\\\
  lbrack k\\rbrack = \\arg\\max\\mathcal{W}_{k}({\\hat{\\mathbf{z}}}_{rst}\\lbrack\
  \ k\\rbrack),\\text{\\quad\\quad}k = \\overline{0,N};} \\\\ \\end{array}\n$$\n\n\
  (2.130)\n\n#### 3. 对应于平均轨迹的数据 (mean)\n\n* —恢复的输出数据：\n\n$$\n\\begin{array}{r} {{\\\
  overline{\\mathbf{v}}}_{rst}\\lbrack k\\rbrack = \\frac{1}{M}{\\sum\\limits_{i =\
  \ 1}^{M}{\\hat{\\mathbf{v}}}_{rst}^{(i)}}\\lbrack k\\rbrack,\\text{\\quad\\quad}k\
  \ = \\overline{0,N}.} \\\\ \\end{array}\n$$\n\n(2.131)\n\n* —恢复的输入数据：\n\n$$\n\\\
  begin{array}{r} {{\\overline{\\mathbf{z}}}_{rst}\\lbrack k\\rbrack = \\frac{1}{M}{\\\
  sum\\limits_{i = 1}^{M}{\\hat{\\mathbf{z}}}_{rst}^{(i)}}\\lbrack k\\rbrack,\\text{\\\
  quad\\quad}k = \\overline{0,N}.} \\\\ \\end{array}\n$$\n\n(2.132)\n\n（这里 *M* 表示集合中轨迹的数量。）\n\
  \n#### 4. 对应于中值轨迹的数据 (med)\n\n* —恢复的输出数据：\n\n$$\n\\begin{array}{r} \\left. {\\hat{\\\
  mathbf{v}}}_{rst}^{(j^{*})}\\lbrack k\\rbrack\\Rightarrow{\\sum\\limits_{j = 1}^{j^{*}}\\\
  mathfrak{P}_{k}}({\\hat{\\mathbf{v}}}_{rst}^{(j)}\\lbrack k\\rbrack) = {\\sum\\\
  limits_{j = j^{*} + 1}^{M}\\mathfrak{P}_{k}}({\\hat{\\mathbf{v}}}_{rst}^{(j)}\\\
  lbrack k\\rbrack). \\right. \\\\ \\end{array}\n$$\n\n(2.133)\n\n* —恢复的输入数据：\n\n\
  $$\n\\begin{array}{r} \\left. {\\hat{\\mathbf{z}}}_{rst}^{(j^{*})}\\lbrack k\\rbrack\\\
  Rightarrow{\\sum\\limits_{j = 1}^{j^{*}}\\mathfrak{W}_{k}}({\\hat{\\mathbf{z}}}_{rst}^{(j)}\\\
  lbrack k\\rbrack) = {\\sum\\limits_{j = j^{*} + 1}^{M}\\mathfrak{W}_{k}}({\\hat{\\\
