  \ \\right. \\\\ \\end{array}$$\n\n(7.127)\n\n由函数 *φ*(**a**, **z**) (7.98) 的定义，\n\
  \n$$\\begin{array}{r} \\left. \\max_{\\zeta \\in I^{n}} \\middle| \\varphi(\\zeta,\\\
