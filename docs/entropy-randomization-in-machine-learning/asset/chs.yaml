  \n图 11.4： 预测轨迹的集合。\n\n## 11.3 电力系统日用电负荷的随机化预测\n\n电力系统的日用电负荷 `L` 取决于许多不同的因素。下面的分析仅限于最显著的外部因素之一——环境温度\
  \ `T`。日温度变化是波动的。这些波动会影响用电负荷，但由于电力网络从发电机向消费者输送电能的惯性，会有一定的时间延迟。\n\n### 11.3.1 电负荷模型\n\
  \n电负荷模型（`LT` 模型）描述了电负荷与环境温度之间的动态关系，而环境温度模型（`Tξ` 模型）描述了环境温度的日动态。存在相当多的 `LT` 模型版本，尽管所有都是静态的，即描述当前时刻电负荷与环境温度之间的关系\
  \ [49]。日温度动态是波动的，这种波动例如由周期自回归模型描述 [13]。\n\n请注意，环境温度对电负荷的影响是动态的，即由于温度在给定时刻引起的负荷变化取决于其在之前时刻的值。环境温度波动也具有类似的特性。\n\
  \n因此，遵循一般的随机化方法，`LT` 模型被设计为具有随机参数的一阶动态回归模型；`Tξ` 模型则为具有随机参数和随机输入 `ξ` 的二阶动态回归。然后 `LTξ`\
  \ 模型是上述两个模型的组合。\n\n在线性模型类中，一阶随机动态回归负荷-温度模型（`LT` 模型）可以写成如下形式\n\n$$\\\\begin{array}{r}\
  \ {L\\\\lbrack n\\\\rbrack = aL\\\\lbrack n - 1\\\\rbrack + bT\\\\lbrack n\\\\rbrack,}\
  \ \\\\\\\\ {v\\\\lbrack n\\\\rbrack = L\\\\lbrack n\\\\rbrack + \\\\mu\\\\lbrack\
  \ n\\\\rbrack,\\\\text{\\\\quad\\\\quad}n = \\\\overline{1,24}.} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(11.28)\n\n其中随机独立参数 `a` 和 `b` 取值于区间内\n\n$$\\\\begin{array}{r} {a \\\\in \\\
  \\mathcal{A} = \\\\lbrack a^{-},a^{+}\\\\rbrack,\\\\,\\\\, b \\\\in \\\\mathcal{B}\
  \ = \\\\lbrack b^{-},b^{+}\\\\rbrack.} \\\\\\\\ \\\\end{array}$$  \n\n(11.29)\n\n\
  概率特性由定义在集合 \U0001D49C 和 ℬ 上的概率密度函数 `P(a)` 和 `F(b)` 刻画。模拟电负荷测量误差的随机噪声 `μ[n]` 也是区间类型的。在一般情况下，对于每个时刻，区间可能具有不同的极限，即\n\
  \n$$\\\\begin{array}{r} {\\\\mu\\\\lbrack n\\\\rbrack \\\\in \\\\mathcal{M}\\_{n}\
  \ = \\\\lbrack\\\\mu^{-}\\\\lbrack n\\\\rbrack\\\\rbrack,\\\\mu^{+}\\\\lbrack n\\\
  \\rbrack\\\\rbrack,} \\\\\\\\ \\\\end{array}$$  \n\n(11.30)\n\n其概率密度函数为 `Mn`， \\\
  ], $n = \\\\overline{n^{-},n^{+}}.$\n\n考虑 `Tξ` 模型。日温度变化的波动特性由二阶随机动态回归模型描述\n\n$$\\\
  \\begin{aligned} {\\\\tau\\\\lbrack n\\\\rbrack} & {= c\\\\left( {2,1\\\\tau\\\\\
  lbrack n - 1\\\\rbrack - 1,1\\\\tau\\\\lbrack n - 2\\\\rbrack} \\\\right),\\\\quad\
  \ c = \\\\frac{1}{1 + \\\\omega^{2}},} \\\\\\\\ {T\\\\lbrack n\\\\rbrack} & {= t\
  \ + \\\\tau\\\\lbrack n\\\\rbrack + \\\\xi\\\\lbrack n\\\\rbrack,} \\\\\\\\ \\\\\
  end{aligned}$$  \n\n(11.31)\n\n其中 `ω` 为温度波动频率，`t` 为日平均温度。这些参数是随机的并取值于给定区间内，即\n\n\
  $$\\\\begin{array}{r} {\\\\omega \\\\in \\\\Omega = \\\\lbrack\\\\omega^{-},\\\\\
  omega^{+}\\\\rbrack,\\\\text{\\\\quad\\\\quad}c \\\\in \\\\mathcal{C} = \\\\lbrack\
  \ c^{-},c^{+}\\\\rbrack,} \\\\\\\\ {c^{-} = \\\\frac{1}{1 + {(\\\\omega^{+})}^{2}}\
  \ > 0,\\\\quad c^{+} = \\\\frac{1}{1 + {(\\\\omega^{-})}^{2}} > c^{-} > 0.} \\\\\
  \\\\ \\\\end{array}$$  \n\n(11.32)\n\n参数的概率特性由定义在相应区间上的概率密度函数 `W(c)` 刻画。\n\n方程 (11.3.1)\
  \ 包含由独立随机变量 `ξ[n]` 描述的随机噪声；在每次测量 `n` 中，其值可能位于不同的区间内，即\n\n$$\\\\begin{array}{r} {\\\
  \\xi\\\\lbrack n\\\\rbrack \\\\in \\\\Xi\\_{n} = \\\\lbrack\\\\xi\\_{n}^{-},\\\\\
  xi\\_{n}^{+}\\\\rbrack.} \\\\\\\\ \\\\end{array}$$  \n\n(11.33)\n\n随机变量 `ξ[n]` 的概率特性由概率密度函数\
  \ $Q\\_{n}(\\\\xi\\\\lbrack n\\\\rbrack),\\\\, n = \\\\overline{n^{-},n^{+}}.$ 刻画。\n\
  \n因此，描述电力系统中电负荷动态的方程 (11.28, 11.31) 由以下概率密度函数刻画：\n\n* `LT` 模型，由模型参数的概率密度函数 `P(a)`\
  \ 和 `F(b)` 以及测量噪声的概率密度函数 `Mn`，$n = \\\\overline{n^{-},n^{+}};$ 组成；\n* `Tξ` 模型，由模型参数的概率密度函数\
  \ `W(c)` 以及测量噪声的概率密度函数 `Qn`，$n = \\\\overline{n^{-},n^{+}}.$ 组成。\n\n### 11.3.2 学习数据集\n\
  \n用于估计概率密度函数的归一化真实数据来自 `GEFCom2014` 数据集（见 [71]）的日用电负荷变化 0 ≤ `L[r]^(i)[n]` ≤ 1、日平均温度变化\
  \ 0 ≤ `t[r]^(i)` ≤ 1 以及温度偏差 0 ≤ `τ[r]^(i)[n]` ≤ 1 从日平均值。 （这里归一化意味着归约到单位区间。）\n\n\
  归一化过程按如下方式进行：\n\n$$\\\\begin{aligned} {L\\_{r}^{(i)}\\\\lbrack n\\\\rbrack} & {=\
