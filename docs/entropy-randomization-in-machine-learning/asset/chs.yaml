  \ \\\\max\\_{i} \\\\middle| v^{i} - v \\\\middle| \\\\leq h^{(m - 1)}\\\\gamma =\
  \ h^{(m + 1)}. \\\\right. \\\\\\\\ \\\\end{array}\n```\n\n(7.112)\n\n因此，由 (7.106–7.108)\
