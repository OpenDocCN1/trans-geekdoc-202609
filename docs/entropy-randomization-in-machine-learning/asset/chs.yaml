  quad W^{*}(c),\\, \\, i = \\overline{1,3},}\n\\\\\n{T[n]} & {= t + \\tau[n] + \\\
  xi[n],\\quad Q_{n}^{*}(\\xi[n]).}\n\\\\\n\\end{aligned}\n$$\n\n(11.46)\n\n相应的集合由使用接受-拒绝\
