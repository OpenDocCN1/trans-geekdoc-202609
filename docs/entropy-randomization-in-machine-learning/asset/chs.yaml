  \n(11.37)\n\n### 11.3.3Entropy-optimal probability density functions of parameters\
  \ and noises\n\nAccording to the approach described in Section 5, for the *LT* model\
  \ (11.28)–(11.30) the PDFs parameterized by the Lagrange multipliers *θ*^((*i*)) = {*θ*[1]^((*i*)),…,*θ*[24]^((*i*))}\
  \ have the form\n\n$$\\\\begin{aligned} & {P\\_{i}^{\\*}(a,\\\\theta^{(i)}) = \\\
  \\frac{l\\_{r}^{(i)}(\\\\theta)\\\\exp\\\\left( {- al\\_{r}^{(i)}(\\\\theta)} \\\
  \\right)}{\\\\exp( - a^{-}l\\_{r}^{(i)}(\\\\theta)) - \\\\exp( - a^{+}l\\_{r}^{(i)}(\\\
  \\theta))},} \\\\\\\\ & {F\\_{i}^{\\*}(b,\\\\theta^{(i)}) = \\\\frac{h\\_{r}^{(i)}(\\\
  \\theta)\\\\exp\\\\left( {- bh\\_{r}^{(i)}(\\\\theta)} \\\\right)}{\\\\exp( - b^{-}h\\\
  _{r}^{(i)}(\\\\theta)) - \\\\exp( - b^{+}h\\_{r}^{(i)}(\\\\theta))},} \\\\\\\\ &\
  \ {M\\_{i,n}^{\\*}(\\\\mu\\\\lbrack n\\\\rbrack) = \\\\frac{\\\\theta\\_{n}^{(i)}\\\
  \\exp\\\\left( {- \\\\theta\\_{n}^{(i)}\\\\mu\\\\lbrack n\\\\rbrack} \\\\right)}{\\\
  \\exp( - \\\\mu^{-}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)}) - \\\\exp( - \\\\\
  mu^{+}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)})},\\\\quad n = \\\\overline{1,24}.}\
  \ \\\\\\\\ \\\\end{aligned}$$\n\n(11.38)\n\nwhere\n\n$$\\\\begin{array}{r} {l\\\
  _{r}^{(i)}(\\\\theta) = {\\\\sum\\\\limits\\_{n = 1}^{24}\\\\theta\\_{n}}L\\_{r}^{(i)}\\\
  \\lbrack n - 1\\\\rbrack,\\\\quad h\\_{r}^{(i)}(\\\\theta) = {\\\\sum\\\\limits\\\
  _{n = 1}^{24}\\\\theta\\_{n}}T\\_{r}^{(i)}\\\\lbrack n\\\\rbrack.} \\\\\\\\ \\\\\
  end{array}$$\n\n(11.39)\n\nThe Lagrange multipliers *θ*^((*i*)) are calculated by\
  \ solving the system of balance equations\n\n$$\\\\begin{array}{r} {L^{(i)}(\\\\\
  theta^{(i)}) + T^{(i)}(\\\\theta^{(i)}) + M\\_{n}^{(i)}(\\\\theta\\_{n}^{(i)}) =\
  \ L\\_{r}^{(i)}\\\\lbrack n\\\\rbrack,\\\\text{\\\\quad\\\\quad}n = \\\\overline{1,24},}\
  \ \\\\\\\\ \\\\end{array}$$\n\n(11.40)\n\nwhere\n\n$$\\\\begin{aligned} & {L^{(i)}(\\\
  \\theta^{(i)}) = \\\\frac{1}{\\\\exp( - a^{-}l^{(i)}(\\\\theta^{(i)})) - \\\\exp(\
  \ - a^{+}l^{(i)}(\\\\theta^{(i)}))} \\\\times} \\\\\\\\ & {\\\\text{\\\\quad\\\\\
  quad}\\\\quad \\\\times (\\\\exp( - a^{-}l\\_{r}^{(i)}(\\\\theta^{(i)}))(a^{-}l^{(i)}(\\\
  \\theta^{(i)}) + 1) -} \\\\\\\\ & {\\\\text{\\\\quad\\\\quad}\\\\quad - \\\\exp(\
  \ - a^{+}l\\_{r}^{(i)}(\\\\theta^{(i)}))(a^{+}l^{(i)}(\\\\theta^{(i)}) + 1)),} \\\
  \\\\\\ & {T^{(i)}(\\\\theta^{(i)}) = \\\\frac{1}{\\\\exp( - b^{-}h^{(i)}(\\\\theta^{(i)}))\
  \ - \\\\exp( - b^{+}h^{(i)}(\\\\theta^{(i)}))} \\\\times} \\\\\\\\ & {\\\\text{\\\
  \\quad\\\\quad}\\\\quad \\\\times (\\\\exp( - b^{-}h\\_{r}^{(i)}(\\\\theta^{(i)}))(b^{-}h^{(i)}(\\\
  \\theta^{(i)}) + 1) -} \\\\\\\\ & {\\\\text{\\\\quad\\\\quad}\\\\quad - \\\\exp(\
  \ - b^{+}h\\_{r}^{(i)}(\\\\theta^{(i)}))(b^{+}h^{(i)}(\\\\theta^{(i)}) + 1)),} \\\
  \\\\\\ & {M\\_{n}^{(i)}(\\\\theta\\_{n}^{(i)}) = \\\\frac{1}{\\\\theta\\_{n}^{(i)}\\\
  \\left( {\\\\exp( - \\\\mu^{-}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)}) - \\\\\
  exp( - \\\\mu^{+}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)})} \\\\right)} \\\\\
  times} \\\\\\\\ & {\\\\quad\\\\quad\\\\text{\\\\quad\\\\quad} \\\\times (\\\\exp(\
  \ - \\\\mu^{-}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)})(\\\\mu^{-}\\\\lbrack\
  \ n\\\\rbrack\\\\theta\\_{n}^{(i)}) + 1) -} \\\\\\\\ & {\\\\quad\\\\quad\\\\text{\\\
  \\quad\\\\quad} - \\\\exp( - \\\\mu^{+}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)})(\\\
  \\mu^{+}\\\\lbrack n\\\\rbrack\\\\theta\\_{n}^{(i)}) + 1)).} \\\\\\\\ \\\\end{aligned}$$\n\
  \n(11.41)\n\nConsider the *T**ξ* model. The corresponding entropy-optimal PDFs parameterized\
  \ by the Lagrange multipliers have the form\n\n$$\\\\begin{aligned} & {W\\_{i}^{\\\
  *}(c,\\\\eta^{(i)}) = \\\\frac{{\\\\widetilde{h}}\\_{r}^{(i)}(\\\\eta)\\\\exp\\\\\
  left( {- c{\\\\widetilde{h}}\\_{r}^{(i)}(\\\\eta)} \\\\right)}{\\\\exp( - a^{-}{\\\
