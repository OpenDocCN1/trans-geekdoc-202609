  lbrack j\\\\rbrack + {\\\\sum\\\\limits\\_{h = 1}^{R}\\\\left\\\\langle C\\_{h}\\\
  \\,\\\\mathbf{p}^{(h)},{\\\\widetilde{\\\\mathbf{X}}}^{(h)}\\\\lbrack j\\\\rbrack\
  \ \\\\right\\\\rangle},} \\\\\\\\ {\\\\hat{s}\\\\lbrack j\\\\rbrack} & {= {\\\\\
  sum\\\\limits\\_{h = 1}^{R}\\\\left\\\\langle \\\\mathbf{c}\\_{-}^{(h)},{\\\\widetilde{\\\
  \\mathbf{X}}}^{(h)}\\\\lbrack j\\\\rbrack \\\\right\\\\rangle}.} \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(6.38)\n\n因此，该结构类的模型在其参数上是线性的。\n\n## 6.3 最优性条件与熵最优归属概率的结构\n\nRPM-QuaRand\
  \ 模型的熵鲁棒估计问题被归类为有限维熵非线性规划问题。它们的非线性性质完全取决于 RPM-QuaRand 模型的非线性。特别地，如果动态模型由具有 图 4.11a\
  \ 所示结构的泛函 Volterra 级数表示，则估计问题中的容许集由具有幂非线性的等式系统描述。在这种情况下，容许集通常具有非凸构型，且最优性条件变为局部条件，因此只能数值使用。结果，我们无法从这些条件中提取解的共同结构性质（归属概率）。另一方面，对于可化为线性形式\
  \ (6.30, 6.38) 的一维 RPM-QuaRand 模型，我们可以建立全局最优性条件并分析解的结构性质。\n\n### 1. 归一化归属概率\n\n\
  在泛函模型框架内的一般问题由等式 (6.12–6.14) 刻画。它将被改编为泛函模型为一维且可化为线性形式 (6.30) 的情况：\n\n$$\\\\begin{aligned}\
  \ {s\\\\lbrack j\\\\rbrack} & {= \\\\hat{s}\\\\lbrack j\\\\rbrack + {\\\\sum\\\\\
  limits\\_{h = 1}^{R}{\\\\sum\\\\limits\\_{i = 1}^{V\\_{h}}p\\_{i}^{(h)}}}z\\_{i}^{(h)}\\\
  \\lbrack j\\\\rbrack + \\\\zeta\\_{j}^{-} + Z\\_{j}q\\_{j},} \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(6.39)\n\n$$\\\\begin{aligned} {\\\\hat{s}\\\\lbrack j\\\\rbrack} & {= {\\\
  \\sum\\\\limits\\_{h = 1}^{R}{\\\\sum\\\\limits\\_{i = 1}^{V\\_{h}}c\\_{-}^{(h)}}}(i)z\\\
  _{i}^{(h)}\\\\lbrack j\\\\rbrack,} \\\\\\\\ {z\\_{i}^{(h)}\\\\lbrack j\\\\rbrack}\
  \ & {= \\\\delta\\_{i}^{(h)}x\\_{i}^{(h)}\\\\lbrack j\\\\rbrack,\\\\text{\\\\quad\\\
  \\quad}\\\\delta\\_{i}^{(h)} = c\\_{i}^{(h, + )} - c\\_{i}^{(h, - )},\\\\quad i\
