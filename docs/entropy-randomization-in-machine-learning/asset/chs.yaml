  \nFigure 4.19\n\n## 4.3 “（单输入，反馈）- 集成输出” 动态随机参数模型\n\n### 4.3.1 定义和结构\n\n对于许多动态 RPM\
  \ 的结构设计，仅定义输入-输出关系是不够的。在这种情况下，我们必须反映被建模过程或对象的某些内部机制。可用以描述这些机制的数学框架涉及不同类别的方程。它们的一般结构由一个具有参数化映射\
  \ `G` 的特定模块和一个由参数化映射 `C` 表征的反馈回路组成，见 图 4.20。\n\n![Figure 4.20](img/fig4_20.jpg)\n\
  \nFigure 4.20\n\n在此图中，`x` ∈ `R^(n)` 表示模型输入；`y` ∈ `R^(m)` 为模型输出；最后，`z` ∈ `R^(d)`\
  \ 给出反馈模块输出。\n\n映射 `G` 和 `C` 描述了对象中运行过程的内部机制。采用函数描述对这些映射进行描述，引入以下记号：\n\n$$\\\\begin{aligned}\
  \ \\\\mathbb{G} & {= \\\\mathcal{G}\\\\left( \\\\mathbf{x}(\\\\tau),\\\\mathbf{z}(\\\
  \\tau),\\\\, \\\\middle| \\\\,\\\\mathbf{a};\\\\,\\\\tau \\\\in \\\\mathcal{T} \\\
  \\right),} \\\\\\\\ {\\\\mathbb{C}} & {= \\\\mathcal{C}\\\\left( \\\\mathbf{y}(\\\
  \\tau),\\\\, \\\\middle| \\\\,\\\\mathbf{c};\\\\,\\\\tau \\\\in \\\\mathcal{T} \\\
  \\right).} \\\\\\\\ \\\\end{aligned}$$  \n\n(4.68)\n\n泛函 `G` 和 `C` 分别包含随机参数 `a`\
  \ ∈ `R^(r)` 和 `c` ∈ `R^(h)`，其独立元素属于区间\n\n$$\\\\begin{array}{r} {\\\\mathbf{a} \\\
  \\in \\\\mathcal{A} = \\\\lbrack\\\\mathbf{a}^{-},\\\\mathbf{a}^{+}\\\\rbrack,\\\
  \\text{\\\\quad\\\\quad}\\\\mathbf{c} \\\\in \\\\mathcal{S} = \\\\lbrack\\\\mathbf{c}\\\
  _{-},\\\\mathbf{c}^{+}\\\\rbrack.} \\\\\\\\ \\\\end{array}$$  \n\n(4.69)\n\n\n\n\
  \n\nConsequently, the \\[(SI,FB)–EO\\] RPM can be written as\n\n$$\\\\begin{aligned}\
  \ {\\\\mathbf{y}(t)} & {= \\\\mathcal{G}\\\\left( \\\\mathbf{x}(\\\\tau),\\\\mathbf{z}(\\\
  \\tau)),\\\\, \\\\middle| \\\\,\\\\mathbf{a};\\\\,\\\\tau \\\\in \\\\mathcal{T}\
  \ \\\\right),} \\\\\\\\ {\\\\mathbf{z}(t)} & {= \\\\mathcal{C}\\\\left( \\\\mathbf{y}(\\\
  \\tau),\\\\, \\\\middle| \\\\,\\\\mathbf{c};\\\\, \\\\middle| \\\\,\\\\tau \\\\\
  in \\\\mathcal{T} \\\\right).} \\\\\\\\ \\\\end{aligned}$$  \n\n(4.70)\n\nThe functionals\
  \ in these equations may have different mathematical models, depending on the declared\
  \ properties of objects under analysis.\n\n### 4.3.2 Linear dynamic models\n\nThe\
  \ linear \\[(SI,FB)–EO\\] RPM have the structure illustrated in Fig. 4.20, except\
  \ for its blocks are described by *linear functionals \U0001D4A2 and \U0001D49E\
  \ with random parameters*. Assume that the input vector consists of *continuous\
  \ time-varying functions* and the parameters are time-invariable. Then *the integral\
  \ form of the linear \\[(SI,FB)–EO\\] RPM* can be written as\n\n$$\\\\begin{aligned}\
  \ {\\\\mathbf{y}(t)} & \\\\left. = {\\\\int\\_{\\\\mathcal{T}}G}(t - \\\\tau\\\\\
  , \\\\middle| \\\\,\\\\mathbf{a})\\\\,\\\\mathbf{x}(\\\\tau)\\\\, d\\\\tau + {\\\
  \\int\\_{\\\\mathcal{T}}F}(t - \\\\tau\\\\, \\\\middle| \\\\,\\\\mathbf{b})\\\\\
  ,\\\\mathbf{z}(\\\\tau)\\\\, d\\\\tau, \\\\right. \\\\\\\\ {\\\\mathbf{z}(t)} &\
  \ {= {\\\\int\\_{\\\\mathcal{T}}C}(t - \\\\tau)\\\\,\\\\mathbf{y}(\\\\tau)\\\\,\
  \ d\\\\tau.} \\\\\\\\ \\\\end{aligned}$$  \n\n(4.71)\n\nRecall that these equalities\
  \ involve vectors **x** ∈ *R*^(*n*), **y** ∈ *R*^(*m*) and **z** ∈ *R*^(*d*), as\
  \ well as the matrices $\\\\left. G(t\\\\, \\\\middle| \\\\,\\\\mathbf{a}) = \\\\\
  lbrack g\\_{ij}(t\\\\, \\\\middle| \\\\,\\\\mathbf{a}),\\\\, i = \\\\overline{1,m},\\\
  \\, j = \\\\overline{1,n}\\\\rbrack;\\\\, F(t\\\\, \\\\middle| \\\\,\\\\mathbf{b})\
  \ = \\\\lbrack f\\_{il}(t\\\\, \\\\middle| \\\\,\\\\mathbf{b}),\\\\, i = \\\\overline{1,m}\\\
  \\rbrack,\\\\, l = \\\\overline{1,d};\\\\, C(t\\\\, \\\\middle| \\\\,\\\\mathbf{b})\
  \ = \\\\lbrack c\\_{h,k}(t\\\\, \\\\middle| \\\\,\\\\mathbf{c}),\\\\, h = \\\\overline{1,d},\\\
  \\, k = \\\\overline{1,m}\\\\rbrack. \\\\right.$ As their elements the matrices\
  \ contain the pulse characteristics *g**i**j*, *f**i**l* and *c**h*, *k* with random\
  \ parameters described by the vectors **a**, **b** and **c**; the elements of these\
  \ vectors are independent and take values within the intervals\n\n$$\\\\begin{array}{r}\
  \ {\\\\mathbf{a} \\\\in \\\\mathcal{A} = \\\\lbrack\\\\mathbf{a}^{-},\\\\mathbf{a}^{+}\\\
  \\rbrack,\\\\quad\\\\mathbf{b} \\\\in \\\\mathcal{B} = \\\\lbrack\\\\mathbf{b}^{-},\\\
  \\mathbf{b}^{+}\\\\rbrack,\\\\quad\\\\mathbf{c} \\\\in \\\\mathcal{C} = \\\\lbrack\\\
  \\mathbf{c}^{-},\\\\mathbf{c}^{+}\\\\rbrack.} \\\\\\\\ \\\\end{array}$$  \n\n(4.72)\n\
  \nThe \\[(SI,FB)–EO\\] RPM can be transformed into the \\[SI–EO\\] RPM. In our case,\
  \ a most convenient approach is to employ the Fourier transform. First, eliminate\
  \ the vector **z** in (4.71) to get the equation\n\n$$\\\\begin{array}{r} \\\\left.\
  \ \\\\mathbf{y} = {\\\\int\\_{\\\\mathcal{T}}G}(t - \\\\tau\\\\, \\\\middle| \\\\\
