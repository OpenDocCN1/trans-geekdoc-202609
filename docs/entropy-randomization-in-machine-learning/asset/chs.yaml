  \n图 7.6\n\n## 7.3 利用蒙特卡罗方法计算多维积分\n\n由经验平衡约束诱导的拉格朗日乘子方程包含在单位体积域上的积分分量 (7.13, 7.14)。\n\
  \n这些积分将使用随机生成器按如下方式用蒙特卡罗方法计算。对于向量 **w** ∈ *I*^(*n*) ⊂ *R*^(*n*) 的每个元素，它产生长度为 *M*\
  \ 的随机数序列以形成 *N* = *M*^(*n*) 个随机向量（点） $\\\\mathbf{w}^{(i)},\\\\, i = \\\\overline{1,N}.$\
  \ 细节可参见 \\[147\\]。\n\n蒙特卡罗方法的一个主要困难是估计随机数序列长度 *M*（随机点数 *N*）以便以给定误差 *δ* 计算积分是否足够。显然，这种估计具有随机性，应配备相应的概率。\n\
  \n为了获得这些估计，将比较蒙特卡罗方法的两种实现策略。第一种策略涉及在 *I*^(*n*) 中从每个元素 *w*[*k*] 的均匀格子 \U0001D54A\
  [*k*] 构造的 *均匀正交格子 S*，步长为\n\n```\n\\\\begin{array}{r} {h = \\\\frac{1}{M}.} \\\\\\\
  \\ \\\\end{array}\n```\n\n(7.96)\n\n*I*^(*n*) 中的基本立方体具有相同的体积\n\n```\n\\\\begin{array}{r}\
  \ {v = h^{n} = \\\\left( \\\\frac{1}{M} \\\\right)^{n}.} \\\\\\\\ \\\\end{array}\n\
  ```\n\n(7.97)\n\n然后等式 (7.13, 7.14) 可以写成\n\n```\n\\\\begin{aligned} {\\\\widetilde{\\\
  \\mathbb{B}}(\\\\mathbf{z})} & {\\\\approx v{\\\\sum\\\\limits\\_{i = 1}^{N}\\\\\
  phi}(\\\\mathbf{w}^{i},\\\\mathbf{z}),} \\\\\\\\ {\\\\widetilde{\\\\mathbb{G}}(\\\
  \\mathbf{z})} & {\\\\approx v{\\\\sum\\\\limits\\_{i = 1}^{N}\\\\varphi}(\\\\mathbf{w}^{i},\\\
  \\mathbf{z}),} \\\\\\\\ \\\\end{aligned}\n```\n\n(7.98)\n\n其中\n\n```\n\\\\begin{aligned}\
  \ {\\\\phi(\\\\mathbf{w}^{i},\\\\mathbf{z})} & {= \\\\exp\\\\left( {- E(\\\\mathbf{z},\\\
  \\mathbf{w}^{(i)})} \\\\right),} \\\\\\\\ {\\\\varphi(\\\\mathbf{w}^{i},\\\\mathbf{z})}\
  \ & {= E(\\\\mathbf{z},\\\\mathbf{w}^{(i)})\\\\exp\\\\left( {- E(\\\\mathbf{z},\\\
  \\mathbf{w}^{(i)})} \\\\right).} \\\\\\\\ \\\\end{aligned}\n```\n\n(7.99)\n\n第二种策略基于从每个\
  \ *k* 次元素 **w** 的非均匀（随机）格子 ${\\\\hat{\\\\mathbb{S}}}\\_{k}$ 的乘积构造的 *非均匀（随机）正交格子\
  \ $\\\\hat{\\\\mathbb{S}}$*。与均匀格子不同，非均匀格子的步长为\n\n```\n\\\\begin{array}{r} {h\\_{k}^{(i)}\
  \ = w\\_{k}^{(i + 1)} - w\\_{k}^{(i)},} \\\\\\\\ \\\\end{array}\n```\n\n(7.100)\n\
  \n从而表示一个 *随机变量*。格子 $\\\\hat{\\\\mathbb{S}}$ 中的基本立方体具有 *随机* 体积 *v*^((1)), …, *v*^((*N*)),\
