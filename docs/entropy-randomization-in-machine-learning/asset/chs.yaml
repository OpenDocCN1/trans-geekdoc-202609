  \n（这里 *M* 表示集合中轨迹的数量。）\n\n有用的恢复数据在解决实际问题时可以提供帮助。\n\n# 第 3 章 降维方法\n\nDOI: [10.1201/9781003306566-3](https://doi.org/10.1201/9781003306566-3)\n\
  \n## 3.1 降维方法综述\n\n前几节所述的问题导向数据阵列可能包含意义不大的信息。这一假设构成了降维方法的理论基础。虽然任何降维都会导致对研究对象的信息损失，但考虑“最小损失”的降维是合理的。解决不同机器学习问题所积累的经验表明，降维问题与在所得降维数据上解决的问题是相互关联的。因此，不存在适用于任何问题的通用高效方法。需要注意的是，由于得到最优“随机化”估计的方程的特定性质，降维对于\
  \ RML 程序来说是一个相当紧迫的问题。这一特点解释了下面所选降维方法的选择。\n\n\n\n\n\n事实上，降维方法采用以下三种基本思想之一。第一个思想与描述来源不明的数据的矩阵有关。根据假设，该矩阵具有一个较小维度的核心，它集中了关于研究对象的[content]\n\
  \n事实上，降维方法采用以下三种基本思想之一。第一个思想与描述来源不明的数据的矩阵有关。根据假设，该矩阵具有一个较小维度的核心，它集中了关于研究对象的主要信息。在这种情况下，降维工具是数据矩阵的奇异分解及其奇异值按绝对大小的排序。\n\
  \n第二个思想是将现有数据视为随机数据，有时带有额外的统计性质。然后，进一步分析集中在协方差矩阵上，使用两种标准方法之一。按照第一种方法，应为变量分配某个连通性阈值，并消除两个变量中相关系数超过该阈值的一个变量。第二种方法基于协方差矩阵的奇异分解。\n\
  \n最后，第三种降维思想在于直接和逆投影。直接投影是在较小维度的空间上进行（按选择）。顾名思义，逆投影是相同的操作再投影回原始空间，得到了所谓的逆向量。很自然地，逆向量与原始向量不同。因此，有必要选择原始向量与逆向量之间距离的适当泛函，使其在相应的投影算子上最小化。\n\
  \n### 3.1.1 数据矩阵的奇异分解方法\n\n考虑一个尺寸为（`m` × `s`）的矩形数据矩阵 `A` 并回顾 [60] 中的一些定义。该矩阵 `A`\
  \ 的左奇异向量 $\\overset{\\rightarrow}{u}$ 是矩阵 `A A′` 的特征向量，其尺寸为（`m` × `m`）。该矩阵 `A` 的右奇异向量\
  \ $\\overset{\\rightarrow}{u}$ 是矩阵 `A′ A` 的特征向量，其尺寸为（`s` × `s`）。一个非负实值 `β` 是 `A`\
  \ 的奇异值，如果存在两个单位长度向量 $\\overset{\\rightarrow}{u} \\in R^{m}$ 和 $\\overset{\\rightarrow}{v}\
  \ \\in R^{s}$ 使得\n\n$$\\begin{array}{r} {A\\overset{\\rightarrow}{v} = \\beta\\\
  overset{\\rightarrow}{u},\\quad\\quad A^{\\prime}\\overset{\\rightarrow}{u} = \\\
  beta\\overset{\\rightarrow}{v}.} \\\\ \\end{array}$$\n\n(3.1)\n\n矩阵 `A` 的奇异分解由表示给出\n\
  \n$$\\begin{array}{r} {A = USV^{\\prime},} \\\\ \\end{array}$$\n\n(3.2)\n\n其中对角矩阵\
  \ `S` 的尺寸为（`m` × `s`），包含 `A` 的奇异值，而矩阵 `U` 和 `V` 的尺寸分别为（`m` × `m`）和（`s` × `s`），是酉矩阵\n\
  \n根据奇异分解的此定义，矩阵 `U` 和 `V` 不是唯一的，因此可以选取得使矩阵 `S` 的对角元素具有形式\n\n$$\\begin{array}{r}\
  \ {\\beta_{1} \\geq \\beta_{2} \\geq \\cdots \\geq \\beta_{r} > \\beta_{r + 1} =\
  \ \\cdots = \\beta_{m} = 0,} \\\\ \\end{array}$$\n\n(3.3)\n\n其中 `r` 表示矩阵 `S` 的秩。\n\
  \n不等式链 (3.3) 在主成分分析中起关键作用。第一个主成分是具有最大奇异值的那个（在当前记号中为 `β[1]`）。第二个连续分量对应于奇异值 `β[2]`，依此类推。最后一个主成分与最后一个非零奇异值\
  \ `β[r]` 相关联，其指标（下标）与矩阵 `A` 的秩一致。\n\n奇异值是通过求解以下问题计算的。考虑矩阵 `A` 的近似线性表示的形式\n\n$$\\\
  begin{array}{r} {A = USV^{\\prime} + C.} \\\\ \\end{array}$$\n\n(3.4)\n\n最小化\n\n\
  $$\\begin{array}{r} {\\varepsilon^{2} = \\text{tr}(CC^{\\prime})} \\\\ \\end{array}$$\n\
  \n(3.5)\n\n受归一化条件约束\n\n$$\\begin{array}{r} {U^{\\prime}U = VV^{\\prime} = I.} \\\
  \\ \\end{array}$$\n\n(3.6)\n\n如果矩阵 `A` 的秩 `r` > min(`m`, `s`)，则 `C` ≈ 0。满足等式 (3.2)\
  \ 的最小值 `r` 是矩阵 `A` 的秩。为了找到左和右奇异向量 ${\\overset{\\rightarrow}{u}}_{k}$，${\\overset{\\\
  rightarrow}{v}}_{k}$ 对于 `k` = 1, …, `r`，引入辅助归一化向量 ${\\overset{\\rightarrow}{a}}_{k},{\\\
  overset{\\rightarrow}{b}}_{k}$ 并定义向量 ${\\overset{\\rightarrow}{u}}_{k}$，${\\overset{\\\
  rightarrow}{v}}_{k}$ 为\n\n$$\\begin{array}{r} {{\\overset{\\rightarrow}{u}}_{k}\
  \ = \\frac{{\\overset{\\rightarrow}{a}}_{k}}{\\|{\\overset{\\rightarrow}{a}}_{k}\\\
  |},\\quad\\quad{\\overset{\\rightarrow}{v}}_{k} = \\frac{{\\overset{\\rightarrow}{b}}_{k}}{\\\
  |{\\overset{\\rightarrow}{b}}_{k}\\|}.} \\\\ \\end{array}$$\n\n(3.7)\n\n那么奇异值为\n\
  \n$$\\begin{array}{r} {\\lambda_{k} = \\|{\\overset{\\rightarrow}{a}}_{k}\\|\\|{\\\
  overset{\\rightarrow}{b}}_{k}\\|.} \\\\ \\end{array}$$\n\n(3.8)\n\n辅助向量由等式给出\n\n\
  $$\\begin{array}{r} {{\\overset{\\rightarrow}{a}}_{k} = \\frac{A\\,{\\overset{\\\
  rightarrow}{b}}_{k}}{{\\overset{\\rightarrow}{b}}_{k}\\,{\\overset{\\rightarrow}{b}}_{k}^{\\\
  prime}},\\quad{\\overset{\\rightarrow}{b}}_{k + 1} = \\frac{{\\overset{\\rightarrow}{a}}_{k}^{\\\
  prime}}{{\\overset{\\rightarrow}{a}}_{k}^{\\prime}\\,{\\overset{\\rightarrow}{a}}_{k}},\\\
  quad k = 1,2,\\ldots} \\\\ \\end{array}$$\n\n(3.9)\n\n在步骤 `k` = 1 时，矩阵 `A` 的行 ${\\\
  overset{\\rightarrow}{b}}_{1}$ 具有最大范数。在步骤 `k` = 2, 3, … 时，此过程迭代应用于矩阵 $A_{k + 1}\
  \ = A_{k} - {\\overset{\\rightarrow}{u}}_{k}\\lambda_{k}{\\overset{\\rightarrow}{v}}_{k}.$\
  \ 为了构造矩阵 $\\hat{A}[r] = U[r]S[r]V^{\\prime}$，只需计算矩阵 `U` 的 `r` 列和矩阵 `V′` 的 `r` 行。\n\
  \n### 3.1.2 主成分分析\n\n显然，主成分分析是用于数据阵列的最常用的降维方法 [10, 84, 127]。该方法至少存在三种基本版本，即通过线性小维度流形对数据进行近似；寻找在正交投影上具有最大数据展开（方差）的小维度子空间；寻找在正交投影上具有最大均方根距离的小维度子空间。基本版本涉及数据矩阵\
  \ $X = \\lbrack{\\overset{\\rightarrow}{x}}^{(1)},\\ldots,{\\overset{\\rightarrow}{x}}^{(m)}\\\
  rbrack$，其列向量 ${\\overset{\\rightarrow}{x}}^{(i)}$ 的维度为 `s`。\n\n为了阐明该方法思想，首先考虑 `s`\
  \ = 2 的情况。考虑由二维列组成的由一些变量（感兴趣的属性）的测量值组成的元素的数据矩阵。将其解释为平面上的点 {*x*[1]^((*i*)),*x*[2]^((*i*))}；参见\
  \ Fig. 3.1(a)。画一条线 *AB*，使得数据沿其发生 *最大* 变化。线 *AB* 是第一个主成分。对初始点在此线上进行投影并将其用作新的坐标轴 (Fig.\
  \ 3.1(b))。取表示初始点与其在轴 *AB* 上的投影之差的点，并再次画一条线 *CD*，使得这些差值沿其发生最大变化，如 Fig. 3.1(c) 所示。线\
  \ *CD* 是第二个主成分，依此类推。\n\n![Figure 3.1](img/fig3_1.jpg)\n\nFigure 3.1\n\n在一般多维情况下，主成分分析按照以下程序进行：\n\
  \n* 识别现有数据集的中心并将原点（即零阶主成分）置于该中心；\n* 找到最大数据变化的方向（第一个主成分）；\n\n\n\n\n\n*   求数据在第一主成分上的投影及其方差；\n\
  *   若方差较大，则寻找与第一主成分正交的最大变化新主方向，如此继续。\n\n该过程允许将初始数据矩阵 `X` 的维度为 (*s* × *m*) 替换为两个矩阵\
  \ `T` 和 `P`，其维度分别为 (*s* × *k*) 和 (*k* × *s*)，其中 *k* < *m*。该表示使用新的变量得到\n\n$$\n\\\
  begin{array}{r} {{\\overset{\\rightarrow}{t}}^{\\mspace{2mu}(j)} = {\\overset{\\\
  rightarrow}{p}}^{\\mspace{2mu}(j,1)}{\\overset{\\rightarrow}{x}}^{(1)} + \\cdots\
  \ + {\\overset{\\rightarrow}{p}}^{\\mspace{2mu}(j,m)}{\\overset{\\rightarrow}{x}}^{(m)},\\\
  quad j = \\overline{1,k},} \\\\ \\end{array}\n$$\n\n(3.10)\n\n其中 ${\\overset{\\\
  rightarrow}{t}}^{\\mspace{2mu}(j)}$ 和 ${\\overset{\\rightarrow}{p}}^{\\mspace{2mu}(j,i)},\\\
  \ i = \\overline{1,m},$ 分别表示矩阵 `T` 和 `P` 的列。新的变量 (3.10) 称为 *主成分*，矩阵 `T` 称为主成分矩阵。主成分的一个重要性质在于其正交性。因此，随着主成分数量的增加，矩阵\
  \ `T` 不会被重新配置。\n\n利用这些变量，矩阵 `X` 可以写成\n\n$$\n\\begin{array}{r} {X = \\hat{X} + E\
  \ = {\\sum\\limits_{j = 1}^{k}{\\overset{\\rightarrow}{t}}^{(j)}}{\\lbrack{\\overset{\\\
  rightarrow}{p}}^{(j)}\\rbrack}^{\\prime} + E,\\quad\\quad\\hat{X} = T\\, P^{\\prime}.}\
  \ \\\\ \\end{array}\n$$\n\n(3.11)\n\n这里 `E` 表示维度为 (*s* × *m*) 的残差矩阵。残差误差通过残差矩阵的某种数值特征来评估，例如相对方差\n\
  \n$$\n\\begin{array}{r} {D = 1 - \\frac{\\sum\\limits_{j = 1}^{s}{\\sum\\limits_{i\
  \ = 1}^{m}e_{ji}^{2}}}{\\sum\\limits_{j = 1}^{s}{\\sum\\limits_{i = 1}^{m}x_{ji}^{2}}},\\\
  quad e_{ji} = x_{ji} - {\\hat{x}}_{ji}.} \\\\ \\end{array}\n$$\n\n(3.12)\n\n存在许多用于计算主成分的递归算法，它们针对初始信息的具体情况而设计，并采用不同的数据处理方法。首先，对矩阵\
  \ `X` 进行中心化，即对每一列计算平均值\n\n$$\n\\begin{array}{r} {{\\overline{x}}_{j} = \\frac{1}{s}{\\\
  sum\\limits_{i = 1}^{m}x_{i}^{(j)}}} \\\\ \\end{array}\n$$\n\n(3.13)\n\n和标准差\n\n\
  $$\n\\begin{array}{r} {\\sigma_{j} = \\frac{1}{s}\\sqrt{\\sum\\limits_{i = 1}^{m}{(x_{ji}\
  \ - {\\overline{x}}_{j})}^{2}}.} \\\\ \\end{array}\n$$\n\n(3.14)\n\n用于计算主成分的修正数据矩阵\
  \ `X̃` 由元素构成\n\n$$\n\\begin{array}{r} {{\\widetilde{x}}_{ij} = \\frac{x_{ij} - {\\\
  overline{x}}_{j}}{\\sigma_{j}}.} \\\\ \\end{array}\n$$\n\n(3.15)\n\n寻找主成分的算法包括以下步骤。\n\
  \n1. 选择初始向量 $\\overset{\\rightarrow}{t}$ (3.10)。\n2. 计算 ${\\overset{\\rightarrow}{p}}^{\\\
  mspace{2mu}\\prime} = \\frac{{\\overset{\\rightarrow}{t}}^{\\mspace{2mu}\\prime}E_{j}}{{\\\
  overset{\\rightarrow}{t}}^{\\prime}\\overset{\\rightarrow}{t}}.$\n3. 计算 $\\overset{\\\
  rightarrow}{p} = \\frac{\\overset{\\rightarrow}{p}}{{({\\overset{\\rightarrow}{p}}^{\\\
  prime}\\overset{\\rightarrow}{p})}^{1/2}}.$\n4. 计算 $\\overset{\\rightarrow}{t} =\
  \ \\frac{E_{j}\\overset{\\rightarrow}{p}}{{\\overset{\\rightarrow}{p}}^{\\prime}\\\
  overset{\\rightarrow}{p}}.$\n5. 利用 (3.12) 求 `D` 并返回步骤 2。\n\n主成分的数量通过将相对方差 (3.12)\
  \ 与允许误差进行比较来确定。\n\n如前所述，矩形矩阵的奇异分解 (3.2) 与主成分分析相关联。这种关系的形式为\n\n$$\n\\begin{array}{r}\
  \ {T = US,\\quad P = V.} \\\\ \\end{array}\n$$\n\n(3.16)\n\n主成分分析及其改进在大量文献中被讨论，主要应用于分类和回归问题\
  \ \\[188\\]。\n\n### 3.1.3 随机投影方法\n\n与主成分分析类似，通过随机投影进行降维涉及一个线性变换 `f`:ℝ^(*n*)→ℝ^(*k*)\
  \ 对数据矩阵进行变换，并应用于对象由多维欧几里得空间中的点表示的问题 \\[20\\]。\n\n随机投影方法的思想基于 Johnson–Lindenstrauss\
  \ 引理 \\[83\\]：对于高维多维空间中的点集 `X`，存在一个维度较小但仍相当高的子空间，使得投影到该子空间上能够在平均意义上保持所有点之间的相对距离。变换的误差由值\
  \ `ε` ∈ (0, 1) 描述：\n\n$$\n\\begin{array}{r} {\\left( {1 - \\varepsilon} \\right)\\\
  left\\| {x_{1} - x_{2}} \\right\\|^{2} \\leq \\left\\| {f(x_{1}) - f(x_{2})} \\\
  right\\|^{2} \\leq \\left( {1 + \\varepsilon} \\right)\\left\\| {x_{1} - x_{2}}\
  \ \\right\\|^{2}} \\\\ \\end{array}\n$$\n\n(3.17)\n\n对所有向量 `x[1]`、 `x[2]` ∈ `X`\
  \ 成立。\n\n此外，原引理还给出了 `k` 的下界，即对象被投影到的子空间的维度。例如，对于 `N` 个点的集合，值 `k` 必须满足条件\n\n$$\n\\\
  begin{array}{r} {k > \\frac{8\\ln N}{\\varepsilon^{2}}.} \\\\ \\end{array}\n$$\n\
  \n(3.18)\n\n换句话说，投影子空间的最小可能维度不依赖于原始空间的维度，而仅取决于被投影对象的数量和变换误差。在各种特殊情况下，`k` 值的下界在 \\\
  [82, 86\\] 中得到了改进。\n\n考虑用于将对象从集合 `X` 投影的线性变换 `f`:ℝ^(*n*)→ℝ^(*k*)。它由维度为 [*k* × *n*]\
  \ 的矩形矩阵 `R` (*k* <  < *n*) 定义，形式为\n\n$$\n\\begin{array}{r} {X_{k \\times N}^{RP}\
  \ = R_{k \\times n}X_{n \\times N}.} \\\\ \\end{array}\n$$\n\n(3.19)\n\n事实证明，这种变换的矩阵\
  \ `R` 的元素可以由随机变量组成，这使得投影是随机的。在早期关于随机投影方法的著作 \\[30, 76, 108\\] 中，建议使用标准高斯分布 `N(0,\
  \ 1)` 的随机变量，并构造矩阵 `R` 使其行向量正交且长度为单位。\n\n后来在 \\[8\\] 中证明，矩阵 `R` 可以使用均匀分布获得，在由数据库中信息存储和整数计算决定的某些约束下。在这种情况下，建议由随机元素\
  \ `r[i j]` 组成矩阵 `R`，其形式为\n\n$$\n\\begin{array}{r} {r_{ij} = \\sqrt{3} \\times \\\
  left\\{ \\begin{aligned} {+ 1} & {\\text{with~probability~}\\frac{1}{6},} \\\\ 0\
  \ & {\\text{with~probability~}\\frac{2}{3},} \\\\ {- 1} & {\\text{with~probability~}\\\
  frac{1}{6}.} \\\\ \\end{aligned}~ \\right.} \\\\ \\end{array}\n$$\n\n(3.20)\n\n\
  因此，为了计算投影 `X^(RP)`，需要将矩阵 `R` 和 `X` 相乘，该变换的复杂度为 \U0001D4AA(`k n N`)。在主成分分析中，投影矩阵是维度为\
  \ [*n* × *n*] 的方阵，投影变换的复杂度为 \U0001D4AA(`n² N`)。因此，就计算效率而言，对于降维，随机投影方法优于主成分分析。\n\n\
  \n\n\n\n此外，还要注意为加速投影而进行的现有研究。其中一条研究方向聚焦于稀疏矩阵：正如 \\[20\\] 中所示，如果数据矩阵 `X` 的每一列最多有\
  \ `c` 个非零分量，则变换的复杂度降低为 \U0001D4AA(`c`*`k`*`N`)。数据稀疏性对随机投影方法效率的影响已在论文 \\[38, 87\\\
  ] 中研究。另一种加速投影的方法基于快速 Johnson–Lindenstrauss 变换 (`FJLT`) \\[9\\]，即一种随机傅里叶变换。\n\n随机投影方法用于降维的可能应用范围包括具有多维数据的广泛问题类。由于不同对象之间的相对距离在低维空间中得以保持，因此该集合的结构也得以保持，这在将对象划分为组时尤其重要，例如在分类和聚类中。因此，随机投影成为度量数据分析方法中的有效降维解决方案，例如用于聚类的\
  \ `k`-最近邻 (`kNN`) \\[30\\]、用于分类的支持向量机 (`SVM`) \\[27\\]，以及用于回归的最小二乘 (`LS`) 方法 \\\
  [116\\]。\n\n随机投影在处理大型多维稀疏数据集合时尤其有效，例如图像、文本、音频和视频数据等。在信号处理领域，专门研究使用随机投影进行数据分析和恢复的研究方向称为压缩感知；例如参见\
  \ \\[29, 46\\]。\n\n无论应用领域如何，无论原始数据由多维空间中的点集表示的性质和维度如何，使用随机投影都可以降低维度同时保持数据结构。而且，随机投影方法易于解释，并且即使在高维和超高维数据的情况下也不需要显著的计算资源，这与\
  \ `PCA` 和 `SVD` 等替代降维方法形成对比。\n\n然而，需要注意的是，随机投影仅适用于在降维数据上进行分析和计算的问题，而数据不用于可视化或恢复。例如，在图像的情况下，使用随机投影进行降维可能导致图像的视觉质量下降，无论是对人眼还是计算机视觉系统而言。\n\
  \n### 3.1.4 直接与逆投影\n\n考虑所有实矩阵 `A`[( `N` × `M` )] 的空间 `R`^(`N`*`M`)，其元素取随机值。\n\n\
  从原始空间 `R`^(`N`*`M`) 过渡到较小维度的空间 `R`^(`N`*`m`) 会导致前者元素所包含的信息损失。为了估计这些损失，有必要通过 *逆投影*\
  \ 返回到原始空间：`R`^(`N`*`m`)⇒`R`^(`N`*`M`)。该操作使用投影矩阵 `J`[( `m` × `M` )] 执行，给出矩阵 `X`[(\
  \ `N` × `M` )] = `D`[( `N` × `m` )]`J`[( `m` × `M` )] ∈ `R`^(`N`*`M`)。矩阵 `X`[( `N` × `M`\
  \ )] 和 `A`[( `N` × `M` )] 是同一空间的元素。因此，可以根据适当准则估计原始矩阵压缩的质量。\n\n在下文中，数据压缩的质量取决于投影矩阵\
  \ `S`[( `N` × `m` )] 和 `J`[( `m` × `M` )]，将以熵的术语进行估计。更具体地，引入矩阵 `X`[( `N` × `M` )]\
  \ 相对于矩阵 `A`[( `N` × `M` )] 的信息熵 \\[139\\]，\n\n$$\\\\begin{array}{r} \\\\left. H(X\\\
  \\, \\\\middle| \\\\, A) = - {\\\\sum\\\\limits\\_{i = 1}^{N}{\\\\sum\\\\limits\\\
  _{j = 1}^{M}x\\_{ij}}}\\\\ln\\\\frac{x\\_{ij}}{a\\_{ij}} = tr\\\\left( {X^{\\\\\
  intercal}Y} \\\\right), \\\\right. \\\\\\\\ \\\\end{array}$$\n\n(3.21)\n\n其中 `tr`\
  \ 表示矩阵迹，`Y` 是由元素组成的 (`N` × `M`) 维矩阵\n\n$$\\\\begin{array}{r} {y\\_{ij} = \\\\ln\\\
  \\frac{x\\_{ij}}{a\\_{ij}}.} \\\\\\\\ \\\\end{array}$$\n\n(3.22)\n\n此后，该熵将被称为 *信息交叉熵*\\\
  [158\\]。上面描述的直接-逆投影方法是随机数据矩阵压缩方法的核心。考虑一个非负数据矩阵 `U`，其维度为 (`m` × `s`)。需要将该矩阵压缩为维度为\
  \ (`n` × `r`) 的矩阵 `Z`，其中 `r` < `s` 且 `n` < `m`。该问题将分两阶段依次求解如下。首先，将矩阵 `U`[( `m` × `s`\
  \ )] 降维为矩阵 `Y`[( `m` × `r` )]，然后将后者压缩为矩阵 `Z`[( `n` × `r` )]。下面提出的方法将被称为 *熵降维 (EDR)\
  \ 方法*。\n\n*阶段 1* 引入矩阵 `Q`[( `s` × `r` )] 并执行直接投影以获得列压缩矩阵\n\n$$\\\\begin{array}{r}\
  \ {Y\\_{(m \\\\times r)} = U\\_{(m \\\\times s)}Q\\_{(s \\\\times r)}.} \\\\\\\\\
  \ \\\\end{array}$$\n\n(3.23)\n\n接下来，引入矩阵 `T`[( `r` × `s` )] 并执行逆投影，得到矩阵\n\n$$\\\\\
  begin{array}{r} {X\\_{(m \\\\times s)} = U\\_{(m \\\\times s)}Q\\_{(s \\\\times\
  \ r)}T\\_{(r \\\\times s)}.} \\\\\\\\ \\\\end{array}$$\n\n(3.24)\n\n矩阵 `X`[( `m` × `s`\
  \ )] 与原始矩阵 `U`[( `m` × `s` )] 具有相同的维度，并表征了阶段 1 中直接和逆投影的效果（损失）。\n\n数据矩阵的降维伴随着其中所包含的信息损失或相对信息熵的增加\
  \ \\[139\\]。对于该方法的阶段 1，矩阵 `X`[( `m` × `s` )] 相对于固定原始矩阵 `U`[( `m` × `s` )] 的信息交叉熵为\n\
  \n$$\\\\begin{aligned} \\\\left. H\\_{1}(X\\\\, \\\\middle| \\\\, U) \\\\right.\
  \ & \\\\left. = - {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\\sum\\\\limits\\_{j = 1}^{s}x\\\
  _{ij}}}(Q,T\\\\, \\\\middle| \\\\, U)\\\\ln\\\\frac{\\\\left. x\\_{ij}(Q,T\\\\,\
  \ \\\\middle| \\\\, U) \\\\right.}{u\\_{ij}} = \\\\right. \\\\\\\\ & \\\\left. \\\
  \\quad = H\\_{1}(Q,T\\\\, \\\\middle| \\\\, U)\\\\Rightarrow\\\\max\\_{(Q,T) \\\\\
  geq 0}, \\\\right. \\\\\\\\ \\\\end{aligned}$$\n\n(3.25)\n\n其中，根据 (3.24)，\n\n$$\\\
  \\begin{array}{r} \\\\left. x\\_{ij}(Q,T\\\\, \\\\middle| \\\\, U) = {\\\\sum\\\\\
  limits\\_{\\\\mu = 1}^{r}{\\\\sum\\\\limits\\_{\\\\nu = 1}^{s}t\\_{\\\\mu,j}}}q\\\
  _{\\\\nu,\\\\mu}u\\_{i\\\\nu}. \\\\right. \\\\\\\\ \\\\end{array}$$\n\n(3.26)\n\n\
  函数 (3.1.4) 的最大化最终得到熵最优投影矩阵 `Q`[( `s` × `r` )]^* 和压缩的第一阶段矩阵\n\n$$\\\\begin{array}{r}\
  \ {Y\\_{(m \\\\times r)}^{\\*} = U\\_{(m \\\\times s)}Q\\_{(s \\\\times r)}^{\\\
  *}.} \\\\\\\\ \\\\end{array}$$\n\n(3.27)\n\n*阶段 2* 第二阶段数据矩阵 `Y`[( `m` × `r` )] 的列数\
  \ `r` < `s` 已被降低。需要将该矩阵压缩到给定行数 `n` < `m`。引入矩阵 `B`[( `n` × `m` )] 和 `A`[( `m` × `n`\
  \ )] 分别执行直接和逆投影操作，类似于阶段 1：\n\n$$\\\\begin{array}{r} {Z\\_{(n \\\\times r)} = B\\\
  _{(n \\\\times m)}Y\\_{(m \\\\times r)},\\\\text{\\\\quad\\\\quad}G\\_{(m \\\\times\
  \ r)} = A\\_{(m \\\\times n)}Z\\_{(n \\\\times r)}.} \\\\\\\\ \\\\end{array}$$\n\
  \n(3.28)\n\n矩阵 `G`[( `m` × `r` )] 与原始第二阶段矩阵 `Y`[( `m` × `r` )] 具有相同的维度，并表征了阶段 2\
  \ 中直接和逆投影的效果（损失）。这些损失由信息交叉熵估计\n\n$$\\\\begin{aligned} \\\\left. H\\_{2}(G\\\\, \\\
  \\middle| \\\\, Y^{\\*}) \\\\right. & \\\\left. = - {\\\\sum\\\\limits\\_{i = 1}^{m}{\\\
  \\sum\\\\limits\\_{j = 1}^{r}g\\_{ij}}}(B,A\\\\, \\\\middle| \\\\, Y)\\\\ln\\\\\
  frac{\\\\left. g\\_{ij}(B,A\\\\, \\\\middle| \\\\, Y^{\\*}) \\\\right.}{y\\_{ij}}\
  \ = \\\\right. \\\\\\\\ & \\\\left. \\\\quad H\\_{2}(B,A\\\\, \\\\middle| \\\\,\
  \ Y^{\\*})\\\\Rightarrow\\\\max\\_{(B,A) \\\\geq 0}, \\\\right. \\\\\\\\ \\\\end{aligned}$$\n\
  \n(3.29)\n\n其中\n\n\n\n\n\n$$\\\\begin{array}{r} \\\\left. g_{ij}(B,A\\\\, \\\\middle|\
  \ \\\\, Y^{*}) = {\\\\sum\\\\limits_{\\\\beta = 1}^{n}{\\\\sum\\\\limits_{\\\\alpha\
  \ = 1}^{m}a_{i,\\\\beta}}}b_{\\\\beta,\\\\alpha}y_{\\\\alpha,j}^{*} \\\\right. \\\
  \\\\\\ \\\\end{array}$$  \n\n(3.30)\n\nand\n\n$$\\\\begin{array}{r} {y_{\\\\alpha,j}^{*}\
  \ = {\\\\sum\\\\limits_{eta = 1}^{s}u_{\\\\alpha,\\\\eta}}q_{\\\\eta,j}^{*}.} \\\
  \\\\\\ \\\\end{array}$$  \n\n(3.31)\n\n## 3.2 序贯过程的熵优化\n\n序贯过程的第一阶段是确定非负矩阵 `Q` 和\
  \ `T` 的最优元素：\n\n$$\\\\begin{array}{r} \\\\left. (Q^{*},T^{*}) = \\\\arg\\\\max_{(Q,T)\
  \ \\\\geq 0}H_{1}(Q,T\\\\, \\\\middle| \\\\, U). \\\\right. \\\\\\\\ \\\\end{array}$$\
  \  \n\n(3.32)\n\n该问题将使用基于投影梯度下降的迭代算法进行数值求解，该算法结合了标准梯度下降法和所有负元素的截断。\n\n### 3.2.1\
  \ 最优性条件和算法\n\n函数 `H``1` 对矩阵 `Q` 和 `T` 元素的梯度分量为\n\n$$\\\\begin{aligned} \\\\frac{\\\
  \\left. \\\\partial H(Q,T\\\\, \\\\middle| \\\\, U) \\\\right.}{\\\\partial q_{\\\
  \\nu,\\\\mu}} & {= {\\\\sum\\\\limits_{i = 1}^{m}{\\\\sum\\\\limits_{j = 1}^{s}\\\
  \\frac{\\\\left. \\\\partial h_{ij}(Q,T\\\\, \\\\middle| \\\\, U) \\\\right.}{\\\
  \\partial x_{ij}}}}\\\\frac{\\\\left. \\\\partial x_{ij}(Q,T\\\\, \\\\middle| \\\
  \\, U) \\\\right.}{\\\\partial q_{\\\\nu,\\\\mu}},} \\\\\\\\ & {\\\\quad\\\\nu =\
  \ \\\\overline{1,s},\\\\,\\\\mu = \\\\overline{1,r},} \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(3.33)\n\n$$\\\\begin{aligned} \\\\frac{\\\\left. \\\\partial H(Q,T\\\\,\
  \ \\\\middle| \\\\, U) \\\\right.}{\\\\partial t_{\\\\mu,j}} & {= {\\\\sum\\\\limits_{i\
  \ = 1}^{s}{\\\\sum\\\\limits_{j = 1}^{m}\\\\frac{\\\\left. \\\\partial h_{ij}(Q,T\\\
  \\, \\\\middle| \\\\, U) \\\\right.}{\\\\partial x_{ij}}}}\\\\frac{\\\\left. \\\\\
  partial x_{ij}(Q,T\\\\, \\\\middle| \\\\, U) \\\\right.}{\\\\partial t_{\\\\mu,j}},}\
  \ \\\\\\\\ & {\\\\quad\\\\mu = \\\\overline{1,r},\\\\, j = \\\\overline{1,s},} \\\
  \\\\\\ \\\\end{aligned}$$  \n\n(3.34)\n\n其中\n\n$$\\\\begin{aligned} & \\\\left.\
  \ h_{ij}(T,Q\\\\, \\\\middle| \\\\, X) = x_{ij}\\\\ln\\\\frac{x_{ij}}{u_{ij}}, \\\
  \\right. \\\\\\\\ & {\\\\frac{\\\\left. \\\\partial h_{ij}(T,Q\\\\, \\\\middle|\
  \ \\\\, X) \\\\right.}{\\\\partial x_{ij}} = \\\\ln\\\\frac{x_{ij}}{u_{ij}} + 1,\\\
  \\text{\\\\quad\\\\quad}i = \\\\overline{1,m},\\\\, j = \\\\overline{1,s};} \\\\\
  \\\\ \\\\end{aligned}$$  \n\n(3.35)\n\n$$\\\\begin{aligned} \\\\frac{\\\\left. \\\
  \\partial x_{ij}((Q,T\\\\, \\\\middle| \\\\, U)) \\\\right.}{\\\\partial q_{\\\\\
  nu,\\\\mu}} & {= t_{\\\\mu,j}\\\\, u_{i,\\\\nu},\\\\text{\\\\quad\\\\quad}\\\\nu\
