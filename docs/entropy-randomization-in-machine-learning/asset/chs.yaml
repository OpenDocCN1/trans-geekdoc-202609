  \n### 4.3.4 具有多项式非线性的非线性动态模型\n\n在前一小节中，我们研究了在 \\[SI–EO\\] RPM 中使用正交多项式的过程。现在考虑该过程应用于\
  \ \\[(SI,FB)–EO\\] RPMs。对于具有 Fig. 4.21(a) 所示结构的 \\[(SI,FB)–EO\\] RPM，\n\n$$\\\\\
  begin{aligned} {y(t)} & {= {\\\\int\\_{\\\\mathcal{T}}w}(t - \\\\tau)\\\\,{\\\\\
  sum\\\\limits\\_{k = 0}^{K}w\\_{k}}g\\_{k}(\\\\varepsilon(\\\\tau))\\\\, d\\\\tau,}\
  \ \\\\\\\\ {z(t)} & {= {\\\\int\\_{\\\\mathcal{T}}c}(t - \\\\tau)\\\\,{\\\\sum\\\
  \\limits\\_{m = 0}^{M}v\\_{m}}c\\_{m}(y(\\\\tau))\\\\, d\\\\tau,} \\\\\\\\ {\\\\\
  varepsilon(t)} & {= x(t) - z(t).} \\\\\\\\ \\\\end{aligned}$$  \n\n(4.91)\n\n![Figure\
  \ 4.21](img/fig4_21.jpg)\n\nFigure 4.21\n\n另一个 \\[(SI,FB)–EO\\] RPM（见 Fig. 4.21(b)）由以下方程组描述：\n\
  \n$$\\\\begin{aligned} {y(t)} & {= {\\\\sum\\\\limits\\_{k = 0}^{K}w\\_{k}}g\\_{k}(u(\\\
  \\tau))\\\\, d\\\\tau,} \\\\\\\\ {u(t)} & {= {\\\\int\\_{\\\\mathcal{T}}w}(t - \\\
  \\tau)\\\\,\\\\varepsilon(\\\\tau)\\\\, d\\\\tau,} \\\\\\\\ {e(t)} & {= {\\\\int\\\
  _{\\\\mathcal{T}}c}(t - \\\\tau)\\\\, y(\\\\tau)\\\\, d\\\\tau,} \\\\\\\\ \\\\end{aligned}$$\
  \  \n\n(4.92)\n\n$$\\\\begin{aligned} {z(t)} & {= {\\\\sum\\\\limits\\_{m = 0}^{M}v\\\
  _{m}}c\\_{m}(e(\\\\tau))\\\\, d\\\\tau,} \\\\\\\\ {\\\\varepsilon(t)} & {= x(t)\
  \ - z(t).} \\\\\\\\ \\\\end{aligned}$$  \n\n(4.93)\n\n这些 RPM 的参数 **w** 和 **v** 是随机的、独立的并且取值于区间\n\
  \n$$\\\\begin{array}{r} {\\\\mathbf{w} \\\\in \\\\mathcal{W} = \\\\lbrack\\\\mathbf{w}^{-},\\\
  \\mathbf{w}^{+}\\\\rbrack,\\\\text{\\\\quad\\\\quad}\\\\mathbf{v} \\\\in \\\\mathcal{V}\
  \ = \\\\lbrack\\\\mathbf{v}^{-},\\\\mathbf{v}^{+}\\\\rbrack.} \\\\\\\\ \\\\end{array}$$\
  \  \n\n(4.94)\n\n回想一下，正交多项式可用于逼近连续非线性函数，而且还能逼近不连续的非线性，这构成了其显著特征。然而，多项式的正交性仅在某个集合（定义域）和某个函数空间中成立。\n\
  \nSection 3.2 中正交多项式的使用过程自然地推广到 \\[(SI,FB)–EO\\] RPMs。\n\n\n\n\n\n## 4.4 随机参数和系综的概率特性\n\
  \nRML 程序中使用的模型具有 *随机化参数* 的实现，它们在这些模型的输出处生成随机对象（向量、轨迹、事件）的 *系综*。两者均以适当的概率特性来描述。\n\
  \n### 1. 随机化参数的概率特性\n\n所研究的 RPM 涉及具有期望概率特性的随机化区间型参数。我们将区分\n\n* *原始* 参数 `a` = {`a[1]`,…,`a[n]`}，其取值在具有任意大小面的\
  \ *n* 维平行六面体 `\U0001D49C` 内，即\n\n```\n\\begin{array}{r} {\\mathcal{A} = \\lbrack\\\
  mathbf{a}^{-},\\mathbf{a}^{+}\\rbrack = \\otimes_{i = 1}^{n}\\mathcal{A}_{i} = \\\
  lbrack a_{i}^{-},a_{i}^{+}\\rbrack,\\quad\\quad\\text{and}} \\\\ \\end{array}\n\
  ```\n(4.95)\n\n* *相对非负* 参数 `u` = {`u[1]`,…,`u[n]`}，其取值在具有单位面的 *n* 维非负平行六面体 `\U0001D4B0\
  ` 内，即\n\n```\n\\begin{array}{r} {\\mathcal{U} = \\lbrack\\mathbf{0},\\mathbf{1}\\\
  rbrack.} \\\\ \\end{array}\n```\n(4.96)\n\n相对非负参数与原始参数的关系为\n\n```\n\\begin{aligned}\
  \ a_{i} & {= a_{i}^{-} + u_{i}\\delta_{i},\\quad\\delta_{i} = a_{i}^{+} - a_{i}^{-},\\\
  quad\\quad i = \\overline{1,n},} \\\\ \\mathbf{a} & {= \\mathbf{a}^{-} + \\Delta\\\
  mathbf{u},\\quad\\quad\\Delta = \\text{diag}\\lbrack(a_{i}^{+} - a_{i}^{-})\\,,\\\
  , i = \\overline{1,n}\\rbrack.} \\\\ \\end{aligned}\n```\n(4.97)\n\n这些类型的模型参数根据期望的概率特性进行随机化，更具体地说，根据原始参数\
  \ `a` 的 PDF `P(a)` 和相对非负参数 `u` 的 PDF `W(u)` 进行随机化。一般情况下，向量 `a` 和 `u` 的元素可以相互关联。它们的\
  \ PDF 表示一般形式的多个变量函数。如果参数是独立的，则相应的 PDF 具有乘性结构：\n\n```\n\\begin{array}{r} {P(\\mathbf{a})\
  \ = {\\prod\\limits_{i = 1}^{n}P_{i}}(a_{i}),\\quad\\quad W(\\mathbf{u}) = {\\prod\\\
  limits_{i = 1}^{n}w_{i}}(u_{i}).} \\\\ \\end{array}\n```\n(4.98)\n\n为了使表述简洁，让我们引入以下术语缩写：\n\
  \n* `RPM-Orig` 表示具有原始参数 `a` 和 *PDF* `P(a)` 的随机化参数模型；\n* `RPM-Rel` 表示具有相对非负参数 `u`\
  \ 和 *PDF* `W(u)` 的随机化参数模型。\n\n### 2. 系综的经验概率特性\n\n随机化模型输出随机向量（静态模型）的系综、时变函数即轨迹（动态模型）的系综，或随机事件的系综。对于每个模型，这些系综都是通过生成其随机化参数而出现的。系综可以用数理统计的众所周知的概率特性以定量方式描述。\n\
  \n考虑在有限时间区间 `\U0001D4AF` = `[0, T]` 上的一组任意轨迹 `${\\hat{\\mathcal{Y}}}_{T}$` `ŷ(t)`，即由具有给定\
  \ PDF 的一维 `RPM-Orig` 模型生成的。这样的系综的示例在 Fig. 4.23 中给出。假设它包含 `N` 条轨迹。用 `ŷ(t*)` 表示其在固定值\
  \ `t` = `t*` 下的截集。该截集形成随机变量 `ŷ(t*)` 的值（实现）的集合，将用于经验估计。\n\n![Figure 4.23](img/fig4_24.jpg)\n\
  \nFigure 4.23\n\n*A) 均值轨迹的演化*。随机变量 `ŷ(t*)` 的均值由下式给出\n\n```\n\\begin{array}{r} {\\\
  overline{y}(t^{\\*}) = \\frac{1}{N}{\\sum\\limits_{k = 1}^{N}{\\hat{y}}^{(k)}}(t^{\\\
  *}),} \\\\ \\end{array}\n```\n(4.99)\n\n其中 `ŷ^{(k)}(t*)` 表示随机变量 `ŷ(t*)` 的实现。\n\
  \n对不同的时间 `t*` ∈ `\U0001D4AF` 计算这些均值，我们得到经验估计 `\\overline{y}(t_u^*), u ∈ \\overline{1,U}.`\
  \ 的集合。它们可以用连续曲线 `\\overline{y}(t),` 来近似，该曲线形成均值轨迹 [104]。\n\n*B) 经验方差管的演化*。取 Fig.\
  \ 4.23 中所示的系综 `${\\hat{\\mathcal{Y}}}_{T}$`，并考虑其截集 `ŷ(t*)`。定义随机变量\n\n```\n\\begin{array}{r}\
  \ {D(t^{\\*}) = {\\lbrack\\hat{y}(t^{\\*}) - \\overline{y}(t^{\\*})\\rbrack}^{2}.}\
  \ \\\\ \\end{array}\n```\n(4.100)\n\n该随机变量的均值（即随机变量 `ŷ(t*)` 的方差）由下式给出\n\n```\n\\\
  begin{array}{r} {\\overline{D}(t^{\\*}) = \\frac{1}{N - 1}{\\sum\\limits_{k = 1}^{N}D^{(k)}}(t^{\\\
  *}),} \\\\ \\end{array}\n```\n(4.101)\n\n其中 `D^{(k)}(t*)` 表示随机变量 `D(t*)` (4.100)\
  \ 的实现。\n\n引入随机变量 `ŷ(t*)` 相对于其均值 `\\overline{y}(t*)` 的标准差：\n\n```\n\\begin{array}{r}\
  \ {\\sigma(t^{\\*}) = \\sqrt{\\overline{D}(t^{\\*})}.} \\\\ \\end{array}\n```\n\
  (4.102)\n\n在假设 `t*` 取值于区间 `\U0001D4AF` 内的条件下，让我们用连续曲线——标准差轨迹 `σ(t)` 来近似得到的结果点。\n\
  \n定义两条轨迹，`δ_± = \\overline{y}(t) ± σ(t).` 域\n\n```\n\\begin{array}{r} {\\mathcal{D}\
  \ = \\left\\{ \\hat{y}:\\delta_{-}(t) \\leq \\hat{y}(t) \\leq \\delta_{+}(t) \\\
  right\\}} \\\\ \\end{array}\n```\n(4.103)\n\n将被称作 *标准差管*。 Figure 4.23 展示了关于均值轨迹\
  \ `\\overline{y}(t).` 的标准差管 `\U0001D49F`。\n\n*C) 经验概率密度函数的演化*。经验 PDF 的估计值可以用固定时间\
  \ `t*` 下随机变量实现 `ŷ(t*)` 构造。\n\n经验 PDF，即直方图 `p[ŷ(t*)]`，是根据众所周知的规则 [104] 构造的。用 `ŷ^-(t*)`\
  \ 和 `ŷ^+(t*)` 分别表示随机变量 `ŷ(t*)` 的左、右极限。接下来，将区间 `[ŷ^-(t*), ŷ^+(t*)]` 分成 `J` 个子区间\
  \ `η_j, (j = \\overline{1,J})`，其长度为 (`ŷ^+(t*)` − `ŷ^-(t*)`) / `J`。经验概率密度函数是随机变量\
  \ `ŷ(t*)` 的值落入子区间 `η_j, (j = \\overline{1,J}),` 的频率，即\n\n```\n\\begin{array}{r}\
  \ {p_{j} = \\frac{M_{j}}{M},} \\\\ \\end{array}\n```\n(4.104)\n\n其中 `M[j]` 给出子区间\
  \ `η[j]` 内 `ŷ(t*)` 的值的数量，`M` 是系综中轨迹的总数量。 Figure 4.24 提供了直方图 `p[ŷ(t*)]` 的示例。通过改变时间\
  \ `t*` 可以观察到直方图的演化。通常，系综包含非常多的轨迹。因此，直方图可以用连续曲线 `\\hat{P}[ŷ(t*)]` 以良好的精度近似。\n\n\
  ![Figure 4.24](img/fig4_24.jpg)\n\nFigure 4.24\n\n*D). 经验中位轨迹的演化*。通常经验 PDF 没有对称性。在这种情况下，中位轨迹似乎更有信息量。考虑\
  \ PDF `\\hat{P}[ŷ(t*)]`，并定义值 `z(t*)` 使得\n\n```\n\\begin{array}{r} {{\\int_{\\hat{y}^{-}(t^{\\\
  *})}^{z(t^{\\*})}\\hat{P}}(x)dx = {\\int_{z(t^{\\*})}^{\\hat{y}^{-}(t^{\\*})}\\\
  hat{P}}(x)dx.} \\\\ \\end{array}\n```\n(4.105)\n\n\n\n\n\nThe value `z(t*)` of the\
  \ random variable `ŷ(t*)` is called the median for the time `t*`. Performing these\
  \ calculations for all `t* ∈ \U0001D4AF`, obtain a continuous curve, which will\
  \ be called the median trajectory of the ensemble.\n\n### E). The evolution of the\
  \ α-quantiles of the empirical PDF\nFor a fixed time `t*`, introduce the empirical\
  \ probability density function\n\n$$\\begin{array}{r} {{\\hat{F}}_{t^{\\*}}(y) =\
  \ {\\int_{{\\hat{y}}^{-}(t^{\\*})}^{y}{\\hat{P}}_{t^{\\*}}}(v)dv.} \\\\ \\\\ \\\
  end{array}$$\n\n(4.106)\n\nAccording to the definition given in [104], the `α[t*]`-quantile\
  \ (`α[t*] ∈ [0, 1]`) of the distribution `F̂t*` of a random variable `y` is the\
  \ number `y[α[t*]]` satisfying the inequalities\n\n$$\\begin{array}{r} {Pb\\left\\\
  { y \\leq y_{\\alpha_{t^{\\*}}} \\right\\} \\leq \\alpha_{t^{\\*}}} \\\\ \\\\ \\\
  end{array}$$\n\n(4.107)\n\nand\n\n$$\\begin{array}{r} {Pb\\left\\{ y > y_{\\alpha_{t^{\\\
  *}}} \\right\\} \\leq 1 - \\alpha_{t^{\\*}},} \\\\ \\\\ \\end{array}$$\n\n(4.108)\n\
  \nwhere `Pb` denotes probability. The `α[t*]`-quantile is illustrated in Fig. 4.25(b).\
  \ By analogy with items A)–C), consider different cutsets `t* ∈ \U0001D4AF` of the\
  \ ensemble to get the `α[t]`-quantile trajectory, see Fig. 4.25(b).\n\n### F). The\
  \ evolution of the empirical confidence intervals and confidence levels\nThe `α[t*]`-quantile\
  \ allows us to define an interval (known as *the confidence interval*) that covers\
  \ the values of the random variable `ŷ(t*)` with the probability `α[t*]` (*the\
  \ confidence level*).\n\nBy definition, the confidence interval\n\n$$\\begin{array}{r}\
  \ {C_{t^{\\*}} = \\lbrack y_{1 - \\alpha_{t^{\\*}}/2},y_{1 + \\alpha_{t^{\\*}}/2}\\\
  rbrack} \\\\ \\\\ \\end{array}$$\n\n(4.109)\n\ncovers the values of the random variable\
  \ `ŷ(t*)` with the confidence level\n\n$$\\begin{array}{r} {P\\lbrack\\hat{y}(t^{\\\
  *}) \\in C_{t^{\\*}}\\rbrack = \\alpha_{t^{\\*}}.} \\\\ \\\\ \\end{array}$$\n\n\
  (4.110)\n\nLetting `t* = t ∈ \U0001D4AF` in both formulas, construct the confidence\
  \ domain `C(t)`, as illustrated in Fig. 4.25(c).\n\n![Figure 4.25](img/fig4_25.jpg)\n\
  \nFigure 4.25\n\n### 3. The moment characteristics of the ensemble\n\nConsider a\
  \ one-dimensional ensemble `${\\hat{\\mathcal{Y}}}_{T}$` consisting of random trajectories\
  \ `ŷ(t | a)`, where `t ∈ \U0001D4AF`. The parameters `a` are randomized with a\
  \ given PDF `P(a)`. Let `t = t*` be fixed. Then `ŷ(t* | a)` represents a function\
  \ of the random argument `a`.\n\nDefine its `kth moments` by\n\n$$\\begin{array}{r}\
  \ \\left. M_{k}(t^{\\*}) = \\mathcal{M}\\left\\{ y(t^{\\*}\\, \\middle| \\,\\mathbf{a})\
  \ \\right\\} = {\\int_{\\mathcal{A}}y^{k}}(t^{\\*}\\, \\middle| \\,\\mathbf{a})P(\\\
  mathbf{a})d\\mathbf{a}. \\right. \\\\ \\\\ \\end{array}$$\n\n(4.111)\n\nIntroduce\
  \ *the k-means* of these moments in the form\n\n$$\\begin{array}{r} {m_{k}(t^{\\\
  *}) = M_{k}^{1/k}(t^{\\*}).} \\\\ \\\\ \\end{array}$$\n\n(4.112)\n\nFor `k = 1`,\
  \ the moment coincides with its mean, i.e., `M[1] = m[1]`.\n\nAssuming `t*` to be\
  \ a variable that takes values within the interval `\U0001D4AF`, find the `kth moment\
  \ trajectory Mk` and the `k`-mean trajectory `mk`.\n\nIn some applications, the\
  \ object's output vector consists of the elements acting as the average functionals\
  \ with random parameters. For example, consider option trading [15, 182]. Each of\
  \ `r` financial derivatives contains `p` random parameters `a[1], …, a[p]`, which\
  \ are realized in the course of trading with some PDF `P(a)`. The relations between\
  \ the financial derivatives and parameters are described by functionals `\U0001D4A2\
  1, …, \U0001D4A2r`. As a rule, they belong to the class of power functionals; in\
  \ the elementary statement, these functionals have the form\n\n$$\\begin{array}{r}\
  \ {\\mathcal{G}_{1}(\\mathbf{a}) = {\\sum\\limits_{k = 1}^{p}c_{k}}a_{k},} \\\\\
  \ \\\\ \\end{array}$$\n\n$$\\begin{array}{r} {\\mathcal{G}_{2}(\\mathbf{a}) = {\\\
  sum\\limits_{k = 1}^{p}c_{k}}a_{k} + {\\sum\\limits_{k_{1} = 1}^{r}{\\sum\\limits_{k_{2}\
  \ = 1}^{r}c_{k_{1}k_{2}}}}a_{k_{1}}a_{k_{2}},} \\\\ \\\\ \\end{array}$$\n\n$$\\\
  ldots \\\\ \\\\$$\n\n$$\\begin{array}{r} {\\mathcal{G}_{r}(\\mathbf{a}) = {\\sum\\\
  limits_{k = 1}c_{k}}a_{k} + {\\sum\\limits_{k_{1},k_{2}}c_{k_{1},k_{2}}}a_{k_{1}}a_{k_{2}}\
  \ + \\ldots + {\\sum\\limits_{k_{1},\\ldots,k_{r}}c_{k_{1},\\ldots,k_{r}}}a_{k_{1}}\\\
  cdots a_{k_{r}}.} \\\\ \\\\ \\end{array}$$\n\nThe more efficient models that are\
  \ used to predict future mean prices involve the integral power functionals; their\
  \ cores depend on the time variables, `c(τ), c(τ[1], τ[2]), …`.\n\nIn both statements,\
  \ the relations under consideration give the mean prices of the financial derivatives,\
  \ i.e.,\n\n$$\\begin{array}{r} {{\\int_{\\mathcal{A}}\\mathcal{G}_{1}}(\\mathbf{a})P(\\\
  mathbf{a})d\\mathbf{a},\\,{\\int_{\\mathcal{A}}\\mathcal{G}_{2}}(\\mathbf{a})P(\\\
  mathbf{a})d\\mathbf{a},.....} \\\\ \\\\ \\end{array}$$\n\nThese mean price formulas\
  \ represent the combinations of the weighted moments of the random vector `a`. In\
  \ the option trading models, the object's output `y` is the predicted mean prices\
  \ for the corresponding financial derivatives.\n\n# CHAPTER 5 ENTROPY-ROBUST ESTIMATION\
  \ PROCEDURES FOR RANDOMIZED MODELS AND MEASUREMENT NOISES\n\nDOI: [10.1201/9781003306566-5](https://doi.org/10.1201/9781003306566-5)\n\
  \nThe main stage of each randomized machine learning procedure is to estimate the\
  \ probability density functions. Estimation involves input and output data arrays.\
  \ According to a common hypothesis, output arrays contain errors due to imperfect\
  \ measurements. The core of the estimation procedures consists in a model with *randomized*\
  \ interval-type parameters, which can be *original or relative*. A static model\
  \ with randomized parameters generates an ensemble of random vectors, whereas a\
  \ dynamic model an ensemble of random trajectories. They are characterized in terms\
  \ of different-order moments, which serve for balancing the model's output with\
  \ its input data.\n\nThe PDF estimation problem is formulated as the problem to\
  \ find the “best” functions under maximum uncertainty. The latter is measured using\
  \ the information entropy of the model and measurement noises. Maximizing the entropy,\
  \ we construct the entropy-optimal PDFs of the model parameters and the “worst”\
  \ PDFs of the noises in the sense of this criterion.\n\n## 5.1 Structure of Entropy-Robust\
  \ Estimation Procedure\n\nConsider the general phenomenological structure of the\
  \ estimation procedure. It represents a sequence of stages shown in Fig. 5.1. This\
  \ procedure yields the estimated PDFs of the model parameters and noises—`P*(a)`\
  \ and `$Q(\\overline{\\xi}),$` respectively.\n\n![Figure 5.1](img/fig5_1.jpg)\n\n\
  Figure 5.1\n\n**1. Data source (DS)** generates an array of input data vectors `x(t[1]),\
  \ …, x(t[s])` and a corresponding array of output data vectors `y(t[1]), …, y(t[s])`,\
  \ where `s` denotes the number of measurements, `x ∈ R^(n)` and `y ∈ R^(m)`. Sometimes,\
  \ it seems convenient to write these data arrays in the form of matrices `$X = [\\\
  \ x_{ij}\\ |\\ i = \\overline{1,n};\\ j = \\overline{1,s}\\ ]$` and `$Y = [\\ y_{ij}\\\
  \ |\\ i = \\overline{1,m};\\ j = \\overline{1,s}\\ ].$` By a standard assumption,\
  \ input data are measured perfectly and output data with errors, and this aspect\
  \ should be taken in account for estimation procedure design.\n\n**2. Randomized\
  \ parametric model (RPM)** generally represents a dynamic system with randomized\
  \ *original* parameters `a ∈ R^(r)` that take values within the `r`-dimensional\
  \ parallelepiped\n\n\n\n\n\n$$\n\\begin{array}{r}\n{\\mathbf{a} \\in \\mathcal{A}\
  \ = \\lbrack\\mathbf{a}^{-},\\mathbf{a}^{+}\\rbrack \\in R^{r},\\quad\\mathcal{A}\
  \ = {\\underset{i = 1}{\\overset{r}{\\cup}}\\mathcal{A}_{i}},\\text{\\quad\\quad}\\\
  mathcal{A}_{i} = \\lbrack a_{i}^{-},a_{i}^{+}\\rbrack.}\n\\\\\n\\end{array}\n$$\n\
  \n(5.1)\n\n随机原始参数的概率性质由概率密度函数 *P*(**a**) 描述。此类模型的模型将被称为 *RPM-Orig* 模型。\n\n在许多情况下，使用非负\
  \ *相对* 随机参数 **u** ∈ ℐ = \\[**0**, **1**\\]; ℐ ∈ *R*[+]^(*r*) 是合理的。回想一下它们与原始参数之间的关系为：\n\
  \n$$\n\\begin{array}{r}\n{\\mathbf{a} = \\mathbf{a}^{-} + A\\,\\mathbf{u},\\quad\\\
  mathbf{u} \\in \\mathcal{I},}\n\\\\\n\\end{array}\n$$\n\n(5.2)\n\n其中\n\n$$\n\\begin{array}{r}\n\
  {A = \\text{diag}\\,\\lbrack a_{i}^{+} - a_{i}^{-}\\\\, i = \\overline{1,r}\\rbrack.}\n\
  \\\\\n\\end{array}\n$$\n\n(5.3)\n\n随机相对参数的概率性质用概率密度函数 *W*(**u**) 来表征。此类模型的模型将被称为\
  \ *RPM-Rel* 模型。\n\n对于随机参数的 *每个实现*，模型生成具有给定概率密度函数的轨迹，其具有以下函数描述：\n\n* 对于 RPM-Orig\
  \ 模型，\n\n$$\n\\begin{aligned}\n\\left. \\mathbf{y}\\lbrack t_{j}\\, \\middle| \\\
  , P(\\mathbf{a})\\rbrack \\right. & {\\mathcal{B}\\lbrack\\mathbf{x}(t_{j},\\tau),\\\
  mathbf{a},P(\\mathbf{a});(t_{j},\\tau) \\in \\mathcal{T}\\rbrack,}\n\\\\\n& {\\\
  text{\\quad\\quad}j = \\overline{1,s};}\n\\\\\n\\end{aligned}\n$$\n\n(5.4)\n\n*\
  \ 对于 RPM-Rel 模型，\n\n$$\n\\begin{array}{r}\n\\left. \\mathbf{z}\\lbrack t_{j}\\,\
  \ \\middle| \\, W(\\mathbf{u})\\rbrack = \\mathcal{D}\\lbrack\\mathbf{x}(t_{j},\\\
  tau),\\,\\mathbf{a}^{-} + A\\,\\mathbf{u},\\, W(\\mathbf{u});(t_{j},\\tau) \\in\
  \ \\mathcal{T}\\rbrack,j = \\overline{1,s}. \\right.\n\\\\\n\\end{array}\n$$\n\n\
  公式 (5.4, 5.5) 中，ℬ 和 \U0001D49F 是积分泛函。\n\n在离散测量时刻，随机模型输出相应轨迹的集合，即\n\n* 对于 RPM-Orig\
  \ 模型，\n\n$$\n\\begin{array}{r}\n\\left. \\mathcal{Y}\\lbrack t_{j}\\, \\middle|\
  \ \\, P(\\mathbf{a})\\rbrack = \\left\\{ \\mathbf{y}\\lbrack t_{j}\\, \\middle|\
  \ \\, P(\\mathbf{a}) \\right\\},\\text{\\quad\\quad}t_{j} \\in \\mathcal{T},\\,\
  \ j = \\overline{1,s}, \\right.\n\\\\\n\\end{array}\n$$\n\n(5.5)\n\n* 对于 RPM-Rel\
  \ 模型，\n\n$$\n\\begin{array}{r}\n\\left. \\mathcal{Z}\\lbrack t_{j}\\, \\middle|\
  \ \\, W(\\mathbf{u})\\rbrack = \\left\\{ \\mathbf{z}\\lbrack t_{j}\\, \\middle|\
  \ \\, W(\\mathbf{u})\\rbrack,\\text{\\quad\\quad}t_{j} \\in \\mathcal{T},\\, j =\
  \ \\overline{1,s}. \\right. \\right.\n\\\\\n\\end{array}\n$$\n\n(5.6)\n\n### 3.\
  \ 测量误差生成器 (MEG)\n\n旨在模拟输出数据中的测量误差。该装置产生具有特定概率性质的随机向量集合。它由具有标准概率密度函数的向量随机化器 (*VR*)\
  \ 和将这些向量转换为具有给定概率密度函数的向量的转换器 (*C*) 组成。标准概率密度函数是随机向量在单位非负 *m*\\-维立方体上具有均匀分布的密度。转换器将这些向量转换为由模型机器学习定义的概率密度函数的随机向量。\n\
  \n因此，MEG 输出随机噪声向量 $\\overline{\\xi}(t_{j}) = {\\overline{\\xi}}^{(j)}, \\,(j = \\\
  overline{1,s}\\,),$ 其中 ${\\overline{\\xi}}^{(j)} \\in R^{m}.$ 以同样的方式描述通过矩阵 $\\left.\
  \ \\Xi = \\lbrack\\,\\xi_{ij}\\, \\middle| \\, i = \\overline{1,m};\\, j = \\overline{1,s}\\\
  ,\\rbrack. \\right.$ 积累数据后出现的噪声数组。\n\n假设噪声向量的元素是独立的并且属于区间\n\n$$\n\\begin{aligned}\n\
  {\\overline{\\xi}}^{(j)} & {\\in \\mathcal{K}_{j} = \\lbrack{\\overline{\\xi}}_{-}^{(j)},{\\\
  overline{\\xi}}_{+}^{(j)}\\rbrack,\\quad j = \\overline{1,s},}\n\\\\\n\\Xi & {\\\
  in \\mathcal{K} = \\otimes_{j = 1}^{s}\\mathcal{K}_{j}.}\n\\\\\n\\end{aligned}\n\
  $$\n\n(5.7)\n\n通常很有用引入相对非负向量 ${\\overline{\\eta}}^{(j)}$，其取值在单位非负 *m*\\-维立方体 ℰ[*j*] = \\\
  [**0**, **1**\\] 内。此外，定义辅助变量矩阵 $\\left. E = \\lbrack\\,\\eta_{ij}\\, \\middle| \\\
  , i = \\overline{1,m};\\, j = \\overline{1,s}\\,\\rbrack. \\right.$ 随机向量 ${\\overline{\\\
  xi}}^{(j)}$ 到向量 *η*^((*j*)) 的变换如下：\n\n$$\n\\begin{aligned}\n{{\\overline{\\xi}}^{(j)}\
  \ = {\\overline{\\xi}}_{-}^{(j)} +} & {K_{j}\\,{{\\overline{\\eta}}^{(j)}},\\quad\
  \ K_{j} = \\text{diag}\\,\\lbrack\\xi_{i, +}^{(j)} - \\xi_{i, -}^{(j)}\\rbrack,}\n\
  \\\\\n& {\\, i = \\overline{1,m};j = \\overline{1,s}.}\n\\\\\n\\end{aligned}\n$$\n\
  \n(5.8)\n\n噪声的概率性质由在 \U0001D4A6[*j*] (5.7) 上定义的概率密度函数 $Q_{j}({\\overline{\\xi}}^{(j)})$\
  \ 或在单位立方体 ℰ 上定义的概率密度函数 $G_{j}({\\overline{\\eta}}^{(j)})$ 表征。如果指定了这些密度函数，则 MEG 产生模拟的随机向量集合\n\
  \n* 原始噪声\n\n$$\n\\begin{array}{r}\n{\\mathcal{Q}_{j}\\lbrack Q_{j}({\\overline{\\\
  xi}}^{(j)})\\rbrack = \\left\\{ {\\overline{\\xi}}^{(j)}\\lbrack Q_{j}({\\overline{\\\
  xi}}^{(j)})\\rbrack \\right\\},\\text{\\quad\\quad}j = \\overline{1,s};}\n\\\\\n\
  \\end{array}\n$$\n\n(5.9)\n\n* 非负相对噪声\n\n$$\n\\begin{array}{r}\n{\\mathcal{G}_{j}\\\
  lbrack G_{j}({\\overline{\\eta}}^{(j)})\\rbrack = \\left\\{ {\\overline{\\eta}}^{(j)}\\\
  lbrack G_{j}({\\overline{\\eta}}^{(j)})\\rbrack \\right\\},\\text{\\quad\\quad}j\
  \ = \\overline{1,s}.}\n\\\\\n\\end{array}\n$$\n\n(5.10)\n\n### 4. 测量模型 (MM)\n\n\
  模拟测量误差对估计结果的影响。根据假设，这种影响可以用加性测量模型很好地描述。测量模型输出的集合具有以下形式：\n\n* 对于 RPM-Orig 模型，\n\n\
  $$\n\\begin{aligned}\n{\\mathcal{V}_{j}\\lbrack P(\\mathbf{a}),Q_{j}({\\overline{\\\
  xi}}^{(j)})\\rbrack} & {\\mathcal{Y}_{j}\\lbrack P(\\mathbf{a})\\rbrack + \\mathcal{Q}_{j}\\\
  lbrack Q_{j}({\\overline{\\xi}}^{(j)})\\rbrack,}\n\\\\\n& {j = \\overline{1,s};}\n\
  \\\\\n\\end{aligned}\n$$\n\n(5.11)\n\n* 对于 RPM-Rel 模型，\n\n![](img/math5_39.jpg)\n\
  \n### 5. 矩评估器 (ME)\n\n对测量模型生成的集合的矩特征进行在线计算。\n\n对于随机模型，集合由以下随机轨迹组成：\n\n* 对于 RPM-Orig\
  \ 模型，\n\n$$\n\\begin{array}{r}\n\\left. \\mathbf{v}(t_{j}) = \\mathbf{y}\\lbrack\
  \ t_{j}\\, \\middle| \\, P(\\mathbf{a})\\rbrack + {\\overline{\\xi}}^{(j)}\\lbrack\
  \ Q_{j}({\\overline{\\xi}}^{(j)})\\rbrack; \\right.\n\\\\\n\\end{array}\n$$\n\n\
  (5.12)\n\n* 对于 RPM-Rel 模型，\n\n$$\n\\begin{array}{r}\n\\left. \\mathbf{f}(t_{j})\
  \ = \\mathbf{z}\\lbrack t_{j}\\, \\middle| \\, W(\\mathbf{u})\\rbrack + {\\overline{\\\
  xi}}_{-}^{(j)} + K_{j}{\\overline{\\eta}}^{(j)}\\lbrack G_{j}({\\overline{\\eta}}^{(j)})\\\
  rbrack. \\right.\n\\\\\n\\end{array}\n$$\n\n(5.13)\n\n作为集合 \U0001D4B1[*j*] 和 ℱ[*j*]\
  \ 的数值特征，采用由 *k*\\-均值组成的向量，即第 *k* 个矩的 *k* 次方根（见 (4.111, 4.112)），即\n\n* 对于 RPM-Orig\
  \ 模型，\n\n$$\n\\begin{aligned}\n{\\mathbf{m}^{(k)}\\lbrack P(\\mathbf{a}),Q_{j}({\\\
  overline{\\xi}}^{(j)}),j\\rbrack} & {\\left\\{ \\lbrack M_{i}^{(k)}(j)\\rbrack^{1/k},\\\
  , \\middle| \\, i = \\overline{1,m} \\right\\},}\n\\\\\n& {j = \\overline{1,s};}\n\
  \\\\\n\\end{aligned}\n$$\n\n(5.14)\n\n* 对于 RPM-Rel 模型，\n\n\n\n\n\n$$\\\\begin{aligned}\
  \ {\\\\mathbf{n}^{(k)}\\\\lbrack W(\\\\mathbf{u}),G_{j}({\\\\overline{\\\\eta}}^{(j)},j)\\\
  \\rbrack} & {= \\\\left\\\\{ {\\\\lbrack N_{i}^{(k)}(j)\\\\rbrack}^{1/k},\\\\, \\\
  \\middle| \\\\, i = \\\\overline{1,m} \\\\right\\\\},} \\\\\\\\ & {j = \\\\overline{1,s}.}\
  \ \\\\\\\\ \\\\end{aligned}$$  \n\n(5.15)\n\n在这些公式中，对应向量元素的 `k`th 阶矩由下式给出\n\n$$\\\
  \\begin{aligned} {M_{i}^{(k)}(j) =} & \\\\left. \\\\int_{\\\\mathcal{A}}y_{i}^{k}(t_{j},\\\
  \\, \\\\middle| \\\\,\\\\mathbf{a})P(\\\\mathbf{a})d\\\\mathbf{a} + \\\\int_{\\\\\
  Xi_{j}}{\\\\lbrack\\\\xi_{i}^{(j)}\\\\rbrack}^{k}Q_{j}({\\\\overline{\\\\xi}}^{(j)})d\\\
  \\xi_{i}^{(j)}, \\\\right. \\\\\\\\ N_{i}^{(k)} & \\\\left. (j) = \\\\int_{\\\\\
  mathcal{U}}z_{i}^{k}(t_{j},\\\\, \\\\middle| \\\\,\\\\mathbf{u})W(\\\\mathbf{u})d\\\
  \\mathbf{u} + {\\\\lbrack\\\\xi^{(j})}\\\\rbrack_{i}^{k} + \\\\right. \\\\\\\\ &\
  \ {+ K_{ji}\\\\int_{\\\\mathcal{E}}{\\\\lbrack\\\\eta_{i}^{(j)}\\\\rbrack}^{k}G_{j}({\\\
  \\overline{\\\\eta}}^{(j)})d\\\\eta_{i}^{(j)}.} \\\\\\\\ \\\\end{aligned}$$  \n\n\
  (5.16)\n\n### 6. 平衡模型 (BM)\n\n`Balancing model (BM)` 用于将可用的输出数据 `y` 与集合 `\U0001D4B1\
  ` 或 `ℱ` 的接受特征进行比较。\n\n对于随机化模型，平衡约束的形式为\n\n$$\\\\begin{array}{r} {\\\\mathbf{m}^{(k)}\\\
  \\lbrack P(\\\\mathbf{a}),Q_{j}({\\\\overline{\\\\xi}}^{(j)}),j\\\\rbrack = \\\\\
  mathbf{y}(t_{j}),\\\\text{\\\\quad\\\\quad}j = \\\\overline{1,s};} \\\\\\\\ \\\\\
  end{array}$$  \n\n(5.17)\n\n$$\\\\begin{array}{r} {\\\\mathbf{n}^{(k)}\\\\lbrack\
  \ W(\\\\mathbf{u}),G_{j}({\\\\overline{\\\\eta}}^{(j)},j)\\\\rbrack = \\\\mathbf{y}(t_{j}),\\\
  \\text{\\\\quad\\\\quad}j = \\\\overline{1,s}.} \\\\\\\\ \\\\end{array}$$  \n\n\
  (5.18)\n\n### 7. 机器学习算法 (ML-A)\n\n`Machine learning algorithm (ML-A)` 的目的是为参数和测量噪声的概率密度函数形成最优估计。如前所述反复提及，随机化机器学习过程需要在由信息熵表征的最大不确定性下估计概率密度函数。因此，`ML-A`\
  \ 在可容许集合上以平衡约束 `(5.17, 5.18)` 的形式搜索其约束最大值。\n\n信息熵泛函 `ℋ` 定义在连续可微概率密度函数 `P(a)`、`Q1(overline{ξ}^{(1)})`、…、`Qs(overline{ξ}^{(s)})`\
  \ 的类上，它们分别描述了模拟测量误差的随机化参数和噪声的概率性质。熵泛函推广了信息熵的有限维概念。\n\n1865 年，德国物理学家 R. Clausius\
  \ 引入了一个物理量来表征热力学系统，称为 *熵*。\n\n$$\\\\begin{array}{r} {S = \\\\frac{\\\\Delta Q}{\\\
  \\Delta T}.} \\\\\\\\ \\\\end{array}$$\n\n1877 年，L. Boltzmann 建立了热力学熵 `S`（或物理熵 `E`）与热力学系统宏观态\
  \ (`ΔQ`、`T`) 的统计权重 `Z` 之间的关系。后来，利用微观态等概率的假设，M. Planck 将该关系写成\n\n$$\\\\begin{array}{r}\
  \ {S = k\\\\ln Z = E.} \\\\\\\\ \\\\end{array}$$\n\n这里 `k` = 1.38 ⋅ 10^( − 23) 表示玻尔兹曼常数。宏观态\
  \ (`ΔQ`、`T`) 的统计权重由构成该宏观态的所有可能微观态（组合）的数量来度量。回想一下，这些术语适用于所谓的（单原子或多原子）气体模型，该模型考虑由极多不可区分的粒子（分子）组成的系统（宏观系统）。系统宏观态的空间由\
  \ `m` 个不相交的子集组成，具有给定的容量 `G[1]`、…、`G[m]`（即粒子可以占据的状态数）。粒子以随机方式在这些子集的状态中分布，行为呈随机性，具有相同的概率且相互独立。设每个粒子被唯一标记，并列出所有标记粒子的所得子集；事实上，该列表是系统的微观态。当然，所考虑的列表体积巨大。可以提取具有相同粒子数\
  \ `N[k]` 在第 `k` 个子集中的子列表。粒子数 `N[k]` 是系统宏观态 `N` = `{N[1],…,N[m]}` 的一个元素。子列表中元素的数量（诱导给定宏观态的微观态的数量）称为其统计权重\
  \ `Z` = `Z(N[k])`。\n\n为了找到统计权重 `Z` 与宏观态特征 `N[k]`（填充第 `k` 个子集的粒子数）之间的关系，我们需要对宏观系统模型进行一定的推广。该推广涉及粒子在宏观态空间的子集上分布的先验概率\
  \ `a[1]`、…、`a[m]` 的信息，以及这些子集中状态的性质信息。注意，在气体模型中，先验概率被假定为相等，且未描述状态性质。\n\n考虑一个每个状态只能被一个粒子占据的宏观系统（否则状态为空）。子集中的此类状态数量为\
  \ `G[1]`、…、`G[m]`。分布机制具有以下组织。每个粒子可以 *占据* 第 `k` 个子集中的 `N[k]` 个状态，先验概率为 `a[k]`，随机且独立于其他粒子；因此，(`G[k]`\
  \ − `N[k]`) 个状态以先验概率 `(1 − a[k])` 保持空闲。用 `{N[k],(G[k]−N[k])}` 表示该事件。由于该分布机制中所有粒子的独立性，事件的概率构成\n\
  \n$$\\\\begin{array}{r} {a_{k}^{N_{k}}\\\\,{(1 - a_{k})}^{(G_{k} - N_{k})}.} \\\\\
  \\\\ \\\\end{array}$$\n\n填充状态数 `N[k]` 可以通过粒子在第 `k` 个子集上的不同分布来实现，即不同的微观态。这样的微观态数\
  \ `Z(N[k])` 是 `G[k]` 个粒子中 `N[k]` 个组合的数量：\n\n$$\\\\begin{array}{r} {C_{N_{k}}^{G_{k}}\
  \ = \\\\frac{G_{k}!}{N_{k}!\\\\,(G_{k} - N_{k})!}.} \\\\\\\\ \\\\end{array}$$\n\n\
  事件 `{N[k],(G[k]−N[k])}` 可以 *要么* 由第 1 个微观态实现，*要么* 由第 2 个微观态实现，…，*要么* 由第 `C[N[k]]^(G[k])`\
  \ 个微观态实现。因此，事件 `{N[k],(G[k]−N[k])}` 以概率发生\n\n$$\\\\begin{array}{r} {P_{k}(N_{k})\
  \ = \\\\frac{G_{k}!}{N_{k}!\\\\,(G_{k} - N_{k})!}\\\\, a_{k}^{N_{k}}\\\\,{(1 - a_{k})}^{(G_{k}\
  \ - N_{k})}.} \\\\\\\\ \\\\end{array}$$\n\n由于分布机制的所有参与者相互独立，该宏观系统的对应宏观态的概率由下式给出\n\
  \n$$\\\\begin{array}{r} {P(\\\\mathbf{N}) = {\\\\prod\\\\limits_{k = 1}^{m}P_{k}}(N_{k})\
  \ = {\\\\prod\\\\limits_{k = 1}^{m}\\\\frac{G_{k}!}{N_{k}!\\\\,(G_{k} - N_{k})!}}\\\
  \\, a_{k}^{N_{k}}\\\\,{(1 - a_{k})}^{(G_{k} - N_{k})}.} \\\\\\\\ \\\\end{array}$$\n\
  \n根据 Planck 的定义，物理熵与概率分布函数的对数成正比，因为统计权重是一个未归一化的分布。因此，\n\n$$\\\\begin{array}{r} {\\\
  \\left. S \\\\right.\\\\sim lnP(\\\\mathbf{N}).} \\\\\\\\ \\\\end{array}$$\n\n于是可得\n\
  \n$$\\\\begin{array}{r} {\\\\left. S \\\\right.\\\\sim{\\\\sum\\\\limits_{k = 1}^{m}\\\
  \\ln}G_{k}! - \\\\ln(G_{k} - N_{k})! - \\\\ln N_{k}! + N_{k}\\\\ln a_{k} + (G_{k}\
  \ - N_{k})\\\\ln(1 - a_{k}).} \\\\\\\\ \\\\end{array}$$\n\n由于 `N[k]` 的值很大，采用 Stirling\
  \ 近似\n\n$$\\\\begin{array}{r} {\\\\ln N! = N(\\\\ln N - 1).} \\\\\\\\ \\\\end{array}$$\n\
  \n在这种情况下，`S` 表达式的右手边可以写成常数与宏观态函数的和：\n\n$$\\\\begin{array}{r} {\\\\left. S \\\\right.\\\
  \\sim C + H_{F}(\\\\mathbf{N}).} \\\\\\\\ \\\\end{array}$$\n\n函数\n\n$$\\\\begin{array}{r}\
  \ {H_{F}(\\\\mathbf{N}) = - {\\\\sum\\\\limits_{k = 1}^{m}\\\\left\\\\lbrack {\\\
  \\, N_{k}\\\\frac{N_{k}}{{\\\\widetilde{a}}_{k}} + (G_{k} - N_{k})\\\\ln(G_{k} -\
  \ N_{k})\\\\,} \\\\right\\\\rbrack},\\\\quad{\\\\widetilde{a}}_{k} = \\\\frac{a_{k}}{1\
  \ - a_{k}},} \\\\\\\\ \\\\end{array}$$\n\n\n\n\n\nis called *广义费米信息熵*。对于该函数，定义域为\
  \ *m* 维平行六面体 `\U0001D4A9` = [`0`, `G`]，即容许宏观态的集合。若参数 `a` 和 `G` 满足条件\n\n$$\n\\begin{array}{r}\
  \ {G_{k}a_{k} = \\text{const},\\text{\\quad\\quad}N_{k} \\ll G_{k},} \\\\ \\end{array}\n\
  $$\n\n则 `H[F]`(`N`) 可变换为熵函数\n\n$$\n\\begin{array}{r} {H_{B}(\\mathbf{N}) = - {\\\
  sum\\limits_{k = 1}^{m}N_{k}}\\ln\\frac{N_{k}}{a_{k}G_{k}e},} \\\\ \\end{array}\n\
  $$\n\n其被称为 *广义玻尔兹曼信息熵*。该函数定义在非负象限 `\U0001D4A9` ∈ *R*+ 上，表示容许宏观态的集合。\n\n不可区分粒子在状态空间子集上的随机分布消耗\
  \ *r* 种资源（能量、时间、财务等）。这些资源的可用数量为 `q[1]`, …, `q[r]`。资源消耗由消耗函数 `Φ1`, …, `Φr` 刻画，其具有参数\
  \ `t`（特定消耗率）并依赖于宏观态向量 `N`。\n\n由于分布过程需要资源，只能实现满足条件的宏观态\n\n$$\n\\begin{array}{r} {\\\
  Phi_{i}(\\mathbf{t},\\mathbf{N}) = q_{i},\\quad i = \\overline{1,s};\\text{\\quad\\\
  quad}\\Phi_{i + s}(\\mathbf{t},\\mathbf{N}) = q_{i + s},\\quad i = \\overline{1,r-s}.}\
  \ \\\\ \\end{array}\n$$\n\n这些约束定义了所谓的资源集 `\U0001D49F`。该集合与容许宏观态的相应集合的交集给出 *容许集*\n\
  \n$$\n\\begin{array}{r} {\\mathcal{F} = \\mathcal{N}{\\cap \\mathcal{D}}.} \\\\\
  \ \\end{array}\n$$\n\n利用上述概念和术语，我们可以表述 *广义变分原理* 如下。*在宏观系统中实现的宏观态对应于广义信息熵的约束最大值*，即\n\
  \n$$\n\\begin{array}{r} \\left. H(\\mathbf{N})\\Rightarrow\\max\\text{~subject~to~}\\\
  ,\\, \\mathbf{N} \\in \\mathcal{F}. \\right. \\\\ \\end{array}\n$$\n\n## 5.2 用于概率密度函数的熵鲁棒估计算法\n\
  \nPDF 的估计算法构成了随机化机器学习程序的核心。它们面向随机化参数模型的相应类，即 RPM-Orig 模型和 RPM-Rel 模型。两类随机化模型存在技术差异。首先，将考虑\
  \ RPM-Orig 模型的估计算法，包括一般问题陈述和所得解的结构。然后将这些估计算法适配到 RPM-Rel 模型。\n\n### 5.2.1 RPM-Orig\
  \ 模型的估计算法\n\n根据 (5.4, 5.12)，在时刻 `t[j]` 时 RPM-Orig 模型的观测输出由下式描述\n\n$$\n\\begin{aligned}\
  \ {\\mathbf{v}(t_{j}) = \\mathbf{y}\\lbrack t_{j}} & \\left| \\, P(\\mathbf{a})\\\
  rbrack + {\\overline{\\xi}}^{(j)}\\lbrack Q_{j}({\\overline{\\xi}}^{(j)})\\rbrack,\
  \ \\right. \\\\ \\left. \\mathbf{y}\\lbrack t_{j}\\, \\middle| \\, P(\\mathbf{a})\\\
  rbrack = \\mathcal{B}\\lbrack\\mathbf{x} \\right. & \\left. ((t_{j},\\tau_{l}),\\\
  , \\middle| \\, l = \\overline{1,(j-1)}),\\mathbf{a}\\rbrack, \\right. \\\\ & {j\
  \ = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.19)\n\n这里，`ℬ` 表示维数为 (*m* × *n*)\
  \ 的矩阵泛函，其表征模型输出 `y(t[j])` 与由输入向量 `x(t[j], τ[1])`, …, `x(t[j], τ[(j − 1)])` 组成的数组之间的现有关系。测量误差由噪声向量\
  \ `${\\overline{\\xi}}^{(j)}.$` 模拟。RPM-Orig 模型输出 (5.2.1) 依赖于具有 PDF `P(a)` 的随机化参数\
  \ `a`，也依赖于具有 PDF `$Q_{j}({\\overline{\\xi}}^{(j)});$` 的随机化噪声向量 `${\\overline{\\\
  xi}}^{(j)}$`；见 (5.2.1)。关于这些 PDF 的可用先验信息（如有）以先验 PDF `P0` 和 `$Q_{j}^{0}({\\overline{\\\
  xi}}^{(j)}).$` 的形式表示。假设 PDF 属于 `ℂ¹` 类，即所有连续可微函数类。\n\n*对于 RPM-Orig 模型 (5.4)，其参数和测量噪声的\
  \ PDF 的熵鲁棒估计问题* 制定如下：\n\n* 最大化广义玻尔兹曼信息熵泛函 [149]\n\n$$\n\\begin{aligned} {\\mathcal{H}\\\
  lbrack P(\\mathbf{a}),\\overline{Q}(\\xi)\\rbrack =} & {- {\\int_{\\mathcal{A}}P}(\\\
  mathbf{a})\\,\\ln\\frac{P(\\mathbf{a})}{P_{0}(\\mathbf{a})}\\, d\\,\\mathbf{a} -}\
  \ \\\\ {- {\\sum\\limits_{j = 1}^{s}\\,}{\\int_{\\Xi_{j}}Q_{j}}({\\overline{\\xi}}^{(j)})}\
  \ & \\left. \\ln\\frac{Q_{j}({\\overline{\\xi}}^{(j)})}{Q_{j}^{0}({\\overline{\\\
  xi}}^{(j)})}d{\\overline{\\xi}}^{(j)}\\Rightarrow\\min_{P,Q_{1},...,Q_{s}} \\right.\
  \ \\\\ \\end{aligned}\n$$\n\n(5.20)\n\n* 约束条件为：\n\n  * –PDF 的归一化条件，即\n\n$$\n\\begin{array}{r}\
  \ {{\\int_{\\mathcal{A}}P}(\\mathbf{a})d\\mathbf{a} = 1,\\quad{\\int_{\\Xi_{j}}Q_{j}}({\\\
  overline{\\xi}}^{(j)})\\,\\ d{\\overline{\\xi}}^{(j)} = 1,\\quad j = \\overline{1,s},}\
  \ \\\\ \\end{array}\n$$\n\n(5.21)\n\n和\n\n  * –RPM-Orig 模型 (5.14) 输出的 *k*-均值与对象输出测量的平衡约束，即\n\
  \n$$\n\\begin{array}{r} {\\mathbf{m}^{(k)}\\lbrack P(\\mathbf{a}),Q_{j}({\\overline{\\\
  xi}}^{(j)}),j\\rbrack = \\mathbf{y}(t_{j}),\\quad j = \\overline{1,s}.} \\\\ \\\
  end{array}\n$$\n\n(5.22)\n\n由于 (5.13)，这些等式约束中的向量 `$\\mathbf{m}^{(k)}\\lbrack P(\\\
  mathbf{a}),Q_{j}({\\overline{\\xi}}^{(j)}),j\\rbrack$` 的分量为\n\n$$\n\\begin{aligned}\
  \ & {m_{i}^{(k)}\\lbrack j\\rbrack = \\left\\lbrack {\\int_{\\mathcal{A}}P}(\\mathbf{a})y_{i}^{k}\\\
  lbrack t_{j}\\, \\middle| \\, P(\\mathbf{a})\\rbrack\\, d\\mathbf{a} \\right\\rbrack^{1/k}\
  \ +} \\\\ & {\\text{\\quad\\quad} + \\left\\lbrack {{\\int_{\\Xi_{j}}\\,}Q_{j}({\\\
  overline{\\xi}}^{(j)})\\,{\\lbrack\\xi_{i}^{(j)}\\rbrack}^{k}\\, d\\xi_{i}^{(j)}}\
  \ \\right\\rbrack^{1/k},} \\\\ & {\\quad\\text{\\quad\\quad}\\text{\\quad\\quad}i\
  \ = \\overline{1,m},\\, j = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.23)\n\
  \n考虑平衡约束涉及 RPM-Orig 模型输出的 1-均值的情况：\n\n$$\n\\begin{aligned} \\left\\lbrack {\\int_{\\\
  mathcal{A}}P}(\\mathbf{a})\\mathbf{y}\\lbrack t_{j}\\, \\middle| \\, P(\\mathbf{a})\\\
  rbrack\\, d\\mathbf{a} \\right\\rbrack & {+ \\left\\lbrack {{\\int_{\\Xi_{j}}\\\
  ,}Q_{j}({\\overline{\\xi}}^{(j)})\\,{\\overline{\\xi}}^{(j)}\\, d{\\overline{\\\
  xi}}^{(j)}} \\right\\rbrack = \\mathbf{y}(t_{j}),} \\\\ & { \\quad j = \\overline{1,s}.}\
  \ \\\\ \\end{aligned}\n$$\n\n(5.24)\n\n在此优化问题中，泛函约束从 `ℂ¹` 类中提取所有容许函数的子集 `$\\Omega\\\
  lbrack P(\\mathbf{a}),Q(\\overline{\\xi})\\rbrack$`，其中 `$Q(\\overline{\\xi}) = \\\
  left\\{ Q_{1}({\\overline{\\xi}}^{(1)}),\\ldots,Q_{s}({\\overline{\\xi}}^{(s)})\
  \ \\right\\},$`。事实上，问题 (5.2.1)–(5.24) 是一个泛函熵-线性规划问题 [149]。它属于 Lyapunov 型优化问题类 77,\
  \ [174]，其中容许函数集由线性积分泛函系统描述。\n\n*对于 RPM-Orig 模型，熵鲁棒 RML 算法* 的形式为\n\n$$\n\\begin{array}{r}\
  \ {\\left\\lbrack {P(\\mathbf{a}),Q(\\overline{\\xi})} \\right\\rbrack^{\\*} = \\\
  arg\\max_{\\lbrack P(\\mathbf{a}),Q(\\overline{\\xi})\\rbrack}\\left\\{ \\mathcal{H},\\\
  , \\middle| \\,\\lbrack\\mathcal{P}(\\mathbf{a}),\\mathcal{Q}(\\overline{\\xi})\\\
  rbrack \\in \\Omega \\right\\},} \\\\ \\end{array}\n$$\n\n(5.25)\n\n\n\n\n\n其中容许集\
  \ `Ω` 由归一化条件 (5.21) 和经验平衡约束 (5.24) 给出。\n\n### 5.2.2 RPM-Rel 模型的估计算法\n\n在 RPM-Rel\
  \ 模型中，随机参数包括非负相对参数 `u` 和测量噪声 `{ \\overline{\\eta}^{(1)},\\ldots,\\overline{\\eta}^{(s)}\
  \ }`。根据 (5.13)，RPM-Rel 模型在时刻 *t*[*j*] 的可观测输出由\n\n$$\n\\begin{aligned} \\left. \\\
  mathbf{f}(t_{j}) = \\mathbf{z}\\lbrack t_{j}\\, \\middle| \\, W(\\mathbf{u})\\rbrack\
  \ \\right. & {+ \\overline{\\xi}_{-}^{(j)} + K_{j}\\overline{\\eta}^{(j)}\\lbrack\
  \ G_{j}(\\overline{\\eta}^{(j)})\\rbrack,} \\\\ \\left. \\mathbf{z}\\lbrack t_{j}\\\
  , \\middle| \\, W(\\mathbf{u})\\rbrack = \\mathcal{D}\\lbrack\\mathbf{x}(t_{j},\\\
  tau), \\right. & {\\mathbf{a}^{-} + A\\,\\mathbf{u},\\, W(\\mathbf{u});(t_{j},\\\
  tau) \\in \\mathcal{T}\\rbrack,} \\\\ & {j = \\overline{1,s}.} \\\\ \\end{aligned}\n\
  $$\n\n(5.26)\n\n描述。\n\n这里，`\U0001D49F` 表示维数为 (*m* × *n*) 的矩阵泛函，它表征了模型输出 `z(t[j])`\
  \ 与由输入向量 `x(t[j], τ[1])`，…，`x(t[j], τ[(j − 1)])` 组成的数组之间存在的关系。RPM-Rel 模型输出 (5.2.2)\
  \ 依赖于具有 PDF `W(u)` 的随机相对参数 `u`，也依赖于具有 PDF `G_{j}(\\overline{\\eta}^{(j)})` 的随机相对噪声向量\
  \ `\\overline{\\eta}^{(j)}`；参见 (5.2.2)。关于这些 PDF 的可用先验信息（如有）以先验 PDF `W0` 和 `G_{j}^{0}(\\\
  overline{\\eta}^{(j)})` 的形式表示。根据假设，PDF 属于所有连续可微函数类 `ℂ¹`。\n\n*对于 RPM-Rel 模型 (5.1)，其参数和测量噪声的\
  \ PDF 的熵鲁棒估计问题* 制定如下：\n\n* 最大化广义玻尔兹曼信息熵泛函\n\n$$\n\\begin{aligned} & {\\quad\\mathcal{H}\\\
  lbrack W(\\mathbf{u}),\\overline{G}(\\eta)\\rbrack = - {\\int_{\\mathcal{U}}W}(\\\
  mathbf{u})\\,\\ln\\frac{W(\\mathbf{u})}{W_{0}(\\mathbf{u})}\\, d\\,\\mathbf{u} -}\
  \ \\\\ & \\left. - {\\sum\\limits_{j = 1}^{s}\\,}{\\int_{\\mathcal{E}_{j}}G_{j}}(\\\
  overline{\\eta}^{(j)})\\,\\ln\\frac{G_{j}(\\overline{\\eta}^{(j)})}{G_{j}^{0}(\\\
  overline{\\eta}^{(j)})}d\\overline{\\eta}^{(j)}\\Rightarrow\\min_{W,\\overline{G}}\
  \ \\right. \\\\ \\end{aligned}\n$$\n\n(5.27)\n\n* 约束条件为：\n\n  * –PDF 的归一化条件，即\n\n\
  $$\n\\begin{array}{r} {{\\int_{\\mathcal{U}}W}(\\mathbf{u})d\\mathbf{u} = 1,\\text{\\\
  quad\\quad}{\\int_{\\mathcal{E}_{j}}G_{j}}(\\overline{\\eta}^{(j)})\\, d\\overline{\\\
  eta}^{(j)} = 1,\\quad j = \\overline{1,s},} \\\\ \\end{array}\n$$\n\n(5.28)\n\n\
  和\n\n  * –RPM-Rel 模型 (5.15) 输出的 *k*-均值与物体输出测量值之间的平衡约束，即\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{n}^{(k)}\\lbrack W(\\mathbf{u}),G_{j}(\\overline{\\eta}^{(j)}),j\\rbrack\
  \ = \\mathbf{y}(t_{j}),\\text{\\quad\\quad}j = \\overline{1,s}.} \\\\ \\end{array}\n\
  $$\n\n(5.29)\n\n由于 (5.15)，这些等式约束中的向量 `\\mathbf{n}^{(k)}\\lbrack W(\\mathbf{u}),G_{j}(\\\
  overline{\\eta}^{(j)}),j\\rbrack` 的分量为\n\n$$\n\\begin{aligned} {n_{i}^{(k)}\\lbrack\
  \ j\\rbrack} & {\\left[\\int_{\\mathcal{U}}W}(\\mathbf{u})z_{i}^{k}\\lbrack t_{j}\\\
  , \\middle| \\, W(\\mathbf{u})\\rbrack\\, d\\mathbf{u} \\right]^{1/k} +} \\\\ &\
  \ {\\left[\\int_{\\mathcal{E}_{j}}\\,}{G_{j}(\\overline{\\eta}^{(j)})\\,{\\lbrack\\\
  eta_{i}^{(j)}\\rbrack}^{k}\\, d\\eta_{i}^{(j)}} \\right]^{1/k},} \\\\ & {\\text{\\\
  quad\\quad}\\quad i = \\overline{1,m},\\, j = \\overline{1,s}.} \\\\ \\end{aligned}\n\
  $$\n\n(5.30)\n\n考虑平衡约束涉及 RPM-Rel 模型输出的 1-均值的情况：\n\n$$\n\\begin{aligned} {\\left[\\\
  int_{\\mathcal{U}}W}(\\mathbf{u})\\mathbf{z}\\lbrack t_{j}\\, \\middle| \\, W(\\\
  mathbf{u})\\rbrack\\, d\\mathbf{u} \\right] +} & {\\left[\\int_{\\mathcal{E}_{j}}\\\
  ,}{G_{j}(\\overline{\\eta}^{(j)})\\,{\\overline{\\eta}}^{(j)}\\, d\\overline{\\\
  eta}^{(j)}} \\right] = \\mathbf{y}(t_{j}),} \\\\ & {j = \\overline{1,s}.} \\\\ \\\
  end{aligned}\n$$\n\n(5.31)\n\n与上述优化问题一样，泛函约束从类 `ℂ¹` 中提取所有容许函数子集 `\\Psi\\lbrack W(\\\
  mathbf{u}),G(\\overline{\\eta})\\rbrack`，其中 `G(\\overline{\\eta}) = \\{ G_{1}(\\\
  overline{\\eta}^{(1)}),\\ldots,G_{s}(\\overline{\\eta}^{(s)}) \\}`。问题 (5.27-5.31)\
  \ 也是 Lyapunov 型。\n\n*对于 RPM-Rel 模型，熵鲁棒 RML 算法* 的形式为\n\n$$\n\\begin{array}{r} {\\\
  left[\\,W(\\mathbf{u}),\\overline{G}(\\overline{\\eta}) \\right]^{*} = \\arg\\max_{\\\
  lbrack W(\\mathbf{u}),\\overline{G}(\\overline{\\eta})\\rbrack}\\left\\{ \\mathcal{H},\\\
  , \\middle| \\,\\lbrack W(\\mathbf{u}),G(\\overline{\\eta})\\rbrack \\in \\Psi \\\
  right\\},} \\\\ \\end{array}\n$$\n\n(5.32)\n\n其中容许集 `Ψ` 由归一化条件 (5.28) 和经验平衡约束 (5.31)\
  \ 给出。\n\n### 5.2.3 具有输入和输出测量误差的 RPM-F 模型的估计算法\n\n前几节研究了仅在输出中出现的测量误差情况。然而，在许多应用中，输入数据集合也包含误差。因此，一般的\
  \ RML 过程应相应地修改。\n\n如果输入数据中存在误差，RPM-F 模型的观测输出采用以下形式：\n\n$$\n\\begin{array}{r} \\\
  left. \\mathbf{v}(t_{j}) = \\mathbf{y}\\lbrack t_{j}\\, \\middle| \\, F(\\mathbf{a},\\\
  overline{\\mu}^{(j)})\\rbrack + \\overline{\\xi}\\lbrack Q_{j}(\\overline{\\xi}^{(j)})\\\
  rbrack, \\right. \\\\ \\left. \\mathbf{y}\\lbrack t_{j}\\, \\middle| \\, F(\\mathbf{a},\\\
  overline{\\mu}^{(t_{j})})\\rbrack = \\mathcal{B}\\lbrack\\mathbf{x}(t_{j},\\tau)\
  \ + \\overline{\\mu}^{(t_{j})}\\rbrack. \\right. \\\\ \\end{array}\n$$\n\n(5.33)\n\
  \n这里 `\\overline{\\mu}^{(j)}` 表示在时刻 *t*[*j*] 的输入噪声向量，它们是区间型：\n\n$$\n\\begin{array}{r}\
  \ {{\\overline{\\mu}}^{(j)} \\in \\mathcal{M} = \\lbrack\\mu^{-},\\mu^{+}\\rbrack\\\
  quad\\text{for~all}\\, t_{j}.} \\\\ \\end{array}\n$$\n\n(5.34)\n\n由 RPM-F 模型方程 (5.33)\
  \ 可知，随机元素是参数 `a` 和输入噪声 `\\overline{\\mu}.` 它们的概率特性由联合概率密度函数 `F(a,\\overline{\\mu}^{(t_{j})})`\
  \ 表征。如果对该函数存在某些信息，则以先验 PDF `F_{0}(a,\\overline{\\mu}^{(t_{j})})` 的形式表示。\n\n*对于 RPM-F\
  \ 模型 (5.33)，其参数以及输入和输出测量噪声的 PDF 的熵鲁棒估计问题* 制定如下：\n\n* 最大化广义玻尔兹曼信息熵泛函\n\n$$\n\\begin{aligned}\
  \ {\\mathcal{H}\\lbrack F(\\mathbf{a},\\overline{\\mu}),\\overline{Q}(\\overline{\\\
  xi})\\rbrack} & {= - \\int_{\\mathcal{R}}F(\\mathbf{a},\\overline{\\mu})\\,\\ln\\\
  frac{F(\\mathbf{a},\\overline{\\mu})}{F_{0}(\\mathbf{a},\\overline{\\mu})}\\, d\\\
  ,\\mathbf{a}\\, d\\,\\overline{\\mu} -} \\\\ {- \\sum_{j = 1}^{s}\\,\\int_{\\Xi_{j}}}\
  \ & \\left. Q_{j}(\\overline{\\xi}^{(j)})\\,\\ln\\frac{Q_{j}(\\overline{\\xi}^{(j)})}{Q_{j}^{0}(\\\
  overline{\\xi}^{(j)})}d\\overline{\\xi}^{(j)}\\Rightarrow\\max_{F,\\overline{Q}}\
  \ \\right. \\\\ \\end{aligned}\n$$\n\n(5.35)\n\n* 约束条件为：\n\n  * —PDF 的归一化条件，即\n\n\
  \n\n\n\n$$\n\\begin{array}{r}\n{{\\int_{\\mathcal{R}}F}(\\mathbf{a},\\overline{\\\
  mu})\\, d\\mathbf{a}\\, d\\,\\overline{\\mu} = 1,\\quad\\quad{\\int_{\\Xi_{j}}Q_{j}}({\\\
  overline{\\xi}}^{(j)})\\, d{\\overline{\\xi}}^{(j)} = 1,\\quad j = \\overline{1,s};}\
  \ \\\\\n\\end{array}\n$$\n\n(5.36)\n\n* —the balance constraints for the *k*-means\
  \ of the observed output (5.33) and the real data, i.e.,\n\n$$\n\\begin{array}{r}\n\
  {\\mathbf{m}^{(k)}\\lbrack F(\\mathbf{a},\\overline{\\mu}),Q_{j}({\\overline{\\\
  xi}}^{(j)}),j\\rbrack = \\mathbf{y}(t_{j}),\\quad\\quad j = \\overline{1,s}.} \\\
  \\\n\\end{array}\n$$\n\n(5.37)\n\nDue to (5.15), the vector $\\mathbf{m}^{(k)}\\\
  lbrack F(\\mathbf{a},\\overline{\\mu}),Q_{j}({\\overline{\\xi}}^{(j)}),j\\rbrack$\
  \ in these equality constraints has the components\n\n$$\n\\begin{aligned}\n{m_{i}^{(k)}\\\
  lbrack j\\rbrack =} & {\\left\\lbrack {\\int_{\\mathcal{R}}F}(\\mathbf{a},\\overline{\\\
  mu})\\mathbf{y}\\lbrack t_{j}\\, \\middle| \\, F(\\mathbf{a},{\\overline{\\mu}}^{(t_{j})})\\\
  rbrack\\, d\\mathbf{a}d\\overline{\\mu} \\right\\rbrack^{1/k} +} \\\\\n& {\\left\\\
  lbrack {{\\int_{\\Xi_{j}}}\\,}Q_{j}({\\overline{\\xi}}^{(j)})\\,{\\lbrack\\xi_{i}^{(j)}\\\
  rbrack}^{k}\\, d\\xi_{i}^{(j)}} \\right\\rbrack^{1/k},} \\\\\n& {\\quad\\quad\\\
  quad i = \\overline{1,m},\\, j = \\overline{1,s}.} \\\\\n\\end{aligned}\n$$\n\n\
  (5.38)\n\nConsider the case in which the balance constraints involve the 1-mean\
  \ of the RPM-F model output:\n\n$$\n\\begin{aligned}\n{m_{i}^{(1)}\\lbrack j\\rbrack\
  \ =} & \\left. {\\int_{\\mathcal{R}}F}(\\mathbf{a},\\overline{\\mu})\\mathbf{y}\\\
  lbrack t_{j}\\, \\middle| \\, F(\\mathbf{a},{\\overline{\\mu}}^{(t_{j})})\\rbrack\\\
  , d\\mathbf{a}d\\overline{\\mu} + \\right. \\\\\n& {{\\int_{\\Xi_{j}}}\\,}Q_{j}({\\\
  overline{\\xi}}^{(j)})\\,\\lbrack\\xi_{i}^{(j)}\\rbrack d\\xi_{i}^{(j)},} \\\\\n\
  & {\\quad i = \\overline{1,m},\\, j = \\overline{1,s}.} \\\\\n\\end{aligned}\n$$\n\
  \n(5.39)\n\nLike in the optimization problem presented above, the functional constraints\
  \ extract the subset $\\Gamma\\lbrack F(\\mathbf{a},\\overline{\\mu}),Q(\\overline{\\\
  xi})\\rbrack$ of all admissible functions, where $Q(\\overline{\\xi}) = \\left\\\
  { Q_{1}({\\overline{\\xi}}^{(1)}),\\ldots,Q_{s}({\\overline{\\xi}}^{(s)}) \\right\\\
  },$ from the class ℂ¹. The problem (5.2.3—5.2.3) is also of the Lyapunov type.\n\
  \n*For the RPM-F model with input and output data errors, the entropy-robust RML\
  \ algorithm* has the form\n\n$$\n\\begin{array}{r}\n{\\left\\lbrack {F(\\mathbf{a},\\\
  overline{\\mu}),\\overline{Q}(\\overline{\\xi})} \\right\\rbrack^{\\*} = \\arg\\\
  max_{\\lbrack F(\\mathbf{a},\\overline{\\mu}),\\overline{Q}(\\overline{\\xi})\\\
  rbrack}\\left\\{ \\mathcal{H},\\, \\middle| \\,\\lbrack F(\\mathbf{a},\\overline{\\\
  mu}),\\overline{Q}(\\overline{\\xi})\\rbrack \\in \\Gamma \\right\\},} \\\\\n\\\
  end{array}\n$$\n\n(5.40)\n\nwhere the admissible set Γ is given by the normalization\
  \ conditions (5.36) and the empirical balance constraints (5.2.3).\n\n## 5.3 Optimality\
  \ Conditions for Lyapunov-Type Problems\n\nA comprehensive study of the Lyapunov-type\
  \ functional programming problems, including a possible application of Lagrange's\
  \ method of multipliers, can be found in the monographs \\[77, 174\\]. This section\
  \ will briefly describe a mathematical framework based on the cited results and\
  \ the Gateaux derivative \\[114\\].\n\nA minimization problem with integral nonlinear\
  \ functionals (a Lyapunov-type problem) can be written as\n\n$$\n\\begin{array}{r}\n\
  \\left. \\mathcal{J}\\lbrack f(\\mathbf{x})\\rbrack = {\\int_{\\mathcal{X}}\\Phi}\\\
  left\\lbrack {f(\\mathbf{x})} \\right\\rbrack d\\mathbf{x}\\Rightarrow\\min_{f(\\\
  mathbf{x})} \\right. \\\\\n\\end{array}\n$$\n\n(5.41)\n\nsubject to the constraints\n\
  \n$$\n\\begin{array}{r}\n{\\mathcal{G}_{i}\\lbrack f(\\mathbf{x})\\rbrack = {\\\
  int_{\\mathcal{X}}\\Psi_{i}}\\left\\lbrack {f(\\mathbf{x})} \\right\\rbrack d\\\
  mathbf{x} = 0,\\quad\\quad i = \\overline{1,m}.} \\\\\n\\end{array}\n$$\n\n(5.42)\n\
  \nHere **x** ∈ *R*^(*n*), the functions *Φ*\\[ • \\], *Ψ*[1]\\[ • \\], …, *Ψ*[*m*]\\\
  [ • \\] and also the desired function *f*( • ) that minimizes the functional \U0001D4A5\
  \\[ • \\] belong to the class *ℂ*¹ of all continuously differentiable functions.\n\
  \nDefine the Lagrange functional by\n\n$$\n\\begin{array}{r}\n{\\mathcal{L}\\lbrack\
  \ f(\\mathbf{x})\\rbrack = {\\int_{\\mathcal{X}}\\mathcal{J}}\\lbrack f(\\mathbf{x})\\\
  rbrack - {\\sum\\limits_{i = 1}^{m}\\lambda_{i}}{\\int_{\\mathcal{X}}\\Psi_{i}}\\\
  left\\lbrack {f(\\mathbf{x})} \\right\\rbrack d\\mathbf{x}.} \\\\\n\\end{array}\n\
  $$\n\n(5.43)\n\nThe first-order optimality condition claims that the variation of\
  \ this functional with respect to the function *f*(**x**) is zero, i.e.,\n\n$$\n\
  \\begin{array}{r}\n{\\delta\\mathcal{L} = 0.} \\\\\n\\end{array}\n$$\n\n(5.44)\n\
  \nBecause the function under variation belongs to the class ℂ¹, condition (5.44)\
  \ is equivalent to the zero value of the Gateaux derivative of the functional ℒ.\n\
  \nRecall the definition of the Gateaux derivative. Consider a functional ℰ\\[*w*(**u**)\\\
  ], where *w*(**u**) ∈ ℂ¹ is a scalar function, **u** ∈ *R*^(*n*). Take an arbitrary\
  \ function *h*(**u**) ∈ ℂ¹, and introduce a linear combination *w*^(\\*)(**u**) + *α**h*(**u**),\
  \ where *α* denotes a real variable and *w*^(\\*)(**u**) is a certain fixed function\
  \ from *ℂ*¹ that possesses some necessary properties (e.g., minimizes the functional\
  \ ℰ). For a chosen function *h*(**u**), the functional ℰ becomes a function of the\
  \ real variable *α*. The Gateaux derivative of the functional ℰ is given by\n\n\
  $$\n\\begin{array}{r}\n\\left. D\\mathcal{E} = \\frac{d}{d\\alpha}\\mathcal{E}\\\
  lbrack w^{\\*}(\\mathbf{u}) + \\alpha h(\\mathbf{u})\\rbrack \\middle| {}_{\\alpha\
  \ = 0}. \\right. \\\\\n\\end{array}\n$$\n\n(5.45)\n\nGetting back to the Lagrange\
  \ functional (5.43), consider an arbitrary function *h*(**x**) from the class *ℂ*¹\
  \ and the real variable *α*. Denote by *f*^(\\*)(**x**) the function that yields\
  \ minimum in the problem (5.41, 5.42). Represent an arbitrary function *f*(**x**)\
  \ as the linear combination\n\n$$\n\\begin{array}{r}\n{f(\\mathbf{x}) = f^{\\*}(\\\
  mathbf{x}) + \\alpha h(\\mathbf{x}).} \\\\\n\\end{array}\n$$\n\n(5.46)\n\nUnder\
  \ fixed *f*^(\\*)(**x**) and *h*(**x**), the Lagrange functional (5.43) turns out\
  \ to be a function of the real variable *α*, i.e.,\n\n$$\n\\begin{array}{r}\n{\\\
  mathcal{L} = {\\int_{X}\\Phi}\\left\\lbrack {f^{\\*}(\\mathbf{x}) + \\alpha h(\\\
  mathbf{x})} \\right\\rbrack d\\mathbf{x} - {\\sum\\limits_{i = 1}^{m}\\lambda_{i}}{\\\
  int_{X}\\Psi_{i}}\\left\\lbrack {f^{\\*}(\\mathbf{x}) + \\alpha h(\\mathbf{x})}\
  \ \\right\\rbrack d\\mathbf{x}.} \\\\\n\\end{array}\n$$\n\n(5.47)\n\nThen the first-order\
  \ optimality condition for the Lagrange functional takes the form\n\n$$\n\\begin{array}{r}\n\
  {D\\mathcal{L} = {\\int_{X}h}(\\mathbf{x})\\left( {\\frac{d\\Phi(y)}{dy} - {\\sum\\\
  limits_{i = 1}^{m}\\lambda_{i}}\\,\\frac{d\\Psi_{i}(y)}{dy}} \\right)d\\mathbf{x}\
  \ = 0,} \\\\\n\\end{array}\n$$\n\n(5.48)\n\nwhere *y* is a scalar argument of the\
  \ functions Φ and *Ψ*[1], …, *Ψ*[*m*]. For this integral expression to vanish, a\
  \ necessary condition is that its integrand takes zero value for any function *h*(**x**) ∈ ℂ¹.\n\
  \nConsequently, *the first-order optimality condition in the problem (5.41, 5.42)*\
  \ can be written as\n\n$$\n\\begin{array}{r}\n{\\frac{d\\Phi(y)}{dy} = {\\sum\\\
  limits_{i = 1}^{m}\\lambda_{i}}\\frac{d\\Psi_{i}(y)}{dy}.} \\\\\n\\end{array}\n\
  $$\n\n(5.49)\n\nHere the derivatives of the functions *Φ*, *Ψ*[1], …, *Ψ*[*m*] depend\
  \ on *f*^(\\*)(**x**), the function that minimizes the functional (5.41), i.e.,\n\
  \n$$\n\\begin{array}{r}\n{d\\Phi(y)dy = \\phi\\lbrack f^{\\*}(\\mathbf{x})\\rbrack,\\\
  quad\\quad d\\Psi_{i}(y)dy = \\psi_{i}\\lbrack f^{\\*}(\\mathbf{x})\\rbrack,\\quad\
  \ i = \\overline{1,m}.} \\\\\n\\end{array}\n$$\n\n(5.50)\n\nHence, equality (5.49)\
  \ can be transformed into\n\n$$\n\\begin{array}{r}\n{\\phi\\lbrack f^{\\*}(\\mathbf{x})\\\
  rbrack = {\\sum\\limits_{i = 1}^{m}\\lambda_{i}}\\psi_{i}\\lbrack f^{\\*}(\\mathbf{x})\\\
  rbrack.} \\\\\n\\end{array}\n$$\n\n(5.51)\n\n\n\n\n\n该等式定义了最优函数 `f*`(x) 关于拉格朗日乘子\
  \ `λ`[1], …, `λ`[m] 的参数化。在某些情况下，参数化可以用解析形式表示。特别地，设 (5.41, 5.42) 中的函数 `Φ` 为二次的，即\n\
  \n$$\n\\begin{array}{r} {\\Phi\\lbrack f(\\mathbf{x})\\rbrack = a_{0} + a_{1}f(\\\
  mathbf{x}) + a_{2}f^{2}(\\mathbf{x}),} \\\\ \\end{array}\n$$\n\n(5.52)\n\n并且函数 `Ψ`[1],\
  \ …, `Ψ`[m] 为线性的，即\n\n$$\n\\begin{array}{r} {\\Psi_{i}\\lbrack f(\\mathbf{x})\\\
