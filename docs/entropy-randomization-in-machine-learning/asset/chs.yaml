  ```\n\n(7.113)\n\n以事件 (7.111) 的概率成立。\n\n\n\n\n\n### 2.\n求事件 (7.111) 概率的下界。考虑差值 |*h*[*k*]^((*i*))−*h*|\
  \ 并取一个足够小的正值 *γ* 使得 |*h*[*k*]^((*i*))−*h*|>*γ* 对随机格点 $\\hat{\\mathbb{S}}$ 的所有步长\
  \ *h*[*k*]^((*i*)) 都成立。计算该事件的概率。若随机点数很大（*h* 很小）且它们均匀分布，则这些点之间的距离必须接近 *h*。\n\n事件\
  \ max[*i*]|*h*[*k*]^((*i*))−*h*|>*γ* 意味着可以找到一对随机变量 (*ξ*, *η*) ∈ \\[0, 1\\] 具有以下性质：如果其中一个（例如\
  \ *ξ*）取值为 *y* ∈ \\[0, 1\\]，则另一个 *η* ≠ ℒ = \\[*y* + *h* − *γ*, *y* + *h* + *γ*\\\
  ]。因此，以 *y* + *h* 为中心的区间 ℒ，其长度为 2*γ*，为空。实际上，假设随机变量 *η* 落入区间 ℒ，即 *η* = *ξ* − *h* ± *δ*，其中\
  \ 0 < *δ* < *γ*；在这种情况下，可得 |*h*[*k*]^((*i*))−*h*|<*γ*。\n\n由于均匀分布随机变量的独立性，事件 max[*i*]|*h*[*k*]^((*i*))−*h*|>*γ*\
  \ 的概率对向量 **a** 的所有元素相同且不超过 \\[1 − 2*γ* + *ψ*(*N*)\\]^(*N*)，其中 *ψ*(*N*) 给出特定随机生成器的经验概率修正，通过实验得出。对标准随机生成器的分析表明，函数\
  \ *ψ*(*N*) 从 *N* = 1000 开始几乎消失。因此，\n\n$$\\begin{array}{r} \\left. \\widetilde{P}(\\\
  max_{i} \\middle| h_{k}^{(i)} - h \\middle| > \\gamma) = \\widetilde{P}(\\mathcal{V}^{k})\
  \ = {(1 - 2\\gamma)}^{N}. \\right. \\\\ \\end{array}$$\n\n(7.114)\n\n事件 \U0001D4B1\
  \ (7.111) 的概率具有形式\n\n$$\\begin{array}{r} {\\widetilde{P}(\\mathcal{V}) = \\widetilde{P}(N,n)\
  \ = {(1 - 2\\gamma)}^{Nn}.} \\\\ \\end{array}$$\n\n(7.115)\n\n相反事件 $\\underset{k\
  \ = 1}{\\overset{m}{\\cup}}\\left. (\\max_{i} \\middle| h_{k}^{(i)} - h \\middle|\
