  hat{\\mathbf{y}}(t_{j},\\mathbf{a},\\mu)\\, d\\mathbf{a}\\, d\\mu} \\right\\rbrack\
  \ +} \\\\ & {\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\\
  quad\\quad} + {\\int_{\\Xi_{j}}\\,}Q_{j}({\\overline{\\xi}}^{(j)})\\,{\\overline{\\\
  xi}}^{(j)}\\, d{\\overline{\\xi}}^{(j)} = 0,} \\\\ & {\\text{\\quad\\quad}\\text{\\\
  quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\quad\\text{\\quad\\quad}\\\
  text{\\quad\\quad}j = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.77)\n\n为了得到拉格朗日泛函的最优性条件，我们再次采用基于\
  \ Gâteaux 导数的方法。相应的一阶最优性条件具有如下形式\n\n$$\n\\begin{aligned} & {\\text{\\quad\\quad}\\\
  text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\\
  quad\\text{\\quad\\quad}F^{*}(\\mathbf{a},\\mu) = F_{0}(\\mathbf{a},\\mu) \\times}\
  \ \\\\ & {\\times \\frac{\\left. \\exp\\lbrack - {\\sum\\limits_{j = 1}^{s}\\left\\\
  langle {\\overline{\\theta}}^{(j)},\\mathbf{B}^{(j)}\\lbrack\\mathbf{x}((t_{j},\\\
  tau_{h}) \\right.} + \\mu(t_{j},\\tau_{h}),\\, \\middle| \\, h = \\overline{1,(j-1)}),\\\
  mathbf{a}\\rbrack \\right\\rangle\\rbrack}{\\mathcal{F}({\\overline{\\theta}}^{(1)},\\\
  ldots,{\\overline{\\theta}}^{(s)})},} \\\\ & {\\text{\\quad\\quad}\\text{\\quad\\\
  quad}Q_{j}^{*}({\\overline{\\xi}}^{(j)}) = Q_{j}^{0}({\\overline{\\xi}}^{(j)})\\\
  frac{\\exp\\lbrack - \\left\\langle {\\overline{\\theta}}^{(j)},{\\overline{\\xi}}^{(j)}\
  \ \\right\\rangle\\rbrack}{\\mathcal{Q}_{j}({\\overline{\\theta}}^{(j)})},\\quad\
  \ j = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.78)\n\n其中\n\n$$\n\\begin{aligned}\
  \ & {\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\\
  quad}\\text{\\quad\\quad}\\mathcal{F}({\\overline{\\theta}}^{(1)},\\ldots,{\\overline{\\\
  theta}}^{(s)}) = {\\int_{\\mathcal{R}}F_{0}}(\\mathbf{a},\\mu) \\times} \\\\ & {\\\
  exp\\left\\lbrack \\left. - {\\sum\\limits_{j = 1}^{s}\\left\\langle {\\overline{\\\
  theta}}^{(j)},\\mathbf{B}^{(j)}\\lbrack\\mathbf{x}((t_{j},\\tau_{h}) \\right.} +\
  \ \\mu(t_{j},\\tau_{h}),\\, \\middle| \\, h = \\overline{1,(j-1)}),\\mathbf{a}\\\
  rbrack \\right\\rangle \\right\\rbrack d\\mathbf{a},} \\\\ & {\\quad\\text{\\quad\\\
  quad}\\text{\\quad\\quad}\\mathcal{Q}_{j}({\\overline{\\theta}}^{(j)}) = {\\int_{\\\
  Xi}Q_{j}^{0}}({\\overline{\\xi}}^{(j)})\\exp\\left\\lbrack {- \\left\\langle {\\\
  overline{\\theta}}^{(j)},{\\overline{\\xi}}^{(j)} \\right\\rangle} \\right\\rbrack\
  \ d{\\overline{\\xi}}^{(j)},} \\\\ & {\\text{\\quad\\quad}\\text{\\quad\\quad}\\\
  quad\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\\
  quad}\\text{\\quad\\quad}j = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.79)\n\
  \n得到的 PDF 函数由拉格朗日乘子 $\\overline{\\theta}$ 参数化，$\\overline{\\theta}$ 由平衡方程确定。\n\n\
  ## 5.5 拉格朗日乘子的方程\n\n所有熵最优 PDF 都属于由拉格朗日乘子 ${\\overline{\\theta}}^{1},\\ldots,{\\\
  overline{\\theta}}^{s}$ 参数化的指数函数类；参见上一节推导的公式。为了计算拉格朗日乘子，我们需要求解由平衡约束 (5.24, 5.31)\
  \ 与熵最优 PDF (5.64, 5.4.2) 得到的方程。\n\n**1. 具有输出误差的 RPM-Orig 模型**\n\n为了形成相应的方程，引入以下辅助记号。\n\
  \n* 具有熵最优随机参数的模型的平均输出\n\n$$\n\\begin{aligned} & {\\text{\\quad\\quad}\\mathbb{Y}_{j}(\\\
  overline{\\theta}) = \\mathcal{P}^{( - 1)}(\\overline{\\theta}){\\int_{\\mathcal{A}}P_{0}}(\\\
  mathbf{a}) \\times} \\\\ {\\times \\exp} & {\\left\\lbrack \\left. - {\\sum\\limits_{j\
  \ = 1}^{s}\\left\\langle {\\overline{\\theta}}^{(j)},\\mathcal{B}\\lbrack\\mathbf{x}((t_{j},\\\
  tau_{h}) \\right.}\\\\, \\middle| \\, h = \\overline{1,(j-1)}),\\mathbf{a}\\rbrack\
  \ \\right\\rangle \\right\\rbrack \\times} \\\\ & \\left. \\quad \\times \\mathcal{B}\\\
  lbrack\\mathbf{x}((t_{j},\\tau_{h})\\, \\middle| \\, h = \\overline{1,(j-1)}),\\\
  mathbf{a}\\rbrack d\\mathbf{a}; \\right. \\\\ \\end{aligned}\n$$\n\n(5.80)\n\n*\
  \ 平均熵-“最差”测量噪声\n\n\n\n\n\n$$\n\\begin{aligned} {{\\mathbb{Q}}_{j}({\\overline{\\\
  theta}}^{(j)}) = \\mathcal{Q}_{j}^{( - 1)}({\\overline{\\theta}}^{(j)})\\int_{\\\
  Xi_{j}}} & {Q_{j}^{0}({\\overline{\\xi}}^{(j)})\\exp\\left\\lbrack {- \\left\\langle\
  \ {\\overline{\\theta}}^{(j)},{\\overline{\\xi}}^{(j)} \\right\\rangle} \\right\\\
  rbrack d{\\overline{\\xi}}^{(j)},} \\\\ & {j = \\overline{1,s}.} \\\\ \\end{aligned}\n\
  $$\n\n(5.81)\n\n在这些表达式中，$\\overline{\\theta} = \\lbrack{\\overline{\\theta}}^{(1)},\\\
  ldots,{\\overline{\\theta}}^{(s)}\\rbrack.$\n\n利用平衡约束条件 (5.24)，将拉格朗日乘子的方程写成\n\n\
  $$\n\\begin{array}{r} {{\\mathbb{Y}_{j}(\\overline{\\theta}) + {\\mathbb{Q}}_{j}({\\\
  overline{\\theta}}^{(j)}) = \\mathbf{y}^{(j)},\\text{\\quad\\quad}j = \\overline{1,s}.}\
  \ \\\\ \\end{array}\n$$\n\n(5.82)\n\n## 2. 输出误差的 RPM-Rel 模型\n\n类比于前一种情况，引入以下辅助记号：\n\
  \n* 具有熵最优随机参数的模型的平均输出\n\n$$\n\\begin{aligned} & {\\text{\\quad\\quad}\\text{\\quad\\\
  quad}\\quad{\\mathbb{Z}}_{j}(\\overline{\\theta}) = \\mathcal{W}^{( - 1)}(\\overline{\\\
  theta}){\\int_{\\mathcal{U}}W_{0}}(\\mathbf{u}) \\times} \\\\ & \\left. \\times\
  \ \\exp\\lbrack - {\\sum\\limits_{j = 1}^{s}\\left\\langle {\\overline{\\theta}}^{(j)},\\\
  mathcal{D}\\lbrack\\mathbf{x}((t_{j},\\tau_{h}) \\right.}\\\\, \\middle| \\, h =\
  \ \\overline{1,(j-1)}),\\mathbf{a}^{-} + \\right. \\\\ & {\\left. \\text{\\quad\\\
  quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\quad}\\text{\\quad\\\
  quad}\\text{\\quad\\quad} A\\,\\mathbf{u}\\rbrack \\right\\rangle\\rbrack \\times}\
  \ \\\\ & \\left. \\times \\mathcal{D}\\lbrack\\mathbf{x}((t_{j},\\tau_{h})\\, \\\
  middle| \\, h = \\overline{1,(j-1)}),\\mathbf{a}^{-} + A\\,\\mathbf{u}\\rbrack d\\\
  mathbf{u}; \\right. \\\\ \\end{aligned}\n$$\n\n(5.83)\n\n* 平均熵“最差”测量噪声\n\n$$\n\\\
  begin{aligned} {{\\mathbb{G}_{j}({\\overline{\\theta}}^{(j)}) = \\mathcal{G}_{j}^{(\
  \ - 1)}({\\overline{\\theta}}^{(j)})\\int_{\\mathcal{E}}} & {G_{j}^{0}({\\overline{\\\
  eta}}^{(j)})\\exp\\left\\lbrack {- \\left\\langle {\\overline{\\theta}}^{(j)},{\\\
  overline{\\eta}}^{(j)} \\right\\rangle} \\right\\rbrack d{\\overline{\\eta}}^{(j)},}\
  \ \\\\ & {\\, j = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.84)\n\n利用平衡约束条件\
  \ (5.31)，将拉格朗日乘子的方程写成\n\n$$\n\\begin{array}{r} {{{\\mathbb{Z}}_{j}(\\overline{\\\
  theta}) + \\mathbb{G}_{j}({\\overline{\\theta}}^{(j)}) = \\mathbf{y}^{(j)},\\text{\\\
  quad\\quad}j = \\overline{1,s}.} \\\\ \\end{array}\n$$\n\n(5.85)\n\n## 3. 输入和输出误差的\
  \ RPM-Orig 模型\n\n为了形成相应的方程，引入以下辅助记号。\n\n* 具有熵最优随机参数的模型的平均输出\n\n$$\n\\begin{aligned}\
  \ & {\\text{\\quad\\quad}\\quad\\text{\\quad\\quad}\\text{\\quad\\quad}{\\mathbb{Y}_{j}(\\\
  overline{\\theta}) = \\mathcal{F}^{( - 1)}(\\overline{\\theta}){\\int_{\\mathcal{R}}F_{0}}(\\\
  mathbf{a},\\mu) \\times} \\\\ & {\\times \\exp\\left\\lbrack \\left. - {\\sum\\\
  limits_{j = 1}^{s}\\left\\langle {\\overline{\\theta}}^{(j)},\\mathcal{B}\\lbrack\\\
  mathbf{x}((t_{j},\\tau_{h}) \\right.} + \\mu(t_{j},\\tau_{h})\\, \\middle| \\, h\
  \ = \\overline{1,(j-1)}),\\mathbf{a}\\rbrack \\right\\rangle \\right\\rbrack \\\
  times} \\\\ & \\left. \\text{\\quad\\quad} \\times \\mathcal{B}\\lbrack\\mathbf{x}((t_{j},\\\
  tau_{h}) + \\mu(t_{j},\\tau_{h})\\, \\middle| \\, h = \\overline{1,(j-1)}),\\mathbf{a}\\\
  rbrack d\\mathbf{a}d\\mu. \\right. \\\\ \\end{aligned}\n$$\n\n(5.86)\n\n* 平均熵“最差”测量噪声\n\
  \n$$\n\\begin{aligned} {{\\mathbb{Q}_{j}({\\overline{\\theta}}^{(j)}) = \\mathcal{Q}_{j}^{(\
  \ - 1)}({\\overline{\\theta}}^{(j)})\\int_{\\Xi_{j}}} & {Q_{j}^{0}({\\overline{\\\
  xi}}^{(j)})\\exp\\left\\lbrack {- \\left\\langle {\\overline{\\theta}}^{(j)},{\\\
  overline{\\xi}}^{(j)} \\right\\rangle} \\right\\rbrack d{\\overline{\\xi}}^{(j)},}\
  \ \\\\ & {j = \\overline{1,s}.} \\\\ \\end{aligned}\n$$\n\n(5.87)\n\n然后，将拉格朗日乘子的方程写成\n\
  \n$$\n\\begin{array}{r} {{\\mathbb{Y}_{j}(\\overline{\\theta}) + {\\mathbb{Q}}_{j}({\\\
  overline{\\theta}}^{(j)}) = \\mathbf{y}^{(j)},\\text{\\quad\\quad}j = \\overline{1,s}.}\
  \ \\\\ \\end{array}\n$$\n\n(5.88)\n\n事实上，方程 (5.82, 5.85, 5.88) 具有一定的特殊性。它们包含依赖于拉格朗日乘子的函数；反过来，后者是通过在参数和测量噪声的定义多维域上积分计算的。公平地说，这些域具有简单的结构，表示多维平行六面体。在下文中，它们将被称作\
  \ *参数化积分分量 (PICs)*，以强调其特殊性。PICs 的计算和平衡方程的求解是独立且非平凡的问题。解决这些问题的一些方法将在 第 6 章 中详细讨论。\n\
  \n# 第 6 章 机器学习程序中归属概率的熵鲁棒估计方法\n\nDOI: [10.1201/9781003306566-6](https://doi.org/10.1201/9781003306566-6)\n\
  \n熵泛函的约束最大化代表了解决各种问题的有效工具，包括对模型参数和测量噪声的归属区间概率的估计。区间类型的原始模型参数和测量噪声被变换为位于单位区间内的辅助非负变量，它们被视为归属概率\
  \ [67]。对辅助参数和测量噪声的这种概率解释证明了熵泛函用于寻找辅助变量和原始变量最佳值的适用性。归属概率的估计算法是机器学习算法。估计问题被表述为熵-线性规划问题，其可行集是利用可用的学习数据数组构造的。\n\
  \n## 6.1 归属概率的熵鲁棒估计算法\n\n在 ML 程序中使用的参数化模型的一个重要类由具有区间类型 *准随机* 参数的模型组成；它们的值由归属相应区间的概率定义。用\
  \ *RPM-QuaRand* 表示这一类模型，用 **c** 表示其参数。这些模型具有确定性参数，其值未知。因此，RPM-QuaRand 模型可以被视为具有\
  \ PDF *R*(**c**)=*R*δ(**c**^(*) − **c**) 的随机模型。\n\n参数 **c** 为区间类型，即\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{c} \\in \\mathcal{C} = \\otimes_{i = 1}^{n}\\mathcal{C}_{i} = \\lbrack\
  \ c_{i}^{-},c_{i}^{+}\\rbrack.} \\\\ \\end{array}\n$$\n\n(6.1)\n\n引入参数 *c*[*i*]\
  \ 取区间 \U0001D49E[*i*] 内某个值的概率 *p*[*i*]。值 *p*[*i*] 将被称为 *归属概率 (PO)*。那么参数 *c*[*i*]\
  \ 可以写成\n\n$$\n\\begin{array}{r} \\left. c_{i} = c_{i}^{-} + (c_{i}^{+} - c_{i}^{-})\\\
  , p_{i},\\text{\\quad\\quad}\\mathbf{c} = \\mathbf{c}^{-} + C\\,\\mathbf{p},\\quad\
  \ C = \\text{diag}\\lbrack(c_{i}^{+} - c_{i}^{-})\\, \\middle| \\, i = \\overline{1,n}\\\
  rbrack. \\right. \\\\ \\end{array}\n$$\n\n(6.2)\n\n归属概率为\n\n$$\n\\begin{array}{r}\
  \ {\\mathbf{p} \\in \\mathcal{I} = \\lbrack\\mathbf{0} \\leq \\mathbf{p} \\leq \\\
  mathbf{1}\\rbrack.} \\\\ \\end{array}\n$$\n\n(6.3)\n\n一些陈述还涉及一个额外的约束条件，称为完备集条件（归一化条件），即\n\
  \n$$\n\\begin{array}{r} {{\\sum\\limits_{i = 1}^{n}p_{i}} = 1.} \\\\ \\end{array}\n\
  $$\n\n(6.4)\n\n\n\n\n\n属于概率的定义及其性质（6.3，6.4）形式上与相对参数（4.96，4.97）的定义相匹配。然而，它们之间存在原则上的差异。相对参数\
  \ `u` 是由给定 PDF 特征化的随机化变量。相比之下，属于概率 `p` 是非随机变量，取值在单位非负立方体内。\n\nRPM-QuaRand 类的动态模型生成唯一的轨迹，即在离散时刻\
  \ $j = \\overline{0,s} = \\mathcal{T}_{s}$ 下由以下等式描述：\n\n$$\\begin{aligned} {\\mathbf{s}\\\
  lbrack j,\\mathbf{p}\\rbrack} & {= \\mathcal{S}\\lbrack\\mathbf{x}(j,\\tau),\\,\\\
  mathbf{c}^{-} + C\\,\\mathbf{p};(j,\\tau) \\in \\mathcal{T}_{s}\\rbrack,} \\\\ \\\
  mathbf{c} & {= \\mathbf{c}^{-} + C\\,\\mathbf{p}.} \\\\ \\end{aligned}$$\n\n(6.5)\n\
  \n这里 \U0001D4AE 表示积分泛函。\n\n该问题具有测量的加性模型：在每个 *j* 次测量中，噪声由区间型向量表征\n\n$$\\begin{array}{r}\
  \ {{\\overline{\\zeta}}^{(j)} \\in \\mathcal{Z}^{(j)} = \\otimes_{i = 1}^{m}\\mathcal{Z}_{i}^{(j)},\\\
  quad\\quad\\mathcal{Z}_{i}^{(j)} = \\lbrack\\zeta_{-}^{(j)}(i),\\zeta_{+}^{(j)}(i)\\\
  rbrack,\\quad j = \\overline{1,s}.} \\\\ \\end{array}$$\n\n(6.6)\n\n引入噪声向量元素 `ζ[i]^{((j))}`\
  \ 取自区间 `\U0001D4B5[i]^{((j))}` 的属于概率 `q[i]^{((j))}`。概率 `q[i]^{((j))}` 位于单位非负区间内，且概率向量为\n\
  \n$$\\begin{array}{r} {\\mathbf{q}^{(j)} \\in \\mathcal{I} = \\lbrack\\mathbf{0}\
  \ \\leq \\mathbf{q}^{(j)} \\leq \\mathbf{1}\\rbrack,\\quad\\quad j = \\overline{1,s}.}\
  \ \\\\ \\end{array}$$\n\n(6.7)\n\n在某些情况下，如模型参数的属于概率，需要考虑归一化条件\n\n$$\\begin{array}{r}\
  \ {{\\sum\\limits_{i = 1}^{m}q_{i}^{(j)}} = 1,\\quad\\quad j = \\overline{1,s}.}\
  \ \\\\ \\end{array}$$\n\n(6.8)\n\n噪声向量可以写成\n\n$$\\begin{array}{r} \\left. {{\\overline{\\\
  zeta}}^{(j)} = {\\overline{\\zeta}}_{-}^{(j)}(i) + L_{j}\\mathbf{q}^{(j)},\\quad\\\
  quad L_{j} = \\text{diag}\\,\\lbrack\\zeta_{+}^{(j)}(i) - \\zeta_{-}^{(j)}(i),\\\
  , \\middle| \\, i = \\overline{1,m}\\rbrack. \\right. \\\\ \\end{array}$$\n\n(6.9)\n\
  \nRPM-QuaRand 模型（6.5）的可测输出是唯一的轨迹 `w[j, p, q]`，由向量 `s[j, p]`（6.5）和 `${\\overline{\\\
  zeta}}^{(j)}$`（6.9）的加性混合组成，即\n\n$$\\begin{array}{r} {\\mathbf{w}\\lbrack j,(\\mathbf{p},\\\
  mathbf{q}^{(j)}\\rbrack = \\mathbf{s}\\lbrack j,\\mathbf{p}\\rbrack + {\\overline{\\\
  zeta}}^{(j)} - + L_{j}\\,\\mathbf{q}^{(j)},\\quad\\quad j = \\overline{1,s}.} \\\
  \\ \\end{array}$$\n\n(6.10)\n\n因此，作为其变量，RPM-QuaRand 模型包含了属于概率 `$ \\mathbf{p},\\\
  mathbf{q}^{j},\\, j = \\overline{1,s}.$`\n\n### 6.1.1 归一化属于概率的 RPM-QuaRand 模型的 ML\
  \ 算法\n\n考虑向量 `p` 和 `q^{(1)}, …, q^{((s))}` 归一化且存在关于先验属于概率的信息，`p[0]` 和 `q[0]^{(1)},\
  \ …, q[0]^{((s))}` 的情况。\n\n在整本书中，反复提到 ML 过程在以熵度量的不确定性下运行。因此，我们将使用熵方法来表征估计质量。由于测量噪声是加性的，让我们采用广义玻尔兹曼信息熵\
  \ [141]\n\n$$\\begin{array}{r} {H_{B}(\\mathbf{p},Q) = - \\left\\langle \\mathbf{p},\\\
  mathbf{ln}\\frac{\\mathbf{p}}{\\mathbf{p}_{0}} \\right\\rangle - {\\sum\\limits_{j\
  \ = 1}^{s}\\left\\langle \\mathbf{q}^{(j)},\\mathbf{ln}\\frac{\\mathbf{q}^{(j)}}{\\\
  mathbf{q}_{0}^{(j)}} \\right\\rangle},Q = \\lbrack\\mathbf{q}^{(1)},\\ldots,\\mathbf{q}^{(s)}\\\
  rbrack.} \\\\ \\end{array}$$\n\n(6.11)\n\n这里 `ln`(•) 表示具有相应元素的向量。回想一下，该表达式中的变量是非负的。那么\
  \ *归一化属于概率的 RPM-QuaRand 模型的熵鲁棒估计问题* 可以写成如下形式：\n\n* 最大化熵函数（6.11）\n\n$$\\begin{array}{r}\
  \ \\left. H_{B}(\\mathbf{p},Q)\\Rightarrow\\max_{\\mathbf{p},Q} \\right. \\\\ \\\
  end{array}$$\n\n(6.12)\n\n* 受以下约束：\n\n  * –归一化条件\n\n    $$\\begin{array}{r} {\\\
  left\\langle \\mathbf{p},\\mathbf{1} \\right\\rangle = 1,\\quad\\quad\\left\\langle\
  \ \\mathbf{q}^{(j)},\\mathbf{1} \\right\\rangle = 1,\\quad j = \\overline{1,s},}\
  \ \\\\ \\end{array}$$\n\n    (6.13)\n\n    和\n\n  * –平衡约束\n\n    $$\\begin{array}{r}\
  \ {\\mathcal{S}\\lbrack\\mathbf{x}\\lbrack j,\\tau\\rbrack,\\,\\mathbf{c}^{-} +\
  \ C\\,\\mathbf{p};(j,\\tau) \\in \\mathcal{T}_{s}\\rbrack + {\\overline{\\zeta}}_{-}^{(j)}\
  \ + L_{j}\\,\\mathbf{q}^{(j)} = \\mathbf{y}\\lbrack j\\rbrack,\\quad\\quad j = \\\
  overline{1,s}.} \\\\ \\end{array}$$\n\n    (6.14)\n\n约束（6.13，6.14）从单位非负（*m* + *r*）维立方体\
  \ ℐ 中提取可容许集 Υ。\n\n一般情况下，该问题是熵非线性规划问题。其非线性性质源于平衡约束（6.14），其中包含参数的非线性泛函 \U0001D4AE\
  。注意，估计的随机化方法导致熵线性泛函规划的优化问题。\n\n因此，*归一化属于概率的 RPM-QuaRand 模型的熵鲁棒 ML 算法* 的形式为\n\n$$\\\
  begin{array}{r} \\left. {(\\mathbf{p},Q)}^{*} = \\arg\\max_{(\\mathbf{p},Q)}\\lbrack\
  \ H_{B},\\, \\middle| \\,( \\mathbf{p},Q) \\in \\Upsilon\\rbrack. \\right. \\\\\
  \ \\end{array}$$\n\n(6.15)\n\n### 6.1.2 区间型属于概率的 RPM-QuaRand 模型的 ML 算法\n\n对于此类模型，属于概率取值在非负\
  \ *r*\\-维立方体内——不施加归一化条件。对于这些 RPM-QuaRand 模型产生的估计问题有两种修改，取决于熵的选择，即使用玻尔兹曼熵或费米熵 [149]\
  \ 的表述。\n\n使用广义玻尔兹曼信息熵（6.11）时，*区间型属于概率的 RPM-QuaRand 模型的玻尔兹曼熵鲁棒估计问题* 可以写成如下形式：\n\n\
  * 最大化熵函数（6.11）\n\n$$\\begin{array}{r} \\left. H_{B}(\\mathbf{p},Q)\\Rightarrow\\\
  max_{\\mathbf{p},Q} \\right. \\\\ \\end{array}$$\n\n(6.16)\n\n* 受以下约束：\n\n  * –区间型条件\n\
  \n    $$\\begin{array}{r} {\\mathbf{p} \\in \\mathcal{I},\\quad\\quad\\mathbf{q}^{(j)}\
  \ \\in \\mathcal{I},\\quad j = \\overline{1,s},} \\\\ \\end{array}$$\n\n    (6.17)\n\
  \n    和\n\n  * –平衡约束\n\n    $$\\begin{array}{r} {\\mathcal{S}\\lbrack\\mathbf{x}\\\
  lbrack j,\\tau\\rbrack,\\,\\mathbf{c}^{-} + C\\,\\mathbf{p};(j,\\tau) \\in \\mathcal{T}_{s}\\\
  rbrack + {\\overline{\\zeta}}_{-}^{(j)} + L_{j}\\,\\mathbf{q}^{(j)} = \\mathbf{y}^{(j)},\\\
  quad\\quad j = \\overline{1,s}.} \\\\ \\end{array}$$\n\n    (6.18)\n\n约束（6.17，6.18）从单位非负\
  \ *r*\\-维立方体 ℐ 中提取可容许集 Γ。\n\n*区间型属于概率的 RPM-QuaRand 模型的玻尔兹曼熵鲁棒 ML 算法* 的形式为\n\n$$\\\
  begin{array}{r} \\left. {(\\mathbf{p},Q)}^{*} = \\arg\\max_{(\\mathbf{p},Q)}\\lbrack\
