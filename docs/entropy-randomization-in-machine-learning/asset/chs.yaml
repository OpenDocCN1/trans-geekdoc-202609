  \n取一个足够小的正值 *γ*。根据 (7.100) 以及 *ζ*^(*i*) 作为非均匀随机格点基本立方体中心点的定义，考虑不等式链\n\n$$\\begin{array}{r}\
  \ {\\max_{k}\\delta_{k}^{i} < \\max_{k}h_{k}^{i} < \\gamma.} \\\\ \\end{array}$$\n\
  \n(7.121)\n\n令 *γ* = *h*²，其中 *h* 为均匀格点的步长。后一个不等式以概率 *P*(*N*) (7.117) 成立。\n\n估计值\n\
  \n$$\\begin{array}{r} {\\frac{\\partial\\phi}{\\partial w_{k}} = - E(\\mathbf{w},\\\
