    layer and data was reshaped into a format of 200x1. This model has a much higher
    size, in comparison with the multi-channel model, with a filter size of 20. We
    decided to use one convolutional layer to contrast with the concatenation of layers
    across three dimensions. We added a max pooling layer with a 1x1 matrix of features
    to decide if the text contains a positive or negative sentiment. We then added
    a dropout layer with a rate of 0.2 to reduce-overfitting the model and flatten
    to output a softmax function.


    3) Attention CNN: Thinking of a model by adding an attention section to the data.
    To do this, we used KPooling and Folding methods as described by Hughes [23].
    We then introduced the pooling process of a time to help improve the ability to
    use from the convolutional layers. We used this model here because of its ability
    during prototyping. We used 1-dimensional convolutional layers instead of 2-dimensional
    because of the difference might influence the output of the model, which affects
    the aspects of the performance outcome. We started with the base embedding layer
    and adding the best feature. Padding the embedding layer helps to improve the
    performance of the model as it no longer needs to guess the length of the input.
    We then used a max pooling layer to perform enough convolutions for the KPooling
    model to take effect as per the volume of data to be too sparse [24]. Then we
    used a 1-dimensional convolution layer with a to take the best max pool of first
    and pass on. We then added another convolution layer with the half window size
    of the first, add a folding layer, and then order another kPooling. We finally
    flatten, and output using a softmax function.


    ## F. Training and Evaluation:


    Each of the models described above was trained using a 50-20% split/test cycle.
    The data was divided into training and testing sets. 80% of the data was used
    for training, 10% for validation, and 10% was aside for evaluation. The data was
    split into stratified folds, giving us enough of positive and negative samples.
    The accuracy, precision, recall, F-Score, and loss were calculated. The operating
    characteristic (AUC) was calculated based on all predictions taken in the data
    in each of five models. Each model was trained for 100 epochs using a batch size
    of 32 with early stopping to help prevent overfitting by the stopping if the model
    was to lose. We had a patience of 10, meaning that if the loss increased, we would
    provide a period of 10 epochs for the model to recover before stopping our experiment.
    We also did not test learning rates as we not need to add callback parameters
    each time. The model performing well without much issue, otherwise we would terminate
    and continue with different hyperparameters.


