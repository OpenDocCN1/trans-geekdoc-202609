    # 卷积神经网络架构及其对精神状态改变患者分类任务的影响比较


    Kevin Gagnon

    计算机科学

    南卡罗莱纳大学

    哥伦比亚市，南州

    kevingagnon@protonmail.com


    Tami L. Crawford

    生物信息学

    南卡罗莱纳州医大学

    查尔斯顿，南州

    crawford@musc.edu


    Jihad Obaid

    生物信息学

    南卡罗莱纳州医大学

    查尔斯顿，南州

    jobead@musc.edu


    **摘要—** 随着电子健康记录（EHR）在医院系统的普及，由于大量数据更易获取，机器学习技术在健康信息学领域的应用变得更加可行。在实验中，我们评估了用于患者分类任务的多种卷积神经网络架构。我们基于113份现病史（HPI）对这些任务进行了测试。数据使用带有注意力机制的递归架构进行处理，旨在让模型关注文本中具有影响的数据点。我们实现了92%的准确率，而注意力方法的执行准确率分别为90%和89%。


    **关键词—** 机器学习、深度学习、生物信息学、自然语言处理、医学信息计算


    # I. 引言


    随着过去十年数据集可用性和规模的增加，健康记录（EHR）的利用在健康信息学社区中日益增长[1]。这增加了机器学习模型进行预测所需的数据。每份EHR都包含丰富的患者信息，但对于机器学习模型来说，这些信息是完全非结构化的。通过关于患者的丰富上下文数据，这些记录可以整合到更传统的算法中，以有意义的方式预测患者的结果。随后，我们能够利用卷积神经网络架构利用这些数据和患者。


    类似的数据已用于卷积神经网络（CNN）的预测。在许多其他语境下，如实体识别或情感分析[2]。文本分类和CNN可以根据其构造对文本进行预测和分类，已被证明性能优于许多传统的机器学习形式[3]。这一原理已应用于特定领域的医学任务，每个任务使用相似的数据集，但目的不同[4]。另一项研究也将注意力CNN应用于放射学报告的处理，并结合词袋模型和支持向量模型[6]。该研究表明，CNN的表现显著优于其他模型，并证明了作为可行基准模型的支持向量机表现也优于注意力机制。我们研究了注意力模型与其对应模型之间的分类任务是否有了显著提高。


    本实验的目标是比较卷积神经网络架构，并确定哪种最适用于基于结构化临床笔记的患者分类任务。通过比较这三种CNN模型，我们将为开发涉及经典文本记录分类的模型提供指导。


    # II. 目标


    # III. 方法


    我们从提取了EHR系统数据的盲研究仓库（Blinded Research Warehouse）中提取了急诊科（ED）患者笔记。这些笔记跨越6年，均来自同一EHR系统。数据通过访问过的成年患者记录进行了增强，这些患者带有国际疾病分类（ICD-10）代码的标记，这些代码表明患者有精神状态改变（AMS）（例如，R4
    ICD-10代码层级下的代码，包括忽略认知功能和意识的症状和体征），而将没有AMS代码的记录作为对照或阴性病例。其他记录被过滤到最终记录中，包括现病史（HIP）。解析后的笔记被导入REDCap[7]，并与我们研究的临床专家（包括急诊医生）共享，并标记为AMS以备监督学习器做准备。团队的临床成员标注了1,113份现病史。在其余中，473份（43%）被标记为AMS，626份（57%）被标记为非AMS。仅使用CPU的操作系统得到了相似的结果。


    # E. 卷积神经网络结构：


    A. 卷积神经网络是一种专门为图像处理开发的深度学习模型，它通过复制视觉的生物功能实现[15], [16]。卷积层输出以供后续层（如池化层和丢弃层）处理[17]。我们为下文节概述的每个模型使用了相同的基础，但来自自然语言处理实验室（NLPpharm）构建的、基于PubMed和D220医学文本的词嵌入除外。我们使用Python
    3.6 [8]、NumPy和Pandas [19]进行机器学习流水线的预处理，并使用Keras/TensorFlow [11]构建和训练本实验中使用的三个深度学习模型。我们为每个模型使用了相同的基础。


    # A. 测试：

    + 1. 多CNN。遵循注意力方法的模型架构是一个可行的基准模型，Jaelleki [18]。一个多通道模型，支持向量机是一个可行的基准模型。我们研究了注意力模型与其对应模型之间的分类任务是否有了显著提高。


    # B. 调优：

    对于每个模型，我们进行了广泛的超参数调优，以确定整体性能的最佳组合。我们使用Hyperopt [12]对该模型进行了贝叶斯优化。通过此，过滤器、dropout和学习率等参数在100次运行之间进行了调整。


    # C. 词嵌入：

    由于数据量，我们无法在不产生重大影响的情况下训练我们的2vec。我们使用预训练模型来帮助我们的每个模型。Word2vec模型通过使用PubMed和PMC文本[14]的NLP构建，并映射了我们1,110个单词的集合。我们将模型导入了来自PubMed和PMC的权重。这是一个200维的Word2vec模型。


    # D. 可复现性：

    我们在南卡罗莱纳州大学托管和运行的Windows 10服务器上使用NVIDIA RTX 3080进行了测试。如果使用了其他架构，结果无法保证完全可复现，但这些这些架构旨在为模型提供某种形式的上下文以捕捉重要条目。由于张量仅在向量上形成，我们必须通过共享层对张量进行重塑，这些层由算法处理。这是通过应用过滤器大小来产生630x200。我们使用了三个卷积层，每层都接收前一层的输入并产生相同尺寸的输出从(3,5)一直到(5,7)。通过减少或增加到(3,4)的过滤器大小，模型没有得到改进，因为许多在该过滤器范围内的模型运行良好。这种针对特定特征的方法在于，过滤器大小和过滤器的尺寸是数据连接的具体化。在图像处理应用中，这种方法在黑色和像素之间可能不同，但在我们的案例中，它允许我们找到文本中最重要的单词，并减少文本表示包含的变量，因为值随后被导出并馈入最大池化层，该层将卷积层的多维输出转换为1x1的值。这是为了应用所选特征在


