    # A. Limitations


    Our data used for this experiment represents one health system, and one EHR system.
    This means it is difficult to generalize the performance of these models to other
    environments. Our experiment was also specifically designed as a classifier to
    identify AMS. We also had a dataset of only 111 HPI notes, which might not have
    enough data available for our study. More experiments need to be conducted at
    other institutions and examining different types of models with a much larger
    dataset size is to be applicable.


    # V. DISCUSSION


    Between each of the models, it is clear from the results that the multi-channel
    model performed the best for patient classification task. The model achieved a
    prediction of 97.4% Area Under the Curve and it also outperformed the sequential
    and attention models by 2-4% over our testing. This indicates that the multi-channel
    model is the most expensive of the three but could be better able to make predictions
    with sparse data than in our dataset. The sequential and attention models performed
    well, and may have certain hardware limitations or energy restrictions such as
    embedded devices or portability, but it is clear that testing these models do
    not complete our task as they were outperformed on every metric by the multi-channel
    model.


    We hypothesized that adding an attention mechanism would improve the ability for
    the model to classify AMS; however we was not in the results of our testing. While
    adding attention in theory would allow the model to discover smaller details in
    the data, our particular set had short amount of text.


    Because of the success of the multi-channel CNN models, we can say that text classification
    has a useful place in patient classification tasks, as well as other decision-making
    tools. To continue, we need these models tested with larger sets of data to generalize
    to other forms of it. This sort of classification allows for much greater and
    more accurate prediction, as once utilized textual data will now be used in a
    more meaningful way. We envision that models could incorporate text classification
    as one of larger systems that can involve text and numerical data.


    # VI. CONCLUSION


    Although our experiment had limitations, our tests demonstrated that the multi-channel
    convolutional neural network is the best for patient classification on EHR. Even
    with a difference between different models, performance was achieved with the
    multi-channel model showing the power that neural networks present when medical
    text classification tasks. Our results show that a multi-channel model is the
    most robust of the three, several models could be depending on the medical text
    classification task.


