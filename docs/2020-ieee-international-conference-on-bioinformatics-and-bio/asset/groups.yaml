    **Abstract—** With the pervasiveness of Electronic Health Records in hospital
    systems, the application of machine learning techniques to the field of health
    informatics has become much more feasible as large amounts of data become more
    accessible. In our experiment, we evaluated several convolutional neural network
    architectures for in patient classification tasks. We tested these tasks based
    on 113 histories of present (HPI). This data was processed using a recurrent architecture
    with implemented attention mechanism meant to focus the model on the influential
    data points in the text. We achieved an accuracy of 92%, while the attention method
    performed with an accuracy of 90% and 89% respectively.


