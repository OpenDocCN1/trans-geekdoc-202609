    2) 顺序 CNN 模型：顺序模型通过层与层之间的连接构建。这是第 1 节处理的包括文本分类任务在许多早期模型之一。关于模型架构管道的所有细节，即添加多个卷积层来执行特征选择并根据需要减少数据
    [22]。相比之下，这是通过实验构建的最简单模型。与多通道模型类似，我们从一个卷积层开始，并将数据重塑为 200x1 的格式。与多通道模型相比，该模型的尺寸大，滤波器尺寸为
    20。我们决定使用一个卷积层与跨三个维度的层连接进行对比。我们添加了一个带有 1x1 特征矩阵的最大池化层，以判断文本是否包含正面或负面情感。然后，我们添加了一个率为
    0.2 的丢弃层以减少模型的过拟合，并进行展平以输出 softmax 函数。


    3) 注意力 CNN：通过在数据中添加注意力部分来构建模型。为了做到这一点，我们使用了 Hughes [23] 描述的 KPooling 和 Folding
    方法。我们随后引入了时间池化过程以提高从卷积层提取的能力。我们在这里使用该模型是因为它在原型设计阶段的能力。我们使用一维卷积层而不是二维卷积层，是因为差异可能会影响模型的输出，从而影响性能结果的各个方面。我们从基础嵌入层开始并添加最佳特征。填充嵌入层有助于提高模型性能，因为它不再需要猜测输入的长度。然后，我们使用最大池化层进行足够的卷积，以便
    KPooling 模型在数据量过稀疏的情况下发挥作用 [24]。接着，我们使用一个一维卷积层提取第一个最大池化值并传递。然后我们又添加了一个窗口大小为第一层一半的卷积层，添加一个折叠层，然后再次进行
    kPooling。最后我们进行展平，并使用 softmax 函数输出。


    ## F. 训练与评估：


    上述每个模型均使用 50-20% 的划分/测试循环进行训练。数据被分为训练集和测试集。80% 的数据用于训练，10% 用于验证，10% 留作评估。数据被分为分层，为我们提供了足够的正负样本。计算了准确率、精确率、召回率、F
    分数和损失。工作特征（AUC）是根据五个模型中数据中的所有预测计算的。每个模型训练了 100 个轮次（epochs），批处理大小为 32，并使用早停机制以在模型损失增加时停止来防止过拟合。我们的耐心度为
    10，这意味着如果损失增加，我们将为模型提供 10 个轮次的时间让其恢复，然后再停止实验。我们也没有测试学习率，因为我们不需要每次都添加回调参数。模型运行良好，没有太大问题，否则我们将终止并继续尝试不同的超参数。


