    **Abstract—** With the pervasiveness of Electronic Health Records in hospital
    systems, the application of machine learning techniques to the field of health
    informatics has become much more feasible as large amounts of data become more
    accessible. In our experiment, we evaluated several convolutional neural network
    architectures for in patient classification tasks. We tested these tasks based
    on 113 histories of present (HPI). This data was processed using a recurrent architecture
    with implemented attention mechanism meant to focus the model on the influential
    data points in the text. We achieved an accuracy of 92%, while the attention method
    performed with an accuracy of 90% and 89% respectively.


    **Keywords—** Machine Learning, Deep Learning, Bioinformatics, Natural Language
    Processing, Medical Informatics Computing


    # I. INTRODUCTION


    The utilization of health records (EHR) has a growing throughout the health informatics
    community as the availability and size of datasets has increased over the past
    decade [1]. This increases machine learning models the data it needs to make predictions.
    Each EHR contains a wealth of patient information that is completely unstructured
    for machine learning models. With rich contextual data about the patient, these
    records can deget off for data that can be integrated into more traditional algorithms
    to predict patients out outcome in a meaningful way. We are then able to utilize
    this data and patients using convolutional neural network architectures.


    Similar data has been used to make predictions using convolutional neural networks
    (CNN). In many other contexts such as entity recognition or sentiment analysis
    [2]. Text classification and CNNs, can predict and classify a text based on their
    construction and which have been shown to outperform-


    many traditional forms of machine learning [3]. This principle has been applied
    to medical tasks in specific cases, each using a similar dataset, but for different
    purposes [4].nA similar also applied attention CNNs to radiology reports in processing
    with bag-of-words and support vector models [6]. From this study, it was shown
    that CNNs significantly outperformed other models and demonstrated as well performed
    better than the attention mechanism is a viable baseline model, the support vector
    machine. We whether classification tasks are significantly improved between attention
    models and their counterparts.


    The objective of this experiment is to compare convolutional neural network architecture
    and determine which is best for patient classification tasks based on structured
    clinical notes. By comparing these three CNN models, we will be able to provide
    guidance when developing models involving classification from classic text notes.


