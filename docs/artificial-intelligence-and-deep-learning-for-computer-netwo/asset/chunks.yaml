- raw: 'In the fifth chapter, the authors proposed basic solutions for solving cybersecurity
    issues through DL techniques based on security information and event management
    (SIEM). When well-configured SIEM is paired with DL, SIEMs become even more effective
    and add significant value by reducing the amount of false positives and noise,
    which makes security analysts more productive in the security environment. The
    goal of adding DL to a SIEM is to reduce the time investment to create a baseline
    and tune with alerting without requiring highly experienced staff.


    A current major cybersecurity threat is the manipulation and forgery of digital
    multimedia content such as images and videos, using widely available and easy-to-use
    image and video editing tools. Hence, a given digital image or video cannot be
    blindly trusted, or cannot be accepted in a court-of-law, unless established to
    be authentic. Manipulated multimedia can adversely impact the political views
    and law and order of an entire nation. So, multimedia modification attacks are
    a crucial problem in cyberspace. To address this problem, a deep convolutional
    neural network (CNN) model based on digital forensic measure has been presented
    in the [sixth chapter](#ch06.xhtml) to verify the integrity and authenticity of
    digital images. The presented deep learning–based forensic framework efficiently
    detects and localizes the forged region(s) in double-compressed JPEG images. The
    experimental results establish the efficiency of the proposed model.


    We earnestly hope that this book describing cutting-edge research efforts on such
    diverse but very important topics would be a useful resource for students, researchers,
    and practitioners alike.


    **Sangita Roy, Rajat Subhra Chakraborty, Jimson Mathew, Arka Prokash Mazumdar,
    and Sudeshna Chakraborty**


    May 2022


    # About the Editors


    ![](images/inlinefm_1.jpg)


    **Dr. Sangita Roy** is currently working as an assistant professor at the Department
    of Computer Science and Engineering, Thapar Institute of Engineering and Technology,
    Patiala, Punjab, India. She did her postdoc (on sabbatical) at the Department
    of Electrical Engineering, Tel Aviv University, Israel. She received her B.Tech
    from West Bengal University of Technology and M.Tech from Kalinga Institute of
    Industrial Technology, Odissa. She did her PhD from IIT Patna. Her research interests
    include computer network, network security, image processing and deep learning,
    IoT, and blockchain.


    ![](images/inlinefm_2.jpg)


    **Dr. Rajat Subhra Chakraborty** is currently a professor at the Department of
    Computer Science and Engineering of IIT Kharagpur. He received his PhD from Case
    Western Reserve University (U.S.A.) and BE from Jadavpur University. He has professional
    experience in working at National Semiconductor (Bangalore, India) and Advanced
    Micro Devices (AMD) (Santa Clara, USA). His research interests include hardware
    security, VLSI design and design automation, digital content protection, and digital
    image forensics. He holds two granted U.S. patents, and has co-authored 6 books,
    8 book chapters, and over 120 publications in international journals and conferences.
    His work has received over 6,000 citations to date, and a paper he has co-authored
    won the Best Paper Award at the IWDW''16 workshop. He has received several prestigious
    national and international awards such as IIT Kharagpur Outstanding Faculty Award
    (2018), IEI Young Engineers Award (2016), IBM Shared University Research (SUR)
    Award (2015), Royal Academy of Engineering (U.K.) RECI Fellowship (2014), and
    IBM Faculty Award (2012). He is currently an associate editor of *IEEE TCAD* journal.
    Dr. Chakraborty is a senior member of IEEE and a senior member of ACM.


    ![](images/inlinefm_3.jpg)


    **Dr. Jimson Mathew** is currently a professor and head of the Department in the
    Computer Science and Engineering, Indian Institute of Technology Patna, India.
    He received a master''s in computer engineering from Nanyang Technological University,
    Singapore and a PhD degree in computer engineering from the University of Bristol,
    Bristol, U.K. He has held positions with the Centre for Wireless Communications,
    National University of Singapore; Bell Laboratories Research Lucent Technologies
    North Ryde, Australia; Royal Institute of Technology KTH, Stockholm, Sweden; and
    Department of Computer Science, University of Bristol, UK. He has published more
