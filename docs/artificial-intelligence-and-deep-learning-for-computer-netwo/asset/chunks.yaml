- raw: 'Cyber Terrorism– In the USA, a critical infrastructure is defined as “the
    assets, systems, and networks, whether physical or virtual, so vital to the United
    States that their incapacitation or destruction would have a debilitating effect
    on security, national economic security, public health or safety, or any combination
    thereof” \[[4](#ch06.xhtml#ref6_4)\]. Infrastructure that delivers electricity
    and water, controls air traffic, or supports financial transactions is seen as
    “critical life sustaining infrastructures.” All of these directly depend on underlying
    communications and network infrastructure \[[5](#ch06.xhtml#ref6_5)\]. The enemy
    (cyber specialist) can destroy this critical insfrastructure of a country via
    cyberspace. This could be directly through a cyber-attack to damage the national
    electricity grid, or indirectly, getting secret information through denial-of-service
    attacks. An example of such attacks is the attack on Estonia in April/May of 2007.
    The protection of such critical infrastructure forms an important part of cybersecurity
    and is included as an important national imperative in national cybersecurity
    strategies.


    Digital Media– The entertainment industry is one of the most affected industries
    by sharing unauthorized information (without manipulation), such as movies, music,
    and other forms of digital media. Although this unauthorized sharing does not
    necessarily violate the integrity, confidentiality, or availabilty of the shared
    digital media, however, this directly affects the financial loss of the legal
    owner of copyright digital media.


    In addition to this, nowadays every person''s day-to-day life encompasses exchange
    and sharing of digital media in large volumes, especially digital images and videos.
    For example, *500+* hours of video content was uploaded every minute in YouTube
    \[[6](#ch06.xhtml#ref6_6)\], Facebook users uploaded *14.58* million images per
    hour \[[7](#ch06.xhtml#ref6_7)\], and *8.95* million images and videos were shared
    on Instagram per day as per data collected in 2017 \[[8](#ch06.xhtml#ref6_8)\].


    Among the shared information, a lot of information is manipulated (intentionally
    create fake information), which provide wrong information to the audience. According
    to a report \[[9](#ch06.xhtml#ref6_9)\], by Massachusetts Institute of Technology
    (MIT) researchers, roughly *one* in every *eight* photos shared in WhatsApp groups
    during the Lok Sabha elections in India in 2019 were misleading. A total of *5*
    million messages from 2.5 lakh users were compiled in between October 2018 and
    June 2019. It is observed that 52% of all messages were visual, including 35%
    images and 17% videos, and 13% of all shared images were misleading \[[9](#ch06.xhtml#ref6_9)\].
    In this chapter, we will discuss image manipulation and its detection techniques
    in detail. The motivation and prime objectives of this chapter are presented in
    the following section.


    ### [6.1.1 Motivation and Objectives](#ch06.xhtml#c_sec6_001_001)


    In recent years, many researchers have focused on various domains of digital multimedia
    content security and protection, such as digital multimedia rights management,
    digital multimedia authentication, and detection of forgery. To overcome these
    problems, many advanced security measures and technologies have been developed
    in the past couple of years; the most widely used among these are *digital signature*
    and *digital watermarking* \[[10](#ch06.xhtml#ref6_10)\].


    Digital images and videos can be easily manipulated using widely available image
    and video editing tools. It has become impossible to perceptually differentiate
    expertly manipulated (forged) images and videos from authentic ones. An example
    of image manipulation is shown in [Figure 6.1](#ch06.xhtml#fig6_1). [Figure 6.1(a)](#ch06.xhtml#fig6_1)
    presents an authentic image, where a total of four horses are present, and [Figure
    6.1(b)](#ch06.xhtml#fig6_1) presents a forged (manipulated) image, where two extra
    horses are added. Using traditional techniques for multimedia security and protection,
    including *digital signature* and *digital watermarking*, we can detect the authenticity
    of multimedia. Such techniques depend on some external information, such as *digital
    signature* or *watermark*, and the external information is computed by pre-processing
    the multimedia data in some form or another. Additionally, such techniques require
    enbedded hardware chips and software to embed the *digital signature* or *watermark*
    into images and videos. Also, many of the digital cameras did not support digital
    watermarking or digital signatures.


    ![Figure 6.1 An example of image forgery \[11\]: (a) authentic image and (b) forged
    image.](images/fig6_1.jpg)


    [Figure 6.1 An example of image forgery](#ch06.xhtml#Ffig6_1) \[[11](#ch06.xhtml#ref6_11)\]:
    [(a) authentic image and (b) forged image.](#ch06.xhtml#Ffig6_1)


    On the other hand, the field of blind forensic measure is recent and still developing,
    and it does not require any pre-processing step, i.e., embedding digital signature
    or watermark. By analyzing intrinsic characteristics of images \[[12](#ch06.xhtml#ref6_12),[13](#ch06.xhtml#ref6_13)\],
    which are left behind by the manipulation operation itself, it can detect the
    tempered images and videos. Hence, a blind forensic technique is a completly post-processing-based
    operation. This chapter aims to investigate the problem of forgery detection in
    images through blind digital forensic measures.


    The most common blind digital image forgery detection techniques are *copy-move
    forgery detection* \[[14](#ch06.xhtml#ref6_14)\], *image splicing forgery detection*
    \[[15](#ch06.xhtml#ref6_15)\], *image retouching detection* \[[16](#ch06.xhtml#ref6_16)\],
    and *joint photographic experts group (JPEG) double/multiple compression detection*
    \[[17](#ch06.xhtml#ref6_17)\].


    *Copy-move forgery* is also known as region duplication forgery, where regions
    of an image are copied and pasted onto another target region within the same image
    to obscure or repeat one or more significant object(s) in the image. Unlike copy-move
    forgery, *image splicing* \[[18](#ch06.xhtml#ref6_18)\] comprises of a composition
    of multiple images. *Image retouching* \[[16](#ch06.xhtml#ref6_16),[19](#ch06.xhtml#ref6_19)\]
    is nothing but enhancing the image quality by editing certain image pixels such
    as red eye removal, sharpness, tone adjustment, etc. Such forms of modification
    are generally detectable by investigating inconsistencies in natural statistical
    properties of an image \[[19](#ch06.xhtml#ref6_19),[20](#ch06.xhtml#ref6_20),[21](#ch06.xhtml#ref6_21)\].


    *JPEG double/multiple compression detection* \[[13](#ch06.xhtml#ref6_13),[17](#ch06.xhtml#ref6_17),[22](#ch06.xhtml#ref6_22)\]
    (JPEG compressed image) has to be decompressed first before performing forgery.
    After performing forgery, the resultant image may be compressed again to be stored
    in a JPEG format. Hence, when a JPEG image is modified/edited, a subsequent compression
    occurs due to consecutive saving of the edited image back to the memory. So, it
    can be inferred that double or multiple compressed images are forged. However,
    it is not guaranteed that a double or multiple JPEG compressed image is always
    forged. However, varying degrees of JPEG compression are a good indicator of forgery.


    The main objective of this chapter is to present a blind forensic framework for
    JPEG double compression–based image manipulation (forges) detection. In the following
    section, we present our contribution in this chapter.


    ### [6.1.2 Our Contributions](#ch06.xhtml#c_sec6_001_002)'
