    \n13.  [References](#ch05.xhtml#chapter5_RL_1)\n\n## [5.1 Introduction](#ch05.xhtml#c_sec5_1)\n\
    \nSecurity information and event management (SIEM) play a key role in improving\
    \ the next-generation cybersecurity-based secure communication against potential\
    \ cyber-attacks. Nowadays, the world has been connected by Internet of Things\
    \ (IoT) devices, which will reach 1.3 trillion by 2026. In such cases, potential\
    \ cyber-attacks that affect the communication layers between computers and IoT\
    \ devices through centralized and decentralized systems will be more vulnerable,\
    \ such as DDoS attacks, botnet, social attacks, man-in-the-middle attacks, etc.\
    \ during its applications in worldwide industrial areas such as the healthcare\
    \ sector, smart transportation, agriculture, online banking, Google pay, Paytm\
    \ banking, etc \\[[1](#ch05.xhtml#ref5_1)\\].\n\nAs a solution in this chapter,\
    \ deep learning–based vulnerability detection and prevention model for SIEM with\
    \ lightweight computing has been proposed. Also, an open-source decentralized\
    \ vulnerabilities detection model will be developed for testing the implementation\
    \ of industrial applications. Through this chapter scalability, reduced latency,\
    \ secure reliable communication, and fast downloading/uploading through Internet\
    \ of Things can be achieved. The deliverable of the chapter is a deep learning\
    \ (DL)–based model to detect and protect the vulnerabilities for IoT networks\
    \ that will have a great focus in the near future for secure communication. The\
    \ following are features of SIEM for IoT networks \\[[2](#ch05.xhtml#ref5_2)\\\
    ]:\n\n> Suitable for an organization.\n\n> \n\n> Can identify, monitor, record,\
    \ and analyze security incidents or events within an environment and store their\
    \ relevant data centrally.\n\n> \n\n> Provides a complete, holistic view of the\
    \ environment, end to end, and tracks it over time and helps to ease the process.\n\
    \n> \n\n> Has potential to enhance the efficiency of incident-handling activities\
    \ that result in saving resources, manpower, and time for incident-handling folks.\n\
    \n> \n\n> Has advantages like better data protection, improved compliance, easier\
