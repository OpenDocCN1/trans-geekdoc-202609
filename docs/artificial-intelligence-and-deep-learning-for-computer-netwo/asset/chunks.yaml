    By focusing on an efficient use of radio resources, only downlink scheduling is
    the objective of NIS. It does not deal with delay sensitivity issues in deliveries
    of prioritized traffic in NB-IoT networks. Consequently, average throughput of
    the individual traffic becomes low in NIS, compared to NB-PTS. NANIS minimizes
    the consumption of radio resources during downlink scheduling and this minimization
    is not based on the prioritized traffic. In addition, the transmission delay of
    the traffic is not considered to be minimized, and thus, the throughput of a priority-based
    traffic in NANIS is lower than NB-PTS. The threshold-based approach of NANIS also
    raises the question of adaptibility of the algorithm in different network scenarios.
    When the number of connected UEs is 30, [Figure 4.4](#ch04.xhtml#fig4_4) and [Figure
    4.5(a)](#ch04.xhtml#fig4_5) indicate that the average throughputs of “Priority-1”
    traffic in NB-PTS are approximately 36%, 28%, and 27% higher than that of the
    general, NIS, and NANIS, respectively. The average throughputs of “Priority-2”
    traffic are approximately 32%, 24%, and 9% more in NB-PTS than the general, NIS,
    and NANIS mechanisms, respectively. For “Priority-3,” these enhancements are approximately
    33%, 28%, and 20% more in NB-PTS than the general, NIS, and NANIS approaches,
    respectively.


    #### [4.4.4.1 Overall Average Throughput](#ch04.xhtml#c_sec4_004_004_001)


    Since average throughput of the individual priority-based traffic is higher in
    NB-PTS than “General,” NIS, and NANIS approaches, the overall average throughput
    is improved significantly in NB-PTS compared to these baseline mechanisms, as
    shown in [Figure 4.5(b)](#ch04.xhtml#fig4_5). From [Figure 4.4](#ch04.xhtml#fig4_4)
    and [Figure 4.5](#ch04.xhtml#fig4_5), it can also be noted that NB-PTS still manages
    to achieve higher average throughput in a congested network scenario (while the
    number of UEs is increased). This is possible with the use of the past experience
    in NB-PTS, which selects the value of the queue threshold dynamically, such that
    PLR would be minimized and thus, average throughput would be increased. From [Figure
    4.5(b)](#ch04.xhtml#fig4_5), NB-PTS has approximately 34%, 26%, and 22% higher
    average throughputs than the General, NIS, and NANIS schemes, respectively (#UE=
    30).


    ### [4.4.5 Analysis of Packet Loss Rate and Packet Delay](#ch04.xhtml#c_sec4_004_005)


    Determinations of the queue threshold and the target mean delay are the key factors
    in scheduling traffic to maintain a low average delay in packet transmission.
    NB-PTS considers these factors along with the present mean delay, which is included
    in computation of the queue threshold value for the next time slot; consequently,
    the next queue threshold is influenced by the present delay status, which helps
    to tune the target mean delay based on the recent delay experienced by the packets
    stored in queue. With the application of *ϵ*\-greedy policy, NB-PTS learns the
    environment and selects the target mean delay, such that the next packets can
    be scheduled within this delay. As a result, the probability of packet loss and
    average packet delay are reduced in NB-PTS compared to “General,” NIS, and NANIS,
    as illustrated in [Figure 4.6](#ch04.xhtml#fig4_6). Here, we show the average
    results based on per traffic priority. In this case, since NIS and NANIS are not
    online learning–based approaches and do not concentrate on minimizing packet delay
    of prioritized traffic delivery, the performances of NIS and NANIS are significantly
    lower than NB-PTS. However, since “General” is a basic approach of scheduling,
    NIS and NANIS have lower average PLR and delay than the “General” mechanism. From
    [Figure 4.6](#ch04.xhtml#fig4_6), it can be observed that, when the number of
    connected UEs is 30, NB-PTS has approximately 68%, 59%, and 52% lower average
    PLR than General, NIS, and NANIS, respectively. In case of delay, the proposed
    mechanism has approximately 52%, 48%, and 46% low average delay compared to the
    General, NIS, and NANIS approaches, respectively.


    ![Figure 4.6 (a) Average PLR; (b) average delay.](images/fig4_6.jpg)


    [Figure 4.6 (a) Average PLR; (b) average delay.](#ch04.xhtml#Ffig4_6)


    #### [4.4.5.1 PLR and Delay of Individual Priority-Based Traffic](#ch04.xhtml#c_sec4_004_005_001)


    In computing the metric *W*[*t*+1], the consideration of HOL delay of individual
    priority-based traffic leads to the reduction of average delay of each priority
    class. Scheduling is performed based on *W*[*t*+1], which considers the priority
    of a traffic; and, therefore, as this priority increases, the average PLR and
    delay of the traffic are reduced further. It is shown in [Figure 4.7](#ch04.xhtml#fig4_7),
    where it can be noted that although rate of packet loss and delay are enhanced
    as the number of UEs is increased, a higher priority traffic can have a lower
    delay than that of lower-priority traffic, with the help of the metric *W*[*t*+1].
    In this direction, the selection of the queue threshold value is crucial, which
    is intelligently chosen in NB-PTS by utilizing the past experience of that selection.
    Additionally, *W*[*t*+1] includes the probability that the HOL packet delay of
    a traffic exceeds its target mean delay. NB-PTS schedules packets by trying to
    reduce this probability and consequently, the rate of packet transmission (within
    the target mean delay) is increased. This scenario helps to minimize average delay
    in packet scheduling.


