    近年来，一些盲法证措施，如 `[23,24,25,26]`，也被用于检测 JPEG 图像中的基于双重压缩的伪造。然而，大多数最先进的盲法数字取证技术利用从
    JPEG 压缩伪影中提取的手工制作特征，来检测图像中的双重 JPEG 压缩。然而，此类手工制作特征的性能受到各种场景的限制，例如第一次压缩的质量因子 `QF[1]`
    大于第二次压缩的质量因子 `QF[2]`。因此，在大型数据集中识别适合检测 JPEG 双重压缩的特征是一项具有挑战性的任务。近年来，深度学习技术在计算机视觉、网络安全和自然语言处理领域受到了广泛关注，因为它能够自动提取合适的特征。


    在本章中，我们提出了一种基于深度学习的框架，用于检测和定位基于双重压缩的 JPEG 修改攻击。在这项工作中，我们将上述问题建模为双向分类，即识别单次和双次
    JPEG 压缩的图像。接下来，我们通过对测试图像执行重叠块分类来定位图像中的双重压缩（伪造）区域。此外，所提出的取证框架还克服了最先进的技术（如 `[26,27,28]`）的局限性，即第一次压缩的质量因子大于第二次压缩的质量因子（`QF
    1 > QF 2`）。


    本章的组织如下。本章将简要讨论 JPEG 压缩的相关背景，并考虑 JPEG 攻击模型，同时介绍与基于重新压缩的 JPEG 伪造检测相关的最新研究工作，这些内容将在
    `第 6.2 节` 中介绍。在 `第 6.3 节` 中，我们提出了一种基于深度学习的盲法取证框架，用于检测 JPEG 双重压缩，最后本章将在 `第 6.5
    节` 中总结。


    ## 6.2 相关背景


    在本节中，我们将简要讨论 JPEG 压缩，并介绍 JPEG 攻击模型。本节还将介绍基于重新压缩的 JPEG 伪造检测技术的文献综述。


    ### 6.2.1 JPEG 图像压缩概述


    联合图像专家组（JPEG）`[29]` 是最广泛使用的图像存储格式。JPEG 图像压缩和解压缩技术的框架如 `图 6.2` 所示。首先，将图像分割为大小为
    8×8 的非重叠像素块，记为 `B`，然后对每个块执行二维离散余弦变换（DCT）。因此，它得到相应的 DCT 系数块，记为 `D^(B)`。然后，每个 DCT
    系数块由一个 8×8 量化矩阵 `Q[QF]` 进行量化。质量因子 `QF` 定义了一个量化矩阵。


    ![Figure 6.2 JPEG compression and de-compression process.](img/fig6_2.jpg)


    图 6.2 JPEG 压缩和解压缩过程。


    `QF` 的值在 `[1, 100]` 之间，`QF` 值越高，表示压缩程度越低。


    JPEG 解压缩过程只是压缩过程的逆过程。首先，量化的 DCT 系数 `Q*C[q]^(B)` 通过将量化的 DCT 系数 `Q*C[q]^(B)` 与相应的量化矩阵
    `Q[QF]` 相乘进行反量化，以得到反量化系数 `D^(-B)`。然后，通过对反量化的 DCT 系数应用逆离散余弦变换（IDCT）来重建图像像素块（记为
    `B′`），最后进行舍入和截断操作。


    量化函数是一个不可逆操作，因为舍入函数的存在。这使得 JPEG 成为一种有损压缩技术。由于量化步骤，在 JPEG 的编码和解码过程中会为图像产生量化误差。量化误差定义为
    `Q[error] = D^(B) − (D^(B)/Q[QF])Q[QF]`。


    除了量化误差，在 IDCT 过程中还会引入舍入误差和截断误差。在对反量化的 DCT 系数执行 IDCT 时，会生成一些浮点值。这些浮点值由 IDCT 生成，并应四舍五入到最接近的整数值。这会产生舍入误差。如果舍入后的值超出
    `[0, 255]` 的范围，则将其截断到该范围内。这会导致截断误差。利用这些压缩误差，许多研究人员，例如 Farid 等人 `[12]`、Bianchi
    等人 `[27]`、Barni 等人 `[30]` 和 Taimori 等人 `[31]`，检测 JPEG 图像中的伪造行为。


    ### 6.2.2 JPEG 攻击模型


    文献中最常见的 JPEG 攻击模型如下。设一张 JPEG 图像最初使用质量因子 `QF[1] ∈ [0, 100]` 进行压缩，如 `图 6.3(a)` 所示，这被称为第一次
    JPEG 压缩图像。接下来，从单次压缩的 JPEG 图像中提取一个目标区域，并在质量因子 `QF[2] ∈ [0, 100]` 下重新压缩，其中 `QF[2]
    ≠ QF[1]`，如 `图 6.3(c)` 所示。将提取的重新压缩区域粘贴到其原始位置以生成伪造图像，如 `图 6.3(c)` 所示。因此，在生成的篡改图像中存在两种不同的压缩程度：一种是具有后续质量因子
    `QF[1]*, QF[2]` 的双重压缩（操纵）区域，另一种是图像的其余部分（真实）区域，该区域在质量因子 `QF[1]` 下压缩。从 `图 6.3(c)`
    可以明显看出，篡改区域具有（双重）压缩比，与图像的其余部分不同，并且在感知上无法区分。


    ![Figure 6.3 JPEG attack on image [32]: (a) authentic 512 × 512 image; (b) selected
    region, re-saved at a different compression quality factor; (c) forged image with
    partially double-compressed regions.](images/fig6_3.jpg)


    图 6.3 图像上的 JPEG 攻击 `[32]`: (a) 真实 512 × 512 图像；(b) 选定区域，以不同的压缩质量因子重新保存；(c) 具有部分双重压缩区域的伪造图像。


    ### 6.2.3 相关工作


    在本节中，我们将简要概述近年来在基于 JPEG 重新压缩的图像取证方面的研究。近年来，已进行了大量关于双重 JPEG 压缩检测的研究。该方向早期的大多数研究工作都基于统计分布的利用，例如
    `Benford''s law` 或 `first-digit law` `[33,34,35]` 的 JPEG 双重压缩量化效应。


    '
