    在测试阶段，我们根据 JPEG 攻击模型（如 第 6.2.2 节 所述），通过改变 JPEG 压缩质量因子以及伪造区域占实际图像 10%、30% 和 50%
    的大小，创建 JPEG 双压缩伪造图像。


    在 UCID 数据集 \[42\] 上，所提出框架 \[32\] 基于 JPEG 重新压缩的伪造定位结果可视化如 图 6.7 所示，包含三种不同的伪造尺寸。在
    图 6.7 中，第一行代表 JPEG 质量因子 `QF 1` = 50 的单压缩图像。为了创建伪造图像，从单压缩 JPEG 图像中提取 10%、30% 和
    50% 的区域，并以质量因子 `QF 3` = 90 保存这些区域，然后将其重新放置到原始位置，如 图 6.7(a)、(b) 和 (c) 的中间行所示。伪造（双压缩）区域以绿色高亮显示，相应的伪造检测和定位结果以白色高亮显示在
    图 6.7 的底行。从 图 6.7 可以看出，所提出的技术可以高效地定位伪造区域。


    ![图 6.7 伪造检测和定位结果 \[32\]。伪造尺寸：(a) 10%，(b) 30%，(c) 50%。(顶部) 真实图像。(中间) 篡改图像：高亮显示篡改区域。(底部)
    伪造区域的检测和定位。](images/fig6_7.jpg)


    图 6.7 伪造检测和定位结果 \[32\]。伪造尺寸：(a) 10%，(b) 30%，(c) 50%。(`顶部`) 真实图像。(`中间`) 篡改图像：高亮显示篡改区域。(`底部`)
    伪造区域的检测和定位。


    图 6.8 展示了所提出的基于深度学习的取证技术在 20 张 UCID 测试图像 \[42\] 上，通过变化质量因子 `QF[1]` 和 `QF[2]` 得到的
    JPEG 重新压缩定位结果（以平均准确率表示）。图 6.8 还展示了 Wang 等人 \[26\]、Bianchi 等人 \[27\] 和 Lin 等人 \[28\]
    三种最先进的技术方案的定位结果。从 图 6.8 可以看出，当 `QF[1]` > `QF[2]` 时，所提出的基于深度学习的取证模型表现显著优于其他三种方案。这是因为
    CNN 有助于保留空间结构特征，并高效学习 JPEG 系数分布的统计模式，从而提高检测准确率。然而，对于 `QF[1]` `< QF[2]` 的情况，所提出方案的性能仅略高于最先进的技术。在
    `QF[1]` = `QF[2]` 的情况下，所提出方案的性能高于 Wang 等人 \[26\]、Bianchi 等人 \[27\] 和 Lin 等人 \[28\]
    的方案。尽管如此，所提出方案并未提供令人满意的性能。


    ![图 6.8 不同 QF2 − QF1 值的平均准确率 \[32\]。](images/fig6_8.jpg)


    [图 6.8 不同 `QF[2]` − `QF[1]` 值的平均准确率](#ch06.xhtml#Ffig6_8) \[32\]。


    ## 6.5 结论


    在本章中，我们讨论了多媒体（即图像和视频伪造）上的非法修改攻击及其与网络安全的关系。我们观察到，JPEG 重新压缩痕迹有助于检测图像中的伪造。在本章中，我们还提出了一种基于深度学习的取证框架，用于检测和定位图像中的伪造（双
    JPEG 压缩区域）。预处理的 19 × 7 JPEG DCT 系数被输入 CNN，以从单压缩和双压缩 JPEG 图像中提取和学习合适的特征。


    实验结果证明，所提出的基于深度学习的取证方案可以高效地检测和定位 JPEG 双压缩伪造区域，并且优于最先进的技术，尤其是在第一次压缩比率大于第二次压缩比率时，即
    `QF[1]` `> QF[2]`。然而，所提出的方案不适用于 JPEG 质量因子 `QF[1]` = `QF[2]` 的情况。


    未来在此方向上的研究将涉及调查两次压缩的质量因子相同（即 `QF[1]` = `QF[2]`）时的 JPEG 双压缩检测。未来工作将重点研究三次及更高程度的基于
    JPEG 压缩的伪造。


