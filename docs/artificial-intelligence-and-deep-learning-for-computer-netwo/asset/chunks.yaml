    ## [6.1 Introduction](#ch06.xhtml#c_sec6_1)


    In recent years, cybersecurity has gained a lot of attention from researchers.
    Cybersecurity is the framework that protects our valuable digital information.
    It provides the necessary protection for computers, mobile devices, servers, digital
    electronic systems, and data from malicious attacks. However, cybersecurity covers
    a large number of topics; for example, exploitation of resources, unauthorized
    access, and manipulating with digital data. Next, we briefly present a few scenarios
    \[[1](#ch06.xhtml#ref6_1)\] as examples:


    Cyberbullying– In our modern society, cyberbullying has become a major threat
    \[[2](#ch06.xhtml#ref6_2)\]. As reported in \[[2](#ch06.xhtml#ref6_2)\], the digital
    technology is increasingly used to bully, “cause embarrassment, invoke harassment
    and violence, and inflict psychological harm.” This could lead to “severe and
    negative impacts on those victimized.” However, being bullied in cyberspace does
    not constitute a loss of integrity, confidentiality, or information. Instead of
    these, the target of such activities is the user him/herself.


    Home Automation– Multitude of home automation application \[[3](#ch06.xhtml#ref6_3)\],
    such as integrated home sequrity system, televisions, hot water heaters, etc.,
    have been rising rapidly with the development of advanced fields of electronics
    and information and communication technologies (ICTs). Many of these applications
    have web-based control systems that allow control from the outside. Unfortunately,
    this web-based control system increases the risk of unauthorized access to such
    systems and may cause harm. The range of this harm can be from “pranks” (like
    the switch of the refrigerator) to serious crimes, such as turning off the security
    system in order to burglarize the home or other malpractice.'
