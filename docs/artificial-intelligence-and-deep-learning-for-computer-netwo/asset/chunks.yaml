    Determinations of the queue threshold and the target mean delay are the key factors
    in scheduling traffic to maintain a low average delay in packet transmission.
    NB-PTS considers these factors along with the present mean delay, which is included
    in computation of the queue threshold value for the next time slot; consequently,
    the next queue threshold is influenced by the present delay status, which helps
    to tune the target mean delay based on the recent delay experienced by the packets
    stored in queue. With the application of `ϵ`-greedy policy, NB-PTS learns the
    environment and selects the target mean delay, such that the next packets can
    be scheduled within this delay. As a result, the probability of packet loss and
    average packet delay are reduced in NB-PTS compared to “General,” NIS, and NANIS,
    as illustrated in [Figure 4.6](#ch04.xhtml#fig4_6). Here, we show the average
