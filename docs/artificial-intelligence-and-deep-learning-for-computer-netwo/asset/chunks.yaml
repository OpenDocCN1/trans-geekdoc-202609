    real-time applications. In this chapter, deep learning techniques in the LSTM
    deep neural network (DNN) model based vulnerable detections using data sets. The
    LSTM (long short-term memory) is a powerful DNN model and it is a modified version
    of RNN (recurrent neural network). This model provides the facility to avoid the
    problem of long-term dependency.


    The basic structure of LSTM is shown in [Figure 5.7](#ch05.xhtml#fig5_7).


    In the above diagram, each rectangle box represents the network layaers and the
    pink circles represent operations like addition and multiplication. The yellow
    box represents the model learned in the neural networks and each line carries
    the information from the output of one node to the input of the next node. The
    LSTM has the capability to add or delete the information of cells automatically.
    It uses the sigmoid and tanh activation functions to update the cell values and
    parameters \[[4](#ch05.xhtml#ref5_4),[13](#ch05.xhtml#ref5_13)\].


    ### [5.3.3 Algorithm for LSTM](#ch05.xhtml#c_sec5_003_003)


    1. Decide on the information going out from the cell state by using the sigmoid
    layer and using the previous hidden layer and current input value. The output
    is in between 1 or 0, where 1 is keep the entire information and 0 represents
    ignore the information.


    2. Identify or decide on the new information stored in cell. This is done in two
    phases. In the first phase, decide which values to update. This is done by sigmoid
    layer. In next phase, the tanh layer decides the new values to add in the cell,
    as shown in [Figure 5.8](#ch05.xhtml#fig5_8).


    3. Update the cell state by the new values calculated in the previous state, as
    shown in [Figure 5.8](#ch05.xhtml#fig5_8).


    ![Figure 5.8 The basic structure of LSTM.](images/fig5_8.jpg)


    [Figure 5.8 The basic structure of LSTM.](#ch05.xhtml#Ffig5_8)


    `i^⋅t = σ(W[i].[h(t − 1), x[t]] + b[i])` (5.2)


    `C˙t = tanh(W[c].[h(t − 1), x[t]] + b[c])` (5.3)


    ### [5.3.4 LSTM Implementation for Vulnerabilities Detection](#ch05.xhtml#c_sec5_003_004)


    1. Data collection using the Cuckoo Sandbox application is installed on a system
    running in Ubuntu Linux.


    2. Data pre-processing and analyses of vulnerability damage to computer systems
    and compromises to user security.


    3. Data classification to identify the vulnerabilities present or not in the system.


    4. Validate the model and predict the accuracy for 96%.


    In this experiment, after applying the pre-processing techniques, the data is
    submitted to the LSTM model. The model learns the data, updates the parameters,
    and creates the reference model. The testing phase applies the data that contains
    the malicious vunerable code to the reference model. The same pre-processing is
    applied to test data like a training phase \[[14](#ch05.xhtml#ref5_14)\]. After
    that, by using the updated parameters like weights and learning rate, detect whether
    the given data contains the malicious vulnerability or not \[[10](#ch05.xhtml#ref5_10)\].
    A crucial component of correlation coding framework accuracy and effectiveness
    is the fact that coding and production results are fully transparent and traceable.
    Deep learning engines can automatically generate rules using attributes provided
    by their DL models. An open-source cybersecurity model for researchers and industries
    that can work without third-party approval can be deployed. ([Figures 5.9](#ch05.xhtml#fig5_9)
    and [5.10](#ch05.xhtml#fig5_10)).


    ![Figure 5.9 New information calculation.](images/fig5_9.jpg)


    [Figure 5.9 New information calculation.](#ch05.xhtml#Ffig5_9)


    ![Figure 5.10 Updates the information of the cell.](images/fig5_10.jpg)


    [Figure 5.10 Updates the information of the cell.](#ch05.xhtml#Ffig5_10)


    ### [5.3.5 Results](#ch05.xhtml#c_sec5_003_005)


    The purpose of the results was to create an LSTM-based vulnerability detection
    model using a vulnerable data set. Although this data set contains instances that
    belong to some vulnerable classes with unbalanced distribution, it has been shown
    that this problem does not affect the classification performance \[[15](#ch05.xhtml#ref5_15)\].
    [Figure 5.11](#ch05.xhtml#fig5_11) shows the LSTM model accuracy when the number
    of epochs is plotted against accuracy on the y-axis. The grey colour represents
    test data, while black colour represents the training data. [Figure 5.11](#ch05.xhtml#fig5_11)
    shows the LSTM model loss when the number of epochs is plotted against the loss
    on the y-axis. The grey colour represents test data while black colour represents
    the training data.


    ![Figure 5.11 Model loss \[15\].](images/fig5_11.jpg)


    [Figure 5.11 Model loss](#ch05.xhtml#Ffig5_11) \[[15](#ch05.xhtml#ref5_15)\].


