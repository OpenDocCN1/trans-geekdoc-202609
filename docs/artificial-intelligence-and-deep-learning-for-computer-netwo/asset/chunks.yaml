    It is a database that continuously monitors vulnerabilities in the IoT networks.
    The advantage of the cybersecurity model is use of unsupervised classifiers in
    machine learning for natural language processing, which can be applied to suspicious
    network layer attacks. Once a model of the traffic is generated in a network,
    it can be used to identify the anomalous \[[11](#ch05.xhtml#ref5_11)\] and \[[5](#ch05.xhtml#ref5_5)\]
    ([Figure 5.6](#ch05.xhtml#fig5_6)).


