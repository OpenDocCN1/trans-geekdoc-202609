- raw: 'Popescu et al. \[[35](#ch06.xhtml#ref6_35)\] investigated and exploited the
    frequency distribution of a histogram of DCT coefficients of JPEG images for double
    compression–based JPEG forgery detection. Due to double compression, a DCT quantization
    artifact was introduced, which affected the distribution of a DCT coefficients
    histogram. These artifacts have been exploited in \[[24](#ch06.xhtml#ref6_24)\],
    for double compression–based JPEG forgery detection. In \[[34](#ch06.xhtml#ref6_34)\],
    Fu et al. analysed the statistical distribution of the first significant digits
    i.e., 1, 2, 3, …, 9, from each of the 8 × 8 DCT blocks of JPEG images, and they
    proposed an effective logarithmic-based generalized Benford''s law that helps
    in the detection of JPEG double compression in images. The probability distribution
    of the first significant digits of each DCT block follows the generalized Benford''s
    law, in the case of single-compressed images, whereas double-compressed images
    deviate from the law. Amerini et al. \[[36](#ch06.xhtml#ref6_36)\] also utilized
    first-digit features of the DCT coefficient blocks of JPEG images to detect a
    splicing attack on single- and double-compressed JPEG images. The distribution
    of histogram of first digits of each DCT block is considered the feature vector,
    which is fed to a support vector machine (SVM) classifier to discriminate between
    single- and double-compressed images.


    In \[[26](#ch06.xhtml#ref6_26)\], Wang et al. exploited the posterior probability
    distribution of each DCT block in JPEG images for detection and localization of
    tampered and untampered image regions. However, localization of the tampered regions
    suffers when any postprocessing attack is performed on the image. Bianchi et al.
    \[[37](#ch06.xhtml#ref6_37)\] analysed the effect of nonaligned-based double compression
    in JPEG recompression detection, and they also proposed a methodology for detecting
    nonaligned double compression exploiting the integer periodicity of the DCT coefficients
    in JPEG images. Their proposed method is also capable of estimating the quantization
    step of the primary (first) compression, along with the estimated grid shift.


    In recent years, deep learning techniques have also started gaining huge popularity
    in JPEG recompression-based image forgery detection \[[30](#ch06.xhtml#ref6_30),[38](#ch06.xhtml#ref6_38),[39](#ch06.xhtml#ref6_39),[40](#ch06.xhtml#ref6_40)\]
    due to spontaneous feature learning capabilities of such networks, which help
    to maximize classification accuracy. Some notable research works \[[30](#ch06.xhtml#ref6_30),[38](#ch06.xhtml#ref6_38),[39](#ch06.xhtml#ref6_39),[40](#ch06.xhtml#ref6_40)\]
    in this direction have been presented below.


    In \[[40](#ch06.xhtml#ref6_40)\], Wang et al. proposed a CNN-based forensic framework
    for double-compression JPEG forgery detection. The DCT features from single- and
    double-compressed images are extracted first and those are then fed into CNN for
    detection of double-compressed images. However, their proposed framework performs
    efficiently if the second compression factor is higher than the first (i.e., *Q*2
    *\> Q*1). Rao and Ni \[[15](#ch06.xhtml#ref6_15)\] initialized the weights of
    the first CNN layer with high-pass filters that suppressed the image contents
    and helps to detect splicing as well as region duplication attacks in JPEG images
    efficiently.


    Barni et al. \[[30](#ch06.xhtml#ref6_30)\] addressed the problem of aligned and
    non-aligned forgery detection in JPEG images using CNN. They proposed three approaches:
    (i) CNN in pixel domain – the image mean subtraction is customarily done before
    CNN training, (ii) CNN in noise domain – denoised JPEG images are directly fed
    into CNN, and (iii) CNN embedding DCT histograms – DCT histograms are computed
    with a CNN layer rather than it extracted from JPEG bitstream, which still works
    if double JPEG images are stored in bitmap or PNG format. Hence, the third proposed
    approache relies on a CNN that automatically extracts first-order features from
    the DCT coefficients. Also, the third approach achieves better accuracy than the
    other two methods, and performs efficiently when the second quality factor is
    greater than the first.


    In \[[38](#ch06.xhtml#ref6_38)\], Amerini et al. proposed multidomain, a combination
    of both a spatial and frequency domain CNN model for detection of double compression
    in JPEG images. Park et al. \[[39](#ch06.xhtml#ref6_39)\] proposed a deep convolutional
    neural network for JPEG double compression in mixed JPEG quality factor images.
    They used a DCT histogram and JPEG quantization tables as input into CNN, which
    identified forged images from authentic ones. However, this method suffers when
    the pixel values of an image are saturated and only low frequencies are present.
    In addition to this, this method also suffers when the difference between two
    consecutive quality factors of JPEG compression is low.


    ## [6.3 Deep Learning–Based Forensic Framework for JPEG Double-Compression Detection](#ch06.xhtml#c_sec6_3)


    In this section, we present a deep learning framework \[[32](#ch06.xhtml#ref6_32)\]
    that consists of pre-processing and a convolutional neural network (CNN) to detect
    double-compressed images. If we fed raw images into a traditional CNN, it would
    learn visual perception of the images, instead of the degree of JPEG compression.
    To learn the intrinsic properties of JPEG compression images, a pre-processing
    step is performed on JPEG images.


    ### [6.3.1 JPEG DCT Coefficients Extraction and Selection](#ch06.xhtml#c_sec6_003_001)


    In the pre-processing step, the images are divided into *B* × *B* (*B* = 32) overlapping
    blocks, with a stride of *S* = 8 pixels. Hence, a total of $\\left( {\\left\\lbrack
    \\frac{M - B}{S} \\right\\rbrack + 1} \\right) \\times \\left( {\\left\\lbrack
    \\frac{N - B}{S} \\right\\rbrack + 1} \\right)$ blocks of size 32 × 32 pixels
    are obtained for an image of size *M* × *N*. However, each 32 × 32 block is constituted
    of sixteen 8 × 8 DCT blocks. Each DCT block has 8 × 8 = 64 DCT coefficients; the
    first coefficient known is a DC coefficient and the remaining are AC coefficients.
    Out of 64, only the first 19 AC coefficients (coefficients 2 to 20 in zigzag order)
    are considered here to reduce the computation cost. Also, 16 DCT blocks are available
    in each 32 × 32 image block. So at this moment, total working DCT coefficents
    are 19 × 16 = 304. To reduce the further computional cost, instead of selecting
    all 16 blocks, only 7 DCT blocks are considered as follows.


    For the *i*\-th coefficient, we find the block where it assumes the highest value
    compared to the rest of the 15 blocks. This maximum block and its six neighbors
    are considered: position-wise, its three immediate predecessors and three immediate
    successor blocks for feature extraction. For example, if 13th DCT block contains
    the highest value for the *i*th coefficient; DCT blocks indexed \[[9](#ch06.xhtml#ref6_9),[10](#ch06.xhtml#ref6_10),[11](#ch06.xhtml#ref6_11),[12](#ch06.xhtml#ref6_12),[14](#ch06.xhtml#ref6_14),[33](#ch06.xhtml#ref6_33),[34](#ch06.xhtml#ref6_34)\]
    are also considered. This generates a 19 × 7 dimension DCT coefficient vector
    for each 32 × 32 image block. This abstraction is carried out to reduce computational
    complexity, without losing any significant block information.'
