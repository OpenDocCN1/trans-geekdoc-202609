    \ Status](#ch05.xhtml#c_sec5_002_002)\n\n[Figure 5.4](#ch05.xhtml#fig5_4) represents\
    \ the importance of incorporating AI into SIEM and the organization respondents’\
    \ suggestions about that \\[[2](#ch05.xhtml#ref5_2)\\].\n\n![Figure 5.4 Combined\
    \ percentages for very effective and somewhat effective security tools enhanced\
    \ by AI.](images/fig5_4.jpg)\n\n[Figure 5.4 Combined percentages for very effective\
    \ and somewhat effective security tools enhanced by AI.](#ch05.xhtml#Ffig5_4)\n\
    \n[Figure 5.4(a)](#ch05.xhtml#fig5_4) represent very important to use it now;\
    \ (b) represents very important so it is planned to implement it this year; (c)\
    \ represents moderately important to use it now; (d) represents moderately important\
    \ so evaluating it for future use; (e) represents not very important so haven’t\
    \ seen any benefits from the implementation; (f) represents not very important\
    \ so have no plans to employ AI at this time.\n\nSecure SIEM model for IoT:\n\n\
    > To implement secure transmission data against anomalies in the networks.\n\n\
    > \n\n> Adaptability to enhance end-to-end users' service.\n\n> \n\n> Availability\
    \ and fault tolerance to control the system as well as detection of failures in\
    \ the applications.\n\n> \n\n> Reliability in overall performance achieved by\
    \ the system in all environmental conditions of time and space complexity.\n\n\
    > \n\n> Scalability is to provide flexibility to extend the network support from\
    \ unexpected service to newly entered devices in the networks.\n\n> \n\n> Performance\
    \ can be achieved through different statistical metrics to overcome the open security\
    \ issues in networks using SIEM.\n\n> \n\n> Extend battery life time for remote\
    \ or local devices connected at various real-time applications in the environment.\n\
    \n> \n\n> Reduced data computation power using decentralized processing techniques.\n\
    \n> \n\n> Lightweight centralized technology is used for nonintervention of humans.\n\
    \nThe SIEM model provides the ability to exchange messages from one device to\
    \ another device, make orders, and complete the data transmission with the help\
    \ of peer-to-peer centralized techniques using minimum hardware cost in a secure\
    \ event management.\n\n## [5.3 Pictorial Representation of Cybersecurity Working\
    \ Model](#ch05.xhtml#c_sec5_3)\n\n[Figure 5.5](#ch05.xhtml#fig5_5) represents\
    \ a cybersecurity working model. This model will be implemented using an open-source\
    \ virtual machine platform. This model consists of server 1 connected with various\
    \ servers up to N servers in the IoT networks. In the model, each and every server\
    \ is connected with every other server along with IoT devices that are used to\
    \ designate a computer code that can facilitate the exchange of attacks, intruder\
    \ message, or anything of worth. The model is connected with various users’ IoT\
    \ devices for all applications related to organizations and industries. This model\
    \ provides immutable security for all processes in real time \\[[10](#ch05.xhtml#ref5_10)\\\
    ] and \\[[5](#ch05.xhtml#ref5_5)\\] ([Table 5.8](#ch05.xhtml#table5_8)).\n\n![Figure\
    \ 5.5 Importance of incorporating AI into SIEM.](images/fig5_5.jpg)\n\n[Figure\
    \ 5.5 Importance of incorporating AI into SIEM.](#ch05.xhtml#Ffig5_5)\n\n[Table\
    \ 5.8 Scope Addressed](#ch05.xhtml#Ttable5_8)\n\n| Scope || Scope Addressed |\n\
    \n| --- | --- |\n\n| To implement a vulnerable monitoring and detection model\
    \ for suspicious network events using DL techniques || Anomaly detection via topic\
    \ modelling technique from NLP using collection of network event data sources,\
    \ such as: Netflow logs DNS logs HTTP proxy logs Here logs are network events\
    \ |\n\n| --- | --- |\n\n| To create an open-source SIEM model for an IoT that\
    \ can work without third-party approval. || Developing open-source coding framework\
    \ for monitoring and detecting suspicious network events like flow, DNS, and proxy\
    \ in order to open borders of SIEM correlation restrictions. |\n\n|  || The framework\
    \ implementation is based on open-source decoders |\n\n|  || Load data in Hadoop\
    \ data transformation |\n\n### [5.3.1 The Proposed Approach](#ch05.xhtml#c_sec5_003_001)\n\
    \nThis chapter has brought out the unique, efficient cybersecurity model for IoT.\
    \ It is a database that continuously monitors vulnerabilities in the IoT networks.\
    \ The advantage of the cybersecurity model is use of unsupervised classifiers\
    \ in machine learning for natural language processing, which can be applied to\
    \ suspicious network layer attacks. Once a model of the traffic is generated in\
    \ a network, it can be used to identify the anomalous \\[[11](#ch05.xhtml#ref5_11)\\\
    ] and \\[[5](#ch05.xhtml#ref5_5)\\] ([Figure 5.6](#ch05.xhtml#fig5_6)).\n\n![Figure\
    \ 5.6 Working model for proposed SIEM in IoT networks.](images/fig5_6.jpg)\n\n\
    [Figure 5.6 Working model for proposed SIEM in IoT networks.](#ch05.xhtml#Ffig5_6)\n\
    \nAnalysis in this analysis phase of the following topic-modelling features are\
    \ considered: 1. Source-IP, 2. Destination-IP, 3. Source-Port, 4. Destination-Port,\
