    # Our primary focus is on the evaluation of the controller load


    We do not emulate the data plane overhead or the actual transmission of packets
    through switches. To evaluate the performance of the proposed schemes, we use
    Python-based simulations. Arnes from the Internet Topology Zoo \[[14](#ch03.xhtml#ref3_14)\]
    is used as the network topology. The parameters used in our experiment are tabulated
    in [Table 3.6](#ch03.xhtml#table3_6).


    ## [Table 3.6 Experimental Setup](#ch03.xhtml#Ttable3_6)


    | Parameter | Value | Parameter | Value |

    | --- | --- | --- | --- |

    | # Controllers | 5 | # Switches | 34 |

    | Topology | Arnes | Factor (*α*) | 0.6 |

    | Factor (*γ*) | 0.7 | Factor (*E*) | 0.7 decay to 0.05 |

    | Dataset: CAIDA1 \[[15](#ch03.xhtml#ref3_15)\] | | | |

    | Data size | 1065GB | # Flows | 67M |

    | Flow-req. rate | 18.7k/s | Flow size | 30 sec |

    | Dataset: CAIDA2 \[[15](#ch03.xhtml#ref3_15)\] | | | |

    | Data size | 1463GB | # Flows | 63M |

    | Flow-req. rate | 17.6k/s | Flow size | 30 sec |

    | Dataset: University \[[13](#ch03.xhtml#ref3_13)\] | | | |

    | Data size | 97.17GB | No. of Flows | 0.43M |

    | Flow-req. rate | 110k/s | Flow size | 30 sec |


    Three datasets were used to simulate the traffic produced by the switches in this
    study: two CAIDA \[[15](#ch03.xhtml#ref3_15)\] datasets and a university \[[13](#ch03.xhtml#ref3_13)\]
    dataset. These datasets provide an overview of both backbone and business network
    traffic. The traffic is broken down into flows. A flow is a four-tuple that includes
    the source IP address, destination IP address, source port number, and destination
    port number.


    We break down the data in time intervals for making a univariant time series using
    *N* data points \[[16](#ch03.xhtml#ref3_16)\].


    ### [3.7.2 Evaluation Metric](#ch03.xhtml#c_sec3_007_002)


    **Load balancing rate:** The load balancing rate computes the variation \[[6](#ch03.xhtml#ref3_6)\]
    of the controller load from its ideal value at time *t*. In this report, we consider
    the ideal load of controller as the mean load of system.


    $\\frac{\\sum\_{j = 1}^{k}\\left( \\left| {L\_{c}(t) - L^{I}(t)} \\right| \\right)}{k}$


    ### [3.7.3 Experimental Results](#ch03.xhtml#c_sec3_007_003)


    The instantaneous load of the five controllers {*c*[0]*, c*[1]*, c*[2]*, c*[3]*,
    c*[4]} at different time steps before the application of Q-learning is shown in
    [Figure 3.5](#ch03.xhtml#fig3_5). Controller load means the number of flows generated
    by those switches connected to the controller. The load is computed at a 30-sec
    interval (time steps). This experiment is to show the dynamic nature of network
    traffic. As can be seen from the figure, there is a wide variation in the controller
    load. This result affirms our hypothesis regarding the bursty nature of network
    traffic.


    ![Figure 3.5 Load on controllers using Q-learning with ϵ-greedy approach.](images/fig3_5.jpg)


    [Figure 3.5 Load on controllers using Q-learning with *ϵ*\-greedy approach.](#ch03.xhtml#Ffig3_5)


    A comparison of the load balancing rate of the Q-learning based approach and a
    random approach is shown in [Figure 3.6](#ch03.xhtml#fig3_6). There is a wide
    variation in the load balancing of the random approach. In the case of Q-learning
    with ϵ-greedy approach, the variation in the load balancing rate is in the range
    of 100000 to 700000, while that of the random method is in the field of 200000
    to 1200000. The results show that the proposed Q-learning approach can restrict
    the variation in the load balancing rate. Further, it also results in an improvement
    in the load balancing rate. Our proposed approach also improves the load balancing
    among the controllers. The average load balancing rate of the Q-learning approach
    is 30% lower than that of the random method. The solution of the Q-learning is
    either chosen at random or depends on the best action as determined by the Q-matrix.
    In the early phases of learning, the Q-matrix does not have much intelligence.
    Consequently, the random process takes precedence over optimal action. However,
    as the learning process gains momentum, random actions are chosen with a lower
    percentage, while optimal actions from the Q-matrix are selected with a higher
    rate. The proposed approach thus results in a balance between exploitation and
    exploration, resulting in a better solution. On the other hand, the random strategy
    merely explores the solution.


    ![Figure 3.6 Comparison of load balance rate.](images/fig3_6.jpg)


    [Figure 3.6 Comparison of load balance rate.](#ch03.xhtml#Ffig3_6)


    A comparison of the number of switches migrated in both approaches is shown in
    [Figure 3.7](#ch03.xhtml#fig3_7). The number of switches migrated in the random
    approach is approximately three times that with the *ϵ*\-greedy approach. Migration
    of a switch involves cost in terms of the control messages exchanged between the
    different stakeholders. The results show that the Q-learning approach reduces
    the migration cost of switch and synchronization cost between the controllers.
    This also translates to a reduction in the migration time. In this work, we have
    considered the selection of switches based on descending order schedule; thus,
    few switches are offloaded from overloaded to balance the system.


    ![Figure 3.7 Comparison of number of migrated switches.](images/fig3_7.jpg)


    [Figure 3.7 Comparison of number of migrated switches.](#ch03.xhtml#Ffig3_7)


    ## [3.8 Conclusion and Future Work](#ch03.xhtml#c_sec3_8)


    This chapter proposed an architecture that adopts a knowledge plane to load balance
    controllers in a software-defined network. The knowledge plane employs reinforcement
    learning to adaptively change the binding between a controller and a switch in
    the SDN. We begin by covering the fundamentals of SDN and RL. To facilitate the
    use of RL, we reformulate the problem of load balancing using the Markov decision
    process. The solution framework exploits Q-learning, a well-known model-free reinforcement
    learning technique. We use real network traffic to validate the proposed solution
    in our experiments.


    We compared our proposed work with a random approach using two metrics, i.e.,
    load balancing rate and the number of switches migrated. We observe that the proposed
    solution limits the range of the controller load variation by a factor of more
    than 60%. This exhibits that the system''s stability is more in our proposed strategy.
    At the same time, the number of switches migrated (overhead) is about three times
    less than that of the random method. In this chapter, we have demonstrated how
    machine learning techniques can be applied to solve SDN problems. In the future,
    we intend to use other learning algorithms such as deep learning to capture the
    network traffic behaviour and solve more complex SDN problems such as controller
    placement.


