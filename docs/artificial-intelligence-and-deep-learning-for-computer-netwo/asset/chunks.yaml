    BatchNorm: Used to speed up the functioning of neural networks. BatchNorm is the
    internal enforcer of normalization within the input values passed between the
    layers of a neural network. Internal normalization limits the covariate shift
    that usually occurs to the activations within the layers. Here''s how it works
    mathematically.


    ReLU: Activation function in this model. Formula: `f(x)=max(0,x)`. Helps capture
    non-linearities in the data post-normalisation.


    The structure of our Keras model is outlined in [Figure 1.1](#ch01.xhtml#fig1_1).
    It uses convolutional layers along with BathNorm for speed-up and stability as
    well as ReLU for activation to finally get the dense output.


    The loss function used is sparse categorical entropy. The mathematical model of
    it is as follows in Equation (1.1):


    ```

    $L\_{CE} = - \\sum\\limits\_{i = 1}^{n}{t\_{i}\\ \\log\\left( p\_{i} \\right),\\mspace{9mu}{for}\\mspace{9mu}
    n\\mspace{9mu}{classes},}$ (1.1)

    ```


    `where t[i] is the truth label and p[i] is the Softmax probability for the ith
    class`.


    **Equation 1.1:** Sequential Model Loss Function


    #### [1.3.3.2 The SVM Model](#ch01.xhtml#c_sec1_003_003_002)


    A hyperplane in an N-dimensional space is obtained using this algorithm where
    N is the number of features. This hyperplane must be able to separate the data
    points in order to classify them into distinct groups. This optimal hyperplane
    is the one that has the maximum distance between data points of both classes that
    enable the creation of good separation of the groups. Ensuring a large margin
    distance provides room for future data points to be classified with more confidence.


    The loss function for SVM can be characterized as follows in Equation (1.2). This
    loss function helps in deriving the current hyperplane across N dimensions to
    calculate the classification across a multi-dimensional dataset accurately. Here,
    it was used with five features for post feature engineering to analyse malicious
    and benign DoH packets. The SVM model is incredibly useful in high dimensional
    situations as it provides a unique loss function with a hyperplane-based classification.


    ```

    $min\_{w}\\lambda \\parallel w \\parallel^{2} + \\sum\\limits\_{i = 1}^{n}{({1
    - y\_{i} < x\_{i},w >})}\_{+}$ (1.2)

    ```


    where `< \\mspace{-4mu} x_{i},w >` is the SVM function that provides the classification
    label for input `x[i]` and SVM parameter `w`, and `y[i]` is the true label.


    **Equation 1.2:** SVM loss function


    ## [1.4 Results and Analysis (with Graphs)](#ch01.xhtml#c_sec1_4)


    For our models, there are two metrics. The first one is the F1 score metric that
    enables the combining of precision and recall of the model. More specifically,
    it is defined as the harmonic mean of the two metrics. The formula is shown in
    Equation 1.3. A perfect model has an F-score of 1.


    ```

    \\begin{array}{lll} {F\_{1} = \\frac{2}{\\frac{1}{\\ {recall}\\ } \\times \\frac{1}{\\
    {precision}\\ }}} & = & {2 \\times \\frac{\\ {precision} \\times {recall}\\ }{\\
    {precision} + {recall}\\ }} \\\\ & = & \\frac{tp}{{tp} + \\frac{1}{2}({fp} + {fn})}
    \\\\ \\end{array}$ (1.3)

    ```


    where tp is the number of true positives, fp is number of false positives, and
    fn is number of false negatives


    **Equation 1.3:** F1 score


    The second metric is the sparse categorical accuracy, which calculates the percentage
    of labels that match the true integer label.


    1. Feature Engineering Module – The output of the extra tree classifier is shown
    in [Figure 1.2](#ch01.xhtml#fig1_2). The entire training dataset is fed to the
    feature engineering module to get a visual representation of the most important
    features.


    ![Figure 1.2 Feature importance.](images/fig1_2.jpg)


    [Figure 1.2 Feature importance.](#ch01.xhtml#Ffig1_2)


    [Figure 1.2](#ch01.xhtml#fig1_2) shows that there are five important features
    when trying to identify a DoH Packet. The following ones are the most important
    features to look for, something our research uniquely provides:


    * `PacketLengthMean`

    * `PacketLengthStandardDeviation`

    * `PacketLengthMode`

    * `PacketLengthCoefficientofVariation`

    * `Duration`


    It can be seen that these features are easily attainable from our parsing technique
    as they are openly available and not encrypted. It is also observed that statistical
    analysis on packet length and time, in general, provide enough information to
    identify DoH packets.


    2. Models Performance – The Keras model provided a sparse categorical score of
    90.8% on the entire dataset. The SVM model provided an F1 score over the dataset
    and had an accuracy of 97% on the test set. The accuracy over epochs for both
    models is described in [Figure 1.3](#ch01.xhtml#fig1_3) and [Figure 1.4](#ch01.xhtml#fig1_4).


    The training time for both architectures was a maximum of 2 minutes, which makes
    it extremely quick for our dataset size.


    ![Figure 1.3 Sequential model accuracy.](images/fig1_3.jpg)


    [Figure 1.3 Sequential model accuracy.](#ch01.xhtml#Ffig1_3)


    ![Figure 1.4 SVM model accuracy.](images/fig1_4.jpg)


    [Figure 1.4 SVM model accuracy.](#ch01.xhtml#Ffig1_4)


    ## [1.5 Conclusion](#ch01.xhtml#c_sec1_5)


    Our dataset provides an improved and more varied dataset than previous works.
    This chapter provides a more challenging set of packets replicating the real-world
    setting in a much better way compared to previous works. The proposed deep learning
    model provides a 93% accuracy on detection of these packets, proving to be highly
    accurate and robust on the task. Finally, the proposed model provides a high accuracy
    of 97% on the malicious DoH detection as well, beating all previous works and
    setting a benchmark in this field. Protocol detection and security is a highly
    challenging area. This paper proposes a mechanism by which researchers can further
    introduce deep learning and automation into detection and classification through
    our dataset. Furthermore, this work has introduced a new deep learning approach
    to classify and detect DoH in a real-world setting. Future work would involve
    exploring DoT detection as well as decrypting messages in these protocols using
    deep learning. The decryption poses the largest challenge, and we hope to see
    the proposed work being used as a base for the same.


    ## [References](#ch01.xhtml#c_chapter1_RL_1)


    1. [M. MontazeriShatoori](#ch01.xhtml#Cref1_1), L. Davidson, G. Kaur, and A. Habibi
