    In the fifth chapter, the authors proposed basic solutions for solving cybersecurity
    issues through DL techniques based on security information and event management
    (SIEM). When well-configured SIEM is paired with DL, SIEMs become even more effective
    and add significant value by reducing the amount of false positives and noise,
    which makes security analysts more productive in the security environment. The
    goal of adding DL to a SIEM is to reduce the time investment to create a baseline
    and tune with alerting without requiring highly experienced staff.


    A current major cybersecurity threat is the manipulation and forgery of digital
    multimedia content such as images and videos, using widely available and easy-to-use
    image and video editing tools. Hence, a given digital image or video cannot be
    blindly trusted, or cannot be accepted in a court-of-law, unless established to
    be authentic. Manipulated multimedia can adversely impact the political views
    and law and order of an entire nation. So, multimedia modification attacks are
    a crucial problem in cyberspace. To address this problem, a deep convolutional
    neural network (`CNN`) model based on digital forensic measure has been presented
    in the [sixth chapter](#ch06.xhtml) to verify the integrity and authenticity of
    digital images. The presented deep learning–based forensic framework efficiently
    detects and localizes the forged region(s) in double-compressed JPEG images. The
    experimental results establish the efficiency of the proposed model.


    We earnestly hope that this book describing cutting-edge research efforts on such
    diverse but very important topics would be a useful resource for students, researchers,
    and practitioners alike.


    **Sangita Roy, Rajat Subhra Chakraborty, Jimson Mathew, Arka Prokash Mazumdar,
    and Sudeshna Chakraborty**


    May 2022


