- raw: 'Existing IDSs detect beacon frame spoofing and access point flooding attacks
    while leaving de-authentication attacks and beacon flooding undetected, which
    may eventually result in denial of service to legitimate access points. Hence,
    in this paper, we propose a machine learning–based approach to detect numerous
    beacon forgeries. In particular, we generate a dataset by launching spoofing,
    flooding, and de-authentication attacks on the network and capturing the network
    frames and analyzing them using supervised and deep learning models. We show that
    our approach detects attacks such as beacon forgery, flooding, and de-authentication
    with an accuracy of 92%.


    ## [2.2 Problem Statement](#ch02.xhtml#c_sec2_2)


    In this paper, we propose to classify numerous types of beacon forgeries using
    supervised and deep learning models such as SVM, k-NN, random forest, MLP, and
    CNN. In particular, we generate datasets in pcap format by performing a spoofing
    attack on Wi-Fi networks using Python scripts on a VM machine running Kali linux
    \[[10](#ch02.xhtml#ref2_10)\]. A dataset thus generated is converted into a csv
    file using tshark \[[11](#ch02.xhtml#ref2_11)\] based on static classification
    rules. The dataset is then examined to detect and classify various types of beacon
    attacks such as forgery, flooding, and de- authentication.


    ## [2.3 Related Work](#ch02.xhtml#c_sec2_3)


    Existing works have proposed IDS and machine learning algorithms to detect and
    predict commonly known cyber attacks such as DDoS, man in the middle, etc. However,
    few approaches have studied management frames to detect beacon attacks. Some of
    them are detailed as follows.


    Liu et al. \[[12](#ch02.xhtml#ref2_12)\] detect false beacon nodes in wireless
    sensor networks (WSNs) based on location and centralised monitoring. But the algorithm
    proposed shows a high false positive rate, thereby making the model unsuitable.
    A similar approach was followed in \[[13](#ch02.xhtml#ref2_13)\] and \[[14](#ch02.xhtml#ref2_14)\]
    where the authors propose a theoretical approach to classify the management frames
    based on sequence number. Ping Lu et al. \[[15](#ch02.xhtml#ref2_15)\] propose
    a self-adaptive method to detect fake access points using location fingerprinting.
    However, this approach also resulted in lesser accuracy. Lovinger et al. \[[16](#ch02.xhtml#ref2_16)\]
    proposed a portable method to detect the de-authentication and fake access points
    in the network using a signature-based approach requiring extra firmware. Fake
    access points have been detected in \[[17](#ch02.xhtml#ref2_17)\] and \[[18](#ch02.xhtml#ref2_18)\]
    by implementing clock skews. But this approach required modifications to the protocol
    and access points. Di Mauro et al. \[[19](#ch02.xhtml#ref2_19)\] have utilized
    a challenge-response authentication protocol to detect fake AP in wireless sensor
    networks. Han et al. \[[20](#ch02.xhtml#ref2_20)\] used round trip time (RTT)
    between the user and the DNS server to detect fake AP, even though this model
    was able to provide 100% and 60% accuracy during low and high traffic, respectively.
    Wireless sniffers can also be used to find the fake AP. However, these methods
    are expensive to be deployed in public/large areas \[[21](#ch02.xhtml#ref2_21),[22](#ch02.xhtml#ref2_22)\].


    In contrast to the existing approaches, we generate a dataset by launching spoofing,
    flooding, and de-authentication attacks and capturing network traffic. Relevant
    features are extracted from the pcap files using tshark and further classified
    based on theoretical rules. The resulting dataset is analyzed using various supervised
    and deep learning models such as SVM, k-NN, MLP, random forest, and CNN to classify
    different beacon attacks.


    ## [2.4 Brief Introduction to the Models](#ch02.xhtml#c_sec2_4)


    In this section, we provide a brief introduction to the mathematical models simulated.


    ### [2.4.1 SVM](#ch02.xhtml#c_sec2_004_001)


    SVM is used for binary classification to propose an optimum boundary between clusters
    of data points by constructing a marginal hyper-plane given by Equation 2.1.


    *H* : *w*^(*T*)(*x*) + *b* = 0 (2.1)


    Data points are classified iteratively to minimize the error in categorizing new
    test points. This is done using kernels to convert feature vector *ϕ*(*x*) to
    a high-dimensional space. Data points are then classified using Equation 2.2.


    *y*[*n*]\[*w*^(*T*)*ϕ*(*x*[*n*])+*b*\] ≤ 0∀ *n* (2.2)


    ### [2.4.2 k-NN](#ch02.xhtml#c_sec2_004_002)


    k-NN selects *k* nearest neighbours and calculates distance between the query
    instance and remaining samples using Euclidean distance (d), as shown in Equation
    2.3. Values thus obtained are arranged in an order and the top *k* points are
    chosen to determine the nearest neighbours \[[23](#ch02.xhtml#ref2_23)\].


    $d(p,q) = \\sqrt{\\sum\\limits\_{i = 1}^{n}{(q\_{i} - p\_{i})}^{2}}$ (2.3)


    where,


    1.  *p*[*i*] = Query-instance


    2.  *q*[*i*] = Second sample considered


    ### [2.4.3 Random Forest](#ch02.xhtml#c_sec2_004_003)


    Random forest is an ensemble algorithm that constructs decision trees on different
    sample clusters and takes a majority vote in classifying the data points. Weights
    to determine the importance of each of the features is calculated as shown in
    Equation 2.4.


    $RF\_{i} = \\frac{\\sum\_{j \\in alltrees}{norm\_{ij}}}{T}$ (2.4)


    where,


    1.  *RF*[*i*] = Importance of feature *i* calculated from all the decision trees


    2.  *norm*[*ij*] = Normalized feature importance for *i* in tree *j*


    3.  T = Total number of trees


    ### [2.4.4 Multilayer Perceptron (MLP)](#ch02.xhtml#c_sec2_004_004)


    MLP belongs to a class of feed-forward neural networks that connects multiple
    layers in a directed graph, thereby providing a signal path through the nodes.
    Each node is characterised by a nonlinear activation function given by *y* = *f*
    (*WxT* + *b*). The weight of each node is updated as shown in Equation 2.5 when
    an error in classification is observed.


    *w**e**i**g**h**t* = *w**e**i**g**h**t* + *L* \* (*y*[*e**x**p*] − *y*[*p**r**e**d*]) \* *x*
    (2.5)


    where,


    1.  L = Learning rate


    2.  *y*[*exp*] = Expected value of output


    3.  *y*[*pred*] = Predicted value of output


    4.  *x* = Input


    ### [2.4.5 CNN](#ch02.xhtml#c_sec2_004_005)


    CNN belongs to the class of neural networks that process data with grid topology.
    Each of the convolutional layers contain a series of filters called kernels. Kernels
    are a matrix of integers (pixels) used to reshape the input vectors to the same
    size as that of the kernel shown in Equation 2.6. This feature is known as stride.
    Each of the corresponding pixels in the kernel and the reshaped vectors are multiplied
    to generate a feature map. Data is then learnt and classified based on the feature
    map values.


    $W\_{out} = \\frac{W - F + 2P}{S} + 1$ (2.6)


    where,


    1.  *W*[*out*] = Size of output volume


    2.  W = Size of input


    3.  F = Spatial size


    4.  P = Padding


    5.  S = Stride


    ## [2.5 Dataset Generation](#ch02.xhtml#c_sec2_5)


    In this section, we describe the process of dataset generation towards detecting
    beacon forgeries.


    A dataset was generated by performing beacon forgery, beacon spoofing, and de-authentication
    attacks using Kali Linux. The network adapter used for packet injection was Leoxsys
    150 Mbps \[[24](#ch02.xhtml#ref2_24)\]. A brief description of each of the above-mentioned
    attacks and the process in which they were simulated are described as follows.


    ### [2.5.1 Beacon Forgery](#ch02.xhtml#c_sec2_005_001)


    In beacon forgery, the attackers forge the beacons of legitimate access points
    for malicious purposes. In an attempt to replicate the attack, we forged the beacons
    by copying their ssid, bssid, and channel capability using a Python script. Transmission
    time was set to 100 TU (Transmission Unit). A screenshot of the attack simulation
    in kali linux is given in [Figure 2.1](#ch02.xhtml#fig2_1) and the graph depicting
    the rate of at which beacons are received (both legitimate and forged) is shown
    in [Figure 2.2](#ch02.xhtml#fig2_2).'
