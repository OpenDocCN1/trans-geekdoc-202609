    有能力自动添加或删除单元的信息。它使用 sigmoid 和 tanh 激活函数来更新单元值和参数 \[4,13\]。


    ### 5.3.3 LSTM 算法


    1. 使用 sigmoid 层和先前的隐藏层以及当前输入值来决定从单元状态输出的信息。输出在 1 或 0 之间，其中 1 表示保留全部信息，0 表示忽略信息。


    2. 识别或决定存储在单元中的新信息。这分为两个阶段完成。在第一阶段，决定更新哪些值。这是通过 sigmoid 层完成的。在下一阶段，tanh 层决定要添加到单元中的新值，如
