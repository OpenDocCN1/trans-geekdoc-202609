    \n| Switch || *s*[1] || *s*[2] || *s*[3] || *s*[4] || *s*[5] || *s*[6] || *s*[7]\
    \ || *s*[8] || *s*[9] |\n\n| --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- |\n\n| *s*[*i*](*t*[0]) || 25 || 25 || 25 || 25 || 25 || 35 || 45 || 25\
    \ || 35 |\n\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\n\
    | *s*[*i*](*t*[1]) || – || – || – || – || – || – || – || – || – |\n\n*The corresponding\
    \ state space is* {*S*1 → 〈0, 0, 1〉*, S*2 → 〈0, 1, 0〉*, S*3 → 〈1, 0, 0〉}. *The\
