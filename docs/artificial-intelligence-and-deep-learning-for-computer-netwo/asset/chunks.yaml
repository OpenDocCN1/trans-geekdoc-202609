    the forged regions efficiently.


    ![Figure 6.7 Forgery detection and localization results \[32\]. Forgery sizes:
    (a) 10%, (b) 30%, (c) 50%. (Top) Authentic images. (Middle) Tampered images: tampered
    regions highlighted. (Bottom) Detection and localization of forged region.](images/fig6_7.jpg)


    [Figure 6.7 Forgery detection and localization results](#ch06.xhtml#Ffig6_7) \[[32](#ch06.xhtml#ref6_32)\].
    [Forgery sizes: (a) 10%, (b) 30%, (c) 50%. (*Top*) Authentic images. (*Middle*)
    Tampered images: tampered regions highlighted. (*Bottom*) Detection and localization
    of forged region.](#ch06.xhtml#Ffig6_7)


    [Figure 6.8](#ch06.xhtml#fig6_8) presents JPEG re-compression localization results,
    in terms of average accuracy, of a presented deep learning–based forensic technique
    on 20 UCID test images \[[42](#ch06.xhtml#ref6_42)\] by varing quality factors
    *QF*[1] and *QF*[2]. [Figure 6.8](#ch06.xhtml#fig6_8) also presents the localization
    results of three state-of-the-art techniques of schemes of Wang et al. \[[26](#ch06.xhtml#ref6_26)\],
    Bianchi et al. \[[27](#ch06.xhtml#ref6_27)\], and Lin et al. \[[28](#ch06.xhtml#ref6_28)\].
    From [Figure 6.8](#ch06.xhtml#fig6_8), it can be observed that the presented deep
    learning–based forensic model performs considerably high when *QF*[1] > *QF*[2],
    compared to the other three schemes. This is because CNNs help to preserve the
    spatial structured features and efficiently learn the statistical patterns of
    JPEG coefficient distribution; hence, improving the detection accuracy. However,
    the performance of the presented scheme is marginally higher that the state-of-the-art
    for the cases *QF*[1] *< QF*[2]. The performance of the presented scheme is higher
    than the schemes of Wang et al. \[[26](#ch06.xhtml#ref6_26)\], Bianchi et al.
    \[[27](#ch06.xhtml#ref6_27)\], and Lin et al. \[[28](#ch06.xhtml#ref6_28)\], in
    the case of *QF*[1] = *QF*[2]. Still, the presented scheme did not provide a satisfactory
    performance.


    ![Figure 6.8 Average accuracy for varying QF2 − QF1 values \[32\].](images/fig6_8.jpg)


    [Figure 6.8 Average accuracy for varying *QF*[2] − *QF*[1] values](#ch06.xhtml#Ffig6_8)
    \[[32](#ch06.xhtml#ref6_32)\].


    ## [6.5 Conclusion](#ch06.xhtml#c_sec6_5)


    In this chapter, we have discussed illicit modification attacks on multimedia,
    i.e., image and video forgery, and their relation to cybersecurity. We have observed
    that JPEG re-compression footprints help to detect forgery in images. In this
    chapter, we have also presented a deep learning–based forensic framework for detection
    and localization of forgery (double JPEG compressed regions) in images. The pre-processed
    19 × 7 JPEG DCT coefficients are fed to CNN to extract and learn the suitable
    features from single and double JPEG compressed images.


    The experimental results prove that the presented deep learning–based forensic
    scheme can detect and locate the JPEG double-compressed forged regions efficiently,
    and also outperform the state-of-the-art, especially when the first compression
    ration is greater than the second, i.e., *QF*[1] *\> QF*[2]. However, the presented
    schemes are not suitable for JPEG quality factors *QF*[1] = *QF*[2].


    Future research in this direction would involve the investigation of JPEG double-compression
    detection when quality factors of both compressions are the same, i.e., *QF*[1]
    = *QF*[2]. The future work will focus on investigating the triple and higher degrees
    of JPEG compression-based forgeries.


