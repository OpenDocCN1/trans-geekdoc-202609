- raw: "In this section, we describe the methodology for dataset classification. Training\
    \ and testing datasets were generated using classification rules from the captured\
    \ beacon traffic. One-hot encoding was used to convert all the character values\
    \ in the dataset to numeric values. The training dataset thus obtained contained\
    \ 11,721 rows and 52 columns while the testing set had 4,331 rows and 52 columns.\
    \ We then classify the attack frames based on behavioural characteristics observed\
    \ during normal traffic, as explained below.\n\n1.  De-authentication attack –\
    \ Data is classified as a de-authentication attack if the frequency of de-authentication\
    \ frame is greater than the threshold for a non-commercial Wi-Fi to avoid disconnection.\n\
    \n2.  Beacon flooding – Data is classified as beacon flooding if a victim's device\
    \ captures traffic with the same ssid and a constant variation of bssid (Mac address).\n\
    \n3.  Beacon forgery – If the arrival time of a beacon from a single source is\
    \ less than 100 transmission units (TUs), data is classified as beacon forgery\
    \ \\[[25](#ch02.xhtml#ref2_25)\\].\n\n## [2.7 Evaluation](#ch02.xhtml#c_sec2_7)\n\
    \nAfter the training data was pre-processed, various machine and deep learning\
    \ models were used to study the attack patterns in the data. As the resulting\
    \ dataset, shown in [Table 2.2](#ch02.xhtml#table2_2), was unbalanced, we use\
    \ synthetic memory oversampling technique (SMOTE) \\[[26](#ch02.xhtml#ref2_26)\\\
    ] to balance it by oversampling the minority class. SMOTE randomly selects a point\
    \ in the minority class, finds *k* nearest neighbours, and creates synthetic instance-based\
    \ data points from the selected neighbours. [Table 2.3](#ch02.xhtml#table2_3)\
    \ shows the class distribution of the dataset after balancing.\n\n[Table 2.2 Class\
    \ Distribution of Dataset Before SMOTE Balancing (Unbalanced Dataset)](#ch02.xhtml#Ttable2_2)\n\
    \n| Class || Number of Samples |\n\n| --- | --- |\n\n| Normal || 7,118 |\n\n|\
    \ --- | --- |\n\n| Beacon Flooding || 2,222 |\n\n| De-authentication Attack ||\
    \ 1,262 |\n\n| Beacon Forgery || 1,119 |\n\n[Table 2.3 Class Distribution of Dataset\
    \ After SMOTE Balancing (Balanced Dataset)](#ch02.xhtml#Ttable2_3)\n\n| Class\
    \ || Number of Samples |\n\n| --- | --- |\n\n| Normal || 7,118 |\n\n| --- | ---\
    \ |\n\n| Beacon Flooding || 7,118 |\n\n| De-authentication Attack || 7,118 |\n\
    \n| Beacon Forgery || 7,118 |\n\nThe model performance was evaluated using metrics\
    \ such as accuracy, precision, F1 score, and recall.\n\n1.  Precision – Precision\
    \ helps to understand the ability to classify relevant data points. It is calculated\
    \ using the equation below. \n\n    *P**r**e**c**i**s**i**o**n* = *T**P*/(*T**P* + *F**P*)\
    \ (2.9)\n\n2.  Recall – Recall defines the ability of the model to find all the\
    \ relevant cases within a dataset. \n\n    *R**e**c**a**l**l* = *T**P*/(*T**P* + *F**N*)\
    \ (2.10)\n\n3.  Accuracy – Accuracy is the number of correctly predicted data\
    \ points out of all the data points. \n\n    *A**c**c**u**r**a**c**y* = *T**P*/*T**o**t**a**l* *S**a**m**p**l**e**s*\
    \ (2.11)\n\n4.  F1 score – The F1 score measures the accuracy of the model on\
    \ a dataset by calculating the harmonic mean between precision and recall.\n\n\
    *F*1\\_*S**c**o**r**e* = (2 \\* *P**r**e**c**i**s**i**o**n* \\* *R**e**c**a**l**l*)/(*P**r**e**c**i**s**i**o**n* + *R**e**c**a**l**l*)\
    \ (2.12)\n\n### [2.7.1 Analyzis of Results](#ch02.xhtml#c_sec2_007_001)\n\nWe\
    \ study the model performance on both the unbalanced and balanced datasets. This\
    \ is due to a huge disparity between the number of minority and majority classes\
    \ that may result in classifier decisions to be biased.\n\nPerformance parameters\
    \ such as precision, recall, F1 score, and accuracy of k-NN, SVM, random forest,\
    \ MLP, and CNN for an unbalanced dataset are shown in [Table 2.4](#ch02.xhtml#table2_4)\
    \ and plotted in [Figure 2.9](#ch02.xhtml#fig2_9). The resulting confusion matrices\
    \ are given in [Figures 2.9](#ch02.xhtml#fig2_9), [2.10](#ch02.xhtml#fig2_10),\
    \ [2.11](#ch02.xhtml#fig2_11), [2.12](#ch02.xhtml#fig2_12), and [2.13](#ch02.xhtml#fig2_13),\
    \ respectively.\n\n [Table 2.4 Performance Metrics on Unbalanced Dataset](#ch02.xhtml#Ttable2_4)\
    \ \n\n| Algorithm || Precision (%) || Recall (%) || F1-Score (%) || Accuracy (%)\
    \ |\n\n| --- | --- | --- | --- | --- |\n\n| **Machine Learning Models** |\n\n\
    | --- |\n\n| k-NN || 36.87 || 60.72 || 45.89 || 60.72 |\n\n| SVM || 11.50 || 10.76\
    \ || 20.90 || 10.76 |\n\n| Random Forest || 78.97 || 73.32 || 65.39 || 73.32 |\n\
    \n| **Deep Learning Models** |\n\n| MLP || 91.00 || 91.00 || 92.00 || 92.00 |\n\
    \n| CNN || 100.00 || 44.00 || 62.00 || 44.00 |\n\n![Figure 2.9 Graphical results\
    \ for evaluation of unbalanced data.](images/fig2_9.jpg)\n\n[Figure 2.9 Graphical\
    \ results for evaluation of unbalanced data.](#ch02.xhtml#Ffig2_9)\n\n![Figure\
    \ 2.10 Confusion matrix of k-NN for unbalanced dataset.](images/fig2_10.jpg)\n\
    \n[Figure 2.10 Confusion matrix of k-NN for unbalanced dataset.](#ch02.xhtml#Ffig2_10)\n\
    \n![Figure 2.11 Confusion matrix of SVM for unbalanced dataset.](images/fig2_11.jpg)\n\
    \n[Figure 2.11 Confusion matrix of SVM for unbalanced dataset.](#ch02.xhtml#Ffig2_11)\n\
    \n![Figure 2.12 Confusion matrix of random forest for unbalanced dataset.](images/fig2_12.jpg)\n\
    \n[Figure 2.12 Confusion matrix of random forest for unbalanced dataset.](#ch02.xhtml#Ffig2_12)\n\
    \n![Figure 2.13 Confusion matrix of MLP for unbalanced dataset.](images/fig2_13.jpg)\n\
    \n[Figure 2.13 Confusion matrix of MLP for unbalanced dataset.](#ch02.xhtml#Ffig2_13)\n\
    \n![Figure 2.14 Confusion matrix of CNN for unbalanced dataset.](images/fig2_14.jpg)\n\
    \nFigure 2.14 Confusion matrix of CNN for unbalanced dataset.\n\nEvaluation metrics\
    \ for models trained using balanced dataset is given in [Table 2.5](#ch02.xhtml#table2_5)\
    \ and plotted as shown in [Figure 2.7](#ch02.xhtml#fig2_7). Resulting confusion\
    \ matrices for k-NN, SVM, random forest, MLP, and CNN are given in [Figures 2.15](#ch02.xhtml#fig2_15),\
    \ [2.16](#ch02.xhtml#fig2_16), [2.17](#ch02.xhtml#fig2_17), [2.18](#ch02.xhtml#fig2_18),\
    \ and [2.19](#ch02.xhtml#fig2_19), respectively. Evaluation metrics obtained using\
    \ an unbalanced dataset show that MLP has the highest accuracy followed by the\
    \ random forest. SVM suitable for binomial classification has the least performance.\
    \ As CNN studies the sampled original data, its accuracy is very low. From the\
    \ results obtained using a balanced dataset, we can see that even though random\
    \ forest outperforms other models, there is a steep decrease in efficiency due\
    \ to oversampling of minority classes. This phenomenon can be observed across\
    \ all the models. We observe that all models outperform themselves in unbalanced\
    \ (original) datasets when compared to the balanced ones. This is because SMOTE\
    \ used for balancing the dataset does not perform well on higher-dimensional data.\
    \ We show that the MLP better classifies the beacon forgeries on an unbalanced\
    \ dataset.\n\n[Table 2.5 Performance Metrics on Balanced Dataset](#ch02.xhtml#Ttable2_5)\n\
    \n| Algorithm || Precision (%) || Recall (%) || F1 Score (%) || Accuracy (%) |\n\
    \n| --- | --- | --- | --- | --- |\n\n| **Machine Learning Models** |\n\n| ---\
    \ |\n\n| k-NN || 36.25 || 57.40 || 44.37 || 57.40 |\n\n| SVM || 11.50 || 10.76\
    \ || 20.93 || 10.76 |\n\n| Random Forest || 59.97 || 70.51 || 62.12 || 70.51 |\n\
    \n| **Deep Learning Models** |\n\n| MLP || 87.00 || 55.00 || 56.00 || 55.00 |\n\
    \n| CNN || 100.00 || 44.00 || 61.00 || 44.00 |\n\n![Figure 2.15 Confusion matrix\
    \ of k-NN for balanced dataset.](images/fig2_15.jpg)\n\n[Figure 2.15 Confusion\
    \ matrix of k-NN for balanced dataset.](#ch02.xhtml#Ffig2_15)\n\n![Figure 2.16\
    \ Confusion matrix of SVM for balanced dataset.](images/fig2_16.jpg)\n\n[Figure\
    \ 2.16 Confusion matrix of SVM for balanced dataset.](#ch02.xhtml#Ffig2_16)\n\n\
    ![Figure 2.17 Confusion matrix of random forest for balanced dataset.](images/fig2_17.jpg)\n\
    \n[Figure 2.17 Confusion matrix of random forest for balanced dataset.](#ch02.xhtml#Ffig2_17)\n\
    \n![Figure 2.18 Confusion matrix of MLP for balanced dataset.](images/fig2_18.jpg)\n\
    \n[Figure 2.18 Confusion matrix of MLP for balanced dataset.](#ch02.xhtml#Ffig2_18)"
  fmt: "\n# 数据集分类方法\n\n本节描述了数据集分类的方法。训练和测试数据集是使用捕获的信标流量中的分类规则生成的。采用独热编码将数据集中所有字符值转换为数值。由此获得的训练数据集包含\
    \ 11,721 行和 52 列，而测试集包含 4,331 行和 52 列。然后，我们根据正常流量期间观察到的行为特征对攻击帧进行分类，如下所述。\n\n\
    1.  去认证攻击 – 如果去认证帧的频率大于非商业 Wi-Fi 的阈值以避免断开连接，则数据被分类为去认证攻击。\n\n2.  信标泛滥 – 如果受害者设备捕获到具有相同\
    \ ssid 和 bssid（MAC 地址）恒定变化的流量，则数据被分类为信标泛滥。\n\n3.  信标伪造 – 如果来自单一来源的信标的到达时间小于 100\
    \ 个传输单元（TUs），则数据被分类为信标伪造 \\[[25](#ch02.xhtml#ref2_25)\\]。\n\n## [2.7 Evaluation](#ch02.xhtml#c_sec2_7)\n\
    \n训练数据预处理后，使用各种机器学习和深度学习模型来研究数据中的攻击模式。由于如 [Table 2.2](#ch02.xhtml#table2_2) 所示的结果数据集不平衡，我们使用合成少数类过采样技术（SMOTE）\\\
    [[26](#ch02.xhtml#ref2_26)\\] 通过过采样少数类来平衡它。SMOTE 随机选择少数类中的一个点，找到 `k` 个最近邻，并从所选邻居创建基于实例的合成数据点。[Table\
    \ 2.3](#ch02.xhtml#table2_3) 显示了平衡后的数据集的类分布。\n\n[Table 2.2 Class Distribution\
    \ of Dataset Before SMOTE Balancing (Unbalanced Dataset)](#ch02.xhtml#Ttable2_2)\n\
    \n| Class || Number of Samples |\n\n| --- | --- |\n\n| Normal || 7,118 |\n\n|\
    \ --- | --- |\n\n| Beacon Flooding || 2,222 |\n\n| De-authentication Attack ||\
    \ 1,262 |\n\n| Beacon Forgery || 1,119 |\n\n[Table 2.3 Class Distribution of Dataset\
    \ After SMOTE Balancing (Balanced Dataset)](#ch02.xhtml#Ttable2_3)\n\n| Class\
    \ || Number of Samples |\n\n| --- | --- |\n\n| Normal || 7,118 |\n\n| --- | ---\
    \ |\n\n| Beacon Flooding || 7,118 |\n\n| De-authentication Attack || 7,118 |\n\
    \n| Beacon Forgery || 7,118 |\n\n模型性能使用准确率、精确率、F1 分数和召回率等指标进行评估。\n\n1.  Precision\
    \ – Precision helps to understand the ability to classify relevant data points.\
    \ It is calculated using the equation below. \n\n    `Precision = TP / (TP + FP)`\
    \ (2.9)\n\n2.  Recall – Recall defines the ability of the model to find all the\
    \ relevant cases within a dataset. \n\n    `Recall = TP / (TP + FN)` (2.10)\n\n\
    3.  Accuracy – Accuracy is the number of correctly predicted data points out of\
    \ all the data points. \n\n    `Accuracy = TP / Total Samples` (2.11)\n\n4.  F1\
    \ score – The F1 score measures the accuracy of the model on a dataset by calculating\
    \ the harmonic mean between precision and recall.\n\n    `F1_Score = (2 * Precision\
    \ * Recall) / (Precision + Recall)` (2.12)\n\n### [2.7.1 Analyzis of Results](#ch02.xhtml#c_sec2_007_001)\n\
    \n我们研究了模型在不平衡和平衡数据集上的性能。这是由于少数类和多数类之间的数量巨大差异可能导致分类器决策产生偏差。\n\nk-NN、`SVM`、`random\
    \ forest`、`MLP` 和 `CNN` 在不平衡数据集上的精确率、召回率、F1 分数和准确率等性能参数显示在 [Table 2.4](#ch02.xhtml#table2_4)\
    \ 并在 [Figure 2.9](#ch02.xhtml#fig2_9) 中绘制。生成的混淆矩阵分别给出在 [Figures 2.9](#ch02.xhtml#fig2_9)、[2.10](#ch02.xhtml#fig2_10)、[2.11](#ch02.xhtml#fig2_11)、[2.12](#ch02.xhtml#fig2_12)\
    \ 和 [2.13](#ch02.xhtml#fig2_13)。\n\n[Table 2.4 Performance Metrics on Unbalanced\
    \ Dataset](#ch02.xhtml#Ttable2_4)\n\n| Algorithm || Precision (%) || Recall (%)\
    \ || F1-Score (%) || Accuracy (%) |\n\n| --- | --- | --- | --- | --- |\n\n| **Machine\
    \ Learning Models** |\n\n| --- |\n\n| k-NN || 36.87 || 60.72 || 45.89 || 60.72\
    \ |\n\n| SVM || 11.50 || 10.76 || 20.90 || 10.76 |\n\n| Random Forest || 78.97\
    \ || 73.32 || 65.39 || 73.32 |\n\n| **Deep Learning Models** |\n\n| MLP || 91.00\
    \ || 91.00 || 92.00 || 92.00 |\n\n| CNN || 100.00 || 44.00 || 62.00 || 44.00 |\n\
    \n![Figure 2.9 Graphical results for evaluation of unbalanced data.](images/fig2_9.jpg)\n\
    \n[Figure 2.9 Graphical results for evaluation of unbalanced data.](#ch02.xhtml#Ffig2_9)\n\
    \n![Figure 2.10 Confusion matrix of k-NN for unbalanced dataset.](images/fig2_10.jpg)\n\
