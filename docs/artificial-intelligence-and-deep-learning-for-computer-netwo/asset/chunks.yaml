    作者在 \[4,5\] 讨论了工业物联网（Industrial IoT）面临的挑战以及相关研究方向，涉及实时性、能效、隐私与安全、互操作性以及与现有物联网标准的共存。通过考虑任意场景，\[6\]
    重点介绍了 NB-IoT 范式下定位的性能，并提供了网络覆盖、设备位置等不同因素。Yu 等人 \[7\] 仅关注 NB-IoT 系统的上行链路调度方案，并结合上行链路自适应机制。\[8\]
    并未聚焦于单个通信，而是在 NB-IoT 框架中找到一种扩展，以纳入群组通信信道。作者在 \[9\] 为 NB-IoT 设计了一种资源分配技术，仅关注基于速率最大化来制定问题。在
    \[10\] 中，NB-IoT 的小数据传输方法不关注传输延迟和流量优先级。\[11\] 解决了在 LTE 网络中为大量机器类型通信（MTC）设备提供连接的主要挑战，并为
    NB-IoT 架构提出了一种上行多址接入机制。作者在 \[12\] 解决了低功耗场景下终端设备信号传输重复的问题，并发现信道相干性对时间及上行覆盖的影响。在
    \[13\] 中，窄带物理下行链路控制信道（NPDCCH）物理层过程通过搜索空间解码进行了说明，并基于上行参考信号为 NPDCCH 提出了一种资源映射方案。在此工作中，所提出的调度器仅适用于
    NPDCCH 中的搜索空间分配。\[14\] 提出了一种次优算法，用于在上行传输期间为 NB-IoT 设备分配传输功率和无线资源。在此，作者通过分析速率、延迟和功率之间的权衡，关注资源分配方法。\[15\]
    为 NB-IoT 框架设计了一个上行调度器，其中所提调度器是一种基于阈值的用户设备（UE）特定方法，主要适用于具有同质流量的 UE。虽然 \[16\] 通过排队模型讨论了
    NB-IoT 中的延迟-能耗权衡，但该工作并未为 NB-IoT 设计新的调度机制。作者在 \[17\] 介绍了 NB-IoT 的主要特性，并讨论了 NB-IoT
    架构上的数据传输。\[18\] 处理了 NB-IoT 网络中窄带物理下行链路共享信道（NPDSCH）周期与下行链路调度的自适应问题。然而，该工作的目标是通过最小化下行传输期间接收数据所消耗的无线资源，来提高
    NB-IoT 网络的无线资源利用率。在 \[19\] 中，为 NB-IoT 中的到达和服务过程构建了一个随机接入流量模型，重点在于通过分析网络延迟来推导到达过程中的随机延迟界限。\[20\]
    提出了一种启发式算法 NIS，该算法仅关注 NB-IoT 中的下行链路调度。在此，目标是高效利用 NB-IoT 的无线资源，以便在物联网范式中建立大规模连接。因此，\[20\]
    未解决基于优先级和延迟敏感性的数据包调度问题。Lei 等人 \[21\] 的工作在基于 NB-IoT 的边缘计算系统中提出了一种联合多用户调度和半分布式计算卸载机制。Azari
    等人 \[22\] 设计了一个可处理的分析框架，用于分析控制或数据信道调度以及不同覆盖类别的共存对 NB-IoT 设备延迟和能耗的影响。虽然 \[22\]
    找到了一种基于调度的解决方案，以补偿 NB-IoT 网络中极端覆盖导致的性能损失，但所提议的上行或下行方向调度信道自适应并未解决 NB-IoT 中的优先级流量调度问题。然而，据我们所知，迄今为止，尚无现有工作探索过
    NB-IoT 上的延迟敏感通信，因此，我们提出的方法在考虑其设计局限性的同时，为支持 NB-IoT 上优先级流量调度提供了新方向。


    ## 4.3 NB-PTS：系统模型与设计细节


    NB-PTS 处理传输队列并调度流量，以便传输数据包的延迟可以最小化。NB-PTS 在 NB-IoT 协议栈的 `evolved node B (eNB)`
    MAC 层执行，并且 NB-PTS 同时执行上行链路和下行链路调度。为了支持优先级流量传输，我们考虑了 QCI \[3\]，这是 3GPP LTE 网络中用于分类并指示流量承载调度优先级值的机制。通过遵循
    QCI，流量的优先级类型已在 NB-PTS 中用于对数据包施加重要性，这样该机制可以根据数据包的重要性调度数据包（存储在 `transmit queue`
    中）。这样一来，优先级较高的流量将获得更高的调度机会，从而在整体传输中实现更低的延迟。我们使用 `queueing model` 以离散时间方式对传输排队系统进行了建模，该模型将在下文讨论。基于此排队模型，我们定义了一个指标（在
    第 4.3.4 节 中讨论），该指标用于 NB-PTS 中的优先级流量调度。


    基本上，我们在 NB-PTS 的实现中使用了 QCI 来分配流量优先级。然而，NB-PTS 的工作原理指向了在 NB-IoT 网络上应用任何优先级方法进行流量传输的方向。QCI
    定义的一些示例显示在 表 4.1。


    ### 表 4.1 3GPP LTE 定义的 QCI 值示例


    | QCI | 资源类型 | 优先级 | 数据包延迟预算 | 示例服务 |

    | --- | --- | --- | --- | --- |

    | QCI-2 | GBR | 4 | 150 ms | 会话视频（直播流） |

    | QCI-3 | GBR | 3 | 50 ms | 实时游戏，V2X 消息 |

    | QCI-4 | GBR | 5 | 300 ms | 非会话视频（缓冲流） |

    | QCI-6 | non-GBR | 6 | 300 ms | 视频（缓冲流） |

    | QCI-8 | non-GBR | 8 | 300 ms | 基于 TCP 的应用程序（如 www、电子邮件、ftp、聊天等） |


    ### 4.3.1 排队模型描述


    所提方法的大致思路是，根据与数据包关联的流量优先级值，在 MAC 队列中动态调度数据包。然而，考虑到 NB-IoT 架构的资源限制，队列演化需要根据通信环境动态控制。因此，NB-PTS
    首先估计队列状态，并应用在线学习策略来估计阈值（称为队列阈值），超过该阈值后，无法为延迟敏感型应用提供 QoS。然后，它在 MAC 层调度数据包，以便使优先级数据包的总体延迟最小化。


    '
