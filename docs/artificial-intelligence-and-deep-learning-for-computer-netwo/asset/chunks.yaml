    to be scheduled ([Section 4.3.4](#ch04.xhtml#sec4_003_004))


    3.  **Phase-**3: Scheduling of the traffic based on the value of the metric computed
    in phase-2 ([Section 4.3.6](#ch04.xhtml#sec4_003_006))


    For estimating queue threshold, we have applied an online learning mechanism.
    This is because the queue threshold highly depends on the present channel condition
    and traffic volume, which has to be handled by the transmitter; and therefore,
    the value of this threshold needs to be chosen adaptively and dynamically, such
    that the probability of packet drop would be minimized. In this regard, the `ϵ`-greedy
    \[[23](#ch04.xhtml#ref4_23)\] policy has been applied as an online learning mechanism.


    #### [4.3.1.2 Derivation of Target Mean Delay](#ch04.xhtml#c_sec4_003_001_002)


    In our system, we use a two-state Markov modulated Bernoulli process (MMBP-2)
    as the arrival process in order to provide a randomness in arrival rate, which
    is a common characteristic for IIoT traffic \[[4](#ch04.xhtml#ref4_4)\]. This
    can be extended to an m-state MMBP. In each state, the arrival process takes up
    a geometric duration of time slots, i.e., the service duration of a process is
    an integral multiple of the slot duration. In our proposed discrete-time queueing
    model for the control strategy, the queue has a finite waiting room of `K` packets,
    including the packets that are in service. The mean arrival rate and the mean
    queue length are calculated over each time window `t` and then this information
    is used to measure the value of `L` for the next time window `t` + 1, to bind
    the time delay at the required value. By adjusting the threshold, in turn, we
    control the scheduling of the incoming traffic.


    In each state of the queueing model, the probability of having an arrival in a
    time slot follows the Bernoulli process. It varies by following a two-state Markov
    process and it is independent of the arrival process. Thus, the model follows
    an MMBP/Geo/1/K queue. However, the length of a time window is to be much smaller
    than the mean time when the arrival process resides in the same state. Hence,
    in the steady state, the model can be approximated to a Geo/Geo/1/K queue over
    the maximum time windows. That means the arrival traffic can be viewed to follow
    Bernoulli process except in few time windows where a state change occurs in the
    arrival process. [Figure 4.1](#ch04.xhtml#fig4_1) shows the state transition model
    for a Geo/Geo/1/K queue, where the threshold is at position `L` = `K` − 1 and
    `α` is a mean packet arrival rate in general. The queue length process has a finite
    state space and follows a Markov chain. This Markov chain is aperiodic, irreducible,
    recurrent non-null, and has a unique probability distribution \[[24](#ch04.xhtml#ref4_24)\].


    ![Figure 4.1 State transition model for independent Bernoulli process in each
    phase along with threshold.](images/fig4_1.jpg)


    [Figure 4.1 State transition model for independent Bernoulli process in each phase
    along with threshold.](#ch04.xhtml#Ffig4_1)


    Let `α` ≠ `β`, and firstly we assume `L` = `K` − 1. Then we generalize `L` as
    `L` = `K` − `i`, i.e., we can adjust the threshold to any position in the transmit
    queue. As shown in [Figure 4.1](#ch04.xhtml#fig4_1), let the states be represented
    by `q[0]`, `q[1]`, `q[2]`, … etc. From the state transition diagram ([Figure 4.1](#ch04.xhtml#fig4_1)),
    the discrete-time finite queue with `L` = `K` − 1 can be expressed as given in
    the following:


    ```

    \\begin{array}{lll} q\_{0} & = & {q\_{0}(1 - \\alpha) + q\_{1}\\lbrack\\beta(1
    - \\alpha)\\rbrack} \\\\ q\_{1} & = & {q\_{0}\\alpha + q\_{1}\\lbrack\\alpha\\beta
    + (1 - \\alpha)(1 - \\beta)\\rbrack + q\_{2}\\lbrack\\beta(1 - \\alpha)\\rbrack}
    \\\\ \\end{array}

    ```


    In general, for `i` = 2, 3, …, `K` − 1, we have


    ```

    \\begin{array}{lll} q\_{i} & = & {q\_{i - 1}\\lbrack\\alpha(1 - \\beta)\\rbrack
    + q\_{i}\\lbrack\\alpha\\beta + (1 - \\alpha)(1 - \\beta)\\rbrack + q\_{i + 1}\\lbrack\\beta(1
    - \\alpha)\\rbrack} \\\\ q\_{K - 2} & = & {q\_{K - 3}\\lbrack\\alpha(1 - \\beta)\\rbrack
    + q\_{K - 2}\\lbrack\\alpha\\beta + (1 - \\alpha)(1 - \\beta)\\rbrack + q\_{K
    - 1}\\beta} \\\\ q\_{K - 1} & = & {q\_{K - 2}\\lbrack\\alpha(1 - \\beta)\\rbrack
    + q\_{K - 1}(1 - \\beta)} \\\\ \\end{array}

    ```


    By solving these equations recursively and assuming $\\gamma = \\frac{\\alpha(1
    - \\beta)}{\\beta(1 - \\alpha)}$, we can express the equilibrium probability in
    terms of `q`[0] as given in the following:


    ```

    q\_{i} = q\_{0}\\frac{\\gamma^{i}}{\\left( {1 - \\beta} \\right)},\\mspace{9mu}
    1 \\leq i \\leq K - 2

    ```

    (4.1)


    For `i` = `K` − 1, we have


    ```

    q\_{K - 1} = q\_{0}\\gamma^{(K - 1)}\\frac{\\left( 1 - \\alpha \\right)}{\\left(
    1 - \\beta \\right)}

    ```

    (4.2)


    By normalising the equations, we get $\\sum\_{i = 0}^{K - 1}{q\_{i} = 1}$. Thus,
    `q`[0] can be computed as follows:


    ```

    q\_{0} = \\frac{(1 - \\beta)(1 - \\gamma)}{1 - (1 - \\gamma)(\\beta + \\alpha\\gamma^{(K
    - 1)}) - \\gamma^{K}}

    ```

    (4.3)


    Now, we find the generating function of the finite queue length process and it
    is given by $P(z) = \\sum\_{i = 0}^{K - 1}{q\_{i}z^{i}}$. That is


    ```

    P(z) = \\frac{q\_{0}}{(1 - \\beta)}\\left\\lbrack \\frac{1 - (1 - \\gamma z)(\\beta
    + \\alpha\\gamma^{K - 1}z^{K - 1}) - {(\\gamma z)}^{K}}{1 - \\gamma z} \\right\\rbrack

    ```

    (4.4)


    Next, we find the mean queue waiting time by using Little''s Law, which states
    that the average number of packets in a system is equal to the product of average
    waiting time of packets and average arrival rate of packets in the system \[[25](#ch04.xhtml#ref4_25)\].
    For `L` = `K` − 1, we compute the mean queue length (MQL) for this queue by taking
    the first-order derivative of `P` (`z`) at `z` = 1. In this way, we can continue
    with `L` = `K` −2, `K` −3, …, and can find some regulation for MQL equation. That
    means the threshold `L` can be put in any position of the finite queue. Therefore,
    for `L` = `K` − 1, we have


    ```

    P^{(1)}\\left( 1 \\right) = \\frac{\\gamma\\left\\lbrack {1 - L\\alpha\\gamma^{L
    - 1} + \\left( {2L\\alpha - \\left( {L + 1} \\right)} \\right)\\gamma^{L} - \\left(
    {L\\alpha - L} \\right)\\gamma^{L + 1}} \\right\\rbrack}{(1 - \\gamma)\\left\\lbrack
    {1 - \\left( {1 - \\gamma} \\right)\\left( {\\beta + \\alpha\\gamma^{L}} \\right)
    - \\gamma^{L + 1}} \\right\\rbrack}

    ```

    (4.5)

