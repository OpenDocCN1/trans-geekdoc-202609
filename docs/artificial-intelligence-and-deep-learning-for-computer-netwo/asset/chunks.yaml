    # NB-PTS、“General”、NIS 和 NANIS 方案平均延迟的累积分布函数（CDF）如 图 4.8(b) 所示。该图突出显示，NB-PTS 的平均延迟分布显著低于“General”、NIS
    和 NANIS。由于单个基于优先级的流量平均延迟的降低以及整体平均延迟的减少（如 图 4.6(b) 和 图 4.7(b) 所示），NB-PTS 中的平均延迟分布低于“General”、NIS
    和 NANIS；且该分布在 NB-PTS 中集中于 0.1s–0.25s 之间。通过应用在线学习，NB-PTS 尝试在执行的每个步骤中，根据当前网络状况动态执行调度。在这方面，NB-PTS
    的重点始终是尽量减少单个优先级流量调度的平均延迟。在基于当前网络状况的动态调度方向上，NB-PTS 的重点始终是尽量减少单个优先级流量传输的平均延迟。


    ## 4.4.8 UE 数量对消耗子帧数量的影响


    图 4.9(a) 显示了 UE 数量对消耗子帧数量的影响。结果表明，随着 UE 数量的增加，消耗的子帧数量也随之增加，这是因为 eNB 为调度更多数量的设备而消耗更多的子帧。两个连续
    NPDCCH 之间的时间间隔称为 NPDCCH 周期（NP）\[2\]。NANIS 为不同的覆盖增强（CE）级别动态选择更合适的 NP，并更高效地利用无线资源。因此，与所提机制
    NIS 以及“General”方法相比，NANIS 可以进一步减少消耗的子帧数量，如 图 4.9(a) 所示。由于所提机制不考虑 NP 的自适应和无线资源管理，因此在子帧消耗方面，NB-PTS
    的性能低于 NANIS，而 NB-PTS 的子帧消耗数量显著低于“General”，并且与 NIS 观察到的平均性能几乎相同。然而，从 图 4.9(a) 可以看出，随着
    UE 数量的增加，相对于 NANIS，NB-PTS 中的子帧消耗率会降低。通过对阈值 `L[t+1]` 和目标平均延迟的智能设置，NB-PTS 尝试在计算出的目标平均延迟内完成优先级数据包的调度，这一尝试影响了数据包子帧消耗的减少。随着时间增加，NB-PTS
    对系统施加更多知识，这导致在拥塞网络场景中，相对于 NANIS，对 `L[t+1]` 和目标平均延迟进行更智能的自适应。


    ![Figure 4.9 (a) Impact on consumed subframes; (b) computational time.](img/fig4_9.jpg)


    Figure 4.9 (a) Impact on consumed subframes; (b) computational time.


    ## 4.4.9 UE 数量对计算时间的影响


    UE 数量对算法计算时间的影响如 图 4.9(b) 所示。当需要调度的 UE 数量增加时，调度所需的 UE 选择更多。因此，对于每个算法，随着连接 UE 数量的增加，计算时间也随之增加。从
    图 4.9(b) 可以看出，随着网络中连接设备数量的增加，NANIS 的计算时间增加更多。这是因为 NANIS 的运行时间高度依赖于 NPDSCH 子帧的最大计数和需要调度的
    UE 数量，而在拥塞网络中，对 NPDSCH 子帧数量的需求很高。在所提机制中，执行时间主要取决于知识库 `K` 的大小，而 `K` 的大小又取决于 SINR
    条目的数量。因此，与 NANIS 和 NIS 方法相比，高数量的 UE 对 NB-PTS 计算时间的影响较低。NB-PTS 的计算时间增长与连接 UE 数量几乎呈线性关系。作为一种简单的基于
    FIFO 的调度方案，“General”的计算时间低于其他三种机制（图 4.9(b)）。当连接 UE 数量为 30 时，NB-PTS 的计算时间分别比 NANIS
    高约 11%，比 NIS 低约 4%。然而，当 UE 数量为 50 时，NB-PTS 的计算时间比 NANIS 低约 16%。


    ## 4.5 结论


    数据包调度是基于 NB-IoT 的 IIoT 网络中 QoS 要求的一个重要方面，在该网络中，信道带宽和峰值数据速率相当低，难以满足延迟敏感型应用的延迟要求。NB-PTS
    通过使用在线学习方法，解决了基于优先级的应用中数据包调度的 QoS 要求问题，从而使流量数据传输的总时间能够经历较低的延迟。度量 `W[t+1]` 定义了待调度数据包的权重因子，基于该因子，优先级较高的流量在调度后将获得更高的传输机会。NB-PTS
    的性能在 `ns-3-dev-NB-IOT` 中进行了分析，结果表明，NB-PTS 可以减少基于 NB-IoT 的单个优先级应用的延迟，并可以降低整体平均延迟，同时改善其他网络参数的性能。我们相信，对
    NB-IoT 的所提扩展可以使该技术有效地利用下一代通信，用于各种应用。


