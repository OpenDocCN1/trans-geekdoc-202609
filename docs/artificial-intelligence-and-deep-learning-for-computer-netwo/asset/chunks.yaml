    # Cumulative density functions (CDFs) of average delay of NB-PTS, “General,” NIS,
    and NANIS schemes are illustrated in [Figure 4.8(b)](#ch04.xhtml#fig4_8). This
    figure highlights that NB-PTS has a significant lower average delay distribution
    than “General,” NIS, and NANIS. Due to the reduction of average delay of individual
    priority-based traffic and the decrease of overall average delay (shown in [Figure
    4.6(b)](#ch04.xhtml#fig4_6) and [Figure 4.7(b)](#ch04.xhtml#fig4_7)), the average
    delay distribution becomes lower in NB-PTS than “General,” NIS, and NANIS; and
    this distribution in NB-PTS is congested between 0.1s–0.25s. By applying the online
    learning, NB-PTS tries to perform scheduling dynamically based on the present
    network condition, at each step of its execution. In this direction, the focus
    of NB-PTS is always to minimize average delay of individual prioritized traffic
    scheduling. In the direction of dynamic scheduling based on the present network
    condition, the focus of NB-PTS is always to minimize average delay of individual
    prioritized traffic delivery.


    ## [4.4.8 Impact of Number of UEs on Consumed Subframes](#ch04.xhtml#c_sec4_004_008)


    [Figure 4.9(a)](#ch04.xhtml#fig4_9) shows the impact of the number of UEs on the
    number of consumed subframes. The result shows that the number of consumed subframes
    increases as the number of UEs increases and this is because the eNB consumes
    more subframes for scheduling a higher number of devices. The time interval between
    two successive NPDCCH is known as NPDCCH period (NP) \[[2](#ch04.xhtml#ref4_2)\].
    NANIS chooses more suitable NPs dynamically for different coverage enhancement
    (CE) levels and uses radio resources more efficiently. Consequently, NANIS can
    decrease more the number of consumed subframes compared to the proposed mechanism,
    NIS, and “General” approach, as shown in [Figure 4.9(a)](#ch04.xhtml#fig4_9).
    Since the proposed mechanism does not consider the adaptation of NP and radio
    resource management, the performance of NB-PTS is lower compared to NANIS, in
    terms of subframe consumption, whereas NB-PTS has a significantly lower number
    of subframe consumption than “General,” and almost the same average performance
    as is observed in NIS. However, from [Figure 4.9(a)](#ch04.xhtml#fig4_9), it can
    be noted that, as the number of UEs increases, the rate of consumption of subframes
    reduces in NB-PTS, with respect to NANIS. With the intelligent setting of the
    threshold `L[t+1]` and target mean delay, NB-PTS tries to complete the scheduling
    of prioritized packets within the computed target mean delay, and this attempt
    impacts the reduction of subframe consumptions for packets. As time increases,
    NB-PTS imposes more knowledge on the system, which leads to a smart adaptation
    of `L[t+1]` and the target mean delay compared to NANIS in a congested network
    scenario.


    ![Figure 4.9 (a) Impact on consumed subframes; (b) computational time.](images/fig4_9.jpg)


    [Figure 4.9 (a) Impact on consumed subframes; (b) computational time.](#ch04.xhtml#Ffig4_9)


    ## [4.4.9 Impact of Number of UEs on Computational Time](#ch04.xhtml#c_sec4_004_009)


    The impact of the number of UEs on the computational time of the algorithms is
    illustrated in [Figure 4.9(b)](#ch04.xhtml#fig4_9). More selections of UEs are
    required in scheduling when the number of UEs to be scheduled becomes higher.
    Thus, for each of the algorithms, the computational time increases as the number
    of connected UEs increases. From [Figure 4.9(b)](#ch04.xhtml#fig4_9), it can be
    noted that the computational time increases more in NANIS as the number of connected
    devices is increased in the network. This is because the running time of NANIS
    is highly dependent on the maximum count of NPDSCH subframes and the number of
    UEs to be scheduled, where the demand of the number of NPDSCH subframes is high
    in a congested network. In case of the proposed mechanism, the execution time
    primarily depends on the size of the knowledge base `K`, which is further dependent
    on the number of SINR entries. Therefore, the impact of high number of UEs on
    the computational time is lower in NB-PTS than NANIS and NIS approaches. The growth
    of the computational time of NB-PTS is almost linear with respect to the number
    of connected UEs. As a simple FIFO-based scheduling scheme, “General” has the
    lowest computational time than the other three mechanisms ([Figure 4.9(b)](#ch04.xhtml#fig4_9)).
    When the number of connected UEs is 30, NB-PTS has approximately 11% higher and
    4% lower computational time than NANIS and NIS, respectively. However, when the
    number of UEs is 50, the computational time is approximately 16% lower in NB-PTS
    than NANIS.


    ## [4.5 Conclusion](#ch04.xhtml#c_sec4_5)


    Packet scheduling is an important aspect of QoS requirements in NB-IoT–based IIoT
    network, in which the channel bandwith and peak data rate are quite low to maintain
    the delay requirements in delay-sensitive applications. NB-PTS addresses the issue
    of QoS requirements for packet scheduling in priority-based applications by using
    an online learning approach, such that the overall time of traffic data transmission
    can experience a low delay. The metric `W[t+1]` defines a weighting factor of
    the packet to be scheduled and based on it, the traffic having higher priority
    would get a higher chance for transmission after scheduling. The performance of
    NB-PTS is analyzed in `ns-3-dev-NB-IOT` and the results show that NB-PTS can reduce
    delay of individual priority-based applications over NB-IoT and can reduce the
    overall average delay as well, along with the improvement in performance of other
    network parameters. We believe that the proposed extension over NB-IoT can enable
    this technology to effectively utilize next-generation communications for various
    applications.


