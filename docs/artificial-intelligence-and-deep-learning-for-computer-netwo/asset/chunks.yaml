- raw: "We propose two different methods in this section to achieve load balancing.\
    \ In the first approach, the switch and target controller are selected randomly.\
    \ In the second case, the switch with the maximum load and target controller is\
    \ selected with a Q-table algorithm. The core driving force for optimizing the\
    \ migration model is the decision-making process in reinforcement learning, which\
    \ happens in the knowledge plane. The control loop between the knowledge and the\
    \ control plane is used to exchange load statistics and switch migration decisions.\
    \ Finally, the control plane implements the switch migration on the data plane.\
    \ The optimal switch migration model is shown in [Figure 3.3](#ch03.xhtml#fig3_3).\n\
    \n![Figure 3.3 Optimal switch migration model based on RL.](images/fig3_3.jpg)\n\
    \n[Figure 3.3 Optimal switch migration model based on RL.](#ch03.xhtml#Ffig3_3)\n\
    \n### [3.6.1 Random Approach](#ch03.xhtml#c_sec3_006_001)\n\nWe compute the optimal\
    \ load for each time step. The controllers are categorized as underloaded, *I*[*domain*],\
    \ and overloaded, *O*[*domain*]. One of the overloaded controllers, *c*[*i*] ∈\
    \ *O*[*domain*], is chosen and load balancing is performed by migrating a random\
    \ switch, *s*[*j*], to a target controller, *c*[*t*] ∈ *I*[*domain*]. The process\
    \ is continued until load balancing is achieved.\n\n### [3.6.2 Q-Learning with\
    \ *ϵ*\\-greedy](#ch03.xhtml#c_sec3_006_002)\n\nIn the ϵ-greedy approach, we try\
    \ to find a trade-off between exploiting the immediate benefit and exploring a\
    \ long-term reward. We train the Q-network by studying a random action with probability\
    \ ϵ. At the same time, we exploit an action that maximizes the expected long-term\
    \ reward with probability 1 – ϵ. We shall correspondingly obtain its new state\
    \ and the resultant reward for each action taken. This is treated as the experience\
    \ in RL and shall be reserved for future use. The core principle of reinforcement\
    \ learning is applied to the SDN controller selection process. An optimal migration\
    \ model based on reinforcement learning is established, where the target controller\
    \ is selected by the migration action derived from reinforcement learning.\n\n\
    The input to the algorithm is the set of the controllers and switches, the flow-request\
    \ rate of the switches for each time, and the various parameters required for\
    \ Q-learning. The Q-matrix, that is, the *state* \\* *action* pair, is initialized\
    \ with value 1, as shown in the first line of the algorithm. The iteration repeats\
    \ at a time step of 30 seconds. The ideal load of a controller and the set of\
    \ overloaded (*O*[*domain*]) and underloaded (*I*[*domain*]) controllers are computed\
    \ in lines 3–5 of the algorithm. A random overloaded controller is selected from\
    \ the (*O*[*domain*]) and the switch with the highest load is selected for migration\
    \ (shown in line 9). Next, we generate a random number and if its value is less\
    \ than *E*, we explore. An underloaded controller is chosen at random from the\
    \ *I*[*domain*] (shown in line 12). Otherwise, if the value of the random number\
    \ is greater than *E*, we exploit. That is, we select the best possible action\
    \ for the given state, the one that yields the maximum Q-value (shown in lines\
    \ 10–14). The switch migration is then performed. The reward is calculated, and\
    \ the Q-value is updated accordingly using Equation 3.8 (shown in lines 15–16).\
    \ The value of ϵ is updated as shown in lines 17–20. Finally, we compute the load\
    \ balancing rate.\n\n**Example 3.2:** *In [Figure 3.4](#ch03.xhtml#fig3_4), we\
    \ show a SDN network with nine SDN switches distributed across three SDN domains\
    \ (controllers). The flow arrival rate of the switches for the first time step\
