    ## 2.1 简介


    Wi-Fi 属于基于 IEEE 802.11 的无线技术协议族，已成为连接 IoT 设备的重要组成部分。专家预测，到 2022 年，超过一半的 IP 流量将由无线设备产生
    \[1]，而这些设备访问互联网的高效方式将是通过利用 Wi-Fi。Wi-Fi 利用称为接入点的有线网络设备 \[2] 来连接互联网。


    接入点使用信标和去认证帧等管理帧来宣布其存在或从网络断开连接。这些帧缺乏身份验证，最终可能导致欺骗，从而引发信标伪造、去认证攻击、信标泛滥等攻击。去认证和信标泛滥的组合可用于消耗合法接入点的资源，并诱骗用户连接到可能成为中间人攻击热点的伪造接入点。信标伪造还可能导致受害者的传输功率降低，最终使网络连接无法使用
    \[3,4\]。


    与有线网络相比，在实时 Wi-Fi 网络中防御攻击具有挑战性，因为很难控制访问区域和保护传输介质。然而，分析数据包模式可以帮助预先预测攻击并准备应对新出现的威胁
    \[5\]。为此，入侵检测系统 (IDS) 被用来分析正常和异常行为的模式。IDS 存在两大类，如下所述。


    1.  基于签名的 IDS – 基于签名的 IDS 定义网络中的模式，并将其与防火墙规则进行比较，以实时检测攻击。然而，这需要不断更新规则，因为新的防火墙法规将帮助攻击者逃避检测
    \[6\]。


    2.  基于异常的 IDS – 基于异常的 IDS 分析数据包流量并检测与正常行为的偏差。尽管 IDS 检测未知攻击，但与基于签名的 IDS 相比，它需要更高的处理时间
    \[7,8,9\]。


