    \ offerings will use some aspect of AI; 4. others.).](#ch05.xhtml#Ffig5_1)\n\n\
    So, in this chapter, DL-based long short-term memory (LSTM) is used to provide\
    \ a solution for solving cybersecurity issues. When well-configured IoT is paired\
    \ with DL, IoT becomes even more effective and adds significant value by reducing\
    \ the amount of false positives, which makes security analysts more productive\
    \ in the security environment. Usually DL works using a pyramid approach, where\
    \ machine learning is at the bottom, and then cognitive-oriented technologies\
    \ such as artificial vision, natural language processing, knowledge graphs, and\
    \ a reasoning engine are at the top \\[[4](#ch05.xhtml#ref5_4)\\]. The goal of\
    \ adding DL to an IoT is to reduce the time investment to create a baseline and\
    \ tune in with alerting without requiring highly experienced staff. To speed up\
    \ the analysis greatly, IoT is integrated with the network management system and\
    \ associated models.\n\nThus, DL can make significant differences in the utility\
    \ of IoT. This chapter gives unique solutions (detection and prevention) for all\
    \ types of possible cyber-attacks in network layers with independent platforms\
    \ for industries.\n\nTo speed up the analysis greatly, SIEM is integrated into\
    \ the network management system and associated models. [Figure 5.1](#ch05.xhtml#fig5_1)\
    \ represents the level of integration of SIEM for threat intelligence and analytics\
    \ applications \\[[5](#ch05.xhtml#ref5_5)\\].\n\n[Figure 5.1(a)](#ch05.xhtml#fig5_1)\
    \ represents all fully and seamlessly integrated; (b) represent it is integrated\
    \ but some components are not yet automated; (c) represent threat intel feeds\
    \ and security analytics are integrated but are separate from SIEM; (d) represent\
    \ threat intel feeds, analytics, and SIEM are separate; (e) not currently using\
    \ either a threat intel feed or a security analytics application. Such systems\
    \ can block threats without human intervention, detect anomalies over time, and\
    \ screen out network noise in order to allow the human security professional to\
    \ focus on real threats and events. Importantly, this technology also provides\
    \ invaluable threat intelligence and network security analytics in order to proactively\
    \ prevent future threats. Thus, machine learning can make significant differences\
