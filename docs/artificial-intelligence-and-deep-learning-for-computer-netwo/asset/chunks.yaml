  trans: "\n\n# 数据集分类方法\n\n本节描述了数据集分类的方法。训练和测试数据集是使用捕获的信标流量中的分类规则生成的。采用独热编码将数据集中所有字符值转换为数值。由此获得的训练数据集包含\
    \ 11,721 行和 52 列，而测试集包含 4,331 行和 52 列。然后，我们根据正常流量期间观察到的行为特征对攻击帧进行分类，如下所述。\n\n\
    1.  去认证攻击 – 如果去认证帧的频率大于非商业 Wi-Fi 的阈值以避免断开连接，则数据被分类为去认证攻击。\n\n2.  信标泛滥 – 如果受害者设备捕获到具有相同\
    \ ssid 和 bssid（MAC 地址）恒定变化的流量，则数据被分类为信标泛滥。\n\n3.  信标伪造 – 如果来自单一来源的信标的到达时间小于 100\
    \ 个传输单元（TUs），则数据被分类为信标伪造 \\[25\\]。\n\n## 2.7 Evaluation\n\n训练数据预处理后，使用各种机器学习和深度学习模型来研究数据中的攻击模式。由于如\
    \ Table 2.2 所示的结果数据集不平衡，我们使用合成少数类过采样技术（SMOTE）\\[26\\] 通过过采样少数类来平衡它。SMOTE 随机选择少数类中的一个点，找到\
    \ `k` 个最近邻，并从所选邻居创建基于实例的合成数据点。Table 2.3 显示了平衡后的数据集的类分布。\n\nTable 2.2 Class Distribution\
    \ of Dataset Before SMOTE Balancing (Unbalanced Dataset)\n\n| Class || Number\
    \ of Samples |\n\n| --- | --- |\n\n| Normal || 7,118 |\n\n| --- | --- |\n\n| Beacon\
    \ Flooding || 2,222 |\n\n| De-authentication Attack || 1,262 |\n\n| Beacon Forgery\
    \ || 1,119 |\n\nTable 2.3 Class Distribution of Dataset After SMOTE Balancing\
    \ (Balanced Dataset)\n\n| Class || Number of Samples |\n\n| --- | --- |\n\n| Normal\
    \ || 7,118 |\n\n| --- | --- |\n\n| Beacon Flooding || 7,118 |\n\n| De-authentication\
    \ Attack || 7,118 |\n\n| Beacon Forgery || 7,118 |\n\n模型性能使用准确率、精确率、F1 分数和召回率等指标进行评估。\n\
    \n1.  Precision – Precision helps to understand the ability to classify relevant\
    \ data points. It is calculated using the equation below. \n\n    `Precision =\
    \ TP / (TP + FP)` (2.9)\n\n2.  Recall – Recall defines the ability of the model\
    \ to find all the relevant cases within a dataset. \n\n    `Recall = TP / (TP\
    \ + FN)` (2.10)\n\n3.  Accuracy – Accuracy is the number of correctly predicted\
    \ data points out of all the data points. \n\n    `Accuracy = TP / Total Samples`\
    \ (2.11)\n\n4.  F1 score – The F1 score measures the accuracy of the model on\
    \ a dataset by calculating the harmonic mean between precision and recall.\n\n\
    \    `F1_Score = (2 * Precision * Recall) / (Precision + Recall)` (2.12)\n\n###\
    \ 2.7.1 Analyzis of Results\n\n我们研究了模型在不平衡和平衡数据集上的性能。这是由于少数类和多数类之间的数量巨大差异可能导致分类器决策产生偏差。\n\
    \nk-NN、`SVM`、`random forest`、`MLP` 和 `CNN` 在不平衡数据集上的精确率、召回率、F1 分数和准确率等性能参数显示在\
    \ Table 2.4 并在 Figure 2.9 中绘制。生成的混淆矩阵分别给出在 Figures 2.9、2.10、2.11、2.12 和 2.13。\n\
    \nTable 2.4 Performance Metrics on Unbalanced Dataset\n\n| Algorithm || Precision\
    \ (%) || Recall (%) || F1-Score (%) || Accuracy (%) |\n\n| --- | --- | --- | ---\
    \ | --- |\n\n| **Machine Learning Models** |\n\n| --- |\n\n| k-NN || 36.87 ||\
    \ 60.72 || 45.89 || 60.72 |\n\n| SVM || 11.50 || 10.76 || 20.90 || 10.76 |\n\n\
    | Random Forest || 78.97 || 73.32 || 65.39 || 73.32 |\n\n| **Deep Learning Models**\
    \ |\n\n| MLP || 91.00 || 91.00 || 92.00 || 92.00 |\n\n| CNN || 100.00 || 44.00\
    \ || 62.00 || 44.00 |\n\n![Figure 2.9 Graphical results for evaluation of unbalanced\
    \ data.](img/fig2_9.jpg)\n\nFigure 2.9 Graphical results for evaluation of unbalanced\
    \ data.\n\n![Figure 2.10 Confusion matrix of k-NN for unbalanced dataset.](img/fig2_10.jpg)\n\
