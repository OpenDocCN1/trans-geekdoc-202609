    platforms. Consequently, supporting the convergence of sensing, communication,
    and computing over the Internet of Things (IoT) is the requirement of the time,
    and the existing cellular network over the 4G and 5G communication technologies
    can directly support this convergence. Narrowband IoT (NB-IoT) \[[1](#ch04.xhtml#ref4_1),[2](#ch04.xhtml#ref4_2)\]
    supports a large number of low-throughput IoT devices over the existing cellular
    platforms built over the long-term evolution (LTE) and LTE advanced (LTE-A) technologies.
    Consequently, it can play a prominent role in the deployment of wide-scale smart
    city applications.


    From the technical perspective, NB-IoT operates on a low-frequency channel bandwidth
    of 180 kHz in order to offer a coverage area over 160 dB, maintaining a latency
    tolerance of 10 seconds, approximately \[[2](#ch04.xhtml#ref4_2)\]. With these
    specifications, NB-IoT primarily targets IoT devices that are delay tolerant or
    the devices that are situated in areas where signal strength is poor. LTE operators
    can deploy a NB-IoT standard inside an LTE carrier signal by allocating a physical
    resource block (`PRB`) of 180 kHz to NB-IoT. Although the technology has multiple
    advantages for industrial automation and control, such as cost-effective massive
    deployment supports, plug-and-play over existing LTE networks, long battery life
    due to ultralow power communication, better penetration of structures and better
    data rates compared to LoRA and SigFox, however, it does not support delay-sensitive
    applications, which makes it unsuitable for industrial applications where real-time
    data delivery with a strict delay guarantee is one of the major requirements.


    ### 4.1.1 Challenges in Delay-Sensitive Traffic Scheduling over NB-IoT

