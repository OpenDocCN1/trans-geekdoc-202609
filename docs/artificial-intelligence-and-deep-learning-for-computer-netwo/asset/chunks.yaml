- raw: 'In recent years, a number of blind forensic measures, such as \[[23](#ch06.xhtml#ref6_23),[24](#ch06.xhtml#ref6_24),[25](#ch06.xhtml#ref6_25),[26](#ch06.xhtml#ref6_26)\],
    were also explored to detect double compression–based forgery in JPEG images.
    However, most of the state-of-the-art blind digital forensic techniques utilized
    handcrafted features, extracted from JPEG compression artifacts, to detect double
    JPEG compression in images. However, the performance of such handcrafted features
    is constrained by various scenarios, like quality factor of first compression
    *QF*[1] is greater than the quality factor of second compression *QF*[2]. Hence,
    the identification of suitable features for detection of JPEG double compression
    in vast datasets is a challenging task. In resent years, the deep learning technique
    has gained a lot of attention in the field of computer vision, cybersecurity,
    and natural language processing, due to its ability for automatic suitable feature
    extraction.


    In this chapter, we present a deep learning–based framework for detection and
    localization of double compression–based JPEG modification attack. In this work,
    we model the above problem as a two-way classification, i.e., identification of
    single and double JPEG compressed images. Next, we locate the double-compressed
    (forged) region within the images by performing an overlapping block-wise classification
    on the test images. Additionally, the presented forensic framework also overcomes
    the limitation, i.e., quality factor of first compression is greater than the
    second (*QF* 1 *\> QF* 2), of state-of-the-art techniques such as \[[26](#ch06.xhtml#ref6_26),[27](#ch06.xhtml#ref6_27),[28](#ch06.xhtml#ref6_28)\].


    This chapter is organized as follows. A brief discussion on the related background
    of JPEG compression, followed by a JPEG attack model is considered in this chapter
    and recent research works related to recompression-based JPEG forgery detection
    are presented in [Section 6.2](#ch06.xhtml#sec6_2). In [Section 6.3](#ch06.xhtml#sec6_3),
    we present a deep learning–based blind forensic framework for detection of JPEG
    double compression, and finally this chapter is concluded in [Section 6.5](#ch06.xhtml#sec6_5).


    ## [6.2 Related Background](#ch06.xhtml#c_sec6_2)


    In this section, we present a brief discussion of JPEG compression, followed by
    a JPEG attack model. A literature review on re-compression-based JPEG forgery
    detection techniques is also presented in this section.


    ### [6.2.1 Overview of JPEG Image Compression](#ch06.xhtml#c_sec6_002_001)


    Joint photographic expert group (JPEG) \[[29](#ch06.xhtml#ref6_29)\] is the most
    widely used image storage format. The framework of JPEG image compression and
    decompression technique are shown in [Figure 6.2](#ch06.xhtml#fig6_2). First,
    the images are divided into non-overlapping pixel blocks of size 88, denoted by
    B, followed by 2D discrete cosine transform (DCT) performed on each block. Hence,
    it obtains its corresponding DCT coefficient block, denoted by *D*^(*B*). Then,
    each DCT coefficient block is quantized by an 88 quantization matrix, *Q*[*QF*].
    The quality factor, *QF*, defines a quantization matrix.


    ![Figure 6.2 JPEG compression and de-compression process.](images/fig6_2.jpg)


    [Figure 6.2 JPEG compression and de-compression process.](#ch06.xhtml#Ffig6_2)


    The value of *QF* is in between \[1, 100\], and higher value of *QF* denotes the
    lower degree of compression.


    The JPEG de-compression process is just the reverse of the compression process.
    First, quantized DCT coefficients *Q**C*[*q*]^(*B*) are de-quantized by multiplying
    the quantized DCT coefficient *Q**C*[*q*]^(*B*) with the corresponding quantization
    matrix, *Q*[*QF*], to obtain the de-quantized coefficient *D*^(*−B*). Then, the
    image pixel blocks (say *B*′) are reconstruct by applying inverse-DCT (IDCT) to
    the de-quantized DCT coefficients, and finally followed by a rounding and truncation
    operation.


    The quantization function is a non-invertible operation due to the rounding function.
    This makes JPEG a lossy compression technique. Due to the quantization step, a
    quantization error is generated for an image during the encoding and decoding
    process in JPEG. The quantization error is defined as *Q*[*error*] = *D*^(*B*)
    − (*D*^(*B*)*/Q*[*QF*]*)Q*[*QF*].


    Along with the quantization error, a rounding error and a truncation error are
    also introduced during IDCT. Some float values are generated when performing IDCT
    on de-quantized DCT coefficients. The float values are generated by IDCT andshould
    be rounded to nearest integer value. This produces a rounding error. If the rounded
    values exceeds the range of \[0, 255\], those will be truncated to this range.
    This leads to generating a truncating error. Utilizing these compression errors,
    many researchers, such as Farid et al. \[[12](#ch06.xhtml#ref6_12)\], Bianchi
    et al. \[[27](#ch06.xhtml#ref6_27)\], Barni et al. \[[30](#ch06.xhtml#ref6_30)\],
    and Taimori et al. \[[31](#ch06.xhtml#ref6_31)\], detect forgery in JPEG images.


    ### [6.2.2 JPEG Attack Model](#ch06.xhtml#c_sec6_002_002)


    The most common JPEG attack model found in the literature is as follows. Let a
    JPEG image intially compressed with quality factor *QF*[1] ∈ \[0, 100\], as shown
    in [Figure 6.3(a)](#ch06.xhtml#fig6_3), which is known as a first JPEG compressed
    image. Next, a target region is extracted from the single compressed JPEG image,
    and re-compressed at quality factor *QF*[2] ∈ \[0, 100\], where *QF*[2] ≠ *QF*[1],
    as shown in [Figure 6.3(c)](#ch06.xhtml#fig6_3). The extracted re-compressed region
    is pasted to its original location to generate a forged image, as shown in [Figure
    6.3(c)](#ch06.xhtml#fig6_3). Hence, two different degrees of compression are present
    within the resultaning tampered image: one is a double-compressed (manipulated)
    region with subsequent quality factors *QF*[1]*, QF*[2], and another is the rest
    of the image (authentic) region, which is compressed at quality factor *QF*[1].
    It is evident from [Figure 6.3(c)](#ch06.xhtml#fig6_3) that the tampered region
    has a (double) compression ratio, is different from the rest of the image, and
    is perceptually indistinguishable.


    ![Figure 6.3 JPEG attack on image \[32\]: (a) authentic 512 × 512 image; (b) selected
    region, re-saved at a different compression quality factor; (c) forged image with
    partially double-compressed regions.](images/fig6_3.jpg)


    [Figure 6.3 JPEG attack on image](#ch06.xhtml#Ffig6_3) \[[32](#ch06.xhtml#ref6_32)\]:
    [(a) authentic 512 × 512 image; (b) selected region, re-saved at a different compression
    quality factor; (c) forged image with partially double-compressed regions.](#ch06.xhtml#Ffig6_3)


    ### [6.2.3 Related Works](#ch06.xhtml#c_sec6_002_003)


    In this section, we present a brief overview of recent research toward JPEG recompression-based
    image forensics. In recent years, a significantly large amount of research has
    been carried out for double JPEG compression detection. Most of the earlier research
    works in this direction are based on exploitation of statistical ditribution,
    such as *Benford''s law* or *first-digit law* \[[33](#ch06.xhtml#ref6_33),[34](#ch06.xhtml#ref6_34),[35](#ch06.xhtml#ref6_35)\]
    of JPEG double-compression quantization effect.'
