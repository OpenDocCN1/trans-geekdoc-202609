    [Figure 4.7 Analysis of individual priority: (a) average PLR; (b) average delay.](#ch04.xhtml#Ffig4_7)


    When the number of connected UEs is 30, from [Figure 4.7](#ch04.xhtml#fig4_7),
    it can be noted that the average PLR values of “Priority-1” are 14% and 33% lower
    than “Priority-2” and “Priority-3,” respectively; whereas, the average PLR is
    22% low in “Priority-2” compared to “Priority-3.” In terms of delay, “Priority-1”
    has 30% and 40% lower average delay than that of “Priority-2” and “Priority-3,”
