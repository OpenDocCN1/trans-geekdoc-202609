    ## 2.8 结论与未来工作


    在本文中，我们提出了一种基于机器学习的方法来检测信标伪造。具体来说，我们通过执行使用 `kali linux` 的攻击来开发一个数据集，并使用 `tshark`
    对其进行预处理。使用 `SVM`、`k-NN`、随机森林、`MLP` 和 `CNN` 对所得数据集进行研究，以分类信标伪造、检测和去认证攻击。我们的方法以最高
    92.00% 的准确率对各种攻击进行分类。我们提出通过提出一种混合模型来扩展我们的工作，该模型将基于签名的方法与机器学习相结合，以在实时条件下对攻击进行分类。


