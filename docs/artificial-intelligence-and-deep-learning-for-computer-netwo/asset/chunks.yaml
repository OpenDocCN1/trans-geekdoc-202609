    base K by applying only exploration repeatedly. After the initialization, *ϵ*\-greedy
    approach starts, where initially, the rate of exploration is high. Thus, at the
    initial stage of NB-PTS, there is a high fluctuation in the graph shown in [Figure
    4.8(a)](#ch04.xhtml#fig4_8). However, the rate of exploitation is enhanced as
    the number of runs of NB-PTS increases. In this duration, the selection of the
