    其中 Sub 表示替换，Del 表示删除的数量，Ins 表示插入，N 表示给定序列中的总词数。预处理后，将数据发送到特征提取技术。


    特征提取技术对于检测数据集中的恶意性非常重要。这些代表实际数据集的重要特征。这些特征对于在 \[7\] 和 \[5\] 中预测的不同类型的普通数据和恶意数据是不同的。


    然后，使用深度学习技术检测线性数据集中的恶意漏洞。如今，深度学习技术几乎用于所有应用程序。这些技术使用机器学习模型用于不同的实时应用程序。在本章中，基于数据集的
    LSTM 深度神经网络（DNN）模型中的漏洞检测深度学习技术。LSTM（长短期记忆）是一个强大的 DNN 模型，是 RNN（循环神经网络）的修改版本。该模型提供了避免长期依赖问题的功能。


