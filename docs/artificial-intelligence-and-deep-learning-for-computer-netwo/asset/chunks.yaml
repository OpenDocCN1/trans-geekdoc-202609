  trans: "\n\nMDP 是一种随机控制过程，具有离散时间范围。它为建模代理人的决策困境和优化结果提供了数学框架。MDP 的目的是确定所考虑代理人的最佳策略。它已被广泛用于为不同问题建模\
    \ SDN。四个基本组件定义了 MDP：\n\n> *`S`*: 有限状态集，\n\n> \n\n> *`A`*: 有限动作集，\n\n> \n\n> *`p`*:\
    \ 执行动作“`a`”后从状态 `s` 转移到状态 `s 0` 的概率，\n\n> \n\n> *`r`*: 执行动作“`a`”后获得的即时奖励。\n\n\
    ### 3.5.3 使用马尔可夫决策过程进行问题公式化\n\n我们将负载均衡问题公式化为马尔可夫决策过程 (`MDP`)，其中三元组 (`S`, `A`,\
    \ `R`) 用于对其进行表征。\n\n#### 3.5.3.1 状态空间 (`S`)\n\n`S` 是有限状态空间。在我们的问题中，状态空间 `S` 是交换机可以迁移到的控制器集合，也称为迁移域。换句话说，状态空间表示欠载控制器列表。状态\
    \ `ST` ∈ `S` 对应于控制器的索引。例如，考虑一个有五个控制器的场景。状态 (0, 0, 0, 0, 1) 表示第一个控制器作为迁移域的一部分。有五个可能的状态，但并非所有状态都可能是迁移域的一部分。\n\
    \n#### 3.5.3.2 动作空间 (`A`)\n\n`A` 是有限动作空间。动作定义为从迁移域（即欠载控制器集合）中选择控制器的过程。每个动作 `a`\
    \ ∈ `A` 由选定用于迁移的欠载控制器的索引表示，也称为目标控制器。\n\n#### 3.5.3.3 奖励函数 (`R`)\n\n`R` 表示与状态-动作对相关的即时奖励，表示为\
    \ `R`(`ST`, `a`)，其中 `ST` ∈ `S` 且 `a` ∈ `A`。`R`(`ST`, `a`) 表示迁移发生后负载均衡程度的变化。从数学上定义如下：\n\
    \n`R`(`ST`, `a`) = |(`D`[`i`, `j`] − `D`′[`i`, `j`])| (3.5)\n\n术语 `D`[`i,j`] 是两个控制器\
    \ `c`[`i`] 和 `c`[`j`] 之间的负载偏差系数（或离散系数）。同样，`D`′[`i`, `j`] 是交换机从控制器 `c`[`i`] 迁移到\
    \ `c`[`j`] 后的负载偏差。它计算如下\n\n```\n$\\left. D\\_{i,j}:=D\\_{c\\_{i},c\\_{j}} = \\\
    left( \\sqrt{\\sum\\limits_{k = i,j}{{({IL\\_{c\\_{k}} - L\\_{c\\_{i},c\\_{j}}^{I}})}^{2}/2}}\
    \ \\right)/L\\_{c\\_{i},c\\_{j}}^{I}. \\right.$ (3.6)\n```\n\n对于 `n` 个控制器，负载偏差系数计算如下\n\
    \n```\n$\\left. D = \\left( \\sqrt{\\sum\\limits_{i = 1}^{n}{\\left( {IL\\_{c\\\
    _{k}} - L^{I}} \\right)^{2}/n}} \\right)/L^{I}. \\right.$ (3.7)\n```\n\n**示例 3.1:**\
    \ MDP 公式化\n\n***考虑以下场景：** 我们有 11 个交换机分布在三个控制器上：`c`[1]、`c`[2]、*和 `c`[3]*。网络如* 图\
    \ 3.2 *所示。在特定时间步 `t`[`i`]* 时，`c`[1] *过载，即 `O`[`domain`] \\=* {`c`[1]} *。现在为了平衡控制器\
    \ `c`[1]*，分配给该控制器负载最大的交换机被选中进行迁移（假设为 `s`[2] *）。选择目标控制器的动作基于 ϵ-greedy 选择。在示例中，我们假设控制器\
    \ `c`[3] *被选中进行迁移*。\n\n![图 3.2 MDP 公式化的状态-动作示例。](img/fig3_2.jpg)\n\n图 3.2 MDP\
    \ 公式化的状态-动作示例。\n\n*给定场景的状态空间为* {(0, 0, 1), (0, 1, 0), (1, 0, 0)} *，因为交换机可以连接到三个控制器中的任何一个。在时间\
    \ `t`[`i`]* 时，交换机 `s`[2] *连接到控制器 `c`[1]*。因此，交换机 `s`[2] *的状态为* (0, 0, 1) *。在此时间点，我们假设控制器\
    \ `c`[1] *过载，而其他两个控制器欠载。迁移域因此为* {(0, 1, 0) (1, 0, 0)} *。基于* *方程* 3.5 *中定义的奖励函数，将选择一个动作（状态，动作对）。在此工作中，我们基于\
    \ Q-learning 选择动作。*\n\n求解 MDP 涉及为所考虑的代理人获得最佳策略。我们的问题领域转化为选择适当的交换机、迁移控制器对，以优化目标函数。该动作也不应导致\
    \ *交换机震荡*，即交换机在过载和欠载控制器之间来回移动。我们假设代理人对动作、奖励或转换概率没有先验知识。动作仅基于当前网络流量。因此，我们使用无模型仿真工具。我们使用\
    \ Q-learning，即强化学习算法家族中最著名的无模型技术。\n\n### 3.5.4 Q-Learning\n\nQ-learning 是一种 RL\
    \ 技术，通过学习动作-值函数来工作。它表示给定状态下动作的预期效用，之后遵循固定策略。Q-learning 的优势之一是它可以在不需要环境模型的情况下比较可能动作的预期效用，并且可以在线使用。\n\
    \nQ-learning 是一种非策略强化学习算法。它被称为 *非策略* 是因为 Q-learning 函数从当前策略未涵盖的活动（例如随机行为）中学习。因此，不需要策略。换句话说，Q-learning\
    \ 旨在发现最大化总奖励的策略。在示例 3.1 中，在时间 `t`[`i`] 时状态数为 3，动作数为 2。动作 `a`[1] 此时无效。因此，相应的 Q\
    \ 表如下：(表 3.2)\n\n [表 3.2 时间 `t`[`i`] 的示例 3.1 Q 表](#ch03.xhtml#Ttable3_2) \n\n\
    |  || 动作 |\n\n| --- | --- |\n\n| a2 || a3 |\n\n| 状态 || s1 || Q(s1,a2) || Q(s1,a3)\
    \ |\n\n| --- | --- | --- | --- |\n\n| s2 || Q(s2,a2) || Q(s2,a3) |\n\n| s3 ||\
    \ Q(s3,a2) || Q(s3,a3) |\n\n`Q`(`ST`, `a`) 的值通过在每个时代中选择最大项来迭代修改。估值矩阵的迭代更新方法如下所示：\n\
    \n```\n$Q{(ST,a)}\\_{t + 1} = Q{(ST,a)}\\_{t} + \\\\alpha(R(ST,a) + \\\\gamma\
    \ \\\\ast \\\\underset{a}{max}Q{(S{T\\\\prime},{a\\\\prime})}\\_{t} - Q{(ST,a)}\\\
    _{t})$ (3.8)\n```\n\n使用当前返回值与内存中下一个最大值 `Q`(`ST‘`, `a’`)[`t`] 的和作为预期值。通过预期值与真实估计之间的差异进行增量迭代学习，以获得在第\
    \ (`t` + 1)*th* 轮中 `Q`(`ST`, `a`)[`t`] 的值。学习率 `α` 设置在 0 和 1 之间。值为 0 意味着 Q 值永远不会更新；因此，什么都不会学习。设置较高的\
    \ Q 值，例如 0.9，意味着学习可以快速发生。较大的折扣因子 `γ` 考虑长期利益，而较小的值则强调即时考虑。最初，Q 表初始化为“0”。使用勘探与利用权衡来逐渐调整\
    \ Q 值。\n\n#### 3.5.4.1 勘探与利用权衡\n\n通过利用，我们指代理人选择能带来更大即时利益的动作的场景，尽管这可能是次优的。勘探指代理人选择不同的动作以在未来获得更好的回报，而不是专注于即时利益。保持勘探与利用之间的平衡至关重要。\n\
    \n为了平衡利用代理人现有知识与勘探随机动作等策略，我们采用 `ϵ`-greedy Q-learning 策略，详情见 第 3.6.2 节。\n\n## 3.6\
    \ 方法论\n\n"
