    在动态控制器-交换机关联中，我们监控控制器负载。如果负载超过理想负载，控制器的响应时间将会恶化。我们假设理想负载为平均网络流量。换句话说，我们的主要目标是保持所有控制器上的负载均衡。我们假设所有控制器都具有相同的容量。为了保持负载均衡，我们需要识别过载的控制器，并将其一个或多个转发设备重新分配给负载较低的控制器。在本节中，我们将讨论负载均衡问题的公式。


    ### 3.3.1 问题公式


    设 `S` 和 `C` 分别表示交换机集合和控制器集合。我们假设有 `n` 个交换机和 `k` 个控制器，其中 `k < n`。网络被解释为一个包含 `n`
    个节点的图，节点可以是任何转发设备，`E` 为边的数量。节点代表交换机，控制器被假设与交换机共位。本章使用的符号在表 3.1 中描述。


    Table 3.1 本章使用的符号列表


    | Symbol | Description |

    | --- | --- |

    | `S` | 交换机集合，|`S`| = `n` |

    | `C` | 控制器集合，|`C`| = `k` |

    | `s`(`t`) | 时间 `t` 时交换机 `s` 的流请求速率 |

    | `IL``c` | 时间 `t` 时控制器 `c` 的瞬时负载 |

    | `L`^I(`t`) | 时间 `t` 时所有控制器的理想负载 |


    在任何给定时间 `t`，我们假设交换机被分配给或由控制器控制。因此，


    ```

    $x\_{ij}(t) = \\left\\{ \\begin{matrix} {1,} & {if\\mspace{9mu}{link}\\mspace{9mu}{exists}\\mspace{9mu}{between}\\mspace{9mu}{switch}\\mspace{9mu}
    s\_{i}\\mspace{9mu}{and}\\mspace{9mu}{controller}\\mspace{9mu} c\_{j}\\mspace{9mu}{at}\\mspace{9mu}{time}\\mspace{9mu}
    t,} \\\\ {0,} & {Otherwise\\mspace{423mu}} \\\\ \\end{matrix} \\right.$ (3.1)

    ```


    设 `s``i` 表示在时间 `t` 时到达交换机 `s`[`i`] 的新流数量。在计算控制器负载时，我们考虑其在任何给定时间经历的总流量。因此，时间 `t`
    时控制器 `c`[`j`] 的瞬时负载是其分配交换机产生的所有流请求消息之和。


    ```

    $IL\_{c\_{j}}(t) = \\sum\\limits\_{t = 1}^{n}{s\_{i}(t)x\_{ij}(t)}$ (3.2)

    ```


    控制器的理想负载被视为系统的平均负载，计算如下：


    ```

    $L^{I}(t) = \\frac{\\sum\_{j = 1}^{K}{IL\_{c\_{j}}(t)}}{K}$ (3.3)

    ```


    目标是最小化理想负载与瞬时负载之间的差异（公式 3.3）。因此，我们的目标如下：


    ```

    min  (*L*^(*I*)(*t*)−*I**L*[*c*[*j*]](*t*)) (3.4)

    ```


    ## 3.4 知识定义网络


    软件定义网络（SDN）作为一种新方法，正在不断发展，该方法将控制平面和转发平面分离。逻辑集中的控制平面控制转发设备。SDN 起源于在快速发展的网络中优化网络资源的需求。解决此类问题的关键是自动化控制平面的决策过程。将分析和行为模型集成到
    SDN 中以自动化决策，催生了一种称为知识定义网络（KDN）的新范式。在本节中，我们将简要描述 KDN 从 SDN 开始的发展过程。


    ### 3.4.1 经典 SDN 架构


    应用平面、控制平面和数据平面是构成经典 SDN 的三个层。数据平面层包含转发设备（交换机、路由器等），而控制平面是中间层，包含控制器。南向 API 将转发设备连接到控制器，东西向
    API 连接控制器。北向 API 在中间层和应用平面（最顶层的 SDN 层）之间进行通信。应用层由网络应用组成，例如流量监控、路由策略、安全等。SDN 的主要优点之一是，由于其
    API 接口，应用和服务可以快速开发。控制器从应用接收策略，并提供网络的抽象视图。SDN 架构如图 3.1(a) 所示。


    ![Figure 3.1 Architecture of SDN.](img/fig3_1.jpg)


    Figure 3.1 Architecture of SDN.


    ### 3.4.2 带知识平面的 SDN 架构


    SDN 与机器学习/人工智能（AI）相结合，利用控制回路提供自动化和推荐，创建一个强大的工具。在将人工智能应用于软件定义网络后，一个称为知识平面的新平面被添加到标准
    SDN 架构中，如图 3.1(b) 所示。认知和 AI 方法在知识平面上被采用。知识平面从应用和其他来源收集网络数据，对其进行分析，并推导信息以做出最佳判断、决策和推荐。


    D. Clark 等人 [11] 在其开创性论文中，介绍了互联网知识平面（KP）的概念。其目标是使用认知和人工智能方法（例如网络运营）来提供高级网络服务。知识平面有助于网络管理任务，例如决策、预测、推荐等。当该想法被提出时，将知识平面部署到计算机网络中面临的一个重大挑战是，网络本质上是分布式的。


    SDN 的出现促进了知识平面的采用，因为控制层在逻辑上是集中化的，并提供了网络的抽象视图。Mestres 等人 [2] 提出了知识定义网络（KDN），它结合了
    KP 的概念。网络能够集成以决策为重点的行为模型和推理过程，与 SDN 相结合。自动化、推荐、优化、验证和估计都包含在 KDN 范式中。换句话说，KDN 允许在
    SDN 中利用机器学习技术的优势。


    ## 3.5 使用强化学习进行负载均衡


    在上一节中，我们了解了如何在 SDN 中使用机器学习技术来寻找最优网络配置。在本节中，我们提出使用强化学习（RL）来探索网络并自动化将交换机分配给控制器。在
    RL 中，代理人作用于 SDN 控制器，考虑当前网络配置。如果当前网络状态更接近最优状态，代理人将为每个动作获得奖励。负载均衡问题现在涉及状态、动作和奖励，并使用马尔可夫决策过程（MDP）重新公式化。


    ### 3.5.1 强化学习


    强化学习 [12] 是一种决策方法。它全部关乎在给定情况下确定如何行动以最大化奖励。在这种技术中，代理人通过试错来学习其行为。它因与环境交互而获得奖励。代理人的行为不仅取决于其提供的即时奖励，还取决于延迟回报的可能性。通过动态调整参数，强化学习系统旨在最大化强化信号。环境产生的信号是对动作完成情况的评估。


    ### 3.5.2 马尔可夫决策过程（MDP）


