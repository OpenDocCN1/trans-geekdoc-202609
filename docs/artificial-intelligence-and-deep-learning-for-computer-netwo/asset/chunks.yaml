    在第五章中，作者提出了基于安全信息和事件管理（SIEM）的深度学习（DL）技术，以解决网络安全问题。当配置良好的 SIEM 与 DL 相结合时，SIEM 会变得更加有效，并通过减少误报和噪音的数量来增加显著价值，这使得安全分析师在安全环境中更加高效。将
    DL 添加到 SIEM 的目标是减少创建基线和调整警报所需的时间投入，而无需高经验员工。


    当前的主要网络安全威胁之一是使用广泛可用且易于使用的图像和视频编辑工具来操纵和伪造数字多媒体内容（如图像和视频）。因此，给定的数字图像或视频不能被盲目信任，或者除非被证实为真实，否则不能在法庭上被接受。被操纵的多媒体可能会对整个国家的政治观点和法律秩序产生不利影响。因此，多媒体修改攻击是网络空间中的一个关键问题。为了解决这个问题，第六章中提出了一种基于数字取证措施的深度卷积神经网络（`CNN`）模型，以验证数字图像的完整性和真实性。所提出的基于深度学习的取证框架能够高效地检测和定位双压缩
    JPEG 图像中的伪造区域。实验结果证明了所提出模型的有效性。


    我们衷心希望，这本描述如此多样但非常重要的主题的前沿研究成果的书籍，能成为学生、研究人员和从业者的有用资源。


    **Sangita Roy, Rajat Subhra Chakraborty, Jimson Mathew, Arka Prokash Mazumdar,
    and Sudeshna Chakraborty**


    2022 年 5 月


