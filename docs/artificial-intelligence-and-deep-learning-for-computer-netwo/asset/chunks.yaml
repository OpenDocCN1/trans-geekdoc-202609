    通过专注于无线资源的高效利用，仅下行链路调度是 NIS 的目标。它不涉及 NB-IoT 网络中优先流量传输的延迟敏感性问题。因此，与 NB-PTS 相比，NIS
    中各个流量的平均吞吐量较低。NANIS 在下行链路调度期间最大限度地减少了无线资源的消耗，而这种最小化并非基于优先流量。此外，流量的传输延迟不被视为需要最小化，因此，NANIS
    中基于优先级的流量的吞吐量低于 NB-PTS。NANIS 的基于阈值的方法也引发了该算法在不同网络场景中适应性的问题。当连接的 UE 数量为 30 时，图
    4.4 和 图 4.5(a) 表明，NB-PTS 中“Priority-1”流量的平均吞吐量分别比一般、NIS 和 NANIS 高出约 36%、28% 和
    27%。“Priority-2”流量的平均吞吐量在 NB-PTS 中分别比一般、NIS 和 NANIS 机制高出约 32%、24% 和 9%。对于“Priority-3”，这些改进在
    NB-PTS 中分别比一般、NIS 和 NANIS 方法高出约 33%、28% 和 20%。


    #### 4.4.4.1 总体平均吞吐量


    由于各个基于优先级的流量的平均吞吐量在 NB-PTS 中高于“一般”、NIS 和 NANIS 方法，因此与这些基准机制相比，NB-PTS 的总体平均吞吐量得到了显著提高，如
    图 4.5(b) 所示。从 图 4.4 和 图 4.5 还可以注意到，NB-PTS 在拥塞网络场景中（当 UE 数量增加时）仍能实现更高的平均吞吐量。这在
    NB-PTS 中是可能的，它利用过去的经验，动态选择队列阈值的值，从而最大限度地减少 PLR，进而提高平均吞吐量。从 图 4.5(b) 可以看出，NB-PTS
    的平均吞吐量分别比 General、NIS 和 NANIS 方案高出约 34%、26% 和 22%（#UE= 30）。


    ### 4.4.5 分组丢失率和分组延迟分析


    队列阈值和目标平均延迟的确定是调度流量以保持分组传输中低平均延迟的关键因素。NB-PTS 在计算下一时隙的队列阈值时，会考虑当前平均延迟；因此，下一个队列阈值受当前延迟状态的影响，这有助于根据队列中存储的分组最近经历的延迟来调整目标平均延迟。通过应用
    `ϵ`-greedy 策略，NB-PTS 学习环境并选择目标平均延迟，使得下一个分组可以在此延迟内调度。结果，与“一般”、NIS 和 NANIS 相比，NB-PTS
    中的分组丢失概率和平均分组延迟降低，如 图 4.6 所示。这里，我们展示了基于每个流量优先级的平均结果。在这种情况下，由于 NIS 和 NANIS 不是基于在线学习的方法，并且不专注于最小化优先流量传输的分组延迟，因此
    NIS 和 NANIS 的性能显著低于 NB-PTS。但是，由于“一般”是一种基本的调度方法，NIS 和 NANIS 的平均 PLR 和延迟低于“一般”机制。从
    图 4.6 可以看出，当连接的 UE 数量为 30 时，NB-PTS 的平均 PLR 分别比 General、NIS 和 NANIS 低约 68%、59%
    和 52%。在延迟方面，所提议机制的平均延迟分别比 General、NIS 和 NANIS 方法低约 52%、48% 和 46%。


    ![Figure 4.6 (a) Average PLR; (b) average delay.](img/fig4_6.jpg)


    图 4.6 (a) 平均 PLR；(b) 平均延迟。


    #### 4.4.5.1 各个基于优先级的流量的 PLR 和延迟


    在计算指标 `W[t+1]` 时，考虑各个基于优先级的流量的 HOL 延迟，从而降低了每个优先级类的平均延迟。调度是基于 `W[t+1]` 进行的，它考虑了流量的优先级；因此，随着优先级的提高，该流量的平均
    PLR 和延迟会进一步降低。如 图 4.7 所示，可以注意到，尽管随着 UE 数量的增加，分组丢失率和延迟会增加，但借助指标 `W[t+1]`，高优先级流量可以比低优先级流量具有更低的延迟。在这方面，队列阈值的选择至关重要，NB-PTS
    通过利用该选择的过去经验来智能地选择它。此外，`W[t+1]` 包括流量的 HOL 分组延迟超过其目标平均延迟的概率。NB-PTS 通过尝试降低此概率来调度分组，因此，分组传输率（在目标平均延迟内）会增加。这种情况有助于最小化分组调度中的平均延迟。


    ![Figure 4.7 Analysis of individual priority: (a) average PLR; (b) average delay.](img/fig4_7.jpg)


    图 4.7 各个优先级分析：(a) 平均 PLR；(b) 平均延迟。


    当连接的 UE 数量为 30 时，从 图 4.7 可以看出，“Priority-1”的平均 PLR 值分别比“Priority-2”和“Priority-3”低
    14% 和 33%；而“Priority-2”的平均 PLR 比“Priority-3”低 22%。在延迟方面，“Priority-1”的平均延迟分别比“Priority-2”和“Priority-3”低
    30% 和 40%。“Priority-2”的平均延迟比“Priority-3”流量低 14%。


    ### 4.4.6 收敛行为


    图 4.8(a) 显示了 NB-PTS 在平均吞吐量方面的收敛特性，该吞吐量在算法执行每 10 分钟后计算。在初始化阶段，NB-PTS 需要通过反复应用仅探索来填充知识库
    K。初始化后，`ϵ`-greedy 方法开始，最初，探索率较高。因此，在 NB-PTS 的初始阶段，图 4.8(a) 所示的图表中存在较大的波动。然而，随着
    NB-PTS 运行次数的增加，利用率会提高。在此期间，目标平均延迟的选择是基于当前信道条件进行的，使得成功分组传输的数量不会减少，并且可以与执行早期阶段相比保持几乎稳定的平均吞吐量。可以在
    图 4.8(a) 中观察到，随着时间推移，图表的快速波动特性会减弱。


