    \ 2.7 所示绘制。k-NN、`SVM`、`random forest`、`MLP` 和 `CNN` 的生成混淆矩阵分别给出在 Figures 2.15、2.16、2.17、2.18\
    \ 和 2.19。使用不平衡数据集获得的评估指标显示 `MLP` 具有最高的准确率，其次是 `random forest`。适用于二元分类的 `SVM` 性能最差。由于\
