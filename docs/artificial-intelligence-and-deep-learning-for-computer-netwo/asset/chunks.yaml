    ## [1.1 Introduction](#ch01.xhtml#c_sec1_1)


    DNS over HTTPS (`DoH`) was introduced to overcome the security vulnerabilities
    of DNS, which exposes DNS queries to possible snoopers, compromising the privacy
    and security of a connection through man-in-the-middle attacks and eavesdropping.
    `DoH` is able to encrypt these DNS requests as an HTTPS request ensuring all the
    security features of the HTTPS protocol. However, this also adds another catch
    – being unable to distinguish between `DoH` and normal HTTPS packets, which can
    become avenues for malicious packets being potential replacements for `DoH` responses.
    This brings the need to analyze `DoH` packets for patterns that can distinguish
    them from other HTTPS packets. The unavailability of a dataset that can be used
    for analysis of `DoH` traffic is a key obstacle to being able to identify `DoH`
    traffic and subsequently the nature of such a `DoH` packet, i.e. whether it is
    malicious or not. “`DoHlyzer`” \[[1](#ch01.xhtml#ref1_1)\] is a Canadian Institute
    for Cybersecurity (`CIC`) project funded by the Canadian Internet Registration
    Authority (`CIRA`) that is one of the only available approaches that help gather
    such a dataset in a systematic way, apply feature extraction and then use models
    for classification. Our approach uses their modules of feature extraction as a
    baseline for improvement and makes use of a diverse dataset generated from several
    combinations of browsers, operating systems, internet service providers (`ISPs`),
    and locations across India.


    The motivation behind being able to analyze `DoH` traffic comes from the fact
    that while encryption provides a greater level of security for DNS requests, it
    can provide reasons for worry in other cases. For example, readable information
    from DNS can be used to identify malware, botnet communication, and data exfiltration,
    and encryption removes these aspects that can be read. Sudden increases in DNS
    requests can be a sign of data exfiltration \[[2](#ch01.xhtml#ref1_2),[3](#ch01.xhtml#ref1_3)\],
    which is the unauthorized transfer of data, by a malicious actor from a computer.
    However, with `DoH`, it is no longer known if and when there is a DNS query. DNS
    information can be used to dig into and enforce security policies, like limiting
    the access to services in corporate networks, parental control, phishing servers,
    avoiding potential blacklists, etc. While `DoH` might be able to curb censorship,
    the significance of that is out of the scope of this project. While there are
    some intuitive features and statistical features that can be used to identify
    a large number of `DoH` packets in a capture session, the same can often be used
    to emulate `DoH` packets that could be malicious traffic in disguise. This also
    largely varies depending on the network connection strength, the server being
    requested, etc., which creates several limitations to fixed pattern and knowledge-based
    classification methods for network traffic. The main factor that motivates this
    project is that the identification of `DoH` packets among network traffic can
    help retain the strength of security tools that have protected us so far based
    on DNS information. However, from an academic perspective, it helps us understand
    the strength of privacy protection provided by `DoH` to users that can prevent
    them from being profiled or subjected to unnecessary censorship. This work aims
    to analyze network traffic to extract identifiable information that can differentiate
    between non-`DoH` web traffic and `DoH` traffic using machine learning and deep
    learning methods for a variety of packet captures.


    ## [1.2 Survey on DoH, DoT, and Machine Learning Classification](#ch01.xhtml#c_sec1_2)


    Traffic classification has become an important problem in the information and
    computer science field \[[4](#ch01.xhtml#ref1_4)\]. Although machine learning
    for traffic classification isn’t a novel idea, most methods rely on black-box
    classification of traffic without the extraction of meaningful interpretable features
    for inference. In \[[5](#ch01.xhtml#ref1_5)\], some state-of-the-art classification
    algorithms such as Naive-Bayes tree, decision trees, random forests, and KNN-based
    classification are compared for several applications such as DNS, HTTP, POP3,
    FTP, several P2P applications, etc., with good results for random forest, decision
    trees, and KNN. This research can be used as a baseline, but the kind of traffic
    differs widely in purpose and characteristics.


    In \[[6](#ch01.xhtml#ref1_6)\], a survey on machine learning approaches to traffic
    classification is performed. The survey encompasses supervised and unsupervised
    techniques, packet-level, connection-level, and multi-flow level samples, overlapping
    metrics, etc., with a special emphasis on correlation-based feature selection
    techniques. \[[7](#ch01.xhtml#ref1_7),[8](#ch01.xhtml#ref1_8)\] is one of the
    first papers to implement `DoH` versus non-`DoH` classification.

