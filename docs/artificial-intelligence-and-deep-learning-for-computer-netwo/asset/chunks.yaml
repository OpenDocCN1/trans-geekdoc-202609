- raw: 'In a dynamic controller-switch association, we monitor the controller load.
    In case the load exceeds an *ideal* load, the response time of the controller
    will deteriorate. We assume the ideal load to be the mean network traffic. In
    other words, our main objective is to keep the load balanced on all the controllers.
    We assume that all the controllers have the same capacity. To keep the load balanced,
    we need to identify *overloaded* controllers and reassign one or more of its forwarding
    devices to *underloaded* controllers. In this section, we will discuss the formulation
    of the load balancing problem.


    ### [3.3.1 Problem Formulation](#ch03.xhtml#c_sec3_003_001)


    Let *S* and *C* denote the set of switches and controllers, respectively. We assume
    there are *n* switches and *k* controllers, where *k < n*. The network is interpreted
    as a graph containing *n* number of nodes that can be any forwarding device, and
    *E* the number of edges. The nodes represent switches and the controllers are
    assumed to be co-located with the switches. The symbols used in the chapter are
    described in [Table 3.1](#ch03.xhtml#table3_1).


    [Table 3.1 List of Symbols Used in Our Chapter](#ch03.xhtml#Ttable3_1)


    | Symbol || Description |


    | --- | --- |


    | *S* || Set of switches, |*S*| = *n* |


    | --- | --- |


    | *C* || Set of controllers, |*C*| = *k* |


    | *s*(*t*) || Flow-request rate of switch *s* at time *t* |


    | *IL*[*c*](*t*) || Instantaneous load of controller *c* at time *t* |


    | *L*^I(*t*) || Ideal load of all the controller at time *t* |


    At any given time *t*, we assume a switch is assigned to or controlled by a controller.
    Thus,


    $x\_{ij}(t) = \\left\\{ \\begin{matrix} {1,} & {if\\mspace{9mu}{link}\\mspace{9mu}{exists}\\mspace{9mu}{between}\\mspace{9mu}{switch}\\mspace{9mu}
    s\_{i}\\mspace{9mu}{and}\\mspace{9mu}{controller}\\mspace{9mu} c\_{j}\\mspace{9mu}{at}\\mspace{9mu}{time}\\mspace{9mu}
    t,} \\\\ {0,} & {Otherwise\\mspace{423mu}} \\\\ \\end{matrix} \\right.$ (3.1)


    Let *s*[*i*](*t*) denote the number of new flows arriving at switch *s*[*i*] in
    time *t*. In computing a controller''s load, we take into account the total number
    of flows experienced by it at any given time. Thus, the instantaneous load of
    a controller *c*[*j*] at time *t* is the sum of all the flow request messages
    produced by its assigned switches.


    $IL\_{c\_{j}}(t) = \\sum\\limits\_{t = 1}^{n}{s\_{i}(t)x\_{ij}(t)}$ (3.2)


    The ideal load of a controller is taken as a mean load of the system, which is
    computed as follows:


    $L^{I}(t) = \\frac{\\sum\_{j = 1}^{K}{IL\_{c\_{j}}(t)}}{K}$ (3.3)


    The goal is to minimize the difference between the ideal load and instantaneous
    load (equation 3.3). Thus, our objective is as follows:


    min  (*L*^(*I*)(*t*)−*I**L*[*c*[*j*]](*t*)) (3.4)


    ## [3.4 Knowledge-Defined Networking](#ch03.xhtml#c_sec3_4)


    Software-defined networking (SDN) is growing as a novel approach segregating the
    control plane and the forwarding plane. The logically centralized control plane
    controls the forwarding devices. SDN originated from the need to optimize network
    resources in fast-evolving networks. A key to solving such a problem is automating
    the decision process of the control plane. The integration of analytics and behaviour
    models into SDN to automate decision making has led to a new paradigm called knowledge-defined
    networking (KDN). In this section, we briefly describe the evolvement of KDN starting
    from SDN.


    ### [3.4.1 Classical SDN Architecture](#ch03.xhtml#c_sec3_004_001)


    The application plane, control plane, and data plane are the three layers that
    make up the classical SDN. The data plane layer contains forwarding devices (switches,
    routers, and so on), whereas the control plane is a middle layer that contains
    controllers. The southbound API connects forwarding devices to the controller,
    and the east-west bound API connects controllers. The northbound API communicates
    between the middle layers and the application plane, the topmost SDN layer. The
    application layer consists of network applications such as traffic monitoring,
    routing policy, security, etc. One of the primary benefits of SDN is that apps
    and services can be developed quickly due to its API interface. Controllers receive
    policies from apps and offer an abstract view of the network. The SDN architecture
    is shown in [Figure 3.1(a)](#ch03.xhtml#fig3_1).


    ![Figure 3.1 Architecture of SDN.](images/fig3_1.jpg)


    [Figure 3.1 Architecture of SDN.](#ch03.xhtml#Ffig3_1)


    ### [3.4.2 SDN Architecture with Knowledge Plane](#ch03.xhtml#c_sec3_004_002)


    SDN and machine learning/artificial intelligence (AI) are integrated to provide
    automation and recommendation using a control loop to create a powerful tool.
    Following the adaption of artificial intelligence to software-defined networking,
    a new plane known as the knowledge plane is added to the standard SDN architecture,
    as depicted in [Figure 3.1(b)](#ch03.xhtml#fig3_1). Cognitive and AI approaches
    are employed on the knowledge plane. The knowledge plane gathers network data
    from applications and other sources, analyzes it, and deduces information to make
    the best judgement, decision, and recommendation.


    D. Clark et al. \[[11](#ch03.xhtml#ref3_11)\], in their seminal paper, introduced
    the concept of a knowledge plane (KP) for the Internet. The objective was to deliver
    high-level network services using cognitive and artificial intelligence approaches,
    such as network operation. Knowledge plane aids in network management tasks such
    as decision making, prediction, recommendation, and so on. When the idea was floated,
    a significant challenge in the deployment of the knowledge plane to computer networks
    was because the network was inherently distributed.


    The advent of SDN facilitated the employment of the knowledge plane since the
    control layer was logically centralized and it provided an abstract view of the
    network. Mestres et al. \[[2](#ch03.xhtml#ref3_2)\] proposed the knowledge-defined
    networking (KDN), which combines the notion of KP. The network is capable of integrating
    behavioural models and reasoning processes focused on decision making with SDN.
    Automation, recommendation, optimization, validation, and estimate are all included
    in the KDN paradigm. In other words, KDN allows reaping the benefit of machine
    learning techniques in SDN.


    ## [3.5 Load Balancing Using Reinforcement Learning](#ch03.xhtml#c_sec3_5)


    In the [previous section](#ch03.xhtml#sec3_4), we have seen how machine learning
    techniques can be used in SDN to find an optimal network configuration. In this
    section, we propose using reinforcement learning (RL) to explore the network and
    automate assigning switches to controllers. In RL, the agent acts on the SDN controller,
    considering the current network configuration. The agent receives a reward for
    each action if the current network state moves closer to the optimal state. The
    load balancing problem now involves state, action, and reward and it is reformulated
    using the Markov decision process (MDP).


    ### [3.5.1 Reinforcement Learning](#ch03.xhtml#c_sec3_005_001)


    Reinforcement learning \[[12](#ch03.xhtml#ref3_12)\] is a method for making decisions.
    It''s all about determining the best way to act in a given situation to maximize
    reward. In this technique, an agent learns its behaviour through trial and error.
    It is rewarded for interacting with the environment. The agent''s actions are
    determined not just by the immediate reward it offers but also by the possibility
    of a delayed payoff. By dynamically adjusting parameters, a reinforcement learning
    system aims to maximize reinforcement signals. The signals produced by the environment
    are an evaluation of how the action was completed.


    ### [3.5.2 Markov Decision Process (MDP)](#ch03.xhtml#c_sec3_005_002)'
