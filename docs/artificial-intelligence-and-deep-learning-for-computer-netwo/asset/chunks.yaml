- raw: 'To present the DCT coefficient selection procedure more clearly to the readers,
    an example is presented in [Figure 6.4](#ch06.xhtml#fig6_4), which shows a 32
    × 32 image block, consisting of sixteen 8 × 8 DCT blocks. In [Figure 6.4](#ch06.xhtml#fig6_4),
    it can be noticed that the second coefficient assumes values of 2.185*e*^(−16),
    8.283*e*^(−16), etc. over the different DCT blocks, sequentially. The second coefficient
    assumes its highest value, 9.409*e*^(−16), at the (4,1)-th DCT block. Hence, the
    (4,1)-th DCT block and its three preceding and three succeeding neighbour DCT
    blocks: (3,2),(3,3), (3,4), (4,1), (4,2), (4,3), (4,4), are considered for the
    second DCT coefficient of a given image block. The final DCT coefficient vector,
    corresponding to the second DCT cefficient of the given image block are: \[2.1852*e*^(−16),
    2.185*e*^(−16), 2.185*e*^(−16), 9.409*e*^(−16), 4.968*e*^(−16), 4.9688*e*^(−16),
    4.992*e*^(−16)\]. Similarly, 18 more seven-dimensional DCT coefficient vectors
    are extracted from the rest of the 18 coefficients. Hence, this generates a 19
    × 7 DCT coefficient vector for each 32 × 32 image block, which is fed to a CNN
    model, described next.


    ![Figure 6.4 An example of DCT coefficient selection (second coefficient shown)
    \[32\].](images/fig6_4.jpg)


    [Figure 6.4 An example of DCT coefficient selection (second coefficient shown)](#ch06.xhtml#Ffig6_4)
    \[[32](#ch06.xhtml#ref6_32)\].


    ### [6.3.2 CNN Architecture](#ch06.xhtml#c_sec6_003_002)


    In this chapter, we present a 2D convolution neural network architecture \[[32](#ch06.xhtml#ref6_32)\],
    constituting two convoluational, two pooling and one fully connected layers, shown
    in [Figure 6.5](#ch06.xhtml#fig6_5), for JPEG double-compression detection. In
    each convolutional layer, 100 filters are used with filter (kernel) size of 3
    × 1 and *stride* = *one*. The input to the first convolution layer, Conv-1, is
    19 × 7 DCT coefficients, as discussed in [Section 6.3.1](#ch06.xhtml#sec6_003_001).
    After the first convolution layer, the output obtained is a dimension of 131 ×
    1 × 100, which is fed to the next pooling layer. Here, 100 represents the 100
    features map generated after convoluational operation.


    ![Figure 6.5 Convolution neural network (CNN) architecture \[32\].](images/fig6_5.jpg)


    [Figure 6.5 Convolution neural network (CNN) architecture](#ch06.xhtml#Ffig6_5)
    \[[32](#ch06.xhtml#ref6_32)\].


    Each pooling layer also uses 100 filters with a filter size of 3 × 1 and stride
    = 2. The pooling layer reduces the feature dimension, which reduces the overfitting
    problem. Hence, the stride magnitude determines the degree of minimization of
    the feature dimension. The output of Pool-1 is a 65 × 1 dimensional feature vector,
    and those are fed to Conv-2. The output of Conv-2 serves as the input to Pool-2,
    the dimension of which is 63 × 1. The output of Pool-2 layer is a 31 × 1 dimensional
    feature vector, which is fed to a fully connected layer.


    The final layer is a fully connected convolution layer, which consists of the
    dense and logits (Softmax) layers. The dense layer uses 1,000 neurons and rectified
    linear units (ReLUs) \[[41](#ch06.xhtml#ref6_41)\] uses an activation function
    in each layer. To overcome the overfitting of the CNN model, emphdropout regularization
    is applied in the dense layer. The logits layer performs the classification, thus
    producing the probability of each individual block of being single compressed
    or double compressed.


    Here, *Softmax cross-entropy* performs a two-way classification (single and double
    compression). This CNN model uses a learning rate of 0.001 and *stochastic gradient
    descent* optimizer to optimize the loss during training.


    ## [6.4 Localizing Double JPEG Compressed Forged Regions](#ch06.xhtml#c_sec6_4)


    Localization of tampered regions in JPEG images is accomplished during the testing
    phase of the framework. In the subsequent sections, we present a localization
    technique for double JPEG compressed forged regions along with experimental results.


    ### [6.4.1 JPEG Double-Compression Region Localization](#ch06.xhtml#c_sec6_004_001)


    In the testing step, an image is divided into an overlapping block of size 32
    × 32 with stride = 8 pixels. DCT coefficients are extracted for each block (as
    discussed in [Section 6.3.1](#ch06.xhtml#sec6_003_001)), which are fed to train
    the CNN model for testing that block. In this way, each 32 × 32 image block is
    classified as either single compression (labelled as ‘0’) or double compression
    (labelled as ‘1’). The unit of JPEG forgery localization here is 8 × 8 pixels,
    and the reason for this is explained in the following. The movement of stride
    helps us to localize the tampered region in an image as accurately as possible.
    The first image block of size 32 × 32 is tested, as shown in [Figure 6.6(a)](#ch06.xhtml#fig6_6),
    and the next second block of size 32 × 32, moving stride (= 8) in the right direction,
    is tested, as shown in [Figure 6.6(b)](#ch06.xhtml#fig6_6). At this stage, the
    previous prediction for the first block remains preserved only for the first (leftmost)
    32 × 8 pixels. The remaining 32 × 24 pixels are newly tested and assigned a new
    class label, the same as that of block 2, as they form a part of the second 32
    × 32 block. Similarly, after completing one row-wise traversal, the stride is
    moved in vertically by 8 pixels, as shown in [Figure 6.6(c)](#ch06.xhtml#fig6_6).
    Hence, once a stride movement of 8 pixels is completed horizontally and vertically,
    we are left with the old block 1 prediction, only constrained to the top-left
    8 × 8 pixels. This is evident from [Figure 6.6(d)](#ch06.xhtml#fig6_6). This technique
    helps to obtain small units, 8 × 8 image blocks, of forgery localization.


    ![Figure 6.6 Stride movement demonstration for forgery localization in test images:
    (a) Represents top-leftmost 32 × 32 image block, (b) horizontal stride movement
    of 8 pixels to the next 32 × 32 image block, (c) vertical stride movement of 8
    pixels to the next 32 × 32 image block, (d) top-leftmost 8 × 8 unit of forgery
    localization (mark in cyan color).](images/fig6_6.jpg)


    [Figure 6.6 Stride movement demonstration for forgery localization in test images:
    (a) Represents top-leftmost 32 × 32 image block, (b) horizontal stride movement
    of 8 pixels to the next 32 × 32 image block, (c) vertical stride movement of 8
    pixels to the next 32 × 32 image block, (d) top-leftmost 8 × 8 unit of forgery
    localization (mark in cyan color).](#ch06.xhtml#Ffig6_6)


    Following a similar way, each (overlapping) 32 × 32 JPEG block is tested sequentially,
    and its class label is assigned using the trained CNN, and moved to the next image
    block. For the last overhead blocks, image padding, with sufficient number of
    *zero* rows and columns, is performed to mentain the image block of size 32 ×
    32 if required. This process helps to localize the JPEG forgery and is considerably
    accurate.


    ### [6.4.2 Experimental Results for JPEG Double-Compression Localization](#ch06.xhtml#c_sec6_004_002)


    In this section, we present the experimental results for localization of JPEG
    double compression in images. For the experiments, we select 500 uncompressed
    TIFF images from a UCID dataset \[[42](#ch06.xhtml#ref6_42)\]. Out of 500 images,
    we select 480 images for training the deep learning model, and the remaining 20
    images are considered for testing.


    For training, we first compress the TIFF images with a JPEG quality factor of
    *QF*[1] = 55, 65, 75, 85, and 95, to create a single compress dataset, denoted
    by *S*[*SC*]. Next, the single-compressed images in *S*[*SC*] are again re-compressed
    with a JPEG quality factor *QF*[2] = 55, 65, 75, 85, and 95, to create a double
    JPEG compressed dataset, denoted by *S*[*DC*]. In the training phase, all the
    single- and double-compressed images are divided into non-overlapping blocks of
    size 32 × 32, as discussed in [Section 6.3.1](#ch06.xhtml#sec6_003_001).'
