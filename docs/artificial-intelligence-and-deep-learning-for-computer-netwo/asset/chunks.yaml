- raw: 'The performance of NB-PTS has been evaluated by implementing it in NB-IoT–compatible
    module of NS-3 i.e., ns-3-dev-NB-IOT \[[26](#ch04.xhtml#ref4_26)\]. By varying
    the levels of the interference, the performance of NB-PTS is analyzed with an
    eNB and multiple number of *user equipments (UEs)* (the number of UEs is varied
    from 1 to 50). Details of our simulation setup are given in [Table 4.2](#ch04.xhtml#table4_2).
    The value of *δ* is set to 5.0, which is chosen experimentally, based on quick
    convergence of the algorithm. The UEs have been placed following a Poisson distribution
    centering at the eNB position. The SINR value is selected randomly between the
    range of 20 dB–45 dB. Every simulation instance is executed for 60 seconds, and
    the results have been shown as an average from 100 runs of every simulation instance,
    which is a combination of uplink and downlink transmissions.


    [Table 4.2 PHY/MAC and Control Parameters Used in Simulation](#ch04.xhtml#Ttable4_2)


    | Parameter || Value |


    | --- | --- |


    | Path loss model || FriisSpectrumPropagationLossModel |


    | --- | --- |


    | Fading model || TraceFadingLossModel |


    | TxPower of UE || 23 dBm |


    | TxPower of eNB || 46 dBm |


    | NoiseFigure of UE || 9 |


    | NoiseFigure of eNB || 5 |


    | DefaultTransmissionMode || 0 (SISO) |


    | Propagation delay model || Constant speed propagation delay model |


    | Maximum physical data rate || 250 kbps |


    | Bit error rate (BER) || 0.03 |


    | Adaptive modulation and coding (AMC) model || Vienna |


    | Mobility model || Random direction 2d mobility model (“Bounds: Rectangle (−100,
    100, −100, 100)”, “Speed: ConstantRandomVariable \[Constant=3.0\]”, “Pause: ConstantRandomVariable
    \[Constant=0.4\]”) |


    | UE scheduler type || PfFfMacScheduler |


    | Cell radius || 1.5 (km) |


    | Transmission mode || Single-Tone |


    ### [4.4.1 Baseline Mechanisms](#ch04.xhtml#c_sec4_004_001)


    We have used NIS \[[20](#ch04.xhtml#ref4_20)\], NANIS \[[18](#ch04.xhtml#ref4_18)\],
    and “General” as the baseline mechanisms for the performance comparison with NB-PTS.
    NIS addresses the problem related to the waste of radio resources in the time
    domain in NB-IoT, and designs a downlink scheduling algorithm. NIS also describes
    the radio access strategy in a NB-IoT system and its downlink scheduling issues.
    Since NIS addresses the downlink scheduling in NB-IoT, the downlink scheduling
    can be analyzed with prioritized traffic in order to find their impact on the
    packet transmission delay. NANIS focuses on the adaptation of the time interval
    between two successive NPDCCH and the minimization of the radio resource that
    is consumed to receive data during downlink transmission. The primary design concept
    of NANIS attempts to utilize as many narrowband physical downlink shared channel
    (NPDSCH) subframes as possible. Thus, NANIS can help minimize the packet transmission
    delay considering prioritized traffic. Hence, we use NIS and NANIS as the baselines.
    The “General” is basically a first-In first-out (FIFO) approach for scheduling
    packets.


    ### [4.4.2 Prioritized Traffic Generation](#ch04.xhtml#c_sec4_004_002)


    In the performance evaluation of NB-PTS, we have considered three types of traffic
    associated with QCI values of QCI-4, QCI-6, and QCI-8, which are given in [Table
    4.1](#ch04.xhtml#table4_1). Other QCI values defined in 3GPP LTE have lower packet
    delay budgets than aforesaid QCI values and, thus, primarily concentrate on more
    delay-sensitivity than QCI-4, QCI-6, and QCI-8. Since NB-IoT technology is suitable
    for delay-tolerant applications, aforesaid three QCI values have been used for
    prioritized traffic delivery in our implementation of NB-PTS in ns-3-dev-NB-IOT.
    In this implementation, we call the traffic as “Priority-1,” “Priority-2,” and
    “Priority-3,” which correspond to QCI-4, QCI-6, and QCI-8, respectively. In the
    simulation setup, the eNB and every UE generate traffic of these three different
    priorities with an equal proportion. The traffic is generated by using OnOffApplication.
    QCI-4, QCI-6 and QCI- 8 associated traffic have been generated by the enumerators
    GBR\_NON\_CONV\_VIDEO, NGBR\_VIDEO\_TCP\_OPERATOR and NGBR\_VIDEO\_TCP\_PREMIUM,
    respectively; and these QCI values are set by the enum EpsBearer::Qci.


    ### [4.4.3 Implementation Details](#ch04.xhtml#c_sec4_004_003)


    We have implemented NB-PTS as an extension to LTE MAC \[[1](#ch04.xhtml#ref4_1)\]
    in ns-3-dev-NB-IOT and [Figure 4.3](#ch04.xhtml#fig4_3) illustrates this implementation.
    The class LteEnbMac implements the MAC layer of the eNB and PfFfMacScheduler implements
    *proportional fair scheduler* to schedule UEs. *uplink* (UL) and *downlink* (DL)
    blocks are responsible for uplink and downlink scheduling of packets stored in
    queues. The three blocks in the MAC scheduler interface are scheduler block, control
    block, and subframe block.


    ![Figure 4.3 NB-PTS implementation modules in ns-3-dev-NB-IOT.](images/fig4_3.jpg)


    [Figure 4.3 NB-PTS implementation modules in ns-3-dev-NB-IOT.](#ch04.xhtml#Ffig4_3)


    LteFfrAlgorithm is the abstract base class that implements frequency reuse algorithm
    to allocate PRB for data transmission. Generally, this algorithm makes a decision
    on the allocation of PRB for data transmission. The service access points (SAPs)
    corresponding to the LteFfrSap interface are LteFfrSapProvider and LteFfrSapUser
    The communication of the control block with the MAC scheduler is done through
    FfMacCschedSapProvider and FfMacCschedSapUser. To handle data transmission, FfMacSchedSapProvider
    and FfMacSchedSapUser help to create a connection between the MAC scheduler and
    the subframe block. For the MAC scheduler, the interfaces LteEnbCmacSap, LteMacSap
    and LteEnbPhySap build the communications with radio resource control (RRC), radio
    link control (RLC), and physical (PHY) layer. The MAC scheduler contains the following
    blocks. *HARQ* block is used for handling hybrid automatic repeat request (HARQ)
    retransmissions. *Cell Cfg*, *UE Cfg*, *LC Cfg*, and *Sched Cfg* blocks store
    the cell configuration, UE configuration, logical channel configuration, and scheduler-specific
    configuration, respectively. *Physical downlink control channel (PDCCH)/random
    access channel (RACH)* is responsible for sharing resources between UL and DL.
    The proposed NB-PTS algorithm is implemented as an extension to LteEnbMac and
    enhances the functionality of LteEnbMac by handling the transmition queues in
    UL and DL blocks. Based on QCI, LteEnbCmacSapProvider::LcInfo provides the priority
    of a traffic to NB-PTS.


    ### [4.4.4 Analysis of Throughput](#ch04.xhtml#c_sec4_004_004)


    Average throughputs of individual traffic (Priority-1, Priority-2, and Priority-3)
    are shown in [Figure 4.4](#ch04.xhtml#fig4_4) and [Figure 4.5(a)](#ch04.xhtml#fig4_5).
    Based on channel condition, it is required to determine the queue threshold dynamically
    in order to maximize the number of packets transmitted during scheduling. In addition,
    the estimation of target mean delay leads to a tolerance level of delay for a
    traffic. Thus, the computation of target mean delay is crucial, such that the
    number of packets transmitted by following their respective target mean delays
    can be enhanced as much as possible. Therefore, a learning-based adaptive mechanism
    can be helpful to determine the value of the queue threshold and target mean delay,
    based on the present network condition; and the proposed NB-PTS is an online learning–based
    approach in this direction. Furthermore, the proposed metric *W*[*t*+1] also helps
    to schedule traffic by considering target mean delay, HOL delay and priority of
    the traffic. As a result, the scheduling in NB-PTS considers priority of a traffic
    along with its delay constraint and therefore, average throughput increases as
    the priority of the traffic increases, as illustrated in [Figure 4.4](#ch04.xhtml#fig4_4)
    and [Figure 4.5(a)](#ch04.xhtml#fig4_5).


    ![Figure 4.4 (a) Average throughput of Priority-1 traffic; (b) average throughput
    of Priority-2 traffic.](images/fig4_4.jpg)'
