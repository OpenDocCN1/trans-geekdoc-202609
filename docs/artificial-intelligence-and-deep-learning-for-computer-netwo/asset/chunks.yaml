    19.  [2.7.1 Analyzis of Results](#ch02.xhtml#sec2_007_001)


    20.  [2.8 Conclusion and Future Work](#ch02.xhtml#sec2_8)


    21.  [References](#ch02.xhtml#chapter2_RL_1)


    ## 2.1 Introduction


    Wi-Fi belonging to a family of wireless technology protocols based on IEEE 802.11
    has become an integral part in connecting IoT devices. Experts predict that by
    2022 more than half of the IP traffic will be generated from wireless devices
    \[[1](#ch02.xhtml#ref2_1)\] and an efficient way of accessing the internet for
    these devices would be through the utilization of Wi-Fi. Wi-Fi utilizes wired
    network devices called access points \[[2](#ch02.xhtml#ref2_2)\] to connect to
    the internet.


    Access points use management frames like beacon and de-authentication frames to
    announce their presence or to disconnect from a network. Lack of authentication
    of these frames may eventually lead to spoofing resulting in attacks such as beacon
    forgery, de-authentication attacks, beacon flooding, etc. A combination of de-authentication
    and beacon flooding can be used to consume the resources of the legitimate access
    points and scam the user to connect to fake access points that may become a hotspot
    for man-in-the-middle attacks. Beacon forgery may also result in reduction of
    the victim''s transmission power, eventually making the network connection unusable
    \[[3](#ch02.xhtml#ref2_3),[4](#ch02.xhtml#ref2_4)\].


    Compared to a wired network, defending against attacks in real-time Wi-Fi networks
    is challenging due to the difficulty in controlling the area of access and protecting
    the medium of transmission. However, analyzing the patterns of packets can help
    to anticipate the attacks beforehand and prepare to defend against emerging threats
    \[[5](#ch02.xhtml#ref2_5)\]. Towards this goal, intrusion detection systems (IDSs)
    are leveraged to analyze patterns of normal and abnormal behavior. There exists
    two broad categories of IDS, as described below.


    1.  Signature-based IDS – Signature-based IDS defines patterns in a network and
    compares them with the firewall rules to detect an attack in real time. However,
    this requires constant updates of rules as new firewall regulations would help
    the attacker to evade detection \[[6](#ch02.xhtml#ref2_6)\].


    2.  Anomaly-based IDS – Anomaly-based IDS analyzes packet traffic and detects
    deviation from normal behaviour. Even though the IDS detects unknown attacks,
    it requires higher processing time when compared to signature-based IDS \[[7](#ch02.xhtml#ref2_7),[8](#ch02.xhtml#ref2_8),[9](#ch02.xhtml#ref2_9)\].

