    数据包调度是基于 5G LTE 的无线工业物联网（IIoT）网络中服务质量（QoS）要求的重要方面。无线调度的两个具体特征是：(i) 无线信道是不可靠、易出错且随时间变化的系统。无线网络中可能会发生突发错误，导致数据包传输失败；(ii)
    由于信号强度频繁变化，无线信道会在高信号状态和低信号状态之间快速切换，这种情况在物联网系统中更为普遍，因为存在大量通信设备。通过考虑 LTE 架构和 NB-IoT
    的规范，在 NB-IoT 上调度延迟敏感流量的挑战包括：(i) 在 LTE 环境中保持所需的 QoS 水平和系统性能，受限于有限的无线资源、不可靠的无线传播信道和高用户需求；(ii)
    NB-IoT 指定的窄带宽（180 KHz）和低数据速率（峰值数据速率约为 250 kbps）\[2》，这导致维持传输流量低延迟的困难。因此，在 NB-IoT
    架构中开发自适应调度机制至关重要，使得流量传输的总体时间能够经历较低延迟，并对延迟敏感流量数据进行明确优先级处理。本文的目标是设计一种自适应且动态的调度方案，用于在
    NB-IoT 平台上传输基于优先级的应用，通过减少调度延迟并为优先级数据维持端到端 QoS。


    ### 4.1.2 本工作的贡献


    在本文中，我们设计了一种在 NB-IoT 中的智能数据包调度机制；该机制调度 NB-IoT 中优先级流量的数据包，使得传输数据包的延迟可以最小化。据我们所知，在
    NB-IoT 范式中处理这种类型的流量调度是首次提出。所提方案 `narrowband-prioritized traffic scheduling (NB-PTS)`
    是一种介质访问控制（MAC）层机制，它通过考虑数据包的优先级来调度数据包（存储在传输队列中）。在我们对 NB-PTS 的实现中，我们使用了 `QoS class
    identifier (QCI)` \[3》，这是一种应用于 3GPP LTE 网络的机制，用于分类网络流量并在网络中提供 QoS。通过利用这些优先级，NB-PTS
    调度流量，使得优先级较高的流量获得更高的调度机会，从而导致整体传输延迟降低。我们在网络模拟器（NS）版本 3 的 NB-IoT 兼容模块中实现了 NB-PTS，即
    NS-3-dev-NB-IOT，NB-PTS 的仿真分析表明，它可以显著提高 NB-IoT 中的网络性能。


    ### 4.1.3 论文组织


    论文的其余部分组织如下：第 4.2 节 讨论相关工作。系统模型的详细信息在 第 4.3 节 中介绍。第 4.4 节 讨论 NB-PTS 的实现细节并分析仿真结果。最后，我们在
    第 4.5 节 中总结本文。


    ## 4.2 相关工作


