  trans: '


    本节提出了两种不同的方法来实现负载均衡。在第一种方法中，随机选择交换机和目标控制器。在第二种情况下，使用 Q 表算法选择负载最大的交换机和目标控制器。优化迁移模型的核心驱动力是强化学习中的决策过程，该过程发生在知识平面。知识平面与控制平面之间的控制循环用于交换负载统计信息和交换机迁移决策。最后，控制平面在数据平面上实现交换机迁移。最优交换机迁移模型如
    图 3.3 所示。


    ![Figure 3.3 Optimal switch migration model based on RL.](img/fig3_3.jpg)


    图 3.3 基于 RL 的最优交换机迁移模型。


    ## 3.6.1 随机方法


    我们计算每个时间步的最优负载。控制器分为负载不足、`I[domain]`，和负载过高，`O[domain]`。从负载过高的控制器中选择一个，`c[i] ∈
    O[domain]`，并通过将随机交换机 `s[j]` 迁移到目标控制器 `c[t] ∈ I[domain]` 来执行负载均衡。该过程持续进行，直到实现负载均衡。


    ## 3.6.2 带有 ϵ-greedy 的 Q 学习


    在 ϵ-greedy 方法中，我们试图在利用即时收益和探索长期回报之间找到权衡。我们通过以概率 ϵ 研究随机动作来训练 Q 网络。同时，我们以概率 1 –
    ϵ 利用能够最大化预期长期回报的动作。对于采取的每个动作，我们将相应地获得其新状态和产生的回报。这被视为 RL 中的经验，并将被保留以备将来使用。强化学习的核心原理应用于
    SDN 控制器选择过程。建立了一个基于强化学习的最优迁移模型，其中目标控制器由强化学习推导出的迁移动作选择。


    算法的输入是控制器和交换机的集合、交换机每个时间的流请求率，以及 Q 学习所需的各种参数。Q 矩阵，即 `state * action` 对，初始化为值 1，如算法第一行所示。迭代以
    30 秒的时间步长重复。控制器的理想负载以及负载过高（`O[domain]`）和负载不足（`I[domain]`）控制器的集合在算法第 3–5 行中计算。从
    `O[domain]` 中随机选择一个负载过高的控制器，并选择负载最高的交换机进行迁移（如第 9 行所示）。接下来，我们生成一个随机数，如果其值小于 `E`，则进行探索。从
    `I[domain]` 中随机选择一个负载不足的控制器（如第 12 行所示）。否则，如果随机数的值大于 `E`，则进行利用。也就是说，我们为给定状态选择最佳可能的动作，即产生最大
    Q 值的动作（如第 10–14 行所示）。然后执行交换机迁移。计算奖励，并使用公式 3.8 相应地更新 Q 值（如第 15–16 行所示）。ϵ 的值按第 17–20
    行所示更新。最后，我们计算负载均衡率。


    **示例 3.2：** 在 图 3.4 中，我们展示了一个 SDN 网络，其中九个 SDN 交换机分布在三个 SDN 域（控制器）中。交换机在第一个时间步的流到达率如
    表 3.3 所示。控制器 `c[1]`、`c[2]` 和 `c[3]` 的瞬时负载（按流量数计算）分别为 75、130 和 60。


    ![Figure 3.4 Unbalanced switch to controller mapping.](img/fig3_4.jpg)


    图 3.4 交换机到控制器的不平衡映射。


    [表 3.3 时间 `t[0]` 的交换机流到达率](#ch03.xhtml#Ttable3_3)


    | 交换机 | `s[1]` | `s[2]` | `s[3]` | `s[4]` | `s[5]` | `s[6]` | `s[7]` | `s[8]`
    | `s[9]` |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | `si` | 25 | 25 | 25 | 25 | 25 | 35 | 45 | 25 | 35 |

    | `si` | – | – | – | – | – | – | – | – | – |


    相应的状态空间是 {`S1 → 〈0, 0, 1〉`, `S2 → 〈0, 1, 0〉`, `S3 → 〈1, 0, 0〉`}。动作空间是 {`A1 → 〈0,
    0, 1〉`, `A2 → 〈0, 1, 0〉`, `A3 → 〈1, 0, 0〉`}。我们已在 小节 3.5.2 中结合示例详细讨论了 MDP 公式。


    我们假设控制器是同质的，最大处理能力为每秒 150 个流。控制器负载比为 `R[c1] = 75/150 = 0.5`；`R[c2] = 130/150 =
    0.866`；`R[c3] = 60/150 = 0.4`。使用这些值，我们计算控制器的成对平均负载比。值为 `R[c1c2] = 205/300 = 0.683`；`R[c1c3]
    = 135/300 = 0.45`；`R[c2c3] = 190/300 = 0.633`。最后，我们计算总体平均负载比（即理想负载）为 `R[c1c2c3]
    = 265/450 = 0.5888`。两个控制器的离散系数使用公式 (3.6) 计算。值为 `D[c1c2] = 0.26`；`D[c1c3] = 0.11`；`D[c2c3]
    = 0.368`。对于 `n` 个控制器，离散系数使用公式 (3.7) 计算，`D[c1c2c3] = 0.34066`。


    离散系数用于区分负载过高和负载不足的控制器。在我们的示例中，{`c[2]`} 是负载过高的，{`c[1]`、`c[3]`} 是负载不足的控制器。负载最大的交换机（`s[7]`）被选为迁移对象。最初，Q
    矩阵初始化为 1，如 表 3.4 所示。


    表 3.4 Q 矩阵


    | | 动作 |

    | --- | --- |

    | | A1 | A2 | A3 |

    | **状态** | S1 | 1 | 1 | 1 |

    | **S2** | 1 | 1 | 1 |

    | **S3** | 1 | 1 | 1 |


    **衰减的 epsilon 贪婪方法：** 在我们的示例中，E 的初始值设置为 0.7，并以衰减因子 0.0025 衰减到 0.05。假设我们使用利用，我们将交换机
    `s[7]` 传输到控制器 `c[3]`，因为表中所有条目都是 1，因此最大 Q 值将从 {`c[1]`、`c[3]`} 中选择 `c[3]`。`s[7]`
    迁移后，新系统将如下所示：


    ```

    \begin{array}{lll}

    {c_{1}\ :s_{1},s_{2},s_{3} = 75;} & {c2\ :s4,s5,s6 = 95;} & {c3\ :s8,s9,s7 = 105}
    \\

    \end{array}

    ```


    再次，我们计算控制器负载比、平均控制器负载比和离散系数 `D''[ij] = 0.19451894`。新离散系数的值更小，这意味着交换机传输后系统变得更加稳定。奖励使用公式
    (3.5) 计算。


    `Reward = |(D''[ij] − D[ij])| = 0.19451894`


    当系统变得更加稳定时，奖励会变得更大。Q 矩阵使用公式 (3.8) 更新。我们取 γ 为 0.7，α 在第一步为 0.6，`Q[S2,A3] = 1 + 1(0.19451894
    + 0.7 ∗ 0.6 − 1) = 0.61451894`。下一次迭代的新 Q 表如 表 3.5 所示。


    [表 3.5 Q 矩阵更新状态（从时间 `t[0]` 到时间 `t[1]`）](#ch03.xhtml#Ttable3_5)


    | | 动作 |

    | --- | --- |

    | | A1 | A2 | A3 |

    | **状态** | S1 | 1 | 1 | 1 |

    | **S2** | 1 | 1 | 0.61451894 |

    | **S3** | 1 | 1 | 1 |


    ## 3.7 结果与实现


    以下部分描述了实验设置、性能指标和实验结果分析。


    ## 3.7.1 实验设置


