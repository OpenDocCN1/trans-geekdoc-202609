    ### 5.3.1 提出的方法


    本章提出了一种适用于 IoT 的独特、高效的网络安全模型。它是一个持续监控 IoT 网络中漏洞的数据库。该网络安全模型的优势在于使用机器学习中的无监督分类器进行自然语言处理，可应用于可疑网络层攻击。一旦在网络中生成流量模型，即可用于识别异常
    \[11\] 和 \[5\] (Figure 5.6)。


    ![Figure 5.6 Working model for proposed SIEM in IoT networks.](img/fig5_6.jpg)


    Figure 5.6 Working model for proposed SIEM in IoT networks.


    在本分析阶段，考虑以下主题建模特征：1. 源 IP，2. 目标 IP，3. 源端口，4. 目标端口，5. 协议，6. 时间，7. 发送字节，8. 接收字节，9.
    发送数据包，10. 接收数据包，11. 异常识别。基于机器学习模型的网络安全模型最初将日志记录实体简化为单词，以转换为主题建模。概率较低的攻击被识别为“可疑攻击”，概率较高的攻击被视为“非可疑攻击”。


