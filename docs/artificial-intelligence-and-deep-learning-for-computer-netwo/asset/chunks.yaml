    online learning–based approaches and do not concentrate on minimizing packet delay
    of prioritized traffic delivery, the performances of NIS and NANIS are significantly
    lower than NB-PTS. However, since “General” is a basic approach of scheduling,
    NIS and NANIS have lower average PLR and delay than the “General” mechanism. From
