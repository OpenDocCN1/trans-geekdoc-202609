    ## 5.1 Introduction


    Security information and event management (SIEM) play a key role in improving
    the next-generation cybersecurity-based secure communication against potential
    cyber-attacks. Nowadays, the world has been connected by Internet of Things (IoT)
    devices, which will reach 1.3 trillion by 2026. In such cases, potential cyber-attacks
    that affect the communication layers between computers and IoT devices through
    centralized and decentralized systems will be more vulnerable, such as DDoS attacks,
    botnet, social attacks, man-in-the-middle attacks, etc. during its applications
    in worldwide industrial areas such as the healthcare sector, smart transportation,
    agriculture, online banking, Google pay, Paytm banking, etc \[[1](#ch05.xhtml#ref5_1)\].


    As a solution in this chapter, deep learning–based vulnerability detection and
    prevention model for SIEM with lightweight computing has been proposed. Also,
    an open-source decentralized vulnerabilities detection model will be developed
    for testing the implementation of industrial applications. Through this chapter
    scalability, reduced latency, secure reliable communication, and fast downloading/uploading
    through Internet of Things can be achieved. The deliverable of the chapter is
    a deep learning (DL)–based model to detect and protect the vulnerabilities for
    IoT networks that will have a great focus in the near future for secure communication.
    The following are features of SIEM for IoT networks \[[2](#ch05.xhtml#ref5_2)\]:


    > Suitable for an organization.

    >

    > Can identify, monitor, record, and analyze security incidents or events within
    an environment and store their relevant data centrally.

    >

    > Provides a complete, holistic view of the environment, end to end, and tracks
    it over time and helps to ease the process.

    >

    > Has potential to enhance the efficiency of incident-handling activities that
    result in saving resources, manpower, and time for incident-handling folks.

    >

    > Has advantages like better data protection, improved compliance, easier certifications,
    and validated policy enforcement and violations.

    >

    > Software can be installed on a local hardware and a local server.

    >

    > Provides a single interface to view all security logs from multiple hosts \[[3](#ch05.xhtml#ref5_3)\].

    >

    > Has embraced new capabilities such as user and entity behavioral analytics (UEBA)
    that can help organizations detect threats from both people and software and eliminate
    them before they pose a grave damage.


    Regarding this chapter, although the importance and incorporating DL into cybersecurity
    are more as represented, many industries have procured IoT, but most are not properly
    configured or managed because of the cyber-attacks which are often cited as the
    main reasons for not deriving benefit from IoT. Looking ahead, everything is headed
    toward cognitive innovation. DL can be utilized to synergize data from both structured
    data sources and natural language, and that''s what industries want it to do.
    AI technologies like machine learning and deep learning will have a dramatic impact
    on the cybersecurity market in the next five years, as shown in [`Figure 5.1`](#ch05.xhtml#fig5_1).


    ![Figure 5.1 AI technologies on cybersecurity market in the next five years (1.
    28% represent every cybersecurity solution will have some aspect to AI; 2. 31%
    represent a small part (less than 50%); 3. 39% to 50% of all cybersecurity offerings
    will use some aspect of AI; 4. others.).](images/fig5_1.jpg)

