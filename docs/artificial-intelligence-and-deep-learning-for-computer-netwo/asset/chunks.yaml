    ## [2.8 Conclusion and Future Work](#ch02.xhtml#c_sec2_8)


    In this paper, we propose a machine learning–based approach to detect beacon forgeries.
    In particular, we develop a dataset by performing attacks using kali linux and
    pre-process it by using tshark. The resulting dataset is studied using SVM, k-NN,
    random forest, MLP, and CNN to classify the beacon forgery, detection, and de-authentication
    attacks. Our approach classifies various attacks with a maximum accuracy of 92.00%.
    We propose to extend our work by proposing a hybrid model to incorporate a signature-based
    approach along with machine learning to classify the attacks in real-time conditions.


