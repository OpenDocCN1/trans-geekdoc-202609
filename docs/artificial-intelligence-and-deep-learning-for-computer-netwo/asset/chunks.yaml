    为了更清晰地向读者展示 DCT 系数选择过程，示例如 图 6.4 所示，该图展示了一个 32 × 32 图像块，由十六个 8 × 8 DCT 块组成。在 图
    6.4 中可以注意到，第二个系数在不同的 DCT 块上依次取值 `2.185*e*^(−16)`、`8.283*e*^(−16)` 等。第二个系数在 `(4,1)`-th
    DCT 块处取得其最高值 `9.409*e*^(−16)`。因此，`(4,1)`-th DCT 块及其前三个和后三个相邻 DCT 块：`(3,2)`、`(3,3)`、`(3,4)`、`(4,1)`、`(4,2)`、`(4,3)`、`(4,4)`，被用于给定图像块的第二个
    DCT 系数。对应于给定图像块第二个 DCT 系数的最终 DCT 系数向量为：`[`2.1852*e*^(−16)`, `2.185*e*^(−16)`,
    `2.185*e*^(−16)`, `9.409*e*^(−16)`, `4.968*e*^(−16)`, `4.9688*e*^(−16)`, `4.992*e*^(−16)`]`。同样，从其余
    18 个系数中提取了 18 个七维 DCT 系数向量。因此，每个 `32 × 32` 图像块生成一个 `19 × 7` DCT 系数向量，该向量将输入到下文描述的
    CNN 模型中。


    ![Figure 6.4 An example of DCT coefficient selection (second coefficient shown)
    \[32\].](images/fig6_4.jpg)


    图 6.4 DCT 系数选择示例（显示第二个系数） \[32\]。


    ### 6.3.2 CNN 架构


    在本章中，我们介绍了一个 2D 卷积神经网络架构 \[32\]，由两个卷积层、两个池化层和一个全连接层组成，如 图 6.5 所示，用于 JPEG 双重压缩检测。在每个卷积层中，使用
    100 个滤波器，滤波器（内核）大小为 `3 × 1`，`stride` = `one`。第一个卷积层 `Conv-1` 的输入是 `19 × 7` DCT
    系数，如 第 6.3.1 节 中所述。第一个卷积层之后，得到的输出维度为 `131 × 1 × 100`，该输出将输入到下一个池化层。这里，100 表示卷积操作后生成的
    100 个特征图。


    ![Figure 6.5 Convolution neural network (CNN) architecture \[32\].](images/fig6_5.jpg)


    图 6.5 卷积神经网络（CNN）架构 \[32\]。


    每个池化层也使用 100 个滤波器，滤波器大小为 `3 × 1`，stride = `2`。池化层减少特征维度，从而减少过拟合问题。因此，stride 的大小决定了特征维度最小化的程度。`Pool-1`
    的输出是一个 `65 × 1` 维特征向量，这些向量将输入到 `Conv-2`。`Conv-2` 的输出作为 `Pool-2` 的输入，其维度为 `63 ×
    1`。`Pool-2` 层的输出是一个 `31 × 1` 维特征向量，该向量将输入到全连接层。


    最终层是一个全连接卷积层，由 dense 和 logits (`Softmax`) 层组成。dense 层使用 1,000 个神经元和修正线性单元 (`ReLUs`)
    \[41\] 在每个层中使用激活函数。为了克服 CNN 模型的过拟合问题，`dropout` 正则化应用于 dense 层。logits 层执行分类，从而产生每个单独块是单次压缩还是双次压缩的概率。


    这里，`Softmax cross-entropy` 执行二元分类（单次和双次压缩）。这个 CNN 模型使用 0.001 的学习率和 `stochastic
    gradient descent` 优化器来优化训练期间的损失。


    ## 6.4 定位双重 JPEG 压缩伪造区域


    JPEG 图像中篡改区域的定位是在框架的测试阶段完成的。在后续部分中，我们将介绍双重 JPEG 压缩伪造区域的定位技术及其实验结果。


    ### 6.4.1 JPEG 双重压缩区域定位


    在测试步骤中，图像被分为大小为 `32 × 32`、stride = `8` 像素的重叠块。为每个块提取 DCT 系数（如 第 6.3.1 节 中所述），这些系数被用于训练
    CNN 模型来测试该块。通过这种方式，每个 `32 × 32` 图像块被分类为单次压缩（标记为 `‘0’`）或双次压缩（标记为 `‘1’`）。这里的 JPEG
    伪造定位单位是 `8 × 8` 像素，原因将在下文解释。stride 的移动有助于尽可能准确地定位图像中的篡改区域。如 图 6.6(a) 所示，首先测试大小为
    `32 × 32` 的第一个图像块，然后如 图 6.6(b) 所示，向右移动 stride（= `8`）像素，测试下一个第二个大小为 `32 × 32` 的块。在此阶段，第一个块的先前预测仅保留在最左侧的
    `32 × 8` 像素上。剩余的 `32 × 24` 像素被重新测试并分配一个新的类标签，与块 2 相同，因为它们构成第二个 `32 × 32` 块的一部分。同样，在完成一次行遍历后，stride
    垂直移动 `8` 像素，如 图 6.6(c) 所示。因此，一旦水平和垂直方向各完成一次 `8` 像素的 stride 移动，我们只剩下旧块 1 的预测，仅限于左上角的
    `8 × 8` 像素。这从 图 6.6(d) 中可以明显看出。这种技术有助于获得 `8 × 8` 图像块的小单元，用于伪造定位。


    ![Figure 6.6 Stride movement demonstration for forgery localization in test images:
    (a) Represents top-leftmost 32 × 32 image block, (b) horizontal stride movement
    of 8 pixels to the next 32 × 32 image block, (c) vertical stride movement of 8
    pixels to the next 32 × 32 image block, (d) top-leftmost 8 × 8 unit of forgery
    localization (mark in cyan color).](img/fig6_6.jpg)


    图 6.6 测试图像中伪造定位的 stride 移动演示：(a) 表示左上角最外侧的 32 × 32 图像块，(b) 水平移动 8 像素 stride 到下一个
    32 × 32 图像块，(c) 垂直移动 8 像素 stride 到下一个 32 × 32 图像块，(d) 伪造定位的左上角最外侧 8 × 8 单元（标记为青色）。


    以类似的方式，每个（重叠的）`32 × 32` JPEG 块被依次测试，并使用训练好的 CNN 分配其类标签，然后移动到下一个图像块。对于最后的边缘块，如果需要，会进行图像填充，填充足够数量的
    `zero` 行和列，以维持 `32 × 32` 的图像块大小。这个过程有助于定位 JPEG 伪造，并且相当准确。


    ### 6.4.2 JPEG 双重压缩定位的实验结果


    在本节中，我们介绍了图像中 JPEG 双重压缩定位的实验结果。为了进行实验，我们从 UCID 数据集 \[42\] 中选择了 500 张未压缩的 TIFF
    图像。在 500 张图像中，我们选择 480 张图像用于训练深度学习模型，其余 20 张图像用于测试。


    对于训练，我们首先将 TIFF 图像以 JPEG 质量因子 `QF[1]` = `55`、`65`、`75`、`85` 和 `95` 进行压缩，以创建单次压缩数据集，记为
    `S[SC]`。接下来，`S[SC]` 中的单次压缩图像再次以 JPEG 质量因子 `QF[2]` = `55`、`65`、`75`、`85` 和 `95`
    进行重新压缩，以创建双重 JPEG 压缩数据集，记为 `S[DC]`。在训练阶段，所有单次和双次压缩图像都被分为大小为 `32 × 32` 的非重叠块，如
    第 6.3.1 节 中所述。


