  trans: '


    Popescu 等人 \[35\] 研究并利用了 JPEG 图像 DCT 系数直方图的频率分布，用于基于双重压缩的 JPEG 伪造检测。由于双重压缩，引入了
    DCT 量化伪影，这影响了 DCT 系数直方图的分布。这些伪影已在 \[24\] 中被利用，用于基于双重压缩的 JPEG 伪造检测。在 \[34\] 中，Fu
    等人分析了 JPEG 图像中每个 8 × 8 DCT 块的首位有效数字（即 1、2、3、…、9）的统计分布，并提出了一种基于对数的广义本福德定律，该定律有助于检测图像中的
    JPEG 双重压缩。每个 DCT 块的首位有效数字的概率分布遵循广义本福德定律，适用于单次压缩的图像，而双重压缩的图像则偏离该定律。Amerini 等人 \[36\]
    还利用了 JPEG 图像 DCT 系数块的首位数字特征，用于检测单次和双重压缩 JPEG 图像上的拼接攻击。每个 DCT 块的首位数字直方图的分布被视为特征向量，并输入到支持向量机（SVM）分类器中，以区分单次和双重压缩的图像。


    在 \[26\] 中，Wang 等人利用了 JPEG 图像中每个 DCT 块的后验概率分布，用于检测和定位被篡改和未被篡改的图像区域。然而，当对图像执行任何后处理攻击时，被篡改区域的定位会受到影响。Bianchi
    等人 \[37\] 分析了非对齐双重压缩在 JPEG 重压缩检测中的影响，并提出了一种利用 JPEG 图像中 DCT 系数的整数周期性来检测非对齐双重压缩的方法。他们提出的方法还能够估计初级（第一次）压缩的量化步长，以及估计的网格偏移。


    近年来，深度学习技术也开始在基于 JPEG 重压缩的图像伪造检测中获得巨大的流行度 \[30,38,39,40》，因为此类网络具有自发的特征学习能力，有助于最大化分类精度。下面介绍了在这方面的一些著名研究工作
    \[30,38,39,40\]。


    在 \[40\] 中，Wang 等人提出了一种基于 CNN 的取证框架，用于双重压缩 JPEG 伪造检测。首先从单次和双重压缩的图像中提取 DCT 特征，然后将其输入
    CNN 以检测双重压缩的图像。然而，当第二次压缩因子高于第一次（即 `Q2 > Q1`）时，他们提出的框架才能高效运行。Rao 和 Ni \[15\] 使用高通滤波器初始化第一个
    CNN 层的权重，这些滤波器抑制了图像内容，并有助于高效检测 JPEG 图像中的拼接攻击以及区域复制攻击。


    Barni 等人 \[30\] 使用 CNN 解决了 JPEG 图像中对齐和非对齐伪造检测的问题。他们提出了三种方法：(i) 像素域中的 CNN – 通常在
    CNN 训练前进行图像均值减法，(ii) 噪声域中的 CNN – 去噪的 JPEG 图像直接输入 CNN，(iii) 嵌入 DCT 直方图的 CNN – DCT
    直方图由 CNN 层计算，而不是从 JPEG 比特流中提取，即使双重 JPEG 图像存储为位图或 PNG 格式，该方法仍然有效。因此，第三种提出的方法依赖于一个
    CNN，该 CNN 从 DCT 系数中自动提取一阶特征。此外，第三种方法的精度优于其他两种方法，并且在第二个质量因子大于第一个时能高效运行。


    在 \[38\] 中，Amerini 等人提出了多域方法，即结合空间域和频率域 CNN 模型，用于检测 JPEG 图像中的双重压缩。Park 等人 \[39\]
    提出了一种深度卷积神经网络，用于混合 JPEG 质量因子图像中的 JPEG 双重压缩。他们将 DCT 直方图和 JPEG 量化表作为输入到 CNN 中，从而从真实图像中识别出伪造图像。然而，当图像的像素值饱和且仅存在低频时，该方法会失效。此外，当两个连续的
    JPEG 压缩质量因子之间的差异较小时，该方法也会失效。


    ## 6.3 基于深度学习的 JPEG 双重压缩检测取证框架


    在本节中，我们介绍了一个深度学习框架 \[32》，该框架由预处理和卷积神经网络（CNN）组成，用于检测双重压缩的图像。如果将原始图像输入传统的 CNN，它将学习图像的视觉感知，而不是
    JPEG 压缩的程度。为了学习 JPEG 压缩图像的固有特性，对 JPEG 图像执行预处理步骤。


    ### 6.3.1 JPEG DCT 系数提取与选择


    在预处理步骤中，图像被分为 `B × B`（`B` = 32）个重叠块，步幅为 `S` = 8 像素。因此，对于大小为 `M × N` 的图像，将获得总共
    $\\left( {\\left\\lbrack \\frac{M - B}{S} \\right\\rbrack + 1} \\right) \\times
    \\left( {\\left\\lbrack \\frac{N - B}{S} \\right\\rbrack + 1} \\right)$ 个大小为 32
    × 32 像素的块。然而，每个 32 × 32 块由十六个 8 × 8 DCT 块组成。每个 DCT 块有 8 × 8 = 64 个 DCT 系数；第一个系数称为直流系数，其余为交流系数。在
    64 个系数中，这里只考虑前 19 个交流系数（之字形顺序中的第 2 到第 20 个系数），以降低计算成本。此外，每个 32 × 32 图像块中有 16 个
    DCT 块可用。因此，此时总工作 DCT 系数为 19 × 16 = 304。为了进一步降低计算成本，而不是选择所有 16 个块，只考虑以下 7 个 DCT
    块。


    对于第 `i` 个系数，我们找到它相对于其余 15 个块取得最高值的块。考虑这个最大块及其六个邻居：从位置上看，考虑其三个直接前驱块和三个直接后继块用于特征提取。例如，如果第
    13 个 DCT 块包含第 `i` 个系数的最高值，那么索引为 \[9,10,11,12,14,33,34\] 的 DCT 块也会被考虑。这为每个 32 ×
    32 图像块生成一个 19 × 7 维的 DCT 系数向量。这种抽象旨在降低计算复杂度，而不会丢失任何重要的块信息。


    '
