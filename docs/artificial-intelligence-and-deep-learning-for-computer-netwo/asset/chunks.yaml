    在 \[9\] 中，不同的 HTTPS 封装服务是通过流量指纹识别来检测的。数据在使用这些服务时被提取，然后使用训练好的模型来检测这些服务的未见实例。本文旨在识别能够指示特定
    Web 服务（例如 Google Maps、Google Drive 或 Dropbox 应用程序）使用情况的模式，而不是底层协议本身的行为。这使得模型设计与协议无关，分类标签可以任意大，具体取决于旨在检测的服务数量。这也使得泛化更容易。


    在 \[10\] 中，问题与本章的主要问题类似：加密 HTTP 流的二进制分类。然而，他们旨在进行 HTTP/1 和 HTTP/2 流之间更具体的分类。他们使用随机森林、决策树、朴素贝叶斯树和贝叶斯网络，其中随机森林在所有指标上表现最佳。\[11\]
    专注于 DNS 并讨论其几个特征和可能的威胁。该论文展示了深度神经网络检测隐蔽通道的有效性。Bushart et al. \[12\] 和 Siby et
    al. \[13\] 试图对 Alexa 顶级网站列表上的加密流量进行指纹识别。这些使用消息突发和间隔的序列作为特征向量的一部分，这与拟议工作中用于为输入向量获取特征的原理相似。Bushart
    et al. \[12\] 还试图专门识别 DoH 流量。这有一个局限性，即使用流行服务的已知 IP 地址来分类 DoH 流量，由于只关注这一特征，可能会导致显著的过拟合。他们得出的简单结论是使用不同的端口或提供商，这并不能让我们深入了解流量模式本身。


    Krizhevsky et al. \[7\] 引入了第一个深度卷积网络，这构成了我们工作的基础。本章从序列建模领域的发展中汲取灵感来涵盖我们的问题 \[14》，以及时间序列分析研究以发展可信的假设
    \[15,16\]，这被用于开发 DoH 分析的新算法。我们的拟议工作探讨了特征选择方面的工作 \[17,18,19\] 以及多维数据分析 \[20\] 以优化我们的方法并创建特征工程模块，并寻找可扩展的解决方案
    \[21\]。我们的工作特别受到 \[22,23\] 的启发来处理这个特征。


    ## 1.3 实现（不同模型及全部）


    ### 1.3.1 数据集


    #### 1.3.1.1 DoH 与非 DoH 数据集


    该数据集如 表 1.1 所示，共有 35 个特征，其中 28 个列于下方。这 28 个特征代表时间和长度之间的统计信息，其余的是地址和端口等标识信息。这些特征是通过用
    Python 编写的脚本从原始捕获中提取的，该脚本使用 Scapy 读取 pcap 文件并处理它们以提取特征。这些是直觉上最好的特征，因为 DoH 请求通常比非
    DoH 的 Web 流量更小，并且请求持续的时间也更短。这些特征可以借助 Wireshark 等软件进行验证。


    表 1.1 数据集参数


    | 参数 | 特征 |

    | --- | --- |

    | F1 | 发送的流字节数 |

    | F2 | 发送的流字节速率 |

    | F3 | 接收的流字节数 |

    | F4 | 接收的流字节速率 |

    | F5 | 平均数据包长度 |

    | F6 | 中位数数据包长度 |

    | F7 | 众数数据包长度 |

    | F8 | 数据包长度方差 |

    | F9 | 数据包长度标准差 |

    | F10 | 数据包长度变异系数 |

    | F11 | 相对于中位数数据包长度的偏度 |

    | F12 | 相对于众数数据包长度的偏度 |

    | F13 | 平均数据包时间 |

    | F14 | 中位数数据包时间 |

    | F15 | 众数数据包时间 |

    | F16 | 数据包时间方差 |

    | F17 | 数据包时间标准差 |

    | F18 | 数据包时间变异系数 |

    | F19 | 相对于中位数数据包时间的偏度 |

    | F20 | 相对于众数数据包时间的偏度 |

    | F21 | 平均请求/响应时间差 |

    | F22 | 中位数请求/响应时间差 |

    | F23 | 众数请求/响应时间差 |

    | F24 | 请求/响应时间差方差 |

    | F25 | 请求/响应时间差标准差 |

    | F26 | 请求/响应时间差变异系数 |

    | F27 | 相对于请求/响应时间差的偏度 |


    #### 1.3.1.2 恶意与非恶意 DoH


    该数据集与前一个数据集结构相同，仅恶意和非恶意 DoH 的标签值有所不同。该数据集来自一项引用研究 \[4\]，该研究使用名为 DoH Data Collector
    的工具来模拟不同的 DoH 隧道场景并捕获构成的 HTTPS 流量。在每次模拟中，网络上会建立一个具有特定于场景的不同参数的 DoH 隧道。


    ### 1.3.2 特征工程


    本文建议使用额外树分类器（ETC）从数据集中提取重要特征。ETC 实现多个决策树。该算法由大量决策树组成，最终决策是通过考虑每棵树的预测来得出的。在拟议工作中，每棵树的大多数投票被用作分类输出。选择
    ETC 而不是 RF 的原因是，由于其随机分割属性以及能够获得与 RF 相同的准确性，因此速度快得多。该模块接受输入（数据集或实时数据），仅将模型传播到必要的特征中。该模块针对两种不同类型的输入以两种不同的方式工作。对于实时输入，特征工程模块仅提取重要特征，所选特征是模型通过数据集学习到的。ETC
    相对于数据集的功能是创建一个准确的特征重要性分割，该分割能够在保持方差和尽可能多的信息的同时，创建缩减数据的准确表示。


    ### 1.3.3 分类模型


    #### 1.3.3.1 Keras 序列模型


    第一层是输入层，它接收模型需要训练/测试的输入数据集。随后是一组 Conv1D、BatchNorm 和 ReLU 层。图 1.1 中提到的各层功能如下：


    ![图 1.1 模型架构。](img/fig1_1.jpg)


    图 1.1 模型架构。


    Conv1D：它是一个一维卷积层，按顺序获取数据，并在进行卷积操作后生成输出张量，如图所示。


    这个卷积输入从我们的数据中提取特征，并将其通过卷积层来创建密集的潜在表示，由 图 1.1 中的展平模块表示。然后将这个展平图带到模型末端的全连接层中进行分类。


