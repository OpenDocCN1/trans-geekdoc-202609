- raw: 'Packet scheduling is an important aspect of quality of service (QoS) requirements
    in 5G LTE–based wireless IIoT networks. Two specific characteristics of wireless
    scheduling are (i) wireless channel is unreliable, error-prone, and time-varying
    system. Burst errors can occur in wireless networks, which lead to the unsuccessful
    transmission of packets, and (ii) due to frequent changes of signal strength,
    wireless channels switch rapidly from high signal state to low signal and vice
    versa, which is more prevalent in IoT systems because of the presence of a large
    number of communication devices. By considering the LTE architecture and the specifications
    of NB-IoT, the challenges in scheduling delay-sensitive traffic over NB-IoT are
    (i) maintaining the required level of QoS and the system performance in a LTE
    environment due to limited radio resources, unreliable radio propagation channel,
    and high user demands, and (ii) the narrow bandwidth (180 KHz) and the low data
    rate (pick date rate is ∼ 250 kbps) specified by NB-IoT \[[2](#ch04.xhtml#ref4_2)\],
    which lead to the difficulties of maintaining a low delay of the transmitted traffic.
    Therefore, it is crucial to develop an adaptive scheduling mechanism in NB-IoT
    architecture, such that the overall time of traffic transmission can experience
    a lower delay with an explicit prioritization of delay-sensitive traffic data.
    The objective of this paper is to design an adaptive and dynamic scheduling scheme
    for transmission of priority-based applications over NB-IoT platform, by reducing
    scheduling delay and maintaining end-to-end QoS for prioritized data.


    ### [4.1.2 Contribution of This Work](#ch04.xhtml#c_sec4_001_002)


    In this paper, we have designed an intelligent packet scheduling mechanism in
    NB-IoT; and this mechanism schedules packets of prioritized traffic in NB-IoT,
    such that the delay of transmitted packets can be minimized. To the best of our
    knowledge, the addressing of this kind of scheduling of traffic is the first over
    a NB-IoT paradigm. The proposed scheme, *narrowband-prioritized traffic scheduling
    (NB-PTS)*, is a medium access control (MAC) layer mechanism that schedules packets
    (stored in transmit queue) by considering their priorities. In our implementation
    of NB-PTS, we have used a *QoS class identifier (QCI)* \[[3](#ch04.xhtml#ref4_3)\],
    which is a mechanism applied in 3GPP LTE networks to classify network traffic
    and provide QoS in networks. By utilizing these priorities, NB-PTS schedules the
    traffic such that the traffic having a higher priority would get a higher chance
    for scheduling, which results in a lower delay in overall transmission. We have
    implemented NB-PTS in a NB-IoT–compatible module of network simulator (NS) version
    3 i.e., NS-3-dev-NB-IOT and the simulation analysis of NB-PTS shows that it can
    significantly improve the network performance in NB-IoT.


    ### [4.1.3 Organization of the Paper](#ch04.xhtml#c_sec4_001_003)


    The rest of the paper is organized as follows: [Section 4.2](#ch04.xhtml#sec4_2)
    discusses the related works. Details of the system model are presented in [Section
    4.3](#ch04.xhtml#sec4_3). [Section 4.4](#ch04.xhtml#sec4_4) discusses the implementation
    details of NB-PTS and analyzes the simulation results. Finally, we conclude the
    paper in [Section 4.5](#ch04.xhtml#sec4_5).


    ## [4.2 Related Works](#ch04.xhtml#c_sec4_2)'
