    of Priority-2 traffic.](#ch04.xhtml#Ffig4_4)


    ![Figure 4.5 (a) Average throughput of Priority-3 traffic; (b) overall average
    throughput.](images/fig4_5.jpg)


    [Figure 4.5 (a) Average throughput of Priority-3 traffic; (b) overall average
