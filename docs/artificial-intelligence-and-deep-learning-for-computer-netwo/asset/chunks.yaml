    ## 6.3 Deep Learning–Based Forensic Framework for JPEG Double-Compression Detection


    In this section, we present a deep learning framework \[[32](#ch06.xhtml#ref6_32)\]
    that consists of pre-processing and a convolutional neural network (CNN) to detect
    double-compressed images. If we fed raw images into a traditional CNN, it would
    learn visual perception of the images, instead of the degree of JPEG compression.
    To learn the intrinsic properties of JPEG compression images, a pre-processing
    step is performed on JPEG images.


    ### 6.3.1 JPEG DCT Coefficients Extraction and Selection


    In the pre-processing step, the images are divided into `B × B` (`B` = 32) overlapping
