    Authors in \[[4](#ch04.xhtml#ref4_4),[5](#ch04.xhtml#ref4_5)\] discuss the challenges
    along with the research directions in Industrial IoT, related to real-time performance,
    energy efficiency, privacy and security, interoperability, and coexistence with
    the existing IoT standards. By considering arbitrary scenarios, the performance
    of positioning in a NB-IoT paradigm is highlighted in \[[6](#ch04.xhtml#ref4_6)\],
    which provides different factors such as network coverage, device locations, etc.
    Yu et al. \[[7](#ch04.xhtml#ref4_7)\] focus only on the uplink scheduling scheme
    for NB-IoT systems, along with an uplink link adaptation mechanism. Without focusing
    on individual communications, the work \[[8](#ch04.xhtml#ref4_8)\] finds an extension
    in a NB-IoT framework to incorporate a channel for group communications. Authors
    in \[[9](#ch04.xhtml#ref4_9)\] design a resource allocation technique for NB-IoT
    by focusing only on formulating a problem based on rate maximization. In \[[10](#ch04.xhtml#ref4_10)\],
    the approach of small data transmission in NB-IoT does not focus on delay of the
    transmission and priority of traffic. The work \[[11](#ch04.xhtml#ref4_11)\] addresses
    the primary challenge of providing connectivity to a large number of machine-type
    communication (MTC) devices in LTE networks, and proposes an uplink multiple access
    mechanism for NB-IoT architecture. Authors in \[[12](#ch04.xhtml#ref4_12)\] address
    the repetition of signal transmissions by the end devices at low power scenarios,
    and find the impact of time regarding channel coherence on uplink coverage. In
    \[[13](#ch04.xhtml#ref4_13)\], narrowband physical downlink control channel (NPDCCH)
    physical layer procedures are explained with the decoding of search space, and
    based on uplink reference signals, a resource mapping scheme is proposed for NPDCCH.
    In this work, the proposed schedulers only work for the search space allotment
    in NPDCCH. The work \[[14](#ch04.xhtml#ref4_14)\] proposes a suboptimal algorithm
    for allocating transmission power and radio resources to NB-IoT devices during
    uplink transmission. Here, the authors focus on the approach of resource allocation
    by analyzing the trade-off among rate, latency, and power. An uplink scheduler
    is designed for a NB-IoT framework in \[[15](#ch04.xhtml#ref4_15)\] where the
    proposed scheduler is a basic threshold-based user equipment (UE)-specific approach
    and it is mainly suitable for UEs having homogeneous traffic. Although latency-energy
    trade-off in NB-IoT is discussed through a queuing model in \[[16](#ch04.xhtml#ref4_16)\],
    no new scheduling mechanism is designed for NB-IoT in this work. Authors in \[[17](#ch04.xhtml#ref4_17)\]
    present a description of the primary features of NB-IoT and the discussion of
    data transmission over NB-IoT architecture. The work \[[18](#ch04.xhtml#ref4_18)\]
    deals with the adaptation of narrowband physical downlink shared channel (NPDSCH)
    period along with downlink scheduling in NB-IoT networks. However, the objective
    of this work is to enhance the utilization of the radio resources for NB-IoT networks
    by minimizing the radio resource that is consumed to receive data during downlink
    transmission. In \[[19](#ch04.xhtml#ref4_19)\], a model of random access traffic
    is constructed for arrival and service processes in NB-IoT, where the focus is
    to derive random latency bounds in arrival processes by analyzing the network
    delay. A heuristic algorithm, NIS, is proposed in \[[20](#ch04.xhtml#ref4_20)\],
    which concentrates only on downlink scheduling in NB-IoT. Here, the objective
    is to use radio resources of NB-IoT efficiently, in order to establish massive
    connections in an IoT paradigm. Therefore, packet scheduling based on priority
    and delay sensitivity is not addressed in \[[20](#ch04.xhtml#ref4_20)\]. The work
    by Lei et al. \[[21](#ch04.xhtml#ref4_21)\] presents a joint multi-user scheduling
    and semi-distributed computation offloading mechanism in NB-IoT–based edge computing
    system. Azari et al. \[[22](#ch04.xhtml#ref4_22)\] design a tractable analytical
    framework to analyze the effect of the scheduling of control or data channels
    and the coexistence of different coverage classes on latency and energy consumption
    of NB-IoT devices. Although a scheduling-based solution is found in \[[22](#ch04.xhtml#ref4_22)\]
    for recompensing the performance loss due to an extreme coverage in the NB-IoT
    network, the proposed adaptation of scheduling channels in uplink or downlink
    directions does not address the prioritized traffic scheduling in NB-IoT. However,
    to the best of our knowledge, no existing works have explored delay-sensitive
    communication over NB-IoT as of now, and therefore, our proposed approach gives
    a new direction to support scheduling of prioritized traffic over NB-IoT while
    considering its design limitations.


    ## 4.3 NB-PTS: System Model and Design Details


    NB-PTS handles the transmit queue and schedules traffic, such that the delay of
    transmitted packets can be minimized. NB-PTS is executed at the MAC layer of the
    NB-IoT protocol stack in `evolved node B (eNB)` and NB-PTS performs both uplink
    and downlink scheduling. For supporting prioritized traffic delivery, we have
    considered QCI \[[3](#ch04.xhtml#ref4_3)\], which is a mechanism in 3GPP LTE networks
    to classify and indicate a scheduling priority value for a traffic bearer. By
    following QCI, the type of prioritization of the traffic has been used to impose
    an importance on a packet in NB-PTS, such that this mechanism can schedule packets
    (stored in `transmit queue`) based on the importance of the packets. In this way,
    the traffic with a higher priority would get a higher chance for scheduling and
    thus, can achieve a lower delay in overall transmission. We have modeled the transmit
    queueing system in discrete-time by using a `queueing model`, which is discussed
    next. Based on this queuing model, we define a metric (discussed in [Section 4.3.4](#ch04.xhtml#sec4_003_004))
    that is used for prioritized traffic scheduling in NB-PTS.


    Basically, we have used QCI to assign priority of traffic in our implementation
    of NB-PTS. However, the working principle of NB-PTS leads to the direction of
    applying any prioritization approach for traffic delivery over NB-IoT networks.
    Some examples of QCI definitions are shown in [Table 4.1](#ch04.xhtml#table4_1).


    ### Table 4.1 Examples of QCI Values Defined by 3GPP LTE


    | QCI | Resource Type | Priority | Packet Delay Budget | Example Services |

    | --- | --- | --- | --- | --- |

    | QCI-2 | GBR | 4 | 150 ms | Conversational video (live streaming) |

    | QCI-3 | GBR | 3 | 50 ms | Real-time gaming, V2X messages |

    | QCI-4 | GBR | 5 | 300 ms | Non-conversational video (buffered streaming) |

    | QCI-6 | non-GBR | 6 | 300 ms | Video (buffered streaming) |

    | QCI-8 | non-GBR | 8 | 300 ms | TCP-based applications (like www, email, ftp,
    chat, the like etc.) |


    ### 4.3.1 Queueing Model Description


    The broad idea of the proposed approach is to schedule packets dynamically in
    the MAC queue, based on the priority values of the traffic associated with the
    packets. However, considering the resource limitations of NB-IoT architecture,
    the queue evolution needs to be controlled dynamically based on the communication
    environment. Therefore, NB-PTS first estimates the queue states and applies an
    online learning strategy to estimate the threshold (called the queue threshold)
    beyond which QoS cannot be provided to the delay-sensitive applications. Then
    it schedules the packets at the MAC layer so that the overall delay for the prioritized
    packets is minimized.

