    ## 4.1 引言


    尽管大量研究和商业机构提出了各种智慧城市和智慧基础设施管理解决方案，但支持这些应用程序的首要要求是在多种平台上部署数百万个传感器。因此，支持在物联网 (IoT)
    上融合感知、通信和计算是当务之急，而基于 4G 和 5G 通信技术的现有蜂窝网络可以直接支持这种融合。窄带物联网 (NB-IoT) \[1,2\] 支持基于长期演进
    (LTE) 和 LTE 高级 (LTE-A) 技术构建的现有蜂窝平台上的大量低吞吐量 IoT 设备。因此，它可以在广域智慧城市应用的部署中发挥重要作用。


    从技术角度来看，NB-IoT 在 180 kHz 的低频信道带宽上运行，以提供超过 160 dB 的覆盖范围，并保持约 10 秒的延迟容忍度 \[2\]。凭借这些规格，NB-IoT
    主要面向延迟容忍型 IoT 设备或信号强度较差区域的设备。LTE 运营商可以通过向 NB-IoT 分配 180 kHz 的物理资源块 (`PRB`) 来在
    LTE 载波信号内部部署 NB-IoT 标准。尽管该技术在工业自动化和控制方面具有多种优势，例如成本效益高的大规模部署支持、现有 LTE 网络上的即插即用、由于超低功耗通信而具有长电池寿命、比
    LoRA 和 SigFox 更好的结构穿透性和更高的数据速率，但它不支持延迟敏感型应用，这使得它不适合那些严格延迟保证的实时数据传输是主要要求的工业应用。


    ### 4.1.1 NB-IoT 上延迟敏感流量调度中的挑战


