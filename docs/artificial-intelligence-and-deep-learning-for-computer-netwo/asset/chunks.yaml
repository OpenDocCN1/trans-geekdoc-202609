- raw: "![Figure 2.1 Creating a fake beacon using kali linux.](images/fig2_1.jpg)\n\
    \n[Figure 2.1 Creating a fake beacon using kali linux.](#ch02.xhtml#Ffig2_1)\n\
    \n![Figure 2.2 Rate of flow of network frames during beacon forgery attack.](images/fig2_2.jpg)\n\
    \n[Figure 2.2 Rate of flow of network frames during beacon forgery attack.](#ch02.xhtml#Ffig2_2)\n\
    \n[Figure 2.2](#ch02.xhtml#fig2_2) shows the beacon flow through the network during\
    \ the attack at both the victim and access point. We observe a rise in the beacon\
    \ frames arriving from the same access point during the beacon flooding. From\
    \ this, we infer that spoofing of beacon frames was successful.\n\n### [2.5.2\
    \ Beacon Flooding](#ch02.xhtml#c_sec2_005_002)\n\nBeacon flooding prevents the\
    \ victim from selecting the correct access point. We simulate the attack by flooding\
    \ the victim with fake access point beacons having the same ssid. The flooding\
    \ attack was simulated using the SCAPY library in Python. A screenshot of the\
    \ beacon flooding attack simulated using kali linux and the graph of the received\
    \ beacons with specific ssid are given in [Figures 2.3](#ch02.xhtml#fig2_3) and\
    \ [2.4](#ch02.xhtml#fig2_4), respectively.\n\n![Figure 2.3 Beacons flooding using\
    \ kali linux.](images/fig2_3.jpg)\n\n[Figure 2.3 Beacons flooding using kali linux.](#ch02.xhtml#Ffig2_3)\n\
    \n![Figure 2.4 Rate of flow of network frames during beacon flooding attack.](images/fig2_4.jpg)\n\
    \n[Figure 2.4 Rate of flow of network frames during beacon flooding attack.](#ch02.xhtml#Ffig2_4)\n\
    \n[Figure 2.4](#ch02.xhtml#fig2_4) shows an increase in beacon frames during the\
    \ beacon flooding attack, but unlike the forgery attack, these beacons have the\
    \ same ssid but different bssid. A high beacon flow rate indicates that the flooding\
    \ attack was performed successfully, as shown in [Figure 2.2](#ch02.xhtml#fig2_2).\
    \ A beacon flooding attack is easier to detect as victims are flooded with a large\
    \ number of frames.\n\n### [2.5.3 De-authentication Attack](#ch02.xhtml#c_sec2_005_003)\n\
    \nDe-authentication frames are used in the WiFi 802.11 protocol by the clients/access\
    \ points to terminate the connection as they do not require packet acknowledgement.\
    \ The attacker uses these frames to disconnect a legitimate user and prevent them\
    \ from connecting to legitimate access points. They can also be used to consume\
    \ the resources of access points, thereby making them unable to transmit beacons\
    \ at regular intervals. These kinds of attacks can be used in beacon flooding,\
    \ MitM (man-in-the-middle attack). A snapshot of the de-authentication attack\
    \ simulated using kali linux and the graph of de-authentication frame traffic\
    \ are given in [Figure 2.5](#ch02.xhtml#fig2_5) and [2.6](#ch02.xhtml#fig2_6),\
    \ respectively.\n\n![Figure 2.5 De-authentication attack using kali linux.](images/fig2_5.jpg)\n\
    \n[Figure 2.5 De-authentication attack using kali linux.](#ch02.xhtml#Ffig2_5)\n\
    \n![Figure 2.6 Rate of flow of de-authentication frames during de-authentication\
    \ attack.](images/fig2_6.jpg)\n\n[Figure 2.6 Rate of flow of de-authentication\
    \ frames during de-authentication attack.](#ch02.xhtml#Ffig2_6)\n\n[Figure 2.7](#ch02.xhtml#fig2_7)\
    \ shows the arrival rate of de-authentication frames in the network dur-ing an\
    \ attack. These frames are observed only when an access point de-authenticates\
    \ a station from a network. The abnormal increase in de-authentication frames\
    \ indicates the occurrence of a de-authentication attack.\n\n![Figure 2.7 Graphical\
    \ results for evaluation of balanced dataset.](images/fig2_7.jpg)\n\n[Figure 2.7\
    \ Graphical results for evaluation of balanced dataset.](#ch02.xhtml#Ffig2_7)\n\
    \n### [2.5.4 Attack Modeling](#ch02.xhtml#c_sec2_005_004)\n\nIn this subsection,\
    \ we describe the methodology of the proposed approach that involves modeling\
    \ and simulation of beacon forgeries.\n\nWe propose to simulate each of the beacon\
    \ attacks, capture the network traffic, and analyze potential risks. In particular,\
    \ packets were captured during the attack and stored in a pcap file. Data was\
    \ then extracted in a text format from the files using tshark, a screenshot of\
    \ which is shown in [Figure 2.8](#ch02.xhtml#fig2_8). Unwanted spaces were removed\
    \ from the text files. Some of the features extracted were specific to de-authentication\
    \ frames or beacon frames, as shown in [Table 2.1](#ch02.xhtml#table2_1).\n\n\
    ![Figure 2.8 Sample of the extracted data.](images/fig2_8.jpg)\n\n[Figure 2.8\
    \ Sample of the extracted data.](#ch02.xhtml#Ffig2_8)\n\n[Table 2.1 Features Extracted\
    \ From pcap Files](#ch02.xhtml#Ttable2_1)\n\n| Features Extracted || Description\
    \ |\n\n| --- | --- |\n\n| wlan.da || Destination of the frame |\n\n| --- | ---\
    \ |\n\n| wlan.fixed.timestamp || Timestamp of arrival |\n\n| wlan.bssid || bssid\
    \ of the frame (Mac address) |\n\n| frame.time || Timestamp |\n\n| wlan radio.signal\
    \ dbm || Radio signal strength |\n\n| wlan.fixed.beacon || Beacon intervel |\n\
    \n| wlan.sa || Source address of access point |\n\n| wlan.fixed.capabilities.ess\
    \ || Channel capability (extended service set) |\n\n| wlan.fixed.capabilities.ibss\
    \ || Channel capability (ibss) |\n\n| wlan.ra || Receiver address (de-authentication\
    \ frame) |\n\n| wlan.fixed.capabilities.cfpoll.ap || Channel capability (CFP participation)\
    \ |\n\n| wlan.fixed.capabilities.privacy || Channel capability (privacy) |\n\n\
    | wlan.fixed.capabilities.preamble || Channel capability (short preamble) |\n\n\
    | wlan.fixed.capabilities.pbcc || Channel capability (pbcc) |\n\n| wlan.fixed.capabilities.agility\
    \ || Channel capability (channel agility) |\n\n| wlan.fixed.capabilities.spec\
    \ man || Channel capability (spectral management) |\n\n| wlan.fixed.capabilities.short\
    \ slot time || Channel capability (short slot time) |\n\n| wlan.fixed.capabilities.radio\
    \ measurement || Channel capability (radio measurement implemented) |\n\n| wlan.fixed.capabilities.apsd\
    \ || Channel capability (apsd) |\n\n| wlan.ssid || ssid of access point (name\
    \ of access point) |\n\n| wlan.fixed.capabilities.del blk ack || Channel capability\
    \ (delayed block ACK) |\n\n| frame.time epoch || Epoch time |\n\n| frame.time\
    \ relative || Time passed from the arrival of the first frame |\n\n| wlan.sa ||\
    \ Source address (de-authentication frame) |\n\n| wlan.fixed.capabilities.imm\
    \ blk ack || Channel capability (immediate block ack-finish) |\n\n| wlan.fixed.capabilities.dsss\
    \ ofdm || Channel capability (DSSS-OFDM allowed) |\n\n| wlan.fixed.reason code\
    \ || Reason for de-authentication |\n\n#### [2.5.4.1 Feature Extraction](#ch02.xhtml#c_sec2_005_004_001)\n\
    \nOnce the data is pre-processed, frequency and time difference between two successive\
    \ frames from the same source were computed. Features thus extracted are described\
    \ as follows.\n\n1.  Frequency – Frequency is calculated using the arrival time.\
    \ The number of de- authentication frames arriving in a time span of 3 seconds\
    \ is calculated. The arrival time of the first frame is recorded and the values\
    \ are updated every 3 seconds. A higher frequency indicates a higher number of\
    \ de-authentication frames in the network, thereby resulting in a de-authentication\
    \ attack. The frequency is calculated as shown in Equation 2.7. \n\n    *F**r**e**q**u**e**n**c**y* = *N**D*/*T*\
    \ (2.7)\n\nwhere,\n\n1.  ND = Number of de-authentication frames\n\n2.  T = Time\
    \ to update\n\n2.  Time Difference – Time difference is computed based on epoch\
    \ time of the frame, as shown in Equation 2.8. This was mainly for detecting beacon\
    \ forgeries as the beacons are transmitted at a regular interval of 100 transmission\
    \ units (TUs).\n\n*T**i**m**e*\\_*D**i**f**f**e**r**e**n**c**e* = *A**T**C**F* − *A**T**P**F*\
    \ (2.8)\n\nwhere,\n\n1.  ATCF = Arrival time of the current frame from same source\n\
    \n2.  ATPF = Arrival time of previous frame from same source\n\n## [2.6 Dataset\
    \ Classification](#ch02.xhtml#c_sec2_6)"
