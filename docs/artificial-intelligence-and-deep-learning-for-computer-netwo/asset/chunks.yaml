    # Preface


    In recent years, particularly with the advent of deep learning (DL), new avenues
    have opened up to handle today''s most complex and very dynamic computer networks,
    and the large amount of data (often real time) that they generate. Artificial
    intelligence (AI) and machine learning (ML) techniques have already shown their
    effectiveness in different networks and service management problems, including,
    but not limited to, cloud, traffic management, cybersecurity, etc. There exist
    numerous research articles in this domain, but a comprehensive and self-sufficient
    book capturing the current state-of-the-art has been lacking. The book aims to
    systematically collect quality research spanning AI, ML, and deep learning (DL)
    applications to diverse sub-topics of computer networks, communications, and security,
    under a single cover. It also aspires to provide more insights on the applicability
    of the theoretical similitudes, otherwise a rarity in many such books.


    In the first chapter, application of ML to traffic management, in particular classification
    of domain name service (DNS) query packets over a secure (encrypted) connection
    is proposed. This important problem is challenging to solve because the relevant
    fields in the packet header and body that allows easy classification are not available
    in plaintext in an encrypted packet. An accurate DL model and a support vector
    machine (SVM)–based ML model is based on well-chosen features that were constructed
    to solve this problem.


    Wi-Fi access points periodically broadcast beacons for dynamic network management.
    However, these frames are typically unprotected, and thus can be exploited by
    adversaries to severely affect the security and performance of the underlying
    Wi-Fi network. In the second chapter, the authors have proposed and developed
    a methodology applying several supervised ML techniques and DL to perform real-time
    detection of authentic and forged beacons. The technique achieves high accuracy
    in detecting and classifying several beacon attacks.


    In the third chapter, the authors have proposed a reinforcement learning-based
    switch migration to handle the load imbalance among the controllers and optimize
    network configuration for a software defined network (SDN). The scope of this
    chapter is to design a framework that dynamically maps switches to controllers,
    such that the load on the controllers is balanced. The scheme exploits the concept
    of a knowledge plane to automate the switch to controller mappings. The knowledge
    plane learns about the environment, such as network traffic, and it uses reinforcement
    learning to discover the actions that will lead to an optimal load-balanced environment.


    In the fourth chapter, the authors have proposed an online learning–based adaptive
    packet scheduling of prioritized traffic aiming to reduce packet transmission
    delays. The proposed narrowband-Internet of Things (NB-PTS) approach also shows
    promising improvements based on simulation results.'
