    Figure 5.5 表示网络安全工作模型。该模型将使用开源虚拟机平台实现。该模型由 IoT 网络中服务器 1 连接至多达 N 个服务器的各种服务器组成。在模型中，每个服务器都与其他每个服务器以及用于指定可促进攻击、入侵者消息或任何有价值事物交换的计算机代码的
    IoT 设备相连。该模型连接了各种用户的 IoT 设备，用于组织和行业的所有应用。该模型为所有流程提供实时不可篡改的安全性 \[10\] 和 \[5\] (表
