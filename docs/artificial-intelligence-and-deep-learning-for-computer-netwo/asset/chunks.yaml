- raw: "The MMBP-2 model can be approximated into two independent Bernoulli processes.\
    \ Hence, by using Equation (4.5) and Little's result, the target mean delay in\
    \ slot \\[*t, t* + 1\\] can be obtained as follows:\n\n${\\\\hat{D}}\\_{t + 1}\
    \ = \\\\frac{\\\\gamma\\_{t}{\\\\lbrack{1 - L\\_{t + 1}\\\\alpha\\_{t}\\\\gamma\\\
    _{t}^{L\\_{t + 1} - 1} + \\\\left( 2L\\_{t + 1}\\\\alpha\\_{t} - \\\\left( L\\\
    _{t + 1} + 1 \\\\right) \\\\right)\\\\gamma\\_{t}^{L\\_{t + 1}} - \\\\left( L\\\
    _{t + 1}\\\\alpha\\_{t} - L\\_{t + 1} \\\\right)\\\\gamma\\_{t}^{L\\_{t + 1} +\
    \ 1}}\\\\rbrack}}{\\\\beta{(1 - \\\\gamma\\_{t})}{\\\\lbrack{1 - {(1 - \\\\gamma\\\
    _{t})}{(\\\\beta + \\\\alpha\\_{t}\\\\gamma\\_{t}^{L\\_{t + 1}})} - \\\\gamma\\\
    _{t}^{L\\_{t + 1} + 1} - \\\\left( 1 + \\\\beta \\\\right)\\\\left( 1 - \\\\gamma\\\
    _{t} \\\\right)}\\\\rbrack}}$ (4.6)\n\nwhere $\\\\gamma\\_{t} = \\\\frac{\\\\\
    alpha\\_{t}(1 - \\\\beta)}{\\\\beta(1 - \\\\alpha\\_{t})}$. For a given value\
    \ of *L*[*t*+1], and the current arrival rate *α*[*t*], we can obtain the target\
    \ mean delay *D̂*[*t* + 1] by solving 4.6.\n\nIn our description, we consider\
    \ the time window \\[*t, t* + 1\\], where the threshold *L*[*t*+1] has to be set.\
    \ The estimation of *L*[*t*+1] is discussed next.\n\n### [4.3.2 Estimation of\
    \ Queue Threshold Value](#ch04.xhtml#c_sec4_003_002)\n\nAs we mentioned earlier,\
    \ we use an online learning mechanism based on the *ϵ*\\-greedy policy to estimate\
    \ the value of *L*[*t*+1] at \\[*t, t* + 1\\], depending on the environmental\
    \ constraints of a NB-IoT–based system.\n\n#### [4.3.2.1 ϵ-greedy Policy](#ch04.xhtml#c_sec4_003_002_001)\n\
    \nIn ϵ-greedy \\[[23](#ch04.xhtml#ref4_23)\\], a parameter, ϵ, known as exploration\
    \ probability, is used to control the learning rate. At a time instant *t*, ϵ[*t*]\
    \ is calculated as ϵ[*t*] = *min*(1*, dE/t*^(*2*)). Here, *d* is a control parameter\
    \ such that *d >* 0. We consider the mean delay measured in slot \\[*t* − 1*,\
    \ t*\\], i.e., *D*[*t*] as the value of *E* to find *L*[*t*+1] in \\[*t, t*+1\\\
    ], since *D*[*t*] can influence the queue length in \\[*t, t* + 1\\]. The ϵ-greedy\
    \ policy enforcement employs two phases as follows.\n\n> **Exploration:** A value\
    \ of *L*[*t*+1] is selected randomly and the probability of this selection is\
    \ ϵ.\n\n> \n\n> **Exploitation:** The *L*[*t*+1], which has produced the lowest\
    \ average packet loss rate (PLR) in the past is chosen in this case. The probability\
    \ of exploitation is (1 − ϵ).\n\n### [4.3.3 Calculation of Target Mean Delay](#ch04.xhtml#c_sec4_003_003)\n\
    \nIn order to compute the value of *D̂*[*t* + 1] of a traffic, firstly the threshold\
    \ *L*[*t*+1] is set by applying ϵ-greedy policy. Then the current value of *α*[*t*]\
    \ is found, and *D̂*[*t* + 1] is calculated by using 4.6.\n\n### [4.3.4 Metric\
    \ for Scheduling](#ch04.xhtml#c_sec4_003_004)\n\nIn time window \\[*t, t* + 1\\\
    ], after estimating the value of *L*[*t*+1] and then computing *D̂*[*t* + 1],\
    \ we need to schedule prioritized traffic on the basis of *D̂*[*t* + 1]. For this\
    \ scheduling purpose in slot \\[*t, t* + 1\\], we define a metric for traffic\
    \ *j*, denoted by *W*[*t* + 1]^(*j*), which imposes an weight on the importance\
    \ of the traffic to be scheduled. In this case, each packet is assigned a *priority*,\
    \ which provides an importance factor for the packet to be delivered. The priority\
    \ value increases as the importance of the traffic increases. Now, we define *W*[*t* + 1]^(*j*)\
    \ as given in the following:\n\n$W\\_{t + 1}^{j} = \\\\frac{\\\\lambda\\_{t +\
    \ 1}^{j} \\\\times D\\_{t + 1}^{HOL,j}}{{\\\\hat{D}}\\_{t + 1}^{j}} \\\\times\
    \ \\\\frac{p\\_{j}}{\\\\sum\\_{i = 1}^{n}p\\_{i}}$ (4.7)\n\nIn this equation,\
    \ *p*[*j*] specifies the priority of traffic *j*. It can be noted that the value\
    \ of *W*[*t* + 1]^(*j*) increases as *p*[*j*] increases and higher values of *W*[*t* + 1]^(*j*)\
    \ provide more chances of scheduling of traffic *j*. In 4.7, *D*[*t* + 1]^(*H**O**L*, *j*)\
    \ is the current head of line (HOL) packet delay of traffic *j* and *λ*[*t* + 1]^(*j*)\
    \ denotes the maximum probability that the HOL packet delay of traffic *j* exceeds\
    \ its target mean delay. HOL delay is the waiting time of the first packet in\
    \ transmission queue. *D̂*[*t* + 1]^(*j*) defines the target mean delay of traffic\
    \ *j*. The intuition behind 4.7 is that the traffic that has the highest *λ*[*t* + 1]^(*j*)\
    \ value has not met its target delay in the maximum cases. Furthermore, the traffic\
    \ should get more chances to be scheduled as the HOL delay of the traffic increases.\
    \ So, *W*[*t* + 1]^(*j*) gets higher as *λ*[*t* + 1]^(*j*) or *D*[*t* + 1]^(*H**O**L*, *j*)\
    \ increases. Additionally, higher values of *p*[*j*] increase the chance of scheduling\
    \ of traffic *j*. However, a higher value of the target mean delay of a traffic\
    \ signifies that the traffic can sustain a delay and, thus, the value of *W*[*t* + 1]^(*j*)\
    \ will be reduced as *D̂*[*t* + 1]^(*j*) enhances.\n\n### [4.3.5 Knowledge Base](#ch04.xhtml#c_sec4_003_005)\n\
    \nA table, called *knowledge base*, is designed to store the experience gathered\
    \ during the execution of NB-PTS. This experience includes signal-to-interference-plus-noise\
    \ ratio (SINR) of the channel, queue threshold, and PLR that is experienced under\
    \ the selected queue threshold; and thus, the knowledge base, denoted by \U0001D542\
    , is represented as \U0001D542 = 〈SINR, queue threshold, PLR〉.\n\n### [4.3.6 Scheduling\
    \ in NB-PTS](#ch04.xhtml#c_sec4_003_006)\n\nAt \\[*t, t* + 1\\], let there are\
    \ *n* number of traffic in the system. Now, the following steps are carried out\
    \ to find the traffic to be scheduled in the next transmission phase.\n\n1.  Let\
    \ *L*[*t* + 1]^(*j*) be the queue threshold value of traffic *j* over \\[*t, t*\
    \ + 1\\] (where *j* = 1, 2, 3*, …, n*). The value of *L*[*t* + 1]^(*j*) is estimated\
    \ by applying *ϵ*\\-greedy policy as follows. \n\n    1.  At time *t*, SINR *S*[*t*]\
    \ of the channel is measured.\n\n    2.  **Exploitation:** If *S*[*t*] ∈ \\[(*S*[*t*]\
    \ − *δ*), (*S*[*t*] + *δ*)\\] in \U0001D542^(*S*) ⊂ \U0001D542, the *L*[*t*+1]\
    \ which has produced the lowest average PLR in the past is chosen within the range\
    \ of \\[(*S*[*t*]− *δ*), (*S*[*t*] + *δ*)\\] in \U0001D542^(*S*). Otherwise, the\
    \ *L*[*t*+1] which has provided the minimum average PLR in \U0001D542 is selected.\
    \ The probability of exploitation is (1 − ϵ). In this case, *δ >* 0 is a small\
    \ integer, which is used to define a small range of SINR values around the present\
    \ SINR *S*[*t*].\n\n    3.  **Exploration:** A value of *L*[*t*+1] is selected\
    \ at random with the probability of ϵ.\n\n2.  The target mean delay *D̂*[*t* + 1]^(*j*)\
    \ is computed by using 4.6.\n\n3.  The metric *W*[*t* + 1]^(*j*) is calculated\
    \ for *j* = 1, 2, 3*, …, n*, by using 4.7.\n\n4.  The traffic that has the highest\
    \ value of *W*[*t* + 1]^(*j*) is scheduled in the next transmission phase (in\
    \ slot \\[*t, t* + 1\\]).\n\n[Figure 4.2](#ch04.xhtml#fig4_2) demonstrates the\
    \ basic execution steps of NB-PTS with the three phase design approach.\n\n![Figure\
    \ 4.2 Steps of execution of NB-PTS with three phases.](images/fig4_2.jpg)\n\n\
    [Figure 4.2 Steps of execution of NB-PTS with three phases.](#ch04.xhtml#Ffig4_2)\n\
    \n### [4.3.7 Time-Bound Analysis](#ch04.xhtml#c_sec4_003_007)\n\nFrom \U0001D542\
    , the search of *L*[*t*+1] that has produced the lowest-average PLR in the past\
    \ leads to the crucial role in time complexity of NB-PTS. Assume that \U0001D542\
    \ is populated in a way on the basis of SINR value, where a binary search is used.\
    \ Thus, the time bound of average searching in \U0001D542 is *O*(log(|\U0001D542\
    |). Here, |\U0001D542| signifies the number of entries in \U0001D542. Furthermore,\
    \ in 4.7, the term $\\\\sum\\_{i = 1}^{n}p\\_{i}$ can also contribute to the time-complexity\
    \ bound of NB-PTS. Therefore, the time bound of NB-PTS is $O{({\\\\log{({|\\\\\
    mathbb{K}|})} + \\\\sum\\_{i = 1}^{n}p\\_{i}})}$.\n\n## [4.4 Performance Analysis](#ch04.xhtml#c_sec4_4)"
  fmt: "\nThe MMBP-2 model can be approximated into two independent Bernoulli processes.\
    \ Hence, by using Equation (4.5) and Little's result, the target mean delay in\
    \ slot [`t`, `t` + 1] can be obtained as follows:\n\n${\\hat{D}}_{t + 1} = \\\
    frac{\\gamma_{t}[1 - L_{t + 1}\\alpha_{t}\\gamma_{t}^{L_{t + 1} - 1} + \\left(\
    \ 2L_{t + 1}\\alpha_{t} - \\left( L_{t + 1} + 1 \\right) \\right)\\gamma_{t}^{L_{t\
    \ + 1}} - \\left( L_{t + 1}\\alpha_{t} - L_{t + 1} \\right)\\gamma_{t}^{L_{t +\
    \ 1} + 1}]}{\\beta(1 - \\gamma_{t})[1 - {(1 - \\gamma_{t})}{(\\beta + \\alpha_{t}\\\
    gamma_{t}^{L_{t + 1}})} - \\gamma_{t}^{L_{t + 1} + 1} - \\left( 1 + \\beta \\\
    right)\\left( 1 - \\gamma_{t} \\right)]}$ (4.6)\n\nwhere $\\gamma_{t} = \\frac{\\\
    alpha_{t}(1 - \\beta)}{\\beta(1 - \\alpha_{t})}$. For a given value of `L[t+1]`,\
    \ and the current arrival rate `α[t]`, we can obtain the target mean delay `D̂[t+1]`\
    \ by solving 4.6.\n\nIn our description, we consider the time window [`t`, `t`\
    \ + 1], where the threshold `L[t+1]` has to be set. The estimation of `L[t+1]`\
    \ is discussed next.\n\n### [4.3.2 Estimation of Queue Threshold Value](#ch04.xhtml#c_sec4_003_002)\n\
    \nAs we mentioned earlier, we use an online learning mechanism based on the `ϵ`-greedy\
    \ policy to estimate the value of `L[t+1]` at [`t`, `t` + 1], depending on the\
    \ environmental constraints of a NB-IoT–based system.\n\n#### [4.3.2.1 ϵ-greedy\
    \ Policy](#ch04.xhtml#c_sec4_003_002_001)\n\nIn `ϵ`-greedy [[23](#ch04.xhtml#ref4_23)],\
    \ a parameter, `ϵ`, known as exploration probability, is used to control the learning\
    \ rate. At a time instant `t`, `ϵ[t]` is calculated as `ϵ[t] = min(1, dE/t^2)`.\
    \ Here, `d` is a control parameter such that `d > 0`. We consider the mean delay\
    \ measured in slot [`t` − 1, `t`], i.e., `D[t]` as the value of `E` to find `L[t+1]`\
    \ in [`t`, `t`+1], since `D[t]` can influence the queue length in [`t`, `t` +\
    \ 1]. The `ϵ`-greedy policy enforcement employs two phases as follows.\n\n> **Exploration:**\
    \ A value of `L[t+1]` is selected randomly and the probability of this selection\
    \ is `ϵ`.\n\n> **Exploitation:** The `L[t+1]`, which has produced the lowest average\
    \ packet loss rate (PLR) in the past is chosen in this case. The probability of\
    \ exploitation is (1 − `ϵ`).\n\n### [4.3.3 Calculation of Target Mean Delay](#ch04.xhtml#c_sec4_003_003)\n\
    \nIn order to compute the value of `D̂[t+1]` of a traffic, firstly the threshold\
    \ `L[t+1]` is set by applying `ϵ`-greedy policy. Then the current value of `α[t]`\
    \ is found, and `D̂[t+1]` is calculated by using 4.6.\n\n### [4.3.4 Metric for\
    \ Scheduling](#ch04.xhtml#c_sec4_003_004)\n\nIn time window [`t`, `t` + 1], after\
    \ estimating the value of `L[t+1]` and then computing `D̂[t+1]`, we need to schedule\
    \ prioritized traffic on the basis of `D̂[t+1]`. For this scheduling purpose in\
    \ slot [`t`, `t` + 1], we define a metric for traffic `j`, denoted by `W[t+1]^j`,\
    \ which imposes an weight on the importance of the traffic to be scheduled. In\
    \ this case, each packet is assigned a `priority`, which provides an importance\
    \ factor for the packet to be delivered. The priority value increases as the importance\
    \ of the traffic increases. Now, we define `W[t+1]^j` as given in the following:\n\
    \n$W_{t + 1}^{j} = \\frac{\\lambda_{t + 1}^{j} \\times D_{t + 1}^{HOL,j}}{\\hat{D}_{t\
    \ + 1}^{j}} \\times \\frac{p_{j}}{\\sum_{i = 1}^{n}p_{i}}$ (4.7)\n\nIn this equation,\
    \ `p[j]` specifies the priority of traffic `j`. It can be noted that the value\
    \ of `W[t+1]^j` increases as `p[j]` increases and higher values of `W[t+1]^j`\
    \ provide more chances of scheduling of traffic `j`. In 4.7, `D[t+1]^(HOL, j)`\
    \ is the current head of line (HOL) packet delay of traffic `j` and `λ[t+1]^j`\
    \ denotes the maximum probability that the HOL packet delay of traffic `j` exceeds\
    \ its target mean delay. HOL delay is the waiting time of the first packet in\
    \ transmission queue. `D̂[t+1]^j` defines the target mean delay of traffic `j`.\
    \ The intuition behind 4.7 is that the traffic that has the highest `λ[t+1]^j`\
    \ value has not met its target delay in the maximum cases. Furthermore, the traffic\
    \ should get more chances to be scheduled as the HOL delay of the traffic increases.\
    \ So, `W[t+1]^j` gets higher as `λ[t+1]^j` or `D[t+1]^(HOL, j)` increases. Additionally,\
    \ higher values of `p[j]` increase the chance of scheduling of traffic `j`. However,\
    \ a higher value of the target mean delay of a traffic signifies that the traffic\
    \ can sustain a delay and, thus, the value of `W[t+1]^j` will be reduced as `D̂[t+1]^j`\
    \ enhances.\n\n### [4.3.5 Knowledge Base](#ch04.xhtml#c_sec4_003_005)\n\nA table,\
    \ called `knowledge base`, is designed to store the experience gathered during\
    \ the execution of NB-PTS. This experience includes signal-to-interference-plus-noise\
    \ ratio (SINR) of the channel, queue threshold, and PLR that is experienced under\
    \ the selected queue threshold; and thus, the knowledge base, denoted by `\U0001D542\
    `, is represented as `\U0001D542 = 〈SINR, queue threshold, PLR〉`.\n\n### [4.3.6\
    \ Scheduling in NB-PTS](#ch04.xhtml#c_sec4_003_006)\n\nAt [`t`, `t` + 1], let\
    \ there are `n` number of traffic in the system. Now, the following steps are\
    \ carried out to find the traffic to be scheduled in the next transmission phase.\n\
    \n1.  Let `L[t+1]^j` be the queue threshold value of traffic `j` over [`t`, `t`\
    \ + 1] (where `j` = 1, 2, 3, …, `n`). The value of `L[t+1]^j` is estimated by\
    \ applying `ϵ`-greedy policy as follows.\n\n    1.  At time `t`, SINR `S[t]` of\
    \ the channel is measured.\n\n    2.  **Exploitation:** If `S[t]` ∈ [`S[t]` −\
    \ `δ`, `S[t]` + `δ`] in `\U0001D542^(S)` ⊂ `\U0001D542`, the `L[t+1]` which has\
    \ produced the lowest average PLR in the past is chosen within the range of [`S[t]`\
    \ − `δ`, `S[t]` + `δ`] in `\U0001D542^(S)`. Otherwise, the `L[t+1]` which has\
    \ provided the minimum average PLR in `\U0001D542` is selected. The probability\
    \ of exploitation is (1 − `ϵ`). In this case, `δ > 0` is a small integer, which\
    \ is used to define a small range of SINR values around the present SINR `S[t]`.\n\
    \n    3.  **Exploration:** A value of `L[t+1]` is selected at random with the\
    \ probability of `ϵ`.\n\n2.  The target mean delay `D̂[t+1]^j` is computed by\
    \ using 4.6.\n\n3.  The metric `W[t+1]^j` is calculated for `j` = 1, 2, 3, …,\
    \ `n`, by using 4.7.\n\n4.  The traffic that has the highest value of `W[t+1]^j`\
    \ is scheduled in the next transmission phase (in slot [`t`, `t` + 1]).\n\n[Figure\
    \ 4.2](#ch04.xhtml#fig4_2) demonstrates the basic execution steps of NB-PTS with\
    \ the three phase design approach.\n\n![Figure 4.2 Steps of execution of NB-PTS\
    \ with three phases.](images/fig4_2.jpg)\n\n[Figure 4.2 Steps of execution of\
    \ NB-PTS with three phases.](#ch04.xhtml#Ffig4_2)\n\n### [4.3.7 Time-Bound Analysis](#ch04.xhtml#c_sec4_003_007)\n\
    \nFrom `\U0001D542`, the search of `L[t+1]` that has produced the lowest-average\
    \ PLR in the past leads to the crucial role in time complexity of NB-PTS. Assume\
    \ that `\U0001D542` is populated in a way on the basis of SINR value, where a\
    \ binary search is used. Thus, the time bound of average searching in `\U0001D542\
    ` is `O(log(|\U0001D542|)`. Here, `|\U0001D542|` signifies the number of entries\
    \ in `\U0001D542`. Furthermore, in 4.7, the term $\\sum_{i = 1}^{n}p_{i}$ can\
    \ also contribute to the time-complexity bound of NB-PTS. Therefore, the time\
    \ bound of NB-PTS is $O{({\\log{(|\\\\mathbb{K}|})} + \\sum_{i = 1}^{n}p_{i})}$.\n\
    \n## [4.4 Performance Analysis](#ch04.xhtml#c_sec4_4)\n"
  trans: "\n\nMMBP-2 模型可以近似为两个独立的伯努利过程。因此，通过使用公式 (4.5) 和 Little 的结果，时隙 [`t`, `t` +\
    \ 1] 的目标平均延迟可以如下获得：\n\n${\\hat{D}}_{t + 1} = \\frac{\\gamma_{t}[1 - L_{t + 1}\\\
    alpha_{t}\\gamma_{t}^{L_{t + 1} - 1} + \\left( 2L_{t + 1}\\alpha_{t} - \\left(\
    \ L_{t + 1} + 1 \\right) \\right)\\gamma_{t}^{L_{t + 1}} - \\left( L_{t + 1}\\\
    alpha_{t} - L_{t + 1} \\right)\\gamma_{t}^{L_{t + 1} + 1}]}{\\beta(1 - \\gamma_{t})[1\
    \ - {(1 - \\gamma_{t})}{(\\beta + \\alpha_{t}\\gamma_{t}^{L_{t + 1}})} - \\gamma_{t}^{L_{t\
    \ + 1} + 1} - \\left( 1 + \\beta \\right)\\left( 1 - \\gamma_{t} \\right)]}$ (4.6)\n\
    \n其中 $\\gamma_{t} = \\frac{\\alpha_{t}(1 - \\beta)}{\\beta(1 - \\alpha_{t})}$。对于给定的\
    \ `L[t+1]` 值和当前到达率 `α[t]`，可以通过求解 4.6 来获取目标平均延迟 `D̂[t+1]`。\n\n在我们的描述中，我们考虑时间窗口\
    \ [`t`, `t` + 1]，其中必须设置阈值 `L[t+1]`。`L[t+1]` 的估计将在下一部分讨论。\n\n### 4.3.2 队列阈值估计\n\
    \n如前所述，我们使用基于 `ϵ`-贪婪策略的在线学习机制来估计在 [`t`, `t` + 1] 时 `L[t+1]` 的值，具体取决于基于 NB-IoT\
    \ 的系统的环境约束。\n\n#### 4.3.2.1 ϵ-贪婪策略\n\n在 `ϵ`-贪婪 [23] 中，使用一个名为探索概率的参数 `ϵ` 来控制学习率。在时间瞬时\
    \ `t`，`ϵ[t]` 计算为 `ϵ[t] = min(1, dE/t²)`。这里，`d` 是一个控制参数，使得 `d > 0`。我们将时隙 [`t` −\
    \ 1, `t`] 中测量的平均延迟，即 `D[t]`，作为 `E` 的值，以便在 [`t`, `t`+1] 中找到 `L[t+1]`，因为 `D[t]`\
    \ 可以影响 [`t`, `t` + 1] 中的队列长度。`ϵ`-贪婪策略执行采用以下两个阶段。\n\n> **探索：** 随机选择一个 `L[t+1]`\
    \ 值，该选择的概率为 `ϵ`。\n\n> **利用：** 在这种情况下，选择过去产生最低平均丢包率 (PLR) 的 `L[t+1]`。利用的概率为 (1\
    \ − `ϵ`)。\n\n### 4.3.3 目标平均延迟计算\n\n为了计算某流量的 `D̂[t+1]` 值，首先通过应用 `ϵ`-贪婪策略设置阈值 `L[t+1]`。然后找到当前的\
    \ `α[t]` 值，并使用 4.6 计算 `D̂[t+1]`。\n\n### 4.3.4 调度度量\n\n在时间窗口 [`t`, `t` + 1] 中，在估计\
    \ `L[t+1]` 的值并计算 `D̂[t+1]` 后，我们需要根据 `D̂[t+1]` 调度优先流量。为此调度目的，在时隙 [`t`, `t` + 1]\
    \ 中，我们为流量 `j` 定义一个度量，表示为 `W[t+1]^j`，它对待调度流量的重要性施加权重。在这种情况下，每个数据包被分配一个 `优先级`，它为待传输数据包提供重要性因子。优先级值随流量重要性的增加而增加。现在，我们定义\
    \ `W[t+1]^j` 如下：\n\n$W_{t + 1}^{j} = \\frac{\\lambda_{t + 1}^{j} \\times D_{t\
    \ + 1}^{HOL,j}}{\\hat{D}_{t + 1}^{j}} \\times \\frac{p_{j}}{\\sum_{i = 1}^{n}p_{i}}$\
    \ (4.7)\n\n在这个公式中，`p[j]` 指定流量 `j` 的优先级。可以注意到，`W[t+1]^j` 的值随 `p[j]` 的增加而增加，`W[t+1]^j`\
    \ 的更高值为流量 `j` 提供更多调度机会。在 4.7 中，`D[t+1]^(HOL, j)` 是流量 `j` 的当前队首 (HOL) 数据包延迟，`λ[t+1]^j`\
    \ 表示流量 `j` 的 HOL 数据包延迟超过其目标平均延迟的最大概率。HOL 延迟是传输队列中第一个数据包的等待时间。`D̂[t+1]^j` 定义流量\
    \ `j` 的目标平均延迟。4.7 背后的直觉是，具有最高 `λ[t+1]^j` 值的流量在大多数情况下未能满足其目标延迟。此外，随着流量的 HOL 延迟增加，该流量应获得更多调度机会。因此，随着\
    \ `λ[t+1]^j` 或 `D[t+1]^(HOL, j)` 的增加，`W[t+1]^j` 会变得更高。此外，`p[j]` 的更高值会增加流量 `j`\
    \ 的调度机会。然而，流量目标平均延迟的更高值意味着该流量可以容忍延迟，因此随着 `D̂[t+1]^j` 的增加，`W[t+1]^j` 的值会降低。\n\n\
    ### 4.3.5 知识库\n\n设计了一个名为 `知识库` 的表，用于存储在 NB-PTS 执行过程中收集的经验。这些经验包括信道的信噪加噪声比 (SINR)、队列阈值以及在选定队列阈值下经历的\
    \ PLR；因此，知识库，表示为 `\U0001D542`，表示为 `\U0001D542 = 〈SINR, 队列阈值, PLR〉`。\n\n### 4.3.6\
    \ NB-PTS 中的调度\n\n在 [`t`, `t` + 1] 时，假设系统中有 `n` 个流量。现在，执行以下步骤以找到在下一个传输阶段调度的流量。\n\
    \n1.  设 `L[t+1]^j` 为流量 `j` 在 [`t`, `t` + 1] 上的队列阈值（其中 `j` = 1, 2, 3, …, `n`）。`L[t+1]^j`\
    \ 的值通过应用 `ϵ`-贪婪策略估计，如下所示。\n\n    1.  在时间 `t`，测量信道的 SINR `S[t]`。\n\n    2.  **利用：**\
    \ 如果 `S[t]` ∈ [`S[t]` − `δ`, `S[t]` + `δ`] 在 `\U0001D542^(S)` ⊂ `\U0001D542` 中，则在\
    \ `\U0001D542^(S)` 中 [`S[t]` − `δ`, `S[t]` + `δ`] 范围内选择过去产生最低平均 PLR 的 `L[t+1]`。否则，选择在\
    \ `\U0001D542` 中提供最小平均 PLR 的 `L[t+1]`。利用的概率为 (1 − `ϵ`)。在这种情况下，`δ > 0` 是一个小整数，用于定义当前\
    \ SINR `S[t]` 周围的一小段 SINR 值范围。\n\n    3.  **探索：** 以 `ϵ` 的概率随机选择一个 `L[t+1]` 值。\n\
    \n2.  使用 4.6 计算目标平均延迟 `D̂[t+1]^j`。\n\n3.  对于 `j` = 1, 2, 3, …, `n`，使用 4.7 计算度量\
    \ `W[t+1]^j`。\n\n4.  具有最高 `W[t+1]^j` 值的流量将在下一个传输阶段（在时隙 [`t`, `t` + 1]）中被调度。\n\n\
    图 4.2 演示了带有三阶段设计方法的 NB-PTS 基本执行步骤。\n\n![图 4.2 带有三个阶段的 NB-PTS 执行步骤。](img/fig4_2.jpg)\n\
    \n图 4.2 带有三个阶段的 NB-PTS 执行步骤。\n\n### 4.3.7 时间界分析\n\n从 `\U0001D542` 中，搜索过去产生最低平均\
    \ PLR 的 `L[t+1]` 在 NB-PTS 的时间复杂度中起着关键作用。假设 `\U0001D542` 基于 SINR 值以某种方式填充，其中使用二分查找。因此，在\
    \ `\U0001D542` 中平均搜索的时间界为 `O(log(|\U0001D542|)`。这里，`|\U0001D542|` 表示 `\U0001D542\
    ` 中的条目数量。此外，在 4.7 中，项 $\\sum_{i = 1}^{n}p_{i}$ 也可以对 NB-PTS 的时间复杂度界做出贡献。因此，NB-PTS\
    \ 的时间界为 $O{({\\log{(|\\\\mathbb{K}|})} + \\sum_{i = 1}^{n}p_{i})}$。\n\n## 4.4\
    \ 性能分析\n\n"
