- raw: 'In \[[9](#ch01.xhtml#ref1_9)\], different HTTPS-encapsulated services are
    detected using traffic fingerprinting. Data is extracted while these services
    are being used and the trained model is then used to detect unseen instances of
    these services. This paper aims to identify patterns that are able to indicate
    the usage of specific web services such as Google Maps, Google Drive, or Dropbox
    applications, instead of the behavior of the underlying protocols themselves.
    This makes the model design protocol independent and the classification labels
    can be arbitrarily big, depending on the number of services one aims to detect.
    This also enables easier generalisation.


    In \[[10](#ch01.xhtml#ref1_10)\], the problem is similar to the main problem in
    this chapter: binary classification of encrypted HTTP streams. However, they aim
    towards a more specific classification between HTTP/1 and HTTP/2 flows. They make
    use of random forest, decision trees, Naive-Bayes tree, and Bayesian networks,
    with random forest giving best results across all metrics. \[[11](#ch01.xhtml#ref1_11)\]
    is focused on DNS and discusses its several characteristics and possible threats.
    The paper demonstrates the effectiveness of deep neural networks to detect covert
    channels. Bushart et al. \[[12](#ch01.xhtml#ref1_12)\] and Siby et al. \[[13](#ch01.xhtml#ref1_13)\]
    try to perform fingerprinting of encrypted traffic on Alexa''s top websites list.
    These use sequences of message bursts and gaps as part of the feature vector,
    which is similar to the principle used in the proposed work to obtain features
    for our input vector. Bushart et al. \[[12](#ch01.xhtml#ref1_12)\] also try to
    specifically identify DoH traffic. This has a limitation of using known IP addresses
    of popular services to classify DoH traffic, which can cause significant overfitting
    due to singular focus on this feature. The simple conclusion they make is to use
    different ports or providers which does not give us insights into the traffic
    patterns themselves.


    Krizhevsky et al. \[[7](#ch01.xhtml#ref1_7)\] introduce the first deep convolutional
    network, which forms the basis of our work. This chapter takes inspiration from
    the developments in the field of sequential modelling to span our problem \[[14](#ch01.xhtml#ref1_14)\],
    as well as time series analysis research to develop a credible hypothesis \[[15](#ch01.xhtml#ref1_15),[16](#ch01.xhtml#ref1_16)\],
    which is used to develop a novel algorithm in DoH analysis. Our proposed work
    explores works on feature selection \[[17](#ch01.xhtml#ref1_17),[18](#ch01.xhtml#ref1_18),[19](#ch01.xhtml#ref1_19)\]
    as well as multi-dimensional data analysis \[[20](#ch01.xhtml#ref1_20)\] to optimise
    our approach and create the feature engineering module and look for scalable solutions
    \[[21](#ch01.xhtml#ref1_21)\]. Our work is specifically inspired by \[[22](#ch01.xhtml#ref1_22),[23](#ch01.xhtml#ref1_23)\]
    to work on this feature.


    ## [1.3 Implementation (Diff Models and All)](#ch01.xhtml#c_sec1_3)


    ### [1.3.1 Dataset](#ch01.xhtml#c_sec1_003_001)


    #### [1.3.1.1 DoH vs. Non-DoH Dataset](#ch01.xhtml#c_sec1_003_001_001)


    This dataset, shown in [Table 1.1](#ch01.xhtml#table1_1), has 35 features out
    of which 28 are listed below. Twenty-eight of these features represent statistics
    between time and length, and the others are identifying information such as addresses
    and ports. The features are extracted from raw captures through a script written
    in python that uses Scapy to read pcap files and process them to extract features.
    These are the intuitively best features as DoH requests are in general smaller
    than web traffic that is non-DoH and requests are also made for shorter periods
    of time. These features can be verified with the help of software such as wireshark.


    [Table 1.1 Dataset Parameters](#ch01.xhtml#Ttable1_1)


    | Parameter || Feature |


    | --- | --- |


    | F1 || Number of flow bytes sent |


    | --- | --- |


    | F2 || Rate of flow bytes sent |


    | F3 || Number of flow bytes received |


    | F4 || Rate of flow bytes received |


    | F5 || Mean packet length |


    | F6 || Median packet length |


    | F7 || Mode packet length |


    | F8 || Variance of packet length |


    | F9 || Standard deviation of packet length |


    | F10 || Coefficient of variation of packet length |


    | F11 || Skew from median packet length |


    | F12 || Skew from mode packet length |


    | F13 || Mean packet time |


    | F14 || Median packet time |


    | F15 || Mode packet time |


    | F16 || Variance of packet time |


    | F17 || Standard deviation of packet time |


    | F18 || Coefficient of variation of packet time |


    | F19 || Skew from median packet time |


    | F20 || Skew from mode packet time |


    | F21 || Mean Request/response time difference |


    | F22 || Median request/response time difference |


    | F23 || Mode request/response time difference |


    | F24 || Variance of request/response time difference |


    | F25 || Standard deviation of request/response time difference |


    | F26 || Coefficient of variation of request/response time difference |


    | F27 || Skew from redequest/response time difference |


    #### [1.3.1.2 Malicious vs. Non-Malicious DoH](#ch01.xhtml#c_sec1_003_001_002)


    This dataset has the same structure as the previous one, only with the label values
    changed for malicious and non-malicious DoH. This dataset has been obtained from
    a referenced study \[[4](#ch01.xhtml#ref1_4)\] that uses a tool called DoH Data
    Collector that simulates different DoH tunneling scenarios and captures the constituent
    HTTPS traffic. In each simulation, a DoH tunnel is made over the network with
    varying parameters specific to a scenario.


    ### [1.3.2 Feature Engineering](#ch01.xhtml#c_sec1_003_002)


    This paper proposes to use an extra tree classifier (ETC) for extracting important
    features from the dataset. ETC implements multiple decision trees. The algorithm
    is composed of a large number of decision trees, where the final decision is obtained
    taking into account the prediction of every tree. The majority of the votes of
    each tree is used in the proposed work as the classification output. The reason
    to choose ETC over RF is that it is much faster due to its random split property
    and its ability to get the same accuracy as RF. This module takes the input (dataset
    or real time) to disseminate the model only into the necessary features. This
    module functions in two different ways for the two different types of inputs.
    For the inputs that are coming in real time, the feature engineering module only
    extracts the important features, and the features selected are ones learnt by
    the model through the dataset. The function of the ETC with respect to the dataset
    is to create an accurate feature importance split that is able to create an accurate
    representation of the reduced data while maintaining variance and as much information
    as possible.


    ### [1.3.3 Classification Models](#ch01.xhtml#c_sec1_003_003)


    #### [1.3.3.1 The Keras Sequential Model](#ch01.xhtml#c_sec1_003_003_001)


    The first layer is the input layer that takes in the input dataset that the model
    has to be trained/tested on. This is followed by a set of Conv1D, BatchNorm, and
    ReLU Layers. Here is the function of the layers mentioned in [Figure 1.1](#ch01.xhtml#fig1_1):


    ![Figure 1.1 Model architecture.](images/fig1_1.jpg)


    [Figure 1.1 Model architecture.](#ch01.xhtml#Ffig1_1)


    Conv1D: It''s a one-dimensional convolutional layer that takes data sequentially
    and produces output tensors after conducting the convolutional operations as shown
    in the figure.


    This convolutional input takes on features from our data and passes them through
    layers of convolutions to create a dense latent representation, represented by
    the flatten module in [Figure 1.1](#ch01.xhtml#fig1_1). This flattened diagram
    is then brought up to classify in a fully connected layer at the end of the model.'
