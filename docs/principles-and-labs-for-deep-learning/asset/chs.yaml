  \n\n\n\n\n# 第 4 章：多分类问题\n\n## 摘要\n卷积神经网络（也称为 `CNN` 或 `ConvNet`）是一种深度神经网络，它已成功应用于多种计算机视觉领域，特别是用于视觉图像的分析。在本章中，我们首先介绍了\
  \ `CNN` 的结构和操作机制，以解释其工作原理。接下来，我们将讨论多分类问题，这指的是将样本归类为三个或更多类别中的一个的问题。然后，我们将构建一个基于 `CNN`\
  \ 的多分类模型，以帮助读者提高使用 `CNN` 解决多分类问题的技能。最后，我们介绍并应用了一种数据增强技术，以防止训练过程中的过拟合问题，并提高基于 `CNN`\
  \ 的分类模型的性能。\n\n## 关键词\n卷积神经网络；`TensorFlow` 数据集；多分类；图像分类；数据增强\n\n## 大纲\n- 卷积神经网络\
  \ (`CNNs`) 简介\n- 分类交叉熵\n- 增加训练数据的数据增强技术\n- 使用 `CNN` 在 CIFAR-10 数据集上进行多分类\n\n\n\n\
  \n## 4.1 卷积神经网络\n\n## 4.1.1 卷积神经网络简介\n卷积神经网络，也称为 `CNN` 或 `ConvNet`，是一种深度神经网络，它已成功应用于各种计算机视觉应用中，特别是用于分析视觉图像。图\
  \ 4.1 显示了 2012 年 ImageNet 大规模视觉识别挑战（ImageNet LSVRC）中最佳方法的排名。所示，使用 `CNN` 的 `AlexNet`\
  \ 在错误率方面优于之前最先进的图像分类方法。在随后的 ImageNet 竞赛中，基于 `CNN` 的模型（如 `GoogLeNet`、`ResNet`、`ResNeXt`\
  \ 等）继续获胜，并以令人惊叹的性能压倒了传统模型。\n\n![](img/image-it95hlar.jpg)\n图 4.1 2012 年 ImageNet\
  \ 大规模视觉识别挑战（ImageNet LSVRC）中最佳方法的排名。\n\n正如前面的章节所述，普通神经网络包括输入层、隐藏层和输出层，其中来自输入层的输入在发送到输出层之前，会通过一系列隐藏层进行转换。每层都包含一组神经元，其中每个神经元与上一层的所有神经元全连接，且神经元完全独立地运行，如图所示。`CNNs`\
  \ 与普通神经网络相似，这意味着它们也由包含可学习权重和偏置神经元的层组成。然而，与普通神经网络不同，`CNNs` 层中的神经元是以三维方式组织的，包括宽度、高度和深度，每个神经元仅通过卷积核（神经元的感受野）与上一层的局部区域连接，如图所示。在\
  \ `CNNs` 中，神经元的 3D 输入张量在每一层都被转换为神经元的 3D 输出张量。例如，如果一个设计用于 ImageNet [2] 数据集图像分类的 `CNN`\
  \ 接收到维度为 `256 × 256 × 3` 的图像输入，那么 `CNN` 的最终输出层维度应为 `1 × 1 × 1000`，因为 ImageNet 有\
  \ 1000 个类。\n\n![](img/image-x0mhk8o7.jpg)\n图 4.2 普通神经网络和卷积神经网络 (CNN) 的示意图。\n\n##\
  \ 4.1.2 构建卷积神经网络\n通常，一个简单的 `CNN` 由三种主要类型的层构建组成：卷积层、池化层和全连接层，如图所示。下面详细介绍这些层。\n\n\
  ### 층\n![](img/image-e0661sn9.jpg)\n图 4.3 卷积神经网络 (CNN) 架构示意图。\n\n卷积层的原理是使用卷积核或滤波器在输入上滑动以学习特征。如图所示，将一个\
  \ `3 × 3` 的卷积核滑动到 `4 × 4` 的输入图像上，产生一个大小为 `2 × 2` 的输出特征图；第一次计算的输出为 7，计算公式为：\n\n![](img/image-fr47mquo.jpg)\
  \ ![](img/image-e3byzu0d.jpg) ![](img/image-b9fagtt6.jpg) ![](img/image-6dna1zp0.jpg)\n\
  图 4.4 卷积层中的计算。\n\n卷积核的大小和数量是可调的超参数，大多数尺寸设置为奇数，如 `3 × 3`、`5 × 5` 或 `7 × 7`。由于卷积核过多也导致过拟合问题，因此必要调整此参数以选择最合适的一个。\n\
  \n零\n图 4.4 描述了卷积层的基本操作，在每次卷积之后，输出张量的大小与输入张量相比发生了变化。为了控制输出张量的大小，通过在输入张量周围进行零填充（zero-padding）来实现。大多数情况下，使用零填充来保留输入张量的大小。例如，通过在\
  \ `4 × 4` 输入的周围应用大小为 `1` 的零填充，输入大小变为 `6 × 6`，所示。然后在在 `6 × 6` 的输入上进行卷积核大小为 `3 × 3`\
  \ 的卷积，输出量的大小为 `4 × 4`，与原始输入相同，所示。\n\n![](img/image-ub6m89u7.jpg)\n图 4.5 大为 1 的零填充。\n\
  ![](img/image-w5uxufq2.jpg)\n图 4.6 零填充的卷积操作。\n\n步长\n步长控制卷积核在输入上的滑动方式。在普通卷积层中，使用步长值为\
