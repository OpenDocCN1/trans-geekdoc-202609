  \nJupyter Notebook 是一个基于 Web 的交互式应用程序，支持创建和共享包含实时代码、叙述性文本和可视化内容的文档。“Jupyter”名称源于三个核心编程语言：Julia、`Python`\
  \ 和 `R`。通过 Jupyter Notebook，可以连接许多支持超过四十种语言的内核（kernels）。`IPython` 内核允许在 `Python`\
  \ 中编写源代码，它被设为 Jupyter Notebook 的默认内核。下面介绍了在 Windows 和 Ubuntu 操作系统上安装 Jupyter Notebook\
