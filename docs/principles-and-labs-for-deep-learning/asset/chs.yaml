  \ 有超过 60 个图像分类数据集。`TensorFlow Datasets` 上还提供了对象检测、问答、摘要等多个领域的数据集。请访问 `www.tensorflow.org/datasets/`\
  \ 了解更多详情。在下一节中，我们将通过 `tf.data.Datasets` API 从 `TensorFlow Datasets` 加载 `CIFAR10`\
  \ 数据集，用于训练和测试多类别分类模型。\n\n## 4.3.3: 代码示例\n\n图 4.24 是多类别分类模型源代码的流程图。\n\n* 数据\n* 软件包\n\
