  \ 2017:1125–1134.\n\n# 第 6 章：高级 TensorFlow\n\n## 摘要\n尽管 TensorFlow 的高级 Keras 应用程序接口（API）使得构建和训练神经网络模型变得简单，但它仍然存在局限性。例如，作者在最新论文中提出的所有新网络层或损失函数并没有包含在高级\
  \ API 中，因此这些层和损失函数无法用于构建新的网络模型。在本章中，我们引入了高级 TensorFlow 技术，展示了如何为特定目的定制 API，例如自定义网络层、自定义损失函数、自定义指标函数和自定义回调函数。然后，我们提供了两种构建用于多类别分类神经网络的场景。在第一种情况下，我们应用了高级\
  \ Keras API；在第二种情况下，我们使用 TensorFlow 的自定义 API。\n\n## 关键词\nKeras API；自定义 API；网络层；损失函数；指标函数；回调\n\
  \n## 提纲\n- 使用 TensorFlow 创建自定义 API\n- 在设计神经网络时使用高级 Keras API 和 TensorFlow 自定义 API\
  \ 的益处\n- 使用高级 Keras API 和 TensorFlow 自定义 API 的神经网络\n\n\n\n\n\n## 6.1: 进阶 TensorFlow\n\
  \n之前的章节介绍了如何通过以下步骤使用 `tf.keras` API 来构建和训练用于线性回归、二分类和多类别分类的神经网络模型：\n- 网络模型的输入：`tf.keras.Input()`\n\
  - 网络的层：`tf.keras.layers()`\n- 网络模型：`tf.keras.Model()`\n- 优化器、损失函数和指标函数：`model.compile()`\n\
  - 网络模型：`model.fit()`\n\n虽然 TensorFlow 的高层 Keras API 使构建和训练神经网络模型变得非常非常简单，但它仍然存在局限性。例如，并不是所有问题的损失函数都包含在高级\
  \ API 中，因此这些损失函数无法用于训练新的网络模型。在本节中，我们将演示高级 TensorFlow 技术，以展示如何针对以下特定目的自定义 API：\n\
  - 网络层：如何创建一个新的网络层\n- 损失函数：如何创建一个新的损失函数\n- 指标函数：如何创建一个新的指标函数\n- 回调函数：如何创建一个新的回调函数\n\
  \n## 6.1.1: 自定义网络层\n\nTensorFlow 提供的网络层类型非常多样，包括：\n- 层：`Conv1D`, `Conv2D`, `Conv3D`,\
  \ `SeparableConv2D`, `DepthwiseConv2D`, `Conv2DTranspose` 等\n- 层：`MaxPooling1D`,\
  \ `MaxPooling2D`, `AveragePooling2D`, `GlobalMaxPooling2D` 等\n- 层：`Add`, `Subtract`,\
  \ `Multiply`, `Concatenate`, `Maximum` 等\n- 层：线性整流单元（`ReLU`）、`LeakyReLU`, `PReLU`\
  \ 等\n- 层：`RNN`, `GRU`, `LSTM`, `ConvLSTM2D` 等\n- 归一化、丢弃（dropout）等\n\n如果 TensorFlow\
  \ 中没有定义某类型的网络层，可以通过继承 `tf.keras.layers.Layer` 类来创建一个新的自定义层。以下是创建自定义层的模板。\n\n![](img/image-hkwj4hfi.jpg)\n\
  \nTensorFlow 关 Keras 层 API 的官方文档位于：`www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/layers`\n\
  \n## 6.1.2: 自定义损失函数\n\n在设计用于分类、识别、回归等各种问题的神经网络模型时，有许多损失函数可以选择。TensorFlow 提供的损失函数不足以处理所有问题。因此，如果\
  \ TensorFlow 中没有用于解决特定问题的损失函数，则有必要定义一个新的。以下是创建自定义损失函数的模板。\n\n![](img/image-0ud0j59g.jpg)\n\
  \n可以通过以下地址访问 TensorFlow 提供的官方损失函数：`www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/losses`\n\
  \n## 6.1.3: 自定义指标函数\n\n指标函数用于评估神经网络模型的质量，每个任务的每个指标都是不同的。例如，交并比（`IoU`）指标用于语义分割模型，平均精度均值（`mAP`）指标用于目标检测模型，而峰值信噪比（`PSNR`）和结构相似性指数（`SSIM`）指标用于图像增强模型，如去雾模型、去雾模型等。如果\
  \ TensorFlow 中没有可用的指标函数，可以通过继承 `tf.keras.metrics.Metric` 类来创建一个。以下是创建自定义指标函数的模板。\n\
  \n![](img/image-f506ehqa.jpg)\n\n可以通过以下地址访问 TensorFlow 提供的官方指标函数：`www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/metrics`\n\
  \n## 6.1.4: 自定义回调函数\n\n回调是在训练神经网络模型过程中在各个阶段执行操作的强大工具。例如，使用回调可以帮助在每个训练轮次（epoch）后写入\
  \ TensorBoard 日志来监控损失和指标，通过早停（early stopping）防止过拟合，保存最佳模型权重等。TensorFlow 中可用的常用回调有：\n\
  - 监控值并存储最佳模型权重\n- 如果模型的监控值长时间内没有改进，则提前终止训练\n- 如果模型的监控值在长时间内没有改进，则降低学习率\n- 在训练过程中记录模型的权重、计算图结构等\n\
  \n如果 TensorFlow 未提供某个回调，可以通过继承 `tf.keras.callbacks.Callback` 类来创建一个。以下是创建自定义回调的模板。\n\
  \n![](img/image-oenbcv06.jpg)\n![](img/image-9ep47c6b.jpg)\n\n可以通过以下地址访问 TensorFlow\
  \ 提供的官方回调函数：`www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/callbacks`\n\
  \n# 6.2: 使用 TensorFlow 的高层 Keras API 和自定义 API\n\n本节通过示例详细介绍 TensorFlow 自定义 API 和高层\
  \ Keras API 的更多细节。每个示例都使用这两种方法实现，以展示每种方法的优势。虽然高层 Keras API 经过优化且易于使用，但自定义 API 在构建神经网络方面非常灵活。\n\
  \n### 6.2.1: 网络层\n\n在本节中，我们使用 TensorFlow 的高层 Keras API 和自定义网络层来创建一个卷积层。卷积层的参数如下：\n\
  - 卷积核数量：64\n- 尺寸：$3 \\times 3$\n- 步长（stride）：1\n- 填充（padding）：valid\n- 激活函数：`ReLU`\n\
  - 初始化：Glorot 初始化\n- 偏置初始化：zeros\n\n以下两种方法创建的卷积层具有相同的功能。\n\n![](img/image-j3zzp10.jpg)\n\
  \n### 6.2.2: 损失函数\n\n本节使用高层 Keras API 和自定义损失函数建立分类交叉熵（`CCE`）损失函数。CCE 的公式为：\n\n![](img/image-u1na7ci.jpg)\
