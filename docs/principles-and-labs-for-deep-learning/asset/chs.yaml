  \ 的改进版本。最后，本章介绍了一个在大型人脸属性数据集（CelebA）上构建、训练和测试 WGAN-GP 模型的示例程序。\n\n关键词\nGAN；WGAN-GP；Wasserstein\
  \ 距离；生成器；判别器\n\n大纲\n生成对抗网络 (GANs)\nWasserstein 距离与带梯度惩罚的 Wasserstein 生成对抗网络 (WGAN-GP)\n\
  使用 WGAN-GP 生成脸部图像\n\n\n\n\n\n## 11.1: 生成对抗网络\n\n### 11.1.1: 生成对抗网络导论\n\nGoodfellow\
  \ 等人 [1] 于 2014 年提出了生成对抗网络（GAN）。GAN 学习生成与训练数据具有相同统计特性的新数据，它由生成器（generator）和判别器（discriminator）两个子网络组成，如图所示生成器负责生成与真实样本无区分的伪样本，而判别器则学习识别生成器生成样本的真伪。生成的样本越接近真实样本，判别器给出的分数越高，反之亦然。由于判别器的输出经过\
  \ sigmoid 激活函数，因此分数范围在 0 到 1 之间。\n\n![](img/image-ettklgvn.jpg)图 11.1 生成器和判别器的操作。\n\
  \nGAN 的运行可以想象成一个学生（生成器）学习画肖像，一个老师（判别器）负责评估并区分学生画的肖像与真实的肖像。在老师的指导下，学生学习改进作品，形成一个对抗与改进的循环。在训练结束时，学生画的肖像与真实的肖像变得无法区分。这就是\
  \ GAN 的核心概念，如图。\n\n![](img/image-4niiauju.jpg)图 11.2 生成对抗网络（GAN）结构图。\n\n目前已经提出了许多类型的\
  \ GAN，例如 DCGAN、ImprovedGAN、PACGAN、WGAN、WGAN-GP、CycleGAN、PGGAN、StackGAN、video2video、BigGAN、StyleGAN\
  \ 等。GAN 在图像生成、文本生成、文本到图像生成、图像翻译等许多计算机视觉任务中展现了显著的效果，如图。\n\n![](img/image-blr5q77j.jpg)图\
  \ 11.3 生成对抗网络（GAN）的应用。\n\n### 11.1.2: 生成对抗网络的训练\n\nGAN 的训练方法与之前章节介绍的网络模型不同。在训练 GAN\
  \ 时，通过对抗过程，使用不同的损失函数同时训练包括生成器和判别器在内的两个模型，如图。我们在下一节中介绍训练生成器和判别器的损失函数。\n\n### 生成器\n\
  \n![](img/image-g8t5bbej.jpg)图 11.4 生成对抗网络（GAN）的训练过程。\n\n训练生成器的目的是最小化生成器损失。生成器损失越低，生成器产生接近真实样本的伪样本的能力越强。如图，向生成器输入一组随机向量（`z`）后，会生成一张图像（`\
  \ `）。然后，将生成的图像发送到判别器进行识别。如果判别器的输出接近 1，生成器的损失就会越小。这意味着判别器认为生成器生成的样本更加真实，换句话说，判别器无法区分真实样本和生成的样本（伪样本）。在训练生成器期间，需要固定判别器的权重。生成器的损失函数公式如下：\n\
  \n```\n![](img/image-9lo7fenc.jpg) generator.\ndiscriminator.\ninput data of the\
  \ generator.\nN: 训练数据量。\n```\n\n### 判别器\n\n![](img/image-w8mzqug2.jpg)图 11.5 生成器的训练图。\n\
  \n训练判别器的目的是最小化判别器损失。判别器损失越低，判别器区分生成样本和真实样本的能力越强。如图，将真实图像（`x`）输入判别器后，期望的预测结果为 1。当使用一组随机向量（`z`）作为输入通过生成器产生生成的图像（`\
  \ `）后，将其传入判别器进行识别，期望输出为 0。当判别器对真实样本的输出接近 1 而对生成样本的输出接近 0 时，判别器损失更低，换句话说，判别器可以轻易区分真实样本和生成样本。在训练判别器期间，需要固定生成器的权重。判别器的目标函数描述如下：\n\
  \n```\n![](img/image-sdkhgft5.jpg) discriminator.\nreal image from dataset.\n: generated\
  \ image from the generator.\nN: 训练数据量。\n```\n\n![](img/image-4dvzdpr6.jpg)图 11.6\
  \ 判别器的训练图。\n\n在训练 GAN 期间，每次迭代生成器产生越来越真实的样本，而判别器变得越来越擅区分它们，如图。当判别器无法再次区分真实样本和生成样本时，过程达到平衡。\n\
  \n![](img/image-70t06h40.jpg)图 11.7 生成器在不同训练迭代次数后的输出结果变化。\n\n\n\n\n\n## 11.2: WGAN-GP\
  \ 简介\n\n在本节中，我们将分析原始 GAN [1] 和 Wasserstein 斯坦生成对抗网络 (WGAN) 的缺点。然后，我们将介绍 WGAN 的一个改进版本——带有梯度惩罚的\
  \ Wasserstein 斯坦生成对抗网络 (WGAN-GP)，它应用了梯度惩罚技术来实现 GAN 的稳定训练。\n\n### 11.2.1: 生成对抗网络的缺点\n\
  \n原始 GAN 最大的缺点是训练存在不稳定性，这是由于以下原因导致的：\n\n- 判别器训练得太完美，这意味着判别器可以很容易区分出真实数据分布和生成数据分布。如图所示，判别器预测的，在通过\
  \ `sigmoid` 激活函数后，其输出值接近 0。判别器预测并在发送到 `sigmoid` 激活函数后，其输出值接近 1。然而，如第 5 章表 5.1 所示，当\
  \ `sigmoid` 的输出值接近 0 或 1 时，其导数趋于 0。由于梯度消失问题，生成器在训练过程中很难更新权重。\n\n![](img/image-w0ya5dg1.jpg)\
  \ 图 11.8 判别器训练的情况。\n\n- 判别器训练不充分，意味着它无法正确判断真实和生成之间的区别。这可能导致真实和生成的被预测为相似。如图所示，真实和生成的重叠了，这意味着判别器无法区分真实和生成。判别器的错误判断还会导致生成器在错误方向上更新。\n\
  \n为了避免图 11.8A 所示的问题并获得如图所示的训练良好的模型，在训练期间需要仔细监控判别器损失（discriminator loss），这样生成器才有机会产生更接近真实数据的结果。\n\
  \nGAN [1] 的损失函数为：\n\n![](img/image-jmqe4iyi.jpg) (11.1)\n\n对于固定的生成器，可以通过以下方式获得最优判别器：\n\
  (11.2)\n\n因此，公式 (11.1) 可以重写为：\n(11.3)\n\n![](img/image-sxkv4uvy.jpg) ![](img/image-b9jr804v.jpg)\
  \ ![](img/image-kn178cee.jpg)\n真实数据分布。\n生成数据分布。\n判别器。\n优化后的判别器。\n\nKullback–Leibler\
  \ 散度（KL 散度），也称为相对熵，用于衡量同一概率空间上两个概率分布 `ℙ` 和 `ℚ` 之间的差异，定义为：\n(11.4)\n\nJensen–Shannon\
  \ 散度（JS 散度）基于 Kullback–Leibler 散度来衡量两个概率 `ℙ` 和 `ℚ` 之间的相似性，定义为：\n![](img/image-9puwzyi4.jpg)\
  \ (11.5)\n\n公式中使用 JS 散度，因此当使用最优判别器最小化 GAN 损失函数时，它被称为最小化 JS 散度。如果 `ℙ = ℚ`，则意味着训练模型达到了值为\
  \ `-2log2` 的全局最小值，且生成器完美地复制了数据分布。\n\n### 11.2.2: Wasserstein 距离简介\n\n如所述，训练 GAN\
  \ 是困难且不稳定的。为了解决这个问题，Wasserstein GAN (WGAN) [5] 提出了一种使用 Wasserstein 距离的新型损失函数，该距离在处处都具有平滑的梯度。Wasserstein\
  \ 距离是指将一个数据分布移动到另一个数据分布时搬运质量的最小成本。对于真实数据分布和生成器生成的数据分布，Wasserstein 距离为：\n![](img/image-2jur9xmi.jpg)\
  \ (11.6)\n\n所有可能的传输计划集合，其中联合分布的边缘分布分别为 `ℙ` 和 `ℚ`\n`x` 与 `y` 之间的距离\n: 传输计划 `γ` 的预期搬运成本\n\
  `inf`: 任何传输计划 `γ` 的下确界或最大下界\n\n根据 Kantorovich–Rubinstein 对偶性，公式 (11.6) 的 Wasserstein\
  \ 距离可以转换为以下形式：\n![](img/image-c8rp.jpg) (11.7)\n\n真实数据分布\n生成数据分布\n判别器\nLipschitz\
  \ 约束：对于判别器\n\n### 补充说明\n\n与 GAN 不同，WGAN [5] 不采用 `sigmoid` 激活函数，它输出一个标量分数。如果 `ℙ =\
  \ ℚ`，则判别器的输出接近 `+∞`；如果 `ℙ ≠ ℚ`，则输出接近 `-∞`，如图所示。\n![](img/image-22ki.jpg) (11.8)\n\
  \n为了强制判别器的 Lipschitz 约束，WGAN 使用简单的权重裁剪（weight-clipping）方法将权重限制在某个范围内。特别是，如果权重大于\
  \ `c`，则将其设置为 `c`；如果小于 `c`，则保持不变。\n\n然而，使用权重裁剪方法会遇到问题：工作 [6] 显示，模型对裁剪阈值 `c` 非常敏感。如果\
  \ `c` 稍微增大，通过网络层的梯度增大，会导致梯度爆炸。相反，如果 `c` 稍微减小，通过网络层的梯度变小，会导致梯度消失。\n\n为了解决 WGAN 的问题，提出了\
  \ WGAN-GP [6]，它使用梯度惩罚方法代替权重裁剪来强制判别器的 Lipschitz 约束。在 WGAN-GP 中，通过直接约束判别器输出相对于输入的梯度范数来应用梯度惩罚技术。WGAN-GP\
  \ 的目标函数为：\n![](img/image-th8tp.jpg) (11.9)\n\n真实数据分布\n生成数据分布\n从这些采样的点之间沿点对的直线进行均匀采样\n\
  判别器\n惩罚系数；该参数在原始工作 [6] 中被设置为 10\n\n### 11.2.3: WGAN-GP 训练\n\nWGAN-GP 的训练过程与原始 GAN\
  \ 相同，但生成器和判别器的损失函数都经过了改进以提升性能。训练生成器的目的是最小化生成器损失。生成器损失越小，生成器产生接近真实样本的能力越强。例如，将一组随机向量\
  \ `z` 输入生成器，产生一张图像 `()`。然后，将此生成的图像发送到判别器进行预测。判别器的输出越大，生成器损失越小。在训练生成器期间，判别器的权重需要固定。生成器的目标函数为：\n\
  ![](img/image-wxl6rp.jpg) (11.10)\n\n判别器\n生成器\n生成器的输入样本\nN: 数量\n\n训练判别器的目的是最小化判别器损失。判别器损失越小，判别器区分生成样本和真实样本的能力越强。在训练判别器期间，生成器的权重需要固定。判别器的损失函数公式为：\n\
  ![](img/image-sfk314.jpg) (11.11)\n\n判别器\n来自数据集的真实样本\n: 生成器生成的样本\n惩罚系数；通常设置为 10\n\
  N: 数量\n\n\n\n\n\n# 11.3 实验：WGAN-GP 的实现\n\n本节介绍了如何构建用于图像生成的 WGAN-GP 模型。为了进行实验，我们使用了大规模的\
