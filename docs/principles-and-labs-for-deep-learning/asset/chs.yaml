  ![](img/image-eyo0q6qr.jpg)\n\n\n\n\n\n## 2.4: TensorBoard 简介\n\nTensorBoard 是 TensorFlow\
  \ 的一个工具包，为机器学习实验提供了所需的可视化和测量功能，例如跟踪训练过程中的损失值和模型准确率、可视化模型图、查看直方图等。使用 TensorBoard\
  \ 有两种常用方法：\n\n(1) 在使用 Keras 的 `Model.fit` 进行训练时，添加 `tf.keras.callbacks.TensorBoard`\
  \ 函数来创建和存储日志；\n(2) 在使用 `tf.GradientTape()`或其他方法进行训练时，使用 `tf.summary` API 记录信息。\n\
  \nTensorBoard 的图形界面如图所示。TensorBoard 有四个主要的工具：Scalars（标量）面板、Graphs（图）面板、Distributions（分布）面板和\
  \ Histograms（直方图）面板。\n\n- **Scalars 面板**：有助于在训练神经网络期间跟踪学习率、损失、准确率等标量值。\n- **Graphs\
  \ 面板**：有助于可视化由 TensorFlow 构建的模型。\n- **Distributions 和 Histograms 面板**：有助于显示张量的分布。它们被广泛用于可视化\
  \ TensorFlow 权重和偏置。\n\n![](img/image-s0fpyffe.jpg)图 2.14 TensorBoard 的图形界面。\n\n\
  ### TensorBoard 的优缺点包括：\n\n- 在模型训练期间的信息（如损失、准确率的变化、权重和偏置的直方图等）可以实时跟踪和查看，而无需等到训练完成。\n\
