  \n# 第 7 章：高级 TensorBoard\n\n## 摘要\nTensorBoard 是 TensorFlow 的官方工具包，为设计神经网络和机器学习实验提供了所需的可视化支持。`tf.keras.callbacks.TensorBoard`\
  \ 函数在支持训练过程中神经网络的各种状态和统计信息方面存在限制。本章介绍了如何使用 TensorFlow 的 `tf.summary` 模块编写摘要数据并在\
  \ TensorBoard 上显示，提供了许多应用程序接口（API），如 `tf.summary.scalar`、`tf.summary.image`、`tf.summary.text`、`tf.summary.audio`\
  \ 和 `tf.summary.histogram`。为了帮助读者深入使用 TensorBoard，我们展示了可视化神经网络训练结果的两种场景。在第一场景中，我们应用\
  \ `tf.summary.image` API 来观察图像结果。在第二场景中，我们使用带有 HParams Dashboard 的超参数调优技术，为特定问题的网络模型设计识别最合适的超参数（学习率、优化器、权重初始化方法等）。\n\
  \n**关键词：**\nTensorBoard；超参数调优；`tf.summary`；HParams Dashboard；可视化工具；训练结果\n\n## 大纲\n\
  - TensorBoard 以及用于写入数据（如文本、音频和图像）的底层应用程序接口（API）\n- 通过结合 `tf.summary.image` API 和自定义回调，在\
  \ TensorBoard 上输出训练过程中神经网络图像\n- TensorBoard 中的 HParams Dashboard，用于为特定问题的神经网络设计识别最合适的超参数\n\
  \n\n\n\n\n## 7.1: 高级 TensorBoard\n\nTensorBoard 是 TensorFlow 的官方工具包，为设计神经网络和进行机器学习实验提供了所需的可视化支持。第\
  \ 2 章和第 5 章介绍了四个可视化函数的使用，包括 `Scalars`标量、`Graphs`图、`Distributions`分布和 `Histograms`直方图，只需使用\
  \ `tf.keras.callbacks.TensorBoard` 即可完成设置。然而，高级 Keras API 中的 `tf.keras.callbacks.TensorBoard`\
  \ 函数在提供神经网络训练过程中各种状态和统计信息方面存在限制。例如，在 TensorBoard 的 `Scalars` 板中，只能观察到 `loss` 和 `accuracy`\
  \ 等关键指标，以及它们随训练过程的变化情况。如果我们想观察和分析训练期间网络模型的输出结果（如图像、文本等），则需要使用自定义函数。本章介绍了如何使用 TensorFlow\
  \ 的 `tf.summary` 模块编写摘要数据并在 TensorBoard 上显示，该模块提供了以下 API：\n\n- 写入标量摘要，例如损失函数值、准确率值或学习率\n\
  - 写入图像摘要\n- 写入文本摘要\n- 写入音频摘要\n- 写入直方图摘要\n\n下节将介绍 `tf.summary` 模块的使用。\n\n![](img/image-8b16k8g4.jpg)\
  \ TensorBoard 结果：通过命令行打开 TensorBoard 查看结果，如图所示。由于数据尚未写入日志文件，因此没有对应的数据仪表板激活。\n\n\
