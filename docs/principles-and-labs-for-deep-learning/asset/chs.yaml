  \ 性能的影响的信息。\n\n### 층\n池化层通常紧接卷积层之后，以减少输入张量的空间尺寸（宽度和高度），从而减少 `CNN` 的计算并在训练过程中避免过拟合问题。池化层与输入的每个通道独立工作，因此通道数或深度维度保持不变，所示。存在一些池化层，如最大池化、平均池化和\
  \ L2 范数池化层。其中，采用最大操作的最大池化层在 `CNNs` 中最常用，因为它在实践中被证明更有效。图 4.11 中的示例是最大池化层的操作，大小为 `4\
  \ × 4` 的输入通过 `2 × 2` 的卷积核和步长 2 进行池化，产生大小为 `2 × 2` 的输出。\n\n![](img/image-ngv80c0x.jpg)\n\
  图 4.10 池化层示意图。池化层在输入张量的每个通道中独立工作。\n![](img/image-9kz3h0bb.jpg)\n图 4.11 最大池化层的操作。\n\
  \n### 连接\n全连接层或密集层是 `CNNs` 的重要组件。该层的神经元与上一层的所有神经元全连接。它已成功应用于图像分类、语义分割等许多计算机视觉应用。在\
  \ `CNNs` 中，首先通过卷积层和池化层执行卷积和池化操作以从输入中提取特征。所得特征在发送到全连接层组合数据并驱动最终输出之前，被展平为一维特征向量，所示。如果神经网络仅由全连接层构建，则被称为全连接网络。全连接网络通常计算开销极大，且性能低于\
  \ `CNNs`。在下一节中，我们将同时应用全连接网络和 `CNN`。\n![](img/image-3nixst6.jpg)\n图 4.12 全连接层的连接。\n\
  \n## 4.1.3: 卷积神经网络的操作\n在 `CNNs` 中，每个卷积层都有从输入提取特征的卷积核，使用不同值的卷积核可以获得各种效果，所示卷积在开始时没有意义；它们的值在训练期间需要初始化和更新。\n\
  表 4.1\n![](img/image-0CT97QD.jpg)\n前面的描述只提到了有一个卷积层的网络。具有多层的 `CNNs` 是如何工作的？图 4.13\
  \ 展示了深度 `CNN` 的操作，其中前几层卷积层（1-3 层）主要负责提取简单特征，如边缘、线条等。然后将所得特征发送到更深层层（4-6 层）以生成更具体的特征，如鼻子、眼睛和耳朵。最后，这些输出特征通过展平层展平为一维特征向量，然后输入全连接层进行最终预测。\n\
  ![](img/image-ctcsukvx.jpg)\n图 4.13 深度卷积网络。\n\n图中显示了 `CNN` 特征可视化的示例，其中 ImageNet\
  \ [2] 上训练的 VGG-16 [6] 网络和 DeconvNet [7] 用于获取结果。所示 VGG-16 网络的浅层（2 层）对线条和边缘的结合有反应。\n\
  ![](img/image-5m6yrhsh.jpg)\n图 4.14 训练的 VGG-16 模型第二层的特征可视化。\n![](img/image-8qbt0p98.jpg)\n\
  图 4.15 训练的 VGG-16 模型第七层的特征可视化。\n![](img/image-lnppp9jf.jpg)\n图 4.16 训练的 VGG-16 模型第十五层的特征可视化。\n\
  \n图中 VGG-16 网络中间层（7 层）包含更复杂的不变性，提取类似的纹理，如月亮的形状、窗户和房屋。图中 VGG-16 网络的深层（15 层）呈现出显著的变性和更高的类别特异性，例如狗和猫的眼睛、耳朵，鸟的腿和姿态等。\n\
  \n\n\n\n\n## 4.2 多类别分类\n\n## 4.2.1 多类别分类简介\n\n在机器学习中，多类别分类是指将样本归类为三个或更多类别中的某一个的问题。与在该章介绍的二分类模型类似，多类别分类模型也用于对类别概率进行建模。然而，与二分类模型输出单一概率来将输入样本推断为两个类别之一不同，多类别分类模型为每个类别生成一个概率，其中输出概率分之和应等于\
  \ 1，如图所示。基于预测的概率分，模型可以确定输入样本属于哪个目标类别。例如，给定一个分类三个类别的模型，在将样本输入模型后，它输出的类别 1 的概率分数为\
  \ 0.7，类别 2 为 0.1，类别 3 为 0.2。这意味着模型认为输入样本有 70% 的置信度属于类别 1，10% 的置信度属于类别 2，20% 的概率属于类别\
  \ 3。\n\n![](img/image-7ypkeye2.jpg)图 4.17 分类模型流程图。\n\n## 4.2.2 多类别分类模型架构\n\n如在该节介绍的，最先进的多类别分类模型基于\
  \ `CNNs`，它具有特征提取器和分类器两个主要部分，如图所示。\n\n![](img/image-hw39h3oy.jpg)图 4.18 基于 CNN 的多类别分类模型架构。\n\
  \n### Feature\n特征提取器由卷积层和池化层组成，用于从输入中提取特征。分类器由全连接层组成，结合来自特征提取器的提取特征来执行最终的分类决策。为了实现这一目标，最后一个全连接层后面跟着\
  \ `softmax` 函数，用于计算每个目标类别的概率分。根据概率模型的描述，`softmax` 函数的每个输出值都在 0 到 1 之间，且所有输出值之和等于\
  \ 1。`softmax` 函数表示为：\n\n![](img/image-iidzcp2i.jpg)\n\n例如，一个分类三个类别的模型（C = 3）在最后一层输出三个值\
  \ [3, 1, -3]，这些值通过 `softmax` 函数转换成分别为 0.88、0.12 和 0 的概率分，如图所示。基于这些输出概率分，输入样本显然属于第一类。\n\
  \n![](img/image-xz022oeq.jpg)图 4.19 Softmax 输出计算。\n\n### function\n如在前一章提到的，分类问题可以分为二分类问题和多类别分类问题。虽然二分类交叉熵（`BCE`）通常用作二分类模型的损失函数，但类别交叉熵（`CCE`）被用多类别分类模型的损失函数。`CCE`\
  \ 损失函数是 `softmax` 函数和交叉熵（`CE`）函数的组合。它也被称为 softmax loss，如图所示\n\n![](img/image-y3y1q5gg.jpg)图\
  \ 4.20 类别交叉熵 (CCE)。\n\n`CE` 的公式定义为：\n\n![](img/image-5b65wyx.jpg)\n\n`CCE` 的公式表示为：\n\
  \n![](img/image-0ttz9pw.jpg)\n\n其中，$y$ 是期望输出，$\\hat{y}$ 是模型的预测值，$f$ 是 `softmax`\
  \ 函数，$C$ 是类别数量，$N$ 是一个批次的数据量。图 4.21 显示了计算 `CCE` 的示例。输出层后接 `softmax` 函数的神经网络以“cat”图像作为输入，输出预测结果\
  \ [0,0,0,0,0.6,0,0,0.1,0,0.3]。期望输出 [0,0,0,1,0,0,0,0,0] 与预测结果之间的误差使用以下公式计算：\n\n![](img/image-2zxm9ppn.jpg)\n\
  ![](img/image-wipcpnzd.jpg)\n![](img/image-2n9pps4a.jpg)\n![](img/image-8ma4x6rp.jpg)图\
  \ 4.21 使用类别交叉熵 (CCE) 的计算示例。\n\n## 4.2.3 数据增强\n\n在该章提到的，深度学习模型在训练过程中经常遇到过拟合问题。因此，使用了三种方法来防止这个问题：减小模型尺寸、权重正则化和丢弃（dropout）。处理过拟合问题的另一种方法是通过对可用数据应用不同的变换来增加训练数据的数量和多样性；这被称为数据增强。由于数据增强最常用于图像处理，因此也被称为图像增强。通过使用图像增强，数据量可以比原始数据增加两倍，如图所示。常见的图像变换技术包括：\n\
  \n- 翻转（flipping）\n- 旋转（rotation）\n- 平移（shifting）\n- 缩放（scaling）\n- 转换（对比度、饱和度或亮度等）\n\
  - 图像处理（高斯模糊或平均模糊等）\n- 噪声（高斯噪声或盐椒噪声等）\n\n![](img/image-ozhya9sx.jpg)图 4.22 图像增强示例。\n\
  \n\n\n\n\n# 4.3: 实验：CIFAR-10 图像分类\n\n在本节中，我们使用 `CIFAR-10` 数据集来训练和评估多类别分类模型的性能。在训练过程中，我们分别使用\
  \ `CCE` 和 `Adam` 作为损失函数和优化器。网络模型在三种场景下实现：\n* 全连接神经网络 (`FCNN`)\n* 未应用图像数据增强技术进行模型训练的\
