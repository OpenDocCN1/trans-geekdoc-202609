  \ 上可视化模型图。\n\n\n\n\n\n# 2.5: 实验 2：过拟合问题\n\n## 2.5.1: 过拟合简介\n\n过拟合是指网络模型在训练数据上获得了很好的性能，但在验证数据上的表现很差。通常使用训练损失曲线来观察是否存在过拟合问题。图\
  \ 2.18 展示了过拟合现象，其中训练数据的损失值（训练误差）在训练一段时间后持续下降，而验证数据的损失值（验证误差）逐渐增加。\n\n![](img/image-123mw656.jpg)\n\
  图 2.18 过拟合现象。\n\n第 2.3 节中房价预测模型的训练结果如图，从损失曲线图中也可以观察到过拟合现象。\n\n![](img/image-l7ynuve8.jpg)\n\
  图 2.19 训练房价预测模型时的过拟合问题。\n\n过拟合通常发生在训练数据规模太小或模型复杂度过大时。因此，增加训练数据或简化模型可能会改善过拟合问题。在不增加数据量的情况下，防止过拟合的三种方法是：\n\
  \n- **模型大小**：当模型的参数数量减少时，参数较少的模型将无法轻易拟合所有训练数据。模型必须学习如何使用有限的参数来学习有效的特征表示。\n- **权重正则化**：在训练神经网络模型时，网络权重的大小会增加。网络训练得越久，网络权重就越大。具有大权重的神经网络通常是不稳定的，因为输入的微小变化就会导致输出的巨大变化，这可能是神经网络训练数据过拟合的标志。为了解决过拟合问题，权重正则化的核心思想是在训练过程中限制网络权重的大小。为了惩罚大权重，首先计算权重大小，然后在训练模型时将计算结果添加到损失函数中。计算权重大小有两种主要方法：`L1\
  \ 正则化`和`L2 正则化`，也称为权重衰减。\n    - `L1 正则化`：\n      ![](img/image-2dsobhi0.jpg)\n \
  \   - `L2 正则化`：\n      ![](img/image-1ww2b1mh.jpg)\n      其中 `λ` 是控制惩罚的正则化参数，`λ`\
  \ ∈ `[0, 1]`，`w` 是模型的权重，`M` 是模型的参数总数，`MSE` 是损失函数。\n- **Dropout 技术**：Dropout 技术指的是在神经网络中随机丢弃神经元，以防止在训练过程中出现复杂的共同适应。在丢弃神经元时，它们会被临时从网络中取出，其与其他神经元的连接也会被移除，如图所示。Dropout\
  \ 技术已被证明在语音识别、图像分类等许多应用中解决过拟合问题并提高神经网络性能是有效的。\n\n![](img/image-hoezykub.jpg)\n图\
  \ 2.20 随机丢弃（Random dropout）。\n\n## 2.5.2: 代码示例\n\n本节继续使用房价预测模型（`Model-1`）测试过拟合。我们通过基于\
