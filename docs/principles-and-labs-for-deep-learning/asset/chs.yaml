  \ the IEEE Signal Process. Mag. 2012;29(6):141–142.\n\n第 11 章：生成对抗网络\n\n摘要\n生成对抗网络（GAN）在许多计算机视觉任务如图像生成、文本生成、文本到图像生成、图像转换等方面显示了卓越的结果。本章讨论了\
