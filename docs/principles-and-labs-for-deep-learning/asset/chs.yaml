  \ 变分自编码器简介\n\n### 10.2.1: VAE 简介\n`VAE` [4] 是 `AE` 的高级版本，它学习数据生成分布，使其能够从潜分布中提取随机代码或潜在表示，生成与输入数据具有相似特征的输出数据。图\
  \ 10.3 显示了 `VAE` 和 `AE` 之间的区别。\n\n![](img/image-xvka3sht.jpg)图 10.3 自编码器 (AE) 与变分自编码器\
  \ (VAE) 的区别。\n\n图 10.4 显示了 `VAE` 的概念。所示，编码器接收输入数据并输出两个向量，包括均值向量 (`μ`) 和用于生成潜分布的方差向量。然后，从潜分布中随机采样一个代码或潜在表示，通过解码器生成输出数据。\n\
  \n![](img/image-egoec97d.jpg)图 10.4 变分自编码器 (VAE) 的概念图。\n\n至于为什么 `VAE` 有可以从潜分布中随机采样的代码，这里有一个直观的例子来解释。如图所示，图像\
  \ A 和 B 被用编码器的输入。在编码器的输出处，采样了两个代码，即 `Code A` 和 `Code B`，并发送到解码器以产生 `Output A` 和\
  \ `Output B`。由于两个分布之间存在交集，可以从这个交集中产生 `Output A` 和 `Output B` 之间的额外 `Output C`。这种设计使得\
  \ `VAE` 的输出具有连续关系，例如 `Output A`、`Output B` 和 `Output C` 之间的连续关系。\n\n![](img/image-lch4234g.jpg)图\
  \ 10.5 在 `VAE` 中使用潜分布的优势。\n\n### 10.2.2: VAE 的操作\n如前所述，`AE` 直接输出潜空间表示的值，而 `VAE`\
  \ 的编码器输出两个均值 (`μ`) 和方差向量来生成潜分布。解码器从潜分布中随机采样的代码来重构原始输入。在训练 `VAE` 模型时，通过反向传播算法计算模型参数与最终损失之间的关系。然而，对于随机采样过程无法做到这一点，因为没有用于计算的值。为了解决这个问题，`VAE`\
  \ 采用了重参数化技巧（reparametrization trick）进行采样，其中从标准正态分布中随机采样一个 `ε`，与潜分布的参数 `μ` 结合计算编码器的输出代码，定义所示。遵循这一技巧，可以在训练过程中优化潜分布的\
  \ `μ` 和 `σ`，同时允许从该分布中随机采样。使用代码的另一种更直观的解释是，`μ` 被视为 `AE` 的代码，该代码在 `VAE` 中加入噪声以产生代码\
  \ `C`，并希望 `C` 仍然可以解码为原始输入。\n\n![](img/image-8sevqp4j.jpg)图 10.6 变分自编码器 (VAE) 图。\n\
  \n采用与章节类似的示例，`VAE` 的编码器产生 225 组 2D 向量代码，然后将这些组通过解码器生成 225 张手写数字图像，如图所示。所示，每个图像都是一个易于识别的数字，并且彼此平滑地转换为另一个。\n\
  \n![](img/image-tutx4bc8.jpg)图 10.7 变分自编码器 (VAE) 生成图像的示例。\n\n## 10.2.3: 变分自编码器损失函数\n\
  `VAE` 模型的训练目标是确保预测输出与输入尽可能相似。如果数据包含图像样本，可以使用重构图像与输入图像每个像素之间的二元交叉熵 (`BCE`) 损失进行训练。这种损失被称为重构损失，公式如下：\n\
  \n![](img/image-w1v1spzz.jpg) 输入图像：重构图像。图像宽度。图像高度。通道数量。\n\n然而，如果只使用重构损失训练 `VAE`\
  \ 模型是不够的。如图所示，控制噪声规模的是由编码器学习的。如果编码器学习输出 0，则不添加噪声来计算输出代码。如果计算代码时不包含噪声，`VAE` 模型的输出代码将与\
  \ `AE` 模型相似，这意味着没有给 `VAE` 模型添加对编码表示的约束。图中显示了 的图，其中，该的值越小，该的值越接近于 0。\n\n![](img/image-rwsiwh0a.jpg)图\
  \ 10.8 `exp ( σ ² )` 的图。\n\n为了解决这个问题，引入了 来限制该的值。如果该的值等于 0，则必须为 0。此时，该的值等于 1，因此解决了编码器向\
  \ `= 0` 方向更新的问题。图 10.9 显示了其公式所示：\n\n![](img/image-b3otot2t.jpg)\n![](img/image-rrodw5lj.jpg)图\
  \ 10.9 `exp(σ i²) — (1 + σ i²)` 的图。\n\n此外，应用了 L2 正则化，公式如下：\n\n![](img/image-rew2hivm.jpg)\n\
  \n最后，通过引入和建立了，也称为 Kullback–Leibler 散度损失 (`KL Loss`)，表示如下：\n\n![](img/image-c2v241kd.jpg)\
  \ 均值（编码器的输出之一）。方差（编码器的另一个输出）。批量大小。\n\n\n\n\n\n# 10.3: 实验：变分自编码器模型的实现\n\n本节介绍了一个用于构建\
