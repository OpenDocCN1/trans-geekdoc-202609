  \ 第 5 章：神经网络训练\n\n## 摘要\n神经网络的训练是一个寻找合适权重集的过程，以实现在训练数据和验证数据上获得高性能。本章介绍了训练网络模型时使用的一些重要技术，包括反向传播、权重初始化和批次归一化。随后，我们检查了每种权重初始化技术的有效性，并通过将批次归一化应用于\
  \ CIFAR-10 数据集的神经网络模型训练，验证了其有效性。最后，我们通过 TensorBoard 上对第 4 章和本章中所有训练过的神经网络的性能进行了总结、比较和可视化，以观察每种技术对训练过程中模型收敛的影响。\n\
  \n## 关键词\n反向传播；权重初始化；Glorot 初始化；He 初始化；批次归一化\n\n## 目录\n- 用于训练神经网络的反向传播算法\n- 权重初始化的重要性\n\
  - 使用 TensorBoard 观察神经网络的权重分布\n- 批次归一化的性\n- 不同神经网络训练技术的有效性\n\n## 5.1: 反向传播\n\n###\
  \ 5.1.1 反向传播简介\n反向传播（Backpropagation, BP）[1] 是一种结合梯度下降来更新神经网络权重的方法，我们在之前的章节中介绍过。梯度下降是用于神经网络进行优化的最常用算法之一。通过计算梯度并向反方向移动，可以在训练过程中减小网络预测结果与预期输出之间的误差。权重更新公式为：\n\
  \n![](img/image-cpxz2hdj.jpg)\n\n其中 `L` 是损失函数，`η` 是学习率，`W` 是神经网络的权重。通过上述公式，`BP`\
  \ 方法被用于计算每个输入和输出示例的损失函数相对于神经网络权重的梯度。以下是一个解释如何计算梯度的示例。\n\n图 5.1 显示了带有前向传播计算的单层神经网络的示意图。其计算过程为：\n\
  \n![](img/image-jo1mgf5d.jpg) ![](img/image-nwimaqqw.jpg) ![](img/image-4d6sp5uk.jpg)\
  \ 其中 `x` 和 `b` 是输入数据；`w` 是网络的权重；`f` 是激活函数；`ŷ` 是神经网络的预测值，`y` 是预期输出。\n\n![](img/image-q5329bcl.jpg)\
  \ 图 5.1 单层神经网络的前向传播计算图。\n\n`BP` 用于计算梯度 `∂L/∂∂W` 并更新网络权重，如如图所示。其计算过程为：\n\n![](img/image-265bu1et.jpg)\
  \ ![](img/image-yzmxqdtg.jpg) ![](img/image-y2yf57xv.jpg) ![](img/image-i380z9pp.jpg)\
  \ 图 5.2 单层神经网络的反向传播（BP）计算图。\n\n### 5.1.2 梯度消失问题\n梯度消失是指在训练神经网络时（尤其是使用梯度法和 `BP` 训练深层神经网络\
  \ DNNs 时）所会遇到的问题。表 5.1 列出了三种常见的激活函数：sigmoid、tanh 和正向线性单元（`ReLU`）。在神经网络的隐藏层中使用 `sigmoid`\
  \ 和 `tanh` 激活函数可能会导致梯度消失问题。例如，当通过 `sigmoid` 激活函数层执行 `BP` 时，需要与 `sigmoid` 函数的梯度相乘。`sigmoid`\
  \ 导数的最大值为 0.25，这意味着梯度在一次传递后将衰减 0.25 倍。如果神经网络有五层，梯度将至少减少 0.25⁵，这使得难以更新神经网络的前层权重。同样，`tanh`\
  \ 激活函数也存在这种情况。最近，隐藏层通常采用 `ReLU` 激活函数，因为它在输入为正时直接输出输入，否则输出零，从而克服梯度消失问题，并允许神经网络学习得更快、更有效。\n\
  \n表 5.1\n\n这里我们解释在神经网络中使用 `sigmoid` 激活函数时的梯度消失。假设有一个双层神经网络，每层都使用 `sigmoid` 激活函数计算输出值，输入权重\
  \ `w` 和 `b` 以及预期输出 `y`，图 5.3 显示了带有前向传播计算的网络示意图。其计算过程为：\n\n![](img/image-2mzto0i7.jpg)\
  \ ![](img/image-gw8av86g.jpg) ![](img/image-szngovj4.jpg) ![](img/image-bel9vnco.jpg)\
  \ ![](img/image-wmo5sslq.jpg) 这里\n\n![](img/image-zwtxgtzr.jpg) ![](img/image-yijxy26b.jpg)\
  \ 图 5.3 双层神经网络的前向传播计算图。\n\n如图所示，`∂L/∂w` 是通过 `BP` 方法计算的，其计算过程为：\n\n![](img/image-7r45azuw.jpg)\
  \ ![](img/image-amo05uxo.jpg) ![](img/image-tfenb475.jpg) ![](img/image-as86root.jpg)\
  \ 图 5.4 双层神经网络的反向传播（BP）计算图。\n\n从上述 `BP` 的计算可以发现，在每个 `sigmoid` 激活函数之后，计算值将至少减少 0.25\
  \ 倍，因此传输层越多，梯度衰减就越严重。这就是训练 `DNNs` 期间梯度消失的原因。\n\n`ŷ` 的计算结果通过使用 `TensorFlow` 程序进行了验证，如下所示。\n\
  \n![](img/image-cpxukezq.jpg)\n\n\n\n\n\n## 5.2: 权重初始化\n\n权重初始化在神经网络的训练中起着至关重要的作用，因为它直接影响模型的收敛。在本节中，我们将介绍并分析三种权重初始化方法，以及它们对构建神经网络的影响。在接下来，我们将简要描述这三种不同的权重初始化方法。\n\
  \n分布初始化（distribution initialization）：正态分布的最简单情况是当参数 `μ`（均值）设置为 0 且参数 `σ`（标准差）设置为\
  \ 1 时，称为标准正态分布。在下面的实验中，使用带有 sigmoid 激活函数的神经网络来分析 `μ = 0` 和 `σ = 1` 的正态分布，以及 `μ =\
  \ 0` 和 `σ = 0.01` 的正态分布。最终分析结果显示，`μ = 0` 和 `σ = 1` 的正态分布是梯度消失的原因。\n\nGlorot 初始化（Glorot\
  \ initialization）：这种方法通过尝试保持神经网络所有层中梯度规模大致相同，来改进正态分布初始化方法的问题。然而，对于使用 ReLU 激活函数的深度神经网络（DNN），使用\
  \ Glorot 初始化在训练过程中仍然会出现梯度消失现象。\n\n初始化（initialization）：这种方法解决了在 DNN 中采用 ReLU 激活函数时使用\
  \ Xavier 或 Glorot 初始化出现的问题，通过使每层的输出分布更加均匀来实现。\n\n下面将详细介绍并分析每种初始化方法在训练和开发神经网络中的影响。我们还列出了程序示例所需的各种包。\n\
  \n![](img/image-84728uz3.jpg)\n\n### 5.2.1: 正态分布\n\n带有 sigmoid 激活函数的神经网络以及 `μ =\
  \ 0` 和 `σ = 1` 的正态分布\n\n为了构建模型，使用了以下网络层：\n- 形状为 `(100,)` 的输入层。\n- （全连接层）：使用 `sigmoid`\
  \ 作为激活函数，并采用 `μ = 0` 和 `σ = 1` 的正态分布进行权重初始化；不使用偏置。\n\n![](img/image-gbr56g8v.jpg)\n\
  \n结果显示，大部分输出值分布在 0 和 1 附近。应用 `BP`（请参考表中的 sigmoid 函数导数）时，梯度值将趋于零，导致梯度消失问题。因此，`μ =\
  \ 0` 和 `σ = 1` 的正态分布并不是一种有效的权重初始化方法。\n\n带有 sigmoid 激活函数的神经网络以及 `μ = 0` 和 `σ = 0.01`\
  \ 的正态分布\n\n为了构建模型，使用了以下网络层：\n- 形状为 `(100,)` 的输入层\n- （全连接层）：使用 `sigmoid` 作为激活函数，并采用\
  \ `μ = 0` 和 `σ = 0.01` 的正态分布进行权重初始化；不使用偏置\n\n![](img/image-n9xdpwmh.jpg)\n\n结果显示，第二层的输出值大多分布在\
  \ 0.5 左右，应用 `BP`（请参考表中的 sigmoid 函数导数）时梯度值将在 0.25 左右。虽然梯度问题得到了改善，但在由许多卷积层组成的深度网络中，它仍然可能发生。\n\
  \n### 5.2.2: Glorot 初始化\n\n带有 Glorot 初始化和 sigmoid 激活函数的神经网络\n\nGlorot 等人 [6] 在 2010\
  \ 年提出了 Glorot 初始化方法。它在许多 DNN 中被广泛使用，并被视为 `Keras` 中的默认权重初始化方法。为了构建模型，使用了以下网络层：\n\
  - 形状为 `(100,)` 的输入层\n- （全连接层）：使用 `sigmoid` 作为激活函数，并采用 Glorot 方法进行权重初始化；不使用偏置\n\n\
  ![](img/image-l9h1s9j.jpg)\n\n结果显示，Glorot 初始化方法产生的输出分布比正态分布方法更宽。这有助于防止训练过程中的梯度消失，并允许神经网络学习数据。因此，对于带有\
  \ sigmoid 或 tanh 激活函数的神经网络，建议使用 Glorot 权重初始化方法。\n\n带有 Glorot 初始化和 ReLU 激活函数的神经网络\n\
  \n为了构建模型，使用了以下层：\n- 形状为 `(100,)` 的输入层\n- （全连接层）：使用 `ReLU` 作为激活函数，并采用 Glorot 进行权重初始化；不使用偏置。\n\
  \n![](img/image-oeg7q95l.jpg)\n\n结果显示，当网络模型的层数增加时，深层的输出分布更接近 0，这可能在训练过程中导致梯度消失问题。因此，不建议对使用\
  \ ReLU 激活函数的 DNN 使用 Glorot 权重初始化方法。\n\n### 5.2.3: He 初始化\n\n带有 He 初始化和 ReLU 激活函数的神经网络\n\
  \n何恺明 [7] 在 2015 年提出了 He 初始化方法。事实证明，在使用带有 ReLU 激活函数的 DNN 时，该方法对于防止梯度消失问题是非常有效的。为了构建模型，使用了以下层：\n\
  - 形状为 `(100,)` 的输入层\n- （全连接层）：使用 `ReLU` 作为激活函数，并采用 He 方法进行权重初始化；不使用偏置\n\n![](img/image-9lg5y64i.jpg)\n\
  \n结果显示，当带有 ReLU 激活函数的深度网络使用 He 初始化方法时，每层的输出分布都非常均匀。成功解决了在带有 ReLU 激活函数的 DNN 中使用 Glorot\
  \ 初始化方法的问题。\n\n以下点总结了本节的知识：\n- 使用带有 sigmoid 或 tanh 激活函数的神经网络时，建议使用 Glorot 方法进行权重初始化。\n\
  - 使用带有 ReLU 激活函数的神经网络时，建议使用 He 方法进行权重初始化。\n- 使用 ReLU 激活函数的网络通常比带有 sigmoid 或 tanh\
  \ 激活函数的 DNN 获得更好的性能。\n\n\n\n\n\n## 5.3 批量归一化\n\n## 5.3.1 批量归一化简介\n\nIoffe 和 Szegedy\
  \ [8] 于 2015 年提出了批量归一化算法。它允许使用高学习率来加速神经网络的训练，同时减少了对权重初始化的依赖。在训练神经网络时，网络层的输出分布会发生变化。后层必须不断适应前一层输出分布的变化，也就是说每一层都需要根据前一层的输出分布进行调整。这导致神经网络由于需要仔细的权重初始化和较低的学习率，使得权重更新得非常缓慢。\n\
  \n为了解决这个问题，批量归一化的核心思想是对神经网络每一层的每批次（batch）输入数据和输出进行归一化处理。\n\n如图所示，网络层的输出均匀地分布在 −10\
  \ 到 10 之间。在通过 `tanh` 激活函数后，输出分布不再均匀；大多数输出值分布在 −1 和 1 附近，这会导致梯度消失问题（参见表中的 `tanh`\
  \ 函数数）。如图，网络层的输出首先被归一化到 -2 到 2 的范围内，然后通过 `tanh` 激活函数，与未使用归一化的情况相比，产生了更均匀的输出分布。\n\
  \n![](img/image-m2rj6tmd.jpg)\n图 5.5 使用归一化与未使用归一化的输出分布对比。\n\n对于输入的批次数据，批量归一化变换通过四个步骤表示：\n\
  \n1. 计算批次的均值：\n![](img/image-yvtbhm9.jpg)\n2. 计算批次的方差：\n![](img/image-ctuo5wc9.jpg)\n\
  3. 归一化值：\n![](img/image-savhv3hl.jpg)\n其中 `ε` 是为了数值稳定性性的常数。\n4. 缩放和位移：\n![](img/image-bqyg4lke.jpg)\n\
  其中 yᵤ 表示批量归一化变换的输出，α 和 β 是需要学习的参数。\n\n通过在神经网络中添加批量归一化变换，可以对任何激活函数进行处理。在下一节中，我们将介绍批量归一化在神经网络中的位置。\n\
  \n以下点总结了批量归一化的优点：\n- 通过使用学习率加速神经网络的训练\n- 减少神经网络训练中的过拟合问题\n- 减少梯度消失和梯度爆炸问题\n- 消消了使用\
  \ dropout 技术防止数据信息丢失的需求\n\n## 5.3.2 带有批量归一化的神经网络\n\n批量归一化已成功应用于神经网络，以提高各种计算机视觉应用的性能，如图像分类、图像识别、目标检测、图像到翻译等。带有批量归一化的神经网络与普通神经网络略有不同，其中批量归一化的位置位于卷积层和激活函数之间，如图所示。\n\
