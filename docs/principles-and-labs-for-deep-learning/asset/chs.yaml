  \ Zacharias J., Barz M., Sonntag D. A survey on deep learning toolkits and libraries\
  \ for intelligent user CoRR; 2018. vol. abs/1803.0418.\n[3] Abadi M., Agarwal A.,\
  \ Barham P., Brecardo E., Chen Z., Citro C., Corrado G., Davis A., Dean J., Devin\
  \ M., Ghemawat S., Goodfellow I., Harp A., Irving G., Isard M., Jia Y., Jozefowicz\
  \ R., Kaiser L., Kudlur M., Levenberg J., Mane D., Monga R., Moore S., Murray D.,\
  \ Olah C., Schuster M., Shlens J., Steiner B., Sutskever I., Talwar K., Tucker P.,\
