  \ Jupyter Notebook 上运行代码。\n\n# 第 1  own：TensorFlow 2 简介\n\n## 摘要\n目前已引入许多开源工具用于开发和训练机器学习模型。与其他工具包相比，TensorFlow\
  \ 在 GitHub 上吸引了最多的用户。TensorFlow 2 是 TensorFlow 1 的改进版本，侧重于简单的执行、易的模型构建和稳健的模型部署。本章详细介绍了\
  \ TensorFlow 2 的三个主要更新功能：(1) 动态执行（eager execution），提供了一个可以立即评估操作而无需构建图的编程环境；(2)\
  \ Keras，一个高层应用程序编程接口（API），用于快速方便地设计和训练网络模型；(3) `tf.data`，一个允许用简单方式构建复杂输入流水线的 API。\n\
  \n**关键词**\nTensorFlow 2；动态执行；Keras；序列模型；函数式模型\n\n**大纲**\n- 了解深度学习\n- TensorFlow\
  \ 2\n- 从 TensorFlow 2 开始\n- 使用 `tf.keras` 构建神经网络\n- 使用 `tf.data` 构建输入流水线\n\n## 1.1\
  \ 深度学习\n\n### 1.1.1 深度学习简介\n人工智能（AI）是指赋予机器学习和模仿人类行为的能力。它主要用于辅助人类，特别是取代高重复、低技能的工作。AI\
  \ 是一个综合领域，包括进化计算、专家系统、符号 AI、支持向量机（SVMs）、机器学习、深度学习和强化学习。机器学习是 AI 的一个分支，涉及强化学习、深度学习等。深度学习是指使用神经网络，即输入层、隐藏层和输出层。深度学习中的“深”指的是使用多层对数据进行转换层。它是目前最流行的技术，因为它支持神经网络，如图所示。\n\
  \n![](img/image-pugmfy.jpg)\n图 1 深度学习\n\n在深度学习中，一组数据被输入神经网络，神经网络被描述为通过有向图的一系列计算步骤。通过使用\
  \ `CNTK` 构建深度学习模型，网络的权重将得到更新。深度学习广泛应用于计算机视觉、语音识别和自然语言等领域。\n\n### 1.1.2 深度学习工具包\n\
  目前已引入许多开源工具用于开发和训练机器学习模型。最流行的深度学习工具包如下：\n\n- **TensorFlow**: 一个用 Python 和 C++ 编写的端到端开源平台，提供了全面的工具和库生态系统，帮助开发者轻松地构建和部署机器学习模型。\n\
  - **Keras**: 一个用 Python 编写的高层应用程序编程接口（API），允许在 TensorFlow、Theano 和 CNTK 等其他工具包之上进行快速实验。\n\
  - **Caffe**: 一个由伯克利人工智能研究中心开发的用 C++ 编写的深度学习框架；模型和优化可以通过配置来表示，而无需硬编码。\n- **MXNet**:\
  \ 一个高效的深度学习库，可以快速训练网络模型并支持多种编程语言，包括 Python、Scala、Clojure、Java、Julia、Perl、C++ 和 R。\n\
  - **Theano**: 一个 Python 库，用于高效地优化和评估有关多维数组的数学表达式。通过图形处理器（GPU），可以通过 Theano 高效执行符号微分。\n\
  - **CNTK**: 微软认知工具包；深度学习模型被描述为通过有向图的一系列计算步骤。\n- **DL4J**: 一个用 Java 编写的分布式深度学习库，兼容\
  \ Java 虚拟机语言，即 Scala、Clojure 或 Kotlin。在运行多个 GPU 时，DeepLearning4J 的性能与 Caffe 相当。\n\
  - **PyTorch**: 一个 Python 软件包，提供类似 Numpy 的张量计算，具有加速的 GPU 性能，并支持具有最大灵活性的神经网络库。\n-\
  \ **Chainer**: 一个基于 Python 的深度学习框架，通过提供自动微分 API 和面向对象的高层 API 来支持构建和训练神经网络。\n- **DIGITS**:\
  \ 学习 GPU 训练系统；一个支持 Caffe、TensorFlow 和 Torch 等框架的 Web 应用，用于加速图像分类、分割和目标检测任务的神经网络模型训练。\n\
  \n\n\n\n\n## 1.2: TensorFlow 简介\n\nTensorFlow [3] 是由 Google Brain 团队开发的端端开源平台，它使用数据流图来构建机器学习和深度学习模型。\n\
  \n### 指数据表示\n`Tensor` 是一个具有统一类型（a）的多维数组。TensorFlow 中的所有计算都基于张量。这里列出了创建基础张量的示例。\n\
  ![](img/image-kth2jt76.jpg) ![](img/image-q0tbg2va.jpg) ![](img/image-702ur9gi.jpg)\n\
  \n### 指计算图\nTensorFlow 通过使用数据流图来表示计算。在计算图中，每个节点代表一种操作（如加法、减法、乘法、除法等），边代表节点之间的关联。在执行每个操作后，将形成一个新张量用于下次计算。\n\
  \n例如，使用 TensorFlow 展示数学公式的源代码所示：\n```\n![](img/image-e6e9h05u.jpg)\n```\n上述程序的计算图如图所示。注意，TensorFlow\
  \ 使用 TensorBoard 来绘制图形；我们将在章节中介绍这一功能。图中从左侧开始，常量 `a` 和 `b` 连接到加法（Add）和减法（Sub）操作节点进行计算，然后\
  \ `Add` 节点和 `Sub` 节点产生的张量连接到除法（Div）操作节点以计算最终结果。\n![](img/image-08blxmmx.jpg)\n图\
  \ 1.2 `Y = (a + b)/(a - b)` 的计算图。\n\n在 TensorFlow 1 中，首先生成计算图，然后创建一个 session 来执行该图。这种技术被称为静态计算图。为了帮助用户轻松上手\
  \ TensorFlow 并调试程序，TensorFlow 2 引入了激进执行（Eager execution），这是一种命令式编程环境，可以立即执行操作而无需构建图；它减少了样板代码。除了激进执行，TensorFlow\
  \ 2 还有许多变化，我们将在下一节介绍。\n\n## 1.3: TensorFlow 2 的改进\n\nTensorFlow 2 是 TensorFlow 1\
  \ 的改进版本，侧重于简单的执行、易的模型构建和健壮的模型部署。TensorFlow 2 有六个主要更新功能：激进执行、Keras、`tf.data`、TensorFlow\
  \ Hub、分布式策略（Distribution Strategy）和 SavedModel。前三个功能将在下一节讨论。后续章节将讨论其他功能。\n\n- **Execution\
  \ (执行)**：一个用于机器学习和深度学习研究与实验的灵活平台，提供命令式编程环境，操作可以立即求值而无需构建图。\n- **Keras**：构建在 TensorFlow\
  \ 2 之上的高级 API，用于快速方便地设计和训练网络模型。TensorFlow 2 内置的 Keras 可以通过 `tf.keras` 函数使用。\n- **tf.data**：允许用户以简单方式构建复杂输入流水线的\
  \ API。该 API 可以处理大量数据并读取不同格式的数据。\n- **Hub**：存储已训练机器学习和深度学习模型的地方，用于特定目的的复用，例如通过微调网络模型以用更少的训练数据和时间来解决新任务。\n\
  - **Strategy (策略)**：`tf.distribute.Strategy`，一种 TensorFlow API，用于将现有模型的训练分布到多个设备（如\
  \ GPU 或 TPU）上。\n- **SavedModel**：TensorFlow 2 标准化了一个统一格式，用于存储带有权重的完整网络模型。使用 SavedModel，可以将训练好的模型部署到许多平台或设备，如智能手机、树莓派甚至网页。\n\
  \n图 1.3 显示了 TensorFlow 2 的简化概念图。所示，该图由两个阶段组成：(1) 训练阶段和 (2) 部署阶段。训练阶段从使用 `tf.data`\
  \ API 读取和处理输入流水线数据、从 TensorFlow Hub 加载预训练模型权重进行微调、使用 `tf.keras` API 构建神经网络、使用分布式策略训练模型以及使用\
  \ `SavedModel` 保存模型权重。在部署阶段，训练好的模型可以通过不同的库部署到不同的设备或平台。\n\n- **Lite**：一个用于将训练好的机器学习模型转换为压缩的\
  \ flat buffer 并部署到移动和物联网（IoT）设备上的库。\n- **FlowJS**：一个用于将训练好的机器学习模型部署在 JavaScript\
  \ 环境（如浏览器或 Node.js）中的库。\n- **Serving**：一个用于机器学习和深度学习模型的灵活部署系统，允许在服务器架构不变的情况下部署新算法。2\
  \ 还支持 Java、C、Go 等其他语言。\n\n![](img/image-edq5agaj.jpg)\n图 1.3 TensorFlow 2 的简化概念图。\n\
  \n## 1.4: 激进执行 (Eager execution)\n\n### 1.4.1: 激进执行简介\n通过激进执行平台立即求值操作是 TensorFlow\
  \ 2 中最重要的更新功能之一。与 TensorFlow 1 不同（它通过先构建计算图然后设置 session 来执行生成的图），TensorFlow 2 中的激进执行提供了一个编程环境，操作可以立即求值而无需构建图。这使用户能够通过即时错误报告更容易地进行调试，并简化动态模型的规范。\n\
  \n激进执行的重要特性如下：\n- 操作的求值。\n- 程序的调试。\n- 不需要构建计算图。\n- 无需 `tf.Session.run` 即可返回计算结果。\n\
