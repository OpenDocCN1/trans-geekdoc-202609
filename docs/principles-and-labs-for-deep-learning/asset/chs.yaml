  \ software.\n[4] Chollet F. \n\n摘要\n神经网络有很多应用，包括模式识别、序列识别、医学诊断等。通过五个章节，本书帮助读者理解并提高在神经网络方面的实践技能。首先，我们讨论了神经网络的结构和原理、用于模型竞赛和开发的\
  \ Kaggle 平台，以及一个构建和训练全连接神经网络（FCNN）预测房价的示例。然后，我们使用 TensorBoard 获取机器学习实验所需的视觉化。最后，我们研究了过拟合问题以及在训练神经网络模型期间防止该问题的方法。我们还包含了代码示例。\n\
  \n\n\n\n## 2.1 神经网络简介\n\n## 2.1.1 神经网络的简史\n1943 年，Warren McCulloch 和 Walter Pitts\
  \ [1] 引入了一种基于阈值逻辑算法的计算模型，为人工神经网络（ANNs）的发展铺平了道路。受 McCulloch 和 Pitts 许多方法的启发，人们针对神经网络提出了许多方法，这些方法可以分为两类：(1)\
  \ 关注生物学过程，以及 (2) 关注应用。然而，在 1980 年至 2000 年间，更简单的模型例如用于分类和回归分析的线性分类器或支持向量机（SVMs）变得更加流行。\n\
  \n原因可以解释如下：具有许多中间层（称为隐藏层）的深层网络可以获得比具有少量隐藏层的浅层神经网络更好的性能，如图所示 所示。在深层网络中，隐藏层从输入数据中提取特征，这些特征被用于后续层的计算。因此，隐藏层越多，能够获取的数据特征就越详尽。例如，一个人脸识别模型将面部图像作为输入，然后第一个隐藏层从输入层获取原始数据，并提取边缘、线条等简单特征。在随后的隐藏层中，可以提取人脸、眼睛、头发等输入图像的高级特定特征以用于人脸识别。\n\
  \n遗憾的是，由于基于梯度的学习方法和反向传播 [8] 等机器学习算法在训练过程中存在梯度消失问题，它们对于深度神经网络的效果并不良好。此外，由于深层神经网络具有高计算成本和内存占用，它们需要大型数据集来进行训练和开发。\n\
  \n![](img/image-572m94js.jpg)\n图 2.1 神经网络的架构。\n\n从 2000 年至今，计算机技术各个领域和机器学习算法的发展使得构建和训练深层神经网络成为可能，并取得了突破性进展。\n\
  \n### 计算能力\n过去，使用中央处理器（CPU）来执行神经网络的计算，但现在由于性能的提升，开始使用图形处理器（GPU）和张量处理器（TPU）。2012\
  \ 年，Krizhevsky 等人使用 NVIDIA GPU 训练了一个名为“AlexNet”的八层网络。在赢得 2012 年 ImageNet 大规模视觉识别挑战赛（ILSVRC）冠军后，大家意识到\
  \ GPU 惊人的计算能力以及深层神经网络的能力。\n\n### 存储设备\n如果没有足够的训练数据，深层神经网络无法高效地进行训练。因为数据存储设备价格昂贵且容量有限，20-30\
  \ 年前获取大型数据集是不可能的。如今，随着科技的发展，存储设备的价格下降，像 Kaggle 和 TensorFlow hub 这样的互联网和云设备随处可见；有许多可用数据库供用户下载、研究和开发。因此，缺乏大型数据集和数据存储设备的问题已经得到解决。\n\
  \n### 函数\nSigmoid 曾是神经网络中非常流行的激活函数。然而，在随机权重初始化的深层网络隐藏层中使用 sigmoid 激活函数会导致训练期间出现梯度消失，这使得网络权重难以更新，导致训练无效。2011\
  \ 年，Glorot 等人 [11] 引入了修正线性单元单元（`ReLU`）函数，该函数已被证明有效解决了梯度消失问题并提高了各种神经网络的学习速度。2015\
  \ 年，He 等人引入了参数化修正线性单元（`PReLU`）激活函数，允许有效地训练更深、更宽的神经网络。\n\n## 2.1.2 神经网络的原理\n神经网络由三层组成：输入层、隐藏层和输出层。网络中的每一层都有许多神经元用于连接和计算，如图所示。输入层、隐藏层和输出层的神经元分别称为输入神经元、隐藏神经元和输出神经元。输入层从外部向网络提供初始数据，不经过隐藏层的任何计算。隐藏层位于神经网络的输入层和输出层之间，负责通过隐藏神经元对输入数据进行计算并将结果传递到输出层。输出层接收最后一个隐藏层的的结果作为输入，并利用其神经元计算并产生网络的最终结果。\n\
  \n![](img/image-cqh4ij36.jpg)\n图 2.2 双层神经网络示例。注意神经网络的层数等于隐藏层数加一，`l` 表示第 `l` 层第 `i`\
  \ 个神经元的输出，偏置（biases）是隐藏的。除了输入神经元，神经网络的每个神经元都可以接收一个或多个带有独立权重的输入，这些输入求和产生输出。通常，在求和输入后，得到的和会被发送到非线性函数，即生成输出的激活函数，如图所示。常见的激活函数包括\
  \ `ReLU`、`sigmoid` 和 `tanh`，我们将在后面的章节中讨论。\n\n![](img/image-zfw723.jpg)\n图 2.3 神经网络神经元的示意。`x_i`、`w_i`\
  \ 和 `b_i` 分别代表神经元的输入、权重和偏置。`σ` 是激活函数。当神经网络采用激活函数对输入进行非线性变换时，它可以帮助神经网络描述和学习复杂任务。\n\
  \n## 2.1.3 训练神经网络\n训练神经网络是使用训练数据寻找网络合适的权重，以创建输入输出良好映射的过程。如图所示，神经网络的训练过程由四个部分组成：准备数据集、构建网络模型、损失函数和优化。\n\
  \n### 数据集\n![](img/image-omrf776s.jpg)\n图 2.4 神经网络训练过程示意图。\n用于训练神经网络的数据集分为三类：训练数据、验证数据和测试数据。\n\
  \n- 训练数据：一组示例，用于拟合神经网络中连接的权重。训练数据通常包含样本对（输入样本，真实值标签）。真实值标签也称为预期输出。\n- 验证数据：一组示例，用于在调整网络模型超参数（如隐藏层数、每层神经元数量等）期间估计模型的拟合情况。\n\
  - 测试数据：一组示例，用于估计最终网络模型在训练数据上的拟合情况。对于大多数竞赛，训练数据和验证数据会发布，而测试数据保留作为模型最终评估的依据。\n\n###\
  \ 补充说明\n测试数据用于评估神经网络在真实世界的准确性和泛化能力。如果神经网络的超参数直接通过测试数据的结果进行调整，网络在训练数据和测试数据上可能会获得良好的性能，但应用到真实世界时表现很差。为了避免这个问题，使用验证数据代替测试集。\n\
  \n### 网络模型\n本节介绍的神经网络由三个主要部分组成：输入层、隐藏层和输出层。对于不同的任务，网络模型使用不同的超参数构建，例如隐藏层数、每层神经元数等。由于超参数的选择直接影响网络的训练结果，我们在第\
  \ 7 章中使用 `TensorBoard` 工具来调整这些参数。\n\n在神经网络中，如果每一层的每个神经元都连接到下一层的所有神经元，这种网络被称为全连接神经网络（FCNN）。图\
  \ 2.5 显示了具有三个隐藏层的 FCNN 采用 `ReLU` 激活函数进行非线性变换。由于全连接，上一层的信息可以用于下一层的计算；这有助于 FCNN 更好地学习输入数据。然而，FCNN\
  \ 的计算开销非常大，并受到过拟合问题的挑战，在训练过程中会导致网络性能不佳，尤其是深度神经网络。在本章的后续章节，我们将讨论 FCNN 在房价预测中的应用以及解决过拟合的问题。\n\
  \n![](img/image-rt9burg.jpg)\n图 2.5 全连接神经网络。\n\n### 函数\n神经网络的训练是通过优化过程使用损失函数来计算模型预测值与预期输出之间的误差。对于不同的训练目的，优化过程可能会最小化或最大化损失函数，这意味着需要一组合适的参数来达到最低或最高分数。通常，在训练神经网络时应用最小化损失函数。有许多损失函数用于回归问题、二分类问题和多分类问题。\n\
  \n- 回归问题：输出层设计有一个神经元的神经网络用于每个所需的值。回归模型的一个例子是根据卧室数量、浴室数量、楼层、年龄等信息来预测房价。回归模型最常用的损失函数是均方误差（`MSE`）和平均绝对误差（`MAE`），它们计算预测值与预期输出之间的平方差或绝对差。\n\
  - 二分类问题：输出层设计有一个神经元的神经网络用于预测输入样本是否属于某一类。对于训练二分类模型，二分类交叉熵损失函数（也称为 log 函数）是常用的。\n\
  - 多分类问题：输出层设计有多个神经元的神经网络用于预测一个类别。对于训练多分类模型，分类交叉熵损失函数（也称为 softmax 函数）被广泛使用。\n\nMSE\
  \ ![](img/image-q369pcg.jpg)\nMAE ![](img/image-6c1931o.jpg) 其中 `y` 是预期输出，`y_pred`\
  \ 是神经网络的预测值，N 是批的数据量。MSE 和 MAE 都计算模型预测值与预期输出之间的误差，但 MSE 计算平方误差，MAE 计算绝对误差。图 2.6\
  \ 展示了 MSE 和 MAE 的比较。如图所示，当 `y_true - y_pred` 值在 -1 和 1 之间时，MSE 损失值小于 MAE。相反，当 `y_true\
  \ - y_pred` 值大于 1 或小于 -1 时，MSE 损失值大于 MAE。使用这两种方法作为损失函数会产生不同的训练结果。\n\n![](img/image-ie9kid.jpg)\n\
  图 2.6 MSE 和 MAE 损失值。本章中的房价预测模型使用 MSE 作为训练损失函数。读者可以将 MSE 改为 MAE 以比较这两种方法的结果。\n\n\
  在训练神经网络时，优化过程是寻找一组参数（也称为一组权重），使损失函数的损失值尽可能小。梯度下降（`GD`）是训练神经网络最常用的优化算法。通过 `GD` 寻找损失函数的最小值，沿着当前点损失函数梯度的反方向步进。这种算法可以比作一个正在寻找山下山路径的人。根据人的当前位置，他们观察山的陡度，然后沿着最陡的方向向下走。重复此步骤直到到达山底。例如，给定一个具有未初始化权重\
  \ `W` 和损失函数 `L` 的神经网络模型，用于计算预测输出与预期输出之间的误差。使用 `GD` 算法训练网络以最小化 `L`。达到 `L` 最小值的步骤如下：\n\
  1. 随机初始化 `W`\n2. 通过公式使用学习率 `η` 更新 `W`：\n![](img/image-hhfgdpko.jpg) 其中 `∇L` 代表点处\
  \ `L` 的梯度\n3. 使用新的 `W` 计算 `L` 的值（称为“损失”），并重复步骤 2 直到达到最小损失，如图 2.7 所示。\n\n![](img/image-zbr26kgl.jpg)\n\
  图 2.7 梯度下降图。\n\n损失值达到最小损失意味着模型的预测结果最接近预期输出。事实上，并不是每次 `GD` 更新都是朝着损失函数的最小值更新的，而是朝着可以减少此时损失函数误差的方向更新。因此，当模型训练到损失值无法减少时，到达的点通常是局部最小值而不是全局最小值，如图所示。\n\
  \n![](img/image-pe0bt9is.jpg)\n图 2.8 权重向收敛于局部最小值而非全局最小的方向更新。\n\n学习率是一个可配置的超参数，决定了训练神经网络过程中每次迭代的步长。较小的学习率会导致每次更新的权重变化很小并需要许多训练迭代；而较大的学习率可以快速变化且需要的迭代次数较少。如果学习率太大，每次更新的权重变化太大；可能会跳过最小值并产生震荡，如图所示。相反，如果学习率太小，优化效率可能较低，在长时间训练后也找不到最优值，如图所示。因此，学习率是训练网络模型时至关重要的超参数之一。\n\
  \n![](img/image-ug8nbrwx.jpg)\n图 2.9 不同学习率的优化过程。\n\n\n\n\n\n## 2.2 Kaggle 简介\n\n\
  ### 2.2.1 Kaggle 平台\nKaggle 是全球著名的竞赛平台，公司和研究人员可以在这里发布数据集并组织竞赛来解决数据科学领域的挑战。竞赛对所有人开放。如图所示，Kaggle\
  \ 竞赛页面上有多达 19 个正在进行的比赛。值得注意的是，Kaggle 不仅是一个竞赛网站，还是一个社区平台，允许用户相互工作、讨论、组队或共享研究结果。\n\
  \n![](img/image-nqb22l1t.jpg)\n图 2.10 Kaggle 竞赛页面。\n\nKaggle 的另一个很棒之处是它有一个数据集区域，其中的数据集已经过分类并供下载，如图所示。本章的实验数据是从\
  \ Kaggle 网站下载的数据集。\n\n![](img/image-9uf2dzth.jpg)\n图 2.11 Kaggle 上的公共数据集。\n\n###\
  \ 2.2.2 King County 房屋销售数据集\n在本节中，介绍了来自 Kaggle 的“美国金县房屋销售（House Sales in King County,\
  \ USA）”数据集用于训练和评估房价预测模型。要下载该数据集，请访问如图所示。\n\n![](img/image-lnghvddr.jpg)\n图 2.12\
  \ King County 房屋销售数据集。\n\n该数据集包含 21,613 条房屋数据，每个房屋样本包含 21 项信息。代码代表的含义如下：\n- 房屋识别码\n\
  - 房屋出售日期\n- 房价（目标值）\n- 卧室数量\n- 浴室数量\n- 室内居住面积（平方英尺）\n- 总楼层\n- 是否临水面\n- 物产状况\n- 建筑与设计\n\
  - 评分\n- 地上层\n- 地下层\n- 翻新时间\n- 邮政编码\n- 纬度\n- 经度\n\n## 2.3 实验 1：房屋预测\n在本节中，在“King\
  \ County 房屋销售”数据集上构建并训练了一个 `FCNN` 来预测价格。网络接受卧室、浴室、楼层等信息作为输入，然后输出价格。`MSE` 和 `Adam`\
  \ 分别作为损失函数和优化器。图 2.13 显示了源代码的流程图。\n\n![](img/image-pfty0y.jpg)\n图 2.13 源代码流程图。\n\
  \n### 2.3.1 准备数据集\n必要的包：\n![](img/image-4g73wr.jpg)\n转换数据：\n![](img/image-me0gic.jpg)\n\
  数据类型：![](img/image-crzx1k.jpg) 数据类型：因为数据集中的日期是字符串类型，而模型输入接受数值类型，因此通过以下代码将日期、月份和日期转换为数值：\n\
  \n![](img/image-jabmewd.jpg)\n划分：将数据集分为三部分：训练集、验证集和测试集。\n![](img/image-o3gy03.jpg)\n\
