    # 1.5: Keras


    ## 1.5.1: Keras 简介

    `Keras` 由 François Chollet 于 2014 年引入，是一个开源深度学习库，旨在快速构建和训练神经网络模型。`Keras` 本身没有低层操作；它运行在被称为“后端”（backend）的开源深度学习库之上，例如
    `TensorFlow`、`CNTK` 和 `Theano`。`Keras` 默认使用 `TensorFlow` 后端；可以通过 `use_backend()`
    函数将其更改为 `CNTK` 后端或 `Theano` 后端。`Keras` 集成了许多常用的神经网络构建模块，用于高效地设计模型，例如卷积层、损失函数、激活函数、优化器等。在
    `TensorFlow 2` 中，`Keras` 是高层 API，因此没有需要安装任何额外的 `Keras` 包；可以直接通过 `tf.keras` API
    直接使用。强烈建议使用 `tf.keras` API 而不是 `Keras` API，因为 `tf.keras` 支持 TensorFlow 操作、动态执行（Eager
    Execution）、`tf.data`、TPU 训练等。以下介绍了 Keras 中构建网络模型的两种最常用方法，包括顺序模型（sequential models）和函数模型（functional
    models）。


    以下网络层用于设计网络模型（后续章节将介绍有关这些层的更多细节）：

    * 全连接层。

    * 卷积层。

    * 用于将张量展平为一维张量。通常插入在卷积层和全连接层之间。

    * 用于添加具有相同形状的张量列表并输出单个张量。

    * 用于拼接张量列表；除拼接轴外，所有张量的形状都相同。


    ### 补充说明

    使用 `tensorflow.keras.utils.plot_model` 需要额外安装 `pydot` 和 `graphviz` 包。


    **Ubuntu**: 打开终端并输入以下命令：

    **Windows**: 打开命令提示符并输入以下命令：

    * 访问 `https://graphviz.gitlab.io/_pages/Download/windows/graphviz-2.38.msi` 下载并安装
    `graphviz` 包，如图 1.4 所示。

    ![](img/image-jpby66nc.jpg) 图 1.4 下载 Graphviz 2.38。

    * 将 `graphviz/bin` 安装路径添加到“新建系统变量”中：控制面板 → 系统 → 高级系统设置 → 环境变量，如图 1.5 所示。

    ![](img/image-dolvr41w.jpg) 图 1.5 新环境变量。


    ## 1.5.2: 顺序模型 (Sequential model)

    顺序模型是以系统方式逐层构建深度学习网络的方法。图 1.6 显示了一个顺序网络，它从输入层开始，连接到隐藏层 1。然后，隐藏层 1 连接到隐藏层 2，最后，隐藏层
    2 和输出层相互连接形成一个完整模型。`Keras` 提供了顺序模型 API 用于快速、地构建网络模型。然而，顺序模型的构建方法具有一些局限性：

    * 允许创建单输入单输出的模型。

    * 不允许创建共享层的模型。

    * 不允许构建具有多个输入或输出的模型。

    ![](img/image-qod88ndw.jpg) 图 1.6 单输入输出模型。


    在这里，我们介绍两种构建顺序网络模型的方法，以图像分类问题为例。该模型有一个大小为 28 × 28 的输入，它将被展平为大小为 784 的一维向量；两个带有线性整流单元（ReLU）激活函数的隐藏层（全连接层）；以及一个用于分类的输出层
    softmax 层。

    ![](img/image-2m0j447d.jpg) ![](img/image-7nu0in32.jpg)


    ## 1.5.3: 函数模型 (Functional model)

    Keras 函数 API 是一种通过层的有向无环图来构建网络模型的方法。按照这种方法，首先创建层的实例，然后将它们成对地连接起来，最后指定作为网络输入和输出的层。使用
    Keras 函数 API 定义网络模型有三个步骤：

    1. **(定义输入)**：与顺序模型不同，需要首先定义具有特定输入数据大小的输入层。

    2. **(连接层)**：这一步通过在声明新层时指定其输入来自何处来完成。

    3. **(创建模型)**：在所有层都声明并连接后，需要指定模型的输入和输出以完成模型创建。


    Keras 函数 API 在创建复杂模型方面非常灵活，特别是对于具有多个输入、多个输出或多个输入多个输出的模型，如图所示。我们稍后介绍的用于目标检测、图像分割、生成对抗网络等高级应用的所有复杂模型，都可以使用
    Keras 函数 API 构建。

    ![](img/image-0stg64rd.jpg) 图 1.7 不同网络模型图。

    ![](img/image-19sysqad.jpg) 图 1.8 使用 `tf.data` API 处理输入数据流水线。注意，ML 和 DL 分别是机器学习（machine
    learning）和深度学习（deep learning）的缩写。


    以下介绍了如何使用 Keras 函数 API 构建图 1.7 所示的四种网络模型。


    ### 输入输出模型

    例如，一个模型有一个大小为 28 × 28 的输入，它被展平为大小为 784 的一维向量；两个隐藏层 `hidden1` 和 `hidden2` 以及一个名为
    `Output` 的输出层，接 softmax 函数用于分类。构建模型的代码如下：

    ```

    ![](img/image-sro69xs2.jpg) ![](img/image-pj328v9.jpg)

    ```### 多输入单输出模型

    例如，一个商品预测模型由两个输入组成，包括图像和品牌，以及一个大小为 (1,) 的预测输出。大小为 (128, 128, 3) 的图像输入通过两个隐藏层 `hidden1_1`
    和 `hidden1_2`，大小为 (1,) 的品牌输入通过隐藏层 `hidden1_3`。合并两个输入信息后，生成的特征发送到另一个隐藏层 `hidden2`。然后，`hidden2`
    层的输出作为密集层 `Output` 的输入进行价格预测。构建此模型的代码如下：

    ```

    ![](img/image-4226mt86.jpg) ![](img/image-y3gn8ez2.jpg)

    ```单输入多输出模型

    例如，肖像识别模型有一个输入两个输出。模型的输入是大小为 (128, 128, 3) 的个人照片，它通过三个隐藏层 `hidden1`、`hidden2`
    和 `hidden3`。在展平最后一个隐藏层（hidden3）的输出后，将其发送到两个输出层 `Age_Output` 和 `Gender_Output`
    分用于年龄和性别预测。构建模型的代码如下：

    ```

    ![](img/image-oxvo2de.jpg) ![](img/image-y1sbjjxq.jpg)

    ```多输入多输出模型

    例如，一个天气预测模型有两个输入（卫星云图和气候信息），以及三个输出（降水概率、温度和湿度）。大小为 (256x256x3) 的卫星云图通过三个隐藏层 `hidden1`、`hidden2`
    和 `hidden3`，大小为 (10,) 的气候信息通过一个密集层。在合并两个输入信息后，模型分别通过 `Output1`、`Output2` 和 `Output3`
