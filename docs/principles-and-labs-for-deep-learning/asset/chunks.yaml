    ## 5.2: Weight initialization


    The weight initialization plays an important role in training neural networks
    because it directly affects the convergence of the model. In this section, we
    introduce and analyze three weight initialization methods and the impact of them
    on building the neural networks. In the following, we give a brief description
    of the three different weight initialization methods.


    distribution initialization: The simplest case of a normal distribution is known
    as the standard normal distribution when the parameter `μ` (mean) is set to 0
    and the parameter `σ` (standard deviation) is set to 1. In the experiment below,
    the neural network of sigmoid activation function is used to analyze the initial
    weights of the normal distribution with `μ = 0` and `σ = 1`, and the normal distribution
    with `μ = 0` and `σ = 0.01`. The final analysis results show that the normal distribution
    with `μ = 0` and `σ = 1` is a cause of the vanishing gradient.


    or Glorot initialization: This is used to improve the problems of the normal distribution
    initialization method by trying to keep the scale of the gradient roughly the
    same in all layers of the neural network. However, using Glorot initialization
    for DNNs with the ReLU activation function still reveals the vanishing gradient
    during the training process.


    initialization: This addresses the problem of Xavier or Glorot initialization
    when the ReLU activation function is employed in DNNs by making the output distribution
    of each layer even.


    The following introduces in detail and analyzes the impacts of each initialization
    method in training and developing neural networks. We also list the necessary
    packages for the program examples.


    ![](image-84728uz3.jpg)


    ### 5.2.1: Normal Distribution


    neural network of sigmoid activation function and the normal distribution with
    `μ = 0` and `σ = 1`


    To build the network model, the following network layers are used:

    - input layer with shape of `(100,)`.

    - (fully connected layer): `sigmoid` is used as the activation function, and normal
    distribution with `μ = 0` and `σ = 1` is employed for weight initialization; bias
    is not used.


    ![](image-gbr56g8v.jpg)


    The results show that most of the output values are distributed near 0 and 1.
    The gradient values will approach zero when applying `BP` (please refer to the
    derivative of sigmoid function in Table) resulting in the vanishing gradient problem.
    Therefore, the normal distribution with `μ = 0` and `σ = 1` is not an effective
    weight initialization method.


    neural network of sigmoid activation function and the normal distribution with
    `μ = 0` and `σ = 0.01`


    To build the network model, the following network layers are used:

    - input layer with shape of `(100,)`

    - (fully connected layer): `sigmoid` is used as activation function, and normal
    distribution with `μ = 0` and `σ = 0.01` is employed for weight initialization;
    bias is not used


    ![](image-n9xdpwmh.jpg)


    The results show that the output values from the second layer are mostly distributed
    around 0.5, and the gradient values will be around 0.25 when applying `BP` (please
    refer to the derivative of sigmoid function in Table) Although the problem of
    vanishing gradient is improved, it may still occur with a deep network that consists
    of many convolutional layers.


    ### 5.2.2: Glorot initialization


    neural network with Glorot initialization and sigmoid activation function


    Glorot et al. [6] proposed the Glorot initialization method in 2010. It has been
    widely used in many DNNs and is regarded as the default weight initialization
    method in `Keras`. To build the network model, the following network layers are
    used:

    - input layer with shape of `(100,)`

    - (fully connected layer): `sigmoid` is used as activation function, and the Glorot
    method is employed for weight initialization; bias is not used


    ![](image-l9h1s9j.jpg)


    The results show that the Glorot initialization method produces a wider output
    distribution than that of the normal distribution method. This helps to prevent
    the vanishing gradient during the training process and allows the neural networks
    to learn data. Therefore, the Glorot method for weights initialization is recommended
    for neural networks with sigmoid or tanh activation.


    neural network with Glorot initialization and ReLU activation function


    To build the network model, the following layers are used:

    - input layer with shape of `(100,)`

    - (fully connected layer): `ReLU` is used as the activation function, and Glorot
    is employed for weight initialization; bias is not used.


    ![](image-oeg7q95l.jpg)


    The results show that when the number of layers of the network model increases,
    the output distribution of the deeper layer is closer to 0, which may cause the
    vanishing gradient problem during training process. Therefore, using Glorot weight
    initialization method for DNNs of the ReLU activation function is not recommend


    ### 5.2.3: He initialization


    neural network with He initialization and ReLU activation function


    Kaiming He [7] proposed the He initialization method in 2015. It has proven effective
    in preventing the vanishing gradient problem when using DNNs with the ReLU activation
    function. To build the network model, the following layers are used:

    - input layer with shape of `(100,)`

    - (fully connected layer): `ReLU` is used as activation function, and He method
    is employed for weight initialization; bias is not used


    ![](image-9lg5y64i.jpg)


    The results show that the output distribution of each layer is very even when
    a deep network with ReLU activation uses the He initialization method. The problem
    of using Glorot initialization method for DNNs with ReLU activation function is
    successfully solved.


    The following points summarize the knowledge of this section.

    - Glorot method is recommended for weight initialization when using neural networks
    with sigmoid or tanh activation functions.

    - He method is recommended for weight initialization when using neural networks
    with ReLU activation function.

    - with the ReLU activation function usually achieve better performance than that
    of DNNs with sigmoid or tanh activation functions.

    '
