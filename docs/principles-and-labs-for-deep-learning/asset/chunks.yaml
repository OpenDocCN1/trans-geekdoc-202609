    \ the three network models with the highest accuracy are all trained using a learning\
    \ rate of 0.001.    ![](image-ojl2zjqb.jpg)Fig. 7.27 TensorBoard HParams with\
    \ the selection of running a specific learning rate.    Supplement explanation\
    \  Results in Fig. 7.27 show that the network model achieves the best accuracy\
    \ when trained with a learning rate of 0.001. However, the comparison is not fair\
    \ because the convergence rate of the network model using a learning rate of 0.001\
    \ is much slower than that of using a learning rate of 0.01 or 0.03. Furthermore,\
    \ using callback functions such as ReduceLROnPlateau also reduces this value,\
    \ so it is recommended to use the higher learning rate first, and then reduce\
    \ this value gradually during the training process.     Plot View    To display\
    \ plots comparing each hyperparameter with each metric, click “SCATTER PLOT VIEW”\
    \ in the dashboard, as shown in Fig. We leave this to the readers to explore on\
    \ their own. The analysis method is similar to the \"Parallel Coordinates View\"\
    \ subsection.    ![](image-jn9y4uu8.jpg)Fig. 7.28 HParams dashboard with Scatter\
    \ Plot View.  \n\n  Chapter 8: Convolutional neural network architectures    "
  fmt: "\n# 7.3: Experiment 2: Hyperparameter tuning with TensorBoard HParams\n\n\
    There are many issues in developing a good neural network model for a specific\
    \ problem, such as how many network layers should be used, which type of optimizer\
    \ is better, how to set a suitable learning rate value, whether to apply dropout\
    \ technique or batch normalization method, and so on. These adjustable parameters\
    \ are collectively referred to as hyperparameters and they directly affect the\
    \ training results. Therefore, an important step in developing neural network\
    \ models is to choose the best hyperparameters. The last section of this chapter\
    \ introduces a hyperparameter tuning technique using the `HParams` dashboard provided\
    \ by TensorFlow, which can help to identify the most suitable hyperparameters\
    \ for a specific problem. This technique is explained directly through a program\
    \ example that builds 36 network models with different combinations of hyperparameters\
    \ that are trained on the `CIFAR-10` dataset for analysis and comparison of obtained\
    \ results.\n\nThe hyperparameters used for building neural network models are\
    \ as follows:\n- `augmentation` (`IA`): Yes or No\n- `normalization` (`BN`): Yes\
    \ or No\n- `rate` (`LR`): `0.001`, `0.01`, or `0.03`\n- `initialization method`:\
    \ `Random Normal`, `Glorot Normal`, or `He Normal`\n\n## 7.3.1: HPARAMS dashboard\
    \ on TensorBoard\n\nTensorBoard through command line:\n![](image-c43u7j4x.jpg)\n\
    \n`HParams` dashboard: After opening the TensorBoard, click on `HParams` in the\
    \ list options, as shown in Fig.\n![](image-dvq5488r.jpg) \nFig. 7.19 List options\
    \ in TensorBoard.\n\n### HParams dashboard\nAfter clicking on `HParams`, a dashboard\
    \ is opened, as shown in Fig. The left pane of the `HParams` dashboard shows the\
    \ views of hyperparameters, metrics values, run status, sorting information in\
    \ the table view, and number of session groups. The main dashboard displays three\
    \ different views including the list of runs on the \"table view\", each run for\
    \ each hyperparameter and metric on the \"parallel coordinates view\", and plots\
    \ for comparison of each hyperparameter with each metric on the \"scatter plot\
    \ view\". In Fig. because there are not any data written, there is not information\
    \ displayed in the `HParams` dashboard.\n![](image-p3tiun90.jpg) \nFig. 7.20 HParams\
    \ dashboard in TensorBoard.\n\n## 7.3.2: Code examples\n\nFig. 7.21 is a flowchart\
    \ of the source code for building and analyzing 36 neural network models with\
    \ various hyperparameters.\n\nhyperparameters\n![](image-pl2z167k.jpg) \nFig.\
    \ 7.21 Flowchart of the source code for building and analyzing 36 neural networks\
    \ with different combinations of hyperprameters.\n![](image-myq1gjx5.jpg) ![](image-7yythgng.jpg)\n\
    \nAfter executing the program above, the TensorBoard screen has more information\
    \ of hyperparameters and metric values, as shown in Fig.\n\nand training network\
    \ models\n![](image-n8tuez5r.jpg) \nFig. 7.22 TensorBoard HParamas with hyperparameters\
    \ and metric information.\n![](image-6clsi6ok.jpg)\n\ntraining data: with image\
    \ augmentation and without image augmentation\n![](image-9szkwoay.jpg) ![](image-8fguxxey.jpg)\n\
    \na function for building and training the network models.\nThe network layers\
    \ used in the models are as follows:\n- input layer with the size of `32 × 32\
    \ × 3`\n- convolutional layer (weight initialization: `Random normal`, `Glorot\
    \ normal`, or `He normal`)\n- batch normalization layer with preset parameters\
    \ (hyperparameters: use or do not use)\n- `ReLU` activation function layer\n-\
    \ pooling layer, for downsampling the feature map\n- flatten layer, for flattening\
    \ the input into a one-dimensional `Tensor`\n- dropout layer, which randomly sets\
    \ input units to `0` with a frequency of 50 at each step during training time\n\
    - fully connected layer; if this layer is used as the hidden layer of the network,\
    \ the `ReLU` activation function will be adopted. `ReLU` activation function will\
    \ be replaced with `softmax` activation function if this layer is used as the\
    \ output layer of the network.\n![](image-d9gu2jlv.jpg) ![](image-lj6oujfh.jpg)\n\
    \n### 36 network models with different combinations of hyperparameters\n7.2 shows\
    \ the combinations of hyperparameters for training 36 neural network models.\n\
    \nTable 7.2\n(Table content omitted)\nnetwork models\n![](image-i5w9eyey.jpg)\n\
    \nthe training results through TensorBoard HParams.\nThe hyperparameters and training\
    \ results of 36 neural network models are displayed on the `HParams` dashboard,\
    \ as shown in Fig.\n\n#### Coordinates View\n![](image-4zdskfaf.jpg) \nFig. 7.23\
    \ TensorBoard HParams with 36 network models.\n\nTo observe the results with parallel\
    \ coordinates view, click `PARALLEL COORDINATES VIEW` in the dashboard, as shown\
    \ in Fig.\n![](image-3lbz395d.jpg) \nFig. 7.24 HParams dashboard with the Parallel\
    \ View.\n\nFrom the results on the parallel coordinates view, as shown in Fig.\
    \ the network models with high accuracy employed image augmentation and batch\
    \ normalization techniques, whereas using different types of initialization methods\
    \ or learning rates has little effect on training results.\n![](image-l54p7kv.jpg)\
    \ \nFig. 7.25 The impact of different hyperparameters on the accuracy of the network\
    \ models.\n\nIn TensorBoard HParams, the range of accuracy values can be set to\
    \ filter unnecessary information, as shown in Fig. From the `HParams` dashboard,\
    \ it can be observed that if batch normalization is applied, the choice of initialization\
    \ methods is less careful because it does not change much about the accuracy.\n\
    ![](image-5xxsc74p.jpg) \nFig. 7.26 TensorBoard HParams with the limitation of\
    \ the accuracy range.\n\nWe can also display the results of the models with a\
    \ specific learning rate, such as displaying the result of trained models with\
    \ the learning rate value of `0.001`, as shown in Fig. As shown, the three network\
    \ models with the highest accuracy are all trained using a learning rate of `0.001`.\n\
    ![](image-ojl2zjqb.jpg) \nFig. 7.27 TensorBoard HParams with the selection of\
    \ running a specific learning rate.\n\n#### Supplement explanation\nResults in\
    \ Fig. 7.27 show that the network model achieves the best accuracy when trained\
    \ with a learning rate of `0.001`. However, the comparison is not fair because\
    \ the convergence rate of the network model using a learning rate of `0.001` is\
    \ much slower than that of `0.01` or `0.03`. Furthermore, using callback functions\
    \ such as `ReduceLROnPlateau` also reduces this value, so it is recommended to\
    \ use the higher learning rate first, and then reduce this value gradually during\
    \ the training process.\n\n#### Plot View\nTo display plots comparing each hyperparameter\
    \ with each metric, click `SCATTER PLOT VIEW` in the dashboard, as shown in Fig.\
    \ We leave this to the readers to explore on their own. The analysis method is\
    \ similar to the \"Parallel Coordinates View\" subsection.\n![](image-jn9y4uu8.jpg)\
    \ \nFig. 7.28 HParams dashboard with Scatter Plot View.\n\nChapter 8: Convolutional\
    \ neural network architectures\n"
  trans: "\n\n# 7.3: 实验 2：使用 TensorBoard HParams 进行超参数调优\n\n为特定问题开发良好的神经网络模型时存在许多问题，例如应该使用多少层网络、使用哪种优化器更好、如何设置合适的学习率值、是否应用\
    \ dropout 技术或批归一化方法等。这些可调整的参数统称为超参数，它们直接影响训练结果。因此，开发神经网络模型的一个重要步骤是选择最佳超参数。本章最后一节介绍了一种使用\
    \ TensorFlow 提供的 `HParams` 面板的超参数调优技术，它可以帮助识别特定问题最合适的超参数。该技术通过一个程序示例直接解释，该示例构建了\
    \ 36 个具有不同超参数组合的网络模型，并在 `CIFAR-10` 数据集上进行训练，以便对获得的结果进行分析和比较。\n\n构建神经网络模型使用的超参数如下：\n\
    - `augmentation` (`IA`): 是或否\n- `normalization` (`BN`): 是或否\n- `rate` (`LR`):\
    \ `0.001`、`0.01` 或 `0.03`\n- `initialization method`（初始化方法）：`Random Normal`、`Glorot\
    \ Normal` 或 `He Normal`\n\n## 7.3.1: TensorBoard 中的 HPARAMS 面板\n\n通过命令行使用 TensorBoard：\n\
    ![](img/image-c43u7j4x.jpg)\n\n`HParams` 面板：打开 TensorBoard 后，点击列表选项中的 `HParams`，如图所示。\n\
    ![](img/image-dvq5488r.jpg) \n图 7.19 TensorBoard 中的列表选项。\n\n### HParams 面板\n点击\
    \ `HParams` 后，会打开一个面板，如图所示。`HParams` 面板的左侧窗显示超参数视图、指标值、运行状态、表格视图中的排序信息以及会话组的数量。主面板显示三个不同的视图，包括在“表格视图”（table\
    \ view）上的运行列表、“并行坐标视图”（parallel coordinates view）中每个运行对应每个超参数和指标的情况，以及“散点图视图”（scatter\
    \ plot view）中每个超参数与每个指标的比较图表。在图中，由于没有写入任何数据，`HParams` 面板中没有显示任何信息。\n![](img/image-p3tiun90.jpg)\
    \ \n图 7.20 TensorBoard 中的 HParams 面板。\n\n## 7.3.2: 代码示例\n\n图 7.21 是构建和分析具有各种超参数的\
    \ 36 个神经网络模型的源代码流程图。\n\n超参数\n![](img/image-pl2z167k.jpg) \n图 7.21 构建和分析 36 个具有不同超参数组合的神经网络的源代码流程图。\n\
    ![](img/image-myq1gjx5.jpg) ![](img/image-7yythgng.jpg)\n\n执行上述程序后，TensorBoard\
    \ 屏幕上会有更多关于超参数和指标值的信息，如图。\n\n以及训练网络模型\n![](img/image-n8tuez5r.jpg) \n图 7.22 带有超参数和指标信息的\
    \ TensorBoard HParams。\n![](img/image-6clsi6ok.jpg)\n\n训练数据：带有图像增强和不带图像增强\n![](img/image-9szkwoay.jpg)\
    \ ![](img/image-8fguxxey.jpg)\n\n一个用于构建和训练网络模型的函数。\n模型中使用的网络层如下：\n- 尺寸为 `32 ×\
    \ 32 × 3` 的输入层\n- 卷积层（权重初始化：`Random normal`、`Glorot normal` 或 `He normal`）\n-\
    \ 带有预设参数的批归一化层（超参数：使用或不使用）\n- `ReLU` 激活函数层\n- 池化层，用于特征图的下采样\n- 展层（flatten），用于将输入展平为一维\
    \ `Tensor`\n- Dropout 层，在训练期间每一步以 50%的频率随机将输入单元设置为 0\n- 全连接层；如果此层用作网络隐藏层，将采用 `ReLU`\
    \ 激活函数。如果此层用作网络输出层，将用 `ReLU` 激活函数替换为 `softmax` 激活函数。\n![](img/image-d9gu2jlv.jpg)\
    \ ![](img/image-lj6oujfh.jpg)\n\n### 具有不同超参数组合的 36 个网络模型\n7.2 显示了训练 36 个神经网络模型的超参数组合。\n\
    \n表格 7.2\n（表格内容省略）\n网络模型\n![](img/image-i5w9eyey.jpg)\n\n通过 TensorBoard HParams\
    \ 的训练结果。\n36 个神经网络模型的超参数和训练结果显示在 `HParams` 面板上，如图。\n\n#### 坐标视图\n![](img/image-4zdskfaf.jpg)\
    \ \n图 7.23 带有 36 个网络模型的 TensorBoard HParams。\n\n要使用并行坐标视图观察结果，请点击面板中的 `PARALLEL\
    \ COORDINATES VIEW`，如图。\n![](img/image-3lbz395d.jpg) \n图 7.24 带有并行视图的 HParams\
    \ 面板。\n\n从并行坐标视图的结果来看（如图所示），高准确率的网络模型使用了图像增强和批归一化技术，而使用不同类型的初始化方法或学习率对训练结果的影响很小。\n\
    ![](img/image-l54p7kv.jpg) \n图 7.25 不同超参数对网络模型准确率的影响。\n\n在 TensorBoard HParams\
    \ 中，可以设置准确率值的范围以过滤不需要的信息，如图。从 `HParams` 面板可以观察到如果应用批归一化，对初始化方法的选择就不那么细致，因为它们对准确率没有太大改变。\n\
    ![](img/image-5xxsc74p.jpg) \n图 7.26 限制了准确率范围的 TensorBoard HParams。\n\n我们还可以显示特定学习率的模型结果，例如显示学习率值为\
    \ `0.001` 的训练模型的结果，如图。所示，准确率最高的三个网络模型都是使用 `0.001` 的学习率训练的。\n![](img/image-ojl2zjqb.jpg)\
    \ \n图 7.27 选择运行特定学习率的 TensorBoard HParams。\n\n#### 补充说明\n图 7.27 中的结果显示，网络模型在用\
    \ `0.001` 的学习率训练时达到了最佳准确率。然而，这种比较是不公平的，因为使用 `0.001` 学习率的网络模型收敛速度远慢于 `0.01` 或 `0.03`。此外，使用\
    \ `ReduceLROnPlateau` 等回调函数也会减少此值，因此建议使用较高的学习率，然后在训练过程中逐渐降低此值。\n\n#### 图表视图\n\
    要显示比较每个超参数与每个指标的图表，请点击面板中的 `SCATTER PLOT VIEW`，如图所示。我们留给读者自行探索。分析方法与“并行坐标视图”部分相似。\n\
    ![](img/image-jn9y4uu8.jpg) \n图 7.28 带有散点图视图的 HParams 面板。\n\n第 8 章：卷积神经网络架构\n\n"
