- raw: '  Abstract    Convolutional neural networks (CNNs) have been widely applied
    to many computer vision applications such as image classification, face recognition,
    object detection, and so on. This chapter introduces some of the most popular
    CNN architectures, including LeNet, AlexNet, VGG, GoogLeNet, and ResNet. Then,
    it presents two scenarios of implementing Inception-v3, a CNN for computer vision.
    In the first scenario, we create the Inception-v3 model by using Keras Applications.
    In the second scenario, we employ TensorFlow Hub to build the Inception-v3 model.    
    Keywords    CNNs; Keras application; TensorFlow hub; Inception; ResNet; VGG    
    Outline      to popular convolutional neural network (CNN) architectures including
    LeNet, AlexNet, VGG, GoogLeNet, and ResNet    to Keras Applications and TensorFlow
    Hub    the Inception-v3 network through Keras Applications and TensorFlow Hub  '
  fmt: '

    # Abstract

    Convolutional neural networks (CNNs) have been widely applied to many computer
    vision applications such as image classification, face recognition, object detection,
    and so on. This chapter introduces some of the most popular CNN architectures,
    including `LeNet`, `AlexNet`, `VGG`, `GoogLeNet`, and `ResNet`. Then, it presents
    two scenarios of implementing `Inception-v3`, a CNN for computer vision. In the
    first scenario, we create the `Inception-v3` model by using `Keras Applications`.
    In the second scenario, we employ `TensorFlow Hub` to build the `Inception-v3`
    model.


    # Keywords

    CNNs; `Keras application`; `TensorFlow hub`; `Inception`; `ResNet`; `VGG`


    # Outline

    - To popular convolutional neural network (CNN) architectures including `LeNet`,
    `AlexNet`, `VGG`, `GoogLeNet`, and `ResNet`

    - To `Keras Applications` and `TensorFlow Hub`

    - The `Inception-v3` network through `Keras Applications` and `TensorFlow Hub`

    '
  trans: '


    # 摘要

    卷积神经网络（CNNs）已广泛应用于许多计算机视觉领域，如图像分类、人脸识别、目标检测等。本章介绍了一些流行的 CNN 架构，包括 `LeNet`、`AlexNet`、`VGG`、`GoogLeNet`
    和 `ResNet`。随后，介绍了实现计算机视觉 CNN —— `Inception-v3` 的两种场景。在第一种场景中，我们使用 `Keras Applications`
    创建 `Inception-v3` 模型；在第二种场景中，我们利用 `TensorFlow Hub` 构建 `Inception-v3` 模型。


    # 关键词

    CNNs；`Keras application`；`TensorFlow hub`；`Inception`；`ResNet`；`VGG`


    # 大纲

    - 介绍流行的卷积神经网络（CNN）架构，包括 `LeNet`、`AlexNet`、`VGG`、`GoogLeNet` 和 `ResNet`

    - 介绍 `Keras Applications` 和 `TensorFlow Hub`

    - 通过 `Keras Applications` 和 `TensorFlow Hub` 实现 `Inception-v3` 网络

    '
