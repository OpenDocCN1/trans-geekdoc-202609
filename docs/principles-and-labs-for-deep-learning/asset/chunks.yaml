    `backbone`: the first step of all detection methods is to train a backbone for
    feature extraction. For example, the backbone of `SSD` is `VGG-16`, the backbone
    of `YOLO-v2` is `DarkNet-19`, the backbone of `RetinaNet` is `ResNet-101` and
    the backbone of `YOLO-v3` is `Darknet-53`. `Darknet-53` network is built on `Darknet-19`
    architecture by adding convolutional layers with shortcut connections. It consists
    of 53 convolutional layers. `Darknet-53` has proven more efficient than `DarkNet-19`,
    `ResNet-101`, and `ResNet-152` in terms of accuracy and billion point operations
    per second


