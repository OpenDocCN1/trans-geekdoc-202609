    # Chapter 3: Binary classification problem


    ### Abstract

    Machine learning is a subfield of computer science, and binary classification
    is one of the most common problems in machine learning. In its basic form, binary
    classification refers to the model of predicting an input sample into one of two
    classes. This chapter first presents four main types of machine learning algorithms,
    including supervised learning, unsupervised learning, semi-supervised learning,
    and reinforcement learning. Next, we introduce the binary classification model
    in detail. Finally, we construct the Pokémon combat prediction model with a fully
    connected neural network (FCNN) step by step to help readers improve their practice
    skills in working with the binary classification problem and neural networks.


    ### Keywords

    Binary classification; Supervised learning; Unsupervised learning; One-hot encoding;
    Pokémon combat prediction


    ### Outline

    - to know four main types of machine learning algorithms

    - the binary classification problem

    - binary cross-entropy and one-hot encoding

    - the Pokémon combat prediction model with a fully connected neural network (FCNN)


    ## 3.1 Machine learning algorithms

    Machine learning is a subfield of computer science divided into four groups according
    to learning style: supervised learning, unsupervised learning, semi-supervised
    learning, and reinforcement learning. The following introduces the methods and
    applications of each type.


    #### Supervised learning

    An algorithm teaches the network model by using a given labeled dataset that consists
    of samples and corresponding labels. This algorithm is categorized into two main
    types, including classification and regression, and is widely applied in numerous
    computer vision applications such as object detection, image segmentation, speech
    recognition, and so on. The most commonly used supervised learning methods are:

    - neighbors algorithm (`KNN`)

    - trees and random forests

    - vector machines (`SVMs`)

    - neural networks (`DNNs`)


    #### Unsupervised learning

    Unlike the supervised learning algorithm, the unsupervised learning algorithm
    only uses the dataset without labels or annotations for drawing inference. The
    common tasks of the unsupervised learning algorithm include clustering and dimension
    reduction. Clustering is used to classify the input data into subgroups based
    on the correlation between the samples in each group. Dimension reduction is the
    process of transforming data from a high-dimensional space into a low-dimensional
    space while maintaining the structure and characteristics of the data. The following
    are commonly used unsupervised learning methods:

    - clustering problem

    - algorithm

    - cluster algorithm

    - dimension reduction problem

    - component analysis (PCA) algorithm

    - `PCA`


    #### Semi-supervised learning

    An approach that uses a set of data containing a larger amount of unlabeled data
    and a small amount of labeled data for training the models. Typically, semi-supervised
    learning algorithms combine supervised learning and unsupervised learning in an
    attempt to improve performance in one of these two techniques through the use
    of information related to the other. These algorithms are commonly applied for
    classification problems in which labeled data is scarce or difficult to achieve,
    such as computer-aided diagnosis, grammatical tagging, and so on.


    #### Reinforcement learning

    This technique has attracted much attention, as the Google DeepMind team has successfully
    applied reinforcement learning to Atari games, AlphaGo and robots. Reinforcement
    learning is a technique that allows an agent to learn and take actions in an interactive
    environment to maximize the expected cumulative reward. Specifically, at time
    the state and reward from the environment are sent to the agent, then the agent
    makes its own decision to select an action from a set of available actions to
    send back to the environment. The process is repeated with a new state and reward
    of the environment, as shown in Fig.


    ![](image-pxuwxcpq.jpg)

    Fig. 3.1 Reinforcement learning.

    '
