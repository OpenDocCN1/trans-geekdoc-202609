  trans: "\n\n# 1.6: Tf.data\n\n## 1.6.1: `tf.data` 简介\n\n准备数据并将数据输入模型中是训练机器学习和深度学习模型的第一步。如果构建数据输入流水线的方法导致\
    \ CPU 花费长时间加载数据，从而导致 GPU 需要等待 CPU，这可能会导致性能问题。为了防止 GPU 出现数据饥饿，TensorFlow 提供了 `tf.data`\
    \ API，以有助于构建复杂且高度优化的数据流水线。如图所示，在数据发送到机器学习或深度学习模型之前，通过 `tf.data` 经过三个阶段进行处理：提取阶段、转换阶段和加载阶段。\n\
    \n从本地磁盘（SSD、HDD）、云存储等存储设备中读取数据是数据流水线的第一步，`tf.data` 支持读取许多数据格式。图 1.9 展示了使用 `tf.data`\
    \ 读取和表示数据的示例。请注意，如果此步中的数据直接传递给模型，那么在每次训练迭代中将取表示数据中的某行。一个大小为 5 TB 的数据集和一个运行 16\
    \ GB 内存的 CPU 在训练模型时将遇到困难。\n\n![](img/image-gfn1mtgq.jpg)图 1.9 使用 `tf.data` 读取和表示数据。\n\
    \n在读取和表示数据后，通常下一步是打乱数据并创建小批次（mini-batches）。`tf.data` 使用 `tf.data.Dataset` 完成此任务，如图\
