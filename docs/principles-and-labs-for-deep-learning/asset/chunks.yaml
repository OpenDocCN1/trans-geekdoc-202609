    # 4.3: Experiment: CIFAR-10 image classification


    In this section, we use a `CIFAR-10` dataset to train and evaluate the performance
    of the multi-category classification models. For training, we use `CCE` and `Adam`
    as the loss function and optimizer, respectively. The network models are implemented
    in three scenarios:

    * fully connected neural network (`FCNN`)

    * CNN without applying image augmentation technique for training the model

    * CNN with image augmentation technique applied to increase the amount and diversity
    of training data


    ## 4.3.1: Introduction to CIFAR-10 dataset


    The `CIFAR-10` dataset `[14]` contains 60,000 RGB images with size of `32 × 32`
    for each, with 50,000 images used for training and 10,000 images for testing purposes.
    `CIFAR-10` consists of 10 classes: airplane, automobile, bird, cat, deer, dog,
    frog, horse, ship, and truck, as shown in Fig. The dataset can be downloaded at
    the official website:


    ![](image-ipewgw1w.jpg)Fig. 4.23 `CIFAR-10` dataset.


    ## 4.3.2: TensorFlow datasets


    The dataset plays a very important role in deep learning, but the different source
    format and complexities of datasets make it difficult to simply load them into
    deep learning models. To address this problem, `TensorFlow` provides a collection
    of ready-to-use public datasets called `TensorFlow Datasets`. In `TensorFlow Datasets`,
    all datasets are provided as `tf.data.Datasets`, supporting ease of use and highly
    optimized input pipelines. Here we present an example of loading data for training
    the network model using `tf.data.Datasets`.


    ![](image-el1lw864.jpg) There are more than 60 datasets for image classification.
    Many datasets for various fields such as object detection, question answering,
    summarization, and so on, are available on `TensorFlow Datasets`. Please go to
    `www.tensorflow.org/datasets/` for more details. In the next section, we load
    the `CIFAR10` dataset from `TensorFlow Datasets` through `tf.data.Datasets` API
    for training and testing multi-category classification models.


    ## 4.3.3: Code examples


    Fig. 4.24 is the flowchart of the source code for multi-category classification
    models.


    * data

    * packages


    ![](image-cwnrwb9a.jpg)Fig. 4.24 Flowchart of the source code for multi-category
    classification models.


    ![](image-huz91dzk.jpg) ![](image-gny66ib5.jpg)

    reading and analysis


