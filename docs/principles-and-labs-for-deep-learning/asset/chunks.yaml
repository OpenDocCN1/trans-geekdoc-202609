    # 第 9 章：迁移学习


    ## 摘要

    迁移学习已广泛应用于神经网络的训练，因为它通常比从零开始训练网络更快、更容易，且更有效。本章首先介绍并分析了迁移学习策略。然后，为了帮助读者进一步理解并提高开发神经网络的实践技能，本章实现了了两种构建和训练网络模型的场景。在第一种场景中，我们通过
    `Keras Applications` 构建了 `Inception-v3` 模型并从零开始训练该模型。在第二种场景中，通过 `TensorFlow Hub`
    构建了 `Inception-v3` 网络，并应用迁移学习来训练该网络模型。


    ## 关键词

    迁移学习；从零开始训练；预训练模型；CNN；神经网络


    ## 目录

    - 迁移学习策略

    - 通过 `TensorFlow Hub` 使用预训练的 `Inception-v3` 模型进行迁移学习

    - 迁移学习与从零开始训练

