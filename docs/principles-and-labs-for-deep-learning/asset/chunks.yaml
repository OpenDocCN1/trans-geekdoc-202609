    neural network    A convolutional neural network, also known as CNN or ConvNet,
    is a class of deep neural network that has been successfully applied to various
    computer vision applications, especially for analyzing visual images Fig. 4.1
    shows the rank of the best methods from the 2012 ImageNet Large Scale Visual Recognition
    Challenge (ImageNet LSVRC As shown, AlexNet using CNN is superior to the previous
    state-of-the-art image classification methods in terms of error rate. In subsequent
    ImageNet competitions, the models based on CNN, such as GoogLeNet ResNet ResNeXt
    and others, continue to be the winners and overwhelm traditional models with impressive
    performance.    ![](image-it95hlar.jpg)Fig. 4.1 The rank of the best methods from
    the 2012 ImageNet Large Scale Visual Recognition Challenge (ImageNet LSVRC).   
    As discussed in previous chapters, the regular neural networks include an input
    layer, hidden layers, and an output layer, where an input from the input layer
    is transformed through a series of hidden layers before being sent to the output
    layer. Each layer contains a set of neurons, in which each neuron is fully connected
    to all neurons in the previous layer, and neurons operate completely independently,
    as shown in Fig. The CNNs are similar to the regular neural networks, which means
    they are also made of layers containing neurons with learnable weights and biases.
    However, different from regular neural networks, neurons in the layers of CNNs
    are organized in three dimensions, including width, height, and depth, and each
    neuron is only connected to a local region in the previous layer through a kernel
    (receptive field of the neuron), as shown in Fig. In CNNs, the 3D input volume
    of neurons is transformed to a 3D output volume of neurons at every layer. For
    example, if a CNN designed for image classification on the ImageNet \[2\] dataset
    receives an image with dimensions 256 × 256 × 3 as the input, the final output
    layer of the CNN should have dimensions of 1 × 1 × 1000 because ImageNet has 1000
    classes.    ![](image-x0mhk8o7.jpg)Fig. 4.2 Illustration of a regular neural network
    and a convolutional neural network (CNN).    4.1.2: Building a convolutional neural
    network    In general, a simple CNN is built with three main types of layers:
    convolutional layer, pooling layer, and fully connected layer, as shown in Fig.
    The following introduces these layers in more detail.    layer    ![](image-e0661sn9.jpg)Fig.
    4.3 Illustration of convolutional neural network (CNN) architecture.    The principle
    of the convolution layer is to use kernels or filters to slide on the input for
    learning features. As shown in Fig. a 3 × 3 kernel is slid onto a 4 × 4 input
    image to produce a 2 × 2 output feature map in size; the output of the first calculation
    is 7, the calculation formula is:    ![](image-fr47mquo.jpg)  ![](image-e3byzu0d.jpg) 
    ![](image-b9fagtt6.jpg)  ![](image-6dna1zp0.jpg)Fig. 4.4 Computation in the convolutional
    layer.    The size and number of kernels are adjustable hyperparameters, and most
    of the sizes are set to odd numbers such as 3 × 3, 5 × 5, or 7 × 7. Since too
    many kernels may also cause over-fitting problem, it is necessary to adjust this
    parameter to select the most suitable ones.  Zero Fig. 4.4 describes the basic
    operation of the convolutional layer, in which after each convolution, the size
    of the output volume is changed compared with that of the input volume. To control
    the size of the output volume, a zero-padding technique is applied by padding
    zeros around the border of the input volume. In most cases, zero padding is used
    to retain the spatial size of the input volume. For example, by applying zero
    padding with a size of 1 around the border of a 4 × 4 input image, the input size
    becomes 6 × 6, as shown in Fig. Then, performing convolution with a kernel size
    of 3 × 3 on the input with a size of 6 × 6, the spatial size of the output volume
    is 4 × 4, which is the same size as the original input, as shown in Fig.    ![](image-ub6m89u7.jpg)Fig.
    4.5 Zero padding with size of 1\.    ![](image-w5uxufq2.jpg)Fig. 4.6 Convolution
    operation with zero padding.    Stride: Stride controls how the kernel slides
    on the input. In the general convolution layer, stride with a value of 1 is used,
    which means the kernel is slid one pixel at each time. When stride is greater
    than 1, such as stride of 2 in Fig. the kernel is moved 2 pixels at a time, resulting
    in smaller output volume spatially.    ![](image-qxlus9fc.jpg)Fig. 4.7 Convolution
    operation with stride 2\.    The formulas for calculating the spatial size of
    the output of the convolution layer in two padding modes of same padding mode
    and valid padding mode are expressed as follows.    padding (padding): The spatial
    size of the output is the same size as that of the input after convolution   
    ![](image-l21371tl.jpg)   ![](image-272lbgc9.jpg)  padding (no padding): The spatial
    size of the output is smaller than that of the input after convolution    ![](image-oi8pl4xf.jpg)  
    ![](image-90fryr7k.jpg)  Input size  Output size  kernel size or convolution filter
    size  stride size of the convolution operation    The preceding examples are the
    computations of a single input channel and single kernel, but in fact, in the
    convolutional layer, the computation is performed on multiple input channels and
    multiple kernels. For example, the convolution is performed on the color input
    image, as shown in Fig. in which the parameters are set as:    image: 4 × 4 × 3
    (height, width, depth), here the depth is shown as three colors: R (Red), G (Green),
    and B (Blue).  valid  1  number 2 (W0 and W1)  size: 3 × 3 ×  None    ![](image-c2sg2rz0.jpg)Fig.
    4.8 Convolution operation on an image with size of 4 × 4 × 3 with two kernels
    W0 (3 × 3 × 3) and W1 (3 × 3 × 3).    The number of parameters of the convolutional
    The formula for calculating the number of parameter of the convolution layer is:   
    ![](image-pc05xd7c.jpg)  The depth or the number of channels of the input  The
    height of the kernel  The width of the kernel  The number of kernels  if bias
    is used, bias = 1, otherwise bias = 0    Example 1: Calculating the number of
    parameters of the convolutional layer in Fig.    ![](image-km6m0p2n.jpg)  Example
    2: Create a CNN that comprised of an input layer with size of 28 × 28 × 4 and
    an output convolutional layer using 32 kernels, each kernel with size of 3 × 3.
    The parameter settings of the network are:    28 × 28 × 4 (height, width, and
    depth)  valid  1  number:  size:  Yes    Source code for building the CNN:   
    ![](image-dyawaera.jpg)  The number of parameters of the CNN can be obtained through
    the “model.summary()” function; it is 1184 parameters, as shown in Fig.    ![](image-vpmmj815.jpg)Fig.
    4.9 Summary of the convolutional neural network (CNN).    To verify whether the
    number of parameters of the CNN is the same as the 1184 shown in Fig. the parameter
    calculation formula above is applied. Because the CNN has only one convolutional
    layer, the number of parameters of the network is the number of parameters of
    the convolutional layer, computed as:    ![](image-ga4ive4u.jpg)  As shown, the
    calculation result is consistent with the number of parameters computed through
    the “model.summary()” function in Fig.    Supplementary explanation  Because the
    vanishing gradients problem is easy to encounter during training when using the
    sigmoid activation function in convolutional layers of the CNN, this activation
    function is replaced with the rectified linear activation (ReLU) function in current
    CNNs for effective training. Chapter 5 provides more information on the impact
    of sigmoid function and ReLU function on the performance of CNNs.     layer  The
    pooling layer is often adopted immediately after the convolution layer to reduce
    the spatial size (width and height) of the input volume for reducing the computation
    in the CNNs and avoiding the overfitting problem during the training process.
    The pooling layer works independently with every channel of the input, therefore
    the number of the channels or depth dimension of the presentation remains unchanged,
    as shown in Fig. There are some pooling layers such as max pooling, average pooling,
    and L2 norm pooling layers. Among them, the max pooling layer, which adopts max
    operation, is most commonly used in CNNs since it has proven to work more effectively
    in practice. An example in Fig. 4.11 is the operation of the max pooling layer,
    where the input of size 4 × 4 is pooled with a 2 × 2 kernel and stride 2, resulting
    in an output of size 2 × 2.    ![](image-ngv80c0x.jpg)Fig. 4.10 Illustration of
    pooling layer. Pooling layers work independently in each channel of the input
    volume.    ![](image-9kz3h0bb.jpg)Fig. 4.11 Operation of the max pooling layer.   
    connected layer  The fully connected layer or dense layer is an important component
    of CNNs. This layer has neurons with full connection to all neurons in the previous
    layer. It has been applied successfully in many computer vision applications such
    as image classification, semantic segmentation, and so on. In CNNs, convolution
    and pooling operations are performed first through convolutional layers and pooling
    layers to extract features from the input. The resulting features are flattened
    into a one-dimensional feature vector before being sent to the fully connected
    layer for combining data and driving the final output, as shown in Fig. If the
    neural networks are only constructed by fully connected layers, they are called
    fully connected networks. The fully connected networks are often extremely computationally
    expensive and have lower performance than CNNs. In the next section, we apply
    both a fully connected network and a CNN for multi-category classification to
    explore the effectiveness of each.    ![](image-3nixstc6.jpg)Fig. 4.12 The connection
    of a fully connected layer.     4.1.3: Operation of convolutional neural network   
    In CNNs, each convolutional layer has kernels for feature extraction from the
    input, and using kernels with different element values can obtain various effects,
    as shown in Table The kernels have no meaning at the beginning; their values need
    to be initialized and updated during training process.      Table 4.1    ![](images/image-0CT97QD1.jpg)  
    The preceding description only mentions the network with one convolutional layer.
    How do CNNs with multiple layers work? Fig. 4.13 illustrates the operation of
    a deep CNN for image classification, in which the first few convolutional layers
    (layers 1–3) are mainly responsible for extracting simple features of the input
    image such as edges, lines, and so on. Then, the resulting features are sent to
    the deeper layers (layers 4–6) for generating more specific features such as nose,
    eyes, and ears of objects. Finally, these output features are flattened into one-dimensional
    feature vector by a flatten layer and then fed into the fully connected layer
    for final prediction.    ![](image-ctcsukvx.jpg)Fig. 4.13 Deep convolutional network.   
    Figs. show examples of feature visualization in a CNN where the trained VGG-16
    \[6\] network on ImageNet \[2\] and the DeconvNet \[7\] are employed for obtaining
    results. As shown in Fig. the shallow layer (layer 2) of the VGG-16 network responds
    to conjunctions of lines and edges.    ![](image-5m6yrhsh.jpg)Fig. 4.14 Visualization
    of features in the second layer of the trained VGG-16 model.    ![](image-8qbt0p98.jpg)Fig.
    4.15 Visualization of features in the seventh layer of the trained VGG-16 model.   
    ![](image-lnppp9jf.jpg)Fig. 4.16 Visualization of features in the fifteenth layer
    of the trained VGG-16 model.    In Fig. the middle layer (layer 7) of the VGG-16
    network contains more complex invariances, extracting similar textures such as
    the shape of the moon, the windows, and the house.  In Fig. the deep layer (layer
    15) of the VGG-16 network presents the object with significant variation and more
    class specificity, such as the eyes, ears of the dogs and cat, the leg and pose
    of the bird, and so on.  '
