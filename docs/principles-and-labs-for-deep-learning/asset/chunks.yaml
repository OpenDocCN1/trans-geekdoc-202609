    # Chapter 9: Transfer learning


    ## Abstract

    Transfer learning has been widely applied for training neural networks because
    it is usually much faster, easier, and more effective than training a network
    from scratch. This chapter first introduces and analyzes transfer learning strategies.
    Then, to help readers understand more and improve the practice skills in developing
    neural networks, two scenarios of building and training network models are implemented.
    In the first scenario, we build the `Inception-v3` model through `Keras Applications`
    and train this model from scratch. In the second scenario, the `Inception-v3`
    network is built through `TensorFlow Hub`, and the transfer learning is applied
    for training this network model.


    ## Keywords

    Transfer learning; Training from scratch; Pre-trained model; CNN; Neural network


    ## Outline

    - to transfer learning strategies

    - the pre-trained `Inception-v3` model through `TensorFlow Hub` for transfer learning

    - transfer learning and training from scratch

