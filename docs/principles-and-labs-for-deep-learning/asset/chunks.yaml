    the smoothing ratio to zero to display the most original data without modification;
    note that setting the smoothing to zero is more convenient for finding the lowest
    point, as shown in Fig.    ![](image-7mws0a9f.jpg)Fig. 2.22 TensorBoard Scalars
    (2).     The experimental results prove that three methods are capable of solving
    the overfitting problem of the original model and improving the performance of
    the model. Among them, Model-4 applying the dropout technique has the lowest loss
    value, while Model-3 using L2 normalization has the lowest percentage error.   
