    # 9.2: Experiment: Using Inception-v3 for transfer learning


    This section introduces how to use the `Inception-v3` network for improving image
    classification performance on the `Dogs vs. Cats` dataset. We conduct two training
    scenarios. In the first scenario, we build the `Inception-v3` model, named `Model-1`,
    through `Keras Applications` and train it from scratch with random weight initialization.
    In the second scenario, we build a new network model, named `Model-2`, by using
    the `Inception-v3` network loaded through `TensorFlow Hub` for feature extraction
    and adopting two fully connected layers for classification. By applying transfer
    learning to `Model-2`, the weights of most of the layers are fixed; only two newly
    added fully connected layers are trained on the `Dogs vs. Cats` dataset to learn
    a new task. The experimental results show that `Model-2` obtains greater accuracy
    than `Model-1` does.


    ## 9.2.1: Introduction to Dogs vs. Cats dataset


    The `Dogs vs. Cats` dataset, which includes two classes of dog and cat, was introduced
    for a Kaggle machine learning competition in 2013. The Kaggle provides 25,000
    labeled images of dogs and cats for training and 12,500 unlabeled images for testing.
    Fig. 9.18 shows some of the images from the `Dogs vs. Cats` dataset. To build
    an optimized input pipeline in the experiment, the `Dogs vs. Cats` dataset is
    loaded from the `TensorFlow dataset` through the `tf.data.Datasets` application
    programming interface (API) for training and testing network models.


    ![](image-bwt8htak.jpg)

    Fig. 9.18 Images from Dogs vs. Cats dataset.


