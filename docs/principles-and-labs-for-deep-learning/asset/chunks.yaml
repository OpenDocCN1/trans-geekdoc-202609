    # 4.2 Multi-category classification


    ## 4.2.1 Introduction to multi-category classification


    In machine learning, multi-category classification refers to the problem of categorizing
    samples into one of three or more classes. Similar to the binary classification
    models introduced in Chapter the multi-category classification models are also
    used to model the probability of classes. However, unlike the binary classification
    models, which output a single probability to infer the input sample into one of
    two classes, the multi-category classification models produce one probability
    per class, in which the sum of output probability scores should be equal to 1,
    as shown in Fig. Based on the predicted probability scores, the model can determine
    which target class that the input sample belongs to. For example, given a model
    classifying three classes, after feeding a sample to the model, it outputs the
    probability score of 0.7 for class 1, 0.1 for class 2, and 0.2 for class 3. This
    means the model believes with 70% confidence that the input sample is in class
    1, 10% confidence it is in class 2, and 20% it is in class 3.


    ![](image-7ypkeye2.jpg)Fig. 4.17 Flowchart of classification models.


    ## 4.2.2 Multi-category classification model architecture


    As introduced in Section state-of-the-art multi-category classification models
    are based on `CNNs`, which have two main components of feature extractor and classifier,
    as shown in Fig.


    ![](image-hw39h3oy.jpg)Fig. 4.18 The architecture of a CNN-based multi-category
    classification model.


    ### Feature

    The feature extractor consists of convolutional layers and pooling layers for
    extracting features from the input. The classifier consists of fully connected
    layers that combine extracted features from the feature extractor for performing
    the final classification decision. To accomplish this goal, the last fully connected
    layer is followed by `softmax` function to compute a probability score for each
    target class. Described by the probability model, each output value of the `softmax`
    function is between 0 and 1, and the sum of all output values is guaranteed to
    be 1. The `softmax` function is expressed as:


    ![](image-iidzcp2i.jpg)


    For example, a model of classifying three classes = 3) outputs three values of
    = 3, 1, −3 at the last layer, and these values are passed through the `softmax`
    function to convert to probability scores of 0.88, 0.12, and 0, respectively,
    as shown in Fig. Based on these output probability scores the input sample clearly
    belongs to the first class.


    ![](image-xz022oeq.jpg)Fig. 4.19 Softmax output calculation.


    ### function

    As mentioned in the previous chapter, the classification problem can be divided
    into a binary classification problem and a multi-category classification problem.
    While binary cross-entropy (`BCE`) is usually used as the loss function for binary
    classification models, categorical cross-entropy (`CCE`) is employed as the loss
    function for multi-category classification models. The `CCE` loss function is
    a combination of `softmax` function and cross-entropy (`CE`) function. It is also
    called softmax loss, as shown in Fig.


    ![](image-y3y1q5gg.jpg)Fig. 4.20 Categorical cross-entropy (CCE).


    The formula for `CE` is defined:


    ![](image-5b65wyx.jpg)


    The formula for `CCE` is expressed as:


    ![](image-0ttz9pw.jpg)


    where, `y` is the expected output, is the predicted value of the model, `f` is
    `softmax` function, `C` is number of categories, and `N` is the amount of data
    in a batch. Fig. 4.21 shows an example for calculating `CCE`. The neural network
    with the output layer followed by the `softmax` function takes the “cat” image
    as the input and outputs the prediction result of [0,0,0,0.6,0,0,0.1,0,0.3,0].
    The error between the expected output [0,0,0,1,0,0,0,0,0] and the prediction result
    is calculated using:


    ![](image-2zxm9ppn.jpg)

    ![](image-wipcpnzd.jpg)

    ![](image-2n9pps4a.jpg)

    ![](image-8ma4x6rp.jpg)Fig. 4.21 A calculation example using categorical cross-entropy
    (CCE).


    ## 4.2.3 Data augmentation


    As mentioned in Chapter the deep learning models often encounter the problem of
    overfitting during training. As such, three methods are used to prevent this problem:
    reducing the size of the model, weight regularization, and dropout. Another way
    to deal with the problem of overfitting is to increase the amount and diversity
    of the training data by applying different transformations to the available data;
    this is called data augmentation Because data augmentation is most commonly used
    in image processing, it is also called image augmentation. By using image augmentation,
    the amount of data can be increased more than two times compared with the original
    data, as shown in Fig. The common image transformations techniques are:


    - flipping

    - rotation

    - shifting

    - scaling

    - conversion (contrast, saturation or brightness, etc.)

    - image (Gaussian blur or average blur, etc.)

    - noise (Gaussian noise or pepper and salt noise, etc.)


    ![](image-ozhya9sx.jpg)Fig. 4.22 Example of image augmentation.

