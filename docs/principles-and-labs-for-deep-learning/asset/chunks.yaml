    # 11.1: Generative adversarial network


    ## 11.1.1: Introduction to generative adversarial network


    Goodfellow et al. [1] proposed the Generative Adversarial Network (GAN) in 2014.
    GAN learns to produce new data having the same statistics as the training data
    and consists of two subnetworks including a generator and discriminator, as shown
    in Fig. The generator is responsible for generating fake samples that are indistinguishable
    from real samples, while the discriminator learns to identify the authenticity
    of the generated samples from the generator. The closer the generated samples
    are to the real samples, the higher the score the discriminator gives, and vice
    versa. Because the output of the discriminator goes through the sigmoid activation
    function, the score is in the range of 0 to 1.


    ![](image-ettklgvn.jpg)Fig. 11.1 Operation of generator and discriminator.


    The operation of a GAN can be imagined as a student (generator) who learns to
    draw a portrait and a teacher (discriminator) who estimates and distinguishes
    between the portrait of the student and a real portrait. Based on the corrections
    of the teacher, the student learns to improve the work, forming a cycle of confrontation
    and improvement. At the end of the training, the portrait drawn by the student
    and the real portrait become indistinguishable. This is the main concept of a
    GAN, as shown in Fig.


    ![](image-4niiauju.jpg)Fig. 11.2 Diagram of a Generative Adversarial Network (GAN).


    Many types of GANs have been proposed, such as DCGAN, ImprovedGAN, PACGAN, WGAN,
    WGAN-GP, CycleGAN, PGGAN, StackGAN, video2video, BigGAN, StyleGAN and so on. GANs
    have shown remarkable results in many computer vision tasks such as image generation,
    text generation, text-to-image generation, image-to-image translation, and so
    on, as shown in Fig.


    ![](image-blr5q77j.jpg)Fig. 11.3 Applications of Generative Adversarial Networks
    (GANs).


    ## 11.1.2: Training generative adversarial network


    The training method for a GAN is different from that of network models introduced
    in the previous chapters. In training a GAN, two models including the generator
    and discriminator are simultaneously trained by an adversarial process using separate
    loss functions, as shown in Fig. We introduce the loss functions for training
    the generator and discriminator in the following section.


    ### generator


    ![](image-g8t5bbej.jpg)Fig. 11.4 The training process of a Generative Adversarial
    Network (GAN).


    The purpose of training the generator is to minimize generator loss. The lesser
    the generator loss, the greater the ability of the generator to produce fake samples
    that are close to the real samples. As shown in Fig. after inputting a set of
    random vectors (`z`) to the generator, a generated image (` `) is produced. Then,
    this resulting image is sent to the discriminator for identification. If the output
    of the discriminator is close to 1, the less the generator loss will be. This
    means that the discriminator believes that the sample generated by the generator
    is more realistic or, in other words, the discriminator is unable to distinguish
    the real sample and the generated sample (fake sample). During training of the
    generator, the weights of the discriminator need to be fixed. The loss function
    of the generator is formulated as:


    ```

    ![](image-9lo7fenc.jpg) generator.

    discriminator.

    input data of the generator.

    N: amount of training data.

    ```


    ### discriminator


    ![](image-w8mzqug2.jpg)Fig. 11.5 Diagram of training the generator.


    The purpose of training a discriminator is to minimize discriminator loss. The
    lesser the discriminator loss, the more the discriminator is capable of distinguishing
    between generated samples and real samples. As shown in Fig. after the real image
    (`x`) is inputted to the discriminator, the output prediction result is expected
    to be 1. After the generated image (` `) is produced through the generator using
    a set of random vectors (`z`) as input, it is passed through the discriminator
    for identification, and the output is expected to be 0. When the output of the
    discriminator with the real sample is closer to 1, and that of the generated sample
    is closer to 0, the discriminator loss is lower or, in other words, the discriminator
    can easily distinguish the real sample from the generated sample. During training
    of the discriminator, the weights of generator need to be fixed. The objective
    function of the discriminator is described as:


    ```

    ![](image-sdkhgft5.jpg) discriminator.

    real image from dataset.

    : generated image from the generator.

    N: amount of training data.

    ```


    ![](image-4dvzdpr6.jpg)Fig. 11.6 Diagram of training the discriminator.


    During training a GAN, after each iteration, the generator produces more realistic
    samples, while the discriminator becomes better at telling them apart, as shown
    in Fig. The process reaches equilibrium when the discriminator can no longer distinguish
    real samples from generated samples.


    ![](image-70t06h40.jpg)Fig. 11.7 The output result changes of the generator after
    the different number of training iterations.

