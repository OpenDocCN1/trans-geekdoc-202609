    ## 第 6 章：高级 TensorFlow


    ### 摘要

    尽管 TensorFlow 的高级 Keras 应用程序接口（API）使得构建和训练神经网络模型变得简单，但它仍然存在局限性。例如，作者在最新论文中提出的所有新网络层或损失函数并没有包含在高级
    API 中，因此这些层和损失函数无法用于构建新的网络模型。在本章中，我们引入了高级 TensorFlow 技术，展示了如何为特定目的定制 API，例如自定义网络层、自定义损失函数、自定义指标函数和自定义回调函数。然后，我们提供了两种构建用于多类别分类神经网络的场景。在第一种情况下，我们应用了高级
    Keras API；在第二种情况下，我们使用 TensorFlow 的自定义 API。


    ### 关键词

    Keras API；自定义 API；网络层；损失函数；指标函数；回调


    ### 提纲

    - 使用 TensorFlow 创建自定义 API

    - 在设计神经网络时使用高级 Keras API 和 TensorFlow 自定义 API 的益处

    - 使用高级 Keras API 和 TensorFlow 自定义 API 的神经网络


