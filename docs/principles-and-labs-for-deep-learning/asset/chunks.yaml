    ## 2.4: TensorBoard 简介


    TensorBoard 是 TensorFlow 的一个工具包，为机器学习实验提供了所需的可视化和测量功能，例如跟踪训练过程中的损失值和模型准确率、可视化模型图、查看直方图等。使用
    TensorBoard 有两种常用方法：


    (1) 在使用 Keras 的 `Model.fit` 进行训练时，添加 `tf.keras.callbacks.TensorBoard` 函数来创建和存储日志；

    (2) 在使用 `tf.GradientTape()`或其他方法进行训练时，使用 `tf.summary` API 记录信息。


    TensorBoard 的图形界面如图所示。TensorBoard 有四个主要的工具：Scalars（标量）面板、Graphs（图）面板、Distributions（分布）面板和
    Histograms（直方图）面板。


    - **Scalars 面板**：有助于在训练神经网络期间跟踪学习率、损失、准确率等标量值。

    - **Graphs 面板**：有助于可视化由 TensorFlow 构建的模型。

    - **Distributions 和 Histograms 面板**：有助于显示张量的分布。它们被广泛用于可视化 TensorFlow 权重和偏置。


    ![](img/image-s0fpyffe.jpg)图 2.14 TensorBoard 的图形界面。


    ### TensorBoard 的优缺点包括：


    - 在模型训练期间的信息（如损失、准确率的变化、权重和偏置的直方图等）可以实时跟踪和查看，而无需等到训练完成。

    - 在模型训练期间，信息会多次写入日志文件。如果记录了大量信息，会训练时间。


    在训练房价预测模型时，已添加了 TensorBoard 回调函数即 `keras.callbacks.TensorBoard` 来创建和存储日志。打开日志文件有两种方法：第一种直接在
    Jupyter Notebook 中打开日志文件，第二种是通过终端运行 TensorBoard，然后通过浏览器观察结果。


