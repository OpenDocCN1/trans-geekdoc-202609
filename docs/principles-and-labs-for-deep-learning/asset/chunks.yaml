    # 第 5 章：神经网络训练


    ## 摘要

    神经网络的训练是一个寻找合适权重集的过程，以实现在训练数据和验证数据上获得高性能。本章介绍了训练网络模型时使用的一些重要技术，包括反向传播、权重初始化和批次归一化。随后，我们检查了每种权重初始化技术的有效性，并通过将批次归一化应用于
    CIFAR-10 数据集的神经网络模型训练，验证了其有效性。最后，我们通过 TensorBoard 上对第 4 章和本章中所有训练过的神经网络的性能进行了总结、比较和可视化，以观察每种技术对训练过程中模型收敛的影响。


    ### 关键词

    反向传播；权重初始化；Glorot 初始化；He 初始化；批次归一化


    ### 目录

    - 用于训练神经网络的反向传播算法

    - 权重初始化的重要性

    - 使用 TensorBoard 观察神经网络的权重分布

    - 批次归一化的性

    - 不同神经网络训练技术的有效性


    ## 5.1: 反向传播


    ### 5.1.1 反向传播简介

    反向传播（Backpropagation, BP）[1] 是一种结合梯度下降来更新神经网络权重的方法，我们在之前的章节中介绍过。梯度下降是用于神经网络进行优化的最常用算法之一。通过计算梯度并向反方向移动，可以在训练过程中减小网络预测结果与预期输出之间的误差。权重更新公式为：


    ![](img/image-cpxz2hdj.jpg)


    其中 `L` 是损失函数，`η` 是学习率，`W` 是神经网络的权重。通过上述公式，`BP` 方法被用于计算每个输入和输出示例的损失函数相对于神经网络权重的梯度。以下是一个解释如何计算梯度的示例。


    图 5.1 显示了带有前向传播计算的单层神经网络的示意图。其计算过程为：


    ![](img/image-jo1mgf5d.jpg) ![](img/image-nwimaqqw.jpg) ![](img/image-4d6sp5uk.jpg)
    其中 `x` 和 `b` 是输入数据；`w` 是网络的权重；`f` 是激活函数；`ŷ` 是神经网络的预测值，`y` 是预期输出。


    ![](img/image-q5329bcl.jpg) 图 5.1 单层神经网络的前向传播计算图。


    `BP` 用于计算梯度 `∂L/∂∂W` 并更新网络权重，如如图所示。其计算过程为：


    ![](img/image-265bu1et.jpg) ![](img/image-yzmxqdtg.jpg) ![](img/image-y2yf57xv.jpg)
    ![](img/image-i380z9pp.jpg) 图 5.2 单层神经网络的反向传播（BP）计算图。


    ### 5.1.2 梯度消失问题

    梯度消失是指在训练神经网络时（尤其是使用梯度法和 `BP` 训练深层神经网络 DNNs 时）所会遇到的问题。表 5.1 列出了三种常见的激活函数：sigmoid、tanh
    和正向线性单元（`ReLU`）。在神经网络的隐藏层中使用 `sigmoid` 和 `tanh` 激活函数可能会导致梯度消失问题。例如，当通过 `sigmoid`
    激活函数层执行 `BP` 时，需要与 `sigmoid` 函数的梯度相乘。`sigmoid` 导数的最大值为 0.25，这意味着梯度在一次传递后将衰减 0.25
    倍。如果神经网络有五层，梯度将至少减少 0.25⁵，这使得难以更新神经网络的前层权重。同样，`tanh` 激活函数也存在这种情况。最近，隐藏层通常采用 `ReLU`
    激活函数，因为它在输入为正时直接输出输入，否则输出零，从而克服梯度消失问题，并允许神经网络学习得更快、更有效。


    表 5.1


    这里我们解释在神经网络中使用 `sigmoid` 激活函数时的梯度消失。假设有一个双层神经网络，每层都使用 `sigmoid` 激活函数计算输出值，输入权重
    `w` 和 `b` 以及预期输出 `y`，图 5.3 显示了带有前向传播计算的网络示意图。其计算过程为：


    ![](img/image-2mzto0i7.jpg) ![](img/image-gw8av86g.jpg) ![](img/image-szngovj4.jpg)
    ![](img/image-bel9vnco.jpg) ![](img/image-wmo5sslq.jpg) 这里


