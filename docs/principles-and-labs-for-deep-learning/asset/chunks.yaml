    \ using `tf.keras`\n- of `tf.data` for building input pipelines\n\n## 1.1 Deep\
    \ learning\n\n### 1.1.1 Introduction to deep learning\nArtificial Intelligence\
    \ (AI) refers to giving machines the ability to learn and mimic human actions.\
    \ It is mainly used to assist humans, especially by replacing high-repetition,\
    \ low-skill jobs. AI is a comprehensive field that includes evolutionary computation,\
    \ expert systems, symbolic AI, support vector machines (SVMs), machine learning,\
    \ deep learning, reinforcement learning. Machine learning is a branch of AI that\
    \ involves reinforcement learning, deep learning, and so. Deep learning refers\
    \ to the use of neural networks, namely input layers, hidden layers, and output\
    \ layers. The “deep” in deep learning refers to the use of multiple layers through\
    \ which the data can be transformed. It is currently the most popular technique\
    \ because it supports neural networks, as shown in Fig.\n\n![](image-pugmfy.jpg)\n\
    Fig. 1 Deep learning\n\nIn deep learning, a set of data is inputted to the neural\
    \ network which is described as a series of computational steps through a directed\
    \ graph. By using `CNTK` for building deep learning models, the weights of the\
    \ network will be updated. Deep learning is widely applied to various areas such\
    \ as computer vision, speech recognition, and natural language.\n\n### 1.1.2 Deep\
    \ learning toolkits\nNumerous open-source tools have been introduced to develop\
    \ and train machine learning models. The most popular deep learning toolkits are\
    \ as follows:\n\n- **TensorFlow**: An end-to-end, open-source platform written\
    \ in Python and C++ that provides a comprehensive ecosystem of tools and libraries\
    \ to help developers easily build and deploy machine learning models.\n- **Keras**:\
    \ A high-level application programming interface (API) written in Python with\
    \ enabling fast experimentation on top of other toolkits such as TensorFlow, Theano,\
    \ and CNTK.\n- **Caffe**: A deep learning framework written in C++ developed by\
    \ Berkeley Artificial Intelligence Research; models and optimization can be expressed\
    \ by configuration without hard coding.\n- **MXNet**: An efficient library for\
    \ deep learning that quickly trains network models and supports multiple programming\
    \ languages, including Python, Scala, Clojure, Java, Julia, Perl, C++, and R.\n\
    - **Theano**: A Python library for efficiently optimizing and evaluating mathematical\
    \ expressions regarding multi-dimensional arrays. Symbolic differentiation can\
    \ be efficiently performed through Theano with the use of graphics processing\
    \ units (GPUs).\n- **CNTK**: Microsoft Cognitive Toolkit; the deep learning models\
    \ will be described as a series of computational steps through a directed graph.\n\
    - **DL4J**: A distributed deep learning library written in Java that is compatible\
    \ with Java virtual machine languages, namely Scala, Clojure, or Kotlin. DeepLearning4J\
    \ is equal to Caffe in terms of performance when using multiple GPUs.\n- **PyTorch**:\
    \ A Python package that provides tensor computations like Numpy with sped-up GPU\
    \ performance and that supports a neural network library with maximum flexibility.\n\
    - **Chainer**: A Python-based deep learning framework that supports building and\
    \ training neural networks by providing automatic differentiation APIs and object-oriented\
    \ high-level APIs.\n- **DIGITS**: Learning GPU Training System; a web application\
    \ that supports frameworks including Caffe, TensorFlow, and Torch to accelerate\
    \ training neural network models for image classification, segmentation, and object\
    \ detection tasks.\n"
