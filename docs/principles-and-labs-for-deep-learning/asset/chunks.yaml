    # Chapter 12: Object detection


    ### Abstract

    Object detection is one of the most important tasks in computer vision. It not
    only classifies the category of objects but also determines the location of them
    on the image. In this chapter, we discuss state-of-the-art CNN-based object detection
    methods. Then, we present an example program of building, training, and testing
    the `YOLO-v3` model on the PASCAL VOC 2007 dataset.


    **Keywords**: R-CNN; YOLO; SSD; RetinaNet; CFF-SSD; DSNet


    ### Outline

    - to computer vision

    - to state-of-the-art CNN-based object detection methods

    - the YOLO-v3 object detection model


    ## 12.1: Computer vision

    Computer vision is an interdisciplinary scientific field that focuses on addressing
    how computers can understand the contents of images or videos for automating tasks
    like the human visual system. Computer vision has a wide range of applications
    such as video surveillance, face recognition, face annotation, image retrieval,
    biometrics, traffic monitoring, visibility restoration, object detection and so
    on. The four main tasks of computer vision are:


    - **classification**: To identify the category of the image, as shown in Fig.
    The common network models used for image classification include `GoogLeNet`, `ResNet`
    and so on.

    ![](image-5yvt21yk.jpg)

    Fig. 12.1 Four main tasks in computer vision.


    - **detection**: To find out the category of objects and their location in a given
    image, as shown in Fig. The common network models used for object detection include
    `Faster R-CNN`, `YOLO-v3` and so on.

    - **segmentation**: To assign a label to every pixel in the image, as shown in
    Fig. The common network models used for semantic segmentation include `FCN`, `DeepLab-v3`
    and so on.

    - **segmentation**: To identify the boundary of each object at the detailed pixel
    level in the image, as shown in Fig. The common network models used for instance
    segmentation include `FCIS`, `Mask R-CNN` and so on.


    Because object detection is widely applied in various areas of computer vision,
    this chapter focuses on introducing object detection methods, especially state-of-the-art
    CNN-based models.


    ## 12.2: Introduction to object detection

    Object detection is one of the most important tasks in computer vision. It not
    only classifies the category of objects but also determines the location of them
    on the image. As shown in Fig. the network takes an image as input, and then predicts
    multiple classes and bounding boxes for this image input. Finally, it frames and
    marks the label for each predicted object on the output image.

    ![](image-ekcux8kf.jpg)

    Fig. 12.2 Block diagram of object detection.


    ### Supplementary explanation

    There are many bounding box formats, such as `(x1, y1, x2, y2)` shown in Fig.
    where `(x1, y1)` and `(x2, y2)` are the top-left and bottom-right coordinates
    of the object on the image, respectively. Another common format like `(x, y, w,
    h)`, where `(x, y)` is the top-left coordinate, `w` and `h` are the width and
    height of the bounding box, respectively. Each object detection method can employ
    different bounding box formats for object location prediction.


    Object detection based on convolutional neural network (CNN) has received considerable
    attention and achieved impressive performance in recent years. It can be divided
    into two groups (1) region proposal-based approach and (2) regression/classification-based
    approach.


    - **proposal-based approach**: Following this approach, the object detection methods
    perform prediction in two steps. In the first step, the regions of interest (`RoIs`)
    of objects in a given image are created by using region proposal methods such
    as `selective search`. In the second step, the `RoIs` are fed into a `CNN` for
    classifying objects and refining the bounding boxes. Although the running time
    of the region proposal-based approaches might be relatively slow because of predicting
    objects in two separate stages, they usually obtain high performance in detecting
    objects. The representative network models of the first group include `R-CNN`,
    `Fast R-CNN`, `Faster R-CNN` and so on.

    - **approach**: The object detection methods belonging to this group use only
    one step for predicting the object, mapping directly from the whole input image
    to bounding boxes and class probabilities. These methods can achieve real-time
    speed, making them applicable to real-world systems; however, the accuracy is
    not great. Many methods have been proposed to improve detection performance such
    as `SSD`, `YOLO-v2` and `YOLO-v3` and so on.

