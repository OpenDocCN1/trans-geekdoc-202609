    \ 2\n- 从 TensorFlow 2 开始\n- 使用 `tf.keras` 构建神经网络\n- 使用 `tf.data` 构建输入流水线\n\n##\
    \ 1.1 深度学习\n\n### 1.1.1 深度学习简介\n人工智能（AI）是指赋予机器学习和模仿人类行为的能力。它主要用于辅助人类，特别是取代高重复、低技能的工作。AI\
    \ 是一个综合领域，包括进化计算、专家系统、符号 AI、支持向量机（SVMs）、机器学习、深度学习和强化学习。机器学习是 AI 的一个分支，涉及强化学习、深度学习等。深度学习是指使用神经网络，即输入层、隐藏层和输出层。深度学习中的“深”指的是使用多层对数据进行转换层。它是目前最流行的技术，因为它支持神经网络，如图所示。\n\
    \n![](img/image-pugmfy.jpg)\n图 1 深度学习\n\n在深度学习中，一组数据被输入神经网络，神经网络被描述为通过有向图的一系列计算步骤。通过使用\
    \ `CNTK` 构建深度学习模型，网络的权重将得到更新。深度学习广泛应用于计算机视觉、语音识别和自然语言等领域。\n\n### 1.1.2 深度学习工具包\n\
    目前已引入许多开源工具用于开发和训练机器学习模型。最流行的深度学习工具包如下：\n\n- **TensorFlow**: 一个用 Python 和 C++\
    \ 编写的端到端开源平台，提供了全面的工具和库生态系统，帮助开发者轻松地构建和部署机器学习模型。\n- **Keras**: 一个用 Python 编写的高层应用程序编程接口（API），允许在\
    \ TensorFlow、Theano 和 CNTK 等其他工具包之上进行快速实验。\n- **Caffe**: 一个由伯克利人工智能研究中心开发的用 C++\
    \ 编写的深度学习框架；模型和优化可以通过配置来表示，而无需硬编码。\n- **MXNet**: 一个高效的深度学习库，可以快速训练网络模型并支持多种编程语言，包括\
    \ Python、Scala、Clojure、Java、Julia、Perl、C++ 和 R。\n- **Theano**: 一个 Python 库，用于高效地优化和评估有关多维数组的数学表达式。通过图形处理器（GPU），可以通过\
    \ Theano 高效执行符号微分。\n- **CNTK**: 微软认知工具包；深度学习模型被描述为通过有向图的一系列计算步骤。\n- **DL4J**:\
    \ 一个用 Java 编写的分布式深度学习库，兼容 Java 虚拟机语言，即 Scala、Clojure 或 Kotlin。在运行多个 GPU 时，DeepLearning4J\
    \ 的性能与 Caffe 相当。\n- **PyTorch**: 一个 Python 软件包，提供类似 Numpy 的张量计算，具有加速的 GPU 性能，并支持具有最大灵活性的神经网络库。\n\
    - **Chainer**: 一个基于 Python 的深度学习框架，通过提供自动微分 API 和面向对象的高层 API 来支持构建和训练神经网络。\n-\
    \ **DIGITS**: 学习 GPU 训练系统；一个支持 Caffe、TensorFlow 和 Torch 等框架的 Web 应用，用于加速图像分类、分割和目标检测任务的神经网络模型训练。\n\
    \n"
