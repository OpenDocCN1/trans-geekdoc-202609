    # 12.4: Experiment: Implementation of YOLO-v3


    This section introduces how to build the `YOLO-v3` model for object detection.
    To conduct experiments, we used the `PASCAL VOC 2007` dataset for training and
    testing the model.


    ## 12.4.1 Load YOLO-v3 project


    Because the example program of `YOLO-v3` model in this chapter is more complicated
    than the previous examples in Chapters 1–9, we use `PyCharm` IDE as a compiler
    to write and train the model. The process of loading the `YOLO-v3` project is
    as follows.


    - the `YOLO-v3` project: please go to `https://github.com/taipeitechmmslab/MMSLAB-DL/tree/master`
    to download the source code, as shown in Fig. ![](image-rwie3eg6.jpg)Fig. 12.28
    `YOLO-v3` project (Lab12) on GitHub.

    - `PyCharm` to open the project, as shown in Fig. ![](image-rdro5kwk.jpg)Fig.
    12.29 Open the project on PyCharm.

    - the path to load the project, as shown in Fig. ![](image-kbvx2m5z.jpg)Fig. 12.30
    The path of the `YOLO-v3` project.

    - the compilation environment (Note: if this step already set, it is omitted):
    Click `File` → `Settings` → `Project` “name of the project” → `Project Interpreter`
    → `Add` → `Virtualenv Environment` → `Existing environment` → Select the virtual
    machine, as shown in Figs. 12.31 and ![](image-vwibgmtx.jpg)Fig. 12.31 New interpreter.
    ![](image-9nw2s6k6.jpg)Fig. 12.32 Selecting an existing virtual environment.


    ## 12.4.2 Introduction to dataset


    In this section, we use the `PASCAL Visual Object Classes 2007` (`PASCAL VOC 2007`)
    dataset to train and test the `YOLO-v3` model. This is a benchmark dataset that
    has been used to evaluate many object detection methods, such as `R-CNN`, `SSD`,
    `YOLO`, and so on. The dataset can be loaded through `TensorFlow` datasets as
    follows. ![](image-otn3e3f6.jpg) The `PASCAL VOC 2007` dataset consist of three
    sets, including a training set with 2501 images, validation set with 2510 images,
    and test set with 4952 images. This dataset has 20 classes, which can be displayed
    by using the following command. ![](image-ijkf7c43.jpg) Display dataset: display
    an image in the dataset and ground-truth bounding boxes of objects ![](image-8amjblnu.jpg)
    ![](image-65182mxv.jpg)


    ## 12.4.3 Building YOLO-v3 model


    Fig. 12.33 shows the `YOLO-v3` project, which includes the following files and
    folders:

    - the source code file for training the `YOLO-v3` model

    - the source code file for multi-scale training

    - the source code file for testing the model

    - the source code file for setting model parameters, training parameters, and
    weight path

    - the source code file for converting the trained weight of `YOLO-v3` into the
    `TensorFlow` format

    - the folder where the source code files of custom network layers are stored

    - the folder where the source code file of custom network models is stored

    - the folder where the source code file of custom loss function is stored

    - the folder where the toolkits are stored, such as `dataset.py` for loading the
    dataset, `evaluation.py` for evaluating the model, and so on

    - the folder for storing output results ![](image-ewipp1dd.jpg)Fig. 12.33 The
    `YOLO-v3` project. ![](image-2fmp3n0j.jpg)Fig. 12.34 Flowchart of the source code
    for the `YOLO-v3` model.


    Running the `YOLO-v3` project requires executing two files: `train.py` (or `train-multi-scale.py`)
    for training the model and `test.py` for testing the trained model. The difference
    between `train.py` and `train-multi-scale.py` is that `train.py` uses a fixed
    input size to train the model, whereas `train-multi-scale.py` employs multi-scale
    training, where the size of the input image is changed by multiples of 32, such
    as 320, 352, 384, 416, 448, 480, 512, 544, 576, and 608, every 10 epochs of training.
    The minimum input size is 320 × 320 and the maximum input size is 608 × 608. The
    result of the training method using `train-multi-scale.py` is better than that
    of using `train.py`, but it takes a longer time to train.


    ### The YOLO-v3 model


    Fig. 12.34 is the flowchart of the source code for building the `YOLO-v3` model.


    ### helper functions

    - **backbone**: The source code for `Darknet-53` is written at `model → darknet.py`.
    `YOLO-v3` employed `Darknet-53` as the backbone network for feature extraction.
    Figs. 12.35 and 12.36 show the architecture of `Darknet-53`. ![](image-mptzu1or.jpg)Fig.
    12.35 The architecture of `Darknet-53` (1). ![](image-65ldwtal.jpg)Fig. 12.36
    The architecture of `Darknet-53` (2). The code for `Darknet-53` is as follows
    ![](image-y6djff28.jpg) The source codes for `Darknet Convolution` and `Darknet
    Residual Block` are as follows ![](image-bjponje8.jpg) ![](image-8ftwtbc.jpg)

    - **architecture**: The source code for the `YOLO-v3` model is written at `model
    → yolo.py`. `YOLO-v3` uses three different convolutional layers to detect objects
    at multiple scales. Figs. 12.37 and 12.38 show the architecture of `YOLO-v3`.
    ![](image-ehbq6lr.jpg)Fig. 12.37 The architecture of `YOLO-v3` (1). ![](image-56gp8zy9.jpg)Fig.
    12.38 The architecture of `YOLO-v3` (2). The source code of `YOLO-v3` model is
    as follows ![](image-zeq381r.jpg) ![](image-myhq8cs6.jpg)

    - **setting of the convolutional layer of YOLO-v3**: ![](image-e46dd7p.jpg) ![](image-sfk1xvlm.jpg)
    This custom layer is used to reshape the output size to the size of `(acth, grid_h,
    grid_w, anchors + 5)` ![](image-pqkt0q84.jpg) convert the predicted coordinates
    of the model into bounding box `(x, y, w, h)` through the following formula ![](image-0g2f0qil.jpg)
    ![](image-amz6i8ap.jpg) ![](image-yr4zp9x.jpg) ![](image-3s8ft3.jpg) coordinates
    of the center, width, and height of the predicted bounding box, respectively.

    - **top corner of the image**: ![](image-e1vg9shu.jpg) ![](image-vm4kh118.jpg)
    `sigmoid` activation function. This custom layer is used to remove the redundant
    bounding box prediction ![](image-3spdkfox.jpg) ![](image-sdup0ngz.jpg)

    - **loss function**: The source code of the objective loss function is described
    as below ![](image-jbf65o0t.jpg) ![](image-1d4t7ve.jpg) ![](image-s15ba0gu.jpg)
    The function for calculation of IoU ![](image-4o37oa7.jpg) ![](image-1qp7lf.jpg)

    - **preprocessing**: The source code for data preprocessing is stored at `utils
    → dataset.py`. Data preprocessing for training the `YOLO-v3` model is divided
    into two steps: (1) data augmentation and (2) training target transformation.

    - **augmentation**: color conversion, horizontal flip, image scale, and image
    rotationimage-m0ovxqp8.jpg) ![](image-0hokggtb.jpg)

    - **target transformation**: Transform data format `(batch size, 100, [x1, y1,
    x2, y2, classes])` into `(batch size, grid, grid, anchors, [x, y, w, h, obj, class])`image-70e46b2p.jpg)
    ![](-ey3hmt03.jpg) ![](-we9ukf1r.jpg)

    - **pre-trained model**: Using `convert.py` file to convert the original pre-trained
    `YOLO-v3` model into the HDF5 format used by `Keras`.image-2c3va4a9.jpg)

    - **hyperparameters for training**: The `config.py` file is used to store hyperparameters
    for training the `YOLO-v3` modelimage-xscejl60.jpg) ![](-8whn5rrv.jpg)

    - **training the YOLO-v3 model**: To train the `YOLO-v3` model, the converted
    `YOLO-v3` model weights (`yolov3.h5`) are loaded first, and then the model is
    fine-tuned on the `PASCAL VOC 2007` dataset. The code is written in the `train.py`
    file.

    - **packages**:image-ik5zyhxr.jpg)

    - **hyperparameter for training YOLO-v3**:image-6ci2kiue.jpg)

    - **YOLO-v3 model and load weights**:image-5zqf00t7.jpg)

    - **callback**:image-e4t53ttq.jpg)

    - **function for training**:image-w3s2721t.jpg) ![](-ysalk75u.jpg) ![](-wtk3evb1.jpg)

    - **YOLO-v3 (Step 1)**: Freeze all the layers of the model; only the weights of
    the output to be updatedimage-jhcgy6l.jpg)

    - **YOLO-v3 (Step 2)**: Train entire networkimage-hjrscygt.jpg)

    - **predictions**: After training, the trained `YOLO-v3` weights on the `Pascal
    VOC2007` training set are used for making predictions on the `VOC 2007` test set.
    The code is written in the `test.py` file.image-271f9jd9.jpg) ![](-dx4gawmi.jpg)

    - **packages**:

    - **test data and data information**:image-yh86zuci.jpg

    - **YOLO-v3 model and load weights**:image-k7262vep.jpg)

    - **of YOLO-v3**:image-j9ipiole.jpg)

    - **results**: Run the function for making prediction; Fig. 12.39 shows some results
