    # 8.2: Experiment: Implementation of inception-v3 network


    This chapter presents how to implement the Inception-v3 network for image classification.
    The objective can be accomplished by using the `TensorFlow` library introduced
    in the previous chapters; however, it takes time because of complex network architecture.
    The following section introduces two methods for building the Inception-v3 network
    faster and more effectively: `Keras Applications` and `TensorFlow Hub`. Fig. 8.15
    shows an example prediction of the Inception-v3 network.


    ![](image-2hyiwjfi.jpg)

    Fig. 8.15 The African elephant image prediction of the Inception-v3 network.


    ## 8.2.1: Keras applications


    `Keras Applications` is the applications module of the `Keras` library, providing
    network declarations and pre-trained weights for popular architectures such as
    `Xception`, `VGG`, `ResNet`, `Inception`, and so on. Table 8.1 lists the accuracy
    of some networks on the ImageNet validation set used in the 2012 ILSVRC competitions
    obtained by employing `Keras Applications`.


    - if the prediction result of the model with the highest probability is the same
    as the answer, the prediction is correct

    - if the network predicts five results with the highest probability, one of which
    is the same as the answer, it is the correct prediction

    - the number parameters of the network

    - the number of layers of the network, including convolutional layers, pooling
    layers, activation layers, and so on


    Table 8.1


    The following program uses `Keras Applications` to build the Inception-v3 network
    as an example. Fig. 8.16 is a flowchart of the source code.


    network with `eras Applications`


    ![](image-x1p0ijps.jpg)

    Fig. 8.16 Flowchart of the source code for building and testing the Inception-v3
    network with `Keras Applications`.


    ![](image-amc7z5yj.jpg)


    ### Arguments


    - `(default)`: including the fully connected layer at the top of the network

    - does not include the fully connected layer

    - `random initialization`

    - `(default)`: using pre-trained weights on ImageNet

    - `(optional)`: used for sharing inputs between multiple networks; `None` is set
    as the default

    - `(optional)`: input shape of `(299, 299, 3)`; if `input_tensor` is used, `input_shape`
    is omitted

    - `(optional)`: for feature extraction when `include_top` is set to False

    - `(default)`: the output of the last convolutional block is used as the output
    of the network

    - using the global average pooling at the output of the last convolutional block

    - using global max pooling at the output of the last convolutional block

    - `(optional)`: the number of classes; the default is `1000`. If it is necessary
    to customize the number of classes, it is required to set `include_top` to `True`
    and `weights` to `None`


    ![](image-1n0sg63j.jpg)

    ![](image-1kki8cx.jpg)


    prediction processing


    For each network model, `Keras Applications` provides the corresponding functions
    for processing data following the format the network model requires. The input
    format of each model can be different. For example, some models require input
    image with the values range from -1 to +1, others use the value range from 0 to
    1, and so on. for decoding the predictions of the pre-trained models and mapping
