    # 前言


    黄世家；Le Trung-Hieu，立台北科技大学电子工程学系，台湾台北


    1943 年，Warren McCulloch 和 Walter Pitts 引入了一种基于阈值逻辑算法的计算模型，为人工智能（AI）的发展铺平了道路。人工智能研究领域始于
    1956 年的达特茅斯人工智能夏季研究项目。在近 80 年的发展历史中，AI 经历了多次起伏，尤其是两次“AI 寒冬”，即 AI 研究资金投入减少且对人工智能研究兴趣下降的时期。


    在 Google DeepMind 开发的基于深度学习的计算机围棋程序 AlphaGo 在 2015 年击败职业围棋手后，AI 再次引起了大量的研究关注。近年来，基于深度学习算法的
    AI 取得了巨大进步，并成功应用于学术界和工业界的许多问题。认识到深度学习的潜力和力量，Google、Facebook、Microsoft、Tesla 等许多顶级科技公司已投入了大量的人力和资源，利用深度学习开发其产品。


    本书作者深理解 AI 领域的重要性及其发展。因此，《深度学习原理与实验》旨在启发并帮助更多的学生、工程师和研究人员快速进入 AI 领域，并在他们的研究项目、产品和平台上开始应用深度学习。本书包含
    12 章，内容兼顾了理论与实践。


    - “TensorFlow 2 简介”章节

    - “神经网络”章节

    - “二分类问题”章节

    - “多分类问题”章节

    - “训练神经网络”章节

    - “进阶 TensorFlow”章节

    - “进阶 TensorBoard”章节

    - “卷积神经网络架构”章节

    - “迁移学习”章节

    - “变分自编码器”章节

    - “生成对抗网络”章节

    - “目标检测”章节


    每章的前半部分介绍并分析了相应的理论，帮助读者理解深度学习的核心基础。每章的后半部分通过精心设计并分步实施的示例程序，帮助读者巩固刚学到的知识。书中选用了最流行的开源库
    `TensorFlow` 来实现示例程序。最后，每章都包含一个相应的实验（Lab）以及实现说明，以指导读者实践并完成特定的学习目标。书中的所有实验项目均可从
    GitHub 下载：


    ## 环境安装


    ### 摘要

    环境安装是开发机器学习模型的第一步。`Python` 和 `TensorFlow` 是构建这些模型广泛使用的编程语言和工具包。本章首先介绍了如何在 Windows
    和 Ubuntu 操作系统上安装 `Python`、`TensorFlow` 以及必要的扩展包。接下来，介绍了 `Jupyter Notebook` 和 `PyCharm`
    IDE 的设置，分别用于编译简单和复杂的网络模型。最后，介绍了如何从 GitHub 下载书中所有的示例程序，以及如何运行代码示例，帮助读者熟悉这些工具包的使用。


    **关键词：** `Python`；`TensorFlow`；`Jupyter Notebook`；`PyCharm`；Ubuntu 环境；Windows
    环境


    ###  大纲

    - 在 Windows 和 Ubuntu 操作系统上安装 `Python`、`TensorFlow` 和扩展包。

    - 在 Windows 和 Ubuntu 操作系统上设置 `Jupyter Notebook` 和 `PyCharm` IDE。

    - 从 GitHub 下载书中所有的示例程序，并通过 `Jupyter Notebook` 运行代码。


    ## 1: Python 安装


    ### 1.1: Windows 环境

    要安装 `Python`，首先访问 Python 官网下载 Python 安装文件。`TensorFlow` 的版本需要 `Python3.4`、`Python3.5`
    或 `Python3.6`，因此请务必安装这三个版本中的任意一个。以下将以 `Python3.6.8` 为示例。


    3.6.8 安装文件如图 1 所示。

    ```

    ![](img/image-3f2gx6me.jpg)图 1 下载 Python 安装文件。

    ```


    `Python`：使用默认设置安装 `Python`，如图 2 所示。

    ```

    ![](img/image-k4bbzfxa.jpg)图 2 安装 Python。

    ```


    ### 1.2: Ubuntu 环境

    由于 Ubuntu 操作系统内置了 `Python`，本节省略 `Python` 的安装步骤。


