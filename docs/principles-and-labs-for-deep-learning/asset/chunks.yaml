    \    6.2: Open and run source code    Suppose that the project directory path\
    \ is C:\\\\Users\\\\mmslab\\\\Deep-Learning-Book-master. To open the project,\
    \ go to the folder “Deep-Learning-Book-master”    Windows environment: Open the\
    \ command prompt and run the following:    ![](image-bz6p7lty.jpg)  Ubuntu environment:\
    \ Open terminal and run the following:    ![](image-lazowmta.jpg)  Jupyter Notebook:\
    \ Run the following, the result is shown in Fig.    ![](image-28sstodw.jpg)Fig.\
    \ 30 Open the project through Jupyter Notebook.     ![](image-b10q3ptx.jpg)  open\
    \ the program of a specific Lab, click the corresponding file in the project.\
    \ For example, to open the code of Lab1, please click the “Lab1.ipynb” file, as\
    \ shown in Fig.    ![](image-25l4rw6p.jpg)Fig. 31 The source code of Lab1.    \
    \ run the program, click the “fast forward icon,” as shown in Fig.    ![](image-atvqi5ah.jpg)Fig.\
    \ 32 Running the code on Jupyter Notebook.  \n\n  Chapter 1: Introduction to TensorFlow\
    \ 2    \n\n  Abstract    Numerous open-source tools have been introduced to develop\
    \ and train machine learning models. Compared to other toolkits, TensorFlow attracts\
    \ the greatest number of users on GitHub. TensorFlow 2 is an improved version\
    \ of TensorFlow 1 that focuses on simple execution, easy model building, and robust\
    \ model deployment. This chapter introduces in detail three main updated functions\
    \ of TensorFlow 2: (1) eager execution, providing a programming environment where\
    \ operations can be evaluated immediately without constructing graphs; (2) Keras,\
    \ a high-level application programming interface (API) for quickly and easily\
    \ designing and training network models; and (3) tf.data, an API that allows users\
    \ to construct complex input pipelines in a simple way.     Keywords    TensorFlow\
    \ 2; Eager execution; Keras; Sequential model; Functional model     Outline   \
    \   to know deep learning    of TensorFlow 2    started with TensorFlow 2    neural\
    \ networks using tf.keras    of tf.data for building input pipelines  \n\n  1.1:\
    \ Deep learning    1.1.1: Introduction to deep learning    Artificial Intelligence\
    \ (AI) refers to giving machines the ability to learn and mimic human actions.\
    \ It is mainly used to assist humans, especially by replacing high-repetition,\
    \ low-skill jobs. AI is a comprehensive field that includes evolutionary computation,\
    \ expert systems, symbolic AI, support vector machines (SVMs), machine learning,\
    \ deep learning, reinforcement learning, and many other fields.  Machine learning\
    \ is a branch of AI that involves three main fields: reinforcement learning, deep\
    \ learning, and SVMs, as shown in Fig. Among them, deep learning is the most popular\
    \ because it has been widely and successfully applied to various application areas\
    \ such as computer vision, speech recognition, natural language processing, and\
    \ so on Deep learning is based on artificial neural networks, also known as deep\
    \ neural networks that have neural layers, namely, input layers, hidden layers,\
    \ and output layers, and connections of neurons between these layers for representation\
    \ learning. The “deep” in deep learning refers to the use of multiple layers through\
    \ which the data can be transformed in the neural network.    ![](image-pugmfyzi.jpg)Fig.\
    \ 1.1 Deep learning is currently the most popular technique of machine learning.\
    \    In deep learning, the deep neural network is a complex function. When inputting\
    \ a set of training data to the neural network, a set of output predictions can\
    \ be obtained, and then the weights of the network will be updated to make the\
    \ output predictions closer to the expected outputs, that is, the answers are\
    \ marked.    1.1.2: Deep learning toolkits    Numerous open-source tools have\
    \ been introduced to develop and train machine learning and deep learning models.\
    \ The ten most popular deep learning toolkits are as follows:    An end-to-end,\
    \ open-source platform written in Python, C ++ that provides a comprehensive flexible\
    \ ecosystem of tools and libraries to help developers easily build and deploy\
    \ machine learning- and deep learning-powered applications. More detail about\
    \ TensorFlow is provided at the official website: GitHub:  A high-level application\
    \ programming interface (API) written in Python with the purpose of enabling fast\
    \ experimentation. Keras can be run on top of other toolkits such as TensorFlow,\
    \ Theano, and CNTK. More detail about Keras is provided at the official website:\
    \ GitHub:  A deep learning framework written in C ++ developed by Berkeley Artificial\
    \ Intelligence Research. Caffe is a flexible toolkit; models and optimization\
    \ can be expressed by configuration without hard coding. More detail about Caffe\
    \ is provided at the official website: GitHub:  An efficient library for deep\
    \ learning that quickly trains network models and supports multiple programming\
    \ languages, including Python, Scala, Clojure, Java, Julia, Perl, C ++, and R.\
    \ More detail about MXNet is provided at the official website: GitHub:  A Python\
    \ library for efficiently optimizing and evaluating mathematical expressions regarding\
    \ multi-dimensional arrays. Symbolic differentiation can be efficiently performed\
    \ through Theano with the use of graphics processing units (GPUs). More detail\
    \ about Theano is provided at the official website: GitHub:  Microsoft Cognitive\
