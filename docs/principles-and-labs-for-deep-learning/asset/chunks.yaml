    # Chapter 5: Training neural network


    ## Abstract

    Training a neural network is a process of finding a suitable set of weights that
    results in high performance on training and validation data. This chapter provides
    some of the most significant techniques that used in training network models,
    including backpropagation, weight initialization, and batch normalization. Then,
    we examine the effectiveness of each weight initialization technique and verify
    batch normalization by applying it to train the neural network model on the CIFAR-10
    dataset. Finally, we summarize, compare, and visualize the performance of all
    the trained neural networks in Chapter 4 and this chapter on TensorBoard to see
    the impact of each technique in the convergence of the model during the training
    process.


    ### Keywords

    Backpropagation; Weight initialization; Glorot initialization; He initialization;
    Batch normalization


    ### Outline

    - the backpropagation algorithm for training neural networks

    - the importance of weight initialization

    - TensorBoard to observe the weights distribution of the neural network

    - the importance of batch normalization

    - the effectiveness of different techniques for training neural networks


    ## 5.1: Backpropagation


    ### 5.1.1 Introduction to backpropagation

    Backpropagation (BP) [1] is a method to update the weights of neural networks
    in combination with gradient descent, which we presented in Chapter. Gradient
    descent is one of the most common algorithms to perform optimization for neural
    networks. By calculating the gradient and moving in the reverse direction, the
    error between the predicted result of the network and the expected output is reduced
    during training process. The weights update formula is:


    ![](image-cpxz2hdj.jpg)


    where `L` is loss function, `η` is learning rate, and `W` is weights of the neural
    network. Through the preceding formula, the `BP` method is applied to compute
    the gradient of the loss function in respect to the weights of the neural network
    for each input and output example. The following is an example to explain how
    the gradient is calculated.


    Fig. 5.1 shows the schematic diagram of a single-layer neural network with the
    forward propagation calculation. The computation process is:


    ![](image-jo1mgf5d.jpg) ![](image-nwimaqqw.jpg) ![](image-4d6sp5uk.jpg) where
    `x` and `b` are input data; and `w` are weights of the network; `f` is an activation
    function; `ŷ` is predicted value of the network, and `y` is an expected output.


    ![](image-q5329bcl.jpg) Fig. 5.1 Forward propagation calculation diagram of a
    single-layer neural network.


    `BP` is applied to compute the gradients `∂L/∂∂W`, and for updating the weights
    of the network, as shown in Fig. The computation process is:


    ![](image-265bu1et.jpg) ![](image-yzmxqdtg.jpg) ![](image-y2yf57xv.jpg) ![](image-i380z9pp.jpg)
    Fig. 5.2 Backpropagation (BP) computation diagram of a single-layer neural network.


    ### 5.1.2 Vanishing gradient problem

    The vanishing gradient refers to the problem encountered when training neural
    networks, especially deep neural networks (DNNs) with gradient methods and `BP`.
    Table 5.1 lists three common activation functions: sigmoid, tanh, and rectified
    linear unit (`ReLU`). The use of `sigmoid` and `tanh` activation functions in
    hidden layers of the neural network may cause the problem of vanishing gradient.
    For example, when performing `BP` through a layer of `sigmoid` activation function,
    it needs to be multiplied with gradient of `sigmoid` function. The maximum value
    of the `sigmoid` derivative function is 0.25, which means that the gradient will
    be attenuated 0.25 times after one pass. If the neural network has five layers,
    the gradient will be reduced by at least 0.25^5 which makes it difficult to update
    the weights of the previous layers of the neural network. Similarly, `tanh` activation
    function has the same situation. Recently, the `ReLU` activation function is usually
    employed in hidden layers because it outputs the input directly if the input is
    positive, otherwise, it outputs zero, overcoming the vanishing gradient problem
    and allowing the neural networks to learn faster and more effectively.


    Table 5.1


    Here we explain vanishing gradient when using `sigmoid` activation function in
    neural networks. Given a two-layer neural network, in which each layer uses the
    `sigmoid` activation function to compute an output value, input weights `w` and
    `b` and expected output `y` Fig 5.3 shows a schematic diagram of the network with
    forward propagation computation. The computation process is:


    ![](image-2mzto0i7.jpg) ![](image-gw8av86g.jpg) ![](image-szngovj4.jpg) ![](image-bel9vnco.jpg)
    ![](image-wmo5sslq.jpg) here


    ![](image-zwtxgtzr.jpg) ![](image-yijxy26b.jpg) Fig. 5.3 Forward propagation computation
    diagram of a two-layer neural network.


    As shown in Fig `∂L/∂w` is calculated by the `BP` method, the computation process
    is:


    ![](image-7r45azuw.jpg) ![](image-amo05uxo.jpg) ![](image-tfenb475.jpg) ![](image-as86root.jpg)
    Fig. 5.4 Backpropagation (BP) computation diagram of a two-layer neural network.


    From the computation of the `BP` above, it can be found that after each `sigmoid`
    activation function, the computed value will be reduced at least 0.25 times, so
    the more layers of transfer, the more gradient attenuation there will be. This
    is the reason for vanishing gradient during training `DNNs`.


    The computation result of `ŷ` is verified by using the `TensorFlow` program, as
    shown here.


    ![](image-cpxukezq.jpg)

