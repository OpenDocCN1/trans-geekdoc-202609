    followed by `sigmoid` activation function, while that of the box regression subnet
    utilizes `4 * A` filters. `A` and `K` represent the number of anchors and object
    classes, respectively. Noteworthy,focal loss` is proposed for training object
    classification in `RetinaNet` to solve the class imbalance problem and increase
    the accuracy of object detection.


