    1. 代码：

    ```

    ![](img/image-7ifodw3p.jpg)

    ```

    2. 代码：

    ```

    ![](img/image-tqmyn518.jpg)

    ```


    ### 1.4.2: TensorFlow TensorFlow 操作

    本节展示了一个简单的程序，首先检查激进执行以确保其已激活。然后，介绍并执行了一些基础操作，如加法、减法、乘法等，帮助读者理解一个完整的 TensorFlow
    程序。

    ![](img/image-fe6a8la3.jpg) ![](img/image-v95nwanv.jpg) ![](img/image-z5lvwnu0.jpg)
    ![](img/image-r1fatyc7.jpg) ![](img/image-6j8lvuap.jpg) ![](img/image-cxaxwmvo.jpg)


