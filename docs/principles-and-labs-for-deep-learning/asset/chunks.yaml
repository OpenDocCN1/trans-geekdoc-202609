    第 11 章：生成对抗网络


    摘要

    生成对抗网络（GAN）在许多计算机视觉任务如图像生成、文本生成、文本到图像生成、图像转换等方面显示了卓越的结果。本章讨论了 GAN 的结构和原理。接下来，介绍并解释了
    Wasserstein 距离以及带梯度惩罚的 Wasserstein 生成对抗网络（WGAN-GP），它是 GAN 的改进版本。最后，本章介绍了一个在大型人脸属性数据集（CelebA）上构建、训练和测试
