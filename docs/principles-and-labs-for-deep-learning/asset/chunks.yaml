    # 11.2: WGAN-GP 简介


    在本节中，我们将分析原始 GAN [1] 和 Wasserstein 斯坦生成对抗网络 (WGAN) 的缺点。然后，我们将介绍 WGAN 的一个改进版本——带有梯度惩罚的
    Wasserstein 斯坦生成对抗网络 (WGAN-GP)，它应用了梯度惩罚技术来实现 GAN 的稳定训练。


    ## 11.2.1: 生成对抗网络的缺点


    原始 GAN 最大的缺点是训练存在不稳定性，这是由于以下原因导致的：


    - 判别器训练得太完美，这意味着判别器可以很容易区分出真实数据分布和生成数据分布。如图所示，判别器预测的，在通过 `sigmoid` 激活函数后，其输出值接近
    0。判别器预测并在发送到 `sigmoid` 激活函数后，其输出值接近 1。然而，如第 5 章表 5.1 所示，当 `sigmoid` 的输出值接近 0 或
    1 时，其导数趋于 0。由于梯度消失问题，生成器在训练过程中很难更新权重。


    ![](img/image-w0ya5dg1.jpg) 图 11.8 判别器训练的情况。


    - 判别器训练不充分，意味着它无法正确判断真实和生成之间的区别。这可能导致真实和生成的被预测为相似。如图所示，真实和生成的重叠了，这意味着判别器无法区分真实和生成。判别器的错误判断还会导致生成器在错误方向上更新。


    为了避免图 11.8A 所示的问题并获得如图所示的训练良好的模型，在训练期间需要仔细监控判别器损失（discriminator loss），这样生成器才有机会产生更接近真实数据的结果。


    GAN [1] 的损失函数为：


    ![](img/image-jmqe4iyi.jpg) (11.1)


    对于固定的生成器，可以通过以下方式获得最优判别器：

    (11.2)


    因此，公式 (11.1) 可以重写为：

    (11.3)


    ![](img/image-sxkv4uvy.jpg) ![](img/image-b9jr804v.jpg) ![](img/image-kn178cee.jpg)

    真实数据分布。

    生成数据分布。

    判别器。

    优化后的判别器。


    Kullback–Leibler 散度（KL 散度），也称为相对熵，用于衡量同一概率空间上两个概率分布 `ℙ` 和 `ℚ` 之间的差异，定义为：

    (11.4)


    Jensen–Shannon 散度（JS 散度）基于 Kullback–Leibler 散度来衡量两个概率 `ℙ` 和 `ℚ` 之间的相似性，定义为：

    ![](img/image-9puwzyi4.jpg) (11.5)


    公式中使用 JS 散度，因此当使用最优判别器最小化 GAN 损失函数时，它被称为最小化 JS 散度。如果 `ℙ = ℚ`，则意味着训练模型达到了值为 `-2log2`
    的全局最小值，且生成器完美地复制了数据分布。


    ## 11.2.2: Wasserstein 距离简介


    如所述，训练 GAN 是困难且不稳定的。为了解决这个问题，Wasserstein GAN (WGAN) [5] 提出了一种使用 Wasserstein 距离的新型损失函数，该距离在处处都具有平滑的梯度。Wasserstein
    距离是指将一个数据分布移动到另一个数据分布时搬运质量的最小成本。对于真实数据分布和生成器生成的数据分布，Wasserstein 距离为：

    ![](img/image-2jur9xmi.jpg) (11.6)


    所有可能的传输计划集合，其中联合分布的边缘分布分别为 `ℙ` 和 `ℚ`

    `x` 与 `y` 之间的距离

    : 传输计划 `γ` 的预期搬运成本

    `inf`: 任何传输计划 `γ` 的下确界或最大下界


    根据 Kantorovich–Rubinstein 对偶性，公式 (11.6) 的 Wasserstein 距离可以转换为以下形式：

    ![](img/image-c8rp.jpg) (11.7)


    真实数据分布

    生成数据分布

    判别器

    Lipschitz 约束：对于判别器


    ### 补充说明


    与 GAN 不同，WGAN [5] 不采用 `sigmoid` 激活函数，它输出一个标量分数。如果 `ℙ = ℚ`，则判别器的输出接近 `+∞`；如果 `ℙ
    ≠ ℚ`，则输出接近 `-∞`，如图所示。

    ![](img/image-22ki.jpg) (11.8)


    为了强制判别器的 Lipschitz 约束，WGAN 使用简单的权重裁剪（weight-clipping）方法将权重限制在某个范围内。特别是，如果权重大于
    `c`，则将其设置为 `c`；如果小于 `c`，则保持不变。


    然而，使用权重裁剪方法会遇到问题：工作 [6] 显示，模型对裁剪阈值 `c` 非常敏感。如果 `c` 稍微增大，通过网络层的梯度增大，会导致梯度爆炸。相反，如果
    `c` 稍微减小，通过网络层的梯度变小，会导致梯度消失。


    为了解决 WGAN 的问题，提出了 WGAN-GP [6]，它使用梯度惩罚方法代替权重裁剪来强制判别器的 Lipschitz 约束。在 WGAN-GP 中，通过直接约束判别器输出相对于输入的梯度范数来应用梯度惩罚技术。WGAN-GP
    的目标函数为：

    ![](img/image-th8tp.jpg) (11.9)


    真实数据分布

    生成数据分布

    从这些采样的点之间沿点对的直线进行均匀采样

    判别器

    惩罚系数；该参数在原始工作 [6] 中被设置为 10


    ## 11.2.3: WGAN-GP 训练


    WGAN-GP 的训练过程与原始 GAN 相同，但生成器和判别器的损失函数都经过了改进以提升性能。训练生成器的目的是最小化生成器损失。生成器损失越小，生成器产生接近真实样本的能力越强。例如，将一组随机向量
    `z` 输入生成器，产生一张图像 `()`。然后，将此生成的图像发送到判别器进行预测。判别器的输出越大，生成器损失越小。在训练生成器期间，判别器的权重需要固定。生成器的目标函数为：

    ![](img/image-wxl6rp.jpg) (11.10)


    判别器

