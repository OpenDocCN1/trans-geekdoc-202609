    ## 1.2: Introduction to TensorFlow


    TensorFlow [3] is an end-to-end, open-source platform developed by the Google
    Brain team that uses data flow graphs to construct machine learning and deep learning
    models.


    ### refers to data representation

    `Tensor` is an array of multi-dimensions with a uniform type called a. All computations
    in TensorFlow are based on tensors. Some examples of creating basic tensors are
    listed here.

    ![](image-kth2jt76.jpg) ![](image-q0tbg2va.jpg) ![](image-702ur9gi.jpg)


    ### refers to a computational graph

    TensorFlow works by using a data flow graph to represent computations. In the
    computational graph, each node represents an operation such as addition, subtraction,
    multiplication, division, and so on, and the edges represent the correlation between
    nodes. After each operation is performed, a new tensor will be formed for the
    next computation.


    For example, using TensorFlow to present the mathematical formula The source code
    is as below:

    ```

    ![](image-e6e9h05u.jpg)

    ```

    The computation graph for the above program is shown in Fig. Note that TensorFlow
    uses TensorBoard to draw the graph; we introduce this function in Chapter In Fig.
    starting from the left, constants `a` and `b` are connected to the addition (`Add`)
    and subtraction (`Sub`) operation nodes to perform computations, then the resulting
    tensors from the `Add` node and `Sub` node are connected to the division (`Div`)
    operation node for computing the final result.

    ![](image-08blxmmx.jpg)

    Fig. 1.2 Computational graph of `Y = (a + b)/(a - b)`.


    In TensorFlow 1, a computational graph is first generated, and then a session
    is created to execute the graph. This technique is called a static computation
    graph. To help the user easily get started with TensorFlow and debug programs,
    Eager execution, an imperative programming environment has been introduced in
    TensorFlow 2 to perform operations immediately without constructing graphs; it
    also lessens boilerplate. In addition to Eager execution, there are many changes
    in TensorFlow 2, which we introduce in the next section.


    ## 1.3: Improvement of TensorFlow 2


    TensorFlow 2 is an improved version of TensorFlow 1 with a focus on simple execution,
    easy model building, and robust model deployment. There are six main updated functions
    in TensorFlow 2: Eager Execution, Keras, `tf.data`, TensorFlow Hub, Distribution
    Strategy, and SavedModel. The first three functions are discussed in the next
    section. Later chapters discuss the other functions.


    - **Execution**: A flexible platform for research and experimentation on machine
    learning and deep learning, providing an imperative programming environment where
    operations can be evaluated immediately without constructing graphs.

    - **Keras**: was built on top of TensorFlow 2 as a high-level API for quickly
    and easily designing and training network models. Built-in Keras in TensorFlow
    2 can be used through the `tf.keras` function.

    - **tf.data**: An API that allows users to construct complex input pipelines in
    simple ways. This API can handle larger amounts of data and read data with different
    formats.

    - **Hub**: A place where the trained machine learning and deep learning models
    are stored for reusing with a specific purpose such as fine-tuning a network model
    to address a new task with less training data and training time.

    - **Strategy**: `tf.distribute.Strategy`, a TensorFlow API used to distribute
    the existing models for training across multiple devices, such as GPUs or TPUs.

    - **SavedModel**: TensorFlow 2 has standardized a unifying format for storing
    complete network models with weights. Using a SavedModel, the trained models can
    be deployed to many platforms or devices, such as smartphones, Raspberry Pi, or
    even webpages.


    Fig. 1.3 shows the simplified conceptual diagram of TensorFlow 2. As shown, the
    diagram consists of two stages: (1) training stage and (2) deployment stage. The
    training stage starts from reading and processing data with `tf.data` API for
    input pipelines, loading pre-trained model weights from TensorFlow Hub for fine-tuning,
    building neural networks with `tf.keras` API, training models with distribution
    strategy, and saving model weights with `SavedModel`. In the deployment stage,
    the trained model can be deployed in different devices or platforms through different
    libraries.


    - **Lite**: A library for converting the trained machine learning model into a
    compressed flat buffer and deploying it in mobile and Internet of Things (IoT)
    devices.

    - **FlowJS**: A library for deploying the trained machine learning model in JavaScript
    environments such as the browser or Node.js.

    - **Serving**: A flexible serving system for machine learning and deep learning
    models, allowing for deployment of new algorithms while the server architecture
    remains unchanged. 2 also supports other programming languages such as Java, C,
    Go, and so on.


    ![](image-edq5agaj.jpg)

    Fig. 1.3 The simplified conceptual diagram for TensorFlow 2.


    ## 1.4: Eager execution


    ### 1.4.1: Introduction to eager execution

    Immediate evaluation of operations through the Eager Execution platform is one
    of the most important updated features in TensorFlow 2. Unlike TensorFlow 1, which
    evaluates computations by first building a computational graph and then setting
    a session to execute the generated graph, Eager Execution in TensorFlow 2 provides
    a programming environment where the operations can be evaluated instantly without
    building graphs. This allows users to more easily debug with immediate error reporting
    as well as simplify the specification of dynamic models.


    Important features of Eager Execution are as follows:

    - evaluation of operations.

    - debugging program.

    - need to construct the computational graph.

    - calculation result can be returned without `tf.Session.run`.


    Comparisons between TensorFlow 1 and TensorFlow 2:

    1. code:

    ```

    ![](image-7ifodw3p.jpg)

    ```

    2. code:

    ```

    ![](image-tqmyn518.jpg)

    ```


    ### 1.4.2: Basic TensorFlow operations

    This section presents a simple program, where the Eager Execution is first checked
    to ensure that it is activated. Then, we introduce and execute some basic operations
    such as addition, subtraction, multiplication, and so on to help readers understand
    a complete TensorFlow program.

    ![](image-fe6a8la3.jpg) ![](image-v95nwanv.jpg) ![](image-z5lvwnu0.jpg) ![](image-r1fatyc7.jpg)
    ![](image-6j8lvuap.jpg) ![](image-cxaxwmvo.jpg)


    Supplementary explanation

    The data format of TensorFlow can be different from that of other libraries, such
    as OpenCV or Matplotlib. When data type errors occur, the fastest solution is
    to convert data to the Numpy format since this format can be applied to most Python
    packages.

