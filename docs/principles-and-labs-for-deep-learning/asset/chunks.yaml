    a new loss function that uses Wasserstein distance, which has a smoother gradient
    everywhere. The Wasserstein distance refers to the minimum cost of transporting
    mass when moving one data distribution to another data distribution. For the real
    data distribution and generated data distribution by the generator, Wasserstein
    distance is:    ![](image-2jur9xmi.jpg)   (11.6)    a set of all possible transport
