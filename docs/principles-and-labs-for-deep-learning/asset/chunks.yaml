    # 12.3: 目标检测方法


    过去的几十年里已经出现了许多目标检测方法。在本节中，我们将介绍一些基于深度 CNN 的方法。图 12.3 显示了目标检测方法的历史演进。


    ![](img/image-2n1dcn0e.jpg)

    图 12.3 基于 CNN 的目标检测方法的历史演进。


    ## 12.3.1: R-CNN


    Girshick 等人 [20] 在 2014 年提出了具有 CNN 特征的区域（`R-CNN`），它被称为第一个基于 CNN 的检测模型。这种基于区域提议（region
    proposal）的方法 `R-CNN` 通过两个阶段完成目标检测，如图所示。在第一阶段，采用选择性区域搜索（selective search）方法 [21]
    从输入图像中生成约 2000 个可能包含对象的区域提议。在第二阶段，将这些区域提议变形（warped）为固定大小，然后分别通过 `CNN` 进行特征提取。最后，将每个区域提取的特征发送到全连接层，以对物体进行分类并精炼边界框。`R-CNN`
    采用类别特定的线性支持向量机（`SVM`）进行物体分类。如果模型需要预测 `n` 个类，则使用 `n` 个 `SVM` 分类器。


    ![](img/image-lx5otgmm.jpg)

    图 12.4 `R-CNN` 的示意图。


    尽管 `R-CNN` 在性能上优于以前的方法 [42]，但由于该方法需要对每张图像的大量区域提议进行单独分类，在训练和推理过程中仍然消耗大量时间。


    ## 12.3.2: Fast R-CNN


    Girshick 等人 [22] 在 2015 年提出了具有 CNN 特征的快速区域（`Fast R-CNN`），它是 `R-CNN` 的改进版本，如图所示。


    ![](img/image-zyqq0tzy.jpg)

    图 12.5 `Fast R-CNN` 的架构。


    基于 `R-CNN`，`Fast R-CNN` 结合了三个主要改进以提高目标检测性能：

    - 使用 `CNN` 从整个图像提取特征，而不是从头开始提取每个图像块，这有助于显著缩短处理时间。

    - 采用选择性搜索方法从输入图像中生成 `RoIs`（感兴趣区域），将它们与相应的特征图结合，并发送到 `ROI pooling` 层生成固定长度的特征向量，如图所示。这些生成的特征向量被输入到全连接层用于物体分类和定位。


    ![](img/image-dfngzbbj.jpg)

    图 12.6 `Fast R-CNN` 中的 `RoI pooling`。

    - 采用带有 `softmax` 函数的 `SVM` 进行分类。


    在 `Fast R-CNN` 中，应用 `ROI pooling` 将不同尺寸的 `ROIs` 变形为固定大小。例如，将一个 8 × 8 的特征图转换为大小为
    2 × 2 的固定长度特征，如图所示。


    ![](img/image-36i9hn9q.jpg)

    图 12.7 `RoI Pooling`：(A) 一个 8 × 8 的特征图，(B) 将 `RoI`（红色）与特征图结合，(C) 将 `RoI` 分分为 2
    × 2 的目标区域，其中四个区域的大小相等也可以不同，(D) 对每个区域取 `max`，得到一个大小为 2 × 2 的固定长度特征图。


    ## 12.3.3: Faster R-CNN


    Ren 等人 [23] 在 2015 年提出了具有 CNN 特征的快速区域（`Faster R-CNN`），它是 `Fast R-CNN` 的改进版本。`Faster
    R-CNN` 采用了与 `Fast-CNN` 相似的设计，但将选择性搜索方法替换为区域提议网络（`RPN`），用于在特征图上生成区域提议，如图所示。


    ![](img/image-npiwm60.jpg)

    图 12.8 区域提议网络 (`RPN`)。


    `Faster R-CNN` 在速度和精度上均优于 `R-CNN` 和 `Fast-CNN`。该方法相对于之前的版本有两个主要变化：

    - 提议网络 (`RPN`）：`Faster R-CNN` 使用 `CNN` 代替了 `R-CNN` 和 `Fast-CNN` 使用的选择性搜索方法。如图所示，在每个滑动位置，`RPN`
    同时预测多个区域提议，并输出 `4k` 个坐标和 `2k` 个估计是否目标的得分，其中 `k` 是 anchor 的数量。


    ![](img/image-s7609wj.jpg)

    图 12.9 区域提议网络 (`RPN`)。


    `Anchor` 是一个参考框，与尺度和宽高比有关`Faster R-CNN` 在每个位置使用了 9 个 anchor 框（3 种尺度和 3 种宽高比）。这些
    anchor 被预先选择以覆盖各种尺寸的物体。


    补充说明：

    `RPN` 不直接输出边界框（`x, y, w, h`）；它采用以下四个坐标参数化：


    ![](img/image-6c7nwh2l.jpg)(image-7nroz3h.jpg)

    其中 `x` 和 `y` 代表预测中心的坐标，`w` 和 `h` 分别代表其宽度和高度。`Anchors` 框代表真值框（ground-truth）。


    ## 12.3.4: YOLO-v1


    Redmon 等人 [24] 在 2016 年提出了一眼检测（`YOLO`）。它是首个基于回归/分类的目标检测方法，如图所示。与基于区域提议的方法不同，`YOLO`
    通过单个 `CNN` 直接从整个图像推断物体分类和定位。这种策略有助于 `YOLO` 达到每秒 45 帧的运行速度，使其成为实时检测器。


    ![](img/image-5cj9jhy.jpg)

    图 12.10 `YOLO` 的架构。


    为了，`YOLO` 模型将输入图像划分为 S × S 网格。如果一个网格包含物体的中心，则负责检测该物体。每个网格有 `B` 个边界框，并预测这些框的得分。每个预测的边界框包含五个预测值（`x,
    y, w, h`）和一个得分，其中 `x` 和 `y` 代表相对于网格边界的中心坐标，`w` 和 `h` 代表相对于整个图像的宽度和高度，得分反映是否存在物体。边界框得分越高，网格预测包含物体的概率越大。类别概率基于预测类别的数量。如果有
    20 个类，则输出 20 个类别概率。


    ![](img/image-uyu5np3m.jpg)

    图 12.11 `YOLO` 的预测过程。


    `YOLO` 模型的输出尺寸计算如下：

    `Output size = S × S × (B × 5 + C)`

    - `S`: 网格的宽度和高度。

    - `B`: 每个网格预测的边界框数量。

    - `5`: 网格中每个预测边界框包含五个预测值：`y, w` 和框得分。

    - `C`: 类别概率的数量；如果有 20 个类别，则输出 20 个类别概率。


    例如，`YOLO` 在 PASCAL VOC 数据集上的 `S = 7`, `B = 2`  `C = 20`。`YOLO` 模型的输出尺寸为 `7 × 7
    × (2 × 5 + 20) = 7 × 7 × 30` 张量。


    补充说明：

    `YOLO` 在每个网格上预测两个边界框，因此总共预测了 `7 × 7 × 2 = 98` 个物体框。然而，这 98 个边界框并不是最终预测。为了给最终答案保留最佳边界框，`YOLO`
    使用非极大值抑制（`NMS`）方法移除冗余边界框，如图所示。


    ![](img/image-583pkf4y.jpg)

    图 12.12 使用非极大值抑制 (`NMS`) 选择最佳边界框。


    `NMS` 方法如下：

    - 得分太小，意味着预测边界框内没有物体，因此首先移除得分小于阈值的边界框。

    - 将剩余的边界框按照得分从大到小排序，并放入“物体框列表”，标记为 `L`。

    - 从 `L` 中取出得分最高的边界框，并放入“过滤后的物体框列表”，标记为 `F`。

    - 分别计算 `F` 中边界框与 `L` 中所有边界框的交并比（`IoU`）。如果计算出的 `IoU` 值大于 `IoU` 阈值，则从 `L` 中移除该边界框，直到
    `L` 为空。


    ## 12.3.5: SSD


    Wei Liu 等人 [25] 在 2016 年提出了单次预测检测器（`SSD`）。它是一种基于 CNN 的实时检测模型，通过将所提出的跨分辨率融合（`CFF`）方法应用于基础检测器
    `SSD` 来提高目标检测性能，尤其是对小目标的检测。`SSD` 有两个版本：用于快速检测的 `1CFF-SSD` 和用于更准确检测的 `2CFF-SSD`，如图所示。


    ![](img/image-so34oi5w.jpg)

    图 12.22 `SSD` 的架构。


    空洞空间金字塔池化（`N-ASPP`）模块

    它使用浅层特征图作为输入，通过四个不同速率的并行空洞卷积提取多尺度上下文信息。


    ![](img/image-x2i5qwn.jpg)

    图 12.23 跨分辨率融合 (`CFF`)


    在 `1CFF-SSD` 架构中，采用一种 `CFF`，即使用不同速率的空洞卷积来增强语义信息。在 `2CFF-SSD` 中，为了产生检测，`SSD` 使用来自六层不同卷积的特征图。在
    `SSD` 模型中，特征图中的每个网格预测多个边界框，深层负责检测大物体，而浅层负责检测小物体。由六层卷积预测的边界框数量计算如下：

    `Total box: 5776 + 216 + 150 + 36 + 4 = 8732`

    每个预测框包含 `N` 个类别得分和四个偏移。默认框被预先选择以覆盖各种尺寸的物体。`SSD` 使用不同层具有不同的默认框，每个框位于相应的网格。


    ## 12.3.6: YOLO-v2


    Redmon 等人 [26] 在 2017 年提出了 `YOLOv2`，也称为 `YOLO9000`，它是 `YOLO` 的改进版本，比 `YOLO` 和
    `SSD` 都更快更强。`YOLOv2` 包含了以下重要变化：

    - 归一化：在卷积层中加入批归一化（`Batch normalization`），这有助于在训练过程中避免过拟合问题并提高约 2% 的平均精度`mAPAP）。

    - 分类器：在 `YOLOv2` 中，分类器首先使用 224 x 224 的输入分辨率训练，然后返回 480 x 480 的分辨率，利用更少的 epoch。这有助于提高模型
    4% 的精度`mAP`。

    - anchor 框：`YOLO-v2` 使用 anchor 框的预测取代了 `YOLO` 中的任意边界框。虽然使用 anchor 框使精度略有下降，但增加了检测所有真值目标的概率。

    - 聚类：为了找到最适合数据集的 top-K 边界框，采用了 `K`-means 聚类方法来定位 top-K 聚类的中心。对于最佳设计，为训练 `YOLO-v2`
    模型选择了 5 个 anchor。

    - 位置预测：由于 `YOLO` 对位置预测没有加约束，导致训练不稳定。使用 `sigmoid` 函数将模型的输出预测限制在 0 到 1 之间，使得 `YOLO-v2`
    在训练过程中更稳定。在输出特征图中，`YOLO-v2` 在每个网格预测五个边界框；每个边界框有五个坐标，相应的预测定义为：

    `Pr(object) * IOU(predicted box, ground truth box) = 预测框的中心、宽度和高度；图像的左上角；sigmoid
    激活函数；anchor 框的宽度和高度；预测框的得分`


    ![](img/image-4p68ml3j.jpg)

    图 12.14 使用 `YOLO-v2` 的细粒度特征。


    补充说明：

    - 重组层：与减少输入信息的 `max pooling` 层不同，图 14 中的 `reorganization layer` 在操作后保留了输入的原始原始信息，如图所示。


    ![](img/image-abbpa0c.jpg)

    图 12.15 重组层操作。

    - 训练：在 `YOLO-v2` 模型训练期间，输入图像的大小每 10 个 batch 改变一次。通过取 32 的倍数（如 320, 352, 384, 416,
    448, 480, 512, 544 和 576），`YOLO-v2` 使用 320 x 320 的最小输入大小和 608 x 608 的最大大小。这种策略有助于
    `YOLO-v2` 在以实时速度运行的同时克服多尺度目标检测的问题。


    ## 12.3.7: 特征金字塔网络


    Lin 等人 [27] 在 2017 年引入了特征金字塔网络（`FPN`）。`FPN` 采用带有横向连接的金字塔架构来在不同尺度上检测物体。使用 `CNN`
    进行特征提取时，深层具有低分辨率和语义特征，而浅层包含高分辨率和弱语义信息。为了创建一个包含所有层丰富语义特征的金字塔，在 `FPN` 中通过自上而下的路径构建高分辨率层。由于重构层具有强语义特征但缺乏位置信息，这些层与相应的特征图之间添加了横向连接以更好地预测物体，如图所示。


    ![](img/image-m0xb5tcb.jpg)

    图 12.16 特征金字塔网络 (`FPN`) 的架构。


    图中总结了四种常用的目标检测架构的特征：

    - 17A 显示了 `FPN` 的架构。在这种网络架构中，特征在每个尺度上独立计算。虽然这种方法是有效的，但运行时间非常慢。`YOLO` [24] 是这种架构的代表。

    - 17B 显示了单尺度特征的网络架构。这种方法使用单一尺度的特征进行预测。它可以实现实时预测速度，但由于使用缺乏语义信息的浅层来预测小物体，精度不理想。

    - 17C 显示了架构。`SSD` 使用不同尺度的特征图来做出预测。这种方法的优点是不需要额外的计算。

    - 17D 显示了 `FPN` 架构。类似于图中的层次，`FPN` [27] 也从较低层级预测小物体，并从更高层级预测大物体。在 `FPN` 中，高层语义信息在所有尺度上扩散，因此比图中网络更有效。


    ![](img/image-js7oh5hk.jpg)

    图 12.17 用于目标检测常用的架构。


    ## 12.3.8: RetinaNet


    Lin 等人 [28] 在 2017 年提出了用于密集目标检测的 Focal Loss（`RetinaNet`）。为了提高目标检测性能，`RetinaNet`
    采用 `ResNet` [35] 作为主干网络，采用 `FPN` 架构 [27] 构建多尺度特征金字塔，并在每个金字塔层级添加两个子网络，即分类子网络和回归子网络，分别用于物体分类和定位，如图所示。分类子网络和回归子网络具有相同的架构，包括四个
    3x3 卷积层带有 `ReLU` 激活，每个层有 256 个滤波器，随后是用于预测的 3x3 卷积层。两个子网络的区别在于分类子网络的最后一层使用 `A *
    K` 个滤波器后接 `sigmoid` 激活函数，而回归子网络利用 `4 * A` 个滤波器。`A` 和 `K` 分别代表 anchor 的数量和物体类别。注意的是，`RetinaNet`
    中提出的 focal loss 用于训练物体分类以解决类别不平衡问题并提高目标检测精度。


    ![](img/image-xyl92tgd.jpg)

    图 12.18 `RetinaNet` 的架构。


    `Focal loss` 是交叉熵损失（`CE`）的改进版本，定义如下：


    ![](img/image-85lgxi8l.jpg)

    其中是权重因子 `γ` 是一个可调的聚焦参数，定义如下：


    ![](img/image-rp9a6ghe.jpg)

    这里，`y` 是真值类别，`p` 是模型预测的类别概率。如果 `γ = 0`，则等于 `CE`；如果设置 `γ > 0`，网络在训练过程中可以更多关注分类错误的示例而不是分类良好的示例。例如：

    - 模型输出一个高概率值，例如 = 0.8，意味着预测结果接近真值（分类良好的示例）。

    - 当 `γ = 0` 时，`FL = 0.32192`

    - 当 `γ = 2` 时，`FL = 0.01287`

    - 模型输出一个低概率值，例如 = 0.2，意味着预测结果与真值差异很大（分类错误的示例）。

    - 当 `γ = 0` 时，`FL = 0.32192`

    - 当 `γ = 2` 时，`FL = 0.48603`

    如所示，如果 `γ > 0`，分类良好的示例的损失为 `FL = 0.01287`，模型关注分类错误的示例 `FL = 0.48603`。在实验中，`RetinaNet`
    在 `γ = 2` 时效果最好。


    ## 12.3.9: YOLO-v3


    Redmon 在 2018 年提出了 `YOLO-v2` 的优化版本—— `YOLO-v3`。`YOLO-v3` 通过三个主要改进获得了惊人的检测效果：

    (1) 改变主干网络以提取更好的特征

    (2) 增加 anchor 框的数量以实现精确预测

    (3) 应用 `FPN` 概念进行多尺度检测，如图所示。


    主干网络：所有检测方法的第一步都是训练一个主干网络。例如，`SSD` 的主干是 `VGG-16`，`YOLO-v2` 的主干是 `DarkNet-19`，`RetinaNet`
    的主干是 `ResNet-101`，而 `YOLO-v3` 的主干是 `Darknet-53`。`Darknet-53` 在 `Darknet-19` 架构上通过添加快捷连接构建了
    53 个卷积层。`Darknet-53` 在精度和每秒操作次数上比 `DarkNet-19`、`ResNet-101` 和 `SSD` 更高效。


    ![](img/image-hyugn0g.jpg)

    图 12.20 `Darknet-19` 和 `Darknet-53` 的架构。


    框和多尺度预测：`YOLO-v2` 使用 5 个 anchor 框预测物体位置，而 `YOLO-v3` 将 anchor 框的数量从 5 增加到 9。这 9
    个具有不同尺度的 anchor 被分配给三个不同的输出层，如表 12.1 所示。


    表 12.1

    | | | |

    |---|---|---|

    | | | |

    | | | |

    | | | |

    | | | |

    | | | |

    | | | |

    | | | |

    | | | |


    ![](img/image-jnxzqrq.jpg)

    图 12.19 `YOLO-v3` 的架构。


    `YOLO-v3` 的三个输出分别是 `52 × 52`、`26 × 26` 和 `13 × 13` 网格，对应于输出图 `52 × 52`、`26 × 26`
    和 `13 × 13`。输出图越小，相应网格的感受野越大。如图所示，`4 × 4` 特征图的感受野比 `2 × 2` 特征图 小，因此使用小 anchor
    框 (a) 比使用 anchor boxes (c) 好。相反，`2 × 2` 特征图的每个网格感受野更大，因此使用大 anchor 框 (d) 比使用小
    anchors (b) 好。


    ![](img/image-zclbpti9.jpg)

    图 12.21 anchor 框的配置。


    由于每个输出层分配了三个不同的 anchor 框，且每个网格预测三个边界框，`YOLO-v3` 的每个输出层形状可以表示为 4 个边界框偏移、1 个物体性预测和
    `c` 个类别预测。例如，使用 `YOLO-v3` 在包含 80 类的 COCO 数据集上检测物体（`c = 80`）。三个预测层的输出形状分别为 `(13,13,3,85)`、`(26,26,3,85)`
    和 `(52,52,3,85)`，对应的预测框数量分别为 507、2028 和 8112，所示。


    为了训练 `YOLO-v3`，目标损失函数由三部分组成：偏移损失、边界框损失以及分类损失，定义如下：


    - 每个真值边界框的四个坐标

    - 每个预测边界框的四个坐标

    - 网格 `i` 中框的预期得分

    - 网格 `i` 中框的预测得分

    - 网格 `i` 中类别 `c` 的预期类别概率

    - 网格 `i` 中类别 `c` 的预测类别概率

    `S`: 网格的宽度和高度；`YOLO-v3` 有三种尺寸的网格，包括 `13 × 13`、`26 × 26` 和 `52 × 52`

    `B`: 如果网格 `i` 中的边界框负责检测物体，则每个网格预测的边界框数量；否则，如果网格 `i` 中没有物体，则为 0

    交叉熵


    ## 12.3.10: CFF-SSD


    Le 等人 [31] 在 2019 年提出了跨分辨率融合单检测器（`CFF-SSD`）。`CFF-SSD` 通过将提出的跨分辨率融合（`CFF`）方法应用于基础检测器
    `SSD` 来提高目标检测性能，尤其是对小目标的检测。`CFF-SSD` 有两个版本：用于快速检测的 `1CFF-SSD` 和用于更准确检测的 `2CFF-SSD`，如图所示。


    ![](img/image-so34oi5w.jpg)

    图 12.22 `CFF-SSD` 的架构。


    空洞空间金字塔池化（`N-ASPP`）模块

    `N-ASPP` 模块使用浅层特征图作为输入，通过四个不同速率的并行空洞卷积提取多尺度上下文信息。


    ![](img/image-x2i5qwn.jpg)

    图 12.23 跨分辨率融合 (`CFF`)


    在 `1CFF-SSD` 架构中，采用一种 `CFF`，即使用不同速率的空洞卷积来增强语义信息。在 `2CFF-SSD` 中，为了产生检测，`SSD` 使用来自六层不同卷积的特征图。在
    `SSD` 模型中，特征图中的每个网格预测多个边界框，深层负责检测大物体，而浅层负责检测小物体。由六层卷积预测的边界框数量计算如下：

    `Total box: 5776 + 216 + 150 + 36 + 4 = 8732`

    每个预测框包含 `N` 个类别得分和四个偏移。默认框被预先选择以覆盖各种尺寸的物体。`SSD` 使用不同层具有不同的默认框，每个框位于相应的网格。


