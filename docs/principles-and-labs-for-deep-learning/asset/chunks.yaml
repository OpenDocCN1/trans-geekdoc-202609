    ## 1.2: TensorFlow 简介


    TensorFlow [3] 是由 Google Brain 团队开发的端端开源平台，它使用数据流图来构建机器学习和深度学习模型。


    ### 指数据表示

    `Tensor` 是一个具有统一类型（a）的多维数组。TensorFlow 中的所有计算都基于张量。这里列出了创建基础张量的示例。

    ![](img/image-kth2jt76.jpg) ![](img/image-q0tbg2va.jpg) ![](img/image-702ur9gi.jpg)


    ### 指计算图

    TensorFlow 通过使用数据流图来表示计算。在计算图中，每个节点代表一种操作（如加法、减法、乘法、除法等），边代表节点之间的关联。在执行每个操作后，将形成一个新张量用于下次计算。


    例如，使用 TensorFlow 展示数学公式的源代码所示：

    ```

    ![](img/image-e6e9h05u.jpg)

    ```

    上述程序的计算图如图所示。注意，TensorFlow 使用 TensorBoard 来绘制图形；我们将在章节中介绍这一功能。图中从左侧开始，常量 `a` 和
    `b` 连接到加法（Add）和减法（Sub）操作节点进行计算，然后 `Add` 节点和 `Sub` 节点产生的张量连接到除法（Div）操作节点以计算最终结果。

    ![](img/image-08blxmmx.jpg)

    图 1.2 `Y = (a + b)/(a - b)` 的计算图。


    在 TensorFlow 1 中，首先生成计算图，然后创建一个 session 来执行该图。这种技术被称为静态计算图。为了帮助用户轻松上手 TensorFlow
    并调试程序，TensorFlow 2 引入了激进执行（Eager execution），这是一种命令式编程环境，可以立即执行操作而无需构建图；它减少了样板代码。除了激进执行，TensorFlow
    2 还有许多变化，我们将在下一节介绍。


    ## 1.3: TensorFlow 2 的改进


    TensorFlow 2 是 TensorFlow 1 的改进版本，侧重于简单的执行、易的模型构建和健壮的模型部署。TensorFlow 2 有六个主要更新功能：激进执行、Keras、`tf.data`、TensorFlow
    Hub、分布式策略（Distribution Strategy）和 SavedModel。前三个功能将在下一节讨论。后续章节将讨论其他功能。


    - **Execution (执行)**：一个用于机器学习和深度学习研究与实验的灵活平台，提供命令式编程环境，操作可以立即求值而无需构建图。

    - **Keras**：构建在 TensorFlow 2 之上的高级 API，用于快速方便地设计和训练网络模型。TensorFlow 2 内置的 Keras
    可以通过 `tf.keras` 函数使用。

    - **tf.data**：允许用户以简单方式构建复杂输入流水线的 API。该 API 可以处理大量数据并读取不同格式的数据。

    - **Hub**：存储已训练机器学习和深度学习模型的地方，用于特定目的的复用，例如通过微调网络模型以用更少的训练数据和时间来解决新任务。

    - **Strategy (策略)**：`tf.distribute.Strategy`，一种 TensorFlow API，用于将现有模型的训练分布到多个设备（如
    GPU 或 TPU）上。

    - **SavedModel**：TensorFlow 2 标准化了一个统一格式，用于存储带有权重的完整网络模型。使用 SavedModel，可以将训练好的模型部署到许多平台或设备，如智能手机、树莓派甚至网页。


    图 1.3 显示了 TensorFlow 2 的简化概念图。所示，该图由两个阶段组成：(1) 训练阶段和 (2) 部署阶段。训练阶段从使用 `tf.data`
    API 读取和处理输入流水线数据、从 TensorFlow Hub 加载预训练模型权重进行微调、使用 `tf.keras` API 构建神经网络、使用分布式策略训练模型以及使用
    `SavedModel` 保存模型权重。在部署阶段，训练好的模型可以通过不同的库部署到不同的设备或平台。


    - **Lite**：一个用于将训练好的机器学习模型转换为压缩的 flat buffer 并部署到移动和物联网（IoT）设备上的库。

    - **FlowJS**：一个用于将训练好的机器学习模型部署在 JavaScript 环境（如浏览器或 Node.js）中的库。

    - **Serving**：一个用于机器学习和深度学习模型的灵活部署系统，允许在服务器架构不变的情况下部署新算法。2 还支持 Java、C、Go 等其他语言。


    ![](img/image-edq5agaj.jpg)

    图 1.3 TensorFlow 2 的简化概念图。


    ## 1.4: 激进执行 (Eager execution)


    ### 1.4.1: 激进执行简介

    通过激进执行平台立即求值操作是 TensorFlow 2 中最重要的更新功能之一。与 TensorFlow 1 不同（它通过先构建计算图然后设置 session
    来执行生成的图），TensorFlow 2 中的激进执行提供了一个编程环境，操作可以立即求值而无需构建图。这使用户能够通过即时错误报告更容易地进行调试，并简化动态模型的规范。


    激进执行的重要特性如下：

    - 操作的求值。

    - 程序的调试。

    - 不需要构建计算图。

    - 无需 `tf.Session.run` 即可返回计算结果。


