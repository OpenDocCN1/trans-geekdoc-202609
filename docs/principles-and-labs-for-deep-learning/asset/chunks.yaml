    # 3.3: Experiment: Pokémon combat prediction


    In this section, a Pokémon combat prediction model is implemented to illustrate
    a binary classification model. In a combat, a winner can be predicted based on
    the characteristics of Pokémon such as the amount of blood, attack force, defense
    points, and so on. Therefore, the Pokémon characteristics are used as the inputs
    of the Pokémon combat prediction model. The `BCE` loss function introduced earlier
    is employed for training the model. The model predicts the winner of the combat
    between the first Pokémon and the second Pokémon based on output probability value.
    If the predicted probability is less than `0.5`, the winner is the first Pokémon.
    On the contrary, the winner is the second Pokémon.


    In order to verify the effect of the one-hot encoding technique, we implement
    two scenarios of the Pokémon combat prediction model:

    - The first scenario, the integer-encoding technique is used to represent the
    attributes of the Pokémon for training the model, named `Model-1`.

    - The second scenario, the one-hot-encoding technique is employed to represent
    the attributes of Pokémon for the training model, named `Model-2`.


    ## 3.3.1: Introduction to Pokémon-Weedle’s cave dataset


    The example in this chapter uses a Kaggle dataset, namely the “Pokémon-Weedle’s
    Cave” dataset for training and evaluating the Pokémon combat prediction model.
    Please access `https://www.kaggle.com/terminus7/pokemon-challenge` and click “Download”
    to download the dataset, as shown in Fig. 3.9.


    ![](image-wydk5u9s.jpg) Fig. 3.9 Pokémon-Weedle’s Cave dataset page.


    To predict the outcome of future matches between two Pokémon, the Pokémon-Weedle’s
    Cave dataset provides the Pokémon characteristics and the results of previous
    combats for training models.


    ### Data

    `Pokémon-Weedle’s Cave` dataset has `800` Pokémon. Table 3.2 displays the information
    of the first five Pokémon. The characteristics of each Pokémon are as follows:


    **Table 3.2**

    | Pokémon name | 1: The first attribute | 2: The second attribute | Healthpoint
    | Attack force | Defense point | Atk: Special attack force | Def: Special defense
    point | Speed of Pokémon | Evolutionary stage | Legendary Pokémon |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |


    `Pokémon-Weedle’s Cave` dataset provides the outcome of `50,000` Pokémon combats.
    Table 3.3 lists the information of the first five combats, where the numbers represent
    the `ID` of each Pokémon.


    **Table 3.3**

    | ID | Pokémon Name | Winner |

    | :--- | :--- | :--- |

    | 5 | Charmander | Charmander |

    | 1 | Bulbasaur | Charmander |


    The detail information of each Pokémon can be found from the `ID` of the Pokémon
    in combat. As shown in Table 3.4, the first Pokémon with `ID` of `5` corresponds
    to `Charmander`; the second Pokémon with `ID` of `1` corresponds to `Bulbasaur`;
    and the winner of the combat is `Charmander`.


    The training dataset contains training samples and corresponding ground-truth
    labels as follows:

    - **samples**: First Pokémon (Type 1, Type 2, HP, Attack, Defense, Sp. Atk, Sp.
    Def, Speed, Generation, Legendary) and second Pokémon (Type 1, Type 2, HP, Attack,
    Defense, Sp. Atk, Sp. Def, Speed, Generation, Legendary).

    - **labels (or expected output)**: First Pokémon or second Pokémon; `0` means
    the first Pokémon wins, `1` means the second Pokémon wins.


    ### Supplementary explanation

    There are `18` attributes (`Type1` and `Type2`) of Pokémon in `Pokémon-Weedle’s
    Cave` dataset including glass, fire, water, bug, normal, poison, electric, ground,
    fairy, fighting, psychic, rock, ghost, ice, dragon, steel, dark, and flying. The
    numbers from `0` to `17` can be used to represent these attributes. However, there
    is no natural ordinal relationship between attributes so it would be better to
    use the one-hot encoding technique to encode these attributes.


