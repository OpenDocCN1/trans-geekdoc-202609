    # 7.1: Advanced TensorBoard


    TensorBoard is an official toolkit of TensorFlow that provides the visualization
    needed for designing neural networks and machine learning experimentation. Chapters
    2 and 5 introduced the use of four visualization functions including `Scalars`,
    `Graphs`, `Distributions`, and `Histograms`, which only need to use `tf.keras.callbacks.TensorBoard`
    for completing settings. However, the `tf.keras.callbacks.TensorBoard` function
    in the high-level Keras API is limited in providing information in various states
    and statistics of the neural networks during the training process. For example,
    only key metrics such as `loss` and `accuracy`, and how they change as training
    process can be observed in the `Scalars` dashboard of TensorBoard. If we want
    to observe and analyze the output result of the network models during training
    such as image, text, and so on, it is required to use a custom function. This
    chapter introduces how to write summary data and display on TensorBoard with the
    `tf.summary` module of TensorFlow, which provides the following APIs:


    - write a scalar summary such as loss value, accuracy value, or learning rate

    - write an image summary

    - write a text summary

    - write an audio summary

    - write a histogram summary


    The following section presents the use of `tf.summary` module.


    ![](image-8b16k8g4.jpg) results on TensorBoard: Open TensorBoard through the command
    line to view the results, as shown in Fig. Because data have not been written
    to the log file, no dashboards are active for the data.


    ![](image-trteowa7.jpg) Fig. 7.1 TensorBoard interface.


    ![](image-nm4ubp68.jpg) Details of the `tf.summary` module can be accessed at:
    www.tensorflow.org/versions/r2.0/api_docs/python/tf/summary


    ## 7.1.1: tf.summary.scalar


    The `tf.summary.scalar` is an API of the `tf.summary` module used to write a scalar
    summary such as loss values, accuracy values, and so on. These values can be displayed
    through the scalars dashboard of TensorBoard for observing and monitoring. Fig.
    7.2 presents the loss and mean absolute error value changes of a neural network
    during training obtained by using the function `tf.keras.callbacks.TensorBoard`
    of the high-level Keras API. If other scalar values need to be written and monitored,
    it is suggested to use `tf.summary.scalar`. The syntax of `tf.summary.scalar`
    is expressed as follows:


    ![](image-rrq3swz1.jpg) Fig. 7.2 The scalars dashboard.


    ![](image-zmicrk88.jpg) The following is an example of using the `tf.summary.scalar`
    API to write and visualize the Sine function on TensorBoard. Fig. 7.3 shows the
    results.


    ![](image-25mce4gs.jpg) Fig. 7.3 The Sine on the scalars dashboard.


    ![](image-zeq3ovsz.jpg)


    ## 7.1.2: tf.summary.image


    The `tf.summary.image` is an API of the `tf.summary` module used for writing an
    image summary. Its result can display on the images dashboard of TensorBoard.
    The syntax of `tf.summary.image` is expressed as follows:


    ![](image-8ksyertg.jpg) The following program examples explain how to use the
    `tf.summary.image` API. Please download the test image from the link below and
    unzip it under the root directory. https://drive.google.com/open?id=1cC45twI3a5AkBYYE6Qb3ZV3uCPlw9eL6


    - read an image (`airplane.png`)


    ![](image-6e0gqjlm.jpg) an image to a log file and display it on TensorBoard,
    as shown in Fig. 7.4


    ![](image-cbs39de2.jpg) Fig. 7.4 Observing an image written by the `tf.summary.image`
    on the images dashboard.


    ![](image-5vyaq39i.jpg) images including `airplane_zoom.png`, `plane_flip.png`,
    `plane_color.png`, `plane_rot.png`, and `plane.png` are written to the log file
    and displayed on TensorBoard at once, as shown in Fig. 7.5.


    ![](image-j764w2y0.jpg) Fig. 7.5 Observing multiple images written by `tf.summary.image`
    on the images dashboard.


    ![](image-yzetzy3y.jpg) five images including `airplane_zoom.png`, `airplane_flip.png`,
    `airplane_color.png`, `airplane_rot.png`, and `airplane.png` to the log file in
    separate steps and display on TensorBoard, as shown in Fig. 7.6.


    ![](image-efs11eup.jpg) Fig. 7.6 Observing image written by `tf.summary.image`
    in separate steps on the images dashboard.


    ![](image-vzyqm8kl.jpg)


    ## 7.1.3: tf.summary.text


    The `tf.summary.text` is an API of the `tf.summary` module responsible for writing
    text summary. Its results can display through the text dashboard of TensorBoard.
    The syntax of `tf.summary.text` is expressed as follows:


    ![](image-j2a2w6ik.jpg) Arguments:


    - a name for the text summary

    - a string value

    - explicit monotonic step value

    - optional description for the text summary


    The following program example explains how to use `tf.summary.text`. text data
    to a log file and display it on TensorBoard, as shown in Fig. 7.7.


    ![](image-e0u5fd.jpg) Fig. 7.7 Observing the text written by `tf.summary.text`
    on the text dashboard.


    ![](image-ex5tky.jpg)


    ## 7.1.4: tf.summary.audio


    The `tf.summary.audio` is an API of `tf.summary` module used to write an audio
    summary. Its result can display on the audio dashboard of TensorBoard. The syntax
    of `tf.summary.audio` is expressed as follows:


    ![](image-tn1pik.jpg) Arguments:


    - a name for the audio summary

    - a tensor data with shape `(n, m, c)`, where `n`, `m`, and `c` are the number
    of audios, number of frames, and the number of channels, respectively

    - an integer number, representing the sample rate

    - explicit monotonic step value

    - a positive integer number, indicating the number of audios is emitted at each
    step, the default value is set to three

    - a constant string, representing the type of audio formats such as `wav`, `mp3`,
    and so on

    - optional description for the audio summary


    The following program example explains how to use `tf.summary.audio`. Please download
    the test audio from the link below and unzip it under the root directory: https://drive.google.com/open?id=1V4nNQ-ZQMBUezFWZoAZ62dRevUGPZ


    ![](image-806vjkap.jpg) an audio to a log file and display it on TensorBoard,
    as shown in Fig. 7.8.


    ![](image-qybymbub.jpg) Fig. 7.8 Observing the audio written by `tf.summary.audio`
    on the audio dashboard.


    ![](image-v5hnpsvu.jpg)


    ## 7.1.5: tf.summary.histogram


    The `tf.summary.histogram` is an API of `tf.summary` module used to write a histogram
    summary. Its result can display on the histograms dashboard and distributions
    dashboard of TensorBoard. The syntax of `tf.summary.histogram` is expressed as
    follows:


    ![](image-ivi2al8w.jpg) Arguments:


    - a name for the histogram summary

    - a tensor data

    - explicit monotonic step value

    - a positive integer number, representing the number of buckets

    - optional description for the audio summary


    Fig. 7.9 shows the weight distribution of a neural network layer obtained by using
    `tf.keras.callbacks.TensorBoard`.


    ![](image-105eb6t7.jpg) Fig. 7.9 Weight distribution of a neural network layer.


    Because the `tf.keras.callbacks.TensorBoard` does not support writing the output
    distribution of the layers, `tf.summary.histogram` API is recommended if this
    distribution needs to be visualized. The following program example explains how
    to use `tf.summary.histogram`. 100 sets of random values to a log file and display
    them on TensorBoard, as shown in Figs. 7.10 and.


    ![](image-tc7ltc1y.jpg) Fig. 7.10 Observing multiple sets of random values written
    by the `tf.summary.histogram` on the histograms dashboard.


    ![](image-ya7erhm9.jpg) Fig. 7.11 Observing multiple sets of random values written
    by `tf.summary.histogram` on the distributions dashboard.


    ![](image-e6nxcdct.jpg)

