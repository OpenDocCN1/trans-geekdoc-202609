- raw: '  9.1: Transfer learning    9.1.1: Introduction to transfer learning    In
    Chapter Section we explained and demonstrated that the features extracted by convolutional
    layers of different depths of the network are different. In particular, the shallower
    layers are mainly responsible for extracting simple features of the input such
    as edges and lines, while the deeper layers are based on the extracted features
    from the previous layers, so they can recognize more specific features such as
    nose, eyes, ears, and so on, as shown in Fig.    ![](image-9fhrm9y5.jpg)Fig. 9.1
    Example of a convolutional neural network (CNN).    The learned feature of convolutional
    neural networks (CNNs) can be applied to different tasks. For example, by using
    the ImageNet dataset containing tens of thousands of images to train the CNNs,
    a large amount of training data allows the network models to learn very diverse
    features. When we have a new dataset and want to solve a task of interest, instead
    of training the entire network model from scratch, we use a trained model on a
    large dataset such as ImageNet, called a pre-trained model, as an initialization
    or fixed feature extractor for the new task. This training method is called transfer
    learning  Transfer learning is actually very similar to our human learning method;
    the knowledge gained by completing a task can also be used to solve other related
    tasks. The more related the tasks are, the easier the knowledge is transferred.
    For example, when we know how to ride a bicycle, it will be easier for us to learn
    to ride a motorcycle. According to the experimental results of many public works
    using the transfer learning method for training neural network models can help
    to obtain better performance while requiring less training data and training time
    compared with the method of training from scratch. Fig. 9.2 shows how training
    from scratch differs from transfer learning. As shown, in training from scratch,
    the models are trained separately for specific tasks and no knowledge is retained
    for transferring from one model to another. In transfer learning, learning of
    new tasks is based on the learned knowledge from previous tasks.    ![](image-zdyexk1j.jpg)Fig.
    9.2 Diagram of training a model from scratch and training a model using transfer
    learning.    9.1.2: Transfer learning strategies    There are four transfer learning
    strategies that can be applied based on the following two characteristics of the
    training data.    size of training data: If a new dataset contains tens of thousands
    of training samples, it is considered a large dataset. If the new dataset only
    consists of hundreds or thousands of training samples, it is considered a small
    dataset.  similarity of data: This is the similarity between the new training
    data and the data used for the pre-trained model. For example, cats and tigers
    are considered as similar samples, while cats and tables are considered as different
    samples.    first strategy: training network models with small dataset and similar
    training samples    Because a huge network model is trained on a small dataset,
    the overfitting problem is prone to occur. Thus, when applying transfer learning,
    the weights of the pre-trained model must remain unchanged during training process.
    Since the new dataset has similarity to the dataset used for the pre-trained model,
    they have similar features in hidden layers of the network, especially in the
    deeper layers. Therefore, the layers for feature extraction do not need to change.
    To learn a new task, it is only required to make changes to the last layer that
    handles output features of the network model. The new network model is built based
    on the architecture of the pre-trained model by removing the output layer (last
    layer), then adding new layers for the new task. The steps for transfer learning
    are as follows:    1 (removing the network layer): Choose to remove the last layer
    of the pre-trained model, as shown in Fig.    ![](image-n1bq5u3v.jpg)Fig. 9.3
    Removing the last layer of the pre-trained model (1).    2 (adding new layer):
    Add one or multiple layers to the top of the original network structure for the
    new task, as shown in Fig.    ![](image-f2yza689.jpg)Fig. 9.4 Adding layers for
    the new task (1).     3 (training new model): During training the new network
    model, the weights of most network layers are fixed; only newly added layers are
    trained, as shown in Fig.    ![](image-rp3q6g58.jpg)Fig. 9.5 Freezing layers for
    training (1).     second strategy: training network models with small datasets
    and dissimilar training samples    Because of using a small dataset for training
    a network model, the weights of the pre-trained model should be left unchanged
    to prevent the overfitting problem. Since the samples of the new dataset are different
    from these of the dataset used for the pre-trained model, they have similar features
    only in the shallower layers, while their features in the deeper layers of the
    network model are very different. To build a network model based on the architecture
    of the pre-trained model for learning a new task, only the shallower layers are
    retained, whereas the deeper layers should be removed, and the output layer is
    replaced with a new one. The steps for transfer learning are as follows:    1
    (removing the network layer): Remove most of the deep layers of the pre-trained
    model and leave only some shallow layers that extract simple features such as
    lines and edges, as shown in Fig.    ![](image-nm7pxwgz.jpg)Fig. 9.6 Removing
    layers of the pre-trained model.    2 (adding new layer): Choose to add new layers
    to the top of the original network architecture for the new task, as shown in
    Fig.    ![](image-l9fxyhab.jpg)Fig. 9.7 Adding layers for the new task (2).   
    3 (training new model): During training the new network model, the weights of
    most network layers are fixed; only newly added layers are trained, as shown in
    Fig.    ![](image-fbktn987.jpg)Fig. 9.8 Freezing layers for training (2).    third
    strategy: training network models with a large dataset and similar training samples   
    Using a large dataset allows us to train the entire pre-trained model or a new
    network model from scratch. The following provides two training methods:    pre-trained
    model    Because the new dataset has similarity to the dataset used for the pre-trained
    model, they have similar features in hidden layers of the network, especially
    in the deeper layers. Therefore, the layers for feature extraction do not need
    to change. To learn a new task, it is only required to make changes to the last
    layer that handles the output of the network model. The new model is built based
    on the architecture of the pre-trained model by replacing the last layer with
    new one. Finally, because the dataset is large enough, the weights of the newly
    added layers as well as some or all other layers of the new network model can
    be optimized to obtain better performance. The steps for fine-tuning are as follows:   
    1 (removing the network layer): Choose to remove the last layer of the pre-trained
    model, as shown in Fig.    ![](image-kpbrfthr.jpg)Fig. 9.9 Removing the last layer
    of the pre-trained model (2).    2 (adding new layers): Choose to add one or more
    layers to the top of the original network architecture for a new task, as shown
    in Fig.    ![](image-jysb78we.jpg)Fig. 9.10 Adding layer for the new task (3).   
    3 (training new model):    method: The weights of most network layers are fixed;
    only newly added layers are trained, as shown in Fig.    ![](image-ru8kgwtj.jpg)Fig.
    9.11 Freezing layers for training (3).     method: Train or fine-tune through
    the entire network model on the new dataset, as show in Fig.    ![](image-nyqsi5qj.jpg)Fig.
    9.12 Training or fine-tuning the entire network model (1).    a new network model   
    Because the dataset is large enough, it allows us to create a new network model
    and train this model from scratch, as shown in Fig.    fourth strategy: training
    network models with large dataset and dissimilar training samples    ![](image-p0alxoim.jpg)Fig.
    9.13 Training the network model from scratch (1).    Using a larger dataset for
    training a network model can avoid the overfitting problem. Therefore, the entire
    pre-trained network model or a new network model can be trained on the new dataset
    for improving performance. The following provides two training methods.    a pre-trained
    model    Due to the difference between the new dataset and the dataset used for
    the pre-trained model, their features are not similar in most layers of the network
    model. However, in practice, it is still very often beneficial to initialize with
    weights from a pre-trained model for training a new network model. The steps for
    the training model are as follows:    1 (removing the network layer): Choose to
    remove the last layer of the pre-trained model, as shown in Fig.    ![](image-amt1k3fr.jpg)Fig.
    9.14 Removing the last layer of the pre-trained model (3).    2 (adding new layer):
    Choose to add one or more layers to the top of the original network architecture
