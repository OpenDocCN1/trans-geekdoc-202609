    # 12.4: 实验：YOLO-v3 的实现


    本节介绍了如何构建用于目标检测的 `YOLO-v3` 模型。为了进行实验，我们使用了 `PASCAL VOC 2007` 数据集对模型进行训练和测试。


    ## 12.4.1 加载 YOLO-v3 项目


    由于本章 `YOLO-v3` 模型的示例程序比第 1-9 章中的之前的示例更复杂，我们使用 `PyCharm` IDE 作为编译器来编写和训练模型。加载 `YOLO-v3`
    项目的过程如下。


    - `YOLO-v3` 项目：请访问 `https://github.com/taipeitechmmslab/MMSLAB-DL/tree/master`
    下载源码，如图![](img/image-rwie3eg6.jpg)图 12.28 GitHub 上的`YOLO-v3` 项目 (Lab12)所示。

    - 使用 `PyCharm` 打开项目，如图![](img/image-rdro5kwk.jpg)图 12.29 在 PyCharm 上打开项目。

    - 加载项目的路径，如图![](img/image-kbvx2m5z.jpg)图 12.30 `YOLO-v3` 项目路径。

    - 编译环境（注意：如果此步骤已设置，则省略）：点击 `File` → `Settings` → `Project` “项目名称” → `Project Interpreter`
    → `Add` → `Virtualenv Environment` → `Existing environment` → 选择虚拟机，如图 12.31 和
    ![](img/image-vwibgmtx.jpg)图 12.31 新解释器、 ![](img/image-9nw2s6k6.jpg)图 12.32 选择现有的虚拟环境。


    ## 12.4.2 数据集介绍


    在本节中，我们使用 `PASCAL Visual Object Classes 2007` (`PASCAL VOC 2007`) 数据集来训练和测试 `YOLO-v3`
    模型。这是一个基准数据集，已用于评估许多目标检测方法，如 `R-CNN`、`SSD`、`YOLO` 等。可以通过 `TensorFlow` 数据集加载该数据集，如下所示![](img/image-otn3e3f6.jpg)
    `PASCAL VOC 2007` 数据集由三部分组成，包括 2501 张图像的训练集、2510 张图像的验证集和 4952 张图像的测试集。该数据集有 20
    类，可以使用以下命令显示![](img/image-ijkf7c43.jpg)显示数据集：显示数据集中的图像以及目标的地面真边界框![](img/image-8amjblnu.jpg)
    ![](img/image-65182mxv.jpg)


    ## 12.4.3 构建 YOLO-v3 模型


    图 12.33 显示了 `YOLO-v3` 项目，包含以下文件和文件夹：

    - 训练 `YOLO-v3` 模型的源码文件

    - 多尺度训练的源码文件

    - 测试模型的源码文件

    - 设置模型参数、训练参数和权重路径的源码文件

    - 将 `YOLO-v3` 训练权重转换为 `TensorFlow` 格式的源码文件

    - 存储自定义网络层源码文件的文件夹

    - 存储自定义网络模型源码文件的文件夹

    - 存储自定义损失函数源码文件的文件夹

    - 存储工具包的文件夹，例如用于加载数据集的 `dataset.py`、用于评估模型的 `evaluation.py` 等

    - 存储输出结果的文件夹![](img/image-ewipp1dd.jpg)图 12.33 `YOLO-v3` 项目 ![](img/image-2fmp3n0j.jpg)图
    12.34 `YOLO-v3` 模型源码流程图。


    运行 `YOLO-v3` 项目需要执行两个文件：用于训练模型的 `train.py`（或 `train-multi-scale.py`）和用于测试训练模型的
    `test.py`。`train.py` 和 `train-multi-scale.py` 的区别在于 `train.py` 使用固定尺寸训练模型，而 `train-multi-scale.py`
    采用多尺度训练，输入图像的大小按 32 的倍数进行变化，如 320、352、384、416、448、480、512、544、576 和 608，每 10 个
    epoch 变化一次。最小输入尺寸为 320×320，最大输入尺寸为 608×608。使用 `train-multi-scale.py` 的训练结果优于 `train.py`，但耗时更长。


    ### YOLO-v3 模型


    图 12.34 是构建 `YOLO-v3` 模型的流程图。


    ### 辅助函数

    - **backbone (骨干网络)**：`Darknet-53` 的源码写在 `model → darknet.py`。`YOLO-v3` 使用 `Darknet-53`
    作为特征提取的骨干网络。图 12.35 和 12.36 显示了 `Darknet-53` 的架构![](img/image-mptzu1or.jpg)图 12.35
    `Darknet-53` 架构 (1) ![](img/image-65ldwtal.jpg)图 12.36 `Darknet-53` 架构 (2)。`Darknet-53`
    代码如下![](img/image-y6djff28.jpg)Darknet Convolution 和 `Darknet Residual Block`
    的源码 ![](img/image-bjponje8.jpg) ![](img/image-8ftwtbc.jpg)

    - **architecture (架构)**：`YOLO-v3` 模型源码写在 `model → yolo.py`。`YOLO-v3` 使用三个不同的卷积层检测目标。图
    12.37 和 12.38 显示了 `YOLO-v3` 的架构![](img/image-ehbq6lr.jpg)图 12.37 `YOLO-v3` 架构
    (1) ![](img/image-56gp8zy9.jpg)图 12.38 `YOLO-v3` 架构 (2)。`YOLO-v3` 模型源码如下![](img/image-zeq381r.jpg)
    ![](img/image-myhqcs6.jpg)

    - **setting of convolutional layer of YOLO-v3 (YOLO-v3 卷积层设置)**：![](img/image-e46dd7p.jpg)
    ![](img/image-sfk1xvlm.jpg)此自定义层用于将输出尺寸重塑为 `(act, grid_h, grid_w + 5)` ![](img/image-pqkt0q84.jpg)，通过以下公式将模型预测坐标转换为边界框
    `(x, y, w, h)` ![](img/image-0g2f0qil.jpg) ![](img/image-amz6i8ap.jpg) ![](img/image-yr4zp9x.jpg)，对应预测边界框的中心、宽度和高度。

    - **top corner of the image (图像顶角)**：![](img/image-e1vg9shu.jpg) ![](img/image-vm4kh118.jpg)
    `sigmoid` 激活函数。此自定义层用于移除冗余边界框预测![](img/image-3spdkfox.jpg) ![](img/image-sdup0ngz.jpg)

    - **loss function (损失函数)**：目标损失函数的源码如下![](img/image-jbf65o0t.jpg) ![](img/image-1d4t7ve.jpg)
    ![](img/image-s15ba0gu.jpg) 计算 IoU 的函数 ![](img/image-4o37oa7.jpg) ![](img/image-1

    - **preprocessing (预处理)**：数据预处理源码存储在 `utils → dataset.py`。`YOLO-v3` 模型训练的数据预处理分为两个步骤：(1)
    数据增强和(2) 训练目标转换。

    - **augmentation (增强)**：颜色转换、水平翻转、图像缩放和图像旋转 image-m0ovxqp8.jpg) ![](img/-0hokggtb.jpg)

    - **target transformation (目标转换)**：将数据格式 `(batch size, 100, [x1, y1, x2, y2, classes])`
    转换为 `(batch size, grid, grid, anchors, [x, y, w, h, obj, class])`image-70e46b2p.jpg)
    ![](img/ey3hmt03.jpg) ![](img/we9ukf1r.jpg)

    - **pre-trained model (预训练模型)**：使用 `convert.py` 文件将原始预训练的 `YOLO-v3` 模型转换为 `Keras`
