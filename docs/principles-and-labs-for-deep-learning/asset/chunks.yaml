- raw: '  2.5: Experiment 2: Overfitting problem    2.5.1: Introduction to overfitting   
    Overfitting refers to the network model that obtained very good performance on
    the training data but that had poor performance on the validation data. The training
    loss curve is usually used to observe whether or not there is an overfitting problem.
    Fig. 2.18 presents an overfitting phenomenon, where the loss value of the training
    data (training error) continues to decrease after a period of training, while
    the loss value of the verification data (validation error) gradually increases.   
    ![](image-123mw656.jpg)Fig. 2.18 Overfitting phenomenon.    The training result
    of the house price-prediction model in Section 2.3 is shown in Fig. and the overfitting
    phenomenon can also be observed from the loss curve graph.    ![](image-l7ynuve8.jpg)Fig.
    2.19 Overfitting problem when training house price-prediction model.    Overfitting
    usually occurs when the training data is too small in scale or the complexity
    of the model is too great. As such, adding training data or simplifying the model
    may improve the problem of overfitting. The three methods to prevent overfitting
    without increasing the amount of data are:    the size of the model: When the
    number of parameters of the model is reduced, the model with fewer parameters
    will not be able to easily fit all training data. The model must learn how to
    use limited parameters to learn an effective feature representation.  weight regularization:
    When training a neural network model, the size of the network weights will increase.
    The longer the network is trained, the larger the network weights will become.
    The neural network with large weights is usually unstable because even small variation
    on the inputs can lead to large changes in output This can be a sign of overfitting
    training data of the neural network. To solve the overfitting problem, the core
    idea of weight regularization is to limit the size of the network weights during
    the training process. To penalize large weights, the first weight size is calculated,
    and then the calculated result is added to the loss function when training the
    model. There are two main approaches to calculate weight size: L1 regularization
    and L2 regularization, also known as weight decay    L1 regularization:    ![](image-2dsobhi0.jpg) 
    L2 regularization:    ![](image-1ww2b1mh.jpg)  where λ is a regularization parameter
    for controlling the penalty, λ ∈ \[0, 1\], w is the weights of the model, M is
    the total amount of parameters of the model, and is MSE loss function.    dropout
    technique The dropout technique refers to randomly discarding neurons in the neural
    network to prevent complex co-adaptions during the training process. When discarding
    neurons, they are temporarily taken out of the network, and their connections
    with other neurons are removed as well, as shown in Fig. The dropout technique
    has proved effective in addressing the problem of overfitting and improving the
    performance of neural networks in many applications such as speech recognition,
    image classification, and others.    ![](image-hoezykub.jpg)Fig. 2.20 Random dropout.    
    2.5.2: Code examples    This section continues using the house price-prediction
    model (Model-1) for testing overfitting. We explore the effect of the three methods
    for preventing overfitting problems using three modified models based on model-1:
    (1) model of reducing model size, named Model-2, (2) model of adding weight regularization,
    named Model-3, and (3) model of adding dropout technique, named Model-4. Table
    2.1 shows the architecture of Model-1, Model-2, Model-3, and Model-4.    model
    of reducing the Model-1 size      Table 2.1      2.1  2.1  2.1  2.1  2.1     
    ![](image-7wji95i5.jpg)  ![](image-enno8f3b.jpg)  model of adding weight regularization   
    ![](image-uk3k1ha8.jpg)  ![](image-njag75rr.jpg)  model of adding dropout    ![](image-ctskp129.jpg) 
    ![](image-134utveo.jpg)  After training, the trained Model-2, Model-3, and Model-4
    are verified on the test data.    ![](image-cgbe02q0.jpg)  2.5.3: Visualization
    with TensorBoard    In this section, we use TensorBoard to observe and analyze
    the training results of Model-1, Model-2, Model-3, and Model-4 in Section    all
    the training data records in the lower-left corner of TensorBoard, displaying
    only the validation data records, as shown in Fig. In Fig. model-1/validation
    with the orange line chart represents an overfitting model; model-2/validation
    with the maroon line chart represents the model of reducing parameters; model-3/validation
    with the cyan line chart represents the model of adding L2 regularization; and
    model-4/validation with the green line chart represents the model of using the
