    # 5.4: Experiment 1: Verification of three weight initialization methods


    This section continues the topic of CIFAR-10 image classification in Chapter.
    To verify the effectiveness of each weight initialization method, three scenarios
    of building neural networks are implemented:

    - a neural network with normal distribution ($\mu = 0$ and $\sigma = 0.01$)

    - a neural network with Glorot weight initialization

    - a neural network with He weight initialization


