    # 1.5: Keras


    ## 1.5.1: Introduction to Keras

    Introduced by François Chollet in 2014, `Keras` is an open-source, deep learning
    library designed for quickly building and training neural network models. `Keras`
    has no low-level operations of its own; it is run on top of open-source deep learning
    libraries called backend, such as `TensorFlow`, `CNTK`, and `Theano`. `Keras`
    utilizes `TensorFlow` backend by default; it can be changed to `CNTK` backend
    or `Theano` backend by using `use_backend()` function. There are a lot of commonly
    used neural-network building modules integrated into `Keras` for effectively designing
    models such as convolution layers, loss functions, activation functions, optimizers,
    and so on. In `TensorFlow 2`, `Keras` is the high-level API, so there is no need
    to install any additional `Keras` package; it can be used directly through the
    `tf.keras` API. It is highly recommended to use `tf.keras` API instead of `Keras`
    API because `tf.keras` supports TensorFlow operations, Eager Execution, `tf.data`,
    TPU training, and so on. The following introduces the two most commonly used methods
    of building network models in `Keras`, including sequential models and functional
    models.


    The following network layers are used for designing network models (later chapters
    present more detail about these layers):

    * fully connected layer.

    * convolution layer.

    * for flattening a tensor into a one-dimensional tensor. It is usually inserted
    between convolution layer and fully connected layer.

    * for adding a list of tensors with the same shape and outputting a single tensor.

    * for concatenating a list of tensors; all tensors have the same shape except
    for the concatenation axis.


    ### Supplementary explanation

    Using `tensorflow.keras.utils.plot_model` requires additional installation of
    `pydot` and `graphviz` packages.


    **Ubuntu**: Open Terminal and enter the following command:

    **Windows**: the command prompt and enter the following command:

    * to `https://graphviz.gitlab.io/_pages/Download/windows/graphviz-2.38.msi` to
    Download and install the `graphviz` package, as shown in Fig.

    ![](image-jpby66nc.jpg) Fig. 1.4 Download Graphviz 2.38.

    * add the `graphviz/bin` installation path to "New system variable": Control Panel
    → System → Advanced System Settings → Environmental Variables, as shown in Fig.

    ![](image-dolvr41w.jpg) Fig. 1.5 New environment variables.


    ## 1.5.2: Sequential model

    Sequential model is a method of building deep learning networks layer by layer
    in a systematic fashion. Fig. 1.6 shows a sequential network that starts from
    an input layer, which is connected to hidden layer 1. Then, hidden layer 1 is
    connected to hidden layer 2, and finally, hidden layer 2 and the output layer
    are connected to each other to form a complete model. `Keras` provides a sequential
    model API for constructing a network model easily and quickly. However, the construction
    method of the sequential model has some limitations:

    * allows creating models with single input and single output.

    * not allow creating models that share layers.

    * not allow building models with multiple inputs or outputs.

    ![](image-qod88ndw.jpg) Fig. 1.6 Single input and output model.


    Here, we present two methods of building a sequential network model, taking the
    image classification problem as an example. The model has an input with size of
    28 × 28, which will be flattened into a one-dimensional vector of 784; two hidden
    layers (dense layers) with rectified linear (ReLU) activation functions; and an
    output followed by softmax layer for classification.

    ![](image-2m0j447d.jpg) ![](image-7nu0in32.jpg)


    ## 1.5.3: Functional model

    The Keras functional API is a way to build network models by using a directed
    acyclic graph of layers. Following this method, instances of layers are first
    created, then they are connected to each other in pairs, and finally, the layers
    for acting as the input and output to the network are assigned. There are three
    steps for defining a network model using Keras functional API:

    1. **(defining input)**: Different from sequential model, the input layer with
    specific size of input data needs to be defined first.

    2. **(connecting layers)**: This step is completed by specifying where the input
    of a new layer comes from when it is declared.

    3. **(creating model)**: After all layers are declared and connected, it is required
    to specify the input and output of the model for completion of model creation.


    The Keras functional API is very flexible for creating complex models, especially
    models with multiple inputs, multiple outputs, or multiple inputs and outputs,
    as shown in Fig. All the complex models for advanced applications such as object
    detection, image segmentation, generative adversarial network, and so on, which
    we introduce later, can be built using a Keras functional API.

    ![](image-0stg64rd.jpg) Fig. 1.7 Different network model diagrams.

    ![](image-19sysqad.jpg) Fig. 1.8 Processing input data pipeline with `tf.data`
    API. Note that, ML and DL are abbreviation for machine learning and deep learning,
    respectively.


    The following introduces how to build the four network models shown in Fig. 1.7
    using a Keras functional API.


    ### input and output model

    For example, a model has an input with size of 28 × 28, which is flattened into
    a one-dimensional vector of 784; two hidden layers named `hidden1` and `hidden2`
    with ReLU activation functions; and an output layer named `Output`, followed by
    softmax activation function for classification. The source code for constructing
    model is:

    ```

    ![](image-sro69xs2.jpg) ![](image-pj3288v9.jpg)

    ```


    ### inputs and single output model

    For example, a commodity price-prediction model consists of two inputs, including
    product image and product brand, and one output of price prediction with size
    of (1,). The input product image with size of (128, 128, 3) is passed through
    two hidden layers named `hidden1_1` and `hidden1_2`, and the input product brand
    with size of (1,) goes through a hidden layer named `hidden1_3`. After combining
    information of two inputs, the resulting features are sent to another hidden layer
    named `hidden2`. Then, the output of `hidden2` layer is used as an input of a
    dense layer named `Output` for price prediction. The source code for constructing
    this model is:

    ```

    ![](image-4226mt86.jpg) ![](image-y3gn8ez2.jpg)

    ```


    ### input and multiple outputs model

    For example, a portrait-recognition model has an input and two outputs. The input
    of the model is a personal photo with size of (128, 128, 3), which is passed through
    three hidden layers named `hidden1`, `hidden2`, and `hidden3`. After flattening
    the output of the last hidden layer (hidden3), it is sent to two output layers
    named `Age_Output` and `Gender_Output` for age and gender predictions, respectively.
    The source code for constructing model is:

    ```

    ![](image-oxvo2de.jpg) ![](image-y1sbjjxq.jpg)

    ```


    ### inputs and multiple outputs model

    For example, a weather prediction model has two inputs for satellite cloud image
    and climate information, and three outputs for rainfall probability, temperature,
    and humidity. The satellite cloud image with size of (256x256x3) is passed through
    three hidden layers named `hidden1`, `hidden2`, and `hidden3`, and climate information
    with size of (10,) is put through a dense layer. After combining two inputs of
    information, the model outputs climate information including rainfall probability,
    temperature, and humidity through `Output1`, `Output2`, and `Output3` layers,
    respectively. The source code for constructing model is:

    ```

    ![](image-j7jppqoo.jpg) ![](image-se2io6b3.jpg)

    ```

