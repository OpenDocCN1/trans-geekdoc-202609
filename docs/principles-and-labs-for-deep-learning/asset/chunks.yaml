    ### Supplementary explanation


    In Chapter the `Inception-v3` network was loaded through `TensorFlow Hub` at and
    in this chapter, it is loaded at. The difference between the two loaded networks
    is that the `Inception-v3` loaded in Chapter 8 contains the last classification
    layer (1000 categories), whereas this classification layer is removed in the latter
    network.


    ### of Model-1 and Model-2


    Both the best-trained weights of `Model-1` and `Model-2` are used for evaluating
    the `Cats_vs_Dogs` test set.


    ![](image-5mwmurkl.jpg)

    The results show that `Model-2` with transfer learning obtained a classification
    accuracy of 99.39%, which is greater than the 1.42% accuracy of `Model-1` with
    training from scratch.


