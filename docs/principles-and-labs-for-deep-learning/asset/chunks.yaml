    # 11.3 Experiment: Implementation of WGAN-GP


    This section introduces how to build the WGAN-GP model for image generation. To
    conduct experiments, we used the large-scale CelebFaces Attributes (CelebA) dataset
    [14] to train and test the model. Fig. 11.10 shows some generated images of the
    WGAN-GP after different training iterations.


