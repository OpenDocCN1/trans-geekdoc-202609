    ## 2.2 Introduction to Kaggle


    ### 2.2.1 Kaggle platform

    Kaggle is a world-famous competition platform where companies and researchers
    can publish datasets and organize competitions to solve the challenges of data
    science. The competition is open to anyone. As shown in Fig. the Kaggle contest
    page has as many as 19 contests in progress. It is also worth noting that Kaggle
    is not only a competition website but also a community platform, allowing users
    to work, discuss, team up, or share research results with each other.


    ![](image-nqb22l1t.jpg)

    Fig. 2.10 Kaggle competition page.


    Another great thing about Kaggle is that it has a datasets area, in which datasets
    have been sorted and made available for download, as shown in Fig. Experimental
    data in this chapter is a dataset downloaded from the Kaggle website.


    ![](image-9uf2dzth.jpg)

    Fig. 2.11 Public datasets on Kaggle.


    ### 2.2.2 House sales in King County dataset

    In this section, a “House Sales in King County, USA” dataset from Kaggle is introduced
    for training and evaluating the house price-prediction model. To download the
    dataset, please access the as shown in Fig.


    ![](image-lnghvddr.jpg)

    Fig. 2.12 House sales in King County dataset.


    This dataset has 21,613 housing data, and each house sample has 21 items of information.
    The codes indicate the following meanings:

    - identification code of the house

    - date the house was sold

    - housing price (target)

    - number of bedrooms

    - number of bathrooms

    - area of the interior living space (square feet)

    - total floors

    - whether or waterfront

    - condition of the property

    - construction and design

    - rating

    - above ground level

    - below ground level

    - timing of renovation

    - ZIP code

    - latitude

    - longitude


    ## 2.3 Experiment 1: House prediction

    In this section, an `FCNN` is built and trained on the “House Sales in King County”
    dataset to predict the price. The network takes the information, such as bedrooms,
    bathrooms, floors, and so on, as the input, and then outputs the price. `MSE`
    and `Adam` are used as the loss function and optimizer, respectively. Fig. 2.13
    shows the flowchart of the source code.


    ![](image-pfty0y.jpg)

    Fig. 2.13 The flowchart of the source code.


    ### 2.3.1 Preparing dataset

    Necessary packages:

    ![](image-4g73wr.jpg)

    Converting data:

    ![](image-me0gic.jpg)

    Data type: ![](image-crzx1k.jpg) Data type: Because the date in the dataset is
    in a string type and the input of the model only accepts a numeric type, date,
    month, and day are converted into numeric values through the following code:


    ![](image-jabmewd.jpg)

    Division: Divide dataset into three sets: training data, validation data, and
    test data.

    ![](image-o3gy03.jpg)

    Normalization: The main function of normalization is to scale different data to
    the same scale. For example: “The number of bedrooms or bathrooms in the house
    is about 1 to 5, and the area of the house is about 1500 to 2500”. Because of
    the large difference in data scale, it may cause the prediction model to pay more
    attention to the data with larger values and ignore the data with smaller values.
    To solve this problem, the input data is usually scaled between 0 and 1 or between
    −1 and 1; this process is called data normalization. In this experiment, the standard
    score is used to standardize the data, which is formulated as follows:


    ![](image-why13i6t.jpg)

