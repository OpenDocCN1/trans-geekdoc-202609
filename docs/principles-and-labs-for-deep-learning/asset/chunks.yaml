    object detection methods.    12.3.1: R-CNN    Girshick et al. \[20\] proposed
    Regions with CNN features (R-CNN) in 2014, which is known as the first CNN-based
    detection model. A region proposal-based approach, R-CNN accomplishes object detection
    in two stages, as shown in Fig. In the first stage, the selective search method
    \[21\] is employed to generate about 2000 region proposals that may contain objects
    from the input image. In the second stage, the region proposals are warped into
    a fixed size, and then they are individually passed through a CNN for feature
    extraction. Finally, the extracted features of each region are sent to fully connected
    layers to classify the object and refine the boundary box. R-CNN employs a class-specific
    linear support vector machine (SVM) for object classification. If the model needs
    to predict n classes, n SVM classifiers are used.    ![](image-lx5otgmm.jpg)Fig.
    12.4 Schematic diagram of R-CNN.    Although R-CNN is superior to previous methods
    42\] in terms of performance, this method still consumes a huge amount of time
