- raw: '  3.2: Binary classification problem    3.2.1: Introduction to binary classification   
    Binary classification is one of the most common problems in machine learning.
    In its basic form, it refers to the model of predicting an input sample into one
    of two classes. The binary classification models are often utilized to infer the
    probability of an event or a certain class such as disease or not, male or female,
    win or lose, pass or fail, and so on. Fig. 3.2 shows an example of binary classification,
    where the “cat” image is passed through a network model for computing and inferring
    the probability Based on the predicted the model determines whether the input
    sample belongs to the “Cat” class or “Not Cat” class. Suppose that this means
    there is 90% confidence that the input sample belongs to the “Cat” class, and
    10% confidence that the input sample belongs to the “Not Cat” class.    ![](image-6fdj95yp.jpg)Fig.
    3.2 Example of binary classification.    ![](image-jaeomu0b.jpg)Fig. 3.3 Overview
    of binary classification model; p is the predicted probability of the network
    model.    3.2.2: Binary classification model    The binary classification models
    predict an input sample into one of two classes by modeling the probability of
    the sample; therefore, its output is only a single probability score. Fig. presents
    an overview of the binary classification model.    representation  As mentioned
    in Section the classification problem belongs to the supervised learning method,
    which requires input pairs of samples and corresponding labels for learning. However,
    most of machine learning algorithms, especially neural networks, cannot directly
    work with labeled or categorical data; they need to be converted into numbers.
    Integers can be used to encode this data, which may work for the tasks where the
    categories have a natural ordinal relationship with each other, such as the labels
    for the density of fog: “light,” “medium,” and “heavy.” If there is no a natural
    ordinal relationship between the categories, such as the labels “table” and “person,”
    this may be resulting in poor performance of the model when using an integer-encoding
    technique because of allowing the model to assume a natural ordering between categories.  One-hot
    encoding is a method of representing categorical data by using a group of bits
    containing bits 0 and 1\. If there are N classes, N groups of bits will be built,
    in which each group is represented by N-1 bits 0 and only one bit 1\. This helps
    the representation of each category to be completely independent and more expressive.
    For example, given eight classes including people, dog, cat, bird, flower, aircraft,
    car, and truck, as listed in the first column of Table If the corresponding numbers
    1, 2, 3, 4, 5, 6, 7, and 8 are used to represent these classes, as shown in the
