  trans: "\n\n# 8.1: 常见的卷积神经网络架构\n\n本章介绍了一些最具代表性的卷积神经网络（CNN）架构，包括 `LeNet`、`AlexNet`、`VGG`、`GoogLeNet`\
    \ 和 `ResNet`。这些 CNN 被广泛应用于计算机视觉领域，如图像分类、人脸识别、目标检测等。\n\n## 8.1.1: LeNet\n\nYann\
    \ 等人于 1998 年提出了用于手写字符识别的 `LeNet` [1]。`LeNet`的架构直观且简单，由三个命名为 `C1`、`C3` 和 `C5` 的卷积层、两个命名为\
    \ `S2` 和 `S4` 的下采样层以及一个命名为 `F6` 和 `Output` 的全连接层组成，如图所示\n\n- **C1**: `LeNet` 尺寸为\
    \ `32 × 32` 的输入灰度图像通过一个具有 6 个大小为 `5 × 5` 卷积的卷积层（`C1`），输出 6 个大小为 `28 × 28` 的特征图。`C1`\
    \ 有 22,304 个连接和 156 个可训练参数。\n- **S2**: `C1` 的输出被发送到一个卷积大小为 `2 × 2`、步长为 `2` 的下采样层（`S2`），之后是\
    \ sigmoid 激活函数，产生 6 个大小为 `14 × 14` 的特征图。`S2` 有 5880 个连接和 12 个可训练参数。\n- **C3**:\
    \ 一个具有 16 个大小为 `5 × 5` 卷积核的卷积层接收 `S2` 的输出作为输入，产生 16 个大小为 `28 × 28` 的特征图。`C3` 有\
    \ 156,000 个连接和 1516 个可训练参数。\n- **S4**: 下采样层与第二层（`S2`）相同。该层使用 16 个大小为 `2 × 2`、步长为\
    \ `2` 的卷积核输出 16 个大小为 `5 × 5` 的特征图。`S4` 有 2000 个连接和 32 个可训练参数。\n- **C5**: 一个具有\
    \ 120 个大小为 `5 × 5` 卷积核的卷积层，接收 `S4` 的 16 个大小为 `5 × 5` 的输出特征图作为输入，产生 120 个大小为 `1\
    \ × 1` 的特征图。`C5` 有 48,120 个可训练参数。\n- **F6**: 有 84 个神经元的全连接层，后接 sigmoid 激活。`F6`\
    \ 包含 10,164 个可训练参数。\n- **layer**: 有 10 个神经元的全连接层，每个类别对应一个神经元。\n\n![](img/image-sptduarl.jpg)\n\
    图 8.1 LeNet 的架构。\n\n## 8.1.2: AlexNet\n\n`AlexNet` [2] 是 2012 年 ImageNet 大规模视觉识别挑战（ILSVRC\
    \ 2012）的冠军。它的架构比 `LeNet` 更大更深，如图所示。具体而言，`AlexNet` 架构由八层组成，包括五层卷积层，其中第一层卷积核大小为\
    \ `11 × 11`，第二层为 `5 × 5`，其他层为 `3 × 3`，随后是三个全连接层。在每个卷积层和全连接层的输出处都采用了修正的线性单元（ReLU）激活函数，最后一个全连接层除外，它将其输出发送到\
    \ softmax 函数进行最终分类。为了获得惊人的性能，`AlexNet` 采用了 dropout 和数据增强技术以防止训练过程中的过拟合。如果说 `LeNet`\
    \ 为 CNN 铺平了道路，那么 `AlexNet` 就是驱动 CNN 热潮的关键。\n\n![](img/image-4v8gbexs.jpg)\n图 8.2\
    \ AlexNet 的架构。\n\n## 8.1.3: VGG\n\n`VGG` [3] 是 Karen 等人于 2014 年引入用于大规模图像识别的深度\
    \ CNN。`VGG` 有多个版本，如 `VGG-11`、`VGG-13`、`VGG-16` 和 `VGG-19`，每个版本之间的主要区别在于层数。`VGG-16`\
    \ 的架构由 16 个卷积层组成，如图所示\n\n![](img/image-o2d69ki1.jpg)\n图 8.3 VGG-16 的架构。\n\n与之前的\
    \ CNN 相比，`VGG` 仅由卷积核大小为 `3 × 3` 的卷积层组成，而不是 `5 × 5`、`7 × 7` 或 `9 × 9`。其主要原因是多个\
    \ `3 × 3` 卷积层的堆叠可以实现与 `5 × 5`、`7 × 7` 或 `9 × 9` 卷积层相似的感受野，同时参数数量大大减少。图 8.4 展示了两个\
    \ `3 × 3` 卷积层的堆叠和单个 `5 × 5` 卷积层。两者具有相同的输入和输出尺寸，但使用两个 `3 × 3` 卷积层只需要 18 个参数，而单个\
    \ `5 × 5` 卷积层需要 25 个参数。注意，为了计算方便，省略了通道数。\n\n![](img/image-9umrtu.jpg)\n图 8.4 多个\
    \ `3 × 3` 卷积层的堆叠与单个卷积层。\n\n## 8.1.4: GoogLeNet\n\n`GoogLeNet` [4] 是 Google 提出的的一种深度网络架构，也称为\
    \ `Inception-v1`，它获得了 2014 年 ILSVRC 冠军。`GoogLeNet` 的架构由深度为 22 层的 `Inception Blocks`\
    \ 组成，如图所示\n\n![](img/image-mauids5.jpg)\n图 8.5 GoogLeNet 的架构。\n\n`GoogLeNet` 中使用\
    \ `Inception Blocks` 的主要思想是在保持计算不变的同时增加网络的深度和宽度。原始的 inception 架构（也称为 naïve inception）所示，它包含四个并行层，包括\
    \ `1 × 1` 卷积、`3 × 3` 卷积、`5 × 5` 卷积和 `3 × 3` 最大池化。该模块的输出是通过拼接这些层形成的，并作为网络下一阶段的输入。虽然由\
    \ naïve inception 组成的网络可以获得高性能，但需要大量的参数和计算。\n\n![](img/image-61296nus.jpg)\n图\
    \ 8.6 naïve Inception Block。\n\n![](img/image-uph6kn.jpg)\n图 8.7 GoogLeNet 中的\
    \ Inception Block。\n\n`GoogLeNet` 中的 `Inception Block` 是通过将 `1 × 1` 卷积层连接到 `3\
    \ × 3` 和 `5 × 5` 卷积层以及 naïve inception 的 `3 × 3` 最大池化层而设计的。为了展示在 `Inception Block`\
    \ 中使用 `1 × 1` 卷积层的优势，让我们使用卷积层将尺寸为 `36 × 36 × 128` 的输入转换为 `36 × 36 × 64`：\n\n-\
    \ **第一方法**: 输入直接进入 `3 × 3` 卷积层以产生预期输出。卷积层的参数数为 73,728，如图所示\n\n![](img/image-zitax2i.jpg)\n\
    图 8.8 3 × 3 卷积层的可训练参数数量计算。\n\n- **第二方法**: 输入首先通过 `1 × 1` 卷积层将特征图数量减少到 16，然后将得到的特征图发送到\
    \ `3 × 3` 卷积层以获得预期输出。两个卷积层的参数数为 11,264，少于未应用 `1 × 1` 卷积层的第一种方法的 73,728，如图所示\n\n\
    ![](img/image-z6kdpzv2.jpg)\n图 8.9 1 × 1 和 3 × 3 卷积层组合架构的可训练参数数量计算。\n\n尽管 `GoogLeNet`\
    \ 的深度为 22 层，但通过使用 `Inception Blocks`，`GoogLeNet` 的参数数量仍比 8 层的 `AlexNet`少 12 倍。在\
    \ Google 提出`GoogLeNet`架构之后，引入了更多版本的 Inception 模型。以下是每个版本的总结：\n\n 也称为 `Inception-v1`:2014\
    \ 年发布，它是第一个引入 `1 × 1` 卷积来减少网络计算的多分支架构。\n- 2015 年发布，引入批归一化以加速训练并提高 CNN 性能。\n- 2016\
    \ 年发布，在构建 Inception 模块时探索 `1 × n` 和 `n × 1` 卷积。\n- 2017 年发布，使用带有残差连接的 Inception\
    \ 架构。\n- 2017 年发布，引入深度可分离卷积来构建 CNN 架构代替 Inception 模块。\n\n## 8.1.5: ResNet\n\n\
    Microsoft 于 2015 年获得当年 ILSVRC 冠军时推出了 `ResNet` [5]（残差网络）。针对 ImageNet 有五种`ResNet`架构版本，包括`ResNet-18`、`ResNet-34`、`ResNet-50`、`ResNet-101`\
    \ 和 `ResNet-152`。这里，`ResNet-x`中的`x`是对应版本`ResNet`的层数。图 8.10 展示了`ResNet-34`的架构。\n\
    \n![](img/image-o0ipvppp.jpg)\n图 8.10 ResNet-34 的架构。(A) Residual Block：两个 `3 ×\
    \ 3` 卷积层的堆叠，各层卷积核数量相等。(B) Residual Block, 1/2：两个 `3 × 3` 卷积层的堆叠，第一层的卷积核数量是第二层的一半。\n\
    \n在深度学习中，更深的神经网络能够学习更复杂的特征，并比浅层神经网络获得更好的性能。然而，退化（degradation，指神经网络准确率问题）在训练过程中会变得饱和并迅速退化，导致更大的训练误差。例如，图\
    \ 8.11 显示了 20 层神经网络和 56 层网络在 CIFAR-10 数据集上的实验结果。所示，20 层神经网络的训练和测试误差少于 56 层网络。\n\
    \n![](img/image-mokusns5.jpg)\n图 8.11 CIFAR-10 数据集上 20 层神经网络和 56 层网络的训练和测试误差。\n\
    \n为了克服退化问题，`ResNet`使用 Residual Blocks 构建深度网络。图 8.12 展示了一个典型的残差。\n\n![](img/image-zssita9o.jpg)\n\
    图 8.12 在 3 × 3 卷积层上添加快捷连接的 Residual Block。\n\n图 8.13 展示 ImageNet 上训练 ResNet 的实验结果。图\
    \ 8.13A 显示了未使用快捷连接的 18 层和 34 层网络的结果。所示，34 层网络的训练和验证误差大于 18 层网络。当添加快捷连接时，即使用`Residual\
    \ Blocks`构建网络时，`ResNet-34`的训练和验证误差少于`ResNet-18`。\n\n![](img/image-ckfepl4u.jpg)\n\
    图 8.13 ImageNet 上使用和不使用快捷连接的网络的训练和验证误差\n\n## 8.1.6: 网络架构对比\n\n图 8.14 展示了在 ImageNet\
    \ 数据集上训练的`AlexNet`、`VGG`、`GoogLeNet`和`ResNet`的结果。所示，深度为 152 层的`ResNet`架构在 ImageNet\
    \ 测试集上的 top-5 误差最少，之后是`GoogLeNet`、`VGG-19`和`AlexNet`。\n\n![](img/image-qyvruh1j.jpg)\n\
    图 8.14 ImageNet 测试集上的 top-5 误差 CNN。\n\n"
