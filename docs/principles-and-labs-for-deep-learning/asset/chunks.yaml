- raw: '  4.2: Multi-category classification    4.2.1: Introduction to multi-category
    classification    In machine learning, multi-category classification refers to
    the problem of categorizing samples into one of three or more classes. Similar
    to the binary classification models introduced in Chapter the multi-category classification
    models are also used to model the probability of classes. However, unlike the
    binary classification models, which output a single probability to infer the input
    sample into one of two classes, the multi-category classification models produce
    one probability per class, in which the sum of output probability scores should
    be equal to 1, as shown in Fig. Based on the predicted probability scores, the
