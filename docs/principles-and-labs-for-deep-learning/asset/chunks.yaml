    # 9.2: 实验：使用 Inception-v3 进行迁移学习


    本节介绍了如何使用 `Inception-v3` 网络提高在 `Dogs vs. Cats` 数据集上的图像分类性能。我们进行了两种训练场景。在第一场景中，我们通过
    `Keras Applications` 构建了名为 `Model-1` 的 `Inception-v3` 模型，并使用随机权重初始化对其从零开始训练。在第二种场景中，我们通过
    `TensorFlow Hub` 加载 `Inception-v3` 网络进行特征提取，并采用两个全连接层，构建了一个新的网络模型 `Model-2`。通过对
    `Model-2` 应用迁移学习，大部分层的权重被固定；只有新添加的两个全连接层在 `Dogs vs. Cats` 数据集上进行训练以学习新任务。实验结果显示，`Model-2`
    的准确率高于 `Model-1`。


