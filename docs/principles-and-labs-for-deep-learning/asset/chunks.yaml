  fmt: "\n# 2.1 Introduction to neural networks \n\n## 2.1.1 A brief history of neural\
    \ networks\nIn 1943, Warren McCulloch and Walter Pitts [1] introduced a computational\
    \ model based on a threshold logic algorithm, paving the way for the development\
    \ of artificial neural networks (ANNs). Inspired from McCullock and Pitts numerous\
    \ methods have been proposed for neural networks which can be categorized into\
    \ two approaches: (1) focusing on biological process and (2) focusing on application.\
    \ However, around 1980–2000, simpler models such as linear classifiers or support\
    \ vector machines (SVMs) for classification and regression analysis became more\
    \ popular.\n\nThe reason can be explained as follows. Deep networks with many\
    \ intermediate layers called hidden layers can obtain better performance than\
    \ that of shallow neural networks with few hidden layers, as shown in Fig. In\
    \ a deep network, the hidden layers extract features from input data and these\
    \ features are used on the following layers for computation. Therefore, the more\
    \ hidden layers, the more detailed features of data can be obtained. For example,\
    \ a human face recognition model takes face images as inputs, and then the first\
    \ hidden layer takes raw data from the input layer and extracts simple features\
    \ such as edges, lines, and so on. In the following hidden layers, the high-level\
    \ specific features of the input image such as nose, eyes, hair, and others can\
    \ be extracted for face recognition.\n\nUnfortunately, machine learning algorithms\
    \ like gradient-based learning methods and backpropagation [8] do not work well\
    \ for deep neural networks because of a vanishing gradient problem during the\
    \ training process. Furthermore, since deep neural networks have high computational\
    \ cost and memory footprint, they require large datasets for training and development.\n\
    \n![](image-572m94js.jpg)\nFig. 2.1 The architecture of a neural network.\n\n\
    From 2000 to today, the development of various aspects of computer technology\
    \ and machine learning algorithms has made it possible to build and train deep\
    \ neural networks, and there have been major breakthroughs.\n\n### ability\nIn\
    \ the past, central processing units (CPUs) were used to perform the calculation\
    \ of neural networks, but now graphic processing units (GPUs) and tensor processing\
    \ units (TPUs) are used because of their improved performance. In 2012, Krizhevsky\
    \ et al. used a NVIDIA GPU to train an eight-layer network called “AlexNet”. After\
    \ winning the 2012 ImageNet Large Scale Visual Recognition Challenge (ILSVRC)\
    \ competition everyone realized the amazing computing power of GPUs and the abilities\
    \ of deep neural networks.\n\n### and storage equipment\nA deep neural network\
    \ cannot be trained efficiently without sufficient training data. Because data\
    \ storage devices were expensive and had limited capacity, large datasets were\
    \ impossible 20–30 years ago. Nowadays, with the development of science and technology,\
    \ the price of storage devices has decreased, and Internet and cloud devices,\
    \ such as Kaggle and TensorFlow hub are prevalent; there are many available databases\
    \ for users to download, research, and develop. Thus the problems of lacking of\
    \ large datasets and data storage devices have been solved.\n\n### function\n\
    Sigmoid was a very popular activation function for neural networks. However, using\
    \ the sigmoid activation function in hidden layers of deep networks with random\
    \ weight initialization leads to vanishing gradients during training, which makes\
    \ the weights of the networks difficult to update, resulting in ineffective training.\
    \ In 2011, Glorot et al. [11] introduced the rectified linear unit (`ReLU`) function,\
    \ which has proved effective at improving the problem of vanishing gradients and\
    \ the learning speed of various neural networks. In 2015, parametric rectified\
    \ linear unit (`PReLU`) activation was introduced by He et al., allowing for effectively\
    \ training deeper and wider neural network.\n\n## 2.1.2 Principle of neural networks\n\
    A neural network is composed of three types of layers: input layer, hidden layer,\
    \ and output layer. Each layer in the network has many neurons for connection\
    \ and computation, as shown in Fig. The neurons of the input layer, hidden layer,\
    \ and output layer are called the input neuron, hidden neuron, and output neuron,\
    \ respectively. The input layer provides initial data from outside to the network\
    \ without any computations by hidden layers. Hidden layers are located between\
    \ the input and output layers in the neural network and are responsible for performing\
    \ computation on the input data through hidden neurons and passing the results\
    \ to the output layer. The output layer takes the results from the last hidden\
    \ layer as the input and uses its neurons to compute and produce the final result\
    \ of the network.\n\n![](image-cqh4ij36.jpg)\nFig. 2.2 Example of two-layer neural\
    \ network. Note that the number of layers of neural network is equal to the number\
    \ of hidden layers plus one, `l` represents the output of `i`-th neuron in `l`-th\
    \ layer, the biases are hidden. Except for input neurons, each neuron of the neural\
    \ network can receive one or more inputs with separate weights, and these inputs\
    \ are summed to produce an output. Normally, after summing the inputs, the resulting\
    \ sum is sent to a non-linear function, which is known as the activation function\
    \ for generating output, as shown in Fig. The common activation functions include\
    \ `ReLU`, `sigmoid`, and `tanh`, which we discuss in later chapters.\n\n![](image-zfw723.jpg)\n\
    Fig. 2.3 Illustration of a neuron of neural network. `x_i`, `w_i`, and `b_i` represent\
    \ inputs, weights, and bias of the neuron, respectively. `σ` is an activation\
    \ function. When the neural network adopts activation functions to perform nonlinear\
    \ transformation of the inputs, it can help the neural networks describe and learn\
    \ complex tasks.\n\n## 2.1.3 Training neural networks\nTraining a neural network\
    \ is the process of using training data to find the appropriate weights of the\
    \ network for creating a good mapping of inputs and outputs. As shown in Fig,\
    \ the training procedure for a neural network consists of four parts: preparing\
