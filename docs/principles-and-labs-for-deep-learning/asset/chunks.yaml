    # 10.2: Introduction to variational auto-encoder


    ## 10.2.1: Introduction to VAE

    `VAE` [4] is an advanced version of `AE` that learns a data-generating distribution,
    allowing it to take random codes or latent representations from latent distribution
    to generate output data that have similar characteristics to those of input data.
    Fig. 10.3 shows the differences between `VAE` and `AE`.


    ![](image-xvka3sht.jpg)Fig. 10.3 Differences between Auto-Encoder (AE) and Variational
    Auto-Encoder (VAE).


    Fig. 10.4 shows the operation concept of the `VAE`. As shown, the encoder receives
    input data and outputs two vectors including a vector of the mean (`μ`) and a
    vector of variance for generating latent distribution. Then, a code or latent
    representation is randomly sampled from the latent distribution to be passed through
    the decoder for generating output data.


    ![](image-egoec97d.jpg)Fig. 10.4 Conceptual diagram of Variational Auto-Encoder
    (VAE).


    As for why `VAE` has codes to be randomly sampled from the latent distributions,
    here is an intuitive example to explain. As shown in Fig. two images A and B are
    used as the inputs of the encoder. At the output of the encoder, two codes, namely
    `Code A` and `Code B` are sampled and sent to the decoder to produce `Output A`
    and `Output B`, respectively. Because there is an intersection between two distributions,
    an additional `Output C` can be produced between `Output A` and `Output B` from
    this intersection. This design makes the outputs of the `VAE` have a continuous
    relationship, such as the continuous relationship between `Output A`, `Output
    B`, and `Output C`.


    ![](image-lch4234g.jpg)Fig. 10.5 Advantages of using latent distributions in `VAE`.


    ## 10.2.2: Operation of VAE

    As introduced previously, instead of directly outputting the values for the latent
    space representation like `AE`, the encoder of a `VAE` outputs two vectors of
    the mean (`μ`) and variance for generating latent distributions. The decoder takes
    random sampled code from the latent distributions for reconstruction of the original
    input. When training the `VAE` model, the relationship of parameters in the model
    with respect to the final loss is calculated by the backpropagation algorithm.
    However, it is impossible to do this for the random sampling process because there
    is no value for computation. To overcome this problem, the `VAE` employed a reparametrization
    trick for sampling, in which an `ε` from a standard normal distribution is randomly
    sampled to combine with parameters `μ` and of latent distribution for computing
    the output code of the encoder, which is defined as as shown in Fig. Following
    this trick, `μ` and `σ` of the latent distribution can be optimized during the
    training process while still allowing to randomly sample from that distribution.
    Another more intuitive explanation for using the code is that `μ` is considered
    the code of the `AE`, this code is added a noise in the `VAE` to produce the code
    `C` and hope that `C` can still be decoded to the original input.


    ![](image-8sevqp4j.jpg)Fig. 10.6 Diagram of Variational Auto-Encoder (VAE).


    Taking a similar example as in Section the encoder of the `VAE` produces 225 sets
    of 2D vector codes, and then these sets are passed through the decoder to generate
    225 handwritten digit images, as shown in Fig. As shown, each image is a digit
    that can be easy to recognize, and each is smoothly transformed into another.


    ![](image-tutx4bc8.jpg)Fig. 10.7 Example of generated images of the Variational
    Auto-Encoder (VAE).


    ## 10.2.3: Variational auto-encoder loss function

    The training goal of the `VAE` model is to ensure the predicted output and the
    input are as similar as possible. If the data contains image samples, binary cross-entropy
    (`BCE`) loss between each pixel of the reconstructed image and input image can
    be employed for training the model. This loss is also called reconstruction loss,
    which is described as follows:


    ![](image-w1v1spzz.jpg) input image : image or reconstructed image. width of image.
    height of image. the number of image channels. amount of data in a batch.


    However, if only reconstruction loss is used for training the `VAE` model, it
    is not enough. As shown in Fig. controls the scale of noise in which is learned
    by the encoder. If the encoder learns to output as 0, noise is not added to compute
    the output code. If there is no noise in computing the code, the output code in
    the `VAE` model is similar to that of the `AE` model, which means constraints
    on the encoded representations are not added to the `VAE` model. The graph of
    is shown in Fig. where, the smaller the value of is, the closer to 0 the value
    of becomes.


    ![](image-rwsiwh0a.jpg)Fig. 10.8 The graph of `exp ( σ ² )`.


    In order to solve this problem, is employed to limit the value of If the value
    of is equal to 0, must be 0. At this time, the value of is equal to 1, so the
    problem that the encoder updates in the direction of `= 0` is solved. Fig. 10.9
    shows the graph of its formula is as follows:


    ![](image-b3otot2t.jpg)

    ![](image-rrodw5lj.jpg)Fig. 10.9 The graph of `exp(σ i²) — (1 + σ i²)`.


    In addition, L2 regularization is applied for which is formulated as follows:


    ![](image-rew2hivm.jpg)


    Finally, is established by incorporating and which is also known as Kullback–Leibler
