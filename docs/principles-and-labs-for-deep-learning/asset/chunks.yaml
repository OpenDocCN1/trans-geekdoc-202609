    \ training data. The model must learn how to use limited parameters to learn an\
    \ effective feature representation.\n- **weight regularization**: When training\
    \ a neural network model, the size of the network weights will increase. The longer\
    \ the network is trained, the larger the network weights will become. The neural\
    \ network with large weights is usually unstable because even small variation\
    \ on the inputs can lead to large changes in output This can be a sign of overfitting\
    \ training data of the neural network. To solve the overfitting problem, the core\
    \ idea of weight regularization is to limit the size of the network weights during\
    \ the training process. To penalize large weights, the first weight size is calculated,\
    \ and then the calculated result is added to the loss function when training the\
    \ model. There are two main approaches to calculate weight size: `L1 regularization`\
    \ and `L2 regularization`, also known as weight decay.\n    - `L1 regularization`:\n\
    \      ![](image-2dsobhi0.jpg)\n    - `L2 regularization`:\n      ![](image-1ww2b1mh.jpg)\n\
    \      where `λ` is a regularization parameter for controlling the penalty, `λ`\
    \ ∈ `[0, 1]`, `w` is the weights of the model, `M` is the total amount of parameters\
    \ of the model, and is `MSE` loss function.\n- **dropout technique**: The dropout\
    \ technique refers to randomly discarding neurons in the neural network to prevent\
    \ complex co-adaptions during the training process. When discarding neurons, they\
    \ are temporarily taken out of the network, and their connections with other neurons\
    \ are removed as well, as shown in Fig. The dropout technique has proved effective\
    \ in addressing the problem of overfitting and improving the performance of neural\
    \ networks in many applications such as speech recognition, image classification,\
    \ and others.\n\n![](image-hoezykub.jpg)\nFig. 2.20 Random dropout.\n\n## 2.5.2:\
