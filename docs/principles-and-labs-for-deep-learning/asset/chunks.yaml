- raw: '  2.1: Introduction to neural networks    2.1.1: A brief history of neural
    networks    In 1943, Warren McCulloch and Walter Pitts \[1\] introduced a computational
    model based on a threshold logic algorithm, paving the way for the development
    of artificial neural networks (ANNs). Inspired from McCullock and Pitts numerous
    methods have been proposed for neural networks which can be categorized into two
    approaches: (1) focusing on biological process and (2) focusing on application
    However, around 1980–2000, simpler models such as linear classifiers or support
    vector machines (SVMs) for classification and regression analysis became more
    popular. The reason can be explained as follows. Deep networks with many intermediate
    layers called hidden layers can obtain better performance than that of shallow
    neural networks with few hidden layers, as shown in Fig. In a deep network, the
    hidden layers extract features from input data and these features are used on
    the following layers for computation. Therefore, the more hidden layers, the more
    detailed features of data can be obtained. For example, a human face recognition
    model takes face images as inputs, and then the first hidden layer takes raw data
    from the input layer and extracts simple features such as edges, lines, and so
    on. In the following hidden layers, the high-level specific features of the input
    image such as nose, eyes, hair, and others can be extracted for face recognition.
    Unfortunately, machine learning algorithms like gradient-based learning methods
    and backpropagation \[8\] do not work well for deep neural networks because of
    a vanishing gradient problem during the training process. Furthermore, since deep
    neural networks have high computational cost and memory footprint, they require
    large datasets for training and development.    ![](image-572m94js.jpg)Fig. 2.1
    The architecture of a neural network.    From 2000 to today, the development of
    various aspects of computer technology and machine learning algorithms has made
    it possible to build and train deep neural networks, and there have been major
    breakthroughs.    ability    In the past, central processing units (CPUs) were
    used to perform the calculation of neural networks, but now graphic processing
    units (GPUs) and tensor processing units (TPUs) are used because of their improved
    performance. In 2012, Krizhevsky et al. used a NVIDIA GPU to train an eight-layer
    network called “AlexNet” After winning the 2012 ImageNet Large Scale Visual Recognition
    Challenge (ILSVRC) competition everyone realized the amazing computing power of
    GPUs and the abilities of deep neural networks.    and storage equipment    A
    deep neural network cannot be trained efficiently without sufficient training
    data. Because data storage devices were expensive and had limited capacity, large
    datasets were impossible 20–30 years ago. Nowadays, with the development of science
    and technology, the price of storage devices has decreased, and Internet and cloud
    devices, such as Kaggle and TensorFlow hub are prevalent; there are many available
    databases for users to download, research, and develop. Thus the problems of lacking
    of large datasets and data storage devices have been solved.    function    Sigmoid
    was a very popular activation function for neural networks. However, using the
    sigmoid activation function in hidden layers of deep networks with random weight
    initialization leads to vanishing gradients during training, which makes the weights
    of the networks difficult to update, resulting in ineffective training. In 2011,
