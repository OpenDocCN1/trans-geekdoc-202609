    # 7.1: 高级 TensorBoard


    TensorBoard 是 TensorFlow 的官方工具包，为设计神经网络和进行机器学习实验提供了所需的可视化支持。第 2 章和第 5 章介绍了四个可视化函数的使用，包括
    `Scalars`标量、`Graphs`图、`Distributions`分布和 `Histograms`直方图，只需使用 `tf.keras.callbacks.TensorBoard`
    即可完成设置。然而，高级 Keras API 中的 `tf.keras.callbacks.TensorBoard` 函数在提供神经网络训练过程中各种状态和统计信息方面存在限制。例如，在
    TensorBoard 的 `Scalars` 板中，只能观察到 `loss` 和 `accuracy` 等关键指标，以及它们随训练过程的变化情况。如果我们想观察和分析训练期间网络模型的输出结果（如图像、文本等），则需要使用自定义函数。本章介绍了如何使用
    TensorFlow 的 `tf.summary` 模块编写摘要数据并在 TensorBoard 上显示，该模块提供了以下 API：


    - 写入标量摘要，例如损失函数值、准确率值或学习率

    - 写入图像摘要

    - 写入文本摘要

    - 写入音频摘要

    - 写入直方图摘要


    下节将介绍 `tf.summary` 模块的使用。


    ![](img/image-8b16k8g4.jpg) TensorBoard 结果：通过命令行打开 TensorBoard 查看结果，如图所示。由于数据尚未写入日志文件，因此没有对应的数据仪表板激活。


    ![](img/image-trteowa7.jpg) 图 7.1 TensorBoard 接口。


    ![](img/image-nm4ubp68.jpg) 可以在此处访问 `tf.summary` 模块详情：www.tensorflow.org/versions/r2.0/api_docs/python/tf/summary


    ## 7.1.1: tf.summary.scalar


    `tf.summary.scalar` 是 `tf.summary` 模块的一个 API，用于写入标量摘要，如损失值、准确率值等。这些值可以通过 TensorBoard
    的标量仪表板显示，以便进行观察和监控。图 7.2 展示了使用高级 Keras API 中的函数 `tf.keras.callbacks.TensorBoard`
    获取的神经网络在训练期间的损失和平均绝对误差值变化。如果需要写入和监控其他标量值，建议使用 `tf.summary.scalar`。`tf.summary.scalar`
    的语法表达式如下：


    ![](img/image-rrq3swz1.jpg) 图 7.2 标量仪表板。


    ![](img/image-zmicrk88.jpg) 以下是使用 `tf.summary.scalar` API 在 TensorBoard 上写入并视化正弦函数的示例。图
    7.3 显示了结果。


    ![](img/image-25mce4gs.jpg) 图 7.3 标量仪表板上的正弦。


    ![](img/image-zeq3ovsz.jpg)


    ## 7.1.2: tf.summary.image


    `tf.summary.image` 是 `tf.summary` 模块的一个 API，用于写入图像摘要。其结果可以显示在 TensorBoard 的图像仪表板上。`tf.summary.image`
    的语法表达式如下：


    ![](img/image-8ksyertg.jpg) 下面的程序示例解释了如何使用 `tf.summary.image` API。请从下方链接下载测试图像并解压到根目录下。https://drive.google.com/open?id=1cC45twI3a5AkBYYE6Qb3ZV3uCPlw9eL6


    - 读取一个图像 (`airplane.png`)


    ![](img/image-6e0gqjlm.jpg) 将一个图像写入日志文件并在 TensorBoard 上显示，如图 7.4 所示。


    ![](img/image-cbs39de2.jpg) 图 7.4 在图像仪表板上观察由 `tf.summary.image` 写入的图像。


    ![](img/image-5vyaq39i.jpg) 将 `airplane_zoom.png`、`plane_flip.png`、`plane_color.png`、`plane_rot.png`
    和 `plane.png` 等图像同时写入日志文件并在 TensorBoard 上显示，如图 7.5 所示。


    ![](img/image-j764w2y0.jpg) 图 7.5 在图像仪表板上观察由 `tf.summary.image` 写入的多张图像。


    ![](img/image-yzetzy3y.jpg) 分步将包括 `airplane_zoom.png`、`airplane_flip.png`、`airplane_color.png`、`airplane_rot.png`
    和 `airplane.png` 在五张图像写入日志文件并在 TensorBoard 上显示，如图 7.6 所示。


    ![](img/image-efs11eup.jpg) 图 7.6 在图像仪表板上分步观察由 `tf.summary.image` 写入的图像。


    ![](img/image-vzyqm8kl.jpg)


    ## 7.1.3: tf.summary.text


    `tf.summary.text` 是 `tf.summary` 模块的一个 API，负责写入文本摘要。其结果可以通过 TensorBoard 的文本仪表板显示。`tf.summary.text`
    的语法表达式如下：


    ![](img/image-j2a2w6ik.jpg) 参数：


    - 文本摘要的名称

    - 字符串值

    - 显式的单调递增步值

    - 文本摘要的可选描述


    下面的程序示例解释了如何使用 `tf.summary.text`。将文本数据写入日志文件并在 TensorBoard 上显示，如图 7.7 所示。


    ![](img/image-e0ufd.jpg) 图 7.7 在文本仪表板上观察由 `tf.summary.text` 写入的文本。


    ![](img/image-ex5tky.jpg)


    ## 7.1.4: tf.summary.audio


    `tf.summary.audio` 是 `tf.summary` 模块的一个 API，用于写入音频摘要。其结果可以显示在 TensorBoard 的音频仪表板上。`tf.summary.audio`
    的语法表达式如下：


    ![](img/image-tn1pik.jpg) 参数：


    - 音频摘要的名称

    - 形状为 `(n, m, c)` 的张量数据，其中 `n`, `m` 和 `c` 分别表示音频数量、帧数和通道数

    - 表示采样率的整数

    - 显式的步值

    - 表示每步发射音频数量，默认值为三

    - 常量字符串，表示音频格式，如 `wav`、`mp3` 等

    - 音频摘要的可选描述


    下面的程序示例解释了如何使用 `tf.summary.audio`。请从下方链接下载测试音频并解压到根目录下：https://drive.google.com/open?id=1V4nNQ-ZQMBUezFWZo62dRevUGP


    ![](img/image-806vjkap.jpg) 将音频写入日志文件并在 TensorBoard 上显示，如图 7.8 所示。


    ![](img/image-qybymb.jpg) 图 7.8 在音频仪表板上观察由 `tf.summary.audio` 写入的音频。


    ![](img/image-v5hnpsvu.jpg)


    ## 7.1.5: tf.summary.histogram


    `tf.summary.histogram` 是 `tf.summary` 模块的一个 API，用于写入直方图摘要。其结果可以显示在 TensorBoard
    的直方图仪表板和分布仪表板上。`tf.summary.histogram` 的语法表达式如下：


    ![](img/image-ivi2al8w.jpg) 参数：


    - 直方图摘要的名称

    - 张量数据

    - 显式的单调递增步值

    - 表示桶数量的正整数

    - 音频摘要的可选描述


    图展示了使用高级 Keras API 中的函数 `tf.keras.callbacks.TensorBoard` 获取的神经网络层权重分布。


    ![](img/image-105eb6t7.jpg) 图 7.9 神经网络层的权重分布。


    由于 `tf.keras.callbacks.TensorBoard` 不支持写入层的输出分布，如果需要可视化此分布，建议使用 `tf.summary.histogram`
    API。下面的程序示例解释了如何使用 `tf.summary.histogram`。将 100 组随机值写入日志文件并在 TensorBoard 上显示，如图
