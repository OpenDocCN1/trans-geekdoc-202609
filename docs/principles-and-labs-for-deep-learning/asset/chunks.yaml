    # 12.3: Object detection methods


    Numerous object detection methods have been introduced over the past decades.
    In this section, we present some approaches based on deep CNNs. Fig. 12.3 shows
    the historical progress of object detection methods.


    ![](image-2n1dcn0e.jpg)

    Fig. 12.3 Historical progress of CNN-based object detection methods.


    ## 12.3.1: R-CNN


    Girshick et al. [20] proposed Regions with CNN features (`R-CNN`) in 2014, which
    is known as the first CNN-based detection model. A region proposal-based approach,
    `R-CNN` accomplishes object detection in two stages, as shown in Fig. In the first
    stage, the selective search method [21] is employed to generate about 2000 region
    proposals that may contain objects from the input image. In the second stage,
    the region proposals are warped into a fixed size, and then they are individually
    passed through a `CNN` for feature extraction. Finally, the extracted features
    of each region are sent to fully connected layers to classify the object and refine
    the boundary box. `R-CNN` employs a class-specific linear support vector machine
    (`SVM`) for object classification. If the model needs to predict `n` classes,
    `n` `SVM` classifiers are used.


    ![](image-lx5otgmm.jpg)

    Fig. 12.4 Schematic diagram of `R-CNN`.


    Although `R-CNN` is superior to previous methods [42] in terms of performance,
    this method still consumes a huge amount of time in training and inference because
    of classifying individually a large number of region proposals per image.


    ## 12.3.2: Fast R-CNN


    Girshick et al. [22] proposed Fast Regions with CNN features (`Fast R-CNN`) in
    2015, which is an improved version of `R-CNN`, as shown in Fig.


    ![](image-zyqq0tzy.jpg)

    Fig. 12.5 The architecture of `Fast R-CNN`.


    Based on `R-CNN`, `Fast R-CNN` incorporates three major changes to improve object
    detection performance.

    - a `CNN` to extract features from the entire image instead of each image patch
    from scratch, which helps to improve the processing time significantly.

    - a selective search method to generate `RoIs` from the input image, which are
    combined with the corresponding feature maps and sent to an `ROI pooling` layer
    to generate fixed-length feature vectors, as shown in Fig. These resulting feature
    vectors are fed into the fully connected layers for object classification and
    localization.


    ![](image-dfngzbbj.jpg)

    Fig. 12.6 `RoI pooling` in `Fast R-CNN`.

    - `SVM` with `softmax` function for classification.


    In `Fast R-CNN`, `ROI pooling` is applied to warp the various sizes of `ROIs`
    into a fixed size. For example, transforming an 8 × 8 feature map into a fixed-length
    feature with a size of 2 × 2, as shown in Fig.


    ![](image-36i9hn9q.jpg)

    Fig. 12.7 `RoI Pooling`: (A) an 8 × 8 feature map, (B) combining the `RoI` ( red
    ) with the feature map, (C) splitting `RoI` into the 2 × 2 target where the size
    of four can be equal or different, (D) taking a `max` over each section, resulting
    in a fixed-length feature map with a size of 2 × 2.


    ## 12.3.3: Faster R-CNN


    Ren, al. [23] proposed Regions with CNN features (`Faster R-CNN`) in 2015, which
    is an improved version of `Fast R-CNN`. `Faster R-CNN` adopts similar design as
    the `Fast-CNN` except it replaces the selective search method with a region proposal
    network (`RPN`) for generating region proposals on the feature map, as shown in
    Fig.


    ![](image-npiwm860.jpg)

    Fig. 12.8 Region Proposal Network (`RPN`).


    `Faster R-CNN` outperforms `R-CNN` and fast R-CNN in terms of both speed and accuracy.
    This method has two major changes to the previous version:

    - Proposal Network (`RPN`): `Faster R-CNN` employed a `CNN`, namely `ZF` or `VGG`
    to produce region proposals instead of the selective search method used in `R-CNN`
    and `Fast R-CNN`. As shown in Fig. at each sliding-window location, `RPN` simultaneously
    predicts multiple region proposals, and it outputs `4k` coordinates, and `2k`
    scores that estimate object or not for each proposal, where `k` is the number
    of anchors.


    ![](image-1s7609wj.jpg)

    Fig. 12.9 Region Proposal Network (`RPN`).


    `Anchor` is a reference box, which is related to a scale and aspect ratio. `Faster
    R-CNN` used 9 anchor boxes (3 scales and 3 aspect ratios) at each sliding position.
    Those anchors are pre-selected to cover the various size of real-life objects.


    Supplementary explanation

    `RPN` does not output bounding box (`x, y, w, h`) directly; it employs the parameterizations
    of the four coordinates as follows:


    ![](image-6c7nwh2l.jpg)(image-7nroz31h.jpg)

    where `x` and `y` represent two coordinates of the predicted center, `w` and `h`
    represent its width and height, respectively. are for the `Anchors` box, and are
    for the ground-truth box.


    ## 12.3.4: YOLO-v1


    Redmon et al. [24] proposed You Look Once (`YOLO` or `YOLO-v1`) in 2016. It is
    known as the first regression/classification-based object detection method, as
    shown in Fig. Different from the region proposal-based approach, `YOLO` directly
    inferences object classification and object localization from the entire input
    image in one evaluation through a single `CNN`. This strategy helps `YOLO` achieve
    a running time of 45 frames per second, making it a true real-time detector.


    ![](image-5cj9jhy.jpg)

    Fig. 12.10 The architecture of `YOLO`.


    For prediction, as shown in Fig. the `YOLO` model divides the input image into
    an S × S grid. If a grid cell contains the center of an object, it is accountable
    for detecting that object. There are `B` bounding boxes, and confidence scores
    of those boxes are predicted by each grid cell. Each predicted bounding box contains
    five predictions including (`x, y, w, h`) and confidence score, where `x` and
    `y` represent the coordinates of the center of the box relative to the bounds
    of the grid cell, `w` and `h` represent the width and height which are predicted
    relative to the whole image, and confidence score reflects whether there is an
    object. The greater the box confidence score is, the greater the probability that
    the bounding box predicted by the grid cell contains an object. The class probabilities
    are based on the number of predicted classes. If there are 20 classes, 20 object
    class probabilities are output.


    ![](image-uyu5np3m.jpg)

    Fig. 12.11 The prediction process of `YOLO`.


    The output size of `YOLO` model is calculated as follows:

    `Output size = S × S × (B × 5 + C)`

    - `S`: width and height of the grid.

    - `B`: number of bounding boxes predicted by each grid cell.

    - `5`: each predicted bounding box in the grid cell contains five predictions:
    `y`, `w`, and box confidence score.

    - `C`: number of conditional class probabilities; if there are 20 categories,
    20 class probabilities are output.


    For example, the settings of `YOLO` on the PASCAL VOC dataset are `S = 7`, `B
    = 2`, and `C = 20`. The output size of the `YOLO` model is a `7 × 7 × (2 × 5 +
    20) = 7 × 7 × 30` tensor.


    Supplementary explanation

    `YOLO` predicts two bounding boxes on each grid cell, so a total of `7 × 7 × 2
    = 98` object boxes are predicted. However, 98 bounding boxes are not the final
    prediction. To keep the best bounding boxes for the final answer, `YOLO` removes
    redundant bounding boxes by using the Non-Maximum Suppression (`NMS`) method,
    as shown in Fig.


    ![](image-583pkf4y.jpg)

    Fig. 12.12 Selecting the best bounding box using Non-Maximum Suppression (`NMS`).


    The `NMS` method is as follows:

    - the confidence score is too small, it means that there is no object in the predicted
    bounding box, so first remove the bounding boxes with confidence score less than
    threshold.

    - the remaining bounding boxes according to the confidence score from biggest
    to smallest and put them into “list object boxes,” denoted as `L`.

    - a bounding box with the highest confidence score from `L` and put it in “list
    of filtered object boxes,” denoted as `F`.

    - separately intersection over union (`IoU`) of the bounding box just in `F` with
    all bounding boxes in `L`. If the calculated `IoU` value is greater than `IoU`
    threshold, remove that bounding box from `L` until there is no box in `L`.


    ## 12.3.5: SSD


    Wei Liu et al. [25] proposed Single ShotBox Detector (`SSD`) in 2016. is a real-time
    `CNN`-based object detection model. The running time prediction of `SSD` is similar
    to that of `YOLO`, but the accuracy is much greater because of architecture design,
    as shown in Fig.


    ![](image-t13gav.jpg)

    Fig. 12.13 The architecture of Single ShotBox Detector (`SSD`).


    To produce detection, `SSD` has two main features. uses feature maps from six
    different levels of convolutional layers to make multiscale predictions. In an
    `SSD` model, the shallower layers are used for detecting objects, while the deeper
    layers are responsible for big object detection. Each grid cell in the feature
    map predicts multiple bounding boxes, and 8732 bounding boxes per class were predicted
    by `SSD`. The number of bounding boxes predicted by the six convolutional layers
    is calculated as:

    `Total box: 5776 + 216 + 600 + 150 + 36 + 4 = 8732`

    each predicted box, `N` class scores and four offsets relative to the box shape
    are computed. The default boxes were pre-selected manually to cover a wide range
    of object sizes in life. To cope with object prediction at different scales, `SSD`
    uses different layers with different sets of default boxes, which each feature
    map layer shares the same set of default boxes centered at the corresponding grid.


    ## 12.3.6: YOLO-v2


    Redmon et al. [26] proposed `YOLOv2`, also known as `YOLO9000`, in 2017. is an
    improved version of `YOLO` that is faster and stronger than both `YOLO` and `SSD`.
    `YOLO-v2` incorporates the following seven important changes:

    - `normalization`: `Batch normalization` is added in convolutional layers, which
    helps avoid overfitting problems during the training process and improves the
    performance about 2% mean Average Precision (`mAP`).

    - `classifier`: In `YOLO-v2`, the classifier is first trained with an input resolution
    of 224 x 224, then returns with a resolution of 480 x 480 utilizing much fewer
    epochs. This helps to increase the accuracy of the model by 4% `mAP`.

    - `anchor boxes`: `YOLO-v2` replaces the prediction of arbitrary bounding boxes
    used in `YOLO` with predicting offsets of each anchor box. Although the accuracy
    is reduced a little bit using anchor boxes, it increases the chances for the detection
    of all ground-truth objects.

    - `clusters`: To find top-K boundary boxes that are best suitable for the training
    dataset, instead of manually selecting anchors, the `K`-means clustering method
    is employed to locate the centers of the top-K clusters. For the best design,
    five anchors were selected for training the `YOLO-v2` model.

    - `location prediction`: Because `YOLO` does not apply a constraint on location
    prediction, this makes the network unstable in training, resulting in the predicted
    bounding boxes being far from the original grid location. Using the `sigmoid`
    function to constrain the output prediction of the model to fall in the range
    between 0 and 1 makes `YOLO-v2` more stable in the training process. In the output
    feature map, `YOLO-v2` predicts five bounding boxes at each grid cell; each bounding
    box has five coordinates and the corresponding prediction is defined as:

    `Pr(object) * IOU(predicted box, ground truth box) = coordinates of the center,
    width, and height of the predicted box, respectively; top left corner of the image;
    sigmoid activation function; width and height of the anchor box, respectively;
    confidence score of the predicted box`

    - `features`: Unlike `SSD`, which was run at various feature maps to obtain a
    range of resolutions, `YOLO-v2` concatenates the higher resolution features with
    the low resolution features for predicting detections. To accomplish the objective,
    a passthrough layer is employed, which which takes a 26 × 26 × 512 feature map
    as the input and outputs a 13 × 13 × 2048 feature map. Then, the generated features
    map is concatenated with the original 13 × 13 × 1024 feature map to form a 13
    × 13 × 3072 feature map. Finally, convolution filters are applied on the new 13
    × 13 × 3072 layer to make predictions, as shown in Fig. Following this method,
    the accuracy of the model improved by about 1% `mAP`.


    ![](image-4p68ml3j.jpg)

    Fig. 12.14 Using fine-grained features of `YOLO-v2`.


    Supplementary explanation

    - `reorganization layer`: Unlike `max pooling` layer, which reduces the information
    of the input, the `reorganization layer` in Fig. 14 retains the original information
    of the input after the operation, as shown in Fig.

    ![](image-abbpa0c.jpg)

    Fig. 12.15 Operation of reorganization layer.

    - `training`: During training of `YOLO-v2` model, the size of the input image
    is changed every 10 batches. By taking multiples of 32 such as 320, 352, 384,
    416, 448, 480, 512, 544, and 576, `YOLO-v2` uses the minimum input size of 320
    x 320 and maximum size of 608 x 608. This strategy helps `YOLO-v2` to overcome
    the problems of detecting objects at multiple scales while operating at real-time
    speeds.


    ## 12.3.7: Feature pyramid networks


    Lin et al. [27] introduced Feature Pyramid Networks (`FPNs`) in 2017. `FPNs` adopt
    the feature pyramid architecture with lateral connections for detecting object
    at different scales, especially objects. Using `CNN` for feature extraction, the
    deeper layers have the characteristics of low resolution and semantic features,
    while the shallow layers contain features with high resolution and weak semantic
    information. This leads to the poor performance of object detectors that use pyramidal
    hierarchy of `CNN` for detecting objects at multiple scales. To make a feature
    pyramid that contains rich semantics at all levels, in `FPN`, the higher-resolution
    layers are constructed from a semantic-rich layer through a top-down pathway.
    Because reconstructed layers have strong semantic features but lack the location
    of the objects, lateral connections between these layers and corresponding feature
    maps are added for better prediction of object location, as shown in Fig.


    ![](image-m0xb5tcb.jpg)

    Fig. 12.16 The architecture of Feature Pyramid Network (`FPN`). There are four
    main network architectures to improve the performance of object detection pyramid
    of image, single feature map, pyramid of maps, and feature pyramid network, as
    shown in Fig. The following summarizes the main characteristics of each architecture:

    - 17A shows the network architecture of pyramid of image. In this network architecture,
    features for prediction are independently computed on each of the scales. Although
    this method is effective, the running time is very slow. `YOLO` [24] is a typical
    representative of this architecture.

    - 17B shows the network architecture of single feature map, which uses a single-scale
    feature for prediction. This approach can achieve real-time prediction speed,
    the accuracy is not satisfied because struggling with small objects.

    - 17C shows the network architecture of pyramid of maps or pyramidal hierarchy.
    This architecture is used by `SSD` which employs feature maps at different scales
    to make predictions. The advantage of this method is that no additional calculations
    are required. However, using shallower layers that lack semantic information to
    predict small objects is the reason for poor performance.

    - 17D shows the architecture of FPN. Similar to the pyramidal hierarchy in Fig.
    `FPN` [27] also uses feature maps from lower pyramid levels for small object prediction
    and feature maps from higher pyramid levels for big object prediction. In `FPN`,
    high-level semantic information is spread at all scales of feature maps, and therefore
    it more effective than the networks in Fig. whereas the speed is similar.


    ![](image-js7oh5hk.jpg)

    Fig. 12.17 Four commonly used network architectures for object detection.


    ## 12.3.8: RetinaNet


    Lin et al. [28] proposed Focal Loss for Dense Object Detection (`RetinaNet`) in
    2017. For improving object detection performance, `RetinaNet` employs `ResNet`
    [35] as a backbone, adopts `FPN` architecture [27] to build a multi-scale feature
    pyramid for predict object at different scales, and adds two subnets, namely the
