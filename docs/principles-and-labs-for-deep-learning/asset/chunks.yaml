    # 6.3: 实验：使用高级 Keras API 和自定义 API 实现两个网络模型


    在本节中，我们展示了构建多类别分类神经网络的两种场景。在种场景中，我们使用 TensorFlow 的高级 Keras API 来创建网络模型，命名为 `Model-1`。在第二种场景中，我们使用
    TensorFlow 的自定义 API 构建网络模型，命名为 `Model-2`。`Model-1` 和 `Model-2` 在 CIFAR-10 数据集上分别进行训练以比较性能。图
    6.2 是构建 `Model-1` 和 `Model-2` 的源代码流程图。


    ![](img/image-fch1gsp4.jpg)

    图 6.2 使用高级 Keras API 和自定义 API 构建多类别分类模型的源代码流程图。


    ![](img/image-frmi9fyj.jpg) ![](img/image-lpabqz5i.jpg)


    `Model-1` 和 `Model-2` 具有相同的架构，如表所示。虽然 `Model-1` 是使用 TensorFlow 的高级 Keras API 构建的，但
    `Model-2` 是使用 TensorFlow 的自定义 API 构建的。


    表 6.1

    ![](img/image-9xbrvd8x.jpg) ![](img/image-aeirf9a5.jpg) ![](img/image-v9nw8gg0.jpg)
    ![](img/image-ch5hmr8v.jpg) ![](img/image-uury53sv.jpg)


    ### 补充说明


    `Model-1` 和 `Model-2` 在输出层没有使用 softmax 激活函数，因为 `Model-1` 的内置损失函数 `keras.losses.CategoricalCrossentropy()`
    的参数 `from_logits` 被设置为 `True`，而 `Model-2` 的自定义损失函数使用了 `tf.nn.softmax_cross_entropy_with_logits()`
    函数，该函数已经采用了 softmax 来计算 CCE 损失。因此，如果在此模型的输出层附加 softmax 激活函数，输出值将通过 softmax 函数计算两次。


    ![](img/image-6jiykwsb.jpg) ![](img/image-jui8snja.jpg) ![](img/image-v8l5g9m0.jpg)
    ![](img/image-0o07qz58.jpg) ![](img/image-b052isqo.jpg) ![](img/image-634qau5.jpg)


    实验结果显示，两个模型的准确率接近。这证实了使用 TensorFlow 的自定义 API 设计神经网络可以获得与使用高级 Keras API 相似的结果，同时更具活性。


    # 第 7 章：高级 TensorBoard


    ### 摘要

    TensorBoard 是 TensorFlow 的官方工具包，为设计神经网络和机器学习实验提供了所需的可视化支持。`tf.keras.callbacks.TensorBoard`
    函数在支持训练过程中神经网络的各种状态和统计信息方面存在限制。本章介绍了如何使用 TensorFlow 的 `tf.summary` 模块编写摘要数据并在
    TensorBoard 上显示，提供了许多应用程序接口（API），如 `tf.summary.scalar`、`tf.summary.image`、`tf.summary.text`、`tf.summary.audio`
    和 `tf.summary.histogram`。为了帮助读者深入使用 TensorBoard，我们展示了可视化神经网络训练结果的两种场景。在第一场景中，我们应用
    `tf.summary.image` API 来观察图像结果。在第二场景中，我们使用带有 HParams Dashboard 的超参数调优技术，为特定问题的网络模型设计识别最合适的超参数（学习率、优化器、权重初始化方法等）。


    **关键词：**

    TensorBoard；超参数调优；`tf.summary`；HParams Dashboard；可视化工具；训练结果


    ### 大纲

    - TensorBoard 以及用于写入数据（如文本、音频和图像）的底层应用程序接口（API）

    - 通过结合 `tf.summary.image` API 和自定义回调，在 TensorBoard 上输出训练过程中神经网络图像

    - TensorBoard 中的 HParams Dashboard，用于为特定问题的神经网络设计识别最合适的超参数


    '
