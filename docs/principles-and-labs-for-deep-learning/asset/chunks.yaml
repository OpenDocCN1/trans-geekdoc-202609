    ## 3.2: 二分类问题


    ### 3.2.1: 二分类简介

    二分类是机器学习中最为常见的问题之一。在基本形式上，它指的是模型将输入样本预测为两个类别中的一个。二分类模型通常用于推断事件或特定类别的概率，例如是否患病、男性或女性、胜或负、通过或失败等。图
    3.2 展示了二分类的一个示例，其中“猫”的图像通过网络模型进行计算和推断概率。根据预测结果，模型确定输入样本属于“猫”类还是“非猫”类。假设这意味着有 90%
    的概率输入样本属于“猫”类，10% 的概率输入样本属于“非猫”类。


    ![](img/image-6fdj95yp.jpg)图 3.2 二分类示例。

    ![](img/image-jaeomu0b.jpg)图 3.3 二分类模型概述；`p` 是网络模型的预测概率。


    ### 3.2.2: 二分类模型

    二分类模型通过对样本的概率进行建模，将输入样本预测为两个类别中的一个；因此，其输出只有一个概率分值。图展示了二分类模型的概述。


    #### 表示（representation）

    如前面的章节所述，分类问题属于监督学习方法，它需要输入样本对和相应的标签来进行学习。然而，大多数机器学习算法（尤其是神经网络）无法直接处理带标签或分类数据；它们需要将数据转换为数字。可以使用整数来编码这些数据，这对于类别之间具有自然顺序关系的任务是有效的，例如雾浓度浓度的标签：“轻雾”、“中等雾”和“大雾”。如果类别之间没有自然的顺序关系（例如“桌子”和“人”这两个标签），那么使用整数编码技术可能会导致模型性能不佳，因为这种方法允许模型假设类别之间存在自然的顺序关系。


    独热编码（One-hot encoding）是一种通过使用一组包含 `0` 和 `1` 的比特位来表示分类数据的方法。如果有 `N` 个类，则将构建 `N`
    组比特位，其中每组由 `N-1` 个 `0` 位比特和一个 `1` 位比特表示。这有助于每个类别的表示变得完全独立且更具表现力。例如，如表第一列所示，给定包括人、狗、猫、鸟、花、飞机、汽车和卡车在内的八个类，如果使用表第二列所示的数字
    `1`、`2`、`3`、`4`、`5`、`6`、`7` 和 `8` 来表示这些类，那么“狗”类比其他类更接近“人”类和“猫”类。这是因为在关系中 `2` 比其他数字更接近
    `1` 和 `3`。但这因为八类之间没有自然的原始关系。通过使用独热编码来表示这八个类，每个类都是独立完成的，如表第三列所示。在下一节中，将应用独热编码和整数编码技术来表示宝可梦战斗预测模型的分类数据，以探索每种技术的效果。


    表 3.1

    3.1 3.1 3.1 3.1 3.1 3.1 3.1 3.1 3.1 3.1

    模型


    在二分类问题中，网络模型负责从输入样本中学习特征，并输出一个单一概率来预测两个类别中的一个。接下来，我们将介绍训练二分类模型的网络架构和损失函数。


    #### 架构（architecture）

    由于具有强大的学习能力，神经网络已应用于二分类问题以实现高性能。如第... 章介绍，神经网络由输入层、隐藏层和输出层组成，每层都包含用于连接和计算的神经元。对于二分类模型，取决于每个问题和数据的特征，构建神经网络的超参数（例如输入层中的神经元数量、每个隐藏层的神经元数量、隐藏层的数量等）可能不同，但输出层中的神经元数量只有一个，如图所示。第
    7 章讨论了如何为特定问题（如分类）选择最优的神经网络架构。在本章第 3.3 节中，引入了一个五层神经网络来预测宝可梦战斗的结果（获胜者、败者）。


    ![](img/image-uqnew2mz.jpg)图 3.4 二分类神经网络的架构。


    #### 函数（function）

    交叉熵（CE）和均方误差（MSE）是训练机器学习模型广泛使用的损失函数。虽然 MSE 通常用于线性回归模型（见第... 章），但对于分类模型，CE 是一个首选方案。MSE
    和 CE 的公式如下：


    ![](img/image-7yrdm1ps.jpg)

    ![](img/image-v29dmx3o.jpg)

    其中 `y` 是期望输出，是模型的预测输出，`C` 是类别数量，`N` 是批处理的数据量。


    图 3.5 显示了 CE 和 MSE 的比较。所示，如果预测正确（`= 1`），则 MSE 和 CE 的损失值都将为 `0`；如果预测错误（`= 0`），MSE
    的最大值为 1，而 CE 为无穷大。由于分类是指预测一个或多个类之一的任务，而线性回归是指预测连续值的任务，分类中两个类之间的决策边界比线性回归大。如果将
    MSE 应用分类，它无法对错误分类产生足够的惩罚，导致模型训练效率低下。


    ![](img/image-h017ghw.jpg)图 3.5 交叉熵（CE）与均方误差（MSE）的区别。分类问题可以分为两类：二分类问题和多分类问题。二分类交叉熵（BCE）通常用作二分类模型的损失函数，分类交叉熵（CCE）通常用作多分类模型的损失函数。本章关注二分类问题，因此引入了
    BCE 并将其用作训练模型的损失函数。第 4 章进一步讨论了 CCE。


    BCE 是 sigmoid 激活函数和 CE 损失的结合，也称为 sigmoid 交叉熵损失，如图。


    ![](img/image-tndbvvh4.jpg)图 3.6 二分类交叉熵（BCE）。BCE 的公式为：


    ![](img/image-nf09h8jk.jpg)

    其中 `y` 是期望输出，是网络模型的预测值，`N` 是批处理的数据量，`f` 是 sigmoid 函数。


    使用 BCE 作为目标函数训练机器学习模型时，返回的损失值在 `0` 到 `1` 之间，如果模型正确预测标签，则获得较低的损失值。如图所示，在期望输出 `y`
    等于 `1` 或 `0` 的两种情况下，预测值（` `）越接近期望输出，损失值就越小。


    ![](img/image-37gceaeg.jpg)图 3.7 使用二分类交叉熵（BCE）的模型损失值与预测输出（` ））的关系。


    #### 分类（classification）

    二分类模型的输出是单一概率分值。模型通过将预测概率与阈值进行比较来确定输入样本属于第一类还是第二类，如图所示。通常，阈值被设置为 `0.5`，作为 `0`
    到 `1` 之间预测概率的默认值。如果预测概率大于阈值，则输入样本被归类为第一类；否则，分配给第二类。


    ![](img/image-ufg4naw0.jpg)图 3.8 二分类。


