- raw: "  Preface      Shih-Chia Huang; Trung-Hieu Le, Department of Electronic Engineering,\
    \ National Taipei University of Technology, Taipei, Taiwan    In 1943, Warren\
    \ McCulloch and Walter Pitts introduced a computational model based on a threshold\
    \ logic algorithm, paving the way for the development of artificial intelligence\
    \ (AI). The field of AI research was founded at the Dartmouth summer research\
    \ project on artificial intelligence in 1956\\. In the nearly 80 years of development\
    \ history, AI has experienced many ups and downs, especially the two “AI winters,”\
    \ which are known as the periods of reduced funding and interest in AI research.\
    \ After AlphaGo, a deep learning-based computer Go program developed by Google\
    \ DeepMind, defeated a professional Go player in 2015, AI has once again attracted\
    \ considerable research attention. In recent years, AI with deep learning algorithms\
    \ has been dramatically improved and successfully applied to many problems in\
    \ academia and industry. Recognizing the potential and power of deep learning,\
    \ many world-class technology companies, such as Google, Facebook, Microsoft,\
    \ Tesla, and others, have invested a lot of manpower and resources in researching\
    \ and developing their products using deep learning.  The authors of this book\
    \ deeply understand the importance and development of the field of AI. As such,\
    \ Principles and Labs for Deep Learning is meant to inspire and help more students,\
    \ engineers, and researchers to quickly enter the field of AI and begin applying\
    \ deep learning in their research projects, products, and platforms. This book\
    \ includes 12 chapters with content that balances theory and practice.    Chapter\
    \ “Introduction to TensorFlow 2”  Chapter “Neural networks”  Chapter “Binary classification\
    \ problem”  Chapter “Multi-category classification problem”  Chapter “Training\
    \ neural network”  Chapter “Advanced TensorFlow”  Chapter “Advanced TensorBoard”\
    \  Chapter “Convolutional neural network architectures”  Chapter “Transfer learning”\
    \  Chapter “Variational auto-encoder”  Chapter “Generative adversarial network”\
    \  Chapter “Object detection”    The first half of each chapter introduces and\
    \ analyzes the corresponding theories to help readers understand the core fundamentals\
    \ of deep learning. The last half of each chapter carefully designs and implements\
    \ the example programs step by step to help readers reinforce what they just learned.\
    \ The most popular open-source library, TensorFlow, is employed to implement example\
    \ programs. Lastly, each chapter has one corresponding Lab as well as instructions\
    \ for implementation to guide readers in practicing and accomplishing specific\
    \ learning outcomes. All Labs in this book can be downloaded from GitHub:  \n\n\
      Environment installation    \n\n  Abstract    Installation of the environment\
    \ is the first step in developing machine learning models. Python and TensorFlow\
    \ are widely used programming languages and toolkits for building these models.\
    \ This chapter first presents how to install Python, TensorFlow, and necessary\
    \ expansion packages on both the Windows and Ubuntu operating systems. Next, it\
    \ introduces the settings of Jupyter Notebook and PyCharm IDE for compiling the\
    \ simple and complex network models, respectively. Finally, it presents how to\
    \ download all the example programs of this book from GitHub and how to run the\
    \ code examples to help familiarize the reader with using these toolkits.    \
    \ Keywords    Python; TensorFlow; Jupyter Notebook; PyCharm; Ubuntu environment;\
    \ Window environment     Outline      of Python, TensorFlow, and expansion packages\
    \ on the Windows and Ubuntu operating systems    of Jupyter Notebook and PyCharm\
    \ IDE on Windows and Ubuntu operating system    all the example programs of this\
    \ book from GitHub, and running the code through Jupyter Notebook  \n\n  1: Python\
    \ installation    1.1: Windows environment    To install Python, first go to the\
    \ official Python website then download the Python installation file. The version\
    \ of TensorFlow requires Python3.4, Python3.5, or Python3.6, so be sure to install\
    \ any of these three versions. The following will use Python3.6.8 as an example.\
    \    the 3.6.8 installation file, as shown in Fig.    ![](image-3f2gx6me.jpg)Fig.\
    \ 1 Download the Python installation file.     Python: Install Python with default\
    \ settings, as shown in Fig.    ![](image-k4bbzfxa.jpg)Fig. 2 Installation of\
    \ Python.     1.2: Ubuntu environment    Since the Ubuntu operating system has\
    \ built-in Python, the installation of Python in this section is omitted.  "
