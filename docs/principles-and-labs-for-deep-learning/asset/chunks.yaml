    ## 2.4: Introduction to TensorBoard


    TensorBoard is a TensorFlow toolkit that provides the visualization and measurement
    needed for machine learning experimentation such as tracking loss values and the
    accuracy of the model during training, visualizing the model graph, viewing histograms,
    and so on. There are two common ways to use TensorBoard:


    (1) adding `tf.keras.callbacks.TensorBoard` function to create and store logs
    when training with `Model.fit` of Keras, and

    (2) using `tf.summary` API to log information when training with `tf.GradientTape()`
    or other methods.


    The graphic interface of the TensorBoard is shown in Fig. As shown, there are
    four main tools in TensorBoard: the Scalars dashboard, Graphs dashboard, Distributions
    dashboard, and Histograms dashboard.


    - **Scalars dashboard**: helps to track scalar values such as learning rate, loss,
    accuracy, and so on during training neural networks.

    - **Graphs dashboard**: helps to visualize the models built by TensorFlow.

    - **Distributions and Histograms dashboards**: help to display the distribution
    of the tensor. They are widely used for visualizing weights and biases of the
    TensorFlow models.


    ![](image-s0fpyffe.jpg)Fig. 2.14 The graphic interface of TensorBoard.


    ### The advantages and disadvantages of TensorBoard include:


    - The information during training the model such as changes in the loss, accuracy,
    the histograms of weights, biases, and so on, can be tracked and viewed in real
    time, without having to wait until the training is completed.

    - The information will be written to the log file many times during training the
    model. If a lot of information is recorded, training time is increased.


    When training the house price-prediction model, the TensorBoard callback function,
    namely, `keras.callbacks.TensorBoard`, has been added for creating and storing
    the log. There are two ways to open the log file. The first way is to directly
    open the log file on Jupyter Notebook, and the second way is to run TensorBoard
