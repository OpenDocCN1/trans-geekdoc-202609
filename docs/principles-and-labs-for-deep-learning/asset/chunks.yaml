    \  \n\n  Chapter 10: Variational auto-encoder    \n\n  Abstract    The Variational\
    \ Auto-Encoder (VAE) has proven successful in various domains and tasks such as\
    \ dimensionality reduction, information retrieval, and so on. In this chapter,\
    \ we first present the Auto-Encoder, which used to learn compressing the input\
    \ data and minimize errors in reconstructing them. Next, we introduce and explain\
    \ VAE, which is an advanced version of AE. Finally, we provide an example program\
    \ of building, training, and testing the VAE model on the MNIST handwritten digit\
    \ dataset for compressing and reconstructing images.     Keywords    Auto-encoder;\
    \ Variational auto-encoder; Latent presentation; AE; VAE; Encoder; Decoder    \
    \ Outline      to Auto-Encoder (AE)    to Variational Auto-Encoder (VAE)    the\
    \ VAE model for reconstructing images  \n\n  10.1: Introduction to auto-encoder\
    \    The aim of Auto-Encoder (AE) is to learn to compress data while minimizing\
    \ errors in reconstructing them. To accomplish this, an AE is composed of two\
    \ main parts: an encoder and a decoder The encoder is responsible for compressing\
    \ the input into a lower-dimensional latent space representation. The latent representation\
    \ is referred to as code, and the decoder is used to decode this code back to\
    \ the input. In training the AE model, it is hoped that the output of the decoder\
    \ and the input of the encoder are as similar as possible. For example, an MNIST\
    \ handwritten image of size 28 × 28 is compressed into a 2D vector code by the\
    \ encoder, and then the resulting code is decoded back to the original 28 × 28\
    \ image through the decoder. Fig. 10.1 presents the training schematic diagram\
    \ of the AE model.    ![](image-pw657p67.jpg)Fig. 10.1 Auto-Encoder (AE) training\
    \ schematic diagram.    However, when training the AE model, there are no constraints\
    \ on the latent representations generated by the encoder, so it cannot be ensured\
    \ that every output generated by the decoder has meaningful attributes of the\
    \ original data input. For example, 225 sets of 2D vector codes are produced by\
    \ the encoder of an AE model, in which the values of codes are linearly sampled\
    \ from − 1.5 to + 1.5. These 225 sets are sent to the decoder to generate 225\
    \ images. As observed in Fig. we cannot recognize all characters in the output\
    \ images except for images “0,” “3,” “5,” and “8” in the lower right corner. In\
    \ the next section, we introduce a Variational Auto-Encoder (VAE), which adds\
    \ constraints on the latent representations to address this problem.    ![](image-7g9y70c1.jpg)Fig.\
    \ 10.2 Example of generated images of the Auto-Encoder (AE) model. Not all generated\
    \ images can be recognized.  "
