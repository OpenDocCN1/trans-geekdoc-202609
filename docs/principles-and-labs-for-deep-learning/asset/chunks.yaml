- raw: "  7.3: Experiment 2: Hyperparameter tuning with TensorBoard HParams    There\
    \ are many issues in developing a good neural network model for a specific problem,\
    \ such as how many network layers should be used, which type of optimizer is better,\
    \ how to set a suitable learning rate value, whether to apply dropout technique\
    \ or batch normalization method, and so on. These adjustable parameters are collectively\
    \ referred to as hyperparameters and they directly affect the training results.\
    \ Therefore, an important step in developing neural network models is to choose\
    \ the best hyperparameters. The last section of this chapter introduces a hyperparameter\
    \ tuning technique using the HParams dashboard provided by TensorFlow, which can\
    \ help to identify the most suitable hyperparameters for a specific problem. This\
    \ technique is explained directly through a program example that builds 36 network\
    \ models with different combinations of hyperparameters that are trained on the\
    \ CIFAR-10 dataset for analysis and comparison of obtained results. The hyperparameters\
    \ used for building neural network models are as follows:    augmentation (IA):\
    \ Yes or No  normalization (BN): Yes or No  rate (LR): 0.001, 0.01, or 0.03  initialization\
    \ method: Random Normal, Glorot Normal, or He Normal    7.3.1: HPARAMS dashboard\
    \ on TensorBoard    TensorBoard through command line:    ![](image-c43u7j4x.jpg) \
    \ HParams dashboard: After opening the TensorBoard, click on HParams in the list\
    \ options, as shown in Fig.    ![](image-dvq5488r.jpg)Fig. 7.19 List options in\
    \ TensorBoard.     HParams dashboard    After clicking on HParams, a dashboard\
    \ is opened, as shown in Fig. The left pane of the HParams dashboard shows the\
    \ views of hyperparameters, metrics values, run status, sorting information in\
    \ the table view, and number of session groups. The main dashboard displays three\
    \ different views including the list of runs on the \"table view\", each run for\
    \ each hyperparameter and metric on the \"parallel coordinates view\", and plots\
    \ for comparison of each hyperparameter with each metric on the \"scatter plot\
    \ view\". In Fig. because there are not any data written, there is not information\
    \ displayed in the HParams dashboard.    ![](image-p3tiun90.jpg)Fig. 7.20 HParams\
    \ dashboard in TensorBoard.    7.3.2: Code examples    Fig. 7.21 is a flowchart\
    \ of the source code for building and analyzing 36 neural network models with\
    \ various hyperparameters.    hyperparameters    ![](image-pl2z167k.jpg)Fig. 7.21\
    \ Flowchart of the source code for building and analyzing 36 neural networks with\
    \ different combinations of hyperprameters.    ![](image-myq1gjx5.jpg)  ![](image-7yythgng.jpg) \
    \ After executing the program above, the TensorBoard screen has more information\
    \ of hyperparameters and metric values, as shown in Fig.    and training network\
    \ models    ![](image-n8tuez5r.jpg)Fig. 7.22 TensorBoard HParamas with hyperparameters\
    \ and metric information.    ![](image-6clsi6ok.jpg)  training data: with image\
    \ augmentation and without image augmentation    ![](image-9szkwoay.jpg)  ![](image-8fguxxey.jpg) \
