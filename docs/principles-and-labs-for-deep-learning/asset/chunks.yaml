    # 5.3 Batch normalization


    ## 5.3.1 Introduction to batch normalization


    Ioffe and Szegedy [8] proposed the batch normalization algorithm in 2015. It allows
    the use of high learning rates for speeding up training of neural networks while
    placing less emphasis on weight initialization. When training neural networks,
    the output distribution of the network layers is changed. The latter layer must
    continuously adapt to the output distribution changes of the previous layer, that
    is, each layer needs to be adjusted according to the output distribution of the
    previous layer. This makes the neural networks update the weights slowly because
    of requiring careful weight initialization and slow learning rates.


    To address this problem, the core idea of batch normalization is to perform the
    normalization for each batch of input data and output at each layer of the neural
    networks.


    As shown in Fig. the output of the network layer is evenly distributed between
    −10 and 10. After passing through the `tanh` activation function, the output distribution
    is not even; most output values are distributed near −1 and 1, thus causing the
    problem of the vanishing gradient (please refer to the derivative of `tanh` function
    in Table). In Fig. the output of the network layer is firstly normalized to the
    range of about −2 to 2, and then it is passed through the `tanh` activation function,
    resulting in more even output distribution compared to the case without normalization
    in Fig.


    ![](image-m2rj6tmd.jpg)

    Fig. 5.5 Comparison of output distribution using normalization and without using
    normalization.


    With input mini-batch data batch normalization transform is expressed through
    four steps:


    1. computing the mean of mini-batch:

    ![](image-yvtbhvm9.jpg)

    2. computing the variance of mini-batch:

    ![](image-ctuo5wc9.jpg)

    3. normalizing the value:

    ![](image-savhv3hl.jpg)

    where `ε` is a constant for numerical stability.

    4. scaling and shifting:

    ![](image-bqyg4lke.jpg)

    where `yᵤ` represents the output of batch normalization transform, and `α` and
    `β` are parameters to be learned.


    By adding the batch normalization transform to the neural networks, any activation
    can be manipulated. In the next section, we present the location of batch normalization
    in the neural network.


    The following points summarize the advantages of batch normalization:

    - speeds up the training of neural networks by using higher learning rates

    - reduces the overfitting problem in training neural networks

    - reduces the vanishing gradient and exploding gradient problems

    - eliminates the need to use the dropout technique to prevent loss of data information


    ## 5.3.2 Neural network with batch normalization


    Batch normalization has been applied successfully to neural networks to improve
    the performance of various computer vision applications such as image classification,
    image recognition, object detection image-to-image translation and so on. The
    neural networks with batch normalization are slightly different from the normal
    neural networks, in which the location of the batch normalization is between the
    convolutional layer and the activation function, as shown in Fig.


    ![](image-f82uxsol.jpg)

    Fig. 5.6 The structure of a convolution neural network with batch normalization.


    Here, we present a code example of adding batch normalization to neural networks.


    ![](image-aapsd66w.jpg)

    '
