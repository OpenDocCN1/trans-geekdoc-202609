    # 4.2 多类别分类


    ## 4.2.1 多类别分类简介


    在机器学习中，多类别分类是指将样本归类为三个或更多类别中的某一个的问题。与在该章介绍的二分类模型类似，多类别分类模型也用于对类别概率进行建模。然而，与二分类模型输出单一概率来将输入样本推断为两个类别之一不同，多类别分类模型为每个类别生成一个概率，其中输出概率分之和应等于
    1，如图所示。基于预测的概率分，模型可以确定输入样本属于哪个目标类别。例如，给定一个分类三个类别的模型，在将样本输入模型后，它输出的类别 1 的概率分数为
    0.7，类别 2 为 0.1，类别 3 为 0.2。这意味着模型认为输入样本有 70% 的置信度属于类别 1，10% 的置信度属于类别 2，20% 的概率属于类别
    3。


    ![](img/image-7ypkeye2.jpg)图 4.17 分类模型流程图。


    ## 4.2.2 多类别分类模型架构


    如在该节介绍的，最先进的多类别分类模型基于 `CNNs`，它具有特征提取器和分类器两个主要部分，如图所示。


    ![](img/image-hw39h3oy.jpg)图 4.18 基于 CNN 的多类别分类模型架构。


    ### Feature

    特征提取器由卷积层和池化层组成，用于从输入中提取特征。分类器由全连接层组成，结合来自特征提取器的提取特征来执行最终的分类决策。为了实现这一目标，最后一个全连接层后面跟着
    `softmax` 函数，用于计算每个目标类别的概率分。根据概率模型的描述，`softmax` 函数的每个输出值都在 0 到 1 之间，且所有输出值之和等于
    1。`softmax` 函数表示为：


    ![](img/image-iidzcp2i.jpg)


    例如，一个分类三个类别的模型（C = 3）在最后一层输出三个值 [3, 1, -3]，这些值通过 `softmax` 函数转换成分别为 0.88、0.12
    和 0 的概率分，如图所示。基于这些输出概率分，输入样本显然属于第一类。


    ![](img/image-xz022oeq.jpg)图 4.19 Softmax 输出计算。


    ### function

    如在前一章提到的，分类问题可以分为二分类问题和多类别分类问题。虽然二分类交叉熵（`BCE`）通常用作二分类模型的损失函数，但类别交叉熵（`CCE`）被用多类别分类模型的损失函数。`CCE`
    损失函数是 `softmax` 函数和交叉熵（`CE`）函数的组合。它也被称为 softmax loss，如图所示


    ![](img/image-y3y1q5gg.jpg)图 4.20 类别交叉熵 (CCE)。


    `CE` 的公式定义为：


    ![](img/image-5b65wyx.jpg)


    `CCE` 的公式表示为：


    ![](img/image-0ttz9pw.jpg)


    其中，$y$ 是期望输出，$\hat{y}$ 是模型的预测值，$f$ 是 `softmax` 函数，$C$ 是类别数量，$N$ 是一个批次的数据量。图 4.21
    显示了计算 `CCE` 的示例。输出层后接 `softmax` 函数的神经网络以“cat”图像作为输入，输出预测结果 [0,0,0,0,0.6,0,0,0.1,0,0.3]。期望输出
    [0,0,0,1,0,0,0,0,0] 与预测结果之间的误差使用以下公式计算：


    ![](img/image-2zxm9ppn.jpg)

    ![](img/image-wipcpnzd.jpg)

    ![](img/image-2n9pps4a.jpg)

    ![](img/image-8ma4x6rp.jpg)图 4.21 使用类别交叉熵 (CCE) 的计算示例。


    ## 4.2.3 数据增强


    在该章提到的，深度学习模型在训练过程中经常遇到过拟合问题。因此，使用了三种方法来防止这个问题：减小模型尺寸、权重正则化和丢弃（dropout）。处理过拟合问题的另一种方法是通过对可用数据应用不同的变换来增加训练数据的数量和多样性；这被称为数据增强。由于数据增强最常用于图像处理，因此也被称为图像增强。通过使用图像增强，数据量可以比原始数据增加两倍，如图所示。常见的图像变换技术包括：


    - 翻转（flipping）

    - 旋转（rotation）

    - 平移（shifting）

    - 缩放（scaling）

    - 转换（对比度、饱和度或亮度等）

    - 图像处理（高斯模糊或平均模糊等）

    - 噪声（高斯噪声或盐椒噪声等）


    ![](img/image-ozhya9sx.jpg)图 4.22 图像增强示例。


