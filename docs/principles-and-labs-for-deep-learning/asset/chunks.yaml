    allowing it to take random codes or latent representations from latent distribution
    to generate output data that have similar characteristics to those of input data.
    Fig. 10.3 shows the differences between VAE and AE.    ![](image-xvka3sht.jpg)Fig.
    10.3 Differences between Auto-Encoder (AE) and Variational Auto-Encoder (VAE).   
    Fig. 10.4 shows the operation concept of the VAE. As shown, the encoder receives
    input data and outputs two vectors including a vector of the mean (μ) and a vector
    of variance for generating latent distribution. Then, a code or latent representation
    is randomly sampled from the latent distribution to be passed through the decoder
    for generating output data.    ![](image-egoec97d.jpg)Fig. 10.4 Conceptual diagram
    of Variational Auto-Encoder (VAE).    As for why VAE has codes to be randomly
    sampled from the latent distributions, here is an intuitive example to explain.
    As shown in Fig. two images A and B are used as the inputs of the encoder. At
    the output of the encoder, two codes, namely Code A and Code B are sampled and
    sent to the decoder to produce Output A and Output B, respectively. Because there
    is an intersection between two distributions, an additional Output C can be produced
    between Output A and Output B from this intersection. This design makes the outputs
    of the VAE have a continuous relationship, such as the continuous relationship
    between Output A, Output B, and Output C.    ![](image-lch4234g.jpg)Fig. 10.5
