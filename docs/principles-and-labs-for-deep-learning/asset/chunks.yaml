  fmt: "\n# 9.1: Transfer learning\n\n## 9.1.1: Introduction to transfer learning\n\
    \nIn Chapter we explained and demonstrated that the features extracted by convolutional\
    \ layers of different depths of the network are different. In particular, the\
    \ shallower layers are mainly responsible for extracting simple features of the\
    \ input such as edges and lines, while the deeper layers are based on the extracted\
    \ features from the previous layers, so they can recognize more specific features\
    \ such as nose, eyes, ears, and so on, as shown in Fig.\n\n![](image-9fhrm9y5.jpg)\n\
    Fig. 9.1 Example of a convolutional neural network (CNN).\n\nThe learned feature\
    \ of convolutional neural networks (CNNs) can be applied to different tasks. For\
    \ example, by using the ImageNet dataset containing tens of thousands of images\
    \ to train the CNNs, a large amount of training data allows the network models\
    \ to learn very diverse features. When we have a new dataset and want to solve\
    \ a task of interest, instead of training the entire network model from scratch,\
    \ we use a trained model on a large dataset such as ImageNet, called a pre-trained\
    \ model, as an initialization or fixed feature extractor for the new task. This\
    \ training method is called transfer learning.\n\nTransfer learning is actually\
    \ very similar to our human learning method; the knowledge gained by completing\
    \ a task can also be used to solve other related tasks. The more related the tasks\
    \ are, the easier the knowledge is transferred. For example, when we know how\
    \ to ride a bicycle, it will be easier for us to learn to ride a motorcycle. According\
    \ to the experimental results of many public works using the transfer learning\
    \ method for training neural network models can help to obtain better performance\
    \ while requiring less training data and training time compared with the method\
    \ of training from scratch. Fig. 9.2 shows how training from scratch differs from\
    \ transfer learning. As shown, in training from scratch, the models are trained\
    \ separately for specific tasks and no knowledge is retained for transferring\
    \ from one model to another. In transfer learning, learning of new tasks is based\
    \ on the learned knowledge from previous tasks.\n\n![](image-zdyexk1j.jpg)\nFig.\
    \ 9.2 Diagram of training a model from scratch and training a model using transfer\
    \ learning.\n\n## 9.1.2: Transfer learning strategies\n\nThere are four transfer\
    \ learning strategies that can be applied based on the following two characteristics\
    \ of the training data:\n\n- **size of training data**: If a new dataset contains\
    \ tens of thousands of training samples, it is considered a large dataset. If\
    \ the new dataset only consists of hundreds or thousands of training samples,\
    \ it is considered a small dataset.\n- **similarity of data**: This is the similarity\
    \ between the new training data and the data used for the pre-trained model. For\
    \ example, cats and tigers are considered as similar samples, while cats and tables\
    \ are considered as different samples.\n\n### first strategy: training network\
    \ models with small dataset and similar training samples\n\nBecause a huge network\
    \ model is trained on a small dataset, the overfitting problem is prone to occur.\
    \ Thus, when applying transfer learning, the weights of the pre-trained model\
    \ must remain unchanged during training process. Since the new dataset has similarity\
    \ to the dataset used for the pre-trained model, they have similar features in\
    \ hidden layers of the network, especially in the deeper layers. Therefore, the\
    \ layers for feature extraction do not need to change. To learn a new task, it\
    \ is only required to make changes to the last layer that handles output features\
    \ of the network model. The new network model is built based on the architecture\
    \ of the pre-trained model by removing the output layer (last layer), then adding\
    \ new layers for the new task. The steps for transfer learning are as follows:\n\
    \n1. **removing the network layer**: Choose to remove the last layer of the pre-trained\
    \ model, as shown in Fig.\n![](image-n1bq5u3v.jpg)\nFig. 9.3 Removing the last\
    \ layer of the pre-trained model (1).\n2. **adding new layer**: Add one or multiple\
    \ layers to the top of the original network structure for the new task, as shown\
    \ in Fig.\n![](image-f2za689.jpg)\nFig. 9.4 Adding layers for the new task (1).\n\
    3. **training new model**: During training the network model, the weights of most\
    \ network layers are fixed; only newly added layers are trained, as shown in Fig.\n\
    ![](image-rp3q6g58.jpg)\nFig. 9.5 Freezing layers for training (1).\n\n### second\
    \ strategy: training network models with small datasets and dissimilar training\
    \ samples\n\nBecause of using a small dataset for training a network model, the\
    \ weights of the pre-trained model should be left unchanged to prevent the overfitting\
    \ problem. Since the samples of the new dataset are different from these of the\
    \ dataset used for the pre-trained model, they have similar features only in the\
    \ shallower layers, while their features in the deeper layers of the network model\
    \ are very different. To build a network model based on the architecture of the\
    \ pre-trained model for learning a new task, only the shallower layers are retained,\
    \ whereas the deeper layers should be removed, and the output layer is replaced\
    \ with a new one. The steps for transfer learning are as follows:\n\n1. **removing\
    \ the network layer**: Remove most of the deep layers of the pre-trained model\
    \ and leave only shallow layers that extract simple features such as lines and\
    \ edges, as shown in Fig.\n![](image-nm7pxwgz.jpg)\nFig. 9.6 Removing layers of\
    \ the pre-trained model.\n2. **adding new layer**: Choose to add new layers to\
    \ the top of the original network architecture for the new task, as shown in Fig.\n\
    ![](image-l9fxyhab.jpg)\nFig. 9.7 Adding layers for the new task (2).\n3. **training\
    \ new model**: During training the network model, the weights of most network\
    \ layers are fixed; only newly added layers are trained, as shown in Fig.\n![](image-fbktn87.jpg)\n\
    Fig. 9.8 Freezing layers for training (2).\n\n### third strategy: training network\
    \ models with a large dataset and similar training samples\n\nUsing a large dataset\
    \ allows us to train the entire pre-trained model or a new network model from\
    \ scratch. The following provides two training methods:\n\n**pre-trained model**:\
    \ Because the new dataset has similarity to the dataset used for the pre-trained\
    \ model, they have similar features in hidden layers of the network, especially\
    \ in the deeper layers. Therefore, the layers for feature extraction do not need\
    \ to change. To learn a new task, it is only required to make changes to the last\
    \ layer that handles the output of the network model. The new model is built based\
    \ on the architecture of the pre-trained model by replacing the last layer with\
    \ new one. Finally, because the dataset is large enough, the weights of the newly\
    \ added layers as well as some or all other layers of the new network model can\
    \ be optimized to obtain better performance. The steps for fine-tuning are as\
    \ follows:\n\n1. **removing the network layer**: Choose to remove the last layer\
    \ of the pre-trained model, as shown in Fig.\n![](image-kpbrfthr.jpg)\nFig. 9.9\
    \ Removing the last layer of the pre-trained model (2).\n2. **adding new layers**:\
    \ Choose to add one or more layers to the top of the original network architecture\
    \ for a new task, as shown in Fig.\n![](image-jysb78we.jpg)\nFig. 9.10 Adding\
    \ layer for the new task (3).\n3. **training new model**:\n   - **method**: The\
    \ weights of most network layers are fixed; only newly added layers are trained,\
    \ as shown in Fig.\n![](image-ru8kgwtj.jpg)\nFig. 9.11 Freezing layers for training\
    \ (3).\n   - **method**: Train or fine-tune through the entire network model on\
    \ the new dataset, as show in Fig.\n![](image-nyqsi5qj.jpg)\nFig. 9.12 Training\
    \ or fine-tuning the entire network model (1).\n\n**a new network model**: Because\
    \ the dataset is large enough, it allows us to create a new network model and\
    \ train this model from scratch, as shown in Fig.\n\n### fourth strategy: training\
    \ network models with large dataset and dissimilar training samples\n\n![](image-p0alxoim.jpg)\n\
    Fig. 9.13 Training the network model from scratch (1).\n\nUsing a larger dataset\
    \ for training a network model can avoid the overfitting problem. Therefore, the\
    \ entire pre-trained network model or a new network model can be trained on the\
    \ new dataset for improving performance. The following provides two training methods.\n\
    \n**pre-trained model**: Due to the difference between the new dataset and the\
    \ dataset used for the pre-trained model, their features are not similar in most\
    \ layers of the network model. However, in practice, it is still very often beneficial\
    \ to initialize with weights from a pre-trained model for training a new network\
    \ model. The steps for the training model are as follows:\n\n1. **removing the\
    \ network layer**: Choose to remove the last layer of the pre-trained model, as\
    \ shown in Fig.\n![](image-amt1k3fr.jpg)\nFig. 9.14 Removing the last layer of\
    \ the pre-trained model (3).\n2. **adding new layer**: Choose to add one or more\
    \ layers to the top of the original network architecture for a new task, as shown\
    \ in Fig.\n![](image-ffh3pu2d.jpg)\nFig. 9.15 Adding layers for the new task (4).\n\
    3. **training new model**: Train or fine-tune the entire network model on the\
    \ new larger dataset with weights initialization from the pre-trained model, as\
    \ shown in Fig.\n![](image-qw2i8hc3.jpg)\nFig. 9.16 Training or fine-tuning the\
    \ entire network model (2).\n\n**a new network model**: Because the dataset is\
    \ large enough, it allows us to create a new network model and train this model\
    \ from scratch, as shown in Fig.\n![](image-ofspn924.jpg)\nFig. 9.17 Training\
    \ the network model from scratch (2).\n"
  trans: "\n\n# 9.1: 迁移学习\n\n## 9.1.1: 迁移学习简介\n\n在这一章中，我们解释并演示了网络不同深度的卷积层所提取的特征是不同的。特别是，浅层主要负责提取输入的简单特征，如边缘和线条，而深层则基于从之前层提取的特征，因此它们可以识别出更具体的特征，如鼻子、眼睛、耳朵等，如图\
    \ 9.1 所示。\n\n![](img/image-9fhrm9y5.jpg)\n图 9.1 卷积神经网络 (CNN) 示例。\n\n卷积神经网络 (CNN)学习到的特征可以应用于不同的任务。例如，通过使用包含数万张图像的\
    \ ImageNet 数据集来训练 CNN，大量的训练数据允许网络模型学习到非常多样化的特征。当我们有一个新数据集并想要解决某个感兴趣的任务时，不需要从零开始训练整个网络模型，而是使用在如\
    \ ImageNet 等大型数据集上训练好的模型（称为预训练模型），作为新任务的初始化方法或固定特征提取器。这种训练方法被称为迁移学习。\n\n迁移学习实际上与人类的学习方法非常相似；通过完成某任务获得的知识也可以用于解决其他相关任务。任务之间越相关，知识就越容易迁移。例如，当我们知道如何骑自行车时，学习骑摩托车就会更容易。根据许多使用迁移学习方法训练神经网络模型的公开工作结果，与从零训练的方法相比，该方法可以在需要较训练数据和训练时间的情况下，帮助获得更好的性能。图\
    \ 9.2 显示了从零训练与迁移学习的区别。如图所示，在从零训练中，模型是针对特定任务分别训练的，没有保留任何知识从一个模型迁移到另一个模型。在迁移学习中，新任务的学习基于从之前任务中学到的知识。\n\
    \n![](img/image-zdyexk1j.jpg)\n图 9.2 从零开始训练模型和使用迁移学习训练模型的对比示意图。\n\n## 9.1.2: 迁移学习策略\n\
    \n根据训练数据的以下两个特征，可以应用四种迁移学习策略：\n\n- **训练数据的大小**：如果新数据集包含数万个训练样本，则被认为是大型数据集。如果新数据集仅由数百或数千个训练样本，则被认为是小数据集。\n\
    - **数据的相似性**：这是新训练数据与用于预训练模型的数据之间的相似性。例如，猫和老虎被认为是相似样本，而猫和桌子被认为是不同的样本。\n\n### 第一种策略：使用小数据集和相似训练样本训练网络模型\n\
    \n由于在小数据集上训练了庞大的网络模型，很容易发生过拟合问题。因此，在应用迁移学习时，预训练模型的权重在训练过程中必须保持不变。由于新数据集与用于预训练模型的数据具有相似性，它们在网络的隐藏层中具有相似的特征，尤其是在深层。因此，特征提取层不需要更改。为了学习新任务，只需要对处理网络模型输出特征的最后一层进行修改。新的网络模型是基于预训练模型的架构构建的，移除输出层（最后一层），然后为新任务添加新层。迁移学习的步骤如下：\n\
    \n1. **移除网络层**：选择移除预训练模型的最后一层，如图所示。\n![](img/image-n1bq5u3v.jpg)\n图 9.3 移除预训练模型的最后一层\
    \ (1)。\n2. **添加新层**：在原始网络结构上方添加一个或多个层以用于新任务，如图所示。\n![](img/image-f2za689.jpg)\n\
    图 9.4 为新任务添加层 (1)。\n3. **训练新模型**：在训练网络期间，大多数网络层的权重固定，只训练新添加的层，如图所示。\n![](img/image-rp3qg58.jpg)\n\
    图 9.5 冻结层 (1)。\n\n### 第二种策略：使用小数据集和不同训练样本训练网络模型\n\n由于使用小数据集训练网络模型，预训练模型的权重应保持不变以防止过拟合。由于新数据集的样本与用于预训练模型的数据不同，它们仅在浅层具有相似的特征，而网络深层的特征非常不同。为了基于预训练模型架构构建网络模型以学习新任务，仅保留浅层，而应移除深层并用新的替换输出层。迁移学习的步骤如下：\n\
    \n1. **移除网络层**：移除预训练模型的深层，只留下提取线条和边缘等简单特征的浅层，如图所示。\n![](img/image-nm7pxgz.jpg)\n\
    图 9.6 移除预训练模型的层。\n2. **添加新层**：在原始网络架构上方添加新层以用于新任务，如图所示。\n![](img/image-l9fxyhab.jpg)\n\
    图 9.7 为新任务添加层 (2)。\n3. **训练新模型**：在训练网络期间，大多数网络层的权重固定，只训练新添加的层，如图所示。\n![](img/image-fbktn87.jpg)\n\
    图 9.8 冻结层 (2)。\n\n### 第三种策略：使用大型数据集和相似训练样本训练网络模型\n\n使用大型数据集允许我们从零训练整个预训练模型或新的网络模型。以下提供了两种训练方法：\n\
    \n**预训练模型**：由于新数据集与用于预训练模型的数据相似，它们在网络的隐藏层中具有相似的特征，尤其是在深层。因此，特征提取层不需要更改。为了学习新任务，只需要对处理网络输出的最后一层进行修改。新模型是通过将最后一层替换为新的构建的。最后，由于数据集足够大，可以优化新添加层或其他所有层。微调的步骤如下：\n\
    \n1. **移除网络层**：选择移除预训练模型的最后一层，如图所示。\n![](img/image-kpbrfthr.jpg)\n图 9.9 移除预训练模型的最后一层\
    \ (2)。\n2. **添加新层**：在原始网络架构上方添加一个或多个层以用于新任务，如图所示。\n![](img/image-jysb78we.jpg)\n\
    图 9.10 为新任务添加层 (3)。\n3. **训练新模型**：\n   - **方法**：大多数网络层的权重固定，只训练新添加的层，如图所示。\n![](img/image-ru8kgwtj.jpg)\n\
    图 9.11 冻结层 (3)。\n   - **方法**：在新数据集上训练或微调整个网络模型，如图所示。\n![](img/image-nyqsi5qj.jpg)\n\
    图 9.12 训练或微调整个网络模型 (1)。\n\n**新网络模型**：由于数据集足够大，允许我们创建一个新的网络模型并从零训练，如图所示。\n\n###\
    \ 第四种策略：使用大型数据集和不同训练样本训练网络模型\n\n![](img/image-p0alxoim.jpg)\n图 9.13 从零训练网络模型 (1)。\n\
    \n使用更大的数据集训练网络模型可以避免过拟合问题。因此，可以在新数据集上训练整个预训练网络模型或新的网络模型提高性能。以下提供了两种训练方法。\n\n**预训练模型**：由于新数据集与用于预训练模型的数据之间存在差异，它们在模型的大多数层中特征并不相似。但在实践中，使用预训练模型的权重初始化来训练新的网络模型通常是有益的。训练模型的步骤如下：\n\
    \n1. **移除网络层**：选择移除预训练模型的最后一层，如图所示。\n![](img/image-amt1k3fr.jpg)\n图 9.14 移除预训练模型的最后一层\
    \ (3)。\n2. **添加新层**：在原始网络架构上方添加一个或多个层以用于新任务，如图所示。\n![](img/image-ffh3pu2d.jpg)\n\
    图 9.15 为新任务添加层 (4)。\n3. **训练新模型**：在新更大的数据集上使用来自预训练模型的权重初始化训练或微调整个网络模型，如图所示。\n\
    ![](img/image-qw2i8hc3.jpg)\n图 9.16 训练或微调整个网络模型 (2)。\n\n**新网络模型**：由于数据集足够大，允许我们创建一个新的网络模型并从零训练，如图所示。\n\
