    # 4.3: 实验：CIFAR-10 图像分类


    在本节中，我们使用 `CIFAR-10` 数据集来训练和评估多类别分类模型的性能。在训练过程中，我们分别使用 `CCE` 和 `Adam` 作为损失函数和优化器。网络模型在三种场景下实现：

    * 全连接神经网络 (`FCNN`)

    * 未应用图像数据增强技术进行模型训练的 CNN

    * 运用了图像数据增强技术以增加训练数据量和多样性的 CNN


    ## 4.3.1: CIFAR-10 数据集介绍


    `CIFAR-10` 数据集 `[14]` 包含 60,000 张尺寸为 `32 × 32` 的 RGB 图像，其中 50,000 张用于训练，10,000
    张用于测试。`CIFAR-10` 包含 10 类：飞机、汽车、鸟、猫、鹿、狗、青蛙、马、船和卡车，如图所示。该数据集可以在官方网站下载：


    ![](img/image-ipewgw1w.jpg)图 4.23 `CIFAR-10` 数据集。


    ## 4.3.2: TensorFlow datasets


    数据集在深度学习中起着至关重要的作用，但不同的来源格式和复杂性使得将其加载到深度学习模型变得困难。为了解决这个问题，`TensorFlow` 提供了一系列即用的公共数据集，称为
    `TensorFlow Datasets`。在 `TensorFlow Datasets` 中，所有数据集都以 `tf.data.Datasets` 的形式提供，支持易于使用和高度优化的输入流水线。这里我们展示了一个使用
    `tf.data.Datasets` 加载数据的示例。


    ![](img/image-el1lw864.jpg) 有超过 60 个图像分类数据集。`TensorFlow Datasets` 上还提供了对象检测、问答、摘要等多个领域的数据集。请访问
    `www.tensorflow.org/datasets/` 了解更多详情。在下一节中，我们将通过 `tf.data.Datasets` API 从 `TensorFlow
    Datasets` 加载 `CIFAR10` 数据集，用于训练和测试多类别分类模型。


