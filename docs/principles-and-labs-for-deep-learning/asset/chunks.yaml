    \ `tf.data` 加载数据。\n\n## 1.6.2: `tf.data` 基本函数\n\n本节提供了一些使用 `tf.data` API 的示例程序，用于创建数据、设置属性、检索数据等。注意需要顺序执行代码的每一行。\n\
