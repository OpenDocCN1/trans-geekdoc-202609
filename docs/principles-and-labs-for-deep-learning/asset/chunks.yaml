- raw: "  4: Jupyter notebook    Jupyter Notebook is a web-based interactive application\
    \ that supports creating and sharing documents containing live code, narrative\
    \ text, and visualizations. The name “Jupyter” is derived from the three core\
    \ programming languages including Julia, Python, and R. Through Jupyter Notebook,\
    \ a lot of kernels that allow programming in more than forty languages can be\
    \ connected. The IPython kernel, which allows writing source code in Python, is\
    \ set as the default in Jupyter Notebook. The installation of the Jupyter Notebook\
    \ on Windows and Ubuntu operating systems is introduced below.    4.1: Jupyter\
    \ notebook installation    environment    Jupyter Notebook: Please run the following.\
    \     ![](image-xan93txt.jpg)  the virtual environment to Jupyter Notebook: tf2\
    \ in the command line below represents the name of the virtual environment.   \
