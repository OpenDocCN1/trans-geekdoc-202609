    # Chapter 4: Multi-category classification problem


    ### Abstract

    A convolutional neural network, also known as `CNN` or `ConvNet`, is a class of
    deep neural network that has been successfully applied to various computer vision
    applications, especially for analyzing visual images. In this chapter, we first
    present the structure and operation of `CNN` to explain how it works. Next, we
    discuss multi-category classification, which refers to the problem of categorizing
    samples into one of three or more classes. Then, we build a `CNN`-based multi-category
    classification model to help readers improve their skills in working with `CNN`
    for solving the multi-category classification problem. Finally, we present and
    apply a data augmentation technique to prevent overfitting problem during training
    process and improve the performance of the `CNN`-based classification model.


    ### Keywords

    Convolutional neural network; `TensorFlow` datasets; Multi-category classification;
    Image classification; Data augmentation


    ### Outline

    - introduction to convolutional neural networks (`CNNs`)

    - categorical cross-entropy

    - data augmentation techniques to increase the training data

    - multi-category classification on the CIFAR-10 dataset using a `CNN`

    '
  trans: '


    # 第 4 章：多分类问题


    ### 摘要

    卷积神经网络（也称为 `CNN` 或 `ConvNet`）是一种深度神经网络，它已成功应用于多种计算机视觉领域，特别是用于视觉图像的分析。在本章中，我们首先介绍了
    `CNN` 的结构和操作机制，以解释其工作原理。接下来，我们将讨论多分类问题，这指的是将样本归类为三个或更多类别中的一个的问题。然后，我们将构建一个基于 `CNN`
    的多分类模型，以帮助读者提高使用 `CNN` 解决多分类问题的技能。最后，我们介绍并应用了一种数据增强技术，以防止训练过程中的过拟合问题，并提高基于 `CNN`
    的分类模型的性能。


    ### 关键词

    卷积神经网络；`TensorFlow` 数据集；多分类；图像分类；数据增强


    ### 大纲

    - 卷积神经网络 (`CNNs`) 简介

    - 分类交叉熵

    - 增加训练数据的数据增强技术

    - 使用 `CNN` 在 CIFAR-10 数据集上进行多分类

    '
