- raw: '  8.1: Popular convolutional neural network architectures    This chapter
    introduces some of the most representative architectures of convolutional neural
    networks (CNNs), including LeNet AlexNet VGG GoogLeNet and ResNet These CNNs have
    been widely applied to many computer vision applications such as image classification,
    face recognition, object detection, and so on.    8.1.1: LeNet    Yann et al.
    proposed the LeNet \[1\] in 1998 for handwritten character recognition. The architecture
    of LeNet is straightforward and simple, consisting of three convolutional layers
    named C1, C3, and C5, two subsampling layers named S2 and S4, and one fully connected
    layer named F6 and Output, as shown in Fig.    C1: The input grayscale image of
    LeNet with size of 32 × 32 is passed through a convolutional layer (C1) with six
    kernels having size of 5 × 5 to output six feature maps of size 28 × 28. C1 has
    22,304 connections and 156 trainable parameters.  S2: The output of C1 is sent
    to a subsampling layer (S2) with a kernel size of 2 × 2 and stride of 2, followed
    by a sigmoid activation function, resulting in six feature maps with a size of
    14 × 14. S2 has 5880 connections and 12 trainable parameters.  C3: A convolutional
    layer with 16 kernels having a size of 5 × 5 receives the output of S2 as input
    and results in 16 feature maps of size 28 × 28. C3 has 156,000 connections and
    1516 trainable parameters.  S4: A subsampling layer is the same as the second
    layer (S2). This layer uses 16 kernels of size 2 × 2 and a stride of 2 to output
    16 feature maps of size 5 × 5. S4 has 2000 connections and 32 trainable parameters.  C5:
    A convolutional layer with 120 kernels of size 5 × 5 that receives 16 output feature
    maps with a size 5 × 5 of S4 as the input and produces 120 feature maps with size
    of 1 × 1. C5 has 48,120 trainable parameters.  F6: A fully connected layer with
    84 neurons followed by sigmoid activation. F6 contains 10,164 trainable parameters.  layer:
    A fully connected layer with 10 neurons, one neuron for each class.    ![](image-sptduarl.jpg)Fig.
    8.1 The architecture of LeNet.    8.1.2: AlexNet    AlexNet \[2\] was the winner
    of the 2012 ImageNet Large Scale Visual Recognition Challenge (ILSVRC 2012). It
    has an architecture that is larger and deeper than that of LeNet as shown in Fig.
    Specifically, AlexNet architecture is composed of eight layers including five
    convolutional layers with kernels of size 11 × 11 for the first layer, 5 × 5 for
    the second layer, and 3 × 3 for the other layers, followed by three fully connected
    layers. The rectified linear unit (ReLU) activation function is adopted at the
    output of every convolutional layer and fully connected layer, except for the
    last fully connected layer, which sends its output to the softmax function for
    final classification. To achieve impressive performance, AlexNet employed dropout
    and data-augmentation techniques to prevent overfitting during the training process.
    If LeNet paved the way for CNNs, then AlexNet is important for driving the CNN
    boom.    ![](image-4v8gbexs.jpg)Fig. 8.2 The architecture of AlexNet.    8.1.3:
    VGG    VGG \[3\] is a deep CNN for large-scale image recognition introduced by
    Karen et al. in 2014\. VGG has many versions such as VGG-11, VGG-13, VGG-16, and
    VGG-19, and the main difference between each version is the number of layers.
    The architecture of VGG-16 consists of 16 convolutional layers, as shown in Fig.   
    ![](image-o2d69ki1.jpg)Fig. 8.3 The architecture of VGG-16.    In contrast to
    previous CNNs, VGG is only composed of convolutional layers with kernels of size
    3 × 3 instead of 5 × 5, 7 × 7, or 9 × 9. The main reason for this is that a stack
    of multiple 3 × 3 convolutional layers can achieve a similar perception field
    of view as using a 5 × 5, 7 × 7, or 9 × 9 convolutional layer, while the number
    of parameters is greatly reduced. Fig. 8.4 shows a stack of two 3 × 3 convolutional
    layers, and a single 5 × 5 convolutional layer. Both have the same input size
    and output size, but using two 3 × 3 convolutional layers, only 18 parameters
    are required, whereas a single 5 × 5 convolutional layer would require 25 parameters.
    Note that the channel was omitted for simple computation.    ![](image-9umudrtu.jpg)Fig.
    8.4 A stack of multiple convolutional layers and a single convolutional layer.   
    8.1.4: GoogLeNet    GoogLeNet \[4\] is a deep network architecture proposed by
    Google, also known as Inception-v1, which won the 2014 ILSVRC. The architecture
    of GoogLeNet is composed of nine Inception Blocks with a depth of 22 layers with
    parameters, as shown in Fig.    ![](image-mauid8s5.jpg)Fig. 8.5 The architecture
    of GoogLeNet.    The main idea of using Inception Blocks in GoogLeNet is to increase
    the depth and width of the network while keeping the computation constant. The
    original inception architecture, also known as naïve Inception architecture, is
    shown in Fig. It contains four parallel layers including 1 × 1 convolution, 3 × 3
    convolution, 5 × 5 convolution, and 3 × 3 max pooling layers. The single output
    of this module is formed by concatenating all those layers, and it is used as
    the input of the next stage in the network model. Although the network composed
    of naïve Inception Blocks can obtain high performance, it requires a lot of parameters
    and computation.    ![](image-61296nus.jpg)Fig. 8.6 The naïve Inception Block.   
    ![](image-uph6knqa.jpg)Fig. 8.7 Inception Block in GoogLeNet.    The Inception
    Block in GoogLeNet is designed by connecting the 1 × 1 convolutional layer to
    3 × 3 and 5 × 5 convolutional layers, and the 3 × 3 max pooling layer of the naïve
    Inception version, as shown in Fig. To show the benefit of using 1 × 1 convolutional
    layers in the Inception Block, let us use the example of computing the number
    of parameters when using convolutional layers to convert an input with a size
    of 36 × 36 × 128 to 36 × 36 × 64.    first method: The input is directly fed into
    a 3 × 3 convolutional layer to generate the expected output. The number of parameters
    in the convolutional layer is 73,728, as shown in Fig.    ![](image-zitaxh2i.jpg)Fig.
    8.8 Computation of the number of learnable parameters in a 3 × 3 convolutional
    layer.    second method: The input is first passed through a 1 × 1 convolutional
    layer to reduce the number of feature maps to 16, then the resulting feature maps
    are sent to a 3 × 3 convolutional layer to achieve the expected output. The number
    of parameters of two convolutional layers is 11,264, which is less than the 73,728
    parameters in the first method without applying the 1 × 1 convolutional layer,
    as shown in Fig.    ![](image-z6kdpzv2.jpg)Fig. 8.9 Computation of the number
    of learnable parameters in a combined architecture of 1 × 1 and 3 × 3 convolutional
    layers.     Although the depth of GoogLeNet is 22 layers, by using Inception Blocks
    the number of parameters of GoogLeNet is still 12 times less than that of AlexNet
    with 8 layers.  After Google proposed the GoogLeNet architecture, many more versions
    of the Inception models were introduced. The following is a summary of each version:   
    also known as Inception-v1 Published in 2014, it is the first multi-branch architecture
    that introduced 1 × 1 convolution to reduce the amount of network computation  Published
    in 2015, introducing batch normalization for speeding up the training and improving
    the performance of CNNs  Published in 2016, exploring 1 × n and n × 1 convolutions
    in constructing the Inception module  Published in 2017, using Inception architecture
    with residual connections  Published in 2017, introducing depthwise separable
    convolution for building CNN architecture instead of Inception modules    8.1.5:
    ResNet    Microsoft introduced ResNet \[5\] (Residual Nets) in 2015, when it won
    that year''s ILSVRC. There are five versions of ResNet architecture for ImageNet,
    including ResNet-18, ResNet-34, ResNet-50, ResNet-101, and ResNet-152. Here, the
    x in ResNet-x is the number of layers of the corresponding version of ResNet.
    Fig. 8.10 shows the architecture of ResNet-34.    ![](image-o0ipvppp.jpg)Fig.
    8.10 The architecture of ResNet-34. (A) Residual Block: a stack of two 3 × 3 convolutional
    layers, where the number of kernels of layers is equal. (B) Residual Block, 1/2:
    a stack of two 3 × 3 convolutional layers, where the number of kernels of the
    first layer is one a half that of the second layer.    In deep learning, the deeper
    neural networks are able to learn more complex features and achieve better performance
    than that of the shallower neural networks. However, degradation, which refers
    to a problem of the accuracy of the neural network, becomes saturated and then
    degrades quickly during the training process, leading to greater training error
    For example, Fig. 8.11 shows the experimental results of two CNNs including a
    20-layer neural network and a 56-layer neural network on the CIFAR-10 dataset.
    As shown, the 20-layer neural network has fewer training and test errors than
    the 56-layer network.    ![](image-mokusns5.jpg)Fig. 8.11 Training and test errors
    of 20-layer neural network and 56-layer neural network on the CIFAR-10 dataset   
    To overcome the degradation problem, ResNet uses Residual Blocks for building
    a deep neural network. Fig. 8.12 shows a typical Residual.    ![](image-zssita9o.jpg)Fig.
    8.12 Residual Block, adding a shortcut connection to a pair of 3 × 3 convolutional
    layer.    Fig. 8.13 presents the experimental result of training ResNet on the
    ImageNet dataset. Fig. 8.13A shows the results of an 18-layer network and 34-layer
    network without using shortcut connections. As shown, the training and validation
    errors of the 34-layer network are greater than those of the 18-layer network.
    When adding shortcut connections, that is, using Residual Blocks to construct
    networks, the training and validation errors of the 34-layer network or ResNet-34
    are fewer than those of the 18-layer network or ResNet-18, as shown in Fig.   
    ![](image-ckfepl4u.jpg)Fig. 8.13 Training and validation errors of the neural
    networks with and without using shortcut connections on ImageNet    After Microsoft
    proposed the ResNet architecture, many more improved Residual Blocks were introduced.
    The following is a summary of each:    Published in 2017, introducing a block
    of ResNex with a new dimension called “cardinality” in addition to the depth and
    width dimensions for building an image classification network model  Published
    in 2017, introducing a “Squeeze-and-Excitation” (SE) block being able to perform
    dynamic channel-wise feature recalibration for improving the representational
    capacity of the neural network  Published in 2019, proposing a dynamic selection
    mechanism for automatically choosing the size of the receptive field in the neural   
    8.1.6: Comparison of network architectures    Fig. 8.14 presents the results of
    AlexNet, VGG, GoogleNet, and ResNet trained on the ImageNet dataset. As shown,
    ResNet, the deepest network architecture with 152 layers, achieved the least top-5
    errors on the ImageNet test set, followed by GoogLeNet, VGG-19, and AlexNet.   
    ![](image-qyvruh1j.jpg)Fig. 8.14 Top-5 error CNNs on ImageNet test set.  '
