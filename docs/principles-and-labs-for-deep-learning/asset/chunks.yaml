    # 6.1: Advanced TensorFlow


    The previous chapters introduced how to use the `tf.keras` API to build and train
    neural network models for linear regression, binary classification, and multi-category
    classification via the following steps:

    - the input of the network model: `tf.keras.Input()`

    - the layers of the network: `tf.keras.layers()`

    - the network model: `tf.keras.Model()`

    - the optimizer, loss function, and metric function: `model.compile()`

    - network model: `model.fit()`


    Although the high-level Keras API of TensorFlow makes it is very very easy to
    build and train neural network models, it still has limitations. For example,
    not all loss functions for all problems are included in the high-level API, so
    these loss functions are not available to use for training new network models.
    In this section, we demonstrate advanced TensorFlow techniques to show how to
    customize the API for the following specific purposes:

    - network layer: how to create a new network layer

    - loss function: how to create a new loss function

    - metric function: how to create a new metric function

    - callback function: how to create a new callback function


    ## 6.1.1: Custom network layer


    The types of network layers provided by TensorFlow are quite diverse and include:

    - layers: `Conv1D`, `Conv2D`, `Conv3D`, `SeparableConv2D`, `DepthwiseConv2D`,
    `Conv2DTranspose`, and so on

    - layers: `MaxPooling1D`, `MaxPooling2D`, `AveragePooling2D`, `GlobalMaxPooling2D`,
    and so on

    - layers: `Add`, `Subtract`, `Multiply`, `Concatenate`, `Maximum`, and so on

    - layers: Rectified linear unit (`ReLU`), `LeakyReLU`, `PReLU`, and so on

    - layers: `RNN`, `GRU`, `LSTM`, `ConvLSTM2D`, and so on

    - normalization, dropout, and so on


    If a type of network layer is not defined in TensorFlow, a new custom one can
    be created by inheriting the class `tf.keras.layers.Layer`. The following is a
    template for creating a custom layer.


    ![](image-hkwj4hfi.jpg)


    The official TensorFlow document for Keras layers API is provided at `www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/layers`


    ## 6.1.2: Custom loss function


    There are many loss functions to choose from when designing neural network models
    for various problems such as classification, recognition, regression, and so on.
    The loss functions provided by TensorFlow are not sufficient to deal with all
    problems. Therefore, if a loss function is not available in TensorFlow for addressing
    a specific problem, it is necessary to define a new one. The following is a template
    for creating a custom loss function.


    ![](image-0ud0j59g.jpg)


    The official loss functions provided by TensorFlow can be accessed at `www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/losses`


    ## 6.1.3: Custom metric function


    The metric function is used to evaluate the quality of neural network models,
    and each metric for each task is different. For example, the intersection-over-union
    (`IoU`) metric is employed for semantic segmentation models, the mean average
    precision (`mAP`) metric is used for object detection models, and the peak signal-to-noise
    ratio (`PSNR`) and structural similarity index (`SSIM`) metrics are used for image
    enhancement models such as haze removal model, fog removal model, and so on. If
    a metric function is not available in TensorFlow, it can be created by inheriting
    the class `tf.keras.metrics.Metric`. The following is a template for creating
    a custom metric function.


    ![](image-f506ehqa.jpg)


    The official metric functions provided by TensorFlow can be accessed at `www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/metrics`


    ## 6.1.4: Custom callback function


    A callback is a powerful tool to perform actions at various stages of training
    neural network models. For example, using callbacks can help to monitor losses
    and metrics through writing TensorBoard logs after every epoch of training, prevent
    overfitting by doing early stopping, save the best model weights, and so on. The
    common callbacks available in TensorFlow are:

    - Monitor values and store the best model weights

    - If the monitored values of the model are too long without improvement, the training
    will be terminated early

    - If the monitored values of the model are too long without improvement, the learning
    rate will be reduced

    - Record weights, graph, and so on, of the model during the training process


    If a callback is not provided by TensorFlow, one can be created by inheriting
    the class `tf.keras.callbacks.Callback`. The following is a template for creating
    a custom callback.


    ![](image-oenbcv06.jpg)

    ![](image-9ep47c6b.jpg)


    The official callback functions provided by TensorFlow can be accessed at `www.tensorflow.org/versions/r2.0/api_docs/python/tf/keras/callbacks`


    # 6.2: Using high-level keras API and custom API of TensorFlow


    This section presents more detail about the custom API and high-level Keras API
    of TensorFlow through examples. Each example is implemented using both methods
    to show the benefits of each one. While the high-level Keras API was optimized
    and easy to use, the custom API is very flexible in building neural networks.


    ## 6.2.1: Network layer


    In this section, we create a convolutional layer using the high-level Keras API
    and custom network layer of TensorFlow. The parameters of the convolution layer
    are:

    - of kernels: 64

    - size: $3 \times 3$

    - stride: 1

    - padding: valid

    - function: `ReLU`

    - initialization: Glorot initialization

    - bias_initializer: zeros


    The convolution layer created by the following two methods have the same function.


    ![](image-j3zzp010.jpg)


    ## 6.2.2: Loss function


    This section establishes categorical cross-entropy (`CCE`) loss function using
    both high-level Keras API and custom loss function of TensorFlow. The formula
    for CCE is:


    ![](image-u1na7ci8.jpg) where `y` is expected output, prediction result of the
    network model, `f` is softmax function, `C` is number of categories, and `N` is
    the amount of data in a batch. The loss functions created by the following two
    methods have the same function.


    ![](image-mqxl150j.jpg) Although the custom cross-entropy (`CCE`) loss function
    created by the second method can work, it will be replaced with the official function
    `tf.nn.softmax_cross_entropy` in practice. The reason is that the official CCE
    API has been optimized, and thus it is faster and more stable in training.


    ![](image-yh78v11f.jpg)


    ## 6.2.3: Metric function


    A metric is a function that is employed to judge the performance of the model.
    TensorFlow provides a lot of metrics for performance judging as binary accuracy,
    categorical accuracy, sparse categorical accuracy, top-k categorical accuracy,
    sparse-top-k categorical accuracy, and so on. In this section, we create the categorical
    accuracy which calculates often predictions matches one-hot labels by using the
    high-level Keras API and custom metric function of TensorFlow. The metric functions
    created by the following two methods have the same function.


    ![](image-m29crsjh.jpg)

    ![](image-p26wwp4t.jpg) Supplementary explanation An example of categorical accuracy
    calculation.


    ![](image-nwp94soh.jpg)


    ## 6.2.4: Callback function


    This section introduces two methods to save the best model weights of the neural
    network during the training process. The first method employs a callback of the
    high-level Keras API, while the second method adopts a custom callback function
    of TensorFlow. The callbacks created by the following two methods have the same
    function.


    ![](image-ui8gg5l8.jpg)

    ![](image-6iwcf1oi.jpg) Fig. 6.1 shows an example of a saved model weights file
