- raw: '  3.3: Experiment: Pokémon combat prediction    In this section, a Pokémon
    combat prediction model is implemented to illustrate a binary classification model.
    In a combat, a winner can be predicted based on the characteristics of Pokémon
    such as the amount of blood, attack force, defense points, and so on. Therefore,
    the Pokémon characteristics are used as the inputs of the Pokémon combat prediction
    model. The BCE loss function introduced earlier is employed for training the model.
    The model predicts the winner of the combat between the first Pokémon and the
    second Pokémon based on output probability value. If the predicted probability
    is less than 0.5, the winner is the first Pokémon. On the contrary, the winner
    is the second Pokémon.  In order to verify the effect of the one-hot encoding
    technique, we implement two scenarios of the Pokémon combat prediction model:   
    the first scenario, the integer-encoding technique is used to represent the attributes
    of the Pokémon for training the model, named Model-1.  the second scenario, the
    one-hot-encoding technique is employed to represent the attributes of Pokémon
    for the training model, named Model-2.    3.3.1: Introduction to Pokémon-Weedle’s
    cave dataset    The example in this chapter uses a Kaggle dataset, namely, the
    “Pokémon-Weedle’s Cave” dataset for training and evaluating the Pokémon combat
    prediction model. Please access https://www.kaggle.com/terminus7/pokemon-challenge
    and click “Download” to download the dataset, as shown in Fig.    ![](image-wydk5u9s.jpg)Fig.
    3.9 Pokémon-Weedle’s Cave dataset page.    To predict the outcome of future matches
