    ## 12.3.10: CFF-SSD


    Le et al. [31] proposed Cross-Resolution Fusion SingleBox Detector (`CFF-SSD`)
    in 2019. `CFF-SSD` improves object detection performance, especially detection
    of small objects by applying the proposed cross-resolution fusion (`CFF`) approach
    to the base detector `SSD`. There are two versions of `CFF-SSD`: `1CFF-SSD` for
    fast detection and `2CFF-SSD` for more accurate detection, as shown in Fig.


    ![](image-so34oi5w.jpg)

    Fig. 12.22 The architecture of `CFF-SSD`.


    Atrous Spatial Pyramid Pooling (`N-ASPP`) module

    `N-ASPP` module uses a feature map at a shallow layer as the input and extracts
    multiscale contextual information through four parallel atrous convolutions with
    different rates.


    ![](image-x2i5qwn.jpg)

    Fig. 12.23 Cross-Resolution Fusion (`CFF`)


    In `1CFF-SSD` architecture, one `CFF` is adopted, which uses `N-ASPP` with four
    atrous convolutions including `1 × 3` convolution and `3 × 3` atrous convolutions
    with rates of 1, 2, and 4. In `2CFF-SSD` architecture, one more `CFF` is added
    to the first `CFF`, the second `CFF` adopts an `N-ASPP` module using atrous convolutions
    with bigger rates to enlarge the field of view of filters for combining larger
    context. Specifically, three rates of `3 × 3` atrous convolutions in `N-ASPP`
    module of the second `CFF` are set to 2, 4, and 8. Although the output of `N-ASPP`
    module contains rich contextual information, it lacks semantic information. Therefore,
    it is combined with the output of the Rich Semantic Information Generation (`RSIG`)
    module to supplement semantic information before using prediction.


    Semantic Information Generation (`RSIG`) module

    `RSIG` module is responsible for providing rich semantic information from a deeper
    layer to a shallower layer and consists of two modules: a resolution matching
    (`RM`) submodule and the `ResNeXt` submodule. First, the `RM` module enlarges
    the feature maps of the deeper layer to the same size as the output of the `N-ASPP`
    module. If the input size of the `RM` module and the output size of the `N-ASPP`
    module are and, the `RM` module only contains one deconvolutional layer, as shown
    in Fig. If the input size of the `RM` module and the output size of the `N-ASPP`
    module are and, two deconvolutional layers are adopted in the `RM` module, as
    shown in Fig. Next, the `ResNeXt` module uses the enlarged feature maps from the
    `RM` module as the input and exploits richer semantic information through multiple
    branches of convolutional layers. Finally, the resulting feature of `ResNeXt`
    module is passed through a normalization layer for producing a feature map at
    the output of `RSIG` module. The resulting feature map of the `RSIG` module is
    concatenated with that of the `N-ASPP` module for improving the performance of
    small object detection.


    Supplementary explanation

    Atrous convolution: Proposed in `DeepLab` atrous convolution adjusts the field
    of view of the filter by inserting zeros between adjacent filter elements, as
    shown in Fig. The number of zeros can be controlled by setting a hyperparameter
    `rate`. Atrous convolution with rate `r` indicates that zeros are padded, and
    the bigger the `rate` value used, the larger the field of view of the filter becomes.
    Using atrous convolution with different atrous rates effectively extracts multiscale
    context information from a feature map without any additional computation.


    ![](image-m6jujjp.jpg)

    Fig. 12.24 Atrous convolution with different rate values.


