    # 6.3: Experiment: implementation of two network models using high-level keras
    API and custom API


    In this section, we present two scenarios of building neural networks for multi-category
    classification. In the first scenario, we employ the high-level Keras API of TensorFlow
    to create the network model, called `Model-1`. In the second scenario, we use
    the custom API of TensorFlow to build the network model, called `Model-2`. `Model-1`
    and `Model-2` are trained separately on the CIFAR-10 dataset for comparing performance.
    Fig. 6.2 is a flowchart of the source code for building `Model-1` and `Model-2`.


    ![](image-fch1gsp4.jpg)

    Fig. 6.2 Flowchart of the source code for building multi-category classification
    models using high-level Keras API and custom API.


    ![](image-frmi9fyj.jpg) ![](image-lpabqz5i.jpg)


    `Model-1` and `Model-2` have the same architecture, as shown in Table. While `Model-1`
    is constructed using the high-level Keras API of TensorFlow, `Model-2` is built
    using the custom API of TensorFlow.


    Table 6.1

    ![](image-9xbrvd8x.jpg) ![](image-aeirf9a5.jpg) ![](image-v9nw8gg0.jpg) ![](image-ch5hmr8v.jpg)
    ![](image-uury53sv.jpg)


    ### Supplementary explanation


    `Model-1` and `Model-2` do not use the softmax activation function at the output
    layer because the built-in loss function `keras.losses.CategoricalCrossentropy()`
    of `Model-1` has an argument `from_logits` was set to `True` and the custom loss
    function of `Model-2` utilized the `tf.nn.softmax_cross_entropy_with_logits()`
    function, which already adopted softmax for calculating CCE loss. Therefore, if
    the softmax activation function is attached at the output layer of the models,
    the output value will be calculated two times through the softmax function.


    ![](image-6jiykwsb.jpg) ![](image-jui8snja.jpg) ![](image-v8l5g9m0.jpg) ![](image-0o07qz58.jpg)
    ![](image-b052isqo.jpg) ![](image-634tqau5.jpg)


    The experimental results show that the accuracy of both models is close. This
    confirms that using custom API of TensorFlow for designing neural networks can
    achieve a similar result as using the high-level Keras API while at the same time
    being more flexible.


    # Chapter 7: Advanced TensorBoard


    ### Abstract

    TensorBoard is an official toolkit of TensorFlow, providing the visualization
    needed for designing neural networks and machine learning experimentation. The
    use of the `tf.keras.callbacks.TensorBoard` function is limited in supporting
    information in various states and statistics of the neural networks during the
    training process. This chapter introduces how to write summary data and display
    on TensorBoard with the `tf.summary` module of TensorFlow, providing many application
    programming interfaces (APIs) such as `tf.summary.scalar`, `tf.summary.image`,
    `tf.summary.text`, `tf.summary.audio`, and `tf.summary.histogram`. To help readers
    with more in-depth use of TensorBoard, we present two scenarios of visualizing
    the training results of the neural networks. In the first scenario, we apply the
    `tf.summary.image` API for observing the image results. In the second scenario,
    we employ a hyperparameter tuning technique with the HParams dashboard to identify
    the most suitable hyperparameters (learning rate, optimizer, weight initialization
    method, and so on) for designing a network model with a specific problem.


    **Keywords:**

    TensorBoard; Hyperparameter tuning; `tf.summary`; HParams dashboard; Visualization
    tools; Training results


    ### Outline

    - TensorBoard and low-level application programming interfaces (APIs) to write
    data, such as texts, audios, and images

    - output images of the neural networks during the training process on TensorBoard
    by combining `tf.summary.image` API and custom callback

    - the HParams dashboard in TensorBoard to identify the most suitable hyperparameters
    for designing a neural network with a specific problem

    '
