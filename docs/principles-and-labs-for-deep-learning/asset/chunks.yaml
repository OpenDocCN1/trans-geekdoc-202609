    N: 数量


    训练判别器的目的是最小化判别器损失。判别器损失越小，判别器区分生成样本和真实样本的能力越强。在训练判别器期间，生成器的权重需要固定。判别器的损失函数公式为：

    ![](img/image-sfk314.jpg) (11.11)


