    ## 基于区块链的物联网（IoT）架构中的数据存储


    Munavwar Shaikh, Charles Shibu, Enrico Angeles, Deepa Pavithran


    信息安全工程系，阿布扎比理工学院，邮政信箱 111499，阿布扎比，阿联酋。


    {munavwar.shaikh, charles.gabriel, enrico.angeles, deepa.pavithran}@adpoly.ac.ae


    **Abstract—** 物联网系统中的数据存储描述了数据如何从传感器推送以及将存储在何处。在比特币中，区块中可存储的交易数量存在限制，同样在以太坊中，其受区块中的
    gas 限制所限。物联网基础设施具有多个应用，其中包括从物理环境收集数据的传感器。在区块链中存储大量数据面临若干挑战，原因在于区块链的分布式特性、较高的交易处理时间和降低的可扩展性。因此，识别应存储哪些数据以及如何以安全方式存储至关重要。在本文中，我们提供了数据在各种基于区块链的物联网应用中是如何被存储的，并提供了在区块链环境中处理物联网数据的数据存储合规性。


    **Keywords—** 区块链，物联网，数据存储，传感器，数据合规，云。


    ## I. 引言


    区块链是一种近期技术，可为物联网系统提供数据安全和隐私。它使用分布式账本设计，将数据存储在网络中的多个节点中。在去中心化系统中，计算和存储任务是冗余的，这意味着去中心化网络中的每个节点都必须存储所有数据的完整副本并执行相同的数据操作。这就是区块链在节点之间维护信任并为数据提供安全性的方式。然而，当参与节点的数量增加或待存储的数据量很高时，将整个数据复制到所有参与节点并对其进行并发计算将不切实际。


    现有的物联网系统使用离线或基于云的信息共享技术。它存在若干缺点，包括维护成本高、效率低，以及缺乏有效机制来确保不同系统中物联网设备身份、信息有效性、真实性、一致性和信息完整性
    [1]。


    区块链系统不依赖可信第三方。所有节点共同决策以验证交易的合法性。即使某些节点被攻击或被摧毁，也不会对整个区块链系统造成损害。


    ## II. 背景


    ### A. 区块链


    区块链是一个分布式账本，其中区块通过加密哈希连接并分布在系统中的所有节点上。一般来说，区块链有两种类型：公有和许可制。在公有区块链中，任何人都可以加入网络或参与共识机制。比特币是公有区块链的一个例子。在许可制或私有区块链中，只有特定实体才能参与区块链流程。这通常用于涉及多个实体受限方式的应用。它会对谁可以访问数据以及谁可以参与共识进行一定控制。共识是对如何以及什么数据添加到区块链上的协议。


    ### B. 物联网


    如 [2] 中所定义，物联网（IoT）是一种新兴的全球基于互联网的信息架构，促进全球供应链网络中商品和服务的交换。物联网数据来自大量设备，产生数十亿个数据对象。物联网网络必须与不同设备协作以采样、处理并使这些数据对分析和决策有用。实现物联网的全部潜力尚未实现。这是因为缺乏标准、设备的异构性、多样化的通信协议和安全问题
    [3]。


    ## III. 基于区块链的物联网用例中的数据存储


    大多数基于区块链的物联网应用领域包括医疗保健、智能家居、智慧城市、工业物联网和农业应用。


    ### A. 采用区块链的物联网设备


    物联网数据存储的基于区块链的设计采用分布式访问控制和数据管理方法。在此场景中，数据所有权转移给用户，而不是遵循基于信任建模的传统集中式访问控制系统。利用基于区块链的功能，在存储层上具有可验证的分布式访问控制层的可靠且防故障的数据管理得以实践。时间关键型物联网数据的存储通过基于位置的去中心化存储系统在网络边缘得到促进，而该系统又由区块链技术管理
    [4]。Quanqing Xu [5] 建议大型存储系统的并行性以缩短许多基本数据分析任务的执行时间，其中区块链可作为智能合约用于促进物联网中的合同谈判并执行它。采用基于
    OSD 的智能合约（OSC）方法，其中物联网设备与此类区块链交互。对于数据分析应用，物联网设备处理器执行特定于应用的操作。这样，只将结果返回给客户端，而不是它们读取的数据文件
    [5]。


    ### B. 医疗保健


    随着智能物联网设备在医疗保健行业的出现，云计算、环境辅助生活、大数据和可穿戴设备等有前景的技术正被应用于医疗保健内的各种平台 [6]。与数据和政策相关的电子健康法规在全球范围内也在不断发展，以确定它们如何协助物联网和云计算在医疗保健行业的可持续发展，同时所有这些平台的数据也在蓬勃发展
    [6]。患者的医疗数据被视为极其重要且保密。因此，医疗保健系统中的物联网设备旨在确保患者医疗数据的安全，实现正常和紧急情况下的访问控制，并支持智能去重以节省大数据存储系统中的存储空间。由医疗保健物联网网络生成的医疗文件通常会被加密并传输到存储系统，可利用跨域访问控制策略在不同医疗领域的医疗人员之间安全共享。可以遵循
    Tang 等人 [7] 提出的一种智能安全去重方法，以确保在去重后所有数据用户都可以访问医疗文件或数据，并由不同的原始访问策略授权。


    ### C. 工业物联网(IIoT)


    工业物联网的主要目标是通过产品定制、机器状况以智能方式监控、生产车间智能监控应用以及工业设备的预测性和预防性维护来提高运营效率、扩大生产规模并更好地管理工业组件和流程
    [8]。在物联网设备的工业使用中，存储和检索通过集成雾计算和云计算 [9] 实现，作者还建立了一个灵活且经济的数据处理框架。这些设备中的数据在边缘服务器中进行预处理并添加时间戳后本地存储。剩余数据被发送到外部存储介质并远离本地存储以供信息检索和数据挖掘
    [9]。这组数据不是时间敏感的。


    ### D. 智慧城市/智能家居


    智能手机应用程序使用无线通信技术来控制和监控家庭功能。Domb 在 [10] 中研究了智能家居的概念及其相关数据，纳入了物联网服务和云计算。它还讨论了在传感器和执行器中嵌入智能、使用适当技术联网智能设备、节省存储空间和提高数据交换效率，以及利用云计算和存储促进与智能物体的交互，以便在不同地点轻松访问。精确、快速、开放和共享的信息系统是智慧城市应用的基础。鉴于这种庞大、分布式、异构和复杂的状态数据，传统数据的存储和管理将遇到很大困难。传统基础设施采用集中式方法，使用昂贵的服务器、大型硬盘存储硬件和关系数据库管理系统。这导致系统可扩展性差、成本更高，并且在很大程度上难以适应智慧城市应用对实时状态数据更高可靠性的需求
    [11]。


    ### E. 农业应用


    一些基于物联网的智能农业监控系统采用两层数据存储方法来存储和保护来自任何物联网设备的海量数据。Tier-1 专注于从各种传感器收集数据并使用 SD 卡本地存储。Tier-2
    使用云服务器存储大量物联网传感器数据 [12]。Gill 等人 [13] 解释了使用云和大数据技术交付农业即服务（AaaS）的基于云的自主信息系统的好处。据此，AaaS
    系统通过预配置设备和物联网传感器从各种用户收集信息，并在云中借助大数据分析进行处理，并自动为用户提供必要信息。


    ## IV. 物联网区块链中的数据存储架构


    ### A. 云存储


    许可区块链使用云服务器存储加密的数据块。所有交易在不同的区块中并使用 Merkle Tree 创建每个区块的组合哈希并将其传输到分布式网络。这样，云数据的任何更改都可以轻松检测到。以这种方式进行存储也在一定程度上保留了去中心化
    [14]。图1显示了基于区块链的物联网架构，其中云存储被用于存储物联网数据。云存储将用户数据用于相同的组。存储在云中的数据的哈希被发送到覆盖网络。将区块链的大部分存储在云中的分层存储结构有助于更快地将一天的区块链上传到云中，它在区块链覆盖网络中维护最近创建的区块。区块链连接器和云连接器是定义的两个软件接口，用于创建区块并与云协调，但这种方法的一个缺点是需要在更真实的物联网应用中实施，以确定该技术是否可靠
    [15]。


