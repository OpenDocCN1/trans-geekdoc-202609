  - '[PAGE 0]


    # Data Storage in Blockchain Based Architectures for Internet of Things (IoT)


    Munavwar Shaikh, Charles Shibu, Enrico Angeles, Deepa Pavithran


    Information Security Engineering Dept, Abu Dhabi Polytechnic, P.O. Box 111499,
    Abu Dhabi, United Arab Emirates.


    {munavwar.shaikh, charles.gabriel, enrico.angeles,deepa.pavithran}@adpoly.ac.ae


    **Abstract—** Data storage in IoT systems describe how data is pushed from the
    sensor and where it will be stored. In Bitcoin, there is a limit to the number
    of transactions that can be stored in the block, similarly in Ethereum it is limited
    by the gas limit in block. An IoT infrastructure have several applications that
    includes a sensor collecting data from physical environment. Storing a large amount
    data in a blockchain faces several challenges due to the distributed nature of
    the blockchain, high transaction processing time, and reduced scalability. Hence
    it is crucial to identify what data should be stored and how to store it in a
    secure way. In this paper, we provide how data is being stored in various blockchain
    based IoT applications and provides data storage compliance in treating IoT data
    in a blockchain environment.


    **Keywords—** blockchain, Internet of things, data storage, sensors, data compliance,
    cloud.


    # I. INTRODUCTION


    Blockchain is a recent technology that can provide data security and privacy in
    IoT Systems. It uses a distributed ledger design that stores data in multiple
    nodes within the network. In a decentralized system, computing and storage tasks
    are redundant, which means every node in the decentralized network must store
    a complete copy of all data and perform the same operations of data. This is how
    blockchain maintains trust among nodes and provide security to the data. However,
    when the number of participating nodes increases or the amount of data to be stored
    is high, it will not be practical to replicate the entire data into all participating
    nodes and to perform concurrent computations on it.


    The existing internet of things systems uses either offline or cloud-based information-sharing
    technology. It has several shortcomings including the high maintenance cost, low
    efficiency, and lack of an effective mechanism to ensure IoT equipment Identity,
    information validity, authenticity, consistency, and integrity of information
    in different systems [1].


    Blockchain systems do not rely on trusted third parties. All nodes make decisions
    together to verify the legitimacy of the transaction. Even if some nodes are attacked
    or destroyed, it will not cause damage to the entire blockchain system.


    # II. BACKGROUND


    # A. Blockchain


    Blockchain is a distributed ledger where blocks are connected with cryptographic
    hashes and are distributed


    over all the nodes in the system. Generally, there are two types of blockchain:
    public and permissioned. In a public blockchain, anyone can join the network or
    participate in the consensus mechanism. An example of a public blockchain is Bitcoin.
    In a permissioned or private blockchain, only certain entities will have access
    to participate in the blockchain process. This is typically used in applications
    that involve multiple entities in a restricted way. It will have a certain control
    on who can access the data and who can participate in the consensus. The consensus
    is an agreement on how and what data are added to the blockchain.


    # B. Internet of Things


    As defined in [2] Internet Of Things (IoT) is an emerging global Internet-based
    information architecture facilitating the exchange of goods and services in the
    global supply-chain network. The IoT data comes from a large number of devices
    generating billions of data objects. The IoT network has to collaborate with different
    devices to sample, process, and make this data useful for analytical and decision
    making. Realizing the full potential of IoT has not yet been achieved. This is
    due to the lack of standards, heterogeneous nature of devices, diversified communication
    protocol, and security [3].


    # III. DATA STORAGE IN BLOCKCHAIN BASED IOT USECASES


    A majority of blockchain-based IoT Application is in the field of healthcare,
    Smart home, smart city, Industrial IoT and agricultural applications.


    # A. IoT Devices employing blockchain


    The blockchain-based design for IoT data storage takes a distributed access control
    and data management approach. In this scenario, data ownership is transferred
    to users instead of following the traditional centralized access control system
    based on trust modeling. With the use of blockchain-based functions, secure and
    fail-safe data management with a verifiable and distributed access control layer
    on the storage layer is practiced. The storage of time-critical IoT data is facilitated
    at the edge of the network via a location-based decentralized storage system,
    which in turn is managed with blockchain technology [4]. The parallelism of large
    storage systems is suggested by Quanqing Xu[5] in order to shorten the execution
    time of many basic data analysis tasks, whereby blockchain can be used as intelligent
    contracts to facilitate the negotiation of a contract in the IoT and also to enforce
    it. OSD-based smart contract (OSC) approach is used in which IoT devices interact
    with'
  - '[PAGE 1]


    such blockchains. For data analysis applications, the IoT device processors perform
    application-specific operations. That way, only the results are returned to the
    clients, rather than the data files they read [5].


    # B. Healthcare


    Since the advent of smart IoT devices in the Healthcare industry, promising technologies
    such as cloud computing, ambient assisted living, big data, and wearables are
    being applied in various platforms within Healthcare [6]. E-health regulations
    related to data and policies worldwide to determine how they assist the sustainable
    development of IoT and cloud computing in the healthcare industry evolved as well
    with the thriving data in all these platforms [6]. The Medical data of a patient
    is treated with utmost care and secrecy. Hence the IoT devices in healthcare systems
    are devised to ensure the security of patients'' healthcare data, realize access
    control for normal and emergency scenarios, and support smart deduplication to
    save the storage space in big data storage system. The medical files generated
    by the healthcare IoT network are usually encrypted and transferred to the storage
    system, which can be securely shared among the healthcare staff from different
    medical domains leveraging a cross-domain access control policy. A smart secure
    deduplication method could be followed as proposed by Tang et al. [7] to ensure
    the medical files or data can be accessed by all the data users after deduplication
    and authorized by the different original access policies.


    # C. Industrial IoT(IIoT)


    The main goal of industrial IoT is to improve operational efficiency, increase
    the scale of production and better management of industrial components and processes
    through product customization, condition of machines getting monitored in an intelligent
    way, smart monitoring applications for production workshops as well as predictive
    and preventive maintenance of industrial equipment [8]. In industrial usage of
    IoT devices, storage and retrieval are done by integrating fog computing and cloud
    computing [9] and a flexible and economic framework for data processing was made
    by the authors. The data in these devices are preprocessed in the edge server
    with the addition of timestamps and stored locally. The remaining data gets sent
    to the external storage medium and away from the local storage for information
    retrieval and data mining [9]. This set of data is not time-sensitive.


    # D. Smartcity/Smart Home


    Smartphone applications are used to control and monitor home functions using wireless
    communication technologies. Domb in [10] examines the concept of the smart home
    and the data associated with it, incorporating IoT services and cloud computing
    It also discusses embedding intelligence in sensors and actuators, networking
    intelligent devices using the appropriate technology, saving storage space and
    improving data exchange efficiency, and facilitating data interaction with intelligent
    things using cloud computing and storage for easy access to various locations.
    A precise, fast, open and shared information system is the basis for Smart City
    applications. In view of this massive, distributed, heterogeneous and complex
    state data, the storage and management of traditional data will encounter great


    difficulties. The traditional infrastructure uses a centralized approach, an expensive
    large server, hard disk storage hardware, and a relational database management
    system. This leads to poor scalability of the system, higher costs and, for the
    most part, difficult adaptation to the demand for higher reliability of real-time
    status data from smart city applications [11].


    # E. Agricultural Applications


    Some IoT-based smart farming surveillance systems use a two-tier approach to data
    storage to store and secure large amounts of data from any IoT device. Tier-1
    focuses on collecting data from various sensors and storing them locally using
    the SD card. Tier-2 uses a cloud server to store the large volume of IoT sensor
    data [12]. Gill et al. [13] explains the benefits of a cloud-based autonomous
    information system for the delivery of Agriculture-as-a-Service (AaaS) using cloud
    and big data technologies. Accordingly, the AaaS system collects information from
    various users via pre-configured devices and IoT sensors and processes it in the
    cloud with the help of big data analysis and provides the users with the necessary
    information automatically.


    # IV. DATA STORAGE ARCHITECTURES IN IOT BLOCKCHAIN


    # A. Storage in cloud


    Permissioned blockchains use cloud servers to store encrypted data blocks. All
    transactions in a different block and create a combined hash of each block using
    Merkle Tree and transfer it to the distributed network. This way, any changes
    in cloud data can be easily detectable. Doing the storage in this manner also
    preserves decentralization to some extent [14]. Fig.1 shows blockchain based IoT
    architecture where a cloud storage is being used to store the IoT Data. Cloud
    storage uses users'' data in an identical group. The Hash of the data stored in
    the cloud is sent to the overlay network. The hierarchical storage structure in
    storing the majority of the blockchain in the clouds helps faster upload of one
    day''s blockchain to the cloud, it maintains the most recently created blocks
    in a blockchain overlay network. The blockchain connector and the cloud connector
    are the two software interfaces that are defined to create the blocks and coordinate
    to the clouds but one disadvantage of this method is a need to be implemented
    in a more real IoT application to find out if this technology is reliable [15].


