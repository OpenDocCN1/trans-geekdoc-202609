    [5]。基于区块链技术并结合边缘计算的物联网数据存储和保护的安全结构有助于管理数据存储并协助小型物联网设备完成计算。认证系统采用了无证书密码学，但需要改进区块链系统的认证方案
    [18]。物联网、区块链和云技术的集成允许以受保护的方式观察患者的生命体征。区块链技术数据共享中使用的数据存储和访问显著提高了整体吞吐量，但需要使用各种物联网框架进行测试
    [19]。区块链技术解决了物联网信息共享安全问题，但在应用于特定行业时性能需要增强 [1]。


