    ## B. 以去中心化方式存储


    这是一种完全去中心化的数据存储方式。Liu et al. [16] 将去中心化区块链网络和分布式存储网络集成在一起。IoT 设备产生的数据存储在点对点网络中的分布式存储节点中，而作为标识符的数据引用则存储在区块链中。区块链仅存储数据的摘要而不存储数据本身。因此，区块链上的数据量大大减少。在存储数据中使用区块链技术以及使用管理中心（包括物联网与区块链去中心化访问控制的集成）解决了管理多个受控物联网设备的难题，能够应对不同的物联网场景，但由于物联网不再是区块链技术的一部分，因此物联网中存在威胁和漏洞的可能性
    [17]。图 2 显示了一种使用去中心化存储来存储物联网数据的区块链架构。使用了去中心化的云架构，其中小型数据中心满足低延迟和高带宽的要求，因为这些数据中心位于更靠近用户的位置。具有位置感知的存储和处理开发在去中心化访问控制层下发挥了其全部潜力。以预定义长度分块的数据流显示出合理的结果，但这仍处于初始阶段，需要改进
