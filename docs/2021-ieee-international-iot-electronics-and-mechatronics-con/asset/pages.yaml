  md: '# Data Storage in Blockchain Based Architectures for Internet of Things (IoT)


    Munavwar Shaikh, Charles Shibu, Enrico Angeles, Deepa Pavithran


    Information Security Engineering Dept, Abu Dhabi Polytechnic, P.O. Box 111499,
    Abu Dhabi, United Arab Emirates.


    {munavwar.shaikh, charles.gabriel, enrico.angeles,deepa.pavithran}@adpoly.ac.ae


    **Abstract—** Data storage in IoT systems describe how data is pushed from the
    sensor and where it will be stored. In Bitcoin, there is a limit to the number
    of transactions that can be stored in the block, similarly in Ethereum it is limited
    by the gas limit in block. An IoT infrastructure have several applications that
    includes a sensor collecting data from physical environment. Storing a large amount
    data in a blockchain faces several challenges due to the distributed nature of
    the blockchain, high transaction processing time, and reduced scalability. Hence
    it is crucial to identify what data should be stored and how to store it in a
    secure way. In this paper, we provide how data is being stored in various blockchain
    based IoT applications and provides data storage compliance in treating IoT data
    in a blockchain environment.


    **Keywords—** blockchain, Internet of things, data storage, sensors, data compliance,
    cloud.


    # I. INTRODUCTION


    Blockchain is a recent technology that can provide data security and privacy in
    IoT Systems. It uses a distributed ledger design that stores data in multiple
    nodes within the network. In a decentralized system, computing and storage tasks
    are redundant, which means every node in the decentralized network must store
    a complete copy of all data and perform the same operations of data. This is how
    blockchain maintains trust among nodes and provide security to the data. However,
    when the number of participating nodes increases or the amount of data to be stored
    is high, it will not be practical to replicate the entire data into all participating
    nodes and to perform concurrent computations on it.


    The existing internet of things systems uses either offline or cloud-based information-sharing
    technology. It has several shortcomings including the high maintenance cost, low
    efficiency, and lack of an effective mechanism to ensure IoT equipment Identity,
    information validity, authenticity, consistency, and integrity of information
    in different systems [1].


    Blockchain systems do not rely on trusted third parties. All nodes make decisions
    together to verify the legitimacy of the transaction. Even if some nodes are attacked
    or destroyed, it will not cause damage to the entire blockchain system.


    # II. BACKGROUND


    # A. Blockchain


    Blockchain is a distributed ledger where blocks are connected with cryptographic
    hashes and are distributed


    over all the nodes in the system. Generally, there are two types of blockchain:
    public and permissioned. In a public blockchain, anyone can join the network or
    participate in the consensus mechanism. An example of a public blockchain is Bitcoin.
    In a permissioned or private blockchain, only certain entities will have access
    to participate in the blockchain process. This is typically used in applications
    that involve multiple entities in a restricted way. It will have a certain control
    on who can access the data and who can participate in the consensus. The consensus
    is an agreement on how and what data are added to the blockchain.


    # B. Internet of Things


    As defined in [2] Internet Of Things (IoT) is an emerging global Internet-based
    information architecture facilitating the exchange of goods and services in the
    global supply-chain network. The IoT data comes from a large number of devices
    generating billions of data objects. The IoT network has to collaborate with different
    devices to sample, process, and make this data useful for analytical and decision
    making. Realizing the full potential of IoT has not yet been achieved. This is
    due to the lack of standards, heterogeneous nature of devices, diversified communication
    protocol, and security [3].


    # III. DATA STORAGE IN BLOCKCHAIN BASED IOT USECASES


    A majority of blockchain-based IoT Application is in the field of healthcare,
    Smart home, smart city, Industrial IoT and agricultural applications.


    # A. IoT Devices employing blockchain


    The blockchain-based design for IoT data storage takes a distributed access control
    and data management approach. In this scenario, data ownership is transferred
    to users instead of following the traditional centralized access control system
    based on trust modeling. With the use of blockchain-based functions, secure and
    fail-safe data management with a verifiable and distributed access control layer
    on the storage layer is practiced. The storage of time-critical IoT data is facilitated
    at the edge of the network via a location-based decentralized storage system,
    which in turn is managed with blockchain technology [4]. The parallelism of large
    storage systems is suggested by Quanqing Xu[5] in order to shorten the execution
    time of many basic data analysis tasks, whereby blockchain can be used as intelligent
    contracts to facilitate the negotiation of a contract in the IoT and also to enforce
    it. OSD-based smart contract (OSC) approach is used in which IoT devices interact
    with'
