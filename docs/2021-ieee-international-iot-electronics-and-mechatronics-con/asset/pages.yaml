    This is a fully decentralized way of storing data. Liu et al. [16] integrates
    decentralized blockchain network and distributed storage network. Data produced
    by the IoT device is stored in the distributed storage nodes in the peer-to-peer
    network, whereas the reference to data that serve as the identifier is stored
    in the Blockchain. Blockchain only stores the digest of data but not data itself.
    Hence the amount of data on the blockchain is greatly reduced. The use of blockchain
    technology in storing data and with the use of management hub including the integration
    of IoT and decentralized access control to the blockchain solves the issues in
    managing several controlled IoT devices, it was able to cope up with different
    IoT scenarios but there are possibilities of threat and vulnerabilities in the
    IoT since it is no longer part of the blockchain technology [17]. Fig.2 shows
    a blockchain architecture that uses decentralized storage for storing IoT data.
    Decentralized cloud architecture was used in which small-scale data centers meet
    low latency and high bandwidth because these data centers are located closer to
    the users. The locality-aware data storage and the processing development provide
    its full potential with the decentralized access control layer. Data streams that
    are chucked at pre-defined lengths show reasonable results but this one is still
