    is based on things like best practices for the industry or regulations and agencies
    like the U.S. National Bureau of Standards (NIST), ISO, HIPAA, SEC, GDPR in Europe.
    And the resulting architectural or procedural changes are the types of things
    that will be needed to address as part of the architecture. Compliance is not
    easy, nor is it free. The cost depends on lots of factors but trying to force
    compliance after the architecture is planned and built is always far most costly
    than doing it beforehand.


    **Decentralization:** The main benefit of using blockchain would be that no single
    authority would have control over the data generated by the IoT devices. That
    way, a distributed peer-to-peer network is born that permits the parties that
    don’t know or trust each other to collaborate more smoothly. This type of network
    will also make it possible to unify IoT devices and streamline the distribution
    of updates throughout the network.


    **Security:** The current security architecture of IoT has its shortcomings. When
    the data is managed by a central authority, the system is more susceptible to
    a single point of failure. Blockchain’s unique security protocol normally described
    as transparent and immutable is a good solution to the largest issue of IoT development.
    Blockchains will store unalterable data history that can be consulted for each
    unique address. This lays the foundations of a platform that provides improved
    identification and authentication in IoT. The robust level of encryption that
    blockchain guarantees won’t let the hackers overwrite data records.


    **Transparency:** Anyone with authorization could track the transactions made
    on the network and follow up on what has happened in the past. This feature is
    useful to identify any leakage and take action.


    **Autonomy:** Blockchain will reinforce the machine-to-machine economy that IoT
    is based on by offering a safe way to store information on different transactions.
    That way micropayments for services and data can be processed in a straightforward
    way. IoT devices that rely on blockchain can execute digital agreements automatically
    when the terms are met. Automating transactions between devices improves machine-to-machine
    communication.


    **Reduced costs:** Integrating blockchain to the organizational processes would
    allow IoT companies to reduce costs. Eliminating the massive overhead costs related
    to IoT gateways will help them to reduce the strain on the company budget.


    When defining compliance requirements, one should be looking to the future rather
    than the present because of the cost and challenge of shoehorning things in after
    the fact. That means that someone needs to be continuously studying compliance
    requirements in the given industry to which the organization belongs, along with
    best practices. Data will only become more important in the future, and we need
    to be up to the challenge.


    # V. COMPLIANCE ON DATA STORAGE


    To start with knowing the objectives of the organization. This interprets to knowing
    which regulations will apply to the organization directly related to the regional
    legal and regulatory requirement and which types of data are expected to manage
    or not, how long to retain it and how to protect it. In the organization the compliance
    officers can be the ones to provide information.


    Organizations need to focus on data classification and data mapping. Data classification
    and data mapping are crucial in discovering the types of information that are
    being held in storage systems and how they are being moved across the network.
    Not only are they essential factors in determining how regulated information is
    stored, but also a solid step in establishing compliant policies.


    **Continual monitoring:** Storage compliance is not a set-and-forget affair. Continual
    monitoring is key in ensuring that regulated data is properly cared for during
    its lifecycle. Procedures must be in place to make sure this monitoring happens
    regularly.


    **More than security:** Security and storage often go hand-in-hand, but storage
    compliance takes it to another level. Encryption will help, and many storage solutions
    feature support for the security-enhancing technology, giving both storage and
    security professionals one less thing to worry about.


    **Critical:** Testing and audits will ensure compliance with policies and IT mechanisms
    are up to the task. It’s best to work out the kinks now before having to explain
    to investigators why sought-after emails or transaction records have gone missing.
    There are many requirements based on the type of information and data the organization
    has. Some might involve using what is called DAR (Data Encryption at Rest), which
    encrypts the storage device so that if removed from the system, the data is nearly
    or totally impossible to access (the degree of difficulty depends on the encryption
    algorithm and the size, complexity and entropy of the key or keys for the device).


    Understanding what is required from a governance point of view for the organizational
    data or the resulting information


