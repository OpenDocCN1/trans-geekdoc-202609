    # B. Healthcare


    Since the advent of smart IoT devices in the Healthcare industry, promising technologies
    such as cloud computing, ambient assisted living, big data, and wearables are
    being applied in various platforms within Healthcare [6]. E-health regulations
    related to data and policies worldwide to determine how they assist the sustainable
    development of IoT and cloud computing in the healthcare industry evolved as well
    with the thriving data in all these platforms [6]. The Medical data of a patient
    is treated with utmost care and secrecy. Hence the IoT devices in healthcare systems
    are devised to ensure the security of patients'' healthcare data, realize access
    control for normal and emergency scenarios, and support smart deduplication to
    save the storage space in big data storage system. The medical files generated
    by the healthcare IoT network are usually encrypted and transferred to the storage
    system, which can be securely shared among the healthcare staff from different
    medical domains leveraging a cross-domain access control policy. A smart secure
    deduplication method could be followed as proposed by Tang et al. [7] to ensure
    the medical files or data can be accessed by all the data users after deduplication
    and authorized by the different original access policies.


    # C. Industrial IoT(IIoT)


    The main goal of industrial IoT is to improve operational efficiency, increase
    the scale of production and better management of industrial components and processes
    through product customization, condition of machines getting monitored in an intelligent
    way, smart monitoring applications for production workshops as well as predictive
    and preventive maintenance of industrial equipment [8]. In industrial usage of
    IoT devices, storage and retrieval are done by integrating fog computing and cloud
    computing [9] and a flexible and economic framework for data processing was made
    by the authors. The data in these devices are preprocessed in the edge server
    with the addition of timestamps and stored locally. The remaining data gets sent
    to the external storage medium and away from the local storage for information
    retrieval and data mining [9]. This set of data is not time-sensitive.


    # D. Smartcity/Smart Home


    Smartphone applications are used to control and monitor home functions using wireless
    communication technologies. Domb in [10] examines the concept of the smart home
    and the data associated with it, incorporating IoT services and cloud computing
    It also discusses embedding intelligence in sensors and actuators, networking
    intelligent devices using the appropriate technology, saving storage space and
    improving data exchange efficiency, and facilitating data interaction with intelligent
    things using cloud computing and storage for easy access to various locations.
    A precise, fast, open and shared information system is the basis for Smart City
    applications. In view of this massive, distributed, heterogeneous and complex
    state data, the storage and management of traditional data will encounter great


    difficulties. The traditional infrastructure uses a centralized approach, an expensive
    large server, hard disk storage hardware, and a relational database management
    system. This leads to poor scalability of the system, higher costs and, for the
    most part, difficult adaptation to the demand for higher reliability of real-time
    status data from smart city applications [11].


    # E. Agricultural Applications


    Some IoT-based smart farming surveillance systems use a two-tier approach to data
    storage to store and secure large amounts of data from any IoT device. Tier-1
    focuses on collecting data from various sensors and storing them locally using
    the SD card. Tier-2 uses a cloud server to store the large volume of IoT sensor
    data [12]. Gill et al. [13] explains the benefits of a cloud-based autonomous
    information system for the delivery of Agriculture-as-a-Service (AaaS) using cloud
    and big data technologies. Accordingly, the AaaS system collects information from
    various users via pre-configured devices and IoT sensors and processes it in the
    cloud with the help of big data analysis and provides the users with the necessary
    information automatically.


    # IV. DATA STORAGE ARCHITECTURES IN IOT BLOCKCHAIN


    # A. Storage in cloud


    Permissioned blockchains use cloud servers to store encrypted data blocks. All
    transactions in a different block and create a combined hash of each block using
    Merkle Tree and transfer it to the distributed network. This way, any changes
    in cloud data can be easily detectable. Doing the storage in this manner also
    preserves decentralization to some extent [14]. Fig.1 shows blockchain based IoT
    architecture where a cloud storage is being used to store the IoT Data. Cloud
    storage uses users'' data in an identical group. The Hash of the data stored in
    the cloud is sent to the overlay network. The hierarchical storage structure in
    storing the majority of the blockchain in the clouds helps faster upload of one
    day''s blockchain to the cloud, it maintains the most recently created blocks
    in a blockchain overlay network. The blockchain connector and the cloud connector
    are the two software interfaces that are defined to create the blocks and coordinate
    to the clouds but one disadvantage of this method is a need to be implemented
    in a more real IoT application to find out if this technology is reliable [15].


