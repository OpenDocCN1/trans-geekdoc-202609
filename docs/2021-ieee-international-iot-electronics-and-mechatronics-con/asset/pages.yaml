    # C. Storage in Hybrid way


    In this method data will be stored in a hybrid way, where processed/ or raw data
    from the sensor is stored in a cloud server and a reference to the data will be
    stored in the blockchain. Si et al. [1] propose a double-chain model combining
    data blockchain and transaction blockchain. IoT data is divided into lightweight
    data and multimedia data, where multimedia data is compressed and integrated to
    reduce data capacity and to improve data quality. The processed data is divided
    into account book data and outsourced storage data (multimedia data) stored in
    a fog node that can be easily downloadable. Fig.3 shows blockchain architecture
    that uses hybrid storage. A comparison of various storage options in IoT based
    blockchain architectures is provided in Table1.


