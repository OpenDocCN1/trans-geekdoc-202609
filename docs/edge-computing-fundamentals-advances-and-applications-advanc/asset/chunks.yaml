    \ kms || Low || Medium |\n\n| **RFID** || 860 to 960 MHz || Up to 100 Mbps ||\
    \ Up to 100 m || Low || High |\n\n| **Z-wave** || Sub GHz || 40–100 Kbps || 100\
    \ feet || Low || Medium |\n\n| **Thread** || 2.4 Ghz || 40–250 Kbps || 10 m ||\
    \ Low || Medium |\n\n| **NFC** || 13.56 MHz || 106 to 424 kbps || <10 cms || Low\
    \ || Low |\n\nData transfer protocols provide set of rules to establish point-to-point\
    \ communication with the hardware without Internet connection. It is used for\
    \ messaging purpose. They provide the rules to define syntax, semantics, error\
    \ recovery, and data synchronization. Some of the commonly used data protocols\
    \ include:\n\n*   **MQTT:** Message Queue Telemetry Transport is a subscribe/publish\
    \ protocol layered over Transmission Control Protocol (TCP). This protocol supports\
    \ event-driven messaging in low-cost, resource-constrained devices. MQTT is used\
    \ in fire detectors and car sensors. Mosquitto is an open-source MQTT broker.\n\
    \n*   **AMQP:** Similar to MQTT, the Advanced Message Queuing Protocol (AMQP)\
    \ provides a publish/subscribe architecture over TCP. The publisher's messages\
    \ are received through exchange that distribute them to queues. Queues represent\
    \ various topics. Listeners subscribe to these topics. When data is available\
    \ under these topics, subscribers receive the information. It can be used in the\
    \ device edge to ingest data from various IoT devices.\n\n*   **XMPP:** The Extensible\
    \ Messaging and Presence Protocol was standardized by IETF for message exchange\
    \ based on publish/subscribe architecture. It uses TCP for transport layer with\
    \ SSL/TLS based security.\n\n*   **CoAP:** The Constrained Application Protocol\
    \ (CoAP) is an application layer protocol that can be used in resource-constrained\
    \ wireless sensor network nodes. It has features of HTTP along with multicasting,\
    \ low overhead, low energy, and simplicity. It is a request-response type of protocol.\n\
    \n*   **HTTP:** Hypertext Transfer Protocol is a commonly used Internet protocol\
    \ in applications like additive manufacturing to connect computers with 3D printers.\
    \ RESTful architecture is considered for IoT environments. However, HTTP is not\
    \ preferred due to its cost and energy efficient.\n\nDDS (Data Distribution Service\
    \ for real-time systems), LLAP (Lightweight Local Automation Protocol), LWM2M\
    \ (Lightweight M2M), SSI (Simple Sensor Interface) are also commonly used. The\
    \ next section discusses the importance of automated network management.\n\n##\
    \ 2.5 Network Management and Control\n\nReconfiguring and managing networking\
    \ devices like routers and gateways manually is impractical and inefficient due\
    \ to the following reasons:\n\n*   Increase in deployment time and cost.\n\n*\
    \   Vulnerability to security threats due to proliferation of the IoT devices.\n\
    \n*   Hinders production and increases security vulnerabilities due to increase\
    \ in the downtime of the real-time applications.\n\nThis necessitates the use\
    \ of a good network management solution to install security updates in the devices\
    \ and applications. A well-controlled network reduces downtime and deployment\
    \ time of the IoT applications. For this, a technology like software-defined network\
    \ (SDN) to manage the entire network consistently and holistically is essential.\
    \ Software-defined networking (SDN) \\[[8](#ch02.xhtml#ref2_8)\\] is a networking\
    \ architecture that enables software applications to programmatically control\
    \ the network. The layout of the network is configurable dynamically. SDN provides\
    \ orchestration for network management by decoupling the control plane and the\
    \ data plane. SDN enables better network management by:\n\n*   Facilitating automatic\
    \ device configuration and bandwidth allocation using virtualization techniques.\n\
    \n*   Using security policies and improved access control mechanisms for overcoming\
    \ the security threats.\n\n*   Enabling quick deployment and unified management\
    \ of all ICT resources.\n\n*   Using intelligent techniques for troubleshooting\
    \ and management of networks.\n\n*   Supporting quick and flexible interworking\
    \ with multiple data platforms and providing capability to collect, analyze, and\
    \ upload data from IoT devices onto the platform.\n\n*   Decoupling of network\
    \ and data connections facilitates unified data uploading.\n\nSimplified network\
    \ management with SDN will make IoT systems more reliable, real-time, secure,\
    \ scalable facilitating unified data management. A layered architecture for network\
    \ management \\[[9](#ch02.xhtml#ref2_9)\\] ([Fig. 2.4](#ch02.xhtml#fig2_4)) using\
    \ SDN is given below:\n\n> **Perception layer** consists of various devices. Sensors\
    \ collect data for various applications. Actuators receive commands from the network\
    \ to perform various tasks.\n\n> \n\n> **Communication layer** consists of SDN\
    \ gateways and routers, to transfer data. These gateways are programmatically\
    \ controlled by the SDN controller. Some of the functionalities of such gateways\
    \ include data transfer, data storage and processing as directed by the controller.\
    \ These gateways also perform node management, protocol conversion and security\
    \ control.\n\n> \n\n> **Computing layer** contains SDN controller. The controllers\
    \ control not only data transfer but also process data. Some of the functionalities\
    \ of the SDN controller include\n\n> \n\n> *   Device management that includes\
    \ configuring, managing of routers/gateways as well as establishment of policies\
    \ and rules for collection and processing of data in various devices.\n\n> * \
    \  Service management that includes adding or deleting various services and policies\
    \ supported by gateways and for data management/storage.\n\n> *   Topology management,\
    \ that includes routing and topology updation.\n\n> *   Operation and maintenance\
    \ of logs, monitoring and managing the functional modules.\n\n> *   Security management\
    \ including authentication and access control.\n\n> *   Network activation using\
    \ container based virtual network functions.\n\n> *   Implementation of SDN southbound\
    \ (SB) and northbound (NB) interfaces.\n\n![Figure 2.4 SDN-based architecture\
    \ for network management.](images/fig2_4.jpg)\n\n[Figure 2.4 SDN-based architecture\
    \ for network management.](#ch02.xhtml#fg2_4)"
