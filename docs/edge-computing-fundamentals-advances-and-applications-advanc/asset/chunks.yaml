    # 5 区块链与边缘计算系统


    DOI: [10.1201/9781003230946-5](https://doi.org/10.1201/9781003230946-5)


    ## 5.1 区块链的历史


    2008 年，中聪（Satoshi Nakamoto）发明了一种名为`Bitcoin`（`BTC`）的去信任数字货币，旨在消除数字金融交易中的第三方媒介。在`Bitcoin`的概念中，点对点（`P2P`）网络中的交易通过加密机制进行验证，交易记录存储在分布式账本中。在这里，成功的挖矿过程将获得`bitcoins`作为奖励。`Bitcoin`挖掘是一种释放`bitcoins`流通的实践。为了在区块链中添加区块，矿工需要解决一个计算性很强的难题以获得`bitcoins`形式的奖励。`Bitcoin`是使用区块链技术的第一个应用。2009
    年，中聪以 50 个`bitcoins`的奖励挖出了第一个`bitcoins`区块，被称为创世区块。第一个`Bitcoin`交易由哈尔·芬尼（Hal Finney）完成，他下载了`Bitcoin`软件并从中聪处获得了十个`bitcoins`。`Bitcoin`作为开源软件发布，使许多加密货币开发者设计出模仿`Bitcoin`的不同加密货币。中聪是引入共识机制的使用者。`Bitcoin`网络证明工作量（`PoW`）共识是一种有效验证和确认`Bitcoin`网络节点的方法。直到
    2014 年，`Bitcoin`仅被用加密货币。2014 年，维塔里克·布特林（Vitalik Buterin）计划利用`Bitcoin`开发加密货币之外的其他领域和用途。随后，他引入了智能合约并尝试将其到`Bitcoin`网络。在受到`Bitcoin`组织的反对后，他开发了名为`Ethereum`的自己的区块链，以及名为`ether`（`ETH`）的自己的加密货币。在区块链的第二代中，它将业务逻辑以智能合约的形式到应用程序中。目前，`ETH`是全球仅次于`BTC`的第二加密货币。2015
    年，Linux 基金联合 IBM、Intel 和 SAP Ariba 开发了一个名为`Hyperledger`的企业私有区块链。结果是交易速度提高了，并且具有高度的可扩展性，使得小型区块链网络能够满足各个组织的预期。这是区块链网络演变的第三代[1。


    ## 5.2 分布式账本技术


    在传统的文档共享系统中，多个权威无法汇总资源，信息无法同时管理或处理。例如，如果 A 人员更新并将文档发送给 B 人员，B 人员无法无法更新或修改。他/她必须更新最新的文档并重新发送给
    A，即使是微小的更新，这也是一个耗时的过程。随后，中心化平台的引入通过指定一个中央权威/媒介来维护文档，实现了同步更新，如图 5.1 所示。同时，由于完全依赖单个节点是不安全的，中心化的文档共享机制出现了单点故障。


    ![图 5.1 中心化系统。](img/fig5_1.jpg)


    图 5.1 中心化系统。


    去中心化存储机制是一种可行的解决方案，它将权限授予多个本地权威而非单个节点。去中心化组织依赖本地社区，因此消除了单点故障，如图 5.2 所示。去中心化系统需要多个协调点。因此，任何本地治理机构的故障都可能导致网络断开[2]。


    ![图 5.2 去中心化系统。](img/fig5_2.jpg)


    图 5.2 去中心化系统。


    分布式网络是节点组，每个节点都是独立的且相互连接的。区块链是一个分布式且不可篡改的数据库，在没有任何中央监控机构参与的情况下运行。数据不存储在中心位置，这防止了丢失。因此，网络中的每个实体都拥有相同的权限。网络中的每个节点都维护一份全局数据表的本地副本。这被称为分布式账本，它通过时间戳维护网络实体之间的所有交易，以保持防篡改的数据，如图
    5.3 所示。目前各种区块链框架在使用两种账本模型。未花费交易输出（`UTXO`）模型被`Bitcoin`网络使用。账户余额模型用于`Hyperledger`和`Ethereum`区块链框架。


    ![图 5.3 中心化与分布式账本。](img/fig5_3.jpg)


    图 5.3 中心化与分布式账本。

