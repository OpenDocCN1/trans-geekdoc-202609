    \ like the calculation of SHA3 hash can cost 30 gas. Hence, most of the computations\
    \ such as feature extraction, encryption, and feature comparison should be done\
    \ outside the smart contract.\n\n##### System Design\n\n1.  **Feature extraction\
    \ from biometric data**\n\n    Biometrics of a person is generated using various\
    \ sensors. For example, to use face as the biometric trait, cameras can be used\
    \ to capture the face of a person and extract the features from the captured image.\n\
    \n2.  **Storing the encrypted data**\n\n    The biometrics cannot be stored directly\
    \ in the blockchain as anyone can read the biometrics. Deploying the biometric\
    \ system in public blockchain is more safe and secure than using private blockchain\
    \ as it allows only a small number of trusted users to participate in the network.\
    \ By incorporating suitable encryption algorithm, the features are encrypted and\
    \ stored in the public blockchain.\n\n3.  **Feature comparison and authentication**\n\
    \nDuring authentication, the user’s biometrics are captured, features are extracted\
    \ and compared against the data stored in the blockchain. The comparison is done\
    \ by calculating the distance (Euclidean or Hamming) between the two biometrics\
    \ and finally user is authenticated when the biometric matches.\n\n##### System\
    \ Implementation\n\nA simple biometric system using facial features is implemented\
    \ to test the system. A python package called face\\_recognition is used to generate\
    \ the face encoding of a person and encrypt the feature vector using AES256 algorithm.\
    \ Then, the encrypted text is stored in the blockchain network (enrollment). The\
    \ text is retrieved and decrypted during the authentication process. The smart\
    \ contract deployed in the network is given below.\n\n##### Smart Contract\n\n\
    pragma solidity >=0.4.22 <0.8.0;\n\ncontract Face {\n\n//The encrypted face encodings\
    \ are stored in a mapping with address as mapping key\n\nmapping(address => string)\
    \ private faceEncoding;\n\naddress public admin;\n\nconstructor()\n\n{\n\nadmin=msg.sender;\n\
    \n}\n\nfunction addFace(address adr,string memory face) public\n\n{\n\n//Only\
    \ the admin (address used to deploy the smart contract) has the privilege to add\
