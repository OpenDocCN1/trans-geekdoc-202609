    of any specific concepts to understand the topics covered in this book. The explanations
    for the topics had been given with illustrations, examples, architectures, and
    code implementations wherever required. The book is organized into six chapters.
    They are Computing Paradigms, Edge Computing and Its Essentials, Edge Analytics,
