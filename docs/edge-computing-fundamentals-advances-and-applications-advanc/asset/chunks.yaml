    ### 5.9.2 Hyperledger


    Hyperledger is an open-source permissioned, private blockchain hosted by Linux
    foundation. It has no concept of cryptocurrency. It is designed for business-to-business
    applications. Private blockchain is suitable for the applications such as supply
    chain, aviation, banking, and so on. Hyperledger has frameworks such as Iroha,
    Sawtooth, Fabric, Indy, and Burrow. It also has tools such as Hyperledger Composer,
    Hyperledger Cello, Hyperledger Quilt, and Hyperledger Explorer. Framework and
    tools collectively build a blockchain application for several domains. Blockchain
    is not only meant for cryptocurrencies. So after Bitcoin, Ethereum came into the
    picture with the concept of smart contract to implement business logic and every
    transaction was also made public. In an enterprise market, the major objective
    of a system is to hide transactions from outside world or fellow nodes. So as
    to provide privacy in transactions among network entities, the private blockchain
    like Hyperledger Fabric was introduced.


    **Channels:** Private blockchain approach is applied in Hyperledger using channel
    concept. Channel defines permissioned network of entities with single, common
    ledger for all its transactions and state changes. Even within channels data and
    transactions confidentiality can be achieved using cryptographic methods.


    **Assets:** It represents tangible items or values that are transacted in the
    blockchain. Assets are represented as <key, value> pairs in JSON or Binary format.


    **Chaincode:** Chaincode provides functions for performing on the transacted assets.
    It implements application-specific rules and policies on the network.


    **Ledger:** Chaincode execution may result in state changes that are recorded
    in ledger. It maintains tamper-proof record of channel transactions.


    **Peers:** Peers are the participant nodes that initiate transactions and maintain
    the state of the ledger. There are three major types of peers: endorsing peers,
    ordering peers, and committing peers. Endorsing peers receive and validate the
    transactions. It then signs them and returns to creating applications. Ordering
    peers collect the signed transactions, order them into blocks, and send them to
    committing peers. Committing peers validate conditions such as double spending,
    signatures, and then commit them to ledger.


    **Hyperledger Fabric Consensus:** In Hyperledger framework, the consensus is achieved
    using the three consecutive mechanisms called endorse, order, and validate.


    **Ordering Service:** It is responsible for packing the transaction into different
    blocks.


    **Membership Providers (MSP):** It manages memberships and roles. The entities
    who want to participate in the Fabric network has to enroll in a trusted MSP.
    An organization manages its membership and the roles of the participating entities.
    These participating entities should have verifiable identity for realizing the
    trust. Implementation of MSP uses x.509 certificate as a digital identity. It
    determines the permissions for accessing the resources in blockchain network \[[11](#ch05.xhtml#ref5_11)\].


    **Client and Ledger Interaction:** Client application is external to the blockchain
    network that sends transaction request to the network. Developer develops client
    application and smart contract. Communication between client and smart contract/Chaincode
    happens over client SDK. The transaction request can either querying (get) or
    invoking (put and delete) transactions. Queries are responded by looking into
    world state key value store. World state can either be a couch DB or level DB.
    Put and delete operations make an impact both in world state and ledger. At the
    end of the transactions, event is emitted. A peer contains a blockchain and world
    state. Frequently transacted data reside in world state which help increase throughput.


