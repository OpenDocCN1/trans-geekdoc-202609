    ### 2.7.3.2 EdgeCloudSim


    `EdgeCloudSim` (15) 是一个基于 CloudSim 的开源工具，用于边缘计算的网络和计算资源仿真。各种模块包括：


    *   `Mobility` 模块通过更新哈希表中的 `x` 和 `y` 坐标来管理移动设备的位置。使用了 `Mobility` 类。内置模型是游牧移动。

    *   `LoadGenerator` 模块：为特定配置生成任务。默认情况下 `LoadGeneratorModel` 使用泊松分布。

    *   网络模块管理上传/下载的 LAN/WAN 参数。默认情况下 `NetworkModel` 内置单服务器队列模型。

    *   `EdgeOrchestrator` 模块：决定处理请求的资源。为了此目的，`EdgeOrchestrator` 类内置概率处理程序。

    *   核心仿真模块负责从配置文件加载并运行边缘计算场景。它还将执行结果保存到文件中。


    ## 2.8 研究方向


    边缘计算支持各业的数字化转型和数据多样化，通过在靠近数据产生的地方执行操作，已成为一个热门研究课题。一些研究方向 (16) 包括：


    #### 计算卸载

    由于 IoT 设备资源受限，更复杂的计算通常在云端执行。为了最小化网络传输延迟，可以将计算卸接到网络边缘的设备和资源上。因此，计算卸载是边缘计算的主要动力，并与任务调度密切相关。


    #### 资源分配

    一旦做出卸载决策，就需要将计算任务分配给合适的资源。如果子任务之间高度相关且不可分割，则将其分配到边缘资源。否则，这些子任务可以在节点上的多个资源上执行。基于任务的存储、计算、网络和能量需求的优智能资源分配是一个活跃的研究领域。


