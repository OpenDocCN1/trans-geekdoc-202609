  trans: '


    - 边缘计算 (`EC`)：在物联网环境中，优选在更靠近数据源（传感器）的地方进行计算。因此，此类处理器不仅消耗来自传感器的数据，还通过处理这些数据来产生数据。边缘设备位于数据源和云服务器之间。Cloudlet
    服务器作为移动应用和云的边缘，而 IoT 网关则作为 IoT 传感器与云之间的边缘。智能手机充当应用和云的边缘。它们可以执行计算、缓存数据或存储数据。边缘服务器还可以卸载数据或从云端获取服务。边缘服务器还可以代表云服务器为客户端提供服务。边缘计算基于设备，而雾网计算是基于位于局域网（LAN）的处理器。边缘计算和雾网计算旨在让计算靠近设备并实现去中心化。


    - 露计算 (`DC`)：旨在实现本地计算机/智能手机与云服务的协作潜力。它的目标是充分利用本地和云系统的潜力。它基于微服务器架构。虽然雾网服务器连接到云，但它们不必使用云服务。在露计算中，来自类似
    fitbit 设备的数据通过智能手机传输到云端并进行处理。因此，露计算始终使用云服务。


    - 雾露计算 (`FDC`)：IoT 设备通过本地连接连接到雾网服务器。雾网服务器通过互联网连接到云。因此，它可以在雾网服务器上离线计算，也可以在云服务器上在线计算。


    ![图 1.20 与雾网计算相关的范式](img/fig1_20.jpg)


    图 1.20 与雾网计算相关的范式


    雾网计算系统的高层架构由三层组成 [11,12,13] (图 1.21)：


    - 最底层由 IoT 平组成。该层由所有执行感知和执行功能的连接设备组成。


    - 雾层：使用虚拟和物理资源。该层可以执行小型和中级数据处理。通常对于时间敏感型应用，处理在该层中完成。它积累传感器数据，对其进行处理，并将执行信号发送到
    IoT 平。该层也可以进行资源虚拟化。通常，在该层中进行容器虚拟化。该层还可以从云层获取服务。


    - 云层：该层执行复杂的数据处理和存储。如果应用对时间不敏感，雾层从应用层获取服务以处理应用。


    ![图 1.21 雾网计算系统架构](img/fig1_21.jpg)


    图 1.21 雾网计算系统架构


    用户可以从雾层或云层获取服务。


    ### 1.9.4 渗透计算


    云环境提供了所需的资源（包括计算和存储）以执行传统 IoT 应用的功能。这种集中框架为延迟敏感型 IoT 应用引入了不必要的延迟。延迟感知应用需要在数据生成/使用的设备网络边缘进行处理。因此，根据应用的性质，云模型和边缘模型需要共存并协作。云-边缘平台的无缝集成只有在支持互操作性、隐私和管理的服务的支持下才能成功。渗透计算促进了此类服务在边缘云环境中的协作使用。为此，轻量级虚拟化机制非常合适。因此，渗透计算广泛使用容器化和微服务。


    软件应用由许多独立部署的模块化微服务组成。每个微服务执行一个独特的进程，并通过定义良好的轻量级机制（如容器）进行通信。容器封装了软件组件并确保减少了部署开销。因此，基于容器的方法有助于在网络边缘的设备上部署轻量级微服务。


    渗透计算通过在网络边缘提供增强的资源和数据管理能力，促进了云数据中心和网络边缘之间 IoT 微服务的有效执行。它还支持适当的数据传输协议以实现服务的无缝集成。渗透计算通过使用
    `dockers` 等轻量级容器，在异构云边缘环境中提供自动且安全的微服务部署。它的目标是高度分布和联邦化的环境，并实现跨越边缘和云基础设施的组成且相互连接的微服务的自动部署。


    渗透计算促进了跨云、雾网和边缘计算资源的服务迁移 [14]。它源于“渗透”（osmosis）一词，指允许溶剂分子通过半透膜从低溶质浓度区域移动到高溶质浓度区域，使溶液浓度相等。化学溶液类似于雾网环境的计算基础设施，其资源需求随应用和时间而变化。渗透计算旨在通过适当利用云、雾网和设备层的资源来平衡负载。这种负载均衡通过在云、雾网和设备层之间迁移服务来实现。


    渗透过程的主要元素包括溶质、溶剂、溶液、半透膜和浓度。从这些组件到渗透计算可以建立如下的类比：


    - `溶质`：这些粒子不被允许迁移。我们可以将计算基础设施中的溶质类比为计算能力、存储、能量等，具体取决于应用。


    - `溶剂`：溶剂可以通过半透膜在溶液之间迁移。对计算基础设施中相同事物的类比是服务。这些服务可以在云、雾网和边缘基础设施之间迁移，以提高应用的有效性。


    - `溶液`：包含溶质和溶剂。对溶液的类比包括由用户、设备、计算/存储资源、平台和服务组成的完整基础设施。


    - `半透膜`：控制溶剂的移动使溶液浓度相等。雾网环境在渗透计算框架中通过决定何时、何地以及如何迁移微服务来执行此功能。资源分配器根据应用决定微服务何时应在云、雾网和边缘资源之间迁移。基于资源可用性、延迟和负载平衡因素，微服务可以从一个资源迁移到另一个资源。迁移的技术支持可能包括轻量级容器服务。


    - `浓度`：代表由设备、雾网和云等各层可用资源所处理的微服务比例。


    因此，渗透计算模型基于渗透原理。用户面与雾层资源管理器交互，资源管理器根据应用需求将服务分为微服务和宏服务。这些资源管理器充当半透膜的作用，在边缘资源和云资源之间迁移服务，以提高应用性能。


