  raw: 'The distributed database distributes the content/data in different systems
    which are controlled and monitored by single entity. The blockchain distributed
    architecture is a network in which every node acts as an administrator. Each transaction
    in network is cryptographically verified and validated before it is being added
    to distributed ledger. Once a transaction is updated in blockchain, it is impossible
    to modify it. The ledger is comparable to the Linked List data structure as it
    is a cryptographically linked chain of blocks. Each of these blocks contains transactions
    that are validated by the entire network using the common consensus. In order
    to tamper or to change the content of distributed ledger, every network entity
    must reach a mutual agreement/consensus which is impossible. As the blocks are
    cryptographically linked, change in one block cannot be done without the revision
    of all succeeding blocks. The idea of blockchain is analogous to Google spreadsheet
    in the cloud where everyone can perform tasks simultaneously without losing any
    data but the difference is that the spreadsheet data is stored centrally on Google
    server. Instead in blockchain, each node of blockchain network possesses an identical
    copy of the latest version of ledger where all the transactions are updated with
    timestamp.


    ## 5.3 Role of P2P Architecture in Blockchain


    The P2P network consists of a group of peers/devices that cooperatively store
    and share the data in a network as shown in [Fig. 5.4](#ch05.xhtml#fig5_4). All
    peers in the network have the identical authority and power, and they carry out
    the same tasks. In payment service networks like Bitcoin, the P2P network generally
    is an exchange of digital assets in a distributed network where the buyers and
    sellers act without any intermediaries.


    ![Figure 5.4 P2P network.](images/fig5_4.jpg)


    [Figure 5.4 P2P network.](#ch05.xhtml#fg5_4)


    Blockchain integrates the idea of P2P network architecture and maintains a distributed
    ledger which every actor can trust, although the actors themselves might not be
    familiar with each other. The cryptographically secured P2P network architecture
    with Distributed Ledger Technology (DLT) prevents the problem of double spending
    possible in digital asset transactions. Double spending is the process of spending
    the same money to more than one entity where with physical money/cash systems
    it is impractical. A blockchain system combines cryptography solutions, P2P network
    features, and game theory aspects. Usage of public key cryptography and cryptographic
    hash functions ensures the transparency and privacy of transactions happening
    in the network. Blockchain network is managed by decentralized community over
    a P2P network through incentivization. Generally, game theory is a study of deliberate
    decision-making process. Here the transactions are validated using consensus mechanisms
    and the node that won in the validation process adds the next block to the chain
    and also the node gets economic incentives. The miner of the network whoever running
    the consensus algorithm and adding the block to the blockchain is given incentives.
    This process is called minting. The process of adding the next block to the blockchain
    based on consensus mechanism reminds the properties of game theory \[[3](#ch05.xhtml#ref5_3)\].


    ## 5.4 Blockchain Cryptography


    Cryptographic techniques are used in blockchain to ensure confidentiality, authenticity,
    authorization, non-repudiation, and integrity. Confidentiality in a transaction
    refers to the responsibility to guarantee that the information shared is kept
    secret. It is the ability to convert a readable message into unreadable format
    so as to improve privacy. Authenticity is the process of confirming the user’s
    identity to proceed further transactions. Authorization is the process of providing
    user permission to access a specific resource. Non-repudiation proves whether
    the sender really sent this message or not. Integrity makes sure that the message
    is not tampered during the transmission as shown in [Fig. 5.5](#ch05.xhtml#fig5_5)
    \[[4](#ch05.xhtml#ref5_4)\].


    ![Figure 5.5 Cryptographic properties.](images/fig5_5.jpg)


    [Figure 5.5 Cryptographic properties.](#ch05.xhtml#fg5_5)


    Blockchain technology uses cryptography mechanisms in multiple ways: for instance,
    for wallets, transactions, security, and privacy preservation. The following are
    the most extensively used cryptographic techniques in blockchain:


    *   Public key cryptography


    *   Hashing


    *   Merkle tree


    *   Digital signature


    **Public Key Cryptography (Asymmetric Key Cryptography):** In symmetric key mechanisms,
    a single secret key is used for both encryption and decryption processes. Although
    these systems are fast and efficient, a separate key is required for every user.
    For N users in a system, N\*(N-1)/2 keys are needed. Storing and maintaining these
    large numbers of key secure and transmitting the key among parties is an issue.
    Hence, blockchain uses public key cryptography mechanisms.


    Asymmetric key cryptography uses two keys: private key and public key. If person
    A wants to transfer a message to person B, person A encrypts the message using
    person B’s public key which is available to everyone in public. Person A transmits
    an encrypted message to person B. Person B then decrypts the message using its
    own private key which is not present to anybody else. Here, public key is derived
    from private key but vice versa is impossible.


    Commonly used public key cryptography technique is RSA. In blockchain, even more
    secure and faster public key cryptographic mechanism called elliptic curve cryptography
    (ECC) is used. With key of size 256 bits, ECC achieves more security compared
    to key of size 3072 bits in RSA \[[5](#ch05.xhtml#ref5_5)\]. ECC algorithm provides
    better security with smaller key size than RSA. ECC is based on non-singular elliptic
    curves and points arithmetic concepts, hence it is secure and faster. The following
    is an elliptic curve equation:


    *y*² = *x*³ + *a**x* + *b*


    Consider M is the message to be transmitted. Public key (Q) is derived using private
    key d in range 1 to N-1. For instance, public key is generated using the formula
    Q = d \* P, where P is a point in the elliptic curve, d is private key, and Q
    is public key.


    **ECC Encryption:** Randomly select k from 1 to N-1. “m” is message to be transferred
    and represented by M on the elliptic curve. Hence, two ciphertexts C1 and C2 are
    generated using point arithmetic techniques as below.


    *C*1 = *k* \* *P*


    *C*2 = *M* + *k* \* *Q*


    **ECC Decryption:** Original message (M) is extracted from two ciphertexts C1
    and C2 using private key (d) as below.


    *M* = *C*2 − *d* \* *C*1


    **Hashing:** Hashing is a process of transforming the text of arbitrary length
    to a text of fixed length. The main objective of hashing is to preserve integrity.
    Bitcoin network uses SHA-256 as hashing mechanism. Keccak is a modified version
    of SHA and it is used in Ethereum blockchain network which is faster than SHA.
    A strong hashing algorithm must satisfy the following properties:


    *   Even a small change in the input data produces a drastic difference in the
    output. It is called as avalanche effect.


    *   Hashing is always one-way function and it ensures that the original text cannot
    be retrieved back. Given H(x), it must be computationally difficult to find x.


    *   It must be collision free. This property ensures the unique hash value.


    Hashing can either be linear hash or tree-based hash. Since the transactions are
    dynamic, linear hashing is not suitable for blockchain. Rehashing is required
    for every insertion and it must traverse all the nodes every time. Hence, tree-based
    hash is used in blockchain. In this regard, rehashing is needed only when the
    specific path has to be recomputed. It reduces the complexity to log N.'
