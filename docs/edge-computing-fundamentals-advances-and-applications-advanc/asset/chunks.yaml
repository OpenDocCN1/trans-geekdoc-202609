    PureEdgeSim 包含各种模块：


    *   `Scenario Manager`（场景管理器）：该模块加载用户场景和仿真参数。模块中的文件解析器类检查输入文件并加载仿真参数。仿真参数类持有各种参数。

    *   `Simulation Manager`（仿真管理器）：该模块启动仿真、调度事件并生成输出。该模块的仿真管理器类管理仿真、调度任务；而 `Simulation
    Logger` 类生成并保存仿真输出。

    *   `Data Center Manager`（数据中心管理器）：该模块负责所有数据中心和设备的生成与管理。它由两个类组成。`Server Manager`
    类生成服务器、边缘设备、主机和虚拟机。`Data Center` 类维护边缘设备的属性，如位置、移动性、能量源和容量。

    *   `Tasks Generator`（任务生成器）：该模块为每个边缘设备分配如医疗健康、智能家居和增强现实等应用。然后根据应用生成任务。

    *   `Network Module`（网络模块）：该模块负责任务、请求、容器等实体传输。

    *   `Tasks Orchestrator`（任务编排器）：该模块包含用户定义的编排算法。

    *   `Location Manager`（位置管理器）：该模块生成移动设备的移动路径。


    ### 2.7.2 IoTSim-Edge


    IoTSim-Edge [13] 扩展了 CloudSim 的功能，纳入边缘和 IoT 设备的不同特性。组件之间的通信由事件管理系统处理。IoT 层模拟不同类型的
    IoT 设备，如汽车传感器、医疗设备、智能家居等。本段讨论了 IoTSim-Edge 的整体架构（图 2.6）。由这些传感器收集的数据在边缘数据中心进行处理。该边缘数据中心由异构处理设备组成，如智能手机、笔记本电脑、树莓派或服务器。IoT
    设备与边缘设备之间的通信通过通信协议实现。提供了异构网络层和应用层协议。Edge-IoT 管理层通过接收用户层的请求并使用 Edge-IoT 资源处理请求来协调处理。图形用户界面（GUI）提供设备配置和策略。Edge-IoT
    管理层配置 `Edgelet`、策略、移动性、电池、同步、 QoS 以及网络、通信、传输和安全协议。IoT 应用表示为微元素（MEL）的有向无环图（DAG）。每个
    MEL 抽象地表示资源、服务和数据。


    ![图 2.6 IoTSim-Edge 架构。](img/fig2_6.jpg)


    图 2.6 IoTSim-Edge 架构。


    提交由边缘设备执行的任务/作业称为 edgelet。与边缘设备连接的主要类包括：


    *   `EdgeDataCenter` 类建立边缘与 IoT 设备之间的连接。该类还执行边缘资源供给、调度和边缘处理监控。

    *   `EdgeDataCenter` 特性类维护 `EdgeDataCenter` 的属性，如策略、IoT 协议和 IoT 设备。

    *   `EdgeBroker` 类代表用户操作。它通过 `EdgeDataCenter` 类发起边缘与 IoT 设备之间的连接建立。其他功能还包括与资源协商、提交
    IoT 和边缘请求以及接收结果。

    *   `EdgeDevice` 类根据 `EdgeLet` 策略展示边缘设备在接收和处理 IoT 生成的数据模型。`Battery` 类和 `Moving
    Policy` 类提供手机手机等边缘设备的电池和移动条件。

    *   `MicroElement` (MEL) 类模型化边缘数据中心对 IoT 数据执行的操作。`Edgelet` 类模型化需要在 MEL 内部执行的任务。


    与 IoT 设备连接的主要类包括：


    *   `IoTdevice` 类模拟了真实 IoT 设备在感知、处理、移动性、数据速率等方面的行为。由于 IoT 设备通常是自供电且移动的，存在 `Battery`
    和 `Mobility` 类来赋予其这些属性。

    *   `Network` 类模型化了网络协议。

    *   `IoTProtocol` 类模型了基于 QoS 的异构网络层和应用层协议。

    *   `UserInterface` 类提供了必要的方法，允许用户通过交互式界面定义 IoT 应用，并将其转换为配置文件。


    IoTSim-Edge 中的任务执行工作流（图 2.7）所示如下：


    *   初始化 IoT-Edge 环境。用户应用与 `EdgeBroker` 通信。

    *   Edge Broker 启动 IoT 设备并连接它们。

    *   Edge Broker 指令 `EdgeDataCenter` 将 IoT 设备连接到 MEL。

    *   一旦连接，通知 IoT 设备。

    *   IoT 设备感知并生成一个 edgelet（任务）。

    *   根据资源，IoT 设备对 edgelet 进行初步处理。

    *   IoT 设备将 edgelet 发送到 IoT broker。

    *   MEL 处理数据并将结果发送到 IoT broker。

    *   `EdgeDataCenter` 持续监控 IoT 设备的属性，如电池电量和位置。

    *   IoT broker 向用户报告。


    ![图 2.7 工作流。](img/fig2_7.jpg)


    图 2.7 工作流。


    ### 2.7.3 iFogSim


    雾是用户和远程（公共）云之间的中间层。该层比云更接近用户，因此可以提高网络性能。边缘计算具有编程系统，通常位于用户所在地。雾层是边缘设备和雾层之间的计算平台。边缘计算可以在没有雾层的情况下工作。


    iFogSim 是用于边缘、雾和 IoT 环境的事件仿真器 [14]。它使用 CloudSim 处理各种组件的事件。以下是模拟雾网络所需的 iFogSim
    类：


    *   Fog device（雾设备）

    *   Sensor（传感器）

    *   Actuator（执行器）

    *   Tuple（元组）

    *   Application（应用）

    *   Monitoring edge（边缘监控）

    *   Resource management service（资源管理服务）


    iFogSim 具有分层架构（图 2.8），由：


    *   `Device layer`（设备层）由 IoT 传感器和执行器组成，作为数据的源或汇。传感器发射具有特定属性的数据，包括发射的大小。网络特性包括延迟、带宽等。该层通过传感器和执行器类实现。`Sensor`
    类维护刻画摄像头或温度传感器的属性，以及网络能力和生成的数据。`Actuator` 类刻画执行器以及接收来自雾设备的数据模式。

    *   `Fog device`（雾设备）可以托管应用模块。网关是连接 IoT 设备到网络的雾设备。雾层可以在公共云和设备层之间托管私有云。资源以层次方式排列。计算卸载可以从低层到高层。它通过
    `FogDevice` 类实现，该类维护内存、处理器、存储大小、上行带宽和下行带宽等属性。该类包含为应用模块调度、分配和撤销资源的方法。


