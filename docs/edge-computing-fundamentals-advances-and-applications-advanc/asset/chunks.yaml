    ## 1.8 Cloud Computing


    Cloud computing is a form of utility computing just like grid, where users pay
    for the computing resources used by them. Cloud `[[9](#ch01.xhtml#ref1_9)]` is
    defined as a parallel and distributed system consisting of a shared pool of abstracted,
    virtualized, dynamically managed computing resources (like storage, computing,
    platforms, network, applications) that are maintained in data centers. The resources
    are dynamically provisioned and reconfigured based on demand from the user. Hence
    resource management in cloud is elastic in nature. This is done automatically
    with less manual intervention. Hence services are abstracted from the user. `SLA`
    acts as a contract between the service provider and consumer. Users are then charged
    based on their usage of the computing resources. This forms a business model.
    From business point of view, this model reduces the capital and operational expenses
    of an organization.


    ### 1.8.1 Characteristics of Cloud Environments


    Cloud computing models enable ubiquitous, convenient, on-demand network access
    to a shared pool of configurable computing resources. The following are the key
    characteristics of a cloud computing environment:


    *   Service-oriented architecture: All functionalities are offered to users as
    services through interfaces. These services can be easily extended, composed,
    orchestrated to offer the desired functionality to the user. `SOA` facilitates
    loose coupling and abstraction. Services can be customized to meet the user needs.


    *   `On-demand self-service`: Services can be provided dynamically, without human
    intervention as and when required by the user.


    *   `Broad network access`: The cloud provides services to heterogeneous client
    devices such as mobiles, laptops, and workstations through a standard network
    like the Internet.


    *   `Resource pooling`: The provider’s resources are pooled and allocated/de-allocated
    to users dynamically, on-demand.


    *   `Rapid elasticity`: The resources in the cloud are dynamically provisioned
    and released on-demand as and when required.


    *   `Measured service`: The services are metered and monitored.


    *   `Location independence`: Users access the cloud anywhere and anytime.


    *   `Business Model`: Cloud computing provides a business model where the resource
    is based on usage.


    *   `Virtualization`: This technology abstracts the hardware/software from the
    user. One resource is compartmentalized into many. This has resulted in multitenancy.


    ### 1.8.2 Cloud Models


    Cloud computing models are categorized based on their delivery or based on deployment
    model. These two categories are discussed.


    #### 1.8.2.1 Cloud Services


    The cloud services model defines the core functionality of the services at different
    levels. These are categorized as follows:


    *   `Infrastructure as a Service` (`IaaS`) allows providers to set up and deliver
    virtualized hardware resources such as storage, compute, and networking. Communication
    as a Service and Data storage as a Service are also some examples of IaaS. This
    falls under utility computing.


    *   `Platform as a Service` (`PaaS`) offers developers with the tools, platforms,
    and environment to build and deploy their applications. It includes runtime execution,
    databases, APIs. This is also termed framework computing.


    *   `Software as a Service` (`SaaS`) offers applications operating in the cloud
    that can be accessed remotely on-demand by the end-users. Users are thus freed
    from the burden of installing and using the required software locally. It is termed
    business computing.


    #### 1.8.2.2 Cloud Deployment Models


    Based on the functionality and accessibility of cloud services `[9]`, the cloud
    offers four deployment models `([Fig.18](#ch01.xhtml#fig19))`:


    *   `Public cloud`: Users access resources including infrastructure, frameworks,
    applications, and services provided by the service providers over the Internet.
    Users subscribe to the services they access and have to pay based on their usage.


    *   `Private cloud`: This type of cloud is in-premise and services are offered
    over the intranet. It is more secure when compared to a public cloud.


    *   `Hybrid cloud`: It is composed of multiple public/private clouds. This model
    offers the advantages of public and private deployment models.


    *   `Community cloud`: This can be a public/private cloud shared by a set of organizations
    under the same administrative domain.

