    The smart contracts are compiled using the command “Truffle compile”. Then the
    Application Binary Interface (ABI) of the compiled contracts are generated. The
    contracts are pushed into the blockchain network. The directory of ABIs generated
    and port number for the blockchain networks are to be set in “truffle-config.js”.
