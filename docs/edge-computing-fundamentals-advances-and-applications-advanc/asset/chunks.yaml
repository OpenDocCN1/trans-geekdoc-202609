    *   `Reduced cost`: 通过重用和动态重配置，可以显著地降低成本。


    因此，在真正的分布式系统或点对点（`P2P`）系统中，控制权是去中心化的。在客户端-服务器架构中，客户端的角色是提交作业，而服务器完成作业并返回给客户端。在
    `P2P` 系统中，客户端和服务器节点之间没有区别。对于某些任务，客户端可以执行服务器功能。系统是具有分布式控制的自组织系统，不需要中央服务器的集中协调。`P2P`
    系统最初出现是因为文件共享的需求（图 1.6）。`P2P` 系统的主要优势包括：


    *   工作共享

    *   可扩展性

    *   自主性

    *   无单点故障

    *   可靠性

    *   降低成本

    *   协作


    ![图 1.6 客户端-服务器与 P2P 系统对比。](img/fig1_6.jpg)


    图 1.6 客户端-服务器与 P2P 系统对比。


    与集中的客户端-服务器系统相比，`P2P` 环境中的安全和信任管理更为复杂。系统应该能够管理和维护异构节点。


    ## 1.5 集群计算


    并行处理系统实现了高性能，但它们紧密耦合且成本高昂。这种并行性可以使用通用系统的集群来实现。集群通常由同质的通用硬件组成，由主服务器集中控制。集群操作系统透明地处理任务分配、监控和收集，而无需用户参与。集群中所有节点共享的操作系统软件负责透明地分配任务和收集结果，不需要用户过多参与。


    考虑一个由大量音乐家组成的乐团，他们共同演奏许多不同的乐器，并由指挥家领导。乐队可以被视为集群计算的类比（图 1.7b）。集群是一种并行或分布式处理系统，它由一组相互连接的独立计算机组成，作为一个单一的集成计算资源协同工作（类似于各种乐器）。集群的主要特征是节点是同质的，并由主节点集中控制（类似于乐团中的指挥家）。集群操作系统充当中间件，将作业拆分为任务并将任务通信给工作节点。一旦工作节点完成任务，控制器就会收集结果并通知客户端。因此，工作是由集群透明地完成的。集群中间件为用户提供了整个集群的单一系统映像（SSI）。集群的一些组件包括以下内容
    [4]（图 1.7a）：


    1.  用于控制集群的协调节点。

    2.  拥有自己的资源（如处理器、内存和存储）的工作节点。

    3.  提供工作节点与协调节点之间通信的网络。

    4.  作为外部世界与集群之间防火墙的网关。


    ![图 1.7a 集群架构。](img/fig1_7a.jpg)


    图 1.7a 集群架构。


    当集群 `[7]` 被网关保护时，它被称为封闭集群。当集群节点可以被自由访问时，被称为开放网关。


    ![图 1.7b 乐团 - 集群的类比。](img/fig1_7b.jpg)


    图 1.7b 乐团 - 集群的类比。


    以下是集群计算的一些益处：


    1.  与大型机相比，集群能够实现高性能效益。集群系统由通用硬件组成，比大型机便宜得多。

    2.  由于集群拥有多个节点，可以并行运行。集群的性能高于单机，与大型机相当。

    3.  与大型机相比，集群具有良好的容错性。当集群中的节点故障时，功能由另一个节点接管。这在大型机上是不可能的。

    4.  集群系统可扩展的。向集群中添加新节点不会影响其他节点。


    集群提供了两种并行模型：


    *   共享内存模型：所有处理器共享公共主内存，通信通过内存进行。这是一种紧耦合的并行系统。

    *   分布式内存模型：每个节点都有自己的资源（包括内存），通信通过网络进行。这形成了松耦合的分布式系统。


    集群的基本目标是通过聚合各个节点来提供高性能，通过平衡节点间的负载来优化集群效率，并维护冗余以处理故障。因此，根据功能，集群分类如下：


    ### 1.5.1 高性能集群


    当作业需要高性能计算时，作业被拆分为称为任务的小单元并分配给集群中的各个节点。节点中的处理器等资源完成任务并将结果返回给协调节点。由于作业由多个节点并行执行，因此完成很快（图
    1.8）。


    ![图 1.8 任务并行。](img/fig1_8.jpg)


    图 1.8 任务并行。


    ### 1.5.2 负载均衡集群


    负载均衡集群将任务分配给负载最少的工作节点。负载均衡器具有持续获取工作节点资源利用率的监控器。协调节点/控制器接收用户作业，使用负载均衡器识别最空闲的节点并将其分配给最空闲的工作节点（图
    1.9）。


    ![图 1.9 负载均衡。](img/fig1_9.jpg)


    图 1.9 负载均衡。


    ### 1.5.3 高可用集群


    当关键作业在集群中执行且执行作业的工作节点发生故障时，作业无法完成。为了处理此类故障，中间件负责分配集群中的另一个节点来完成作业，并将中断降至最低。这种容错的集群被称为高可用。为了实现高可用性，中间件应该通过心跳消息持续监控节点的可用性。这由协调节点进行集中监控（图
    1.10）。


    ![图 1.10 容错性。](img/fig1_10.jpg)


    图 1.10 容错性。

