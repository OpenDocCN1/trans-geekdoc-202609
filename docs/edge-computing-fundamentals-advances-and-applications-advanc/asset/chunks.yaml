    - **RFID**: radio frequency identification uses wireless electromagnetic fields
    to identify objects. It is used in manufacturing lines, identification systems,
    and toll booths. It can be replaced by `NFC`.

    - **Ethernet**: is a wired computer network technology used in `LAN`, `MAN`, `WAN`.
    One branch of `Ethernet` can connect up to 1,024 nodes. It provides data link
    and physical layer services.

    - **Z-Wave**: works in sub 1 GHz RF band. It is used for low latency, low power
    applications especially in home automation systems.

    - **Thread**: This is an IPv6 protocol based on `LowPAN`. It complements `Wi-Fi`
    technology in home automation. It is an `IEEE 802.15.4` based mesh networking
    protocol. It works in 2.4 GHz frequency and covers a distance of 10–30 m. It can
    handle up to 250 nodes.


    ![Figure 2.3 IoT communication protocols.](images/fig2_3.jpg)


    [Figure 2.3 IoT communication protocols.](#ch02.xhtml#fg2_3)


    [Table 2.1](#ch02.xhtml#table2_1) compares the above-mentioned protocols in terms
    of frequency, data rate, range of communication, power efficiency, and cost.


    ### Table 2.1 Comparison of common network layer protocols for edge systems


    | Protocol | Frequency | Data rate | Range | Power usage | Cost |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | **Bluetooth** | 2.4 GHz | 1 to 3 Mbps | 300 feet | Low | Low |

    | **Wi-Fi** | 2.4, 5 GHz | 0.1 to 54 Mbps | <300 feet | Medium | Medium |

    | **ZigBee** | 2.4 GHz | 250 Kbps | 300 feet | Low | Medium |

    | **LTE** | Cellular bands | 1 to 10 Mbps | Miles | Medium | High |

    | **LoRa** | 923 MHz | <50 Kbps | 100 kms | Low | Medium |

    | **RFID** | 860 to 960 MHz | Up to 100 Mbps | Up to 100 m | Low | High |

    | **Z-wave** | Sub GHz | 40–100 Kbps | 100 feet | Low | Medium |

    | **Thread** | 2.4 Ghz | 40–250 Kbps | 10 m | Low | Medium |

    | **NFC** | 13.56 MHz | 106 to 424 kbps | <10 cms | Low | Low |


    Data transfer protocols provide set of rules to establish point-to-point communication
    with the hardware without Internet connection. It is used for messaging purpose.
    They provide the rules to define syntax, semantics, error recovery, and data synchronization.
    Some of the commonly used data protocols include:


    - **MQTT**: Message Queue Telemetry Transport is a subscribe/publish protocol
    layered over Transmission Control Protocol (`TCP`). This protocol supports event-driven
    messaging in low-cost, resource-constrained devices. `MQTT` is used in fire detectors
    and car sensors. `Mosquitto` is an open-source `MQTT` broker.

    - **AMQP**: Similar to `MQTT`, the Advanced Message Queuing Protocol (`AMQP`)
    provides a publish/subscribe architecture over `TCP`. The publisher''s messages
    are received through exchange that distribute them to queues. Queues represent
    various topics. Listeners subscribe to these topics. When data is available under
    these topics, subscribers receive the information. It can be used in the device
    edge to ingest data from various IoT devices.

    - **XMPP**: The Extensible Messaging and Presence Protocol was standardized by
    `IETF` for message exchange based on publish/subscribe architecture. It uses `TCP`
    for transport layer with `SSL/TLS` based security.

    - **CoAP**: The Constrained Application Protocol (`CoAP`) is an application layer
    protocol that can be used in resource-constrained wireless sensor network nodes.
    It has features of `HTTP` along with multicasting, low overhead, low energy, and
    simplicity. It is a request-response type of protocol.

    - **HTTP**: Hypertext Transfer Protocol is a commonly used Internet protocol in
    applications like additive manufacturing to connect computers with 3D printers.
    `RESTful` architecture is considered for IoT environments. However, `HTTP` is
    not preferred due to its cost and energy efficient.


    `DDS` (Data Distribution Service for real-time systems), `LLAP` (Lightweight Local
    Automation), `LWM2M` (Lightweight M2M), `SSI` (Simple Sensor Interface) are also
    commonly used. The next section discusses the importance of.


    ## 2.5 Network Management and Control


    Reconfiguring and managing devices like routers manually is impractical and inefficient
    due to the following reasons:

    - Increase in time and cost.

    - Vulnerability to security threats due to proliferation of IoT devices.

    - Increase in downtime.


    This necessitates the use of a network management solution. Software-defined networking
    (`SDN`) [[8](#ch02.xhtml#ref2_8)] is a networking architecture that enables software
    applications to programmatically control the network. The layout of the network
    is configurable. `SDN` provides network management by decoupling the control plane
    and the data plane. `SDN` enables better network management by:

    - Facilitating device configuration and bandwidth allocation.

    - Using security policies and improved access control for overcoming security
    threats.

    - Enabling quick deployment and unified management of all ICT resources.

    - Using intelligent techniques for troubleshooting and management of networks.

    - Supporting quick and flexible interworking with multiple data platforms and
    providing capability to collect, analyze, and upload data from IoT devices.

    - Decoupling of network connections facilitates unified data uploading.


    Simplified network management with `SDN` will make IoT systems more reliable,
    real-time, secure, scalable facilitating unified management. A layered architecture
    for network management [[9](#ch02.xhtml#ref2_9)] ([Fig. 2.4](#ch02.xhtml#fig2_4))
    using `SDN` is given below:


    > **Perception layer**: consists of various devices. Sensors collect data for
    various applications. Actuators receive commands from the network to perform various
    tasks.


    > **Communication layer**: consists of `SDN` gateways and routers, to transfer
    data. These gateways are programmatically controlled by the `SDN` controller.
    Some of the functionalities of such gateways include data transfer, data storage
    and processing as directed by the controller. These gateways also perform node
    management, protocol conversion and security control.


    > **Computing layer**: contains `SDN` controller. The controllers control not
    only data transfer but also process data. Some of the functionalities of the `SDN`
    controller include:

    > - **Device management**: includes configuring, managing of routers/gateways
    as well as establishment of policies and rules for collection and processing of
    data in various devices.

    > - **Service management**: includes adding or deleting various services and policies
    supported by gateways and for data management/storage.

    > - **Topology management**: includes routing and topology updation.

    > - **Operation and maintenance**: of logs, monitoring and managing the functional
    modules.

    > - **Security management**: including authentication and access control.

    > - **Network activation**: using container based virtual network functions.

    > - **Implementation**: of `SDN` southbound (`SB`) and northbound (`NB`) interfaces.


    ![Figure 2.4 SDN-based architecture for network management.](images/fig2_4.jpg)

