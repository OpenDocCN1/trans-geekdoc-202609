    - Better flexibility and scalability as new infrastructures can be added on the
    fly without affecting the services being offered.

    - Better resource utilization as the same resource is shared virtually among many
    users.

    - Data backup and disaster recovery are handled automatically by the service providers.

    - Cloud resources can be used anywhere anytime using any access technology by
    the users.

    - Cloud resources are highly available as another instance can be started on failure
    of the existing instance.


    Some of the challenges faced in cloud computing include:


    - Reliable Internet Connection should be available to access the resources.

    - Security of customer’s data is managed by the service providers.

    - Dependency on cloud service providers/vendors.


    ## 1.9 Other Computing Paradigms


    ### 1.9.1 Ubiquitous Computing


    This section compares ubiquitous, pervasive, and mobile computing. Desktop computing
    enables a user to carry out computing functionalities using a single desktop.
    Here a single desktop is used by a single user. Ubiquitous computing moves to
    the era when invisible resources are used by many users. It is a many-many relationship.
    Ubiquitous computing, which means "omnipresent". Cloud is a ubiquitous environment
    as users can access the remote resources hosted in the cloud using Internet and
    various access technologies. Even though resources do not move, these resources
    can be accessed from any location using Internet. Hence mobility is high. A pervasive
    computing environment embeds computing in various devices like IoT. The resources
    are much smaller when compared to that of mobile systems. Mobility of such systems
    is low. They are used in applications like smart homes. Mobile computing embeds
    computing in devices carried by the user. Mobile computing involves mobile communication,
    mobile hardware, and mobile software. The mobility of such systems is high. Computing
    using cell phones comes under this category. The main characteristics of ubiquitous
    computing are:


    - seamless access to remote information resources and fault-tolerant communication

    - when compared to pervasive and mobile computing, the user does not possess the
    resources and hence does not have control over the remote resources.

    - The user can access the resource anytime, anywhere using suitable access and
    communication technologies.


    The major limitations of ubiquitous computing include:


    - Limitations of network bandwidth and network coverage.

    - Battery-powered devices are energy-constrained.

    - Security risks on using various access devices and public networks.

    - Size of Input/output screens of mobile and pervasive devices.


    ### 1.9.2 Jungle Computing


    Traditional high-performance computing was restricted to supercomputers. The emerge
    of clusters, grid, and cloud computing paradigms also facilitated high-performance
    computing as the tasks could be executed in parallel in various worker nodes.
    Various high-performance computing infrastructures like supercomputing, grid,
    and cloud can be connected using a huge high-speed communication network. Such
    an ensemble of heterogeneous systems forms a “Computing Jungle” ([Fig. 1.19](#ch01.xhtml#fig1_20))
    When a user submits an application, the middleware identifies which HiPC infrastructure
    is best. It then uses suitable tools to compile and deploy the application in
    the infrastructure. Communication network ensures communication between various
    HiPC infrastructures and the user.


    ![Figure 1.19 Jungle computing.](images/fig1_19.jpg)


    [Figure 1.19 Jungle computing.](#ch01.xhtml#fg1_20)


    Task complexity decides the computing environment. Hence a suitable high-performance
    computing environment may be chosen based on the task’s needs. Some of the characteristics
    of jungle computing include:


    - Resource independence and heterogeneity: Resources differed considerably in
    their storage and processing capabilities. Hence a middleware is needed to hide
    details of the resources from the user.

    - Middleware: Each HiPC system has its own middleware. The Compute Jungle’s middleware
    ensures interoperability between them.

    - Robust connectivity ensures reliable communication with HiPC systems in the
    jungle.

    - Unique resource identification overcomes resource conflicts.

    - Malleability provides flexibility to adapt to changes in the resources.

    - Fault-tolerance to handle system failures and restore application state.

    - Automated conversion from serial to parallel code. This feature eliminates the
    need for expertise in parallel programming paradigm.

    - Middleware also integrates legacy codes with Jungle software.


    The major limitations of jungle computing include:


    - Management of resources belonging to different administrative domains.

    - Difficulty in interconnecting various high-performance computing systems.

    - When a particular computing environment is chosen on the fly, system software
    like compilers and executable application code created face interoperability issues.


    ### 1.9.3 Fog Computing


    The major issue in cloud computing is that all the data has to be transferred
    to Centralized Computer Clusters to carry out the computations. This involves
    network latency. We all might know about `Hadoop` framework used for processing
    big data in a cloud environment. The basic concept of `Hadoop` is to move compute
    close to data located in a particular data node. By doing so data movement is
    minimized and network latency is reduced. A similar situation also occurs in fog
    computing. Here processing and storage resources are typically located near the
    network edge, close to the devices generating information. So fog computing is
    more suitable for latency-aware applications like smart city, healthcare, and
    augmented reality. Fog computing is a virtualized platform, where computing resources
    like processor, storage, and network are placed at the edge of the cloud, instead
    of establishing communication channels for cloud storage and processing. Typically
    the processing is done between the user and the cloud. Cloud can be used to process
    applications that are not real-time and for long-term storage of data.


    Some of the characteristics of fog computing \[[10](#ch01.xhtml#ref1_10)\]


    - Proximity of frequently used data and computing to end-users.

    - Location-aware processing reduces latency.

    - Geographically distributed processing ensures scalability and speed.

    - Promotes usage of sensor networks to gather data.

    - Supports location-based mobility.

    - Promotes real-time data processing at the edge of the network.

    - Supports heterogeneous resources and interoperability between them.

    - Can be optimized according to users as the fog server is directed networked
    to the user.

    - Fog localization and cloud globalization facilitate better analytics by filtering
    the data at the edge and performing globalized analysis or localized analysis.


    Some of the other paradigms highly related to fog computing are ([Fig. 1.20](#ch01.xhtml#fig1_21)):


    - Mobile cloud computing (MCC): Mobile devices are resource-constrained and hence
    may not be able to execute some services. Hence a lightweight cloud server called
    `cloudlet` is used at the network edge to overcome the resource constraints of
    mobile devices. The main constraint is reliable low-latency networking to edge
    servers.

    - Mobile edge computing (MEC): A mobile edge computing (MEC) server is collocated
    at the base stations of cellular networks. `MEC` server provides computing and
    storage facilities. A user request is forwarded to `MEC` for processing. If `MEC`
    cannot process the request, it is forwarded to the cloud server.

