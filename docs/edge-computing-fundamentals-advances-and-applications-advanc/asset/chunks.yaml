    ### 6.3.4 案例研究 III：使用体成分秤在边缘服务器检测热指数


    在日常生活中，身体健康状况是更重要的考虑。为了维持健康的生活，需要计算体重、`BMI`、体脂、瘦体质量、湿度和室内温度等体成分。体成分秤是一种利用生物阻抗法测量体成分的测量设备。生物阻抗法是家用秤计算体成分的常用方法。该设备使用四个导体来确定电流流经身体时产生的阻力，并据此计算总体水。从总体水中估算出九个数据点。该设备测量的九个数据点分别是体重、`BMI`、体水、瘦体质量、肌肉量、内脏脂肪和每日摄入量。该设备具有独立的室内温度湿度传感器，因此可以调节温度器以保持身体处于最佳状态。测量的湿度和室内温度值被传输到边缘服务器进行数据分析。湿度和室内温度用于测量热指数，其范围可能是
    `27°C` 到 `57°C`。湿度和室内温度的升高会导致热指数增加，从而引起疲劳、热射和中暑等健康问题。这些健康影响随热指数范围而异。热指数通过湿度和室内温度的相对比例计算。


    Borga 等人对基于脂肪参考定量 MRI 的常用非侵入性体测评估方法进行了简要概述。对于脂肪组织（`AT`）或组织（`LT`）的全身测量，DXA 和定量
    MRI 具有相应的线性相关性。但发现内脏脂肪组织的一致性显著较低 [11]。Bos 等提出了两种用于医疗保健预测分析的模型：Cox 比例风险模型和逻辑回归模型。他们提出了一种用于按位加密的标准的
    FHE 方案。这些回归模型的功能可以用整数值的多项式表达式来近似。这种方法的优点是单个密文包含的信息比单纯的一位明文要多得多 [12]。


    #### 6.3.4.1 热指数


    热指数定义为湿度和室内温度的影响量，以华氏度测量 [13]。人体受环境影响的程度。计算热指数的公式如下：


    $$HI = c[1] + c[2]T + c[3]H + c[4]TH + c[5]T² + c[6]H² + c[7]TH² + c[8]$$


    其中 `T` – 温度（°C），

    `H` – 湿度（%），

    `c[1]` = -8.784947556,

    `c[2]` = 1.6113941,

    `c[3]` = 2.338548389,

    `c[4]` = -0.1461605,

    `c[5]` = -0.0123094,

    `c[6]` = -0.016424777,

    `c[7]` = 0.00221173,

    `c[8]` = 0.00072546,

    `c[9]` = -0.00003582


    热指数范围可能是 `26°C` 到 `54°C` 及以上。随着温度和湿度的增加，热指数逐渐增加。热指数的极端范围会导致许多健康问题，如呼吸、脑脑和心血管疾病。热指数产生和影响如表
    6.6 所示。


    #### 表 6.6 热指数的产生与影响


    | 摄氏度 | 原因 | 影响 |

    | --- | --- | --- |

    | 26–32°C | 注意 | 疲劳、贫血、心衰风险 |

    | 32–41°C | 高度注意 | 肌肉痉挛、腹部和小腿痉挛 |

    | 41–54°C | 危险 | 脱水、肥胖 |

    | 超过 54°C | 极端危险 | 中暑——心脏疾病风险 |


