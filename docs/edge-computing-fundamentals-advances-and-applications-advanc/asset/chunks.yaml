    Blockchain will serve to control the sales and usage of guns and other harmful
    weapons. It tracks the gun flow from manufacturer to the end user. Every gun is
    linked to an individual who owns the gun. The blockchain protocol will efficiently
    implement the existing legal laws of possession of firearms without the need for
    any modification. All the data are immutable and the system keeps track of all
    the previous transactions of users which will come in aid during the background
    check. This reduces the extensive need of the workforce as well as minimizes the
    time taken to track the data of a user. This might help in controlling interpersonal
    violence and suicides as the owner of the weapons are tracked and any crime identified
    is recorded. Any inappropriate or offensive remarks in the records will only affect
    the credibility of the user to buy weapons in the future. The application will
    help the government body to track the crime and legitimacy of the user when providing
    the license.


    ## 5.11 Research Challenges and Future Research Directions


    - Research on the computation offloading of IoT device data with the help of Blockchain
    technology drastically improves the security and privacy of the data in a decentralized
    platform. Smart contracts can help define rules for handling the data in an effective
    manner.


    - Blockchain is not completely secure from certain vulnerabilities. Smart contracts
    when written and deployed cannot be modified. Hence, smart contract errors or
    faults may lead to vulnerabilities like DAO attack. Various research works can
    be incorporated to blockchain to prevent these attacks.


    - Exploring various incentive mechanisms and consensus mechanisms improves the
    quality of blockchain.


    - The data stored in blockchain are in an encrypted form. Exploiting big data
    analysis on encrypted data is still under research.


    - The number of transactions is reduced due to the computationally intensive consensus
    mechanisms. The scalability of the system can be enhanced by inculcating less
    computational intensive consensus mechanisms or by designing consortium blockchain
    network.


    ### Expert Notes By Dr. Bithin Alangot, Research Assistant, Singapore University
    of Technology and Design


    I got introduced into the blockchain technology while designing a framework called
    `HPlane` for remote healthcare monitoring systems. Our framework allows for efficient
    management of healthcare data such that the amount of data transferred between
    different distributed entities in the system is optimized. However, managing the
    access control models is too complex since the framework is used by multiple untrusted
    entities. Thus, blockchain technology severs as the perfect solution that can
    overcome the challenges with respect to access control in `HPlane`. But blockchain
    integration is not straightforward since (1) it can lead to privacy concerns and
    prone to eclipse attack, and (2) it does not scale well. Thus, the first work
    was to solve the scalability issues in blockchain which uses `PBFT` as the underlying
    consensus protocol. Later, I worked toward finding a solution to detect eclipse
    attacks on blockchain clients by designing a ubiquitous gossip protocol. This
    work was done in collaboration with researchers at Singapore University of Technology
    and Design.


    Another two interesting research works that I carry out with blockchain are (1)
    `SmartWitness`: Securing software supply chain using blockchain, and (2) `Decentralized
    Identity Authentication with auditability and privacy`. In the first project,
    the main objective was to use blockchain to prevent malicious software distribution.
    The system was built on the `Ethereum` blockchain platform, and the opportunity
    of being part of the project helped to build my expertise in blockchain. While
    the second project was toward solving an issue with Decentralized Identity (`DID`),
    a blockchain-based identity system. Our solution enables a user who owns a `DID`
    to detect if any malicious entity used his identity without knowledge. However,
    the challenge was in providing privacy since our solution relies on blockchains
    and any data on blockchain is publicly visible. We used a zero-knowledge succinct
    argument of knowledge (`ZK-SNARK`) and Verifiable Random Function (`VRF`) primitives
    to achieve privacy properties.


    The research on Decentralized Identity system using blockchain is still in its
    earlier stages and I am excited to contribute my idea to the community. Currently,
    I specifically look at verifiable credentials, zero-knowledge proofs, and identity-based
    encryption schemes.


    ## 5.12 Summary


    The IoT device when integrated to smart systems monitors and observes its functionalities
    without human interventions. Though it provides immense benefits to the system,
    there are certain shortcomings. The IoT devices generate massive data which actually
    handled by cloud servers. Real-time processing systems must provide response with
    minimized latency. Pushing data to cloud and processing over there delays the
    entire servicing time. Hence, edge devices are designed so as to provide the computations
    near to the source of the data. Edge devices are capable of handling real-time
    data and the IoT-generated data can be offloaded to process and to make decisions
    on time. In order to provide guarantee for tamper-proof data transactions, blockchain
    architecture is proposed with these edge devices. It drastically increases the
    security and privacy of the IoT-generated data in the network. Based on the applications
    and requirements, the type of the blockchain and consensus mechanisms can be preferred.
    Introducing smart contracts in blockchain helps in implementing tiny logic on
    IoT data onboard using edge instead of pushing it to cloud.


