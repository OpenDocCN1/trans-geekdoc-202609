    \n# 3 边缘分析\n\nDOI: [10.1201/9781003230946-3](https://doi.org/10.1201/9781003230946-3)\n\
    \n## 3.1 数据类型\n\n在统计学中，数据分为两类：定量数据和定性数据，如图 3.1 所示。定量数据也被称为数值数据，处理数字和可以测量的事物。例如，身高、体重、年龄、价格、温度、湿度等。然后它又被细分为离散数据和连续数据。\n\
    \n离散信息仅包含有限的可能值，使用整数进行计数。例如，排队中站立的人数（即 26 人）。连续信息包含特定范围内的无限可能值。例如，排队中站立的人的体重（即\
    \ 49.5 公斤）。\n\n![图 3.1 数据类型。](img/fig3_2.jpg)\n\n图 3.1 数据类型。\n\n定性数据也被称为分类数据，它们不是数值数据，而是使用自然语言规范定义的。例如，人的性别、出生地、语言、职业等。在某些情况下，它也带有数值。定性数据被细分为名义数据和序数数据。序数数据具有特定的顺序（例如：满意、良好、不满意）。\n\
    \n连续数据包含特定范围内的无限可能值。例如，排队中站立的人的体重（即 49.5 公斤）。\n\n定量数据具有特定的数学意义。。数据的类型对于数据分析至关重要，如果处理不当，将会产生错误的结果。理解数据的类型有助于选择正确的方法。\n\
    \n## 3.2 数据分析\n\n数据分析意味着探索数据集以得出结论。数据分析利用原始数据来产生模式报告，如图 3.2 \n\n![图 3.2 数据分析流程图。](img/fig3_2.jpg)\n\
    \n图 3.2 数据分析流程图。\n\n## 3.3 数据分析的目标\n\n数据分析对不同领域具有至关重要，通过揭示数据集的模式来得出结论，有助于决策。数据分析对不同领域具有至关重要，通过揭示数据集的模式来得出结论，有助于决策。\n\
    \n数据分析对不同领域具有至关重要，通过揭示数据集的模式来得出结论，有助于决策。数据分析对不同领域具有至关重要，通过揭示数据集的模式来得出结论，有助于决策。\n\
    \n数据分析对不同领域具有至关重要，通过揭示数据集的模式来得出结论，有助于决策。。\n\n## 3.4 受益于大数据的领域\n\n数据分析在实施各种应用中起着至关重要的作用[ch03.xhtml#ref3_2]。\n\
    \n- 医疗保健\n- 科学\n- 电子商务\n- 客户个人洞察\n- 图像处理\n- 自然语言处理\n- 智能城市\n- 智能家居\n- 银行、保险和金融\n\
    - 体育\n- 汽车\n- 风险管理\n- 营销与广告\n- 灾害预测\n- 游戏\n- 物流\n- 安全\n\n## 3.5 数据分析实时应用\n\n数据分析的一些应用如下：\n\
    \n- 根据内存、屏幕尺寸、电池容量、处理器、摄像头、操作系统、品牌、重量、颜色预测手机价格。\n- 根据用户看过的电影推荐电影。\n- 分析客户对产品的意见。\n\
    - 通过症状诊断疾病。\n\n## 3.6 数据分析阶段\n\n数据分析的阶段为：\n\n- 数据收集和预处理\n- 机器学习模型构建\n- 性能评估\n\n\
    ### 3.6.1 数据收集和预处理\n\n在数据分析周期的阶段（如图 3.3 所示），利益相关者分析业务趋势和项目领域，他们开始建立假设来解决业务问题。他们开始观察数据集以识别关键变量并对数据集进行分类。当理解了数据的性质后，利益相关者通过删除重复、处理缺失值和噪声来准备数据。此阶段根据数据分析的需求清洗数据[ch03.xhtml#ref3_6]。\n\
    \n![图 3.3 数据分析生命周期图。](img/fig3_3.jpg)\n\n图 3.3 数据分析生命周期图。\n\n### 3.6.2 机器学习模型构建\n\
    \n团队与利益相关者在预处理数据后，在识别出主要处理关键业务危机的方法和技术后开始构建学习模型。模型无非是在数据上执行的机器学习算法、统计和数学计算的组合，以实现预期目标。\n\
