    ### 6.3.3 Case Study II: Blood Pressure Monitor to Predict Hypotension in Edge
    Server


    When the heart beats, it pumps the blood to the whole body that gives energy and
    oxygen. As the blood moves, it pushes against the sides of the blood vessels.
    This pushing strength of blood is called blood pressure. Blood pressure is vital
    as high blood pressure leads to high risk of health problems and low blood pressure
    results in strain of arteries and heart. The blood pressure parameters are systolic
    and diastolic. The blood pressure is highest when the heart beats, pumps the blood
    which is called systolic pressure. When the heart is at rest between the beats,
    the blood pressure falls which is called diastolic pressure. The normal blood
    pressure range is 120/80 mm Hg where systolic pressure is 120 and diastolic pressure
    is 80. The systolic pressure is given more attention as it is a factor for cardiovascular
    disease. Blood pressure is considered as high blood pressure and low blood pressure.
    If the blood pressure range is 140/90 mm Hg or higher, it is known as high blood
    pressure, whereas the range below 90/60 mm Hg is known as low blood pressure.
    The systolic and diastolic values help in calculating mean arterial pressure \[[9](#ch06.xhtml#ref6_9)\].
    Mean arterial pressure is the average pressure during a single cardiac cycle.
    The mean arterial pressure value should be at least 60 mm Hg to provide blood
    to the organs of the body. If the mean arterial pressure value is less than 55
    mm Hg, it is known as hypotension.


    Shen et al. proposed a new method to estimate blood pressure continuously based
    on five parameters extracted from ECH and PPG. These parameters were used to fit
    the values of systolic blood pressure (SDP), diastolic blood pressure (DBP), and
    mean arterial pressure. The five parameters considered are PWTT, ecgPeriod, ppgSystolicTime,
    ppgDiastolicTime, and ppg\_K. The stepwise regression is being used for fitting
    the multiple linear regression equation using SPSS. This method is of great value
    as this can be used in wearable devices so that it can monitor the blood pressure
    continuously and send to the edge devices for further analysis \[[10](#ch06.xhtml#ref6_10)\].


    #### 6.3.3.1 Mean Arterial Pressure


    Mean arterial pressure is the average blood pressure in a person’s blood vessels
    during a single cardiac cycle. MAP is essential for measuring the pressure necessary
    for adequate flow of blood to the organs of the body. It is important to have
    a MAP of at least 60 mm Hg to provide sufficient blood to the coronary arteries,
    kidneys, and brain. The normal MAP range is between 70 and 100 mm Hg. If the MAP
    value departs from the range, it provides negative effects on the body. The factors
    affecting MAP are blood pressure, heart rate, amount of blood pumped out of the
    heart per minute, resistance to blood flow in the vessels. The high MAP value
    causes stress on the heart because it works harder than usual to push the pressure
    in the vessels. The low MAP value leads to shock and in the end death of cells
    and the organ systems. If the MAP range falls below 55 mm Hg, it is considered
    as hypotension \[9\].'
