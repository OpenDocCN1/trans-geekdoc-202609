    * 一个全同态加密（FHE）嵌入原型从本质上确保用户数据免受工作平台威胁的机密性是一项具有挑战性的应用。该方案包含了转密、自动编译、并行化和消息打包，使得在实践中执行同态加密。该集成平台适用于本质上具有强非对称性的应用以及不向客户端设备发送任何响应的应用。

    * 了一种用于图像加密的高效混合同态加密技术，用于基于块像素位置确保公云中私有图像的安全交换。


    ### 4.2.7.2 同态加密的基本功能


    大多数 FHE 的安全性基于误差学习 (`LWE`)、带噪声奇偶学习 (`LPN`)、舍入学习 (`LWR`) 或环上误差学习 (`RLWE`) 问题，这些问题被认为是与晶格相关的
    NP-hard 问题。晶格被用于提供具有低乘法深度和复杂性的电路，这些电路已被证明能够抵抗量子攻击。同态加密的核心功能如下：


    * 密钥生成

    * 加密

    * 评估

    * 解密


    基本功能在图 4.8 中详细说明。


    ![图 4.8 同态加密的基本功能。](img/fig4_8.jpg)

    图 4.8 同态加密的基本功能。


    任何 FHE 支持两种类型的同态方案，即加法同态和乘法同态。加法同态和乘法同态的详细视图请所示图 4.9。


    ![图 4.9 加法和乘法同态属性。](img/fig4_9.jpg)

    图 4.9 加法和乘法同态属性。


    数据机密性下列出的方案中，仍有一些处于模糊阶段，对于边缘计算环境中的改进和应用是一个完全开放的平台。


    ## 4.3 身份验证


    对于任何联邦环境，适当的身份验证机制都是强制，失败会导致外部人员/攻击者的访问。使用凭据验证自己的身份称为身份验证。大多数边缘环境要求在信任域内进行身份验证。边缘计算环境最合适的身份验证机制列如下：


    * 单域身份验证

    * 跨域身份验证

    * 切换身份验证


    ### 4.3.1 单域身份验证


    身份验证必须确保验证、数据匿名性、用户隐私和前向安全性。数据匿名性意味着即使通信在开放公共通道中进行，任何非法用户也无法获取通信。除非用户已同意共同关注/利益，否则用户隐私不得被篡改。前向安全性保证之前交换的任何消息都不会泄露给拦截者。该领域正在进行大量研究，以增强安全并保护隐私。Liu
    等人提出的 \[14\] 系统模型具有高度的可扩展性，确保了匿名身份验证和隐私保护。Jiang 等人提出的 \[15\] 隐私感知验证方案使用双线性对密码系统和动态随机数生成提供了基于单域的身份验证。该方案通过缓解大规模分布式环境中所有可能的威胁提供了相互身份验证。该方案的增强版本包含了基于身份的签名。单域身份验证最简单的方法是单点登录
    (`SSO`)。一旦设置了 `SSO`，经过适当验证的用户即可访问公司在范围内提供的所有服务。`SSO` 授权用户只需登录一次即可访问多种服务/应用程序/网站。例如，无论设备如何，使用支持
    `SSO` 的 Google 账户是一项迷人的功能，可以在登录一次后在单一布局中访问所有设施。使用 `OAuth 2.0` 协议为消费者提供了一个无缝、安全且可靠的环境。图
    4.10 展示了单域身份验证的工作。


    ![图 4.10 单域身份验证。](img/fig4_10.jpg)

    图 4.10 单域身份验证。


    ### 4.3.2 跨域身份验证


    当跨域提出用户身份验证请求时，称为跨域身份验证。例如，如果从一个应用程序的请求发送到另一个域，则被称为跨域身份验证。从应用程序收集请求的凭据并将其发送到另一个域显然会遇到安全威胁/漏洞。为了缓解这些攻击，必须采取并部署适当的安全控制措施，以确保跨域访问的保障。这可以通过基于属性的框架或基于组密钥的框架来实现。基于组密钥的框架要求层次树结构并维护高水平的可扩展性，而基于属性的框架被认为是下一代模型，因为它具有感知感知并提供动态访问。尽管这些模型中存在许多方案，但密钥/证书撤销、隐私保护和匿名身份验证被认为是这些方案的主要限制，并为改进铺了道路。图
    4.11 详细介绍了两个公司实体之间的跨域身份验证。


    ![图 4.11 跨域身份验证。](img/fig4_11.jpg)

    图 4.11 跨域身份验证。


    ### 4.3.3 切换身份验证


    为了确保设备在多个访问点之间的安全无缝漫游，适当的强制身份验证是不可少的，称为切换身份验证。设计高效的切换身份验证协议是一个复杂的过程，因为它容易受到频繁的危险攻击。此外，可扩展性和处理开销被认为是切换身份验证最大的限制。不可追踪性和身份隐私必须是该技术需要满足的原始属性。许多此类方案通过使用经典的硬密码系统如
    `ElGamal` 和椭圆曲线密码学来保留匿名身份验证。一个典型的切换身份验证场景如图 4.12 所示。


    ![图 4.12 切换身份验证。](img/fig4_12.jpg)

    图 4.12 切换身份验证。


    ## 4.4 隐私保护方案


    确保边缘计算环境中的隐私是一项不可避免的任务。该环境必须确保整体隐私、条件隐私、轨迹隐私、差异隐私、数据隐私、位置隐私和身份隐私。在这些隐私中，数据隐私、位置隐私和身份隐私是必须执行的隐私策略。为了实施最高水平的安全，细粒度的隐私策略执行至关重要。


    ### 4.4.1 数据隐私


    由于前所未有的数字化转型，每天从电子商务、零售、社交媒体、银行等各种应用程序/领域产生海量数据。显然，这为严重的/有害的隐私侵犯铺了道路。考虑的关键威胁如下：


    * 泄露

    * 歧视

    * 监控

    * 个人数据滥用


