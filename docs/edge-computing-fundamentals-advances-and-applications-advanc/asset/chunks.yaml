    Data security and privacy-preserving in edge computing paradigm: Survey and open
    issues. IEEE Access, 26, 18209–18237.


    2. `[Shamir, A.](#ch04.xhtml#Cref4_2)` (1984). Identity-based cryptosystems and
    signature schemes. In Advances in cryptology (Lecture Notes in Computer Science)
    (Vol. 196, 47–53). Santa Barbara, CA: Springer.


    3. `[Tsujii, S.](#ch04.xhtml#Cref4_3)`, & Itoh, T. (1989). An ID-based cryptosystem
    based on the discrete logarithm problem. IEEE Journal on Selected Areas in Communications,
    *7*(4), 467–473.


    4. `[Boneh, D.](#ch04.xhtml#Cref4_4)`, & Franklin, M. (2003). Identity-based encryption
    from the Weil pairing. SIAM Journal on Computing, *32*(3), 586–615.


    5. `[Sahai, A.](#ch04.xhtml#Cref4_5)`, & Waters, B. (2005, May). Fuzzy identity-based
    encryption. In *Proc.*, Aarhus, Denmark, 457–473.


    6. `[Blaze, M.](#ch04.xhtml#Cref4_6)`, Bleumer, G., & Strauss, M. (1998, May).
    Divertible protocols and atomic proxy cryptography. In *Proc. 17th International
    Conference on the Theory and Applications of Cryptographic Techniques.*., Espoo,
    Finland, 127–144.


    7. `[Boneh, D.](#ch04.xhtml#Cref4_7)`, Sahai, A., & Waters, B. (2012). Functional
    encryption: A new vision for public-key cryptography. ACM Communications, *55*(11),
    56–64.


    8. `[Yin, W.](#ch04.xhtml#Cref4_8)`, Indulska, J., & Zhou, H. (2017). Protecting
    private data by honey encryption. Security and Communication Networks, 2017, 1–9.


    9. `[Boneh, D.](#ch04.xhtml#Cref4_9)`, & Waters, B. (2007). Conjunctive, subset,
    and range queries on encrypted data. In Theory of cryptography (Vol. 4392, 535–554).
    Amsterdam, Netherlands: Springer.

