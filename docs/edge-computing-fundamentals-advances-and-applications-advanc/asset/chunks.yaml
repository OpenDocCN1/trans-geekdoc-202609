  trans: "\n\n### 资金合约\n\n以下函数通过 web3 从前端发送参数启动一个项目，并部署项目合约，同时将合约推送到与该资金合约关联的项目列表中。\n\
    \n```solidity\nfunction* startProject(\n    string calldata title,\n    string\
    \ calldata description,\n    uint durationInDays,\n    uint amountToRaise\n) external\
    \ {\n    uint raiseUntil = block.timestamp + (durationInDays * (1 days));\n  \
    \  Project newProject = new Project(msg.sender, amountToRaise, raiseUntil, title,\
    \ description);\n    projects.push(newProject);\n    emit ProjectStarted(\n  \
    \      address(newProject),\n        msg.sender,\n        title,\n        description,\n\
    \        raiseUntil,\n        amountToRaise\n    );\n}\n```\n\n以下函数返回与该资金合约实例关联的所有项目：\n\
    \n```solidity\nfunction* returnAllProjects() external view returns(Project[] memory){\n\
    return projects;\n}\n```\n\n## 项目合约\n\n当用户输入数值进行捐时时调用的贡献函数：\n\n```solidity\nfunction*\
    \ contribute() external verifyProjectState(ProjectState.FundRaising) payable {\n\
    \    require (msg.sender != projectOwner);\n    contributions[msg.sender] = contributions[msg.sender]\
    \ + (msg.value);\n    currentBalance = currentBalance + (msg.value);\n    emit\
    \ FundingReceived(msg.sender, msg.value, currentBalance);\n    checkFundingState();\n\
    }\n```\n\n检查项目合约状态的函数：\n\n```solidity\nfunction* checkFundingState() public{\n\
    \    if(currentBalance >= amountGoal){\n        currentState = ProjectState.successful;\n\
    \        payProjectOwner();\n    }\n    else if(block.timestamp > deadLine){\n\
    \        currentState = ProjectState.expired;\n    }\n}\n```\n\n当目标达成时，向创建特定项目合约的地址支付资金的函数：\n\
    \n```solidity\nfunction* payProjectOwner() internal verifyProjectState(ProjectState.successful)\
    \ returns(bool){\n    uint256 raisedAmount = currentBalance;\n    currentBalance\
    \ = 0;\n    if(projectOwner.send(raisedAmount)){\n        emit ProjectOwnerPaid(projectOwner);\n\
    \        return true;\n    }\n    else{\n        currentBalance = raisedAmount;\n\
    \        currentState = ProjectState.successful;\n        return false;\n    }\n\
    }\n```\n\n### 案例研究 II：基于区块链技术的生物识别系统\n\n区块链技术提供了一种合适的架构，可以在安全去中心化的系统中存储和检索敏感机密数据。生物识别可以利用区块链的特性，如不可篡改性、更好的安全去中心化系统。利用集成区块链的生物特征对人员进行自动识别，有助于保护许多物联网应用中的智能设备。生物特征可以是生理性的（脸、指纹等）或行为性的（声音、手写签名等）。\n\
    \n#### 现有系统的问题\n\n当生物识别存储在单一中心化数据库中时，攻击者可以窃取并泄露生物信息，这可能导致严重的后果。如果是密码被盗，很容易更换。攻击者还可以修改存储的生物识别导致身份验证失败。这些问题可以使用区块链技术来存储生物识别，因为它是安全的且防安全攻击的。\n\
    \n#### 设计考虑\n\n生物识别是隐私和敏感信息。当智能合约中的变量被声明为 `private` 时，仅意味着该变量无法从另一个智能合约访问，但可以被\
    \ `web3` 等外部 API 读取。因此，生物识别不能简单地存储，因为任何人都可以访问并查看这些数据。解决此问题的方法是在存储到区块链之前对数据进行加密，并在身份验证期间解密。最近，同态加密变得越来越流行，因为它允许在加密数据上进行计算，并获得与解密后后计算相同的结果。\n\
    \n以太坊中执行的每条指令都需要支付一定量的 gas（加密货币）。简单的加法指令可能消耗 1 gas，而其他复杂的计算（如 `SHA3` 哈希计算）可能消耗\
    \ 30 gas。因此，大多数计算（如特征提取、加密和特征比较）应该在智能合约之外完成。\n\n#### 系统设计\n\n1. **从生物识别数据中提取特征**\n\
    \   人的生物特征是通过各种传感器生成的。例如，使用面部作为生物特征，可以使用摄像头捕捉人的脸并从捕捉的图像中提取特征。\n\n2. **存储加密数据**\n\
    \   生物识别不能直接存储在区块链中，因为任何人都可以读取。在公有区块链上部署生物识别系统比使用私有区块链更安全可靠，因为它只允许少数受信任的用户参与网络。通过引入合适的加密算法，对特征进行加密并存储在公共区块链中。\n\
    \n3. **特征比较与身份验证**\n   在身份验证期间，捕捉用户的生物识别，提取特征并与存储在区块链中的数据进行比较。比较通过计算两个生物识别之间的距离（欧几里得距离或汉明距离）完成，当生物识别匹配时最终通过用户。\n\
    \n#### 系统实现\n\n实现了一个使用面部特征的简单生物识别系统以测试系统。使用名为 `face_recognition` 的 Python 包生成人的面部编码，并使用\
    \ `AES256` 算法加密特征向量。然后，将加密后的文本存储在区块链网络（注册）。在身份验证过程中检索并解密该文本。部署在网络中的智能合约如下。\n\n\
    #### 智能合约\n\n```solidity\npragma solidity >=0.4.22 <0.8.0;\ncontract Face {\n\
    \    //加密的编码存储在以地址为键的映射中\n    mapping(address => string) private faceEncoding;\n\
    \    address public admin;\n\n    constructor() {\n        admin=msg.sender;\n\
    \    }\n\n    function addFace(address adr,string memory face) public {\n    \
    \    //只有管理员（部署智能合约的地址）有权添加面部编码\n        require(admin==msg.sender);\n       \
    \ faceEncoding[adr]=face;\n    }\n\n    function getFace(address adr) public view\
    \ returns(string memory) {\n        return faceEncoding[adr];\n    }\n}\n```\n\
    \n"
- fmt: "\nPossession of a gun or any other firearm could lead to unnecessary violence\
    \ and may disturb the public. Misuse of guns can result in public nuisance and\
    \ harmful deaths. The significant reason for gun-related violence is due to improper\
    \ tracking of ownership. Firearms and dangerous weapons in the hands of many people\
    \ may have its effect in suicides and murders. The buying and selling of weapons\
    \ need to be streamlined to control the illegal usage of these harmful weapons.\
    \ DLT with cryptography backbone plays a vital role in gun control without making\
    \ any changes to existing law and orders. Blockchain is such a technology that\
    \ will improve the tracking of the gun and ownership. The owner will be accountable\
    \ for any crime found with those weapons. The distributed ledger can be used for\
    \ immutable record keeping for gun distribution process and ownership rights.\
    \ Every individual user will have sufficient data that will help to analyze the\
    \ background check. The data might include previous gun-related crimes, suicide\
    \ attempts, and so on. That adds to the credibility score of the user. Government\
    \ bodies responsible for weapon possession and licensing can either have partial\
    \ or entire access to these immutable records.\n\n## Functionalities\n\n1. **Background\
    \ check**\nBlockchain is immutable and less vulnerable to hacking and human error;\
    \ as a result, all the data and previous transactions made by the user will remain\
    \ intact. These data can be used to make the background check. This check is essential\
    \ to pass the validation for transferring the ownership as well as to provide\
    \ the license to the user to possess the firearms.\n\n2. **Tracking manufacturers\
    \ and sale of weapons**\nWeapons are tracked from the manufacturer to the resale.\
    \ Illegal weapons found during crime scenes can be easily tracked to their manufacturers\
    \ as well the current and previous owners. Illegal smuggling of weapons can be\
    \ identified. By tracking the health data of owners, users with poor mental fitness\
    \ can be traced, which helps to prevent suicides.\n\n3. **Data sharing**\nSince\
    \ the system is decentralized, any user can try to sell weapons to any other users\
    \ in the network. If the buyer fails to pass the verification, then this can be\
    \ notified to the government bodies and authorities to further prevent any unforeseen\
    \ situations.\n\n## System Design\n\n[Fig. 5.17](#ch05.xhtml#fig5_17) explains\
    \ how a transaction in the blockchain application will aid the transferring of\
    \ weapons from user A to user B. In order to transfer a weapon, both the buyer\
    \ and the seller should be a verified user. This verification is done by the government\
    \ who are also a part of the blockchain network. The users will undergo the background\
    \ check and validity of the license provided by the government bodies in the network.\
    \ If the user does not own a license, then the user is eligible to make a request\
    \ transaction to obtain a license provided the user successfully passes through\
    \ all the verification and validation. If the user meets the eligibility criteria\
    \ to obtain the firearm, then the government body will validate all the previous\
    \ records and transactions made by the user.\n\n![Figure 5.17 Blockchain transaction\
    \ in weapon tracking.](images/fig5_17.jpg)\n\n[Figure 5.17 Blockchain transaction\
    \ in weapon tracking.](#ch05.xhtml#fg5_17)\n\nEvery user in the blockchain who\
    \ sells or purchases guns will have an electronic gun safe that is tied to the\
    \ biometric data of the user such as fingerprints. The electronic gun safe will\
    \ contain the records of the user’s mental issues if any and other history of\
    \ illegal activities. The safe also contains all the previous transactions and\
    \ the ballistic information of various guns possessed. All the previous records\
    \ and transactions made by the user are immutable in the blockchain. These data\
    \ are stored in the respective nodes that the government authorities are entitled\
    \ to access. The data are hidden from other nodes in the network concerning the\
    \ privacy of the user. If the personal identity of the user possessing weapons\
    \ is public then there are high chances of subjugation. The biometric data of\
    \ the user can be used as a private key to access the personal data in the electronic\
    \ gun safe. Only during transfer of ownership, these data are verified as a background\
    \ check. Artificial intelligence can be employed to identify any mental issues\
    \ or any obsession toward gun violence.\n\nAll the transaction will require parties\
    \ at both the end to approve the sale which is done using multisignature technology\
    \ (multisig). Multisig will enable both licensed and verified buyer and seller\
    \ to sign using respective keys. Once the buyer is verified and passes the background\
    \ check, there is transfer of data from seller’s electronic safe to buyers safe.\
    \ This transaction between the electronic guns safe is recorded in the immutable\
    \ blockchain and is also timestamped. If the receiver of the gun fails to pass\
    \ the background check, then the same will also be recorded in its own electronic\
    \ gun safe for future validation.\n\n## Implementation\n\nA smart contract is\
    \ written with the help of Remix online IDE for simulating the application. Though\
    \ the smart contract does not meet all the specifications that were mentioned\
    \ earlier, it promises to provide an overview of how the application would be\
    \ if it is implemented in the real world.\n\n```solidity\npragma solidity ^0.5.0;\n\
    \ncontract Weapons {\n\n  // A structure to hold the details of the weapons\n\
    \  struct Weapon {\n    string name;\n    string physical_information;\n    string\
    \ weapon_type;\n  }\n\n  // A structure to hold the details of the users\n  struct\
    \ User {\n    string name;\n    mapping(uint=>Weapon) owned;\n    uint count;\n\
    \    uint trust_level;\n  }\n\n  //A table to store the users\n  mapping(uint=>User)\
    \ users;\n\n  // A table to store the weapons\n  mapping(uint=>Weapon) weapons;\n\
    \n  // Validates the credibility of the user\n  function validate(uint id) public\
    \ returns(uint) {\n    users[id].trust_level = 1;\n  }\n\n  // Invalidate the\
    \ user if a malicious activity is discovered\n  function invalidate(uint id) public\
    \ {\n    users[id].trust_level -= 1;\n  }\n\n  // Adds the weapon to the buyer\
    \ and removes the weapon from the seller\n  function transaction(uint id1, uint\
    \ id2, uint weapon) public {\n    if(validate(id1)==1 && validate(id2)==1) {\n\
    \      Weapon memory temp = users[id1].owned[weapon];\n      delete users[id1].owned[weapon];\n\
    \      users[id2].owned[weapon] = temp;\n      users[id1].count--;\n      users[id2].count++;\n\
    \    }\n  }\n\n  // A function to add the users into the blockchain\n  function\
    \ addUser(uint id, string memory name) public {\n    users[id].name = name;\n\
    \    users[id].count = 0;\n    validate(id);\n  }\n\n  // A function to buy weapons\
    \ from manufacturer\n  function requestWeapon(uint id, uint wid) public {\n  \
    \  if(validate(id)==1) {\n      users[id].owned[wid] = weapons[wid];\n      users[id].count\
    \ = 1;\n    }\n    else {\n      invalidate(id);\n    }\n  }\n\n  // A function\
    \ to add guns that are manufactured\n  function addGun(uint wid, string memory\
    \ name, string memory physical_information, string memory weapon_type) public\
    \ {\n    weapons[wid].name = name;\n    weapons[wid].physical_information = physical_information;\n\
    \    weapons[wid].weapon_type = weapon_type;\n  }\n}\n```\n"
