    $Precision = \\frac{TP}{TP + FP}$(3.2)


    #### Recall


    Recall is an evaluation metric that aims at determining the valid positive cases
    in the total available positive cases so as to identify the other missed positive
    cases. Recall is also termed as Sensitivity, Hit Rate or True Positive Rate (TPR).


    ${Recall} = \\frac{TP}{{TP} + {FN}}$(3.3)


    #### F1 Score


    When the cost of False Positive and False Negative is high in an application,
    Precision and Recall are used to be the superior metrics respectively. It is trusted
    that F1 score is a better evaluation metric as it computes harmonic mean of Precision
    and Recall. Also, when there is an imbalanced class distribution, the F1 score
    is considered as a better option. As it provides weightage for both precision
    and recall.


    $F1 - {score} = 2 \\ast \\frac{{Recall} \\ast {Precision}}{{Recall} + {Precision}}$(3.4)


    #### Specificity


    Specificity is an evaluation metric that calculates the proportion of correctly
    predicted negative cases in the overall available negative cases so as to identify
    the other missed negative instances in the result.


    ${Specificity} = \\frac{TN}{{TN} + {FP}}$(3.5)


    The False Positive Rate (FPR) is calculated using the specificity value.


    *F**P**R* = 1 − *S**p**e**c**i**f**i**c**i**t**y*(3.6)


    #### Negative Predictive Value


    Negative Predictive Value (NVP) is a metric that focuses on finding the proportion
    of the valid negative cases in the predicted negative cases.


    ${Negative}\\ {Predictive}\\ {Value} = \\frac{TN}{TN + FN}$(3.7)


    #### PR Curve


    PR Curve is a graph representation of Recall and Precision values in x and y-axis
    respectively. It is significant that an algorithm must have high precision and
    high recall values. An efficient PR Curve is the one which has greater area under
    curve (AUC).


    #### Receiver Operating Characteristics (ROC) curve


    ROC curve is a graph plot between True Positive Rate (TPR) and False Positive
    Rate (FPR). In other terms, it visualizes the relationship between sensitivity
    and 1-Specificity in y and x-axis respectively. The larger the Area under the
    ROC curve, the more accurate the model will be.


    ## 3.7 Types of Data Analytics


    In general, data analytics techniques are classified into four types based on
    its purpose of exploiting the model: descriptive analytics, diagnostic analytics,
    predictive analytics, and prescriptive analytics. It is depicted in [Fig. 3.8](#ch03.xhtml#fig3_8).


    ![Figure 3.8 Types of data analytics.](images/fig3_8.jpg)


    [Figure 3.8 Types of data analytics.](#ch03.xhtml#fg3_8)


    ### 3.7.1 Descriptive Analytics


    Descriptive analytics expresses an outline of an action that has happened in the
    past. This category of analytics is useful in interpreting the pattern from previous
    actions and it results in data visualizations like charts, graphs, reports, and
    dashboards. In order to that, enhanced approaches for the future can be framed.
    It analyses the data in such a way that it would provide appropriate answer for
    the question “What happened in the past?”


    For example, the business organizations analyses and provide a historic review
    of sales and advertisements.


    ### 3.7.2 Diagnostic Analytics


    Diagnostic analytics provides broader insight of an issue as it is a successor
    to the descriptive analytics. This category of analytics is helpful to mine deeper
    into a concern in order to identify the source of the problem. Diagnostic analytics
    also called as root cause analysis. It aims at providing an answer to the question
    “Why something happened?”


    For example, in healthcare domain, when more number of patients are admitted unusually
    in the hospitals, the diagnostic analytics would bring a root cause of the scenario
    by analyzing symptoms of all the patients to provide a reason over the unexpected
    raise in the patient volume.


    ### 3.7.3 Predictive Analytics


    Predictive analytics utilizes the key observations of descriptive, diagnostic
    analytics and various tools and techniques to discover classes and outliers in
    the system in order to forecast upcoming trend based on the current actions. It
    aims at providing an answer to the question “What is likely to happen?”


    For example, power plants can trim down unanticipated machine failures by predicting
    when equipment might fall short. Therefore, helping to decrease maintenance expenses
    and improve resource accessibility.


    ### 3.7.4 Prescriptive Analytics


    The main idea of prescriptive analytics is to recommend the action to avoid upcoming
    problems or to completely acquire the benefits of current trend. It analyses the
    data in such a way that it provides appropriate answer for the question “What
    should I do about it?”


    For example, the Ola cab finds the optimal route from source to destination by
    considering the minimal distance and traffic out of all available paths to make
    use of the resource efficiently.


    **In the Data Analytics taxonomy, the most thriving area called Edge Analytics
    will be a Game Changer!**


    An edge device is any type of hardware that manages transmission of data at the
    border line connecting two separate network groups. It accomplishes different
    roles such as communication, monitoring, processing, filtering, and optimal direction-finding
    based on the kind of device that is located at the edge. But basically, they act
    as an extremity of a network through which the data could enter/exit \[[7](#ch03.xhtml#ref3_7)\].


    ## 3.8 Edge Data Analytics


    **Experience Notes:** Data is precious and we are surrounded with data everywhere.
    The most valuable asset in the world is data but 90% of the data is left out without
    being processed properly. Through effective analysis of data we can detect any
    kind of patterns. The data contains answers for all our queries but in a hidden
    way. To extract the required information from the enormous data that evolve around
    us a proper system should be in place which connects and analyses the data to
    provide us the info what we need. Edge analytics combining with ML is all to play
    here for. The world is moving toward in demand of real experience in all means.
    For example, it can be for buying a product or statistical analysis on user experience
    or trend analysis or decision systems, etc. Assessing the data in all dimensions
    and visualizing the same to have a better decision system is in need of time.
    Without edge analytics, this would not be complete.


    To put it in simple words as said by various experts edge analytics is performing
    the analysis at the point where the data is getting generated. For example traffic
    system, whereby performing the dynamic analysis information can be sent to the
    nearby police officials on any trouble in the surrounding. Machine learning models
    to be created with proper filtering conditions for an effective dynamic learning.
    For a decisive system to be very effective, model has to be trained in an unsupervised
    fashion (dynamically) and combination of edge analytics with machine learning
    is the need of the hour. This unit explains and covers the same which will for
    sure a clear gateway for the aspiring ones in the field of edge analytics involving
    machine learning.


    > **—*Dr. C.S. Saravana Kumar, Software Architect, Robert Bosch, India*.**'
