  trans: '

    从青少年到老年人，全球范围内许多人沉浸在视频游戏中。尽管少数游戏会产生负面影响，但事实证明，游戏对老年人（特别是大脑功能方面）提供了巨大的益处。此外，它还能缓解负面的心理影响并增强记忆力。相反，在多人游戏环境中，游戏对带宽和延迟敏感性要求很高。通过将边缘服务器部署在靠近用户的地方，回传带宽和低延迟极具前景。延迟越低，游戏环境就越有保障。通过边缘计算，更好的用户体验成为可能，并重新点燃了用户体验。以负担得的价格提供边缘托管游戏服务，是比投入巨额资金购买
    `PlayStation/Xbox` 之外给用户的另一项丰惠服务。


    ## 6.2.6 内容分发


    通过边缘计算模型访问网页、视频或音乐可以获得更好的体验，因为响应被确保在毫秒内完成，而不是依赖于云数据中心的响应。内容分发网络（`CDN`）市场已由 `Akamai`
    和 `Limelight` 等者通过构建庞大的网络所控制/统治。少数提供商如 `Netflix/HBO` 在边缘网络部署了其定制的微缓存，具有更高的可靠性和灵活性。


    ## 6.2.7 金融领域


    为了实现智能银行功能，银行业正采用边缘计算框架，以提供更好的消费体验和服务。该服务通过智能手机、`desktop/laptop` 等多种设备终端提供。此外，该功能还扩展到了
    `ATMs` 和自助终端（`kiosks`），这些设备具有强大的内置数据收集和处理功能。通过这些更广泛的功能，银行业以更具响应性的设计吸引了客户。边缘计算通过加速通信和计算支持交易领域，从而减少了整体损失。通过将边缘服务器放置在非常靠近交易所的地方以运行高资源密集型协议/算法，高速执行变得可行。这种高获益模型为提供者和消费者促进了更准确、更适当的最新信息。


    ## 6.2.8 增强现实


    增强现实因其在更常见的实际应用中的适用性而受到近期关注。增强现实通过在现实物体/环境之上叠加数字设备/元素，为用户提供了真实的呈现。可穿戴设备如头戴设备、眼镜、智能手表、夹克和戒指通过智能手机广泛地创建虚拟效果。增强现实最熟悉的应用是
    `Instagram/Snapchat` 中的滤镜选项。增强现实背后的工作程序要求元素/设备处理视觉数据并将视觉数据映射到实时物体上。边缘框架的工作方式更加轻量化，允许设备自发地与增强现实显示融合而无任何延迟。许多零售链正在利用这项技术来提供更好的购物体验。


    ## 6.2.9 医疗行业


    边缘计算通过为整合最新的 IT 解决方案以极具前景的患者护理创造新机会，令医疗行业为着迷。在边缘计算的帮助下，收集、保护和处理海量患者数据成为现实。由于边缘计算的部署，医疗部门甚至可以为农村背景的人群通过电子服务在毫秒级的时间内提供动态的实时决策和行动。此外，与依赖于一个中心数据库相比，现在可以随时随地访问信息了。最近，许多医疗设备出现并主导市场，其收集和处理数据的功能在治疗或诊断期间起着重要作用。例如，Anitha
    Kumari 等人提出在边缘计算系统中使用低密度脂蛋白对心脏病进行简单预测 [3 ]。因此，边缘计算对每个人的日常生活产生了巨大影响，引导人们走向健康安全的生活。


    此外，边缘计算的足迹延伸到了视频监控、视频会议、软件定义网络、家居和办公室连接以及零售等领域/应用中。


    边缘计算用例的实现实现在 图 6.2 中，以便清晰理解。


    ![图 6.2 边缘用例的实现](img/fig6_2.jpg)


    图 6.2 边缘用例的实现


    ## 6.3 医疗保健中的边缘计算实现


    医疗行业是全球最大且增长最快的行业之一，通过在任何点动态可用低延迟患者数据将医疗数字化，为专业人员提供更好的诊断工具。在医疗记录中，当患者访问新的提供者或设施时，黑客可能会滥用数据，因此每项信息必须进行监控以避免意外事件的发生。为了存储和保护医疗数据的安全性和隐私，在层级之间存在多种方法，如属性加密、代理重加密、功能加密、蜜罐加密和同态加密。同态加密是一种先进的加密技术，允许在加密数据上进行计算，类似于在明文中进行，但增加了在加密数据上搜索的能力。在许多类型中，全同态加密（`FHE`）被广泛使用，允许在加密数据上进行完全计算。`FHE`
    是一种新兴加密技术，无需将数据带回计算节点即可在加密数据上进行计算 [4,5 ]。


    通常个人健康信息的转换需要在处理数字数据的三个阶段进行保护：在案例研究中，数据从医疗物联网（`IoMT`）设备采集并传输到边缘网关/服务器。边缘设备以同态方式存储数据。最后，所需的数据发送到云服务器。


    本章讨论了三个案例研究，如下：


    ### 案例研究一：在边缘服务器上检测急性呼吸窘迫症 (ARDS)


    氧气是人类生活中最重要的东西。氧气交付和氧气消耗是每个人生命中的两个重要参数，可以通过血氧仪进行计算。氧气交付、血红蛋白和氧气消耗缺乏会导致呼吸窘迫症（ARDS），这通常被称为呼吸衰竭。通过血氧仪收集这些值，可以在边缘服务器中进行分析，以识别是否患有
    ARDS。


    ### 案例研究二：在边缘服务器上确定低血压


    平均动脉压（`MAP`）是单次心脏周期内人体血管中的平均血压。根据通过血压计获取的收缩压和舒张压，计算 `MAP` 并在边缘服务器中进行分析，以确定个人是否患有低血压。


