    ## 1.11 Conclusion


    This chapter provided an overview of various computing paradigms starting from
    parallel processing systems to distributed systems. In the centralized computing
    paradigm, all the computer resources, such as processors, memory, and storage
    are located in one physical system and controlled centrally. Resources are shared
    among various processes under one operating system. While such systems can offer
    high security, integrity, low maintenance, and reliability, they suffer from scalability
    and inflexibility. A parallel computing paradigm enables the execution of computations
    in parallel. Typically, processors share a central memory and communicate through
    the shared memory in a tightly coupled manner. Alternatively, they can be loosely
    coupled having distributed memory. Communication in this case is through message
    passing. Cluster computing paradigm uses a cluster of computers. It is a type
    of parallel or distributed processing system, consisting of a collection of interconnected
    standalone computers that work cooperatively as a single, integrated computing
    resource. The main characteristic of this model is centralized control. Distributed
    computing ([Fig. 1.24](#ch01.xhtml#fig1_25)) consists of a collection of independent
    computers, each having its own memory, disk, and processor. These independent
    nodes work cooperatively with each other to solve a problem. The participating
    computers communicate with each other through message passing and the group appears
    to be a single coherent system to its users. When a distributed system possesses
    decentralized control, it becomes a P2P system. A grid is a distributed system
    with the concept of virtual organization where a number of physical resources
    are aggregated to perform a task cooperatively. Cloud computing is a distributed
    Internet-based computing environment. In cloud, shared resources can be provisioned
    on-demand. Clouds facilitate the offering of computing services as a utility analogous
    to electricity or water supply. The advent of the Internet fostered Web hosting,
    even prior to cloud computing. Web hosting is the mechanism of providing space
    in the WWW to host one server. For example, application service providers can
    host their applications on WWW servers to deliver applications as services to
    their customers. This approach limits the number of users of the service provided.
    Using virtualization, this model could be made more effective and financially
    viable. This gave rise to the concept of offering SaaS to a larger number of users.
    Eventually, SaaS grew in popularity due to the ease of use, giving rise to what
    is today known as cloud, where not only software but also platform (PaaS) and
    infrastructure (IaaS) could be offered as a service. In the current cloud technology,
    however, it is possible to provide anything and everything as a service, which
    gave rise to the term anything-as-a-service (XaaS). Analytics could also be offered
    as a service. While cloud computing was motivated by the business community, grid
    computing was motivated by the scientific community. Later cloud computing was
    enhanced to fog computing to provide services for IoT devices. Other fog computing-related
    paradigms include mobile cloud computing, mobile edge computing, dew computing,
    fog dew computing, and edge computing. Osmotic computing has enabled seamless
    migration of microservices among the various layers of the fog computing environment.
    The next chapter will provide a discussion on edge computing systems.


