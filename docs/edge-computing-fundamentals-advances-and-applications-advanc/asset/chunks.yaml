- fmt: '

    - **Distributed Computing Systems**: There exist various distributed computing
    paradigms like `CORBA`, `DCOM`, `RMI`, etc. They lack interoperability and hence
    the capacity to form `VO`.

    - **Peer-to-Peer Computing Systems**: are geographically distributed heterogeneous
    systems with no centralized control. They complete their jobs by coordinated resource
    sharing. There are no virtual organizations defined in `P2P` systems. Hence they
    collaborate with large number of nodes and lack in security. Virtual organizations
    of smaller community facilitate more powerful and secure resource sharing.

    - **Cluster Computing**: is characterized by centralized control and fine-grained
    parallelism. Hence `VO` cannot be formed effectively.


    ## Grid Architecture


    To coordinate and share resources among the virtual organizations, the grid system
    has various components. These components comprised of the grid architecture. Grid
    architecture varies across the various generations. First generation of grid consisted
    of meta computers-based distributed servers connected via communication protocols
    and accessed using `Single Sign-On`. Then grid evolved based on `Networking Architecture`
    into a layered architecture in the second generation. Generation 3 is based on
    service-oriented architecture (`SOA`). This later evolved into a semantic Web
    3.0 architecture.


    Initially, grid computing started off with using free computational power in desktop
    systems as in `SETI@HOME` project. This is a form of volunteer computing or desktop
    computing. In volunteer computing, the client program runs on the volunteer’s
    computer. It periodically contacts project servers over the Internet, asking for
    jobs and sending back the results of completed jobs. The goal of volunteer computing
    is to use the idle resources in desktop systems for research and scientific projects.


    Some of the limitations of volunteer computing include:

    - Availability of volunteers with needed resources to perform the task.

    - Tasks performed on individual volunteer desktops should be independent with
    little / no communication between them.

    - The success of volunteer computing depends on availability of volunteers to
    donate their free resources for computational purposes.

    - Heterogeneity of hardware, operating systems, and applications of the volunteer’s
    systems.

    - Trust of the volunteers ensures that the jobs are completed reliably without
    errors.

    - Reliability can be enhanced using data and job replication techniques.


    In Layered architecture, each layer provides services to the components in the
    layer above it. Various layers in bottom-up manner are as follows ([Fig. 1.15](#ch01.xhtml#fig1_16)):


    - **Fabric layer:** comprises various resources including computational, storage,
    and cluster and network resources. Each resource has its own protocol to be followed.

    - **Connectivity layer:** aims at establishing communication between various resources.
    `TCP/IP` stack is used for the same. Authenticity of the resources is decided
    using `Single Sign-On` related security protocols.

    - **Resource layer:** protocols aim at coordination and sharing at the individual
    resource level. This layer monitors `QoS` of individual resources and maintains
    metadata of the resources like location, configuration, and usage of the resources.

    - **Collective layer**: deals with a collection of resources. It offers services
    like resource discovery, scheduling, monitoring, and failure handling.

    - **Application layer**: contains applications designed to make use of the various
    services of the underlying layers.


    ![Figure 1.15 Layered grid architecture.](images/fig1_15.jpg)


    [Figure 1.15 Layered grid architecture.](#ch01.xhtml#fg1_16)


    The major issue in layered architecture is a tight coupling of services offered
    by the layer. Each layer offers services to the layer immediately above it. In
    order to facilitate loose coupling between components, `SOA` can be used.


    In `SOA`, software components offer services to various applications or other
    components. These services have used well-defined interfaces that expose a component’s
    functionality. Thus application developers use the interfaces to interact with
    the component. The internal code of the component is not exposed to the developer.
    We can conclude that a service is user-facing software component of an application.
    Messages between the components and user are defined using standard protocols.
    Web service architecture is an instance of `SOA`. Open grid services architecture
    (`OGSA`) uses the functionalities in web services architecture (`WSA`) and defines
    a programming model using this emerging architecture. Services are loosely coupled
    peers that can singly or as a group can be composed or orchestrated to offer the
    capabilities of an application. `OGSA` is based on the core technologies of `WSA`:


    - **Extensible Markup Language (`XML`)**: to define the message exchange format
    and structure.

    - **Web Service Description Language (`WSDL`)**: is used to describe the interfaces
    of grid services.

    - **Simple Object Access Protocol (`SOAP`)**: defines message exchange patterns
    between grid/web components.

    - **Universal Description, Discovery, and Integration (`UDDI`)**: is used to discover
    services.


    `OGSA` by the Global Grid Forum is an SOA that aims to define a common, standard,
    and open architecture for grid-based applications. “Open” refers to both the process
    to develop standards and the standards themselves. The `OGSA` has been designed
    to create, terminate, manage, and invoke stateful and transient grid services
    using standard interfaces and protocols. A transient service can be created and
    destroyed dynamically. Statefulness differentiates one service instance from another.
    Each service instance is identified by a globally unique grid service handle (`GSH`).
    Services are the building blocks of an `OGSA`-based grid. `OGSA` offers the following
    features in a heterogeneous, distributed grid:


    - `OGSA` defines interfaces to facilitate service interoperability.

    - `OGSA` delivers seamless `QoS` between the service components that include resources.

    - `OGSA` manages resources.

    - Delivers grid functionality using loosely coupled stateful services based on
    `WSA`.


    The common services offered by the `OGSA` include ([Fig. 1.16](#ch01.xhtml#fig1_17)):


    - **Infrastructure Services** are the services like naming, discovery required
    by other services.

    - **Execution Management Services** are used to place, provision, and manage life
    cycle of various tasks, workflows, and services.

    - **Data Management Services** provide interfaces to represent, access, create
    and manage data. They handle data consistency, persistency, and data integrity
    issues.

