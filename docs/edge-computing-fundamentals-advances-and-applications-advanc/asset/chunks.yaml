  trans: "\n持有枪支或任何火器可能导致不必要的暴力，并可能扰乱公共。滥用枪支会导致公共干扰和危害性死亡。与枪支相关的暴力的重要原因是对所有权的追踪不当。许多人手中的火器和危险武器可能导致自杀和谋杀。武器的买卖需要精简化，以控制这些有害武器的非法使用。具有加密学骨干的分布式账本技术（DLT）在不改变现有法律法规的情况下对控枪起着至关重要的作用。区块链是一种能够提高枪及其所有权追踪的技术。所有者对这些武器发现的任何犯罪负责。分布式账本可用于枪支分配过程和所有权的不可篡改记录。每个个人用户将拥有足够的数据来帮助分析背景检查。数据可能包括以前与枪支相关的犯罪、自杀企图等。这增加了用户的信誉分。负责武器持有和许可的政府机构可以部分或全部访问这些不可篡改的记录。\n\
    \n## 功能\n\n1. **背景检查**\n区块链具有不可篡改性，且受到黑客和人为错误的攻击较小；因此，用户的所有数据和之前的交易将保持完整。这些数据可用于进行背景检查。这种检查对于通过所有权转移的验证以及为用户提供持有枪支的许可证至关重要。\n\
    \n2. **追踪制造商和武器销售**\n武器从制造到转售都经过了追踪。在犯罪现场发现的非法武器可以轻松追溯到其制造商以及当前和之前的所有者。非法走私武器可以被识别。通过追踪所有者的健康数据，可以追踪到心理健康状况不良的用户，这有助于预防自杀。\n\
    \n3. **数据共享**\n由于系统是去中心化的，任何用户都可以尝试向网络中的任何其他用户出售武器。如果买家未能通过验证，可以通知政府机构和当局，以进一步防止任何意外情况的发生。\n\
    \n## 系统设计\n\n图 5.17 解释了区块链应用程序中的交易将如何帮助武器从用户 A 转移到用户 B。为了转移武器，买家和卖双方都应该是经过验证的用户。这种验证由同样作为区块链网络部分的政府进行。用户将接受背景检查以及网络中政府机构提供的许可证有效性检查。如果用户没有许可证，只要用户成功通过所有验证和确认，该用户就有权发起获取许可证的请求交易。如果用户符合获得枪支的资格标准，政府机构将验证用户之前进行的所有记录和交易。\n\
    \n![图 5.17 武器追踪中的区块链交易。](img/fig5_17.jpg)\n\n图 5.17 武器追踪中的区块链交易\n\n区块链中每个出售或购买枪支的用户都将有一个与用户指纹等生物识别数据绑定的电子枪支保险箱。电子枪保险箱将包含用户的心理问题记录（如果有）以及其他非法活动历史。保险箱还包含之前的所有交易和拥有的各种枪支的弹道信息。用户之前的所有记录和交易在区块链中都是不可篡改的。这些数据存储在政府当局有权访问的相应节点中。为了用户的隐私，数据对网络中的其他节点隐藏。如果持有武器的用户个人身份公开，那么极大的概率会被服从。用户的生物识别数据可以作为私密钥来访问电子枪保险箱中的个人数据。只有在所有权转移时，这些数据才会作为背景检查进行验证。可以使用人工智能来识别任何心理问题或对枪支暴力的痴迷。\n\
    \n所有交易都要求双方批准销售，这是通过多签名技术（multisig）完成的。多签名允许获得许可且经过验证的买家和卖家使用各自的密钥进行签名。一旦买家通过验证并通过背景检查，数据将从卖家的电子保险箱转移到买家的保险箱。电子枪保险箱之间的这种交易记录在不可篡改的区块链中，并盖有时间戳。如果枪的接收者未能通过背景检查，也将记录在其自己的电子枪保险箱中以备未来验证。\n\
    \n## 实现\n\n借助 Remix 在线 IDE 编写了智能合约来模拟应用程序。虽然智能合约没有满足之前的所有规格，但它承诺提供关于该应用程序在现实世界中实现时的概述。\n\
    \n```solidity\npragma solidity ⁰.5.0;\n\ncontract Weapons {\n\n  // 一个用于存储武器信息的结构体\n\
    \  struct Weapon {\n    string name;\n    string physical_information;\n    string\
    \ weapon_type;\n  }\n\n  // 一个用于存储用户信息的结构体\n  struct User {\n    string name;\n\
    \    mapping(uint=>Weapon) owned;\n    uint count;\n    uint trust_level;\n  }\n\
    \n  // 存储用户的表\n  mapping(uint=>User) users;\n\n  // 存储武器的表\n  mapping(uint=>Weapon)\
    \ weapons;\n\n  // 验证用户的信誉\n  function validate(uint id) public returns(uint)\
    \ {\n    users[id].trust_level = 1;\n  }\n\n  // 如果发现恶意活动则用户失效\n  function invalidate(uint\
    \ id) public {\n    users[id].trust_level -= 1;\n  }\n\n  // 将武器交给买方并从卖方处移除\n\
    \  function transaction(uint id1, uint id2, uint weapon) public {\n    if(validate(id1)==1\
    \ && validate(id2)==1) {\n      Weapon memory temp = users[id1].owned[weapon];\n\
    \      delete users[id1].owned[weapon];\n      users[id2].owned[weapon] = temp;\n\
    \      users[id1].count--;\n      users[id2].count++;\n    }\n  }\n\n  // 将用户加入区块链\n\
    \  function addUser(uint id, string memory name) public {\n    users[id].name\
    \ = name;\n    users[id].count = 0;\n    validate(id);\n  }\n\n  // 从制造商处购买武器\n\
    \  function requestWeapon(uint id, uint wid) public {\n    if(validate(id)==1)\
    \ {\n      users[id].owned[wid] = weapons[wid];\n      users[id].count = 1;\n\
    \    }\n    else {\n      invalidate(id);\n    }\n  }\n\n  // 添加制造的枪支\n  function\
    \ addGun(uint wid, string memory name, string memory physical_information, string\
    \ memory weapon_type) public {\n    weapons[wid].name = name;\n    weapons[wid].physical_information\
    \ = physical_information;\n    weapons[wid].weapon_type = weapon_type;\n  }\n\
    }\n```\n"
