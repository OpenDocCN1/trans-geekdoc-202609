    * Drones capture videos. Initial video processing (like color extraction) may
    be done in the drones and device edge.

    * Captured frames are sent to local edge for object detection (a more complex
    functionality).

    * Frames after object detection are transferred to cloud for further management.
    In cloud, data from multiple drones may be analyzed to detect an activity and
    report.

    * If retraining is required in device or local edge, a new model may be trained
    in the cloud and uploaded in the network edge.


    The following sections discuss devices and networking protocols commonly used
    for edge computing.


    ## 2.3 Background Essentials: IoT Devices


    Smart objects in Internet of Things system need to be context-aware and interact
    with the environment. So, environmental attributes are obtained by these smart
    objects through sensors. They also cause actions to the surrounding environment
    using actuators. Transducers convert signals from one form to another. Sensors
    and actuators are transducers. IoT sensors are mostly small in size, cost-effective,
    and consume less power. They are energy-constrained. Some of the common sensors
    are listed:


    ### 2.3.1 Mobile Phone-Based Sensors


    Smartphones have inbuilt sensors and data processing capabilities. Smartphones
    can be used to sense various physical elements.


    * Movement patterns like walking and running can be sensed using accelerometers.
    Mechanical, capacitive, and piezoelectric accelerometers are common.

    * Orientation can be sensed using gyroscope.

    * Visual and audio information can be collected using camera and microphone.

    * Magnetic fields detected using magnetometer can be used to find direction and
    presence of metals.

    * Location of the phone can be detected using global positioning system (`GPS`).

    * Intensity of the ambient light can be sensed using light sensor.

    * Distance/proximity can be measured using the proximity sensors that use an infrared
    (`IR`) LED, which emits `IR` rays.


    Sensors to measure temperature, atmospheric pressure, and humidity like thermometers,
    barometers, and humidity sensors may also be available in smartphones. Some of
    the applications that use sensor data and computing capabilities of smartphones
    include:


    * Activity detection using camera, microphone, accelerometer sensors from smartphones.

    * Fitness applications that use sensors in smartphones to track physical activities,
    diet, exercises, and lifestyle.

    * Analyzing smoking pattern and mental health can also be done using sensors and
    computing capabilities of smartphones.


    ### 2.3.2 Medical Sensors


    Wearable devices can remotely monitor the health of a patient using medical sensors
    to measure the heart rate, pulse, blood pressure, body temperature, respiration
    rate, and blood glucose level. Wearable devices in the form of smartwatches, wristbands,
    monitoring patches, and smart textiles can be used to monitor the vital health
    parameters of the patient. Data measured from these sensors should be related
    to the contextual information to draw correct inference.


    ### 2.3.3 Neural Sensors


    These sensors use electroencephalography (`EEG`) to read various brainwaves including
    alpha, beta, gamma, theta, and delta waves. Based on this the brain activity can
    be deduced to manage stress, for improved learning and mental health.


    ### 2.3.4 Environmental and Chemical Sensors


    These sensors are used to obtain environmental parameters like temperature, humidity,
    pressure, water pollution, and air pollution. The electronic nose (`e-nose`) and
    electronic tongue (`e-tongue`) sense chemicals based on the odor and taste. These
    sensors can be used to monitor the pollution level and quality of food and agricultural
    produce.


    ### 2.3.5 Radio Frequency Identification


    Radio frequency identification (`RFID`) is an identification technology. It has
    a small chip called the `RFID` tag along with an antenna. Ambient changes in magnetic
    field are encoded as signals which are then transmitted. These transmitted signals
    can be read by an `RFID` reader. When the `RFID` tag is attached to the object
    to be tracked, the reader detects and records its presence when the object passes
    by it.


    ### 2.3.6 Actuators


    These devices cause changes in the environment by converting the electrical energy
    into other forms. They include heating or cooling elements, speakers, lights,
    displays, and motors. In a smart home system, actuators can be used to lock/unlock
    the doors, switch on/off the lights, control temperature, and notify users.


    Consider an operating environment of a mining industry. Such an environment is
    hazardous. It is essential to monitor the employees closely during their working
    hours. Sensors can be used to monitor the health of the employees as well as the
    status of the work. Environmental sensors to detect poisonous gas, ambient temperature,
    and lighting can be used to warn the employees. Vital signs of the employees can
    be collected and monitored to find if they are in danger. These sensor details
    can be analyzed in the local edge at the operation center to ensure the safety
    of the employees. Edge computing is thus highly beneficial to monitor the safety
    of the miners.


    This section discussed the perceptual component of the edge computing environment.
    To communicate between various components of the edge computing system an effective
    communication environment is essential. Section 4 discusses the common network
    and data protocols that can be used in an edge-computing system. Section 5 discusses
    the network management using Software-defined networks.


    ## 2.4 Networking Architecture


    IoT devices capture a lot of real-time data in heterogeneous formats. These have
    to be communicated using suitable communication protocols to the nearby gateways
    for further processing and transfer of data. The communication protocols can be
    categorized into two types. The first set consists of network and data link layer
    protocols. The second category is the data transfer protocols that can be used
    in the application and session layers. Some of the commonly used network layer
    protocols include:


    * **Bluetooth**: is a secure, short-range, low-power, low-cost, wireless transmission
    protocol between electronic devices. Data exchange between electronic devices
    over short distances is facilitated using 2.4 GHz wireless link. Bluetooth star,
    mesh, and point-to-point topologies are highly suitable for smart home applications.

    * **Wi-Fi**: is a family of wireless network protocols, based on the IEEE `802.11`
    family of standards, which are commonly used for local area networking of devices
    and Internet access. Any electronic device within range of a wireless modem can
    attempt to access the network. Sensors in healthcare and smart home applications
    commonly communicate with the gateway using Wi-Fi.

    * **NFC**: Near-Field Communication is developed by Philips and Sony. It is a
    very short-range wireless technology that helps devices separated by a few centimeters
    to communicate based on magnetic field induction. It is used commonly in payments
    and loyalty points.

    * **Zigbee**: based on IEEE `802.15.4` is a cheap low-power, low-bandwidth wireless
    ad hoc technology for personal area networks. It is commonly used for battery-operated
    monitoring and control applications.

    * **LoRaWAN**: low-power long-range wide area network by Semtech is set up using
    low radio frequencies (923 MHz in Asia) for up to 10 km range. It helps to setup
    public or private IoT networks. It can be used in rural areas for water monitoring
    and management and for smart street lighting applications.

    * **LTE**: long-term evolution implements a high-performance air interface for
    cellular mobile communication systems using radio technologies. Drones can connect
    to a cellular tower using 4G/LTE.

