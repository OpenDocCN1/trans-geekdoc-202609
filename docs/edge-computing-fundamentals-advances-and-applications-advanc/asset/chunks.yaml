  raw: 'The smart contract code is compiled into byte code and loaded to EVM. EVM
    starts and executes transactions when the client is started. EVM also guarantees
    security against cyber-attacks. For every user in Ethereum, the Ethereum address
    is the identity and the private key of the user is the password. The wallets are
    software plugins used to store and manage Ethereum accounts. Ethereum account
    is the combination of Ethereum address and private key. Ethereum address is generated
    by forming the public key from private key of the user and calculating the hash
    value of public key using keccak256 and picking the last 20 bytes of the hashed
    value.


    Cost is associated with each transaction. Like Bitcoin, Ethereum is P2P digital
    currency. The number of ethers to be paid for a transaction is based on the resources
    used. A transaction to add two numbers requires three units of work. This unit
    of work is called gas. Gas price is the price per unit gas. It is fixed by user.
    Miners will pick the transactions with higher gas price. Transaction fee is calculated
    by multiplying gas with gas price spent for a transaction. Gas limit indicates
    the maximum amount of gas a user willing to buy to execute the transaction.


    #### Bitcoin Vs. Ethereum


    *   Bitcoin is a blockchain-based cryptocurrency. Ethereum is decentralized programming
    platform with smart contracts and tokens.


    *   Bitcoin is designed for financial transactions. Ethereum focuses on other
    data maintenance using smart contract codes.


    *   Bitcoin uses PoW consensus and Ethereum uses PoS or PoW consensus.


    *   Bitcoin takes 332 M transactions per day, whereas Ethereum takes 455 transactions
    per day. Average block size in Bitcoin is 767 KB and for Ethereum the maximum
    block size is 27 KB. The number of blocks in Bitcoin is 564 K. The number of blocks
    in Ethereum is 7.23 M.


    *   Bitcoin takes 10 minutes for mining and Ethereum takes 10–20 seconds. Bitcoin
    uses SHA-256 for hashing and Ethereum uses Ethash and keccak256.


    #### Framework Overview


    The application can be developed and tested in a Truffle environment. A local
    blockchain network instance can be created using Ganache (a part of Truffle Suite).
