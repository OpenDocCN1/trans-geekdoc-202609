    ## 5.5 Characteristics of Blockchain


    The basic characteristics of blockchain are as follows ([Fig. 5.6](#ch05.xhtml#fig5_6)):


    ![Figure 5.6 Characteristics of blockchain.](images/fig5_6.jpg)


    [Figure 5.6 Characteristics of blockchain.](#ch05.xhtml#fg5_6)


    **Decentralized:** No single authority can control the blockchain network. It
    is a P2P decentralized distributed ledger.


    **Enhanced Security:** Blockchain integrates the cryptographic techniques such
    as digital signature, public key cryptography, and hashing mechanisms to maintain
    integrity. Blockchain network is verifiable. Whenever a block initiates a transition,
    other network entities verify and validate whether the transition is correct or
