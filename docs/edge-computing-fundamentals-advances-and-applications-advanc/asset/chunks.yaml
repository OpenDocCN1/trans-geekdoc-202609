    * 无人机采集视频。初始视频处理（如色彩提取）可以在无人机和设备边缘完成。

    * 捕获的帧被发送到本地边缘进行目标检测（一种更复杂的功能）。

    * 目标检测后的帧被传输到云端进行进一步管理。在云端，可以分析来自多台无人机的数据，以检测活动并进行报告。

    * 如果需要在设备或本地边缘进行重新训练，则可以在云端训练新模型并上传到网络边缘。


    以下章节讨论了边缘计算中常用的设备和网络协议。


    ## 2.3 背景基础知识：IoT 设备


    物联网系统中的智能对象需要感知环境感知并与环境进行交互。因此，这些智能对象通过传感器获取环境属性。它们还通过执行器对周围环境产生动作。转换器将信号从一种形式转换为另一种形式。传感器和执行器都是转换器。IoT
    传感器大多数体积较小、成本效益且功耗低。它们受能量限制。一些常用的传感器列如下：


    ### 2.3.1 基于手机的传感器


    智能手机内置了传感器和数据处理能力。手机可用于感知各种物理元素。


    * 使用加速度计可以感知步行和跑步等运动模式。机械式、电容式和压电式加速度计常见。

    * 使用陀螺仪可以感知方向。

    * 使用摄像头和麦克风可以收集视觉和音频信息。

    * 使用磁力计检测到的磁场可以寻找方向和金属的存在。

    * 使用全球定位系统（`GPS`）可以检测手机的位置。

    * 使用光传感器可以感知环境光强度。

    * 使用使用红外（`IR`）LED 发射 `IR` 线的距离传感器可以测量距离。


    手机中还可能配备测量温度、大气压力和湿度的传感器，如温度计、气压计和湿度传感器。使用手机传感器数据和计算能力的一些应用包括：


    * 使用手机的摄像头、麦克风、加速度传感器进行活动检测。

    * 使用手机中的传感器跟踪身体活动、饮食、运动和生活方式的健身应用。

    * 使用手机的传感器和计算能力还可以分析吸烟模式和心理健康。


    ### 2.3.2 医疗传感器


    可穿戴设备可以使用医疗传感器远程监测患者的健康，测量心率、脉搏、血压、体温、呼吸频率和血糖水平。智能手表、手环、监测贴片和智能纺织品形式的可穿戴设备可监测患者的生命健康参数。从这些传感器测得的数据应与上下文信息相关，以得出正确的推理。


    ### 2.3.3 神经传感器


    这些传感器使用脑电图（`EEG`）读取包括 alpha、beta、gamma、theta 和 delta 波在内的各种脑波。基于此可以推断脑活动，以管理压力、提高学习和心理健康。


    ### 2.3.4 环境和化学传感器


    这些传感器用于获取环境参数，如温度、湿度、压力、水污染和空气污染。电子鼻（`e-nose`）和电子舌（`e-tongue`）根据气味感知化学品。这些传感器可以用于监测污染水平以及食品和农产品的质量。


    ### 2.3.5 无线频率识别


    无线频率识别（`RFID`）是一种识别技术。它有一个名为 `RFID` 标签的小芯片以及天线。环境磁场的变化被编码为信号并传输。这些传输的信号可以被 `RFID`
    读取器读取。当 `RFID` 标签贴在被跟踪物体上时，当物体经过时，读取器会检测并记录其存在。


    ### 2.3.6 执行器


    这些设备通过将电能转换为其他形式引起环境变化。它们包括加热或冷却元件、扬声器、灯、显示器和电机。在智能家居系统中，执行器可用于锁/解锁门、开关灯、控制温度和通知用户。


    考虑一个矿业的操作环境。这种环境是危险的。在工作期间密切监测员工至关重要。可以使用传感器监测员工的健康以及工作状态。用于检测有毒气体、环境温度和照明的环境传感器可以警告员工。可以收集并监测员工的生命体征以发现他们是否处于危险。这些传感器细节可以在操作中心的本地边缘进行分析，以确保员工的安全。因此，边缘计算对于监测矿工的安全非常有益。


    本节讨论了边缘计算环境的感知部分。为了在边缘计算系统的各个组件之间进行通信，有效的通信环境是关重要的。第 4 节讨论了边缘计算系统中常用的网络和数据协议。第
    5 节讨论了使用软件定义网络的网络管理。


    ## 2.4 网络架构


    IoT 设备以异构格式采集大量实时数据。这些数据必须使用适当的通信协议传输到附近的网关，以便进一步处理和传输。通信协议可以分为两类。第一类由网络和数据链路层协议组成。第二类用于应用层和会话的数据传输协议。一些常用的网络层协议包括：


    * **蓝牙**：是电子设备之间的一种安全的、短距离、低功耗、低成本的无线传输协议。通过 2.4 GHz 无线链路促进短距离电子设备之间的数据交换。蓝牙星型、网状和点对点拓扑非常适用于智能家居应用。

    * **Wi-Fi**：是一族无线网络协议，基于 IEEE `802.11` 系列标准，通常用于设备的局域网和接入接入。无线调制调器范围内的任何电子设备都可以尝试访问网络。医疗和智能家居应用中的传感器通常使用
    Wi-Fi 与网关通信。

    * **NFC**：近场通信由飞利浦和索尼开发。是一种极短距离的无线技术，帮助相隔几厘米的设备基于磁场感应进行通信。它常用于支付和忠诚度积分。

    * **Zigbee**：基于 IEEE `802.15.4`，是一种廉价、低功耗、低带宽的个人区域网无线自组技术。它常用于电池驱动的监测和控制应用。

    * **LoRaWAN**：由 Semtech 开发的低功耗远程广域网，使用低无线频率（亚洲为 923 MHz）建立，范围可达 10 公。它有助于建立公共或私有的
    IoT 网络。它可以用于农村地区的水监测和管理以及智能路灯应用。

    * **LTE**：长期演进通过无线技术为蜂窝移动通信系统实现了高性能空中接口。无人机可以通过 4G/LTE 连接到蜂窝塔。


