    ## 5.9 Blockchain Platforms


    Blockchain concepts are implemented and tested in different platforms such as
    Ethereum, `Hyperledger`, `Ripple`, and so on. Each of them is created for executing
    specific types of blockchain categories.


    ### 5.9.1 Ethereum


    Vitalik Buterin designed the Ethereum framework in order to apply decentralization
    to other fields than money transferring purposes. The main aim of the framework
    is to run and build applications that could run globally without any central authority.
    Ethereum is a public blockchain platform that enables developers to build and
    deploy decentralized applications. Application that is executed on P2P network
    is called distributed application (`DApp`). Ethereum focuses on producing `DApp`
    with its features. `DApps` are decentralized applications that are not controlled
    by any authorities, rather it is controlled by the contracts written and deployed
    over the blockchain. Every client in `DApp` interacts directly with its own instances
    of the `DApp`.


    Developers program smart contracts using Ethereum languages. It is compiled, deployed,
    and run on Ethereum Virtual Machine (`EVM`).

