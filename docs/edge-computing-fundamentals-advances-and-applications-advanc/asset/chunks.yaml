  raw: "Here the application is modeled as a directed graph with data transformation\
    \ tasks as its nodes, and dataflow between these tasks as edges. This graph model\
    \ allows the distribution and execution of the tasks across the resources available\
    \ in the cloud, edge, and device layers. These data transformation tasks are also\
    \ called as microelements (MEL) that encapsulate resources, services, and data.\
    \ An MEL encapsulates one of the following categories ([Fig. 1.22](#ch01.xhtml#fig1_23))\
    \ \\[[15](#ch01.xhtml#ref1_15)\\]:\n\n*   Microservices (MS), which offer particular\
    \ functionality and can be easily deployed or migrated,\n\n*   Microdata (MD),\
    \ which represent information flow to and from a sensor or actuator or data centers,\n\
    \n*   Microcomputing (MC), which executes different types of computational tasks\
    \ (e.g., statistical analysis, error checking, or machine learning) using a mixture\
    \ of real-time and historic MD data, or\n\n*   Microactuator (MA), which controls\
    \ the state of a physical resource at the network edge.\n\n![Figure 1.22 Categorization\
    \ of MEL.](images/fig1_22.jpg)\n\n[Figure 1.22 Categorization of MEL.](#ch01.xhtml#fg1_23)\n\
    \nIoT applications are decomposed into a number of interacting atomic MELs that\
    \ perform a simple functionality like gathering data from a sensor, performing\
    \ a simple transformation of data, etc. These MELs are deployed in containers\
    \ like dockers that are hosted in edge or cloud resources. MELs. MELs may be deployed\
    \ and orchestrated across both cloud and edge resources. MELs encapsulate simple\
    \ functionalities in a lightweight virtual environment like container. This enables\
    \ dynamic deployment and migration of MELs across heterogeneous systems. Hosting\
    \ MELs in containers enables\n\n*   Isolation among *MELs* belonging to different\
    \ applications.\n\n*   Execution of MELs on heterogeneous infrastructures like\
    \ edge, cloud, and device based on the application.\n\n*   MEL graph composition\
    \ and orchestration based on the application.\n\nThis enhances the scalability\
    \ and dynamism of IoT applications.\n\nConsider a use case of a fire detection\
    \ and alarm system using drones. Some of the activities include capturing videos\
    \ by cameras in drones, color extraction, object detection, transferring identified\
    \ frames to cloud, and analyzing frames from multiple drones, activity detection,\
    \ report generation, and alarm generation. Microservices can be created for these\
    \ activities. It includes processing (video analytics) and data management functionality.\
    \ The application is initiated with video capture by the drones. The resource\
    \ managers in the fog layer decide on where and when the various microservices\
    \ are to be executed. These microservices can be executed in the device, edge,\
    \ or cloud layers. This decision is based on factors like latency in data transfer,\
    \ resource availability, and the application characteristics. The entire application\
    \ can be modeled as a directed graph with nodes representing the data transformation\
    \ tasks and the edges representing the dataflow dependencies between the transformation\
    \ tasks.\n\nThe activities in the fire detection and alarm case study can be decomposed\
    \ into a number of MELs that can be orchestrated as shown in [Fig. 1.23](#ch01.xhtml#fig1_24):\n\
    \n*   Video capturing using cameras in drones as a MEL in device layer (MEL1).\n\
    \n*   Color extraction using simple computational algorithms as a MEL in the device\
    \ layer (MEL2).\n\n*   Transferring frames to edge data centers as a MEL in the\
    \ device layer (MEL3).\n\n*   Object detection as a MEL in the edge layer (MEL4).\n\
    \n*   Transferring identified frames to cloud as a MEL in the edge layer (MEL5).\n\
    \n*   Analyzing frames from multiple drones as a MEL in the cloud layer (MEL6).\n\
    \n*   Activity detection as a MEL in the cloud layer (MEL7).\n\n*   Report generation\
    \ as a MEL in the cloud layer (MEL8).\n\n*   Notification generation as a MEL\
    \ in the cloud layer (MEL9).\n\n*   Transfer of notification to actuators in the\
    \ device layer as a MEL in the cloud layer (MEL10).\n\n*   Alarm generation by\
    \ actuating the alarm in the device layer as a MEL in the device layer (MEL11).\n\
    \n![Figure 1.23 MEL graph for the case study.](images/fig1_23.jpg)\n\n[Figure\
    \ 1.23 MEL graph for the case study.](#ch01.xhtml#fg1_24)\n\nOsmotic computing\
    \ deals with dynamic migration of microservices between cloud and edge data centers\
    \ to ensure reliable and quality IoT-related services including latency, reliability,\
    \ networking, load balancing, availability security, privacy. The microservices\
    \ are thus provisioned in a federated edge–cloud environment. The bidirectional\
    \ flow of adapted microservices from cloud to edge must be managed. Decoupling\
    \ of network management from data is facilitated using software-defined networking.\
    \ IoTSim-Osmosis is a simulator for osmotic computing environment. It can simulate\
    \ and run osmotic applications between edge and cloud resources. Network is simulated\
    \ with dynamic SDN and SD-WAN. It provides facilities to simulate dynamic routing\
    \ mechanisms and multilevel optimization mechanisms.\n\n## 1.10 Research Directions\n\
    \nTo ensure seamless integration of services at cloud, fog, and device layers\
    \ in the distributed environment, active research is being done in the following\
    \ areas \\[[16](#ch01.xhtml#ref1_16)\\]:\n\n> *Microservice configuration*: In\
    \ conventional architecture suitable cloud resources are selected to configure\
    \ virtual machines (VMs) based on quality of service (QoS) constraints. In osmotic\
    \ computing, micro services are preferred when compared to heavy weight VMs. In\
    \ such a federated cloud-edge environment, it is necessary to automate configuration\
    \ of microservices in both cloud and edge datacenters. Suitable multi-criteria\
    \ optimization and decision making techniques have to utilize to automatically\
    \ configure these microservices.\n\n> \n\n> *Microservice networking*: In traditional\
    \ cloud based IoT systems, data is transferred to the cloud that hosts services\
    \ to manipulate and process the application data. In such an environment, the\
    \ services do not migrate. In osmotic computing based on the needs of the applications,\
    \ micro services can be migrated to/from the cloud/edge resources. The microservices\
    \ behavior changes according to the *application*/user requirements. So flexible\
    \ and configurable networking is required. Software-defined networking (SDN) and\
    \ network function virtualization (NFV) support in-network data processing (between\
    \ edge and datacenter). It also provides network management abstraction by separating\
    \ data and management layers of the network. Federated networks can be used to\
    \ manage the heterogeneous cloud-edge environment.\n\n> \n\n> *   *Microservice\
    \ security*: An osmotic computing framework needs a coherent and consistent security\
    \ policy within both the cloud datacenter and the edge computing environments\
    \ to enable microservice execution and migration. Ensuring that the same security\
    \ considerations are observed for a particular micro service across both environments\
    \ remains a challenge. This necessitates self-identification of services in the\
    \ federated edge – cloud environment and building suitable trust mechanisms.\n\
    \n> *   *Reverse offloading*: Traditional systems offload computing in IoT devices\
    \ to the cloud. Osmotic computing also offers reverse offloading that aims at\
    \ offloading computation done in a cloud resource to an edge device. Hence it\
    \ is essential to identify suitable microservices that can be executed in the\
    \ edge devices when compared to cloud environment to reduce latency and improve\
    \ the performance of the application."
