    ## Public Blockchain

    In public blockchain networks, any people can join without authentication and
    participate in the consensus. Privacy is less and it consumes more energy to run
    the consensus. Public blockchains are volatile networks since any participant
    can join or leave the network as per their wish. This type of network is fully
    decentralized and transparent. An example of fully transparent, permissionless,
    decentralized public blockchain is `Bitcoin` network. Public blockchain can also
    be of permissioned networks. In that regard, the network entities are validated
    before joining the network. An example of permissioned public blockchain is `Ethereum`
    blockchain. Public blockchain makes use of native assets or currencies. For instance,
    `Ethereum` uses `ethers` as its currency. `Bitcoin` network uses `Bitcoin` currency
    as its rewards. Private blockchain does not bother much about the currencies.


    ## Consortium/Hybrid Blockchain

    Consortium/hybrid network is a mixture of public and private blockchain. It integrates
    the advantages of both the network types such as volatility, authentication, privacy,
    and immutability. It also reduces energy cost. It balances between the two types.
    Though membership in hybrid blockchain is private, it is public in governance
    perspective. It is much more energy-efficient and has privacy than permissionless
    network. An example of consortium blockchain is `Ethermint` [[7](#ch05.xhtml#ref5_7)].


    ## 5.8 Blockchain Architecture and Fundamentals

    `Bitcoin` is the first network that introduced blockchain technology. The transactions
    in a `Bitcoin` P2P network happen as shown in [Figs. 5.8](#ch05.xhtml#fig5_8)
    and [5.9](#ch05.xhtml#fig5_9). For any node to participate in the blockchain transactions,
    it must have a `wallet`. It is a program that is used for interacting in the blockchain
    network. A typical blockchain wallet contains `private key` of the user. It examines
    incoming and outgoing cryptocurrency to the account. For sending cryptocurrency
    to other account, digital signature is formed with the help of the `private key`
    present in the `wallet` and the same is verified on the other side using `public
    key`. A `wallet` in a blockchain is similar to that of the account passbook given
    for a user of a bank that is unique for an account. Cryptocurrency operates on
    top of blockchain and is described as virtual money. It is also decentralized
    and cryptographically secured which no single authority can control and monitor
    like blockchain network. A blockchain network can function with or without cryptocurrency
    depending on the type of the blockchain. Typically private blockchain does not
    focus on cryptocurrency or token-based systems.


    ![Figure 5.8 Transaction in blockchain.](images/fig5_8.jpg)

    [Figure 5.8 Transaction in blockchain.](#ch05.xhtml#fg5_8)


    ![Figure 5.9 Transaction workflow.](images/fig5_9.jpg)

    [Figure 5.9 Transaction workflow.](#ch05.xhtml#fg5_9)


    ### 5.8.1 Blockchain behind Bitcoin Network

    In blockchain, all the nodes in a network maintain a consistent copy of distributed
    ledger. Every participant in the network is called `node`. Nodes in the blockchain
    network can be categorized into three distinct types: `light node`, `full node`,
    and `mining node`.


    **Light Node:** `light node` is also called simple node that does not hold the
    complete transaction details. It holds the `wallet` information such as `account
    number` and `private key` of individual user, and initiates new transaction in
    a network. Since it is not holding the ledger, light-weight nodes are not a part
    of blockchain network. So this type of nodes does not participate in validating
    other transactions.


    **Full Node:** `full nodes` are also called `validators` and these are the part
    of blockchain network. It holds the complete transaction history in the form of
    shared ledger. The ledgers in every `full node` of a blockchain hold consistent
    information. It is not responsible to propose a new block but it can initiate
    the transaction and maintain `wallet` information. The major responsibility of
    the `full node` is to validate every transaction. Validation is to ensure whether
    the `wallet` has adequate amount to complete the transaction and also verifies
    the credibility of the entities through its digital signature. In Fig. 5.8, all
    the nodes (A), (B), (J), and (E) are examples of full nodes as all hold the shared
    ledger in `Bitcoin` network.


    **Mining Node:** `mining node` is a `full node` and contains `mining function`.
    It is also called `block generator`. These are the actors or computers responsible
    to propose a new block by solving cryptographic puzzles [[8](#ch05.xhtml#ref5_8)].


    ### 5.8.2 Transaction Validation

    Transaction is the essential building block in the `Bitcoin` network. Validated
    transactions are broadcasted to the nodes of a network. Many transactions altogether
    form a block. Many blocks are cryptographically linked to form a chain. Blocks
    are also verified before these are added to the chain. The validation and consensus
    procedures are carried out by `mining nodes` to validate a block. As shown in
    Fig. 5.8, each and every node has shared ledger. In order to make a transaction
    happen, for every node when it joins blockchain, it provides a `wallet` and a
    `private key` based on the provided identity of the individual node. As shown
    in Fig. 5.8, if Alice wants to transfer money to Bob in `Bitcoin` network, it
    needs to process a sequence of steps as shown in Fig. 5.9.


    Every `full node` in the network validates the transactions by performing user
    authentication and data integrity. User authentication is ensured by decrypting
    the digital signature of the proposing user with the corresponding `public key`.
    Data integrity is checked by hashing the transaction data and comparing it with
    the decrypted signature. This procedure is followed for validating the transaction.
    Valid transactions accumulated in pool of valid transactions. The valid transactions
    are then broadcasted to the `mining nodes` in order to set up a new block in the
    network.


    ### 5.8.3 Mining and Block Structure

    Miner gathers valid transactions and forms `Merkle root hash` using hashing mechanism.
    `Merkle root header` is then added to block header. In this way, all the valid
    transactions are pooled into a block. The number of transactions per block can
    be determined by the `mining nodes`. This block is then broadcasted to the `mining
    nodes`. To identify the next block in the network, consensus mechanisms are then
    utilized in the blockchain. `Block generator/miner` in the network mines the block
    based on the consensus. Miners compete with each other to solve a difficult mathematical
    puzzle like `PoW`. The miner verifies and validates the block by checking the
    correctness of `block hash`, `block height` and `size values`, `previous block
    hash values`, the validity of all transactions in the block, and the `block timestamp
    values`. After mining, miners are rewarded with fees. Upon successful mining,
    transaction fees are given from all the transaction nodes included in the block
    to the miner. The blockchain network also provides new coins when each new block
    is added to the chain.

    '
