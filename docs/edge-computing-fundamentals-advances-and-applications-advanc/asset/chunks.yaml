    # 5 Blockchain and Edge Computing Systems


    DOI: [10.1201/9781003230946-5](https://doi.org/10.1201/9781003230946-5)


    ## 5.1 History of Blockchain


    In the year 2008, Satoshi Nakamoto invented a trustless digital currency called
    `Bitcoin` (`BTC`) in order to eliminate the third-party mediators in digital financial
    transactions. In the concept of `Bitcoin`, the transactions in a peer-to-peer
    (`P2P`) network are verified using cryptographic mechanism and the transaction
    records are stored in the distributed ledger. Here, the successful mining process
    will be rewarded with `bitcoins`. `Bitcoin` mining is a practice of releasing
    `bitcoins` for circulation. In order to add a block in blockchain, miner requires
    solving a computationally strong puzzle to get a reward in terms of `bitcoins`.
    This `Bitcoin` is the first application that uses blockchain technology. In the
    year 2009, with 50 `bitcoins` of rewards, Nakamoto mined the first block of `bitcoins`
    called the genesis block. The first `Bitcoin` transaction was done by Hal Finney
    who had downloaded `Bitcoin` software and obtained ten `bitcoins` from Nakamoto.
    `Bitcoin` was released as open-source software that facilitated many cryptocurrency
    developers to design different cryptocurrencies that mimic `bitcoins`. Satoshi
    is the person who initiated the usage of consensus mechanisms. The `Bitcoin` network
    provides evidence that Proof of Work (`PoW`) consensus is an approach that effectively
    validates and verifies peers in the `Bitcoin` network. Till the year 2014, `Bitcoin`
    was used merely as the cryptocurrency. In 2014, Vitalik Buterin planned to take
    advantage of `Bitcoin` for other domains and purposes apart from cryptocurrency.
    Subsequently, he introduced smart contracts and tried integrating to `Bitcoin`
    network. Upon the opposition by the `Bitcoin` organization, he developed his own
    blockchain called `Ethereum` with its own cryptocurrency called `ether` (`ETH`).
    In the second generation of blockchain, it integrated business logic in the form
    of smart contracts to the applications along with the cryptocurrencies. At present,
    the `ETH` is the second-largest cryptocurrency in the world subsequent to `BTC`.
    In the year 2015, Linux Foundation along with IBM, Intel, and SAP Ariba developed
    a private blockchain for enterprise organizations called `Hyperledger`. As a result,
    speed of the transactions was increased and highly scalable such that small blockchain
    networks were designed to meet the expectations of individual organizations. This
    was the third generation in the evolution of blockchain network [[1](#ch05.xhtml#ref5_1).


    ## 5.2 Distributed Ledger Technology


    In the traditional document sharing system, the multiple authorities cannot pool
    resources where the information cannot be simultaneously managed or processed.
    For instance, if person A updates and sends a document to person B, altogether
    person B cannot update or modify it. He/she has to update the most recent document
    and resend it to person A again which is a time-consuming process even for a minor
    update. Then, the introduction to centralized platforms had resolved this kind
    of issue partially by appointing a central authority/medium to maintain the document
    where updation is done simultaneously as shown in [Fig.5.1](#ch05.xhtml#fig5_1).
    At the same time, as the complete reliance on a single node is not secure, the
    centralized document sharing mechanism came up with a single point of failure.


    ![Figure 5.1 Centralized system.](images/fig5_1.jpg)


    [Figure 5.1 Centralized system.](#ch05.xhtml#fg5_1)


    Decentralized storage mechanism is a feasible solution that provides authority
    to multiple local authorities rather than a single node. Decentralized organizations
    rely on local community, thus eliminates single point of failure as shown in [Fig.
    5.2](#ch05.xhtml#fig5_2). Multiple points of coordination are required in decentralized
    system. Hence, the failure of any local governing authority may result in disconnected
    networks [[2](#ch05.xhtml#ref5_2)].


    ![Figure 5.2 Decentralized system.](images/fig5_2.jpg)


    [Figure 5.2 Decentralized system.](#ch05.xhtml#fg5_2)


    Distributed networks are groups of nodes where every node is independent and interconnected
    to each other. Blockchain is a distributed and immutable database that functions
    without the involvement of any central monitoring authority. Data are not stored
    in a centralized place which prevents it from being lost. Hence, every individual
    entity in the network is equally privileged. Every individual node in a network
    maintains a local copy of the global data sheet. It is called as distributed ledger
    that maintains all transactions among entities of a network with time stamp so
    as to maintain tamper-resistant data as shown in [Fig. 5.3](#ch05.xhtml#fig5_3).
    There are two types of ledger models that are currently in use by various blockchain
    frameworks. Unspent Transaction Output (`UTXO`) model is used by the `Bitcoin`
    network. Account balance model is used in `Hyperledger` and `Ethereum` blockchain
    frameworks.


    ![Figure 5.3 Centralized vs. distributed ledger.](images/fig5_3.jpg)


    [Figure 5.3 Centralized vs. distributed ledger.](#ch05.xhtml#fg5_3)

