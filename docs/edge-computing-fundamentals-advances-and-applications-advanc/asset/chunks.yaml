    ## 1.8 Cloud Computing


    Cloud computing is a form of utility computing just like grid, where users pay
    for the computing resources used by them. Cloud \[[9](#ch01.xhtml#ref1_9)\] is
    defined as a parallel and distributed system consisting of a shared pool of abstracted,
    virtualized, dynamically managed computing resources (like storage, computing,
    platforms, network, applications) that are maintained in data centers. The resources
    are dynamically provisioned and reconfigured based on demand from the user. Hence
    resource management in cloud is elastic in nature. This is done automatically
    with less manual intervention. Hence services are abstracted from the user. SLA
    acts as a contract between the service provider and consumer. Users are then charged
    based on their usage of the computing resources. This forms a business model.
    From business point of view, this model reduces the capital and operational expenses
    of an organization.


    ### 1.8.1 Characteristics of Cloud Environments


    Cloud computing models enable ubiquitous, convenient, on-demand network access
    to a shared pool of configurable computing resources. The following are the key
    characteristics of a cloud computing environment:


    *   Service-oriented architecture: All functionalities are offered to users as
    services through interfaces. These services can be easily extended, composed,
    orchestrated to offer the desired functionality to the user. SOA facilitates loose
    coupling and abstraction. Services can be customized to meet the user needs.


    *   *On-demand self-service*: Services can be provided dynamically, without human
    intervention as and when required by the user.


    *   *Broad network access*: The cloud provides services to heterogeneous client
    devices such as mobiles, laptops, and workstations through a standard network
    like the Internet.


    *   *Resource pooling*: The provider’s resources are pooled and allocated/de-allocated
    to users dynamically, on-demand.


    *   *Rapid elasticity*: The resources in the cloud are dynamically provisioned
    and released on-demand as and when required by the application.


    *   *Measured service*: The services provided by the cloud can be metered and
    monitored.


    *   *Location independence*: Users access the cloud services anywhere and anytime
    through the Internet.


    *   Business Model: Cloud computing provides a business model for the IT industry
    where the computing resource usage can be monitored. Payment can then be based
    on the usage of resources.


    *   Virtualization: This technology abstracts the hardware/software resources
    from the user. One physical resource is compartmentalized into many virtual resources
    that can be offered to various users. This has resulted in multitenancy where
    a single resource is utilized by many users. This in turn increases resource utilization
    and reduces the cost.


    ### 1.8.2 Cloud Models


    Cloud computing models are categorized based on their delivery of services or
    based on their deployment model. These two categories are discussed in the following
    section.


    #### 1.8.2.1 Cloud Services Models


    The cloud services model defines the core functionality of the services implemented
    at different levels and delivered to the clients. Such delivery models ([Fig.
    1.17](#ch01.xhtml#fig1_18)) can be categorized as follows:


    *   *Infrastructure as a Service* (*IaaS*) allows providers to set up and deliver
    virtualized hardware resources such as storage, compute, and networking to the
    users. Communication as a Service and Data storage as a Service are also some
    examples of IaaS. IaaS falls under the category of utility computing.


    *   *Platform as a Service* (*PaaS*) offers developers with the tools, platforms,
    and environment to build and deploy their applications on the cloud. It includes
    platforms for the development and deployment of services, environments for runtime
    execution, databases, APIs, etc. This is also termed as framework computing.


    *   *Software as a Service* (*SaaS*) offers applications operating in the cloud
    that can be accessed remotely on-demand as a service by the end-users. Users are
    thus freed from the burden of installing and using the required software locally.
    It is termed as business computing.


    ![Figure 1.17 Cloud service models.](images/fig1_17.jpg)


    [Figure 1.17 Cloud service models.](#ch01.xhtml#fg1_18)


    Following this, other services, such as database as a service and analytics as
    a service, can also be set up. Big Data as a Service (BDaaS) maintains and manages
    voluminous data on the cloud storage and offers continuous access of the same
    to its owner.


    #### 1.8.2.2 Cloud Deployment Models


    Based on the functionality and accessibility of cloud services \[9\], the cloud
    offers four deployment models ([Fig. 1.18](#ch01.xhtml#fig1_19)):


    *   *Public cloud*: Users access the resources including infrastructure, frameworks,
    applications, and services provided by the service providers over the Internet.
    Users subscribe to the services they access and have to pay based on their usage.


    *   *Private cloud*: This type of cloud is in-premise and services are offered
    over the intranet. It is more secure when compared to a public cloud.


    *   *Hybrid cloud*: It is composed of multiple public/private clouds. This model
    offers the advantages of public and private deployment models.


    *   *Community cloud*: This can be a public/private cloud shared by a set of organizations
    under the same administrative domain.


    ![Figure 1.18 Cloud deployment models.](images/fig1_18.jpg)


    [Figure 1.18 Cloud deployment models.](#ch01.xhtml#fg1_19)


    NIST architecture of cloud is layered and is based on the essential characteristics
    of cloud at the top, followed by the delivery models and deployment models. The
    following are the advantages of the cloud model of distributed systems:


    *   Cost reduction: It reduces the Capital expenditure of purchase of equipment
    and operational expenditure of maintaining the cloud environment in an organization.
    Further, the operational expenditure including power, wages, and upgradation is
    shared by all the users.'
