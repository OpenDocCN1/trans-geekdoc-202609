    Edge analytics is the process of gathering, dealing out, and analyzing of data
    either at the edge of a network or closer to a network connecting device or at
    some other edge processing software installed nearby. With the advancements of
    IoT and connecting devices in automating the systems, several industries for instance
    healthcare, energy, automotive and manufacturing are producing huge amount of
    data at the edge of the network. Earlier approaches were collecting these data
    and stored them on cloud or data centers for further processing. As the size of
    data increases, time taken to push the data to centralized platform and processing
    them consumes more quantity of time [[5](#ch03.xhtml#ref3_5)]. The objective here
    is, to process and analyze the data between the actual source of the data and
    the data center. It is an optimized and distributeded mechanism to IoT and cloud
    computing systems that reduce latency also decision making will be on time. Processing
    devices at the edge permit data to be analyzed and the reports are to be distributed
    to ultimate user for preventing breakdowns in well-timed manner. These edge analytics
    could be of type descriptive or diagnostic or predictive analytics depending on
    the requirement of an application [8].


    It is extremely essential to be aware of where edge data analytics suits the most!


    Monitoring the systems for real-time safety is crucial for decisive infrastructures
    such as oil rigs, gas, aircraft, and CCTV cameras [[1](#ch03.xhtml#ref3_1)]. In
    order to safeguard these critical systems from any kind of disasters many smart
    devices and functionalities are being developed. Edge analytics is one of such
    solutions that detects the malfunctions at the earlier stage and alarms the respective
    personnel to act accordingly.


    Let’s consider a scenario of an oil rig that collects massive sensor data far
    away from the data center. The edge analytics lets the sensor data to access a
    decentralized platform and thereby performs analytics at the offshore and perhaps
    shuts down the flawed valves if any. This is considered as more efficient solution
    than sending data to data center or cloud environment and hang around for the
    same result much later [[3](#ch03.xhtml#ref3_3)].


    Edge analytics provides following key benefits [[4](#ch03.xhtml#ref3_4)]:


    * **Reduces Latency**: The decisions can be made faster and on time as the data
    is processed near to the source. This improves the liveliness and agility of an
    application.

    * **Scalability**: As the number of network devices grows up, the quantity of
    data that is being collected and processed also rapidly increases. Edge analytics
    scales up the processing capabilities by providing the potential for decentralization.

    * **Reduced Storage Costs**: The data is processed for necessary information prior
    to the storage. It reduces the storage cost as it is not necessary that all generated
    data are to be stored for many applications like autonomous vehicle, traffic management
    system, and so on.

    * **Reduction of bandwidth**: The data to be transmitted to cloud are relatively
    reduced or filtered in the edge by processing it over there. Hence, it consumes
    comparatively low bandwidth.

    * **Cost-effective**: The recovery will be usually faster even in distant locations
    as any failure that occurs in the analytics system can be predicted and avoided
    using data analytics mechanisms which prevents the loss that happens due to failure
    and reduces human interventions. Hence, edge analytics gives a cost-effective
    solution.

    * **Preserves security and privacy**: Machine learning algorithms can be integrated
    to protect IoT from various attacks and to prevent unauthorized access.


    ## 3.9 Potential of Edge Analytics


    Though edge analytics is a blooming area, it might not be considered as a substitute
    for actual big data analytics. IoT along with the data analytics provides whole
    lot of advancements in various application domains. However, the biggest compromise
    of edge data analytics is that it analyzes only the subset of data generated and
    transmits the analyzed results alone to the cloud. Remaining unprocessed data
    will be lost and never stored at all. Hence, edge analytics is preferred only
    where this kind of data loss is negligible [7].


    ## 3.10 Architecture of Edge Analytics


    Edge analytics is a method of enhancing IoT and cloud computing by analyzing data
    near to the source as shown in [Fig. 3.9](#ch03.xhtml#fig3_9). Edge analytics
    aims at accessing computing resources in a more optimal way. Streaming and real-time
    data that are generated by IoT such as motor vehicles, home appliances, traffic
    lights, health care devices, and smart machineries can be processed at its point
    of source using localized edge server which can hold its own computing capability.
    In the meantime, intermediary servers can also be incorporated to the system to
    analyze data in proximity to the origin when needed. It reduces latency comparatively
    than the analytics done on the cloud infrastructure as the decision is made near
    to the data source. The time-sensitive decisions will not be made on time if the
    cloud servers does the analytics process. The quality of service is considerably
    increased in the edge analytics framework. Because the amount of data to be moved
    to cloud is reduced this in sequence minimizes the traffic and the transmission
    cost [3].


    ![Figure 3.9 Architecture of edge analytics.](images/fig3_9.jpg)


    [Figure 3.9 Architecture of edge analytics.](#ch03.xhtml#fg3_9)


    For instance, wind turbines use several electrical and optical sensors for variety
    of needs. Those sensors may help observe the vibration levels of wind turbine,
    temperature, the distance between other objects, and so on. The system need not
    send generated data persistently to the cloud analytics server. Instead, it can
    be designed to send data only when the data go beyond the threshold [1].


    ## 3.11 Machine Learning for Edge Devices


    TinyML is the field of study of machine algorithms that runs on less resource-intensive
    devices like mobile, microcontrollers, and other IoT devices. Inclusion of TinyML
    in smart IoT devices increases the latency as the data is processed on premises.


    **Tensor Flow Lite**: Tensor Flow Lite is an open-source framework for making
    rapid inferences by means of Tensor Flow machine learning models on less resource-intensive
    devices such as mobile phones, IoT devices, and other embedded devices. It generates
    an optimized tiny model suitable for executing on common edge devices. The edge
    devices are less capable to handle huge dataset as it has limited processing power
    and memory. Inducing artificial intelligence to the devices leads to resource-intensive
    processes. Tensor Flow Lite is developed by considering these issues and it uses
    the workflow as shown in [Fig. 3.10](#ch03.xhtml#fig3_10).


    ![Figure 3.10 Working flow of Tensor Flow Lite framework.](images/fig3_10.jpg)


    [Figure 3.10 Working flow of Tensor Flow Lite framework.](#ch03.xhtml#fg3_10)


    For the respective application, developing the custom deep learning model or pre-trained
    model is the foremost step at all times. Tensor Flow comes up with two additional
    components with the aim of transforming the current deep learning model to a lighter
    model which is capable to function on the target edge devices. Those components
    are Tensor Flow Lite Converter and Tensor Flow Lite Interpreter. Converter helps
    convert the custom Tensor Flow model to Tensor Flow Lite format. Interpreter helps
    to implement the Lite model to the target edge device by making use of various
    APIs. The model optimization can also be implemented so as to provide minimal
    changes in the performance of the model [[10](#ch03.xhtml#ref3_10)].

