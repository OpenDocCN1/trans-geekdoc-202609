    # Federated Machine Learning


    Machine learning model from different hosts can be integrated in order to preserve
    data privacy using federated learning approach. In many applications, data is
    residing at different places. Processing them altogether without disclosing the
    data to any central authority is the biggest challenge. In the applications like
    Image processing, combining different sources of data has become essential most
    of the times to provide adequate training and to build better model. Without centralized
    training data, federated learning unites the models of various hosts. It addresses
    the issues related to privacy and security of the individual’s data. It also helps
    edge data processing by keeping the data local instead of moving it to cloud.
    Federated machine learning ensures privacy-preserving data sharing among different
    entities without the involvement of cloud.


    ## 3.12 Edge Analytics: Case Study


    Corona Virus disease (COVID 19) is an infectious respiratory disease that had
    affected people all over the world. The only best way to safeguard ourselves is
    the social distancing. The organizations started deploying smart systems to keep
    track of these safety measure violations. The edge analytics-enabled smart CCTV
    systems significantly help in monitoring the people who move around the workplaces,
    malls, hospitals, universities, schools, restaurants, factories, and in all kinds
    of mass gatherings.


    The key targets of the system are as follows:


    *   Helps monitor the total number of inhabitants in an environment

    *   Generate notifications to health and safety department in the organization
    to address the safety violations

    *   Facilitate well-programmed safety decisions


    The working structure of this edge analytics-enabled CCTV system is as follows:


    The CCTV videos are sent to IoT edge servers. The edge server constantly retrains
    the machine learning model. The model including object detection along with certain
    mathematical calculations is built to measure the distance among people to ensure
    the social distancing. The system alerts the respective personnel when the violation
    takes place `[[9](#ch03.xhtml#ref3_9)]`.


    ## 3.13 Research Challenges and Future Research Directions


    *   Providing adequate security and privacy for the data when it is analyzed on
    premises is the key research field.

    *   While processing on the edge, only subset of data is analyzed. Missing out
    raw data might exclude some important insights.

    *   Approaches that facilitates to reduce the processing speed and processing
    power are the core objectives of implementing edge analytics. Improvements in
    the usage of those approaches are with developer’s hands.

    *   IoT solutions are generally slow to make responses. Introducing the edge analytics
    may further reduce the latency.


    ## 3.14 Summary


    Data analytics is everywhere nowadays. Recent years have seen massive development
    in various domains with the gadget of new approaches using data analysis techniques.
    The IoT and cloud computing jointly functions as edge computing that is yet another
    thriving field in today’s smart world. The data analytics doesn’t fail to give
    its hold in edge computing as well. Dealing out streaming and massive data generated
    by smart IoT devices is the challenging task due to its size and processing time.
    Though, current approaches help process data in substantial delay, disseminating
    them to cloud storage is still a big challenge. Edge servers fixed either on premise
    or near to the data source are capable enough to do data analysis at the edge
    and it also helps to filter the data to be moved to the cloud. This in sequence
    builds a low latency, scalable, and cost-effective system. The analytics methods
    incorporated to smart systems yet again reduces the human interventions, automates
    the tasks and helps make decisions on time, and makes the smart systems to perform
    even smarter.


