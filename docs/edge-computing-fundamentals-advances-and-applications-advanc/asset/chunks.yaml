    ## Perception layer

    It consists of the edge devices. An edge device is a special-purpose cost-effective
    hardware designed to perform a specific task effectively. The edge device has
    limited compute/storage resources. Some examples of such devices include transducers,
    sensors, actuators, logs, and cameras that perform functionality of gathering
    and/or transmitting data. Some edge devices have processing power to do additional
    activities. Analytics applications on image, video, text data gathered by these
    devices need to be deployed and managed based on the resource availability [[4](#ch02.xhtml#ref2_4)].`.


    ## Networking layer

    It is responsible for connecting devices, edge systems, and cloud systems. It
    comprises various communication and data transfer protocols.


    ## Edge computing layer

    The major components in this layer include the edge server and gateways. An edge
    server has higher computational/storage capacity when compared to an `IoT` device.
    Workload that cannot be carried out in a resource-constrained edge device can
    be done using these general-purpose compute nodes or a cluster of nodes. Edge
    gateways in this layer perform specialized network functions including protocol
    mapping, network termination, and tunneling and firewall protection.


    ## Application or processing layer

    This layer is responsible to carry out complex data-intensive tasks and to store
    voluminous data. Private or public cloud servers in this layer act as repositories
    for sharing data among the nodes. Cloud servers perform complex data-intensive/compute-intensive
    applications that cannot be hosted in edge servers. Cloud servers can also be
    used for resource allocation and job management at the edge nodes.


    Apart from the above-mentioned components, a suitable interface is to be provided
    for the users to monitor, manage, and interact with the system. The next section
    will provide a detailed architecture of the edge computing system.


    ## 2.2 Edge Computing Architecture

    By considering edge and cloud computing paradigms as complementary, a synergy
    can be reached between them. Edge servers can handle latency-aware computing in
    close proximity to data sources. Shared global computation/storage, management,
    and data privacy can be handled effectively in the cloud server. Fig. 2.1 discussed
    the various layers of a generic edge computing model. [Fig. 2.2](#ch02.xhtml#fig2_2)
    provides a more detailed view [[5](#ch02.xhtml#ref2_5)] considering a network
    of edge servers.


    ![Figure 2.2 Edge computing – a detailed architecture.](images/fig2_2.jpg)


    [Figure 2.2 Edge computing – a detailed architecture.](#ch02.xhtml#fg2_2)


    ### 2.2.1 Edge Devices

    Edge devices provide the capability to collect data and perform local processing.
    They include sensors, cameras, recorders, microphones, and actuators. These devices
    have limited compute and storage but can perform basic tasks and data filtering.


    ### 2.2.2 Edge Server Cluster

    When a cluster of servers is considered, it provides higher computational and
    storage capacity compared to individual devices. This layer handles resource-intensive
    applications such as video/text analytics that cannot be processed at the device
    edge. Resource provisioning service allocates both cloud and edge resources dynamically
    for various tasks based on the information provided by the monitoring, profiling,
    prediction services, and user requirements.


    ### 2.2.3 Cloud Server

    The server is used to perform complex computation, resource allocation and management,
    data summarization, and secure data storage. Resource management defined by software
    framework in the cloud offers middleware services to manage the resources of the
    entire system and maintains quality of service for the applications. These services
    aim to balance application latency and cost by choosing a suitable resource for
    a task either in the device, edge server, or cloud layer. Some of the services
    offered in this layer include:


    *   Data management service is used to access information stored in various `SQL`
    and `NoSQL` data stores.

    *   Monitoring service keeps track of the current status of applications and resources
    in the entire system.

    *   Knowledge base maintains past information on resource/application demands.

    *   Profiler creates resource/application profiles based on historical information
    in the knowledge base as well as current information obtained from the monitoring
    services.

    *   Performance prediction service forecasts the resource utilization and performance
    based on the historical information on resource demands. This in turn affects
    the application performance.

    *   Security service provides the required authentication, authorization, and
    confidentiality for various applications.

