    # 联邦机器学习


    通过联邦学习方法，可以对来自不同主机的机器学习模型进行整合，以保护数据隐私。在许多应用中，数据存储在不同的地方。在不向任何中央机构披露数据的情况下对这些数据进行统一处理是最大的挑战。在图像处理等应用中，结合不同来源的数据已成为提供充分训练和构建更好模型在大多数时候的至关重要的。在没有集中式训练数据的情况下，联邦学习统一了各种主机的模型。它解决了与个人数据隐私和安全相关的问题。它通过将数据保留在本地而非移动到云端，有助于边缘数据处理。联邦机器学习确保了不同实体之间在不涉及云的情况下进行保护隐私的数据共享。


    ## 3.12 边缘分析：案例研究


    新冠肺炎（COVID 19）是一种影响全球的传染性呼吸道疾病。保护自身的唯一最佳方式是社交距离。各机构开始部署智能系统以追踪这些安全措施的违规情况。支持边缘分析的智能
    CCTV 系统对于监控工作场所、商场、医院、大学、学校、餐厅、工厂以及各种聚集场所中活动的人非常有帮助。


    该系统的关键目标如下：


    *   帮助监控环境中的总人数

    *   向组织内的健康和安全部门生成通知以处理安全违规行为

    *   促进经过良好的安全决策


    该支持边缘分析的 CCTV 系统的工作结构如下：


    CCTV 视频被发送到 IoT 边缘服务器。边缘服务器不断重新训练机器学习模型。构建了包括目标检测以及某些数学计算的模型，用于衡量人与之间的距离以确保社交距离。当发生违规行为时，系统会向相关人员报警
    `[9]`。


    ## 3.13 研究挑战与未来方向


    *   在本地分析数据时，为数据提供充分的安全和隐私保护是关键研究领域。

    *   在边缘进行处理时，仅分析数据的子集。遗漏原始数据可能会排除掉一些重要的见解。

    *   有助于降低处理速度和处理能力的方法是实施边缘分析的核心目标。这些方法的改进空间掌握在开发者手中。

    *   IoT 解决方案的响应通常较慢。引入边缘分析可能会进一步降低延迟。


    ## 3.14 总结


    数据分析如今无处不在。近年来，随着使用数据分析技术的新方法的出现，各个领域都取得了巨大的发展。IoT 和云计算共同构成了边缘计算，这是当今智能世界中另一个蓬勃发展的领域。数据分析在边缘计算中同样占据一席之地。由于智能
    IoT 设备生成的流和海量数据的规模和处理时间，处理它们是一项挑战性任务。尽管目前的方法有助于在很大延迟处理数据，但将其传播到云存储仍然是一个巨大的挑战。固定在本地或数据源附近的边缘服务器完全能够在边缘进行数据分析，并且有助于过滤移动到云端的数据。这顺序构建了一个低延迟、可扩展且具效益的系统。集成到智能系统中的分析方法再次减少了人工干预，使任务自动化并帮助及时决策，让智能系统变得更加智能。


