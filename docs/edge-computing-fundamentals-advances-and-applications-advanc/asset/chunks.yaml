    The hypotension is known as low blood pressure when the blood pressure reading
    of systolic falls below 90 mm Hg and diastolic falls below 60 mm Hg [9]. A mean
    arterial pressure less than 55 mm Hg can cause hypotension. `MAP` is calculated
    using the formula:


    $${MAP} = \\frac{{SBP} + 2\\left( {DBP} \right)}{3}$(6.5)$$


    where `SBP` is systolic blood pressure and `DBP` is diastolic blood pressure.


    ### 6.3.3.2 Edge Server Analysis on MAP


    Using blood pressure monitor device, systolic and diastolic values are collected
    from the people and are stored in edge server for analysis of hypotension as shown
    in [Table 6.4](#ch06.xhtml#table6_4). To ensure safety, values are homomorphically
    encrypted and determine whether a person has hypotension or not.


    #### Table 6.4 Data Collected via Blood Pressure Monitor


    | ID || Gender || Systolic\_Pressure || Diastolic\_Pressure |

    | --- | --- | --- | --- |

    | 1 || M || 36 || 23 |

    | --- | --- | --- | --- |

    | 2 || F || 38 || 39 |

    | 3 || M || 37 || 35 |

    | 4 || M || 26 || 33 |

    | 5 || F || 4 || 17 |

    | 6 || F || 12 || 31 |

    | 7 || M || 59 || 19 |

    | 8 || F || 8 || 35 |

    | 9 || M || 39 || 70 |


    The `MAP` formula is applied over the encrypted systolic and diastolic blood pressure
    values. During analysis, the calculated `MAP` value is compared with the encrypted
    value of `55`. If the calculated `MAP` value is less than the encrypted value
    of `55`, then the person has hypotension and the result is added to the database
    in the edge server as shown in [Table 6.5](#ch06.xhtml#table6_5).


    #### Table 6.5 Identification of Hypotension Based on MAP


