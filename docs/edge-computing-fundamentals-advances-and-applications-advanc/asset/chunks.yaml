    # 工业 4.0 与机器学习的进展


    *系列主编：M. Niranjanamurthy*


    工业 4.0 是指的是一种重点关注互连性、自动化、机器学习和实时数据的工业革命。它涉及制造技术和流程中的自动化和数据交换，其中包括信息物理系统（`CPS`）、物联网（IoT）、工业物联网（`IIOT`）、云计算、认知计算和人工智能。工业
    4.0 的革命正在为制造商提供更快速、更灵活、更高效的流程，以更低的成本生产更高质量的商品。机器学习是利用软件工程原理、分析和数据科学知识，并将两者结合，以便将创建的
    ML 模型提供给产品或消费者使用的过程。拟提出的系列书籍将针对本科高年级学生、研究生和专业人士，侧于讨论工业 4.0 和机器学习的高级概念。一些新兴的应用领域包括制造工艺、工业工程、电子与通信工程、计算机科学与工程以及电气工程。


