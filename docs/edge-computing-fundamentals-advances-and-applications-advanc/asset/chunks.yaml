    \n*   **Multiprocessing**: wherein two or more independent programs are executed\
    \ on separate processors.\n\nAdvances in networking and high-speed networks triggered\
    \ to bloom of truly distributed systems.\n\n## 1.4 Distributed Computing\n\nThe\
    \ growth of networking technology with reduced data transfer latency and increased\
    \ bandwidth was the driving force behind the emergence of distributed computing\
    \ paradigm. The paradigm emerged with the initiation of communication between\
    \ remote computing resources using message passing in the 1960s. The growth of\
    \ local area networks, ARPANET, and email services in the 1970s triggered its\
    \ growth. Distributed computing system is a system with multiple independent autonomous\
    \ systems that communicate and coordinate actions in order to appear as a single\
    \ coherent system to the end-user. When a job is given by the user, the system\
    \ executes the job transparently. Users of the distributed system should be able\
    \ to view the system as a virtual centralized system that is flexible, efficient,\
    \ reliable, secure, and easy to use.\n\nIn a soccer team, each player has his\
    \ own expertise and works autonomously. There is no shared state among players\
    \ (no communication). Further, there is no global synchronization for player moves.\
    \ The team has a common objective to defend the goal post and secure a goal. This\
    \ is an apt analogy to a distributed system defined as “a collection of autonomous\
    \ nodes communicating to address a problem collectively, with no shared memory\
    \ and no common physical clock (for control)”.\n\nTo meet this challenge, some\
    \ of the factors to be considered in the design of the system \\[[4](#ch01.xhtml#ref1_4),[5](#ch01.xhtml#ref1_5)\\\
    ] include:\n\n*   **Transparency:** This characteristic hides the details of the\
    \ internals of the system from the user. Some of the types of transparencies include:\
    \ \n\n    *   Location transparency: User is not aware of where the resource is\
    \ located.\n\n    *   Migration transparency that hides the details as to whether\
    \ a job has migrated from one node to another.\n\n    *   Replication transparency\
    \ hides the details of replicas from the user.\n\n    *   Failure transparency\
    \ hides the details of reallocation of another resource when a particular resource\
    \ fails.\n\n    *   Concurrency transparency provides an abstraction to sharing\
    \ a resource among multiple users.\n\n    *   Access transparency hides access\
    \ details from the user.\n\n    *   Scale transparency facilitates scaling the\
    \ system without disrupting its services.\n\n*   **Reliability**: Existence of\
    \ multiple nodes in a distributed system avoids single point of failure prevalent\
    \ in centralized systems. To ensure reliability, distributed systems should be\
    \ able to detect and recover from crash faults. In case of failure, suitable mechanisms\
    \ to handle such failures should be designed to tolerate faults. To tolerate from\
    \ faults, redundancy and decentralized control are frequently used. Redundancy\
    \ is replicating the functionality/object in multiple nodes. This ensures that\
    \ even if node fails, the functionality replicated in another node can be instantiated\
    \ to make the system function. This offers the system capability to tolerate faults\
    \ during its operation. Centralized control increases the possibility of single\
    \ point of failure and hence reduces the reliability of the system. So decentralized\
    \ control is preferred.\n\n*   **Fault detection and recovery**: Also enhance\
    \ reliability of the system. It includes hardware and software mechanisms used\
    \ to detect failures as well as mechanisms to correct the system state for continued\
    \ operation. Atomic transactions, stateless servers, and use of acknowledgments\
    \ for message transfers can increase system reliability.\n\n*   **Flexibility**:\
    \ Facilitates introducing modifications in the system to meet the user needs.\
    \ New functionalities or services can be added or existing services can be modified\
    \ to make the system more effective and efficient.\n\n*   **Scalability**: Scalability\
    \ refers to the capability of a system to adapt to increased service load. Decentralization\
    \ helps to build scalable systems.\n\n*   **Security**: Resources in a distributed\
    \ system should be protected against destruction and unauthorized access. Authentication\
    \ and authorization can be provided using cryptography principles. Integrity of\
    \ the messages and data should be preserved. Non-repudiation can be ensured using\
    \ digital signatures. Security audits are essential.\n\n*   **Performance**: The\
    \ performance of the distributed system should be better than that of a centralized\
    \ system. Some of the measures taken to increase performance in distributed systems\
    \ include employing fine-grain parallelism, minimizing the redundant copy operations\
    \ and network traffic, batching the jobs before submission, and using caches to\
    \ reduce data transfers/disk read/write operations.\n\nSome of the advantages\
    \ of distributed computing \\[[6](#ch01.xhtml#ref1_6)\\] include:\n\n*   **Performance**:\
    \ As tasks in a distributed application can be executed in parallel by distributing\
    \ the load across the nodes in the network, they yield good performance.\n\n*\
    \   **Collaboration:** Multiple applications can be connected through standard\
    \ distributed computing mechanisms and communicate to complete their task collaboratively.\n\
    \n*   **Higher reliability and availability:** As the applications/tasks are replicated\
    \ across multiple machines, it offers better reliability.\n\n*   **Scalability:**\
    \ Communication and loose coupling in distributed systems enable better scalability.\n\
    \n*   **Extensibility:** Distributed applications can be dynamically reconfigured.\
    \ Divide and conquer approach breaks up large problems into smaller ones, these\
    \ individual components can be developed by smaller development teams in isolation.\n\
    \n*   **Reuse:** The distributed components may perform various services that\
    \ can potentially be used by multiple client applications. It saves repetitive\
    \ development effort and improves interoperability between components."
