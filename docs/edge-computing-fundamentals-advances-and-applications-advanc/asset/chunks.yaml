    # 4 Edge Data Storage Security


    DOI: [10.1201/9781003230946-4](https://doi.org/10.1201/9781003230946-4)


    ## 4.1 Data Security


    Deploying edge platforms without sacrificing security is indispensable as the
    edge devices are placed very close to the data and it is communicated to the central
    cloud server. Data security is at the forefront between edge and cloud communication
    and it acts as the key aspect of the framework. Data communication between edge
    and cloud is of three types:


    *   Very time-sensitive data


    *   Less time-sensitive data


    *   Data that are not time-sensitive


    Very time-sensitive data is of response-oriented/analytics-oriented edge data.
    For any application, if the data need to be sent immediately for processing and
    taking decisions, it is categorized as very time-sensitive data. The objective
    is to minimize latency and to make spontaneous decisions/analyses for mission-critical
    applications such as oil rig/aircraft/missile launch. On the contrary, less time-sensitive
    data denotes the data that can wait for weeks. Data that are not time-sensitive
    are laid in the queue and, when it is required, sent to the central cloud server
    for processing/analysis.'
