    # 2 Edge Computing and Its Essentials


    DOI: [10.1201/9781003230946-2](https://doi.org/10.1201/9781003230946-2)


    ## 2.1 Introduction


    Consider a smart building with video cameras to detect the movement of people.
    Video signal is continuously streamed to the cloud server. The motion detection
    application in the cloud server can detect features and store to the database.
    As large volume of video data is streamed continuously to the cloud, significant
    network bandwidth is consumed. The cloud server should also analyze the video
    footage from all the cameras simultaneously. These issues can be overcome if the
    motion detection application could be executed close to the cameras. Only the
    required clips can then be transferred to the cloud for further analysis and storage.


    Traditionally, real-time data collected from various sensors is propagated uplink
    to cloud servers for further processing and storage. The cloud infrastructure
    is highly suitable to process such large amount of continuously changing heterogeneous
    data also termed as big data. But, big data processing in distant cloud infrastructure
    fails when data sources are distributed across multiple locations and processing
    is to be done near real-time. This motivates the need for an alternative paradigm
    that is capable of performing computations closer to the sensors or data sources.
    Such an infrastructure located at the edge of the network is capable of performing
    low latency computations, aggregating the data, and then transferring it to the
    cloud for further analysis. Also, downstream responses from the cloud are returned
    to these nodes. The edge of the network can be a room, a building, or a campus
    based on the network coverage.


    It becomes essential to process voluminous data generated by IoT devices in real-time
    in proximity to data sources using edge computing infrastructure. This not only
    reduces latency in computation and usage of networking resources but also enforces
    data security. This section discusses the evolution of edge computing paradigm
    through the technology preparation phase, rapid growth phase, and stabilization
    phase [[1](#ch02.xhtml#ref2_1)].


    Technology preparation phase started off with content development networks (CDN).
    CDNs with geographically distributed caching servers enabled users to access the
    nearest server (1998). Network traffic and latency were decreased. While CDN emphasizes
    on data caching, edge computing focuses on function caching. In 2005, function
    caching was applied for personalized mailbox management to reduce latency. Cloudlet
    (2009) was used to downstream cloud information to network edge. Edge data processing
    initially started with mobile devices (2010). Mobile edge computing (MEC) emphasizes
    the establishment of edge servers between the cloud server and edge devices for
    offloading computations. The concept of fog computing was fostered by CISCO (2012).
    Fog computing focuses on a virtualized computing platform to migrate cloud tasks
    to the network edge. While fog computing aims at optimizing communication at the
    infrastructure level, edge computing (2013) focuses on computing and network resources
    at the device, edge server, and cloud server layers. Cloud-sea computing emphasizes
    on the cloud end and human/physical world end of the system. But, edge computing
    concentrates on the communication path (upstream and downstream) between the cloud
    and the IoT devices.


    Since 2015 edge computing has attracted more attention from industry and academia.
    In 2015 edge computing gained its formal definition from “Edge computing: Vision
    and challenges” white paper. The paper defined edge computing as an enabling technology
    allowing computation to be performed at the edge of the network, on downstream
    data on behalf of cloud services, and on upstream data on behalf of IoT services.
    In 2016 NSF in collaboration with Intel established information center networks
    in wireless edge networks (ICN-WEN). NSF Workshop on Grand Challenges (2016) and
    edge computing symposium in China (2017) exposed the technology to the scientific
    community. LinuxEdgeX – the common open framework for IoT edge computing was built
    in 2017. The year 2018 saw active industrial participation in development of edge
    computing platforms. Automotive Edge Computing Consortium was formed in 2018.
    The first book on edge computing was also published in this year. Kubernetes used
    in both cloud and device environments was developed collaboratively by Cloud Native
    Computing Foundation (CNCF) and Eclipse Foundation in 2019. The usage of edge
    computing in healthcare domain was focused in the Bio-World Conference and Expos
    (2019). This rapid growth trend is expected to stabilize in 2021.


    Edge computing analyses data by harnessing the compute power of the resources
    outside of traditional data centers. These computational resources are located
    in proximity to the data sources. Data caching/storage, data processing, service
    delivery, IoT management, and privacy protection are some of the services offered
    by this layer. Edge computing environment up-streams data from devices to cloud
    servers and down-streams data from cloud servers to the devices.


    When cloud computing was introduced, all the computations were shifted to the
    cloud. Due to network latency and the transmission cost, it is more logical to
    perform related tasks at the network edge. With the improvement of the processing
    power and capability, the amount of tasks performed on the edge will continue
    to grow [[2](#ch02.xhtml#ref2_2)]. The major advantages of edge computing include:


    * Reduction in computation latency to meet the customer demands.

    * Reduction in network bandwidth.

    * Preservation of data security and privacy.

    * Good reliability even on network failures.

    * Reduction in operational costs due to communication, storage, and processing.

    * Better data governance due to improvement in quality and usability of data.

    * Improved scalability of cloud by computation offloading to the network edge.


    The major components of an edge computing system [[3](#ch02.xhtml#ref2_3)] ([Fig.
    2.1](#ch02.xhtml#fig2_1)) include:


