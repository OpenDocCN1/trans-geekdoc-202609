    * `Reduced cost`: Reuse and dynamic reconfiguration significant cost reductions
    can be achieved.


    Hence in a truly distributed system or a peer-to-peer (`P2P`) system, the control
    is decentralized. In client-server architecture, the role of the client is to
    submit the job and the server completes the job and returns it to the client.
    In a `P2P` system, there is no difference between a client and a server node.
    For some tasks, a client can perform a server functionality. The system is self-organizing
    with distributed control without the need for centralized coordination by central
    server. `P2P` systems initially came into existence because of the need for file
    sharing ([Fig. 1.6](#ch01.xhtml#fig1_6)). The major advantages of a `P2P` system
    include:


    * Work sharing

    * Scalability

    * Autonomy

    * No single point of failure

    * Reliability

    * Cost reduction

    * collaboration


    ![Figure 1.6 Client-server vs. P2P systems.](images/fig1_6.jpg)


    [Figure 1.6 Client-server vs. P2P systems.](#ch01.xhtml#fg1_6)


    Security and trust management are complicated in a `P2P` environment when compared
    to the centralized client-server system. The system should be able to manage and
    maintain heterogeneous peers.


    ## 1.5 Cluster Computing


    Parallel processing systems achieve high performance but they are tightly coupled
    and costly. Such parallelism can also be achieved using a cluster of commodity
    systems. Clusters usually comprise homogeneous commodity hardware that is centrally
    controlled by a master server. The cluster operating system handles task distribution,
    monitoring, and collection transparently without user involvement. The operating
    system software shared by all the nodes in the cluster takes care of distributing
    the tasks and gathering results transparently without much involvement of the
    user.


    Consider an orchestra that consists of a large group of musicians who play many
    different instruments together and are led by a conductor. An orchestra can be
    considered as an analogy for cluster computing ([Fig. 1.7b](#ch01.xhtml#fig1_8)).
    A cluster is a type of parallel or distributed processing system that consists
    of a collection of interconnected standalone computers that cooperatively work
    together as a single, integrated computing resource (analogous to various musical
    instruments). The major characteristic of a cluster is that nodes are homogenous
    and are centrally controlled by the master node (analogous to a conductor in an
    orchestra). The cluster operating system acts as a middleware to split the job
    into tasks and to communicate the tasks to the worker nodes. Once the worker nodes
    complete the tasks, the controller collects the results and informs the client.
    Hence the work is done transparently by the cluster. The cluster middleware offers
    a single system image (SSI) of the entire cluster to the user. Some of the components
    of a cluster include the following [4] ([Fig. 1.7a](#ch01.xhtml#fig1_7)):


    1. Coordinator node to control the cluster.

    2. Worker nodes that have their own resources such as processor, memory, and storage.

    3. Network to provide communications between worker nodes and the coordinator
    node.

    4. Gateway that acts as a firewall between the outside world and the cluster.


    ![Figure 1.7a Cluster architecture.](images/fig1_7a.jpg)


    [Figure 1.7a Cluster architecture.](#ch01.xhtml#fg1_7)


    When a cluster `[[7](#ch01.xhtml#ref1_7)]` is protected by a gateway, it is called
    as a closed cluster. When the cluster nodes can be freely accessed, it is called
    as an open gateway.


    ![Figure 1.7b Orchestra - An analogy to cluster.](images/fig1_7b.jpg)


    [Figure 1.7b Orchestra - An analogy to cluster.](#ch01.xhtml#fg1_8)


    The following are some of the benefits of cluster computing:


    1. Clusters are able to achieve a high performance-to-cost ratio when compared
    to mainframes. Cluster systems are made up of commodity hardware and are much
    cheaper than mainframes.

    2. As a cluster has multiple nodes, tasks can be done in parallel. A cluster’s
    performance is higher than an individual system and is comparable to that of a
    mainframe.

    3. When compared to a mainframe, clusters have good fault tolerance. When a node
    in a cluster fails, its functionality is taken over by another node. This is not
    possible in a mainframe.

    4. Cluster systems are scalable. It is easy to add a new node to the cluster without
    affecting the working of the other nodes.


    Clusters offer two parallel programming models:


    * Shared memory model, where all the processors share a common main memory and
    all communications can occur through the memory. This is a tightly coupled parallel
    processing system.

    * Distributed memory model, where each node is provided with its own resources,
    including processors and memory, and the communication is through networks. This
    forms a loosely coupled distributed system.


    The basic goal of a cluster is to offer high performance by aggregating the power
    of various nodes, optimize the cluster efficiency by balancing the workload among
    different cluster nodes, and maintain redundancy to tolerate faults. Thus based
    on their functionality, clusters are categorized as follows.


    ### 1.5.1 High-Performance Clusters


    When a job requires high computation, the job is split into smaller units called
    tasks and allocated to various nodes in the cluster. Resources like processors
    in the nodes will complete the tasks and return the results to the coordinator
    node. As the job is carried out in parallel by a number of nodes, it is completed
    quickly ([Fig. 1.8](#ch01.xhtml#fig1_9)).


    ![Figure 1.8 Parallel processing of tasks.](images/fig1_8.jpg)


    [Figure 1.8 Parallel processing of tasks.](#ch01.xhtml#fg1_9)


    ### 1.5.2 Load Balancing Clusters


    A load-balancing cluster assigns a task to the worker node that is least loaded.
    The load balancer has a monitor that continuously gets the resource utilization
    of the worker nodes. The coordinator node/controller receives the user’s job,
    identifies the least loaded node using the load balancer, and allocates it to
    the least loaded worker ([Fig. 1.9](#ch01.xhtml#fig1_10)).


    ![Figure 1.9 Load balancing.](images/fig1_9.jpg)


    [Figure 1.9 Load balancing.](#ch01.xhtml#fg1_10)


    ### 1.5.3 High-Availability Clusters


    When critical jobs are executed in the cluster, and the worker node executing
    the job fails, the job cannot be completed. To tolerate such faults, the middleware
    takes care of allocating another node in the cluster to complete the job with
    minimum interruption. Such a cluster that is fault-tolerant is said to be highly
    available. To achieve high availability, the middleware should continuously monitor
    the availability of nodes using heartbeat messages. This can be centrally monitored
    by the coordinator node ([Fig. 1.10](#ch01.xhtml#fig1_11)).


    ![Figure 1.10 Fault tolerance.](images/fig1_10.jpg)


    [Figure 1.10 Fault tolerance.](#ch01.xhtml#fg1_11)

