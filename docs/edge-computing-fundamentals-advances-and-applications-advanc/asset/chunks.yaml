    Hydra 是一种面向服务的中间件。它运行在应用程序层和操作系统层之间。该中间件提供了一个 Web 服务接口，用于与传感器、执行器和转换器等物理设备进行交互，且透明于底层的通信技术，如
    `Bluetooth`、`RF`、`ZigBee`、`RFID`、`WiFi` 等。这些设备的语义描述通过 `OWL`、`OWL–S` 提供。每个设备都被视为服务。服务通过接口暴露。用户可以通过这些接口与设备进行交互。因此，包括通信机制在内的设备细节通过这些接口从用户中抽象出来。因此，包含协议、设备、语法和语义互操作性的所有功能组件都由
    Hydra 提供。各个层包括：


    *   网络层：用于使用各种通信协议管理异构设备之间的通信。可以使用 `SOAP` 隧道。

    *   安全层：提供身份验证和授权等各种安全服务。

    *   语义服务层：提供上下文管理和策略管理服务。

    *   服务层：提供管理本体论、事件、设备、作业编排、存储和诊断的服务。


    ### 2.6.1.2 Aura


    Aura 旨在提供高级 API 以与各种异构设备交互。AURA 不提供接口协议层和设备抽象层。它提供应用抽象以及上下文管理层。因此，包含协议、设备、语法和语义互操作性的所有功能组件都由
    AURA 提供。它还提供了数据分析能力。AURA 的组件包括：


    *   任务管理器 (Task Manager)：为终端用户任务提供平台无关抽象服务。因此，终端用户可以在不同的环境中执行任务。例如，为了编辑文档，AURA
    可以使用操作系统环境中的可用编辑器——Windows 下可以使用 `Notepad`，Unix 下可以使用 `Emacs`。

    *   服务提供者 (Service Supplier)：组合任务形成终端用户的请求。它将抽象服务描述映射到特定应用的设置。如果使用 Windows 环境，则将抽象文本编辑器接口映射到
    `Notepad`；如果使用 Unix 环境，则映射到 `Emacs`。

    *   上下文观察者 (Context Observer)：收集物理上下文信息。不同设备具有不同的感知能力。基于此，上下文观察者为 `Task` 和 `Environment`
    管理器收集信息。

    *   环境管理器 (Environment Manager)：了解提供者提供的服务及其部署。基于这些知识，它将合适的服务映射到上下文观察者组件。


    ### 2.6.1.3 TinyDB


    TinyDB 中间件允许用户在不知道设备规格的情况下与设备进行交互。为了此目的，TinyDB 为终端用户提供了领域特定语言 (`DSL`) 以与设备进行交互。`DSL`
    是一种支持选择、连接、投影和聚合操作的查询语言。它允许终端用户获取嵌入式传感环境中有关时间、地点、类型和采样方法的信息。


    ### 2.6.1.4 FiWare


    FiWare 使用 `REST` API 从传感器收集上下文信息。上下文代理 (Context broker) 收集这些上下文信息，并提供存储和查询它们的设施。FiWare
    中间件基于发布-订阅架构工作。消费者可以订阅代理发布的信息。上下文适配器充订阅者的数据转换器。应用程序使用 API 查询、分析和挖掘由上下文代理收集的上下文信息。还提供了可视化设施。


    ### 2.6.2 Application Interfaces


    在之前的章节中，我们广泛考虑了 IoT 系统的三个主要功能组件：传感器、通信和数据处理。云端/边缘设备处理的信息必须传递给终端用户。这是通过 `cloud/edge`
    设备完成的。（注：原文此处存在大量重复句子，译文已根据逻辑进行了去冗余处理）。

