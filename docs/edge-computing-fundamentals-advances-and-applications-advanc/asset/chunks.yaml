    ### 5.8.5 Smart Contracts


    In blockchain, smart contracts have been introduced in Ethereum framework. Smart
    contract is business logic written as tiny computer program and stored in blockchain.
    Contract is a written agreement between two or more parties that is intended to
    be enforced by law. Once the contract is deployed to blockchain, it is immutable.
    It cannot be stopped or modified. It is a protocol that creates an automated trustworthy
    set of rules which is agreed upon. `Solidity` is a smart contract programming
    language, specifically created for Ethereum. This programming structure is similar
    to `JavaScript`. In decentralized systems, major issue is trust. Smart contracts
    help establish constraints to ensure trust between the parties of the network.
