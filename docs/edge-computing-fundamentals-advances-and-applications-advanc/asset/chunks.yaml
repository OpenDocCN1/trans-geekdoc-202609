    ## 1. Computing Paradigms

    The evolution of computing paradigms is elaborated in detail in this chapter.
    A detailed working nature is provided for parallel computing, distributed computing,
    grid computing, cloud computing, and mobile cloud computing by analyzing the pros
    and cons. The later part of the chapter covers the rise of fog computing/edge
    computing and osmotic computing. The chapter ends with current research issues.


    ## 2. Edge Computing and Its Essentials

    The necessity of edge computing for real-time applications and streaming of data
    across the devices is illustrated in this chapter. Edge computing architecture,
    network management, and middleware required are elaborated. Architecture of `IoTEdge-Sim`,
    `iFogSim`, and `EdgeSim` simulators is illustrated to evaluate the various strategies
    and algorithms in a repeatable, controlled, and cost-effective way.


    ## 3. Edge Analytics

    This chapter introduces the readers the fundamentals of data analytics and its
    approaches. Various phases and types of data analytics have been covered with
    examples and illustrations. The architecture of edge data analytics has been depicted
    and explained. Incorporation of general data analytics approaches to the edge
    devices are proposed. Included casestudies and various programming tools and techniques
    related to edge analytics.


    ## 4. Edge Data Storage Security

    Edge Data storage security schemes are discussed in detail with this chapter,
    namely data confidentiality schemes, authentication schemes, and privacy-preserving
    schemes. The chapter mainly focuses on advanced encryption schemes like homomorphic
    encryption, attribute-based encryption, proxy re-encryption, functional encryption,
    and honey encryption. At the end of this chapter, attack detection and prevention
    strategies and possible research directions are included.


    ## 5. Blockchain and Edge Computing Systems

    The security issues with edge computing systems are addressed by introducing blockchain
    technology. The concepts about blockchain and its components have been clearly
    explained from the beginning in such a way that the layman can understand the
    content. Characteristics, types, architecture, and essential blockchain fundamentals
    have been covered with neat illustrations. Various platforms and their working
    methodology have been covered with few practical demonstrations and code snippets.


    ## 6. Edge Computing Use Cases and Case Studies

    High potential use cases of edge computing are elaborated in this chapter for
    better understanding by the research community. Three case studies are discussed
    in this chapter based on healthcare edge computing storage security. Open research
    challenges are added at the end for future research directions. An expert view
    is also added at the end of this chapter with few use cases to know about end-to-end
    Industrial IOT Products & Solutions from sensors to analytics.


    # Acknowledgments

    We bow our head before “The God Almighty” who blessed us with health and confidence
    to undertake and complete the book successfully. We express our sincere thanks
    to the Principal and management of PSG College of Technology, for their constant
    encouragement and support. We thank our family who always stood beside us and
    encouraged us to complete the book by sharing our routine domestic chores. We
    are thankful to everybody who has motivated and guided us in preparing this book.
    A special thanks to the editorial team and the reviewers of CRC Press | Taylor
    & Francis Group for spending their valuable time and support in rapid publication
    of this book.


    We would like to extend our gratitude to the various industry experts for providing
    their valuable expert notes for corresponding chapters. We would like to thank
    Mr. T. Viswanathan, CTO, Maxbyte Technologies, India and Dr. C.S. Saravana Kumar,
    Software Architect, Robert Bosch, India for providing valuable inputs on edge
    computing use cases and edge data analytics based on industry requirements. Also,
    we would like to thank Dr. Bithin Alangot, Researcher at Singapore University
    of Technology and Design for providing inputs on blockchain.


    # Author Biographies


    ### Dr. Anitha Kumari

    `K. Anitha Kumari` is working as Associate Professor in the Department of IT for
    the past 11+ years. She is highly passionate and curious about learning new stuff.
    To her credit, she has published a Patent and 75 Technical Papers in refereed
    journals by IEEE, Springer, etc. Out of research interest, she has contributed
    book chapters published by CRC Press, Springer, IGI Global. Currently, she’s being
    the Program Coordinator of ME (Biometrics and Cyber Security).


    ### Dr. Sudha Sadasivam

    `G. Sudha Sadasivam` is working as a Professor and Heading the Department of CSE
    at PSG College of Technology. She has 24 years of teaching experience. She has
    published 5 books and around 100 papers in indexed journals. She has coordinated
    two AICTE-RPS projects and a UGC-sponsored project in the areas of distributed
    computing. Her team has set up PSG-Yahoo/Nokia lab on Big Data Analytics at PSG
    College of Technology.


    She is also the SPOC of One-Year Certification Course on Cyber Security (January–December
    2020). She is also serving as Editorial Member for Scopus-indexed journals like
    `International Journal of Education, Science, Technology, and Engineering`, `International
    Journal of Artificial Intelligence`, `Decision Making: Applications in Management`,
    etc., and acting as SPOC for the MoU signed between PSG and SETS Laboratory.


    She is also an Active Reviewer for prestigious journals published by `IEEE Communications
    Surveys and Tutorials` (IF: 20.23), `IEEE Transactions on Industrial Informatics`
    (IF: 5.43), IEEE Access, Springer, etc., and Technical Program Committee (TPC)
    for many international/national conferences. Her areas of interest include Cloud
    & IoT Security, Design and Analysis of Security Protocols, Attacks & Defense,
    Security in Computing, Bioinformatics, Quantum Cryptography, Web Service Security,
    Network Security, Cognitive Security, and Analysis of Algorithms. She delivered
    ample Guest Lectures in her area of interest. Her security project is sanctioned
    and granted by AICTE for a sum of Rs.1,80,000. She’s been the mentor for Technovator
    Projects (2019, 2018, and 2014) and `MEDROIDZ`, an ICICI – Trinity 2014 funded
    project that was selected as one among the six projects in India. Academically,
    she has secured RANK-I and was awarded Gold Medal in ME (SE) and in BE (CSE) from
    Anna University and from Avinashilingam University. As a Supervisor, she is currently
    guiding Ph.D. scholars in her research area.


    ### Dr. Niranjthy

    `M. Niranjthy` (Note: The text for this author was incomplete in the source, but
