    **Application or processing layer:** This layer is responsible to carry out complex
    data-intensive tasks and to store voluminous data. Private or public cloud servers
    in this layer act as repositories for sharing data among the nodes. Cloud servers
    perform complex data-intensive/compute-intensive applications that cannot be hosted
    in edge servers. Cloud servers can also be used for resource allocation and job
    management at the edge nodes.


    Apart from the above-mentioned components, a suitable interface is to be provided
    for the users to monitor, manage, and interact with the system. The next section
    will provide a detailed architecture of the edge computing system.


    ## 2.2 Edge Computing Architecture


    By considering edge and cloud computing paradigms as complementary, a synergy
    can be reached between them. Edge servers can handle latency-aware computing in
    close proximity to data sources. Shared global computation/storage, management,
    and data privacy can be handled effectively in the cloud server. Fig. 2.1 discussed
    the various layers of a generic edge computing model. [Fig. 2.2](#ch02.xhtml#fig2_2)
    provides a more detailed view \[[5](#ch02.xhtml#ref2_5)\] considering a network
    of edge servers.


    ![Figure 2.2 Edge computing – a detailed architecture.](images/fig2_2.jpg)


    [Figure 2.2 Edge computing – a detailed architecture.](#ch02.xhtml#fg2_2)


    ### 2.2.1 Edge Devices


    Devices that collect data in the site including sensors, cameras, microphones,
    recorders, web monitors, data loggers can function as edge devices. Edge devices
    can also be actuators and visualization tools. Objective of the edge device is
    to collect information and send upstream or transfer information downstream for
    actuation. Edge devices have usually limited compute and storage capacity. Sometimes
    they can have higher capacity to do additional functionalities. Edge devices contain
    transducers that convert physical signals to electrical and vice-versa.


    ### 2.2.2 Edge Server Cluster


    When a distributed peer-to-peer connection of edge servers is considered, some
    edge servers may be close to a particular edge device while others may be far
    away. Computation and storage are replicated in multiple edge server nodes. The
    edge servers can be present at the device edge or at the network edge. Some workloads
    can be processed at the device edge maintained close to the sensor/actuator. Other
    workloads have to be migrated across to other edge servers called as local edge
    servers, where they can be processed. These servers may be farther away from the
    device but within the network edge. Workloads include both application workload
    (that includes compute and storage) and network tasks. As the local edge contains
    more resources they can perform complex computing and networking functionalities.


    Device edge nodes only perform simple functionalities. The compute nodes perform
    less compute-intensive operations. The gateway nodes additionally perform simple
    networking functions from the device to the local edge. Network latency involved
    may be in microseconds. Communication protocols between the devices and between
    the device and the local edge work over shorter distances and consume low power.
    Edge devices with additional functionalities act as device edge nodes.


    Local edge nodes have additional compute, storage, and network capability. Such
    edge nodes can be used for computation. A small-scale data center (cluster of
    nodes) at the network edge called the cloudlet can be used. Such a cloudlet can
    store data at the network edge, host intelligent applications (like video/text
    analytics) to process data, and filter data to be transferred upstream to the
    cloud. Network latency may be in tens to hundreds of milliseconds.


    Network function virtualization handles networking functions (like load balancing,
    security) with software-based technologies (called virtual network functions (VNFs))
    rather than hardware. VNFs decouple software from the underlying hardware. This
    offers flexibility to vendors to create a more scalable and agile network using
    software functions. Some of the networking functionalities provided by VNF at
    the local edge include routing, firewall, Radio Access Network (RAN), Evolved
    Packet Core (EPC) framework for a 4G Long-Term Evolution (LTE) network. Protocols
    used between the edge server and the cloud have large throughput and high speed.
    Data caching and filtering, visualization, real-time computation, and control
    are common tasks done at the edge level. Resource allocation and management is
    a major issue. Usually, cloud servers handle it.


    ### 2.2.3 Cloud Server


    The server is used to perform complex computation, resource allocation and management,
    data summarization, and secure data storage. Resource management defined by software
    framework in the cloud offers middleware services to manage the resources of the
    entire system and maintains quality of service for the applications. These services
    aim to balance application latency and cost by choosing a suitable resource for
    a task either in the device, edge server, or cloud server layer. Some of the services
    offered in this layer include:


    *   Data management service is used to access information stored in various SQL
    and NoSQL data stores.


    *   Monitoring service keeps track of the current status of applications and resources
    in the entire system (edge and cloud).


    *   Knowledge base maintains past information on resource/application demands.


    *   Profiler creates resource/application profiles based on historical information
    in the knowledge base and as well as current information obtained from the monitoring
    services.


    *   Performance prediction service forecasts the resource utilization and performance
    based on the historical information on resource demands. This in turn affects
    the application performance.


    *   Resource provisioning service allocates both cloud and edge resources dynamically
    for various tasks based on the information provided by the monitoring, profiling,
    prediction services, and user requirements.


    *   Task placement service aims at identifying a suitable resource at the device,
    edge, or cloud layer to execute the task effectively. It uses the information
    from the resource provisioning service.


    *   Security service provides the required authentication, authorization, and
    confidentiality for various applications.


    Consider a use case of a fire detection system using drones. Activities done in
    different layers of the system include:


    *   Video analytics software to detect fire and network functionality for the
    application is deployed in the device edge and local edge.'
