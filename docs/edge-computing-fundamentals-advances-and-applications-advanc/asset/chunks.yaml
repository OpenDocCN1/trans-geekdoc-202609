    Northbound interface pass information (rules/services) required from the services
    layer for controllers to direct gateways/routers. Southbound interface is used
    to configure routers/gateways and pass the dynamic requests from the controller
    to communication layer containing routers/gateways.


    The edge computing system has heterogeneous pieces of disparate components (hardware
    and software) that have to be coordinated and managed to complete the task in
    a unified manner. Section 6 discusses the need for orchestration.


    ### 2.5.1 Orchestration


    An Orchestration platform provides a single holistic view of the system by integrating
    heterogeneous silos of already existing and new IoT systems, software, and devices.
    It thus enables viewing, monitoring, and automating data management for disparate
    applications. For example, a logistics company can track a complex, multi-party
    supply chain, end-to-end. Information stored can be used to analyze shipping conditions
    and preemptively adjust delivery in case of failure. Some of the advantages of
    orchestration include:


    * Integration of IoT with existing enterprise systems and business logic. In short
    the platform should have capability to connect heterogeneous sensors, protocols,
    and software to ensure “connect the unconnected” philosophy of IoT.

    * Data unification from existing and new devices and systems.

    * Analysis of data from disparate applications. Based on the analysis of historical
    heterogeneous cross-entity data, suitable actions should be initiated with ease.

    * Establishment of connection with various systems in a simple, efficient, and
    fast manner.

    * Configuration of rules with ease.

    * Establishment of suitable access control policies among different user groups.


    The main objective of this layer is to align the business needs to the disparate
    applications and data. This layer defines the rules, policies, business logic
    and automates workflows, resource provisioning, and change management. This layer
    should be highly scalable to handle the integration. `NiFi`, `Oozie`, and `Apache
    Spark` are commonly used to ingest, schedule, and process the IoT data in Big
    Data frameworks like `Hadoop`.


    ## 2.6 Edge Computing State-of-the-Art Interfaces and Devices


    ### 2.6.1 Middleware


    IoT devices are heterogeneous and present in many locations. This necessitates
    the usage of middleware that can provide services in a transparent manner for
    the user and enables him to interact with the devices. The middleware abstracts
    the hardware and provides an application programming interface (`API`) for communication,
    data management, computation, security, and privacy. Some of the challenges to
    be addressed by the middleware include:


    * `Interoperability`: Middleware should facilitate collaboration between heterogeneous
    devices. This includes network, syntactic and semantic interoperability. Network
    interoperability abstracts the application from various communication protocols.
    Syntactic interoperability hides various data encoding formats and provides services
    in a transparent manner to the user. Semantic interoperability ensures transparent
    interoperability with the domain data.

    * `Device discovery and management`: The middleware provides naming service interfaces
    to list the IoT devices, their services, and capabilities. Based on their capabilities,
    devices can be discovered. The middle also needs to perform load balancing, power
    management and error reporting about the devices to the users.

    * `Scalability`: Middleware should accommodate changes when device infrastructure
    scales up or down. Middleware should be able to manage communication between the
    devices.

    * `Security and privacy`: Middleware should be able to manage the privacy and
    security issues in IoT environment including authentication, user privacy, and
    access control.

    * `Seamless cloud integration`: IoT middleware should be able to seamlessly integrate
    with different types of clouds. This will help the users to analyze data collected
    from various sensors.

    * `Context detection`: Context of the data from various sensors can be used to
    provide specialized services to users. Context detection aims at collecting data
    from resources, and selecting the information that can have an impact on the computation.
    Context based processing uses the gathered information to perform a task or make
    a decision.


    Middleware can be categorized as:


    * `Event based`: This type of middleware is based on publish-subscribe architecture.
    In this model, all the entities interact through events. Each event belongs to
    a type and is specified with some parameters. Events are generated by producers
    and received by consumers. Consumer entities can subscribe for events. When such
    events occur, they get notified by the producers.

    * `Service oriented`: This type of middleware abstracts the resources as services
    provided through a set of interfaces. Service providers publish/advertise their
    services to repositories. Service consumers then discover the required services
    from the repository and bind them to access the service. `Hydra` is a service-oriented
    middleware with semantic interoperability between services.

    * `Database oriented`: This type of middleware abstracts the IoT devices as a
    virtual centralized relational database system. This system has the advantage
    of querying the database to extract information. The major issue is scalability
    due to centralization.

    * `Semantic`: This type of middleware enables data exchange between heterogeneous
    devices. Ontology is used to map different device formats to a common one. A semantic
    layer maps each resource to a software layer. The software layers of different
    resources can now communicate with one another using a common format.

    * `Application specific`: The middleware is architected for a specific application.
    The middleware and application are tightly coupled.


    Middleware consists of four functional components to enable abstraction and interoperability
    among the heterogeneous IoT devices [10] (Fig. 2.5).


    * `Interface protocol layer`: This layer enables interoperability between a variety
    of protocols used in the physical, data link, network, transport, and application
    layers of the communication stack of an IoT system. For this purpose, a wrapper
    is placed either in the device side or in the middleware to convert the protocol
    supported by the device to a common protocol.

    * `Device abstraction layer`: This layer enables syntactic and semantic interoperability
    based on data formats between devices. This layer configures the device profiles
    and communicates the functionality to them.

    * `Context management layer`: IoT devices and middleware should be context aware.
    Context-awareness includes context detection and context processing. Context detection
    involves selecting data collected from the resources based on the computational
    requirements. Context processing uses this information to make decisions or perform
    a task.

    * `Application abstraction layer`: provides an interface for the applications
    and end-users to interact with devices. `RESTful` or query based interfaces can
    be used.


    ![Figure 2.5 Middleware functional components.](images/fig2_5.jpg)


    [Figure 2.5 Middleware functional components.](#ch02.xhtml#fg2_5)


    Middleware solutions address the abstraction and interoperability challenges in
    IoT environment. `Hydra`, `Aura`, `TinyDB` are some commonly used middleware.


    #### 2.6.1.1 Hydra

