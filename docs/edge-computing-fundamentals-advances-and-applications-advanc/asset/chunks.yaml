    # 1 Computing Paradigms


    DOI: [10.1201/9781003230946-1](https://doi.org/10.1201/9781003230946-1)


    ## 1.1 Introduction to Computing


    One of the astounding scientific developments of humanity is the Computer. The
    word comes from the Latin word “Computare” that consists of two parts – “Com”
    meaning “together” and “putare” meaning “To settle (an account)”. Computers are
    the devices used for computing. “Computing” is drawn from the Latin word “Computatio”
    that means reckoning or calculation. The process of computing uses computer technologies
    to complete a task. The process of *Computing* includes activities performed using
    computational devices to manage, process, and communicate information.


    We have moved from the era where computers were considered as a luxury to an era
    where it is considered as necessity. We use some form of computing in our daily
    life without much ado. Using a cell phone, washing machine, communicating using
    email, financial transactions all include some form of computing. Task automation
    triggered using computers increases accuracy while reducing manual work, power,
    cost, and time. As quoted by the Association of Computing Machinery (ACM) \[[1](#ch01.xhtml#ref1_1)\],
    “Computing and computer technology are part of just about everything that touches
    our lives from the cars we drive, to the movies we watch, to the ways businesses
    and governments deal with us”. Computing drives the innovations behind various
    fields like sciences, engineering, business, entertainment, and education.


    The urge of humanity to make a device capable of solving complex problems between
    1600 AD and 1800 AD leads to the invention of mechanical calculators. Blaise Pascal
    invented the first mechanical calculator in 1942. In 1671, Gottfried Wilhelm von
    Leibniz, the German mathematician designed the mechanical calculating machine
    called the Step Reckoner based on Pascal’s invention. World War II saw the rise
    of electro-mechanical hybrid calculators. The first calculating computer Electronic
    Numerical Integrator and Computer (ENIAC) was completed after the war in 1946.
    It was basically designed during the war to handle complex calculations connected
    with the movement and strategies for the military during the war. Many scientists,
    mathematicians, and computer technicians worked hard to make the modern computer
    a reality. The computational capacity represented by the speed of the computers
    doubled every 1.5 years between 1975 and 2009. Beyond this sequential computing
    gave way to parallelism. Details are given in Section 3.


    The growth of Internet, digital devices, and computer technology is the backbone
    behind a number of disruptive revolutionary business innovations like video streaming,
    mobile applications, retail medical clinics, Uber, Swiggy, digital cameras, and
    online education. In this digital age, computing has infiltrated into a number
    of domains as given in the following section.


    ## 1.2 The Major Impacts of Computing


    Technologies that trigger innovations ensure the liveliness of a society. Bright
    and ethical technologists are the driving force behind the usage of computing
    for the benefit of the society. Today computing is an essential tool for every
    business, banking, government, entertainment, industry, education, and administration.
    It can be said of all large organizations, whether the department government or
    private, use a computer for a variety of their daily business and it is the fastest-growing
    industry in the world today \[[2](#ch01.xhtml#ref1_2)\].


    *   **Business**: Businesses use computers for a variety of purposes. Computing
    can be used to analyze current business trends, predict sales of a product, identify
    inventory, predict target customers, calculate salary, issue/receive orders, communicate
    business letters, create invoices, and more. They are also an essential tool for
    office automation that includes create/edit reports/documents, visualize sales,
    create presentations, manage business data, and more. Internet has fostered the
    growth of E-commerce industry.


    *   **Finance and banks**: Computing has fostered the growth of cashless society.
    The use of computers provides effective, fair, and personalized banking solutions.
    It can be used for maintaining accounts, managing investments, analyze profitability,
    and hence aid in reducing the operational budget of banks.


    *   **Industries**: Computers are used extensively to control and monitor the
    production process in various industries. This includes management of employee/customer
    information, maintaining and analyzing production and sales information, scheduling
    production, and so on.


    *   **Healthcare**: In the field of medical science, computers are used extensively
    to manage patient details, schedule appointments, administer purchase and inventory
    of medicines/equipment, aid in disease diagnosis, and for medical research. Advancements
    in the computing field have enabled the blind to see, the deaf to hear, the dumb
    to communicate, improvise learning, administer medicines among a few.


    *   **Home**: Smart home systems using microcomputers enhance home security and
    enable users to control various devices like air-conditioners, lights, televisions
    remotely. Online shopping and bill payment systems simplify various tasks. Spare
    time can be used for other purposes. Computers also help in budget planning and
    maintaining inventory. Children can use online learning resources to their benefit.
    Thus computers have turned into machines to maintain, manage, and communicate
    information in this modern world.'
