    # Preface


    The most significant aspect of any product or application is its response time.
    Smart products and applications always come along with connected devices as the
    Internet of Things. The immense usage of IoT generates vast data which the cloud
    platform is the broadly accepted medium for processing it. But the major unexpected
    inconvenience while using cloud platform is the downtime. As the cloud platform
    and its functionalities depends on Internet, the services may get interrupted
    any time which leads to delayed response. Hence, the time-sensitive applications
    which require on-time decision-making might suffer. Edge computing comes up with
    a solution where the processing is done either on premises or near the source.
    The edge devices placed on the source would process the data as and when it is
    generated so as to provide better services. This process minimizes the data pushed
    on the cloud for processing. The real-time data analytics can also be applied
    on voluminous data directly on the edge devices. In order to preserve the confidentiality
    and integrity of the data, several security mechanisms can also be applied on
    the edge devices.


    # About the Book


    The book *Edge Computing: Fundamentals, Advances and Applications* disseminates
    knowledge on edge computing gathered from industrial and academic experts for
    undergraduate and postgraduate students of Computer Science and Engineering, Information
    Technology and related disciplines as well as to related research scholars. The
    contents of the book have been delivered in a simple language and in a straightforward
    manner with suitable use cases. This book aims to balance between theory and practice
    of edge computing and its related concepts. The reader need not have prior knowledge
    of any specific concepts to understand the topics covered in this book. The explanations
    for the topics had been given with illustrations, examples, architectures, and
    code implementations wherever required. The book is organized into six chapters.
    They are Computing Paradigms, Edge Computing and Its Essentials, Edge Analytics,
    Edge Data Storage Security, Blockchain and Edge Computing Systems, and Edge Computing
    Use Cases and Case Studies.


    ## Features of the Book


    The following are the salient features of the book:


    *   Easy to understand


    *   Chapter outlines are listed at the start of each chapter


    *   Gathered the knowledge of Industry and Academic experts


    *   Results of demonstration for various topics are included


    *   Research challenges and future research directions are listed at the end of
    each chapter


    *   Imperative aspects are summarized at the end of each chapter


    *   References are listed at the end of each chapter


