    at any point with low latency and hard-to-reach places realizes the highest usage
    of edge computing in real time. Generally, in healthcare records, patients often
    deal with missing or incorrect medical information when they happen to visit a
    new provider or facility. There are chances that the patient’s data can be misused
    if hackers get access to it. Each and every information has to be monitored to
    avoid the occurrence of undesired events and also to prevent it from attacks.
    To store and protect the security and privacy of healthcare digital data, between
    the layers, several methods exist, such as attribute-based encryption, proxy re-encryption,
    functional encryption, honey encryption, and homomorphic encryption. Homomorphic
    encryption is the cutting edge cryptographic technique that allows computations
    to be carried out on an encrypted data than in plain text to provide privacy and
    data storage security similar to conventional cryptography, but with added capabilities
    like searching on encrypted data. Among many types, Fully Homomorphic Encryption
    (FHE) is widely used that allows full computation over encrypted data. FHE is
    an emerging cryptographic technique to permit computation on encrypted data without
    the need to bring the data back to the computational node \[[4](#ch06.xhtml#ref6_4),[5](#ch06.xhtml#ref6_5)\].


    Typically a transition requires personal health information is protected in three
    different phases of manipulation of digital patient data: (1) acquisition, (2)
    storage, and (3) computation. In these Case studies, data is gathered from Internet
    of Medical Things (IoMT) devices and transmits to edge gateway/server. Edge device
    stores the data homomorphically for further processing/analyzing upon encrypted
    data. Finally, the required portion of data is sent to the cloud server.


    Three case studies have been discussed in this chapter for edge computing-based
    healthcare applications, which are as follows:


    Case Study I Pulse Oximeter to Detect Acute Respiratory Distress Syndrome (ARDS)
    in Edge Server


    Oxygen is the most important essential thing in human’s life. Oxygen delivery
    and oxygen consumption are the two important parameters in everyone’s life and
    that can be calculated using pulse oximeter. Lack of oxygen delivery, hemoglobin
    and oxygen consumption leads to Acute Respiratory Distress Syndrome (ARDS), commonly
    known as respiratory failure. By collecting these values via pulse oximeter, analysis
    is carried out in edge server to identify whether a person has ARDS or not.


    Case Study II Blood Pressure to Determine Hypotension in Edge Server


    Mean Arterial Pressure (MAP) is the average blood pressure in a person’s blood
    vessels during a single cardiac cycle. Based on the systolic and diastolic value
    acquired via blood pressure monitor, MAP is computed and is analyzed in edge server
    to determine whether a person has hypotension or not.


    Case Study III Body Composition Scale to Detect Heat Index in Edge Server'
