    > 验证：训练集可以被划分为训练集和验证集。验证是一个阶段，通过根据验证测试结果更改超参数，帮助提供最优化模型。


    > 测试：对机器学习模型进行建模，以预测测试数据集的结果。


    机器学习算法根据其处理有标签/无标签数据的能力分为以下几类。


    ## 监督学习


    监督学习是一种机器学习技术，它能够很好地处理已标记/已标签的数据以训练机器，如图图 3.4 所示。在这里，系统需要一个监督者，即训练数据集，机器从从中学习。随后，监督学习算法被划分为以下几个子类。


    ![图 3.4 监督学习机制。](img/fig3_4.jpg)


    图 3.4 监督学习机制。


    1. **回归**：回归技术有助于根据单个独立变量 `X` 或多个独立变量 `X1, X2 …. Xn` 预测因变量 `Y` 的值。

    2. **分类**：通过使用分类技术，训练机器将值划分到特定的类别中。


    ### 一些常用的监督学习算法


    * 用于回归问题的线性回归

    * 用于分类问题的逻辑回归

    * 用于分类问题的 K-近邻算法

    * 用于分类问题的支持向量机

    * 用于分类和回归问题的随机森林


    **应用：**考虑一个由狮子、老虎和狗等对象组成的数据集，每个对象都有类别标签，并被用于训练模型来识别新的输入对象。


    ## 无监督学习


    无监督学习是一种从数据集中获取推理的机器学习技术，其中值未标记/未标记[8]。系统学习不需要任何监督者。机器通过观察获取知识并接受训练，如图图 3.5 所示。


    ![图 3.5 无监督学习机制。](img/fig3_5.jpg)


    图 3.5 无监督学习机制。


    无监督学习算法随后划分为以下子类。


    1. **聚类**：这是一种无监督机器学习技术，通过发现个体之间的相似性将样本空间划分为不同的簇组。该技术仅使用输入值来预测关于相似性的模式和异常。各种距离计算技术（如欧几里得距离、曼顿距离）被用于寻找对象之间的相似性/异性。

    2. **关联**：这是一种无监督机器学习技术，有助于识别值之间关系的概率。这些技术广泛用于寻找交易数据中的销售相关性。


    ### 一些常用的无监督学习算法


    * 层次聚类

    * K-Means 聚类

    * K-近邻聚类

    * 主成分分析

    * 奇异值分解

    * 独立成分分析

    * Apriori 算法


    ### 应用


    在零售市场中，零售商通过分析之前的交易来发现物品之间的关系，以揭示它们之间的关联。通过分析购买历史，识别并保持更频繁出现的物品组合，以提高产品销量。


    ## 半监督学习


    这个问题依赖于监督和无监督技术。在这种情况下，某些数据有标记，而某些数据没有。该过程如图图 3.6 所示。


    ![图 3.6 无监督学习机制。](img/fig3_6.jpg)


    图 3.6 无监督学习机制。


    ### 应用


    在医学影像中，某些图像由专家标记，而另一些则没有。半监督学习用于使用有限的标记数据提高模型的准确性。


    ## 强化学习


    强化学习是一种机器学习方法，代理通过在环境中执行动作来学习决策，以实现奖励最大化。代理通过试错来学习，基于从环境中接收的正或负反馈。该系统的目标是最大化累积奖励。该过程如图图
    3.7 所示。


    ![图 3.7 强化学习机制。](img/fig3_7.jpg)


    图 3.7 强化学习机制。


    ### 一些常用的强化学习算法


    * 马尔可夫决策过程 (MDP)

    * Q Learning

    * 状态动作奖励状态状态 (SARSA)

    * 深度 Q 网络 (DQN)

    * 深度确定性策略梯度 (DDPG)


    ### 应用


    在机器人领域、游戏和工程自动化中，强化学习用于复杂系统的控制。


    ### 3.6.3 性能评估


    当使用上述算法构建模型时，将对其性能进行评估以测试其有效性。通用的机器学习性能评估技术包括


    * 混淆矩阵

    * 准确率

    * 正性预测值 (PPV)

    * 回回率

    * F1 分

    * 特异性

    * 负性预测值 (NPV)

    * PR 曲线

    * 接收者工作特征曲线 (ROC)


    为了理解评估技术，让我们考虑一个场景，任务是识别患者是否感染新冠（报告阳性）或健康（报告阴性）。通常情况下，该分类问题的结果属于真阳性、真阴性、假阳性和假阴性等类别，如表
    3.1 所示。


    > 真阳性 (TP)：患者为阳性且预测为阳性

    > 真阴性 (TN)：患者为阴性且预测为阴性

    > 假阳性 (FP)：患者为阴性但预测为阳性

    > 假阴性 (FN)：患者为阳性但预测为阴性


    表 3.1 混淆矩阵——实际值与预测值的对比


    |  ||  || 预测 |

    | --- | --- | --- |

    | **实际** || 阴性 || 假阴性 |

    | 阳性 || 假阳性 || 真阴性 |


    #### 混淆矩阵


    混淆矩阵根据参数 `TP`、`TN`、`FP` 和 `FN` 对分类结果进行矩阵可视化。


    #### 准确率


    准确率是一种根据准确预测评估模型性能的指标。计算准确率的公式是正确预测除以总预测数。


    ${Accuracy} = \\frac{{TP} + {TN}}{{TP} + {TN} + {FP} + {FN}}$(3.1)


    #### 精确


