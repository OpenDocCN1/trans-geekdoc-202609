    ### 5.8.4 Consensus Mechanisms


    Consensus is an agreement among full node on further block of transactions to
    be included in the blockchain. Extensive verification and validation process along
    with complex computation takes place to satisfy the agreement by the network entity.
    It ensures integrity of the network. The famous consensus algorithms are PoW,
    Proof of Stake (PoS), and Practical Byzantine Fault Tolerance (PBFT). In addition,
    there are several other consensus mechanisms such as Proof of Authority (PoA),
    Proof of Elapsed Time (PoET), Proof of Capacity (PoC), and so on. Different consensus
    protocols are chosen for various blockchain applications depending on the network
    needs and constraints.


    PoW is a common consensus mechanism used in many popular blockchain-based applications
    like Bitcoin. PoW is famous because of the Bitcoin network. But it is not specific
    to cryptocurrency. Ethereum network followed Bitcoin to use PoW with slight modification.
    Ethereum metropolis protocol uses memory-based PoW which is not energy intensive.
    Every node that is trying to add block to blockchain has to crack some computational
    problems when PoW is the consensus involved in blockchain. Whoever solves the
    cryptographic puzzle first wins the consensus and will add the block to blockchain
    and also they get rewards in terms of cryptocurrencies. The complexity of the
    puzzle depends on the factors such as network size, number of active users, blockchain
    size, and so on. As PoW fully depends on calculating the hash of block header
    elements by modifying nonce repeatedly, guessing and manipulating the hash of
    all nodes in a very short time span to hack the chain is impractical. PoW is computationally
    intensive to solve the puzzle. It results in enormous power consumption and requires
    longer processing time. But huge energy spent from non-winning node gets wasted.
    In PoW, the process of solving the cryptographic puzzle is called mining. When
    there are “n” nodes present in the blockchain and more than n/2 nodes are malicious
    nodes, blockchain hacking becomes possible. This attack is called 51% attack.
    Irrespective of the minor boundaries, PoW works well in many successful blockchain
    applications.


    PoS is an alternative to PoW since its mining process uses enormous amount of
    electricity and computations to secure the network. The basic idea of PoW is to
    compete with each other nodes through mining process. Instead, PoS uses election
    process in which one particular node is randomly chosen to validate the next block.
    PoS has no miners and has validators. A node to become validators, the user must
    store some cryptocurrency as stake. The size of the stake determines the likelihood
    of the validators to be elected to add the next block. This process is called
    minting or forging. PoS don’t need expensive mining equipment to add the block.
    Though 51% attack is less likely to happen in PoS, the algorithm also has to be
    cautious when choosing validators to choose the next block. It cannot be completely
    random and also stake alone is not sufficient to choose next validators as it
    might favor rich nodes frequently.


    In distributed application, Byzantine Generals Problem states that group of generals
    may have communication problems when trying to agree a consensus due to system
    failures. In blockchain, each general represents a network node and they need
    to meet consensus on the current state of the system. This means that the majority
    of the system participants have to agree and execute the same action in order
    to achieve consensus. Byzantine Fault Tolerance (BFT) system is derived from Byzantine
    Generals Problem and BFT is able to keep on functioning, although some of the
    nodes fail to communicate or act maliciously. The aim of the BFT is to defend
    against the system failures by reducing the power of fake nodes. Practical Byzantine
    Fault Tolerance (pBFT) is an optimized BFT algorithm and it is used in many blockchain
    applications along with other consensus methods \[[9](#ch05.xhtml#ref5_9)\].


    ### 5.8.5 Smart Contracts


    In blockchain, smart contracts have been introduced in Ethereum framework. Smart
    contract is a business logic written as tiny computer program and stored in blockchain
    network. Contract is a written agreement between two or more parties that is intended
    to be enforced by law. Once the contract is deployed to blockchain, it is immutable.
    It cannot be stopped or modified. It is a protocol that creates an automated trustworthy
    set of rules mutually which is agreed upon between the parties. Solidity is a
    smart contract programming language, specifically created for Ethereum blockchain.
    This programming structure is similar to JavaScript. In decentralized systems,
    major issue is trust. Smart contracts help establish constraints to ensure trust
    between the parties of the network. It is similar to that of the “if-then” rules
    that are there in typical programming languages.


    ## 5.9 Blockchain Platforms


    Blockchain concepts are implemented and tested in different platforms such as
    Ethereum, Hyperledger, Ripple, and so on. Each of them is created for executing
    specific types of blockchain categories.


    ### 5.9.1 Ethereum


    Vitalik Buterin designed the Ethereum framework in order to apply decentralization
    to other fields other than money transferring purposes. The main aim of the framework
    is to run and build applications that could run globally without any central controlling
    authority. Ethereum is a public blockchain platform that enables developers to
    build and deploy decentralized applications.


    Application that is executed on P2P network is called distributed application
    (DApp). Ethereum focuses on producing DApp with its features. DApps are decentralized
    applications that are not controlled by any authorities, rather it is controlled
    by the contracts written and deployed over the blockchain network. Every client
    in DApp interacts directly with its own instances of the DApp.


    Developers program smart contracts using Ethereum languages. It is compiled, deployed,
    and run on Ethereum Virtual Machine (EVM). The smart contract code is verified
    by the nodes and all full nodes have a copy of the smart contract with them. If
    person A wants to transact money to person B, person A initiates and submits the
    work on blockchain for evaluation. Each node evaluates the work of person A. Upon
    successful verification, the transaction will be made and it is transparent to
    all the nodes. The smart contract code cannot be tampered once it is deployed
    on blockchain.'
