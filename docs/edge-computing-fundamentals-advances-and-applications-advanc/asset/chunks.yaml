    P2P and cluster architectures are technical models. They do not portray the service
    aspects of the computing industry. In a cluster model, the computing services
    are not utilized most of the time. Hence the system utilization is low. Further,
    the operating costs involved in purchase and maintenance of a cluster are high.
    To reduce costs and to increase system utilization, the computing resources can
    be shared among a number of users. Utility computing focuses on a business model,
    by which customers receive computing resources from paid service providers ([Fig.
    1.11](#ch01.xhtml#fig1_12)). This offers flexibility for customers to request
    service providers for the resources when needed. The customers then pay the providers
    for the resources that they have utilized. Such a service provisioning business
    model is called as utility computing. Grid/cloud computing models fall under the
    umbrella of utility computing. This model maximizes the resource utilization and
    thereby reduces the operational costs. Just like water, electricity are offered
    as utility to individuals and businesses, computing is also offered as a utility.


    ![Figure 1.11 Computing as a utility.](images/fig1_11.jpg)


    [Figure 1.11 Computing as a utility.](#ch01.xhtml#fg1_12)


    A service-level agreement (SLA) is required between the service consumer and the
    provider. An SLA is a formal contract used to guarantee that the service provider
    will be able to meet the quality of service requirements of the consumer. This
    ensures customer satisfaction. A good SLA ensures the following:


    * Customer satisfaction

    * Quality of service

    * Strengthen customer-service provider relationship


    The architecture of the utility computing systems consists of the following layers
    ([Fig. 1.12](#ch01.xhtml#fig1_13)):


    * **User**: is the entity that requests services of the provider through suitable
    applications.

    * **Service request examiner**: interprets the `QoS` requirements from the service
    request of the customer and uses an admission control mechanism to decide whether
    to accept the request or not. It thus eliminates the requests from which resources
    are not available. It then triggers the `SLA manager`

    * **SLA manager**: examines the `SLA` and discovers suitable service providers
    to satisfy `QoS` specified in the `SLA`. This entity is responsible for discovery,
    negotiation/renegotiation, pricing, scheduling, monitoring, SLA enforcement, dispatching,
    and accounting. The discovery component identifies the service provider who will
    be able to meet the `QoS` requirement of the requester. The pricing mechanism
    decides how service requests are to be charged. The `SLA manager` also schedules
    the requests to suitable providers from a list of providers who satisfy the agreement.
    The dispatching mechanism starts the execution of accepted service requests on
    allocated resources. The monitoring component periodically verifies whether `QoS`
    of requester is satisfied. If not, renegotiation is done. If `SLA` is violated
    it may result in termination of the contract or payment of penalties.

    * **Resource provider**: is an entity which provides services to the customer
    in line with the `SLA`.


    ![Figure 1.12 SLA-oriented utility computing system architecture.](images/fig1_12.jpg)


    [Figure 1.12 SLA-oriented utility computing system architecture.](#ch01.xhtml#fg1_13)


    ## 1.7 Grid Computing


    Cluster computing deals with homogenous systems that work cooperatively to complete
    a job. When we consider a real organization like a bank, it consists of a number
    of entities – computing devices, people, other devices like counting machines,
    applications customers. To automate an entire organization thus requires more
    than computers. This has led to the emergence of grid computing paradigm. The
    goal of a grid computing platform is to enable coordinated resource sharing and
    problem-solving in dynamic multi-domain virtual organizations.


    Grid computing resources include computing power, data storage, hardware instruments,
    on-demand software, and applications.


    Consider a group of physicists who want to study the ozone layer. The group requires
    devices to collect atmospheric data, mathematicians, physicists, computer scientists,
    computing devices, interfaces to complete their studies. All such connected heterogeneous
    entities form a grid (with data collection devices, computers, analytics software,
    mathematical modeling tools, interfaces). Heterogeneity and geographical distribution
    of resources in a grid environment necessitates the need for decentralized control
    (to enable better coordination) and open standards (for interoperability).


    One of the most important concepts connected with grid computing `[[8](#ch01.xhtml#ref1_8)]`
    is a virtual organization. Grid computing aims at coordinated resource sharing
    among the participants in a virtual organization. For example, a physicist in
    California University uses dataset from the observation center in Italy. He analyses
    using a mathematical model formed by a mathematician in India using a simulation
    application. He then validates the result with observatory and stores the result
    at a storage provider. This virtual organization involves entities from at least
    four physical organizations – California lab, Italian Lab, Indian Lab, and service
    provider. It connects entities other than computing elements. The creation of
    such a virtual organization is based on the `SLA` between various physical entities.
    This includes the roles, activities, views, and administrative authorities of
    various members of the organization. All these entities form a huge grid to study
    Ozone ([Fig. 1.13](#ch01.xhtml#fig1_14)).


    ![Figure 1.13 Virtual organizations.](images/fig1_13.jpg)


    [Figure 1.13 Virtual organizations.](#ch01.xhtml#fg1_14)


    As in [Fig. 1.14](#ch01.xhtml#fig1_15), one or more virtual organizations may
    share the same physical resources. Consider a VO for weather prediction. It requires
    resources for data collection, storage, analysis, and visualization of the result.
    This includes hardware resources like processor, hard disk, RAM, network along
    with software applications and frameworks. The hardware resources can be shared
    with another virtual organization (for financial domain).


    ![Figure 1.14 Resource sharing in virtual organization.](images/fig1_14.jpg)


    [Figure 1.14 Resource sharing in virtual organization.](#ch01.xhtml#fg1_15)


    Virtual organizations are thus


    * Logical entities

    * Dynamically created for a specific problem and thus have limited lifetime

    * They can dynamically discover, provision, and manage the physical resources

    * Entities can enter or leave the organization at any time

    * Monitor the `QoS` specified in the `SLAs`

    * Resource sharing is based on an open and well-defined set of interaction and
    access rules

    * Sharing relationship among participants is peer-to-peer in nature


    Grids can be basically classified as a computational or data grid. Scientific
    simulations like prime series, financial modeling does not involve a lot of data.
    But require lot of computation. These applications are computation-intensive.
    Processors and RAM are heavily used. Such a grid is said to be a computational
    grid. On the other hand, weather prediction and IoT require a lot of data to be
    analyzed. It requires heavy storage resources. Such grids are called as data grids.


    Some examples of major business areas include:


    * Genomic data analytics in the field of Life Sciences

    * Predicting stock/product prices

    * Research in data-intensive applications like IoT

    * Automotive and aerospace engineering for design, modeling, and testing

    * Enable seamless collaboration and flexibility among various government services

    * Massively parallel, collaborative online games


    The following paragraph compares Grid with related technologies.


    * **World Wide Web**: The browser-server messaging model of WWW lacks complex
    interaction patterns needed to form a virtual organization.

