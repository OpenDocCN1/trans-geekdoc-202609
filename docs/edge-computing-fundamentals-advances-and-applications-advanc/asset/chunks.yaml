    Body compositions are more important to be considered every day for human physical
    fitness that is calculated using body composition scale. An increase in humidity
    and indoor temperature leads to an increase in heat index that leads to many health
    problems. Based on humidity and temperature value from body composition scale,
    heat index is calculated and analyzed in edge server to identify the effects of
    heat index for the individual.


    In order to facilitate secure storage of the private details and efficient prediction
    of ARDS, hypotension, and heat index, FHE schemes are integrated and analyzed
    in edge gateway/server.


    ### 6.3.1 Devices and Setup


    To execute these case studies, blood pressure monitor, pulse oximeter, and body
    composition scale are considered. These devices are connected with Dell Edge Gateway
    5100 series with the configuration as Intel Atom-E3825 CPU of 1.33 GHz, Ubuntu
    Core 16 OS, 2GB DDR3L-1067 MHz, and 32GB Solid State Hard Drive for efficient
    processing. Further, the gateway is connected to centralized cloud server.


    ### 6.3.2 Case Study I: Pulse Oximeter to Detect ARDS in Edge Server


    In human’s life, oxygen is necessary for respiration because the human body uses
    the oxygen to burn food molecules. Oxygen must be transported efficiently to the
    tissues from the atmosphere in order to maintain normal metabolism. For example,
    COVID-19 patients being admitted to hospitals report symptoms like not being able
    to think properly or taste or headaches, which happen because of higher concentration
    of CO[2] in the blood and cause damage to the lungs. In such cases, an oximeter
    can alert them. Pulse oximeter is a small, clip-like device that attaches to a
    body part commonly put on a finger. The purpose of pulse oximetry is to check
    how well your heart is pumping oxygen through your body. It may be used to monitor
    the health of individuals with any type of condition such as ARDS, chronic obstructive
    pulmonary disease (COPD), asthma, pneumonia, lung cancer, anemia, heart attack
    or heart failure, congenital heart defects which can affect blood oxygen levels.
    FHE schemes are used for encryption and make an analysis of encrypted data to
    predict whether the person is affected by ARDS or not.


    Wu Suyu and Yi Weidong proposed a system in the year 2009 for routing the data
    from many nodes to a single receiving device. Two Medicare sensors, namely heart
    beat sensors and pulse oximeter are interconnected in a network to collect heart
    beat and pulse oximeter values. The monitoring devices use an MSP430 microcontroller
    and LCD screen for displaying the values that are connected to WSN node via RS232
    serial communication port to transmit to the edge gateway and finally to the cloud
    server [[6](#ch06.xhtml#ref6_6)].


    #### 6.3.2.1 Pulse Oximetry


    Pulse oximetry is a simple and non-invasive method used to examine oxygen saturation
    (SpO[2]) in various parts of body. Pulse oximetry is considered as a proper alternative
    to the patients for checking O[2] saturation as it reduces the frequency of bleeding
    during the analysis of arterial blood gases. Speed, convenient use, and high accuracy
    in continuous monitoring of patients and detection of hypoxia are other features
    of pulse oximetry. It detects the amount of oxyhemoglobin and deoxygenated hemoglobin
    in arterial blood to embody it as oxyhemoglobin saturation that is an indirect
    estimation of arterial oxygen saturation (SaO[2]).


    #### 6.3.2.2 Oxygen Delivery (DO[2])


    Global oxygen delivery (DO[2]) is the amount of oxygen delivered to the whole
    body from the lungs [[7](#ch06.xhtml#ref6_7),[8](#ch06.xhtml#ref6_8)]. It is the
    product of total blood flow or cardiac output (CO) and the oxygen content of arterial
    blood (CaO[2]) and is usually expressed in ml min^(−1) and is described using
    the equation:


    `DO[2] = CO * CaO[2]` (6.1)


    The oxygen content of arterial blood (CaO[2]) is described using the equation:


    `CaO[2] = (k1 × Hb × SaO[2]) + (k2 × PaO[2])` (6.2)


    where Hb is the hemoglobin concentration (g liter^(−1)), SaO[2] is the arterial
    Hb oxygen saturation, PaO[2] is arterial oxygen partial pressure, k1 is the Hufner’s
    constant to denote the oxygen combining capacity of Hb and it varies from 1.34
    to 1.39, and k2 is the quantity of dissolved oxygen in plasma. For our research,
    the value taken for k1 is 1.34 and k2 is 0.0031.


    #### 6.3.2.3 Oxygen Consumption (VO[2])


    Global oxygen consumption (VO[2]) is the volume of oxygen consumed by the tissues
    per minute [7,8]. Under aerobic conditions, oxygen is consumed to generate energy
    so that VO[2] corresponds to the metabolic rate and is described using the equation:


    `VO[2] = CO * CaO[2]` (6.3)


    The oxygen content of venous blood (Cv[2]) is described using:


    `Cv[2] = (k1 × Hb × SaO[2]) + (k2 × PaO[2])` (6.4)


    where Hb is the hemoglobin concentration (g liter^(−1)), SaO[2] is the arterial
    Hb oxygen saturation, and PaO[2] is arterial oxygen partial pressure.


    #### 6.3.2.4 Acute Distress Syndrome


    ARDS is a condition that causes fluid to occupy the lungs to make oxygen not reach
    the rest of the body. Due to oxygen consumption, oxygenation may not be reflected
    by small changes. The following attributes are collected:


    1. ID

    2. Hemoglobin (HGB)

    3. Arterial Oxygen Saturation (SaO[2])

    4. Venous Oxygen Saturation (Sv[2])

    5. Arterial Oxygen Pressure (PaO[2])

    6. Venous Oxygen Pressure (Pv[2])

    7. Cardiac Output (CO)


    The values received from pulse oximeter are shown in Table 6.1.


    ### 6.1

    Table 6.1 Data Collected via Pulse Oximeter


    | ID | HGB | SaO[2] | Sv[2] | PaO[2] | Pv[2] | CO |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | 13 | 88 | 66 | 82 | 31 | 8 |

    | 2 | 10 | 91 | 56 | 80 | 27 | 4 |

    | 3 | 16 | 99 | 73 | 79 | 44 | 9 |

    | 4 | 14 | 95 | 72 | 89 | 37 | 7 |

    | 5 | 17 | 92 | 58 | 84 | 31 | 5 |

    | 6 | 9 | 93 | 58 | 92 | 33 | 5 |

    | 7 | 18 | 95 | 80 | 84 | 36 | 3 |

    | 8 | 9 | 100 | 76 | 82 | 30 | 3 |


    In order to ensure the privacy and security of the data, FHE scheme is applied
    in edge gateway where the data are encrypted homomorphically and used for further
    analysis. Upon encrypted data, analysis is carried out to detect whether a person
    has ARDS or not by any number of arbitrary computations. Table 6.2 portrays the
    encrypted data values collected through pulse oximeter device.


    Table 6.2 Encrypted Data Collected via Pulse Oximeter


    | ID | HGB | SaO[2] | Sv[2] | PaO[2] | Pv[2] | CO | CaO[2] | Cv[2] | DO[2] | VO[2]
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 99530653 | 26979418 | 70765932 | 29657567 | 13269364 | 1.21E+08 | 33735285 |
    78645868 | 6248914 | 2.65E+16 | 2.3E+16 |

