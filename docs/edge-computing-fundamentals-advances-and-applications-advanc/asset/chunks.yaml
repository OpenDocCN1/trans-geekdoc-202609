    more secure and minor changes in data cause a huge difference in the generated
    hash. Blockchain is growing list of records called blocks. Every generated block
    in blockchain is linked to previous block using its hash value. Change in any
    one block affects all the successive blocks. Cryptographically altering all the
    further blocks is impossible.


    **Increased Capacity:** As there are many nodes/computers working together, blockchain
    offers greater power than the centralized system.


    **Anonymity:** In blockchain, the account numbers of individuals are public but
    it does not expose the private, identity details such as name of the person involved
    in the transaction. From the account number, other personal details of the individuals
    cannot be fetched as the account numbers are exposed only after hashed.


    **Consensus:** Each network participant keeps a copy of the entire blockchain.
    Consensus validates and verifies every new transaction. It is generally validated
    by network miners who are incentivized to verify transactions through consensus
    mechanisms like PoW. As there is no central controlling authority in blockchain
    network, each and every node works independently. Consensus is intended to ensure
    consistency of transactions between nodes without anomalies.


    **Transparency:** Everyone who joined in network can view the public accounts
    and it’s all the transactions but private information of public accounts are not
    exposed to the network entities.


    **Provenance:** In order to establish trust and authenticity, the history of the
    transactions is recorded in blocks of a blockchain. Origin of the transactions
    can easily be tracked and monitored. Anyone who transacts in network can be traced
    and this feature helps trace the provenance of a network entity.


    ## 5.6 Benefits and Limitations of Blockchain


    ### Benefits


    *   Nobody has the central authority. Human involvement in the verification and
    validation process improves trust and accuracy.


    *   Modifying the assets is practically impossible as the degree of decentralization
    makes it complicated to alter.


    *   All the activities that happen in network are open to every other network
    entity to observe. This property provides a transparency in the network, meanwhile
    it ensures the transactions are secured, private, and efficient.


    *   Though blockchain is slow depending on the network congestion, it eradicates
    the excessive cost to be spent for transaction as it eliminates third-party verification.


    *   It is well suited for a network where users don’t trust each other.


    ### Limitations


    *   The PoW consensus in Bitcoin takes around 10 minutes to add a block into the
    chain. Solution for this concern is under research for years. Speed ineffectiveness
    is the major concern with the blockchain network.


    *   It takes high computational power to validate each transaction. Though it
    eliminates third-party verification costs, the electricity consumption for validating
    blocks becomes the most important concern.


    ## 5.7 Types of Blockchain


    There are two primary types in blockchain, namely, private blockchain and public
    blockchain. Later, different variations of blockchain have arrived. Irrespective
    of the types, blockchain network has the following common properties:


    *   It is a P2P network.


    *   The transactions are updated in distributed ledger.


    *   Every node in a blockchain network has a copy of shared and distributed ledger.


    *   Each node validates and verifies the transactions that take place in network
    through consensus and various cryptographic mechanisms.


    Degree of Centralization is a key attribute based on which the categorization
    of the blockchain is determined. The most important threats in totally centralized
    system are the trust among the entities and single point of failure. Decentralization
    and various metrics in blockchain help establish trust among parties and avoid
    single point of failure. Blockchain configuration varies across different categories
    as shown in [Fig. 5.7](#ch05.xhtml#fig5_7).


    ![Figure 5.7 Types of blockchain.](images/fig5_7.jpg)


    [Figure 5.7 Types of blockchain.](#ch05.xhtml#fg5_7)


    **Private Blockchain:** Private blockchain restricts the actors joining the network
    as it is permissioned network. It preserves privacy. The network is more energy
    efficient compared with public blockchain as it has its own private consensus
    mechanisms that work faster. These are less volatile networks. It is well suited
    for any particular organization. Transaction throughput is higher than public
    blockchain. All the members who are present in the network are authenticated or
    pre-approved to join in. So, less energy-intensive consensus algorithms like simple
    voting mechanisms is also preferred here. Private Blockchain is also referred
    to as partially decentralized network since it is controlled by organization to
    some extent. A simple and secure blockchain for Internet of Medical Things (IoMT)
    using private blockchain is illustrated by Anitha Kumari et al. \[[6](#ch05.xhtml#ref5_6)\].'
