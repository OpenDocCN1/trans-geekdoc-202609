  trans: "\n\n图 1.3 **(a)** 共享内存访问 (UMA) **(b)** 非统一内存访问 (NUMA)。\n\n这类系统速度很快。该模型的主要问题是扩展性。由于所有处理器都通过共享内存进行通信，形成了一个瓶颈。由于所有通信都通过共享内存完成，该架构是紧耦合的。这种共享内存系统被称为并行计算系统。\n\
    \n### 1.3.2 分布式内存系统\n\n在这些系统中，每个节点都有一个处理器 (`P`) 和一个内存 (`M`)。每个节点都能独立进行处理。它们通过网络进行通信。网络结构用于节点之间的数据传输。这类系统被称为真正的分布式系统（图\
    \ 1.4）。\n\n![图 1.4 分布式内存系统。](img/fig1_4.jpg)\n\n图 1.4 分布式内存系统。\n\n这类系统的扩展性高于共享内存系统，因为互连网络仅用于通信。它具有容错性，因为另一个节点可以执行故障节点的功能。当本地无法获取数据时，将从另一个远程节点获取。这导致与本地数据相比，远程数据的访问时间是非均匀。这类系统是松耦合的，可以独立执行计算。\n\
    \n### 1.3.3 混合模型\n\n该模型是共享内存和分布式内存架构的混合。该模型的主要优势是像网络模型一样具有更高的扩展性。此外，由于共享内存，访问时间缩短了（图\
    \ 1.5）。\n\n![图 1.5 混合系统。](img/fig1_5.jpg)\n\n图 1.5 混合系统。\n\n因此，从程序员的角度来看，并行处理可以分类为：\n\
    \n* **并行处理**：当单个程序被分解为并行执行的独立任务时。\n* **数据并行**：当并行处理大量值并合并结果时。\n* **多处理器处理**：在单独处理器上执行两个或多个独立程序。\n\
    \n网络技术的进步、数据传输延迟的降低以及带宽的增加，促进了真正分布式系统的繁荣。\n\n### 1.4 分布式计算\n\n网络技术随着数据传输延迟的降低和带宽的增长，是分布式计算范式出现的驱动力。该范式出现于\
    \ 20 世纪 60 年代，通过使用消息传递在远程计算资源之间启动通信而出现。20 世纪 70 年代局域网 `ARPANET` 和电子邮件服务的增长促进了它的发展。分布式计算系统由多个独立的自治系统组成，它们通过通信和协调行动，在终端用户看来像是一个单一的一整体系统。当用户给定任务时，系统透明地执行该任务。分布式系统的用户能够将系统视为一个灵活、高效、可靠、安全且易用的虚拟集中化系统。\n\
    \n在足球队中，每个球员都有自己的专长并独立工作。球员之间没有共享状态（没有通信）。此外，球员的移动没有全局同步。团队有一个共同目标，即防守球门和进球。这与分布式系统的定义恰恰是一个类比，分布式系统被定义为“一组自治节点，它们通过通信和协调行动，在终端用户看来像是一个单一的一整体系统”。\n\
    \n为了应对这一挑战，某些透明性包括 [4,5]：\n\n* **透明性**：这一特性向用户隐藏了细节。某些类型包括：\n    * **位置透明性**：用户感知不到所在位置。\n\
    \    * **迁移透明性**：隐藏任务是否已迁移的细节。\n    * **复制透明性**：隐藏副本的细节。\n    * **故障透明性**：隐藏当特定资源发生故障时重新分配的细节。\n\
    \    * **并发透明性**：为多个用户之间的共享资源提供抽象。\n    * **访问透明性**：向用户隐藏访问细节。\n    * **扩展透明性**：便于系统扩展。\n\
    \n* **可靠性**：多个节点的节点避免了在集中化系统中常见的单点故障。为了确保可靠性，分布式系统应该能够检测并从崩溃故障中恢复。为了容错，经常使用去中心化控制。冗余是复制多个节点。这确保了即使节点失败，功能也可以实例化。集中控制增加了单点故障的可能性，因此优于去中心化控制。\n\
    * **故障检测与恢复**：同样提高了系统的可靠性。它包括用于检测故障的硬件和软件机制，以及纠正系统状态的机制。原子事务、无状态服务器以及在消息传输中使用确认可以增加系统可靠性。\n\
    * **灵活性**：便于对系统进行修改以满足用户需求。可以添加新功能或服务，或修改现有服务以使系统更有效、高效。\n* **扩展性**：扩展性是指系统适应不断增加的服务负载的能力。去中心化有助于构建可扩展的系统。\n\
    * **安全性**：分布式系统中的资源应受到防止破坏和未经访问访问保护。可以使用加密原理提供身份验证和授权。应保持消息和数据的完整性。可以使用数字签名确保不可否认性。安全审计至关重要。\n\
    * **性能**：分布式系统的性能应优于集中系统。提高分布式系统性能的一些措施包括采用细粒度并行、减少冗余复制操作和网络流量、在提交之前对作业进行批量处理以及使用缓存减少数据传输/磁盘读写操作。\n\
    \n分布式计算的一些优势 [6] 包括：\n\n* **性能**：由于分布式应用程序中的任务可以通过在网络节点上分配负载来并行执行，它们具有良好的性能。\n\
    * **协作**：多个应用程序可以通过标准的分布式计算机制连接并通信，以协作完成任务。\n* **更高的可靠性与可用性**：由于应用程序/任务在多台机器上复制，它提供了更好的可靠性。\n\
    * **扩展性**：分布式系统中的通信和松耦合使得具有更好的扩展性。\n* **可扩展性**：分布式应用程序可以动态重新配置。分而治之的方法将大问题分解为小问题，这些单个组件可以由较小的开发团队独立开发。\n\
    * **复用**：分布式组件可以执行多种服务，可能被多个客户端应用程序使用。它节省了重复的开发工作并改进了组件之间的互操作性。\n\n"
