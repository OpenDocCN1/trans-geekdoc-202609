    * An FHE embedding prototype to intrinsically ensure users’ data confidentiality
    against threats in the working platform is a challenging application. The scheme
    comprises trans-ciphering, automatic compilation, parallelization, and message
    packing that allows performing homomorphic encryption in mere practice. This integrated
    platform is suitable for applications that are strongly dis-symmetric in nature
    and for applications that do not send any response back to the client device.

    * An efficient hybrid homomorphic encryption technique for image encryption is
    presented to ensure the safe exchange of private images in the public cloud based
    on the block pixel position.


    ### 4.2.7.2 Basic Functions of Homomorphic Encryption


    The security of most of the FHE is either based on Learning with Errors (`LWE`),
    Learning Parity with Noise (`LPN`), Learning with Rounding (`LWR`), or Ring-Learning
    with Errors (`RLWE`) problem, which is considered as NP-hard problem associated
    with lattices. Lattices are used to provide circuits with low multiplicative depth
    and intricacies that are proven to be secure against quantum attacks. The core
    functions of homomorphic encryption are as follows:


    * Key generation

    * Encryption

    * Evaluation

    * Decryption


    The basic functions are elaborated in [Fig. 4.8](#ch04.xhtml#fig4_8).


    ![Figure 4.8 Basic functions of homomorphic encryption.](images/fig4_8.jpg)

    [Figure 4.8 Basic functions of homomorphic encryption.](#ch04.xhtml#fg4_8)


    Any FHE supports two types of homomorphic schemes, namely additive homomorphism
    and multiplicative homomorphism. A detailed view of additive and multiplicative
    homomorphisms is shown in [Fig. 4.9](#ch04.xhtml#fig4_9).


    ![Figure 4.9 Additive and multiplicative homomorphic properties.](images/fig4_9.jpg)

    [Figure 4.9 Additive and multiplicative homomorphic properties.](#ch04.xhtml#fg4_9)


    Few of the schemes listed under data confidentiality are still in elusive stage
    and it is a completely open platform for improvement and application in edge computing
    environment.


    ## 4.3 Authentication


    Proper authentication mechanisms are mandate for any federated environment, failing
    leads to access by outsiders/adversaries. Verification of ones’ own identity with
    the credentials is referred to as authentication. Most of the edge environment
    mandates identity validation in trusted domains. The most suitable authentication
    mechanisms for edge computing environment are listed as follows:


    * Single-domain authentication

    * Cross-domain authentication

    * Handover authentication


    ### 4.3.1 Single-Domain Authentication


    Authentication must ensure verification, data anonymity, user privacy, and forward
    security. Data anonymity says any illegitimate user must not gain access to the
    communication even if the communication occurs in an open public channel. User
    privacy must not be tampered unless or otherwise the users already agreed for
    mutual concern/interest. Forward security guarantees that none of the previous
    messages exchanged is disclosed to the interceptors. Manifold researches are ongoing
    in this area to harden the security and to preserve the privacy. Anonymous authentication
    and privacy-preserving are assured in the system model proposed by Liu et al.
    \[[14](#ch04.xhtml#ref4_14)\] with high level of scalability. Privacy-aware authentication
    scheme proposed by Jiang et al. \[[15](#ch04.xhtml#ref4_15)\] provides single-domain-based
    authentication using bilinear pairing cryptosystem and dynamic nonce generation.
    This scheme offers mutual authentication by mitigating all possible threats in
    large-scale distributed environment. An enhanced version of this scheme is presented
    by including identity-based signatures. Much simplest way of single-domain authentication
    is Single Sign-On (`SSO`). Once `SSO` is set up, the users with proper verification
    could be able to access all the services provided by the company within the premises.
    `SSO` empowers users to access manifold services/applications/websites by logging
    in only once. For instance, managing Google Accounts with `SSO` support irrespective
    of the devices is a captivating feature to access all the facilities in a single
    layout after logging in only once. A seamless, safe, and secure environment is
    provided to the consumers using `OAuth 2.0` protocol. [Fig. 4.10](#ch04.xhtml#fig4_10)
    illustrates the working of single-domain authentication.


    ![Figure 4.10 Single-domain authentication.](images/fig4_10.jpg)

    [Figure 4.10 Single-domain authentication.](#ch04.xhtml#fg4_10)


    ### 4.3.2 Cross-Domain Authentication


    When the request for user authentication is made across domain, it is referred
    to as cross-domain authentication. For instance, if the requests from one application
    are sent to another domain, it is called cross-domain authentication. Gathering
    the requested credentials from an application and sending them to another obviously
    encounters security threats/vulnerabilities. To alleviate these attacks, proper
    security controls must be taken and deployed to ensure guaranteed access across
    the domains. This can be achieved through attribute-based framework or group key-based
    framework. Hierarchical tree-based structure and high level of scalability maintenance
    mandated for group key-based framework, whereas attribute-based framework is considered
    as the next-generation model as it is context-aware and offers dynamic access.
    Although many schemes exist in these models, key/certificate revocation, privacy-preserving,
    and anonymous authentication are considered as the major limitation of these schemes
    and paves way for improvement. [Fig. 4.11](#ch04.xhtml#fig4_11) details the cross-domain
    authentication that exists between two company entities.


    ![Figure 4.11 Cross-domain authentication.](images/fig4_11.jpg)

    [Figure 4.11 Cross-domain authentication.](#ch04.xhtml#fg4_11)


    ### 4.3.3 Handover Authentication


    To ensure secure and seamless roaming over multiple access points of the devices
    devices, proper mandate authentication is indispensable and is termed as handover
    authentication. Designing an efficient handover authentication protocol is considered
    to be a cumbersome process as it is liable to very frequent hazardous attacks.
    In addition, scalability and processing overhead are considered the highest limitations
    of handover authentication. Untraceability and identity privacy must be the primitive
    properties to be satisfied by this technique. Many such schemes exist by preserving
    anonymous authentication using classical hard cryptosystems such as `ElGamal`
    and elliptic curve cryptography. A typical handover authentication scenario is
    portrayed in [Fig. 4.12](#ch04.xhtml#fig4_12).


    ![Figure 4.12 Handover authentication.](images/fig4_12.jpg)

    [Figure 4.12 Handover authentication.](#ch04.xhtml#fg4_12)


    ## 4.4 Privacy-Preserving Schemes


    Ensuring privacy in the edge computing environment is an unavoidable task. The
    environment must assure holistic privacy, conditional privacy, trajectory privacy,
    differential privacy, data privacy, location privacy, and identity privacy. Out
    of these privacies, data privacy, location privacy, and identity privacy are the
    mandate privacy policies to get executed. To enforce the highest level of security,
    fine-grained privacy policy execution is extremely important.


    ### 4.4.1 Data Privacy


    A humongous amount of data is generated every day from various applications/sectors,
    such as e-commerce, retail, social media, banks, and so on, due to unprecedented
    digital transformation. Apparently, this paves the way to serious/harmful privacy
    violations. Key threats considered are as follows:


    * Disclosure

    * Discrimination

    * Surveillance

    * Individual data abuse

