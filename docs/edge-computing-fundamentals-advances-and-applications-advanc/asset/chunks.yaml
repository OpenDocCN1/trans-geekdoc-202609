    - **Education**: Computer technology can change the way we learn. Blended learning
    that combines classroom learning with online resources can enable students to
    understand the concept better. The use of videos, streaming, and augmented reality
    demonstrate a concept with animations and hence improves the learning of the student.
    Virtual classrooms can improve interactions. Teachers and management can use computers
    to store, maintain, and analyze student information. State of art distributed
    ledgers like blockchains help to maintain student information in a secure manner.
    World Wide Web (WWW) is a huge repository of information. Computers facilitate
    students to search and access information from this huge repository. Computers
    aid in student registration, class scheduling, processing of examination results.

    - **Law**: Computers are used extensively to gain access to information and for
    documentation. Intelligent systems can be also used for aiding lawyers for diagnostic
    and decision-making purposes. It includes analyzing and processing information
    to generate weekly and monthly reports, recording and maintaining payments, maintaining
    a legal information diary on court procedures with search facilities, maintaining
    a record of users.

    - **Government sector**: uses the field of computing for effective administration
    and record keeping. Computing platforms can aid in effective storage/retrieval
    of data of citizens, services, projects, properties, organizations, and so on.
    It can be used for effective planning, communication, and decision-making. It
    can be used for traffic control, monitor enemy movement in borders, forecast weather,
    and predict disasters among a few.

    - **Entertainment**: Computers are used extensively in various sports to predict
    and improve the performance of players, games, play music, drawing, and so on

    - **Agriculture**: Computers are extensively used by farmers in the agricultural
    fields to record various soil and weather parameters and to automate various agricultural
    tasks. Various portals provide guides to farmers based on the daily conditions.
    Yield prediction, weather forecasts extensively rely on computing.


    Rapid development of science and technology has changed the business systems in
    various domains. Manual tasks have been automated using computers. This reduces
    risks and improves effectiveness of the business systems in various domains including
    financial, industry, education, and administration. To conclude computers have
    become the brain behind the society.


    ## 1.3 Parallel Computing


    Since 1960, the fundamental components of a computer as described by the traditional
    Von Neuman Architecture consist of the memory, central processing unit, and the
    arithmetic unit and logical unit. Moore’s law states that the transistor density
    doubles every 1.5 years. This in turn doubles the processing power. But this also
    reduces the space between the components and increases the power dissipation.
    This is because power dissipation increases by square of increase in clock speed.
    On an average, processor performance is increased by 52% every year between 1986
    and 2002. After 2002, the performance stabilized. Clock speed could not be increased
    further due to power dissipation. Moore’s law on increasing transistor density
    continues but clock speed has to be stabilized. This resulted in the emergence
    of a parallel computing paradigm using multiple cores. Here instead of increasing
    transistor density in a chip to improve performance of one processor, those transistors
    can be used to pack multiple processors into the same chip. Thus sequential computing
    gave way to parallelism.


    Consider the case of solving a puzzle. Initially, pieces can be grouped as in
    [Fig. 1.1](#ch01.xhtml#fig1_1). If only one person solves the puzzle, then maybe
    he takes 15 minutes. Consider two people are involved, then they solve their portion,
    communicate to solve the common portion and complete the work earlier, maybe in
    9 minutes. On the other hand, if three people are involved, then they can solve
    it maybe in 6 minutes, but more communication is required. Multiple queues will
    speed up a service when compared to a single queue in contrast to multiple queues.
    An orchestra is an apt example for parallel processing where each instrumentalist
    does his work in a slot, maybe he may be in contention with another.


    ![Figure 1.1 Puzzle and queue analogy to parallel processing.](images/fig1_1.jpg)


    [Figure 1.1 Puzzle and queue analogy to parallel processing.](#ch01.xhtml#fg1_1)


    Parallel computing is the use of two or more processors (cores, computers) in
    combination to solve a single problem. Any problem is executed using a series
    of instructions. Consider that grades of ten students are to be calculated. Each
    student’s record is processed by reading the marks, calculating the total, calculating
    the grade, and then printing the results. Let us consider that these form four
    instructions. So for ten students, 40 instructions have to be executed one after
    another on a single system. If each instruction consumes 1 unit of time, the total
    time consumed is 40 units. Now, if we have five processors, then grade of five
    students can be calculated in parallel. The problem is divided into five jobs
    with each job handling two students ([Fig. 1.2](#ch01.xhtml#fig1_2)). Hence for
    these five students as operations are done in parallel, it consumes only 4 units
    of time. Hence for ten students, it consumes 8 units of time. Hence performance
    is increased.


    ![Figure 1.2 Sequential vs parallel processing – an example.](images/fig1_2.jpg)


    [Figure 1.2 Sequential vs parallel processing – an example.](#ch01.xhtml#fg1_2)


    Parallel processing [[3](#ch01.xhtml#ref1_3)]\] can be done in instruction stream
    level or data stream level or both. When both instructions and data are processed
    sequentially it is called as single instruction stream single data (SISD) stream
    architecture. It is basically a serial computer. Data stream can be processed
    in parallel as in the figure above data of five students are processed in parallel.
    This architecture is called single instruction multiple data (SIMD) stream architecture.
    A set of instructions not dependent on one another can be processed in parallel.
    Such an architecture is called as multiple instruction single data (MISD) architecture.
    When multiple instructions each process different data, then it is multiple instruction
    multiple data (MIMD) architecture.


    Some of the advantages of using parallel computing include:


    - Parallel computing is highly suitable for modeling, simulating, and understanding
    complex, real-world phenomena. For example modeling road traffic which includes
    hundreds of vehicles and innumerable number of roads.

    - Saves time as the job can be split into smaller tasks and executed in parallel.

    - Reduces cost, as parallel systems can be constructed using cheap commodity computers.

    - Complex problems like search, grand challenge problems require large computational
    power. This necessitates parallelization.

    - Sharing of computational resources, for example, SETI@home project makes use
    of free processors for computation.

    - Optimizing resource usage: As modern computers have multiple processors/cores,
    using parallelization improves their utilization.


    Communication between different processors in a parallel processing system can
    occur using a shared memory or a network [3].


    ### 1.3.1 Shared Memory Systems


    Here various processing units (P) share the same memory (M). All the communication
    between processors is through the shared memory. Based on whether the memory access
    time for all the processors is the same, shared memory systems are classified
    as uniform memory access (UMA) or non-uniform memory access (NUMA) systems ([Fig.
    1.3](#ch01.xhtml#fig1_3)).


    ![Figure 1.3 (a) Shared memory access (UMA) (b) non-uniform memory access (NUMA).](images/fig1_3.jpg)

