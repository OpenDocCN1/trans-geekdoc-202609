    `Ms. D. Dharani` 现任印度 PSG 理工学院 IT 系的助理教授。她于 2016 年在金奈梅大学（Anna University, Chennai）获得信息技术硕士硕士学位，并于
    2014 年获得该校信息技术学士学位，目前正在金奈梅大学攻读信息与通信技术博士学位。她曾在国际/国家期刊及会议上发表过多篇论文。此外，她还合著了名为“COVID-19：基于
    CNN 的 AI 社交距离检测器”的书章节，该书由 Springer 出版。她完成了 PSG CARE 赞助的为期一年的数据科学认证课程，并成功完成了 NPTEL
    和 Coursera 的区块链认证课程。她的研究兴趣包括区块链技术、边缘数据分析和机器学习。


    `Dr. M. Niranjanamurthy` 现任卡尔纳塔克邦班加罗尔 M. S. Ramaiah 理学学院计算机应用系的助理教授。他拥有 12* 年的教学经验和
    2 年的软件工程师行业经验。他在德国 Scholars Press、Wiley-SP 和 Springer 出版了 6 本书，并在各种国际会议和国际期刊上发表了约
    70* 篇研究文章。成就方面，他申请了 18 项专利，其中 3 项已授权。他担任数据科学、机器学习和网络领域四位博士生的导师。他担任 22 份国际期刊的审稿人，并两次获得最佳研究期刊评审员奖。他曾获得
    2018、2019 和 2020 年计算机科学工程研究员奖。他曾担任国家/国际博士论文评审。主持过多次国家和国际会议、国家级研讨会并进行过演讲。他与多个专业机构相关，如
    IEEE 会员、“国际工程师协会”（IAENG）终身会员以及“计算机科学教师协会”（CSTA）成员。他的兴趣领域包括数据科学、机器学习、电子商务和移动商务，涉及行业内部工具增强、软件测试、软件工程、Web
    服务、Web 技术、云计算、大数据分析和网络技术。


    # 1 计算范式


    DOI: [10.1201/9781003230946-1](https://doi.org/10.1201/9781003230946-1)


    ## 1.1 计算引论


    人类最惊人的科学成就之一是计算机。这个词源于拉丁语“Computare”，由两部分组成——“Com”意为“一起”，“putare”意为“结算（账）”。计算机是用于计算的设备。“Computing”源于拉丁语“Computatio”，意为计算或计数。计算过程利用计算机技术来完成任务。`Computing`
    过程包括使用计算设备进行信息管理、处理和通信的活动。


    我们已经从计算机被视为奢侈品的时代，进入了被视为必需品的时代。我们在日常生活中不露张声色地使用某种形式的计算。使用手机、洗衣机、通过电子邮件通信、金融交易都包含了某种形式的计算。由计算机触发的任务自动化在提高准确性的同时，减少了人工工作、电力、成本和时间。


    ## 1.2 计算的主要影响


    触发创新的技术确保了社会的活力。计算机的使用提供了有效、公平且个性化的银行解决方案。今天，计算是每个企业、银行、政府、娱乐、工业和管理不可或缺的工具。可以说，所有大型组织（无论是政府部门还是私营）都使用计算机来处理各种日常业务。


