    分布式数据库将内容/数据分布在由单个实体控制和监控的不同系统中。区块链分布式架构是一个网络，其中每个节点都充当管理员。网络中的每笔交易在被添加到分布式账本之前，都会经过密码学验证和确认。一旦交易在区块链中更新，就不可能对其进行修改。该账本可比
    `Linked List`（链表）数据结构，因为它是一个通过密码学链接的区块链。这些区块中的每一个都包含交易，由整个网络通过共同共识对这些交易进行验证。为了篡改或更改分布式账本的内容，网络中的每个实体必须达成一致的协议/共识，而这是可能的。由于区块之间是密码学链接的，如果不修订所有后续区块，就无法对其中某一个区块进行更改。区块链的理念类比云端的
    Google 表格，每个人都可以同时执行任务而不会丢失任何数据，但区别在于，表格数据是中心化存储在 Google 服务器上的。相反，在区块链中，区块链网络的每个节点都拥有最新版本账本的相同副本，所有交易都带有时间戳并更新。


    ## 5.3 P2P 架构在区块链中的作用


    P2P 网络由一组协作在网络中存储和共享数据的节点/设备组成，如图 5.4 所示。网络中的所有节点都具有相同的权限和权力，并执行相同的任务。在比特币等支付服务网络中，P2P
    网络通常是分布式网络中数字资产的交换，买卖双方在没有任何中介的情况下进行。


    ![图 5.4 P2P 网络。](img/fig5_4.jpg)


    图 5.4 P2P 网络。


    区块链整合了 P2P 网络架构的理念，并维护了一个每个参与者都可以信任的分布式账本，尽管参与者之间可能并不互相熟悉。结合分布式账本技术（DLT）的密码学安全
    P2P 网络架构防止了数字资产交易中可能的双重花费问题。双重花费是将同一笔钱花给多个实体的过程，这在实体货币/现金系统中是不现实的。区块链系统结合了密码学解决方案、P2P
    网络特征和博弈论方面。公钥密码和密码哈希函数的使用确保了网络中发生交易的透明性和隐私性。区块链网络由去中心化社区通过 P2P 网络通过激励进行管理。通常，博弈论是关于刻意决策过程的研究。在这里，交易使用共识机制进行验证，在验证过程中获胜的节点将下一个区块添加到链中，该节点还会获得经济激励。运行共识算法并将区块添加到区块链的网络矿工将获得激励。这个过程被称为“铸币”（minting）。基于共识机制向区块链添加下一个区块的过程让人想起了博弈论的属性
    [3]。


    ## 5.4 区块链密码学


    密码学技术用于区块链以确保机密性、真实性、授权、不可否认性和完整性。交易中的机密性是指保证共享信息保持保密的责任。它是指将可读消息转换为不可读格式的能力，以提高隐私性。真实性是确认用户身份以继续后续交易的过程。授权是提供用户访问特定资源权限的过程。不可否认性证明了发送者是否真的发送了这条消息。完整性确保消息在传输过程中没有被篡改，如图
    5.5 所示 [4]。


    ![图 5.5 密码学属性。](img/fig5_5.jpg)


    图 5.5 密码学属性。


    区块链技术以多种方式使用密码学机制：例如用于钱包、交易、安全隐私保护。以下是区块链中最广泛使用的密码学技术：


    * 公钥加密

    * 哈希处理

    * Merkle 树

    * 数字签名


    **公钥加密（非对称密钥加密）：** 在对称密钥机制中，一个秘密密钥同时用于加密和解密过程。虽然这些系统快速且高效，但每个用户都需要单独的密钥。对于系统中的
    `N` 个用户，需要 `N*(N-1)/2` 个密钥。安全地存储和维护这些大量的密钥以及在双方之间传输密钥是一个问题。因此，区块链使用了公钥加密机制。


    非对称密钥加密使用两个密钥：私钥和公钥。如果 A 人想向 B 人发送消息，A 人使用 B 的公钥对消息加密，该公钥对所有人公开。A 人将加密后的消息发送给
    B 人。然后 B 人使用自己的私钥解密消息，该私钥没有任何其他人持有。在这里，公钥是由私钥推导出的，但反过来则是不可能的。


    常用的公钥加密技术是 `RSA`。在区块链中，使用了更安全、更快的公钥加密机制，称为椭圆曲线加密 (`ECC`)）。使用 `256` 字节的密钥，`ECC`
    比 `RSA` 中 `3072` 字节的密钥实现了更高的安全性 [5]。`ECC` 算法比 `RSA` 以更小的密钥提供了更好的安全性。`ECC` 基于非奇异椭圆曲线和点运算概念，因此更安全、更快。以下是椭圆曲线方程：


    `y² = x³ + ax + b`


    假设 `M` 是要传输的消息。公钥 (`Q`) 使用范围在 1 到 `N-1` 之间的私钥 `d` 推导得出。例如，公钥使用公式 `Q = d * P` 生成，其中
    `P` 是椭圆曲线上的点，`d` 是私钥，`Q` 是公钥。


    **ECC 加密：** 从 1 到 `N-1` 随机选择 `k`。""m"` 是要传输的消息，在椭圆曲线上用 `M` 表示。因此，使用下面的点运算技术生成两个密文
    `C1` 和 `C2`。


    ```

    C1 = k * P

    C2 = M + k * Q

    ```


    **ECC 解密：** 使用私钥 (`d`) 从两个密文 `C1` 和 `C2` 中提取原始消息 (`M`)，如下所示：


    ```

    M = C2 - d * C1

    ```


    **哈希处理：** 哈希是将任意长度文本转换为固定长度文本的过程。哈希的主要目标是维护完整性。比特币网络使用 `SHA-256` 作为哈希机制。`Keccak`
    是 `SHA` 的修改版本，用于以太坊区块链网络，它比 `SHA`更快。一个强大的哈希算法必须满足以下属性：


    * 输入数据的微小变化会产生输出的巨大差异。这被称为雪崩效应。

    * 哈希始终是单向函数，确保了原始文本无法被找回。给定 `H(x)`，寻找 `x` 在计算上是困难的。

    * 它必须是无冲突的。这一属性确保了哈希值的唯一性。


    哈希可以是线性哈希或基于树的哈希。由于交易是动态的，线性哈希并不区块链。每次插入都需要重新哈希，并且每次必须遍历所有节点。因此，区块链使用了基于树的哈希。在这方面，只有在需要重新计算特定路径时才需要重新哈希。它将复杂度降低到了
    `log N`。

    '
- fmt: "\n### Merkle Hash Tree\nEvery transaction in blockchain is hashed using algorithms\
    \ like `SHA-256` and maintained in a data structure called Merkle tree in blockchain.\
    \ The leaf nodes are the hash values of valid transactions, respectively. The\
    \ intermediate nodes are generated by rehashing the hash values of leaf nodes.\
    \ This process continues till root node. Each and every node in the Merkle tree\
    \ is interlinked using hash value which makes it computationally strong and secure.\
    \ `Merkle root` is then added to block header to integrate the pool of valid transactions\
    \ to corresponding block in the blockchain. This data structure is extensively\
    \ used in `Bitcoin` and `Ethereum` blockchain networks. \n\n### Digital Signature\n\
    To ensure authentication, integrity, and non-repudiation, the digital signature\
    \ is integrated in blockchain. The sender first hashes the transaction/message\
    \ data using a hash function (double `SHA-256` is used in `Bitcoin`) for later\
    \ verification of data integrity. The hashed data are then encrypted using the\
    \ sender’s private key to provide authentication and the encrypted output is known\
    \ as the digital signature of that transaction. The encrypted message digest is\
    \ called the digital signature. The transaction data and the digital signature\
    \ are broadcasted to network. At the receiver end, the digital signature is decrypted\
    \ using public key of the sender to obtain message digest. Message digest is again\
    \ calculated separately from the received data. This is checked to notice if it\
    \ is the same as message digest decrypted from the digital signature. Hence, the\
    \ digital signature can be used to provide authentication, ensuring integrity\
    \ and non-repudiation. Elliptic Curve Digital Signature Algorithm (`ECDSA`) is\
    \ widely used in blockchain for providing digital signature and it uses `ECC`\
    \ to create key pairs that are used for signing and verification process [4].\n\
    \n## 5.5 Characteristics of Blockchain\n\nThe basic characteristics of blockchain\
    \ are as follows ([Fig. 5.6](#ch05.xhtml#fig5_6)):\n\n![Figure 5.6 Characteristics\
    \ of blockchain.](images/fig5_6.jpg)\n\n[Figure 5.6 Characteristics of blockchain.](#ch05.xhtml#fg5_6)\n\
    \n**Decentralized:** No single authority can control the blockchain network. It\
    \ is a `P2P` decentralized distributed ledger.\n\n**Enhanced Security:** Blockchain\
    \ integrates the cryptographic techniques such as digital signature, public key\
    \ cryptography, and hashing mechanisms to maintain integrity. Blockchain network\
    \ is verifiable. Whenever a block initiates a transition, other network entities\
    \ verify and validate whether the transition is correct or not. If the data are\
    \ tampered, the cryptographic signature will become invalid and hence it cannot\
    \ be verified and validated by network entities.\n\n**Immutability:** The immutability\
    \ in blockchain is achieved through the ledger. Once the blocks are added to blockchain,\
    \ it cannot be modified as it is cryptographically more secure and minor changes\
    \ in data cause a huge difference in the generated hash. Blockchain is growing\
    \ list of records called blocks. Every generated block in blockchain is linked\
    \ to previous block using its hash value. Change in any one block affects all\
    \ the successive blocks. Cryptographically altering all the further blocks is\
    \ impossible.\n\n**Increased Capacity:** As there are many nodes/computers working\
    \ together, blockchain offers greater power than the centralized system.\n\n**Anonymity:**\
    \ In blockchain, the account numbers of individuals are public but it does not\
    \ expose the private, identity details such as name of the person involved in\
    \ the transaction. From the account number, other personal details of the individuals\
    \ cannot be fetched as the account numbers are exposed only after hashed.\n\n\
    **Consensus:** Each network participant keeps a copy of the entire blockchain.\
    \ Consensus validates and verifies every new transaction. It is generally validates\
    \ and verifies every new transaction.\n\n**Transparency:** Everyone who joined\
    \ in network can view.\n\n**Provenance:** In order to establish trust and authenticity,\
    \ the history of transactions is recorded. \n\n## 5.6 Benefits and Limitations\
    \ of Blockchain\n\n### Benefits\n- Nobody has the central authority. Verification\
    \ and validation improves accuracy.\n- Modifying the assets is practically impossible\
    \ as the degree of decentralization makes it.\n- All the transactions are open\
    \ to network entity. This ensures secured, private, and efficient.\n- Though blockchain\
    \ is slow depending on the network, it eliminates third-party verification.\n\
    - It is well suited for a network where users don’t trust other.\n\n### Limitations\n\
    - The `PoW` consensus in `Bitcoin` takes around 10 minutes to add a block. Solution\
    \ for this concern is under research for years. Speed ineffectiveness is the major\
    \ concern with the blockchain network.\n- It takes high computational power to\
    \ validate each transaction.\n\n## 5.7 Types of Blockchain\n\nThere are two primary\
    \ types in blockchain, namely, private blockchain and public blockchain. Later,\
    \ different variations of blockchain have arrived. Irrespective of the types,\
    \ blockchain network has the following common properties:\n\n- It is a `P2P` network.\n\
    - The transactions are updated in distributed ledger.\n- Every node in a blockchain\
    \ network has a copy of shared and distributed ledger.\n- Each node validates\
    \ and verifies the transactions that take place in network through consensus and\
    \ various cryptographic mechanisms.\n\nDegree of Decentralization is a key attribute\
    \ based on which the categorization of the blockchain is determined. The most\
    \ important threats in totally centralized system are the trust among entities\
    \ and single point of failure. Decentralization and various metrics in blockchain\
    \ help establish trust among parties and avoid single point of failure. Blockchain\
    \ configuration varies across different categories as shown in [Fig. 5.7](#ch05.xhtml#fig5_7).\n\
    \n![Figure 5.7 Types of blockchain.](images/fig5_7.jpg)\n\n[Figure 5.7 Types of\
    \ blockchain.](#ch05.xhtml#fg5_7)\n\n**Private Blockchain:** Private blockchain\
    \ restricts the actors joining the network as it is permissioned network. It preserves\
    \ privacy. The network is more energy efficient compared with public blockchain\
    \ as it has its own private consensus mechanisms that work faster. These are less\
    \ volatile networks. It is well suited for any particular organization. Transaction\
    \ throughput is higher than public blockchain. All the members who are present\
    \ in the network are authenticated or pre-approved to join in. So, less energy-intensive\
    \ consensus algorithms like simple voting mechanisms is also preferred here. Private\
    \ Blockchain is also referred to as partially decentralized network since it is\
    \ controlled by organization to some extent.\n"
