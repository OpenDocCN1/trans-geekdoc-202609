- fmt: 'The core challenge involved is hardening the security system by safeguarding
    the data against intruders/attackers than abandoning. Security-based companies
    are tailoring security solutions abiding the regulations to meet the growing market
    demands to minimize the organization risks like disclosure, tampering, destruction,
    corruption, and theft. Many edge-based systems leverage conventional operating
    systems and host databases. Data confidentiality, integrity, secure data search,
    authentication, access control, and privacy-preserving are the wide spectrum of
    data security research architecture of edge computing as shown in [Fig. 4.1](#ch04.xhtml#fig4_1).
    However, it is liable to attacks if classical cryptographic mechanisms are employed.
    To utilize the full spectrum of security measures, modern crypto mechanisms must
    be deployed. This chapter is limited to data confidentiality, authentication,
    and privacy-preserving approaches employed in edge computing. Under data confidentiality,
    the following schemes are likely to be discussed with its definition, illustration,
    working nature, and application \[[1](#ch04.xhtml#ref4_1)\].


    *   Homomorphic encryption

    *   Identity-based encryption (`IBE`)

    *   Attribute-based encryption

    *   Proxy re-encryption

    *   Functional encryption

    *   Honey encryption

    *   Searchable encryption


    ![Figure 4.1 Data security research architecture.](images/fig4_1.jpg)


    [Figure 4.1 Data security research architecture.](#ch04.xhtml#fg4_1)


    With respect to authentication, the following schemes with its working principle
    will be discussed:


    *   Single-domain

    *   Cross-domain

    *   Handover authentication


    In the topic of privacy-preserving, the given schemes are discussed with its nature
    of working.


    *   Data privacy

    *   Location privacy

    *   Identity privacy


    ## 4.2 Data Confidentiality


    Manifold companies continue to combat invasive attacks against data. To manage
    and control the data theft/breaches in edge environment, appropriate data confidentiality
    schemes must be applied as the devices are data consumers and producers. These
    schemes must safeguard sensitive data using any encryption schemes. The conventional
    encryption schemes like `AES`/`DES`/`RSA`/`ECC` may be employed to the edge environment.
    However, accessing or processing ciphertext data for any analysis/query is quite
    low and makes it impossible to real adaptation. Manifold researches are carried
    out in recent years for secure data processing in edge framework. To assure confidentiality
    during outsourcing of data or processing the data either in edge/cloud, secure
    and reliable encryption techniques must be used. Efficient secure processing schemes
    are as follows:


    1.  Identity-based encryption

    2.  Attribute-based encryption

    3.  Proxy re-encryption

    4.  Functional encryption

    5.  Honey encryption

    6.  Searchable encryption

    7.  Homomorphic encryption


    ### 4.2.1 Identity-Based Encryption


    Shamir \[[2](#ch04.xhtml#ref4_2)\] proposed an identity-based encryption scheme
    for certificate management initially. Any parties involved in the system can collaborate
    securely using this scheme by verifying one another’s signatures without any negotiation
    of private/public keys. Public key infrastructure (`PKI`) or any third-party involvement
    is not essential for this scheme for its execution. Rather than using `PKI`, with
    this scheme, a key generator is used for generating the random number (seed).
    During encryption, when `A` sends mail to `B`, mail will be encrypted by the mail
    identifier of `B` and this acts as the public key for the transmission. On receiving
    the mail, `B` verifies himself/herself and receives a private key from the public
    key generator. With the aid of private key, mail will be decrypted as shown in
    [Fig. 4.2](#ch04.xhtml#fig4_2).


    ![Figure 4.2 Identity-based encryption.](images/fig4_2.jpg)


    [Figure 4.2 Identity-based encryption.](#ch04.xhtml#fg4_2)


    To solve problems of identity in multi-party environment, enhanced `IBE` proposed
    \[[3](#ch04.xhtml#ref4_3)\] based on discrete logarithm problem that is considered
    to be NP-hard to strengthen the environment. Using bilinear maps, Boneh and Franklin
    \[[4](#ch04.xhtml#ref4_4)\] presented a scheme in 2003 using formal threshold
    cryptography.


    ### 4.2.2 Attribute-Based Encryption


    It is a kind of encryption where secret key and ciphertext are based upon a set
    of attributes and thus intruders/attackers/outsiders are impossible to hold the
    ownership of the data. With the facilitation of trusted authority, attribute keys
    are published between the parties and used whenever necessary to decrypt. Decryption
    is based on the shared set of attributes after proper verification by trusted
    authority. It is primarily used for log encryption. Sahai and Waters \[[5](#ch04.xhtml#ref4_5)\]
    proposed a novel reuse sort of attribute-based encryption scheme. Key-based or
    ciphertext-policy-based attribute-based encryption is in use based on threshold
    value. [Fig. 4.3](#ch04.xhtml#fig4_3) showcases the working of attribute-based
    encryption between the data owner and the users.


    ![Figure 4.3 Attribute-based encryption.](images/fig4_3.jpg)


    [Figure 4.3 Attribute-based encryption.](#ch04.xhtml#fg4_3)


    ### 4.2.3 Proxy Re-Encryption


    Proxy re-encryption is a protocol devised by Blaze et al. \[[6](#ch04.xhtml#ref4_6)\],
    used to transform ciphertext of one key into ciphertexts for another with the
    help of a proxy. To put it in simple words, this method permits to convert a public
    key into another without having permission of ones’ private key. This is possible
    using a key termed as re-encryption key and assures that the underlying plaintext/message
    is not disclosed. Due to this fascinating property, this is a widely adopted method
    in multi-user document/sharing scenarios. Third-party is involved with this method
    to re-encrypt the message/document to send to other party.


    [Fig. 4.4](#ch04.xhtml#fig4_4) portrays the working principle of proxy re-encryption.
    Although this approach is proven to be strong under discrete logarithm problem
    that is of NP-hard, it still has few issues to be resolved. A major threat to
    this approach is, if proxy is an insider, there is a possibility to reverse process
    the information without the consent of user `A` or `B`. Similarly, both user `A`
    and proxy may act as insiders to process the information reversibly without the
    permission of user. To resolve these issues, enhanced protocols were devised by
    many authors as their research work \[1\].


    ![Figure 4.4 Proxy re-encryption.](images/fig4_4.jpg)


    [Figure 4.4 Proxy re-encryption.](#ch04.xhtml#fg4_4)


    ### 4.2.4 Functional Encryption


    A specific function is utilized with this approach to encrypt the data to send
    to other parties. Generally, it is a black-box function where the users can view
    the output without having any knowledge of the generated input. It enables the
    highest form of security and reliability to the edge environment. A lot of researches
    are ongoing in this area to design a robust function to avoid hazardous brute-force
    attacks. The security of this method depends on the function designed and it is
    a general form for attribute-based encryption and identity-based encryption. It
    was initially proposed by Amit et al. in 2005 and improved by Brent in 2010 \[[7](#ch04.xhtml#ref4_7)\].
    In recent years, improvement is performed depth-wise on learning with errors assumption.
    Solving this approach is as hard as solving quantum-based problems.


    ### 4.2.5 Honey Encryption'
