  trans: '


    数据隐私，也称为信息隐私，用于保护数据的私密性，确保非法用户无法获得数据访问权限。在收集、共享和使用数据时，必须采用适当且具有合理的机制，特别是在处理个人数据时。任何部门都有责任提供以下内容：


    *   收集数据时的妥当同意（特别是针对个人）

    *   数据质量保证

    *   数据收集的清晰声明/协议

    *   数据收集的目的

    *   数据保护保障

    *   政策和流程的透明度

    *   问责声明


    为了设计并部署了多种隐私保护技术以保护遵守法规的个人数据，例如 `K-anonymity`（K-匿名性）、`L-diversity`（L-多样性）、`T-closeness`（T-接近性）、随机化和加密技术。概率公钥加密被认为是高效保护数据隐私的技术方法之一。提出了一种结合基于排名关键词搜索的改进方法。此类方案通过提供高水平的可扩展性，更适用于边缘云环境。


    ### 4.4.2 地位置隐私


    位置隐私是个人决定何时以及出于什么目的与他人共享信息的权利。在边缘环境中，维护用户位置的隐私保护是一项基础流程。如果不采取适当措施，攻击者将进行各种攻击，例如：


    *   用户画像

    *   政治/宗教歧视

    *   拒绝服务

    *   物理攻击

    *   非法广告


    在受限检索模式下构建具有位置隐私的安全定位协议，是保护位置隐私的极优方案之一。目前存在多种方法，通过虚拟位置更新、分布式缓存代理服务器、为攻击者创建伪造位置以及通过确保高水平可扩展性的基于混淆的技术来保护位置隐私。


    ### 4.4.3 身份隐私


    身份/用户隐私是在不牺牲质量的前提下保护用户隐私。这是人们必须面对的最高挑战之一，因为许多企业正倾向于追踪终端消费者的行为并进行市场营销。近期，大量经纪人代理涌现，他们用于整合并出售个人的个人信息，卖给竞争公司/政府机构。维护身份隐私的最佳方法是限制画像生成。动态凭证生成、跨域可信第三方管理认证被认为是维护用户身份隐私的最佳方法。大多数协议都支持自组织（ad
    hoc）移动环境，最近的研究已进入网雾-移动计算环境。


    ## 4.5 基于边缘的攻击检测与防御


    边缘计算涉及的主要攻击类挑战包括隐私泄露、拒绝服务攻击、攻击者的未经授权访问以及数据篡改。为了在满足机密性和隐私属性的同时高效处理海量数据并提供相互认证，传统方案不再适用。获取访问权的外部或内部攻击者可能会滥用分配的权限。通过应用跨域认证和接管认证等新型认证机制可以消除未经授权的访问。通过在网络边缘部署服务器，可以防止传统的拒绝服务及其相关攻击。另一个重大挑战是针对边缘基础设施的数据篡改和物理攻击。必须对边缘基础设施提供严格的物理保护，为了规避数据篡改，在
    `Section 4.2` 中讨论了具有核心优势的现代机密性方案。为了安全地将一个公钥转换为另一个密钥，实践中使用了基于代理的第三方访问方法，即 `proxy
    re-encryption`（代理重加密）。同样，在多方环境中安全地收发消息，倾向于使用 `attribute-based encryption`（基于属性的加密）。使用
    `honey encryption`（蜜罐加密）可以避免所有虚假的资源访问以及有害的暴力攻击/破解。此外，`homomorphic encryption`（同态加密）通过对加密数据而非明文执行各种操作，用于避免边缘环境中的数据泄露和侵入性攻击。隐私泄露被认为是边缘系统的另一个关键威胁。为了检测隐私泄露，必须保持全面的监控，并采用与基于位置隐私方案类似的稳健现代隐私保护机制。因此，通过在边缘计算系统中应用上述方法，可以在安全可靠的情况下进行多源数据处理，而不会损害传输速度。它还提供了丰富的用户体验和移动性支持。


    ## 4.6 结论与未来方向


    在本章中，讨论了边缘计算中的数据存储和图示。`homomorphic encryption`（同态加密）的功能、属性和应用进行了详细阐述。边缘计算的未来领域在
    `Section 4.5` 中进行了分析。边缘计算框架中的数据安全和隐私问题在未来研究中得到了阐明。这种加密方案的处理速度和准确性可以在多源环境中得到增强。


