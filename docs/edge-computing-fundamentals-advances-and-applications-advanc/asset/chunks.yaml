    Hydra is a service oriented middleware. It operates between the applications and
    operating system layers. The middleware provides a web service interface to interact
    with the physical devices like sensors, actuators, and transducers transparent
    to their underlying communication technologies like `Bluetooth`, `RF`, `ZigBee`,
    `RFID`, `WiFi`, etc. Semantic description of these devices is provided through
    `OWL`, `OWL –S`. Each device is considered as a service. The service is exposed
    through interfaces. User can interact with the devices through these interfaces.
    Hence the details of the devices including their communication mechanism are abstracted
    from the users through these interfaces. Hence all the functional components that
    include protocol, device, syntactic and semantic interoperability are provided
    by Hydra. The various layers include:


    *   Network layer to manage communications among heterogeneous devices using various
    communication protocols. `SOAP` tunneling can be used.

    *   Security layer provides various security services like authentication and
    authorization.

    *   Semantic services layer provides the context and policy management services.

    *   Services layer offers services to manage ontology, events, devices, orchestration
    of jobs, storage, and diagnostics.


    ### 2.6.1.2 Aura


    Aura aims to provide high-level APIs to interact with various heterogeneous devices.
    AURA does not provide interface protocol layer and device abstraction layer. It
    provides application abstraction as well as context management layers. Hence all
    the functional components that include protocol, device, syntactic and semantic
    interoperability are provided by AURA. Data analysis capability is also provided.
    The components of AURA include:


    *   Task Manager: Provides a platform-independent abstract service for end-users
    tasks. The end-user can thus execute the task in different environments. For example
    to edit a document, AURA can use editors available in the operating environment-for
    windows `Notepad` and for Unix `Emacs` can be used.

    *   Service Supplier: composes the tasks to form an end-user''s request. It maps
    the abstract service descriptions to application-specific settings. An abstract
    text editor interface may be mapped onto `Notepad` if Windows environment is used
    or `Emacs` if Unix environment is used.

    *   Context Observer: gathers information about physical context. Different devices
    have different sensing capabilities. Based on this the context observer gathers
    information for `Task` and `Environment` managers.

    *   Environment Manager: is knowledgeable of the services provided by the suppliers
    and their deployment. Based on this knowledge, it maps suitable services to the
    context observer component.


    ### 2.6.1.3 TinyDB


    TinyDB middleware enables users to interact with the devices without knowing its
    specifications. For this purpose, TinyDB provides Domain Specific Language (`DSL`)
    for end-users to interact with devices. `DSL` is a query language that supports
    selection, join, projection, and aggregation operations. It allows an end-user
    to get information about the time, place, type, and method of sampling in an embedded
    sensing environment.


    ### 2.6.1.4 FiWare


    Context information is collected by FiWare from sensors using `REST` APIs. Context
    broker collects this context information and provides facilities to store and
    query the same. FiWare middleware works on publish-subscribe architecture. Consumers
    can subscribe to the information published by the brokers. Context adapters act
    as data transformers for the subscriber. Applications use APIs to query, analyze
    and mine context information collected by the context broker. Visualization facilities
    are also provided.


