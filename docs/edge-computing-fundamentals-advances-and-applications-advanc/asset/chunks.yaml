    Honey encryption is a technique that is used to attract attackers/insiders by
    providing a captivating look, although it is a wrong plaintext obtained from decrypting
    the ciphertext. Honey encryption takes its root from one-time pad technique and
    the term “Honey” refers to fake/false resource. This technique is bounded with
    high probability and with a quite reasonable statistical model. It has been created
    for safeguarding the passwords against harmful brute-force attacks/breaches especially
    in web services related to financial transaction. It is closely related with format-preserving
    encryption (FPE) and format-transforming encryption (FTE) [[8](#ch04.xhtml#ref4_8)].
    A simple representation of hone encryption is shown in [Fig. 4.5](#ch04.xhtml#fig4_5).


    ![Figure 4.5 Honey encryption.](images/fig4_5.jpg)


    [Figure 4.5 Honey encryption.](#ch04.xhtml#fg4_5)


    ## 4.2.6 Searchable Encryption


    Searching on encrypted data in an efficient manner is the primitive of searchable
    encryption. Searching and querying upon encrypted data receives recent attention
    toward the researchers’ community that guarantees data confidentiality. This is
    considered an effective solution to reduce computational overhead for searching
    a word in encrypted database. It assures data privacy and availability to the
    collaborating parties. It is categorized as searchable symmetric encryption and
    searchable asymmetric encryption.


    [Fig. 4.6](#ch04.xhtml#fig4_6) shows the working nature of the searchable encryption
    scheme. Data in encrypted format are sent to the server. If the user/data owner
    intended to perform search operation upon the stored contents, based on the keyword
    search operation is performed and returned to the user with the help of trapdoor
    function. Trapdoor is a function used to retrieve the keywords that are linked
    with the users’ secret key. It is a well-defined routine that does not reveal
    any information related to keywords. The security of these schemes relies on Discrete
    Diffie–Hellman (DDH) problem or Bilinear Diffie–Hellman (BDH) problem [[9](#ch04.xhtml#ref4_9)].
    In searchable symmetric encryption, the same key is used for encryption, decryption,
    and trapdoor generation, whereas in searchable asymmetric encryption, different
    keys are employed. As a prerequisite, a bag of tags or keywords must be created
    to identify the message for a particular search.


    ![Figure 4.6 Searchable encryption.](images/fig4_6.jpg)


    [Figure 4.6 Searchable encryption.](#ch04.xhtml#fg4_6)


    ## 4.2.7 Homomorphic Encryption


    To enable operation on ciphertext directly with any number of arbitrary calculations,
    homomorphic encryption is formulated. It is well known as privacy homomorphism
    introduced by Rivest in 1978 that allows partial computations. In general, it
    converts data from one set to another by conserving the associations between them.
    The word “homomorphic” stands for “same structure”. For instance, if we add two
    numbers in ciphertext and decrypt, the output must be equivalent to the output
    obtained by performing the same operation in plaintext. As the operations are
    carried out upon encrypted data, the computational overhead is reduced drastically
    and that is considered as the major benefit of homomorphic encryption. This guarantees
    transparency, efficient data processing, data retrieval, and secure data transmission
    with minimal timeframe even in an untrusted environment. It eliminates data breaches/attacks
    in a much wider sense. Most of the notable schemes represent the values as integers
    and use addition multiplication as the basic operations. The first plausible scheme
    was proposed by Craig Gentry in 2009 as an outcome of his Ph.D. dissertation.
    The thesis creates a new dimension for data processing and many researchers started
    to implement new schemes and few enhanced/optimized Gentry’s scheme with formal
    proof of security [[10](#ch04.xhtml#ref4_10)]. Simple and secure homomorphic encryption
    schemes for healthcare applications are proposed by Anitha Kumari et al. [[11](#ch04.xhtml#ref4_11)]
    [[16](#ch04.xhtml#ref4_16)].


    Common applications of homomorphic encryption are as follows:


    * Secure data storage

    * Data encryption

    * Privacy-preserving

    * Searching in encrypted data

    * Secure data communication between multi-parties

    * Supporting data analytics in encrypted data

    * Querying data and retrieval


    ### 4.2.7.1 Types of Homomorphic Encryption


    A general working of homomorphic encryption is given in [Fig. 4.7](#ch04.xhtml#fig4_7).
    There exist three types of homomorphic encryption. The difference among the types
    is based on the type and number of operations carried out in the ciphertext. The
    categories are as follows:


    * Partially homomorphic encryption

    * Somewhat homomorphic encryption

    * Fully homomorphic encryption


    ![Figure 4.7 Working of homomorphic encryption.](images/fig4_7.jpg)


    [Figure 4.7 Working of homomorphic encryption.](#ch04.xhtml#fg4_7)


    #### Partially Homomorphic Encryption (PHE) and Somewhat Homomorphic Encryption
    (SHE)


    Partially homomorphic encryption (PHE) supports one operative function, either
    addition or multiplication to get executed upon encrypted data unlimited number
    of times. Somewhat homomorphic encryption (SHE) supports addition or multiplication
    or both to execute limited number of times. RSA, ElGamal, Goldwasser–Micali, Paillier,
    and Boneh–Goh–Nissim are well-known PHE/SHE cryptosystems for decades. Fully homomorphic
    encryption (FHE) supports both the operations, addition and multiplication, to
    execute unlimited number of times. In this chapter, FHE is considered and substantiated.


    #### Fully Homomorphic Encryption (FHE)


    FHE allows unlimited number of operations with unlimited number of times. The
    circuit of FHE is predetermined and unbounded. This paves the way to explore more
    and receives attention from researchers in the current decade. It permits computation
    over encrypted data unlimitedly, both on-premises (edge device connected with
    smart devices) and off-premise data centers (cloud server). Several algorithms
    were designed and implemented to improve the accuracy and efficiency of FHE. Dijk
    et al. proposed an asymmetric encryption scheme based on computation over real
    integers by incorporating bootstrapping technique to reduce noise [[12](#ch04.xhtml#ref4_12)].
    Another significant contribution in FHE is NTRU scheme [[13](#ch04.xhtml#ref4_13)].
    In NTRU encryption scheme, arbitrary operations are based on the objects that
    are located in a truncated polynomial ring at the degree of N-1. A few recent
    works on FHE based on applications are listed as follows:


    * An efficient algebraic homomorphic encryption scheme based on the Carmichael’s
    theorem was proposed that works best for the integers. The scheme is used in applications
    such as electronic voting and multiparty computation. The operations involved
    in the Carmichael’s encryption scheme are modular arithmetic in nature.

    * A secured aerial photography using homomorphic encryption by considering the
    problem as the agents to encrypt the images and to upload it in the cloud server
    that is untrusted.

    * Few HE schemes were proposed for the problems such as automated and real-time
    monitoring, automated bill processing, detection of energy loss, early warning
    of blackouts, fast detection of disturbances in energy supply, real-time energy
    planning, and pricing.

    * Models like Cox Proportional Hazard Model and Logistic Regression Model are
    proposed for predictive analysis in health care. It is a standard way of encrypting
    data bitwise. The functions of these regression models are approximated by polynomial
    expressions in integer values. The advantage of this approach is that a single
    ciphertext carries numerous information than a single bit of plaintext. The limitation
    is that it restricts the possible operations to arithmetic circuits in the polynomials.

