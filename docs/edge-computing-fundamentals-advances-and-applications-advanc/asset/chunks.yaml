    - 具有更好的灵活性和扩展性，因为可以随需添加新的基础设施，而不会影响正在提供的服务。

    - 资源利用率更高，因为相同的资源在许多用户之间进行虚拟化共享。

    - 数据备份和灾难恢复由服务提供商自动处理。

    - 用户可以使用任何访问技术，随时随地在任何地方使用云资源。

    - 云资源具有高可用性，当现有实例故障时，可以启动另一个实例。


    云计算中面临的一些挑战包括：


    - 必须具备可靠的互联网连接以访问资源。

    - 客户数据的安全由服务提供商管理。

    - 对云服务提供商/供应商的依赖性。


    ## 1.9 其他计算范式


    ### 1.9.1 无处计算 (Ubiquitous Computing)


    本节比较了无处计算、泛在计算和移动计算。桌面计算使用户可以使用单个台电脑执行计算功能。在这里，一台台电脑由一个用户使用。无处计算进入了许多用户使用不可见资源的时代。这是一个多多的关系。无处计算的意思是“无处不在”。云是一种无处不在的环境，因为用户可以通过互联网和各种访问技术访问托管在云中的远程资源。尽管资源不移动，但可以通过互联网从任何位置访问这些资源。因此，移动性很高。泛在计算环境将计算嵌入到如物联网等各种设备中。与移动系统相比，这些资源要小得多。这类系统的移动性较低。它们用于智能家居等应用。移动计算将计算嵌入用户携带的设备中。移动计算涉及移动通信、移动硬件和移动软件。这类系统的移动性很高。使用手机进行计算就属于这一类。无处计算的主要特征是：


    - 无缝访问远程信息资源并具有具有容错性的通信

    - 与泛在计算和移动计算相比，用户并不拥有资源，因此对远程资源没有控制权。

    - 用户可以使用合适的访问和通信技术随时、随地访问资源。


    无处计算的三个局限性包括：


    - 网络带宽和网络覆盖的局限性。

    - 电池供电设备受能量限制。

    - 使用各种访问设备和公共网络的安全风险。

    - 移动和泛在设备的输入/输出屏幕尺寸。


    ### 1.9.2 丛计算 (Jungle Computing)


    传统的高性能计算受限于超级计算机。集群、网格和云计算范式的出现也促进了高性能计算，因为任务可以在各种工作节点上并行执行。超级计算、网格和云等各种高性能计算基础设施可以通过巨大的高速通信网络连接起来。这种异构系统的组合形成了“计算丛林”（图
    1.19）。当用户提交应用程序时，中间件会识别哪种 HiPC 基础设施最佳。然后它使用合适的工具在基础设施中编译并部署应用程序。通信网络确保了各种 HiPC
    基础设施与用户之间的通信。


    ![图 1.19 丛计算。](img/fig1_19.jpg)


    图 1.19 丛计算。


    任务复杂度决定了计算环境。因此，可以根据任务需求选择合适的高性能计算环境。丛计算的一些特征包括：


    - 资源独立性和异构性：资源在存储和处理能力方面存在显著差异。因此，需要中间件来向用户隐藏资源的细节。

    - 中间件：每个 HiPC 系统都有自己的中间件。计算丛林的中间件确保了它们之间的互操作性。

    - 健壮的连接确保了与丛林中 HiPC 系统的可靠通信。

    - 唯一的资源标识解决了资源冲突。

    - 可伸变性提供了适应资源变化的灵活性。

    - 容错性用于处理系统故障并恢复应用程序状态。

    - 从串行代码到并行代码的自动转换。这一特性消除了对并行编程范式专家的需求。

    - 中间件还将将遗留代码与丛林软件集成。


    丛计算的主要局限性包括：


    - 属于不同管理域的资源管理。

    - 各种高性能计算系统的互连困难。

    - 当随机选择计算环境时，生成的编译器和可执行应用程序代码等系统软件将面临互操作性问题。


    ### 1.9.3 雾计算 (Fog Computing)


    云计算的主要问题是所有数据都必须传输到集中计算机集群以执行计算。这涉及到网络延迟。我们可能都知道用于云环境中处理大数据的 `Hadoop` 框架。`Hadoop`
    的基本概念是将计算移动到位于特定数据节点的数据。通过这样做可以最大限度地减少数据移动并降低网络延迟。类似的情况在雾计算中也会发生。在这里，处理和存储资源通常位于网络边缘，靠近生成信息的设备。因此，雾计算更适用于智能城市、医疗保健和增强现实等对延迟敏感的应用。雾计算是一个虚拟化平台，其中处理器、存储和网络等计算资源放置在云的边缘，而不是为云存储和处理建立通信通道。通常，处理是在用户和云之间完成的。云可以处理非实时应用程序以及数据的长期存储。


    雾计算的一些特征 \[10\]


    - 常用数据和计算靠近终端用户。

    - 区域感知处理降低了延迟。

    - 地理分布式的处理确保了扩展性和速度。

    - 促进使用传感器网络收集数据。

    - 支持基于位置的移动。

    - 促进在网络边缘进行实时数据处理。

    - 支持异构资源及其之间的互操作性。

    - 由于雾服务器直接连接用户，可以根据用户进行优化。

    - 雾局部化和云全球化通过在边缘过滤数据并进行全球化分析或局部分析来实现更好的分析。


    其他与雾计算高度相关的范式见（图 1.20）：


    - 移动云计算 (MCC)：移动设备受资源限制，因此可能无法执行某些服务。因此在网络边缘使用名为 `cloudlet` 的轻量级云服务器来克服移动设备的资源限制。主要的限制是到边缘服务器的可靠低延迟网络。

    - 移动边缘计算 (MEC)：移动边缘计算 (MEC) 服务器位于蜂窝网络的基站。`MEC` 服务器提供计算和存储设施。用户请求被转发到 `MEC` 进行处理。如果
    `MEC` 无法处理请求，则将其转发到云服务器。


