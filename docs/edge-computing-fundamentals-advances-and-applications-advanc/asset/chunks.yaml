    ## 6.4 结论与开放性研究挑战


    边缘计算推动了多个领域的用例，包括自动驾驶汽车、智能城市、工业自动化、游戏、内容交付、金融领域和医疗领域。本章考虑了来自医疗领域的三个案例研究，并详细阐述了这些案例，确保了数据的正确获取、安全存储和动态板载处理。为了确保存储的安全，应用了同态加密方案，并在加密数据上进行分析，以保护框架免受侵入性攻击向量的影响。案例研究阐明了边缘网关/服务器对于实时应用的安全计算和处理能力。边缘计算结合先进分析算法，支持各个部门的实时模型和控制。然而，研究人员/开发者面临的开放性挑战是在启用边缘计算系统的同时，理解应用的安全和处理需求，因为这些需求不同行业之间存在差异。


    ## 参考文献


    1. Tseng, M., Edmunds, T., & Canaran, L. (2018). 工业物联网中的边缘计算简介：工业互联网联盟白皮书。边缘计算任务组。


    2. Whitaker, B. E (2018). 云-边缘计算——超越数据中心。OpenStack 白皮书，1–8。


    3. Anitha Kumari, K., Ananyaa, M., Keshini, P. S., & Indusha, M. (2020). 在边缘计算系统中使用
    LDL 预测心脏病。在*第 26 届（虚拟）高级计算与通信国际年度会议 (ADCOM 2020)* 中，印度西尔尔查尔，2020 年 12 月 16–18
    日。


    4. Gentry, C., & Halevi, S. (2011). 实现 gentry 的全同态加密方案。在*密码学技术理论与应用国际年度会议 (EUROCRYPT
