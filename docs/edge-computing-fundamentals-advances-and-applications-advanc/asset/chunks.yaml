    \n# 3 Edge Analytics\n\nDOI: [10.1201/9781003230946-3](https://doi.org/10.1201/9781003230946-3)\n\
    \n## 3.1 Types of Data\n\nIn statistics, the data are classified into two categories:\
    \ quantitative and qualitative as represented in [Fig. 3.1](#ch03.xhtml#fig3_1).\
    \ The quantitative data is also called as numerical data that deals with numbers\
    \ and things that can be measured. For example, height, weight, age, price, temperature,\
    \ humidity, etc. It is then sub-classified into discrete and continuous data.\
    \ \n\nDiscrete information holds only finite number of possible values where it\
    \ is counted using the whole numbers. For example, number of persons standing\
    \ in the queue (i.e. 26 persons). The continuous information holds infinite number\
    \ of probable values that lie in a specific range. For example, weight of the\
    \ persons standing in the queue (i.e. 49.5 kilograms).\n\n![Figure 3.1 Types of\
    \ data.](images/fig3_2.jpg)\n\n[Figure 3.1 Types of data.](#ch03.xhtml#fg3_1)\n\
    \nThe qualitative data is also called as categorical data that are not numerical\
    \ data rather it is defined using natural language specifications. For example,\
    \ persons gender, place of birth, language, occupation, etc. In some cases, it\
    \ also takes on numerical values (i.e. 1 for true and 0 for false) but it does\
    \ not have mathematical meaning to it. \n\nThe qualitative data is then sub-classified\
    \ into nominal and ordinal data where nominal values represent discrete units\
    \ and have no quantitative order among the values. For example, the languages\
    \ learned by a student. (i.e. English, Tamil, Hindi, French, German). The ordinal\
    \ data deals with discrete and ordered units. For example, participant feedback\
    \ on the workshop attended (i.e. Excellent-4, Good-3, Satisfactory-2, Not satisfactory-1).\n\
    \nType of the data is significant because data analysis for continuous values\
    \ works differently than categorical values. If it is not handled with care it\
    \ will result in a wrong analysis. Thus understanding the nature of data helps\
    \ in choosing the correct data analytic method for analysis.\n\n## 3.2 Data Analytics\n\
    \nThe data analytics implies the process of exploring datasets to bring implications\
    \ about the information they hold. Data analytic techniques take raw data and\
    \ expose its patterns to mine knowledge out of it. Further, the analysis is used\
    \ to produce graphical reports and dashboards as an end result. Data analytics\
    \ handles data to generate the pattern and produce reports for analysis ([Fig.\
    \ 3.2](#ch03.xhtml#fig3_2)).\n\n![Figure 3.2 Flow of data analytics.](images/fig3_1.jpg)\n\
    \n[Figure 3.2 Flow of data analytics.](#ch03.xhtml#fg3_2)\n\n## 3.3 Goals of Data\
    \ Analytics\n\nData analytics adds a huge significance to diverse domains and\
    \ businesses, where it helps uncover the end result of almost all complex queries\
    \ from a huge data set, also it can predict the future which would help make business\
    \ decisions more accurately at appropriate time.\n\nData analytics adds a huge\
    \ significance to diverse domains and businesses, where it helps uncover the end\
    \ result of almost all complex queries from a huge data set, also it can predict\
    \ the future which would help make business decisions more accurately at appropriate\
    \ time.\n\nData analytics adds a huge significance to diverse domains and businesses,\
    \ where it helps uncover the end result of almost all complex queries from a huge\
    \ data set, also it can predict the future which would help make business decisions\
    \ more accurately at appropriate time.\n\nData analytics adds a huge significance\
    \ to diverse domains and businesses, where it helps uncover the end result of\
    \ almost all complex queries from a huge data set, also it can predict the future\
    \ which would help make business decisions more accurately at appropriate time.\n\
    \nData analytics adds a huge significance to diverse domains and businesses, where\
    \ it helps uncover the end result of almost all complex queries from a huge data\
    \ set, also it can predict the future which would help make business decisions\
    \ more accurately at appropriate time.\n\n## 3.4 Domains Benefiting from Big Data\n\
    \nThe data analysis plays a vital role in various domains for implementing applications\
    \ [2](#ch03.xhtml#ref3_2). The domains include:\n\n* Healthcare\n* Science\n*\
    \ E-commerce\n* Machine performance\n* Customer and personal insight\n* Image\
    \ processing\n* Natural language processing\n* Smart city applications\n* Smart\
    \ home\n* Banking, Insurance, and Finance\n* Sports\n* Automotive\n* Risk management\n\
    * Marketing and advertisement\n* Disaster forecasting\n* Gaming\n* Logistics\n\
    * Robotics\n* Security\n\n## 3.5 Real-Time Applications of Data Analytics\n\n\
    Some of the applications of data analytics are as follows:\n\n* Predicting the\
    \ price of a mobile phone based on its specifications such as RAM, screen size,\
    \ battery capacity, processor, camera, operating system, brand, weight, color.\n\
    * Recommending movies based on the similarity of the ones that have been watched\
    \ by the users.\n* Analyzing the customer opinion on the product.\n* Diagnosing\
    \ the disease of a patient by analyzing the symptoms.\n\n## 3.6 Phases of Data\
    \ Analytics\n\nThe general phases in data analytics are:\n\n* Data collection\
    \ and pre-processing\n* Machine learning-model building\n* Performance evaluation\n\
    \n### 3.6.1 Data Collection and Pre-Processing\n\nAt the initial stage of data\
    \ analytics life cycle as shown in [Fig. 3.3](#ch03.xhtml#fig3_3), stakeholders\
    \ analyze the business trends and domain of the project they would start to build\
    \ a hypothesis for resolving the business problems. They will start observing\
    \ the dataset for identifying key variables and categorizing the values in the\
    \ dataset. When the nature of the data is understood, stakeholder prepares the\
    \ data by removing duplicates, replacing missing values and handling noises in\
    \ the dataset. This phase helps cleanse the data as per the data analytics requirement\
    \ [6](#ch03.xhtml#ref3_6).\n\n![Figure 3.3 Data analytics life cycle.](images/fig3_3.jpg)\n\
    \n[Figure 3.3 Data analytics life cycle.](#ch03.xhtml#fg3_3)\n\n### 3.6.2 Machine\
    \ Learning-Model Building\n\nThe team with stakeholders, after pre-processing\
    \ the data, starts building the learning model after identifying the techniques\
    \ and methods predominantly for dealing with the critical business crisis. The\
    \ models are nothing but a mix of machine learning algorithms, statistical and\
    \ mathematical computations performed on the data to attain the expected goal.\
    \ General machine learning procedure deals with the following:\n\n* Labeled data:\
    \ Data that holds a label/tag which represents its class/category.\n* Unlabeled\
    \ data: Data does not hold a label/tag to represent its class/category.\n* Features:\
    \ These are the columns in the dataset/table.\n* Training: The dataset is divided\
    \ into training and testing sets in the ratio of user’s choice. (i.e. 70% for\
    \ training and 30% for testing). Model is trained with the extracted features\
    \ of training dataset.\n"
