    -   **RFID**: 射频识别利用无线电磁场来识别物体。它用于生产线、识别系统和收费站。它可以被 `NFC` 替代。

    -   **Ethernet（以太网）**: 是一种用于 `LAN`、`MAN`、`WAN` 的有线计算机网络技术。以太网的一个分支可以连接高达 1024
    个节点。它提供数据链路和物理层服务。

    -   **Z-Wave**: 工作在 1 GHz 以下的的 RF 频段。它用于低延迟、低功耗应用，特别是家居自动化系统。

    -   **Thread**: 这是一种基于 `LowPAN` 的 IPv6 协议。它补充了家庭自动化中的 `Wi-Fi` 技术。它是一种基于 `IEEE
    802.15.4` 的网格协议。它工作在 2.4 GHz 频率，覆盖范围为 10–30 米。它可以处理多达 250 个节点。


    ![图 2.3 IoT 通信协议。](img/fig2_3.jpg)


    图 2.3 IoT 通信协议。


    表 2.1 从频率、数据速率、通信范围、功率效率和成本方面比较了上述协议。


    ### 表 2.1 边缘系统常用网络层协议对比


    | 协议 | 频率 | 数据速率 | 范围 | 功耗使用 | 成本 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | **Bluetooth** | 2.4 GHz | 1 to 3 Mbps | 300 英尺 | 低 | 低 |

    | **Wi-Fi** | 2.4, 5 GHz | 0.1 to 54 Mbps | <300 英尺 | 中 | 中 |

    | **ZigBee** | 2.4 GHz | 250 Kbps | 300 英尺 | 低 | 中 |

    | **LTE** | 蜂窝频段 | 1 to 10 Mbps | 英里 | 中 | 高 |

    | **LoRa** | 923 MHz | <50 Kbps | 100 公里 | 低 | 中 |

    | **RFID** | 860 to 960 MHz | 高达 100 Mbps | 高达 100 米 | 低 | 高 |

    | **Z-wave** | Sub GHz | 40–100 Kbps | 100 英尺 | 低 | 中 |

    | **Thread** | 2.4 Ghz | 40–250 Kbps | 10 米 | 低 | 中 |

    | **NFC** | 13.56 MHz | 106 to 424 kbps | <10 厘米 | 低 | 低 |


    数据传输协议提供了一套规则，用于在没有互联网连接的情况下与硬件建立点对通信。它用于消息传递。它们提供了定义语法、语义、错误恢复和数据同步的规则。一些常用的数据协议包括：


    -   **MQTT**: 消息队列遥测传输是一种构建在传输控制协议 (`TCP`) 之上的发布/订阅协议。该协议支持低成本、资源受限设备中的事件驱动消息。`MQTT`
    用于火灾探测器和汽车传感器。`Mosquitto` 是一个开源的 `MQTT` 代理。

    -   **AMQP**: 与 `MQTT` 类似，高级消息队列协议 (`AMQP`) 在 `TCP` 之上提供了发布/订阅架构。发布者的消息通过交换机接收，并将其分发到队列。队列代表不同的主题。监听器订阅这些主题。当这些主题下有可用数据时，订阅者将接收信息。它可以用于设备边缘摄取来自各种
    IoT 设备的数据。

    -   **XMPP**: 可扩展消息和存在协议由 `IETF` 标准化，用于基于发布/订阅架构的消息交换。它使用 `TCP` 作为传输层，并带有 `SSL`。

    -   **CoAP**: 受限应用协议 (`CoAP`) 是一种应用层协议，用于资源受限的传感器网络。它具有 `HTTP` 的低开销和易用性特征。它是请求-响应类型的协议。

    -   **HTTP**: 超文本传输协议用于连接 3D 打印机的计算机。`RESTful` 架构用于 IoT 环境。然而，`HTTP` 因其成本和能量效率被考虑。`DDS`（实时数据分布服务）、`LLAP`（轻量级本地自动化）、`LWM2M`（轻量级设备机器）以及
    `SSI`（简单传感器接口）也是常用的。


    ## 2.5 网络管理与控制


    手动重新配置和管理设备是不现实且低效的，原因如下：

    - 时间和成本增加。

    - 由于设备激增带来的安全威胁。

    - 停机时间增加。


    这使得需要网络管理解决方案。软件定义网络 (`SDN`) [8 是一种允许应用程序编程控制网络的架构。网络布局是可配置的。`SDN` 通过解耦控制平面和数据平面来提供网络管理。`SDN`
    通过以下方式实现网络管理：

    - 促进设备配置和带宽分配。

    - 使用安全策略和改进访问控制应对安全威胁。

    - 实现资源的快速部署和统一管理。

    - 使用智能技术进行网络故障排除。

    - 支持与多个数据平台互操作，并提供从 IoT 设备收集、分析和上传数据。

    - 解耦网络连接有助于数据上传。


    使用 `SDN` 简化网络管理将使 IoT 系统更加可靠、实时、安全、可扩展并便于统一管理。使用 `SDN` 的分层网络管理架构 [9]（见图 2.4）所示如下：


    > **感知层**: 由各种设备组成。传感器收集数据。执行器接收网络命令以执行各种任务。


    > **通信层**: 由 `SDN` 网关和路由器组成，用于传输数据。这些网关由 `SDN` 控制器进行编程控制。此类网关的功能包括根据指令进行数据传输、存储和处理。这些网关还执行节点管理、协议转换和安全控制。


    > **计算层**: 包含 `SDN` 控制器。控制器不仅控制数据传输，还处理数据。`SDN` 控制器的功能包括：

    > - **设备管理**: 包括路由器/网关的配置、管理，以及设备数据收集策略和规则。

    > - **服务管理**: 包括添加或删除网关支持的各种服务策略。

    > - **拓扑管理**: 包括路由和拓扑更新。

    > - **运维**: 日志、监控和功能模块的管理。

    > - **安全管理**: 包括身份验证和访问控制。

    > - **网络激活**: 使用基于容器的虚拟网络函数。


