    ## 公有区块链

    在公有区块链网络中，任何人无需身份验证即可加入并参与共识。隐私性较低，且运行共识消耗更多能量。公有区块链是波动网络，因为任何参与者都可以根据意愿加入或离开网络。这种网络是完全去中心化且透明的。完全透明、无许可、去中心化的公有区块链示例是
    `Bitcoin` 网络。公有区块链也可以是许可网络。在这种情况下，网络实体在加入网络之前需要经过验证。许可公有区块链的示例是 `Ethereum` 区块链。公有区块链利用原生资产或货币。例如，`Ethereum`
    使用 `ethers` 作为货币。`Bitcoin` 网络使用 `Bitcoin` 货币作为奖励。私有区块链并不关心货币。


    ## 联盟链/混合区块链

    联盟链/混合网络是公有和私有区块链的混合。它整合了两种类型网络的优点，例如波动性、身份验证、隐私性和不可篡改性。它还降低了能量成本并在两种类型之间取得了平衡。虽然混合区块链的成员身份是私有的，但从治理角度来看它是公开的。它比无许可网络更具能源效率且具有隐私性。联盟链的示例是
    `Ethermint` [7]。


    ## 5.8 区块链架构与基础

    `Bitcoin` 是第一个引入区块链技术的网络。`Bitcoin` P2P 网络中的交易发生如图 5.8 和 5.9 所示。任何节点要参与区块链交易，必须拥有一个
    `wallet`（钱包）。它是用于与区块链网络交互的程序。典型的区块链钱包包含用户的 `private key`（私钥）。它检查账户入入和出的加密货币。向其他账户发送加密货币时，通过
    `wallet` 中存在的 `private key` 形成数字签名，并在另一端使用 `public key`（公钥）进行验证。区块链中的 `wallet`
    类似于给银行用户提供的账户存折，对一个账户来说是唯一的。加密货币运行在区块链之上，被描述为虚拟货币。它同样是去中心化的并经过加密安全的，没有单一机构可以像区块链网络那样对其控制和监控。取决于区块链的类型，区块链网络可以在有或没有加密货币的情况下运行。通常，私有区块链不关注加密货币或基于令牌的系统。


    ![图 5.8 区块链中的交易](img/fig5_8.jpg)

    图 5.8 区块链中的交易


    ![图 5.9 交易工作流](img/fig5_9.jpg)

    图 5.9 交易工作流


    ### 5.8.1 Bitcoin 网络背后的区块链

    在区块链中，网络中的所有节点都维护一份分布式分布式账本。网络中的每个参与者被称为 `node`（节点）。区块链网络中的节点可以分为三个类型：`light node`（轻节点）、`full
    node`（全节点）和 `mining node`（矿节点）。


    **轻节点：** `light node` 也称为简单节点，它不持有完整的交易细节。它持有单个用户的 `wallet` 信息，如 `account number`（账号）和
    `private key`，并在网络中发起新交易。由于它不持有账本，轻量级节点不是区块链网络的一部分。因此，这种类型的节点不参与验证其他交易。


    **全节点：** `full nodes` 也称为 `validators`（验证者），它们是区块链网络的一部分。它以共享账本的形式持有完整的交易历史。区块链中每个
    `full node` 的账本都持有一致的信息。它不负责提议新区块，但它可以发起交易并维护 `wallet` 信息。`full node` 的主要责任是验证每笔交易。验证是为了确保
    `wallet` 有足够的金额完成交易，并通过其数字签名验证实体的可信度。在图 5.8 中，所有节点 (A)、(B)、(J) 和 (E) 都是全节点的示例，因为它们在
    `Bitcoin` 网络中都持有共享账本。


    **矿节点：** `mining node` 是一个 `full node` 并包含 `mining function`（挖掘功能）。它也被称为 `block
    generator`（区块生成器）。这些是负责通过解决密码题来提议新区块的参与者或计算机 [8]。


    ### 5.8.2 交易验证

    交易是 `Bitcoin` 网络中的基本构建块。经过验证的交易会被广播到网络节点。许多交易共同形成一个区块。许多区块通过加密链接形成一条链。区块在添加到链之前也会经过验证。验证和共识程序由
    `mining nodes` 执行以验证区块。如图 5.8 所示，每个节点都有共享账本。为了让交易发生，当每个节点加入区块链时，它会根据提供的节点身份提供一个
    `wallet` 和一个 `private key`。如图 5.8 所示，如果 Alice 想在 `Bitcoin` 网络中向 Bob 转账，它需要处理图
    5.9 所示的一系列步骤。


    网络中的每个 `full node` 通过执行用户身份验证和数据完整性来验证交易。用户身份验证通过相应的 `public key` 解密提议用户的数字签名来确保。数据完整性通过对交易数据进行哈希处理并与解密签名进行对比来检查。验证交易遵循此程序。有效交易积累在池中。有效交易随后广播给
    `mining nodes`，以便在网络中建立新区块。


    ### 5.8.3 挖掘与区块结构

    矿工收集有效交易并使用哈希机制形成 `Merkle root hash`（默克尔根哈希）。随后 `Merkle root header` 被添加到区块头。通过这种方式，所有有效交易都被汇总到一个区块中。每个区块的交易数量由
    `mining nodes` 决定。该区块随后广播给 `mining nodes`。为了识别网络中的下一个区块，区块链中使用了共识机制。网络中的 `block
    generator/miner` 根据共识挖掘区块。矿工相互竞争解决困难的数学题（如 `PoW`）。矿工通过检查 `block hash`、`block height`
    和 `size values`、上一个区块哈希值、区块中所有交易的有效性以及 `block timestamp values` 的正确性来验证并校验区块。挖掘后，矿工获得奖励。成功挖掘后，区块中包含的所有交易节点将手续费支付给矿工。当每个新区块被添加到链时，区块链网络也会产生新的代币。


