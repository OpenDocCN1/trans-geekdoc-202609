    > Validation: The training set can then be split into training and validation
    set. Validation is a phase that helps in providing most optimized model by changing
    hyper-parameters based on the validation test results.


    > Testing: Machine learning model is modeled to predict the result for test dataset.


    Machine learning algorithms are classified into the following categories based
    on its capability to handle labeled/unlabeled data.


    ## Supervised Learning


    Supervised learning is a machine learning technique that handles well labeled/tagged
    data to train the machine as shown in [Fig. 3.4](#ch03.xhtml#fig3_4). Here the
    system requires a supervisor which is the training dataset as the machine learns
    from it. Supervised learning algorithms then are grouped into the following subgroups.


    ![Figure 3.4 Supervised learning mechanism.](images/fig3_4.jpg)


    [Figure 3.4 Supervised learning mechanism.](#ch03.xhtml#fg3_4)


    1. **Regression**: The regression technique helps predict the value of dependent
    variable `Y` with respect to the single independent variable `X` or multiple independent
    variables `X1, X2 …. Xn`.

    2. **Classification**: By using the classification technique, the machine is trained
    to categorize the value into specific class.


    ### Some Popular Supervised Learning Algorithms


    * Linear Regression for Regression Problem

    * Logistic Regression for Classification Problem

    * K-Nearest Neighbors for Classification Problem

    * Support Vector Machine Classification Problem

    * Random Forest for Classification and Regression Problems


    **Application:** Consider the dataset consisting of objects such as lion, tiger,
    and dog with the category tagged in every object and it is used to train a model
    to recognize new input objects.


    ## Unsupervised Learning


    Unsupervised learning is a machine learning technique that acquires inferences
    from the dataset where the values are unlabeled/not tagged [[8](#ch03.xhtml#ref3_8)]`.
    The system does not require any supervisor for learning. The machine acquires
    knowledge through observation and gets trained as depicted in [Fig. 3.5](#ch03.xhtml#fig3_5).


    ![Figure 3.5 Unsupervised learning mechanism.](images/fig3_5.jpg)


    [Figure 3.5 Unsupervised learning mechanism.](#ch03.xhtml#fg3_5)


    Unsupervised learning algorithms then are grouped into following subgroups.


    1. **Clustering**: It is an unsupervised machine learning technique that segregates
    sample space into various cluster groups by discovering similarities between the
    individuals. This technique uses input values alone to predict patterns and anomalies
    with respect to similarities. Various distance calculation techniques such as
    Euclidian distance, Manhattan distance are involved in finding the similarity/dissimilarity
    among the objects.

    2. **Association**: It is an unsupervised machine learning technique that helps
    identifying the probability of relationships among values. These techniques are
    widely used for finding sales correlation in transactional data.


    ### Some Popular Unsupervised Learning Algorithms


    * Hierarchical Clustering

    * K-Means clustering

    * K-Nearest Neighbor Clustering

    * Principal Component Analysis

    * Singular Value Decomposition

    * Independent Component Analysis

    * Apriori Algorithm


    ### Applications


    In retail markets, retailers discover the relationship between items by analyzing
    previous transactions to uncover associations among them. By analyzing purchase
    history, the combination of items that occur more frequently is identified and
    kept closer to improve sales of products.


    ## Semi-Supervised Learning


    This problem relies upon supervised and unsupervised techniques. In this case,
    some data is labeled and some is not. The process is depicted in [Fig. 3.6](#ch03.xhtml#fig3_6).


    ![Figure 3.6 Unsupervised learning mechanism.](images/fig3_6.jpg)


    [Figure 3.6 Unsupervised learning mechanism.](#ch03.xhtml#fg3_6)


    ### Applications


    In medical imaging, some images are labeled by experts while others are not. Semi-supervised
    learning is used to improve the accuracy of models using limited amount of labeled
    data.


    ## Reinforcement Learning


    Reinforcement learning is a machine learning method where an agent learns to make
    decisions by performing actions in an environment to maximize a reward. The agent
    learns through trial and error, based on the feedback it receives from the environment
    in form of positive or negative rewards. The goal of this system is to maximize
    cumulative reward. This process is shown in [Fig. 3.7](#ch03.xhtml#fig3_7).


    ![Figure 3.7 Reinforcement learning mechanism.](images/fig3_7.jpg)


    [Figure 3.7 Reinforcement learning mechanism.](#ch03.xhtml#fg3_7)


    ### Some Popular Reinforcement Learning Algorithms


    * Markov Decision Process (MDP)

    * Q-Learning

    * State-Action-Reward-State(SARSA)

    * Deep Q-Networks (DQN)

    * Deep Deterministic Policy Gradient (DDPG)


    ### Applications


    In robotics field, gaming and engineering automation, reinforcement learning are
    used to facilitate control of complex systems.


    ### 3.6.3 Performance Evaluation


    When the model is built using any of the above-mentioned algorithms, the performance
    of the same will be evaluated to test its efficiency. General machine learning
    performance evaluation techniques include


    * Confusion matrix

    * Accuracy

    * Precision/ Positive Predictive Value(PPV)

    * Recall

    * F1 score

    * Specificity

    * Negative Predictive Value(NPV)

    * PR curve

    * Receiver Operating Characteristics(ROC) curve


    In order to understand the evaluation techniques, let’s consider an example scenario
    where the task is to identify whether patient is corona disease (reports positive)
    or is found healthy(reports negative). In general, the results of this classification
    problem fall into one among the categories such as True Positive, True Negative,
    False Positive, and False Negative as depicted in [Table 3.1](#ch03.xhtml#tbl3_1).


    > True Positive (TP): The patient is corona positive and predicted positive

    >

    > True Negative (TN): The patient is corona negative and predicted negative

    >

    > False Positive (FP): The patient is corona negative and predicted positive

    >

    > False Negative (FN): The patient is corona positive and predicted negative


    Table 3.1 Confusion matrix – actual versus predicted values


    |  ||  || Predicted |

    | --- | --- | --- |

    |  ||  || Negative || Positive |

    | **Actual** || Negative || True Positive || False Negative |

    | Positive || False Positive || True Negative |


    #### Confusion Matrix


    Confusion matrix is a matrix visualization of the classification results in terms
    of the parameters `TP`, `TN`, `FP`, and `FN`.


    #### Accuracy


    Accuracy is a metric to evaluate model performance based on its accurate predictions.
    The formula for calculating accuracy is the correct predictions upon the total
    predictions.


    ${Accuracy} = \\frac{{TP} + {TN}}{{TP} + {TN} + {FP} + {FN}}$(3.1)


