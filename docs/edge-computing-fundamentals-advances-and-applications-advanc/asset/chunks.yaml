    ### 6.3.5 Use Case - Edge Computing/Analytics in Industrial IOT


    **Mr. T. Viswanathan, CTO, Maxbyte Technologies**


    Maxbyte Technologies is an Industrial IOT Products (`IIOT`) & Solutions company
    for the manufacturing companies in various industries such as automotive, aerospace
    and defence, industrial products, consumer products, and process industries. Maxbyte
    provides end-to-end Industrial IOT Products & Solutions from sensors to analytics.
    Edge computing/analytics plays an important role in acquire raw data from the
    assets and sensors, processes and shares the required information to the IIOT
    enterprise applications.


    There are various use cases on edge computing/analytics applicable in Industrial
    IOT from basic data collection to high-speed data processing in use cases such
    as vibration analytics. The specific use case to be described below is vibration-based
    predictive analytics for manufacturing shop floor machines.


    The objective of this use case is to predict the machine failure in advance based
    on the vibration measurement and take corrective and preventive measures to avoid
    machine downtime. In the existing scenario, the machines failures are identified
    only after the issue has occurred on the machine and the maintenance team takes
    the required corrective action to correct the issues. This generally is an expensive
    process since the machine is already into breakdown which impacts the production,
    and the cost of repair/recovery is high.


    Solution to the above-mentioned problem is identifying the machine failure in
    advance and take the necessary corrective and preventive measures to avoid the
    complete machine failure. Machine vibration analytics helps in identifying the
    machine failures effectively. To do this, the vibration sensors are mounted on
    the critical parts of the machines and the vibration data are acquired at `10/20
    KHz` sampling rate. The acquired data need to be processed at the edge device
    to identify various frequency components in the measured vibration signal and
    identify any anomalies.


    To predict the machine failures, the historical data of the previous machine failures
    and the associated critical machine parameters including vibration play a crucial
    role. Based on the historical data, the diagnostics and machine failure model
    has been created and deployed in the IIOT enterprise application in production.
    Based on the real-time data captured and the processed data on the edge device,
    the predictive model deployed on the server predicts the machine failures in advance,
    and the necessary alerts and notifications along with the recommended action to
    be taken will be sent to the respective maintenance users.


    The primary benefit of this use case is the elimination of the high cost of repair/recovery
    from the machine breakdown which not only impacts machine health but also the
    production. The incremental improvements done on the machine will also ensure
    higher machine uptime and enhanced machine utilization.

