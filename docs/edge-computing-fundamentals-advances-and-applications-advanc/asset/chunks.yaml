    ### Core Concepts


    #### Mobility management

    Edge computing mainly aims at allocating edge resources close to devices to offload
    computations. If devices are static then edge resources can be identified statically.
    If devices are mobile, dynamic resource discovery and low latency resource switching
    are essential to ensure service continuity. Mobility based service migration prediction
    technique is used to balance cost with service delivery.


    #### Traffic offloading

    Like computation offloading, based on the latency, bandwidth, localization, energy
    and other network, traffic can be offloaded at the edge of the network. The main
    objective is to offload computations in a manner to reduce network congestion.


    #### Caching

    Caching techniques enable efficient content distribution and improve the user
    experience. Content caching at the edge of the network avoid repeated data transfer,
    network congestion and traffic. Cache location and cache management policies is
    a hot research topic.


    #### Network control

    Programmatically controlling the networks in the edge computing system using software
    defined networks is an active research area.


    #### Data security and privacy

    The distributed architecture of edge computing makes it vulnerable to malware
    infections and security breaches. Some of hot research topics include light weight
    encryption techniques to suite the resource constraints of the devices. This ensures
    security of data in transfer. Further, when data is stored suitable techniques
    for secure data storage is essential. Homomorphic encryption can be used for searchable
    encryption. This ensures security as well as performance. Data security is ensured
    using suitable confidentiality and integrity techniques. Proposing suitable authentication
    and access control mechanisms for individuals and groups suited to the resource
    constraints and distributed nature of edge computing systems. Authentication mechanisms
    include individual, cross domain and handover authentication while migrating from
    one domain to another. Access control mechanisms include attribute-based and role-based
    approaches. Preserving individual privacy using suitable privacy preservation
    techniques. The privacy problems in the edge computing environment involve establishing
    a trade-off between:


    * Data outsourcing through computation offloading and maintaining data privacy.

    * Offering location based service and maintaining data privacy.

    * Data sharing and preserving individual privacy.


    One of the most researched area is integrating blockchain with edge computing
    systems. It is a mutually beneficial integration. Blockchain offers security including
    confidentiality and integrity while preserving privacy of data in edge computing
    environment that is heterogeneous and scalable. Edge computing offers required
    resources for the blockchain environment.


    ### 2.9 Summary


    Edge computing is a distributed computing paradigm that offloads device computation
    to network edge like a building. It reduces latency and performs computation close
    to the end devices. This chapter discussed the need for edge computing in an industrial
    environment. The detailed architecture of an edge computing environment with the
    functionality of various components was discussed in this chapter. Device and
    local edge nodes to perform computation at network edge improve the effectiveness
    of the application based on the availability of the resources. Devices, networks,
    and computation resources form the core of the edge computing system. Sensors
    and actuators perceive the environment. Various communication protocols including
    networking protocols and data transfer protocols were discussed in detail. Network
    management is essential to configure and maintain the disparate resources and
    enable communication between them. For this purpose automated network management
    using `SDN` was discussed. As the edge computing environment is highly heterogeneous,
    middleware is required to integrate these entities to function as a unified whole.
    Further, a suitable interface is required to interact with the user. This chapter
    provided a detailed discussion on middleware architecture and need for user interfaces.
    As the system is highly complex, it is difficult to build a real edge computing
    system to test an application. So simulators are used. This chapter gives a detailed
    discussion on features and architecture of various simulators such as `IoTSim-Edge`,
    `iFogSim`, and `EdgeSim`. Steps to set up topology and execute an application
    on `iFogSim` was also provided. Finally, the chapter concluded with pointers to
    possible directions for research in the area of edge computing.


