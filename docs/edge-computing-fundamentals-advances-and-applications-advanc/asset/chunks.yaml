    ## 6.2.6 Content Delivery


    Better experience is guaranteed for accessing a web page, video, or music via
    edge computing model as the response is ensured in milliseconds rather than depending
    upon the response from the cloud data center. The Content Delivery Network (`CDN)
    market has been controlled/ruled by players, like `Akamai` and `Limelight` by
    significant construction of expansive networks. Few providers like `Netflix/HBO`
    sprawl their customized micro-cache at edge network with greater reliability and
    flexibility.


    ## 6.2.7 Financial Sector


    To enable Smart Banking facility, banking sectors are adopting edge computing
    frameworks for better consumer experience and service. The service is offered
    via different multitudes over smartphone, `desktop/laptop`. In addition, the feature
    is expanded to `ATMs` and `kiosks` with the strong inbuilt functionality to collect
    and process data. With these wider ranges of features, banking sectors attract
    customers with much more responsive design. Edge computing supports trading sectors
    by speeding up the communication and computation, thus reduces the overall loss.
    High-speed execution is viable by placing the edge servers very close to stock
    exchanges to run high resource intensive protocols/algorithms. More accurate and
    appropriate latest information is facilitated to the providers and consumers with
    this high benefitted model.


    ## 6.2.8 Augmented Reality


    Augmented reality pays recent attention due to its applicability in more common
    practical applications. Augmented reality facilitates a real appearance to the
    users by overlaying digital devices/elements on top of real-world objects/environments.
    Wearable devices such as headsets, glasses, smart watches, jackets, and rings
    create virtual effects most widely via smartphones. The most familiar application
    of augmented reality is the filter option in `Instagram/Snapchat`. The working
    procedure behind augmented reality necessitates the elements/devices to process
    visual data and to map the visual data to real-time objects. Edge framework works
    in a better lighter manner that allows devices to fuse with augmented reality
    displays spontaneously without any delay. Many retail chains are making use of
    this technology for a better shopping experience.


    ## 6.2.9 Healthcare Sector


    Edge computing fascinates health sectors by creating new opportunities to incorporate
    recent IT solutions for promising patient care. Gathering, protecting, and processing
    a humongous amount of patient data becomes real with the aid of edge computing.
    Dynamic real-time decisions and actions are possible to provide by the healthcare
    sectors even to the rural background people as e-services in milliseconds of time
    with the deployment of edge. In addition, anywhere, any time access to information
    is possible than depending upon one centralized database. Recently, many medical
    devices appear and ruling the market with a provision to collect and process data
    that plays a major role during treatment or diagnosis. For instance, simple prediction
    of heart disease using low-density lipoproteins in edge computing systems is proposed
    by Anitha Kumari et al. [[3](#ch06.xhtml#ref6_3)]. Thus, edge computing creates
    a huge impact on every person’s daily life to lead a healthy and safe life.


    Apart from this, edge computing lays its footprints in sectors/applications like
    video monitoring, video conferencing, software-defined networking, connecting
    homes and offices, and retail.


    The realization of use cases in edge computing is presented in [Fig. 6.2](#ch06.xhtml#fig6_2)
    for a clear understanding.


    ![Figure 6.2 Realization of edge use cases.](images/fig6_2.jpg)


    [Figure 6.2 Realization of edge use cases.](#ch06.xhtml#fg6_2)


    ## 6.3 Realization of Edge Computing in Healthcare Ensuring Storage Security


    The healthcare industry is one of the world’s largest and fastest growing industries.
    Transforming healthcare into the digital era is predominant to reduce operational
    costs and provide better diagnostic tools for healthcare professionals by making
    digital patient data available in a timely fashion. Accessing the records dynamically
    at any point with low latency and hard-to-reach places realizes the highest usage
    of edge computing in real time. Generally, in healthcare records, patients often
    deal with missing or incorrect medical information when they happen to visit a
    new provider or facility. There are chances that the patient’s data can be misused
    if hackers get access to it. Each and every information has to be monitored to
    avoid the occurrence of undesired events and also to prevent it from attacks.
    To store and protect the security and privacy of healthcare digital data, between
    the layers, several methods exist, such as attribute-based encryption, proxy re-encryption,
    functional encryption, honey encryption, and homomorphic encryption. Homomorphic
    encryption is the cutting edge cryptographic technique that allows computations
    to be carried out on an encrypted data than in plain text to provide privacy and
    data storage security similar to conventional cryptography, but with added capabilities
    like searching on encrypted data. Among many types, Fully Homomorphic Encryption
    (`FHE`) is widely used that allows full computation over encrypted data. `FHE`
    is an emerging cryptographic technique to permit computation on encrypted data
    without the need to bring the data back to the computational node [[4](#ch06.xhtml#ref6_4),[5](#ch06.xhtml#ref6_5)].


    Typically a transition requires personal health information is protected in three
    different phases of manipulation of digital patient data: (1) acquisition, (2)
    storage, and (3) computation. In these Case studies, data is gathered from Internet
    of Medical Things (`IoMT`) devices and transmits to edge gateway/server. Edge
    device stores the data homomorphically for further processing/analyzing upon encrypted
    data. Finally, the required portion of data is sent to the cloud server.


    Three case studies have been discussed in this chapter for edge computing-based
    healthcare applications, which are as follows:


    ### Case Study I: Pulse Oximeter to Detect Acute Respiratory Distress Syndrome
    (ARDS) in Edge Server


    Oxygen is the most important essential thing in human’s life. Oxygen delivery
    and oxygen consumption are the two important parameters in everyone’s life and
    that can be calculated using pulse oximeter. Lack of oxygen delivery, hemoglobin
    and oxygen consumption leads to Acute Respiratory Distress Syndrome (`ARDS`),
    commonly known as respiratory failure. By collecting these values via pulse oximeter,
    analysis is carried out in edge server to identify whether a person has ARDS or
    not.


    ### Case Study II: Blood Pressure to Determine Hypotension in Edge Server


    Mean Arterial Pressure (`MAP`) is the average blood pressure in a person’s blood
    vessels during a single cardiac cycle. Based on the systolic and diastolic value
    acquired via blood pressure monitor, `MAP` is computed and is analyzed in edge
    server to determine whether a person has hypotension or not.


