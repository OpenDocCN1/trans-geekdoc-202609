- fmt: '

    - Edge computing (`EC`): In an IoT environment, it is preferred to carry out computation
    closer to the data sources (sensors). Hence such processors not only consume data
    from sensors but also produce data by processing them. Edge device is located
    between the data source and the cloud server. Cloudlet servers as an edge of the
    mobile app and cloud whereas an IoT gateway serves as an edge between IoT sensors
    and cloud. A smartphone serves as an edge for the application and cloud. They
    can perform computing, cache data, or store data. Edge servers can also offload
    data or get services from the cloud. Edge servers can also service clients on
    behalf of cloud servers. While edge computing is based on devices, fog is based
    on processors located in the LAN. Edge and Fog computing aim to move computing
    closer to the device and decentralize it.


    - Dew computing (`DC`): aims to realize the potential of on-premise computers/smartphones
    in collaboration with cloud services. It aims to use the full potential of local
    and cloud systems. It is based on micro server-based architecture. Although Fog
    servers are connected to cloud, it need not use the cloud services. In dew computing,
    data from fit bit-like devices is transferred through smartphones to the cloud
    and processed. Hence cloud services are always used in dew computing.


    - Fog-Dew Computing (`FDC`): IoT devices are connected to the fog server through
    local connections. Fog server is connected to cloud through Internet connections.
    So it can compute offline in fog servers or online in cloud servers.


    ![Figure 1.20 Paradigms related to fog computing.](images/fig1_20.jpg)


    [Figure 1.20 Paradigms related to fog computing.](#ch01.xhtml#fg1_21)


    Architecture of a fog computing system at a high level consists of three layers
    [[11](#ch01.xhtml#ref1_11),[12](#ch01.xhtml#ref1_12),[13](#ch01.xhtml#ref1_13)]
    ([Fig. 1.21](#ch01.xhtml#fig1_22)):


    - Bottom most layer consists of IoT plate plane. This layer consists of all connected
    devices that perform sensing and actuation functionalities.


    - Fog layer: uses virtual and physical resources. This layer can perform small
    and medium-level data processing. Usually for time-sensitive applications, processing
    is done in this layer. It accumulates sensor data, processes it, and sends actuation
    signals to the IoT plane. Virtualization of resources is also possible. Usually,
    container virtualization is done in this layer. This layer can also obtain services
    from the cloud layer.


    - Cloud layer: This layer performs complex data processing and storage. If the
    application is not time-sensitive, then fog layer obtains services from application
    layer to process the application.


    ![Figure 1.21 Architecture of fog computing system.](images/fig1_21.jpg)


    [Figure 1.21 Architecture of fog computing system.](#ch01.xhtml#fg1_22)


    The users can obtain services from the fog layer or the cloud layer.


    ### 1.9.4 Osmotic Computing


    Cloud environment provides the required resources (including computing and storage)
    to carry out the functionality of conventional IoT applications. Such a centralized
    framework introduces unnecessary delay for latency-sensitive IoT applications.
    Latency-aware applications need to be processed at the edge of the network close
    to the devices where data is generated/used. Hence depending on the nature of
    the applications, cloud and edge models need to coexist and co-operate. The need
    for a seamless integration of the cloud-edge platforms can be successful only
    with supportive services for interoperability, privacy, and management. Osmotic
    computing facilitates cooperative usage of such services in edge-cloud environment.
    For this lightweight virtualization mechanisms are suitable. Hence, osmotic computing
    uses containerization and microservices extensively.


    A software application is composed up of a number of independently deployable
    modular microservices. Each microservice executes a unique process and communicates
    through a well-defined, lightweight mechanism, such as a container. A container
    encapsulates software components and ensures reduced deployment overhead. Thus
    container-based approach facilitates deployment of lightweight microservices at
    the devices in the network edge.


    Osmotic computing thus facilitates efficient execution of IoT microservices between
    cloud datacenter and the network edge by providing increased resource and data
    management capabilities at the edge of the network. It also supports suitable
    data transfer protocols for seamless integration of services. Osmotic computing
    provides automatic and secure microservice deployment in heterogeneous cloud-edge
    environment by using lightweight containers like `dockers`. It aims at highly
    distributed and federated environments, and enables the automatic deployment of
    microservices that are composed and interconnected over both edge and cloud infrastructures.


    Osmotic computing facilitates service migration across cloud, fog, and edge computing
    resources [[14](#ch01.xhtml#ref1_14)]. It is derived from the term “osmosis” which
    refers to the equalization of the concentration of a solution by allowing the
    molecules of the solvent to move from a region of lower solute concentration to
    a higher solute concentration through a semi-permeable membrane. The chemical
    solution is analogous to the computational infrastructure of the fog environment
    whose resource requirements change based on the application and time. Osmotic
    computing aims to balance the load by utilizing the resources suitably in cloud,
    fog, and device layers. This load balancing is achieved by migrating the services
    across the cloud, fog, and device layers.


    The major elements of the osmosis process include solute, solvent, solution, semi-permeable
    membrane, concentration. An analogy can be drawn from these components to osmotic
    computing as follows:


    - `Solute`: These particles are not allowed to migrate. We can draw an analogy
    to solute in the computing infrastructure as computational power, storage, energy,
    etc. depending on the application.


    - `Solvent`: The solvent can migrate between the solutions through a semi-permeable
    membrane. An analogy to the same in computing infrastructure is services. These
    services can migrate between the cloud, fog, and edge infrastructure to improve
    the effectiveness of the application.


    - `Solution`: Comprises solute and solvent. An analogy to the solution includes
    the complete infrastructure comprising of the users, devices, computing/storage
    resources, platforms, and services.


    - `Semi-permeable membrane`: controls the movement of the solvent to equalize
    the concentration of the solutions. The fog computing environment performs this
    functionality in the osmotic computing framework by deciding on when, where, and
    how the microservices are to be migrated. The resource allocators decide when
    the microservices should migrate between the cloud, fog, and edge resources based
    on the application. Based on the resource availability, latency, and load balancing
    factors, microservice can be migrated from one resource to another. The technology
    support for migration may include lightweight container services.


    - `Concentration`: This represents the ratio of the microservices to be handled
    by the resources available at various layers including device, fog, and cloud.


    Osmotic computing model is thus based on the osmosis principle. The user plane
    interacts with the fog layer resource managers which classify the services into
    micro and macro services based on the application needs. These resource managers
    act as a semi-permeable membrane to migrate services between edge resources and
    cloud resources to improve the application performance.

