    ## 1. 计算范式

    本章详细阐述了计算范式的演进。通过分析并行计算、分布式计算、网格计算、云计算和移动云的优缺点，为它们提供了详细的工作原理。本章的后半部分涵盖了雾计算/边缘计算和渗透性计算的兴起。本章以当前的研究问题结束。


    ## 2. 边缘计算及其要素

    本章阐明了边缘计算对于实时应用和跨设备数据流的必要性。详细阐述了所需的边缘计算架构、网络管理和中间件。阐述了 `IoTEdge-Sim`、`iFogSim`
    和 `EdgeSim` 模拟器的架构，以便以重复、受控且具有成本效益的方式评估各种策略和算法。


    ## 3. 边缘分析

    本章向读者介绍了数据分析的基础及其方法。通过示例和插图涵盖了数据分析的不同阶段和类型。描绘并解释了边缘数据分析的架构。提出了将通用数据分析方法整合到边缘设备中的建议。包含了案例研究以及与边缘分析相关的各种编程工具和技术。


    ## 4. 边缘数据存储安全

    本章详细讨论了边缘数据存储安全方案，即数据保密性方案、认证方案和隐私保护方案。本章主要关注高级加密方案，如同态加密、属性加密、代理重加密、功能加密和蜜罐加密。在本章末尾包含了攻击检测与防御策略以及可能的研究方向。


    ## 5. 区块链与边缘计算系统

    通过引入区块链技术解决了边缘计算系统的安全问题。从一开始就清晰地解释了区块链及其组成部分，使外汉也能理解其内容。通过清晰的插图涵盖了区块链的特性、类型、架构和基本的区块链知识。涵盖了各种平台及其工作方法，并包含了一些实际演示和代码片段。


    ## 6. 边缘计算用例与案例研究

    本章详细阐述了边缘计算的高潜力用例，以便研究社区更好地理解。本章讨论了三个基于医疗边缘计算存储安全的案例研究。末尾增加了开放的研究挑战，作为未来的研究方向。本章末尾还增加了专家观点，并通过一些用例让了解从传感器到分析的端到端工业物联网（IOT）产品与解决方案。


    # 致谢

    我们向“全能的神”致敬，是他赐予了我们健康和信心，使我们能够成功承担并完成这本书。我们对 PSG 技术学院的院长和管理层表示衷心的感谢感谢他们不断的鼓励和支持。感谢我们的家人，他们一直站在我们身边，通过分担日常家务鼓励我们完成此书。感谢每一位在准备本书过程中激励和指导我们的人。特别感谢
    CRC Press | Taylor & Francis 集团的编辑团队和评审员，他们投入宝贵时间支持此本书的快速出版。


    我们感谢各行业专家为相应章节提供宝贵的专家笔记。我们要感谢印度 Maxbyte 公司的 CTO T. Viswanathan 先生和印度罗伯世公司软件架构师
    C.S. Saravana Kumar 博士，根据行业需求对边缘计算用例和边缘数据分析提供了宝贵建议。此外，我们感谢新加坡科技与设计大学的研究员 Bithin
    Alangot 博士就区块链方面提供的建议。


    # 作者简介


    ### Anitha Kumari 博士

    `K. Anitha Kumari` 在 IT 部门担任副教授已 11 多年。她对学习新事物充满热情和好奇心。值得赞的是，她在 IEEE、Springer
    等评审期刊上发表了 1 项专利和 75 篇技术论文。出于研究兴趣，她还贡献了 CRC Press、Springer、IGI Global 出版的书籍章节。目前，她是硕士（生物识别与网络安全）专业的课程协调员。


    ### Sudha Sadasivam 博士

    `G. Sudha Sadasivam` 在 PSG 技术学院担任教授并负责计算机科学系。她拥有 24 年的教学经验。她在索引期刊上发表了 5 本书和约 100
    篇论文。她在分布式计算领域协调两个 AICTE-RPS 项目和一个由 UGC 资助的项目。她的团队在 PSG 技术学院建立了基于大数据分析的 PSG-Yahoo/Nokia
    实验室。


    她还是网络安全一年期认证课程（2020 年 1 月至 12 月）的单一联系人（SPOC）。她还担任 `International Journal of Education,
    Science, Technology, and Engineering`、`International Journal of Artificial Intelligence`、`Decision
    Making: Applications in Management` 等 Scopus 索引期刊的编辑成员，并担任 PSG 与 SETS 实验室之间签署的备忘录的
    SPOC。


    她也是 `IEEE Communications Surveys and Tutorials`（影响因子：20.23）、`IEEE Transactions
    on Industrial Informatics`（影响因子：5.43）、IEEE Access、Springer 等知名期刊的活跃评审员，以及许多国际/国家会议的技术计划委员会（TPC）成员。她的兴趣领域包括云与物联网安全、安全协议的设计与分析、攻击与防御、计算安全、生物信息学、量子密码学、Web
    服务安全、网络安全、认知安全和算法分析。她在感兴趣的领域进行了多次客座演讲。她的安全项目获得了 AICTE 的批准并授予了 180,000 卢比。她曾是 Technovator
    项目（2019、2018 和 2014 年）以及 `MEDROIDZ` 的导师，后者是由 ICICI – Trinity 2014 资助的项目，并被选为印度六个项目之一。在学术上，她在安纳大学和
    Avinashilingam 大学的硕士（安全工程）和学士（计算机科学）学位中获得了第一名并荣金奖。作为导师，她目前正在指导其研究领域的博士生。


