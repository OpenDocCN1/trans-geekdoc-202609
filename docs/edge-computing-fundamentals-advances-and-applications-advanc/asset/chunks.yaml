    Some of the limitations of clusters include effective resource utilization, single
    point of failure due to the controller node, and operating costs to maintain a
    cluster. Let us compare and contrast distributed computing with cluster computing.
    A cluster is a collection of tightly coupled independent computers with centralized
    control. These nodes work in cooperation to achieve a goal. Cluster systems are
    often kept in the same room. A distributed system consists of geographically dispersed
    independent computers that communicate using message passing in a loosely coupled
    environment. Parallel computation is possible in both these systems by harnessing
    the power of a large number of workstations. In reality, cluster computing is
    a special case of distributed computing with centralized control.


