    Precision is an evaluation metric that focuses on finding the percentage of actual
    positive cases in the total predicted positive cases. It is also called as positive
    predictive value (PPV).


    $Precision = \frac{TP}{TP + FP}$ (3.2)


    ### Recall


    Recall is an evaluation metric that aims at determining the valid positive cases
    in the total available positive cases so as to identify the other missed positive
    cases. Recall is also termed as Sensitivity.


    $Recall = \frac{TP}{TP + FN}$ (3.3)


    ### F1 Score


    When `Precision` and `Recall` are imbalanced, `F1 score` is the harmonic mean
    of both. It is used in application. The `F1 score` is considered as weightage
    of both `Precision` and `Recall`.


    $F1 = 2 \times \frac{Precision \times Recall}{Precision + Recall}$ (3.4)


    ### Specificity


    Specificity is an evaluation metric that calculates the proportion of actual negative
    cases in the total predicted negative cases so to identify the other missed negative
    cases.


    $Specificity = \frac{TN}{TN + FP}$ (3.5)


    ### Negative Predictive Value


    Negative Predictive Value (NPV) is a metric that focuses on finding the percentage
    of actual negative cases in the total predicted negative cases.


    $NPV = \frac{TN}{TN + FN}$ (3.6)


    ### PR Curve


    `PR Curve` is a graph of `Precision` and `Recall`. It is significant that `PR
    Curve` has high `Precision` values.


    ### Receiver Operating Characteristics (ROC)


    `ROC curve` is a plot between `True Positive Rate` (`TPR`) and `False Positive
    Rate` (`FPR`). The larger the area under the curve, the better the model.


    ## Types of Data Analytics


    In general, data analytics are classified into four types based on its purpose:
    `descriptive analytics`, `diagnostic analytics`, `predictive analytics`, and `prescriptive
    analytics`.


    ### Descriptive Analytics


    `Descriptive analytics` expresses what happened in the past. This category of
    analytics is useful for data visualizations like charts and dashboards. It analyzes
    the current data to provide answer for the question "What happened?".


    ### Diagnostic Analytics


    `Diagnostic analytics` provides deeper insight into a problem. This category of
    analytics is also called root cause analysis. It aims to provide answer for the
    question "Why something happened?".


    ### Predictive Analytics


    `Predictive analytics` uses historical data to forecast the future based on the
    current trend. It aims to provide answer for the question "What is likely to happen?".


    ### Prescriptive Analytics


    `Prescriptive analytics` recommends the action to avoid unexpected problems. It
    aims to provide answer for the question "What should I do?".

