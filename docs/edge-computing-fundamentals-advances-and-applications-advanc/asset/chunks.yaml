    \n}\n\nfunction getFace(address adr) public view returns(string memory)\n\n{\n\
    \nreturn faceEncoding\\[adr\\];\n\n}\n\n}\n\nThe processing capability in Ethereum\
    \ is slow as it can process only 10–12 transactions per second, which reduces\
    \ its usability for biometric system. The scalability is also one other important\
