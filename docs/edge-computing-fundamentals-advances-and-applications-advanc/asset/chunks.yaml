    #### 6.3.2.2 Oxygen Delivery (DO[2])


    Global oxygen delivery (DO[2]) is the amount of oxygen delivered to the whole
    body from the lungs \[[7](#ch06.xhtml#ref6_7),[8](#ch06.xhtml#ref6_8)\]. It is
    the product of total blood flow or cardiac output (CO) and the oxygen content
    of arterial blood (CaO[2]) and is usually expressed in ml min^(−1) and is described
    using the equation:


    *D**O*[2] = *C**O* \* *C**a**O*[2](6.1)


    The oxygen content of arterial blood (CaO[2]) is described using the equation:


    *C**a**O*[2] = (*k*1×*H**b*×*S**a**O*[2]) + (*k*2×*P**a**O*[2])(6.2)


    where Hb is the hemoglobin concentration (g liter^(−1)), SaO[2] is the arterial
    Hb oxygen saturation, PaO[2] is arterial oxygen partial pressure, k1 is the Hufner’s
    constant to denote the oxygen combining capacity of Hb and it varies from 1.34
    to 1.39, and k2 is the quantity of dissolved oxygen in plasma. For our research,
    the value taken for k1 is 1.34 and k2 is 0.0031.


    #### 6.3.2.3 Oxygen Consumption (VO[2])


    Global oxygen consumption (VO[2]) is the volume of oxygen consumed by the tissues
    per minute \[7,8\]. Under aerobic conditions, oxygen is consumed to generate energy
    so that VO[2] corresponds to the metabolic rate and is described using the equation:


    *V**O*[2] = *C**O* × (*C**a**O*[2]−*C**v**O*[2])(6.3)


    The oxygen content of venous blood (CvO[2]) is described using the equation:


    *C**v**O*[2] = (*k*1×*H**b*×*S**v**O*[2]) + (*k*2×*P**v**O*[2])(6.4)


    where Hb is the hemoglobin concentration (g liter^(−1)), SvO[2] is the venous
    Hb oxygen saturation, and PaO[2] is venous oxygen partial pressure.


    #### 6.3.2.4 Acute Respiratory Distress Syndrome


    ARDS is a condition that causes fluid to occupy the lungs to make oxygen not to
    reach the other organs. Fluid leaks from small blood vessels collect as tiny air
    sacs in the lungs to make the blood not to carry enough oxygen to the rest of
    the body. Organs such as kidneys or brain might not work the way as intended and
    result in life-threatening ARDS. Oxygen consumption is dependent on oxygen delivery
    over a wide range of oxygen delivery values in acute respiratory failure. This
    dependency phenomenon is much stronger in ARDS than in respiratory failure due
    to other causes. Due to the abnormal dependency of oxygen consumption on oxygen
    delivery, changes in the oxygenation status may not be reflected by changes in
    mixed venous oxygen saturation in ARDS. Patients with ARDS on mechanical ventilation
    with PEEP, oxygen delivery, and oxygen consumption are linearly related except
    at high levels of oxygen delivery.


    With the help of pulse oximeter device, the following attributes are collected
    and analyzed in edge gateway:


    1.  ID


