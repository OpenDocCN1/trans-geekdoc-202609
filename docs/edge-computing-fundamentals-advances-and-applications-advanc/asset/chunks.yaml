    *   `Data Streams`（数据流），也被称为元组（tuples），由传感器和雾设备发射，以便传输到上层进行通信。数据流也从应用模块传输到执行器。它通过
    `tuple` 类实现，其特征是其类型以及源和目标应用模块。它包含了 `tuple` 中的数据长度和处理需求。


    *   `Monitoring layer`（监控层）跟踪资源使用情况、功耗以及设备/资源的可用性。该层的输出被资源管理层使用。每个设备都维护其使用统计数据并报告给监控层。该层还可以预测设备性能。`FogDevice`
    类中的 `executeTuple()` 方法包含了 `tuple` 处理逻辑，设备在该处更新其资源使用情况。这些统计数据也可以封装在 `tuple` 中并发送到资源管理层。


    *   `Resource management layer`（资源管理层）用于管理各种资源。它根据静态 QoS 要求识别要分配给特定应用程序的资源（雾计算/IoT
    层设备）。资源分配可以是集中式的、分布式的或混合式的。


    *   应用（编程）模型。应用程序被建模为模块的集合。这些模块可以生成可供另一个模块使用的数据。这种关系可以表示为有向图，顶点形成模块，有向边表示模块之间的信息流。处理模型可以分类为：


    *   感知-处理-执行模型（Sense-process-actuate model），来自传感器的信息被传输到雾设备进行处理。处理结果随后被用于驱动环境。


    *   流处理模型（Stream-processing model）。雾设备集群处理由传感器设备发射的实时数据流。结果存储在雾层中。


    ![图 2.8 iFogSim 架构。](img/fig2_8.jpg)


    图 2.8 iFogSim 架构。


    该层使用以下类实现：


    *   `AppModule` 类维护雾应用的的处理单元。它实现了 DAG（有向无环图）的顶点。`AppModule` 实例处理传入的 `tuple` 并生成输出元组，并发送到
    DAG 中的下一个模块。


    *   `AppEdge` 类维护一对应用模块之间的数据依赖关系。每条边的特征是其携带的 `tuple` 类型，该类型通过 `AppEdge` 类的 `TupleType`
    属性捕获，并带有封装在这些元组中的处理需求和数据长度。


    *   `AppLoop` 实例指定用户提供的应用程序循环。它包含一个从循环起点到循环终止模块的模块列表。


    ### 2.7.3.1 在 iFogSim 仿真器中创建拓扑和执行应用程序


    本节详细说明了在 `iFogSim` 上的拓扑创建和执行：


    *   安装 Eclipse IDE

    *   从 CloudsLab 链接下载并解压 `iFogSim`

    *   在 Eclipse IDE 中创建一个 java 项目，添加 `FogSim` 路径

    *   在 `src` → `org.fog.gui.example` → `FogGui.java` 下并作为 Java 应用程序运行。雾拓扑创建器被打开。可以创建新拓扑，也可以通过导入打开现有拓扑。

    *   考虑视频监控案例。摄像头是传感器。根据对摄像头感知的图像的分析，执行器启动动作。初始化四个传感器和四个执行器。摄像头扫描的图像用于运动检测、用户界面、物体检测和物体跟踪。运动检测在
    `IoT-Device` 中完成，而其他动作……


    在创建拓扑时，会考虑 `name`、`type`、`uplink`、`downlink`、`MIPS`、`RAM` 和 `rate`。当选择 `sensor`
