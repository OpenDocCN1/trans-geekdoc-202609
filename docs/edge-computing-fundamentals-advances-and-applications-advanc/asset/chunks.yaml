    ### 6.3.4. Case Study III: Body Composition Scale to Detect Heat Index in Edge
    Server


    Physical fitness is more important to be considered in day-to-day life. Body compositions
    such as weight, `BMI`, body fat, lean mass, humidity, and indoor temperature are
    to be calculated to maintain a healthy life. Body composition scale is a measuring
    scale that is used to measure body compositions using bio-impedance. Bio-impedance
    is the common method used by household scales to calculate body composition. This
    device uses the bio-impedance method using four conductors to determine the hindrance
    of electrical flow through the body, and uses that to calculate the total body
    water. From total body water, it estimates nine data points. The nine data points
    measured by this device are weight, `BMI`, body water, lean mass, muscle mass,
    visceral fat, and daily intake. This device has separate sensor for indoor temperature
    and humidity, so thermostat can be adjusted to keep the body in optimal condition.
    The measured humidity and indoor temperature values are transmitted to edge server
    for analysis of data. Humidity and indoor temperature are used to measure heat
    index that may range from `27°C` to `57°C`. An increase in humidity and indoor
    temperature leads to an increase in heat index that results in health problems
    such as fatigue, heat exhaustion, and heat stroke. These health effects vary according
    to the heat index range. The heat index is calculated by the relative proportion
    of humidity and indoor temperature.


    Borga et al. proposed a brief overview of common non-invasive techniques for body
    assessment method based on fat-referenced quantitative MRI. For whole-body measurements
    of adipose tissue (`AT`) or lean tissue (`LT`), DXA and quantitative MRIs are
    comparative with respective linear correlations. But the agreement was found significantly
    lower for visceral adipose tissue [[11](#ch06.xhtml#ref6_11)]. Bos et al. proposed
    two models for predictive analysis in health care as Cox Proportional Hazard Model
    and Logistic Regression Model. They proposed FHE scheme for the standard way of
    encrypting bitwise. Functions of these regression models can be approximated by
    polynomial expressions in integer values. The advantage of this approach is that
    a single ciphertext contains much more information than just a bit of plaintext
    [[12](#ch06.xhtml#ref6_12)].


    #### 6.3.4.1 Heat Index


    Heat index is defined as the amount of heat consumed or measured in the surrounding
    area. Heat index is calculated with relative humidity and indoor temperature that
    is measured either in Celsius or Fahrenheit [[13](#ch06.xhtml#ref6_13)]. The heat
    index is calculated to identify the damage of excessive heat in human body. The
    formula used for calculating heat index in Celsius is:


    $$HI = c[1] + c[2]T + c[3]H + c[4]TH + c[5]T^2 + c[6]H^2 + c[7]T^2H + c[8]TH^2
    + c[9]T^2H^2(6.6)$$


    where

    `HI` – heat index (`°C`),

    `T` – temperature (`°C`),

    `H` – humidity (%),

    `c[1]` = -8.78469475556,

    `c[2]` = 1.61139411,

    `c[3]` = 2.33854883889,

    `c[4]` = -0.14611605,

    `c[5]` = -0.012308094,

    `c[6]` = -0.0164248277778,

    `c[7]` = 0.002211732,

    `c[8]` = 0.00072546,

    `c[9]` = -0.000003582


    The heat index may range from `26°C` to `54°C` and above. The heat index gradually
    increases with the increase in temperature (`°C`) and humidity (%). The heat index
    is directly proportional to temperature and humidity and increases within a particular
    range of temperature and humidity. The causes and effects of various heat index
    are shown in [Table 6.6](#ch06.xhtml#table6_6). An extreme range of heat index
    may lead to many health problems such as fatigue, heat exhaustion, heat cramps,
    heat stroke, and death, as well as increases pre-existing chronic conditions such
    as respiratory, cerebral, and cardiovascular diseases.


    #### Table 6.6 Causes and Effects of Heat Index


    | Celsius | Causes | Effects |

    | --- | --- | --- |

    | 26–32°C | Caution | Tiredness, anemia, chances of heart failure |

    | 32–41°C | Extreme caution | Painful muscle cramps, cramps in abdomen, and calves
    |

    | 41–54°C | Danger | Dehydration, chances of obesity |

    | Over 54°C | Extreme danger | Heat stroke – Chance of heart disorders |


    #### 6.3.4.2 Heat Index Analysis in Edge Server


    The attributes collected from the device are shown in [Table 6.7](#ch06.xhtml#table6_7).
    Out of the attributes collected, humidity and indoor temperature values are considered
    in this case study to analyze the heat index value of an individual. The computed
    heat index value is added for future reference and to send notification to the
    individual from the edge server. Finally, the required values based on the dependency
    transmitted to cloud server.


    #### Table 6.7 Data Collected via Body Composition Scale


    | ID || Gender || Weight || Lean Mass || Height || Age || BMI || Humidity || Indoor
    Temp |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1 || 11 || 96 || 66 || 174 || 23 || 32 || 40 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 2 || 11 || 87 || 67 || 189 || 22 || 24 || 55 |

    | 3 || 3 || 110 || 67 || 185 || 22 || 32 || 78 |

    | 4 || 3 || 104 || 70 || 195 || 26 || 27 || 62 |

    | 5 || 11 || 61 || 45 || 149 || 24 || 37 || 46 |

    | 6 || 11 || 104 || 74 || 189 || 24 || 29 || 56 |

