    ## 感知层

    它由边缘设备组成。边缘设备是一种为了有效执行特定任务而设计的特殊用途且高效益的硬件。边缘设备的计算/存储资源有限。此类设备的示例包括转换器、传感器、执行器、日志记录器和摄像头，它们具有收集和/或传输数据的功能。某些边缘设备具备执行额外活动的处理能力。对于这些设备收集的图像、视频、文本数据的分析应用，需要根据资源的可用性进行部署和管理
    [4]。


    ## 网络层

    它负责连接设备、边缘系统和云系统。它由各种通信和数据传输协议组成。


    ## 边缘计算层

    该层的主要组件包括边缘服务器和网关。与 `IoT` 设备相比，边缘服务器具有更高的计算/存储能力。在资源受限的边缘设备中无法执行的负载可以使用这些通用计算节点或节点集群完成。该层中的边缘网关执行专门的网络功能，包括协议映射、网络终止、隧道技术和防火墙保护。


    ## 应用或处理层

    该层负责执行复杂的数据密集型任务并存储海量数据。该层中的私有云或公共云服务器充当节点间共享数据的仓库。云服务器执行无法托管在边缘服务器上的复杂数据密集型/计算密集型应用。云服务器还用于边缘节点的资源分配和作业管理。


    除了上述组件外，还需要为用户提供合适的界面，以便对系统进行监控、管理和交互。下一节将提供边缘计算系统的详细架构。


    ## 2.2 边缘计算架构

    通过将边缘计算和云计算范式视为互补，可以在它们之间实现协同效应。边缘服务器可以在靠近数据源的地方处理延迟感知计算。共享的全局计算/存储、管理和数据隐私可以在云服务器中有效处理。图
    2.1 讨论了通用边缘计算模型的各个层级。图 2.2 在考虑边缘服务器网络的情况下提供了更详细的视图 [5]。


    ![图 2.2 边缘计算 – 详细架构。](img/fig2_2.jpg)


    图 2.2 边缘计算 – 详细架构。


    ### 2.2.1 边缘设备

    边缘设备提供了收集数据和执行本地处理的能力。它们包括传感器、摄像头、录音器、麦克风和执行器。这些设备的计算和存储能力有限，但可以执行基础任务和数据过滤。


    ### 2.2.2 边缘服务器集群

    当考虑服务器集群时，与单个设备相比，它提供了更高的计算和存储能力。该层处理资源密集型应用，例如无法在设备边缘处理的视频/文本分析。资源供给服务根据监控、分析、预测服务和用户需求提供的信息，为各种任务动态分配云资源和边缘资源。


    ### 2.2.3 云服务器

    服务器用于执行复杂计算、资源分配与管理、数据摘要以及安全数据存储。云端软件框架定义的资源管理提供中间件服务，用于管理整个系统的资源并维护应用程序的服务质量。这些服务旨在通过在设备、边缘服务器或云层中为任务选择合适的资源，来平衡应用的延迟和成本。该层提供的某些服务包括：


    *   数据管理服务用于访问存储在各种 `SQL` 和 `NoSQL` 数据存储器中的信息。

    *   监控服务跟踪整个系统中应用程序和资源的当前状态。

    *   知识库维护有关资源/应用程序需求的历史信息。

    *   分析器（Profiler）根据知识库中的历史信息以及从监控服务获取的当前信息创建资源/应用程序配置文件。

    *   性能预测服务根据资源需求的历史信息预测资源利用率和性能。这反过来会影响应用程序性能。

    *   安全服务为各种应用程序提供所需的身份验证、授权和机密性。


