    对于人体体能的健康状况而言，使用体成分计计算出的体成分是每天需要考虑的重要指标。湿度和室内温度的升高会导致热指数增加，从而引发许多健康问题。根据体成分计提供的湿度和温度值，在边缘服务器中计算并分析热指数，以识别热指数对个人的影响。


    为了促进私有信息的安全存储以及对急性呼吸窘迫征（ARDS）、低血压和热指数的高效预测，在边缘网关/服务器中集成并分析了 FHE 方案。


    ### 6.3.1 设备与设置


    为了执行这些案例研究，考虑了血压计、脉搏氧仪和体成分计。这些设备连接到 Dell Edge Gateway 5100 系列网关，配置为 1.33 GHz Intel
    Atom-E3825 CPU、Ubuntu Core 16 操作系统、2GB DDR3L-1067 MHz 内存以及 32GB 固态硬盘，以实现高效处理。此外，网关连接到中央云服务器。


    ### 6.3.2 案例研究 I：通过脉搏氧仪在边缘服务器中检测 ARDS


    在人类生活中，氧气对于呼吸至关重要，因为人体利用氧气来燃烧食物分子。氧气必须从大气中高效运输到组织中，以维持正常的代谢。例如，入院的 COVID-19 患者报告了无法正常思考、味觉灵敏或头痛等症状，这是由于血液中
    CO[2] 浓度升高对肺部造成损伤导致的。在这种情况下，血氧仪可以发出报警。脉搏氧仪是一种小型夹子状设备，通常固定在手指等部位。脉搏血氧测定的目的是检查心脏向全身泵送氧气的效率。它可以用于监测患有任何类型疾病的健康状况，例如
    ARDS、慢性阻塞性肺疾病（COPD）、哮喘、肺炎、肺癌、贫血、心肌梗死或心力衰竭，以及先天性心脏缺陷，这些疾病都会影响血氧水平。FHE 方案被用于加密并对加密数据进行分析，以预测该人员是否受到
    ARDS 的影响。


    吴素素和李卫东在 2009 年提出了一种将从许多节点数据路由到单个接收设备的系统。两个医疗传感器（即心率传感器和脉搏氧仪）在网络中互连，以收集心率和脉氧仪值。监测设备使用
    MSP430 微控制器和 LCD 屏幕显示数值，通过 RS232 串口端口连接到 WSN 节点，并传输到边缘网关，最终传输到云服务器 [6]。


    #### 6.3.2.1 脉搏血氧


    脉搏血氧是一种简单且无侵入的方法，用于检查身体各部位的氧饱和度（SpO[2]）。脉搏血氧被认为是患者检查 O[2] 饱和度的合适替代方案，因为它减少了分析动脉血气过程中的出血频率。在持续监测患者和检测低氧方面，快速、方便和高准确性是脉搏血氧的其他特征。它通过检测动脉血中氧红蛋白和脱氧红蛋白的含量，并将其体现为氧红蛋白饱和度，这是动脉氧饱和度（SaO[2]）的间接估计。


    #### 6.3.2.2 氧输运 (DO[2])


    全身氧输运（DO[2]）是从肺部输送到全身的氧气量 [7,8]。它是总血流量或心输出量（CO）与动脉血氧含量（CaO[2]）的乘积，通常用 ml min^(−1)
    表示，并使用公式描述：


    `DO[2] = CO * CaO[2]` (6.1)


    动脉血氧含量（CaO[2]）使用公式描述：


    `CaO[2] = (k1 × Hb × SaO[2]) + (k2 × PaO[2])` (6.2)


    其中 Hb 是血红蛋白浓度（g liter^(−1)），SaO[2] 是动脉 Hb 氧饱和度，PaO[2] 是动脉氧分压，k1 是表示 Hb 氧结合能力的
    Hufner 常数，其值介于 1.34 到 1.39 之间，k2 是血浆中溶解氧的量。对于我们的研究，k1 取值为 1.34，k2 取值为 0.0031。


    #### 6.3.2.3 氧耗 (VO[2])


    全身氧耗（VO[2]）是组织每分钟消耗的氧量 [7,8]。在有氧条件下，氧气被消耗以产生能量，因此 VO[2] 对应于代谢率，并使用公式描述：


    `VO[2] = CO * CaO[2]` (6.3)


    静脉血氧含量（Cv[2]）使用公式描述：


    `Cv[2] = (k1 × Hb × SaO[2]) + (k2 × PaO[2])` (6.4)


    其中 Hb 是血红蛋白浓度（g liter^(−1)），SaO[2] 是动脉氧饱和度，PaO[2] 是动脉氧分压。


    #### 6.3.2.4 急窘综合征


    ARDS 是一种导致液体占据肺部使氧气无法到达身体其他部分的状况。由于氧耗，氧合可能反映以下属性：


    1. ID

    2. 血红蛋白 (HGB)

    3. 动脉氧饱和度 (SaO[2])

    4. 静脉氧饱和度 (Sv[2])

    5. 动脉氧分压 (PaO[2])

    6. 静脉氧分压 (Pv[2])

    7. 心输出量 (CO)


    从脉搏氧仪接收的数值所示表 6.1。


