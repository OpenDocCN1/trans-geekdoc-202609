  raw: 'Hydra is a service oriented middleware. It operates between the applications
    and operating system layers. The middleware provides a web service interface to
    interact with the physical devices like sensors, actuators, and transducers transparent
    to their underlying communication technologies like Bluetooth, RF, ZigBee, RFID,
    WiFi, etc. Semantic description of these devices is provided through OWL, OWL
    –S. Each device is considered as a service. The service is exposed through interfaces.
    User can interact with the devices through these interfaces. Hence the details
    of the devices including their communication mechanism are abstracted from the
    users through these interfaces. Hence all the functional components that include
    protocol, device, syntactic and semantic interoperability are provided by Hydra.
    The various layers include:


    *   Network layer to manage communications among heterogeneous devices using various
    communication protocols. SOAP tunneling can be used.


    *   Security layer provides various security services like authentication and
    authorization.


    *   Semantic services layer provides the context and policy management services.


    *   Services layer offers services to manage ontology, events, devices, orchestration
    of jobs, storage, and diagnostics.


    #### 2.6.1.2 Aura


    Aura aims to provide high-level APIs to interact with various heterogeneous devices.
    AURA does not provide interface protocol layer and device abstraction layer. It
    provides application abstraction as well as context management layers. Hence all
    the functional components that include protocol, device, syntactic and semantic
    interoperability are provided by AURA. Data analysis capability is also provided.
    The components of AURA include:


    *   Task Manager: Provides a platform-independent abstract service for end-users
    tasks. The end-user can thus execute the task in different environments. For example
    to edit a document, AURA can use editors available in the operating environment-for
    windows notepad and for Unix Emacs can be used.


    *   Service Supplier: composes the tasks to form an end-user''s request. It maps
    the abstract service descriptions to application-specific settings. An abstract
    text editor interface may be mapped onto Notepad if Windows environment is used
    or Emacs if Unix environment is used.


    *   Context Observer: gathers information about physical context. Different devices
    have different sensing capabilities. Based on this the context observer gathers
    information for Task and Environment managers.


    *   Environment Manager: is knowledgeable of the services provided by the suppliers
    and their deployment. Based on this knowledge, it maps suitable services to the
    context observer component.


    #### 2.6.1.3 TinyDB


    TinyDB middleware enables users to interact with the devices without knowing its
    specifications. For this purpose, TinyDB provides Domain Specific Language (DSL)
    for end-users to interact with devices. DSL is a query language that supports
    selection, join, projection, and aggregation operations. It allows an end-user
    to get information about the time, place, type, and method of sampling in an embedded
    sensing environment.


    #### 2.6.1.4 FiWare


    Context information is collected by FiWare from sensors using REST APIs. Context
    broker collects this context information and provides facilities to store and
    query the same. FiWare middleware works on publish-subscribe architecture. Consumers
    can subscribe to the information published by the brokers. Context adapters act
    as data transformers for the subscriber. Applications use APIs to query, analyze
    and mine context information collected by the context broker. Visualization facilities
    are also provided.


    ### 2.6.2 Application Interfaces


    In previous sections, we have been considering the three major functional components
    of an IoT system – sensors, communication, and data processing extensively. Information
    processed in the cloud/edge device has to be delivered to the end-user. This is
    done with a user interface \[3\]. The end-user interacts with the system using
    user interfaces comprising of user screens, web pages, buttons, icons, and forms.
    Such UI can be used to administer, manage, and control the IoT devices. Configurations
    for various devices can be provided and managed through a central portal/interface.
    Each IoT system deployment can also provide a separate interface. The type of
    interactions that the user can have at the front end with the IoT device depends
    on the use case. Some common types of interactions include


    *   Receiving automatic notifications or alerts through SMS, email services.


    *   Monitoring information from the asset proactively using suitable interfaces
    for data from the sensors.


    *   Controlling the IoT system remotely using suitable interfaces for the actuators


    *   Promoting interoperability with heterogeneous devices, browsers, or operating
    systems of the end-users.


    *   Improving the overall experience of the user with the product.


    Some of the issues to be considered while designing UIs for IoT include:


    *   **Simplicity:** The information delivered to the user should be simple and
    should meet his specific needs. Suitable visualization techniques should be provided
    to improve understandability of the user.


    *   **Performance:** As data from IoT devices is voluminous, UI should be designed
    for scalability. Suitable summarization and visualization techniques should be
    used to improve the performance of the UI.


    *   **Sensor connectivity:** Data from sensors may be transferred to the processing
    applications continuously or in time intervals. Suitable interfaces should be
    provided to the user to indicate the status of the data transfer.


    *   **Interoperability:** Capability to connect different UI with heterogeneous
    sensors.


    Front-end technologies commonly used to implement user interfaces include:


    *   **Angular:** is a JavaScript-based open-source, client-side Web application
    framework. Developers can create dynamic single-page web applications based on
    model-view-controller (MVC) architectural pattern and HTML.


    *   **Node:** is an open-source, cross-platform event-driven runtime environment
    on the server-side. It is used to build fast, scalable, single-threaded server-side
    and client-side networking applications.


    This chapter had provided an in-depth discussion on various components of an edge
    computing system including – sensors, networking components including protocols
    and network management, edge servers, cloud servers, user interfaces, and middleware
    to support heterogeneity. Creating such a complex edge computing environment is
    difficult for study purposes. So the following section discusses the simulators.


    ## 2.7 Edge Computing Simulators


    Testing solutions in real IoT and edge computing environments is not feasible
    due to the high cost and diverse domain knowledge required to reason the results.
    Simulation makes it possible to evaluate the various strategies and algorithms
    in a repeatable, controlled, and cost-effective way. Tested solutions can then
    be deployed. There are a number of edge computing simulators \[[11](#ch02.xhtml#ref2_11)\].
    This section discusses the features and architecture of commonly used edge simulators
    such as PureEdgeSim, iFogSim, and IoTSim-Edge \[[12](#ch02.xhtml#ref2_12)\].


    ### 2.7.1 PureEdgeSim


    PureEdgeSim is a java based simulation framework for performance evaluation of
    cloud, fog, and pure edge computing environments. PureEdgeSim is based on CloudSim.
    Performance measurement can monitor network usage, latency, resources utilization,
    and energy consumption. Some of the features of PureEdgeSim include:


    *   Capability to simulate heterogeneous devices


    *   Scalability to thousands of devices


    *   Support for device mobility


    *   Realistic network, mobility, task generation, and energy models


    *   Ease of use and visualization


    *   Support for variety of scenarios related to IoT, VANET, MANET, Clouds, Edge,
    and Mist computing environments.'
