- fmt: '

    Data privacy, also referred to as information privacy, is used to protect the
    privacy of data such that illegal user must not own data access. Proper mechanisms
    of reasonable importance must be adopted for collecting, sharing, and using the
    data, especially when dealing with personal data. Any sector must have the responsibility
    in providing:


    * Proper consent in collection data especially individuals

    * Assurance of data quality

    * Lucid statement/agreement for data collection

    * Purpose for data collection

    * Assurance for data protection

    * Transparency in policies and procedures

    * Accountability statement


    Various privacy-preserving techniques were devised and deployed to safeguard the
    personal data abiding the regulations such as `K-anonymity`, `L-diversity`, `T-closeness`,
    randomization, and cryptographic techniques. Probabilistic public-key encryption
    is considered as one of the technical approaches that preserves the data privacy
    efficiently. An improvised method is proposed by incorporating ranked keyword-based
    searching. Such a scheme is more appropriate to edge-cloud environment by providing
    high level of scalability.


    ### 4.4.2 Location Privacy


    Location privacy is the individual’s right to decide when and for what purposes
    the information can share with others. Maintaining the privacy preservation of
    location of the users is a rudimentary process in edge environment. If proper
    measures are not taken, adversaries perform various attacks, such as


    * User profiling

    * Political/religious discrimination

    * Denial of service

    * Physical attacks

    * Illegal advertisement


    Constructing a secure positioning protocol with location privacy in the bounded
    retrieval mode is one of the finest options to preserve the location privacy.
    Several approaches exist and preserve location privacy via dummy location updates,
    distributed cache proxy servers, creating fake locations to the attackers, obfuscation-based
    techniques by ensuring high level of scalability.


    ### 4.4.3 Identity Privacy


    Identity/users privacy is the one that safeguards the user’s privacy without sacrificing
    the quality. It is one of the highest challenges one must take care of as many
    businesses are grooming to track end consumers’ behavior and to market it. In
    recent times, mushroom of brokering agents used to consolidate and sell personal
    information of individuals to the competing companies/government agencies. The
    best way to maintain identity privacy is by limit profiling. Dynamic credential
    generation, cross-domain trusted third-party managerial authentication is considered
    as the best possible approach to maintain identity privacy of the users. Most
    of the protocols support ad hoc mobile environment and recent researches are stepped
    into fog-mobile computing environment.


    ## 4.5 Edge-Based Attack Detection and Prevention


    Major attack-based challenges involved in edge computing are privacy leakage,
    denial of service attacks, unauthorized access by adversaries and data tampering.
    To process the massive data efficiently by satisfying confidentiality and privacy
    properties and to provide mutual authentication, traditional schemes are no longer
    suitable. External or internal adversaries on gaining access may abuse the privileges
    assigned. Unauthorized access can be eliminated by applying novel authentication
    mechanisms like cross-domain authentication and handover authentication. By deploying
    servers at the edge of the network, conventional denial of service and its associated
    attacks can be prevented. Another highest challenge is the data tampering and
    physical assaults on edge infrastructure. Stringent physical protection must be
    provided for the edge infrastructure and to evade data tampering modern confidentiality
    schemes with its core benefits are discussed in `[Section 4.2](#ch04.xhtml#sec4_2)`.
    For safe and secure conversion of one’s public key into another, proxy based a
    third-party access method, namely, `proxy re-encryption` is in practice. Similarly
    to send and receive messages securely in multi-party environment, `attribute-based
    encryption` is preferred. All false/bogus accessing of resources and harmful brute
    force attacks/breaches can be avoided using `honey encryption`. In addition, `homomorphic
    encryption` is used to avoid data breaches and invasive attacks in edge environment
    by performing all kinds of operations upon encrypted data rather than on plain
    text. Privacy leakage is considered another key threat in edge system. To detect
    privacy leakage complete surveillance must be maintained and robust modern privacy-preserving
    mechanisms must be adopted alike located based privacy scheme. Thus, by applying
    the above-discussed methods in edge computing systems multi-source data processing
    is performed in a safe and secure manner without compromising the transmission
    speed. It also provides rich user experience and mobility support.


    ## 4.6 Conclusion and Future Research Directions


    In this chapter, edge computing data storage systems are discussed in detail with
    figures and illustrations wherever necessary. Contemporary data confidentiality
    schemes working principle, challenges, and its countermeasures are elaborated
    for a holistic edge computing environment. Definition of `homomorphic encryption`,
    functions, properties and its applications are analyzed and presented in detail
    for the upcoming researchers. The later part analyzes the modern authentication
    mechanisms and privacy-preserving schemes for solving verification and privacy
    issues in edge framework. Open research areas of data security and privacy in
    edge computing is detailed in `[Section 4.5](#ch04.xhtml#sec4_5)`. Future research
    may shed light on devising distributed lightweight authentication and encryption
    schemes that are more suitable to edge systems. Another highest challenge in existing
    privacy-preserving schemes is the dynamic update functionality. Searching speed
    and accuracy can be enhanced in multi-party, multi-user in different trust domains.
    During offloading process, a verifiable computing procedure may be adopted to
    increase the computational accuracy.


    ## References


