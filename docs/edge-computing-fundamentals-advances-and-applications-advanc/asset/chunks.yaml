    # 2 边缘计算及其核心要素


    DOI: [10.1201/9781003230946-2](https://doi.org/10.1201/9781003230946-2)


    ## 2.1 引言


    考虑一个带有视频摄像头的智能建筑，用于检测人员的移动。视频信号持续流到云端服务器。云服务器中的运动检测应用可以检测特征并将其存储到数据库中。由于大量视频数据持续流到云端，会消耗大量的网络带宽。云服务器还必须同时分析来自所有摄像头的视频片段。如果运动检测应用能够在靠近摄像头的地方执行，这些问题就可以得到解决。届时，只需将所需的片段传输到云端进行进一步的分析和存储。


    传统上，从各种传感器收集的实时数据被上行到云服务器进行进一步的处理和存储。云基础设施非常适合处理此类海量的不断变化的异构数据（也称为大数据）。但当数据源分布在多个地点且需要在近实时完成处理时，远端云基础设施中大数据处理就会失败。这促使了对替代范式的需求，该范式能够在更靠近传感器或数据源的地方执行计算。位于网络边缘的此类基础设施能够执行低延迟计算，聚合数据，然后将其传输到云端进一步分析。此外，来自云的下游响应也会返回给这些节点。根据网络覆盖，网络边缘可以是一个房间、一栋建筑或一个校园。


    使用边缘计算基础设施在数据源附近实时处理物联网（IoT）设备产生的量数据变得至关重要。这不仅减少了计算延迟和网络资源的使用，还加强了数据安全。本节讨论了边缘计算范式通过技术准备阶段、快速增长阶段和稳定阶段的演变
    [1]。


    技术准备阶段始于内容分发网络（CDN）。具有地理分布缓存服务器的 CDN 使用户户能够访问最近的服务器（1998 年）。网络流量和延迟降低了。虽然 CDN
    强调数据缓存，但边缘计算侧重于函数缓存。2005 年，函数缓存被应用于个性化邮箱管理以减少延迟。Cloudlet（2009 年）被用于将云信息向下传输网络边缘。边缘数据处理最初始于移动设备（2010
    年）。移动边缘计算（MEC）强调在云服务器和边缘设备之间建立边缘服务器以卸载计算。雾计算的概念由思科（2012 年）提出。雾计算侧重于一个虚拟化的计算平台，将云任务迁移到网络边缘。雾计算旨在优化基础设施层面的通信，而边缘计算（2013
    年）则侧重于设备、边缘服务器和云服务器层的计算和网络资源。云海计算强调系统的云端和人类/物理世界端。但边缘计算关注的是云与物联网设备之间的通信路径（上行和下游）。


    2015 年以来，边缘计算引起了工业界和学术界的更多关注。2015 年，边缘计算在《边缘计算：愿景与挑战》白皮书中获得了正式定义。论文将边缘计算定义为一种可用技术，允许在网络边缘执行计算，代表云服务处理下游数据，并代表物联网服务处理上行数据。2016
    年，美国国家科学基金会（NSF）合作建立了无线边缘网络中的信息中心网络（ICN-WEN）。NSF 大挑战研讨会（2016 年）和中国边缘计算研讨会（2017
    年）向科学界展示了这项技术。用于物联网边缘计算的通用开源框架 LinuxEdge 于 2017 年构建。2018 年见证了工业界对边缘计算平台的积极参与。边缘计算联盟于
    2018 年成立。第一本关于边缘计算的书也于该年出版。用于云和设备环境的 Kubernetes 由云原生计算基金会（CNCF）和 Eclipse 基金会于
    2019 年联合开发。边缘计算在医疗领域的应用在 Bio-World 议会（2019 年）上受到了关注。这一快速增长趋势预计将在 2021 年趋于稳定。


