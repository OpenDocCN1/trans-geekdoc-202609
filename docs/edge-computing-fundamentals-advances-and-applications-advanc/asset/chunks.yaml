    \ attacks.\n\n##### Design Considerations\n\nBiometrics is private and sensitive\
    \ information. When a variable in smart contract is declared as private, it only\
    \ means that the variable cannot be accessed from another smart contract but can\
    \ be read by external APIs like web3. So, the biometrics cannot be simply stored\
