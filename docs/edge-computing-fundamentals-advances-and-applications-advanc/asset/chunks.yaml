    The smart contract code is compiled into byte code and loaded to EVM. EVM starts
    and executes transactions when the client is started. EVM also guarantees security
    against cyber-attacks. For every user in Ethereum, the Ethereum address is the
    identity and the private key of the user is the password. The wallets are software
    plugins used to store and manage Ethereum accounts. Ethereum account is the combination
    of Ethereum address and private key. Ethereum address is generated by forming
    the public key from private key of the user and calculating the hash value of
    public key using `keccak256` and picking the last 20 bytes of the hashed value.


    Cost is associated with each transaction. Like Bitcoin, Ethereum is P2P digital
    currency. The number of ethers to be paid for a transaction is based on the resources
    used. A transaction to add two numbers requires three units of work. This unit
    of work is called `gas`. Gas price is the price per unit gas. It is fixed by user.
    Miners will pick the transactions with higher gas price. Transaction fee is calculated
    by multiplying gas with gas price spent for a transaction. Gas limit indicates
    the maximum amount of gas a user willing to buy to execute the transaction.


    #### Bitcoin Vs. Ethereum


    - Bitcoin is a blockchain-based cryptocurrency. Ethereum is decentralized programming
    platform with smart contracts and tokens.

    - Bitcoin is designed for financial transactions. Ethereum focuses on other data
    maintenance using smart contract codes.

