- fmt: '

    *   `Data Streams` also termed as tuples are emitted by sensors and fog devices
    to be transferred up the layer for communication. Data streams are also transmitted
    from an application module to an actuator. It is implemented using `tuple` class
    characterized by its type and the source and destination application modules.
    It includes the length of data in `tuple` and processing requirements.


    *   `Monitoring layer` keeps track of the resource usage, power consumption, and
    device/resource availability. The output of this layer is used by the resource
    management layer. Each device maintains its usage statistics and reports to the
    monitoring layer. This layer also predicts a device performance. The `executeTuple()`
    method in the `FogDevice` class contains the `tuple` processing logic where the
    device updates its resource use. These statistics can also be encapsulated in
    a `tuple` and sent to the resource management layer.


    *   `Resource management layer` is used to manage various resources. It identifies
    the resources (fog/IoT layer devices) to be allocated to a particular application
    based on its static QoS requirements. Resource allocation can be centralized,
    distributed, or hybrid.


    *   Application (programming) models. An application is modeled as a collection
    of modules. These modules can generate data that can be used by another module.
    This relationship can be represented as a directed graph with vertices forming
    the modules and the directed edges representing the flow of information between
    the modules. Processing models can be categorized as:


    *   Sense-process-actuate model where information from the sensors is transmitted
    to fog devices for processing. The result of processing is then used for actuating
    the environment.


    *   Stream-processing model. A cluster of fog devices process real-time data streams
    emitted by the sensor devices. The result is stored in the fog layer.


    ![Figure 2.8 Architecture of iFogSim.](images/fig2_8.jpg)


    [Figure 2.8 Architecture of iFogSim.](#ch02.xhtml#fg2_8)


    This layer is implemented using the following classes:


    *   `AppModule` class maintains the processing elements of fog applications. It
    realizes the vertices of the DAG. An `AppModule` instance processes a coming `tuple`
    and generates output tuples that are sent to the next modules in the DAG.


    *   `AppEdge` class maintains the data dependency between a pair of application
    modules. Each edge is characterized by the type of `tuple` it carries, which is
    captured by the `TupleType` attribute of `AppEdge` class along with the processing
    requirements and length of data encapsulated in these tuples.


    *   An `AppLoop` instance specifies application loops given by the user. It contains
    a list of modules starting from the origin of the loop to the module where the
    loop terminates.


    ### 2.7.3.1 Creating Topology and Executing an Application in iFogSim Simulator


    Topology creation and execution on `iFogSim` is elaborated in this section:


    *   Install Eclipse IDE

    *   Download and unzip `iFogSim` from CloudsLab link

    *   Create a java project in Eclipse IDE, add `FogSim` path

    *   Under `src` → `org.fog.gui.example` → `FogGui.java` and run as java application.
    Fog Topology creator is opened. New topology can be created or an existing topology
    can be opened by importing.

    *   Consider a case of video monitoring. Cameras are sensors. Based on the analysis
    of images sensed by the cameras, actuators initiate actions. Four sensors and
    four actuators are initialized. The images scanned by the cameras are used for
    motion detection, user interface, object detection, and object tracking. Motion
    detection is done in the `IoT-Device`, while, other actions...


    While creating the topology, `name`, `type`, `uplink`, `downlink`, `MIPS`, `RAM`,
    and `rate` are considered. When `sensor` is selected, `name`, `type` are entered.
    For `actuators`, the `edge` connection is shown in `2.9`.


    ![Figure 2.8 Architecture of iFogSim.](images/fig2_8.jpg)


    [Figure 2.8 Architecture of iFogSim.](#ch02.xhtml#fg2_8)


    ![Figure 2.9 Architecture of iFogSim.](images/fig2_9.jpg)


    [Figure 2.9 Architecture of iFogSim.](#ch02.xhtml#fg2_9)


    ![Figure 10.0 Architecture of iFogSim.](images/fig2_10.jpg)


    [Figure 10.0 Architecture of iFogSim.](#ch02.xhtml#fg2_10)


    ![Figure 11.0 Architecture of iFogSim.](images/fig2_11.jpg)


    [Figure 11.0 Architecture of iFogSim.](#ch02.xhtml#fg2_11)


    ### 2.7.3.2 EdgeCloudSim


    `EdgeCloudSim` ([15](#ch02.xhtml#ref15)) is an open source tool based on CloudSim
    for simulation of networking and computing resources for edge computing. Various
    Modules include:


    *   `Mobility` Module that manages the location of mobile devices based on updating
    `x` and `y` coordinates in a hash table. `Mobility` class is used. Inbuilt model
    is nomadic mobility.

    *   `LoadGenerator` Module: generates tasks for a particular configuration. By
    default task generation models Poisson distribution in `LoadGeneratorModel`.

    *   The networking module manages LAN/WAN parameters for upload/download. By default
    single server queue model is inbuilt in `NetworkModel`.

    *   `EdgeOrchestrator` Module: decides the resources to handle incoming requests.
    A probabilistic handler is inbuilt in `EdgeOrchestrator` class for this purpose.

    *   Core Simulation Module is responsible for loading and running Edge Computing
    scenarios from the configuration files. It also saves results of execution in
    a file.


    ## 2.8 Research Directions


    As edge computing supports digital transformation and data diversification of
    various industries, by performing actions close to the place of data generation,
    it has become a hot research topic. Some of the directions for research ([16](#ch02.xhtml#ref16))
    include:


    #### Computation offloading

    As IoT devices are resource constrained, more complex computations are usually
    performed in remote clouds. To minimize network transfer latency, computations
    can be offloaded into devices and resources at the edge of the network. Hence
    computation offloading, is the main drive behind edge computing and is highly
    related to task scheduling.


    #### Resource allocation

    Once the offloading decision is made, the computing tasks should be allocated
    to suitable resources. If the subtasks of a job are highly related and indivisible,
    then they are allocated to the same resource at the edge. Otherwise these subtasks
    can be executed on multiple resources on different nodes. Optimal and intelligent
    resource allocation based on storage, computing, network and an energy requirement
    of the tasks is an active research area.

