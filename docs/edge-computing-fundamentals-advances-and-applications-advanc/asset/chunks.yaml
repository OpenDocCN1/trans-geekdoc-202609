    # 6 边缘计算用例与案例研究


    DOI: [10.1201/9781003230946-6](https://doi.org/10.1201/9781003230946-6)


    ## 6.1 用例


    每个组织必须有一个明确的数据存储目标及其架构，以根据优先级/偏好级别维持计划中的用例。组织被要求分析一系列极具前景的用例及其吸引其他利益相关者的倾向。本章描述了几个通过强调机会和值得考虑的问题来充分利用边缘计算系统的部门。刻画用例的方法有很多种，本章局限于最常用的领域/行业/应用。本章将通过详细的插图和工作工作模块，详尽地阐述医疗保健部门的案例研究。


    ## 6.2 边缘计算高潜力用例


    本节详细阐述了驱动现实的高潜力用例 `[1,2]`。以下讨论了少数几个极具前景的用例：


    * 自动驾驶车辆

    * 智能城市

    * 工业自动化

    * 网络功能

    * 游戏

    * 内容交付

    * 金融部门

    * 增强现实/虚拟现实

    * 医疗保健部门


    ### 6.2.1 自动驾驶车辆


    许多汽车行业已开始利用现代技术以智能的方式投入大量资金研发无人驾驶汽车。虽然完全依赖机器是不可能的，但安全运行是一个更好的解决方案。为了高效运行，这些车辆需要从不同的方向、环境和气候条件中收集并分析数据。它应该具有根据先前的经验/学习做出决策的潜力。此外，车辆采取的当前反馈/决策需要发送回由提供商/制造商放置的最近边缘服务器，以便有效运行并与当地政府机构进行通信。其效能基于所收集和分析的数据，用于提供警报并与网络中附近的车辆进行无不一致性的信息通信。涌入的数据必须传输到网络中的车辆，且不能出现带宽不足或延迟问题，以便在边缘支持环境中提供高可靠性。边缘支持的自动驾驶车辆必须具备从过去的决策中学习并做出自发决策的能力。自动驾驶车辆的功能如图`Fig.
    1`所示。


    ```

    ![Figure 1 Autonomous vehicle.](img/fig1.jpg)

    ```


    ### 6.2.2 智能城市


    收集、处理、分析和管理大量数据，以获得对交通、公用事业和其他服务的见解。现有方案在提供即时响应方面存在不足。作为结果，边缘出现并提供了无延迟的解决方案。在未来，人/建筑之间的连接将是主动且响应的。`Google`、`IBM`
    和 `Cisco` 等公司发许多倡议来支持政府。例如，`IBM` 发起了其智能城市挑战以发展城市。


    ### 6.2.3 工业自动化


    制造业是第四次工业革命（俗称为 `Industry 4.0`）的主要受益者。随着 `IoT` 设备及其管理的巨大增长，这一代正处于第五次工业革命的边缘。工业部门数据存储设施和计算的整合实现了最小能量消耗和成本等利益。从各种来源获取数据并进行有效分析有助于行业通过增加生产来变得智能化。对于在低/差带宽下运行的公司，边缘计算被认为是不可替代的解决方案。边缘计算是工业应用更合适的框架，例如`飞机/导弹发射`、`海上钻井平台`、`能源制造`、`欺诈检测`、`物流设备监控`。


    ### 6.2.4 网络功能


    由于数据和设备的剧烈爆炸，每个设备都关联了一个 `IP address` 以用于身份、通信和追溯性。由于互联设备消耗大量带宽，当前的网络功能不足以高效维持过程。边缘网关被认为是减少带宽消耗的最佳解决方案，因为它放置在非常靠近设备的地方。在边缘网关处合理化数据增强了整体功能的有效性。相比之下，必须在`路由器`、`防火墙`和`交换机`上实施改进过程/程序，以在物理或虚拟上维持该功能，因为它在云系统中运行。


