    蜜加密（Honey encryption）是一种通过提供引人注目的外观来吸引攻击者/内部人员的技术，尽管解密密文后获得的是错误的明文。蜜加密源于一次性一密文技术，“蜜”一词指的是虚假/伪资源。该技术受限于高概率，并具有相当合理的统计模型。它的创建目的是保护密码免受有害的暴力攻击/泄露，特别是在金融交易相关的网络服务中。它与格式保持加密（FPE）和格式转换加密（FTE）密切相关
    [8]。蜜加密的一种简单表示见图 4.5。


    ![图 4.5 蜜加密。](img/fig4_5.jpg)


    图 4.5 蜜加密。


    ## 4.2.6 可搜索加密


    以高效的方式对加密数据进行搜索是可搜索加密的基础。对加密数据进行搜索和查询近期引起了研究人员社区的，因为它保证了数据的机密性。这被认为是减少在加密数据库中搜索单词计算开销的有效解决方案。它确保了协作方的数据隐私和可用性。它分为可搜索对称加密和可搜索非对称加密。


    图 4.6 显示了可搜索加密方案的工作原理。加密格式的数据被到服务器。如果用户/数据所有者打算对存储的内容执行搜索操作，将根据关键词执行搜索操作，并在陷门函数（trapdoor
    function）的帮助下返回给用户。陷门是一种用于检索与用户密钥关联关键词的函数。这是一个定义的程序，不会暴露任何与关键词相关的信息。这些方案的安全性取决于离散迪菲-赫尔曼（DDH）问题或双线性迪菲-赫尔曼（BDH）问题
    [9]。在可搜索对称加密中，同一个密钥用于加密、解密和陷门生成；而在可搜索非对称加密中，则采用不同的密钥。作为前提，必须创建一个标签或关键词包，以识别用于特定搜索的消息。


    ![图 4.6 可搜索加密。](img/fig4_6.jpg)


    图 4.6 可搜索加密。


    ## 4.2.7 同态加密


    为了能够直接对密文进行任意数量的任意计算，引入了同态加密。众所周知，Rivest 在 1978 年引入了隐私同态，它允许部分计算。通常情况下，它通过保持它们之间的关联将数据从一个集合转换为另一个集合。“同态”（homomorphic）一词代表“相同结构”。例如，如果我们在密文中相两个数字并解密，输出必须等于在明文中执行相同操作所得的输出。由于操作是在加密数据上进行的，计算开销大大减少，这被认为是同态加密的主要优点。它保证了即使在不可信环境中也能以最短的时间实现透明性、高效的数据处理、数据检索和安全的数据传输。它从更广泛的角度消除了数据泄露/攻击。大多数著名的方案将值表示为整数，并使用加法乘法作为基本操作。第一个可行方案是由
    Craig Gentry 在 2009 年作为其博士论文的成果提出的。该论文为数据处理创造了一个新维度，许多研究人员开始实现新方案以及少数带有形式化安全性证明的
    Gentry 增强/优化方案 [10]。Anitha Kumari 等人提出了用于医疗应用的简单安全同态加密方案 [11] [16]。


    同态加密的常见应用如下：


    * 安全数据存储

    * 数据加密

    * 隐私保护

    * 在加密数据中搜索

    * 多方之间的安全数据通信

    * 支持加密数据中的数据分析

    * 数据查询和检索


    ### 4.2.7.1 同态加密的类型


    同态加密的一般工作原理见图 4.7。存在三种同态加密。类型之间的区别基于在密文中执行的操作的类型和数量。分类如下：


    * 部分同态加密

    * 较部分同态加密

    * 全同态加密


    ![图 4.7 同态加密的工作原理。](img/fig4_7.jpg)


    图 4.7 同态加密的工作原理。


    #### 部分同态加密 (PHE) 和 较部分同态加密 (SHE)


    部分同态加密（PHE）支持一种操作功能（加法或乘法），可以在加密数据上无限制次执行。较部分同态加密（SHE）支持加法或乘法或两者，执行有限次数。RSA、ElGamal、Goldwasser–Micali、Paillier
    和 Boneh–Goh–Nissim 几十年来都是广名的 PHE/SHE 加密系统。全同态加密（FHE）支持加法和乘法两种操作，并执行无限次。在本章中，将考虑并论证
    FHE。


    #### 全同态加密 (FHE)


    FHE 允许无限次无限数量的操作。FHE 的电路是预定义的且无边界的。这为探索更多领域铺平了道路，并受到了本十年研究人员的关注。它允许在加密数据上无限地计算，包括本地（连接智能设备的设备）和离线数据中心（云服务器）。许多算法被设计并实现以提高
    FHE 的准确性和效率。Dijk 等人通过引入引导技术来减少噪声，提出了一种基于实整数计算的非对称加密方案 [12]。FHE 的另一个重大贡献是 NTRU
    方案 [13]。在 NTRU 加密方案中，任意操作基于位于 N-1 次截断多项式环中的对象。基于应用的 FHE 最近工作如下：


    * 提出了一种基于卡米尔定理的高效代数同态加密方案，对整数效果最好。该方案用于电子投票和多方计算等应用。卡米尔加密方案涉及的操作本质上是模运算。

    * 使用同态加密的安全摄影，通过将问题视为加密图像并上传到不可信的云服务器。

    * 提出了一些 HE 方案用于自动和实时监控、自动账单处理、损耗检测、停电预警、供应扰动快速检测、实时能源规划和定价等问题。

    * 提出了 Cox 比例风险模型和逻辑回归模型用于医疗保健领域的预测分析。这是一种位加密数据的标准方法。这些回归模型的函数通过整数值的多项式表达式进行近似。这种方法的优点是单个密文携带的信息比单个明文位多。局限性在于它将可能的操作限制为多项式算术电路。


