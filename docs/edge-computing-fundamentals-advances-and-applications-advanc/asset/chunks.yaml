    # Preface


    The most significant aspect of any product or application is its response time.
    Smart products and applications always come along with connected devices such
    as the Internet of Things (IoT). The immense usage of IoT devices in recent applications
    generates vast data which are used further to predict the future aspects, to prevent
    damages to the system, to detect flaws earlier, to enhance the business productions,
    to improve the quality of the system, and to satisfy customer expectations. Consequently,
    the generation of data will never be treated as useless. By considering the pace
    and quantity of generated data, the cloud platform is the broadly accepted medium
    for processing it. But the major unexpected inconvenience while using cloud platform
    is the downtime. As the cloud platform and its functionalities fully depends on
    Internet, the services may get interrupted unpredictably any time which leads
    to delayed response. Hence, the time-sensitive applications which require on-time
    decision-making might suffer accordingly. Edge computing comes up with a solution
    where the processing is done either on premises or near the source of the data.
    The edge devices placed on the source would process the data as and when it is
    generated so as to provide better services. This process minimizes the data pushed
    on to the cloud for processing. The real-time data analytics can also be applied
    on voluminous data directly on to the edge devices. In order to preserve the confidentiality
    and integrity of the data, several security mechanisms can also be applied on
    to the edge devices.


