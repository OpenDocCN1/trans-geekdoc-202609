    6. Blaze, M., Bleumer, G., & Strauss, M. (1998, May). 分流协议和原子代理加密。在第 17 届国际密码学理论与应用会议上，Espoo,
    Finland, 127–144.


    7. Boneh, D., Sahai, A., & Waters, B. (2012). 功能加密：公钥加密的新愿景。ACM Communications,
    *55*(11), 56–64.


