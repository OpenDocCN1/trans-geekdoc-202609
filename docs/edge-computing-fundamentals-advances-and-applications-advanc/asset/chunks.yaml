    边缘分析是在网络边缘、更靠近连接设备的地方或安装在附近的其他边缘处理软件上对数据进行收集、处理和分析的过程。随着物联网（IoT）和连接设备在系统自动化方面的进步，医疗保健、能源、汽车和制造业等多个行业正在网络边缘产生海量数据。早期的方法是收集这些数据并将其存储在云端或数据中心进行进一步处理。随着数据量的增加，将数据推送到中心化平台并进行处理所花费的时间越来越多
    [5]。这里的目标是在数据的实际源和数据中心之间对数据进行处理和分析。它是针对物联网和云计算系统的一种优化且分布式的机制，可以降低延迟并确保决策及时做出。边缘处的处理设备允许对数据进行分析，并将报告分发给最终用户，以及时防止故障发生。根据应用需求，这些边缘分析可以是描述性分析、诊断性分析或预测性分析
    [8]。


    了解边缘数据分析最适用于哪些场景至关重要！


    对于实时安全，系统监控对于石油钻平台、天然气设施、飞机和 CCTV 摄像头等关键性基础设施至关重要 [1]。为了保护这些关键系统免受任何种灾难的影响，正在开发许多智能设备和功能。边缘分析就是此类解决方案之一，它能够在早期阶段检测故障并报警相关人员采取相应行动。


    让我们考虑一个石油钻平台的场景，它在远离数据中心的海上收集海量传感器数据。边缘分析允许传感器数据访问去中心化平台，从而在离岸进行分析，如果发现故障，可能会关闭故障阀门。这被认为比将数据发送到数据中心或云环境，并在很久之后才获得相同结果更高效的解决方案
    [3]。


    边缘分析提供以下主要优势 [4]：


    *   **降低延迟**：由于数据在源头附近进行处理，可以更快、更及时做出决策。这提高了应用的活跃性和敏捷性。

    *   **可扩展性**：随着网络设备数量的增加，收集和处理的数据量也迅速增加。边缘分析通过提供去中心化的潜力，扩展了处理能力。

    *   **降低存储成本**：数据在存储之前会针对必要信息进行处理。这降低了存储成本，因为对于自动驾驶汽车、交通管理系统等许多应用来说，没有存储存储生成的数据。

    *   **减少带宽**：通过在边缘对数据进行处理，传输到云端的数据相对减少或被过滤。因此，它消耗的带宽较低。

    *   **成本效益**：即使在遥远地区，恢复通常也会更快，因为分析系统中发生的任何故障都可以通过数据分析机制进行预测和避免，从而防止由于故障导致的损失并减少人工干预。因此，边缘分析提供了一种具有成本效益的解决方案。

    *   **保护安全和隐私**：集成机器学习算法可以保护物联网免受各种攻击并防止未经授权的。


    ## 3.9 边缘分析的潜力


    尽管边缘分析是一个蓬勃发展的领域，但它可能无法视为实际大数据分析的替代。物联网结合数据分析在各个应用领域提供了大量的进步。然而，边缘数据分析最大的局限在于它只分析生成的数据的子集，并仅将分析结果传输到云端。其余未处理的数据将丢失且永远不会存储。因此，只有在此类数据丢失可以忽略不计的情况下，才会采用边缘分析
    [7]。


    ## 3.10 边缘分析的架构


    边缘分析是一种通过如图 3.9 所示，在源头附近分析数据来增强物联网和云计算的方法。边缘分析旨在以更优化的方式访问计算资源。物联网（如车辆、家电器、交通灯、医疗设备和智能机器）产生的流数据和实时数据可以使用具有自身计算能力的本地边缘服务器在产生源点进行处理。同时，也可以在系统中引入中间服务器，以便在需要时在源附近分析数据。由于决策是在数据源附近做出的，它与在云基础设施上进行的分析相比降低了延迟。如果由云服务器执行分析过程，对时间敏感的决策将无法及时做出。边缘分析框架中的服务质量得到了显著提高。由于移动到云端的数据量减少了，这随之最小化了流量和传输成本
    [3]。


    ![图 3.9 边缘分析的架构。](img/fig3_9.jpg)


    图 3.9 边缘分析的架构。


    例如，风力涡电机使用多种电气光学传感器来满足各种需求。这些传感器可以帮助观察风力涡机的振动水平、温度、与其他物体之间的距离等。系统不需要持续将生成的数据发送到云分析服务器。相反，它可以设计为仅在数据超过阈值时发送数据
    [1]。


    ## 3.11 边缘设备的机器学习


    TinyML 是运行在低资源消耗型设备（如手机、微控制器和其他物联网设备）上的机器学习算法的研究领域。在智能物联网设备中引入 TinyML 会增加延迟，因为数据是在本地处理的。


    **TensorFlow Lite**：TensorFlow Lite 是一个开源框架，用于设备（如手机、物联网设备和其他嵌入式设备）上通过 TensorFlow
    机器学习模型进行快速推理。它生成适用于通用边缘设备执行的优化微模型。边缘设备处理大型数据集的能力有限，因为其处理能力内存有限。在设备上引入人工智能会导致资源密集型过程。TensorFlow
    Lite 的开发考虑了这些问题，并使用了如图 3.10 所示的工作流。


    ![图 3.10 TensorFlow Lite 框架的工作流。](img/fig3_10.jpg)


    图 3.10 TensorFlow Lite 框架的工作流。


    对于相应的应用，开发自定义深度学习模型或预训练模型始终是首要步骤。TensorFlow 提供了两个额外的组件，目标是将当前的深度学习模型转换为能够在目标边缘设备运行的轻量级模型。这两个组件是
    TensorFlow Lite Converter 和 TensorFlow Lite Interpreter。Converter 帮助将自定义的 TensorFlow
    模型转换为 TensorFlow Lite 格式。Interpreter 帮助通过利用各种 API 将 Lite 模型实现到目标边缘设备。也可以进行模型优化，以使对模型性能的影响降到最小
    [10]。

