    低血压（hypotension）是指收缩压读数低于 90 mm Hg 且舒缩压低于 60 mm Hg 的血压状态 [9]。平均动脉压小于 55 mm Hg
    可能会导致低血压。`MAP` 使用以下公式计算：


    $${MAP} = \\frac{{SBP} + 2\\left( {DBP} \right)}{3}$(6.5)$$


    其中 `SBP` 是收缩压，`DBP` 是舒缩压。


    ### 6.3.3.2 边缘服务器对 MAP 的分析


    使用血压计设备，从人体中采集收缩压和舒缩压值，并将其存储在边缘服务器中进行低血压分析，如表 6.4 所示。为了确保安全，这些值经过同态加密，并用于判断个人是否患有低血压。


    #### 表 6.4 通过血压计收集的数据


    | 标识 || 性别 || 收缩压 || 舒缩压 |

    | --- | --- | --- | --- |

    | 1 || 男 || 36 || 23 |

    | --- | --- | --- | --- |

    | 2 || 女 || 38 || 39 |

    | 3 || 男 || 37 || 35 |

    | 4 || 男 || 26 || 33 |

    | 5 || 女 || 4 || 17 |

    | 6 || 女 || 12 || 31 |

    | 7 || 男 || 59 || 19 |

    | 8 || 女 || 8 || 35 |

    | 9 || 男 || 39 || 70 |


    `MAP` 公式应用于加密的收缩压和舒缩压值上。在分析过程中，将计算出的 `MAP` 值与加密的 `55` 值进行比较。如果计算出的 `MAP` 值小于加密的
    `55` 值，则表示该个人患有低血压，结果会被添加到边缘服务器的数据库中，如表 6.5 所示。


    #### 表 6.5 基于 MAP 的低血压识别


    | 标识 || 性别 || 收缩压 || 舒缩压 || MAP || 低血压 |

    | --- | --- | --- | --- | --- | --- |

    | 664817 || 664767 || 664866 || 664826 || 664839 || 无低血压 |

    | --- | --- | --- | --- | --- | --- |

    | 386811 || 386760 || 386909 || 386859 || 386875 || 无低血压 |

    | 323231 || 323180 || 323328 || 323278 || 323294 || 低血压 |

    | 377916 || 377863 || 377997 || 377952 || 377967 || 无低血压 |

    | 201409 || 201355 || 201484 || 201444 || 201455 || 无低血压 |

    | 345325 || 345271 || 345394 || 345359 || 345370 || 无低血压 |

