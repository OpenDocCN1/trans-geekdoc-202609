    ### 6.3.4 Case Study III: Body Composition Scale to Detect Heat Index in Edge
    Server


    Physical fitness is more important to be considered in day-to-day life. Body compositions
    such as weight, height, BMI, body fat, lean mass, humidity, and indoor temperature
    are to be calculated to maintain a healthy life. Body composition scale is a measuring
    scale that is used to measure body compositions using bio-impedance method. Bio-impedance
    is the common method used by household scales to calculate body composition. This
    device uses the bio-impedance method by using four conductors to determine the
    hindrance of electrical flow through the body, and uses that to calculate the
    total body water. From the total body water, it estimates nine data points. The
    nine data points that are measured by this device are weight, BMI, body fat, body
    water, lean mass, bone mass, muscle mass, visceral fat intake, and daily calorie
    intake. This device has a separate sensor for indoor temperature and humidity,
    so the thermostat can be adjusted to keep the body in optimal condition. The measured
    humidity and indoor temperature values are transmitted to the edge server for
    analysis/processing of data. Humidity and indoor temperature are used to measure
    heat index that may range from 27°C to 57°C. An increase in humidity and indoor
    temperature leads to an increase in heat index that results in health problems
    such as fatigue, heat cramps, heat exhaustion, and heat stroke. These health effects
    may vary according to the heat index range. The heat index is calculated by the
    relative fractional proportion of humidity and indoor temperature.


    Borga et al. proposed a brief overview of common non-invasive techniques for body
    composition assessment method based on fat-referenced quantitative MRI. For whole-body
    measurements of adipose tissue (AT) or fat and lean tissue (LT), DXA and quantitative
    MRIs are comparative with respective linear correlations. But the agreement was
    found significantly lower for visceral adipose tissue \[[11](#ch06.xhtml#ref6_11)\].
    Bos et al. proposed two models for predictive analysis in health care as Cox Proportional
    Hazard Model and Logistic Regression Model. They proposed FHE scheme for the standard
    way of encrypting data bitwise. The functions of these regression models can be
    approximated by polynomial expressions in integer values. The advantage of this
    approach is that a single ciphertext contains much more information than just
    a single bit of plaintext \[[12](#ch06.xhtml#ref6_12)\].


