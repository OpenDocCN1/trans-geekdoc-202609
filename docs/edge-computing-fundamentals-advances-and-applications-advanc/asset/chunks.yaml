    Various modules in the PureEdgeSim include:


    *   `Scenario Manager`: This module loads the user scenario and the simulation
    parameters. File parser class in the module checks the input files and loads the
    simulation parameters. Simulation parameters class holds the various parameters.

    *   `Simulation Manager`: This module initiates simulation, schedules the events,
    and generates the output. Simulation manager class of this module manages simulation,
    schedules tasks; while `Simulation Logger` class generates and saves the simulation
    output.

    *   `Data Center Manager`: This module takes care of generating and managing all
    the data centers and devices. It consists of two classes. The `Server Manager`
    class generates the servers and edge devices, their hosts, and virtual machines.
    The `Data Center` class maintains the properties of edge devices like location,
    mobility, energy source, and capacity.

    *   `Tasks Generator`: This module assigns an application such as e-health, smart-home,
    and augmented reality to each edge device. Based on the application, tasks are
    then generated.

    *   `Network Module`: This module takes care of the transfer of entities like
    tasks, requests, containers.

    *   `Tasks Orchestrator`: This module contains the orchestration algorithm defined
    by the user.

    *   `Location Manager`: This module generates the mobility path of mobile devices.


    ### 2.7.2 IoTSim-Edge


    IoTSim-Edge [[13](#ch02.xhtml#ref2_13)] extends the capability of CloudSim to
    incorporate the different features of edge and IoT devices. Communication among
    components is handled by the event management system. IoT devices layer simulates
    different types of IoT devices like sensors for cars, healthcare devices, smart
    homes, etc. The overall architecture of IoTSim-Edge ([Fig. 2.6](#ch02.xhtml#fig2_6))
    is discussed in this paragraph. Data collected by these sensors is processed in
    edge data center. This edge data center consists of heterogeneous processing devices
    such as smartphone, laptop, Raspberry Pi or a server. Communication between IoT
    devices and edge devices is through communication protocols. Heterogeneous network
    layer and application layer protocols are available. Edge-IoT management layer
    coordinates processing by receiving user request from users’ layer and processing
    the requests using the Edge-IoT resources. A graphical user interface (GUI) is
    used to provide device configuration and policies. Edge-IoT management layer configures
    `Edgelet`, policies, mobility, battery, synchronism, QoS and network, communication,
    transport, and security protocols. An IoT application is represented as a directed
    acyclic graph (DAG) of MicroElements (MELs). Each MEL abstractly represents the
    resources, services, and data.


    ![Figure 2.6 IoTSim-Edge architecture.](images/fig2_6.jpg)


    [Figure 2.6 IoTSim-Edge architecture.](#ch02.xhtml#fg2_6)


    Job submitted/task to be performed by the edge device is called the edgelet. The
    main classes connected with edge devices include:


    *   The `EdgeDataCenter` class establishes connection between edge and IoT devices.
    This class also performs edge resource provisioning, scheduling, and monitoring
    edge processing.

    *   `EdgeDataCenter` characteristic class maintains the attributes of an `EdgeDataCenter`
    like policies, IoT protocols, and IoT devices.

    *   The `EdgeBroker` class acts on behalf of users. It initiates the connection
    establishment between edge and IoT devices through `EdgeDataCenter` class. Other
    functionalities done include negotiating with resources, submitting IoT and edge
    requests, and receiving results.

    *   The `EdgeDevice` class presents the model of edge devices in terms of receiving
    and processing IoT-generated data based on the `EdgeLet` policy. `Battery` class
    and `Moving Policy` class give the battery and moving conditions of edge devices
    like mobile phones.

    *   The `MicroElement` (MEL) class models the operation performed on IoT data
    on edge data centers. The `Edgelet` class models tasks that need to be executed
    inside MEL.


    The main classes connected with IoT devices include:


    *   The `IoTdevice` class that mimics the behavior of real IoT devices in terms
    of sensing, processing, mobility, data rate, etc. Since IoT devices are often
    self-powered and moving, the `Battery` and `Mobility` classes exist to empower
    IoT devices with such characteristics.

    *   The `NetworkProtocol` class models the network protocols in terms of speed
    rate.

    *   The `IoTProtocol` class models the features of IoT protocol (like CoAP, XMPP)
    based on QoS.

    *   `UserInterface` class provides the necessary methods to easily configure and
    test the IoT application development without knowing the details of the simulator.
    It allows a user to define all the parameters using the interactive interface
    which is converted to the desired configuration file.


    Workflow for task execution in IoTSim-Edge ([Fig. 2.7](#ch02.xhtml#fig2_7)) is
    given below:


    *   IoT-Edge environment is initialized. IoT application given by the user communicates
    with the `EdgeBroker`.

    *   Edge Broker starts the IoT devices and connects to them.

    *   Edge Broker then instructs `EdgeDataCenter` to connect IoT devices to MEL.

    *   The IoT devices are notified once connected.

    *   An IoT device senses and generates an edgelet (Task).

    *   IoT device can perform preliminary processing on edgelet like filtering based
    on the resources.

    *   IoT device sends the edgelet to the IoT broker.

    *   IoT broker submits the IoT edgelet data to MEL in edge data center.

    *   MEL processes the data and sends results to IoT Broker.

    *   The attributes of IoT devices like battery consumption and location are continuously
    monitored by the `EdgeDataCenter`.

    *   IoT broker then reports to the user.


    ![Figure 2.7 Workflow.](images/fig2_7.jpg)


    [Figure 2.7 Workflow.](#ch02.xhtml#fg2_7)


    ### 2.7.3 iFogSim


    Fog is an intermediate layer between the user and remote (public) cloud. This
    layer is closer to the user than the cloud. Hence the performance of the networking
    environment can be improved. Edge computing has programmable systems. It is usually
    at the location of the end-user. Mist layer is a computing platform between edge
    devices and fog layer. Edge computing can work without a fog layer.


    iFogSim is an event-based simulator for edge, fog, and IoT environments [[14](#ch02.xhtml#ref2_14)].
    It uses CloudSim to handle events of various components. The following are the
    classes of iFogSim that are required to simulate the fog network:


    *   Fog device

    *   Sensor

    *   Actuator

    *   Tuple

    *   Application

    *   Monitoring edge

    *   Resource management service


    iFogSim has a layered architecture ([Fig. 2.8](#ch02.xhtml#fig2_8)) consisting
    of:


    *   `Device layer` comprises IoT sensors and actuators that act as source or sink
    of data. Sensors emit data with certain attributes including time or size of emission.
    Network characteristics include latency, bandwidth, etc. This layer is implemented
    using sensor and actuator classes. `Sensor` class maintains attributes that characterize
    the camera or the temperature sensor along with its network capability and data
    generated. `Actuator` class characterizes the actuator along with data received
    from the fog devices and mode of actuation.

    *   `Fog device` can host application modules. Gateways are fog devices that connect
    IoT devices with the network. Fog layer can also host private cloud in between
    the public cloud and devices layer. The resources are arranged in a hierarchical
    fashion. Offloading computation can be from a lower to a higher level. It is implemented
    using `FogDevice` class that maintains attributes like memory, processor, storage
    size, uplink, and downlink bandwidths for communication. This class contains methods
    to schedule, allocate and decommission resources for application modules.

