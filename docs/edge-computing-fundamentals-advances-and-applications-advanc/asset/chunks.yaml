    - **微服务负载竞争**：在联邦渗透式环境（federated osmotic environment）中，相关微服务的共同部署至关重要。但共同部署的容器化微服务会导致负载竞争。因此，理解它们组合的本质对于决定哪些微服务可以部署在一起至关重要。应该研究
    `Docker Swarm` 和 `Kubernetes` 等容器引擎，通过分析性能、优先考虑负载以及协调其部署，动态处理跨云和边缘数据中心资源之间共同部署微服务的此类资源竞争。

    - **资源监控**：传统工具监控 CPU、内存、文件系统和网络使用统计数据，但无法监控微服务级别的 QoS（服务质量）指标违规。因此，需要可扩展的方法来监控云和边缘数据中心内多个层级微服务的
    QoS 和安全指标。

    - **微服务编排与组合**：一种能够预测跨云-边缘数据中心同地微服务负载和性能的合适技术，结合 QoS 感知的资源编排与组合技术至关重要。这使得应用程序微服务可以在边缘和云资源之间进行有效的卸载和反卸载。

    - **调度**：在云和网格环境中对合适资源的调度是一项重要的研究领域。必须考虑作业大小、延迟、利用率、节能等各种因素。统计和演化优化技术已得到尝试。


    ## 1.11 结论


    本章概述了从并行处理系统到分布式系统的各种计算范式。在集中计算范式中，所有计算机资源（如处理器、内存和存储）都位于一个物理系统中并由集中控制。资源在同一个操作系统下的各种进程之间共享。虽然此类系统可以提供高安全性、完整性、低维护成本和可靠性，但它们面临扩展性和灵活性不足的问题。并行计算范式允许并行执行计算。通常，处理器共享一个中央内存，并通过共享内存以紧耦合的方式进行通信。或者，它们可以是松散耦合的，拥有分布式内存。在这种情况下，通信是通过消息传递实现的。集群计算范式使用计算机集群。它是一种并行或分布式处理系统，由一组相互连接的独立计算机组成，这些计算机作为一个单一的、集成计算资源协作工作。该模型的主要特征是集中控制。分布式计算（图
    1.24）由一组独立的计算机组成，每台计算机都有自己的自己的内存、磁盘和处理器。这些独立节点相互协作解决问题。参与的计算机之间通过消息传递进行通信，该组对用户来说似乎是一个单一的一致系统。当分布式系统拥有去中心化控制时，它就变成了
    P2P 系统。网格（Grid）是一种具有虚拟组织概念的分布式系统，许多物理资源聚合在一起以协作完成任务。云计算是一种基于互联网的分布式计算环境。在云中，可以按需配置共享资源。云促进了类似于电力或水供应提供的公用化计算服务。互联网的出现在云计算出现之前就已经促进了
    Web 托管（Web hosting）。Web 托管是在 WWW 中提供空间来托管服务器的机制。例如，应用程序服务提供商可以在 WWW 服务器上托管它们的应用程序，并将应用程序作为服务交付给客户。这种方法限制了所提供服务的用户。通过虚拟化技术，这种模型可以变得更有效且在财务上更可行。这催生了向更多用户提供
    `SaaS` 的概念。最终，`SaaS` 因其易用性而流行起来，催生了今天所谓的云，不仅提供软件，还可以提供平台（`PaaS`）和基础设施（`IaaS`）作为服务提供。然而，在目前的云技术中，可以提供任何事物和一切作为服务，这产生了“万物即服务”（`XaaS`）术语。分析也可以作为一种服务提供。虽然云计算的动力来自商业社区，但网格计算的动力来自科学社区。后来，云计算增强为雾计算（fog
    computing），以为 IoT 设备提供服务。与其他雾计算相关的范式还包括移动云计算、移动边缘计算、露水计算、雾露计算和边缘计算。渗透式计算实现了微服务在雾计算环境不同层级之间的无缝迁移。下一章将讨论边缘计算系统。


