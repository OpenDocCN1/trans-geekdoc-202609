    ## 6.4 Conclusion and Open Research Challenges


    Edge computing propels use cases across multi-domains including autonomous vehicles,
    smart cities, industrial automation, gaming, content delivery, financial sector,
    and healthcare sectors. Three case studies from the healthcare sector are considered
    and a detailed illustration is elaborated in this chapter by ensuring the proper
    acquisition of data, secure storage, and dynamic onboard processing. To assure
    secure storage homomorphic encryption schemes are applied and analysis is performed
    upon the encrypted data to safeguard the framework against invasive attack vectors.
    The case studies enlighten the secure compute and processing capacity of edge
    gateway/server for real-time applications. Edge in conjunction with advanced analytics
    algorithms supports real-time models and control in various sectors. However,
    the open challenge for researchers/developers is to understand the security and
    processing requirements of the applications as they differ from sector to sector
    while enabling edge computing systems.


