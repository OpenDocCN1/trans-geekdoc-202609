    区块链应用在适当的安全增强下，对于改进开放访问和金融服务非常有用。它被应用于各种领域，如游戏、供应链、物联网和物流等。单个区块链只能处理有限数量的交易。当每秒交易数增加时，就会出现瓶颈，并导致交易费用增加。因此需要通过为特定目的设计区块链架构来扩展现有的区块链方法，将多条链结合并高效、安全地协同工作。`Polkadot`是一种`Parachain`（平行链）网络协议，它将各种不同的区块链网络统一成一个去中心化的网络。它使得区块链具有可扩展性和定制性。它确保了多个网络之间的跨链通信和透明治理。它有助于根据应用需求升级区块链；因此有助于开发者、初创公司和企业高效利用区块链技术。`Relay
    chain`（中继链）是`Polkadot`网络的核心，所有的区块链都连接到它。它允许同时处理网络中所有链的交易，从而提高了扩展性。这种并行处理被称为并行链。跨链通信方案允许实体之间传输任何消息操作实现了操作操作互操作在升级过程中可能会分为两条独立的路径，这个问题被称为分叉。`Polkadot`确保了无分叉的区块链升级
    [12]。


    ## 5.10 基于区块链的边缘计算


    区块链可以为物联网设备建立安全可靠的资源分配和共享环境。通过卸载边缘设备的计算，它有助于增强系统的互操作性、可靠性、安全性和隐私。区块链网络为物联网设备提供了可靠的资源分配和共享环境。


    ### 5.10.1 物联网与区块链


    物联网是传感器或电子/机械设备的集合，有助于在没有人工干预的情况下相互通信。由于物联网设备的资源限制无法自行执行数据分析，因此引入了云系统。虽然目标是建立
    2P 系统，但云的介入使得系统行为类似于集中化的客户端服务器系统。因此，系统的扩展性受到了影响。物联网设备由不同的供应商设计。因此，物联网设备的异构性导致了互操作问题。由于物联网设备资源有限，提供认证、授权和通信加密等资源密集型任务是不可能的。这些任务在云服务器上完成。如果物联网设备容易产生安全漏洞，则通过更新固件来解决。大多数情况下，这由用户负责更新固件。如果用户没有执行，就会变成安全威胁。


    为了克服这些挑战，借助边缘设备的帮助引入了物联网计算卸载，在那里也可以进行处理。当区块链与这些边缘设备集成时，它可以处理互操作性差、隐私和安全漏洞，从而改进了异构性
    [13]。


    #### 物联网与区块链结合的优势


    *   通过在区块链中存储异构物联网设备数据，增强了物联网系统的互操作性。它为碎片化的物联网网络提供了通用的互联网访问。

    *   改进了物联网系统的安全性。交易数据或传感器读数被加密、数字签名并存储在区块链中。

    *   区块链中的`smart contract`（智能合约）用于更新固件，以确保物联网设备的安全性。

    *   通过集成区块链保证了物联网设备的不可篡改性。因此，实现了数据的可靠性。

    *   通过利用区块链，物联网系统实现了网络中设备之间安全且无信任的消息传递。结果，通过集成`smart contract`来促进`DAO`，实现了物联网的自主交互。


    #### 集成区块链的物联网系统的应用


    *   冰箱自主管理其与外部世界的交互。冰箱内有各种传感器用于控制操作和向用户报警。想象一种能够根据其内部物品和库存订购食物，并自动下单并支付的冰箱。仅靠执行器和传感器不足以实现这一点。因此，必须以安全的方式将物联网设备与`smart
    contracts`和支付系统相结合。

    *   如果汽车的某些部分出现问题，由于区块链足够智能，可以对这些部分进行修复。


    ### 5.10.2 系统设计


    物联网设备可以使用集中化或去中心化模型连接到区块链。在集中化模型中，`Ethereum full node`维护区块链。尽管区块链机制是去中心化的，当全节点故障时，物联网设备无法访问区块链。通过`RPC`端点解决了这个问题，如图
    5.14 所示。物联网设备通过`RPC`端点访问区块链的`smart contracts`。应用二进制接口（ABI）通过`RPC`端点为`smart contract`提供接口。合约的`ABIs`通过`web3
    API`暴露，`web3 API`连接到`RPC`端点。`RPC`提供了`smart contract`之间的通信。这种方法实现了去中心化。


    ![图 5.14 集成区块链的物联网设备](img/fig5_14.jpg)


    图 5.14 集成区块链的物联网设备


    ### 5.10.3 案例


    #### 案例 I：基于区块链和物联网的众筹系统


    该系统允许用户探索并资助项目所有者想法。项目所有者和用户使用`NFC Tags`作为硬件钱包。用户登录应用程序并使用与`NFC Tags`关联的支付。`Funding`合约部署在区块链上，项目所有者在上面发布项目详情。每个发布的项目都会部署一个`smart
    contract`，用于存储项目的资金状态信息，如资金状态和目前收到的资金金额。每当应用程序运行时，该合约都会检查合约状态（融资中、成功或过期）。如果状态成功，资金将从合约转移给项目所有者。如果过期，资金将返回给用户。合约可以接受支付。该系统使用`Truffle`环境开发，使用`web3.js`连接
    JSON RPC，使用`React.js`构建前端，并使用 Ganache CLI 私有区块链网络进行测试。NFC 的认证和处理使用`python nfcpy`库完成（如图
    5.15](#ch05.xhtml#fig5_15)所示）。


    ![图 5.15 基于区块链和物联网的众筹系统架构](img/fig5_15.jpg)


    图 5.15 基于区块链和物联网的众筹系统架构


    ##### 使用 Solidity 语言的智能合约


    开发该应用程序使用了两个智能合约。一个`Funding`智能合约实例可以关联多个`Project`智能合约。

