- fmt: "\n[Figure 1.3 **(a)** Shared memory access (UMA) **(b)** non-uniform memory\
    \ access (NUMA).](#ch01.xhtml#fg1_3)\n\nSuch systems are fast. The main issue\
    \ in this model is scalability. As all the processors communicate through the\
    \ shared memory, it becomes a bottleneck. The architecture is tightly coupled\
    \ as all communication is through the shared memory. Such shared memory systems\
    \ are generally termed as parallel computing systems.\n\n### 1.3.2 Distributed\
    \ Memory Systems\n\nIn these systems, each node has a processor (`P`) and memory\
    \ (`M`). Each node is able to process independently. They communicate using networks.\
    \ The network fabric is used for data transfer between nodes. Such systems are\
    \ called as truly distributed systems ([Fig. 1.4](#ch01.xhtml#fig1_4)).\n\n![Figure\
    \ 1.4 Distributed memory systems.](images/fig1_4.jpg)\n\n[Figure 1.4 Distributed\
    \ memory systems.](#ch01.xhtml#fg1_4)\n\nSuch systems have higher scalability\
    \ than shared memory systems as the interconnection network is only used for communication.\
    \ It is fault-tolerant as another node can perform the functionality of the failed\
    \ node. In case data is not available locally, it is fetched from another remote\
    \ node. This results in non-uniform access time for remote data when compared\
    \ to local data. Such systems are loosely coupled and can perform computation\
    \ independently.\n\n### 1.3.3 Hybrid Model\n\nThis model is a hybrid of shared\
    \ memory and distributed memory architectures. The main advantage of this model\
    \ is increased scalability like networked model. Further due to shared memory,\
    \ access time is reduced ([Fig. 1.5](#ch01.xhtml#fig1_5)).\n\n![Figure 1.5 Hybrid\
    \ systems.](images/fig1_5.jpg)\n\n[Figure 1.5 Hybrid systems.](#ch01.xhtml#fig1_5)\n\
    \nThus parallel processing can be categorized from programmer’s perspective as:\n\
    \n* **Parallel processing**: when a single program is broken into independent\
    \ tasks that can be executed in parallel.\n* **Data parallelism**: when a large\
    \ number of values are processed in parallel and the results are merged.\n* **Multiprocessing**:\
    \ wherein two or more independent programs are executed on separate processors.\n\
    \nAdvances in networking and high-speed networks triggered to bloom of truly distributed\
    \ systems.\n\n### 1.4 Distributed Computing\n\nThe growth of networking technology\
    \ with reduced data transfer latency and increased bandwidth was the driving force\
    \ behind the emergence of distributed computing paradigm. The paradigm emerged\
    \ with the initiation of communication between remote computing resources using\
    \ message passing in the 1960s. The growth of local area networks, `ARPANET`,\
    \ and email services in the 1970s triggered its growth. Distributed computing\
    \ system is a system with multiple independent autonomous systems that communicate\
    \ and coordinate actions in order to appear as a single coherent system to the\
    \ end-user. When a job is given by the user, the system executes the job transparently.\
    \ Users of the distributed system should be able to view the system as a virtual\
    \ centralized system that is flexible, efficient, reliable, secure, and easy to\
    \ use.\n\nIn a soccer team, each player has his own expertise and works autonomously.\
    \ There is no shared state among players (no communication). Further, there is\
    \ no global synchronization for player moves. The team has a common objective\
    \ to defend the goal post and secure a goal. This is an apt analogy to a distributed\
    \ system defined as “a collection of autonomous nodes that communicate and coordinate\
    \ actions in order to appear as a single coherent system to the end-user”.\n\n\
    To meet this challenge, some of the transparencies [[4](#ch01.xhtml#ref_4),[5](#ch01.xhtml#ref1_5)]\
    \ include:\n\n* **Transparency**: This characteristic hides the details from user.\
    \ Some of the types include:\n    * **Location transparency**: User is not aware\
    \ of where is located.\n    * **Migration transparency**: hides the details of\
    \ whether job has migrated.\n    * **Replication transparency**: hides the details\
    \ of replicas.\n    * **Failure transparency**: hides the details of reallocation\
    \ when particular resource fails.\n    * **Concurrency transparency**: provides\
    \ an abstraction to sharing resource among multiple users.\n    * **Access transparency**:\
    \ hides access details from the user.\n    * **Scale transparency**: facilitates\
    \ scaling the system.\n\n* **Reliability**: Existence of multiple nodes avoids\
    \ single point of failure prevalent in centralized systems. To ensure reliability,\
    \ distributed systems should be able to detect and recover from crash faults.\
    \ To tolerate faults, decentralized control is frequently used. Redundancy is\
    \ replicating multiple nodes. This ensures that even if node fails, the functionality\
    \ can be instantiated. Centralized control increases the possibility of single\
    \ point of failure hence decentralized control is preferred.\n* **Fault detection\
    \ and recovery**: Also enhance reliability of the system. It includes hardware\
    \ and software mechanisms used to detect failures as well as mechanisms to correct\
    \ system state. Atomic transactions, stateless servers, and use of acknowledgments\
    \ for message transfers can increase system reliability.\n* **Flexibility**: Facilitates\
    \ introducing modifications in the system to meet user needs. New functionalities\
    \ or services can be added or existing services can be modified to make the system\
    \ more effective and efficient.\n* **Scalability**: Scalability refers to the\
    \ capability of a system to adapt to increased service load. Decentralization\
    \ helps to build scalable systems.\n* **Security**: Resources in a distributed\
    \ system should be protected against destruction and unauthorized access. Authentication\
    \ and authorization can be provided using cryptography principles. Integrity of\
    \ messages and data should be preserved. Non-repudiation can be ensured using\
    \ digital signatures. Security audits are essential.\n* **Performance**: The performance\
    \ of the distributed system should be better than that of a centralized system.\
    \ Some of the measures taken to increase performance in distributed systems include\
    \ employing fine-grain parallelism, minimizing the redundant copy operations and\
    \ network traffic, batching the jobs before submission, and using caches to reduce\
    \ data transfers/disk read/write operations.\n\nSome of the advantages of distributed\
    \ computing [[6](#ch01.xhtml#ref1_6)] include:\n\n* **Performance**: As tasks\
    \ in a distributed application can be executed in parallel by distributing the\
    \ load across the nodes in the network, they yield good performance.\n* **Collaboration**:\
    \ Multiple applications can be connected through standard distributed computing\
    \ mechanisms and communicate to complete their task collaboratively.\n* **Higher\
    \ reliability and availability**: As the applications/tasks are replicated across\
    \ multiple machines, it offers better reliability.\n* **Scalability**: Communication\
    \ and loose coupling in distributed systems enable better scalability.\n* **Extensibility**:\
    \ Distributed applications can be dynamically reconfigured. Divide and conquer\
    \ approach breaks up large problems into smaller ones, these individual components\
    \ can be developed by smaller development teams in isolation.\n* **Reuse**: The\
    \ distributed components may perform various services that can potentially be\
    \ used by multiple client applications. It saves repetitive development effort\
    \ and improves interoperability between components.\n"
