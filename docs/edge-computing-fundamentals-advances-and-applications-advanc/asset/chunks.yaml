    核心挑战在于通过保护数据免受入侵者/攻击者的侵害来增强系统的安全性，而不是放弃它。基于安全的公司正在根据法规定制安全解决方案，以满足日益的市场需求，最大限度地减少组织泄露、篡改、破坏、损坏和盗窃等风险。许多基于边缘的系统利用传统的操作系统和主机数据库。数据机密性、完整性、安全数据搜索、身份验证、访问控制和隐私保护是边缘计算数据安全研究架构的广泛领域，如图
    4.1]。


    *   同态加密

    *   基于身份的加密 (`IBE`)

    *   基于属性的加密

    *   代理重加密

    *   函数加密

    *   蜜罐加密

    *   可搜索加密


    ![图 4.1 数据安全研究架构。](img/fig4_1.jpg)


    图 4.1 数据安全研究架构。


    关于身份验证，将讨论以下方案及其工作原理：


    *   单域

    *   跨域

    *   切切换身份验证


    在隐私保护主题上，将讨论给定方案及其工作性质。


    *   数据隐私

    *   位置隐私

    *   身份隐私


    ## 4.2 数据机密性


    许多公司继续对抗针对数据的侵入性攻击。为了管理和控制边缘环境中的数据窃取/泄露，由于设备是数据消费者也是生产者，必须应用适当的数据机密性方案。这些方案必须使用任何加密方案来保护敏感数据。传统的加密方案如
    `AES`/`DES`/`RSA`/`ECC` 可能用于边缘环境。然而，为了任何分析/查询而访问或处理密文数据的效率非常低，且无法实现真正的适应。近年来，针对边缘框架下的安全数据处理进行了大量研究。为了确保在数据外包或在边缘/云端处理数据期间的机密性，必须使用安全可靠的加密技术。高效的安全处理方案如下：


    1.  基于身份的加密

    2.  基于属性的加密

    3.  代理重加密

    4.  函数加密

    5.  蜜罐加密

    6.  可搜索加密

    7.  同态加密


    ### 4.2.1 基于身份的加密


    Shamir [2 ] 最初提出了一种基于身份的加密方案。系统中的任何参与方都可以通过该方案进行安全协作，通过验证对方的签名无需协商私钥/公钥。公钥基础设施
    (`PKI`) 或任何第三方的参与对于该方案的执行并非必需。该方案不是使用 `PKI`，而是使用密钥生成器生成随机数（种子）。加密过程中，当 `A` 向 `B`
    发送邮件时，邮件将通过 `B` 的邮件标识符加密，这作为传输的公钥。接收邮件时，`B` 验证自己并从公钥生成器获取私钥。在私钥的帮助下，邮件将被解密，如图
    4.2


    图 4.2 基于身份的加密。


    为了解决多方环境中的身份问题，增强型 `IBE` [3 ] 基于被认为是 NP 的离散对数问题提出以加强环境。使用双线性映射，Boneh 和 Franklin
    [4 ] 在 2003 年提出了一种使用形式门限密码学的方案。


    ### 4.2.2 基于属性的加密


    这是一种加密，其中私钥和密文基于一组属性，因此入侵者/攻击者/外部人员无法拥有数据的所有权。在可信机构的协助下，属性密钥在双方之间发布，并在需要时用于解密。解密是基于可信机构经过适当验证后共享的属性集的。它主要用于日志加密。Sahai
    和 Waters [5 ] 提出了一种新型的可重复基于属性加密方案。基于阈值的基于密钥或基于密文策略的基于属性加密正在使用。图 4.3 展示了数据所有者与用户之间基于属性加密的工作。


    ![图 4.3 基于属性的加密。](img/fig4_3.jpg)


    图 4.3 基于属性的加密。


    ### 4.2.3 代理重加密


    代理重加密是 Blaze 等人 [6 ] 设计的一种协议，用于在代理的帮助下将一个密钥的密文转换为另一个密钥的密文。简单来说，这种方法允许在没有私钥许可的情况下将公钥转换为另一个。这可以通过一种称为重加密密钥的密钥来实现，并确保底层的明文不被泄露。由于这种迷人的特性，它在多用户共享场景中被广泛采用。第三方参与此方法以重加密发送给其他方。


    图 4.4 描绘了代理重加密的工作原理。尽管该方法在 NP 级的离散对数问题下被证明是强大的，但仍有一些需要解决的问题。该方法的一个主要威胁是，如果代理是内部人员，则可能在没有用户
    `A` 或 `B` 同意的情况下反向处理信息。同样，用户 `A` 和代理都可以作为内部人员在没有许可的情况下反向处理信息。为了解决这些问题，许多作者设计了增强型协议
    [1]。


    ![图 4.4 代理重加密。](img/fig4_4.jpg)


    图 4.4 代理重加密。


    ### 4.2.4 函数加密


    该方法利用特定函数来加密发送给其他方的数据。通常，它是一个黑盒函数，用户可以在不了解生成的输入知识的情况下查看输出。它为边缘环境提供了最高形式的安全性和可靠性。该领域正在进行大量研究，以设计健壮的函数防止危险的暴力攻击。这种方法的安全性取决于所设计的函数，它是基于属性和基于身份加密的通用形式。它最初由
    Amit 等人于 2005 年提出，并由 Brent 在 2010 年进行了改进 [7]]。最近，在误差学习假设上进行了深度改进。解决该方法的难度与解决量子问题一样困难。


