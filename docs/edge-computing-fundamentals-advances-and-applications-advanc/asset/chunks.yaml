    `keccak256` 计算公钥的哈希值，并取哈希值的最后 20 个字节生成的。


    每笔交易都涉及费用。与比特币一样，以太坊是 P2P 数字货币。交易支付的以太数量取决于所使用的资源。一个两个数字相加的交易需要三个工作单位。这个工作单位被称为
    `gas`。Gas 价格是单位 gas 的价格，由用户固定。矿工会挑选 gas 价格较高的交易。交易费用通过通过交易消耗的 gas 乘以 gas 价格计算得出。Gas
    限制表示用户愿意为执行交易购买的最大 gas 数量。


    #### 比特币对比以太坊


