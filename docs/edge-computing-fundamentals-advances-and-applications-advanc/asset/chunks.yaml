    4.  Venous Hemoglobin Oxygen Saturation (SvO[2])


    5.  Arterial Oxygen Partial Pressure (PaO[2])


    6.  Venous Oxygen Partial Pressure (PvO[2])


    7.  Cardiac Output (CO)


