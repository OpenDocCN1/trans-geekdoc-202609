  trans: '


    P2P 和集群架构是技术模型。它们并没有描绘计算行业的服务侧面。在集群模型中，计算服务在大多数时间内并没有被利用。因此，系统利用率较低。此外，购买和维护集群涉及的运营成本很高。为了降低成本并提高系统利用率，可以在多个用户之间共享计算资源。公用计算关注一种业务模式，即客户从付费的服务提供者处获取计算资源（见图
    1.11）。这为客户提供了灵活性，可以在需要时向服务提供者请求资源。然后客户根据使用的资源向提供者付费。这种服务供给业务模式被称为公用计算。网格/云计算模型属于公用计算的范畴。这种模型最大化了资源利用率，从而降低了运营成本。就像水、电力作为公用事业提供给个人和企业一样，计算也被一种事业提供。


    ![图 1.11 作为公用服务的计算。](img/fig1_11.jpg)


    图 1.11 作为公用服务的计算。


    服务水平协议（SLA）是服务消费者和提供者之间所需的协议。SLA 是一种正式合同，用于保证服务提供者能够满足消费者的服务质量要求。这确保了客户的满意度。良好的
    SLA 确保以下几点：


    * 客户满意度

    * 服务质量

    * 加强客户与服务提供者的关系


    公用计算系统的架构由以下层组成（见图 1.12）：


    * **用户**：通过合适的应用程序请求提供者服务的实体。

    * **服务请求审查员**：解释客户服务请求中的 `QoS` 要求，并使用准入控制机制决定是否接受该请求。它因此消除了没有可用资源的请求。然后它触发 `SLA
    管理器`。

    * **SLA 管理器**：检查 `SLA` 并发现合适的服务提供者以满足 `SLA` 中指定的 `QoS`。该实体负责发现、谈判/重新谈判、定价、调度、监控、SLA
    执行、分发和计费。发现组件识别能够满足请求者 `QoS` old 的服务提供者。定价机制决定了如何对服务请求收费。`SLA 管理器` 还根据满足协议的提供者列表将请求调度给合适的提供者。分发机制在分配的资源上启动执行被接受的服务请求。监控组件定期验证请求者的
    `QoS` 是否得到满足。如果没有满足，则进行重新谈判。如果违反了 `SLA`，可能会导致合同终止或支付罚金。

    * **资源提供者**：根据 `SLA` 向客户提供服务的实体。


    ![图 1.12 面向 SLA 的型公用计算系统架构。](img/fig1_12.jpg)


    图 1.12 面向 SLA 的型公用计算系统架构。


    ## 1.7 网格计算


    集群计算处理协作工作以完成任务的同构系统。当我们考虑像银行这样的真实组织时，它由许多实体组成——计算设备、人员、其他设备（如计数机）、应用程序、客户。因此，自动化整个组织需要的不仅仅是计算机。这导致了网格计算范式的出现。网格计算平台的目标是在动态多领域的虚拟组织中实现协调的资源共享和问题解决。


    网格计算资源包括计算能力、数据存储、硬件仪器、按需软件和应用程序。


    考虑一组想要研究臭氧层的物理学家。该小组需要设备来收集大气数据，需要数学家、物理学家、计算机科学家、计算设备以及接口来完成他们的研究。所有这些连接的异构实体形成了一个网格（带有数据收集设备、计算机、分析软件、数学建模工具和接口）。网格环境中资源的异构性和地理分布性了对去中心化控制（以实现更好的协调）和开放标准（为了互操作性）的必要性。


    与网格计算相关的最重要的概念之一 `[8]` 是虚拟组织。网格计算旨在实现虚拟组织内参与者之间实现协调的资源共享。例如，加利福尼亚大学的一位物理学家使用来自意大利观测中心的数据集。他使用由印度数学家建立的数学模型，通过模拟应用程序进行分析。然后他通过天文台验证结果，并将结果存储在存储提供者处。这个虚拟组织涉及至少四个物理组织的实体——加利福尼亚实验室、意大利实验室、印度实验室和服务提供者。它连接了计算元素以外的实体。这样一个虚拟组织的创建基于各种物理实体之间的
    `SLA`。这包括组织中各种成员的角色、活动、视图和行政权限。所有这些实体形成了一个巨大的网格来研究臭氧层（见图 1.13）。


    ![图 1.13 虚拟组织。](img/fig1_13.jpg)


    图 1.13 虚拟组织。


    正如图 1.14 所示，一个或多个虚拟组织共享相同的物理资源。考虑一个天气预报的 VO。它需要数据收集、存储、分析和结果可视化的资源。这包括处理器、硬盘、内存等硬件资源以及软件应用程序和框架。硬件资源可以与另一个虚拟组织（用于金融领域）共享。


    ![图 1.14 虚拟组织资源共享。](img/fig1_14.jpg)


    图 1.14 虚拟组织资源共享。


    虚拟组织因此是：


    * 逻辑实体

    * 为特定问题动态创建，因此具有有限的寿命

    * 它们可以动态地发现、提供和管理物理资源

    * 实体可以随时进入或组织

    * 监控 `SLA` 中指定的 `QoS`

    * 资源共享基于一组开放且定义的交互和访问规则

    * 参与者之间的共享关系本质上是对点对点的


    网格基本分类为计算网格或数据网格。科学模拟如质数序列、金融建模不涉及大量数据，但需要大量的计算。这些应用程序是计算密集型的。处理器和内存被大量使用。这样的网格被称为计算网格。另一方面，天气预报和物联网需要分析大量数据。它需要大量的存储资源。此类网格被称为数据网格。


    主要业务领域的一些示例包括：


    * 生命科学领域的基因组数据分析

    * 股票/产品价格预测

    * IoT 等数据密集型应用的研究

    * 汽车和航天工程的设计、建模和测试

    * 实现各种政府服务之间的无缝协作和灵活性

    * 大规模并行在线游戏


