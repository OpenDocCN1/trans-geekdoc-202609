- fmt: '

    Blockchain applications are useful for improving open access and financial services
    with proper security enhancements. It is applied for various applications such
    as gaming, supply chain, Internet of Things and logistics, and so on. Single blockchain
    can only process limited number of transactions. When the number of transactions
    per second increases, a bottleneck occurs, and it also leads to increased transaction
    fees. There is a need for scaling up the existing blockchain method by devising
    the blockchain architecture for specific purposes that combines multiple chains
    and works together efficiently and securely. `Polkadot` is a `Parachain` network
    protocol that unites various diverse blockchain networks into one decentralized
    network. It makes blockchain scalable and customizable. It ensures cross-chain
    communications and transparent governance among multiple networks. It helps out
    upgrading the blockchain according to the need of application; hence, it is helpful
    for the developers, startups, and enterprises to make efficient use of blockchain
    technology. `Relay chain` is the core of the `Polkadot` network as all the blockchains
    are connected to it. It helps increase scalability by allowing transactions from
    all chains in the network at the same time. This simultaneous processing is called
    parallel chains. Cross-chain communication scheme allows any type of message transfer
    among the entities; hence interoperability is achieved. Blockchain may diverge
    into two separate paths while upgrading. This problem is called forking. `Polkadot`
    ensures forkless blockchain upgrading [[12](#ch05.xhtml#ref5_12)].


    ## 5.10 Edge Computing with Blockchain


    Blockchain can establish a secure and trusted resource allocation and sharing
    environment for IoT devices. It helps enhance the interoperability, reliability,
    security, and privacy of the systems by offloading the computations on edge devices.
    Blockchain network provides trusted resource allocation and sharing environment
    for IoT devices.


    ### 5.10.1 Internet of Things and Blockchain


    Internet of Things is collection of sensors or electronic/mechanical things that
    helps communicate with one another without human intervention. Since IoT devices
    have resource constraints to perform data analytics in itself, cloud systems were
    introduced. Though the objective is to build P2P systems, the intervention of
    cloud makes the system behave like centralized client server system. So, scalability
    of the system is affected. The IoT devices are designed by different vendors.
    Hence, heterogeneity in IoT devices causes interoperability issues. As IoT devices
    have resource constraints, providing authentication, authorization, and communication
    encryption kind of resource-intensive tasks may not be possible. They are done
    at cloud servers. If IoT devices are prone to security vulnerabilities, the firmware
    is updated to resolve it. Most of the times, it is left to the user who is responsible
    to update firmware. It becomes a security threat if he left it undone.


    To overcome these challenges, IoT computation offloading is introduced with the
    help of edge devices where the processing can also be done. Blockchain when integrated
    with these edge devices, it can deal with poor interoperability, privacy, and
    security vulnerabilities, and hence improves heterogeneity [[13](#ch05.xhtml#ref5_13)].


    #### Advantages of Combining IoT and Blockchain


    *   Interoperability of IoT systems is enhanced by storing heterogeneous IoT device
    data in blockchain. It enables universal Internet access for fragmented IoT networks.

    *   Security of IoT systems is improved. The transaction data or sensor readings
    are encrypted, digitally signed, and stored in blockchain.

    *   A `smart contract` in blockchain is written for updating firmware for ensuring
    security of IoT devices.

    *   Immutability of IoT devices is guaranteed by integrating blockchain. Consequently
    reliability of the data is accomplished.

    *   By leveraging the blockchain, IoT systems enable secure and trustless messaging
    between devices in IoT networks. As a consequence, an autonomic interaction of
    IoT is achieved by integrating `smart contract` to facilitate `DAO`.


    #### Applications of Blockchain Integrated IoT Systems


    *   A refrigerator autonomously manages its interactions with the external world.
    Various sensors are available in refrigerator in order to control the operations
    and alarm user. Think about the refrigerator which is able to order the food based
    on the items and stock available in it and it automatically places order and pay
    for it. Typical actuators and sensors are alone not adequate for making it happen.
    Hence, IoT devices to be incorporated with `smart contracts` and payments must
    be made in a secure way.

    *   If some parts of the car are not functioning or got repaired what if it is
    smart enough to find and choose the best deal for parts and services. Blockchain
    can be integrated into connected cars to function more intelligently.


    ### 5.10.2 System Design


    The IoT devices can be connected to the blockchain using centralized or decentralized
    model. In centralized model, `Ethereum full node` maintains full blockchain. All
    the IoT devices send data to the full node and the node verifies the `smart contracts`.
    Thus, IoT devices are under the control of `Ethereum full node`. Even though the
    blockchain mechanism is decentralized, the full node controls the IoT data. When
    the full node fails, the IoT devices cannot access the Blockchain network as it
    can be accessed only through the full node. This problem is resolved using `RPC`
    end point as shown in [Fig. 5.14](#ch05.xhtml#fig5_14). IoT devices can individually
    access the `smart contracts` of blockchain through `RPC` end point. `Application
    Binary Interface` (`ABI`) provides interface to the `smart contract` through `web3
    Ethereum API` using `RPC` end point. `ABIs` of the contracts are exposed through
    the `web3 API` and `web3 API` is connected to `RPC` end point. Hence, `RPC` interface
    is providing communication between `smart contract` and `web3 API`. Decentralization
    is achieved using this approach.


    ![Figure 5.14 Blockchain integrated IoT devices.](images/fig5_14.jpg)


    [Figure 5.14 Blockchain integrated IoT devices.](#ch05.xhtml#fg5_14)


    ### 5.10.3 Case Studies


    #### Case Study I: Blockchain and IoT-Based Crowd Funding System


    This system allows users to explore and fund project ideas published by project
    owners. The project owners and users use `NFC Tags` for their `Hardware wallets`
    used for funding and transactions. The users can log into the application and
    pay with the accounts associated with their `NFC Tags`. A `Funding` contract is
    deployed to the blockchain on which the project owners publish their project details
    for users to view. A `smart contract` is deployed for each project published which
    stores the current state information of the funding of the project such as the
    funding state and the amount of funds received so far. This contract checks the
    state of the contract (fundraising, successful, or expired) periodically whenever
    the application is running. If the state is successful, the funds are transferred
    from the contract to the project owner. If the state is expired, the funds are
    returned to the users. The contract can accept payments. The system is developed
    using `Truffle` environment using `web3.js` for `JSON RPC` connection, `React.js`
    for the frontend, and `Ganache CLI Private Blockchain Network` used for testing.
    The `NFC` authentication and processing is done using `python nfcpy` library ([Fig.
    5.15](#ch05.xhtml#fig5_15)) [[14](#ch05.xhtml#ref5_14)].


    ![Figure 5.15 Architecture for blockchain and IoT-based crowd funding system.](images/fig5_15.jpg)


    [Figure 5.15 Architecture for blockchain and IoT-based crowd funding system.](#ch05.xhtml#fg5_15)


    ##### Smart Contracts Using Solidity Language


    Two smart contracts were used for the development of the application. A `Funding`
    smart contract instance can have many `Project` smart contracts associated with
    it.

