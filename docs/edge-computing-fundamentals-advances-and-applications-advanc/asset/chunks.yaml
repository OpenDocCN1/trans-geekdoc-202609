    difficulty. The difficulty value in network changes for every 2016 blocks. If
    the difficulty value is increased, the number of iterations to attain the target
    will be increased. Block structure also maintains the size of the block, transaction
    counter, and transactions added in the block along with the block header. Every
    block is linked to previous block using the hash value of the previous block.


