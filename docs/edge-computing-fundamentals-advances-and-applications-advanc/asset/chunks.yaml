- fmt: "\n### Funding Contract\n\nThe following function starts a project with the\
    \ parameters sent from the frontend through web3 and deploys a project contract\
    \ and pushes the contract to the list of projects associated with this Funding\
    \ Contract.\n\n```solidity\nfunction* startProject(\n    string calldata title,\n\
    \    string calldata description,\n    uint durationInDays,\n    uint amountToRaise\n\
    ) external {\n    uint raiseUntil = block.timestamp + (durationInDays * (1 days));\n\
    \    Project newProject = new Project(msg.sender, amountToRaise, raiseUntil, title,\
    \ description);\n    projects.push(newProject);\n    emit ProjectStarted(\n  \
    \      address(newProject),\n        msg.sender,\n        title,\n        description,\n\
    \        raiseUntil,\n        amountToRaise\n    );\n}\n```\n\nThe following function\
    \ returns all the projects associated with the instance of the funding contract:\n\
    \n```solidity\nfunction* returnAllProjects() external view returns(Project[] memory){\n\
    return projects;\n}\n```\n\n## Project Contract\n\nContribution Function which\
    \ is called when the user enters a value to contribute:\n\n```solidity\nfunction*\
    \ contribute() external verifyProjectState(ProjectState.FundRaising) payable {\n\
    \    require (msg.sender != projectOwner);\n    contributions[msg.sender] = contributions[msg.sender]\
    \ + (msg.value);\n    currentBalance = currentBalance + (msg.value);\n    emit\
    \ FundingReceived(msg.sender, msg.value, currentBalance);\n    checkFundingState();\n\
    }\n```\n\nFunction to check the state of the project contract:\n\n```solidity\n\
    function* checkFundingState() public{\n    if(currentBalance >= amountGoal){\n\
    \        currentState = ProjectState.successful;\n        payProjectOwner();\n\
    \    }\n    else if(block.timestamp > deadLine){\n        currentState = ProjectState.expired;\n\
    \    }\n}\n```\n\nFunction that pays the address which creates that specific project\
    \ contract when the goal is reached:\n\n```solidity\nfunction* payProjectOwner()\
    \ internal verifyProjectState(ProjectState.successful) returns(bool){\n    uint256\
    \ raisedAmount = currentBalance;\n    currentBalance = 0;\n    if(projectOwner.send(raisedAmount)){\n\
    \        emit ProjectOwnerPaid(projectOwner);\n        return true;\n    }\n \
    \   else{\n        currentBalance = raisedAmount;\n        currentState = ProjectState.successful;\n\
    \        return false;\n    }\n}\n```\n\n### Case Study II: Biometric System with\
    \ Blockchain Technology\n\nBlockchain technology provides the suitable architecture\
    \ to store and retrieve sensitive and confidential data in a secure and decentralized\
    \ system. Biometrics can be one among those data which can make use of the blockchain\
    \ features such as immutability, better security, and decentralized system. Automated\
    \ recognition of a person with the use of biometric traits integrated with blockchain\
    \ can help in securing the smart devices in many IoT applications. Biometric traits\
    \ can be either physiological (face, fingerprint, and so on) or behavioral (voice,\
    \ handwritten sign, and so on).\n\n#### Issues with Existing System\n\nWhen the\
    \ biometrics is stored in a single centralized database, attackers can steal the\
    \ biometrics and leak them, which may have greater consequences. In case of a\
    \ password theft, it is easy to change and replace the password. The attacker\
    \ can also modify the stored biometrics resulting in authentication failure. These\
    \ issues can be resolved using blockchain technology to store the biometrics,\
    \ as it is secure and tamper-proof from security attacks.\n\n#### Design Considerations\n\
    \nBiometrics is private and sensitive information. When a variable in smart contract\
    \ is declared as private, it only means that the variable cannot be accessed from\
    \ another smart contract but can be read by external APIs like `web3`. So, the\
    \ biometrics cannot be simply stored as anyone can access and view those data.\
    \ One way to solve this issue is to encrypt the data before storing it in the\
    \ blockchain and decrypt it during authentication. In recent days, homomorphic\
    \ encryption is getting quite popular as it allows one to perform the calculation\
    \ on the encrypted data and giving the same results obtained by performing the\
    \ calculation after decrypting the data.\n\nEach instruction executed in Ethereum\
    \ requires the payment of certain amount of gas (cryptocurrency). Simple addition\
    \ instruction can cost 1 gas, while other complex calculations like the calculation\
    \ of `SHA3` hash can cost 30 gas. Hence, most of the computations such as feature\
    \ extraction, encryption, and feature comparison should be done outside the smart\
    \ contract.\n\n#### System Design\n\n1. **Feature extraction from biometric data**\n\
    \   Biometrics of a person is generated using various sensors. For example, to\
    \ use face as the biometric trait, cameras can be used to capture the face of\
    \ a person and extract the features from the captured image.\n\n2. **Storing the\
    \ encrypted data**\n   The biometrics cannot be stored directly in the blockchain\
    \ as anyone can read the biometrics. Deploying the biometric system in public\
    \ blockchain is more safe and secure than using private blockchain as it allows\
    \ only a small number of trusted users to participate in the network. By incorporating\
    \ suitable encryption algorithm, the features are encrypted and stored in the\
    \ public blockchain.\n\n3. **Feature comparison and authentication**\n   During\
    \ authentication, the user’s biometrics are captured, features are extracted and\
    \ compared against the data stored in the blockchain. The comparison is done by\
    \ calculating the distance (Euclidean or Hamming) between the two biometrics and\
    \ finally user is authenticated when the biometric matches.\n\n#### System Implementation\n\
    \nA simple biometric system using facial features is implemented to test the system.\
    \ A python package called `face_recognition` is used to generate the face encoding\
    \ of a person and encrypt the feature vector using `AES256` algorithm. Then, the\
    \ encrypted text is stored in the blockchain network (enrollment). The text is\
    \ retrieved and decrypted during the authentication process. The smart contract\
    \ deployed in the network is given below.\n\n#### Smart Contract\n\n```solidity\n\
    pragma solidity >=0.4.22 <0.8.0;\ncontract Face {\n    //The encrypted encodings\
    \ are stored in a mapping with address as mapping key\n    mapping(address =>\
    \ string) private faceEncoding;\n    address public admin;\n\n    constructor()\
    \ {\n        admin=msg.sender;\n    }\n\n    function addFace(address adr,string\
    \ memory face) public {\n        //Only the admin (address used to deploy the\
    \ smart contract) has the privilege to add the face encoding\n        require(admin==msg.sender);\n\
    \        faceEncoding[adr]=face;\n    }\n\n    function getFace(address adr) public\
    \ view returns(string memory) {\n        return faceEncoding[adr];\n    }\n}\n\
    ```\n"
