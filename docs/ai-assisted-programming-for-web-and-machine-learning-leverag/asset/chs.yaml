  图 9.3 概述了使用 Amazon SageMaker 的部署流水线，从模型打包并上传到 S3 到创建节点。\n\n## PyTorch 模型\n\n####\
  \ 逐步部署过程\n以下是使用 SageMaker 部署 PyTorch 模型的逐步说明：\n\n1. 保存并打包模型：将您的模型和推理逻辑压缩为 `.tar.gz`。该归档通常包含：\n\
  a. `model.pt`: 序列化的 PyTorch 模型。\nb. `inference.py`: 定义 `model_fn()` 和 `predict_fn()`\
  \ 的脚本。\nc. （可选）`requirements.txt`: 其他依赖项列表。\n\n2. 将归档文件上传到 Amazon S3：\n\n```python\n\
  import boto3\ns3 = boto3.client('s3')\ns3.upload_file(\"model.tar.gz\", \"your-bucket\"\
  , \"model/model.tar.gz\")\n```\n\n3. 在 SageMaker 中创建 `PyTorchModel` 对象：\n\n```python\n\
  from sagemaker.pytorch import PyTorchModel\npytorch_model = PyTorchModel(\n    model_data=\"\
  s3://your-bucket/model/model.tar.gz\",\n    entry_point=\"inference.py\",\n    role=\"\
  arn:aws:iam::123456789012:role/SageMakerExecutionRole\",\n    framework_version=\"\
  1.12\",\n    py_version=\"py38\"\n)\n```\n\n4. 将模型部署为实时节点：\n\n```python\npredictor\
  \ = pytorch_model.deploy(\n    initial_instance_count=1,\n    instance_type=\"ml.m5.large\"\
  \n)\n```\n\n5. 调用部署的节点：\n\n```python\nresponse = predictor.predict({\"input\": [1.2,\
  \ 3.4, 5.6]})\nprint(response)\n```\n\n\n\n\nGitHub Copilot 和 ChatGPT 通过自动化 SDK\
  \ 配置、管理权限以及解决 AWS SageMaker 环境中的部署挑战，简化了云端部署：\n\n*   `GitHub Copilot`:\n    *  \
  \ 对 SageMaker SDK 的函数签名进行自动补全。\n    *   建议最佳的 `instance_type` 和 `entry_point` 配置。\n\
  *   `ChatGPT`:\n    *   提供 IAM 角色配置、S3 策略和端点测试的指导。\n    *   帮助调试部署错误并优化内存和计算设置。\n\
  \n这些工具共同通过减少手动脚本编写、提高配置准确性以及简化端点验证，显著加速了云端部署。\n\n### 在 SageMaker 上使用 Docker 进行自定义容器部署\n\
  \n虽然 SageMaker 为 `PyTorch` 等流行框架提供了广泛的预构建容器，但某些用例场景需要更大的灵活性——例如使用特定版本的库、安装小众包或实现自定义运行时逻辑。在这种情况下，SageMaker\
  \ 支持“自备容器”（BYOC）方法。\n\nBYOC 允许你定义自己的容器镜像，根据项目需求对其进行完全定制，并作为 SageMaker 推理端点进行部署。\n\
  \n#### BYOC 部署工作流\n\nSageMaker 中的 BYOC 方法通过允许开发者构建、推送和部署针对特定 ML 部署需求的自定义 Docker\
  \ 镜像，实现了对运行时环境的完全定制：\n\n1.  创建一个包含 `PyTorch` 和所有所需依赖项的 `Dockerfile`。\n2.  构建容器并将其推送到\
  \ Amazon Elastic Container Registry (`ECR`)。\n3.  配置 SageMaker 以引用来自 `ECR` 的自定义容器镜像。\n\
  4.  使用 SageMaker SDK 将模型部署到实时托管端点。\n\n示例：用于 SageMaker 的 `Dockerfile`\n\n以下 `Dockerfile`\
  \ 为 SageMaker BYOC 部署设置了自定义容器，符合平台的目录和环境变量的命名约定，以确保推理脚本的顺畅执行：\n\n```dockerfile\n\
  FROM pytorch/pytorch:1.12-cuda11.3-cudnn8-runtime\nCOPY inference.py /opt/ml/model/code/\n\
  RUN pip install flask sagemaker-inference\nENV SAGEMAKER_PROGRAM inference.py\n\
  ```此此设置使用了 SageMaker 预期的目录结构和环境变量（`SAGEMAKER_PROGRAM`）来正确定位并执行推理入口。\n\n#### AI 工具支持\n\
  \n通过自动化 `Dockerfile` 创建、优化容器设置以及通过智能建议解决配置问题，简化了 BYOC 部署流程：\n\n*   `ChatGPT`:\n\
  \    *   生成针对 SageMaker 兼容性优化的完整 `Dockerfiles`。\n    *   协助设置环境变量、数据卷和工作目录。\n  \
  \  *   排查与 BYOC 相关的构建错误和配置问题。\n*   `GitHub Copilot`:\n    *   填充 `Docker` 命令序列。\n\
  \    *   建议所需的 Python 包和 `pip` 安装命令。\n    *   协助优化容器镜像的尺寸和性能。\n\n使用 BYOC 为高级 ML\
  \ 应用提供了无与伦比的灵活性，而 SageMaker 则负责部署、扩展和端点管理。\n\n### SageMaker 中的监控与管理\n\n有效的部署并不会随着模型上线而结束——持续的监控和管理对于确保可靠性、性能和合规性至关重要。Amazon\
  \ SageMaker 通过提供日志、健康检查、流量缩缩和治理的内置工具，简化了这一过程。\n\n#### 关键监控与管理功能\n\n监控和管理对于在生产环境中维护可靠的\
  \ ML 服务至关重要。下表列出了 AWS SageMaker 提供的支持可观测性、合规性和扩展性的核心功能：\n\n| 特性 | 目的 |\n| :--- |\
  \ :--- |\n| `CloudWatch logs` | 跟踪推理延迟、错误消息和服务器运行时间 |\n| `Model monitor` | 自动检测数据漂移、架构违规或离群模式。\
  \ |\n| `Auto scaling` | 根据传入流量动态调整实例数量。 |\n| `Audit trails` | 记录 API 调用和用户操作，以备追溯和合规使用。\
