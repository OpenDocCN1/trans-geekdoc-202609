  \ `React` 到 `AWS Lambda` 的失效 fetch 请求。使用 `Copilot` 识别缺失的标头或格式不正确的负载。使用 `ChatGPT`\
  \ 解析 `CloudWatch` 日志并建议修复方案。报告根源以及在 AI 支持下解决问题所需的时间。\n\n9. 比较构建相同 ML 应用的两种开发方法——一种使用\
  \ AI 工具，另一种不：跟踪开发时间、错误率和代码可维护性。在 AI 辅助构建期间使用 `ChatGPT` 和 `Copilot`。以对比分析报告的形式提交结果。\n\
  \n10. 写一篇短文，讨论 `ChatGPT` 和 `Copilot` 等 AI 工具如何转变协作开发。示例包括提示词重用、代码标准化、调试支持和自动文档生成。\n\
  \n\n\n\n本章探讨了正在塑造 AI 辅助编程未来的开创性创新，包括自主编码代理、自然语言接口和多模态开发工具。本章分析了这些技术如何改变开发者的角色——从手动执行转向战略性编排——并实现更流畅、更智能的工作流。在关注这些进展的同时，本章还讨论了对伦理意识日益增长的需求，重点关注\
  \ AI 生成代码中的透明度、作者归属、公平性和问责制等问题。在本章节结束时，读者将理解在智能系统时代构建应用所伴的机遇与责任，并能够以清晰、创造和诚信的态度领导并贡献于\
  \ AI 驱动的开发。\n\n## AI 辅助编程中的新兴技术\n\nAI 辅助编程中的新兴技术正在改变我们处理软件开发的方式。通过整合区块链[1]]、AI 云平台[2]]、[3]]、[4]]以及边缘计算[5]]等创新工具，开发者现在能够创建更智能、更安全且高度扩展的解决方案。这些进步不仅简化了工作流，还确保了构建智能系统时更高的透明度、可追溯性和效率。随着我们不断前进，这些技术将重新定义开发的未来，为创新和增长提供前所未有的机遇。\n\
  \n### 使用区块链确保信任、追溯性和代码完整性\n\n在当今协作、快速开发的环境中，尤其是由 AI 增强的环境，作者归属、责任和合规性问题变得难以回答。区块链技术通过引入去中心化的、防篡的记录提供了一种强大的解决方案，确保整个开发生命周期的完整性和透明度[6]]。\n\
  \n#### 区块链在 AI 辅助编程中的作用\n\n区块链技术正日益整合到 AI 辅助编程工作流中，以增强安全性、可追溯性和合规性。以下用例说明了区块链如何在这一不断变化的开发格局中发挥关键作用：\n\
  \n*   不可篡的代码溯源：每个 AI 生成的代码片段都可以进行哈希处理并存储在区块链账本上，允许团队追溯其来源并监控随时间的变化[7]]。\n\n*   智能合约许可：软件许可证（无论是开源还是专有）都可以嵌入到智能合约中以管理代码使用，自动减少法律歧义[8]]。\n\
  \n*   安全的 CI/CD 流水线：基于区块链的日志可以记录构建批准、测试结果和部署签名，创建一条可审计的轨迹，这对于医疗保健或金融等高合规性行业无价之[9]]。\n\
  \n#### 现实用例\n\n一家大型企业维护着所有已批准代码组件的区块链账本。当 `Copilot` 建议一个代码片段时，系统会将其哈希值与账本进行对比，以验证其是否经过审查和批准，确保没有未经授权的\
  \ AI 生成代码引入生产环境[10]]。\n\nCopilot 实战：当开发者编写一个预提交钩子（pre-commit hook）时，`Copilot` 自动完成逻辑，对每个文件进行哈希处理并与区块链验证器智能合约接口。\n\
  \nChatGPT 提示词示例：编写一个 Solidity 智能合约，记录提交代码的 SHA-256 哈希值，并赋予审核员和维护者权限。\n\n区块链不会为你编写软件，但它可以保证你交付的软件的完整性、可追溯性和法律合规性。与\
  \ AI 辅助编码相结合，它弥补了快速开发与稳健治理之间的差距，让团队有信心在不破坏信任的情况下快速移动[10]]。\n\n### 用于按需扩展智能的 AI 云平台\n\
  \n随着 AI 模型变得变得更大、更智能，并成为现实世界应用的核心，对实时推理、灵活训练流水线和自动化部署的需求前所未有。AI 云平台应运而生——这些成为智能软件交付基础的稳健生态系统。\n\
  \n如 `AWS Bedrock`[2]]、`Google Vertex AI`[3]]和 `Azure OpenAI Studio`[4]]等平台现在为开发者提供了构建、扩展和维护\
  \ AI 驱动应用程序所需的一切，消除了管理复杂基础设施的需求。这些平台将传统的开发瓶颈转化为由按需智能驱动的流畅、编排的工作流。\n\n#### AI 云平台的关键作用\n\
  \nAI 云平台已成为现代机器学习工作流的骨干，提供了可扩展的工具和基础设施，民主化了访问强大模型的途径，并简化了从实验到部署的整个开发周期。现代 AI 云服务提供了一系列能力，使得从想法到生产变得比以往任何时候都容易：\n\
  \n*   基础模型访问：开发者可以通过安全、可扩展的 API 利用强大的大语言模型，例如 `GPT-4`[11]]、`Claude`[12]]或 `Gemini`[13]]。无需模型训练或基础设施设置——即插即用。\n\
  \n*   AutoML 流水线：通过直观的拖拽式界面，即使是非专家也可以训练和微调自定义模型、进行超参数优化并评估性能——而无需编写单行训练代码[14]]。\n\
  \n*   MLOps 自动化：这些平台包含了对版本控制、自动化测试、持续部署和模型监控的内置支持，将模型开发转变为可重复的、生产级的过程[15]]。\n\n\
  #### 现实工作流实战\n\n想象一下：开发者使用 `ChatGPT` 设计了一个用于检测欺诈交易的分类模型。几分钟内，他们使用 `Google Vertex\
  \ AI` 的 AutoML 服务[14]]部署了该模型，并连接到通过 `Firebase` 托管的 React 仪表板。从建模到部署的整个流水线在几小时内即可完成。\n\
  \n### Copilot 与 ChatGPT 的卓越工具集成\n\n当整合到云工作流时，`GitHub Copilot` 和 `ChatGPT` 等 AI 辅助开发工具通过自动化任务、简化架构选择和加速部署准备，显著提升了开发者的生产力和决策能力。这些平台与\
  \ AI 辅助开发工具结合时变得更加强大：\n\n*   `GitHub Copilot` 通过自动补全配置文件、身份验证流和 SDK 逻辑来简化云集成，使用的库包括\
  \ `boto3` (AWS)、`VertexAI` (Google) 或 `azureml-core` (Microsoft)[16]]。\n\n*   `ChatGPT`\
  \ 通过以下方式协助开发者：\n    *   解释平台权衡（例如性能与成本）。\n    *   排排除部署问题。\n    *   推荐安全高效架构的实践建议[17]]。\n\
  \n提示词示例：根据延迟、成本和集成便利性，比较 `AWS SageMaker`、`Azure ML Studio` 和 `Google Vertex AI`\
  \ 用于实时欺诈检测的应用。\n\n### 从基础设施到意图的展望\n\n随着 AI 云平台的不断演进，它们开始模糊编码与编排之间的边界。开发者不再需要配置计算节点或手动设置\
  \ API，而是将用自然语言描述他们的需求：\n\n```\n部署此模型进行实时分类，支持自动伸缩，并将推理指标记录到 BigQuery。\n```\n\n\n\
  \n云端将处理其余一切——资源配置、端点设置、性能监控，甚至提供优化建议。\n\nAI 云平台不再仅仅是基础设施的提供者——它们正在成为智能协作者。通过将这些能力与\
  \ `ChatGPT` 和 `Copilot` 等 AI 辅助工具相结合，开发者可以移动得更快、构建更智能的系统，并将更多精力专注于创新而非配置。\n\n在这个新时代，如何有效地编排\
  \ AI 服务将与编写代码同样重要。云端提供动力，但开发者仍将提供愿景。\n\n### 通过物联网和边缘 AI 实现边缘侧智能\n\n世界正在变得更加聪明——不仅在云端，而且在边缘。从智能恒温器、可穿戴健康监测器到工业机器和自主无人机，物联网（`IoT`）正在改变数据收集和利用的方式。然而，真正驱动这一转变的力量是边缘\
  \ AI——即在靠近数据产生的设备上直接运行智能模型的能力。\n\n随着设备变得越来越强大且连接紧密，边缘 AI 为软件系统带来了新水平的自主性、响应性和隐私保护。它不再仅仅是收集传感器数据，而是为了在交互点做出实时决策。\n\
  \n#### 通过物联网和边缘 AI 赋能 AI 辅助开发\n\n边缘 AI 与 `ChatGPT` 和 `GitHub Copilot` 等 AI 辅助工具相结合时，构建智能、响应的系统变得比以往任何时候都更容易。实现方式如下：\n\
  \n*   设备端推理：`TensorFlow Lite` 和 `ONNX Runtime` 等框架允许在 `ESP32`、树莓派和 `NVIDIA Jetson`\
  \ 等低功耗设备上运行优化模型。这些模型可以分类图像、检测异常或预测动作——且无需访问云端。\n*   离线智能：边缘设备在断开连接或低带宽环境中运行可靠，使其成为农村地区、远程工厂或任务关键系统的理想选择。\n\
  *   上下文感知自动化：这些系统配备了本地传感器和逻辑，能够对变化的情况瞬时做出，根据实时输入调整温度、发送警报或激活机械。\n\n### 边缘智能农业的应用场景考虑一家专注于智能灌溉系统的初创公司。使用\
  \ AI 辅助开发工具，团队构建了一个分类土壤水分水平的 `TensorFlow Lite` 模型。该模型直接部署在现场的 `ESP32` 微控制器上。为了说明\
  \ AI 辅助开发和边缘计算在现实应用中的汇聚，请考虑以下涉及部署智能灌溉系统的智能农业初创公司的场景：\n\n*   当土壤过干时，设备会自动触发灌溉。\n\
  *   水分读数记录在本地网关中，网关定期将数据同步到云端。\n*   合规报告和运行日志写入区块链账本，确保农业监管机构的透明度和可追溯性。\n\n该系统自主运行，不需要持续的互联网连接，并在\
  \ AI 的帮助下构建得更快、更可靠。\n\n#### ChatGPT 和 Copilot 对边缘 AI 开发的贡献\n\n边缘 AI 开发需要精密度效率，`ChatGPT`\
  \ 和 `Copilot` 等 AI 工具正在介入以简化这一过程。它们共同协助模型部署、硬件交互和代码优化。以下是每个工具如何支持边缘 AI 工作流。\n\n\
  ##### ChatGPT 的贡献\n\n`ChatGPT` 通过在关键技术任务中提供智能辅助，在简化边缘 AI 开发方面发挥着至关的作用：\n\n*   生成模型转换脚本，用于将训练好的模型部署到嵌入式设备（例如使用\
  \ `TFLiteConverter`）。\n*   推荐内存优化技术，使模型适应严苛的 RAM/ROM 限制。\n*   解释用于设备到云端消息传递的协议，如\
  \ `MQTT` 或 `CoAP`。\n\n##### GitHub Copilot 的用例\n\n`GitHub Copilot` 通过加速底层编码并为边缘部署建议优化模式，增强了嵌入式开发工作流：\n\
  \n*   自动补全传感器（如水分、光照、温度）的 `GPIO` 设置代码。\n*   为设备行为生成中断处理程序和状态机逻辑。\n*   为 `TinyML`\
  \ 库、`WiFi` 通信和低功耗睡眠周期建议集成模式。\n\n### 必须掌握的边缘工具链\n\n边缘 AI 开发由一系列专用平台驱动，这些平台简化了模型训练、部署和连接。下表了每个\
  \ AI 辅助开发者都应该熟悉的常用边缘工具链：\n\n| 工具或平台 | 功能 |\n| :--- | :--- |\n| `Edge Impulse` |\
  \ 为嵌入式设备训练、优化并部署 ML 模型。 |\n| `TinyML` + `TensorFlow Lite Micro` | 在 `Arduino` 等极受限的设备上运行高效模型。\
  \ |\n| `AWS IoT Greengrass` / `Azure IoT Edge` | 同步边缘设备与云端并管理空中更新。 |\n\n表 11.1：支持边缘\
  \ AI 部署的关键工具链\n\n`ChatGPT` 提示词示例：将 `scikit-learn` 决策树转换为兼容 `TinyML` 的代码以便在 `Arduino`\
  \ 上运行。\n\n`ChatGPT` 不仅生成流水线，还解释了准确性与模型大小之间的权衡，甚至建议如何压缩输入特征以提高性能。\n\n#### 理解其重要性\n\
  \n`IoT` 和边缘 AI 实现了超本地智能——这些系统是：\n\n*   主动的（它们会行动，而不仅仅是感知）\n*   个性化的（它们适应现实世界的情况）\n\
  *   韧性的（即使离线也能继续工作）\n\n当与 AI 辅助编程相结合时，曾经令人生畏的构建嵌入式智能系统的任务变得更快、更智能且易得多。开发者可以专注于逻辑和影响，而\
  \ AI 工具处理底层代码、转换和集成细节。\n\n### 共同构建更智能系统的协同影响\n\n我们探索的每种技术——区块链、AI 云平台和结合边缘 AI 的\
  \ `IoT`——本身都是强大的。然而，当它们组合成一个协同的生态系统时，其真实潜力才会释放。它们共同成了自主、智能和去中心化系统的骨干，这些系统能够在极少人工干预的情况下学习、适应并做出决策。\n\
  \n#### 展示汇聚力量的智能城市场景\n\n让我们想象一个不远的未来场景——一个由这些汇聚技术构建的智能城市：\n\n*   部署在城市各处的 `IoT`\
  \ 传感器收集交通、污染和行人实时数据。\n*   边缘设备在现场进行分析以检测拥堵或空气质量超标，无需持续访问云端。\n*   AI 云平台根据不断演变的模式每天重新训练模型，并自动向边缘节点推送更新。\n\
  *   区块链账本记录交通事件、政策变化和系统响应——确保公共透明度、审计性和长期数据完整性。\n\n\n\n\n随着这些系统变得日益复杂，开发者的角色也在发生演变。这不再仅仅关于编写高效的函数或构建\
  \ UI 组件——而是跨多个由不同技术驱动的系统编排智能行为。\n\n在 AI 辅助编程工具辅助：\n\n*   你不再是手动配置边缘部署——你是在描述它们。\n\
  *   你不再是管理区块链哈希值——你是在通过区块链生成的脚本对其进行验证。\n*   你不再是从零开始构建——你是在设计能够学习、适应并自我管理的系统。\n\n\
  在这一新兴模型中，开发者成为了系统设计者、数据管理员和伦理架构师，而 AI 工具在每一步都为其提供支持，帮助连接各项技术之间的纽带。\n\n## 融合的力量\n\
  \n区块链、AI 云平台和物联网（IoT）的融合不仅仅是技术的整合，更是一场范式转移。它使我们能够构建出具有以下特征的系统：\n\n*   边缘智能\n*  \
  \ 云端可扩展\n*   通过去中心化实现信赖\n\n当与 AI 辅助开发工具相结合时，这种协同效应使开发者能够比以往任何时候都更智能、更快速、更负责任地构建系统，将复杂性转化为机会。\n\
  \n## AI 开发中的伦理挑战与思考\n\n随着 AI 工具成为软件开发中不可或缺的一部分，它们引入的伦理挑战正变得日益重要。从解决 AI 生成代码中的偏差到管理归属和问责制，开发者必须应对一系列复杂问题，以确保以负责且公平的方式使用\
  \ AI。这些伦理考虑不仅对于维护信任至关重要，对于构建公平、安全且符合社会价值观的系统同样关键。\n\n### AI 生成代码和数据模型中的偏差\n\nAI\
  \ 辅助开发中最关键且可见的挑战之一是偏差，这种偏差最初通常是不可见的，但在实践中可能会产生危害。\n\nAI 工具使用从代码存储库、论坛、文档和用户生成内容提取的海量数据集进行训练。虽然这种训练赋予了它们广阔的能力，但也让它们暴露在所学习数据中所嵌入的假设、差距和刻板印象中[29]。\n\
  \n#### 偏差的实际示例\n\n即使是最先进的 AI 系统也会反映并放大人类的偏见——往往以微妙但产生影响的方式影响代码质量、公平性和安全性。以下示例说明了偏差如何在真实的\
  \ AI 辅助开发场景中显现：\n\n*   刻板的默认值：AI 建议使用 `adminMale` 或 `nurseFemale` 等变量名，强化了过时的角色关联。\n\
  *   安全漏洞：生成硬编码凭据、忽略输入验证或依赖不安全默认值的代码。\n*   偏斜预测：在招聘、信用评分或内容审核等背景下，产生歧视（无论是有意还是无意）针对某些年龄组、性别或人口统计数据的机器学习模型[30]。\n\
  \n这些不仅仅是技术上的疏忽。如果不加检查，带有偏差的代码可能会加剧不平等，违反法规并损害用户信任。\n\n### 给开发者的建议行动\n\n偏差并不能完全消除，但可以被识别、处理和减少。这种责任是从开发者开始的。\n\
  \n以下是开发者可以采取的关键行动，以促进其 AI 驱动工作流中的公平性、问责制和质量：\n\n*   批判性审查：仔细评估 AI 生成的建议，特别是在医疗、人力资源、教育和金融等敏感领域。\n\
  *   公平性测试：通过提出针对性问题或运行边界情况场景来让 AI 进行自我审计[31]。\n*   模型定制：当默认输出未能反映您的应用程序所需的价值或标准时，对模型进行微调或适配。\n\
  \n#### 使用 AI 检查自身\n\n`ChatGPT` 等工具的优势在于，它们也可以用于审视自己生成的输出。\n\n提示词示例：`这个机器学习模型可能会歧视老年用户吗？请提出建议。(Is\
  \ this machine learning model likely to discriminate against older users? Suggest\
  \ improvements.)`\n\n`ChatGPT` 可以识别特征不平衡，建议重权重或重采样等缓解策略，并解释如何引入公平性约束——这一切都使用通语言\
  \ [32]。\n\n##### 关键提醒\n\nAI 生成代码中的偏差很少是故意的，但往往是系统性的。因为这些工具是基于数百万开发者和用户的集体输出训练的，它们既反映了我们编程历史的光辉时刻，也反映了其中的盲点。\n\
  \n确保公平的责任不在 AI，而在于我们。开发者必须超越`这段代码能运行吗？`，转而询问`这段代码可能会伤害谁？`。通过将偏差视为像安全漏洞一样的开发风险，我们可以开始构建不仅是更智能，而且更伦理的软件。\n\
  \n### AI 生成代码中的归属与问责\n\n`GitHub Copilot` 和 `ChatGPT` 等 AI 工具可以在几秒钟内生成数百行代码。然而，当出现问题时会什么？如果这些代码引入了漏洞、违反了许可证或创建了安全漏洞，问题随之：谁负责？\n\
  \n这不仅仅是一个理论上的担忧。随着 AI 成为开发工作流中的常态，归属、所有权和责任问题已从背景移动到了焦点中心[33]。\n\n### 理解法律和运营风险\n\
  \n随着 AI 辅助编程变得流行，开发者和组织必须意识到其引入的法律和运营风险。以下示例突出了两个归属和责任不明可能构成重大挑战的关键领域。让我们来看两个主要的关注领域：\n\
  \n*   归属的模糊性：当 AI 工具生成代码时，它们通常会（有意或无意）从其训练的海量开源存储库中汲灵感。例如，`Copilot` 可能会产生与`GPL`许可内容相似的片段。如果开发者在未注明或未检查来源的情况下使用该输出，可能会无意中违反开源许可条款[34]。\n\
  *   责任缺口：如果 AI 生成的代码导致安全漏洞、在生产环境中失败或导致财务或声誉损害，通常不清楚谁负责。是接受建议的开发者吗？是部署代码的公司？还是 AI\
  \ 工具背后的供应商？\n\n这些灰色地带已经引发了法律审查，并且随着 AI 工具集成到关键任务系统中，这些问题将变得更加紧迫。\n\n#### 管理问责制的最佳实践\n\
  \n为了应对这些挑战，开发者和组织需要像对待人类编写的代码一样（甚至更）严谨谨慎地对待 AI 生成的代码。\n\n以下是方法：\n\n*   将 AI 生成的代码视为草稿：永远不要假设输出已准备绪。在将其合并到代码库之前，对其功能进行审查、测试和验证。\n\
  *   检查合符合性：特别是当 AI 生成的代码类似于著名的算法或实用函数时，要验证其没有侵犯限制性许可证[35]。\n*   记录意图和修改：如果您将 AI\
  \ 生成的代码整合到产品中，请清楚地记录其意图和任何修改。添加注释、归属以及内部说明，说明代码来自何以及经过如何审查。\n\nChatGPT 提示词示例\n\n\
  AI 还可以帮助您调查合规性问题。例如：\n\n`这段代码与任何 GPL 许可的库相似吗？我该如何验证其许可证合规性？`\n\n\n\n\nChatGPT 可以引导你检查许可证匹配情况、推荐扫描工具，并解释各种开源许可证的细微差别。\n\
  \n## 针对团队和组织的策略性建议\n\n随着 AI 采用率的提高，解决方案并不是停止使用 AI，而是构建支持其负责任运行的框架。\n\n以下是组织应该考虑实施的关键措施，以确保\
  \ AI 工具的使用是负责任且合规的：\n\n*   创建内部 AI 使用策略，定义哪些行为是可接受的。\n*   设置自动化许可证扫描器以标记有问题的代码。\n\
  *   实施审查工作流，对 AI 生成的贡献采取与人类贡献同等的审慎态度[36]。\n\n随着时间的推移，这些实践将形成可信、可扩展的 AI 辅助开发的基础。在这种环境下，创新不会被风险阻碍，而是通过深思熟虑的工程得到保护。\n\
  \n## 隐私与提示敏感性\n\nChatGPT 等 AI 工具已成为开发者不可或缺的助手，帮助他们在数秒内调试问题、重构代码并解释复杂概念。然而，这种便利也带来了一个微妙但严重的风险：无意的数据泄露。\n\
  \n由于这些工具通过云端 API 运行，提示词（prompt）中的任何内容都会在外部进行处理。此外，如果提示词包含敏感信息——即使是无意包含——也可能导致数据泄露或违反合规性[37]。\n\
  \n### 理解真实风险\n\n在急于修复 bug 或寻求棘查询查询帮助时，开发者可能会在无意中分享本不应离开其内部环境的数据。\n\n以下是常见的现实场景，敏感信息可能在此被无意中共享给\
  \ AI 系统：\n\n*   将包含内部数据库架构或用户凭据的错误日志复制到 ChatGPT。\n*   在排查个性化系统的 bug 时，提交客户记录。\n\
  *   为了测试或解释，将 API 密钥或机密粘贴到提示词中。\n\n即使这些提交是无意的，它们仍可能违反数据隐私法规（如 `GDPR` 或 `HIPAA`）或您组织的内部安全策略。\n\
  \n### 通过实用的缓解策略保持安全\n\n好消息是，通过审慎的实践，可以大幅减少 AI 辅助开发中数据泄露和滥用的风险。以下开发者指南提供了实用的步骤，以确保更安全、更负责任地使用\
  \ AI 工具：\n\n*   在向 AI 工具提问或共享代码时，使用模拟数据或脱敏数据，以确保机性和数据保护。\n*   利用企业级 AI 服务，这些服务提供加密传输、私有处理和严格的数据留存策略等功能[38]。\n\
  *   通过提示词卫生培训教育您的团队，帮助每个人识别哪些类型的数据绝不应包含在 AI 交互中。\n\n这些实践不仅是为了合规，更是为了养成保护用户、系统和声誉的习惯。\n\
  \n### 用于更安全 AI 使用的 ChatGPT 提示词\n\n一个很有用的用例是让 AI 帮助你保持合规：\n\n`生成此 API 负载的模拟版本用于测试目的，排除任何真实的客户标识符。`\n\
  \nChatGPT 可以以匿名化的结构进行响应，镜像你的真实数据格式，从而实现安全的调试和协作。\n\n### 简单准则\n\n如果你不会将某内容粘贴到公共的\
  \ `GitHub` issue 中，就不要将其粘贴到 AI 提示词中。\n\n正如我们谨慎对待源代码、日志和数据库导出一样，我们必须将 AI 提示词视为开发边界的一部分。它们是可搜索的、可存储的（取决于提供商），并且可能被第三方访问。\n\
  \n简而言之，隐私并不止于你的键盘。它延伸到了你的提示词中。\n\n## 对 AI 的过度依赖与开发者技能的萎缩\n\n不可否认，AI 工具正在加速开发过程。通过一个提示词，开发者就可以生成函数、修复\
  \ bug 或搭建整个组件。然而，这种便利伴随着隐藏的成本，特别是对于那些仍在学习这项手艺的人来说。\n\n如果不加批判地使用，AI 可能会成为智力上的拐杖。它不仅不能让开发者进行更深思考，反而可能导致盲目接受解决方案的习惯，而不理解它们是如何工作的，或者为什么可能会失败[39]。\n\
  \n### 轻视技能的风险\n\n当开发者过度依赖 AI 建议时，他们面临着跳过核心学习体验的风险。结果通常以微妙但严重的方式出现：\n\n*   浅薄的调试技能：当开发者没有编写或未完全理解代码时，他们难以追踪\
  \ bug。\n*   脆弱的架构决策：粘贴的模式可能有效，但缺乏可扩展性和凝聚力。\n*   解决问题能力下降：开发者依赖提示词，而不是发展逻辑推理。\n\n\
  这些风险在初级开发者或学生中尤为突出，他们可能过度依赖 AI 而缺乏编写安全、可维护且高性能代码的能力。\n\n### 实用的缓解策略\n\nAI 工具既可以成为学习的捷径，也可以强化学习。区别在于你如何使用它们。以下是负责任地使用\
  \ AI 工具以加强理解的实用方法：\n\n*   将 AI 视为导师而非仅仅生成器。让它解释代码，而不只是编写代码。\n*   将输出与学习任务结合，如 `重构此函数`、`解释时间复杂度`或\
  \ `与替代方案进行基准测试`。\n*   与同事或导师一起审查 AI 辅助的代码，以强化问责制。\n\n这使 AI 从沉默的自动驾驶模式转变为交互式的教育伙伴。\n\
  \n### 促进深度学习的提示词\n\n为了鼓励成长，可以使用如下提示词：\n\n`解释此排序算法的工作原理，以及它在什么情况下表现最好或最差。`\n\n结果不仅是代码可用，更是对逻辑、效率和设计权衡的深度掌握。\n\
  \n### 机构在 AI 素养教育方面的责任\n\n随着 AI 工具成为开发工作流的标准，培养知情且伦理使用的责任已从个人扩展到机构。以下建议概述了教育机构和组织如何在学习环境和职业文化中融入\
  \ AI 素养：\n\n*   将 AI 素养融入编码课程——不仅是学会使用工具，还有如何质疑和验证其输出。\n*   引入关于伦理提示词、许可证意识和 AI\
  \ 局限性的模块。\n*   培养一种重视好奇心、解释和迭代而非单纯速度的文化。\n\n目标是培养出不仅是程序员，更是自信且具有批判性思维的思考者，他们能够与\
  \ AI 有效协作。\n\n## 透明度、可解释性与可调试性\n\nAI 工具正在成为强大的协作开发者，建议函数、生成逻辑，甚至协助模型设计。然而，随着开发者越来越多地在生产系统中依赖\
  \ AI 生成的代码，一个关键要素往往缺失了：解释。\n\n为什么 AI 选择这种方法？为什么选择这种数据结构、这种模型或这种相似性度量？在看不到建议背后的逻辑的情况下，开发者只能面对难以理解、调试或维护的有效代码[40]。\n\
  \n### 缺乏解释性代码的影响\n\n在 AI 辅助开发中，缺乏解释性的代码不仅阻碍理解，还引入了严重的技术和合规挑战。以下几点突出了在处理对逻辑或来源毫无见解的代码时面临的主要风险和后果：\n\
  \n\n\n\n\n*   逻辑流不清晰：AI 生成的代码通常可以运行，但由于缺乏清晰的文档或结构，使其变得难以追踪或扩展。\n\n*   调试变成猜谜：在不理解\
  \ AI 逻辑的情况下，修复错误或改进性能感觉就像在对他人的代码进行逆向工程。\n\n*   合规性与监管风险：在金融、医疗或招聘等敏感领域，监管机构要求具有可解释性。做出影响决策的系统必须对这些决策如何产生保持透明[40]。\n\
  \n## AI 工具在此类语境下的局限性\n\n`GitHub Copilot` 等工具在补全代码方面表现出色，但它们并不对其推理过程提供解释。你可能会获得一个高效的函数，但无法了解以下见解：\n\
  \n*   为什么选择特定的算法\n\n*   做了哪些假设\n\n*   如何处理边界情况\n\n这种“黑盒”方法虽然高效，但存在风险，特别是当涉及到维护性、伦理或法律合规性时。\n\
  \n### 提高 AI 输出可解释性的最佳实践\n\n 幸运的是，开发者不必盲目接受 AI 代码。通过几个简单的习惯，你可以让开发过程恢复透明度。\n\n以下实用策略有助于确保\
  \ AI 生成的输出保持可理解、可评审且面向未来的特性：\n\n*   要求 `ChatGPT` 解释其输出。不要仅仅生成代码——要询问为什么采用这种方法，以及有哪些替代方案。\n\
  \n*   当 AI 建议架构或算法更改时，添加理由说明注释。一条简单的备注，如 `使用余弦相似度来捕捉向量之间的相对距离`，在以后可以节省数小时的时间。\n\n\
  *   维护提示词日志（prompt logs）。保存生成代码时使用的上下文。这些日志在代码审查、审计和未来的重构中具有无价价值。\n\n### 用于可解释性的\
  \ ChatGPT 提示词\n\n这是一个简单但强大的提示词：\n\n`解释为什么这个推荐模型使用余弦相似度而不是欧式距离。`\n\n`ChatGPT` 可以提供关于用例和性能影响的见解，甚至建议可视化方案或边界情况测试，将不透明的代码转换为透明、可教学的产物。\n\
  \n### 在高风险或低语境领域中误用 AI\n\nAI 是强大的，但在错误的语境下或在缺乏适当监督的情况下，其害可能大于利。这一点在医疗、刑事司法、国防、教育或金融服务等高风险领域表现得为明显。\n\
  \n在这些环境中，AI 不仅仅是在帮助开发者编写代码——它正在影响可能影响生活、生计或自由的决策[41]。\n\n### 理解问题出在何处\n\n风险并不总是由于恶意。通常，AI\
  \ 系统被部署在以下场景中：\n\n*   在没有经过验证或审查的情况下，过度信任了 AI 生成的输出。\n\n*   利益相关者（如政策制定者或最终用户）缺乏质疑\
  \ AI 行为的技术背景知识。\n\n*   忽视了当地语境，导致不公平、不准确甚至有害的后果。\n\n### 现实的伦理困境\n\n想象在一个多语言区域内部署一个由\
  \ AI 驱动的内容审核系统。如果该系统没有经过训练来理解当地方言或文化表达，它可能会将无害内容误分类为攻击性内容，从而沉默某些声音并扭曲公民话语。更糟糕的是，如果没有人工审查流程，这些错误可能在信任已经丧失之前无法被发现。\n\
  \n### 负责任开发的实践\n\n在构建 AI 驱动的系统时，以下实践有助于确保 AI 生成的输出保持可理解、可评审且面向未来的特性：\n\n*   建立“人在回路”（human-in-the-loop）流程，确保\
  \ AI 生成的决策由人类审查，特别是当它们影响访问或权利时[42]。\n\n*   使用 AI 识别潜在的偏见或盲点，帮助开发者批判性地思考公平性和包容性。\n\
  \n*   标记歧视或排除性的逻辑：例如，建议一种比二元法更具包容性的用户分类方法。\n\n*   推荐隐私意识实践：包括对敏感数据进行哈希处理、减少个人身份信息\
  \ (`PII`) 的收集，并遵循同意优先的数据收集原则。\n\n*   自动生成审计轨迹：捕每个 AI 建议背后的提示词、上下文和逻辑，确保代码生成和部署的可追溯性和问责制[43]。\n\
  \n\n\n\n\n在快速演变的 AI 辅助开发领域，创造力在编程中的作用正在被重新定义。随着 AI 接管了重复性任务，开发者获得了更多的空间来关注创新型、高影响的工作。虽然自动化提升了效率，但人性的因素确保了\
  \ AI 是作为创造力的伙伴而非其替代者。开发者必须拥抱一种全新的创造性身份——一种能够平衡 AI 力量与自身愿景、直觉和解决问题能力的认同。\n\n## 在\
  \ AI 时代重新定义开发者的创造力\n\n几十年来，编程中的创造力以许多形式表现：设计优雅的解决方案、编写高效的算法、构建精美的 UI/UX、工程化可扩展的系统架构。\n\
  \n然而，在今天，AI 处理了许多曾经占据开发者全天工作的重复性、结构性和语法类的劳动。因此，开发者被释放出来去从事更有意义的创造性工作——前提是他们愿意拥抱一种全新的创造性身份。\n\
  \nAI 并没有取代创造力——它放大了创造力。处理脚手架和模板化代码为开发者留出了空间去探索更深层次的想法，并突破他们可能没有时间或精力去追求的边界。\n\n\
  ## AI 赋予的创造力新维度\n\nAI 辅助工具不仅是在加速开发——它们还在扩展开发者和设计师在创造力上的可能性。以下是 AI 在软件开发中开启创造性思维和探索新维度的关键方式：\n\
  \n*   **快速原型制作**：开发者可以在几小时内从想法变为可行的演示，而不是数几天。`Copilot` 和 `ChatGPT` 帮助生成启动代码，留出更多时间对概念本身进行迭代。\n\
  *   **领域探索**：`ChatGPT` 像一个技术导游——解释陌生的库、建议新的算法、或引入与你的目标相匹配的设计模式。\n*   **设计迭代**：需要为仪表盘测试多种布局或主题吗？AI\
  \ 可以生成备选方案，允许团队在提交设计之前探索视觉和功能方向。\n\n### 使用 AI 的真实创造性工作流\n\n考虑一个开发者正在为老师构建一个直观的仪表盘，用于跟踪学生进度。以下是\
  \ AI 辅助创造力的运作方式。\n\n`ChatGPT` 提示词示例：\n\n`使用 Tailwind CSS 和无障碍色彩方案，为跟踪学生进度的老师设计一个直观的仪表盘布局。`\n\
  \n`ChatGPT` 回复了清晰的组件布局、以用户为中心的功能以及无障碍指南。它不仅仅是在编写代码——它在为愿景做出贡献。\n\n`GitHub Copilot`\
  \ 的应用：\n\n当开发者开始构建时，`Copilot` 提供了：\n\n*   响应式卡片组件\n*用于无障碍的 ARIA 标签\n*   一致的 Tailwind\
  \ 工具类\n\n而开发者专注于叙述流、用户共情和可用性。\n\nAI 加速了开发——但重要的是，它为创造力腾出了空间。当有目的地使用这些工具时，它们不仅仅是协助——它们增强了开发者设计、想象和创新的能力。\n\
  \n## 过度自动化和创造停滞的风险\n\n虽然 AI 工具可以极大提升开发，但支持与过度依赖之间存在着界限。当开发者开始毫无疑问地接受 AI 生成的代码时，他们面临陷入创造力停滞状态的风险——在这种情况下，效率取代了洞察，速度掩盖了思考。\n\
  \n随着时间的推移，这种过度自动化会导致核心工程直觉的下降——那些帮助我们调试、优化和创新的直觉。\n\n### 创造力消失的迹象\n\n虽然 AI 可以成为强大的创造力伙伴，但对其输出的过度依赖会逐渐侵蚀批判性思维和原创性。留意这些迹象，开发者的创造力可能正在向被动接受和模式复制转变：\n\
  \n*   **接受代码未经过批判性审查**：开发者盲目信任 AI 输出，而不质疑其是否符合产品需求。\n*   **解决方案遵循建议而非问题**：代码不是为了解决真实的用户问题，而是为了满足\
  \ AI 的提议。\n*   **模式被复制而非被考虑**：技术上看起来正确的设计选择可能会忽略重要的业务规则、可扩展性限制或可用性原则。\n\n### 理解原因\n\
  \n`Copilot` 和 `ChatGPT` 等 AI 模型经过训练，可以提供合理的解决方案——即根据现有示例在统计学上可能是正确的代码。然而，合理并不总是等同于正确。\n\
  \n\n\n\n\n将 AI 视为你的实时协作者——它随时准备好提供建议、支持并加速你的工作，但永远不会取代你的愿景或权威。就像一个熟练的队友一样，AI 可以处理开发中枯燥或机械的部分，让你能够专注于解决问题、创造力和战略性思考。\n\
  \n### 人类与 AI 动态关系的工作机制\n\n有效的 AI 辅助开发并不是为了取代开发者，而是通过互补的伙伴关系来放大他们的能力。下表说明了在软件开发周期的关键阶段，AI\
  \ 工具与人类开发者之间如何分工：\n\n| 角色 | AI 助手 | 人类开发者 |\n| --- | --- | --- |\n| 构思 | 建议结构、方法和流程\
  \ | 评估、调整并使想法与用户需求对齐 |\n| 实现 | 自动补全函数和模式 | 完善、优化并确保上下文一致 |\n| 测试 | 生成基础测试用例和模拟数据\
  \ (mocks) | 验证边界情况、逻辑和真实世界的行为 |\n| 文档编写 | 起草初始注释或摘要 | 解释原理、意图和业务逻辑 |\n\n表 11.2：人机协作开发中的角色分配\n\
  \n这种分工维持了最重要的要素——开发者的主体性（developer agency）。AI 可能可以帮助“如何做”，但“为什么”、“何时”以及“为了什么”仍然牢牢掌握在人类手中。\n\
  \n### 该模型的重要性\n\n在这种协作模式下，开发者并没有失去控制权——他们获得了放大的带宽。你可以：\n\n* 更快速地进行实验，无需担心从零开始。\n\
  * 在 AI 负责填补重复性空白的同时，保持对产品目标的关注。\n* 通过与智能助手进行脑风暴来做出更好的决策。\n\n这不再仅仅关于更快速地编写代码——而是为了让更好的想法出现腾出空间。有了\
  \ AI 作为副驾驶（copilot），开发者被赋予了思考得更宏大、设计得更智能以及更有信心地发布的能力。\n\n### 案例场景中的创造性编程实践\n\n为了真正理解\
  \ AI 如何增强开发中的创造力，让我们来看一个真实世界的场景。\n\n项目：智能学习伙伴\n\n想象你是一个开发者，被要求构建一个个性化学习应用——该应用能够根据每个学生的表现动态调整测验难度。你希望它是公平的、具有视觉吸引力的，并且是为每位学习者的节奏量身定制的。\n\
  \n这类项目既需要技术结构，也需要创造性的决策，从自适应算法到深思熟虑的用户体验。\n\n#### 利用 AI 增强创意流\n\nAI 工具正在重塑开发工作流，它们不仅支持执行，还支持构思、设计和适应性。以下示例展示了\
  \ `ChatGPT` 和 `GitHub Copilot` 如何贡献更流畅、更具创造性的开发体验，帮助你从想法转向智能的以用户为中心的功能：\n\n* `ChatGPT`\
  \ 帮助启动逻辑：以下它是如何帮助启动自适应、公平且响应系统的核心逻辑的：\n    * 建议一种能够适应性能趋势的评分算法。\n    * 根据响应时间、准确率和学习历史推荐难度调整规则。\n\
  \    * 提供关于公平性的见解，例如避免无意中偏向快速学习者而非反思型学习者的模式。\n* `GitHub Copilot` 加速构建：这里的示例展示了 `Copilot`\
  \ 如何在 AI 辅助构建过程中同时加速后端逻辑和前端设计：\n    * 构建用于存储用户进度和测验逻辑的后端函数框架。\n    * 自动补全用于进度跟踪和用户反馈的前端组件。\n\
  \    * 使用 `React` 或 `Tailwind` 建议响应式 UI 状态。\n\n### 强调开发者的创造性优势\n\n随着 AI 处理大部分例行的脚手架和逻辑，开发者可以自由专注于定义用户体验和学习成果的高影响元素。以下是你的创造性判断和设计思维可以提升最终产品的关键领域：\n\
  \n* 完善学习模型的公平性：不同学习速度的学生是否受到了同公平的对待？\n* 增强进度跟踪器的视觉吸引力：它是激励了学生还是制造了焦虑？\n* 设计反馈循环：进度更新如何才能既鼓舞又有意义？\n\
  \n这些是定义用户体验的决策——它们需要同理心、设计思维和伦理考量。\n\n图 11.2 展示了 `ChatGPT` 和 `GitHub Copilot` 如何通过逻辑支持、难度调节以及公平性或\
  \ UI 增强贡献创造性开发：\n\n![图 11.2：ChatGPT 和 Copilot 支持逻辑、规则和 UI/代码脚手架](img/Figure_11.2.png)\n\
  \n图 11.2：ChatGPT 和 Copilot 支持逻辑、规则和 UI/代码脚手架\n\n#### 从执行者到体验设计师\n\n在这种设置下，你不仅仅是在编写代码——你正在塑造学生如何学习、如何跟踪进度以及技术如何适应个人需求。你已经变成了：\n\
  \n* 学习旅程的设计师。\n* 自适应系统的策展人。\n* 代码、算法和洞察的协调者。\n\nAI 处理了重复部分——但创造力、意图和影响呢？源自你。\n\n\
  ### 大规模实现创造力文化\n\n创造力不仅仅是个人特质——它是一种文化。在 AI 辅助开发环境中，组织拥有一个令人兴奋的机会去培养不仅思考得更快，而且思考得更深、更有想象力的团队。然而，这并不是自动发生的。这需要意图。\n\
  \n在自动化时代培养创造力意味着为质疑、实验和反思留出空间——让开发者感到有能力探索新想法，带着好奇心而非约束。\n\n#### 鼓励创造性编程的团队实践\n\n\
  在代码中培养创造力不仅关乎个人灵感——它关乎建立促进探索、反思和共享学习的团队习惯。以下团队实践有助于培养创造性编程与效率、责任制并行的文化：\n\n* 内部黑客松：创建短冲刺，让开发者可以使用\
  \ `Copilot` 和 `ChatGPT` 等工具快速构建新想法。这为团队提供了一个沙盒，让他们在没有生产周期压力的情况下实验、创新并将疯狂的想法变为。\n\
  * 提示词库（Prompt libraries）：鼓励团队共享用于调试、优化、设计和文档编写等用例的有效提示。这些提示词库作为协作智库，放大了跨项目的创造性复用。\n\
  * 代码故事：不仅关注构建了什么，更关注为什么。鼓励开发者记录功能、架构选择和用户流背后的思考过程。当创造力变得可见时，它就成了一个可以教学的课题。\n* 伦理设计会议：将技术决策与关于用户影响、可访问性和公平性的讨论相结合。这些会议确保创造力不仅是聪明的，更是自觉的。此外，它们帮助团队超越性能，考虑到人和目标。\n\
  \n当这些实践成为文化的一部分时，焦点自然会转移——从仅仅完成任务转变为构建有意义的事物，从快速发布转变为带着清晰、同理心和意图发布。\n\n那时，创造力将变得可扩展。那时，AI\
  \ 不仅仅是一个工具，而是一个发明伙伴。\n\n\n\n\n\n随着 AI 技术的不断演进，它对编程领域的影响将变得更加深刻。AI 辅助编程的未来将带来一场范式转移，改变开发者的角色，释放他们的创造潜力，并培养新的协作方式。在未来几年中，自主编码智能体、自然语言接口以及全集成的\
  \ AI 开发生态系统将改变开发者的工作方式，使他们能够更多地关注高层次目标。同时，AI 将处理许多重复性的、低级的编码任务。这些未来的承诺不仅带来了更快的开发周期，还带来了更具包容性、安全且创新的软件创作，使开发者能够比任何时候都更有协作性、更符合道德且更有创造力。\n\
  \n## 自主编码智能体将编排整个工作流\n\n我们正在接近这样一个节点：AI 助手将不仅仅是自动完成代码——它们将管理从想法到实现的整个任务和工作流。\n\n\
  这些新兴系统的运作将更像自主的初级开发者，能够：\n\n*   运行测试套件并报告错误。\n*   根据观察到的行为调试并应用补丁。\n*   重构旧系统以提高性能或可读性。\n\
  *   根据冲刺目标规划并组织功能分支。\n\n### 显示未来已处于原型阶段的现实信号\n\n早期原型（如 `SWE-Agent` 和 `Devin`）已经展示了这种可能性。这些系统能够响应自然语言提示、分解任务、管理文件、编写测试，甚至调试问题——而且是自主的。\n\
  \n曾经需要数小时手动编码、配置和文档编写的工作，现在只需一句话即可启动。\n\n### 开发者从执行者到编排者的转变\n\n在这种新模型中，开发者的角色发生了演变。开发者不再仅仅关注编写每一行代码，而是将：\n\
  \n*   为 AI 智能体设计要实现的目标。\n*   审查并监督它们的输出。\n*   引导架构决策并处理 AI 可能会忽略的边缘情况。\n\n将其想象为从劳动向领导的转变，你的工作不仅是构建，还包括管理、验证和完善你的\
  \ AI 队友创建的内容。\n\n## 自然语言将成为通用编程接口\n\n随着大语言模型（`LLMs`）对上下文、细微差别和意图的理解不断提高，自然语言本身正在成为新的编程接口。\n\
  \n很快，逐行编写代码将不再是构建软件的唯一甚至是主要方式。开发者和非开发者都能够用通俗英语（或任何口语）描述他们想要的内容，而 AI 将将其翻译成功能完全的代码。\n\
  \n### 实施概述\n\n随着自然语言接口变得日益先进，AI 辅助开发正向对话式、意图驱动的工作流转变。以下是很快将定义开发者如何与 AI 工具交互的自然语言提示类型示例：\n\
  \n*   构建一个具有电子邮件验证和速率限制的安全登录表单。\n*   将此应用部署到 `AWS Lambda` 并配置自动扩展。\n*   在仪表板中添加深色模式切换，并带有系统偏好检测。\n\
  \n在后台，AI 会解释你的请求，生成相应的组件，应用最佳实践，并且更好——解释它做了什么以及为什么。\n\n### 开发者和团队的变化\n\nAI 集成到开发工作流正在重塑团队的运营方式，扩大参与范围并加速交付。以下是开发者和跨职能团队可以期待关键转变：\n\
  \n*   AI 集成：扩大参与范围并加速交付。\n*   重心转移：开发者关注目标和监督。\n*   上下文感知工作流：AI 理解意图和目的。\n\n从本质上，自然语言成为了愿景与执行之间的桥梁。\n\
  \n## 迈向多模态阶段\n\n此外，它并不止于文本。AI 平台已经在向以下阶段发展，开发者可以结合：\n\n*   语音指令\n*   流程图\n*   数据样本\n\
  *   草图\n*   线框\n*   针对 `AWS` 或 `Vercel` 的部署\n\n## 在全集成 AI 开发环境中从工具转向生态系统\n\n目前，编程中的\
  \ AI 显得碎片化。你可能使用 `ChatGPT` 故障排除，使用 `GitHub Copilot` 自动完成代码，使用另一个插件进行测试。它是强大的，但是脱节的。这种情况即将改变。\n\
  \n很快，我们将见证 AI 原生开发生态系统的崛起——这些平台不仅包含工具，还从头到尾管理整个工作流。这些生态系统将规划、编码、测试和部署融合到一个统一的智能环境中。\n\
  \n### AI 开发生态系统的未来形态\n\n它们将围绕连续性和上下文感知的概念进行构建。你可以期待的关键能力包括：\n\n*   共享提示词内存：AI 将记住跨项目的过去决策、架构模式和团队规范。\n\
  *   内置审查员和测试员：每次提交或更改都会触发 AI 驱动的测试生成、静态分析和合规性检查。\n*   协作智能体：多个 AI 助手将在跨栈协同工作——一个处理后端，另一个处理\
  \ UI，另一个管理基础设施即代码。\n\n### 这种方法的实际愿景\n\n想象这样一个场景：开发者在类似 Notion 的文档中写下产品需求：“我们需要一个能够跟踪测验完成率并突出学习差距的学生分析仪表板。”随后\
  \ AI 能够：以下是 AI 在流化的端到端工作流中能够交付的内容：\n\n*   生成全栈实现。\n*   起草 API 合约和数据库模式。\n*   构建单元测试和集成测试。\n\
  *   创建部署计划。\n*   更新 `README` 和内部文档。\n\n\n\n\n随着 AI 工具更深度地嵌入到开发过程中，下一次飞跃将不再关于更大的模型，而是关于更智能、更具个性化的体验。\n\
  \n未来的 AI 助手将不再提供通用的建议，而是适应你的工作方式、学习方式以及接下来的需求。无论你是正在为扩展性优化的资深工程师，还是正试图理解堆栈追踪（stack\
  \ trace）的初级开发者，你的工具都能契合你的现状。\n\n## 个性化 AI 工具的独特能力\n\n这些智能环境将不再像传统的代码编辑器，而更像是与你共同成长的个人开发助手。\n\
  \n以下是你从下一代 AI 辅助开发平台中期待的智能个性化功能：\n\n* **上下文感知推荐**：AI 将从你的提交历史和编码模式中学习，并建议相关的设计选择或可复组件。\n\
  * **技能水平调整**：它会根据你的经验水平定制解释内容，为初学者提供高层概述，为专家提供深入的技术分析。\n* **针对特定技术栈的调试帮助**：根据你偏好的框架和库，工具将列出常见错误、使用技巧，甚至是过去的修复模式。\n\
  * **风格与团队一致性**：你的 AI 将自动遵循项目特定的惯例和团队指南——无需 linter。\n\n图 11.3 展示了个性化 AI 工具如何适应开发者的上下文、技能水平、团队风格以及特定技术栈的调试需求：\n\
  \n![图 11.3：针对上下文、技能、风格和调试支持的 AI 个性化](img/Figure_11.3.png)\n\n图 11.3：针对上下文、技能、风格和调试支持的\
  \ AI 个性化\n\n## 实际应用\n\n假设你是一个负责机器学习项目的初级开发者。你遇到了来自 `TensorFlow` 的一个晦涩的错误。\n\n示例提示词：\n\
  \n`请像解释给刚接触 ML 的初级开发者一样解释这个 TensorFlow 错误。`\n\nAI 的响应不仅是用通俗易懂的语言解释错误，还：\n\n* 链接到初学者友好的文档。\n\
  * 提供修正后的代码。\n* 描述问题背后的概念，以便你从中学习。\n\n同时，同一团队的资深工程师可能会收到性能优化的修复方案和基准测试建议。\n\n## 从文本编辑器到思维伙伴的长期转变\n\
  \n随着时间的推移，这些工具将超越静态界面。你的开发环境将学习你的节奏，预测你的问题并引导你的成长——无论你是在切换语言、在新领域提升，还是在上手一个复杂的代码库。\n\
  \nAI 不仅仅会帮助你更快地编写代码——它还将帮助你成为更优秀的开发者，通过每一次智能的提示。\n\n## 可解释性和可追溯性将成为强制性\n\n随着 AI\
  \ 在编写、修改和部署生产代码中承担更大的角色，有一点变得非常清晰：我们需要知道它是如何以及为什么做出这些选择的。\n\n在金融、医疗、航空航天和国防等受监管的行业，透明度不是可选的——它是法律和伦理要求。然而，即使在合规之外，可解释性也是任何严肃软件系统中信任、协作和可维护性的关键。\n\
  \n 开发者技能和工具的未来预期\n\n随着 AI 成为开发过程中日益不可缺的一部分，透明度和问责制将不再是可选的——它们将是至关重要的。\n\n\n\n\n\n\
  得益于自然语言接口和智能模板，没有正式编程经验的人（例如教师、营销人员、医生、分析师和小微企业主）能够轻松地构建实用的应用程序。\n\n我们正在走向这样一个世界：创建软件的能力不再局限于拥有计算机科学学位的人，而是扩展到任何能够表达需求的人[55]。\n\
  \n## 现实世界案例\n\nAI 辅助工具已经让广泛的用户——从教育工作者到创业者——能够以极少的编码知识构建功能性的定制化解决方案。以下示例说明了真实的人如何利用\
  \ AI 解决日常生活、优化工作流并开启新的可能性：\n\n*   一名教师利用 `ChatGPT` 和无代码 UI 构建器创建一个交互式评分仪表板，以适应不同的评分方案。\n\
  *   一位小微企业主根据其服务和营业时间定制了一套预约系统，而无需聘佣开发者。\n*   一名数据分析师设置了一个自动化仪表板，提取 `CSV` 数据、进行分析并根据阈值发送警报——这一切都是通过基于提示（prompt）的配置实现的。\n\
  \n这些不再是假设性的场景——它们正在成为常态[56]。\n\n## 开发者的演变角色\n\n这并没有让专业开发者过时——而是提升了他们。\n\n开发者将越来越多地关注于：\n\
  \n*   **可扩展性**：确保非开发者创建的系统能够随需求而增长。\n*   **治理**：执行规则和护栏，确保业务开发者（citizen developers）在安全边界内进行构建。\n\
  *   **安全性与集成**：确保 AI 生成的功能能够干净无缝地接入到更大、更安全的系统中。\n\n简而言之，开发者将成为架构师和赋能者，在赋予他人能力同时，确保系统健壮并符合组织目标[57]。\n\
  \n## 新的组织思维\n\n具有前瞻性的公司会将 AI 工具视为数字队友——即在内部库、文档和最佳实践基础上训练的合成贡献者。这些 AI 智能体将与人类共同工作以：\n\
  \n*   加速开发。\n*   引导新员工入职。\n*   维护遗留系统。\n*   赋能非技术利益相关者独立解决问题。\n\n这并非关乎取代，而是关乎技能、访问能力和创新的增强[58]。\n\
  \n## 结论\n\nAI 辅助编程的未来正在快速展开，带来了许多强大的新工具，有望改变我们构建软件的方式。从自主编码代理到对话式界面，这些创新正在让开发变得更快、更直观，并让更广泛的创造者能够触及。然而，进步伴随着责任。随着\
  \ AI 在塑造代码和系统方面承担更大的角色，开发者正在演变为协调者和伦理领导者，确保所构建的内容不仅功能完备，而且公平、透明且包容。本章强调，真正的机会在于平衡创新与意图。通过深思慎地拥抱\
  \ AI 并将其与人类价值观对齐，我们可以创建不仅智能而且可靠、可持续的开发环境，用创意、清晰和关怀驱动软件的下一个时代向前发展。\n\n## 问题\n\n1.\
  \ **什么是自主编码代理？它们将如何改变我们构建软件的方式？**\n\n**答案**：自主编码代理就像是智能的初级开发者——能够处理从编写、测试代码到修复漏洞和部署功能的所有事务，且完全基于自然语言指令。与目前自动补全代码的工具不同，这些代理可以独立执行整个任务，让开发者能够专注于更高级别的设计和决策。\n\
  \n2. **为什么自然语言正成为编程领域的下一个大界面？**\n\n**答案**：随着 AI 变得更加对话化，开发者不再需要写出每一行代码。相反，他们可以描述他们想要什么——例如创建一个带双重认证（2FA）的登录系统——由\
  \ AI 处理其余工作。这让编码变得直观，并让缺乏传统编程背景的人也能参与开发。\n\n3. **什么是多模态提示？它是如何改进开发过程的？**\n\n**答案**：多模态提示允许你结合文本、语音命令、草图、UI\
  \ 原型或数据样本来与 AI 工具通信。想象一下，画出一个布局并说：`让它变成响应式的并连接到我们的数据库`——系统就会执行。这是一种更自然、更具创意实现想法的方式。\n\
  \n4. **什么是 AI 原生开发生态系统？它们为什么重要？**\n\n**答案**：这些生态系统将开发的各个方面——编码、测试、部署和文档——整合到一个智能的集成平台中。开发者无需在不同工具之间跳跃，而可以在统一的环境中工作，AI\
  \ 在此环境中理解项目背景并帮助维护整个工作流的一致性。\n\n5. **AI 工具在未来如何适应不同的开发者？**\n\n**答案**：未来的 AI 工具将感觉更像私人的导师。它们会学习你的编码习惯，理解你的技术栈，并根据你的经验水平调整建议。无论你是初学者还是专家，AI\
  \ 都会在你的现有水平上为你提供帮助，帮助你成长并工作得更高效。\n\n6. **为什么在 AI 生成的代码中，可解释性是如此重要？**\n\n**答案**：随着\
  \ AI 对生产环境代码的贡献增加，我们需要理解其决策背后的原因——特别是在敏感或受监管的环境中。开发者必须能够审查 AI 的建议，追踪决策是如何做出的，并确保一切符合项目标准、安全策略和伦理准则。\n\
  \n7. **AI 工具如何帮助开发者编写更具伦理且包容性的代码？**\n\n**答案**：明天的 AI 助手将带有内置的安全措施。它们会标记偏偏逻辑、突出可访问性问题，并建议更具包容性的命名或措辞。将其视为一个伦理副驾驶——帮助你编写出不仅功能完备，而且公平、安全且以用户为中心的代码。\n\
  \n8. **没有编码经验的人能使用 AI 构建软件吗？**\n\n**答案**：绝对可以。通过理解自然语言并提供无代码接口的 AI 工具，教师、小微企业主和研究人员已经在构建应用程序和自动化任务了。开发者仍将发挥至关重要的作用，但将作为架构师支持、扩展和保护这些\
  \ AI 辅助作品。\n\n9. **在 AI 驱动环境中，开发者的角色是如何演变的？**\n\n**答案**：开发者越来越多地承担起项目负责人和伦理守护者的角色。他们不再编写每一行代码，而是引导\
  \ AI、确保质量，并对设计和影响进行批判性思考。这是从执行到协调的转变，人类的判断和创意在这里至关重要。\n\n10. **大局是什么——所有这些趋势将如何重塑软件开发的未来？**\n\
  \n**答案**：我们正在进入一个软件创建变得更快、更具包容性且日益协作的时代。AI 将处理更多的常规工作，让开发者专注于愿景、诚信和创新。结果是什么？更智能的系统、更广泛的参与，以及一个任何有想法的人都能帮助将其实现的未来。\n\
  \n## 练习题\n\n1. 使用自然语言提示设计一个博客应用。使用 `ChatGPT` 勾勒应用结构和功能需求。然后，使用 `GitHub Copilot`\
  \ 构建基于 `Express` 和 `React` 的基础全栈实现。反思 AI 工具如何帮助你更快速地将愿景转化为运行的代码。\n\n\n\n\n\n## 2.\
  \ 创建一个可以生成图像描述的多模态 Web 工具。首先，通过 `Copilot` 辅助构建的前端上传图像。使用 `ChatGPT` 实现生成描述的逻辑。评估\
  \ AI 工作流在构建无缝用户体验时的直观性和有效性（-效能）。\n\n## 3. 开发一个注重隐私的注册表单。使用 `ChatGPT` 起草面向用户的披露说明，解释其数据将如何被使用。使用\
  \ `Copilot` 确保已落实输入验证、密码策略和安全实务措施。评估 AI 如何促进符合伦理且安全的设计决策。\n\n## 4. 构建一个智能代码审查助手。使用\
  \ `ChatGPT` 用通俗易懂的语言解释代码段，并使用 `Copilot` 推荐清理建议。在不同的代码库和语言上对助手进行测试。注意它节省了多少时间，以及\
  \ AI 反馈的准确性或见解深度。\n\n## 5. 为新开发者设置一个 AI 驱动的入职机器人。让 `ChatGPT` 编写关于你的技术栈和流程的有用入职内容脚本。使用\
  \ `Copilot` 实现基础对话逻辑和 `API` 调用。收集同事的反馈以衡量其清晰度和实用性。\n\n## 6. 开发一个可复用且无障碍的 UI 组件库。使用\
  \ `Copilot` 生成组件，如按钮、表单和卡片。然后提示 `ChatGPT` 审查每个组件的访问性，标记颜色对比度、键盘导航或缺失 `ARIA` 标签等问题。注意\
  \ AI 工具如何帮助执行包容性设计标准。\n\n## 7. 对比 AI 解析与人工指导。选择一个中复杂的函数或类。使用 `ChatGPT` 对其进行解释，然后让一位资深开发者执行同样的操作。分析在清晰度、语气和完整性方面的差异。在反思中总结你的体会。\n\
  \n## 8. 自动化 `Node.js` 部署流水线。使用 `GitHub Copilot` 编写用于持续集成和持续部署 (`CI/CD`) 的 `GitHub\
  \ Actions YAML` 文件。让 `ChatGPT` 引导你完成部署阶段并提出改进建议。运行工作流并评估该自动化可靠性和复用性。\n\n## 9. 创建一个团队共享提示词（Prompt）库。在\
  \ `ChatGPT` 的帮助下，为常见任务（如调试、编写文档或解决性能问题）起草可复用的提示词。使用 `Copilot` 构建一个简单的可搜索界面。跟踪一周的使用情况并收集团队反馈。\n\
  \n## 10. 写一篇关于 AI 在开发领域未来的反思。根据你在本章中学到的知识，描述 `ChatGPT` 和 `Copilot` 等工具如何改变了“开发者”的定义。讨论最令你兴奋的内容，以及你如何看待自己在\
