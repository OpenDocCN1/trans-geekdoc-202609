  \ {score:.2f}\")\n\n# 可视化\nsns.scatterplot(x='Salary', y='Experience', hue='Cluster',\
  \ data=df)\nplt.title(\"Employee Clustering\")\nplt.show()\n```\n\n此代码执行了所有关键步骤：\n\
  1. 加载并选择相关特征。\n2. 使用 `StandardScaler` 应用特征缩放。\n3. 拟合具有三个聚类的 `k-means` 模型。\n4. 计算\
