  \ dataframe.copy()\n    labels = df.pop('label')\n    ds = tf.data.Dataset.from_tensor_slices((dict(df),\
  \ labels))\n    if shuffle:\n        ds = ds.shuffle(buffer_size=len(df))\n    return\
  \ ds.batch(batch_size)\n\ntrain_ds = df_to_dataset(df)\n```\n\n| AI 工具提示：ChatGPT\
