  \n![QR-Logo](img/fm1.png)\n\n# 第 8 章：构建与训练机器学习模型\n\n## 引言\n\n构建有效的机器学习模型不仅仅是选择正确的算法或依赖计算能力。它要求在整个模型开发生命周期中关注效率、自动化可扩展性。从数据预处理到算法调优，如今的机器学习工作流是复杂的，涉及许多相互依赖的步骤，这些步骤传统上需要大量的量编码、配置和试错。这些复杂性往往会降低实验速度，引入不一致性，并延迟现实场景中的部署。\n\
  \nAI 正在通过更智能、更快、更可靠的机器学习开发改变这一过程。`ChatGPT` 和 `GitHub Copilot` 等工具正在开启 AI 辅助编程的新时代，帮助开发者构建完整的流水线骨架、选择合适的模型、优化性能指标并以最小的摩擦实现最佳实践。无论是构建分类模型、微调回归算法还是设计深度学习架构，AI\
  \ 辅助都大幅缩短了开发时间并提高了生产力。\n\n本章将探索 AI 在自动化机器学习流水线创建、训练和评估方面中日益增长的作用。通过真实的案例研究和详细的技术演示，我们展示了\
  \ AI 工具如何简化复杂任务、提高模型质量并实现更快的迭代。读者将获得在金融科技、医疗保健、零售和教育等领域应用 AI 辅助技术的实战见解，在这些领域，智能工具正在改变模型开发和部署的方式。\n\
  \n随着 AI 深度集成到软件和数据科学工作流中，它的影响力从自动化扩展到增强，引导决策、建议改进并加速创新。通过接受 AI 辅助编程，开发者可以将注意力从重复性任务转向战略性思考，构建出既高性能又适用于生产的健壮机器学习系统。\n\
  \n## 结构\n\n本章涵盖了以下主题：\n\n* 使用 AI 自动化机器学习流水线的创建\n* 在 AI 辅助指导下选择机器学习算法\n* 构建和训练分类模型\n\
  * 设计和训练回归模型\n* 实现多层感知器模型\n* 构建和微调卷积神经网络\n* 有效地训练和验证模型\n* 性能评估指标\n* AI 在机器学习训练中的实际应用案例\n\
  \n## 目标\n\n本章探索了 `ChatGPT` 和 `GitHub Copilot` 等 AI 驱动工具如何改变机器学习模型的构建、训练和部署方式。其目标是演示这些工具如何简化和加速机器学习生命周期的每个阶段，包括自动化流水线创建、选择算法、训练模型和评估性能。通过跨分类、回归和深度学习任务的实际示例和用例，读者将理解\
  \ AI 引导如何增强开发速度、减少手动工作并提高模型准确性。在本章结束时，读者能够从心地使用 `scikit-learn`、`Keras` 和 `PyTorch`\
  \ 等框架应用 AI 辅助技术，以更高的效率和可靠性构建扩展的可级机器学习解决方案。\n\n## 使用 AI 自动化机器学习流水线的创建\n\n构建机器学习流水线曾是一项手动且耗时的任务。有了\
  \ `ChatGPT` 和 `GitHub Copilot` 等 AI 工具，该过程变得更快、更直观且更不容易出错。这些助手帮助数据科学家自动化流程的每个步骤（从预处理到评估），从而在\
  \ `scikit-learn`、`Keras` 和 `PyTorch` 等框架中实现更智能的工作流。下一节将通过实际示例和现实影响，探索 AI 如何简化流水线的创建。\n\
  \n### 流水线组件与 AI 自动化\n\n一个机器学习流水线由多个相互依赖的阶段组成，每个阶段对于将原始数据转换为可部署的模型都至关重要。从预处理输入到评估模型性能，每个组件都对整个系统的可靠性和成功做出贡献。AI\
  \ 辅助编程工具越来越越来越长支持这些阶段，为每个步骤提供定制的智能建议、模板和最佳实践。下表总结了 AI 工具在各个流水线组件中的贡献：\n\n| 组件 |\
  \ 描述 | AI 工具贡献 |\n| --- | --- | --- |\n| 数据预处理 | 缩放、编码和处理缺失值 | `Copilot` 和 `ChatGPT`\
  \ 等工具生成针对常见任务的任务代码模板 |\n| 特征工程 | 特征转换、选择和降维 | `ChatGPT` 提供 `PCA` 或独热编码等技术的解释和工作示例\
  \ |\n| 模型定义 | 选择模型并设置超参数 | `GitHub Copilot` 建议带有推荐超参数设置的预配置模型 |\n| 交叉验证 | 确保模型的稳健评估\
  \ | `ChatGPT` 根据数据类型推荐合适的策略，如 `KFold` 或 `StratifiedKFold` |\n| 指标评估 | 根据任务性质选择性能指标\
  \ | AI 工具建议 `F1 score`、`AUC`、`RMSE` 等适用于分类或回归的指标 |\n\n表 8.1：关键流水线组件的 AI 辅助\n\n\n\
  \n\n\n这些 AI 赋能的贡献简化了开发流程，并促进了 ML 项目的一致性和最佳实践。通过理解自动化如何与每个组件衔接，开发者可以做出更明智、更快速的决策而不损害质量或准确性。\n\
  \n### 使用 scikit-learn 构建二分类流水线的示例\n\n为了演示 AI 辅助工具如何简化流水线的创建，让我们通过 `scikit-learn`\
  \ 走一个经典的二分类示例。通过简单的提示，例如`创建一个带有 StandardScaler 和 RandomForestClassifier 的 Scikit-learn\
  \ 流水线。包含 5 折交叉验证并使用 F1 分进行评估`，ChatGPT 等 AI 助手可以立即生成如下所示的完整且优代码片段：\n\n```python\n\
  from sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler\n\
  from sklearn.ensemble import RandomForestClassifier\nfrom sklearn.model_selection\
  \ import cross_val_score\n\npipeline = Pipeline([\n    ('scaler', StandardScaler()),\n\
  \    ('classifier', RandomForestClassifier(n_estimators=200, max_depth=10, random_state=42))\n\
  ])\n\nscores = cross_val_score(pipeline, X, y, cv=5, scoring='f1')\nprint(\"Average\
  \ F1 Score:\", scores.mean())\n```\n\n该流水线整合了一个预处理步骤（`StandardScaler`）和一个分类阶段（`RandomForestClassifier`）。它随后使用\
  \ 5 折交叉验证通过 F1 分来评估模型性能，F1 分是一种适用于分类任务的平衡指标，特别是在处理不平衡数据时。下图展示了一个结合了预处理和分类阶段的 scikit-learn\
  \ 流水线：\n\n![图 8.1：带有预处理和分类阶段的 scikit-learn 流水线](img/Figure_8.1.png)\n\n**ChatGPT\
  \ 小贴**：对于类别不平衡的数据集，在 `cross_val_score()` 中将 `cv=5` 替换为 `StratifiedKFold(n_splits=5)`，以确保所有折中的类别分布一致。这有助于在模型评估期间保持一致性和有效性。\n\
  \nChatGPT 等 AI 工具可以将高级想法快速转换为功能代码。为了获得最佳结果，清晰化提示很重要。以下是使用 ChatGPT 的指南：\n\n1. **明确定义目标**：从指定你想实现的目标开始（例如`使用\
  \ scikit-learn 为不平衡的二分类数据集构建逻辑回归分类器`）。\n2. **提供输入和预期输出格式**：共享数据集的样本结构或解释关键特征（例如`数据集包含列：age,\
  \ income, 和 target (0/1)`）。\n3. **请求特定技术**：提到首选的方法或库（例如`使用 StratifiedKFold 进行交叉验证，并将\
  \ ROC-AUC 作为评分指标`）。\n4. **要求模块化和注释**：要求代码具有模块化并附带说明（例如`将代码拆分为函数并为每个步骤添加注释`）。\n\n\
  **ChatGPT 提示示例**：\n`使用 scikit-learn 编写 Python 代码，在不平衡数据集上训练逻辑回归模型。使用 StratifiedKFold\
  \ 进行 5 折交叉验证并使用 ROC-AUC 进行评估。`\n\n**GitHub Copilot 的角色**：虽然 ChatGPT 帮助根据自然语言描述生成完整的函数或脚本，但\
  \ GitHub Copilot 在你的代码编辑器中结合上下文工作。它可以：\n\n* 自动补全模板代码（例如模型训练循环）。\n* 建议函数定义或库导入。\n\
  * 辅助集成混淆矩阵、ROC 曲线等模型评估技术。\n\nChatGPT 和 GitHub Copilot 共同简化了开发过程——ChatGPT 帮助完成想法到代码的转换，而\
  \ Copilot 则加速了编辑器内的实现和调试。\n\n用于处理混合特征类型的高级流水线\n\n在许多真实的 ML 场景中，数据集包含数值特征和类别特征的混合。高效且一致地处理这些化的数据类型对于构建稳健的模型至关重要。Scikit-learn\
  \ 的 `ColumnTransformer` 提供了一种清晰且模块化的方法，对每种类型的特征应用不同的预处理步骤。\n\n让我们考虑一个实际示例。假设我们正在处理包含以下内容的数据集：\n\
  \n* 数值特征：`account_age`, `monthly_spending`\n* 类别特征：`region`, `plan_type`\n\n我们可以构建一个预处理流水线，对数值列应用\
  \ `StandardScaler`，对类别列应用 `OneHotEncoder`。然后，将此复合预处理器整合到使用 `RandomForestClassifier`\
  \ 的完整 ML 流水线中。\n\n代码中看起来是这样的：\n\n```python\nfrom sklearn.compose import ColumnTransformer\n\
  from sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.pipeline\
  \ import Pipeline\nfrom sklearn.ensemble import RandomForestClassifier\n\nnumeric_features\
  \ = ['account_age', 'monthly_spending']\ncategorical_features = ['region', 'plan_type']\n\
  \npreprocessor = ColumnTransformer([\n    ('num', StandardScaler(), numeric_features),\n\
  \    ('cat', OneHotEncoder(handle_unknown='ignore'), categorical_features)\n])\n\
  \npipeline = Pipeline([\n    ('preprocessor', preprocessor),\n    ('classifier',\
  \ RandomForestClassifier())\n])\n```\n\n该流水线确保了数值和类别数据得到恰当的处理。`OneHotEncoder` 中的参数\
  \ `handle_unknown='ignore'` 特别重要，因为它它可以防止模型在推理过程中遇到训练期间不存在的类别时崩溃。\n\n\n\n\n\n| 缺失值的二分类\
  \ | 使用 `scikit-learn` 创建一个流水线，处理数值列带有缺失值的 `logistic regression`。使用中位数填充和 `StandardScaler`。\
  \ |\n| 未知类别编码 | 如何在 `scikit-learn` 中对类别列进行独热编码，同时在预测期间忽略未见的类别？ |\n| 类不平衡的模型评估 |\
  \ 使用带有 5 份划分的 `StratifiedKFold`，并使用 `ROC-AUC` 作为评分指标对类不平衡分类模型进行评估。 |\n\n#### 表 8.2：针对常见机器学习任务的精心设计的\
  \ ChatGPT 提示词（Prompt）示例场景\n\n通过遵循这些提示工程技术，用户可以从 ChatGPT 中提取出高精度、感知上下文且可重用的代码，同时依靠\
  \ `GitHub Copilot` 在 IDE 中进行实时的代码建议和修正。\n\nAI 辅助工具通过自动化处理复杂的配置（如处理缺失值、编码类别变量或调整交叉验证策略），极大地简化了高级、抗错流水线的创建。这使得人员能够构建出自信处理真实世界数据变性的模型。\n\
  \n然而，尽管这些工具加速了开发，但确保它们的输出基于对数据领域的深度理解是至关重要的。AI 工具的有效使用应辅以以下措施：\n\n*   彻底的数据理解：在依赖\
  \ AI 生成的解决方案之前，从业人员必须分析数据分布，识别潜在的离群值或偏差，并理解特定领域的含义。\n*   领域专家（SME）的积极参与：领域专家的输入在所有阶段（特征选择、模型解释和验证）中都至关重要，以确保模型与领域目标和约束保持一致。\n\
  *   公平性与偏差缓解：开发者应实施公平感知技术，并对 AI 辅助输出的潜在偏差进行审计，以确保生成的模型是负责任、符合道德且包容的。\n\n通过将 ChatGPT\
  \ 等工具的速度和自动化与领域专业知识以及负责任的 AI 实践相结合，我们可以开发出既高效又可靠的模型。\n\n### Keras 和 PyTorch 中超越\
  \ scikit-learn 的流水线\n\n虽然 `scikit-learn` 提供了一个高度结构化的流水线框架，但深度学习库如 `Keras` 和 `PyTorch`提供了构建端到端工作流的模块化方法。尽管这些库不像\
  \ `scikit-learn` 那样使用正式的流水线对象，但开发者仍然可以通过有效组织组件来实现从预处理到模型训练的无缝流。\n\nChatGPT 和 `Copilot`\
  \ 等 AI 辅助工具通过生成模板代码、建议架构模式以及将复杂逻辑封装为可重用函数来简化这些工作流。\n\n#### 使用 Keras 进行预处理和模型集成\n\
  \n在 `Keras` 中，预处理层可以直接嵌入到模型架构中。这种紧密集成允许创建一个完全自包含的模型，在内部处理数据归一化，提高了迁移性和部署就绪性。\n\n\
  以下是一个集成了归一化步骤并定义了二分类简单前馈神经网络的示例：\n\n```python\nfrom tensorflow.keras.models import\
  \ Sequential\nfrom tensorflow.keras.layers import Normalization, Dense\n\nnormalizer\
  \ = Normalization()\nnormalizer.adapt(X_train)\n\nmodel = Sequential([\n    normalizer,\n\
  \    Dense(64, activation='relu'),\n    Dense(1, activation='sigmoid')\n])\n```\n\
  \n在此设置中，以下组件突出了预处理和模型架构如何在 `Keras` 工作流中无缝集成：\n\n*   `Normalization()` 是一个内置的预处理层，用于计算并应用均值方差归一化。\n\
  *   `.adapt()` 方法将层拟合到训练数据。\n*   `model` 由一个具有 `ReLU` 激活函数的隐藏层和一个用于二分类的具有 `sigmoid`\
  \ 激活函数的输出层组成。\n\n这种的结构使得将预处理嵌入训练和推理流水线变得容易。\n\n#### PyTorch 中的模块化架构和 DataLoader\n\
  \n在 `PyTorch` 中，工作流通常以模块化构建。预处理通常在模型外部完成，通过构建用于训练的数据集和 `DataLoaders` 来。\n\n以下是一个展示如何缩放特征并准备训练数据的示例：\n\
  \n```python\nfrom torch.utils.data import DataLoader, TensorDataset\nfrom sklearn.preprocessing\
  \ import StandardScaler\nimport torch\n\nscaler = StandardScaler()\nX_train_scaled\
  \ = scaler.fit_transform(X_train)\n\ndataset = TensorDataset(torch.tensor(X_train_scaled,\
  \ dtype=torch.float32),\n                        torch.tensor(y_train, dtype=torch.float32))\n\
  loader = DataLoader(dataset, batch_size=32)\n```\n\n此示例说明了使用 `scikit-learn` 和 `PyTorch`\
  \ 工具为 `PyTorch` 模型准备训练数据的关键步骤：\n\n*   使用 `scikit-learn` 中的 `StandardScaler` 对数值特征进行预处理。\n\
  *   创建一个封装了输入和标签的 `TensorDataset`。\n*   初始化 `DataLoader` 以处理模型训练期间的分批处理。\n\nChatGPT\
  \ 建议：将预处理和数据加载逻辑封装到工具函数或类中，以便在不同的模型和实验之间重用。\n\n通过利用 AI 辅助编程工具，即使是复杂的 `PyTorch` 工作流也可以快速搭建框架，确保模块化、清晰性和可扩展性，特别是在实验不同的架构或数据集时。\n\
  \n### AI 加速零售流失模型的真实示例\n\n在 AI 辅助编程的实践中，一个零售分析团队致力于构建一个客户流失预测的机器学习模型。他们的数据结合了购买频率、退货率和平均篮大小等结构化数值特征，以及地区、会员等级和渠道偏好等类别变量。\n\
