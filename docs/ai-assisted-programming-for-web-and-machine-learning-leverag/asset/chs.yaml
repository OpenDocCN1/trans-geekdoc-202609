  \        'Technically sound and innovative',\n        'Quick learner'\n    ]\n}\n\
  \ndf = pd.DataFrame(data)\n```\n\n该数据集允许我们展示几种类型的特征工程：\n*   从文本（`Comments`）和日期（`JoinDate`）中提取特征。\n\
  *   `Department` 的类别编码。\n*   ` ` 和 `Salary` 的数值转换或分箱。\n*   识别影响预测的变量的特征选择。\n\n在接下来的小节中，我们将应用传统和\
  \ AI 辅助方法在该数据集上实现特征工程自动化。\n\n### 从类别和文本数据中提取特征\n\n类别和文本特征通常包含丰富的意义信息，但在机器学习模型使用它们之前必须转换为数值格式。这种转换是特征提取的核心部分，适当的技术取决于数据的性质和所用模型的复杂度。\n\
  \n#### 传统方法\n\n对于 `Department` 等类别变量的一种常用技术是独热编码，它为每个类别创建一个单独的二进制列。\n\n以下代码对 `Department`\
  \ 列应用独热编码：\n\n```python\n# One-hot encoding for Department\ndf = pd.get_dummies(df,\
  \ columns=['Department'], drop_first=True)\n```\n\n在处理 `Comments` 等自由文本字段时，通常使用词频-逆文档频率（TF-IDF）提取输入模型的关键术。\n\
  \n以下代码使用 TF-IDF 从 `Comments` 列中提取关键术：\n\n```python\nfrom sklearn.feature_extraction.text\
  \ import TfidfVectorizer\n\nvectorizer = TfidfVectorizer(stop_words='english', max_features=10)\n\
  X_text = vectorizer.fit_transform(df['Comments'])\n```\n\nTF-IDF 帮助量化每个条评论中词的重要性，同时减少了\
  \ “and” 或 “the” 等常用词的影响。\n\n#### AI 辅助\n\nAI 辅助工具显著简化并丰富了这一过程：\n\n\n\n\n\n*   `GitHub\
