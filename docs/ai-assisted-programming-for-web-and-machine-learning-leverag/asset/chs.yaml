  \ 部署 API\n\n在生产系统中，模型通常通过 API 访问。将模型转换为 TensorFlow Lite (TFLite) 允许更快的推理，特别是在无服务器环境中。\n\
  \n让我们来看一个转换模型的示例：\n\n```python\nconverter = tf.lite.TFLiteConverter.from_saved_model(\"\
  ecommerce_model\")\ntflite_model = converter.convert()\n\nwith open(\"model.tflite\"\
  , \"wb\") as f:\n    f.write(tflite_model)\n```\n\n让我们来看一个 Lambda 句器的示例：\n\n```python\n\
  import tensorflow as tf\nimport numpy as np\n\ninterpreter = tf.lite.Interpreter(model_path=\"\
  model.tflite\")\ninterpreter.allocate_tensors()\n\ndef lambda_handler(event, context):\n\
  \    input_data = np.array([event['features']], dtype=np.float32)\n    interpreter.set_tensor(0,\
  \ input_data)\n    interpreter.invoke()\n    output_data = interpreter.get_tensor(1)\n\
  \    return {'prediction': float(output_data[0])}\n```\n\n### 监控与反馈循环\n\n部署并不是结束，而是实时监控、反馈收集和持续优化的开始。记录推理请求和系统行为有助于确保可靠性并检测问题。\n\
