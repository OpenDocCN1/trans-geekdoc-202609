  \ 层、使用批归一化或尝试学习率调度。\n\n### 模型导出与 AWS 集成\n\n模型一旦训练并验证，就必须进行打包以部署。TensorFlow 模型可以保存为\
  \ `SavedModel` 等格式，并上传到 AWS S3，供后续 AWS `Lambda` 或 `SageMaker` 等服务使用。\n\n让我们来看保存并上传模型的示例：\n\
  \n```python\nmodel.save(\"ecommerce_model\")\nimport boto3\n\ns3 = boto3.client('s3')\n\
