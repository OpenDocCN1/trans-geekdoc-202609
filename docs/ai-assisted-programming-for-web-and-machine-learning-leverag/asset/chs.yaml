  \n## 员工流失风险分析\n\n为了展示 AI 工具在发现员工相关洞察方面的力量，本案例研究重点介绍了如何在无监督学习场景中使用 `GitHub Copilot`\
  \ 和 `ChatGPT` 来识别组织内部潜在的流失风险。其目标是通过数据驱动的聚类，主动支持 HR 团队提高员工留存率。让我们来看这个案例研究：\n\n- **目标**：通过将员工分为基于行为和薪水的簇，识别潜在的流失风险，使\
  \ HR 团队能够采取主动的留存措施。\n- **数据集**：为了执行无监督聚类，分析使用了包含关键员工属性的数据集：\n    - **特征**：数据集包含以下作为聚类基础的特征：\n\
  \        - 经验\n        - 薪资\n        - 部门\n        - 培训时长\n    - **输出**：无标签（应用无监督聚类）。\n\
  - **预处理**：为了确保数据集适用于聚类，实施了以下预处理步骤：\n    - **标准化**：`GitHub Copilot` 建议使用 `StandardScaler`\
  \ 进行列归一化，在聚类之前将数值特征带到统一的比例。\n    - **类别编码**：`ChatGPT` 推荐使用 `pd.get_dummies(drop_first=True)`\
