  \ # AI 建议缓存 60 秒\ndef get_orders(user_id):\n    return db.query(\"SELECT * FROM\
  \ orders WHERE user_id = %s\", (user_id,))\n```\n\n影响：响应时间进一步从 250ms 提升到 120ms。\n\
