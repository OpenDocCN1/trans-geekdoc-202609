  \ AI 生成符合现实需求的高质量且易于维护的代码。\n\n### 使用 AI 提示词自动化重复性编码任务\n\nAI 可以处理数据转换、文件管理和调试等重复性编码任务，通过清晰的提示词帮助开发者工作得更快更高效。\n\
  \nAI 生成的脚本减少了人工努力，提高了效率并最小化了错误。通过使用结构良好的提示词，开发者可以自动化常见任务，例如：\n\n*   数据处理：自动化 `CSV`\
  \ 到 `JSON` 的转换、数据聚合和清洗。\n*   文件处理：自动化读写报告、重命名文件和文件夹管理。\n*   API 交互：自动化数据获取、API 请求和端点监控。\n\
  *   调试与优化：自动化代码分析、性能分析和日志监控。\n*   测试用例生成：自动从函数定义或代码注释创建单元测试和验证脚本。\n\n让我们来看一个例子：\n\
  \n*   生成一个 CSV 转 JSON 的转换脚本：此示例展示了清晰的 AI 提示词如何生成一个 Python 脚本，将 `CSV` 文件转换为 `JSON`，处理缺失数据，并允许选择列以获得更好的灵活性。\n\
  \    *   更好的提示词：“生成一个 Python 脚本，读取 CSV 文件、处理数据并将输出写入 JSON 文件。该脚本应处理缺失值并允许用户指定列过滤。”\n\
  \nFigure 3.6 概述了使用 AI 生成的代码将 `CSV` 文件转换为 `JSON` 的步骤。它涵盖了读取 `CSV`、处理缺失数据、需要时过滤列以及保存最终的\
  \ `JSON` 输出。\n\n![图 3.6：带有数据处理、过滤和缺失值处理的 CSV 转 JSON 工作流](img/Figure_3.6.png)\n\n\
  图 3.6：带有数据处理、过滤和缺失值处理的 CSV 转 JSON 工作流\n\n此 AI 生成的 Python 脚本将 `CSV` 文件转换为 `JSON`，处理缺失值并允许选择列以获得更整洁的数据输出：\n\
  \n```python\nimport pandas as pd\n\ndef csv_to_json(csv_file, json_file, selected_columns=None):\n\
