  \    - 树图中的离群分支对应于具有特征的交易：\n        - 可疑的时间间隔。\n        - 不一致的地理移动（例如，在不现实的短时间内从远地点进行的购买）。\n\
  \n这些分支被标记为高风险，并由欺诈分析团队进一步审查，为开发交易欺诈预警检测系统做出了贡献。\n\n## 个性化治疗的医疗患者分组\n\n本案例研究说明了使用\
  \ AI 辅助工具对医疗数据进行聚类，以支持个性化治疗策略。通过将 `GitHub Copilot`、`ChatGPT` 与基于 `k-means` 和 `PCA`的工作流相结合，医疗专业人员能够识别具有临床意义的患者子组，并设计定制干预措施以提高护理质量和患者从性。让我们来看这个案例研究：\n\
  \n- **目标**：根据生物识别和人口统计特征对患者进行聚类，以设计改善健康结果和患者从性的个性化治疗方案。\n- **数据集**：为了支持基于健康的聚类分析，数据集包含了与画像相关的生理和生物识别特征：\n\
  \    - **特征**：选择了以下特征作为聚类分析的关键健康指标：\n        - 年龄\n        - BMI\n        - 血压\n\
  \        - 血糖水平\n        - 心率\n- **预处理**：为了确保数据集的可靠性并提高聚类准确性，执行了以下预处理步骤：\n    -\
  \ **数据清洗**：`GitHub Copilot` 协助使用 `groupby` 策略填充缺失的 BMI 值，在年龄段内计算中 BMI，然后相应应用 `.fillna()`。\n\
  \    - **离群值检测**：`ChatGPT` 指导使用 `IQR` 方法检测并移除血糖和血压等生命体征中的离群值，确保更清晰的簇边界和解释性。\n- **聚类**：为了识别有意义的患者分组并增强可解释性，实施了以下聚类策略：\n\
  \    - **算法**：`K-means`\n        - 选中是因为其在识别不同患者群体方面的扩展性和有效性。\n    - **降维**：\n \
  \       - 将 `PCA` 集成流水线中，将数据集减少为两个主成分，使其在视觉和临床上更易解释。\n\n\n\n\n\n- **AI 辅助**：为了简化实现并增强可解释性，在整个聚类工作流中使用了以下\
  \ AI 工具：\n    - **GitHub Copilot**：自动构建了一个结合 `StandardScaler`、`PCA` 和 `KMeans` 的完整流水线，包括用于\
  \ 2D 可视化的绘图逻辑。\n    - **ChatGPT**：建议使用 `SHAP` 分析每个生物识别特征对聚类分配的贡献。这使得医疗专业人员能够在临床实施之前理解并验证聚类逻辑。\n\
  - **结果**：最终模型识别出了具有临床意义的患者群体，例如：\n    - 血糖水平升高但生命体征正常的年轻患者。\n    - 具有多个多个升高风险因素的老年患者。\n\
  \    - 具有高血压倾向且对 BMI 敏感的中年患者。\n\n医院利用这些见解为每个聚类设计了针对性的健康计划，并取得了以下成果：\n\n- 提高了治疗依从性。\n\
  - 提供了更具个性化的护理。\n- 改善了整体预后。\n\n## 结构化与非结构化数据的实操示例\n\n现代机器学习的核心优势之一是其处理广泛数据类型的能力，从整齐排列的电子表格到文本、图像甚至音频等原始非结构化格式。虽然这种灵活性开启了新的可能性，但也为数据预处理、聚类和可视化引入了多样化的挑战。\n\
  \n本节将介绍一些实操示例，展示如何有效处理结构化和非结构化数据集。你将看到，传统的 Python 库在结合了 `GitHub Copilot` 和 `ChatGPT`\
  \ 的智能辅助后，如何显著简化准备、聚类和探索各种类型数据的过程。\n\n无论你是在处理表格化的员工记录、自由文本客户反馈，还是来自传感器或相机的视觉数据，这些示例都将帮助你：\n\
  \n- 解决通的预处理问题。\n- 选择并应用正确的聚类技术。\n- 以有意义且数据驱动的方式可视化洞察。\n 使用 使用 AI 工具加速你的工作流并增强决策。\n\
  \n### 针对结构化员工数据的 AI 辅助聚类\n\n在这个实操示例中，我们将使用结构化的 HR 数据集，根据关键属性 `Salary`（薪资）和 `Experience`（经验）对员工进行分组。这种聚类可以帮助组织发现劳动力模式、识别高潜力人才，或标记可能需要针对性干预的员工群体。\n\
  \n在 `GitHub Copilot` 和 `ChatGPT` 的支持下，我们将简化从数据准备到聚类可视化的每一个步骤：\n\n1. 加载并检查数据：\n\n\
  ```python\nimport pandas as pd\ndf = pd.read_csv(\"employee_data.csv\")\nprint(df.head())\n\
  ```\n\n- **Copilot 辅助**：`GitHub Copilot` 通过提供智能且感知上下文的建议，简化了初始数据加载阶段：\n    - 当你开始输入时自动补全文件路径。\n\
  \    - 建议使用 `.head()` 检查数据集中的前几记录。\n\n2. 处理缺失值并转换日期：\n\n```python\ndf['Salary']\
  \ = df['Salary'].fillna(df['Salary'].mean())\ndf['JoinDate'] = pd.to_datetime(df['JoinDate'],\
  \ errors='coerce')\n```\n\n- **ChatGPT 提示**：我应该使用总体平均值还是部门平均值来填充缺失的薪资？\n- **ChatGPT\
  \ 洞察**：如果薪资分布随部门变化，请使用分组平均值（例如 `df.groupby('Department')['Salary'].transform('mean')`）进行更准确的插值。\n\
  \n3. 归一化特征并应用 k-means 聚类：\n\n```python\nfrom sklearn.preprocessing import StandardScaler\n\
  from sklearn.cluster import KMeans\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\n\n# 选择相关特征\nX = df[['Salary', 'Experience']]\n\n# 归一化特征\nX_scaled = StandardScaler().fit_transform(X)\n\
  \n# 应用 K-means 聚类\nkmeans = KMeans(n_clusters=3, random_state=0)\ndf['Cluster']\
  \ = kmeans.fit_predict(X_scaled)\n\n# 可视化聚类\nsns.scatterplot(x='Salary', y='Experience',\
  \ hue='Cluster', data=df)\nplt.title(\"Employees 的 K-means Clustering\")\nplt.show()\n\
  ```\n\n- **Copilot 支持**：`GitHub Copilot` 通过生成端到端代码简化流程：\n    - 自动完成导入、特征缩放、模型拟合和聚类。\n\
  \    - 识别聚类目标并调整绘图坐标。\n\n该示例展示了如何将传统数据科学工作流与 AI 引导相结合。\n\n###  非结构化文本数据的 AI 辅助聚类\n\
  \n文本数据与结构化数据集相比具有独特的挑战，但通过语义含义进行聚类时也能开启强大的洞察。在本示例中，我们将处理一组评论，并将 `TF-IDF` 向量化结合 `KMeans`\
  \ 聚类。我们将使用 `PCA` 进行降维：\n\n1. 示例数据集：\n\n```python\nreviews = [\n    \"Excellent product,\
  \ works as expected.\",\n    \"Not worth the price.\",\n    \"Battery life is amazing.\"\
  ,\n    \"Terrible support and broken unit.\",\n    \"Fantastic design and smooth\
  \ experience.\"\n]\n```\n\n2. TF-IDF 向量化：\n\n```python\nfrom sklearn.feature_extraction.text\
  \ import TfidfVectorizer\nvectorizer = TfidfVectorizer(stop_words='english')\nX\
  \ = vectorizer.fit_transform(reviews)\n```\n\n- **ChatGPT 提示**：`CountVectorizer`\
  \ 和 `TfidfVectorizer` 的区别是什么？\n- **ChatGPT 回答**：`TfidfVectorizer` 降低常用权重。\n\n3.\
  \ 应用 k-means 并使用 PCA 可视化：\n\n```python\nfrom sklearn.cluster import KMeans\nfrom\
  \ sklearn.decomposition import PCA\nimport seaborn as sns\nimport matplotlib.pyplot\
  \ as plt\n\n# 应用 k-means 聚类\nkmeans = KMeans(n_clusters=2, random_state=42)\nlabels\
  \ = kmeans.fit_predict(X.toarray())\n\n# 降维可视化\npca = PCA(n_components=2)\nX_pca\
  \ = pca.fit_transform(X.toarray())\n\n# 绘制聚类图\nsns.scatterplot(x=X_pca[:, 0], y=X_pca[:,\
  \ 1], hue=labels)\nplt.title(\"Text Reviews Clustering\")\nplt.xlabel(\"PC1\")\n\
  plt.ylabel(\"PC2\")\nplt.show()\n```\n\n- **ChatGPT 洞察**：在处理稀疏的高维向量（如 TF-IDF）时，使用\
  \ `PCA` 将其投影到 2D 空间——非常适合在散图中可视化聚类。\n\n此示例展示了如何将文本等非结构化数据转换为有意义的数值向量，并结合传统库和 AI\
  \ 引导进行聚类和可视化。\n\n### 非结构化图像数据的 AI 辅助聚类\n\n图像数据的聚类是分组视觉相似模式的一种强大技术，特别是在数字识别、医学成像和视觉异常检测等领域。在这个实操示例中，我们将使用来自修改版美国标准技术研究所（MNIST）数字数据集的灰度图像，并根据像素强度模式应用\
  \ `KMeans` 聚类。\n\n1. 加载示例图像数据：\n\n\n\n\n\n```python\nfrom sklearn.datasets import\
  \ load_digits\nimport matplotlib.pyplot as plt\n\ndigits = load_digits()\nX = digits.data\
  \             # Flattened 64-pixel feature vectors\nimages = digits.images     \
  \ # Original 8x8 image format\n```\n\ndigits 数据集提供了手写数字（0–9）的小型（8×8）灰度图像。每个图像表示为长度为\
  \ 64 的特征向量（展平的像素）。\n\n## 2. K-means 聚类\n\n```python\nfrom sklearn.cluster import\
  \ KMeans\nkmeans = KMeans(n_clusters=10, random_state=42)\nlabels = kmeans.fit_predict(X)\n\
  ```\n\n- **Copilot 辅助**：`GitHub Copilot` 通过智能建议关键参数并完成必要的方法调用来支持聚类设置：\n    - 识别出需要\
  \ `n_clusters=10`（匹配 10 个数字类别）。\n    - 自动完成 `.fit_predict(X)` 以根据图像特征分配聚类标签。\n\n\
  ## 3. 可视化聚类图像\n\n```python\nfig, axes = plt.subplots(2, 5, figsize=(10, 5))\nfor\
  \ i, ax in enumerate(axes.flat):\n    ax.imshow(images[i], cmap='gray')\n    ax.set_title(f'Cluster:\
  \ {labels[i]}')\n    ax.axis('off')\nplt.tight_layout()\nplt.show()\n```\n\n- **Copilot\
  \ 支持**：`GitHub Copilot` 通过预测代码结构和优化可视化步骤，在图像聚类期间提供无缝协助：\n    - 建议使用 `plt.subplots()`\
  \ 和 `axes.flat` 进行子图格式。\n    - 自动完成图像显示和标签标注。\n\n**ChatGPT 洞察**：注意 `k-means` 聚类可能并不直接对应真实的数字标签。要评估聚类的分离性，可以考虑应用\
  \ `PCA` 或 `t-SNE` 进行 2D 视觉检查。\n\n### 可选：使用 PCA 可视化\n\n```python\nfrom sklearn.decomposition\
  \ import PCA\nimport seaborn as sns\n\nX_pca = PCA(n_components=2).fit_transform(X)\n\
  sns.scatterplot(x=X_pca[:, 0], y=X_pca[:, 1], hue=labels, palette='tab10')\nplt.title(\"\
  Digit Clusters via PCA\")\nplt.xlabel(\"PC1\")\nplt.ylabel(\"PC2\")\nplt.show()\n\
  ```\n\n此 `PCA` 可视化将高维图像向量投影到 2D 空间，允许对类别重叠和分布进行更好的视觉评估。\n\n通过将无监督聚类与图像可视化相结合，此示例演示了看似复杂的非结构化数据如何通过现代工具和\
  \ AI 辅助进行有效的分组和解释。\n\n## 结论\n\n数据预处理不再是过去那种枯燥、耗时的任务。本章展示了 AI 如何改变游戏规则，帮助开发者更快速、更有信心地清理、转换和准备数据。从处理缺失值和离群值到选择有意义的特征以及管理非结构化数据，`GitHub\
  \ Copilot` 和 `ChatGPT` 等 AI 驱动的工具提供了自动化之外的实时支持；它们增强了理解并引导更明明的决策。我们还探索了 AI 如何简化聚类和数据可视化等复杂任务，使其变得更易上手且更有洞察力。无论你是为结构化业务数据构建模型，还是分析自由格式的文本或图像，AI\
  \ 现在在塑造驱动更好结果高质量数据集方面起着至关重要的作用。随着这些工具的不断演进，它们不仅在加速开发，还在提升机器学习工作流的质量和一致性。在下一章中，我们将在此基础上继续，讨论构建和训练机器学习模型，届时\
  \ AI 将再次证明自己是创建智能、高效且高性能系统的强大盟友。\n\n## 问题\n\n1. **AI 是如何改变我们处理数据预处理的方式的？**\n   **答案**：AI\
  \ 让数据预处理更快、更智能且不那么枯燥。`GitHub Copilot` 和 `ChatGPT` 等工具有助于自动化清理、格式化和转换数据等任务，让开发者花更少的时间在重复代码上，花更多的时间构建有影响力的模型。\n\
  \n2. **使用 AI 处理缺失或不一致数据有什么好处？**\n   **答案**：数据缺失是一个常见问题，但 AI 工具可以根据上下文提供智能建议；例如是使用平均值填补空白，还是应用更高级的逻辑。它们有助于确保数据保持意义且在统计上是可靠的，而不需要数小时的人工工作。\n\
  \n3. **AI 能帮助为模型选择正确的特征吗？**\n   **答案**：绝对可以。AI 可以通过评估特征对模型性能的影响来推荐最相关的特征。无论是建议独热编码、统计过滤还是基于模型的选择，AI\
  \ 都能让范围缩小到关键要素变得高效得多。\n\n4. **AI 如何协助处理文本或图像等非结构化数据？**\n   **答案**：AI 工具通过推荐标准实践来简化复杂数据类型的预处理，例如文本分词、使用\
  \ `TF-IDF` 提取关键词或归一化图像像素。它们提供分步指导，帮助开发者有信心地处理非结构化数据。\n\n5. **AI 在数据可视化中扮演着什么角色？**\n\
  \   **答案**：可视化是理解数据的关键部分，而 AI 通过根据你的数据集建议合适的图表和绘图类型，使其变得更简单。它可以帮助你快速识别模式、离群值或相关性。\n\
  \n6. **AI 如何改进聚类和无监督学习？**\n   **答案**：AI 工具协助完成从选择合适的聚类算法到选择参数的各个工作。它们甚至可以引导你解释结果，使其变得容易得多。\n\
  \n7. **是否可以使用 AI 自动化整个预处理工作流？**\n   **答案**：是的，这是最大的优势之一。通过 AI 辅助工具，你可以构建可重用、模块化的流水线，处理清理、特征转换和缩放，并保持结构化。\n\
  \n8. **为什么 GitHub Copilot 和 ChatGPT 这样的工具变得如此流行？**\n   **答案**：这些工具像智能合作伙伴。它们建议代码、解释复杂的步骤，并提供最佳实践，且实时进行。无论你是在排除故障还是不确定使用哪种方法，它们都能提供价值支持并提高生产力。\n\
  \n9. **这些 AI 工具对初学者有帮助吗？**\n   **答案**：完全不是。虽然初学者可以从分步指导中受益，但经验丰富的数据人士也欣赏这些工具带来的速度、准确性和活性。它们有助于简化工作流并在不影响质量的情况下快速实验。\n\
  \n10. **AI 在数据预处理方面的未来是什么样的？**\n    **答案**：未来正朝着更高的自动化和智能化发展。我们可以预计 AI 工具将处理更复杂的决策，动态地适应不同的数据类型，并深度地集成到端到端的机器学习工作流中，释放开发者专注于解决现实问题的时间。\n\
