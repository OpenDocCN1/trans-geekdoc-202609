  \        j += 1\n        k += 1\narr = [38, 27, 43, 3, 9, 82, 10]\nmerge_sort(arr)\n\
  print(arr)\n```\n\n*   **代码转换**：ChatGPT 让跨语言的编码变得简单。如果你需要将代码从一种语言切换到另一种语言，它会为你完成这些繁重的工作，确保一切运行如初。无论是在兼顾多个技术栈，还是在学习新东西。\n\
  \n\n\n\n\n![图 1.4：AI 辅助开发的关键里程碑](img/Figure_1.4.png)\n\n## 图 1.4：AI 辅助开发的关键里程碑\n\
  \nAI 彻底改变了软件开发，简化了编码、调试并优化了效率。让我们详细关注塑造 AI 辅助开发的关键里程碑和进展：\n\n### AI 在编码中的早期尝试\n\
  编程中的 AI 起始于一个研究项目，旨在通过自动化问题解决和代码生成任务来简化编码。最初，工具是必不可少的，提供简单的算法建议和语法帮助。\n\n- **里程碑**：20\
  \ 世纪 90 年代后期，`Eclipse` 和 `NetBeans` 等集成开发环境（IDEs`）引入了语法高亮。\n- **影响**：这些工具简化了编码和调试，为今天更先进的\
  \ AI 特性奠定了基础。\n- **示例**：早期的 `IDEs` 可以在输入时捕捉语法错误，提供实时反馈。这是一个巨大的进步，让编码更快且不那么挫败，并为未来更智能、更直观的工具开启了大门。\n\
  \n### 智能代码编辑器的兴起\n代码编辑器的演进显著改进了开发者编写和导航代码的方式。1996 年在 `Visual Studio` 中引入的早期工具如 `Microsoft\
  \ IntelliSense` 带来了上下文感知、基于规则的建议，使编程更快、更直观。尽管 `IntelliSense` 本身不使用 `ML`，但它通过基于语法和静态分析提供实时文档和预测补全，为更智能的开发工具奠定了基础。\n\
  \n最近的进展（如 `Microsoft IntelliCode`）通过集成 `ML` 进一步实现了这一点。`IntelliCode` 在数千个热门开源项目上进行训练，并根据编码模式调整其建议。它能智能地对建议进行排序，使其与开发者当前的操作更具相关性。\n\
  \n- **里程碑**：`IntelliSense` 于 1996 年在 `Microsoft Visual Studio` 中发布。\n- **影响**：它通过提供智能建议并在需要时显示文档，让编码更快且不那么挫败，因此你不需要不断切换到外部资源。\n\
  - **示例**：如果你在 `Java` 中输入 `System.`，`IntelliSense` 会立即显示 `out`、`err` 和 `console`\
  \ 等选项，帮助你不间断地找到正确选择。\n- **用例**：对于工作在大型复杂项目中的开发者来说，`IntelliSense` 让导航庞大的库和 API 变得简单得多。他们不需要深挖外部文档，而是依靠\
  \ `IntelliSense` 来引导他们，保持工作流的顺畅和高效。这意味着这些工具共同标志着智能代码编辑器的兴起——桥接了手动编写代码与预测性 AI 辅助开发之间的鸿沟。\n\
  \n### 静态分析工具的集成\n`SonarQube` 和 `Coverity` 等静态分析工具通过在开发早期检测错误、安全漏洞和代码异味，显著提高了代码质量和开发者生产力。这些工具主要依赖于基于规则的分析，使用预定义的模式和最佳实践在问题升级之前标记它们。虽然某些现代增强可能会尝试\
  \ AI（例如对问题进行排序或建议修复方案），但其核心功能仍由静态的基于规则的引擎驱动。\n\n- **里程碑**：`SonarQube` 于 2007 年发布，作为一种监控代码质量的开源工具，它改变了游戏规则。\n\
  - **影响**：它帮助团队清理代码库，减少技术债，并更快地交付更好的软件。\n- **示例**：`SonarQube` 可以在评审期间发现未使用的变量或重复代码，允许开发者在它们变成问题之前进行修复。\n\
  \n**案例研究——SonarQube 如何转型软件开发**：一家中型软件公司可以通过采用 `SonarQube` 跟踪其代码来彻底改变其工作流。有了这个强大的工具，团队可以及早发现问题，减少\
  \ 35% 的生产错误，并使发布更加顺畅。`SonarQube`还将帮助缩短 20% 的交付周期，让团队有更多时间关注创新，而不是手忙脚乱地修复最后的问题。通过节省时间、避免不必要的压力并按时交付高质量软件，`SonarQube`\
  \ 可以成为公司的游戏规则改变者。这展示了一个简单而有效的工具如何让每个参与者的开发变得更高效、更愉快。\n\n### AI 驱动的自动补全工具的发展\n2021\
  \ 年发布的 `GitHub Copilot` 彻底改变了开发者编写代码的方式。它由 `OpenAI` 的 `Codex` 模型驱动，引入了多行代码生成和智能建议等功能，使编码更快、更简单、更直观。\n\
  \n- **里程碑**：`Copilot` 在 2021 年的发布为 AI 驱动的编码工具设定了新基准。\n- **影响**：自动化重复性任务并加速新功能的创建，让开发者能够专注于解决有趣的问题并更具创意。\n\
