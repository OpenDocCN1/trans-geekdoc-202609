  \n虽然像 `ChatGPT` 和 `GitHub Copilot` 等 AI 工具通过根据自然语言输入生成代码并适应自定义工作流来帮助开发者，但将它们与 `Azure\
  \ AutoML`、`AWS SageMaker Autopilot` 和 `Google Cloud AutoML` 等 AutoML 平台进行比较也是很有用的。\n\
  \n为了澄清 AI 辅助开发工具与云端 AutoML 平台的区别，下表概述了在定制化、透明度、用户交互和理想用例等维度上的主要区别：\n\n| 维度 | AI\
  \ 辅助工具（例如 `ChatGPT`, `Copilot`） | AutoML 平台（`Azure`, `AWS`, `GCP`） |\n| ------|---|---|\n\
  | 用户交互 | 对话式、提示驱动的代码辅助 | 基于 GUI 或 API 驱动的流水线自动化 |\n| 定制化 | 高：开发者控制流水线的每个方面 | 中等：自定义选项仅限于设置/开关\
  \ |\n| 灵活性 | 适用于标准和高度自定义的用例 | 理想用于对人工干预极少的标准机器学习工作流 |\n| 领域集成 | 可以通过提示工程为特定领域逻辑定制\
  \ | 对深度领域定制的灵活性较低 |\n| 透明度 | 代码、逻辑和流水线结构完全可见 | | 通常作为黑盒运行，或解释性有限 |\n| 所需技能水平 | 具备基础到高级的编程知识会有帮助\
  \ | 需要极少的编程知识 |\n| 理想用例 | 需要自定义代码、实验或控制时 | 目标是快速原型或或部署时 |\n\n| 表 8.4：AI 辅助工具与传统\
  \ AutoML 平台（`Azure`, `AWS`, `GCP`） |\n\n虽然 AutoML 解决方案对于希望在极少人工干预下进行快速、自动模型开发的用户是理想的，但\
  \ AI 辅助工具更适合希望在机器学习工作流中保持精粒度控制、透明度和适应性的开发者和数据科学家。\n\n### 关于可解释性与性能的 AI 建议\n\n在许多现实应用中，仅有模型性能是不够的，特别是在医疗、金融或法律领域。可解释性成为一个关键需求。利益者通常需要理解模型为什么做出特定的预测，特别是当决策影响人类生活或监管法规时。\n\
  \n这产生了一个根本性的权衡：高度可解释的模型可能缺乏预测能力，而高性能模型通常作为黑盒运行。\n\n像 `ChatGPT` 等 AI 工具通过建议符合特定优先级（如清晰度、准确性或两者的平衡）的模型和策略来应对这种权衡。\n\
  \n下表展示了针对不同目标定制的 AI 推荐模型选择，平衡了可解释性和性能需求：\n\n| 目标 | 推荐模型 |\n| ------|---|\n| 高可解释性\
  \ | `Logistic regression`, `decision trees` |\n| 高性能 | `Random forest`, `Gradient\
  \ boosting machines`（例如 `XGBoost`），`deep neural networks` |\n\n| 表 8.5：基于目标的 AI\
  \ 推荐模型选择 |\n\n* 提示技巧：如果你在受监管的领域工作，请使用此类提示：我需要性能良好且可解释的模型。\n\n* AI 建议：以下 AI 建议强调了以下技术：\n\
  \n    * 使用带有 `SHAP` 的 `random forest`：一种解释单个预测和全局重要性的博弈论框架。有关深度实践教程，请参见 `shap.readthedocs.io/en/latest/`\n\
  \n    * 探索可解释提升机 (EBM)：一种内在的可解释模型族（带有提升的广义加性模型），可提供特征贡献和交互作用。从 `interpret.ml/docs/ebm.html`\
  \ 了解更多。\n\n通过将可解释性工具与高性能模型相结合，AI 辅助工作流有助于弥补预测能力与责任之间的差距。\n\n### 使用 AI 驱动引导预测违约的用例\n\
  \n一家金融科技公司致力于开发一种稳健的信用风险模型，利用结构化数据（包括收入水平、还款历史和人口统计属性）来预测贷款违约。由于类别不平衡和对解释性的需求，该任务特别具有挑战性。\n\
  \n为了加速开发，团队转向 `ChatGPT` 获取实时的 AI 驱动引导。通过一系列提示驱动的交互，他们能够：\n\n* 识别适用于不平衡分类问题的合适模型，例如带有\
  \ `class_weight='balanced'` 的 `RandomForestClassifier`。\n\n* 构建 `scikit-learn` 流水线，结合预处理、建模和评估，并使用\
  \ `StratifiedFold` 在交叉验证期间保留类别分布。\n\n* 使用内置的特征重要性工具和 `SHAP` 分析特征贡献以进行模型解释。\n\n*\
  \ 在怀疑存在更深层的非线性特征交互时，过渡到基于 `Keras 的 MLP`，增强模型的学习能力。\n\n结果：团队成功开发了一个混合建模框架，结合了传统机器学习的可解释性和深度学习的表达能力。最值得注意的是，该项目在典型开发时间的一半内完成，同时提高了预测准确性和模型透明度。\n\
  \n\n\n\n像 `ChatGPT` 和 `GitHub Copilot` 等 AI 辅助工具在自动化这些步骤方面非常有效，能够引导开发者完成常见任务，例如：\n\
  \n* 使用填充或删除等策略处理缺失值。\n* 对分类变量进行编码以使其机器可读。\n* 缩放数值特征以提高训练稳定性。\n* 执行分层训练-测试划分以保留类别分布。\n\
  \n开发者可以通过向 `ChatGPT` 提出特定请求在几秒钟生成整洁且可复用的代码。例如：\n\n向 `ChatGPT` 提示：`使用 Scikit-learn\
  \ 生成二分类数据集的预处理代码。包含训练-测试划分、标准缩放和标签编码。` AI 输出示例：\n\n```python\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.preprocessing import StandardScaler, LabelEncoder\n\
  \n# 划分特征\nX = data.drop('target', axis=1)\ny = data['target']\n\n# 编码分类变量\nle =\
  \ LabelEncoder()\ny = le.fit_transform(y)\n\n# 分层训练-测试划分\nX_train, X_test, y_train,\
  \ y_test = train_test_split(\n    X, y, test_size=0.2, stratify=y, random_state=42\n\
  )\n\n# 缩放数值特征\nscaler = StandardScaler()\nX_train = scaler.fit_transform(X_train)\n\
  X_test = scaler.transform(X_test)\n```\n\nAI 提示：`ChatGPT` 还可以通过建议均值填充、模式替换或集成 `SimpleImputer`\
  \ 等技术来引导用户处理缺失值。它还可以生成量身定制代码片段。\n\n然而，虽然 `ChatGPT` 提供了有用的建议，但关键的是要对数据以及填充策略有深入的理解。例如，完全随机缺失\
  \ (`MCAR`)、随机缺失 (`MAR`) 以及非随机缺失 (`MNAR`) 的因素及其对下游建模的影响，不应盲目地自动化。\n\n通过将这些基础任务交给\
  \ AI 工具，开发者可以节省时间，并确保实验的一致性，从而更快速地进入模型开发和评估。\n\n## 使用 AI 工具构建模型\n\n当数据流水线准备好后，下一步是构建模型。在这里，`ChatGPT`\
  \ 和 `GitHub Copilot` 等 AI 辅助工具大放异彩，帮助开发者有效地构建模型、调优超参数并加速各种机器学习框架的代码生成。\n\n在本小节中，我们将探索\
  \ AI 工具如何支持 `scikit-learn`、`Keras` 和 `PyTorch` 中的模型构建。\n\n### Scikit-learn 分类器\n\
  \n`scikit-learn` 仍然是机器学习模型的常用库。使用 `ChatGPT`，开发者可以在几条提示内快速生成并优化分类器代码。\n\n为了优化性能，AI\
  \ 工具通常建议使用 `GridSearchCV` 来系统地测试超参数组合：\n\n```python\nfrom sklearn.ensemble import\
  \ RandomForestClassifier\nmodel = RandomForestClassifier(n_estimators=100, max_depth=8,\
  \ class_weight='balanced')\nmodel.fit(X_train, y_train)\n```\n\nAI 提示：向 `ChatGPT`\
  \ 提示：`为 RandomForestClassifier 生成一个用于调整深度和估计器的网格搜索模板。`\n\n```python\nparams = {'n_estimators':\
  \ [100, 200], 'max_depth': [4, 8]}\ngrid = GridSearchCV(RandomForestClassifier(),\
  \ params, cv=5)\ngrid.fit(X_train, y_train)\nprint(\"Best Parameters:\", grid.best_params_)\n\
  ```\n\n### Keras 神经网络分类器\n\n`Keras` 提供了一个直观的 API 来构建需要深度特征交互的神经网络。`ChatGPT` 可以建议层架构、优化器和回调函数以防止过拟合。以下示例演示了\
  \ `ChatGPT` 如何通过推荐有效的架构、正则化策略和训练回调辅助构建神经网络分类器：\n\n```python\nfrom tensorflow.keras.models\
  \ import Sequential\nfrom tensorflow.keras.layers import Dense, Dropout\nfrom tensorflow.keras.callbacks\
  \ import EarlyStopping\n\nmodel = Sequential([\n    Dense(128, activation='relu',\
  \ input_shape=(X_train.shape[1])),\n    Dropout(0.3),\n    Dense(64, activation='relu'),\n\
  \    Dense(1, activation='sigmoid')\n])\n\nmodel.compile(optimizer='adam', loss='binary_crossentropy',\
  \ metrics=['accuracy'])\nearly_stop = EarlyStopping(patience=3)\nmodel.fit(X_train,\
  \ y_train, epochs=20, batch_size=32, validation_split=0.2, callbacks=[early_stop])\n\
  ```\n\n### PyTorch 分类器\n\n在 `PyTorch` 中，模型构建需要更多的人工控制，但 AI 工具通过提供定义和训练循环的脚架来协助：\n\
  \n```python\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\n\n\
  class BinaryClassifier(nn.Module):\n    def __init__(self, input_dim):\n       \
  \ super(BinaryClassifier, self).__init__()\n        self.model = nn.Sequential(\n\
