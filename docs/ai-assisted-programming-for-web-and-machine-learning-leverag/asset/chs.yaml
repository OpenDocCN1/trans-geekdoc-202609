  \ encoding）。\n    *   对于具有许多唯一值的分类列（例如超过 100 个），可以推荐频率编码（frequency encoding）或目标编码（target\
  \ encoding），以避免创建过多的新列。\n    *   它可以根据数据集大小以及你是否使用的是线性模型还是基于树的模型，帮助你在 `TF-IDF` 和\
  \ `CountVectorizer` 之间进行选择。\n\n让我们来看一个交互示例：\n\n提示词：如何处理具有 100 多个唯一值的分类变量？\n\nChatGPT\
  \ 洞察：使用 `frequency encoding` 或 `target encoding` 代替 `one-hot encoding`，以避免维度问题和内存效率低下。\n\
  \n通过自动化和引导这些选择，AI 工具帮助开发者从分类和文本数据中高效地提取有意义的特征——且不牺牲性能或可解释性。\n\n## 来自日期和时间的特征提取\n\
  \n日期和时间字段通常包含原始形式中无法立即察觉的有价值见解。通过提取有意义的组件（如年份、月份或星期几），开发者可以发现与季节性、趋势和时间行为相关的模式。这些提取出的特征可以提高模型性能，特别是在销售预测、员工流失分析或网络流量预测等对时间敏感的应用中。\n\
  \n### 传统方法\n\n从日期列派生新特征常用的方法是使用 `Pandas` 的 `datetime` 访问器。\n\n这是一个简单的示例：\n\n```python\n\
  df['JoinDate'] = pd.to_datetime(df['JoinDate'])\ndf['JoinYear'] = df['JoinDate'].dt.year\n\
  df['JoinMonth'] = df['JoinDate'].dt.month\ndf['JoinDayOfWeek'] = df['JoinDate'].dt.dayofweek\n\
  ```\n\n此代码段从 `JoinDate` 列中提取年份、月份和星期几。这些新特征可以用于下游建模任务，以理解季节性招聘趋势、基于工作日的行为等。\n\n\
  ### ChatGPT 建议的循环编码\n\n虽然从日期字段中提取数值是有帮助的，但它有时会引入人为的不连续性。例如，将十二月编码为 `12` 将一月编码为 `1`\
  \ 会暗示这些月份相得很远，而实际上它们是连续的。循环编码（Cyclical encoding）被用于捕捉时间数据的循环本质以解决这个问题。\n\n以下代码应用循环编码更准确地表示\
  \ `JoinMonth` 列：\n\n```python\nimport numpy as np\n\ndf['Month_sin'] = np.sin(2\
  \ * np.pi * df['JoinMonth'] / 12)\ndf['Month_cos'] = np.cos(2 * np.pi * df['JoinMonth']\
  \ / 12)\n```\n\n生成此代码的示例提示词：\n\n“我想编码一个包含月份（1–12）的列，并捕捉其循环特性。你可以向我展示如何使用 Python\
  \ 中的正余弦变换来实现吗？”\n\n这种技术将月份转换为正弦和余弦分量，保留了它们的自然周期。线性回归和神经网络在使用这种编码时通常表现更好，因为消除了时间端点（例如第\
  \ 12 月和 1 月）之间的人为间隙。\n\n对于月份、星期几或小时等特征，在数据周期性循环回到自身的任何地方，都可以使用循环编码。\n\n通过将传统提取技术与\
  \ AI 推荐的实践（如循环编码）相结合，开发者可以确保他们的模型捕捉到隐藏在日期字段中的真实时间关系。\n\n## 创建交互特征和多项式特征\n\n有时，线性组合无法很好捕捉变量之间的关系。这就是交互特征和多项式特征发挥作用的地方。通过组合两个或多个变量，将它们相乘或幂，我们可以暴露原本不会被注意的复杂非线性关系。这些特征为机器学习模型增加了显著的预测能力，特别是在变量相互依赖的情况下。\n\
  \n### 传统方法\n\n生成交互项和多项式的一种常用方法是使用 `scikit-learn` 的 `PolynomialFeatures` 类。\n\n以下代码使用\
  \ `Experience` 和 `Salary` 生成二阶交互和多项式特征：\n\n```python\nfrom sklearn.preprocessing\
  \ import PolynomialFeatures\n\npoly = PolynomialFeatures(degree=2, include_bias=False)\n\
  X_poly = poly.fit_transform(df[['Experience', 'Salary']])\n```\n\n此示例从 `Experience`\
  \ 和 `Salary` 列创建了二阶多项式特征。这包括：\n*   每个原始特征（例如 `Experience`、`Salary`）\n*   平方项（例如\
  \ `Experience²`、`Salary²`）\n*   交互项（例如 `Experience × Salary`）\n\n这些新特征允许模型在不显式更改算法的情况下学习更复杂的模式。\n\
  \n### AI 辅助\n\nAI 辅助工具在整个过程中可提供有用的支持：\n\n*   `GitHub Copilot` 可以自动建议使用 `PolynomialFeatures`\
  \ 并推荐合适的参数，如 `degree=2` 和 `include_bias=False`。\n*   `ChatGPT` 提供深层见解，指导何时以及如何应用变换。例如：\n\
