  df['Segment'] = KMeans.fit_predict(X_scaled)\n\nsns.scatterplot(x='Annual Income',\
  \ y='Spending Score', hue='Segment', data=df, palette='viridis')\nplt.title(\"Customer\
  \ Segments\")\nplt.show()\n```\n\n### AI 辅助\n\n`GitHub Copilot` 和 `ChatGPT` 等 AI\
  \ 工具简化了聚类的实现和解释：\n\n*   **GitHub Copilot**: `GitHub Copilot` 通过根据数据上下文建议有意义的变量名，提高了代码清晰度：\n\
