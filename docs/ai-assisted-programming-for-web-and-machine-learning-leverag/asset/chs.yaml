  \n    示例：\n\n    用户：如何实现归并排序算法（merge sort）？\n\n    ChatGPT：\n\n```python\ndef merge_sort(arr):\n\
  \    if len(arr) > 1:\n        mid = len(arr) // 2\n        left = arr[:mid]\n \
  \       right = arr[mid:]\n        merge_sort(left)\n        merge_sort(right)\n\
  \        i = j = k = 0\n        while i < len(left) and j < len(right):\n      \
  \      if left[i] < right[j]:\n                arr[k] = left[i]\n              \
