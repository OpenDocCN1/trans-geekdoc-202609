  ```bash\nnpm install -g deepcode\n```\n\n2. 运行 AI 驱动的代码分析扫描：\n```bash\ndeepcode\
  \ analyze\n```\n\n3. 示例输出（检测到安全缺陷）：\n`Warning: Potential SQL injection detected\
