  \ JSX 语法及其修复的示例：\n\n*   缺少闭合标签：\n    *   错误：\n        ```jsx\n        <div>\n  \
  \        <h1>Hello World\n        ```\n    *   正确：\n        ```jsx\n        <div>\n\
  \          <h1>Hello World</h1>\n        </div>\n        ```\n*   使用 `class` 代替\
  \ `className`：\n    *   错误：\n        ```jsx\n        <div class=\"container\">Welcome</div>\n\
