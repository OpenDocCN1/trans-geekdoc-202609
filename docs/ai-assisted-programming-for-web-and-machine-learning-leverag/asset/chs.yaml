  \ | `ChatGPT` 推荐可解释性模型（例如决策树、线性模型） |\n| 计算限制 | 实时推理、移动端和嵌入式部署 | `Copilot` 提出如逻辑回归或浅层神经网络等高效模型。\
  \ |\n\n表 8.3：算法选择的关键标准和 AI 工具指导\n\n理解这些标准使执业人员能够更有效地使用 AI 辅助工具，将模糊的提示转换为精确的、感知上下文的指令，从而获得更好的建模结果。\n\
  \n## 提示驱动的算法推荐\n\n如 `ChatGPT` 和 `GitHub Copilot` 等由 AI 驱动的编程助手在精确且结构良好的提示引导下，能够提供最有价值的见解。通过清晰地陈述机器学习任务、数据集特征和评估目标，开发者可以获得高度相关的模型推荐、推理建议、预处理建议，甚至是即插可用的代码。\n\
  \n以下示例说明了提示词工程如何直接影响算法推荐的质量：\n\n- 示例提示：“针对小规模且不平衡的数据集建议一个二分类模型。”\n- AI 响应 (`ChatGPT`)：以下\
  \ AI 生成的建议展示了处理分类任务中类别不平衡的有效策略：\n    - 使用带有 `class_weight='balanced'` 的 `Logistic\
  \ regression`\n    - 使用控制深度（`max_depth`）的 `Random forest`（随机森林）以避免过拟合\n    - 使用\
  \ `SMOTE + Gradient boosting` 通过重采样来解决类别不平衡问题\n    - 评估指导：使用 `F1 score` 或 `ROC-AUC`\
  \ 来衡量不平衡类别的性能\n- `Copilot` 见解：当你以 `model =` 开始写代码时，`GitHub Copilot` 会自动生成相关的模型选项，例如：\n\
  \n```\nmodel = RandomForestClassifier()\nmodel = LogisticRegression()\nmodel = HistGradientBoostingClassifier()\n\
  ```\n\n这些建议基于之前的代码、变量名和导入的库，使得模型设置变得无缝并与任务保持一致。\n\n**提示词工程技巧**：使用显式短语如 `end-to-end\
  \ pipeline`（端到端流水线）、`optimize for recall`（优化召回率）或 `handle imbalanced data`（处理不平衡数据）来引导\
  \ AI 生成更完整且更适用于生产的解决方案。\n\n通过将特定任务的清晰度与 AI 增强工具相结合，执业人员可以用更大的信心、一致性和有效性加速算法选择。清晰地定义任务（例如问题是分类、回归还是聚类）有助于缩小合适的算法族范围。`ChatGPT`\
  \ 和 `GitHub Copilot` 等 AI 工具随后可以帮助探索和比较算法选项，推荐合适的超参数，甚至生成启动代码模板。\n\n例如，在面对涉及类别不平衡的二分类任务时，向\
