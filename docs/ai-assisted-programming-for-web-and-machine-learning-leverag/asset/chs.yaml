  \n## 评估分类性能\n\n评估分类模型的有效性与构建它同样重要。评估指标的选择应该与数据集的特征保持一致，特别是它是平衡的还是不平衡的。`ChatGPT`\
  \ 等 AI 辅助工具可以帮助开发者选择正确的指标并生成用于模型评估的就绪代码。\n\n### 基于数据集特征的推荐指标\n\n根据数据集的特征推荐以下指标，以确保模型评估的意义：\n\
  \n*   准确率（Accuracy）：当数据集类别分布大致相等时有用。\n*   精确率（Precision）、召回率（Recall）、F1 分数（F1 score）：对于不平衡的数据集至关重要，此时简单的准确率可能会误误性。\n\
  *   受者工作特征曲线下面积（ROC-AUC）：对于概率模型是理想的，因为它评估了不同阈值下真正例和假正例之间的权衡。\n\n\n\n\nScikit-learn\
  \ 提供了简洁的工具来报告分类结果并计算 ROC-AUC：\n\n```python\nfrom sklearn.metrics import classification_report,\
  \ roc_auc_score\ny_pred = model.predict(X_test)\nprint(classification_report(y_test,\
  \ y_pred))\nprint(\"ROC AUC:\", roc_auc_score(y_test, y_pred))\n```\n\n| AI 提示：ChatGPT\
  \ 可以根据类别不平衡情况或输出类型，自动建议何时使用 F1 或 ROC-AUC 等指标。 |\n\n## Keras 模型评估\n\nKeras 模型返回的是概率得分，因此需要对预测结果进行阈值处理以获取类别标签：\n\
  \n```python\ny_pred = model.predict(X_test)\ny_pred_classes = (y_pred > 0.5).astype(\"\
  int32\")\n```\n\n然后，你可以将 `y_pred_classes` 接入 scikit-learn 指标进行评估，就像处理传统的机器学习模型一样。\n\
  \n## PyTorch 模型评估\n\n在 PyTorch 中，预测是以张量形式生成的，因此它们需要在评估模式下通过模型，并转换为 NumPy 数组以便分析：\n\
  \n```python\nmodel.eval()  # 设置模型为评估模式\nX_test_tensor = torch.tensor(X_test, dtype=torch.float32).to(device)\n\
  y_pred = model(X_test_tensor).detach().cpu().numpy()\ny_pred_classes = (y_pred >\
  \ 0.5).astype(int)\n```\n\n然后你可以使用 scikit-learn 的报告工具评估 `y_pred_classes`。像 ChatGPT\
  \ 和 GitHub Copilot 等 AI 工具可以通过自动化指标选择、生成适当的代码以及推荐上下文相关的方法（例如，针对不平衡的二分类使用 ROC-AUC，或针对回归任务使用\
  \ MSE）来简化这一评估过程。\n\n然而，虽然这些工具提供了快速且实用的支持，但咨询领域专家（SME）和专业人士仍然至关重要，特别是在以下情况：\n\n*\
  \   选择符合真实世界优先事项的性能指标\n*   在领域限制内解释模型预测\n*   确保模型的输出是可解释且可信的\n\n将 AI 辅助自动化与专家驱动的上下文验证相结合，有助于构建准确、公平且可靠的模型，并能够应对现实世界的部署。\n\
  \n## AI 辅助构建垃圾邮件检测模型的用例\n\n在 AI 辅助开发的实际应用中，一个数据科学团队构建一个稳健的垃圾邮件分类器。他们的数据集结合了结构化元数据（如发送者频率、邮件长度和主题模式）以及从邮件正文中提取的文本频率向量。\n\
