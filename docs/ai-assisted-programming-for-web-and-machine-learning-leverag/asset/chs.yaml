  \n![QR-Logo](img/fm1.png)\n\n# 第 7 章 使用 AI 进行数据预处理\n\n## 引言\n\n在任何机器学习模型做出准确预测或发现有意义的模式之前，必须喂入清洁、结构良好且经过深思熟虑的数据。这一关键准备阶段——数据预处理——是成功的\
  \ AI 和数据科学项目的基石。无论是填充缺失值、标准化格式还是提取关键特征，预处理的质量直接影响着最终模型。\n\n传统上，数据预处理涉及手动工作、调试不一致之处以及选择正确的转换技术。然而，今天我们正见证着巨大的变化。随着\
  \ `GitHub Copilot` 和 `ChatGPT` 等 AI 驱动工具的兴起，开发者现在拥有了智能助手，可以简化许多工作。这些工具不仅仅是建议代码；它们还提供智能的、感知上下文的建议，并帮助设计更清洁、更模块化的解决方案。\n\
  \n本章将探索 AI 如何重塑整个过程。我们将涵盖清洗和转换数据的实用技术、自动化特征工程、处理非结构化数据，并展示 AI 驱动的洞察如何增强每一个步骤。\n\n\
  ## 结构\n\n本章涵盖了以下主题：\n\n* 使用 AI 进行数据清洗和转换\n* 自动化特征提取与选择\n* 使用 AI 可视化数据洞察\n* 无监督学习与聚类\n\
  * 使用 AI 实现各种技术\n* 数据预处理的案例研究\n* 结构化和非结构化数据的实践示例\n\n## 目标\n\n本章探索了 AI 如何改变我们为机器学习准备数据的方式。它展示了如\
  \ `GitHub Copilot` 和 `ChatGPT` 等工具如何简化数据数据、处理缺失值、标准化格式以及选择重要特征等任务。读者还将看到 AI 如何帮助理解结构化和非结构化数据，并支持聚类技术。在在本章结束时，读者将理解如何使用\
  \ AI 构建更快、更智能且更可靠的预处理工作流。\n\n### 使用 AI 工具进行数据清洗和转换\n\n在任何数据驱动的系统中，数据质量都是后续所有工作的基础；它直接影响我们\
  \ ML 模型的准确性、效率和可理解性。这就是为什么数据清洗和转换不仅仅是例行的步骤；它们是机器学习流水线中至关重要的阶段。它们的作用是将原始、混乱且往往不一致的数据转换为结构化的、有意义的格式，为分析和建模做好准备。\n\
  \n传统上，这个过程需要对 `Pandas`、`NumPy`、`Matplotlib`、`Seaborn` 和 `scikit-learn` 等数据操作工具有深入的理解（此处翻译无误）。这通常意味着要编写大量的样板代码，调试细微的不一致之处，并依赖经验来选择正确的转换技术。然而，格局正在发生变化。随着\
  \ `GitHub Copilot` 和 `ChatGPT` 等 AI 辅助编程工具的兴起，开发者现在拥有了强大的盟友，可以简化许多此类工作。这些工具不仅仅是建议代码；它们提供智能的、感知上下文的建议，解释最佳实践，并帮助设计更清洁、更模块化的解决方案。\n\
  \n在本节中，我们将拆解数据清洗和转换涉及的关键任务。我们还将看到传统方法如何通过 AI 辅助得到增强，帮助开发者构建更快、更高效且易于维护和扩展的预处理工作流。\n\
  \n### 自动化缺失值处理\n\n\n\n\n\n缺失数据是真实世界数据集中的常见挑战，通常由数据输入错误、记录不完整或系统限制而引起。解决这些缺口至关重要；这不仅仅是为了填充空白，而是要以一种保持数据完整性并确保统计有效性的方式。根据数据集和上下文，缺失值可能会被删除、使用平均值或中位数等统计量进行插补，或者使用领域特定的逻辑进行填充。\n\
  \n## 传统方法\n\n传统上，处理缺失值涉及手动探索数据集并使用 `Pandas` 等工具应用相应的策略。\n\n例如：\n\n```python\nimport\
  \ pandas as pd\n\ndf = pd.read_csv(\"employee_data.csv\")\nprint(df.isnull().sum())\n\
  df['Salary'] = df['Salary'].fillna(df['Salary'].mean())\n```\n\n在这段代码中，首先识别 `Salary`\
  \ 列中的缺失值，然后使用该列的平均值进行插补。这是一种简单的技术，但它假设数据是均匀分布的，且平均值是一个可靠的替代方案，而这些假设在所有场景下并不成立。\n\
  \n要练习此示例，你可以在此处下载样本数据集：[`raw.githubusercontent.com/nuhil/datasets/master/employe-salary-region-dummy.csv`](https://raw.githubusercontent.com/nuhil/datasets/master/employe-salary-region-dummy.csv)\n\
  \n你可以选择性将下载的文件重命名为 `employee_data.csv`。\n\n## AI 辅助\n\nAI 工具显著简化了这一过程。通过 `GitHub\
  \ Copilot`，开发者可以获得常见插补模式的实时建议。例如，一旦开始输入 `.fillna(`，Copilot 就能预测如 `df['Salary'].mean()`\
  \ 等合适的参数来填充缺失值，让你编写代码更快且语法错误更少。\n\n此外，AI 支持更高级的逻辑：\n\n### 使用部门平均值进行分组插补\n\n```python\n\
  df['Salary'] = df.groupby('Department')['Salary'].transform(lambda x: x.fillna(x.mean()))\n\
  ```\n\nChatGPT 进一步提供了上下文建议。你可以提出针对性的问题，例如：\n\n提示词：我正在分析一个缺失薪资值的劳动力数据集的补偿趋势。我应该使用总体平均值还是部门平均值来插补缺失薪资？我希望分析能反映真实的部门内部趋势。\n\
  \nChatGPT 洞察：如果薪资在部门之间差异显著，使用 `groupby().transform('mean')` 进行部门插补可以确保更好的准确性，并反映数据中的内部结构。\n\
  \n通过利用此类 AI 工具，开发者可以做出明智且符合统计学的决策，根据数据集的细微差别快速调整方法。这提高了数据质量，并增强了下游机器学习模型的性能和可靠性。\n\
  \n## 检测并移除离群值\n\n离群值是偏离大部分数据的极高或极低值，会显著偏偏统计分析并损害机器学习模型的性能。如果不处理，它们可能会导致误导性模式、糟糕的模型泛化能力以及意外的预测行为。这就是为什么检测并适当处理离群值对于任何数据预处理流水线都至关重要。\n\
  \n识别离群值最广泛的方法之一是四分位距（IQR）法，它利用数据的中间 50% 来定义一个被视为正常的范围。落在范围之外的数据点通常被标记为离群值。\n\n###\
  \ 传统方法\n\n使用 `Pandas` 和 `NumPy` 实现 IQR 方法的常规写法如下：\n\n```python\nimport numpy as\
  \ np\n\nQ1 = df['Salary'].quantile(0.25)\nQ3 = df['Salary'].quantile(0.75)\nIQR\
  \ = Q3 - Q1\ndf_filtered = df[(df['Salary'] >= Q1 - 1.5 * IQR) & (df['Salary'] <=\
  \ Q3 + 1.5 * IQR)]\n```\n\n在这里，我们计算 `Salary` 列的第一四分位数（Q1）和第三四分位数（Q3），得出 `IQR`，并过滤掉超出\
  \ Q1 以下 1.5 倍 IQR 或 Q3 以上 1.5 倍 IQR 的值。这种技术有效地隔离了极值，而无需对数据的分布做任何假设。\n\n### AI 辅助\n\
  \n`GitHub Copilot` 等 AI 工具通过自动完成 IQR 逻辑简化了这一过程。开发者一旦开始计算位数，Copilot 就会直观地建议完整的离群值过滤代码，减少了手动工作并降低错误概率。\n\
  \n同时，ChatGPT 提供了更深分析支持。它可以解释何时适用 IQR 方法，以及替代技术如 z-score（假设数据从正态分布）或基于百分比的阈值（适用于偏态分布）。此外，建议使用箱线图和直方图等可视化工具来帮助发现离群值。\n\
  \n以下箱线图提供了 `Salary` 数据中潜在离群值的视觉表示：\n\n```python\nimport seaborn as sns\n\nsns.boxplot(x=df['Salary'])\n\
  ```\n\n这样的视觉辅助工具可以快速揭示仅通过统计摘要无法发现离群值。\n\n你甚至可以通过此类问题与 ChatGPT 交互：\n\n提示词：我如何使用 z-score\
  \ 方法移除薪资离群值？\n\nChatGPT 回答：你可以使用 `scipy.stats.zscore` 来识别正态分布数据中的离群值。通常，zscore 大于\
  \ 3 或小于 -3 的值被认为是离群值。这是一个示例实现。\n\n通过这种智能代码建议和上下文统计指导的结合，AI 辅助工具使开发者能够更有信心、更有效地检测和管理离群值，确保更干净的数据集和更可靠的模型性能。\n\
  \n## 数据类型转换与标准化\n\n确保数据集中的每列都具有正确的数据类型对于准确的分析、计算和建模至关重要。特别是机器学习算法期望数据结构整洁：日期应采用正确的日期格式，数值字段应为整数或浮点类型，类别变量应转换为数值表示。即使是最复杂的模型，如果没有这一步也会产生错误的结果。\n\
  \n例如，代表日期的列最初可能被读取为纯文本。同样，Junior、Mid 和 Senior 等类别值可能需要转换为数值以供模型使用。\n\n### 传统方法\n\
  \n在传统的预处理流中，数据类型转换通常需要使用 `Pandas` 进行手动转换。\n\n这是一个简单的示例：\n\n```python\ndf['JoinDate']\
  \ = pd.to_datetime(df['JoinDate'], errors='coerce')\ndf['Experience_Level'] = df['Experience_Level'].map({'Junior':\
  \ 1, 'Mid': 2, 'Senior': 3})\n```\n\n这段代码将日期字符串解析为日期对象，并将经验水平映射为数值。虽然这种方法有效，但在处理不格式或跨列大规模转换时会变得繁琐。\n\
  \n### AI 辅助\n\nAI 辅助编程工具极大简化了此类转换`GitHub Copilot` 可以检测代码中的模式并建议整个转换链。例如，一旦你开始将列转换为日期，Copilot\
  \ 可能会提出完整的 `pd.to_datetime()` 命令，并通过 `errors='coerce'` 参数处理无效格式等边缘情况。\n\nChatGPT\
  \ 通过帮助你应对更复杂的情况进一步增强了这一过程——例如包含混合日期格式、意外字符串条或标签不一致类别的列。还可以推荐更先进的技术，如使用 `scikit-learn`\
  \ 的 `LabelEncoder` 或在适用时应用独热编码。\n\n以下转换对 `Experience_Level` 列应用了 `LabelEncoder`：\n\
  \n```python\nfrom sklearn.preprocessing import LabelEncoder\n\nle = LabelEncoder()\n\
  df['Experience_Level'] = le.fit_transform(df['Experience_Level'])\n```\n\n\n\n\n\
  \n通过这种水平的支持，开发者可以确保数据格式正确，并为建模和可视化等下游任务做好一致的准备。AI 工具弥补了准确性与效率之间的鸿沟，在减少在重复编码上花费时间的同时，保持了处理多样化数据场景的灵活性。\n\
  \n## 标准化列名\n\n不一致或格式不佳的列名是数据工作流中一个细微但常见的错误来源。诸如开头/结尾空格、大小写不一致或嵌入空格等问题可能会导致难以检测的错误，特别是在执行基于列的操作或合并数据集时。标准化列名可以消除这些错误，提高可读性，并确保整个数据流水线的一致性。\n\
  \n### 传统方法\n\n传统工作流中的常见做法是组合字符串操作来清理列名。\n\n以下代码通过链式调用字符串操作来标准化列名：\n\n```python\n\
  df.columns = df.columns.str.strip().str.lower().str.replace(' ', '_')\n```\n\n这段代码修除了空白字符，将所有名称转换为小写，并将空格替换为下划线，这是一种广泛接受的约定，被称为\
  \ `snake_case`。这使得列名在代码中更易引用，并符合 Pythonic 的最佳实践。\n\n### AI 辅助\n\nAI 工具可以显著加速并增强这一过程。当你开始修改\
  \ `df.columns` 时，GitHub Copilot 往往就能预测整个转换链，从而节省时间并减少语法错误的概率。\n\n另一方面，ChatGPT 的功能不仅限于代码自动补全。它通过推荐辅助函数来推广整洁且可重用的编码实践。\n\
  \n以下辅助函数封装了跨数据集标准化列名的最佳实践：\n\n```python\ndef clean_column_names(df):\n    df.columns\
  \ = df.columns.str.strip().str.lower().str.replace(' ', '_')\n    return df\n```\n\
  \n此类函数可以在跨数据集时保持一致地标准化列名，并在协作或生产级环境中工作时提高代码的可维护性。ChatGPT 还可以指导开发者采用统一的命名规范（例如 `snake_case`），这在与机器学习流水线、API\
  \ 或数据库系统集成时特别有益。\n\n通过将自动化与最佳实践建议相结合，AI 辅助工具使列名的标准化工作变得快速、一致且可靠，帮助开发者避免常见陷阱并保持整洁的代码库。\n\
  \n## 最终检查与验证\n\n一旦数据清洗和转换步骤完成，下一个关键阶段就是验证。这一步确保数据集没有技术问题、逻辑一致，并准备好进行建模。跳过这一最后的检查会导致后续出现细微错误，这些错误可能只有在模型训练或评估期间才会显现。\n\
  \n验证有助于确认：\n\n*   数据集具有预期的行数和列数。\n*   数据类型分配正确。\n*   关键列包含有意义且平衡的值。\n*   没有意外的重复或不一致之处。\n\
  \n### 传统方法\n\n在典型的工作流中，开发者使用几个基本命令检查数据集。\n\n以下命令提供了数据集结构和内容的快速概览：\n\n```python\n\
  print(df.shape)\nprint(df.dtypes)\nprint(df.head())\n```\n\n这些输出提供了数据集结构、数据类型和示例记录的快速概览。虽然有用，但它们仅触及全面数据验证的冰角。\n\
  \n### AI 辅助\n\nAI 工具将这一过程更进了一步。在你输入代码时，GitHub Copilot 可以建议常用的检查函数，如 `.info()`、`.describe()`\
  \ 和 `.value_counts()`，帮助简化探索性数据分析。\n\nChatGPT 通过推荐检查项、解释其输出并建议更深层的验证技术来补充这一过程。\n\
  \n例如：\n\n```python\nprint(df.duplicated().sum())\nprint(df['Experience_Level'].value_counts())\n\
  ```\n\n这些命令有助于识别重复项并评估分类列中值的分布。在这一阶段检测不平衡对于监督学习任务尤为重要，因为偏斜的类别分布会偏差模型性能。\n\n为了使验证更加直观，ChatGPT\
  \ 可能会推荐可视化柱状图来检查分布。\n\n以下柱状图直观地显示了 'Experience_Level' 列中值的分布：\n\n```python\nimport\
  \ matplotlib.pyplot as plt\ndf['Experience_Level'].value_counts().plot(kind='bar')\n\
  plt.title(\"Distribution of Experience Levels\")\nplt.show()\n```\n\n此类视觉检查提供了数据结构的即时且清晰的视图，使得更容易检测到表格视图中可能被忽略的异常情况。\n\
  \n通过将传统的检查技术与智能 AI 支持相结合，开发者可以确保数据集是整洁、平衡并完全为成功的机器学习模型开发做好了充分准备。\n\n## 编写可重用的清洗函数\n\
