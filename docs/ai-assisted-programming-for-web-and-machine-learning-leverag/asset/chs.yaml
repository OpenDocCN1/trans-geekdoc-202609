  \n### 示例 2—建议代码片段\n\nGitHub Copilot 和 IntelliCode 等 AI 工具通过提供智能的、感知上下文的代码建议，完全改变了开发者的游戏规则。这些工具不再会中断你的工作流去网上搜索解决方案，而是分析你当前的代码，并在你需要的时候恰好提供你所需要的。\n\
