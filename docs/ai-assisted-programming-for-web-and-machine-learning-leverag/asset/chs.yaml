  \n## 无监督学习与聚类\n\n与从标记数据中学习的监督学习不同，无监督学习在没有预定义结果的情况下探索数据集。当目标是发现数据中隐藏模式、自然分组或底层结构时，这种方法特别有用。该领域最强大且应用广泛的技术之一就是聚类。\n\
  \n聚类根据数据的固有特征将相似的数据点分在一起，帮助简化复杂数据集并使其更具解释性。无论是根据购买行为对客户进行细分、检测网络流量中的异常值，还是根据主题对新闻文章分组，聚类都能让数据科学家在不需要标记输出的情况下得出有意义的结论。\n\
  \n本节讨论了流行的聚类方法，包括：\n\n* K-means 聚类：快速快速可扩展的算法，适用于寻找紧凑的球形聚类。\n* 层次聚类：构建聚类树以进行嵌套分组和树图（dendrogram）可视化。\n\
  * 基于密度的空间聚类（DBSCAN）：有效识别任意形状的聚类和噪声点。\n\n我们还强调了 GitHub Copilot 和 ChatGPT 等 AI 辅助编程工具如何显著增强聚类工作流。这些工具：\n\
  \n* 通过建议完整的代码块和参数调优策略来加速实现。\n* 通过预测常见的导入语句、初始化和绘图逻辑来减少模板代码和设置时间。\n* 通过解释聚类算法、何时使用它们以及如何解释结果来提高理解。\n\
  \n无论你是聚类领域的新手，还是在精炼真实的无监督学习流水线，本节都展示了自动化和 AI 引导支持如何提升你的方法，从更快的原型到更清晰的洞察。\n\n###\
  \ 实践中的 K-means 聚类\n\n无监督学习中最流行的聚类算法之一是 k-means。它通过根据相似性将数据划分为 k 个不同的簇，最小化每个组内部的方差。当数据集由分离良好的紧凑的聚类组成时，K-means\
  \ 特别有效。\n\n让我们通过一个员工数据集来看一个实际示例。在这个数据集中，我们根据薪资和经验对个人进行聚类。\n\n#### 传统方法\n\n以下是你如何使用\
  \ scikit-learn 实现 k-means，以及对聚类数据进行可视化：\n\n```python\nfrom sklearn.cluster import\
  \ KMeans\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\n# 根据薪资和经验聚类\n\
  X = df[['Salary', 'Experience']]\nkmeans = KMeans(n_clusters=3, random_state=42)\n\
  df['Cluster'] = kmeans.fit_predict(X)\nsns.scatterplot(x='Salary', y='Experience',\
  \ hue='Cluster', data=df, palette='Set2')\nplt.title(\"K-means Clustering of Employees\"\
  )\nplt.show()\n```\n\n这段代码将每个员工分配给三个簇之一，然后使用散点图显示个体如何根据所选的两个特征分组。\n\n#### AI 辅助\
  \ k-means 聚类\n\nGitHub Copilot 和 ChatGPT 可以通过以下方式简化并增强 k-means 聚类过程：\n\n* GitHub\
  \ Copilot：GitHub Copilot 通过智能预判常见模式并完成流水线的关键组件来加速聚类过程：\n    * 当你开始输入 `KMeans(` 时，Copilot\
  \ 会预判所需的参数，如 `n_clusters` 和 `random_state`。\n    * 它会自动补全 `.fit_predict()` 方法并建议将结果直接分配\
  \ DataFrame 中的新列。\n\n以下代码应用 KMeans 聚类并将聚类标签分配给 DataFrame：\n\n```python\n# Copilot\
  \ 自动建议分配聚类标签\ndf['Cluster'] = KMeans(n_clusters=3, random_state=42).fit_predict(df[['Salary',\
  \ 'Experience']])\n```\n\n这加速了编码并确保在实施过程中遵循最佳实践。\n\n* ChatGPT：ChatGPT 通过解释核心概念和引导优化参数选择来理解和决策：\n\
  \    * 提供关于 k-means 如何工作的概念清晰性，包括它对最小化簇内距离的依赖。\n    * 引导你基于惯性（inertia）使用肘部法（Elbow\
  \ Method）确定最佳聚类数量。\n\n以下代码使用肘部法帮助确定 KMeans 的最佳聚类数量：\n\n```python\nfrom sklearn.metrics\
  \ import silhouette_score\ninertias = []\n\nfor k in range(1, 10):\n    kmeans =\
  \ KMeans(n_clusters=k, random_state=42)\n    kmeans.fit(X)\n    inertias.append(kmeans.inertia_)\n\
  \nplt.plot(range(1, 10), inertias, marker='o')\nplt.title(\"Elbow Method for Optimal\
  \ k\")\nplt.xlabel(\"Number of Clusters\")\nplt.ylabel(\"Inertia\")\nplt.show()\n\
  ```\n\nChatGPT 洞察：最佳聚类数量通常位于“肘点”——即增加更多聚类会导致惯性的收益递减。在应用 k-means 之前，ChatGPT 通常建议运行肘部图以识别理想的聚类数量。这涉及在的一系列\
  \ k 值范围内计算模型并绘制惯性图表，以发现性能开始下降的点。\n\n通过将 Copilot 的速度与 ChatGPT 的分析深度相结合，开发者可以更轻松、更有信心地实现和调优\
  \ k-means 模型，从原始数据中产生清晰、可解释的分组。\n\n### 层次聚类与树图\n\n层次聚类是一种强大的无监督学习技术，它以自下而上（合并）或自上而（分裂）的方式构建聚类的层次结构。与\
  \ k-means 不同，它不需要你预先定义聚类的数量。相反，它使用树图可视化聚类的形成，使其更容易解释并根据相似性或距离决定在哪里切分树。\n\n虽然不需要预先确定固定聚类数量，但有方法可以帮助确定层次聚类中的最佳聚类数量。例如：\n\
  \n* 在视觉上识别树图中较大的垂直间隙。\n* 使用不一致性系数。\n* 事后应用诸如谱系相关系数或轮廓分析等指标。\n\n这种方法在探索嵌套关系或处理以解释性为优先考虑的中小型数据集时，这种方法特别有用。\n\
  \n#### 传统方法\n\n`scipy.cluster.hierarchy` 模块使得执行层次聚类和绘制树图变得简单。\n\n以下代码执行层次聚类并使用树图可视化结果：\n\
  \n```python\nfrom scipy.cluster.hierarchy import dendrogram, linkage\nimport matplotlib.pyplot\
  \ as plt\n\nlinked = linkage(X, method='ward')\ndendrogram(linked)\nplt.title(\"\
  Hierarchical Clustering Dendrogram\")\nplt.xlabel(\"Sample Index\")\nplt.ylabel(\"\
  Distance\")\nplt.show()\n```\n\n\n\n\n在本示例中，我们使用了 Ward 链接法（ward linkage method），该方法通过最小化类内方差，通常与欧式距离配合使用。树图展示了样本在不同阈值下是如何分组的，为确定理想聚类数量提供了一种可视化方法。\n\
  \n## AI 辅助\n\nGitHub Copilot 和 ChatGPT 可以显著简化层次聚类任务：\n\n- **GitHub Copilot**：GitHub\
  \ Copilot 通过检测意图并推荐常用的参数和函数来简化层次聚类：\n    - 根据你导入的包（`linkage`、`dendrogram`）识别层次聚类模式。\n\
  \    - 自动建议默认参数，如 `method='ward'`，它非常适用于紧凑的球形聚类。\n- **ChatGPT**：ChatGPT 通过解释不同的链接方法并帮助根据数据特征选择最合适的选项，提供了宝贵的概念指导：\n\
  \    - 通过解释链接方法以及如何如何在它们之间进行选择，提供更深层次的概念支持：\n        - `'ward'`：最小化类内方差；最适用于球形聚类。\n\
  \        - `'complete'`：使用点之间的最大距离；更适用于分离良好的聚类。\n        - `'average'`：计算跨类中所有点对之间的平均距离。\n\
  \n让我们来看一个例子：\n\n提示：在层次聚类中如何从 'ward' 和 'complete' 链接之间选择？\n\nChatGPT 洞察：当你寻找紧凑且相似的聚类时，请使用\
  \ `ward`。如果你的聚类更加规则且分离清晰，请选择 `complete`。\n\n通过将自动化与专家指导相结合，AI 工具让初接触该概念的人更容易尝试不同的链接方法、解释树图并自信地应用层次聚类。\n\
  \n## 基于密度的 DBSCAN 聚类\n\nDBSCAN 是一种强大的聚类算法，能够识别各种形状和大小的聚类，即使在嘈杂的数据集中也是如此。与 k-means\
  \ 不同，DBSCAN 不需要预先指定聚类的数量。相反，它将密集的数据点分为一组，并将其余标记为离群值。\n\n这使得 DBSCAN 在涉及非球形聚类、异常检测或空间数据分析的现实应用中有效。\n\
  \n| 注意：与层次聚类类似，DBSCAN 在没有固定 k 值的情况下确定聚类，但它使用 `eps`（邻域半径）和 `min_samples` 等参数来根据密度控制聚类的形成。\
  \ |\n\n通过依赖密度而非到质心或链接树的距离，DBSCAN 在模式不规则或数据包含噪声的情况下提供了更大的活性。\n\n## 传统方法\n\n在应用 DBSCAN\
  \ 之前，必须对特征进行归一化，使所有维度处于相似的尺度，特别是在使用基于距离的算法时。\n\n以下是使用 scikit-learn 的典型工作流：\n\n```python\n\
  from sklearn.cluster import DBSCAN\nfrom sklearn.preprocessing import StandardScaler\n\
  import seaborn as sns\nimport matplotlib.pyplot as plt\n\n# 归一化特征\nscaler = StandardScaler()\n\
  X_scaled = scaler.fit_transform(X)\n\n# 应用 DBSCAN\ndb = DBSCAN(eps=0.5, min_samples=3)\n\
  df['DBSCAN_Cluster'] = db.fit_predict(X_scaled)\n\n# 可视化类\nsns.scatterplot(x='Salary',\
  \ y='Experience', hue='DBSCAN_Cluster', data=df, palette='tab10')\nplt.title(\"\
  DBSCAN Clustering\")\nplt.show()\n```\n\n## AI 辅助\n\nGitHub Copilot 和 ChatGPT 等\
  \ AI 工具为 DBSCAN 提供支持：\n\n- **GitHub Copilot**：GitHub Copilot 通过检测意图并推荐常用的参数和函数来简化层次聚类：\n\
  \    - 根据你导入的包（`linkage`、`dendrogram`）识别层次聚类模式。\n    - 自动建议默认参数，如 `method='ward'`，它非常适用于紧凑的球形聚类。\n\
  - **ChatGPT**：ChatGPT 通过解释不同的链接方法并帮助根据数据特征选择最合适的选项，提供了宝贵的概念指导：\n    - 通过解释链接方法以及如何如何在它们之间进行选择，提供更深层次的概念支持：\n\
  \        - `'ward'`：最小化类内方差；最适用于球形聚类。\n        - `'complete'`：使用点之间的最大距离；更适用于分离良好的聚类。\n\
  \        - `'average'`：计算跨类中所有点对之间的平均距离。\n\n\n\n\n- 建议使用互补指标，如 `Davies-Bouldin Index`（`DBI`），以进行更全面的评估。\n\
  \n以下代码计算了 `Davies-Bouldin Index` 以补充聚类评估：\n\n```python\nfrom sklearn.metrics import\
  \ davies_bouldin_score\n\nprint(\"DBI:\", davies_bouldin_score(X, df['Cluster']))\n\
  ```\n\n| 提示：使用组合指标进行可靠的聚类评估——`Silhouette Score`（聚类内凝聚力）、`Davies-Bouldin Index`（聚类分离度）、`Gap\
  \ Statistic`（最佳聚类数量）以及如 `PCA` 图或树状图等可视化工具。这确保了分析更准确、更稳健。 |\n\n| --- |\n\n通过将统计指标与\
  \ AI 辅助解释及自动化相结合，开发者可以高效地评估聚类质量，并理解得分背后的原因，从而获得更优化的模型和更可靠的洞察。\n\n## 使用 PCA 在 2D\
  \ 中中聚类可视化\n\n在处理多维数据时，从视觉上解释聚类分离可能非常困难。这正是主成分分析（`PCA`）等降维技术发挥用场的地方。`PCA` 帮助将高维数据集压缩到\
  \ 2 或 3 维，同时尽可能保留原始方差，是可视化聚类结果的理想选择。\n\n通过将聚类投影到 2D 空间，我们可以评估组之间的分离程度，以及聚类方法是否捕到了数据中有意义的模式。\n\
  \n### 传统方法\n\n使用 `scikit-learn`，可以如下所示应用 `PCA`：\n\n```python\nfrom sklearn.decomposition\
  \ import PCA\n\npca = PCA(n_components=2)\n\nX_pca = pca.fit_transform(X_scaled)\n\
  \nsns.scatterplot(x=X_pca[:, 0], y=X_pca[:, 1], hue=df['Cluster'], palette='cool')\n\
  \nplt.title(\"PCA Projection of Clusters\")\nplt.xlabel(\"Principal Component 1\"\
  )\nplt.ylabel(\"Principal Component 2\")\nplt.show()\n```\n\n此代码将缩放后的数据 (`X_scaled`)\
  \ 还原到两个主成分，然后使用 `Seaborn` 绘制聚类图，用颜色代表不同的聚类标签。\n\n### AI 辅助\n\n`GitHub Copilot` 和\
  \ `ChatGPT` 在使用 `PCA` 可视化聚类结果方面都提供了价值支持：\n\n*   **GitHub Copilot**: `GitHub Copilot`\
  \ 通过检测 `PCA` 工作流并建议相关的绘图函数，简化了降维和可视化：\n    *   一旦输入 `PCA()` 即可识别 `PCA` 工作流并补全 `.fit_transform()`。\n\
  \    *   建议使用 `sns.scatterplot()` 进行后续可视化，利用主成分和聚类标签进行上色。\n*   **ChatGPT**: `ChatGPT`\
  \ 通过解释何时使用 `PCA` 而非其他技术，并强调减少高维数据对于有效聚类和可视化的重要性，深化了对降维的理解：\n    *   帮助开发者理解何时使用\
  \ `PCA` 以及它与其他降维技术的对比：\n        *   `PCA` 是线性的、快速且可解释的——是快速、通用投影的理想选择。\n       \
  \ *   `t-distributed Stochastic Neighbor Embedding`（`t-SNE`）是非线性的，更适合捕捉复杂关系，例如图像嵌入或文本向量。\n\
