  print(\"Centroids:\\n\", centroids)\n```\n\n| 备注：使用质心的坐标，根据收入和评分阈值分配有意义的标签，如“高价值客户”、“低消费者”或“偶尔购买者”。\
  \ |\n| --- |\n\n## 使用 AI 工具实现聚类技术\n\n聚类曾是一项耗时的过程，需要从数据探索、特征工程到算法选择、超参数调优以及可视化的手动设置。然而情况已经发生了。随着你\
