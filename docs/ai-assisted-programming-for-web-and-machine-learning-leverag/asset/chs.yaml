  \  - 如何安装：\n    ```bash\n    code --install-extension esbenp.prettier-vscode\n \
  \   ```\n\n### 通过高级自定义提升生产力\n\n通过定制开发环境以适应你的工作流来增强生产力；自动化代码格式化以保持一致性；优化终端设置以获得更流畅的导航；利用内置工具提高效率；以及组织项目设置以保持结构和清晰，确保无缝且专业的编码体验。\n\
  \n使用这些高级功能将你的生产力提升新层次：\n\n- 自动化代码格式化：使用 `Prettier`（针对 JavaScript/TypeScript）或 `Black`（针对\
  \ Python）自动执行编码标准，保持代码库的整洁一致。\n\n要启用保存时自动格式化，请向你的 `settings.json` 文件添加以下配置：\n\n\
  ```json\n{\n  \"editor.formatOnSave\": true,\n  \"prettier.singleQuote\": true,\n\
  \  \"prettier.trailingComma\": \"all\"\n}\n```\n\n`settings.json` 的位置：\n\n在 VS Code\
  \ 中打开并编辑你的 `settings.json` 文件：\n\n1. 按 `Ctrl+Shift+P`（Mac 上为 `Cmd+Shift+P`）打开 `Command\
  \ Palette`（命令面板）。\n2. 在搜索框中输入 `Preferences: Open Settings (JSON)`。\n3. 选择该项（按 `Enter`）打开\
  \ `settings.json` 文件。\n\n一旦添加，`Prettier` 将根据这些设置对你保存的每个文件自动应用一致的格式化：\n\n- 优化终端：通过\
  \ `File` | `Preferences` | `Settings` 并搜索 `Terminal` 来自定义你的终端。\n- 使用内置工具节省时间：`IntelliSense`\
  \ 提供智能代码建议，而 `Command Palette`（`Ctrl+Shift+P`）提供了快速访问命令。\n- 简化项目管理：将项目特定的设置存储在 `.vscode/settings.json`\
  \ 中，保持工作区的有序和一致。\n\n### 案例研究：VS Code 如何彻底改变 AI 团队的工作流\n\n想象一个数据科学家团队，渴望创新，但被重复性的编码、棘手的调试以及容器化\
  \ AI 模型复杂的部署过程所拖累。这些障碍会扼杀创意并减慢进度。但是，如果有一种方法可以简化他们的工作流并更快地实现他们的想法将会呢？\n\n解决方案：VS\
  \ Code 作为一个多功能、易用的平台，可以转变团队的工作。以下是它如何发挥作用的：\n\n- GitHub Copilot：接管枯燥和重复的编码任务（如编写数据预处理脚本），让团队专注于解决更重要的问题。\n\
  - Python 扩展：通过将所有内容整合到一个直观的界面中来简化调试，节省时间并减少挫败感。\n- Docker 扩展：使用于 AI 模型部署的容器管理变得无缝且高效，减少错误和延迟。\n\
  \n结果：结果显示，采用 VS Code 显著改进了开发工作流。\n\n表 2.1 展示了采用 VS Code 前后开发工作流是如何改进的：\n\n| 维度 |\
  \ 使用 VS Code 之前 | 引入 VS Code 之后 |\n| --- | --- | --- |\n| 代码编写 | 手动、耗时 | 通过 Copilot\
  \ 简化 |\n| 调试 | 需要多种工具 | 在 VS Code 内部统一 |\n| 部署 | 手动、易出错 | 通过 Docker 简化 |\n\n表 2.1：采用\
  \ VS Code 前后开发工作流的改进情况\n\n这种影响是不言而喻的：\n\n- 模板代码可以减少 40%。\n- 调试时间可能会减少 25%。\n- 部署时间可以下降\
  \ 30%。\n\n通过设置和个性化 VS Code，任何 AI 团队都将轻松应对挑战。该工具可以赋予团队探索新可能性、更快创新并在编码之旅中脱颖而出的能力。\n\
  \n### 开发者的新兴 AI 工具\n\n虽然 GitHub Copilot 和 ChatGPT 等工具主导了 AI 辅助编程，但新的工具（如 Cursor\
  \ 和 Windsurf）因其在提高生产力和提供感知辅助方面的独特关注，正在开发者社区中迅速流行。\n\n以下工具展示了 AI 如何演变为为开发者提供更智能、感知工作流的协助：\n\
  \n- Cursor：基于 VS Code 构建的现代代码编辑器，Cursor 无缝集成大语言模型，提供 AI 驱动的自动补全、行内代码编辑、文档查找上下文建议。与\
  \ Copilot 不同，Cursor 强调对话式界面，允许开发者直接在 IDE 中就代码库进行聊天。它支持基于自然语言的重构、错误修复和查询回答。\n- Windsurf：Windsurf\
  \ 是一种为数据科学家和机器学习工程师设计的 AI 原生 IDE。它将代码建议与智能环境管理、数据集探索和笔记本式交互相结合。其与云服务的紧密集成以及对实时协作的支持使其成为\
  \ AI/ML 工作流的理想选择。\n\n这些工具反映了向 AI 原生开发环境发展的日益趋势，这些环境超越了自动补全，提供了上下文理解、特定工作流自动化以及跨项目的智能推理。\n\
  \n## 使用 Jupyter Notebook 进行数据驱动项目\n\n\n\n\n\n想象在一个单一的交互平台上分析数百万条客户评论、预测能源消耗趋势或构建高级\
  \ AI 模型。Jupyter Notebook 让你能够轻松高效地实现这些目标。通过将代码执行、可视化和文档整合在一起，它已成为现代数据科学和 AI 工作流必不可少的工具。\n\
  \n## 安装 Jupyter Notebook\n\nJupyter Notebook 不仅仅是一个开发环境；它还是一个强大的工具，将编码、输出和解释集成到一个无缝界面中。以下是安装\
  \ Jupyter Notebook 的完整指南：\n\n1. 使用 `pip`（简单快速）：如果你的系统中已安装 Python，则适用于 `pip` 方法。步骤如下：\n\
  \n   a. 打开你的终端（命令提示符、PowerShell 或你操作系统的对应终端）。\n\n   b. 运行以下命令：\n\n```bash\npip install\
  \ notebook\n```\n\n   c. 安装完成后，输入以下命令启动 Jupyter Notebook：\n\n```bash\njupyter notebook\n\
  ```\n\n   d. 你的默认浏览器将在打开 `http://localhost:8888` 并打开 Jupyter Notebook。\n\n2. 使用\
  \ Anaconda（数据科学家的理想选择）：Anaconda 是一个强大的发行版，包含了 Python 以及许多流行的的数据科学和机器学习库，如 NumPy、Pandas\
  \ 和 Matplotlib。它还预装了 Jupyter Notebook。步骤如下：\n\n   a. 从 [`www.anaconda.com/`](https://www.anaconda.com/)\
  \ 下载并安装 Anaconda 发行版。\n\n   b. 安装过程中，勾选将 Anaconda 添加到系统 `PATH` 变量选项（推荐）。\n\n   c.\
  \ 安装完成后，你有两种方式启动 Jupyter Notebook：\n\n      i. 使用 Anaconda Navigator：打开 Anaconda\
  \ Navigator 应用并点击 Jupyter Notebook。\n\n      ii. 使用命令行：打开你的终端（Mac/Linux）或命令提示符（Windows）并输入：\n\
  \n```bash\njupyter notebook\n```\n\n   d. Jupyter Notebook 将在你的默认浏览器中启动。\n\n###\
  \ 关键点\n\n设置 Jupyter Notebook 的关键点如下：\n\n* 使用 `pip` 或 `conda` 添加库并创建虚拟环境，以组织你的 Python\
  \ 项目。\n* 如果你需要额外的库，可以通过 `pip` 或 Anaconda 的包管理器（`conda`）安装。\n* 考虑创建一个虚拟环境来隔离依赖项，以便进行更好的组织。\n\
  \n## 启动 Jupyter Notebook\n\n启动 Jupyter Notebook 非常简单，让你能够在网页浏览器中进行交互式笔记本工作，使编码、数据分析和协作变得异常简单。让我们来看以下步骤：\n\
  \n1. 打开你的终端或命令提示符：\n\n   a. Windows：打开命令提示符或 PowerShell。\n\n   b. macOS/Linux：打开你的终端。\n\
  \n2. 导航到项目文件所在的文件夹：\n\n   a. 使用更改目录 (`cd`) 命令移动到包含项目文件的文件夹。例如：\n\n```bash\ncd path/to/your/project/folder\n\
  ```\n\n   b. 将 `path/to/your/project/folder` 替换为你的目录路径。\n\n3. 如果你不确定文件夹路径：\n\n \
  \  a. Windows：右键点击文件夹并选择“复制为路径”。\n\n   b. macOS/Linux：在输入 `cd` 后，将文件夹拖入终端窗口。\n\n\
  4. 启动笔记本服务器：一旦进入正确的文件夹，输入以下命令启动 Jupyter Notebook：\n\n```bash\njupyter notebook\n\
  ```\n\n5. 访问 Jupyter Notebook：运行上述命令后，你的默认浏览器将自动打开 Jupyter Notebook 界面。\n\n如果没有自动，你将在终端中看到一个如下所示的链接：\n\
  \n`http://localhost:8888/?token=abcd1234`\n\n将此 URL 复制并粘贴到浏览器中。\n\n### 常见故障排除技巧\n\
  \n在使用 Jupyter Notebook 时遇到问题了吗？不要担心；这里有一些简单的提示可以解决常见问题，让你无无碍地回归工作：\n\n* 问题：`jupyter`:\
  \ 命令未找到\n  * 解决方案：确保已安装 Python 或 Anaconda 并将其添加到系统的 `PATH` 中。如有需要，重新安装 Jupyter Notebook。\n\
  * 问题：“内核未连接”（Kernel not connecting）\n  * 解决方案：检查你的 Python 环境并确保所有依赖项已安装。如有需要，使用\
  \ `pip install ipykernel`。\n\n### 高级设置\n\n想让你的 Jupyter Notebook 体验更进一步？这里有一些你可以尝试的高级选项（可选）：\n\
  \n* 在远程服务器上运行 Jupyter：这种设置对于高性能计算环境非常理想：\n\n```bash\njupyter notebook --no-browser\
  \ --port=8888\nssh -N -f -L localhost:8888:localhost:8888 user@remote_server\n```\n\
  \n* 用于高级项目的 JupyterLab：JupyterLab 提供了更灵活的基于标签的界面。\n\n### 自定义选项\n\n通过这些选项个性化你的 Jupyter\
  \ 体验：\n\n* 添加扩展以提高生产力：通过可折叠单元格等功能扩展 Jupyter：\n```bash\npip install jupyter_contrib_nb\n\
  ```\n* 更改主题以匹配风格：自定义你的界面：\n```bash\npip install themes\n```\n\n## 使用 AI 增强数据\n\n\
  Jupyter 就绪后，你可以集成强大的工具来分析数据：\n\n* Pandas profiling：生成详细的数据摘要。\n  * 安装它：\n```bash\n\
