  \ AI 助手进行了增强。\n\n### AI 辅助的数据摄取与准备\n\n每个 ML 项目都始于数据。原始数据无论是从 API、数据库还是 CSV 文件获取，必须经过清洗、转换和结构化以达到模型就。这个过程可能非常耗时，但\
  \ AI 工具可以显著加速这一过程。\n\n通过 ChatGPT，开发者可以在几秒内生成自定义预处理脚本。Copilot 使用 `pandas` 和 `TensorFlow`\
