  \ = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nmodel = BinaryClassifier(X_train.shape[1]).to(device)\n\
  criterion = nn.BCELoss()\noptimizer = optim.Adam(model.parameters(), lr=0.001)\n\
