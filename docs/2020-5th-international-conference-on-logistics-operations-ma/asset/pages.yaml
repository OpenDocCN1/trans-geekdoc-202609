    analytics would be benefiting the integration of machine learning. Optimization
    and simulation methods, methods to extract the full information to better support
    port under. The growing volume of trade has pushed port operations to adopt improving
    the efficiency [14]. The development of maritime logistics has been useful in
    monitoring and controlling operations. This development has led to the generation
    of data in terms of volume and unit cost analytics and optimization methods. These
    systems can help in limiting various important of operations.


    Today, Business industries helps drive their operational efficiency, and able
    to the benefit in solving complex problems. Data analysis and statistics constitute
    the main benefits of Business Intelligence [15]. Analytics are meant to find patterns
    and decisions using statistical analysis, forecasting, predictive modeling and
    optimization. Machine learning can boost the prediction in order to assist human
    decisions and operations. The technologies have been discussed in [16] as a future
    merging field and a single integrated system. They also acknowledged the importance
    of mixing analytics and operations for achieving positive results in real case
    applications.


    Through this SLR, we aim to contribute on the application of ML for port operations
    and determine further research directions that would help in understanding port
    system features and executing operations.


