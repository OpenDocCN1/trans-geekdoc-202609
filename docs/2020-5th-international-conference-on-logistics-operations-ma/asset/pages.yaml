    **Abstract—**In transportation, there is a need for Machine Learning (ML) to create
    intelligent solutions for many issues. In ports, there has been a long focus on
    optimization and simulation modeling, but ML still needed in building more complex
    decision systems for supports for port operations. To evaluate the ML application
    for port operations, we conducted this Systematic Literature Review (SLR) in order
    to select and analyze the relevant papers. This paper reports the analyzed protocol
    and highlights the gaps that could be addressed in future works.


    **Keywords—** machine learning, shipping, analytics, ports, systematic literature
    review


    # I. INTRODUCTION


    The application of Machine Learning (ML) techniques has revolutionized transportation
    systems [1]. Ports face various challenges due to increasing activity and complex
    processes. Ports as an international transport system is an example of case study
    offering attractive research opportunities by their complex network. In overcoming
    some issues related to port operations and underining the limitations that could
    be considered in future works.


    We conducted this Systematic Literature Review (SLR) according to the procedure
    adopted by Kitchenhem [2]. The proposed procedure is adopted to support the software
    engineering complexity and what we could support. The review will be carried out
    through three stages. The first step is planning, the second is execution and
    the last is reporting. The first step of planning includes the review objectives
    and defining a protocol. The SLR consists of searching and selecting papers according
    to the refined protocol. After extracting and synthesizing information, the last
    phase of the reporting will be communicating the results in various forms. The
    objective of this study is to provide a SLR to Machine Learning applications for
    port operations efficiency. The background is given in the next section. In section
    3 we describe the research methodology, and in section 4 we present the results.
    This work will draw conclusions.


    container terminals, have been abundant and several proposed relevant reviews
    in this field [13–12]. In addition to the widespread use of outdated modeling,
    simulation has been an important tool to develop more than 200 models for ports
