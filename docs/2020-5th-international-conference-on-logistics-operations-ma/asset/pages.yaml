    • Techniques: linear models, Neural Networks, Additive models, Methods, Trees,
    etc.

    • Cargo type: bulk, Ro-Ro, etc.

    • Port of study and region name.


    # C. Selection criteria:


    This is the final and first step to reach the most relevant studies, we need to
    sort out the papers by some criteria. The criteria we opted to include or exclude
    papers are:


    +   1) Inclusion criteria:


    +   • Studies with an impact of ML with an objective of bringing optimization
    within the port system. Here the port system is designed from anchorage to inland
    gates. In instance, choosing the inland transport (truck, train, etc.) is considered
    in scope.


    +   2) Exclusion criteria:


    +   • Studies without an impact on port system.


