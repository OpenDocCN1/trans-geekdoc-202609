    libraries: ASCE, IEEE Xplore, SAGE, and JSTOR. We used the search string (port
    OR HARBOR OR search OR wharf OR water AND ‘mining’ OR ‘statistical’ OR ‘machine
    learning’) to collect relevant literature. The results are presented in Table
    I, which the step was applying filters were chosen to close primary studies. In
    the third step we scanned the titles, keywords and abstracts if we needed to find
    the relevant studies in relation with the defined area of this SLR.


    # D. Study quality assessment.


    After filtering papers according to the criteria, we need to evaluate the quality.
    We planned to plan the papers considering their methodologies, if they justified
    the use of ML techniques or not, and we used Scimager for analysis, CORE for for.
    As we found more than three papers, we didn''t apply the quality assessment rules.


    # E. Data extraction


    Data extraction from the selected papers is an important step for the research
