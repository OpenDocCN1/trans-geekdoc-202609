    # A. Research Questions:


    In purpose of our objective, we formulated the research questions in order to
    determine the studies'', research focus and outcomes, the ML techniques and techniques
    as well as data sources, their geographical focus and the type of terminals they
    addressed. The research questions formulated as follows:


    +   • RQ1. What are the sources and the selected studies and how many of publications
    were excluded over time?


    +   • RQ2. What are the researched areas and topics?


    +   • RQ3. What are the performed ML techniques, and data sources?


    +   • RQ4. What are the studied geographic areas and type of terminals?


    Regarding RQ1, we identified the papers of our research, the electronic libraries
    they were extracted from and journals they were published. To answer RQ2, we proposed
    a classification of research areas and sub fields. With regards to RQ3, if we
    identified the problem formed by classification, regression, or reinforcement
    learning, then we registered the techniques and the sources of data. For RQ4,
    we used the studied port and the type of ships and terminals.


