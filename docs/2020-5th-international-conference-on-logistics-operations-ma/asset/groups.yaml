    **Abstract—**In transportation, there is a need for Machine Learning (ML) to create
    intelligent solutions for many issues. In ports, there has been a long focus on
    optimization and simulation modeling, but ML still needed in building more complex
    decision systems for supports for port operations. To evaluate the ML application
