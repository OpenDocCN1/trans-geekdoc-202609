    # C. Studies'' classification for ML tasks and techniques, and data sources:


    Different formulations were proposed, 10 papers treated classification problems,
    17 papers used reinforcement learning, and 4 paper dealt with unsupervised learning.
    Among techniques, artificial neural networks (ANN) are followed by them employed,
    such as Decision Trees (DT), Linear Regression (LR) and Support Vector Machines
    (SVM). Some works used the rest of the methods: heuristic search for models parameters
    settings ([31], [38], [41], [44]), such as particle swarm optimization, annealing,
    and genetic algorithms. Hence, future studies should consider how to build models
    for heterogeneous data, many sources used. Terminal operation was the most employed,
    also data from port operators as service providers, port authorities or companies.
    From a ship tracking system, known as the Automatic Identification System, were
    also in some models [22]


    # V. CONCLUSION


    In this SLR of ML applications for port operations, presented papers that were
    selected according to a specific methodology to sieve the different operations
    to keep perfect papers. After synthesis and having obtained the results, we can
    say that this review deals mainly with port operations. Only 30 papers were identified
    as review, where we can find hundreds of optimization and simulation models and
    many relevant reviews in this field. Hence, we need more works in ML applications
    for various scenarios such as inland transport, maritime transport, port planning
    and development & safety. From point of view, the used techniques could be improved
    using some methods of defining models parameters as heuristic search algorithms.
    Also, the terminal techniques used are compared with other of seaports. Therefore,
    future works should consider other terminal and ship types as bulk terminals where
    uncertainties are magnified. For instance, the study on bulk shipments from high
    frequency led to results over such last times, vessel''s stability, and vessel''s
    availability. Also, the operators in containers are standardized and might differ
    slightly from one to other in bulk terminals different depending on the type of
    cargo and different strategies. We highlight the need of working on other geographic
    areas.


