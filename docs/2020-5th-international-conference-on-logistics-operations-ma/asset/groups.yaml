    拉巴特穆罕默德五大学

    摩洛哥拉巴特

    berrado@dei.cmi.ma


    **摘要—**在交通运输领域，需要通过机器学习（ML）为许多问题创建智能解决方案。在港口领域，长期以来一直关注于优化和仿真建模，但在构建支持港口作业的更复杂的决策系统方面，仍需要机器学习。为了评估机器学习在港口作业中的应用，我们开展了这项系统性文献综述（SLR），以筛选和分析相关论文。本文报告了分析的方案，并强调了未来工作中可以解决的空白。


    **关键词—** 机器学习，航运，分析，港口，系统性文献综述


    # I. 引言


    机器学习（ML）技术的应用彻底改变了交通运输系统 [1]。由于活动增加和流程复杂，港口面临着各种挑战。港口作为国际运输系统，其复杂的网络是一个提供具有吸引力的研究机会的案例研究。在解决某些与港口作业相关的问题并并了未来工作中可以考虑的局限性。


    我们根据 Kitchenhem [2] 采用get开展了这项系统性文献综述（SLR）。所提出的程序旨在支持软件工程的复杂性以及我们提供的支持。综述将通过三个阶段进行：第一步是规划，第二步是执行，最后是报告。规划的第一步包括确定综述目标和定义方案。SLR
    包含根据完善后的方案搜索和选择论文。在提取和综合信息后，报告的最后阶段将以各种形式交流结果。本研究的目标是为港口作业效率的机器学习应用提供系统性文献综述。背景将在下一节给出。在第3节中描述了研究方法，在第4节中展示了结果。本文将得出结论。


    集装箱码头非常丰富，且在该领域已提出了若干相关的综述 [13–12]。除了广泛使用过时的建模外，仿真已成为为港口和集装箱码头开发20多个模型的重要工具 [13]。现有文献在许多方面存在问题，从资源分配和调度到港口作业，包括调度、物流等许多。优化和仿真模型、数据驱动方法有助于分析变量对港口性能的影响，机器学习分析将有利于机器学习的整合。优化和仿真方法、提取完整信息以更好地支持港口理解的方法。贸易量的日益增长使港口作业采取提高效率措施
    [14]。海洋物流的发展在监控和控制作业方面有用。这种发展导致了体量和单位成本分析以及优化方法的数据产生。这些系统可以帮助限制作业的各种方面。


    今天，商业行业有助于推动其运营效率，并能够从解决复杂问题。数据分析和统计构成了商业智能的主要优势 [15]。分析旨在通过统计分析、预测、预测建模和优化来发现模式并做出决策。机器学习可以增强预测以辅助人类决策和操作。这些技术在
    [16] 中被讨论为未来的融合领域和单一集成系统。他们还承认了将分析与运营相结合以在实际应用中取得积极结果的重要性。


    通过这项 SLR，我们旨在对机器学习在港口作业中的应用做出贡献，并确定有助于理解港口系统特征和执行操作的进一步研究方向。


    # II. 背景


    今天，需要能够协助港口作业日常工作的智能系统。为此，运营在解决港口问题中的应用可能地……


    # III. 综述


    关于机器学习技术应用于港口作业的最后综述是开展这项工作的主要动力。因此，本综述的目标是通过收集和评估相关研究，提供现有工作之间的比较。下文，我们描述了所遵循的方法：首先，我们所有的研究问题，然后我们遵循搜索过程来识别主要研究，之后，我们通过应用筛选标准仅保留相关工作并……


