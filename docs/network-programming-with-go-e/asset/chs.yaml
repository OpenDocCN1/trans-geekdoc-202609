  `flashcards.ListFlashCards()` 遍历闪卡目录，返回一个字符串数组：\n\n```go\nfunc ListFlashCards()\
  \ []string {\n\tflashcardsDir, err := os.Open(\"flashcardSets\")\n\tif err != nil\
  \ {\n\t\treturn nil\n\t}\n\tfiles, err := flashcardsDir.Readdir(-1)\n\tfileNames\
  \ := make([]string, len(files))\n\tfor n, f := range files {\n\t\tfileNames[n] =\
  \ f.Name()\n\t}\n\tsort.Strings(fileNames)\n\treturn fileNames\n}\n```\n\n### manageFlashCards\
  \ 函数\n\n`manageFlashCards` 函数用于处理点击“显示一组卡片”或“列出一组单词”按钮时的表单提交。它从表单请求中提取值并在 `showFlashCards`\
  \ 和 `listWords` 之间切换：\n\n```go\nfunc manageFlashCards(rw http.ResponseWriter, req\
  \ \\*http.Request) {\n\tset := req.FormValue(\"flashcardSets\")\n\torder := req.FormValue(\"\
  order\")\n\taction := req.FormValue(\"submit\")\n\thalf := req.FormValue(\"half\"\
  )\n\tcardname := \"flashcardSets/\" + set\n\tfmt.Println(\"cardname\", cardname,\
  \ \"action\", action)\n}\n```\n\n\n\n\n```\nif action == \"Show cards in set\" {\n\
  \    showFlashCards(rw, cardname, order, half)\n} else if action == \"List words\
  \ in set\" {\n    listWords(rw, cardname)\n}\n}\n```\n\n# 中文字典\n\n之前的代码是相当通用的：它使用\
  \ `FileServer` 交付静态文件，根据目录下的文件列表使用模板创建 HTML 表格，并处理来自 HTML 表单的信息。为了通过查看每个卡片显示的内容来继续进行，我们必须进入特定的应用程序细节，这意味着要查看词汇的来源（字典）、如何表示词和卡片，以及如何将闪词卡数据发送到浏览器。首先是字典。\n\
  \n中文是一种复杂的语言——它们不都是这样吗：-(。它的书写形式是象形的，即“象意字”，而不是使用字母。但这种书写形式随着时间的推移演变成了，最近甚至变成了两种形式：台湾和香港使用的“繁体”中文以及中国大陆使用的“简体”中文。虽然大多数字是相同的，但有大约\
  \ 1,000 字是不同的。因此，中文字典通常会有同一个字的两种书写形式。\n\n大多数像我这样的西方人无法理解这些字。所以有一种被称为 `Pinyin` 的“拉丁化”形式，它基于拉丁字母使用音标字母编写这些字。它并不是真正的拉丁字母，因为中文是一种声调语言，而拼音形式必须显示声调（非常像法语和其他欧洲语言中的重音）。因此，一本典型的字典必须显示四样内容：繁体形式、简体形式、`Pinyin`\
  \ 和英语。此外（就像英语一样），一个词可能有 181 种多种含义。例如，在 `http://www.mandarintools.com/worddict.html`\
  \ 有一个免费的中汉字典，更好的是，你可以将其下载为 UTF-8 文件。在其中，单词 `好` 有如下条目：\n\n| 繁体 | 简体 | 拼音 | 英语 | 含义\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 好 | 好 | hǎo | good | /good/well/proper/good\
  \ to/easy to/very/so/(表示完成或就绪的后缀)/ |\n\n这个字典里有一点小复杂性。大多数键盘都不擅长表示音符号，如 `ǎ` 中的变音符号。虽然中汉字是用\
  \ Unicode 编写的，但拼音字符不是。虽然有像 `ǎ` 这样的字母的 Unicode 字符，但包括本文在内的许多字典使用拉丁字母 `a` 并声调放在单词末尾。这里是第三声，所以\
  \ `hǎo` 被写为 `hao3`。这使得那些只有美国标准键盘且没有 Unicode 编辑器的人仍然可以使用拼音进行交流。\n\nWeb 服务器使用的字典副本是\
  \ `cedict_ts_u8`。\n\n这种数据格式的不匹配并不是大问题。只是在某个某个环节，在原始文本字典和浏览器的显示之间，必须进行一次数据清洗（data\
  \ massage）。Go 模板允许通过定义自定义模板来完成这一点，所以我选择了这条路线。替代方法包括在读取字典时进行此操作，或者在 JavaScript 中显示最终字符。\n\
  \n## 字典类型\n\n我们使用一个 `Entry` 来存储关于一个单词的基本信息：\n\n```go\ntype Entry struct {\n    Traditional\
  \ string\n    Simplified string\n    Pinyin     string\n    Translations []string\n\
  }\n```\n\n上面的单词将由以下内容表示：\n\n```go\nEntry{\n    Traditional: \"好\",\n    Simplified:\
  \ \"好\",\n    Pinyin: \"hao3\",\n    Translations: []string{\"good\", \"well\",\
  \ \"proper\", \"good to\", \"easy to\", \"very\", \"so\", \"(表示完成或就绪的后缀)\"},\n}\n\
  ```\n\n字典本身就是这些条目的数组：\n\n```go\ntype Dictionary struct {\n    Entries []*Entry\n\
  }\n```\n\n## 闪词卡集\n\n单个闪词卡旨在表示一个中文单词和该单词的英语翻译。我们已经看到，一个中文单词可能有许多可能的英语含义。但这个字典有时也有一个中文单词的多次出现。例如，`好`\
  \ 至少出现两次，一次带有我们已经看到的含义，也带有另一个含义，“喜欢”。事实证明这是多余的，但为了允许这种情况，每张闪词卡都赋予了一个完整的单词词典。通常字典中只有一个条目！闪词卡的其余部分只是简体和英语单词，作为可能的键：\n\
  \n```go\ntype FlashCard struct {\n    Simplified string\n    English    string\n\
  \    Dictionary *dictionary.Dictionary\n}\n```\n\n闪词卡的*set* 是这些内容的数组，加上集合名称，以及将发送到浏览器用于展示集合的信息：随机或固定顺序，先显示每张卡的顶部或底部，或随机。\n\
  \n```go\ntype FlashCards struct {\n    Name      string\n    CardOrder string\n\
  \    ShowHalf  string\n    Cards     []*FlashCard\n}\n```\n\n我们已经为这种类型展示了一个函数，`ListFlashCardsNames()`。这种类型还有另一个感兴趣的函数用于加载闪词卡集的\
  \ JSON 文件。这使用了第 4 章的技巧，序列化。\n\n```go\nfunc LoadJSON(fileName string, key interface{})\
  \ {\n    inFile, err := os.Open(fileName)\n    checkError(err)\n    decoder := json.NewDecoder(inFile)\n\
  \    err = decoder.Decode(key)\n    checkError(err)\n    inFile.Close()\n}\n```\n\
  \n一个典型的闪词卡集是常用词。当 JSON 文件被 Python 美化打印（`print json.dump(string, indent=4, separators=(',',\
  \ ':'))`）时，它的部分看起来如下：\n\n```json\n{\n    \"ShowHalf\": \"\",\n    \"Cards\": [\n\
  \        {\n            \"Simplified\": \"\\u4f60\\u597d\",\n            \"Dictionary\"\
  : {\n                \"Entries\": [\n                    {\n                   \
  \ \"Traditional\": \"\\u4f60\\u597d\",\n                    \"Pinyin\": \"ni3 hao3\"\
  ,\n                    \"Translations\": [\n                        \"hello\",\n\
  \                        \"hi\",\n                        \"how are you?\"\n   \
  \                 ],\n                    \"Simplified\": \"\\u4f60\\u597d\"\n \
  \                   }\n                ]\n            },\n            \"English\"\
  : \"hello\"\n        },\n        {\n            \"Simplified\": \"\\u5582\",\n \
  \           \"Dictionary\": {\n                \"Entries\": [\n                \
  \    {\n                        \"Traditional\": \"\\u5582\",\n                \
  \        \"Pinyin\": \"wei4\",\n                        \"Translations\": [\n  \
  \                          \"hello (interj)\",\n                            \"hey\"\
  ,\n                            \"to feed (sb)\"\n                        ],\n  \
  \                      \"Simplified\": \"\\u5582\"\n                    }\n    \
  \            ]\n            },\n            \"English\": \"hello (interj)\"\n  \
  \      }\n    ],\n    \"CardOrder\": \"\",\n    \"Name\": \"Common Words\"\n}\n\
  ```\n\n## 修复音符号\n\n在我们可以完成服务器代码之前，最后一项任务是音符号。字典中的声调将符号放在单词末尾，如 `hao3` 对应 `好`。到 Unicode\
  \ 的转换可以通过自定义模板完成，正如第 9 章讨论的。\n\n拼音格式化代码在这里。除非你*真的*感兴趣知道拼音格式化的规则，否则不要读它。程序是 `PinyinFormatter.go`:\n\
  \n```go\npackage templatefuncs\n\nimport (\n    \"fmt\"\n    \"strings\"\n)\n\n\
  func PinyinFormatter(args ...interface{}) string {\n    ok := false\n    var s string\n\
  \    if len(args) == 1 {\n        s, ok = args[0].(string)\n    }\n    if !ok {\n\
  \        s = fmt.Sprint(args...)\n    }\n    fmt.Println(\"Formatting func \" +\
  \ s)\n    // 字符串可能由多个拼音单词组成\n    // 每个都需要更改并// 重新组合\n    words := strings.Fields(s)\n\
  \    for n, word := range words {\n        // 将 \"u:\" 转换为 \"ü\" 如果存在\n        uColon\
  \ := strings.Index(word, \"u:\")\n        if uColon != -1 {\n            parts :=\
  \ strings.SplitN(word, \"u:\", 2)\n            word = parts[0] + \"ü\" + parts[1]\n\
  \        }\n        println(word)\n        // 获取最后一个字符，如果存在则是声调\n        chars :=\
  \ []rune(word)\n        tone := chars[len(chars)-1]\n        if tone == '5' {\n\
  \            // 5 声没有声调\n            words[n] = string(chars[0 : len(chars)-1])\n\
  \            println(\"lost accent on\", words[n])\n            continue\n     \
  \   }\n        if tone < '1' || tone > '4' {\n            // 不是声调值\n           \
  \ continue\n        }\n        words[n] = addAccent(word, int(tone))\n    }\n  \
  \  s = strings.Join(words, \" \")\n    return s\n}\n\nvar (\n    // 将 'a1' 映射到 '\\\
  u0101' 等\n    aAccent = map[int]rune{\n        '1': '\\u0101',\n        '2': '\\\
  u00e1',\n        '3': '\\u01ce',\n        '4': '\\u00e0'}\n```\n\n\n\n\n\n```go\n\
  eAccent = map[int]rune{\n    '1': '\\u0113',\n    185,\n    '2': '\\u00e9',\n  \
  \  '3': '\\u011b',\n    '4': '\\u00e8',\n}\niAccent = map[int]rune{\n    '1': '\\\
  u012b',\n    '2': '\\u00ed',\n    '3': '\\u01d0',\n    '4': '\\u00ec',\n}\noAccent\
  \ = map[int]rune{\n    '1': '\\u014d',\n    '2': '\\u00f3',\n    '3': '\\u01d2',\n\
  \    '4': '\\u00f2',\n}\nuAccent = map[int]rune{\n    '1': '\\u016b',\n    '2':\
  \ '\\u00fa',\n    '3': '\\u01d4',\n    '4': '\\u00f9',\n}\nüAccent = map[int]rune{\n\
  \    '1': 'ǖ',\n    '2': 'ǘ',\n    '3': 'ǚ',\n    '4': 'ǜ',\n}\n)\n\nfunc addAccent(word\
  \ string, tone int) string {\n    /*\n     * 基于“声调标记放在哪里？”\n     * 地址 http://www.pinyin.info/rules/where.html\n\
  \     */\n    n := strings.Index(word, \"a\")\n    if n != -1 {\n        aAcc :=\
  \ aAccent[tone]\n        // 将 'a' 替换为带有声调的版本\n        word = word[0:n] + string(aAcc)\
  \ + word[(n+1):len(word)-1]\n    } else {\n        n := strings.Index(word, \"e\"\
  )\n        if n != -1 {\n            eAcc := eAccent[tone]\n            word = word[0:n]\
  \ + string(eAcc) + word[(n+1):len(word)-1]\n        } else {\n            n := strings.Index(word,\
  \ \"ou\")\n            if n != -1 {\n                oAcc := oAccent[tone]\n   \
  \             word = word[0:n] + string(oAcc) + \"u\" + word[(n+2):len(word)-1]\n\
  \            } else {\n                chars := []rune(word)\n                length\
  \ := len(chars)\n                // 将声调放在最后一个元音上\n                L:\n         \
  \       for n, _ := range chars {\n                    m := length - n - 1\n   \
  \                 switch chars[m] {\n                    case 'i':\n           \
  \             chars[m] = iAccent[tone]\n                        break L\n      \
  \              case 'o':\n                        chars[m] = oAccent[tone]\n   \
  \                     break L\n                    case 'u':\n                 \
  \       chars[m] = uAccent[tone]\n                        break L\n            \
  \        case 'ü':\n                        chars[m] = üAccent[tone]\n         \
  \               break L\n                    default:\n                    }\n \
  \               }\n                word = string(chars[0 : len(chars)-1])\n    \
  \        }\n        }\n    }\n    return word\n}\n```\n\n### ListWords 函数\n\n我们现在回到服务器的优秀函数。其中一个就是列出单词卡集中的所有单词。\n\
  \n该函数使用单词卡集的模板来填充一个 HTML 表格。此 HTML 使用 `template` 程序包来遍历 `FlashCards` 结构体并插入其字段：\n\
  \n```html\n<html>\n<head>\n    <title>{{.Name}} 单词</title>\n</head>\n<body>\n  \
  \  <h1>{{.Name}} 单词</h1>\n    <p>\n        <table border=\"1\" class=\"sortable\"\
  >\n            <tr>\n                <th>英语</th>\n                <th>拼音</th>\n\
  \                <th>繁体中文</th>\n                <th>简体</th>\n            </tr>\n\
  \            {{range .Cards}}\n            <div class=\"card\">\n              \
  \  <tr>\n                    <div class=\"english\">\n                        <div\
  \ class=\"vcenter\">\n                            <td>{{.English}}</td>\n      \
  \                  </div>\n                    </div>\n                    {{with\
  \ .Dictionary}}\n                        {{range .Entries}}\n                  \
  \          <div class=\"pinyin\">\n                                <div class=\"\
  vcenter\">\n                                    <td>{{.Pinyin|pinyin}}</td>\n  \
  \                              </div>\n                            </div>\n    \
  \                        <div class=\"traditional\">\n                         \
  \       <div class=\"vcenter\">\n                                    <td>{{.Traditional}}</td>\n\
  \                                </div>\n                            </div>\n  \
  \                          <div class=\"simplified\">\n                        \
  \        <div class=\"vcenter\">\n                                    <td>{{.Simplified}}</td>\n\
  \                                </div>\n                            </div>\n  \
  \                      {{end}}\n                    {{end}}\n                </tr>\n\
  \            </div>\n            {{end}}\n        </table>\n    </p>\n    <p class=\"\
  return\">\n        <a href=\"flashcards.html\">返回单词卡列表</a>\n    </p>\n</body>\n\
  </html>\n```\n\n`Server.go` 中的 Go 函数 `listWords` 使用了上一节讨论过的 `PinyinFormatter`：\n\
  \n```go\nfunc listWords(rw http.ResponseWriter, cardname string) {\n    cards :=\
  \ new(flashcards.FlashCards)\n    flashcards.LoadJSON(cardname, cards)\n    fmt.Println(\"\
  Card name\", cards.Name)\n    t := template.New(\"ListWords.html\")\n    t = t.Funcs(template.FuncMap{\"\
  pinyin\": templatefuncs.PinyinFormatter})\n    t, err := t.ParseFiles(\"html/ListWords.html\"\
  )\n    if err != nil {\n        fmt.Println(\"Parse error \" + err.Error())\n  \
  \      http.Error(rw, err.Error(), http.StatusInternalServerError)\n        return\n\
  \    }\n    err = t.Execute(rw, cards)\n    if err != nil {\n        fmt.Println(\"\
  Execute error \" + err.Error())\n        http.Error(rw, err.Error(), http.StatusInternalServerError)\n\
  \        return\n    }\n}\n```\n\n这将填充后的表格发送到浏览器，如图 10-4 所示。\n\n### showFlashCards\
  \ 函数\n\n完成服务器的最后一个函数是 `showFlashCards`。它根据浏览器提交的表单修改单词卡集中 `CardOrder` 和 `ShowHalf`\
  \ 的默认值。然后应用 `PinyinFormatter` 并生成的文档发送到浏览器。我使用 UNIX 命令 `script` 捕获了会话输出并运行了该命令：\n\
  \n```\nGET /flashcardSets?flashcardSets=Common+Words&order=Random&half=Chinese&submit=Show+cards+in+set\
  \ HTTP/1.0\n```\n\n结果如下：\n\n```html\n<html>\n<head>\n    <title>{{.Name}} 单词</title>\n\
