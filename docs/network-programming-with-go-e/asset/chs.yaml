  \n# 里森成熟度模型\n\n许多系统自称是 RESTful 的。大多数并非如此。我甚至遇到过一个声称 SOAP 是 RESTful 的，这是一个典型的扭曲心理状态。Martin\
  \ Fowler 讨论了里森成熟度模型，该模型根据对 REST 的遵循情况进行分类。\n\n## 0 级\n\n该模型的起点是将 HTTP 作为远程交互的传输系统，但没有使用任何网络机制。本质上，你在这里所做的是\
  \ HTTP 作为你自己的交互机制的隧道机制，通常基于远程过程调用。\n\n## 1 级：资源\n\n迈向 REST 之光的第一步是引入资源。因此现在我们不再向单一的服务端点发送所有请求，而是开始与单个资源交互。\n\
  \n## 2 级：HTTP 动词\n\n我在 0 级和 1 级中使用了 HTTP `POST` 动词进行所有的交互，但有些人也使用 `GET` 代替或补充。在这些级别上，它们区别不大，它们都是被用作隧道机制，允许你通过\
  \ HTTP 隧道你的交互。2 级背离了这种做法，尽可能地接近 HTTP 动词在 HTTP 本身中的方式。\n\n## 3 级：超媒体控制\n\n最后一个级别引入了你经常听到的难听缩写\
  \ HATEOAS（超文本作为应用程序状态的引擎）。它解决了如何从可用空位列表获取需要的操作以完成预约的问题。\n\n# 复习闪卡\n\n\n\n\n\n在第\
  \ [10 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_10) 章中，我们考虑了一个由服务器和在浏览器中渲染的\
  \ HTML 页面组成的 Web 系统，使用 JavaScript 和 CSS 控制浏览器端的交互。当时并没有尝试任何特殊的结构化设计，而是将其视为传统的 Web\
  \ 系统。\n\n**回顾** 第 [10 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_10) 章的 Web\
  \ 系统用于演示使用所谓的闪卡进行语言学习。用户一次看到一组卡片，显示一种语言的单词，然后尝试记住翻译，翻译将通过“翻转”卡片来显示。系统展示了不同的卡片组列表，然后在选定的组中逐个显示卡片。\n\
  \n现在我们处理相同的情况，但使用的是 REST 方法构建的 HTTP 客户端-服务器系统。我们将进行一些更改：\n\n-   将根据情况给出适当的 URL。这些包括“根”\
  \ URL `/`，以及每个闪卡组的 URL，此外还有每个闪卡的 URL。\n-   省略了所有用户交互代码（HTML、JavaScript 和 CSS）。服务器将与任意的用户代理通信，许多代理可能不会理解\
  \ UI 代码。\n-   服务器将不再维护或管理任何客户端状态。在 Web 示例中，表单数据是从浏览器发送到服务器的，服务器会以略有不同的形式返回。想要维护状态的客户端应该自己这样做。\n\
  -   服务器将配置为管理多种不同的序列化格式，并在客户端-服务器协商后交付适当的内容。\n-   将大量使用 HTTP 机制，特别是在错误处理和内容协商方面。\n\
  \n## URLs\n\n该系统的 URL 以及可以执行的操作如下：\n\n| URL | 动作 | 效果 |\n| :--- | :--- | :--- |\n\
  | `/` | `GET` | 获取闪卡组列表 |\n| `/` | `POST` | 创建一个新的闪卡组 |\n| `/flashcardSets/<set>`\
  \ | `GET` | 获取该组中的卡片列表 |\n| `/flashcardSets/<set>` | `POST` | 为该组创建新卡片 |\n| `/flashcardSets/<set>`\
  \ | `DELETE` | 如果为空则删除该闪卡组 |\n| `/flashcardSets/<set>/<card>` | `GET` | 获取卡片内容 |\n\
  | `/flashcardSets/<set>/<card>` | `DELETE` | 从组中删除该卡片 |\n\n这与第 [10 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_10)\
  \ 中描述的系统略有不同。主要的结构差异是每个卡片作为闪卡组的成员都有其自己的 URL。\n\n服务器将处理的示例 URL 包括：\n\n| 根 URL | 闪卡组的\
  \ URL | 单张卡片的 URL |\n| :--- | :--- | :--- |\n| `/` | `/flashcardSet/CommonWords`\
  \ | `/flashcardSet/CommonWords/你好` |\n\n## 分复用器 (Demuxer)\n\nREST 基于应用于 URL 的少数操作。尝试使用\
  \ REST 原则的系统必须是基于 URL 的。\n\n服务器分复用器会检查客户端请求的 URL，并根据 URL 模式调用处理器。\n\n标准的 Go 分复用器\
  \ `ServeMux` 使用特定的模式匹配机制：如果 URL 以 `/` 结尾，则它表示以该 URL 为根的 URL 子树；如果不以 `/` 结尾，则它仅代表该\
  \ URL。URL 将与最长模式匹配的处理器匹配。\n\n我们需要一个用于根 URL `/` 的处理器。它也会匹配任何如 `/passwords` 的 URL，除非有其他处理器捕获它。在这个系统中，没有其他处理器会这样做，因此在\
  \ `/` 的处理器中，我们需要对此类尝试返回错误。\n\n棘手的部分在于我们对 URL 使用了层级结构。一个特定的闪卡组将是 `/flashcardSets/CommonWords`。这实际上是该特定组卡片的目录。\n\
  \n我们必须注册*两个*处理器：一个用于 URL `/flashcardSets/CommonWords`（即闪卡组资源），另一个用于 `/flashcardSets/CommonWords/`（注意末尾的\
  \ `/`），它是包含单个卡片及其 URL 的子树。\n\n在 `main` 函数中注册这些处理器的代码如下：\n\n```go\nhttp.HandleFunc(\"\
  /\", handleFlashCardSets)\n\nfiles, err := ioutil.ReadDir(\"flashcardSets\")\ncheckError(err)\n\
  \nfor _, file := range files {\n    cardset_url := `/flashcardSets/` + url.QueryEscape(file.Name())\n\
  \    http.HandleFunc(cardset_url, handleOneFlashCardSet)\n    http.HandleFunc(cardset_url\
  \ + \"/\", handleOneFlashCard)\n}\n```\n\n注意我们使用了函数 `QueryEscape`。这是为了转 URL 中可能出现的任何特殊字符。例如，文件名中的\
  \ `$` 应该被编码为 `%44`。我们*确实*需要使用这样的函数：我们的 URL 将包含中文字符，这些需要转义编码以表示在 URL 中。这是通过 `QueryEscape`\
  \ 完成的，但有一个例外：路径中的空格应该编码为 `%20`，但在表单数据中应编码为 `+`。`PathEscape` 函数可以正确处理这一点，但直到 Go 1.8\
  \ 版本后才可用。我们将从 URL 中移除空格以避免这个问题。\n\n## 内容协商\n\n任何 Web 用户代理都可以尝试与任何 Web 服务器通信。浏览器与\
  \ HTML 服务器通信的典型情况是我们在 Web 上熟悉的，但许多人可能熟悉使用其他用户代理，如 `curl`、`wget` 甚至 `telnet`！浏览器和其他工具将使用\
  \ HTTP 响应中的 `Content-Type` 来确定如何对提供的内容进行处理。\n\n对于 Web 应用程序，用户代理必须能够理解服务器交付了什么，因为它正试图参与一个可能没有用户帮助的交互。RPC\
  \ 系统通常使用客户端和服务器均遵循的外部规范。这里并非如此。\n\n解决方案是双方对内容格式达成一致。这是在 HTTP 层级完成的。客户端将声明它接受某个范围的格式。如果服务器同意，它们就继续。如果不同，服务器将告诉客户端它可以接受哪些格式，如果可能的话，客户端可以重新从头开始。\n\
  \n协商使用 MIME 类型。有成百种标准类型：`text/html`、`application/pdf`、`application/xml` 等。浏览器可以渲染它收到的任何\
  \ HTML 文档。感知 HTTP 的播放器（如 `VLC`）可以播放它收到的任何 `MP3` 文件。但对于闪卡应用程序，它无法处理通用格式，只能处理符合预期结构的消息。\n\
  \n\n\n\n\n```go\nfunc qualityOfValue(value string, vqs []ValueQuality) float64 {\n\
  \tfor \\_, vq := range vqs {\n\t\tif value == vq.Value {\n\t\t\treturn vq.Quality\n\
  \t\t}\n\t}\n\t// 未找到\n\treturn 0\n}\n```\n\n如果服务器不接受用户代理请求的任何类型，它将返回 HTTP 代码 406\
  \ \"Not acceptable\"不可接受），并提供接受的格式列表。服务器中执行此操作的代码段如下：\n\n```go\nfunc handleFlashCardSets(rw\
  \ http.ResponseWriter, req *http.Request) {\n\tif req.Method == \"GET\" {\n\t\t\
  acceptTypes := parseValueQuality(req.Header.Get(\"Accept\"))\n\t\tq_xml := qualityOfValue(flashcard_xml,\
  \ acceptTypes)\n\t\tq_json := qualityOfValue(flashcard_json, acceptTypes)\n\t\t\
  if q_xml == 0 && q_json == 0 {\n\t\t\t// 在 Accept 请求头中未找到 XML 或 JSON\n\t\t\trw.Header().Set(\"\
  Content-Type\", flashcard_xml + `, ` + flashcard_json)\n\t\t\trw.WriteHeader(http.StatusNotAcceptable)\n\
  \t\t\treturn\n\t\t}\n\t\t...\n\t}\n}\n```\n\n231\n\n第 14 章 ■ ReST\n\n这说明了 HTTP 服务器的一种常见\
  \ REST 模式：给定一个 HTTP 请求，检查它以查看服务器是否可以处理。如果不能，返回 HTTP 错误。如果可以，尝试处理。如果尝试失败，返回 HTTP\
  \ 错误。如果成功，返回适当的 HTTP 成功代码和结果。\n\n### GET /\n\n闪卡集都存储在目录 `/flashcardSets` 中。`GET\
  \ /` 请求需要列出所有这些文件，并以客户端适当的格式进行准备工作。该格式是闪卡集名称及其 URL 的列表。HATEOAS 要求这些 URL：名称列表告诉我们有哪些集合，但客户端需要它们的\
  \ URL 才能进入与其中某一个进行交互的阶段。\n\n服务器上每个 `FlashcardSet` 的数据类型包含集合名称和其 URL（字符串类型）：\n\n\
  ```go\ntype FlashcardSet struct {\n\tName string\n\tLink string\n}\n```\n\n服务器上的闪卡集集合可以从闪卡集目录构建。`ioutil.ReadDir()`\
  \ 将创建一个 `os.FileInfo` 数组。这需要按照所示转换为文件名列表：\n\n```go\nfiles, err := ioutil.ReadDir(`flashcardSets`)\n\
  checkError(err)\nnumfiles := len(files)\ncardSets := make([]FlashcardSet, numfiles,\
  \ numfiles)\nfor n, file := range files {\n\tcardSets[n].Name = file.Name()\n\t\
  // 应该用 PathEscape，在 go 1.6 中没有\n\tcardSets[n].Link = `/flashcardSets/` + url.QueryEscape(file.Name())\n\
  }\n```\n\n这创建了一个文件名数组以及指向服务器上资源的相对链接，格式为 `/<name>`。对于 `CommonWords` 集合，相对链接 URL\
  \ 将是 `/flashcardSets/CommonWords`。方案（http 或 https）和主机（例如 \"localhost\"）留给客户端自行确定。\n\
  \n遗憾的是，文件名可能包含 URL 路径名中不合法的字符。`url.PathEscape` 函数可以正确转义它们，但直到 Go 1.8 版本才可用。`url.QueryEscape`\
  \ 函数除了文件名中的空格外都处理得正确，它会将空格替换为 `+` 而不是 `%20`。\n\n最后，服务器确定偏好 JSON 还是 XML，并通过模板运行生成正确的输出给客户端。对于\
  \ XML，模板代码如下：\n\n```go\nt, err := template.ParseFiles(\"xml/ListFlashcardSets.xml\"\
  )\nif err != nil {\n\t// 模板中发生解析错误。我们的错误\n\thttp.Error(rw, err.Error(), http.StatusInternalServerError)\n\
  \treturn\n}\nrw.Header().Set(\"Content-Type\", flashcard_xml)\nt.Execute(rw, cardSets)\n\
  ```\n\n232\n\n第 14 章 ■ ReST\n\nXML 模板如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<cardsets xmlns=\"http://www.w3.org/2005/Atom\">\n{{range .}}\n<cardset\
  \ href=\"{{.Link}}\">\n<name>\n{{.Name}}\n</name>\n</cardset>\n{{end}}\n</cardsets>\n\
  ```\n\n对于仅包含两个集合（`CommonWords` 和 `Lesson04`）的列表，发送给客户端的内容如下\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<cardsets xmlns=\"http://www.w3.org/2005/Atom\">\n<cardset\
  \ href=\"/CommonWords\">\n<name>\nCommon Words\n</name>\n</cardset>\n<cardset href=\"\
  /Lesson04\">\n<name>\nLesson04\n</name>\n</cardset>\n</cardsets>\n```\n\n### POST\
  \ /\n\n在这里，客户端请求创建一个新的闪卡集。预期是客户端将提供闪卡集的名称。我们使其看起来像表单提交数据：\n\n`name=<new flashcard\
  \ set name>`\n\n在这种情况下，这比 `GET` 要简单得多。从请求中获取表单数据值。然后检查请求的名称是否包含恶意内容，例如调用闪卡集为 `/etc/passwd`。如果有，返回\
  \ 403 \"Forbidden\"。如果看起来没问题，则创建一个命名的目录。如果失败（目录已存在），再次返回 403。否则，返回 201 \"Created\"\
  。\n\n```go\nif req.Method == \"POST\" {\n\tname := req.FormValue(\"name\")\n\tif\
  \ hasIllegal(name) {\n\t\trw.WriteHeader(http.StatusForbidden)\n\t\treturn\n\t}\n\
  \terr := os.Mkdir(\"/flashcardSets/\"+name, 0755)\n\tif err != nil {\n\t\trw.WriteHeader(http.StatusConflict)\n\
  \t\treturn\n\t}\n\trw.WriteHeader(http.StatusCreated)\n}\n```\n\n### 处理其他 URL\n\n\
  我们已经讨论了 `GET` 和 `POST` 请求的代码。在此语境下，`DELETE` 或 `PUT` 没有特别新之处；它们遵循相同的模式。\n\n### 完整的服务器\n\
  \n后续是处理请求的完整服务器。\n\n```go\n/* Server\n*/\npackage main\n\nimport (\n\t\"fmt\"\n\t\
  \"html/template\"\n\t\"io/ioutil\"\n\t\"net/http\"\n\t\"net/url\"\n\t\"os\"\n\t\"\
  regexp\"\n\t\"strconv\"\n\t\"strings\"\n)\n\ntype FlashcardSet struct {\n\tName\
  \ string\n\tLink string\n}\n\ntype Flashcard struct {\n\tName string\n\tLink string\n\
  }\n\nconst flashcard_xml = \"application/x.flashcards+xml\"\nconst flashcard_json\
  \ = \"application/x.flashcards+json\"\n\ntype ValueQuality struct {\n\tValue string\n\
  \tQuality float64\n}\n\n/* 基于 https://siongui.github.io/2015/02/22/go-parse-accept-language/\
  \ */\nfunc parseValueQuality(s string) []ValueQuality {\n\tvar vqs []ValueQuality\n\
  \tstrs := strings.Split(s, \",\")\n\tfor \\_, str := range strs {\n\t\ttrimmedStr\
  \ := strings.Trim(str, \" \")\n\t\tvalQ := strings.Split(trimmedStr, \";\")\n\t\t\
  if len(valQ) == 1 {\n\t\t\tvq := ValueQuality{valQ[0], 1}\n\t\t\tvqs = append(vqs,\
  \ vq)\n\t\t} else {\n\t\t\tqp := strings.Split(valQ[1], \"=\")\n\t\t\tq, err :=\
  \ strconv.ParseFloat(qp[1], 64)\n\t\t\tif err != nil {\n\t\t\t\tq = 0\n\t\t\t}\n\
  \t\t\tvq := ValueQuality{valQ[0], q}\n\t\t\tvqs = append(vqs, vq)\n\t\t}\n\t}\n\t\
  return vqs\n}\n\nfunc qualityOfValue(value string, vqs []ValueQuality) float64 {\n\
  \tfor \\_, vq := range vqs {\n\t\tif value == vq.Value {\n\t\t\treturn vq.Quality\n\
  \t\t}\n\t}\n\treturn 0\n}\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Fprint(os.Stderr,\
  \ \"Usage: \", os.Args[0], \":port\\n\")\n\t\tos.Exit(1)\n\t}\n\tport := os.Args[1]\n\
  \thttp.HandleFunc(\"/\", handleFlashCardSets)\n}\n```\n\n\n\n\n\n```go\nfiles, err\
  \ := ioutil.ReadDir(\\`flashcardSets\\`)\n\ncheckError(err)\n\nfor \\_, file :=\
  \ range files {\n\tfmt.Println(file.Name())\n\tcardset\\_url := \\`/flashcardSets/\\\
  ` + url.QueryEscape(file.Name())\n\tfmt.Println(\"Adding handlers for \", cardset\\\
  _url)\n\thttp.HandleFunc(cardset\\_url, handleOneFlashCardSet)\n\thttp.HandleFunc(cardset\\\
  _url + \\`/\\`, handleOneFlashCard)\n}\n\n// 将请求交给处理器\nerr = http.ListenAndServe(port,\
  \ nil)\ncheckError(err)\n\n// 就这些！\n}\n\nfunc hasIllegalChars(s string) bool {\n\
  \t// 检查用于跳出当前目录的字符\n\tb, err := regexp.Match(\"\\[/$~\\]\", \\[\\]byte(s))\n\tif\
  \ err != nil {\n\t\tfmt.Println(err)\n\t\treturn true\n\t}\n\tif b {\n\t\treturn\
  \ true\n\t}\n\treturn false\n}\n\nfunc handleOneFlashCard(rw http.ResponseWriter,\
  \ req \\*http.Request) {\n\t// 应该是 PathUnescape\n\tpath, \\_ := url.QueryUnescape(req.URL.String())\n\
  \t// 丢失初始的 '/'\n\tpath = path\\[1:\\]\n\n\tif req.Method == \"GET\" {\n\t\tfmt.Println(\"\
  Handling card: \", path)\n\t\tjson\\_contents, err := ioutil.ReadFile(path)\n\t\t\
  if err != nil {\n\t\t\trw.WriteHeader(http.StatusNotFound)\n\t\t\trw.Write(\\[\\\
  ]byte(\\`未找到资源\\`))\n\t\t\treturn\n\t\t}\n\t\t// 这里懒一点，直接作为 text/plain 返回内容\n\t\t\
  rw.Write(json\\_contents)\n\t\treturn\n\t} else if req.Method == \"DELETE\" {\n\t\
  \trw.WriteHeader(http.StatusNotImplemented)\n\t} else {\n\t\trw.WriteHeader(http.StatusMethodNotAllowed)\n\
  \t}\n\treturn\n}\n\nfunc handleFlashCardSets(rw http.ResponseWriter, req \\*http.Request)\
  \ {\n\tif req.URL.String() != \\`//\\` {\n\t\t// 此函数只处理 '/'\n\t\trw.WriteHeader(http.StatusNotFound)\n\
  \t\trw.Write(\\[\\]byte(\\\"未找到资源\\\\n\\\\))\")\n\t\treturn\n\t}\n\tif req.Method\
  \ == \"GET\" {\n\t\tacceptTypes := parseValueQuality(req.Header.Get(\"Accept\"))\n\
  \t\tfmt.Println(acceptTypes)\n\t\tq\\_xml := qualityOfValue(flashcard\\_xml, acceptTypes)\n\
  \t\tq\\_json := qualityOfValue(flashcard\\_json, acceptTypes)\n\t\tif q\\_xml ==\
  \ 0 && q\\_json == 0 {\n\t\t\t// 在 Accept header 中未找到 XML 或 JSON\n\t\t\trw.Header().Set(\"\
  Content-Type\", flashcard\\_xml + \\`, \\ + flashcard\\_json)\n\t\t\trw.WriteHeader(http.StatusNotAcceptable)\n\
  \t\t\treturn\n\t\t}\n\t\tfiles, err := ioutil.ReadDir(\\`flashcardSets\\`)\n\t\t\
  checkError(err)\n\t\tnumfiles := len(files)\n\t\tcardSets := make(\\[\\]FlashcardSet,\
  \ numfiles, numfiles)\n\t\tfor n, file := range files {\n\t\t\tfmt.Println(file.Name())\n\
  \t\t\tcardSets\\[n\\].Name = file.Name()\n\t\t\t// 应该是 PathEscape，go 1.6 中没有\n\t\
  \t\tcardSets\\[n\\].Link = \\`/flashcardSets/\\` + url.QueryEscape(file.Name())\n\
  \t\t}\n\t\tif q\\_xml >= q\\_json {\n\t\t\t// 优先 XML\n\t\t\tt, err := template.ParseFiles(\"\
  xml/ListFlashcardSets.xml\")\n\t\t\tif err != nil {\n\t\t\t\tfmt.Println(\"模板错误\"\
  )\n\t\t\t\thttp.Error(rw, err.Error(), http.StatusInternalServerError)\n\t\t\t\t\
  return\n\t\t\t}\n\t\t\trw.Header().Set(\"Content-Type\", flashcard\\_xml)\n\t\t\t\
  t.Execute(rw, cardSets)\n\t\t} else {\n\t\t\t// 优先 JSON\n\t\t\tt, err := template.ParseFiles(\"\
  json/ListFlashcardSets.json\")\n\t\t\tif err != nil {\n\t\t\t\tfmt.Println(\"模板错误\"\
  )\n\t\t\t\thttp.Error(rw, err.Error(), http.StatusInternalServerError)\n\t\t\t\t\
  return\n\t\t\t}\n\t\t\trw.Header().Set(\"Content-Type\", flashcard\\_json)\n\t\t\
  \tt.Execute(rw, cardSets)\n\t\t}\n\t} else if req.Method == \"POST\" {\n\t\tname\
  \ := req.FormValue(\\`namè`)\n\t\tif hasIllegalChars(name) {\n\t\t\trw.WriteHeader(http.StatusForbidden)\n\
  \t\t\treturn\n\t\t}\n\t\t// 移除所有空格，因为它们是干扰项\n\t\tname = strings.Replace(name, \\\
  ` \\`, \"\", -1)\n\t\terr := os.Mkdir(\\`flashcardSets/\\`+name, (os.ModeDir | os.ModePerm))\n\
  \t\tif err != nil {\n\t\t\trw.WriteHeader(http.StatusForbidden)\n\t\t\treturn\n\t\
  \t}\n\t\trw.WriteHeader(http.StatusCreated)\n\t\tbase\\_url := req.URL.String()\n\
  \t\tnew\\_url := base\\_url + \\`/flashcardSets/\\` + name\n\t\t// 为资源添加处理器\n\t\t\
  http.HandleFunc(new\\_url, handleOneCardSet)\n\t\thttp.HandleFunc(new\\_url + \\\
  `/\\`, handleOneFlashCard)\n\t\trw.Write(\\[\\]byte(new\\_url))\n\t} else if req.Method\
  \ == \"DELETE\" {\n\t\trw.WriteHeader(http.StatusNotImplemented)\n\t} else {\n\t\
  \trw.WriteHeader(http.StatusMethodNotAllowed)\n\t}\n\treturn\n}\n\nfunc handleOneCardSet(rw\
  \ http.ResponseWriter, req \\*http.Request) {\n\tcooked\\_url, \\_ := url.QueryUnescape(req.URL.String())\n\
  \tfmt.Println(\"处理集合: \", cooked\\_url)\n\tif req.Method == \"GET\" {\n\t\tacceptTypes\
  \ := parseValueQuality(req.Header.Get(\"Accept\"))\n\t\tfmt.Println(acceptTypes)\n\
  \t\tq\\_xml := qualityOfValue(flashcard\\_xml, acceptTypes)\n\t\tq\\_json := qualityOfValue(flashcard\\\
  _json, acceptTypes)\n\t\tif q\\_xml == 0 && q\\_json == 0 {\n\t\t\t// 在 Accept header\
  \ 中未找到 XML 或 JSON\n\t\t\trw.Header().Set(\"Content-Type\", flashcard\\_xml + \\\
  `, \\ + flashcard\\_json)\n\t\t\trw.WriteHeader(http.StatusNotAcceptable)\n\t\t\t\
  return\n\t\t}\n\t\tpath := req.URL.String()\n\t\t// 丢失开头的 /\n\t\trelative\\_path\
  \ := path\\[1:\\]\n\t\tfiles, err := ioutil.ReadDir(relative\\_path)\n\t\tcheckError(err)\n\
  \t\tnumfiles := len(files)\n\t\tcards := make(\\[\\]Flashcard, numfiles, numfiles)\n\
