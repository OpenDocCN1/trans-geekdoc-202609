  ## 客户端\n\n客户端相对简单，并没有提供新内容。此客户端仅请求 XML 格式的内容。一个新部分是闪卡集合的内容包含了超文本属性。这可以通过 `Card`\
  \ 结构体中的 `xml:\"href,attr\"` 标签转换为字段。\n\n此客户端在 `getFlashcardSets()`（步骤 1）中获取闪卡集合列表及其\
  \ URL。它返回一个 `FlashcardSets` 结构体。它可以用于向用户展示列表，例如选择特定的集合。\n\n一旦选定，可以使用该集合的 URL 与资源进行交互。\n\
  \n此客户端随后在 `createFlashcardSet()`（步骤 2）中使用 `NewSet` 创建一个新的闪卡集合。第一次运行时，它将创建该集合并返回该集合的\
  \ URL。第二次运行时，它将从服务器收到一个禁止操作的错误，因为集合已存在。\n\n此客户端随后从服务器提供的 URL 获取第一组闪卡，并请求它持有的卡片集合（步骤\
  \ 3）。然后它从集合中挑选第一张卡片并获取其内容（步骤 4）。\n\n客户端是 Client.go：\n\n```go\n/* 客户端 */\npackage\
  \ main\n\nimport (\n//\"encoding/json\"\n\"encoding/xml\"\n\"fmt\"\n\"io/ioutil\"\
  \n\"net/http\"\n\"net/http/httputil\"\n\"net/url\"\n\"os\"\n\"strings\"\n)\n\nconst\
  \ flashcard_xml string = \"application/x.flashcards+xml\"\nconst flashcard_json\
  \ string = \"application/x.flashcards+json\"\n\ntype FlashcardSets struct {\n\t\
  XMLName string `xml:\"cardsets\"`\n\tCardSet []CardSet `xml:\"cardset\"`\n}\n\n\
  type CardSet struct {\n\tXMLName string `xml:\"cardset\"`\n\tName string `xml:\"\
  name\"`\n\tLink string `xml:\"href,attr\"`\n\tCards []Card `xml:\"card\"`\n}\n\n\
  type Card struct {\n\tName string `xml:\"name\"`\n\tLink string `xml:\"href,attr\"\
  `\n}\n```\n\n\n\n\n```go\nfunc getOneFlashcard(url *url.URL, client *http.Client)\
  \ string {\n\t// 获取字符串格式的片，不对其进行任何操作\n\n\trequest, err := http.NewRequest(\"GET\"\
  , url.String(), nil)\n\tcheckError(err)\n\n\tresponse, err := client.Do(request)\n\
  \tcheckError(err)\n\n\tif response.Status != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\
  \t\tfmt.Println(response.Header)\n\t\tos.Exit(2)\n\t}\n\n\t// 241\n\t// 第 14 章 ■\
  \ REST 接口\n\n\tfmt.Println(\"The response header is\")\n\tb, _ := httputil.DumpResponse(response,\
  \ false)\n\tfmt.Print(string(b))\n\tbody, err := ioutil.ReadAll(response.Body)\n\
  \tcontent := string(body[:])\n\t//fmt.Printf(\"Body is %s\", content)\n\n\treturn\
  \ content\n}\n\nfunc getOneFlashcardSet(url *url.URL, client *http.Client) CardSet\
  \ {\n\t// 获取一组卡片\n\n\trequest, err := http.NewRequest(\"GET\", url.String(), nil)\n\
  \tcheckError(err)\n\n\t// 仅接受我们的媒体类型\n\trequest.Header.Add(\"Accept\", flashcard_xml)\n\
  \tresponse, err := client.Do(request)\n\tcheckError(err)\n\n\tif response.Status\
  \ != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\t\tfmt.Println(response.Header)\n\
  \t\tos.Exit(2)\n\t}\n\n\tfmt.Println(\"The response header is\")\n\tb, _ := httputil.DumpResponse(response,\
  \ false)\n\tfmt.Print(string(b))\n\tbody, err := ioutil.ReadAll(response.Body)\n\
  \tcontent := string(body[:])\n\tfmt.Printf(\"Body is %s\", content)\n\n\tvar sets\
  \ CardSet\n\tcontentType := getContentType(response)\n\n\tif contentType == \"XML\"\
  \ {\n\t\terr = xml.Unmarshal(body, &sets)\n\t\tcheckError(err)\n\t\tfmt.Println(\"\
  XML: \", sets)\n\t\treturn sets\n\t}\n\t/* else if contentType == \"JSON\" {\n\t\
  \tvar sets FlashcardSetsJson\n\t\terr = json.Unmarshal(body, &sets)\n\t\tcheckError(err)\n\
  \t\tfmt.Println(\"JSON: \", sets)\n\t} */\n\n\treturn sets\n}\n\n// 242\n// 第 14\
  \ 章 ■ REST 接口 \n\nfunc getFlashcardSets(url *url.URL, client *http.Client) FlashcardSets\
  \ {\n\t// 获取顶层 /\n\trequest, err := http.NewRequest(\"GET\", url.String(), nil)\n\
  \tcheckError(err)\n\n\t// 仅接受我们的媒体类型\n\trequest.Header.Add(\"Accept\", flashcard_xml)\n\
  \tresponse, err := client.Do(request)\n\tcheckError(err)\n\n\tif response.Status\
  \ != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\t\tfmt.Println(response.Header)\n\
  \t\tos.Exit(2)\n\t}\n\n\tfmt.Println(\"The response header is\")\n\tb, _ := httputil.DumpResponse(response,\
  \ false)\n\tfmt.Print(string(b))\n\tbody, err := ioutil.ReadAll(response.Body)\n\
  \tcontent := string(body[:])\n\tfmt.Printf(\"Body is %s\", content)\n\n\tvar sets\
  \ FlashcardSets\n\tcontentType := getContentType(response)\n\n\tif contentType ==\
  \ \"XML\" {\n\t\terr = xml.Unmarshal(body, &sets)\n\t\tcheckError(err)\n\t\tfmt.Println(\"\
  XML: \", sets)\n\t\treturn sets\n\t}\n\treturn sets\n}\n\nfunc createFlashcardSet(url1\
