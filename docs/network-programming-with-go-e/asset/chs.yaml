  \n43\n第 3 章 ■ 套接字级编程\n\n注意服务器与客户端相比，其错误处理方式有所不同。服务器应该一直运行，这样如果客户端发生任何错误，服务器也只会忽略该客户端并继续运行。否则，客户端可能会尝试破坏与服务器的连接并使其崩溃！\n\
  \n我们还没有构建客户端。这很简单，只需修改之前的客户端以跳过初始写入。\n\n或者，直接对该主主机打开一个 telnet 连接：\n\n```bash\ntelnet\
