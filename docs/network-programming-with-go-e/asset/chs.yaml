  ].Link = path + \\`/\\ + url.QueryEscape(file.Name())\n\t\t}\n\t\tif q\\_xml >=\
  \ q\\_json {\n\t\t\t// 优先 XML\n\t\t\tt, err := template.ParseFiles(\"xml/ListOnecardSet.xml\"\
  )\n\t\t\tif err != nil {\n\t\t\t\tfmt.Println(\"模板错误\")\n\t\t\t\thttp.Error(rw,\
  \ err.Error(), http.StatusInternalServerError)\n\t\t\t\treturn\n\t\t\t}\n\t\t\t\
