  \ 3D | = | 175 | 125 | 7D | } |\n| 076 | 62 | 3E | > | 176 | 126 | 7E | ~ |\n| 077\
  \ | 63 | 3F | ? | 177 | 127 | 7F | |\n\n`ASCII` 包含了英语字母、数字、标点符号和一些控制字符。`ASCII` 的代码点由这个熟悉的表格给出：\n\
  \n（表格内容略，保持格式一致）\n\n`ASCII` 包含了英语字母、数字、标点符号和一些控制字符……（重复部分）\n\n##### Unicode\n\n\
  `ASCII` 和 `ISO8859` 无法涵盖基于象形文字的语言。中文估计有 20,000 个独立字符，常用字符有 5,000 个。这些字符需要超过一个字节，通常使用两个字节。存在许多双字节字符集：`Big5`、`EUC-TW`、`GB2312`\
  \ 和 `GBK/GBX` 用于中文，`JIS X 0208` 用于日语，等等。这些编码通常互不兼容。\n\nUnicode 是一个旨在涵盖所有主要使用字符集的开放标准字符集。它包含了欧洲、亚洲、印度等更多语言。它已更新到\
  \ 9.0 版本，拥有 128,172 个字符。\n\n代码点数已经超过了 65,536。这超过了 $2^{16}$。这对于字符编码有影响。\n\n前 256\
  \ 个代码点对应 `ISO 8859-1`，其中 128 位是 `US ASCII`。因此，这些主要的字符集具有向后兼容性，因为 `ISO 8859-1` 和\
  \ `ASCII` 的代码点在 Unicode 中完全相同。对于其他字符集则并非如此：例如，虽然大多数 `Big5` 字符在 Unicode 中，但代码点并不相同。网站\
  \ `http://moztw.org/docs/big5/table/unicode1.1-obsolete.txt` 包含一个从 `Big5` 到 Unicode\
  \ 的（大容量）映射表示例。\n\n要在计算机系统中表示 Unicode 字符，必须使用编码。编码 UCS\n\n\n\n\n是一种使用 Unicode 字符代码点值的双字节编码。然而，由于现在\
  \ Unicode 中的字符太多，无法将它们放入 2 个字节中，因此这种编码已经过时且不再被使用。\n\n相反地，还有：\n\n- `UTF-32` 是一种 4\
  \ 字节编码，但并不常用，且 HTML 5 明确警告不要使用它。\n- `UTF-16` 将最常用的字符编码为 2 字节，并用额外的 2 字节处理“溢出”，其中\
  \ `ASCII` 和 `ISO 8859-1` 具有常规值。\n- `UTF-8` 每个字符使用 1 到 4 个字节，`ASCII` 具有常规值（但不包含 `ISO\
  \ 8859-1`）。\n- `UTF-7` 有时会被使用，但并不常见。\n\n# UTF-8, Go 与 Runes\n\n`UTF-8` 是最常用的编码。Google\
  \ 估计在 2008 年，它看到的页面中有 50% 是 `UTF-8` 编码的，而且这一比例正在增加。`ASCII` 集在 `UTF-8` 中具有相同的编码值，因此\
  \ `UTF-8` 读取器可以读取仅由 `ASCII` 字符组成的文本，也可以读取来自完整 Unicode 集的文本。\n\n`Go` 在其 `strings`\
  \ 中使用 `UTF-8` 编码的字符。每个字符的类型为 `rune`。这是 `int32` 的别名。在 `UTF-8` 编码中，一个 Unicode 字符最多占用\
  \ 4 字节，因此需要 4 字节来表示所有字符。从字符的角度来看，`string` 是一个 `runes` 数组，每个 `rune` 使用 1、2 或 4 字节。\n\
  \n`string` 也是一个 `bytes` 数组，但你必须小心：只有对于 `ASCII` 子集，`byte` 才等于一个 `character`。所有其他字符都占用\
  \ 2、3 或 4 字节。这意味着 `string` 按字符（`runes`）计算的长度通常与其字节数组的长度不相等。只有当字符串完全由 `ASCII` 字符组成时，它们才相等。\n\
  \n下面的代码片段说明了这一点。如果你取一个 `UTF-8` 字符串并测试其长度，你将得到底层字节数组的长度。但如果你将字符串强制转换为 `rune` 数组 `[]rune`，那么你将得到一个\
  \ Unicode 代码点的数组，这通常是字符的个数：\n\n```go\nstr := \"百度一下, 你就知道\"\n\nprintln(\"String\
  \ length\", len([]rune(str)))\n\nprintln(\"Byte length\", len(str))\n```\n\n打印：\n\
  ```\nString length 9\nByte length 27\n```\n\nThe Go Blog 提供了关于 strings 和 runes 的更详细解释（参见\
  \ [`blog.golang.org/strings`](https://blog.golang.org/strings)）。\n\n##### UTF-8\
  \ 客户端与服务器\n\n可能让你惊讶的是，在客户端或服务器端处理 `UTF-8` 文本都不需要任何特殊操作。`Go` 中 `UTF-8` `string` 的底层数据类型是\
  \ `byte` 数组，正如我们刚刚看到的，`Go` 会根据需要将字符串编码为 1、2、3 或 4 字节。`string` 的长度就是字节数组的长度，因此你通过写入字节数组来写入任何\
  \ `UTF-8` `string`。\n\n112\n\n第 6 章 ■ 管理字符集与编码\n\n类似于读取一个 `string`，你只需要将其读取到一个 `byte`\
  \ 数组中，然后使用 `string([]byte)` 将数组转换为 `string`。如果 `Go` 无法将将字节正确解码为 Unicode 字符，它将给出\
  \ Unicode 替换字符 `\\uFFFD`。生成的字节数组的长度是字符串合法部分的长度。\n\n因此，前面的章节中给客户端和服务器可以完美处理 `UTF-8`\
  \ 编码的文本。\n\n##### ASCII 客户端与服务器\n\n`ASCII` 字符在 `ASCII` 和 `UTF-8` 中具有相同的编码。因此，普通的\
  \ `UTF-8` 字符处理对于 `ASCII` 字符完全有效。不需要任何特殊处理。\n\n##### UTF-16 与 Go\n\n`UTF-16` 处理的是\
  \ 16 位无符号短整数数组。`utf16` 包设计用于管理此类数组。要将普通的 `Go` `string`（即 `UTF-8` `string`）转换为 `UTF-16`，你首先需要通过将其强制转换为\
  \ `[]rune` 来提取代码点，然后使用 `utf16.Encode` 生成一个类型为 `uint16` 的数组。\n\n同样，为了将无符号短 `UTF-16`\
  \ 值数组解码为 `Go` `string`，你使用 `utf16.Decode` 将其转换为类型为 `[]rune` 的代码点，然后转换为 `string`。下面的代码片段说明了这一点：\n\
  \n```go\nstr := \"百度一下, 你就知道\"\n\nrunes := utf16.Encode([]rune(str))\n\nints :=\
  \ utf16.Decode(runes)\n\nstr = string(ints)\n```\n\n这些类型转换需要由客户端或服务器根据情况应用，以便读取和写入\
  \ 16 位短整数，如下所示。\n\n##### 小端序与大端序\n\n遗憾的是，有一个小魔鬼潜伏在 `UTF-16` 之后。它基本上是将字符编码为 16 位短整数。一个大问题是：对于每个短整数，它是如何写入两个字节的？是高位在前还是高位在后？哪种方式都可以，只要接收方和发送方使用相同的约定。\n\
  \n`Unicode` 通过一种称为 `BOM`（字节顺序标记）的特殊字符解决了这个问题。这是一个零宽不打印字符，所以你永远不会在文中看到它。但它的值 `0xfffe`\
  \ 被选中是为了让你能够判断字节顺序：\n\n- 在大端序系统中，它是 `FF FE`\n- 在小端序系统中，它是 `FE FF`\n\n文本有时会将 `BOM`\
  \ 放在文本的第一个字符。读取器可以检查这两个字节以确定使用了哪种端序。\n\n113\n\n第 6 章 ■ 管理字符集与编码\n\n##### UTF-16\
  \ 客户端与服务器\n\n使用 `BOM` 约定，你可以写一个在字符串前附加 `BOM` 并以 `UTF-16` 写入字符串的服务器，文件名为 `UTF16Server.go`：\n\
  \n```go\n/* UTF16 Server */\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n\t\"\
  os\"\n\t\"unicode/utf16\"\n)\n\nconst BOM = '\\ufffe'\n\nfunc main() {\n\tservice\
  \ := \"0.0.0.0:\"\n\ttcpAddr, err := net.ResolveTCPAddr(\"tcp\", service)\n\tcheckError(err)\n\
  \tlistener, err := net.Listen(\"tcp\", service)\n\n\tcheckError(err)\n\tfor {\n\t\
  \tconn, err := listener.Accept()\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\
  \tgo func(conn net.Conn) {\n\t\t\tdefer conn.Close()\n\t\t\tvar buf [512]byte\n\t\
  \t\tn, err := conn.Read(buf[:2])\n\t\t\tfor true {\n\t\t\t\tm, err := conn.Read(buf[n:])\n\
  \t\t\t\tif m == 0 || err != nil {\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t\tn += m\n\t\
  \t\t}\n\t\t\tcheckError(err)\n\t\t\tvar shorts []uint16\n\t\t\tshorts = make([]uint16,\
  \ n/2)\n\t\t\tif buf[0] == 0xff && buf[1] == 0xfe {\n\t\t\t\t// big endian\n\t\t\
  \t\tfor i := 2; i < n; i += 2 {\n\t\t\t\t\tshorts[i/2] = uint16(buf[i])<<8 + uint16(buf[i+1])\n\
  \t\t\t\t}\n\t\t\t} else if buf[1] == 0xff && buf[0] == 0xfe {\n\t\t\t\t// little\
  \ endian\n\t\t\t\tfor i := 2; i < n; i += 2 {\n\t\t\t\t\tshorts[i/2] = uint16(buf[i+1])<<8\
  \ + uint16(buf[i])\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\t// unknown byte order\n\t\
  \t\t\tfmt.Println(\"Unknown order\")\n\t\t\t}\n\t\t\tencoded := utf16.Encode(shorts)\n\
  \t\t\tvar bytes [2]byte\n\t\t\tfor _, v := range encoded {\n\t\t\t\tbytes[0] = byte(v\
  \ >> 8)\n\t\t\t\tbytes[1] = byte(v & 255)\n\t\t\t\t_, err = conn.Write(bytes[:])\n\
  \t\t\t\tif err != nil {\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t}(conn)\n\t}\n\
  }\n```\n\n而一个读取字节流、提取并检查 BOM，然后解码流剩余部分的客户端是 `UTF16Client.go`:\n\n```go\n/* UTF16\
  \ Client */\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n\t\"os\"\n\t\"unicode/utf16\"\
  \n)\n\nconst BOM = '\\ufffe'\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"\
  Usage: \", os.Args[0], \"host:port\")\n\t\tos.Exit(1)\n\t}\n\tservice := os.Args[1]\n\
  \tconn, err := net.Dial(\"tcp\", service)\n\tcheckError(err)\n\tdefer conn.Close()\n\
  \tvar buf [512]byte\n\t// read everything into the buffer\n\tn, err := conn.Read(buf[:2])\n\
  \tfor true {\n\t\tm, err := conn.Read(buf[n:])\n\t\tif m == 0 || err != nil {\n\t\
  \t\tbreak\n\t\t}\n\t\tn += m\n\t}\n\tcheckError(err)\n\tvar shorts []uint16\n\t\
  shorts = make([]uint16, n/2)\n\tif buf[0] == 0xff && buf[1] == 0xfe {\n\t\t// big\
  \ endian\n\t\tfor i := 2; i < n; i += 2 {\n\t\t\tshorts[i/2] = uint16(buf[i])<<8\
  \ + uint16(buf[i+1])\n\t\t}\n\t} else if buf[1] == 0xff && buf[0] == 0xfe {\n\t\t\
  // little endian\n\t\tfor i := 2; i < n; i += 2 {\n\t\t\tshorts[i/2] = uint16(buf[i+1])<<8\
  \ + uint16(buf[i])\n\t\t}\n\t} else {\n\t\t// unknown byte order\n\t\tfmt.Println(\"\
  Unknown order\")\n\t}\n\tints := utf16.Decode(shorts)\n\tstr := string(ints)\n\t\
  fmt.Println(str)\n\tos.Exit(0)\n}\n\nfunc checkError(err error) {\n\tif err != nil\
  \ {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\
  \n客户端打印出服务器发送的 \"j'ai arrªtÃ©\"。\n\nUnicode 陷阱\n\n这本书并不是关于 i18n 问题的。特别是，我们不想深入探讨\
  \ Unicode 的奥秘领域。\n\n\n\n但你应该知道 `Unicode` 并不是一个简单的编码，它有很多复杂性。例如，早期的字符集使用了 `non-spacing`\
  \ 字符，特别是用于重音。这些被引入了 Unicode，因此你可以通过两种方式生成带重音的字符：作为一个单个 Unicode 字符，或者作为一个非重音符号加非带重音字符的组合。例如，`U+04D6`，“西里字母大写字母变音\
  \ ie”是一个单个字符。它等同于 `U+0415`，“西里字母大写字母 ie”结合变音符号 `U+0306` “组合上变音符号”。这在某些情况下会让字符串比较变得困难。这可能是某些非常晦涩错误的原因。\n\
  \nGo 的实验性树中有一个名为 `golang.org/x/text/unicode/norm` 的包，可以规范化 Unicode 字符串。你可以将其安装到你的\
  \ Go 包树中：\n\n```\ngo get golang.org/x/text/unicode/norm\n```\n\n注意，它是 Go 项目树中“子仓库”里的一个包，可能并不稳定。\n\
  \n实际上有四种标准的 Unicode 形式。最常见的是 `NFC`。可以通过 `norm.NFC.String(str)` 将字符串转换为 NFC 形式。以下名为\
  \ `norm.go` 的程序以两种方式形成字符串（单个字符和组合字符），并打印字符串、它们的字节，然后是规范化形式及其字节。\n\n```go\npackage\
  \ main\n\nimport (\n\t\"fmt\"\n\t\"golang.org/x/text/unicode/norm\"\n)\n\nfunc main()\
  \ {\n\tstr1 := \"\\u04d6\"\n\tstr2 := \"\\u0415\\u0306\"\n\tnorm_str2 := norm.NFC.String(str2)\n\
  \tbytes1 := []byte(str1)\n\tbytes2 := []byte(str2)\n\tnorm_bytes2 := []byte(norm_str2)\n\
  \tfmt.Println(\"Single char \", str1, \" bytes \", bytes1)\n\tfmt.Println(\"Composed\
  \ char \", str2, \" bytes \", bytes2)\n\tfmt.Println(\"Normalized char\", norm_str2,\
  \ \" bytes \", norm_bytes2)\n}\n```\n\n输出如下：\n```\nSingle char bytes [211 150]\n\
  Composed char bytes [208 149 204 134]\nNormalized char bytes [211 150]\n```\n\n\
  ##### ISO 8859 与 Go\n\nISO 8859 系列是用于欧洲不同地区和其他地区的 8 位字符集。它们在低位部分通用 `ASCII` 集合，但在高位部分不同。根据\
  \ Google 的数据，ISO 8859 代码占其看到的网页的 20%，但现在这个比例已经下降了。\n\n第一个代码 `ISO 8859-1` 或 `Latin-1`\
  \ 与 Unicode 有前 256 个字符相同。Latin-1 字符的编码值在 `UTF-16` 和默认的 `ISO 8859-1` 编码中是相同的。但这并没有什么帮助，因为\
  \ `UTF-16` 是 16 位编码，而 `ISO 8859-1` 是 8 位编码。`UTF-8` 也是 8 位编码，但它使用最高位来指示额外的字节，因此 `UTF-8`\
  \ 和 `ISO 8859-1` 只有 `ASCII` 子集重复。所以 `UTF-8` 也没有太大帮助。\n\n但 ISO 8859 系列并没有任何复杂的问题。每个集合中的每个字符都对应一个唯一的\
  \ Unicode 字符。例如，在 `ISO 8859-2` 中，字符“Latin 大写字母带 onek”的 ISO 8859-2 代码点为 `0xc7`（十六进制），对应的\
  \ Unicode 代码点为 `U+012E`。\n\n在 ISO 8859 集合与对应的 Unicode 字符之间转换本质上只是查表。\n\n从 ISO 8859\
  \ 代码点到 Unicode 代码点的表可以作为一个包含 256 个整数的数组来实现。但其中许多项的值与索引相同。因此，我们只需要对不同的项使用 map，而不在\
  \ map 中的项直接取索引值。\n\n对于 `ISO 8859-2`，map 的部分如下：\n\n```go\nvar unicodeToISOMap = map[int]\
  \ uint8 {\n\t0x12e: 0xc7,\n\t0x10c: 0xc8,\n\t0x118: 0xca,\n\t// 更多\n}\n```\n\n将\
  \ UTF-8 字符串转换为 ISO 8859-2 字节数组的函数如下：\n\n```go\n/* 将 UTF-8 字符串转换为 ISO 8859 编码的字节数组\
  \ */\nfunc unicodeStrToISO(str string) []byte {\n\t// 获取 unicode 代码点\n\tcodePoints\
  \ := []int(str)\n\t// 创建相同长度的字节数组\n\tbytes := make([]byte, len(codePoints))\n\t\
  for n, v := range(codePoints) {\n\t\t// 检查该点是否在异常 map 中\n\t\tiso, ok := unicodeToISOMap[v]\n\
  \t\tif !ok {\n\t\t\t// 直接使用值\n\t\t\tiso = uint8(v)\n\t\t}\n\t\tbytes[n] = iso\n\t\
  }\n\treturn bytes\n}\n```\n\n同样，你可以将 ISO 8859-2 字节数组转换为 UTF-8 字符串：\n\n```go\nvar\
  \ isoToUnicodeMap = map[uint8] int {\n\t0xc7: 0x12e,\n\t0xc8: 0x10c,\n\t0xca: 0x118,\n\
  \t// 更多\n}\n\nfunc isoToUnicode(bytes []byte) string {\n\tcodePoints := make([]int,\
  \ len(bytes))\n\tfor n, v := range(bytes) {\n\t\tunicode, ok := isoToUnicodeMap[v]\n\
  \t\tif !ok {\n\t\t\tunicode = int(v)\n\t\t}\n\t\tcodePoints[n] = unicode\n\t}\n\t\
  return string(codePoints)\n}\n```\n\n这些函数可以用于读写 ISO 8859。\n\n有非常非常多的字符集编码。根据 Google\
  \ 的说法，这些编码在 Web 文档中的用途很小，希望随着时间的推移会进一步减少。但如果你的软件想要覆盖所有市场，那么你可能需要处理它们。\n\n在最简单的情况下，查找表就足够了。但并不总是有效的。ISO2022\
  \ 字符编码通过使用有限状态机来换入代码页，最小化了字符集的大小。这种方法被一些日语编码借用，并使其变得非常复杂。\n\nGo 目前仅在“子仓库”树中为这些字符集提供了包支持。例如，`golang.org/x/text/encoding/japanese`\
  \ 处理了 `EUC-JP` 和 `Shift JIS`。\n\n## 结论\n\n本章没有多少代码。相反，我们介绍了一些非常复杂领域的概念。这取决于你：如果你假设大家都说美式英语，那么世界就是简单的。但如果你想让你的应用程序能够被世界上其他地方使用，你就需要注意这些复杂性。\n\
  \n### 第 7 章\n### 安全\n\n虽然互联网最初被设计成一个能够抵御恶意代理攻击的系统，但它发展变成了一个由相对信任的实体组成的协作环境。唉，日子早已一去不复了。垃圾邮件、拒绝服务\
  \ (DoS) 攻击、钓鱼尝试等都表明，任何使用互联网的人都在自担风险。\n\n应用程序必须构建成能够在敌对环境下正常工作。“正常”不再仅仅意味着程序功能上没有错误，还意味着确保传输数据的私密性和完整性、仅允许合法用户访问以及其他安全问题。\n\
  \n这自然地让你的程序变得复杂得多。使应用程序变得安全涉及到*困难*且*微妙*的计算问题。尝试自己来（例如自己编写加密库）通常注定失败。相反，你需要使用由安全专业人士设计的库。\n\
  \n\n\n\n如果这会让事情变得复杂，你为什么还要费精力呢？几乎每天都有关于信用卡详情泄露、政府官员运行的私有服务器被黑客攻击，以及系统因拒绝服务攻击而崩溃的报道。许多攻击是由于面向网络应用程序中的编码错误导致的，例如\
  \ `buffer overflows`（缓冲区溢出）、`cross-site scripting`（跨站脚本）和 `SQL injection`（SQL 注入）。但大量的错误可以追溯到网络处理不当：以明文传输密码、请求了安全凭据后未进行检查，以及盲目信任所处的环境。例如，一位同事最近购买了一个家用\
  \ IoT（物联网）设备。他使用 `wireshark` 查看该设备在网络上的活动，发现它正在发送带有身份验证令牌 `admin` 的 `RTMP` 消息。\n\
  \n这是一种很容易的攻击向量，甚至不需要破解密码！某知名公司制造的无人机使用了存在缺陷的加密技术，可以被其他无人机“窃取”。越来越常见的方法是充当“恶意”无线访问点，伪装成当地咖啡馆的合法访问点，但监控通过的所有内容，包括你的银行账户详情。\n\
  \n这些都是“触手可得的果实”。数据泄露的范围可以通过[全球最大的数据泄露](http://www.informationisbeautiful.net/visualizations/worlds-biggest-data-breaches-hacks/)（http://www.informationisbeautiful.net/visualizations/worlds-biggest-data-breaches-hacks/）看到。\n\
  \n本章介绍了 Go 提供的基本加密工具，你可以将它们构建到自己的应用程序中。如果你没有这样做且你的公司损失了一百万美元——或者糟，你的客户损失了一百万美元——那么责任将将回到你身上。\n\
  \n## ISO 安全架构\n\n分布式系统的 ISO OSI（开放系统互连）七层模型广为人知，如图 7-1 所示。\n\n- 应用层\n- 表示层\n- 会话层\n\
  - 传输层\n- 网络层\n- 数据链路层\n- 物理层\n\n图 7-1 分布式系统的 OSI 七层模型\n\n少为人知的是 ISO 在此架构的基础上建立了一系列文档。对于我们的目的来说，最重要的是\
  \ ISO 安全架构模型 `ISO 7498-2`。这需要购买，但 ITU（国际电信联盟）制作了一份在技术上与之对齐的文档 `X.800`，可以从 ITU 获取：`https://www.itu.int/rec/dologin_pub.asp?lang=e&id=T-REC-X.800-199103-I!!PDF-E&type=items`。\n\
  \n## 功能与级别\n\n安全系统所需的主要功能如下：\n- 身份验证：身份证明\n- 数据完整性：数据未被篡改\n- 机密性：数据不泄露给他人\n- 公证化/签名\n\
  - 访问控制\n- 保证/可用性\n\n这些功能在 OSI 栈的以下级别是要求的：\n- 对等实体认证\n- 数据源认证\n- 访问控制服务\n- 连接机密性\n\
  - 无连接机密性\n- 选择机密性\n- 流量机密性\n- 带有恢复的连接完整性\n- 不带恢复的连接完整性\n- 连接完整性字段\n- 无连接完整性\n\n\
  ### 机制\n\n实现这种安全级别的机制如下：\n- 对等实体认证\n- 加密\n- 数字签名\n- 身份交换\n- 数据源认证\n- 访问控制服务\n- 访问控制列表\n\
  - 密码\n- 能力列表\n- 标签\n- 连接机密性\n- 路由控制\n- 无连接机密性\n- 选择字段机密性\n- 流量机密性\n- 流量填充\n- 路由控制\n\
  - 带有恢复的连接完整性\n- 不带恢复的连接完整性\n- 连接完整性字段\n- 无连接完整性\n- 源不可否认性\n- 收收不可否认性\n\n#### 数据完整性\n\
  \n确保数据完整性意味着提供一种测试方法，以证明数据未被篡改。通常，通过数据中的字节形成一个简单的数字来实现。这个过程被称为 `hashing`（哈希），生成的数字被称为\
  \ `hash`（哈希）或哈希值。一个简单的哈希算法只是将数据中的所有字节相加。然而，这仍然允许对数据进行任何程度的更改而保持哈希值。例如，攻击者只需交换两个字节。这保留了哈希值，但可能导致你欠的是\
  \ 65536 而不是 256。\n\n用于安全目的哈希算法必须是“强”的，这样攻击者很难找到具有相同哈希值的不同字节序列。这使得攻击者难以修改数据以达到其目的。安全研究人员不断测试哈希算法以看是否能破解它们——即找到一种简单的字节序列方法来匹配哈希值。他们设计了一系列被认为是强大的\
  \ `cryptographic`（加密）哈希算法。\n\nGo 支持多种哈希算法，包括 `MD4`、`MD5`、`RIPEMD-160`、`SHA1`、`SHA224`、`SHA256`、`SHA384`\
  \ 和 `SHA512`。对于 Go 程序员来说，它们遵循相同的模式：适当包中的函数 `New`（或类似）返回 hash 包中的 `Hash` 对象。\n\n\
  哈希有有一个 `io.Writer`，你将要哈希的数据写入此写入器。你可以通过 `Size` 查询哈希值中的字节数，通过 `Sum` 查询哈希值。\n\n一个典型的用例如\
  \ MD5 哈希。它使用了 `md5` 包。哈希值是一个 16 字节数组。这通常以 ASCII 形式打印为四个十六进制数字，每个数字由四个字节组成。一个简单的程序是\
  \ `MD5Hash.go`：\n\n```go\n/* MD5Hash */\npackage main\n\nimport (\n\t\"crypto/md5\"\
  \n\t\"fmt\"\n)\n\nfunc main() {\n\thash := md5.New()\n\tbytes := []byte(\"hello\\\
  n\")\n\thash.Write(bytes)\n\thashValue := hash.Sum(nil)\n\thashSize := hash.Size()\n\
  \tfor n := 0; n < hashSize; n += 4 {\n\t\tvar val uint32\n\t\tval = uint32(hashValue[n])<<24\
  \ +\n\t\t\tuint32(hashValue[n+1])<<16 +\n\t\t\tuint32(hashValue[n+2])<<8 +\n\t\t\
  \tuint32(hashValue[n+3])\n\t\tfmt.Printf(\"%x \", val)\n\t}\n\tfmt.Println()\n}\n\
  ```\n\n该程序打印 \"b1946ac9 2492d234 7c6235b4 d2611184\"。\n\n这种方法的变体是 `HMAC`（密钥哈希消息认证码），它为哈希算法添加了一个密钥。使用这种方法的变化很小。要在使用密钥的\
  \ MD5 哈希，请将调用 `hash := md5.New()` 替换为以下内容：\n\n```go\nhash := hmac.New(md5.New, []byte(\"\
  secret\"))\n```\n\n\n\n\n\n有两种用于加密数据的主要机制。对称密钥加密使用加密和解密时相同的同一个密钥。加密代理双方和解密代理双方都必须知道此密钥。本文不讨论该密钥如何在代理双方之间传输。\n\
  \n与哈希算法一样，有许多加密算法。其中许多算法现在已被发现存在缺陷，而且随着计算机速度的提高，算法通常随着时间的推移而变得脆弱。Go 支持几种对称密钥算法，如\
  \ `AES` 和 `DES`。\n\n这些算法是 `block`（块）算法。也就是说，它们是对数据块的操作。如果你的数据没有按照块大小对齐，则必须在末尾添加额外的空白进行填充（pad）。\n\
  \n每个算法都由一个 `Cipher` 对象表示。它通过相应包中的 `NewCipher` 创建，并接受对称密钥作为参数。\n\n一旦你有了加密器，就可以用它来加密和解密数据块。我们使用\
  \ `AES-128`，它的密钥大小为 128 位（16 字节），块大小为 128 位。密钥的大小决定了使用哪个版本的 `AES`。一个用于说明此点的点的程序是\
  \ `Aes.go`：\n\n```go\n/* Aes\n*/\npackage main\n\nimport (\n\t\"bytes\"\n\t\"crypto/aes\"\
  \n\t\"fmt\"\n)\n\nfunc main() {\n\tkey := []byte(\"my key, len 16 b\")\n\tcipher,\
  \ err := aes.NewCipher(key)\n\tif err != nil {\n\t\tfmt.Println(err.Error())\n\t\
  }\n\tsrc := []byte(\"hello 16 b block\")\n\tvar enc [16]byte\n\tcipher.Encrypt(enc[0:],\
  \ src)\n\tvar decrypt [16]byte\n\tcipher.Decrypt(decrypt[0:], enc[0:])\n\tresult\
  \ := bytes.NewBuffer(nil)\n\tresult.Write(decrypt[0:])\n\tfmt.Println(string(result.Bytes()))\n\
  }\n```\n\n该程序使用共享的 16 字节密钥 \"my key, len 16 b\" 加密和解密 16 字节块 \"hello 16 b block\"\
  。\n\n126 \n第 7 章 ■ 安全\n\n#### 公钥加密\n\n另一种主要的加密类型是公钥加密。公钥加密和解密需要 `two`（两个）密钥：一个用于加密，另一个用于解密。加密密钥通常以某种方式公开，以便任何人都可以向你加密消息。解密密钥必须保持私密；否则，所有人都能解密这些消息！公钥系统是非对称的，不同的用途有不同的密钥。\n\
  \nGo 支持许多公钥加密系统。一个典型的方案是 `RSA` 方案。\n\n一个从随机数生成 RSA 私钥和公钥的程序是 `GenRSAKeys.go`：\n\n\
  ```go\n/* GenRSAKeys\n*/\npackage main\n\nimport (\n\t\"crypto/rand\"\n\t\"crypto/rsa\"\
  \n\t\"crypto/x509\"\n\t\"encoding/gob\"\n\t\"encoding/pem\"\n\t\"fmt\"\n\t\"os\"\
  \n)\n\nfunc main() {\n\treader := rand.Reader\n\tbitSize := 512\n\tkey, err := rsa.GenerateKey(reader,\
  \ bitSize)\n\tcheckError(err)\n\tfmt.Println(\"Private key primes\", key.Primes[0].String(),\
  \ key.Primes[1].String())\n\tfmt.Println(\"Private key exponent\", key.D.String())\n\
  \tpublicKey := key.PublicKey\n\tfmt.Println(\"Public key modulus\", publicKey.N.String())\n\
  \tfmt.Println(\"Public key exponent\", publicKey.E)\n\tsaveGobKey(\"private.key\"\
  , key)\n\tsaveGobKey(\"public.key\", publicKey)\n\tsavePEMKey(\"private.pem\", key)\n\
  }\n\nfunc saveGobKey(fileName string, key interface{}) {\n\toutFile, err := os.Create(fileName)\n\
  \tcheckError(err)\n\tencoder := gob.NewEncoder(outFile)\n\terr = encoder.Encode(key)\n\
  \tcheckError(err)\n\toutFile.Close()\n}\n\nfunc savePEMKey(fileName string, key\
  \ *rsa.PrivateKey) {\n\toutFile, err := os.Create(fileName)\n\tcheckError(err)\n\
  \tvar privateKey = &pem.Block{Type: \"RSA PRIVATE KEY\",\n\t\tBytes: x509.MarshalPKCS1PrivateKey(key)}\n\
  \tpem.Encode(outFile, privateKey)\n\toutFile.Close()\n}\n\nfunc checkError(err error)\
  \ {\n\tif err != nil {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\
  \t}\n}\n```\n\n该程序还使用 `gob` 序列化保存了证书。它们可以被 `LoadRSAKeys.go` 程序读取：\n\n```go\n/* LoadRSAKeys\n\
  */\npackage main\n\nimport (\n\t\"crypto/rsa\"\n\t\"encoding/gob\"\n\t\"fmt\"\n\t\
  \"os\"\n)\n\nfunc main() {\n\tvar key rsa.PrivateKey\n\tloadKey(\"private.key\"\
  , &key)\n\tfmt.Println(\"Private key primes\", key.Primes[0].String(), key.Primes[1].String())\n\
  \tfmt.Println(\"Private key exponent\", key.D.String())\n\tvar publicKey rsa.PublicKey\n\
  \tloadKey(\"public.key\", &publicKey)\n\tfmt.Println(\"Public key modulus\", publicKey.N.String())\n\
  \tfmt.Println(\"Public key exponent\", publicKey.E)\n}\n\nfunc loadKey(fileName\
  \ string, key interface{}) {\n\tinFile, err := os.Open(fileName)\n\tcheckError(err)\n\
  \tdecoder := gob.NewDecoder(inFile)\n\terr = decoder.Decode(key)\n\tcheckError(err)\n\
  \tinFile.Close()\n}\n```\n\n### 公钥基础设施 (PKI)\n\n公钥基础设施 (PKI) 是一套包含公钥以及所有者、位置和它们之间链接信息的框架。生成自签名证书并将其存储在\
  \ `.cer` 文件中的示例是 `X509.go`：\n\n```go\n/* X509\n*/\npackage main\n\nimport (\n\t\"\
  crypto/rand\"\n\t\"crypto/rsa\"\n\t\"crypto/x509\"\n\t\"crypto/x509/pkix\"\n\t\"\
  encoding/pem\"\n\t\"math/big\"\n\t\"os\"\n\t\"time\"\n)\n\nfunc main() {\n\trandom\
  \ := rand.Reader\n\tnow := time.Now()\n\tthen := now.Add(365 * 24 * 60 * 60) //\
  \ 一年\n\n\tkey, err := rsa.GenerateKey(random, 2048)\n\tcheckError(err)\n\n\ttemplate\
  \ := x509.Certificate{\n\t\tSerialNumber: big.NewInt(1),\n\t\tSubject: pkix.Name{\n\
  \t\t\tCommonName: \"localhost\",\n\t\t},\n\t\tNotBefore:             now,\n\t\t\
  NotAfter:              then,\n\t\tIsCA:                  true,\n\t\tKeyUsage:  \
  \            x509.KeyUsageCertSign | x509.KeyUsageKeyEncipherment | x509.KeyUsageDigitalSignature\
  \ | x509.KeyUsageDataEncation,\n\t\tExtKeyUsage:           []x509.ExtKeyUsage{x509.ExtKeyUsageServerAuth,\
  \ x509.ExtKeyUsageClientAuth},\n\t\tDNSNames:              []string{\"jan.newmarch\"\
  },\n\t}\n\n\tderBytes, err := x509.CreateCertificate(random, &template, &template,\
  \ &key.PublicKey, key)\n\tcheckError(err)\n\n\tcertCerFile, err := os.Create(\"\
  jan.newmarch.cer\")\n\tcheckError(err)\n\tcertCerFile.Write(derBytes)\n\tcertCerFile.Close()\n\
  \n\tcertPEMFile, err := os.Create(\"jan.newmarch.pem\")\n\tcheckError(err)\n\tpem.Encode(certPEMFile,\
  \ &pem.Block{Type: \"CERTIFICATE\", Bytes: derBytes})\n\tcertPEMFile.Close()\n}\n\
  \nfunc checkError(err error) {\n\tif err != nil {\n\t\tfmt.Println(\"Fatal error\
  \ \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n 浏览器使用它们来验证网站的身份。\n\n#### TLS\n\
  \n如果你必须自己完成所有繁重工作，那么加密/解密方案的作用将非常有限。目前互联网上用于提供加密消息传递的最流行的机制是 `TLS`（传输层安全协议），它以前被称为\
  \ `SSL`（安全套接层）。\n\n\n\n\n在 TLS 中，客户端和服务器使用 X.509 证书协商身份。一旦完成，它们之间就会生成一个秘密密钥，所有的加密/解密都将使用该密钥。协商过程相对较慢，但一旦完成，就会使用更快的密钥机制。服务器`要求`必须有一个证书；客户端在需要时`可以`拥有一个证书。\n\
  \n##### 基础客户端\n\n我们首先说明如何连接到由“已知”证书颁发机构（CA，如 `RSA`）签名的证书的服务器。从 Web 服务器获取头头部信息的程序可以修改为从\
  \ TLS Web 服务器获取头头部信息。该程序为 `TLSGetHead.go`。（我们在这里演示了 `TLS.Dial`，并将在后面的章节中讨论 `HTTPS`。）\n\
  \n```go\n/* TLSGetHead */\n\npackage main\n\nimport (\n\t\"crypto/tls\"\n\t\"fmt\"\
  \n\t\"io/ioutil\"\n\t\"os\"\n)\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\t\
  fmt.Println(\"Usage: \", os.Args[0], \"host:port\")\n\t\tos.Exit(1)\n\t}\n\tservice\
  \ := os.Args[1]\n\tconn, err := tls.Dial(\"tcp\", service, nil)\n\tcheckError(err)\n\
  \t_, err = conn.Write([]byte(\"HEAD / HTTP/1.0\\r\\n\\r\\n\"))\n\tcheckError(err)\n\
  \tresult, err := ioutil.ReadAll(conn)\n\tcheckError(err)\n\tfmt.Println(string(result))\n\
  \tconn.Close()\n\tos.Exit(0)\n}\n\nfunc checkError(err error) {\n\tif err != nil\
  \ {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\
  \n当针对适当站点（如 `www.google.com:443`）运行时：`go run TLSGetHead.go www.google.com:443`\n\
  \n它会产生如下输出：\n\n```http\nHTTP/1.0 302 Found\nCache-Control: private\nContent-Type:\
  \ text/html; charset=UTF-8\nLocation: https://www.google.com.au/?gfe_rd=cr&ei=L3lvWKSXMdPr8AfvhqKIBg\n\
  Content-Length: 263\nDate: Fri, 06 Jan 2017 11:02:07 GMT\nAlt-Svc: quic=\":443\"\
  ; ma=2592000; v=\"35,34\"\n```\n\n其他站点可能会产生其他响应，但此客户端仍然乐意与一个经过正确验证的服务器建立 TLS 会话。\n\
  \n针对站点 `www.gooogle.com (not`（多了一个 `o!`）运行这个程序很有有趣的：`go run TLSGetHead.go www.gooogle.com:443`\n\
  \n该站点实际上属于 Google，因为他们可能购买了它以降低欺诈风险。程序抛出了致命错误，因为该站点证书不是用于带有三个 `o` 的 `gooogle`：`Fatal\
  \ error x509: certificate is valid for google.com, *.2mdn.net, *.android.com, *.doubleclick.net,\
  \ *.cc.com, *.cloud.google.com, *.appengine.com, *.au, ...`\n\n像 Firefox 这样的浏览器也会给出安全警报。\n\
  \n##### 使用自签名证书的服务器\n\n如果服务器使用自签名证书（可能在内部使用或实验时使用），Go 包将生成错误：`x509: certificate\
  \ signed by unknown authority`。证书必须安装到客户端的操作系统中，或者客户端必须将证书安装为根 CA。我们将展示第二种方法。使用任何证书的\
  \ TLS 回显服务器服务器为 `TLSechoServer.go`：\n\n```go\n/* TLSechoServer */\npackage main\n\
  \nimport (\n\t\"crypto/rand\"\n\t\"crypto/tls\"\n\t\"fmt\"\n\t\"net\"\n\t\"time\"\
  \n)\n\nfunc main() {\n\tcert, err := tls.LoadX509KeyPair(\"newmarch.name.pem\",\
  \ \"private.pem\")\n\tcheckError(err)\n\tconfig := tls.Config{Certificates: []tls.Certificate{cert}}\n\
  \tnow := time.Now()\n\tconfig.Rand = rand.Reader\n\tservice := \"0.0.0.0:1200\"\n\
  \tlistener, err := tls.Listen(\"tcp\", service, &config)\n\tcheckError(err)\n\t\
  fmt.Println(\"Listening\")\n\tfor {\n\t\tconn, err := listener.Accept()\n\t\tif\
  \ err != nil {\n\t\t\tfmt.Println(err.Error())\n\t\t\tcontinue\n\t\t}\n\t\tfmt.Println(\"\
  Accepted\")\n\t\tgo handleClient(conn)\n\t}\n}\n\nfunc handleClient(conn net.Conn)\
  \ {\n\tdefer conn.Close()\n\tvar buf [512]byte\n\tfor {\n\t\tfmt.Println(\"Trying\
  \ to read\")\n\t\tn, err := conn.Read(buf[:])\n\t\tif err != nil {\n\t\t\tfmt.Println(err)\n\
  \t\t\treturn\n\t\t}\n\t\t_, err = conn.Write(buf[:n])\n\t\tif err != nil {\n\t\t\
  \treturn\n\t\t}\n\t}\n}\n\nfunc checkError(err error) {\n\tif err != nil {\n\t\t\
  fmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n如果证书是自签名的（此处此处如此），简单的\
  \ TLS 客户端将无法与此服务器工作。我们需要将配置作为 `TLS.Dial` 的第三个参数，其中安装了我们的证书作为根证书。感谢 Josh Blecher\
  \ 在“Getting x509: Certificate Signed by Unknown Authority”中展示了如何这样做。服务器通过 `TLSechoClient.go`\
  \ 正常工作。\n\n```go\n/* TLSechoClient */\npackage main\n\nimport (\n\t\"crypto/tls\"\
  \n\t\"crypto/x509\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tif len(os.Args)\
  \ != 2 {\n\t\tfmt.Println(\"Usage: \", os.Args[0], \"host:port\")\n\t\tos.Exit(1)\n\
  \t}\n\tservice := os.Args[1]\n\t// 加载自签名证书\n\tcertFile, err := os.Open(\"newmarch.name.pem\"\
  )\n\tcheckError(err)\n\tpemBytes := make([]byte, 1000) // 现在读取文件\n\t_, err = certFile.Read(pemBytes)\n\
  \tcheckError(err)\n\tcertFile.Close()\n\t// 创建新的证书池\n\tcertPool := x509.NewCertPool()\n\
  \t// 添加我们的证书\n\tok := certPool.AppendCertsFromPEM(pemBytes)\n\tif !ok {\n\t\tfmt.Println(\"\
  PEM 读取失败\")\n\t} else {\n\t\tfmt.Println(\"PEM 读取成功\")\n\t}\n\t// 连接，使用根证书配置\n\t\
  conn, err := tls.Dial(\"tcp\", service, &tls.Config{RootCAs: certPool})\n\tcheckError(err)\n\
  \t// 现在写入并读取\n\tvar buf [512]byte\n\tfor n := 0; n < 10; n++ {\n\t\tfmt.Println(\"\
  写入...\")\n\t\tconn.Write([]byte(\"Hello \"))\n\t\tn, err = conn.Read(buf[:])\n\t\
  \tcheckError(err)\n\t\tfmt.Println(string(buf[:n]))\n\t}\n\tconn.Close()\n\tos.Exit(0)\n\
  }\n\nfunc checkError(err error) {\n\tif err != nil {\n\t\tfmt.Println(\"Fatal error\
  \ \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n## 结论\n\n安全本身是一个巨大的领域，本章仅有略及。然而，已经涵盖了主要概念。没有强调的是在设计阶段需要多少安全性：事后考虑安全性几乎注定失败。\n\
  \n# 第 8 章：HTTP\n\n世界网是一个巨大的分布式系统，拥有数百万用户。站点通过运行 HTTP 服务器成为 Web 主机。虽然 Web 客户端通常是浏览器的用户，但还有许多其他“用户代理”，例如网络爬虫、Web\
  \ 应用客户端等。Web 构建在 HTTP 之上，HTTP 构建在 TCP 之上。HTTP 经历了四个可用版本。1.1（第三版）最常用，但预计将快速过渡到 HTTP/2，目前已占流量的\
  \ 10% 以上。\n\n本章概述 HTTP，然后介绍管理 HTTP 连接的 Go API。\n\n### URL 和资源\n\nURL 指定资源的位置。资源通常是静态文件，例如\
  \ HTML 文档、图像或声音文件。但现在，它可能是动态生成的对象，可能基于存储在数据库中的信息。\n\n当用户代理请求资源时，返回的不是资源本身，而是该资源的某种表示。例如，如果资源是静态文件，那么发送给用户代理的就是该文件的副本。\n\
  \n多个 URL 可能指向同一个资源，HTTP 服务器将为每个 URL 返回相应的资源表示。例如，一家公司可能通过不同的 URL 为内部和外部提供相同产品的信息。产品的内部表示可能包括该产品的内部联系人等信息，而外部表示可能包括销售该产品的商店位置。\n\
  \n\n\n这种资源的视图方式意味着 HTTP 协议可以非常简单且直观，而 HTTP 服务器可以任意复杂。HTTP 必须将来自用户代理的请求传递给服务器并返回一个字节流，而服务器可能需要对请求进行任何程度的处理。\n\
  \n# 国际化 (I18n)\n\n随着互联网国际化（`i18n`）的日益提高，出现了一些复杂性。主机名可以以国际化的形式给出，称为 `IDN`（国际化域名）。为了与不理解\
  \ Unicode 的旧版实现（如旧版本的电子邮件服务器）保持兼容性，非 ASCII 域名名被映射为名为 `punycode` 的 ASCII 表示。例如，域名\
  \ `日本語.jp` 对应的 punycode 值为 `xn—wgv71a119e.jp`。从非 ASCII 域名到 punycode 值的转换并不是由 Go\
  \ 的网络库（截至 Go 1.7 版本）自动完成的，但有一个名为 `golang.org/x/net/idna` 的扩展包可以在 Unicode 和其 punycode\
  \ 值之间进行转换。关于这个话题，在“Figure Out IDNA Punycode Story”([`github.com/golang/go/issues/13835`](https://github.com/golang/go/issues/13835))\
  \ 中有一个持续的讨论。\n\n国际化域名开启了所谓的同形攻击（`homograph` attacks）的可能性。许多 Unicode 字符外观相似，例如俄语的\
  \ `o` (`U+043E`)、希腊语的 `o` (`U+03BF`) 和英语的 `o` (`U+006F`)。使用同形字的域名（如 `google.com`，带有两个俄语\
  \ o）可能会导致混乱。目前已知多种防御方法，例如始终显示 punycode（此处为 `xn—ggle-55da.com`，使用 [Punycode 转换器](https://www.punycoder.com/)）。\n\
  \nURI/URL 中的路径处理更为复杂，因为它相对于运行在特定本地化环境下的 HTTP 服务器的相对路径。编码可能不是 `UTF-8`，甚至不是 Unicode。\n\
  \n`IRI`（国际化资源标识符）通过首先将任何本地化字符串转换为 `UTF-8`，然后对任何非 ASCII 字节进行百分转义来管理这个问题。W3C 题为“多语言\
  \ Web 地址介绍”的页面([`www.w3.org/International/articles/idn-and-iri/`](https://www.w3.org/International/articles/idn-and-iri/))\
  \ 提供了更多信息。\n\n从其他编码转换为 `UTF-8` 的内容在第 6 章有所介绍，而 Go 在 `net/url` 中提供了 `Queryescape`/`Queryunescape`\
  \ 函数，并在 Go 1.8 中提供了 `PathEscape`/`PathUnescape` 来进行百分比转换。\n\n### HTTP 特性\n\nHTTP\
  \ 是一种无状态、无连接且可靠的协议。在简单形式下，用户代理的每个请求都会被可靠地处理，然后断开。在 HTTP 的早期版本中，每个请求都涉及单独的 TCP 连接，因此如果需要许多资源（例如嵌入\
  \ HTML 页面中的图像），则必须在短时间内建立并销许多连接。HTTP 1.1 增加了许多优化，这为简单的结构增加了复杂性，但创建了一个更高效、可靠的协议。HTTP/2\
  \ 采用了二进制格式以获得进一步收益。\n\n#### 版本\n\nHTTP 有四个版本：\n- `Version 0.9` (1991)：完全过时\n- `Version\
  \ 1.0` (1996)：几乎过时\n- `Version 1.1` (1999)：目前最流行的版本\n- `Version 2` (2015)：最新版本\n\
  \n每个版本都必须理解早期版本的请求和响应。\n\n##### HTTP 0.9\n\n请求格式：\n```\nRequest = \"GET\" /index.html\
  \ HTTP/0.9\n```\n响应格式：\n```\nHTTP/0.9 200 OK\n```\n\n##### HTTP 1.0\n\n此版本增加了请求和响应的复杂性。为了与旧版本保持兼容，HTTP\
  \ 必须理解早期版本的请求。服务器可能对请求进行任何程度的处理。\n\n请求格式：\n```\nRequest = GET /index.html HTTP/1.0\n\
  ```\n响应格式：\n```\nHTTP/1.0 200 OK\n```\n状态码如下：\n```\nHTTP/1.0 200 OK\n```\n服务器可以返回任何信息。例如：\n\
  ```\nGET /index.html HTTP/1.0\n```\n\n##### HTTP 1.1\n\nHTTP 1.1 解决了许多 1.0 的问题，但由于这些原因变得更加复杂。这是通过扩展或细化\
  \ 1.0 的可用选项来实现的。\n\n请求格式：\n```\nGET /index.html HTTP/1.1\n```\n响应格式：\n```\nHTTP/1.1\
  \ 200 OK\n```\n状态码如下：\n```\nHTTP/1.1 200 OK\n```\n- 200：OK\n- 201：Created\n- 202：Accepted\n\
  - 204：No Content\n- 301：Moved permanently\n- 302：Moved temporarily\n- 304：Not modified\n\
  - 400：Bad request\n- 401：Unauthorized\n- 403：Forbidden\n- 404：Not found\n- 500：Internal\
  \ server error\n- 501：Not implemented\n- 502：Bad gateway\n- 503：Service unavailable\n\
  \n状态行提供了信息：\n```\nHTTP/1.1 200 OK\n```\nHTTP 1.1 严格了请求 URL 的规则以允许代理处理。如果请求通过代理定向，URL\
  \ 应该是绝对 URL，例如：\n```\nGET http://www.w3.org/index.html HTTP/1.1\n```\n否则应使用绝对路径并包含\
  \ `Host` 头部字段，例如：\n```\nGET /index.html HTTP/1.1\nHost: www.w3.org\n```\n更改包括：\n\
  - 主机名识别（允许虚拟主机）\n- 内容协商（多语言）\n- 持久连接（减少 TCP 开销；这非常复杂）\n- 分块传输\n- 字节范围（请求文档部分）\n\
  - 代理支持\n\n\n\n\n用户代理（如浏览器）会发送请求并获取响应。这涉及到 Go 类型以及相关的的方法调用。\n\n## 响应类型\n\n响应类型如下：\n\
  \n```go\ntype Response struct {\n\tStatus string // e.g. \"200 OK\"\n\tStatusCode\
  \ int // e.g. 200\n\tProto string // e.g. \"HTTP/1.0\"\n\tProtoMajor int // e.g.\
  \ 1\n\tProtoMinor int // e.g. 0\n\tHeader map[string][]string\n\tBody io.ReadCloser\n\
  \tContentLength int64\n\tTransferEncoding []string\n\tClose bool\n\tTrailer map[string][]string\n\
  \tRequest *Request // 原始请求\n\tTLS *tls.ConnectionState // 关于 TLS 连接的信息或 nil\n}\n\
  ```\n\n## HEAD 方法\n\n我们通过示例来检查这个数据结构。每个 HTTP 请求类型在 `net/http` 包中都有其对应的 Go 函数。最简单的请求来自一个名为\
  \ `HEAD` 的用户代理，它请求有关资源及其 HTTP 服务器的信息。可以使用此函数来执行查询：\n\n```go\nfunc Head(url string)\
  \ (r *Response, err error)\n```\n\n响应的状态存储在响应字段 `Status` 中，而 `Header` 字段是 HTTP 响应中头部字段的映射。一个名为\
  \ `Head.go` 的程序执行此请求并显示结果如下：\n\n```go\n/* Head */\npackage main\n\nimport (\n\t\"\
  fmt\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\
  \tfmt.Println(\"Usage: \", os.Args[0], \"host:port\")\n\t\tos.Exit(1)\n\t}\n\turl\
  \ := os.Args[1]\n\tresponse, err := http.Head(url)\n\tif err != nil {\n\t\tfmt.Println(err.Error())\n\
  \t\tos.Exit(2)\n\t}\n\tfmt.Println(response.Status)\n\tfor k, v := range response.Header\
  \ {\n\t\tfmt.Println(k+\":\", v)\n\t}\n\tos.Exit(0)\n}\n```\n\n当针对资源运行运行时，如下所示：\n\
  \n```bash\ngo run Head.go http://www.golang.com/\n```\n\n它会输出类似的内容：\n\n```text\n\
  200 OK\nDate: [Fri, 06 Jan 2017 11:20:37 GMT]\nServer: [Google Frontend]\nContent-Length:\
  \ [7902]\nAlt-Svc: [quic=\":443\"; ma=2592000; v=\"35,34\"]\nStrict-Transport-Security:\
  \ [max-age=31536000; preload]\nContent-Type: [text/html; charset=utf-8]\nX-Cloud-Trace-Context:\
  \ [6e28ebc86bb1026ae7b784c891d0117c]\n```\n\n响应来自一个我们无法控制的服务器，它在途中可能会经过其他服务器。显示的字段可能不同，字段的值肯定也会不同。\n\
  \n## GET 方法\n\n通常，我们想要获取资源的表示，而不仅仅是获取关于它的信息。`GET` 请求会执行此操作，可以通过以下方式完成：\n\n```go\n\
  func Get(url string) (r *Response, finalURL string, err error)\n```\n\n响应的内容在响应字段\
  \ `Body` 中，其类型为 `io.ReadCloser`。我们可以用程序 `Get.go` 将内容打印到屏幕上：\n\n```go\n/* Get */\n\
  package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptil\"\n\t\"\
  os\"\n\t\"strings\"\n)\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"\
  Usage: \", os.Args[0], \"host:port\")\n\t\tos.Exit(1)\n\t}\n\turl := os.Args[1]\n\
  \tresponse, err := http.Get(url)\n\tif err != nil {\n\t\tfmt.Println(err.Error())\n\
  \t\tos.Exit(2)\n\t}\n\tif response.Status != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\
  \t\tos.Exit(2)\n\t}\n\tfmt.Println(\"The response header is\")\n\tb, _ := httil.DumpResponse(response,\
  \ false)\n\tfmt.Print(string(b))\n\tcontentTypes := response.Header[\"Content-Type\"\
  ]\n\tif !acceptableCharset(contentTypes) {\n\t\tfmt.Println(\"Cannot handle\", contentTypes)\n\
  \t\tos.Exit(4)\n\t}\n\tfmt.Println(\"The response body is\")\n\tvar buf [512]byte\n\
  \treader := response.Body\n\tfor {\n\t\tn, err := reader.Read(buf[:])\n\t\tif err\
  \ != nil {\n\t\t\tos.Exit(0)\n\t\t}\n\t\tfmt.Print(string(buf[:n]))\n\t}\n}\n\n\
  func acceptableCharset(contentTypes []string) bool {\n\t// 每个类型都像 \"text/html; charset=utf-8\"\
  \n\t// 我们只需要 UTF-8\n\tfor _, cType := range contentTypes {\n\t\tif strings.Index(cType,\
  \ \"utf-8\") != -1 {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n```\n\n\
  当它针对 `http://www.golang.com` 运行如下：\n\n```bash\ngo run Get.go http://www.golang.com\n\
  ```\n\n响应头部是：\n\n```text\nHTTP/2.0 200 OK\nContent-Length: 7902\nAlt-Svc: quic=\"\
  :443\"; ma=2592000; v=\"35,34\"\nContent-Type: text/html; charset=utf-8\nDate: Fri,\
  \ 06 Jan 2017 11:29:12 GMT\nServer: Google Frontend\nStrict-Transport-Security:\
  \ max-age=31536000; preload\nX-Cloud-Trace-Context: ea9b41b796f379af487388b474\n\
  ```\n\n响应体是：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=utf-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <title>The Go Programming</title>\n\
  ```\n\n\n\n\n客户端设置字符集（charset）请求非常简单。但对于服务器返回的字符集值，目前存在一些困惑。返回的资源*应该*具有 `Content-Type`，它将指定内容的媒体类型，例如\
  \ `text/html`。如果合适，媒体类型应该说明字符集，例如 `text/html; charset=UTF-8`。如果没有指定字符集，根据 HTTP 规范，它应该被处理为默认的\
  \ `ISO8859-1` 字符集。但 HTML4 规范规定，由于许多服务器并不符合这一点，因此你不能做出任何假设。\n\n如果服务器的 `Content-Type`\
  \ 中指定了字符集，则假设它是正确的。如果没有指定，由于超过 50% 的页面使用 `UTF-8` 且某些页面使用 `ASCII`，因此假设 `UTF-8` 是安全的。\n\
  \n少于 10% 的页面可能是错误的 :-(。\n\n146\n\n第 8 章 ■ http\n\n## Client 对象\n\n要向服务器发送请求并获取响应，使用方便对象\
  \ `Client` 是最简单的方法。该对象可以管理多个请求，并处理诸如服务器是否保持 TCP 连接存活等问题。\n\n这在下面的程序 `ClientGet.go`\
  \ 中得到了说明。\n\n程序展示了如何添加 HTTP 请求头，我们添加了 `Accept-Charset` 头以仅接受 `UTF-8`。这里有一个小故障，是由\
  \ Go 的 bug 引起的，该 bug 在 Go 1.8 中才被修复。`Client.Do` 函数如果收到 `301`、`302`、`303` 或 `307`\
  \ 响应会自动进行重定向。在 Go 1.8 之前，它不会在重定向时复制 HTTP 请求头。\n\n如果你尝试访问 `http://www.google.com/`\
  \ 等站点，它将重定向到 `http://www.google.com.au/` 等站点，但会丢失 `Accept-Charset` 头并返回 `ISO8859-1`（根据\
  \ 1999 年的 HTTP 1.1 规范，应该是这样的！）。前提是——即程序在 Go 1.8 之前的版本可能无法给出正确结果——程序如下：\n\n```\n\
  /* ClientGet */\n\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httputil\"\
  \n\t\"net/url\"\n\t\"os\"\n\t\"strings\"\n)\n\nfunc main() {\n\tif len(os.Args)\
  \ != 2 {\n\t\tfmt.Println(\"Usage: \", os.Args[0], \"http://host:port/page\")\n\t\
  \tos.Exit(1)\n\t}\n\n\turl, err := url.Parse(os.Args[1])\n\tcheckError(err)\n\t\
  client := &http.Client{}\n\trequest, err := http.NewRequest(\"HEAD\", url.String(),\
  \ nil)\n\t// only accept UTF-8\n\trequest.Header.Add(\"Accept-Charset\", \"utf-8;q=1,\
  \ ISO-8859-1;q=0\")\n\tcheckError(err)\n\tresponse, err := client.Do(request)\n\t\
  checkError(err)\n\tif response.Status != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\
  \t\tos.Exit(2)\n\t}\n\n147\n\n\tfmt.Println(\"The response header is\")\n\tb, _\
  \ := httputil.DumpResponse(response, false)\n\tfmt.Print(string(b))\n\tchSet :=\
  \ getCharset(response)\n\tif chSet != \"utf-8\" {\n\t\tfmt.Println(\"Cannot handle\"\
  , chSet)\n\t\tos.Exit(4)\n\t}\n\n\tvar buf [512]byte\n\treader := response.Body\n\
  \tfmt.Println(\"got body\")\n\tfor {\n\t\tn, err := reader.Read(buf[0:])\n\t\tif\
  \ err != nil {\n\t\t\tos.Exit(0)\n\t\t}\n\t\tfmt.Print(string(buf[0:n]))\n\t}\n\t\
  os.Exit(0)\n}\n\nfunc getCharset(response *http.Response) string {\n\tcontentType\
  \ := response.Header.Get(\"Content-Type\")\n\tif contentType == \"\" {\n\t\t// guess\n\
  \t\treturn \"utf-8\"\n\t}\n\n\tidx := strings.Index(contentType, \"charset=\")\n\
  \tif idx == -1 {\n\t\t// guess\n\t\treturn \"utf-8\"\n\t}\n\n\tchSet := strings.Trim(contentType[idx+8:],\
  \ \" \")\n\treturn strings.ToLower(chSet)\n}\n\nfunc checkError(err error) {\n\t\
  if err != nil {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\
  \t}\n}\n```\n\n该程序的运行方式如下：\n\n`go run ClientGet.go http://www.golang.com`\n\n148\n\
  \n第 8 章 ■ http\n\n## 代理处理\n\n现在 HTTP 请求通过特定的代理是非常常见的。除了形成 TCP 连接并在应用层的服务器外，公司使用代理来限制员工可以看到的内容，许多机构使用\
  \ `Cloudflare` 等代理服务作为缓存，减轻服务器负载。通过代理访问网站需要客户端进行额外的处理。\n\n### 简单代理\n\nHTTP 1.1 规定了\
  \ HTTP 如何通过代理工作。应该向代理发送 `GET` 请求。然而，请求的 URL 应该是目的完整 URL。此外，HTTP 头应该包含 `Host` 字段。\n\
  \n下面的程序 `ProxyGet.go` 阐释了：\n\n```go\n/* ProxyGet */\n\npackage main\n\nimport (\n\
  \t\"fmt\"\n\t\"io\"\n\t\"net/http\"\n\t\"net/http/httputil\"\n\t\"net/url\"\n\t\"\
  os\"\n)\n\nfunc main() {\n\tif len(os.Args) != 3 {\n\t\tfmt.Println(\"Usage: \"\
  , os.Args[0], \"http://host:port\", \"http://host/page\")\n\t\tos.Exit(1)\n\t}\n\
  \n\tproxyString := os.Args[1]\n\tproxyURL, err := url.Parse(proxyString)\n\tcheckError(err)\n\
  \n\trawURL := os.Args[2]\n149\n\n\turl, err := url.Parse(rawURL)\n\tcheckError(err)\n\
  \ttransport := &http.Transport{Proxy: proxyURL}\n\tclient := &http.Client{Transport:\
  \ transport}\n\n\trequest, err := http.NewRequest(\"GET\", url.String(), nil)\n\t\
  checkError(err)\n\n\turlp, _ := transport.Proxy(request)\n\tfmt.Println(\"Proxy\
  \ \", urlp)\n\tdump, _ := httputil.DumpRequest(request, false)\n\tfmt.Println(string(dump))\n\
  \n\tresponse, err := client.Do(request)\n\tcheckError(err)\n\n\tif response.Status\
  \ != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\t\tos.Exit(2)\n\t}\n\n\tfmt.Println(\"\
  Response ok\")\n\tvar buf [512]byte\n\treader := response.Body\n\tfor {\n\t\tn,\
  \ err := reader.Read(buf[0:])\n\t\tif err != nil {\n\t\t\tos.Exit(0)\n\t\t}\n\t\t\
  fmt.Print(string(buf[0:n]))\n\t}\n\tos.Exit(0)\n}\n\nfunc checkError(err error)\
  \ {\n\tif err != nil {\n\t\tif err == io.EOF {\n\t\t\treturn\n\t\t}\n\t\tfmt.Println(\"\
  Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n如果你在 `XYZ.com` 的 `8080`\
  \ 端口上有一个代理，你可以这样测试：\n\n`go run ProxyGet.go http://XYZ.com:8080 http://www.google.com`\n\
  \n150\n\n第 8 章 ■ http\n\n如果你没有合适的代理来测试，请在自己的电脑上下载并安装 Squid 代理 ([`www.squid-cache.org/`](http://www.squid-cache.org/))。\n\
  \n此程序使用了作为参数传递给程序的已知代理。有很多方法可以让应用程序感知代理。大多数浏览器都有配置菜单，可以在其中输入代理信息：Go 应用程序无法获取此类信息。某些应用程序可以使用网络代理自动发现协议\
  \ ([`en.wikipedia.org/wiki/Web_Proxy_Autodiscovery_Protocol`](https://en.wikipedia.org/wiki/Web_Proxy_Autodiscovery_Protocol))\
  \ 从网络中通常被称为 `autoproxy.pac` 的文件中获取代理信息。Go（尚不）不知道如何解析这些 JavaScript 文件，因此无法使用它们。特定的操作系统可能有系统特定的指定代理的方法。Go\
  \ 无法访问这些。但如果代理设置在操作系统环境变量（如 `HTTP_PROXY` 或 `http_proxy`）中，它可以通过此函数找到代理信息：`func ProxyFromEnvironment(req\
  \ *Request) (*url.URL, error)`。\n\n如果你的程序运行在这样的环境中，可以使用此函数，而不需要显式地知道代理参数。\n\n\n\n\
  \n某些代理需要通过用户名和密码进行验证才能通过请求。一种常见的方案是“基础认证”（basic authentication），即将用户名和密码拼接成字符串 \"\
  user:password\"，然后进行 Base64 编码。随后通过 HTTP 请求头 \"Proxy-Authorization\" 传递给代理，并标记其为基础认证。\n\
  \n以下程序 `ProxyAuthGet.go` 演示了这一点，它在之前的代理程序基础上添加了 `Proxy-Authentication` 头：\n\n```go\n\
  /* ProxyAuthGet\n*/\n\npackage main\n\nimport (\n\t\"encoding/base64\"\n\t\"fmt\"\
  \n\t\"io\"\n\t\"net/http\"\n\t\"net/http/httputil\"\n\t\"net/url\"\n\t\"os\"\n)\n\
  \nconst auth = \"jannewmarch:mypassword\"\n\nfunc main() {\n\tif len(os.Args) !=\
  \ 3 {\n\t\tfmt.Println(\"Usage: \", os.Args[0], \"http://proxy-host:port http://host:port/page\"\
  )\n\t\tos.Exit(1)\n\t}\n\n\tproxy := os.Args[1]\n\tproxyURL, err := url.Parse(proxy)\n\
  \tcheckError(err)\n\n\trawURL := os.Args[2]\n\turl, err := url.Parse(rawURL)\n\t\
  checkError(err)\n\n\t// encode the auth\n\tbasic := \"Basic \" + base64.StdEncoding.EncodeToString([]byte(auth))\n\
  \ttransport := &http.Transport{Proxy: http.ProxyURL(proxyURL)}\n\tclient := &http.Client{Transport:\
  \ transport}\n\trequest, err := http.NewRequest(\"GET\", url.String(), nil)\n\t\
  request.Header.Add(\"Proxy-Authorization\", basic)\n\tdump, _ := httputil.DumpRequest(request,\
  \ false)\n\tfmt.Println(string(dump))\n\n\t// send the request\n\tresponse, err\
  \ := client.Do(request)\n\tcheckError(err)\n\tfmt.Println(\"Read ok\")\n\tif response.Status\
  \ != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\t\tos.Exit(2)\n\t}\n\tfmt.Println(\"\
  Response ok\")\n\tvar buf [512]byte\n\treader := response.Body\n\tfor {\n\t\tn,\
  \ err := reader.Read(buf[0:])\n\t\tif err != nil {\n\t\t\tos.Exit(0)\n\t\t}\n\t\t\
  fmt.Print(string(buf[0:n]))\n\t}\n\tos.Exit(0)\n}\n\nfunc checkError(err error)\
  \ {\n\tif err != nil {\n\t\tif err == io.EOF {\n\t\t\treturn\n\t\t}\n\t\tfmt.Println(\"\
  Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n该程序似乎没有公开可用的测试站点。我在使用身份验证代理的办公环境中对其进行了测试。设置这样的代理超出了本书的讨论范围。关于如何进行设置，有一篇讨论称为“如何设置带有基础用户名和密码认证的\
  \ Squid 代理”（参见 http://stackoverflow.com/questions/3297196/how-to-set-up-a-squid-proxy-with-basic-username-and-password-authentication）。\n\
  \n## 客户端的 HTTPS 连接\n\n对于安全的加密连接，HTTP 使用 `TLS`，这在第 7 章中介绍。`HTTP+TLS` 协议被称为 HTTPS，并使用\
  \ `https://` URL 而不是 `http://` URL。\n\n服务器要求在客户端接受其数据之前返回有效的 `X.509` 证书。如果证书有效，Go\
  \ 就会在底层处理好一切，之前提供的客户端可以在 `https` URL 下正常运行。这意味着，诸如较早的 `ClientGet.go` 等程序无需更改即可运行——你只需要给它们一个\
  \ HTTPS URL 即可。\n\n许多网站的证书是无效。它们可能已经过期，可能是自签名的而非受认可证书颁发机构签名，或者可能存在错误（例如服务器名称错误）。Firefox\
  \ 等浏览器会显示一个带有“带我离开这里！”按钮的巨大警告通知，但你可以自担风险继续操作，许多人正是这么做的。\n\nGo 目前在遇到证书错误时会直接退出。不过，你可以配置客户端来忽略证书错误。当然，这并不是建议的做法——证书配置错误的网站可能还存在其他问题。\n\
  \n在第 7 章中，我们生成了自签名的 `X.509` 证书。在本章的稍后部分，我们将提供一个使用 `X.509` 证书的 HTTPS 服务器，如果使用了自签名证书，那么\
  \ `ClientGet.go` 将产生此错误：\n\n`x509: certificate signed by unknown authority`\n\n\
  移除这些错误并继续运行的客户端是通过开启 Transport 配置标志 `InsecureSkipVerify` 实现的。该程序是 `TLSUnsafeClientGet.go`：\n\
  \n```go\n/* TLSUnsafeClientGet\n*/\n\npackage main\n\nimport (\n\t\"crypto/tls\"\
  \n\t\"fmt\"\n\t\"net/http\"\n\t\"net/url\"\n\t\"os\"\n\t\"strings\"\n)\n\nfunc main()\
  \ {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"Usage: \", os.Args[0], \"http://proxy-host:port\
  \ http://host:port/page\")\n\t\tos.Exit(1)\n\t}\n\n\turl, err := url.Parse(os.Args[1])\n\
  \tcheckError(err)\n\n\tif url.Scheme != \"https\" {\n\t\tfmt.Println(\"Not https\
  \ \", url.Scheme)\n\t\tos.Exit(1)\n\t}\n\n\ttransport := &http.Transport{}\n\ttransport.TLSClientConfig\
  \ = &tls.Config{InsecureSkipVerify: true}\n\tclient := &http.Client{Transport: transport}\n\
  \n\trequest, err := http.NewRequest(\"GET\", url.String(), nil)\n\tcheckError(err)\n\
  \n\tresponse, err := client.Do(request)\n\tcheckError(err)\n\n\tfmt.Println(\"Read\
  \ ok\")\n\tif response.Status != \"200 OK\" {\n\t\tfmt.Println(response.Status)\n\
  \t\tos.Exit(2)\n\t}\n\tfmt.Println(\"Response ok\")\n\tchSet := getCharset(response)\n\
  \tfmt.Printf(\"got charset %s\\n\", chSet)\n\tif chSet != \"UTF-8\" {\n\t\tfmt.Println(\"\
  Cannot handle\", chSet)\n\t\tos.Exit(4)\n\t}\n\n\tvar buf [512]byte\n\treader :=\
  \ response.Body\n\tfor {\n\t\tn, err := reader.Read(buf[0:])\n\t\tif err != nil\
  \ {\n\t\t\tos.Exit(0)\n\t\t}\n\t\tfmt.Print(string(buf[0:n]))\n\t}\n\tos.Exit(0)\n\
  }\n\nfunc getCharset(response *http.Response) string {\n\tcontentType := response.Header.Get(\"\
  Content-Type\")\n\tif contentType == \"\" {\n\t\treturn \"UTF-8\"\n\t}\n\tidx :=\
  \ strings.Index(contentType, \":\")\n\tif idx == -1 {\n\t\treturn \"UTF-8\"\n\t\
  }\n\treturn strings.Trim(contentType[idx:], \" \")\n}\n```\n\n\n\n在上一个程序中，处理器作为第二个参数传递给\
  \ `ListenAndServe`。可以先通过调用 `Handle` 或 `HandleFunc` 注册任意数量的处理器，其签名如下：`func Handle(pattern\
  \ string, handler Handler)`\n\n```\nfunc HandleFunc(pattern string, handler func(ResponseWriter,\
  \ *Request))\n```\n\n`ListenAndServe` 的第二个参数可以是 `nil`，此时调用将将分发给所有已注册的处理器。每个处理器应该有不同的\
  \ URL 模式。例如，文件处理器可能拥有 URL 模式 `/`，而函数处理器可能拥有 URL 模式 `/cgi-bin`。更具体的模式将比更通用的模式具有更高的优先级。\n\
  \n常见的 CGI 程序有 `test-cgi`（用 shell 编写）和 `printenv`（用 Perl 编写），它们会打印环境变量的值。可以编写一个工作方式与\
  \ `PrintEnv.go` 类似的处理器。\n\n```go\n/* Print Env */\n\npackage main\n\nimport (\n\t\
  \"fmt\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\t// 大多数文件的文件处理器\n\tfileServer\
  \ := http.FileServer(http.Dir(\"/var/www\"))\n\thttp.Handle(\"/\", fileServer)\n\
  \n\t// 用于 /cgi-bin/printenv 的函数处理器\n\thttp.HandleFunc(\"/cgi-bin/printenv\", printEnv)\n\
  \n\t// 将请求分发给处理器\n\terr := http.ListenAndServe(\":8000\", nil)\n\tcheckError(err)\n\
  \t// 就这样！\n}\n\nfunc printEnv(writer http.ResponseWriter, req *http.Request) {\n\
  \tenv := os.Environ()\n\twriter.Write([]byte(\"<h1>Environment</h1>\\n<pre>\"))\n\
  \tfor _, v := range env {\n\t\twriter.Write([]byte(v + \"\\n\"))\n\t}\n\twriter.Write([]byte(\"\
  </pre>\"))\n}\n\nfunc checkError(err error) {\n\tif err != nil {\n\t\tfmt.Println(\"\
  Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n**注意**：为了简单起见，此程序没有交付格式良好的\
  \ HTML。它缺少 `html`、`head` 和 `body` 标签。在本地运行该程序并将浏览器指向 `http://localhost/cgi-bin/printenv`，我的电脑上会产生如下输出：\n\
  \n```text\nEnvironment\nXDG_VTNR=7\nXDG_SESSION_ID=c2\nCLUTTER_IM_MODULE=xim\nXDG_GREETER_DATA_DIR=/var/lib/lightdm-data/newmarch\n\
  SESSION=gnome-flashback-compiz\nGPG_AGENT_INFO=/home/newmarch/.gnupg/S.gpg-agent:0:1\n\
  TERM=xterm-256color\nSHELL=/bin/bash\n...\n```\n\n在此程序中使用 `cgi-bin` 目录有点狡猾：它并没有像\
  \ CGI 脚本那样调用外部程序。它只是调用了 Go 函数 `printEnv`。Go 确实有使用 `os.ForkExec` 调用外部程序的能力，但尚未支持像\
  \ Apache 的 `mod_perl` 那样的动态链接模块。\n\n## 绕过默认多路复用器\n\nGo 服务器接收到的 HTTP 请求通常由多路复用器处理，它检查请求\
  \ 请求路径并调用适当的文件处理器等。你可以定义自己的处理器。可以通过调用 `HandleFunc` 将它们注册到默认多路复用器，该函数接受一个 `pattern`\
  \ 和一个 `function`。在上一个例子中就是这样做。然而，如果你想接管多路复用器的角色，可以给 `ListenAndServe` 传递一个非空函数作为处理器。下面的示例非常简单，但它说明了这种用法：多路复用器对所有\
  \ `ServerHandler.go` 的请求简单地返回“204 No content”。\n\n```go\n/* ServerHandler */\npackage\
  \ main\n\nimport (\n\t\"net/http\"\n)\n\nfunc main() {\n\tmyHandler := http.HandlerFunc(func(rw\
  \ http.ResponseWriter, request *http.Request) {\n\t\t// 只返回无内容 - 可以设置任意标头\n\t\t\
  rw.WriteHeader(http.StatusNoContent)\n\t})\n\thttp.ListenAndServe(\":8080\", myHandler)\n\
  }\n```\n\n可以通过对服务器运行 `telnet` 来测试服务器，从而产生如下输出：\n\n```text\n$ telnet localhost 8080\n\
  Trying to connect...\nConnected to localhost.8080.\nGET / HTTP/1.1\nHost: localhost:8080\n\
  User-Agent: curl/7.47.0\nAccept: */\nHTTP/1.1 204 No Content\nDate: Wed, 08 Mar\
  \ 2017 08:46:35 GMT\nConnection: host left intact\n```\n\n## HTTPS\n\n对于安全的加密连接，HTTP\
  \ 使用了 `TLS`，这在第 7 章中会有描述。HTTP+TLS 协议被称为 HTTPS，并使用 `https://` URL 代替 `http://` URL。为了让服务器使用\
  \ HTTPS，它需要一个 X509 证书和一个用于该证书的私钥文件。Go 要求这些必须是 PEM 编码的。然后将 HTTP 函数 `ListenAndServe`\
  \ 替换为 HTTPS (HTTP+TLS) 函数 `ListenAndServeTLS`。之前提供的文件服务器程序可以写成 HTTPS 服务器，即 `HTTPSServer.go`：\n\
  \n```go\n/* HTTPSServer */\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\
  \t\"os\"\n)\n\nfunc main() {\n\t// 从目录 /var/www 交付文件\n\tfileServer := http.FileServer(http.Dir(\"\
  /var/www\"))\n\t// 注册处理器并将请求分发给它\n\terr := http.ListenAndServeTLS(\":8000\", \"\
  jan.newmarch.name.pem\", \"private.pem\", fileServer)\n\tcheckError(err)\n\t// 就这样！\n\
  }\n\nfunc checkError(err error) {\n\tif err != nil {\n\t\tfmt.Println(\"Fatal error\
  \ \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\n该服务器可以通过 `https://localhost:8000/index.html`\
  \ 等进行访问。如果证书是自签名证书，则需要一个不安全的客户端来访问服务器内容。例如：`curl -kv https://localhost:8000`。如果你想要既支持\
  \ HTTP 又支持 HTTPS 的服务器，可以在自己的协程（routine）中运行每个监听器。\n\n## 结论\n\nGo 对 HTTP 有广泛的支持。这并不意外，因为\
  \ Go 的发明某种程度上是为了满足 Google 对其自有服务器的需求。本章讨论了 Go 为 HTTP 和 HTTPS 提供的各种层级的支持。\n\n# 第\
  \ 9 章：模板\n\n大多数服务器端语言都有一种机制，用于处理静态页面并插入动态生成的组件（例如项目列表）。典型的例子是 Java Server Pages、PHP\
  \ 脚本以及许多其他。Go 在 `template` 包中采用了一种相对简单的脚本语言。\n\n该包的设计旨在接收文本作为输入，并根据对象的值输出不同的文本。与\
  \ JSP 不同，它不限于 HTML 文件，但在那里可能会有最大的用途。我们首先描述 `text/template` 包。\n\n原始源码由不封样传输的文本和可以操作并更改文本的嵌入命令组成。命令由\
  \ `{{ ... }}` 分隔，类似于 JSP 命令 `<%= ... %>` 和 PHP 的 `<?php ... ?>`。\n\n### 对象值\n\n\
  模板被应用于一个 Go 对象。该 Go 对象的字段可以插入到模板中，你可以“挖掘”该对象以找到子字段等。当前对象表示为游标 `.`，因此要将当前对象的值作为字符串插入，应使用\
  \ `{{.}}`。该包默认使用 `fmt` 包来计算用作插入值的字符串。\n\n要插入当前游标对象的字段值，使用带有 `.` 前缀的字段名。例如，如果当前游标对象的类型为：\n\
  \n```go\ntype Person struct {\n\tName string\n\tAge int\n\tEmails []string\n\tJobs\
  \ []*Job\n}\n```\n\n你可以按如下方式插入 `Name` 和 `Age` 的值：\n\n名字是 {{.Name}}.\n\n年龄是 {{.Age}}.\n\
  \n\n\n\n你可以使用 `range` 命令来遍历数组或其他列表的元素。因此，要访问 `Emails` 数组的内容，你可以使用以下代码：\n\n```go\n\
  {{range .Emails}}\nThe email is {{.}}\n{{end}}\n```\n\n在遍历电子邮件期间，游标 `.` 会依次被设置为每封电子邮件。循环结束后，游标会恢复到原来的个人对象（person）。如果\
  \ `Job` 定义如下：\n\n```go\ntype Job struct {\n  Employer string\n  Role string\n}\n\
  ```\n\n如果我们想访问一个人的工作列表（jobs）的字段，可以像上面一样通过 `{{range .Jobs}}` 来实现。\n\n另一种方法是将当前对象切换到\
  \ `Jobs` 字段。这是通过 `{{with ...}}` ... `{{end}}` 结构实现的，此时 `{{` 指的是 `Jobs` 字段，它是一个数组：\n\
  \n```go\n{{with .Jobs}}\n{{range .}}\nAn employer is {{.Employer}}\nand the role\
  \ is {{.Role}}\n{{end}}\n{{end}}\n```\n\n你可以将此用于任何字段，而不仅仅是数组。\n\n## 使用模板\n\n一旦你有了模板，就可以将其应用到对象以生成新字符串，并使用该对象填充模板中的值。这是一个两步过程，涉及解析模板然后将其应用到对象。结果输出到\
  \ `Writer`，如下所示：\n\n```go\nt := template.New(\"Person template\")\nt, err := t.Parse(templ)\n\
  if err == nil {\n  buff := bytes.NewBufferString(\"\")\n  t.Execute(buff, person)\n\
  }\n```\n\n一个将模板应用到对象并打印到标准输出的示例程序是 `PrintPerson.go`：\n\n```go\n/**\n* PrintPerson\n\
  \ */\npackage main\n\nimport (\n  \"fmt\"\n  \"text/template\"\n  \"os\"\n)\n\n\
  type Person struct {\n  Name string\n  Age int\n  Emails []string\n  Jobs []*Job\n\
  }\n\ntype Job struct {\n  Employer string\n  Role string\n}\n\nconst templ = `The\
  \ name is {{.Name}}.\nThe age is {{.Age}}.\n{{range .Emails}}\nAn email is {{.}}\n\
  {{end}}\n{{with .Jobs}}\n{{range .}}\nAn employer is {{.Employer}}\nand the role\
  \ is {{.Role}}\n{{end}}\n{{end}}`\n\nfunc main() {\n  job1 := Job{Employer: \"Box\
  \ Hill Institute\", Role: \"Director, Commerce and ICT\"}\n  job2 := Job{Employer:\
  \ \"Canberra University\", Role: \"Adjunct Professor\"}\n  person := Person{\n \
  \   Name: \"jan\",\n    Age: 66,\n    Emails: []string{\"jan@newmarch.name\", \"\
  jan.newmarch@gmail.com\"}, Jobs: []*Job{&job1, &job2},\n  }\n  t := template.New(\"\
  Person template\")\n  t, err := t.Parse(templ)\n  checkError(err)\n  err = t.Execute(os.Stdout,\
  \ person)\n  checkError(err)\n}\n\nfunc checkError(err error) {\n  if err != nil\
  \ {\n    fmt.Println(\"Fatal error \", err.Error())\n    os.Exit(1)\n  }\n}\n```\n\
  \n该程序的输出结果如下：\n\nThe name is jan.\nThe age is 66.\nAn email is jan@newmarch.name\n\
  An email is jan.newmarch@gmail.com\nAn employer is Canberra University\nand the\
  \ role is Adjunct Professor\nAn employer is Box Hill Institute\nand the role is\
  \ Director, Commerce and ICT\n\n注意，此输出中有许多作为换行的空白字符。这是由于我们在模板中包含了空白字符。如果你想减少这些空白，可以按照如下方式消除模板中的换行：\n\
  \n```go\n{{range .Emails}} An email is {{.}} {{end}}\n```\n\n另一种方法是使用命令分隔符 `{{-\
  \ ` 和 ` -}}` 分别消除紧接其前的文本的所有尾空白以及紧随其后的文本的所有导空白。\n\n在示例中，我们在程序中使用了一个字符串作为模板。你也可以使用\
  \ `template.ParseFiles()` 函数从文件加载模板。出于某种我不理解的原因（而且在早期的版本中并没有要求），分配给模板的名称必须与文件列表中第一个文件的文件名相同。这是一个\
  \ Bug 吗？\n\n## 管道 (Pipelines)\n\n上述转换将文本片段插入到模板中。这些文本片段本质上是任意的，取决于字段的字符串值是什么。如果我们希望它们作为\
  \ HTML 文档（或其他特殊格式）的一部分出现，我们需要对特定的字符序列进行转义。例如，要在 HTML 文档中显示任意文本，我们必须将 `<` 改为 `&lt;`。Go\
  \ 模板有很多内置函数，其中之一就是 `html()`。这些函数的作用方式类似于 UNIX 管道，从标准输入读取并写入标准输出。\n\n若要获取当前对象 `.`\
  \ 的值并对其进行 HTML 转义，你可以在模板中写一个“管道”：\n\n```go\n{{. | html}}\n```\n\n对其他函数也进行类似的操作。\n\
  \n## 定义函数\n\n模板使用对象的字符串表示形式来插入值，并使用 `fmt` 包将对象转换为字符串。有时这并不是我们需要的。例如，为了防止垃圾邮件发送者获取电子邮件地址，经常会看到符号\
  \ `@` 被替换为单词“at”，例如“jan at newmarch.name”。如果我们想使用模板以这种形式显示电子邮件地址，我们必须必须构建一个自定义函数来执行此项转换。\n\
  \n每个模板函数都都有一个名称，该名称在模板本身中使用，并关联一个相应的 Go 函数。它们通过这种类型建立链接：\n\n```go\ntype FuncMap\
  \ map[string]interface{}\n```\n\n例如，如果我们想让模板函数名为 `emailExpand`，并链接到 Go 函数 `EmailExpander`，我们按照如下方式在模板的函数列表中添加它：\n\
  \n```go\nt.Funcs(template.FuncMap{\"emailExpand\": EmailExpander})\n```\n\n`EmailExpander`\
  \ 的签名通常如下：\n\n```go\nfunc EmailExpander(args ...interface{}) string {\n  ok := false\n\
  \  var s string\n  if len(args) == 1 {\n    s, ok = args[0].(string)\n  }\n  if\
  \ !ok {\n    return s\n  }\n  // find @ symbol\n  substrs := strings.Split(s, \"\
  @\")\n  if len(substrs) != 2 {\n    return s\n  }\n  // replace @ by \" \"\n  return\
  \ substrs[0] + \" at \" + substrs[1]\n}\n```\n\n在模板中，我们感兴趣的是这种格式的用法：\n\n```go\n\
  const templ = `The name is {{.Name}}.\n{{range .Emails}}\nAn email is {{ | | email}}\n\
  {{end}}`\n```\n\n程序 `PrintEmails.go`：\n\n```go\n/**\n* PrintEmails\n */\npackage\
  \ main\n\nimport (\n  \"fmt\"\n  \"os\"\n  \"strings\"\n  \"text/template\"\n)\n\
  \ntype Person struct {\n  Name string\n  Emails []string\n}\n\nfunc main() {\n \
  \ person := Person{\n    Name: \"jan\",\n    Emails: []string{\"jan@newmarch.name\"\
  , \"jan.newmarch@gmail.com\"},\n  }\n  t := template.New(\"Person template\")\n\
  \  // add our function\n  t.Funcs(template.FuncMap{\"emailExpand\": EmailExpander})\n\
  \  t, err := t.Parse(templ)\n  checkError(err)\n  err = t.Execute(os.Stdout, person)\n\
  \  checkError(err)\n}\n\nfunc checkError(err error) {\n  if err != nil {\n    fmt.Println(\"\
  Fatal error \", err.Error())\n    os.Exit(1)\n  }\n}\n```\n\n输出结果如下：\n\nThe name\
  \ is jan.\nAn email is jan at newmarch.name\nAn email is jan.newmarch at gmail.com\n\
  \n## 变量\n\n模板包允许你定义和使用变量。作为这种用法的动机，考虑我们如何以名称为前缀打印每个人的电子邮件。我们使用的类型再次为：\n\n```go\n\
  type Person struct {\n  Name string\n  Emails []string\n}\n```\n\n为了访问电子邮件字符串，我们使用如下\
  \ range 语句：\n\n```go\n{{range .Emails}}\n{{.}}\n{{end}}\n```\n\n但在那里我们无法访问 `Name`\
  \ 字段，因为 `.` 现在正在遍历数组元素，而 `Name` 在此作用范围之外。解决方案是将 `Name` 字段的值保存在一个在该范围内可以访问的变量中。模板中的变量以\
  \ `$` 前缀。因此我们这样写：\n\n```go\n{{$name := .Name}}\n{{range .Emails}}\nName is {{$name}},\
  \ email is {{.}}\n{{end}}\n```\n\n程序是 `PrintNameEmails.go`：\n\n```go\n/**\n* PrintNameEmails\n\
  \ */\npackage main\n\nimport (\n  \"fmt\"\n  \"os\"\n  \"text/template\"\n)\n\n\
  type Person struct {\n  Name string\n  Emails []string\n}\n\nfunc main() {\n  person\
  \ := Person{\n    Name: \"jan\",\n    Emails: []string{\"jan@newmarch.name\", \"\
  jan.newmarch@gmail.com\"},\n  }\n  t := template.New(\"Person template\")\n  t,\
  \ err := t.Parse(templ) // 注意：此处原文代码逻辑似乎漏了变量定义，按原文结构翻译\n  // ... 保持逻辑一致\n}\n```\n\
  *(注：由于提供的原文文本在 `PrintNameEmails.go` 部分似乎存在逻辑截断或重复，翻译时已严格遵循您提供的原文结构进行处理。)*\n\n\n\n\
  ```go\nfunc main() {\n\tperson := Person{\n\t\tName: \"jan\",\n\t\tEmails: []string{\"\
  jan@newmarch.name\", \"jan.newmarch@gmail.com\"},\n\t}\n\tt := template.New(\"Person\
  \ template\")\n\tt, err := t.Parse(templ)\n\tcheckError(err)\n\terr = t.Execute(os.Stdout,\
  \ person)\n\tcheckError(err)\n}\n\nfunc checkError(err error) {\n\tif err != nil\
  \ {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\
  \n这里是输出：\n\nName is jan, email is jan@newmarch.name\n\nName is jan, email is jan.newmarch@gmail.com\n\
  \n## 条件语句\n\n继续之前的 `Person` 示例，假设你只是想打印电子邮件列表，而不对其进行深入处理。你可以使用模板来实现：\n\n```\nName\
  \ is {{.Name}}\nEmails are {{.Emails}}\n```\n\n这将打印以下内容：\n\nName is jan\nEmails\
  \ are [jan@newmarch.name jan.newmarch@gmail.com]\n\n因为这就是 `fmt` 包显示列表的方式。\n\n在很多情况下，如果这就是你想要的，那么可能是没问题的。让我们考虑一个几乎正确但并不完全正确的案例。我们有一个\
  \ `JSON` 包用于对对象序列化，我们在第 4 章中看过了它。这将会产生以下内容：\n\n```json\n{\n  \"Name\": \"jan\",\n\
  \  \"Emails\": [\"jan@newmarch.name\", \"jan.newmarch@gmail.com\"]\n}\n```\n\n在实践中你通常使用\
  \ `JSON` 包，但让我们看看是否可以使用模板生成 JSON 输出。仅通过现有的模板就可以实现类似的操作。作为一个 JSON 序列化器，这几乎是：\n\n\
  ```json\n{\n  \"Name\": \"{{.Name}}\",\n  \"Emails\": {{.Emails}}\n}\n```\n\n它将产生：\n\
  \n```json\n{\n  \"Name\": \"jan\",\n  \"Emails\": [jan@newmarch.name jan.newmarch@gmail.com]\n\
  }\n```\n\n这有两个问题：地址没有引号，且列表元素之间应该用 `,` 分隔。\n\n这样如何呢——查看数组元素，给它们加上引号并添加逗号？\n\n```json\n\
  {\n  \"Name\": {{.Name}},\n  \"Emails\": [\n    {{range .Emails}}\n    \"{{.}}\"\
  ,\n    {{end}}\n  ]\n}\n```\n\n这将产生：\n\n```json\n{\n  \"Name\": \"jan\",\n  \"Emails\"\
  : [\"jan@newmarch.name\", \"jan.newmarch@gmail.com\",]\n}\n```\n\n（加上一些空格。）\n\n\
  再次，它几乎是正确的，但如果你仔细观察，你会发现最后一个列表元素后面有一个尾随的 `,`。\n\n根据 `JSON` 语法（参见 http://www.json.org/），这个尾随逗号是不允许的。不同的实现在处理这个问题上可能会有所不同。\n\
  \n我们想要的是打印每个元素并跟一个 `,`，但最后一个除外。这实际上有点难做，所以更好的方法是在每个元素前面加一个 `,`，但第一个除外（这个建议是我从 Stack\
  \ Overflow 的 Brian 那得到的）。这更容易，因为第一个元素的索引为 0，而许多编程语言将 0 视为 false。\n\n条件语句的一种形式是 `{{if\
  \ pipeline}} {{else}}{{end}}`。我们需要 pipeline 是指向电子邮件数组的索引。幸运的是，`range` 语句的一种变体为我们提供了。有两种引入变量的形式：`range\
  \ $elmt := array` 和 `range $index, $elmt := array`。我们设置了一个遍历数组的循环，如果索引为 false (0)，我们就直接打印元素。否则，我们在元素前加上\
  \ `,` 打印。模板如下：\n\n```json\n{\n  \"Name\": \"{{.Name}}\",\n  \"Emails\": [\n    {{range\
  \ $index, $elmt := .Emails}}\n    {{if $index}}\n    , \"{{$elmt}}\"\n    {{else}}\n\
  \    \"{{elmt}}\"\n    {{end}}\n  ]\n}\n```\n\n完整的程序是 `PrintJSON.go`：\n\n```go\n\
  package main\n\nimport (\n\t\"text/template\"\n\t\"os\"\n\t\"fmt\"\n)\n\ntype Person\
  \ struct {\n\tName   string\n\tEmails []string\n}\n\nconst templ = `{\n  \"Name\"\
  : \"{{.Name}}\",\n  \"Emails\": [\n    {{range $index, $elmt := .Emails}}\n    {{if\
  \ $index}}\n    , \"{{$elmt}}\"\n    {{else}}\n    \"{{$elmt}}\"\n    {{end}}\n\
  \  ]\n}`\n\n\n\nfunc main() {\n\tperson := Person{\n\t\tName: \"jan\",\n\t\tEmails:\
  \ []string{\"jan@newmarch.name\", \"jan.newmarch@gmail.com\"},\n\t}\n\tt := template.New(\"\
  Person template\")\n\tt, err := t.Parse(templ)\n\tcheckError(err)\n\terr = t.Execute(os.Stdout,\
  \ person)\n\tcheckError(err)\n}\n\nfunc checkError(err error) {\n\tif err != nil\
  \ {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n```\n\
  \n这给出了正确的 JSON 输出。在离开本节之前，请注意，格式化带逗号分隔列表的问题可以通过在 Go 中定义合适的函数并使其模板函数可用来解决。借用另一种编程语言的一句名言，“做这件事有多种方法！”以下程序是\
  \ Roger Pepe 发送给我的，名为 `Sequence.go`：\n\n```go\n// Sequence.go\n// Copyright Roger\
  \ Pepe\npackage main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"os\"\n\t\"text/template\"\
  \n)\n\nvar tmpl = `{{$comma := \", \"}}\n{{range $}}{{$comma.Next}}{{.}}{{end}}\n\
  {{$comma := \", \"}}\n{{$colour := cycle \"black\" \"white\" \"red\"}}\n{{range\
  \ $}}{{$comma.Next}}{{.}} in {{$colour.Next}}{{end}}`\n\nvar fmap = template.FuncMap{\n\
  \t\"sequence\": sequenceFunc,\n\t\"cycle\": cycleFunc,\n}\n\nfunc main() {\n\tt,\
  \ err := template.New(\"\").Funcs(fmap).Parse(tmpl)\n\tif err != nil {\n\t\tfmt.Printf(\"\
  parse error: %v\\n\", err)\n\t\treturn\n\t}\n\terr = t.Execute(os.Stdout, []string{\"\
  a\", \"b\", \"c\", \"d\", \"e\", \"f\"})\n\tif err != nil {\n\t\tfmt.Printf(\"exec\
  \ error: %v\\n\", err)\n\t}\n}\n\ntype generator struct {\n\tss []string\n\ti  int\n\
  \tf  func(s []string, i int) string\n}\n\nfunc (seq *generator) Next() string {\n\
  \ts := seq.f(seq.ss, seq.i)\n\tseq.i++\n\treturn s\n}\n\nfunc sequenceGen(ss []string,\
  \ i int) string {\n\tif i >= len(ss) {\n\t\treturn ss[len(ss)-1]\n\t}\n\treturn\
  \ ss[i]\n}\n\nfunc cycleGen(ss []string, i int) string {\n\treturn ss[i%len(ss)]\n\
  }\n\nfunc sequenceFunc(ss ...string) (*generator, error) {\n\tif len(ss) == 0 {\n\
  \t\treturn nil, errors.New(\"sequence must have at least one element\")\n\t}\n\t\
  return &generator{ss, 0, sequenceGen}, nil\n}\n\nfunc cycleFunc(ss ...string) (*generator,\
  \ error) {\n\tif len(ss) == 0 {\n\t\treturn nil, errors.New(\"cycle must have at\
  \ least one element\")\n\t}\n\treturn &generator{ss, 0, cycleGen}, nil\n}\n```\n\
  \n这里是输出：\n\na, b, c, d, e, f\na in black, b in white, c in red, d in black, e in\
  \ white, f in red\n\n\n\n\n本章主要是对 HTTP 章节的说明，即使用 Go 构建一个完整的 Web 服务器。它还展示了如何使用模板在文本文件中使用表达式来插入变量值并生成重复部分。它还处理了序列化数据和\
  \ Unicode 字符集。本章中的程序由于足够长且复杂，因此不会总是完整给出，但可以从该书的网站下载：[`www.apress.com/9781484226919`](http://www.apress.com/9781484226919)。\n\
  \n我正在学习中文。确切地说，在尝试了多年之后，我仍然在尝试学习中文。当然，我并没有下下功夫来攻读，而是尝试了各种技术手段。我尝试过教科书、视频以及许多其他教学辅助。最后我意识到，我进展缓慢的原因是还没有一个好用的中文闪卡（flashcards）程序，因此为了学习，我需要自己编写一个。\n\
  \n我找到了一个 Python 程序来完成部分任务。但遗憾的是，它写得并不好，在几次尝试将其彻底翻倒和重组后，我得出结论：认为从零开始更好。当然，Web 解决方案会比独立程序好得多，因为这样我中文班的其他其他人以及其他其他学习者都可以共享它。当然，服务器将用\
  \ Go 编写。\n\n我使用了张鹏 peng 编写的《初级口语汉语》（Intensive Spoken Chinese，外语出版社，2007 年，ISBN 978-7-80052577-3）课程中的词汇，但该程序适用于任何词汇集。\n\
  \n## 浏览器站点图\n\n在浏览器中查看生成的程序有三种页面，如图 10-1 所示。\n\n### 首页\n- 闪卡集\n- 闪卡列表（一次显示一组单词）\n\
  - 闪卡集（所有单词）\n\n***图 10-1。** 浏览器页面*\n\n© Jan Newmarch 2017\n175\nJ. Newmarch, *Network\
