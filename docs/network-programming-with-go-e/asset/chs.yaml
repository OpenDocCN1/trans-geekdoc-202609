  \ | `manageFlashCards` | `html/ListWords.html` |\n| `/jscript/*` | `fileServer`\
  \ | 来自目录 `/jscript` 的文件 |\n| `/html/*` | `fileServer` | 来自目录 `/html` 的文件 |\n\n177\n\
  目前暂省略函数本身，服务器是 `Ch10` 下的 `Server.go`，位于 [http://www.apress.com/9781484226919.com/9781484226919/]。\n\
