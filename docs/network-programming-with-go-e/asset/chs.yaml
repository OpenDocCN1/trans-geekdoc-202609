  ></script>\n    <script type=\"text/javascript\" language=\"JavaScript.2\" src=\"\
  /jscript/slideviewer.js\"></script>\n    cardOrder = \"RANDOM\";\n    showHalf =\
  \ \"CHINESE\";\n    </script>\n</head>\n<body onload=\"showSlides();\">\n    <h1>{{.Name}}\
  \ 单词</h1>\n    <p>\n        <table border=\"1\" class=\"sortable\">\n          \
  \  <tr>\n                <th>英语</th>\n                <th>拼音</th>\n            \
  \    <th>繁体中文</th>\n                <th>简体</th>\n            </tr>\n           \
  \ {{range .Cards}}\n            <div class=\"card\">\n                <tr>\n   \
  \                 <div class=\"english\">\n                        <div class=\"\
  vcenter\">\n                            <td>{{.English}}</td>\n                \
  \        </div>\n                    </div>\n                    {{with .Dictionary}}\n\
  \                        {{range .Entries}}\n                            <div class=\"\
  pinyin\">\n                                <div class=\"vcenter\">\n           \
  \                         <td>{{.Pinyin|pinyin}}</td>\n                        \
  \        </div>\n                            </div>\n                          \
  \  <div class=\"traditional\">\n                                <div class=\"vcenter\"\
  >\n                                    <td>{{.Traditional}}</td>\n             \
  \                   </div>\n                            </div>\n               \
  \             <div class=\"simplified\">\n                                <div class=\"\
  vcenter\">\n                                    <td>{{.Simplified}}</td>\n     \
  \                           </div>\n                            </div>\n       \
  \                 {{end}}\n                    {{end}}\n                </tr>\n\
  \            </div>\n            {{end}}\n        </table>\n    </p>\n    <p class\
  \ =\"return\">\n        <a href=\"http:/flashcards.html\">返回单词卡列表</a>\n    </p>\n\
  </body>\n</html>\n```\n\n\n\n\n我更可能使用此功能将程序的文本作为网页显示。大多数编程语言都包含 `<` 符号，许多语言还包含 `&`。如果不进行适当转义，这些符号会弄乱\
  \ HTML 渲染器。我喜欢直接从文件系统显示程序文本，而不是将其复制粘贴到文档中，以避免内容不同步。\n\n以下程序 `EscapeString.go` 是一个\
  \ Web 服务器，它在预格式化代码块中显示自己的 URL，并对那些麻烦的字符进行了转义：\n\n```go\n/*\n* 此程序以预格式化的代码布局提供文件\n\
  * 适用于显示程序文本，并妥善转义特殊\n* 字符如 '<', '>', 和 '&'\n*/\npackage main\n\nimport (\n\"fmt\"\
  \n\"html\"\n\"io/ioutil\"\n\"net/http\"\n\"os\"\n)\n© Jan Newmarch 2017 \n193\n\
  J. Newmarch, *Network Programming with Go*, DOI 10.1007/978-1-4842-2692-6_11\nChapter\
  \ 11 ■ htML\n\nfunc main() {\nhttp.HandleFunc(\"/\", escapeString)\nerr := http.ListenAndServe(\"\
  :8080\", nil)\ncheckError(err)\n}\n\nfunc escapeString(rw http.ResponseWriter, req\
  \ *http.Request) {\nfmt.Println(req.URL.Path)\nbytes, err := ioutil.ReadFile.\"\
  \ + req.URL.Path)\nif err != nil {\nrw.WriteHeader(http.StatusNotFound)\nreturn\n\
  }\nescapedStr := html.EscapeString(string(bytes))\nhtmlText := \"<html><body><pre><code>\"\
  \ +\nescapedStr +\n\" </code></pre></body></html>\"\nrw.Write([]byte(htmlText))\n\
  }\n\nfunc checkError(err error) {\nif err != nil {\nfmt.Println(\"Error \", err.Error())\n\
  os.Exit(1)\n}\n}\n```\n\n当它运行时，会从包含 `EscapeString.go` 程序的目录提供文件服务，浏览器将使用 URL `localhost:8080/EscapeString.go`\
  \ 正确显示它。\n\n使用以下命令运行服务器：\n\n```bash\ngo run EscapeString.go\n```\n\n使用以下命令运行客户端作为示例：\n\
  \n```bash\ncurl localhost:8080/EscapeString.go\n```\n\n### Go 的 HTML/template 包\n\
  \n针对 Web 服务器可以进行许多攻击，最著名的是 SQL 注入，即用户代理故意向设计为传递到数据库的 Web 表单输入数据，从而在数据库中造成破坏。Go 并没有提供任何特殊的支持来避免此问题，因为不同的数据库对于可以成功的\
  \ SQL 注入技术上存在许多差异。SQL 注入预防快速查表\n\nfunc main() {\nbytes, err := ioutil.ReadFile(os.Args[1])\n\
  if err != nil {\nfmt.Println(\"Error: \", err)\nos.Exit(1)\n}\nz := html.NewTokenizer(strings.NewReader(string(bytes)))\n\
  depth := 0\nfor {\ntt := z.Next()\nif tt == html.Error {\nfmt.Println(\"Error:\"\
  , z.Error())\nbreak\n}\nswitch tt {\ncase html.TextToken:\nfmt.Println(\"Text:\"\
  , string(z.Text()))\ncase html.StartTagToken, html.EndTagToken:\nfmt.Println(\"\
  Tag:\", string(z.Token()))\n}\nif tt == html.StartTagToken {\ndepth++\n} else {\n\
  depth--\n}\nif depth == 0 {\nbreak\n}\n}\n}\n```\n\n当它运行时，会从包含 `EscapeString.go`\
  \ 程序的目录提供文件服务，浏览器将正确显示如下的简单 HTML 文档：\n\n```html\n<html>\n<head>\n<title>Test HTML</title>\n\
  </head>\n<body>\n<h1>Header one</h1>\n<p>Test para</p>\n</body>\n</html>\n```\n\n\
  它输出如下：\n\nTag: `<html>`\nTag: `<head>`\nTag: `<title>`\nText: ` Test HTML`\nTag:\
  \ `</title>`\nTag: `</head>`\nTag: `<body>`\nTag: `<h1>`\nText: ` Header one`\n\
  Tag: `</h1>`\nTag: `<p>`\nText: ` Test para`\nTag: `</p>`\nTag: `</body>`\nTag:\
  \ `</html>`\n\n（它产生的所有空白都是正确的。）\n\n### XHTML/HTML\n\n`XML` 包中也有对 XHTML/HTML 的有限支持，将在下一章讨论。\n\
  \n### JSON\n\n如第 4 章所述，对 JSON 有良好的支持。\n\n### 总结\n\n此包没有太多内容。子包 `html/template` 已在第\
  \ 9 章模板中讨论过。\n\n### 第 12 章：XML\n\nXML 是一种重要的标记语言，主要作为使用文本格式表示结构化数据的方法……一种将数据结构序列化为文本文档的方法。\n\
  \n在最简单的层次，XML 允许你为文本文档定义自定义标签。标签可以嵌套并与文本交替出现。每个标签还可以包含带有值的属性。例如，`person.xml` 文件可能包含：\n\
  \n```xml\n<person>\n<name>\n<family>Newmarch</family>\n<personal> Jan</personal>\n\
  </name>\n<email type=\"personal\">\njan@newmarch.name\n</email>\n<email type=\"\
  work\">\nj.newmarch@boxhill.edu.au\n</email>\n</person>\n```\n\n任何 XML 文档的结构可以用多种方式描述：\n\
  \n• 文档类型定义 DTD 适用于用于描述结构\n• XML 架构（Schema） 用于描述 XML 文档使用的的数据类型\n• RELAX NG 被提出作为上述两者的替代方案\n\
  \n\n\n\n对于定义 XML 文档结构的每种方式的相对价值存在争议。\n\n我们并不认同这种观点，因为 Go 不支持其中任何一种。Go 无法根据 schema\
  \ 检查任何文档的有效性，只能检查其良好性（well-formedness）。即使良好性也是 XML 文档的一个重要特征，在实践中这通常是 HTML 文档的一个问题。这使得\
  \ XML 适用于表示非常复杂的数据，而 HTML 则不然。\n\n本章讨论了四个主题：解析 XML 流、将 Go 数据序列化和反序列化为 XML，以及 XHTML。\n\
  \n# 第 12 章 ■ XML\n\n## 解析 XML\n\nGo 有一个 XML 解析器，它是使用 `encoding/xml` 包中的 `NewDecoder`\
  \ 创建的。它接收一个 `io.Reader` 作为参数并返回一个指向 `Decoder` 的指针。该类型的主要方法是 `Token`，它返回输入流中的下一个标记。该标记是以下类型之一——`StartElement`、`EndElement`、`CharData`、`Comment`、`ProcInst`\
  \ 或 `Directive`。\n\n我们将使用这种类型：\n\n```go\ntype Name struct {\n    Space, Local string\n\
  }\n```\n\nXML 类型为 `StartElement`、`EndElement`、`CharData`、`Comment`、`ProcInst` 和\
  \ `Directive`。接下来将对其进行描述。\n\n### StartElement 类型\n\n`StartElement` 类型是一个包含两个字段类型的结构：\n\
  \n```go\ntype StartElement struct {\n    Name Name\n    Attr []Attr\n}\n```\n\n\
  其中\n\n```go\ntype Attr struct {\n    Name Name\n    Value string\n}\n```\n\n###\
  \ EndElement 类型\n\n这同样如下所示结构：\n\n```go\ntype EndElement struct {\n    Name Name\n\
  }\n```\n\n### CharData 类型\n\n该类型表示标签包含的文本内容，是一个简单类型：\n\n```go\ntype CharData []byte\n\
  ```\n\n### Comment 类型\n\n该类型也类似：\n\n```go\ntype Comment []byte\n```\n\n### ProcInst\
  \ 类型\n\n`ProcInst` 代表形式为 `<?target inst?>` 的 XML 处理指令：\n\n```go\ntype ProcInst struct\
  \ {\n    Target string\n    Inst   []byte\n}\n```\n\n### Directive 类型\n\n`Directive`\
  \ 代表形式为 `<!text>` 的 XML 指令。字节不包括 `<!` 和 `>` 标记。\n\n```go\ntype Directive []byte\n\
  ```\n\n用于打印 XML 文档树结构的程序是 `ParseXML.go`：\n\n```go\n/* Parse XML */\npackage main\n\
  \nimport (\n    \"encoding/xml\"\n    \"fmt\"\n    \"io/ioutil\"\n    \"os\"\n \
  \   \"strings\"\n)\n\nfunc main() {\n    if len(os.Args) != 2 {\n        fmt.Println(\"\
  Usage: \", os.Args[0], \"file\")\n        os.Exit(1)\n    }\n    file := os.Args[1]\n\
  \    bytes, err := ioutil.ReadFile(file)\n    checkError(err)\n    r := strings.NewReader(string(bytes))\n\
  \    parser := xml.NewDecoder(r)\n    depth := 0\n    for {\n        token, err\
  \ := parser.Token()\n        if err != nil {\n            break\n        }\n   \
  \     switch t := token.(type) {\n        case xml.StartElement:\n            elmt\
  \ := xml.StartElement(t)\n            name := elmt.Name.Local\n            printElmt(name,\
  \ depth)\n            depth++\n        case xml.EndElement:\n            depth--\n\
  \            elmt := xml.EndElement(t)\n            name := elmt.Name.Local\n  \
  \          printElmt(name, depth)\n        case xml.CharData:\n            bytes\
  \ := xml.CharData(t)\n            printElmt(string(bytes), depth)\n        case\
  \ xml.Comment:\n            printElmt(\"Comment\", depth)\n        case xml.ProcInst:\n\
  \            printElmt(\"ProcInst\", depth)\n        case xml.Directive:\n     \
  \       printElmt(\"Directive\", depth)\n        default:\n            fmt.Println(\"\
  Unknown\")\n        }\n    }\n}\n\nfunc printElmt(s string, depth int) {\n    for\
  \ n := 0; n < depth; n++ {\n        fmt.Print(\"  \")\n    }\n    fmt.Println(s)\n\
  }\n\nfunc checkError(err error) {\n    if err != nil {\n        fmt.Println(\"Fatal\
  \ error \", err.Error())\n        os.Exit(1)\n    }\n}\n```\n\n注意解析器包含了所有 `CharData`，包括标签之间的空白。如果对之前提供的\
  \ `person` 数据运行此程序（`go run ParseXML.go person.xml`），产生如下结果：\n\n```\nperson\n  name\n\
  \    family\n    personal\n```\n\n注意没有 DTD 规定可以忽略空白，在使用此解析器时存在潜在的陷阱。解析器重用了字符串，因此一旦你看到一个标记，就需要复制它的值。Go\
  \ 有如 `(CharData)` 方法来制作数据。\n\n## 反序列化 XML\n\nGo 提供了一个名为 `Unmarshal` 的函数将 XML 反序列化为数据结构。反序列化并不是完美的：Go\
  \ 和 XML 是不同的语言。首先考虑之前提供的 XML 文档：\n\n```xml\n<person>\n  <name>\n    <family>Newmarch</family>\n\
  \    <personal>Jan</personal>\n  </name>\n  <email type=\"personal\">jan@newmarch.name</email>\n\
  \  <email type=\"work\">j.newmarch@boxhill.edu</email>\n</person>\n```\n\n想要将其映射到\
  \ Go 结构体：\n\n```go\ntype Person struct {\n    Name Name\n    Email []Email\n}\n\
  type Name struct {\n    Family   string\n    Personal string\n}\ntype Email struct\
  \ {\n    Type    string\n    Address string\n}\n```\n\n这需要几个注释：反序列化使用了 Go 的 `reflection`\
  \ 包。这要求所有字段都是导出的，即以大写字母开头。早期的 Go 版本使用不区分大小写的匹配来匹配 XML 字符串 \"name\" 到字段 `Name`。但现在，使用了区分大小写的匹配。为了执行匹配，结构字段必须标记以匹配\
  \ XML 字符串。这使得 `Person` 如下：\n\n```go\ntype Person struct {\n    Name Name `xml:\"\
  name\"`\n    Email []Email `xml:\"email\"`\n}\n```\n\n- 重复的标签在 Go 中映射为切片。\n- 标签内的属性只有在\
  \ Go 字段具有 `,attr` 标记时才会映射到结构中。这发生在 `Email` 的 `Type` 字段上，匹配 `email` 标签需要 `xml:\"\
  type,attr\"`。\n- 如果 XML 标签没有属性且只有字符数据，它通过相同的名称匹配到字符串字段（尽管是区分大小写的）。所以标签 `xml:\"family\"\
  ` 带有字符数据 Newmarch 映射到字符串字段 `Family`。\n- 但如果标签有属性，它必须映射到结构体。Go 将字符数据分配给带有 `,chardata`\
  \ 标记的字段。这发生在 `email` 数据和带有 `,chardata` 标记的 `Address` 字段上。\n\n反序列化上述文档的程序是 `Unmarshal.go`：\n\
  \n```go\n/* Unmarshal */\npackage main\n\nimport (\n    \"encoding/xml\"\n    \"\
  fmt\"\n    \"os\"\n)\n\ntype Person struct {\n    XMLName string `xml:\"person\"\
  `\n    Name    Name `xml:\"name\"`\n    Email   []Email `xml:\"email\"`\n}\ntype\
  \ Name struct {\n    Family   string `xml:\"family\"`\n    Personal string `xml:\"\
  personal\"`\n}\ntype Email struct {\n    Type    string `xml:\"type,attr\"`\n  \
  \  Address string `xml:\",chardata\"`\n}\n\nfunc main() {\n    str := `<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<person>\n  <name>\n    <family>Newmarch</family>\n\
  \    <personal>Jan</personal>\n  </name>\n  <email type=\"personal\">jan@newmarch.name</email>\n\
  \  <email type=\"work\">j.newmarch@boxhill.edu</email>\n</person>`\n\n    var person\
  \ Person\n    err := xml.Unmarshal([]byte(str), &person)\n    checkError(err)\n\
  \    // 现在使用 person 结构，例如：\n    fmt.Println(\"Family name: \" + person.Name.Family)\n\
  \    fmt.Println(\"Second email address: \" + person.Email[1].Address)\n}\n\nfunc\
  \ checkError(err error) {\n    if err != nil {\n        fmt.Println(\"Fatal error\
  \ \", err.Error())\n        os.Exit(1)\n    }\n}\n```\n\n（注意空格是正确的。）严格规则在包规范中给出。\n\
  \n## 序列化 XML\n\nGo 也支持将数据结构体序列化为 XML 文档。该函数是：`func Marshal(v interface{}) ([]byte,\
  \ error)`\n\n\n\n\n# 序列化 (Marshal)\n\n```go\n/* Marshal */\n\npackage main\n\nimport\
  \ (\n\t\"encoding/xml\"\n\t\"fmt\"\n)\n\ntype Person struct {\n\tName  Name\n\t\
  Email []Email\n}\n\ntype Name struct {\n\tFamily   string\n\tPersonal string\n}\n\
  \ntype Email struct {\n\tKind    string `xml:\"attr\"`\n\tAddress string `xml:\"\
  ,chardata\"`\n}\n\nfunc main() {\n\tperson := Person{\n\t\tName: Name{Family: \"\
  Newmarch\", Personal: \"Jan\"},\n\t\tEmail: []Email{\n\t\t\tEmail{Kind: \"home\"\
  , Address: \"jan\"},\n\t\t\tEmail{Kind: \"work\", Address: \"jan\"},\n\t\t},\n\t\
  }\n\tbuff, _ := xml.Marshal(person)\n\tfmt.Println(string(buff))\n}\n```\n\n它会产生不带空格的文本：\n\
  \n`<Person><Name><Family>Newmarch</Family><Personal>Jan</Personal></Name><Email><Kind>home</Kind><Address>jan</Address></Email><Email><Kind>work</Kind><Address>jan</Address></Email></Person>`\n\
  \n## XHTML\n\nHTML 并不符合 XML 语法。它包含未闭合的标签，例如 `<br>`。XHTML 是对 HTML 的清理，使其符合 XML 标准。XHTML\
  \ 文档可以使用上述的 XML 技术进行管理。\n\nXHTML 的使用并没有像最初预期的那样广泛。我个人的怀疑，HTML 解析器通常对错误具有容忍性，在浏览器中使用时通常能很好地渲染文档；而\
  \ XHTML 解析器即使在浏览器中也倾向于更加严格，一旦遇到单个 XML 错误，往往无法渲染任何内容。这对于面向用户的软件来说通常不是合适的行为。\n\n##\
  \ HTML\n\nXML 包提供了一些处理 HTML 文档的支持，尽管它们可能不符合 XML 标准。之前讨论的 XML 解析器可以通过关闭严格解析检查，来处理许多\
  \ HTML 文档。\n\n```go\nparser := xml.NewDecoder(r)\nparser.Strict = false\nparser.AutoClose\
  \ = xml.HTMLAutoClose\nparser.Entity = xml.HTMLEntity\n```\n\n## 结论\n\nGo 对处理 XML\
  \ 字符串有基础支持。它目前还没有处理 XML 规范语言（如 XML Schema 或 Relax NG）的机制。\n\n# 第 13 章\n\n## 远程过程调用\
  \ (Remote Procedure Call)\n\nSocket 和 HTTP 编程都使用消息传递范式。客户端向服务器发送一条消息，服务器通常会回一条消息。双方都负责以双方都能理解的格式创建消息，并从这些消息中读取数据。\n\
  \n然而，大多数独立应用程序并不经常使用消息传递技术。通常，首选的机制是 `function`（或方法或过程）调用。在这种风格下，程序将调用一个带有参数列表的函数，并在函数调用完成后，获得一组返回值。\n\
  \n这些值可能是函数的返回值，或者如果地址是作为参数传递的，那么这些地址的内容可能已经被修改了。\n\n远程过程调用（RPC）正尝试将这种编程风格引入网络世界。因此，客户端将进行一个在它看来是普通的过程调用。客户端会将此封装成一个网络消息并传输到服务器。服务器将解包这些内容，并将其转换回服务器端的过程调用。该调用的结果将被封装并返回给客户端。\n\
  \n从图上看，它看起来像图 13-1。\n\n步骤如下：\n\n1. 客户端调用客户端过程存根（stubs）。存根将参数封装成网络消息。这被称为`序列化`（marshalling）。\n\
  2. 操作系统内核中的网络例程被存根调用以发送消息。\n3. 内核将消息发送远程系统。这可能是面向连接的也可能是无连接的。\n4. 服务器过程存根从网络消息中反序列化（unmarshal）参数。\n\
  5. 服务器过程存根执行服务器过程实现。\n6. 过程完成，将执行返回给服务器过程存根。\n7. 服务器存根将返回值序列化为网络消息。\n8. 发回返回消息。\n\
  9. 客户端过程存根使用网络例程读取消息。\n10. 消息被反序列化，并将返回值设置在客户端程序的栈上。\n\n实现 RPC 有两种常见的风格。第一种以 Sun\
  \ 的 ONC/RPC 和 CORBA 为代表。在这种情况下，服务的规范通过某种抽象语言（如 CORBA IDL，接口定义语言）给出。然后，它被编译为客户端和服务器的代码。随后，客户端编写一个包含对过程/函数/方法调用的普通程序，该程序链接到生成的客户端代码上。服务器端代码实际上本身就是一个服务器，它链接到你编写的过程实现上。\n\
  \n在第一种方式中，客户端代码在外观上几乎与普通过程调用完全相同。通常会有一点点额外的代码来定位服务器。\n\n## Go 的 RPC\n\nGo 的 RPC\
  \ 目前到为止是 Go 特有的。RPC 系统通常对可以跨网络调用的函数进行一些限制。这样做是为了 RPC 系统能够正确确定发送了哪些值参数：\n\n- 方法的类型是导出的（以大写字母开头）。\n\
  - 方法是导出的。\n- 方法有两个参数，且都是导出的（或内置）类型。第一个用于传递到方法的数据；第二个用于返回的结果。\n- 方法的第二个参数是一个指针。\n\
  - 它具有 `error` 类型的返回值。\n\n例如，这里有一个有效的函数：`F(T1, &T2) error`。\n\n对参数的限制意味着你通常需要定义一个结构类型。Go\
  \ 的 RPC 使用 `gob` 包进行数据的序列化和反序列化，因此参数类型必须遵循前面的章节中讨论过的 Gob 规则。\n\n我们将遵循 Go 文档中给出的示例因为它说明了要点。服务器执行两个微道的操作——它们不需要\
  \ RPC 的“苦力活”，但易于理解。这两个操作是两个整数相乘，以及找到第一个整数除以第二个整数的商和余数。\n\n```go\ntype Values struct\
  \ {\n\tA, B int\n}\n\ntype Quotient struct {\n\tQuo, Rem int\n}\n\ntype Arith int\n\
  \nfunc (t *Arith) Multiply(args *Args, reply *int) error {\n\t*reply = args.A *\
  \ args.B\n\treturn nil\n}\n```\n\n\n\n\n\n```go\nfunc (t *Arith) Divide(args *Args,\
  \ quo *Quotient) error {\n\tif args.B == 0 {\n\t\treturn errors.New(\"divide by\
  \ zero\")\n\t}\n\tquo.Quo = args.A / args.B\n\tquo.Rem = args.A % args.B\n\treturn\
  \ nil\n}\n```\n\n`Arith` 的底层类型被给出 `int`。这并不重要——任何类型都可以。\n\n现在可以使用 `Register` 注册该类型的对象，然后\
  \ RPC 系统就可以调用它的方法了。\n\n# HTTP RPC 服务 (Server)\n\n任何 RPC 都需要一个传输机制来跨网络传输消息。Go 可以使用\
  \ `HTTP` 或 `TCP`。`HTTP` 机制的优势是它可以利用 `HTTP` 支持库。你需要在 `HTTP` 层上添加一个 RPC 处理器，这是通过使用\
  \ `HandleHTTP` 完成的，然后启动一个 HTTP 服务器。完整的代码是 `ArithServer.go`：\n\n```go\n/**\n * ArithServer\n\
  \ */\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net/rpc\"\n\t\"errors\"\n\t\"net/http\"\
  \n)\n\ntype Values struct {\n\tA, B int\n}\n\ntype Quotient struct {\n\tQuo, Rem\
  \ int\n}\n\ntype Arith int\n\nfunc (t *Arith) Multiply(args *Values, reply *int)\
  \ error {\n\t*reply = args.A * args.B\n\treturn nil\n}\n\nfunc (t *Arith) Divide(args\
  \ *Values, quo *Quotient) error {\n\tif args.B == 0 {\n\t\treturn errors.New(\"\
  divide by zero\")\n\t}\n\tquo.Quo = args.A / args.B\n\tquo.Rem = args.A % args.B\n\
  \treturn nil\n}\n\nfunc main() {\n\tarith := new(Arith)\n\trpc.Register(arith)\n\
  \trpc.HandleHTTP()\n\terr := http.ListenAndServe(\":1234\", nil)\n\tif err != nil\
  \ {\n\t\tfmt.Println(err.Error())\n\t}\n}\n```\n\n并且通过 `go run ArithServer.go` 运行。\n\
  \n# HTTP RPC 客户端 (Client)\n\n客户端需要到 RPC 服务器建立一个 HTTP 连接。它需要准备一个包含要发送值的结构体，以及一个用于存储结果的变量地址。然后它就可以使用这些参数进行\
  \ `Call` 调用：\n\n* 要执行的远程函数名称\n* 要发送的值\n* 用于存储结果的变量地址\n\n一个调用了算术服务器上两个函数的客户端是 `ArithClient.go`：\n\
  \n```go\n/**\n * ArithClient\n */\npackage main\n\nimport (\n\t\"net/rpc\"\n\t\"\
  fmt\"\n\t\"log\"\n\t\"os\"\n)\n\ntype Args struct {\n\tA, B int\n}\n\ntype Quotient\
  \ struct {\n\tQuo, Rem int\n}\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"\
  Usage: \", os.Args[0], \"server\")\n\t\tos.Exit(1)\n\t}\n\tserverAddress := os.Args[1]\n\
  \tclient, err := rpc.DialHTTP(\"tcp\", serverAddress+\":1234\")\n\tif err != nil\
  \ {\n\t\tlog.Fatal(\"dialing:\", err)\n\t}\n\t// Synchronous call\n\targs := Args{17,\
  \ 8}\n\tvar reply int\n\terr = client.Call(\"Arith.Multiply\", args, &reply)\n\t\
  if err != nil {\n\t\tlog.Fatal(\"arith error:\", err)\n\t}\n\tfmt.Printf(\"Arith:\
  \ %d*%d=%d\\n\", args.A, args.B, reply)\n\tvar quot Quotient\n\terr = client.Call(\"\
  Arith.Divide\", args, &quot)\n\tif err != nil {\n\t\tlog.Fatal(\"arith error:\"\
  , err)\n\t}\n\tfmt.Printf(\"Arith: %d/%d=%d remainder %d\\n\", args.A, args.B, quot.Quo,\
  \ quot.Rem)\n}\n```\n\n当它运行时：`go run ArithClient.go localhost`，它会产生以下输出：\n\n```\n\
  Arith: 17*8=136\nArith: 17/8=2 remainder 1\n```\n\n# TCP RPC 服务 (Server)\n\n使用 `TCP`\
  \ 套接字的服务器版本是 `TCPArithServer.go`：\n\n```go\n/**\n * TCPArithServer\n */\npackage\
  \ main\n\nimport (\n\t\"fmt\"\n\t\"net/rpc\"\n\t\"errors\"\n\t\"net\"\n\t\"os\"\n\
  )\n\ntype Args struct {\n\tA, B int\n}\n\ntype Quotient struct {\n\tQuo, Rem int\n\
  }\n\ntype Arith int\n\nfunc (t *Arith) Multiply(args *Args, reply *int) error {\n\
  \t*reply = args.A * args.B\n\treturn nil\n}\n\nfunc (t *Arith) Divide(args *Args,\
  \ quo *Quotient) error {\n\tif args.B == 0 {\n\t\treturn errors.New(\"divide by\
  \ zero\")\n\t}\n\tquo.Quo = args.A / args.B\n\tquo.Rem = args.A % args.B\n\treturn\
  \ nil\n}\n\nfunc main() {\n\tarith := new(Arith)\n\trpc.Register(arith)\n\ttcpAddr,\
  \ err := net.ResolveTCPAddr(\"tcp\", \":1234\")\n\tif err != nil {\n\t\tcheckError(err)\n\
  \t}\n\tlistener, err := net.Listen(\"tcp\", tcpAddr)\n\tif err != nil {\n\t\tcheckError(err)\n\
  \t}\n\tfor {\n\t\tconn, err := listener.Accept()\n\t\tif err != nil {\n\t\t\tcontinue\n\
  \t\t}\n\t\tgo rpc.ServeConn(conn)\n\t}\n}\n\nfunc checkError(err error) {\n\tif\
  \ err != nil {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\
  \t}\n}\n```\n\n注意 `Accept` 调用是阻塞的并处理连接。如果服务器也想做其他工作，应该在 `go routine` 中调用它。\n\n#\
  \ TCP RPC 客户端 (Client)\n\n使用 `TCP` 服务器并调用算术服务器两个函数的客户端是 `TCPArithClient.go`：\n\n\
  ```go\n/**\n * TCPArithClient\n */\npackage main\n\nimport (\n\t\"net/rpc\"\n\t\"\
  fmt\"\n\t\"log\"\n\t\"os\"\n)\n\ntype Args struct {\n\tA, B int\n}\n\ntype Quotient\
  \ struct {\n\tQuo, Rem int\n}\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"\
  Usage: \", os.Args[0], \"server\")\n\t\tos.Exit(1)\n\t}\n\tserverAddress := os.Args[1]\n\
  \tclient, err := rpc.Dial(\"tcp\", serverAddress+\":1234\")\n\tif err != nil {\n\
  \t\tlog.Fatal(\"dialing:\", err)\n\t}\n\t// Synchronous call\n\targs := Args{17,\
  \ 8}\n\tvar reply int\n\terr = client.Call(\"Arith.Multiply\", args, &reply)\n\t\
  if err != nil {\n\t\tlog.Fatal(\"arith error:\", err)\n\t}\n\tfmt.Printf(\"Arith:\
  \ %d*%d=%d\\n\", args.A, args.B, reply)\n\tvar quot Quotient\n\terr = client.Call(\"\
  Arith.Divide\", args, &quot)\n\tif err != nil {\n\t\tlog.Fatal(\"arith error:\"\
  , err)\n\t}\n\tfmt.Printf(\"Arith: %d/%d=%d remainder %d\\n\", args.A, args.B, quot.Quo,\
  \ quot.Rem)\n}\n```\n\n当它运行时：`go run TCPArithClient.go localhost`，它会产生以下输出：\n\n\
  ```\nArith: 17*8=136\nArith: 17/8=2 remainder 1\n```\n\n\n\n\n\n调用算术服务器两个函数的客户端是\
  \ `JSONArithClient.go`：\n\n```go\n/* JSONArithCLient */\n\npackage main\n\nimport\
  \ (\n\t\"net/rpc/jsonrpc\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n)\n\ntype Args struct\
  \ {\n\tA, B int\n}\n\ntype Quotient struct {\n\tQuo, Rem int\n}\n\n\n219 第 13 章\
  \ ■ 远程过程调用\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"Usage:\
  \ \", os.Args[0], \"server:port\")\n\t\tlog.Fatal(1)\n\t}\n\tservice := os.Args[1]\n\
  \tclient, err := jsonrpc.Dial(\"tcp\", service)\n\tif err != nil {\n\t\tlog.Fatal(\"\
  dialing:\", err)\n\t}\n\t// Synchronous call\n\targs := Args{17, 8}\n\tvar reply\
  \ int\n\terr = client.Call(\"Arith.Multiply\", args, &reply)\n\tif err != nil {\n\
  \t\tlog.Fatal(\"arith error:\", err)\n\t}\n\tfmt.Printf(\"Arith: %d*%d=%d\\n\",\
  \ args.A, args.B, reply)\n\tvar quot Quotient\n\terr = client.Call(\"Arith.Divide\"\
  , args, &quot)\n\tif err != nil {\n\t\tlog.Fatal(\"arith error:\", err)\n\t}\n\t\
  fmt.Printf(\"Arith: %d/%d=%d remainder %d\\n\", args.A, args.B, quot.Quo, quot.Rem)\n\
  }\n```\n\n它的运行方式如下：\n\n```bash\ngo run JSONArithClient.go localhost:1234\n```\n\n\
  它产生了以下输出：\n\n```\nArith: 17*8=136\nArith: 17/8=2 remainder 1\n```\n\n## 结论\n\nRPC\
  \ 是一种流行的应用分布方法。这里介绍了几种实现方法，基于 `Gob` 或 `JSON` 序列化技术，并使用 `HTTP` 和 `TCP` 进行传输。\n\n\
  220 第 14 章 REST\n\n在之前的章节中，我们查看了 `HTTP` 并提供了一个 Web 系统的示例。然而，我们没有给该系统提供任何特定的结构，只需足够解决问题的结构即可。由\
  \ `HTTP 1.1` 的核心作者之一（`Roy Fielding`）开发的一种架构风格被称为 `REST`（表述状态转移）。在本章中，我们将查看 `REST`\
  \ 风格以及它对构建 Web 应用的意义。为此我们需要回到基础。\n\n如果要正确应用 `REST` 术语，必须遵循它包含的许多组成部分。\n\n遗憾的是，它已经变成了一个热词，许多应用程序只有\
  \ `REST` 的“部分”，而不是完整的内容。我们讨论了“理德逊成熟度模型”（Richardson Maturity Model），它说明了 API 在通往\
  \ `RESTful` 的路径上走了多远。\n\n在上一章中，我们查看了 `RPC`（远程过程调用）。这与 `REST` 是完全不同的风格。我们还比较了两种风格，探讨了何时适用每种风格。\n\
  \n### URIs 和资源\n\n资源是我们希望在网络或互联网上交互的“事物”。我喜欢将它们看作对象，但并没有要求它们的实现必须基于对象——它们只需要“看起来像”一个东西，可能带有组件。\n\
  \n每个资源都有一个或多个地址。\n\n（此处重复的文本已省略）\n\n资源是我们希望在网络或互联网上交互的“事物”。我喜欢将它们看作对象，但并没有要求它们的实现必须基于对象——它们只需要“看起来像”一个东西，可能带有组件。\n\
  \n每个资源都有一个或多个地址。（此处重复的文本已省略）\n\n\n\n\n\n你可以对 URI 发起特定的请求。如果你正在向 URL 发起 HTTP 请求，HTTP\
  \ 定义了可以实现的请求：`GET`、`PUT`、`POST`、`DELETE`、`HEAD`、`OPTIONS`、`TRACE` 和 `CONNECT`，以及如\
  \ `PATCH` 等扩展。这些请求是有限的！这与我们对面向对象编程预期非常不同。例如，Java 的 `JLabel` 有大约 250 个方法，如 `getText`、`setHorizontalAlignment`\
  \ 等。\n\nREST 现在通常解释为仅取 HTTP 的四个动词：`GET`、`PUT`、`POST`、`DELETE`。`GET` 大致对应于面向对象语言中的\
  \ getter 方法（访问器），而 `PUT` 大致对应于面向对象语言中的 setter 方法（赋值）。如果 `JLabel` 是一个 REST 资源（尽管它不是），单个\
  \ `GET` 动词如何补偿 `JLabel` 一百多个访问器方法呢？\n\n答案在于 URI 的 `PATH` 组件。一个标签（label）具有文本、对齐等属性。\n\
  \n这些实际上是标签的子资源，可以被写为标签的子 URI。因此，如果标签的 URI 为 `http://jan.newmarch.name/my_label`，那么子资源可以拥有\
  \ URI：\n\n`http://jan.newmarch.name/my_label/text`\n\n`http://jan.newmarch.name/my_label/horizontalAlignment`\n\
  \n如果你只想操作标签的文本，可以使用文本资源的 URI，而不是标签本身上的 getter/setter 方法。\n\n## GET 动词\n\n为了获取资源的表示（representation），你对资源进行\
  \ `GET` 操作。这将返回资源的某种表示。这种选择可能有无数种可能性。例如，对这本书索引的请求可能会返回一个法语的索引表示，使用 `UTF-8` 字符集，作为一份\
  \ `XML` 文档，或者有许多其他可能性。客户端和服务器可以协商这些可能性。\n\n`GET` 动词被要求是**幂等的**（idempotent）。也就是说，重复的请求应该返回相同的结果（表示类型范围内）。例如，对传感器温度的多次请求应该返回相同的结果（除非温度确实发生了变化）。\n\
  \n默认的幂等性允许缓存。这有助于减少网络流量，并可能为传感器节省电池。缓存并非总是能保证的：一个返回访问次数的资源在每次访问时都会给出不同的结果。这是一种不寻常的行为并将使用\
  \ HTTP `Cache-Control` 请求头来指示。\n\n## PUT 动词\n\n如果你想更改资源的状态，可以 `PUT` 新值。`PUT` 有两个主要限制：\n\
  \n- 你只能更改你已知的 URI 资源的状态\n- 你发送的表示必须涵盖资源的所有组件 \n\n例如，如果你只想更改标签中的文本，你需要向 URL `http://jan.newmarch.name/my_label/text`\
  \ 发送 `PUT` 消息，*而不是*发送到 `http://jan.newmarch.name/my_label`。发送到标签将需要发送所有一百多个字段中的每一个。\n\
  \n`PUT` 是幂等的，但不是**安全的**（safe）。也就是说，它改变了资源的状态，但重复调用会将其改变为相同的状态。\n\n`PUT` 和 `DELETE`\
  \ 不属于 HTML 的部分，大多数浏览器并不直接支持它们。它们可以在支持 Ajax 的浏览器中调用。关于为什么它们没有包含在内，有多种讨论。可以参见 `http://softwareengineering.stackexchange.com/questions/114156/why-are-there-are-no-put-and-delete-methods-on-html-forms`\
  \ 中的“为什么 HTML 表单中没有 PUT 和 DELETE 方法？”。\n\n## DELETE 动词\n\n这会删除该资源。它是幂等的，但不安全。\n\n\
  ## POST 动词\n\n`POST` 是处理其他动词未涵盖的情况的“其他万能型”动词。对于 `POST` 的两种用法存在共识：\n\n- 如果你想创建一个新资源且不知道它的\
  \ URI，则将资源的表示 `POST` 到一个知道如何创建该资源的 URI。返回的表示应该包含新资源的 URI。*这非常重要*。要与新资源交互，你必须知道它的\
  \ URI，`POST` 的返回告诉了你。\n- 如果一个资源有许多属性，而你只想更改其中一个或几个，则 `POST` 一个仅包含更改值的表示。\n\n在边缘情况下，关于\
  \ `PUT` 和 `POST` 的各自角色存在激烈争论。如果你想创建一个新资源并且*知道*它将拥有的 URI，你可以使用 `PUT` 或 `POST`。你选择哪一个似乎取决于其他因素……\n\
  \nSOAP 被设计为 HTTP 之上的 RPC 系统。它对*一切操作*都使用 `POST`。HTML 在表单中继续使用 `POST`，而它本应该有使用 `PUT`\
  \ 的选项。由于这些原因，除非绝对必要，否则我不使用 `POST`。我假设其他人使用 `POST` 代替 `PUT` 有他们自己的原则理由，但我不知道那些可能是什么\
  \ :-)。\n\n由于其开放的范围，`POST` 可以用于几乎任何地方。这些许多用法可能违背了 REST 模型，正如 SOAP 充分说明的那样。但这些中的某些用法可能是合法的。`POST`\
  \ 通常是非幂等的且不安全的，尽管特定情况可能是二者之一。\n\n## 不维护状态\n\n让我们先明确这一点：不使用 Cookie。Cookie 通常用于跟踪用户与服务器交互过程中的状态，一个典型的例子是购物车。在服务器端创建一个结构并返回一个\
  \ Cookie 来指示这就是购物车。REST 决定不维护任何客户端状态。这简化了交互，并避开了客户端或服务器崩溃后如何恢复一致性的棘手问题。\n\n如果你不能使用\
  \ Cookie，该怎么办？其实非常简单：在服务器端创建一个购物车。在 REST 中，这只能通过 `POST` 请求发生，该请求返回新资源的 URI。这就是你需要使用的——新\
  \ URI。你可以对这个 URI 进行 `GET`、`PUT`、`POST` 和 `DELETE` 操作，完成所有你想做的事情，而无需通过 Cookie 进行变通处理。\n\
  \n## HATEOAS\n\nHATEOAS 全称为“作为状态引擎的超媒体”（Hypermedia as the Engine of Application\
  \ State）。通常认为这是一个糟糕的缩写，但它流了下来。基本原理是，从一个 URI 导航到另一个在某种程度上关联的 URI 不应该通过任何带外机制完成，而是新链接必须以超链接的形式嵌入第一个\
  \ URI 的表示中。\n\n\n\n\n\n表示或由用户对这些表示的操作所暗示。\n\nIANA 维护了一个关系类型列表（IANA: 链接关系位于 [`www.iana.org/assignments/link-relations/link-relations.xhtml`](http://www.iana.org/assignments/link-relations/link-relations.xhtml)），可以使用它们。Web\
  \ Linking RFP5988 描述了 Web 链接注册。HTML5 规范定义了少量的关系，并指向 [`microformats.org/wiki/existing-rel-values#HTML5_link_type_extensions`](http://microformats.org/wiki/existing-rel-values#HTML5_link_type_extensions)\
  \ 处的 Microformats rel 值以获取更长的列表。\n\n诸如 cookie 等机制，或外部 API 规范（用于 SOAP 的 WSDL）被 REST\
  \ 有效地排除。它们不是包含在资源表示中的超链接。\n\n# 表示链接\n\n链接在 HTML 文档中是标准。`Link` 标签定义了一个只能出现在 HTML\
  \ 头部部分的 HTML 元素。例如，一本带有章节等的内容，如果链接以 HTML 链接元素的形式给出，可能像这样：\n\n```html\n<html>\n<head>\n\
  <link rel= \"author\" title=\"Jan Newmarch\" href=\"https://jan.newmarch.name\"\
  >\n<link rel=\"chapter\" title=\"Introduction\" href=\"Introduction/\">\n...\n</head>\n\
  ```\n\nHTML 中的链接关系分为两种：当前文档所需的类型（如 CSS 文件），以及像上面那样指向相关资源的类型。第一种类型通常对用户是不可见地下载的。第二种类型浏览器通常不显示，但遵循\
  \ HATEOAS 原则的用户代理程序将使用它们。\n\nXML 有多种链接规范。这些包括 XLink 和 Atom。`Atom` 似乎更流行。\n\n基于 `XLink`\
  \ 的链接看起来如下所示：\n\n```xml\n<People xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n\
  \  <Person xlink:type=\"simple\" xlink:href=\"http://...\">\n    ...\n  </Person>\n\
  \  ...\n</People>\n```\n\n225\n第 14 章 ■ ReST\n\n基于 `Atom` 的链接看起来如下所示：\n\n```xml\n\
  <People xmlns:atom=\"http://www.w3.org/2005/Atom\">\n  <Person>\n    <link atom:href=\"\
  http://...\"/>\n    ...\n  </Person>\n  ...\n</People>\n```\n\n对于 JSON，该格式并没有规范化。REST\
  \ 烹谱 ([`restcookbook.com/Mediatypes/json/`](http://restcookbook.com/Mediatypes/json/))\
  \ 讨论了缺乏标准化的问题，并指向 W3C 规范 `JSON-LD 1.0`：“一种基于 JSON 的链接数据序列化”以及 `HAL`（超文本应用语言）。诸如开放连接基金之类的实体似乎使用它们自家的格式，但那是为了\
  \ `CoAP`，另一个基于 REST 的系统。\n\n`JSON-LD` 使用术语 `@id` 来指示 URL，例如：\n\n```json\n{\n  \"\
  name\": \"Jan Newmarch\",\n  \"homepage\": {\"@id\": \"https://jan.newmarch.name/\"\
  }\n}\n```\n\n在这方面值得注意的是，W3C 还有一个关于 HTTP `Link` 头的规范，位于 [`www.w3.org/wiki/LinkHeader`](https://www.w3.org/wiki/LinkHeader)，服务器可能会将其返回给客户端。这被\
  \ `JSON-LD` 使用，例如用于指向 HTTP 响应体中包含的 JSON 文档规范。\n\n这会影响从服务器向用户代理传递链接信息的序列化方法。用户代理程序和服务器必须对使用的格式达成一致。对于\
  \ HTML（或 XHTML），这是标准化的。对于 XML，可以在文档中引用链接系统。对于 `JSON-LD`，可以在 `Accept` HTTP 头中作为 `application/ld+json`\
  \ 发送信号。\n\n# REST 中的事务处理\n\nREST 是如何处理事务以及任何其他过程的？它们在 Fielding 的原始论文中并没有讨论过。\n\n\
