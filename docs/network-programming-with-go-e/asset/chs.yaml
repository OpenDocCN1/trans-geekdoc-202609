  \ 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_14) 中，我们查看了架构方面。在 [第 15 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_15)\
  \ 中，我们涵盖了架构特性。\n\n## 第一章：架构\n\n### OSI 模型\n尽管从未被妥善实现，但 `OSI`（开放系统互连）模型在讨论和影响系统设计方面产生了重大影响。它通常如如下所示。从底部到顶部每一层的功能如下：\n\
  - 物理层使用电学、光电或无线电技术传输比特流。\n- 数据链路层将数据包封装成网络帧，以跨越物理层进行传输，并将其还原为数据包。\n- 网络层提供交换和路由。\n\
  - 传输层提供端系统之间透明的数据传输，并负责端到端的错误恢复和流量控制。\n- 会话层建立、管理和终止应用程序之间的连接。\n- 表示层提供与数据表示差异的独立性（例如加密）。\n\
  - 应用层支持应用程序和用户进程。\n\n### TCP/IP 协议\n当 `OSI` 模型正在争论、辩论、部分实现和争夺时，DARPA 研究项目正忙于构建 `TCP/IP`\
  \ 协议。这些取得了巨大的成功，并导致了*互联网*（The Internet）。这是一个简单得多的栈，如下所示。\n\n### 某些替代协议\n尽管看起来如此，但\
  \ `TCP/IP` 协议并非唯一，从长远来看它们可能不是最成功的。维基百科的网络协议列表（参见 [`en.wikipedia.org/wiki/List_of_network_protocols_(OSI_model)`](https://en.wikipedia.org/wiki/List_of_network_protocols_(OSI_model))）在\
  \ `ISO` 的每一层都列出了大量更多。其中许多已经过时或用处不大，但由于各领域技术的进步——例如空间互联网和物联网——总会有新协议的生存。\n\n\n\n\n\
  # 架构\n\n`network`（网络）是一种用于连接称为主机（hosts）的终端系统的通信系统。连接机制可能是铜线、`Ethernet`（以太网）、光纤或无线，但这些在这里不需要考虑。局域网（`LAN`）连接距离较的计算机，通常属于一个家庭、小型组织或大型组织的一部分。\n\
  \n广域网（`WAN`）跨越较大物理区域的计算机，例如城市之间的连接。\n\n还有其他类型，例如 `MANs`（市城域网）、`PANs`（个人局域网），甚至还有\
  \ `BANs`（体域网）。\n\n互联网（internet）是两个或多个不同网络的连接，通常是 `LANs` 或 `WANs`。内网（intranet）是所有网络都属于单一机构的互联网。\n\
  \n互联网和内网之间存在显著差异。通常，内网将处于单一行政管理控制之下，该控制将实施一套统一的策略。相比之下，互联网不受单一机构的控制，对不同部分施加的控制甚至可能是不兼容的。\n\
  \n这种差异的一个微不足道的例子是，内网通常会被限制在运行少数特定操作系统标准版本的厂商的计算机上。另一方面，互联网通常会有各种不同的计算机和操作系统。\n\n\
  本书中的技术适用于互联网。它们在内网也同样有效，但在内网你还会发现专门的、不可移植的系统。\n\n然后是所有互联网的“母体”互联网（The Internet）。这就是一个非常、非常巨大的互联网，将我们与\
  \ `Google` 连接，将我的电脑与你的电脑连接，等等。\n\n## 网关\n\n`gateway`（网关）是用于连接两个或多个网络的实体通用术语。中继器（`repeater`）工作在物理层，将信息从一个子网复制到另一个子网。网桥（`bridge`）工作在数据链路层，在网络之间复制帧（frames）。路由器（`router`）工作在网络层，不仅在网络之间移动信息，还决定路由。\n\
  \n## 数据包封装\n\n`OSI` 或 `TCP/IP` 栈中层之间的通信是通过将数据包从某一层发送到下一层，最终跨越网络完成的。每一层都有必须保留的关于其自身的层的管理信息。它在数据包向下传递时，通过向从上层接收的数据包添加头部信息（header\
  \ information）来实现。在接收端，当数据包向上移动时，这些头部会被移除。\n\n例如，`TFTP`（简单文件传输协议）将文件从一台计算机移动到另一台。它在\
  \ `IP` 协议之上使用 `UDP` 协议，该协议可能通过 `Ethernet` 发送。这看起来像图 1-3 所示所示。\n\n```\ndata\nTFTP\n\
  data\nheader\nUDP\nTFTP\ndata\nheader\nheader\nIP\nUDP\nTFTP\ndata\nheader\nheader\n\
  header\nethernet\nIP\nUDP\nTFTP\ndata\nheader\nheader\nheader\nheader\n```\n**图\
  \ 1-3.** TFTP（简单文件传输协议）\n\n在 `Ethernet` 上传输的数据包无疑是最下面的。\n\n## 连接模型\n\n为了使两台计算机能够通信，它们必须建立一条路径，以便可以在会话中发送至少一条消息。这有两种主要模型：\n\
  \n- 面向连接\n- 无连接\n\n### 面向连接\n\n为会话建立单一连接。双向通信沿连接流动。当会话结束时，连接断开。类比是电话对话。例子是 `TCP`。\n\
  \n## 无连接\n\n在无连接系统中，消息是独立发送的。普通邮件是其类比。无连接消息可能会乱序。例子是 `IP` 协议。`UDP` 是 `IP` 之上的无连接协议，通常作为\
  \ `TCP` 的替代方案，因为它轻量得多。\n\n面向连接的传输建立在无连接传输之上——`TCP` over IP`。\n\n无连接的传输建立在面向连接的传输之上——`HTTP`\
  \ over TCP`。\n\n这些可以有变体。例如，会话可能会强制消息到达，但可能无法保证它们按照发送顺序到达。然而，这两种是最常见的。\n\n## 通信模型\n\
  \n在分布式系统中，会有许多运行的组件必须相互通信。这有两种主要模型：消息传递和远程过程调用。\n\n### 消息传递\n\n某些非过程化语言建立在`message\
  \ passing`的原则之上。并发语言通常使用这种机制，最著名的例子可能是 `UNIX pipeline`（UNIX 管道）。`UNIX pipeline`\
  \ 是一个字节流管道，但这并不是固有的限制：微软的 `PowerShell` 可以沿着其管道发送对象，而像 `Parlog` 这样的并发语言可以在并发进程之间的消息中发送任意逻辑数据结构。\n\
  \n消息传递是分布式系统的原始机制。建立一个连接并向其泵一些数据。在另一端，确定消息是什么并对其做出响应，可能发回消息。这在图 1-4 中所示。\n\n```\n\
  Requestor\nResponder\nSend(Msg, Responder)\nReceive(Msg, Requestor)\nSend(Reply,\
  \ Requestor)\nReceive(Reply, Responder)\n```\n**图 1-4.** 消息传递通信模型\n\n事件驱动系统以类似的方式运行。在底层，`node.js`\
  \ 运行事件循环等待 I/O 事件，为这些事件分发处理器并做出响应。在较高层，大多数用户界面系统使用事件循环等待用户输入，而在网络世界，`Ajax` 使用 `XMLHttpRequest`\
  \ 来发送和接收请求。\n\n### 远程过程调用\n\n任何系统中都存在从系统的一个部分到另一个部分的信息传输和流控制。在过程语言中，这可能由过程调用组成，信息被放在调用栈上，然后控制流转移到程序的另一部分。\n\
  \n即使使用过程调用，也有变体。代码可能是静态链接的，以便控制从程序的可执行代码的一个部分转移到另一部分。由于库例程的使用日益增加，在动态链接库（`DLLs`）中拥有此类代码已成为常态，其中控制转移到一段独立的代码。\n\
  \n`DLLs` 运行在与调用代码相同的机器上。将控制转移到运行在不同机器上的过程是一个简单的（概念上的）步骤。但此的机制并不那么简单！然而，这种控制模型引发了远程过程调用（`RPC`），我们将在随后的章节中进行详细讨论。这在图\
  \ 1-5 中所示。\n\n```\nClient Process\nmain()\n{\nrpc(a, b, c)\n}\nServer Process\n\
  receive(x, y)\nsend(x=a, y=b)\nrpc(x, y, z)\n{\nreceive(c=z)\n...\n}\nsend(z)\n\
  ```\n**图 1-5.** 远程过程调用通信模型\n\n这有许多例子：有些基于特定的编程语言，例如 `Go rpc` 包（在第 [13 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_13)\
  \ 中讨论），有些是跨语言的 RPC 系统，如 `SOAP` 和 Google 的 `grpc`。\n\n## 分布式计算模型\n\n在最高层，我们可以考虑分布式系统中组件的效或非等效性。最常见的情况是非对称的：客户端向服务器发送请求，服务器做出响应。这是一个\
  \ `client-server` 系统。\n\n\n\n\n如果两个组件是等价的，既能发起也能响应消息，那么我们就有 `peer-to-peer`（对等）系统。注意这是一种逻辑分类：一个节点可能是一个\
  \ 16,000 核的超级计算机，另一个可能是一个手机。但如果两者都能相似的方式运行，它们就是对等节点。\n\n如图 1-6 所示。\n\n- 客户端-服务器\n\
  A\nB\n- 对等网络\nA\nA’\n\n**图 1-6.** 客户端-服务器系统与对等系统\n\n### 客户端-服务器系统\n\n客户端-服务器系统的另一种视图如图\
  \ 1-7 所示。\n\n用户\n客户端\n服务器\n请求\n客户端\n服务器\n处理\n处理\n响应\n系统\n系统\n硬件\n硬件\n\n**图 1-7.**\
  \ 客户端-服务器系统\n\n这种观点可能由需要了解系统组件的开发者持有。这可能也是用户的观点：浏览器用户知道它正在运行在自己的系统中，但正在与别处的服务器进行通信。\n\
  \n## 客户端-服务器应用程序\n\n某些应用程序可能是无缝分布的，用户并察觉到它是分布式的。用户将看到他们视角下的系统，如图 1-8 所示。\n\n客户端\n\
  服务器\n客户端\n应用程序\n处理\n进程\n系统\n系统\n硬件\n硬件\n\n**图 1-8.** 用户视角下的系统\n\n### 服务器分布\n\n客户端-服务器系统并不一定简单。基本模型是单客户端、单服务器系统，如图\
  \ 1-9 所示。\n\n客户端\n服务器\n\n**图 1-9.** 单客户端、单服务器系统\n\n然而，你也可以拥有多个客户端、单服务器，如图 1-10 所示。\n\
  \n客户端\n主\n客户端\n从\n从\n\n**图 1-10.** 多客户端、单服务器系统\n\n在这样的系统中，`master`（主服务器）接收请求，它不是自己一个一个地处理它们，而是将它们传递给其他服务器进行处理。当并发客户端存在时的一种常用模型。\n\
  \n还有单客户端、多服务器的情况，如图 1-11 所示。\n\n客户端\n服务器\n服务器\n\n**图 1-11.** 单客户端、多服务器系统\n\n当服务器需要作为其他服务器的客户端时，这种系统经常出现，例如业务逻辑服务器从数据库服务器获取信息。当然，也可能存在多个客户端和多个服务器。\n\
  \n## 通信流\n\n之前的图表展示了系统高层组件之间的连接视图。数据将在这些组件之间流动，可以通过多种方式进行，将在后续章节中进行讨论。\n\n### 同步通信\n\
  \n在同步通信中，一方将发送一条消息并阻塞，等待回复。这通常是最容易实现的模型，它仅依赖于阻塞 I/O。然而，可能需要一种超时机制，以防某些错误导致永远不会发送回复。\n\
  \n### 异步通信\n\n在异步通信中，一方发送消息后不再等待回复，而是继续其他工作。当回复最终到达时，再对其进行处理。这可以在另一个线程中进行，也可以通过中断当前线程进行。此类应用程序难以构建，但使用起来灵活得多。\n\
  \n### 流式通信\n\n在流式通信中，一方发送连续的消息流。在线视频就是一个很好的例子。流可能需要实时处理，可能允许或不允许丢失，并且可以是单向的，也可以像控制消息那样允许反向通信。\n\
  \n### 发布/订阅\n\n在发布/订阅（pub/sub）系统中，一方订阅主题，其他方向主题发布内容。这可以是小规模的也可以是大规模的，如 Twitter 所示。\n\
  \n## 组件分布\n\n分解许多应用程序的一种简单而有效的方法是将它们视为由三部分组成：\n\n- 展示组件\n- 应用程序逻辑\n- 数据访问\n\n`presentation\
  \ component`（展示组件）负责与用户的交互，包括显示数据和收集输入。它可能是一个带有按钮、列表、菜单的现代 GUI 界面，或者是旧式的命令行界面、提问并获取答案。它也可以涵盖如自动取款机（ATM）等物理设备的交互。\n\
  \n`application logic`（应用程序逻辑）负责解释响应、应用业务规则以及管理响应。\n\n`data access`（数据访问）组件负责存储和检索数据。这通常通过数据库进行，但并非如此。\n\
  \n### Gartner 分类\n\n基于这种应用程序的三层分解，Gartner 考虑了组件如何分布在客户端-服务器系统中。他们提出了五种模型，如图 1-12\
  \ 所示。\n\n展示\n展示\n展示\n展示\n逻辑\n逻辑\n逻辑\n逻辑\n数据\n数据\n数据\n数据\n数据\n数据\n远程\n远程\n远程\n数据\n\
  \n\n**图 1-12.** Gartner 的五种模型\n\n#### 示例：分布式数据库\n\n- Gartner 分类：1（见图 1-13）\n\n展示\n\
  逻辑\n数据\n数据\n\n**图 1-13.** 示例 1\n\n现代手机是这种技术的很好的例子。由于内存限制，它们可能在本地存储一部分数据库，以便能够快速响应。然而，如果需要本地不存在的数据，则可能向远程数据库请求额外数据。\n\
  \nGoogle Maps 是另一个很好的例子。所有的地图都位于 Google 的服务器上。当用户请求某张地图时，附近的地图也会下载到浏览器的小型数据库中。当用户移动地图时，所需的额外部分已经在存储中了。\n\
  \n#### 示例：网络文件服务\n\nGartner 分类 2 允许远程客户端访问共享文件系统，如图 1-14 所示。\n\n展示\n逻辑\n数据\n\n**图\
  \ 1-14.** 示例 2\n\n此类系统有很多：`NFS`、Microsoft 共享、`DCE` 等。\n\n#### 示例：Web\n\nGartner\
  \ 分类 3 是带有 Java Applets 或 JavaScript，以及服务器端 CGI 脚本或类似技术（`Ruby on Rails` 等）的 Web。这是一个分布式的超文本系统，具有许多额外的机制，如图\
  \ 1-15 所示。\n\n展示\n逻辑\n逻辑\n数据\n\n**图 1-15.** 示例 3\n\n#### 示例：终端仿真\n\nGartner 分类 4\
  \ 是终端仿真。它允许远程系统在本地系统上表现得像普通的终端，如图 1-16 所示。\n\n展示\n逻辑\n数据\n\n**图 1-16.** 示例 4\n\n\
  `Telnet` 是这种技术最常见的例子。\n\n#### 示例：Secure Shell (SSH)\n\nUnix 安全 shell 允许你连接到远程系统，在那里运行命令并在本地显示展示。展示内容在远程机器上准备并在本地显示。在\
  \ Windows 下，远程桌面具有类似的行为。见图 1-17。\n\n展示\n展示\n逻辑\n数据\n\n**图 1-17.** 示例 4\n\n## 三层模型\n\
  \n当然，如果你有两个层，那么你可以有三层、四层或更多层。一些三层的可能性如图 1-18 所示。\n\ndata\ndata\ndata\ndata\nlogic\n\
  logic\ndata\nlogic\nlogic\nlogic\n\n\n\n\n# 逻辑、数据与表示\n\n现代 Web 是这些要素中最右侧的一个良好示例。后端由数据库组成，通常运行存储过程来保存某些数据库逻辑。中间层是运行\
  \ PHP 脚本（或 Ruby on Rails、 JSP 页面等）的 HTTP 服务器。它将管理某些逻辑，并本地存储 HTML 页面等数据。前端是显示页面的浏览器，受某些\
  \ JavaScript 控制。在 HTML 5 中，前端可能也有一个本地数据库。\n\n***图 1-18。三层模型***\n\n## 胖与瘦\n\n对组件的常见标记方式是“胖”（fat）或“瘦”（thin）。胖组件占用大量内存并进行复杂的处理。另一方面，瘦组件在这两方面都做得极少。似乎不存在任何“正常”尺寸的组件，只有胖或瘦！\n\
  \n胖与瘦是一个相对概念。浏览器通常被标记为瘦，因为它们所做的只是显示网页。然而，在我 Linux 机器上的 Firefox 占据了近半 GB 的内存，我并不认为它小！\n\
  \n## 中间件模型\n\n中间件是连接分布式系统组件的“胶水”。中间件模型如图 1-19 所示。\n\n```\nClient processes\nServer\
  \ processes\nClient\nServer\nmiddleware\nExchange\nmiddleware\nprotocol\nLocal\n\
  Network\nLocal\nNetwork\nservices\nO/S and h/w\nO/S and h/w\nnetwork protocol\n\
  ```\n\n***图 1-19。中间件模型***\n\n中间件的组件包括：\n\n* 网络服务，如 `TCP/IP`\n* 中间件层是使用服务的服务的无关软件\n\
  * 数据库访问\n* 身份等服务的管理器\n* 安全模块\n\n### 中间件示例\n\n中间件的示例包括：\n\n* 原始服务，如终端仿真器、文件传输和电子邮件\n\
  * 基础服务，如 `RPC`\n* 集成服务，如 `DCE`（分布式计算环境）\n* 分布式对象服务，如 `CORBA` 和 `OLE/ActiveX`\n*\
  \ 移动对象服务，如 `RMI` 和 `Jini`\n* 世界维网\n\n### 中间件功能\n\n中间件的功能可以包括：\n\n* 在不同的计算机上启动进程\n\
  * 会话管理\n* 允许客户端定位服务器的目录服务\n* 远程数据访问\n* 允许服务器处理多个客户端的并发控制\n* 安全性和完整性\n* 监控\n* 本地和远程进程的终止\n\
  \n## 处理连续体\n\nGartner 模型基于将应用程序分解为表示、应用逻辑和数据处理的组件。更细粒度的分解如图 1-20 所示。\n\n```\nTYPE\
  \ | ACTIVITY | DIVISION\n| :--- | :--- | :--- |\n| 键盘/鼠标输入 | (Client) | Host |\n\
  | 交互式屏幕处理 | application processing | |\n| 图形/声音/视频控制 | Intelligent | |\n| 命令/菜单/对话框解释\
  \ | terminal | |\n| 帮助处理 | GUI frontend | |\n| 数据输入验证 | application processing |\
  \ application logic |\n| 错误恢复 | Client/server | |\n| 事务构建处理 | | |\n| 事务验证 | Networked\
  \ SQL | |\n| 数据库访问 | database | |\n| 管理和存储 | (Server) | |\n```\n\n***图 1-20。应用程序分解为各个组件***\n\
  \n### 故障点\n\n应用程序运行在复杂的环境中，这使得它们比独立应用程序更容易故障。故障点包括：\n\n* 客户端错误\n* 应用程序可能会崩溃\n* 系统可能有硬件问题\n\
  * 网卡可能失效\n* 网络错误\n* 网络竞争可能导致故障\n* 网络元素可能失效\n* 传输错误\n* 客户端-服务器错误\n* 服务器可能会崩溃\n* 数据库可能会损坏\n\
  * 网络宕机\n\n设计应用程序时必须考虑这些故障。在许多情况下，服务器对发生的情况没有控制权。\n\n### 验收因素\n\n分布式系统的验收因素与独立系统相似。它们包括：\n\
  \n* 可靠性\n* 性能\n* 响应能力\n* 可扩展性\n* 容量\n* 安全性\n\n## 透明性\n\n分布式系统的“圣杯”是提供以下：\n\n* 访问透明性\n\
  * 位置透明性\n* 迁移透明性\n* 副本透明性\n* 并发透明性\n* 可扩展性透明性\n* 性能透明性\n* 故障透明性\n\n### 访问透明性\n\n\
  用户不需要知道（也不需要知道）访问系统的全部或部分是本地还是远程的。\n\n### 位置透明性\n\n服务的位置并不重要。\n\n### 迁移透明性\n\n如果系统的部分移动到另一个，对用户应该没有影响。\n\
  \n### 副本透明性\n\n运行一个或多个系统副本并不重要。\n\n### 并发透明性\n\n并发运行的系统部分之间不应干扰。例如，如果我正在访问数据库，那么你不应该知道这件事。\n\
  \n### 可扩展性透明性\n\n系统上有一个用户还是有一万用户并不重要。\n\n### 性能透明性\n\n性能不应任何系统或网络特征的影响。\n\n### 故障透明性\n\
  \n系统不应该故障。如果它的部分发生故障，系统应该在用户不知道故障发生的情况下恢复。\n\n## 分布式计算的八大谬误\n\n太阳公司（Sun Microsystems）是分布式系统早期做了大量工作的公司，甚至有一句格言“网络就是计算机”。根据他们多年的经验，Sun\
  \ 的科学家提出了以下常见的假设谬误列表：\n\n1. 网络是可靠的。\n2. 延迟为零。\n3. 带宽是无限的。\n4. 网络是安全的。\n5. 拓扑不会改变。\n\
  6. 只有一个管理员。\n7. 传输成本为零。\n8. 网络是同构的。\n\n\n\n\nBailis 和 Kingsbury 写了一篇名为《网络是可靠的》论文（参见\
  \ [`queue.acm.org/detail.cfm?id=2655736`](http://queue.acm.org/detail.cfm?id=2655736)），探讨了这一谬误。它发现了许多实例，例如微软报告称其数据中心每天发生\
  \ 5.2 次设备故障和 40.8 次链路故障。\n\n中国政府使用“DNS 投毒”作为其技术手段之一来审查他们认为不理想的网站。中国还运行着一个 DNS 根服务器。2010\
  \ 年，该服务器配置错误，并投毒了许多其他国家的 DNS 节点。这导致许多非中国网站在境内和境外都无法访问（参见 [`www.pcworld.com/article/192658/article.html`](http://www.pcworld.com/article/192658/article.html)）。\n\
  \n还有许多其他可能的情况，例如 DDOS（分布式拒绝服务）攻击导致网站无法使用。在 Box Hill 学院，曾有一位承包商用挖掘机挖断了连接我们 DHCP 服务器与网络其余部分的纤电缆，导致我们那天剩下的时间只能回家了。\n\
  \n网络*不是*可靠的。其意义意味着任何网络化程序都必须准备好处理故障。这导致了 Java 的 RMI 以及大多数后续框架的设计选择，即应用程序设计允许每次网络调用都可能失败。\n\
  \n18\n第 1 章 ■ 架构\n\n### 谬误：延迟为零\n\n延迟是发送信号与获得回复之间的延迟。在单进程系统中，延迟取决于函数调用返回之前执行的计算量；但在网络上，它通常仅仅由于必须经过传输层并由路径上的路由器等各种节点处理而产生。\n\
  \n`ping` 命令是显示延迟的好方法。从墨尔本向 Google 的澳大利亚服务器 `ping` 大约需要 20 毫秒。向百度中国服务器 `ping` 大约需要\
  \ 200 毫秒。\n\n相比之下，Williams（参见 [`www.eetimes.com/document.asp?doc_id=1200916`](http://www.eetimes.com/document.asp?doc_id=1200916)）讨论了\
  \ Linux 调度器的延迟，得出的平均延迟为 88 微秒。网络调用的延迟是其数千倍。\n\n### 谬误：带宽是无限的\n\n每个在下载时去泡杯茶或咖啡的人都知道这是一个谬误。我运行着自己的\
  \ Web 服务器，在 ADSL2 上我获得 800 Kbps 的上传速度。我足够不幸，家里接入了 HFC（混合光电缆），而那糟糕的澳大利亚国家宽带网络可能会将其升级到\
  \ 1000 Kbps。在三年后，即 2020 年。\n\n在此期间，我使用本地无线连接获得 75 Mbps 的上下行对等速度，但这仍然不够快！\n\n###\
  \ 谬误：网络是安全的\n\n科技公司强烈主张在所有网络通信中使用强加密，而世界各国政府也同样强烈主张使用较弱的系统或“仅供特定政府使用”的后门。这似乎同样适用于*民主*（我这个无意的拼写错误可能是正确的！）以及极权主义政府。\n\
  \n此外，当然还有通用的“坏人”，他们以数百万计窃取并出售信用卡号和密码。\n\n### 谬误：拓扑结构不会改变\n\n噢，它会变。通常这可能会影响延迟和带宽。但硬编码路由或\
  \ IP 地址越多，网络应用程序就越容易失败。\n\n### 谬误：只有一个管理员\n\n那又怎样？当一切运行良好时没有问题。只有当出现故障时，问题才开始——怪谁？谁来修复？\n\
  \n从我位于澳大利亚墨尔本的地方，我看到的 `ping` 时间如下：\n\n```\nping www.google.com.au\nPING google.com.au\
  \ (216.58.203.99) 56(84) bytes of data.\n64 bytes from syd09s15-in-f3.1e100.net\
  \ (216.58.203.99): icmp_seq=1 ttl=50 time=27.1 ms\n64 bytes from syd09s15-in-f3.1e100.net\
  \ (216.58.203.99): icmp_seq=2 ttl=50 time=19.7 ms\n```\n\n19\n第 1 章 ■ 架构\n\n多年来一个主要研究课题是*网格计算*，它将计算任务分布在许多大学和研究机构中，以解决巨大的科学问题。由于不仅有多个管理员，还有不同的访问和安全问题、不同的维护计划等，这必须解决许多复杂的问题。云计算的出现*解决*了其中的许多此类问题，减少了管理员和系统的数量，使得云计算比许多网格系统更具韧性。\n\
  \n### 谬误：传输成本为零\n\n一旦我买了 PC，从我的 PC 出发的传输成本就是零。Go 的特殊特性是“结构化”类型，当然，还有从 C、C++ 和 Java\
  \ 大规模程序中学到的经验的益处。\n\n### 谬误：网络是同质的\n\n网络不是同质的，端点也不是——例如你的 PC、iPad 和手机。\n\n结论\n\n\
  本章试图强调，分布式计算有其独特的特性。忽视这些特性只会导致失败。\n\n20\n**第 2 章**\n\n## Go 语言概述\n\n编程语言层出不穷。有些是高度专业的，另一些非常通用，而第三类则是为了填充广泛但小众的领域设计的。Go\
  \ 创建于 2007 年，并在 2009 年发布。它旨在成为一种系统语言，用于网络和多处理补充或替代 C++ 及其他静态编译语言。\n\nGo 加入了包括 Rust、Swift、Julia\
  \ 在内的多种现代语言群体。Go 的特殊特性是语法简单、多单元编译快、基于“结构化”类型的面向对象编程，当然，还有从 C、C++ 和 Java 学到的经验的益处。\n\
  \n2017 年初的语言排行榜如 TIOBE（参见 [`www.tiobe.com/tiobe-index/`](http://www.tiobe.com/tiobe-index/)）将\
  \ Go 排在当前第 14 位语言。PYPL（参见 [`pypl.github.io/PYPL.html`](http://pypl.github.io/PYPL.html)）将其排在第\
  \ 19 位。这与有 20 多年历史的 Java、Python、C、C++、JavaScript 等语言并列。\n\n本书假设你是一名经验丰富的编程人员，对 Go\
  \ 有某种程度或深入的了解。这可以通过入门书籍，如 Caleb Doxsey 写的*Introducing Go*（O'Reilly）或 Karl Seguin\
  \ 写的*The* *Little Go Book*，或者通过阅读更正式的文档，如 Go 语言规范 [`golang.org/ref/spec`](https://golang.org/ref/spec)来实现。\n\
  \n如果你是经验丰富的程序员，可以跳过本章。如果不是，本章指出了书中使用的 Go 知识，但你应该去其他地方获取必要的背景。Go 网站 [`golang.org`](http://golang.org/)\
  \ 上有几个教程：\n\n* 入门 (Getting started)\n* Go 语言教程\n* 高效 Go (Effective Go)\n* GoLang\
  \ 教程 (GoLang tutorials)\n\n\n\n\n安装 Go 最好是从 Go 编程语言官网进行。在编写本书时，`Go 1.8` 刚刚发布。书中的大多数示例将使用\
  \ `Go 1.6` 运行，少数几个指向了 `Go 1.8`。你实际上不需要安装 `Go` 就可以测试程序：`Go` 主页上有一个可以访问的“游场”（playground），可用于运行代码。此外还有几个\
  \ REPL（读取-评估-打印循环）环境，但这些都是第三方的。\n\n本书主要使用 Go 库（https://golang.org/pkg/）中的库和包。Go\
  \ 团队还构建了另一组被称为“子仓库”的包，这些包通常没有标准库相同的支持。它们偶尔会被使用。它们需要使用 `go get` 命令进行安装。这些包的名称包含一个“x”，例如\
  \ `golang.org/x/net/ipv4`。\n\n© Jan Newmarch 2017\n\n21\n\nJ. Newmarch, *Network\
  \ Programming with Go*, DOI 10.1007/978-1-4842-2692-6_2\n\n## 第 2 章 ■ Go 语言概述\n\n\
  ## 类型\n\n预定义了布尔型、数值型和字符串类型。数值类型包括 `uint32`、`int32`、`float32` 以及其他尺寸的数字，以及字节 (`uint8`)\
  \ 和 runes。runes 和字符串将在第 7 章（http://dx.doi.org/10.1007/978-1-4842-2692-6_7）中详细讨论，因为国际化问题在分布式程序中可能非常重要。\n\
  \n接下来将讨论更复杂的类型。\n\n### 切片和数组\n\n数组是单一类型元素的序列。切片是底层数组的片段。在 Go 中，处理切片通常更方便。可以静态创建数组：\n\
  \n```go\nvar x [128]int\n```\n\n或者作为指针动态创建：\n\n```go\nxp := new([128]int)\n```\n\
  \n可以与创建底层数组的同时创建一个切片：\n\n```go\nx := make([]int, 50, 100)\n```\n\n或者\n\n```go\n\
  x := new([100]int)[0:50]\n```\n\n最后两个的类型都是 `[]int`（如 `reflect.TypeOf(x)` 所示）。\n\n\
  通过索引访问数组或切片的元素：\n\n```go\nx[1]\n```\n\n索引从 0 到 `len(x)-1`。\n\n可以通过数组或切片的下界（包含）和上界（不包含）索引从数组或切片提取切片：\n\
  \n```go\na := [5]int{-1, -2, -3, -4, -5}\ns := a[1:4] // s 现在是 [-2, -3, -4]\n```\n\
  \n## 结构\n\n结构与其他语言中的结构类似。在第 4 章（http://dx.doi.org/10.1007/978-1-4842-2692-6_4）中，我们考虑了数据的序列化，并使用了以下结构体的示例：\n\
  \n```go\ntype Person struct {\n    Name Name\n    Email []Email\n}\n\ntype Name\
  \ struct {\n    Family string\n    Personal string\n}\n\ntype Email struct {\n \
  \   Kind string\n    Address string\n}\n```\n\n复合结构体可以如下声明：\n\n```go\nperson :=\
  \ Person{\n    Name: Name{Family: \"Newmarch\", Personal: \"Jan\"},\n    Email:\
  \ []Email{\n        Email{Kind: \"home\", Address: \"jan@newmarch.name\"},\n   \
  \     Email{Kind: \"work\", Address: \"j.newmarch@boxhill.edu.au\"},\n    },\n}\n\
  ```\n\n结构体字段的可见性由字段名称第一个字母的大小写控制。如果是大写字母，则在声明它的包外部可见；如果是小写字母，则不可见。在上例中，所有结构体的所有字段都是可见的。\n\
  \n## 指针\n\n指针的行为与其他语言中的指针类似。`*` 运算符解引用指针，而 `&` 运算符获取地址。\n\n## 函数\n\n使用以下语法定义函数：\n\
  \n```go\nfunc main() {\n}\n```\n\n函数可以返回结果，如下：\n\n```go\nfunc check(err error) {\n\
  \    if err != nil {\n        fmt.Fprintf(os.Stderr, \"Fatal: %s\\n\", err)\n  \
  \      os.Exit(1)\n    }\n}\n```\n\n22\n第 2 章 ■ Go 语言概述\n\n23\n第 2 章 ■ Go 语言概述\n\
  \n24\n第 2 章 ■ Go 语言概述\n\n\n\n\n除了语法之外，这些内容与其他编程语言中的含义本质上相同。几乎所有的语句类型将在后续章节中使用。\n\
  \n## GOPATH\n\n组织项目工作空间有两种方式：将每个项目都放在一个共享的工作空间中，或者为每个项目设置一个独立的工作空间。我个人倾向于后者，而显然大多数\
  \ Go 程序员的偏好是前者。\n\n`go` 工具通过环境变量 `GOPATH` 支持这两种方式。该变量可以被设置为目录列表（在 Linux/UNIX 上使用用\
  \ `:` 分隔的列表，在 Windows 上使用 `;` 分隔的列表，在 Plan9 上使用列表）。如果没有设置，它将默认为用户主目录下的 `go` 目录。\n\
  \n对于 `GOPATH` 中的每个目录，会有三个子目录——`src`、`pkg` 和 `bin`。`src` 目录通常包含一个对应包名的目录，在该目录下是该包的源文件。例如，在第\
  \ 10 章中，我们有一个完整的 Web 服务器，它使用了我们定义的 `dictionary` 和 `flashcards` 包。`src/flashcards`\
  \ 目录包含 `FlashCards.go` 文件。\n\n## 运行 Go 程序\n\nGo 程序必须包含一个定义 `package main` 的文件。书中的大多数程序都定义在单个文件中，例如第\
  \ 3 章中的 `IP.go` 程序。运行它最简单的方法是从该文件所在的目录执行：\n\n```\ngo run IP.go <IP address>\n```\n\
  \n或者，你可以构建一个可执行文件然后运行它：\n\n```bash\ngo build IP.go\n./IP <IP address>\n```\n\n需要标准库之外包的程序需要设置\
  \ `GOPATH`。例如，第 10 章中的程序（在 Linux 下）需要：`export GOPATH=$PWD`\n\n```bash\ngo run Server.go\
  \ <port>\n```\n\n## 标准库\n\nGo 拥有一套广泛的标准库。虽然没有像 C、Java 或 C++ 那么大，但那些语言已经存在很长时间了。Go\
  \ 包的文档可以在 `https://golang.org/pkg/` 查看。\n\n我们将在书中大量使用这些库，特别是 `net`、`crypto` 和 `encoding`\
  \ 包。\n\n此外，在同一页面还有一组子仓库包可用。这些包的稳定性较低，但有时会有很有用的包，我们会偶尔使用。\n\n除了这些，还有大量用户贡献的包。它们不会出现在讨论原理的书正文中，但在实践中，你可能会发现其中很多非常有用。有些会在结论章节中讨论。\n\
  \n## 错误值\n\n我们在上一章中讨论了，分布式编程与本地编程的一个主要区别在于执行过程中发生错误的概率大大。本地函数调用可能因为简单的编程错误（如除以零）而失败；可能会发生更微妙的错误，如内存溢出，但它们的发生通常是可预测的。\n\
  \n另一方面，几乎任何利用网络的函数都会因为应用程序控制之外的原因而失败。因此，网络程序充满了错误检查。这很麻烦，但是必要的。就像操作系统内核代码总是进行错误检查一样——错误需要被管理。\n\
  \n在书中，我们通常会在客户端带有适当的消息退出错误程序，而对于服务器，则尝试通过断开故障连接并继续运行来恢复。\n\nC 等语言通常通过返回非法值（如负整数、空指针）或抛出信号来表示错误。Java\
  \ 等语言抛出异常，这可能导致代码混乱且通常运行较慢。标准的 Go 函数通过函数调用返回的额外参数来提供错误。\n\n例如，在下一章中，我们讨论了 `net`\
  \ 包中的函数：\n\n```go\nfunc ResolveIPAddr(net, addr string) (*IPAddr, error)\n```\n\n\
  管理此错误的典型代码是：\n\n```go\naddr, err := net.ResolveIPAddr(\"ip\", name)\nif err != nil\
  \ {\n    ...\n}\n```\n\n## 总结\n\n本书假设读者已熟悉 Go 编程语言。本章只是强调了后续章节需要的部分。\n\n## 第 3 章：套接字编程\n\
  \n世界上有许多种网络。从非常老的网络（如串行链路）到由铜和光纤制成的广域网，再到各种类型的无线网络（包括计算机网络和电话等电信设备）。这些网络在物理链路层上显然不同，但在许多情况下，它们在\
  \ OSI 栈的高层上也不同。\n\n多年来，网络一直向 IP 和 TCP/UDP 的“互联网栈”收敛。例如，蓝牙定义了物理层和协议层，但在其之上是一个 IP\
  \ 栈，以便在许多蓝牙设备上可以使用相同的互联网编程技术。同样，开发物联网（IoT）无线技术（如 LoRaWAN 和 6LoWPAN）也包含了 IP 栈。\n\n\
  虽然 `IP` 提供了 OSI 栈的第 3 层网络，但 `TCP` 和 `UDP` 处理第 4 层。即使在互联网世界，这些也不是终点：`SCTP`（流控制传输协议）来自电信领域，挑战\
  \ TCP 和 UDP；而在星际空间提供互联网服务需要新的、正在开发中的协议，如 `DTN`（容延网络）。尽管如此，`IP`、`TCP` 和 `UDP` 现在以及在未来相当一段时间内一直是主要的网络技术。Go\
  \ 完全支持这种编程风格。\n\n本章展示了如何使用 Go 进行 TCP 和 UDP 编程，以及如何使用原始套接字（raw socket）处理其他协议。\n\n\
  ## TCP/IP 栈\n\nOSI 模型是通过委员会程序设计的，设定标准然后进行实现。OSI 标准的某些非常晦懂，某些部分难以实现，有些部分尚未实现。\n\n\
  `TCP/IP` 协议是通过一个长期的 DARPA 项目设计的。它通过先实现后发布 RFC（意见征求）来实现。`TCP/IP` 是主要的 UNIX 网络协议。`TCP/IP`\
  \ 代表传输控制协议/互联网协议。\n\n`TCP/IP` 栈比 OSI 栈短，如图 3-1 所示。\n\n\n\n\n\n为了使用一项服务，你必须能够找到它。互联网对计算机等设备使用了一种寻址方案，以便进行定位。这种寻址方案最初是在只有少数连接的计算机时设计的，当时它非常慷慨地允许多达\
  \ $2^{32}$ 个地址，使用 32 位无符号整数。这些就是所谓的 `IPv4` 地址。近年来，连接的（或至少是可以直接寻址的）设备数量威胁到将超过这一数字，因此正在向\
  \ `IPv6` 逐步过渡。这种过渡是不均匀的，例如在 Google 的图表所示（`https://www.google.com/intl/en/ipv6/statistics.html`）所示。遗憾的是——从我的观点来看，很少有澳大利亚的\
  \ IP 商支持 `IPv6`。\n\n#### IPv4 地址\n\n该地址是一个 32 位整数，表示 IP 地址。该地址细化到单个设备上的网络接口卡。该地址通常写为四个十进制字节，字节之间用句点隔开，例如\
  \ `127.0.0.1` 或 `192.168.1.1`。任何设备的 IP 地址通常由两部分组成：设备所在的网络地址，以及该设备在该网络中的地址。曾几何时，这种划分是简单的，并且基于\
  \ IP 地址中使用的字节：\n\n- `class A` 网络：第一个字节识别网络，后三个字节识别设备。只有 128 个 `class A` 网络，由 IBM\
  \ 和通用电气（General Electric）等非常期的参与者所有。\n- `class B` 网络：前两个字节识别网络，后两个字节识别子网内的设备。这允许多达\
  \ $2^{16}$ (65,536) 个设备。\n- `class C` 网络：前三个字节识别网络，最后一个字节识别该网络内的设备。这允许多达 $2⁸$ 个设备（实际上是\
  \ 254 个，因为顶端地址被保留了）。\n\n如果你想在一个网络上有例如 400 台计算机，这种方案就不好好用了。254 太小了，而 65,536 又太大了。在二进制算术术中，你想要大约\
  \ $2^{12}$。这可以通过使用 23 位网络位和 9 位设备位来实现。同样，如果你想要多达 1024 个，你就使用 22 位网络位和 10 位设备地址。\n\
  \n给定一个设备的 IP 地址并知道用于网络地址的位数 `N`，为提取网络地址和该网络内的设备地址提供了一个相对直接的过程。形成一个“网络掩码”，它是一个 32\
  \ 位数，前部全为 1，剩余部分全为 0。例如，如果 16 位用于网络地址，则掩码为 `11111111111111110000000000000000`。使用二进制有点不方便，所以通常使用字节。16\
  \ 位网络地址的网掩码为 `255.255.0.0`，24 位网络地址的掩码为 `255.255.255.0`，而 23 位地址为 `255.255.254.0`，22\
  \ 位地址为 `255.255.252.0`。\n\n要找到一个设备的网络，将其 IP 地址与网络掩码进行位 `AND`（与）运算，而子网内的设备地址通过将掩码的反码与\
  \ IP 地址进行位 `AND` 运算来找到。例如，IP 地址 `192.168.1.3` 的二进制值为 `11000000101010000000000100000011`。如果使用\
  \ 16 位网掩，网络为 `11000000101010000000000000000000`（或 `192.168.0.0`），而设备地址为 `00000000000000000000000100000011`（或\
  \ `0.0.1.3`）。\n\n#### IPv6 地址\n\n互联网的增长已远超最初的预期。最初慷慨的 32 位寻址方案正处于耗尽边缘。有一些不佳的宜方法，例如\
  \ `NAT`（网络地址转换）寻址，但最终我们不得不切换到更宽的地址空间。`IPv6` 使用 128 位地址。字节表示此类地址变得繁琐，因此使用了十六进制数字，每四位一组并用冒号\
  \ `:` 分隔。一个典型的地址可能是 `FE80:CD00:0000:0CDE:1257:0000:211E:729C`。\n\n最近，MIT 将他们的 A\
  \ 类网络归还给了池。这些地址并不容易记忆！DNS 将变得更加重要。有一些技巧可以减少某些地址，例如前导零和重复数字。例如，“localhost”是 `0:0:0:0:0:0:0:1`，可以缩短为\
  \ `::1`。\n\n每个地址分为三个部分：第一个是用于互联网路由的网络地址，是前 64 位。\n\n（注：原文提供的文本后半部分出现了严重的重复和逻辑错乱，译文已根据原文内容尽可能继续翻译）\n\
  \n\n\n\n\"\\n 掩码长度为 \", bits,\n\n\"\\\\n 前导 1 计数为 \", ones,\n\n\"\\\\n 掩码（十六进制）\
  \ \", mask.String(),\n\n\"\\\\n 网络地址为 \", network.String())\n\nos.Exit(0)\n\n}\n\
  \n它可以编译为 `Mask` 并如下如下运行：\n\n```\nMask <ip-address> <ones> <zeroes>\n```\n\n或者可以直接如下运行：\n\
  \n```\ngo run Mask.go <ip-address> <ones> <zeroes>\n```\n\n对于 `/24` 网络上的 IPv4 地址\
  \ 103.232.159.187，我们得到以下结果：\n\n```\ngo run Mask.go 103.232.159.187 24 32\n```\n\
