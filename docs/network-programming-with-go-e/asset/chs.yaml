  \ 后记\n\n## 关于作者\n**Jan Newmarch** 是 Box Hill 学院 ICT（高等教育）负责人，堪培拉大学兼任教授，以及查斯·斯特特大学信息技术、计算与数学学院的兼任讲师。他对计算的各个方面的兴趣超过了他的精力所及范围，但过去几年的重点已从\
  \ `UNIX` 下的用户界面转向了 Java、Web，然后是通用的分布式系统。Jan 在这些领域开发了许多公开的软件系统。过去几年，他一直在研究 `Linux`\
  \ 系统的音频以及树莓派的 GPU 编程。现在他正在探索物联网（IoT）的相关领域。他住在澳大利亚墨尔本，喜欢那里的食物和文化，但对那里的天气并不印象深刻。\n\
  \n## 关于技术审查员\n**Ronald Petty**，M.B.A., M.S. 是位于旧金山的管理咨询公司 Minimum Distance LLC 的创始人。他花时间帮助技术初创公司做出正确的决策。他还是加州大学伯克利分校延伸（UC\
  \ Berkeley Extension）的讲师。\n\n# 前言\n\n\n\n\n学习一种新的编程语言总是一件乐事，尤其是当它证明是一门主流语言时。在 2009\
  \ 年 `Go` 发布之前，我一直在蒙纳什大学（Monash University）教授一门关于网络编程的硕士级课程。在学习新语言时，有一个目标是很好的，但这一次，我决定不再去构建另一个红酒窖程序，而是将我的讲义笔记围绕\
  \ `Go` 展开，而不是我（当时）标准的教学媒介 `Java`。\n\n这次实验效果非常好：除了 `Go` 尚未比拟 `Java` 库的丰富性外，所有的编程示例迁移得都非常出色，在许多情况下，它们比原始的\
  \ `Java` 程序更加优雅。\n\n这本书就是实验的成果。随着 `Go` 的演进以及 `HTTP/2` 等新技术的出现，我对其进行了更新。但如果它读起来像是一本教科书，那是因为它确实是一本教科书。网络编程涉及大量的理论概念和实践概念，这本书涵盖了其中一些内容，以及使用\
  \ `Go` 构建系统的实际操作方法。\n\n从语言的流行程度来看，`Go` 显然正在上升。它在 TIOBE 指数中升至第 16 位，在 `PYPL`（编程语言流行度）中排名第\
  \ 18 位，在 RedMonk 编程语言排名中位列第 15 位。它被认为是增长最快的语言之一。\n\n核心语言和库的开发者社区以及独立项目的开发者社区都在不断扩大。我尝试将本书的范围限制在标准库以及\
  \ `Go` 树的“子仓库”中。虽然这排除了许多无疑能让许多编程任务变得更优秀项目，但将书籍限制在官方 `Go` 库上提供了一个清晰的边界。\n\n本书假设读者已具备基础的\
  \ `Go` 知识。重点在于如何使用 `Go` 构建网络应用程序，而不是语言的基础。网络应用程序与命令行应用程序不同，与带有图形用户界面的应用程序不同，此类推。因此，第一章讨论了网络程序的架构方面。第二章概述了我们在书中使用的\
  \ `Go` 特性。第三章关于套接字（sockets），涵盖了所有 `TCP/IP` 系统基础的 `Go` 版本。第 [4](http://dx.doi.org/10.1007/978-1-4842-2692-6_4)章\
  \ [5](http://dx.doi.org/10.1007/978-1-4842-2692-6_5)章和 [6](http://dx.doi.org/10.1007/978-1-4842-2692-6_6)章在网络编程书籍中比较寻常。它们涵盖了将使用什么数据表示、网络交互将如何进行，以及对于文本使用哪种语言格式等主题。随后在第\
  \ [7, w](http://dx.doi.org/10.1007/978-1-4842-2692-6_7) 章中，我们查看了日益重要的安全问题。\n\n在\
