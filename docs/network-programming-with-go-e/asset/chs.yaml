  ```\n\n### Echo Client\n\n使用该包的 echo 客户端是 `EchoClientGorilla.go`：\n\n```go\n/* EchoClientGorilla\
  \ */\npackage main\n\nimport (\n\t\"fmt\"\n\t\"github.com/gorilla/websocket\"\n\t\
  \"io\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\
  \t\tfmt.Println(\"Usage: \", os.Args[0], \"ws://host:port\")\n\t\tos.Exit(1)\n\t\
  }\n\tservice := os.Args[1]\n\theader := make(http.Header)\n\theader.Add(\"Origin\"\
  , \"http://localhost:12345\")\n\tconn, _, err := websocket.DefaultDialer.Dial(service,\
  \ header)\n\tcheckError(err)\n\tfor {\n\t\t_, reply, err := conn.ReadMessage()\n\
  \t\tif err != nil {\n\t\t\tif err == io.EOF {\n\t\t\t\t// 服务器平滑关闭\n\t\t\t\tfmt.Println(\"\
  EOF from server\")\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tif websocket.IsCloseError(err,\
  \ websocket.CloseAbnormalClosure) {\n\t\t\t\tfmt.Println(\"Close from server\")\n\
  \t\t\t\tbreak\n\t\t\t}\n\t\t\tfmt.Println(\"Couldn't receive msg \" + err.Error())\n\
  \t\t\tbreak\n\t\t}\n\t\t//checkError(err)\n\t\tfmt.Println(\"Received from server:\
  \ \" + string(reply[:]))\n\t\t// 这里的消息\n\t\terr = conn.WriteMessage(websocket.TextMessage,\
  \ reply)\n\t\tif err != nil {\n\t\t\tfmt.Println(\"Couldn't return msg\")\n\t\t\t\
  break\n\t\t}\n\t}\n\tos.Exit(0)\n}\n\nfunc checkError(err error) {\n\tif err !=\
  \ nil {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n\
  ```\n\n客户端的运行方式如下：\n\n```bash\ngo run EchoClientGorila ws://localhost:12345\n```\n\
  \n## 结论\n\nWebSockets 标准是一项 IETF RFC，因此预计不会有重大变化。这将允许 HTTP 用户代理和服务器建立双向套接字连接，并应该让某些交互风格变得容易得多。Go\
  \ 有两个包支持 WebSockets。\n\n### 结记\n\n本书探讨了分布式编程的基础以及如何在 Go 中实现这些内容。这有无限的扩展。例如，你可能对分布式系统中如何管理时间感兴趣，或者副本数据库如何维护一致性（或较弱的最终一致性）。你可能对负载均衡算法感兴趣，或者对\
  \ map-reduce 等技术感兴趣（常用于处理跨分布式数据库的查询），或者网格计算系统如何跨越不同类型、不同管理域的数千台计算机。亦或是如何将极大地简化的模型用于云计算。\n\
  \n其中一些是经典的分布式系统问题，相关信息可以在 Andrew S. Tanenbaum 和 Maarten Van Steen 的《Distributed\
  \ Systems - Principles and Paradigms》等书中找到。网格计算的基础可以在 Foster 和 Carl Kesselman 的著作《The\
  \ Grid: Blueprint for a New Computing Infrastructure》中找到，map-reduce 则在关于 Hadoop\
  \ 的书中介绍。\n\n如果你专门想要 Go 实现的分布式框架、技术或标准库中没有的算法，可以查看 Go Projects（参见 `https://github.com/golang/go/wiki/Projects`），它维护了一个活跃的第三方\
  \ Go 项目列表。\n\n还有其他关于该领域的书籍，例如 Shiju Varghese 的《Web Development with Go》，Nathan Kozyra\
  \ 的《Mastering Go Web Services》以及其他书籍。一个列出许多书籍的好网站是 Golang books（`https://github.com/golang/go/wiki/Books`）。\n\
  \n我个人的兴趣日益转向物联网（IoT）领域。在这里，你可以看到 Go 的活动，框架如 Gobot（`https://gobot.io/`）和 Project\
  \ Flogo（`https://dzone.com/articles/project-flogo-golang-powered-open-source-iot`）。MQTT\
  \ 消息传递协议在物联网领域正受到关注，Eclipse Paho MQTT 客户端（`https://github.com/eclipse/paho.mqtt.golang`）可以参与其中。当然，Go\
  \ 可以在树莓派上运行，这是物联网实验的良好起点。你可以预计 Go 在物联网领域将会有更多活动，因为它可以编译为多种处理器类型的机器码。祝你的 Go 之之旅愉快！\n\
