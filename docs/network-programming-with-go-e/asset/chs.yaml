  \ttcpAddr, err := net.ResolveTCPAddr(\"tcp4\", service)\n\tcheckError(err)\n\tlistener,\
  \ err := net.ListenTCP(\"tcp\", tcpAddr)\n\tcheckError(err)\n\tfor {\n\t\tconn,\
  \ err := listener.Accept()\n\t\tif err != nil {\n\t\t\tcontinue\n\t\t}\n\t\thandleClient(conn)\n\
  \t\tconn.Close() // we're finished\n\t}\n}\n```\n\n44\n第 3 章 ■ 套接字级编程\n\n```go\n\
  func handleClient(conn net.Conn) {\n\tvar buf [512]byte\n\tfor {\n\t\tn, err :=\
