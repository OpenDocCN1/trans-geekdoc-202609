  \ 章 ■ 一个完整的 Web 服务器\n\n我们现在讨论具体的函数。\n\n### listFlashCards 函数\n\n`listFlashCards`\
  \ 函数用于创建顶部页面。省略侧边栏列表，HTML 如下：\n\n```html\n<html>\n<head>\n\t<title>Flashcards</title>\n\
  \t<link type=\"text/css\" rel=\"stylesheet\" href=\"/html/FlashcardsStylesheet.css\"\
  >\n</head>\n<body>\n\t<h1>Flashcards</h1>\n\t<p>\n\t\t<form method=\"GET\" action=\"\
  flashcardSets\">\n\t\t\t<table border=\"1\" id=\"sets\">\n\t\t\t\t<tr>\n\t\t\t\t\
  \t<th colspan=\"2\">Flashcard Sets</th>\n\t\t\t\t</tr>\n\t\t\t\t{{range .}}\n\t\t\
  \t\t<tr>\n\t\t\t\t\t<td>{{.}}</td>\n\t\t\t\t\t\t<td>\n\t\t\t\t\t\t\t<input type=\"\
  radio\" name=\"flashcardSets\" value=\"{{}}\" />\n\t\t\t\t\t\t</td>\n\t\t\t\t\t\
  </tr>\n\t\t\t\t{{end}}\n\t\t\t</table>\n\t\t</form>\n\t</p>\n</body>\n</html>\n\
  ```\n\n其中 `range` 于列表。模板的应用如下：\n\n```go\nfunc listFlashCards(rw http.ResponseWriter,\
  \ req \\*http.Request) {\n\tflashCardsNames := flashcards.ListFlashCards()\n\tt,\
  \ err := template.ParseFiles(\"html/ListFlashcards.html\")\n\tif err != nil {\n\t\
  \thttp.Error(rw, err.Error(), http.StatusInternalServerError)\n\t\treturn\n\t}\n\
