  // 第 14 章 ■ REST 接口 \n\n```\ngo run main.go http://host:port/page\n```\n\n\n\nWeb\
  \ 用户代理（如浏览器）与 Web 服务器（如 Apache）之间交互的标准模型是：用户代理发出 HTTP 请求，服务器对每个请求仅做出一个响应。对于浏览器而言，请求是通过点击链接、在地址栏输入\
  \ URL、点击前进或后退按钮等方式触发的。响应被视为一个新页面并加载到浏览器窗口中。\n\n这种传统模型有许多缺点。首先，每个请求都会打开并关闭一个新的 `TCP`\
  \ 连接。`HTTP 1.1` 通过允许持久连接解决了这个问题，使得连接可以保持开启短段时间，以便在同一台服务器上发送多个请求（例如请求图片）。\n\n虽然 `HTTP\
  \ 1.1` 持久连接缓解了包含许多图画的页面加载缓慢的问题，但它并没有改进交互模型。即使对于表单，该模型仍然是提交表单并将响应作为新页面显示。`JavaScript`\
  \ 有助于可以在提交之前对表单数据进行错误检查，但它并没有改变这种模型。\n\n`AJAX`（异步 JavaScript 和 XML）在用户交互模型上取得了重大进展。它允许浏览器发送请求，并仅使用响应通过\
  \ `HTML 文档对象模型`（`DOM`）在原地更新显示。但再次，交互模型是相同的。`AJAX` 只是影响了浏览器管理返回页面的方式。Go 对 `AJAX`\
  \ 没有显式的额外支持，因为不需要：`HTTP` 服务器只会看到一个普通的 `HTTP POST` 请求，可能带有一些 `XML` 或 `JSON` 数据，可以使用已经讨论的技术来处理。\n\
  \n这些仍然都是浏览器（或用户代理）到服务器的通信。缺失的是服务器到浏览器的通信，即浏览器建立了到服务器的 `TCP` 连接并从服务器读取消息。这可以通过 `WebSockets`\
  \ 来填充：浏览器（或任何用户代理）保持与 `WebSockets` 服务器的长连接 `TCP` 开启。`TCP` 连接允许任何一方发送任意数据包，因此在 `WebSocket`\
  \ 上可以使用任何应用协议。\n\n`WebSocket` 的启动方式是由用户代理发送一个表示“切换到 WebSockets”的特殊 `HTTP` 请求。`HTTP`\
  \ 请求底层 `TCP` 连接保持开启，但用户代理和服务器都切换到使用 `WebSockets` 协议，而不是获取 `HTTP` 响应并关闭套接字。\n\n注意，仍然是由浏览器或用户代理发起的\
  \ `WebSockets` 连接。浏览器并不运行自己的 `TCP` 服务器。虽然 `IETF RFC6455` 规范非常复杂（参见 `https://tools.ietf.org/html/rfc6455`），但该协议设计得相当简单。客户端打开\
  \ `HTTP` 连接，然后用自己的 `WS` 协议替换 `HTTP` 协议，复用相同的 `TCP` 或新连接。\n\nGo 在子仓库中对 `WebSockets`\
  \ 有一些支持，但实际上推荐第三方包。本章将同时考虑这两个包。\n\n© Jan Newmarch 2017\nJ. Newmarch, *Network Programming\
  \ with Go*\n\n第 15 章 ■ WebSoCketS\n\n## WebSockets 服务器\n\n`WebSockets` 服务器起初作为一个\
  \ `HTTP` 服务器，接受 `TCP` 连接并处理 `TCP` 连接上的 `HTTP` 请求。当来一个请求将该连接切换为 `WebSockets` 连接时，协议处理器将从\
  \ `HTTP 处理器` 变为 `WebSocket 处理器`。因此，只有该 `TCP` 连接的角色发生了变化，服务器对于其他请求继续作为 `HTTP` 服务器运行，而该连接底层的\
  \ `TCP` 套接字被用作 `WebSocket`。\n\n在第 8 章讨论的简单服务器中，`HTTP` 注册了各种处理器，例如文件处理器或函数处理器。为了处理\
  \ `WebSockets` 请求，我们只需注册另一种类型的处理器——`WebSockets 处理器`。服务器使用哪种处理器取决于 URL 模式。例如，可以为\
  \ `/` 注册文件处理器，为 `/cgi-bin/...` 注册函数处理器，并为 `/ws` 注册一个 `WebSockets 处理器`。\n\n一个仅预期用于\
  \ `WebSockets` 的 `HTTP` 服务器运行如下：\n\n```go\nfunc main() {\n    http.Handle(\"/\"\
  , websocket.Handler(WSHandler))\n    err := http.ListenAndServe(\":12345\", nil)\n\
  \    checkError(err)\n}\n```\n\n更复杂的服务器可能通过通过添加更多处理器来同时处理 `HTTP` 和 `WebSockets`\
  \ 请求。\n\n### Go 子仓库包\n\nGo 有子仓库包 `golang.org/x/net/websocket`。要使用它，你必须先下载它：\n\n\
  ```bash\ngo get golang.org/x/net/websocket\n```\n\n该包的文档指出以下内容：\n\n*此包目前缺少某些在替代且维护更活跃的\
  \ WebSockets 包中找到的功能：https://godoc.org/github.com/gorilla/websocket* 这表明你可能使用替代包更好。尽管如此，为了符合本书其他部分使用\
  \ Go 团队包的做法，我们在这里考虑了这个包。稍后的章节将介绍替代包。\n\n### 消息对象\n\n`HTTP` 是流式协议。`WebSockets` 是基于帧的。你准备一块数据（任意大小）并将其作为一组帧发送。帧可以包含\
  \ `UTF-8` 编码的字符串或字节序列。\n\n使用 `WebSockets` 最简单的方法是准备一块数据，并让 Go `WebSockets` 库将其封装为一组帧数据，跨越线缆发送，并接收为相同的数据块。`websocket`\
  \ 包包含一个名为 `Message` 的便利对象来实现此操作。`Message` 对象有两个方法——`Send` 和 `Receive`，它们将 `WebSocket`\
  \ 作为第一个参数。第二个参数要么是存储数据的变量地址，要么是待发送的数据。发送字符串数据的代码如下：\n\n```go\nmsgToSend := \"Hello\"\
  \nerr := websocket.Message.Send(ws, msgToSend)\nvar msgToReceive string\nerr :=\
  \ websocket.Message.Receive(conn, &msgToReceive)\n```\n\n发送字节数据的代码如下：\n\n```go\n\
  dataToSend := []byte{0, 1, 2}\nerr := websocket.Message.Send(ws, dataToSend)\nvar\
  \ dataToReceive []byte\nerr := websocket.Message.Receive(conn, &dataToReceive)\n\
  ```\n\n接下来提供一个用于发送和接收字符串数据的回声服务器。注意，在 `WebSockets` 中，任何一方都可以发起消息发送，在这个服务器中，服务器在连接时向客户端发送消息（发送/接收），而不是更的接收/发送服务器。服务器是\
  \ `EchoServer.go`：\n\n```go\n/* EchoServer */\npackage main\n\nimport (\n\t\"fmt\"\
  \n\t\"golang.org/x/net/websocket\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc Echo(ws\
  \ *websocket.Conn) {\n\tfmt.Println(\"Echoing\")\n\tfor n := 0; n < 10; n++ {\n\t\
  \tmsg := \"Hello \" + string(n+48)\n\t\tfmt.Println(\"Sending to client: \" + msg)\n\
  \t\terr := websocket.Message.Send(ws, msg)\n\t\tif err != nil {\n\t\t\tfmt.Println(\"\
  Can't send\")\n\t\t\tbreak\n\t\t}\n\t\tvar reply string\n\t\terr = websocket.Message.Receive(ws,\
  \ &reply)\n\t\tif err != nil {\n\t\t\tfmt.Println(\"Can't receive\")\n\t\t\tbreak\n\
  \t\t}\n\t\tfmt.Println(\"Received back from client: \" + reply)\n\t}\n}\n\nfunc\
  \ main() {\n\thttp.Handle(\"/\", websocket.Handler(Echo))\n\terr := http.ListenAndServe(\"\
  :12345\", nil)\n\tcheckError(err)\n}\n\nfunc checkError(err error) {\n\tif err !=\
  \ nil {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\tos.Exit(1)\n\t}\n}\n\
  ```\n\n运行方式如下：\n\n```bash\ngo run EchoServer.go\n```\n\n与该服务器通信的客户端是 `EchoClient.go`：\n\
  \n```go\n/* EchoClient */\npackage main\n\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"golang.org/x/net/websocket\"\
  \n\t\"os\"\n)\n\nfunc main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"Usage:\
  \ \", os.Args[0], \"ws://host:port\")\n\t\tos.Exit(1)\n\t}\n\tservice := os.Args[1]\n\
  \tconn, err := websocket.Dial(service, \"\", \"http://localhost:12345\")\n\tcheckError(err)\n\
  \tvar msg string\n\tfor {\n\t\terr := websocket.Message.Receive(conn, &msg)\n\t\t\
  if err != nil {\n```\n\n\n\n\n\n```go\nif err == io.EOF {\n    // 服务器平滑关闭\n    break\n\
  }\n\nfmt.Println(\"Couldn't receive msg \" + err.Error())\nbreak\n}\n\nfmt.Println(\"\
  Received from server: \" + msg)\n// 返回消息\nerr = websocket.Message.Send(conn, msg)\n\
  if err != nil {\n    fmt.Println(\"Couldn’t return msg\")\n    break\n}\n}\n\nos.Exit(0)\n\
  }\n\nfunc checkError(err error) {\n    if err != nil {\n        fmt.Println(\"Fatal\
  \ error \", err.Error())\n        os.Exit(1)\n    }\n}\n```\n\n运行方式如下：\n\n`go run\
  \ EchoClient.go ws://localhost:12345`\n\n客户端的输出是服务器发送的内容：\n\nReceived from server:\
  \ Hello 0\nReceived from server: Hello 1\nReceived from server: Hello 2\nReceived\
  \ from server: Hello 3\nReceived from server: Hello 4\nReceived from server: Hello\
  \ 5\nReceived from server: Hello 6\nReceived from server: Hello 7\nReceived from\
  \ server: Hello 8\nReceived from server: Hello 9\n\n## JSON 对象\n\n预计许多 WebSocket\
  \ 客户端和服务器将以 JSON 格式交换数据。对于 Go 程序来说，这意味着 Go 对象将被序列化为[第 4 章](http://dx.doi.org/10.1007/978-1-4842-2692-6_4)中描述的\
  \ JSON 格式，然后作为 UTF-8 字符串发送，而接收方将读取此字符串并将其反序列化回 Go 对象。\n\n名为 `JSON` 的 websocket 便利对象将为你完成这些工作。它具有\
  \ `Send` 和 `Receive` 方法用于发送和接收数据，就像 `Message` 对象一样。\n\n第 15 章 ■ WebSockets\n\n我们考虑客户端使用\
  \ WebSockets 向服务器发送 `Person` 对象的情况（WebSockets 可以双向发送消息）。从客户端读取消息并打印到服务器标准输出的服务器是\
  \ `PersonServerJSON.go`：\n\n```go\n/* PersonServerJSON */\npackage main\n\nimport\
  \ (\n    \"fmt\"\n    \"golang.org/x/net/websocket\"\n    \"net/http\"\n    \"os\"\
  \n)\n\ntype Person struct {\n    Name string\n    Emails []string\n}\n\nfunc ReceivePerson(ws\
  \ *websocket.Conn) {\n    var person Person\n    err := websocket.JSON.Receive(ws,\
  \ &person)\n    if err != nil {\n        fmt.Println(\"Can't receive\")\n    } else\
  \ {\n        fmt.Println(\"Name: \" + person.Name)\n        for _, e := range person.Emails\
  \ {\n            fmt.Println(\"An email: \" + e)\n        }\n    }\n}\n\nfunc main()\
  \ {\n    http.Handle(\"/\", websocket.Handler(ReceivePerson))\n    err := http.ListenAndServe(\"\
  :12345\", nil)\n    checkError(err)\n}\n\nfunc checkError(err error) {\n    if err\
  \ != nil {\n        fmt.Println(\"Fatal error \", err.Error())\n        os.Exit(1)\n\
  \    }\n}\n```\n\n第 15 章 ■ WebSockets\n\n以 JSON 格式发送 `Person` 对象的客户端是 `PersonClientJSON.go`：\n\
  \n```go\n/* PersonClientJSON */\npackage main\n\nimport (\n    \"fmt\"\n    \"golang.org/x/net/websocket\"\
  \n    \"os\"\n)\n\ntype Person struct {\n    Name string\n    Emails []string\n\
  }\n\nfunc main() {\n    if len(os.Args) != 2 {\n        fmt.Println(\"Usage: \"\
  , os.Args[0], \"ws://host:port\")\n        os.Exit(1)\n    }\n    service := os.Args[1]\n\
  \    conn, err := websocket.Dial(service, \"\", \"http://localhost\")\n    checkError(err)\n\
  \    person := Person{\n        Name: \"Jan\",\n        Emails: []string{\"ja@newmarch.name\"\
  , \"jan.newmarch@gmail.com\"},\n    }\n    err = websocket.JSON.Send(conn, person)\n\
  \    if err != nil {\n        fmt.Println(\"Couldn't send msg \" + err.Error())\n\
  \    }\n    os.Exit(0)\n}\n\nfunc checkError(err error) {\n    if err != nil {\n\
  \        fmt.Println(\"Fatal error \", err.Error())\n        os.Exit(1)\n    }\n\
  }\n```\n\n服务器的运行方式如下：\n`go run PersonServerJSON.go`\n\n客户端的运行方式如下：\n`go run PersonClientJSON.go\
  \ ws://localhost:12345`\n\n服务器侧的输出是客户端发送的内容：\n\nName: Jan\nAn email: ja@newmarch.name\n\
  An email: jan.newmarch@gmail.com\n\n## 编码器类型\n\n`Message` 和 `JSON` 对象都是 `Codec`\
  \ 类型的实例。该类型定义如下：\n\n```go\ntype Codec struct {\n    Marshal func(v interface{})\
  \ ([]byte, error)\n    Unmarshal func(data []byte, v interface{}) error\n}\n```\n\
  \n`Codec` 类型实现了之前使用的 `Send` 和 `Receive` 方法。WebSockets 也可能被用于交换 XML 数据。我们可以通过封装之前讨论的\
  \ marshal 和 unmarshal 方法来构建一个 XML `Codec` 对象。我们可以通过这种方式创建一个名为 `xmlcodec` 的包，文件名为\
  \ `Codec.go`：\n\n```go\npackage xmlcodec\n\nimport (\n    \"encoding/xml\"\n   \
  \ \"golang.org/x/net/websocket\"\n)\n\ntype Codec struct {\n    Marshal func(v interface{})\
  \ ([]byte, error)\n    Unmarshal func(data []byte, v interface{}) error\n}\n\nfunc\
  \ NewXMLCodec() Codec {\n    return Codec{\n        Marshal: func(v interface{})\
  \ ([]byte, error) {\n            return xml.Marshal(v)\n        },\n        Unmarshal:\
  \ func(data []byte, v interface{}) error {\n            return xml.Unmarshal(data,\
  \ v)\n        },\n    }\n}\n```\n\n我们随后可以将 `Person` 对象序列化为 XML 文档并从客户端发送到服务器。服务器接收文档并将其打印到标准输出的是\
  \ `src/Codec.go`：\n\n```go\npackage main\n\nimport (\n    \"encoding/xml\"\n   \
  \ \"fmt\"\n    \"golang.org/x/net/websocket\"\n    \"net/http\"\n    \"os\"\n  \
  \  \"xmlcodec\" // 假设这是包的路径\n)\n\ntype Person struct {\n    Name   string   `xml:\"\
  Name\"`\n    Emails []string `xml:\"Emails\"`\n}\n\nfunc ReceivePerson(ws *websocket.Conn)\
  \ {\n    var person Person\n    codec := xmlcodec.NewXMLCodec()\n    data, err :=\
  \ websocket.Message.Read(ws)\n    if err != nil {\n        fmt.Println(\"Can't receive\"\
  )\n        return\n    }\n    err = codec.Unmarshal(data, &person)\n    if err !=\
  \ nil {\n        fmt.Println(\"Can't unmarshal\")\n    } else {\n        fmt.Println(\"\
  Name: \" + person.Name)\n        for _, e := range person.Emails {\n           \
  \ fmt.Println(\"An email: \" + e)\n        }\n    }\n}\n\nfunc main() {\n    http.Handle(\"\
  /\", websocket.Handler(ReceivePerson))\n    err := http.ListenAndServe(\":12345\"\
  , nil)\n    checkError(err)\n}\n\nfunc checkError(err error) {\n    if err != nil\
  \ {\n        fmt.Println(\"Fatal error \", err.Error())\n        os.Exit(1)\n  \
  \  }\n}\n```\n\n客户端发送文档的是 `src/Codec.go`：\n\n```go\npackage main\n\nimport (\n \
  \   \"fmt\"\n    \"golang.org/x/net/websocket\"\n    \"os\"\n    \"xmlcodec\" //\
  \ 假设这是包的路径\n)\n\ntype Person struct {\n    Name   string   `xml:\"Name\"`\n    Emails\
  \ []string `xml:\"Emails\"`\n}\n\nfunc main() {\n    if len(os.Args) != 2 {\n  \
  \      fmt.Println(\"Usage: \", os.Args[0], \"ws://host:port\")\n        os.Exit(1)\n\
  \    }\n    service := os.Args[1]\n    conn, err := websocket.Dial(service, \"\"\
  , \"http://localhost\")\n    checkError(err)\n    person := Person{\n        Name:\
  \   \"Jan\",\n        Emails: []string{\"ja@newmarch.name\", \"jan.newmarch@gmail.com\"\
  },\n    }\n    codec := xmlcodec.NewXMLCodec()\n    data, err := codec.Marshal(person)\n\
  \    if err != nil {\n        fmt.Println(\"Couldn't marshal \" + err.Error())\n\
  \    } else {\n        err = websocket.Message.Write(conn, data)\n        if err\
  \ != nil {\n            fmt.Println(\"Couldn't send msg \" + err.Error())\n    \
  \    }\n    }\n    os.Exit(0)\n}\n\nfunc checkError(err error) {\n    if err !=\
  \ nil {\n        fmt.Println(\"Fatal error \", err.Error())\n        os.Exit(1)\n\
  \    }\n}\n```\n\n服务器的运行方式如下：\n`go run src/Codec.go`\n\n客户端的运行方式如下：\n`go run src/Codec.go\
  \ ws://localhost:12345`\n\n\n\n\n客户端与之前的 echo 客户端相同。唯一改变的是 URL，它使用了 `wss` 方案而不是\
  \ `ws` 方案：\n\n`EchoClient wss://localhost:12345/`\n\n如果服务器提供的 TLS 证书是有效的，它将能够正常工作。我使用的证书不是有效的：它是自签名的，这通常意味着你正在进入一个危险区域。如果你仍然想继续操作，则需要采用我们在第\
  \ [8b](http://dx.doi.org/10.1007/978-1-4842-2692-6_8) 章中做过的那种“移除安全检查”的方法，即开启 `TLS\
  \ InsecureSkipVerify` 标志。这是通过 `EchoClientTLS.go` 程序实现的，它使用该标志设置配置，然后用 `DialConfig`\
  \ 代替 `Dial`：\n\n```go\n/* EchoClientTLS */\n\npackage main\n\nimport (\n\t\"fmt\"\
  \n\t\"crypto/tls\"\n\t\"golang.org/x/net/websocket\"\n\t\"io\"\n\t\"os\"\n)\n\n\
  func main() {\n\tif len(os.Args) != 2 {\n\t\tfmt.Println(\"Usage: \", os.Args[0],\
  \ \"wss://host:port\")\n\t\tos.Exit(1)\n\t}\n\n\tconfig, err := websocket.NewConfig(os.Args[1],\
  \ \"http://localhost\")\n\tcheckError(err)\n\ttlsConfig := &tls.Config{InsecureSkipVerify:\
  \ true}\n\tconfig.TlsConfig = tlsConfig\n\tconn, err := websocket.DialConfig(config)\n\
  \tcheckError(err)\n\n\tvar msg string\n\tfor {\n\t\terr := websocket.Message.Receive(conn,\
  \ &msg)\n\t\tif err != nil {\n\t\t\tif err == io.EOF {\n\t\t\t\t// 服务器优雅关闭\n\t\t\
  \t\tbreak\n\t\t\t}\n\t\t\tfmt.Println(\"Couldn't receive msg \" + err.Error())\n\
  \t\t\tbreak\n\t\t}\n\t\tfmt.Println(\"Received from server: \" + msg)\n\t\t// 返回消息\n\
  \t\terr = websocket.Message.Send(conn, msg)\n\t\tif err != nil {\n\t\t\tfmt.Println(\"\
  Couldn't return msg\")\n\t\t\tbreak\n\t\t}\n\t}\n\tos.Exit(0)\n}\n\nfunc checkError(err\
  \ error) {\n\tif err != nil {\n\t\tfmt.Println(\"Fatal error \", err.Error())\n\t\
  \tos.Exit(1)\n\t}\n}\n```\n\n## HTML 页面中的 WebSockets\n\nWebSockets 的原始设计目标是允许 HTTP\
  \ 用户代理（如浏览器）与服务器之间进行全双工交互。典型的用例预计涉及浏览器中的 JavaScript 程序与服务器交互。在本节中，我们将构建一个 Web/WebSockets\
  \ 服务器，该服务器交付一个 HTML 页面，该页面设置 WebSocket 显示来自服务器的信息。我们正在查看图 15-1 所示的情况。\n\n**图 15-1.**\
