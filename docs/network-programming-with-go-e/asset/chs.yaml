  ![](img/index-190_2.png)\n\n## 第 10 章 ■ 一个完整的 Web 服务器\n\n首页显示闪卡集列表（见图 10-2）。它由当前可用的闪卡集列表、你希望显示一组的方式（随机顺序、先显示中文或英文、或随机）以及显示一组卡片还是仅显示一组中的单词组成。\n\
