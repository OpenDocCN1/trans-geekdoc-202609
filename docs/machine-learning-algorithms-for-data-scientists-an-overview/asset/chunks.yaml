    ### Chapter 5:  Support Vector Machine Algorithm


    ![](media/file0.png)


    Support Vector Machine (SVM) Algorithm aims to find out the hyper plane which
    differentiates the classes in the data set while maximizing the margin between
    the classes.  Support vectors are those sample observation which lies closer to
    the hyper plane. The hyperplane can be linear or non-linear. 


    Kernel functions of the SVM algorithm helps us to transform the non-linear data
    sets into higher dimensional space and then use linear equations to divide the
    space using different Kernel functions such as linear, non-linear, Radial Basis
    Function and Sigmoid.


    We will use cardiology patient’s survival data set for building the SVM model
    (survival.xlsx). The same file can be downloaded from author’s website www.vinaitheerthan.com/book.php
    .


    We can use packages such as e1071 and caret to build SVM models.


    We need to define the required packages such as e1071, and xlsx using library
    statement.


    ![](media/file50.png)![](media/file5.png)


    WE WILL IMPORT THE data in the form of excel using xlsx package as done in the
    previous chapter


    ![](media/file51.png)![](media/file52.png)


    The following are the first few rows of the dataset.


    SVM - Classification problem


    ![](media/file53.png)


    We will be using SVM to classify the data set based on the ‘Diseasestatus’ field.
    It will help us to classify who are likely to be survived based on the features
    (Classification problem).


    ![](media/file5.png)![](media/file54.png)


    WE CAN USE TUNE FUNCTION to tune model with different values for the cost parameter


    ![](media/file55.png)![](media/file5.png)![](media/file56.png)


    FROM ABOVE TUNE SUMMARY we can infer that the cost with value 0.1 gives the best
    model.


    We can use predict function to predict the test data set and calculate the prediction
    accuracy. We will use the first model with cost 15 for the prediction purpose.


    ![](media/file57.png)![](media/file5.png)


    THE FOLLOWING OUTPUT obtained


    ![](media/file58.png)![](media/file5.png)


    HERE THE ACCURACY IS 50.8% and it might be low due to nature of hypothetical data
    set.


    ![](media/file59.png)


    We can plot the receiver operating curve with the help of ROCR package and prediction
    function.


    The following curve is obtained with False Positive Rate and True Positive Rate.


    ![](media/file60.png)


    Advantages of SVM


    SVM is suitable for high dimension data sets


    It works well with different types of data such as text, numbers and images


    Offers unique solution


    Disadvantages of Random Forest Algorithm


    Processing time will be more while handling large data sets


    Final model might difficult to understand


