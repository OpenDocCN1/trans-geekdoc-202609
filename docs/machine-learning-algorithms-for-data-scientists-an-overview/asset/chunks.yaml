- raw: 'Outliers in the data set some times affect the quality of the results. Some
    of the algorithms are capable of handling the outliers even they are present in
    the dataset. There are different statistical tests and visualization tools such
    as box plot are available to find the outliers in the data set.


    Box Plot – It will help us to visualize the outliers present in the data. It includes
    median and 75 th and 25 th quartile values in the box region.


    Z score – When we compute the Z Score or Standard Normal Distribution variable,
    we will be able to find the values which lies within the acceptable range say
    95% or 99%. The values which lie outside this range are considered as outliers. 


    Grubb’s Test – It helps us to detect a single outlier in the data set which uses
    the standard normal distribution. It measures the absolute deviation from the
    sample mean divided by the sample standard deviation.


    Generalized ESD Test – With the calculated upper bound it starts testing from
     single outlier till the given number of outliers says k are tested in the dataset.
    This test uses maximum absolute deviation from the sample observation divided
    by the standard deviation.


    ![](media/file5.png)


    DATA TRANSFORMATION


    Data Transformation is an important aspect of data preprocessing process. Most
    of the Machine Learning algorithms can be improved by data transformation, normalization
    and data scaling techniques.


    There are different types of data normalization and data scaling techniques are
    available.


    Min-Max Normalization – Here the original data values will be replaced with the
    deviation from the minimum value divided by the deviation between the maximum
    and minimum value.


    Z-score normalization – Here the original values will be replaced with z scores
    which is calculated from deviation from the mean value divided by the standard
    deviation. Here the mean and standard deviation of the normal distribution is
    used.


    Logarithmic transformation – Here the natural logarithmic values of the original
    data set is used.


    Data Reduction


    When we have more number of features or variables and each one of them may be
    correlated with other features or variables of the data set which may introduce
    multi co-linearity problem in the analysis stage.


    To avoid this, either we can drop the feature or variable from the data set or
    we can use factor or principle component analysis to reduce the features by creating
    latent features. Latent features are nothing but the linear combination of correlated
    features in the data set.


