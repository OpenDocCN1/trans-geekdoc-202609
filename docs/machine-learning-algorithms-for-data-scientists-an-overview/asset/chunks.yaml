    ### Chapter 6:  Naïve Bayes Algorithm


    ![](media/file0.png)


    Naïve Bayes works on the Bayesian principle and assumes independence among the
    features given the class label in the data set. It includes the following probabilities
    in classifying the data set into class


    Prior probability for the class


    Posterior probability for the class given the features


    Likelihood of predictor or  features given the class


    Prior probability of features or predictors  


    We will use the same cardiology patient’s survival data set which is used for
    building the SVM model. The same file can be downloaded from author’s website
    www.vinaitheerthan.com/book.php .


    We can use packages such as e1071, naivebayes and caret to build Naïve Bayes models
    as we built the SVM model.


    We need to define the required packages such as e1071, and xlsx using library
    statement.


    ![](media/file61.png)![](media/file5.png)


    WE WILL IMPORT THE data in the form of excel using xlsx package as done in the
    previous chapter


