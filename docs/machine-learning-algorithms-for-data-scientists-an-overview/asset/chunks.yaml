    field. It will help us to classify who are likely to be survived based on the
    features (Classification problem).


    ![](media/file64.png)![](media/file5.png)![](media/file65.png)![](media/file66.png)![](media/file67.png)


    THE ABOVE OUTPUT PROVIDES conditional probability for class variable with respect
    to each feature.


    ![](media/file68.png)


    We can use predict function to predict the test data set and calculate the prediction
    accuracy.


    ![](media/file5.png)


    THE FOLLOWING OUTPUT obtained


    ![](media/file69.png)![](media/file5.png)


    HERE THE ACCURACY IS 49.16% and it might be low due to nature of hypothetical
