    ### Chapter 8:  Clustering Algorithm


    ![](media/file0.png)


    Clustering algorithm is one of the unsupervised ML algorithms which do not contain
    separate train and test data set to build model. Clustering algorithm finds natural
    grouping and patterns in the data set.


    There are different types of clustering algorithms are available such as


    Partitioning clustering


    Hierarchical clustering


    Density based clustering


    Model based clustering


    Partitioning clustering – K means clustering


    Partitioning clustering involves partitioning the data sets into predefined number
    of clusters. K means clustering algorithm is an example of partitioning clustering
    algorithm where the data set is partitioned into k clusters and observations are
    assigned to nearest clusters and cluster centroid are calculated for each k clusters.


    The cluster membership is reassigned based on the closeness to new cluster centroids
    and the cluster centroids are again calculated after the new assignment. This
    process will continue till there is no change in cluster centroids.


    Hierarchical Clustering


    Hierarchical Clustering include clustering process which can use top down (Divisive)
    or bottom up (Agglomerative) approach. It provides us a tree like structure called
    dendogram to represent the clusters.


    Divisive clustering algorithm starts to cluster the data set with single cluster
    and divide that top most cluster into different sub clusters till all the observations
    of the dataset are in one single cluster each.'
