    The sentences need to be broken into meaningful components such as words. White
    space or punctuation marks helps us to tokenize the sentences into words.


    ![](media/file5.png)


    ## Stemming

    STEMMING PROCESS HELPS us to retain the root of the given word. It helps remove
    the duplicate words which have same root word in the sentence.


    ## Lemmatizing

    It is similar to stemming but with difference of linking words with similar meaning
    while removing the inflectional ending from the words.


    ## Stop words removal

    Stop words removal plays an important role in the preprocessing as it removes
    the stop words such as ‘a’, ‘the’ ‘and’ which occurs very frequently in a document.


    ## Parts of Speech Tagging (POS)

    Parts of speech tagging helps us to tag the parts of speech in a sentence like
    Noun, Verb and Adjectives. POS plays an important role in NLP and Sentiment analysis
    tasks.


    ## Chunking

    Chunking is done at the token level in sentence by grouping the tokens into similar
    chunks or syntactically correlated tokens.


    ## Analysis of text data

    Analysis text data involves computing document related measures, Statistical,
    Supervised and Unsupervised Machine Learning Algorithms, Natural Language Processing
    techniques and sentiment analysis techniques.


    ### Document related Measures

    At the starting of point of analysis we need to calculate the following measures
    such as Term Frequency (TF), Inverse Document Frequency (IDF) and Term Document
    Matrix (TDM).


    ### Term Document Matrix (TDM)

    Term Document Matrix is the matrix representation of documents in the text corpus.
    Here it contains documents in the column level and terms in the row level and
    the particular cell in the matrix is the term weight. The term weight can be measured
    using binary weight or TF or IDF or TF-DIF combined. Here Binary weights are nothing
    but whether a term is present in that particular document or not and represented
    by 0 and 1.


    ### Term Frequency (TF)

    Term Frequency is the frequency of terms in a specific document (A document can
    be a single sentence or whole document such as research article).


    ### Inverse Document Frequency (IDF)

    Inverse Document Frequency assigns higher weight to uncommon words and lower weights
    to common words such as ‘a’ and ‘the’.


    ### Term Frequency - Inverse Document Frequency (IDF)

    Higher weights are given to terms which are uncommon as well as having significant
    level of frequency.


    ## Statistical Modeling

    Statistical Modeling in text mining involves the use of statistical probability
    concepts and distribution in the analysis stage. The following aspects are considered
    in statistical modeling

    - Sentence is made up of sequence of words.

    - Probability of next word is obtained through condition probability.

    - Probability of whole sentence is calculated from joint probability.


    We will use language models such as Unigram and N-gram models to generate probability
    distribution sequence of words. Here Unigram models generate words independently
    given the condition probability and wherein the N-gram model assumes dependence
    up to n-1 terms in the sequence.


    Markov model helps us to model the probabilities as it assumes the future state
    depends only on the current state and not the past states. Hidden Markov Models
    are extension of Markov Models and it contains states, observations and transition
    probabilities of going from state `i` to state `j`.


    Smoothing techniques will help us to fine tune the probabilities of words in the
    sequence when the probabilities for a given conditional probability is unknown.
    The unknown probabilities will be estimated using techniques like Laplace and
    additive smoothing techniques.


    ## Supervised Machine Learning Algorithms

    Supervised Machine Learning Algorithms helps us to classify or categorize the
    text into a given topic or class. The well- known example of text classification
    is email spam filtering.


    Text classification process can be done with rule based method also which use
    linguistic rules to classify the incoming text. The system uses predefined or
    stored knowledge about the particular domain and uses it for classification. Creating
    the domain and rules are challenging part of this method.


    Compared to Rule based classification system, Supervised Machine Learning system
    does not require the complete domain knowledge about the domain but it learns
    through data and improves its classification or categorization accuracies. The
    previously seen supervised Machine Learning Algorithms such as Support Vector
    Machine and Naïve Bayes can be used to classify the text based datasets also.


    ## Unsupervised Machine Learning Algorithms

    The unsupervised Machine Learning Algorithms helps us to group or find association
    between the documents. The previously seen clustering algorithms such as K-means
    partitioning algorithms or Hierarchical Clustering algorithms can be used to group
    the documents.


    For example we can group scientific articles which are having similar topic or
    discussing similar topic and patients records which are having same disease conditions.


    ## Topic Modeling

    Topic modeling uses techniques such as Latent Dirichilet Allocation (LDA) to assign
    topics to the given set documents. LDA first generates the probability model of
    words under given topic. Then it examines the incoming document and assigns the
    topic based on the generated probability model.


    ![](media/file5.png)


    ## Sentiment analysis

    SENTIMENT ANALYSIS helps us to extract the hidden sentiment in the given text
    data set. Sentiment analysis is useful analyzing the reviews about the products
    or hotel or any service where the user or customer given their reviews. The reviews
    can be classified as positive, neutral or negative given the context of the text
    data set.


    ## Graphical representation of text data

    The extracted text can be visualized using graphical tool Word Cloud. It represents
    cluster of words from the data set in graphical form wherein the most frequently
    occurring word will be represented with higher font denoting its importance in
    the data set.


    ## Text mining examples

    Let us start with the task of classifying and clustering the example data sets
    using supervised and unsupervised ML algorithms. Also we will carry out the sentiment
    analysis based on the example dataset.


    Let us consider a hypothetical product review dataset which contains reviews about
    the product and each review will be termed as a document for our analysis purpose.
    Here we have extracted the reviews and stored it in a single text document. In
    real time application it will be better to use APIs or web scrapping methods.


