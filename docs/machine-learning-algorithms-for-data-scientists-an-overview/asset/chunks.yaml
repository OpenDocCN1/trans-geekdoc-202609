    ### Chapter 2:  R Software


    ![](media/file0.png)


    Ris open source software initially developed for Statistical computing and graphic
    applications. It is similar to S language developed by Bell Laboratories, USA.
    Now it includes machine learning, deep learning and natural language processing
    algorithms. It includes functions, arrays, conditional statements, graphical display
    features.


    R is a flexible software and can be used with other software such Java, Python
    and SAS. It can run platforms like Windows, UNIX and MacOS.  High memory usage
    by R software is one of the disadvantages.


    R software has its own Graphic User Interface but it does not offer much functionality.
    But there are many Integrated Development Environments (IDEs) are available such
    as R Studio, Rattle and Visual Studio.


    R software can be downloaded from


    https://cran.r-project.org/bin/windows/base/ .


    R Studio software can be downloaded from https://rstudio.com/products/rstudio/download/
    .


    R studio contains the following four sections or windows


    Code window – Top left window


    Environment, History and Connections – Top right window  


    Output Console and Terminal -  Bottom left window


    File, Plots, Packages, Help and Viewer – Bottom right window.


    ![](media/file1.png)


    R software has a built in core system. It contains tools which are used for basic
    operations and basic statistical calculations.


    Apart from the core system it has number of packages developed by R community.
    Packages can be used by any user by installing them from the Cran r Repository
    using install.packages statement (or through R studio Tools menu option) and needs
    to be called into the R studio environment using library statement.


    R Objects


    R software contains the following elements such as vectors, factors, data frame
    and matrix.


    Vectors are nothing but list of values which can be numeric or string or date
    values.


    Factors are variables which are having different levels or categories.


    Data frame is made up of rows and columns which can contain both numbers as well
    as strings.


    Matrix is similar to data frame but can contain either numeric or string.


    List is a high level object in R which can contain different objects in it. It
    can contain numbers, strings, vector, matrices and other list also.


    We will start with the examples for each of the R objects above. We need to define
    working directory first using setwd statement. 


    ![](media/file2.png)


    With getwd() statement we can get the current working directory name.


    We can use # symbol to include a comment line in R.


    ![](media/file3.png)


    We can print the output by using print statement or the variable itself.


    ![](media/file4.png)


    The following output is obtained


    ![](media/file5.png)


    READING FROM DIFFERENT data sources


    Data can be brought into R environment through different sources such as raw input,
    text files, Comma Separated Value (CSV) files, Excel file, Statistical Analysis
    System (SAS), Statistical Package for Social Sciences (SPSS) files, Relational
    Databases, XML and JSON files. Except for raw data, text files and CSV files,
    corresponding packages needs to be installed and defined for all the other data
    sources using library statement in the R Studio environment.


    Let us read data from a text file from the working directory using read. delim
    statement


    ![](media/file6.png)![](media/file5.png)


    THE FIRST FEW ROWS of the custtext data set can be viewed with the help of head
    statement.


    Similarly we can read data from CSV file using CSV statement


    ![](media/file7.png)![](media/file5.png)


    THE FIRST FEW ROWS of the custcsv data set can be viewed with the help of head
    statement.


    We need to use xlsx package to read the data from the xlsx file. First we need
    install and define using library statement 


    ![](media/file8.png)


    The first few rows of the custexcel data set can be viewed with the help of head
    statement.


    We need to use sas7bdat package to read data from a SAS file


    ![](media/file9.png)![](media/file10.png)


    We can read data from the SPSS file using foreign package


    ![](media/file5.png)


    WE CAN READ DATA FROM mysql database using RMySQL or RMariaDB package. We need
    to use dbConnect and dbSendQuery statements to connect to the MySQL database and
    perform SQL manipulation queries such as insert and select queries.


    ![](media/file11.png)![](media/file5.png)![](media/file12.png)


    WE CAN READ DATA FROM xml file using XML package and its function xmlParse


    We can read data from JSON file using rjson package and its function fromJSON.


    ![](media/file13.png)


    We can write the R data sets back to excel using writexl package. The file will
    be stored in the working directory


    ![](media/file14.png)![](media/file5.png)


