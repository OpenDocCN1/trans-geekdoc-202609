    ### Chapter 3:  Decision Tree Algorithm


    ![](media/file0.png)


    Decision tree algorithm is one of the supervised machine learning algorithms.
    We can use Decision Tree algorithm for both classification and regression problems.
    We need to have training and test data sets to perform the algorithm.


    Decision tree helps us to take decision on the target attribute or class based
    on the rules. It includes root node, decision node and leaf node. The root node
    is starting point of a decision tree. Decision node consists of test or rule based
    on an attribute. Branches represent the decision.  Nodes represent outcomes of
    the decision. Leaf node or final nodes consists of values of the class or target
    value.


    Selecting the attribute at each decision node is an important process which is
    done through information gain (or misinformation). Information gain helps us to
    measure the reduction in uncertainty in the splitting process.  We need to find
    out which attributes splits the data into class more accurately or near accurate.
    Splitting algorithms consists of measures like ID3 and Gini index (measure of
    impurity).


    If the attribute is categorical then the splitting is done on presence or absence
    of factors or categories will be considered. If the attribute is continuous then
    certain threshold value will be considered for splitting.


    The splitting process will be continued till there is no attribute left for splitting
    or there is no information gain.


    Let us start with the hypothetical customer data set which we can use for our
    decision tree algorithm example (purchasedata.xlsx). The same file can be downloaded
    from author’s website www.vinaitheerthan.com/book.php


    We can use r packages such as caret, rpart, rpart.plot and party packages to build
    decision trees. We need to define the required packages using


    ![](media/file15.png)![](media/file5.png)


    WE WILL IMPORT THE data in the form of excel using xlsx package


    ![](media/file16.png)


    The following are the first few rows of the dataset.


    ![](media/file17.png)


    Decision Tree – Classification problem


    We will be using decision tree algorithm to classify the data set based on the
    ‘satisfied’ field. It will help us to classify who are likely to be satisfied
    based on the features (Classification problem).


    We need to split the data set into train and test data set


    ![](media/file18.png)


    We will use train function of the caret package to build the decision tree. We
    will print the model and its summary


    ![](media/file19.png)![](media/file20.png)


    Here we have rattle package to plot the decision tree.


    ![](media/file21.png)


    Here the accuracy is 49% and it might be low due to nature of hypothetical data
    set.


    ![](media/file22.png)![](media/file23.png)


    We can use predict function to predict the class of test data set.


    ![](media/file24.png)![](media/file25.png)![](media/file5.png)


    DECISION TREE - REGRESSION Problem


    We can also use regression trees to predict the values of the dependent variable
    using predictors or features. We can also use rpart package for the same to predict
    and plot the tree.


    ![](media/file26.png)![](media/file5.png)![](media/file27.png)![](media/file28.png)


    THE SAME IS PLOTTED as decision tree below.


    ![](media/file29.png)


    We can rerun model by creating new test data set by leaving the pamount variable 
    using the dplyr package and select statement.


    ![](media/file30.png)


    Advantages of Decision tree algorithm


    Easy to build


    Decision tree can be build fast


    Decision tree models are easy to interpret


    Can be used for binary and multiple classification problems


    Disadvantages of Decision Tree algorithm


    Affected by over fitting problem


    There is a chance of increasing bias with more levels of categorical variables.


    To increase the accuracy and avoid over fitting Pruning, Bagging and Boosting
    methods are used and the details are given below.


    Pruning


    Pruning cuts the nodes of the decision tree which are not providing valuable information
    and allows us to reduce error due to the over fitting problem.


    Bagging


    Bagging process involves creating Bootstrap samples from the data set and then
    creating tree from each sample. Each tree classifies the sample data set with
    respect to labels (give vote for class label). The class with higher voters is
    considered as final outcome.'
