    ### Chapter 10: Image processing and classification


    ![](media/file0.png)


    Image processing and classification can be done through keras package in R. Deep
    learning models are widely being used in image classification.


    The raw images need to be converted into array format which includes image id,
    height and width of images. After that we need to covert the array into matrices
    by reshaping the width and height. We also need to convert the color or gray scale
    values between 0 and 1.


    We need to train and test data set to train and test the model.


    Keras sequential model which has different layers such as dense and drop out layers
    and activation function helps us to process and classify the images.


    We can use Keras inbuild image data sets such digit mnist and fashion MNIST datasets
    for our image classification models.


    Here the image data set is a list with image and its labels values stored as arrays
    of numbers with respect to image characteristics such height, width and color


    ![](media/file124.png)


    We will now create the train and test image data sets


    ![](media/file125.png)![](media/file126.png)


