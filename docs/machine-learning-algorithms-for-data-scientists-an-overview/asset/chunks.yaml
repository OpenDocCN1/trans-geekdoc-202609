    ### Chapter 7:  Artificial Neural Network Algorithm


    ![](media/file0.png)


    Artificial Neural Network (ANN) works on the principles of Human Nervous system.
    Human Nervous system includes components like Neurons, Synapse and dendrites to
    process and transfer information between neurons. Similar to It, ANN includes
    components such as artificial neurons and weights and transfer functions to process
    the information. Learning process takes place in ANN by adjusting weights in the
    system. 


    ANN is made up of three layers input, hidden and output layers. The input features
    are fed into the system through input layer and weights are added to the input
    features and the same is transformed with the help of activation function and
    passed on to the output layer to produce final outcome.


    ANN forms the basis for the other algorithms such as feed forward network, Reinforcement
    Learning, Convolution network, Long Short Term Memory (LSTM) network.


    In feed forward network, the system adjusts the weights based on the error calculated
    between the actual and expected output. Adjustment of weights is done through
    back propagation method. Feed forward network works in the forward direction from
    input to output layer.


    In reinforcement learning, feedback is provided to system and system needs to
    take action based on the situation through trial and error which maximizes the
    reward. The system will not be instructed what actions need to be taken and it
    needs to use trial and error method to check which action provide better reward.


    We will use the same cardiology patient’s survival data set which is used for
    building the SVM model. The same file can be downloaded from author’s website
    www.vinaitheerthan.com/book.php .


    We can use package nnet, neuralnet to build ANN model.


    We need to define the required packages such as nnet and xlsx using library statement.


