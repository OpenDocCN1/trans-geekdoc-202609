- raw: "Agglomerative clustering algorithm starts to cluster the data set by placing\
    \ each observation into one single cluster and continue to aggregate each clusters\
    \ and the process of aggregation continues till all the individual clusters are\
    \ combined into one single cluster at the end. Here the clusters are combined\
    \ based on the distance between them or clusters which are similar are aggregated\
    \ first. There are different types of linkage methods are available such as\n\n\
    Single Linkage – Distance between two clusters are calculated using the distance\
    \ between their closest points\n\nComplete Linkage – Distance between two clusters\
    \ are calculated using the distance between their furthest points\n\nAverage Linkage\
    \ - Distance between two clusters are calculated using average distance between\
    \ each and every points of two clusters.\n\nThere are different distance measures\
    \ such as Euclidean (squared distance between two points), Manhattan (absolute\
    \ difference between two points) are used to calculate the distance between two\
    \ points or vectors.\n\nDensity based clustering\n\nThe data set is divided into\
    \ clusters with high density and clusters with low density in data space. The\
    \ points lie in the region which separates the low and high density space is generally\
