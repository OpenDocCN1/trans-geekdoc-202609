    ## 文本分类示例 – 监督性机器学习算法


    现在我们将使用下方链接中的公开数据集，该数据集包含产品评论，并将评论分类为 `label1` 和 `lable2`（`label1-positive` 和
    `label2-negative`），用支持向量机 (SVM) 算法对评论进行分类。


    https://github.com/necronet/RML-101/blob/master/svm_textclassification/corpus.csv


    我们将定义构建 SVM 模型所需的包，并读取 Excel 文件的内容。


    ![](img/file107.png)![](img/file5.png)


    我们将为构建 SVM 模型定义训练和测试数据集。


    ![](img/file108.png)![](img/file5.png)


    我们将 `LABEL` 变量定义为因子 (factor)，并在 SVM 模型中使用它。


    ![](img/file5.png)![](img/file109.png)


    模型的摘要如下：


    ![](img/file10.png)![](img/file5.png)


    我们可以通过混淆矩阵检查预测准确率。


    ![](img/file5.png)![](img/file5.png)


    这里的准确率少于 0.53，这可能是由于数据集的原因。我们可以使用 `ROCR` 包绘制 ROC 曲线。


    ![](img/file13.png)


    得到的如下 ROC 曲线所示：


    ![](img/file14.png)


    ## 文本分类 – 非监督性机器学习算法


    我们可以使用无监督性机器学习算法，通过凝聚聚类 (Agglomerative clustering) 技术对评论进行分组或聚类。我们将使用相同的产品评论数据，但会移除标签，仅选取
    50 条评论进行分析。


    ![](img/file15.png)![](img/file5.png)![](img/file16.png)


    我们将像以前一样借助 `tm` 包的 `tm_map` 函数对数据进行预处理。得到如下文档-词项矩阵，其中行表示文档，列表示语料库中的单词。


    ![](img/file17.png)


    我们将使用 `hclust` 函数定义距离度量并构建层次模型，同时绘制聚类图 (dendogram)，该图提供了所考虑评论之间关联关系的图形化表示。它展示了哪些评论是相似的，或者说客户给出的评论。


    ![](img/file18.png)![](img/file5.png)![](img/file19.png)


