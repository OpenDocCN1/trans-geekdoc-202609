    \ single outlier till the given number of outliers says `k` are tested in the\
    \ dataset. This test uses maximum absolute deviation from the sample observation\
    \ divided by the standard deviation.\n\n![](media/file5.png)\n\n# DATA TRANSFORMATION\n\
    Data Transformation is an important aspect of data preprocessing process. Most\
    \ of the Machine Learning algorithms can be improved by data transformation, normalization\
    \ and data scaling techniques. There are different types of data normalization\
    \ and data scaling techniques are available.\n\n### Min-Max Normalization\nHere\
    \ the original data values will be replaced with the deviation from the minimum\
    \ value divided by the deviation between the maximum and minimum value.\n\n###\
    \ Z-score normalization\nHere the original values will be replaced with `z scores`\
    \ which is calculated from deviation from the mean value divided by the standard\
    \ deviation. Here the mean and standard deviation of the normal distribution is\
    \ used.\n\n### Logarithmic transformation\nHere the natural logarithmic values\
    \ of the original data set is used.\n\n# Data Reduction\nWhen we have more number\
    \ of features or variables and each one of them may be correlated with other features\
    \ or variables of the data set which may introduce multi co-linearity problem\
    \ in the analysis stage.\n\nTo avoid this, either we can drop the feature or variable\
    \ from the data set or we can use `factor` or `principle component analysis` to\
    \ reduce the features by creating latent features. Latent features are nothing\
    \ but the linear combination of correlated features in the data set.\n\n# References\n\
    - Famili, A., Shen, W. M., Weber, R., & Simoudis, E. (1997). Data preprocessing\
    \ and intelligent data analysis. Intelligent data analysis, 1(1), 3-23.\n- Kotsiantis,\
    \ S. B., Kanellopoulos, D., & Pintelas, P. E. (2006). Data preprocessing for supervised\
    \ leaning. International Journal of Computer Science, 1(2), 111-117.\n- Friedman,\
    \ J., Hastie, T., & Tibshirani, R. (2001). The elements of statistical learning\
    \ (Vol. 1, No. 10). New York: Springer series in statistics.\n- Walfish, S. (2006).\
    \ A review of statistical outlier methods. Pharmaceutical technology, 30(11),\
    \ 82.\n- Grubbs, F. E. (1969). Procedures for detecting outlying observations\
    \ in samples. Technometrics, 11(1), 1-21.\n- Patro, S., & Sahu, K. K. (2015).\
    \ Normalization.\n\n### Chapter 3: Decision Tree\n![](media/file5.png)\n\nDecision\
    \ tree is one of the supervised learning. We need to split the data into. It includes\
    \ `root node`, `decision node` and `leaf node`. The `root node` is starting point.\
    \ `Branches` represent the decision. `Leaf node` is final outcome.\n\nWe can use\
    \ `caret`, `rpart`, `rpart.plot` and `party` packages to build trees. We need\
    \ to define the following:\n![](media/file5.png)\n\nThe same is....................................\n\
    ![](media/file5.png)[](media/file15.png)\n\n### WE IMPORT THE DATA\nWE IMPORT\
    \ THE data in the form of excel using `xlsx` package.\n![](media/file16.png)\n\
    \nThe following are the first few rows of:\n![](media/file17.png)\n\n### Decision\
    \ Tree – Classification problem\nWe will use decision tree algorithm to classify\
    \ the data set based on `satisfied` field. It will help us classify who are likely\
    \ to be. We need to split the data set into train and test data set\n![](media/file18.png)\n\
    \nWe will use `train` function of `caret` to build the decision tree. We will\
    \ print the model and its summary\n![](media/file19.png)[](media/file20.png)\n\
    \nHere we have `rattle` package to plot the decision tree.\n![](media/file21.png)\n\
    \nHere the accuracy is `49%` and it might be low due to nature of data set.\n\
    ![](media/file22.png)[](media/file23.png)\n\nWe can use `predict` function to\
    \ predict the class of test data set.\n![](media/file24.png)[](media/file25.png)[](media/file5.png)\n\
    \n### DECISION TREE - REGRESSION Problem\nWe can also use regression trees to\
    \ predict values of dependent variable using predictors or features. We can also\
    \ use `rpart` package for the same to predict and plot the tree.\n![](media/file26.png)[](media/file5.png)[](media/file27.png)[](media/file28.png)\n\
    \nThe SAME IS PLOTTED as decision tree below.\n![](media/file29.png)\n\nWe can\
    \ rerun model by creating new test data set by leaving the `pamount` variable\
    \ using the `dplyr` package and `select` statement.\n![](media/file30.png)\n\n\
    #### Advantages of Decision tree algorithm\n- Easy to build\n- Decision tree can\
    \ be build fast\n- Decision tree models are easy to interpret\n- Can be used for\
    \ binary and multiple classification problems\n\n#### Disadvantages of Decision\
    \ Tree algorithm\n- Affected by over fitting problem\n- There is a chance of increasing\
    \ bias with more levels of categorical variables\n\nTo increase the accuracy and\
    \ avoid over fitting `Pruning`, `Bagging` and `Boosting` methods are used and\
    \ the details are given below.\n\n##### Pruning\nPruning cuts the nodes of the\
    \ decision tree which are not providing valuable information and allows us to\
    \ reduce error due to the over fitting problem.\n\n##### Bagging\nBagging process\
    \ involves creating Bootstrap samples from the data set and then creating tree\
    \ from each sample. Each tree classifies the sample data set with respect to labels.\
    \ The class with higher voters is considered as final outcome.\n"
