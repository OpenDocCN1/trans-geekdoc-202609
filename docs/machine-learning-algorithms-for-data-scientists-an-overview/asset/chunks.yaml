    ### Chapter 4:  Random Forest Algorithm


    ![](media/file0.png)


    Random Forest is the extension of decision tree algorithm which is based on bagging
    concept wherein numbers of trees are constructed using bootstrap sample which
    is a random sample with replacement methods.


    Random forest is a bagging technique with random features is selected from the
    random sample which makes the trees independent of each other. Each tree classifies
    the data set with labels and it is termed as a vote for that particular class.
    The class which is having highest vote is considered as final outcome. It reduces
    higher variance among complex model.


    Random Forest algorithm uses Out of Bag (OOB) error estimate to validate the built
    model. Random Forest uses only bootstrap samples from the training data set and
    not all the data or row in the training data set. The Out of Bag error is calculated
    from the bootstrap samples which were left out during the model building process. 


    We can use the same hypothetical customer data set which was used for decision
    tree algorithm example. The same file can be downloaded from author’s website
    www.vinaitheerthan.com/book.php


    We will use RandomForest package to build the model. We need to define the required
    packages such as RandomForest, xlsx, party using library statement.


