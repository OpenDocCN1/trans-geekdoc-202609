    # 提升法 (Boosting)


    从单树开始并识别错误的分类。然后通过调整权重来改进错误的分类，这一过程顺序持续进行，直到错误分类减少到最低。这种方法有助于减少弱模型之间的高偏差。


    ## 参考文献


    - Brijain, M., Patel, R., Kushik, M. R., & Rana, K. (2014). 用于分类的决策树算法综述.

    - Yang, J., Zhang, N. N., LI, J., LIU, Y. M., & LIANG, M. H. (2010). 决策树算法的研究与应用.
    Computer Technology and Development, 2.

    - Singh, S., & Gupta, P. (2014). ID3, cart and C4. 5 决策树算法: a survey. International
    Journal of Advanced Information Science and Technology (IJAIST), 27(27), 97-103.

    - Zhong, Y. (2016, August). 基于决策树的案例分析. In 2016 7th IEEE international conference
    on software engineering and service science (ICSESS) (pp. 142-147). IEEE.

    - Zhang, Y., & Cao, J. (2016). 大数据分析的决策树算法. Computer Science, 43(S1), 374-379.

    - Zhou, H., Zhang, J., Zhou, Y., Guo, X., & Ma, Y. (2021). 基于特征权决策树特征选择算法. Expert
    Systems with Applications, 164, 113842.

    - Hernández, V. A. S., Monroy, R., Medina-Pérez, M. A., Loyola-González, O., &
    Herrera, F. (2021). 决策树诱导的实用教程：候选划分的评估指标与机会. ACM Computing Surveys (CSUR), 54(1),
    1-38.

    - https://cran.r-project.org/package=caret

