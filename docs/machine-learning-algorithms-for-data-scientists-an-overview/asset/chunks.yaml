    # Machine Learning Algorithms for Data Scientists: An Overview


    ## Preface


    Machine Learning models are widely used in different fields such as Artificial
    Intelligence, Business, Clinical and Biological Sciences which includes self-driving
    cars, predictive models, disease prediction, genome sequencing, spam filtering,
    product recommendation, fraud detection and image recognition. It has gained importance
    due to its capabilities of handling large volume of data, prediction and classification
    accuracy and validation procedures.


    Machine Learning models are built on the basis of statistical and mathematical
    algorithms. One important aspect of machine learning is it does not stick to standard
    algorithm throughout modeling process instead it learns from the data over a period
    of time and improves the accuracy of the model. Classification and prediction
    tasks are carried out based on the characteristics, patterns and relationship
    of the features present in the data set. Machine learning model also forms the
    basis of Deep Learning models.


    Machine Learning models involve supervised learning, unsupervised learning, semi
    supervised learning and reinforcement learning algorithms.


    Data Scientists analyze, model and visualize data and provide actionable insights
    to the decision makers. Machine learning algorithms and tools help the data scientist
    to carry out these tasks with the help of software such `R` and `Python`.


    This book provides an overview of Machine Learning models, algorithms and its
    application in different fields through the use of `R` Software. It also provides
    short introduction to `R` software for the benefit of users.


    Author assumes the users have basic descriptive and inferential statistical knowledge
    which is essential for building Machine Learning models.


    Data sets used in the books can be downloaded from the author’s website.


    Vinaitheerthan Renganathan


    **Title**: Machine Learning Algorithms for Data Scientists: An Overview

    **Author**: Vinaitheerthan Renganathan

    **Publisher**: Self Published

    **Edition**: 1 st Edition

    **Copyright**: © 2021 Vinaitheerthan Renganathan


    ## Contents


    - Chapter 1: Introduction

    - Chapter 2: R Software

    - Chapter 3: Data Preprocessing

    - Chapter 3: Decision Tree Algorithm

    - Chapter 4: Random Forest Algorithm

    - Chapter 5: Support Vector Machine Algorithm

    - Chapter 6: Naïve Bayes Algorithm

    - Chapter 7: Artificial Neural Network Algorithm

    - Chapter 8: Clustering Algorithm

    - Chapter 9: Text mining algorithms

    - Chapter 10: Image processing and classification


    ![](media/file0.png)


    ## Chapter 1: Introduction


    ![](media/file0.png)


    Machine learning term became a buzz word in recent times due to its capabilities,
    easy to implement characteristics and high computing power. Machine learning models
    uses data to learn and take decision related to classification, pattern recognition
    and prediction. Machine Models improve the task under consideration through learning
    from the data and evaluating the results based on the performance measures.


    Machine learning models are being applied in different fields to carry out the
    following tasks (not limited to):


    - Speech Recognition

    - Pattern Recognition

    - Computer Vision

    - Robotic Control

    - Disease progression

    - Fraud detection

    - Spam filtering

    - Network intrusion detection

    - Self-driving cars

    - Recommender systems


    There are different types of Machine Learning algorithms are available. Supervised,
    Unsupervised and Reinforcement Learning Algorithms.


    ### Supervised Learning

    Supervised learning algorithms involve training and test data sets. The algorithm
    is trained on the training data set which contains outcome variable which needs
    to be classified or predicted i.e. `Class label` in case of classification problem
    or predicted value in case of regression problem. In some cases test data set.


    ### Unsupervised Learning

    Unsupervised learning works on data without pre-defined labels. It seeks to find
    hidden structures or patterns in the data.


    ### Reinforcement Learning

    Reinforcement learning involves learning through experiences. The agent interacts
    with the environment and receives rewards or penalties to learn optimal policies.


    ### Descriptive, Predictive, and Prescriptive Analytics

    Machine learning systems involve descriptive, predictive and prescriptive. Descriptive
    systems explain what has happened. Predictive systems predict future scenarios.
    Prescriptive systems suggest actions.


    ### Text Mining

    Machine learning algorithms not only analyze numeric data but also text. Text
    based on `NLP` (Natural Language Processing) use `NLP` algorithms.


    The following chapters provide overview of `R` Software.


    ## References


    - `Mohri, M., Rostam, A., & Talwalkar, A. (2018). Foundations of machine learning.`

    - `Mueller, J., & Massaron, L. (2021). Machine learning for dummies.`

    - `Burkov, A. (2019). The hundred-page machine learning.`

    - `Goodfellow, I., Bengio, Y., & Courville, A. (2016). Deep learning basics.`

    - `Zhang, X. D. (2020). A Matrix Approach to Artificial Intelligence.`

    - `Aghbashlo, M., Peng, W., & Soltanian-Zadeh, H. (2021). Progress in Energy and
    Combustion.`

    - `Kushwaha, S., Bahl, S., Bagha, A. (2020). Significant applications of machine
    learning for COVID-19 pandemic.`

    - `Gaurav, D., Tiwari, S. M., Goyal, A., Gandhi, N., & Abraham, A. (2020). Machine
    intelligence-based algorithms for spam filtering on document labeling.`

    - `Janai, J., Güney, F., Behl, A., & Geiger, A. (2020). Computer vision for autonomous
    vehicles: Problems, datasets and state of art.`

    - `Wei, X., Chen, W., & Li, X. (2021). Exploring the financial indicators to improve
    the pattern recognition of economic data based on machine learning.`

    - `Ayanouz, S., Abdelhakim, B. A., & Benhmed, M. (2020). A smart chatbot architecture
    based on NLP and machine learning for health care.`

    - `Jiang, T., Gradus, J. L., & Rosellini, A. J. (2020). Supervised machine learning:
    a brief primer.`

