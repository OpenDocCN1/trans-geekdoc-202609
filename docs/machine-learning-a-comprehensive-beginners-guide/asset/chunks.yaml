    ## 2.3 Modeling phase


    During the modeling phase, we incorporate optimization libraries into our workflow
    in order to improve the overall performance of the models. The oneDNN library
    is used in the optimization of the CNN model, whilst the oneDAL library is used
    in the optimization of the Random Forest model, both of which are performed within
    the context of the oneAPI framework.


    In this section of code as in [Figure 2.6](#ch09.xhtml#f45), in order to separate
