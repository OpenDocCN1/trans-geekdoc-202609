    # 第 14 章 使用 oneAPI 在葡萄酒质量数据集上进行探索性数据分析和分类


    DOI: [10.1201/9781032676685-15](http://doi.org/10.1201/9781032676685-15)


    ## 学习目标


    阅读本章后，读者将能够：


    *   通过开发预测模型，获得通过机器学习技术检查葡萄酒质量并进行分类的知识。

    *   获取有关探索性数据分析的信息。


    ## 14.1 引言


    本研究涉及利用机器学习技术对葡萄酒质量和分类进行详尽检查。我们的方法建立在探索性数据分析（也称为 `EDA`）的基础之上。我们使用 `EDA` 对数据集的复杂性进行详尽调查，这使我们能够发现隐藏的模式。我们研究的主要目标是利用包含多种参数的数据集开发预测葡萄酒质量的模型。为了完成这项任务，第一步是导入数据处理、可视化和机器学习所需的库。这些库包括
    `pandas`、`numpy`、`matplotlib`、`seaborn` 和 `scikit-learn`。加载来自 kaggle [`www.kaggle.com/datasets/yasserh/wine-quality`](https://www.kaggle.com/datasets/yasserh/wine-quality)
    的数据集 `WineQT.csv`。


    ## 14.2 探索性数据分析 (EDA)


    我们进行探索性数据分析（也称为 EDA），以获得对数据集的全面的理解。在这个过程中，我们创建直方图、箱线图和矩阵图等可视化图，以发现模式、关系和潜在的异常值。提供的
    `pandas`、`seaborn` 和 `matplotlib` 对本章至关重要，图 14.1 主要导入了这些库。接下来，使用 `pd.read_csv`
    函数从 Kaggle 导入 `WineQT.csv`，存储在 pandas DataFrame 中。然后使用 `.head()` 函数查看前五行。为了对数值列进行全面检查，我们利用
    `describe()` 函数获取统计量，如均值、标准差、最小值、最大值和计数。现在，使用 `sns.histplot` 函数生成直方图，代表酒精的分布。此外，利用
    `sns.boxplot` 生成箱线图，表示数据中的离散程度、偏度和异常值的存在。

