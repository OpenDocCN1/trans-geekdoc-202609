    ## Learning objectives


    After reading this chapter, the reader shall be able to:


    *   Acquire the knowledge to develop a reliable machine learning model for financial
    purposes to determine the risk of bankrupt.

    *   Gain information regarding data pretreatment, data exploration, model construction
    as well as result analysis.


    ## 10.1 Introduction


    The process of identifying failing companies using machine learning is what we
    will explore in this chapter. The objective `Bankrupt` in our dataset can be obtained
    from Kaggle: [www.kaggle.com/datasets/fedesiano/company-bankruptcy](http://www.kaggle.com/datasets/fedesiano/company-bankruptcy).
    This dataset provides essential financial indicators and ratios for a business,
    whether or not that business is bankrupt. We will include data pretreatment, data
    exploration, model construction, concluding remarks.


    ## 10.2 Importing libraries and dataset


    Initially to prepare the dataset for modeling, we need to perform some data preparation.
    During this stage, you will be responsible for resolving any data issues. Let
    us get started by loading the dataset and analyzing its structure.


    We begin by importing the necessary library files as witnessed in [Figure 10.1](#ch16.xhtml#f129).
    We use `pandas` to read the `Bankruptcy_Detection` dataset from the csv file,
    and then we save it in a DataFrame that we’ve given the name `data`. Refer to
    [Figure 10.2](#ch16.xhtml#f130) for the code snippet.


    ```python

    import pandas as pd

    import numpy as np

    from sklearn.model_selection import train_test_split

    from sklearn.preprocessing import StandardScaler

    from sklearn.ensemble import RandomForestClassifier

    from sklearn.metrics import accuracy_score, classification_report

    from imblearn.over_sampling import SMOTE

    from imblearn.under_sampling import RandomUnderSampler


    data = pd.read_csv(''Bankruptcy_Detection.csv'')

    X_train, X_test, y_train, y_test = train_test_split(data.drop(''Bankrupt'', axis=1),
    data[''Bankrupt''], test_size=0.2, random_state=42)


    scaler = StandardScaler()

    X_train = scaler.fit_transform(X_train)

    X_test = scaler.transform(X_test)


    model = RandomForestClassifier(n_estimators=100)

    model.fit(X_train, y_train)


    y_pred = model.predict(X_test)

    print(accuracy_score(y_test, y_pred))

    print(classification_report(y_test, y_pred))

    ```


