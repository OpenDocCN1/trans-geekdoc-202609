    # Chapter 5Flower recognition with Kaggle dataset and Gradio interface


    DOI: [10.1201/9781032676685-6](http://doi.org/10.1201/9781032676685-6)


    ## Learning objectives


    By the end of this chapter, the reader shall be able to:


    *   Acquire the knowledge to construct a machine learning model that can divide
    photographs into several distinct groups.


    *   Obtain predictions based on their own models.


    *   Integrate Gradio, a user-friendly interface library.


    ## 5.1 Introduction


    We will use a dataset collected from Kaggle to explore the fascinating realm of
    flower recognition in this chapter. Flower recognition is a field that has been
    studied for centuries. Readers will get the knowledge necessary to construct a
    machine learning model that is able to divide photographs of flowers into five
    distinct groups by following the instructions provided. The procedure of immediately
    obtaining datasets from Kaggle, without the need for manual downloads, will be
    covered in this chapter, setting it apart from the others in the book and making
    it the focal point of what makes this chapter unique. In addition, we are going
    to investigate the possibility of integrating Gradio, which is a user-friendly
    interface library. Gradio gives users the ability to engage using the model and
    obtain predictions based on their own photographs of flowers. Readers will have
    received practical insights into image categorization, dataset collecting, and
    interacting with users with machine learning models by the time they reach the
    end of this chapter.


