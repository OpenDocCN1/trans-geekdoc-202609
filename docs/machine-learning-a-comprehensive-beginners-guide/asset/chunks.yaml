    ## 4.4 Building hybrid ML models


    In this chapter, we will construct distinct ML models by utilizing the methods
    known as Random Forest, Support Vector Machine (SVM), and k-Nearest Neighbors
    (k-NN). The aforementioned models will act as the foundation for our hybrid model,
    which will be based on them.


    ### 4.4.1 Random Forest + SVM model


    We start by making a new object called VotingClassifier, which is a hybrid of
    the Random Forest and SVM classifiers. A list of tuples, each of which consisting
    of a string identifier and an object classifier, is what we send along as our
    input. The terms “rf” and “svm” will serve as the identifiers in this scenario.
    By utilizing the fit() method, we train the VotingClassifier using the provided
    data. Both the Random Forest and SVM classifiers are trained because of this.
    We use the predict() method to generate predictions on the testing data in order
    to evaluate the effectiveness of the hybrid model. We determine an accuracy score
    by contrasting the labels that are anticipated with the labels that appear. See
    [Figure 4.9](#ch11.xhtml#f72) for the code snippet.


