    利用 `drop()` 函数可以从 DataFrame 中移除指定的列，在接下来的行代码中可以看到其操作过程。将其作为初始值提供会导致“Id”列从结果中删除。当使用
    `axis=1` 参数时，它表示该操作应按列的方式执行。最后，提供了 `inplace=True` 参数以确保这些修改将反映在原始 DataFrame 中（参见图
    1.5）。


    ![图 1.5 删除列。](img/9781032676654_C001_005.jpg)


    图 1.5 删除列。


    当执行如图 1.5 所示的这段代码时，“Id”字段将从 Iris 数据集中被正确地移除。这将确保我们的建模和分析任务不包含任何多余信息。


    使用此代码从 scikit-learn 导入核心的机器学习组件。


    如图 1.6 所示，在此段代码块中通过 import 引入了以下包和类。


    ![图 1.6 导入 ML 组件的代码片段。](img/9781032676654_C001_006.jpg)


    图 1.6 导入 ML 组件的代码片段。


    *   `LogisticRegression` 源自 `sklearn.linear_model`，是一种非常流行的分类方法。该类型提供了逻辑回归相关功能。

    *   `train_test_split` 是一个源自 `sklearn.model_selection` 的函数。通过该函数的帮助，我们能够将数据集分为训练集和测试集。

    *   `KNeighborsClassifier` 位于 `sklearn.neighbors` 包中。它被 k-最近邻分类技术所使用。

    *   来自 `sklearn` 的 `svm` 模块提供了用于支持向量机的分类和回归技术。

    *   `metrics` 源自 `sklearn` 库。该模块包含了多种用于评估 ML 模型有效性的指标。

    *   `DecisionTreeClassifier` 是一种基于决策树的流行分类方法。它来自 `sklearn.tree` 库。


    导入这些模块和类将为你提供在 Iris 数据集上创建和评估各种 ML 算法的核心工具。我们将这些算法应用于该数据集上。


    你可以使用以下代码（图 1.7）通过使用 scikit-learn 提供的 `train_test_split` 函数将 Iris 数据集划分为训练集和测试集，然后报告生成集合的形状。


    ![图 1.7 划分数据集的代码片段。](img/9781032676654_C001_007.jpg)


    图 1.7 划分数据集的代码片段。


    需要将 iris DataFrame 划分为训练集和测试集。`test_size` 参数设置为 0.3 表示 30% 的数据被分配给测试集，而 70% 的数据用于训练集。


    数据拆分后，利用 `train` DataFrame 的 `shape` 属性打印用于训练的集合的形状，然后利用 `test` DataFrame 的 `shape`
    属性打印测试集。随后将整个数据集的形状。这让你能够检查所生成集合的长度。


    当执行如图 1.7 所示的代码时，Iris 数据集将被划分为训练集和测试集，并显示相应的集合形状。


    训练集的训练特征（`train_x`）以及训练标签（`train_y`）在此代码块中被提取（参见图 1.8）。另一方面，测试特征（`test_x`）和测试标签（`test_y`）从测试集中取出并在此处提取。这些特征是分别根据标记为“SepalLengthCm”、“SepalWidthCm”、“PetalLengthCm”和“PetalWidthCm”的列进行选择。


    ![图 1.8 提取特征的代码片段。](img/9781032676654_C001_008.jpg)


    图 1.8 提取特征的代码片段。


    这里使用 `svm.SVC()` 函数构建了一个支持向量机 (SVM) 分类版本。之后，调用 `fit()` 方法，并利用训练数据（`train_x` 和
    `train_y`）训练模型。然后使用 `predict()` 方法根据训练模型对应该分配给测试特征（`test_x`）的标签进行预测。SVM 模型的正确性通过
    `metrics` 模块中包含的 `accuracy_score()` 函数来确定，通过比较预测标签与实际标签（`test_y`）。确定的准确率得分打印在下方（参见图
    1.9）。


    ![图 1.9SVM 分类的代码片段。](img/9781032676654_C001_009.jpg)


    图 1.9SVM 分类的代码片段。


    同样地，通过调用 `LogisticRegression()` 函数生成了一个逻辑回归 (LR) 分类版本。然后与之前分类相同的方式对模型进行训练和评估。此外，还会打印
    LR 策略的准确率（参见图 1.10）。


    ![图 1.10LR 分类的代码片段。](img/9781032676654_C001_010.jpg)


    图 1.10LR 分类的代码片段。


    遵循如图 1.11 所示的代码片段，生成了一个名为 `DecisionTreeClassifier()` 的决策树版本。然后以与其他模型相同的方式对模型进行训练和评估。此外，还显示了决策树概念的可靠性。


    ![图 1.11 决策树分类的代码片段。](img/9781032676654_C001_011.jpg)


    图 1.11 (此处省略)


    最后，程序生成了一个柱状图来对比每个模型的准确率。准确率列表存储了与 `model_name` 列表中存储的模型相对应的得分。模型名称存储在 `accuracy`
    列表中（参见图 1.12）。柱状图由 `barplot()` 函数产生，该函数可以在 seaborn 库中找到。生成的映射提供了模型之间准确率的可视化表示。


    ![图 1.12 创建准确率的代码片段。](img/9781032676654_C001_012.jpg)


    图 1.12 (此处省略)


    当执行如图 1.13 所示的代码时，将显示 SVM、逻辑回归和决策树模型的准确率值，以及比较这三个模型准确率的柱状图。


    ![图 1.13 创建准确率并对比的代码片段。](img/9781032676654_C001_013.jpg)


    图 1.13 (此处省略)


    ## 1.5 推论


    在对所选三个模型的准确率进行分析后，我们可以推断出 SVM 模型获得了最高的准确率，逻辑回归紧随其后。与另外两个模型相比，决策树模型的准确率稍低，但总体而言仍然相当准确。通过对比和评估各种模型的准确率，我们能够根据可用属性做出明判断，判断哪种方法最适合分类
    Iris 花卉品种。


