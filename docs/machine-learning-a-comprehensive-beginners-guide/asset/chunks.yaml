    ## 15.3 Custom sequential model


    The code as given in [Figure 15.5](#ch22.xhtml#f200) shows an image classification
    neural network model constructed using the Sequential model from the keras API.
    The model is composed of convolutional layers that function as feature extractors
    by applying filters to input images and capturing patterns. Following the convolutions
    are Max-pooling layers, which reduce spatial dimensions while preserving essential
    features. The flattened layer converts the multidimensional output into a one-dimensional
    array, making it suitable for the fully connected layers. Dropout is a regularization
    technique that deactivates neurons at random during training to prevent overfitting.
    The final layers consist of densely interconnected (completely interconnected)
    layers that learn complex patterns and make predictions. Sigmoid activation in
    the output layer compresses the network’s output between 0 and 1, making it suitable
    for binary classification tasks and indicating the likelihood of an input belonging
    to a particular class. This architecture, which is commonly employed in image
    classification tasks, creates a neural network capable of learning intricate patterns
    from the image data provided.


    ![Figure 15.5Building the model.](html/images/9781032676654_C015_005.jpg)


    [Figure 15.5](#ch22.xhtml#f200b)Building the model.


    We compile the neural network training model. The optimizer, loss function, and
    metrics are defined as seen from [Figure 15.6](#ch22.xhtml#f201).


    ![Figure 15.6Compiling the model.](html/images/9781032676654_C015_006.jpg)


    [Figure 15.6](#ch22.xhtml#f201b)Compiling the model.


    ![Figure 15.7Training the model.](html/images/9781032676654_C015_007.jpg)


    [Figure 15.7](#ch22.xhtml#f202b)Training the model.


    To prevent overfitting during training we implement early stopping with monitor,
    patience and restore\_best\_weights as parameters. Then using the fit method,
    we train the sequential model (refer to [Figure 15.7](#ch22.xhtml#f202)).


    ## 15.4 VGG16-based model


    In this code, a pre-trained VGG16 model without its top classification layers
    is imported, specifically configured for 32x32 images with three color channels.
    This model that has been pre-trained is stored in the variable vgg\_base. Using
    the Sequential API, a new neural network model is then constructed. The VGG16
    model is incorporated as the foundation of the new model. After the output of
    VGG16 has been flattened, two custom dense layers with 256 and 128 units, respectively,
    and ReLU activation functions are added. For binary classification, a dense layer
    with a single unit and sigmoid activation function is appended. This method leverages
    the VGG16-learned features while customizing the classification layers for a specific
    assignment, enabling efficient and effective transfer learning. Refer to [Figure
    15.8](#ch22.xhtml#f203) for the code snippet.


    ![Figure 15.8Constructing the new model.](html/images/9781032676654_C015_008.jpg)


    [Figure 15.8](#ch22.xhtml#f203b)Constructing the new model.


    The provided code as in [Figure 15.9](#ch22.xhtml#f204) entails the compilation
    of the model using the Adam optimizer, employing a low learning rate, binary crossentropy
    loss function, and evaluating the model’s performance based on accuracy. The technique
    of early stopping is employed to observe the validation loss during the training
    process. If the validation loss does not exhibit any improvement for a consecutive
    period of five epochs, the training is halted. This approach guarantees the preservation
    of optimal weights. These setups are designed to optimize the training process,
    hence improving the accuracy of the model and mitigating the risk of overfitting.


    ![Figure 15.9Compiling the new model with Adam optimizer.](html/images/9781032676654_C015_009.jpg)


    [Figure 15.9](#ch22.xhtml#f204b)Compiling the new model with Adam optimizer.


    Then using the fit method, we train the vgg16 model with several parameters as
    shown in [Figure 15.10](#ch22.xhtml#f205).


    ![Figure 15.10Training the vgg16 model.](html/images/9781032676654_C015_010.jpg)


    [Figure 15.10](#ch22.xhtml#f205b)Training the vgg16 model.


    ## 15.5 Accuracy comparison


    We create two lists models and accuracies to store final end accuracies of all
    the models used (see [Figure 15.11](#ch22.xhtml#f206)). The accuracies stored
    in the list show the models’ capacity to accurately identify the training data,
    denoted as percentages.


    ![Figure 15.11For plotting Accuracy comparison.](html/images/9781032676654_C015_011.jpg)


    [Figure 15.11](#ch22.xhtml#f206b)For plotting Accuracy comparison.


    We use matplotlib to generate a bar graph to compare the levels of accuracy achieved
    during training by the Sequential model with the VGG16 model as illustrated in
