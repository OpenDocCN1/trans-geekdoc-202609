    ## 16.4 Outlier removal using Z-score


    Outliers can be defined as data points that exhibit substantial deviation from
    the prevailing pattern observed within the sample. Instances of these phenomena
    may manifest as a result of a multitude of circumstances, including inaccuracies
    in data collecting, variations in measurement precision, or the occurrence of
    genuinely infrequent events. Although outliers can occasionally signify intriguing
    events, they can also inject extraneous data into our analysis, resulting in deceptive
    interpretations and forecasts. The Z-score, alternatively referred to as the standard
    score, holds significant importance as a fundamental statistical measure within
    the field of data analysis. The measure quantifies the number of standard deviations
    by which a given data point deviates from the mean of the dataset. By doing Z-score
    calculations on each data point, it is possible to detect values that deviate
    significantly from the mean and are likely to be considered outliers.


    In columns “hsc\_p,” “degree\_p,” and “salary” we calculate the Z-scores and compare
    it with a defined threshold which is three in our case to identify and remove
    the outliers. Refer to [Figure 16.7](#ch23.xhtml#f214) for the code snippet.


    ![Figure 16.7To detect and remove outliers.](html/images/9781032676654_C016_007.jpg)


    [Figure 16.7](#ch23.xhtml#f214b)To detect and remove outliers.


    ## 16.4 Modeling


    Three distinct machine learning classifiers are instantiated, appended to a list
    along with their respective names, and a dictionary is established to record accuracy
    scores as provided in [Figure 16.8](#ch23.xhtml#f215).


    ![Figure 16.8Classifiers instantiation.](html/images/9781032676654_C016_008.jpg)


    [Figure 16.8](#ch23.xhtml#f215b)Classifiers instantiation.


    We train three different classifiers with our training data. We create a loop
    to iterate through the list containing the tuple of classifier objects which we
    created during the previous step. Then we fit the training data separated to the
    created models and calculate the accuracy using the test labels after we train
    the model. At last we print the accuracy of all the three models and the codes
    used is given in [Figure 16.9](#ch23.xhtml#f216).


    ![Figure 16.9Model training and evaluation.](html/images/9781032676654_C016_009.jpg)


    [Figure 16.9](#ch23.xhtml#f216b)Model training and evaluation.


    ## 16.5 Model comparison and visualization


    A bar graph is created as seen in [Figure 16.10](#ch23.xhtml#f217) to compare
    the accuracy scores of the three different machine learning models.


    ![Figure 16.10Model accuracy comparison.](html/images/9781032676654_C016_010.jpg)


    [Figure 16.10](#ch23.xhtml#f217b)Model accuracy comparison.


    ## 16.6 Conclusion


    In the context of campus recruitment, the foundation for effective placements
    is reliant on precise prognostications. The present comparative investigation
    sheds light on the trajectory forward, elucidating the merits and limitations
    of diverse machine learning algorithms. The Random Forest model emerges as the
    leading candidate, exhibiting a notable accuracy rate of 86.05%. This chapter
    offers insights into the realm of predictive modeling and empowers decision-makers
    with the necessary information to make informed decisions based on data in the
    recruitment process.


    ## 16.7 Further learning


    As we conclude this chapter, it is imperative to recognize the extensive range
    of opportunities that awaits in the future. Potential areas for future investigation
    include the exploration of ensemble techniques, the application of feature engineering,
    and the examination of deep learning methodologies to further improve the accuracy
    of predictions. Moreover, a longitudinal analysis has the potential to provide
    useful insights into the evolving patterns of placement over a period of time,
    so enabling institutions to adjust their policies accordingly.


