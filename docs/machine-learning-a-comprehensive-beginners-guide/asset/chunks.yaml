    ## 5.7 Conclusion


    Using a dataset from Kaggle, we can reach the fascinating conclusion that flower
    recognition is a worthwhile endeavor to investigate. We are able to train a convolutional
    neural network (CNN) model by utilizing the power of deep learning and TensorFlow.
    This model is capable of classifying flower photos into the following five distinct
    categories: daisy, dandelion, rose, sunflower, and tulip. We also familiarize
    the readers with Gradio, a library that is friendly to users and designed for
    the creation of interactive interfaces. Gradio gives users the ability to identify
    photographs of flowers by using a model that has been developed.


    The readers have learnt how to construct and train a CNN model for flower recognition,
    as well as how to create a Gradio interface for real-time predictions, by following
    the step-by-step instructions and downloading a dataset directly from Kaggle using
    the opendatasets package. The readers also learned how to preprocess the data
    using the ImageDataGenerator class. This chapter gave a complete overview of the
    end-to-end process of constructing a flower recognition system. As a result, readers
    are sure to obtain hands-on experience with deep learning and model deployment.
    Moreover, the chapter has also discussed the benefits of using such a system.


    ## 5.8 Further learning


    Flower recognition has many possible improvements. By adapting pre-trained models
    to flower recognition, adjusting and transferable learning can be studied. This
    method may increase model accuracy and generalization. Second, grid-based and
    random searches can be used to optimize learning percentage, batch quantity, and
    network architecture. Model performance can also increase. Third, the methods
    of scaling, rotation, and random cropping can be employed to diversify and strengthen
    the training dataset. Fourth, adding more flower species to the dataset can improve
    the model’s recognition abilities. Finally, putting the model to a web-based app
    can allows users to contribute flower photos and receive predictions in real time.
    Improved model accuracy, dataset diversity, and user involvement and accessibility
    will improve flower recognition.


    ## Suggested readings


    *   Bharati, P. and Pramanik, A., 2020. Deep learning techniques—R-CNN to mask
    R-CNN: A survey. In Computational Intelligence in Pattern Recognition: Proceedings
    of CIPR 2019 (pp.657–668). Springer Singapore.


