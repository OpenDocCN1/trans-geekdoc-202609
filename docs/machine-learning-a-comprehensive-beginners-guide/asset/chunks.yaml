    We generate a visual display from our test images of brain tumor classes randomly
    as shown in [Figure 13.5](#ch20.xhtml#f174).


    ![Figure 13.5Visual display of test images.](html/images/9781032676654_C013_005.jpg)


    [Figure 13.5](#ch20.xhtml#f174b)Visual display of test images.


    In this step, we set two of the hyperparameters, batch size and epochs, for training
    our models. The same can be seen in [Figure 13.6](#ch20.xhtml#f175). The batch
    size defines the number of samples that will be used during the forward and backward
    passes in the training phase. The epochs define the number of times the training
    takes place to update the model’s weights. We have to note that training the model
    with a large number of epochs will lead to over training. Likewise, training a
    few will lead to underfitting.


    ![Figure 13.6Setting hyperparameters.](html/images/9781032676654_C013_006.jpg)


    [Figure 13.6](#ch20.xhtml#f175b)Setting hyperparameters.


    We use the ImageDataGenerator class to clean and add to the data, and we make
