    first model `ResNet50` and compiled it with `Adam` optimizer and categorical cross
    entropy loss function. We train the model for `10` epochs using both the training
    and validation generators. Refer to [Figure 19.8](#ch26.xhtml#f257) for the code
    snippet.


    ![Figure 19.8To Build ResNet model.](html/images/9781032676654_C019_008.jpg)


    [Figure 19.8](#ch26.xhtml#f257b)To Build ResNet model.


    Similarly, we build the `Vgg16` model with all input parameters as seen in [Figure
