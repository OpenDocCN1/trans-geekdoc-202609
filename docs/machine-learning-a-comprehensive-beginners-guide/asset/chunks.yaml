    The models’ testing accuracies are evaluated using the `evaluate()` method on
    the validation data generator, which is shown in [Figure 19.11](#ch26.xhtml#f260).


    ![Figure 19.11To calculate accuracies.](html/images/9781032676654_C019_011.jpg)


    [Figure 19.11](#ch26.xhtml#f260b)To calculate accuracies.


    ## 19.5 Model evaluation and visualization


    The testing accuracies of `ResNet` (Mirza et al., 2023) and `VGG16` (Bakasa and
    Viriri, 2023) models are plotted using a bar graph as shown in [Figure 19.12](#ch26.xhtml#f261)
    for visual comparison. We create a list to store both our model names. Then the
    accuracies list is created where we store the testing accuracies of both our models.
    It is seen that the `ResNet` model exhibits superior performance with `81.10%`
    of validation accuracy in comparison to the `Vgg16` which has `75.30%` of validation
    accuracy. This finding suggests that `ResNet` exhibits superior generalization
    performance on the validation dataset, implying its efficacy in collecting fundamental
    information for the task of flower categorization. Finally, the barplot is plotted.


    ![Figure 19.12For model evaluation and visualization.](html/images/9781032676654_C019_012.jpg)


    [Figure 19.12](#ch26.xhtml#f261b)For model evaluation and visualization.


    ## 19.6 Conclusion


    Within the domain of floral classification, our models have achieved resounding
    success. `ResNet` and `VGG16`, employing deep learning methodologies, have successfully
    discerned intricate details of floral specimens, resulting in notable levels of
    precision. This chapter serves as evidence of the integration of sophisticated
    algorithms and the aesthetic qualities inherent in the natural world. The capacity
    of the models to differentiate between `Lilly` and `Lotus`, `Orchid` and `Sunflower`,
    and `Tulip` and their respective counterparts exemplifies the convergence of technology
    and floral artistry.


    ## 19.7 Further learning


    As we contemplate the future, multitudes of potentialities emerge. Engaging in
    the process of refining our models, investigating sophisticated architectures
    such as `DenseNet` and `Inception`, and delving into the realm of explainable
    AI present captivating opportunities. Moreover, the utilization of these models
    in practical contexts, such as the automation of flower identification in the
    field of horticulture, exhibits significant potential. The expedition does not
    conclude at this point; rather, it undergoes a metamorphosis, enticing us into
    unexplored frontiers inside the continuously developing realm of deep learning.


    ## Suggested readings


    *   Bakasa, W. and Viriri, S., 2023. Vgg16 feature extractor with extreme gradient
    boost classifier for pancreas cancer prediction. Journal of Imaging, 9.

