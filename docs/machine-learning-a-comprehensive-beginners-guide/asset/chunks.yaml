    StandardScaler, as seen from [Figure 9.6](#ch16.xhtml#f125), is an application
    that is utilized in order to resize the distribution of values in such a way that
    the mean of the observed values is equal to 0 and the standard deviation is equal
    to 1. StandardScaler is an important approach that is mostly used as a preprocessing
