    ## 8.3 数据预处理


    ### 8.3.1 离群值检测与分析


    离群值是显著偏离数据集整体模式或分布的数据点。它们是与其他观测值异常遥远的观测结果，会对分析和建模过程产生重大影响。离群值的出现可能由于多种原因，例如测量误差、数据录入错误、实验异常或真实的极值情况。识别和处理离群值是数据预处理中至关的一步，因为它们可能会扭曲统计分析，影响机器学习模型的准确性，并导致误导性的见解。


    数据集包含的行数和列数由数据的“shape”（形状）表示，可以通过名为 `data.shape` 的代码段来获取，如图 8.3 所示。它提供了有关数据集参数的信息。使用代码
    `X = data.drop(["name," "status"], axis=1)` 作为分隔符从数据集中提取特征。这是通过从第一个数据集中删除“name”和“status”列来实现的，从而创建一个新的
    DataFrame `X`。如果你将 `axis` 选项设置为 1，则意味着应该删除列。


    ![图 8.3 数据形状的代码片段。](img/9781032676654_C008_003.jpg)


    图 8.3 数据形状的代码片段。


    当执行代码行 `y = data["status"]` 时，目标变量“status”的值被传输到变量 `y` 中。它使用从原始数据集“status”列获取的值生成一个新的
    Series `y`，并用这些值填充它。特征中包含的行数和列数可以通过代码 `X.shape` 确定，该代码返回 DataFrame `X` 中包含的特征的形状。它提供了关于特征集可以利用程度的详细信息。


    为了为了地说明离群值检测的结果，我们借助 `matplotlib.pyplot` 和 `seaborn` 生成了散点图。“MDVP:Fo(Hz)”特征沿 y
    轴绘制，而样本索引沿 x 轴绘制。使用 `hue` 参数对离群值进行颜色编码，使得离群值用一种与内值表示不同的颜色表示。请参考图 8.4。这使我们能够根据它们在散点图中的位置，视觉上识别出被认为是离群值的情况。（注意，虽然我们随机选择了列
    `MDVP:Fo(Hz)`，但这并不意味着它是包含离群值的唯一列。）


    ![图 8.4 离群值检测。](img/9781032676654_C008_004.jpg)


    图 8.4 离群值检测。


    我们利用一种名为 `IsolationForest` 的无监督学习方法（如图 8.5 所示）来寻找数据集中的离群值。该算法通过分离数据集实例并寻找不符合常的模式来发现异常。我们启动一个
    `contamination` 参数为 `0.05` 的 `IsolationForest` 新实例，这表示我们预计大约有 5% 的数据是异常的。之后，为了理解情况，我们对数据进行拟合。通过
    `fit()` 方法对 `X` 进行拟合，这使我们能够预测哪些是离群值。通过 ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` 方法，我们生成了不包含离群值的特征矩阵
    `X`。


    ![图 8.5 离群值检测。](img/9781032676654_C008_005.jpg)


    图 8.5 离群值检测。（注：此处原文逻辑似乎重复，已按原文翻译）


    ### 8.3.2 训练集-测试集划分


    当执行代码行 `y = data["status"]` 时，目标变量“status”的值被传输到变量 `y`。它使用从原始数据集“status”列的值生成一个新的
    Series `y`，并用这些值填充它。特征中包含的行数和列数可以通过代码 `X.shape` 确定，该代码返回 DataFrame `X` 中包含的特征的形状。它提供了关于特征集可以利用程度的详细信息。


    ### 8.3.3 特征缩放


    使用 `sklearn.preprocessing` 库中的 `StandardScaler` 实例化为 `scaler`，以便可以使用它。缩放训练特征（`X_train`）和测试特征（`X_test`）需要进行操作，这确保了它们处于相同的尺度上，防止任何一个特征控制学习算法。


    ### 8.3.4 多项式工程


    我们将使用项式工程来更好地理解特征之间的复杂关系。通过这种方法生成了初始特征的项式组合，从而创建了额外的项。我们将能够更准确地描述非线性关系，如果使用高阶项，可能会提高模型的性能。


    ### 8.4 模型训练与评估


    我们将训练三个不同的机器学习模型并比较性能。训练数据用于拟合每个模型，测试数据用于评估模型。为了评估每个模型预测帕金森病（Parkinson’s disease）的效能，我们将计算准确率。该代码片段在图
    8.9 中提供。


