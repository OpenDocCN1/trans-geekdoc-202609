    [Figure 13.2](#ch20.xhtml#f171b)Code snippet to collect open datasets.


    Then we import the opendatasets library as od. We use the dataset link from Kaggle
    to download the Brain Tumor Classification Dataset. Before this step, make sure
    you download the Kaggle API credentials in your Kaggle account settings. The necessary
