    ## 7.5 结论


    在本章中，我们通过使用机器学习策略对糖尿病进行预测，首次进入了模型评估和性能指标的世界。除了仅仅的准确率，由于引入了多种评估指标（包括准确率、精确率、召回率、F1
    分和 ROC AUC 分），我们现在对模型评估有了全面的理解。读者通过在 Pima 印第人糖尿病数据集上使用三种不同的机器学习模型，获得了关于开发模型、进行特征缩放和准确评估模型性能的知识。


    ## 7.6 进一步学习


    来自 Pima 印第人的糖尿病数据集对于糖尿病预测领域的未来研究和技术突破具有巨大的前景。在特征工程和最重要的特征选择方面，可以进行进一步的研究以发现与糖尿病独特的其他方面，以及使用更复杂的方法来派生新特征或选择最重要的特征。此外，该数据集还可以通过更先进的机器学习程序，例如应用深度学习模型（如卷积神经网络
    CNN 或循环神经网络 RNN），这些模型能够识别隐藏在数据中的细微模式和相关性。


