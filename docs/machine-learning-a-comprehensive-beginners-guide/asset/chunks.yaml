    ## P1.13 What is oneAPI?


    What is oneAPI? Well, this is a question asked by many tech enthusiasts, learners,
    teachers, industry practitioners and everyone in the tech space. This chapter
    is intended to provide information as to what oneAPI is all about, why there is
    a lot of discussion about oneAPI, what oneAPI can provide, etc. (Note: It is oneAPI
    and not OneAPI.) Let us first understand the problem faced by software developers
    all around the world. Firstly, there has been humongous growth recently in specialized
    workloads. Secondly, each hardware needs to use different programming languages
    and related libraries. This increases the challenges with respect to maintaining
    different code bases and repositories. Thirdly, though it is seen as an advantage
    with the increase in the number of tools, it is also a challenge for developers
    to learn to use different tools, particularly given the learning time involved.
    What we mean here is that the development of software for different hardware platforms
    like CPU (Central Processing Unit), GPU (Graphics Processing Unit) or FPGA (Field-Programmable
    Gate Array) requires different learning strategies, investments and eventually
    no guarantee of reusing that work with other architectures/hardware. Writing code
    once, then writing it again for another architecture is the biggest bugbear faced
    by software developers globally. Yes, this problem has to be solved and this is
    where oneAPI comes in.


    One can understand the aforementioned point by referring to [Figure 1.15](#ch07.xhtml#f15)
    which is self-explanatory. The challenge to be solved is huge and that is where
    oneAPI comes in handy.


    ![Figure P1.15The challenge.](html/images/9781032676654_C000_015.jpg)


    [Figure P1.15](#ch07.xhtml#f15b)The challenge.


    One must first understand what oneAPI all is about. It is an open and standards-based
    cross architecture programming model which breaks the programmers’ challenges.
    oneAPI provides the developers with total freedom and choice to select the hardware
    as CPU, GPU, or FPGA for enhanced computing. The vision behind the oneAPI’ s creation
    is interesting. It aims to bring a unified software development environment across
    CPU, GPU, or other accelerators.


    oneAPI is an industry initiative and is completely based on the standards and
    the open specifications.


    oneAPI has many appreciable features which developers certainly appreciate:


    1.  First and foremost, the developers can develop and deploy the software with
    absolute peace of mind.


    2.  oneAPI includes libraries and has a unified language which can ensure complete
    native performance.


    3.  Freedom, yes. oneAPI facilitates the native code performance across a range
    of hardware including CPUs, GPUs, FPGAs, and AI (Artificial Intelligence) accelerators.


    4.  Since it is of open industry standards, it is certainly the best approach
    for the future.


    5.  The biggest advantage lies with the compatibility. Yes, it gives you excellent
    compatibility with the existing programming languages which include the C++, Python,
    SYCL, Fortran, and openMP.


    oneAPI is the foundational or base programming stack. Once should see that as
    a facilitator to optimize the middleware and the frameworks which gets above it.
    One can have a clearer understanding of this point by referring to [Figure P1.16.](#ch07.xhtml#f16)
    The readers could see that TensorFlow kind of frameworks sit above the oneAPI
    which are optimized for performance. The representation shown in [Figure P1.16](#ch07.xhtml#f16)
    is enhanced and presented in [Figure P1.17](#ch07.xhtml#f17) to impart ample clarity.


    ![Figure P1.16The Revolution – oneAPI (The industry initiative and intel product).](html/images/9781032676654_C000_016.jpg)


    [Figure P1.16](#ch07.xhtml#f16b)The Revolution – oneAPI (The industry initiative
    and intel product).


    ![Figure P1.17Power of oneAPI.](html/images/9781032676654_C000_017.jpg)


    [Figure P1.17](#ch07.xhtml#f17b)Power of oneAPI.


    The optimized applications go to the topmost layer as one could see from [Figure
    P1.17](#ch07.xhtml#f17), which leverages the middleware and the frameworks.


    The oneAPI comes with powerful and advanced porting tools (this eases our job,
    folks, it ports the code for us). Analysis tools like the intel VTune profiler,
    intel advisor, and debuggers are also provided. This enables someone to debug
    the code or to analyze the performance across all levels of abstraction without
    any hindrance.


    Having explained what oneAPI and what it brings to you as a developer, it is important
    to talk about another very important benefit it offers to the developers. There
    is no proprietary lock-in associated with oneAPI and is compatible with the code
    written in the native languages such as C, C++ and more as conveyed earlier.


    In simple words, oneAPI provides developers the option to choose the best of the
    architecture for a specific problem without forcing the developer to re-write
    the code for different architectures or platforms.


    oneAPI also promotes community and industry collaboration on a larger scale.


    Remember this! oneAPI is all about “Write once, deploy many times.”


