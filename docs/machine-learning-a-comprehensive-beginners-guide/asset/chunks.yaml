    We initiate a loop which trains and evaluates a series of bagging models that
    has been initialized by us. We use the fit method to train data and predict target
    using the predict method. The accuracy of all the models is computed and stored
    in a list called accuracies as depicted in [Figure 12.8](#ch19.xhtml#f167).


    ![Figure 12.8Model training and evaluation.](html/images/9781032676654_C012_008.jpg)


    [Figure 12.8](#ch19.xhtml#f167b)Model training and evaluation.


