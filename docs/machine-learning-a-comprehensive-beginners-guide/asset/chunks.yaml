    # Chapter 2Heart failure prediction with oneAPI


    DOI: [10.1201/9781032676685-3](http://doi.org/10.1201/9781032676685-3)


    ## Learning objectives


    By the end of this chapter, the reader should be able to:


    *   Explore the means of predicting heart failure by employing ML models and making
    use of the power provided by Intel’s oneAPI framework.


    *   Use the oneDAL and oneDNN libraries that come along with the oneAPI.


    *   Obtain insights into predictive modeling and be in a position to apply those
    insights to comparable initiatives in the field of healthcare.


    *   Grasp the methods and algorithms that are used in the chapter.


    ## 2.1 Introduction


    The process of investigating and analyzing data, developing models with a variety
    of methods, and evaluating the efficacy of these models in predicting heart failure
    will be covered in detail throughout this chapter. Building prediction models
    and gaining insights into this important area of healthcare will be accomplished
    with the help of a dataset on heart failure that is accessible to the general
    public. The link to the dataset is [www.kaggle.com/datasets/andrewmvd/heart-failure-clinical-data](http://www.kaggle.com)


    This chapter will improve both your theoretical understanding and practical competency
    in predictive modeling for heart failure prediction. You will have a better understanding
    of the significance of early diagnosis and precise prognosis in the process of
    bettering the outcomes for patients. In addition, you will gain an understanding
    of how to utilize well-known ML methods for heart failure prediction. The algorithms
    include random forest, XGBoost, and convolutional neural networks. You will also
    learn the benefits of leveraging Intel’s oneAPI libraries, such as oneDAL and
    oneDNN, to optimize code, improve efficiency, and take advantage of hardware acceleration
    in order to boost performance.


    Intel’s oneAPI programming style and framework simplifies software development
    and optimizes performance across hardware architectures. oneAPI lets developers
    design code that runs efficiently on CPUs, GPUs, FPGAs, and other accelerators
    without major adjustments. This framework lets developers use hardware acceleration
    to accelerate computations with performance-optimized libraries like oneDAL and
    oneDNN. In this chapter, we optimize our code using oneAPI to improve the heart
    failure prediction models.


    ## 2.2 Importing libraries


    In this part, we import the libraries, which will be employed to work with data,
    analyze it, and build models that can predict what will happen. Each library has
    its own goal and gives us useful functions and classes to help us do our task.


    *   The pandas library gives us strong tools for manipulating and analyzing data,
    which makes it easy to work with structured data. The numpy library possess lot
    of math tools and makes it easy to do numerical calculations on arrays and matrices.


    *   We use the sklearn.model\_selection module’s train\_test\_split function to
    split the dataset into training and testing sets. This is very important for figuring
    out how well our models work on new data.


    *   We bring in the RandomForestClassifier class from the sklearn.ensemble package
    to build a random forest classifier model. Random forests are a type of ensemble
    learning that makes correct predictions by putting together several decision tree
    models.


    *   We add in the xgboost tool to do gradient boosting. Gradient boosting is used
    in XGBoost, which is a high-performance and efficient version of gradient boosting.


    *   In deep learning (DL), we use the tensorflow.keras.models package to bring
    in the Sequential class. With the Sequential class, we can make a neural network
    model with levels that are stacked on top of each other.


    *   Lastly, we bring in certain layers from the tensorflow.keras.layers package,
    such as Dense, Conv1D, MaxPooling1D, and Flatten. When making deep neural network
    architectures, these layers serve as the important building blocks.


    Our code will be built on these imported packages, which will offer us the tools
    needed to analyze and model data well. The red bar below the code in [Figure 2.1](#ch09.xhtml#f40)
    depicts the optimization of oneDAL, oneDNN, and Xgboost libraries with oneAPI.


    ![Figure 2.1Importing the libraries.](html/images/9781032676654_C002_001.jpg)


    [Figure 2.1](#ch09.xhtml#f40b)Importing the libraries.


    ## 2.3 Exploring the data


    In this section, we will go into the exploration of the heart failure dataset
    in order to obtain insights and better understand the data properties. The process
    of identifying patterns, links, and potential problems in a dataset is referred
    to as “data exploration,” and it is a key stage in the ML pipeline.


    We start by using the read\_csv() function of the pandas library (see [Figure
    2.2](#ch09.xhtml#f41)) to load the heart failure dataset from a CSV file into
    a pandas DataFrame. Because of this, we are now able to efficiently organize and
    modify the data.


    ![Figure 2.2Code snippet to read and store the dataset.](html/images/9781032676654_C002_002.jpg)


    [Figure 2.2](#ch09.xhtml#f41b)Code snippet to read and store the dataset.


    We use the head() function to display the first few rows of the dataset so as
    to get an overview of the data (see [Figure 2.3](#ch09.xhtml#f42)). This clarifies
    the structure and format of the data for us, as well as the type of information
    that is stored in each column.


    ![Figure 2.3To obtain data overview.](html/images/9781032676654_C002_003.jpg)


    [Figure 2.3](#ch09.xhtml#f42b)To obtain data overview.


    The next step is to acquire an overall perspective of the dataset by utilizing
    the info() function (see [Figure 2.4](#ch09.xhtml#f43)). This gives us information
    on the data types that are contained within each column, as well as the total
    number of values that are not null. This is especially helpful in the identification
    of data that is either missing or incomplete.


    ![Figure 2.4To obtain data types.](html/images/9781032676654_C002_004.jpg)


    [Figure 2.4](#ch09.xhtml#f43b)To obtain data types.


    Utilizing the describe() function allows us to generate a statistical summary,
    which provides us with further insights into the dataset. This summary provides
    measurements for each numerical column, such as the mean, standard deviation,
    minimum, maximum, and quartiles. It gives a detailed picture of the distribution
    of values within the dataset as well as the range of those values (see [Figure
    2.5](#ch09.xhtml#f44)).


    ![Figure 2.5To generate a statistical summary.](html/images/9781032676654_C002_005.jpg)'
