    ## 4.3 Scaling the features


    It is possible that various machine-learning algorithms will have varying requirements
    for the magnitude of the features. In this step, we will scale the features so
    that they have an average value of zero and a variance of one using the StandardScaler
    tool that is part of scikit-learn ([Figure 4.8](#ch11.xhtml#f71)). We use the
    StandardScaler class included in scikit-learn to normalize the feature data so
    that we can conduct fair comparisons and prevent some characteristics from being
    very influential in the models. We start by fitting the scaler to the training
    data, and then we use the learned scaling factors to change both the training
    data and the testing data.


