    # 引言

    手动下载和准备数据一直一直是从外部源获取数据集过程中的必要步骤。另一方面，在本章中，我们将向读者展示一种更加精简的方法。我们不再需要手动下载“flowers-recognition”（花卉识别）数据集，因为我们可以使用
    `OpenDatasets` 库直接从 Kaggle 获取它，而不是手动操作。这不仅加快了数据收集过程，还节省了时间。


    一旦你按照图 5.1 所示安装了必要的库，请按照以下步骤操作。


    ![图 5.1 安装必要的库。](img/9781032676654_C005_001.jpg)


    图 5.1 安装必要的库。


    *   第 1 步：访问 [www.kaggle.com](http://www.kaggle.com)

    *   第 2 步：选择数据集（在本章中我们使用了花卉识别数据集）。

    *   第 3 步：复制链接 [www.kaggle.com/datasets/alxmamaev/flowers-recognition](http://www.kaggle.com)


    你可以看到，我们在图 5.2 所示的上方代码中使用了我们的数据集链接。作为下一步，在执行完上述代码后，你需要输入一次你的 Kaggle 用户名和密钥（key）。请按照下述步骤获取你的
    Kaggle 用户名和密钥。


    ![图 5.2 导入数据集。](img/9781032676654_C005_002.jpg)


    图 5.2 导入数据集。


    *   第 1 步：通过访问网站 [www.kaggle.com](http://www.kaggle.com) 并登录来访问你的 Kaggle 账户。如果你还没有账户，请自己创建一个。

    *   第 2 步：成功登录后，导航到你的账户设置页面。你可以点击网站右上角，点击你的个人头像，然后从下拉菜单中选择“My Account”（我的账户）来访问你的
    Kaggle 账户。

    *   第 3 步：要生成新的 API 令牌，向下滚动直到标记为“API”的区域，然后点击“Create New API Token”（创建新 API 令牌）。这将会在计算机上下载一个名为
    `kaggle.json` 的文件，它包含你的 API 凭据。


    ## 5.3 数据预处理


    图 5.3 所示的这些代码将加载必要的库，以便使用 `TensorFlow` 构建机器学习模型，这涉及到数据处理和可视化。


    ![图 5.3 导入库的代码片段。](img/9781032676654_C005_003.jpg)


    图 5.3 导入库的代码片段。


    在这一步，我们将确定图像尺寸并设置数据集路径。下载的数据集路径存储在 `data_dir` 变量中，其值设置为该路径。`img_height` 和 `img_width`
    是指示所用图像长度和宽度的两个参数，将在模型训练时进行调整。代码片段请参考图 5.4。


    ![图 5.4 设置图像尺寸和路径的代码片段。](img/9781032676654_C005_004.jpg)


    图 5.4 设置图像尺寸和路径的代码片段。


    ## 5.4 创建模型架构


    为了丰富可用数据，我们创建了图 5.5 所示的 `ImageDataGenerator`。`TensorFlow` 的 `ImageDataGenerator`
    是一个辅助数据增强和数据预处理的实用类。它也可以用于生成图像数据。应用于照片的更改（如调整大小、裁剪、放大和水平翻转图像）由本节中提供的参数定义。


    ![图 5.5 生成图像数据的代码片段。](img/9781032676654_C005_005.jpg)


    图 5.5 生成图像数据的代码片段。


    图 5.6 和图 5.7 所示的这些行利用 `ImageDataGenerator` 的 `flow_from_directory` 函数，分别从指定的目录加载训练数据和验证数据。


    ![图 5.6 加载训练数据的代码片段。](img/9781032676654_C005_006.jpg)


    图 5.6 加载训练数据的代码片段。


    ![图 5.7 加载验证数据的代码片段。](img/9781032676654_C005_007.jpg)


    图 5.7 加载验证数据的代码片段。


    `batch_size` 决定了图像的数量。`class_mode` 设置为 categorical（分类模式）。`subset` 用于将数据划分为训练集和验证集。


    ## 5.5 训练模型


    图 5.8 提供的代码使用 `Sequential` API 定义了模型结构。模型由卷积层组成，随后是最大池化层。将最大池化层的输出展平（Flatten）并连接到全连接层（dense
    layer）完成了该过程。网络中添加的丢弃层（dropout layer）防止过拟合，使用 softmax 激活函数的最后一个全连接层生成概率。


    ![图 5.8 定义模型架构的代码片段。](img/9781032676654_C005_008.jpg)


    图 5.8 定义模型架构的代码片段。


    `Adam` 优化器、`categorical_crossentropy` 损失函数和 `accuracy` 指标用于模型的编译。为了用预定的 `epochs`
    使用训练数据训练模型，调用了 `fit` 方法。在验证数据上评估性能。


    ![图 5.9 编译模型的代码片段。](img/9781032676654_C005_009.jpg)


    图 5.9 编译模型的代码片段。


    ## 5.6 基于 Gradio 开发接口


    图 5.10 展示了对图像进行预测的定义代码片段。我们将利用 `Gradio` 库开发直观的接口。`Gradio` 允许我们简单地定义机器学习接口。我们将构建一个在接收图像后显示花卉类型的界面。


    ![图 5.10 函数定义的代码片段。](img/9781032676654_C005_010.jpg)


    图 5.10 函数定义的代码片段。


    导入 `Gradio` 库定义了一个名为 `classify_flower` 的函数，它用于对输入图像进行分类。为了确定预测的概率，该函数首先调整图像大小，然后进行归一化，最后通过训练好的模型运行。


    使用 `gr.Interface` 设计接口，并将标签分别指定输入和输出。这里展示了示例照片以及接口的标题和描述。执行代码 `iface.launch()`
    时，Gradio 接口将启动。这使用户能够使用自己的照片与花卉分类模型进行交互。参见图 5.11。


    ![图 5.11 导入 Gradio 库。](img/9781032676654_C005_011.jpg)


    图 5.11 导入 Gradio 库。


    **注意：** 如果 `gradio` 模块尚未存在于你的工作环境中，你可以通过运行以下代码获取它：

    ```

    % pip install gradio

    ```


    图 5.12 是我们使用 Gradio 创建的一个接口示例。


