    # 第 18 章 智能医疗

    ## 使用 oneAPI 进行肾病预测的机器学习方法


    DOI: [10.1201/9781032676685-19](http://doi.org/10.1201/9781032676685-19)


    ## 学习目标


    阅读本章后，读者将能够：


    *   获取通过机器学习技术对肾病进行分类的知识。

    *   利用多种机器学习算法实现更高的诊断准确率。


    ## 18.1 引言


    “慢性肾病”一术是指影响大部分人群的疾病，定义为肾功能的持续丧失。在仍可治疗的早期阶段检测出 CKD 对于有效的管理策略至关重要。本章全程使用通过链接所示的
    Kaggle 慢性肾病数据集作为利用机器学习对 CKD 进行分类的基础：[www.kaggle.com/datasets/mansoordaku/ckdisease](http://www.kaggle.com)。我们希望通过应用先进算法和数据准备策略，大幅提高慢性肾病（CKD）的诊断准确率，为医疗领域做出重大贡献。


    ## 18.2 数据预处理与划分


    我们首先导入用于数据可视化、数据操作和模型构建的必要库。如图 18.1 所示的红色弹出窗口告诉我们，整个代码已通过 oneAPI 进行了优化。


    ![图 18.1 导入所需的库。](img/9781032676654_C018_001.jpg)


    图 18.1 导入所需的库。


    然后，我们将数据集导入内核并将其存储在名为 `data` 的变量中，并查看所导入数据集的前五行。从推断可以明显看出，我们混合了数值值和类别值，这将在后续步骤中处理（参见图
    18.2）。我们还可以注意到某些列中存在 `NaN`（非数字）值（Chandradas, A., 2021），且 `ID` 列似乎与寻找我们的目标变量无关。`Classification`
    列是我们的目标列。


    ![图 18.2 导入数据集。](img/9781032676654_C018_002.jpg)


    图 18.2 导入数据集。


    如上一步所述，我们将使用 `drop` 函数从数据集中删除 `ID` 列。然后我们使用 `info()` 函数查看数据框的短摘要，如图 18.3 所示。


    ![图 18.3 使用 drop 和 info 函数。](img/9781032676654_C018_003.jpg)


    图 18.3 使用 drop 和 info 函数。


    我们使用 `unique()` 函数查看数据集中每列的唯一值，如图 18.4 所示。我们检查数据集中的误入值。在这里，我们可以看到 `43` 被误写为 `\t43.`。我们将在下一步中手动检查并更改所有值。


    ![图 18.4 使用 unique 函数。](img/9781032676654_C018_004.jpg)


    图 18.4 使用 unique 函数。


    我们使用 `replace()` 函数，将正确的变量手动映射到上一步发现的相应错误变量上。替换后的数据集再次存储在名为 `data` 的重复变量中（参见图
    18.5）。


    ![图 18.5 使用 replace 函数。](img/9781032676654_C018_005.jpg)


    图 18.5 使用 replace 函数。


    在第一步中，通过查看数据集，我们使用 `isnull()` 函数查找缺失值。然后我们使用 `sum()` 计算每列缺失值的数量。为了处理这些值，我们使用 `fillna()`
    函数将缺失项替换为特定值，例如列的平均值或众数。


