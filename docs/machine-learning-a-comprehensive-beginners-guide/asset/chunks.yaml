    ## 14.3 Data preprocessing and splitting


    We use the isnull().sum() command as illustrated in [Figure 14.9](#ch21.xhtml#f190)
    to look at the null values present in the dataset. Here there are no null values
    present.


    ![Figure 14.9Look for null values in the dataset.](html/images/9781032676654_C014_009.jpg)


    [Figure 14.9](#ch21.xhtml#f190b)Look for null values in the dataset.


    The next step in processing our dataset is to separate it into a training set
    and a testing set. The train\_test\_split function found in the sklearn library
    is what we turn to in order to accomplish this. First, all of the features are
    entered into variable X, and the target column is entered into variable y. The
    feature data and the target data for both sets are stored in the variables X\_train,
