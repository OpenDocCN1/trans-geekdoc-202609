    ### 4.4.2 Random Forest + k-NN


    Next, we use the K neighbors Classifier class provided by scikit-learn to generate
    an instance of the k-NN classifier. We make a new instance of the VotingClassifier
    object that uses a classification strategy that mixes Random Forest and k-NN.
    We train the VotingClassifier using the provided data. Based on the testing results,
    we formulate hypotheses and then compute an accuracy score. Refer to [Figure 4.10](#ch11.xhtml#f73)
    for the code snippet.


    ![Figure 4.10Training a Random Forest + k-NN Model.](html/images/9781032676654_C004_010.jpg)


    [Figure 4.10](#ch11.xhtml#f73b)Training a Random Forest + k-NN Model.


    ### 4.4.3 SVM + k-NN


    In a similar manner, we create an object called VotingClassifier that integrates
    both the SVM and the k-NN classifiers.We train the VotingClassifier using the
    provided data. Based on the testing results, we formulate hypotheses and then
    compute an accuracy score (see [Figure 4.11](#ch11.xhtml#f74)).


    ![Figure 4.11Training a SVM + k-NN Model.](html/images/9781032676654_C004_011.jpg)


    [Figure 4.11](#ch11.xhtml#f74b)Training a SVM + k-NN Model.


    ## 4.5 Conclusion


    This chapter focused on creating hybrid machine learning models, which we have
    discussed in depth. We have gained the knowledge necessary to preprocess the data,
    develop hybrid models by utilizing various combinations of classifiers, and evaluate
