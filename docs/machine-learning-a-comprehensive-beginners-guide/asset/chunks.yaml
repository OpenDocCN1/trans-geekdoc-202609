    ![图 20.10 数据集划分。](img/9781032676654_C020_010.jpg)


    图 20.10 数据集划分。


    我们利用训练模型对新数据（即 `new_texts`）进行预测。在利用模型之前，文本序列应该经过分词和填充。使用 `encoder.inverse_transform`
    函数反转编码并将预测值转换回原始标签。预期的分类显示为结果输出（参见图 20.11 和图 20.12）。


    ![图 20.11 模型评估。](img/9781032676654_C020_011.jpg)


    图 20.11 模型评估。


    ## 20.5 结论


    本研究涉及了从 Kaggle 网站获取的 `X`（即 Twitter）情感分析数据集的处理和利用。我们通过 `LSTM` 神经网络构建了一个健壮的情感分析模型。该过程包含了许多步骤：首先，我们将
    `sentiment` 列中存在的唯一值 `0` 和 `4` 分别映射为 `Negative`（负）和 `Positive`（正）。其次，我们对文本进行清洗，移除
    URL、多个空格、话题标签等。最后，将文本转换为数值序列并进行填充。


