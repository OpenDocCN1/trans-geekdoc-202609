    ## 8.3 Data pre-processing


    ### 8.3.1 Outlier detection and analysis


    Outliers are data points that significantly deviate from the general pattern or
    distribution of the dataset. They are observations that are unusually distant
    from other observations and can have a substantial impact on the analysis and
    modeling process. Outliers can occur due to various reasons such as measurement
    errors, data entry mistakes, experimental anomalies, or genuine extreme values.
    Identifying and handling outliers is an essential step in data preprocessing as
    they can distort statistical analyses, affect the accuracy of machine learning
    models, and lead to misleading insights.


    The number of rows and columns contained in the dataset is indicated by the “shape”
    of the data, which can be obtained by using the snippet of code known as data.shape
    as given in [Figure 8.3](#ch15.xhtml#f112). It supplies information regarding
    the parameters of the dataset. The features are extracted from the dataset using
    the code X = data.drop(\[“name,” “status”\], axis=1) as the separator. It does
    this by removing the columns “name” and “status” from the data in the first dataset,
    which results in the creation of a new DataFrame X. If you set the axis option
    to 1, it implies that the columns should be removed.


    ![Figure 8.3Code snippet for data shape.](html/images/9781032676654_C008_003.jpg)


    [Figure 8.3](#ch15.xhtml#f112b)Code snippet for data shape.


    When the line of code y = data\[“status”\] is executed, the value of the target
    variable “status” is transferred to the variable y. It generates a new Series
    y using the values taken from the original dataset’s “status” column and populating
    it with those values. The number of rows and columns contained within the features
    can be determined by using the code X.shape, which returns the shape of the features
    contained within DataFrame X. It offers details regarding the extent to which
    the feature set can be utilized.


    In order to better illustrate the outcomes of the outlier detection, we generate
    a scatter plot with the help of matplotlib.pyplot and seaborn. The “MDVP:Fo(Hz)”
    feature is plotted along the y-axis, while the sample index is plotted along the
    x-axis. The hue parameter is used to color-code the outliers, so that the outliers
    are represented by a color that is distinct from the inliers’ color representation.
    Refer to [Figure 8.4](#ch15.xhtml#f113). This gives us the ability to visually
    recognize the occurrences that are considered to be outliers based on where they
    are located in the scatter plot. (Note that while we chose the column MDVP:Fo(Hz)
    at random, this does not indicate that it is the sole column that contains outliers.)


    ![Figure 8.4Outlier detection.](html/images/9781032676654_C008_004.jpg)


    [Figure 8.4](#ch15.xhtml#f113b)Outlier detection.


    We utilize an unsupervised learning approach called IsolationForest as represented
    in [Figure 8.5](#ch15.xhtml#f114) to find outliers in the dataset. This algorithm
    discovers anomalies by separating instances of the dataset and looking for patterns
    that do not fit the norm. We start a new instance of IsolationForest with a contamination
    parameter of 0.05, which indicates that we anticipate that around 5% of the data
    will be abnormal. After that, in order to understand the fundamental structure
    of the data, we apply the outlier detector to the feature matrix X and run the
    fitting process. Next, we apply the trained outlier detector to the dataset in
    order to forecast the outliers using the predict() method that is attached to
    X. A label of -1 is given to outliers by the predict() method, while a label of
    1 is given to inliers. By selecting only the inlier occurrences for which the
    projected label is 1, we are able to generate a new subset of the feature matrix
    known as X\_no\_outliers. In a similar manner, we generate a comparable subset
    of the target variable called y\_no\_outliers by removing the outliers from the
    data.


    ![Figure 8.5Outlier analysis.](html/images/9781032676654_C008_005.jpg)


    [Figure 8.5](#ch15.xhtml#f114b)Outlier analysis.


    ### 8.3.2 The train-test split


    For the function derived from sklearn.model\_selection called train\_test\_split,
    we make use of the attributes X\_no\_outliers and the desired variable y\_no\_outliers,
    both composed of the filtered data that do not contain outliers. The test\_size
    argument in [Figure 8.6](#ch15.xhtml#f115) allows the user to specify the percentage
    of the data used for testing, and the random\_state parameter ensures that the
    split can be reproduced.


    ![Figure 8.6Splitting the data.](html/images/9781032676654_C008_006.jpg)


    [Figure 8.6](#ch15.xhtml#f115b)Splitting the data.


    ### 8.3.3 Scaling features


    StandardScaler from the sklearn.preprocessing library as in [Figure 8.7](#ch15.xhtml#f116)
    is used to perform the scaling of the features. Scaling the training features
    (X\_train) and the testing features (X\_test) requires the StandardScaler to be
    instantiated as scaler so that it may be used. When the features are scaled, this
    guarantees that they are all on the same scale and prohibits any one feature from
    taking control of the learning algorithm.


    ![Figure 8.7Code snippet to perform feature scaling.](html/images/9781032676654_C008_007.jpg)


    [Figure 8.7](#ch15.xhtml#f116b)Code snippet to perform feature scaling.


    ### 8.3.4 Polynomial feature engineering


    We will use polynomial feature engineering so that we can better understand the
    intricate connections between the features. Using this method, polynomial combinations
    of the initial characteristics are generated, which results in the creation of
    additional interaction terms. We will be able to more accurately describe non-linear
    relationships and maybe improve the performance of the model if we make use of
    higher-order terms. In this section, examples of code will be provided so as to
    explain the notion of polynomial feature engineering.


    Following the scaling of the features, polynomial feature engineering is carried
    out (refer to [Figure 8.8](#ch15.xhtml#f117)) with the help of the sklearn.preprocessing
    class PolynomialFeatures. In this particular instance, the degree of the polynomial
    is set to 2, denoted by the notation degree = 2. In order to convert the scaled
    training features (X\_train\_scaled) and testing features (X\_test\_scaled) into
    polynomial features, the PolynomialFeatures class is instantiated as the variable
    poly. This procedure creates new features by combining the existing features to
    the specified degree, which may then be used to build new features.


    ![Figure 8.8Code snippet for polynomial feature engineering.](html/images/9781032676654_C008_008.jpg)


    [Figure 8.8](#ch15.xhtml#f117b)Code snippet for polynomial feature engineering.


    The modified features generated as a result, are saved in X\_train\_poly for the
    training data and X\_test\_poly for the testing data. These polynomial features
    capture non-linear correlations between the original data, allowing the models
    to learn more complicated patterns. This is made possible by the fact that the
    models are able to learn the patterns.


    ## 8.4 Model training and evaluation


    In this section, we will train three distinct machine learning models: the Linear
    Discriminant Analysis (LDA), the Linear Regression, and the Decision Tree Classifier
    and then compare their performance. The training data will be used to fit each
    model, and the test data will be used to evaluate the models. In order to evaluate
    the efficacy of each model in predicting Parkinson’s disease, we will compute
    the accuracy. The code snippet of this is provided in [Figure 8.9](#ch15.xhtml#f118).


    ![Figure 8.9Code snippet for training the machine learning models.](html/images/9781032676654_C008_009.jpg)


