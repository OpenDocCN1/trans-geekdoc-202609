    这些目标是为读者提供处理水质相关数据集所需的信息和能力，理解类别不平衡带来的挑战，并实施机器学习（ML）算法来预测水质的可饮用性。读者可以通过以下链接找到该数据集：[www.kaggle.com/datasets/adityakadiwal/water-potability](http://www.kaggle.com)


    ## 3.2 类别不平衡问题


    类别不平衡问题是机器学习项目中经常出现的挑战之一。类别不平衡是指目标变量中的类别分布不均匀的现象，其中一个类别的样本数量显著少于其他类别（或多个类别），以及可能存在的任何其他类别。这在评估水质时可能会发生，例如，被认为可人类饮用的水样本（`class
    1`）的数量远少于被认为有害的水样本（`class 0`）的数量。


    处理类别不平衡至关重要，因为它可能导致模型产生偏差，使模型优先倾向于占据多数派的类别，而在准确预测少数派类别时表现糟糕。为了确保预测的准确和可靠，我们在本章中将处理水质相关数据集中的类别不平衡问题。


    我们使用饼图来描绘“饮用性”（Potability）类别的分布，以评估并克服类别不平衡。这有助于我们识别安全水和危险水样本之间的不平衡，这对于解决该问题是必要的。为了解决这个问题，最终决定使用重采样技术。为了获得一个分布更均匀的数据集，重采样可能涉及对少数类进行过采样（这将增加其代表性）或对多数类进行下采样（这将减少其代表性）。我们通过打乱数据集来消除可能由数据呈现顺序引起的任何偏差。


    在本章的课程中，读者将对类别不平衡问题有更深入的理解，并理解有效解决该问题的重要性。读者将学习如何利用重采样技术生成一个能够对安全和不安全水样本提供等比例表示的平衡数据集。这将为水质饮用性的预测提供更准确、更可靠的机器学习模型。


    ## 3.3 数据集概述


    在此部分，我们导入所有所需的库，从 CSV 文件读取数据到 DataFrame 中，并显示数据集的前五行（参见图 3.1）。


    ![图 3.1 导入库。](img/9781032676654_C003_001.jpg)


    图 3.1 导入库。


    ### 3.3.1 数据预处理


    在此部分，我们通过添加每列中的缺失数据数量并删除包含任何缺失值的行来处理数据集中的缺失值。相同的代码段提供在图 3.2 中。


    ![图 3.2 解决数据集中的缺失值。](img/9781032676654_C003_002.jpg)


    图 3.2 解决数据集中的缺失值。


    我们使用 `isnull().sum()` 方法来确定每列中缺失值的数量，以便解决数据集中的缺失值问题。这将为我们提供数据集中缺失值的摘要。我们决定使用 `dropna()`
    方法删除包含任何缺失值的行。这将允许我们确保数据的准确性和一致性。通过执行这些程序，我们获得了水质相关数据集的初步概览，包括其结构以及处理缺失值的方法。在接下来的章节中，我们将深入研究数据集中存在的类别不平衡问题，并研究可以用于克服它的不同方法。


    ### 3.3.2 类别不平衡与过采样


    在本节中，我们将讨论水质相关数据集中的类别不平衡问题。当目标变量中的类别之间不相等地对应时，被称为类别不平衡。在这种情况下，“饮用性”因素的类别是不平衡的，一个类别的样本数量远少于另一个类别。我们将制作一个饼图来展示“饮用性”类别的分布，以便更好地了解类别不平衡。这将帮助我们很好地理解数据集中每个类别的分布。可以使用图
    3.3 所示的饼图更详细地查看班级学生的分布情况。


    ![图 3.3 饼图可视化。](img/9781032676654_C003_003.jpg)


    图 3.3 饼图可视化。


    我们能够查看每个类别的百分比，其中 `0` 表示不适合人类饮用的水样本，`1` 表示适合人类饮用的水样本（参见图 3.4）。


    ![图 3.4 查看每个类别的百分比。](img/9781032676654_C003_004.jpg)


    图 3.4 查看每个类别的百分比。


    我们可以通过此图看到类别之间的百分差异。我们从图 3.5 获取较大的样本量，以便利用重采样方法解决此问题。最后，我们打乱数据集以消除任何顺序偏差。


    ![图 3.5 使用重采样方法。](img/9781032676654_C003_005.jpg)


    图 3.5 使用重采样方法。


    从图 3.6 所示的饼图中可以看出，在重采样后我们解决了类别不平衡问题。


    ![图 3.6 重采样饼图可视化。](img/9781032676654_C003_006.jpg)


    图 3.6 重采样饼图可视化。


    ### 3.3.3 探索性数据分析


    我们利用 seaborn 生成相关性热力图，以获取变量之间联系的新见（参见图 3.7）。


    ![图 3.7 相关性热力图。](img/9781032676654_C003_007.jpg)


    图 3.7 相关性热力图。


    生成的热力图允许我们发现各种水质特征之间的关系。通过对相关值进行分析，我们可以更深入地理解变量之间的动态关系以及这些变量对饮用水性的潜在影响。


    ### 3.3.4 数据划分与模型训练


    接下来，我们采用 scikit-learn 包中的 `train_test_split` 函数将数据集划分为训练集和测试集。此外，我们在图 3.8 所示的代码段中导入了必要的机器学习模型。


    ![图 3.8 划分数据集。](img/9781032676654_C003_008.jpg)


    图 3.8 划分数据集。


    接下来，我们将开始训练并评估三个不同的机器学习模型，即`逻辑回归`、`高斯朴素贝叶`和`决策树分类器`。


