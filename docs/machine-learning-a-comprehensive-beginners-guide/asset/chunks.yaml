    蘑菇分类数据集作为主要参考。数据集中提供的信息包含了与蘑菇相关的广泛特征，从而激发了我们从数据科学和人工智能的角度深入探索真菌学的兴趣。通过利用多种机器学习算法，我们的目标是理解蘑菇分类涉及的复杂性，特别是以高准确率区分食用类型和剧毒类型。


    ## 17.2 数据预处理与划分


    首先，我们导入了图 17.1 所示的几个必要库。我们导入了 `pandas` 和 `numpy` 来处理和操作数据。我们进行了广泛的探索性数据分析，因此导入了
    `seaborn` 和 `matplotlib` 库。为了建模，从 `scikit-learn` 库导入了所有的机器学习算法。我们使用 Intel 的 `oneAPI`
    工具优化了所有的机器学习模型，并使用了一些自定义库来补丁 `scikit-learn`。红色的弹出消息告诉我们环境已通过 `oneAPI` 了优化。


    ![图 17.1 导入库。](img/9781032676654_C017_001.jpg)


    图 17.1 导入库。


    然后，我们使用 `read_csv` 命令导入数据集并将其存储在变量 `data` 中，然后我们如图 17.2 所示查看了数据集的前五行。我们数据集中的所有列都是分类变量，因此让我们在后续步骤中进行编码。


    ![图 17.2 导入数据集的代码片段。](img/9781032676654_C017_002.jpg)


    图 17.2 导入数据集的代码片段。


    我们检查数据集中的空值；如图 17.3 的结果所示，显然我们的数据集中不存在空值。


    ![图 17.3 检查数据集中的空值。](img/9781032676654_C017_003.jpg)


    图 17.3 检查数据集中的空值。


    如前所述，我们必须将数据集中所有可用的分类值转换为数值。我们使用 `LabelEncoder` 将分类转换为数值，结果数据框存储在变量 `data_encoded`
    中。见见图 17.4。


    ![图 17.4 使用 LabelEncoder。](img/9781032676654_C017_004.jpg)


    图 17.4 使用 LabelEncoder。


    ## 17.3 探索性数据分析


    在这一节中，我们创建了各种可视化图以更好地理解数据。


    首先，我们创建了一个饼图来更好地理解目标列“class”。该列中有两个唯一值 `e` 和 `p`。我们使用 `.value_counts()` 命令来统计这两个唯一值，并存储和显示结果。相同的代码片段提供在图
    17.5 中。


    ![图 17.5 统计唯一值。](img/9781032676654_C017_005.jpg)


    图 17.5 统计唯一值。


    图 17.6 中的红色部分对应于数据集中毒蘑菇的比例。浅蓝色部分是食用蘑菇的比例。这些类别的比例是相当的。


    ![图 17.6 目标值分布。](img/9781032676654_C017_006.jpg)


    图 17.6 目标值分布。


    我们继续检查并分析数据集中的特定列。从“cap-shape”列开始，并根据出现次数降序计数唯一值。然后用 `barplot` 对值计数进行可视化。如图 17.7
    所示，类型 `X` 的计数最高，`c` 的计数最低。


    ![图 17.7 菌盖分布。](img/9781032676654_C017_007.jpg)


    图 17.7 菌盖分布。


    导入必要的库后，将图像尺寸设置为 15 英寸，如图 17.8 所示使用 `seaborn` 生成计数图，其中 x 轴代表菌盖形状，hue 代表类别。颜色分配给“Poisonous（有毒）”和“Edible（食用）”。


    ![图 17.8 生成计数图。](img/9781032676654_C017_008.jpg)


    图 17.8 生成计数图。


    从图 17.9 的图表中，凸形（convex）形状的毒蘑菇和食用蘑菇都更多。


    ![图 17.9 分布。](img/9781032676654_C017_009.jpg)


    图 17.9 分布。


    随后通过图 17.10 采用相同方法创建一个图表。


    ![图 17.10 绘制图。](img/9781032676654_C017_010.jpg)


    图 17.10 绘制图。


    从图 17.11 可以看出，SVM 是一个很好的模型。


    ![图 17.11 分布。](img/9781032676654_C017_011.jpg)


    图 17.11 分布。


    ## 17.4 建模与比较


    现在我们进入建模步骤。首先，我们将数据集划分为测试集和训练集。数据框中的所有特征赋值变量 `X`，目标存储在 `y` 中。然后，使用 `train_test_split`
    模块，如图 17.12 所示，将我们的数据集划分为 80% 训练集和 20% 测试集。


    ![图 17.12 数据集划分。](img/9781032676654_C017_012.jpg)


    图 17.12 数据集划分。


    使用测试数据训练并评估多个机器学习模型，所有这些模型的准确率都打印在控制台中。见图 17.13。


    ![图 17.13 模型训练与评估。](img/9781032676654_C017_013.jpg)


    图 17.13 模型训练与评估。


    如图 17.14 所示创建一个字典 `model_accuracies`，使用 `accuracy_score` 函数计算出的准确率得分存储其中。


    ![图 17.14 使用 accuracy_score 函数。](img/9781032676654_C017_014.jpg)


    图 17.14 使用 accuracy_score 函数。


    上述代码如图 17.15 所示生成了一个条形图，代表了不同模型的准确率。


    ![图 17.15 条形图。](img/9781032676654_C017_015.jpg)


    图 17.15 条形图。


    从图 17.16 所示，支持向量机（SVM）模型的性能最好，准确率为 99%，紧随其后的是逻辑回归，它与线性判别分析（LDA）不鼓相当，准确率均为 95%，而朴素贝叶斯（Naive
    Bayes）性能最后，准确率为 92%。


    ![图 17.16 模型比较。](img/9781032676654_C017_016.jpg)


    图 17.16 模型比较。


