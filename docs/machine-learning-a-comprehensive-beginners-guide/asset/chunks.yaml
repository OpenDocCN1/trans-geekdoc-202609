    ## 16.4 使用 Z-score 移除离群值


    离群值可以定义为偏离样本内观察到的主要模式存在显著的数据点。这些现象的发生可能是多种情况的结果，包括数据收集的不准确、测量精度的差异，或真正罕见事件的发生。尽管离群值有时可能意味着有趣的事件，但它们也可能向我们的分析中注入额外数据，导致误导性的解释和预测。Z-score，又称为标准分（standard
    score），作为数据分析领域的一个基本统计指标具有重要意义。该指标量化了给定数据点偏离平均值的标准差倍数。通过计算 Z-score，可以识别出偏离平均值的数值。我们在
    `h` 和 `salary` 列中计算 Z-score 并与定义的阈值进行比较以移除离群值。代码片段请参考 图 16.7。


