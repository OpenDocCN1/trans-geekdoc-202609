    # Chapter 4Breast cancer classification with hybrid ML models


    DOI: [10.1201/9781032676685-5](http://doi.org/10.1201/9781032676685-5)


    ## Learning objectives


    After finishing this chapter, the reader shall be able to:


    *   Make a prediction if the given sample in a dataset is benign or malignant.


    *   Utilize few well-known ML algorithms in the construction of hybrid models.


    *   Integrate several algorithms for improved predictive modeling.


    ## 4.1 Introduction


    In this chapter, we will investigate the idea behind hybrid ML models. Kaggle
    has provided us with the Wisconsin Breast Cancer Dataset, which we will be using
    in our work. The purpose of this dataset is to make a prediction as to whether
    a given sample is benign (meaning it is not cancerous) or malignant (meaning it
    is cancer). Hybrid models are models that integrate different machine learning
    algorithms in order to capitalize on the characteristics of each individual method,
    which may result in enhanced performance and accuracy. k-Nearest Neighbors (k-NN),
    Support Vector Machine (SVM), and Random Forest are three well-known algorithms
    that will be utilized in the construction of hybrid models that we will focus
    on. You will have an understanding of the principles of hybrid machine learning
    models by the time you reach the conclusion of this chapter, as well as how to
    integrate several algorithms for improved predictive modeling. Readers can find
    the dataset in the following link: [www.kaggle.com/datasets/uciml/breast-cancer-wisconsin-data](http://www.kaggle.com)


    ## 4.2 Data preparation


    ### 4.2.1 Importing libraries and loading data


    To get things rolling, we need to begin by importing the required libraries for
    our work. We will be handling the data with pandas, performing numerical computations
    with numpy, and developing machine learning models with scikit-learn.


    Afterwards, utilizing the read\_csv() function as in [Figure 4.1](#ch11.xhtml#f64),
    we will import the data that is included within a CSV file to the pandas DataFrame.
    See [Figure 4.2](#ch11.xhtml#f65).


    ![Figure 4.1Utilizing the read\_csv() function.](html/images/9781032676654_C004_001.jpg)


    [Figure 4.1](#ch11.xhtml#f64b)Utilizing the read\_csv() function.


    ![Figure 4.2Importing the data.](html/images/9781032676654_C004_002.jpg)


    [Figure 4.2](#ch11.xhtml#f65b)Importing the data.


    ### 4.2.2 Exploratory data analysis


    It is essential to carry out some preliminary examination of the data before beginning
    the modeling process. In order to comprehend and understand the data and its structure,
    we can make use of a variety of pandas functions. For instance, the head() function
    as provided in the code snippet of [Figure 4.3](#ch11.xhtml#f66) will show us
    the first five rows of the DataFrame; we may use head(10) to see the first 10
    rows from the dataframe according to our convenience.


    ![Figure 4.3Illustration of pandas function.](html/images/9781032676654_C004_003.jpg)


    [Figure 4.3](#ch11.xhtml#f66b)Illustration of pandas function.


    In order to deal with values which are not available in the dataset, we use the
    method isnull().sum() to search for any instances of null values. This gives the
    total amount of missing values that are present across all the columns in the
    DataFrame. To prevent biased or inaccurate predictions from being made, it is
    essential to manage missing data in an appropriate manner before training the
    models. See [Figure 4.4](#ch11.xhtml#f67).


    ![Figure 4.4To manage the missing data.](html/images/9781032676654_C004_004.jpg)


    [Figure 4.4](#ch11.xhtml#f67b)To manage the missing data.


    Next, we split the data into features (X) and the target variable (y) using the
    train\_test\_split() function from scikit-learn. The “X” DataFrame contains the
    features used for prediction, while the “y” Series contains the corresponding
    target values. We split the data into training and testing sets, with 80% for
    training and 20% for testing. The random state parameter ensures reproducibility
    of the split. See [Figure 4.5](#ch11.xhtml#f68).


    ![Figure 4.5Splitting the data.](html/images/9781032676654_C004_005.jpg)


    [Figure 4.5](#ch11.xhtml#f68b)Splitting the data.'
