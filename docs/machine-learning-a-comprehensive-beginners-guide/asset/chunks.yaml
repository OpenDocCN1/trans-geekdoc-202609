    check whether the model predicts accurately or not. The major point to be noted
    here is that, in any machine learning process, the feature extraction is very
    important and would be done without human intervention.


    ![Figure P1.3Machine learning process.](html/images/9781032676654_C000_003.jpg)


    [Figure P1.3](#ch07.xhtml#f3b)Machine learning process.


    ## P1.3 Relationship between AI, ML, and DL


    Artificial Intelligence (AI) is the broad area of research where researchers started
    thinking of inducing intelligence to machines. You may all know Sophia, the first
    humanoid robot who has citizenship of Saudi Arabia. Tang Yu is the AI-driven virtual
    robot CEO, who has been appointed to optimize the operational efficiency. The
    whole concept of AI in metaverse swirls around the fact that people do not need
    to face any real-life risks as they face in a real-life environment. See [Figure
    P1.4](#ch07.xhtml#f4).


    ![Figure P1.4Humanoid Robot Sophia, Robert CEO Tang Yu and AI in Metaverse.](html/images/9781032676654_C000_004.jpg)


    [Figure P1.4](#ch07.xhtml#f4b)Humanoid Robot Sophia, Robert CEO Tang Yu and AI
    in Metaverse.


    In this epoch of AI, ML is a beautiful subset of AI, which allows a specific task
    to be performed without any explicit interventions. Data from the past is provided
    to the system; the system extract features and learns from the patterns identified.
    Certain inferences are made from patterns and accordingly intelligent decisions
    are taken. Machine learning algorithms are auto adaptive and hence no explicit
    human interventions are required for the learning process of models. Feature extraction
    is an important step in the whole process, which helps the model to predict or
    classify the data appropriately.


    Deep learning (DL) is an advanced subset of AI, where a human brain is imitated
    in processing and understanding the data. Neural networks tend to be the basis
    of deep learning, which mainly acts like a black box to grab data and yield wonderful
    insights. Interpreting the results from the deep neural networks require good
    analytical skills so that the output obtained makes sense for some other useful
    applications.


    [Figure P1.5](#ch07.xhtml#f5) shows a proper relationship between AI, ML, and
    DL. Some of the major applications of AI like Natural Language Processing (NLP),
    visual perception by visualization techniques, automated programming platforms
    like no code, AI-driven robots for strenuous jobs and household jobs, knowledge
    representation and reasoning are some of the major applications that comes under
    AI.


    ![Figure P1.5Relationship between AI, ML, DL.](html/images/9781032676654_C000_005.jpg)


    [Figure P1.5](#ch07.xhtml#f5b)Relationship between AI, ML, DL.


    Machine learning has many algorithms like regression, classification, principal
    component analysis, clustering etc. for finding the inferences from the data analyzed
    using models created. Multilayer Perceptron’s used in Neural networks with the
    help of various algorithms like CNN (Convolutional neural networks), RNN (Recurrent
    Neural Network), GAN (Generative Adversarial Networks), automatic feature extraction
    and prediction or classification could be achieved using deep learning. The evolution
    progress of various categories of algorithms is portrayed in [Figure P1.6](#ch07.xhtml#f6).


    ![Figure P1.6How each of the category of algorithms evolved over time.](html/images/9781032676654_C000_006.jpg)


    [Figure P1.6](#ch07.xhtml#f6b)How each of the category of algorithms evolved over
    time.


    ## P1.4 Types of machine learning


    Now that we have a deep understanding about where machine learning has its place
    in the AI field of research, it is time for us to understand the various types
    of machine learning algorithms. Machine learning algorithms are mainly classified
    as three as given below; however, we add a fourth category for in depth understanding
    (see [Figure P1.7](#ch07.xhtml#f7)).


    ![Figure P1.7Types of machine learning algorithms.](html/images/9781032676654_C000_007.jpg)


    [Figure P1.7](#ch07.xhtml#f7b)Types of machine learning algorithms.


    *   Supervised learning


    *   Unsupervised learning


    *   Reinforced learning


    *   Evolutionary learning


    Let’s have a deeper look into the same with easy examples.


    ## P1.5 Supervised learning algorithms


    This algorithm makes use of labelled data gathered from the past to train the
    model and make the model predict or classify the test data which is not labelled
    to check whether the model can predict or classify the data properly. Supervised
    machine learning algorithms use labelled data – what is meant by that? It is simple
    – consider an example to understand the supervised learning process.


    You are provided with a dataset that contains images of both cats and dogs ([Figure
    P1.8](#ch07.xhtml#f8)). All the images in the dataset are labelled properly, say
    you have 1,000 images of both cats and dogs each. You are creating a supervised
    learning model where you train the model using 700 labelled cat data and 700 labelled
    dog data. You have kept 300 cat and dog images as test data ([Figure P1.9](#ch07.xhtml#f9)).
    Once the supervised machine learning model is created, we will make the model
    predict these test data and check the accuracy of the model created.


    ![Figure P1.8Sample – cat and dog labelled training data set.](html/images/9781032676654_C000_008.jpg)


    [Figure P1.8](#ch07.xhtml#f8b)Sample – cat and dog labelled training data set.


    ![Figure P1.9Sample test dataset with name as cat\_or \_dog\_1 and cat\_or \_dog\_2.](html/images/9781032676654_C000_009.jpg)


    [Figure P1.9](#ch07.xhtml#f9b)Sample test dataset with name as cat\_or \_dog\_1
    and cat\_or \_dog\_2.


    As we now understand what is there in the datasets, we shall proceed with the
    process.


    ![Figure P1.10The complete supervised learning process.](html/images/9781032676654_C000_010.jpg)


    [Figure P1.10](#ch07.xhtml#f10b)The complete supervised learning process.


    The complete supervised learning process is provided in [Figure P1.10](#ch07.xhtml#f10).
    In the supervised learning model, we work with labelled data, which is fed into
    the model for training, once the model is trained, test data is fed into the model
    to either classify or predict the test data. The accuracy of model prediction
    is usually calculated as an evaluation metric to understand the efficacy of the
    trained model.


    One major point to be noted here is that, if the model is trained using wrong
    labelled data, of course the model will predict in a wrong manner. Hence the training
    data fed to the model need to be appropriately labelled ones. Another scenario
    might be, if the model is not trained with a certain labelled data and if an entirely
    new data is given for prediction, the percentage of accuracy will be extremely
    low. This is quite understandable. If you have cats and dogs in the dataset and
    is given for training the model, and if you give the test set as crocodile, there
    is a higher chance that the trained model might not be able to predict or wrongly
    predict the data.


    The first [Figure P1.1](#ch07.xhtml#f1) of a teacher teaching a student about
    the apple is also an example of supervised learning. Maybe you should revisit
    that example once again to embed the concept well into your mind.


