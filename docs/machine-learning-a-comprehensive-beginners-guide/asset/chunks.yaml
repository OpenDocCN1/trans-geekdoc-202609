    # 第 8 章帕金森病检测特征工程与离群值分析概述


    ## 学习目标

    在阅读本章后，读者将能够：

    *   获取构建预测帕金森病模型的知识。

    *   了解特征工程、离群值分析、模型训练和比较。


    ## 8.1 引言

    在本章中，我们将研究如何将机器学习技术应用于帕金森病的诊断。读者可以从以下链接提取数据集：`www.kaggle.com/datasets/debasiscom/parkinson-disease`。帕金森病是一种神经退行性疾病，其特征是对运动功能的影响。我们能够利用相关的机器学习技术构建预测是否存在帕金森病的模型。


    读者将获得帕金森数据集的概述，并在课程期间获得特征工程、离群值分析、模型训练和比较的信息。


