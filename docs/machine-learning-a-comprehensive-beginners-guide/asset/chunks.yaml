    `sentiment` 列的独热编码表示。红色的弹出窗口表示我们的代码已执行。


    ## 20.4 模型构建、编译与训练


    我们使用 `keras` 创建了一个神经网络模型来分类文本。首先，嵌入层（embedding layer）将整数转换为向量，随后是能够学习长期依赖的 `LSTM`（长短期记忆）层。我们使用的是一个
    `sequential`（序列）模型。最后，输出层用于二分类。我们还使用 `Adam` 优化器对模型进行了编译。


    现在数据被分为训练集和测试集，如图 20.9 所示。


    ![图 20.9 模型创建。](img/9781032676654_C020_009.jpg)


    图 20.9 模型创建。


