    # Chapter 8Parkinson’s disease detectionAn overview with feature engineering and
    outlier analysis


    DOI: [10.1201/9781032676685-9](http://doi.org/10.1201/9781032676685-9)


    ## Learning objectives


    After reading this chapter, the reader shall be able to:


    *   Acquire the knowledge construct models to predict Parkinson’s disease.


    *   Gain information regarding feature engineering, outlier analysis, model training,
    evaluation, and comparison.


    ## 8.1 Introduction


    In this chapter, we will investigate how machine learning techniques can be applied
    to the diagnosis of Parkinson’s disease. Readers can extract the dataset from
    the following link: [www.kaggle.com/datasets/debasisdotcom/parkinson-disease-detection](http://www.kaggle.com).
    The neuro degenerative condition known as Parkinson’s disease is characterized
    by its effect on motor functioning. We are able to construct models that can predict
    the existence or absence of Parkinson’s disease by making use of techniques that
    are associated with machine learning. These models examine a number of variables
    retrieved from patient data. Readers will be given an overview of the Parkinson
    Detection dataset as well as information regarding feature engineering, outlier
    analysis, model training, evaluation, and comparison throughout the course of
    this chapter.


    ## 8.2 Importing libraries and dataset


    Importing the necessary libraries for data manipulation, visualization, and machine
    learning is the first step (see [Figure 8.1](#ch15.xhtml#f110)). For the purpose
    of data processing, the matplotlib and pandas libraries are loaded as pd. When
    attempting to visualize data, pyplot is notated as plt, and when attempting to
    enhance visualizations, seaborn is denoted as sns. We also import several modules
    from the sklearn library. These modules include train\_test\_split for the purpose
    of data splitting, StandardScaler and PolynomialFeatures for the purpose of data
    preprocessing, IsolationForest for the purpose of outlier analysis, LinearDiscriminantAnalysis
    for the purpose of performing LDA, LinearRegression for the purpose of linear
    regression, and DecisionTreeClassifier for the purpose of decision tree classification.
    In addition, we bring in the accuracy\_score variable so that we may assess how
    well our models are performing.


    ![Figure 8.1Importing the needed libraries.](html/images/9781032676654_C008_001.jpg)


    [Figure 8.1](#ch15.xhtml#f110b)Importing the needed libraries.


    Finally we use the pd.read\_csv function to load the dataset and we can see the
    first two rows from the dataset using the head(2) function as given in [Figure
    8.2](#ch15.xhtml#f111).'
