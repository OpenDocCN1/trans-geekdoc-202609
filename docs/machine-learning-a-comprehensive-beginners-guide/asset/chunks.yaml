    图 20.3 为了清晰起见。


    现在我们丢弃所有不需要的列，如“id”、“query”、“date”和“user_id”。然后，我们将 `sentiment` 列中存在的唯一值 `0` 和
    `4` 分别映射为 `Negative`（负）和 `Positive`（正），正如图 20.4 所示。


    ![图 20.4 删除不需要的列。](img/9781032676654_C020_004.jpg)


    图 20.4 删除不需要的列。


    ## 20.3 文本清洗与分词


    我们首先导入了文本清洗、填充和分词所需的库。如图 20.5 所示，还导入了正则表达式（`regex`）模块，这将允许我们进行文本操作。然后我们对文本进行清洗，移除
    URL、多个空格、话题标签（hashtags）等。


    ![图 20.5 用于文本清洗。](img/9781032676654_C020_005.jpg)


    图 20.5 用于文本清洗。


    绘制了直方图以寻找最大序列长度，如图 20.6 所示。`sequence_length` 变量将计算列表 `X` 中每个序列的长度。通过观察图表发现其在 `10.0`
    左右，因此我们可以将 `10` 分配为我们的 `maxlen`。


    ![图 20.6 直方图绘制。](img/9781032676654_C020_006.jpg)


    图 20.6 直方图绘制。


    通过声明 `tokenizer` 类来执行分词，如图 20.7 所示。`num_words` 指定了要分词的唯一单词的最大数量，而 `outside_limit_words`
    被标记为 `<00V>`。然后将文本转换为序列并进行填充以保持相同的长度。在这种情况下，根据之前提到的直方图图，序列被填充到 `10` 的最大长度。


    ![图 20.7 分词。](img/9781032676654_C020_007.jpg)


    图 20.7 分词。


    ![图 20.8 初始化 OneHotEncoder。](img/9781032676654_C020_008.jpg)


