    \n## Key points to remember\n\n1.  Machine learning is a branch of AI, which can\
    \ help a machine learn and act imitating intelligent human behavior.\n\n2.   AI\
    \ is the broader umbrella and machine learning and deep learning comes under them.\
    \ All of them are related to each other.\n\n3.  Machine learning algorithms are\
    \ categorized as supervised learning, unsupervised learning, and reinforcement\
    \ learning. Evolutionary learning algorithms make use of genetic algorithms.\n\
    \n4.  Supervised learning algorithms use labelled data set. They have a training\
    \ phase to model and a testing phase to predict or classify the data. This is\
    \ a classification problem.\n\n5.   Unsupervised learning algorithms don’t use\
    \ labelled data; they categorize data into groups or clusters. This is a clustering\
    \ algorithm.\n\n6.  Reinforcement learning gets feedback from the environment\
    \ using computer agents and action and best utilize the parameters for optimal\
    \ rewards.\n\n7.  Machine learning can perform adaptive learning, to bring in\
    \ the best accuracy to the process, can take the feedback and make the process\
    \ less error prone, and use them for recurrent tasks.\n\n8.  Machine learning\
    \ framework mainly includes the following steps: data collection, data analysis,\
    \ model building, testing the model, visualization, and results interpretation.\n\
    \n9.  Machine learning uses ML algorithms to predict or classify the data whereas\
    \ DL uses neural networks and its hidden layers to provide the output, which makes\
    \ it a bit hard to understand and find the inferences.\n\n10.  Machine learning\
    \ has many applications in various sectors like retail, agriculture, finance,\
    \ healthcare, education, energy, government etc., apart from these FB recommending\
    \ you friends, Amazon and Flipkart recommending you the products, Netflix movie\
    \ recommendations etc.\n\n# Chapter 1Exploring the Iris dataset\n\nDOI: [10.1201/9781032676685-2](http://doi.org/10.1201/9781032676685-2)\n\
    \n## Learning objectives\n\nBy the end of this chapter, the reader should be able\
    \ to:\n\n*   Obtain hands-on experience with machine learning (ML) techniques.\n\
    \n*   Build an understanding of how to tackle comparable tasks and improve their\
    \ knowledge of certain algorithms.\n\n*   Learn the essentials of working with\
    \ a dataset, including how to load a dataset and examine its structure, as well\
    \ as how to visualize the data patterns and relationships.\n\n*   Develop a strong\
    \ basis in exploring ML projects and understand the benefits and drawbacks of\
    \ various algorithms.\n\n## 1.1 Introduction\n\nIn this chapter, we will set out\
    \ on an adventure to investigate the Iris dataset and gain some understanding\
    \ in the field of machine learning (ML). We will be able to classify Iris blooms\
    \ using a variety of ML methods after doing analysis on this well-known dataset.\
    \ This will allow us to understand the structure of the dataset, perform visualizations,\
    \ and more.\n\nThe dataset is openly available in Kaggle datasets and readers\
    \ can access it through this link: [www.kaggle.com/datasets/uciml/iris](http://www.kaggle.com)\n\
    \n## 1.1 The beginning\n\nTo get started, let us proceed by loading the Iris data\
    \ set as well as importing the required libraries.\n\nIn the code fragment snippet\
    \ shown in [Figure 1.1](#ch08.xhtml#f27), the NumPy, Pandas, Seaborn, and Matplotlib\
    \ libraries are imported. Additionally, we import the dataset Iris to a Pandas\
    \ DataFrame titled “iris.”\n\n![Figure 1.1Loading the dataset and importing the\
    \ libraries.](html/images/9781032676654_C001_001.jpg)\n\n[Figure 1.1](#ch08.xhtml#f27b)Loading\
    \ the dataset and importing the libraries.\n\n## 1.2 Examining the data\n\nLet\
    \ us investigate the structure of the Iris dataset in order to obtain some understanding\
    \ of the data now that has been loaded.\n\nWe are able to retrieve information\
    \ regarding the dataset by utilizing the *info()* method, including the data types\
    \ and the amount of values that are not null contained within each column. With\
    \ the *head()* method, we are able to investigate the initial five rows of the\
    \ dataset (see [Figure 1.2](#ch08.xhtml#f28)).\n\n![Figure 1.2Retrieving information\
    \ from the dataset.](html/images/9781032676654_C001_002.jpg)\n\n[Figure 1.2](#ch08.xhtml#f28b)Retrieving\
    \ information from the dataset.\n\n## 1.3 Dataset visualization\n\nWhen it comes\
    \ to comprehending data patterns and relationships, visualizations are of critical\
    \ importance. Let us make some visuals in order to obtain some understanding of\
    \ the Iris dataset.\n\nThe first type of representation is a boxplot, and it shows\
    \ how the Sepal and Petal lengths of the flowers are distributed across the sample\
    \ ([Figure 1.3](#ch08.xhtml#f29)). It gives information about the range, median,\
    \ and possible anomalies or outliers in the dataset. The second type of representation\
    \ is a histogram, which illustrates the distribution of the different species\
    \ of Iris ([Figure 1.4](#ch08.xhtml#f30)). We improve the histogram’s overall\
