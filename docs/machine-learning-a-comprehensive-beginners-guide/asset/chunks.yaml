    逻辑回归（Logistic Regression）算法是二分类项目中的常用选择。首先，创建一个逻辑回归的新实例，然后使用提供的训练数据对其进行训练。之后，我们通过计算其准确率来确定训练后模型在测试数据上的性能（参见图
    3.9）。


    ![图 3.9 应用逻辑回归算法。](img/9781032676654_C003_009.jpg)


    图 3.9 应用逻辑回归算法。


    ## 3.5 高斯朴素贝叶斯


    一种经常用于分类任务的概率方法是高斯朴素贝叶斯分类。首先，构建一个 `GaussianNB` 模型的新实例，然后使用训练数据对其进行教育。之后，我们计算训练后模型在测试数据上的性能，并查看其准确性如何（参见图
    3.10）。


    ![图 3.10 应用高斯朴素贝叶斯算法。](img/9781032676654_C003_010.jpg)


    图 3.10 应用高斯朴素贝叶斯算法。


    ## 3.6 决策树分类器


    决策树分类器是一种灵活的方法，可以处理分类以及回归工作。它根据其所基于的决策树命名。我们首先生成一个决策树分类器模型的新实例，然后使用提供的训练数据对其进行训练。之后，我们使用图
    3.11 中提供的代码，根据测试数据确定训练后模型的准确率。模型比较展示在图 3.12 中。


    ![图 3.11 应用决策树分类器算法。](img/9781032676654_C003_011.jpg)


    图 3.11 应用决策树分类器算法。


    ## 3.7 模型比较


    我们使用 `matplotlib` 库构建条形图，以评估和对比各种模型的准确率。我们可以根据准确率确定哪种模型在预测水饮用性方面最好。


    ![图 3.12 模型比较。](img/9781032676654_C003_012.jpg)


