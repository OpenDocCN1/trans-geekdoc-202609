- raw: 'This approach is different from the supervised learning model, as they don’t
    have any labels associated with the data. Also, there is no explicit training
    and testing phases in the unsupervised learning method. Oh, is this not confusing?
    Then how will the model be able to predict. Yes, there is a way, and we could
    understand that by using athe simple example that follows.


    Consider a student is given a dataset with set of dogs and cats, with absolutely
    no label ([Figure P1.11](#ch07.xhtml#f11)). Every day this dataset is given to
    the student and after a week the student is asked to categorize the similar images
    in the dataset. What do you think the student will do? The student has been going
    through the different types of images given for a week. The student would have
    been smart enough to identify the features of both the cat and dog images. By
    the end of the week, if different set of images are given, obviously with the
    collective knowledge he has gathered through the process of mapping the features
    of dog and cat, the student will at least to some extent map or group the cat
    and dog images properly. Yes, there are some cutie dogs which resemble dogs, we
    can’t help it though, and hence there may be some misclassifications too ([Figure
    P1.11](#ch07.xhtml#f11)).


    ![Figure P1.11Unsupervised learning process.](html/images/9781032676654_C000_011.jpg)


    [Figure P1.11](#ch07.xhtml#f11b)Unsupervised learning process.


    Given a set of data, it will categorize them and give as output. Each category
    is referred as a cluster. The labels for the clusters are to be manually tagged
    later. The categorization is based on the features in the data points. The unsupervised
    learning algorithms are also referred as clustering algorithms. Consider the same
    use case discussed for supervised learning with apple and tomato. Here the model
    will take in all images and gives out two clusters. One cluster will be “apple”
    whereas another cluster will have all the photos of “tomato.” When a new image
    is given to the model it will be placed in one of the two clusters based on its
    features.


    ## P1.7 Reinforcement learning algorithm


    Reinforcement learning algorithm is a machine learning algorithm, which uses the
    computer agent to learn the optimal behavior of the environment and ought to take
    the right actions to acquire maximum reward. This is mainly about the decision-making
    process for which the feedback obtained is very crucial. This is a feedback-based
    learning process. This method of learning is used in most of the robots and computer-based
    games. Here the input need not have labelled data. Instead, the model learns by
    interacting with the environment and getting feedback from it. The first time
    the model picks a decision, based on the feedback the model learns if its decision
    is right or wrong. So, this supervised learning relaxes the task of giving completely
    labelled data for training. A very common example is a computer chess game; if
    the computer loses while playing with you, then the program will remember all
    the steps that the player made, and the system made. Next time, the same strategy
    won’t work in the system and eventually the player will lose to the program.


    Oh, does all this seem to be Greek and Latin? Don’t worry, we’ll use an example
    to help you understand the process.


    Let’s take a simple example for reinforcement learning. Consider a mom teaching
    her kid and when he makes mistake, mom gives feedback so that the feedback could
    be helpful for him the very next time ([Figure P1.12](#ch07.xhtml#f12)).


    ![Figure P1.12Reinforcement learning.](html/images/9781032676654_C000_012.jpg)


    [Figure P1.12](#ch07.xhtml#f12b)Reinforcement learning.


    ## P1.8 Evolutionary approach


    This is still evolving and is not an easy one. These types of algorithms shall
    imitate the natural evolution to solve a particular problem. For instance, genetic
    algorithms can be employed to solve a problem. This is beyond the scope of this
    book and hence is ignored for now.


    ## P1.9 So why do we need ML?


    This is a wonderful question, at the right time. Yes, by this time, it is obvious
    that we use our own experience to learn things. Say, for a simple example, going
    back to childhood. Yes, childhood is a treasure full of experiences, right? So
    let’s use another example…


    Do you ever remember the very first time your hand got hurt touching a hot vessel
    in the kitchen? It’s likely that unless it was a big one, no one usually even
    remembers that instance? However, now you are old, do you still need somebody’s
    assistance to understand whether a vessel is hot, and when you shouldn’t touch
    it? Here you could understand the experiential learning. Maybe when you were a
    kid, you would have touched a hot pot and instantly you would have got the impulse.
    That feedback stays in your collective memory and whenever you see a pot, you
    just take a precaution to work out whether it is hot or not.


    Yes, we humans have the intelligence to do all these things. But we cannot reach
    everywhere and do this sort of things always. But we do have the intelligence
    to program a machine to follow our orders. This is exactly what we are trying
    to do in machine learning. Yes, so why do we do all these? The reason is this
    will make our lives easy. If we can build an interactive and self-adaptive learning
    algorithm for a machine and if we could train the machine in the way we need to
    achieve things, there is nothing like it. However, everything has its own flaws
    coming along. As humans, first, we should know where to limit the usage of machines
    and to what extent. Anything and everything could be trained for negative intention
    too.


    Where humans cannot bring the accuracy, yes, machines could bring this. So, making
    the machines work using human intelligence is a good strategy. Machines with ML
    algorithms don’t require explicit human intervention as mentioned earlier and
    machines can always adapt to their environments and learn from feedback and avoid
    repeated mistakes.


    ## P1.10 Machine learning framework


    A Machine learning framework has various steps which uses math, tools, and techniques.
    The first step is all about data gathering from the alternative relevant sources.
    It all starts from data, as data acts as the fuel for the whole process. The next
    step is basically data cleansing or an extensive exploratory data analysis step
    where we need to clean and understand the data as much as possible, as this will
    help further processes to be smooth, easy, and inferential. Building the appropriate
    model is the next one in the process. Training and testing need to be done. The
    most important part is understanding the patterns from the results and interpreting
    the right inferences for the betterment of the whole process itself. Visualization
    techniques could be of great help to understand the hidden golden nuggets of information
    from the results. This concludes the flow of ML framework. However, as a picture
    can speak a thousand words, let’s depict the whole process flow as a simple diagrammatic
    representation ([Figure P1.13](#ch07.xhtml#f13)).


    ![Figure P1.13Machine Learning Framework.](html/images/9781032676654_C000_013.jpg)


    [Figure P1.13](#ch07.xhtml#f13b)Machine Learning Framework.


    ## P1.11 Machine learning vs. deep learning


    Yes, now we have been talking about the machine learning algorithms, its types,
    framework etc. Now it is time to dive a little bit deeper and understand the major
    differences between ML and DL algorithms. The difference in their process flow
    can be better understood from [Figure P1.14](#ch07.xhtml#f14) and [Table P1.1](#ch07.xhtml#t1)
    differentiates the two.


    ![Figure P1.14Difference in process flow with ML and DL.](html/images/9781032676654_C000_014.jpg)


    [Figure P1.14](#ch07.xhtml#f14b)Difference in process flow with ML and DL.


    [Table P1.1](#ch07.xhtml#t1b) ML vs. DL


    | Machine Learning || Deep Learning |


    | --- | --- |'
