    # Chapter 18Smart healthcareMachine learning approaches for kidney disease prediction
    with oneAPI


    DOI: [10.1201/9781032676685-19](http://doi.org/10.1201/9781032676685-19)


    ## Learning Objectives


    After reading this chapter, the reader shall be able to:


    *   Acquire the knowledge to classify kidney disease through machine learning
    techniques.


    *   Utilize diverse machine learning algorithms to accomplish enhanced diagnostic
    accuracy.


    ## 18.1 Introduction


    The term “chronic kidney disease” refers to a disorder that affects a significant
    portion of the population and is defined by a steady loss of kidney function.
    It is essential to an effective management strategy to detect CKD in its earlier
    stages when it is still treatable. The Kaggle Chronic Kidney Disease dataset with
    the link given is used throughout this chapter as a basis for our classification
    of CKD using the capabilities of the machine learning: [www.kaggle.com/datasets/mansoordaku/ckdisease](http://www.kaggle.com).
    We hope to make a substantial contribution to the area of healthcare by greatly
    improving the diagnostic accuracy of chronic kidney disease (CKD) through the
    application of cutting-edge algorithms and data preparation strategies.


    ## 18.2 Data preprocessing and splitting


    We first import the necessary libraries for data visualization, data manipulation,
    and model building. The red colored pop-up, as shown in [Figure 18.1](#ch25.xhtml#f234),
    tells us the whole code is optimized with oneAPI.


    ![Figure 18.1Importing the required libraries.](html/images/9781032676654_C018_001.jpg)


    [Figure 18.1](#ch25.xhtml#f234b)Importing the required libraries.


    We then import our dataset into the kernel and store it in a variable called data,
    and look at the first five rows of our imported dataset. It is clear from the
    inference that we have a mix of both numeric and categorical values, which will
    be taken care of in the further steps (see [Figure 18.2](#ch25.xhtml#f235)). We
    can also notice the presence of NaN (Not A Number) values (Chandradas, A., 2021)
    in some columns and the column ID seems irrelevant for finding our target variable.
    The Classification column is our target column.


    ![Figure 18.2To import the dataset.](html/images/9781032676654_C018_002.jpg)


    [Figure 18.2](#ch25.xhtml#f235b)To import the dataset.


    As discussed in the previous step, we will drop the ID column from our dataset
    using the drop function. Then we see the short summary of our data frame using
    the info() function as seen in [Figure 18.3](#ch25.xhtml#f236).


    ![Figure 18.3Using drop and info function.](html/images/9781032676654_C018_003.jpg)


    [Figure 18.3](#ch25.xhtml#f236b)Using drop and info function.


    We look at the unique values in each column of our dataset using the unique()
    function as shown in [Figure 18.4](#ch25.xhtml#f237). We check for mis-entered
    values in our dataset. Here we can see 43 is mistyped as “\\t43.” We manually
    check and change all the values in the next step.


    ![Figure 18.4Using unique function.](html/images/9781032676654_C018_004.jpg)


    [Figure 18.4](#ch25.xhtml#f237b)Using unique function.


    We use the replace() function and manually map the correct variables to the corresponding
    mistyped wrong variables which are found in the previous step. The replaced dataset
    is again stored in a duplicate variable called data (see [Figure 18.5](#ch25.xhtml#f238)).


    ![Figure 18.5Using replace function.](html/images/9781032676654_C018_005.jpg)


    [Figure 18.5](#ch25.xhtml#f238b)Using replace function.


    In the first step, upon looking at our dataset initially we find some missing
    values. We use the isnull().sum() command to look at the null values in our dataset
    and yes, we have missing values in almost all the columns (see [Figure 18.6](#ch25.xhtml#f239)).


    ![Figure 18.6To find the missing values.](html/images/9781032676654_C018_006.jpg)


    [Figure 18.6](#ch25.xhtml#f239b)To find the missing values.


    In this step, we create two variables num\_cols where we store all the columns
    with numeric values and cat\_cols with categorical columns. All these columns
    have some amount of missing values, which we will be replacing with two different
    methods. For the numeric columns we use the mean() method; that is, we calculate
    the mean value of a particular column and fill all the null values in the column.
    Similarly for the categorical column we use the backfill method in which we fill
    each of the null values with the next valid value in the column. See [Figure 18.7](#ch25.xhtml#f240)
    for the code snippet.


    ![Figure 18.7To replace the missing values.](html/images/9781032676654_C018_007.jpg)


    [Figure 18.7](#ch25.xhtml#f240b)To replace the missing values.


    After filling the null values as in [Figure 18.8](#ch25.xhtml#f241), we again
    look at the result.


    ![Figure 18.8Replacing the missing values.](html/images/9781032676654_C018_008.jpg)


    [Figure 18.8](#ch25.xhtml#f241b)Replacing the missing values.


    Let us first encode the categorical variables present in our dataset to numeric
    using the LabelEncoder method as shown in [Figure 18.9](#ch25.xhtml#f242). A variable
    cat\_cols is created in which a list containing the names of all categorical columns
    from our dataset is stored. Then, using the label encoder method, each column
    is converted to numerical values making it suitable for machine learning algorithms.


    ![Figure 18.9Using LabelEncoder method.](html/images/9781032676654_C018_009.jpg)


    [Figure 18.9](#ch25.xhtml#f242b)Using LabelEncoder method.


    Our dataset contains only numerical values now after encoding all the categorical
    columns and all the null values have been filled. The same can be seen in [Figure
    18.10](#ch25.xhtml#f243).


    ![Figure 18.10Dataset after encoding.](html/images/9781032676654_C018_010.jpg)


    [Figure 18.10](#ch25.xhtml#f243b)Dataset after encoding.


    ## 18.3 Modeling


    Then we import the necessary libraries as represented in [Figure 18.11](#ch25.xhtml#f244)
    to create our models. For splitting the data into training and testing sets we
    first create two variables, X and y. In the variable X, we store all the features
    by dropping the target column classification. In y we store only the classification
    column. Then we split our data into a Training and testing set which is 80% and
    20% respectively.


    ![Figure 18.11Importing necessary libraries.](html/images/9781032676654_C018_011.jpg)


    [Figure 18.11](#ch25.xhtml#f244b)Importing necessary libraries.


    The logistic regression (LR) classifier is initialized first as seen from [Figure
    18.12](#ch25.xhtml#f245). Then we fit our training data to train our initialized
    logistic regression model. The predict function is used to make predictions on
    the test data.


    ![Figure 18.12Initializing LR Classifier.](html/images/9781032676654_C018_012.jpg)'
