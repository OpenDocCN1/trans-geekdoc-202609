    ## Learning objectives


    After completing this chapter, the reader shall be able to:


    *   Acquire essential knowledge into the method of hyperparameter tuning as well
    as how it may dramatically increase the accuracy and efficacy of machine learning
    models.


    *   Understand the significance of hyperparameter tuning and to implement it into
    K-Nearest Neighbors (KNN), Multilayer Perceptron (MLP), and Random Forest (RF)
    models.


    ## 6.1 Introduction


    In this chapter, we will look into the interesting area of drug identification
    and classification and investigate the methodologies of hyperparameter tuning
    in order to improve the overall performance of our models. The idea of hyperparameters,
    as well as the critical part they play in the optimization of models, will be
    presented here. In addition, we will investigate the capabilities of GridSearchCV,
    which is a potent application that helps automate the process of determining the
    optimal values for hyperparameters by conducting an exhaustive search across the
    parameter space. The implementation in K-Nearest Neighbors (KNN), Multilayer Perceptron
    (MLP), and Random Forest (RF) models through the use of practical examples and
    the development of code is provided. This chapter’s goal is to provide you with
    the information and skills required to optimize the models and reveal the full
    potential that they possess.


    ## 6.2 Data preprocessing and splitting


    Let’s begin by importing the necessary libraries for our job. We import the pandas
    library for data manipulation, the train\_test\_split function from scikit-learn
    for splitting the dataset, the StandardScaler function from scikit-learn for feature
    scaling, KNeighborsClassifier, MLPClassifier, and RandomForestClassifier for the
    respective models, GridSearchCV to provide hyperparameter tuning, and different
    metrics from scikit-learn for model evaluation. In addition, we bring in the matplotlib.pyplot
    library so that we can visualize the data. See [Figure 6.1](#ch13.xhtml#f87).


    ![Figure 6.1Code snippet for importing the needed libraries.](html/images/9781032676654_C006_001.jpg)


    [Figure 6.1](#ch13.xhtml#f87b)Code snippet for importing the needed libraries.


    We import the drug categorization dataset via a CSV file by utilizing the read\_csv
    function that is available in pandas, and then we save it to the variable known
    as data, as seen in [Figure 6.2](#ch13.xhtml#f88).


    ![Figure 6.2Code snippet for loading the dataset.](html/images/9781032676654_C006_002.jpg)


    [Figure 6.2](#ch13.xhtml#f88b)Code snippet for loading the dataset.


    We use the head() function to look at the first five rows from the data frame
    to get some basic inference on the data. Something to notice here is columns “Sex,”
    “BP,” and “Cholesterol” contains categorical variables. We can see our data frame
    has six columns and Drug is our target column. Next we check for the null values
    – we don’t have any missing values in our dataset. See [Figure 6.3](#ch13.xhtml#f89).


    ![Figure 6.3Getting inference on the data.](html/images/9781032676654_C006_003.jpg)


    [Figure 6.3](#ch13.xhtml#f89b)Getting inference on the data.


    In the first step of our data analysis, called preprocessing as seen in [Figure
    6.4](#ch13.xhtml#f90), we transform categorical variables into numbers and then
    normalize the numerical features. We execute one-hot encoding on the categorical
    values present in our dataset such as “Sex,” “BP,” and “Cholesterol” by utilizing
    the function get\_dummies that is available in the pandas library. This gives
    them a corresponding representation in numerical form.


    ![Figure 6.4Code snippet for Data preprocessing.](html/images/9781032676654_C006_004.jpg)


    [Figure 6.4](#ch13.xhtml#f90b)Code snippet for Data preprocessing.


    In order to train the model, we first separate the preprocessed data into its
    features (X) and then into its target variable (y) as given in [Figure 6.5](#ch13.xhtml#f91).
    We give the preprocessed features (every column other than “Drug”) to the variable
    “X,” and we give the target parameter (“Drug”) to the constant “y.”


    ![Figure 6.5Code snippet for splitting the data.](html/images/9781032676654_C006_005.jpg)


    [Figure 6.5](#ch13.xhtml#f91b)Code snippet for splitting the data.


    When dividing the data into training and testing sets, we make use of the train\_test\_split
    function that is included in the scikit-learn package. The “test\_size” argument
    allows the user to specify the percentage of the dataset that will be utilized
    for testing, and the “random\_state” parameter assures that the random seed will
    always be the same, which ensures repeatability. See [Figure 6.6](#ch13.xhtml#f92).


    ![Figure 6.6Code snippet for data separation.](html/images/9781032676654_C006_006.jpg)


    [Figure 6.6](#ch13.xhtml#f92b)Code snippet for data separation.


