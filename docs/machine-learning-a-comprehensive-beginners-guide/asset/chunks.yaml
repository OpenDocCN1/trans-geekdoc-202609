    ## 13.1 引言


    本章的主要目标是向读者演示如何通过开发深度学习模型来解决图像分类问题。医疗图像分类是医疗领域的关键部分。如果能对疾病进行识别和分类，就可以进行更好的诊断和治疗。这将拯救生命，特别是在早期发现脑癌时。该项目使用一组脑肿瘤
    MRI 图片作为其数据集。它包含了不同类型肿瘤的图片以及没有肿瘤的图片。该集合为我们训练和测试机器学习模型提供了一种很好的方法。此任务使用了来自 Kaggle
    [www.kaggle.com/datasets/sartajbhuvaji/brain-tumor-classification-mri](http://www.kaggle.com)
    的数据集集。对于这项分类工作，我们使用了`VGG16`和`ResNet50`，它们都是著名的架构。模型将被教如何将 MRI 图片分为四个不同的组：`glioma_tumor`（胶质瘤）、`meningioma_tumor`（脑膜瘤）、`no_tumor`（无肿瘤）和`pituitary_tumor`（垂体瘤）。


    ## 13.2 数据预处理


    我们从导入分类任务所需的库开始。该模块将为我们提供与文件路径、字典等交互的方法。导入`numpy`处理数值运算，`matplotlib`用于可视化和绘图。然后我们导入了`tensorflow`模块，它允许我们训练神经网络。接着是来自`keras`的两个预训练模型`VGG16`和`ResNet50`。`Sequential`是一个通过逐层构建
    DNN 模型的 API。`GlobalAveragePooling2D`和`Dense`是层，而`Dropout`用于防止过拟合。所有内容可在图 13.1
    中看到。


    ![图 13.1 导入必要的库。](img/9781032676654_C013_001.jpg)


    图 13.1 导入必要的库。


    然后我们安装`opendasets`命令来下载公开的数据集。之后我们可以从网上获取数据集（参见图 13.2）。


    ![图 13.2 收集数据集的代码片段。](img/9781032676654_C013_002.jpg)


    图 13.2 收集数据集的代码片段。


    然后我们导入`opendasets`库作为`od`。我们使用来自 aggle 的链接下载脑肿瘤分类。在这一步骤之前，确保你下载了 Kaggle 的凭据。必要的步骤在图
    13.3 中提供。


    ![图 13.3 导入库。](img/9781032676654_C013_003.jpg)


    图 13.3 导入库。


    声明了两个不同的变量`data_dir`和`classes`，其中`data_dir`包含训练数据的路径，`classes`包含图像分类任务的标签列表。此处的代码片段见图
    13.4。


    ![图 13.4 定义路径的代码片段。](img/9781032676654_C013_004.jpg)


    图 13.4 定义路径的代码片段。


    我们从脑肿瘤类别的测试图片中生成可视化显示，如图 13.5 所示。


    ![图 13.5 测试图片的可视化显示。](img/9781032676654_C013_005.jpg)


    图 13.5 测试图片的可视化显示。


    在这一步中，我们为训练模型设置了两个超参数：`batch_size`和`epochs`。相同的见图 13.6。`batch_size`定义了在训练阶段在前向和反向传播期间使用的样本数量。`epochs`定义了更新模型权重的次数。我们必须注意，大量的
    epochs 会导致过拟合。同样，训练次数会导致欠拟合。


    ![图 13.6 设置超参数。](img/9781032676654_C013_006.jpg)


    图 13.6 设置超参数。


    我们使用`ImageDataGenerator`类来清理和添加数据，并为训练集和验证集制作两个数据生产者。`ImageDataGenerator`以缩放、旋转等不同方式更改图像以增加我们集合的多样性。`flow_from_directory`用于为训练集制作`train_generator`。它在`data_dir`目录下查找所有训练图片。目标图片的大小设置为`(224,
    224)`，这与`VGG16`和`ResNet50`等模型的输入尺寸相同。`class_mode`设置为`categorical`是因为我们有多个类别。根据`validation_split`参数，通过将参数设置为`training`来选择数据的训练部分。我们制作了与`train_generator`设置相同的验证数据生成器。代码片段参阅图
    13.7。


    ![图 13.7 数据预处理与增强。](img/9781032676654_C013_007.jpg)


    图 13.7 数据预处理与增强。


    ## 13.3 建模


    我们继续创建一个基于`VGG16`的神经网络模型，如图 13.8 所示。我们通过设置权重进行初始化，排除输出层并指定与输入图像匹配的输入形状，然后按顺序堆叠所有层。最后，我们编译模型。


    ![图 13.8 创建一个 VGG16 模型。](img/9781032676654_C013_008.jpg)


    图 13.8 创建一个 VGG16 模型。


    按照之前的相同步骤，`ResNet50`（Mukti and Biswas, 2019）模型也按照图 13.9 提供的过程进行初始化。


    ![图 13.9 创建一个 ResNet50 模型。](img/9781032676654_C013_009.jpg)


    图 13.9 创建一个 ResNet50 模型。


    通过调用`fit`方法，我们开始训练`VGG16`模型（Qassim et al., 2018）。如图 13.10 所示，该代码将使用训练数据生成器训练模型，并使用验证数据生成器验证模型
    20 个 epochs。

