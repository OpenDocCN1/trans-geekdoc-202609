    ## 12.1 Introduction


    This chapter addresses the challenges faced on crop recommendation through an
    ensemble learning method. We predict the best suitable crop for a given set of
    soil and environmental properties. The dataset can be accessed using this link:
    [www.kaggle.com/datasets/atharvaingle/crop-recommendation-dataset](http://www.kaggle.com).
    This project lays the path for the next phase of precision farming, where technology
    meets cultivation to alter the way crops are picked and cultivated for maximum
    yields and ecological harmony. This research does this by integrating data analysis,
    preprocessing, and predictive modeling.


    ## 12.2 Data preprocessing


    Importing the necessary libraries makes it easier to manipulate data, visualize
    it, develop models, and assess them.


    Pandas, numpy, matplotlib for visualization, and numerous classifiers from scikit-Learn
    are some of these packages (see [Figure 12.1](#ch19.xhtml#f160)).


    ![Figure 12.1Code snippet to import necessary libraries.](html/images/9781032676654_C012_001.jpg)


    [Figure 12.1](#ch19.xhtml#f160b)Code snippet to import necessary libraries.


    We then use the pd.read\_csv as seen in [Figure 12.2](#ch19.xhtml#f161) to load
    the dataset to a variable data.


    ![Figure 12.2Code snippet to load the dataset.](html/images/9781032676654_C012_002.jpg)


    [Figure 12.2](#ch19.xhtml#f161b)Code snippet to load the dataset.


    After loading our dataset we use the head() function as illustrated in [Figure
    12.3](#ch19.xhtml#f162) from the pandas library. This function will print the
    first five rows from our dataset. We get a clear initial idea about our dataset
    after this step. We have eight columns in our dataset and label is our target
    column; the label column has to be encoded since it has string values.


    ![Figure 12.3Using head() function.](html/images/9781032676654_C012_003.jpg)


    [Figure 12.3](#ch19.xhtml#f162b)Using head() function.


    To find out the number of missing or null values in each column of our dataset
    we use the isnull().sum() function to count the null values. In our dataset we
    don’t have any missing values (see [Figure 12.4](#ch19.xhtml#f163)).


    ![Figure 12.4To find missing values in the dataset.](html/images/9781032676654_C012_004.jpg)


    [Figure 12.4](#ch19.xhtml#f163b)To find missing values in the dataset.


    Previously we found there is a need to encode the label column. We use the LabelEncoder
    ([https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.LabelEncoder.html](https://scikit-learn.org))
    as in [Figure 12.5](#ch19.xhtml#f164) from scikit-learn for this task. The method
    uses unique numerical values to convert the categorical columns to numeric. The
    resulting dataset is stored in a variable named “label\_encoded.” We then create
    two variables, X and y. In X we store all the features and drop the target variable
    and in y we store only the target variable.


    ![Figure 12.5Encoding the label column.](html/images/9781032676654_C012_005.jpg)


    [Figure 12.5](#ch19.xhtml#f164b)Encoding the label column.


    ## 12.3 Data splitting


    As we have already separated our dataset to X and y in the previous step, now
    we split the dataset into training and testing sets using the train\_test\_split
    function from scikit-learn. As discussed, X and y contain feature matrix and target
    vector respectively. The test size is 20% and train size is 80% as denoted in
    [Figure 12.6](#ch19.xhtml#f165). The random state sets the seed for reproducibility.


    ![Figure 12.6Code snippet to split the dataset.](html/images/9781032676654_C012_006.jpg)


    [Figure 12.6](#ch19.xhtml#f165b)Code snippet to split the dataset.


    ## 12.4 Initialize base classifiers and bagging models


    For modeling we have used the bootstrap aggregating method also known as bagging,
    which is an ensemble learning technique to boost accuracy and performance of our
    models. This is achieved by combining the predictions of multiple base models
    to make the overall prediction more accurate.


    The base classifiers used are KNN, SVC and Logistic regression models which will
    act as weak learner for the bagging ensemble. The n\_estimators specify the number
    of base classifiers. This will allow the models to learn finding the optimized
    solution and diverse errors enhancing overall performance. Refer to [Figure 12.7](#ch19.xhtml#f166)
    for the code snippet.


    ![Figure 12.7Code snippet to initialize base classifiers.](html/images/9781032676654_C012_007.jpg)


    [Figure 12.7](#ch19.xhtml#f166b)Code snippet to initialize base classifiers.


