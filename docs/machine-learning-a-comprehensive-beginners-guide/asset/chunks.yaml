    ## 20.4 Model building, compilation, and training


    A Neural network model is then created using keras for classifying the texts.
    We use a sequential model that has a linear stack of layers. First, an embedding
    layer is used to convert integers into dense vectors, followed by an LSTM (Long
    Short-Term Memory) layer capable of learning long-term dependencies. Finally,
    the output layer for binary classification is used. The model is then compiled
    with Adam optimizer.


    The data is now split into training and testing sets as seen in [Figure 20.9](#ch27.xhtml#f270)
    and is fitted for training.


    ![Figure 20.9Model creation.](html/images/9781032676654_C020_009.jpg)


