    被命名为 `plt`，在增强可视化效果时，`seaborn` 被命名为 `sns`。我们还从 `sklearn` 库导入了多个模块。这些模块包括用于数据划分的
    `train_test_split`、用于数据预处理的 `StandardScaler` 和 `PolynomialFeatures`、用于离群值分析的 `IsolationForest`、用于执行
    LDA 的 `LinearDiscriminantAnalysis`、用于线性回归的 `LinearRegression` 以及用于决策树分类的 `DecisionTreeClassifier`。此外，我们引入了
    `accuracy_score` 变量，以便我们评估模型的运行性能。


