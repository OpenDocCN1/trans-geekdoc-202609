    ## 13.1 Introduction


    The main goal of this chapter is to demonstrate to the readers how to solve an
    image classification problem through the development of deep learning models.
    Medical image classification is a key part of the healthcare field. Diseases can
    be better diagnosed and treated if they are identified and put into categories.
    This will save lives, especially when brain cancers are found early. This project
    uses a set of MRI pictures of brain tumors as its dataset. It has pictures of
    different kinds of tumors and pictures that don’t have tumors. This collection
    gives us a great way to train and test our machine learning models. The dataset
    from Kaggle at [www.kaggle.com/datasets/sartajbhuvaji/brain-tumor-classification-mri](http://www.kaggle.com)
    is used for this task. For this classification job, we use VGG16 and ResNet50,
    which are both well-known architectures. The models will be taught to put MRI
    pictures into four different groups: “glioma\_tumor,” “meningioma\_tumor,” “no\_tumor,”
    and “pituitary\_tumor.”


    ## 13.2 Data preprocessing


    We start by importing the necessary libraries for our classification task. The
    module will give us a way to interact with file paths, dictionaries, etc. numpy
    is imported to handle numerical operations, and matplotlib is used for visualizations
    and plots. Then we import the tensorflow module, which allows us to train the
    neural network frameworks. Followed by two of the pretrained models, VGG16 and
    ResNet50 from keras. Sequential is an API for building DNN models layer by layer.
    GlobalAveragePooling2D and Dense are the layers, and Dropout is to prevent overfitting.
    All can be seen in [Figure 13.1](#ch20.xhtml#f170).


