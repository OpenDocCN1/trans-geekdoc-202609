- raw: 'The column in question is removed from the DataFrame by utilizing the *drop()*
    function, which can be seen in action in the following line of code. Providing
    it as the initial value causes the “Id” column to be removed from the result.
    When the *axis=1* parameter is used, it indicates that the action should be carried
    out in a column-wise fashion. In the end, the *inplace=True* parameter is provided
    to guarantee that the modifications will be reflected in the initial DataFrame
    (See [Figure 1.5](#ch08.xhtml#f31)).


    ![Figure 1.5Column removal.](html/images/9781032676654_C001_005.jpg)


    [Figure 1.5](#ch08.xhtml#f31b)Column removal.


    When this piece of code as in [Figure 1.5](#ch08.xhtml#f31) is executed, the “Id”
    field will be properly removed from the Iris dataset. This will ensure that our
    modeling and analysis tasks do not contain any superfluous information.


    Use this code in order to import the essential machine learning components from
    scikit-learn.


    The following packages and classes are brought in via import within this chunk
    of code as provided in [Figure 1.6](#ch08.xhtml#f32).


    ![Figure 1.6Code snippet to import ML components.](html/images/9781032676654_C001_006.jpg)


    [Figure 1.6](#ch08.xhtml#f32b)Code snippet to import ML components.


    *   *LogisticRegression* is derived from sklearn.linear\_model and is a classification
    approach that is quite popular. This type offers functionality for logistic regression.


    *   *train\_test\_split* is a function that is derived from sklearn.model\_selection.
    With the help of this function, we are able to divide the dataset into a training
    set and a testing set.


    *   *KNeighborsClassifier* is found in the sklearn.neighbors package. It is utilized
    by the k-nearest neighbors classification technique.


    *   *svm* module from sklearn supplies classification and regression techniques
    for use with support vector machines.


    *    *metrics* is derived from the sklearn library. This module includes a variety
    of metrics for assessing the effectiveness of ML models.


    *   *DecisionTreeClassifier* is a popular classification approach based on decision
    trees. It comes from the sklearn.tree library.


    Importing these modules and classes will provide you with access to the essential
    tools for creating and evaluating various ML algorithms on the Iris dataset. We
    will apply these algorithms to the dataset.


    You may use the following piece of code ([Figure 1.7](#ch08.xhtml#f33)) to divide
    the Iris dataset into training and testing sets by employing the *train\_test\_split*
    function provided by scikit-learn, and then report the shape of the sets that
    are produced as a result.


    ![Figure 1.7Code snippet to divide the dataset.](html/images/9781032676654_C001_007.jpg)


    [Figure 1.7](#ch08.xhtml#f33b)Code snippet to divide the dataset.


    The iris DataFrame is to be partitioned into training and testing sets. The *test\_size*
    parameter set to 0.3 indicates that 30 percent of the data is assigned to the
    testing set, while 70 percent of the data is for the training set.


    After the data has been split, the form of the set used for training is printed
    utilizing the *shape* property of the *train* DataFrame, and then the testing
    set is printed utilizing the *shape* attribute of the *test* DataFrame. This is
    followed by printing the shape of the entire data set. This gives you the ability
    to check the lengths of the sets that are produced as a result.


    When this code as in [Figure 1.7](#ch08.xhtml#f33) is executed, the Iris dataset
    will be partitioned into a training set and a testing set, with the corresponding
    shape of the sets displayed.


    The training set’s training features (*train\_x*) along with training labels (*train\_y*)
    are extracted here in this code block (see [Figure 1.8](#ch08.xhtml#f34)). On
    the other hand, the testing features (*test*\_ *x*) and testing labels (*test\_y*)
    are taken from the testing set and extracted here. The characteristics are chosen
    in accordance with the columns labeled “SepalLengthCm,” “SepalWidthCm,” “PetalLengthCm,”
    and “PetalWidthCm,” respectively.


    ![Figure 1.8Code snippet for extracting features.](html/images/9781032676654_C001_008.jpg)


    [Figure 1.8](#ch08.xhtml#f34b)Code snippet for extracting features.


    A version of the Support Vector Machine (SVM) classification is built here using
    the *svm.SVC*() function. After that, the *fit*() method is called, and the model
    is trained by making use of the training data (*train\_ x* and *train\_y*). The
    *predict*() method is then used to make predictions based on the training model
    regarding the labels that should be assigned to the test features (*test*\_*x*).
    The correctness of the SVM model is determined with the *accuracy\_score*() function
    included in the *metrics* module to compare the labels that are predicted with
    the actual labels (*test\_y*). The determined accuracy score is printed underneath
    (see [Figure 1.9](#ch08.xhtml#f35)).


    ![Figure 1.9Code snippet for SVM classification.](html/images/9781032676654_C001_009.jpg)


    [Figure 1.9](#ch08.xhtml#f35b)Code snippet for SVM classification.


    In a similar fashion, a version of the Logistic Regression (LR) classification
    is generated by calling the *LogisticRegression*() function. The model is then
    trained and evaluated in the same way to that of the previous SVM classification.
    In addition to that, the accurateness of the LR strategy is also printed (see
    [Figure 1.10](#ch08.xhtml#f36)).


    ![Figure 1.10Code snippet for LR classification.](html/images/9781032676654_C001_010.jpg)


    [Figure 1.10](#ch08.xhtml#f36b)Code snippet for LR classification.


    By following the code snippet as in [Figure 1.11](#ch08.xhtml#f37), a version
    of the Decision Tree classification called *DecisionTreeClassifier*() is generated.
    The model is then trained and assessed in the same manner to that of the previous
    two models. The reliability of the Decision Tree concept is also displayed at
    the end.


    ![Figure 1.11Code snippet for Decision Tree classification.](html/images/9781032676654_C001_011.jpg)


    [Figure 1.11](#ch08.xhtml#f37b)Code snippet for Decision Tree classification.


    Finally, the program generates a bar plot in order to contrast the degrees of
    accuracy achieved by each of the three models. The accuracy list stores the scores
    that match to the model names that are stored in the *model\_name* list. The model’s
    names are stored in the *accuracy* list (see [Figure 1.12](#ch08.xhtml#f38)).
    The bar plot is produced by the *barplot*() function, which can be found within
    the seaborn library. The map produced as a result provides a visual representation
    of the accuracy of the comparisons between the chosen three models.


    ![Figure 1.12Code snippet to create accuracy scores.](html/images/9781032676654_C001_012.jpg)


    [Figure 1.12](#ch08.xhtml#f38b)Code snippet to create accuracy scores.


    When the code as in [Figure 1.13](#ch08.xhtml#f39) is executed, it will show the
    accuracy values of the SVM, Logistic Regression, and Decision Tree models, in
    addition to the bar plot that compares the accuracy levels of the three models
    respectively.


    ![Figure 1.13Code snippet to create accuracy scores and accuracy comparison.](html/images/9781032676654_C001_013.jpg)


    [Figure 1.13](#ch08.xhtml#f39b)Code snippet to create accuracy scores and accuracy
    comparison.


    ## 1.5 Inferences


    After carrying out an analysis of the accuracy levels of the chosen three models,
    we can infer that the SVM model obtains the highest level of accuracy, with Logistic
    Regression coming in a close second. In comparison to the other two models, the
    Decision Tree model offers a somewhat lower accuracy, however it is still reasonably
    accurate overall. We are able to make educated judgments about which approach
    is best suited for classifying Iris species of flowers based on the available
    attributes by contrasting and evaluating the accuracies of various models. This
    allows us to make informed choices about the paradigm that is ideally suited for
    classifying Iris flower species.'
