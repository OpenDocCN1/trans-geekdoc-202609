    ## 3.2 The class imbalance problem


    The problem of class imbalance is one of the challenges that frequently arises
    in the context of ML initiatives. Class imbalance is a circumstance in which the
    classes in the target variable are not uniformly distributed, with one class having
    a significantly lesser number of samples compared to the other class(es), as well
    as any further classes that might exist. This might happen in the context of evaluating
    the quality of the water when the number of water samples that are regarded to
    be acceptable for human consumption (class 1) is a significantly lower number
    than the number of samples that are considered to be harmful (class 0).


    Dealing with class imbalance is crucial because it can lead to biased models that
    give priority to the class that holds the majority of the population and perform
    badly when it comes to accurately predicting the class that holds the minority
    of the population. In order to guarantee accurate and trustworthy forecasts, we
    address the issue of class imbalance in the dataset pertaining to water quality
    in this chapter.


    We use a pie chart to depict the distribution of the “Potability” classes in order
    to assess and overcome class imbalance. This helps us identify the imbalance between
    the safe and hazardous water samples, which is necessary for overcoming the problem.
    In order to solve this problem, it is ultimately decided to use resampling techniques.
    In order to achieve a dataset that is more evenly distributed, resampling may
    involve either oversampling the minority class (which would result in an increase
    in its representation) or under sampling the majority class (which would result
    in a reduction in its representation). We get rid of any possible biases that
    might have been caused by the order in which the data are presented by shuffling
    the dataset.


    The reader will develop a better understanding of the class imbalance problem
    throughout the course of this chapter, as well as the significance of addressing
    it in an effective manner. Readers will learn how to generate a balanced dataset
    that provides equal representation of both safe and unsafe water samples by making
    use of resampling techniques. This will result in more accurate and dependable
    ML models for the prediction of water potability.


