    ## 7.2 Performance metrics


    In the field of machine learning, it is essential to conduct performance evaluations
    of our models in order to have an understanding of how well these models are carrying
    out the task at hand. Although accuracy is a popular metric, it might not give
    a whole picture of how effective the model is. In this section, we are going to
    introduce numerous performance indicators or metrics that provide us with the
    ability to evaluate various elements of the model’s performance. Let’s look at
    each metric in more detail:


    *   **Accuracy:** It is a measure of the overall accuracy of predictions, and
    indicates the proportion of correctly classified examples relative to the total
    number of occurrences. Accuracy assesses the overall correctness of forecasts.
    Accuracy is a valuable indicator, but it may not be sufficient when working with
    datasets that are imbalanced or when the cost of misclassification changes across
    various classes.


    *   **Precision:** Precision refers to the ratio of accurately anticipated positive
    cases (true positives) to the total number of predicted positive cases (true positives
    plus false positives). Because it evaluates the model’s capacity to avoid producing
    false positives, precision is especially important in situations in which the
    identification of positive cases is of paramount importance.


    *   **Recall (Sensitivity):** Recall, which is also known as sensitivity or true
    positive rate, measures the proportion of actual positive cases properly detected
    by the model (true positives) out of the total number of genuine positive cases
    (true positives plus false negatives). When the objective is to identify as many
    true positive cases as possible while reducing the number of false negatives,
    recall is an indispensable tool.


    *   **Score of F1:** The F1 score is a fair evaluation of the model’s performance
    because it combines precision and recall into a single statistic. It is the harmonic
    mean of precision and recall, taking into account both false positives and false
    negatives. It is a measure of diagnostic accuracy. The F1 score can range from
    0 to 1, with 1 reflecting flawless precision and recall.


    *   **ROC AUC Score:** The Receiver Operating Characteristic (ROC) curve is an
    illustration of the model’s performance at various categorization criteria. The
    model’s ability to differentiate between positive and negative classes is quantified
    by a score known as the Area Under the ROC Curve (ROC AUC). Indicative of more
    discriminative capacity is a ROC AUC value that is higher.


    By making use of these performance indicators, we are able to achieve a more in-depth
    comprehension of the strengths and shortcomings possessed by our models with regard
    to the diabetes prediction. With the help of these measures, we are able to examine
    specific features in addition to general accuracy, such as recall and precision,
    as well as the balance between the two. Let’s move on with our investigation and
    use these metrics to evaluate how well various machine learning models perform
    on the Pima Indians Diabetes dataset.


