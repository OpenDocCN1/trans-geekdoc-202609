    在本章中，我们使用 `KNN`、`MLP` 和 `RF` 模型对药物进行了分类，并使用各种超参数调优策略对它们的超参数进行了调优。通过找到最适合它们的超参数，我们改进了模型的性能。折线图对比凸显了模型之间存在的准确率差异，揭示了各自方法的效率。调整超参数的过程是机器学习模型优化中至关重要的阶段，它可以显著提高后者的预测能力。


    ## 6.8 进一步学习


    在本章中，我们利用多种模型和超参数调整方法对药物分类进行了研究。尽管如此，这项工作和进展未来还有许多其他方向。为了更有效的搜索以及对超参数空间的进一步探索，可以使用复杂的超参数调优方法，例如贝叶斯优化或遗传算法。额外的研究可以集中在特征工程上以改进药物分类数据集。这可能涉及各种降维策略或领域特定引入。Stacking（堆叠）和
    Boosting（提升）是两种集成方法，可以聚合多个模型的预测结果，以实现更高水平的分类精度。类别不平衡问题可以通过过采样、欠采样或 `SMOTE`（合成少数类过采样技术）等处理不平衡数据的技巧解决。处理药物分类挑战时，调查卷积神经网络和循环神经网络等深度学习方法也可能大益。


