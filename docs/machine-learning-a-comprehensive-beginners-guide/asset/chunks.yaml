    ## 9.5 Model training


    A Voting Classifier is a type of machine learning model that is trained on an
    ensemble of many models and then makes a prediction about an output (class) based
    on the models’ highest likelihood of selecting that class as the output. It merely
    compiles the results of each classifier fed into the Voting Classifier and bases
    which is the fundamental principle or rule upon which the Voting Classifier makes
    its final decision. Refer to [Figure 9.7](#ch16.xhtml#f126) for the code snippet.


    ![Figure 9.7Voting Classifier.](html/images/9781032676654_C009_007.jpg)


    [Figure 9.7](#ch16.xhtml#f126b)Voting Classifier.


    There are three separate classification models employed, and then a voting classifier
    as given in [Figure 9.8](#ch16.xhtml#f127) is used to integrate the predictions
    from all the models. The red colored pop-up message shows us the models are optimized
    with oneAPI, oneDAL library.


    ![Figure 9.8To integrate predictions from all models.](html/images/9781032676654_C009_008.jpg)


    [Figure 9.8](#ch16.xhtml#f127b)To integrate predictions from all models.


    The three model instances are saved in the variable referred to as “models” as
    a list of tuples, each of which has a unique name for a classifier. Following
    this step, a voting classifier is developed in order to carry out majority voting
    based on projected class labels. The final step is fitting the test data, which
    has previously been scaled, to the voting classifier.


    ## 9.6 Result and analysis


    As the final step, we analyze and evaluate the voting classifier that is created.


    ![Figure 9.9Voting Classifier performance evaluation.](html/images/9781032676654_C009_009.jpg)


    [Figure 9.9](#ch16.xhtml#f128b)Voting Classifier performance evaluation.


    The accuracy of the voting classifier’s prediction is compared with the ground
    truth labels using “accuracy\_score.” A classification report is then generated
    which includes various different metrics to evaluate our model. The model performs
    with an accuracy of 73.8% (refer to [Figure 9.9](#ch16.xhtml#f128)).


    ## 9.7 Further learning


    In the future, we may delve further into ensemble learning by investigating other
    approaches for ensemble learning such as bagging, boosting, and stacking. It is
    important to practice hyperparameter adjustment in order to enhance model performance.
    Additionally, it is important to research approaches for improving model interpretability
    and managing imbalanced datasets. Conduct experiments with a variety of model
    selection procedures, such as soft voting, and investigate in advanced ways for
    combining models, such as stacking using meta-classifiers.


    ## 9.8 Conclusion


    In this chapter, we have discussed the idea of ensemble learning and illustrated
    how to use the Voting Classifier to combine the predictions of three different
    types of models: logistic regression, decision trees, and random forests. With
    ensemble learning, we were able to capitalize on the many models’ inherent advantages,
    which ultimately led to a more reliable and accurate categorization. We were able
    to have a better grasp of how ensemble learning can dramatically improve the performance
    and stability of machine learning models by using this approach. As we continue
    to work our way through this book, we will go deeper into more advanced principles
    and methods of machine learning, which will provide us with the ability to efficiently
    solve difficult problems that arise in the real world.


    ## Suggested reading


    *   Karadeniz, T., Maraş, H.H, Tokdemir, G. and Ergezer, H., 2023, March 15. Two
    majority voting classifiers applied to heart disease prediction. Applied Sciences,
    *13*(6), p.3767.


