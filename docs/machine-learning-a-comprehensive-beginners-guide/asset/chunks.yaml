    这种方法与监督学习模型不同，因为数据没有与其相关的任何标签。此外，在无监督学习方法中没有显式的训练和测试阶段。噢，这难道不让人感到困惑吗？那么模型将如何进行预测呢？是的，有方法的，我们可以通过接下来的简单示例来理解。


    想象一个学生被给了一个包含一组狗和猫的数据集，且完全没有任何标签（图 P1.11）。每天这个数据集都会给给这个学生，一周后，学生被要求对数据集中的相似图像进行分类。你认为这个学生会做什么？学生已经看了一周不同类型的图像。这个学生应该足够聪明，能够识别出猫和狗图像的特征。到周末结束时，如果给出另一组不同的图像，显然凭借他通过映射狗和猫特征过程所积累的集体知识，这个学生至少能在某种程度上正确地映射或分组猫和狗图像。是的，确实有一些可爱的狗看起来很像猫（注：原文此处误应为某些狗长得像猫），但我们对此无能为力，因此也可能出现一些误分类（图
    P1.11）。


    ![图 P1.11 无监督学习过程。](img/9781032676654_C000_011.jpg)


    图 P1.11 无监督学习过程。


    给定一组数据，它将对它们进行分类并给出输出。每个类别被称为一个簇（cluster）。簇的标签稍后将手动标记。分类基于数据点中的特征。无监督学习算法也被称为聚类算法。考虑之前为监督学习讨论的苹果和西红柿案例。


    ## P1.7 强化学习算法


    强化学习算法是一种机器学习算法，它使用计算机代理来学习环境的最优行为，并采取正确的行动以获得最大奖励。这主要关于决策过程，其中获得的反馈至关重要。这是一种基于反馈的学习过程。这种学习方法用于大多数机器人和计算机游戏。在这里，输入不需要有标签的数据。相反，模型通过与环境交互并获取反馈来学习。当模型第一次做出决策时，根据反馈，模型会学习其决策是正确还是错误。因此，这种监督学习放宽了训练提供完全标签数据的任务。一个非常常见的例子是电脑象棋游戏；如果电脑在与你对弈时输了，程序将记住玩家和系统所采取的所有步骤。下一次，同样的策略在系统中将不再有效，最终玩家将输给程序。


    噢，这些内容听起来都像希腊语和拉丁文吗？别担心，我们将用一个例子来帮助你理解这个过程。


    让我们来看强化学习的简单例子。考虑一位妈妈在教她的孩子，当孩子犯错时，妈妈给出反馈，这样这种反馈对他下一次就会有所帮助（图 P1.12）。


    ![图 P1.12 强化学习。](img/9781032676654_C000_012.jpg)


    图 P1.12 强化学习。


    ## P1.8 演化方法


    这仍然处于进化中，并不是一个容易的任务。这些类型的算法将模拟自然演化来解决特定问题。例如，可以使用遗传算法来解决问题。这超出了本书的范围，因此目前暂忽略。


    ## P1.9 那么为什么我们需要机器学习？


    这是一个非常棒的问题，问得正是时候。是的，到此时，显然我们利用自己的经验来学习。。比方一个简单的例子，回到童年。是的，童年是一个充满经验的宝库，对吧？那么让我们用另一个例子……


