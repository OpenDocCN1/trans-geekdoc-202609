    # IntroductionWhat is Machine Learning?


    DOI: [10.1201/9781032676685-1](http://doi.org/10.1201/9781032676685-1)


    ## Learning objectives


    After reading this chapter, the reader shall be able to understand the following:


    *   What is machine learning?


    *   Relationship between AL, ML, and DL


    *   What are the types of machine learning?


    *   Why do we need machine learning?


    *   The machine learning framework


    *   Machine learning vs. deep learning


    *   Machine learning applications


    ## P1.1 Introduction


    The term machine learning (ML) belonging to the research field of Artificial Intelligence
    (AI) has been buzzing around us for quite a few decades. Most of us would have
    already carried out some attempts to understand “what the word level abstract
    meaning is” at least by performing a google search. Even if you have not done
    that, do not worry you are at the right place to learn in depth about “What is
    machine learning?” in a technical perspective. The intention of this chapter does
    not stop there; yes, we will dive a little deeper to understand the various types
    of machine learning, its application in real-life scenarios, and the differences
    between ML and deep learning (DL).


    ## P1.2 What is machine learning?


    Okay, let us start by taking you back to your childhood. Do you remember how many
    times you fell before you started to walk properly? That’s a pretty old memory
    for you to recollect – we should probably direct this question to your parents.
    Let us consider an example, which you might remember even now. Every one of us
    would have had a favorite Kindergarten teacher, who was so sweet and patient to
    you. Yes, I used the word patient intentionally. You know why! I still remember
    the way my Kindergarten teacher taught me what an apple is. She literarily brought
    the real apple and handed it over to me, asked me to play with it to experience
    and tell me that was an apple. In fact, she did this for almost a week. See [Figure
    P1.1](#ch07.xhtml#f1).


    ![Figure P1.1Teacher showing (training) the student for a week “what is an apple?”.](html/images/9781032676654_C000_001.jpg)


    [Figure P1.1](#ch07.xhtml#f1b)Teacher showing (training) the student for a week
    “what is an apple?”.


    The following week she brought a tomato and an apple and asked me to tell her
    which one was the apple. I was able to correctly point out the apple without any
    hesitation ([Figure P1.2](#ch07.xhtml#f2)).


    ![Figure P1.2Teacher testing the student if they correctly recognize the apple.](html/images/9781032676654_C000_002.jpg)


    [Figure P1.2](#ch07.xhtml#f2b)Teacher testing the student if they correctly recognize
    the apple.


    Now let us come to the point: what do you think the teacher has done to make the
    student recognize it so well? Yes, the teacher patiently “***trained***” the student
    with an original apple for a week and the features of the apple such as its red
    color, round shape and properties of being white and hard inside; all have been
    registered properly by experiencing it. This collective intelligence gathered
    by the student helped them to recognize the apple from a different fruit like
    tomato during a “***testing”*** phase. (By the way, we are not providing false
    information: Tomatoes are fruits that are considered vegetables by nutritionists
    as suggested by Britannica.com.)


    So, let us discuss the question again: “What is machine learning?” How is it even
    relevant to the example given above? Now carefully answering this question, by
    the literal meaning of machine learning, we are trying to make a machine learn.
    Yes, we feed already known data to a machine and ***train*** it. Once the machine
    is trained appropriately, we will ***test*** the machine to see whether the machine
    is able to provide the apt answers with the help of the trained data. We can keep
    training the machine until it provides us the most optimized results.


    Oh, that is all. Isn’t it? Machine learning is all simple now and makes sense.'
