  fmt: "\noneAPI is interesting. There are two options provided to the developers\
    \ for programming. One is direct programming, and the second option is API-Based\
    \ Programming. In addition, DPC++ provides the compatibility tool and the debug\
    \ tools with oneAPI ([Figure P1.18](#ch07.xhtml#f18)).\n\n![Figure P1.18Programming\
    \ model.](html/images/9781032676654_C000_018.jpg)\n\n[Figure P1.18](#ch07.xhtml#f18b)Programming\
    \ model.\n\n*   The developers working with `CUDA` and who has the requirement\
    \ to migrate the existing `CUDA` code (`CUDA Source Code`) to the `DPC++` (`DPC++\
    \ Source Code`) is easier right now with oneAPI. oneAPI provides you the `intel\
    \ DPC++ Compatibility Tool` to migrate source code to source code to from `CUDA`\
    \ to `DPC++` with ease. There is a lot of assistance offered in the migration\
    \ and almost 80 to 90 percent automatically. The best part is “inline comments”\
    \ are also provided in an understandable manner for the developers to finish the\
    \ porting.\n\n*   The `intel oneAPI DPC++ / C++ compiler` is very powerful, and\
    \ it supports the direct programming. This approach comes into place when the\
    \ APIs are not available for the algorithms. The readers shall be presented with\
    \ more details about the direct programming. For direct programming, `Data Parallel\
    \ C++` (or `DPC++`) is an evolution of `C++` for productive data-centric coding\
    \ that will target CPUs, GPUs, FPGAs, and AI accelerators.\n\n*   The next approach\
    \ is the API based programming. There is a huge set of libraries catering to different\
    \ domains and areas. Details of the libraries is presented in the subsequent section.\
    \ Developers can just go ahead and use them without any challenge. Readers can\
    \ find a lot of information on the libraries shortly.\n\n*   Finally, in [Figure\
    \ P1.18](#ch07.xhtml#f18) you can also see that we have the tools like `intel\
    \ VTune Profiler` and `Intel Advisor` which can help in analyzing performance.\n\
    \n## P1.15 Libraries – more power to you\n\noneAPI comes with rich set of libraries\
    \ which enable acceleration of domain-specific functions. All the libraries as\
    \ shown in [Figure P1.19](#ch07.xhtml#f19) are preoptimized to ensure maximum\
    \ performance. One could see that the libraries cater to vast domain requirements.\
    \ These libraries simplify programming by providing developers with APIs.\n\n\
    ![Figure P1.19Power of oneAPI.](html/images/9781032676654_C000_019.jpg)\n\n[Figure\
    \ P1.19](#ch07.xhtml#f19b)Power of oneAPI.\n\nA brief note on each of these libraries\
    \ is presented below.\n\n*   `Intel oneAPI Math Kernel Library` – one could use\
    \ this library to have the highly optimized math routines in their applications\
    \ being developed.\n\n*   `Intel oneAPI Deep Neural Network Library` – one could\
    \ use this library to build the deep learning applications which uses the neural\
    \ networks optimized for the `intel` hardware, be it processor or graphics.\n\n\
    *   `Intel oneAPI Video Processing Library` – as the name indicates this library\
    \ can be very handy to accelerate the video processing in the chosen application.\n\
    \n*   `Intel oneAPI Data Analytics Library` – this is one of the best and industry\
    \ needs this. One can use this library to have speed and performance in the big\
    \ data applications.\n\n*   `Intel oneAPI threading Building Blocks` – often called\
    \ `TBB`, this gives the developer a chance to combine the `TBB`-based parallelism\
    \ on the Multicore CPUs and the `SYCL` device-accelerated parallelism in the chosen\
    \ application.\n\n*   `Intel oneAPI Collective Communications Library` – this\
    \ can be used where the applications focus primarily on the deep learning and\
    \ the machine learning workloads.\n\n*   `Intel oneAPI DPC++ Library` – one can\
    \ use this library for building high-performance parallel applications.\n\n* \
    \  Support in the form of `Ray Tracing libraries` – to build photorealistic visuals\
    \ from studio animation to scientific and industrial visualizations.\n\n*   `Intel\
    \ oneAPI Image Processing Library` – as the name implies, oneAPI contains image\
    \ processing functionality, filters, geometric transformations, color and type\
    \ conversions, and various 3D operations, that allows developers to take advantage\
    \ of diverse computational devices through `SYCL*` APIs without changing their\
    \ code(s).\n\n*   `Intel oneAPI Data Transformation Library` – this is a very\
    \ innovative attempt from `intel` to provide ready-to-use, optimized data compression\
    \ functions for diverse architectures. `oneDTL` is designed in such a way that,\
    \ execution can happen on wide range of devices which include CPU, GPU etc.\n\n\
    In addition, `Intel oneAPI` has also a plethora of toolkits available offering\
    \ a wide range of services.\n\n## P1.16 What’s the connection of oneAPI with this\
    \ book?\n\nWell, this should be in the mind of readers by now. Let’s answer the\
    \ question. Machine Learning (`ML`) concepts can be taught through various platforms\
    \ and modes. We have chosen oneAPI. Machine Learning will be easier through this\
    \ approach we believe. Also, it is the need for the hour in the industry. `ML`\
    \ skills hand in hand with the oneAPI knowhow will be phenomenal. We are certain\
    \ that the readers would enjoy this entire journey of learning.\n\n## P1.17 Learning\
    \ resources\n\nOne of the greatest things `Intel` has done is to provide excellent\
    \ learning resources for all levels. Be it novice to the expert, the materials\
    \ and learning pathways provided are simply outstanding. Intel also provides case\
    \ studies, reference codes through `GIT`, and more for the learners. Teachers\
    \ have got the opportunity to become certified instructors for oneAPI and they\
    \ get access to complete training materials, presentations, example codes, assignment\
    \ questions and answers.\n\nThe below links can be used to learn more about oneAPI:\n\
    \n*   Intro to oneAPI\n\n    *   `Intro to oneAPI`\n\n*   oneAPI Toolkits\n\n\
    \    *   `oneAPI Toolkits`\n\n*   Learning Paths\n\n    *   `Learning Paths`\n\
    \n*   Community projects\n\n    *   `Community projects`\n\n*   oneAPI DevCloud\n\
    \n    *   `oneAPI DevCloud`\n\nTo become a certified instructor for oneAPI, one\
    \ can go ahead and apply with the below link:\n\n`www.intel.com/content/www/us/developer/oneapi/certified-instructor.html`\n\
    \nAnd remember, it is all free!\n\n## P1.18 The Intel Developer Cloud – your pathway\
    \ to learning!\n\nThe Intel Developer Cloud is interesting and a powerful sandbox\
    \ which enables someone to develop, test and run the workloads across range of\
    \ accelerators which include `intel` CPUs, GPUs, and FPGAs with the `oneAPI` software\
    \ stack. Not only this, but it also comes up with excellent tutorials, learning\
    \ materials, codes for anyone to start using.\n\nHere is the process to register\
    \ for the Intel Developer Cloud, for free:\n\n1.  Visit `https://console.intel.com/`.\
    \ It will get you a page where you can find `Create Account` option as shown in\
    \ [Figure P1.20](#ch07.xhtml#f20).\n\n    ![Figure P1.20Create an account with\
    \ Intel Developer Cloud.](html/images/9781032676654_C000_020.jpg)\n\n    [Figure\
    \ P1.20](#ch07.xhtml#f20b)Create an account with Intel Developer Cloud.\n\n2.\
    \  It will prompt you to enter some basic details, which includes your name, email\
    \ address, country of residence and password of your choice. It does not ask you\
    \ for your credit card details and it is a great plus for the users. Once the\
    \ details are filled in, click to verify your email ([Figure P1.21](#ch07.xhtml#f21)).\n\
    \n    ![Figure P1.21Account creation.](html/images/9781032676654_C000_021.jpg)\n\
    \n    [Figure P1.21](#ch07.xhtml#f21b)Account creation.\n\n3.  There will be an\
    \ email from `intel` with a verification code; this must be filled in the column\
    \ indicated. That’s it, it is almost done ([Figure P1.22](#ch07.xhtml#f22)).\n\
    \n    ![Figure P1.22Account Verification.](html/images/9781032676654_C000_022.jpg)\n"
  trans: "\n\noneAPI 非常有趣。它为开发人员提供了两种编程选项：一种是直接编程，另一种是基于 API 的编程。此外，DPC++ 还提供了与 oneAPI\
    \ 兼容的工具和调试工具（图 P1.18）。\n\n![图 P1.18 编程模型。](img/9781032676654_C000_018.jpg)\n\n\
    图 P1.18 编程模型。\n\n*   对于正在使用 `CUDA` 且需要将现有 `CUDA` 代码（`CUDA Source Code`）迁移到 `DPC++`（`DPC++\
    \ Source Code`）的开发者来说，现在通过 oneAPI 变得更容易。oneAPI 提供了 `intel DPC++ Compatibility\
    \ Tool**，可以让你轻松地将源代码从 `CUDA` 迁移到 `DPC++`。在迁移过程中提供了大量的帮助，几乎 80% 到 90% 是自动完成的。最棒的部分是，它还以易于理解的方式提供了“内联注释”，以便开发者完成移植。\n\
    \n*   `intel oneAPI DPC++ / C++ compiler` 非常强大，并支持直接编程。当算法没有可用 API 时，就会采用这种方法。读者将看到更多关于直接编程的细节。对于直接编程，`Data\
    \ Parallel C++`（或 `DPC++`）是 `C++` 的演进，旨在实现高效的数据中心型编码，目标针对 CPU、GPU、FPGA 和 AI 加速器。\n\
    \n*   下一种方法是基于 API 的编程。有一个巨大的库集，满足不同的领域和区域。库的细节将在后续章节中介绍。开发者可以直接使用它们，没有任何任何挑战。读者很快就能找到关于这些库的大量信息。\n\
    \n*   最后，在图 P1.18 中你还可以看到我们拥有如 `intel VTune Profiler` 和 `Intel Advisor` 等工具，它们可以帮助分析性能。\n\
    \n## P1.15 库 —— 赋予你力量\n\noneAPI 带有丰富的库集，能够加速特定领域的函数。如图 P1.19 所示的所有库都经过预优化，以确保最大的性能。可以看到这些库满足广泛的领域需求。这些库通过为开发者提供\
    \ API 简化了编程。\n\n![图 P1.19oneAPI 的力量。](img/9781032676654_C000_019.jpg)\n\n图 P1.19oneAPI\
    \ 的力量。\n\n下面介绍了这些每个库的简要说明：\n\n*   `Intel oneAPI Math Kernel Library` —— 人可以使用此库在正在开发的应用程序中使用高度优化的数学例程。\n\
    \n*   `Intel oneAPI Deep Neural Network Library` —— 人可以使用此库来构建深度学习应用，使用针对 `intel`\
    \ 硬件（无论是处理器还是显卡）优化的神经网络。\n\n*   `Intel oneAPI Video Processing Library` —— 如其名所示，该库对于加速所选应用程序中的视频处理非常有用。\n\
    \n*   `Intel oneAPI Data Analytics Library` —— 这是最好的库之一，也是行业所需要的。人们可以使用此库在大数据应用中获得速度和性能。\n\
    \n*   `Intel oneAPI threading Building Blocks` —— 通常称为 `TBB`，它为开发者提供了机会，将所选应用程序中多核\
    \ CPU 上的基于 `TBB` 的并行性与 `SYCL` 设备加速的并行性相结合。\n\n*   `Intel oneAPI Collective Communications\
    \ Library` —— 它可以用于主要关注深度学习和机器学习工作负载的应用程序。\n\n*   `Intel oneAPI DPC++ Library`\
    \ —— 人可以使用此库来构建高性能并行应用程序。\n\n*   `光线追踪库` 支持 —— 用于构建从棚级动画到科学和工业可视化的光实级视觉效果。\n\n\
    *   `Intel oneAPI Image Processing Library` —— 如其名所示，oneAPI 包含了图像处理功能、过滤器、几何变换、颜色和类型转换以及各种\
    \ 3D 操作，允许开发者在不更改代码的情况下，通过 `SYCL*` API 利用各种计算设备的优势。\n\n*   `Intel oneAPI Data\
    \ Transformation Library` —— 这是 `intel` 的一项非常创新尝试，为各种架构提供即插用的、优化的数据压缩函数。`oneDTL`\
    \ 的设计使得执行可以在 CPU、GPU 等广泛设备上进行。\n\n此外，`Intel oneAPI` 还有许多可用的工具包，提供广泛的服务。\n\n##\
    \ P1.16 oneAPI 与本书有什么联系？\n\n嗯，读者现在心里应该已经心中有数了。让我们回答这个问题。机器学习（`ML`）概念可以通过各种平台和模式进行教学。我们选择了\
    \ oneAPI。我们相信，通过这种方法机器学习将变得更加简单。此外，这是行业当务之急。`ML` 技能与 oneAPI 知识相结合将产生非凡的意义。我们确信读者将享受这整个学习旅程。\n\
    \n## P1.17 学习资源\n\n`Intel` 所做的最棒的事情之一是为所有水平提供了优秀的学习资源。无论是新手还是专家，提供的材料和学习路径都是非常出色的。Intel\
    \ 还为学习者通过 `GIT` 提供了案例研究、参考代码等更多内容。教师们获得了成为认证讲师的机会。\n\n可以通过以下链接了解更多关于 oneAPI 的信息：\n\
    \n*   oneAPI 简介 (Intro to oneAPI)\n\n*   oneAPI 工具包 (oneAPI Toolkits)\n\n*   学习路径\
    \ (Learning Paths)\n\n*   社区项目 (Community projects)\n\n*   oneAPI 云 (oneAPI DevCloud)\n\
    \n要成为 oneAPI 认证讲师，人们可以在以下链接申请：\n\n`www.intel.com/content/us/developer/oneapi/certified-instructor.html`\n\
    \n记住，这一切都是免费的！\n\n## P1.18 Intel Developer Cloud —— 你的学习之路！\n\nIntel Developer\
    \ Cloud 是有趣且强大的沙箱，允许在包括 `intel` CPU、GPU 和 FPGA 在内的加速器上开发、测试和运行工作负载，并配备 `oneAPI`\
    \ 软件栈。不仅如此，它还为任何人提供了优秀的教程、学习材料和代码。\n\n以下是免费注册 Intel Developer Cloud 的过程：\n\n1.\
    \ 访问 `https://console.intel.com/`。它将带你进入如图 P1.20 所示所示。\n\n![图 P1.20 在 Intel Developer\
    \ Cloud 上创建账户。](img/9781032676654_C000_020.jpg)\n\n图 P1.20 在 Intel Developer Cloud\
    \ 上创建账户。\n\n2. 它将提示你输入一些基本信息，包括你的姓名、电子邮件地址、居住国家和选择的密码。它没有要求提供信用卡详细信息，这对用户来说是一个巨大的加分项。填写信息后，点击验证你的电子邮件（图\
    \ P1.21）。\n\n    ![图 P1.21 创建账户。](img/9781032676654_C000_021.jpg)\n\n    图 P1.21\
    \ 创建账户。\n\n3. 你将收到一封来自 `intel` 的邮件，其中包含验证码；这必须填入指定的列中。就这样，就快完成了（图 P1.22）。\n\n\
    \    ![图 P1.22 账户验证。](img/9781032676654_C000_022.jpg)\n\n"
