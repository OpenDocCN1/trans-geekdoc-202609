    然后，我们导入如图 18.11 所示的必要库来创建模型。为了将数据划分为训练集和测试集，我们首先创建两个变量 `X` 和 `y`。在变量 `X` 中，我们通过删除目标列
    `classification` 来存储所有特征。在 `y` 中，我们只存储 `classification` 列。然后我们将数据划分为训练集和测试集，比例分别为
    80% 和 20%。


