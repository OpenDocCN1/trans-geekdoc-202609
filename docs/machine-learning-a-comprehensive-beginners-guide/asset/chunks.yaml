    # 引言：什么是机器学习？


    DOI: [10.1201/9781032676685-1](http://doi.org/10.1201/9781032676685-1)


    ## 学习目标


    阅读完本章后，读者将能够理解以下：


    * 什么是机器学习？

    * AI、ML 和 DL 之间的关系

    * 机器学习有哪些类型？

    * 为什么我们需要机器学习？

    * 机器学习框架

    * 机器学习 vs 深度学习

    * 机器学习的应用


    ## P1.1 引言


    机器学习（`ML`）术语属于人工智能（`AI`）研究领域，几十年来它一直在我们周围引起热烈讨论。我们中的大多数人可能可能已经尝试过至少通过一次 `google`
    搜索来理解“这个词在层面的抽象含义是什么”。即使你没有这样做，也不要担心，你现在处于正确的地点，可以从技术角度深入学习“什么是机器学习？”本章的意图并不仅于此；是的，我们将更深入地探讨机器学习的各种类型、它在现实场景中的应用，以及
    `ML` 与深度学习（`DL`）之间的区别。


    ## P1.2 什么是机器学习？


    好了，让我们回到你的童年。你还记得在开始学会走路之前摔倒过多少次吗？这对你来说可能是一个遥远的回忆了——我们应该把这个问题问给你的父母。让我们考虑一个例子，你现在可能还记得。我们每个人都有一位最喜欢的幼儿园老师，他们对你非常温柔且耐心。是的，我特意使用了“耐心”这个词。你知道为什么！我仍然记得我的幼儿园老师是如何教我什么是苹果的。她带了一个真正的苹果交给我，让我体验并告诉我那是苹果。事实上，她这样做持续了一周。见图
    P1.1。


    ![图 P1.1 老师向学生展示一周什么是苹果？](img/9781032676685_C000_001.jpg)


    图 P1.1b)老师向学生展示一周什么是苹果？


    下周周她带了一个西红柿和一个苹果，让我告诉哪一个是苹果。我毫不犹豫地指出了苹果（见图 P1.2）。


    ![图 P1.2 老师测试学生是否认识苹果](img/9781032676685_C000_002.jpg)


    图 P1.2b)老师测试学生是否认识苹果。


    现在让我们回到重点：你认为老师做了什么让学生能很好地识别它？是的，老师耐心地用一个真正的苹果`训练`了学生，苹果的特征如它的红色、圆形以及内部洁白坚硬的属性；这些都被正确地记录了下来。学生积累的这种智能帮助了他们在`测试`阶段从西红柿这种不同的水果中识别出苹果。（顺便说，我们没有提供虚假信息：根据
    Britannica.com 的建议，西红柿被营养学家视为蔬菜。）


    所以，让我们再次讨论这个问题：“什么是机器学习？”它与上面的例子有什么关系？现在仔细回答这个问题，从机器学习的字面意思是，我们正试图让机器学习。是的，我们将已知数据输入机器中并对其进行`训练`。一旦机器训练得当，我们将`测试`机器，看看它是否能够帮助提供恰当的答案。我们可以一直训练机器，直到它为我们提供最优化的结果。


    噢，就这样。不是吗？机器学习现在变得非常简单且易理解了。

    '
