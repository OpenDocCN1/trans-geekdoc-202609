- raw: 'The manual downloading and preparation of data has always been a necessary
    step in the process of getting datasets from external sources. On the other hand,
    we shall present the readers with a method that is more streamlined in this chapter.
    We no longer need to manually download the “flowers-recognition” dataset because
    we can immediately grab it from Kaggle using the OpenDatasets library instead
    of doing so manually. The process of data collecting is not only sped up because
    of this, but it also saves time.


    Once you are done installing the necessary libraries as in [Figure 5.1](#ch12.xhtml#f75),
    follow these steps.


    ![Figure 5.1Installing necessary libraries.](html/images/9781032676654_C005_001.jpg)


    [Figure 5.1](#ch12.xhtml#f75b)Installing necessary libraries.


    *   Step 1: Go to [www.kaggle.com/](http://www.kaggle.com)


    *   Step 2: Choose the dataset (in this chapter we used the flower recognition
    dataset).


    *   Step 3: Copy the link [www.kaggle.com/datasets/alxmamaev/flowers-recognition](http://www.kaggle.com)


    You can see we have used our dataset link in the above code as seen in [Figure
    5.2](#ch12.xhtml#f76). As a next step, you will have to enter your Kaggle username
    and key once after executing the above code. Follow the steps mentioned below
    for your Kaggle username and key.


    ![Figure 5.2Importing the datasets.](html/images/9781032676654_C005_002.jpg)


    [Figure 5.2](#ch12.xhtml#f76b)Importing the datasets.


    *   Step 1: You can access your Kaggle account by going to the website [www.kaggle.com/](http://www.kaggle.com)
    and logging in there. Create an account for yourself if you do not already have
    one.


    *   Step 2: After you have successfully logged in, navigate to the settings page
    for your account. You can access your Kaggle account by going to the top right
    corner of the website, clicking on your profile image, and then selecting “My
    Account” from the dropdown menu.


    *   Step 3: To generate a new API token, scroll down until you reach the section
    labeled “API,” then click the option that says “Create New API Token.” This will
    cause a file with the name kaggle.json to be downloaded on your computer. It will
    contain your API credentials.


    ## 5.3 Data preprocessing


    These lines of code as in [Figure 5.3](#ch12.xhtml#f77) will load the necessary
    libraries in order to build the machine learning model using TensorFlow, which
    involves data handling and visualization.


    ![Figure 5.3Code snippet to import libraries.](html/images/9781032676654_C005_003.jpg)


    [Figure 5.3](#ch12.xhtml#f77b)Code snippet to import libraries.


    In this step, we will determine the image size and set the path to the dataset.
    The path to the dataset downloaded is stored in the data\_dir variable, which
    has its value set to that path. img\_height and img\_width are the two parameters
    that indicate the length and width of the images being used and will be adjusted
    when the model is trained. Refer to [Figure 5.4](#ch12.xhtml#f78) for the code
    snippet.


    ![Figure 5.4Code snippet for image size and path setting.](html/images/9781032676654_C005_004.jpg)


    [Figure 5.4](#ch12.xhtml#f78b)Code snippet for image size and path setting.


    ## 5.4 Creating the model architecture


    In order to enrich the available data, we create an ImageDataGenerator as shown
    in [Figure 5.5](#ch12.xhtml#f79). TensorFlow’s ImageDataGenerator is a utility
    class that assists with data enhancement and data preprocessing. It may also be
    used to generate image data. The changes that are going to be applied to the photos,
    such as resizing, cutting, enlargement, and horizontally flipping the images,
    are defined by the parameters that are supplied in this section.


    ![Figure 5.5Code snippet for image data generation.](html/images/9781032676654_C005_005.jpg)


    [Figure 5.5](#ch12.xhtml#f79b)Code snippet for image data generation.


    These lines as in [Figure 5.6](#ch12.xhtml#f80) and [Figure 5.7](#ch12.xhtml#f81)
    utilize the flow\_from\_directory function of the ImageDataGenerator in order
    to load the training data and validation data respectively from the directory
    specified.


    ![Figure 5.6Code snippet for loading training data.](html/images/9781032676654_C005_006.jpg)


    [Figure 5.6](#ch12.xhtml#f80b)Code snippet for loading training data.


    ![Figure 5.7Code snippet for loading validation data.](html/images/9781032676654_C005_007.jpg)


    [Figure 5.7](#ch12.xhtml#f81b)Code snippet for loading validation data.


    The photographs are shrunk down to the goal size set, and the batch size is what
    decides the number of images that are worked on during each iteration. Since we
    will be working with multi-class categorization, the class\_mode is set to the
    categorical setting. The subset parameter is utilized to divide the data into
    the training set and the validation set according to the validation split that
    has been given.


    ## 5.5 Training the model


    The code provided in [Figure 5.8](#ch12.xhtml#f82) defines the structure of the
    model used for deep learning, which makes use of the Sequential API that TensorFlow
    provides. The model is made up of convolutional layers, followed by max pooling
    layers for the purpose of feature extraction. Flattening the output of the maximum
    pooling layer that came before it and then connecting it to a dense layer that
    uses ReLU activation completes the process. A dropout layer added to the network
    prevents overfitting, and the final dense layer using softmax activation generates
    the class probabilities.


    ![Figure 5.8Code snippet to define model architecture.](html/images/9781032676654_C005_008.jpg)


    [Figure 5.8](#ch12.xhtml#f82b)Code snippet to define model architecture.


    The Adam optimizer, the categorical cross-entropy loss function, and the accuracy
    metric are used in the compilation of the model. In order to train the model with
    the help of the training data for a predetermined amount of epochs, the fit technique
    is invoked. The performance of the model is assessed during the training process
    based on the validation data (see [Figure 5.9](#ch12.xhtml#f83)).


    ![Figure 5.9Code snippet for model compilation.](html/images/9781032676654_C005_009.jpg)


    [Figure 5.9](#ch12.xhtml#f83b)Code snippet for model compilation.


    ## 5.6 Developing an interface based on Gradio


    The code snippet for function definition to make predictions on the input images
    is presented in [Figure 5.10](#ch12.xhtml#f84). We will make use of the Gradio
    library in order to develop an intuitive interface for flower recognition. Gradio
    enables us to define machine learning models’ interfaces in a straightforward
    manner. We are going to build a user interface that, after receiving an image
    as input, displays the type of flower present.


