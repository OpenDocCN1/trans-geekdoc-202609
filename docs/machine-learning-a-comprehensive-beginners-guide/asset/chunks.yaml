    # 第 4 章 使用混合机器学习模型的乳腺癌分类


    DOI: [10.1201/9781032676685-5](http://doi.org/10.1201/9781032676685-5)


    ## 学习目标


    完成本章后，读者将能够：


    *   对数据集中的给定样本是良性还是恶性做出预测。

    *   在构建混合模型时利用少数广知的机器学习算法。

    *   整合多种算法以改进预测模型。


    ## 4.1 引言


    在本章中，我们将研究混合机器学习模型背后的思想。Kaggle 为我们提供了威斯康州乳腺癌数据集，我们将在工作中使用它。该数据集的目的是预测给定样本是良性的（意味着不是癌症）还是恶性的（意味着癌症）。混合模型是集成了不同的机器学习算法的模型。k-最近邻
    (k-NN)、支持向量机 (SVM) 和随机森林是将被使用的三种已知算法。读者可以在此处链接找到数据集：[www.kaggle.com/datasets/breast-cancer]


    ## 4.2 数据准备


    ### 4.2.1 导入库和加载数据


    为了获取内容，我们需要从导入所需的库开始。之后，我们使用 `pandas` 导入数据，使用 `numpy` 进行计算，使用 `scikit-learn` 开发机器学习。利用图
    4.1 中的 `read_csv()` 函数导入数据。参见图 4.2。


    ![图 4.1 利用 `read_csv()` 函数。](img/C004_001.jpg)


    图 4.1 利用 `read_csv()` 函数。


    ![图 4.2 导入数据。](img/C004_002.jpg)


    图 4.2 导入数据。


    ### 4.2.2 探索性数据分析


    在开始建模之前，对数据进行初步检查是必要的。为了理解和掌握数据，我们可以利用多种 `pandas` 函数。例如，图 4.3 中提供的 `head()` 函数将显示
    DataFrame 的前五行；根据需要可以使用 `head(10)` 查看前十行。


    ![图 4.3`head()` 函数说明。](img/C004_003.jpg)


    图 4.3`head()` 函数说明。


    为了处理数据集中不存在的值，我们使用 `isnull().sum()` 方法搜索任何空值。这给出了 DataFrame 中所有列缺失值的总数。为了防止产生偏差或不准确的预测，在训练模型之前以适当的方式管理缺失数据。参见图
    4.4。


    ![图 4.4 管理缺失数据。](img/C004_004.jpg)


    图 4.4 管理缺失数据。


    接下来，我们使用 `scikit-learn` 中的 `train_test_split()` 函数将数据分为特征 (`X`) 和目标变量 (`y`)。`X`
    DataFrame 包含用于预测的特征，而 `y` Series 包含相应的目标值。我们将数据划分为训练集和测试集，其中 80% 用于训练，20% 用于测试。`random_state`
    参数确保了划分的可重复性。参见图 4.5。


