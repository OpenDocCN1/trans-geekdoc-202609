    ![Figure 15.12Accuracy comparison.](html/images/9781032676654_C015_012.jpg)


    [Figure 15.12](#ch22.xhtml#f207b)Accuracy comparison.


    ## 15.6 Conclusion


    Using two very different but equally effective neural network topologies, we have
    investigated the complexities of picture categorization throughout the course
    of this chapter. Our investigation has revealed that the Sequential based model
    performed exceptionally well, highlighting the significance of transfer learning
    in situations where there is insufficient data. Despite this feat, there is still
