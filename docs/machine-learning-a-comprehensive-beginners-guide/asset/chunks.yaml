    # Chapter 20Dive into X (formerly Twitter’s) emotions using oneAPISentiment analysis
    with NLP


    DOI: [10.1201/9781032676685-21](http://doi.org/10.1201/9781032676685-21)


    ## Learning objectives


    By the end of this chapter, the reader shall be able to:


    *   Acquire the knowledge to assess thoughts with deep learning capabilities.


    *   Examine fundamental approaches in Natural Language Processing to design a
    robust deep learning model.


    ## 20.1 Introduction


    In the contemporary era of digital technology, possessing the ability to comprehend
    and interpret human emotions as sent through internet platforms holds immense
    significance and worth. Sentiment analysis, an essential application of Natural
    Language Processing (NLP), enables the interpretation of sentiment expressed in
    textual data. This chapter initiates an engaging exploration, employing the capabilities
    of deep learning to assess thoughts expressed on the Twitter platform with a dataset
    extracted from Kaggle: [www.kaggle.com/datasets/kazanova/sentiment140](http://www.kaggle.com).
    In this study, we will examine fundamental approaches in Natural Language Processing
    (NLP), explore complex preprocessing methods, design a resilient deep learning
    model, and accurately decipher feelings.


    ## 20.2 Insights and preprocessing techniques in Natural Language Processing (NLP)


    Natural Language Processing (NLP) is an interdisciplinary domain that integrates
    the fields of linguistics, computer science, and artificial intelligence (AI).
    Preprocessing is a crucial stage in natural language processing (NLP) that serves
    to improve the quality of data and facilitate the model’s comprehension. Within
    our repertoire of preprocessing techniques:


    *    **Text Cleaning:** The process of cleaning raw Twitter data typically involves
    removing URLs, mentions, and hashtags, as they tend to clutter the data. The process
    of cleaning entails the removal of these artifacts, so assuring that the model
    is directed exclusively towards the textual essence.


    *   **Tokenization:** Tokenization refers to the process of breaking down language
    into its constituent units, known as words, which serve as the fundamental building
    blocks of linguistic communication. Tokenization is a process that involves breaking
    down textual data into individual words or sub words, to establish a structured
    format that facilitates analysis.


    *   **Padding and sequencing:** These are essential techniques in the context
    of neural networks, as they address the requirement for fixed-length inputs. The
    inclusion of padding in a dataset facilitates the achievement of consistency,
    hence enhancing the effectiveness of batch processing during the training phase.
    The process of sequencing involves the transformation of linguistic units into
    numerical representations, rendering them suitable for computational analysis
    using machine learning methods.


    *   **Word embeddings:** Words possess intricate relationships. Word embeddings
    are a type of computational representation that convert words into vectors with
    a large number of dimensions. These vectors are designed to capture the semantic
    meanings and contextual nuances associated with the words. This modification improves
    the model’s comprehension of lexical relationships.


    The dataset we are going to use is obtained from Kaggle using the opendatasets
    library. For handling the csv data, we import the pandas library as seen in [Figure
    20.1](#ch27.xhtml#f262).


    ![Figure 20.1Importing the libraries.](html/images/9781032676654_C020_001.jpg)


    [Figure 20.1](#ch27.xhtml#f262b)Importing the libraries.


    Next we store our dataset in a variable called df. As we are handling categorical
    values, we declare special parameters like encoding = “latin” which will handle
    special characters. As we look at our dataset the first column is our target column.
    See [Figure 20.2](#ch27.xhtml#f263).


    ![Figure 20.2Loading the dataset.](html/images/9781032676654_C020_002.jpg)


    [Figure 20.2](#ch27.xhtml#f263b)Loading the dataset.'
