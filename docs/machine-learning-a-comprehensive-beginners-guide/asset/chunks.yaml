    [Figure 20.10](#ch27.xhtml#f271b)Dataset splitting.


    We utilize the trained model for the purpose of generating predictions on new
    data, namely new\_texts. The text sequences should be tokenized and padded before
    utilizing the model for sentiment label prediction. The function encoder.inverse\_transform
    is employed to reverse the encoding process and convert the predicted values back
    to their original labels. The anticipated classifications are displayed as the
    resulting output (refer to [Figures 20.11 and 20.12](#ch27.xhtml#f272)).


    ![Figure 20.11Model evaluation.](html/images/9781032676654_C020_011.jpg)


    [Figure 20.11](#ch27.xhtml#f272b)Model evaluation.


    ## 20.5 Conclusion


    The present study involved the processing and utilization of a X (formerly known
    as Twitter) sentiment analysis dataset obtained from Kaggle. The dataset was employed
    to construct a resilient sentiment analysis model utilizing LSTM neural networks.
    The dataset underwent preprocessing procedures that involved many steps. Firstly,
    the sentiment values were mapped to the categories of “Negative” and “Positive.”
    Secondly, the text data was cleaned by eliminating URLs and special characters.
    Lastly, the text was tokenized into numerical sequences and padded accordingly.
    The dataset consisted of various columns including “sentiment,” “id,” “date,”
    “query,” “user\_id,” and “text.” Subsequently, a Long Short-Term Memory (LSTM)
    model was developed, comprising an embedding layer to represent words, an LSTM
    layer to capture sequential patterns, and a dense output layer for the purpose
    of binary classification. The model underwent training using preprocessed data,
    resulting in significant accuracy improvements over multiple epochs. Finally,
    the model effectively made accurate predictions regarding feelings for novel textual
    instances, showcasing its practicality in the context of sentiment analysis tasks
    in real-world scenarios.


    ## 20.6 Further learning


    The current investigation focused on the processing and utilization of a dataset
    for Twitter sentiment analysis, which was acquired from Kaggle. The dataset was
    utilized for the purpose of constructing a robust sentiment analysis model by
    employing LSTM neural networks. The dataset underwent a series of preprocessing
    operations that encompassed multiple steps. Initially, the sentiment values were
    assigned to the respective categories of “Negative” and “Positive.” Furthermore,
    the text data underwent a cleaning process wherein URLs and unusual characters
    were removed. Finally, the text underwent tokenization to convert it into numerical
    sequences, which were then appropriately padded. The dataset comprised several
    columns, namely “sentiment,” “id,” “date,” “query,” “user\_id,” and “text.” Following
    this, a Long Short-Term Memory (LSTM) model was constructed, consisting of an
    embedding layer to encode word representations, an LSTM layer to record sequential
    patterns, and a dense output layer for binary classification. The model was subjected
    to a training process utilizing preprocessed data, which led to notable enhancements
    in accuracy across many epochs. Ultimately, the model successfully generated precise
    predictions pertaining to emotions for unfamiliar textual examples, so demonstrating
    its usefulness within the realm of sentiment analysis applications in real-life
    situations.


