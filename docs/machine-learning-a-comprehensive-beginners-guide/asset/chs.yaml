  \n# 第 19 章：使用 oneAPI 通过 ResNet 和 VGG16 深度解析多类花卉分类\n\nDOI: [10.1201/9781032676685-20](http://doi.org/10.1201/9781032676685-20)\n\
  \n##学习目标\n\n阅读本章后，读者将能够：\n\n*   获取通过深度学习分类广泛花类的知识。\n*   利用预训练模型 `ResNet` 和 `VGG16`\
  \ 实现分类准确率。\n\n## 19.1 引言\n\n花卉分类是计算机视觉领域的一个基础课题，吸引了研究者和爱好者。本章深入探讨深度学习领域，旨在解决对广泛花卉进行分类的复杂挑战。我们的关注重点是什么？利用深度学习领域的两个著名竞争者，即\
  \ `ResNet` 和 `VGG16`。通过利用这些预训练模型，我们开启了一项旨在实现高精度准确花卉分类的迷人尝试。来自 kaggle 的可用数据集 [www.kaggle.com/datasets/kausthubkannan/5-flower-types-classification-dataset/data](http://www.kaggle.com)\
  \ 包含了迷人的植物品种，即百合、莲花、兰花、向日葵和郁金。这不仅让我们的任务在科学上引人注目，而且在视觉上非常美丽。\n\n## 19.2 数据准备与可视化\n\
  \n我们首先导入 `opendatasets` 库，它将用于直接从互联网下载开源数据集，如图 19.1 所示。然后粘贴数据集链接。一旦使用`图 19.1` 完成了身份验证，数据集就会被下载。\n\
  \n![图 19.1 导入 opendatasets。](img/9781032676654_C018_014.jpg)\n\n图 19.1 导入 opendatasets。\n\
  \n## 19.3 数据预处理与增强\n\n我们配置了 `ImageDataGenerator` 并带有 `rescale`、`zoom_range` 等各种输入。`validation_split`\
  \ 将数据集划分为 20% 的验证集和 80% 的训练集。为了查看类别数量，我们打印了所有类别。代码片段参考图 19.5。\n\n![图 19.5 数据预处理与增强。](img/9781032676654_C018_015.jpg)\n\
  \n图 19.5 数据预处理与增强。\n\n## 19.4 模型构建、编译与训练\n\n创建了生成器对象 `train_generator` 和 `validation_generator`，它们将在训练和验证期间为我们的模型提供增强的图像数据批。\n\
  \n从目录生成增强数据批使用了 `datagen.flow_from_directory()`，如图 19.6 所示，然后我们指定数据目录的路径。我们将输入图像调整为特定尺寸，并声明\
  \ `batch_size`、`class_mode`（在本例中为类别）并还声明了 `subset`。\n\n![图 19.6 生成增强数据批。](img/9781032676654_C018_016.jpg)\n\
  \n图 19.6 生成增强数据批。\n\n同样，为验证子集创建了 `validation_generator`，声明了与之前相似的所有参数，如图 19.7 的代码片段所示。\n\
