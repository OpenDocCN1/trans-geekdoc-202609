  \ `10.0` 左右，因此我们可以将 `10` 分配为我们的 `maxlen`。\n\n![图 20.6 直方图绘制。](img/9781032676654_C020_006.jpg)\n\
  \n图 20.6 直方图绘制。\n\n通过声明 `tokenizer` 类来执行分词，如图 20.7 所示。`num_words` 指定了要分词的唯一单词的最大数量，而\
  \ `outside_limit_words` 被标记为 `<00V>`。然后将文本转换为序列并进行填充以保持相同的长度。在这种情况下，根据之前提到的直方图图，序列被填充到\
  \ `10` 的最大长度。\n\n![图 20.7 分词。](img/9781032676654_C020_007.jpg)\n\n图 20.7 分词。\n\n\
