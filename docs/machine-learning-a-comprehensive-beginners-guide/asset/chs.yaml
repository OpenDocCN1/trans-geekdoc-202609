  \ metrics）概念来分析模型的效率。你将理解各种指标，这些指标能够对模型性能提供更深层次的洞察，超越了简单的准确率概念。让我们直接进入并学习性能评估的世界吧！\n\
  \n## 7.2 性能指标\n\n在机器学习领域，对模型进行性能评估至关重要，以便了解这些模型在执行当前任务时表现如何。虽然准确率（Accuracy）是一个很流行的指标，但它可能无法反映模型有效性的全貌。在本节中，我们将介绍许多性能指标，这些指标使我们有能力评估模型性能的各个要素。让我们详细查看每个指标：\n\
  \n- `Accuracy`（准确率）：它是预测整体准确性的衡量标准，表示正确分类的示例占总发生次数的比例。准确率评估了预测的整体正确性。准确率是一个有价值的指标，但在处理不平衡数据集或误分类成本在不同类别之间发生变化时，它可能是不够的。\n\
  \n- `Precision`（精确率）：精确率是指准确预测的正例（真阳例）与预测正例总数（真阳例加假阳例）的比率。因为它评估了模型避免产生假阳例的能力，因此在识别正例至关重要的情况下，精确率尤为重要。\n\
  \n- `Recall (Sensitivity)`（召回率/灵敏度）：召回率也称为灵敏度或真阳率，衡量模型正确检测到的实际正例（真阳例）占总真实正例（真阳例加假阴例）的比例。当目标是尽可能多地识别真阳例同时减少假阴例的数量时，召回率必不可少的工具。\n\
  \n- `Score of F1`（F1 分数）：F1 分数是对模型性能的公平评估，因为它将精确率和召回率合并为一个单一统计量。它是精确率和召回率的调和平均数，同时考虑了假阳例和假阴例。它是诊断准确性的衡量标准。F1\
  \ 分数的范围从 0 到 1，1 代表了完美的精确率和召回率。\n\n- `ROC AUC Score`（ROC AUC 分数）：接收者工作特征（ROC）曲线展示了模型在不同分类标准下的性能。模型区分正负类别的能力通过一个名为\
  \ ROC 曲线下面积（ROC AUC）的分数来化。ROC AUC 值越高，表示判别能力越强。\n\n通过利用这些性能指标，我们能够更深入地理解模型在糖尿病预测方面的优点和缺点。在这些衡量标准的帮助下，我们不仅可以查看准确率，还可以检查特定的特征，例如召回率和精确率，以及两者之间的平衡。让我们继续研究，并使用这些指标评估各种机器学习模型在\
  \ Pima 印第人糖尿病数据集上的表现。\n\n## 7.3 数据预处理\n\n图 7.1 所示的代码行提供了必要的库和模块，这些模块将用于数据处理、评估和机器学习任务。数据处理由导入的\
