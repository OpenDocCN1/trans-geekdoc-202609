  \n## 学习目标\n\n阅读本章后，读者能够：\n\n*   获得开发用于财务目的可靠机器学习模型的知识，以确定破产风险。\n*   获取关于数据预处理、数据探索、模型构建以及结果分析的信息。\n\
  \n## 10.1 引言\n\n在本章中，我们将通过机器学习来识别破产的公司。目标是构建一个能够预测公司是否会破产的模型。我们将探索[www.kaggle.com/datasets/company-bankruptcy](http://www.kaggle.com/datasets/company-bankruptcy)。\n\
  \n## 10.2 导入库和数据集\n\n最初，为了进行建模，我们需要对数据进行准备。如图 10.1 所示，我们从 csv 文件获取 `pandas` 数据。在此阶段，我们将解决任何数据问题。参阅图\
  \ 10.2 获取代码片段。\n\n```python\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.preprocessing import StandardScaler\nfrom\
  \ sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import accuracy_score,\
  \ classification_report\nfrom imblearn.over_sampling import SMOTE\nfrom imblearn.under_sampling\
  \ import RandomUnderSampler\n\ndata = pd.read_csv('Bankruptcy_Detection.csv')\n\
  X_train, X_test, y_train, y_test = train_test_split(data.drop('Bankrupt', axis=1),\
  \ data['Bankrupt'], test_size=0.2, random_state=42)\n\nscaler = StandardScaler()\n\
  X_train = scaler.fit_transform(X_train)\nX_test = scaler.transform(X_test)\n\nmodel\
  \ = RandomForestClassifier(n_estimators=100)\nmodel.fit(X_train, y_train)\n\ny_pred\
  \ = model.predict(X_test)\nprint(accuracy_score(y_test, y_pred))\nprint(classification_report(y_test,\
  \ y_pred))\n```\n\n![图 10.1 导入必要的库。](img/9781032676654_C010_001.jpg)\n\n图 10.1 导入必要的库。\n\
