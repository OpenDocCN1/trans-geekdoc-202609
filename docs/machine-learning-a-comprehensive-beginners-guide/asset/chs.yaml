  \n图 18.14 初始化 KNN 分类器。\n\n## 18.4 模型比较与可视化\n\n我们打印了训练模型的准确率。如图 18.15 所示，逻辑回归达到 96.25%，优于其他两个模型。\n\
  \n![图 18.15 准确率比较。](img/9781032676654_C018_015.jpg)\n\n图 18.15 准确率比较。\n\n在本节中，我们导入了\
  \ `matplotlib` 库用于可视化。然后，我们定义了一个对应每个模型的准确率值列表。接着如图 18.16 初始化了一个柱状图，其中 x 轴表示模型名称，y\
  \ 轴表示准确率值。\n\n![图 18.16 柱状图比较。](img/9781032676654_C018_016.jpg)\n\n图 18.16 柱状图比较。\n\
  \n## 18.5 结论\n\n总结，本研究对肾脏疾病数据集进行了彻底检查，涵盖了缺失值处理和类别变量编码。随后，采用了逻辑回归（Logistic Regression）、支持向量机（SVM）和\
  \ K-近邻（KNN）模型进行分类。结果显示出良好的准确率水平：逻辑回归达到了 96.25%，SVM 显示为 65%，而 KNN 在测试数据上产了 82.81%\
  \ 的准确率。\n\n## 18.6 进一步学习\n\n可能的改进方向包括实施特征工程技术以捕捉复杂的相互作用、精细的超参数调优，以及考虑准确率之外指标的全面模型评估。特征选择方法具有提高模型性能的潜力，而森林等集成技术的研究则可能提高预测准确性。此外，在实际场景中实施最有效的模型，并进行持续监控和进一步训练的可能性仍然至关重要。此外，引入模型可解释性方法可能会产生重大的见解，从而确保医疗保健等关键领域预测的可解释性。对这些潜在研究领域的探索，有望增强肾脏疾病预测的精确性和可靠性。\n\
