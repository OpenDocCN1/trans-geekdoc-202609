  对于建模，导入了额外的必要库。我们首先构建了第一个模型 `ResNet50`，并使用 `Adam` 优化器分类交叉熵损失函数对其进行编译。我们使用训练和验证生成器对模型训练了\
  \ `10` 个轮次（epochs）。代码段请参考图 19.8。\n\n![图 19.8 构建 ResNet 模型。](img/9781032676654_C019_008.jpg)\n\
