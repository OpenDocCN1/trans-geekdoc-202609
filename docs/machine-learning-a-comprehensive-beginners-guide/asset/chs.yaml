  \ `contamination` 参数为 `0.05` 的 `IsolationForest` 新实例，这表示我们预计大约有 5% 的数据是异常的。之后，为了理解情况，我们对数据进行拟合。通过\
  \ `fit()` 方法对 `X` 进行拟合，这使我们能够预测哪些是离群值。通过 ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` 方法，我们生成了不包含离群值的特征矩阵\
  \ `X`。\n\n![图 8.5 离群值检测。](img/9781032676654_C008_005.jpg)\n\n图 8.5 离群值检测。（注：此处原文逻辑似乎重复，已按原文翻译）\n\
  \n### 8.3.2 训练集-测试集划分\n\n当执行代码行 `y = data[\"status\"]` 时，目标变量“status”的值被传输到变量 `y`。它使用从原始数据集“status”列的值生成一个新的\
  \ Series `y`，并用这些值填充它。特征中包含的行数和列数可以通过代码 `X.shape` 确定，该代码返回 DataFrame `X` 中包含的特征的形状。它提供了关于特征集可以利用程度的详细信息。\n\
  \n### 8.3.3 特征缩放\n\n使用 `sklearn.preprocessing` 库中的 `StandardScaler` 实例化为 `scaler`，以便可以使用它。缩放训练特征（`X_train`）和测试特征（`X_test`）需要进行操作，这确保了它们处于相同的尺度上，防止任何一个特征控制学习算法。\n\
  \n### 8.3.4 多项式工程\n\n我们将使用项式工程来更好地理解特征之间的复杂关系。通过这种方法生成了初始特征的项式组合，从而创建了额外的项。我们将能够更准确地描述非线性关系，如果使用高阶项，可能会提高模型的性能。\n\
  \n## 8.4 模型训练与评估\n\n我们将训练三个不同的机器学习模型并比较性能。训练数据用于拟合每个模型，测试数据用于评估模型。为了评估每个模型预测帕金森病（Parkinson’s\
  \ disease）的效能，我们将计算准确率。该代码片段在图 8.9 中提供。\n\n\n\n\n\n如图 8.10 所示，这段代码片段生成了一个雷达图，该图允许人们检查并评估这三个模型所达到的准确程度。在雷达图中，每个模型都由一个顶点表示，该顶点到图表中心的距离作为模型准确性的的指标。距离越远，测量结果就越准确。雷达图使得对几个不同模型的准确性进行快速的视觉评估成为可能。通过调整图表的大小、线条设计、颜色以及任何其他视觉特征来适应您的喜好，是您可以个性化图表的一种方法。\n\
  \n![图 8.10 准确性对比。](img/9781032676654_C008_010.jpg)\n\n图 8.10 准确性对比。\n\n## 8.5 进一步学习\n\
  \n未来的研究和开发可以从许多方向进行。首先，我们可以研究额外的特征工程策略以进一步提高模型的性能。这些技术中的包括特征选择和降维。此外，我们还可以尝试各种机器学习算法和集成方法，以确定它们是否任何一个可以产生更优的结果。此外，收集额外数据和扩展数据集可以产生更具鲁健性和泛化能力的模型。总之，对对预测贡献最大的特征完成更深入的研究和调查，可能会为在该在该中工作的医疗专业人士提供重要的见解。我们可以通过实施和实验各种方法和模型，继续完善并提高我们通过使用机器学习实现的帕金森病检测的准确性和可靠性。\n\
  \n## 8.6 结论\n\n本章目的是概述一个使用帕金森病检测数据集的机器学习实验。在通过多项式变换完成离群值分析和特征工程后，对数据集进行了进一步处理。预处理后的数据被应用于三种不同的机器学习模型，即：线性判别分析\
  \ (LDA)、线性回归和决策树分类。在计算并比较各种模型的准确率得分后，我们得出了结论。LDA 的准确率估计为 89.18%，线性回归的准确率也与 LDA 相同为\
  \ 89.18%，而决策树分类器的准确率为 86.48%。基于这些发现，我们认为 LDA 和线性回归模型在预测帕金森病是否存在方面的表现显著优于其他模型（即决策树分类器）。另一方面，可能需要额外的研究和测试，以确定哪个模型最适合这个特定的数据集。\n\
