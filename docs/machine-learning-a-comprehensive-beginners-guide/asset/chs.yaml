  \ gradient boost classifier for pancreas cancer prediction. Journal of Imaging,\
  \ 9.\n\n\n\n\n为了为了理解和易读性和可访问性，让我们根据从 Kaggle 网站获取的信息为我们的列赋予实际名称，如图 20.3 所示。\n\n![图\
  \ 20.3 为了清晰起见。](img/9781032676654_C020_003.jpg)\n\n图 20.3 为了清晰起见。\n\n现在我们丢弃所有不需要的列，如“id”、“query”、“date”和“user_id”。然后，我们将\
  \ `sentiment` 列中存在的唯一值 `0` 和 `4` 分别映射为 `Negative`（负）和 `Positive`（正），正如图 20.4 所示。\n\
  \n![图 20.4 删除不需要的列。](img/9781032676654_C020_004.jpg)\n\n图 20.4 删除不需要的列。\n\n## 20.3\
  \ 文本清洗与分词\n\n我们首先导入了文本清洗、填充和分词所需的库。如图 20.5 所示，还导入了正则表达式（`regex`）模块，这将允许我们进行文本操作。然后我们对文本进行清洗，移除\
