  \ Prime 大使。他是 IEI 学员、IETE 学员以及 IEEE 高级会员。\n\n\n\n\n\n\n## P1.1 引言\n\n机器学习（`ML`）术语属于人工智能（`AI`）研究领域，几十年来它一直在我们周围引起热烈讨论。我们中的大多数人可能可能已经尝试过至少通过一次\
  \ `google` 搜索来理解“这个词在层面的抽象含义是什么”。即使你没有这样做，也不要担心，你现在处于正确的地点，可以从技术角度深入学习“什么是机器学习？”本章的意图并不仅于此；是的，我们将更深入地探讨机器学习的各种类型、它在现实场景中的应用，以及\
  \ `ML` 与深度学习（`DL`）之间的区别。\n\n## P1.2 什么是机器学习？\n\n好了，让我们回到你的童年。你还记得在开始学会走路之前摔倒过多少次吗？这对你来说可能是一个遥远的回忆了——我们应该把这个问题问给你的父母。让我们考虑一个例子，你现在可能还记得。我们每个人都有一位最喜欢的幼儿园老师，他们对你非常温柔且耐心。是的，我特意使用了“耐心”这个词。你知道为什么！我仍然记得我的幼儿园老师是如何教我什么是苹果的。她带了一个真正的苹果交给我，让我体验并告诉我那是苹果。事实上，她这样做持续了一周。见图\
  \ P1.1。\n\n![图 P1.1 老师向学生展示一周什么是苹果？](img/9781032676685_C000_001.jpg)\n\n图 P1.1b)老师向学生展示一周什么是苹果？\n\
  \n下周周她带了一个西红柿和一个苹果，让我告诉哪一个是苹果。我毫不犹豫地指出了苹果（见图 P1.2）。\n\n![图 P1.2 老师测试学生是否认识苹果](img/9781032676685_C000_002.jpg)\n\
  \n图 P1.2b)老师测试学生是否认识苹果。\n\n现在让我们回到重点：你认为老师做了什么让学生能很好地识别它？是的，老师耐心地用一个真正的苹果`训练`了学生，苹果的特征如它的红色、圆形以及内部洁白坚硬的属性；这些都被正确地记录了下来。学生积累的这种智能帮助了他们在`测试`阶段从西红柿这种不同的水果中识别出苹果。（顺便说，我们没有提供虚假信息：根据\
  \ Britannica.com 的建议，西红柿被营养学家视为蔬菜。）\n\n所以，让我们再次讨论这个问题：“什么是机器学习？”它与上面的例子有什么关系？现在仔细回答这个问题，从机器学习的字面意思是，我们正试图让机器学习。是的，我们将已知数据输入机器中并对其进行`训练`。一旦机器训练得当，我们将`测试`机器，看看它是否能够帮助提供恰当的答案。我们可以一直训练机器，直到它为我们提供最优化的结果。\n\
  \n噢，就这样。不是吗？机器学习现在变得非常简单且易理解了。\n\n\n\n\n图 P1.3 以简单的方式描绘了机器学习的过程。机器接收一张苹果的照片作为输入，手动提取苹果的特征并利用这些信息进行学习。这基本上是通过各种机器学习算法完成的，这些算法可以创建\
  \ ML 训练模型。为该 ML 训练模型提供测试数据，以检查模型预测是否准确。这里需要注意的主要点是，在任何机器学习过程中，特征提取都是非常重要的，并且会在没有人工干预的情况下完成。\n\
  \n![图 P1.3 机器学习过程。](img/9781032676654_C000_003.jpg)\n\n图 P1.3 机器学习过程。\n\n## P1.3\
  \ AI、ML 与 DL 之间的关系\n\n人工智能（AI）是一个广泛的研究领域，研究人员们开始思考如何将智能引入机器。你们可能都听说过 Sophia，它是首位拥有沙特阿拉伯国籍的人形机器人。唐云（Tang\
  \ Yu）是一位 AI 驱动的虚拟机器人 CEO，被任命用于优化运营效率。元宇宙中 AI 的整个概念围绕着一个事实：人们不需要面对他们在现实环境中所面临的任何现实风险。参见图\
  \ P1.4。\n\n![图 P1.4 人形机器人 Sophia、Robert CEO 唐云以及元宇宙中的 AI。](img/9781032676654_C000_004.jpg)\n\
  \n图 P1.4 人形机器人 Sophia、Robert CEO 唐云以及元宇宙中的 AI。\n\n在 AI 时代，ML 是 AI 的一个美妙子集，它允许在没有任何明确干预的情况下执行特定任务。将过去的数据提供给系统；系统提取特征并从识别出的模式中学习。从模式中得出某些推理，并据此做出智能决策。机器学习算法是自动自适应的，因此模型的学习过程不需要明确的人工干预。特征提取是整个过程中的重要步骤，有助于模型适地预测或分类数据。\n\
  \n深度学习（DL）是 AI 的一个高级子集，它在处理和理解数据方面模拟了人类大脑。神经网络倾向于成为深度学习的基础，它们主要像一个黑盒一样获取数据并产生出色的见解。解释来自深度神经网络的结果需要良好的分析技能，以便获得的输出对某些其他有用应用具有意义。\n\
  \n图 P1.5 展示了 AI、ML 和 DL 之间的正确关系。AI 的一些主要应用如自然语言处理（NLP）、通过可视化技术进行的视觉感知、如无代码之类的自动化编程平台、用于繁重工作和家务工作的\
  \ AI 驱动机器人、知识表示和推理都是属于 AI 的主要应用。\n\n![图 P1.5AI、ML、DL 的关系。](img/9781032676654_C000_005.jpg)\n\
  \n图 P1.5AI、ML、DL 的关系。\n\n机器学习有许多算法，如回归、分类、主成分分析、聚类等，用于从使用创建的模型分析的数据中发现推理。通过深度学习，可以利用\
  \ `CNN`（卷积神经网络）、`RNN`（循环神经网络）、`GAN`（生成对抗网络）、自动特征提取以及预测或分类等算法，实现神经网络中的多层感知器的的使用。各种算法类别的演进过程如图图\
  \ P1.6 所示。\n\n![图 P1.6 每一类算法如何随时间演进。](img/9781032676654_C000_006.jpg)\n\n图 P1.6\
  \ 每一类算法如何随时间演进。\n\n## P1.4 机器学习的类型\n\n既然我们已经深入了解了机器学习在 AI 研究领域中的地位，是时候让我们来理解各种类型的机器学习算法了。机器学习算法主要分为以下三类；然而，为了深入理解，我们添加了第四类（参见图\
  \ P1.7）。\n\n![图 P1.7 机器学习算法的类型。](img/9781032676654_C000_007.jpg)\n\n图 P1.7 机器学习算法的类型。\n\
  \n- 监督学习\n- 无监督学习\n- 强化学习\n- 进化学习\n\n让我们通过简单的例子更深入地观察这些。\n\n## P1.5 监督学习算法\n\n该算法利用从过去收集的标记数据来训练模型，并让模型预测或分类未标记的测试数据，以检查模型是否能正确预测或分类数据。监督机器学习算法使用标记数据——这意味着什么？很简单——考虑一个例子来理解监督学习过程。\n\
  \n你被提供了一个包含猫和狗图像的数据集（图 P1.8）。数据集中的所有图像都经过了正确的标记，假设你各有 1,000 张猫和狗的照片。你正在创建一个监督学习模型，使用\
  \ 700 份标记的猫数据和 700 份标记的狗数据来训练模型。你留了 300 张猫和狗图像作为测试数据（图 P1.9\n\n图 P1.8 示例 - 猫和狗的标记训练数据集。\n\
  \n![图 P1.9 命名为 cat_dog_1 和 cat_dog_2 的测试数据集。](img/9781032676654_C000_009.jpg)\n\n\
  图 P1.9 命名为 cat_dog_1 和 cat_dog_2 的测试数据集。\n\n由于我们现在理解了数据集中有什么，我们将继续该过程。\n\n![图 P1.10\
  \ 完整的监督学习过程。](img/9781032676654_C000_010.jpg)\n\n图 P1.10 完整的监督学习过程。\n\n完整的监督学习过程在图\
  \ P1.10 中。在监督学习模型中，我们使用标记数据，将其输入模型进行训练，一旦模型训练完成，将测试数据输入模型进行分类或预测。模型预测的准确性通常被作为一个评估指标，以理解训练模型的效能。\n\
  \n这里需要注意的一个主要点是，如果使用错误的标记数据训练模型，模型模型会以错误的方式进行预测。因此，输入模型的训练数据需要是适当标记的。另一种可能是，如果模型没有经过某些标记数据的训练，而给出一个完全新的数据进行预测，那么准确率将非常低。这是完全可以理解的。如果你在数据集中有猫和狗并用于训练模型，如果你在测试集中给出鳄鱼，那么训练模型很有可能无法预测或错误预测数据。\n\
  \n第一个图 P1.1 老师向学生讲解苹果的例子也是监督学习的一个例子。也许你应该再次回顾那个例子，将这个概念深深地刻在脑子里。\n\n## P1.6 无监督学习算法\n\
  \n\n\n\n\n这种方法与监督学习模型不同，因为数据没有与其相关的任何标签。此外，在无监督学习方法中没有显式的训练和测试阶段。噢，这难道不让人感到困惑吗？那么模型将如何进行预测呢？是的，有方法的，我们可以通过接下来的简单示例来理解。\n\
  \n想象一个学生被给了一个包含一组狗和猫的数据集，且完全没有任何标签（图 P1.11）。每天这个数据集都会给给这个学生，一周后，学生被要求对数据集中的相似图像进行分类。你认为这个学生会做什么？学生已经看了一周不同类型的图像。这个学生应该足够聪明，能够识别出猫和狗图像的特征。到周末结束时，如果给出另一组不同的图像，显然凭借他通过映射狗和猫特征过程所积累的集体知识，这个学生至少能在某种程度上正确地映射或分组猫和狗图像。是的，确实有一些可爱的狗看起来很像猫（注：原文此处误应为某些狗长得像猫），但我们对此无能为力，因此也可能出现一些误分类（图\
  \ P1.11）。\n\n![图 P1.11 无监督学习过程。](img/9781032676654_C000_011.jpg)\n\n图 P1.11 无监督学习过程。\n\
  \n给定一组数据，它将对它们进行分类并给出输出。每个类别被称为一个簇（cluster）。簇的标签稍后将手动标记。分类基于数据点中的特征。无监督学习算法也被称为聚类算法。考虑之前为监督学习讨论的苹果和西红柿案例。\n\
  \n## P1.7 强化学习算法\n\n强化学习算法是一种机器学习算法，它使用计算机代理来学习环境的最优行为，并采取正确的行动以获得最大奖励。这主要关于决策过程，其中获得的反馈至关重要。这是一种基于反馈的学习过程。这种学习方法用于大多数机器人和计算机游戏。在这里，输入不需要有标签的数据。相反，模型通过与环境交互并获取反馈来学习。当模型第一次做出决策时，根据反馈，模型会学习其决策是正确还是错误。因此，这种监督学习放宽了训练提供完全标签数据的任务。一个非常常见的例子是电脑象棋游戏；如果电脑在与你对弈时输了，程序将记住玩家和系统所采取的所有步骤。下一次，同样的策略在系统中将不再有效，最终玩家将输给程序。\n\
  \n噢，这些内容听起来都像希腊语和拉丁文吗？别担心，我们将用一个例子来帮助你理解这个过程。\n\n让我们来看强化学习的简单例子。考虑一位妈妈在教她的孩子，当孩子犯错时，妈妈给出反馈，这样这种反馈对他下一次就会有所帮助（图\
  \ P1.12）。\n\n![图 P1.12 强化学习。](img/9781032676654_C000_012.jpg)\n\n图 P1.12 强化学习。\n\
  \n## P1.8 演化方法\n\n这仍然处于进化中，并不是一个容易的任务。这些类型的算法将模拟自然演化来解决特定问题。例如，可以使用遗传算法来解决问题。这超出了本书的范围，因此目前暂忽略。\n\
  \n## P1.9 那么为什么我们需要机器学习？\n\n这是一个非常棒的问题，问得正是时候。是的，到此时，显然我们利用自己的经验来学习。。比方一个简单的例子，回到童年。是的，童年是一个充满经验的宝库，对吧？那么让我们用另一个例子……\n\
  \n\n\n\n\n| 仅需较少的训练数据 | 需要大量的训练数据 |\n| :--- | :--- |\n| ML 基于预先识别的特征工作 | DL 自动识别特征\
  \ |\n| 结果易于解释 | 解释结果需要一定的专业知识 |\n| ML 使用各种算法得出结论 | DL 使用神经网络得出结论 |\n\n## P1.12 ML\
  \ 常见应用\n\n*   一些你在日常生活中已经体验过的常见 ML 应用场景：\n*   `FB` (Facebook) 向你推荐朋友。\n*   `Amazon`\
  \ 向你推荐产品。\n*   `Flipkart` 向你推荐产品。\n*   `Netflix` 的推荐。\n*   `Netflix` 根据你的喜好向你推荐最佳剧集，但背后有\
  \ `ML` 的支持。所以，这一点很简单：有了 `ML` 的加入，公司可以发现更多获取丰厚利润的机会。这样一个场景——你正在浏览泰国假期旅游。你没有预订任何机票，甚至没有确认行程。当你登录\
  \ Facebook 账户时，你会收到与泰国假期相关的帖子。这就是 `ML` 为你提供的服务！它帮助寻找新业务机会、增加利润，且无需任何错误或人工干预。还没有操作员将那个泰国广告链接到\
  \ Facebook 页面。\n*   `ML` 的另一个主要应用领域：\n*   农业领域 – 识别作物病害。\n*   能源领域 – 预测某地区未来两个月的能源消耗情况。\n\
  *   教育领域 – 预测完成课程的学生人数以及市场上的职位空缺。\n*   政府部门 – 使用了许多与 `ML` 的应用，例如从获取的人脸图像中识别并提取唯一身份号码用于识别目的。\n\
  *   金融领域、媒体领域、零售领域、智能家居和电信也是我们经常使用机器学习概念的其他领域。\n\n好了，我们已经理解了机器学习的基础知识，这本书旨在让读者深入了解如何构建一些酷的机器学习项目。所有这些项目都易于实现，并且有助于清晰地理解\
  \ `ML` 概念/算法。我们提供了数据集、代码和清晰的解释，以确保读者拥有顺畅的学习体验。\n\n此外，我们还使用了 `Intel oneAPI` 作为平台来实现一些\
  \ `ML` 项目。通过这种方法，读者将了解 `oneAPI`，清晰地学习 `Intel Developer Cloud`，并通过 `oneAPI` 了解优化后的库和增强框架的使用。不仅要编程，还要确保代码以优化的方式编写，这是重要的。\n\
  \n接下来的章节旨在让你获取关于 `oneAPI` 的知识。\n\n## P1.13 什么是 oneAPI？\n\n什么是 `oneAPI`？嗯，这是许多技术爱好者、学习者、教师、行业从业者以及技术领域每个人提出的问题。本章旨在提供\
  \ `oneAPI` 到底是什么、为什么关于 `oneAPI` 有这么多讨论、`oneAPI` 可以提供什么等信息（注意：是 `oneAPI` 而不是 `OneAPI`）。让我们先了解全球软件开发者面临的问题。首先，最近专门化工作负载出现了巨大增长。其次，每种硬件需要使用不同的编程语言和相关库。这增加了维护不同代码库和仓库的挑战。第三，虽然工具的增加被视为一种优势，但对于开发者来说，学习使用不同的工具也是一种挑战，特别是考虑到所需的学习时间。我们在这里指的是解决针对\
  \ `CPU`、`GPU` 和 `FPGA` 等不同硬件平台开发软件的问题。\n\n\n\n\n\noneAPI 非常有趣。它为开发人员提供了两种编程选项：一种是直接编程，另一种是基于\
  \ API 的编程。此外，DPC++ 还提供了与 oneAPI 兼容的工具和调试工具（图 P1.18）。\n\n![图 P1.18 编程模型。](img/9781032676654_C000_018.jpg)\n\
  \n图 P1.18 编程模型。\n\n*   对于正在使用 `CUDA` 且需要将现有 `CUDA` 代码（`CUDA Source Code`）迁移到 `DPC++`（`DPC++\
  \ Source Code`）的开发者来说，现在通过 oneAPI 变得更容易。oneAPI 提供了 `intel DPC++ Compatibility Tool**，可以让你轻松地将源代码从\
  \ `CUDA` 迁移到 `DPC++`。在迁移过程中提供了大量的帮助，几乎 80% 到 90% 是自动完成的。最棒的部分是，它还以易于理解的方式提供了“内联注释”，以便开发者完成移植。\n\
  \n*   `intel oneAPI DPC++ / C++ compiler` 非常强大，并支持直接编程。当算法没有可用 API 时，就会采用这种方法。读者将看到更多关于直接编程的细节。对于直接编程，`Data\
  \ Parallel C++`（或 `DPC++`）是 `C++` 的演进，旨在实现高效的数据中心型编码，目标针对 CPU、GPU、FPGA 和 AI 加速器。\n\
  \n*   下一种方法是基于 API 的编程。有一个巨大的库集，满足不同的领域和区域。库的细节将在后续章节中介绍。开发者可以直接使用它们，没有任何任何挑战。读者很快就能找到关于这些库的大量信息。\n\
  \n*   最后，在图 P1.18 中你还可以看到我们拥有如 `intel VTune Profiler` 和 `Intel Advisor` 等工具，它们可以帮助分析性能。\n\
