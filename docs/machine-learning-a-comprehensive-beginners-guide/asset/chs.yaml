  \n不同的机器学习算法对特征的量级可能有不同的要求。在这一步中，我们将使用 scikit-learn 中的 `StandardScaler` 工具对特征进行缩放，使其平均值为零，方差为一（图\
  \ 4.8）。我们使用 scikit-learn 包含的 `StandardScaler` 类对特征数据进行归一化，以便我们进行公平的比较，并防止某些特征对模型产生过大影响。我们首先对训练数据进行缩放拟合，然后使用学习到的缩放因子来改变训练数据和测试数据。\n\
