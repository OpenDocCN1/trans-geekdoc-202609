  \ of Operational Research, *23*(1), pp.5–13.\n\n# 第 12 章 作物推荐预测\n\nDOI: [10.1201/9781032676685-13](http://doi.org/10.1201/9781032676685-13)\n\
  \n## 学习目标\n\n在本章结束，读者将能够：\n\n*   通过集成学习方法解决作物推荐挑战。\n*   构建并整合数据分析和预测建模。\n\n## 12.1\
  \ 引言\n\n本章讨论了通过集成学习方法解决作物推荐面临的挑战。我们根据给定的土壤和环境属性预测最合适的作物。可以通过此链接访问数据集：[www.kaggle.com/datasets/atharvaingle/crop-recommendation-dataset](http://www.kagglecom)。该项目为精准农业的下一阶段奠定了道路，技术与耕作相结合，改变了作物选择和种植的方式，以实现产量最大化和生态和谐。这项研究通过整合数据分析、预处理和预测建模实现了这一目标。\n\
  \n## 12.2 数据预处理\n\n导入必要的库可以更方便地操作数据、可视化、开发和评估模型。`Pandas`、`numpy`、用于可视化的 `matplotlib`\
  \ 以及来自 `scikit-Learn` 的许多分类器就是这些包（参见图 12.1）。\n\n![图 12.1 导入必要库的代码片段。](img/9781032676654_C012_001.jpg)\n\
  \n图 12.1 导入必要库的代码片段。\n\n然后我们使用如图 12.2 所示的 `pd.read_csv` 将数据集加载到变量 `data` 中。\n\n\
  ![图 12.2 加载数据集的代码片段。](img/9781032676654_C012_002.jpg)\n\n图 12.2 加载数据集的代码片段。\n\n\
  加载数据集后，我们使用 `pandas` 库中如图 12.3 所示的 `head()` 函数。该函数将打印数据集的前五行。此步骤之后我们对数据集有了清晰的了解。我们的数据中有八列，`label`\
  \ 列是目标值，需要编码。\n\n![图 12.3 使用 head() 函数。](img/9781032676654_C012_003.jpg)\n\n图 12.3\
  \ 使用 head() 函数。\n\n为了找到数据集每列中的缺失值或空值，我们使用 `isnull().sum()` 函数统计空值。我们的数据集中没有缺失值（参见图\
  \ 12.4）。\n\n![图 12.4 在数据集中查找缺失值。](img/9781032676654_C012_004.jpg)\n\n图 12.4 在数据集中查找缺失值。\n\
  \n之前我们发现需要对 `label` 列编码。我们使用 `scikit-learn` 中的 `LabelEncoder`（https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.LabelEncoder.html），如图\
  \ 12.5 所示。该方法使用唯一数值将类别转换为数值。结果数据集存储在名为 `label_encoded` 的变量中。然后我们创建两个变量 `X` 和 `y`。在\
  \ `X` 中存储所有特征并删除目标变量，在 `y` 中只存储目标变量。\n\n![图 12.5 编码 label 列。](img/9781032676654_C012_005.jpg)\n\
  \n图 12.5 编码 label 列。\n\n## 12.3 数据划分\n\n我们在上一步中已经将数据集分离为 `X` 和 `y`，现在我们使用 `scikit-learn`\
  \ 中的 `train_test_split` 函数将数据集划分为训练集和测试集。如，`X` 和 `y` 分别包含特征矩阵和目标向量。测试集大小为 20%，训练集大小为\
  \ 80%，如图 12.6 所示。`random_state` 设置了可复现的种子。\n\n![图 12.6 划分数据集的代码片段。](img/9781032676654_C012_006.jpg)\n\
  \n图 12.6 划分数据集的代码片段。\n\n## 12.4 初始化基础分类器和袋法模型\n\n对于建模，我们使用了自助聚合法（也称为袋法），这是一种提高模型准确性和性能的集成学习技术。这是通过结合多个基础模型的预测来使整体预测更准确。\n\
  \n使用的基础分类器是 `KNN`、`SVC` 和逻辑回归模型，它们将作为袋法集集的弱学习器。`n_estimators` 指定了基础分类器的数量。这将允许模型学习寻找优化解决方案和多样化误差，从而增强整体性能。代码片段参见图\
  \ 12.7。\n\n![图 12.7 初始化基础分类器的代码片段。](img/9781032676654_C012_007.jpg)\n\n图 12.7 初始化基础分类器的代码片段。\n\
  \n## 12.5 训练\n\n我们启动一个循环，用于训练和评估由我们初始化的一系列袋法模型。我们使用 `fit` 方法训练数据，并使用 `predict` 方法预测目标。所有模型的准确率都经过计算并存储在名为\
  \ `accuracies` 的列表中，如图 12.8 所示。\n\n![图 12.8 模型训练与评估。](img/9781032676654_C012_008.jpg)\n\
  \n图 12.8 模型训练与评估。\n\n## 12.6 评估与比较\n\n如图 12.9 所示，创建了一个名为 `model_names` 的列表，并在存储了三个模型名称。\n\
  \n![图 12.9 用于绘图的模型。](img/9781032676654_C012_009.jpg)\n\n图 12.9 用于绘图的模型。\n\n\n\n\n\
  最后，我们生成了如图 12.10 所示的状图，以直观地比较不同模型的准确率。图中的每个柱条代表不同的模型及其准确率。对于该数据集，逻辑回归是性能最好的模型。\n\
  \n![图 12.10 准确率对比。](img/9781032676654_C012_010.jpg)\n\n图 12.10 准确率对比。\n\n## 12.7\
  \ 结论\n\n本章对集成学习、装袋法（bagging）和模型评估进行了深入讲解，为各个领域的明智决策奠定了基础。通过实现更精确、有效的农业作业，将集成方法应用于作物推荐，是机器学习如何改变农业的一个示例。\n\
  \n## 12.8 进一步学习\n\n考虑探索更复杂的集成技术，如`Random Forests`（随机森林）和`Gradient Boosting`（梯度提升），这些技术通过组合决策树提供了更高的预测能力，以便在作物推荐领域进行进一步发展。探索特征工程以从农业数据中获取见性信息，并进行超参数优化以增强模型效率。\n\
  \n## 建议阅读\n\n*   `sklearn.preprocessing.LabelEncoder`, scikit-learn 1.4.1, [`scikit-learn.org/stable/modules/generated/sklearn.preprocessing.LabelEncoder.html`](https://scikit-learn.org)\n\
  \n# 第 13 章 脑肿瘤分类\n\nDOI: [10.1201/9781032676685-14](http://doi.org/10.1201/9781032676685-14)\n\
  \n## 学习目标\n\n在结束本章后，读者将能够：\n\n*   借助深度学习模型解决图像分类问题。\n*   训练、测试和分类机器学习模型。\n\n## 13.1\
  \ 引言\n\n本章的主要目标是向读者演示如何通过开发深度学习模型来解决图像分类问题。医疗图像分类是医疗领域的关键部分。如果能对疾病进行识别和分类，就可以进行更好的诊断和治疗。这将拯救生命，特别是在早期发现脑癌时。该项目使用一组脑肿瘤\
  \ MRI 图片作为其数据集。它包含了不同类型肿瘤的图片以及没有肿瘤的图片。该集合为我们训练和测试机器学习模型提供了一种很好的方法。此任务使用了来自 Kaggle\
  \ [www.kaggle.com/datasets/sartajbhuvaji/brain-tumor-classification-mri](http://www.kaggle.com)\
  \ 的数据集集。对于这项分类工作，我们使用了`VGG16`和`ResNet50`，它们都是著名的架构。模型将被教如何将 MRI 图片分为四个不同的组：`glioma_tumor`（胶质瘤）、`meningioma_tumor`（脑膜瘤）、`no_tumor`（无肿瘤）和`pituitary_tumor`（垂体瘤）。\n\
  \n## 13.2 数据预处理\n\n我们从导入分类任务所需的库开始。该模块将为我们提供与文件路径、字典等交互的方法。导入`numpy`处理数值运算，`matplotlib`用于可视化和绘图。然后我们导入了`tensorflow`模块，它允许我们训练神经网络。接着是来自`keras`的两个预训练模型`VGG16`和`ResNet50`。`Sequential`是一个通过逐层构建\
  \ DNN 模型的 API。`GlobalAveragePooling2D`和`Dense`是层，而`Dropout`用于防止过拟合。所有内容可在图 13.1\
  \ 中看到。\n\n![图 13.1 导入必要的库。](img/9781032676654_C013_001.jpg)\n\n图 13.1 导入必要的库。\n\n\
  然后我们安装`opendasets`命令来下载公开的数据集。之后我们可以从网上获取数据集（参见图 13.2）。\n\n![图 13.2 收集数据集的代码片段。](img/9781032676654_C013_002.jpg)\n\
  \n图 13.2 收集数据集的代码片段。\n\n然后我们导入`opendasets`库作为`od`。我们使用来自 aggle 的链接下载脑肿瘤分类。在这一步骤之前，确保你下载了\
  \ Kaggle 的凭据。必要的步骤在图 13.3 中提供。\n\n![图 13.3 导入库。](img/9781032676654_C013_003.jpg)\n\
  \n图 13.3 导入库。\n\n声明了两个不同的变量`data_dir`和`classes`，其中`data_dir`包含训练数据的路径，`classes`包含图像分类任务的标签列表。此处的代码片段见图\
  \ 13.4。\n\n![图 13.4 定义路径的代码片段。](img/9781032676654_C013_004.jpg)\n\n图 13.4 定义路径的代码片段。\n\
  \n我们从脑肿瘤类别的测试图片中生成可视化显示，如图 13.5 所示。\n\n![图 13.5 测试图片的可视化显示。](img/9781032676654_C013_005.jpg)\n\
  \n图 13.5 测试图片的可视化显示。\n\n在这一步中，我们为训练模型设置了两个超参数：`batch_size`和`epochs`。相同的见图 13.6。`batch_size`定义了在训练阶段在前向和反向传播期间使用的样本数量。`epochs`定义了更新模型权重的次数。我们必须注意，大量的\
  \ epochs 会导致过拟合。同样，训练次数会导致欠拟合。\n\n![图 13.6 设置超参数。](img/9781032676654_C013_006.jpg)\n\
  \n图 13.6 设置超参数。\n\n我们使用`ImageDataGenerator`类来清理和添加数据，并为训练集和验证集制作两个数据生产者。`ImageDataGenerator`以缩放、旋转等不同方式更改图像以增加我们集合的多样性。`flow_from_directory`用于为训练集制作`train_generator`。它在`data_dir`目录下查找所有训练图片。目标图片的大小设置为`(224,\
  \ 224)`，这与`VGG16`和`ResNet50`等模型的输入尺寸相同。`class_mode`设置为`categorical`是因为我们有多个类别。根据`validation_split`参数，通过将参数设置为`training`来选择数据的训练部分。我们制作了与`train_generator`设置相同的验证数据生成器。代码片段参阅图\
  \ 13.7。\n\n![图 13.7 数据预处理与增强。](img/9781032676654_C013_007.jpg)\n\n图 13.7 数据预处理与增强。\n\
  \n## 13.3 建模\n\n我们继续创建一个基于`VGG16`的神经网络模型，如图 13.8 所示。我们通过设置权重进行初始化，排除输出层并指定与输入图像匹配的输入形状，然后按顺序堆叠所有层。最后，我们编译模型。\n\
  \n![图 13.8 创建一个 VGG16 模型。](img/9781032676654_C013_008.jpg)\n\n图 13.8 创建一个 VGG16\
  \ 模型。\n\n按照之前的相同步骤，`ResNet50`（Mukti and Biswas, 2019）模型也按照图 13.9 提供的过程进行初始化。\n\n\
  ![图 13.9 创建一个 ResNet50 模型。](img/9781032676654_C013_009.jpg)\n\n图 13.9 创建一个 ResNet50\
  \ 模型。\n\n通过调用`fit`方法，我们开始训练`VGG16`模型（Qassim et al., 2018）。如图 13.10 所示，该代码将使用训练数据生成器训练模型，并使用验证数据生成器验证模型\
  \ 20 个 epochs。\n\n\n\n\n使用与之前相同的方法，我们也训练了 `ResNet-50` 模型，如图 13.11 所示。\n\n![图 13.11\
  \ 训练 ResNet-50 模型。](img/9781032676654_C013_011.jpg)\n\n图 13.11 训练 ResNet-50 模型。\n\
  \n## 13.4 训练准确率比较\n\n使用上述代码生成了如图 13.12 所示的折线图。X 轴表示训练轮数（epochs），Y 轴表示准确率。\n\n![图\
  \ 13.12 训练准确率图。](img/9781032676654_C013_012.jpg)\n\n图 13.12 训练准确率图。\n\n对基于 VGG16\
  \ 的模型进行了训练和评估，得到如下结果：\n\n*   训练准确率：73.66%\n*   验证准确率：69.28%\n\n对基于 ResNet50 的模型也进行了训练和评估，得到以下结果：\n\
  \n*   训练准确率：95.17%\n*   验证准确率：72.60%\n\n## 13.5 结论\n\n本章的发现强调了深度学习模型（特别是 VGG16 和\
  \ ResNet50）在基于 MRI 扫描的脑脑肿瘤分类中的实用性。两个模型都获得了令人鼓励的训练准确率水平，表明它们能够通过研究医学图像来获取相关特征。\n\n\
  ## 13.6 未来工作\n\n该领域进一步的研究可能课题包括：\n\n*   使用独立的测试集对模型性能进行详细评估。\n*   调整模型的超参数以获得最佳的泛化性能。\n\
  *   允许对模型决策进行洞察研究的可解释性方法。\n*   将训练好的模型作为医疗诊断系统的组成部分进行实现，并辅以详尽的临床验证。\n\n机器学习在医疗诊断中的应用蕴含着巨大的未开发潜力，使得在该领域进行持续研究对于推进患者护理至关重要。\n\
