  \ 5.7 结论\n\n通过使用 Kaggle 的数据集，我们可以得出引人入胜的结论：花卉识别是一项值得的研究工作。我们利用深度学习和 TensorFlow 的力量训练了一个卷积神经网络（CNN）模型。该模型能够将花卉照片分类为五个不同的类别：雏菊、蒲公英、玫瑰、向日葵和郁金香。我们还让读者熟悉了\
