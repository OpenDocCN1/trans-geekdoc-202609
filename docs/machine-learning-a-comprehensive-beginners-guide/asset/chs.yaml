  ## 11.7 结论\n\n通过“酒店预订数据集”的探索和预测代码之旅，酒店业中数据驱动决策的力量已经显露出来。通过对数据集进行细致分析，我们获得了关于预订模式、客户偏好和市场类别的宝贵意见。探索性数据分析（EDA）的使用发现了了隐藏的模式，这有助于我们理解许多特征之间复杂的动态关系。我们通过对数据集进行细致的预处理（包括处理缺失值和对类别变量编码），确保了数据集已做好预测建模。\n\
  \n## 11.8 进一步学习\n\n在未来，除了简单的袋法（bagging），我们可能会研究其他的集成学习方法。这些可能包括提升（boosting，也称为 AdaBoost\
  \ 和梯度提升）和堆叠（stacking），这两者都有大幅提高模型性能和鲁棒性的潜力。加深在特征转换和选择方面的专业知识有助于提高模型的解释性和预测能力。甚至特征工程和选择也能对此帮助。\n\
