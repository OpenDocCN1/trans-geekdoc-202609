  \ 中。\n\n![图 19.9 构建 Vgg16 模型。](img/9781032666654_C019_009.jpg)\n\n图 19.9 构建 Vgg16\
  \ 模型。\n\n![图 19.10 编译模型。](img/9781032676654_C019_010.jpg)\n\n图 19.10 编译模型。\n\n模型的测试准确率使用验证数据生成器上的\
  \ `evaluate()` 方法进行评估，如图 19.11 所示。\n\n![图 19.11 计算准确率。](img/9781032676654_C019_011.jpg)\n\
  \n图 19.11 计算准确率。\n\n## 19.5 模型评估与可视化\n\n`ResNet` (Mirza et al., 2023) 和 `VGG16`\
  \ (Bakasa and Viriri, 2023) 模型的测试准确率使用柱状图绘制，如图 19.12 所示，以便视觉比较。我们创建了一个列表来存储两个模型的名称。然后创建了准确率列表，存储两个模型的测试准确率。可以看出，`ResNet`\
  \ 模型表现出优越的性能，验证准确率为 `81.10%`，而 `Vgg16` 的验证准确率为 `75.30%`。这一发现表明 `ResNet` 在验证集上表现出更好的泛化性能，意味着它在收集花卉分类任务所需基础信息方面是有效的。最后，绘制了柱状图。\n\
  \n![图 19.12 模型评估与可视化。](img/9781032676654_C019_012.jpg)\n\n图 19.12 模型评估与可视化。\n\n\
  ## 19.6 结论\n\n在花卉分类领域，我们的模型取得了巨大的成功。`ResNet` 和 `VGG16` 采用深度学习方法，成功识别了花卉标品的复杂细节，达到了显著的精确水平。本章证明了复杂算法与自然界内在美学特性的结合。模型区分`Lilly`百合、`Lotus`莲花、`Orchid`兰花、`Sunflower`向日葵以及`Tulip`郁金香与其对应品种的能力，体现了技术与花卉艺术的融合。\n\
  \n## 19.7 进一步学习\n\n当我们展望未来时，出现了许多可能性。投入到精炼模型的过程中、研究如 `DenseNet` 和 `Inception` 等复杂的架构，以及探索可解释\
  \ AI 领域提供了迷人的机会。此外，这些模型在实际情境中的应用（例如园艺领域花卉的自动识别）也显示出巨大的潜力。这段旅程并未此结束，而是经历了一场蜕变，引导我们进入不断发展的深度学习领域中未开发的边界。\n\
