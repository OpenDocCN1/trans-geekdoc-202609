  \ on Electrical Information and Communication Technology (EICT) (pp.1–6). IEEE.\n\
  *   Qassim, H., Verma, A. and Feinzimer, D., 2018, January. Compressed residual-VGG16\
  \ CNN model for big data places image recognition. In 2018 IEEE 8th Annual Computing\
  \ and Communication Workshop and Conference (CCWC) (pp.169–175). IEEE.\n\n# 第 14\
  \ 章 使用 oneAPI 在葡萄酒质量数据集上进行探索性数据分析和分类\n\nDOI: [10.1201/9781032676685-15](http://doi.org/10.1201/9781032676685-15)\n\
  \n## 学习目标\n\n阅读本章后，读者将能够：\n\n*   通过开发预测模型，获得通过机器学习技术检查葡萄酒质量并进行分类的知识。\n*   获取有关探索性数据分析的信息。\n\
  \n## 14.1 引言\n\n本研究涉及利用机器学习技术对葡萄酒质量和分类进行详尽检查。我们的方法建立在探索性数据分析（也称为 `EDA`）的基础之上。我们使用\
  \ `EDA` 对数据集的复杂性进行详尽调查，这使我们能够发现隐藏的模式。我们研究的主要目标是利用包含多种参数的数据集开发预测葡萄酒质量的模型。为了完成这项任务，第一步是导入数据处理、可视化和机器学习所需的库。这些库包括\
  \ `pandas`、`numpy`、`matplotlib`、`seaborn` 和 `scikit-learn`。加载来自 kaggle [`www.kaggle.com/datasets/yasserh/wine-quality`](https://www.kaggle.com/datasets/yasserh/wine-quality)\
  \ 的数据集 `WineQT.csv`。\n\n## 14.2 探索性数据分析 (EDA)\n\n我们进行探索性数据分析（也称为 EDA），以获得对数据集的全面的理解。在这个过程中，我们创建直方图、箱线图和矩阵图等可视化图，以发现模式、关系和潜在的异常值。提供的\
  \ `pandas`、`seaborn` 和 `matplotlib` 对本章至关重要，图 14.1 主要导入了这些库。接下来，使用 `pd.read_csv`\
  \ 函数从 Kaggle 导入 `WineQT.csv`，存储在 pandas DataFrame 中。然后使用 `.head()` 函数查看前五行。为了对数值列进行全面检查，我们利用\
  \ `describe()` 函数获取统计量，如均值、标准差、最小值、最大值和计数。现在，使用 `sns.histplot` 函数生成直方图，代表酒精的分布。此外，利用\
  \ `sns.boxplot` 生成箱线图，表示数据中的离散程度、偏度和异常值的存在。\n\n\n\n\n图 14.7 饼图显示。\n\n汇总多个不同变量之间的相关系数的表格被称为相关矩阵。在统计和数据分析领域，这是一种用于同时调查众多变量之间相关性的典型方法。通过使用\
  \ `data.corr()` 函数，可以如图 14.8 所示创建数据集的相关矩阵。然后，利用 `sns.heatmap` 包构建热力图，以可视化各种特征之间的相关性。\n\
  \n![图 14.8 相关矩阵热力图创建。](img/9781032676654_C014_008.jpg)\n\n图 14.8 相关矩阵热力图创建。\n\n\
  ## 14.3 数据预处理与划分\n\n我们使用如图 14.9 所示的 `isnull().sum()` 命令来查看集中存在的空值。这里没有空值。\n\n![图\
  \ 14.9 在数据集中查找空值。](img/9781032676654_C014_009.jpg)\n\n图 14.9 在数据集中查找空值。\n\n处理数据集的下一步是将其分为训练集和测试集。我们转向\
  \ `sklearn` 库中的 `train_test_split` 函数来实现这一目标。首先，将所有特征输入变量 `X`，将目标列输入变量 `y`。两集的特征数据和目标数据分别存储在变量\
  \ `X_train`、`X_test`、`y_train` 和 `y_test` 中。使用 `sklearn` 中的 `compute_class_weight`\
  \ 函数进行计算以确定类别权重，从而解决类别不平衡问题。它使用了“balanced”技术并为训练数据包含的每个类别计算权重。请参阅图 14.10。\n\n![图\
  \ 14.10 特征分离与数据集划分。](img/9781032676654_C014_010.jpg)\n\n图 14.10 特征分离与数据集划分。\n\n\
  #### 建模\n\n之后，我们使用称为合成少数类过采样技术（SMOTE）的技术，如图 14.11 所示对训练数据中的少数类进行过采样。这允许我们获得更准确的结果。它利用了\
  \ `imblearn` 库中的 `SMOTE` 类。然后，我们分别通过采用 `Random Forest`、`Decision Tree` 和 `Gradient\
  \ Boosting` 分类器生成列表并初始化每个模型。这些模型将经历训练和测试。此外，为了获得优的整体性能，每个模型都使用 oneAPI 进行了调优。在这种情况下，我们使用\
  \ `one` 分析库（缩写为 `DAL`）进行优化。优化说明在红色高亮单元格下方弹出的通知中解释。\n\n![图 14.11 对训练数据中的少数类进行过采样。](img/9781032676654_C014_011.jpg)\n\
  \n图 14.11 对训练数据中的少数类进行过采样。\n\n为了显示结果，我们首先生成一个空字典，然后将其赋值给名为 `results` 的变量，如图 14.12\
  \ 所示。我们训练模型的准确率得分将存储在这里。在遍历所有模型后，循环在处理模型的过程中将相关结果插入 `results` 字典中。\n\n![图 14.12\
  \ 显示结果。](img/9781032676654_C014_012.jpg)\n\n图 14.12 显示结果。\n\n## 14.5 模型比较与可视化\n\n\
  此循环打印存储在 `results` 字典中的每个模型的准确率得分。图 14.13 说明了相同的内容。\n\n![图 14.13 训练与评估。](img/9781032676654_C014_013.jpg)\n\
  \n图 14.13 训练与评估。\n\n在本节中，我们将通过 `sns.barplot` 包生成如图 14.14 所示的条形图，评估多个不同模型的准确性。为了进行比较，我们参考了保存在\
  \ `results` 字典中的准确率得分。\n\n![图 14.14 模型准确率比较。](img/9781032676654_C014_014.jpg)\n\n\
  图 14.14 模型准确率比较。\n\n## 14.6 结论\n\n在这里我们对本章最重要的发现和结果进行了概述。我们解释了整个章节过程中遇到的任何限制或困难，并对机器学习模型的预测准确性进行了评论。此外，我们还研究了模型可行性。\n\
  \n## 14.7 进一步学习\n\n我们通过推荐项目可以扩展或改进的领域来鼓励额外学习。希望这能启发你继续自己的学习。对于兴趣深入研究机器学习和数据分析的读者，我们提供了额外的资源或课程。此外，我们对额外的研究或方法提供了建议，用以提高模型提供的准确性或见解。\n\
  \n# 第 15 章使用 oneAPI 优化的深度学习模型进行猫狗分类\n\nDOI: [10.1201/9781032676685-16](http://doi.org/10.1201/9781032676685-16)\n\
  \n## 学习目标\n\n完成本章后，读者将能够：\n\n*   使用用于深度学习研究的数据集探索图像分类。\n*   训练并评估神经网络架构。\n\n## 15.1\
  \ 引言\n\n在本章中，我们利用 Kaggle 的 Cats vs Dogs 数据集探索图像分类的奇妙世界。可以通过以下链接访问数据集：[www.kaggle.com/datasets/shaunthesheep/microsoft-catssdogs-dataset](http://www.kaggle.com/datasets/shaunthesheep/microsoft-catssdogs-dataset)。选择比较猫和狗的数据集是因为它包含了数千张带标签的猫和狗图像，这非常适合作为深度学习研究的测试场。我们的目标是训练并评估两种强大的神经网络架构，即专有的\
  \ `Sequential` 模型和基于 VGG16 的模型，以确定在区分我们熟悉并喜爱的猫和犬类伴侣方面哪一个更优。\n\n## 15.2 数据预处理\n\n\
  我们首先导入图像分类所需的所有库。为了执行涉及数据操作的任务，导入了 `pandas` 和 `numpy` 等基础库。我们引入了 `matplotlib` 和\
  \ `seaborn` 以进行可视化。从 TensorFlow 的 Keras API 导入 `ImageDataGenerator` 类允许对图像进行初步处理。此外，为了逐层创建模型，我们导入了\
  \ `sequential`。导入了优化器 `adam`。整个代码段见图 15.1。\n\n![图 15.1 导入必要的库。](img/9781032676654_C015_001.jpg)\n\
  \n图 15.1 导入必要的库。\n\n`TensorFlow` 库用于导入神经网络模型、定义层以及进行统计和数学计算，如图 15.2 所示。红色弹出通知的出现表明\
  \ `Tensorflow` 已经使用 oneAPI 中的 `oneDNN` 包进行了优化。\n\n![图 15.2 使用 tensorflow 库。](img/9781032676654_C015_002.jpg)\n\
  \n图 15.2 使用 tensorflow 库。\n\n\n\n\n\n在提供的代码中，声明了一个名为 `training_data_dir` 的变量，并为其分配了数据目录的路径。图像的像素值通过将每个像素值除以\
  \ 225 进行了归一化。照片被加载到 `training_data_dir` 和 `test_data_dir` 中，并明确定义了 `dogs` 和 `cats`\
  \ 类别。采用了二分类模式，其中一个类别被分配标签 0，另一个类别被分配标签 1（详见图 15.3）。\n\n![图 15.3 变量声明与路径赋值。](img/9781032676654_C015_003.jpg)\n\
  \n图 15.3 变量声明与路径赋值。\n\n训练集和测试集中的批次（batches）数量均已确定，并随后如图 15.4 所示显示。\n\n![图 15.4 查找数据集中的批次。](img/9781032676654_C015_004.jpg)\n\
  \n图 15.4 查找数据集中的批次。\n\n## 15.3 自定义序列模型\n\n图 15.5 所示的代码展示了使用来自 `keras` API 的 `Sequential`\
  \ 模型构建的图像分类神经网络模型。该模型由卷积层组成，这些层通过对输入图像应用过滤器并捕捉模式来充当特征提取器。卷积之后是最大池化层（Max-pooling\
  \ layers），它们在保留关键特征的同时减小空间维度。平坦层（flattened layer）将多维输出转换为一维数组，使其适用于全连接层。丢弃（Dropout）是一种正则化技术，在训练期间随机禁用神经元以防止过拟合。最后层由密集连接（完全连接）层组成，这些层负责学习复杂模式并进行预测。输出层中的\
  \ Sigmoid 激活函数将网络输出压缩在 0 和 1 之间，使其适用于二分类任务，并指示输入数据属于特定类别的概率。这种架构通常用于图像分类任务，创建了一个能够从提供的图像数据中学习复杂模式的神经网络。\n\
  \n![图 15.5 构建模型。](img/9781032676654_C015_005.jpg)\n\n图 15.5 构建模型。\n\n我们编译了神经网络训练模型。优化器、损失函数和指标的定义如图\
  \ 15.6 所示。\n\n![图 15.6 编译模型。](img/9781032676654_C015_006.jpg)\n\n图 15.6 编译模型。\n\n\
  ![图 15.7 训练模型。](img/9781032676654_C015_007.jpg)\n\n图 15.7 训练模型。\n\n为了防止训练过程中过拟合，我们实现了带有\
  \ `monitor`、`patience` 和 `restore_best_weights` 参数的早停机制（early stopping）。然后使用 `fit`\
  \ 方法训练该序列模型（参考图 15.7）。\n\n## 15.4 基于 VGG16 的模型\n\n在此段代码中，导入了一个预训练的 `VGG16` 模型，并去除了其顶层，专门针对\
  \ 32x32 的图像进行了配置。该模型被存储在变量 `vgg_base` 中。使用 `Sequential` 构建了新模型，如图 15.8 所示。在 `VGG16`\
  \ 平坦化后，添加了具有 256 和 128 个单元的自定义层。为了二分类任务，输出层使用了单个单元和 sigmoid 激活函数。这种方法利用了 `VGG16`\
  \ 的特征，如图 15.8 所示。\n\n![图 15.8 构建模型。](img/9781032676654_C015_008.jpg)\n\n图 15.8 构建模型。\n\
  \n我们编译了该神经网络训练模型。如图 15.9 所示，使用了 `Adam` 优化器、交叉熵损失函数和准确率。通过早停技术来观察验证损失。如果验证损失在连续五个\
  \ epoch 内没有改善，则停止训练。这种方法确保了最优权重并降低了过拟合风险。\n\n![图 15.9 编译模型。](img/9781032676654_C015_009.jpg)\n\
  \n图 15.9 编译模型。\n\n然后使用 `fit` 方法训练 vgg16 模型，如图 15.10 所示。\n\n![图 15.10 训练模型。](img/9781032676654_C015_010.jpg)\n\
  \n图 15.10 训练模型。\n\n## 15.5 准确率比较\n\n我们创建了列表来存储所有模型的最终准确率（如图 15.11 所示）。列表中的准确率以百分比形式显示了模型准确识别数据的能力。\n\
  \n![图 15.11 准确率比较。](img/9781032676654_C015_011.jpg)\n\n图 15.11 准确率比较。\n\n我们使用 `matplotlib`\
  \ 生成柱状图，比较序列模型和 VGG16 模型在训练期间达的准确率水平，如图 15.12 所示。\n\n![图 15.12 准确率比较。](img/9781032676654_C015_012.jpg)\n\
  \n图 15.12 准确率比较。\n\n## 15.6 总结\n\n通过两种非常不同但同样有效的神经网络拓扑结构，我们在本章中研究了图像分类的复杂性。研究表明，基于序列的模型表现出色，凸显了迁移学习的重要性。\n\
  \n## 15.7 进一步学习\n\n展望未来，有许多方法可以改进用于猫狗分类的模型。如果在探索过程中使用了复杂的超参数配置，模型可能会通过微调产生更高的性能。通过使用各种变换来增强数据集，并结合\
  \ mixup 和 cutmix 等高级技术，可能会提高模型对更多现实事件的泛化能力。此外，研究更复杂的设计（如 ResNet、Inception 或 EfficientNet）可能会发现更强的特征提取能力。\n\
  \n\n\n\n\n数据驱动的决策对于在不断变化的校园招聘领域取得成功至关重要。本章旨在通过利用机器学习技术探索学生安置的错综之处。该分析基于 Kaggle 校园招聘数据集：[www.kaggle.com/datasets/benroshan/factors-affecting-campus-placement/](http://www.kaggle.com)，该数据集为该领域提供了宝价值的见解。通过采用系统化的数据预处理方法，并引入新新的离群值检测和消除方法，我们深入探讨了预测建模的核心。其理念是为教育机构和招聘人员提供必要的资源，以便对安置情况做出明智且具有战略性的判断。\n\
  \n## 16.2 数据预处理与切分\n\n我们正在整合作为数据分析和机器学习追求基础的基础标准库，正如 图 16.1 所示。我们导入了 `numpy` 和 `pandas`\
  \ 库来处理数据。`seaborn` 和 `matplotlib` 库用于数据可视化任务。从 `sklearn` 库中我们导入了所需的模型。\n\n![图 16.1\
  \ 导入必要的库。](img/9781032676654_C016_001.jpg)\n\n图 16.1 导入必要的库。\n\n我们导入数据集并将其存储在名为\
  \ `df` 的变量中。使用 `head()` 命令，我们可以清晰地查看导入数据集的前五行。显而易见，我们的数据集既包含数值也包含字符串，这些将在后续的预处理步骤中处理。详情请参考\
  \ 图 16.2。\n\n![图 16.2 加载数据集的代码片段。](img/9781032676654_C016_002.jpg)\n\n图 16.2 加载数据集的代码片段。\n\
  \n在我们继续进行时，让我们使用 图 16.3 中提供的 `isnull().sum()` 命令来查看缺失值的数量。由于我们已经得到了结果，薪资（salary）列中有\
  \ 67 个缺失值，因此让我们找到一种方法来填充它们。\n\n![图 16.3 查找缺失值。](img/9781032676654_C016_003.jpg)\n\
  \n图 16.3 查找缺失值。\n\n在这里，我们填充薪资列中的空值。首先，我们访问 `df` DataFrame 中的薪资列，然后使用 `fillna` 方法，通过同一列中非缺失值的中位数来填充薪资列中的\
  \ NaN 值。代码片段请参考 图 16.4。\n\n![图 16.4 填充空值。](img/9781032676654_C016_004.jpg)\n\n图\
  \ 16.4 填充空值。\n\n正如我们之前讨论的样，数据框包含数值和分类值，因此现在让我们替换所有的字符串值。最初，我们创建一个空字典，用于存储每个分类列的所有标签编码器（label\
  \ encoder）实例。然后我们遍历所有列，并找到具有对象（object）值的列。创建一个 `labelencoder()` 对象来编码数据框中的所有分类值。使用\
  \ `.head()` 命令，我们可以看到所有的列现在都是数值型了。参见 图 16.5。\n\n![图 16.5 编码值。](img/9781032676654_C016_005.jpg)\n\
  \n图 16.5 编码值。\n\n然后我们创建训练集和测试集。为了实现这一点，我们首先创建一个名为 `features` 的变量，在其中丢弃目标变量 `status`\
  \ 并存储所有特征。然后将我们的目标列 `status` 存储在 `labels` 变量中。接着使用 `train test split` 方法将数据集划分为\
  \ 80% 的训练数据和 20% 的测试数据，如 图 16.6 所示。\n\n![图 16.6 切分数据集。](img/9781032676654_C016_006.jpg)\n\
  \n图 16.6 切分数据集。\n\n## 16.4 使用 Z-score 移除离群值\n\n离群值可以定义为偏离样本内观察到的主要模式存在显著的数据点。这些现象的发生可能是多种情况的结果，包括数据收集的不准确、测量精度的差异，或真正罕见事件的发生。尽管离群值有时可能意味着有趣的事件，但它们也可能向我们的分析中注入额外数据，导致误导性的解释和预测。Z-score，又称为标准分（standard\
  \ score），作为数据分析领域的一个基本统计指标具有重要意义。该指标量化了给定数据点偏离平均值的标准差倍数。通过计算 Z-score，可以识别出偏离平均值的数值。我们在\
  \ `h` 和 `salary` 列中计算 Z-score 并与定义的阈值进行比较以移除离群值。代码片段请参考 图 16.7。\n\n![图 16.7 移除离群值。](img/9781032676654_C016_007.jpg)\n\
  \n图 16.7 移除离群值。\n\n## 16.5 建模\n\n我们实例化三个不同的分类器，将它们的名称附加到一个列表中，并建立一个字典来记录准确率，如 图\
  \ 16.8 所示。\n\n![图 16.8 实例化分类器。](img/9781032676654_C016_008.jpg)\n\n图 16.8 实例化分类器。\n\
  \n我们使用训练数据训练三个分类器。我们创建一个循环来遍历上一步创建的分类器列表。然后我们将训练数据拟接到模型并使用测试标签计算准确率。最后，我们在 图 16.9\
  \ 中打印所有模型的准确率。\n\n![图 16.9 模型评估。](img/9781032676654_C016_009.jpg)\n\n图 16.9 模型评估。\n\
  \n## 16.6 模型比较与可视化\n\n如 图 16.10 所示，创建了一个条形图来比较三个不同模型的准确率。\n\n![图 16.10 模型准确率比较。](img/9781032676654_C016_010.jpg)\n\
  \n图 16.10 模型准确率比较。\n\n## 16.7 结论\n\n在校园招聘背景下，有效安置的基础取决于精确的预测。目前的比较研究阐明了未来的方向，阐述了各种机器学习算法的优缺点。随机森林模型成为领先候选者，其准确率达到了显著的\
  \ 86.05%。本章提供了预测建模领域的见解，并为决策者提供必要的信息，以便根据招聘过程的数据做出明智决策。\n\n## 16.8 进一步学习\n\n在我们结束本章时，必须意识到等待着未来的广阔前景。未来的研究领域包括集成技术的研究、特征工程的应用以及深度学习方法的检查以进一步提高预测准确率。此外，纵向分析可能提供随时间变化的安置模式的有用见解，从而使机构相应调整政策。\n\
  \n# 第 17 章 使用 oneAPI 进行蘑菇分类深度研究\n\nDOI: [10.1201/9781032676685-18](http://doi.org/10.1201/9781032676685-18)\n\
  \n## 学习目标\n\n阅读本章后，读者将能够：\n\n\n\n\n\n*   通过机器学习技术获取对蘑菇分类的知识。\n*   利用多种机器学习算法实现高准确率。\n\
  \n## 17.1 引言\n\n本章将开启对机器学习领域引人入胜的探索，并以来自 Kaggle 的 [www.kaggle.com/datasets/uciml/mushroom-classification/data](http://www.kaggle.com)\
  \ 蘑菇分类数据集作为主要参考。数据集中提供的信息包含了与蘑菇相关的广泛特征，从而激发了我们从数据科学和人工智能的角度深入探索真菌学的兴趣。通过利用多种机器学习算法，我们的目标是理解蘑菇分类涉及的复杂性，特别是以高准确率区分食用类型和剧毒类型。\n\
  \n## 17.2 数据预处理与划分\n\n首先，我们导入了图 17.1 所示的几个必要库。我们导入了 `pandas` 和 `numpy` 来处理和操作数据。我们进行了广泛的探索性数据分析，因此导入了\
  \ `seaborn` 和 `matplotlib` 库。为了建模，从 `scikit-learn` 库导入了所有的机器学习算法。我们使用 Intel 的 `oneAPI`\
  \ 工具优化了所有的机器学习模型，并使用了一些自定义库来补丁 `scikit-learn`。红色的弹出消息告诉我们环境已通过 `oneAPI` 了优化。\n\n\
  ![图 17.1 导入库。](img/9781032676654_C017_001.jpg)\n\n图 17.1 导入库。\n\n然后，我们使用 `read_csv`\
  \ 命令导入数据集并将其存储在变量 `data` 中，然后我们如图 17.2 所示查看了数据集的前五行。我们数据集中的所有列都是分类变量，因此让我们在后续步骤中进行编码。\n\
  \n![图 17.2 导入数据集的代码片段。](img/9781032676654_C017_002.jpg)\n\n图 17.2 导入数据集的代码片段。\n\n\
  我们检查数据集中的空值；如图 17.3 的结果所示，显然我们的数据集中不存在空值。\n\n![图 17.3 检查数据集中的空值。](img/9781032676654_C017_003.jpg)\n\
  \n图 17.3 检查数据集中的空值。\n\n如前所述，我们必须将数据集中所有可用的分类值转换为数值。我们使用 `LabelEncoder` 将分类转换为数值，结果数据框存储在变量\
  \ `data_encoded` 中。见见图 17.4。\n\n![图 17.4 使用 LabelEncoder。](img/9781032676654_C017_004.jpg)\n\
  \n图 17.4 使用 LabelEncoder。\n\n## 17.3 探索性数据分析\n\n在这一节中，我们创建了各种可视化图以更好地理解数据。\n\n首先，我们创建了一个饼图来更好地理解目标列“class”。该列中有两个唯一值\
  \ `e` 和 `p`。我们使用 `.value_counts()` 命令来统计这两个唯一值，并存储和显示结果。相同的代码片段提供在图 17.5 中。\n\n\
  ![图 17.5 统计唯一值。](img/9781032676654_C017_005.jpg)\n\n图 17.5 统计唯一值。\n\n图 17.6 中的红色部分对应于数据集中毒蘑菇的比例。浅蓝色部分是食用蘑菇的比例。这些类别的比例是相当的。\n\
  \n![图 17.6 目标值分布。](img/9781032676654_C017_006.jpg)\n\n图 17.6 目标值分布。\n\n我们继续检查并分析数据集中的特定列。从“cap-shape”列开始，并根据出现次数降序计数唯一值。然后用\
  \ `barplot` 对值计数进行可视化。如图 17.7 所示，类型 `X` 的计数最高，`c` 的计数最低。\n\n![图 17.7 菌盖分布。](img/9781032676654_C017_007.jpg)\n\
  \n图 17.7 菌盖分布。\n\n导入必要的库后，将图像尺寸设置为 15 英寸，如图 17.8 所示使用 `seaborn` 生成计数图，其中 x 轴代表菌盖形状，hue\
  \ 代表类别。颜色分配给“Poisonous（有毒）”和“Edible（食用）”。\n\n![图 17.8 生成计数图。](img/9781032676654_C017_008.jpg)\n\
