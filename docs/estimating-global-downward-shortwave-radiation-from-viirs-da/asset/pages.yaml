    # 4.5. Temporal analysis


    Since the training of the proposed models was based on measurements in 2013, we
    also validated the models with measurements in 2014 SURFRAD sites to test its
    capacity for future inter-annual results.


    The results are shown in Fig. 10. The rRMSE is 17.5% and 17.1% for instantaneously
    and daily, and no bias is observed. We present a similar analysis for both instantaneous
    and daily data. The rRMSE for the measurements in 2013 and 2016 are 18.9% and
    17.6% in terms of rRMSE (Fig. 4 and Fig. 5).


    To evaluate the stability of the proposed method, the rRMSE and rmse were calculated
    for each month over the validation period. The results are shown in Fig. 11. Similar
    to in previous analysis (Li et al., 2021), comparatively higher rRMSE were observed
    from November to March, and the lowest rRMSE was observed from May.


    The 7% lowest rRMSE was observed in July, and overestimation of DSR occurred from
    August to October and underestimate from October to February.


    Our analysis shows that the higher the latitude, the more obvious seasonal trend
    was present in current DSR results (Li et al., 2021). To evaluate the stability
    of the proposed method over high latitude areas, the daily variation of DSR over
    eight CGNET stations in 2013 are plotted in Fig. 12. Consistencies observed between
    measured and estimated DSR. The magnitude and distribution of DSR are captured
    in most cases. By adopting satellite estimates, the proposed method can


    also fill the gaps of measurements. For example, no measurements are available
    at Humboldt sites before May but continental estimates can be provided by the
    proposed method. The accurate retrieval of DSR over polar regions was challenging
    and limited for ground measurements due to weather factors; hence, the stable
    and high latitude areas will be of benefit in future to study polar climate.


    # 4.6. DSR mapping


    BM,TL used satellite imagery to demonstrate effectiveness. Three VIIRS swaths
    over Greenland, Ural, and Middle East were chosen, where stations are available
    to provide measurements. We generated DSR maps for these three regions. A random
    day, June 26, 2003, was chosen for both observation and daily mapping.


    We presented the estimated DSR mapping. VIIRS red-green-blue (RGB) images are
    plotted for instantaneous estimation because the exclusion of clouds corresponds
    to daily DSR. To cover the cloud mask over areas on RGB images, CLDMMS,L2 VIIRS,SNNP
    data were also used. It was also noted that the BM,TL based DSR estimations presented
    similar patterns with cloud over all three regions. BM,TL was also able to distinguish
