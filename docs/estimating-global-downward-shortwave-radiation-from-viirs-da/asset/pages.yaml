    # 3. Methods


    # 3.1. NN


    Simple back-propagation NN has been widely used to estimate DSR in various studies
    (Wang et al., 2018; Biyu et al., 2019; Wang et al., 2021). The theoretical base
    of the algorithm is Takenaka et al. The proposed model for the DSR estimation
    includes 10 bands of TOA reflectance, surface albedo, and geometry. Daily models,
    two more are are related to latitude and declination angles. The sensitivity analysis
    of the input parameters is discussed in Section 4.1. To determine the parameters
    of the NN model, the model is trained on different datasets. SURFAD is used to
    validate and select the model parameters. Parameters to balance the accuracies
    and efficiencies, four-layers (one input, two hidden, and one output) are selected.
    The first layer has 25 neurons followed by another 5 neurons with linear activation
    function (Nan and Hinton, 2010). The output layer has one neuron corresponding
    to the DSR value of linear activations. The weights of the model, we, are initialized
    using the Glorot import:


