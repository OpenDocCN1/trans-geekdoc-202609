    Machine-learning (ML) have been extensively used to estimate DRS over the past
    years, owing to their superiority to capture non-linear relationships with high
    efficiency. Random-forest, gradient regression tree (GBT), and neural networks
    (NNs) have been used to estimate DRS (Bafar et al., 2020; Chen et al., 2020).
    In recent years, some deep-learning methods, such as convolutional NNs (CNN) (Wang
    et al., 2019) and regression NNs (Skaheli, 2020), have also been employed (Yuan
    et al., 2020). Several studies have compared these ML models and presented the
    best performances (Brown et al., 2020; Wei et al., 2019).


    However, the accuracy of ML methods depends on the quality and quantity of training
    data (Zhang et al., 2018). Some models were trained on satellite data (Hao et
    al., 2019; Peng et al., 2020; Wei et al., 2019; Yang et al., 2018). Such models
    achieve high accuracy when trained on regional scale or train with data that are
    representative enough. However, the results have not been fully demonstrated with
    more scores because since representative training data is hard to obtain, especially
    for orbiting sensors.


    Other models are trained using transfer functions which can shift uncertainties
    under different atmospheric conditions and different surfaces (Bu et al., 2019;
    Ma et al., 2020; Sun et al., 2021; Yuan et al., 2022). The data size is usually
    large enough, which is preferred by NNs.


    However, nowadays to address the number of inputs by different parameters and
    model efficiency, gaps still exist within the RTM framework. Most models are still
    based on completely consistent 1-dimensional column, which is considered as horizontally
    homogeneous and infinite (Chen et al., 2019), making the multilayer and 3-dimensional
    effects ignored. At regional scale, accuracy is especially with sufficient measurements
    from vertical profiles.


    It would be ideal to combine both simulated and ground measurement data in the
    training model which can be achieved by adopting the use of transfer learning
    (TL). The models will use source data as a starting point, and fine-tuned in the
    process of developing a model for target domain (Pan and Yang, 2019). It is a
    method that has been proven to provide improved generalization, even when the
    target datasets are trained with Pan and Lim (Hansen et al., 2017), as simulations
    provide sufficient information to bridge the gap of physics knowledge which gap
