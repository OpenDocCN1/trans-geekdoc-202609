    This study proposes a robust method using TL to estimate aerosol optical depth
    based on Visible Infrared Imaging Radiometer (VIIRS) TOA reflectance and Moderate
    Imaging Spectrorometer (MODIS) black-albedo (BA)) at local noon with. The proposed
    method leverages the advantages of both using


    radiative transfer simulation data and ground measurement data for training, which
    enables accurate estimation of DRS under various climate regions, especially polar
    regions. The remainder of this paper is organized as follows: Section 2 describes
    the data and acquisition method; Section 3 describes the methodology; Section
    4 presents and discusses results; The conclusions are drawn in Section 5.


    # 2. Data


    # 2.1. Real-world data, Dd


    Let Dd be the real-world data as the target domain in our study, Dd is composed
    of satellite data and in-situ measurements which are matched based on their locations.


    # 2.1.1. Satellite data


    The TOA reflectance, geometry information, and BSA were extracted from satellite
    data: VIIRS/SMI NPP Moderate Resolution Bands (VNP03), VIIRS/SMI NPP Moderate
    Resolution Correction Geocleed (VNP05), and MODIS/Terra Aqua High Resolution Band
    (IACG). The MODIS products with high spatial resolution and pixel-level quality
    for M75-M11 (for M6) are used in our study. VNP03 includes regional geospatial
    coordinates and location values with angular information. The BSA from MODIS bands
    MCD043, which are produced daily at 50-meter resolution, 16 days of Terra and
    Aqua data were used in MCD043, consequently matching available data.


    # 2.1.2. In-situ data


    In-situ observations are collected from four different regions in this study.
    96 sites from FLUGNET global network of meteorological sites were used as training/fine-tuning
    datasets. The results are validated with eight Baseline Radiation Network (BSRN)
    stations, Green Baseline stations, and five stations with observations from 2013
    to 2014. All validation data are presented in the text.


    Both BSRN and aerosol stations provide high-level measurements for the Aerosol
    Research Program (Organization et al., 2000). The distribution of in-situ data
    is shown in Fig. 1. The instantaneous DRS is calculated by averaging the nearest
    half-hour data of VIIRS over time, and the daily DSR is the mean of all measurements
    in one day and (Yuan et al., 2021). Measurements with a solar zenith angle (SZA)
    higher than 80 degrees are excluded.


    Let Ds be the source data of this study. MODTRANICS (Beck et al., 2004) is generated
    for the simulated data. Using Wang the relative transfer model was used for 94
    days of solar zenith angle (SZA), and values of relative aerosol angle (RAA).'
