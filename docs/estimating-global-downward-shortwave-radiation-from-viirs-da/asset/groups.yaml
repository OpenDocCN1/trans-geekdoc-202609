    ## 4.7. 训练数据大小的影响


    由于 TL 首次引入是为了结合模拟数据和现场数据，因此进行了更多分析，以显示与传统神经网络相比训练数据的大小如何影响性能。我们使用了不同数量（5, 10,
    30, 50, 70 和 96）的完整数据子集来训练 BM 和 TL。对于每个模型，从 FLUXNET 站中随机选择站点，以最小化对训练数据代表性的影响。使用
    SURFAD、BSN 和 GC-NET 站测试模型。保留了模型结构和配置，但冻结层和节点外，这些节点通过冻结模型的一层并在 FLUXNET 测量值上重新训练来识别。对模型进行了独立验证。RMSE
    分别为 106.3、91.2% 和 71.7%，与传统的机器学习和物理算法相比，对数据提供了显著的改进。


    首先，可以从图 5 和表 4 中得出改进。BM 观测到较大的 RMSE，特别是当数据量小于 50 个站点时。对于 SURFRAD，BM 的 RMSE 为 28.5%，对于
    TL 为 23.8%。差异在于测试 GCNET 之间；BM 的 RMSE 达到 71.7%，而对于 GCNET，TL 实现了 BSA 的近一半。


    所提算法有几个优点。它只将 TL 和 BSA 作为输入，这使得通过高层数据本质上更好，并在 BSA 原始值（15-300）处检索。TL 是连接物理模型和统计模型之间差距的桥梁。通用性和准确性均得到了证明，使得（站点）减少
    10 倍或更少，且几乎在机器学习中观察到。对于 BM，来自所有数据的 TL。当从小尺寸训练时，模型性能有所提高，对于 BM, TL 的 RMSE 低于 6
    W/m²，而对于 GCNET 为 100 W/m²。


    # 5. 结论


    本研究提出了一种带有 TL 的神经网络来估计来自 VIIRS POA 源的全球反照和每日数据。四层神经网络在 RTM 模拟数据上构建并训练。


