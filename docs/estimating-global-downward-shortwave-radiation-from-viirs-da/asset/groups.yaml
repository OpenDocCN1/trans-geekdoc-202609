    high-level atmospheric aerosols and particles using (Wang et al., 2021). This
    also poses difficulties in parameterization method to generate high spatial and
    temporal resolution DRS.


    Machine-learning (ML) have been extensively used to estimate DRS over the past
    years, owing to their superiority to capture non-linear relationships with high
    efficiency. Random-forest, gradient regression tree (GBT), and neural networks
    (NNs) have been used to estimate DRS (Bafar et al., 2020; Chen et al., 2020).
    In recent years, some deep-learning methods, such as convolutional NNs (CNN) (Wang
    et al., 2019) and regression NNs (Skaheli, 2020), have also been employed (Yuan
    et al., 2020). Several studies have compared these ML models and presented the
    best performances (Brown et al., 2020; Wei et al., 2019).


    However, the accuracy of ML methods depends on the quality and quantity of training
    data (Zhang et al., 2018). Some models were trained on satellite data (Hao et
    al., 2019; Peng et al., 2020; Wei et al., 2019; Yang et al., 2018). Such models
    achieve high accuracy when trained on regional scale or train with data that are
    representative enough. However, the results have not been fully demonstrated with
    more scores because since representative training data is hard to obtain, especially
    for orbiting sensors.


    Other models are trained using transfer functions which can shift uncertainties
    under different atmospheric conditions and different surfaces (Bu et al., 2019;
    Ma et al., 2020; Sun et al., 2021; Yuan et al., 2022). The data size is usually
    large enough, which is preferred by NNs.


    However, nowadays to address the number of inputs by different parameters and
    model efficiency, gaps still exist within the RTM framework. Most models are still
    based on completely consistent 1-dimensional column, which is considered as horizontally
    homogeneous and infinite (Chen et al., 2019), making the multilayer and 3-dimensional
    effects ignored. At regional scale, accuracy is especially with sufficient measurements
    from vertical profiles.


    It would be ideal to combine both simulated and ground measurement data in the
    training model which can be achieved by adopting the use of transfer learning
    (TL). The models will use source data as a starting point, and fine-tuned in the
    process of developing a model for target domain (Pan and Yang, 2019). It is a
    method that has been proven to provide improved generalization, even when the
    target datasets are trained with Pan and Lim (Hansen et al., 2017), as simulations
    provide sufficient information to bridge the gap of physics knowledge which gap
    between the simulated data and real-world data can be filled when


    This study proposes a robust method using TL to estimate aerosol optical depth
    based on Visible Infrared Imaging Radiometer (VIIRS) TOA reflectance and Moderate
    Imaging Spectrorometer (MODIS) black-albedo (BA)) at local noon with. The proposed
    method leverages the advantages of both using


    radiative transfer simulation data and ground measurement data for training, which
    enables accurate estimation of DRS under various climate regions, especially polar
    regions. The remainder of this paper is organized as follows: Section 2 describes
    the data and acquisition method; Section 3 describes the methodology; Section
    4 presents and discusses results; The conclusions are drawn in Section 5.


    # 2. Data


    # 2.1. Real-world data, Dd


    Let Dd be the real-world data as the target domain in our study, Dd is composed
    of satellite data and in-situ measurements which are matched based on their locations.


    # 2.1.1. Satellite data


    The TOA reflectance, geometry information, and BSA were extracted from satellite
    data: VIIRS/SMI NPP Moderate Resolution Bands (VNP03), VIIRS/SMI NPP Moderate
    Resolution Correction Geocleed (VNP05), and MODIS/Terra Aqua High Resolution Band
    (IACG). The MODIS products with high spatial resolution and pixel-level quality
    for M75-M11 (for M6) are used in our study. VNP03 includes regional geospatial
    coordinates and location values with angular information. The BSA from MODIS bands
    MCD043, which are produced daily at 50-meter resolution, 16 days of Terra and
    Aqua data were used in MCD043, consequently matching available data.


    # 2.1.2. In-situ data


    In-situ observations are collected from four different regions in this study.
    96 sites from FLUGNET global network of meteorological sites were used as training/fine-tuning
    datasets. The results are validated with eight Baseline Radiation Network (BSRN)
    stations, Green Baseline stations, and five stations with observations from 2013
    to 2014. All validation data are presented in the text.


    Both BSRN and aerosol stations provide high-level measurements for the Aerosol
    Research Program (Organization et al., 2000). The distribution of in-situ data
    is shown in Fig. 1. The instantaneous DRS is calculated by averaging the nearest
    half-hour data of VIIRS over time, and the daily DSR is the mean of all measurements
    in one day and (Yuan et al., 2021). Measurements with a solar zenith angle (SZA)
    higher than 80 degrees are excluded.


    Let Ds be the source data of this study. MODTRANICS (Beck et al., 2004) is generated
    for the simulated data. Using Wang the relative transfer model was used for 94
    days of solar zenith angle (SZA), and values of relative aerosol angle (RAA).'
