    ## 4.7. Impact of training data size


    As TL was first introduced to combine simulated data and in-situ data, more analysis
    was performed to show how the size of training data influence the performance
    compared with traditional NN. We used subsets of the full data using a different
    number of stations (5, 10, 30, 50, 70, and 96) to train the BM and TL. For each
    model, the stars were randomly chosen from FLUXNET stations to minimize the fluence
    of training data representativeness. The models were tested using SURFAD, BSN,
    and GC-NET stations. The model structure and configuration were retained, except
    for the frozen layers and nodes, which were identified through manual tuning by
    freezing one layer of the model and re-training it on FLUXNET measurements. The
    models were independently validated. The RMSE were 106.3, 91.2, and 71.7% respectively,
    were compared with traditional ML and physical algorithms, and provided significant
    improvement of the data.


    First, the improvement in Fig. 5 and Table 4 can be drawn. large RMSE was observed
    for BM, especially when the data size was smaller than 50 stations. For SURFAD,
    the RMSE of BM was 28.5%, and for TL, it was 23.8%. The difference was between
    testing GCNET; the RMSE of BM reached 71.7% while for GCNET, TL achieved nearly
    half of BSA.


    There are several advantages of the proposed algorithm. It only re- TL and BSA
    as inputs, which enables inherently better by high-level data and retrieves at
    BSA raw values (15-300). TL is a bridge that can connect the gap between physical
    and statistical models. The Genericity and accuracy were both proved, which enables
    the (stations) by 10 times or less and almost were observed over ML. For BM, TL
    from all data. When training from small size, the performance of the model improved,
    and the RMSE was lower than 6 W/m² for BM, TL over SURFAD, and it reached 100
    W/m² for BSA, BM, TL while it reached 34 W/m² for BSA, GCNET stations.


    The current algorithm still has for improvement. The example, the model did not
    consider topology as an input and spatial resolution and BSA at noon rather the
    blue sky is used as input in this study. Nevertheless, stations still exist in
    the proposed method due to lack of other data and structure which could incorporate
    albedo and climatology data or train the model with less bands to address the
    issue. In this study, a simple four-layer NN from training data pool, it is possible
    that some stations are representative and have better measurement quality. The
    results that the difference between BM, TL, and BSA also increases as data size
    increases, especially over SURFAD stations. The daily data was used for training
    to the reality of CSERNS-SUN, TL also presents high over polar regions where some
    methods exist daily. Last, TL revealed the potential of training a model that
    mitigates the terror and significantly improves performance. For geographical
    studies where limited stations were used as training data. This is possible, when
