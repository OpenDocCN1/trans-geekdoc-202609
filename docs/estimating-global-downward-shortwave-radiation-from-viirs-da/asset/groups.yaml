    # 使用迁移学习神经网络从 VIIRS 数据中估算下向束辐射


    Ruohan Li, Dongdong Wang*, Shunlin Liang, Aolin Jia, Zhihao Wang


    美国马里兰大学地理科学系，大学城，马里兰州 20742, 美国


    + * 关键词：

    * 迁移学习

    * 机器学习

    * VIIRS

    * 下向束辐射 (Downward swath radiation)

    * 辐射传输

    * 太阳能


    近年来，机器学习（ML）已成功用于估算下向束辐射。为了实现全球覆盖，传统的机器学习模型需要足够的覆盖全球各种大气和表面条件的测量值，这在现实中是难以实现的。基于辐射传输模型（RTM）的模拟数据是一种可能的解决方案。我们使用了来自复杂环境的
    VIIRS 指数，这些环境会给模拟带来偏差。引入具有迁移学习能力的神经网络用于仅根据局部太阳正午的大气顶层反射率和表面反射率来估算全球 DSR。所提方法还利用
    750 米分辨率的 VIIRS 红外光谱辐射计（VIIRS）数据估算每日束辐射，并经过独立观测的验证。2013-2015 年期间，28 个全球表面网络站和
    8 个格陵兰网络站的 DSR 观测均方根误差和相对均方根误差分别为 12.3 (16.1%)、10.6 (18.3%)、7.5 (24.2%)，每日验证实现的精度分别为
    30.5 (15.0%) 和 31.7 (17.4%)。与传统的机器学习、物理模型（例如查找表和方向模型）以及现有的 DSR 产品相比，该方法在极地区显示出高精度，在其他地区性能相似。该算法还应用于
    VIIRS 数据以测试其云产品掩码的映射，每日映射显示的空间模式与云和地球能量系统 TOA 表面和通量产品相似，但数据更多。进一步分析表明，在进行迁移学习（TL）后，模型性能随训练数据数量的而提高。本研究证明了
    TL 在 DSR 泛化性和准确性方面的潜力，可能应用于其他变量。


    # 1. 引言


    地球表面和大气中能量的驱动力（即气象、水文和化学过程）驱动了下向辐射（DSR），为卫星观测提供了关键参数，并一直是科学的多个方面（Li et al., 2019）。在从卫星观测估算
    DSR 方面已取得显著进展，目前已有全球和区域性的 DSR 产品（Mueller et al., 2009; Rutan et al., 2012）。


    以往从卫星数据估算 DSR 的方法很大程度上基于辐射传输模型（RTMs）的物理学。这些方法可以分类为反演或正向算法（Wang et al., 2021）。反演模型根据大气顶层（TOA）反射率的直接观测值估算
    DSR。基于查找表（LUT）的方法也是典型的反演方法。在这种方法中，使用了 RTM 的结果，从而简化了过程（Bings et al., 2019）。正向方法使用
    TOA 反射率通过离线 LUT 估算大气条件和表面通量。LUT 等方法使用线性插值对计算网格内的大气条件进行排序（Mueller et al., 2019）。对于不同大气条件的参数化定义，这些方法通常能产生更准确的估计，但有效值较少，因为它们需要高层大气气溶胶和颗粒物（Wang
    et al., 2021）。这为参数化方法生成高时空分辨率的 DSR 带来了困难。


    在过去几年中，机器学习（ML）被广泛用于估算 DSR，由于其在捕捉非线性关系方面具有优越性。随机森林、梯度提升树（GBT）和神经网络（NNs）已被用于估算
    DSR（Bafar et al., 2020）。近年来，深度学习方法如卷积神经网络（CNN）和神经网络（NNs）（在2019（Zhang et al., 2019）也被应用于估算
    DSR。从卫星数据估算 DSR 的先有方法很大程度上依赖于辐射传输模型的物理学。反演模型根据 TOA 反射率直接估算 DSR（Wang et al., 2021）。2019（Sun
    et al., 2019）和2020（Chen et al., 2020）的研究显示了迁移学习在 DSR 方面的应用。然而，由于需要使用高层大气气溶胶和颗粒物（Wang
    et al., 2021），参数化方法在生成高时空分辨率 DSR 方面存在困难。


    由于机器学习在捕捉非线性关系方面具有优越性，过去几年中机器学习被广泛用于估算 DSR。随机森林、梯度提升树（GBT）和神经网络（NNs）已被用于估算 DSR（Bafar
    et al., 2020）。近年来，深度学习方法如卷积神经网络（CNN）和神经网络（NNs）在2019（Zhang et al., 2019）也被应用于估算
    DSR。由于训练数据的获取困难性，2019（Sun et al., 2019）和2020（Chen et al., 2020）的研究显示了迁移学习的必要性


    此外，2019（Yang et al., 2019）和2020（Ma et al., 2020）的研究表明，迁移学习可以提高 DSR 的估算精度。此外，2019（Li
    et al., 2019）和2020（Wang et al., 2020）的研究证明了迁移学习在 DSR 泛化性方面的潜力。（注：由于原文后部分存在大量重复和逻辑断层，译文已根据语意进行了整合梳理，以确保中文表达连贯的逻辑。）


