    20% 验证数据进行训练，没有应用交叉验证。由于样本量足够，我们还使用了 SURFRAD 作为额外的验证数据来


    ![](img/f3835d0c09050f62eab4bbb224c51e70_3_0.png)


    在所提的，模型在独立站点上训练和评估（即训练域和目标域之间不存在重叠站点）。FLUX-NET 数据集用于验证和选择模型参数。为了平衡准确性和效率，选择了四层（一个输入、两个隐藏层和一个输出）。第一层有
    25 个神经元，随后是 5 个线性激活函数的神经元 (Nan and Hinton, 2010)。输出层有一个对应线性激活 DSR 值的神经元。模型权重使用
    Glorot 方法初始化：


    $w \sim \sqrt{\frac{\sqrt{6}}{n_i+n_{i+1}}} + \frac{\sqrt{6}}{n_{i+1}+n_i}}, \quad
    l=0, \dots, L-1; \quad (1)$


    其中 L 是 NN 的层数，$n_i$ 是层中的神经元数。DSR 的数值、模型的最终输出和均方误差 (MSE) 函数用作误差函数：


    ```

    $E(w) = \sum [v(x) - h_i]^2; \quad (2)$

    ```


    其中 $h_i$ 是第 $i$ 个样本的模拟/测量 DSR。误差函数使用 RMSProp 进一步最小化 (Hinton et al., 2012)，这是一种随机梯度下降，能够实现稳定的学习曲线并通过计算梯度的平方加权平均来加速。确保模型不会过拟合给定的测量值。BM
    从模拟数据中学习知识。为了使模型适应真实数据，通过匹配卫星产品与 FLUXNET 测量数据对模型进行微调。以往研究表明 NN 模型的第一层对权重初始化更为敏感。本文中，第一层权重
    $w_1$ 最初从 BM 初始化，如图 2 所示，这意味着它们随后通过 (1) 进行更新，在 (2) 过程中使用 RMSProp，$x \in D_{sim}$。因此，BM
    可以表示为 $g_1(x, w_1), x \in D_{sim}$。


    ### 4.1. 敏感性分析


    由于使用 VIIRS TOA 反射进行 ISR 估计，进行了敏感性分析以调查瞬时和每日 D 输入变量的影响。使用了 Python SALIB 库中的 Sobol
    方法 (Sobol, 2001)。一阶指数 (S1) 和总阶指数 (ST) 测量了单个输入对输出方差的贡献。结果见图 3。对于瞬时 D，波段 4 比其他波段高。近红外到中红外波段
    5-11 也占总的%，与以往敏感性分析相比，波段 4 具有更重要的作用。


    ### 4.2. 与传统 NN 方法的比较


    所提方法在实地数据上进行了测试，由于每个网络的不同属性，结果具有统计意义。FLUXENet 用于 BM、SA 和 TM 的训练数据。TL 模型增强了传统的机器学习，所提模型
    (TL) 与 BM 和 SA 进行了比较。对于瞬时 D，SA 在 FLuxenet 上的 RMSE 更。BM 模型在 FLuxenet、SURFRAD 和
    BSNR 数据上的 RMSE 分别为 127.0、126.2 和 104.5 $W/m^2$，SA 达到了

