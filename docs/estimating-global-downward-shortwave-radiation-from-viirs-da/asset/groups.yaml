    ## 4.5. 时间分析


    由于所提模型的训练是基于 2013 年的测量，我们还使用 2014 年 SURFRAD 站测量值验证了模型，以测试其应对未来年际结果的能力。


    结果如图 10 所示。瞬时和每日的 rRMSE 为 17.5% 和 17.1%，未到偏差。我们提供了瞬时和每日数据的分析。2013 年和 2016 年测量的
    rRMSE 分别为 18.9% 和 17.6%（图 4 和图 5）。


    为了评估所提方法的稳定性，计算了验证期间每个月的 rRMSE 和 rmse。结果如图 11。与之前的分析（Li 等人，2021）相似，从 11 月到 3 月观测到较高的
    rRMSE，从 5 月开始观测到最低 rRMSE。


    7 月观测到最低的 7%，从8 月到 10 月出现高估，从10 月到 2 月出现低估。


    我们的分析显示，纬度越高，当前 DSR 结果中的季节性趋势越明显（Li 等人，2021）。为了评估所提方法在高纬度地区的稳定性，2013 年 CGNET 站的
    DSR 每日变化如图 12 所示。观测到测量与估计 DSR 之间的一致性。通过采用卫星估计，所提方法还可以填补测量值的空白。例如，5 月之前没有测量值，但所提方法可以提供估计。由于天气因素，极地区
    DSR 的准确检索具有挑战性；因此，高纬度地区将从未来的研究受益。


