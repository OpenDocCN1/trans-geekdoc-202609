    该算法还应用于 VIIRS 数据以测试其在云产品掩码的映射，每日映射显示的空间模式与云和地球能量系统 TOA 表面和通量产品相似，但数据更多。进一步分析表明，在进行迁移学习（TL）后，模型性能随训练数据数量的增加而提高。本研究证明了
    TL 在 DSR 泛化性和准确性方面的潜力，可能应用于其他变量。


