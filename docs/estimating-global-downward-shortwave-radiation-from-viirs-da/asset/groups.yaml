    # Estimating downward swath radiation from VIIRS data using a transfer-learning
    neural network


    Ruohan Li, Dongdong Wang*, Shunlin Liang, Aolin Jia, Zhihao Wang


    Department of Geographical Sciences, University of Maryland, College Park, MD
    20742, USA


    +   * Keywords:

    * Transfer learning

    * Machine learning

    * VIIRS

    * Downward swath radiation

    * Radiative transfer

    * Solar energy


    In recent years, machine learning (ML) has been successfully used in estimating
    downward swath radiation. To achieve global coverage, traditional ML models need
    sufficient measurements covering various atmospheric and surface conditions globally,
    which is difficult to accomplish. On the simulated data of a radiative transfer
    model (RTM) is a possible solution. We used VIIRS indices from complex conditions
    which bring bias to simulations. A neural network introduced with the transfer-learning
    capability was used to estimate global DSR with only top-of-atmosphere and surface
    albedo at local solar noon. The proposed method also estimates daily swath from
    VIIRS Infrared Spectror Radiometer (VIIRS) data at 750m resolution, and is validated
    by independent observations. The root-mean square error and relative root mean
    square error of DSR observation over 28 Global Surface Network, and eight Greenland
    Network stations in 2013-2015 were 12.3 (16.1%), 10.6 (18.3%), 7.5 (24.2%), and
    the daily validation achieved was 30.5 (15.0) and 31.7 (17.4%), respectively.
    The proposed method shows high accuracy over polar regions and similar performances
    over others compared with traditional ML, physics models (e.g., look-up tables
    and direction), and existing DSR products. The algorithm is also applied to VIIRS
    data to test it in mapping cloud-product mask, and daily mapping shows spatial
    patterns similar to Clouds and the Earth''s Energy System TOA surface and fluxes
    products, with more data. Further analysis indicates that model performance improves
    with the quantity of training data after TL has been. This study demonstrates
    the potential of TL on both the generality and accuracy of DSR, which can potentially
    be applied to other variables.


