  \ 灵感来自诺贝尔物理学奖得者**查理·费曼**（Richard Feynman）。 \n\n1.  凭借费曼的技巧，你只需 `20 分钟` 就能深入理解知识点，而且记忆深刻且*难以忘记*。\
  \ \n\n```\nif (condVar > someVal)\n```\n\n\n\n\n对于管理复杂系统的人来说，DataOps 可以被视为一场跨越一个世纪的思想演变。这些思想以\
  \ W. 爱德华斯·德明博士和统计过程控制等先驱人物为起点并不断改进，随后以敏捷、DevOps 以及如今的 DataOps 等形式逐渐跨入技术领域。\n\n在按需经济中，为了满足用户预期，必须快速交付分析。数据分析团队必须学会以新的方式创建和发布分析，以便持续、快速且准确地交付价值。这种新方法就是\
  \ DataOps，它是工具与方法的结合，在简化新分析开发的同时，确保了无懈可击的数据质量。DataOps 有助于缩短产生分析价值和创新的周期。\n\n我们可以将敏捷开发和\
  \ DevOps 所实现的速度与灵活性，以及统计过程控制所达到的质量控制应用于数据分析。DataOps 是为了执行数据分析而结合了统计过程控制的敏捷开发和 DevOps。数据分析流水线通过\
  \ DataOps、DevOps 以及制造质量原则、方法论和工具应用了敏捷方法。这产生了一种快速响应、灵活且稳健的数据分析能力，以跟上内部利益者和用户的创造力。\n\
  \n## DataOps 概述\n\nDataOps 是一种分析开发策略，强调数据科学家、分析师、数据/提取、转换和加载（ETL）工程师、IT 以及质量保证/治理部门之间的通信、合作、集成、自动化、测量和协作。该方法承认整个端到端分析过程的相互依赖性，旨在帮助组织快速产生洞察，将这些洞察转化为运营工具，并持续改进分析操作和性能，让参与分析过程的整个团队遵循\
  \ DataOps 宣言的价值观。\n\n当正确实施 DataOps 时，许多困扰数据分析团队的问题都可以得到解决。\n\nDataOps 方法的挑战在 `表\
  \ 6.1` 中所示。\n\n| 挑战 | DataOps 方法 |\n| --- | --- |\n| 需求变化 | 在每次迭代中，团队都会交付一些有价值的内容。如果需求发生变化，新需求将被放入未来迭代的请求列表中\
  \ |\n| 进度延误 | 允许对正在进行的进展具有更高的可见性，迭代连续发生。随着经验的积累，团队的预测能力将会提高。 |\n| 用户失望 | 用户可以快速收到新功能，并向开发团队反馈如何通过更多新功能来持续改进数据分析。\
  \ |\n| 缺乏活性 | DataOps 能够快速响应变化。团队可以在下一次迭代开始时进行转向，而根据定义，这总是相对较快的。 |\n| 质量低劣 | 以统计过程控制的形式，广泛的自动化测试是\
  \ DataOps 的关键元素。 |\n| 投资回报率（ROI）低 | 数据分析投资的变现开始得早得多，通过短增量交付功能来提高回报率。 |\n| 功能无关 |\
  \ 数据分析团队能够连续地产出管理层最高优先级的功能 |\n\n表 6.1：DataOps 方法面临的挑战\n\nDataOps 并不专注于提高个人或工具的生产力，而是将数据分析流水线视为一个整体，并关注如何让其运行得更快、质量更高。\n\
  \n## DataOps 的核心业务收益\n\nDataOps 通过使用将现有工具集成到 DataOps 开发流水线的自动化平台，提升了数据分析团队为用户构建和发布新洞察的能力。它要求敏捷的态度，并由自动化平台支持。DataOps\
  \ 的目的是通过跨从数据收集到洞察交付的整个分析过程，实现更多洞察和更好的分析，同时保持更快的速度、低的成本和更高的质量。\n\n采用 DataOps 的核心业务收益是：缩短获取洞察的时间、提高分析质量、降低提出下一个业务问题的边际成本、提高分析团队士气、通过敏捷流程提高团队效率，以及复用和重构。\n\
  \n## DataOps 的实施\n\n业务需求演变非常快，这也是数据分析对企业至关重要的原因；通常，使用传统方法应对这些挑战的数据分析团队最终会面临用户的失望，而\
  \ DataOps 提供了一种可以在数量级上优化数据分析流水线生产力的更有效的方法。\n\n假设营销副总裁要求在明天之前完成一个新的新的客户细分；那么，通过 DataOps，数据分析团队可以充满信心地回答“好的”，并确信更改可以快速、高效且稳健地完成。\n\
  \n在组织中，DataOps 是如何实施的？数据分析团队可以使用以下步骤迁移到 DataOps：\n\n### 1. 增加数据和逻辑测试\n\n当你对分析流水线进行更改时，如何确保你没有破坏任何东西？\n\
  \n在不需要耗时的人工测试的情况下，自动化测试确保了功能发布具有卓越的质量。其概念是：每当数据分析团队的成员做出更改时，他或她就会为该更改添加一个测试。测试随着每个功能的添加而增式地实施，确保质量是内置的。在大型运行中，流水线的每一层都可能执行数百次测试。\n\
  \n在数据分析中，添加测试类似于在制造运营流程中实施统计过程控制。测试通过确保在制品符合要求，从而确保最终产品的质量。数据、模型和推理都可以可能进行测试。\n\n\
  在数据分析流水线中，每一步都应该至少有一个测试，其哲学是从简单的测试开始并随着时间的推移而增长。在发布给用户之前，即使是简单的测试最终也会捕获错误。例如，在整个过程中确保行数（row\
  \ counts）一致性可以是一项非常强大的测试。在连接（join）操作上，人们很容易出错产生一个无法正确执行的笛卡尔积。简单的行数测试就能很快捕获这一点。\n\
  \n除了错误之外，测试还可以检测数据超过某些边界时触发的警告。例如，一周内的客户交易量如果处于历史平均值的 90% 以内，可能是正常的。如果交易水平超过了该值，可能会标记一个警告。这可能是一种季节性现象而非错误，但其原因需要调查，例如。一旦识别并理解了这一点，数据的用户就可以收到提醒。\n\
  \nDataOps 并不是追求完美；事实上，它承认代码是有缺陷的。数据分析团队尽其努力是自然的，但如果他们仍然遗掉了某些内容，他们会注意到问题没有再次发生，并能够找出导致问题的原因并添加测试。在快速发布的环境中，修复方案可以快速扩展到消费者那里。\n\
  \n由于 DataOps 允许你做出更改并在已有测试套件的情况下快速运行测试套件，你可以放快速使用它。如果更改通过了测试，数据分析团队成员就可以充满信心地发布它们。知识被构建在系统中，过程保持受控。\n\
  \n\n\n\n自动化测试持续监控数据流水线中的错误和异常，日日夜夜永不休息。如果你构建了 `DataOps` 仪表板，就可以随时查看数据操作的高级状态。如果警告和失败告报是自动化的，你就不需要不断检查仪表板。自动化测试将数据分析团队从手动测试的枯燥工作中解放出来，让他们专注于更高价值的活动。\n\
  \n![](img/Figure-6.5.jpg)\n\n**图 6.5：** 测试使数据专业人员对数据流水线应用统计过程控制\n\n### 2 版本控制系统的使用\n\
  \n利益相关者将原始数据转换为有用信息需要许多处理步骤。\n\n数据必须流经过这些步骤，并以某种方式连接起来，最终目标是产生有价值的数据分析输出。数据分析流水线在概念上是一系列阶段，通过使用各种工具实现，如\
  \ `ETL` 工具、`data science` 工具、`self-service data prep tools`、`reporting tools` 和可视化工具，以便对数据进行预处理、清洗、检查、转换、合并、分析和报告。\n\
  \n这些阶段是串行执行的；但其中许多阶段可以并行化。`scripts`、`source code`、`algorithms`、`HTML`、`configuration\
  \ files`、`parameter files`、`containers` 以及其他文件由流水线阶段定义，这就是流水线具有确定性的原因。本质上，所有这些都是以可重复的方式端到端控制整个数据分析流水线的代码。\n\
  \n通常持续改进的制品（文件）使得这种可重复性成为。像任何其他软件项目一样，`Git` 等版本控制系统应该维护与数据流水线相关的源代码。在版本控制工具的帮助下，个人团队可以组织和管理代码的更改和修订。\n\
  \n它还将代码保留在已知仓库中，有利于灾难恢复。然而，版本控制最重要的好处是它所促进的流程变更，允许数据分析团队成员进行分支和合并。\n\n## 3 数据分析团队成员的分支与合并\n\
  \n在典型的软件项目中，开发者不断更新各种源代码文件。\n\n如果开发者想开发某个功能，他/她会从版本控制工具拉取相关代码的副本，并在本地副本（称为 `branch`）上开始开发更改。这种方法有助于数据分析团队并行维护对数据分析流水线的许多代码更改。当\
  \ `branch` 的更改完成并经过测试后，来自 `branch` 的代码将合并回代码来源的 `trunk`。\n\n分支和合并可以极大地提高数据分析的生产力，因为它允许团队并行对同一源代码文件进行更改，而不会以任何方式拖慢对方的速度；每个团队成员都可以控制自己的工作环境、运行自己的测试、做出更改、承担风险并进行实验。如果他们愿意，可以丢弃更改并重新开始。团队成员提供了一个隔离的机器环境，这是另一个让他们能够良好并行工作的关键。\n\
  \n![](img/Figure-6.6.jpg)\n\n**图 6.6：** 分支和合并允许数据分析中的并行开发。\n\n### 4 多个环境的使用\n\n\
  在他们自己的机器上，存在数据分析团队每个成员所需的开发工具。\n\n在某些情况下，为了整合不同的运行条件，数据分析流水线需要足够的灵活性。为了提高开发速度，需要构建到流水线选项包括：使用的原始数据版本、数据是定向生产环境还是测试环境、是否根据某些标准过滤记录，以及是否包含工作流中的特定处理步骤。通过健的流水线设计，工程师或分析师将允许使用\
  \ `parameters` 调用或指定这些选项。在软件开发中，`parameter` 是某些信息，如 `name`、`id` 或 `option`，传递给程序并影响其执行方式。\n\
  \n### 5 代码的复用与容器化\n\n团队另一种提高生产力的方法是代码的复用和容器化。在数据分析流水线，每一步都接收前一个阶段的输出并为下一阶段提供输入。由于处理单体非常麻烦，流行的容器技术之一是\
  \ `Docker`。\n\n数据分析中的某些步骤是混乱且复杂的。例如，单个操作可能会调用自定义工具、运行 `python` 脚本、使用 `FTP` 以及其他专门逻辑。由于它需要特定的技能，由于其要求可能很难设置。一旦代码被放入\
  \ `container` 中，对于那些不容器内部自定义工具但知道如何使用容器外部接口的其他程序员来说，使用起来就会容易得多。\n\n### 6 处理参数化\n\
  \n如果设计具有正确的灵活性，数据分析流水线将能够适应不同的运行情况。\n\n例如，处方数据是医药公司从第三方公司获得的。数据生产者使用算法来填补数据不完整导致的空白。在改进产品的过程中，数据生产者为了填补空白开发了不同的算法。尽管数据具有相同的形状（行和列），但在使用新算法时，某些字段会被修改。拥有正确内置参数的工程师或分析师可以构建一个并行的数据市，并通参数更改访问新算法，同时拥有旧、新两个版本。\n\
  \n### 7 英雄主义或无畏工作\n\n数据分析专业人士中许多人生活在恐惧中，因为他们有两种常见的方式会让他们在职业上感到尴尬：允许低质量的数据到达用户，部署可能破坏生产系统的更改。\n\
  \n\n\n\n为了避免这些灾难性的场景，数据工程师、科学家和分析师在工作中投入了大量的时间和精力。他们尝试采取“英雄主义”——即加班。\n\n通过设计创新的方法来避免过度承诺，他们付出了大量的希望和祈祷。但问题在于，这些英雄式的努力最终会被环境所击败。如果没有适当的控制，问题就会溜掉，并导致公司的关键分析停滞。\n\
  \nDataOps 企业实施了适当的工具和流程，以确保数据和新分析以高质量标准交付。当企业使用 DataOps 时，工程师、科学家和分析师可以在无需恐惧或无需采取英雄主义的情况下工作，由于质量得到了保障，他们可以放松身。DataOps\
  \ 通过简化两个关键流程来实现这一目标。\n\n### 8. 价值流水线\n\n数据分析中的价值流水线旨在从数据中提取价值。在流水线中，数据进入并移动到一系列阶段，如访问、转换、建模、可视化和用于生产处理的报告。当数据离开流水线时，它会以实用分析的形式为组织创造价值。DataOps\
  \ 使用工具链工作流自动化来优化价值流水线中的运营效率。\n\n价值流水线中的数据持续更新，但代码保持不变。\n\n步骤 2 了使用 DataOps 版本控制实现来控制代码的基础。\n\
  \nDataOps 通过实施数据测试（步骤 1），防止了低质量数据进入价值流水线导致这种最坏的结果。在制造工作流中，数据测试确保数据值处于受统计过程控制（SPC）启发的可接受的统计范围内。在流水线中，数据测试验证每个处理阶段的输入和输出数据值。例如，手机号码应该是十位数字，任何其他值都是错误的或需要归一化的。\n\
  \n一旦数据测试到位，它们就会 24×7 不断工作，价值流水线的完整性就得到了保障。\n\n质量被字面上嵌入到了产品中。如果数据不当地流过流水线，数据测试可以检测到并采取行动，在大多数情况下，这意味着向数据分析团队发送警报，由他们进行调查。这些检查甚至可以以自动制造的真正精神实现“停线”。统计过程控制消除了对可能出现错误的担忧。在有正确数据测试的情况下，数据分析团队可以在无需恐惧或无需英雄主义的情况下运行，从而让\
  \ DataOps 工程师专注于他们的另一个主要职责：创新流水线。\n\n### 9. 创新流水线\n\n创新流水线旨在通过将新想法付诸行动产生分析见解来改进分析。新功能在部署到生产系统之前必须先开发。创新流水线产生了一个反馈循环，新的问题和想法促使更多的研发，从而产生更深入的见解和创新，以改进分析。随着新功能的开发，代码不断演进，但数据保持一致。通过保持数据静态，防止了数据变化被错误地归因于新算法的影响。在\
  \ DataOps 实现中，可以在创建开发环境（步骤 4）的同时构建一个固定的数据集。\n\nDataOps 通过自动化构建和部署新分析的工作流，实现了新想法的持续部署，从而缩短了从想法到创新的整体周期。在执行此操作时，开发团队必须避免引入破坏生产的新分析。DataOps\
  \ 企业使用逻辑测试（步骤 1）在代码部署之前对其进行验证，以确保数据符合业务假设。例如，在客户维度表中，标识客户的字段应与现有条目匹配。不匹配应触发某种类型的后续操作。\n\
  \n为了实现持续部署，开发流水线可以配置逻辑测试来实现自动化，这简化了新增强功能的发布，并使数据分析团队专注于下一个有价值的功能。有了 DataOps，开发团队可以在无需恐惧或无需英雄主义的情况下工作，并在无需担心破坏生产系统的情况下部署，这是一个充实、高效团队的关键特征。\n\
  \n### 10. 价值-创新流水线\n\n在现实的数据分析中，价值流水线和创新流水线并不是分离的；通常由同一团队负责利用相同的资产和事件，且它们之间相互影响。\n\
  \n价值-创新流水线结合了这两个工作流。\n\n开发与生产之间、数据与代码之间的相互作用被价值-创新流水线所捕捉。通过消除这种障碍，DataOps 可以增强周期时间、质量和创造性。在保持完美质量的同时，DataOps\
  \ 企业同时管理数据到生产的编排和新功能的部署。为了在对业务产生高水平影响的同时提高质量，团队可以信心地向前，，帮助 DataOps 工程师缩短周期。DataOps\
  \ 通过加速从数据中提取价值，并确保生产系统中数据和代码的质量，加速了新开发的速度。通过对 DataOps 产生的价值-创新流水线充满信心，数据分析团队避免了定义非\
  \ DataOps 公司的担忧和过度谨慎。\n\n# DataOps 的知识遗产\n\n一种通过按需利用 IT 资源并自动集成、测试和部署代码来专注于软件持续集成和持续交付的软件开发方法，是使用自动化并由\
  \ DevOps 加速的构建生命周期。这种软件开发与 IT 运营的合并（“DEVelopment”和“OPerationS”）减少了部署时间，减少了上市时间，减少了缺陷，并缩短了解决问题所需的时间。\n\
  \n使用 DevOps 使公司的软件发布周期从几个月缩短到了（字面上的）秒，这使他们能够在快速的新兴市场中增长并领先。谷歌、亚马逊以及许多其他公司现在每天发布几次软件。通过提高代码发布的质量和周期时间，DevOps\
  \ 为这些公司的成功做出了巨大贡献。\n\n对于数据分析而言，优化代码构建和交付只是更大大拼图的一部分。\n\nDataOps 旨在缩短从想法源头到字面上创建产生价值的图表、图形和模型的端到端周期时间。数据生命周期除了工具外还依赖于人。DataOps\
  \ 必须管理协作和创新才能发挥作用。DataOps 将敏捷开发引入数据分析，以便数据团队和用户能够更高效、更有效地共同工作。\n\n数据团队在敏捷开发中通过被称为“迭代”（sprints）的短增量交付新鲜或更新的见解。由于创新发生得如此快，团队可能不断重新评估其优先级，并更容易地适应变化的需求。当采用瀑布式项目管理风格时，它会将团队锁定在长的开发周期中，并在最后进行一次“大爆炸式”交付，这种响应水平是无法实现的。\n\
  \n当敏捷软件开发取代传统的瀑布式顺序过程时，研究表明项目完成得更快，故障更少。\n\n\n\n\n\n当敏捷软件开发取代传统的瀑布顺序流程时，研究表明项目完成得更快，且故障更少。\n\
  \n敏捷技术在需求不断变化的背景下尤为有效，而数据分析专家们对此再熟悉不过。敏捷方法帮助公司快速响应客户需求，并在 DataOps 场景中缩短价值实现时间。\n\
  \n敏捷开发和 DevOps 为数据分析提供了巨大的价值，但分析开发和部署还有一个关键组成部分：DataOps 还控制和编排数据流水线。数据从一侧进入流水线，经过多个过程，然后以报告、模型和视图的形式输出。数据分析的“运营”端就是数据流水线。在质量、效率、限制和可用性方面，数据流水线可以比作生产线。为了完全拥抱这种工业化方法，我们将这条流水线称为“数据工厂”。\n\
  \n数据在运营中的流转是 DataOps 的重点关注领域。数据工厂由 DataOps 进行编排、监控和管理。统计过程控制（`SPC`）是一种强力的精益制造技术，通过测量和监控数据流水线的数据和操作特征，确保统计数据保持在接受范围内。当使用\
  \ `SPC` 分析数据时，它会在效率、质量和透明度方面带来显著收益。在 `SPC` 的作用下，通过操作系统的数据被验证为功能正常的。如果发生异常，数据分析团队将通过自动告警获知。\n\
  \n尽管“DataOps”这一术语意味着它大量借鉴了 DevOps，但 DataOps 的概念传承包含了所有三种方法——敏捷、DevOps 和统计过程控制。`SPC`\
  \ 编排并监控数据工厂，而敏捷则治理分析开发。DevOps 则改进了新分析的代码验证、构建和交付。\n\n人们管理复杂系统的方式已经改进，这可以看作是 DataOps\
  \ 百年的演进。在技术领域，这些思想由德明格等先驱发起的统计过程控制开始，逐渐演变为敏捷、DevOps，以及现在的 DataOps。\n\n## DevOps\
  \ 和 DataOps——人为因素\n\nDataOps 不仅关乎工具，更关乎人的管理。DataOps 和 DevOps 之间的一个微妙区别在于利益相关者的需求和偏好。\n\
  \nDevOps 的创建服务热爱编程和拥抱技术的软件开发人员的需求。他们对代码创建、集成和部署的所有微小细节中的复杂性抱有专业兴趣，对他们来说，学习新语言或部署新工具是一个机会。\n\
  \nDataOps 的用户（数据科学家或分析师）通常与此相反，他们专注于构建和部署模型以及可视化。这些科学家和分析师的技术水平通常不如开发（工程师，因为他们专注于自己的专业领域。他们的兴趣在于如何以图形方式呈现数据，以便使模型更具预测性或决定性。构建这些模型和可视化所使用的技术仅仅是实现目标的工具。数据专业人员乐于只使用一两个工具，任何额外的工具都会增加不必要的复杂性，在某些情况下，这种复杂性会超出他们的管理能力。DataOps\
  \ 意识到数据专业人员工作在多工具异构环境中，并努力让该环境更可控。\n\n## DevOps 和 DataOps——流程差异\n\n通过观察数据分析开发和生命周期流程，可以理解数据专业人员面临的独特复杂性。相对于软件开发人员，两者既相似又独特，我们发现数据分析专业人员也面临着挑战。\n\
  \n通过图示，DevOps 生命周期被描绘成无限符号的形状，其中周期的终点（“计划”）反馈回起点（“创建”），过程无限迭代。\n\nDataOps 的生命周期也共享这些迭代特性；然而，一个重要的区别是\
  \ DataOps 由两条活跃且交叉的流水线组成：一条流水线是数据工厂，另一条流水线负责控制数据工厂的更新，即新分析结果在数据流水线中的创建和部署。\n\n通过一系列被称为“价值流水线”的编排步骤，原始数据源作为输入进入数据工厂，产生为组织创造“价值”的分析洞察。DataOps\
  \ 使用 `SPC` 进行自动编排，监控流经价值流水线的数据质量。\n\n“创新流水线”在概念上类似于 DevOps 开发过程，是将新的分析想法引入价值流水线的过程；然而，仔细观察发现，几个因素使得\
  \ DataOps 开发过程比 DevOps 更具挑战性。\n\n# DevOps 和 DataOps——开发与部署流程\n\nDataOps 开发模型构建在\
  \ DevOps 之上。在软件开发项目中，一组步骤在 DevOps 流程中是常见的，包括：`Development`（开发——创建/修改应用程序）、`Build`（构建——应用程序组件组装）、`Test`（测试——在测试环境中验证应用程序）、`Deploy`（部署——将代码过渡到生产环境）、`Run`（运行——应用程序执行）。\n\
  \n持续集成（`CI`）和持续部署（`CD`）是 DevOps 引入的两个基础概念。`CI` 在开发环境中持续构建、集成和测试新代码。`Build` 和 `Test`\
  \ 是自动化的，允许快速识别并解决问题，以便它们能够频繁且重复地发生。\n\n持续部署是一种部署或交付软件的自动化方法。DevOps 在通过所有资格测试后将应用程序部署到生产环境。`CI`\
  \ 和 `CD` 共同解决了阻碍敏捷开发的主要限制。在 DevOps 之前，敏捷创造的系列快速更新和创新会在手动集成和部署过程中停滞。通过自动化的 `CI` 和\
  \ `CD`，DevOps 使公司能够每天更新软件多次次。\n\n# DataOps 中编排的双重性\n\nDataOps 编排数据工厂（价值流水线），需要注意的是，在\
  \ DataOps 过程中，“编排”发生了两次。\n\n数据工厂由包含许多步骤的流水线过程组成。以复杂的有向无环图（`DAG`）为例，“编排器”可以是一个控制步骤执行、遍历\
  \ `DAG` 并处理异常的软件实体。诸如创建容器、调用带有上下文参数的运行时进程、在阶段之间传输数据以及“监控”流水线执行等活动可能由编排器完成。第二次“编排”是\
  \ DataOps 过程中对数据工厂的编排。\n\n数据流水线的代表性副本包含创新流水线，它用于在部署到生产环境之前测试和验证新的分析结果；以及在新的分析结果“测试”期间并在“部署”之前发生的编排。\n\
  \n在价值和创新流水线中都会发生编排。同样，DataOps 的双重角色由测试完成。\n\n\n\n\n\n测试在 DataOps 的价值流水线和创新流水线中都发挥着作用。价值流水线中的测试监控数据在通过数据工厂过程中的值，寻找异常情况或偏离统计基准的数据值。在将新的分析部署到创新流水线之前，测试会对其进行确认。\n\
  \nDataOps 中的测试要么侧重于数据，要么侧重于代码。数据在通过价值流水线时，受到统计过程管理和监控。测试针对的是不断变化的数据。另一方面，价值流水线的分析是固定的，仅通过正式的发布程序进行更改。分析是在价值流水线中管理的修订版本，以避免任何可能损害数据工厂的服务中断。\n\
  \n在创新流水线中，数据是固定的，而代码是灵活的。分析会不断修订和更新，直到完成。一旦沙箱（或分析开发环境）建立，数据就很少变化。创新流水线中的测试侧重于代码（分析）而非数据。在将新代码推广（合并）到生产环境之前，必须通过所有测试。一个良好的测试套件可以充当自动影响研究，在任何和所有代码更改部署之前运行。\n\
  \n数据和代码都旨在实现某些测试目标。例如，一个确保数据库具有正确行数的测试有助于你的数据和代码协同工作。最终，数据测试和代码测试都需要在集成流水线中结合。DataOps\
  \ 使代码和数据测试能够协同工作，以保持全方位的高质量。\n\n## DataOps 中沙箱管理的复杂性\n\n创建一个“沙箱”（一个隔离的开发环境，工程师可以在其中编写和测试新的应用程序功能）是加入软件开发团队的工程师采取的第一步，且不会影响其他并行开发其他功能的同事。在软件开发中，创建沙箱是使用\
  \ DevOps 团队的典型思维，在软件开发中是直观的——工程师接收同事的一系列脚本，他可以在一两天内配置好沙箱。\n\n# DataOps 中测试数据管理的复杂性\n\
  \n为了构建分析开发环境，你必须对数据工厂进行复制，这需要数据专业人员在受安全、治理或许可限制的情况下复制数据。由于复制整个数据集是不行的，因此生成一个具有代表性的数据集需要大量的努力和心心。在对数\
  \ TB 级数据集进行采样和过滤（移除敏感信息）后，可能需要对其进行清洗或脱敏。数据还需要基础设施，由于技术限制或许可限制，这些基础设施可能难以重建。\n\n\
  在大多数 DevOps 环境中，测试数据管理的概念是一个事后考虑，而在 DataOps 中，这是一个基础问题。为了加速分析开发以使创新跟上敏捷迭代，DataOps\
  \ 必须自动化创建所需数据、软件、硬件和库的开发环境。\n\n# 使用 DataOps 以两种方式连接组织\n\n为了以集成化的方式工作，DevOps 致力于帮助开发和运营团队。创建数据仓库和分析的开发团队由分析师、科学家、工程师、架构师等组成。\n\
  \n在数据分析中，运营团队支持并监控数据流水线。这包括客户（创建和消费分析的用户）以及 IT。\n\n为了让他们更紧密地合作，这些小组通过 DataOps 结合。\n\
  \n![](img/Figure-6.7.jpg)\n\n**图 6.7:** DataOps 结合了数据分析开发和数据运营\n\n## 比较自由与集中化\n\n\
  DataOps 在不同的层面将企业结合在一起。自服务技术如 `Tableau`、`Alteryx` 和 `Excel` 用于在公司的远程部门（靠近业务单元）构建数据分析。从事去中心化、分布式分析的本地团队在为人们带来创新方面起着至关重要的作用。通过支持这些创意点，企业的竞争力得以维持，但缺乏自上而下的监督可能会导致不受管理的混乱。\n\
  \n通过将分析开发集中在某个部门（如 `IT`）的监督下，业务能够标准化指标、监控数据质量、执行安全和治理并消除数据孤岛。问题在于，过度的集中化会扼杀创意。\n\
  \nDataOps 同步去中心化与集中数据分析开发之间往返（集中化与自由之间的冲突）的能力是一项重大资产。新的分析在 DataOps 组织的本地创意点中出现并精炼。在被证明有利或值得更广泛分发后，一个概念会被推广到集中的开发小组，该小组可以更高效、更稳健地大规模实施。\n\
  \nDataOps 将本地化和集中的开发结合起来，使组织能够在获得集中化效率的同时保留本地化开发——即创新的尖兵。在开发/运营以及分布式/集中式开发两个维度上，DataOps\
  \ 将企业结合在一起。\n\nDataOps 在组织的核心小组之间带来了三个创新循环：集中的生产团队、集中的数据工程/分析/科学/治理开发团队，以及分布在最接近客户的业务部门中使用自服务工具的小组。\n\
  \n# 数据分析生命周期复杂性的企业示例\n\n在我们从宏观视角查看 DataOps 开发流程后，让我们看看组织背景下的开发生命周期。个人创建并开发分析，随后将其组合成团队项目。分析在通过单元用户验收测试（UAT）后进入生产环境。DataOps\
  \ 的目的是在个人开发环境中产生分析，将其移动到生产环境，获取用户反馈，然后迭代和改进。由于个人、工具、代码、版本、手动程序/自动化、硬件、操作系统/库以及目标数据的差异，这可能是困难的。\n\
  \n在没有 DataOps 的情况下，在各种环境中将分析引入生产环境是令人敬畏的，并且可能需要手动程序和脚本的补丁，而这些程序和脚本本身就很复杂难以处理。由于成功依赖希望和英雄主义，数据专业人员通过延长工作时间来补偿，因为人为流程容易出错，导致不必要的复杂性、混乱以及大量的时间和精力的浪费。由于生命周期进展缓慢以及高严重错误进入生产环境，数据分析团队将几乎没有时间进行创新。\n\
  \n\n\n\n\nDataOps 的各个步骤和过程由 DataOps 平台自动化：沙箱管理、编排、监控、测试、部署、数据工厂、仪表板、敏捷以及等。DataOps\
  \ 平台为数据专业人员构建，目标是将他们所需的所有工具、步骤和过程简化为易于使用、可配置的端到端系统。这种高度的自动化消除了大量手动工作，使团队能够创建新的、创新的分析，从而最大限度地发挥组织数据的价值。\n\
  \n# 结论\n\n本章介绍了基于 DataOps 的数据工程，这是一种自动化的、以流程为导向的方法，数据和分析团队利用其提高数据质量并缩短数据分析的周期。\n\
  \n在当今的业务中，数据是竞争的关键资产。本文解释了 DataOps 的目标、定义和需求。接下来将讨论 DataOps 中的人员、流程和技术问题。\n\n此外，在开始使用\
  \ DataOps 和采用 DataOps 时，还讨论了给领导者的建议。接下来将讨论 DataOps 的数据架构、DataOps 原则、数据分析 DataOps、DataOps\
  \ 的核心优势以及 DataOps 的实施。\n\n接下来的章节将讨论价值与创新流水线、DataOps、DevOps 和 DataOps 的知识传承——人类因素/流程差异/开发与部署流程、编排的二元性以及\
  \ DataOps 中测试的二元性。最后，将讨论 DataOps 中沙箱管理/测试数据管理的复杂性、如何使用 DataOps 以两种方式连接组织，以及数据分析生命周期复杂性的企业案例。\n\
  \n下一章关于 MLOps：机器学习运营工程，它是数据科学家与运营或生产团队之间的通信。它的设计旨在消除浪费、尽可能自动化，并利用机器学习产生更丰富、更一致的洞察，具有深度的协作性质。机器学习可以成为业务的规则改变者。\n\
  \n# 关键词\n\n* **DataOps**: 它是一种自动化的、以流程为导向的方法，分析和数据团队利用其提高数据质量并缩短数据分析的周期。\n* **DevOps**:\
  \ 重点通过利用按需 IT 资源以及自动化分析的测试和部署来实现持续交付。\n* **敏捷 (Agile)**: 为了提高质量、速度和协作，并促进持续改进的文化，DataOps\
  \ 将集成且面向流程的数据视角与来自敏捷软件工程的自动化和方法结合起来。\n* **目标 (Goals)**: DataOps 实践的目标是持续模型部署、促进可重复性、促进敏捷性、促进自助、文化、流程和技术。\n\
  * **DataOps 定义 (DataOps definition)**: 对人员、流程和技术的编排，旨在快速向数据公民交付信任、高质量的数据。\n* **需求\
  \ (Need)**: 随着数据变得主流，DataOps 的需求源于对数据更高敏捷性的需求。\n* **人员、流程和技术 (People, process, and\
  \ technology)**: DataOps 通过自动化技术支持高生产力团队，在项目输出和时间上带来巨大的效率。工具对于任何依赖自动化的实践都是必要的。DataOps\
  \ 的核心是贵组织的信息架构。工具支持你业务中的 DataOps 实践。在数据策展服务、元数据管理、数据治理、主数据管理（MDM）和自助交互这五个关键领域的自动化可以改变你的数据流水线。\n\
  * **SPC**: 统计过程控制以敏捷、DevOps 和 DataOps 的形式跨越了技术领域，能够跟上内部利益者和用户的创造力，从而产生快速、灵活且稳健的数据分析能力。\n\
  * **数据分析 (Data analytics)**: 在按需经济中，分析必须快速提供以匹配消费者的预期。DataOps 是技术和程序的结合，在确保无暇数据质量的同时简化了新分析的生产，并有助于缩短创建分析价值和创新的周期。\n\
  * **价值流水线 (Value pipeline)**: 数据分析的价值流水线寻求从数据中提取价值。数据进入流水线，进入生产处理，当数据离开流水线并以有用分析的形式输出时，就为组织创造了价值。\n\
  * **创新流水线 (Innovation pipeline)**: 创新流水线通过实施能够产生分析洞察的新想法来改进分析。在部署到生产系统之前，新功能要经过开发创建一个反馈循环。为了增强分析，创新激发了新的问题和想法。\n\
  * **知识传承 (Intellectual heritage)**: DevOps 专注于通过利用按需 IT 资源以及自动化代码的集成、测试和部署来实现软件的\
  \ CI 和 CD，这是一种利用自动化加速构建周期的软件开发方法。这种软件开发与 IT 运营的融合缩短了部署时间、缩短了上市时间、减少了缺陷并缩短了解决问题所需的时间。DataOps\
  \ 的知识传承由敏捷、DevOps 和统计过程控制组成。\n* **沙箱管理 (Sandbox management)**: 当工程师加入软件开发团队时，第一步是构建一个沙箱，这是一个隔离的开发环境，工程师可以在其中编写和测试新的应用程序功能，而不会影响同时在其他项目上的团队成员。\n\
  * **数据工厂 (Data factory)**: 数据流水线是数据分析的“运营”侧。一条必须管理质量、效率、约束和运行时间的生产线数据数据流水线被称为“数据工厂”。DataOps\
  \ 编排、监控并管理数据工厂。\n* **编排 (Orchestration)**: 数据分析管理并编排数据流水线。数据不断从流水线的一侧进入，经过一系列步骤，并以报告、模型和视图的形式退出。\n\
  * **自由 (Freedom)**: 大许多数据分析开发发生在公司的远端，靠近业务部门。参与去中心化、分布式分析创建的本地团队在为用户提供创新的方面起着至关重要的作用。通过赋能这些创意点，保持企业的竞争力。\n\
  * **中心化 (Centralization)**: 通过在单一部门（如 IT）的监督下将分析开发中心化，企业能够能够标准化指标、监控数据质量、实施安全和治理。DataOps\
  \ 在数据分析的去中心化和中心化演进之间平衡了张力。\n\n\n\n\n\n在您的机器学习运营的最前沿，MLOps 可以通过明确的方向和可衡量的基准将业务利益带回；同时，从组织利益的角度来看，数据科学家的工作可以获得两者的兼得。\n\
  \nMLOps 应对并解决了机器学习应用在开发、部署和运行阶段的综合关注问题。\n\n# 结构\n\n在本章中，将涵盖以下主题：\n\n*   机器学习运维 (MLOps)\
