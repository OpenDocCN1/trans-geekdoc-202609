  \ TechNet` 社区的贡献者。他编写了涵盖多种技术的书籍，包括《使用 .NET Core 通过示例构建微服务》（BPB 出版）。\n\n博客链接：`[`gaurav-arora.com/blog/`](https://gaurav-arora.com/blog/)`\n\
  \nLinkedIn 个人资料：`[`www.linkedin.com/in/aroragaurav/`](https://www.linkedin.com/in/aroragaurav/)`\n\
  \n\n\n\n\n`Chitra Lele` 是一位年轻的软件工程师、软件解决方案架构师、纪录级作家、获奖诗人以及研究学者。Chitra 运营着自己的软件初创公司\
  \ `Chitra Lele & Associates`，该公司基于伦理对齐设计（Ethically-Aligned Design）原则设计软件解决方案。她还是名为\
  \ `Chitra Cares` (`chitracares.com`) 的社会变革倡议的创始人，该组织致力于社区建设项目。通过软件项目、和平工作、学术著作和社会变革倡议，Chitra\
  \ 致力于为世界的更大的利益做出贡献。\n\n`Priyanka Dive` 是一位 DevOps 架构师及丰富的工程师，在信息技术和服务行业拥有超过七年的工作经验。她是一位出色的工程专业人员，擅长`Linux\
  \ 系统管理`、`Docker`、`Apache Kafka`、`Jenkins`、`Kubernetes` 和 `Shell Script`。她曾担任 DevOps\
  \ 工程师，在 `Kubernetes` 集群上使用 `Jenkins` 实现 `CI-CD`。具有 `AWS` 和 `Azure` 等云服务的实战经验。她是书籍《Devops\
  \ for Salesforce》的合著者，目前在 `ChordX` 担任 DevOps 架构师。\n\n# 致谢\n\n首先，我们感谢全球所有的研究人员和工业开发者对涉及\
  \ xOps 实践——`DevOps`、`DataOps`、`MLOps` 的各种概念和技术的贡献。\n\n这类书籍的诞生可以追溯到远早于出版社邀请写本书的活动。正是我们学术与工业之间的互动、大学的创新委员会，以及为工程/技术/管理/工商管理/计算机应用学生/教师（FDPs）提供的\
  \ xOps——`DevOps`、`DataOps`、`MLOps` 课程/`/工作坊/研讨会`，以帮助他们的技能发展和行业就绪，让我们对该领域产生了兴趣。结合我们一段时间以来对业务世界的观察以及开展的工作/研究，我们决定写一本关于结合\
  \ `DataOps`、`MLOps` 和 `DevOps` 的书。\n\n在未来几年里，新技术、全球经济以及许多其他因素将为企业和社会的发展带来无数变化。从现在开始，领导者需要比以往任何时候都更加灵活、反应迅速且果断。为了生存、繁荣、成功和获胜，企业需要展望未来。我们正希望通过这本书为读者提供这种努力和目标。\n\
  \n感谢所有工程、技术、管理、工商管理、计算机应用专业的学生/教师，为我们提供了同样创新的教学学习体验。\n\n我们要感谢我们的出版社 `BPB Publications`\
  \ 团队在整个过程中提供的宝贵支持。对团队不懈的合作表示深表感谢。与他们合作非常愉快！然而，最后的致敬和感谢是留给我们的家人的，没有他们的支持、合作和理解，这一切将是不可能实现的。他们的灵感和爱在我们整个职业生涯中提供了必要的支持。\n\
  \n我们诚诚地希望这本关于结合 `DataOps`、`MLOps` 和 `DevOps` 的书能够满足我们所有价值读者的需求。\n\n# 前言\n\n成功的项目需要跨机构的人员投入、努力、洞察、远见、事后之明的合作。\n\
  \n这关于结合 `DataOps`、`MLOps` 和 `DevOps` 的书主要针对那些发现组织内部存在摩擦的管理人员和个人贡献者，他们正在寻找具体的、可操作的步骤，以便在工作环境中实施或改进\
  \ xOps 文化。寻求缓解痛点的实用建议的各级个人贡献者将可以在书中找到可行的见解。本书涵盖了广泛的 xOps 实践、技能和理论，包括对基础理念的介绍。阅读本书后，你将对\
  \ xOps 文化对你的组织的实际意义有坚实的理解，以及如何鼓励有效协作以实现价值化。\n\n`DevOps` 是一套结合软件开发（Dev）和信息技术（Ops）的实践，旨在缩短系统开发周期并提供高质量的交付。其意图是将敏捷开发实践与持续部署相结合，以便随时发布就绪的新功能。\n\
  \n`DataOps` 是一种面向数据的自动化方法，由数据团队使用以提高质量并缩短周期。尽管这听起来与 `DevOps` 非常不同，但在大多数产品公司中，它与部署的产品密切相连。因此，数据分析主要关注研发团队需要确保其开发努力的预期结果确实作为持续部署流水线的一部分得以。\n\
  \n`MLOps` 是数据科学家与运维人员之间协作与沟通的实践，有助于管理机器学习周期。传统上，数据科学家根据数据集开发模型然后继续工作，而目前许多系统中，`ML/DL`\
  \ 模型由于数据变化或新的算法见解不断演进，并需要频繁部署。部署后，需要对其进行监控，以确保在训练期间表现良好的模型在运行期间也同样良好。所有这些“Ops”都代表“运营”，关键在于记住对于任何系统、产品或解决方案，只有一个运营职能负责它。因此，`Dev`、`Data`\
  \ 和 `ML` 都必须集成到同一个 `Ops` 中。总之，无论你从事哪种“Ops”，它们都必须汇合同一个运营中，因此你需要在跨职团队中工作以确保实现目标。\n\
  \n通过本书的八章，你将学习以下内容：\n\n# 第一章：容器化是新的虚拟化\n`为了在不同的计算环境之间快速、可靠地运行你的应用程序，你需要一个名为`Container`\
  \ 的软件单元，它将代码及其所有依赖项打包在一起，以便你的程序运行。\n\n# 第二章：使用 Docker 容器开发和部署软件\n`Docker` 是一个用于开发、交付和运行应用程序的开放平台。通过利用\
  \ `Docker` 快速交付、测试和部署代码的方法论，你可以显著缩短从编写代码到在生产环境中运行的延迟。\n\n\n\n\n\n第 3 章 描述了用于规模化构建协作、亲和力和工具化文化的\
  \ DevOps。这是一种软件工程文化，它在工具的保护伞下统一了开发和运维团队，实现了软件开发阶段阶段自动化。它自动化了支持运营目标的服务管理，并改进了开发目标对生产环境堆栈层次的理解。\n\
  \n第 4 章 介绍了用于微服务架构设计的 Docker 容器。微服务是一个隔离的、松耦合的开发单元，专注于单一关注点。其核心思想是，当应用程序拆分成更小的、可组合的协作部分时，将变得更容易构建和维护。每个组件都进行持续开发和独立维护，应用程序就是其组成组件的总和。\n\
  \n第 5 章 介绍了 Kubernetes —— 一个由 Google Labs 开发的容器管理器，用于管理物理、虚拟和云基础设施等不同环境中的容器化应用程序。它是一个开源系统，有助于创建和管理应用的容器化。\n\
  \n第 6 章 描述了基于 DataOps 的数据工程，这是一种自动化的、面向过程的方法论，被分析和数据团队使用，用于提高数据分析的质量并缩短周期时间。它侧重于通过按需利用\
  \ IT 资源以及自动化分析的测试和部署来实现持续交付。DataOps 是人员、流程和技术的对齐，以实现数据的快速、自动化和安全管理。\n\n第 7 章 向你介绍了\
  \ MLOps：机器学习运维工程化。MLOps 是数据科学家与运维团队之间的通信。MLOps 在本质上具有深度协作的特性，旨在消除浪费、尽可能地实现自动化，并利用机器学习产生更丰富、更一致的洞察，成为业务的行业规则改变者。解决机器学习应用在开发、部署和运行阶段的综合关注问题就是\
  \ MLOps。\n\n第 8 章 讨论了 xOps 最佳实践。书中描述了 DevOps 最佳实践，其中开发和运维团队使用 DevOps 作为敏捷软件开发的方法，以速度、质量和控制来构建、测试、部署和监控应用程序。描述了\
  \ DataOps 最佳实践，其中 DataOps 是使企业能够从其数据中提取最大价值的关键。描述了 MLOps 最佳实践，其中 MLOps 是使用代码和促进效率、速度和健壮性的最佳实践将数据科学和机器学习解决方案运营化的过程。本书满足了应用开发者\
  \ —— 前端、后端、端到端（全栈）以及希望在整个应用开发过程中建立良好熟练程度的学生的需求。\n\n# 彩色图片\n\n请点击链接下载本书的彩色图片：\n\n\
