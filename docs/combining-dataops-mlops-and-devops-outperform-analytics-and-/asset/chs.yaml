  ## 引言\n\nKubernetes 是由 Google Labs 开发的一种容器管理技术，用于管理物理、虚拟、本地和云环境中的容器化应用。该开源系统创建并管理应用程序的容器化。\n\
  \n运行容器化应用的节点组称为 Kubernetes 集群。Kubernetes 集群为了一组机器（无论是物理、虚拟、本地还是云）提供了规划和运行容器的可能性。\n\
  \n具有期望状态的 Kubernetes 集群包含要运行的应用或其他负载的定义、它们使用的镜像以及它们提供的资源以及类似的配置细节。Kubernetes 会自动管理你的集群以满足期望状态。例如，如果你想部署一个期望状态为\
  \ 3 的应用，这意味着你需要运行三个应用程序的副本。如果其中一个容器崩溃，Kubernetes 将再添加一个以确保只有两个副本在运行，从而满足期望状态。\n\n\
  # 结构\n\n在本章中，将涵盖以下主题：\n\n- 介绍 Kubernetes\n- 传统/虚拟化/容器部署时代\n- Kubernetes——它不是什么？\n\
  - Kubernetes 架构\n- 组件\n    - 主服务器 (Master server)\n    - 节点服务器 (Node server)\n-\
  \ Kubernetes 对象和负载\n    - 对象——Pod\n    - 负载——副本控制器 (Replication controllers) 和副本集\
  \ (Replication sets)\n    - 部署 (Deployments)\n    - 有状态集 (Stateful sets)\n    -\
  \ 守护进程集 (Daemon sets)\n    - 任务 (Jobs) 和 定时任务 (Cron jobs)\n- 其他 Kubernetes 组件\n\
  \    - 服务 (Services)\n    - 卷和持久卷 (Volumes and persistent volumes)\n    - 标签 (Labels)\
  \ 和注解 (Annotations)\n    - 密钥 (Secrets)\n    - 网络策略 (Network policy)\n- Kubernetes\
  \ 的需求以及它能做什么？\n- Kubernetes 组件\n    - 节点 (node)\n- 插件 (Add-ons)\n- 创建应用\n- 应用部署\n\
  - 自动伸缩 (Autoscaling)\n- 仪表板设置\n- 监控\n- 为什么 Kubernetes 对你很重要？\n- Rebel foods 案例研究\n\
  \n# 目标\n\n\n\n\n\n阅读完本章后，你可以解释 Kubernetes 是什么及其用途。此外，你还可以理解传统/虚拟化/容器化部署的时代，并解释 Kubernetes\
  \ 不是什么。理解 Kubernetes 主服务器（master server）和节点服务器（node server）的架构组件。它还描述了 Kubernetes\
  \ 对象和负载——pod-单容器 pod/多容器 pod、副本控制器（replication controllers）和副本集（replication sets）以及部署（deployments）。关于状态集（stateful\
  \ set）的知识，以及一种确保 pod 唯一性的专用 pod 控制器，另一种在集群每个节点上执行 pod 的 pod 控制器、定时作业（cron jobs）以及守护进程（daemons）。详细描述\
  \ Kubernetes 组件：服务（services）、卷（volumes）、标签（labels）、注解（annotations）、秘密（secrets）以及网络策略（network\
  \ policies）。了解为什么需要 Kubernetes 以及它是做什么的。它提供了 Kubernetes 资源来实现集群功能。学习如何创建应用、通过 Docker\
  \ 文件下载应用，以及在需求增加时增加节点数量、在需求减少时减少节点数量的伸缩能力。了解为什么监控是管理大型集群的一个重要组件。\n\n## 介绍 Kubernetes\n\
  \nKubernetes 是一个用于在集群环境中管理容器化应用的开源系统，最初由 Google 开发。它的目标是提供一种更好的方式来管理相关的分布式组件和服务。Kubernetes\
  \ 拥有快速发展的生态系统，支持声明式配置和自动化，是一个广泛使用的、可扩展的开源平台。名称来源于希腊语，意为“操舵员”。\n\nKubernetes 基本上是一个用于在机器上运行和协调容器化应用的系统，具有可预测性、可扩展性以及管理容器化应用的生命周期。Kubernetes\
  \ 可以决定应用程序如何运行以及与外部世界交互。你可以扩大或缩小服务，执行平滑更新，并在不同版本的应用程序之间切换流量。Kubernetes 提供了极大的灵活性、性能和可靠性来定义和管理你的应用程序。此外，大规模运行生产负载的实践由\
  \ Google 在 2014 年开源。Kubernetes 不仅仅是；它是一个容器平台、一个微服务平台和一个迁移的云平台。\n\nKubernetes 提供的以容器为中心的管理环境为用户负载协调计算、网络和存储，适用于基础设施提供商如平台即服务（PaaS）和基础设施即服务（IaaS）。\n\
  \n你可以简化特定的应用程序工作流以加速开发。即时编排需要健壮且强大的自动化。标签（label）允许用户根据需要组织资源，状态信息简化了工作流并使管理工具更容易创建检查点。在\
  \ Kubernetes 控制平面（control plane）构建的基础上，开发者可以使用相同的 API 创建自己的控制器，例如调度器（schedulers）。Kubernetes\
  \ 和 Docker Swarm 都是创建的辅助工具，用于管理容器集群，将所有服务器视为单个单元，是在集群内部署容器的常用工具。\n\n## Kubernetes\
  \ 使用 Docker 容器吗？\n\n容器编排由 Kubernetes 使用，因此你不需要编写这些任务。它提供了使用 `Minikube` 在本地运行自己的\
  \ Kubernetes 集群。或者，你可以使用 Docker，现在 Kubernetes 支持 Docker。在私有、公共和混合云环境中，Kubernetes\
  \ 是用于管理 Linux 容器的开源系统，在部署容器的组织中，它是容器编排工具之一。可以使用它来运行和管理多个 Docker 容器。\n\n## Kubernetes\
  \ 的用途\n\n它的卖点之一是它一直被用于支持 Google 的大型系统。Google 在两年前将 Kubernetes 开源。这是一个集群和容器管理工具，允许你将容器部署到集群中，这意味着虚拟机网络。\n\
  \n# Kubernetes 可以在不使用 Docker 的情况下使用吗？\n\n你可以使用 Kubernetes 部署 Docker 容器。\n\n其中一种\
  \ Kubernetes 是传统的、全面的平台即服务（PaaS）系统，它在容器层而非硬件层运行，并为 PaaS 服务提供常见功能，如配置、伸缩和加载，但不包括负载均衡、日志和监控。\n\
  \n## Kubernetes 编排\n\n容器化应用的部署、伸缩和管理自动化是由名为 Kubernetes 的开源系统完成的，它组成应用程序的容器分组为逻辑单元，以便管理和发现。\n\
  \n## 传统/虚拟化/容器部署时代\n\n### 传统部署时代\n在早期，由于没有方法界定物理服务器上应用程序的资源边界，由于组织在物理服务器上运行应用程序，存在资源分配问题。如果不同的应用程序运行在同一个物理服务器上，例如，可能会出现一个应用程序占用大部分资源而导致其他应用程序性能下降的情况。这种情况下可能的安排是将每个应用程序运行在不同的物理服务器上，但由于资源未被充分利用，无法扩展，而且对于组织来说，维护许多物理服务器的成本很高。\n\
  \n### 虚拟化部署时代\n虚拟化作为解决方案被引入。它允许在单个物理服务器的 CPU 上运行多个`虚拟机`（VMs）。一个应用程序中的信息不会被另一个程序自由访问，提供了安全和虚拟化层，允许应用程序在虚拟机之间进行分离。\n\
  \n虚拟化提高了物理服务器上的资源利用率和可扩展性。\n\n应用程序可以很容易地添加或更新，降低了硬件成本。一组物理资源可以呈现为带有虚拟化的可丢虚拟机集群。每个\
  \ VM 都是一个完整的机器，除了运行所有组件的虚拟化硬件外，还包含自己的操作系统。\n\n### 容器部署时代\n容器被认为是轻量级的，与虚拟机相似，但具有较宽松的隔离属性以便在应用程序之间共享操作系统。容器更类似于虚拟机，拥有自己的文件系统、CPU、内存和进程空间。\n\
  \n\n\n\n\n容器的流行归功于它们提供的额外优势，例如：\n\n*   **敏捷应用的创建与部署**：与使用 `VM` 镜像相比，容器镜像的创建更加便捷、高效。\n\
  *   **持续的开发、集成和部署**：它提供了可靠且频繁的容器镜像构建和部署，并能够实现快速简便的回滚（由于镜像的不可变性）。\n*   **`Dev` 与\
  \ `Ops` 的关注点分离**：在 `build/release` 时创建应用容器镜像，而不是在部署时，从而将应用程序与基础设施解耦。\n*   **可观测性不仅呈现\
  \ `OS` 级的信息和指标，还能呈现应用健康和其他信号**。\n*   **跨开发、测试和生产环境的一致性**：它在笔记本电脑或桌面上的运行情况与在云端完全相同。\n\
  *   **云和 `OS` 的分发迁移性**：它可以运行在 `Ubuntu`、`RHEL`、`CoreOS`、本地环境、主流公共云以及任何其他地方。\n*  \
  \ **以应用程序为中心的管理**：它提升了抽象层，从在虚拟硬件上运行 `OS` 变为使用逻辑资源在 `OS` 上运行应用程序。\n*   **松耦合、分布式、弹性且解耦的微服务**：应用程序不再运行在大型单一用途机器上，而是被拆分成更小、独立的单元，并进行动态部署和管理——而不是单体堆栈。\n\
  *   **资源隔离**：提供可预测的应用性能。\n*   **资源利用率**：高效率和高密度。\n\n## Kubernetes 不是什么？\n\n`Kubernetes`\
  \ 运行在容器中而非硬件层级，它不是传统的全平台即服务（PaaS），而是提供了许多 `PaaS` 产品常见的功能，如置备、伸缩、负载均衡、日志记录和监控。\n\n\
  `Kubernetes` 并非单体，因此这些标准解决方案是可选且可插的。`Kubernetes` 提供了构建开发平台的构建块，赋予用户选择权，而不限于 `Kubernetes`。如果你的应用程序可以在容器中运行，它就应该成功运行。源代码并不由\
  \ `Kubernetes` 提供。\n\n企业文化、设置和技术需求决定了你的持续集成、置备和工作流。`Kubernetes` 不提供诸如中间件（如消息总线）、数据处理框架（如\
  \ `Spark`）、数据库（如 `MySQL`）、缓存以及集群存储系统（如 `Ceph`）等应用级服务。\n\n`Kubernetes` 不是编排（Orchestration）。`Kubernetes`\
  \ 也不是编排。`Kubernetes` 是集群的实际状态。\n\n## Kubernetes 架构\n\n作为管理员和用户的主要入口，主服务器作为主要的控制平面，对于\
  \ `Kubernetes` 集群中相对简单的工作节点，它也提供了整个集群的系统。主服务器上协同工作的组件能够确保应用程序的预期状态与实际状态匹配。用户通过直接与主\
  \ `API server` 通信与集群进行交互。为了启动应用程序或服务，会传递 `JSON` 或 `YAML` 声明式计划来定义要的内容。主服务器执行计划，检查当前状态并决定如何执行。这一组根据设定的调度代表了\
  \ `Kubernetes` 的最终层。\n\n![](img/Figure-5.1.jpg)\n\n图 5.1：Kubernetes 架构\n\n 主服务器组件\n\
  \n作为管理员和用户的主要入口，主服务器作为主要的控制平面，对于 `Kubernetes` 集群中相对简单的工作节点，它也提供了整个集群的系统。\n\n###\
  \ etcd\n\n`Kubernetes` 工作所需的基础组件之一是全局可用的配置存储。`etcd` 项目由 `CoreOS` 团队开发，是一个轻量级分布式的键值存储，可以配置为跨多个节点。\n\
  \n`Kubernetes` 使用 `etcd` 存储集群中任何节点可访问的配置数据。这用于服务发现，并帮助组件根据当前信息进行配置或重新配置。它还通过主选举和分布式锁等功能帮助维护集群状态。\n\
  \n提供简单的 `HTTP/JSON API` 作为接口，便于设置或检索值。\n\n\n\n\n\n最重要的主服务之一是 `API server`。它是整个集群的关键管理点，允许用户配置\
  \ Kubernetes 工作负载和组织单元。它的职责是确保 `etcd` 存储的器细节与提供的容器相匹配，作为各个组件之间的桥梁，以维护集群健康并发布信息和命令。\n\
  \n各种工具和库可以轻松地通信。这意味着由 `API server` 实现了一个 RESTful 接口。一个名为 `kubectl` 的客户端可以作为从本地计算机与\
  \ Kubernetes 集群交互的标准方式。\n\n### Kube-controller-manager\n\n控制器是一个具有许多职责的通用服务，主要负责协调集群状态的各种控制器、管理工作负载的生命周期并执行例行任务。例如，`replication\
  \ controller` 会验证 `pod` 中定义的副本数量与当前在集群中部署的数量是否匹配。这些操作的细节记录在 `etcd` 中，`controller\
  \ manager` 通过 `API server` 查找更改。`controller` 读取新信息，并在检测到更改时执行以满足所需状态的程序。这可能包括扩展或缩小应用程序、调整端点等。\n\
  \n### Kube-scheduler\n\n将工作负载分配到集群中特定节点的实际操作由 `scheduler` 进程完成。该服务读取工作负载的操作需求，分析当前的基础设施环境，并将工作放置在一个或多个接受的节点上。`scheduler`\
  \ 负责跟踪每个主机上的容量，并确保工作负载不会超出可用资源。`scheduler` 需要知道每台服务器上为现有工作负载分配的总容量和资源。\n\n### Cloud-controller-manager\n\
  \nKubernetes 可以部署在不同的环境中并与不同的基础设施提供商交互，以理解和管理集群中资源的状态。Kubernetes 处理资源的通用表示，例如可连接的存储和负载均衡器，但我们需要一种方法将这些映射到非统一云提供商提供的实际资源。`cloud\
  \ controller manager` 充当链接，允许 Kubernetes 与具有各种功能和 API 的提供商交互，并在内部保持相对通用的结构。通过这种方式，Kubernetes\
  \ 根据云提供者收集的信息更新状态，在系统变化时调整云资源，并使用额外的云服务将其发送到集群。你可以创建并执行工作请求。\n\n## Components node\
  \ server\n\n工作通过在作为服务器的 Kubernetes 节点上运行容器完成。`node servers` 有一些必要要求，通过配置容器网络并运行分配给它们的实际工作负载来与主组件进行通信。\n\
  \n### A container runtime\n\n每个节点必须具备的第一个组件是 `container runtime`，通过安装和运行 `Docker`\
  \ 以及 `rkt` 和 `runc` 等替代方案可以满足这一要求。\n\n在一个相对隔离但轻量级的环境中，应用程序被封装，`container runtime`\
  \ 负责启动和维护容器。集群中的每个工作单元都实现为一个或多个需要在基础层部署的容器。每个节点上的 `container runtime` 是运行发送到集群的工作负载定义的容器的最终组件。\n\
  \n### Kubelet\n\n每个节点都有一个 `kubelet`，它是运行在每个节点上的主要代理。`kubelet` 确保 `PodSpecs` 中描述的容器运行在你的\
  \ Pod 中。它与 `API server` 通信以更新 pod 的状态并接收指令。\n\n`kubelet` 是节点与控制平面之间的主要接触点。它确保容器按照清单（manifest）中的定义运行。\n\
  \n### Kube-proxy\n\n`kube-proxy` 是运行在每个节点上的网络代理，维护节点规则并允许网络通信到你节点上的 pod。它为每个服务实现负载均衡器。\n\
  \n### Service with selector\n\n```yaml\napiVersion: v1\nkind: node\nmetadata:\n\
  \  name: 10.01.1.10\nlabels:\n  name: cluster 1 node\n```\n\n实际对象以 JSON 格式创建，如下所示：\n\
  \n```json\n{\n  \"apiVersion\": \"v1\",\n  \"kind\": \"node\",\n  \"metadata\":\
  \ {\n    \"name\": \"10.01.1.10\",\n    \"labels\": {\n      \"name\": \"cluster\
  \ 1 node\"\n    }\n  }\n}\n```\n\n### Node controller\n\n`node controller`是一组运行在\
  \ Kubernetes 主节点上的服务，并根据元数据名称持续监控集群中的节点。控制器在验证所有基本服务运行正常后，会将新形成的 pod 分配给该节点。如果它不是合法的，主节点将等待它变得有效后再将任何\
  \ pods 分配给它。\n\n如果 `register-node` 标志为 true，Kubernetes 主节点会自动注册该节点。\n\n`–register-node\
  \ = true`\n\n但是，如果集群管理员想手动管理，可以通过将该标志设为 false 来。\n\n`–register-node = false`\n\n\
  ## Objects and workloads of Kubernetes\n\nKubernetes 在容器接口之上使用了额外的抽象层，以提供部署应用程序时使用的扩展性、韧性和生命周期管理功能，而容器是底层机制。用户不再直接管理容器，而是定义并与\
  \ Kubernetes 对象模型提供的各种原语组成的实例进行交互。为了定义这些工作负载，我们将查看可以使用的不同类型的对象。\n\n## Pods\n\n`pod`\
  \ 是 Kubernetes 中最小的可部署单元。容器不会被分配给主机；相反，它们被包含在 `pod` 中，`pod` 由一个或多个紧密连接的容器组成。\n\n\
  \n\n\n\n一个或多个被作为单个应用程序控制的容器被表示为 Pod，它由一组紧密协作、共享生命周期并共同运行的容器组成，并且应该始终被调度在同一个节点上。它们都作为一个单一实体进行管理，具有相同的环境、卷和\
  \ IP 空间。Pod 应该被视为一个单一的单体程序，以便最好地理解集群如何管理 Pod 的资源和调度，尽管其实现方式是容器化的。\n\nPod 由一个提供工作负载整体功能的主容器以及（如果需要）一些帮助处理紧密相关活动的辅助容器组成。这些程序在它们自己的容器中运行和控制时会获益，同时又与主程序保持紧密链接。当发现外部存储库中的更新时，Pod\
  \ 可能会包含一个运行主应用程序服务器的容器，以及另一个将文件下载到共享文件系统中的容器。不建议在 Pod 级别上进行水平扩展，因为有其他更高级别的对象更适合该目的。\n\
  \n鼓励用户使用更高级别的对象，这些对象使用 Pod 或 Pod 模板作为基础组件，但实现了额外的功能，因为 Pod 并不提供应用程序通常所需的特性（例如复杂的生命周期管理和扩展）。相反，鼓励用户将\
  \ Pod 或 Pod 模板作为基础组件，但实现额外的功能。\n\n### Pod 类型\n\nPod 的两种类型是单容器和多容器。\n\n### 单容器 Pod\n\
  \n可以使用 `kubectl run` 命令创建它们，在 Docker 注册表中，你定义了一个镜像，该镜像会在创建 Pod 时被拉取。\n\n```\n$ kubectl\
  \ run <name of pod> --image=<name of the image from registry>\n```\n\n**示例：** 我们将创建一个带有在\
  \ Docker hub 上可用的 tomcat 镜像的 Pod。\n\n```\n$ kubectl run tomcat --image = tomcat:8.0\n\
  ```\n\n同样也可以通过创建 YAML 文件然后运行 `kubectl create` 命令来实现相同的操作。\n\n```yaml\n1. apiVersion:\
  \ v1\n2. kind: Pod\n3. metadata:\n4. name: Tomcat\n5. spec:\n6. containers:\n7.\
  \ - name: Tomcat\n8. image: tomcat: 8.0\n9. ports:\n10. containerPort: 7500\n11.\
  \ imagePullPolicy: Always\n```\n\n一旦创建了 YAML 文件，我们将该文件保存为 `tomcat.yml` 并运行创建命令来执行该文档。\n\
  \n```\n$ kubectl create –f tomcat.yml\n```\n\n它将创建一个名为 tomcat 的 Pod。我们可以使用 `describe`\
  \ 命令配合 `kubectl` 命令来描述该 Pod。\n\n### 多容器 Pod\n\n多容器 Pod 使用带有容器定义的 `YAML` 来创建。\n\n\
  ```yaml\n1. apiVersion: v1\n2. kind: Pod\n3. metadata:\n4. name: Tomcat\n5. spec:\n\
  6. containers:\n7. - name: Tomcat\n8. image: tomcat: 8.0\n9. ports:\n10. containerPort:\
  \ 7500\n11. imagePullPolicy: Always\n12. -name: Database\n13. Image: mongoDB\n14.\
  \ Ports:\n15. containerPort: 7501\n16. imagePullPolicy: Always\n```\n\n在这段代码中，我们创建了一个包含两个容器的\
  \ Pod，一个用于 tomcat，另一个用于 MongoDB。\n\n## 复制控制器和副本\n\n在与 Kubernetes 工作时，与其与单个 Pod 交互，不如说管理一组相同的、复制的\
  \ Pod，这些组被称为复制控制器（Replication Controllers）和副本集（Sets），它们从 Pod 模板创建并可以由控制器进行水平扩展。\n\
  \n`replication controller`（复制控制器）是一个定义了 Pod 模板及其控制参数的对象，通过更改运行副本的数量来水平扩展相同 Pod 的副本。在\
  \ Kubernetes 内部，这是一种分散负载和提高可用性的简单方法。由于复制控制器配置中包含了一个与 Pod 定义非常相似的模板，复制控制器知道如何根据需要构建额外的\
  \ Pod。\n\n复制控制器包含了了模板以及通过更改运行副本数量来水平扩展相同 Pod 副本的控制参数。由于复制控制器配置中包含了一个与 Pod 定义非常相似的模板，复制控制器知道如何根据需要构建额外的\
  \ Pod。\n\n通过控制器控制的副本数量，复制控制器可以进行滚动更新以影响后端。\n\n复制控制器是 Kubernetes 的基本特性，它负责确保 Pod\
  \ 的副本数量在任何时候都是有效的。使用复制控制器来管理指定数量的 Pod 是最佳实践，以避免反复创建 Pod。\n\n```yaml\n1. apiVersion:\
  \ v1\n2. kind: ReplicationController\n3. metadata:\n4. name: Tomcat-ReplicationController\n\
  5. spec:\n6. replicas: 3\n7. template:\n8. metadata:\n9. labels:\n10. app: App\n\
  11. component: neo4j\n12. spec:\n13. containers:\n14. - name: Tomcat-\n15. image:\
  \ tomcat:8.0\n16. ports:\n17. - containerPort: 7474\n```\n\n设置如下：\n\n*   `Kind:ReplicationController`\
  \ -> 通过在之前的代码中定义类型为复制控制器，告诉 `kubectl` 将使用该文件。\n*   `name: Tomcat-ReplicationController`\
  \ -> 如果运行 `kubectl get rc <Tomcat-ReplicationController>`，将显示复制控制器的详情并帮助识别创建的名称。\n\
  *   `replicas: 3` -> 这有助于复制控制器理解它需要维护三个副本。\n*   `name: Tomcat` -> 在 spec 部分，我们定义了名称为\
  \ tomcat，这告诉复制控制器容器是 tomcat。\n*   `containerPort: 7474` -> 这确保了集群中运行 Pod 内部容器的所有节点都将在相同的端口\
  \ 7474 上暴露。\n\n![](img/208.jpg)\n\n这里的 Kubernetes 服务作为三个 tomcat 副本的负载均衡器。\n\n**副本集（Replication\
  \ Sets）：** 它是对复制控制器设计的一种迭代，在控制器识别 Pod 方面具有更大的灵活性。由于具有更大的副本选择能力，副本集开始取代复制控制器，但像复制控制器一样，它们无法将后端滚动更新到新版本。相反，副本集旨在用于提供该功能的额外高级层单元内部。\n\
  \n你很少会同时操作单元复制控制器和副本集，就像操作 Pod 一样。尽管它们在 Pod 设计的基础上添加了水平扩展和可靠性保证，但缺乏复杂对象中的某些细粒度生命周期管理功能。\n\
  \n副本集和复制控制器之间的主要区别在于，副本集支持集合的选择器，而复制控制器仅支持等值选择器。\n\n```yaml\n1. apiVersion: extensions/v1beta1\n\
  2. kind: ReplicaSet\n3. metadata:\n4. name: Tomcat-ReplicaSet\n5. spec:\n6. replicas:\
  \ 3\n7. selector:\n8. matchLabels:\n```\n\n\n\n\n\n```yaml\ntier: Backend ------------------>\
  \ 3\nmatchExpression:\n{ key: tier, operation: In, values: [Backend]} -------------->\
  \ 4\ntemplate:\n  metadata:\n    labels:\n      app: Tomcat-ReplicaSet\n      tier:\
  \ Backend\n  labels:\n    app: App\n    component: neo4j\n  spec:\n    containers:\n\
  \    - name: Tomcat\n      image: tomcat: 8.0\n      ports:\n        - containerPort:\
  \ 7474\n```\n\n设置的详情如下：\n\n`apiVersion: extensions/v1beta1` → 在前面的代码中，支持副本集（replica\
  \ set）的概念，其 API 版本是 Kubernetes 的高级 Beta 测试版本。\n\n`kind: ReplicaSet` → 我们在 `kubectl`\
  \ 中将 kind 定义为副本集，以便于理解该文件是用于创建副本集的。\n\n`tier: Backend` → 为了创建匹配的选择器，将标签 `tier` 定义为\
  \ `backend`。\n\n`{key: tier, operation: In, values: [Backend]}` → 我们在操作中定义了它，这将帮助\
  \ `matchExpression` 理解用于 `matchlabel` 查找详情的匹配条件。\n\n通过使用 `kubectl` 运行前面的文件，可以使用\
  \ `YAML` 文件提供的定义创建后端副本集。\n\n![](img/210.jpg)\n\n### 部署 (Deployments)\n\n通过将副本集作为构建模块并引入了灵活的生命周期管理功能，最常见的直接创建和管理的负载是\
  \ `Deployments`。\n\n虽然使用副本集构建的部署看起来可能模拟了副本控制器（replication controllers）提供的功能，但它们实际上消除了滚动更新实现中存在的许多痛点。当使用副本控制器更新应用程序时，用户必须提交新副本控制器的提案来替换当前控制器。在使用副本控制器时，维护历史记录、从更新期间的网络故障中恢复以及回滚错误更改等任务要么很困难，要么留给用户处理。\n\
  \n部署是一个高级对象，它简化了副本 pod 的生命周期管理。更改部署的配置，Kubernetes 将自动修改副本集，管理不同应用程序版本之间的过渡，并可选地保留事件历史和撤销功能。由于这些特性，部署很可能是你最频繁使用的\
  \ Kubernetes 对象。\n\n部署是副本控制器的增强高阶版本，它监督副本集的部署，并且是升级版的副本控制器，可以更新副本集并回滚到早期版本。\n\n\
  `matchLabels and selectors` 的许多更新功能由它们提供。我们在 Kubernetes 主节点中获得了一个名为部署控制器的新控制器，它实现了这一点，并且还具有在中途更改部署的能力。\n\
  \n### 部署更改 (Deployment change)\n\n更新—用户可以在部署完成之前更新正在进行的部署，结算现有的部署并创建新的部署。\n\n删除—用户可以在部署完成之前删除它来暂停/取消部署；重建相同的部署将恢复它。\n\
  \n回滚—部署或正在进行中的部署可以回滚。用户可以通过使用 `DeploymentSpec.PodTemplateSpec = oldRC.PodTemplateSpec`\
  \ 来创建或更新部署。\n\n### 部署策略 (Strategies of deployment)\n\n部署策略有助于定义新 RC 如何替换现有的 RC。\n\
  \n重建 (Recreate)—通过此功能，所有现有的 RC 将被杀死，然后启动新的 RC，导致快速部署；然而，当旧 pod 停止而新 pod 尚未启动时，会导致停机。\n\
  \n滚动更新 (Rolling update)—此功能逐渐停止旧 RC 并启动新 RC，导致部署较慢；然而，没有停机。在此过程中，任何时候都有几个旧 pod 和几个新\
  \ pod 可用。\n\n部署配置文件看起来所示。\n\n```yaml\napiVersion: extensions/v1beta1 --------------------->1\n\
  kind: Deployment --------------------------> 2\nmetadata:\n  name: Tomcat-ReplicaSet\n\
  spec:\n  replicas: 3\n  template:\n    metadata:\n      labels:\n        app: Tomcat-ReplicaSet\n\
  \        tier: Backend\n    spec:\n      containers:\n      - name: Tomcatimage:\n\
  \        tomcat: 8.0\n        ports:\n          - containerPort: 7474\n```\n\n我们将\
  \ kind 定义为 deployment，这是与前面代码中副本集唯一不同之处。\n\n### 创建部署 (Deployment creation)\n\n部署的创建如下：\n\
  \n```bash\n$ kubectl create –f Deployment.yaml --record\n```\n\n部署 “Deployment”\
  \ 已成功创建。\n\n获取部署 (Deployment fetching)\n\n```bash\n$ kubectl get deployments\n```\n\
  \nNAME             DESIRED      CURRENT      UP-TO-DATE   AGE\nDeployment      \
  \  3            3            0            20s\n\n```\n\n检查部署状态 (Status of Deployment\
  \ Check)\n\n```bash\n$ kubectl rollout status deployment/Deployment\n```\n\n部署更新\
  \ (Deployment Update)\n\n```bash\n$ kubectl set image deployment/Deployment tomcat:6.0\n\
  ```\n\n之前的部署回滚 (Previous Deployment Rollback)\n\n```bash\n$ kubectl rollout undo\
  \ deployment/Deployment\n```\n\n### 有状态集 (Stateful sets)\n\n当您需要额外的细粒度控制时（例如部署顺序、持久性数据或一致的网络），这些是需要使用的工具。有状态集通常与数据导向的应用程序相关，例如即使重新调度到另一个节点也需要访问相同卷的数据库。当需要重新调度时，持久性存储卷也可以随\
  \ pod 移动。为了防止数据丢失，卷在 pod 被销毁后仍然存在。\n\n有状态集在部署或更改规模时，根据其名称中的数字标识执行活动，以获得执行顺序的可预测性和控制。\n\
  \n### Daemon set\n\n另一种特定的 pod 控制器是在在集群的每个节点上运行 pod 的副本，这对于部署帮助执行维护并为节点自身提供服务的 pod\
  \ 是最有益的。\n\n**Daemon sets** 通常用于收集和发送日志、聚合指标以及执行改进节点能力的服务。Daemon sets 可以绕过 pod 调度限制（这些限制阻止其他控制器将\
  \ pod 分配到特定主机），因为它们通常提供基本服务并在整个机群中都是需要的。由于其特定的职责，主服务器通常配置为不可用于常规 pod 调度。\n\n###\
  \ 任务和定时任务 (Jobs and cron jobs)\n\n到目前，我们描述了假设长时间运行、类服务生命周期的负载。Kubernetes 使用了一种名为\
  \ **jobs** 的负载，如果你需要执行一次性或批处理而不是运行持续服务，那么它是很有用的，它提供了一种更基于任务的工作流，其中运行的容器在经过一段时间并完成工作后预期成功退出。\n\
  \n\n\n\n\n`Cron jobs` 构建在 `jobs`（任务）之上，为 Kubernetes 中提供了一个带有调度组件的运行任务的接口，类似于 Linux\
  \ 和类 Unix 节点上的传统 cron 守护进程，后者按计划执行脚本。Cron jobs 用于在未来某个时刻或定期、周期性地运行任务。Kubernetes\
  \ 中的 Cron jobs 是对传统 cron 行为的重新实现，它将集群作为平台而非单一操作系统。\n\n## Kubernetes 的其他组件\n\nKubernetes\
  \ 还提供了许多其他抽象，这些抽象能够在你在集群上运行的工作负载之外实现持久化，并帮助你管理应用程序和控制网络。\n\n### Services（服务）\n\n\
  到目前，我们一直在使用传统 Unix 意义上的“服务”一词，指的是可能响应请求的长时间网络连接进程。然而，在 Kubernetes 中，service 是作为基本内部负载均衡器和\
  \ pod 代理（大使）工作的组件。service 将逻辑 pod 组合在一起，显示为一个执行相同任务的单一实体。\n\n允许部署一个可以跟踪并路由到特定类型所有后端容器的\
  \ service。服务的内部消费者只需要知道服务的稳定端点（endpoint）。同时，service 抽象允许根据需要扩展或替换后端工作单元。无论服务路由到的\
  \ pod 发生什么变化，其 IP 地址都保持不变。通过启动 service，你可能只需增加可用性并简化你的容器设计。\n\n如果你需要让另一个应用程序或外部消费者访问一个或多个\
  \ pod，则应该配置 service。例如，如果你有一系列运行 Web 服务器的 pod 应该从互联网访问，service 将提供相应的抽象。如果你的 Web\
  \ 服务器需要存储和检索数据，你将希望设置一个内部 service 让它们访问你的数据库 pod。\n\n尽管 service 默认仅通过内部路由的 IP 地址可用，但可以通过几种方法之一使其在集群外部可用。通过\
  \ `NodePort` 配置在每个节点的外部网络接口上打开一个静态端口。使用内部集群 IP，通向外部端口的服务流量将自动路由到相关的 pod。\n\n`LoadBalancer`\
  \ 服务类型建立一个外部负载均衡器，或使用云提供商的 Kubernetes 负载均衡器集成来路由到服务。使用内部服务地址，云控制器管理器将建立所需的资源并对其进行配置。\n\
  \nservice 是 pod 的逻辑组，同时也作为 pod 之上的抽象，提供单一 IP 地址和 DNS 名称，通过这些可以访问 pod。使用 service\
  \ 维护负载均衡配置非常简单，允许 pod 轻松扩展。\n\nservice 是 Kubernetes 中的一个 REST 对象，要创建一个新实例，可以将其定义发布到\
  \ Kubernetes 主节点上的 `apiServer`。\n\n### 无选择器的 Service\n\n```\n1. `apiVersion: v1`\n\
  2. `kind: Service`\n3. `metadata:`\n4. `name: csc_service`\n5. `spec:`\n6. `ports:`\n\
  7. `- port: 8080`\n8. `targetPort: 31999`\n```\n\n通过上述配置将创建一个名为 `csc_service` 的\
  \ service。\n\n### 带有选择器的 Service \n\n```yaml\n1. `apiVersion: v1`\n2. `kind: Service`\n\
  3. `metadata:`\n4. `name: csc_service`\n5. `spec:`\n6. `selector:`\n7. `application:\
  \ “My Application” -------------------> (Selector)`\n8. `ports:`\n9. ` - port: 8080`\n\
  10. `targetPort: 31999`\n```\n\n在这个示例中，我们有一个选择器，我们需要手动创建一个端点以传输流量。\n\n```yaml\n\
  1. `apiVersion: v1`\n2. `kind: Endpoints`\n3. `metadata:`\n4. `name: csc_service`\n\
  5. `subnets:`\n6. `address:`\n7. `“ip”: “192.168.168.40” -------------------> (Selector)`\n\
  8. `ports:`\n9. `- port: 8080`\n```\n\n在前面的代码中，我们创建了一个端点，它将流量路由到定义为 `192.168.168.40:8080`\
  \ 的端点。\n\n### 多端口服务创建\n\n```yaml\n1. `apiVersion: v1`\n2. `kind: Service`\n3. `metadata:`\n\
  4. `name: csc_service`\n5. `spec:`\n6. `selector:`\n7. `application: “My Application”\
  \ -------------------> (Selector)`\n8. `ClusterIP: 10.3.0.12`\n9. `ports:`\n10.\
  \ `-name: http`\n11. `protocol: TCP`\n12. `port: 80`\n13. `targetPort: 31999`\n\
  14. `-name:https`\n15. `Protocol: TCP`\n16. `Port: 443`\n17. `targetPort: 31998`\n\
  ```\n\n## Service 类型\n\n`ClusterIP`—将服务限制在集群内部，这有助于在定义的 Kubernetes 集群内暴露服务。\n\n\
  ```\n1. `spec:`\n2. `type: ClusterIP`\n3. `ports:`\n4. `- port: 8080`\n5. `targetPort:\
  \ 31999`\n```\n\n`NodePort`—在每个节点的 IP 端口上暴露服务。\n\n```\n1. `spec:`\n2. `type: NodePort`\n\
  3. `ports:`\n4. `- port: 8080`\n5. `targetPort: 31999`\n```\n\n`LoadBalancer`—配置外部负载均衡器。\n\
  \n```\n1. `spec:`\n2. `type: LoadBalancer`\n3. `ports:`\n4. `- port: 8080`\n5. `targetPort:\
  \ 31999`\n```\n\n\n\n\n\n*   `gcePersistentDisk`—挂载到 Pod 中的此卷映射了一个 Google Compute\
  \ Engine (GCE) 持久磁盘，当 Pod 从节点中移除时，数据将保持完整。\n*   `awsElasticBlockStore`—挂载到 Pod 中的此卷挂载了\
  \ Amazon Web Services (AWS) 弹性块存储，当 Pod 从节点中移除时，数据将保持完整。\n*   `nfs`—挂载到 Pod 中的 `nfs`\
  \ 卷允许挂载现有的 NFS（网络文件系统），当 Pod 从节点中移除时，数据不会被删除。该卷仅会被卸载。\n*   `iscsi`—挂载到 Pod 中的 `iscsi`\
  \ 卷允许挂载现有的 iSCSI (SCSI over IP) 卷。\n*   `flocker`—一种开源的集群容器数据卷管理器，用于管理数据卷。要挂载到 Pod\
  \ 中，`flocker` 卷允许使用一个 `flocker` 数据集。如果数据集在 `flocker` 中不存在，您首先需要使用 `flocker` API\
  \ 创建一个数据集。\n*   `glusterfs`—一种开源的网络文件系统，允许将 `glusterfs` 卷挂载到您的 Pod 中。\n*   `rbd`—`rbd`\
  \ 卷是 Rados Block 设备卷的缩写，它允许您将 Rados Block 设备卷挂载到 Pod 中。当 Pod 从节点退出时，数据会被保留。\n* \
  \  `cephfs`—`cephfs` 卷允许您将现有的 CephFS 卷挂载到您的 Pod 中。一旦 Pod 从节点中移除，数据将保持完整。\n*   `gitRepo`—供\
  \ Pod 使用，`gitRepo` 卷挂载一个空目录并将 `git` 仓库克隆其中。\n*   `secret`—为了向 Pod 传递敏感信息（如密码），使用了\
  \ `secret` 卷。\n*   `persistentVolumeClaim`—`persistentVolumeClaim` 卷用于将 `PersistentVolume`\
  \ 挂载到 Pod 中。`PersistentVolumes` 是用户用于“申领”持久存储（如 `gcePersistentDisk` 或 `iscsi` 卷）的机制，无需了解云环境的具体细节。\n\
  *   `downwardAPI`—为了让应用程序可以使用向下 API 数据，使用了 `downwardAPI` 卷，它挂载一个目录并将请求的数据写入到纯文本文件中。\n\
  *   `azureDiskVolume`—为了将 Microsoft Azure 数据磁盘挂载到 Pod 中，使用了 `azureDiskVolume`。\n\
  \n持久卷是将更具韧性的存储从 Pod 生命周期中抽象出来的方法。相反，它允许管理员为集群设置存储资源，用户可以为他们运行的 Pod 请求并申领这些资源。当 Pod\
  \ 完成持久卷后，卷的回收策略将决定该卷是保留直到手动删除，还是与数据一起立即丢弃。持久数据可以防止节点故障，并分配比当前本地访问更多的存储。\n\n## 持久化卷和持久化卷声明\n\
  \n**持久卷 (PV)**—由管理员配置的一部分网络存储称为 PV，它是集群中的一种资源，独立于使用该 PV 的任何单个 Pod。\n\n**持久化卷声明 (PVC)**\
  \ –Kubernetes 为其 Pod 请求的存储称为 PVC。用户无需了解底层的配置细节。声明必须在与 Pod 相同的命名空间中创建。\n\n## 创建持久化卷\n\
  \n1. `kind: PersistentVolume ---------> 1`\n2. `apiVersion: v1`\n3. `metadata:`\n\
  4. `name: pv0001 ------------------> 2`\n5. `labels:`\n6. `type: local`\n7. `spec:`\n\
  8. `capacity: -----------------------> 3`\n9. `storage: 10Gi ---------------------->\
  \ 4`\n10. `accessModes:`\n11. `- ReadWriteOnce -------------------> 5`\n12. `hostPath:`\n\
  13. `path: \"/tmp/data01” --------------------------> 6`\n\n在前面的代码中，我们定义了：\n\n*\
  \   `kind: PersistentVolume` → 我们将类型定义为 `PersistentVolume`，告诉 Kubernetes 正在使用的 YAML\
  \ 文件用于创建持久卷。\n*   `name: pv0001` → 我们正在通过此名称创建 `PersistentVolume`。\n*   `capacity:`\
  \ → 我们尝试创建的 PV 容量由此规范定义。\n*   `storage: 10Gi` → 通过此告知底层基础设施，我们正尝试在定义的路径上申领 10Gi\
  \ 空间。\n*   `ReadWriteOnce` → 通过此告知我们正在创建的卷的访问权限。\n*   `path: \"/tmp/data01\"` →\
  \ 通过此定义告知机器，我们正尝试在底层基础设施的此路径下创建卷\n\n### 创建 PV\n\n```bash\n$ kubectl create –f local-01.yaml\n\
  ```\npersistentvolume “pv0001” created\n\n### 检查 PV\n\n```bash\n$ kubectl get pv\n\
  ```\nNAME    CAPACITY    ACCESSMODES      STATUS      CLAIM       REASON      AGE\n\
  pv0001  10Gi        ReadWriteOnce   Available              \n\n### 描述 PV\n\n```bash\n\
  $ kubectl describe pv0001\n```\n\n## 创建持久化卷声明\n\n1. `kind: PersistentVolume --------->\
  \ 1`\n2. `apiVersion: v1`\n3. `metadata:`\n4. `name: myclaim-1 ------------------>\
  \ 2`\n5. `spec:`\n6. `accessModes:`\n7. `- ReadWriteOnce -------------------> 3`\n\
  8. `resources:`\n9. `requests:`\n10. `storage: 10Gi ----------------------> 4`\n\
  \n在前面的代码中，我们定义了：\n\n*   `kind: PersistentVolume` → 我们将类型定义为 `PersistentVolume`，告诉\
  \ Kubernetes 正在使用的 YAML 文件用于创建持久卷。\n*   `name: myclaim-1` → 我们正在通过此名称创建 `PersistentVolume`。\n\
  *   `ReadWriteOnce` → 通过此告知我们正在创建的卷的访问权限。\n*   `storage: 10Gi` → 通过此告知底层基础设施，我们正尝试申领\
  \ 10Gi 空间。\n\n### 创建 PVC\n\n```bash\n$ kubectl create –f myclaim-1\n```\npersistentvolumeclaim\
  \ “myclaim-1” created\n\n### 获取 PVC 信息\n\n```bash\n$ kubectl get pvc\n```\nNAME\
  \        STATUS      VOLUME      CAPACITY    ACCESSMODES   AGE\nmyclaim-1   Bound\
  \       pv0001      10Gi        ReadWriteOnce   \n\n### 描述 PVC\n\n```bash\n$ kubectl\
  \ describe myclaim-1\n```\n\n## 在 Pod 使用 PV 和 PVC\n\n1. `kind: Pod`\n2. `apiVersion:\
  \ v1`\n3. `metadata:`\n4. `name: mypod`\n5. `labels:`\n6. `name: frontendhttp`\n\
  7. `spec:`\n8. `containers:`\n9. `- name: myfrontend`\n10. `image: nginx`\n11. `ports:`\n\
  12. `- containerPort: 80`\n13. `name: “http-server”`\n14. `volumeMounts: ----------------------------\
  \ 1`\n15. `- mountPath: \"/usr/share/tomcat/html\"`\n16. `name: mypd`\n17. `volumes:\
  \ -----------------------> 2`\n18. `- name: mypd`\n19. `persistentVolumeClaim: ----------------->3`\n\
  20. `claimName: myclaim-1`\n\n在前面的代码中，我们定义了：\n\n*   `volumeMounts:` → 容器内挂载发生的路径。\n\
  *   `volumes:` → 它定义了我们要申领的卷定义。\n*   `persistentVolumeClaim:` → 我们定义了要在定义的 Pod 中使用的卷名称。\n\
  \n\n\n\n\n`Annotation`（注解）是一种更加灵活且可以包含低结构化程度的数据的技术，它允许你向对象挂载任意的键值信息。相比之下，标签（Labels）应用于匹配\
  \ pod 与选择标准所需的语义信息。总的来说，注解是一种为对象提供大量元数据的技术，而这些数据对于选择操作没有用。\n\n# Secrets\n\n为了通过加密方式存储用户名和密码等敏感数据，Kubernetes\
  \ 使用的对象是 secrets。在 Kubernetes 中创建 secrets 有多种方法：从 txt 文件创建 secrets 和从 YAML 文件创建\
  \ secrets。\n\n## 从文本文件创建 secrets\n\n要从文本文件创建 secrets，我们首先需要在一个 txt 文件中存储用户名和密码，并使用以下命令。\n\
  \n```bash\n$ kubectl create secret generic tomcat-passwd --from-file=./username.txt\
  \ --from-file=./password.txt\n```\n\n## 从 YAML 文件创建 secrets\n\n要从 YAML 文件创建 secrets，首先在\
  \ YAML 文件存储用户名和密码，并使用以下命令：\n\n1. `apiVersion: v1`\n2. `kind: Secret`\n3. `metadata:`\n\
  4. `name: tomcat-pass`\n5. `type: Opaque`\n6. `data:`\n7. `password: <User Password>`\n\
  8. `username: <User Name>`\n\n然后执行以下命令进行 secret 创建\n\n### Secret 创建\n\n```bash\n\
  $ kubectl create -f Secret.yaml\n```\n\n`secrets/tomcat-pass`\n\n## 使用 secrets\n\
  \n一旦创建完成，我们可以在 pod 或复制控制器（replication controller）中以环境变量的形式使用 secrets。\n\n## 卷\n\n\
  作为环境变量使用\n\n为了将 secret 作为环境变量，我们将在 pod YAML 文件的 `spec` 部分下使用 `env`。\n\n```yaml\n\
  1. env:\n2. `- name: SECRET_USERNAME`\n3. `valueFrom:`\n4. `secretKeyRef:`\n5. `name:\
  \ mysecret`\n6. `key: tomcat-pass`\n```\n\n### 作为卷使用\n\n1. `spec:`\n2. `volumes:`\n\
  3. `- name: \"secretstest\"`\n4. `secret:`\n5. `secretName: tomcat-pass`\n6. `containers:`\n\
  7. `- image: tomcat:7.0`\n8. `name: awebserver`\n9. `volumeMounts:`\n10. `- mountPath:\
  \ \"/tmp/mysec\"`\n11. `name: \"secretstest\"`\n\n## 将 secrets 配置为环境变量\n\n1. `apiVersion:\
  \ v1`\n2. `kind: ReplicationController`\n3. `metadata:`\n4. `name: appname`\n5.\
  \ `spec:`\n6. `replicas: replica_count`\n7. `template:`\n8. `metadata:`\n9. `name:\
  \ appname`\n10. `spec:`\n11. `nodeSelector:`\n12. `resource-group:`\n13. `containers:`\n\
  14. `- name: appname`\n15. `image:`\n16. `imagePullPolicy: Always`\n17. `ports:`\n\
  18. `- containerPort: 3000`\n19. `env: -----------------------------> 1`\n20. `-\
  \ name: ENV`\n21. `valueFrom:`\n22. `configMapKeyRef:`\n23. `name: appname`\n24.\
  \ `key: tomcat-secrets`\n\n在上述代码的 `env` 定义下，我们正在复制控制器中将环境变量使用 secrets。\n\n## 将 secrets\
  \ 配置为卷挂载\n\n\n\n\n\n控制平面组件对集群做出全局选择，例如调度、检测和响应集群事件，例如当部署的 `replicas` 字段不满足要求时启动新的\
  \ pod。\n\n控制平面组件可以运行在集群中的任何机器上。然而，设置脚本通常不会在这些机器上运行用户级容器，而是为了简单起见，将所有控制平面组件都启动在同一个系统上。\n\
  \n## Kube-apiserver\n\nKubernetes 控制平面的 API 服务器是 Kubernetes API，它暴露了控制平面的一个组件。Kubernetes\
  \ API 服务器的默认实现旨在进行水平扩展（即通过部署额外的实例），它是 `Kube-apiserver`。你可以通过启动多个 `Kube-apiserver`\
  \ 实例来在多个 `Kube-apiserver` 实例之间平衡流量。\n\n# The etcd\n\n一致且高可用的键值存储用于 Kubernetes 的后端存储。如果你的\
  \ Kubernetes 集群使用 `etcd` 作为其后端存储，请确保你为这些数据制定了备份计划。\n\n### Kube-scheduler\n\n`Kube-scheduler`\
  \ 是控制平面的一个组件，它负责监控尚未分配节点的新 pod 并为它们分配节点。在做出调度决策时，单个和集体的资源需求、硬件/软件/策略限制、亲和与反亲和规范、数据本地性、工作负载间的干扰以及截止日期都是考虑的因素。\n\
  \n### Kube-controller-manager\n\n`Kube-controller-manager` 是运行控制器进程的控制平面组件。从逻辑上讲，每个控制器都是单独进程，但它们都被编译成单个二进制文件并在单个进程中运行，以降低复杂性。包含的控制器如下：\n\
  \n* 节点控制器（node controller）负责注意到并响应节点故障。\n* 副本控制器（replication controller）负责为系统中每个副本控制器对象维护正确数量的\
  \ pod。\n* 端点控制器（endpoints controller）填充 `endpoints` 对象，它将服务和 pod 统一起来。\n* 服务账户和令牌控制器负责为新的命名空间创建默认帐户和\
  \ API 访问令牌。\n\n### Cloud-controller-manager\n\n`cloud-controller-manager` 将你的集群连接到云提供商的\
  \ API，并将与该云平台通信的组件与仅作为 Kubernetes 控制平面组件与集群交互的组件（底层具有云特定的控制逻辑）分离开来。你云提供商特有的控制器仅由它们运行。如果你在自己的电脑或学习环境中运行\
  \ Kubernetes，则集群没有云控制器管理器。与 `Kube-controller-manager` 类似，`cloud-controller-manager`\
  \ 将许多逻辑上独立的控制循环合并到一个作为单个进程运行的二进制文件中。你可以通过运行多个副本来水平扩展以提高性能或提高容错能力。云提供商依赖可能于以下控制器中：\n\
  \n* 为了检查云提供商以确定节点在停止响应后是否在云端被删除，使用了 `node controller`。\n* 为了在底层云基础设施中设置路由，使用了 `route\
  \ controller`。\n* 为了创建、更新和删除云提供商负载均衡器，使用了 `service controller`。\n\n### Components\
  \ of node\n\n节点组件运行在每个节点上，维护由 Kubernetes 运行时环境提供的运行 pod。\n\n### Kubelet\n\n`Kubelet`\
  \ 是一个运行在集群中每个节点上的代理，用于确保容器在 pod 中执行。`Kubelet` 接受一组 `PodSpecs` 并验证这些 `PodSpecs` 中提到的容器已启动、运行且健康良好。不是由\
  \ Kubernetes 创建的容器不受 `Kubelet` 管理。\n\n### Kube-proxy\n\n`Kube-proxy` 是运行在集群中每个节点上的网络代理，实现了\
  \ Kubernetes 服务概念的一部分，它负责维护节点上的网络规则。这些网络规则允许来自集群内部和外部的网络会话与你的 pod 通信。如果操作系统数据包过滤层可用，`Kube-proxy`\
  \ 将使用它；否则不会。\n\n### Runtime of container\n\n负责运行容器的软件被称为运行时，支持 `Docker`、`CRI` 等运行时。\n\
  \n### Add-ons\n\n为了实现功能，add-ons 使用 `DaemonSet`、`Deployment` 等 Kubernetes 资源。\n\n\
  ### DNS\n\n虽然其他 add-ons 是可选的，但集群应该有 DNS，许多 add-ons 都依赖它。\n\n### Web UI (dashboard)\n\
  \ndashboard 是一个基于 Web 的界面，允许用户管理和排错集群。\n\n# Monitoring of container resource\n\n\
  中心数据库跟踪有关容器资源的时间序列指标。\n\n### Logging cluster-level\n\n被称为集群日志的机制将日志保存到日志存储中。\n\n\
  ### An app creation\n\n为了为 Kubernetes 创建应用程序，我们首先需要在 Docker 中创建应用程序，可以通过两种方式实现：下载和通过\
  \ Docker 文件。\n\n# By downloading\n\n从仓库下载镜像并存储在本地 Docker 仓库中。为了这样做，运行如下 `pull` 命令。\n\
  \n```bash\n$ docker pull --help\n\nUsage: docker pull [OPTIONS] NAME[:TAG|@DIGEST]\n\
  从仓库拉取镜像\n-a, --all-tags = false   下载仓库的所有标记镜像\n--help = false             打印用法\n\
  ```\n\n以下将是上述代码的输出。\n\n```bash\ndocker@boot2docker: ~ docker images\nREPOSITORY\
  \         TAG       IMAGE ID       CREATED       VIRTUAL SIZE\nacadmins/puppetmaster\
  \             0f8b34820fc   5 weeks ago    599.5 MB\n<none>                    \
  \          daa321298bf   3 months ago    166.2 MB\nbusybox             latest  \
  \  9967c5ad8de   3 months ago    1093 MB\nubuntu              latest    426844eb7f7\
  \   3 months ago    127.1 MB\nmattermost/mattermost             2bca39df8ec   4\
  \ months ago    453.3 MB\nhello-world         latest    f0cb9bdcaa69   6 months\
  \ ago    1.848 KB\n```\n\n图 5.3: 上述代码的输出\n\n存储在我们本地 Docker 仓库中的一组镜像如前面的截图所示。\n\n\
  使用 docker run 命令，我们可以从镜像构建容器，该容器包含一个测试的应用程序。\n\n```bash\n$ docker run –i –t ubuntu\
  \ /bin/bash\n```\n\n### From Docker file\n\n我们需要先创建一个 Docker 文件，以便从 Docker 文件创建一个应用程序。Jenkins\
  \ Docker 文件的示例如下。\n\n1. `FROM ubuntu:14.04`\n2. `MAINTAINER vikramdesai@virtusapolaris.com`\n\
  3. `ENV REFRESHED_AT 2017-01-15`\n\n\n\n\n\n4. `RUN apt-get update -qq && apt-get\
  \ install -qqy curl`\n\n5. `RUN curl https://get.docker.io/gpg | apt-key add -`\n\
  \n6. `RUN echo deb http://get.docker.io/ubuntu docker main > /etc/apt/`\n\n7. `sources.list.d/docker.list`\n\
  \n8. `RUN apt-get update -qq && apt-get install -qqy iptables ca-`\n\n9. `certificates\
  \ lxc openjdk-6-jdk git-core lxc-docker`\n\n10. `ENV JENKINS_HOME /opt/jenkins/data`\n\
  \n11. `ENV JENKINS_MIRROR http://mirrors.jenkins-ci.org`\n\n12. `RUN mkdir -p $JENKINS_HOME/plugins`\n\
  \n13. `RUN curl -sf -o /opt/jenkins/jenkins.war -L $JENKINS_MIRROR/war-`\n\n14.\
  \ `stable/latest/jenkins.war`\n\n15. `RUN for plugin in chunknorris greenballs scm-api\
  \ git-client git`\n\n16. `ws-cleanup ;\\`\n\n17. `do curl -sf -o $JENKINS_HOME/plugins/${plugin}.hpi\
  \ \\`\n\n18. `-L $JENKINS_MIRROR/plugins/${plugin}/latest/${plugin}.hpi`\n\n19.\
  \ `; done`\n\n20. `ADD ./dockerjenkins.sh /usr/local/bin/dockerjenkins.sh`\n\n21.\
  \ `RUN chmod +x /usr/local/bin/dockerjenkins.sh`\n\n22. `VOLUME /var/lib/docker`\n\
  \n23. `EXPOSE 8080`\n\n24. `ENTRYPOINT [ “/usr/local/bin/dockerjenkins.sh” ]`\n\n\
  创建完成后，将此文件命名为 Dockerfile 并进入文件所在路径。然后，运行以下命令。\n\n```\ndocker@boot2docker: ~ $ docker\
  \ build – help\n```\n\n```\n用法: docker build [OPTIONS] PATH | URL | -\n\n从 PATH\
  \ 处的源代码构建新镜像\n\n- c, --cpu-shares = 0 CPU 份额（相对权重）\n-- cgroup - parent = 容器的可选父\
  \ cgroup\n-- cpu – period = 0 限制 CPU CFS（完全公平调度器）周期\n-- cpu – quota = 0 限制 CPU CFS（完全公平调度器）配额\n\
  -- cpuset -cpus = 允许执行的 CPUs (0-3, 0,1)\n-- cpuset – mems = 允许执行的 MEMs (0-3, 0,1)\n\
  - f, -- file = Docker 文件的名称（默认是‘PATH/Docker file’）\n-- force – rm = false 始终删除中间容器\n\
  -- help = false 打印用法\n- m, -- memory = 内存限制\n-- memory -swap = 总内存（内存 + 交换分区），‘-1’\
  \ 禁用交换分区\n-- no – cache = false 构建镜像时不使用缓存\n-- pull = false 始终尝试拉取新版本的镜像\n- q, --\
  \ quiet = false 抑制容器生成的详细输出\n-- rm = true 成功构建后删除中间容器\n-t, --tag = 镜像的存储库名称（以及可选的标签）\n\
  ```\n\n**图 5.4:** 运行命令 `docker@boot2docker: $ Docker build—help`\n\n```\n$ sudo\
  \ docker build -t jamtur01/Jenkins.\n```\n\n镜像构建完成后，我们可以测试镜像是否运行正常以及是否可以转换为容器。\n\
  \n```\n$ docker run –i –t jamtur01/Jenkins /bin/bash\n```\n\n## 应用部署\n\nKubernetes\
  \ 中的集群部署是将镜像转换为容器，然后将这些容器分配到 pod 的方法，并协助建立应用程序集群，该集群包括服务、pod、副本控制器和副本集部署。可以设置该集群，使得每个\
  \ pod 上的应用能够相互通信。\n\n我们可以在一个应用程序之上部署一个负载均衡器，将流量重定向到一组 pod，在这种设计中，pod 然后与后端 pod 连接。Kubernetes\
  \ 内置的 service 对象用于 pod 之间的交互。\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5:** Kubernetes\
  \ 应用集群视图\n\n## Nginx 负载均衡器的 YAML 文件\n\n```yaml\napiVersion: v1\nkind: Service\n\
  metadata:\n  name: oppv-dev-nginx\nlabels:\n  k8s-app: omni-ppv-api\nspec:\n  type:\
  \ NodePort\n  ports:\n    - port: 8080\n    nodePort: 31999\n  name: omninginx\n\
  selector:\n  k8s-app: appname\n  component: nginx\nenv: dev\n```\n\n## Nginx 副本控制器的\
  \ YAML\n\n```yaml\napiVersion: v1\nkind: ReplicationController\nmetadata:\n  name:\
  \ appname\nspec:\n  replicas: replica_count\n  template:\n    metadata:\n      name:\
  \ appname\n      labels:\n        k8s-app: appname\n        component: nginx\n \
  \       env: env_name\n    spec:\n      nodeSelector:\n        resource-group: oppv\n\
  \      containers:\n        - name: appname\n          image: IMAGE_TEMPLATE\n \
  \         imagePullPolicy: Always\n          ports:\n            - containerPort:\
  \ 8080\n        resources:\n          requests:\n            memory: “request_mem”\n\
  \            cpu: “request_cpu”\n          limits:\n            memory: “limit_mem”\n\
  \            cpu: “limit_cpu”\n  env:\n    - name: BACKEND_HOST\n      value: appname\n\
  ```\n\n## 前端 service YAML\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n\
  \  name: appname\nlabels:\n  k8s-app: appname\nspec:\n  type: NodePort\n  ports:\n\
  \    - name: http\n    port: 3000\n    targetPort: 3000\nselector:\n  k8s-app: appname\n\
  ```\n\n## 副本控制器文件\n\n```yaml\napiVersion: v1\nkind: ReplicationController\nmetadata:\n\
  \  name: backend\nspec:\n  replicas: 3\n  template:\n    metadata:\n      name:\
  \ frontend\n      labels:\n        k8s-app: appname\n        component: nginx\n\
  \    spec:\n      nodeSelector:\n        resource-group: oppv\n      containers:\n\
  \        - name: appname\n          image: IMAGE_TEMPLATE\n          imagePullPolicy:\
  \ Always\n          ports:\n            - containerPort: 9000\n          command:\
  \ [ “docker-entrypoint.sh” ]\n          resources:\n            requests:\n    \
  \          memory: “request_mem”\n              cpu: “request_cpu”\n           \
  \ limits:\n              memory: “limit_mem”\n              cpu: “limit_cpu”\n \
  \         volumeMounts:\n            - name: config-volume\n              mountPath:\
  \ /app/vikram/play/conf\n      volumes:\n        - name: config-volume\n       \
  \   configMap:\n            name: appname\n```\n\n## 自动伸缩\n\nKubernetes 集群的一个关键功能是**自动伸缩**，当服务响应需求增加时，集群能够增加节点，而当需求减少时，它会减少节点。\n\
  \n为了在 GCE 中设置可扩展的基础，我们首先需要一个启用了 Google Cloud 监控、Google Cloud 日志和 Stackdriver 的活跃\
  \ GCE 项目。\n\n我们将首先设置运行一些节点的集群。完成完成后，我们需要设置以下环境变量。\n\n```\nexport NUM_NODES = 2\n\
  export KUBE_AUTOSCALER_MIN_NODES = 2\nexport KUBE_AUTOSCALER_MAX_NODES = 5\nexport\
  \ KUBE_ENABLE_CLUSTER_AUTOSCALER = true\n```\n\n\n\n\n完成后，我们将通过运行 `kube-up.sh` 来启动集群，这将创建一个带有集群自动扩缩器插件的集群。\n\
  \n`/cluster/kube-up.sh`\n\n在创建集群后，我们可以使用以下 `kubectl` 命令检查我们的集群。\n\n```\n$ kubectl\
  \ get nodes\n```\n\n```\nNAME                            STATUS                \
  \  AGE\nkubernetes-master                Ready,SchedulingDisabled  10m\nkubernetes-minion-group-de5q\
  \      Ready                   10m\nkubernetes-minion-group-yhdx      Ready    \
  \               8m\n```\n\n使用以下命令，现在可以在集群上部署应用程序并启用水平 Pod 自动扩缩器。\n\n```\n$ kubectl\
  \ autoscale deployment <Application Name> --cpu-percent = 50 --min = 1 --max = 10\n\
  ```\n\n如前面的命令所示，随着应用程序负载的增加，我们将为它维护至少 1 个且最多 10 个 POD 副本。\n\n我们可以通过运行 `$kubctl get\
  \ hpa` 命令来检查自动扩缩器的状态。我们将使用以下命令增加 Pod 的负载。\n\n```\n$ kubectl run -i --tty load-generator\
  \ --image = busybox /bin/sh\n$ while true; do wget -q -O- http://php-apache.default.svc.cluster.local;\
  \ done\n```\n\n我们可以通过运行 `$ kubectl get hpa` 命令来检查 `hpa`。\n\n```\n$ kubectl get hpa\n\
  ```\n\n```\nNAME            REFERENCE               TARGET   CURRENT\nphp-apache\
  \  Deployment/php-apache/scale       50%       310%\nMINPODS     MAXPODS      AGE\n\
  1                           20         2m\n```\n\n```\n$ kubectl get deployment\
  \ php-apache\n```\n\n```\nNAME    DESIRED   CURRENT   UP-TO-DATE    AVAILABLE  \
  \ AGE\nphp-apache   7       7        3             3           4m\n```\n\n我们可以使用以下命令检查运行中的\
  \ pod 数量：\n\n```\njsz@jsz-desk2:~/k8s$ kubectl get pods\nphp-apache-204695998-ewo6\
  \ 0/1      Pending      1m\nphp-apache-204695998-8m3k 1/1      Running      1m\n\
  php-apache-204695998-ddpg 1/1      Running      5m\nphp-apache-204695998-lrik6 1/1\
  \      Running      1m\nphp-apache-204695998-nj465 0/1      Pending      1m\nphp-apache-204695998-tmwg1\
  \ 1/1      Running      1m\nphp-apache-204695998-xkb1 0/1      Pending      1m\n\
  ```\n\n最后，我们可以获取节点状态。\n\n```\n$ kubectl get nodes\n```\n\n```\nNAME            \
  \                STATUS                  AGE\nkubernetes-master                Ready,SchedulingDisabled\
  \  9m\nkubernetes-minion-group-6zi      Ready                   43s\nkubernetes-minion-group-de5q\
  \      Ready                   9m\nkubernetes-minion-group-yhdx      Ready     \
  \              9m\n```\n\n## Dashboard 设置\n\n使用一组工具，设置 Kubernetes dashboard 涉及多个步骤：\n\
  \n*   Docker (1.3+)\n*   go (1.5+)\n*   nodejs (4.2.2+)\n*   npm (1.3+)\n*   Java\
  \ (7+)\n*   gulp (3.9+)\n*   Kubernetes (1.1.2+)\n\n#### 设置 dashboard\n\n```\n$\
  \ sudo apt-get update && sudo apt-get upgrade\n```\n\n安装 Python\n```\n$ sudo apt-get\
  \ install python\n$ sudo apt-get install python3\n```\n\n安装 GCC\n```\n$ sudo apt-get\
  \ install gcc-4.8 g++-4.8\n```\n\n安装 make\n```\n$ sudo apt-get install make\n```\n\
  \n安装 Java\n```\n$ sudo apt-get install openjdk-7-jdk\n```\n\n安装 Node.js\n```\n$\
  \ wget https://nodejs.org/dist/v4.2.2/node-v4.2.tar.gz\n$ tar -xzf node-v4.2.tar.gz\n\
  $ cd node-v4.2\n$ ./configure\n$ make\n$ sudo make install\n```\n\n安装 gulp\n```\n\
  $ npm install -g gulp\n$ npm install gulp\n```\n\n### 验证版本\n\nJava 版本\n```\n$ java\
