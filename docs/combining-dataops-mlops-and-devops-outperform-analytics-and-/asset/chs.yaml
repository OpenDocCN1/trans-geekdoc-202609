  \n\n\n*   如果您还没有账户，请在 `apps.sematext.com` 注册一个免费账户。\n\n*   要获取 SPM App Token，请创建一个类型为“Docker”的\
  \ SPM App。Kubernetes 的性能指标和事件将由该 SPM App 托管。\n\n*   要获取 Logsene App Token，请创建一个\
  \ Logsene App，它将存储您的 Kubernetes 日志。\n\n*   在 DaemonSet 定义中，编辑 `LOGSENE_TOKEN` 和\
  \ `SPM_TOKEN` 的值，如下所示。\n\n    *   获取最新的 `SEMATECH-agent-daemonset.yml` 模板。\n   \
  \ *   将其存储在磁盘的某处。\n    *   使用您的 SPM 和 Logsene App token 替换 `SPM_TOKEN` 和 `LOGSENE_TOKEN`\
  \ 占位符。\n\n## 创建 DaemonSet 对象\n\n```yaml\napiVersion: extensions/v1beta1\nkind: DaemonSet\n\
  metadata:\n  name: sematext-agent\nspec:\n  template:\n    metadata:\n      labels:\n\
  \        app: sematext-agent\n    spec:\n      selector: {}\n      dnsPolicy: “ClusterFirst”\n\
  \      restartPolicy: “Always”\n      containers:\n        - name: sematext-agent\n\
  \          image: sematext/sematext-agent-docker:latest\n          imagePullPolicy:\
  \ “Always”\n          env:\n            - name: SPM_TOKEN\n              value:\
  \ “REPLACE THIS WITH YOUR SPM TOKEN”\n            - name: LOGSENE_TOKEN\n      \
  \        value: “REPLACE THIS WITH YOUR LOGSENE TOKEN”\n            - name: KUBERNETES\n\
  \              value: “1”\n          volumeMounts:\n            - mountPath: /var/run/docker.sock\n\
  \              name: docker-sock\n            - mountPath: /etc/localtime\n    \
  \          name: localtime\n      volumes:\n        - name: docker-sock\n      \
  \    hostPath:\n            path: /var/run/docker.sock\n        - name: localtime\n\
  \          hostPath:\n            path: /etc/localtime\n```\n\n使用 `kubectl` 运行 Sematext\
  \ agent Docker \n\n```bash\n$ kubectl create -f sematext-agent-daemonset.yml\n```\n\
  \ndaemonset “sematext-agent-daemonset” 已创建\n\n## Kubernetes 容器日志\n\n*   Kubernetes\
  \ 容器日志与 Docker 容器日志非常相似；然而，Kubernetes 用户需要查看部署的 pod 的日志。因此，拥有 Kubernetes 特定的信息非常有用，例如：\n\
  \n    Kubernetes 空间/pod 名称/容器名称、Docker 镜像名称以及 Kubernetes UID 可用于日志搜索。\n\n## ELK\
  \ 栈和 LogSpout 的应用\n\nElasticsearch、Logstash 和 Kibana 包含在 ELK 栈中。我们将使用 LogSpout 来收集并将日志转发到日志平台，同时也可以使用\
  \ FluentD 等其他选项。\n\n以下代码显示了如何在 Kubernetes 上设置 ELK 集群并为 ElasticSearch 创建服务：\n\n```yaml\n\
  apiVersion: v1\nkind: Service\nmetadata:\n  name: elasticsearch\n  namespace: elk\n\
  \  labels:\n    component: elasticsearch\nspec:\n  type: LoadBalancer\n  selector:\n\
  \    component: elasticsearch\n  ports:\n      - name: http\n        port: 9200\n\
  \        protocol: TCP\n      - name: transport\n        port: 9300\n        protocol:\
  \ TCP\n```\n\n## 创建 Replication Controller\n\n```yaml\napiVersion: v1\nkind: ReplicationController\n\
  metadata:\n  name: es\n  namespace: elk\n  labels:\n    component: elasticsearch\n\
  spec:\n  replicas: 1\n  template:\n    metadata:\n      labels:\n        component:\
  \ elasticsearch\n    spec:\n      serviceAccount: elasticsearch\n      containers:\n\
  \        - name: es\n          securityContext:\n            capabilities:\n   \
  \           add:\n                - IPC_LOCK\n          image: quay.io/pires/docker-elasticsearch-kubernetes:1.7.1-4\n\
  \          env:\n            - name: KUBERNETES_CA_CERTIFICATE_FILE\n          \
  \    value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n            -\
  \ name: NAMESPACE\n              valueFrom:\n                fieldRef:\n       \
  \           fieldPath: metadata.namespace\n            - name: CLUSTER_NAME\n  \
  \            value: “mycluster”\n            - name: DISCOVERY_SERVICE\n       \
  \       value: “elasticsearch”\n            - name: NODE_MASTER\n              value:\
  \ “true”\n            - name: NODE_DATA\n              value: “true”\n         \
  \   - name: HTTP\n              value: “true”\n            - name: ENABLE\n    \
  \          value: “true”\n          ports:\n            - name: http\n         \
  \     containerPort: 9200\n            - name: transport\n              containerPort:\
  \ 9300\n          volumeMounts:\n            - mountPath: /data\n              name:\
  \ storage\n      volumes:\n        - name: storage\n          emptyDir: {}\n```\n\
  \n\n\n\n\n为了提高送餐服务的效率和效果，该业务还希望利用 Google Maps 平台提供的机会。Rebel foods 需要在提供预计送餐时间并满足送餐保证的同时，考虑到所有可能影响骑员到达美食爱好者门口速度的所有因素，其拥有\
  \ 175 间厨房，为全印度约 900 个地点提供配送服务。\n\n为了提供卓越的客户体验并提高效率，该公司转向 Google Maps 平台顶级合作伙伴 `Searce`\
  \ 寻求支持，以利用 `Google Maps platform APIs`。Barman 表示：“在我们所有的移动端应用程序和网站中，Searce 帮助我们确定了应该使用哪些\
  \ Google Maps platform APIs，以及我们需要多少个许可来执行计算预计送餐时间、查看订单热力图等活动。Google Maps platform\
  \ APIs 对我们来说是一个游戏规则改变者，感谢该公司的支持。”\n\n## 客户位置映射\n\n在地图上，客户通过 `Places API` 和 `geocoding\
  \ API` 结合 `JavaScript API` 提供的功能来精准定位自己的位置。为了找到到达客户的最快路线，驱动程序使用了 `Directions API`。\n\
  \n客户通过 `Android` 或 `iOS` 应用程序或品牌网站，还可以跟踪送餐进度和预计到达时间。\n\nRebel foods 通过部署 `Google\
  \ Maps platform APIs`，将预测送餐时间的准确性提高了高达 60%。Barman 说：“我们可以获取准确的交通状况，并根据交通拥堵程度和可能的平均速度来计算送餐时间，而不是根据以往经验和直觉告诉客户我们可能在\
  \ 45 分钟后到达。”\n\n## 有效分配预算\n\n`Google Maps Platform` 允许将客户映射到各个厨房，并了解客户下单的频率以及订单价值，这使得该业务能够通过了解在何处分配本地营销预算，来刺激服务不足地区的需求。\n\
  \n根据之前的使用情况和行为，`Google Maps platform` 技术补充了 Rebel foods 对 `Google Cloud platform`\
  \ 服务的使用，例如 `BigQuery` 分析数据仓库，用于处理预测库存水平和向客户提供建议的数据。为了实现具有成本效益的扩展以便扩展到国际市场，该公司还于\
  \ `Kubernetes` 中运行其关键应用程序。\n\nBarman 说：“我们的目标是在 2019 年 1 月扩展到一系列国际市场，包括澳大利亚、中东和东南亚。特别是有了\
  \ `Google Maps Platform` 提供的用户数据和经验，我们已准备好取得成功。”\n\n# 结论\n\n本章介绍了 `Kubernetes`，这是一个用于在集群环境中管理容器化应用程序的开源系统。\n\
  \n`Docker containers` 是一个开源软件开发平台。\n\n`Docker Swarm`是一组物理或虚拟机，它们被配置在集群中协同工作并运行 `Docker`\
  \ 应用程序。\n\n`Container Orchestration` 是关于管理容器生命周期的，特别是在大型、动态环境中。软件团队使用它来控制和自动化许多任务。\n\
  \n部署和扩展容器化应用程序涉及的许多手动过程都通过 `Kubernetes Orchestration` 被消除了。\n\n此外，我们讨论了 `Kubernetes\
  \ architecture`、`master server`、`node server`、`node controllers`、`Kubernetes objects`\
  \ 和 `workloads`、`pods`、`replication controllers`、`replication sets`、`deployments`、`stateful\
  \ sets`、`daemon sets`、`jobs` 和 `cron jobs`、`service`、`volumes`、`persistent volumes`、`labels`、`annotations`、`secrets`、`network\
  \ policy`、`add-ons`、`autoscaling`、`dashboard` 以及 `monitoring`。\n\n下一章节将关于 `DataOps`，这是一种自动化的、以流程为向的方法。\n\
  \n# 关键词\n\n- `Kubernetes`: 在集群环境中，这是一个开源系统。\n- `PaaS`: 平台即服务\n- `IaaS`: 基础设施即服务\n\
  - `Docker containers`: 它是一个开源软件开发平台。\n- `Docker Swarm`: 它是运行 `Docker` 应用程序的。\n-\
  \ `Container Orchestration`: 关于管理容器的生命周期。\n- `Kubernetes Orchestration`: Kubernetes\
  \ 简化了手动过程。\n- `Kubernetes architecture`: 这是一个分层构建的系统。\n- `master server`: 它作为主控制平面。\n\
  - `node server`: 通过运行容器工作的服务器被称为节点。\n- `node controller`: 它是运行在 master 上的服务集合。\n\
  - `Kubernetes objects and workloads`: Kubernetes 使用了额外的抽象层。\n- `pods`: Kubernetes\
  \ 处理的基单元是 `pod`。\n- `replication controllers`: 为了水平扩展 pod 的相同副本。\n- `replication\
  \ sets`: 在控制器识别 pod 方面具有更大的灵活性。\n- `deployments`: 为了直接创建和管理，最常见的负载之一是 `deployments`。\n\
  \n\n\n\n\n- **Stateful sets（有状态集）：** 提供排序和唯一性保证的特殊 pod 控制器是有状态集，当你对部署顺序、持久数据或稳定网络有特殊需求时，可以使用它们进行控制。\n\
  - **Daemon sets（守护集）：** 一种在集群中的每个节点上运行 pod 副本的 pod 控制器形式，通常用于部署帮助维护节点自身并为节点本身提供服务的\
  \ pod。\n- **Jobs and cron jobs（任务和定时任务）：** Kubernetes 使用名为 jobs 的工作负载来创建一种更基于任务的工作流，其中运行的容器预计在运行一段时间后，完成任务并成功退出。Cron\
  \ jobs 提供了一个接口，用于执行带有调度组件的作业并基于这些作业进行构建。\n- **Service（服务）：** 作为 pod 的基本内部负载均衡器和大使运行的组件称为\
  \ service。\n- **Volumes（卷）：** 在 pod 内部，这种抽象允许所有容器共享数据，并保持数据可用，直到 pod 终止。\n- **Persistent\
  \ volumes（持久化卷）：** 为了抽象出与 pod 生命周期解耦的更健壮存储，使用的机制是持久化卷。\n- **Labels（标签）：** 为了将它们标记为组的一部分，它是一种可以附加到\
  \ Kubernetes 对象上的语义标记。在针对不同实例进行管理或路由时，可以选择这些标签。\n- **Annotations（注解）：** 注解允许向对象附带任意的键值信息。注解的格式更自由，可以包含结构化程度较低的数据，而标签应该用于有助于与选择标准匹配\
  \ pod 的有用语义信息。\n- **Secrets（秘密）：** 使用加密密钥存储用户名和密码等敏感数据的 Kubernetes 对象是 secrets。\n\
  - **Network policy（网络策略）：** 网络策略定义了同一命名空间下的 pod 如何相互以及与网络端点通信。\n- **Add-ons（插件）：**\
  \ 为了实现集群功能，插件使用了 Kubernetes 资源，如 daemon set、deployment 等。\n- **Autoscaling（自动伸缩）：**\
  \ 一项功能，通过该功能，集群能够根据服务响应需求的增加而增加节点，并根据需求的减少而减少节点数量。\n- **Dashboard（仪表板）：** Kubernetes\
  \ 仪表板的设置涉及几个步骤和一组必要的工具要求。\n- **Monitoring（监控）：** 它是管理大型集群的重要部分，Prometheus、Ranch\
  \ Eye、Grafana、InfluxDB 和 Prom-ranch-exporter 等技术可以提供帮助。\n\n# 问题\n\n1. 在软件和 DevOps\
  \ 领域什么是编排（Orchestration）？\n2. Kubernetes 和 Docker 之间是什么关系？\n3. Kubernetes 架构的主要组件有哪些？\n\
  4. Kubernetes 中的节点（node）是什么？\n5. Kubernetes 中的 pod 是什么？\n6. Kubernetes 中的容器集群（cluster\
  \ of containers）是什么？\n7. 什么是谷歌容器引擎（Google Container Engine）？\n8. 什么是 Kubernetes\
  \ 控制器管理器（controller manager）？\n9. 控制器管理器有哪些类型？\n10. 什么是 etcd？\n11. 什么是 Kubelet？\n\
  12. 什么是 kubectl？\n13. 请给出 Kubernetes 推荐安全措施的示例。\n14. 什么是为 Kubernetes 负载均衡器获取静态 IP？\n\
  \n# 第 6 章\n\n# DataOps 的数据工程\n\n## 引言\n\nDataOps 是一种新的数据管理方法，它通过利用流程变更、组织重组和技术，促进以前孤立的数据、团队和系统的通信与集成，促进所有与数据工作的人（包括开发者、数据工程师、分析师、数据科学家和业务用户）之间的关系。DataOps\
  \ 汇聚了收集和准备数据的人、分析数据的人以及将这些分析结果用于业务业务的人。\n\n为了缩短数据分析的周期并提高质量，分析团队和数据团队使用了 DataOps，这是一种自动化且以流程为导向的方法，专注于通过自动化分析的测试和部署以及利用按需的\
  \ IT 资源来实现持续交付。\n\n实现数据的快速、自动和安全管理是人员、流程和技术的对齐。它通过将需要数据的人与提供数据的人聚集在一起，消除了整个数据生命周期中的摩擦，其目标是改进结果。\n\
  \n为了持续加速输出并提高质量，一种使用自动化、测试、编排、协作开发、容器化和持续监控来交付数据分析解决方案的集成方法就是 DataOps，其目的是尽可能快地满足业务需求，加速数据和分析流水线的创建，自动化数据工作流，并交付和运行高质量的数据分析解决方案。DataOps\
  \ 需要一系列为客户交付价值的步骤，因此要培养持续改进的文化，尽可能自动化这些步骤，并减少浪费和冗余。\n\n# 结构\n\n在本章中，将涵盖以下主题：\n\n\
  - 介绍 DataOps\n- DataOps 实践目标\n- DataOps 定义\n- DataOps 需求\n- 人员与流程\n- 技术\n- 开启 DataOps\n\
  \    - 以人人为本\n    - 管理流程，采用工具\n    - 为 DataOps 建立理由\n    - 开始行动吧！\n- DataOps 采用：给领导者的启示\n\
  - DataOps 数据架构\n    - DataOps 架构拆解\n    - 多地 DataOps 的数据架构\n    - 集成到现有数据架构中的 DataOps\n\
  - DataOps 原则\n- DataOps 成熟度模型\n- 数据分析 DataOps\n- DataOps 的核心业务收益\n- DataOps 实施\n\
  - DataOps 的知识传承\n- DevOps 和 DataOps——人为因素\n- DevOps 和 DataOps——流程差异\n- DevOps 和\
  \ DataOps——开发与部署流程\n- DataOps 中编排的二重性\n- DataOps 中测试的二重性\n- DataOps 中沙箱管理的复杂性\n\
  - DataOps 中测试数据管理的复杂性\n- 使用 DataOps 通过两种连接组织\n- 数据分析生命周期复杂的企业案例\n\n# 目标\n\n阅读完本章后，你将理解\
  \ DataOps（数据 + 操作），因为数据是当今业务中竞争的关键资产。书中提供了 DataOps 实践目标和定义，这将帮助你理解 DataOps 的必要性。它进一步解释了如何开始\
  \ DataOps 以及涉及的人员、流程和技术问题。\n\n此外，书中还提供了 DataOps 采用：给领导者的启示的描述以及 DataOps 架构的解释。它描述了\
  \ DataOps 原则和 DataOps 成熟度模型，并解释了用于分析的 DataOps 及其核心收益。\n\n书中描述了实施 DataOps 的七个步骤要求、价值与创新流水线的解释，以及\
  \ DataOps 的知识传承。此外，还提供了 DevOps 和 DataOps 中的人为因素、流程差异以及开发与部署流程。\n\n书中提供了对 DataOps\
  \ 中编排二重性和测试二重性的理解。随后描述了 DataOps 在沙箱管理和测试数据管理方面的复杂性。\n\n\n\n\n组织旨在精简其数据和分析结构，以实现更挑战性的业务目标，但由于数据环境的复杂且变化快，这变得非常困难。DataOps\
  \ 通过将集成的、以流程为导的数据视角与自动化以及敏捷软件工程方法（如 DevOps）相结合，通过提高质量、速度和协作来鼓励持续改进的文化，承诺了一种解决方案。\n\
  \n在当今的业务场景下，数据是竞争的关键资产。数据对于许多业务流程甚至整个业务模型都至关重要，数据驱动的决策能显著提高业务成功率。公司正寻求精简其数据和分析操作，以提高效率、更快速地提供更高质量的数据，并确保运行的稳定可靠。然而，由于工具和技术不一导致的碎片化数据格局、涉及多个利益相关者的巨大范围、快速变化的业务需求以及普遍缺乏标准，这可能变得非常困难。通过修改这些不足且低效的结构，有必要构建公司的数据和分析，使其能够稳定运行并提升速度、质量和整体生产力。在讨论如何实现这一目标时，主题通常包括敏捷方法、数据治理概念或自动化的使用。为了以不断提高的速度提供高质量软件，许多人在这里看到了与软件工程中引入\
  \ DevOps 和持续集成时面临挑战的相似之处。因此，由于数据分析不同于软件工程，新术 DataOps 应运生。\n\n# DataOps 实践目标\n\n\
  DataOps 的实践目标如下：\n\n*   持续模型部署\n*   促进可重复性\n*   促进敏捷性\n*   促进自服务\n*   文化：协作与信任的文化是\
  \ DataOps 的核心，所有利益相关者必须共同努力并对整个过程负责，而且在所有阶段对业务需求的意识至关重要。\n*   流程：为了强化 DataOps 原则，需要定义良好的流程、角色、准则和指标。为了教育和培训员工，许多公司随之建立了测试和认证计划。\n\
  *   技术：DataOps 需要工具和基础设施，以及所有利益相关者之间的协作与通信，以支持自动化、测试、监控和编排（Orchestration）。\n\n##\
  \ DataOps 定义\n\nDataOps 通过发挥数据的力量，实现数据和分析转型中的价值，可以定义如下：\n\n*   DataOps 是一套实践、程序和技术，它将集成的、以流程为向的数据方法与自动化和敏捷软件工程方法相结合，在提高质量、速度和协作的同时，也鼓励持续改进的文化。\n\
  *   DataOps（数据 +get）是为从采集到交付的端到端数据管道流程增加速度和敏捷性的方法。\n*   DataOps 是人员、流程和技术的协调，旨在向数据公民（data\
  \ citizens）快速交付信任且高质量的数据。该方法专注于促进跨公司的协作，以便在大范围内交付敏捷性、速度和新的数据倡议。利用自动化力量，DataOps 旨在解决与获取、准备、整合和提供数据效率低下相关的困难。\n\
  *   协作式数据管理实践侧重于增加组织内部经理与数据消费者之间数据流的通信、集成和自动化。\n*   一个收集和传播数据的中心，负责授予对记录系统（systems\
  \ of record）的限制访问权限。\n\n理解 DataOps 不是什么同样关重要。它不是一个产品；不是某个特定的事件或阶段；不是某个特定的团队或个人。根据经验法则，你选择的\
  \ DataOps 方法或实践应该考虑这些因素之间的关系。\n\n## DataOps 的需求\n\nDataOps 的需求产生于以下两个趋势：\n\n*  \
  \ 对数据更高敏捷性的需求：由于当今业务运行速度非常快，如果数据不以同样的速度移动，它就会在决策过程中被丢弃。类似于创建 Web 应用的敏捷性导致了数据端 DevOps\
  \ 文化的产生。现在需要同样的敏捷性。\n*   数据正变得日益主流：这归因于当今世界中新应用、物联网（`IoT`）传感器和社交媒体导致的数据源的激增。数据可以成为竞争优势，这一点正日益被认识。当今企业强烈感觉到需要将数据民主化并使其易于访问，因为数据已成为主流。\n\
  \n由于这些趋势，数据团队面临的压力日益增大。事实上，数据团队面临着以前应用程序开发人员所面临的问题。现在不是工程师编写代码，数据科学家创建分析模型来从海量数据中提取有意义的见解。然而，无论这些数据科学家多么创意，如果他们无法获取数据，或无法将模型结果交给决策者，他们就无法帮助业务。\n\
  \n对于希望在实时业务智能成为竞争必然的世界中生存和发展的组织来说，DataOps 是一项必不可少的学科。驱动这一点的三个三个：\n\n1.  数据不是静态的。描述大数据的三个\
  \ V 是数量（volume）、速度（velocity）和多样性（variety），这些也在不断变化。在某个特定的工作日，机器学习可能是重中之重；在另一个工作日，你需要关注预测分析；而在另一个工作日，你正在处理交易。你拥有的基础设施需要同样良好地支持所有这些不同的负载。通过增加与\
  \ DataOps 的通信与协作，你可以快速设计新模型，重新调整工作负载，并从你的数据中提取价值。\n2.  技术是不够的。支撑它的技术以及数据科学一直在改进，但这些工具只有在被持续且可靠地使用时才有用。\n\
  3.  需要更强的敏捷性。当数据仓库架构和最佳实践在 1990 年首次演变时，所需的敏捷性远大于今天。因为今天围绕数据的组织敏捷性要快得多、得多——我们需要修改数据组织本身的节奏。\n\
  \n\n\n\n在从零建立数据环境时，DataOps 是处理数据访问和基础设施的一种非常自然的方法；新公司比老牌公司更快、更容易地拥抱 DataOps，因为后者必须彻底改变其现有的流程、基础设施以及对数据的思维方式。当\
  \ DevOps 成为常态时，许多这类新公司应运而生，这就是为什么它们天生就对孤岛文化产生反感。因此，为了数据需求而采用 DataOps 对它们来说是一个自然的演进过程，是其\
  \ DNA 中的需求。Facebook 就是一个很好的例子，它在 2007 年每周发布产品，因此人们预计这些发布的数据能够立即可用。等待几周或几个月才能获取这些信息是不可接受的。在这样的环境下，由于对敏捷性的高度渴望，DataOps\
  \ 文化变成了一种迫切的必要需求。\n\n传统企业的安全和控制程序尤其必须演进。成熟的企业担心，如果敏感数据可以被任何人访问，他们将如何确保数据的安全和私密。DataOps\
  \ 要求企业遵守严格的数据治理准则。这些都是合理的顾虑。\n\n# 人与流程\n\nDataOps 通过使用自动化技术在项目输出和时间上带来巨大的效率效益，从而使团队具有高生产力。然而，要获得这些利益，企业文化必须适应并转变为真正的数据驱动。随着越来越多的业务部门要求并希望通过管理数据来产生上下文洞察，现在是时候：\n\
  \n*   改进流入组织的数据流的质量和速度。\n*   获得公司全员领导层的承诺，支持并维持数据驱动的战略。\n\n这种变革性的变化始于对业务真实目标的了解。数据在影响客户决策和服务方面扮演着什么角色？数据如何帮助维持市场竞争优势？数据可以帮助我们解决哪些收入优先事项？\n\
  \n为了证明执行层利益相关者与产生快速、可衡量的结果之间的联系，DataOps 领导者需要将业务目标与任何试点项目的交付物对齐，并定义所有数据人员在推动文化和\
  \ DataOps 实践发展方面所扮演的角色。每家公司对成功都有自己的要求，IT、数据科学、业务部门以及其间的每个人都必须做出贡献。每个人对你的业务扮演什么角色，这需要所有职能之间的紧密协调，以及对该实践长期可行性的奉献。\n\
  \n## 技术\n\n对于任何依赖自动化的实践，工具的支持都是必不可少的。组织的信息架构是 DataOps 的核心。问题是：你了解你的数据吗？你信任你的数据吗？你能快速检测错误吗？你能够在不“破坏”整个数据流水线的情况下进行增量更改吗？如果你不确定如何回答这些问题，第一步是对你的数据治理和数据集成工具及实践进行清点。\n\
  \n在考虑支持你业务中 DataOps 实践的工具时，请思考以下五个关键领域的自动化如何转变你的数据流水线：\n\n*   数据策展服务\n*   元数据管理\n\
  *   数据治理\n*   主数据管理\n*   交互式自服务\n\n展示 DataOps 采用进展的一种切实方法是实施工具，但这需要全局性的愿景。公司不太可能通过牺牲其他元素而专注于某一个元素来实现实施\
  \ DataOps 实践的收益。工具的存在是为了协助和维护一种文化，在这种文化中，技术讨论和实施与持续的人员和流程规划并非分离。\n\n## 开始 DataOps\n\
  \n数据质量、修复、集成、数据模型和实时分析驱动应用的下一代愿景是 DataOps，这是一种促进数据专家与运营人员之间协作，以管理跨流水线“无阻”数据流的实践。\n\
  \n数据质量受到孤岛化、复杂数据流水线的限制，而数据运营是一项混乱的业务。在整个供应链中，手动且不受治理的数据交付流程会导致分析过程受损，跨数据职能缺乏协作会阻碍协调和效率，影响分析周期，并导致产品交付遭受影响。\n\
  \nDataOps 旨在构建流线型的数据流水线，以对数据分析产生全面的信心，并提供一条让数据运营运行得更加高效有效的路径。它是 DevOps 之后的下一个变革性实践，DevOps\
  \ 改进了运营与软件开发之间的关系。\n\n根据 451 研究副总裁 Matt Aslett 的说法，DataOps 方法论将一些 DevOps 敏捷开发和部署方法应用于数据处理和集成流水线。\n\
  \n“虽然应用开发和发布周期已经加速，但数据集成和处理流水线或数据库发布周期并非如此，这导致数据库和数据供应可能成为应用开发和业务敏捷性的障碍，”Aslett\
  \ 说道。为了支持自服务敏捷分析等，DataOps 的核心在于为数据、数据库和数据集成流水线的提供实现迭代生命周期。\n\n作为 IT 或数据领导者，你可以帮助你的组织做到这一点。但问题是如何做呢？\n\
  \n你要做的第一件事是从脑海中消除 DataOps 只是应用于数据的 DevOps 这种念头。\n\n然而，这两个概念确实有联系，因此理解基础概念非常重要。\n\
  \n如果你的公司具有使用敏捷和 DevOps 的经验，你就拥有领先优势。通过这些经验，所有人对于将开发和部署实践引入数据处理和集成流水线都有了更好的视角。\n\n\
  你可以从审阅 2001 年发布的《敏捷软件开发宣言》和几年前发布的《DataOps 宣言》开始。后者在前者的某些方面基础上进行了构建。为了获得最佳的分析洞察、算法和架构，两者都共享以下原则：通过软件的持续交付来满足客户；促进业务人员、分析团队和运营人员之间的日常沟通；以及依靠自组织团队。\n\
  \n为了适应 DataOps，敏捷宣言的原则可以帮助到你。例如，在数据管理的背景下，致力于提高周期时间的目标。将一个客户的想法转化为分析过程，尽可能地减少所需的时间和精力，在开发中创建它，将其作为可重复的生产过程发布，并对该产品进行重构和重复。\n\
  \n如果你正在寻找一个整个行业遵循的广为人知的 DevOps 宣言，你找不到——至少目前还没有。但敏捷、DevOps 和精益制造都适用于数据分析。“敏捷交付分析的速度比瀑布模型快得多且更稳健，”DataKitchen\
  \ 的首席执行官、DataOps 咨询和平台供应商 Chris Bergh 说道，《DataOps 宣言》诞生在那里。“没有持续部署（即 DevOps），完全转型敏捷或有效管理运营几乎是不可能的。”\n\
  \n\n\n\n软件开发与数据分析的区别在于，数据分析承担了数据操作的责任。Bergh 认为，这与其说是软件工程，倒不如更像制造业。\n\n在数据分析中，数据通过一系列步骤移动。为了最终以报告、模型或可视化的形式输出，每一步都从上一步获取输入，并为下一步创建输出。Bergh\
  \ 表示：“通过精益生产简化了数据流水线，通过在数据流过流水线时进行测试来确保质量”。在数据分析流水线的每个阶段，对输入、输出和所应用的业务逻辑进行测试，引入了系统化的方法来降低风险，因此低质量数据永远不会到达关键的分析过程中。\n\
  \n# 将人放在首位\n\n在 DataOps 组合中发挥直接作用的参与方中，你确实需要培养纽带并协调活动。\n\nDataOps 的重点在于让不同团队之间建立紧密协作，这意味着数据分析师、数据工程师和数据科学家要投入精力到开发过程中，且每个团队成员的角色都对齐，以执行他们部分的工作。例如，数据工程师是构建数据流水线的人；这不应该是数据科学家的责任。\n\
  \nDataOps 团队需要记住，无论个人职能如何，其产品都是另一个团队的依赖。“一个在主数据管理平台上工作的数据工程师的日常状态，与一个在 Tableau 中工作的数据分析师大不相同”。不同团队通过他们使用的特定工具的透镜来观察这个世界；然而，他们需要跳出框架思考，例如考虑另一个团队可能会如何复用他们产生的数据、构件或代码。DataOps\
  \ 使用自动化的编排（Orchestration）、测试和报告作为数据工程师、科学家、分析师和用户之间的通信媒介，而不是让工具和技术集成来产生组织孤岛。\n\n\
  这并不意味着每一个能够从数据管理敏捷方法中获益的人都需要你提醒他们，他们都是某个名为 DataOps 的东西的一部分。但是，你试图带入组织的内容以及其原因，这些这些应该被数据操作人员和高级\
  \ IT 决策者充分理解是至关重要的。\n\n## 管理流程，接纳工具\n\n你需要提供指导，以激励业务接受 DataOps 任务协调和通信框架。“对于创建新应用程序和更改现有应用程序，DataOps\
  \ 尝试应用一些标准流程”。“什么是正确的流程？一旦我们创建并更改了它们，我们如何自动化我们构建的内容，使其能够持续运行而不会出错？”\n\nDataOps 的采用要求人们理解如何实施、自动化和监控定义良好的流程。这些数据流水线的工作流涵盖了新功能和修改功能的构建、更改、测试、部署、运行和跟踪。\n\
  \n从数据摄取到工程再到分析，数据流水线的所有点位都需要由你进行监控；同样，在开发过程中，你需要构建测试并将其与监控相结合，以确保内容被妥善地交付。“这样，我们可以在问题到达用户社区之前识别出是否发生了故障，这样，我们就可以保持这些流水线的通畅而不是中断”。\n\
  \nDevOps 创建了可以帮助 DataOps 的准则。一个用于签入/签出、版本控制、持续集成和持续增量部署的仓库，是一种软件工程实践，它允许数据开发者更高效地进行并行工作。“为了加速向业务推行新事物的过程，这些东西都是从\
  \ DevOps 借来的”。\n\n为了促进 DataOps 的采用，你可以使用任何技术；然而，无论你使用什么，都不应该要求对底层数据平台或面向用户的分析工具进行彻底改动。一个不断增长的供应商市场可以帮助你满足需求。\n\
  \nDataOps 存在许多专业平台，其中包括用于自动编排数据操作流水线并部署新分析、自动化和监控数据处理流水线、以及跨企业集成数据的工具。其他参与者提供了数据统一环境和持续数据集成环境。\n\
  \n与该领域相关的还有数据库发布自动化工具以及专门针对数据自动配置的工具。\n\n## DataOps 案例构建\n\nDataOps 的原则应该由你来传扬，因为它是一种方法论、一种实践和一种学科，与任何其他\
  \ IT 项目一样，它需要参与者的支持。\n\n你可能已经从同僚那里听过“对我有什么好处？”的问题，现在你应该准备好回答它。\n\n\n\n\n数据源来自左侧，通过转换为右侧的用户提供报告和分析。行业工具包括原始数据、精炼数据、数据湖/数据仓库/数据市、数据工程、数据科学、模型、可视化等。大多数企业级数据架构均可以在云端或本地部署，并已发展为结合使用两者的模式。\n\
  \n### 图 6.2：标准架构\n\n当专业人士定义架构时，他们的关注点是性能、延迟和负载等生产需求。数据工程师和专业人士在执行这些需求方面表现出色，但问题在于，规范中并没有包含针对快速变化的架构设计。例如，移动设备设计越来越多地将电池放在固定位置（例如敏感电子元件处），这在许多情况下导致消费者已无法访问和更换电池。对“维修权”的倡议与构建带有固定电池的手机手机如出一辙——当经理和架构师未能考虑为快速变化和高效开发而设计生产数据架构时，就会导致计划外的工作、手动部署和官僚主义。部署一个细微的\
  \ SQL 修改可能需要几个月的时间。\n\n在不规划变化的情况下构建数据架构，其后果比固定电池的手机要糟糕得多。分析用户每天甚至有时每小时都会提出变化需求，而手机电池每几年才更换一次，这对于现有的数据架构可能是不可能的；但如果你为此进行架构设计，就可以满足这一需求。通过关注这些目标，数据架构可以设计得更加灵活、响应迅速且稳健。通过使用现代工具和流程增强架构，旧留的数据流水线可以升级以实现这些目标。\n\
  \n想象一下数据架构师预先获得这些需求的情况。用户故事或功能规范可能包含此类需求：在不影响运营的情况下在一小时内更新并发布更改，在发布分析之前发现数据错误，以及在一天内创建模式更改。\n\
  \n如果你是一个数据架构师，你可能对如何处理这类需求有创新想法。这需要独立但相同的开发、测试和生产环境。你需要组织并自动化新分析到生产环境的测试、监控和部署。当你除了生产需求外，还针对灵活性、质量、快速部署和实时数据监控设计架构时，你正朝着\
  \ DataOps 数据架构迈。\n\n通过包含对敏捷迭代开发、DevOps 和统计过程控制的支持，传统的面向操作型数据架构可以由 DataOps 数据架构进行扩展。这些工具和过程统称为\
  \ DataOps 平台。\n\n# DataOps 架构\n\nDataOps 架构支持环境创建和管理，允许独立的开发、测试和生产环境，以及编排、监控和测试自动化。自动化影响评审和新分析部署的程序可能会经过审核并实时发布修改。每个环境中的代理代表\
  \ DataOps 平台管理代码和配置、执行任务，并报告测试结果、日志和运行信息。这使得架构能够跨异构工具和平台工作。其他几个功能集成到 DataOps 平台中，以支持快速部署和高质治理的目标：\n\
  \n*   **存储/版本控制——** 对于治理和迭代开发至关重要，构物的更改由版本控制管理（例如：`Git` 和 `Dockerhub`）。\n*   **历史和元数据——**\
  \ 管理系统和活动日志（例如：`MongoDB`）。\n*   **授权与权限——** 控制对环境的访问（例如：`Auth0`）。\n*   **环境密钥——**\
  \ 对环境内工具和资源的基于角色的访问（例如：`Vault`）。\n*   **DataOps 指标和报告——** CDO 仪表板对内部分析提供的分析和数据团队状态提供宏观评估（例如：`Tableau`）。\n\
  *   **自动化部署——** 涉及将代码/配置从一个环境（例如测试环境）移动到生产环境（例如：`Jenkins` 和 `CircleCI`）。\n*   **环境的创建与管理——**\
  \ 为了使用所需硬件、软件和测试数据集开展工作以便为你的团队创建空间，请将基础设施视为代码（例如：`Chef` 和 `Puppet`）。\n*   **编排、测试和监控——**\
  \ 当你的流水线运行时，编排所有涉及的工具，进行测试、监控并在出现问题时报警（例如：`Airflow`、`Great Expectations`、`Grafana`）。\n\
