  \n**图 4.20:** 微服务应用输出\n\n# 结论\n\n在本章中介绍了如何使用 Docker 容器设计微服务架构。微服务是一种针对 DevOps 和\
  \ CI/CD 优化的构建方法。文中讨论了迁移到微服务架构的原因以及微服务的优势。\n\n随着 Docker 的出现，服务端 Web 应用的发展发生了巨大变化。现在利用微服务可以轻松构建可扩展且易于管理的应用程序。我们讨论了\
  \ Docker 对微服务的优势以及 Docker 如何优于虚拟机（VMs）。\n\n接下来，我们将讨论 Docker 架构、`Docker images`、`Docker\
  \ containers`、`Docker files`、`Docker volumes` 以及镜像注册表（仓库）。\n\n接着，将讨论如何使用 Docker\
  \ 扩展基于微服务的应用架构，并使用容器编排系统管理基于 Docker 的应用。\n\n下一节讨论了一种名为服务网格（service mesh）的跨服务通信基础设施。讨论了服务网格的作用——服务网格中的负载均衡/服务发现、sidecar\
  \ 代理、服务网格监控以及服务网格工具。\n\n随后，我们介绍了 Pik-n-Pay 超市的微服务架构案例研究，这是一个部署在云端的基于 MSA（微服务架构）的解决方案。\n\
  \n接下来将阐述一个基于微服务的出租车应用以及购物车应用程序的用例。\n\n后续章节涉及微服务架构、微服务特性、微服务的优势、设计微服务的最佳实践、微服务示例——Java\
  \ 中的微服务、Docker 中的微服务、云端微服务以及实战 MSA。\n\n你在本章中发展的知识、学习能力、经验和技能将对你的学术和职业发展产生巨大帮助。\n\
  \n下一章是 Kubernetes——一种由 Google Lab 开发的容器集群管理器，用于管理物理、虚拟和云基础设施等不同环境中的容器化应用。它是一个开源系统，有助于创建和管理应用程序的容器化。\n\
  \n# 关键术语\n\n- **Microservices (微服务)**：微服务是一个隔离的、松耦合的开发单元，关注单一职责。\n- **DevOps**：为了让持续迭代和交付（CI/CD）更加无缝且易于实现，采用了\
  \ DevOps 的技术侧方法。\n- **Docker**：容器化工具提供了一种处理容器化应用的方法。\n- **Hypervisor (虚拟机监控器)**：用于在同一台服务器上运行多个操作系统，有助于减少运行多个操作系统所需的资源。\n\
  - **MySQL**：一种用于开发应用服务的数据库。\n- **WordPress**：一种用于应用服务的博客引擎。\n- **Nginx**：用于托管应用服务的\
  \ Web 服务器。\n- **Containers (容器)**：容器易于打包、轻量级且设计用于随处运行。\n- **Registries (注册表)**：该软件组件支持对服务、数据集和应用程序方案等资源的运行时发现和评估。\n\
  - **Docker images (Docker 镜像)**：作为容器的蓝图，Docker 容器是从 Docker 实例化的。\n- **Docker files\
  \ (Dockerfile)**：这些文本文件解释了如何创建镜像。\n- **Docker volumes (Docker 卷)**：Docker 中的卷是我们处理容器所使用的持久数据的方式。\n\
  - **Image registries (镜像注册表)**：注册表是存储所有镜像的地方或仓库。\n- **Container Orchestration (容器编排)**：容器编排系统解决了运行多台服务器的问题，通过在所有服务器上部署多个容器，以及我们如何伸缩这些服务器。\n\
  - **Service mesh (服务网格)**：服务网格是一种跨服务通信基础设施，意味着给定的微服务不会直接与其他微服务通信。所有服务与服务通信都将在一个名为服务网格的软件组件之上进行，该组件为韧性和服务发现等网络功能提供内置支持。\n\
