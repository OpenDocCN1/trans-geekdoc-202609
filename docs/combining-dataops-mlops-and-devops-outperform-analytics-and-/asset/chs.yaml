  \n## 安装 Docker 的过程\n\n这里描述了安装每个产品的过程。\n\n## Windows 支持 Docker\n\n下载安装程序后双击启动它，按照下面的步骤操作：\n\
  \n**步骤 1：**点击协议，然后点击 `Install` 按钮继续安装过程。\n\n![](img/Figure-2.6.jpg)\n\n**图 2.6：Docker\
  \ 设置——许可协议**\n\n**步骤 2：**完成后，点击 `Finish` 按钮完成安装。\n\n![](img/Figure-2.7.jpg)\n\n\
  **图 2.7：点击 finish 完成 Docker 设置**\n\n## Docker Toolbox 设置\n\n下载安装程序后双击启动它，然后按照这些步骤操作：\n\
  \n**步骤 1：**在启动屏幕上点击 `Next` 按钮。\n\n![](img/Figure-2.8.jpg)\n\n**图 2.8：Docker Toolbox\
  \ 设置向导**\n\n**步骤 2：**在下一个屏幕上保持默认位置并点击 `Next` 按钮。\n\n![](img/Figure-2.9.jpg)\n\n\
  **图 2.9：Docker 设置——选择目标位置**\n\n**步骤 3：**点击 `Next` 按钮继续保持默认组件。\n\n![](img/Figure-2.10.jpg)\n\
  \n**图 2.10：Docker 设置——选择组件**\n\n**步骤 4：**保持 `Additional Tasks` 原样点击 `Next` 按钮。\n\
  \n![](img/Figure-2.11.jpg)\n\n**图 2.11：Docker 设置——选择附加任务**\n\n**步骤 5：**在最后一个屏幕上点击\
  \ `Install` 按钮。\n\n![](img/Figure-2.12.jpg)\n\n**图 2.12：Docker 设置——toolbox 已就绪**\n\
  \n### 使用 Toolbox for Docker\n\n作为在 Windows 上使用 Docker 容器的第一步，我们将如何使用 toolbox for\
  \ Docker。在安装 toolbox for Docker 时，桌面上会该程序的快捷方式。\n\n![](img/Figure-2.13.jpg)\n\n\
  **图 2.13：Docker 快速启动终端**\n\n接下来，启动 toolbox for Docker 时你将看到配置完成。\n\n![](img/Figure-2.14.jpg)\n\
  \n**图 2.14：配置——toolbox for Docker**\n\n一旦启动，你将看到 Docker 配置并启动。你将看到 Docker 的交互式 shell\
  \ 程序：\n\n![](img/Figure-2.15.jpg)\n\n**图 2.15：Docker 配置并启动**\n\n为了下载并运行简单的 NamasteIndia\
  \ 容器以测试 Docker 是否正常运行，我们可以使用 `docker run` 命令。\n\n`docker run` 命令的工作如下：\n\n```bash\n\
  docker run\n```\n\n使用该命令在 Docker 容器中运行命令。\n\n### 语法\n\n```bash\ndocker run image\n\
  ```\n\n### 选项\n\n`image` —— 为了运行容器，这是使用的镜像名称。\n\n### 返回值\n\n在指定的容器中，输出将运行命令。\n\n\
  ### 示例\n\n```bash\nsudo docker run namaste-india\n```\n\n此命令将下载 `namaste-india`\
  \ 镜像（如果不存在）并将 `namaste-india` 作为容器运行。\n\n![](img/Figure-2.16.jpg)\n\n**图 2.16：运行\
  \ Sudo Docker run 命令的结果**\n\n如果你想在 Windows 上运行 Ubuntu 操作系统，可以使用命令下载 Ubuntu 镜像：\n\
  \n```bash\ndocker run -it ubuntu bash\n```\n\n你告诉 Docker 通过 `-it` 选项在交互模式下运行命令。\n\
  \n![](img/Figure-2.17.jpg)\n\n**图 2.17：运行命令 Docker run——在交互模式下运行 ubuntu bash**\n\
  \n在看到 Ubuntu 镜像下载并运行的输出后，你将以 root 用户身份登录 Ubuntu 容器。\n\n## Hub\n\nHub 允许你下载由其他社区构建的\
  \ Docker 镜像，它是云端注册服务。你使用 Docker 构建的自己的镜像也可以上传到 hub。在这里将看到如何使用 hub 中的 Jenkins Docker\
  \ 镜像以及如何下载它。\n\n[`www.docker.com/community-edition#/add\\_ons`](https://www.docker.com/community-edition#/add_ons)\
  \ 是 hub 的官方网站。\n\n**步骤 1：**首先需要在 hub 上进行简单的注册：\n\n![](img/Figure-2.18.jpg)\n\n**图\
  \ 2.18：Docker hub 注册**\n\n**步骤 2：**一旦完成注册，你将登录 hub。\n\n![](img/Figure-2.19.jpg)\n\
  \n**图 2.19：注册后已登录 hub**\n\n\n\n\n\n### 第 3 步：通过浏览查找 Jenkins 镜像：\n\n![](img/Figure-2.20.jpg)\n\
  \n**图 2.20:** 通过浏览查找 Jenkins 镜像\n\n### 第 4 步：如果你在同一页面向下滚动，可以看到 Docker 的 `pull` 命令。这将用于将\
  \ Jenkins 镜像下载到本地 Ubuntu 服务器。\n\n![](img/Figure-2.21.jpg)\n\n**图 2.21:** 将 Jenkins\
  \ 镜像下载到 Ubuntu 服务器\n\n### 第 5 步：现在进入 Ubuntu 服务器运行以下命令：\n\n```\nsudo docker pull\
  \ jenkins\n```\n\n![](img/Figure-2.22.jpg)\n\n**图 2.22:** 在 Ubuntu 服务器上运行 Sudo Docker\
  \ pull Jenkins 命令\n\n你需要运行以下命令来运行 Jenkins：\n\n```\nsudo docker run -p 8080:8080\
  \ -p 50000:50000 jenkins\n```\n\n对于上述 `sudo` 命令，请注意以下几点：\n\n* 为了确保其以 root 权限运行，我们使用了\
  \ `sudo` 命令。\n* 我们想要从 hub 下载并安装到 Ubuntu 上的镜像名称是 `Jenkins`。\n* `-p` 用于将内部 Docker\
  \ 镜像的端口号映射到我们的主 Ubuntu 服务器，以便访问容器。\n\n![](img/Figure-2.23.jpg)\n\n**图 2.23:** 在\
  \ Ubuntu 服务器上运行 Jenkins\n\nJenkins 将成功地作为容器在 Ubuntu 机器上运行。\n\n# 镜像 (Images)\n\n\
  Docker 中一切的基础都是镜像，它是文件系统及其参数的组合。以下命令作为 Docker 的示例：\n\n```\ndocker run namaste-india\n\
  ```\n\n* 通过 `docker` 命令向操作系统上的 Docker 程序具体告知需要执行的操作。\n* 使用 `run` 命令提到了我们要创建一个镜像的实例，该实例随后被称为**容器\
  \ (container)**。\n* 容器最终由 `namaste-india` 表示的镜像制成。\n\n现在，让我们看看如何使用 Docker Hub 提供的\
  \ CentOS 镜像在我们的 Ubuntu 机器上运行 CentOS。我们可以通过在 Ubuntu 机器上执行以下命令来实现：\n\n```\nsudo docker\
  \ run -it centos /bin/bash\n```\n\n关于上述 `sudo` 命令，请注意以下几点：\n\n* 为了确保其以 `root` 权限运行，我们使用了\
  \ `sudo` 命令。\n* 这里的镜像名称是 `CentOS`，我们想要从 hub 下载并安装到我们的 Ubuntu 机器上。\n* `-it` 表示我们想要以交互模式运行。\n\
  * 一旦 CentOS 启动运行，使用 `/bin/bash` 来运行 bash shell。\n\n## 显示镜像 (Displaying the images)\n\
  \n要查看系统上的 `docker images` 列表，执行以下命令：\n\n```\ndocker images\n```\n\n此命令用于显示系统当前安装的所有镜像。\n\
  \n**语法**\n\n```\ndocker images\n```\n\n**选项**\n\n无\n\n**返回值**\n\n输出中将提供系统上的镜像列表。\n\
  \n**示例**\n\n```\nsudo docker images\n```\n\n**输出**\n\n```\nsudo docker images\n\
  ```\n当我们运行前面的命令时，将产生以下结果：\n\n![](img/Figure-2.24.jpg)\n\n**图 2.24:** Sudo Docker\
  \ images 命令的输出\n\n从前面的输出中，你可以看到服务器上有三个镜像：`centos`、`centos` 和 `Jenkins`，每个镜像具有以下属性：\n\
  \n* **TAG**: 用于标记镜像。\n* **Image ID**: 用于唯一标识镜像。\n* **Created**: 自镜像创建以来经过的天数。\n\
  * **Virtual Size**: 镜像的大小。\n\n## 下载镜像 (Images downloading)\n\n使用 Docker 的 `run`\
  \ 命令可以从 hub 下载镜像。现在我们来查看如何操作。在 Docker 容器中运行命令使用以下语法：\n\n**语法**\n\n```\ndocker run\
  \ image\n```\n\n**选项**\n\n`Image`: 运行容器时使用的镜像名称。\n\n**返回值**\n\n输出将在指定的容器中运行。\n\n\
  **示例**\n\n```\nsudo docker run centos\n```\n\n如果镜像不存在，此命令将下载 `centos` 镜像并将操作系统作为容器运行。\n\
  \n**输出**\n\n```\nsudo docker run centos\n```\n当我们运行上一个命令时，将得到以下结果：\n\n![](img/Figure-2.25.jpg)\n\
  \n**图 2.25:** Sudo Docker run centos 命令的输出\n\n现在可以看到已下载的 `CentOS` 镜像。如果运行运行 `docker\
  \ images` 命令查看系统上的镜像列表，我们应该也能看到 `centos` 镜像。\n\n![](img/Figure-2.26.jpg)\n\n**图\
  \ 2.26:** 运行 Docker images—CentOS 镜像\n\n## 删除镜像 (Removal of images)\n\n要删除系统上的镜像，使用\
  \ `docker rmi` 命令。\n\n```\ndocker rmi\n```\n\n此命令用于在 Docker 中删除镜像。\n\n**语法**\n\n\
  ```\ndocker r ImageID\n```\n\n**选项**\n\n`ImageID`: 需要删除的镜像的 ID。\n\n**返回值**\n\n输出将提供被删除镜像的镜像\
  \ ID。\n\n**示例**\n\n```\nsudo docker rmi 7a86f8cb25\n```\n在这里，`7a86f8cb25` 是新 CentOS\
  \ 镜像的镜像 ID。\n\n**输出**\n\n```\nsudo docker rmi 7a86f8cb25\n```\n当我们运行前面的命令时，将产生以下结果：\n\
  \n![](img/Figure-2.27.jpg)\n\n**图 2.27:** sudo Docker rmi 7a86f8cb25 命令的输出\n\n更多关于镜像的\
  \ Docker 命令是：\n\n```\ndocker images -q\n```\n\n此命令用于仅返回镜像的 Image IDs。\n\n**语法**\n\
  \n```\ndocker images\n```\n\n**选项**\n\n`q`: 此 Docker 命令告知仅返回 Image IDs。\n\n**返回值**\n\
  \n作为输出，将仅显示 Docker 宿主机上镜像的 Image IDs。\n\n**示例**\n\n```\nsudo docker images -q\n\
  ```\n当我们运行前面的命令时，将产生以下结果：\n\n![](img/Figure-2.28.jpg)\n\n**图 2.28:** Sudo Docker\
  \ images -q 命令的输出\n\n## Docker inspect 命令 (The Docker inspect command)\n\n要查看镜像或容器的详情，使用此命令。\n\
  \n**语法**\n\n```\ndocker inspect Repository\n```\n\n**选项**\n\n`Repository`: 这是镜像的名称。\n\
  \n**返回值**\n\n将显示镜像的详细信息。\n\n**示例**\n\n```\nsudo inspect jenkins\n```\n\n当我们运行前面的命令时，将产生以下结果：\n\
  \n![](img/Figure-2.29.jpg)\n\n**图 2.29:** Sudo inspect Jenkins 的输出\n\n## Docker\
  \ 容器 (Containers)\n\nDocker 的基本目的是使用 `docker run` 命令运行容器，容器是镜像的实例。\n\n## 运行容器 (Running\
  \ a container)\n\n容器的运行由 `docker run` 命令管理。为了以交互模式运行，首先启动 Docker 容器。\n\n```\nsudo\
  \ Docker run -it centos /bin/bash\n```\n\n按下 `Ctrl` + `P` 时将返回你的 OS shell。\n\n![](img/Figure-2.30.jpg)\n\
  \n**图 2.30:** 按下 P 返回 OS shell\n\n你将在 Ubuntu 服务器上运行 CentOS 实例。\n\n## 容器列表 (Container\
  \ listing)\n\n要列出机器上所有的容器，使用 `docker ps` 命令。此命令将返回当前运行的容器。\n\n```\ndocker ps\n```\n\
  \n**语法**\n\n```\ndocker ps\n```\n\n**选项**\n\n无\n\n**返回值**\n\n输出将显示当前运行的容器。\n\n**示例**\n\
  \n```\nsudo docker ps\n```\n\n**输出**\n\n当我们运行前面的命令时，将产生以下结果：\n\n![](img/Figure-2.31.jpg)\n\
  \n**图 2.31:** Sudo ps 命令的输出\n\n`docker ps` 命令的变体有：\n\n```\ndocker ps -a\n```\n\n\
  此命令用于列出系统上所有的容器。\n\n**语法**\n\n```\ndocker ps -a\n```\n\n**选项**\n\n`-a`: 此 `docker\
  \ ps` 命令告知列出系统上所有的容器。\n\n**返回值**\n\n输出中将显示所有容器。\n\n**示例**\n\n```\nsudo docker ps\
  \ -a\n```\n\n## docker history 命令 (docker history command)\n\n通过此命令，你可以看到通过容器在镜像上运行的所有命令。\n\
  \n**语法**\n\n```\ndocker history ImageID\n```\n\n**选项**\n\n\n\n\n\n**ImageID**: 你可以查看针对该\
  \ `ImageID` 执行的所有命令。\n\n### 返回值\n针对该镜像运行的所有命令都将显示在输出中。\n\n### 示例\n```\nsudo docker\
  \ history centos\n```\n上述命令将显示针对 `centos` 镜像运行的所有命令。\n\n### 输出\n当我们运行上述命令时，将产生以下结果：\n\
  \n![](img/Figure-2.33.jpg)\n\n**图 2.33:** 命令 `sudo Docker history centos` 的输出\n\n\
  # 在 Docker 中操作容器\n\nDocker 是一种容器化工具，用于为软件应用程序提供包含其所需所有内容的文件系统。它确保了无论软件部署在何处，其的行为都是相同的，因为当你使用\
  \ Docker 容器时，其运行时环境是一致的。\n\n在这里，我们展示了如何在 Docker 中操作容器。\n\n```\ndocker top\n```\n\
  \n通过此命令，你可以看到容器内的顶层进程。\n\n### 语法\n```\ndocker top ContainerID\n```\n\n### 选项\n**ContainerID**——指定你想要查看顶层进程的容器\
  \ ID。\n\n### 返回值\n输出中将显示容器内的顶层进程。\n\n### 示例\n```\nsudo docker top 9f215ed0b0d3\n\
  ```\n通过此命令，将显示容器内的顶层进程。\n\n### 输出\n当我们运行上述命令时，将产生以下结果：\n\n![](img/Figure-2.34.jpg)\n\
  \n**图 2.34:** 命令 `Sudo Docker top 9f215ed0b0d3` 的输出\n\n### docker stop 命令\n此命令用于停止正在运行的容器。\n\
  \n### 语法\n```\ndocker stop ContainerID\n```\n\n### 选项\n**ContainerID**: 需要停止的容器\
  \ ID。\n\n### 返回值\n输出将提供停止的容器的 ID。\n\n### 示例\n```\nsudo docker stop 9f215ed0b0d3\n\
  ```\n上述命令将停止 Docker 容器 `9f215ed0b0d3`。\n\n### 输出\n当我们运行上一个命令时，将产生以下结果：\n\n![](img/Figure-2.35.jpg)\n\
  \n**图 2.35:** 命令 `Sudo Docker stop 9f215ed0b0d3` 的输出\n\n### docker rm 命令\n此命令用于删除容器。\n\
  \n### 语法\n```\ndocker rm ContainerID\n```\n\n### 选项\n**ContainerID**: 需要移除的容器 ID。\n\
  \n### 返回值\n输出中将提供被移除的容器的 ID。\n\n### 示例\n```\nsudo docker rm 9f215ed0b0d3\n```\n\
  上述命令将移除 Docker 容器 `9f215ed0b0d3`。\n\n### 输出\n当我们运行上一个命令时，将产生以下结果：\n\n![](img/Figure-2.36.jpg)\n\
  \n**图 2.36:** 命令 `sudo Docker rm 9f215ed0b0d3` 的输出\n\n### Docker stats 命令\n此命令用于提供运行容器的统计数据。\n\
  \n### 语法\n```\ndocker stats ContainerID\n```\n\n### 选项\n**ContainerID**: 需要提供统计数据的容器\
  \ ID。\n\n### 返回值\n作为输出，将显示容器的 CPU 和内存利用率。\n\n### 示例\n```\nsudo docker stats 9f215ed0b0d3\n\
  ```\n上述命令将提供容器 `9f215ed0b0d3` 的 CPU 和内存利用率。\n\n### 输出\n当我们运行上一个命令时，将产生以下结果：\n\n\
  ![](img/Figure-2.37.jpg)\n\n**图 2.37:** 命令 `sudo Docker stats 9f215ed0b0d3` 的输出\n\
  \n### Docker attach 命令\n此命令用于连接到正在运行的容器。\n\n### 语法\n```\ndocker attach ContainerID\n\
  ```\n\n### 选项\n**ContainerID**: 你需要连接的容器 ID。\n\n### 返回值\n无\n\n### 示例\n```\nsudo\
  \ docker attach 07b0b6f43fe\n```\n上述命令将连接到 Docker 容器 `07b0b6f43fe`。\n\n### 输出\n\
  当我们运行此命令时，将产生以下结果：\n\n![](img/Figure-2.38.jpg)\n\n**图 2.38:** 命令 `Sudo Docker attach\
  \ 07b0b6f43fe` 的输出\n\n一旦你连接到该 Docker 容器，就可以运行上述命令来查看该 Docker 容器中的进程利用率。\n\n![](img/Figure-2.39.jpg)\n\
  \n**图 2.39:** Docker 容器中的进程利用率\n\n### Docker pause 命令\n此命令用于暂停正在运行容器中的进程。\n\n###\
  \ 语法\n```\ndocker pause ContainerID\n```\n\n### 选项\n**ContainerID**: 你需要暂停进程的容器\
  \ ID。\n\n### 返回值\n已暂停容器的 `ContainerID`。\n\n### 示例\n```\nsudo docker pause 07b0b6f43fe\n\
  ```\n上述命令将暂停运行中容器 `07b0b6f43fe` 中的进程。\n\n### 输出\n当我们运行上一个命令时，将产生以下结果：\n\n![](img/Figure-2.40.jpg)\n\
  \n**图 2.40:** 命令 `Sudo Docker pause 07b0b6f43fe` 的输出\n\n### Docker unpause 命令\n\
  此命令用于恢复正在运行容器中的进程。\n\n### 语法\n```\ndocker unpause ContainerID\n```\n\n### 选项\n**ContainerID**——你需要恢复进程的容器\
  \ ID。\n\n### 返回值\n运行中容器的 `ContainerID`。\n\n### 示例\n```\nsudo docker unpause 07b0b6f43fe\n\
  ```\n在运行中容器 `07b0b6f43fe` 中，上述命令将恢复进程。\n\n### 输出\n当我们运行上一个命令时，将产生以下结果：\n\n![](img/Figure-2.41.jpg)\n\
  \n**图 2.41:** 命令 `sudo Docker unpause 07b0b6f43fe` 的输出\n\n### Docker kill 命令\n此命令用于杀死正在运行容器中的进程。\n\
  \n### 语法\n```\ndocker kill ContainerID\n```\n\n### 选项\n**ContainerID**——你需要杀死进程的容器\
  \ ID。\n\n### 返回值\n运行中容器的 `ContainerID`。\n\n### 示例\n```\nsudo docker kill 07b0b6f43fe\n\
  ```\n上述命令将杀死 Docker 容器 `07b0b6f43fe`。\n\n### 输出\n当我们运行上一个命令时，将产生以下结果：\n\n![](img/Figure-2.42.jpg)\n\
  \n**图 2.42:** 命令 `Sudo Docker kill 07b0b6f43fe` 的输出\n\n\n\n\n\n* 现在新一代 Docker 引擎已经出现，它用于运行操作系统，而以前是使用虚拟机作为\
  \ Docker 容器。\n* 现在所有应用程序都作为 Docker 容器运行。\n\n这种架构的明显优势在于，你不需要为客户操作系统准备额外的硬件。一切都以\
  \ Docker 容器的方式运行。\n\n# 结论\n\n关于 Docker 的这一章节为你使用容器开发和部署软件奠定了良好的基础。Docker 是一个用于构建、交付和运行应用的免费开源平台。随后，我们讨论了容器标准和行业领导者——`Rancher`、`Swarm`\
  \ 和 `Container AWS`。标准、轻量和安全是运行在引擎上的 Docker 容器。Docker 客户端是终端用户交互的界面。是 Docker 用户界面实际上运行诸如构建、执行和分发提供给客户端的容器的任务。文件包含了创建\
  \ Docker 镜像的指令，这些指令是你根据文件中的一组指令创建的只读模板。Docker 中的容器将应用程序的软件封装在一个不可见的盒子里，包含了程序运行所需的所有内容。接下来我们将讨论\
  \ Docker 的优处。\n\n学习如何在 Linux/Windows 上安装 Docker  own 如何使用 Docker Toolbox。\n\n接下来，我们将介绍\
  \ `hub`，这是一个云注册表服务，允许你获取其他社区创建的 Docker 镜像。镜像由文件系统和一组参数组成。\n\nDocker 的主要目的是运行容器。容器是可以使用\
  \ `docker run` 命令运行的 Docker 镜像实例。\n\n本文讨论了 Docker 中的容器生命周期及其架构。\n\n你在这一章中获得的技能和知识让你成为一名\
  \ Docker 专家，让你能够自信地在学术活动以及作为开发者、IT 专业人员或系统管理员的职业生活中中使用 Docker。\n\n接下来的章节关于 DevOps，旨在建立一种规模化的协作、亲和力和工具化文化。\n\
  \n# 核心术语\n\n* `Docker`: 一个用于应用程序开发、测试和分发的开放平台。\n* `Rancher`: 这种 Docker 容器管理平台包含了许多模块化的基础设施服务，如网络、负载均衡、服务发现、监控和恢复。\n\
  * `Swarm`: 用于在 Docker 中进行容器聚类和调度的工具。\n* `Container AWS`: 一种高可扩展和高性能的容器编排服务，支持 Docker\
  \ 中的容器。\n* `Habitus`: 一个用于 Docker 的独立构建流工具。\n* `Engine`: 这是一个轻量级的运行时和工具，在 Docker\
  \ 运行的层上管理容器、镜像、构建等。\n* `Client`: 它是 Docker 的用户界面，你作为 Docker 终端用户与之通信。\n* `Daemon`:\
  \ 执行提供给 Docker 客户端的命令，例如构建、操作和分发容器。\n* `File`: 这是你编写创建 Docker 镜像指令的地方。\n* `Image`:\
  \ 它们是你根据 `Dockerfile` 中的一组指令创建的只读模板。镜像指定了你打包应用程序及其依赖项的外观，以及启动时将运行的过程。\n* `Union\
  \ file system`: 一可堆叠的文件系统允许来自多个文件系统（分支）的文件和目录透明地分层，形成单一文件系统。Docker 使用 `UFS` 创建镜像。\n\
  * `Containers`: 将程序的软件封装在一个不可见的盒子里，其中包含运行所需的所有内容，如操作系统、应用程序代码、运行时、系统工具和系统库。\n* `API\
  \ in Docker`: 用于与 Docker 守护进程交互以及 Go 和 Python 的 SDK。\n* `Control groups`: 一种 Linux\
  \ 内核特性，用于隔离、优先排序和统计一组进程的资源使用情况。\n* `DevOps`: 一种在部署阶段用于应用程序容器化的工具，以便应用程序能够在不同的环境中高效工作。\n\
  * `Hub`: 一种云注册表服务，允许你链接到代码仓库、生成和测试你的镜像、存储手动推送的镜像，并连接到 Docker 云将镜像部署到你的主机上。\n* `Container\
  \ lifecycle`: 创建—运行—杀死—暂停—停止—运行 状态\n* `Architecture`: 应用—Docker 引擎—宿主机 OS—服务器\n\n\
  # 问题\n\n这里既有直接在浏览器中的实操教程，也有关于在你自己的环境中设置和使用 Docker 的指令，还有关于开发和部署自己的应用程序的最佳实践的资源。\n\
  \n1. IT 专业人员和系统管理员应该从这里开始：\n   了解 Docker、它的工作原理以及它如何帮助你部署安全、可扩展的应用程序并在过程中节省费用。\n\
  \   * 学习 Docker 的概念以及它能为你的运营团队做什么，并帮助你理解 Docker 的核心价值主张。\n     你应该学习的主题应该包括：\n \
  \    * Docker 基础\n     * 部署多服务应用程序\n   * 这将帮助你学习更多 Docker 的一些高级主题。你应该学习的主题包括：\n\
  \     * 安全\n     * 网络\n     * 编排\n   * 这将为你提供部署生产应用程序的资源、制定将 Docker 集成到生产环境的策略，并因实施\
  \ Docker 在你的组织获得认可。你应该学习的主题包括：\n     * 参考实现\n     * 可移植性\n     * 存储\n     * 生产环境反模式\n\
  \n2. 软件开发者可以从这里开始：\n   学习 Docker 的概念以及它如何让构建应用更快、更容易、更安全。\n   * 这将让你对基础有所了解。你应该学习的主题是：\n\
  \     * 熟悉 Docker 概念\n     * 展示如何构建和部署多服务应用程序\n   * 展示如何将 Docker 整合到整个开发工作流。你应该学习的主题是：\n\
  \     * 使用各种 IDE 使用 Docker\n     * 开始 Windows 容器\n     * 准备你的工作流\n   * 在这里，学习旨在为生产环境准备的高级主题。你应该学习的主题包括：\n\
  \     * 将应用程序部署到测试环境\n     * 使用 Docker Swarm 模式管理你的测试环境\n     * 学习如何构建安全的应用程序\n\n\
  \n\n\n这是一种敏捷软件开发方法，其工具和流程帮助开发人员和运维团队以速度、质量和控制来构建、部署和监控应用程序。为了消除手动步骤、减少错误、增加团队敏捷性并将规模扩大到小型孤立团队之外，它是一套\
  \ DevOps 实施所依赖的集成解决方案。\n\nDevOps 流程提供了一种文化，允许软件通过生产环境实现快速、高效且可靠的交付。它的实践导致了高生产力、少量、更好的沟通、更高的质量、更快的解决速度、更高的可靠性以及更好且及时的软件交付。DevOps\
  \ 流程包括持续集成、持续测试、持续交付、持续部署、持续监控和持续业务规划。\n\n学习 DevOps 的前提是理解容器及其工具和技术、编程语言、自动化工具、网络和计算机科学知识、测试、协作与沟通技巧、逻辑态度以及对所执行工作的热情。\n\
  \n# 结构\n\n在本章中，我们将讨论以下主题：\n\n* DevOps 基础知识\n* 介绍 DevOps\n* 开发与运维、敏捷与 DevOps、瀑布模型\n\
  * DevOps 工具\n* DevOps 周期\n* DevOps 原则\n* DevOps 工程师的角色、职责和技能\n* DevOps 方法论演变\n*\
  \ 理解 DevOps——关键\n* DevOps 工程师的职位\n* DevOps 未来前景\n* DevSecOps\n* 数据库 DevOps\n\n#\
  \ 目标\n\n本章介绍了一种软件开发策略 DevOps，它解释了什么是 DevOps 以及它提供的益处。为了在软件开发的不同阶段实现自动化，可用的 DevOps\
  \ 工具有 `Puppet`、`Jenkins`、`GIT`、`Chef`、`Docker`、`Kubernetes`、`Selenium`、`Ansible`、`Nagios`\
  \ 和 `AWS`。进一步解释了开发与运维流程的集成，这是 DevOps 的周期，从开发、测试、集成、部署、监控开始，并在接收反馈或需求后再次回到开发。列出了\
  \ DevOps 原则，即以客户为中心的行为、持续改进、监控和测试一切以及端到端的责任。文中解释了 DevOps 工程师的角色、职责和技能，以及什么是 DevOps\
  \ 工程师。还提供了响应业务需求所需的 DevOps 方法论演变的知识，以及理解 DevOps 的关键。此外，将了解到 DevSecOps 涉及创建一种“代码即安全”文化，并在发布工程师与安全团队之间进行持续灵活的协作。DevSecOps\
  \ 专注于在敏捷框架内为复杂的软件开发过程创建新的解决方案。DevSecOps 解决了速度、风险、安全意识和软件质量方面的问题。接下来将讨论 DevOps 的未来前景。进一步描述了数据库\
  \ DevOps，它将 DevOps 的基本原理应用于确保数据库代码与开发代码处于相同的流程中。\n\n# DevOps 基础知识\n\n提出了几种软件开发方法论——瀑布式、增量式、迭代式、敏捷式、Scrum\
  \ 和 DevOps。\n\nDevOps 是一种软件开发和运维管理方法，试图将敏捷思维引入企业应用生命周期的各个方面，它是 Development（开发）+\
  \ Operations（运维）的缩写。DevOps 的目标让软件开发和运维团队能够在一起轻松地执行任务。\n\n通过团队的共同共同位置和混合来确保项目的成功，并为软件开发和维护活动注入活力。它的目标是创建一个专家混合，使得团队中的任何人都能根据项目需要承担任何角色。根据需要，开发人员可能担任系统管理员，而系统管理员也可以编写代码。这就是为什么\
  \ DevOps 提倡团队多才化，使企业应用程序的所有权归整个团队所有，而不是每个团队都采取孤立视角。此外，通过这种责任的交换，团队能够理解参与开发和维护应用程序的其他团队所做的工作。\n\
  \n在收入、上市时间和获取新客户等等关键业务指标方面，DevOps 的优势是多方面的。\n\n## 采用 DevOps——驱动因素\n\n采用 DevOps 的驱动因素如下：\n\
  \n* 团队之间的协作。\n* 跨不同平台的同步部署。\n* 上市时间。\n* 改善终端客户体验。\n* 开发和部署云应用程序。\n* 混合基础架构。\n\n\
  在采用 DevOps 的过程中，需要解决的 `areas`如下：\n\nDevOps 仅仅是将开发团队和运维团队放在一起的结果，也不会提供任何收益。在软件开发、部署和维护方式的几乎每一个方面都需要改变。\n\
  \nDevOps 是文化、沟通、变革和工具的结合，如图图 3.1*所示：\n\n![](img/Figure-3.1.jpg)\n\n**图 3.1:** DevOps——文化、沟通、变革和工具\n\
  \n能够使用工具和预定义的/良好的配置来建立/部署环境，即基础设施。\n\n* `code` 应该在仓库中进行版本控制，并根据每次提交进行更新。\n* `testing`\
  \ 应该通过每晚/每周的构建测试实现自动化。\n* `change management` 应该是自动的，将发布的更改从开发推送到质量保证环境进行测试，并从质量保证环境推送到生产环境上线。\n\
  * `tools`（即通用工具）应该在所有团队中使用并部署。\n\n## DevOps 的益处\n\nDevOps 的收益如下：\n\n* 软件/服务的部署频率增加\n\
  * 组织内部部门之间的协作增加，具有频繁的反馈循环\n* 改进反馈\n* 持续交付\n* 减少了在开发和运维上的花费\n* 提高了应用程序部署的质量\n* 缩短了软件/服务的上市时间\n\
  * 在更多平台上提供了可用软件/服务\n* 增加了收入\n* 通过版本控制和自动化，更好地管理软件资产\n\n\n\n\n为了实现这些收益而采用的实践是频繁地进行小规模更新。这是组织为客户进行快速创新的方式。频繁但小小的更新降低了每次部署的风险。它们帮助团队更快地解决错误，因为团队可以识别导致错误的最后一次部署。组织还使用微服务架构来使应用程序更具活性，并实现更快的创新。微服务架构将大型、复杂的系统解耦为简单、独立的项目。应用程序被拆分为许多单独的组件（服务），每个服务都仅限于单一目的或功能，并独立于其同级服务以及整个应用程序进行运行。这种架构减少了更新应用程序的协调开销，当每个服务与一个负责该服务的小型敏捷团队配对时，组织可以移动得更快。然而，微服务与发布频率增加的结合导致部署次数大幅增多，这可能会带来运营挑战。因此，如持续集成和持续交付等\
  \ DevOps 实践解决了这些问题，让组织能够以安全、可靠的方式快速交付。基础设施自动化实践（如基础设施即代码和配置管理）有助于保持计算资源的弹性，并对频繁的变化做出响应。此外，监控和日志的使用有助于工程师跟踪应用程序和基础设施的性能，以便他们能够对问题做出快速反应。这些实践共同帮助组织为客户交付更快、更可靠的更新。\n\
  \n除了经过周全的`应用程序生命周期管理 (ALM)`策略外，执行层对变化的承诺至关重要。\n\n多技能团队对企业来说是一个明显的优势，有助于培养相关团队之间的同理心和欣赏，并在减少它们之间的摩擦方面大有用。\n\
  \nDevOps 方法论对于那些开发软件并为同一项目（及客户）提供运营支持的全球 IT 服务提供商是有益的。采用 DevOps 将允许他们在团队之间建立更好的协同效应。\n\
  \nDevOps 哲学使开发人员和运营团队能够工作，加速从开发到部署的进程。通过采用 DevOps，企业创建了持续软件交付的能力，使组织能够抓住市场机会，更快速地响应客户反馈，并平衡每次应用程序发布或部署的速度、成本、质量和风险因素。拥有\
  \ DevOps 的组织可以交付差异化且具有参与感的客户体验，实现更短的价值时间，并获得增强的创新。\n\n## 引入 DevOps\n\n涉及 DevOps\
  \ 的软件开发策略是在整个开发生命周期内对软件进行持续开发/测试/集成/监控。\n\n使用 DevOps 提高了组织交付最高质量应用程序和服务的速度。\n\n\
  *图 3.2* 显示了开发（Dev）与运维（Ops）之间的关系，公式为 `Agile Dev + IT Ops = DevOps`，涉及双方的通信、协作、集成和自动化。\n\
  \n![](img/Figure-3.2.jpg)\n\n**图 3.2：** Agile Dev + IT Ops = DevOps\n\n运维团队在代码测试后参与。运维团队负责应用程序代码的部署，测试由测试团队完成。在\
  \ DevOps 工具和流程的帮助下，开发与部署之间的时间间隔缩短，以提高反馈反馈循环。\n\n开发团队的工作包括开发应用程序并将应用程序代码传递给运营团队。\n\
  \n运营团队的工作包括测试代码，并在发现错误或其他情况下向开发团队提供反馈。\n\n为了提高协作和生产力，DevOps 将开发和运维团队整合。\n\n![](img/Figure-3.3.jpg)\n\
  \n**图 3.3：** （敏捷）开发方法——IT 服务管理\n\nDevOps 是一种软件开发方法，能够实现产品或服务的快速演进并降低风险，提高整个组合的质量，降低成本并强调软件开发人员与运维人员之间的通信、协作和集成。\n\
  \nDevOps 集成的目标是产品交付、质量测试、功能开发和维护发布，以提高可靠性和安全性，并加快开发和部署周期。\n\n驱动采用 DevOps 的因素是开发流程和其他方法论，包括敏捷方法的使用、应用和业务相关者对内部和外部提供者增加发布速率的需求、虚拟化和云基础设施的广泛可用、数据中心自动化以及配置管理。\n\
  \n# 开发与运维、敏捷与 DevOps 以及瀑布模型\n\nDevOps 作为一种软件开发策略，弥合了开发人员与负责部署的团队之间的差距，组织借此快速发布功能并将收到的反馈快速纳入应用程序。\n\
  \n一些额外的收益如下：\n\n* 减少生产环境中的故障/错误\n* 修复所需的时间缩短\n* 开发自动化 CI/CD 流水线涉及大量的开发、测试和部署技术。\n\
  \nDevOps 生命周期包括持续开发/测试/集成/部署以及持续监控的阶段。\n\nFacebook 等其他公司选择 DevOps 作为其业务目标的道路，是因为这些活动仅在\
  \ DevOps 中可行，而在敏捷或瀑布模型中不可。\n\n在更短的开发周期内开发高质量软件以获得更大的客户满意度是 DevOps 的偏好方法。\n\n## 开发\
  \ (Dev) 与运维 (Ops)\n\n为了理解代码更改的影响，开发人员与运维合作创建更接近生产的系统，专注于运维团队所需的指标。\n\n由于有了即时反馈，运维团队对基础设施需求有了更清晰的认识，增加了部署自动化，并密切监控每次部署的开发-测试-生产流水线，从而实现更好的协作和通信。\n\
  \n# 敏捷开发解决了客户需求与开发+测试团队之间的差距，使跨功能团队能够设计、开发和测试由客户优先排序的功能/故事，通过自动化发布管理增强了重用性和自动化。\n\
  \n![](img/Figure-3.4.jpg)\n\n**图 3.4：** 敏捷—DevOps\n\n# 使用瀑布模型进行软件开发\n\n使用瀑布模型的软件开发方法是一种线性的、顺序的方法，它将软件开发过程分为不同的阶段，每个阶段都旨在执行特定的任务。\n\
  \n只有在上一个阶段完成后，应用程序才会进入下一个阶段，如果我们已经进入了下一个阶段，则无法回到上一个阶段。\n\n在这种方法中，涉及的各个阶段如下：\n\n\
  1. 需求分析\n2. 系统设计\n3. 系统实现\n4. 系统测试\n5. 系统部署\n\n\n\n\n## 6. 维护系统\n\n在传统方式中，让我们考虑使用瀑布模型进行软件开发，其阶段如下：\n\
  \n* 在阶段 1 中，通过从用户处收集完整需求来制定`系统需求规范` (`SRS`)\n* 在阶段 2 中，使用 `SRS` 对后续阶段进行系统设计和规划\n\
  * 在阶段 3 中，进行系统的实现\n* 在阶段 4 中，通过测试来确保系统的质量\n* 在阶段 5 中，部署系统以供最终用户使用\n* 在阶段 6 中，对系统进行定期维护\n\
  \n# 瀑布模型面临的挑战\n\n过去许多年里，瀑布模型运行良好并为软件开发提供了很好的服务；然而，它也面临着一些挑战。下图显示了瀑布模型面临的挑战：\n\n\
  ![](img/Figure-3.5.jpg)\n\n**图 3.5:** 瀑布模型的挑战\n\n从开发者的角度来看两个主要的挑战是：\n\n1. 开发后的代码部署时间非常长\n\
  2. 开发和部署时间成本高，这就是处理旧代码、待处理代码和新代码时压力巨大的原因\n\n运维团队也不完全满意，根据之前的说明，他们面临的挑战是：\n\n1. 在生产环境中维持接近\
  \ 100% 的运行时间是困难的。\n2. 用于基础设施自动化的工具并不有效。\n3. 随着需要监控的服务器数量增加，复杂性也随之增加。\n4. 对产品提供反馈和诊断问题非常困难。\n\
  \n# 改进瀑布模型的解决方案\n\n下图强调了这些问题，并针对开发者和运维团队面临的问题提出了可能的解决方案，为理想的软件开发策略制定了指南。\n\n**从开发者的角度来看：**\n\
  \n* 系统应该能够部署代码，无需任何延迟或等待时间。\n* 开发冲刺应该是短且计划良好的，在系统中工作直接在当前代码上进行。\n\n**从运维团队的角度来看：**\n\
  \n* 系统至少应具有 99% 的运行时间。\n* 为了方便管理，应该配备工具和系统。\n* 应该有一个有效的监控和反馈系统。\n* 开发者和运维团队的共同需求是更好的协作与沟通。\n\
  \n![](img/Figure-3.6.jpg)\n\n**图 3.6:** 改进瀑布模型的解决方案\n\n**DevOps 如何解决软件开发中的挑战？**\n\
  \n| **开发挑战** | **DevOps 解决方案** |\n| --- | --- |\n| 代码部署涉及的等待时间 | 通过持续集成确保代码的快速部署、更快的测试和快速反馈机制。部署代码时没有等待时间。开发者的重点是构建当前代码\
  \ |\n| 处理旧代码、待处理代码和新代码的压力 | |\n\n**表 3.1:** DevOps 解决的开发挑战\n\n**DevOps 如何解决运维（Ops）的挑战？**\n\
  \n| **运维挑战** | **DevOps 解决方案** |\n| --- | --- |\n| 生产环境的运行时间难以维护 | 通过容器化/虚拟化确保了一个模拟环境，该环境通过容器形式运行软件，为服务的运行时间提供了极高的可靠性\
  \ |\n| 用于自动化基础设施管理的工具无效 | 有助于组织和执行配置计划、一致地配置系统并主动管理其基础设施配置管理有所帮助 |\n| 监控的服务器数量增加\
  \ | 持续监控 |\n| 对产品进行诊断和提供反馈很困难 | 通过 `Nagios` 建立有效的监控和反馈系统，确保有效的管理 |\n\n**表 3.2:**\
  \ DevOps 解决的运维挑战\n\n# DevOps 工具\n\n用于在各个阶段实现自动化的 DevOps 工具包括 `Puppet`、`Jenkins`、`GIT`、`Chef`、`Docker`、`Selenium`\
  \ 和 `AWS`，这些工具有助于实现持续开发、持续集成、持续测试、持续部署、持续监控，从而加速并实现 DevOps 流程，同时从文化上接受以极快的速度向客户交付高质量软件。\n\
  \n* `Git` 和 `GitHub` 源码管理版本控制系统\n* `Jenkins` 提供了用于构建 CI/CD 流水线的服务器自动化插件\n* `Selenium`\
  \ 实现了自动化测试\n* `Docker` 是容器化平台\n* `Kubernetes` 是编排工具\n* `Puppet` 实现了配置管理和部署\n* `Chef`\
  \ 实现了配置管理和部署\n* `Ansible` 实现了配置管理\n* `Nagios` 是监控工具\n\nDevOps 将这些工具分为以下各个阶段：\n\n\
  * `Eclipse`、`Jira`、`Git` 和 `Subversion` 用于代码开发\n* `Maven`、`Gradle` 和 `Ant` 用于代码构建\n\
  * `Puppet`、`Chef`、`Ansible` 和 `Ranc` 用于配置管理\n* `Selenium` 和 `JUnit` 用于测试\n* `Jenkins`、`Maven`\
  \ 和 `Ant` 用于测试\n* `Bamboo`、`Jenkins` 和 `Hudson` 用于发布\n* `Capistrano`、`SaltStack`、`Ansible`、`Chef`、`Docker`\
  \ 和 `Vacrant` 用于应用部署\n* `ActiveMQ`、`RabbitMQ`、`Memcache` 实现队列、缓存等\n* `New Relic`、`Nagios`、`Graphite`、`Ganglia`、`Cacti`、`PagerDuty`、`Splunk`\
  \ 和 `Sensu` 用于监控、告警和趋势分析\n* `PaperTrail`、`Logstash`、`Loggly` 和 `Splunk` 实现日志\n*\
  \ `Monit`、`Runit`、`Supervisor` 和 `God` 是进程管理器\n* `Snorby Threat Stack`、`Tripwire`\
  \ 和 `Snort` 用于安全\n* `Multihost SSH Wrapper` 和 `Code Climate` 是杂项工具\n\n# DevOps 生命周期\n\
  \n开发与运维流程的集成就是 DevOps，其实施生命周期需要理解：\n\nDevOps 生命周期包括以下阶段或步骤：\n\n1. 开发是生命周期的第一阶段，软件开发在此进行，并将整个开发过程划分为较小的开发周期。\n\
  2. 团队使用工具识别并修复代码中的 Bug，用于代码测试和质量保证（QA）。\n3. 在集成阶段，将新功能集成到当前代码中。只有通过持续集成和测试，持续开发才是可能的。\n\
  4. 在部署阶段，进行持续部署，其执行方式不应因代码的更改而影响高流量网站的功能。\n5. 监控阶段是运维团队负责处理运行不当的系统并发现生产环境中出现的 Bug，这是\
  \ DevOps 生命周期的最后一个阶段。\n\n以下是 DevOps 生命周期细划分的 DevOps 阶段：\n\n* 持续开发\n* 持续集成\n* 持续测试\n\
  * 持续部署\n* 持续监控\n\n这些阶段是实现整体 DevOps 的构建模块。\n\n\n\n\n\n- 在 DevOps 生命周期的这一阶段，软件处于持续开发状态。\n\
  - 增加开发频率以形成持续的反馈循环。\n- 软件被拆分为多个短开发周期的冲刺（sprints），软件交付物可以在很短时间内完成开发和交付。\n- 在此阶段，涉及编码和构建阶段，使用\
  \ `Git` 和 `SVN` 等工具维护不同版本的代码，并使用 `Ant`、`Maven` 和 `Gradle` 等工具将代码构建/打包成可执行文件，转发给\
  \ QA（测试人员）进行测试。\n\n# 持续测试\n\n- 在这里，对开发的软件进行持续的 Bug 测试。\n- 为了进行持续测试，使用 `Selenium`、`TestNG`\
  \ 和 `JUnit` 等工具进行自动化测试。\n- 为了确保软件功能没有缺陷，使用这些工具允许 QA 能够并行地彻底测试多个代码库。\n- 该阶段的首选方案是使用\
  \ `Docker Containers` 来即时模拟“测试环境”。\n- 一旦代码通过测试，就会与现有代码进行持续集成。\n\n## 持续集成\n\n- 在此阶段，将支持新功能的代码集成到现有代码中。\n\
  - 为了向最终用户反映变化，软件需要持续开发，更新后的代码需要持续集成到系统中。\n- 在运行时环境中，确保更改后的代码没有错误，以便我们测试这些更改并检查它们对其他变化的反应。\n\
  - `Jenkins` 是一个广泛用于持续集成的工具，通过它可以从 `GIT` 仓库拉取最新的代码版本，并生成最终可以部署到测试或生产服务器的构建版本。只要 `GIT`\
  \ 仓库发生变化，就可以设置自动触发新构建，也可以通过点击按钮手动触发。\n\n将来自多个开发者/贡献者的代码更改合并到单个/同一个软件项目中的实践被称为持续集成。这允许开发者频繁地将代码更改合并到中央仓库，然后在仓库中运行构建和测试。自动化工具被用于在集成之前断言新代码的正确性。\n\
  \n源代码版本控制系统是 `CI` 过程的核心，它还辅以其他检查，如自动化代码质量测试、语法风格审查工具等。\n\n持续集成的背后的概念如下：\n\n1. 对于你代码库的关键部分，从编写测试开始\n\
  2. 为了在每次推送到主仓库时自动运行这些测试，请获取一个 `CI` 服务\n3. 确保你的团队每天集成他们的更改\n4. 一旦构建失败，立即修复\n5. 对于你实现的每一个新故事（需求），都编写测试\n\
  \n`CI` 的一个关键部分是自动化你的测试，而尽早集成代码库通常也是必重要的。无论你是使用主干开发（trunk-based development）还是功能分支，开发者尽快将他们的更改集成到主仓库都是非常重要的。如果你让代码在分支或开发者工作站上停留太久，当你决定将其合并回主分支时，你将面临冲突过多难以处理的风险。\n\
  \n通过尽早集成，你减少了更改的范围，这使得出现冲突时更容易理解。让开发者更容易共享知识是另一个优势，因为他们将获得更易理解的更改。\n\n如果你发现自己正在进行某些可能影响现有功能的更改，可以使用特性标志（feature\
  \ flags）在工作完成之前关闭生产环境中的更改。\n\n如果开发者破坏了主分支的构建，修复它将成为首要任务。在构建处于故障状态时，更改越多，你就越难理解是什么导致了故障，而且你还面临引入更多故障的风险。\n\
  \n为了确保能够快速失败并尽快向推送更改的开发者提供反馈，在测试套件上花费时间是值得的。\n\n为了确保在构建失败时能提醒开发者，不要忘记设置通知，你还可以更进一步，在所有人都能看到的仪表板上显示你主分支的状态。\n\
  \n## 持续部署\n\n- 为了确保代码正确部署在所有服务器上，这是将代码部署到生产环境的阶段。如果增加了新功能或引入了新特性，应该准备好迎接更大的网站流量。此时，系统管理员也负责扩展服务器以托管更多用户。\n\
  - 配置管理工具在快速频繁地执行任务方面发挥着重要作用，因为新代码是持续部署的。在此阶段，常用的工具有 `Puppet`、`Chef`、`SaltStack`\
  \ 和 `Ansible`。\n- 容器化工具在部署阶段也发挥着重要作用，`Docker` 和 `Vagrant` 是帮助在开发、测试、阶段和生产环境之间保持一致性的流行工具，有助于扩展和缩小实例。\n\
  \n## 持续监控\n\n- 通过监控性能来提高软件质量是 DevOps 生命周期中一个至关重要的阶段。\n- 通过运营团队的参与和投入，监控用户活动或系统的任何异常行为。\n\
  - 为了持续监控应用性能并突出问题，使用了专门的监控工具。一些额外的监控栈工具包括 `Prometheus`、`Grafana` 和 `alert manager`。我们可以监控的指标有\
  \ `CPU`、`memory`、`disk space`、`network` 等。\n- 常用的工具有 `Splunk`、`ELK Stack`、`Nagios`、`NewRelic`\
  \ 和 `Sensu`。\n- 这些工具帮助密切监控应用程序和服务器，并主动检查系统健康。\n- 减少 IT 支持成本还可以提高效率并增加系统的可靠性。\n-\
  \ 在持续开发阶段，可以修复发现的问题并报告给开发团队。\n\n持续集成、部署和交付是软件发布流水线的三个阶段。这三个阶段将软件从创意交付到最终用户。集成阶段是流程的第一步，涵盖了多个开发者尝试将其代码更改合并到项目主仓库的过程。\n\
  \n交付阶段负责将制品物打包并交付给最终用户。该阶段运行自动化构建工具来生成制品物。\n\n持续部署是负责自动发布和分发制品物到最终用户的最后一个阶段。在部署时，制品物已成功通过了集成和交付阶段。\n\
  \n\n\n\n\n运维团队在 DevOps 中持续监控产品中的一切情况，一旦发现任何漏洞，就会产品发送给开发人员进行更改。\n\nDevOps 团队需要提供性能支持，直到产品生命周期结束，提升责任水平和产品质量是其端到端的职责。\n\
  \nDevOps 不是一种方法论或框架，而是一套打破孤岛的原则。\n\nDevOps 关乎文化、自动化、测量和共享（CAMS）：\n\n## 文化\n在文化中，人和流程是第一位的。如果你没有正确的文化，所有的自动化尝试都将是徒劳的。在文化中，关系至关重要，其功能包括：早期参与、频繁参与、消除孤岛、开放选择以及停止相互指责。\n\
  \n文化的其他属性还有：与同事沟通、让每个人参与核心流程和决策、提问、从不说不，以及每日站会（邀请所有人参加）。\n\n## DevOps 文化\n根据 DevOps\
  \ 文化，一个由开发人员、系统管理员、QA 和测试人员组成的单一工程师小组转变为 DevOps 工程师。他们对应用程序（软件）承担端到端的责任，从收集需求到开发、测试、基础设施部署、应用部署，最后到监控和收集终端用户的反馈，然后再次实施更改。\n\
  \n## DevOps 自动化\n发布管理、置备、配置管理、系统集成、监控与控制以及编排工具是 DevOps 的重要组成。\n\n采用自动化的原因是：人工过程容易、、机器擅长重复相同的任务、状态一致且已知、快速高效并节省了大量时间。\n\
  \n构建、部署、测试、监控、自愈、系统发布和系统配置都可以实现自动化。\n\n通过基础设施自动化，产品可以在反馈循环中持续部署；同样，通过 DevOps 生命周期还可以执行配置管理、部署自动化、基础设施监控、日志管理、应用和性能管理。\n\
  \n## 测量与共享\n### 测量（指标）\n无法衡量，就无法改进。成功的 DevOps 实现将尽可能且尽可能频繁地测量一切内容：性能指标、流程指标，甚至是人员指标。\n\
  \n捕获、学习和改进有助于：容量规划、趋势分析、故障查找，以及简单的保存 `Tomcat` 访问信息并随时间推绘制成图表。\n\n### 共享\n在 CAMS\
  \ 循环中，知识共享是回环。创建一个让人们分享想法和问题的文化至关重要。公开想法可以产生极好的开放反馈，最终有助于：改进、共享想法、共享指标以及运维：给开发人员提供\
  \ shell 权限，开发人员：查看可以利用哪些技术。\n\n## 持续集成与持续部署流程\n为了随时能够轻松且自信地部署到生产环境，`CI` 的扩展是持续交付，其中软件交付过程被进一步自动化，核心依赖于部署流水线，团队通过该流水线自动化测试和部署过程。\n\
  \n## DevOps 持续改进与持续交付\n持续集成和持续交付（`CI`/`CD`）是成功 `DevOps` 的支柱，公司通过建立和优化 `CI`/`CD`\
  \ 开发模型以及有效的流水线来自动化构建、集成和测试过程，从中获益。\n\n沟通在建立团队理解彼此工作方面起着作用。\n\n## DevOps 工程师的角色、职责和技能\n\
  软件应用程序平台的生产和维护责任属于 DevOps 工程师。\n\nDevOps 工程师——角色、职责和技能\n* 应该具备跨平台和应用领域的系统故障排除和问题解决的能力。\n\
  * 通过开放、基于平台，能够有效地管理项目。\n* 他应该能够增加项目的可见性。\n* 他应该能够提高质量并降低开发成本。\n* 分析、设计和评估自动化脚本及系统的能力。\n\
  * 通过使用最好的云安全解决方案，他应该确保系统问题的关键解决。\n* 他应该具备使用自动化工具的丰富经验。\n* 他应该具备 `bash` shell 编程的经验、强大的命令行能力，以及至少一种\
  \ `Perl`、`Python`、`Ruby` 等的经验。\n* 他应该熟悉 `Apache`、`Nginx` 和 `Redis` 等服务器端技术。\n\n\
  ## DevOps 方法论的演进\n多年来，响应业务需求，DevOps 从现软件开发方法论演变而来。以下是关于这些模型如何演进以及在哪些情况下效果最好的讨论。\n\
  \n瀑布模型缓慢且繁琐，这促成了敏捷开发的演进，使得负责软件开发的开发团队能够在不超过两周的短冲刺中工作，帮助开发团队从客户那里持续获取反馈，并在下一次发布中结合这些反馈并修复漏洞。\n\
  \n未能跟上敏捷实践的运维团队错失了这一点，而这种敏捷的 `SCRUM` 方法为开发带来了灵活性。\n\n尽管如此，由于开发人员和运维团队之间缺乏协作，开发流程以及发布速度变慢了。\n\
  \n这种对更好协作和更快交付的需求催生了 DevOps 方法论，能够修复较简单的问题，并通过软件的持续交付更快地解决问题。\n\n*[图 3.7]* 解释了传统的瀑布模型、敏捷开发模型和\
  \ DevOps 方法。\n\n![](img/Figure-3.7.jpg)\n\n**图 3.7:** 传统瀑布模型—敏捷开发模型—DevOps 方法\n\n\
  在整个软件开发生命周期中，DevOps 方法涉及持续对软件进行开发、测试、集成、部署和监控。\n\n为了在更短的开发周期内开发高质量软件，首选方法是 DevOps。\n\
  \n*[图 3.8]* 显示了使用 `ALM`、敏捷和 DevOps 跟踪变化的版本控制机制。\n\n![](img/Figure-3.8.jpg)\n\n**图\
  \ 3.8:** 版本控制—ALM—敏捷—DevOps\n\n\n\n\n\nDevOps 工程师的职位需要理解软件开发生命周期，以及开发数字流水线（CI/CD\
  \ 流水线）所需的各种自动化工具。\n\n为了监控代码发布，DevOps 工程师与开发人员以及 IT 运营团队协作。他们进入开发领域，通过成为对部署和网络运营感兴趣的开发者，或者成为对脚本编写和编码充满热情的系统管理员，来改进测试和部署的规划。\n\
  \n![](img/Figure-3.9.jpg)\n\n**图 3.9:** 持续交付客户——交付团队\n\n### DevSecOps\n\n通过发布工程师与安全团队之间持续且灵活的协作，DevSecOps\
  \ 创造了一种“**安全即代码**的文化。\n\n`DevSecOps` 运动重点在于在 DevOps 等敏捷框架内为复杂的软件开发过程创建新的解决方案，DevSecOps\
  \ 解决了围绕速度、风险、安全意识和软件质量的问题。\n\n# DevSecOps 工程师的工作涉及什么？\n\nDevSecOps 工程师选择并部署合适的自动化应用程序安全测试工具，并负责让用户了解如何充分利用应用程序安全功能。现在的软件项目是由许多不同部分（包括人类和机器）组成的复杂混合体。\n\
  \n![](img/Figure-3.10.jpg)\n\n**图 3.10:** DevOps 的多个维度——系统与架构\n\n## DevOps 与 DevSecOps\
  \ 的比较\n\nDevOps 涉及开发、IT 运营和应用程序交付，而 DevSecOps 涉及开发、IT 运营、安全和应用程序交付。\n\n`图 3.11`\
  \ 解释了 DevSecOps，我们需要对代码进行静态分析以进行审查，然后是构建，接着是合规性验证测试，最后是发布。发布还涉及威胁模型策略计划，随后是日志、部署、运行，最后监控，并考虑到涉及监控、检测、响应和恢复的威胁情报。\n\
  \n![](img/Figure-3.11.jpg)\n\n**图 3.11:** DevSecOps\n\n# DevOps 的未来范围\n\nDevOps\
  \ 使产品交付周期变得快速且简单，提供了持续集成和持续交付。\n\nDevOps 的实施通过以下因素改进：\n\n1. 可预测性是导致新发布产品失败率低的因素。\n\
  2. 在新产品发布时，可维护性是提高恢复率的过程。\n3. DevOps 提高了产品的质量。\n4. 它有助于减少跨产品的缺陷数量并结合较低的风险。\n5. IT\
  \ 公司和每个业务组织的愿景始终是 DevOps 提供的软件开发过程中的成本效益。\n6. DevOps 通过简单、稳定和安全的运行状态提供稳定性。\n7. 优化的软件交付——DevOps\
  \ 提供了精简的交付，因此由于移动应用程序和数字平台的影响，营销工作减少了高达 50%。\n\n# 数据库 DevOps\n\n应用程序可以以出运代码的速度进行部署。如果没有随代码一起遍历数据库更改，应用程序的发布就是完整的。因此，应用程序的自动化发布需要将数据库更改和部署作为\
  \ DevOps 循环不可或缺的一部分。如果不考虑数据库 DevOps，就无法充分发挥 DevOps 的收益。\n\n数据库更改和部署的自动化过程对于消除人工干预至关重要，这确保了错误的减少并加速了进程。\n\
  \n为了确保数据库代码与开发代码在同一个过程中，数据库 DevOps 应用了 DevOps 的基本原则；因此，数据库 DevOps 成为 DevOps 循环不可或缺的一部分。\n\
  \n对于大多数开发人员来说，应用程序代码的变化也会影响数据库代码，因此他们还需要编写一些 `SQLs`。他们可能不是非常精通，但至少在基础水平上，他们可以在主开发中进展。这通常由\
  \ DBA 进行清理和改进，以确保效率和有效性。这包括性能、安全、数据冗余和可扩展性。因此，我们确实需要将数据库代码像 App 代码一样对待。\n\n### 新问题集\n\
  \n在将数据库移动到生产环境时，存在许多不同类型的复杂挑战，由于这一点，自动化数据库部署需要大量工作。平均而言，数据库更改比其他类型的代码更改需要更多时间。数据是每个开发人员面临的首要挑战，因为他们无法进行测试。当结构性更改进入轨道时，数据库的持续开发并非易事。DevOps\
  \ 是一套结合软件开发和 IT 运营的实践，目标是更快速地交付功能、修复和更新。数据库 DevOps 应用这些原则，通过解决已知的瓶颈来进一步改进应用程序开发流程。\n\
  \n# 将数据库代码像 App 代码一样对待\n\n一切从开发人员开始。大多数应用程序代码的变化也会影响数据库代码。许多企业开发人员负责做出这些更改并编写 `SQL`\
  \ 代码。DBA 审查数据库代码，以确保数据库更改不会影响性能、安全或数据集成。由于数据库更改遵循手动流程，数据库代码审查请求通常是发布前的最后障碍。\n\n\
  现在，团队不再需要等待 DBA 在最后阶段进行审查。在更早阶段这样做并打包所有代码是可能的，也是必要的。\n\n应用程序代码\n`软件开发 → 提交到 SCC\
  \ → 验证 → 构建 → 自动 →`\n数据库代码制品\n\n### 数据库自动化\n\n将数据库更改集成到您的 DevOps 过程中并利用数据库持续交付。可以将数据库放入版本控制，并以类似于应用程序的方式处理数据库更改。还有一些额外的考虑，例如添加迁移脚本以使现有数据适应任何更改的架构。但核心思想是自动化这些更改并将数据库代码放入版本控制，从而使持续交付成为可能。当数据库更改与应用程序一起进行持续集成时，您的应用程序交付速度将提高数量级。\n\
  \n\n\n\n\n- **单元测试：** 所有被创建和部署的更改都需要测试来检查这些所做的更改是否符合需求，以及是否会破坏或对已部署的环境引起问题。测试不应该是对更改的重新考虑，而应该运行基于特定运行的更改。\n\
  - **可重复部署：** 能够通过相同的流程反复地部署小幅更改的实践，意味着可以可靠且有信心地完成相似的结果。\n- **持续交付：** 能够使用单元测试将更改应用于各种环境，并最终部署到生产环境的过程，在数据库\
  \ DevOps 中在很大程度上是自动化的。在很大程度上，随着流程的建立，不再需要对生产环境进行重大修复，从而避免了未来出现所有意外之外的问题或故障。\n\n\
  # 如何为 DevOps 进行数据库版本控制？\n\n在为 DevOps 进行数据库版本控制时需要注意以下几点：\n\n- 数据库架构（包括索引）应该在版本控制中\n\
  - 控制业务逻辑的数据（如查找表）也应该在版本控制中\n- 开发者需要一种方法来轻松创建本地数据库\n- 共享数据库只需要通过构建服务器进行更新\n\n## 在规划数据库版本控制时，我们需要\n\
  \n表或集合；约束；索引；视图；存储过程；函数和触发器；数据库配置。\n\n我们使用无模式的数据库，但这并不意味着不需要版本控制。我们仍然需要数据库账户和整体数据库配置设置。数据库的版本控制有两种类型：\n\
  \n1. 全架构控制（Whole-schema）\n2. 更改脚本（Change script）\n\n# 全架构版本控制\n\n这是指源代码中的数据库看起来像我们希望的样子。当使用这种模式时，所有的视图和表都会以最有利的方式进行排序，这使得在不需要部署的情况下更容易理解数据库。对于\
  \ SQL server，SQL server data tools（SSDT）是全架构版本控制的一个示例。在这个工具中，所有的数据库对象都通过 `CREATE`\
  \ 脚本声明。全架构版本控制的另一个例子是 entity framework 迁移（migrations）。在这个工具中，数据库由 `C#`/`VB` 类表示。在与全架构版本控制工作时，不会直接编写迁移脚本。部署工具通过分析数据库当前状态以及版本控制中的理想版本，为你分析出需要哪些更改。\n\
  \n这一切允许对数据库进行快速更改，从而有助于看到结果。有时，仅靠工具是不够的，即使还有部署前和部署后的脚本。在这种情况下，生成的迁移脚本需要由数据库管理员或数据库开发人员手动修改，这可能会破坏持续部署方案。这通常发生在表结构发生重大更改的情况下，因为生成的迁移脚本在这些情况下可能是低效的。另一个优势是它支持代码分析。例如，如果我们更改了列名但忘记在视图中编辑它，`SSDT`\
  \ 将返回编译错误。这捕获了许多错误，并防止你推送损坏的脚本进行部署。\n\n# 更改脚本版本控制\n\n第二个选项是“更改脚本”版本控制。我们不是存储数据库对象，而是存储创建数据库对象所需的步骤列表。`Liquibase`\
  \ 是更改脚本源工具的一个示例。该工具的主要优势是我们可以对最终脚本文件的格式拥有完全控制。这使得在表合并或拆分时处理更改变得容易得多。不幸的是，也有许多缺点。首先是需要编写更改脚本。虽然提供了更多的控制，但事实证明这也是耗时的。另一个是更改脚本工具往往非常模糊。例如，如果我们想在不部署表的情况下检查表上的列，就有必要读取所有涉及该表的更改脚本。正因如此，我们一定会漏掉某些内容。\n\
  \n为了促进 DevOps，有一个周期性的工具表；然而，它通过引入数据库维度为现有流程和集成带来了动荡；因此，为数据库 DevOps 引入新工具并不容易。人们的取向最终从科学和业务转向感觉，随着复杂性的增加，事实会被掩盖。\n\
  \n通过从小范围开始引入数据库 DevOps，减少了各方的恐惧因素，即在团队心智和执行任务的人员中减少了由于知识匮乏且以前从未做过的焦虑。这可以持续进行几个版本，并让每个人感到舒适。最初，对于少数项目，让他们尝试两种方式并保持某些方法。\n\
  \n\n\n\n\n查找数据（lookup data）是一个简单的示例，其中数据库中存在允许值、查找数据和参考数据的表。如果你需要为新版本更改这些数据，你该如何操作？如果客户或用户已经更改了这些数据，你又该如何迁移这些数据？\n\
  \n经历重大架构迁移（schema migration）的表是另一个示例。在添加新列的情况下，表会被拆分并规范化到新的表中。为了确保迁移脚本恰好运行一次，或者运行多次而不产生任何副作用（使用具有“幂等性性的脚本），我们应该如何编写迁移代码？\n\
  \n在升级过程中，其他需要考虑状态的数据库对象如下：\n\n*   **索引 (Indexes)**：如果重命名了索引或添加了包含列，会发生什么？如果 DBA\
  \ 添加了新的紧急索引，会发生什么？因为它不在官方构建版本中，你的 DevOps 工具能够删除它吗？\n*   **键 (Keys)**：主键需要被删除并重建，这是由于主键更改所要求的。如果是那样的话，外键会发生什么？\n\
  \n函数、视图和存储过程等数据库对象通常没有状态考虑因素，在大多数情况下，可以在每次发布期间重新部署。\n\n特别是如果我们目标是频繁发布和敏捷协作开发，那么我们该如何克服这些“状态”困难？\n\
  \n在将数据库包含到 DevOps 流程中，第一步需要对如何存储数据模型做出决策。可用选项如下：\n\n### 基于迁移的部署 (Migration-based\
  \ Deployment)\n\n在开发期间处理数据库的传统方法是`基于迁移的部署`或基于转换的部署。你在某个时间创建一个初始数据库（即种子数据库），并使用 SQL\
  \ Server 管理工具创建脚本，这些脚本可能包括一个存储在源码控制中的单个迁移脚本；之后，你保留将数据库架构更新到当前节点所需的所需的每个脚本。这些迁移脚本通常包含参考表的数据修复或新值，并带有增量版本号，以及架构更改所需的`数据定义语言`\
  \ (`DDL`)。数据库基本上是由你从一个状态迁移到另一个状态。在基于迁移的部署方法中，数据库本身是真理来源（system of truth）。\n\n然而，使用此选项存在以下问题：\n\
  \n*   在升级数据库时，随着需要应用的脚本越来越多，部署时间变得越来越长。定期创建新的种子数据库是解决此问题的方法，避免从最初始数据库开始。\n*   在处理大型数据库时，可能会浪费大量时间，例如在设计索引时。一个大索引可以被添加到数据库，然后被删除，然后以略有不同的方式重新应用（即对其添加新列），如果需求不断变化，这种操作可以重复多次。\n\
  *   为了显示数据库实际上应该是什么样，没有数据模型，唯一的选择是查看最新更新的数据库。\n*   如果在对生产服务器进行补丁时发生了架构漂移（schema\
  \ drifts），升级脚本可能会损坏，因为补丁中的更改没有返回开发环境，或者没有按照生产环境中的方式实现。\n*   如果不是按正确的顺序运行，升级脚本也会损坏。\n\
  \n### 基于状态的部署 (State-based deployment)\n\n第二个可用选项是`基于状态的部署`，该选项通过对数据库的当前状态进行快照并将其放入源码控制来存储数据模型。你在仓库和目标数据库之间进行架构比较，即使用比较工具来确定需要部署的内容。每个表、视图、存储过程和触发器都将保存为单独的\
  \ SQL 文件，通过数据库对象状态的真实表示来完成。由于部署的更改仅是从当前状态移动到所需状态所需的更改，因此这是一个更快的选项。在创建索引的这个示例中，你只需创建最终索引，而不是在此处多次创建和修改它。\n\
  \n在基于状态的部署中，源代码本身是真理来源。在基于状态的部署中，架构和数据比较工具负责生成`ALTER`脚本并在目标数据库上运行它们，无需任何人工干预。工具将完成所有工作，开发者需要保持数据库结构为最新。使用此选项的结果是，比基于迁移的部署要做的工作少得多。\n\
  \n你可能认为应该的方法一直是基于状态的部署；但在需要在脚本中进行细粒度控制的场景下，基于迁移的部署更有意义，因为你无法通过基于状态的部署修改不同的脚本。它允许你通过对脚本的控制，编写出比脚本比较工具生成的更好的脚本。支持基于迁移部署的其他原因还有：你可以实现“一次构建，多次部署”，而不是在每次部署之前生成新内容，这是通过将更改视为一等构件物（first-class\
  \ artifact）来实现的；根据敏捷/DevOps 哲学，你鼓励小规模、增量的更改；而且通过迁移，更容易支持并行开发策略——部分原因是因为迁移本身就是小小的增量更改，即能够向目标数据库（如暂存环境和生产环境）部署不同的功能或开发分支的能力。\n\
  \n确定将使用哪种部署方法后的下一步是学习版本控制选项和自动化构建过程。\n\nDevOps 关注应用程序代码的源码控制，而 DataOps 关注跟踪表、存储过程、视图和触发器等数据库对象，并且通常是分开完成的。\n\
  \n# 结论\n\n本章关于 DevOps 向你介绍了一种软件工程文化，它将开发和运维团队统一起来，在工具和流程的伞下实现软件开发每个阶段的自动化。\n\n\n\
  \n\n数据库 DevOps 应用了 DevOps 的基本原则，以确保数据库代码包含在与开发代码相同的过程中，因此，数据库 DevOps 成为 DevOps 循环不可不可缺的一部分。\n\
  \n下一章将关于“使用 Docker 容器设计微服务架构”。微服务的核心思想是将应用程序拆分为更小、可组合的且相互协同工作的部分，这样应用程序就会变得更容易构建和维护。每个组件都进行持续开发和独立维护，而应用仅仅是其组成部分的总和。\n\
  \n微服务是一个专注于单一关注点的、隔离且松耦合的开发单元。\n\n# 关键术语\n\n- `DevOps`：DevOps 是一种将敏捷思维引入企业应用全生命周期各个方面的方法论，它是一种软件开发和运维管理策略。\n\
  - `Agile`（敏捷）：敏捷开发解决了客户需求与 `Dev` + 测试团队之间的差距，跨职能团队工作于设计、开发和测试客户优先的功能/故事，并重点关注功能和非功能的就绪性。\n\
  - `Continuous integration`（持续集成）：持续集成是一种软件开发实践，开发者定期将他们的代码更改合并到中央仓库，然后运行自动化构建和测试，这就是\
  \ DevOps 中的持续集成。它通常指的是软件发布过程中的构建或集成阶段，包含自动化组件（例如 `CI` 或构建服务）和文化组件（例如，学习频繁集成）。持续集成的主要目标是更快地发现和解决错误，提高软件质量，并缩短验证和发布新软件更新的时间。\n\
  - `Continuous deployment`（持续部署）：持续部署是一种软件发布过程，使用自动化测试来验证代码库的更改是否正确且稳定，以便立即自主地部署到生产环境。开源技术和开发工具可以支持持续部署，并与自动化和生命周期管理产品共同支持\
  \ DevOps 模型。\n- `Waterfall model`（瀑布模型）：将软件开发分为不同的阶段，每个阶段都为执行特定任务而设计；这是一种线性的、顺序的模型。\n\
  - `DevOps tools`（DevOps 工具）：用于在不同阶段实现自动化的 DevOps 工具有 `Puppet`、`Jenkins`、`GIT`、`Chef`、`Docker`、`Selenium`\
  \ 和 `AWS`。\n- `DevOps lifecycle`（DevOps 生命周期）：DevOps 生命周期周期中的步骤包括开发、测试、集成、部署和监控。\n\
  - `DevOps principles`（DevOps 原则）：DevOps 的原则是以客户为中心的行动、持续地改进、监控和测试一切，以及端到端的责任。\n\
  - `CAMS`：`CAMS` 是文化（Culture）、自动化（Automation）、测量（Measurement）和共享（Sharing）的缩写，它是 DevOps\
  \ 的核心。\n- `Database DevOps`：为了确保数据库代码包含在与开发代码相同的过程中，数据库 DevOps 应用 DevOps 的基本原则，使数据库\
  \ DevOps 成为 DevOps 循环的一部分。\n- `DevSecOps`：通过发布工程师与安全团队之间持续灵活的协作，DevSecOps 涉及创建“安全代码”的文化。围绕速度、风险、安全意识和软件质量的问题通过\
  \ DevSecOps 解决。\n\n# 问题\n\n1. DevOps 帮助我们实现的最重要的事情是什么？\n2. 请用一个用例说明在行业中可以使用 DevOps。\n\
  3. 你如何理解“基础设施即代码”？它是如何融入 DevOps 方法论的？它实现了什么目的？\n4. `Puppet` 是什么？\n5. `Chef` 是什么？\n\
  6. `Nagios` 是什么？`Nagios` 是如何工作的？\n7. 什么是 `DevSecOps`，它如何创建“安全代码”的文化？比较 DevOps 和\
  \ DevSecOps。\n8. 写一段关于数据库 DevOps 的笔记，解释其组成部分以及数据库自动化工具。\n9. 数据库 DevOps 使用哪些原则在应用开发中被广泛接受？\n\
  10. 解释基于迁移的部署和基于状态的部署。\n\n## 第 4 章\n\n### 用于微服务架构设计的 Docker 容器\n\n## 引言\n\n`Docker`\
  \ 是许多软件驱动型组织从单体架构转向微服务架构的原因。与单体架构相反，微服务要求你将应用程序拆分为逻辑相关的各个部分。这些部分例如通过 `HTTP` 或消息与其他部分通信。\n\
  \n当应用程序被拆分为更小、可组合的且相互协同工作的部分，每个组件都进行持续开发和独立维护，而应用仅仅是其组成部分的总和时，应用程序就会变得更容易构建和维护，这就是微服务的核心思想。一个专注于单一关注点的隔离且松耦合的开发单元就是微服务。\n\
  \n\n\n\n阅读完本章后，你将了解到微服务的介绍，微服务是围绕业务能力设计和构建的小型应用程序。微服务被描述为将应用程序结构化为服务的集合，这架构风格，旨在为\
  \ DevOps 和持续集成/持续部署（CI/CD）优化应用的构建。本文将共同阐述迁移到微服务架构的原因及其优势。此外，还将提供构建基于微服务的的可扩展且易于维护的应用程序的知识，并描述\
  \ Docker 对微服务的益处。接下来将提供 Docker 与虚拟机的对比。随后，将解释 Docker 如何胜过虚拟机，并描述 Docker 架构。文中将提供关于\
  \ Docker 镜像（Docker 容器由此创建）的知识，以及 Docker 卷（处理容器使用的持久化数据的方法）的解释，以及存储所有镜像的镜像注册表。接下来的讨论是关于使用\
  \ Docker 扩展基于微服务的应用架构，并描述服务网格（一种控制应用程序不同部分之间数据共享方式的方法）及其作用。接下来，将通过案例研究解释微服务架构，描述一个基于微服务的打车应用\
  \ App，并描述一个用例：购物车应用程序。文中将提供微服务的架构、特性和优势的知识，以及设计微服务的最佳实践插图。接下来，将阐明微服务的示例，并提供一个实操的微服务架构。\n\
  \n# 微服务导言\n\n在过去的二十年里，消费者的期望以惊人的速度进化，现在的消费者期望通过尖端的 Web 应用、移动应用和 IoT 集成来满足消费需求。我们需要提升自己以跟上今天的产品生态系统，因为消费需求已被完全重新定义。为了竞争，应用程序必须具有足够的活性以满足不断变化的需求，具有足够的扩展性以立即响应使用量的激增，并在未使用时收缩规模，并且具有足够的模块化以允许消费者所期望的持续、增量改进。满足这些及更多挑战的很大程度上在于微服务架构。\n\
  \n微服务中的“微”意味着它们只做某项特定的工作或解决特定的问题，而且该问题应该是概念性的而非技术性的。微服务应该围绕业务能力设计，而不是数据访问或消息传递等水平层。它们通过稳定的\
  \ API 与其他微服务以及外部用户通信，从而创建一个更大的应用程序。\n\n这使得单个微服务的内部功能可以在不影响系统其他部分的情况下进行根本性的升级。这反过来又了\
  \ DevOps 所追求的操作方式：如果将大型应用程序的特定功能分割成离散的、独立运行的代码段，将更容易实现 DevOps 持续集成和持续交付（CI/CD）的目标。为了轻松地自动测试微服务，定义良好的\
  \ API 很有帮助。\n\n## 定义微服务\n\n微服务是围绕业务能力组织的的服务集合，由小型团队拥有，具有高度的可维护性和可测试性、松耦合、独立部署，并被结构化为一个应用程序。\n\
  \n它使组织能够演进其技术栈，且该架构能够快速、频繁且可靠地交付大型、复杂的应用程序。\n\n# 为 DevOps 和 CI/CD 优化的微服务是构建应用的方法\n\
  \n它如何将应用程序拆分为其核心功能，是微服务架构区别于更传统的单体方法的地方。每个服务都可以独立运行（以及失败）而不产生负面影响其他服务，因为每个服务都可以独立构建和部署，并且为了使持续迭代和交付（CI/CD）更加无缝且可行，可以拥抱\
  \ DevOps 的技术侧。\n\n访问一家在线零售商并使用网站的搜索栏浏览产品代表了一个服务。你可能还会看到从购物者偏好数据库中调取的相关产品推荐，这也是一个服务。向在线购物车添加物品是另一个服务。\n\
  \n独立于其他服务运行的应用程序的核心功能是微服务。微服务架构不仅关于应用程序核心函数的松耦合，更关于如何重构开发团队和服务间通信，以便为不可避免的失败、未来的扩展性和新功能做好准备。\n\
  \n# 迁移到微服务架构的原因\n\n迁移到微服务架构涉及以下原因：\n\n* 在单体架构下，理解大型应用程序的复杂性很难。\n* 为了理解更改的影响，应用程序需要大量的测试。\n\
  \n![](img/Figure-4.1.jpg)\n\n**图 4.1：** 单体架构与微服务的对比\n\n* 即使是微小的变化，整个应用程序都需要重新部署。\n\
  * 使用单体构建的应用可能会降低启动速度。\n\n# 微服务的益处\n\n以下是微服务的益处：\n\n* 在微服务架构下，新技术的引入变得简单。\n* 由于微服务被拆分成更小的块，开发者更容易开发和维护应用程序。\n\
  * 在微服务中，每个模块可以通过以下方式独立扩展：\n    * 通过增加内存或 CPU 扩展，即 x 轴扩展\n    * 通过分片进行扩展，即 z 轴扩展\n\
  \    * 在微服务架构中，每个服务都可以独立部署、更新、替换和扩展（DURS）。\n* 即使单个模块故障，也不会影响应用程序的其他部分。\n\n微服务保证了开发团队更高的自主性（上市速度）、更好的故障隔离（可靠性）、可重用性和扩展性。\n\
  \n# 基于 Docker 的微服务\n\nDocker 的出现极大改变了服务端 Web 应用的发展。现在可以使用微服务构建可扩展且易于维护的应用程序。通过以下示例来了解微服务以及\
  \ Docker 如何实现它们。\n\n你有一个 Web 开发团队，其中一人 Jaimin Shah 使用 Mac，Jaimin 的同事 Jatin Patel\
  \ 使用 Windows，团队的第三位成员 Jigar Patel 最适合使用 Debian。这三个开发者使用三个不同的环境，每个环境开发同一个应用程序时都需要独特的设置。为了安装各种库和编程语言并使其运行起来，每个开发者都要查阅大约\
  \ 20-30 页说明。然而，在这些三个不同的开发环境中，库和语言发生冲突几乎是不可避免的。当你增加三个更多环境——阶段、测试和生产服务器时，你就会意识到确保这些环境之间的一致性有多困难。\n\
  \n\n\n\n\n当你构建单体应用时，我们所描述的问题是相关的；如果你决定顺应现代趋势开发基于微服务的应用程序，情况会变得糟糕得多。微服务可以被视为独立的小型应用程序，因为它们是自包含的、独立的应用程序单元，每个只履行一个特定的业务功能。如果你为你的应用创建了十几个微服务，会发生什么？如果你决定使用不同的技术栈构建几个微服务，那又会怎样？由于开发者必须管理的环境比传统的单体应用多得许多，你的团队将会陷入麻烦。\n\
  \n使用微服务和容器来封装每个微服务是解决这一问题的方案，为了管理这些容器，你可以借助 `Docker` 的帮助。\n\n`Docker` 最初构建在 Linux\
  \ 容器之上，是一种容器化工具，提供了一种处理容器化应用程序的方法。`Docker` 可以帮助我们实现微服务的优势将在接下来的讨论中介绍。\n\n# Docker\
  \ 对微服务的优势\n\n容器化一直作为虚拟化的替代方案，一直具有改变我们构建应用方式的潜力。`Docker` 经常被与虚拟机比较作为容器化工具。\n\n引入虚拟机（VM）的目的是优化计算资源的使用。你可以在单台服务器上运行多个虚拟机，并为每个应用程序实例部署一个独立的虚拟机。在这种模型下，每个虚拟机为单个应用程序实例提供了一个稳定的环境。然而，由于虚拟机仍然消耗大量资源，遗憾的是，当我们扩展应用程序时，会很快遇到性能问题。\n\
  \n![](img/Figure-4.2.jpg)\n\n**图 4.2:** 使用虚拟机程序在同一台服务器上运行多个操作系统\n\n虚拟机程序用于在同一台服务器上运行多个操作系统，如\
  \ `[figure 4.2]` 所示，有助于减少运行多个操作系统所需的资源。\n\n由于微服务类似于小型应用，我们必须将微服务部署到它们自己的虚拟机实例中，以确保环境隔离。最高的选项不是将整个虚拟机专门用于部署应用的一小部分。然而，`Docker`\
  \ 容器所需的计算资源比虚拟机少得多，并且通过 `Docker` 减少性能开销并在同一台服务器上部署数千个微服务。\n\n到目前为止，我们讨论了单个应用的环境管理。你可能正在开发两个不同的项目，或者你需要测试同一个应用的两个不同版本。在这种情况下，在同一台虚拟机上支持两个不同的环境是非常痛苦的，因为应用版本或库（对于项目）之间的冲突是不可避免的。\n\
  \n## Docker 与虚拟机的比较\n\n在这里，我们通过一些重要特性来比较 `Docker` 和虚拟机。\n\n| 特性 | Docker | 虚拟机 |\n\
  | :--- | :--- | :--- |\n| OS 支持与架构 | `Docker` 容器托管在带有宿主操作系统的单台物理服务器上，并在它们之间共享。容器之间共享宿主操作系统使其变得轻量化并缩短启动时间。`Docker`\
  \ 容器被认为适用于在单个操作系统内核上运行多个应用。 | 每个虚拟机内部都要有宿主操作系统和客户操作系统。客户操作系统可以是任何操作系统，如 Linux 或\
  \ Windows，无论宿主操作系统是什么。如果应用或服务需要在不同的操作系统上运行，则需要虚拟机。 |\n| 安全性 | 在 `Docker` 容器的情况下，不建议为应用提供\
  \ root 权限并以管理员权限运行，因为容器共享宿主内核。容器技术具有访问内核子系统的权限；结果是单个被感染的应用程序能够攻击整个主机系统。 | 虚拟机是独立的，拥有自己的内核和安全特性。因此，需要更多权限和安全的应用运行在虚拟机上。\
  \ |\n| 可移植性 | `Docker` 容器包是自包含的，可以在任何环境中运行应用，由于它们不需要客户操作系统，因此可以轻松地移植到不同平台。`Docker`\
  \ 容器可以轻松部署在服务器上，因为容器是轻量级的，与虚拟机相比，启动和停止的时间短得多。 | 虚拟机与其操作系统隔离，因此在不产生兼容性问题的情况下，无法跨多个平台迁移。在开发阶段，如果应用要在不同平台上进行测试，则必须考虑\
  \ `Docker` 容器。 |\n| 性能 | `Docker` 容器的轻量级架构比虚拟机更少资源。与虚拟机相比，扩展和复制容器简单快捷，因为不需要在它们安装操作系统。\
  \ | 虚拟机比 `Docker` 容器更消耗资源，因为虚拟机需要加载整个操作系统才能启动。在虚拟机的情况下，CPU、内存和 I/O 等资源可能不会永久分配给容器——而容器的情况下，资源使用随负载或流量而变化。\
  \ |\n| 启动时间 | 几秒内启动 | 虚拟机启动需要几分钟 |\n| 运行在 | `Dockers` 利用执行引擎 | 虚拟机 利用虚拟机程序 |\n|\
  \ 内存效率 | 不需要空间进行虚拟化；因此内存更少 | 在启动界面之前需要加载整个操作系统，因此效率较低 |\n| 隔离性 | 容易受到不利影响，因为没有隔离系统的规定\
  \ | 由于高效的隔离机制，干扰的可能性降最低 |\n| 部署 | 部署非常容易，因为只有单个容器化的镜像可以在所有平台上使用 | 部署相对较长，因为由单独实例负责执行\
  \ |\n| 使用 | `Docker` 有一套复杂的使用机制，由第三方工具和 `Docker` 管理的工具组成 | 工具易于使用，工作起来更简单 |\n\n\
  **表 4.1:** Docker 对比虚拟机\n\n# Docker 是如何击败虚拟机的？\n\n为了避免与 `Docker` 冲突，我们不需要不断设置纯洁环境，因为这与虚机的工作方式背道而驰。我们知道使用\
  \ `Docker` 将没有冲突。应用程序微服务将运行在与操作系统完全隔离的环境中，这是由 `Docker` 保证的。\n\n团队中的每个开发者都不需要仔细遵循\
  \ 20-30 页针对特定系统的说明（在 `Docker` 中），相反，可以创建一个包含所有必要库和语言的稳定环境，并由一个开发者保存在 `Docker hub`\
  \ 中。为了获得相同的环境，其他开发者只需加载该设置，从而节省我们大量的时间和精力。\n\n在技术栈方面，使用 `Docker` 的其他优势是开发速度快和选择自由。然而，这些其他优势与\
  \ `Docker` 本身无关。实际上，新功能的快速开发以及为每个微服务选择喜好的技术栈是通过基于微服务的架构实现的。\n\n总结一下，`Docker` 的优势如下：\n\
  \n*   容器仅仅是一个操作系统进程，`Docker` 容器可以在几秒钟内启动，而对于完整操作系统的虚拟机，加载可能需要几分钟。\n*   使用 `Docker`\
  \ 的 Web 开发团队成员只需下载 `Docker` 镜像即可在不同的服务器上运行它，而无需设置新环境。\n*   由于销毁和运行容器的速度比销毁和运行虚拟机快，这使得容器的管理和扩展更加容易。\n\
  *   由于你可以在单台服务器上运行比虚拟机多得容器，因此计算资源的利用更好。\n\n\n\n\n\n*   由于 Docker 支持 Windows、Mac、Debian\
  \ 等其他操作系统，你可以获取这些操作系统的 Docker。\n\nDocker 如何具体帮助我们开发基于微服务的应用程序，可以通过它的架构来理解。\n\n##\
  \ Docker 架构\n\nDocker 采用客户端服务器架构。Docker 客户端与 Docker 守护进程（daemon），守护进程负责构建、运行和分发\
  \ Docker 容器的繁重工作。Docker 客户端和守护进程可以运行在同一个系统中，也可以将 Docker 客户端连接到远程 Docker 守护进程。Docker\
  \ 客户端和守护进程通过 UNIX sockets 或网络接口使用 REST API 进行通信。另一个 Docker 客户端是 `Docker compose`，它允许你处理由一组容器组成的应用程序。\n\
  \n## Docker client\n\n`Docker client` 使用 HTTP 请求与 Docker 守护进程通信。客户端是 Docker 架构中的一个组件。当你运行\
  \ `docker run` 命令时，客户端通过 HTTP 请求与守护进程通信，并将镜像拉取到你的主机。\n\n![](img/Figure-4.3.jpg)\n\
  \n**图 4.3:** Docker 架构\n\n## Docker 守护进程\n\n`Docker daemon` 是你所有 Docker 通信发生的地方。它管理容器和镜像的状态，以及与外部世界的连接，并控制对机器上\
  \ Docker 的访问。\n\n守护进程是一个在后台运行且不受用户直接控制的程序。服务器是一个接收客户端请求并执行所需操作以满足这些请求的程序。守护进程通常也是服务器，接受客户端请求代表它们执行操作。Docker\
  \ 守护进程充当服务器，而 Docker 命令就是客户端。\n\n## Docker 仓库\n\n类似于源码仓库，在 Docker 世界中，我们有一个名为 `Docker\
  \ registry`（Docker 仓库）的概念。一旦你构建了 Docker 镜像，你可能需要与世界共享它。为了这一点，我们可以使用仓库。Docker 仓库可以是私有的、公共的，或者是公开但仅限注册\
  \ Docker 的用户访问。但它们都使用相同的 API 执行相同的功能。\n\n`Docker hub` 是一个著名的公共 Docker 仓库，但可以在 `Docker\
  \ hub` 中创建私有仓库。类似于 Docker hub，AWS 拥有 `ECR`，它是完全私有化的。\n\nDocker 仓库允许用户使用 RESTful\
  \ APIs 推送/拉取镜像。一些公司在他们的本地环境中创建私有仓库。\n\n考虑一个简单的微服务来更好地理解 Docker 是如何工作的以及如何使用它。\n\n\
  ![](img/Figure-4.4.jpg)\n\n**图 4.4:** 为了实现博客，具有三个服务的微服务\n\n为了为你的网站实现一个博客，图中所示的应用（微服务）仅包含三个服务。一个容器封装了每个服务——Nginx（Web\
  \ 服务器）、MySQL（数据库）和 WordPress（博客引擎）。\n\n由于容器只是其一部分，这个示例并没有涵盖整个 Docker 架构。Docker 架构中包含的三个主要组件是——镜像、容器和仓库。我们将逐一审查每个组件。在实际可以使用\
  \ Docker 进行开发之前，你需要在你的计算机上安装 Docker。\n\n我们必须首先在 `docker-compose` 文件中注册它们每一个一个，以便让\
  \ Docker 容器协同工作，因为 `Docker compose` 会协调所有的服务。\n\n```\n1. version: ‘2’\n2. services:\n\
  3. nginx:\n4. build: nginx\n5. restart: always\n6. ports:\n7. -8080:80\n8. volumes_from:\n\
  9. -wordpress\n10. wordpress:\n11. image: wordpress:php7.1-fpm-alpine\n12. environment:\n\
  13. WORDPRESS_DB_HOST:mysql\n14. mysql:\n15. image: mariadb\n16. environment:\n\
  17. MYSQL_ROOT_PASSWORD:example\n18. volumes:\n19. - ./demo-db:/var/lib/mysql\n\
  ```\n\n我们必须注意 `docker-compose.yml` 文件中的三个元素。应用服务—“nginx”、“wordpress”和“mysql”必须首先指定。我们必须指定镜像——注意第二个是服务下的“image”属性。最后我们必须指定另一个属性——volumes”。\n\
  \n## Docker compose 和 Docker 文件的目录结构\n\n当使用 Docker 和 `Docker compose` 组织较大的项目时，有很多选项。以下是你可以操作的方法。\n\
  \n较小的项目易于组织。你有一个应用程序，通常 get 有一个 `Dockerfile` 和 `docker-compose.yml` 文件。\n\n在你的文件系统中使用\
  \ Docker 组织一个简单项目可能如下所示：\n\n```\nmyapp/\n- appcode/\n- Dockerfile\n- docker-compose.yml\n\
  ```\n\n然后你的 `docker-compose.yml` 文件可能如下所示：\n\n```\nversion: ‘3’\nservices:\nmyapp:\n\
  build: ‘.’\n```\n\n但当你有几个每个应用都有自己的 `Dockerfile` 时会发生什么？你可能想要一个单一的 `docker-compose.yml`\
  \ 文件来控制你的整个应用和服务堆栈。\n\n这里是你通常如何组织基于微服务的项目的：\n\n```\nmyapp/\n- auth/\n- Dockerfile\n\
  - billing/\n- Dockerfile\n- contact/\n- Dockerfile\n- user/\n- Dockerfile\n- docker-compose.yml\n\
  ```\n\n在这种情况下，每个服务都有它们自己的 `Dockerfile`。`docker-compose.yml` 文件可能如下所示：\n\n```\nversion:\
  \ ‘3’\nservices:\nauth:\n  build: ‘./auth’\nbilling:\n  build: ‘./billing’\ncontact:\n\
  \  build: ‘./contact’\nuser:\n  build: ‘./user’\n```\n\n## Docker 中的镜像\n\n作为容器蓝图的\
  \ Docker 镜像是 Docker 架构中的第二个组件，它们从 `Dockerfile` 实例化。如何创建镜像由 `Dockerfile` 解释，它们是文本文件。我们没有在\
  \ `docker-compose` 中为 Nginx 指定镜像，因为我们要构建自己的。我们使用 `Dockerfile` 来指示 Docker 使用什么镜像以及什么配置。\n\
  \n我们应用程序中 Nginx 的 `Dockerfile` 示例在这里：\n\n```\nFROM nginx:alpine\nCOPY site.conf/etc/nginx/conf.d/default.conf\n\
  ```\n\n在这里我们给了 Docker 两个指令。用于创建容器的基础镜像由第一行指定。在我们示例中，Nginx 容器的基础镜像是 `nginx:alpine`。可以使用特定版本的库或语言创建镜像。\n\
  \n重要的细节是，一旦送到仓库，Docker 镜像就不会更改。镜像只能从 `Docker Hub` 拉取、修改，然后以新版本推送。通过我们在 `docker-compose.yml`\
  \ 或 `Dockerfile` 中指定的相同基础镜像，每个新容器将被实例化。由于 Docker 从操作系统隐藏了容器环境，你可以使用特定版本的库或编程语言，而不会与计算机上相同的库/语言系统版本冲突。\n\
  \n## Docker Volumes\n\n在 `docker-compose` 文件中，每个服务都有一个名为“volumes”的属性。我们处理容器使用的持久化数据的方法是\
  \ Docker 卷，不同的容器可以访问相同的卷。对于 Nginx 服务，我们在 `docker-compose` 文件中使用了 `volumes_from`\
  \ 属性，这告诉 Nginx 容器它必须查看 WordPress 卷。\n\n\n\n\n当多个容器位于不同的服务器上但仍然需要访问相同数据，它们可以共享卷。这就是我们应该使用\
  \ `volumes_from` 属性的原因，它允许 Docker 为我们管理卷。\n\n## 镜像注册表或仓库\n\n镜像和容器是我们为止提到的 Docker\
  \ 架构的两个基本组件，但这些镜像位于哪里呢？在我们的示例应用程序中，所有容器都是从存储 Docker hub 的标准镜像构建的。\n\nDocker 生态系统包含注册表作为另一个组件，Docker\
  \ hub 就是注册表的一个很好的示例。注册表是存储所有镜像的地方。我们可以从注册表推送和拉取镜像；对于特定项目，构建自己的独特注册表；为了构建自己的基础镜像，可以使用注册表中的镜像。\n\
  \n命名空间（Namespaces）、控制组（control groups）和联合文件系统（`UnionFS`）是 Docker 架构包含的其他重要组件。命名空间允许我们分离容器，使得它们无法访问彼此的状态；为了管理容器之间的硬件资源，控制组是必需的；而为容器创建构建模块，`UnionFS`\
  \ 则提供了帮助。\n\nDocker 实际上并没有创建这些额外组件：在 Linux 容器中，它们在 Docker 之前就已经可用了。Docker 使用相同的概念进行容器管理。\n\
  \n需要考虑的关键点如下：\n\n* 用于处理 Docker 镜像以构建容器的指令包含在 Docker 文件中。\n* 对于每个应用，必须为微服务提供一个独立的\
  \ Docker，并为每个镜像提供特定的指令。\n* Docker 容器始终从指定的 Docker 镜像创建，这确保了跨环境的一致性。\n* 使用 Docker\
  \ 命令行界面来实例化或删除容器，你需要运行 Docker 命令。由于没有内置的图形用户界面，因此使用 Docker 命令行界面来管理 Docker 使用。\n\
  * 可以使用预构建并存储在 Docker hub 等公共注册表中的 Docker 镜像，为了使它们适用于您的应用程序，可以通过配置更改这些基础镜像。\n* 使用\
  \ `Docker-compose` 文件来注册所有应用程序微服务。\n\n# 使用 Docker 扩展基于微服务的应用架构\n\n如果你想用其他服务扩展初始的应用程序架构，可以轻松实现。例如，假设我们想要缓存应用程序的响应并添加一个名为\
  \ `Varnish` 的服务。为了缓存用户经常请求的 HTML 页面、图像、CSS 和 JavaScript 文件，`Varnish` 将提供帮助。更新后的基于微服务的应用看起来如下：\n\
  \n![](img/Figure-4.5.jpg)\n\n**图 4.5：** Docker 化应用的扩展架构\n\n以下代码显示了带有 `Varnish` 服务的扩展\
  \ Docker compose 文件：\n\n```\n1. version: ‘2’\n2. services:\n3. varnish:\n4. build:\
  \ Varnish\n5. ports:\n6. -80:80\n7. depends_on:\n8. -nginx:\n9. nginx:\n10. build:\
  \ nginx\n11. restart: always\n12. volumes_from:\n13. -wordpress\n14. wordpress:\n\
  15. image: wordpress:\n```\n\n\n\n\n服务间通信基础设施是一种服务网格（service mesh），这意味着给定订单服务中的微服务不会直接与其他微服务通信。所有服务之间的通信都发生在一个名为服务网格的软件组件之上。服务网格为网络弹性（resiliency）和服务发现等网络功能提供内置支持。因此，服务开发者的重点可以更多地放在业务逻辑上，而大多数与网络通信相关的工作被被交给了服务网格。由于微服务到服务网格代理的通信始终基于\
  \ `HTTP1.1/2.x` 和 `gRPC` 等标准协议，因此服务网格是与语言无关的；你可以使用任何技术编写微服务，它仍然可以与服务网格协作。\n\n服务网格提供以下关键功能：\n\
  \n*   熔断、重试和超时、故障注入、故障处理、负载均衡和故障转移等操作，即服务间通信的弹性能力\n*   通过专用的服务注册进行服务端点的发现，即服务发现\n\
  *   不包含服务业务功能相关的路由逻辑，而是原级的路由能力，即路由\n*   指标、监控、分布式日志和分布式追踪的观测，即可观测性\n*   传输层安全（`TLS`）和密钥管理，即安全性\n\
  *   基于黑名单和白名单的简单访问控制，即访问控制\n*   对容器、`Docker` 和 `Kubernetes` 的原生支持，即部署\n*   `HTTP1.1`、`HTTP2`\
  \ 和 `gRPC` 是服务间通信协议\n\n服务的业务逻辑完全独立于服务网格，你可以将其视为一种网络抽象。实现你服务的业务功能是你的责任。\n\n应用程序不同部分之间如何共享数据可以通过服务网格进行控制，服务网格是构建在应用内部的专用基础设施层，用于管理这种通信。应用不同部分之间的交互良好程度（或否）可以通过这个可见的设施层进行记录，随着应用的增长，优化通信和避免停机变得更容易。\n\
  \n应用程序的每个部分被称为“服务”，它们依赖其他服务为用户提供所需。作为一个在线零售应用的用户，如果你想买东西，你需要知道商品是否有货，这就是为什么与公司库存数据库通信的服务需要与产品网页通信，而产品网页本身又需要与用户的在线购物车通信。零售商为了增加业务价值，最终可能会构建一个为用户提供应用内产品推荐的服务。为了进行推荐，这个新服务将与产品标签数据库通信，并且还需要与产品页面所需的相同库存数据库通信——这是许多可重用的移动部件。\n\
  \n通过这种方式，现代应用程序被拆分为服务网络，每个服务执行特定的特定的业务功能。一个服务可能需要从其他几个服务请求数据以执行其功能。但就像零售商的库存数据库一样，如果某些服务请求过载了怎么办？这时就需要服务网格来优化所有移动部件的协同工作方式，并将请求从一个服务路由到下一个服务。\n\
  \n# 但微服务不已经做到这一点了吗？\n\n在微服务架构中，开发者可以在无需完全重新部署的情况下更改应用的服务。小团队构建单个微服务，并灵活地选择自己的工具和编程语言。微服务可以单独失败而不会升级为整个应用程序故障，并且它们是独立构建并相互通信的。\n\
  \n![](img/Figure-4.6.jpg)\n\n**图 4.6:** 微服务的服务间通信\n\n服务间通信使微服务可能。管理通信的逻辑可以编码到每个服务中，而不需要服务网格层，但随着通信变得复杂，服务网格会变得更有价值。服务网格是一种将大量离散服务组合成功能性应用程序的方法，适用于具有内置微服务架构的云原生应用。\n\
  \n# 服务网格的工作原理\n\n服务网格并没有为应用的运行时环境引入新功能，任何架构的应用一直需要规则来规定请求如何从 A 点到达 B 点。服务网格将管理服务间通信的逻辑从单个服务中提取出来，并将其抽象到基础设施层，这就是它的不同。\n\
  \n为了实现这一点，服务网格作为网络代理数组构建在应用中，这在企业 IT 中是一个熟悉的概念：\n\n*   你公司的 Web 代理首先接收你对页面的请求。\n\
  *   请求在通过代理的安全措施后被发送到托管该页面的服务器。\n*   再次经过其安全措施检查后，页面返回给代理。\n*   从代理处，它最终发送给你。\n\n\
  ```\nYour ------------ 1--------------------→ Web ------------ 2 --------→ Web\n\
  Computer ←--------- 4 ----------- Proxy ←--------- 3 ----------- Server\n```\n\n\
  在服务网格中，请求通过其自身基础设施层中的代理在微服务之间路由。构成服务网格的单个代理有时被称为“侧边车”（sidecars），因为它们运行在每个服务的旁边，而不是内部内部。这些“侧边车”代理组合在一起与每个服务解耦，形成了一个网格网络。\n\
  \n在微服务旁边，一个侧边车代理运行并将请求路由到其他代理；这些侧边车共同形成了一个网格网络。\n\n每个微服务都需要编写逻辑来管理服务间通信而无需服务网格，这意味着开发者更少关注关注业务目标，而且因为管理服务间通信的逻辑隐藏在每个服务内部，这也意味着通信故障更难诊断。\n\
  \n# 使用服务网格优化通信\n\n通信环境是复杂的，因为当容器中运行现有服务的实例实例出现或向应用中添加新服务时，它会引入新的可能故障点。如果没有服务网格，在复杂的微服务架构中，定位问题发生的地方几乎是不可能的。\n\
  \n由于是服务间通信的各个方面都会被服务网格捕获为性能指标。这导致了更高效、更可靠的服务请求；随着时间的推移，服务网格使可见的数据可以应用于服务间通信的规则。\n\
  \n服务网格可以收集数据，例如在给定服务失败时重试成功之前花费了多久。可以编写规则来确定重试该服务之前的最佳等待时间，随着给定服务失败时间的数据聚合，这确保了系统不会因为不必要的重试而过载。\n\
  \n## 未来计划\n\n\n\n\n如果你正在为了满足业务需求而构建微服务，你可能预见到未来会有某些需求，例如快速扩展和添加新功能。在发布一年后，微服务架构将变得大不相同。在对业务产生最小干扰的情况下，首先，微服务内部构建的库可能能够处理服务间的通信。但如果你通过增加规模和功能来充分发挥微服务的潜力，这种情况不会维持多久。随着服务被请求过载，开发者花费了越来越多的时间为每个服务编写请求逻辑，这可能会导致问题。\n\
  \n服务网格（Service mesh）能够实现：\n\n*   开发者可以专注于添加业务价值，而不是连接服务。\n*   由于请求逻辑形成了一个与服务并行的可见基础设施层，问题变得更容易被识别和诊断。\n\
  *   因为服务网格可以将请求重路由绕开故障的服务，因此应用程序对停机更具韧性。\n*   可以通过性能指标建议方法，以优化运行时环境中的通信。\n\n## 服务网格的角色\n\
  \n处理负载均衡和服务服务发现等核心网络任务是服务网格的基本职责。服务网格引入了断路和故障注入等高级策略；除了这些，它还满足了云原生应用对网络性能的需求。\n\n\
  在复杂的微服务系统中，故障是常有的，但网络重路由、重试、主动失败以及报告这些故障的能力才是关键。\n\n## 服务网格负载均衡\n\n在云原生应用中，`Load\
  \ balancing` 是动态的，由于所有移动部件的存在，它可能会有不同的性能。在负载均衡器向它们发送请求之前，服务网格需要考虑单个实例的健康状况。它可以通过拦截或绕过不健康实例来路由流量，从而帮助避免紧急情况并提供更可靠的服务。\n\
  \n服务网格的服务发现部分可能会被负载均衡器主动轮询以检查健康实例，或者仅根据性能被动响应失败请求并切断通往实例的流量。\n\n为了决定如何在网络中路由流量，服务网格使用了算法进行负载均衡。在过去，路由是简单的，使用轮询或随机路由等方法。在现代服务网格中，负载均衡算法会考虑后端实例的延迟和可变负载。\n\
  \n## 服务网格中的服务发现\n\n`Discovery of Service` 是在创建新实例时识别它们并记录从网络中移除实例的过程。为了负载均衡的正常运行，此记录至关重要，因为只有健康且可用的后端实例请求请求会被处理。\n\
  \n在动态微服务应用中，服务发现应该自动发生，这是通过让负责启动和停止系统的工具报告每个事件来实现。在 Kubernetes 中，`ReplicationController`\
  \ 负责实例的生命周期。\n\n## 旁路代理 (Proxy sidecar)\n\n传统上，负载均衡器位于客户端和服务器之间，但在高级服务网格中，旁路代理被附加到客户端库中，这确保了每个客户端都能平等地访问负载均衡器。此外，还避免了传统负载均衡器最大的缺点——单点故障。\n\
  \n实现分布式系统服务网格的首选方式是旁路代理。\n\n## 服务网格监控\n\n`Visibility` 是云原生应用成功网络化的关键，服务网格有多种方式来实现监控。它提供了延迟、带宽和运行时间监控等网络性能指标的组合。它为事件提供详细的日志以助于故障排除，并且涵盖了堆栈的每一层——主机、容器、pod\
  \ 和集群。\n\n分布式追踪是可见性的关键因素；每个请求在通过网络时都会获得一个 `ID`，并显示每个请求在通过网络时所经过的路径。你可以借此判断网络哪些部分或哪些实例运行缓慢或无响应，并理解需要修复的内容。\n\
  \n由于微服务应用复杂性的增加，仅仅在实例上重现错误并不容易。要理解请求路径并识别所有问题区域，你需要强大的监控工具。\n\n## 服务网格工具\n\n`Linkerd`\
  \ 和 `Istio` 是目前最突出的两种服务网格工具。为了采用服务网格方法处理网络，`Linkerd` 是第一个在许多生产负载中被广泛采用的工具。尽管 `Istio`\
  \ 晚一年发布，但现在增加了额外的管理层。\n\n## Pik-Pay 超市的微服务架构案例研究\n\nPnP 正在构建一种基于微服务架构的解决方案。\n\n\
  ## Pik-Pay 超市的介绍\n\nPnP 提供定制化的杂货配送，它是一家基于云的在线杂货店。针对那些“下雨天”时刻，即客户需要杂货但无法前往实体店的时刻。\n\
  \n## 业务场景\n\nPnP 支持三种不同的订单选项，客户可以：\n\n*   通过 Web 界面或移动应用程序向其中一家经过批准的杂货店下单。\n*  \
  \ 通过 Web 界面或移动应用程序向 PnP 发送杂货清单。\n*   通过从 PnP 杂货列表中选择物品来下单。\n\n两种配送选项如下：\n\n*   通过短信确认配送，提供上门配送选项。\n\
  *   从其中一个 PnP 收集点提取订购杂货的自提选项。\n\n要成功下单，客户必须接受一组限制条件：\n\n*   客户应拥有一个状态良好的账户（少于 5\
  \ 个“洪水”；即负分）。\n*   客户应注册一个有效的支付方式。\n*   总重量不超过 25kg，订单限制为 10 件物品或更少。\n*   PnP 不保证特定品牌。\n\
  *   从订单确认到请求配送，有四小时的窗口期。\n*   配送地址应为物理地址。\n*   配送地址必须在市中心 25km 内。\n*   客户必须在 24\
  \ 小时内提供反馈，否则将获得“洪水”。\n\nPnP 不拥有任何库存、供应链、分销渠道或数据中心。对于所有这些服务，他们利用其他服务提供商，并通过仔细的选择流程和服务水平协议\
  \ (SLA) 来管理质量。\n\n## 基于微服务架构的解决方案\n\n对于基于 MSA 的解决方案，推荐的方法是从业务需求驱动并解决业务流程。\n\n在本案例研究中，检查了\
  \ PnP 接收订单子流程的 MSA 解决方案。突出了 MSA 的特性和原则，并关注构建块。\n\n\n\n\n![](img/Figure-4.7.jpg)\n\
  \n**图 4.7:** PnP 的业务流程\n\n# 订单交付流程\n\n如图所示，接收订单业务流程的步骤可以拆分为如下：\n\n![](img/Figure-4.8.jpg)\n\
  \n**图 4.8:** 接收订单业务流程的步骤\n\n# 接收订单子流程的分解\n\n更细粒度的活动在之前的流程中显示。\n\nPnP 希望每个原子级业务活动都由一个独立且自成一体的微服务来完成，并遵循\
  \ MSA 的单职责原则。他们已经意识到需要外包这项开发工作，因为 PnP 是一个仅由三名 IT 团队成员组成的精益组织。\n\n对于每个业务流程，PnP 都会识别业务所有者，并由其负责创建自治团队来满足该业务流程的需求，充分利用\
  \ MSA 的去中心化治理和多语言开发模型。他们还建立了如图所示的精益企业治理框架，以避免完全的无政府状态。\n\n# PnP 的 MSA 治理框架\n\n![](img/170.jpg)\n\
  \n与 MSA 原则一致，每个微服务由单一团队所有。一个团队可以拥有多个微服务，但反之则是不的。每个团队在业务活动所有者的领导下是自治的，也就是说它们自己管理其每个微服务的整个生命周期。在企业治理委员会上，业务所有者和架构师拥有席位，以确保企业治理模型被每个微服务团队正确利用。\n\
  \n为了允许每个微服务团队的自治性，企业治理的范围被保持在最小且非侵入的。\n\nPnP 与一个框架共同标准化了一套 MSA 参考架构，每个微服务团队都将利用该框架。\n\
  \n## PnP 的微服务参考架构\n\n参考架构将被利用，每个团队将开发、部署和管理各自的微服务。\n\nPnP 实现的微服务与 MSA 的特性一致，每个微服务执行一个单一业务活动，且执行得很好；每个微服务都是独立的、无状态的，并作为多个并行实例生成，以确保高可用性。\n\
  \n所有这些微服务都由应用程序编排，或由生成的事件触发。\n\n## 账户登录微服务\n\n该微服务通过验证用户身份和安全凭据并根据一组业务规则确保账户有效，允许用户登录。\n\
  \n微服务 API 接收一个由用户凭据和账户信息的加密数据对象，查询企业 `身份与访问管理` (`IAM`) 解决方案来验证用户凭据，获取用户身份验证令牌和账户标识符。\n\
  \n为了从云端 CRM 解决方案提供处检索账户历史，使用了账户标识符。\n\n微服务的内存存储持久了规则并应用它们来确定账户状态。如果所有验证通过，该服务将生成三个令牌：\n\
  \n*   用于接收订单事务的用户令牌的`存活时间` (`TTL`)\n*   一旦整个订单交付事务完成，事务令牌过期\n*   用于监控和审计事务的服务\n\n\
  ## 接收订单微服务\n\n该微服务通过验证用户身份和安全凭据并根据一组业务规则确保账户有效，允许用户登录。\n\n微服务 API 接收一个由用户凭据和账户信息信息的加密数据对象，查询企业\
  \ `身份与访问管理` (`IAM`) 解决方案来验证用户凭据，获取用户身份验证令牌和账户标识符。\n\n为了从云端 CRM 解决方案提供处检索账户历史，使用了账户标识符。\n\
  \n微服务的内存存储持久了规则并应用它们来确定账户状态。如果所有验证通过，该服务将生成三个令牌：\n\n*   用于接收订单事务的用户令牌的`存活时间` (`TTL`)\n\
  *   一旦整个订单交付事务完成，事务令牌过期\n*   用于监控和审计的服务\n\n## 提供估算\n\n商品的价格取决于这些商品的当前市场状况，属于无库存模型；因此它提供了估算范围。\n\
  \n## 确认订单\n\n该微服务触发供应链以采购子流程并完成订单，同时向客户发送订单完成确认，以及确认 ID 和交付说明。\n\n## 基于微服务的打车 App\n\
  \n打车平台开发是客户的需求，他希望以 Web 应用程序或手机应用的形式来运行该 App，这是实现跨平台的要求之一。\n\n\n\n\n每个组件在应用程序描述中都有涵盖，并且它们具有清晰的边界，非常适合实现为独立的微服务。乘客服务的目标是存储/更新乘客数据。行程管理服务负责与出租行程相关的数据创建/处理。支付组件负责在行程结束后控制账单并收取费用。对于针对浏览器和智能手机的用户界面，还考虑了一个单独的微服务。\n\
  \n开发团队的组织方式是分配一个专门团队负责单一服务，专注于该主题并生成相关的知识。为了构建一个满足客户要求的健壮微服务架构模式，团队必须以最佳方式表现良好。\n\
  \n每个服务都提供一个可以供其他服务使用的 API。在交换 API 及其服务指定的需求方面，专门团队之间相互协作。大多数服务使用 `REST` 作为同步的、基于请求/响应的进程间通信机制，并使用\
  \ `JSON` 作为消息格式。使用上述机制，例如行程管理微服务调用乘客服务来验证账户是否激活。在行程管理和调度器之间，组织了异步的发布/订阅交互（当创建新行程时），后者允许定位可用驱动程序。使用\
  \ `Apache Kafka`（一个带有 `Java` 客户端的消息系统）来实现上述交互。\n\n在服务的实现部分，选择了 `Grails 3`（一个基于 `Groovy`\
  \ 的强大 `JVM` 框架）。因为它提供了暴露 `REST API`、解析 `JSON` 以及使用 `RestBuilder` 发送 HTTP 请求的机制，因此具有巨大的微服务支持潜力。为了使开发过程更简单，`Groovy`\
  \ 语言在 `Java` 之上增加了大量的语法糖。开发者不再编写模板代码，而是专注于业务逻辑的实现。然而，使用 `spring boot` 的 `Java` 用于编写具有高性能要求的的服务。\n\
  \n请求不是直接由客户端应用程序（浏览器或智能手机）发送到服务的，而是仅通过 `API Gateway` 发送。为了允许并发处理多个独立请求，它们在 `RxJava`\
  \ 中实现了它。\n\n在分布式系统环境中，为了与其他服务交互，服务需要“知道”其他服务的位置。`Apache ZooKeeper` 提供了服务注册和可用服务实例数据库。为了跟踪微服务的网络位置，服务使用\
  \ `Java` 客户端连接到 `Apache ZooKeeper`。\n\n## 开发此应用的结果\n\n作为此应用的结果，开发了一个跨平台、、高效且灵活的应用程序。\n\
  \n# 购物车的应用：一个用例\n\n为购物车开发的购物车应用是一个经典的用例。\n\n当你打开购物车应用时，你看到的只是一个网站。然而，购物车应用在后台有一个接收支付的服务、一个提供客户服务的服务等。\n\
  \n该应用程序是由开发者在单体框架中创建的；如果是这样假设，请参考 `图 4.8`：\n\n![](img/Figure-4.9.jpg)\n\n**图 4.9:**\
  \ 购物车应用的单体框架\n\n在单一的底层数据库下，这里所有的功能都整合在一个代码库中。\n\n市场上出现了一个新品牌，假设开发者想将即将推出的品牌的所有细节放入此应用程序，那么他们不仅需要为新标签重做服务，还必须重构整个系统并相应部署。\n\
  \n该应用程序的开发者决定将应用程序从单体架构转向更新的架构，以避免此类挑战。要理解购物车应用的架构，请参考下图：\n\n![](img/Figure-4.10.jpg)\n\
  \n**图 4.10:** 购物车应用的架构\n\n这意味着开发者没有为 Web 创建微服务、为逻辑创建微服务或为数据库创建微服务；相反，他们为搜索、推荐、客户服务等创建了独立的微服务。\n\
  \n这种架构不仅有助于购物车应用程序以这种类型轻松地构建、部署和扩展，还帮助开发者克服了以前架构所面临的所有挑战。\n\n## 微服务架构\n\n以下是微服务架构的细节：\n\
  \n*   不同的服务（如搜索、构建、配置和其他管理功能）可以由来自不同设备的不同客户端使用。\n*   在所有服务根据其领域和功能分离后，它们被进一步分配到各个微服务。\n\
  \n![](img/Figure-4.11.jpg)\n\n**图 4.11:** 微服务架构\n\n*   为了在执行其功能的同时在自己的数据库中捕获数据，这些微服务拥有自己的负载均衡器和执行环境\n\
  *   所有微服务之间的相互通信通过 `REST` 或消息总线（这是一种无状态服务器）完成。\n*   通过服务发现的帮助，微服务知道它们的通信路径并执行自动化和监控等操作能力。\n\
  *   通过 `API gateway`，微服务执行的所有功能都通信给客户端。\n*   `API gateway` 连接所有内部节点；因此，任何连接到 `API\
  \ gateway` 的人都会自动连接到整个系统。\n\n## 微服务的特征\n\n微服务的特征如下：\n\n*   以便整个应用程序可以容易地构建、更改和扩展，系统内部的服务在很大程度上是解耦的，即解耦性。\n\
  *   微服务的处理被视为独立的组件，这些可以被容易地替换和升级，即组件化。\n*   专注于单一能力，微服务非常简单，即业务能力化。\n\n    ![](img/Figure-4.12.jpg)\n\
  \n    **图 4.12:** 微服务的特征\n\n*   使开发者和团队能够独立于彼此而工作；从而提高速度，即自主性。\n*   通过软件创建、测试和审批的系统化自动化，它允许软件的频繁发布，即持续交付。\n\
  *   微服务将应用程序视为它们负责的产品，而不是关注于将应用程序视为项目；即责任制。\n*   用正确的工具做正确的事，是去中心化治理的重点，这意味着没有标准的模式或任何技术模式。为了解决他们的问题，开发者有自由选择最实用的工具。\n\
  *   敏捷性为微服务提供了对敏捷开发的支持。任何新功能都可以被快速开发并再次丢弃。\n\n## 微服务的优势\n\n*   根据其个人功能，所有微服务都可以被容易地开发，即独立开发。\n\
  *   根据其服务，它们可以单独部署到任何应用程序中，即独立部署。\n\n    ![](img/Figure-4.13.jpg)\n\n    **图 4.13:**\
  \ 微服务的优势\n\n*   即使应用程序的某个服务无法工作，系统仍然继续运行，即故障隔离。\n\n\n\n\n*   构建同一应用程序的不同服务时，可以使用不同的语言和技术，即混合技术栈。\n\
  *   不需要同时扩展所有组件，因为每个组件可以根据需要进行扩展，即细粒度扩展。\n\n## 微服务设计：最佳实践\n\n在当今的世界中，复杂性已经渗透到产品之中。微服务架构的承诺是让团队能够更好地扩展和运行。\n\
  \n设计微服务的最佳实践如下所示：\n\n*   对于每个微服务，分离数据存储\n*   在相似的成熟水平上保持代码\n*   对于每个微服务，分离构建过程\n\
  *   部署到容器中\n*   将服务器视为无状态\n\n## 微服务示例\n\n以下给出了一些微服务的示例。\n\n## Java 微服务\n\n开发微服务，Java\
  \ 是最好的语言之一。你可以为 Java 平台使用几个微服务框架，例如 `Dropwizard`、`JHipster`、`Spark` 框架、`Spring`\
  \ 框架、`Swagger`、`Play` 框架以及 `Vert.x`。\n\nJava 中构建微服务最流行的方法是使用 `Spring Boot`，它是构建在\
  \ `Spring` 平台上的工具，能够以最少的配置设置独立的 `Spring` 应用。通过自动配置 `Spring` 和第三方类库，它可以节省大量时间。\n\n\
  需要执行以下步骤：\n\n1.  为了让微服务能够相互发现，使用集成在 `Spring Cloud` 中的 `Eureka` 注册服务器创建服务注册。\n2.\
  \  使用 `Spring Boot` 创建一个名为 `Account Service` 的账户管理微服务。\n3.  要访问该微服务，使用 Spring 的\
  \ `RestTemplate` 类创建一个 Web 服务。\n\n应用程序的结构如图所示：\n\n![](img/Figure-4.14.jpg)\n\n**图\
  \ 4.14：** 程序的结构\n\n在实际应用中，Web 服务会向多个微服务发送请求。\n\n使用 Java 构建微服务，`Spring Boot` 是一个很棒的工具；然而，你也可以其他框架。\n\
  \n## Docker 微服务\n\n在目前的开发领域，最大的趋势之一是容器化。构建微服务，`Docker` 是一个优秀的工具，它是最流行的容器化平台。在 `Docker`\
  \ 中结构化微服务，你有不同的选择。\n\n你可以将每个微服务部署在自己的 `Docker` 容器中，也可以将一个微服务拆分为多个进程并在单独的容器中运行每个进程。\n\
  \n运行多容器应用程序，你还可以使用 `Docker compose`。由于你不需要单独创建和启动每个容器，它可以为你节省大量时间。\n\n你可以使用 `Docker\
  \ compose` 通过 YAML 文件配置你应用程序的微服务。\n\n如果你有一个多个容器的大型应用程序，还可以利用容器编排平台。`Docker Swarm`\
  \ 和 `Kubernetes` 是两个最流行的工具，它们都允许将容器部署到计算机集群而不仅仅是单台机器。\n\n`Docker Swarm` 是 `Docker`\
  \ 的原生编排工具，嵌入在 `Docker` 引擎中。目前，最流行的编排平台是由 Google 创建的 `Kubernetes`。`Kubernetes` 具有更高的定制性和更高的容错性，而\
  \ `Swarm` 适合 `Docker` 生态系统且于设置。\n\n管理容器集群，以下是 `Docker` 的示例图：\n\n![](img/Figure-4.15.jpg)\n\
  \n**图 4.15：** Docker 管理的容器集群\n\n对于较小的应用程序，你不需要容器编排工具；但当你处理多个微服务时，你可能希望自动化容器管理。\n\
  \n## 云微服务\n\n由于微服务是轻量级且易于扩展和部署的，它们经常作为云应用程序运行。流行的云平台提供了许多微服务友好的特性，例如按需获取资源、按需付费、基础设施即代码、持续部署和交付、托管服务（如处理扩展、软件配置和优化、自动软件更新等），并提供了大量的编程语言选择、操作系统、数据库技术，以及如\
  \ `Docker` 和 `Kubernetes` 等内置工具。\n\n你可以充分利用基础设施，因为云中的微服务通常部署在容器中。此外，容器是隔离的、可以随处运行并创建一个可预测的环境。然而，在不使用容器的情况下在云部署微服务也是可能的。\n\
  \n有时这是更好的选择，尽管后期方案并不常见。例如，不使用容器，`WeatherBug` 直接在 `Amazon EC2` 上运行微服务，决定完全跳过 `Docker`\
  \ 和容器化，以避免额外的开销和复杂性。\n\n## 微服务架构：实践\n\n在这里，我们将构建一个微服务应用，它消费不同的可用服务。微服务并不是构建应用程序的一种低成本的方法，因为我们构建的每一个服务都是如此。\n\
  \n## 系统的配置与设置\n\n使用微服务实现，你将创建一个 Java 应用程序。你将创建一个自定义服务，其输出将作为输入。\n\n## 应用程序架构\n\n\
  开发微服务应用程序，请遵循以下步骤：\n\n### 步骤 1：创建 SOAP 服务的客户端\n\n为了学习 Web 服务，有几个免费的 API。我们将使用 `http://www.webservicex.net/`\
  \ 的 GeoIP 服务来实现我们的目的。该网站 `webservicex.net` 上的链接提供了 WSDL 文件，根据此 WSDL 生成客户端，你需要在终端中运行此命令：\n\
  \n```wsimport http://www.webservicex.net/geoipservice.asmx?WSDL\n```\n\n此命令会将所有所需的客户端生成在一个名为\
  \ `SEI` 的文件夹下，该文件夹以服务端接口命名。\n\n### 步骤 2：创建你的自定义 Web 服务\n\n需要构建一个基于 Maven 的名为 `CustRest`\
  \ 的 API。完成后，你会发现一个名为 `MyResource.java` 的类。使用以下代码更新该类：\n\n```java\npackage com.csc.custrest;\n\
  \nimport javax.ws.rs.GET;\nimport javax.ws.rs.Path;\nimport javax.ws.rs.Produces;\n\
  import javax.ws.rs.core.MediaType;\n\n@Path(\"myresource\")\npublicclassMyResource{\n\
  \n    @GET\n    @Produces(MediaType.TEXT_PLAIN)\n    publicString getIt(){\n   \
  \     return\"IND|INDIA|27.7.65.215\";\n    }\n}\n```\n\n一旦一切完成，在服务器上运行此应用程序。在浏览器中，你应该得到以下输出：\n\
  \n![](img/Figure-4.16.jpg)\n\n**图 4.16：** 创建你的自定义 Web 服务——输出\n\n\n\n\n\n这是一个 Web\
  \ 服务器，它在被调用时会返回一个字符串对象。这是一个输入服务，提供可以被其他应用程序消费的输入以生成记录。\n\n### 步骤 3：配置另一个 Rest API\n\
  \n在这一步中，消费位于 `services.groupkt.com` 的另一个 Web 服务，它在被调用时将返回一个 JSON 对象。\n\n### 步骤 4：创建\
  \ JAVA 应用程序\n\n按照如下截图所示，选择 `New Project` | `JAVA project` 并点击 `Finish`，创建一个普通的 Java\
  \ 应用程序：\n\n![](img/Figure-4.17.jpg)\n\n**图 4.17：** 创建一个新的 Java 应用程序\n\n### 步骤 5：添加\
