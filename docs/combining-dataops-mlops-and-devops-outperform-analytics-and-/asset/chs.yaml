  \ 工具的步骤，以及属于 `DevOps` 组合部分与列出的最佳实践相关的工具。\n\n接下来的讨论是关于如何设置 `CI/CD 流水线`，随后是使用 `Docker`\
  \ 和 `Jenkins` 构建 `CI/CD 流水线` 的实操练习。\n\n接下来是关于量子计算 DevOps 的讨论，涵盖了适用于任何团队的量子计算 DevOps\
  \ 方法的五个步骤——混合量子应用——DevOps 实践、持续集成、自动化测试、持续交付、应用监控，并讨论了量子计算 DevOps 中的内部和外部循环。\n\n\
  接下来，我们涵盖 `DataOps` 最佳实践，并认为 `DataOps` 是业务数据价值的关键。\n\n任何 `DataOps` 解决方案都应遵循这些最佳实践以充分利用数据。\n\
  \n我们是否会进一步描述实施 `DevOps` 和 `DataOps` 有何优势？\n\n下一节将讨论 `MLOps` 最佳实践。`MLOps` 是使用代码和最佳实践将数据科学和机器学习解决方案运营化的过程，以提高效率、速度和健壮性。`MLOps`\
  \ 将 `DevOps` 概念应用于机器学习系统，以便更快地产生更好的 `ML` 模型并创建数据驱动文化。我们还描述了用于数据和流水线版本控制、运行编排、实验跟踪与组织、超参数调优、模型服务以及生产模型监控的最佳\
  \ `MLOps` 工具。最后，你将获得在实时项目上手操作的经验。\n\n## DevOps 的最佳实践\n\n敏捷是围绕迭代开发的一系列方法，旨在使任务更小、更易管理并增加协作。\n\
  \n`DevOps` 是一种软件开发方法，通过结合敏捷原则和实践（如增加自动化和改进协作），使团队能够更快、更可靠地构建、测试和发布软件。\n\n开发、测试和部署出现在敏捷和\
  \ `DevOps` 中。然而，敏捷止于运营，而运营是 `DevOps` 不可缺的一部分。`DevOps` 有助于编写应用程序软件的开发者与在生产环境中运行软件的运营团队结合，同时也构建和维护运行程序的基础设施。开发者和运营团队在整个\
  \ DevOps 环境的应用、部署和管理过程中并肩工作。\n\n`DevOps` 可以被认为是敏捷实践的演进，也可以被认为是敏捷缺失的环节。它试图将敏捷方法的创新应用于运营过程。同时，它也是敏捷缺失的环节，因为某些敏捷原则只有在使用\
  \ DevOps 实践时才能以最完整实现。例如，敏捷文档多次提到软件的持续交付，但由于交付管道包含了运营考量，持续交付通常被视为 DevOps 实践。跨团队的改进沟通对于放大反馈循环是必要的。敏捷（特别是\
  \ `Scrum`）通过各种仪式（如每日站、计划会议和回顾）帮助促进这种沟通。\n\n*   敏捷的重点是开发者与产品管理之间的协作——DevOps 包含了运营团队\n\
  *   软件从构思到代码完成的流以敏捷为中心——DevOps 的重点延伸到交付和维护\n*   迭代开发和小批次是敏捷的重点——DevOps 的重点更多在于测试和交付的自动化\n\
  *   敏捷为开发者增加了计划工作的结构——对于运营团队而言，DevOps 纳入了非计划工作\n\n敏捷宣言明确优先考虑个人和互动、可工作的软件、客户协作以及响应变化。这些显然是\
  \ `DevOps` 同样的事项，但将其范围从开发过程扩展到了系统管理和应用运行。\n\n\n\n\n\n此外，敏捷软件开发的十二原则包含了对 DevOps 原则的引用。例如，对持续集成与交付的强调、小批次工作并频繁发布以及使用自动化的方法在敏捷软件开发的十二原则中均有涉及。\n\
  \n最终，敏捷和 DevOps 的目标是相同的：提高软件开发的速度和质量，如果不谈及后者，谈论前者毫无意义。\n\n它适用于每一个软件项目，无论架构、平台或目标如何。云原生和移动端应用、应用集成、现代化和多云管理只是其中的几个用例。\n\
  \nDevOps 部署依赖于一套集成的技术集合，以消除手动任务、减少错误、提升团队敏捷性，并突破小型孤立团队的限制。\n\n## 利益相关者的积极参与\n\n\
  DevOps 基于这样一个理念：开发人员、运维人员和支持人员应该定期紧密合作，并且应该积极寻求协作并将对方视为至关重要的利益相关者。敏捷社区已经采用了极端编程（XP）中的“现场客户”技术，这鼓励敏捷开发者与业务部门直接协作。敏捷方法通过“利益相关者积极参与”这一原则更进了一，该原则指出开发者应该与所有利益相关者（包括运维和支持人员）紧密合作，而不仅仅是业务利益相关者。这是一条双行道，运维和支持人员必须愿意与开发者紧密合作。\n\
  \n## 自动化测试\n\n由于敏捷软件开发者是“质量驱动的”，他们的首要目标是编写高质量代码，并尽可能频繁、尽早地进行测试。自动化回归测试是敏捷团队中的常用技术，而且有时会扩展到测试优先的方法，如测试驱动开发（TDD）和行为驱动开发（BDD）。敏捷团队的质量水平高于非敏捷团队，因为他们每天都会运行多次自动化测试套件，并立即纠正发现的任何故障。这对运维团队来说是一个极好的消息，因为他们在接受发布到生产环境之前，要求解决方案具有适当的质量。\n\
  \n## 集成配置管理\n\n通过集成配置管理（`CM`）方法，开发团队不仅在解决方案层面应用配置管理，还会考虑解决方案与组织其他基础设施之间的生产环境配置问题。对于某些工程师来说，这可能是一个巨大的转变，因为他们习惯于仅从当前正在工作的解决方案来考虑\
  \ `CM`。在 DevOps 体系下，开发者必须具备企业意识并考虑大局。他们的解决方案将如何与其他生产资产交互并从中受益？正在创建的解决方案会被其他资产使用吗？这意味着开发团队将理解并管理其产品的整套依赖关系。集成配置管理允许运维人员理解新版本发布的潜在影响，从而轻松确定何时进行新版本发布。\n\
  \n## 集成变更管理\n\n从 IT 的角度来看，确保 IT 基础设施成功且有意义地演进以更好地支持整个组织，就是变更管理。在项目团队层面，这已经足够困难了，因为在创建单个解决方案时使用了许多技术，甚至是同类技术的不同版本。由于需要考虑同时在生产环境中运行和交互的大量解决方案，随着\
  \ DevOps 将与运维相关的企业级挑战（此处原文应为挑战）纳入其中，集成的变更管理策略可能会变得复杂得多。通过集成变更管理，开发团队必须与运维团队紧密接触，以理解组织层面任何技术变更的影响。之前的积极利益相关者交互、集成配置管理和自动化测试方法都用于此方法。\n\
  \n## 持续集成\n\n持续集成是一项学科，即每当更新的代码提交到版本控制系统时，通过自动化回归测试（有时还有代码分析）对项目进行开发和验证。`CI` 是一种与\
  \ DevOps 关联的敏捷开发方法，它允许开发者在小型、定期的阶段产生高质量的功能性解决方案，同时对代码错误获得快速反馈。\n\n## 集成部署规划\n\n\
  从开发团队的角度来看，部署规划一直涉及到与组织的运维人员接触。在构建期间，资深开发团队将根据来自开发、运维和支持小组的积极利益相关者投入，进行持续规划。当你实施\
  \ DevOps 策略时，你会很快发现你需要对部署规划采取跨团队的方法，因为运维人员必须与你所有的所有的开发团队协作。运维人员对此很清楚，但习惯于在各自孤立环境中工作的开发团队可能会感到惊讶。如果你的团队还没有这样做，你将需要开始在组织的通用部署计划中竞争发布插槽（release\
  \ slots）。为了支持持续部署，发布工程师将需要为那些足够自律、能够定期实现发布质量要求的敏捷团队扩大可用发布插槽的数量。\n\n## 持续部署\n\n持续部署扩展了持续集成技术，当你的集成在某个沙箱中成功时，你的更改将自动提升到下一个沙箱，并在那里开始集成。这种自动提升将一直持续，直到任何更改需要人工验证，而这通常发生在开发与运维的过渡期间。\n\
  \n持续部署允许开发团队缩短发现新功能到将其部署到生产环境之间的时间，使业务更具响应能力。另一方面，如果开发团队不够自律，持续部署会增加错误进入生产环境的概率，从而运营风险。在企业环境中，上述所有程序都是成功持续部署所要求的。\n\
  \n## 生产支持 \n\n\n\n\n\n这是在解决方案和应用程序进入生产环境后进行监控的操作技术。监控能力由操作系统、应用程序服务器和通信服务等技术基础设施平台提供，这些平台可以被\
  \ `Microsoft Management Console`、`IBM Tivoli Monitoring` 和 `jManage` 等监控程序使用。然而，符合你组织监控基础设施的插桩（Instrumentation）需要整合到应用程序中，以监控特定的应用程序功能，例如特定类型的用户正在使用哪些用户界面（UI）功能。开发团队必须意识到这种运行必要性，或者更好一点，能够访问一个使插桩交付变得简单的的框架。\n\
  \n# 自动化仪表板\n\nIT 业务智能（`BI`）是使用自动化仪表板的实践。这包含两个方面：开发智能和运营智能。开发智能要求使用经过插桩处理以生成指标的开发工具；例如，配置管理（`CM`）工具会记录谁在何时检查了什么以及他们是如何操作的。同样地，持续集成（`continuous\
  \ integration`）解决方案会跟踪构建何时发生、运行了多少次测试、持续了多久、构建是否成功、有多少次测试成功等。这些原始数据随后可以被处理并显示在自动生成的仪表板中。运营智能是应用程序监控的组成部分。通过自动化仪表板为组织的治理团队提供实时数据，组织的整体指标开销可以大幅减少到零。\n\
  \n## DevOps 关乎一种文化吗？\n\n这些是核心的 DevOps 最佳实践，其中成功的关键要素是在整个 IT 业务中建立一种协作和尊重的文化。根据经验，在实施高效的\
  \ DevOps 策略时，人员以及他们合作的方式是成功的主要决定因素。遗憾的是，在组织中引发文化变化比实施几项新程序要挑战得多。\n\n## 选择合适的 DevOps\
  \ 工具\n\n选择合适的 DevOps 工具的步骤如下：\n\n1. 对于开发（Dev）、质量保证（QA）和基础设施自动化团队，要理解协作和共享工具策略。DevOps\
  \ 团队必须制定一套使用共享技术进行跨开发、测试和部署协作的策略。这意味着你们要在一种共享方法上进行协作，该方法整合了 DevOps 流程、沟通与协作规划、持续开发工具、持续集成工具、持续测试工具、持续部署工具以及持续运营和\
  \ `CloudOps` 工具。在此时，制定通用的工具策略并不驱动工具选择。它涉及到决定一个所有人都能认同且能反映你 DevOps 业务目标的通用共享策略。通常，团队内部的误解是由工具选择过程驱动的。尽管工具之间提供了无缝的协作和集成，但通用的\
  \ DevOps 工具策略必须遵循一套共同目标，即自动化一切：在没有人类干预流程的情况下，开发者应该能够将新软件和修改后的软件发送到部署和运行。\n\n2. 使用工具捕获每一个请求。在\
  \ DevOps 流程之外，不应发生任何*临时*（*ad hoc*）工作或更改，每一个新软件或修改软件的请求都应该被 DevOps 工具捕捉。当它在流程中移动时，这与记录软件进度不同。DevOps\
  \ 提供了自动接受来自业务或其他 DevOps 团队其他部分的变更请求的能力。更改软件以适应业务的新税收模型，或更改软件以适应改进数据库访问模块性能的请求都是这些例子。\n\
  \n3. 对于自动化和 DevOps 请求，使用敏捷的 `Kanban`（看板）项目管理，这可以在工具中进行处理。`Kanban` 是一种实施敏捷开发的框架，它将进行中的工作量与团队能力相匹配。它为团队提供了更灵活的计划选项、更快的输出、清晰的焦点以及整个开发周期的透明度。`Kanban`\
  \ 工具允许你看到今天正在做的事情，或者在上下文中查看你的所有项目。它还通过限制进行中的工作量来帮助平衡基于流的方法，以便你不会尝试一次做太多事情。最后，`Kanban`\
  \ 工具可以帮助你改进你的流。当一个工作项完成时，待办列表中的下一个优先级最高的项目将被推向开发。\n\n4. 在手动和自动化的过程中，使用工具记录指标。选择工具来帮助你理解\
  \ DevOps 流程（包括手动和自动）的效率，以判断它们是否对你有利。你必须通过这些工具完成两件事：首先，确定哪些指标与 DevOps 运营相关，例如部署时间与发现的故障；其次，定义无需人工干预的自动解决机制。处理云系统上的软件扩展性问题就是一个例子。\n\
  \n5. 实现测试自动化和测试数据准备工具。测试自动化不仅仅是自动化测试；它是获取代码和数据并执行标准测试程序的能力，以确保代码、数据和整体解决方案的高质量。DevOps\
  \ 需要持续测试。将代码和数据投入流程需要将代码放入沙箱中，为应用程序分配测试数据，并运行数百次或数千次测试，这些测试如果完成，将把代码进一步推向 DevOps\
  \ 流程或将其返回给开发者进行重构。\n\n6. 为每次部署执行验收测试。测试流程的一部分应该描述将包含每次部署的验收测试，包括基础设施、应用程序、数据甚至你将使用的测试套件的可接受程度。负责\
  \ DevOps 测试流程的人员应该花时间定义验收测试，并验证它们是否符合工具集选定的验收标准。这些测试可能由开发或运维随时更新，并且应用程序随时间的改进，新的需求需要构建到软件中，然后需要针对这些新需求进行测试。例如，为了确保组织履行服务协议，你可能需要针对保护特定类别数据的合规性问题修改进行测试。\n\
  \n7. 为了发现差距、问题和效率低下，确保团队之间的持续反馈。最后，需要反馈循环来自动化检测问题的测试与需要工具支持的测试之间的通信。正确的工具必须检测问题并与制品相关联（无论是手动还是自动），以便开发者或操作人员了解发生了什么、为什么发生以及在哪里发生。\n\
  \n\n\n\n该工具应该能够建立通信链，以描述环路中的自动化和人工参与者，这包括与团队每个成员共同修复问题的计划、对使用解决方案的形式达成共识，以及任何所需的后续代码或技术列表。随后，该工具应帮助你定义跟踪，以指示解决方案在推送到生产环境之前是否已通过了自动化测试、自动化部署和自动化操作。\n\
  \n## 工具选择\n\n DevOps 组合的一部分且与列出的最佳实践和步骤相关的工具如下：\n\n![](img/Figure-8.1.jpg)\n\n**图\
  \ 8.1：** 按分类划分的 DevOps 工具\n\n用于 DevOps 选择的工具数量既多又令人困惑，因此通过关注类别和你需要的函数来对其拆解。\n\n\
  ## DevOps 工具——主要类别\n\n主要的工具类别包括以下：\n\n*   **版本控制**：这些工具在软件发布时（无论手动还是自动）跟踪软件版本，包括版本编号以及跟踪配置和任何环境依赖项，例如数据库类型、品牌和版本；操作系统细节；甚至是所需的物理或虚拟服务器类型。该类别包含用于变更管理的工具。\n\
  *   **构建与部署**：在整个 DevOps 过程中，使用自动化软件构建和部署的工具，例如持续开发和持续集成。\n*   **功能与非功能性测试**：列出了自动化测试工具以及端到端自动化的最佳实践。单元测试、性能测试和安全测试都应包含在测试工具中。\n\
  *   **配置与变更管理**：这些工具为软件部署搭建平台，并监控和报告配置、数据或软件的任何更改，确保无论发生什么系统都能恢复到稳定状态。\n\n## 复杂性拆解\n\
  \n为 DevOps 选择合适的工具是一项复杂的工程，因为这些工具是新的，并且对大多数企业开发部门来说在很大程度上陌。如果你遵循这里提供的流程并坚持 DevOps\
  \ 这一概念的目标，那么应该是没问题的。\n\n你必须检查公司在未来几年将面临的变化，并准备好评估你的工具，看看哪些是有效的，哪些需要改进。创建一个实验室，你可以在那里测试各种工具的优势，并定期实验改进\
  \ DevOps 的方法。定期监控 DevOps 过程的要求将持续多年；因此，现在将其纳入规划和工具选择中至关重要。\n\n## 如何设置 CI/CD 流水线\n\
  \n理解 CI/CD 并学习如何设置流水线作为 DevOps 过程的基础至关重要。DevOps 环境的骨干是 CI/CD 实现，它通过自动化构建、测试和部署应用程序来弥合开发与运维团队之间的差距。\n\
  \n让我们来看一个 CI/CD 流水线的场景，你将构建一个要部署在实时 Web 服务器上的 Web 应用程序。\n\n你有一组负责编写代码的开发者，他们将进一步构建\
  \ Web 应用程序。现在，这些代码由开发团队提交到版本控制系统（如 `GIT` 和 `SVN`）。接下来，它进入构建阶段，这是流水线的第一阶段，开发者在这里输入代码，然后代码再次带有适当的版本标签进入版本控制系统。\n\
  \n假设我们有 Java 代码，它在执行之前需要进行编译。通过版本控制阶段，它再次进入构建阶段并在其中进行编译。你从仓库的不同分支中获取该代码的所有功能，将它们合并并最终使用编译器对其进行编译。这整个过程就是构建阶段。\n\
  \n一旦完成构建阶段，你就移动到测试阶段。在这个阶段，我们有各种类型的测试。其中之一是单元测试（你对软件单元进行测试或进行健全性测试）。测试完成后，你就移动到部署阶段，将它部署到分发布服务器或测试服务器。在这里，你可以查看代码，或者在模拟器中查看应用程序。\n\
  \n一旦代码成功部署，你就可以运行另一个健全性测试。如果一切都被接受，就可以部署到生产环境。\n\n同时，在每一步中，如果发生错误，你可以向开发团队发送邮件，以便他们修复。然后他们将将其推入版本控制系统，并返回流水线。\n\
  \n再次，如果在测试期间报告了任何错误，反馈将再次发送给开发团队，由他们修复，如果需要，过程将重复。\n\n这种生命周期一直持续直到我们获得代码/产品，将其部署到生产服务器并在那里对代码进行衡量验证。\n\
  \n你需要理解 `Jenkins` 以及我们如何使用 `Jenkins` 部署演示的代码并自动化整个过程。\n\n我们的任务是自动化整个过程，从开发团队交代码并提交代码到我们将其投入生产环境。我们将自动化流水线，以使整个软件开发生命周期处于\
  \ DevOps/自动化模式。为了实现这一点我们需要自动化工具。`Jenkins` 为我们提供了各种接口和工具来自动化整个过程。\n\n我们有一个 `GIT`\
  \ 仓库，开发团队将在其中提交代码。然后，`Jenkins` 从那里接管，这是一个你可以在其中定义整个作业或任务的前端工具。我们的工作是确保该特定工具或特定应用程序的持续集成和交付过程。从\
  \ `GIT`，`Jenkins` 拉取代码，然后 `Jenkins` 将其移到 `commit` 阶段，在该阶段提交代码。`build` 阶段是编译代码的地方。如果是\
  \ Java 代码，我们在 `Jenkins` 中使用 `maven` 等工具并编译代码。它安装依赖项并编译应用程序。\n\n然后，它移动到分发布服务器使用 `Docker`\
  \ 进行部署。在经过一系列单元测试或健全性测试后，它移动到生产环境。\n\nDocker 是虚拟环境，我们可以在其中创建一个服务器。创建一个整个服务器并部署我们想要测试的制品只需要几秒钟。你可以在几秒内运行整个集群。我们使用\
  \ `Docker` 是因为我们镜像注册表，可以在那里构建镜像并永久存储。你可以随时在任何环境中使用它，它可以自我复制。\n\n## 动手实践：使用 Docker\
  \ 和 Jenkins 构建 CI/CD 流水线\n\n使用 `Docker` 和 `Jenkins` 构建 CI/CD 流水线应遵循以下步骤：\n\n在你的虚拟机中打开终端。使用以下命令启动\
  \ `Jenkins` 和 `Docker`：\n\n`systemctl start Jenkins`\n`systemctl enable Jenkins`\n\
  `systemctl start docker`\n\n注意：如果显示“privileges error”，请在命令前使用 `sudo`\n\n1. 在指定的端口上打开\
  \ `Jenkins`。点击 **New Item**（新建项目）创建一个作业。\n2. 选择 **freestyle** 项目，提供项目名称（`Job 1`），点击\
  \ OK。\n3. 选择 **source code management**（源码管理）并提供 `GIT` 仓库。点击 **Apply**（应用）和 **Save**（保存）按钮。\n\
  4. 然后点击 **Build**（构建）→ **Execute Shell**（执行 shell）。\n5. 提供 shell 命令。在这里，它将构建存档文件以获取\
  \ war 文件。之后，它将获取已拉取的代码并使用 `maven` 安装包。它安装依赖项并编译应用程序。\n6. 点击 New Item 创建新 **Job**。\n\
  7. 选择 **freestyle** 项目并提供项目名称（`Job 2`）并点击 OK。\n\n\n\n\n\n8. 选择 `source code management`\
  \ 并提供 `GIT` 仓库。点击 `Apply` 和 `Save` 按钮。\n\n9. 之后点击 `Build` → `Select Execute Shell`。\n\
  \n10. 提供 shell 命令。在这里，它将启动集成阶段并 `build` Docker 容器。\n\n11. 点击 `New Item` 创建新的 `Job`。\n\
  \n12. 选择 `freestyle` 项目并提供项目名称（`Job 3`），然后点击 `OK`。\n\n13. 选择 source code management\
  \ 并提供 `GIT` 仓库。点击 `Apply` 和 `Save` 按钮。\n\n14. 之后点击 `Build` → `Select Execute Shell`。\n\
  \n15. 提供 shell 命令。在这里，它将检查 Docker 容器文件，然后将其部署在端口号 8180。点击 `Save` 按钮。\n\n16. 现在点击\
  \ `Job 1` → `Configure`。\n\n17. 点击 `Post-Build Actions` → `Build Other Projects`。\n\
  \n18. 提供 `Job 1` 之后要构建的项目名称（这里是 `Job 2`），然后点击 `save`。\n\n19. 现在点击 `Job 2` → `Configure`。\n\
  \n20. 点击 `Post-Build Actions` → `Build Other Projects`。\n\n21. 提供 `Job 2` 之后要构建的项目名称（这里是\
  \ `Job 3`），然后点击 `save`。\n\n22. 现在我们将创建一个流水线视口（pipeline view）。点击“+”符号。\n\n23. 选择\
  \ `Build Pipeline View` 并提供视图名称（`CI-CD pipeline`）。\n\n24. 选择初始作业（`Job 1`）并点击 `OK`。\n\
  \n25. 点击 `Run` 按钮启动 CI/CD 过程。\n\n26. 构建成功后，打开 `localhost:8180/sample.text`。它将运行应用程序。\n\
  \n## 量子计算 DevOps\n\n“量子”一词暗示了系统使用量子力学来计算输出。\n\n量子计算的基本信息单元是量子比特（qubit），它的功能与传统计算中的位（bits）类似，但行为大不相同。与二进制且只能存储\
  \ 0 或 1 的传统位不同，量子比特可以保持所有可能状态的叠加态。\n\n量子计算机利用量子物理的独特特性（如叠加、纠缠和量子干涉）进行计算。传统的编程方法通过这种方式引入了新概念。\n\
  \n量子计算机由三个主要部分组成：\n\n1. 存放量子比特的位置。\n2. 向量子比特传输信号的技术。\n3. 一个可以运行程序并传递命令的传统计算机。\n\n\
  尽管量子计算机无法像传统计算机那样快速地完成所有任务，但在某些领域量子计算机具有产生巨大变化的潜力：量子模拟、密码学、优化、量子机器学习和搜索。\n\n量子计算是利用量子物理在特种硬件上进行计算。\n\
  \n这里讨论了使用 Microsoft Azure 进行量子计算 DevOps 的相关主题。\n\nAzure Quantum 的量子开发工具包（QDK）让量子研究人员和数据科学家能够轻松构建基于\
  \ Azure 可靠性和扩展性基础的量子算法。然而，一个包含经典软件组件的量子算法只能代表大型系统的一部分，导致混合量子系统。因此，对于包含许多任务的系统，构建、部署、监控和演进过程变得更加复杂。\n\
  \n如下所示，当软件包含量子组件时，DevOps 方法必须进行调整。最终结果是获得了一种用于开发、部署和监控混合量子软件的高质量、可重复的方法。\n\n量子对\
  \ DevOps 的所有方面都有影响，我们详细说明如下：\n\nDevOps 被定义为“人员、流程和产品的结合，以向最终客户持续交付价值。” 这一描述为讨论量子部分如何影响\
  \ DevOps 的所有方面提供了一个框架。\n\n*   **人员：** 设计、开发和运行量子算法所需的技能与设计、开发和运行经典组件所需的技能不同。例如，量子信息科学家及相关职位将包含在设计者和开发者中，而运维人员需要了解专门的目标系统，如优化求解器和量子硬件。\n\
  *   **流程：** 整个解决方案的经典和量子组件通常是独立创建的，必须在某处进行组合。因此，你需要协调你的量子和传统的 DevOps 工作。\n*   **产品：**\
  \ 整个解决方案的经典和量子组件通常是独立创建的，必须在某处进行组合。因此，你需要协调你的量子和传统的 DevOps 工作。\n\n微软内部团队如何采用 DevOps\
  \ 驱动的文化，微软 One Engineering System (1ES) 团队提供了相关见解。作为他们的学习经验以及演进这种文化的方法，他们发布了可以适用于任何团队的五个步骤，其中许多步骤适用于量子计算\
  \ DevOps 方法。\n\n## 混合量子应用——DevOps 实践\n\n基础设施即代码 (IaC)\n\n量子工作区和经典环境与任何其他 Azure 环境一样，可以使用\
  \ Azure 管理器模板自动提供。两个目标环境的定义包含在 JavaScript 对象表示 (JSON) 文件中。\n\n运行量子作业和存储输入输出数据所需的所有都包含在\
  \ `quantum environment` 中。连接硬件提供程序及其相应的 Azure 存储账户的 Azure Quantum 工作区用于在作业完成后存储作业结果。此环境应保留在自己的资源组中，以便将这些资源的生命周期与传统资源区分开。\n\
  \n运行经典组件所需的所有其他 Azure 资源都可以在 `classical environment` 中可用。可用资源取决于所选的计算模型和集成模型。你将在每次部署时复制此设置。\n\
  \n两个模板都可以存储在版本控制代码仓库中（例如 Azure Repos 或 GitHub 仓库）。\n\n## 持续集成 (CI)\n\n持续集成是混合量子应用\
  \ DevOps 的关键部分。代码一旦就绪并提交时，必须进行自动测试并集成到软件的其他部分。纯经典部分的测试方法保持不变。Microsoft Azure 良好架构框架为持续的最佳实践提供了建议。量子组件及其集成需要特别关注，因为组件本身具有自己的执行环境。你必须测试控制量子组件的经典代码（即在量子工作区提交和监控作业）。\n\
  \n## 自动化测试\n\n在量子组件的测试中，包含以下活动：\n\n*   在量子模拟器上执行通过 `test projects` 实现的单元测试。\n* \
  \  为了在量子硬件上运行作业，需要 `estimation of resources`。\n*   在量子硬件上执行的测试——可能是 `target production\
  \ environment`。\n\n你可以通过生产环境中经典组件提交量子作业，也可以通过专门为测试编写的组件（如 CLI 脚本）提交。\n\n对于量子组件的要求如下：\n\
  \n\n\n\n\n- 应该合理选择运行测试的环境。在可以访问量子比特寄存器整个状态向量的量子模拟器上，许多测试可以快速运行。对于演示概率行为的测试，则需要量子硬件。\n\
  - 为了确保成功的测试在随后的运行中仍然成功，你必须多次运行覆盖算法中这些概率特性的测试。\n- 必须根据程序执行结果的性质进行验证，这通常需要使用量子特有的工具和技巧。\n\
  \n量子组件在集成期间会与传统组件打包。结果是部署产物，它将在后续步骤中被放置在传统环境中。\n\n## 持续交付 (CD)\n\n持续交付涉及应用程序的构建、测试、配置和部署。如果你的组织支持并拥有\
  \ DevOps 文化，你可以将这些步骤自动化到在生产环境中的部署。\n\n在应用程序的配置和部署过程中，涉及以下步骤：\n\n- 目标环境置备——通过部署存储在存储库中的\
  \ `ARM` 模板，你可以实现环境自动化。每当代码更改时，无需重新置备量子组件。你应在特殊情况下（例如完全且干净的部署）重新置备这些组件，因为量子代码不会持久化在这些组件上（经典组件按需提交作业）。你可以每次代码更改都重新置备经典组件。你可以实施分阶段的方法，并利用\
  \ Azure 计算服务提供的高可用功能来尽地减少部署期间的干扰。\n- 目标环境配置——由于经典组件需要权限提交量子作业，你需要在它们上定义托管身份（例如调度\
  \ `Azure function` 的作业）。通过受控身份，你可以正确地将量子资源的访问限制在仅需要作业调度的组件上。\n- 以提交和监控量子作业，并授予经典组件访问量子工作空间的权限。对于托管身份，为量子工作空间添加者角色分配。\n\
  - 应用程序产物到目标环境——将包含量子作业产物的经典应用程序包部署到所选的计算服务中涉及发送过程。\n\n## 应用程序监控\n\n提交量子作业后，经典组件必须跟踪其进度。可以使用\
  \ `API` 查询量子工作空间的状态。经典组件可以通过应用程序 Insights 中的自定义事件记录量子状态。这会将状态信息与所有其他应用程序日志相结合，允许\
  \ Azure Monitor 对其进行评估和可视化处理。\n\n向云端的迁移有助于运营模式的演进，并重塑运营与开发团队之间的交互。微软记录了团队在这一转型过程中面临的障碍、他们的历程以及通过重新思考\
  \ IT 监控所看到的成果。\n\n总结以上内容。\n\n我们通常在 DevOps 中区分内循环和外循环。\n\n对于量子计算，DevOps 中的内循环和外循环如如图所示：\n\
  \n![](img/Figure-8.2.jpg)\n\n图 8.2：DevOps 中的内循环和外循环\n\n## 外层 DevOps 循环\n\n通常与完整\
  \ DevOps 相关的活动——外循环循环涉及：\n\n- 管理产品待办列表中的工作项\n- 开发和测试软件产物（通过内循环）\n- 集中构建和部署这些产物，包括目标环境的置备\n\
  - 监控运行中的应用程序。测试结果可能会导致待办列表中产生新的工作项。\n\n## 内层 DevOps 循环\n\n在编写、构建和测试代码时，内循环是量子或经典开发者执行的迭代过程。它发生在个人开发者拥有或负责的\
  \ IT 系统上。对于量子计算，DevOps 中存在两个内循环。\n\n对于量子组件，内循环涉及由量子开发工具包启用的以下活动。这些活动通常由量子算法开发领域的专家执行。典型角色包括量子工程师和量子架构师。\n\
  \n1. 编写量子代码\n2. 使用库保持代码的高层级\n3. 与经典软件集成\n4. 在模拟中运行量子代码\n5. 估计资源\n6. 在量子硬件上运行（测试）代码\n\
  \n后三个阶段仅适用于量子计算机。由于量子设备的稀缺，开发者通常并不拥有或拥有独占访问硬件的权限。相反，他们使用集中的硬件，在大多数情况下，他们在生产级硬件上测试他们的开发产物。\n\
  \n在开发环境中，经典组件的内循环包含常见的开发任务，如创建、运行和调试代码。在混合量子应用中，多了一个将量子组件集成到经典组件中的额外阶段。开发者不需要成为量子计算专家。传统的编程能力通常足以实现集成。\n\
  \n结论，随着量子计算的不断演进和更强大的硬件变得可用，开发量子算法正逐渐离开其探索性阶段。开发者需要一种稳健的方法，以确保构建、部署和监控混合量子应用程序的过程是重复且高质量的。在此背景下，量子计算\
  \ DevOps 涉及扩展现有的 DevOps 原则，以支持由经典和量子部分组成的软件开发。\n\n## DataOps 的最佳实践\n\nDataOps 是业务企业能够从数据中提取最大价值的关键。DataOps\
  \ 已成为解锁数据驱动决策能力和推动实际业务增长的关键驱动力，许多组织正努力实现数据驱动，并利用数据分析带来的竞争优势。\n\n## 对于 DataOps 的最佳数据管理实践\n\
  \nDataOps 于 2015 年首次引入，其演进重点关注数据分析团队关注的领域，以及改进跨团队协作和消除孤岛的方法。DataOps 的实施应遵循这些最佳实践以充分利用数据。\n\
  \n### 从小开始，增量构建\n\n敏捷方法论是 DataOps 哲学的灵感，你希望更快地交付数据和代码，但你无法一次性完成。\n\n敏捷的核心原则是增量构建，敏捷数据流程侧重于从子集快速开始，并在结合最终用户反馈的同时专注于增量价值交付。为了简化数据流水线的无缝形成，敏捷数据主数据过程需要是增量的、自动且协作的。\n\
  \n\n\n\n\n数据分析团队获取了大量数据，并最终进行了机器分析。你可以考虑以下情况：当这些数据源可以直接映射到使用这些数据见解的运营团队时。让你的数据开发人员构建支持各种内部操作的应用程序。\n\
  \n为了确保数据始终保持更新，这些新应用程序必须像软件开发项目一样被处理和构建。在你们的数据团队内部，您需要那些能够从源头获取数据、对其进行分析，并将其转化为内部团队可以利用的程度的人。他们可以通过网站或下游应用程序向内部部门发布这些见解。\n\
  \n# 需要创建的业务数据术语表和目录\n\n术语表尝试回答关于数据本身的各种问题，这些大多是关于数据定义的问题，例如组织内不同系统中特定类型数据的技术名称、定义和功能。\n\
  \n目录类似于超集；它们超越了术语表，提供了更多关于数据结构的元数据。对于作为数据终端消费者的团队来说，目录的创建提供了独特的协作机会。通过目录编制的帮助，用户可以理解数据的深层方面，例如其位置、用户以及利用它的最佳实践。\n\
  \n这为你的数据分析团队功能增加了一层自服务。如果有人想了解更多数据或对数据进行更多处理，他们可以在不依赖数据团队的情况下使用数据术语表和目录。\n\n# 用于使用数据自服务机制\n\
  \n当特定特定用例团队没有可用数据时，他们倾向于通过自源这些数据并使用他们能找到任何工具（内部或外部）来为他们的用例准备数据。\n\n为业务用户提供探索、操作和合并新数据源的能力（如自服务数据准备）需要是一项全范围的倡议。访问数据需要成为企业范围的文化转变，而不是将数据准备作为单一用例的工具。\n\
  \n确保数据不仅仅是被使用，是 DataOps 治理的主要问题之一。它还必须确保人员完成反馈循环，并帮助改进数据源和分析过程。\n\n主动的数据分析团队超越了过去和当前的数据用例，预测频繁使用和稀有使用用例的数据需求。这可以通过业务团队和数据团队之间的及时协作来实现。\n\
  \n# 使用自动化预测源变化并避免停机\n\n当数据源更改格式或变得不可用时，影响使用该数据的应用程序是 DataOps 团队面临的关键问题之一，因为这些应用程序往往没有准备好处理变化，从而导致停机。\n\
  \n以最小干扰的方式处理源变化对于企业级 DataOps 团队来说是不可妥协的。一次源变化引起的停机可能会中断多个系统并影响多个团队。\n\n智能的 DataOps\
  \ 系统拥有可以与更新数据源协作的应用程序，这些变化会被自动检测，并且内置了机制以安全地将更改信息传播到受影响的应用程序，实现零（或极）停机。\n\n# DevOps\
  \ 和 DataOps：实施优势有多大？\n\n通过采用 DevOps 和 DataOps，可以在组织的整体运行中看到许多益处。结合 DevOps 和 DataOps\
  \ 的优势如下：\n\n*   **DevOps**: 当将 DevOps 集成到应用程序开发中时，组织可以体验团队之间透明度的提高、更好的沟通和协作，并拥有快速的部署计划。除了轻松修复错误，还确保了最高标准的质量，消除了部署失败和回滚的问题。系统还为应对突发任务做好了准备。这一切允许更快地修复现场站点，并有助于降低整体成本和人数。\n\
  *   **DataOps**: 通过加速工作能力和提高资源回报，DataOps 彻底改变了数据处理，帮助高效解决问题，增强数据安全并通过统计过程控制改进功能。它提供了实时数据见解，并朝着组织目标迈进。\n\
  \n# DevOps 和 DataOps 的最佳实践\n\n为了确保顺利实施，必须非常小心地处理 DevOps 和 DataOps。为了实现目标，必须遵循特定的程序。\n\
  \n**对于 DevOps**: 1. 制定一个计划以促进协作并在负责团队之间建立无懈可击的沟通。2. 大型关键模块应被划分为较小的、可管理的部分。3. 在每个此类部分中应有独立的\
  \ DevOps 处理。4. 为了实现无缝应用程序部署，请使用可用工具。\n\n**对于 DataOps**: 1. 应该重新定义数据存储和分析基础设施，并结合基于集群或冗余的数据存储方法。2.\
  \ 为了获得精确的见解，与最新的数据分析策略保持同步。3. 为了允许结构化和非结构化数据的流转，实践基于微服务的架构和软件。为了实现数据合并的目的，可以使用 `Map\
  \ Reduce`、`Hive`、`Kafka`、`HDFS` 和 `Spark` 等工具。4. 为了于访问和分析大型数据集，强制执行专用的数据库引擎。5. 为了使过程敏捷、高效并有助于团队协作，使用支持工具，如\
  \ `ETL/ELT`、数据治理和目录编制工具以及日志分析器。这些框架和支持工具对于确保基于敏捷的项目管理具有巨大价值，尽管没有专用的软件工具来为 DataOps\
  \ 执行 DevOps。\n\n实施需要团队的极大投入才能在这两种情况下看到成功。\n\n受敏捷、精益、DevOps 和 TQM 的启发，DataOps 的核心原则是持续满足客户、自组织、减少英雄主义、复用以及监控质量和性能。\n\
  \n我们根据上述原则，基于各种用户和供应商的应用案例总结了最佳实践。\n\n## 1. 你的数据环境评估\n\n为了准确掌握当前的数据运营环境并确定应用 DataOps\
  \ 的效果，进行量化是必要的。示例包括当前数据处理时间、向现有数据添加列的时间、为数据分析师提供沙箱的时间等。\n\n### 识别差距（检查当前与目标的差异）\n\
  \n*   在当前过程中，找到发生许多错误或由于手动工作导致消耗时间的部分，并考虑如何改进它。\n\n### 完善整个流程（可视化）\n\n*   通过显示每个部分消耗时间或发生低效工作的部分，整个步骤变得可视化。\n\
  \n## 2. 从小开始\n\n大多数专家建议从最紧迫的阶段开始，因为 DataOps 是一个非常广泛且复杂的过程（基于上一步的可视化所确定的）。\n\n可能会有很多瓶颈，这些负载通常由被称为“数据英雄”的人在晚上以牺牲自己为代价来解决（如果没有这样的人，错误和质量问题就会频繁发生）。\n\
  \n\n\n\n\n通常产生高负荷的任务类型总结如下：数据库架构变更、导致计划外工作并扰乱进度的数据错误、从新数据源添加数据馈送、频繁破坏下游系统的部署流程、进展缓慢的影响评估委员会、配置新的开发环境、跨越单元、集成和系统测试的长周期测试、需要人工干预的手动数据流、过度的开发和测试周期，以及数据工程师、科学家、分析师和业务用户之间缺乏团队合作。\n\
  \n需要制定一个分阶段解决这些问题的计划，因为关注这些负载（瓶颈）发生的区域非常重要。需要各种技术（自动化、新的开源等）来解决这个问题，而且当解决一个问题后，必须再次解决下一个负载。应该建立一套系统，用于立即监控和检测所有已解决负载的问题。\n\
  \n### 3. 建立数据运营部门\n\n为了实施 DataOps，许多组织之间的协作至关重要。由于每个组织都忠实于自己的角色（IT 部门专注于基础设施运营），要全面理解数据领域非常困难。因此，如果可能，为了领导整个组织的协作，直接在数据经理下建立一个独立的数据运营团队是非常重要的。即使很难创建一个独立的组织，将将其整合为一个组织也是一个好主意，以便数据专家进行协作。\n\
  \n此外，只有当数据经理的战略决策获得支持时，这些组织才能与其他组织进行顺畅协作。\n\n### 4. 与组织对齐\n\nDataOps 执行实现交付业务价值所需的必要技术/流程/组织活动，并需要定期检查和调整正在进行的\
  \ DataOps 工作是否符合业务。\n\n持续检查通过 Scrum 以小组织为单位（分析任务）进行，并需要每季度与每个领域的业务专家根据业务优先级调整所有任务（与\
  \ DataOps 相关的任务）的优先级。\n\n对于 DataOps 而言，持续衡量交付的数据是否对业务价值的增长做出贡献，比快速交付数据更重要。\n\n###\
  \ 5. 培训你的团队\n\n当持续教育并理解 DataOps 的价值及其影响时，实际实施和运行 DataOps 系统的组织的生产力就会提高。\n\n### 6.\
  \ 创建端到端的协作跨职能团队\n\n为每个业务组形成一个完整的团队（包括高级数据架构师、数据工程师、BI 开发人员和产品经理）并提供支持，以良好满足客户需求是有效的。\n\
  \n#### 交叉培训\n\n有必要建立一种文化，通过学习和理解彼此的技能/任务来随时填补人力缺，从而创建一个这样的完整团队。这不仅是执行特定任务，还提供了学习其他领域能力的机会。\n\
  \n#### 激励机制\n\n应该根据 DataOps 贡献的成就（数据质量、创建时间等）来给予激励，而不是仅向特定的业务组织提供结果。\n\n### 7. 面重用和自动化的构建\n\
  \n为了运营效率，最大化重用性非常重要。然而，许多数据工程师重复构建自己不共享的程序，并在相同的任务上花费大量时间。DataOps 允许设计可重用的模式、快速应用数据流水线并生成可靠一致的数据。\n\
  \n通过自动化这种数据处理过程，还可以提高生产力。例如，在没有人工干预的情况下，通过能够自动检测源数据变化、转换并应用于分析数据的自动化结构，可以维护数据质量。\n\
  \n### 8. 实现协作式数据开发工具\n\nDataOps 工具对于重用和流程自动化至关重要。通过这些协作工具，开发生产力得到了提高，缩短了部署时间，减少了错误并提高了数据质量。\n\
  \n![](img/Figure-8.3.jpg)\n\n**图 8.3：** DataOps 技术框架\n\n### 9. 专业的 DataOps 解决方案\n\
  \n端到端解决方案（创建、运营化和管理复杂的数据流水线）目前由支持本地/多云的 DataOps 初创公司提供。另一方面，如 `DataKitchen` 等公司并没有使用全位的集成解决方案，而是使用最佳组合（best-of-breed）的方法来构建现有客户系统的数据流水线。为了设计无需编码的数据流水线并在本地/多云上运行，基于\
  \ UI 的工具（如 `StreamSets`）支持了数据分析师/数据工程师。\n\n## 组件解决方案\n\n例如，`unravel` 提供 DataOps\
  \ 性能管理和监控工具，某些解决方案专注于数据流水线的特定领域。特别是，它使用机器学习自动发现性能问题并对这些提供（推荐）解决方案。\n\n## 横向工具\n\n\
  基本上，DataOps 工具是横向关系并形成一个开发平台，每个单元工具都相互连接。这些 DataOps 工具的分类如下：\n\n*   **数据准备工具**\n\
  \    数据流水线由一个可以查询/净化/转换/创建数据的工具组成。\n\n*   **代码仓库**\n    用于管理/共享代码（如 `Spark ETL code`\
  \ 等）是工程师用于版本控制的工具。\n\n*   **配置仓库**\n    存储和管理各种设置值（数据、系统、应用等）的工具。\n\n*   **敏捷项目管理工具**\n\
  \    用于记录/跟踪/报告问题，支持协作的工具（如 `Jira`）。\n\n*   **CI/CD 工具**\n    支持代码分发的 CI/CD 工具，如\
  \ `Jenkins`。\n\n*   **自动化测试软件**\n    自动测试已部署代码并报告结果的工具。\n\n*   **工作编排软件**\n    `Airflow`\
  \ 是一个连接并执行各种作业（shell、应用程序等）的工具。\n\n*   **性能管理工具**\n    衡量系统性能并对其提供（推荐）解决方案的工具。\n\
  \n*   **数据目录**\n    为了让工程师能够方便使用，它是一种管理所有数据集信息的工具。\n\n*   **容器**\n    一种通过容器虚拟化快速方便地部署分析/开发环境的工具。\n\
  \n### 10. 应用质量检查\n\n对于质量控制，快速供应数据和管理数据质量的任务是分开的，并进行单元、集成、运行环境测试等各种测试。由于数据架构的变化，检查部署的模型是否保持准确性且不会对运营工作造成任何障碍。\n\
  \n测试是 DataOps 的重要部分，如果没有这种测试自动化，很难维持一致的数据质量。为了防止系统故障，为了测试系统性能，根据各种监控工具测量当前的系统性能。\n\
  \n### 11. 创建企业数据平台\n\n\n\n\n\n作为一个健壮的企业级数据平台，应该构建 DataOps，使其易支持数据流水线的重用和自动化。此外，通过集成的方式，还可以进行数据治理、安全、血缘以及审计/监控。\n\
  \n## 12. 可移植性\n在没有任何基础设施限制的情况下，它必须经过配置，使其能够在本地/多云环境中执行，以消除对供应商的依赖。\n\n## 13. 安全性\n\
  通过对未经授权访问的控制和数据加密，必须确保数据的安全存储。系统应尽可能自动检测外部访问并对敏感数据进行掩码。\n\n## 14. 数据目录\n通过数据目录存储和管理业务逻辑、数据流水、报告和查询，使分析师和数据工程师能够轻松找到并使用数据。它们是重用和自动化的关键元素。\n\
  \n# MLOps 最佳实践\n\n使用提高效率、速度和健壮性的代码和最佳实践，将数据科学和机器学习解决方案运营化的过程被称为 MLOps。\n\nMLOps\
  \ 将 DevOps 实践应用于机器学习系统，以便更快速地生产化更好的机器学习模型，并建立正确的数据驱动文化。这种文化涉及数据科学家、数据和云工程师之间的大量协作，并基于高层支持和利益相关者的迭代反馈而构建。采用这些实践对于将可靠的机器学习项目投入生产是必不可少的。\n\
  \n# 这里的业务激励是什么？\n\n麦肯锡的一份报告显示，应用 AI 核心实践的公司相比其他采用 AI 的组织，实现了更高的收入增长和更大的成本降低。这些公司以更大的规模实现了\
  \ AI 解决方案，并且是利用 AI 驱动整个组织价值创造、降低与技术相关的风险以及培训员工的高级成就者。当机器学习得到良好的实施和应用时，这进一步强调了从中可以获得的潜在价值。\n\
  \n在快速变化的云基础设施、数据平台和数据科学算法的世界中，工具和最佳实践（包括 `MLflow`、`Amazon SageMaker Studio` 和 `Kubeflow`）由于能够实现机器学习的可复制、可追踪和可验证而受到了广泛关注。这些工具旨在为开发、调优、部署，更重要的是跟踪和管理机器学习模型提供端到端的解决方案，创建对所用资源的可见性以便于复现，并使工程师能够建立用于记录和监控模型性能的流水线，然后在适当的时候进行重新训练。用户允许通过这些工具将核心\
  \ MLOps 方法论投入实践。\n\n# 机器学习生命周期——深入观察\n\n详尽的 ML 生命周期设计考虑了从云架构到模型开发、再部署，再到利益相关者沟通和技能提升的所有步骤。\n\
  \n# 云架构设计\n\n机器学习项目不再仅仅基于纯数据科学。数据和云工程技能对于管理整个 ML 生命周期变得正变得越来越重要。\n\n我们现在正处于数字转型时代，越来越多的企业正在迁移到云端并将数据托管在专用的数据湖中。这是构建优化、高效、安全的数据平台以及机器学习项目的不可避免的步骤。\n\
  \n出于开发之目的，大多数云平台都提供了自己的数据科学工具（例如 `AWS SageMaker`、`Databricks`、`Google Cloud AI Platform\
  \ Pipelines` 等）。在 ML 流水线，对于涉及的所有步骤（数据存储、数据摄入、模型开发、部署、可视化、监控等），以安全、高性能且具有韧性的方式进行，云工程技能和\
  \ MLOps 实践是必须考虑的。\n\n需要记住，ML 代码中必须以良好的架构方式编排系列任务（即设置服务基础设施、数据收集、数据审计和模型监控本身）仅占完整生命周期的极小部分。\n\
  \n通过同行评审、安全的流水线，可复制 ML 环境的基础是“基础设施即代码”。模型训练和测试应该以持续集成和开发的心态进行。为了确保数据代码的安全，安全性应该构建在流水线的每一个部分。\n\
  \n数据/云工程师更适合建立 ML 流水线并确保项目的持续部署，而数据科学家的责任是开发 ML 模型并交付分析洞察。\n\n# 数据摄入和清洗\n\n在这一步中，为了确保数据的质量控制、安全完整性，结合了数据工程和数据科学知识。根据项目的不同，数据清洗和转换涉及多个步骤，其中包括：处理缺失值、重复值管理、列选择、过滤、文本清洗和聚合。这一步涉及大量的数据处理，可能会模型的运行时间产生巨大影响。\n\
  \n# 数据探索和模型开发\n\n在这一阶段，涉及数据探索和洞察创建、特征工程、训练、测试和模型优化等步骤。数据科学项目很大程度上受益于数据探索阶段，因为它可以有助于更好地理解数据中的潜在趋势，帮助识别偏差，并通过关注相关数据特征来促进更准确模型的创建。\n\
  \n# 向利益相关者展示洞察\n\n根据国际数据公司（IDC）进行的一项调查，大多数 AI 项目未能投入生产，因为与业务端的预期未能良好沟通，或者由于缺乏在生产环境中维护这些模型的技能。为了让组织保持竞争力，这强调了数据团队与业务部门之间进行更好且迭代沟通的重要性，有助于开发创新的\
  \ AI 策略和解决方案，并提升员工技能。\n\n特别相关的是通过将数据科学专业知识与利益相关者的业务理解相结合，为数据科学家和业务创造有价值的体验，实现定制且可操作的成果。数据分析和洞察创建是任何企业通往数据驱动决策之路的第一步，而模型的可解释性对于获得首席高管和利益相关者的信任至关重要。\n\
  \n在数字化变革时代，通过生产化 ML 解决方案交付业务价值的关键要素是与利益相关者沟通、设定明确预期以及提升员工。MLOps 提供的最佳实践是实现这些目标的关键。\n\
  \n# 可视化\n\n在这一步中，涉及将洞察和 ML 预测转换为终端用户可以的格式。\n\n即使在今天，组织通常在电子表格中工作并进行分析，由于等待时间长，需要从多个系统中检索数据。结果，信息检索对于即使回答简单问题或衡量基础\
  \ KPI 也可能非常困难。\n\n使数据访问更直接、更高效是现代数字化转型过程中的必要步骤，这通过数据湖以及采用交互式仪表板可视化（`Power BI`、`AWS\
  \ QuickSight` 和 `Plotly Dash`）取代静态报告来实现。仪表板可以根据客户需求进行定制，通过 ML 预测赋营销和销售运营。\n\n##\
  \ 部署\n\n\n\n\n该模型现已准备面向终端用户和利益相关者，对于数据驱动的决策而言，它可以与业务流程进行集成。然而，剩余的步骤包括模型部署与验证、产物创建、监控、性能工程和运维。\n\
  \n机器学习项目会产生各种产物，因为人们必须处理数据、模型和代码版本，并跟踪部署后的模型性能指标。在创建可复用的 ML 流水线时，机器学习项目的必要副产品就是产物的创建和管理。\n\
  \n部署后，对模型性能的监控和数据审计可以确保 ML 生命周期的顺利运行，其目标是创建自愈环境，使模型能够在需要无需人工干预即可重新训练。\n\n# MLOps\
  \ 的需求\n\n许多公司花费了多年收集数据，现在是时候利用 AI 作为竞争差异化手段充分充分这些数据的潜力了。\n\n机器学习可以帮助部署解决方案，以释放此前未开发的收入来源，通过创建更高效的工作流、利用数据分析进行决策以及创造更好的客户体验来节省时间并减少资源成本。`MLOps`\
  \ 的自动化能够实现更快的上市速度并降低运营成本，使公司在决策时更具捷性和战略性。\n\n需要注意的是，AI 并非没有风险。不理想的结果包括隐私侵入和偏见，组织应该提前计划以减轻此类风险。通过创建伦理且安全的\
  \ AI 平台，在应对这些风险方面发挥着重要作用。\n\n总之，如果组织在设计项目时考虑到 `MLOps` 概念，它们将从更可靠的数据平台和能够从故障中恢复的安全环境中受益。这一切使企业能够在市场中更有效地进行竞争，并使其更容易专注于提取\
  \ ML 创建的洞察和价值。\n\n# 最优的 MLOps 工具\n\n一个完整的 `MLOps` 系统包含几个要素：1. 包含了预处理数据和生成结果所需的所有信息，你需要能够构建模型产物。2.\
  \ 一旦你能够构建模型产物，你就必须能够跟踪构建它们的代码以及它们训练和测试时所使用的数据。3. 你需要跟踪这三者（模型、代码和数据）之间是如何关联的。4. 一旦你可以跟踪所有这些内容，你还可以将它们标记为准备好进入阶段环境和生产环境，并通过\
  \ `CI/CD` 过程运行它们。5. 最后，为了在该过程结束时实际部署它们，你需要某种方法基于该模型产物启动服务。\n\n在公司中，这是对如何成功实施 `MLOps`\
  \ 的极高层次总结。但理解高层面的需求只是拼图的一部分。另一部分是采用或创建合适的工具来完成工作。\n\n# 数据和流水线版本控制\n\n数据和流水线版本控制工具包括以下：\n\
  \n1. 数据版本控制 (Data Version Control)\n\n**一种帮助你无论使用语言语言定义流水线的实验工具是数据版本控制，它是一个用于机器学习项目的开源版本控制系统。\n\
  \n```\n$ dvc run -f featurize.dvc \\\n-d src/featurization.py –d data/prepared \\\
  \n-o data/features \\\npython src/featurization.py data/prepared data/features\n\
  \n$ dvc run -f train.dvc \\\n-d src/train.py –d data/features \\\n-o model.pk1 \\\
  \npython src/train.py data/features model.pk1\n```\n\n当你在之前的 ML 模型版本中发现问题时，`DVC`\
  \ 通过利用代码、数据版本控制和可复现性帮助节省时间。你可以训练模型并通过 `DVC` 流水线与团队成员共享。\n\n大量数据的版本控制和组织，以及以良好组织、可访问的方式存储它们，可以通过\
  \ `DVC` 来，它的重点是数据和流水线的版本控制与管理，但也具有一些（有限的）实验跟踪功能。\n\n关于 `DVC` 需要注意的点有：1. 它是存储无关的，即存在不同类型存储的可能性。2.\
  \ 完整的代码和数据溯源有助于跟踪每个 ML 模型的完整演变。3. 通过一致地维护输入数据、配置和最初运行实验的代码的组合，可以实现复现性。4. 跟踪指标。5.\
  \ 为了将 ML 步骤连接到 `DAG` 并端到端运行整个流水线，有一个内置方法。\n\n2. Pachyderm\n\n在 `Kubernetes` 上，一个将数据血缘与端到端流水线相结合的平台是\
  \ `Pachyderm`。它提供的三个版本是社区版、企业版和 Hub 版。\n\n你需要将 `Pachyderm` 与你的基础设施/私有云集成。\n\n![](img/Figure-8.4.jpg)\n\
  \n**图 8.4:** 数据和流水线版本控制工具——Pachyderm\n\n涉及到数据版本控制时，`Pachyderm` 有这些核心概念：最高级的数据对象是\
  \ `Pachyderm repository`。通常在 `Pachyderm` 中，每个数据集都是自己的仓库。在特定时间点，提交一个报告的不可变快照。指向特定提交的别名或指针随新数据的提交而自动移动，被称为\
  \ `branch`（分支）。你仓库中的实际数据是一个文件。`Pachyderm` 支持任何类型、大小和数量的文件。不同提交、分支和仓库之间的关系通过溯源（provenance）表示。每个提交的起源通过此进行跟踪。\n\
  \n1. Kubeflow\n\n该开源项目包含一组针对各种 ML 任务的精选兼容工具和框架。\n\n![](img/Figure-8.5.jpg)\n\n**图\
  \ 8.5:** 数据和流水线版本控制工具——Kubeflow\n\nDocker 容器的封装和管理由 `Kubeflow` 完成，它是用于维护 `Kubernetes`\
  \ 机器学习系统的工具包。它让机器学习工作流的调度和部署变得更容易，并促进模型的扩展。\n\n使用 `Kubeflow` 时注意以下几点：1. 运行一个用于管理和跟踪实验及任务的用户界面\
  \ (UI)。2. 与系统交互时，使用 `SDK` 和笔记本（notebooks）。3. 使用它快速创建端到端的解决方案，而无需每次重新构建重复组件和流水线。4.\
  \ `Kubeflow pipeline` 作为 `Kubeflow` 的核心组件或独立安装可用。\n\n\n\n\n该工具可以部署在任何数据中心，并由任何支持\
  \ `Torch`、`Tensorflow`、`MXNet` 以及 Polyaxon 托管和管理的所有主流深度学习框架的云提供商。\n\n在编排（Orchestration）方面，Polyaxon\
  \ 允许你通过 `CLI`、`dashboard`、`SDKs` 或 `REST API` 调度作业和实验，从而最大限度地利用你的集群。\n\n使用 Polyaxon\
  \ 时请注意以下几点：1. 它通过包含运行编排来支持整个生命周期，并借此实现更多操作。2. 它有一个可以立即使用的开源版本，并为企业提供了选项。3. 它是一个文档齐全的平台，拥有技术参考文档、入门指南、学习资源、指南、教程和变更日志。4.\
  \ 它允许通过实验洞察仪表板对每一个优化实验进行监控、跟踪和分析。\n\n## 1. Airflow\n\n使用 Web 应用程序 `airflow` 允许你监控、调度和管理你的工作流，它是一个开源平台。除了对日志的洞察外，还提供了对已完成和正在进行的任务状态的洞察。\n\
  \n![](img/Figure-8.7.jpg)\n\n**图 8.7:** 运行编排工具—airflow\n\n`airflow` 使用用 `Python`\
  \ 编写的有向无环图 (`DAGs`）来管理工作流编排，但你也可以使用任何其他语言。\n\n使用 `airflow` 时请注意以下几点：1. 它可以与 `Google\
  \ Cloud Platform`、`Amazon Web Services`、`Microsoft Azure` 以及许多其他服务集成，并且与你当前的基础设施轻松配合。2.\
  \ 你可以可视化生产环境中运行的流水线 3. 在它的帮助下，可以管理任务之间不同的依赖关系。\n\n## 实验跟踪与组织\n\n对所有不同实验及其组件（如参数、指标、模型和其他制品）进行统一管理的过程被称为实验跟踪（experiment\
  \ tracking），它使我们：1. 将特定实验的所有必要组件进行`组织`，以便你以后可以使用它们；将所有内容放在一个地方并知道它们在哪里非常重要。2. 使用保存的实验，你可以轻松地`重现`过去的结果。3.\
  \ 跨越时间、数据、想法和团队，你可以`记录`迭代改进。\n\n有许多选项可以用于实验跟踪，许多平台利用其作为实验数据源的地位，提供扩展到 ML 开发流水线其他部分的功能，如版本控制、调试和监控。\n\
  \n### 1. Neptune\n\n`Neptune` 是一个轻量级实验管理与协作工具。它可以与许多框架配合，其稳定的用户界面实现了对数次运行的极佳扩展性。\n\
  \n![](img/Figure-8.8.jpg)\n\n**图 8.8:** 实验跟踪与组织工具—Neptune\n\n这种强大的软件可以存储、检索和分析大量数据，并拥有了用于高效团队协作和项目监督的所有工具。\n\
  \n使用 `Neptune` 时请注意以下几点：1. 提供了具有不同组织、项目和用户角色的用户及组织管理。2. 为了分组组织运行、保存自定义仪表板视图并与团队共享，它具有一个功能丰富且快速美观的\
  \ UI。3. 为了避免维护另一个工具的各种烦恼，你可以使用托管应用（hosted app）。4. 在脚本（`Python` 和 `R`）和笔记本（`local`、`Google\
  \ Colab` 和 `AWS SageMaker`）中执行的实验可以由你的团队进行跟踪，你可以在任何基础设施（云、笔记本电脑和集群）上执行此操作。5. 它具有广泛的实验跟踪和可视化能力，例如资源消耗和滚动图像列表。\n\
  \n### 2. MLflow\n\n`MLflow` 是一个帮助管理整个机器学习生命周期（包括实验、可复现性、部署和中央模型注册）的开源平台，适用于个人和任何规模的团队。该工具与库无关，可以在任何机器学习库和任何编程语言中运行。\n\
  \n![](img/Figure-8.9.jpg)\n\n**图 8.9:** 实验跟踪与组织工具—MLflow\n\n`MLflow` 包含的帮助跟踪和组织实验的四个主要功能是：1.\
  \ `MLflow tracking`——它是一个 `API` 和 `UI`，用于运行机器学习代码时记录参数、代码版本、指标和制品，并用于后续结果的可视化比较。2.\
  \ `MLflow projects`——`ML` 代码以可重用、可复现的格式形式提供，以便与其他数据科学家共享或传输到生产环境的打包中。3. `MLflow\
  \ models`——从通过不同 `ML` 库管理和部署模型，到各种模型服务和推理平台。4. `MLflow model registry`——它是一个中央模型库，包含模型版本控制、阶段转换和注释，用于协作管理\
  \ `MLflow` 模型的完整生命周期。\n\n### 3. Comet\n\n使用 `Comet` 可以对实验和模型进行跟踪、比较、解释和优化。它是一个元机器学习平台，允许你在一个位置比较和查看所有的实验。每当你使用任何机器学习库执行任何机器学习任务并执行代码时，它都能正常工作。\n\
  \n![](img/Figure-8.10.jpg)\n\n**图 8.10:** 实验跟踪与组织工具—Comet\n\n对于包括团队、个人、学者和组织在内的想要轻松可视化实验并促进工作和运行的任何人，`Comet`\
  \ 都是合适的。\n\n使用 `Comet` 时请注意以下几点：1. 团队共享：具有多种团队共享功能。2. 与现有的 `ML` 库配合良好。3. 它处理用户管理\
  \ 4. 让我们比较实验——代码、超参数、指标、预测、依赖关系、系统指标等。5. 它允许你通过视觉、音频、文本专用模块可视化样本。6. 为了与其他工具轻松连接，它具有许多集成\n\
  \n## 超参数调优\n\n在机器学习中，为学习算法选择一组最优超参数的过程被称为超参数调优（hyperparameter tuning）。控制学习过程的参数、在学习过程之前设置的模型参数，称为超参数。相比之下，其他参数的值（通常是节点权重）是学习出来的。超参数调优是机器学习的关键。\n\
  \n### 4. Optuna\n\n`Optuna` 是一个自动超参数优化框架，可用于机器学习/深度学习，也可用于其他领域，它有一套你可以选择或连接的最先进算法。将训练分布到多台机器非常简单，并且它可以很好地可视化你的结果。\n\
  \n![](img/Figure-8.11.jpg)\n\n**图 8.11:** 超参数调优工具—Optuna\n\n流行的机器学习库 `PyTorch`、`TensorFlow`、`Keras`、`FastAI`、`sci-kit-learn`、`LightGBM`\
  \ 和 `XGBoost` 都可以与 `Optuna` 集成。\n\n使用 `Optuna` 时请注意以下几点：1. 它支持分布式训练（包括单机器多进程和集群（多节点）。2.\
  \ 它支持各种剪枝（pruning）策略，以更快收敛并减少计算消耗。3. 并行坐标图、等高线图或切片图是其套件中强大的可视化工具。\n\n### 5. Sigopt\n\
  \n`Sigopt` 的目标使其成为一个的超参数调优工具，旨在加速并放大机器学习、深度学习和模拟模型的影响，通过自动化流程节省时间。\n\n![](img/Figure-8.12.jpg)\n\
  \n**图 8.12:** 超参数调优工具—Sigopt\n\n\n\n\n您可以将 SigOpt 无缝集成到任何模型、框架或平台中，而无需担心您的数据、模型和基础设施——一切都是安全的。\n\
  \n您的优化实验将由 SigOpt 进行监控、跟踪、分析以及可视化。\n\n要与 SigOpt 工作，请注意以下几点：1. 多指标优化有助于同时对两个不同的指标进行探索。2.\
  \ 条件参数允许定义和调优架构参数，并实现模型选择的自动化。3. 高并行性能够能够充分利用大规模计算机基础设施，并在多达一百个工作节点（workers）上运行优化实验。\n\
  \n# 模型服务\n\n在组织中，如果您正在进行机器学习，您可能希望构建以下两种系统之一：\n1. 用于做出数据驱动决策的分析系统。\n2. 用于构建数据驱动型产品的运营系统。\n\
  \n在构建为组织带来价值的机器学习系统中，只有一小部分是训练高精度的模型。您希望模型擅长预测事物。\n\n在实践中，模型服务（Model serving）意味着将模型部署为\
  \ Web 服务，其他服务可以与之通信、请求预测并使用结果做出自己的决策。\n\n### 1. Kubeflow\n\n您的 ML 实验的几乎每个方面都可以由\
  \ `Kubeflow` 的组件管理，这就是为什么它多次出现的原因。\n\n这是一个非常灵活的解决方案，因为它提供了空间，让您可以灵活地处理数据并按照您需要的方式提供服务。\n\
  \n### 2. Cor\n\n`Cortex` 是使用 `SageMaker` 部署模型的开源替代方案，允许您基于 `Elastic Kubernetes Service\
  \ (EKS)`、`Lambda` 或 `Fargate` 等 AWS 服务，以及 `Docker`、`Kubernetes`、`TensorFlow Serving`\
  \ 和 `TorchServe` 等开源项目，构建自己的模型部署平台。它是一个多框架工具，允许您部署各种模型。\n\n![](img/Figure-8.13.jpg)\n\
  \n**图 8.13:** 模型服务工具—Cortex\n\n要与 `Cortex` 工作，请注意以下几点：1. API 的自动伸缩以处理生产工作负载。2. 在任何\
  \ AWS 实例类型上运行推理。3. 在单个 API 中部署多个模型，并在不停机的情况下更新已的 API。4. API 性能和预测结果监控。\n\n### 3.\
  \ Seldon\n\n`Seldon` 可在云端和本地部署，是一个开源平台，允许您在 `Kubernetes` 上部署机器学习模型。\n\n![](img/Figure-8.14.jpg)\n\
  \n**图 8.14:** 模型服务工具—Seldon\n\n要与 `Seldon` 工作，请注意以下几点：1. 通过金丝发布（canary deployment）等各种选项简化模型部署。2.\
  \ 当告警系统出现问题时，监控生产环境中的模型。3. 使用模型解释器理解为什么会产生某些预测。`Seldon` 还开源了一个模型解释器包 `alibi`。\n\n\
  # 生产模型监控\n\n有效监控模型对于您的机器学习服务的成功至关重要，让您能够在现实世界中产生重大影响。\n\n监控机器学习模型有很多原因。它让您能够分析预测的准确性，消除预测错误并调优模型以确保最佳性能。\n\
  \n密切跟踪生产环境中机器学习模型性能的过程被称为模型监控。通过模型监控，您的 AI 团队可以识别并消除包括预测质量不佳和技术性能差在内的各种问题。因此，您的机器学习模型将提供最佳性能。\n\
  \n### 2. Amazon SageMaker Model Monitor\n\n让数据科学家构建、训练和部署机器学习模型的是 `Amazon SageMaker\
  \ model monitor`，它是 `Amazon SageMaker` 平台的一部分。\n\n每当数据质量问题出现时，`Amazon SageMaker\
  \ model monitor` 允许您自动监控生产中的机器学习模型并提醒您，这有助于节省时间和资源，让您和您的团队专注于结果。\n\n要与 `Amazon SageMaker\
  \ model monitor` 工作，请注意以下几点：1. 当使用内置算法、内置框架或自己的容器训练模型时，您可以在任何端点使用该工具。2. 通过 `SageMaker\
  \ SDK`，您可以捕获预测或发送到端点的可配置比例的数据，并存储在您的 `Amazon Simple Storage Service (S3)` 桶之一。就像任何\
  \ `S3` 对象一样，捕获的数据包含丰富的元数据，您可以对其进行安全处理并访问。3. 要接收包含最新范围内接收的数据统计信息和架构信息以及检测到的任何违规的报告，请启动监控计划。\n\
  \n### 3. Hydrosphere\n\n`hydrosphere` 是一个允许您实时监控生产机器学习的开源 ML 模型管理平台，其模块是 `hydrosphere\
  \ monitoring`。\n\n![](img/Figure-8.15.jpg)\n\n**图 8.15:** 生产模型监控工具—hydrosphere\n\
  \n为了检查您的生产分布是否与训练分布匹配，使用了不同的统计和机器学习方法。它支持外部基础设施，允许您将托管在 `hydrosphere` 之外的模型连接到 `hydrosphere\
  \ monitoring` 以监控其质量。\n\n要与 `hydrosphere monitoring` 工作，请注意以下几点：1. 通过统计漂移检测监控数据中各种统计数据随时间的变化。2.\
  \ 通过 `hydrosphere multivariate data monitoring` 可以检测复杂的数据漂移。3. 使用自定义的 `KNN` 指标或自定义的孤立森林（isolation\
  \ forest）指标监控异常。4. 它支持表格、图像和文本数据。5. 当您的指标发生变化时，您将收到通知以便快速做出响应。\n\n### 4. Cortex\n\
  \n`Cortex` 作为一个多框架工具，允许您部署各种模型，并让您通过模型服务功能完全控制模型。它是使用 `SageMaker` 提供服务或在 AWS 服务之上构建自己的模型部署平台的开源替代方案。\n\
  \n\n\n\n参与此项目将帮助你打下服务器管理方面的良好基础。你需要弄清楚诸这样的问题：什么是 Web 服务器？如何使用包管理器安装软件？\n\n参与此项目几乎没有成本或完全免费。你可以在自己的笔记本电脑上运行虚拟机，因此不会产生来自云提供商的任何费用。如果你确实需要在云端运行，可以使用\
  \ `AWS` 的 `Free Tier`（免费层）来保持低成本。\n\n使用虚拟机的一个巨大优势是，如果你弄坏了它，可以将其丢弃并创建一个新的。\n\n你还需要学习如何使用自动化工具并编写你的第一段自动化代码。\n\
  \n# 项目 #2：为应用程序创建并运行 CI/CD 流水线\n\n可靠的软件交付是 DevOps 的核心原则；这也是 DevOps 存在的主要原因之一！所以，你需要知道如何通过自动化可靠地交付软件。\n\
  \n手动点击来部署软件的时代已经过去了。你应该知道如何使用流行工具之一来设置流水线。\n\n参与此项目将帮助你满足这一职位要求：\n\n“设计并实现持续集成和持续部署流水线”。\n\
  \n你可以遵循以下步骤：\n\n1. 研究并选择一个 `CI/CD` 工具。你可能想要一个带有可供学习的免费层级的 SaaS `CI/CD` 服务，或者一个自托管的工具。\n\
  2. 在 `GitHub` 上找到一个项目，最好是一个 Web 应用程序，这样你可以使用 Web 浏览器与其交互。\n3. 将项目 Fork 到你的个人 `GitHub`\
  \ 账户中。\n4. 为你的 `CI/CD` 工具编写一个流水线，用于测试、编译和打包应用程序。在 `CI/CD` 工具中运行该流水线。\n5. 扩展流水线将其部署到服务器（这是“CD”部分）。你需要研究并学习应用程序是如何部署的。\n\
  \n参与此项目你将获得什么？\n\n`CI/CD` 是 DevOps 的立生之本。参与此项目将让你学会使用一种 `CI/CD` 工具并编写你自己的流水线。你将理解\
  \ `CI/CD` 的概念，获得配置工具的经验，并编写流水线。\n\n`CI/CD` 有很多选择，从 `Jenkins` 到 `GitLab`，从 `GitHub\
  \ Actions` 到 `Concourse` 均有。\n\n选择一个常用的工具并坚持下去。重要的是获得经验并理解术语。\n\n# 项目 #3：带有数据库的应用程序（（高可用））部署\n\
  \n应用程序以高可用性进行部署，这样当应用程序的一个实例崩溃时，用户仍然可以访问。\n\n通过部署一个需要数据库后端的高可用应用，你可以尝试自己重现这种常见的架构。\n\
  \n`WordPress` 是最著名的应用程序之一。此项目将帮助满足这些职位要求：\n\n“使用代码构建基础设施，并实施和测试自动化”\n\n“使用配置即代码原则跨环境管理软件配置”\n\
  \n你可以遵循以下步骤：\n\n1. 准备一个 `VM` 并部署一个应用程序（例如 `WordPress`）+ 数据库后端。\n2. 通过自动化，弄清楚如何为应用程序提供数据库凭据。\n\
  3. 部署应用程序的第二个实例，指向同一个数据库。考虑高可用性，如果你使用公云，则部署在 2+ 个可用区上；如果你在本地工作，则使用 2 个虚拟机。\n4. 为了在两个实例之间进行请求负载均衡，请添加一个负载均衡器或反向代理，以便你有一个单一\
  \ URL 来访问应用程序。\n\n参与此项目你将获得什么？\n\n`WordPress` 是使用最广泛的软件之一。作为 DevOps 工程师，虽然你不一定会被明确要求部署它，但它是一个很好的学习示例，因为它需要数据库。\n\
  \n你可以将其部署在公云上，也可以私有地部署在笔记本电脑上独立的虚拟机上。\n\n你需要考虑如何处理密钥（`WordPress` 需要数据库用户名和密码）。你还将通过部署第二个\
  \ `WordPress` 实例来考虑高可用性，以防第一个挂掉。你将需要添加像负载均衡器或反向代理这样的组件，它将在运行的实例之间分配请求。\n\n你甚至可以使用你的\
  \ `WordPress` 实例发布你自己的博客。\n\n任何你不理解的内容，都可以随时通过 Google 查找。\n\n# 项目 #4：为应用程序创建一个监控仪表板\n\
  \n反馈循环的想法是人们容易忘记的，但它是 DevOps 的重要部分。\n\nDevOps 不仅仅是关于自动化一切。它关乎从软件中获得最大的价值，这意味着持续的测量和改进。反馈循环是任何可以被测量并帮助提高软件质量的东西，例如代码质量或使用指标。\n\
  \n通过在这个项目中创建一个仪表板，你为应用程序添加了监控。\n\n此项目将帮助你满足这些职位要求：\n\n“为了提高应用程序的可追溯性和性能监控，实施工具”\n\
  \n“与开发团队一起对架构和基础设施进行分析和优化”\n\n你可以遵循以下步骤：\n\n1. 部署一个应用程序。你可以使用之前项目的应用程序或你感兴趣的其他内容。\n\
  2. 研究开源监控工具，并选择一个或使用你的云提供商提供的工具（例如 `AWS CloudWatch`）。\n3. 配置应用程序暴露某些指标以显示其健康状况。探索应用程序可以暴露哪些指标，例如如果它是一个\
  \ Web 服务器，你是否可以暴露`每秒请求数`或`内存使用率`等指标。\n4. 将指标提取或抓取到监控工具中。\n5. 创建仪表板实时显示指标。\n\n参与此项目你将获得什么？\n\
  \n此项目将让你研究监控工具并在服务器和应用程序上添加插桩。你需要研究监控工具，弄清楚如何收集指标并将它们注入工具。在此过程中，你需要学习时间序数据库以及监控工具的工作原理。你可能会学习诸如\
  \ `Nagios`、`Statsd`、`Prometheus`、`Graphite` 和 `Grafana` 等工具。\n\n# 项目 #5：部署容器化应用程序\n\
  \n打包并运行应用程序的常用方法是容器。在这个项目中，尝试为应用程序构建容器镜像并使用容器引擎运行它，或将其部署到容器平台/PaaS。\n\n你从此项目中获得的经验有助于满足这些职位要求：\n\
  \n“具有如 `Docker` 等容器化工具的经验”\n\n“对虚拟化和容器架构的技术性理解”\n\n你可以遵循以下步骤：\n\n1. 在 `GitHub` 上找到一个流行的应用。\n\
  2. 创建一个流水线，为应用程序构建容器镜像并推送到注册表（例如 `Docker Hub`、`Amazon ECR` 和自托管的 `Nexus` 容器仓库）。\n\
  3. 使用容器引擎运行容器镜像，例如直接在带有 `Docker` 的虚拟机上，或在 `Amazon ECS` 和 `Kubernetes` 等容器平台上。\n\n\
  参与此项目你将获得什么？\n\n对于应用程序而言，打包和部署容器是标准。你需要学习容器、如何构建和运行容器，并作为流水线的一部分来实现。你还需要了解容器镜像注册表，例如\
  \ `Amazon Elastic Container Registry`，以便你可以推送镜像。最后，你将在服务器或容器引擎上运行容器。\n\n# 项目 #6：创建一个带有\
  \ API 的应用程序并将其部署到 Kubernetes\n\n创建一个暴露 API 的应用程序。使用你喜欢的语言——`Java`、`Javascript` 和\
  \ `Python`。将应用程序封装进容器并部署到 `Kubernetes`。\n\n\n\n\n[content]\n\n1. 选择一种语言 (`Go`, `Java`,\
  \ `Python` 和 `.net`)\n2. 编写一个暴露 `REST` 或 `GraphQL` API 的基础应用程序（例如微服务）。你可以使用框架提供的应用生成器（如果有）来创建初始脚架。然后，定义你的\
  \ API。\n3. 在选择的 CI/CD 工具（例如 `Jenkins` 和 `GitLab`）中创建构建流水线并提交到仓库（流水线即代码）。\n4. 扩展流水线以构建容器并将其部署到\
  \ `Kubernetes`\n\n通过这个项目你将获得什么？\n\nDevOps 工程师对应用代码以及自动化代码都有良好的理解。\n\n这个项目将让你编写一些实际代码，充分利用你的\
  \ DevOps 流水线技能，并深入 `Kubernetes`。\n\n# 结论\n\n本章向你介绍了 xOps 最佳实践。为了消除手动步骤、减少错误、增加团队敏捷性并扩展到小型孤立团队之外，它它向你介绍了\
  \ DevOps 最佳实践，因为 DevOps 的实施依赖于一套集成解决方案。\n\n采用有效的 DevOps 策略成功的首要因素是人以及他们合作的方式，因为\
  \ DevOps 的核心在于文化。\n\n接下来我们将展示如何一起设置 CI/CD 流水线，并进行一个使用 `Docker` 和 `Jenkins` 构建 CI/CD\
  \ 流水线的实操。\n\n接下来是关于量子计算 DevOps 的讨论，介绍了可以适用于任何团队的用于量子计算 DevOps 方法的五个步骤：混合量子应用——DevOps\
  \ 实践、持续集成、自动化测试、持续交付、应用监控，并且对于量子计算，还讨论了 DevOps 中的内部循环和外部循环。\n\n接下来的讨论是关于使企业能够从其\
  \ `DataOps` 最佳实践提供的数据中提取最大价值的关键。为了释放做出数据决策的能力并驱动真正的业务增长，`DataOps` 已成为关键驱动力。\n\n\
  最后的讨论是关于 `MLOps` 最佳实践，它使用代码和最佳实践来提高效率、速度和健壮性，`MLOps` 是将数据科学和机器学习解决方案运营化的过程。拥有数据驱动并将\
  \ DevOps 实践应用于 ML 系统的正确文化就是 `MLOps`，它的目标是更快地生产出更好的 ML 模型。\n\n它基于高层支持和利益相关者的迭代反馈，并涉及数据科学家与数据及云工程师之间的大量协作。为了将可靠的机器学习项目投入生产，采用这些实践是必不可少的。\n\
  \n你还将获得在真实项目上进行操作的经验。\n\n# 关键术语\n\n* `DevOps`: 一种敏捷软件开发方法，用于以速度、质量和控制构建、测试、部署和监控应用程序。\n\
  * `DataOps`: 企业能够从其数据中提取最大价值的关键。\n* `MLOps`: 使用代码和最佳实践提高效率、速度和健壮性，将数据科学和机器学习解决方案运营化的过程。\n\
  * `XP`: 极限编程\n* `TDD`: 测试驱动开发\n* `BDD`: 行为驱动开发\n* `CM`: 配置管理\n* `DAD`: 严谨的敏捷交付\n\
  * `ETL`: 提取、转换、加载\n* `TQM`: 全质量管理\n* `可视化`: 将洞察和 ML 预测转换为终端用户可以的格式。\n* `DVD`: 数据版本控制\n\
  * `数据和流水线版本控制工具`: `DVC`, `Pachyderm` 和 `Kubeflow`\n* `编排工具`: `Kubeflow`, `Polyaxon`\
  \ 和 `Airflow`\n* `实验跟踪和组织工具`: `Neptune`, `MLflow` 和 `Comet`\n* `超参数调优工具`: `Optuna`\
  \ 和 `SigOpt`\n* `模型服务工具`: `Kubeflow`, `Cortex` 和 `Seldon`\n* `生产模型监控工具`: `Amazon\
  \ SageMaker Model Monitor`, `Hydrosphere` 和 `Cortex`\n\n# 问题\n\n1. 为什么开发者和运维团队使用\
  \ DevOps？列出 DevOps 的最佳实践。\n2. “DevOps 的在于文化”。请解释。\n3. 列出选择正确 DevOps 工具的步骤。\n4. DevOps\
  \ 的主要工具分类有哪些？\n5. DataOps 如何服务于企业？它的最佳实践是什么？列出它们。\n6. 将 DevOps 和 DataOps 整合到组织的整体运行中有什么优势？\n\
  7. DataOps 的核心原则是什么？\n8. 根据各种用户和供应商的应用案例，列出 DevOps 和 DataOps 的最佳实践。\n9. 什么是 MLOps？为什么需要\
  \ MLOps？它的最佳实践是什么？\n10. 对以下内容写短短记：1. 运行编排 2. 实验跟踪和组织 3. 超参数调优 4. 模型服务 5. 生产模型监控，并列出它们各可用工具。\n\
