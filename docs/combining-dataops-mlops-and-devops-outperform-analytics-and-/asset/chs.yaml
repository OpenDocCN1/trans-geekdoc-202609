  \n\n# 第 1 章\n\n# 容器 – 容器化是新的虚拟化\n\n## 引言\n\n为了在不同的计算环境中快速地构建、共享和运行应用程序，需要一个封装了所有依赖项的软件单元。\n\
  \n当需要在不同环境之间移动并运行软件时，容器解决了可移植性问题。例如从物理（数据中心）到虚拟（云）机器，从开发者的机器到测试环境，或从预发布环境到生产环境。容器化提供了一种软件开发方法，将应用程序或服务连同依赖项和配置封装成一个容器镜像。对于主机操作系统而言，容器化应用程序的测试可以作为一个单元和容器镜像实例进行。\n\
  \n与物理或虚拟机环境相比，容器使用的资源更少，因为它们不包含操作系统镜像。在容器中运行的应用程序可以在各种操作系统和硬件平台上轻松部署。\n\n\n\n\n\n\
  理解本章的准备知识是虚拟化、容器化和 Linux。\n\n# 结构\n\n在本章中，将涵盖以下主题：\n\n*   容器简介\n*   虚拟机管理程序 (Hypervisor)\n\
  *   虚拟机\n*   容器\n*   容器与虚拟机的比较\n*   容器的优势\n*   Docker 与微服务的兴起\n*   技术演进\n*   Docker\n\
  *   用于微服务架构设计的 Docker 容器\n*   实现架构的模式\n*   Linux 中的 `cgroups` 和命名空间\n*   容器化的优势\n\
  *   结论\n*   关键术语\n*   问题\n\n# 目标\n\n阅读完本章后，你将能够描述容器化是一种操作系统技术，用于将应用程序及其依赖项打包在一起，并利用虚拟化技术在隔离环境中运行它们。此外，你将能够解释容器的工作原理、虚拟机与容器之间的区别，解释虚拟机运行在被称为固件或硬件的软件（即虚拟机管理程序）之上。书中还将详细描述虚拟机、容器、容器即服务\
  \ (CaaS)、为什么你应该使用容器及其优势、Docker、微服务的兴起以及技术的演进。领先的软件容器化平台是 Docker —— 学习使用 Docker 容器设计微服务架构，描述实现架构的模式，学习\
  \ Linux 中的 `cgroups` 和命名空间，描述容器化的优势和容器术语。\n\n## 容器简介\n\n一种以标准方式跨越不同类型基础设施打包和部署应用程序的轻量级方法。一种操作系统虚拟化技术，用于打包应用程序及其依赖项，使其能够在隔离环境中运行。容器可以在任何支持容器的宿主机上如一致地运行，这对于开发者和运维人员来说是一个极具吸引力的选择，开发者可以在本地测试稍后部署到完整生产环境的相同软件。容器格式确保应用程序依赖项封装到镜像自身中，从而简化交接和发布流程。由于运行容器的宿主机和平台是通用的，基于容器的系统的基础设施管理可以标准化。\n\
  \n`Container images` 是创建容器的包，代表容器的系统、应用程序和环境。容器镜像充当创建特定容器的模板，可以使用相同的镜像启动任意数量的容器，就像从单个容器镜像可以创建多个容器一样；这与面向对象编程中类和实例的工作方式相似；单个类可以创建任意数量的实例。这种类比在继承方面也是的，因为容器镜像可以作为其他更自定义容器镜像的父镜像。用户可以从外部源下载预构建的容器，或根据其需要进行定制，也可以构建自己的镜像。\n\
  \n## 容器的工作原理\n\n容器的抽象概念及其作用可以通过以下三个特征可视化：\n\n*   `Namespaces`（命名空间）：命名空间为容器提供了访问底层操作系统的窗口，每个容器都有多个命名空间，提供有关操作系统的不同信息。为了限制容器可以使用挂载的文件系统，使用了\
  \ `MNT` 命名空间；`USER` 命名空间修改容器对用户 ID 和组 ID 的视图。\n*   `Control groups`（控制组）：管理资源使用的\
  \ Linux 内核功能。\n*   `Union file systems`（联合文件系统）：为了支持容器的创建、分发和管理，文件系统是堆叠的，形成单一文件系统。\n\
  *   `Container creation`（容器创建）：通过组合多个镜像，可以将应用程序打包到容器中，这一概念类似于虚拟机。虚拟机在硬件级别进行虚拟化，而容器在操作系统级别进行虚拟化，这是两者的区别因素。\n\
  \n## 虚拟机与容器\n\n`virtual machine`（虚拟机）是一种硬件虚拟化技术，用于完全虚拟化计算机的硬件和资源。独立的客端操作系统管理虚拟机，它与运行宿主系统的操作系统完全分离。宿主机系统上的虚拟机由称为虚拟机管理程序（hypervisor）的软件启动、停止和管理。\n\
  \n虚拟机作为独立的计算机运行，在正常运行条件下，它们不会影响宿主机系统或其他虚拟机，提供了隔离性和安全性。然而，它们也有缺点。虚拟机为了虚拟化整台计算机会消耗大量的资源。虚拟机由客端操作系统运行，因此其配置和启动时间可能很慢。为了更新和运行各个环境，管理员通常需要采用类似基础设施的管理工具和流程，且虚拟机作为独立机器运行。\n\
  \n机器的资源可以通过虚拟机细分为更小的、单独的计算机；但最终结果与管理一组计算机没有区别。你的系统所采用的工具、策略、流程和能力并不会随着群组规模的扩大而发生明显变化，导致每台主机的职责变得更加集中。\n\
  \n容器作为由宿主机操作系统内核管理的特殊进程运行，它们采取了不同的方法，它们直接虚拟化操作系统，而不是通过对系统进程、资源和环境进行受限且高度操纵的视图来虚拟化整台计算机。容器的运行就像它们完全控制计算机一样，感知不到共享系统上存在的内容。\n\
  \n容器并不是像虚拟机那样完整的计算机，而是作为应用程序进行管理的。\n\n`containers` 通过模块化和专注于以进程为核心的虚拟化，提供了隔离性、灵活性和速度之间的平衡。\n\
  \n### Hypervisor\n\n\n\n\n\n`Hypervisor` 是虚拟机（VM）运行在其上的软件、固件或硬件，它运行在物理计算机（宿主机）上，为虚拟机提供包括\
  \ `RAM` 和 `CPU` 在内的资源。\n\n客户机（guest machine）是使用 `hypervisor` 运行在宿主机上的虚拟机；它可以运行在托管型（hosted）或裸金属型（bare-metal）hypervisor\
  \ 上。接下来的章节将解释托管型和裸金属型 hypervisor 之间的重要区别。\n\n## 托管型 hypervisor (#toc.xhtml#s8a)\n\
  \n它们具有更强的“硬件兼容性”，因为主机的操作系统负责硬件驱动程序，而不是 hypervisor 本身。另一方面，硬件和 hypervisor 之间额外的层创建了更多的资源开销，从而降低了\
  \ `VM` 的性能。\n\n底层硬件并不那么重要，但这是托管型 hypervisor 的优势。\n\n## 裸金属型 hypervisor (#toc.xhtml#s9a)\n\
  \n它通过在宿主机的硬件上安装和运行来解决性能问题，因为它直接与底层硬件交互，因此不需要宿主机操作系统。hypervisor 被作为操作系统安装在宿主机的服务器上。\n\
  \n与托管型 hypervisor 不同，裸金属型 hypervisor 拥有自己的设备驱动程序，并直接与每个组件交互以处理任何输入/输出、处理或特定特定的任务，从而获得更好的性能、扩展性和稳定性。hypervisor\
  \ 内的设备驱动程序数量有限，这里的权衡是硬件兼容性受限。\n\n## 虚拟机 (#toc.xhtml#s10a)\n\n虚拟机像真实计算机一样执行程序，它是真实计算机的仿真，运行在使用了“hypervisor”的物理机上，而\
  \ hypervisor 反而运行在宿主机或“裸金属”环境上。\n\n它们拥有安装了独立内存管理的完整操作系统，并带有虚拟设备驱动程序的关联开销，每个客户操作系统都作为独立的实体从主机系统中运行。相比之下，容器是通过容器引擎执行的，而不是\
  \ hypervisor。\n\n## 容器 (#toc.xhtml#s11a)\n\n容器通过在共享的宿主机操作系统之上封装应用程序及其依赖项来减少开销，是一种虚拟化形式。由于没有多个笨重的操作系统实例，容器化是轻量级虚拟化，这意味着它们共享机器的操作系统内核，并且不需要在每个应用程序中关联操作系统的开销。\n\
  \n使用标准单元用于软件的开发、运输和部署打包。运行应用程序所需的所有内容：代码、运行时、系统工具、系统库和设置都包含在 `Docker` 容器镜像中，这是一个轻量、独立且可执行的软件软件包。\n\
  \n尽管开发和阶段环境之间存在差异，但容器将软件从环境中隔离，并确保其以统一的方式运行。\n\n通过抽象“用户空间”，容器提供了操作系统级别的虚拟化，与提供硬件虚拟化的\
  \ `VM` 不同。\n\n容器在所有方面看起来都像 `VM`；它们拥有用于处理的私有空间，可以以 root 身份执行命令，拥有私有网络接口和 IP 地址，允许自定义路由和\
  \ `IPTable` 规则，可以挂载文件系统等。\n\n*图 1.1* 显示了容器化应用程序——应用、容器执行引擎、主机操作系统和基础设施：\n\n![](img/Figure-1.1.jpg)\n\
  \n**图 1.1:** 容器化应用程序\n\n## OCI (#toc.xhtml#s12a)\n\n`open initiative` 项目（缩名为 `OCI`）为\
  \ `container runtime` 设计标准，其中最重要的是 `runC`，这是一个实现 `OCI` 的容器。\n\n## 容器运行时 (#toc.xhtml#s13a)\n\
  \n容器的执行和容器镜像的管理由容器运行时处理，最广为人的是 `Docker` 以及其他如 `rkt` 和 `lxd`。\n\n## 容器即服务 (#toc.xhtml#s14a)\n\
  \n服务为客户提供了一个完整的框架以部署和管理容器，这种新兴服务是“容器即服务”（**CaaS**）。\n\n## 容器主机 (#toc.xhtml#s15a)\n\
  \n运行 `Docker` 客户端和 `Docker` 守护进程的操作系统是容器主机，它与运行中的 `containers` 共享内核。\n\n## J2EE\
  \ 中的容器 (#toc.xhtml#s16a)\n\n应用服务器是控制并为 `J2EE` 组件的部署和执行服务的容器；`EJB` 组件由 `EJB` 容器管理，`servlets`\
  \ 由 `Web` 容器管理。\n\n## 基于容器的应用程序 (#toc.xhtml#s17a)\n\n容器是依赖虚拟隔离在共享操作系统上部署和运行应用程序的软件包，从而创建多个\
  \ `container images`。\n\n## 比较容器和虚拟机 (#toc.xhtml#s18a)\n\n容器和虚拟机具有类似的资源隔离和分配优势，但功能机制不同；容器虚拟化的是操作系统而不是硬件。\n\
  \n容器和 `VMs` 的目标都是将应用程序及其依赖项隔离成一个自自包含的单元，该单元可以在任何地方运行。\n\n容器和 `VMs` 消除了对物理硬件的需求，允许更高效地利用计算资源，从而降低能耗并具有成本效益。\n\
  \n容器和 `VMs` 之间的主要区别在于架构方法，容器共享主机系统的内核。\n\n*图 1.2* 比较了容器和虚拟机：\n\n![](img/Figure-1.2.jpg)\n\
  \n**图 1.2:** 比较容器和虚拟机\n\n代码及其依赖项封装在容器中，这是应用层的抽象。`VMs` 的数量可能很多，且占空间比容器大，因为每个虚拟机都包含操作系统的完整拷贝以及应用程序。\n\
  \n旧的部署应用程序方法是使用操作系统软件包管理器在主机上安装应用程序，其缺点是会将应用程序的可执行文件、配置、库和生命周期与主机操作系统以及彼此纠缠在一起。\n\
  \n\n\n\n操作系统级虚拟化是部署容器的新型方式，而非硬件虚拟化。容器之间以及与宿主机之间是隔离的：它们拥有自己的文件系统，看不到彼此的进程，并且对计算机资源的使用可以限制。由于它们与底层基础设施和宿主机文件系统解耦，它们比虚拟机（VM）更容易构建，并且跨云平台和操作系统发行版之间具有可移植性。\n\
  \n容器镜像可以将应用程序打包，因为容器体积小且运行速度快。\n\n通过“一个应用程序对应一个镜像”的关系，可以释放容器的全部优势。由于每个应用程序都未绑定到生产基础设施环境，也不需要与应用程序堆栈的其他部分组合，不可变的容器镜像可以在构建/发布时创建，而不是在部署时。\n\
  \n从开发到生产，在构建/发布时生成容器镜像能够携带一个一致的环境。在容器内部，当容器进程的生命周期由基础设施管理且不被进程守护器隐藏时，它们比虚拟机更透明，并便于监控和管理。\n\
  \n每个容器运行单个应用程序，这等同于在管理容器的同时管理应用程序的部署。\n\n## 容器的优势\n\n容器的优势如下：\n\n- 与虚拟机镜像相比，创建容器镜像更加容易和高效；即实现了敏捷的应用程序创建和部署。\n\
  - 提供了可靠且频繁的容器镜像构建和部署，可以快速方便地回滚，由于镜像的不可变性，实现了持续开发、集成和部署。\n- 开发（Dev）与运维（Ops）的职责分离将应用程序与基础设施解耦，使得能够在构建/发布时创建应用程序容器镜像。\n\
  - 每个容器运行单个应用程序，这等同于管理容器的同时管理应用程序的部署。\n\n## Docker 与微服务的兴起\n\n这些独立服务被称为微服务，因此，它被称为微服务架构。\n\
  \n微服务架构的亮点如下：\n\n### 单体架构\n\n- 提供了可靠且频繁的容器镜像构建和部署，可以快速方便地回滚，由于镜像的不可变性，实现了持续开发、集成和部署。\n\
  - 开发（Dev）与运维（Ops）的职责分离将应用程序与基础设施解耦，使得能够在构建/发布时创建应用程序容器镜像。\n- 每个容器运行单个应用程序，这等同于管理容器的同时管理应用程序的部署。\n\
  \n### 缺点\n\n- 随着提供的服务数量增加，应用程序规模的增长显而易见，对于开发者来说，构建和维护应用程序代码库变得难以重负。\n- 不仅更新当前技术栈很困难，更改技术栈中的某些内容也是一场噩梦。\n\
  - 开发者在每次应用程序发生变化时都需要重新构建整个应用程序，这是一种资源的浪费。\n- 随着客户群的扩大，我们将需要更多资源来处理更数量的请求。\n\n###\
  \ 微服务来救场了！\n\n\n\n*   微服务架构与 SOA（面向服务的架构）确实具有某些相似之处，但它们并非同一实体。它是 SOA 的变体或特异化版本，可以被视为微服务架构的超集。\n\
  *   为应用程序构建松耦合的服务是这两种架构的重点，这也是人们发现这些架构之间存在相似性的原因，实际上每种架构都有清晰的边界和独立、定义良好的功能集。\n*\
  \   SOA 意味着许多其他含义，这正是其差异所在。为了在应用程序中集成系统，确保代码的可重用性是其关注点，例如，SOA 适用于单体架构。而微服务架构的重点在于通过构建独立的服务来使应用程序模块化，并确保产品的可扩展性。\n\
  \n#### 微服务架构的优势包括：\n\n*   引入关注点分离的设计确保了软件应用程序在简单和复杂领域中的敏捷开发。\n*   微服务的独立能力或独特性开启了许多益处，例如：通过允许开发者拆分成小团队（每个团队负责构建和维护一个或多个服务）来降低复杂性；允许分块部署而不是为了每次更改都重新构建整个应用程序，从而在单时间点降低风险；允许对一个或多个服务增量地更新/升级技术栈而非整个应用程序，从而提供了灵活性；使其易于维护，允许你维护每个给定服务的独立数据模型，同时赋予了你使用任何语言构建服务的灵活性，从而使其与语言无关。\n\
  *   为了确保单个服务的部署，你可以构建完全自动的部署机制、服务管理以及应用程序的自动伸缩。\n\n#### 技术演进\n\n从硬件虚拟化到容器化，随着软件架构模式的演进，出现了诸如\
  \ `Docker` 和 `Kubernetes` 等新技术，用以支持软件基础设施并确保我们可扩展产品和服务的高效管理。\n\n下图帮助我们理解我们在 IT 基础设施领域是如何演进的：\n\
  \n![](img/Figure-1.6.jpg)\n\n**图 1.6:** 技术演进\n\n第一幅图（左侧）显示了一台物理机器或硬件服务器。我们使用宿主机操作系统提供的资源，在部署应用程序时也使用相同的模式，通常是在我们构建应用程序时。但如果需求是扩展应用程序，该怎么办？在某个时刻，你可能想要添加另一台硬件服务器，随着数量不断增加，你的成本以及硬件和能源消耗等其他资源也会随之增加。\n\
  \n为了运行你的应用程序，你可能还会认为需要需要所有的硬件资源和宿主机。事实如此，那么为什么需要如此庞大的基础设施？\n\n硬件虚拟化已经演变为通过虚拟机来优化\
  \ IT 基础设施设置。如你在第二幅图（中间）所示，虚拟机有自己的客操作系统，运行在单台物理机或宿主机操作系统之上，使我们能够在无需安装大量物理机的情况下运行多个应用程序。宿主机操作系统确保了运行在其上的不同虚拟机之间进行系统性的资源分配和负载均衡。\n\
  \n虚拟机使得软件更易于维护并大幅降低了成本，但仍有更大的优化空间。所有应用程序的行为可能不会符合预期，例如，在客操作系统环境中，即使是运行简单的进程，客操作系统也需要大量的资源。\n\
  \n容器化由于这些问题而作为下一项创新被引入。容器轻得多，因为它们是特定于应用程序的，而虚拟机更多特定于操作系统。此外，容器作为单个进程运行，而虚拟机可以运行多个进程，这引出了两点结论：\n\
  \n1. 你可以在单台虚拟机或物理机上运行多个容器，在任何情况下都能解决与应用程序相关的问题。\n2. 容器化是一个互补因素，进一步优化了你的 IT 软件基础设施，而且绝不与虚拟化竞争。\n\
  \n#### Docker\n\n在了解了 IT 软件基础设施的演进后，我们现在的兴趣是了解微服务架构和容器化以及如何实现？答案是 `Docker`，它是全球领先的软件容器化平台，可以将你的微服务封装在\
  \ `Docker` 容器中进行独立部署和维护。执行特定的功能由每个容器负责。\n\n提供了多种操作和服务，例如电子商务网站的账户创建、目录展示、购物车构建和验证。在微服务架构中，所有这些服务都封装在\
  \ `Docker` 容器中。这样做的原因是什么？\n\n这样做的原因之一可能是确保开发环境和生产环境的一致性。例如，一个应用程序需要由三个开发者开发，他们每一个人都在自己的环境中工作：第一个开发者在机器上运行\
  \ Windows 操作系统，第二个开发者运行 Mac 操作系统，而第三个开发者倾向于运行 Linux 操作系统。这些开发者在各自的环境中安装应用程序需要花费大量精力，随后在将其部署到云端时，还需要额外的努力。这并不顺畅，因为将应用程序迁移到云基础设施会有很多摩擦。\n\
  \n\n\n通过相互协作，开发者可以使用 `Docker` 将任务划分为独立的应用程序，并构建称为微服务的模块，从而实现包的去中心化。对于一家全国性的食品连锁店，开发者可以构建用于订单接收、支付处理、供厨师创建制作工单，以及供送货员准备送货工单的微服务应用程序。食物将在厨房中烹饪，然后由这些共同运行的微服务进行交付。\n\
  \n要在 `Docker` 中设计微服务，并为构建稳定、可扩展的应用创造无与伦比的能力，需要新的思维和方法。\n\n## 微服务：它们是什么？\n\n打破构建单一大型应用程序的旧模型的艺术，在于将其开发为微服务。这种“单体”应用被拆解形成了一个新模型，其中每个微服务都负责一个非常特定的任务，并与专门的云托管子应用程序协同工作。应用负载由微服务分配，这有助于通过可复制性确保稳定性，并让可扩展的服务进行相互交互。\n\
  \n工程师遵循计划化分解的模式，将新的软件模块分类到逻辑工作组中。在拆分单体应用时，将应用程序解构为模块是正确的方法。\n\n例如，干果可以被分解为处理开心果、杏仁、腰果等的模块，这些模块由目前某超市连锁的运输和跟踪软件使用。尽管沿着逻辑子域（在本例中为干果）分解软件改进了跟踪方面的表现，但这可能会对业务能力产生不可预见的后果。\n\
  \n作者兼软件开发者 `Martin Fowler` 检查了过度关注子领域分解的陷阱，他表示：\n\n“管理层通常关注技术层，当考虑将一个大型应用程序拆分成若干部分时，他们会将\
  \ UI、服务器端逻辑和数据库团队分开，这导致即使是简单的更改也会产生跨团队的项目工作，而且当团队按照这些标准划分时，会浪费时间并涉及预算审批”。\n\n微服务架构采取了不同的方法来组织这些模块，应用程序的分解是围绕业务能力进行的，并构建了跨职团队来开发、支持和持续部署微服务。Fowler\
  \ 的重点是“产品而非项目”，这种分解是以业务为中心的，并且是一种持续的、协作的承诺，旨在持续交付优秀的产品，而不是由一个在项目完成后就会解散的团队完成一次性的交付包。\n\
  \n单体应用开发中常见的传统存储模型在微服务中是去中心化的。根据服务的适用性，微服务最好与其自身原生的数据存储管理配合工作，这可能是相同数据库技术的重复实例，也可能是不同数据库类型的混合。开发者\
  \ `Scott Leberknight` 概述了多语言持久化（poly got persistencies）的方法，这为微服务开发者提供了无数可能，让他们能够完全实现混合匹配数据存储类型的能力。\n\
  \n## 构建微服务架构 – 挑战\n\n微服务实现了它们力量和可能性，这些在持续过程中伴随着以下涉及其设计和管理的领域：\n\n*   **服务跟踪：** 这不是像微调单体应用那样在一个站点即可完成，因为服务分布在多个主机上，难以追踪，而且对于散布在整个环境中的协作微服务，存在进行盘点和快速访问的需求。\n\
  *   **快速资源扩展：** 每个微服务消耗的资源远少于单体应用；然而，如果没有适当的管理，随着架构的扩展，生产环境中微服务数量的快速增长会导致产生许多小型主机，它们消耗的计算能力或存储可能等于甚至超过单体架构。\n\
  *   **最小资源低效性：** 如果你使用 `Amazon Web Services` (`AWS`) 环境，分配给任何任务的资源总有一个下限，但微服务非常小，仅需最小\
  \ `EC2` 实例的一部分，这导致了资源浪费，成本超过了微服务的实际资源需求。\n*   **部署增加的复杂性：** 可以使用广泛的编程语言来开发微服务并使其保持独立；每种语言都有其所依赖的库和框架，因此这些运行中的多种编程语言需要完全不同的库和框架。这使得部署变成一个复杂的考虑因素，因为它增加了资源开销和成本。\n\
  \n然而，这些障碍并不是不可逾越的，这正是 `Docker` 等容器技术发挥用场并填补现有空白的地方。\n\n`Docker` 带来了让微服务架构运行所需的技术。\n\
  \n## Docker 拯救的微服务\n\n以下是通过 `Docker` 容器技术解决构建微服务架构最大挑战的方法，该技术现在已被其他容器服务模拟：\n\n*\
  \   **任务隔离：** 为每个独立的微服务创建一个 `Docker` 容器，每个实例可以运行多个容器，从而解决了资源膨胀问题（这是由于过度配置的实例在单一服务几乎不存在的压力下保持空闲所导致的）。\n\
  *   **支持多种编码语言：** 为了简化和管理连接到容器的多个平台，包含了运行某种语言所需的所有服务，包括库和框架信息。\n*   **数据库分离：** 使用容器并从其他微服务和容器引用它们来托管一个或多个数据卷。\n\
  \n    `Chris Evans` 在 `Computer Weekly` 上解释了这一概念：\n\n    “原始数据的位置被抽象化了，这种访问方法的好处是使数据容器成为逻辑挂载点，同时将数据保持在专用容器中，从而允许创建和销毁访问数据容器卷的‘应用程序’容器”。\n\
  *   **自动化监控：** 通过强大的日志记录和机器学习工具监控单个容器日志，你可以获得内部数据流的深度洞察，这可以节省团队时间并加速持续交付流水线。\n\n\
  ## 启用你的架构的模式\n\n高效的微服务架构设计并非偶然。微服务驱动的用于控制复杂环境的模式如下：\n\n一切始于人，你必须让你的员工参与，通过培养坚实的基础确保他们准备好在微服务世界中生活呼吸。\n\
  \n*   从 `API` 开始，正如一个微服务始于一个 `API`。\n*   每个微服务应该拥有单一、明确的目的。通过添加新的微服务和新的 `API` 来增加一项职责，从而确保关注点分离。\n\
  *   通过测试获取生产批准以用于你的持续交付流水线，你可以为每个微服务编写全面的测试参数，然后将它们组合成一个完整的测试套件。\n*   为了确保自动化部署，自动化代码分析、安全扫描、通过/失败测试以及微服务环境中所有其他可能的流程。\n\
  \n\n\n\n\n逐渐且仔细地构建你对微服务架构的通用方法，你的团队你自己也应遵循 DevOps 这种持续反馈和改进的精神进行构建。\n\n## 迁移到微服务\n\
  \n一种实现软件协作和扩展的新型方法是微服务。尽管这种方法的长期效力尚有待确定，但不可否认它在 DevOps 环境中设计和管理复杂基础设施的强大能力。\n\n\
  ## Linux 中的 cgroups 和 namespaces\n\n进程及其资源可以作为一个单元进行分组、隔离和管理，这由 `cgroups` 实现，它是\
  \ Linux 内核的一项功能，使得这成为可能。`cgroups` 提供了一种管理和监控其行为的机制，将进程封装在一起，并确定它们可以访问哪些资源。通过遵循分级系统，允许子进程继承父进程的条件，并可能采用进一步的限制。`cgroups`\
  \ 提供了将进程封装成组并限制它们访问的资源所需的功能。\n\n`namespace` 是容器所依赖的另一个内核特性，它限制了可以查看系统其他部分的进程。`namespaces`\
  \ 定义了一个与系统其他部分隔离的独立上下文，这就是为什么运行在命名空间内部的进程感知不到命名空间之外运行的任何内容的原因；该上下文需要通过命名空间的进程树来反映。命名空间内部的主进程变为\
  \ `PID1`（进程 ID 1），这是传统上留给操作系统初始化系统的 `PID`。它通过构建高度处理的虚拟进程树，允许运行在容器内的进程表现得就像在命名空间内部的正常且无限制的环境中运行一样。\n\
  \n## 容器化及其优势\n\n通过相同的共享操作系统让所有应用程序在称为“容器”的隔离用户空间中运行，这种操作系统的一种虚拟化被称为`容器化`。\n\n容器化的重要优势如下：\n\
  \n*   **轻量级虚拟化**：与虚拟机的硬件虚拟化相比，容器极其轻量；它们使用宿主机系统的内核，并作为该操作系统内被隔离的进程运行，而不是虚拟化所有硬件资源并在该环境中运行完全独立的操作系统。从宿主机的角度来看，容器使用的资源有限，运行就像任何其他进程一样，并且启动和停止速度快。这使其在大多数情况下表现像是一个完全独立的操作系统，只能查看和访问宿主机进程空间和资源的子集，而容器镜像本身非常小。许多容错、自愈分布式系统的要求是最小的镜像大小，这使得依赖于运行时拉取最新镜像的工作流能够在不引入显著延迟的情况下实现。\n\
  *   **环境隔离**：由于容器既与宿主机环境隔离，又彼此隔离，`cgroups` 和 `namespaces` 等内核特性提供了某种功能性限制，以协助或防止容器环境相互干扰。虽然这种隔离被认为是全面的安全沙箱并不够稳健，但这种隔离是有优势的。由于宿主机和每个容器在单独的文件系统中维护软件，更容易避免依赖和库冲突。网络环境可以分开，容器内部的应用程序可以绑定到它们的原生端口，而不必担心与宿主机系统或其他容器中的软件发生冲突。管理员可以根据其需求，选择将容器的网络映射到宿主机网络。\n\
  *   **标准化打包和运行目标格式**：容器统一和简化的能力是其在打包和部署软件方面最引人注目的优势。你可以通过容器镜像将应用程序及其所有运行时需求封装成单个单元，并可在多种基础设施上进行部署。无需担心容器内部会干扰宿主机系统库，开发者可以安装和使用应用程序所需的任何库。当镜像创建时，依赖项会被版本锁定。开发者不需要过多了解容器运行的具体机器，因为容器运行时充当了标准、稳定的部署平台。只要容器运行时正常运行且有足够的系统资源，容器的运行方式就应该与在开发环境中一致。从运维的角度来看，容器化有助于标准化环境的需求。将应用程序拆分为具有特定目的的离散组件使得开发、扩展和更新变得更加简单，容器化环境、面向服务架构特别是微服务变得非常流行。\n\
  \n\n\n\n\n- **容器 (Container)**：一种 Linux 操作系统虚拟化技术，用于封装应用程序及其依赖项，并在隔离环境中运行它们。\n\n\
  - **容器镜像 (Container image)**：这些是定义特定容器配置的文件系统和行为的静态文件，用于创建容器的模板。\n\n- **容器编排 (Container\
  \ orchestration)**：该术语指的是在多个主机上管理容器集群时，同时控制扩展性、容错性、资源分配和调度所需的方法和工具。\n\n- **容器运行时\
  \ (Container runtime)**：在主机上，它是实际运行和管理容器的组件。能够从给定镜像提供容器通常是最低要求，但许多运行时集成了其他功能，如进程管理、监控和镜像管理。在它的\
  \ `docker` 命令中，Docker 包含一个容器运行时，针对不同的用场景，还有许多其他替代方案。\n\n- **Docker**: Linux 容器的概念首先由这项技术成功普及。Docker\
  \ 拥有广泛容器和镜像管理功能，其特点包括容器运行时、`docker-compose`（用于定义和运行多容器应用的系统）、Docker Hub（容器镜像注册中心），这些都是\
  \ Docker 生态系统中包含的工具。\n\n- **Docker file (Dockerfile)**：它是一个描述如何生成容器镜像以及运行时如何启动和管理容器内进程的文本文件，定义了基础镜像以及在系统内运行的命令。Docker\
  \ 文件是指定容器镜像最常用的格式，即使不使用 Docker 的镜像生成功能也是如此。\n\n- **Kata containers**：一种管理轻量级虚拟机的方法，它使用模型、工作流和工具模拟了与容器工作的体验。Kata\
  \ containers 旨在将容器的优势与改进的隔离性和相结合。\n\n- **Kubernetes (K8s)**：为了在高可用生产环境中部署、扩展、监控和管理容器，它提供了工具和抽象，是一个强大的容器编排平台，用于管理容器主机集群及其运行在上面的工作负载。\n\
  \n- **cgroups (控制组)**：Linux 容器使用 `cgroups` 实现，这是一种内核功能，通过将进程打包并确定它们对资源的访问权限来对其进行管理并实现进程隔离。\n\
  \n- **Namespaces (命名空间)**：Linux 容器使用命名空间，这是一种内核功能，旨在限制进程或 cgroup 对系统其他部分的可见性，并将工作负载及其资源与系统上运行的其他进程隔离。\n\
  \n- **LXC**：一种 Linux 容器化版本，早于 Docker 和许多其他技术，尽管使用了许多相同的内核技术。与 Docker 相比，LXC 虚拟化的是整个操作系统，而不仅仅是运行应用程序所需的进程，使其看起来更像虚拟机。\n\
  \n- **虚拟机 (Virtual machines)**：为了管理虚拟机的内部组件并访问计算资源，它是一种硬件虚拟化技术，模拟一台完整的计算机，在虚拟机内安装了完整的操作系统。\n\
  \n- **虚拟化 (Virtualization)**：虚拟化通过生成、执行和维护虚拟环境或计算资源来抽象物理资源的方法。它经常被用于将资源池划分给不同的用途。\n\
  \n- **Hypervisor (虚拟机监控器)**：虚拟机运行之上的软件、固件或硬件称为 hypervisor。它们运行在物理计算机上，被称为“宿主机”。包括\
  \ RAM 和 CPU 在内的资源由主机提供给虚拟机。\n\n- **OCI**：开放容器倡议是一个 Linux 基金会项目，用于设计操作系统级虚拟化的开放标准，最重要的\
  \ Linux 容器。`OCI` 开发了 `runC`，这是一个实现其规范的 `container` 运行时，其他高级工具的基础。\n\n- **CaaS (容器即服务)**：容器即服务提供商为客户提供了一个完整的框架，用于部署和管理容器、应用程序以及集群，这是一种基于容器虚拟化的新兴服务。\n\
  \n- **微服务 (Microservices)**：通过将应用程序分为更小的独立服务（这些服务可以独立于其他现有服务或应用程序本身进行构建、部署、扩展甚至维护），我们侧重于应用程序的模块化。微服务就是这些独立的服务。\n\
  \n- **SOA (面向服务架构)**：通过通用通信机制，这种软件架构模式允许我们构建大型企业级应用，这些应用需要集成多个服务，每个服务基于不同的平台和语言构建。\n\
  \n- **单体架构 (Monolithic architecture)**：由单体应用描述，其中用户界面、业务逻辑和数据访问代码从单一平台组合成单个程序，这是一种单层软件应用程序。自包含且独立于其他计算应用程序的是单体应用。\n\
  \n- **容器化 (Containerization)**：所有程序使用相同的共享操作系统 (OS) 是操作系统虚拟化的一种形式，应用程序在隔离的用户空间中运行。\n\
  \n- **DevOps**：增加组织快速交付应用程序和服务的能力，是文化哲学、实践和工具的结合，它们比使用传统软件开发和基础设施流程的组织更快地进化并改进产品。\n\
  \n# 问题\n1. 什么是 Docker 容器？\n2. 什么是 Docker 镜像？\n3. 什么是 Docker file？\n4. Hypervisor\
  \ 的功能是什么？\n5. 区分虚拟化和容器化。\n6. 是否有免费的开源容器管理系统可用？如果有，请对它们进行简要说明。\n7. 目前存在哪些商业容器管理解决方案？\n\
  8. 是否有标准的容器格式？\n9. 为什么所有公司都加入了开放容器倡议 (OCI)？\n10. 容器的安全性如何？\n\n# 第 2 章：使用 容器 开发和部署软件\n\
  \n## 简介\nDocker 是一个流行的用于开发、运行和分发应用程序的开放平台，它通过将你的应用程序与基础设施分离，使你能够快速交付软件。就像你管理基础设施一样，通过\
  \ Docker，你管理你的应用程序。通过利用 Docker 快速交付、测试和部署代码的方法，你可以显著缩短从编写代码到生产环境运行之间的延迟。\n\n# 结构\n\
  在本章将涵盖以下主题：\n* Docker 及其用途\n* Docker 中的容器\n* Docker 的优势\n* 在 Linux 上安装 Docker\n\
  * Hub\n* 镜像 (Images)\n* 容器 (Containers)\n* 与容器操作\n* Docker 中的容器生命周期\n* Docker 架构\n\
  \n# 目标\n\n\n\n\n\n阅读完本章后，你将熟悉 `Docker`，这是一种广泛用于开发、运行和交付应用程序的开放平台。本文将解释 `Docker`\
  \ 是什么以及为什么要使用它，并回答 `Docker` 是否是虚拟机的问题。接下来，将提供对容器标准和行业领导地位的理解，并介绍有关 `Rancher`、`Swarm`、`container\
  \ AWS`、`Engine`，以及如 `Habitus`、`Client`、`Daemon`、`File` 和 `Image` 等构建工具的知识。将解释容器与容器镜像之间的区别，并介绍应用程序软件是如何封装在一个不可见的盒子中的，该盒子包含了应用程序在\
  \ `Docker` 容器中运行所需的所有内容。随后，将介绍 `Docker` 给用户的益处以及在 Linux 上安装 `Docker` 的步骤。我们描述了一种名为\
  \ `Docker Hub` 的云端注册服务，它允许我们下载由其他社区构建的 `Docker` 镜像；Docker 中的一切都基于镜像，镜像是文件系统和参数的组合。容器是\
  \ `Docker` 镜像的实例，可以使用 `docker run` 命令运行，这是它的基本用途。接下来，我们将解释容器的工作原理，并提供对 `Docker 架构`\
  \ 的理解。\n\n## Docker 及其用途\n\n软件即服务（SaaS）旨在让你更轻松地使用容器创建、部署和运行应用程序，包含所有所需的库和其他依赖项，允许开发者将应用程序打包并作为一个单一软件包发送出去，这就是\
  \ `Docker`。\n\nLinux 容器以一种方式封装应用程序，使其与运行它的宿主机系统隔离，允许开发者将应用程序所需的所有部分（如库和其他依赖项）打包并作为一个包发送出去。它们的设计初衷是让开发者和系统管理员能够以快速且可复制的方式将代码从开发环境移动到生产环境，从而提供一致的体验。某种程度上，容器的行为类似于虚拟机。对于外部世界来说，它们看起来像是一个独立的完整系统。但与虚拟机不同，容器不需要创建整个虚拟操作系统，只需要运行所需的所需的单个组件。这带来了显著的性能提升并减小了应用程序的。它们的运行速度也快得多，因为与传统的虚拟化不同，该过程本质上是在宿主机上原生运行的，只是在其周围增加了一层保护。重要的是，驱动容器技术的许多技术都是开源的。这意味着它们拥有广泛的贡献者社区，有助于促进各种相关项目生态系统的快速开发，以满足各种规模组织的需求。\n\
  \n`Docker` 开源项目是一个命令行工具，它让开发者和系统管理员都能轻松地创建和使用容器，这是近期对容器技术感兴趣的主要原因之一。`Docker` 是一个命令行工具，用于用代码以编程的方式定义\
  \ Linux 容器的内容，然后可以像程序源代码一样轻松进行版本控制、重现、共享和修改。\n\n容器还引发了人们对微服务架构的兴趣，这是一种开发应用程序的设计模式，将复杂的应用程序拆分为更小的、可组合的相互工作的部分。每个组件都独立开发，然后应用程序仅仅是其组成部分总和。每个部分或服务都可以运行在容器内部，并根据需要独立于应用程序的其他部分进行伸缩。\n\
  \n简单地将应用程序放入容器中可能不会在你的组织运营方式上产生巨大变化，除非你还能改变部署和管理这些容器的方式。管理和组织 Linux 容器的一种流行系统是 `Kubernetes`，它是一个管理容器集群的开源系统。为了实现这一点，它提供了部署应用、根据需要伸缩应用、管理现有容器化应用的变更，并帮助你优化容器下方底层硬件使用的工具。它的设计是可扩展且具有容错性的，允许应用程序组件根据需要重启并在系统之间移动。\n\
  \nIT 自动化工具如 `Ansible` 以及平台即服务项目如 `OpenShift` 可以增加额外功能，使容器管理变得更容易。\n\n开放平台是描述软件系统的一种，该系统发布了外部编程接口，通常称为“应用程序编程接口”（`API`）。发布的\
  \ `API` 允许第三方与软件系统集成。许多供应商创建了带有 `API` 的开放平台，允许第三方与软件集成，并允许开发者为系统添加功能和特性。开放平台提供两个主要优势——开发独特功能的能力和对抗数据孤岛。添加功能和特性不是开放平台的唯一优势；它们还有助于对抗数据孤岛。开放平台可以开启更好地满足组织需求的解决方案大门。\n\
  \n`开源`一词是一种软件开发方法，它利用了分布式同行评审和过程透明性的力量。为了实现开源，不仅源代码必须公开，而且必须允许免费分发。\n\n`开放技术`一词用于指开放平台、开源或两者的结合。提供开源或开放平台的公司可能会提到开放技术，但会说明是开源还是开放平台。\n\
  \n开源和开放技术之间的主要区别在于源代码的可用性及其免费分发，而开放平台提供了编程接口，但不一定提供代码。\n\nLinux 容器是 `Docker` 的基础，`Docker`\
  \ 是一个使用 Linux 内核功能（如 `namespaces` 和 `control groups`）在操作系统之层创建容器的开源项目。\n\n这项技术并不新鲜，因为\
  \ `Google` 多年来一直在使用自己的容器技术。其他长期存在的 Linux 容器技术包括 `Solaris Zones`、`BSD Jails` 和 `LXC`。\n\
  \n## Docker 是虚拟机吗？\n\n`Docker` 不是虚拟化方法，因为它的主要关注点是自动化部署容器内的应用程序。应用程序容器设计用于封装和运行单一服务，而系统容器设计用于运行多个进程（类似于虚拟机）。\n\
  \nLinux 服务器在 `VMWare` 上运行 `Docker`。Windows 在 `VMWare` 上也可以工作，你可以在 Windows 上运行 `Docker`。\n\
  \n## 容器标准及其行业领导地位\n\n`Docker` 在 2013 年推出通过将软件容器民主化，为开发带来了一场革命。`Docker` 开发了灵活、灵活且于部署的\
  \ Linux 容器技术。2015 年 6 月，随着容器生态系统的增长和成熟以建立标准化，`Docker` 将容器镜像规范和运行时代码（现在称为 `runC`）捐赠给了开放容器倡议（`OCI`）。\n\
  \n\n\n\n在这一演进的基础上继续回馈社区，Docker 在 2017 年将 `containerd` 项目捐赠给了`云原生计算基金会` (`CNCF`)。`containerd`\
  \ 的创建强调简单性、健壮性和移植性，它是一个利用 `runC` 的行业标准容器运行时。Docker 引擎的核心容器运行时是 `containerd`。\n\n\
  `runC` 是一个轻量级且可移植的容器运行时，其所有的底层代码都遵循以下原则：……只要 Linux 能做到，`runC` 就能做到。\n\n### Rancher\n\
  \n`Kubernetes` 是一个用于管理容器化工作负载和服务的可移植、可扩展开源平台，促进了声明式配置和自动化。它拥有庞大且快速增长的生态系统。Kubernetes\
  \ 服务、支持和工具随处可见。\n\n容器是打包和运行应用程序的良好方式。在生产环境中，你需要管理运行应用程序的容器并确保没有停机时间。例如，如果一个容器宕机，就需要启动另一个容器。如果这种行为由系统处理，将会变得更容易。\n\
  \n这正是 Kubernetes 救场的地方！Kubernetes 为你提供了一个弹性地运行分布式系统的框架。它负责应用程序的扩展和故障转移，并提供部署模式等更多功能。\n\
  \nKubernetes 为你提供服务发现、负载均衡、存储编排、自动发布和回滚、自动装箱、自愈、密钥和配置管理。\n\n容器编排是运行容器化工作负载和服务时所需的大部分操作工作的自动化。这包含了软件团队管理容器生命周期所需的广泛内容，包括配置、部署、扩展（扩容和缩小）、网络、负载均衡等。\n\
  \n由于容器本质上是轻量级且瞬态的，在生产环境中运行它们可能会迅速变成一项巨大的工程。特别是当成对运行时——通常每个都运行在自己的容器中——容器化应用可能会转化为成百或上千个容器，尤其是在构建和运行任何大型系统时。\n\
  \n如果手动管理，这将引入显著的复杂性。容器编排让开发和运维（或 DevOps）能够管理这种操作复杂度，因为它提供了一种自动化许多工作的声明式方法。这使其适合\
  \ DevOps 团队和文化，这些团队通常追求比传统软件团队更高的速度和敏捷性。\n\n`Kubernetes 是一个流行的容器编排开源平台。它让开发者能够轻松地构建容器化应用和服务，并对这些容器进行扩展、调度和监控。虽然还有其他容器编排选项，如\
  \ `Apache Mesos` 或 `Docker Swarm`，但 Kubernetes 已成为行业标准。Kubernetes 提供了丰富的容器能力、动态的贡献者社区、云原生应用开发的增长，以及商业和托管\
  \ Kubernetes 工具的广泛可用。Kubernetes 还具有高度的可扩展性和移植性，这意味着它可以运行各种环境中，并与服务网格等其他技术配合使用。\n\
  \n除了实现容器编排的基础自动化外，Kubernetes 被认为是高度声明式的。这意味着开发者和管理员使用它从本质上描述他们希望系统如何运行，然后 Kubernetes\
  \ 以动态方式执行该预期状态。\n\n`Rancher` 包括一个 Kubernetes 发行版，以及从 `Swarm` 和 `Apache Mesos` 中选择的选择，它是一个\
  \ `Docker` 容器的管理平台。它还包含网络、负载均衡、服务发现、监控和恢复等模块化基础设施服务。\n\n### Swarm\n\n用于 Docker 容器的集群和调度工具是\
  \ `Swarm`，通过它，IT 管理员和开发者可以建立并管理作为一个单一虚拟系统的 `Docker` 节点集群。\n\n### Amazon ECS\n\n\
  `Amazon Elastic Container Service` (`Amazon ECS`) 是一种高性能容器编排服务，它具有高度可扩展性并支持 `Docker\
  \ containers`，因为它还允许你轻松地在 `Amazon Web Services (AWS)` 上运行和扩展容器化应用。\n\n`Docker` 容器可以在单个服务器上`run`，你可以将其作为虚拟操作系统来`run`\
  \ 应用程序。\n\n### Build tool\n\n`Habitus` 是一个根据其 Dockerfile 和 `build.yml` 构建 Docker\
  \ 镜像的独立构建流工具，以及一个 Docker 命令行工具。\n\n代码、运行时、系统工具、系统库和设置，即运行应用程序所需的所有内容，都包含在一个轻量级、独立且可执行的软件包中，这被称为\
  \ Docker 镜像。\n\n#### Engine\n\n对于 Docker 容器而言，容器镜像在 Docker 引擎上运行时就会变成容器。无论基础设施如何，无论是\
  \ Linux 还是 Windows 应用程序，容器化软件将始终以相同的方式运行。\n\n运行在引擎上的容器有：\n\n*   **标准（Standard）：**\
  \ 为了让容器随处可用，Docker 为容器创建了一个行业标准。\n*   **轻量级（Lightweight）：** 每个应用程序不需要一个操作系统，因为它们共享机器的操作系统内核，从而提高了服务器效率并降低了服务器和许可成本。\n\
  *   **安全（Secure）：** 应用程序在容器中是安全的，因为 Docker 提供了业界最强大的默认隔离能力。\n\nDocker 引擎由 Docker\
  \ 作为图层运行，是一个管理容器、镜像、构建等的轻量级运行时和工具集。它由以下部分组成，并在 Linux 系统上原生运行：\n\n1. 宿主机运行一个 `Docker\
  \ daemon`。\n2. 通过 `Docker client` 与 `Docker daemon` 通信以执行命令。\n3. `Docker Daemon`\
  \ 远程与 REST API 交互。\n\nDocker 引擎形是 Docker 的一部分，它运行 Docker 容器，其中将软件包标准化为单元的即为容器。Docker\
  \ 平台的核心是 Docker 引擎，它充当运行 Docker 容器的轻量级运行时。\n\n#### Client\n\n作为 Docker 终端用户交互的是\
  \ `Docker client`，它是 Docker 的用户界面。你通过提供指令与 `Docker client` 通信，然后它将指令传递给 `Docker\
  \ Daemon`。\n\n#### Daemon\n\n`daemon` 是实际执行发送的命令的部分，如构建、运行和发布容器的命令。尽管它运行在宿主机上，但用户并不会直接与它通信。这并非必须的，尽管\
  \ client 也可以运行在宿主机上。运行在宿主机上的 daemon 可以通过运行在不同的机器上进行通信。\n\n\n\n\n你通过一组在 `images`\
  \ 文件中编写的指令来构建镜像，这些指令是只读模板。镜像启动时运行哪些进程，以及你希望封装的应用程序及其依赖看起来什么样，都在这里定义。\n\n`file`（文件）用于构建镜像，文件中的每条指令都会为镜像添加一个新的“层”（layer），这些层代表镜像文件系统的一部分，要么添加底层层的内容，要么替换底层层。Docker\
  \ 轻量且强大结构的关键在于层，它们通过联合文件系统（Union File System）实现了这一点。\n\n## 容器与容器镜像——区别\n\n`container`（容器）是容器镜像的运行实例，它是一个不可变的、只读的文件，包含了创建容器的指令。无论你在何处部署它，每次你基于容器镜像文件启动容器时，得到的将是完全相同的容器，这允许开发者解决“在我的机器上可以正常运行”的问题。\n\
  \n由于容器允许更好的协作，容器镜像可以轻松地在不同开发者之间共享，它们也可以在镜像仓库中管理，例如 `Docker Hub`，或者在企业内部通过像 `Docker`\
  \ 这样的安全私有仓库进行管理。\n\n![](img/Figure-2.2.jpg)\n\n**图 2.2:** 容器与容器镜像\n\n### 联合文件系统\n\
  \nDocker 使用联合文件系统来构建一个可堆叠的文件系统，这意味着它可以由称为 `branches`（分支）的独立文件系统的文件和目录形成单一文件系统，这些分支可以透明地叠加。\n\
  \n在叠加的分支内部，具有相同路径的目录的内容被视为单个合并后的目录，避免了为每个层创建独立副本的需求。当某些层需要被修改时，它们会被赋予指向相同资源的指针，而不是创建副本并修改本地副本，从而保持原始文件不变。在不实际允许写入的情况下，这就是文件系统可以表现为可写的方式；换句话说，这是一种“写时复制”（copy-on-write）系统。\n\
  \n分层系统提供了以下优势：\n\n*   每当你使用镜像创建并运行新容器时，层都有助于避免并复制整套文件，这使得容器的实例化非常快速且廉廉的，即 `Duplication-free`（无重复）。\n\
  *   当你更改镜像时，更改速度要快得多，因为 Docker 只会将更新传播到被更改的层，即 `Layer segregation`（层隔离）。\n\n###\
  \ 卷 (Volumes)\n\n当容器被创建时，其初始化的“数据”部分是一个卷（volume），允许你持久化和共享容器的数据。在主机文件系统中，数据卷与默认的\
  \ `UFS` 分离，以普通目录和文件的形式存在，即使在销毁、更新或重建容器时，它们也将保持不变。当你想更新卷时，都可以对其进行直接更改。多个容器可以共享和重用数据卷。\n\
  \n## Docker 中的容器\n\n应用程序及其运行所需的所有软件（包括操作系统、应用程序代码、运行时、系统工具和系统库）被 Docker 容器封装进一个不可见的盒子里，而\
  \ Docker 中的容器是由 Docker 镜像构建的。由于镜像是只读的，Docker 在镜像的只读文件系统之上添加读写文件系统创建一个容器。\n\n在定义镜像时，Docker\
  \ 会创建一个网络接口，允许容器与本地主机通信，为容器附加可用的 IP 地址，并执行你指定的运行应用程序的进程，这不仅仅是创建容器。\n\n一旦成功创建了容器，你可以在任何环境中运行它，而无需对其进行任何更改。\n\
  \n![](img/Figure-2.3.jpg)\n\n**图 2.3:** Docker 中的容器\n\n### 容器实现\n\n为了视觉化“容器”这一抽象概念，“容器”一词描述了几个不同功能如何协同工作。\n\
  \n#### 命名空间 (Namespaces)\n\n`Namespaces` 为容器提供了底层 Linux 系统的独立视图，限制了容器可见和访问的内容。Docker\
  \ 会创建特定容器在运行时将将使用的命名空间。\n\nDocker 利用了内核中不同类型的命名空间；例如：\n\n*   `NET` 为容器提供了其对系统网络栈的独立视图（例如，自己的网络设备、IP\
  \ 地址、IP 路由表、`/proc/net` 目录和端口号）。\n*   进程 ID 的缩写是 `PID`。如果你在命令行运行 `ps aux` 命令来检查系统上运行的进程，你会看到一名为\
  \ `PID` 的列。容器通过 `PID` 命名空间获得了它们可以查看和交互的进程的范围视图，这包括一个独立的 `init`（`PID 1`），即“所有进程的祖先”。\n\
  *   `MNT` 为容器提供了对系统“挂载”（mounts）的独立视图，使得进程能够在不同的挂载命名空间中对文件系统层级拥有不同的视图。\n*   UNIX\
  \ 分时系统的缩写是 `UTS`，它允许进程识别不同的系统标识符，如主机名、域名等。它允许容器拥有自己的主机名和 NIS 域名，这些与其他容器和主机系统是独立的。\n\
  *   进程间通信的缩写是 `IPC`，这是一个负责隔离运行在每个容器内部的进程之间的 IPC 资源的命名空间。\n*   在每个容器内部，`USER` 命名空间用于隔离用户，并允许容器与主机系统相比具有不同的\
  \ `UID`（用户 ID）和 `gid`（组 ID）范围视图，这导致进程在用户命名空间内外的 `UID` 和 `gid` 不同，并允许进程在容器外在不牺牲容器内\
  \ root 权限的情况下拥有一个非特权用户。\n\n为了隔离并开始创建容器，Docker 共同使用这些命名空间。\n\n#### 解释控制组 (Control\
  \ Groups)\n\n`Control Groups`（`cgroups`）是 Linux 的内核功能，用于对一组进程的资源使用进行隔离、优先级排序计数（如\
  \ CPU、内存、磁盘 I/O、网络等）。`cgroup` 确保 Docker 容器使用它们所需的资源（意义上如此），并在需要时为容器可以使用的资源设置限制。cgroups\
  \ 还确保了单个容器不会耗尽其中一个资源并导致整个系统崩溃。\n\n## Docker 应用程序编程接口\n\nDocker 提供了一个与守护进程（daemon）交互的\
  \ API，以及 Go 和 Python 的 SDK。像 `wget` 或 `curl` 等 HTTP 客户端是访问 RESTful API 的引擎 API，或者说是大多数现代编程语言内置的\
  \ HTTP 库。\n\n## Docker 的目的\n\n通过使用容器并将所有内容作为一个包发布，从而更容易创建、部署和运行带有所有所需部分（如库和其他依赖项）的应用程序，这允许开发者对应用程序进行，这就是\
  \ Docker 的目的。\n\n\n\n\n一个替代 `remote` 命令行接口的 `REST API`——RCLI 是 `Docker 中的远程 API`（Remote\
  \ API in Docker）。`cURL` 命令行工具用于处理 URL 操作，有助于发送请求、获取和发送数据以及检索信息。\n\n## DevOps Docker\n\
  \n`DevOps` 中常用的一种重要工具是 `Docker`，它是在部署阶段用于应用程序进行容器化的工具，以便应用程序能够在不同的环境中高效运行。持续集成和持续交付是\
  \ DevOps 基本上包含的持续阶段。\n\n## Docker 的优势\n\n`Docker` 的优势包括节省成本和投资回报率；生产力与标准化；持续集成效率；兼容性和可维护性；更快的配置和简单性；快速部署；持续测试和部署以及多云平台。\n\
  \n其他优势还包括：\n\n* Docker 让所有人（开发者、系统管理员、架构师等）都变得轻松，允许任何人在笔记本电脑上打包应用程序，该程序可以在不修改的情况下运行在任何公共云或私有云，甚至是裸机上，利用容器的优势快速构建和测试可移植应用程序。这就是它提供的`易用性`（Ease\
  \ of Use），其格言是：“一次构建，随处运行”。\n\n* 运行在内核上的容器是沙箱环境，因为它们轻量且快速，占用的资源更少。与几秒钟内创建并运行 `Docker`\
  \ 容器，而 `VMs` 需要更长时间，因为它们每次都要启动一个完整的虚拟机操作系统，即`速度`（Speed）。\n\n* `Docker hub` 是一个“Docker\
  \ 镜像应用商店”，用户从其日益丰富的生态系统中受益。社区创建了数以万计的公共镜像包含在 `Docker hub` 中并供直接使用。搜索符合你需求的镜像非常简单，只需拉取即可使用，几乎或无需任何修改。基于云的注册表服务是\
  \ `Docker hub`，它允许你链接到代码库、构建和测试镜像、存储手动推送的镜像，并连接到 `Docker` 云以便你可以将镜像部署到主机上。为了管理对镜像仓库的访问，组织创建了工作组。\n\
  \n* `Docker` 可以轻松地将应用程序的功能拆分到单个容器中。你可以在一个容器中运行 `Postgres` 数据库，在另一个容器中运行 `Redis`\
  \ 服务，而你的 `Node.js` 应用运行在第三个容器中。使用 `Docker` 创建应用程序时，将这些容器连接在一起变得简单，并且在未来可以轻松独立地扩展或更新组件，即`模块化和可扩展性`（Modular\
  \ and Scalable）。\n\n### 这些优势如何让用户受益？\n\n用户可以完全投入容器技术，而不必担心当前选择的任何特定基础设施、云提供商或 `DevOps`\
  \ 工具会使他们在长期内被锁死在任何技术供应商上。通过选择最优秀的工具来构建最佳的应用程序，他们可以引导自己的选择；同样重要的是，他们将通过在真正产生影响的水平进行创新和竞争，从行业重点中受益。容器化对于可移植性、互操作性和敏捷性的原始承诺，并没有因为在跨越不同基础设施的多种工具集上运行而丢失；我们走向一个由多个容器构建的应用的世界，这最终正是我们想要确保的。\n\
  \n容器规范驱动程序如下：\n\n* 使用更高级的结构（如特定的客户端或编排栈）时，尚未完成容器绑定\n* 任何特定的商业供应商或项目都不会与容器紧密关联\n\
  * 容器可以在各种操作系统、硬件、CPU 架构和公共云之间进行迁移\n\n### Docker 在帮助创建这一基础方面做了什么？\n\n`Docker` 将基础格式和运行时的草案规范以及与该规范参考实现相关的代码都捐赠给了\
  \ `OCI`，将 `libcontainer` 项目的所有内容（`https://github.com/docker/libcontainer`），包括 `nsinit`\
  \ 以及为了使其独立于 `Docker` 运行所需的所有修改，捐赠给了这项工作。在 `https://github.com/opencontainers/runc`\
  \ 可以找到这个名为 `runC` 的代码库。\n\n## OCI 的形成和 Docker 角色的演变\n\n为了帮助 `OCI` 构建运行时规范，`Docker`\
  \ 最初为 `runC` 提供了种子。`Docker` 将根据其公告将其核心容器运行时功能拆分为一个独立的组件，并将其整合到一个名为 `containerd`\
  \ 的单独项目中，并将捐赠给一个中立基金会；此外，`containerd` 将包含完整的 `OCI` 支持，包括扩展的 `OCI` 镜像规范。\n\n随着规范的演进，任何运行容器的流行技术都在向采用\
  \ `OCI` 技术发展。例如，`Cloud Foundry` 社区是 `OCI` 的早期消费者，通过 `Garden` 嵌入 `runC` 作为其容器运行时技术的基石。`Kubernetes`\
  \ 项目正在孵化一个新的容器运行时接口（`CRI`），它采用 `OCI` 组件，并有 `CRI-O` 和 `rklet` 等实现。`OCI` 技术已被 `rkt`\
  \ 社区采用，它利用了参考 `OCI` 容器运行时 `runC`。`Apache Mesos` 社区构建了对 `OCI` 镜像规范的支持。`AWS` 在 Amazon\
  \ EC2 Container Registry (`ECR`) 中支持 `OCI` 镜像格式。我们看到来自更广泛社区和终端用户的这种趋势。\n\n`OCI`\
  \ 努力的优势被任何在这些环境中运行的容器所利用。\n\n运行时和格式规范支持多个平台。查看运行时规范，它提到了 `Linux`、`Windows` 和 `Solaris`\
  \ 配置。\n\n1. 简化并加速部署及配置过程是容器最重要的优势。在防火墙或云环境中部署非常简单，或者你可以在笔记本电脑上构建，也可以在部署容器时几秒内在大型\
  \ Web 集群中启动，即`部署和配置的便利性`（Ease of Deployment and Configuration）。\n\n2. 易部署是一个巨大的优势，销毁容器也是轻而易举的。容器提供了这种灵活性，你可以克隆以处理增长的流量，或者销毁任意数量的容器以减少云环境中的成本，例如，当你发布产品时，你无法预测它将产生的流量大小。\n\
  \n3. 容器化允许你在基础设施之上运行带有自身配置的任何平台，而无需虚拟机（`VM`）的开销。\n\n4. 相同的 `Docker` 配置可用于在多种 `IaaS/PaaS`\
  \ 上运行你的应用程序，将基础设施需求与应用程序环境解耦。\n\n5. 容器化允许你仅扩展所需的功能而不影响整个应用程序。由于无需在 Web 应用中扩展 Web\
  \ 服务器或消息队列，容器允许公司扩展数据库组件，例如。你可以即时扩展任何功能，甚至无需重启服务器即可更改生效（有时），即`高可扩展性`（High Scalability）。\n\
  \n6. 通过允许运行更多容器，可以在几秒内增加扩展性，而无需更多服务器。\n\n\n\n\n\n## 3. 软件交付\n软件交付是一个包含许多步骤的过程，涉及不同环境的流转。它从设计应用开始，接着在测试环境中构建代码，最后将应用交付给用户；在此过程中，这些不同步骤之间存在细微差别，即`流水线管理（Pipeline\
  \ Management）`。\n\n从开发到生产，容器简化了这一过程。容器极易于迁移，提供了一致的测试环境，并允许开发者将应用程序放入容器内部。\n\n该环境从宿主机系统中抽象出来，使开发者能够在整个生产过程中实现应用程序运行环境的零更改。\n\
  \n## 4. 效率与虚拟化\n开发者在软件交付中实现了效率，通过容器允许的传统虚拟化解决了他们面临的许多挑战，从而让产品经理节省了时间和资源，并提高了整体生产力。\n\
  \n为了让开发者尽可能接近生产环境，每个运行在独立虚拟机（VM）上的服务都需要反映生产应用程序的运行情况。然而，`Docker` 的出现拯救了这个问题，它允许许多服务在不需要互联网连接或在远程工作（每次编译都让人压力不堪）的情况下运行，而不会增加内存占用。\n\
  \n开发环境应当尽可能快，为交互式使用提供快速反馈循环。容器允许了这一点，开发者可以从想要使用的平台修改源代码，并在应用程序使用相同源代码运行时，能够立即跟踪更改。\n\
  \n这使得其他员工可以轻松地使用完整的应用程序 set，并在各自的工作领域进行工作，而不会受到安装问题的困扰。\n\n例如，一个想要安装项目管理工具的项目经理可能会在安装过程和管理这些不同版本时遇到困难。通过使用\
  \ `Docker` 镜像来部署选定的项目管理工具并避免依赖错误，他只需要执行一条命令。\n\n## 5. 隔离与安全\n通过应用隔离，开发者除了避免依赖之外，所需的所需的部署。这具有许多好处，例如在同一台机器上运行多个应用程序时可以提高生产力并实现多服务器合并来降低成本，即`进程隔离（Process\
  \ Isolation）`。\n\n通过将应用程序的每个主要进程隔离开的容器中，应用隔离也提高了安全性。举个例子，假设你正在外包应用开发。容器允许你仅在所需的环境中共享资源，而不会危及你的内部或外部安全。在不破坏你网络的情况下，不在你组织工作的外包应用开发者将获得所需的确切资源。\n\
  \n在测试和开发环境中已经非常明确，灵活性、敏捷性、部署的便利性以及更好的开发者体验都是容器化的优势。不进行内部开发的组织也可以从容器化的优势中获益。看到巨头企业持续投资这项技术，并在这种情况下经历新的新的用例，并不令人意外。\n\
  \n# 在 Linux 上安装 Docker\n\n要开始安装 Docker，我们将使用一个 Ubuntu 实例。如果你还没有，可以使用 Oracle Virtual\
  \ Box 来设置一个虚拟的 Linux 实例。\n\n在 Oracle Virtual Box 上，已经安装了一个简单的 Ubuntu 服务器，如所示。该服务器拥有完整的根用户（root）访问权限，系统中定义了一个名为\
  \ `demo` 的 OS 用户。\n\n`demo@ubuntu: ~$`\n\n我们需要按照以下步骤安装 Docker：\n\n1. 在安装 Docker\
  \ 之前，确保你运行的是正确的 Linux 内核版本。它被设计为运行在版本 3.8 及更高版本的 Linux 内核上。可以使用以下命令运行此操作。\n\n```\n\
  uname\n```\n\n此方法返回 Linux 系统信息。\n\n**语法**\n\n```\nuname -a\n```\n\n**选项**\n\n`a`—用于确保返回系统信息。\n\
  \n**返回值**\n\n通过此方法，将返回 Linux 系统的以下信息：\n* 内核名称\n* 节点名称\n* 内核发布版本\n* 内核版本\n* 使用的机器\n\
  * 使用的处理器\n* 使用的硬件平台\n* 使用的操作系统\n\n**示例**\n\n```\nuname -a\n```\n\n**输出**\n\n运行此方法将返回\
  \ Linux 系统的以下信息：\ndemo@ubuntu: ~ $\nLinux 4.2.0-27-generic #33 Ubuntu x86_64 SMP\
  \ Aug 28 20:54:30 UTC 2016\n\n从输出可以看到我们的内核版本为 4.2.0-27，这高于 3.8，因此我们可以开始了。\n\n2.\
  \ 使用以下命令更新 OS 最新软件包。\n\n```\napt-get\n```\n\n此方法通过 Internet 更新 Linux 系统上的软件包。\n\n\
  **语法**\n\n```\nsudo apt-get update\n```\n\n**选项**\n\n* `sudo`—通过 `sudo` 命令以 root\
  \ 权限运行。\n* `update`—使用 update 选项确保更新 Linux 系统软件包。\n\n**返回值**\n\n无。\n\n**示例**\n\n\
  ```\nsudo apt-get update\n```\n\n**输出**\n\n运行此命令时，我们将获得更新到最新软件包的 OS：\n此命令通过连接 Internet\
  \ 下载 Ubuntu 的最新软件包。\n\n3. 下一步是安装后续需要的证书。\n\n```\nsudo apt-get install apt-transport-https\
  \ ca-certificates\n```\n\n4. 为了确保下载必要软件包时所有数据加密，下一步需要添加新的 GPG 密钥。\n\n从 `hkp://keyserver.ubuntu.com:80`，以下命令将下载\
  \ ID 为 `58118E89F3A12897C070ADBF7` 的密钥并将其密钥。\n\n5. 接下来，根据你的 Ubuntu 版本，你需要将相应的站点添加到\
  \ `docker.list` 中，以便 apt 包管理器检测 Docker 软件包并相应下载。\n\n* `https://apt.dockerproject.org/repoubuntu-precise`\
  \ 对应 Precise 12.04 (LTS)\n* `https://apt.dockerproject.org/repo/ubuntu-trusty` 对应\
  \ Trusty 14.04 (LTS)\n* `https://apt.dockerproject.org/repo/ubuntu-wily` 对应 Wily\
  \ 15.10\n* `https://apt.dockerproject.org/repo/ubuntu-xenial` 对应 Xenial 16.04 (LTS)\n\
  \n由于我们的 OS 是 Ubuntu 14.04，我们将使用仓库名称 `deb https://apt.dockerproject.org/repoubuntu-trusty\
  \ main`。\n\n然后我们需要将此仓库添加到 `docker.list`。\n\n```\necho \"deb https://apt.dockerproject.org/repo\
  \ ubuntu-trusty main\" | sudo tee /etc/apt/sources.list.d/docker.list\n```\n\n\n\
  \n\n\n7. 如果你想验证包管理器是否指向了正确的仓库，可以执行 `apt-cache` 命令。\n\n```bash\napt-cache policy\
  \ docker-engine\n```\n\n你将在输出中获得指向 [`apt.dockerproject.org/repo/in`](https://apt.dockerproject.org/repo/in)\
  \ 的链接。\n\n8. 执行 `apt-get update` 命令以确保本地系统上的所有软件包都是最新版本。\n\n9. 较版本的 Docker 使用 `aufs`\
  \ 存储驱动，因此通过安装 `linux-image-extra-*kernel` 软件包，允许在 Ubuntu Trusty、Wily 和 Xenial 使用。\n\
  \n要执行此操作，请使用以下命令：\n\n```bash\nsudo apt-get install linux-image-extra-$(uname -r)\n\
  linux-image-extra-virtual\n```\n\n10. 最后一步是安装 Docker，使用以下命令：\n\n```bash\nsudo apt-get\
  \ install –y docker-engine\n```\n\n在这里，`apt-get` 使用安装选项从 Docker 网站下载 `docker-engine`\
  \ 镜像并安装 Docker。\n\nDocker 引擎是 Docker 公司为基于 Ubuntu 的系统提供的官方包。\n\n## Docker 版本\n\n\
  执行以下命令查看运行中的 Docker 版本：\n\n```bash\ndocker version\n```\n\n### 选项\n\n* `version`——这用于确保\
  \ `docker` 命令返回已安装的 `docker version`。\n\n### 返回值\n\n作为输出，将提供系统上安装的 `docker version`\
  \ 的详细信息。\n\n### 示例\n\n```bash\nsudo docker version\n```\n\n### 输出\n\n当我们运行此命令时，将提供系统上安装的\
  \ Docker 版本的详情。\n\n### Docker 信息\n\n要查看系统上运行的 Docker 的更多信息，请执行以下命令：\n\n### 语法\n\n\
  ```bash\ndocker info\n```\n\n### 选项\n\n* `info`——这用于确保 `docker` 命令返回已安装的 Docker\
  \ 服务的详细信息。\n\n### 返回值\n\n其输出提供了系统上安装的 Docker 详情：\n\n* 可用容器数量\n* 可以创建的镜像数量\n* 使用的存储驱动\n\
  * 使用的根目录\n* 使用的执行驱动\n\n### 示例\n\n```bash\nsudo docker info\n```\n\n### 输出\n\n当我们运行上述命令时，将显示系统上运行的\
  \ Docker 的更多信息。\n\n# Docker 对 Windows 支持\n\nDocker 提供对 Windows 的开箱可用支持，但为了为 Windows\
  \ 安装 Docker，你需要具备以下系统配置。\n\n系统配置要求：\n\n| Windows 操作系统 | Windows V10 64 bit |\n|\
  \ --- | --- |\n|内存（主） | 2 GB 或更多 RAM（推荐） |\n\n[`docs.docker.com/docker-for-windows/`](https://docs.docker.com/docker-for-windows/)\
