  *   现实世界案例\n    *   Translink\n    *   Microsoft office\n    *   Johnson controls\n\
  *   结论\n*   关键词\n*   问题\n\n# 目标\n\n读完本章后，你将能够介绍 MLOps，它包含了机器学习生命周期管理的标准化和精简化。此外，还提供了\
  \ MLOps 开发背景的理解，用于数据科学家与运维人员之间的协作与通信，这是一种有助于管理生产机器学习生命周期的实践。\n\n你将学习对于实现和自动化机器学习项目至重要的技术\
  \ `CI–CD–CT`。还将对 DevOps 和 MLOps 进行比较，并结合 MLOps 的背景描述 ML 生命周期。此外，文中还提供了 MLOps 的优势。\n\
  \n我们描述了 MLOps 的阶段——模型创建与训练、模型部署、自动化或端到端学习、以及审计跟踪。提供了对流水线——数据流水线和 ML 流水线的解释。接下来将讨论框架——模型版本控制、数据版本控制、参数调优、部署与服务以及\
  \ `Orchestrator`（调度器）。我们阐明了 MLOps 愿景的实现。讨论了一个 MLOps 场景：客户流失。此外，我们描述了 MLOps 成熟度模型\
  \ `Level 0–Level 4`。接下来，我们将讨论 MLOps 解决的关键挑战和 MLOps 最佳实践。提供了现实世界案例的说明——Translink、Microsoft\
  \ Office 和 Johnson Controls。\n\n# 介绍机器学习运维 (MLOps)\n\n在所有企业中，基于模型的机器学习和 AI 正迅速成为主流技术。为了充分利用这项技术的优势，需要将模型投入生产环境，但当你在大规模范围内这样做时，会面临新的挑战。在生产环境中管理机器学习模型的根本挑战是不同的，因此现有的\
  \ DevOps 和 DataOps 知识是不够的。\n\n机器学习生命周期管理的标准化和精简化（即 MLOps）在此派上了用场。然而，它不仅仅是将 DevOps\
  \ 实践应用于机器学习；事实上，由于以下三个原因，大规模管理机器学习生命周期是具有挑战性的：\n\n1.  **依赖关系**——**有很多：** 不仅是数据不断变化，业务需求也在发生转移。\n\
  2.  **每个人使用的语言不同：** 即使机器学习生命周期涉及来自业务、数据科学和 IT 团队的人员，他们也没有共享相同的底层技能，也不使用相同的工具。\n\
  3.  **大多数数据科学家并非软件工程师：** 数据科学家不是编写应用程序的专家，他们大多数人专门负责模型构建和评估。\n\n## MLOps 背景\n\n\
  在机器学习项目中，发布第一个版本是的，但在实践中运行多年却很困难。这是因为没有人理解从 `Proof of Concept` (`PoC`) 到生产环境的整个系统。ML\
  \ 研究人员不理解代码，而重构代码以将其投入生产的工程师又不理解模型。这导致了一种哲学，即双方必须共同工作以减少这种摩擦来源。\n\nML 系统行为的另一个区别是变化：万事万都在发生变化。它始于数据准备、转换、训练、验证、服务和部署各个阶段始终具有极高的准确率。然而，在一段时间后，性能会下降，模型需要维护或升级，因为那时没有人还记得了，挣扎就开始了。这也是由于一个维度：数据本身也是代码。因此，缺乏数据验证产生的问题与代码有\
  \ Bug 一样多。这需要运营方面和训练——训练-推理偏差（training-serving skew）进入了考虑范围。\n\n每个人都有创造性的方法；具有解决问题方法的人对维护或故障排除已经部署在生产环境中的系统感兴趣。他们认为这是一种“带孩子”类型的工作。这种不舒服的工作被\
  \ MLOps 处理得非常好。\n\nML 有一种特性，即与代码、数据版本和模型一样，也需要维护。它们的关联或正确组合产生了需要维护的结果。将创建的产物（数据集、模型二进制文件和结果）与运行（时间戳、提交哈希、入口点、参数和性能）关联起来。\n\
  \n## MLOps 是什么？\n\n它是数据科学家和运维人员用于管理生产环境 ML（或深度学习）生命周期并促进协作与通信的方法。MLOps 类似于 DevOps\
  \ 和 DataOps，旨在增加自动化程度并提高生产机器学习的质量，同时关注业务和监管需求。MLOps 起于一份最佳实践列表，从此演变为一种管理 ML 生命周期的独立方法。从模型生成（软件开发生命周期和持续集成/持续交付）、`Orchestration`（调度）、部署到健康状况、诊断、治理和业务\
  \ KPI，MLOps 贯穿整个生命周期。\n\n为了可靠且高效地在生产环境中部署和维护 ML 系统，MLOps 结合了机器学习、DevOps 和数据工程，即它是这三个领域的交集。\n\
  \n一种实践和 ML 工程文化，在从集成、测试、发布到部署以及 ML 系统构建的基础管理的所有步骤中强烈主张自动化和监控，其目标是统一 ML 系统的开发（Dev）和\
  \ ML **运维**（Ops），这就是 MLOps。\n\n\n\n\n\n一种确保开发者将代码提交到中央仓库并使用版本控制系统跟踪更改的软件开发实践被称为\
  \ `Continuous Integration`（持续集成）。通过这种方式，负责模型不同部分的开发者、工程师和科学家可以轻松地添加功能、发现代码中的漏洞（bugs），并促进他们之间的通信。由于可以添加新功能以快速交付程序，并且每次都进行端到端的测试，这将减少集成方面的问题。\n\
  \n一种确保部署可以快速完成的软件开发实践是 `Continuous Delivery`（持续交付），它将从传统的发布日期转变为每天多次发布。\n\n在所有领域交付价值，数据科学和机器学习（ML）正成为解决复杂现实世界问题的核心能力，并改变着行业。目前，有效的\
  \ ML 可以利用拥有的资源进行应用，包括计算机视觉、自然语言理解和推荐 AI 系统，通过大型数据集、按需计算资源、各种云平台上的 ML 专用加速器以及不同 ML\
  \ 研究领域的快速进展来实现。\n\n数据科学家和机器学习工程师可以通过遵循这些指南，将 DevOps 原则应用于机器学习系统（`MLOps`）。\n\n在给定用例相关训练数据的情况下，数据科学家可以在离线留存数据集上实现并训练具有预测性能的\
  \ ML 模型。构建 ML 模型并不是真正的挑战，构建一个集成的 ML 系统并在生产环境中持续运行才是挑战。在生产环境中运行基于 ML 的系统时可能会有很多陷阱，正如我们在\
  \ Google 生产 ML 服务的长期历史中所学到的。\n\n如图所示，真实的 ML 系统只有一小部分由 ML 代码组成。所需的周围元素巨大且复杂。\n\n\
  ![](img/Figure-7.1.jpg)\n\n**图 7.1:** ML 系统元素\n\n配置、自动化、数据收集、数据验证、测试和调试、资源管理、模型分析、流程和元数据管理、服务基础设施和监控是图中系统中其余部分的。\n\
  \n你可以将 DevOps 原则应用于机器学习系统（`MLOps`），以开发和运行此类复杂的系统。\n\n# 比较 DevOps 和 MLOps(#toc.xhtml#s293a)\n\
  \n开发和运行大型软件系统的一种流行实践是 DevOps，它提供了缩短开发周期、提高部署速度和可靠发布等优势。\n\n类似的实践也适用于 ML 系统，因为 ML\
  \ 系统是一种帮助你可靠地构建和运行 ML 系统的软件系统。\n\n然而，以下是 ML 系统与其他软件系统的不同之处：\n\n*   **团队协作技能**：ML\
  \ 项目（包括数据科学家或 ML 研究人员）的团队重点是探索性数据分析、模型开发和实验，这些团队成员无法构建生产级服务，因为他们不是经验丰富的软件工程师。\n\
  *   **应用开发**：由于 ML 本质上是实验性的，你应该尝试尽可能多的功能、算法、建模方法和参数设置，以识别最适合问题的方案。挑战在于如何在最大化代码重用性并维护可复现性的同时，跟踪哪些是有效的，哪些无效。\n\
  *   **应用测试**：与测试其他软件系统相比，ML 系统涉及的更多。除了典型的单元测试和集成测试外，你还需要数据验证、训练模型质量评估和模型验证。\n* \
  \  **应用部署**：在 ML 系统中，将离线训练的 ML 模型作为预测服务部署并不简单。它需要一个多步骤的过程。\n\n## MLOps 的角色\n\n在\
  \ ML 系统中，将离线训练的 ML 模型作为预测服务部署并不简单。需要一个多步骤的过程。\n\n你可以将 DevOps 原则应用于机器学习系统（`MLOps`），以开发和运行此类复杂的系统。\n\
  \n## DevOps 和 MLOps 的主要区别\n\n然而，以下是 ML 系统与其他软件系统的不同之处：\n\n*   **团队协作技能**：ML 项目（包括数据科学家或\
  \ ML 研究人员）的团队重点是探索性数据分析、模型开发和实验，这些团队成员无法构建生产级服务，因为他们不是经验丰富的软件工程师。\n*   **应用开发**：由于\
  \ ML 本质上是实验性的，你应该尝试尽可能多的功能、算法、建模方法和参数设置，以识别最适合问题的方案。挑战在于如何在最大化代码重用性并维护可复现性的同时，跟踪哪些是有效的，哪些无效。\n\
  *   **应用测试**：与测试其他软件系统相比，ML 系统涉及的更多。你需要数据验证、训练模型质量评估和模型验证，以及典型的单元测试和集成测试。\n*   **应用部署**：将离线训练的\
  \ ML 模型作为预测服务部署并不简单。需要一个多步骤的过程。\n\n## 持续集成、交付和持续训练\n\n在 ML 系统中，将离线训练的 ML 模型作为预测服务部署并不简单。需要一个多步骤的过程。\n\
  \n然而，以下是 ML 系统与其他系统的不同之处：\n\n*   **持续集成**：CI 不仅关于代码，还关于验证数据和架构。\n*   **持续交付**：CD\
  \ 不仅关于软件包，还关于通过自动化流水线训练模型。\n*   **持续训练**：`CT` 关注模型的重新训练和提供，这是 ML 系统特有的属性。\n\n# MLOps\
  \ 的机器学习生命周期(#toc.xhtml#s294a)\n\nMLOps 背景下的 ML 生命周期周期被解释为由实验、开发和操作步骤组成。\n\n![](img/Figure-7.2.jpg)\n\
  \n**图 7.2:** MLOps 背景下的生命周期\n\n*   **实验**：数据科学家进行各种实验，并收集数据以寻求业务需求的答案。\n*   **开发**：为了部署构建的实验，通过\
  \ Azure ML 服务进行算法训练，通过 ETL 准备数据流水线，通过 Azure DevOps 实现 CI/CD。\n*   **操作**：通过监控（使用分析/分析等）和反馈回路改进模型。\n\
  \n# MLOps 的优势(#toc.xhtml#s295a)\n\nMLOps 的优势包括数据科学家和运维团队的协作、鼓励数据驱动的业务运营以及对洞察的发现和实施。\n\
  \n*   **可复现性和审计性**：在适用且可复现的流水线中，模型的创建允许在出错时进行回滚并在需要时进行审计。\n*   **验证**：继承了 DevOps\
  \ 概念，如自动化验证、测试、分析和环境管理。\n*   **自动化和可观测性**：收集用于未来改进的模型信息，以便比较预期性能与观测性能。\n\n# MLOps\
  \ 阶段(#toc.xhtml#s296a)\n\n在 Azure 中，AI 解决方案的 DevOps 框架可以宏表示所示：\n\n![](img/Figure-7.3.jpg)\n\
  \n**图 7.3:** MLOps 阶段\n\n从设计创建到部署，它包含四个主要阶段：\n\n1.  **模型的创建和训练**：为了创建可复现的流水线，使用学习流水线训练，将从数据准备到模型评估的所有步骤结合。\n\
  2.  **模型的部署**：为了帮助配置内存、CPU 并验证模型，我们对模型进行打包以供部署和分析。\n\n\n\n\n\n3. **学习端到端或自动化**：通过\
  \ Azure machine learning 和 GitHub，频繁更新模板，并与其他应用程序和服务进行测试和实施增强。\n\n4. **审计追踪**：为了定义审计轨迹，请收集端到端数据，例如模型发布者数据、实施数据、生产使用情况等。\n\
  \n![](img/Figure-7.4.jpg)\n\n**图 7.4：** 使用 Microsoft Azure 的 MLOps\n\n## 流水线\n\n\
  当团队从偶尔更新单个模型进展到在生产环境中拥有多个频繁更新的模型时，流水线方法就变得至关重要。在这种方法中，**流水线就是产品**，你构建和管理的是流水线而不是模型。\n\
  \n自动化流水线包含了组件以及它们如何连接的设计，用以生成和更新最重要的组件——模型。\n\n自动化工作流使用稳健的工程概念将代码拆解为更易管理的组件，例如数据验证、模型训练、模型评估和重训练触发。\n\
  \n该系统允许你在整个流水线的上下文中执行、迭代和监控单个组件，并定义所需的输入和输出、库依赖以及监控指标，这就像笔记本电脑上的本地 notebook 单元格一样，简单且能够快速迭代。\n\
  \n这种将问题解决划分为可复的、预定义的和可执行组件的能力，迫使团队坚持统一的流程，反过来在数据科学家和工程师之间创建了一种定义良好的语言，并最终导致自动化的设置，这等于\
  \ ML 中的 CI——一个可以自我更新的产品。\n\n相互独立且并行存在两条流水线：\n\n1. 数据流水线\n2. ML 流水线\n\n## 数据流水线\n\
  \n数据工程的一个核心概念是数据流水线，它基本上是提取-转换-加载（ETL）流水线。在这个流水线中，从源到目的的行程被编码。\n\n## ML 流水线\n\n\
  ML 流水线是一个纯代码产物，独立于特定的数据实例。DevOps 的一项核心实践使其能够在源控制中跟踪其版本，并通过标准的软件类型 CI/CD 流水线实现自动化部署。\n\
  \n下图更清晰地展示了端到端场景下的流水线数量：\n\n![](img/Figure-7.5.jpg)\n\n**图 7.5：** 端到端场景的流水线数量\n\n\
  我们需要并行进行数据追踪和代码追踪，这从生成模型的结果可以清楚看出，集成应该首先发生在训练阶段，该阶段成为预测服务阶段的输入，在服务阶段将注入不同的数据，并将正确版本的代码通过代码\
  \ CI/CD 流水线推送以发布预测。\n\n与普通的系统开发流相比，运行方式略有不同的两个方面是版本控制和验证。它们都适用于数据和模型。\n\n*表 7.1*\
  \ 显示了 DevOps、数据工程和 MLOps 实践之间的关系。\n\n| **实践** | **DevOps** | **数据工程** | **MLOps**\
  \ |\n| --- | --- | --- | --- |\n| 版本控制 | 代码版本控制 | 代码版本控制数据血缘 | 代码版本控制+数据版本控制+模型版本（关联以实现复现性）\
  \ |\n| 流水线 | 不可用 | 数据流水线/ETL | 训练 ML 流水线，服务 ML 流水线 |\n| 行为验证 | 单元测试 | 单元测试 | 模型验证\
  \ |\n| CI/CD | 将代码部署到生产 | 将代码部署到数据流水线 | 将代码部署到生产 + 训练 ML 流水线 |\n| 数据验证 | 不可用 | 格式和业务验证\
  \ | 统计验证 |\n| 监控 | 基于 SLO | 基于 SLO | SLO + 差异监控，统计切片监控 |\n\n**表 7.1：** DevOps、数据工程和\
  \ MLOps 中的实践\n\n理解 ML 生命周期周期对于通过 MLOps 框架将其付诸实践至关重要。\n\n用于作业管理、监控、调试以及数据/模型/评估可视化的集成前端。\n\
  \n![](img/Figure-7.6.jpg)\n\n**图 7.6：** 共享配置框架和作业编排\n\n*自动化与可观测性*——跨云/边缘的可控发布能力和追踪，预测性能与预期性能的实时比较，以及结果的反馈以观察漂移并改进模型。\n\
  \n接下来的三个阶段图将进一步提供 MLOps 的视角视角：\n\n### 阶段 1\n\n该阶段涉及生产服务：\n\n![](img/Figure-7.7.jpg)\n\
  \n**图 7.7：** 生产服务\n\n### 阶段 2\n\n该阶段涉及建模：\n\n![](img/Figure-7.8.jpg)\n\n**图 7.8：**\
  \ 建模\n\n### 阶段 3\n\n该阶段涉及监控：\n\n![](img/Figure-7.9.jpg)\n\n**图 7.9：** 监控\n\n## MLOps\
  \ 流程框架\n\nMLOps 流程提供了满足经典 CI/CD 过程和部署机器学习系统运行的需求，这包括一个针对扩展系统的框架，用于处理机器学习模型的全生命周期，涵盖开发、测试、部署和监控。\n\
  \n值得探索的框架如下：\n\n* 模型版本控制：**MLFlow**\n* 数据版本控制：Pachyderm\n* 超参数调优：**Katib**\n* 部署与服务：**Seldon**\n\
  * 编排器：`Kubeflow`. Airflow, Luigi, Polyaxon 和 `DVC`\n\n任何特征存储（feature store）的实现以及\
  \ Airbnb 发布的 BigHead 也需要关注探索。\n\n大型平台也提供 ML 生命周期管理服务——Azure、AWS、Google、Cloudera，以及专业厂商——**Cubonacci**、**Dataiku**、**H2O**\
  \ 和 **Algorithmia**。\n\n## MLOps 愿景及其交付\n\n## 客户流失作为 MLOps 场景\n\n一家在线手机商正寻求减少其客户群的流失率，即客户保持忠诚的时间，特别是在订阅期结束时。减少流失的原则已经确立，需要零售商增加客户忠诚度和信任，确保产品和服务合适，并提供有针对且有效的营销。\n\
  \n由于这些因素与客户行为之间的联系难以建立，在实践中需要一种迭代的、实验驱动的方法。该零售商已经在 ML 方面取得了成功，拥有三名数据科学家和五名丰富的 DevOps\
  \ 工程师，扩展到 MLOps 方法需要什么？首先需要设置模型和数据环境，其次，对于训练和推理，需要流水线。这些活动通过考虑复现性、重用性、可性和自动化来描述。\n\
  \n## 数据环境与模型配置\n\n第一步是为数据和建模做好准备，通过建立环境在迭代过程中管理两者。针对 ML 优化后的环境，根据模型状态，平台和工具需要支持部署到广泛的目标基础设施和库。\n\
  \n下一步需要识别并配置 ML 模型使用的数据源，这包括以下活动：\n\n* 创建和配置数据存储\n* 对训练和推理数据集进行归一化、转换或其他准备\n* 将算法和代码指向数据\n\
  * 通过强制透明化建立对结果的信心\n\n\n\n\n\n数据源可能会被流水线步骤消费，并且它们可能会产生“中间”数据，这些数据随后可以供流水线后续的其他步骤使用。流水线步骤还可以被复用。对于长时间运行的数据准备作业，你可以使用此特定步骤的输出并行馈送给其他几个步骤或训练，从而节省执行时间。\n\
  \n在这种场景下（例如测试历史忠诚计划的有效性），客户忠诚因素可以作为变量反馈到模型中。\n\n# 创建训练和推理的流水线 (#toc.xhtml#s304a)\n\
  \n在环境和数据就绪的情况下，可以考虑如何将从训练、验证、测试到运行和推理的模型创建活动流组织为可重复的流水线。脚本在训练期间和其他步骤中分组，可以从数据存储器读取或写入数据，执行记录被保存为工作区中的运行（runs）。图\
  \ 7.10 显示了一个示例流水线：\n\n![](img/Figure-7.10.jpg)\n\n**图 7.10：** 流水线步骤连接了数据准备、模型训练和评估。\n\
  \n通过检查这些实验的结果，零售商可以通过审查来跟踪洞察的适用性和有效性。在这种“测试并学习”的方法中，速度和重复性至关重要，这要求流水线的可重复性和自动化。数据科学家必须同时确保模型做出正确的预测，例如确定样本数据在训练和推理之间是否经历了数据漂移，这可能会影响结果质量（参见图\
  \ 7.11）：\n\n![](img/Figure-7.11.jpg)\n\n**图 7.11：** 评估工具能够评估数据漂移等问题。\n\n这展示了你如何使用\
  \ Azure machine learning SDK 创建并将流水线发布到 Azure machine learning 工作区中。\n\n# MLOps\
  \ 成熟度模型 (#toc.xhtml#s305a)\n\nMLOps 允许数据科学家通过测试和学习循环更快速地迭代，让他们更快地获得有意义的洞察。然而，这必须以治理质量为代价。企业需要一种机制来跟踪它们的进度，以便以符合\
  \ MLOps 要求的方式部署机器学习。组织可以使用成熟度模型来确定它们在路径上的位置，以及可能采取哪些步骤来“升级”。\n\n因此，MLOps 成熟度模型定义了不同的级别，根据已经处于或尚未开始机器学习之旅的企业，识别出五个名义级别。\n\
  \n# 实现 MLOps 成熟度 (#toc.xhtml#s306a)\n\n一个理想目标是达到一个 MLOps 在所有机器学习团队中被主动采用并采取措施的阶段。需要回答的问题是，组织如何实现交付？每个成熟级别都有某些特性，需要启动相关行动来构建下一级别。例如，大多数组织通过从一个人员配置极少的单一项目开始，扩展到其他应用程序和业务组。\n\
  \n# 第 0 级 (#toc.xhtml#s307a)\n\n在此级别，组织仍然对于于接受机器学习，更不用说 MLOps 了。他们对将面临的复杂性有初步的认识，但还没有招聘数据科学家的计划。流程是手动的，而且几乎或没有跟踪成功的方法。\n\
  \n在此时点，目标是将数据科学纳入业务或技术计划中，这需要被接受。为了获得更好的分析以及结果——即机器学习，开始让数据规范化也很重要，这意味着确保数据可以被多个业务组访问，存储在与其特征和用途相匹配的平台上，并具有适当的粒度且符合数据质量标准。\n\
  \n这一级别作为切实业务价值的驱动因素，其目标结果是为机器学习、因此是 MLOps 提供基础。\n\n# 第 1 级 (#toc.xhtml#s308a)\n\n\
  此级别的组织对云端方法具有承诺，并且已经在从云访问数据，他们擅长传统的数据采集和分析。然而，他们尚未以战略方式参与机器学习。\n\n团队中仅有零星的数据科学技能，并且对机器学习为组织带来什么收益的经验有限。这一级别面临的主要挑战是，如何根据对\
  \ DevOps 及其能提供价值的现有理解，有意义地启动机器学习活动。\n\n此阶段的重点是在正确的层级获得足够支持的同时，开始建立技能和专业知识。\n\n从结果来看，可重复性、可复用性、可性和自动化是\
  \ MLOps 的关键特性。第 1 级的重点是提高软件和模型产物的可复用性，通过设置正确的环境、构建流水线，然后使用它来准备数据并训练模型来实现自动化。其主要目标是创建一个展示机器学习价值的模型，同时学习基础知识并探索新的可能性。\n\
  \n# 第 2 级 (#toc.xhtml#s309a)\n\n管理公司现在正积极寻求提供机器学习的益处并已取得进展，但他们现在需要结合并协调他们的努力以便进行扩展。“实施\
  \ Azure machine learning MLOps 没有比办公产品更好的领域了，因为该产品规模巨大（每天有数亿用户）。”MLOps 的创建已经考虑了这种规模的大数据。\n\
  \n组织在此级别可能正在协调开发和机器学习计划，但他们的效率低下，并且难以以可衡量的方式产生价值。随着努力的进行，有可能开始将 MLOps 作为一种实践来驱动，确保治理和基础设施框架有助于消除瓶颈。\n\
  \n对于进入生产环境的模型，流水线变成了引力中心。虽然数据科学家可能每天仍使用 `Jupyter` 等工具，但在从探索转向生产的过程中，流水线变得至关重要。MLOps\
  \ 是将其投入生产环境的关键。\n\n第 2 级的预期结果应基于可复用性和自动化，以便许多合作者可以在相同的模型和数据上工作并获得一致的结果。随着数据科学家人数的增加，想法是尽可能将其纳入版本控制，同时加强沟通。这一级别还可以通过建立约定的指标来提高管理性，以便以一致且更的速度开发模型。\n\
  \n# 第 3 级 (#toc.xhtml#s310a)\n\n在看到益处后，这些公司已经发展出许多数据科学家，以高效有效的方式交付机器学习。由于他们已经有了与\
  \ MLOps 协同的计划，现在可以考虑如何最大化他们的努力。AI 开发人员与软件开发人员紧密协作，采用跨 MLOps 和 DevOps 流及程序的统一流。\n\
  \n主动采用 MLOps 的意义是你为机器学习建立了一个严格管理的生命周期以及一个重新训练模型的过程。\n\n在可复用性、管理性和自动化的基础上，组织在这一级别专注于产生可重复的结果，交付所有四个要求。这为扩展机器学习工作提供了坚实的基础，实现所有这些重要要求允许晋升到真正的\
  \ MLOps 领导角色。\n\n\n\n\n\n在这个阶段，组织应该扩大其机器学习工作的规模，并能够通过遵循一致的方法论来扩大实验并应用多种方法。为了改进和优化基于机器学习的应用程序，企业将通过观察数据漂移等问题来监控性能和行为。\n\
  \n# MLOps 解决的关键挑战\n\nMLOps 是一项旨在统一 ML 系统开发（dev）和 ML 系统部署（ops）的工程学科，其目标是标准化和简化在生产环境中持续交付高性能模型的过程。\n\
  \n在当今广泛的应用中，我们正在嵌入决策自动化，这为构建和部署基于机器学习的系统带来了许多技术挑战。\n\nML 系统生命周期涉及数据驱动型组织中的不同团队。从开始到结束，涉及以下团队：\n\
  \n*   **业务开发或产品团队—****使用 KPI 定义业务目标\n*   **数据工程—****数据采集和准备\n*   **数据科学—****构建 ML\
  \ 解决方案并开发模型\n*   **IT 或 DevOps—****完成部署设置，与科学家一起进行监控\n\n![](img/7.12.jpg)\n\n**图\
  \ 7.12：** 机器学习生命周期\n\n有几个瓶颈需要处理，在大规模范围内管理此类系统并非一项易事。以下是团队提出的关键挑战：\n\n*   缺乏擅长开发和部署可扩展\
  \ Web 应用的数据科学家。ML 工程师的角色旨在满足这一需求。他们处于数据科学和 DevOps 的交汇点。\n*   在模型中反映变化的业务目标——随着数据的不断变化，维持模型的性能标准并确保\
  \ AI 治理存在许多依赖。很难跟上持续的模型训练和不断演变的业务目标。\n*   技术团队与业务团队之间存在沟通差距，难以找到共同的语言进行协作。这种鸿沟是大多数项目失败的原因。\n\
  *   风险评估—关于 ML 系统的黑箱性质存在大量争论。模型往往偏离其最初的意图。评估此类失败的风险/成本是一个非常重要且细致的步骤。\n\n# MLOps\
  \ 最佳实践\n\n团队、数据、目标、模式、代码和部署是 ML 流水线的不同组件。\n\n## 团队\n*   使用协作开发平台\n*   针对共享待办列表（backlog）工作\n\
  *   与他人沟通、对齐并协作\n\n## 数据\n*   对所有外部数据源进行合理性检查\n*   跟踪、识别并说明数据源的变化\n*   对于数据清洗和合并，编写可重用的脚本\n\
  *   为了以人类理解的方式创建新特征，结合并修改现有特征\n*   确保数据标注在严格控制的过程中进行\n*   在共享基础设施（私有或公共）上提供数据集\n\
  \n## 目标（指标和 KPI）\n*   起初，不要过度思考选择哪个目标进行直接优化；跟踪多个指标\n*   对于你的第一个目标，选择一个简单、可观测且可归的指标\n\
  *   设定治理目标\n*   执行公平性和隐私保护\n\n## 模型\n*   保持第一个模型简单，并确保基础设施正确\n*   从可解释模型开始会让调试更容易\n\
  \n## 训练\n*   在易于衡量和理解的指标中捕获训练目标\n*   积极归档未使用的特征\n*   对训练脚本进行同行评审\n*   启用并行训练实验\n\
  *   自动化超参数优化\n*   持续测量模型质量和性能\n*   对数据、模型、配置和训练脚本进行版本控制\n\n## 代码\n*   运行回归测试\n*\
  \   使用静态分析检查代码质量\n*   使用持续集成\n\n## 部署\n*   计划发布和迭代\n*   自动化模型部署\n*   持续监控已部署模型的行为\n\
  *   为生产模型启用自动回滚\n*   当性能进入平台期时，寻找新的定性信息源，而不是精炼现有信号\n*   启用影子部署\n*   保持集成模型简单\n*\
  \   使用模型版本、代码版本和输入数据记录生产预测结果\n*   对系统和训练—推理偏差（serving skew）进行人工分析\n*   你不是典型的终端用户\n\
  *   衡量模型之间的增量\n*   在选择模型时，实用性能优于预测能力\n*   执行演进的数据特征检查\n*   如果你基于截至 2 月 5 日的数据生成模型，请在\
  \ 2 月 6 日及之后的数据上测试该模型\n\n# 现实世界中的案例\n\n这里解释了一些现实世界中的案例。\n\n## TransLink\n\n### 公司背景\n\
  Translink 是温哥华大地区的交通网络，它为整个地区的居民和游客提供广泛的巴士系统，包括天铁 SkyTrain 快速交通、海天 SeaBus 渡轮、海岸快线\
  \ West Coast Express 以及为无法使用传统交通工具的乘客提供的 HandyDART 服务。\n\n### 机会\n客户很大程度上依赖精确的巴士发车时间计划行程，而\
  \ TransLink 的业务是提供可靠的交通服务。随着地区巴士服务的扩展和增长，他们的巴士预测变得越来越糟糕、越来越不可靠。随着消费者投诉的增加，TransLink\
  \ 需要一个更好的答案。\n\n### 挑战\n客户希望在途中停靠时有更准确的发车时间，但交通、恶天气和延迟都会影响预测时间。\n\n根据他们在微软车库项目的经验（在该项目中他们成功利用机器学习预测巴士拥挤情况），他们决定联系微软以学习更多关于\
  \ ML 和 MLOps 的知识。\n\n### 解决方案\n项目从概念验证开始，以测试机器学习的使用。基于六周的训练数据，创建了一个初步模型，结果令人鼓舞，足以进行\
  \ 13 条路线的试点。这些路线是刻意选择的，以压力测试模型在各种场景下的稳健性。\n\n使用实时巴士位置和路况数据将局部信息输入到每个组件中，采用一种建模方法提供最准确的站点级预测。使用两年的历史数据来训练模型。由于其训练速度快且性能优异，选择了\
  \ `Extreme Gradient Boosting` (`XGBoost`）作为机器学习模型。\n\n交通系统中的每个巴士站和路段都有自己的机器学习模型，只要有足够的数据进行训练（至少有\
  \ 500 个停留/行驶事件实例）。结果，他们拥有超过 18,000 个不同的模型集。MLOps 被用于创建一个可以处理这些模型的训练流水线，允许构建适用于所有涉及巴士站的模型。\n\
  \n随着研究的进行，发现巴士的位置和在站点停留的时间对模型准确性的影响最大：当发现不受时间表影响时，结果表现优异。\n\n超过了所有成功标准的预期。预测与实际巴士时间之间的差异减少了\
  \ 74%。平均消费者在站点等待的时间减少了 50%，而等待超过五分钟的客户减少了 10%。\n\n\n\n这些结果引起了公司的兴趣，他们计划扩展机器学习（ML）。这引发了大量的关注和参与。然而，分析与开发部总监\
  \ Sze-Wan Ng 表示，`Ops` 比 `ML` 更困难，他们正期待通过 `Azure MLOps` 完善他们的 `MLOps` 程序，这对 TransLink\
  \ 的机器学习开发是必不可少的。\n\n## 微软 Office\n\n### 公司背景\n微软赋能了数字化转型，引领了智能云和智能边缘的时代。其使命是赋能地球上的每个人和每个组织实现这一目标。\n\
  \n### 机会\nOffice 一直在过去两年致力于将 AI 集成到其产品中，以提高人类生产力。“在当今世界，时间和人类注意力是有价值的商品，”Office\
  \ 语言与智能部门首席产品经理 Anand Balachandran 表示，“我们正在帮助用户节省时间和精力，为他们提供正确的洞察，从而帮助他们更快地实现目标，并利用\
  \ AI 的力量变得更高效。“我们希望实现一种体验：让功能在用户需要时自动出现，这样用户就不再需要浪费时间在 Office 中寻找合适的功能或命令，而是可以专注于他们的业务问题和头脑风暴。”\n\
  \n### 挑战\n每项 AI 功能都由应用数据科学家团队使用机器学习模型进行训练。项目最困难的方面之一是将训练好的模型投入生产环境。根据 Anand 的说法，这里有很多“零碎的部分”，但没有一种清晰的能够在满足所有\
  \ Office 云服务合规标准的同时轻松实现这一点的端到端解决方案。\n\n### 解决方案\n根据 Anand 的说法，选择使用 `Azure machine\
  \ learning` 的 MLOps 是因为它提供了有效的 ML 生命周期管理——一种可扩展、快速且自动的解决方案，可将训练好的模型投入生产。`Azure machine\
  \ learning` 对 `Notebooks` 的内置支持有助于将代码和数据保持在一起，以及数据版本和快照，以实现训练过程自动化。Office 团队首先通过\
  \ `Azure machine learning` 展示了 MLOps。据 Anand 说，通过 ML 训练和工具包，他们学会了“Azure machine\
  \ learning 的 MLOps 如何从头到尾将一切连接在一起”。\n\n随着模型投入生产以及更多用户看到模型推荐，ML 反馈循环也随之出现，这可以根据用户行为触发模型重训练并改进模型。\n\
  \n例如，Editor 团队正在使用 `Azure machine learning` 让 Editor 变得更智能，即使在用户离线工作时也能对问题做出快速反应。Editor\
  \ 团队的科学家使用先进的神经机器学习方法来构建循环、卷积和基于 Transformer 的神经模型，这些模型可以更好地理解任何语言中的语言细微差别，并即使在不符合语法的材料（如标题）中也能检测故障。他们需要在包含数百个\
  \ GPU 的集群上进行分布式模型训练，因为他们训练的模型具有数百万个参数。一个小型的数据科学家团队在 `Azure DevOps` 托管的 `Git` 仓库上协作，作为团队工作流的一部分。\n\
  \n为了让机器学习生命周期变得简单，`Azure machine learning` 服务与 `Azure DevOps` 对接。编辑人员研究对 Office\
  \ 365 消费者有利的模型类型。然后他们利用尖端技术，如开源 `PyTorch` 和 `Horovod`（这些技术都受到 `Azure machine learning`\
  \ 服务的支持）来实现这些功能。之后，团队在离线和在线上对模型进行彻底评估，以确保他们的功能为 Office 用户体验带来价值。\n\nOffice 中采用的\
  \ ML 算法并不需要复杂就能成功。简单的线性回归是最常用的模型，而在合理的情况下会使用深度学习，例如当模型需要处理长尾数据时。例如，在命令预测方面，他们从浅层模型转向了深度模型，后者在做出建议时可以考虑到一个人的整个传记历史。当他们拥有足够数量的标记数据，且生成的模型符合场景所需的性能限制（内存、延迟等）时，就会使用深度学习。\n\
  \n使用 `Azure machine learning` 的 MLOps 是一个用于训练、推理和自动部署的一站式解决方案，对 Office 团队来说摩擦极低。`Azure\
  \ MLOps` 为 Office 团队提供了可审计和重复的模型训练及部署程序。\n\n在过去的两年或更长时间里，该团队已经在整个 Office 产品中发现了各种机器学习的机会。除了产品路线图，他们还有一份\
  \ AI 功能计划。根据 Anand 的说法，他们正处于“向数字化业务转型的代际变革之中，我们一直在寻求提高人类生产力。”\n\n每当你部署 Office 的新版本时，得益于机器学习以及\
  \ `Azure machine learning` MLOps 带来的效率，你都可能获得新的价值。\n\n### 江森豪控 (Johnson Controls)\n\
  \n### 公司背景\nJohnson Controls 制造建筑消防、暖空调（HVAC）和安全设备已超过 130 年。该公司正处于智能城市革命的前沿，拥有广泛的产品线，并将数据科学和机器学习（ML）作为其方法的重要方面。\n\
  \nJohnson Controls 在四年前建立了一个数据科学团队，作为其关注数字化转型的一部分，现在雇佣了超过 50 名从事机器学习项目的员工。目标是将机器学习的使用从小型设备和传感器扩展到大型建筑。该业务目前正在迪拜致力于打造可能是世界上最智能的建筑。\n\
  \n### 机会\n为了实现其愿景，Johnson Controls 需要在不增加成本的情况下跟上建筑设备的需求。特别是冷水机，对建筑效率至关重要。Johnson\
  \ Controls 运行着 4,000 台冷水机，产生的时间序列数据量高达数 GB。通过实时数据分析，提高效率和功能的机会是显而易见的。\n\n工程师已经开始从冷水机传感器读取中推断信息，但他们意识到需要构建完全的预测模型。组织意识到需要转向云和机器学习以获取新的、改进的洞察，从而节省成本并做出更好的业务决策。\n\
  \n### 挑战\n在部署 MLOps 之前，Johnson Controls 在其 ML 之旅中面临许多障碍。最初，公司构建了自己的机器学习流水线，而没有利用外部的最佳实践。版本控制和模型部署都是手动完成的。需要存储的模型规模和复杂性随着活动范围扩大而增长。\n\
  \n数据科学家也意识到需要存储额外信息，例如模型权重。数据漂移导致模型随时间需要需要重训练，导致相同架构的权重集发生变化：这需要创建一个具有标准化存储的模型注册表，以及管理它的带宽。\n\
  \n同时，Johnson Controls 意识到，与他们一直使用的“黑盒”方法相比，他们需要一个适当的、协作的模型开发流水线。\n\n### 解决方案\n\n\
  \n\n\n\nJohnson controls 向微软咨询最佳实践，因为他们开始将目光转向组织之外并将 `MLOps` 视为一种哲学。由于 Johnson controls\
  \ 已经使用了 `DevOps`，`MLOps` 对他们来说是自然契合，他们能够将其许多最佳实践转移到他们的机器学习操作中。\n\n通过 Azure machine\
  \ learning 中的 MLops 功能，他们现在可以轻松地对模型进行版本控制和安装。根据 Johnson Controls 应用数据科学家/数据工程师 Vijaya\
  \ Sekhar Chennupati 的说法，`MLOps` 的价值在于模型注册表。“我们能够自动对模型进行容器化并部署。维护和监控模型历史的能力极大地提高了生产力，”他说。Johnson\
  \ controls 建议对所有新模型使用 `MLOps`，并在理解其价值并收紧流程后，再将 `MLOps` 应用于所有当前模型。\n\n此外，该组织通过进行实验来测试和验证模型架构的假设，查看是否可以获得更好的结果，从而更有协作地构建模型。由于控制能力的改进，可以使用现有模型和数据集快速启动新项目。入门成本和管理成本同时得到了降低。“模型版本控制和依赖管理的便利性使我们的流程更加敏捷，有助于部署的可追溯性，”Chennupati\
  \ 解释道。\n\nJohnson controls 的许多模型现在都在 `MLOps` 中，提供了实际的业务利益，并允许 Chennupati 及其团队执行他们原本无法实现的实验。与现有的\
  \ `DevOps` 系统集成也更加简单。“通过与微软合作，我们帮助开发了集成到 `Azure DevOps` 中的 `MLOps`，以便使用 `Azure DevOps`\
  \ 创建无缝集成的 `CI/CD` 流程。\n\n通过实时使用传感器的序列数据，Johnson controls 能够构建模型来优化冷水机的预测性维护。得益于数据科学团队处理数据的能力，Johnson\
  \ controls 现在的冷水机上有高达 70 种不同的传感器，并且更多正在上线。\n\n总体而言，意外停机时间和平均修复时间都减少了三分之二。曾经是 Johnson\
  \ controls 主要担忧的冷水机停机大幅减少。他们可以提前几天检测未来的停机，并从采取行动以保持客户满意并节省资金和时间。“使用 Azure machine\
  \ learning 中的 `MLOps` 能力，我们能够提高生产力并增强运营，及时上线并创建一个可重复的流程，”Chennupati 补充道。\n\n# 结论\n\
  \n本章介绍了数据科学家与运营团队之间深度协作的通信，旨在消除浪费、尽可能自动化，并利用机器学习产生更丰富、更一致的洞察，章节标题为“MLOps——机器学习运维工程”。\n\
  \n`MLOps` 解决了机器学习应用在开发、部署和运营阶段的共同关注。\n\n接下来将讨论 `MLOps` 的介绍、背景以及其定义。对于机器学习项目，持续集成/交付/训练\
  \ `CI`、`CD` 和 `CT` 是重要的，你需要学习实现和自动化这些技术的技巧。\n\n进一步讨论的是在 `MLOps` 背景下 `DevOps` 与 `MLOps`\
  \ 以及机器学习生命周期的比较，其益处和优势。\n\n接下来的讨论是 `MLOps` 阶段，它包含从设计创建到部署的四个主要阶段。\n\n接下来，我们将讨论流水线——数据流水线和\
  \ ML 流水线、`MLOps` 的框架、实现 `MLOps` 愿景、`MLOps` 成熟度模型、`MLOps` 解决的关键挑战、`MLOps` 最佳实践，以及\
  \ Translink、Microsoft Office 和 Johnson controls 的现实用例。\n\n接下来的章节关于 `xOps` 最佳实践——`DevOps`\
  \ 最佳实践、选择正确的 `DevOps` 工具、挑选工具、主要的 `DevOps` 工具类别、`DataOps` 最佳实践以及 `DataOps` 的最佳数据管理实践、`MLOps`\
  \ 最佳实践、最佳 `MLOps` 工具。\n\n# 关键词\n\n- **MLOps**: 数据科学家与运营专业人员之间协作和通信的实践，有助于管理生产环境下的\
  \ ML 生命周期。`MLOps` 旨在增加自动化并提高生产环境 ML 的质量，同时关注业务和监管要求。\n- **DevOps**: 一种开发和运行大规模软件系统的实践，`DevOps`\
  \ 提供了诸如缩短开发周期、增加部署速度和可靠发布等益处。\n- **DataOps**: 一种为从采集到交付的端到端数据流水线带来速度和敏捷性的实践。快速向数据公民交付受信任、高质量的数据是人员、流程和技术的编排。\n\
  - **流水线 (Pipelines)**: 当团队从偶尔更新单个模型的阶段转变为在生产环境中有多个频繁更新模型的阶段时，流水线方法变得至关重要。在这种工作流中，你不是在构建和维护模型，而是开发和维护流水线。流水线就是产品。\n\
  - **数据流水线 (Data pipelines)**: 数据工程核心概念的一部分，基本上是一个 `ETL` 流水线。在这个流水线中，编码了从源到目的地的旅程。\n\
  - **ML 流水线 (ML pipelines)**: 纯代码产物，独立于特定的数据实例，能够在源代码控制中跟踪其版本，并通过常规软件类型的 `CI/CD`\
  \ 流水线实现自动化部署。\n- **MLOps 阶段**: 从设计创建到部署，包含四个主要阶段——模型创建和训练、模型部署、端到端自动化或学习以及审计跟踪。\n\
  - **框架 (Frameworks)**: `MLOps` 过程提供的解决机器学习模型全生命周期的扩展系统，是一个满足经典 `CI/CD` 过程和部署的机器学习系统运行需求的框架，包括开发、测试、部署和监控。\n\
  - **成熟度模型 (Maturity model)**: 衡量企业以实现 `MLOps` 目标交付 ML 进展的方法。组织可以通过成熟度模型了解自己在旅程中所处位置，以及可以采取哪些步骤来“升级”。在\
  \ `MLOps` 成熟度模型中，根据企业已开始或尚未开始旅程定义了级别。结果是识别出五个名义级别——级别 0 到级别 4。\n\n# 问题\n\n1. 什么是\
