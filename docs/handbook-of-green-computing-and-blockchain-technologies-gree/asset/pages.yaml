  md: '# 2.2 GREEN COMPUTING AND IOT


    In the coming years, there are a few information technology buzzwords that technocrats
    and businesses will be unable to ignore or prevent. Mobile first, artificial intelligence,
    blockchain, immersive experience, micro-service architecture, Zettabyte Age, robotic
    process automation, 3D modification, Internet of Things (IoT), quantum computing,
    and so on are some of these trends [2, 5]. These things will alter the way we
    live today and will govern the world in the future. This thesis focuses on the
    Internet of Things and its implementation in green computing in the current scenario,
    among these trending technologies [1].


    The Internet of Things (IoT) is a term that refers to smart technology that link
    almost all and everyone in the world. The digital world is related to washing
    machines, refrigerators, microwaves, clocks, water taps, homewares, cooking vessels,
    and pots [6]. To be environmentally safe, these IoT devices must be eco-friendly,
    economically viable, and energy efficient [2]. IoTGC (Internet of Things-based
    Green Computing) is destined for such services in order to make the environment
    greener and smarter. The emphasis has been on the design, development, operation,
    maintenance, and control of energy-efficient Internet of Things (IoT) systems
    that are both cost-effective and user-friendly [7, 8]. Because of the numerous
    challenging issues such as global climate change, energy crisis, environmental
    issues, and so on, the field generates genuine interest among researchers [9].


    According to the International Federation of Global and Green ICT (IFGICT), the
    green IoT (IoTGC) or green IT requires the optimum use of the internet, computers,
    and their resources to maintain a healthy climate. Computing systems and peripherals
    must be cost-effective, energy-efficient, safe, easily disposable/recyclable,
    and environmentally friendly. Handheld devices and large-scale data centers are
    needed to fit all types of systems, from mobile devices to large-scale data centers
    [2, 5].


    Policies and plans for the planning and deployment of IoTGC devices based on real-time
    data will provide information about their potential environmental effects. Furthermore,
    if policies are decisive at various levels, substantial energy savings can be
    realized. Policies on energy use, automation systems, data management, and user
    input, among other things, will assist both end users and industries in taking
    the requisite corrective actions to improve IoTGC [7, 10]. The City Explorer is
    an example of this. In a real-life example, it’s a home automation solution with
    layers like data collection, data processing, and services that cut energy consumption
    by 20%.


    # 2.3 IOT AND HEALTHCARE MEDICAL SCIENCES


    IoT involves extended network connectivity to multiple ranges of hardware devices.
    These devices can easily communicate over the internet with the help of sensors,
    transceivers, and microcontrollers. IoT devices are embedded with different technologies.
    These embedded technologies are responsible for running specific tasks in'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'a device [1, 6]. The devices can easily be monitored as well as controlled
    over the internet. IoT devices have a unique identity which allows remote access
    irrespective of the time and location i.e., it allows remote access of devices
    anytime and anywhere [11]. Initially, IoT was being widely used for manufacturing
    purposes but now the emphasis is to implement IoT in homes, offices, and in various
    fields like agriculture and healthcare.


    Healthcare may be defined as the well-being of humans by prevention, treatment,
    and diagnosis of various diseases at the right time. Not only the absence of disease
    but healthcare is also defined as the well-being of physical and mental health
    of a person. It plays an important role in Gross Domestic Product (GDP) or the
    economy of a country. Moreover, healthcare can be achieved by medical professionals
    with the use of latest IoT technologies [7, 12]. Although IoT is not the only
    smart approach used in healthcare in today''s world. it provides smart objects
    which act as the ultimate building blocks in the development of medical sciences
    and healthcare. IoT is a next generation approach and would change the lifestyle
    of the upcoming generation [3]. IoT has many advantages due to which it is being
    widely used in healthcare. Some of its advantages are:


    +   1. Detection of disease: IoT devices have a unique feature of sensing and
    detecting the physical world. So, it helps in easy detection of disease. So, there
    are very less chances of diseases being left undetected.

    +   2. Reduces the cost of care: Using IoT devices reduces the costs of regular
    visits to the doctor. Hence, this results in affordable treatment.

    +   3. Efficient results: Due to the characteristics of IoT, the devices can record
    any major change in the patient''s health. So, these devices provide efficient
    results leading to satisfaction of the patients.

    +   4. Effective treatment: IoT devices analyses the parameters required for patients
    and provides effective treatment according to the requirements of the patient.

    +   5. Less paper documents: With the help of IoT devices all the data can be
    stored online. Hence, there is no need to manage paper documents in hospitals
    and clinics.

    +   6. Reduces human labor: Most of the work is done by machines. Hence, there
    is no need for a large number of humans to perform any work.

    +   7. Saves time: In conventional times, patients had to travel long distances
    to reach hospitals or clinics and stand in long queues to get their treatment
    done. But now these devices save a lot of time by getting their treatment done
    at home itself. Now, patients do not need to travel long distances or stand in
    long queues.

    +   8. Saves lives: Any change in the health of a patient will trigger a notification
    to different parties and appropriate action could be taken. So, life will be saved.

    +   9. Reduced Maintenance costs: Now, with this technology coming into action
    there is no need to spend huge amounts on maintenance of medical equipment.


    Therefore, IoT will prove to be a boon in the healthcare sector. It could provide
    effective treatment at affordable costs, thereby increasing the lifespan of patients
    and reducing deaths due to chronic diseases [4]. This can lead to a great development
    in the field of healthcare [5].'
