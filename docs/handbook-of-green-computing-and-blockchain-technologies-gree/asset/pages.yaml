- pgno: 7
  md: '# # Preface


    Promoting the use of renewable energy resources and limiting the use of non-renewable
    sources have been prime subjects of concern for over a decade now in order to
    safeguard our planet. The goals of sustainable development are of paramount importance,
    and are imperative to attain to ensure that there are sufficient resources and
    a healthy planet for future generations. Many non-renewable energy resources are
    already employed to create the required power – for instance, wind energy and
    solar energy.


    Similarly, in the extensively developing area of technology, such a reasonable
    use of resources is crucial. Green computing is one such norm that promotes using
    technology and computing in an eco-friendly manner. It involves using, creating,
    or manufacturing and disposing of the devices used for computing in such a way
    that it does not have any adverse ramifications on the environment. Through this
    book, an effort in support of the idea of promoting green computing and establishing
    the rationale for green computing is made.


    # ## Chapter 1


    The first chapter talks about how technology has become so dominant in the present-
    day world with its influence in almost all areas of life. But the same technology
    also has adverse effects on the environment. It is because of this fact that researchers
    and governments are now looking for greener alternatives in computing, such as
    green computing. The chapter in its later parts discusses the advantages of cloud
    computing, etc. Also, the history and development of blockchain and its applications
    are talked about in the first chapter.


    # ## Chapter 2


    The second chapter discuss how the Internet of Things (IoT) is employed in various
    sectors, such as automation and agriculture. The chapter primarily focuses on
    green IoT and the applications it possesses in the field of healthcare. A technology
    to track the intake of medicines for tuberculosis is proposed and discussed.


    # ## Chapter 3


    The third chapter discusses the concepts of neural networks and blockchain. The
    chapter begins by introducing neural networks and how they are created and how
    blockchain is linked to them. Data propagation, which is the transfer of data
    and information back and forth along the neural network, is talked about in this
    chapter. Finally, a review of papers is carried out, using Python modules and
    libraries, and how neural networks and blockchain can be used together to tackle
    the challenges currently faced is discussed.


    # ## Chapter 4


    The authors of the fourth chapter have presented a significant appraisal of blockchain
    technologies established in related works and consider their suggestions for administrative
    processes. The framework is designed in preparation for additional research'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'into the considerable advantages of blockchain applications in the digitization
    of government and the participation of blockchain structure and its utilizations
    to fulfill community need for public value.


    # Chapter 5


    The fifth chapter provides a brief overview of convolutional neural networks –
    i.e., trained on the basis of image data, which is propagated in forward and backward
    propagation. The chapter concludes with a literature review of research on the
    use of convolutional neural networks and blockchain technology together with open
    challenges in the similar domain.


    # Chapter 6


    The sixth chapter provides the current scenario of the Indian agriculture sector
    and proposes an architecture to transform this sector. The limitations and challenges
    faced during the implementation of blockchain technology in agriculture, along
    with its advantages, are discussed.


    # Chapter 7


    The seventh chapter talks about how the lives of many people have been affected
    by COVID-19. Many businesses suffered the inevitable by having to incur heavy
    losses. The chapter talks about a proposed blockchain model that can aid in secure
    and far more efficient transactions in the supply chain which is the major part
    of large-scale businesses in the modern era. The benefits of blockchain, such
    as transparency and immutability, and also the challenges faced by blockchain,
    are discussed in detail in this chapter.


    # Chapter 8


    The eighth chapter introduces microgrids used for blockchains or distributed ledgers
    as a new and useful technology for energy companies, as well as for startups,
    government entities, and academia. The authors state that blockchains promise
    to be highly transparent, impossible to falsify, and security-tamperproof, particularly
    when employed in tandem with smart contracts. Blockchain activities and projects
    work to inform readers of innovative, scholarly, and theoretical research in the
    energy sector.


    # Chapter 9


    The ninth chapter represents blockchain technology as a route bridge to assist
    government in all its usual processes and decisions. Nowadays, people as well
    as all electro-mechanical devices are in some way connected to the internet toward
    sharing and receiving data efficiently. Network servers may act as authorities
    and help to enhance efficiency in workflow, control, and enforcement of government
    laws as amended from time to time. Also, blockchain-based distributed ledger is
    secure, readily auditable and immutable to keep track of government data where
    data is secure and unaltered to eliminate forgery for personal interest. Governance
    may establish streamlined procedures for various government activities through
    emerging technologies such as blockchain. It removes the involvement of unethical
    third parties and corruption from most of the government activities– namely, the
    election process, resource procurement, political mergers, funds allocation and
    distribution,'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'responsibilities of various representatives (leaders) and government political
    employees, and government asset management, to name a few. It is expected that
    the operations of the government will be transparently and efficiently managed
    and controlled through this emerging technology. This chapter covers relevant
    aspects of blockchain toward suitable governance.


    # Chapter 10


    In the tenth chapter an advanced research and analysis is introduced in the context
    of healthcare. The main objective is to get the information about existing systems
    and their limitations and to seek a solution involving blockchain technology in
    the healthcare sector. The analysis approach consists of the collection of data
    and its properties with a bibliometric review. Hence, blockchain is playing a
    vital role in developing a system in the context of healthcare which will distribute
    information about diseases and manage the health of patients by keeping all their
    records.


    # Chapter 11


    The authors of the eleventh chapter talk about SRAM gadgets to show genuine dangers.
    Many edge gadgets can be forged or cloned; the graceful chain is inadequately
    secure. It is an unquestionable requirement to distinguish edge gadgets’ sourcing
    extraordinarily and check their legitimacy intermittently at run-time. All the
    world coordinates blockchain innovation to validate asset compelled, minimal effort
    edge gadgets. SRAM-based devices use genuinely uncloneable capacities (PUFs) to
    produce one of a kind “advanced fingerprint” (gadget IDs). The authors use a “locally
    permissioned” blockchain framework to validate edge gadgets for a safeguard inside
    and out methodology. Gadgets can be validated occasionally to forestall gadget
    cloning. Target situations can be enormous and have differed trust among clients
    and come up short on a particular border; this “nearby” blockchain procedure is
    consequently relevant, particularly since blockchains gain security after some
    time. This proposed strategy ensures against such shams in portable settings inside
    an IoT framework as well.


    # Chapter 12


    Chapter 12 begins by giving the reader an introduction to convolutional neural
    networks, then takes one step ahead by introducing the terminologies related to
    convolutional neural networks and architecture of the convolutional neural network.
    Data propagation is the most important step in convolutional neural networks trained
    on the basis of image data, which is propagated in forward and backward propagation.
    The final step in full understanding of convolutional neural networks comes with
    the implementation of the neural network using Python libraries. The chapter concludes
    with a literature review of papers on the use of convolutional neural networks
    and blockchain technology together with open challenges in the field.


    We hope this book will be widely read. If we are to avoid the blunders of the
    past, then we need to change direction and start benefiting from the knowledge
    base created by the researchers. We did not have this chance a decade ago. Now
    is the right time. Finally, we want to convey our thanks to the editors, publishers,
    and authors of all the chapters who have helped bring this book to life.'
