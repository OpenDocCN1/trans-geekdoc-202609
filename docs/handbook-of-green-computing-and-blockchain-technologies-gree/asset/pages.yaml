  md: '# # 1.1 INTRODUCTION TO GREEN COMPUTING


    Green computing consists of two words: ‘GREEN’ and ‘COMPUTING.’ GREEN concerns
    the environment, and COMPUTING means processing. So, it’s computing in a way that
    doesn’t harm the environment. Green Computing is often known as green technology
    which is the utilization of computers and their resources in an eco-friendly manner
    [1–3].


    It’s the study of designing, manufacturing, utilization, and dumping of computing
    devices with no or minimal impact on the environment. Computers are everywhere,
    so the waste generated from computers and their resources is significant and is
    directly harming the environment in the form of e-waste.


    A lot of natural resources are consumed in using computer resources for manufacturing
    raw material, then to run the computer electronic power is required and for dumping
    again natural resources are exploited; all this badly impacts the environment
    [4, 5]. The objective of green computing is to limit the use of hazardous material,
    maximize energy efficiency, recycle e-waste, and promote biodegradable products,
    as shown in Figure 1.1.


    # # 1.1.1 HISTORY OF GREEN COMPUTING


    In the 1990s computers were huge and so was their energy consumption, and they
    were not switched off when they were idle, so the waste generated from them was
    tremendous. According to the US Environmental Protection Agency (EPA), “in 2006,
    IT industry consumed 1.5% of the total electricity used in the United States,
    which is roughly 61 billion kilowatt-hours of electricity.” This equals a bill
    of approximately $4.5 billion. Servers and data centers installed by the US federal
    government are responsible for 6 billion kilowatt-hours of electricity consumed.


    This was taken into consideration and the following measures were adopted for
    the reduction of waste generated from computers [6].


    +   - The first measure to adopt was started in 1992, when the EPA formed its
    Energy Star Program.

    +   - In 2006, more stringent requirements for computational efficiency were added.


    ![](img/c5c79333a43e0e9a69d1119635e3c244_20_0.png)


    FIGURE 1.1 Objective of green computing.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - In 1997 UN''s Kyoto protocol orders manufacturers to reduce carbon emissions
    and to calculate electricity utilization.

    +   - The European Union in 2003 required Restriction of Hazardous Substances
    (RoHS) which limited the use of certain toxic substances to use in the manufacturing
    of electronic products.

    +   - In 2006, the USA passed a law to promote and study computer servers that
    are energy efficient.

    +   - In 2007, US President George W. Bush passed executive order 13423, which
    mandated all US federal agencies to utilize the Electronic Product Environment
    Assessment Tool (EPEAT), which rules standards to increase the efficiency and
    life of electronic products.

    +   - TCO certification was launched by the Swedish organization TCO development
    which promotes the low electrical and magnetic emission from CRT-based computer
    displays [4].


    # ## 1.2 ROLE OF GREEN COMPUTING IN INDUSTRY


    ICT (Information and Communication Technology) is taking over all the world at
    a fast speed, along with bringing an IT revolution and alarming by the trouble
    it''s causing the environment. We are all familiar with the rate of global warming
    and the depletion of the ozone layer; the level of CO2 emissions caused by the
    IT industry is a significant percentage that disrupts the life cycle [7–9].


    Along with initiatives from government, the industry is also responsible for adopting
    measures to promote green computing [1, 2]. The following are some industry measures
    for green computing:


    +   1. On June 12, 2000, the Climate Saver Computer Initiative (CSCI) was started
    which focuses on reducing the electric power consumption of PCs in both active
    and inactive mode.

    +   2. Green Grid was founded in 2007. This is a global-level trust which looks
    forward to advancing energy-efficient data centers and business computer ecosystems.
    Green Grid is backed by several companies in the industry, including AMD, APC,
    Dell, HP, IBM, Intel, Microsoft, Sun Microsystems, and VMware.

    +   3. Companies in the IT industry are now using energy-efficient hardware to
    reduce carbon emissions.

    +   4. Google is now using servlets and energy-efficient cooling which reduces
    the harmful impact on the environment.

    +   5. To encourage companies to promote green computing there is an organization
    that facilitates them by giving special awards for implementing software and hardware
    which don''t impact the environment.

    +   6. IT companies are also responsible for disposing of e-waste responsibly
    and substances like aluminum, copper, iron, and plastic should be taken and reused,
    and non-usable substances should be recycled.

    +   7. The industry should also focus on increasing the lifetime of its products
    so that they don''t become non-operational after only a few years.'
