  md: '# ## 9.2 BLOCKCHAIN''S UNIQUE FEATURES


    Blockchain technology is made up of some of the technological components which
    include hash function, cryptographic algorithm, and decentralized network. **Distributed
    or decentralized** ledger offers evenly distributed power compared to central
    authorities. These decentralized ledgers are **immutable and auditable**, since
    immutable means stored data cannot be erased or altered. The hash function is
    used to avoid alteration in stored data. The cryptographical algorithm which is
    used in blockchain is a public key cryptography.


    # ## 9.3 PURPOSE OF BLOCKCHAIN-BASED GOVERNANCE


    Adopting block chain technology for government operations will help to begin a
    cycle of confidence in the judicial and fiscal system that has been lacking in
    recent years. A few of the domains being affected by blockchain technology are
    listed below:


    +   - Property Registration

    +   - Identity Administration

    +   - Voting System and Election Process

    +   - Protection of Sensitive Data

    +   - Tracing Supply Chain Management.


    The main purpose of blockchain-based governance is to serve the nation better.
    It may be possible only with building trust of civilians in government activities.
    True traceability, transparency, identity management, unaltered data on distributed
    ledger, welfare distribution, handling of tax issues, etc. play an important role
    managed by blockchain.


    # ## 9.4 BLOCKCHAIN TECHNOLOGY – THE WAY TO ASSIST THE GOVERNMENT


    Blockchain assists government operations to properly manage its key functions.
    Although blockchain, a decentralized public leader, differs from the governance
    fundamentals, which are mostly based on centralized public sector units, the incorporation
    of this technology has the potential to revolutionize the way the government conducts
    its affairs and make it quick, efficient, and transparent.


    The Indian government has announced a spate of projects in recent years that use
    this revolutionary technology for its e-governance projects. Interest in blockchain
    has even been shown by state governments. In June 2017, the Andhra Pradesh and
    Telangana state governments indicated that they were planning to adopt blockchain
    solutions for land registry, data protection, and KYC (Know Your Customer) records.


    Interest in the adoption of blockchain solutions has also been expressed by states
    like Maharashtra, Gujarat, and Uttar Pradesh. The three key areas listed below
    are where the inclusion of blockchain in governance can make a fundamental difference
    to the way the government implements its social agenda.'
