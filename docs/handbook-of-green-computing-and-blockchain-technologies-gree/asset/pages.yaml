    # 6.2 BLOCKCHAIN TECHNOLOGY: AN OVERVIEW


    Blockchain technology comes in consideration after the development of bitcoin
    (digital currency) by Satoshi Nakamoto (2008). Blockchain technology may be defined
    as a distributed ledger technology (DLT) which fetches the unalterable time-stamped
    value of each transaction between untrusted parties in a decentralized and peer-to-peer
    network. Records stored in the distributed ledger cannot be changed subsequently.
    Formation and validation of all records are done by all the parties involved in
    this network on the basis of consensus protocol. Basically, it consists of a number
    of blocks and one block is connected to the next one and so on by using a hash
    function, to form a chain-like structure [4]. This structure can be compared to
    the structure of a linked list.


    **I. Types of nodes in blockchain:** Nodes are basically computers or a machine
    connected to other computers and used to form a blockchain network. Examples of
    nodes are servers, laptops, and mobile phones. Nodes are used to store and maintain
    the data. Increasing number of nodes will increase the level of decentralization
    of the network. There are two types of nodes in a blockchain, normal nodes and
    miner nodes, as shown in Figure 6.1:


    +   - **Normal nodes**: Normal nodes are the standard nodes used to store the
    whole information in their ledger. It creates multiple copy of blockchain ledger
    and are responsible for distributing the same. This type of node can reject the
    incoming transaction if they are not valid.


