  md: '# 1.8.1 PUBLIC BLOCKCHAIN


    As the name suggests it''s for everyone. In this type of blockchain, you have
    not required any permission to enter and do some transaction. It doesn''t have
    any entity to look over the network, and it can''t be tempered by a single person
    which provides more security. Cryptocurrencies like Ethereum, Bitcoin, and Litecoin
    use a public blockchain so that there are no restrictions to do any transaction,
    any person can enter into a ledger and perform a transaction in a decentralized
    manner [22].


    # 1.8.2 PRIVATE BLOCKCHAIN


    As its name suggests this type of blockchain can''t be accessed by anybody unlike
    that of a public blockchain. It''s also known as permission blockchain, in which
    there are certain entities of the organization which looks over the network and
    provide access to certain people and also has the power to revoke the access from
    anyone else. This type of blockchain is majorly used in supply chain management
    so that nobody apart from the team knows about the goods [23].


    # 1.8.3 HYBRID BLOCKCHAIN


    Hybrid blockchain is another type of blockchain. This is the blockchain which
    is included in both the public and private blockchain. The closed habitat is created
    instead of making it public. It''s also more secure to 51% attacks and the regulations
    can be altered according to circumstances. In an industry related to aviation,
    supply chain management uses Hybrid Blockchain because it provides them trust,
    transparency between the user and employees [24].


    # 1.8.4 CONSORTIUM BLOCKCHAIN


    It''s the semi-decentralized network with having more than one entity; they are
    regulated by some team or set of instructions rather than by a centralized or
    decentralized node. The main objective that it provides is more security, scalability,
    have more efficiency and regulations can be changed [25].


