  md: '+   • **Proof of Elapsed Time (PoET)**: This mechanism is frequently used in
    permissioned blockchain networks. PoET is used to make decisions on the mining
    rights and the winners of the block on the network. The basis of this mechanism
    to work is on the waiting time. Each node involved on the network is assigned
    with some waiting time randomly and the node which completes the assigned waiting
    time is rewarded with the new block. Repetition of the process will be done to
    discover the new block. This mechanism is an energy saver as nodes go to sleep
    during the waiting time. PoET is used in Hyperledger Sawtooth and in resource-efficient
    mining.


    # IV. Key components of blockchain networks: To set up any network, there is a
    requirement for hardware, software, protocols, etc. Similarly, there are some
    key components with which the blockchain network can be modeled:


    +   • **Nodes**: In the blockchain network, computers are considered as nodes.
    Already, we have discussed the normal and miner nodes.


    +   • **Miners**: These are the particular nodes whose task is to verify and validate
    the exchange of information or transaction.


    +   • **Block**: This is defined as a data structure whose job is to record all
    the transactions and acts as page of the record file or the ledger.


    +   • **Chain**: This is formed by an arrangement of blocks in a defined order.


    +   • **Transaction**: This is the record of all the information exchange between
    two or more nodes and is further broadcast to the entire network.


    +   • **Consensus**: This is a protocol or terms accepted by the nodes existing
    in a network.


    +   • **Smart Contracts**: Smart contracts are the coded program helps to provide
    a safe environment for the communication. Also, it examines whether the nodes
    or devices work in their limits.


    # V. Block structure: The architecture of each block has a block header and a
    block body as shown in Figure 6.3. Block header has the following fields:


    +   • **Version**: Size of this field is of 4 bytes and used to have the knowledge
    about protocol updates.


    +   • **Time stamp**: This value is used to determine the formation and acceptance
    of data in that block by the network. it has size of 4 bytes.


    +   • **Previous Block Hash**: This field is used to store the hash code of previous
    block. This hash code is responsible to make relationship and maintain the order
    if its (block) creation with the other block exist in the blockchain. Previous
    block hash has the size of 256 bytes.


    +   • **Merkle tree**: This is created by using the hash of each transaction associated
    with it. The structure of Merkle trees is almost similar to binary tree. In Merkle
    trees, each hashed transaction takes place in same block, and is again hashed
    to form a tree. Size of this field is of 32 bytes.


    +   • **N-bits**: This defines the difficulty target to encountered by the miners
    to resolve a block.


    +   • **Nonce**: This is a short form of “number only used once” and is of 4 bytes.
    Nonce is a pseudo-random number that is further used by the miners for a valid
    block.'
