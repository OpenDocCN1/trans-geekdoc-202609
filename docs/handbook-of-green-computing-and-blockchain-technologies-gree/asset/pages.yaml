- pgno: 79
  md: '![](img/c5c79333a43e0e9a69d1119635e3c244_79_0.png)


    # FIGURE 5.7 Backward propagation.


    where \(\eta\) is the learning factor which is a hyper parameter and the goal
    of the algorithm is to update weights and bias for each of the neurons and to
    optimize the error. Gradient of loss with respect to \(W_4\) is calculated as:


    ```

    \frac{\partial E}{\partial W_4} = \frac{\partial \{y_p - y_a\}^2}{\partial W_4}

    ```


    ```

    \frac{\partial \{y_p - y_a\}^2}{\partial W_4} = 2 * \{y_p - y_a\} * \frac{\partial
    y_p}{\partial W_4}

    ```


    Let''s consider linear activation function:


    ```

    y_p = a * (W_4 x_4 + W_5 x_5 + b_3)

    ```


    ```

    \frac{\partial y_p}{\partial W_4} = a x_4

    ```


    \(W_3, x_4, x_3, b_3\) are considered constants while doing partial derivative
    with \(W_4\). Similarly we can calculate gradient of error due to bias.


    ```

    \frac{\partial y_p}{\partial b_3} = a

    ```'
