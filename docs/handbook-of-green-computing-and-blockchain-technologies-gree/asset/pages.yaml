    Blockchain as secured as it could be also faces a couple of security problems.
    One such problem is “the majority attack.” If any entity at any point has more
    than 51% of the computing power, they have the ability to assume control of blockchain.
    Another issue is fork problems. These problems are related to the version of the
    node when software is due an upgrade. Forks are of two types: soft and hard [40].


    Another major issue with blockchain is the problem of scalability. The traditional
    transactions systems are accepted widespread because of their speed of processing
    transactions. On the other hand, Bitcoin and Ethereum, the two largest networks
    running on blockchain are lacking by a huge margin in this aspect. There is also
    not much clarity about blockchain as such, which acts as a significant barrier
    for it to be adopted by masses [41].


