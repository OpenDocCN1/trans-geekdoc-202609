    # 3.2 ARCHITECTURE OF AN ARTIFICIAL NEURAL NETWORK


    Neural network architecture is mainly divided into basic components of layers
    having neurons and neurons having weights, biases, and activation functions.


    # 3.2.1 Layers


    Artificial neural networks have basically three types of layers:


    # 3.2.1.1 Input Layer


    First layer of a neural network which takes input from the data and where each
    neuron gets input from the feature of the given data and input layer neurons are
    equal to features in the given data.


    # 3.2.1.2 Output Layer


    Last layer of a neural network which gives the output of the model, neural network
    output can be of either regression or classification. A neural network with regression
    output will have only one neuron in the output layer while in classification output
    layer neurons depends on number of classes. In regression a single value will
    be returned by the neural network and in case of n classes n probabilities are
    given'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'where each probability signifies the chance of that class being the predicted
    class. Maximum probability class is taken as the final predicted class.


    # 3.2.1.3 Hidden Layers


    All the layers which are between input layer and output layer are considered as
    hidden layers. Each layer is connected with its previous and next layer as it
    takes input from previous layer and gives output to the next layer. These layers
    are not visible to user as the user only gives input and expects output so the
    layers are hidden from perspective of the user (Figure 3.1).


    Yellow-colored neurons represent the input layer neurons which takes the input,
    pink-colored neurons are hidden layer neurons which take input from the input
    layer, and blue-colored neuron is the output layer neuron which gives the predicted
    class or regression output.


    # 3.2.2 Neurons


    The neuron is the smallest unit of the neural network which takes input from all
    previous layers of neurons, processes it, and sends it to all neurons in the next
    layer. Let’s understand what a neuron does when it gets input from the previous
    layers, first it calculates the summation of product of each input value and weights
    assigned for that value in the particular neuron and then add bias value to it
    after it activation function is applied and that output is sent to next layer
    neurons. The activation function transforms the summation of product of weights
    and inputs (with addition of bias) so that it can be easily recognized by the
    next layers whether it is useful input or not (Figure 3.2).


