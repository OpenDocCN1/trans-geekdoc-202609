  md: '![](img/c5c79333a43e0e9a69d1119635e3c244_194_0.png)


    # FIGURE 12.9 Peer-to-peer network.


    then we should also change the data in other computer in system connected in the
    peer-to-peer manner (Figure 12.9).


    # 12.4 HOW WE ADD A NEW BLOCK IN OUR SYSTEM


    The process given by Satoshi Nakamoto in 2008 is explained in following steps:


    +   1. When a new transaction comes, it will first be broadcast to all nodes.

    +   2. In the second step, each and every node collects this new transaction into
    a particular block.

    +   3. In the next step, each node is working on finding a consensus for this
    block.

    +   4. In the next step, when a node gets a consensus it will broadcasts the block
    to all available nodes.

    +   5. Now, if all the transactions in the block are marked as valid and not behave
    malicious, then only nodes will accept the block.

    +   6. Lastly, nodes express their acceptance of the block by working on creation
    of the next block in the chain, by joining the hash of the accepted block as the
    previous hash [3].


    Now, we come to the point that the data in our system is transparent and immutable.'
