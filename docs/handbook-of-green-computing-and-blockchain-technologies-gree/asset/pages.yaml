    # ### 12.1 INTRODUCTION


    The internet nowadays has great importance for all of us to connect billions of
    people around the world. It is used for communicating and collaborating online.
    However, it was initially built for moving and storing information. It has changed
    the way we do business. Now, for the first time in history, two or more parties
    anywhere in the world can transact and do their business peer to peer with the
    help of blockchain. Nowadays, blockchain – “the trust protocol” – represents the
    second era of the internet.


    The internet was initially designed to move information. It was not created for
    the purpose of sending or managing assets.


    +   There are two types of systems available:

    +   1. Centralized

    +   2. Decentralized


    In a centralized system, there is a single authority and everyone in the system
    is relying on the single authority for availability of data. In our day-to-day
    life, most systems are centralized in nature. Examples are Facebook, Google, Uber,
    Amazon, Netflix, etc. Centralized systems also have the drawbacks, such as:'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   1. If the central authority fails, our whole system is not working.

    +   2. It is also possible that central authority is biased to some participants
    in the system.


    Unlike the centralized system, a decentralized system doesn''t have a single authority.
    In fact, all the participants in the system have a copy of the data. It means
    if anyone can change the database, others can also see their reflection.


    To overcome the drawbacks of centralized systems, blockchain was developed. It
    was first introduced by researchers in 1991. But it was mainly used in bitcoin
    in 2009. Nowadays, bitcoin application has a very high demand in cryptocurrencies.


    # 12.1.1 WHAT IS BLOCKCHAIN?


    It is a platform for exchanging digital assets peer to peer, from me to you. That’s
    why we call it an internet of value.


    Blockchain is defined as a decentralized distributed ledger that records the provenance
    of exchanging a digital asset. Ledger refers to the immutable database [1].


    In other words, it has a chain of blocks connected to each other with the help
    of previous block hash. Each block contain three things: hash, data, previous
    block hash (Figure 12.1).


    The above figure says that each block is connected to previous block hash and
    a new hash for that particular block hash is calculated by combining data and
    previous block hash.


    # 12.1.2 BLOCKCHAIN IS TRUSTWORTHY


    Suppose we change the data of second block (Figure 12.2).


    Then it will change the hash of that particular block. Then ultimately it will
    change every block hash afterwards (Figure 12.3).


    Then the hash of the particular block mismatch with the next block. As a result
    it will inform that data is change in the system (Figures 12.4 and 12.5).


    Now, the next block hash also changes accordingly (Figures 12.6 and 12.7). Hence,
    we will see that if we change the data in our system, it will change the subsequent
    blocks afterwards. Hence, it is trustworthy.


    +   - Linked list

    +     1. Replicated

    +     2. Distributed


