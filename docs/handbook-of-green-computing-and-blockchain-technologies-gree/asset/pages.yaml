  md: '# 1.3.3 POWER MANAGEMENT


    The Advanced Configuration and Power Interface (ACPI) has set the standards to
    regulate the power-saving aspect, like allowing the system to turn off or to put
    devices like monitor and hard drives to sleep after a certain period of time.
    The system can also turn into hibernate mode when major parts are off, they also
    provide computer BIOS to manage the power functions. In addition to it, some systems
    allow the user to manually adjust the power loading according to their workload.


    # 1.3.4 STORAGE DEVICES


    In the earlier time, the large storage disk drive was used to contain the data,
    they used to be large in size and also have components in them but a now smaller
    disk or solid-state drive (SSD) stored data in flash memory which reduces a lot
    of extra wastage created by earlier large drives [7]. Now due to advancement in
    storage techniques, storage devices have moved to online which nullify the utilization
    of resources plus provide more space as compared to drives.


    # 1.3.5 DISPLAY DEVICES


    Light used in the display screen takes a lot of power consumption. Earlier CRT
    screens were used to consume energy more than the LCD screen monitor. LCD uses
    a fluorescent bulb while LED screens use light-emitting diodes in place of bulbs
    which cut the greater percentage of electric consumption [6]. Now, we are introduced
    to a feature Dark Mode, the main motive behind this mode is to reduce the display
    consumption to a greater extent, and it directly impacts the battery life growth
    and power consumption


    # 1.3.6 CLOUD COMPUTING


    The introduction of cloud computing has brought a great revolution for the green
    computing area. Bringing all the things to the cloud has put a full stop from
    the utilization of many resources, like bringing storage to the cloud has cut
    the consumption created from disk drives and online shopping platform has also
    created a hassle-free platform for the user and also saved a lot of liters of
    petrol on going to the market [10].


    # 1.3.7 DATA CENTER POWER


    Datacenter power is one of the most areas in the IT industry that consumes power
    consumption. Based on Greenpeace’s study, data centers are accountable for 21%
    of IT industry electricity consumption which is a lump sum of 382 billion kilowatt-hours
    per year. So, techniques like virtualization are used to put a restriction on
    its electricity consumption [5]. The IT industry is also keeping a check on eliminating
    the underutilized data centers, Google is one of the best examples as it has been
    able to reduce 50% of electricity consumption of industry average [11].'
  merge: -1
  img_proc: true
