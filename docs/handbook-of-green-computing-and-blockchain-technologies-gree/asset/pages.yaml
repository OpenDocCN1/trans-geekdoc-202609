  md: "# III. Consensus mechanism\n\nConsensus mechanism is a protocol which makes\
    \ an agreement and must be accepted by all the nodes in that network. It helps\
    \ to validate the transaction occurring between the nodes [8]. The consensus mechanism\
    \ is important for blockchain network to confirm the connectivity of the nodes\
    \ to the same network. Various types of consensus mechanism are explained as follows:\n\
    \n+   - **Proof of Work (PoW)**: This mechanism is used to create new blocks in\
    \ the blockchain, and it is done by solving the problem. This computational puzzle\
    \ is assigned to miners as a challenge. In PoW consensus mechanism a lot of energy\
    \ or computational power is required which makes this mechanism very costly. Example\
    \ of cryptocurrencies using PoW are Litecoin, Monero coin, and Ethereum.\n+  \
    \ \n+   - **Proof of Capacity (PoC)**: Proof of Capacity consensus mechanism is\
    \ also known as Proof of Space (PoS). This consensus mechanism is very interesting.\
    \ In this algorithm, mining nodes use the space of digital storage like hard disks\
    \ to store the data of challenges offered by the service provider. This is known\
    \ as plotting. After that, these pre-stored solutions are used to solve the challenges.\
    \ This PoC is considerably faster than PoW. For this reason, PoC takes far less\
    \ time to create blocks as compared with PoW.\n+   \n+   - **Byzantine Fault Tolerance\
    \ (BFT)**: This is a property in which the system has the capability to tolerate\
    \ faults in the network. BFT arranges the records in a proper way which cannot\
    \ be tampered with until the number of betrayers is more than one-third of the\
    \ total number of nodes in the network.\n+   \n+   - **Practical Byzantine Fault\
    \ Tolerance (PBFT)**: This was introduced by Barbara Liskov and Miguel Castro.\
    \ The concept of this mechanism is to bear the inoperative and venomous nodes\
    \ in a distributed system to acquire consensus. Later, these nodes will be replaced\
    \ by duplicate nodes when the number of faulty or malicious nodes is greater than\
    \ one-third of all nodes in the network. An example of the implementation of PBFT\
    \ is Hyperledger Fabric.\n+   \n+   - **Proof of Stake (PoS)**: In this consensus\
    \ mechanism, nodes are selected randomly to validate the blocks and selected nodes\
    \ are known as validators. This mechanism is quite different and interesting from\
    \ the previous consensus mechanism. In this mechanism, there is no chance for\
    \ the validators to acts as a competitor in respect to the other nodes. Validators\
    \ stake their cryptocurrency (coins or tokens) to participate in activity of blocks\
    \ validation in a limited manner. They are selected randomly on the basis of the\
    \ number of maximum coins to solve the challenge. After validation of the block,\
    \ validators are rewarded with some proportion of their stake. This process needs\
    \ less energy, lowers the cost, and is faster in comparison with PoW.\n+   \n\
    +   - **Delegated Proof of Stake (DPoS)**: This mechanism is used to select the\
    \ validators which is not based on the maximum numbers of coins or cryptocurrency.\
    \ In DPoS, all the nodes having cryptocurrency make a group of delegates whose\
    \ task is to authorize and validate the transactions. This consensus mechanisms\
    \ remains decentralized."
