    # 2.5 CHALLENGES OF USING IOT IN HEALTHCARE


    As we know, IoT devices are connected to each other on a network with the help
    of the internet without any human involvement [5]. These devices are also responsible
    for communicating and interacting between the devices and the users. Though there
    are distinct features and benefits that IoT devices possess, there are also many
    challenges in these devices. Various challenges that occur while the implementation
    of IoT devices are as follows:


    +   (i) **Networking issues**: Loss of connectivity to the internet and congestion
    in wireless networks. It may occur due to physical and electronic interference.


    +   (ii) **Complex software**: The software used in these devices must be updated
    from time to time, but the software used for such devices is very complex due
    to the complex design of these devices. So they are very difficult to modify and
    update.


    +   (iii) **High installation cost**: IoT devices usually cost very high due to
    complex hardware and sensors used in such devices so it may sound unaffordable
    to some persons.


    +   (iv) **Security issues**: These devices collect and store data from various
    sources. The stored data may contain some confidential information. Cyber-attacks
    may be faced by such devices which can lead to unauthorized access of sensitive
    data.


    +   (v) **Lack of education**: Many people who are not educated may fail to understand
    the implementation and design of these devices.


    +   (vi) **Societal issues**: It is very important to have devices according to
    the requirements of the society. Their requirements change with time and so is
    the need to change the features of devices. Reintegrating new features will be
    very costly and will require high investments.


    +   (vii) **Slow adoption of technology**: Many people are not well aware of this
    new technology IoT. This would lead to the slow adoption of this technology [3].


    +   (viii) **Limited battery power**: IoT devices have a limited battery power
    so they are prone to failures.'
