    # ### 5.1 INTRODUCTION TO CONVOLUTIONAL NEURAL NETWORKS


    Convolution mathematically means we produce a new function by using two functions
    the same way. In a convolutional neural network we try to convert the input image
    to a more insightful image where features can be detected very easily by applying
    many filters on the image to detect the features and have a better training phase
    of the model. Convolutional neural networks are widely used for problems where
    images are the input dataset and main objective of the model is to find different
    patters or features in the images.'
