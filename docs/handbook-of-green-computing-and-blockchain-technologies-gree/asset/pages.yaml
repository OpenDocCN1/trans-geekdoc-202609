    can be

    of one byte and max value stored by one byte is 255.


    # 5.3 WORKING OF A CONVOLUTIONAL NEURAL NETWORK


    When we train a convolutional neural network the data is transmitted in each epoch

    twice through the model once transmitted forward and once backward. The transmis-

    sion of data through the whole model is called propagation.


    # 5.3.1 Forward Propagation


    During forward propagation the image is transported from multiple layers of where

    the filters are made with random values, the same with biases and weights of fully

    connected layer. On the basis of the output after the forward propagation of the
    image

    the output value is used to update all the weights, biases and filter values (Figure
    5.5).


    # 5.3.2 Backward Propagation


    Backward propagation is the opposite travel direction where on the basis of output
    an

    error is generated and hence used to update the weights and biases of the fully
    con-

    nected layer and the filter values. Gradient descent algorithm is used to update
    all the

    weights,biases and filter values.


    Let''s consider an example in Figure 5.6:


    ![](img/c5c79333a43e0e9a69d1119635e3c244_77_1.png)


    FIGURE 5.5 Propagation of image through various layers.'
