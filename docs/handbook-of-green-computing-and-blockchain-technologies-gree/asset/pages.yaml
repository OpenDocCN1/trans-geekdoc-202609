  md: 'history and to provide a flexible access to it for patients and physicians
    as well. Blockchain as a combine would simplify the data access more efficient,
    and also bring data security to the field as well [4].


    As the data grows day by day, the medical records are very complex and it is very
    hard to process this complex data using traditional tools. We can here also use
    big data analytics to process raw data into meaningful information so that we
    can use it [5].


    Big data means a lot of data. This huge amount of medical data is used for data
    analysis and research purposes. Big organizations use this big data to predict
    the future event occurrence such as the number of patients having the same kind
    of diseases in a particular time period in last year. We can use big data for
    analysis and then forming some required information related to it [6].


    # b) Supply chains:


    In recent times, the pharmaceutical industry came up with the biggest standards
    for product cover, security, and firmness of product. As an example, if the supply
    chain management system is working in combination with blockchain it can be monitored,
    protected and transparently. It can largely decrease time delays and human mistakes
    and errors. It should also be used to monitor costs, labor, and even unwanted
    material that is released at every stages in the supply chain. It should also
    be used to give confirmation about the verification of products by following them
    from the starting point, that makes the drug and medicine market more efficient
    and prevent them from losses annually. Many companies such as Chronicled, Blockpharma
    and Modum are so far working toward the aim of more structured blockchain logistic
    solutions. Companies such as Modum specially works in the domain of consent with
    EU laws which require evidence that medicinal and drug related products should
    not been reveal to special conditions, especially at certain temperatures (high
    temperatures), that will cover up the quality of their products. The solution
    of Modum was to build a sensor which records and track the environmental conditions.
    But in the mean while physical products are in transportation and permanently
    record and save this data on the blockchain [7].


    # th) Genomic market:


    Many companies like EnrypGen and Nebula Genomics are already working on it to
    build blockchain platforms to authorize people to share their genomic data safety
