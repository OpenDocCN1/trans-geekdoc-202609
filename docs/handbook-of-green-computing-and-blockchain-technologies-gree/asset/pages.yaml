    # FIGURE 12.6 Third block hash changes.


    ![](img/c5c79333a43e0e9a69d1119635e3c244_192_1.png)


    # FIGURE 12.7 Similarly with fourth block.


    We all know that a linked list is a set of blocks which are connected to each
    other by some kind of a link. In case of a data structure linked list, you have
    the nodes, and nodes are connected by pointers and pointers are basically memory
    addresses. But, in case of a blockchain technology, the blockchain is a distributed
    data structure, that is replicated at various nodes or various computers and therefore,
    the linking is not based on memory addresses. So we have a different notion of
    linking between nodes and each of these nodes are called blocks. So therefore,
    we can imagine a blockchain as a series of blocks and each block is connected
    to its previous block and later block by some kind of a link.


    And so it is replicated all over because replication gives you a number of different
    advantages like if one of the replica gets corrupted, the other replicas are there
    to make sure that the integrity of the information contained in the in the data
    structure is maintained. And also replication gives you some kind of guarantee
    of integrity of data. Therefore, blockchain is a data structure that is maintained
    distributedly and that is replicated and main aim of blockchain is to maintain
    the full integrity of the data.


    And what is the integrity? Integrity means that the data once it has been agreed
    by all the relevant parties to put in the data structure, it has not been tampered
    with.


    Nobody has come and changed the data and claimed that this is the data that was
    put in. The blockchain is designed in such a way, so that it is an immutable ledger
    of events, which means it is a log that cannot be changed by a malicious party
    or by mistake. And therefore, all the data that you put in there could be event
    logs, it could be transactions, it could be various kinds of accesses and modifications
    you do to some other thing like a data or you do a property transaction.


    When you make a banking transaction, the bank keeps logs of when you interacted
    with its banking servers and what you did, what transactions you made; all this
    is logged. The main problem with keeping logs without any notion of protection
    of the integrity is that somebody can tamper with the logs and somebody can delete
    some of the accesses. And therefore, later on when you check the log, you would
    know some part of its history. All these things logs are has to be kept in an
    immutable ledger. And that is what blockchain provides.'
