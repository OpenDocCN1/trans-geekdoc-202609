    # 8.1 INTRODUCTION TO BLOCKCHAIN TECHNOLOGY


    Blockchains come in numerous structures and for the most part share four principal
    highlights: decentralized information stockpiling (a public record of exchange
    records), encryption, permanence, and an agreement calculation. As a specific
    kind of decentralized record innovation, blockchains store encoded information
    across shared networks, connecting together successive “blocks” of data into “chains.”
    The data accessible to all organization members is a common record of all data
    exchanges on the blockchain. The agreement calculations guarantee that data is
    predictable and unchanging across this decentralized organization and dissuade
    individual clients from adding to record this data without approval from the organization.
    Moreover, because of blockchain’s design, earlier data on the chain can’t be altered
    or eliminated, as doing so would compromise the respectability of the decentralized
    record [1].'
