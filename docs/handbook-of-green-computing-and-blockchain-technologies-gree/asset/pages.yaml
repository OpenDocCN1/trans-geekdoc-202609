    in the database [1, 2]. If the patient intakes the medicine the smart band confirms
    the intake of medicine and sends confirmation to the assistant doctor. The assistant
    doctor is then notified, and the details of intake are stored in the database
    [17]. If the patient has not taken the medicine the smart band sends a notification
    to the patient after every 2 minutes. The assistant doctor provides regular reports
    of the patients to the'
