    # 9.8 GOVERNANCE THROUGH BLOCKCHAIN – MAJOR ISSUES AND CHALLENGES


    Blockchain technology is widely accepted in every field of work and governments
    are preparing to take advantage of it [9]. A technology may possess another side
    to the coin; also the blockchain may have some uncontested issues and challenges.
    These issues though nascent may hinder the prevailing benefits of blockchain for
    government activities. Some of such issues and challenges are described briefly
    as follows:


    # 9.8.1 INITIAL IMPLEMENTATION COST


    Initial cost for implementation of blockchain for a particular system requires
    proper set up for the technology. There may be initial high cost of development
    of the technology as well as the maintenance cost which have to be borne by the
    user departments.


    # 9.8.2 NASCENT STATE OF TECHNOLOGY


    As blockchain is an emerging technology, there is a lack of awareness about the
    technology. Even the implementing departments may face human resource constraints
    while working on this technology. At present the numbers of blockchain developers
    are meager in the world. The requisite experts of blockchain technology are in
    short supply, at least in India.


    # 9.8.3 RISK TO PRIVACY AND DATA BREACH


    Though blockchain data is secured through the hash function and public key cryptography,
    there still remain chances of cyber-attack on the public keys.


    There are many other issues and challenges in adopting blockchain technology,
    such as social repercussions of decentralization of the processes, immaturity
    or poor decision making during blockchain-based governance [10]. However, a closer
    look highlights the obvious drawbacks of any technological usages, even of blockchain
    technology. Also, these problems are not specific to the implementation of blockchain
    for the government. Further, the blockchain technologists are striving to find
    solutions to associated problems.


    # 9.9 BLOCKCHAIN USE CASE STUDY IN INDIA


    In India, the apex policymaker body of central government is called NITI Aayog
    [11] which has analyzed the impact of implementing blockchain on various government'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'processes and developed a case study. It has highlighted the presence of many
    obstacles in the implementation of such systems. Some of the issues are discussed
    below.


    # 9.9.1 LAND RECORDS


    The conventional method of acquiring and maintaining land records and transfer
    of land ownership is not found to be efficient because many of the departments
    may be involved in the said process. This involves issues such as land data not
    being properly recorded in files, poor coordination among various departments
    resulting in delay in implementation, natural calamities cause losing of documents,
    or disputes of ownership on land records. To keep track of land records is a difficult
    task, making it an inefficient process. Blockchain has been found to be a new
    way to keep the records on distributed ledgers and transfer of ownership will
    be easy with this technology. Distributed ledger is immutable and readily auditable,
    hence, may be efficiently used to record land registries.


    The NITI Aayog has found many complexities in adopting this technology for land
    registry which is a complex process. Major concerns needing to be resolved before
    transferring the records on distributed ledger are discussed below:


    # 9.9.1.1 High Cost of Litigation


    A very large number of disputes have been registered in courts regarding land
    issues, such as ownership conflicts, title of the properties, cost of the properties.
    There are many judicial and administrative forums where such unresolved cases
    are pending. Those needing resolution before getting transferred to blockchain
    may take more than 10 years to resolve.


    # 9.9.1.2 Establishing Land Ownership


    There are many ways to get land ownership; it may be gifted, transferred based
    on inheritance, purchased, etc. To verify the details of ownership several documents
    (property tax slips, electricity bills, etc.) are required to be verified. Moreover,
    all the judicial cases of land ownership need to be completed before transferring
    to the new system.


    # 9.9.1.3 Asynchronicity of Information


    Various agencies are involved in land registries such as Estate and sub registrar
    offices; hence, many cumbersome pre-processes need to be completed to make a synchronous
    system.


    The NITI Aayog has completed a survey on the use of blockchain-based governance
    in the Union Territory of Chandigarh, and highlighted the need for the ‘digitization’
    of processes to enhance the usage of existing IT systems. Blockchain features
    are analyzed, being critical to execute ‘smart contracts’ and to simplify the
    involved government processes.


    In general, blockchain-enabled systems are able to create immutable records of
    land ownership. These records are digitally stored for the future with the ability
    to audit from anywhere and at any time. This technology is highly recommended
    and is being adopted in governance in many countries.'
