    it’s a “network of business entities” which participate in the delivery of products
    and/or services to the end user.


    A conventional supply chain management for the manufacturing sector is shown in
    Figure 7.1. Each block represents a “business entity.” The process begins with
    the procurement of raw material followed by manufacturing of the product using
    the raw material and then followed by the delivery (distribution), warehousing
    (bulk storage of the products), retailer and, finally. the end user.


    The following is a brief overview of each of the major elements of the supply
    chain.


    Raw Material: These are the basic building blocks a product and indirectly the
    supply chain. Raw materials refer to the basic components, unprocessed materials
    which are required for manufacturing of a product. Raw materials are not just
    the building blocks, they are also the starting points for any manufacturing process.
    They also are an investment for the organization which is creating the product.
    As buying raw materials for manufacturing depends on the purchasing power of an
    organization, which is a measure of the financial strength of an enterprise. Therefore,
    it is of the utmost importance that companies employ adequate and effective measures
    for managing their inventory of raw materials.


