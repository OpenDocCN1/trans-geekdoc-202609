    We can derive formula for output image size if padding is zero and output image
    size for a n x n image is


    size = n - s + 1


    in which n x n is shape of input image and k x k is shape of convolution matrix.


    # 5.2.1.2 Pooling Layer


    The pooling layer works on the same mechanism as the convolution layer but with
    some small changes like instead of multiplying with terms of the filter the average
    or max value of the part of the image is stored in the output matrix. Max pooling
    layer helps to remove the extra information and extract those features from image
    and removing the extra part left. Multiple times convolution layer is applied
    with pooling layer after it to extract the most information, features and patterns
    from the image (Figure 5.2).


    We can derive formula for output image size if padding is zero and output image
    size for a n x n image is


    size = n - s + 1


    in which n x n is shape of input image and k x k is shape of max pooling matrix.


    ![](img/c5c79333a43e0e9a69d1119635e3c244_75_1.png)


