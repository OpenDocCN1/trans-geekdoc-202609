    Hyperledger Fabric, a permissionless blockchain, uses distributed ledger technology
    (DLT). It contains smart contracts, which are codes with logic, also called chain-code,
    describes the system’s application logic. The other key elements of Fabric are
    membership service provider (MSP), ledgers, and peers (nodes) consisting of endorsers,
    committers and orderers [31].


    All organizations involved in the consortium have multiple peers, which contain
    ledgers involving transactions. Smart contract contains chain code and events.
    MSP contains digital certificates for all peers of the organization. It authenticates
    them of right privileges for access. The Fabric client interacts with blockchain.
    The ledger stores all the chain of blocks that keep all immutable historical records.
    The committing peers maintain the ledger and also commit the transactions [31].
    Endorsers are responsible for executing the chain code, giving output, and then
    agreeing whether the transaction is legitimate or not. It also holds smart contracts.
    Ordering nodes, on the other hand, order all transactions, approve the inclusion
    of transaction blocks into the ledgers, and communicate with both committing peers
    and endorsing peers.


    As seen in Figure 7.4, the consensus is achieved by following the transaction
    flow: endorse, order, validate. A client application invokes transactions. The
    endorsement policy specifies which endorsers have to sign it for policy to come
    in effect. Every user has its unique client application id from the MSP. It sends
    multiple endorsing peers, whichever are of relevance to them. All the endorsing
    peers, as determined by policy, will sign their output. Those then will execute
    the transaction but not commit it. Each node or peer will capture the read write
    sets (RW) and sign it. Now the transactions are encrypted. The RW sets are sent
    back to the application. Now the client application submits responses to orderers.
    In parallel, other applications are also submitting transactions to orderers.
    The orderers also have a provision of channels which'
