    The internet of things on the other hand also play a main role in a network of
    connected devices. The goal of IoT is to provide a reliable and protected exchange
    of things, but the security challenges will be solved by cryptographic techniques.
    These techniques include user authentication and knowledge privacy [2].


    # 12.2 THE NAKAMOTO CONSENSUS MECHANISM


    Consensus as an emergent phenomenon

    The main invention by the creator of bitcoin Satoshi Nakamoto, is a decentralized
    consensus mechanism. It gives us provision for the participants to agree on the
    contents of the database (Figure 12.8).


    If we want to change our data then there is a majority of voting in favor of changing
    the data. Only then can we change the data [3].


    There is no single point of failure in the blockchain as it is decentralized and
    replicated.


    # 12.3 PEER-TO-PEER NETWORKS


    The data in the blockchain is connected peer to peer. It means the data in one
    system has the same data in other system also. Each node in the system is connected
    with other nodes in the system. It means if we want to change the data in one
    computer'
