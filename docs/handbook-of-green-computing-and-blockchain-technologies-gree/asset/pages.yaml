  md: 'Let''s consider the example of a pink neuron with bias $b_2$. Let''s consider
    it is sending $z_2$ as input then:


    \(\frac{\partial E}{\partial b_2} = \frac{\partial E}{\partial \dot{z}_2} * \frac{\partial
    \dot{z}_2}{\partial b_2}\)


    $z_2$ can be considered as $x_5$ sent as input which implies


    \(\frac{\partial \dot{z}_2}{\partial b_2} = a\)


    \(\frac{\partial E}{\partial x_5} = \frac{\partial \{y_p - y_a\}^2}{\partial x_5}\)


    \(\frac{\partial \{y_p - y_a\}^2}{\partial x_5} = 2 * \{y_p - y_a\} * \frac{\partial
    y_p}{\partial x_5}\)


    As we have already calculated $y_p$ then substituting it we can calculate following
    gradient.


    $y_p = a * \big(W_4 x_4 + W_5 x_5 + b_3 \big)$


    \(\frac{\partial y_p}{\partial W_4} = W_5\)


    using the above result


    \(\frac{\partial E}{\partial b_2} = a W_4\)


    Hence we can calculate gradients for all weights and biases of each and every
    neuron and update them in each epoch.


