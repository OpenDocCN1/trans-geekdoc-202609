    # 1.6 INTRODUCTION TO BLOCKCHAIN DEVELOPMENT


    Blockchain is a technology that permits the transaction to be collected in blocks
    and recorded and arranged in a cryptographical manner which allows the ledger
    to be accessed by different servers. Every valid transaction is stored in a shared
    public ledger and also immutable that means the data stored can’t be altered which
    provides high security to the data [14].


    The blockchain is a peer-to-peer distributed network, encryption algorithm, and
    unison mechanism which is generally known as POW (proof of work). Out of all these
    the unison mechanisms is the main crux of the essence of blockchain. This mechanism
    defines the trust among the nodes in the entire blockchain network [3, 4].


    Blockchain is one of the hot trending areas for Research and Development in technology.
    Many scholars are investigating new heights to be achieved with the help of blockchain
    and not only in research, but also is being used in industry in very large and
    significant numbers because of the security it provides [2].


    The main and obvious question is why blockchain and not the ordinary ledger? The
    difference between the blockchain and ordinary ledger is the “Decentralization”
    and it’s the POW which is accounted for the decentralization part of blockchain.


    # 1.6.1 HISTORY OF BLOCKCHAIN


    In 1982, the first blockchain idea was proposed by cryptographer David Chahum
    in his dissertation “Computer Systems Established, Maintained, and Trusted by
    Mutually Suspicious Groups” and then much research was focused on it, and in 1991
    Stuart Haber and W. Scott Stornetta implemented where the timestamp of a document
    can’t be altered [7].


    In 2008, Satoshi Nakamoto introduced the conceptualization of the first blockchain.
    The design of the blockchain using a method to timestamp blocks without getting
    them signed by any trusted party, this design by Satoshi Nakamoto was introduced
    as a core component of bitcoin. The design was launched the following year by
    Nakamoto as a major component of cryptocurrency bitcoin, where it serves as the
    public logger of all transactions on the network [8, 15].


    In August 2014, the file size of the bitcoin blockchain, which contained records
    of everything done on the network, reached 20 GB (Gigabytes). By January 2015,
    the size had grown to almost 30 GB, and from January 2016 to January 2017, the
    bitcoin blockchain grew from 50 GB to 100 GB in size. The size of the ledger had
    exceeded 200 GiB by early 2020.'
