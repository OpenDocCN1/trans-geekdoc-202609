    # 9.1 INTRODUCTION


    Digitization and making a ledger of government data through blockchain is a transformative
    force in various government operations [1]. Blockchain has the potential to assist
    various government activities and adoption as the technology is continuously evolving.
    Blockchain-based government [2] documents help to preserve data, make operations
    fair, and reject double dealing, while increasing its certitude and accountability.
    Blockchain-based distributed ledgers for government data represent an efficient
    way to share resources securely using cryptography. A blockchain-based model constitutionally
    protects the data of a country’s citizens held with the government.


    Governments get the following advantages through blockchain-based ledger of government
    data:


    +   - Unshakable retention of government and wary citizen information

    +   - Government efficiently working without intermediary

    +   - Better law enforcement

    +   - Building of trust between government and citizens

    +   - Lowering extravagant expenditure associated with maintaining accountability

    +   - Decreasing corruption

    +   - Increasing transparency in government operations

    +   - Building trust in online civil systems


