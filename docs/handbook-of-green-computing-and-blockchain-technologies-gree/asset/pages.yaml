    # 2.6 IDENTIFYING THE PROBLEM AND ITS SOLUTION


    In the 99DOTS project, the patients were given medicines in special medicine leaves
    which had a phone number written on the medicine leaf that had a missing digit.
    This missing digit revealed only if the pill was dispensed from the leaf. Furthermore,
    the person had to call on the phone number each time the medicine leaf revealed
    a digit for the assurance of the pill being taken by the patient [7]. But it does
    not give any assurance whether the pill was taken by the patient or not. What
    if the patient dispenses the pill and calls on the phone number revealed and throws
    off the pill? This was the problem which was faced by the doctors and the patients
    as well because it led to incorrect reports of the patients.


    This problem can be solved by a neck band which can sense the shape and the weight
    of the pill. If it is swallowed by the patient, it can notify it to the nearest
    health center to make sure that the patient has taken the pill [9].


    The neck bands can be given to the patients along with the medicines and they
    could be asked to wear it around their neck while taking the medicine [19].


    These neck bands will be solar powered and will contain a micro X-ray emitter
    and a digital chromographic film on the other side, so as to identify the shape
    and size of the medicine taken. The image captured by the film would be compared
    with the shape and size of the original medicine as already stored in the memory
    of the IoT device. Global Positioning System (GPS) technology connected to the
    internet can be used to send the confirmation to the doctor confirming the intake
    of medicine by the patient.


