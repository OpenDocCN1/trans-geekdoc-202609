    # ### 2.1 GREEN COMPUTING


    Green computing refers to the environmentally friendly use of computers and their
    energy. It is also known as the research and practice of designing, manufacturing,
    and using computers and server subsystems to eliminate them. The best example
    of green computing is a renewable energy source. Renewable energy sources are
    those that are derived from long-term reserves that can be replenished on a human
    timescale, such as sunlight, wind, rain, waves, and geothermal heat. They are
    readily available, of high environmental quality, and produce significantly less
    emissions. Solar power system, wind turbine programs, and geothermal power are
    different types of green computing.


    The Energy Star voluntary labeling program was one of the first green computing
    programs in the USA. The Environmental Protection Agency (EPA) created it in 1992
    to encourage energy efficiency in all types of hardware. The Energy Star label
    began to appear more frequently, especially on notebook computers and displays.
    In Europe and Asia, similar projects have been implemented [1, 2].


    Every human being nowadays requires a machine. A machine has simplified our lives
    and saved us time and effort. The use of a machine, on the other hand, increases
    strength intake and generates additional heat. Greater use of energy and heat
    technologies results in higher emissions of greenhouse gases such as carbon dioxide
    (CO2), which has a variety of negative effects on our climate and herbal resources.
    This is because we are unaware of the negative effects of computer use on the
    environment [3].'
