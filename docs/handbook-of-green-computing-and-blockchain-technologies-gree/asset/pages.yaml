  md: '# 9.7 BLOCKCHAIN APPLICATION IN GOVERNMENT PROCESSES


    Blockchain may be used in various aspects of a political process which helps it
    acquire a more transparent outlook in the eyes of the citizens. It will also improve
    the efficient workflow of political decisions. A fair politically based government
    may have an impact on culture, a country’s economy, ethics, social values, happiness
    index, growth index, and many other aspects. Blockchain creates a platform for
    policy and decision makers to showcase directly their ideology to citizens and
    it can foster a strong bond among them, thus maintaining greater confidence of
    citizens for other stakeholders including politicians (democracies). There follow
    various activities where government may make use of blockchain technology:


    # 9.7.1 Blockchain in the Election Process


    Blockchain technology provides a platform where citizens may get the opportunity
    to vote on the distributed ledger. This technology removes the changes of forgery
    during the voting process and subsequent steps, thus resulting in a transparent
    selection of their leaders. Moreover, voters’ identity will be better protected
    using this technology by hiding their actual identity. A blockchain-oriented election
    process can be an efficient and effective process which may enhance the future
    perspective of good governance.


    # 9.7.2 Transparent Public Procurement


    Corruption is one of the main problems of public procurement [6]. The selection
    of vendors is one of the steps of public procurement which is not transparent
    to an acceptable level. This process highlights many issues such as financial
    waste, decreased healthy competition, etc. Moreover, it leaves an impression of
    being complex and opaque, thus generating disagreements among various groups.
    With the support of blockchain, governance has a chance to set up a system which
    resolves the associated risk factors by establishing some tamper-proof transactions
    and maintaining records through smart contracts [7]. Accountability and transparency
    will not be hindered with suggested smart contracts.


    # 9.7.3 Corporate Ownership Registry


    In many countries, the government has started using blockchain technology to create
    and use central registries which eliminate forgeries and manipulations. It is
    expected that possibilities of corruption in various stakeholders, including companies,
    will be eliminated after using this emerging technology. It will directly impact
    the vested interests such as money laundering, receiving and sending bribes, and
    using government resources for unethical usage.


    # 9.7.4 Grant Disbursements


