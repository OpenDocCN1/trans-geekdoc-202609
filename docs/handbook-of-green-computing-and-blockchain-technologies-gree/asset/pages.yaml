- pgno: 13
  md: '# Editors


    ![](img/c5c79333a43e0e9a69d1119635e3c244_13_0.png)


    **Kavita Saini, PhD**, is currently Professor at the School of Computing Science
    and Engineering, Galgotias University, Delhi NCR, India. She earned a PhD at Banarasthali
    Vidyapeeth, Banarasthali. She has 17 years of teaching and research experience
    supervising Master’s and PhD scholars in emerging technologies.


    She has published more than 35 research papers in national and international journals
    and conferences. She has published 14 authored books for UG and PG courses for
    a number of universities, including MD University, Rothak, and Punjab Technical
    University, Jallandhar, with national publishers.


    books with international publishers, including IGI Global, CRC Press, IET Publisher,
    and Elsevier, and has published ten book chapters with international publishers.


    She has also filed several patents. Kavita Saini has also delivered technical
    talks on Blockchain: An Emerging Technology, Web to Deep Web and other emerging
    areas, and has handled many special sessions in international conferences and
    special issues in international journals. Her research interests include web-based
    instructional systems, blockchain technology, industry 4.0, and cloud computing.


    ![](img/c5c79333a43e0e9a69d1119635e3c244_13_1.png)


    **Manju Khari, PhD**, is an Associate Professor at Jawaharlal Nehru University,
    New Delhi. Previously, she worked with Netaji Subhas University of Technology,
    East Campus, formerly Ambedkar Institute of Advanced Communication Technology
    and Research, Under Govt. of NCT Delhi. She earned a PhD in computer science and
    engineering at the National Institute of Technology Patna, and received a Master’s
    degree in information security at Ambedkar Institute of Advanced Communication
    Technology and Research, affiliated with Guru Gobind Singh Indraprastha University,
    Delhi,


    India. She has published 80 papers in refereed national/international journals
    and conferences (viz. IEEE, ACM, Springer, Inderscience, Elsevier), and 10 book
    chapters in books published by Springer, CRC Press, IGI Global, and Auerbach.
    She is also co-author of two books published by NCERT of XI and XII and co-editor
    of ten edited books. She has also organized five international conference sessions,
    three faculty development programs, one workshop, and one industrial meeting.
    She has delivered an expert talk, been a guest lecturer at an international conference,
    and a member of the reviewer/technical program committee at various international
    conferences. Besides this, she is associated with many international research
    organizations as associate editor/guest editor of Springer, Wiley, and Elsevier
    books, and a reviewer for various international journals.'
