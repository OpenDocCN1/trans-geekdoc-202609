  md: '# 12.5 APPLICATIONS


    Now we come to say that we can use blockchain in such a case where a constant
    amount of data is required, so that no one can change it.


    +   1. In real estate for storing information related to house owner.

    +   2. Online voting

    +   3. Digital Identity card for storing information such as birth certificate,
    unique voter ID card, passport, pan card, Aadhar card, driving license, medical
    records, insurance, etc.

    +   4. In banking and finance

    +   5. In medicine and healthcare

    +   6. In Internet of Things

    +   7. In travel and transportation

    +   8. In cryptocurrencies like bitcoin, etc.


    Now we will discuss blockchain in medicine and healthcare in detail. One of the
    best uses of blockchain is in healthcare.


    Developed and even developing countries invest a large amount of their gross domestic
    product (GDP) on the healthcare domain. In the meantime, hospital costs are too
    expensive, along with unfit ways and health data losses are poised to continue.


    This is one such area in which we can use blockchain. It can do for us many things
    such as storing guarded patient information to handling the epidemics.


    Main concerns related with blockchain applications in healthcare include:


    +   1. A large network infrastructure at different levels.

    +   2. There should be Identity verification and authorization of all participants.

    +   3. There should be constant patterns of verification process to access electronic
    health data or information.


    There should be a distributed data of patients that will be shared between different
    hospitals but there must be a power given to patients to share their data.


    # 12.6 HOW BLOCKCHAIN WILL CHANGE THE HEALTHCARE SYSTEM


    +   a) Health records:


    We know very well that electronic medical records (EMR) are the pillar or foundation
    of our modern healthcare system. Each time we visit the doctor, these medical
    records grow. And as every hospital and every doctor''s office has its own way
    of storing the patient information, it is always difficult for healthcare providers
    to obtain them. The basic purpose of many companies like Patientory, Medibloc,
    and Medicalchain is to solve this problem. The purpose of this is to give patients
    authentication over their entire medical'
  merge: -1
  img_proc: true
