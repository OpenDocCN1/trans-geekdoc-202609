  md: '# # 1.3 STRATEGIES FOR IMPLEMENTATION OF GREEN COMPUTING


    As the IT industry bags for pollution as equal to the air industry, so controlling
    it is very important and certain approaches are listed down below [10].


    # ## 1.3.1 VIRTUALIZATION


    Virtualization is the creation of a virtual version of something, such as a server,
    a desktop, a storage device, an operating system, etc. It’s a process that allows
    sharing a single example of a source or application between multiple clients or
    organizations [8]. It does so by providing a logical name for physical storage
    and by providing a reference to that source of material on demand. Figure 1.2
    shows the varieties of virtualization that we used [11, 12].


    The virtualization of the machine over existing software and hardware is known
    as Hardware Virtualization [3]. Virtual Machine provides a reasonable separate
    environment with substandard hardware.


    # ## 1.3.2 ALGORITHMIC EFFICIENCY


    Using an efficient algorithm will reduce the computer consumption in completing
    the computation function [4]. For example, substituting the fast search algorithm
    like hashed search algorithm with the slow search algorithm like linear will reduce
    the resource utilization and with a long run will reduce the wastage created by
    using the computer resources.


    ![](img/c5c79333a43e0e9a69d1119635e3c244_22_0.png)


    FIGURE 1.2 Different levels of virtualization.'
  merge: -1
  img_proc: true
