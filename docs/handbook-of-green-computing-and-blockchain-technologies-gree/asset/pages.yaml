    # 7.5 POSSIBLE CHALLENGES IN SUPPLY CHAINS USING BLOCKCHAIN


    The entire concept of blockchain is based on the idea of an immutable ledger which
    is distributed which has the potential to run businesses in a trustable and transparent
    way without the intervention of any central authority. Blockchain has shown great
    promise in adding great value to various industries, including the area under
    discussion which is the supply chain [36, 37]. As hyped as blockchain is, a more
    realistic perspective is required in order to assess various aspects related to
    it more objectively. Blockchain incurs high costs and high overheads in storage.
    It is primarily used for storing data related transactional data where trust is
    a lacking factor. Blockchain is a feasible option only when the costs realized
    could be outweighed by the benefits it has to offer.


    The very first challenge could be high computational overhead when dealing with
    blockchain. Even though blockchain applications used in supply chain management
    are much more efficient than in cryptocurrencies, still high computing capabilities
    are required, for instance, for reading from the blockchain. These operations
    pertaining to applications using blockchain could be slower than those with traditional
    databases.


    Since blockchain is decentralized, which is a significant advantage of it, managing
    it could be tiresome. Maintaining a decentralized application could prove to be
    far more difficult than managing centralized applications. Blockchain at the moment
    is not highly popular with enterprises as such.


    Blockchain keeps a record of every transaction that takes place in the distributed
    ledger, and this can start compounding when used by multiple parties. The very
    algorithms that are used for encryption, to generate trust are the very algorithms
    which add data overhead. Handling data complexity is yet another challenge faced
    by applications using blockchain. Organizations because of the huge amounts of
    data they work could potentially end up managing much larger data structures than
    before. The early blockchain operated on business logic level of the applications
    which had to push both data and metadata to the blockchain. Enterprises therefore
    need to tackle this caveat when dealing with blockchain applications. They can
    reduce the risk of encountering this issue by striking a balance between data
    stored in traditional databases versus the data stored in the decentralized ledger
    [38].


    One of the most distinctive features that sets blockchain apart from other data
    processing technologies is data immutability; however, data in supply chains is
    entered by people. Hence there is dependency on people to add quality data, because
    otherwise it could be very tedious to fix incorrect data entered into a blockchain
    application. The very essence of supply chains is the integration of different
    aspects'
