- pgno: 78
  md: '![](img/c5c79333a43e0e9a69d1119635e3c244_78_0.png)


    FIGURE 5.6 Backward propagation.


    Blue arrows show how data is transmitted from the output layer to the hidden layer
    with pink-colored neurons. Let''s find the loss function which is defined as square
    of difference in actual value and predicted value.


    \( E = \{z_p - z_a\}^2 \)


    \( z_p \) is the value predicted by the neural network and \( z_a \) is the actual
    value expected at the output, where \( z_a \) is a constant and \( z_p \) is calculated
    using the activation formula in last neuron.


    \( z_p = \text{Activation}(y_p) \)


    \( y_p = \sum w_i x_i + b \)


    Now let''s consider the weights in the next Figure 5.7:


    Let''s consider the output neuron (blue neuron): it is receiving 2 weights \(
    W_4 \) and \( W_3 \) and has bias value \( b_3 \) so while back propagating the
    values of them will be updated as:


    \( W_4 = \{W_4 - \eta * \text{gradient} \, (\text{loss})\} \, \text{gradient with
    respect to} \, W_4 \)


    \( W_3 = \{W_3 - \eta * \text{gradient} \, (\text{loss})\} \, \text{gradient with
    respect to} \, W_3 \)


    \( b_3 = \{b_3 - \eta * \text{gradient} \, (\text{loss})\} \, \text{gradient with
    respect to} \, b_3 \)'
