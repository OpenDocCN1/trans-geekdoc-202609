    +   5. **Accountability for multinationals**: In the global market, there are
    always some names in all kinds of sectors which are polarizing, controversial,
    or argument-inspiring. Some companies cheat farmers and not release payment on
    time. Sometimes not offer the suitable price of the crops. To overcome from these
    types of anomalies, blockchain can be used which provide complete transparency
    [25].


    +   6. **Agri-tech optimization**: According to a US agriculture department report,
    the implementation of certain ASM (agricultural management software) will generate
    as much as 65%–70% higher profits on the same land. Technologies like machine
    learning, artificial intelligence, IoT, cloud computing shows good result in agriculture
    sector. According to Gartner survey, blockchain technology with artificial intelligence
    will change agriculture completely. Blockchain will used for transparency and
    traceability while artificial intelligence will used to analysis everything.


    +   7. **Community-supported agriculture**: CSA (community-supported agriculture)
    is very popular in the USA, and India is also practicing CSA but in its own manner
    without technology. CSA bring together a number of persons from community, who
    helps the farmers financially in return for some sharing of crops or some percentage
    of income. Blockchain can improve the CSA operation and provide the transparency
    to all the members of CSA which help to distribute conflict free income as per
    pre-defined agreement.


    +   8. **Monitoring farm inventory**: In order to avoid losses after harvesting,
    growers need to be very active to monitor storage techniques of crop. They must
    ensure CO2 absorption under 600 to avoid infestation and mildew growth. Luckily,
    there are many types of sensors available in the market which play a very vital
    role to detect probable losses 4–5 weeks prior than old-style temperature monitoring
    methods. With the help of blockchain technology growers can easily monitor the
    inventory and offer continuous support to all the key players about what requires
    to be done.


    +   9. **Traceability of goods**: Demand for local agricultural produce and organic
    produce is increasing daily. With the help of blockchain implementation in agriculture,
    consumer can easily trace and verify the journey of product from the farm field
    to his door. Blockchain store all the data about who grow this product, who harvest,
    who produce and in the end who transport this product.


    +   10. **Logistics automation**: Blockchain has the potential to record and track
    every single transaction among the parties. Many organizations are now using blockchain
    in logistics sector to improve efficiency, for immutable tracking, to enhance
    security, and for automated smart contracts.'
