- pgno: 74
  md: 'Convolutional neural networks are part of deep learning which is a subset of
    machine learning where we try to replicate the back part of the human brain which
    is the cerebral cortex which has an important part, the visual cortex, which is
    used for human vision. Convolutional neural networks are one of the most used
    machine learning models for image classification, pattern detection, object detection
    and object recognition due to its structure of filters used to gain meaningful
    insights from the images. One of the most popular applications are self-driving
    vehicles which uses object detection algorithm to detect and recognize objects
    and take decisions on how to move the car.


    Blockchain is an expanding record list which are termed blocks and the linking
    of these blocks is done using cryptography which forms chain-like structures which
    give it its name blockchain. Each block which is added contains following information
    like hash code, a timestamp, and transaction data all these are stored in the
    block and hash code is a cryptographic code which is of the last block which is
    added to the chain. This type of structure cannot be altered as the block is added
    for each transaction and it is designed in a way to be effective against modification.
    The most common use of blockchain technology is cryptocurrency like bitcoin.


    Blockchain enables data systems which can be either used in healthcare or student
    education sector; all can be implemented using blockchain technology which makes
    it easier to add user data and is more secure. Then a neural network can be trained
    on that type of data to make more easier method to analyze the data fit model
    on it rather than generic way to collect data [1].


    **Objective:** This chapter will give a brief overview of convolutional neural
    networks to the reader with full understanding about the terms related to the
    convolutional neural network, architecture of the convolutional neural network
    and mechanism of propagation of image through various filters and how patterns
    are recognized from the image. There will be a brief overview of blockchain technology
    and real-life application of blockchain technology and convolutional neural networks.


    # 5.2 ARCHITECTURE OF A CONVOLUTIONAL NEURAL NETWORK


    A convolutional neural network has convolution layers followed by pooling layers
    and at end fed into a fully connected neural network.


    # 5.2.1 LAYERS


    Convolutional neural networks have basically three types of layers:


    # 5.2.1.1 Convolution Layer


    Convolution layer has a defined map which moves sequentially over the image and
    multiply its terms with terms on which it is placed and then product is stored
    in the new output matrix. The movement of the filter is also defined by value
    of stride which tells how much blocks the filter move right and down while applying
    filter over an image. For example, if a filter is placed on top left corner of
    the image then the filter will move right by one block until it covers the whole
    breadth of the image then starts'
