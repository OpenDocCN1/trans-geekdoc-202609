    # ## 5.2.1.3 Fully Connected Layer


    The application of multiple layers of convolution followed by pooling gives a
    final image with most features extracted. Then that image is converted to a flattened
    vector or matrix with one column and given as input to a fully connected neural
    network structure or artificial neural network and then forward and backward propagation
    is used to train and here the classification of images happens on the basis of
    its features (Figure 5.3).


    # ## 5.2.2 Padding


    Padding is added to an image before applying any operation on the image as applying
    any operation will eventually reduce the size of the image and to maintain a same
    size of image extra layer of padding is added which make a whole boundary around
    the image and added boundary values can be either 0 showing the boundary is white
    or same to pixel on border of the image. Values of boundary depends on the image
    dataset given as input and padding value n refers to increase in number of rows
    by 2 x n and columns by 2 x n and the extra values are either white or same as
    that of the boundary (Figure 5.4).


    We can derive equation for output image size which has padding greater than 0
    for max pooling layer and convolution layer of size k


    ```

    size = (n - k + 2p) s + 1

    ```


    where n x n is shape of input image, k x k is shape of convolution matrix, p is
    size of padding and s is stride value.'
