- pgno: 2
  md: '# Green Engineering and Technology: Concepts and Applications


    Series Editors: Brujo Kishore Mishra, GIET University, India, and Raghvendra Kumar,
    LNCT College, India


    Environment is an important issue these days for the whole world. Different strategies
    and technologies are used to save the environment. Technology is the application
    of knowledge to practical requirements. Green technologies encompass various aspects
    of technology which help us reduce the human impact on the environment and create
    ways of sustainable development. This book series will illuminate green technology
    in different ways, aspects, and methods. This technology helps people to understand
    the use of different resources to fulfill needs and demands. Some points will
    be discussed as the combination of involuntary approaches and government incentives,
    and a comprehensive regulatory framework will encourage the diffusion of green
    technology. Least developed countries, and developing states of small islands
    require unique support and measures to promote green technologies.


    # Handbook of Sustainable Development through Green Engineering and Technology


    Edited by Vikram Bali, Rajni Mohana, Ahmed Elngar, Sunil Kumar Chawla, and Gurpreet
    Singh


    # Integrating Deep Learning Algorithms to Overcome Challenges in Big Data Analytics


    Edited by R. Sujatha, S.L. Aarthy, and R. Vettriselvan


    # Big Data Analysis for Green Computing


    Concepts and Applications


    Edited by Rohit Sharma, Dilip Kumar Sharma, Dhowmya Bhatt, and Binh Thai Pham


    # Green Computing in Network Security


    Energy Efficient Solutions for Business and Home


    Edited by Deepak Kumar Sharma, Koyel Datta Gupta, and Rinky Dwivedi


    # Handbook of Green Computing and Blockchain Technologies


    Edited by Kavita Saini and Manju Khari


    For more information about this series, please visit: https://www.routledge.com/Green-Engineering-and-Technology-Concepts-and-Applications/book-series/CRCGETCA'
