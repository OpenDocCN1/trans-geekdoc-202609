    chances around the personal genome sequencing will create a big data market in
    very high cost. The best technology to solve these problems and to ensure that
    data gets from the origin to its end-users is no one the blockchain. These companies
    are highly focused and their aim is to use blockchain technology to manage genomic
    data'
