    # 3.2.4.4 Rectified Linear Unit


    This is a non-linear function where if our value of y is greater than 0 then y
    is returned else 0 is returned and this property is advantage of rectified linear
    unit that it only send positive values or 0.


    ```

    z = maximum (0,y)

    z'' = maximum (0.1)

    ```


    Gradient in this case is always constant which means the means the weights and
    biases will get update by a constant factor always and error will remain same.


    # 3.2.4.5 Exponential Function


    The exponential function is a non-linear function where if y is greater than equal
    to zero it remains same else it is transformed using exponential function.


    ```

    z = y       if       y > 0

    z = a * { e^y - 1}   if       y <= 0

    ```


    For positive values it is a linear curve and for negative values it is a exponeential
    curve. This function allows negative values as output which makes the model learn
    faster and better.


    ```

    z'' = 1       if       y > 0

    z'' = a * { e^y }   if       y <= 0

    ```


    Gradient is constant for values of y greater than 0 and exponential for values
    less than 0 which signifies that in case of negative values of y the model weights
    and biases will be updated.


