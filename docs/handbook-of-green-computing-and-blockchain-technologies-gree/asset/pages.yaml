    # 12.7 SOME SPECIFIC APPLICATIONS


    +   a) **Research:**

    +   Nowadays, the automatic modifying and sharing the medical information of a
    given patient within an organization is allowed by the electronic health records.
    This set of data will allow the researchers and other organizations to get this
    large amount of data. As a result, this greatly influences clinical research,
    identification of health reporting, creation of public health reporting and safety
    events and its unfavorable effect reporting.


    +   b) **Seamless movement of patients’ data among different providers:**

    +   Data stored in the blockchain allow each and every individual patients to
    easily verify and share their health data with other providers or any organizations
    with the help of shareable private key. It should create health information technology(HIT)
    more efficient and sharable among different users [10].


    +   c) **Quick, economical and better patient care:**

    +   It has a one system for storage, constantly modifying health data for faster
    and safely access by verified users. Miscommunication among different healthcare
    professionals or doctors caring for the same patient must be prevented. These
    errors can be avoided and as a result faster diagnosis and proper care become
    possible for each patient.'
