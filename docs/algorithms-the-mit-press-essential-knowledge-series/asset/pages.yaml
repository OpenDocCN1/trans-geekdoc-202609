  md: '# PREFACE


    I know two young teenagers who possess more knowledge than any scientist, philosopher,
    or scholar of ages past. They are my sons. No, I am not a doting father who marvels
    at how extraordinarily gifted his children are. But these two kids have in their
    pockets devices that connect them with the vastest repository of information that
    has ever been created. There is no factual question they cannot answer, now that
    they have mastered the art of knowing where to look on the internet. They can
    translate from and to foreign languages without having to browse through hefty
    dictionaries—which we keep in the house so they know how things were, only a few
    years back. News, from anywhere, reach them in an instant. They can communicate
    with their peers before you know it, no matter where in the world they may live.
    They can plan their goings out in perfect detail. Alas, they can waste their time
    with abandon playing games or following trends that change so fast that I do not
    know why they matter.


    All the above have become possible thanks to the huge advances in digital technology.
    Today we carry more computing power in our pockets than used to ferry humans to
    the moon. As these two teenagers show, the changes in our lives have been immense;
    predictions for'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'the future vary from utopias, where people will really not need to work, to
    dystopias, where the privileged few will lead fulfilling lives, with the rest
    being condemned to inconsequential torpor. Frankly, we are able to shape this
    future, and an important factor in our ability to do this is how conversant we
    are with the technologies that underlie the achievements and the changes before
    us. Although we may lose sight of it in the bustle of the everyday lives, we live
    in the best period of human history. We are healthier than we have ever been,
    and expect to live longer, on average, any generation that has ever lived. Despite
    the iniquity of glaring inequality, huge swathes of humanity have gotten rid of
    the shackles of poverty. We have never been closer to one another, both virtually
    and literally. We may decry the commercialism of mass global tourism, but cheap
    travel allows us to experience different cultures and visit places that we could
    once marvel about only in coffee table books. All this progress can and should
    continue.


    To partake in this progress, however, it is not enough to use digital technology.
    We must be able to understand it. First, for the eminent practically reason that
    it offers excellent career opportunities. Second, because even if we don''t care
    for a career in technology, we must know its underlying principles to appreciate
    its potential and shape our own role in it. Digital technology is enabled as much
    by its its hardware, the physical components that make'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'up computers and digital devices, as by its software, the programs that run
    on it. The backbone of programs are the algorithms that they implement: the set
    of instructions that describe the way to solve particular problems (if this does
    not look like a definition of an algorithm is, don''t worry, we have the rest
    of the book to fill out the details). Without algorithms, computers would be useless,
    and none of modern technology would exist.


    What we need to know changes through time. For most of human history, schooling
    was not deemed at all. Most people were illiterate, and if they were taught something,
    it would be mastery of some practical skill or scripture. In the beginning of
    the nineteenth century, more than 80 percent of the world’s population was completely
    unschooled; now the vast majority has attained several years of school, and it
    is projected that by the end of the century, the proportion of unschooled people
    in the world will fall to zero. The years we spend on education have also increased.
    While in 1940 less than 5 percent of Americans had a bachelor’s degree, by 2015
    almost a third of them did.¹¹


    Back in the nineteenth century, no school would teach molecular biology because
    nobody knew anything about it; DNA wasn’t discovered until well into the twentieth
    century. It now forms part of what we accept as the canon of an educated person’s
    learning. Similarly, even though algorithms were discovered in antiquity, few
    people'
  merge: -1
  img_proc: true
- pgno: 15
  md: Digital technology is enabled as much by its hardware, the physical components
    that make up computers and digital devices, as by its software, the programs that
    run on it. The backbone of programs are the algorithms that they implement.
  merge: -1
