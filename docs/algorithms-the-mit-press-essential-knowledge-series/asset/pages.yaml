  md: '# The Basic Principles


    When we are on a web page, the links on that page point to other pages that are
    relevant to the page we are currently browsing. The very existence of the link
    indicates that the web page at the end of the link is important—otherwise the
    author of the web page would not link to it in the first place. Consider the example
    graph below, representing a small set of web pages that link to each other:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_176_0.png)


    In such a graph, we call the links that point to a web page *backlinks*; by extension,
    we will also call the pages that point to a web page *backlinks*. In this way,
    the backlinks of web page 3 are the edges pointing to it, its incoming edges,
    as well as the nodes from which they emanate: web pages 2, 4, and 5. As in this
    chapter we will be concerned with'
  merge: -1
  img_proc: true
- pgno: 177
  md: "graphs that are made up of web pages, we will be using the terms “node” and\
    \ “page” interchangeably.\n\nWe will build an algorithm for finding the importance\
    \ of each web page based on two basic principles:\n\n+   1. The importance of\
    \ a web page depends on the significance of the web pages that link to it—that\
    \ is, on the importance of its backlinks.\n\n+   2. A web page divides its importance\
    \ evenly over the web pages to which it links.\n\nSay we want to find the importance\
    \ of page 3. We saw its backlinks are 2, 4, and 5. We take one of them in turn\
    \ and assume we know their own significance. Page 2 divides its importance over\
    \ pages 3 and 5, and therefore will give half its importance to page 3. Page 4\
    \ also divides its importance over two pages, 3 and 1, and hence will give half\
    \ its significance to page 3. Finally, page 5 divides its importance over pages\
    \ 2, 3, and 4, and will give a third of its importance to page 3. To save typing,\
    \ let us denote by $r(P)$ the importance of page $i$; $r$ will stand for rank.\
    \ Then the importance of page 3 will be:\n\n```\n$r(P_3) = \frac{r(P_2)}{2} +\
    \ \frac{r(P_4)}{2} + \frac{r(P_5)}{3}$\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: 'In general, if we want to find out the importance of a certain web page and
    we know the importance of each backlink, it is easy to find what we are looking
    for: divide the importance of each backlink page by the number of web pages it
    links to and add the result to the contributions of the other backlinks of the
    page.


    You may think of the calculation of importance as a voting contest between web
    pages. Each voting page has some significance, which it can use as a vote for
    those web pages that it deems important. If it considers only one web page as
    important, it just gives its vote to that web page. But if it considers more than
    one web page as significant, then it splits its vote and gives a part of the vote
    to each of these web pages. Therefore, if a web page wants to vote three web pages
    being important, it will give to each one of them one-third of its vote. To which
    pages will a web page apportion its vote? To those at the end of its hyperlinks—that
    is, to those which it links. And how is the importance of a web page derived?
    From the importance of its backlinks.


    The two principles do endow aura of democracy to the ranking of web pages. There
    is no single authority that decides what is most significant. A page is important
    if other web pages think it is important, and they vote with their links. In contrast
    with the one person, one vote principle that holds in most real-world elections,
    however, not all web pages have equal votes here.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'page depend on how important it is—which, again, is determined by the other
    web pages.


    This may seem like casuistry because effect it tells us to find the importance
    of a web page, we must find the importance of its backlinks. If we follow the
    same reasoning, to find the importance of each of its backlinks, we must find
    the importance of that backlink’s backlinks. Then the process seems to regress
    more and more, from backlinks to backlinks, and in the end, we are left without
    knowing how to calculate the significance of the web page from where we started.
    Worse, we may find out that we run in circles. In our example, to calculate the
    importance of page 3, we need the importance of each of pages 2, 4, and 5. To
    calculate the importance of page 2, we need the importance of page 1 (and page
    5, but let us leave that aside for a bit). To calculate the importance of page
    1, we need the importance of page 4, and to find that, from we need to know the
    importance of page 3. We are back where we started.


    # An Example


    To see how we get out of the problem, let us assume that before we begin calculating
    the importance of the web pages, we give them all equal significance. In terms
    of our voting metaphor, we give each web page exactly'
  merge: -1
  img_proc: true
