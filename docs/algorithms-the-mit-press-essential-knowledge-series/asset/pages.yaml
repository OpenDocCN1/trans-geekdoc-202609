  md: 'up cozy and warm.⁹ In the planning of tournaments, we found that the grasshopper
    may not end up so badly. Now it is time for the ant''s revenge.


    In chapter 1, we discussed the infeasibility of trying to find the shortest path
    between two points on a grid by enumerating all possible paths. We saw that this
    is impossible to do in practice because the number of paths increases tremendously.
    Now with our knowledge of graphs, we will see that there is a way. In fact, we''ll
    take the problem a notch. Instead of looking for the shortest path on a grid,
    which has a kind of nice geometry and on which all distances between points are
    equal, we will allow any geometric shape and even add different distances between
    points.


    To do that, we''ll create a graph where we have nodes and edges representing a
    map, and want to find the shortest way between two nodes on the map. Moreover,
    we''ll attach a weight to each edge. The weight may be positive or zero, and will
    correspond to a measure of the distance between the connected nodes. It may be
    in miles or travel time in hours; any other nonnegative metric will do. Then the
    path length is the sum of the weights along the path; the shortest path between
    two nodes is the path with the smallest length. If all weights are equal to one,
    then the path length is equal to the number of edges on the path. Once we allow
    weights to have other values, this is no longer true.'
