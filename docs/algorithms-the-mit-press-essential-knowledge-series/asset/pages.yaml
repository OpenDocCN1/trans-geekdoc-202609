  md: '# SEARCHING


    The fact that algorithms can do all sorts of stuff, from translating text to driving
    cars, can give us a misleading picture of what algorithms are mostly used for.
    The answer may seem mundane. It is unlikely that you will be able to find any
    computer program doing anything at all useful without employing algorithms for
    searching in data.


    That is because searching in one form or another appears in almost every context.
    Programs take in data; often they will need to search for something in them and
    a searching algorithm will almost certainly be used. Not only is searching a frequent
    operation in programs, but because it happens frequently, searching can be the
    most time-consuming operation in an application. A good algorithm can result in
    dramatic improvements in speed.


    A search involves looking for a particular item among a group of items. This general
    problem description'
