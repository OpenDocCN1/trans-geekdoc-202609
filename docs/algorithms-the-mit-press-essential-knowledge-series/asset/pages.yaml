    \ is equivalent to dividing each page's vote by the number of outgoing links to\
    \ that page. If we do that, we get the following matrix:\n\n```\n[[0 1 0 0 0]\n\
    0 0 1/2 0 1/2]\n1/3 0 0 1/3 1/3]\n1/2 0 1/2 0 0]\n0 1/3 1/3 1/3 0]]\n```\n\nWe\
    \ call this matrix the hyperlink matrix.\nIf we look carefully at the hyperlink\
    \ matrix, each column shows the importance of a page is derived from the pages\
    \ that link to it. Take the first column, which relates to the importance of page\
    \ 1. This page takes its significance from pages 3 and 4. Page 3 gives 1/3 of\
    \ its importance to page 1 because it links to three pages, and page 4 gives 1/2\
    \ of its importance to page 1 because it links to two pages. Page 1 receives zero\
    \ significance from the other pages in the graph they do not link to. We can express\
    \ this as:\n\n$r(P_1)\\times0+r(P_2)\\times0+\frac{r(P_3)}{3+\frac{r(P_4)}{2}+r(P_5)\\\
    times0=\frac{r(P_3)}{3+\frac{r(P_4)}{2}}$"
