    We have still not found what we were looking for, but we are much better than
    before; we have much fewer items to go through now. And so we do. We check the
    middle document of the *remaining items* and repeat the procedure.


    In the figure on the following page, you can see how the process evolves for 16
    items, among which we are looking for item 135. We mark out the boundaries inside
