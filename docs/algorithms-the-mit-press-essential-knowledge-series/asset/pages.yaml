- pgno: 241
  md: 'Again, we''ll build our neural network in layers. The first layer, comprising
    the input neurons, will have 784 neurons. Each one of them will take a single
    input, from a single patch in the image, and will simply output the value it gets
    in its input. If the image is the ankle boot, the first neuron will get the value
    in the top-left patch, a 0, in its input, and it will output that 0. The rest
    of the neurons will get the values of the patches proceeding row wise, from top
    to bottom, left to right. The patch with the value 58, at the right end of the
    heel of the boot (the fourth row from the bottom, and the third column from the
    right) will get 58 and copy it on its output. As rows and columns are counted
    in the neural network from the top and left, this neuron is in the twenty-fifth
    row from the top and twenty-sixth column from the left, making it the input number
    $24 \times 28 + 26 = 698$.


    The next layer will be densely connected to the input layer. It will consist of
    128 ReLU neurons. This layer is not directly connected to the input images (the
    input layer) and will not be directly connected to the output (we''ll add another
    layer for that). Therefore it is a hidden layer, as we cannot observe it from
    the outside of the neural network. Being densely connected, this will result in
    a large number of connections between the input and hidden layer. Each neuron
    on the hidden layer will be connected to the outputs of all neurons on the input
    layer. There'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'will be 784 input connections per neuron, for a total of 784×128 = 100,352
    connections.


    We will add another, last layer, which will contain the output neurons that will
    carry the results of the neural network. This will contain 10 neurons, one for
    each class. Each output neuron will be connected to all the neurons of the hidden
    layer, for a total of 10×128 = 1,280 connections. The grand total of all the connections
    between all the layers in the neural network will be 100,352 + 1280 = 101,632.
    The resulting neural work will look, like the one on the next page. As it is impossible
    to fit all the nodes and edges, you can see dotted boxes standing for the bulk
    of nodes on the input and hidden layers; there are 780 nodes in the first box
    and 124 nodes in the second box. We have also collapsed the arrows going to the
    individual nodes inside the boxes.


    The output of our neural network will consist of 10 outputs, one from each neuron
    on the layer. Each output neuron will represent one class, and its output will
    represent the probability that the input image belongs to this class; the sum
