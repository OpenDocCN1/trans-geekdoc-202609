  md: 'At each point we go through fewer and fewer items to find their minimum. In
    the end, we''ll find the minimum of the last two items, and once we''ve done that,
    all our items will be sorted.


    This sorting method is called selection sort because each time, we select the
    minimum of the unsorted items and place it where it should be. As all sorting
    algorithms that we will examine, selection sort has no problem with ties—that
    is, elements that have the same order. If we find more than one minimum when we
    examine the unsorted items, we just pick any one of them as our working minimum.
    We''ll find the tied item next time around and put it next to its equal.


    Selection sort is a straightforward algorithm. Is it also a good one? If we pay
    attention to what we are doing, we are going from the beginning to the end of
    the items that we want to sort, and each time we try to find the minimum of the
    remaining unsorted items. If we have $n$ items, the complexity of the selection
    sort is $O(n^2)$. This is not bad in itself; such complexity is not prohibitive,
    and we can tackle large problems (read: sort a lot of items) in a reasonable amount
    of time.


    The thing is, exactly because sorting is so important, algorithms do exist that
    are faster than that. So although selection sort is not inherently bad, we usually
    prefer to use other, more advanced algorithms when we have a lot of items at hand.
    At the same time, selection sort is not'
