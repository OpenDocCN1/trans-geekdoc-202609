    this:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_180_0.png)


    Page 1 sends its vote to page 2, the only page it links to. Page 2 divides its
    vote into two parts, and sends 1 / 2 to page 3 and 1 / 2 to page 5. Page 3 divides
