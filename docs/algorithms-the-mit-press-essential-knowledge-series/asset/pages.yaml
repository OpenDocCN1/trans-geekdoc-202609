  md: 'In 1956, a young Dutch computer scientist, Edsger Dijkstra was shopping in
    Amsterdam with his fiancée. Having got tired, they sat down at a café terrace
    to drink a cup of coffee, where Dijkstra thought about the problem of finding
    the best way to go from one city to another. He designed the solution in 20 minutes,
    although the algorithm took some time, three years, to get published. Dijkstra
    led an illustrious career, yet this 20-minute invention remained, to his amazement,
    a cornerstone of his fame.¹10


    So how does the algorithm go? We want to find the shortest paths from one node
    to all other nodes in a graph. The algorithm uses an idea called *relaxation*:
    we assign estimates for the values we want to find (here, distances). In the beginning,
    our estimates are the worst possible. Then as the algorithm progresses, we are
    able to relax these estimates from extremely bad we started with to progressively
    better and better ones, until we arrive at the correct values.


    In Dijkstra’s algorithm, relaxation proceeds as follows. We begin by assigning
    the worst possible value for the distances of all nodes from our starting node:
    we set the distance to infinity; clearly there cannot be anything worse than that!
    In the following figure, we have placed the initial estimate for the shortest
    path and previous node in that path above or below each node. For the node A,
    we have 0 / because the distance from A to A is zero and there is no previous
    node to A. For all other nodes, we have $\infty$ / because the distance is infinity
    and we have no idea about the shortest path to them.'
