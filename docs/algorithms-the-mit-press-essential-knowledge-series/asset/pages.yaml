  md: '# SORTING


    The US Constitution postulates that a decennial census should take place in order
    to apportion taxes and representatives among the several states of the union.
    The first census following the American Revolution took place in 1790, and a census
    has been done every ten years since.


    In the hundred years since 1790, the United States grew rapidly—from a bit less
    than 4 million people in the first census, to more than 50 million in 1880. And
    therein lay a problem: it took eight years to count these people. When the next
    census census year, in 1890, the population was even bigger. If the count were
    taken in the same way, it would probably not have been completed before the following
    census of 1900.


    At that time, Herman Hollerith, a young graduate from Columbia University''s School
    of Mines (he graduated in 1879, when he was 19), was working for the US'
  merge: -1
