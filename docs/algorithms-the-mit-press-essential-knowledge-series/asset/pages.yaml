    All programs implement a set of steps to do something, so we could be tempted
    to say that all programs are algorithms. We are a bit stricter, however, and want
    our steps to meet certain characteristics.⁴


    +   1. The steps must terminate after a finite number of steps. An algorithm cannot
    run forever. (A program may run forever, as long as the computer on which it runs
    remains operational. That program would not be an implementation of an algorithm;
    it would just be a computational process.)


    +   2. The steps must be precise, so that we can execute them without confusion.


    +   3. The algorithm may operate on some input; in the case of Euclid’s algorithm,
    it operates on two integers.


    +   4. The algorithm has some output; that is the whole purpose of the algorithm:
    to produce something as a result. In Euclid’s algorithm, that is the greatest
    common divisor.


    +   5. The algorithm must be effective. A human should be able to execute each
    step in a reasonable amount of time with pen and paper.'
