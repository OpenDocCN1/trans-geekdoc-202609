    3. The tangent of an angle is defined as the ratio of the opposite side to the
    adjacent side in a straight triangle, or equivalently, by the sine of the angle
    divided by the cosine of the angle in the unit circle. The hyperbolic tangent
    is defined as the ratio of the hyperbolic sine by the hyperbolic cosine of a hyperbola.

    4. Warren McCulloch and Pitts (1943) proposed the first artificial neuron. Frank
    Rosenblatt (1957) described the Perceptron. If they are more than half a century
    old, how come neural networks have become all the range recently? Marvin Minsky
    and Seymour Paper (1969) struck a major blow to Perceptrons in their famous book
    of the same name, which showed that a single Perceptron had fundamental computational
    limitations. This, coupled with the hardware limitations of the time, ushered
    in a so-called winter in neural computation, which lasted until the 1980s, when
    researchers found how to build and train complex neural networks. Interest in
    the field then revived, but still a lot more work was required to advance neural
    networks to the media-grabbing results that have been seen in the few years.

