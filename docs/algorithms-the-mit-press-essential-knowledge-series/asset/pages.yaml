  md: 'For reasons that have nothing to do with the binary search algorithm per se,
    but rather the way we turn algorithms into real computer code in programming language,
    programmers have been prey to insidious bugs that have crept into their implementations.
    And we are not talking about rookies; even world-class programmers have failed
    to get it right.4


    To get an idea of where such bugs may lurk, consider how we find the middle element
    among the items we want to search in the first step of the algorithm. Here is
    a simple idea: the middle element of the $mth$ and $nth$ elements is $(m+n)/2$,
    rounded if the result is not a natural number. This is true, and it follows from
    elementary mathematics, so it applies everywhere.


    Except in computers. Computers have limited resources, memory among them. It is
    not possible, therefore, to represent all the numbers we want on a computer. Some
    numbers will simply be too big. If the computer has an upper limit on the size
    of the numbers that it can handle, then both $m$ and $n$ should be below that
    limit. Of course, $(m+n)/2$ we have to calculate $m+n$ and then divide it by two,
    and that $sum$ may be larger than the upper limit! This is called overflow: going
    beyond the range of allowable values. So you get a bug that you had never thought
    bite you. The result will not be the middle value but instead something else entirely.'
