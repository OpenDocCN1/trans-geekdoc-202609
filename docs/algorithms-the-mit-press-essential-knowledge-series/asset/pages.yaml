    At the end, Dijkstra''s algorithm found all the shortest paths from the starting
    node to all other nodes in the graph. The algorithm is efficient, as its complexity
    is O((m+n)logn), where m is the number of edges in the graph and n is the number
    of nodes. Here is the algorithm as a set of steps:


    +   1. Assign a distance equal to infinity to all nodes except for the starting
    node; assign a distance equal to zero for the starting node.


