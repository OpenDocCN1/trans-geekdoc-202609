    is a prophet.


    We are interested in algorithms, not programming, here, but let the author share
    a bit of advice for those who write or want to write computer programs. Do not
    despair if you find yourself wretched poring over a line of code that does not
    not do what you think it should do. Do not be dismayed if the following day you
