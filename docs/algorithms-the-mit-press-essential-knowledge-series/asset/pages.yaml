- pgno: 169
  md: 'candidates at Stanford University, and they named their algorithm PageRank,
    after Page (and not after “page”) and rank, as one might expect.


    Before we embark on a description of PageRank, we need to understand exactly what
    search engines do. This is actually two things. First, they crawl the web, reading
    and indexing all the web pages they can come across. In this way, when we type
    in a search term, search engines look into the data they have stored on the crawled
    web pages and find the ones that match our query. So if we search for “climate
    change,” the search engines will search through the data they have amassed to
    the web pages that contain this search term.


    If our search term describes a popular topic, the results can be numerous. At
    the time of this writing, the query “climate change” on Google returns more than
    700 million results; this number may be different when you read these lines, but
    you get an idea of the scale. This brings us to the second thing that search engines
    do. They must present the search results so that those are more pertinent to what
    we are looking for first, and those that are less likely to interest us appear
    later. If you are trying to learn the facts about climate change, you would expect
    to see results from the United Nations, National Aeronautics and Space Administration
    (NASA), or Wikipedia come up on top. You would be rather surprised if the top
    result was a web page explaining the view of the Flat Earth Society on'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'the topic. From the hundreds of millions of web pages that may be related to
    your query, many will be trivial; others may be bloviating, and yet others will
    be utter nonsense. You want to hone in on those that are to the point and authoritative.


    When the Google search engine arrived on the scene (the author is old enough to
    remember), people (the author included) started switching to the newcomer from
    other, older, now-extinct search engines because its results were better and arrived
    faster. It also helped that the Google web page was plain, containing only relevant
    information, instead of being with all sorts of paraphernalia, which had been
    the fashion. We''ll leave aside the second factor, illuminating though it is (Google
    understood that users cared for good and fast search results, not for bells and
    whistles), and deal with the first. How could Google deliver better results than
    the others, fast?


    If the web were small, we could create a catalog of it, and have editors to curate
    the catalog and assign importance to its entries—the web pages. But the scale
    of the web precludes such an approach, although there were such attempts before
    it became obvious that the size of the web would make this an impossible task.


    The web consists of web pages, linked to each other through links. We call these
    links *hyperlinks*; text that contains such cross-references to other parts of
    the text'
