  md: 'A complexity of the form O(kⁿ) is called exponential complexity. Note the difference
    with the polynomial complexity where the exponent was constant; here it is the
    exponent that changes. We saw exponential growth explodes. The universe will not
    survive long enough to see the answer of exponential algorithms for nontrivial
    inputs. Such algorithms are interesting from a theoretical point of view because
    they show that a solution can be found. We can then search for better algorithms
    with lower complexity, or we may be able to prove that no better algorithms can
    be found, in which case we can settle for something less than the ideal—for instance,
    approximate solutions.


    There is something that grows even faster than exponentiation, and this is the
    factorial. If you have not encountered a factorial before, the factorial of a
    natural number n—which we write as n!—is simply the product of all the natural
    numbers up to and including that number: 100! =1×2×3...×100. Even if you have
    not encountered 100! you probably have encountered 52! even with knowing it. That
    is the number of different shuffles of a deck of cards. Algorithms whose running
    time is measured in factorials have factorial complexity.


    Although numbers like 100! may seem exotic, they arise in many nonexotic settings
    and not just card games. Take, for example, the following problem: “If we have
