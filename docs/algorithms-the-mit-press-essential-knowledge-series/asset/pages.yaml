- pgno: 240
  md: 'In the following figure, we show a random sample of ten items from each kind
    of clothing. There is quite a variety in the images, as you can see, and not all
    of them are picture-perfect examples of each particular clothing class. That makes
    the problem somewhat more interesting. We want to create a neural network that
    takes as its input images like these and provides an output that tells us kind
