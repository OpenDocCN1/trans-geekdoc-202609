    # Measuring Algorithms


    When we are investigating an algorithm to solve a problem, we want to know how
    it is going to perform. Speed is always an important factor. We use algorithms
    on computers to do things faster than a human would do.


    As computer hardware improves, we are usually not content with knowing how a program
    implementing an algorithm runs on a particular computer. Our computer may be faster
    or slower than the one that the algorithm was measured on, and after some years,
    measurements of algorithms on outdated machines will have only historical interest.
    We need a way to measure how well an algorithm performs independent of computer
    hardware.


    The size of the problem we are trying to solve, though, should be somehow reflected
    in how we measure the performance of an algorithm. We don''t really care how long
    it takes to sort 10 items; after all, we can do that by hand. We do care how long
    it takes to sort a million items or more. We want a measure of how we expect an
    algorithm to perform in problems that are not trivial.


    To do that, we need a way to quantify the size of problems fed to algorithms.
    The dimension of interest varies'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'among different problems. If we want to sort a number of items in our computer,
    the relevant dimension is the number of items that we want to sort (and not, say,
    the size or composition of the items). If we want to multiply two numbers, the
    relevant dimension is the number of digits of the two numbers (that also makes
    sense for humans: long multiplication is long because it depends on how many digits
    each number has). When we study a problem and candidate algorithms for tackling
    it, we do it always with the size of the problem under consideration.


    Although particular problems have different ways to assess their size, in the
    end, for each problem we specify its size with an integer number, which we call
    $n$. Picking up the examples above, $n$ is the number of either the items to sort
    or digits of the numbers we want to multiply. Then we want to be able to talk
    about the performance of algorithms tackling problems of size $n$.


    The time required by an algorithm is related to its computational complexity.
    The computational complexity of an algorithm is the amount of resources it requires
    to run. There are two main kinds of resources here: time, how long it takes, and
    space, how much storage it requires in terms of computer memory.


    We are focusing on time right now. As there are computers with different performance
    characteristics, talking about the time taken by an algorithm to run on a particular
    computer may give us some indication of what expect'
