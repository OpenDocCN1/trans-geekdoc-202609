  md: 'or other texts is called hypertext. The notion of hypertext predates the web.
    The first description of a system of organizing knowledge by interlinking documents
    was written by the US engineer Vannevar Bush and appeared in 1945 in the Atlantic.
    The World Wide Web, or simply the web as it became known, was developed by the
    British computer scientist Tim Berners-Lee in the 1980s. Berners-Lee was working
    at CERN, the European Organization for Nuclear Research, outside Geneva, Switzerland,
    and wanted to create a system to help scientists share documents and information.
    They could do that by making their documents available online and also adding
    links from their documents to other documents that were available online. The
    web has grown, and continues to grow, organically by people adding new pages.
    Authors of web pages write the content of the pages and link to existing pages
    that are relevant to the content of the pages they write.


    Imagine you are the author of an online article that provides an overview of the
    effects of climate change in your country. In the article, as you introduce the
    topic, you may want to let your readers navigate to a web page that you believe
    is an authoritative source on the matter, so you add a link to that web page.
    In this way you help your readers by allowing them to delve deeper into the subject,
    while at the same time you add gravitas to your own writing because you substantiate
    your statements by those of another web page that you trust.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'There are many people like you, writing their own online articles on the effects
    of climate change in their countries or regions. Each one of them may also want
    to link to what they believe is an authoritative source on the topic. Hyperlinks
    will emanate from these online articles to point to relevant sources of information.


    The reason why NASA might come up on top in a search for climate change is that
    lots of authors, each one writing their own article, decided to place a hyperlink
    to the NASA web page on climate change. Authors made their own choices individually,
    but it is likely that many chose the same page, such as, for instance, NASA''s
    page. It therefore makes sense that this page on climate change should be judged
    important, relative to other web pages.


    The whole system acts as a kind of democracy. Authors of web pages link their
    pages to other pages. The more links a web page accrues, the more authors judged
    it important enough to link to it from their own page, and thus the more important
    it becomes overall.


    There is, though, a conceptual difference from democracy as we usually practice
    it. Not all of these articles that are written are equal. Some of them appear
    on more prestigious websites than others. An article on a blog that is read by
    a handful of people carries less weight than an article in an online publication
    that rakes in hundreds of thousands of readers. This indicates that we should
    not consider just the number of links pointing to a web page'
  merge: -1
  img_proc: true
