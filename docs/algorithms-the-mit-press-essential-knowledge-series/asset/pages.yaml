  md: 'There are also other common bases. When the base is the mathematical constant
    $e$, we write $lnx$. The mathematical constant $e$, called Euler’s number, is
    approximately equal to 2.71828. In the natural sciences we meet $lnx$ a lot, which
    is why it is called natural logarithm. The other common base is 2, and instead
    of writing $log_2x$ we write $lg$. Base 2 logarithms are common in computer science
    and algorithms, but probably unused outside these fields, although we have already
    met them. In paper folding, if a wad of paper has 1,024 layers, it has been folded
    $lg1024 = lg2^{10}$ times. In the chess example, the number of grains of rice
    results from the number of doublings we perform, which are $lg2^{63} = 63$.


    The reason we use $lg$ a lot in algorithms is that it appears whenever we solve
    a problem by splitting it into two equal smaller problems; this is called divide
    and conquer, and it works like folding a sheet in two. The most efficient way
    to search for something in a sorted group of items has complexity $O(lgn)$. That
    is pretty amazing; it entails that to find something among one billion ordered
    items, we need only $lg10^9 \approx 30$ probes into your items.


    Algorithms that have logarithmic complexity are the next best after algorithms
    that run in constant time. Next come algorithms that run in $O(n)$, which are
    called linear time algorithms because their time grows proportionally with $n$;
    that means they grow as multiples of $n$. We saw that searching for an item in
