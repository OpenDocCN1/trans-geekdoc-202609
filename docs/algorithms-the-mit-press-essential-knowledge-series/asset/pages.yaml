  md: 'The greedy algorithm we have presented has one additional nice property (apart
    from being practical). It is an *online algorithm*: an algorithm that works even
    if the inputs are not known when we start but instead arrive at the scene as we
    go. We don’t need to know all the edges to start running the algorithm. The algorithm
    will work correctly, even if the graph is constructed in a piecemeal fashion,
    while we are running the algorithm. This would happen even after we have started
    scheduling signing up for the tournament matches. We will be able to color each
    edge (match) as it comes, and whenever the graph is finished, we''ll have an edge
    coloring ready. Moreover, this greedy algorithm is the optimum algorithm if the
    graph is constructed incrementally in this way; no exact algorithm, no matter
    how inefficient, exists at all when the graph is constructed while we are solving
    the problem.$8$


