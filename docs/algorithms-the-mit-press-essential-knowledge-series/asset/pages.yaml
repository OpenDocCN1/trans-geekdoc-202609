  md: '3. Otherwise, if the middle element is greater than the search term, limit
    the search space up to the middle element and go back to step 1.


    4. Otherwise, the middle element is equal to the search term; report success and
    stop.


    In this way, we divide by two the items that we have to search. This is a divide-and-conquer
    method. It results in repeated division, which as we have seen in chapter 1 gives
    us the logarithm. Repeated division by two gives us the logarithm base two. In
    the worst case, a binary search will keep dividing and dividing our items, until
    it cannot divide any further, like we saw in the unsuccessful search example.
    For $n$ items, this cannot happen more than $\lg n$ times; it follows that the
    complexity of a binary search is $O(\lg n)$.


    The improvement compared to a sequential search, even a self-organized search,
    is impressive. It will not take more than 20 probes to search among a million
    items. Viewed from another angle, with a hundred probes we are able to search
    and find any item among $2^{100} \approx 1.27 \times 10^{30}$, which is more than
    one nonillion.


    The efficiency of a binary search is astounding. Its efficiency is probably only
