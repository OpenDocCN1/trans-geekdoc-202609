- pgno: 107
  md: '# A Needle in a Haystack


    The simplest way to search is what we do to find the proverbial needle in a haystack.
    If we want to find something in a group of objects and there is absolutely no
    structure in them, then the only thing we can do is to check one item after the
    other until we either find the item we are looking for or fail to find it after
    exhausting all items.


    If you have a deck of cards and are looking for a particular one in them, you
    can start taking off the cards from the top of the deck until you find the one
    you are looking for or run out of cards. Alternatively, you can start taking off
    the cards one by one from the bottom of the deck. You can even take off cards
    from random positions in the deck. The principle is the same.


    Usually we do not deal with physical objects in computers but rather digital representations
    of them. A common way to represent groups of data on a computer is in the form
    of a list. A list is a data structure that contains a group of things in such
    a way that from one item we can find the next. We can usually think of the list
    as containing linked items, where one item points to the next, until the end,
    where the last item points to nothing. The metaphor is not far from the truth
    because internally the computer uses memory locations to store items. In a linked
    list, each item contains two things: its payload data'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'and the memory location of the next item on the list. A place in memory that
    holds the memory location of another place in memory is called a pointer. Therefore
    in a linked list, each element contains a pointer to the next element. The first
    item of a list is called its head. The items in a list are also called nodes.
    The last node does not point to anywhere; we say that it points to null: nothingness
    on a computer.


    A list is a sequence of items, but it is not necessary that the sequence is ordered
    using some specific criterion. For example, the following is a list containing
    some letters from the alphabet:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_108_0.png)


    If we have an unordered list, the algorithm for finding an item on it goes like
    this:


    +   1. Go to the head of the list.

    2. If the item is the one we are looking for, report that it is found and stop.

    3. Go to the next item on the list.

    4. If we are at null, report that the search item was not found and stop. Otherwise,
    return to step 2.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'This is called a linear or sequential search. There is nothing special about
    it; it is a straightforward implementation of the idea of examining each single
    thing in turn until we find the one we want. In reality, the algorithm makes the
    computer jump from pointer to pointer until it reaches the item we are looking
    for or null. Below we show what is happening when we search for E or X:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_109_0.png)


    If we search among n items, the best thing that can happen is to hit on the item
    we want immediately, which will occur if it is the head of the list. The worst
    thing that can happen is that the item is the last one on the list or not on the
    list at all. Then we must go through all n items. Therefore the performance of
    sequential search is O(n).


    There is nothing we can do to improve on that time if the items appear on the
    list in a random sequence. Going back to a deck of cards, you can see why this
    is so: if the deck is properly shuffled, there is no way to know in advance where
    we''ll find our card.


    Sometimes people have trouble with that. If we are looking for a paper among a
    large pile, we may tire of going'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'one after the other. We may even think of how unlucky we would should the paper
    turn out to be at the bottom of the pile! So we stop going through the pile in
    order and peek at the bottom. There is nothing wrong in peeking at the bottom,
    but it''s wrong to think that this improves our chances of finishing the search
    quickly. If the pile is random, then there is no reason why the sought-after item
    is not the first, last, or one in the middle. Any position is equally likely,
    so starting from the top and making our way to the bottom of the pile is as good
    a strategy as any other that ensures we examine each item exactly once. It is
    usually simpler to keep track of what we looked at if we work in a specific order,
    however, than jumping around erratically, and that''s why we prefer to stick with
    a sequential search.


    All this holds as long as there is no reason to suspect that the search item is
    in a particular position. But if this is not true, then things change, and we
    can take advantage of any extra information we may have to speed up our search.


    # The Matthew Effect and Search


    You may have noticed that in an untidy desk, some things find their way to the
    top of the pile, while some others seem to slip to the bottom. When finally cleaning
    up the'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'mess, the author has had the pleasant experience of discovering buried deep
    down in a heap things he believed were long lost. The experience has probably
    occurred to others as well. We tend to place things we use frequently close; things
    we have little use for slip further and further out of reach.


    Suppose we have a pile of documents on which we need to work. The documents are
    not ordered in any way. We go through the pile, searching for the document we
    need, processing it, and then placing not where we found it but instead on the
    top of the pile. Then we go again with our business.


    It may happen that we do not work with the same frequency on all documents. We
    may return to some of them again and again, while we may rarely visit others.
    If we continue placing every document on the top of the pile after working on
    it, after some time we''ll find out that the most popular documents will be near
    the top, while the ones we accessed the least often will have moved toward the
    bottom. This is convenient for us because we spend less time locating the frequently
    used documents and thus less time overall.


    This suggests a general searching strategy, where we search for the same items
    repeatedly, and some items are more popular than others. After finding an item,
    bring it forward so that we''ll be able to find it faster the next time we will
    look for it.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'How applicable would such a strategy? It depends on how often we observe such
    differences in popularity. It turns out that they happen a lot. We know the saying
    “the rich get richer, and the poor poorer.” It is not just about rich and poor
    people. The same thing appears to be a bewildering array of aspects in different
    fields of activity. The phenomenon has a name, the Matthew effect, after the following
    verse in the Gospel of Matthew (25:29): “For unto every that hath shall be given,
    and he shall have abundance: but from him that hath shall not be taken away even
    that which he hath.”


    The verse talks about material goods, so let''s think about wealth for a minute.
    Suppose you have a large stadium, capable of holding 80,000 people. You are able
    to measure the average height of the people in the stadium. Your result may be
    something around 1.70 meters (7 inches). Imagine that you take out somebody randomly
    from the stadium and put in the tallest person in the world. Will the average
    height differ? Even if the tallest person is 3 meters tall (no such height has
    ever been recorded), the average height would remain stuck at its previous value—the
    difference with the previous average being less than a tenth of a millimeter.


    Imagine now that instead of measuring the average height, you measure the average
    wealth. The wealth of your 80,000 people could be $1 million (we are assuming
