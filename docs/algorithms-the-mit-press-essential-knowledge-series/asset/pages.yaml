    see what normally means shortly) we''ll pick as our pivot something that partitions
    our data in some more equitable way. Choosing the minimum element creates the
    most unequal partition: nothing on the left of the pivot, and all the rest to
    the right of the pivot. Each time, then, we just manage to position the pivot
    itself.


