  md: '8. “Transistor Count,” Wikipedia, https://en.wikipedia.org/wiki/Transistor_count.


    9. That is because to compare n items between them, you need to take one of them
    and compare it to all the other n-1 items, then you need take another one and
    compare it to the other n-2 items (you have already compared it to the first item
    you used), and so. Then it gives 1 + 2 + ... + (n-1) = n(n-1)/2 comparisons. Then
    you get O(n(n-1)/2) = O(n²- n/2) = O(n²), because according to the definition
    of big O, if your algorithm runs in time O(n³), it will certainly run in time
    O(n²- n/2).


