  md: 'PANOS LOURIDAS is Associate Professor in the Department of Management Science
    and Technology at the Athens University of Economics and Business. He works on
    algorithmic applications, software engineering, security, practical cryptography,
    and applied machine learning. He is the author of Real-World Algorithms: A Beginners
