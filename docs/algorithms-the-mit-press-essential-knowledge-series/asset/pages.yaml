    $r(P_1) \times 1 + r(P_2) \times 0 + r(P_3) \times 0 + r(P_4) \times 0 + \frac{r(P_5)}{3}
    = r(P_2) + \frac{r(P_5)}{3}$

    ```


    That is exactly the definition of $r(P_2)$, the pagerank of page 2. The sum of
    the products of the elements of the pagerank vector with the contents of the third
