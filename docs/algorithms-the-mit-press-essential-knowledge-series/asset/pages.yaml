  md: 'If you are below a certain age, the words HotBot, Lycos, Excite, AltaVista,
    and Infoseek mean nothing to you, or if they do mean something, they probably
    do not mean search engines. Yet all of them were vying for our attention at some
    point or other, trying to get us to use them as the gateway to the web.


    This is history now, as the search engine landscape is dominated by two services,
    Google, run by Alphabet, and Bing, run by Microsoft. The explosion of many competitors
    in a new market, and their subsequent consolidation, is a pattern that we witnessed
    in many industries in history. What is remarkable in the search engine space is
    that we know that a large factor in the evolution is the phenomenal success of
    Google, which in turn was based on an algorithm that its founders invented. The
    founders were Larry Page and Sergey Brin, doctoral'
  merge: -1
