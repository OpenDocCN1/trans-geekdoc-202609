- pgno: 231
  md: 'the neurons use the tanh activation function. The output neuron will produce
    a value between -1 and +1, displaying its belief that the data fall in one or
    the other group. We’ll take that value and turn it into a binary decision, yes
    or no, depending on whether it exceeds 0.0 or not. This is what the neural network
    looks like:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_231_0.png)


    # ## The Backpropagation Algorithm


    In the beginning, the neural network knows nothing, and no adjustment has taken
    place; we start with random weights and biases. This is what ignorance means in
    the neural network world. Then we give the neural network an observation from
    our data—that is, a set of coordinates. The $x_1$ and $x_2$ coordinates will go
    on the input layer. Both neurons take the $x_1$ and $x_2$ values and they pass
    them as their output to the first hidden layer. All four neurons of'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'that layer calculate their output, which in their turn, they send to the second
    hidden layer. The neurons on that layer send their own output to the neuron on
    the output layer, which produces the final output value of the neural network.
    As the calculations proceed from layer to layer, the neural network propagates
    the results of the neurons forward, from the input to the output layer:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_233_0.png)


    Once we reach the output layer, we calculate the loss, as we did with the single
    neuron. And then we want to adjust the weights and bias of not just one neuron
    but rather all the neurons in the network so as to minimize the loss.


    It turns out that it is possible to do that by going in the opposite direction,
    from the output to the input layer. Once we know the loss, we can update the weights
    and'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'biases of the neurons on the output layer (here we have just a single neuron,
    but this need is not always so). Having updated the neurons on the output layer,
    we can update the weights and biases of the neurons on the layer before that—the
    last hidden layer. Having done that, we can update the weights and biases of the
    layer before that—the one-but-last hidden layer. And so on, until we reach the
    input layer:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_234_0.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_235_0.png)


    The way the weights and biases of the neurons are updated is similar to the way
    a single neuron is updated. Again, the updates are calculated based on mathematical
    derivatives. You can think of the whole neural network as an enormous function
    whose variables are the weights and biases of all the neurons. Then we can calculate
    the derivative of each and every weight and bias with respect to the loss, and
    use that derivative to update the neuron.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'With this we arrive at the heart of the learning process in neural networks:
    the backpropagation algorithm.⁶


    For each input and desired output,


    +   1. Calculate the output and loss of the neural network proceeding layer by
    layer, going forward from the input to the output layer.

    2. Update the weights and biases of the neurons to minimize the loss, going backward
    from the output to the input layer.


    Using the backpropagation algorithm, we can build complex neural networks and
    train them to perform different tasks. The building blocks of deep learning systems
    are simple. They are artificial neurons, with their limited computational capabilities:
    taking inputs, multiplying by weights, summing, adding a bias, and applying an
    activation function on the resulting value. Their power derives from connecting
    lots and lots of them in special ways, where the resulting networks can be trained
    to perform the task that we want them to perform.


    # Recognizing Clothes


    To render the discussion more concrete, let us assume that we want to build a
    neural network that recognizes items'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'of clothing displayed in images, so this is going to be an image recognition
    task. Neural networks have been found to be exceptionally good at this.


    Each image will be a small photo, of dimensions 28× 28. Our training data set
    consists of 60,000 images, and our test data set consists of 10,000 images; we''ll
    use 60,000 images for training the neural network, and another 10,000 images for
    evaluating how well it learned. Here is an example image, on which we have added
    axes and a grid to help the discussion that follows:7


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_237_0.png)'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'The image is broken into small distinct parts because that is how we handle
    images digitally. Taking the whole image as a rectangular plot, we divide it into
    small patches, $28\times28 = 784$ of them, and each patch is given an integer
    value from 0 to 255, corresponding to a shade of gray, with 0 being completely
    white and 255 being completely black. The above image is actually the matrix on
    the following page.


    In reality, neural networks require that we usually scale their inputs to a small
    range of values, such as between 0 and 1, otherwise they may not work well; you
    may think of it as having large input values that lead neurons astray. That means
    that before using this matrix we would divide each cell by 255, but we''ll ignore
    this in the rest of the discussion.


    The different items of clothing may belong to ten different classes, which you
    can see in the table below. To a computer, the classes are just different numbers,
    which we call *labels*:


    | Label | Class | Label | Class |

    |---|---|---|--|

    | 0 | T-shirt/top | 5 | Sandal |

    | 1 | Trouser | 6 | Shirt |

    | 2 | Pullover | 7 | Sneaker |

    | 3 | Dress | 8 | Bag |

    | 4 | Coat | 9 | Ankle boot |'
  merge: -1
  img_proc: true
- pgno: 239
  md: <!-- no content -->
  merge: -1
