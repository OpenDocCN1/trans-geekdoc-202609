    the classes.


    # linear search


    A search algorithm in which we examine each item in turn until we find the one
    we are looking for. It is also called a sequential search.


    # linear time


    Time proportional to the input of an algorithm, written as O(n).


    # linearly separable


    A data set whose observations can be separated into two categories by a straight
