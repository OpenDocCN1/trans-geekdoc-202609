  md: 'are not in their final positions yet. But overall, they are in better positions
    than before. So we have one element, the pivot, in the best position possible,
    and the other elements better positioned than before.


    This has an important effect on the performance of quicksort: its expected complexity
    is O(nlgln), which is way better than O($n^2$). If we want to sort 1 million items,
    $O(n^2)$ works out to $10^{12}$, a trillion, while O(nlgln) is about 20 million.


