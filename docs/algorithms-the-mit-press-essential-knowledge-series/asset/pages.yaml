  md: 'Unless you are familiar with matrix operations, this may be confusing because
    we usually talk about the product of two numbers, which is the common multiplication,
    and not about the product of constructs like vectors and matrices. We can define
    mathematical operations on other entities, not just numbers, as long as it suits
    us. The product of a vector with a matrix is such an operation. There is no mystery
    involved in it: it is simply an operation that we define as a particular calculation
    involving the elements of the vector and matrix.


    Suppose that we make bagels and croissants that we sell for $2.00 and $1.50, respectively.
    We have two shops; on a particular day, the first shop sells 10 bagels and 20
    croissants, while the second shop sells 15 bagels and 10 croissants. How do we
    find the total sales per shop?


    To find the total sales from the first shop, we will multiply the price of a bagel
    with the number of bagels sold in that shop, and the price of a croissant with
    the number of croissants sold there, and we''ll add these two:


    ```

    $2.00 \times 10 + 1.50 \times 20 = 50$

    ```


    We’ll do the same thing to find the total sales from the second shop:


    ```

    $2.00 \times 15 + 1.50 \times 10 = 45$

    ```'
