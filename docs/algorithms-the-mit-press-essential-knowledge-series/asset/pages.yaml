    Before we start exploring these algorithms, let''s look at some explanations of
    what exactly these algorithms do. Sure, they sort stuff, but that really begs
    the question. What exactly do we mean by sorting data?


    We assume that we have a group of related data—usually called records—that contains
    some information that is of interest to us. For example, such data could be the
    emails in our in-box. We want to rearrange these data in a specific order that
    is useful to us. The rearrangement has to take place using some specific feature
    or features of the data. In our email illustration, we may want to order our messages
    by delivery date, chronologically, or the sender''s name, alphabetically. The
    order may be ascending, from earlier messages to more recent ones, or descending,
    from recent messages going back in time. The output of the sorting process must
    be the same data as the input; in technical terms, this must be a permutation
    of the original data—that is, the original data in different order, but not changed
    in any other way.


    The feature we are using to sort our data is usually called a key. A key may be
    atomic, when we consider that we cannot decompose it to parts, or it may be composite,
    when the key consists of more than a single feature. If we want to sort our emails
    by delivery date, this is an atomic key'
