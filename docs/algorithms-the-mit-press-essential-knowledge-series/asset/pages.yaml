    # The Hyperlink Matrix and Power Method


    The method of calculating the importance of a page from the importance of its
    backlinks has an elegant formula. We start from the graph that describes the links
    between our web pages. We can represent a graph by using a matrix of numbers,
    which we call its adjacency matrix. The construction is straightforward. We create
    a matrix with as many rows and columns as the nodes in the graph. Then we put
    one in for each intersection that corresponds to a link'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'and zero for all other intersections. The adjacency matrix for our example
    is:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_184_0.png)


    We can also represent the importance of the web pages using a single row or vector:


    $r(P_1) \quad r(P_2) \quad r(P_3) \quad r(P_4) \quad r(P_5)$


    As we now get into the nuts and bolts of the PageRank algorithm, we''ll start
    using the term pagerank to refer to the significance of a web page. You will see
    that the term will be justified as we will be able to derive a ranking, in terms
    of importance, of all the pages on the web. As our row contains all the pageranks,
    we will call it the *pagerank vector* of our graph.'
  merge: -1
  img_proc: true
