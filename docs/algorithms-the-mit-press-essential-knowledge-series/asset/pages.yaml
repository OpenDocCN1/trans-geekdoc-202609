    | tanh | -1 | -0.76 | 0 | 0.76 | +1 |

    | rectifier | 0 | 0 | 0 | 1 | 5 |


    If you wonder why the proliferation of activation functions (there are also others),
    it is because it has been found in practice that particular activation functions
    are more suitable in some applications than others. As the activation function
    is crucial for the behavior of a neuron, neurons are often named by their activation
    functions. A neuron that uses the step function is called *Perceptron.*^4 Then
    we have sigmoid and tanh neurons. We also call neurons *units*, and a neuron using
    the rectifier is called a *ReLU*, for rectified linear unit.


    A single artificial neuron learn to distinguish two sets of things. For example,
    take the data in the figure on the top of the next page, portraying a set of observations
    with two features, $x_1$, on the horizontal axis, and $x_2$, on the vertical axis.
    We want to build a system that will tell apart the two blobs. Given any item,
    the system will be able to decide whether the item falls in one group or another.
    In effect, it will create a *decision boundary*, in the figure at the bottom.
    For any combination of $(x_1,x_2)$, it will tell us whether the item belongs to
    the lighter or darker group.'
