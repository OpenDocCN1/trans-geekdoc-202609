    \ will *always* converge so that we can always come up with a solution to the\
    \ pageranks of a graph.\n\n# Dangling Nodes and the Random Surfer\n\nWe now now\
    \ turn to an example of a simpler graph, consisting of just three nodes:\n\n![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_192_0.png)\n\
    \nWe want to find the pageranks of these three nodes. We follow the same algorithm.\
    \ We initialize the pagerank vector to 1 / 3, giving equal pageranks to all nodes.\
    \ Then we multiply the pagerank vector with the hyperlink matrix, which is:\n\n\
    ```\n$\begin{bmatrix} 0 & 1/2 & 1/2 \\ 0 & 0 & 1 \\ 0 & 0 & 0 \\end{bmatrix}$\n\
