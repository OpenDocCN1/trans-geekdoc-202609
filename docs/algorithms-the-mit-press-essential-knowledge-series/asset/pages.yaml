    # Binary Search


    We have considered different ways to search, corresponding to different scenarios.
    A common thread in all these was that the items that we examine are not given
    to us in any specific order; at best, we order them gradually by popularity in
    a self-organized search. The situation changes completely if the items are ordered
    in the first place.


    Let''s say we have a pile of folders, each of which is identified by a number.
    The documents in the pile are ordered according to their identifier, from the
    lowest to highest number (there is no need for the numbers to be consecutive).
    If we have such a pile and are looking for a document with a particular identifier,
    it is foolish to start from the first document and make our way to the last until'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'we find the one we are looking for. A much better strategy is to go straight
    to the middle of the pile. Then we compare the number identifier on the document
    in the middle to the number of the document that we are looking for. There are
    three possible outcomes:


    +   1. If we are lucky, we may have landed exactly on the document that we want.
    We are done; our search is over.


    +   2. The identifier of the document we are looking for is greater than the identifier
    of the document we have in our hands. Then we know for sure that we can discard
    the document at hand *as well as all preceding documents*. As they are ordered,
    they will all have smaller identifiers. We have undershot our target.


    +   3. The opposite happens: the identifier of the document we are looking for
    is smaller than the identifier of the document we have in our hands. Then we can
    safely discard the document at hand *as well as all the documents that come after
    it*. We have overshot our target.


    In either of the last two outcomes, we are now left with a pile that is at most
    half the original one. If we start with an odd number of documents, say $n$, splitting
    $n$ documents in the middle gives us two parts, each with $n / 2$ items (discarding
    the fractional part in the division):'
  merge: -1
  img_proc: true
