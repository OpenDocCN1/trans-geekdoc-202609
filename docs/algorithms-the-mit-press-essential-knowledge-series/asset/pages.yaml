    sort is not just of historical interest, as it performs fantastically. What''s
    not to like in a venerable practical algorithm?⁸


    The easiest way to see a radix sort is by using playing cards again. Suppose we
    have a full deck of cards that has been shuffled and want to sort it. One way
    to do it is to form 13 piles, for each rank value. We go through the deck, taking
    each card and placing it in the respective pile. We''ll get 13 piles of four cards
    each: a pile containing all the aces, another containing all the twos, and so
    on.


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_142_0.png)


    Then we collect the cards, pile by pile, taking care to put each pile we pick
    at the bottom of the cards we are collecting. In this way we have all the cards
    in our hands, partially sorted. The first four cards will be aces, the next four
    twos, and all the way to the kings.


