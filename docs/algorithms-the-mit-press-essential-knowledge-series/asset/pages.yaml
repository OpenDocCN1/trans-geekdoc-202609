    # Getting to Deep Learning


    It can be proven that even though a neuron on its own cannot not do much, a neural
    network can perform any computational task that can be described algorithmically
    and run on a computer. Therefore there is nothing that a computer can do that
    a neural network could not do. The whole idea, of course, is that we do not need
    to tell the neural network exactly how to perform a task. We only need to feed
    it with examples while using an algorithm to make the neural network learn how
    to perform the task. We saw that backpropagation is such an algorithm. Although
    we limited our examples to classification, neural networks can be applied to all
    sorts of different tasks. They can predict'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'values of a target quantity (for instance, credit scoring), translate between
    languages as well as understand and generate speech; and beat human champions
    in the game of Go, in the process baffling experts by demonstrating completely
    new strategies of playing a centuries-old game. They have even learned how to
    play the game of Go starting with just a knowledge of the rules, without access
    to a library of previously played games, and then proceeding to learn as if the
    neural network were playing games against itself.^8


    Today, successful applications of neural networks abound, yet the principles are
    not new. The Perceptron invented in the 1950s, and the backpropagation algorithm
    is more than 30 years old. In this period, neural networks came and went out of
    fashion, with enthusiasm for their potential ebbing and flowing. What has really
    changed in the last few years is our capability to build really neural networks.
    This has been achieved thanks to the advances in manufacturing specialized computer
    chips that can perform the calculations executed by neurons efficiently. If you
    picture all the neurons of a neural network arranged inside a computer’s memory,
    then all the required computations can be carried out by operations on vast matrices
    of numbers. A neuron calculates the sums of the weighted products of its inputs;
    if you recall the discussion on Page-Rank in the previous chapter, the sum of
    the products is the essence of matrix multiplication.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'It has turned out that graphics processing units (GPUs) are perfectly suited
    for this. GPUs are computer chips that are specially designed to create and manipulate
    images inside a computer; the term builds on central processing units (CPUs),
    the chip that carries out the instructions of a program inside a computer. GPUs
    are built to carry out instructions for computer graphics. The generation and
    processing of computer graphics requires numerical operations on big matrices;
    a computer-generated scene is a big matrix of numbers (think of the shoe). GPUs
    are the workhorses of game consoles. The same technology that arrests human intelligence
    in hours of diversion is also used to advance machine intelligence.


    We started with the simplest possible neural network, consisting of a single neuron.
    Then we added a few neurons, and then we added a few more hundreds. Still, the
    image recognition neural network that we created is by no means a big one. Nor
    is its architecture complicated. We just added layer on layer of neurons. Researchers
    in the field of deep learning have made big strides in devising neural network
    designs. These architectures may comprise dozens of layers. The geometry of these
    layers need to be a simple one-dimensional set of neurons, the ones we have here.
    For example, neurons inside a layer may be stacked on two-dimensional canvas-like
    structures. Moreover, it is not necessary to have each layer densely connected
    to the one before; other connection patterns are'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'possible. Nor is it necessary to have the outputs of a layer simply connected
    to the inputs of the next layer. We may, for instance, have connections between
    non-consecutive layers. We may bundle up layers and treat them as modules, combining
    them with modules containing other layers to form more and more more complex configurations.
    Today we have a menagerie of neural network architectures at our disposal, such
    that particular architectures are well suited for specific tasks.


    The neurons on the layers in all the neural network architectures update the values
    of the weights and biases as they learn. If we reflect on what is happening, we
    can see that we have a set of inputs that transforms the layers during the learning
    process. Once the training stops, the layers have somehow, via the adjustments
    in their parameters, taken in the information represented by the input data. The
    weights and biases configuration of a layer represents the input it has received.
    The first hidden layer, which comes in direct contact with the input layer, encodes
    the neural network''s input. The second hidden layer encodes the output of the
    first hidden layer, to which it is directly connected. As we proceed deeper and
    deeper into a multilayer network, each layer encodes the output received by the
    previous layer. Each representation builds on the previous one and therefore is
    on a higher level of abstraction from the one of the preceding layer. Deep neural
    networks, then, learn a hierarchy of concepts,'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'proceeding to higher and higher levels of abstraction. It is in this sense
    that we talk of deep learning. We mean an architecture whereby successive levels
    represent deeper concepts, corresponding to higher levels of abstraction. In image
    recognition, the first layer of a multilayer network may learn to recognize small
    local patterns, such as edges in the image. Then the second layer may learn to
    recognize patterns that are built from the patterns recognized by the first layer,
    such as eyes, noses, and ears. The third layer may learn to recognize patterns
    that are built from the patterns recognized by the second layer, like faces. Now
    you can see that our neural network for recognizing the images was somewhat naive;
    we did not try to implement actual deep learning. By building abstractions on
    abstractions, we expect our network to find patterns that humans find, from structures
    in sentences, to signs of malignancy in medical images, to recognizing handwritten
    characters, to detecting online fraud.


    Yet, you may say, it all boils down to updating simple values on simple building
    blocks—the artificial neurons. And you would be correct. When people realize that,
    sometimes they feel let down. They want to learn what machine and deep learning
    are, and the simplicity of the answer disappoints: something that appears to have
    human capabilities can be reduced to fundamentally elementary operations. Perhaps
    we would prefer to find something more involved, which would not fail to flatter
    our self-esteem.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'We should not forget, however, in science we believe that nature can be explained
    from first principles, and try to find such principles that are as simple as possible.
    That does not preclude complex structures and behaviors arising out of simple
    rules and building blocks. Artificial neurons are much simpler than biological
    ones, and even if the workings of biological neurons can be explained in simple
    models, it is thanks to the vast number of interconnected biological neurons that
    intelligence, as we know it, can arise.


    This helps put some things into perspective. True, artificial neural networks
    can be uncanny in their potential. In order to make them work, however, an amazing
    amount of human creativity and terrific engineering effort is required. We have
    only scratched the surface in our account here. For instance, take backpropagation.
    That is the fundamental algorithm behind neural networks, allowing us to perform
    efficiently what is at heart a process of finding mathematical derivatives. Researchers
    have been busy devising efficient calculation techniques, such as *automatic differentiation*,
    a mechanism for calculating derivatives that has been widely adopted. Or take
    the exact way that changes in the neural network parameters are calculated. Various
    different *optimizers* have been developed, allowing us to deploy bigger and bigger
    networks that are at the same time more and more efficient. Turning to the underlying
    hardware, hardware engineers are designing better'
  merge: -1
  img_proc: true
