  md: '# EPILOGUE


    On July 15, 2019, Mark Carney, the Bank of England governor, presented the design
    of the new £50 note, expected to enter circulation about two years later. The
    Bank of England had decided in 2018 to celebrate a character from science with
    the new banknote and opened a six-week public nomination period for the selection.
    It received a total of 227,299 nominations for 989 eligible characters. From this,
    the Banknote Character Advisory Committee decided on a short list of 12 options.
    Then the governor made the final decision, selecting Alan Turing. He commented,
    “Alan Turing was an outstanding mathematician whose work had an enormous impact
    on how we live today. As the father of computer science and artificial intelligence,
    as well as war hero, Alan Turing’s contributions were far ranging and path breaking.
    Turing is a giant on whose shoulders so many now stand.


    Turing (1912–1954) was a genius who explored the limits and nature of computation,
    foresaw the rise of machines that would display intelligent behavior, grappled
    with the question of whether machines could think, contributed to mathematical
    biology and mechanisms of morphogenesis, and played a crucial role in the cryptanalysis
    of encrypted German messages during World War II (his'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'contribution remained a secret for decades). In a tragic turn of events, Turing
    died by suicide. He had been arrested and convicted in 1952 for homosexuality,
    which was criminal in the United Kingdom at the time, and compelled to get hormonal
    treatment. An official pardon was issued in 2013. His appearance on the new note
    is a form of rehabilitation that would have been unthinkable a few decades back.²


    Throughout this book we have been describing algorithms as consisting of simple
    steps, elementary enough that they can be carried out using a pen and paper. Given
    that we implement algorithms in computer programs, the question of what is really
    is an algorithm will help us understand what can really be computed. This requires
    us to dig deeper into the nature of these simple steps. After all, what a primary
    school student can do with a pen and paper is different from what a college graduate
    can do. Is it possible to define precisely what kind of algorithm could be made
    of? Turing offered an answer even before digital computers were built. He proposed
    a model machine in 1936 in order to answer the question of what a computer, any
    computer, can do. A Turing machine is a simple contraption. It consists of the
    following parts:³


    +   1. A tape. The tape is divided into squares or cells. Each cell can be blank
    or contain a symbol from some alphabet. The tape can be infinitely long.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '> Is it possible to define precisely what kind of steps an algorithm could
    be made of? . . . [Turing] proposed a model machine in 1936 in order to answer
    the question of what a computer, any computer, can do.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '2. A head that can move left and right along the tape, one position at a time.
    The head can read the symbol in the cell underneath. We call the symbol in that
    cell the scanned symbol. The head can erase or overwrite the scanned symbol.


    3. A finite control, also called a state register. The finite control can be in
    any of a finite set of states. You can think of it as a dial inscribed with states,
    and an indicator that can point to any one of them.


    4. A finite instructions table. Each instruction specifies the next move of the
    machine. This is what the machine will do, given its current state and the scanned
    symbol.


    You can see a Turing machine in the figure on the next page.⁴


    The alphabet of this particular Turing machine consists of 1 and ★. The finite
    control shows that the machine can be in one of seven states, $q_0, q_1, \dots,
    q_6$. The instructions table has one row for each possible state, and one column
    for each possible symbol; we use $B$ to stand in for blank so that we can see.
    The current state is indicated by the row, and the scanned symbol by the column.
    Each entry in the instructions table contains a triplet, describing a move, or
    a dash, meaning that the machine has nothing to do in this row and column combination.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Finite Instructions Table


    | State | 1 | $\star$ | B | | | | | |

    |---|---|---|---|---|---|---|---||}{

    | $q_0$ | | | $(q_1, B, R)$ | $(q_5, B, R)$ | | | | |

    | $q_1$ | | | $(q_1, 1, R)$ | $(q_2, \star, R)$ | | | | |

    | $q_2$ | | | | $(q_3, \star, L)$ | $(q_1, B, R)$ | $(q_0, 1, R)$ |

    | $q_3$ | | | | | $(q_3, 1, L)$ | $(q_4, B, R)$ | |

    | $q_4$ | | | | | | $(q_4, 1, L)$ | $(q_5, B, R)$ | |

    | $q_6$ | | | | | | | | |


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_260_0.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'A move of the machine consists of three actions:


    +   1. The machine may change or remain in the same state. The new state is the
    first element of the triplets in the finite instructions table.


    +   2. It will write a symbol under the head. The symbol may be the same with
    the one already there (then the result is that the existing symbol remains in
    the cell). The symbol to be written is the second element of the triplets.


    +   3. The head will shift either to the left (L) or right (R) of the current
    cell. The shift is the third element of the triplets.


    Our example Turing machine executes an algorithm that computes the difference
    of two numbers $a$ and $b$ when $a > b$; otherwise, it returns zero. This operation
    is called *monus* or *proper subtraction*, and we write a $a \div b$. We have
    $4 \div 2 = 2$ and $2 \div 4 = 0$.


    Initially, we place the machine’s *input* on the tape. The input is a finite string
    of symbols from the machine’s alphabet. All other cells of the tape, to the left
    and right of it, are blank. In this Turing machine, the input is $1111 \star 11$.
    The input represents the numbers four and two in the *unary numeral system*, separated
    by $\star$.


    This machine starts with its head on the leftmost-input cell. The finite control
    points at the $q_0$ state. Then the'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'machine starts working and performs its moves. If we follow the machine''s
    operation for the first six moves, we''ll see that it goes like this:


    +   1. We are at state $q_0$ and the scanned symbol is 1:


    The instruction table gives us $(q_1,B,R)$, so the machine will change its state
    to $q_1$, overwrite 1 with blank, and move right. The tape and head will be:


    +   2. For the $q_1$ state and scanned symbol 1, the instruction table gives us
    $(q_1,1,R)$. The machine will read and write 1, leaving the cell as it is, and
    will move right, remaining at state $q_1$:


    | | 1 | 1 | 1 | ★ | 1 | |'
  merge: -1
  img_proc: true
- pgno: 263
  md: '3. The machine does the same as step 2, reading and writing 1, remaining at
    $q_1$, and moving right:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_263_0.png)


    4. Again, the machine will read and write 1, remain at $q_1$, and move right:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_263_1.png)


    5. The head has moved over the ★ symbol and remained at state $q_1$. The instruction
    is $(q_2,*,R)$. The machine will change state, to $q_2$, leave ★ on the tape,
    and move right:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_263_2.png)


    6. The head has moved over the 1 to the right of ★ and is at state $q_2$. The
    instruction is $(q_3,*,L)$. The machine will change state, to $q_3$, write ★ over
    the 1, and move back left:'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The machine will continue working in this way, performing the moves prescribed
    by the instruction table. If we take a higher-level view, we''ll realize that
    the machine executes a loop. In each iteration, it finds the leftmost one and
    replaces it with a blank. It then searches for a ★. When it finds it, it continues
    going right until it finds a 1, which it turns into a ★. Therefore in each iteration,
    the machine strikes out a 1 on the left and right of ★. At some point, this will
    no longer be possible. Then the machine will replace all ★ symbols with blanks
    and will terminate. The tape will contain 11 ones, equivalent to the number 2,
    surrounded by blanks. To indicate termination, the machine enters the state $q_6$,
    where according to the instructions table there is nothing to do, and it stops.


    If we provide as input 11 ★ 1111, the machine will beaver away until it stops
    with a tape full of blanks, which is equivalent to 0. If we give the machine any
    input consisting of $a$ ones followed by an asterisk and then $b$ ones, it will
    follow its moves until it leaves the tape with either $a-b$ ones, if $a > b$,
    or otherwise all blanks.


    This Turing machine executes an algorithm for computing the monus operation based
    on its input and following the instructions described in its instructions table.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'The steps are so elementary that the head of the Turing machine scampers around
    a lot in order to perform the operation. It will take 21 moves to find that 2
    ÷ 4 = 0 and 34 moves to find that 4 ÷ 2 = 2. But how simple these moves are! Anybody
    with a modicum of intelligence can carry them out. The rudimentary nature of the
    steps is exactly the point. You do not need any advanced qualifications to perform
    the steps of a Turing machine; you only need to look up a table, move around a
    tape, read and write one symbol at a time, and keep track of what your state is.
    That is all. Yet it is not trivial because the answer to the question of what
    kind of steps an algorithm could be made of, is that they are the steps that a
    Turing machine could perform.


    In this book we have been describing algorithms at a higher level, with more complex
    steps. That is for our convenience because a Turing machine works at such a low
    level of detail that it would be unwieldy to use it to describe our algorithms.
    But all the steps of all the algorithms we have depicted could be presented as
    steps of a properly constructed Turing machine. We have described a simple Turing
    machine to implement the monus operation. For a more complex algorithm we would
    need a Turing machine with more states, a bigger alphabet, and a bigger instructions
    table. But we could still build it, if we wanted.


    The simplicity of the Turing machine belies its ambit; given any algorithm, we
    can construct a Turing machine'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'that implements it. As computers run algorithms, any algorithm that is computable
    by a computer is computable by a Turing machine. Or in other words, whatever we
    can do with an algorithm, we can do with a Turing machine. That is a loose rendering
    of the Church-Turing thesis, named after Turing and the US mathematician Alonzo
    Church (1903–1995), one of the founders of theoretical computer science. Being
    it a thesis, it is not something that has been proved, and we do not know if it
    can be proved mathematically. It is theoretically possible that it could be disproved,
    if somebody devises some alternative form of computation that a Turing machine
    cannot compute. We do not believe this is likely to happen. We therefore take
    the Turing machine to be a formal description of the notion of an algorithm.⁵


    You can imagine any computer, as powerful as you want it. The computer will be
    way faster than a Turing machine that operates on a tape of symbols as we have
    described. But everything it calculates algorithmically, a Turing machine can
    calculate too. You can even imagine computers that we have not been able to manufacture
    yet. Our computers work with bits, which can exist in only two states, 0 and 1.
    Quantum computers work with qubits. When we examine the state of a qubit, this
    will be 0 or 1, like a bit. Yet a qubit, when we don''t examine it, it can be
    in a combination, called superposition, of the two binary states 0 and 1. It is
    as if a qubit is both 0 and 1, until we decide to'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'read it, when it decides to be one of these two values. This allows quantum
    computers to represent multiple states of computation at once. A quantum computer
    would allow us to solve fast problems that are not easily solved by classical
    computers. Unfortunately, building a quantum computer is difficult with the current
    technology. And even a quantum computer could not do something that a Turing machine
    cannot do. Even though it would be able to solve some problems more efficiently
    than any existing classical computer, or any Turing machine for that matter, it
    still won''t be able to solve any problems that a Turing machine cannot solve.


    Our computational limits are given by Turing machines. Anything a computer can
    do, we could really do with a pen and paper, working on a tape of symbols. Everything
    you see executed on any digital device is, in essence, a series of such elementary
    symbol manipulations. In the natural sciences, we behold the world and believe
    that we can explain it using fundamental principles. In computing, it is the other
    way around. We have our fundamental principles and believe that we can do amazing
    feats with them.


    When Turing proposed his machine as a model for computation, digital computers
    did not even exist. That did not prevent him from exploring the capabilities of
    computing machines that would be created in the future. When we think about the
    limits of computers, we should'
  merge: -1
  img_proc: true
- pgno: 268
