- pgno: 200
  md: 'The new matrix that will be derived is called the Google matrix, and we use
    the symbol G. If the behavior of the random surfer is determined by the Google
    matrix, it will work out as we want: the surfer will appear to be following the
    $S$ matrix with probability $a$ and move independently with probability $(1 -
    a)$. In our example, the Google matrix is:


    \begin{pmatrix} 3 & 54 & 3 & 3 & 54 & 3 \ 120 & 120 & 120 & 120 & 120 & 120 \
    3 & & 54 & 54 & & 3 \ 120 & 120 & 120 & 120 & 120 & 120 \ 3 & 54 & 3 & 3 & & 54
    \ 120 & 120 & 120 & 120 & 120 & 120 \ 54 & 3 & 3 & 54 & 3 & 3 \ 120 & 120 & 120
    & 120 & 120 & 120 \ 3 & 37 & 37 & 3 & 3 & 37 \ 120 & 120 & 120 & 120 & 120 & 120
    \ 3 & 3 & 3 & & 105 & 3 \ 120 & 120 & 120 & 120 & 120 & 120 \end{pmatrix}


    Compare that to the $S$ matrix. Observe that in the first row, we had two entries
    with $1 / 2$ and the rest were zero. Now in the Google matrix, we have the two
    $1 / 2$ entries turned to $54 / 120$, and the rest of the entries turned from
    $0$ to $3 / 120$. Similar transformations have occurred in the other rows. If,
    then, the random surfer lands on page 1, the possible moves out are to pages 2
    and 5 with probability'
  merge: -1
  img_proc: true
- pgno: 201
  md: '54 / 120 for either of them, or any other page with probability 3 / 120 for
    each one of them.


    We are now able to give the final definition of the PageRank algorithm:


    +   1. Form the Google matrix of the graph.

    2. Start with initial pagerank estimates, giving a pagerank of $1 / n$ to each
    page, where $n$ is the total number of pages.

    3. Apply the power method, multiplying the pagerank vector by the Google matrix
    until the values of the pagerank vector converge.


    We simply substituted “Google matrix” for “hyperlink matrix” of the initial algorithm.
    If we trace this algorithm in our graph with the group of sink nodes, we''ll get:


    | Round | Page 1 | Page 2 | Page 3 | Page 4 | Page 5 | Page 6 |

    | --- | --- | --- | --- | --- | --- | --- |

    | start | 0.17 | 0.17 | 0.17 | 0.17 | 0.17 | 0.17 |

    | 1 | 0.10 | 0.14 | 0.14 | 0.10 | 0.31 | 0.21 |

    | 2 | 0.07 | 0.15 | 0.17 | 0.07 | 0.31 | 0.23 |

    | 3 | 0.05 | 0.14 | 0.18 | 0.05 | 0.32 | 0.26 |

    | 4 | 0.05 | 0.14 | 0.17 | 0.05 | 0.33 | 0.27 |


    It works out fine; we get no zero pageranks anymore.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The power method with the Google matrix will work always. Linear algebra tells
    us that it will always converge to a final set of pagerank values, the sum of
    which will be one, without suffering from dangling nodes or parts of the graph
    draining the pageranks of the rest of the graph. We don''t even need to initialize
    the pageranks to exactly $1 / n$ when we start. Any initial set of values will
    do, long as they sum up to one.


    # PageRank in Practice


    Having established that we have a method to find the pageranks in any graph, the
    question remains whether the results are in the end sensible.


    The pagerank vector, in the way that we have defined, is a special vector in relation
    to the Google matrix. When the power method finishes, the pagerank vector does
    not change any more. Therefore if we multiply the Google matrix by the pagerank
    vector we will get simply the pagerank vector. In linear algebra, this vector
    is called the first eigenvector of the Google matrix. Without going deep into
    the mathematics, the underlying theory supports the notion that this vector has
    some special significance to the matrix.


    Beyond mathematics, the final arbiter of whether Page-Rank is a good way to assign
    importance to web pages is'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'the utility of its results to humans. The Google search engine gives good results,
    meaning that the results are in accordance with what we, the users of the search
    engine, regard as being important. If the pagerank vector was a mathematical curiosity
    that bore no relation to the significance of web pages, we would not be concerned
    with it today.


    An additional advantage of PageRank is that it can be implemented efficiently.
    The Google matrix is huge; we need one row and one column for every single page
    on the web. Yet the Google matrix is derived, as we saw, from the S matrix, which
    in turn is derived from the hyperlink matrix. We do not really need to create
    and store the Google matrix itself; we can create it dynamically with matrix operations
    on the hyperlink matrix. This is convenient. In contrast to the Google matrix,
    which has no zeros anywhere, the hyperlink matrix has lots and lots of zeros.
    The web may have billions of pages, but every single page links to only a small
    number of other web pages. The hyperlink matrix is what we call a sparse matrix:
    one that is mostly full of zeros, with only some nonzero entries, which are scales
    of magnitude fewer than the zero entries. Thus we can store the matrix clever
    techniques instead of requiring a big slab of memory to fill with mostly zeros
    and a few nonzeros, store only the positions where the nonzeros occur. Rather
    than storing'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'the whole hyperlink matrix, we need only store the coordinates of the nonzero
    entries, which will require only a fraction of the storage space. This gives us
    big leverage in the practical implementations of the PageRank algorithm.


    Finally, an important caveat. Although we know that PageRank played a crucial
    role in the success of Google, we do not know how, or even if, PageRank is used
    in Google today. The search engine has been evolving during the years, and the
    changes are not made public. We know that Google uses our past searches to fine-tune
    the results that it presents to our queries. It can tune the results depending
    on the country that we live in. It can also take into account the overall trends
    in the queries that other people make all around the world. All these are part
    of the secret sauce that Google uses to improve its product and retain its position
    in the search engine business against competitors. This, however, does not detract
    from the algorithm’s efficiency in solving the problem of ranking web pages, represented
    as nodes in a graph.¹


    PageRank highlights an additional aspect of algorithms. The success of an algorithm
    does not hinge only on its elegance and efficiency. It also has to do with the
    mapping of the algorithm to a problem. This is a creative act. To solve the problem
    of web search, one has to overcome the issue of the sheer size of the web. But
    once you'
  merge: -1
  img_proc: true
- pgno: 205
  md: conceive of the web as a graph, its size turns into an advantage, not a hindrance.
    It is exactly because there are so many pages, hyperlinked to each other, that
    you may expect that a method that is based on the link structure of the graph
    will in the end work. Finding the way to model a problem is the first step in
    finding the way to solve it with an algorithm.
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Deep learning systems have burst onto the scene in recent years, often making
    headlines in mainstream media. There we see computer systems performing feats
    that were the purview of humans. Even more tantalizing is the fact that these
    systems are frequently presented as having some similarities to the way the human
    mind works—which of course cues to the idea that perhaps the key for artificial
    intelligence may be to mimic the workings of human intelligence.


    Brushing aside the hype, most scientists working on deep learning do not ascribe
    to the view that deep learning systems work like the human mind. The goal is to
    exhibit some useful behavior, which we often associate with intelligence. We do
    not go about copying nature, however; in fact, the architecture of the human brain
    is much too'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'complicated to emulate on a computer. But we take some leaves out of nature’s
    book, simplify them a lot, and try to engineer systems that could, in certain
    fields, do things usually done by biological systems that have evolved over millions
    of years. Moreover, and this concerns us here in this book, deep learning systems
    can be understood in terms of the algorithms they employ. This will shed some
    light on what they do exactly, and how. And it should help us see that underneath
    their accomplishments, the main ideas are not complicated. That should not belittle
    the achievements of the field. We''ll see that deep learning requires an enormous
    amount of human ingenuity in order to come to fruition.


    To understand what deep learning is about, we need to start small, from humble
    beginnings. On these we will build a more and more elaborate picture, until, at
    the end of the chapter, we will be able to make sense of what the “deep” in deep
    learning stands for.


    # Neurons, Real and Artificial


    Our starting point will be the main building block of deep learning systems, which
    does come from biology. The brain is part of the nervous system, and the main
    components of the nervous system are cells *neurons*. Neurons have a particular
    shape; they look different from the globular'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'structures that we usually associate with cells. You can see below one of the
    first images of neurons, drawn in 1899 by the Spanish Santiago Ramón y Cajal,
    a founder of modern neuroscience. 1


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_208_0.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'The two structures that stand out in the middle of the image are two neurons
    of the pigeon brain. As you can see, a neuron consists of a cell body and the
    filaments that extrude from it. These filaments connect a neuron to other neurons
    through *synapses*, embedding the neurons in a network. The neurons are asymmetrical.
    There are many filaments on the one side and one filament on the other side of
    each neuron. We can think of the many filaments on the one side as the neuron''s
    inputs, and the long outgoing filament on the other side as the neuron''s output.
    The neuron takes input in the form of electric signals from its incoming synapses
    and may send a signal to other neurons. The more inputs it receives, the more
    likely it is to output a signal. We say that the neuron then *fires* or is *activated*.


    The human brain is a vast network of neurons, which number about one hundred billion,
    and each one of them is connected on average to thousands of other neurons. We
    do not have the means to build anything like that, but we can build systems out
    of simplified, idealized models of neurons. This is a model of an artificial neuron:


    ```

    $x_1\nx_2\n\vdots\nx_n \n -> y$

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'That is an abstract version of a biological neuron, being just a structure
    with a number of inputs and one output. The output of a biological neuron depends
    on its input; similarly, we want the artificial neuron to be activated depending
    on its input. We are not in the realm of brain biochemistry, but in the world
    of computing, so we need a computational model for our artificial neuron. We assume
    that the signals received and sent by neurons are numbers. Then the artificial
    neuron takes all its inputs, calculates some arithmetic value based on them, and
    produces some result on its output. We do not need any special circuit for implementing
    an artificial neuron. You can think of it as a small program inside a computer
    that takes its inputs and produces an output, much like any other computer program.
    We do not need to build artificial neural networks literally; we can and do simulate
    them.


    Part of the learning process in biological neural networks is the strengthening
    or weakening of the synapses between neurons. The acquisition of new cognitive
    abilities and absorption of knowledge result in some synapses between neurons
    getting stronger, while others get weaker or even drop off completely. Moreover,
    synapses may not only excite a neuron to fire but also inhibit its activation;
    when a signal arrives on that synapse, the neuron should not fire. Babies have
    actually more synapses'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'in their brains than adults. Part of growing up is pruning the neural network
    inside our heads. Perhaps we could think of the infant brain as a block of marble;
    as we go through the years in our lives, the block is chipped through our experiences
    and the things we learn, and a form emerges.


    In an artificial neuron, we approximate the plasticity of synapses, their excitatory
    or inhibitory role, through weights we apply to the inputs. In our model artificial
    neuron, we have inputs, $x_1, x_2, \dots, x_n$. To each one of them we apply a
    weight, $w_1, w_2, \dots, w_n$. Each weight is multiplied by the corresponding
    input. That final input received by a neuron is the sum of the products: $w_1x_1
    + w_2x_2 + \dots + w_nx_n$. To this weighted input we add a bias $b$, which you
    can think of as the propensity the neuron has to fire; the higher the bias, the
    more likely it is to be activated, while a negative bias added to the weighted
    input will actually inhibit the neuron from firing.


    The weights and bias are the parameters of the neuron because they influence their
    behavior. As the output of a biological neuron depends on its inputs, so the output
    of an artificial neuron depends on the input it gets. This happens by feeding
    the input into a special activation function, the result of which is the neuron''s
    output. This is what happens, diagrammatically, using $f(\cdot)$ as a stand-in
    for the activation function:'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_212_0.png)


    The simplest activation function is a step function, giving us a result of 0 or
    1. The neuron fires and outputs 1 if the input to the activation function is greater
    than 0, or stays silent outputting 0 otherwise:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_212_1.png)


    Instead of a bias, it is helpful to think of a threshold. The neuron outputs 1
    if the weighted input'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'exceeds a threshold or outputs 0 otherwise. Indeed, if we write the behavior
    of the neuron as a formula, the first condition is $w_1x_1 + w_2x_2 + \dots +
    w_nx_n + b > 0$ or $w_1x_1 + w_2x_2 + \dots + w_nx_n > -b$. By using $t = -b$,
    we get $w_1x_1 + w_2x_2 + \dots + w_nx_n > t$, where $t$, the opposite of the
    bias, is that the weighted input needs to pass for the neuron to fire.


    In practice we tend to use other, related activation functions instead of the
    step function. On the next page you can see three common ones.


    The one on the top is called *sigmoid* because it has an $S$ shape. Its output
    ranges from 0 to 1. A large positive input results in outputs close to 1; a large
    negative input results in an output close to 0. This approximates a biological
    neuron that fires on large inputs and stays silent otherwise, and is a smooth
    approximation to the step function. The activation function in the middle is called
    *tanh*, short for *hyperbolic tangent* (there are various ways to pronounce it:
    "tan-H," "then," or "thents" with a soft th, as in thanks).^3 It looks like the
    sigmoid function, but it differs in that its output ranges from -1 to +1; a large
    negative input results in a negative output, mimicking an inhibitory signal. The
    function at the bottom is called a *rectifier*; it turns all negative inputs to
    0, otherwise its output is directly proportional to its input. The following table
    shows the output of the three activation functions for different inputs.'
  merge: -1
  img_proc: true
