  md: '# SERIES FOREWORD


    The MIT Press Essential Knowledge series offers accessible, concise, beautifully
    produced pocket-size books on topics of current interest. Written by leading thinkers,
    the books in this series deliver expert overviews of subjects that range from
    the cultural and the historical to the scientific and the technical.


    In today''s era of instant information gratification, we have ready access to
    opinions, rationalizations, and superficial descriptions. Much harder to come
    by is the foundational knowledge that informs a principled understanding of the
    world. Essential Knowledge books fill that need. Synthesizing specialized subject
    matter for nonspecialists and engaging critical topics through fundamentals, each
    of these compact volumes offers readers a point of access to complex ideas.'
  merge: -1
  img_proc: true
