- pgno: 26
  md: '# WHAT IS AN ALGORITHM?


    The Algorithmic Age


    We like putting labels on time periods, perhaps because affixing a tab on time
    allows us to get a grip on its fluidity. We have therefore started speaking of
    the present as the dawning of a new algorithmic age, in which algorithms will
    reign supreme, and will govern larger and larger parts of our lives. It is interesting
    that we are not talking about the computer age or internet age anymore. We somehow
    take them for granted. It is when we add algorithms that we begin intimating that
    perhaps something qualitatively different has started taking place. “Behold the
    Almighty Algorithm, a snippet of computer code coming to stand for a Higher Authority
    in our secular age, a sort of god,” says Christopher Lydon, former New York Times
    journalist and host of the Radio Open Source show. And indeed,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'algorithms are taken to be some form of higher authority when they are used
    to organize political campaigns, follow our traces in the online realm, shadow
    our shopping and target us with advertising, suggest dating partners, or monitor
    our health.¹


    There is an aura of mystery around all that, which perhaps flatters the acolytes
    of algorithms. Being described a “programmer” or “computer scientist” marks you
    as a decent, albeit somewhat technical, character. How much better to be a member
    of the tribe that is about to change almost everything in our lives?


    There is definitely a sense in which algorithms are a sort of god. They are mostly
    held unaccountable, like gods; things happen, not because of human agency, but
    because they were decided by an algorithm, and the algorithm sits beyond the pale
    of responsibility. Machines, running algorithms, can surpass human performance
    in more and more fields so that it appears the area of human superiority is reduced
    day by day; some believe that the day computers will be able to surpass humans
    in every aspect of cognition is not far away.


    But there is also a sense in which algorithms are nothing like gods, although
    we often lose sight of it. An algorithm does not produce its results by an act
    of revelation. We know exactly the rules that it follows and kinds of steps it
    takes. No matter how wonderful the outcome, it can always be traced back to some
    elementary'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'operations. To people who are newcomers to algorithms, it may come as a surprise
    how elementary these may be. That is not to besmirch algorithms; seeing how something
    really works may take out some part of its mystique. At the same time, understanding
    how something works allow us to appreciate the elegance of its design, even if
    it is no longer mysterious.


    The premise of this book is that indeed algorithms are not mysterious. They are
    tools that allow us to do certain things well; they are specific kinds of tools
    whose purpose is to allow us to solve problems. In this way they are cognitive
    tools; as such, they are not the only ones. Numbers and arithmetic are also cognitive
    tools. It took us thousands of years to evolve a number system that children can
    learn in school so that they can perform calculations that would be impossible
    without it. Now we take numeracy for granted, but a few generations back only
    a small minority of humans had any knowledge of it.


    Similarly, knowledge of algorithms should not be the prerogative of a small elite
    minority; as cognitive tools they can be apprehended by all kinds of people, not
    just computer professionals. What is more, they should be understood by more people
    because that will allow us to put algorithms into perspective: to know what they
    do, how they do it, and what we can can realistically expect them to do.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'An essential knowledge of algorithms is what we are after here so that we can
    take a meaningful part in the conversations on the algorithmic age. That is not
    an age that is thrust upon us, but one of our own creation, based on tools that
    we have devised. The study of these tools is the subject of this book. Algorithms
    are beautiful tools, and a glimpse of how they are made and work can enhance our
    way of thinking.


    We''ll start dispelling an irksome notion: that algorithms are about computers.
    This, we''ll see, makes as much sense as saying that numbers are about calculators.


    # A Way to Do Things


    A pen-and-paper puzzle, music, divisibility of numbers, and neutron accelerators
    in particle physics—we''ll see that what they all have in common is the same algorithm,
    applied to such different domains, yet working on the same underlying principles.
    How can this be?


    The word ''algorithm'' itself does not reveal its meaning. It comes from the name
    of Muḥammad Mūsā al-Khwārizzī (ca. 780–ca. 850), a Persian scholar who worked
    on mathematics, astronomy, and geography. Al-Khwārizm’s contributions were many
    and widespread. The term ''algebra'' comes from the Arabic title of his most influential
    work, The Compendium Book on Calculation by'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Completion and Balancing. His second most influential book, On the Calculation
    with Hindu Numerals, was on arithmetic and, translated into Latin, introduced
    the Hindu-Arabic numeral system to the West. Al-Khwārizmi’s name was latinized
    to Algorismus, which came to denote the method of numerical computation with the
    decimal numbers. Algorismus, influenced by the Greek word for “number” (arithithmos,
    as in arithmetic), became algorithm, still denoting decimal arithmetic, before
    acquiring its modern sense in the nineteenth century.


    You could be tempted to think that algorithms are something that we do with computers,
    but this would be wrong. It is wrong because we had algorithms long before we
    had computers. The first-known algorithms date back to ancient Babylon.² It is
    also wrong because algorithms are not problems that have to do with computers.
    Algorithms are about doing something in a specific way, following some kind of
    steps. That is somewhat vague. You may ask, What kind of steps? What specific
    way? We can dismiss all vagueness, and give a precise mathematical definition
    of what an algorithm is and what it does—such a definition do exist—but we don’t
    need to go to such lengths. You may be happy to know that an algorithm is a set
    of steps that you can follow with pen and paper, and you can be assured that this
    seemingly facile description is close to those used by mathematicians and computer
    scientists.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '> You could be tempted to think that algorithms are something that we do with
    computers, but this would be wrong. It is wrong because we had algorithms long
    before we had computers.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'So we can start our approach to algorithms with a problem that we can solve
    by just writing down. Suppose we have two sets of objects and want to spread the
    objects of one of the two sets as evenly as possible among the objects of the
    other set. We will use crosses (×) for the objects of the first set and bullets
    (•) for the objects of the second set. We want to spread out crosses among the
    bullets.


    If the number of crosses divides the total number of objects, that is easy. We
    just partition the crosses among the bullets as if we would do division. For example,
    if we have 12 objects in total, out of which three are crosses and nine are bullets,
    we put one cross, then three bullets, then one cross, three bullets, and finally
    another cross and three bullets:


    × • • × • • • × • •


    But what if the total number of objects, crosses and bullets taken together, cannot
    be divided exactly by the crosses? What can we do if we have five crosses and
    seven bullets?


    We start by putting all crosses followed by all bullets in one row as follows:


    × × × × • • • • •'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Then we take five bullets and place them under the crosses:


    +   × × × × •

    • • • •


    We notice in the pattern that emerges that we have a remainder of two columns
    to the right. We take the two remainder columns, each comprising a single bullet,
    and put them under the first two columns, forming a third row:


    +   × × × ×

    • • • •

    •


    Now we notice that we have a remainder of three columns. We take the rightmost
    two of them and put them under the two leftmost columns:


    +   × × ×

    • •

    •

    × ×

    •


    Now we have only one remainder column, so we stop. We concatenate the columns
    from left to right and get:'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'This is the result. We have distributed the crosses among the bullets. They
    are not as evenly spaced as before, but that is impossible to do because, remember,
    five does not divide evenly into 12. We have managed to avoid heaping all the
    crosses together, however, and have created a pattern that does not look entirely
    haphazard.


    You may wonder if there is anything particular about this pattern; it helps if
    you substitute DUM for the cross and da the bullet. Then the pattern goes DUM-da-d
    a-DUM-da-DUM-da-da-DUM-da-DUM-da and it is really a rhythm. A rhythm is constituted
    by accented parts, also called *onsets*, and unaccented or silent parts. The rhythm
    we found is not a rhythm of our own devising. It is used by the Aka pygmies in
    the Central African Republic; it is the clapping, called Venda, of a South African
    song; it is also a rhythm pattern used in Macedonia, in the Balkans. There is
    more. If we rotate it, so that it starts at the second cross (that is, onset),
    then it becomes:


    That is the Columbia bell pattern, popular in Cuba and West Africa, as well as
    a drumming pattern in Kenya, while it is also used in Macedonia (again). If we
    rotate it to'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'start on the third, fourth, and fifth onset, other popular rhythms around the
    world emerge.


    Is this just a one-off thing? We can try to create a 12-part rhythm out of seven
    onsets and five silent parts—kind of mirroring the five onsets and seven silent
    parts that we had before. If we follow exactly the same procedure, we will arrive
    at:


    × • × • × • × × • •


    This, again, is a rhythm. It is used in the Mpre rhythm of the Ashanti in Ghana,
    and if we start it on the last onset, it is used by the Yoruba in Nigeria as well
    as in Central Africa and Sierra Leone.


    Lest you think we have geographic omissions, if we start with five beats and 11
    silent parts, we arrive at the following:


    × • × • × • × • • • •


    That is the Bossa-Nova rhythm, rotated. The actual Bossa-Nova rhythm starts on
    the third onset, so the exact correspondence is:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_35_0.png)


    × × • • • × • • × •'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'If we try with three beats and four silent parts, we get the pattern:


    × • × • × •


    This rhythm in a seven/four meter is popular, and not just in traditional music.
    Among other tunes, it is the rhythmic pattern of Pink Floyd’s song “Money":


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_36_0.png)


    × • × • × •


    Many more rhythms can be derived in this way by putting crosses and bullets in
    columns, and moving them around in the way we just described. We illustrated the
    procedure by measuring remainder columns a pictorial way of showing what really
    happens. Instead of creating columns, checking the geometry, and moving them around,
    we can do the same thing more formally with simple numerical operations. To see
    what, let’s return to the example of 12 parts and seven onsets. We start by dividing
    12 by 7, which gives us quotient 1 and remainder 5:


    12 = 1×7 + 5'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'This tells us to put the seven onsets in the beginning, creating seven columns
    of onsets, followed by a remainder of the five uncounted parts:


    × × × × × × • • • •


    Now we divide again, but this time we divide the divisor of the previous division,
    7, by the remainder of the previous division, 5. This gives us a quotient of 1
    again while the remainder is 2:


    7 = 1×5 + 2


    This means that we need to take the five rightmost columns and place them under
