    It is a so-called *greedy algorithm*. Greedy algorithms are algorithms- that try
    to solve a problem by finding the best

    solution *at each stage*, not the optimal solution in general.

    Greedy algorithms are useful in many problems when at

    e stage of the solution we have a choice to make and

    our rule is “what looks best now.” Such strategies that

    guide our choices in the evolution of an algorithm are

    called *heuristics*, from the Greek *heuriskein*, which means

    “to find” (a solution, that is).


    With some thought we can realize that in algorithms,

    as in real life, what looks best right now may not really be

    the best strategy. It may pay off to delay gratification; the

    best choice right now may lead us to a trap that we''ll regret

    later on. Imagine you are climbing a mountain. The greedy

    heuristic would be to select the steepest path at each point

    (we assume that your climbing prowess is unparalleled).

    This will not necessary lead you to the top: it may well lead

    you to a plateau, from which the only way is back. The real

    way to the top may lie through gentle slopes.


    The climbing metaphor is frequently used in problem

