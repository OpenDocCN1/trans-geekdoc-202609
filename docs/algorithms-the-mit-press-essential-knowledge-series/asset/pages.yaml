    Having seen growth, let us explore now its opposite. If you have a multiple of
    something, use division to reverse the operation and get the original value. If
    you have the power of something, $a^x$, how do you reverse the operation? The
    reverse of raising to a power is the logarithm.


    Logarithms are sometimes taken as the boundary between mathematics for all and
    mathematics for the initiated; even the name has an aura of incomprehension. If
    logarithms seem somewhat hazy, you need to keep in mind that the logarithm of
    a number is the reverse of raising the number to a power. Just as when we raise
    to a power, we multiply repeatedly, when we take a logarithm, we divide repeatedly.


    The logarithm is the answer to the question, “To which power should I raise a
    number to get the value I want?” The number we are raising is called the *base*
    of the logarithm. So if the question is, “To which power should I raise 10 to
    get 1000?,” the answer is 3 because $10^3=1000$. Of course, we may want to raise
    a different number—that is, use a different base. The notation for logarithms
    is $\log_x a$ and it corresponds to the question, “To which power should I raise
    $a$ to get $x$?” When $a=10$, we just drop the subscript, because logarithms base
