- pgno: 193
  md: 'If we start the iterations of the power method, multiplying the pagerank vector
    with the hyperlink matrix to update the pagerank vector, and then again and again,
    we''ll find out that after four iterations, all pageranks have gone down to zero:


    | Round | Page 1 | Page 2 | Page 3 |

    |---|---|---|--|

    | start | 0.33 | 0.33 | 0.33 |

    | 1 | 0.00 | 0.17 | 0.50 |

    | 2 | 0.00 | 0.00 | 0.17 |

    | 3 | 0.00 | 0.00 | 0.00 |


    That is clearly a problem. We do not expect all pages to have zero importance
    here. After all, page 3 has two backlinks, so somehow we would expect this to
    show on the results, let alone the fact that we also want the total sum of the
    pageranks to be one. Here nothing ended up being of any import at all.


    The cause of the problem is node 3. Although this node has backlinks and would
    thereby gain importance, it has no outgoing links. So in a way it sucks importance
    from the rest of the graph, but does not redistribute it anywhere. It acts as
    a selfish node or black hole: what goes in, does not go out. After a few iterations,
    it has acted as a sink where all pagerank values have gone in and vanished.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Such nodes are called dangling nodes because they hang at the (dead) ends of
    the graph. On the web, nothing prohibits the existence of such pages. Although
    web pages usually have both incoming and outgoing links, a page with no outgoing
    links can appear and would wreak havoc with the power method as we have described
    it.


    To overcome the problem, we work with a metaphor. We imagine that we have a human
    who surfs the web, jumping from page to page. To go from one page to another,
    the surfer normally follows a link. But then the surfer on a dangling node: a
    page with no links to any other page. We don''t want our surfer to remain trapped
    in there so we give the surfer the capability to jump to any other page, anywhere
    on the web. It is as if we are surfing the web from page to page until we reach
    a dead end. When we get there, we don''t give up and stop. We can always type
    another address in our web browser and move to any other web page we want, even
    if no links exist to it from the dangling page. This is what we want our surfer
    to do. When at a loss about where to go, the surfer will pick a page, from the
    web and go there to continue surfing. The surfer becomes a random surfer, equipped
    with a teleportation device that can take the surfer instantly to any place at
    all.


    To take this metaphor back to pagerank, we interpret the hyperlink matrix as giving
    us probabilities that a surfer will follow a link to go to a particular page.
    In our'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'three-nodes example, the first row of the hyperlink matrix tells us that when
    on page 1, the surfer will choose either page 2 or 3 with equal probability. The
    second row tells us that when on page 2, the surfer will always choose to visit
    page 3. Going back to our first example for a moment, if the surfer lands on page
    5, then it is possible to go to page 2, 3, or 4 with a probability of 1 / 3 for
    each of these outcomes.


    A dangling node manifests itself in the presence of a row full of zeros. Then
    there is no probability that the surfer will go anywhere. This is where the random
    surfer kicks in. As we said, that surfer will jump to any page in the graph. That
    means that in effect, we change the hyperlink matrix so that it no longer has
    rows with zeros. As we want the surfer to jump to any web page with equal probability,
    instead of zeros we''ll fill the row with 1 / n, or in our example, 1 / 3. Our
    matrix will become:


    ```

    [ 0 1/2 1/2

    0 0 1

    1/3 1/3 1/3 ]

    ```


    The surfer who lands on page 3 can go to any page in the graph with equal probability.
    The surfer may even stay temporarily on the same page, but that does not matter,
    as the surfer can try again and again, and at some point a different target page
    will be selected at random.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'We call this modified hyperlink matrix, where we change zero rows to rows with
    values equal to $1 / n$, the $S$ matrix. If we run the power method using the
    $S$ matrix, then the evolution of the pageranks will be:


    | Round | Page 1 | Page 2 | Page 3 |

    |---|---|---|--|

    | start | 0.33 | 0.33 | 0.33 |

    | 1 | 0.11 | 0.28 | 0.61 |

    | 2 | 0.20 | 0.26 | 0.54 |

    | 3 | 0.18 | 0.28 | 0.54 |

    | 4 | 0.18 | 0.27 | 0.55 |

    | 5 | 0.18 | 0.27 | 0.54 |


    This time the algorithm converges to nonzero values; no sucking out of importance
    occurs. Also, the results make sense. The highest pagerank is achieved by page
    3, which has two backlinks; then comes page 2, with one backtrack, and then page
    1, which has no backlinks at all.


    # The Google Matrix


    We seem to have solved the problem, but a similar issue raises its head in more
    complex situations. The following graph has no dangling nodes:'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_197_0.png)


    If we run the algorithm, we find that two nodes, pages

    1 and 4, end up with zero pagerank:


    | Round | Page 1 | Page 2 | Page 3 | Page 4 | Page 5 | Page 6 |

    | --- | --- | --- | --- | --- | --- | --- |

    | start | 0.17 | 0.17 | 0.17 | 0.17 | 0.17 | 0.17 |

    | 1 | 0.08 | 0.22 | 0.14 | 0.00 | 0.42 | 0.14 |

    | 2 | 0.00 | 0.25 | 0.25 | 0.00 | 0.29 | 0.21 |

    | 3 | 0.00 | 0.22 | 0.22 | 0.00 | 0.33 | 0.22 |


    What happened is even though there is no dan-\angling node, there is a set of
    nodes that act as a sink for the

    rest of the graph. If you scrutinize the graph, you will see

    that the nodes 2, 3, 5, and 6, taken together as a group,

    have only incoming links. It is possible to go from node 1

    or 4 to this group, but once we are are in, we can only move in-

    side the group. We are not able to go outside. Our random

    surfer will be trapped, not inside a single web page this'
  merge: -1
