    These cards could then be processed by tabating machines, electromechanical devices
    that could read the punched cards and use the data stored in them to make a tally.


    Hollerith''s tabulating machine was used in the 1890 census and brought down the
    time required to complete it to six years—when it came to that the US population
    had grown to approximately 63 million people. Hollerith presented his tabulating
    machines to the Royal Statistical Society, noting that “it must not be considered
    that this system is still in an experimental stage. Over 100,000,000 punched cards
    have been counted several times over these machines, and this has afforded ample
    opportunity to test its capabilities.”¹ Following the census, Hollerith started
    a business, called the Hollerith Electric Tabulating System. This company, via
