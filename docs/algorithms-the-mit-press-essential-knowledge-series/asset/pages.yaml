- pgno: 217
  md: 'The neuron will have only two inputs. It will take each $(x_1,x_2)$ pair and
    calculate an output. If we are using the sigmoid activation function, the output
    will be between 0 and 1. We''ll take the values greater than 0.5 to fall into
    one group and the other values to fall into the other. In this way the neuron
    will act as a classifier, sorting our data into distinct classes. But how does
    it do that? How can the neuron get to the point of being able to classify data?


    # The Learning Process


    At the moment of its creation, our neuron cannot recognize any kind of data; it
    learns to recognize them. The way it learns is by example. The whole process is
    akin to having a student learn something by giving them a large bunch of problems
    on a subject, along with their solutions. We ask the student to study each problem
    and its solution. If they are diligent, we expect that after the student has gone
    through a number of problems, they will have figured out how to get from a problem
    to its solution and will even be able to solve new problems, related to the ones
    they studied, but this time without having recourse to any solutions.


    When we do this, we train the computer to find the solutions; the set of solved
    example problems is called the training data set. This is an instance of supervised
    learning'
  merge: -1
  img_proc: true
- pgno: 218
  md: '> At the moment of its creation, our neuron cannot recognize any kind of data;
    *learns* to recognize them. The way it learns is by example.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'because the solutions guide the computer, like a supervisor, toward finding
    the right answers. Supervised learning is the most common form of machine learning,
    the entire discipline that deals with methods where we train computers to do things.
    Apart from supervised learning, machine learning also encompasses unsupervised
    learning, where we provide the computer with a training data set, but not with
    any accompanying solutions. There are important applications of unsupervised learning,
    like, for example, grouping observations into different clusters (there is no
    a priori solution to what a correct cluster of observations is). In general, though,
    supervised learning is more powerful than unsupervised learning, as we provide
    more information during training. We will only deal with supervised learning here.


    After training, the student often passes some tests to see how well they mastered
    the material. Similarly, in machine learning, after training we give the computer
    anotherother data set that it has not seen before and ask it to solve this test
    data set. Then we evaluate the performance of the machine learning system based
    on how well it manages to solve the problems in the test data set.


    In the classification task, training for supervised learning works by giving the
    neuron network a large number of observations (problems) along with their classes
    (solutions). We expect that the neuron will somehow learn to get from an observation
    to its class. Then if we give'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'it an observation it has not seen before, it should classify it with reasonable
    success.


    The behavior of a neuron for any input is determined by its weights and bias.
    When we start, we set them at random values; the neuron knows nothing, like a
    student. We give the neuron one input in the form of a (x1, x2) pair. The neuron
    will produce an output. As we have random weights and bias, the output will also
    be random. For each of our observations in the training data set, however, we
    do know what the correct answer from the neuron should be. We can then calculate
    how far off the neuron''s output is from the desired one. This is called the loss:
    a measure of how wrong the neuron is for a given input.


    For example, if for an input neuron produces output the value 0.2, while the desired
    output is 1.0, we can calculate the loss by the difference between the two values.
    To avoid having to deal with signs, we usually take as the loss the square of
    the difference; here it would be (1.0–0.2)² = 0.64. If the desired output is 0.0,
    then the loss would be (0.0–0.2)² = 0.04. Be it as it may, having calculated the
    loss, we can now adjust the weights and bias so as to minimize it.


    Going back to the human student, after each failed attempt to solve an exercise,
    we nudge them to perform better. The student figures out that they have to change
    their approach a bit and try with the next example. If they'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'fail, we nudge them again. And again. Until after a lot of examples in the
    training data set, they will start getting things right more and more, and will
    be able to tackle the test data set.


    When a student learns, neuroscience tells us that the wiring inside the brain
    changes; some synapses between neurons get stronger, some get weaker, and some
    are dropped. There is no direct equivalent to an artificial neuron, but something
    similar happens. Recall once more that the behavior of a neuron depends on its
    input, weights, and bias. We have no control over the input; it comes from the
    environment. But we can change the weights and biases. And this is what really
    happens. We update the values of the weights and bias in such a way that the neuron
    will minimize its errors.


    The way that the neuron achieves that is by taking advantage of the nature of
    the task it is called to perform. We want it to take each observation, calculate
    an output corresponding to a class, and adjust its weights and bias to minimize
    its loss. So the neuron is trying to solve a minimization problem. Given an input
    and the output it produces, the problem is, How are we recalibrate the weights
    and bias to minimize the loss?


    This requires a conceptual change of focus. Up to this point we have described
    a neuron as something that takes some inputs and produces an output. Viewed in
    this way, the whole neuron is a big function that takes its inputs,'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'applies the weights, sums the products, adds the bias, passes the result through
    the activation function, and produces the final output. But if we think of it
    another way, our inputs and outputs are actually given (that is our training data
    set), while what we can change are the weights and bias. So we can view the whole
    neuron as a function whose variables are the weights and bias because what we
    can really affect, and for every input we want to change them so to minimize the
    loss.


    If we take as an illustration a simple neuron, with just one weight and no bias,
    then the relationship between the loss and weight might be as in the left part
    of the figure on the next page. The thick curve shows the loss as a function of
    the weight for a given input. The neuron should adjust its weight so that it reaches
    the minimum value of the function. The neuron, for the given input, has currently
    a loss at the indicated point. Unfortunately, the neuron does not know what is
    the ideal weight that would minimize the loss, given that the only thing it does
    know the value of the function at the indicated point; it is not endowed with
    a vantage point of view like we have with the figure at our disposal. The neuron
    may only adjust its weight by a small amount—either increase or decrease it—so
    that it moves closer to the minimum.


    To find out what to do, whether to increase or decrease the weight, the neuron
    can find the tangent line at the current point. Then it can calculate the slope
    of the tangent'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'line; this is the angle with the horizontal axis, which we have also shown
    in the figure. Note that the neuron can do without any special capabilities apart
    from being able to carry out calculations at the local point. The slope of the
    tangent is negative because the angle is clockwise. The slope shows the rate of
    change of a function; therefore a negative slope indicates that by increasing
    the weight, the loss decreases. The neuron thereby discovers that to decrease
    the loss, it has to move to the right. As the slope is negative and the the required
    change in the weight is positive, the neuron finds that it must move the weight
    in a positive direction—opposite to what is indicated by the slope.


    loss


    loss


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_223_0.png)


    Now turn to the figure on the right. This time the neuron is to the right of the
    minimum loss. It takes the tangent again and calculates its slope. The angle and
    therefore'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'slope is positive. A positive slope indicates that by increasing the weight,
    the loss increases. The neuron then knows that in order to minimize the loss,
    it has to decrease the weight. As the slope is positive and the required change
    in the weight is negative, the neuron finds again that it must move in the opposite
    direction than that indicated by the slope.


    In both cases, then, the rule is the same: the neuron calculates the slope and
    updates the weight in the opposite direction from the slope. All this might look
    familiar from calculus. The slope of a function at a point is its derivative.
    To decrease the loss, we need to change the weight by a small amount that is opposite
    to the derivative of the loss.


    Now a neuron does not usually have many, and also has a bias. To find out how
    to adjust each individual weight and the bias, the neuron proceeds like we described
    for the single weight. In mathematical terms, it calculates the so-called partial
    derivative of the loss with respect to each individual weight and bias. For $n$
    weights and a bias, that will be $n+1$ partial derivatives in total. A vector
    containing all the partial derivatives of a function is called its gradient. The
    gradient is the equivalent of the slope when we have multivariable functions;
    it shows the direction along which we have to move to increase the value of the
    function. To decrease the loss, we move in the opposite direction. Thus the neuron
    updates each weight and the bias in the'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'opposite direction than the one indicated by the partial derivatives forming
    its gradient.5

    The calculations are not really performed by drawing tangents and measuring angles.
    There are efficient ways to find the partial derivatives and gradient, but we
    don''t need to get into the details. What is important is that we have a well-defined
    way to adjust the weights and bias to improve the results of the neuron. With
    this at hand, the learning process can be described by the following algorithm:


    For each input and desired output in the training data set,


    +   1. Calculate the output of the neuron and loss.

    2. Update the weights and bias of the neuron to minimize the loss.


    Once we have completed a training by going through all the data in the training
    data set, we say that we have completed an epoch. Usually we do not leave it at
    this. We repeat the whole process for a number of epochs; it is if the student,
    after going through all the study material, started all over again. We expect
    that the next time they''ll do better, as this time they do not start from zero—they
    are not completely clueless—having already learned something from the previous
    epoch.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'The more we repeat the training by adding epochs into our training regime,
    the better we get with the training data. But too much training can be a bad thing.
    A student who studies again and again the same set of problems will probably learn
    to solve them by rote—without really knowing how to solve any other problems that
    they have not encountered before. We see that happening when a seemingly well-prepared
    student fails abysysm in the exams. In machine learning, when we train the computer
    on a training data set, we say that it fits the data. Too much training results
    in what is called overfitting: excellent performance with the training data set,
    and bad performance with the test data set.


    It can be proven that following this algorithm, a neuron can learn to classify
    any data that are linearly separable. If our data have two dimensions (like our
    example), then that means that they should be separable by a straight line. If
    our data have more features, not just $(x_1, x_2)$, the principle is generalized.
    For three dimensions—that is, inputs $(x_1, x_2, x_3)$—the data are linearly separable
    if they can be separated by a simple plane in the three-dimensional space. For
    more dimensions, we call the equivalent of the line and plane a hyperplane.


    At the end of the training, our neuron has learned to separate the data. “Learned”
    means that it has found the right weights and bias, in the way we described: it
    started with random values and then gradually updated them,'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'minimizing the loss. Recall the figure with the two blobs, which the neuron
    learned to separate with a decision boundary. We got from the neuron below at
    at the left, to the neuron at the right, where you can see the final values of
    its parameters.


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_227_0.png)


    That does not always happen. A single neuron, acting alone, can only perform certain
    tasks, like this classification of linearly separable data. To handle more complicated
    tasks, we need to move from a lone artificial neuron to networks of neurons.


    # From Neurons to Neural Networks


    As in biological neural networks, we can build artificial neural networks out
    of interconnected neurons. The input signals of a neuron can be connected to the
    outputs of other neurons, and its output signal can be connected to'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'the inputs of other neurons. In this way we can create neural networks like
    this one:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_228_0.png)


    This artificial neural network has its neurons arranged in layers. This is often
    done in practice: many neural networks that we construct are made of layers of
    neurons, with each layer stacked next to a previous one. We have made all the
    neurons on one layer connect to all the neurons on the next layer, going from
    left to right. This, again, is common, although not necessary. When we have layers
    connected like that, we call them densely connected.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'While the first layer is not connected to any previous one, the output of the
    last layer is similarly not connected to any following layer. The output of the
    last layer is the output of the whole network; it will provide the values that
    we want it to calculate.


    Let us return to a classification task. Our problem now is to pick apart two sets
    of data, shown in the figure on the top of the next page. The data falls into
    concentric circles. It is clear to a human that they belong to two distinct groups.
    It is also clear that they are not linearly separable: no straight line can separate
    the two classes. We want to create a neural network that will be able to tell
    the two groups apart so that it will tell us in which group any future observation
    will belong. This is what you see in the figure at the bottom. For any observation
    on the light background, the neural network will recognize it belongs to one group;
    for any observation on the dark background, it will tell us that it belongs to
    the other group.


    To achieve the results that we see in the lower figure, we build a network layer
    by layer. We put two neurons on the input layer, one for each coordinate of our
    data. We add one layer with four neurons, densely connected to the input layer.
    Because this layer is not connected to the input or output, it is a hidden layer.
    We add another hidden layer with two neurons, densely connected to the first layer.
    We finish the network with an output layer of one neuron, densely connected to
    the last hidden layer. All'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_230_0.png)


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_230_1.png)'
  merge: -1
