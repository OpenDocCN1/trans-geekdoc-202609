    +   1. Although today we can use technology to see neurons in much greater detail,
    Ramón y Cajal was a pioneer, and his drawings rank among the most elegant in the
    history of science. You can find neuron images aplenty on the web, this is enough
    for us, and a simple web search should convince you of the beauty and enduring
    power of Ramón y Cajal''s illustrations. The image is in the public domain, retrieved
