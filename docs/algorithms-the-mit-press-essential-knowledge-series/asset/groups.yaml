    # WHAT IS AN ALGORITHM?


    The Algorithmic Age


    We like putting labels on time periods, perhaps because affixing a tab on time
    allows us to get a grip on its fluidity. We have therefore started speaking of
    the present as the dawning of a new algorithmic age, in which algorithms will
    reign supreme, and will govern larger and larger parts of our lives. It is interesting
    that we are not talking about the computer age or internet age anymore. We somehow
    take them for granted. It is when we add algorithms that we begin intimating that
    perhaps something qualitatively different has started taking place. “Behold the
    Almighty Algorithm, a snippet of computer code coming to stand for a Higher Authority
    in our secular age, a sort of god,” says Christopher Lydon, former New York Times
    journalist and host of the Radio Open Source show. And indeed,'
  md: '

    A familiarity with algorithms introduces us to a new way of algorithmic thinking:
    a way of reasoning to solve problems in a practical way so that efficient implementations
    of algorithms as programs can run fast in computers.


    in what may happen but rather the how this can happen. To do that, we''ll present
    real algorithms and show not only what they do but also how they actually function.
    Instead of hand waving, we''ll provide detailed explanations.


    To the question, “What are algorithms?” the answer is surprisingly simple. They
    are particular ways to solve our problems. These ways to solve our problems can
    be described in easy steps so that computers can execute them with amazing speed
    and efficiency. Yet there is nothing magical about these solutions. The fact that
    they comprise simple elementary steps means that there is no reason why they should
    be beyond the grasp of most people.


    Indeed, the book does not assume knowledge of material beyond that commonly taught
    in high schools. Some mathematics does appear in the following pages because you
    cannot talk seriously about algorithms without some notation. Any concepts that
    are commonplace in algorithms but are not that common outside computer science
    are explained in the text.


    The late physicist Stephen Hawking wrote in the introduction of his best-selling
    book A Brief History of Time, published in 1988, “Someone told me that each equation
    I included in the book would halve the sales.” This sounds pretty ominous for
    the present book because mathematics does occur more than once. Yet I decided
    to press ahead, for two reasons. First, while the level of mathematics required
    for Hawking’s physics is at the university level or beyond, the mathematics presented
    here is much more accessible. Second, as the purpose of this book is to show not
    just what algorithms are for but how they really work too, the reader should get
    to share some of the vocabulary we use when we discuss algorithms. And this vocabulary
    does include some mathematics. The notation is not the prerogative of the technical
    clergy, and familiarity with it will help dispel any mystique surrounding the
    subject; in the end, we’ll see that it mostly comes down to being able to talk
    about things in a precise quantitative way.


    It is impossible to cover the whole subject of algorithms with a book like this,
    but it is possible to provide an overview and introduce a reader to algorithmic
    thinking. The first chapter lays the ground by introducing what algorithms are
    and how we can gauge their efficiency. We can say at the outset that an algorithm
    is a finite sequence of steps that we can perform with a pen and paper, and this
    plain definition would not be far from the truth. Chapter 1 starts from there,
    while also exploring the relationship between algorithms and mathematics. A key
    difference between the two is practicality; in algorithms, we are interested in
    practical ways to solve our problems. This means that we need to be able to measure
    how practical and efficient our algorithms are. We’ll see that these questions
    can be carefully framed through the notion of computational complexity; this will
    inform the discussion of algorithms in the rest of the book.


    The next three chapters look at three of the most essential application areas
    of algorithms. Chapter 2 covers algorithms that deal with the solution of problems
    relating to networks, called graphs, of things. These problems may include finding
    your way in a road network or sequence of links connecting you to somebody on
    a social network. They also include problems in other areas that are not immediately
    obvious in terms of their relationship: DNA sequencing and scheduling tournaments;
    this will illustrate that distinct problems can be solved efficiently using the
    same tools.


    Chapter 3 and chapter 4 explore how to search for things and put things in order.
    These may seem prosaic, yet they are among the most important applications of
    computers. Computers spend a lot of time sorting and searching, but we are largely
    oblivious to this fact exactly because we are an integral, invisible part of most
    applications. Sorting and searching also offer us a glimpse of an important facet
    of algorithms. For many problems, we know of more than one algorithm to solve
    them. We choose among the available algorithms based on their particular characteristics;
    some algorithms are more suitable for certain problem instances than others. It
    is therefore instructive to see how different algorithms, with different characteristics,
    go about solving same problem.


    The following two chapters present important applications of algorithms on a large
    scale. Chapter 5 picks up graphs again to explain the PageRank algorithm, which
    can be used to rank web pages in order of significance. PageRank was the algorithm
    used by Google when it was founded. The success of the algorithm at ranking web
    pages in search results played a critical role in the phenomenal success of Google
    as a company. Fortunately, it is not difficult to grasp how PageRank works. It
    will give us the opportunity to see how an algorithm can solve a problem that
    on first impression, does not seem amenable to a computer solution: How do we
    judge what is important?


    Chapter 6 introduces one of the most active areas in computer science: neural
    networks and deep learning. Successful applications of neural networks are reported
    in popular media. Stories pique our interest by describing systems that perform
    tasks such as image analysis, automatic translation, or medical diagnosis. We''ll
    start out simple, from individual neurons, building up bigger and bigger neural
    networks that are able to perform more and more complex tasks. We''ll see that
    they all work on some fundamental principles. Their efficacy rises from the interconnection
    of many components and the application of an algorithm lets lets networks learn.


    After sketching what algorithms can do, the epilogue explores the limits of computing.
    We know that computers have performed amazing feats and expect so much from the
    future, yet there are things they cannot do? The discussion of the limits of computing
    will allow me to offer a more precise explanation of the nature of algorithms.
    We said that we could describe it as a finite sequence of steps that can be performed
    with a pen and paper, but what kind of steps could these be? And how close is
    the pen-and-paper analogy with what algorithms really are?

