  md: '

    and PageRank, see Langville and Meyer 2006; Berry and Browne 2005. Apart from
    PageRank, another important algorithm for ranking is Hypertext Induced Topic Search,
    or HITS (Kleinberg 1998, 1999), developed before Page-Rank. Similar ideas have
    been developed in other fields (sociometry, the quantitative study of social relationships,
    and econometrics, the quantitative study of economic principles) much earlier,
    going back to the 1940s (Franceschet 2011).


    ## Chapter 6


    1. Although today we can use technology to see neurons in greater detail, Ramón
    Cajal was a pioneer, and his drawings rank among the most elegant in the history
    of science. You can find plenty images on the web, this is enough for us, and
    a simple search should convince you of the beauty and enduring power of Ramón
    Cajal. The image is in the public domain, retrieved from https://commons.wikimedia.org/wiki/File:Purkinje.jpg.


    2. To be accurate, sigmoid would refer to the Greek letter sigma, which yet its
    appearance is closer to the Latin S.


    3. The tangent of an angle is defined as the ratio of the opposite side to the
    adjacent side in a straight triangle, or equivalently, by the sine of the angle
    divided by the cosine of the angle in the unit circle. The hyperbolic tangent
    is defined as the ratio


    4. Warren McCulloch and Pitts (1943) proposed the first artificial neuron. Frank
    Rosenblatt (1957) described the Perceptron. If they are more than half a century
    old, neural networks have become all range recently. Marvin Minsky and Seymour
    (1969) struck a major blow to Perceptrons in their famous book of the same name,
    which showed that a single Perceptron had fundamental limitations. This, coupled
    with the hardware limitations of the time, ushered in so-called neural computation,
    which lasted until the 1980s, when researchers found how to build and train neural
    networks. Interest in the field then revived, but still a lot more work was required
    to advance neural networks that have been seen in the few years.


    5. One of the challenges in neural networks is that the notation can be complicated
    and hence the material seems approachable to the initiated. In fact, it is not
    once you know what it is about derivatives; the derivative of a function f(x)
    with respect to x is written df/dx. The partial derivative of a function of many
    variables, say x1, x2, ..., xn, is written ∂f/∂xi. The gradient is written Vf
    = (∂f/∂xn).


    6. The backpropagation algorithm onto the scene in the mid-1980s (Rumelhart and
    Williams 1986), although various derivations of it had appeared in the 1960s.


    7. This image is from the Fashion-MNIST data (Xiao, Rasul, and Vollgraf 2017),
    which was developed as a benchmark set for machine learning. This section was
    inspired by the basic classification tutorial at https://www.tensorflow.org/tutorials/basic_classification.


    8. For a description of the first system to beat the human champion, see Silver
    et al. 2016. For an improved system that does not require human knowledge in the
    form of previously played games, see Silver et al. 2017.


    9. The literature on deep learning is a comprehensive introduction to the topic,
    see Geoffrey, Bengio, and Courville 2018. For a shorter and more approachable
    treatment, a concise overview, see LeCun, Bengio, and Hinton 2015. For machine
    learning, see Alpaydin 2016. For a survey of automated neural architecture methods,
    see Elksen, Hendrik Metzen, and Hutter 2018.


    ## Epilogue


    1. Besides Turing, other names on the short list were Mary Anning, Paul Dirac,
    Rosalind Franklin, William Herschel and Caroline Herschel, Dorothy Hodgkin, Ada
    Lovelace and Charles Babbage, Stephen Hawking, James Clerk Maxwell, Srinivasa
    Ramanujan, Ernest Rutherford, and Frederick Sanger. Babbage, Lovelace, and Turing
    were all computer pioneers. Babbage (1791–1871) invented the first mechanical
    computer and developed the essential ideas of modern computers. Lovelace (1815–1852),
    the daughter of Lord Byron, worked with Babbage, recognized the potential of invention,
    and was the first to develop an algorithm that would run on such a machine. She
    is now considered to have the first computer programmer. For the £50 design, see
    the official announcement at https://www.bankofengland.couk/news/2019/july/50-pound-banknote-character-announcement.


    2. See the excellent biography by Andrew Hodges (1983). Turing''s role in breaking
    the German Enigma cryptographic machine was dramatized in the 2014 film The Imitation
    Game.


    3. For a description of the machine, see Turing 1937, 1938.


    4. The Turing machine example is adapted from John Hopcroft, Rajeev Motwani, and
    Jeffrey Ullman (2001, chapter 8). The figure is based on Sebastian-Sardina’s example
    at http://www.example.net/tikz/examples/turing-machine-2/.


    5. For more on the Church-Turing thesis, see Lewis and Papadimitriou 1998, chapter
    5. For a discussion of the history of the Church-Turing thesis and various variants,
    see Copeland and Shagrir 2019.


