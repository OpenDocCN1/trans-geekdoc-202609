- raw:
  - '[PAGE 173]


    There are many people like you, writing their own online articles on the effects
    of climate change in their countries or regions. Each one of them may also want
    to link to what they believe is an authoritative source on the topic. Hyperlinks
    will emanate from these online articles to point to relevant sources of information.


    The reason why NASA might come up on top in a search for climate change is that
    lots of authors, each one writing their own article, decided to place a hyperlink
    to the NASA web page on climate change. Authors made their own choices individually,
    but it is likely that many chose the same page, such as, for instance, NASA''s
    page. It therefore makes sense that this page on climate change should be judged
    important, relative to other web pages.


    The whole system acts as a kind of democracy. Authors of web pages link their
    pages to other pages. The more links a web page accrues, the more authors judged
    it important enough to link to it from their own page, and thus the more important
    it becomes overall.


    There is, though, a conceptual difference from democracy as we usually practice
    it. Not all of these articles that are written are equal. Some of them appear
    on more prestigious websites than others. An article on a blog that is read by
    a handful of people carries less weight than an article in an online publication
    that rakes in hundreds of thousands of readers. This indicates that we should
    not consider just the number of links pointing to a web page'
  - '[PAGE 174]


    The whole system acts as a kind of democracy. Authors of web pages link their
    pages to other pages. The more links that a web page accrues, . . . the more important
    it becomes overall.'
  - '[PAGE 175]


    in order to gauge its importance. Who is pointing to a web page is also significant,
    not just how many. It is reasonable to expect that a link from a prestigious web
    page carries more weight than a link from an obscure site. Although you should
    not judge a book by its cover, an endorsement by a prominent author is more important
    than a good review by an unknown reviewer. Every link from one page to another
    page acts as an endorsement from the first page to the second, and the weight
    of the endorsement depends on the status of the endorser. At the same time, if
    a page links to many other pages, its endorsement should be divided, among the
    pages that receive it.


    The set of pages linked by hyperlinks forms an enormous graph, containing billions
    of pages and many more links between them. Every web page is a node in the graph.
    Every link from one page to another is a directed edge in this huge graph. The
    fundamental insight behind Page-Rank is that following the reasoning we have just
    outlined, we can use the structure of the web graph to give us the importance
    of each web page. To be more precise, we can get the importance of each page through
    a number. This number, which we will call its pagerank, will measure the significance
    of a web page related to the other web pages. The more important a web page is,
    the higher its pagerank will be. The PageRank algorithm follows the ramification
    of this insight on a humongous scale, on the graph representing the whole web.'
  - '[PAGE 176]


    # The Basic Principles


    When we are on a web page, the links on that page point to other pages that are
    relevant to the page we are currently browsing. The very existence of the link
    indicates that the web page at the end of the link is important—otherwise the
    author of the web page would not link to it in the first place. Consider the example
    graph below, representing a small set of web pages that link to each other:


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_176_0.png)


    In such a graph, we call the links that point to a web page *backlinks*; by extension,
    we will also call the pages that point to a web page *backlinks*. In this way,
    the backlinks of web page 3 are the edges pointing to it, its incoming edges,
    as well as the nodes from which they emanate: web pages 2, 4, and 5. As in this
    chapter we will be concerned with'
  - "[PAGE 177]\n\ngraphs that are made up of web pages, we will be using the terms\
    \ “node” and “page” interchangeably.\n\nWe will build an algorithm for finding\
    \ the importance of each web page based on two basic principles:\n\n+   1. The\
    \ importance of a web page depends on the significance of the web pages that link\
    \ to it—that is, on the importance of its backlinks.\n\n+   2. A web page divides\
    \ its importance evenly over the web pages to which it links.\n\nSay we want to\
    \ find the importance of page 3. We saw its backlinks are 2, 4, and 5. We take\
    \ one of them in turn and assume we know their own significance. Page 2 divides\
    \ its importance over pages 3 and 5, and therefore will give half its importance\
    \ to page 3. Page 4 also divides its importance over two pages, 3 and 1, and hence\
    \ will give half its significance to page 3. Finally, page 5 divides its importance\
    \ over pages 2, 3, and 4, and will give a third of its importance to page 3. To\
    \ save typing, let us denote by $r(P)$ the importance of page $i$; $r$ will stand\
    \ for rank. Then the importance of page 3 will be:\n\n```\n$r(P_3) = \frac{r(P_2)}{2}\
    \ + \frac{r(P_4)}{2} + \frac{r(P_5)}{3}$\n```"
  - '[PAGE 178]


    In general, if we want to find out the importance of a certain web page and we
    know the importance of each backlink, it is easy to find what we are looking for:
    divide the importance of each backlink page by the number of web pages it links
    to and add the result to the contributions of the other backlinks of the page.


    You may think of the calculation of importance as a voting contest between web
    pages. Each voting page has some significance, which it can use as a vote for
    those web pages that it deems important. If it considers only one web page as
    important, it just gives its vote to that web page. But if it considers more than
