    ## From Graphs to Algorithms


    The definition of a graph is wide so that it can encompass everything that can
    be represented as things connected to other things. The graph may have some relevance
    to the topology of a place, but the nodes and links may have nothing to do with
    points in space.


    A social network is an example of such a graph. In a social network, nodes are
    social actors (these may be individuals or organizations), and the links represent
    interactions between them. The social actors may be real-world actors, and the
    links may be their collaborations in films. The social actors can be us, and the
    links may be our connections to other people in a social network application.
    We can then use social networks to find communities of people, starting from the
    premise that communities are formed by people who interact with each other. There
    exist algorithms that are able to find efficiently communities in graphs with
    millions of nodes.


    The edges in the Königsberg graph are not directed, meaning that we can traverse
    both ways; for example, we can go from A to B and B to A. The same goes for social
    networks, when the connections are reciprocal. That is not always necessary. Depending
    on our applications, edges in a graph may be directed. When this happens, we draw
    the edges with arrows at their ends. Directed graphs are called digraphs for short.
    You can see a digraph below. Note that this is not a multigraph; the edge from
    A to B is not the same as the edge from B to A.


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_76_0.png)


    The World Wide Web is an example of a (huge) directed graph. We can represent
    the web with nodes standing in for web pages and edges standing in for the hyperlinks.
    This graph is a directed graph, because a page may link to another, but when it
    is possible to start from a node in a graph and come back to the node we say that
    the graph has a cycle. Not all graphs have cycles. The Königsberg graph does not
    have Eulerian circuit. A famous cyclic graph (actually a multigraph) in the history
    of science is August Kekulé’s model of the molecular structure of benzene.


    A graph without a cycle is called an acyclic graph. Directed acyclic graphs form
    an important class of graphs. We usually call them dags. Dags have many uses;
    for example, we use them to represent priorities (tasks are nodes, and priorities
    are links), and other similar arrangements. We''ll leave aside acyclic graphs
    now and turn our attention to cyclic graphs, which will provide us with a first
    window on algorithms.


    ## Paths and DNA


    One of the most important scientific developments of the last decades has been
    the decoding of the human genome. Thanks to the techniques that were developed
    in that effort, we can now investigate genetic diseases, detect mutations, and
    study genomes of extinct species, among other applications.


    Genomes are encoded in the DNA, a large organic molecule that is composed of a
    double helix. The double helix is made of four bases: cytosine (C), guanine (G),
    adenine (A), and thymine (T). Each part of the double helix is constructed from
    a series of bases, like ACCGTATAG. The other part of the double helix is constructed
    from bases that are connected with their corresponding bases in the first part,
    according to the rules A-T and C-G. So if one part of the helix is ACCGTATAG,
    the other part will be TGGCATATC.


    In order to find the composition of an unknown DNA piece, we can work as follows.
    We create many copies of the chain and break them up into little fragments—for
    instance, fragments containing three bases. Using specialized instruments, we
    can identify each small fragments easily. In this way we end up with a set of
    known fragments. We are then left with the problem of assembling the fragments
    into a DNA sequence, whose composition we will then know.


    Suppose that we have the following fragments, or polymers as they are known: GTG,
    TGG, ATG, GGC, GCG, CGT, GCA, TGC, CAA, and AAT. Each one of them has a length
    of three; to find the DNA sequence from they were broken up, we create a graph.
    In that graph, the vertices are polymers of length two that are derived from the
    polymers of length three, taking for each polymer of length three the first two
    and last two polymers. So from GTG we will get GT and TG, and from TGG we will
    get TG and GG. In the graph, we add one edge for every one of the initial polymers
    or length three that was used to derive the two vertices. We give the name of
    the polymer to that edge. From ATG we get vertices AT and TG and the edge ATG.
    You can see the graph that results from our example:


