    # 图（GRAPHS）


    在18世纪，柯尼斯堡的市民在散步。柯尼斯堡坐落在普雷格尔河畔。柯尼斯堡有两个岛屿。在二战后，它属于苏联并更名为格勒宁格。虽然现在的格勒宁格是一个俄罗斯的飞地，位于波兰和立陶宛之间。1736年3月9日，来自但泽锡（但泽锡现在被称为格但斯克，属于波兰）给欧拉的信件似乎是市长为了鼓励数学发展的。欧拉当时住在俄罗斯圣彼得堡。他研究了这个问题，并在1735年8月26日向圣彼得堡科学院提交了解决方案。来年他用拉丁语写了一篇论文描述了他的解决方案。答案是否定的：无法只通过一次桥来游览城市。


    这将是一个有趣的历史片段，但通过解决这个问题，欧拉开创了一个全新的数学分支：图论。


    在进入图论之前，让我们看看欧拉是如何解决问题的。首先，他将问题抽象到了最核心的部分。不需要详细的柯尼斯堡地图来表示这个问题。欧拉画了以下图：


    （此处为图）


    他用字母 A 和 D 代表岛屿，用 C 代表陆地的两个岸边。下一步是进一步抽象图表，远离物理几何形状，关注桥梁、岛屿和陆地之间的连接，因为这才是问题的关键：


    （此处为图）


    我们将陆地画成圆，桥梁画成连接圆的线。问题就可以重新表述为：如果你有一支笔，是否可以从任何一个圆开始，放下笔，在不抬笔的情况下沿着线条移动，使得每条线通过一次？欧拉的解决方案如下：每当你进入一个陆地时，必须离开它，除非这是起点或终点。为了这一点，除了起点和终点外，每个陆地必须有偶数条桥。

