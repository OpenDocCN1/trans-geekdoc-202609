    sort）。作为对第一个机器支持的排序应用的致敬，花些时间研究基数排序的工作原理是值得的。因为它也很有趣，因为待排序的项目之间并没有真的相互比较。至少不完全是，正如我们将看到的。此外，基数排序不仅具有历史意义，它的性能也非常出色。一个经典且实用的算法有什么不好的呢？⁸


    查看基数排序简单的方法是再次使用扑牌。假设我们有一副洗好的全牌并想对其进行排序。一种方法是根据每个等级值形成 13 堆。我们遍历牌组，拿取每张牌并将其放入相应的堆中。我们将得到
    13 堆，每堆四张牌：一堆全是王牌，另一一堆全是二，以此类推。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_142_0.png)


