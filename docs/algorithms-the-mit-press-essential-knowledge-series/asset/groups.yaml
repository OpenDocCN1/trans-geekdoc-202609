    algorithms are taken to be some form of higher authority when they are used to
    organize political campaigns, follow our traces in the online realm, shadow our
    shopping and target us with advertising, suggest dating partners, or monitor our
    health.¹


    There is an aura of mystery around all that, which perhaps flatters the acolytes
    of algorithms. Being described a “programmer” or “computer scientist” marks you
    as a decent, albeit somewhat technical, character. How much better to be a member
    of the tribe that is about to change almost everything in our lives?


    There is definitely a sense in which algorithms are a sort of god. They are mostly
    held unaccountable, like gods; things happen, not because of human agency, but
    because they were decided by an algorithm, and the algorithm sits beyond the pale
    of responsibility. Machines, running algorithms, can surpass human performance
    in more and more fields so that it appears the area of human superiority is reduced
    day by day; some believe that the day computers will be able to surpass humans
    in every aspect of cognition is not far away.


    But there is also a sense in which algorithms are nothing like gods, although
    we often lose sight of it. An algorithm does not produce its results by an act
    of revelation. We know exactly the rules that it follows and kinds of steps it
    takes. No matter how wonderful the outcome, it can always be traced back to some
    elementary'
  - '[PAGE 28]


    operations. To people who are newcomers to algorithms, it may come as a surprise
    how elementary these may be. That is not to besmirch algorithms; seeing how something
    really works may take out some part of its mystique. At the same time, understanding
    how something works allow us to appreciate the elegance of its design, even if
    it is no longer mysterious.


    The premise of this book is that indeed algorithms are not mysterious. They are
    tools that allow us to do certain things well; they are specific kinds of tools
    whose purpose is to allow us to solve problems. In this way they are cognitive
    tools; as such, they are not the only ones. Numbers and arithmetic are also cognitive
    tools. It took us thousands of years to evolve a number system that children can
    learn in school so that they can perform calculations that would be impossible
    without it. Now we take numeracy for granted, but a few generations back only
    a small minority of humans had any knowledge of it.


    Similarly, knowledge of algorithms should not be the prerogative of a small elite
    minority; as cognitive tools they can be apprehended by all kinds of people, not
    just computer professionals. What is more, they should be understood by more people
    because that will allow us to put algorithms into perspective: to know what they
    do, how they do it, and what we can can realistically expect them to do.'
  - '[PAGE 29]


    An essential knowledge of algorithms is what we are after here so that we can
    take a meaningful part in the conversations on the algorithmic age. That is not
    an age that is thrust upon us, but one of our own creation, based on tools that
    we have devised. The study of these tools is the subject of this book. Algorithms
    are beautiful tools, and a glimpse of how they are made and work can enhance our
    way of thinking.


    We''ll start dispelling an irksome notion: that algorithms are about computers.
    This, we''ll see, makes as much sense as saying that numbers are about calculators.


    # A Way to Do Things


    A pen-and-paper puzzle, music, divisibility of numbers, and neutron accelerators
    in particle physics—we''ll see that what they all have in common is the same algorithm,
    applied to such different domains, yet working on the same underlying principles.
    How can this be?


    The word ''algorithm'' itself does not reveal its meaning. It comes from the name
    of Muḥammad Mūsā al-Khwārizzī (ca. 780–ca. 850), a Persian scholar who worked
    on mathematics, astronomy, and geography. Al-Khwārizm’s contributions were many
    and widespread. The term ''algebra'' comes from the Arabic title of his most influential
    work, The Compendium Book on Calculation by'
  - '[PAGE 30]


    Completion and Balancing. His second most influential book, On the Calculation
    with Hindu Numerals, was on arithmetic and, translated into Latin, introduced
    the Hindu-Arabic numeral system to the West. Al-Khwārizmi’s name was latinized
    to Algorismus, which came to denote the method of numerical computation with the
    decimal numbers. Algorismus, influenced by the Greek word for “number” (arithithmos,
    as in arithmetic), became algorithm, still denoting decimal arithmetic, before
    acquiring its modern sense in the nineteenth century.


    You could be tempted to think that algorithms are something that we do with computers,
    but this would be wrong. It is wrong because we had algorithms long before we
    had computers. The first-known algorithms date back to ancient Babylon.² It is
    also wrong because algorithms are not problems that have to do with computers.
    Algorithms are about doing something in a specific way, following some kind of
    steps. That is somewhat vague. You may ask, What kind of steps? What specific
    way? We can dismiss all vagueness, and give a precise mathematical definition
    of what an algorithm is and what it does—such a definition do exist—but we don’t
    need to go to such lengths. You may be happy to know that an algorithm is a set
    of steps that you can follow with pen and paper, and you can be assured that this
    seemingly facile description is close to those used by mathematicians and computer
    scientists.'
  - '[PAGE 31]


    > You could be tempted to think that algorithms are something that we do with
