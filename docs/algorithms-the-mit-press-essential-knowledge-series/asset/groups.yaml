    事实上，如果在旅途中的某一点到达 B 地，我们一定跨过了一座桥才到达那里。我们将跨过第二座桥离开它。我们必须在之后的某个时间再次跨过第三座桥，因为我们被要求跨越所有的桥。但那时我们就被困在
    B 地了，因为没有第四座桥，而我们不能第二次跨越我们已经跨过的桥。C 和 D 也是如此，它们也有三座桥。对于作为中间点的 A，论证也是完全相同的，因为它有五座桥；在跨过
    A 的所有五座桥后，我们将无法从另一个第六座桥离开它，因为那座桥并不存在。


    我们画的图由圆圈和连接它们的线组成。用专业的术语来说，我们创建了一个由节点（或顶点）以及连接它们之间的边（或链路）组成的结构。由节点和边集合组成的结构称为图（graph）；欧拉是第一个将图识别为结构并探索其属性的人。在当今的语言中，柯尼尼斯堡桥问题涉及的是路径：图中的路径是连接一系列节点的边的序列。那么，柯尼尼斯堡桥问题就是寻找欧拉路径或欧拉游走的问题：这是一条穿过图的轨迹，其中每条边恰好被访问一次。起始和结束于同一个节点的路径被称为巡回（tour）或回路（circuit）。如果我们还加上一个限制（原问题中并不包含），即希望欧拉路径起始并结束于同一点，那么我们就有了欧拉巡回或欧拉回路。


    图的应用是如此丰富，以至于它们填满了整整本书。任何可以由由与其他节点连接的节点进行建模的东西都可以表示为图。一旦我们这样做，就可以对它提出各种有趣的问题；在这里，我们将有机会一览一斑。


    在此之前，这里有一个小细节，为了取悦思想最严谨的读者。我们提到图是一个由顶点集合和边集合组成的结构。在数学中，集合不包含两个相同的元素。然而，在我们对柯尼尼斯堡的表示中，同一条边出现了多次；例如，A
    和 B 之间有两条边。一条边是通过它的起点和终点来区分的，因此 A 和 B 之间的两条边实际上是同一条边的两个实例。那么，边的集合并不是真正的集合；它是一个多集（multiset）——也就是说一个允许元素出现多个实例的集合。同样，柯尼尼斯堡图并不是真正的图，而是一个多重图（multigraph）。


    ## 从图到算法


    图的定义非常广泛，以至于它可以包含所有可以表示为与其他事物相连的东西。图可能与某个地方的拓扑结构有关，但节点和链路可能与空间中的点毫无关系。


    社交网络就是这种图的一个例子。在社交网络中，节点是社会参与者（这些可能是个人或组织），链路代表它们之间的互动。社会参与者可以是现实世界中的人物，链路则可能是他们在电影中的合作。社会参与者可以是我们，链路可能是我们在社交网络应用中与其他人的连接。我们就可以利用社交网络来发现人类社区，其前提是社区是由相互互动的人组成的。存在某些算法能够高效地在数百万个节点的图中发现社区。


    柯尼尼斯堡图中的边不是有向的，这意味着我们可以双向通行；例如，我们可以从 A 去到 B，也可以从 B 去到 A。社交网络也是如此，当连接是互惠的时。但这并不总是必要的。根据我们的应用需求，图中的边可以是有向的。当这种情况发生时，我们会在边的末端画上箭头。有向图简称为
    digraphs。你可以在下图中看到一个有向图。请注意，这不是一个多重图；从 A 到 B 的边与从 B 到 A 的边不同。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_76_0.png)


    万维网是一个（巨大的）有向图的例子。我们可以用代表网页的节点和代表超链接的边来表示网络。这个图是有向图，因为一个页面可能会链接到另一个页面，但当可能从图中的一个节点开始并回到该节点时，我们说该图具有循环。并不是所有的图都有循环。柯尼尼斯堡图没有欧拉回路。科学史上一个著名的循环图（实际上是一个多重图）是奥古斯特·凯库勒的苯分子结构模型。


    没有循环的图被称为无环图（acyclic graph）。有向无环图构成了一类重要的图。我们通常称它们为 dag。dag 有许多用途；例如，我们用它们来表示优先级（任务是节点，优先级是链路），以及类似的安排。我们现在先搁开无环图，将转向循环图，它为我们提供了开启算法的第一扇窗。


    ## 路径与 DNA


    过去几十年最重要的科学进展之一是人类基因组的解码。得益于这项工作开发的技术，我们现在可以研究遗传疾病、检测突变并研究灭绝物种的基因组等。


    基因组编码在 DNA 中，这是一种由双螺旋组成的大分子。双螺旋由四种碱基组成：胞嘧啶（C）、鸟嘌呤（G）、腺嘌呤（A）和胸嘧啶（T）。双螺旋的每一部分由一组碱基组成，例如
    ACCGTAG。双螺旋的另一部分由与第一部分对应的碱基连接而成，根据 A-T 和 C-G 规则。所以，如果一部分是 ACCGTAG，那么另一部分将是 TGGCATC。


    为了找到一个未知 DNA 片段的组成部分，我们可以如下操作：创建链的许多拷贝并将其分解成小片段——例如包含三个碱基的片段。使用专业仪器，我们可以轻松地识别每个小片段。通过这种方式，我们得到了已知片段集。剩下的问题是将这些片段组装
    DNA 序列，然后我们就能知道它的组成部分。


    假设我们有以下片段（或聚合物）：GTG, TGG, ATG, GGC, GCG, CGT, GCA, TGC, CAA 和 AAT。它们的长度都是三；为了找到它们被分解前的
    DNA 序列，我们创建一个图。在图中，顶点是从长度三的聚合物导出的长度二聚合物，取每个长度三的聚合物的前两个和最后两个聚合物。所以从 GTG 我们得到 GT
    和 TG，从 TGG 我们得到 TG 和 GG。在图中，为每一个推导出两个顶点的初始长度三聚合物添加一条边。我们将该聚合物命名为那条边。从 ATG 我们得到顶点
    AT 和 TG 以及边 ATG。你可以看到由示例产生的图：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_79_0.png)

    '
