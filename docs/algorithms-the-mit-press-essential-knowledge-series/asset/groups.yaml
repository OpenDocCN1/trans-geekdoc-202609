    implementing an algorithm runs on a particular computer. Our computer may be faster
    or slower than the one that the algorithm was measured on, and after some years,
    measurements of algorithms on outdated machines will have only historical interest.
    We need a way to measure how well an algorithm performs independent of computer
    hardware.


