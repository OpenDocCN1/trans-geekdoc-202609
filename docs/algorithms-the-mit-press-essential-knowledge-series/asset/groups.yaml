    $n^3$ 将我们从一百万增加到一万亿，但与 $2^{100}$ 或 $100!$ 相比这微不足道。我们在 $n^k$ 行之后留了一个空白，将实用算法与不实用算法隔开。两者之间的界限是多项式算法，正如我们所看到的，它们具有实用价值。高复杂度算法通常没有实用价值。


