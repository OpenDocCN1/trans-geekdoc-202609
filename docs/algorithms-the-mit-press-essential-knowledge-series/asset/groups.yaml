  mdcn: '

    无序项目集合所需的时间与项目数量成正比，即 $O(n)$。看看与项目有序时相比复杂度是如何增加的；对问题数据的组织方式会对解决问题产生巨大影响。通常情况下，如果一个算法必须读取问题的所有输入，线性时间就是我们能预期的最优行为，因为处理
    $n$ 个输入需要 $O(n)$ 的时间。


    我们将线性算法和对数算法结合，就得到了对数线性时间算法，其时间随 $n$ 乘以其对数增长，即 $n \log n$。排序（即把项目按顺序排列）的最佳算法复杂度为
    $O(n \log n)$。这看起来可能有点意外；毕竟，可以证明如果你有 $n$ 个项目并想将每个项目与所有其他项目进行比较，则需要 $O(n^2)$，这比
    $O(n \log n)$ 大。⁹此外，如果你有 $n$ 个需要排序的项目，你确实需要 $O(n)$ 的时间检查所有它们。对它们进行排序需要将该数字乘以比
    $n$ 本身更小的因子。我们将在书后介绍如何实现这一点。


    下一类计算复杂度是 $n$ 的常数幂，$O(n^k)$；这被称为多项式复杂度。多项式时间算法是高效的，除非 $k$ 很大，但这很少发生。当我们尝试解决一个计算问题时，如果能提出多项式时间算法，通常会非常高兴。


    $O(k^n)$ 复杂度被称为指数复杂度。注意它与多项式复杂度的区别，后者的指数是常数；而这里指数是变化的。我们见过指数级增长是爆炸性的。宇宙无法存足够久来看到非平凡输入下指数算法的答案。这类算法从理论角度来说很有趣，因为它们证明了可以找到解决方案。然后我们可以寻找复杂度更低的更优算法，或者我们可能证明无法找到更好的算法，在这种情况下，我们只能接受次理想方案——例如近似解。


    有一种东西比指数级增长得还要快，那就是阶乘。如果你以前没有遇到过阶乘，自然数 $n$ 的阶乘（我们写做 $n!$）简单来说就是从1到包括该数在的所有自然数的乘积：$100!
    = 1 \times 2 \times 3 \dots \times 100$。即使你没见过 $100!$，你可能也遇到过 $52!$，即便你知道它的含义。那是一副扑牌所有不同的洗牌方式。运行时间以阶乘衡量的算法具有阶乘复杂度。


    尽管像 $100!$ 这样的数字看起来很奇特，但它们出现在许多非奇特的场景中，而不仅仅是牌游戏。例如，考虑以下问题：“如果我们有一个城市列表以及每两个城市之间的距离，那么一个人访问每个城市并返回起点城市的最短路线是什么？”这被称为旅行推销问题，解决它的显而易见的方法是检查经过城市的所有可能路径。遗憾的是，对于
    $n$ 个城市，这种方法是 $n!$。在 20 个城市之后，该问题就无法处理了。有些算法处理得比 $O(n!)$ 好一点，但还不足以实际应用。对于这样一个简单的问题，这可能令人惊讶，我们可以在接受的时间内解决它的唯一方法是找到一个可能不是最优但足够接近最优的解决方案。许多其他非常重要的问题是不可解的——也就是说，我们不知道实用的算法来精确解决它们。尽管如此，对更好的近似算法的追求仍然计算机科学中一个充满活力的领域。


