    the final sorted list.


    These two trees are the essence behind merge sort. We delegate the sorting as
    much as we can, to the point that no sorting can take place because lone items
    are already sorted by definition. Then we merge larger and larger groups, until
    we absorb all elements in a single, final, sorted group.


    The smarts that we require from our characters is minimal. You can see in the
    first tree that Eve got Bob a group of numbers as it happened was already sorted:
    27, 82. It does not matter. She does not stop to check whether they needs sorting
    or not—and we don''t want to because such a check would take time. She just splits
