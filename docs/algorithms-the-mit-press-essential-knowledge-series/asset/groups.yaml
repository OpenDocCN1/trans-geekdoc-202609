  mdcn: '

    可以做出并尝试找到正确的移动；这被称为爬山算法。当我们到达类似平原的地方时，我们说我们到达了局部最优解，而不是全局最优解（即我们所追求的最高峰）。


    从爬山算法回到锦标赛调度，我们为每场比赛选择了第一个可选的日期。遗憾的是，这可能不是安排所有比赛的最佳方法。事实上，图着色是一个困难的问题。我们给出的算法不能保证给出最优解——即需要最少天数（或泛而言为最少颜色）的解。与节点相邻的边数称为该节点的度。可以证明，如果图中任何节点的最大度为
    $d$，则边可以用最多 $d$ 或 $d+1$ 种颜色进行着色；图边所需的颜色数称为其色指数。在我们特定的例子中，该解是最优的，$d=4$，我们使用了四天。然而，我们的算法在其他某些图中可能找不到最优解。它可能会给我们一个比那更差的解。贪心图着色的用处在于，我们很早就知道那个解可能是这样的：它给出的解最多需要
    $2d-1$ 种颜色，而不是 $d$，但不会比这差。


    如果你想看看这种情况是如何发生的，考虑一个由连接到中心节点的“星”组成的图，如下一页所示：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_89_0.png)


    如果我们有 $k$ 个星，每个星有 $k$ 条边加上一条指向中心节点的边，并且从给星着色开始，我们将使用 $k$ 种颜色给星的边着色。然后我们需要额外的 $k$
    种颜色将星连接到中心节点。总共 $2k$ 种颜色。这就是我们在左侧做的。但这不是最优解。如果我们从给连接星到中心节点的边开始，我们需要 $k$ 种颜色。然后我们只需要额外的颜色就可以给星本身着色，总共
    $k+1$ 种颜色。你可以在右侧看到如何这样做。这一切都符合理论，因为每个星的度都是 $k+1$。


    问题在于，贪心算法决定的着色顺序在最后不是最优的，或者用专业术语来说，不是全局最优的。它可能会碰到最优解，但也可能不会。话虽如此，与最优解的差异并不大。这是一个慰藉，因为图着色如此困难，如果我们想要一个为每个图找到最佳解的精确算法，该算法将具有指数级复杂度，大约
    $O(2^n)$，其中 $n$ 是图中边的数量。因此，精确边着色算法对于极小图之外是没没的。


    我们提出的贪心算法还有一个额外的良好属性（除了实用性之外）。它是一个*在线算法*：即使在在我们开始时未知输入，而是随着我们的进行而出现，该算法也能工作。我们不需要在开始运行算法之前知道所有的边。即使图在我们运行算法期间是分阶段构建的，算法也能正常工作。这即使在我们开始安排锦标赛比赛报名后也会发生。我们可以随着比赛的到来为每条边（比赛）着色，每当图完成后，我们就有了一个边着色方案。此外，如果图是以这种方式增量构建的，那么这个贪心算法就是最优算法；当图在我们解决问题时构建时，根本不存在精确算法，无论它多么低。


    # 最短路径


    正如我们所看到的，贪心算法通过在每一步采取最佳决策来工作——这可能不是整体上的最佳决策。它带有某种机会主义的本质或“活在当下”的感觉。遗憾的是，正如伊索寓言告诉我们的那样，只顾今天的蚂蚱可能会在冬天后悔，而为未来做准备的蚂蚁最终过得舒适温暖。在锦标赛规划中，我们发现蚂蚱的结局可能并不糟糕。现在是蚂蚁报仇的时候了。


    在第一章中，我们讨论了通过列举所有路径来尝试寻找网格两点之间最短路径的可行性。我们看到这在实践中是不可能的，因为路径数量巨大增加。现在有了对图的知识，我们将看到方法。事实上，我们将问题提高了一个层次。与其在网格上寻找最短路径（网格具有良好的几何结构，且点与点之间的距离相等），我们将允许任何几何形状，甚至在点之间添加不同的距离。


    为了做到这一点，我们将创建一个表示地图的节点和边，寻找地图上两个节点之间的最短路径。此外，我们将为每条边分配一个权重。权重可以是正数或零，对应于连接节点之间距离的度。可以是英里或小时的旅行时间；任何其他非负指标都可以。那么路径长度就是沿路径的权重之和；两个节点之间的最短路径是长度最小的路径。如果所有权重都等于
    1，那么路径长度就等于路径上的边数。一旦我们允许权重具有其他值，这就不再成立了。


    在下面的图中，我们有六个节点通过九条权重不同的边连接起来，想要找到从 A 到 F 的最短路径。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_92_0.png)


    如果我们采用贪心启发式，我们将从 A 到 C 开始，然后最佳选择是去 E，从那里到达 F。路径 A、C、E、F 的总长度为八，这并不是最佳。最佳路径是从 C
    到 D，总长度为六。所以贪心启发式不起，而且与锦标赛规划不同，它的最性能没有保证。尽管如此，再次与锦标赛规划不同，存在寻找最短路径的有效算法，因此没有理由使用贪心启发式。


    1956年，荷兰荷兰计算机科学家埃德格·迪克斯斯特拉（Edsger Dijkstra）与他的女友在阿姆斯特丹购物。累了，他们坐在咖啡馆露台上喝咖啡，迪克斯斯特拉在那里思考从一个城市到另一个城市的最佳方法。他在20分钟内设计出了解决方案，尽管该算法花了三年才发表。迪克斯斯特拉度过了辉煌的职业，但他这项20分钟的发明惊讶地成为了他声誉的基石。


    那么算法是如何运行的？我们想要找到从一个节点到所有其他节点的最短路径。算法使用一种称为*松弛*（relaxation）的想法：我们为想要找到的值（这里是距离）分配估计。在开始时，我们的估计是最糟糕的。随着算法的进行，我们能够将这些估计从最初的极糟糕放松到逐渐越来越好，直到得到正确的值。


    在迪克斯斯特拉算法中，松弛过程如下。我们首先为所有节点到起始节点的距离分配最糟糕的值：我们将距离设置为无穷大；显然，没有比这更糟糕的了！在图中，我们将最短路径的初始估计和路径中的前一个节点放在每个节点上方或下方。对于节点
    A，我们得到0，因为从 A 到 A 的距离为0，且 A 没有前一个节点。对于所有其他节点，我们得到$\infty$，因为距离是无穷大，我们对通它们的最短路径一无所知。'
