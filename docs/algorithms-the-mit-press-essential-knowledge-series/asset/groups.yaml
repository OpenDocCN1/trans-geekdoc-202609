    tour

    A path that starts and ends at the same node in a graph. It is also called a circuit.


    training

    In machine learning, the process of providing an algorithm with example inputs
    that it can learn to produce correct outputs.


    training data set

    Data that we use with machine learning algorithms to train them to solve problems.


    transposition method

    A self-organizing search algorithm. When we find an element, we swap it with the
    preceding it. In this way, popular items are moving to the front.


    traveling salesman problem

    Also known as the traveling salesperson problem, but people did not put much thought
    into gender definitions. The problem that asks us, If we have a list of cities
    and the distances between each pair of them, what is the shortest possible route
    that one should take to visit each city once and return to the origin city? It
    is probably the most famous intractable problem.


    ## Turing machine

    An idealized (abstract) machine, described by Alan Turing, consisting of an infinite
    tape and movable head that reads and writes symbols on the tape following a set
    of prescribed rules. The Turing machine can implement any algorithm and therefore
    can be used as a model of what can be computed.


    ## unary numeral system

    The number system using a single symbol for representing numbers; for instance,
    a stroke representing a unit, so that III represents three.


    ## undirected graph

    A graph in which the edges are undirected.


    ## unsupervised learning

    A machine learning approach in which we provide an algorithm input problems without
    their solutions. The machine learning algorithm must then derive what the expected
    input should be in order to produce it.


    ## vector

    A horizontal row or column of numbers (or more generally, mathematical expressions).
    Usually we use vectors in geometry, where it is a geometric entity with a length
    and direction, represented as a row or column containing their numerical coordinates;
    however, the notion of a vector is more general than that—take, for example, the
    pagerank vector. A vector is a special case of a matrix.


    ## vertex coloring

    The assignment of colors to the vertices of a graph so that no adjacent vertices
    share the same color.


    ## weight (graph)

    A number attached to an edge of a graph. Such a number may, for, a reward or penalty
    associated with the link between the nodes connected by the edge.


    ## weight (neuron)

    A numerical value attached to a synapse in a neuron. From each synapse, the neuron
    receives an input multiplied by the weight of the synapse.


    ## weighted input (neuron)

    The sum of the products of the inputs with the weights of a neuron.


