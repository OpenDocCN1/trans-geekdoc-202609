    几年来，研究人员正在研究导致此类现象出现的底层原因和规律.¹

    很有可能，我们正在搜索的项目在流行程度上存在这种差异。那么，一个利用搜索项目流行程度的差异的搜索算法，其工作方式就像是将找到的每份文档都放在堆的最顶端：


    1. 使用顺序搜索查找该项目。

    2. 如果找到了该项目，报告已找到，将其置于列表的最前端（即列表头部），并停止。

    3. 否则，报告未找到该项目并停止。


    在接下来的图中，在列表中找到 E 将其移到最：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_114_0.png)


    对这种“移至表算法”（move-to-front algorithm）的一种可能的批评是，它会将即使我们极少搜索过的项目也提升到前面。事实确实如此，但如果某个项目并不流行，当我们搜索其他项目时，它会逐渐移向列表末尾，因为这些项目会移动到前面。然而，我们可以通过一种不那么极端的策略来处理这种情况。我们不是将找到的每个项目直接移到最前面，而是只向前移动一个位置。这被称为“置换法”（transposition
    method）：


    1. 使用顺序搜索查找该项目。

    2. 如果找到了该项目，报告已找到，将其与前一个项目交换（如果它不是第一个），并停止。

    3. 否则，报告未找到该项目并停止。


    通过这样，流行的项目会逐渐移到前面，而不流行的项目则会向后移动，而不会发生突然的剧变。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_115_0.png)


    “移至表”和“置换法”都是自组织搜索的例子；之所以这样命名，是因为项目列表随着我们的搜索进行组织，并将反映出被搜索项目的流行程度。取决于项目之间流行程度的范围，所节省的开销可能是巨大的。对于顺序搜索，我们可以预期的性能是
    O(n)；而一个使用“移至表”方法的自组织搜索可以达到 O(n / lgn) 的性能。如果我们有大约一百万个项目，这就是 100 万和约 5 万之间的区别。置换法可以获得更好的结果，但它需要更多时间来实现。这是因为两种方法都需要一个“预热期”，在此期间流行的项目会展现出来并移到前面。在“移至表”方法中，预热时间很短；在“置换法”中，预热时间较长，但随后我们得到了更好的结果。²


    ## 开普勒、汽车与秘书


