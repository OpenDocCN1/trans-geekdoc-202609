    $n$ 个候选人：


    1. 计算 $n / e$，以找到 $n$ 个候选人中的 37%。

    2. 检查并拒绝前 $n / e$ 个候选人。你将其中最好的一个作为基准。

    3. 继续考虑剩下的候选人。挑选第一个优于你基准的人并停止。


    该算法并不总是能找到最好的候选人；毕竟，整体最好的候选人可能是你在前 37% 中识别出的那个基准候选人，而你拒绝了它。可以证明，它能在所有情况的 37%（再次是
