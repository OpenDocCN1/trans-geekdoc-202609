    Then Bob splits his numbers into two, and passes them on to Dave (D) and Eve (E).
    Similarly, Carol splits her numbers, and passes them on to Frank (F) and Grace
    (G). Our cast of characters continue passing the buck. Dave divides his numbers
    to Heidi (H) and Ivan (I); Eve distributes her two numbers to Judy (J) and Karen
    (K); Frank and Grace split to Leo (L) and Mallory (M) and Nick (N) and Olivia
    (O), respectively. Heidi splits her pair to Peggy (P)


