    not new. The Perceptron invented in the 1950s, and the backpropagation algorithm
    is more than 30 years old. In this period, neural networks came and went out of
    fashion, with enthusiasm for their potential ebbing and flowing. What has really
    changed in the last few years is our capability to build really neural networks.
    This has been achieved thanks to the advances in manufacturing specialized computer
    chips that can perform the calculations executed by neurons efficiently. If you
    picture all the neurons of a neural network arranged inside a computer’s memory,
    then all the required computations can be carried out by operations on vast matrices
    of numbers. A neuron calculates the sums of the weighted products of its inputs;
    if you recall the discussion on Page-Rank in the previous chapter, the sum of
    the products is the essence of matrix multiplication.'
