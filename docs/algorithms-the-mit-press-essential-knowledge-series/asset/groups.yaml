    Right now, when a surfer lands on a node, the possible moves are those indicated
    by the $S$ matrix. In the last'
  - '[PAGE 199]


    ```

    0 1/2 0 0 1/2 0

    0 0 1/2 0 1/2 0

    0 1/2 0 0 0 1/2

    1/2 0 0 0 1/2 0

    0 1/3 1/3 0 1/3

    0 0 0 0 1 0

    ```


    If the random surfer lands on page 5, then the possible moves are to pages 2,
    3, or 6, all with 1 / 3 probability, as the S matrix indicates. We will make the
    random surfer more agile, with the power to move following the S matrix *not always*,
    but with some probability $a$ that we will choose; then for some probability $(1
    - a)$, the random surfer will jump anywhere in the graph, unconstrained by the
    S matrix.


    The ability to jump from anywhere to anywhere in the graph means that we cannot
    have any zeros at all in the matrix—because a zero enters a move that cannot be
    made. To achieve what we want, we will need to *increase* the zero entries in
    a row by some value and *decrease* the nonzero entries so that the whole row always
    sums up to one. The exact final values of the matrix can be calculated through
    linear algebra, based on $S$ and the probability $a$.


    example, the S matrix is the same as the hyperlink matrix because no zero rows
    exist:'
  - '[PAGE 200]


    The new matrix that will be derived is called the Google matrix, and we use the
    symbol G. If the behavior of the random surfer is determined by the Google matrix,
    it will work out as we want: the surfer will appear to be following the $S$ matrix
    with probability $a$ and move independently with probability $(1 - a)$. In our
    example, the Google matrix is:


    \begin{pmatrix} 3 & 54 & 3 & 3 & 54 & 3 \ 120 & 120 & 120 & 120 & 120 & 120 \
    3 & & 54 & 54 & & 3 \ 120 & 120 & 120 & 120 & 120 & 120 \ 3 & 54 & 3 & 3 & & 54
    \ 120 & 120 & 120 & 120 & 120 & 120 \ 54 & 3 & 3 & 54 & 3 & 3 \ 120 & 120 & 120
    & 120 & 120 & 120 \ 3 & 37 & 37 & 3 & 3 & 37 \ 120 & 120 & 120 & 120 & 120 & 120
    \ 3 & 3 & 3 & & 105 & 3 \ 120 & 120 & 120 & 120 & 120 & 120 \end{pmatrix}


    Compare that to the $S$ matrix. Observe that in the first row, we had two entries
    with $1 / 2$ and the rest were zero. Now in the Google matrix, we have the two
    $1 / 2$ entries turned to $54 / 120$, and the rest of the entries turned from
    $0$ to $3 / 120$. Similar transformations have occurred in the other rows. If,
    then, the random surfer lands on page 1, the possible moves out are to pages 2
    and 5 with probability'
  - '[PAGE 201]


    54 / 120 for either of them, or any other page with probability 3 / 120 for each
    one of them.


    We are now able to give the final definition of the PageRank algorithm:


    +   1. Form the Google matrix of the graph.

    2. Start with initial pagerank estimates, giving a pagerank of $1 / n$ to each
    page, where $n$ is the total number of pages.

    3. Apply the power method, multiplying the pagerank vector by the Google matrix
    until the values of the pagerank vector converge.


    We simply substituted “Google matrix” for “hyperlink matrix” of the initial algorithm.
    If we trace this algorithm in our graph with the group of sink nodes, we''ll get:


    | Round | Page 1 | Page 2 | Page 3 | Page 4 | Page 5 | Page 6 |

    | --- | --- | --- | --- | --- | --- | --- |

    | start | 0.17 | 0.17 | 0.17 | 0.17 | 0.17 | 0.17 |

    | 1 | 0.10 | 0.14 | 0.14 | 0.10 | 0.31 | 0.21 |

    | 2 | 0.07 | 0.15 | 0.17 | 0.07 | 0.31 | 0.23 |

    | 3 | 0.05 | 0.14 | 0.18 | 0.05 | 0.32 | 0.26 |

    | 4 | 0.05 | 0.14 | 0.17 | 0.05 | 0.33 | 0.27 |


    It works out fine; we get no zero pageranks anymore.'
  - '[PAGE 202]


    The power method with the Google matrix will work always. Linear algebra tells
    us that it will always converge to a final set of pagerank values, the sum of
    which will be one, without suffering from dangling nodes or parts of the graph
    draining the pageranks of the rest of the graph. We don''t even need to initialize
    the pageranks to exactly $1 / n$ when we start. Any initial set of values will
    do, long as they sum up to one.


    # PageRank in Practice


    Having established that we have a method to find the pageranks in any graph, the
    question remains whether the results are in the end sensible.


    The pagerank vector, in the way that we have defined, is a special vector in relation
    to the Google matrix. When the power method finishes, the pagerank vector does
    not change any more. Therefore if we multiply the Google matrix by the pagerank
    vector we will get simply the pagerank vector. In linear algebra, this vector
    is called the first eigenvector of the Google matrix. Without going deep into
    the mathematics, the underlying theory supports the notion that this vector has
    some special significance to the matrix.


    Beyond mathematics, the final arbiter of whether Page-Rank is a good way to assign
    importance to web pages is'
  - '[PAGE 203]


    the utility of its results to humans. The Google search engine gives good results,
    meaning that the results are in accordance with what we, the users of the search
    engine, regard as being important. If the pagerank vector was a mathematical curiosity
    that bore no relation to the significance of web pages, we would not be concerned
    with it today.


    An additional advantage of PageRank is that it can be implemented efficiently.
    The Google matrix is huge; we need one row and one column for every single page
    on the web. Yet the Google matrix is derived, as we saw, from the S matrix, which
    in turn is derived from the hyperlink matrix. We do not really need to create
    and store the Google matrix itself; we can create it dynamically with matrix operations
    on the hyperlink matrix. This is convenient. In contrast to the Google matrix,
    which has no zeros anywhere, the hyperlink matrix has lots and lots of zeros.
    The web may have billions of pages, but every single page links to only a small
    number of other web pages. The hyperlink matrix is what we call a sparse matrix:
    one that is mostly full of zeros, with only some nonzero entries, which are scales
    of magnitude fewer than the zero entries. Thus we can store the matrix clever
    techniques instead of requiring a big slab of memory to fill with mostly zeros
    and a few nonzeros, store only the positions where the nonzeros occur. Rather
    than storing'
