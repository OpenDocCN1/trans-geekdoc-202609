    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_230_1.png)


    神经元都使用 tanh 激活函数。输出神经元将产生一个 -1 到 +1 之间的值，显示它对数据属于某一组或另一组的信念。我们将取该值并转换为二进制决策（是或否），取决于它是否超过了
    0.0。这就是神经网络的样子：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_231_0.png)


    ## 反向传播算法


    最初，神经网络什么都不知道，还没有发生任何调整；我们从随机的权重和偏置开始。这就是神经网络世界中“无知”的含义。然后，我们给神经网络一个来自我们数据的观测值——即一组坐标。$x_1$
    和 $x_2$ 坐标将进入输入层。两个神经元都接收 $x_1$ 和 $x_2$ 值，并将它们作为输出传递给第一个隐藏层。该层的所有四个神经元计算它们的输出，然后它们又将输出发送到第二个隐藏层。该层的神经元将自己的输出发送到输出层的神经元，最后由该神经元产生神经网络的最终输出值。随着计算逐层进行，神经网络将神经元的结果从输入层向输出层前向传播：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_232_0.png)


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_233_0.png)


    一旦到达输出层，我们就像处理单个神经元一样计算损失。然后，我们想要调整不仅是一个神经元，而是网络中所有神经元的权重和偏置，以使损失最小化。


    事实证明，通过反向方向（从输出层到输入层）可以做到。一旦我们知道了损失，就可以更新输出层神经元的权重和偏置（这里我们只有一个神经元，但这种需求并不总是如此）。更新了输出层的神经元后，我们可以更新前一层神经元的权重和偏置——即最后一个隐藏层。完成后，我们可以更新再前一层的权重和偏置——倒数第二个隐藏层。依此类推，直到我们到达输入层：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_234_0.png)


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_235_0.png)


    神经元权重和偏置的更新方式与单个神经元的更新方式相似。同样，更新是基于数学数计算的。你可以将整个神经网络想象成巨大的函数，其变量是所有神经元的权重和偏置。然后，我们可以计算每一个权重和偏置相对于损失的导数，并使用该导数来更新神经元。


    借此，我们到达神经网络学习过程的核心：反向传播算法。⁶


    对于每个输入和期望输出：


    1. 从输入层到输出层正向逐层计算神经网络的输出和损失。

    2. 从输出层到输入层反向更新神经元的权重和偏置，以使损失最小化。


    使用反向传播算法，我们可以构建复杂的神经网络并训练它们来执行不同的任务。深度学习系统的构建基石非常简单。它们是人工神经元，通过接收输入、乘以权重、累加偏置并应用激活函数。


    ## 识别衣服


    为了使讨论更具体，我们假设我们要构建一个能够识别衣物品的神经网络。神经网络在处理图像方面表现非常出色。我们的数据集包含 10 类衣物，每类 60000 张图像。训练集有
    60000 张图像用于训练，测试集有 10000 张用于评估。这里有一个例子：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_237_0.png)


    图像被划分为像素小块。像素值范围从 0 到 255，神经网络要求这些输入缩放到较小范围，例如 0 到 1 之间。0 为白色，255 为黑色。类别如下：


    | 标签 | 类别 | 标签 | 类别 |

    |---|---|---|---|

    | 0 | T恤 | 5 | 凉鞋 |

    | 1 | 裤 | 6 | 衬衫 |

    | 2 | 毛衣 | 7 | 运动鞋 |

    | 3 | 连衣裙 | 8 | 包 |

    | 4 | 外套 | 9 | 靴靴 |


    在下面的图中，我们展示了每个种类的随机样本。图像种类多样，并非都是完美的示例。我们想要创建一个接收这些作为输入的神经网络，并输出输出告诉我们它是哪种图像。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_240_0.png)


    再次，我们将逐层构建神经网络。第一层是输入神经元，将有 784 个神经元。它们中的每一个都接收图像中的单个像素输入，并输出它接收到的值。如果图像是靴子，第一个神经元将接收左上角像素块的值
    0，它将输出该 0。其余神经元将按行从上到下、从左到右获取像素块的值。值为 58 的像素块位于靴子跟部的右端（从底部第四行，右侧第三列），将获得 58 并将其复制到输出中。由于神经网络中的行和列是从顶部和左侧计数的，该神经元位于顶部第
    25 行、左侧第 26 列，使其输入编号为 24×28+26。


    下一层将与输入层密集连接。它由 128 个 ReLU 神经元组成。这一层不直接连接到输入图像（输入层），也不会直接连接到输出（我们将再添加另一层）。因此它是一个隐藏层，因为我们无法从外部观察到它。由于密集连接，输入层和隐藏层之间将产生大量的连接。隐藏层的每个神经元都与输入层所有神经元的输出相连。有


