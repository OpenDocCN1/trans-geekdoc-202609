  mdcn: '

    以及 PageRank，请参见 Langville 和 Meyer 2006；Berry 和 Browne 2005。除了 PageRank 之外，另一种重要的排名算法是超文本引导主题搜索，或
    HITS（Kleinberg 1998, 1999），它在 PageRank 之前开发。相似的思想在其他领域（社会计量学，即社会关系的定量研究；计量经济学，即经济原理的定量研究）早已提出，可以追溯到
    20 世纪 40 年（Franceschet 2011）。


    ## 第6 章


    1. 尽管今天我们可以利用技术更详细地观察神经元，但拉蒙·卡哈尔（Ramón Cajal）是一位先驱，他的图画被认为是科学史上最优雅的作品之一。你可以在网上找到大量的图片，这对我们来说已经足够了，简单的搜索就能让你信服拉蒙·卡哈尔的美感和持久的力量。该图像属于公有领域，获取自
    https://commons.wikimedia.org/wiki/File:Purkinje.jpg。


    2. 准确地说，sigmoid 指的是希腊字母 sigma，但它的外观更接近拉丁字母 S。


    3. 角的正切值定义为直角三角形中对边与邻边的比值，或者等价于单位圆中正弦值除以余弦值。双曲正切定义为比值


    4.  McCulloch（Warren McCulloch）和 Pitts（1943）提出了第一个人工神经元。弗兰克·罗森布特（Frank Rosenblatt）（1957）描述了感知器（Perceptron）。尽管它们已经有半个世纪的历史，但神经网络在近期已涵盖各个领域。马文·明斯基（Marvin
    Minsky）和西摩（Seymour）（1969）在他们著名的同名书中对感知器造成了巨大打击，证明了单个感知器具有根本性的局限性。这结合当时的硬件限制，开启了所谓的神经计算时代，一直持续到
    20 世纪 80 年代，当时研究人员发现了如何构建和训练神经网络。随后该领域的兴趣重新复苏，但要实现近几年所看到的神经网络进展，仍需要大量工作。


    5. 神经网络的挑战之一是符号可能非常复杂，因此材料对于内行人来说似乎浅易懂。事实上，这并不是一旦你了解导数是什么就懂了；函数 $f(x)$ 对 $x$ 的导数记作
    $df/dx$。多元函数（例如 $x_1, x_2, \dots, x_n$）的偏导数记作 $\partial f/\partial x_i$。梯度记作 $Vf
    = (\partial f/\partial x)$。


    6. 反传播算法出现在 20 世纪 80 年代中期（Rumelhart and Williams 1986），尽管它的各种推导已经在 20 世纪 60 年代出现过。


    7. 该图片来自 Fashion-MNIST 数据集（Xiao, Rasul, and Vollgraf 2017），它是机器学习的基准数据集。本节灵感来自
    https://www.tensorflow.org/tutorials/basic_classification 中的基础分类教程。


    8. 关于第一个击败人类冠军系统的描述，请参见 Silver 等 2016。关于一个不需要以前对局形式的人类知识的改进系统，请参见 Silver 等 2017。


    9. 关于深度学习的文献是对该主题的全面介绍，请参见 Geoffrey, Bengio, and Courville 2018。关于更短且更易理解的处理（简洁概述），请参见
    LeCun, Bengio, and Hinton 2015。关于机器学习，请参见 Alpaydin 2016。关于自动神经架构方法的综述，请参见 Elksen,
    Hendrik Metzen, and Hutter 2018。


    ## 结语


    1. 除了图灵之外，名单上的其他名字还有玛丽·安宁（Mary Anning）、保罗·狄拉克（Paul Dirac）、罗莎琳·富兰克林（Rosalind Franklin）、威廉·赫谢尔（William
    Herschel）和卡罗琳·赫谢尔（Caroline Herschel）、多萝西·霍金金（Dorothy Hodgkin）、艾达·洛芙莱（Ada Lovelace）和查尔斯·巴贝（Charles
    Babbage）、斯蒂芬·霍金（Stephen Hawking）、詹姆斯·克拉克··麦克斯韦（James Clerk Maxwell）、斯里尼尼瓦萨·拉曼努金（Srinivasa
    Ramanujan）、内斯特·卢瑟福（Ernest Rutherford）和弗雷德里克·桑格（Frederick Sanger）。巴贝、洛芙莱和图灵都是计算机先驱。巴贝（1791–1871）发明了第一台机械计算机并发展了现代计算机的核心思想。洛芙莱（1815–1852）是拜伦勋族的女儿，她与巴贝合作，意识到了发明的潜力，并开发了第一个可以在此类机器上运行的算法。她现在被认为是第一个计算机程序员。关于
    50 英镑钞的设计，请参见官方公告 https://www.bankofengland.couk/news/2019/july/50-pound-banknote-character-announcement。


    2. 参见 Andrew Hodges（1983）编写的优秀传记。图灵在破解德国恩尼格玛密码机中的作用，在 2014 年的电影《模仿游戏》中得到了戏剧化呈现。


    3. 关于该机器的描述，请参见 Turing 1937, 1938。


    4. 图灵机示例改编自 John Hopcroft, Rajeev Motwani, and Jeffrey Ullman（2001, 第 8 章）。该图基于
    Sebastian-Sardina 的示例：http://www.example.net/tikz/examples/turing-machine-2/。


    5. 关于丘奇-图灵论的更多信息，请参见 Lewis and Papadimitriou 1998, 第 5 章。关于丘奇-图灵论的历史及其各种变体，请参见
    Copeland and Shagrir 2019。


