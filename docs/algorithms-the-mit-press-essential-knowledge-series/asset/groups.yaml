  - '[PAGE 64]


    unordered set of items requires time proportional to the number of the items,
    O(n). See how the complexity increased compared to when the items are ordered;
    organizing the data of our problem can have a big impact on how it can be solved.
    In general, linear time is the best behavior we can expect of an algorithm if
    it has to read through all the inputs of the problem, as this will require time
    O(n) for n inputs.


    If we combine linear and logarithmic algorithms, we get loglinear time algorithms,
    where their time grows by n multiplied by its logarithm, nlogn. The best algorithms
    for sorting—that is, putting items in order—have complexity O(nlogn). That may
    look a bit surprising; after all, it can be shown that if you have n items and
    want to compare each item with all other items, it requires O(n^2), which is bigger
    than O(nlogn).⁹ Also, if you have n items that you want to sort, you definitely
    need O(n) time to examine all of them. Sorting them requires multiplying that
    number by a smaller factor than n itself. We’ll see how this can be done, later
    on in the book.


    The next computational complexity family is n raised to a constant power, O(n^k);
    this is called polynomial complexity. Polynomial time algorithms are are efficient,
    except if k is big, but this rarely happens. When we try to solve a computational
    problem, we are usually delighted we can come up with a polynomial time algorithm.'
  - '[PAGE 65]


    A complexity of the form O(kⁿ) is called exponential complexity. Note the difference
    with the polynomial complexity where the exponent was constant; here it is the
    exponent that changes. We saw exponential growth explodes. The universe will not
    survive long enough to see the answer of exponential algorithms for nontrivial
    inputs. Such algorithms are interesting from a theoretical point of view because
    they show that a solution can be found. We can then search for better algorithms
    with lower complexity, or we may be able to prove that no better algorithms can
    be found, in which case we can settle for something less than the ideal—for instance,
    approximate solutions.


    There is something that grows even faster than exponentiation, and this is the
    factorial. If you have not encountered a factorial before, the factorial of a
    natural number n—which we write as n!—is simply the product of all the natural
    numbers up to and including that number: 100! =1×2×3...×100. Even if you have
    not encountered 100! you probably have encountered 52! even with knowing it. That
    is the number of different shuffles of a deck of cards. Algorithms whose running
    time is measured in factorials have factorial complexity.


    Although numbers like 100! may seem exotic, they arise in many nonexotic settings
    and not just card games. Take, for example, the following problem: “If we have
    a list of cities and the distances between each pair of them,'
  - '[PAGE 66]


    what is the shortest possible route that one should take to visit each city once
    and return to the origin city?” This is called the traveling salesman problem,
    and the obvious way to solve it is to examine every possible path taking in all
    cities. Unfortunately, for n cities this is n! The problem is unmanageable after,
    say, 20 cities. There are some algorithms that do it a bit better than O(n!),
    but not enough to be practical. Surprising as it may seem for such a straightforward
    problem, the only way we can solve it in an acceptable time is by finding a solution
    that may not be the optimal, but is close enough to it. Many other problems of
    great importance are intractable—that is, we don''t know a practical algorithm
    to solve them exactly. Even so, the quest for better and better approximation
    algorithms is a vibrant field in computer science.


