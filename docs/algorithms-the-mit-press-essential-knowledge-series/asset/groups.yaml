  - '[PAGE 167]


    them to produce what she already got. That''s all right; in the large scheme of
    things, this gratuitous pas de trois between Eve, Judy, and Karen won''t affect
    the performance of the algorithm.


    The complexity of merge sort is as good as that of quicksort, O(nlogn). That means
    we have two algorithms with the same performance. In practice, programmers may
    choose one or the other depending on additional factors. Usually quicksort programs
    run faster than merge sort ones because their concrete implementation in a programming
    language is faster. Merge sort splits the data before merging them, which means
    that they can be parallelized, so that vast amounts of data can be sorted by a
    computer cluster, where each computer acts like our human sorters above.


    Merge sort is as old as computers. Its inventor was a Hungarian American, Neumann
    János Lajos, better known under his American name, John von Neumann (1903–1957).
    In 1945, he wrote a manuscript, in ink, 23 pages long, for one of the first digital
    computers, the Electronic Discrete Variable Automatic Computer, or EDVAC for short.
    At the top of the first page, the phrase “TOP SECRET” was penciled in (and later
    erased), as work on computers was classified in 1945 due to its connections with
    the military. The subject of the paper was a nonnumerical application of computers:
    sorting. The method that von Neumann described was what we now call merge sort.7'
  - '[PAGE 168]


    If you are below a certain age, the words HotBot, Lycos, Excite, AltaVista, and
    Infoseek mean nothing to you, or if they do mean something, they probably do not
    mean search engines. Yet all of them were vying for our attention at some point
    or other, trying to get us to use them as the gateway to the web.


    This is history now, as the search engine landscape is dominated by two services,
    Google, run by Alphabet, and Bing, run by Microsoft. The explosion of many competitors
    in a new market, and their subsequent consolidation, is a pattern that we witnessed
    in many industries in history. What is remarkable in the search engine space is
    that we know that a large factor in the evolution is the phenomenal success of
    Google, which in turn was based on an algorithm that its founders invented. The
    founders were Larry Page and Sergey Brin, doctoral'
  - '[PAGE 169]


    candidates at Stanford University, and they named their algorithm PageRank, after
    Page (and not after “page”) and rank, as one might expect.


    Before we embark on a description of PageRank, we need to understand exactly what
    search engines do. This is actually two things. First, they crawl the web, reading
    and indexing all the web pages they can come across. In this way, when we type
    in a search term, search engines look into the data they have stored on the crawled
    web pages and find the ones that match our query. So if we search for “climate
    change,” the search engines will search through the data they have amassed to
    the web pages that contain this search term.


    If our search term describes a popular topic, the results can be numerous. At
    the time of this writing, the query “climate change” on Google returns more than
    700 million results; this number may be different when you read these lines, but
    you get an idea of the scale. This brings us to the second thing that search engines
    do. They must present the search results so that those are more pertinent to what
    we are looking for first, and those that are less likely to interest us appear
    later. If you are trying to learn the facts about climate change, you would expect
    to see results from the United Nations, National Aeronautics and Space Administration
    (NASA), or Wikipedia come up on top. You would be rather surprised if the top
    result was a web page explaining the view of the Flat Earth Society on'
  - '[PAGE 170]


    the topic. From the hundreds of millions of web pages that may be related to your
    query, many will be trivial; others may be bloviating, and yet others will be
    utter nonsense. You want to hone in on those that are to the point and authoritative.


    When the Google search engine arrived on the scene (the author is old enough to
    remember), people (the author included) started switching to the newcomer from
    other, older, now-extinct search engines because its results were better and arrived
    faster. It also helped that the Google web page was plain, containing only relevant
    information, instead of being with all sorts of paraphernalia, which had been
    the fashion. We''ll leave aside the second factor, illuminating though it is (Google
    understood that users cared for good and fast search results, not for bells and
    whistles), and deal with the first. How could Google deliver better results than
    the others, fast?


    If the web were small, we could create a catalog of it, and have editors to curate
    the catalog and assign importance to its entries—the web pages. But the scale
    of the web precludes such an approach, although there were such attempts before
    it became obvious that the size of the web would make this an impossible task.


    The web consists of web pages, linked to each other through links. We call these
    links *hyperlinks*; text that contains such cross-references to other parts of
    the text'
  - '[PAGE 171]


    If you are trying to learn the facts about climate change, . . . you would be
    rather surprised if the top result was a web page explaining the view of the Flat
    Earth Society on the topic.'
  - '[PAGE 172]


    or other texts is called hypertext. The notion of hypertext predates the web.
    The first description of a system of organizing knowledge by interlinking documents
    was written by the US engineer Vannevar Bush and appeared in 1945 in the Atlantic.
    The World Wide Web, or simply the web as it became known, was developed by the
    British computer scientist Tim Berners-Lee in the 1980s. Berners-Lee was working
    at CERN, the European Organization for Nuclear Research, outside Geneva, Switzerland,
    and wanted to create a system to help scientists share documents and information.
    They could do that by making their documents available online and also adding
    links from their documents to other documents that were available online. The
    web has grown, and continues to grow, organically by people adding new pages.
    Authors of web pages write the content of the pages and link to existing pages
    that are relevant to the content of the pages they write.


    Imagine you are the author of an online article that provides an overview of the
    effects of climate change in your country. In the article, as you introduce the
    topic, you may want to let your readers navigate to a web page that you believe
    is an authoritative source on the matter, so you add a link to that web page.
    In this way you help your readers by allowing them to delve deeper into the subject,
    while at the same time you add gravitas to your own writing because you substantiate
    your statements by those of another web page that you trust.'
