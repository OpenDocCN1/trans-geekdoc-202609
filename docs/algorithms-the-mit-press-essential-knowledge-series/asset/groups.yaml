  - '[PAGE 266]


    that implements it. As computers run algorithms, any algorithm that is computable
    by a computer is computable by a Turing machine. Or in other words, whatever we
    can do with an algorithm, we can do with a Turing machine. That is a loose rendering
    of the Church-Turing thesis, named after Turing and the US mathematician Alonzo
    Church (1903–1995), one of the founders of theoretical computer science. Being
    it a thesis, it is not something that has been proved, and we do not know if it
    can be proved mathematically. It is theoretically possible that it could be disproved,
    if somebody devises some alternative form of computation that a Turing machine
    cannot compute. We do not believe this is likely to happen. We therefore take
    the Turing machine to be a formal description of the notion of an algorithm.⁵


    You can imagine any computer, as powerful as you want it. The computer will be
    way faster than a Turing machine that operates on a tape of symbols as we have
    described. But everything it calculates algorithmically, a Turing machine can
    calculate too. You can even imagine computers that we have not been able to manufacture
    yet. Our computers work with bits, which can exist in only two states, 0 and 1.
    Quantum computers work with qubits. When we examine the state of a qubit, this
    will be 0 or 1, like a bit. Yet a qubit, when we don''t examine it, it can be
    in a combination, called superposition, of the two binary states 0 and 1. It is
    as if a qubit is both 0 and 1, until we decide to'
  - '[PAGE 267]


    read it, when it decides to be one of these two values. This allows quantum computers
    to represent multiple states of computation at once. A quantum computer would
    allow us to solve fast problems that are not easily solved by classical computers.
    Unfortunately, building a quantum computer is difficult with the current technology.
    And even a quantum computer could not do something that a Turing machine cannot
    do. Even though it would be able to solve some problems more efficiently than
    any existing classical computer, or any Turing machine for that matter, it still
    won''t be able to solve any problems that a Turing machine cannot solve.


    Our computational limits are given by Turing machines. Anything a computer can
    do, we could really do with a pen and paper, working on a tape of symbols. Everything
    you see executed on any digital device is, in essence, a series of such elementary
    symbol manipulations. In the natural sciences, we behold the world and believe
    that we can explain it using fundamental principles. In computing, it is the other
    way around. We have our fundamental principles and believe that we can do amazing
    feats with them.


    When Turing proposed his machine as a model for computation, digital computers
    did not even exist. That did not prevent him from exploring the capabilities of
    computing machines that would be created in the future. When we think about the
    limits of computers, we should'
  - '[PAGE 268]


    Our computational limits are given by Turing machines. Anything a computer can
    do, we could really do with a pen and paper. . . Everything you see executed on
    any digital device is . . a series of such elementary symbol manipulations.'
  - '[PAGE 269]


    also keep in mind that inside these limits, the human intellect has created wonders.
    The limits of computation have not curtailed our creativity to continue developing
    algorithms for every aspect of our lives. When writing was invented in Mesopotamia,
    its purpose was to aid record keeping, not write literature. The first writers
    were probably accountants, not authors, yet from such humble beginnings emerged
    William Shakespeare. Who knows what, in time, algorithms will bring.'
  - '[PAGE 270]


    # GLOSSARY


    activation (neuron)

    The emission of output from a neuron.


    activation function

    A function that determines the output of a neuron based on its input.


    acyclic graph

    A graph that has no cycle.


    adjacency matrix

    A matrix that represents a graph. It has a row and column for each vertex of the
    graph. Its contents are 1 in each entry whose row and column correspond to two
    vertices connected by an edge in the graph; all other entries are 0.


    +   algorithm

    1. Go to the first page of the book.

    2. Read the current page.

    3. If you don''t understand, go to step 2. Otherwise go to step 4.

    4. If there is a next page, make it your current page and go to step 2. Otherwisewise
    terminate.


    approximation

    Solving a problem by using an algorithm that may not find the optimal solution,
    but one that is not far from it.


    automatic differentiation

    A set of techniques to evaluate the derivative of a function numerically—that
    is, not analytically, which would entail using the calculus rules for differentiating
    functions.


    backlink

    A link that points to the web page we are visiting, and by extension, the web
    pages that contain links that point to the web page we are visiting.'
  - '[PAGE 271]


    backpropagation algorithm

    A fundamental algorithm for training neural networks. The network corrects its
    configuration (its weights and biases) by propagating adjustments from the final
    layer back toward the first layer.


    bias

    A numerical value attached to a neuron that controls its propensity to fire.


    big O

    A notation for computational complexity. Given an algorithm and input greater
    than some threshold, it gives us upper bound on the expected number of steps required
    by the algorithm to compute. We want the input to be larger than some threshold
    because we are interested in the behavior of an algorithm on large data. The big
    O complexity for an algorithm gives us a guarantee that for large data, the algorithm
    will not require more than a particular number of steps. For example, a complexity
    of $O(n^2)$ means that for input size $n$ that exceeds some threshold, the algorithm
    will not take more than a constant multiple of $n^2$ steps to complete.


    binary search

    A algorithm that works on ordered data. We check the item in the middle of the
    search space. If it matches the one we are looking for, we are fine. Otherwise,
    we repeat the procedure to the left or right half, depending on whether we have
    overshot or undershot our target.


    bit

    The basic unit of information stored on a computer. A bit can take one of values,
    0 or 1. The word bit comes from binary digit.


    bug

    an error in a program. The term bug was used by Thomas Edison for technical fault.
    In the early days of computing, real bugs would make their way into the machinery,
    causing them to fail. A moth that was found inside the Harvard Mark II computer
    in 1947. The moth has been preserved in the machine''s logbook, which is part
    of the collection of the Smithsonian National Museum of American History.


    categorical cross-entropy

    A loss function that calculates the difference between two probability distributions.'
  - '[PAGE 272]


    central processing unit (CPU)

    The chip that carries out the instructions of a program inside a computer.


    chromatic index

    In graph coloring, the minimum number of colors required to color the edges of
    the graph.


    Church-Turing thesis

    The hypothesis that everything that can be computed by an algorithm can be computed
    by a Turing machine.


    classifier

    A program that classifies an observation in one out of a number of possible classes.


    complexity (computational complexity)

    The time required for an algorithm to run. The time is expressed on the order
    of elementary computational steps required to complete.


    complexity class

    A set of problems that require the same amount of a resource (such as time or
    memory) to be solved.


    control structure

    The three ways in which steps can be combined in an algorithm or program: sequence,
    selection, and iteration.


    cycle

    In graphs, a path that starts and end at the same node.


    dangling node

    In the PageRank algorithm, a node with only incoming edges and no outgoing edges.


    data structure

    A way to organize data, such that we can handle the data with a set of specific,
    prescribed operations.'
  - '[PAGE 273]


    # decision boundary


    The values of one or more variables that form the boundary between two different
    outcomes of a single decision based on the variable or variables.


    # deep learning


    Neural networks that consist of many hidden layers, arranged such that succeeding
    layers represent deeper concepts, corresponding to higher abstraction levels.


    # degree (node)


    The number of edges adjacent to a node.


    # densely connected


    Layers in a neural network arranged such that all the neurons of a layer are connected
    to all the neurons of the following layer.


    # derivative


    The slope of a function at a point; equivalently, the rate of change of a function.
    For example, acceleration is the derivative of speed (the rate of change of speed
    in time).


    # Dijkstra''s algorithm


    An algorithm invented in 1956 by a young Dutch computer scientist, Dijkstra, to
    find the shortest path between two nodes in a graph. It works with graphs that
    contain positive weights.


    # directed graph


    A graph in which the edges are directed. A directed graph is also called a digraph
    for short.


    # divide and conquer


    A problem-solving method where we solve a problem by breaking it into smaller
    problems (typically two) and then do the same on the smaller problems, until the
    problems get so small that the solution is straightforward to find.


    # edge coloring


    The assignment of colors to the edges of a graph so that no two adjacent edges
    share the same color.'
