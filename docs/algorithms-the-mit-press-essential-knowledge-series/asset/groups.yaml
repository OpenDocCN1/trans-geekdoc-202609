    to make a final decision at each dealership, to buy the car or let go, and not
    come back.


    This is an instance of an optimal stopping problem. We have to take an action,
    while trying to maximize a reward or minimize a cost. In our example, we want
    to decide to buy the car, when this decision will result in the best car we can
    buy. If we decide too early, we may settle on a car that is worse than a car we
    have not seen yet. If we decide too late, we may discover to our chagrin that
    we saw, but missed, the best car. When is the optimal time to stop and make a
    decision?


    There is a surprisingly simple answer. You go through the first 37 percent of
    the candidates, rejecting them all, but keeping a tab on the best one among them
    as your benchmark. The number 37, which seems magical, occurs because $37% \approx
    1 / e$, where $e$ is Euler''s number, approximately equal to 2.7182 (we saw Euler''s
    number in chapter 1). Then you go through the rest of the candidates. You stop
    at the first of the rest that is better than your benchmark. That will be your
    pick. In algorithmic form, if you have $n$ candidates:


    1. Calculate $n / e$, to find the 37 percent of the $n$ candidates.

    2. Examine and reject the first $n / e$ candidates. You will use the best one
