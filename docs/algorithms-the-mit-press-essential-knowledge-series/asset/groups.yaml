    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_212_1.png)


    与其认为偏置（bias），不如将其视为阈值会很有帮助。如果加权输入超过阈值，神经元输出 1，否则输出 0。事实上，如果我们将神经元的行为写为一个公式，第一个条件是
    $w_1x_1 + w_2x_2 + \dots + w_nx_n + b > 0$ 或 $w_1x_1 + w_2x_2 + \dots + w_nx_n
    > -b$。通过使用 $t = -b$，我们得到 $w_1x_1 + w_2x_2 + \dots + w_nx_n > t$，其中 $t$（偏置的相反数）是神经元触发需要通过的加权输入。


    在实践中，我们倾向于使用其他相关的激活函数而不是阶跃函数。在下一页你可以看到三种常见的函数。


    顶部的一个被称为 *sigmoid*，因为它具有 S 形状。它的输出范围从 0 到 1。较大的正输入会导致接近 1 的输出；较大的负输入会导致接近 0 的输出。这近似了生物神经元——它在输入较大时触发，在其他情况下保持沉默，并且是阶跃函数的平滑近似。中间的激活函数被称为
    *tanh*，是 *hyperbolic tangent*（双曲正切）的缩写（有多种读法：“tan-H”、“then” 或带有带有软 th 音的“thents”，就像
    thanks 中那样）。³ 它看起来像 sigmoid 函数，但不同之处在于它的输出范围从 -1 到 +1；较大的负输入会导致负输出，模拟抑制信号。底部的函数被称为
    *rectifier*（整流器）；它将所有负输入转为 0，否则它的输出与输入成正比。下表显示了三种激活函数对于不同输入的输出。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_214_0.png)


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_214_1.png)


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_214_2.png)


    | input | sigmoid | tanh | rectifier |

    | :--- | :--- | :--- | :--- |

    | -5 | 0 | -1 | 0 |

    | 0 | 0.5 | 0 | 0 |

    | 1 | 0.73 | 0.76 | 1 |

    | 5 | 0.99 | 1 | 5 |


    如果你好奇为什么激活函数会如此泛滥（还有其他的），那是因为实践中发现，特定的激活函数在某些应用中比其他更合适。由于激活函数对神经元的行为至关重要，神经元通常以其激活函数命名。使用阶跃函数的神经元被称为感知机（Perceptron）。然后我们有
    sigmoid 和 tanh 单元，而使用整流器的神经元被称为 ReLU，即整流线性单元（rectified linear unit）。例如，取下一页顶部图中的数据，它描述了一组具有两个特征的观测值，横轴为
    $x_1$，纵轴为 $x_2$。我们想要建立一个能够区分这些“斑点”的系统。对于任何项，系统都将能够判断该项属于某一组还是另一组。实际上，它将在底部的图中创建一个*决策边界*（*decision
    boundary*）。对于任何组合 $(x_1, x_2)$，它都会告诉我们该项属于浅色组还是深色组。


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_216_0.png)


    该神经元将只有两个输入。它将接收每对 $(x_1, x_2)$ 并计算一个输出。如果我们使用 sigmoid 激活函数，输出将位于 0 到 1 之间。我们将大于
    0.5 的值归为一组，其他值归为另一组。这样，神经元将作为一个分类器，将我们的数据分类到不同的类别中。但它是如何做到的？神经元如何达到能够分类的程度？


    # 学习过程


    在创建之初，我们的神经元无法识别任何类型的数据；它通过学习来识别它们。它的学习方式是通过例子。整个过程就像通过给学生提供一堆问题及其答案来让他们学习东西。我们要求学生学习每个问题及其答案。如果他们足够勤奋，我们预计学生在处理了一数量的问题后，他们将弄清楚如何从一个问题得到它的答案，甚至能够解决与他们学过的问题相关的新问题，但这次不再参考任何答案。


    当我们这样做时，我们是在训练计算机去寻找解决方案；这组已解决的示例问题被称为训练数据集集（training data set）。这是监督学习（supervised
    learning）的一种实例。


    > 在创建之初，我们的神经元无法识别任何类型的数据；通过学习识别它们。它的学习方式是通过例子的。


    因为答案像主管一样引导计算机找到正确答案。监督学习是机器学习中最常见的形式，机器学习是处理训练计算机执行任务的方法的整个学科。除了监督学习之外，机器学习还包含了无监督学习（unsupervised
    learning），我们为计算机提供一个训练数据集，但不提供任何随带的答案。无监督学习有重要的应用，例如，将观测值分组为不同的簇（对于什么是正确的观测值簇，没有先验解决方案）。总的来说，监督学习比无监督学习更强大，因为我们在训练期间提供了更多信息。我们在这里只处理监督学习。


    训练后，学生通常会通过一些测试来查看他们对材料的掌握程度如何。同样，在机器学习中，训练后，我们给计算机另一个它从未见过的数据集，并要求它解决这个测试数据集。然后，我们根据机器学习系统解决测试数据集中问题的好坏来评估其性能。


    在分类任务中，监督学习的训练通过给神经元网络大量的观测值（问题）及其类别（答案）来实现。我们预计神经元将以某种方式学会从一个观测值获取到它的类别。然后，如果我们给它一个它以前见过的观测值，它应该能以合理的成功率进行分类。


    神经元对任何输入的行为由其权重（weights）和偏置（bias）决定。当我们开始时，将它们设置为随机值；神经元一无所知，就像学生一样。我们以 $(x_1,
    x_2)$ 对的形式给神经元一个输入。神经元将产生输出。由于我们有随机的权重偏置，输出也是随机的。然而，对于训练数据集中的每个观测值，我们确实知道答案应该是。然后我们可以计算神经元的输出与预期值有多远。这被称为损失（loss）。例如，如果对于输入神经元产生了
    0.2，而期望输出是 1.0，我们可以通过差值计算损失。为了避免处理符号，我们通常取差值的平方；这里是 $(1.0-0.2)^2 = 0.64$。如果期望输出是
    0.0，那么损失将是 $(0.0-0.2)^2 = 0.04$。无论如何，计算损失后，我们现在可以调整权重和偏置使其最小化。


    回到人类学生，在每次尝试解决练习失败后，我们都会促使他们表现得。学生发现他们必须稍微改变方法并尝试下一个例子。如果他们失败了，我们再次促使他们。


    当学生学习时，神经科学告诉我们大脑内部的布线发生了变化；神经元之间的某些突触变强，某些变弱，某些被丢弃。人工神经元没有直接对应物，但发生了类似的事情。再次记住，神经元的行为取决于它的输入、权重和偏置。我们无法控制输入；它来自环境。但我们可以改变权重和偏置。这正是真实发生的情况。我们更新权重和偏置的值，使得神经元能够最小化其误差。


    '
