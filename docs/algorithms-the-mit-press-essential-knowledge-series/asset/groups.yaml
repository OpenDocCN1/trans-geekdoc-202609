  - '[PAGE 186]


    But this is exactly the definition of $r(P_1)$, the pagerank of page 1. We got
    the pagerank by summing the products of the elements of the pagerank vector with
    the corresponding elements of the first column of the hyperlink matrix.


    Let''s see what is happening if we take the pagerank vector and sum the products
    of its elements with the corresponding elements of the second column of the hyperlink
    matrix:


    ```

    $r(P_1) \times 1 + r(P_2) \times 0 + r(P_3) \times 0 + r(P_4) \times 0 + \frac{r(P_5)}{3}
    = r(P_2) + \frac{r(P_5)}{3}$

    ```


    That is exactly the definition of $r(P_2)$, the pagerank of page 2. The sum of
    the products of the elements of the pagerank vector with the contents of the third
    column of the hyperlink matrix will similarly give us $r(P_3)$, the pagerank of
    page 3:


    ```

    $r(P_1) \times 0 + \frac{r(P_2)}{2} + r(P_3) \times 0 + \frac{r(P_4)}{2} + \frac{r(P_5)}{3}
    = \frac{r(P_2)}{2} + \frac{r(P_4)}{2} + \frac{r(P_5)}{3}$

    ```


    You can verify that using the fourth and fifth columns of the hyperlink matrix
    we''ll get $r(P_4)$ and $r(P_5)$, respectively. This operation—of summing the
    products of the elements of the pagerank vector with the contents of column of
    the hyperlink matrix—is actually the product of the pagerank vector with the hyperlink
    matrix.'
  - '[PAGE 187]


    Unless you are familiar with matrix operations, this may be confusing because
    we usually talk about the product of two numbers, which is the common multiplication,
    and not about the product of constructs like vectors and matrices. We can define
    mathematical operations on other entities, not just numbers, as long as it suits
    us. The product of a vector with a matrix is such an operation. There is no mystery
    involved in it: it is simply an operation that we define as a particular calculation
    involving the elements of the vector and matrix.


    Suppose that we make bagels and croissants that we sell for $2.00 and $1.50, respectively.
    We have two shops; on a particular day, the first shop sells 10 bagels and 20
    croissants, while the second shop sells 15 bagels and 10 croissants. How do we
    find the total sales per shop?


    To find the total sales from the first shop, we will multiply the price of a bagel
    with the number of bagels sold in that shop, and the price of a croissant with
    the number of croissants sold there, and we''ll add these two:


    ```

    $2.00 \times 10 + 1.50 \times 20 = 50$

    ```


    We’ll do the same thing to find the total sales from the second shop:


    ```

    $2.00 \times 15 + 1.50 \times 10 = 45$

    ```'
