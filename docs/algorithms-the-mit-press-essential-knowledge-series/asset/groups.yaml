    $w_1x_1 + w_2x_2 + \dots + w_nx_n > t$, where $t$, the opposite of the bias, is
    that the weighted input needs to pass for the neuron to fire.


    In practice we tend to use other, related activation functions instead of the
    step function. On the next page you can see three common ones.


    The one on the top is called *sigmoid* because it has an $S$ shape. Its output
    ranges from 0 to 1. A large positive input results in outputs close to 1; a large
    negative input results in an output close to 0. This approximates a biological
    neuron that fires on large inputs and stays silent otherwise, and is a smooth
    approximation to the step function. The activation function in the middle is called
    *tanh*, short for *hyperbolic tangent* (there are various ways to pronounce it:
    "tan-H," "then," or "thents" with a soft th, as in thanks).^3 It looks like the
    sigmoid function, but it differs in that its output ranges from -1 to +1; a large
    negative input results in a negative output, mimicking an inhibitory signal. The
    function at the bottom is called a *rectifier*; it turns all negative inputs to
    0, otherwise its output is directly proportional to its input. The following table
    shows the output of the three activation functions for different inputs.'
