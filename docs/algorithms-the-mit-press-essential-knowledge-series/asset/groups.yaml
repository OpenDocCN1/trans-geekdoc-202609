    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_198_0.png)


    We need again to help the random surfer escape from this trap. This time the solution
    requires more comprehensive changes to the hyperlink matrix. Our initial hyperlink
    matrix allowed the surfer to go from page to page only using the existing links
    in the original graph. We modified the hyperlink matrix to handle rows with all
    zero elements and came up with the $S$ matrix that allowed the surfer to get away
    from dangling nodes. This enabled the random surfer to jump to anywhere in the
    graph when in a dangling node. Now we will change the behavior of the random surfer
