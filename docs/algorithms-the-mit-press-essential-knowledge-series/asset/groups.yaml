    我们现在要描述的另一种简单排序算法也是如此。与选择排序一样，这是一种在计算机之外也易于理解的排序方法。事实上，这就是我们在玩牌游戏时整理手牌的方式。


    想象一下你正在玩一种纸牌游戏，你发了一些牌（例如，你可能在玩拉米牌）。当你一张接一张地拿牌时，你想对对手中的牌进行排序。我们假设牌的等级从低到高排列顺序是：


    2 3 4 5 6 7 8 9 J Q K A


    事实上，在很多游戏（以及拉米牌）中，王牌既可以是最小的也可以最大的，但我们假设只有一种顺序。


    你拿到的每张牌都是独立的，所以开始时手里有一张牌，后面还有九张牌要拿：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_139_0.png)


    现在你拿到了第二张牌；它是一个六：


    六放在四的旁边没问题，所以你把它留在那里，再拿另一张，结果是一个二：


    这次，为了保持手牌有序，你需要将 2 移动到 4 的左侧，从而将 4 和 6 向右移动一位。在拿到另一张牌（一张三）之前，你这样操作：


    你将 3 插入到 2 和 4 之间，然后看到下一张牌是一个九。这已经在你手牌的正确位置了。


    你可以继续处理你的手牌——例如 7, Q, J, 8 和 5。最后，你将得到一副排好序的手牌。

    每张新牌都相对于之前拿到的牌被插入到了正确的位置。正因如此，这种排序方法被称为称为*插入排序*（insertion sort），它适用于任何类型的对象，而不仅仅是扑牌。


    和选择排序一样，插入排序非常容易实现。事实证明它的复杂度相同：O(n²)。不过，它有一个显著的特征：就像我们的扑牌示例一样，*你不需要在排序之前提前知道项目的内容*。实际上，你是在获取它们的同时进行排序的。这意味着当待排序的项目以某种流式方式实时提供给你时，你可以使用插入排序。我们在第
    2 章讨论图中的锦标赛问题时遇到过这种所谓的“实时工作”的算法，我们称之为*在线算法*（online algorithm）。如果我们必须对未知数量的项目进行排序，或者我们必须在被调用时能够立即停止并提供排序列表，那么插入排序就是最佳选择²。


