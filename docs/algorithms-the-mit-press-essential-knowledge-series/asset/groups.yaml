  - '[PAGE 190]


    To get these successive estimates of the pagerank vector we only need to multiply
    the vector in each round with the hyperlink matrix, thereby getting the vector
    for the next round.


    In the first round, we start with a pagerank vector whose contents are all equal
    to $1 / n$, where $n$ is the number of pages. If we denote this first pagerank
    vector by $\pi_1$, the pagerank vector at the end of the first round by $\pi_2$,
    and the hyperlink matrix by $H$, we have:


    $\pi_2 = \pi_1 \times H$


    In each round we use the pagerank vector of that round to calculate the pagerank
    vector for the following round. In the second voting round, where we got our third
    page-rank estimates—that is, our third pagerank vector—we performed the calculation:


    $\pi_3 = \pi_2 \times H = (\pi_1 \times H) \times H = \pi_1 \times (H \times H)
    = \pi_1 \times H^2$


    In the third voting round, we got our fourth pagerank vector:


    $\pi_4 = \pi_3 \times H = (\pi_1 \times H^2) \times H = \pi_1 \times (H^2 \times
    H) = \pi_1 \times H^3$


    As in every iteration, we multiply the result of the previous iteration by the
    hyperlink matrix, and in the end'
  - '[PAGE 191]


    this is a series of products of the successive estimates of the pagerank vector
    by the hyperlink matrix. As we see, this is equivalent to multiplying the initial
    pagerank vector with increasing powers of the hyperlink matrix. This method of
    calculating successive approximations is called the power method. We see therefore
    that the calculation of the pageranks of a set of web pages is an application
    of the power method to the pagerank vector and hyperlink matrix, until the resulting
    pagerank vector does not change, or as we say, until it converges to a stable
    value—our final pagerank metrics.


    We have just reached a more precise description of how to calculate the pageranks
    of a web graph:


    +   1. Form the hyperlink matrix of the graph.


    +   2. Start with initial pagerank estimates, giving a pagerank of $1 / n$ to
    each page, where $n$ is the total number of pages.


    +   3. Apply the power method, multiplying the pagerank vector by the hyperlink
    matrix until the values of the pagerank vector converge.


    Apart from being succinct, this formulation allows us to transfer the problem
    to the realm of linear algebra, the branch of mathematics that treats matrices
    and operations on them. There is a well-established body of theory'
  - "[PAGE 192]\n\nthat we can use to investigate the power method as well as performant\
    \ implementations of matrix operations, such as the multiplication that we described.\
    \ The matrix formulation of the problem will also help investigate whether the\
    \ power method will *always* converge so that we can always come up with a solution\
    \ to the pageranks of a graph.\n\n# Dangling Nodes and the Random Surfer\n\nWe\
    \ now now turn to an example of a simpler graph, consisting of just three nodes:\n\
    \n![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_192_0.png)\n\nWe want to find the pageranks\
    \ of these three nodes. We follow the same algorithm. We initialize the pagerank\
    \ vector to 1 / 3, giving equal pageranks to all nodes. Then we multiply the pagerank\
    \ vector with the hyperlink matrix, which is:\n\n```\n$\begin{bmatrix} 0 & 1/2\
    \ & 1/2 \\ 0 & 0 & 1 \\ 0 & 0 & 0 \\end{bmatrix}$\n```"
  - '[PAGE 193]


    If we start the iterations of the power method, multiplying the pagerank vector
    with the hyperlink matrix to update the pagerank vector, and then again and again,
    we''ll find out that after four iterations, all pageranks have gone down to zero:


    | Round | Page 1 | Page 2 | Page 3 |

    |---|---|---|--|

    | start | 0.33 | 0.33 | 0.33 |

    | 1 | 0.00 | 0.17 | 0.50 |

    | 2 | 0.00 | 0.00 | 0.17 |

    | 3 | 0.00 | 0.00 | 0.00 |


    That is clearly a problem. We do not expect all pages to have zero importance
    here. After all, page 3 has two backlinks, so somehow we would expect this to
    show on the results, let alone the fact that we also want the total sum of the
    pageranks to be one. Here nothing ended up being of any import at all.


    The cause of the problem is node 3. Although this node has backlinks and would
    thereby gain importance, it has no outgoing links. So in a way it sucks importance
    from the rest of the graph, but does not redistribute it anywhere. It acts as
    a selfish node or black hole: what goes in, does not go out. After a few iterations,
    it has acted as a sink where all pagerank values have gone in and vanished.'
  - '[PAGE 194]


    Such nodes are called dangling nodes because they hang at the (dead) ends of the
    graph. On the web, nothing prohibits the existence of such pages. Although web
    pages usually have both incoming and outgoing links, a page with no outgoing links
    can appear and would wreak havoc with the power method as we have described it.


    To overcome the problem, we work with a metaphor. We imagine that we have a human
    who surfs the web, jumping from page to page. To go from one page to another,
    the surfer normally follows a link. But then the surfer on a dangling node: a
    page with no links to any other page. We don''t want our surfer to remain trapped
    in there so we give the surfer the capability to jump to any other page, anywhere
    on the web. It is as if we are surfing the web from page to page until we reach
    a dead end. When we get there, we don''t give up and stop. We can always type
    another address in our web browser and move to any other web page we want, even
    if no links exist to it from the dangling page. This is what we want our surfer
    to do. When at a loss about where to go, the surfer will pick a page, from the
    web and go there to continue surfing. The surfer becomes a random surfer, equipped
    with a teleportation device that can take the surfer instantly to any place at
    all.


    To take this metaphor back to pagerank, we interpret the hyperlink matrix as giving
    us probabilities that a surfer will follow a link to go to a particular page.
    In our'
  - '[PAGE 195]


    three-nodes example, the first row of the hyperlink matrix tells us that when
    on page 1, the surfer will choose either page 2 or 3 with equal probability. The
    second row tells us that when on page 2, the surfer will always choose to visit
    page 3. Going back to our first example for a moment, if the surfer lands on page
    5, then it is possible to go to page 2, 3, or 4 with a probability of 1 / 3 for
    each of these outcomes.


    A dangling node manifests itself in the presence of a row full of zeros. Then
    there is no probability that the surfer will go anywhere. This is where the random
    surfer kicks in. As we said, that surfer will jump to any page in the graph. That
    means that in effect, we change the hyperlink matrix so that it no longer has
    rows with zeros. As we want the surfer to jump to any web page with equal probability,
    instead of zeros we''ll fill the row with 1 / n, or in our example, 1 / 3. Our
    matrix will become:


    ```

    [ 0 1/2 1/2

    0 0 1

    1/3 1/3 1/3 ]

    ```


    The surfer who lands on page 3 can go to any page in the graph with equal probability.
    The surfer may even stay temporarily on the same page, but that does not matter,
    as the surfer can try again and again, and at some point a different target page
    will be selected at random.'
