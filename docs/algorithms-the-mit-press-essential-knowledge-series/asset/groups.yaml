    It can be proven that even though a neuron on its own cannot not do much, a neural
    network can perform any computational task that can be described algorithmically
    and run on a computer. Therefore there is nothing that a computer can do that
    a neural network could not do. The whole idea, of course, is that we do not need
    to tell the neural network exactly how to perform a task. We only need to feed
    it with examples while using an algorithm to make the neural network learn how
