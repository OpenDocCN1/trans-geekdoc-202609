  - '[PAGE 282]


    # polynomial time


    Time proportional to the input to an algorithm raised to a constant power, such
    as $O(n^r)$.


    # power method


    An algorithm that starts with a vector, multiplies it by a matrix, and then repeatedly
    multiplies the result by the matrix until it converges into a stable value. The
    power method is at the heart of PageRank; the vector at which it converges is
    the first eigenvector of the Google matrix.


    # program


    A set of instructions, written in a programming language, that describes a computational
    process.


    # programming


    The art of writing computer programs.


    # programming language


    An artificial language that can be used to describe computational steps. A programming
    language can be executed on a computer. Like a human language, a programming language
    has syntax and grammar, specifying what can be written in it. Several programming
    languages exist, and new programming languages are developed all the time in an
    effort to make programming more productive (or because many people cannot resist
    creating their own language and hope it will be widely adopted). A programming
    language can be high level, when it looks somewhat akin to a human language, or
    low level, when its constructs are rudimentary, mirroring the underlying hardware.


    # punched card


    A piece of stiff paper that records information by the location of the punched
    holes on it. It is also called a punch card. The cards were used in early computers,
    and further that, in machines such as Jacquard looms, in which they described
    the pattern to be woven.


    # quantum computer


    A computer that leverages quantum phenomena to perform computations. Quantum computers
    work with qubits instead of bits. Some problems can be solved much faster on quantum
    computers than on classical ones. The manufacture of quantum computers presents
    difficult physical challenges.'
  - '[PAGE 283]


    # qubit


    The basic unit of quantum information. A qubit can exist in a superposition of
    two states, 0 and 1, until we measure it, when it collapses to one of the two
    binary values. A qubit can be implemented using quantum properties, such as the
    spin of an electron.


    # quicksort


    A sorting method that works by repeatedly selecting an item and moving the other
    items around it so that all smaller items are on one side and all the rest on
    its other side.


    # radix sort


    A sorting method that works by breaking the keys into their parts (example, for
    numerical keys) and placing the items into piles corresponding to the values of
    their parts (ten piles, one for each digit). We start by forming piles based on
    the last digit, then we stack all piles and redistribute to piles based on the
    next digit, but last digit, and so on. When we do the procedure for the first
    digit, we end up with a sorted pile. It is a string sorting method because we
    treat numerical keys as a string of digits.


    # random surfer


    A person whofs the web by going from page to page, choosing the next page according
    to the probability given by the Google matrix.


    # randomization


    The use of randomness in algorithms. In this way, an algorithm may be able to
    find good solutions to a problem in most cases, even if it would be computationally
    infeasible to find the optimal solution.


    # record


    A set of related data describing an entity for a particular application. For example,
    a student record can include identification data, enrollment year, and transcripts.


    # rectifier


    An activation function that turns all negative inputs to zero, or otherwise its
    output is directly proportional to its input.'
  - '[PAGE 284]


    A method in graph algorithms, where we assign the worst possible value to the
    values we want to find, and the algorithm proceeds by producing better and better
    estimates for these values. We therefore start with the most extreme values possible,
    and gradually relax them with values that are closer and closer to the final result.


    # ReLU


    A neuron that uses a rectifier as its activation function. ReLU stands for rectified
    linear unit.


    # search space


    The domain of values in which we search.


    # secretary problem


    An optimal stopping problem. From a pool of candidates, we examine each one in
    turn. We must make the decision to hire or not on the spot, without being able
    to reverse past decisions, and without having examined the remaining candidates.


    # selection


    In algorithms and programming, a choice, based on some logical condition, between
    alternative series of steps to be executed.


    # selection sort


    A sorting method where each time we find the minimum of the unsorted items and
    put it into its correct position.


    # self-organizing search


    Search algorithms that take advantage of the popularity of search items by moving
    them to positions where we''ll be able to find them faster.


    # sequence


    In algorithms and programming, a series of steps executed one after the other.


    # shortest path


    The shortest path between two nodes in graph.


    # sigmoid


    An S-shaped function whose values range from 0 to 1.'
  - '[PAGE 285]


    # social network


    A graph in which nodes are people, and the edges are the relationships between
    them.


    # softmax


    An activation function that takes as input a vector of real numbers and turns
    it into another vector that is a probability distribution.


    # software


    The set of programs running on a computer or digital device; the term hardware.
    The terms have been used before computers in a different setting. In 1850, rubbish-tip
    pickers were using the terms "soft-ware" and "hard-ware" to distinguish between
    material that would decompose and everything else. These meanings may bring solace
    to anybody struggling with a computer that won''t do what it is supposed to do.


    # spallation


    Breaking a material into smaller pieces. In nuclear physics, the material is a
    heavy nucleus that emits a large number of protons and neutrons after being bombarded
    with a high-energy particle.


    # sparse matrix


    A matrix in which most elements are equal to zero.


    # string


    A sequence of symbols. Traditionally a string was a sequence of characters, but
    nowadays what can go into a string depends on the actual application; it may be
    digits, alphabetical characters, punctuation, or even more recently invented symbols
    such as emojis.


    # string sorting method


    A sorting method that treats its keys as a sequence of symbols. For example, the
    key 1234 is treated as the string of symbols 1, 2, 3, 4 instead of the number
    1,234.


    # supervised learning


    A machine learning approach in which we provide an algorithm with problems accompanied
    by their solutions.'
  md: '

    # Moore''s law


    The observation, made in 1965 by Gordon Moore, founder of Fairchild Semi-conductor
    and Intel, that the number of transistors in an integrated circuit doubles about
    every two years. It is an example of exponential growth.


    # move to front


    A self-organizing search algorithm. When we find the item we are looking for,
    we move it to the first position.


    # multigraph


    A graph in which an edge can occur more than once.


    # multiset


    A set in which an element can appear multiple times; in mathematics, in a normal
    set an element cannot appear more than once.


    # node


    An item in various data structures. Items in lists are called nodes.


    # neuron


    A neuron is a cell that forms the basic building block of the nervous system.
    It receives signals from other neurons and propagates them to other neurons in
    the nervous system.


    # null


    Nothingness in a computer.


    # online algorithm


    An algorithm that does not require the full input to a problem in order to produce
    a solution. An online algorithm gets the input incrementally, as it arrives, and
    at each point produces a solution that takes account of the input it has received
    so far.


    # onset


    The accented part of a rhythm.


    # optimal stopping problem


    The problem of knowing the best time to stop when you are trying to maximize a
    reward or minimize a penalty. Algorithms that optimize the value of a function.
    In machine learning, optimizers typically minimize the value of the loss function.


    # overfitting


    The equivalent of learning by rote in machine learning. The model that we are
    trying to train follows the training data so closely that it fits too well. As
    a result, it does not predict correct values for other, unknown data.


    # overflow


    Going beyond the range of allowable values on a computer.


    # PageRank


    An algorithm used to rank web pages in terms of their importance. It was developed
    by the founders of Google and was the foundation of the Google search engine.
    The rank of a web page is its pagerank.


    # pagerank vector


    A vector containing the pageranks of a graph.


    # partial derivative


    In a function of many variables, the derivative of the function with respect to
    one variable, holding all other variables constant.


    # path


    In a graph, a sequence of edges that connect a sequence of nodes.


    # path length


    The sum of the weights along a path in a graph. If a graph does not have weights,
    it is the number of the links constituting the path.


    # Perceptron


    An artificial neuron that uses the step function for its activation.


    # permutation


    A rearrangement of some data in a different order.


    # pointer


    A place in computer memory that holds the address of another place in computer
    memory. In this way, the former points to the latter.


    # polynomial time


    Time proportional to the input to an algorithm raised to a constant power, such
    as $O(n^r)$.


    # power method


    An algorithm that starts with a vector, multiplies it by a matrix, and then repeatedly
    multiplies the result by the matrix until it converges into a stable value. The
    power method is at the heart of PageRank; the vector at which it converges is
    the first eigenvector of the Google matrix.


    # program


    A set of instructions, written in a programming language, that describes a computational
    process.


    # programming


    The art of writing computer programs.


    # programming language


    An artificial language that can be used to describe computational steps. A programming
    language can be executed on a computer. Like a human language, a programming language
    has syntax and grammar, specifying what can be written in it. Several programming
    languages exist, and new programming languages are developed all the time in an
    effort to make programming more productive (or because many people cannot resist
    creating their own language and hope it will be widely adopted). A programming
    language can be high level, when it looks somewhat akin to a human language, or
    low level, when its constructs are rudimentary, mirroring the underlying hardware.


    # punched card


    A piece of stiff paper that records information by the location of the punched
    holes on it. It is also called a punch card. The cards were used in early computers,
    and further that, in machines such as Jacquard looms, in which they described
    the pattern to be woven.


    # quantum computer


    A computer that leverages quantum phenomena to perform computations. Quantum computers
    work with qubits instead of bits. Some problems can be solved much faster on quantum
    computers than on classical ones. The manufacture of quantum computers presents
    difficult physical challenges.


    # qubit


    The basic unit of quantum information. A qubit can exist in a superposition of
    two states, 0 and 1, until we measure it, when it collapses to one of the two
    binary values. A qubit can be implemented using quantum properties, such as the
    spin of an electron.


    # quicksort


    A sorting method that works by repeatedly selecting an item and moving the other
    items around it so that all smaller items are on one side and all the rest on
    its other side.


    # radix sort


    A sorting method that works by breaking the keys into their parts (example, for
    numerical keys) and placing the items into piles corresponding to the values of
    their parts (ten piles, one for each digit). We start by forming piles based on
    the last digit, then we stack all piles and redistribute to piles based on the
    next digit, but last digit, and so on. When we do the procedure for the first
    digit, we end up with a sorted pile. It is a string sorting method because we
    treat numerical keys as a string of digits.


    # random surfer


    A person whofs the web by going from page to page, choosing the next page according
    to the probability given by the Google matrix.


    # randomization


    The use of randomness in algorithms. In this way, an algorithm may be able to
    find good solutions to a problem in most cases, even if it would be computationally
    infeasible to find the optimal solution.


    # record


    A set of related data describing an entity for a particular application. For example,
    a student record can include identification data, enrollment year, and transcripts.


    # rectifier


    An activation function that turns all negative inputs to zero, or otherwise its
    output is directly proportional to its input.


    # A method in graph algorithms, where we assign the worst possible value to the
    values we want to find, and the algorithm proceeds by producing better and better
    estimates for these values. We therefore start with the most extreme values possible,
    and gradually relax them with values that are closer and closer to the final result.


    # ReLU


    A neuron that uses a rectifier as its activation function. ReLU stands for rectified
    linear unit.


    # search space


    The domain of values in which we search.


    # secretary problem


    An optimal stopping problem. From a pool of candidates, we examine each one in
    turn. We must make the decision to hire or not on the spot, without being able
    to reverse past decisions, and without having examined the remaining candidates.


    # selection


    In algorithms and programming, a choice, based on some logical condition, between
    alternative series of steps to be executed.


    # selection sort


    A sorting method where each time we find the minimum of unsorted items and put
    it into its correct position.


    # self-organizing search


    Search algorithms that take advantage of the popularity of search items by moving
    them to positions where we''ll be able to find them.


    # sequence


    In algorithms and programming, a series of steps executed one after the other.


    # shortest path


    The shortest path between two nodes in graph.


    # sigmoid


    An S-shaped function whose values range from 0 to 1.


    # social network


    A graph in which nodes are people, and the edges are the relationships between
    them.


    # softmax


    An activation function that takes as input a vector of real numbers and turns
    it into another vector that is a probability distribution.


    # software


    The set of programs running on a computer or digital device; the hardware. The
    terms have been used before computers in a different setting. In 1850, rubbish-tip
    pickers were using the terms "soft-ware" and "hard-ware" to distinguish between
    material that would decompose and everything else. These meanings may bring solace
    to anybody struggling with a computer that won''t do what it is supposed to.


    # spallation


    Breaking a material into smaller pieces. In nuclear physics, the material is a
    heavy nucleus that emits a large number of protons and neutrons after being bombarded
    with a high-energy particle.


    # sparse matrix


    A matrix in which most elements are equal to zero.


    # string


    A sequence of symbols. Traditionally a string was a sequence of characters, but
    nowadays what can go into a string depends on the actual application; it may be
    digits, alphabetical characters, punctuation, or even recently invented symbols
    such as emojis.


    # string sorting method


    A sorting method that treats its keys as a sequence of symbols. For example, the
    key 1234 is treated as the string of symbols 1, 2, 3, 4 instead of the number
    1,234.


    # supervised learning


    A machine learning approach in which we provide an algorithm with problems accompanied
    by their solutions.

    '
  mdcn: '


    # 摩尔定律


    费奇尔半导体和英特尔创始人戈登·摩尔在1965年提出的观察：集成电路中的晶体管数量大约每两年翻一倍。这是指数级增长的一个例子。


    # 前移搜索


    一种自组织搜索算法。当我们找到正在查找的项时，将其移动到第一个位置。


    # 多图


    一种边可以出现多次图。


    # 多重集


    一种元素可以出现多次的集合；在数学中，在普通集合中一个元素不能出现超过一次。


    # 节点


    各种数据结构中的项。列表中的项被称为节点。


    # 神经元


    神经元是构成神经系统基本构建单元的细胞。它接收来自其他神经元的信号，并将其传播到神经系统中的其他神经元。


    # 空值


    计算机中的无物。


    # 在线算法


    一种不需要获取问题的完整输入就能产生解决方案的算法。在线算法随着输入的到来增量地获取输入，并在每个点产生一个考虑了目前已接收输入的解决方案。


    # 起始节


    节奏中的重音部分。


    # 优停止问题


    在试图最大化奖励或最小化惩罚时，知道何时停止的最佳时间的问题。优化函数值的算法。在机器学习中，优化器通常最小化损失函数的值。


    # 过拟合


    机器学习中等同于死记硬背的学习。我们试图训练的模型与训练数据过于接近，以至于拟合得过好。结果是它无法对其他未知数据预测正确的值。


    # 溢出


    超出计算机允许的数值范围。


    # PageRank


    一种用于根据重要性对网页进行排名的算法。它由Google的创始人开发，是Google搜索引擎的基础。网页的排名就是其 pagerank。


    # pagerank向量


    一个包含图中 pagerank 值的向量。


    # 偏导数


    在多元函数中，保持所有其他变量不变，函数对其中一个变量的导数。


    # 路径


    在图中，连接一系列节点的边序列。


    # 路径长度


    图中路径沿线的权重之和。如果图没有权重，则它是构成路径的链接数量。


    # 感感知


    一种使用阶跃函数作为激活函数的人工神经元。


    # 排


    以不同的顺序对某些数据进行重新排列。


    # 指针


    计算机内存中存储计算机内存中另一个位置地址的地方。通过这种方式，前者指向后者。


    # 多项式时间


    时间与算法的输入的常数幂正比，例如 $O(n^r)$。


    # 幂方法


    一种从向量开始，将其乘以矩阵，然后反复将结果乘以矩阵，直到其收敛到一个稳定值。幂方法是PageRank的核心；它收敛的向量是Google矩阵的第一特征向量。


    # 程序


    一组用编程语言编写的、描述计算过程的指令。


    # 编程


    编写计算机程序的艺术。


    # 编程语言


    一种可以用于描述计算步骤的人造语言。编程语言可以在计算机上执行。像人类语言一样，编程语言有语法和规则，规定了可以在其中编写的内容。存在多种编程语言，新的编程语言不断被开发，以提高编程的效率（或因为许多人无法抵制创建自己的语言，并希望它被广泛采用）。编程语言可以是高级的，当它类似于人类语言时；也可以是低级的，当它的结构是原始的，反映了底层硬件。


    # 打孔卡


    通过纸上打孔的位置记录信息的硬纸。它也被称为打孔卡。这些卡片用于早期计算机，此外用于雅卡织布机等机器，它们描述了要织的图案。


    # 量子计算机


    一种利用量子现象进行计算的计算机。量子计算机使用量子比特（qubit）而不是比特位。某些问题在量子计算机上的解决速度比经典计算机快得多。量子计算机的制造面临着困难的物理挑战。


    # 量比特


    量子信息的基本单位。量子比特可以以0和1两个状态的叠加态存在，直到我们对其进行测量，此时它塌缩为二进制值之一。量子比特可以使用量子属性（如电子自旋）来实现。


    # 快排序


    一种排序方法，通过反复选择一个项并移动其周围的其他项，使得所有较小的项都在一侧，其余所有项都在另一侧。


    # 基数排序


    一种排序方法，通过将键拆分为各个部分（例如，数值键）并将项放在与其部分值对应的堆中（十个堆，每个数字一个）。我们首先根据最后一位数字形成堆，然后堆叠所有堆并根据下一位数字重新分配到堆中，以此类推。当我们对第一位执行此过程时，最终得到一个排序有序的堆。这是一种字符串排序方法，因为我们将数值键视为数字字符串。


    # 随机冲浪者


    一个通过在页面之间跳转浏览网页，根据Google矩阵提供的概率选择下一个页面的人。


    # 随机化


    在算法中使用随机性。通过这种方式，算法即使在寻找最优解在计算上是不可行的，在大多数情况下也能为问题找到良好的解决方案。


    # 记录


    一组描述特定应用程序实体的相关数据。例如，学生记录可以包含身份数据、入学年份和成绩单。


    # 整流器


    一种将所有负输入转为零的激活函数，否则其输出与其输入成正比。


    # 图算法中的一种方法，我们为想要找到的值分配最坏的值，算法通过产生对这些值不断更好的估计值来进行。因此，我们从可能的极端值开始，并逐渐用接近最终结果的值来松弛它们。


    # ReLU


    一种使用整流器作为激活函数的神经元。ReLU代表整流线性单元。


    # 搜索空间


    我们搜索的数值范围。


    # 秘书问题


    一种优停止问题。从候选池中，我们轮流检查每个人。我们必须在现场做出雇用或不雇用的决定，无法撤销过去的决定，也无法检查剩余的候选人。


    # 选择


    在算法和编程中，基于某些逻辑条件，在待执行的备选步骤之间进行选择。


    # 选择排序


    一种排序方法，每次都找到未排序项的最小值并将其放入正确位置。


    # 自组织搜索


    利用搜索项的流行程度将其移动到我们可以找到的位置的搜索算法。


    # 序列


    在算法和编程中，一个顺序执行的步骤。


    # 最短路径


    图中两个节点之间的最短路径。


    # sigmoid


    一种值范围从0到1的S型函数。


    # 社会网络


    节点是人，边是他们之间关系的图。


    # softmax


    一种将实数向量作为输入并转换为概率分布向量的激活函数。


    # 软件


    运行在计算机或数字设备上的程序集；硬件。这些术语在计算机出现之前曾在不同的背景下使用。在1850年，垃圾挑选者使用“soft-ware”（软货物）和“hard-ware”（硬货物）来区分会分解的物质和其他物质。这些含义可能会给与不听话的计算机作斗的人带来慰藉。


    '
