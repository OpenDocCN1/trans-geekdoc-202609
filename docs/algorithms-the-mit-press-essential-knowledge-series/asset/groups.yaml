    # Scheduling a Tournament


    Suppose you are organizing a tournament in which the contestants will compete
    in pairs, so we''ll have a series of matches. We have eight contestants, and each
    contestant will play four matches. Our problem is how to schedule the tournament.
    We want to schedule the matches so that each contestant plays only one match per
    day.


    An obvious solution is to have just one match per day and allow the tournament
    to last as long as needed. As we have eight contestants and each contestant plays
    four matches, the tournament would roll out over 16 days (8×4 / 2; we divide by
    two so as not to count each match twice. We''ll name the eight contestants Alice,
    Bob, Carol, Dave, Eve, Frank, Grace, and Heidi. This allows us to use only the
    initial letter of their names to identify them.


    We can find a better solution if we model the problem as a graph. We''ll have
    a vertex for each player and an edge for each match. Then the graph will look
    like the one on the left below. On the right, we have labeled the edges with the
    day on which which the corresponding match will take place. How did we find this
    solution?


