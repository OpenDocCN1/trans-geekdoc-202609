    在遇到下一个复杂度族之前，我们需要简要了解一下事物增长或收缩的特定方式。如果你多次加上某物，你就是在进行乘法。如果你多次乘以某物，你就是在对其进行幂运算或指数化处理。我们刚刚看到像
    $10^1$ 这样带有指数的数字变得有多大。可能并非显而易见的是幂运算是如何迅速导致眩晕的升级的——这种现象被称为指数增长。


    关于象棋发明的可能不传的故事很有说明性。象棋发明地的国家统治者询问发明者他想要什么作为礼物（唉，在这些故事里是个“他”）。他回答说，他想要棋盘的第一格有一粒米，第二格两粒，第三格四粒，依此类推。国王认为自己占了大便宜，就答应了这个愿望。不幸的是，事情很快变糟了。序列按
    2 的幂次方增长：第一格是 $2^0 = 1$，第二格是 $2^1 = 2$，第三格是 $2^2 = 4$，因此在最后一格，米米的数量将是 $2^{63}$，这是一个任何手段都无法达到的数量（它等于
    9,223,372,036,854,775,808，或者大约 9 穰）。


    指数增长也能帮助我们理解为什么折叠纸很多次如此困难。你每折叠一次，折叠的层数就会翻倍。折叠 10 次后，你有 $2^{10}=1,024$ 层。如果你的纸厚度是
    0.1 毫米，你现在有一团厚度超过 10 厘米的折叠纸。除了将其折叠所需的所需的巨大力量外，这在物理上可能完全是不可能的，因为要折叠某个东西，它的长度必须大于厚度。


    指数增长是多年来计算机越来越强大的原因。根据摩尔定律，集成电路中的晶体数量大约每两年增加一倍。该定律以戈登·摩尔命名，他是费尔尔半导体和英特尔的创始人。他在
    1965 年提出了这一观察；因此，我们从 1971 年处理器中约 2,000 个晶体管（英特尔 4004）变成了 2017 年的 190 亿多个（32 核心
    AMD Epyc）。$^8$


    看到增长后，让我们探索它的对立面。如果你有某物的倍数，使用除法来逆转操作并获得原始值。如果你有某物的幂，$a^x$，如何逆转该操作？幂运算的逆是对数。


    对数有时被视为大众数学与入门级数学之间的界限；如果对数看起来有些模糊，请记住对数是幂运算的逆。正如当我们进行幂运算时是在重复相乘法，当我们取对数时，是在重复相除法。对数是问题的答案：“我应该将
    $a$ 于多少次方才能得到 $x$？”我们提升的数字被称为对数的*底数*。对数的符号为 $\log_x a$，它对应于问题：“我应该将 $a$ 于多少次方才能得到
    $x$？”当 $a=10$ 时，我们省略下标，因为以 10 为底是对数很常见，所以我们不写 $\log_{10}x$，而是写 $\log x$。还有其他底数。当底数是常数
    $e$ 时，我们写 $lnx$。常数 $e$，称为欧数，大约等于 2.7128。在自然科学中我们经常遇到 $lnx$，这就是它被称为自然对数。另一个常见的底数是
    2，我们不写 $log_2x$ 而写 $lg$。二底对数在计算机科学和算法中很常见，但在这些领域之外可能未使用，尽管我们已经遇到过它们。在折叠纸中，如果一团纸有
    1,024 层，它被折叠了 $lg1024 = lg2^{10}$ 次。在象棋例子中，米的数量源于我们执行的翻倍次数，这些次数是 $lg2^{63} = 63$。我们在算法中频繁使用
    $lg$ 的原因是，每当我们通过将问题分成两个相等的小问题来解决问题时，它就会出现；这被称为分治法，它的工作原理就像折叠纸张。在有序组中搜索某项的最有效方法复杂度是
    $O(lgn)$。这非常惊人；它意味着在十亿个有序项目中查找某项，我们只需要 $lg10^9 \approx 30$ 次探测。具有对数复杂度的算法仅次于常数时间的算法。接下来是运行
    $O(n)$ 的算法，它们被称为线性时间算法，因为它们的时间随 $n$ 成正比增长；这意味着它们作为 $n$ 的倍数增长。我们看到在一个项目序列中搜索一个项

