    # SERIES FOREWORD


    The MIT Press Essential Knowledge series offers accessible, concise, beautifully
    produced pocket-size books on topics of current interest. Written by leading thinkers,
    the books in this series deliver expert overviews of subjects that range from
    the cultural and the historical to the scientific and the technical.


    In today''s era of instant information gratification, we have ready access to
    opinions, rationalizations, and superficial descriptions. Much harder to come
    by is the foundational knowledge that informs a principled understanding of the
    world. Essential Knowledge books fill that need. Synthesizing specialized subject
    matter for nonspecialists and engaging critical topics through fundamentals, each
    of these compact volumes offers readers a point of access to complex ideas.


    # PREFACE


    I know two young teenagers who possess more knowledge than any scientist, philosopher,
    or scholar of ages past. They are my sons. No, I am not a doting father who marvels
    at how extraordinarily gifted his children are. But these two kids have in their
    pockets devices that connect them with the vastest repository of information that
    has ever been created. There is no factual question they cannot answer, now that
    they have mastered the art of knowing where to look on the internet. They can
    translate from and to foreign languages without having to browse through hefty
    dictionaries—which we keep in the house so they know how things were, only a few
    years back. News, from anywhere, reach them in an instant. They can communicate
    with their peers before you know it, no matter where in the world they may live.
    They can plan their goings out in perfect detail. Alas, they can waste their time
    with abandon playing games or following trends that change so fast that I do not
    know why they matter.


    All the above have become possible thanks to the huge advances in digital technology.
    Today we carry more computing power in our pockets than used to ferry humans to
    the moon. As these two teenagers show, the changes in our lives have been immense;
    predictions for the future vary from utopias, where people will really not need
    to work, to dystopias, where the privileged few will lead fulfilling lives, with
    the rest being condemned to inconsequential torpor. Frankly, we are able to shape
    this future, and an important factor in our ability to do this is how conversant
    we are with the technologies that underlie the achievements and the changes before
    us. Although we may lose sight of it in the bustle of the everyday lives, we live
    in the best period of human history. We are healthier than we have ever been,
    and expect to live longer, on average, any generation that has ever lived. Despite
    the iniquity of glaring inequality, huge swathes of humanity have gotten rid of
    the shackles of poverty. We have never been closer to one another, both virtually
    and literally.


    To partake in this progress, it is not enough to use technology. We must be able
    to understand it. First, because we are not professional programmers, we must
    know the underlying principles. Second, in order to appreciate its potential,
    we must know it works. Digital technology is enabled as much by its hardware,
    the physical components that make up computers and digital devices as by its software,
    the programs that run on it. The backbone of programs are the algorithms they
    implement: the set of instructions that describe the way.


    What we need to know changes through time. For most of human history, schooling
    was not deemed at all. In the beginning of the nineteenth century, more than 80
    percent of the world’s population was unschooled; now the vast majority has attained
    several years of school, and it is projected that by the end of the century, the
    proportion of unschooled people will fall to zero. The years we spend on education
    have also increased. While in 1940 less 5 percent of Americans had a bachelor’s
    degree, by 2015 almost a third of them did. Back in the nineteenth century, no
    school would teach molecular biology because nobody knew anything about it DNA
    wasn’t discovered until well into the twentieth century. It now forms part of
    what we accept as the canon of an educated person’s learning. Similarly, even
    though algorithms were discovered in antiquity, few people—we have reached a point
    where algorithms are inside the core of what we consider to be essential. Digital
    technology is enabled as much by its hardware, the physical components that make
    up computers and digital devices, as by its software, the programs that run on
    it. The backbone of programs are the algorithms they implement—troubled with them
    until the advent of modern computers.


    The author firmly believes that we have reached a point where algorithms are inside
    the core of what we consider to be essential. Unless we know what they are and
