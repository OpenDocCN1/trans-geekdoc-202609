  - "[PAGE 274]\n\n# eigenvector\n\nIn linear algebra, an eigenvector is a vector\
    \ that, when we multiply it by a specific matrix, the result is the same vector\
    \ multiplied by a number; that number is its eigenvalue. PageRank finds the first\
    \ eigenvector of the Google matrix—that is, the eigenvector of the Google matrix\
    \ with the largest eigen-value, which is equal to one.\n\n# epoch\n\nIn machine\
    \ learning, a pass, during training, through the whole training data set.\n\n\
    # Euclid’s algorithm\n\nAn algorithm for finding the greatest common divisor of\
    \ two integers, presented in the Elements, a set of 13 books written by the ancient\
    \ Greek mathematician Euclid (ca. 300 BCE). The Elements treats geometry and number\
    \ theory, starting from axioms and proving theorems based on the axioms. It is\
    \ the oldest extant work of mathematics that uses this deductive approach, and\
    \ such, one of the most influential books in the history of science.\n\n# Eulerian\
    \ path\n\nA trail through a graph such that each edge is visited exactly once.\
    \ It is also called a Eulerian walk.\n\n# Eulerian tour\n\nA Eulerian path that\
    \ starts and ends at the same node. It is also called a Eulerian tour.\n\n# Euler’s\
    \ number\n\nThe mathematical constant $e$, approximately equal to 2.71828. It\
    \ is the limit of $(1 + 1 / n)$ as $n$ approaches infinity.\n\n# execution path\n\
    \nThe series of steps that an algorithm carries out during its execution.\n\n\
    # exponential growth\n\nA pattern in which a number of things is successively\
    \ multiplied by itself. For example, we may start with $a$ things, and then we'll\
    \ get $a \times a$ things, then $a \times a \times a$, and in general $a \times\
    \ a \times \\dots \times a = a^n$. Numbers grow fast with exponential growth."
  - '[PAGE 275]


    # factorial


    The factorial of a natural number n is the product of all numbers from 1 up to
    and including n. We use the symbol n! so we have n! = 1 × 2 × ··· × n. The definition
    can be extended to all real numbers, but that does not concern us here.


    # factorial complexity


    Computational complexity that follows factorial growth. In big O notation, it
    is O(n!).


    # fire (neuron)


    See activation (neuron).


    # fitting


    In machine learning, the process of learning from the data. In this process we
    construct a model that fits the observations.


    # garbage in, garbage out


    If we feed a program garbage, instead of its expected input, we should expect
    no miracles: the program will produce garbage instead of its expected output.


    # global optimum


    The best overall solution to a problem.


    # Google matrix


    A special kind of matrix (a modification of the hyperlink matrix) that is used
    in the power method in the PageRank algorithm.


    # gradient


    A vector containing all the partial derivatives of a function.


    # graph


    A set of nodes, also called vertices, and edges, also called links, connecting
    them. Graphs can be used to model any kind of linked structure, from people to
    computer networks. As a result, many problems can be modeled as graphs, and many
    algorithms have been developed that work on top of them.


    # graph coloring


    The edge or vertex coloring of a graph.'
  - '[PAGE 276]


    # graphics processing unit (GPU)


    A chip specially designed to handle the instructions for the creation and manipulation
    of images inside a computer.


    # greatest common divisor (gcd)


    Given two integers, the largest integer that divides both.


    # greedy algorithm


    An algorithm in which we have to choose between alternative courses of action,
    we choose the one that gives us the greatest immediate payoff. This does not necessarily
    lead to the optimum outcome in the end.


    # hardware


    The physical components that make up a computer or digital device. The term complements
    software.


    # head


    The first item in a list.


    # heuristic


    A strategy for making choices among alternatives in an algorithm. A greedy heuristic
    would require us to take the option that looks best right now (never mind what
    could happen in the future).


    # hidden layer


    A neural network layer that is not directly connected to the input or output of
    the network.


    # Hierholzer algorithm


    An algorithm for finding Eulerian circuits on graphs. It was published by the
    German mathematician Carl Hierholzer in 1873.


    # hill climbing


    A metaphor for describing problem solving. The solution is at the top of the hill,
    and we have to climb from its foot. At each step there may be a decision to take
    among alternative paths. Depending on our choices, we may select the best path
    overall, a path that is not the best but still takes us to the top, or a path
    that leads to a plateau. If the worst happens and we reach a plateau, we’ll have
    to go back to a previous position to start moving along a different path.'
  - '[PAGE 277]


    # hyperlink


    A reference from a text to another part of the text or a different text. On the
    web, hyperlinks are links between web pages that the user may follow while browsing.


    # hyperlink matrix


    A matrix representing the structure of a graph; it is like an adjacency matrix,
    but we divide the elements of its row by the number of nonzero elements in the
    row.


    # hyperplane


    The generalization of the plane in more than three dimensions.


    # hypertext


    Text that contains hyperlinks.


    # image recognition


    The computational task of recognizing patterns in images.


    # insertion sort


    A sorting method where we take each item and insert it into its correct position
    among the already sorted items.


    # internet


    A global network of computers and digital devices, interconnected by means of
    a common suite of communication protocols. Initially, it was with its first letter
    capitalized (Internet) because internet could refer to any network that extended
    beyond the internal confines of an institution, which is called an intranet. As
    the global internet took off, however, the initial capital fell out of favor,
    probably saving a significant amount of ink.


    # intractable problem


    A problem for which the best algorithms we know will take an inordinate amount
    of time to handle anything but trivial cases.


    # iteration


    See loop.'
  - '[PAGE 278]


    # key


    A part of a record that we use for sorting or finding it. A key may be atomic,
    when it cannot be decomposed into smaller parts (for instance, identification
    number), or composite, when it consists of smaller pieces of data (like the full
    name comprising first name, middle name, and surname).


    # label


    In machine learning, a value representing the category to which an observation
    belongs. In training, the computer is given problems along with their solutions;
    when the problem is classification, the solutions are the labels representing
    the classes.


    # linear search


    A search algorithm in which we examine each item in turn until we find the one
    we are looking for. It is also called a sequential search.


    # linear time


    Time proportional to the input of an algorithm, written as O(n).


    # linearly separable


    A data set whose observations can be separated into two categories by a straight
    line in two dimensions, plane in three dimensions, or hyperplane in more dimensions.


    # list


    A data structure that contains items. Each item points to the next one, apart
    from the last item, which points nowadays, or to null, as we say. The items are
    therefore linked to each other, and such a list is also called a linked list.


    # local optimum


    A solution that is better than all the other neighboring solutions, but not the
    overall best. A neighboring solution is a solution in which we can get with a
    single move from the solution we are now.


    # logarithm


    The inverse of raising to a power. The logarithm is the answer to the question,
    “To which power should I raise a number to get the value I want?” If we ask, “To
    which power should I raise 10 to get 1,000,” the answer is 3 because $10^3=1,000$.
    The number we will raise to the power is called the base of the logarithm. We
    write $\log_a x=b$ if $a^b=x$. For $a=2$ we write $\lg x$.'
  - '[PAGE 279]


    # logarithmic time


    Time proportional to the logarithm of the input of an algorithm—for example, O(logn).
    Good searching algorithms take logarithmic time.


    # loglinear time


    Time proportional to the product of the size of the input and logarithm of the
    input of an algorithm—for example, O(nlogn). Good sorting algorithms take loglinear
    time.


    # loop


    A sequence of instructions in a computer program that is repeated. A loop ends
    when a condition is fulfilled. A loop that does not end is an infinite loop and
    is usually a bug because it may lead to a program that fails to terminate. See
    iteration.


    # loss


    The difference between the actual and desired output of a machine learning algorithm.
    It is typically calculated by a loss function.


    # machine learning


    The use of algorithms that solve problems by learning automatically from examples.


    # matrix


    A rectangular array, typically of numbers or more generally mathematical expressions.
    The contents of a matrix are arranged horizontally in rows and vertically in columns.


    # Matthew effect


    The phenomenon of the rich getting richer and poorer getting poorer. Named after
    the Gospel of Matthew (25:29), it has been found to apply to many texts, not just
    material wealth.


    # minimization problem


    A problem in which, among the possible solutions, we try to find the one with
    the minimum value.


    # merge sort


    A sorting method that works by repeatedly merging larger and larger sets of sorted
    items.'
  md: '

    # eigenvector


    In linear algebra, an eigenvector is a vector that, when we multiply it by a specific
    matrix, the result is the same vector multiplied by a number; that number is its
    eigenvalue. PageRank finds the first eigenvector of the Google matrix—that is,
    the eigenvector of the Google matrix with the largest eigenvalue, which is equal
    to one.


    # epoch


    In machine learning, a pass, during training, through the whole training data
    set.


    # Euclid’s algorithm


    An algorithm for finding the greatest common divisor of two integers, presented
    in the *Elements*, a set of 13 books written by the ancient Greek mathematician
    Euclid (ca. 300 BCE). The Elements treats geometry and number theory, starting
    from axioms and proving theorems based on the axioms. It is the oldest extant
    work of mathematics that uses this deductive approach, and such, one of the most
    influential books in the history of science.


    # Eulerian path


    A trail through a graph such that each edge is visited exactly once. It is also
    called a Eulerian walk.


    # Eulerian tour


    A Eulerian path that starts and ends at the same node. It is also called a Eulerian
    tour.


    # Euler’s number


    The mathematical constant $e$, approximately equal to 2.71828. It is the limit
    of $(1 + 1 / n)$ as $n$ approaches infinity.


    # execution path


    The series of steps that an algorithm carries out during its execution.


    # exponential growth


    A pattern in which a number of things is successively multiplied by itself. For
    example, we may start with $a$ things, and then we''ll get $a \times a$ things,
    then $a \times a \times a$, and in general $a \times a \times \dots \times a =
    a^n$. Numbers grow fast with exponential growth.


    # factorial


    The factorial of a natural number $n$ is the product of all numbers from 1 up
    to and including $n$. We use the symbol $n!$ so we have $n! = 1 \times 2 \times
    \dots \times n$. The definition can be extended to all real numbers, but that
    does not concern us here.


    # factorial complexity


    Computational complexity that follows factorial growth. In big O notation, it
    is $O(n!)$.


    # fire (neuron)


    See activation (neuron).


    # fitting


    In machine learning, the process of learning from the data. In this process we
    construct a model that fits the observations.


    # garbage in, garbage out


    If we feed a program garbage, instead of its expected input, we should expect
    no miracles: the program will produce garbage instead of its expected output.


    # global optimum


    The best overall solution to a problem.


    # Google matrix


    A special kind of matrix (a modification of the hyperlink matrix) that is used
    in the power method in the PageRank algorithm.


    # gradient


    A vector containing all the partial derivatives of a function.


    # graph


    A set of nodes, also called vertices, and edges, also called links, connecting
    them. Graphs can be used to model any kind of linked structure, from people to
    computer networks. As a result, many problems can be modeled as graphs, and many
    algorithms have been developed that work on top of them.


    # graph coloring


    The edge or vertex coloring of a graph.


    # graphics processing unit (GPU)


    A chip specially designed to handle the instructions for the creation and manipulation
    of images inside a computer.


    # greatest common divisor (gcd)


    Given two integers, the largest integer that divides both.


    # greedy algorithm


    An algorithm in which we have to choose between alternative courses of action,
    we choose the one that gives us the greatest immediate payoff. This does not necessarily
    lead to the optimum outcome in the end.


    # hardware


    The physical components that make up a computer or digital device. The term complements
    software.


    # head


    The first item in a list.


    # heuristic


    A strategy for making choices among alternatives in an algorithm. A greedy heuristic
    would require us to take the option that looks best right now (never mind what
    could happen in the future).


    # hidden layer


    A neural network layer that is not directly connected to the input or output of
    the network.


    # Hierholzer algorithm


    An algorithm for finding Eulerian circuits on graphs. It was published by the
    German mathematician Carl Hierholzer in 1873.


    # hill climbing


    A metaphor for describing problem solving. The solution is at the top of the hill,
    and we have to climb from its foot. At each step there may be a decision to take
    among alternative paths. Depending on our choices, we may select the best path
    overall, a path that is not the best but still takes us to the top, or a path
    that leads to a plateau. If the worst happens and we reach a plateau, we’ll have
    to go back to a previous position to start moving along a different path.


    # hyperlink


    A reference from a text to another part of the text or a different text. On the
    web, hyperlinks are links between web pages that the user may follow while browsing.


    # hyperlink matrix


    A matrix representing the structure of a graph; it is like an adjacency matrix,
    but we divide the elements of its row by the number of nonzero elements in the
    row.


    # hyperplane


    The generalization of the plane in more than three dimensions.


    # hypertext


    Text that contains hyperlinks.


    # image recognition


    The computational task of recognizing patterns in images.


    # insertion sort


    A sorting method where we take each item and insert it into its correct position
    among the already sorted items.


    # internet


    A global network of computers and digital devices, interconnected by means of
    a common suite of communication protocols. Initially, it was with its first letter
    capitalized (Internet) because internet could refer to any network that extended
    beyond the internal confines of an institution, which is called an intranet. As
    the global internet took off, however, the initial capital fell out of favor,
    probably saving a significant amount of ink.


    # intractable problem


    A problem for which the best algorithms we know will take an inordinate amount
    of time to handle anything but trivial cases.


    # iteration


    See loop.


    # key


    A part of a record that we use for sorting or finding it. A key may be atomic,
    when it cannot be decomposed into smaller parts (for instance, identification
    number), or composite, when it consists of smaller pieces of data (like the full
    name comprising first name, middle name, and surname).


    # label


    In machine learning, a value representing the category to which an observation
    belongs. In training, the computer is given problems along with their solutions;
    when the problem is classification, the solutions are the labels representing
    the classes.


    # linear search


    A search algorithm in which we examine each item in turn until we find the one
    we are looking for. It is also called a sequential search.


    # linear time


    Time proportional to the input of an algorithm, written as $O(n)$.


    # linearly separable


    A data set whose observations can be separated into two categories by a straight
    line in two dimensions.


    # list


    A data structure that contains items. Each item points to the next, apart from
    the last item, which points to null, as we say. Such a list is also called a linked
    list.


    # local optimum


    A solution that is better than all the neighboring solutions, but not the overall
    best. A neighboring solution is a solution in which we can get with a single move
    from.


    # logarithm


    The inverse of raising to a power. The logarithm is the answer to the question,
    “To which power should I raise a number to get the value?” If we ask, “To which
    power should I raise 10 to get 1,000,” the answer is 3 because $10^3=1000$. The
    number we will raise to the power is called the base of the logarithm. We write
    $\log_a x=b$ if $a^b=x$. For $a=2$ we write $\lg x$.


    # logarithmic time


    Time proportional to the logarithm of the input of an algorithm—for example, $O(\log
    n)$. Good searching algorithms take logarithmic time.


    # loglinear time


    Time proportional to the product of the size of the input and logarithm of the
    input of an algorithm—for example, $O(n \log n)$. Good sorting algorithms take
    loglinear time.


    # loop


    A sequence of instructions in a computer program that is repeated. A loop ends
    when a condition is fulfilled. A loop that does not end is an infinite loop and
    is usually a bug because it may lead to a program that fails to terminate. See
    iteration.


    # loss


    The difference between the actual and desired output of a machine learning algorithm.
    It is typically calculated by a loss function.


    # machine learning


    The use of algorithms that solve problems by learning automatically from examples.


    # matrix


    A rectangular array, typically of numbers or more generally mathematical expressions.
    The contents of a matrix are arranged horizontally in rows and vertically in columns.


    # Matthew effect


    The phenomenon of the rich getting richer and poorer getting poorer. Named after
    the Gospel of Matthew (25:29), it has been found to apply to many texts, not just
    material wealth.


    # minimization problem


    A problem in which, among the possible solutions, we try to find the one with
    the minimum value.


    # merge sort


    A sorting method that works by repeatedly merging larger and larger sets of sorted
    items.

