    | B, C | 1 | E, F | 0 |

    | B, E | 3 | E, H | 1 |

    | B, F | 2 | E, G | 1 |

    | C, D | 0 | G, H | 0 |


    We start by taking the match Alice versus Bob. Neither Alice nor Bob play any
    other match on day zero—that is, the day on which we’ll assign the match.


    We then take another match we have not scheduled yet—say, Alice versus Dave. Although
    there is no requirement to do so, we’ll take the match players in lexicographical
    order as we continue, but bear in mind that we could take them in any other way,
    even randomly, as long as we treat each match only once. Alice already has a match
    scheduled on day zero, so the earliest available day for the match is day one.


