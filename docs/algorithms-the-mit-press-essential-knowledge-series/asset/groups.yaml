    It''s nice to have a way of producing a sorted group from two sorted groups, but
    this does not seem to solve our problem of sorting a single group of unsorted
    items. It is true it does not, yet it is an important component of the solution.
    Imagine now that we have a group of people. We give to one of them a group to
    sort. That person does not know how to sort them, but they know that if somehow
    had two sorted parts, they could produce a final group. So what they do is this:
    they split the group in two and pass it on two other people. They say to the first
    of them, “Take this group and sort it.” They say the same thing to the second
    person. Then they wait. Although our first point of contact does not know how
    to sort, if the two new contacts manage to sort their parts and return them, then
    the first person would return to us the final, sorted group. But the two other
    contacts know more than our initial contact—they don''t know how to sort but only
    how to merge stuff using the algorithm above—so has anything been achieved?


    The answer is yes, provided that they do the same. We start with the numbers 95,
    59, 15, 27, 82, 56, 35, 51, 21, and 79. We give them to Alice (A), who splits
    them in two, and passes them to Bob (B) and Carol (C). You can see that in the
