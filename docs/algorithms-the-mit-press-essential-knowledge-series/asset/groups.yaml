    如果我们继续进行第七轮投票，将发现情况与第六轮投票相比保持不变。票数，因此网页的重要性，也将保持不变。这给了我们最终结果。网页的排名是：第 3 页最重要，其次是第
    2 页、第 5 页，然后是第 1 页，最后是第 4 页。


    让我们回想一下我们所做的。我们从两个原则开始，只要知道每个反向链接的重要性，这两个原则就提供了计算网页重要性的规则。在开始之前，我们设置所有 $n$ 个网页具有相等的重要性，等于
    $1 / n$。然后，我们通过累加来自反向链接的份额来计算每个网页的重要性。这为我们提供了每个网页重要性的新值，与初始的 $1 / n$ 值不同。我们从这些值开始重复该过程。我们得到了另一组值。在重复该过程若干次后，我们发现情况稳定下来了：重要性的衡量标准在相邻迭代之间不再变化。在这一点上，我们将其停止并报告了发现的值。


    问题在于，我们所描述的方法是否适用于通用情况，而不仅仅是我们所选择的特定例子。此外，它是否能产生合理的结果？


    ## 超链接矩阵与幂迭代法


    通过反向链接的重要性计算页面重要性的方法有一个优雅的公式。我们从描述网页之间链接的图开始。我们可以使用数字矩阵来表示图，我们称之为**邻接矩阵**。构建过程非常直观：我们创建一个与图中节点数相同的行与列矩阵。然后，在每个对应于链接的交叉点填
    1，在所有其他交叉点填 0。我们示例的邻接矩阵为：


    ![](img/9d8f96a7d5ef19b95ffbdc918)


    我们也可以使用单个向量表示所有网页的重要性：


    $r = (p_1, p_2, p_3, p_4, p_5)$


    每个页的重要性是其反向链接的重要性之和除以其链接的数量。这可以表示为矩阵乘法：


    $r'' = Mr$


    其中 $M$ 是转移矩阵。转移矩阵 $M$ 的定义使得 $M_{ij}$ 是从页面 $j$ 到页面 $i$ 的概率。如果页面 $j$ 有 $k$ 个链接，则对于这每一个页面，$M_{ij}
    = 1/k$，否则 $M_{ij} = 0$。

    '
