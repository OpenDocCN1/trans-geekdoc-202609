    are beautiful tools, and a glimpse of how they are made and work can enhance our
    way of thinking.


    We''ll start dispelling an irksome notion: that algorithms are about computers.
    This, we''ll see, makes as much sense as saying that numbers are about calculators.


    # A Way to Do Things


    A pen-and-paper puzzle, music, divisibility of numbers, and neutron accelerators
    in particle physics—we''ll see that what they all have in common is the same algorithm,
    applied to such different domains, yet working on the same underlying principles.
    How can this be?


    The word ''algorithm'' itself does not reveal its meaning. It comes from the name
    of Muḥammad Mūsā al-Khwārizzī (ca. 780–ca. 850), a Persian scholar who worked
    on mathematics, astronomy, and geography. Al-Khwārizm’s contributions were many
    and widespread. The term ''algebra'' comes from the Arabic title of his most influential
    work, The Compendium Book on Calculation by Completion and Balancing. His second
    most influential book, On the Calculation with Hindu Numerals, was on arithmetic
    and, translated into Latin, introduced the Hindu-Arabic numeral system to the
    West. Al-Khwārizmi’s name was latinized to Algorismus, which came to denote the
    method of numerical computation with the decimal numbers. Algorismus, influenced
    by the Greek word for “number” (arithithmos, as in arithmetic), became algorithm,
    still denoting decimal arithmetic, before acquiring its modern sense in the nineteenth
    century.


    You could be tempted to think that algorithms are something that we do with computers,
    but this would be wrong. It is wrong because we had algorithms long before we
    had computers. The first-known algorithms date back to ancient Babylon.² It is
    also wrong because algorithms are not problems that have to do with computers.
    Algorithms are about doing something in a specific way, following some kind of
    steps. That is somewhat vague. You may ask, What kind of steps? What specific
    way? We can dismiss all vagueness, and give a precise mathematical definition
    of what an algorithm is and what it does—such a definition do exist—but we don’t
