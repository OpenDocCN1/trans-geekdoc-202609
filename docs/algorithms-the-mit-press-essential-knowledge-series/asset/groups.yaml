  mdcn: '

    （贡献被隐藏了数十年）。在一场悲剧性的事件中，图灵自杀了。他在1952年因同性恋被捕并定罪，这在当时的英国是犯罪行为，并因此被迫接受了激素水平治疗。2013年，他获得了官方的特赦。他出现在新钞币上是一种平反的形式，这在几十年前是不可想象的。²


    在整本书中，我们一直将算法描述为由简单步骤组成，这些步骤简单到可以用纸笔完成。鉴于我们在计算机程序中实现算法，关于“究竟什么是算法”的问题将帮助我们理解什么实际上是可以被计算的。这要求我们深入研究这些简单步骤的本质。毕竟，小学生用纸笔能做的事情与大学毕业生能做的事情是不一样的。是否可能精确地定义算法是由什么样的步骤组成的？图灵在数字计算机制造之前就给出了答案。他在1936年提出了一种模型机器，以回答计算机（任何计算机）能做什么的问题。图灵机是一个简单的装置。它由以下部分组成：³


    - 1. 磁带。带被划分为若干个格或单元。每个单元可以是空白的，也可以包含某个字母表中的符号。磁带可以是无限长的。


    > 是否可能精确地定义算法是由什么样的步骤组成的？. . . [图灵]在1936年提出了一种模型机器，以回答计算机（任何计算机）能做什么的问题。


    - 2. 一个可以沿着磁带向左或向右移动的读头，每次一位。读头可以读取下方单元中的符号。我们将该单元中的符号称为扫描符号。读头可以擦除或覆盖扫描符号。


    - 3. 有限控制器，也称为状态寄存器。有限控制器可以处于有限状态集中的任何状态。你可以把它想象成刻有状态的拨盘，以及可以指向其中任何一个状态的指针。


    - 4. 有限指令表。每条指令都指定了机器的下一步移动。这就是机器在给定当前状态和扫描符号的情况下将要执行的操作。


    你可以在下一页的图中看到图灵机。⁴


    这个特定图灵机的字母表由 1 和 ★ 组成。有限控制器显示机器处于七个状态之一，$q_0, q_1, \dots, q_6$。指令表为每个可能的状态有一行，为每个可能的符号有一列；我们使用
    $B$ 代表空白以便于观察。当前状态由行表示，扫描符号由列表示。指令表中的每个条目都包含一个三元组，描述一个移动，或者一个破折号，意味着机器在该行和列的组合下无操作。


    ## 有限指令表


    | 状态 | 1 | $\star$ | B |

    | :--- | :--- | :--- | :--- |

    | $q_0$ | | | $(q_1, B, R), (q_5, B, R)$ |

    | $q_1$ | | $(q_2, \star, R)$ | $(q_1, 1, R)$ |

    | $q_2$ | $(q_0, 1, R)$ | | $(q_3, \star, L), (q_1, B, R)$ |

    | $q_3$ | | $(q_4, B, R)$ | $(q_3, 1, L)$ |

    | $q_4$ | | $(q_5, B, R)$ | $(q_4, 1, L)$ |

    | $q_6$ | | | |


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_260_0.png)


    机器的一次移动由三个动作组成：


    - 1. 机器可能会改变状态或保持状态不变。新状态是有限指令表中三元组的第一个元素。


    - 2. 它会在读头下方写入一个符号。该符号可能与原有符号相同（那么结果就是现有符号留在单元中）。要写入的符号是三元组的第二个元素。


    - 3. 读头将移动到当前单元的左侧（L）或右侧（R）。移动是三元组的第三个元素。


    我们的示例图灵机执行一种算法，当 $a > b$ 时计算数字 $a$ 和 $b$ 的差；否则返回零。这种操作被称为*负减法*（monus）或*恰减法*（proper
    subtraction），我们记作 $a \div b$。我们有 $4 \div 2 = 2$ 和 $2 \div 4 = 0$。


    最初，我们将机器的*输入*放在磁带上。输入是来自机器字母表的符号的有限字符串。磁带上输入左侧和右侧的所有单元都是空白的。在这个图灵机中，输入是 $1111
    \star 11$。输入代表*一进制制*中的数字四和二，用 $\star$ 隔开。


    机器启动时，读头位于最左侧的输入单元。有限控制器指向 $q_0$ 状态。然后机器开始工作并执行移动。如果我们跟踪机器的前六次操作，将看到它是这样的：


    - 1. 我们处于状态 $q_0$，且扫描符号是 1：


    指令表给了我们 $(q_1,B,R)$，因此机器将状态改变为 $q_1$，将 1 覆盖为空白，并向右移动。磁带和读头将是：


    - 2. 对于 $q_1$ 状态和扫描符号 1，指令表给了我们 $(q_1,1,R)$。机器将读取并写入 1，保持单元不变，并向右移动，保持在状态 $q_1$：


    | | 1 | 1 | 1 | ★ | 1 |

    | :--- | :--- | :--- | :--- | :--- | :--- |


    - 3. 机器执行与步骤 2 相同的操作，读取并写入 1，保持在 $q_1$，并向右移动：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_263_0.png)


    - 4. 再次，机器将读取并写入 1，保持单元不变，并向右移动：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_264_0.png)


    - 5. 读头已移过 ★ 并保持在 $q_1$：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_265_0.png)


    - 6. 读头已移过 1 到达状态 $q_2$：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_266_0.png)

