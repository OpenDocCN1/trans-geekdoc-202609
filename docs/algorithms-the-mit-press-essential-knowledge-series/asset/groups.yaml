    | 51 |

    | 56 |

    | 69 |

    | 15 |

    | 21 |

    | 27 |

    | 35 |


    Now 51 is smaller than 59, and 56 is smaller than 59. As we already have moved
    35 from the second group to the third, in the end we''ll have moved three items
    in a row from the second group to the third. That is fine in this way we keep
    items in the third group sorted. There is no reason why the two first groups should
