    尚未处于最终位置。但总的来说，它们的位置比之前要好。因此，我们有一个元素，即基准值（pivot），处于最好的位置，而其他元素的位置也比之前更理想。


    这对快速排序的性能有重要影响：它的期望复杂度为 $O(n \log n)$，这远优于 $O(n^2)$。如果我们对 100 万个项目进行排序，$O(n^2)$
    的结果是 $10^{12}$，即万亿，而 $O(n \log n)$ 大约是 2000 万。


    这取决于是否选择了合适的基准。寻找一个每次都能以最佳方式划分数据的基准是没有意义的；因为这需要通过搜索来找到正确的基准，从而会增加过程的复杂度。因此，一个好的策略是听天由命。只需选取一个基准，并使用选中的值来划分数据。


    为了理解为什么这是一个好策略，让我们看看它为什么不是坏策略。如果它导致了像我们刚刚看到的行为，即快速排序退化为选择排序，那么它就是坏策略。如果我们每次选取的基准都是一个无法真正划分元素的元素，就会发生这种情况。如果我们每次都选取的元素中的最小值或最大值（情况完全相同），这一切发生的总概率可以被找到为
    $2^{n-1} / n!$。


    $1 / n!$ 这样的概率是非常抽象的，因为它极低。为了方便理解，如果你拿有一副 52 张的扑牌并进行随机洗牌，牌组最终变成有序的概率是 $1 / 52!$。这大约相当于连续抛掷硬币出现
    226 次正面。当你乘以 $2^{-11}$ 时，情况并没有好多少。$2^{51} / 52!$ 这个数字大约等于 $2.8 \times 10^{-53}$。从宇宙视角来看，地球由大约
    $10^{50}$ 个原子组成。如果你和你的朋友独立地从地球上挑选原子，你们选中同一个原子的概率是 $10^{-50}$，这实际上大于 $2^{51} /
    52!$——即在扑牌上发生病态快速排序的概率。⁴


    这解释了为什么我们“通常”会像上面说的那样以更公平的方式选择基准。除非遇到宇宙级的连环霉运，否则我们不认为每次都选到最差的基准。实际上，概率对我们有利：正是通过随机选择基准，我们期望获得
    $O(n \log n)$ 的复杂度。理论上可能比这更糟，但这种可能性仅具有学术意义。对于所有实际用途来说，快速排序将如我们所预期的那样快。


    快速排序是由英国计算机科学家托尼·霍尔（Tony Hoare）于1959–1960 年开发的⁵。它可能是目前最流行的排序算法，因为当实现正确时，它会超过其他所有算法。这也是我们看到的第一个行为并非完全确定的算法。尽管它总能正确排序，但我们无法保证它始终具有相同的运行性能。我们可以保证的是它极不可能表现出病态行为。这是一个重要的概念，它引我们进入了所谓的随机算法：那些在操作中使用机会因素的算法。这违背了我们的直觉；我们期望算法是终极的确定性怪兽，奴化地遵循我们为它们设定的预定路径上的指令。然而，随机算法在近年来蓬勃发展，事实证明运气可以帮助我们解决标准方法仍无法解决的问题.³


    # 合并排序


    我们已经认识了基数排序，它本质上是通过分布对项目进行排序：在每一轮遍历数据时，它将每个项目放在正确的堆中。现在我们将遇到另一种排序方法，它通过合并而不是拆分对项目进行排序。这种方法被称为合并排序（merge
    sort）。


    合并排序首先承认其排序能力有限；想象一下，如果我们收到任何随机排列的项目的项目，我们无法对它们进行排序。我们只能做到这一点：如果我们得到两组项目，且每组都是有序的，我们就可以将它们合并并得到单一的有序组。


    例如，假设我们有以下两组，每行一组（尽管在我们的示例中两组的元素数量相同，但组的大小并不相等）：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_160_0.png)


    如你所见，两个组中的每一个都是有序的。我们想要合并它们以创建一个单一有序组。这非常简单。我们检查两个组的第一个元素。我们看到 15 比 21 小，所以这将是我们第三组的第一个元素：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_160_1.png)


    我们再次检查两个组的第一个元素，这次第二组的 21 比第一组的 27 小。所以我们取出它并附加到第三组。


    | 27 |

    | 59 |

    | 82 |

    | 95 |

    | 35 |

    | 51 |

    | 56 |

    | 69 |

    | 15 |

    | 21 |


    如果我们继续这样操作，我们将从第一组取出 27，然后从第二组取出 35，将它们加到第三组的末尾：


    | 59 |

    | 82 |

    | 95 |

    | 51 |

    | 56 |

    | 69 |

    | 15 |

    | 21 |

    | 27 |

    | 35 |


    现在 51 比 59 小，56 比 59 小。由于我们已经从第二组移动了 35 到第三组，最后我们将连续从第二组移动三个元素到第三组。这样没问题，通过这种方式保持了第三组中元素的有序性。没有理由要求前两个组以相同的速率减少。


    | 59 |

    | 82 |

    | 95 |

    | 69 |

    | 15 |

    | 21 |

    | 27 |

    | 35 |

    | 51 |

    | 56 |


    我们回到第一组，因为 59 比 69 小，所以我们将其加入第三组：


    | 82 |

    | 95 |

    | 69 |

    | 15 |

    | 21 |

    | 27 |

    | 35 |

    | 51 |

    | 56 |


    接下来，通过将 69 移动到第三组，我们清空了第二组：


    | 82 |

    | 95 |

    | 69 |

    | 15 |

    | 21 |

    | 27 |

    | 35 |

    | 51 |

    | 56 |


    | 82 |

    | 95 |

    | 15 |

    | 21 |

    | 27 |

    | 35 |

    | 51 |

    | 56 |

    | 69 |


    | 82 |

    | 95 |


    能够从两个有序组产生一个有序组是很好，但这似乎并没有解决我们对单组无序项目进行排序的问题。确实它没有解决，但它是解决方案的一个重要组成部分。现在想象我们有一组人。我们给其中一个人分了一组项目去排序。那个人不知道如何排序，但他们知道如果通过某种方式有了两个有序的部分，他们就能产生最终的组。所以他们这样做是：他们将组分成两部分，并交给另外两个人。他们对第一个人说：“把这一组排序。”他们对第二个人说同样的话。然后他们等待。虽然我们的第一个联系人不知道如何排序，但如果这两个新联系人成功地排序了他们的部分并返回，那么第一个人就会向我们返回最终的有序组。但另外两个联系人比我们的初始联系人知道得更多——他们不知道如何排序，只知道如何使用上述算法合并东西——那么取得什么成就了吗？


    答案是肯定的，只要他们也这样做。我们从数字 95, 59, 15, 27, 82, 56, 35, 51, 21 和 79 开始。我们将它们交给爱丝（A），她将它们分成两部分，并交给鲍伯（B）和凯莉（C）。你可以在下面的倒置树的第一层看到：


    ![](img/9d8f96a7d5ef19b95ffbdc3918c1b6f3_164_0.png)


    然后鲍伯将他的数字分成两部分，并将它们交给戴维（D）和伊芙（E）。同样，凯莉将她的数字分成两部分，并将交给弗兰克（F）和格蕾丝（G）。我们的角色继续传递任务。戴维将他的数字分给海蒂（H）和伊万（I）；伊芙将她的两个数字分给朱迪（J）和凯伦（K）；弗兰克和格蕾丝分别分给利奥（L）和梅洛丽（M）、尼克（N）和奥莉维娅（O）。海蒂将她的这对数字分给佩吉（P）

