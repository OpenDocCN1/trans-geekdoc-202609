  - '[PAGE 280]


    # Moore''s law


    The observation, made in 1965 by Gordon Moore, founder of Fairchild Semi-conductor
    and Intel, that the number of transistors in an integrated circuit doubles about
    every two years. It is an example of exponential growth.


    # move to front


    A self-organizing search algorithm. When we find the item we are looking for,
    we move it to the first position.


    # multigraph


    A graph in which an edge can occur more than once.


    # multiset


    A set in which an element can appear multiple times; in mathematics, in a normal
    set an element cannot appear more than once.


    # node


    An item in various data structures. Items in lists are called nodes.


    # neuron


    A neuron is a cell that forms the basic building block of the nervous system.
    It receives signals from other neurons and propagates them to other neurons in
    the nervous system.


    # null


    Nothingness in a computer.


    # online algorithm


    An algorithm that does not require the full input to a problem in order to produce
    a solution. An online algorithm gets the input incrementally, as it arrives, and
    at each point produces a solution that takes account of the input it has received
    so far.


    # onset


    The accented part of a rhythm.


    # optimal stopping problem


    The problem of knowing the best time to stop when you are trying to maximize a
    reward or minimize a penalty.'
  - '[PAGE 281]


    Algorithms that optimize the value of a function. In machine learning, optimizers
    typically minimize the value of the loss function.


    # overfitting


    The equivalent of learning by rote in machine learning. The model that we are
    trying to train follows the training data so closely that it fits too well. As
    a result, it does not predict correct values for other, unknown data.


    # overflow


    Going beyond the range of allowable values on a computer.


    # PageRank


    An algorithm used to rank web pages in terms of their importance. It was developed
    by the founders of Google and was the foundation of the Google search engine.
    The rank of a web page is its pagerank.


    # pagerank vector


    A vector containing the pageranks of a graph.


    # partial derivative


    In a function of many variables, the derivative of the function with respect to
    one variable, holding all other variables constant.


    # path


    In a graph, a sequence of edges that connect a sequence of nodes.


    # path length


    The sum of the weights along a path in a graph. If a graph does not have weights,
    it is the number of the links constituting the path.


    # Perceptron


    An artificial neuron that uses the step function for its activation.


    # permutation


    A rearrangement of some data in a different order.


    # pointer


    A place in computer memory that holds the address of another place in computer
    memory. In this way, the former points to the latter.


