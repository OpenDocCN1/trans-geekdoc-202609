    # 2.2.2.2 Fuzzy Operations


    Fuzzy logic employs specific operations to manipulate fuzzy sets and facilitate
    reasoning under uncertainty.


    +   1. **Union (∪):** The union of two fuzzy sets A and B, denoted as A ∪ B, results
    in a new fuzzy set where the membership degree at each point is the maximum of
    the corresponding membership degrees in A and B. This operation captures the notion
    of “or” in linguistic terms.


    +   2. **Intersection (∩):** The intersection of two fuzzy sets A and B, denoted
    as A ∩ B, results in a new fuzzy set where the membership degree at each point
    is the minimum of the corresponding membership degrees in A and B. This operation
    initiates the notion of “and” in linguistic terms.


    +   3. **Complement (-):** Fuzzy set A’s complement, represented as A ~A, produces
    a new fuzzy set with flipped membership degrees, μ(x) = 1−μ(x) if μ(x) is the
    membership degree of x in A.


    +   4. **Product (×):** A common use in fuzzy inference systems is the product
    operation. The product A × B is computed by multiplying the membership degrees
    pointwise for two fuzzy integers, A and B. The evaluation of fuzzy rules requires
    this operation.


    +   5. **Dilation and Contraction:** These operations change how wide a fuzzy
    collection is; contraction narrows the fuzzy set, whereas dilation widens it.
    These operations are useful for modifying fuzzy sets to satisfy particular requirements.


    To properly model and reason imprecise information, fuzzy logic systems require
    an understanding of these linguistic variables and fuzzy operations. Because of
    its capacity to represent uncertainty and human-like reasoning, fuzzy logic is
    a useful tool in a variety of domains, such as decision support, control systems,
    and artificial intelligence.


