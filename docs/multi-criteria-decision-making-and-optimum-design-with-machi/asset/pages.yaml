    Mixing is the most widely used method to overcome the disadvantages of plastics.
    This method helps improve the limitations and retains the existing advantages
    (Brown Brown, 2023). Dekkers et al. (1991) researched the impact toughness of
    PBT, polycarbonate (PC), and polyether (PPE) by adding styrene-ethylene-butadiene-styrene
    (SEBS); under the conditions of 25 °C, the PBT/PC/PPE/SEBS mixture (46/10/3/14)
    had an impact toughness of 600 Jun, 12 times higher than the PBT/PPE/SEBS blend
    only reached 50 Jun/m. Maiti et al. (2007) studied the effects of acrylonitrile-butyl
    acrylate-styrene on the mechanical properties of PBT and found that PBT''s flexural
    strength and impact toughness had increased significantly.


    PA6 is a polymer used mainly in technical applications with high physical and
    mechanical property requirements, such as automobile manufacturing, electrical
    and electronic industries, precision machining, and medical equipment. PA6 has
    high corrosion resistance and high melting temperature. However, its limitations
    are its resistance to acid and ability to be used in many acidic environments
    and its poor dimensional deformation (Chih-Hong et al., 1996).


    Not only polyamide and polyester have excellent combinations that many researchers
    are interested in, but they also is a promising option for creating high-performance
    polymer materials in the future. PBT is the optimal solution for mixing with PA6
    from the contrasting mechanical properties. Researchers tested the compatibility
    of PBT and PA6 by adding E-4 epoxy resin to the mixture and found excellent compatibility
    (An et al., 1996), and flexural strength also improved when a small amount of
    E-4 epoxy was added (Hongru et al., 2017). The compatibility of PBT/PA6 was also
    studied by adding poly (n-butyl acrylate)/poly(methacrylate-co-methacrylic acid).
    The results show that the toughness of the new was 25.66 kJ/m², four times higher
    than the original. At the weight absorbed only 1.3% water content, down 53.6%
    of PBT and 26.6%. The impact toughness of the PBT/PA6 mixture also increases by
    adding ethylene vinyl acetate-co-maleic anhydride when by injection molding (Kim
    et al., 2003).


    Injection molding is a popular method when manufacturing PBT products reinforced
    with GCs as the producing results have stable and accurate dimensions, short molding,
