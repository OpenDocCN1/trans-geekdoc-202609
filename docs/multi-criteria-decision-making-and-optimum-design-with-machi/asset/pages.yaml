    decisions by considering criteria like cost level, delivery time, and demand variability.
    Models trained on historical data predict demand patterns and identify inventory
    levels (Nayamag et al., 2023). Real-time data on orders, inventory levels, and
    transportation options are then used to adjust supply chain decisions dynamically.
