    # 2.4.2 TRADITIONAL MCDM METHODS AND Limitations


    Decision-makers have long relied on traditional MCDM techniques to help them assess
    and choose options based on a variety of criteria (Taherdoost & Madanchian, 2023).
    These techniques do have certain restrictions, though here are a few popular MCDM
    techniques along with their disadvantages:


    +   - Weighted Sum Model: This model calculates the total score for each alternative
    multiplying the weights by the normalized scores. Each criterion is given a weight
    that indicates its significance. The subjectivity of weight assignment, possible
    bias, and the presumption of linear connections among criteria are some of the
    shortcomings


    +   - Weighted Product Model: The normalized scores for each criterion increased
    to their corresponding weight and multiplied to determine the total score for
    each choice in the Weighted Product Model. Sensitivity to extreme values, the
    presumption of criteria independence, and difficulties determining additive weights
    are some of the limitations.


    +   - Simple Additive Weighting: The third method is called additive weighting,
    which combines criteria by multiplying the normalized score of each criterion
    by its weight and adding the results. Sensitivity to weight fluctuations and the
    presumption that criteria are equally significant within a given weight category
    are two limitations.


    +   - Analytic Hierarchy Process: Analytic hierarchy creates a structured framework
    for decision-making by comparing criteria in pairs. The process reduces the possibilities
    for inconsistency, the difficulty of achieving consistent judgments in paired
    comparisons, and other limitations in handling a large number of criteria.


    +   - ELECTRE (Elimination et Choice Traduisant en Recherche): This group of outranking
    techniques evaluates substitutes to how well or poorly meet predetermined standards.
    Sensitivity to shifts in preference thresholds, challenges with imprecise information,
    and the possibility of rank reversal are some of the limitations.


    +   - TOPSIS: TOPSIS offers options considering how close they are to the positive
    ideal solution and how far they are from the negative ideal solution. Sensitivity
    to the normalization method used, reliance on predetermined ideal solutions, and
    susceptibility to extreme values are some of the limitations.


    +   - Compromise Programming: This technique looks for solutions that strike a
    balance between opposing requirements. Limitations include the impact of decision-makers''
    differing tastes and the challenge of identifying a suitable option.


    +   - Limitations across Traditional MCDM Methods:


    +   - Subjectivity: The dependability of the results might be impacted by the
    subjectivity introduced by traditional approaches, which frequently rely'
