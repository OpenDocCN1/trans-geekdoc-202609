    and CPU architectures, exploiting task parallelism.


    In this work, we present Fusion Sort, a novel hybrid sorting algorithm tailored
    to effectively manage data sets of intermediate sizes. By harnessing the advantages
    of both Insertion Sort and divide and conquer, Fusion Sort dynamically adapts
    its sorting approach based on a carefully selected threshold. For smaller subarrays,
    it employs Insertion Sort, capitalizing on its superior performance for such data;
    for larger subarrays, it switches to divide and conquer, leveraging its efficiency
    in handling bigger data sets.


    Extensive evaluations underscore the superiority of Fusion Sort over Quick Sort
    and Merge Sort for intermediate-sized data sets. Its adaptive nature empowers
    Fusion Sort to outperform traditional sorting algorithms in this specific context,
    making it an appealing choice for real-world applications that frequently encounter
    data sets of moderate sizes. This study provides an in-depth analysis of Fusion
    Sort''s algorithmic steps, complexity, and experimental results, substantiating
    its standing as a practical and robust sorting solution for data sets within the
    inter-size range.


