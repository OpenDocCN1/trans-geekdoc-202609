    Many researchers have investigated the effects of various process parameters on
    the mechanical properties of 3D-printed material using the FDM method. Adan Rasheed
    investigated the influence of infill density, number of layers, printing speed,
    and bed temperature on the mechanical properties to determine the optimal parameters
    for better tensile strength for bilayer polymeric acid (PLA) and acrylonitrile
    styrene composite (Rasheed et al., 2023). The authors used Taguchi''s method for
    the parameter optimization and used ANOVA to verify the tensile test data; the
    result of the experiment showed that infill density was the most influential parameter,
    and an infill density of 75%, 30 layers per part, printing speed of 20 mm/s, and
    bed temperature of 100 °C gave the best tensile strength.


    Rahman (2023) conducted a study on the effects of layer height, nozzle temperature,
    printing speed, and bed temperature on a cubic lattice structure printed from
    PLA; they determined that the best process parameters were layer height of 0.1
    mm, nozzle temperature of 210 °C, printing speed of 30 mm/s, and bed temperature
    of 60 °C for the highest strength. In addition, higher temperature enhanced the
    tensile strength of PLA-printed parts, with the highest values at 220 °C (Karim
    et al., 2022). Gohar and colleagues showed the effects of raster angle on the
    mechanical properties of thermoplastic polyurethane (TPU) honeycomb structures;
    they confirmed that 0/90° gave better mechanical performance than ~45/45° (Gohar
    et al., 2023).


    Venkat et al. (2023) highlighted the effect of infill patterns in determining
    the mechanical characteristics of 3D-printed parts; specifically, the zig-zag
    infill exhibited better tensile and flexural strength than the gyroid infill.
    Other researchers determined that raster angle 0° and nozzle temperature 200 °C,
    fused filament fabrication achieved high strength for TPU filament (Arifvanto
    et al.). Another study on achieving the lowest surface roughness, authors recommended
    an infill of 20%, layer height of 0.12 mm, nozzle temperature of 210 °C for Rz
    and 220 °C for Ra, printing speed of 90 mm/s, and layer height had the most significant
    impact on the surface roughness of printed parts (Tuncel et al., 2023). Other
    researchers have calculated the parameter values to produce maximum tensile strength
    for TPU to be 210 °C, 45° infill density, 100% infill density, 0.18 mm thickness,
    and an infill angle of 45° has a better stacking strength than an infill angle
    of 90° (Duong Le et al., 2023).


    Although many researchers have investigated the optimal parameters for FDM printing,
    few takes place in ambient temperature conditions, and plastic''s mechanical properties
    are strongly influenced by temperature, particularly high temperatures. The temperature
    inside the chamber changes molecular diffusion and entanglement in the linking
    of layers, improving the interlayer bonding and the mechanical properties of FDM-printed
    parts. Increasing chamber temperature over 40 °C improved the interlayer bonding
    in PLA-printed products, which was informed by the increased fracture toughness
    (Supahorn Thumsorn et al., 2023).


    Abbrahim Hadeey showed that printing with the closed and opened printer at the
    same temperature has equal dimensional accuracy. However, the'
