  md: "Hwang and Yoon (2023) pioneered the TOPSIS method (technique for order preference\
    \ by the ideal solution), an MCDM strategy. is meant to tackle problems requiring\
    \ crisp numbers over complex calculations that are difficult to understand and\
    \ implement. In real-world MCDM scenarios, attribute values are frequently expressed\
    \ with incomplete information. Decision-makers might prefer a straightforward\
    \ method that produces the same outcomes as a complicated algorithm. This work\
    \ seeks to simplify TOPSIS, a new MCDM method that simplifies calculations while\
    \ producing the same results as classic TOPSIS, is introduced. Second, we combine\
    \ neutrosophic and simplified TOPSIS methods to tackle MCDM issues with poor information.\n\
    \nM. Bahramloo et al. (2013) developed the concept of a complicated neutrosophic\
    \ set. For ranking options, the authors used MCDM in intuitionistic fuzzy sets,\
    \ Smarandache (2006) extended to neutrosophic sets. Biswas et al. (2016) summed\
    \ up their work and looked into aggregation operators, like weighted neutrosophic\
    \ and aggregated single-valued TOPSIS to solve MCDM problems. Broumi and Smarandache\
    \ (2013) researched multiple attribute decision-making employing uncertain linguistic\
    \ values with intervals, and created an MCDM system in a multi-hensic, fuzzy environment\
    \ using aggregation operators and TOPSIS.\n\n# 14.2 PRELIMINARIES\n\nNeutrosophic\
    \ TOPSIS operates as a compensatory method and presumes total aggregation among\
    \ criteria, constructing a linear additive model. The determination of weights\
    \ and scores primarily involves pairwise comparisons conducted between all available\
    \ options.\n\n# 14.2.1 FUZZY SET\n\nA fuzzy set $\tilde{A}$ in discourse X is\
    \ defined by a membership function $\\mu_{\tilde{A}}(x)$ that associates each\
    \ element $x$ in X with a real number in the interval [0, 1], where $\\mu_{\t\
    ilde{A}}$ represents the degree of membership of $x$ in $\\mu(x)$, with a higher\
    \ value indicating a stronger association. The membership function quantifies\
    \ the degree to which elements in the universe X belong to the $\tilde{A}$. When\
    \ $\\mu_{A}(x)$ is closer to unity, it unifies a higher degree of membership for\
    \ $x$ in $\tilde{A}$.\n\n# 14.2.2 NEUTROSOPHIC TOPSIS\n\nNeutrosophic TOPSIS is\
    \ an extension of the classical TOPSIS method that incorporates neutrosophic set\
    \ theory. TOPSIS is a decision-making technique used for ranking alternatives\
    \ based on their proximity to an ideal solution. Neutrosophic set theory is an\
    \ extension of classical set theory that allows for the representation of classical\
    \ set theory that allows for the representation of indeterminacy, uncertainty,\
    \ and inconsistency. In Neutrosophic TOPSIS, the decision matrix and the criteria\
    \ weights are expressed in the form of neutrosophic numbers. Neutrosophic numbers\
    \ consist of three components: a truth value (T), an"
