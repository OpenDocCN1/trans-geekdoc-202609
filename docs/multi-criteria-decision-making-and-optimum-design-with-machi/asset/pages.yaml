  md: '# 9.3 MATERIALS AND METHODS


    For the study of this chapter, the image enhancement was a crucial process, seamlessly
    integrated as a preprocessing step before we input the images into the feature
    extraction model. This strategic placement was designed to optimize the condition
    of the images, laying the groundwork for more effective object detection and subsequent
    caption generation. By enhancing the images before the feature extraction, we
    aimed to ensure the model would receive input in an optimal state, primed to extract
    relevant information. The anticipated outcome was improved object detection accuracy
    in the clearer, enhanced images that captured richer images with intricate details.
    This image enhancement was necessary to ensure the overall performance of the
    integrated approach to underwater object detection and image captioning for advanced
    marine exploration.


    # 9.3.1 IMAGE READING


    The first step in the process was reading the input image using the OpenCV library
    with the ''cv2.imread'' function. OpenCV is a widely used vision library that
    provides various tools and functions for image processing tasks. In cv2.imread,
    we loaded the images into the computational environment, making it accessible
    for sequential analysis and manipulation.


    # 9.3.2 COLOR SPACE CONVERSION


    Following the image reading, we adapted each image to a more suitable color representation.
    The default color space in OpenCV is BGR (blue, green, red). However, it is frequently
    preferable to convert an image to the RGB color space for a variety of reasons,
    such as natural color representation and interoperability with other tools and
    libraries. This conversion involves rearranging the color channels from BGR to
    RGB, ensuring that the color information is correctly interpreted and displayed.
    RGB is a widely used color model in computer vision and image processing, making
    it a standard for various applications.


    # 9.3.3 SPLITTING RGB IMAGES


    Next, we split the R, G, and B channels in the RGB images. This division was essential
    because it permitted each channel to be processed independently, allowing for
    focused modifications to be made to color components.


    # 9.3.4 HISTOGRAM EQUALIZATION


    The next step in the process was applying histogram equalization to each of the
    individual RGB channels independently. The goal of the contrast enhancement learning
    technique known as histogram equalization is to modify the distribution of pixel
    intensities within an image.


    An image''s pixel intensity distribution is represented graphically by a histogram
    that displays the frequency of each intensity level. A grayscale image has'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Using MCDM and Machine Learning to Enhance Underwater Imagery


    two axes: the y-axis, which shows the frequency of each intensity, the x-axis,
    which shows the intensity, which ranges from 0 to 255. The cumulative distribution
    function is calculated from the histogram, and it ranges from 0 to the total number
    of pixels in the image and represents the cumulative sum of the histogram values.


    The next step involving a transformation function based on the cumulative distribution
    function. This function maps the original intensity values to new values; the
    goal is to spread the intensity values so that the resulting histogram is as uniform
    as possible. Then we mapped each pixel in an image to its new intensity using
    the transformation function. This process effectively redistributes the pixel
    intensities, enhancing the overall contrast of the image with more evenly distributed
    pixel intensities.


    Histogram equalization is particularly useful for images with uneven lighting
    or a limited range of pixels. It can be extended to color images by applying the
    technique independently to each channel in RGB images as we described. In this
    case, we used OpenCV cv2.equalizeHist to perform the equalization on each channel
    separately. The process begins with computing the histogram, a distribution of
    pixel intensities, for the given image. The histogram P(i,j) is determined by
    counting the frequency of each intensity level in the image:


    P(i, j) = Frequency of intensity level (i, j)


    Secondly, we calculated the cumulative distribution function, denoted as C(i,j),
    representing the cumulative probability of each intensity level as shown in Equation
    (9.1):


    ```

    C(i, j) = \sum_{k=0}^{i} P(k, j)  (9.1)

    ```


    Then we computed the enhanced pixel levels (I_{eq}) using Equation (9.2):


    ```

    I_{eq}(x,y) = \frac{L-1}{W \times H} \sum_{i=0}^{x} P(i, j)  (9.2)

    ```


    where W and H are, respectively, the width and height of the image; L is the number
    of intensity levels; and P(i,j) is the histogram of the image. This formula achieved
    the highest accuracy with valid data sets.


    # 9.3.5 Manual White Balancing


    Manual white balancing is a crucial step in refining the color representation
    of underwater images, mitigating distortions under complex lighting conditions
    inherent in aquatic environments. This technique is used to adjust the colors
    in an image to appear more natural and visually appealing. The equalized RGB image
    must first be converted into the LAB color space using OpenCV''s cv2.COLOR_RGBLAB
    conversion function. LAB separates the image into three channels: L (luminance),
    A (green-red), and B (blue-yellow). This separation is advantageous'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Multi-Criteria Decision-Making with Machine Learning


    for color correction tasks as it allows for independent adjustment of luminance
    and color information.


    Once in the LAB color space, L is equalized separately. This involves enhancing
    and balancing the contrast and brightness of the luminance component of the image.
    After the luminance equalization, the LAB channels are merged back to reconstruct
    the color image. After using the cv2.COLOR_LAB2RGB conversion function, the processed
    image is finally returned to the regular RGB format, suitable for additional examination
    or display.


    We performed this adjustment by scaling each pixel value in a color channel (c)
    based on the ratio of the average intensity of the current image ($Avg_{reference}$)
    to the average intensity of the current image ($Avg_{image}$). The formulas for
    computing the white-balanced pixel value at position (x, y, c) is given as shown
    in (9.3):


    ```

    $I_{ob}(x,y,c) = I(x,y,c) \times \frac{Avg_{reference}}{Avg_{image}} \quad (9.3)$

    ```


    where I(x,y,c) is the pixel value at position (x, y) in channel c and $Avg_{reference}$
    and $Avg_{image}$ are the average intensities of corresponding channels in a reference
    white-balanced image and the current image, respectively. These meticulous adjustments
    effectively correct color distortions, leading to a more accurate and visually
    pleasing representation of the underwater scene. Figure 9.1 shows enhanced images
    using histogram equalization and manual white balancing. The enhanced image clearly
    provides more clarity, allowing for easier captioning.


