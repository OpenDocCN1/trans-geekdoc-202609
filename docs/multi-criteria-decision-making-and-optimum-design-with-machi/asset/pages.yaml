    # 3.4.1 DEFINING THE PROBLEM


    The optimization problem is the following: Find $x = [P, Q, V_c, f_z, a_p]$ to
    minimize $\{R_a, F_c\}$, and maximize $[MRR]$ with the constraint in Equation
    (3.18):


