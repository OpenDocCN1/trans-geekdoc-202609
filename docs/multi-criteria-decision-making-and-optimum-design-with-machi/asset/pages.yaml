- pgno: 353
  md: '# Predicting Lumpy Skin Disease Using Machine Learning 323


    conclusions about accuracy based on the degree to which the model''s predictions
    agree with the actual labels. In binary classification tasks such as disease prediction,
    the confusion matrix comes in particularly handy because the objective parameter
    has two classes: positive (like a lumpy) and negative (like not lumpy). A matrix
    of confusion displays the four possible results of a binary categorization:


    +   - True positives (TP): the proportion of samples the model correctly diagnosed
    as (lumpy)

    - False positives (FP): the proportion of samples the model incorrectly diagnosed
    as positive (lumpy)

    - True negatives (TN): the proportion of samples the model correctly diagnosed
    as negative (no lumpy)

    - False negatives (FN): the proportion of samples the model incorrectly diagnosed
    as negative (no lumpy).


    Table 24.2 is a common representation of a confusion matrix.


    +   Accuracy: The proportion of correct predictions out of the total number of
    samples (TP + TN)/(TP + TN + FP + FN)

    Precision: The ratio of true positive predictions to all positive forecasts expressed
    as TP/(TP + FP). It gauges well the model can steer clear of false positives.

    Recall (Sensitivity): TP/FN is the ratio of true positive predictions to all real
    positive samples. It assesses how well the model can recognize positive samples.

    F1: A balanced measurement between the two is provided by F1, which is the harmonic
    mean of precision and recall (2 × Precision × Recall)/(Precision + Recall).


