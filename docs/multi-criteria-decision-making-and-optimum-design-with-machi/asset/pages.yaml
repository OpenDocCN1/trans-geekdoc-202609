    Currently, reinforcing compounds have attracted much attention in many fields,
    such as automobiles and electronics, thanks to the significantly mechanical properties
    of the material after reinforcement (Thaitipparasathy et al., 2008). Common materials
    used for reinforcement are GF, carbon fiber, and thermoplastics. Synthetic mixes
    of PA6 and GFs are widely used in research and industrial fields (Zuo et al.,
    2013). Because PA6 has good mechanical properties, low cost, and high temperature
    resistance, a GF coating applied to produce PA6-based composite panels achieves
    high performance (Kiss et al., 2021). SEM results show that PA adheres tightly
    to GF. In addition, the plastic strength of synthetic panels is up to 500 MPa,
    much higher than that of industrial containers.


    From these studies on PBT, PA6, and GF mixtures, especially the findings from
    Hamlaoui et al. (2022), we examined PBT''s mechanical properties with injection
    molding after GF reinforcement and found that after reinforced with GF, PBT''s
    mechanical properties increased significantly. For example, Young''s modulus increased
    to 77.33%, the tensile strength increased to 63.28%, and the yield strength increased
    to 65.12% when the ratio of GF was 30%. Based on these results, GF significantly
    improves the mechanical properties of a PBT/PA6 mixture, especially unmatched
    impact toughness.


