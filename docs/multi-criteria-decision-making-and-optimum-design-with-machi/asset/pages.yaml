    # 13.4.2 UNSERVISED LEARNING


    Unsupervised learning in MCDM is employed to uncover hidden patterns, group similar
    alternatives, or reduce the dimensionality of data without the need for labeled
    training examples. The following are some common unsupervised learning techniques
    and their applications in MCDM.


    # 13.4.2.1 Clustering Algorithms and Dimensionality Reduction


    Clustering techniques like k-means, hierarchical clustering, and density-based
    spatial clustering of alternatives with noise (DBSCAN) group similar alternatives
    based on shared characteristics. In MCDM, clustering can help segment alternatives
    with similar performance across multiple criteria, aiding decision-makers in identifying
    distinct categories of alternatives. Dimensionality reduction techniques, for
    example, t-SNE and principal component analysis, are used to reduce the number
    of variables while preserving important information (Shakaibi et al., 2023). In
    MCDM, these techniques can be employed to handle high-dimensional data with many
    criteria by transforming it into a lower-dimensional space.


