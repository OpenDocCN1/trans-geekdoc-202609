  md: 'Cruising through Choices


    # 21.2.2  TOURIST MOTIVATION WITH DESTINATION DECISION-MAKING


    Tourist motivation is a dynamic process of the interactions of push and pull motivations.
    Kim and Baum (2007) and Devesa et al. (2010) identified tourist characteristics
    are the push factors that explain the desire to go on vacation, while the pull
    factors are the destination characteristics that attract tourists.


    # 21.2.2.1  Tourist Characteristics


    Individuals'' decisions to travel are guided in part by their sociodemographic
    and personality traits (Wolfe & Hsu, 2004), researchers have extensively examined
    demographic factors as explanations for evoked alternative destinations and information-processing
    antecedents (Woodside & Lysonski, 1989). Gender, age, occupation, education, and
    socioeconomic class have been identified as push factors that influence destination
    perceptions, with age and education being particularly influential in final destination
    decisions (Um & Crompton, 1990).


    Bagolu and Mangalogu (2001) showed small differences in US destination image based
    on age, marital status, and occupation, and McIntosh and Goeldner (1984) suggested
    that travel incentives were influenced by sex, age, and education. Figure 21.1
    illustrates the relationship between tourist characteristics, travel motivations,
    and destination types. For instance, higher education levels influence travel
    motivation and the use of the Internet for travel-related transactions and seeking
    information (Bonn et al., 1999), and age, education, and marital status associated
    with travel decision-makers'' resources and constraints (Gretzel et al., 2012).
    Sociodemographic factors also affect tourist selection (Grönflaten, 2009; Sneger
    et al., 1990).


    ![](img/62c36bee0e5ae6b397770e7de372b0e7_307_0.png)


    FIGURE 21.1 Relationships between types of tourists, travel motivations, and types
    of destination.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 278 Multi-Criteria Decision-Making with Machine Learning


    # 21.2.2.2 Destination Characteristics


    21.2.2.2.1 Destination Environment

    Friden (1991) defined a destination environment as the social and physical surroundings
    at a given destination, and Murphy et al. (2000) identified destination environment
    characteristics as including physical variables like amenities, weather, climate,
    scenic and natural resources and social factors like culture, language, social
    structure, and residents'' friendliness. Potential negative social factors including
    culture, safety, security and socioeconomics cause significant barriers to tourism
    (Chon et al., 1999). Mihaliǐ (2000) found that destination environment influences
    travel decisions.


    21.2.2.2.2 Destination Image

    A destination image represents a complete set of beliefs about a place, an overall
    view of a destination, and a fundamental part of destination marketing (Chen &
    Tsai, 2007). Tourists tend to have preconceived opinions and expectations of a
    destination before visiting, and destination image influences tourist behavior
    and attracts them to a destination (Beerli & Martin, 2004; Woodside & Lonsky,
    1989; Hunt, 1975). The most crucial stage in tourists'' destination choosing is
    image formation before the trip. Chun (1991) demonstrated that good images significantly
    influence tourist decisions, which negative images do not.


    21.2.2.2.3 Destination Brand

    Destination brands are “perceptions” about a place reflected by the associations
    held in tourist memory” (Cai, 2002). Destination branding can be expanding into
    tourist despite little tourist literature coverage. Marzano and Scott (2009) studied
    destination brands for their external influence on tourist behavior and decisions,
    and Murphy et al. (2007) confirmed that destination brand and image are linked
    to customer decisions. Lim et al. (2012) argue that the Internet and social media,
    such as Facebook and Twitter, significantly influence decision-making, so marketers
    tend to combine branding techniques with social media. According to Cai (2002),
    vacation spot decision-making processes are complex, and destination branding
    must aim to build good reputations, boost competitiveness, and attract tourists.
    Garner and Ruzier (2011), Chun (1991), Echner and Ritchie (1993), and Prebensen
    (2007) have all highlighted the differences between destination image and destination
    brand. Prebensen (2007) particularly emphasized the sustainability of destination
    brand over destination image, although acknowledging similarities between the
    two.


    # 21.2.3 INFORMATION SEARCH IN TOURISTS’ DESTINATION DECISION-MAKING


    Information is crucial to decision selection and behavior at a destination, according
    to decision models. Consumer behavior researchers aim to understand how customers
    process information, which can impact their buying decisions (Frías et al., 2008).
    Fodness and Murray (1997) determined that information search affects and is affected
    by tourist characteristics, with some motivation and search components directly
    affecting destination intention.'
