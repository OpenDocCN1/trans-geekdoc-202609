    # 7.1 INTRODUCTION


    According to World Bank statistics, over two billion tons of solid waste each
    year are generated worldwide, with many components such as plastic, fabric, and
    rubber; plastic waste accounts up to 10% of the total waste and is extremely difficult
    to decompose or treat. Therefore, reusing or recycling plastic materials is an
    issue of great interest to researchers (Wang et al., 2017). While popular plastics
    as polypropylene and polyvinyl chloride receive significant attention, there are
    still plastics that receive little attention, as polybutylene terephthalate (PBT),
    the recycling source is vast, which are toothbrush bristles (Nga et al., 2021).
    The reason is that PBT has limitations in mechanical properties.


    PBT is a semi-crystalline engineering plastic belonging to the polyester family.
    Based on the advantages of mechanical properties such as durability, high hardness,
    good electrical insulation, and water resistance (Xiao et al., 2006), PBT has
    excellent potential when applied in industries such as automobiles, electricity,
    and electronics (Wei et al., 2011). However, disadvantages remain, such as shrinkage,
    even uneven shrinkage deformation, poorly impacted toughness, and low deformation
    temperature.


    PBT plastic is rugged in impact or high-temperature environments (An et al., 1996),
    but some researchers have improved on its mechanical properties. Researchers studied
    the efficiency of recycling PBT/PC/ABS composite with without glass fiber (GF)
    combination and found that the flexural strength and impact toughness of the recycled
    PBT/PC/ABS-GF composite were greater than those of the original PBT/PC/ABS-GF


