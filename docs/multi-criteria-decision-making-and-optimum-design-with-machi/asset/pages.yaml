    # 4.5 CONCLUSION


    In this chapter, we used Taguchi RSM to experimentally study the influence of
    seven 3D printing parameters on the tensile strength of FDM-printed samples of
    PLA to select the optimal parameters. For our work, we simply utilized a Taguchi
    orthogonal array in conjunction with ANOVA and RSM, and in a simple FDM 3D printing
    process using a Cubican Style®, we infused style, printing density, layer thickness,
    nozzle speed, extrusion rate, raster angle, and housing temperature.


    We determined from the S/N ratio analyses and the ANOVAS based on the Taguchi
    method with an OA L18 (21 36) that layer thickness was the most important parameter
    for increasing tensile strength, followed by printing density (65.27% and 12.47%).
    This was also confirmed by Minabit commercial software and an additional validation
    experiment. The results from this study corroborate that the method can be used
    to set 3D printer parameters for higher tensile strength when using conventional
    Taguchi methods or ANOVA. More importantly, these findings help lecturers and
    students better understand the impact of setting parameters on the tensile strength
    results of printed samples.


