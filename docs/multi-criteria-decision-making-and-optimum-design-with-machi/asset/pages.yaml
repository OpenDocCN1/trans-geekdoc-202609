  md: '# 276 Multi-Criteria Decision-Making with Machine Learning


    models (Cropton, 1979), such as the push–pull model (Dann, 1981) and four motivation
    connections (Murphy, 1985). Others have studied tourist motivation, including
    Mill and Morrison (1985), Mansfield (1992), McIntosh et al. (1995), Gno (1997),
    Goossens (2000), and Nicoletta and Servidio (2012). Moscardo et al. (1996) described
    tourist motivation as a combination of internal psychological factors (needs,
    wants, and goals), by Middleton (1994) asserted that motivation might align with
    long-term, multimotive, and nondeterministic needs and personal goals for travel
    groups.


    Kim et al. (1996) indicated that tourist motivation is a key determinant of visitor
    behavior: to promote a destination, marketers must understand what tourists’ actions
    and decisions (Gee et al., 1989). Tourist motivation is a complex topic that describes
    people’s decisions and before and during vacations. Fulfilling tourist desires
    requires understanding their primary motivations (Huang & Hsu, 2009). Some academics
    employed Maslow’s hierarchy of needs to analyze tourist motivation and found it
    to be a need or wish satisfaction (Mill & Morrison, 1985). Another Maslow-inspired
    researcher, Dann (1977), examined tourist investigators and push–pull elements
    when choosing a destination. Pe Calta and Calabtiano (1983) concluded, tourists
    choose destinations to meet their needs and wants.


    Tourism motivation literature widely accepts the distinction between push and
    pull influences. Dann (1997) and Cropton (1979) pioneered tourist motivation research
    by categorizing it into push and pull factors and categorized the latter as the
    underlying notion of travel (Cropton, 1979). The pull elements are tied to tourists’
    desires to leave an area and seek an intrinsic benefit, the pull aspects are related
    to destination qualities. Wolfe and Hsu (2004), individuals’ choices are controlled
    by push and pull influences, and I employed the push–pull construct as the backdrop
    that guides tourist decision-making from motivation to final decision.


    # 21.2.1.2 Decision-Making Theories


    Travel behavior experts have adapted the broad theories of consumer behavior to
    understand travel behavior. According to Woodside and Jacobs (1985), travellers’
    decision-making is complex and impacted by their behavior. Moutinho (1987) also
    proposed extensive conceptual and empirical efforts to define the model of tourist
    decision-making processes. Fuller et al. (2007) used multiple decision theories
    to outline the influences of internal and external factors on tourists’ trip-buying
    decisions; their personality, motivation, and lifestyle as internal elements in
    tourist behavior and situational, cultural, and family influences. Middleton (1994)
    also presented a trip decision model that identified stimulus input, communication
    channels, buyer characteristics and decision process, and purchase output components
    of the travel decision process; the author found that incentives drive travel
    behavior, bridging the gap between need and action or purchase. According to Mill
    and Morrison (2002), travelers’ decisions are influenced by four factors: tourism
    forces, motivation, destination selection, and travel purchase.'
