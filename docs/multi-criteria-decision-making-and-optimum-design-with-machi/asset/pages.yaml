    MCDM was introduced in the mid-1960s for enabling groups or individuals to rank,
    select, and/or compare different alternatives using several criteria to be considered
    simultaneously (Tzing et al., 2010). Tourist decision-making involves multiple
    criteria, which makes MCDM techniques effective decision-making aids. For this
    study, the criteria I examined tourist characteristics (sociodemographic features
    and personality traits), destination characteristics (environment, image,'
