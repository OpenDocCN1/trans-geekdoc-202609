  md: '# 280 Multi-Criteria Decision-Making with Machine Learning


    the following broad external information sources when planning their trips: word-of-mouth
    (WOM) advice from family and friends, destination-specific literature, media and
    travel consultants (third-party), and more recently, the Internet (Hyde, 2008).


    # 21.2.3.2.1 WOM from Friends and Family


    According to research, word of mouth from friends and family is the most influential
    pre-purchase information source; in WOM, consumers share their experiences with
    opinions about a company or product.


    Consumers use WOM to reduce risk and uncertainty (Zhang et al., 2010). The fundamental
    challenge in tourism is the absence of direct experience with a destination, making
    it difficult to assess its quality and benefits before consumption (Schmallegger
    & Carson, 2008), and advice from consumers who have used a tourist product such
    as a destination is influential in travel decision-making. WOM has long been a
    critical source for vacation planning and goods purchases (Shankar et al., 2003).


    # 21.2.3.2.2 Tourism Intermediaries


    Tourism products are delivered through numerous intermediaries such as travel
    agencies (Akehurst, 2009). Although the leading sources of information for making
    decisions are typically informal recommendations from friends and family, it can
    be helpful to seek professional information from tour operators or travel companies
    before a trip. People choose third-party trip planners, especially for large groups,
    to reduce the risks involved when searching for information and making travel
    arrangements. Goens (2000) stated that features provided by travel agencies and
    the information provided in brochures improve tourists'' external searches, although
    travelers rated SNS information searches as more influential than the information
    from agencies.


    # 21.2.3.2.3 Social Networks


    Researchers define online networking as “a platform that enables users to share
    personal interest and connection with others who have similar interests and “activities”
    or Internet-based applications that facilitate the sharing of consumer-generated
    content (CGC) (Boyd & Ellison, 2007). One “mega-trend” on the internet is nearly
    half of trip buyers visit a forum or online community before making a decision
    (Zhang et al., 2010). Social networking hosting sites CGC as blogs, Facebook,
    and LinkedIn and media platforms like YouTube and Flickr are particularly among
    online travelers.


    Social media allows consumers to share their experiences in different ways, such
    as by posting stories, comments, photos, and videos, and potential travelers can
    learn from friends and make informed decisions about operators based on feedback
    from close friends, family, coworkers, and even strangers worldwide (Xiang & Gretzel,
    2010). Gretzel and Yoo (2008) discovered that readers trust travel reviews more
    than travel service provider information. Researchers have extensively studied
    online traveler reviews on social media because of their importance to both visitors
    and tourism firms (Ye et al., 2009).'
