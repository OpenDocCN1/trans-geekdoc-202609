  md: '# 3D Printing for Optimum Tensile Strength with a Taguchi Method


    and found their optimal 3D printing conditions. However, due to limitations of
    experimental setup and data analysis methods, optimal parameters for all factors
    could not be given simultaneously. Next, a different research group used ANOVA
    to study the impacts of layer thickness and raster angle on the tensile strength
    of FDM 3D-printed samples for ABS (acrylonitrile butadiene styrene) and PLA [2].


    In addition, V. Kovan et al. [3] studied the impacts of layer thickness and printing
    orientation angle on the mechanical properties of PLA 3D-printed specimens. Since
    there were only two parameters, they used a full factorial design and found the
    appropriate parameters for maximum tensile strength. Meanwhile, in addition to
    raster angle and layer thickness, M. Leite et al. [4] also researched infill density
    and extrusion temperature for their printer; however, they did not calculate the
    contribution level, in other words, the significance of the parameters.


    Also using ANOVA with FDM printing PLA material, the authors in [5] used central
    composite design for experimental planning. With only three parameters, namely
    deposition angle, extruder temperature, and printing speed, they needed as many
    as 17 experiments; however, could not conclude the importance of the parameters.
    To overcome these disadvantages, others used the Taguchi method to improve the
    tensile properties of 3D-printed PLA samples [6]. These authors optimized infill
    density, nozzle temperature, honeycomb infill, and extrusion width and concluded
    that infill density plays a major role in influencing tensile strength. Also using
    the Taguchi method, researchers used 14 parameters but selected only three: infill
    density, printing speed, and layer thickness; their study was not comprehensive,
    and they also found that infill density was the most important parameter [7].


    Meanwhile, authors who studied two parameters, printing temperature and printing
    speed, used full factorial design and concluded that the tensile strength of PLA
    samples was proportional to both temperature and printing speed [8]; however,
    because they did not apply experimental planning, they could not evaluate the
    influence of these two parameters. Also studying two parameters—printing temperature
    and printing speed—a more recent research group used both PLA and PETG plastic
    [9]; in line with previous research, they also concluded that the mechanical properties
    of PLA samples were proportional to printing temperature and speed. Also using
    full factorial design, others studied only the effect of infill density on tensile
    strength and showed the importance of infill density in optimizing tensile strength
    on FDM 3D printers [10].


    The authors of [11] studied seven parameters to gain a more general view in optimizing
    the process; using the Taguchi method for PLA samples, the authors concluded that
    infill density and infill pattern were the two important parameters affecting
    tensile strength, 36% and 29.2%, respectively. They also determined that 3D-printed
    objects were highly orthotropic materials, so their mechanical properties were
    greatly influenced by the geometry (scalability effects). Hence, printing position
    factors can also have an important impact on tensile strength results. Also using
    the Taguchi method, researchers studied only four parameters—printing temperature,
    infill density, infill angle, and layer thickness—instead of seven to achieve'
