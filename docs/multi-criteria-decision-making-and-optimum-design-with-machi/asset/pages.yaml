    # 19.4.6 MODEL DEPLOYMENT


    Once the back was complete and the complete model was tested, the model provided
    at least 90% accuracy and provided different results for deep analytics. We used
    the following technology stack to design the interface: Node.js, React, MongoDB,
    Python, Canvas.js. We provided the application with data on 25,000 sales transactions
    after processing the data using ML models with supervised and unsupervised learning.
    The front end of the application showed the factors that were being measured with
    the application: item sales data, sales locations for multiple stores, comparison
    of algorithms, the accuracy of the model, and server performance while processing
    data.


