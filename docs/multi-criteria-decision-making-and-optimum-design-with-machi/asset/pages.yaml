    # 4.2 PROBLEM STATEMENT


    In the Industrial Revolution 4.0, 3D printing is an important component. Therefore,
    it is now critical to include 3D printing, or additive manufacturing, in education.
    As a typical technique, FDM is easy to use, easy to understand, and suitable for
    new learners, and it is often included at universities as well in short-term STEM
    courses. While giving students, lecturers not only have to guide students to operate
    the machine but also explain the factors that affect the quality of printed products.
    Regarding printed product quality, there are two main criteria: tensile strength
    and surface quality [13]. While the surface quality of FDM-printed products is
    mainly affected by the thickness of the printed layer, the factors that affect
    tensile strength are much more complex. While initial thoughts suggest that printing
    temperature or printing speed this issue needs to be carefully studied.


    Specific to our work, it is necessary to teach 3D printing as part of supporting
    students their graduation thesis for the Faculty of Mechanical Engineering (FME),
    Industrial University of Ho Chi Minh City (IUH): practical situations at the couple
    have shown that tensile strength was the most important criterion. Normally, for
    a mechanical engineering thesis, the students design and make a few typical parts
    of metal, using 3D printing to produce secondary parts to speed up the process
    of completing the thesis. The main goal of a graduation thesis is to help students
    use the knowledge they have learned to manufacture a device, test it, and document
    the outcomes; the goal is not to mass-produce products. Therefore, the application
    of 3D printing to support graduation theses is appropriate and meets the training
    needs for Industry 4.0.


    We consider researching the parameters that affect the tensile strength of FDM
    3D-printed products is necessary for FME lecturers guiding students and training
    facilities in general. In this study, we use a two-step optimization process to
    help operators understand and select the optimal printing parameters. However,
    the process applies not only to FDM 3D printers but to additive manufacturing
    in general.


    # 4.3 MATERIALS AND METHODS


    # 4.3.1 The FDM 3D PRINTER


    For this work, we used a Cubicon Style® 3D printer to fabricate specimens, as
    illustrated in Figure 4.1. The printer was characterized by its rectangular form
    with dimensions of 322 x 350 x 486 mm and a weight of 15 kg. The printer was equipped
    with three stepper motors for its operational control. Specifically, one of these
    stepmotors facilitated movement along the Z-axis through a lead screw mechanism,
    while the remaining two motors governed movement along the X-axis and Y-axis employing
    a belt mechanism. We used the default printer nozzle of 0.4 mm. The printer could
    achieve a maximum printing speed of 150 mm/s. In terms of its spatial printing
    capabilities, the printer can produce polymeric objects with dimensions up to
    150 x 150 x 150 mm in length x width x height, respectively.'
