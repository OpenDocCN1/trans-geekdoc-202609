    the aerodynamic design allows lowering the height of the hammer, meeting the need
    for impact testing smaller than 2.82 J, which the impact energy can easily vary
    up to 25 J using different load sets. The machine has a solid structure with speeds
    of 3.14 m/s and 2.91 m/s, respectively. mounted on the hammer, the impact design
    that ensures impact accuracy and energy loss caused by wind. The samples were
    broken after the impact toughness test, as shown in Figure 7.3. The breaking positions
