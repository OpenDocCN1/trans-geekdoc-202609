  md: '# # 4 3D Printing Parameters for Optimum Tensile Strength Using the Taguchi-Based
    Response Surface Method


    Trieu Khoa Nguyen*, Nguyen Thy Ton That, and Binh-Duong Nguyen


    # ## 4.1 INTRODUCTION


    Today, 3D printing is a prominent manufacturing methodology characterized by remarkable
    advancements in fabricating intricate geometries that pose challenges for conventional
    manufacturing techniques. Its applications span a wide spectrum, encompassing
    diverse sectors including manufacturing and education. It can be classified into
    liquid-based, solid-based, or powder-based printing, with many different variations.


    Among the array of 3D printing technologies, solid-based fused deposition modeling
    (FDM) distinguishes itself as the most prevalent approach for producing plastic
    parts. This prevalence owes itself to FDM''s user-friendly operational characteristics
    and cost-effectiveness and the availability of a broad spectrum of printing materials.
    Notably, the materials compatible with FDM range from pure plastics to varying
    proportions of metals or even wood. Invariably, the quality of a 3D-printed object
    is contingent not only upon the selected material but also on printing parameters
    including layer thickness, infill density, printing speed, deposition temperature,
    chamber temperature, and printing angle. As a result, many researchers have undertaken
    the task of optimizing these printing parameters to cater to the distinct characteristics
    of various polymeric materials.


    There has been much research on optimizing FDM 3D printing to optimize the mechanical
    properties of polyacrylic acid (PLA) by the parameters of build orientation, layer
    thickness, and feed rate [1]. In this study, because there were only three inputs,
    the authors used a full factorial setup; they used (ANOVA) to analyze experimental
    data with Statgraphics Centurion XVII software. They also analyzed the impact
    of each individual factor on tensile strength


