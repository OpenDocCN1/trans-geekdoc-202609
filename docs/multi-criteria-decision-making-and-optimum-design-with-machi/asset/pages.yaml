    parameter with the least lubricant for milling H13 steel; they determined that
    the feed rate has the strongest influence on the surface roughness. Interestingly,
    Yan et al. [14] investigated the thermo-mechanical model of turning finished H13
    hardened steel by examining the machining parameters. The outcomes can be used
    to improve the design of cutting inserts and optimize process parameters for AISI
    H13 turning. Zhang et al. [15] studied thermal deformation with thin-walled shapes
    during WEDM. They machined AISI H13, SKD 11 and Inconel 718 with different wire
    parameters, speeds, and pulse-on time, the thermal deformation during WEDM was
    strongly impacted by physical properties, yield strength, and thermal conductivity.


    Optimizing machining parameters is one effective method of achieving the best
    results from multiple parameter conditions [16, 17, 18]. Sadhana et al. [19] studied
    the impact of optimizing WEDM parameters on the material removal rate (MRR) and
    surface roughness (Ra) of AISI H13 steel and found that had had the impact on
    MRR and Ra. Chockaling et al. [20] also considered the spark gap and dimensional
    deviation during the WEDM of AISI T-15-HSS steel. they investigated the impact
    of certain parameters—reference value, pulse-on time (Ton), pulse-off time (Toff),
    wire speed, tension and pressure mode—and analyzed the results using MATLAB 6.5
    gray ratio analysis and Lingo 6 optimization software. Among parameters, Ton,
    Hoff and wire speed had the greatest impact on MRR, Ra, spark gap, and dimensional
    deviation.


    In particular, Toff achieved the highest contribution for all these machining
    parameters. Manjaiah et al. [21] studied the impacts of machining parameters on
    AISI D2 steel. The authors used Taguchi optimization. Different from Chockaling
    et al. [20], Manjaiah et al. found that Ton had the most dramatic impact on the
    MRR and the Ra of the AISI D2 steel.


    Meanwhile, Zhang et al. [22] revealed the impact of process parameters on the
    tungsten tool YG15. They investigated the tool''s layer thickness and crack density,
    and the results indicated that Ton and pulse current have a great impact on Ra,
    layer thickness, and surface crack density. Rathod et al. [23] also investigated
    the impact of process parameters on WEDM of H13 steel. They applied the multi-objective
    JAYA algorithm and the Taguchi method to optimize Ra and MRR, and these authors
    found that Ton and voltage gap had the greatest contribution to Ra, while the
    wire speed was most important for MRR.


    Dhoe et al. [24] pinpointed that achieving a good surface finish is a complex
    issue, especially in WEDM because the combination of many process parameters and
    materials. They investigated the WEDM process for cryoted AISI D2 tool steel and
    applied Taguchi Design of Experiments. Dhoe et al. also determined that Ton had
    the most significant impact on Ra, whereas Toff had the weakest impact. They provided
    a regression model for successfully predicting Ra that was consistent with the
    experimental results.


