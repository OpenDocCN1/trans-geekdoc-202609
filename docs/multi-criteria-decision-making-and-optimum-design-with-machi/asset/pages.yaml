    # 9.4.1 CONTRAST IMPROVEMENT


    To quantify the effectiveness of histogram equalization, we calculated the enhancement
    in contrast (Ceq) using Equation (9.4):


    ```

    $C_{eq} = \frac{\text{Mean intensity of enhanced image}}{\text{Mean intensity
    of original image}} \quad (9.4)$

    ```


    # 9.4.2 COLOR ACCURACY


    To quantify the improvement in color accuracy achieved by the manual white balancing,
    we measured the color accuracy using Equation (9.5):


    ```

    $CA = 1 - \frac{\text{Mean squared difference between white balanced image \text{
    and reference image}}{\text{Maximum possible mean squared difference}} \quad (9.5)$

    ```


    # 9.4.3 OVERALL IMAGE QUALITY EVALUATION


    We evaluated overall image quality using the peak signal-to-noise ratio (PSNR)
    and the structural similarity index (SSI). SSI is computed using a combination
    of luminance, contrast, and structure measures, providing a comprehensive evaluation
    of image quality, and PSNR is computed as Equation (9.6):


    ```

    $PSNR = 10 \cdot \log_{10} \frac{\text{Max intensity}^2}{\text{Mean squared difference
    between original and enhanced images}} \quad (9.6)$

    ```


