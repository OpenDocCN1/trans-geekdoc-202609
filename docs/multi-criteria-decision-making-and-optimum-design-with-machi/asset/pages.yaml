  md: '# Multicriterion Analysis of Fusion Sort


    ![](img/62c36bee0e5ae6b397770e7de372b0e7_301_0.png)


    **FIGURE 20.6** Number of comparisons for large input sizes.


    # Choosing the Pivot:


    +   * The ‘choose_pivot’ function selects the pivot element in O(1) time as it
    only involves basic array indexing and comparisons.


    # Partitioning the Array:


    +   * The ‘partition’ function divides the input array into two subarrays based
    on the pivot element in linear time, O(n), where n is the size of the input array.
    It iterates through the array once and assigns each element to one of the two
    subarrays.


    # Recursive Calls:


    +   * Fusion Sort recursively calls itself on ‘smaller_subarray’ and ‘larger_subarray’.
    The size of these subarrays is proportional to the size of the original array.


    # Merging the Subarrays:


    +   * ‘Merge’ combines the sorted subarrays and the pivot element into a sorted
    array in linear time, O(n), where n is the total number of elements in the input
    array.


    T(n) represent the time complexity of Fusion Sort for an input array of size n.
    The time complexity can be expressed as a recurrence relation:


    ```

    T(n) = 2 x T(n/2) + O(n) (20.1)

    ```


    The recurrence relation is derived from the two recursive calls in Step 1, and
    the time complexity for merging the subarrays in Step 5.'
