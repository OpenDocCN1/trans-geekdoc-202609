  md: '# 18 AI-Powered Decision-Making Applications for Sustainable Development


    Yang Minghai, Fluturim Saliu, and Waqar Akbar Khan


    # 18.1  INTRODUCTION


    Artificial intelligence (AI) refers to the field of computer science that focuses
    on developing intelligent machines capable of performing tasks that typically
    require human intelligence, for instance, speech recognition, decision-making,
    problemsolving, learning, and visual perception. AI systems are designed to analyze
    vast amounts of data, make predictions, and automate complex processes, thereby
    mimicking human cognitive abilities (Copeland, 1993).


    The concept of AI dates to ancient times, with myths and legends depicting artificial
    beings capable of human-like actions. However, it was in the mid-20th century
    that AI emerged as a formal discipline. The term "artificial intelligence" was
    coined by John McCarthy, who organized the Dartmouth Conference in the 1950s,
    widely regarded as the birth of AI as a field of study. Over the years, AI has
    witnessed significant advancements driven by breakthroughs in computing power,
    data availability, and algorithmic innovations. One crucial aspect of AI is machine
    learning (ML), a subset of AI that focuses on creating models and algorithms that
    enable machines to learn and improve from data without explicit programming. Deep
    learning, a subset of ML, utilizes artificial neural networks to simulate the
    functioning of the human brain and has played a pivotal role in revolutionizing
    AI applications such as image and speech recognition (Howard, 2019 and McCarthy
    et al. 2006).


    # 18.1.1 EVOLUTION AND IMPACT OF AI


    Goodfellow et al. (2016) describe AI as the ability of machines to execute an
    array of tasks with support from people. Machines are going to acquire knowledge,
    resolve complicated tasks, make plans, consider those plans, etc. with support
    of AI; however, to make intelligent judgments and carry out activities that would
    ordinarily need human intellect, AI systems often rely on massive amounts of information
    as well as techniques. These systems are capable of data analysis, understanding
    patterns, forecasting language comprehension, and environment interaction. It
    is expected in the not-too-distant future, artificial intelligence will significantly'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Multi-Criteria Decision-Making with Machine Learning


    change the way people live and, put an end to all of the world''s issues by resolving
    the key dilemmas (Sarker, 2021).


    AI has applications across various domains, transforming industries and impacting
    society numerous ways. Minghai et al. (2023) described artificial neural networks
    in deep learning modeled the structure and operation of the human brain. In health,
    AI is utilized for early disease detection, medical image analysis, and drug discovery.
    In finance, AI algorithms are used for fraud detection, risk assessment, and algorithmic
    trading (Dhanabalan and Sathish, 2018). These applications can also help identify
    fraudulent activities in areas such as financial transactions, insurance claims,
    and cybersecurity.


    AI-powered decision-making applications can optimize supply chain operations by
    analyzing factors such as demand, inventory levels, transportation costs, and
    production schedules (Khan et al., 2023). AI-powered decision-making applications
    have been acknowledged for their potential to assist in sustainable development
    (Topol, 2019). AI-powered virtual assistants like Siri and Alexa have become parts
    of our daily lives, and self-driving cars are on the verge of transforming transportation.
    AI-powered applications can be used for vehicles'' navigation in their environments
    and to optimize energy consumption by analyzing data from smart grids, weather
    patterns, and consumer behavior (Shoham and Leyton-Brown, 2020).


    # 18.1.2 LEVERAGING AI FOR SUSTAINABLE DEVELOPMENT: OPPORTUNITIES, CHALLENGES,
    AND ETHICAL CONSIDERATIONS


    Today, sustainable development is a complex concept that aims to strike a balance
    between economic development, social progress, and environmental preservation
    to fulfill the demands of the current generation jeopardizing the ability of future
    generations to meet their own needs; sustainable development is a comprehensive
    approach to meeting the requirements of both the present and the future. However,
    accomplishing sustainable development objectives calls for a significant amount
    of information processing and analysis competence. By making it easier to anticipate
    needs and more efficiently prepare for achieving sustainable development, AI can
    greatly support this (Iqbal et al., 2023).


    Owing to global issues environmental degradation, declining diversity of life,
    disparities, and exhaustion of natural resources, there has been a growing awareness
    of the significance of sustainable development ideas in decision-making processes,
    many operations, and personal behavior (Khan et al., 2023). It is crucial to include
    sustainable development goals. The United Nations Sustainable Development Goals
    (UN SDGs), established in 2015, provide a comprehensive framework for solving
    global sustainability concerns and attaining sustainable in the 21st century (United
    Nations, 2015), and AI-powered decision-making can be useful in achieving these
    goals.


    However, even though technology can aid in sustainable development, AI should
    be used with honesty and transparency. Effort should be made to promote fairness,
    transparency, and responsibility in AI systems to prevent prejudices or unintended
    adverse consequences (Khan et al., 2023). Cooperation between industry, academia,
    and community stakeholders is necessary to fully fulfill AI''s potential'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# AI-Powered Decision-Making for Sustainable Development


    for sustainable development. However, as AI continues to advance, it also raises
    important ethical and societal concerns. Issues surrounding data privacy, algorithmic
    bias, and the impact of AI on employment and socioeconomic equality need to be
    carefully addressed to ensure the responsible development of AI systems (Miller,
    2022).


    In conclusion, AI is a rapidly evolving field with the potential to revolutionize
    various aspects of our lives. It encompasses a broad range of technologies and
    techniques aimed at creating intelligent machines capable of performing tasks
    that were once exclusive to human intelligence. With continued research and development,
    AI holds the promise of unlocking new possibilities and transforming industries
    across the globe.


    # 18.2 BENEFITS OF AI FOR SUSTAINABLE DEVELOPMENT


    According Jeffrey Sachs, a Columbia University professor of health policy and
    management, the world is entering a new age of sustainable development, in which
    nations must work together to address the stubborn issues such as extreme poverty,
    social exclusion, economic injustice, and environmental degradation. Sachs also
    served as a senior advisor to the UN on the SDGs and the Millennium Development
    Goals, and currently serves as the director of the UN Sustainable Development
    Solutions Network. He suggested a paradigm for studying sustainable development
    through the four pillars of economic development, social development, environmental
    protection, and good governance at the 2002 UN World Summit on Sustainable Development
    in Johannesburg. Not only these four areas are interconnected, they are all necessary
    for global sustainable development (Goralski and Tan, 2020).


    Researchers have long studied AI, from its beginnings to the present day. Innovators
    in modern fields incorporate AI into theory, thought processes, and practical
    solutions to issues, industry trade magnets and academic journal articles have
    added to the study. AI investment began with an abrupt increase, and then, following
    narrow returns, investments increased, and decreased, in a declining regular trend
    toward AI''s history. AI has had a mixed record of either success or failure (Munoz
    and Naik, 2018).


    # 18.2.1 AI FOR EXCLUSIVE EDUCATION AND SUSTAINABLE DEVELOPMENT


    AI''s disruptive power spans all economic and social areas, including education.
    For instance, it can lower barriers to education, automate management processes,
    and optimize learning processes to improve learning results (Pedró et al., 2019).
    However, the use of AI in education raises problems regarding ethics, security,
    and human rights. Without government intervention, commercial AI deployment would
    widen digital gaps and exacerbate financial and learning inequalities, as marginalized
    and underprivileged populations are more likely to be excluded from AI-powered
    development. The rapid advancement of AI technologies will have a substantial
    impact on the skills required by various industries. Already, there is a significant
    skills gap in the labor market for AI-related occupations and talents.'
