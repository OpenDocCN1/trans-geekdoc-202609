    # 19.6 CONCLUSION


    The algorithms we compared in the research for this chapter provide enough information
    to determine what could be expected from the model. We compared one supervised
    and one unsupervised learning algorithm on multiple factors based on the attributes
    provided to the algorithm via the data set. The interface we developed provided
    empirical analysis on the following factors: attributes, data visualization, mean
    sales prediction, model accuracy and deviation from real values, and server performance.
    The proposed interface provides better accuracy for decision-making.'
