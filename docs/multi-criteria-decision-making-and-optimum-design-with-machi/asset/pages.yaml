    # 7.3.2 THE SAMPLE MICROSTRUCTURES


    After measurement, we took samples to capture the microscopic structures at the
    fracture surfaces for observation (Figure 7.5).


    Figure 7.6 shows the microstructures of the PBT/PA6/GF samples with each GF ratio:
    0, 3, 6, 9, 12, 15, and 18% GF. Observing sample PBT/PA6/0%GF, we see small round
    dots that are PA6 plastic components evenly dispersed on the surface of the PBT
    substructure. Next, the PBT/PA6/9%GF sample shows cylindrical fibers that are
    the GF component; at this time, the small round dots gradually disappear, and
    the PBT/PA6 mixture becomes smoother. We finally observe that the samples with
    higher proportions of GF show increasingly even distribution on the PBT/PA6 substrate.'
