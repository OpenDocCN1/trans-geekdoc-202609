  md: 'Cruising through Choices 281


    # 21.2.4 TRAVEL PLANNING AND DESTINATION-MAKING


    Travel decision-making can be explained partly by a hierarchical structure with
    decisions and subdecisions spread across layers. These include trip characteristics
    (travel purpose, distance, and length of the trip) and destination choices (evaluate
    choice, purchase, etc.) (Moutinho, 1987).


    # 21.2.4.1 Travel Characteristics


    The purpose of the trip is considered the most significant influence on the traveler''s
    decision-making. Moscardo et al. (1996) divided the primary purpose of travel
    into four main categories: business, visiting friends or relatives, personal issues,
    and pleasure, although Dwyer et al. (2000) found that product type and information
    sources influence consumers'' purchase decisions. Travel distance is also an essential
    dimension of any travel planning; overcoming distance imposes a major constraint
    on travel behavior (Chon et al., 1999). Beck and Schiff (2011) identified that
    the influence of travel distance on tourists'' decision to travel to New Zealand
    decreased slightly with longer stays in the country and with greater total distances
    during their stay. However, Cook and McCleary (1983) suggest that most consumer
    travel models contain a distance variable, often representing estimates from travel
    origin to potential destination. Meanwhile, Decrop and Snelders (2005) and Money
    and Crotts (2003) found that length of stay at a destination is one of the key
    elements in tourism decision-making and purchase behavior.


    # Travel Travel Choices


    Personal preferences and objectives play a significant role in determining the
    choice of holiday destination (Decrop, 2010; Moutinho, 1987). Careful travelers
    gather relevant facts and information from diverse sources of information and
    evaluate their options to make well-informed decisions, beginning with destination.
    Personality and sociodemographic traits, such as age, education, occupation, and
    the approach to gathering information, also contribute to the destination decision
    process. Tourists face challenges when evaluating travel and tourism services,
    leading to an increased perception of decision-making risk as consumers value
    efficiency in time and expense for making rapid and cost-effective travel plans
    (Arsal et al., 2010). The consumer weighs all the inputs and makes the final choices
    and purchases.


