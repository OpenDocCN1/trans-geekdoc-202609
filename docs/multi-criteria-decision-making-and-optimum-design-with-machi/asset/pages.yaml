- pgno: 309
  md: '# Cruising through Choices


    Consumers commonly employ search methods to aid in their purchase decisions while
    tourists rely on diverse sources of information that differ on the type of holiday
    and traveler. Common sources of information for travel planning including recommendations
    from friends and family, destination-specific literature as guidelines and travel
    brochures, professional advisors such as travel agencies, and increasingly, the
    Internet (Nolan, 1976). Tourism information search uses internal and external
    sources (Ho et al., 2012). Sharon & Smith (1987) claimed that people first examine
    their memory for information, then go out and find it. This section discusses
    the second stage of tourist decision-making, information search, which involves
    seeking of information from memory or the surroundings.


    # 21.2.3.1 Internal Search


    Whenever travelers realize that they need to decide, an information search is
    likely to occur. Initially, the decision-making takes place internally based on
    previous experience and knowledge (Fodness & Murray, 1997).


    # 21.2.3.1.1 Memory


    Experience with different places and activities is key to leisure decision-making
    (Snepinger et al., 1990). Murray (1991) asserted that consumers review purchase
    memories and product knowledge via environmental learning before making a new
    product. Internal search refers to the process of retrieving decision-relevant
    information from long-term memory. Internal sources also include personal encounters
    with a specific location or a similar one (Vogt & Fesenmaier, 1998). Additional
    research indicates that experience affects planning knowledge acquisition.


    # 21.2.3.1.2 Knowledge


    Prior knowledge is fundamental for information searches because it strongly affects
    the decision-making process (Kerstetter & Cho, 2004). Gursoy and Terry Umbreit
    (2004) found that decision-makers'' knowledge, attitude, and motivation drive
    strategy selection; to make decisions efficiently, individuals must come across,
    remember, and analyze information because memory-based knowledge is essential
    for information processing. Consumer behavior researchers have investigated variables
    such as familiarity and product experience; as individuals learn more about a
    product, their decisions are frequently influenced by memory, prior knowledge,
    and familiarity rather than external information (Bettman, 1979).


    # 21.2.3.2 External Search


    While investigating the effect of prior knowledge on information search behavior,
    DiPetro et al. (2007) found a high probability of using external information sources
    to make decisions during the first stage of product knowledge. Furthermore, Hyde
    (2008) found that tourists are likely to seek information from external sources
    when it is not present in their knowledge and memory. That is, external search
    is necessary for individuals who are unfamiliar with the product, including travelers
    deciding on destinations. Travelers utilize


    279'
