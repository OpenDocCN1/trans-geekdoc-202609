  md: '# 320 Multi-Criteria Decision-Making with Machine Learning


    between inputs and outputs to predict new, unobserved data. Predicting a discrete
    label for a class is a supervised learning technique like classification; sentiment
    analysis, picture categorization, and spam detection are a few examples. Predicting
    a continuous measurement is known as regression; forecasting the stock market
    and home price are two examples.


    # 24.3.2 UNSUPERVISED LEARNING


    In this method, a set without labels is used to train the model, and it searches
    for data structures and patterns without explicit output labels. For instance,
    in clustering, the model aggregates comparable data items in groups according
    to their shared characteristics; customer segmentation and picture segmentation
    are two examples. Another unsupervised learning technique is dimensionality reduction,
    lowering the number of input characteristics without sacrificing significant data.
    This group includes methods such as principal component analysis. Semi-supervised
    learning trains models that are partially labeled, unlabeled data with supervised
    learning and labeled unsupervised. Reinforcement learning teaches an agent how
    to interact with its surroundings to accomplish predetermined objectives. It receives
    feedback for its activities in the form of benefits or penalties, and it makes
    better decisions based on this knowledge.


    Deep learning is a branch of machine learning that models related relationships
    by employing multi-layered artificial neural networks, or “deep architectures.”
    Deep learning has made tremendous strides in activities like image identification,
    natural language processing, and gaming. Transfer learning entails applying skills
    from one activity or area to achieve a similar or an unrelated task or domain;
    less data helps the model perform better.


    Ensemble learning is the process of combining many models (such as neural networks
    and decision trees) to obtain predictions that are more reliable and accurate.
    Frequent ensemble learning strategies include bagging, boosting, and stacking.
    Online learning allows an algorithm to evolve and acquire knowledge from data
    by continually updating it as new information becomes available. Generative models
    are those that can create new sets that resemble the training set of data by understanding
    the fundamental pattern of distribution of data. Variational autoencoders and
    generative adversarial networks (GANs) are two examples.


    Each of the ML approaches we discuss in this overview has advantages and disadvantages;
    the best choice of action will rely on the particulars of the situation as well
    as the qualities of the data at hand. With respect to this chapter’s study, developing
