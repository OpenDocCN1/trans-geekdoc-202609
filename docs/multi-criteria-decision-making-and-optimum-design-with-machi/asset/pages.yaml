    Therefore, a higher weight should be assigned to that criterion. Subsequently,
    the weight $w_i$ for the $i^{th}$ criterion is calculated using Equation (3.11):


    ```

    $w_i = \frac{1-e_i}{\sum_{i=1}^n (1-e_i)} \quad (3.11)$

    ```


    Apply $w_j$ corresponding to each optimization criterion in the subsequent steps.

    Step 4: Calculate and construct the weighted normalized decision matrix, where
    $wj$ is the weight of criterion $j$, calculated according to Equation (3.12):


    ```

    $Y = w_j \cdot p_{ij} \quad (3.12)$

    ```


    Step 5: Identify the best and worst solutions using Equations (3.13) and (3.14):


    ```

    $A^+ = \{y_1^*, y_2^*, \dots, y_j^*, \dots, y_n^*\} \quad (3.13)$

    ```


    ```

    $A^- = \{y_1^-, y_2^-, \dots, y_j^-, \dots, y_n^-\} \quad (3.14)$

    ```


    where $y_j^*$ and $y_j^-$ correspond to the best and worst alternatives, respectively,
    for criterion $j$.

    Step 6: Calculate the positive ideal value $S_i^*$ and the negative ideal value
    $S_i^-$ using Equations (3.15) and (3.16):


    ```

    $S_i^* = \sqrt{\sum_{j=1}^n (y_{ij} - y_j^*)^2} \quad i=1, 2, \dots, m \quad (3.15)$

    ```


    ```

    $S_i^- = \sqrt{\sum_{j=1}^n (y_{ij} - y_j^-)^2} \quad i=1, 2, \dots, m \quad (3.16)$

    ```


    Step 7: Determine the evaluation criteria and rank the solutions $C_i^*$ using
    Equation (3.17):


    ```

    $C_i^* = \frac{S_i^*}{S_i^* + S_i^-} \quad i=1, 2, \dots, m; \ 0 \le C_i^* \le
    1 \quad (3.17)$

    ```


