    # ## 15.1 INTRODUCTION


    Computers can learn on their own, without being taught, to carry out tasks, according
    to the core idea of machine learning. Given its capacity to automatically identify
    patterns in data and predict future outcomes, machine learning has become increasingly
    demanding for making judgments in a variety of areas, including financial trading
    and medical diagnosis.


    To resolve ambiguous circumstances, Fuzzy theory [11] is essential. After the
    fuzzy set was extended, a new set known as intuitionistic fuzzy sets [9] was developed.
    Smandache developed the general idea of neutrosophic sets and later later scholars
    exposed as Pythagorean, bipolar [2, 5], and Fermate [7] neutrosophic sets. Broumei
    measured the Hausdorff distance between two neutrosophic sets [2, 3], and digital
    neutrosophic topological spaces were first suggested by Nirmada Devi [4, 5, 6].
    Incomplete and ambiguous data in MCDM [10] challenges exposed the variable of
    approximate reasoning and pushed the decision-making process to new advancements
    and innovation.


    The theory of neutrosophic logics extends to include number theory, operations
    research, algebra, topology, probability, and numeric measures. Field neuro neutrosophic
    theory is exposed in a wide range of fields including image processing, large-scale
    image and multimedia processing, machine learning, big data analytics, deep learning,
    visualization, feature learning, classification, regression, and clustering, virtual
    reality, heterogeneous data mining multimodal sensor data, sensor networks networks
    astronomy, space sciences, bioinformatics and medical analytics, retrieval of
    medical images, brain-machine interfaces, medical signal analysis, and large-scale
    health care data.


    In this chapter, we introduce the basic concepts of spherical neutrosophic sets
    (SNSs); mathematically, $SPH_N\_S$ and their characteristics and introduce SNS
    similarity measure; in more detail, we discuss tangent an SNS similarity measures.'
