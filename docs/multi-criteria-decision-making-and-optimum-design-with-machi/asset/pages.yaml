    The rest of the paper is organized as follows. First, we present a literature
    review of EVCS selection. Next, we explain the basic concepts of traditional MCDM
    methods by discussing the basic theories of AHP and VIKOR. In the third section,
    we discuss and apply the working AHP-VIKOR hybrid model, and in the fourth section,
    we give the results. Lastly, we conclude the proposed research.


    # 10.1.1 Literature Review


    Selecting optimal EVCSs is a real-life multicriteria decision-making challenge
    because the relevant criteria conflict with each other (Sen et al., 2015), yet
    doing so is critical for the evolution of the green industry. Authors have conducted
    a number of investigations on EVCS sites, for Hookah et al. (2015) on EVCS planning
    and management. Zhang (2018) proposed an EV charging station planning model using
    a distribution network with the aim of minimizing the cost while maximizing service
    capacity and satisfaction. Erbag et al. (2018) used GIS-fuzzy AHP multicriteria
    decision analysis and TOPSIS (technique for order preference by similarity to
    ideal selection) to select optimal EVCS sites in Istanbul, Turkey. Aman et al.
    (2021) integrated fuzzy AHP with TOPSIS to implement feasible EV charging stations
    based on considering environmental, societal, economic, location, and other factors.


    Abapour et al. (2015) maximized the benefits of a distribution system manager
    to determine the optimal site for a plug-in hybrid electric vehicle charging station;
    their technique not only reduced active power losses and CO2 emission but also
    improved supply energy in load condition. Hosseini et al. (2019) proposed a Bayesian
    network (BN) model for site considering various quantitative and qualitative factors.
    Based on sensitivity analysis and propagation analysis, they validated the BN
    model for selecting the optimal EVCS among all alternatives.


    Yao et al. (2014) proposed a multi-objective planning model for integrated power
    distribution as well as EV charging stations; they also faced conflicting objectives:
    reducing the final investment cost, minimizing energy consumption, and maximizing
    the annual traffic flow attained. Yao et al. computed multi-objective evolutionary
    algorithms to validate the proposed model''s feasibility and effectiveness. Based
    on electro-mobility and energy demand, Bouche et al. (2014) proposed an optimized
    model for properly allocating EVCS sites in the city of Lyon. The proposed model
    not only satisfied all the energy demands but also minimized trip energy consumption
    and total location expenditure. By the vehicle consumption demand, Bouche et al.
    tested the model on real trips and conducted sensitivity analysis to validate
    the model.


    Wu et al. (2016) developed a PROMETHEE (preference ranking organization method)-based
    cloud model for choosing optimal sites for EVCSs in Beijing. The proposed cloud-based
    model integrated the uncertainty of information criteria and their mutual influence.
    In this model, PROMETHEE'
