  md: "# Fuzzy Systems for Multicriteria Optimization\n\n+   * **Aggregate Fuzzy Output\
    \ Sets**: Before defuzzification, the individual fuzzy output sets corresponding\
    \ to each activated rule must be aggregated. This aggregation is typically done\
    \ using fuzzy logic operators, such as the maximum operator for OR conditions\
    \ or the sum operator.\n* **Identify the Crisp Output Value**: The aggregated\
    \ fuzzy output set, representing the overall response of the FIS, needs to be\
    \ distilled into a single crisp value. Different defuzzification methods achieve\
    \ this in various ways.\n* **Defuzzification**: There are several common defuzzification\
    \ methods:\n    * **Centroid**: The method calculates the center of mass or gravity\
    \ of the aggregated fuzzy output set. It identifies the \"center\" of the fuzzy\
    \ output set and uses it as the crisp output.\n    * **Mean of Maximum**: The\
    \ mean of the maximum value of the aggregated fuzzy output set and calculates\
    \ the mean of the values at which the membership function reaches its maximum.\
    \ This is then considered the crisp output.\n    * **Bisector Method**: The bisector\
    \ method determines the point at which the area under the aggregated fuzzy output\
    \ set is equally divided. The value at this point is taken as the crisp output.\n\
    \    * **First of Maximum**: The first of maximum method selects the first value\
    \ at which the aggregated fuzzy output set reaches its maximum. This value is\
    \ then considered as the crisp output.\n    * **Weighted Average Method (for Sugeno\
    \ FIS)**: In Sugeno-type FIS, where the output is a function of input values,\
    \ a weighted average of the output values from different rules is calculated based\
    \ on their degrees of activation.\n* **Generate Output**: The selected method\
    \ yields a numeric value that represents the crisp output of the FIS. This output\
    \ is now a concrete result that can be utilized in subsequent processes, such\
    \ as control actions or decision-making.\n\nDefuzzification is a crucial step\
    \ in the FIS process as it provides a clear, actionable output based on the fuzzy\
