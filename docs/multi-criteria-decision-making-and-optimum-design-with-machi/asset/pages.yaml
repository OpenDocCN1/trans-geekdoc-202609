    # 3.5 CONCLUSION


    In the experimental research outlined in this chapter, we successfully demonstrated
    the efficacy of combining SVR with NSGA-II and TOPSIS in the multi-objective optimization
    of finishing milling for Ti-6Al-4V alloy under MCL conditions. The mechanical
    properties of the alloy were integrated into the optimization process, providing
    a basis for accurate prediction and optimization of the technological parameters.
    Confirmation tests validated the reliability and precision of the hybrid method,
    with prediction errors not exceeding 5% for surface roughness Ra and cutting force
    Fc, and a 0.04% material removal rate. These findings not only contribute valuable
    insights for the machining of Ti-6Al-4V alloy but also serve as a reference point
    for advancing research in various machining processes. Combining SVR, NSGA-II,
    and entropy-weighted TOPSIS has the potential to extend beyond cutting machining,
    offering a robust tool for multi-objective optimization in computational research.


