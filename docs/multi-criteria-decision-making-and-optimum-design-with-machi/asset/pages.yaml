    \ time.\n\nMeenakshi et al. [7–11] examined graphs as models to solve problems\
    \ across various disciplines to optimize network structures. Seikh Hosein et al.\
    \ [12] investigate the idea of the maximum product of graphs in a vague environment,\
    \ which is a sort of environment distinguished by imprecise and partial data.\
    \ Parvathi et al. [13–15] examined various domains, orders, and sizes of intuitionistic\
    \ fuzzy graphs that later-research followed up on [3, 16, 17, 18]. Picture fuzzy\
    \ graphs may be used to solve problems in fields decision-making and social networks.\
    \ Vague and intuitionistic fuzzy graphs represent many real-world problems, but\
    \ they cannot represent uncertainty due to conflicting or vague-real information\
    \ for decision-making [20]. For this reason, experts need intuitionistic fuzzy\
    \ graphs that extend beyond ordinary intuitionistic fuzzy graphs by including\
    \ [6, 21]. Aruldoss et al. [22] classified numerous methodologies, including classic\
    \ and fuzzy-based approaches. For this chapter, we examined and characterized\
    \ the maximum products of three intuitionistic fuzzy graphs. Our aim is to find\
    \ the effective spanning tree weighted network for optimizing a supply chain.\
    \ In the next section, we define some of the elements of intuitionistic fuzzy\
    \ graphs.\n\n# 5.2 PRELIMINARIES\n\n# 5.2.1 INTUITIONISTIC FUZZY GRAPHS\n\nAn\
    \ intuitionistic fuzzy graph (IFG), $\\mathbb{G} = (V, E)$ where $V=\\{v_1, v_2...v_n\\\
    }$ is a finite vertex set that\n\n+   (i) $\\mu: V \\rightarrow [0,1]$ and $\\\
    gamma_1: V \\rightarrow [0,1]$ denote membership and nondeterministic membership,\
    \ and $0 \\leq \\mu(v) + \\gamma_1(v) \\leq 1$ for every $v_i \\in \\mathbb{V}$.\n\
    \n+   (ii) $E \\subseteq V \\times V$ where $\\mu_2: V \\times V \\rightarrow\
    \ [0,1]; \\gamma_2: V \\times V \\rightarrow [0,1]$ are such that $\\mu_2(\\{v_i,\
    \ v_j\\}) \\leq \\min{\\mu(v_i), \\mu(v_j)}\\}; \\gamma_2(\\{v_i, v_j\\}) \\geq\
    \ \\max{\\gamma_1(v_i), \\gamma_1(v_j)}\\ and where $0 \\leq \\mu_2(\\{v_i, v_j\\\
    }) + \\gamma_2(\\{v_i, v_j\\}) \\leq 1\\forall(v_i, v_j) \\in \\mathbb{E}$.\n\n\
    # 5.2.2 STRONG ARC\n\nAn arc $(\\mathcal{U}, \\mathcal{V})$ is said to be strong\n\
    \n```\n$$\\mu_2(v_i, v_j) = \\min{\\mu(v_i), \\mu(v_j)}\\}$\text{ and } \\gamma_2(v_i,\
    \ v_j) = \\max{\\gamma_1(v_i), \\gamma_1(v_j)}\\}$\n```\n\n# 5.2.3 IFG DEGREES\n\
    \nIn an IFG, $\\mathbb{G} = (V, E)$ the degree of vertex $\\mathcal{U}$ is defined\
    \ as the sum of the weights of the strong arcs incident at $\\mathcal{U}$. The\
    \ neighbourhood of $\\mathcal{U}_i$ is denoted by $N(\\\\mathcal{U}_i)=\\{\\mathcal{V}_j\
    \ \\in V/(\\mathcal{U}_i, \\mathcal{V}_j)\\}$ representing a strong arc. The minimum\
    \ $\\mathbb{G}$ is $\\delta(\\mathbb{G})=\\max\\{d_c(\\mathcal{U}_i)/\\mathcal{U}_i\
    \ \\in V\\\\}$ and the maximum $\\mathbb{G}$ is $\\Delta(\\mathbb{G})=\\max\\\
    {d_c(\\mathcal{U}_i)/\\mathcal{U}_i \\in V\\\\}$."
