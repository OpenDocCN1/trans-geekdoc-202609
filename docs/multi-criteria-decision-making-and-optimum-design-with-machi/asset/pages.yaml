    f_z \le 0.10 \ 0.1 \le a_p \le 0.9 \end{cases}

    ```


    where P (bar) is the MQL air pressure, Q (ml/h) is the MQL oil flow rate, $V_c$
    (m/min) is the cutting speed, $f_z$ (mm/tooth) is the feed per tooth, and $a_p$
    (mm) is the depth of the cut.


    # 3.4.2 INTEGRATING SVR AND NSGA-II WITH ENTROPY-WEIGHTED TOPSIS


    As we have noted, for this study we employed a hybrid approach of combining SVR
    and NSGA-II with entropy-weighted TOPSIS to determine the ideal technological
    parameters for milling Ti-6Al-4V alloy with minimal lubrication. We utilized SVR
    to establish a regression model linking $R_a$ (Figure 3.12); (Figure 3.13); and
    cutting parameters $P, Q, V_c, f_z$, and $a_p$. This model formed the foundation
    for multi-objective optimization via NSGA-II.


    The outcomes of multi-objective optimization obtained through NSGA-II in a Pareto
    set, which this Pareto represents a collection of feasible optimal values. We
    evaluated set using entropy-weighted TOPSIS to ascertain the optimal values. Table
    3.3 summarizes the results of the optimization process using the combined SVR-NSGA-II-TOPSIS
    algorithm. We then used the predicted technological parameters to verify the reliability
    of the optimization methodology.


