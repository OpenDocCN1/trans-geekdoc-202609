    and variances of a designed process [15]. This approach conventionally employs
    an orthogonal array to methodically explore the repercussions of distinct trials.
    The Taguchi method is esteemed in engineering circles for its capacity to robustly
    evaluate the significance of all pertinent parameters that impact the output of
    a given process.


    The Taguchi method entails measuring each parameter''s impact using the signal-to-noise
    (S/N) ratio, the mean of iterated experiments divided by their corresponding variance.
    In the context of this investigation, the attribute under consideration was tensile
    strength, and we maximized it by following Equation (4.1) [16]:


    ```

    $$\frac{S}{N} = -10\log_{10} n \sum_{i=1}^{n} \frac{1}{y_i^2}}$ (4.1)

    ```


    where y signifies the observed measurement and n signifies the total number of
    experimental trials conducted. Calculating the S/N ratio for calculating the individual
    influence of each parameter following Equation (4.2) [17]:


    ```

    $C_i = \frac{R}{\sum RI} \times 100\%$ (4.2)

    ```


    Here, R designates the ratio, that is the difference between the minimum S/N ratio
    and the maximum S/N ratio corresponding to each parameter level. Calculating this
    range enables identifying specific parameters that yield the highest S/N ratio.
    Consequently, this identification facilitates the prediction of optimal parameters
    that lead to the minimal deviation from the desired property in the final output.


    #  4.3.4 TENSI MEASUREMENT


    #  4.3.4.1 The Measurement Method


    We measured tensile strength using ASTM D638 and Shimadzu Autograph AG-X Plus
    20kN testing machine. The testing velocity was 5 mm/min. The pertinent specifications
    of this universal testing apparatus were a load capacity of 20 kN, a crosshead
    speed range spanning from 0.0005 to 1000 mm/min, a maximum return speed of 1200
    mm/min, crosshead speed precision at ±0.1%, and a crosshead-table clearance 850
    mm [18].'
