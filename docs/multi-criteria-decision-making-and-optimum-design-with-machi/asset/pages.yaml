  md: '# 142 Multi-Criteria Decision-Making with Machine Learning


    # 10.2.1 AHP


    Thomas Saaty (1980) created the decision-making framework known as the analytical-hierarchical
    process in the 1970s; it is a methodical strategy for handling difficult choices
    including numerous criteria and options. With AHP, a choice is divided into a
    hierarchy of factors (criteria) (Vaidya et al., 2006; Cabala, 2010) and subfactors
    before each level is given a weight based on its relative importance. This process
    is usually done through pairwise comparisons, where each level is compared against
    the other in terms of their importance. The beauty of AHP is a provision for consistency
    checking to minimize inconsistencies in beliefs. Once the weights have been determined,
    the decision maker can evaluate each alternative against criterion and compute
    a total score for every option. Next, the alternative with the best score is picked
    as the preferred choice. AHP is broadly used in different fields, including business,
    engineering, and government. It is particularly useful for decision-making scenarios
    that involve trade-offs between multiple criteria.


    Some mathematical steps are required for AHP final weight calculations. The steps
    are as:


    +   First an (m X M) pairwise comparison matrix is formed.

    Let B be the comparison matrix of size (m X m) and is represented by Equation
    (10.1):


    B = \begin{bmatrix} b11 & b12 & \dots & blm \ : & \vdots & & \vdots \ bm1 & bm2
    & \dots & bmm \end{bmatrix} (10.1)


    Any random matrix item may be described by Bij, where i,j=1,2,. . . . ,m.

    Bij = 1 when i=j andnBij = 1/Bij when i ≠ j.

    M = Number of comparison factors/attributes.


    The diagonal elements of matrix B always equals 1 because a criterion is always
    important to itself. When the ith factor has a y-fold importance than the jth
    factor, Bij = y and Bji = 1/y, usually calculated on a 1–9 scale (Table 10.1),
    where 1 means that the two sub-problems are equally important and 9 means that
    one is more important than the other.


    In the second step, the normalized weight matrix is formed. To calculate the normalized
    weight matrix, every element of the jth column is multiplied by the inverse of
    the grand total of all elements of the jth column. After normalization, the sum
    of every column element must be one. Normalize pairwise comparison matrix is calculated
    as Equation (10.2):


    Bw = \begin{bmatrix} \Sigma b11 & \Sigma blm \ \Sigma bil & \Sigma bim \ : & \vdots
    \ bm & bmm \ \Sigma bil & \Sigma bim \end{bmatrix} (10.2)'
