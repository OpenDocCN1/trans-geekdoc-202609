    The figure shows that impact toughness increased from 22.23 kJ/m² at 0% GF to
    26.45 kJ/m². This could have been because of the overlapping bonds of the GFs
    as the GF content increased; we can clearly observe in Figure 7.6 g that the GFs
    overlap each other. According to Fung et al. (2006), who studied the influence
    of GF on the mechanical properties of polymer composites, GF in higher quantities
    acts as a reinforcing agent for composite materials.


    # 7.5 CONCLUSION


    We studied the unnotched impact toughness of GF-reinforced PBT/PA6 composites
    with seven GF ratios: 0%, 3%, 6%, 9%, 12%, 15%, and 18%. GF demonstrably increased
    the toughness in all cases, although the difference between the highest toughness
    for sample PBT/PA6/18%GF and the lowest, for PBT/PA6/0%GF, was only 15.95%. This
    result opens a new research direction for improving the toughness and other mechanical
    properties of PBT/PA6 composite by reinforcing with 18% GF. Factories and plastic
    manufacturers can increase the toughness of recycled PBT/PA6 blends by reinforcing
    them with GF, which can help with addressing environmental pollution.


    # 7.6 QUESTIONS


    +   1. Why choose GF to increase the mechanical properties of the PBT/PA6 mixture
    and not other polymer components?

    2. Why do we choose the regression equation as a quadratic equation of a parabolic
    curve and not a first-order equation?

    3. Through structural observation, why do the PA6 dots gradually and become smoother
