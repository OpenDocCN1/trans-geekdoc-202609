    in waste and increased production costs. Additionally, improper application can
    reduce the precision of the finished product. Due to these drawbacks, traditional
    flood cooling methods are gradually being replaced by alternative lubrication
    and cooling techniques (Stephenson and Agapiou, 2018).


    Dry machining, an alternative solution, eliminates all cutting fluids, but its
    application is limited by poor surface quality, rapid tool wear, and high airborne
    particle concentration. To overcome these challenges, minimum quantity lubrication
    (MQL) has been researched and widely implemented, especially in Germany and Japan
    from 1996 to 2000, and is becoming increasingly popular in developing countries
    including India, China, and Vietnam. MQL uses a minimal amount of lubricant, between
    5 and 50 ml/h, compared with up to 50,000ml/h in traditional flood lubrication.
    Often utilizing biodegradable vegetable oils, MQL reduces environmental and occupational
    health risks, as well as maintenance and processing costs, while ensuring the
    required quality.


