  md: '# Multi-Criteria Decision-Making with Machine Learning


    Titanium demonstrates superior properties such as high heat and hardness resistance,
    corrosion resistance, and fracture toughness over alternative materials. It has
    the highest strength-to-weight ratio among structural materials along with excellent
    machinability and biocompatibility. However, these characteristics also make titanium
    alloys difficult and challenging (Pramanik, 2014). The main difficulties when
    machining titanium alloys come from their high chemical reactivity at elevated
    temperatures and heat concentration at the machining area due to low thermal conductivity
    (Gupta et al., 2021; Saini et al., 2016).


    Titanium alloys have low thermal conductivity at only 15% of steel. Consequently,
    about 80% of heat produced during titanium alloy machining concentrates on the
    cutting tool, a far larger proportion than the roughly 50% of heat absorbed by
    tools when machining steel. This causes the phenomenon of high temperatures concentrating
    in the area between the cutting tool and workpiece, causing rapid tool wear (Ezwugu,
    2005). In addition, titanium, with its superior elasticity to that of other metals
    (Pramanik, 2014), tends to rebound more due to its low elastic modulus. This rebounding
    tendency can cause the workpiece to disengage from the cutting tool, leading to
    friction rather than cutting, adversely affecting surface finish and dimensional
    accuracy. This characteristic of titanium can be analyzed by its vibrational behavior
    during machining


    In machining, the majority of expended energy deforms and frictionally shears
    the workpiece to form chips, largely converting this energy into heat; this significantly
    elevates cutting zone temperatures. With a thermal conductivity of 6.7 W/mK, compared
    with 45 W/mK in carbon steel, titanium alloys dissipate much less heat during
    machining. (Materials and Company.). Indeed, up to 50% of the heat can be transferred
    to the cutting tool depending on the material of the tool (Gao et al., 2016).
    In the case of machining titanium alloys, the heat transfer can reach nearly 80%,
    significantly increasing the temperature of the cutting tool.


    The increased heat transfer to tool is a primary reason that titanium alloys result
    in lower tool life than other challenging alloys. To reduce cutting heat in titanium
    alloy machines and general metal cutting, cooling fluids are commonly used in
    both industrial production and experimental studies. These fluids use water, oil,
    or other solvents that work to rapidly dissipate heat and lower friction at the
    tool-workpiece interface (Serope Kalpakjian, 2009). This only cools the cutting
    area but also cleans the machined surface, reducing power and consumption and
    enhancing surface quality, thereby significantly extending tool life. However,
    using flood cooling has drawbacks, including high maintenance and post-processing
    costs, accounting for 8%–16% of total machining


    Studies have highlighted environmental and health risks associated with metal
    cutting oils. The permissible exposure limits set by OSHA (Ghuge and Pande, 2022)
    and NIOSH for metalworking fluid mist are 5 mg/m³ and 0.5 mg/m³, respectively.'
