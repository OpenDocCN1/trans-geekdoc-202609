  md: '# Multi-Criteria Decision-Making with Machine Learning


    # 2.4.1 THE CONCEPT OF MCDM


    MCDM was developed to handle circumstances in which there are multiple, frequently
    opposing, criteria or elements to consider. Traditionally, choices are usually
    made without explicitly taking into account the interdependencies between a group
    of criteria. On the other hand, MCDM offers a structured methodology for assessing
    and ranking options based on a variety of criteria, acknowledging the complexity
    of decision problems. The following are important aspects related to MCDM:


    +   Multiple Criteria: MCDM addresses decision-making situations in which decision-makers
    must take into account multiple factors. These standards can take multiple forms,
    encompassing quantitative and qualitative elements, expenses, advantages, and
    additional pertinent characteristics.


    +   Decision Alternatives: MCDM entails assessing and contrasting a range of possibilities
    or decision alternatives. These options stand for various plans of action, approaches,
    initiatives, or for a certain issue.


    +   Criteria Weights: Not all MCDM have the same weight. Weights are assigned
    by decision-makers to factors to indicate their relative importance. The significance
    of every criterion in the decision-making process is measured by these weights.


    +   Pairwise Comparisons: Decision-makers frequently have to state what they believe
    to be more important than others in the decision-making process. When comparing
    two sets of criteria by side, pairwise comparisons are used to determine which
    is preferred or of more value.


    +   Ranking and Scoring: MCDM offers a system for ranking or scoring for the alternatives
    based on the allocated weights and criteria evaluations. The aim is to find the
    most preferred or ideal option according to the decision-maker''s objectives.


    +   Decision Matrix: An essential MCDM tool, a decision matrix arranges and displays
    data on criteria assessments, weights, and alternative ranks. It presents the
    choice problem in an organized manner.


    +   Decision Support Systems: To facilitate the evaluation and analysis of alternatives
    according to a range of criteria, MCDM employs decision support systems, including
    computational models and software tools. These tools support decision-makers in
    navigating difficult decisions.


    +   Sensitivity Analysis: By using MCDM, one can assess how changes to the values
    or weights of criteria affect the final rankings. This aids in decision-makers''
    comprehension of how resilient their choices are in various situations.


    +   Subjectivity and Stakeholder Involvement: MCDM promotes stakeholder involvement
    while acknowledging the subjectivity that is a part of decision-making. The preferences,
    values, and viewpoints of stakeholders are vital in determining the criteria,
    weights, and general decision-making process.


    MCDM is used in many different domains, including engineering, project management,
    business, finance, and environmental management. It gives decision-makers'
