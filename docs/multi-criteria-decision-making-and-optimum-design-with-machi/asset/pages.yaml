    have used MCDM algorithms to measure learners'' productivity (Nguyen Anh Tuan
    et al., 2020) and student performance (Pavani Sirigiri et al., 2015), and Ayesha
    Meshal Alshami et al. (2023) presented findings on use of MCDM to find the best
    university for distance learning. On the student side, researchers have investigated
    students'' use (Ertugurl Ayyldiz et al., 2023) and use of rough set to choose
    between two universities (Som Debnath, 2023).


    Teaching is a selfless and noble profession. In nearly every field, people think
    of their individual development, but teachers aim to develop their students than
    themselves; their real happiness lies in elevating their students. Teachers mold
    themselves and encourage them to be the best they can be and prove themselves
    in society. However, teachers recognize themselves benefit from acknowledgement
    of their efforts, and one way to recognize high performers is with awards. Awards
    are common forms of recognition across almost all professions and can stimulate
    professional development in pursuit of further recognition.


    In the context of this study, assessing higher education instructor performance
    in recognition for an award will be guided by many separate criteria including
    results, publications, projects, and funding. For this study, the organization
    that will grant the award will encounter applicants with many different profiles
    who will need to be scored according to the multiple criteria. Additionally, this
    is a highly appropriate scenario for examining techniques of multicriteria decision-making
    (MCDM) in the process of selecting finalists. For this chapter, we adopt the MCDM
    procedure called outranking to select the best instructor.


    # 23.2 STANDARD ATTRIBUTES


    # 23.2.1 CRITERIA


    Attributes refer to the objective responsible for the decision; they are fixed
    based on the requirements for the solution. Attributes that are required for the
    decision are termed beneficial, and that require little consideration are called
    nonbeneficial.


    # 23.2.2 CRITERIA


    Criteria are the various rules and values that determine the conditions of the
    decision problem.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'Selecting a Best Professor Award Using MCDM


    # 23.2.3 DECISION MATRIX


    A decision matrix is a matrix of dimensions $m \times n$ in which the values are
    fixed based on the relationship between the attributes and the criteria. Here
    $m$ represents the number of attributes, and $n$ is the number of criteria.


    # 23.2.4 NORMALIZED DECISION MATRIX


    A normalized decision matrix is derived by dividing the elements by their Euclidian
    norm, the square root of the sum of the squares of the elements.


    # 23.2.5 VARIANCE


    Variance is a measure of the amount of spread in data. It is obtained by dividing
    the sum of squares of deviation from the mean by the number of data.


    # 23.2.6 WEIGHTED NORMALIZED MATRIX


    Weight is a measure of the preference for given attributes or criteria, and the
    matrix obtained from the product of the normalized decision matrix and the weighted
    normalized matrix.


    # 23.2.7 CONCORDANCE MATRIX


    In a concordance matrix, the diagonal elements are left free. Each of the remaining
    elements $a_{ij}$ is obtained by adding the weights for the corresponding column
    $a_j > a_i$. The row elements consisting of $a_i$ and $a_j$ are considered for
    the calculation. When there is equality between $a_i$ and $a_j$, half the weightage
    is considered.


    # 23.2.8 DISCORDANCE MATRIX


    The diagonal elements in a disconcordance matrix $d_{ij}$ are also left free.
    The remaining elements are calculated using Equation (23.1):


    ```

    $d_{ij} = \begin{cases} 0 & \text{if } g_k(a_i) \geq g_k(a_j) \text{for all }
    k \ \max[g_k(a_j) - g_k(a_i)] & \text{if } g_k(a_i) < g_k(a_j) \text{for all }
    k \end{cases} \quad (23.1)$

    ```


    # 23.2.9 PURE CONCORDANCE INDEX


    The pure concordance index is calculated using Equation (23.2):


    ```

    $C_j = \sum_{k=1}^{n} c(j,k) - \sum_{j=1}^{n} c(k,j) \quad \text{where } j \neq
    k \quad (23.2)$

    ```'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 23.2.10 PURE DISCONCORDANCE INDEX


    The pure discordance index is calculated using Equation (23.3):


    ```

    $$D_j = \sum_{k=1}^{n} d(j,k) - \sum_{j=1}^{n} d(k,j) \text{ where } j \neq k$\$
    (23.3)$

    ```


    # 23.2.11 RANKING TABLE


    Ranking involves sorting elements according to preference in ascending or descending
    order, and in the final outranking step, a table is produced.


    # 23.3 METHODOLOGY


    The education field involves teachers with many aspects of development. For this
    study, the first and foremost eligibility for a teacher is their educational qualification:
    the three qualification criterion for best university instructor were M.Phil.,
    Ph.D., or Postdoctoral Fellow (PDF). The next attribute were years of experience,
    which the organization ranked as less than 10, 10–15, 15–20, or >20. The organization
    tallied each applicant''s number of publications in reputed journals, categorized
    as fewer than 20, 10–20, or more than 20 and number of scholars they supervised
    or produced, scored as 0, fewer than 5, 5–10, or more than 10. The final scores
    were based on the importance of each criteria.


    # 23.4 MCDM RESULTS AND DISCUSSION


    For this scenario, a university department of mathematics was recognizing its
    best-performing professor with an award. The decision-making committee considered
    four attributes and four criteria for four applicants D1, D2, D3, and D4.


    As we noted earlier, the teachers are the building pillars of students, they continue
    developing throughout their careers to keep their skills sharp. For this study,
    the math department considered attributes of professor development in considering
    a best math: A1, applicant''s educational qualification; A2, applicant''s years
    of experience; A3, applicant''s number of articles published; and A4, applicant''s
    number of PhD graduates supervised.


    The award committee also considered four criteria for selecting a best professor:
    C1, applicant''s education qualification; C2, applicant''s years of experience;
    C3, applicant''s number of articles published; and C4, applicant''s number of
