    # ### 19.4.1 DATA REQUIREMENTS


    Common supervised learning algorithms include logistic regression, which uses
    the logistic function to model a binary variable, and naïve Bayes classifier;
    naïve Bayes is rooted in Bayes’ theorem, which provides full freedom to agents.
    A common unsupervised learning technique is hierarchical clustering, which creates
    a hierarchical structure of clusters with the help of any kind of tree. Another
    is k-Means clustering, which divides data into k different clusters concerning
    the centroid.


    # ### 19.4.2 DATA PREPARATION


    Preparing the data identified errors in the collected data sets, removing missing,
    invalid, and duplicate values and ensuring that it is properly formatted for modeling.


    # ### 19.4.3 MODEL DEVELOPMENT


    We used two distinct data sets for experimentation: one for binary classification
    (city vs. sell) and another for multiclass classification of cell types. We first
    developed a custom three-layer convolutional neural network that demonstrated
    impressive accuracy in binary classification. Then, we pretrained models DenseNet,
    ResNet, VGG16, and VGG19 for the more intricate task of tumor type classification.
    Then, we implemented an algorithm.'
