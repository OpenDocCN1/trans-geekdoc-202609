    business intelligence and AI provides leaders with a deeper awareness of their
    operations, clients, rivals, and the marketplace as well (Sarker, 2021b). In the
    recent past, such tasks were very lengthy and required considerable time to think
    about and reach profitable choices. Now, with the latest technological developments,
    organizations can save expenses by using AI-powered solutions for data analysis
    (Javadid et al., 2022).


    AI allows businesses to streamline multiple data processing processes, hence minimizing
    the need for manual labor. Automating some processes decreases increases, accuracy
    and saves human assets to concentrate on more important projects. Furthermore,
    leaders can use AI systems to find and eliminate ineffective practices with lowering
    costs (National Artificial Intelligence . . . 2016).


    Another advantage of AI is better prediction and forecasting capabilities for
    achieving stability. AI planning and forecasting is a discipline that allows for
    the unsupervised production of forecasts based on science (Nishant et al., 2020).
    For many industries, including sales, health care, financial services, and manufacturing,
