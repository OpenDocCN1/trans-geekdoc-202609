    and normalization, ensuring that data is ready for analysis. This streamlines
    the decision-making process and reduces the risk of biased or incomplete information
    affecting the results. ML models are adept at identifying patterns and relationships
    within data that may not be immediately apparent (Mba Kouhou et al., 2023). In
