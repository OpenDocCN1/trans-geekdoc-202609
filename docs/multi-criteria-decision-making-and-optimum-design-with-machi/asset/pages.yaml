  md: '# Cruising through the Battelle Association of Geneva Research Center 283


    Affairs Program of the Battelle Research Center developed DEMATEL between 1973
    and 1976 to analyze and solve complex problems (Fontela & Gabus, 1974, 1976).


    By creating structural models, DEMATEL helps groups make decisions and solve significant
    changes (Wu & Lee, 2007; Tseng, 2009). Since each criterion in a decision might
    affect any other, the DEMATEL technique is used to structure MCD problems via
    pairwise comparison. DEMATEL was developed using matrices and math theory and
    divides components into cause-and-effect groups. The technique was designed with
    the assumption that scientific research methods might help with understanding
    a specific problem, a cluster of interconnected difficulties, and a hierarchical
    structure of practical solutions (Jeng & Tzeng, 2012). Significant issues are
    conceptually difficult to solve; DEMATEL breaks down large problems into smaller
    ones and analyzes their relationships using collective data.


    In the context of this study, the interaction between tourist destination decision
    and social media users is complex, and improvements should be developed towards
    the most important aspects. DEMATEL matrices or graphs show the textual relationships
    between system elements, with numerals representing influence or network strength
    (Chen-Yi et al., 2007). For this study, I DEMATEL to investigate direct and indirect
    causal links between criteria following the steps I discuss next.


    # 21.3.2.1 Step 1: Calculate the Average Matrix


    For the study, I asked a set of experts to estimate the individual impacts of
    each of our criteria on the others with respect to making choices, where the criteria
    were tourist characteristics, destination characteristics, external search, planning
    characteristics, and choice set. On scales ranging from 0 to 4, where 0 = no influence
    and 4 = strong influence, I asked each respondent to indicate the degree to which
    they believed a factor j, noted as xij, when i=j, zij=0. The experts'' scores
    gave us an x x n non-negative answer matrix, with 1 ≤ k ≤ Z; x, x2, x3, . . .
    xn were the answer matrices for each of the Z experts, and each element x was
    an integer. The arithmetic method incorporated all experts opinions; the initial
    average matrix X in Equation (21.1) shows that n variables the decision-making
    model:


    ```

    X = \begin{bmatrix} O & \cdots & X_{ij} & \cdots & X_{in} \ \vdots & & \vdots
    & & \vdots \ X_{n1} & \cdots & X_{ni} & 0 \end{bmatrix} (21.1)

    ```


    # 21.3.2.2 Step 2: Establish the Structure Model and Calculate the Direct-Influence
    Matrix


    We obtained the next matrix, N, by normalizing the average matrix X. We separately
    calculated the sums of the rows and the columns and obtained the maximums using
    Equation (21.2). Then I divided X by N to get the normalized initial direct-relation
    matrix A in Equation (21.3). Each value in matrix A is between 0 and 1:'
