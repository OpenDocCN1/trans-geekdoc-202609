  md: '# Cruising through the Choices


    The Decision-Making Trial and Evaluation Laboratory (DEMATEL) method (Fontela
    & Gabus, 1974) uses structural modeling to solve complicated problems with consumers''
    destination choices by revealing cause-and-effect relationships or criteria for
    measuring a problem In this study, I applied multicriteria decision-making (MCDM)-free
    model to examine decision-making processes related to tourist destinations, with
    a specific emphasis on the role of information searching through social network
    sites (SNSs). I began with the proposal that motivation, information searching,
    and the decision-making process are conceptual variables influencing tourist destination
    choice, and I give an interdisciplinary perspective on a tourist''s destination
    decision-making as a social network user. Expanding on the research backdrop,
    I test the destination decision-making tree using DEMATEL MCDM methodology. We
    empirically tested the research model using interviews and surveys.


    Three goals does this study:


    +   1. Investigate why tourists choose a destination on social media and what
    elements significantly influence their decision-making. We examined tourists''
    searches and motivation-based decision-making.

    2. Examine how social media affects travel motivation and perceived limits for
    tourists using social media as a tool for destination selection. We examined the
    information tourists used on social media.

    3. Use the MCDM model to weigh criteria and suggest ways for industry stakeholders
    to improve tourist decision-making.


    The following reasons make this work empirically significant. First, most studies
    on social media and social marketing strategies use SNS, and needs to be examined
    as a category of research instrument. With this study, I aimed to assist tourism
    businesses in understanding the role of tourist-social network users in destination
    decision-making, marketing strategy development, and location promotion.


    Second, investigated whether internal or external factors affect tourist decision-making.
    This study could help with recent motivational theory attempts to understand SNSs
    as external or push factors of information-seeking demand. SNS and tourism have
    been studied extensively, but tourist–SNS user relationships have not. This study
    could help national tourism organizations and the tourism sector more broadly
    construct a more compelling online social network to attract more tourists.


