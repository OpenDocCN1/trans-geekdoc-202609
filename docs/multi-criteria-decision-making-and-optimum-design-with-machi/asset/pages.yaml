    ![](img/62c36bee0e5ae6b397770e7de372b0e7_85_0.png)


    **FIGURE 3.6** Nonlinear regression with the range of epsilon.


    where $g(x_{ji}) = 1, 2, \dots, m$ is the set that comprises the nonlinear mapping
    functions.

    The accuracy of the estimate is evaluated by loss function $L(y,f(x))$. SVR uses
    a loss function called epsilon (Equation (3,2)), an insensitive loss function
    proposed by Vapnik (Cortes and Vapnik, 1995; Vapnik, 2000, 1998):


    ```

    $L=\begin{cases}0 & \text{if} |y-f(x,w)| \le \epsilon \ |y-f(x,w)| & \text{otherwise}
    \end{cases} \quad (3.2)$

    ```


    That is, SVM performs linear regression in multidimensional feature space using
    function $L$ and minimizing $||W||^2$ to decrease the complexity of the model.
    This problem can be solved by introducing slack variables $\zeta_i$ and $\zeta_i^*$
    with $i=1, 2, \dots, n$ to measure the deviation of the training samples which
    lies outside of the epsilon range. Therefore, SVR is minimized by the function
    Equation (3.3) with the constraints of Equation (3,4):


    ```

    $min\frac{1}{2}||w||^2+C\cdot \sum_{i=1}^{n}(\zeta_i+\zeta_i^*) \quad (3.3)$

    ```


    ```

    $$\begin{cases}y_i-f(x,w) \le \epsilon+\zeta_i^* \f(x,w)-y_i \le \epsilon+\zeta_i
    \\zeta_i,\zeta_i^* \gt 0\forall i=1,\dots,n \end{cases} \quad (3.4)$

    ```


    Applying the duality theorem for minimizing problems, we finally obtain the function
    $f(x)$ (Equation (3,5)):


    ```

    $f(x)=\sum_{i=1}^{n}(\alpha_i-\alpha_i^*)\cdot K(x_i,x)+b \quad (3.5)$

    ```'
