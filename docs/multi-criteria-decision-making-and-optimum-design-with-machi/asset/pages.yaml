  md: '# 302 Multi-Criteria Decision-Making with Machine Learning


    # 22.2.7 RANKING


    Rank the alternatives based on their TOPSIS scores. Higher scores indicate better
    performance.


    # 22.3 THE OUTRANKING ALGORITHM


    The outranking algorithm involves a number of steps: building a decision matrix
    and a normalized decision matrix; calculating weights; building a weighted normalized
    matrix; calculating the positive and negative ideal solutions; and building the
    ranking table.


    # 22.4 THE TOPSIS ALGORITHM


    TOPSIS involves scaling quantitative criteria using their respective real numbers.
    To account for the imprecision of spatial data and human cognition over the criteria,
    the algorithm employs linguistic variables; a linguistic variable is characterized
    by values expressed in words or sentences in either a natural or artificial language.
    This approach is particularly valuable when traditional quantification methods
    struggle to articulate complex or challenging criteria to describe. Linguistic
    variables are essential and beneficial for rating qualitative criteria and comparing
    evaluation criteria. The range of alternative ratings for a qualitative criterion
    in the classical TOPSIS method involves assessing and assigning to different alternatives
    based on their performance against the given criterion. In Table 22.1, Group 1,
    Group 2, Group 3, and Group 4 represent the first-, second-, third-, and fourth-year
    students, respectively.


    Table 22.2 gives the decision matrix for the criteria. Learning outcomes referred
    to how well students understood the learned outcomes. Assessment methods referred
    to whether fairness and equity were maintained when providing feedback. focus
    with teaching methods was on engagement strategies and clarity of instruction,
    and with the curriculum design was on flexibility to customize and relevance to
    industry needs. With student engagement, we assessed interest, motivation, and
    active participation. The values obtained from the student’s feedback are reported
    in the matrix as averages.


