- pgno: 323
  md: '# Cruising through the Choices


    293


    Since it has been argued that the Internet-based tourism will be focused on consumer-centric
    technologies that will support tourism organizations in interacting with the tourist
    (Buhalis, 2000), this study provides valuable insight into the tourism marketing
    strategies that need to pursue to achieve the goal. The findings indicate a great
    need for a tourist destination decision-making process that prioritizes extensive
    search to ensure that social network websites are at the top of the ranking list.
    Therefore, tourism marketers need to understand the key factors to effectively
    reach and promote their businesses and destinations through social networks and
    websites.


    This study suggests future research in various directions. First, I conducted
    this study in Vietnam, so future researchers could apply the framework in this
    study to examine tourists in other national contexts. Second, whether within Vietnam
    or in other countries, researchers could collect responses from domestic tourists
    and measure the differences between foreign and domestic tourists. Third, I studied
    tourists'' decision-making processes before the trip; future researchers could
    examine tourists during trips and reinforce intentions. Lastly, future researchers
    could investigate the most influential within tourism information search characteristics.
    Tourism operators, agents, managers, and other stakeholders can use these combined
    findings to better target their marketing efforts on their desired destinations.


