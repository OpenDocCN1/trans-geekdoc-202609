  md: '# 60 Multi-Criteria Decision-Making with Machine Learning


    # 3.3.3 TOPSIS


    MCDM is utilized for decision-making based on multiple criteria, commonly used
    in multi-objective optimization scenarios. The core of MCDM lies in harmonizing
    diverse criteria when each criterion bears significance, influencing the ultimate
    decision. This approach is centered around assessing and contrasting alternatives
    across several criteria to facilitate decision-making. Among the array of MCDM
    techniques, TOPSIS stands out as one of the most prevalent and extensively used
    methods.


    TOPSIS, developed by Hwang and Yoon in 1981, is used in a multicriteria system.
    It assesses the performance level of options based on their distance from the
    optimal ideal value and the least ideal value. TOPSIS has the advantage of being
    straightforward to understand and implement, with practical application. However,
    it is sensitive to extreme values and does not handle conflicting criteria well.
    One of the main drawbacks of TOPSIS is the determination of weights among criteria.
    To mitigate this, entropy weighting is often used in conjunction. Entropy-weighted
    TOPSIS is implemented through several steps (Zhu et al., 2020):


    +   Step 1: Calculate the determinant of a matrix, with the elements determined
    according to Equation (3.8).


    ```

    $X = \begin{bmatrix} X_{11} & \dots & X_{ij} & X_{in} \ X_{21} & \dots & X_{2j}
    & X_{2n} \ \vdots & & \vdots & \vdots \ X_{i1} & \dots & X_{ij} & X_{in} \ X_{m1}
    & \dots & X_{mj} & X_{mn} \end{bmatrix} \(3.8)$

    ```


    where $x_{ij}$ is the value of criterion $j$ in alternative $i$, $n$ is the number
    of criteria, and $m$ is the number of alternatives.


    +   Step 2: Calculate the normalized matrix $R = (p_{ij})_{mn}$, where $p_{ij}$
    is determined by Equation (3.9):


    ```

    $p_{ij} = \frac{x_{ij}}{\sqrt{\sum_{i=1}^n x_{ij}^2}}, j \in [1,n] \(3.9)$

    ```


    +   Step 3: Entropy $e_i$ of the $i^{th}$ criterion is defined as Equation (3.10):


    ```

    $e_i = -\frac{1}{\ln(m)} \sum_{i=1}^m p_{ij} \ln(p_{ij}), i=1...m; j=1...n$ \(3.10)$

    ```


    where entropy $e_i$ ranges between [0, 1]. A higher $e_i$ indicates greater differentiation
    for the $i^{th}$ criterion, meaning that more information can be gleaned from
    that criterion.'
