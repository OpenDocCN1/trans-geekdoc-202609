  md: '# # 19 Artificial Intelligence Algorithms for Better Decision-Making


    Ganesh Khekare, Ganesh Yenurkar, Anil V Turukmane, Gaurav Kumar Ameta, Pooja Sharma,
    and Ajay Kumar Phulhire


    # ## 19.1 INTRODUCTION


    Researchers analyzing digital data use supervised and unsupervised learning experiments
    with different digital data. For instance, Ana et al. (2024) analyzed sales data
    to customer engagement based on the order volume in different cities and compared
    the results between supervised and unsupervised learning algorithms. Another research
    group trained a model to test strengths and weaknesses to identify areas of improvement.
    Specifically, the authors trained a model on a data set of customer age, gender,
    and purchasing needs using multiple supervised and unsupervised learning algorithms
    (Boutaba et al., 2018).


    The results from this chapter will be useful for determining the best-suited algorithms
    for machine learning (ML; Dipo et al., 2024) based on multiple parameters such
    as deviation from real value, mean scale prediction, the accuracy of the model,
    and computation performance of algorithms. The rest of this chapter follows: Section
    19.2 is the literature survey, and in Section 19.3, we describe our methodology.
    In Section 19.4, we describe the project implementation, in Section 19.5, we give
    the results with a discussion, and in Section 19.6, we give our conclusions; we
    also discuss future scopes.


    # ## 19.2 LITERATURE REVIEW


    The importance of ML is that it has different types of models for describing and
    factoring in the results (Khekare et al., 2023). Thus, it provides results with
    a clear scope and is based on the functions provided (Gustavo et al., 2022). ML
    models have many applications in various fields (Ilya et al., 2024), efficiently
    trained according to how they’re needed (Trillo et al., 2023). Embedded models
    use classifiers and other methods to provide results based on multiple factors
    such as accuracy and efficiency (Zhan et al., 2022).'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Artificial Intelligence Algorithms for Better Decision-Making


    # 19.2.1 SOFTWARE RELIABILITY


    System reliability is the probability that the system and servers will not fail
    over time and will continue to run without issues (Khekare et al., 2022). Failure
    occurs within a predefined time frame and under explicit conditions. Information
    on programming dependability is essentially crucial in basic frameworks it shows
    plan flawness (Kim et al., 2022). In this, the objective is to improve the dependability
    of the product as well as the system that is being used to host the ML model (Nagome
    et al., 2020). The model gives specific details and is required to provide results,
    and if it provides wrong information, it is refined (Khekare et al., 2022).


    # 19.2.2 SUPERVISED LEARNING


    Supervised learning is a well-known type of AI plot utilized in planning many
    input factors with many output factors to reduce capacity from the information
    (Jahan et al., 2023). The preparation data set contains the necessary occasion
    values for features (Perdikis et al., 2021). The model''s prediction accuracy
    is tested and refined. The aim of the inferred function could also be to unravel
    a regression or classification problem (Khekare et al., 2023). There are a few
    measurements utilized in the estimation of the learning task like exactly, affectability,
    particularity, kappa, and the region under the curve (Shashank et al., 2023).
    In this work, the point is to give reports and examine the available business
    information (Tessa et al., 2024). The aim of the inferred function could also
    be unravel a regression or classification problem (Vaccaro et al., 2021).


    # 19.2.3 UNSERVISED LEARNING


    Unsupervised learning is the model that helps in training machines (Ozdenizci
    et al., 2020) using data that are neither classified nor attributed and facilitates
    the system to work using the model (Khekare et al., 2021). The job of the model
    and the machine is to collect data based on its shapes, resemblance, specimen,
    and with no earlier training on predefined algorithms or functions (Wang et al.,
    2023). Thus, the machine has no ideas about sales, gender, value, etc. (Nguyen
    et al., 2024). Unsupervised learning algorithms are divided into two categories:
    Clustering groups data based on multiple factors such as customer purchasing behaviors
    or where they are from (Sarkar et al., 2021), whereas association in an unsupervised
    learning model describes patterns such as Person X to buy Item Y.


    # 19.3 CLASSIFICATION


    # 19.3.1 CLASSIFICATION


    In information mining and AI, classification refers to allocating a pre-indicated
    class to obscure information that is given to the model. A learning model is built
    dependent on the relationship correlation, the indicator characteristics, and
    the estimation'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Multi-Criteria Decision-Making with Machine Learning


    of the objective. The challenge is to perfectly predict the class based on its
    findings on the previous data. This is supervised learning. The accuracy of the
    classification system depends highly on the quality of the information provided
    to the model for learning and the ML model used.


    # 19.3.2 OPTIMIZATION


    All ML calculations have a fixed strategy of learning that relies on estimating
    their boundaries. When boundaries are dissimilar, the grouping exactly fluctuates
    for each situation. The test in AI is to locate the most appropriate boundary
    estimations of the calculations for meeting the objective. In this way, one need
    to tweak the calculation boundaries that best suit the issue. There are a few
    enhancement procedures like genetic algorithms, particle swarm optimization, and
    search methods.


    # 19.3.3 DEVELOPMENT CYCLE


    Our detailed development cycle for the platform we propose is shown in Figure
    19.1. It consists of four main parts: data collection and model design, testing,
    and comparison.


    # 19.4 IMPLEMENTATION


    The interface we developed is a web-based application. Our work featured supervised
    and unsupervised ML algorithms, and in this section, we describe each algorithm
    with their uses. Figure 19.2 gives the flow chart of our model development process.


    First, we briefly describe predictive modeling. These models use past data and
    other attributes to help predict the future using supervised or unsupervised learning.
    In a supervised learning model, the algorithm already has a target variable, and
    it''s been trained on the training data set; in an unsupervised learning model,
    the algorithm does not have a target.


