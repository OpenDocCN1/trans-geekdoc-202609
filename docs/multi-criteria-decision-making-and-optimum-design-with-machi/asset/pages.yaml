    For example, let''s say we have a decision-making problem that involves three
    criteria: cost, quality, and delivery. We have four alternatives to choose from,
    and the data for each criterion are given in Table 10.3.


    To determine the best and worst values for every criterion, we look at the data
    for each criterion and identify the highest and lowest values. The best value
    is characterized by $g_j^*$ and the worst value is characterized by $g_j^-$ for
    each criterion.


    +   * For cost (C1), the best value is 90 (A3)

    * For quality (C2), the best value is 90 (A2) and the worst value is 70 (A3).

    * For delivery time (C3), the best value is 3 (A4) and the worst value is 6 (A3).


    Once we have identified the ideal and undesirable value for each criterion, we
    can move on to calculating S, R, and Q for each.


    +   IV. Calculate the maximum gap of improvement for both beneficial and detrimental
    criteria: In VIKOR, each criterion can be either beneficial or nonbeneficial depending
    on whether higher or lower values of the criteria are preferred. such as fuel
    efficiency, maximum speed, and passenger capacity for motor vehicles. The formula
    for a maximum gap of improvement for beneficial criteria is Equation (10.8)


