    # 2.2.1 Fuzzy Sets And Membership Functions


    # 2.2.1.1 Fuzzy Sets


    Developed by Lotfi A. Zadeh in 1965, fuzzy sets are an extension of classical
    theory that account the natural imprecision and vagueness seen in real-world systems.
    An element in a classical set is either a part of the set or it is not. A fuzzy
    set, on the other, expresses the extent to which an element is a part of the set
    and permits membership. An element in a fuzzy set has a membership that falls
    between 0 and 1.


    In mathematical terms, a membership function μ(x), where x is an element of X,
    defines a fuzzy set A in a universe of discourse X. Each element is given a degree
    of membership μ(A) by the membership function, which indicates how much x belongs
    to the fuzzy set A. Take into consideration, for instance, a fuzzy set “tall”
    within the discourse universe “height.” A tall person may be assigned a high value
    by the membership function μTall(x), a medium value by someone of ordinary height,
    and a low value by someone of modest stature.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.2.1.2 Membership Functions


    In determining an element''s membership in a fuzzy set, membership functions are
    essential. These functions quantify the fuzziness associated with linguistic phrases
    by mapping the crisp input values to their membership degrees. There are several
    membership functions as shown in Figure 2.3, and each is appropriate in a particular
    situation:


    +   - Triangular Membership Function: This straightforward, widely used membership
    function has a triangle shape. Three characteristics describe it: the peak or
    center, the upper limit, and the lower limit.

    - Trapezoidal Membership Function: This function is more flexible than the triangular
    function since it has a flat top. The lower limit, the right base, and the top
    limit are its defining parameters.

    - Gaussian Membership Function: The Gaussian function, which has a bell-like shape,
    is applied when the fuzziness is concentrated around a center value. It is described
    by variables like the standard deviation and mean.

    - Sigmoid (S-shaped) Membership Function: This function is frequently employed
    to simulate smooth transitions because of its sigmoid shape. The steepness and
    midpoint are examples of parameters.

    - Generalized Bell Membership Function: This is more flexible than the Gaussian
    function; it adjusts the curve''s width, slope, and center.

    - Piecewise Linear Membership Function: This function can capture more intricate
    and nonuniform membership patterns when it is composed of straight-line segments.


    The utilization of fuzzy logic in decision-making, control systems, and other
    domains where imprecise information must be taken into account is made easy by
    these membership functions, which aid in the quantification of linguistic terms
    and fuzzy ideas. The particulars of the problem domain and the linguistic context
    influence the choice of the membership function.


    # 2.2.2 LINGUISTIC VARIABLES AND FUZZY OPERATIONS


    # 2.2.2.1 Linguistic Variables


    A key idea in fuzzy logic is linguistic variables, which offer a way to express
    qualitative or nonnumeric words within an ordinary mathematical framework. Linguistic
    variables are different from standard variables in what they phrase in normal
    language, like “high,” “medium,” or “low.” These words are necessary to convey
    subjective and ambiguous information in a way that makes sense to people. A linguistic
    variable is made up of three main components:


    +   - Universe of Discourse: The linguistic variable''s range of values is defined
    by the discourse universe. For example, if the variable of language is “temperature,”
    then all conceivable temperature values may be included in the universe of conversation.'
