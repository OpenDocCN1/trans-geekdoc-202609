    # ### 4.3.4.2 The Dog-Bone Sample


    We printed the sample for the tensile tests according to ASTM D638. The ASTM D638
    test method is a comprehensive delineation of one of the most popular methods
    of measuring the tensile strength of reinforced and unreinforced parts using a
    standard dumbbell or bone-shaped sample under constant temperature, humidity,
    and test speed [12]. In this case, the printed sample had a dog-bone shape with
    a length of 165 and a thickness of 3.2 mm, and the distance between grips was
    115 mm.


    # ## 4.4 RESULTS AND DISCUSSION


    # ### 4.4.1 Process Parameter Selection


    Numerous setting parameters were involved in the 3D printing process, encompassing
    both general practices and those which a comprehensive examination of literature
    and preliminary experiments guided the selection of seven key factors that we
    deemed the most pronounced influence on tensile strength: infill style, printing
    density, layer thickness, nozzle speed, extrusion temperature, raster angle, and
    holding temperature; we held all other parameters at their default settings. The
    study parameters employed in this research are detailed in Table 4.2.


    In contrast to more intricate prints that afford a wide range of infill types,
    such as line, grid, cubic, concentric, tetrahedral, gyro, zigzag, or tri-hexagonal
    [19], the current printer, which is typically employed for rudimentary training
    or straightforward tasks, offers only two available infill types: line and concentric.
    The remaining six parameters were characterized by three levels each, and their
    central values adhered to the manufacturer''s recommended settings for PLA filament.


    # ### 4.4.2 Orthogonal Array Selection


    Considering the number of selected parameters along with their respective levels,
    we employed the L18(2^1 3^6) orthogonal array (OA) delineating design, printed
    a total of 18 samples and subjected them to tensile testing; Table 4.3 provides
    both the computation index and the corresponding S/N ratio for each tested sample.
    As noted earlier, our ultimate aim was to maximize the tensile strength based
    on the highest S/N ratio.'
