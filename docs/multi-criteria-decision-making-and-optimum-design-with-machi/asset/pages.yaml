    V. In the fifth step, we calculate the consistency index (CI) and consistency
    ratio (CR); CR is calculated by dividing CI by the consistency index (RI), a number
    based on the size of the matrix (Equation 10.6) (Zou et al., 2008).


    ```

    $CI = \frac{\lambda_{max}-m}{m-1}$ and $CR = \frac{CI}{RI}$ (10.6)

