  md: '# Fuzzy Systems for Multicriteria Optimization


    (Palczewski & Salabun, 2019). Fuzzy TOPSIS is based on fuzzy sets and language
    expressions'' capacity to represent and analyze imprecise data. Unlike traditional
    methods of decision-making, which typically rely on discrete numerical values,
    Fuzzy TOPSIS enables decision-makers to convey their subjective assessments using
    language, such as "low", "medium" and "high." This allows for a more detailed
    and accurate description of their tastes.


    Using fuzzy sets, the approach calculates the similarity between each alternative
    and the ideal-anti-ideal solutions. This determines the options'' relative proximity,
    which determines the preferred order. Fuzzy TOPSIS delivers a robust and adaptive
    framework for ranking and making decisions about preferences in composite choice
    settings. It functions especially in decision-making scenarios when criteria evaluations
    are inevitably inaccurate or ambiguous.


    # 2.6.2 STEPS INVOLVED IN FUZZY TOPSIS


    Fuzzy TOPSIS goes through several steps in MCDM before arriving at a preference
    order or choice among a set of alternatives. 2.8 shows the main steps that make
    up fuzzy TOPSIS, and we discuss them in more detail as.


    +   **Fuzzy Decision Matrix:** Make a fuzzy decision matrix first, with each row
    denoting an option and each column denoting a criterion. To capture imprecision
    and uncertainty, the degree of membership of each alternative is expressed using
    fuzzy sets and linguistic expressions.

    * **Normalize the Fuzzy Decision Matrix:** Make sure that every criterion is equally
    important and on a comparable scale, normalize the fuzzy decision matrix. The
    fuzzy TOPSIS algorithm''s subsequent computations depend on this phase. Linear
    transformation and vector normalization are two popular techniques.

    * **Fuzzy Ideal and Anti-Ideal Solutions:** Compile the best and worst results
    for each criterion to define the fuzzy ideal and anti-ideal solutions. To do this,
    each criterion''s minimum and maximum values must be determined. Fuzzy sets representing
    the ideal and anti-ideal solutions must then be created.

    * **Similarity Measures:** Using the proper similarity measures, determine how
    similar each alternative is to the fuzzy ideal and anti-ideal solutions. The Euclidean
    distance, the Minkowski distance, or other distance metrics modified to handle
    fuzzy sets are examples of common measures. The degree to which each option resembles
    the ideal and anti-ideal solutions is measured by the similarity metrics.

    * **Relative Closeness to the Ideal Solution:** Assess the degree to which each
    option is similar to the ideal and anti-ideal solutions. Usually, this is accomplished
    by using a criterion for decision-making that takes into account both the distance
    from the anti-ideal solution and the proximity to the ideal answer. The relative
    closeness measure and the closeness coefficient are popular techniques.'
