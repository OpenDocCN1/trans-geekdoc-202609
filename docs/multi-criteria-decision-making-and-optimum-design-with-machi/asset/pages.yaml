    # 3.2 EXPERIMENT PROCEDURE


    # 3.2.1 DESIGN OF EXPERIMENTS


    In this study, we utilized the Taguchi orthogonal array L$_{27}$ experimental
    design to decrease the number of trials. We analyzed five 3-level machining and
    lubrication parameters.


    # 3.2.2 EXPERIMENT SETUP


    We prepared workpieces measuring $35 \times 35 \times 100$ mm. All faces of the
    specimens were ground to ensure high accuracy in the positioning process. Experimental
    runs utilized a 16 mm diameter silent tool holder (Sandvik), 390R-070202-MM 1040
    inserts), selected for suitability in face milling optimization based on experimental
    Ti-6AI-4V alloy data.


    Cutting and lubrication parameters aligned with tool manufacturer recommendations,
    expert input, and previous findings. Table 3.1 presents the material variant levels.
    In the experiment, we employed the DMU50 CNC device shown in Figure 3.2, operating
    with an MQL setup. We affixed the milling jig to a force sensor, shown in Figure
    3.2a, which is part of the experimental setup for machining. The cutting force
    F derived from $F_x$, $F_y$, and $F_z$ measured by a Kistler dynamometer 9139AA,
    and we computed MRR using Equation (3.1). For each test piece, we measured Ra
    using a Mitutoyo Surface JS-201, following the ISO 1997 standard, as depicted
    in Figure 3.2c and following the formula $R_a = f(P,Q,V_c,f_c,a_p)$, $F_c = f2(P,Q,V_c,f_c,a_p)$
    with the data in Table 3.1. The outcomes derived from the experimental results
    were methodically computed and systematically recorded in Table 3.2.


    # 3.3 THEORETICAL BACKGROUND


    For the study of this chapter, we combined SVR, NSGA II, and TOPSIS for the multi-objective
    optimization of milling Ti-6AI-4V alloy under MQL conditions.


