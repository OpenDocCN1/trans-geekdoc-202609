    many vibrant colors.


    PLA has many outstanding advantages over other petrochemical plastic products
    such as ABS or polyvinyl alcohol. With the ability to decompose in the environment,
    PLA is widely used to produce daily utensils such as food packaging, trays, and
    cups. Therefore, it is suitable for use by students to familiarize themselves
    with additive manufacturing. Some PLA properties that it is a thermoplastic with
    a melting temperature between 190 °C and 220 °C, just like other printing plastics,
    it can also be used well for all types of FDM printers. PLA has good elasticity
    and comes in diverse colors for customers to freely choose.


    Additionally, as a thermoplastic, PLA has the special property of being able to
    be softened many times under heat and become solid when cooled. Thermal impact
    changes only its physical but not chemical properties, so it can be recycled many
    times, including the waste products generated during the 3D printing process.
