  md: 'Analyzing Outcome-Based Education Using MCDM 301


    # 22.2 STANDARD DEFINITIONS


    Various definitions involved in the decision-making algorithm are listed below
    for reference.


    # 22.2.1 ATTRIBUTES


    In decision-making, attributes pertain to the objectives that guide the selection
    process. Criteria are defined according to the specific requirements of the desired
    solution, with crucial objectives deemed beneficial attributes. Conversely, attributes
    requiring minimal consideration are categorized as non-beneficial attributes.


    # 22.2.2 CRITERIA


    Elements associated with the decision problem designated as criteria. Criteria
    encompass various rules, values, and conditions that enhance the impartiality
    and fairness of the decision-making process


    # 22.2.3 DECISION MATRIX


    A decision matrix has a dimensions with m x n, where the values are determined
    by the relationships between attributes and criteria. In this context, m denotes
    the number of attributes, and represents the number of criteria. The decision
    matrix serves as a structured representation of how each attribute relates to
    each criterion in the decision-making process.


    # 22.2.4 NORMALIZED DECISION MATRIX


    The matrix obtained by dividing the elements of the decision matrix by its Euclidean
    norm is referred to as a normalized matrix. The Euclidean norm is calculated by
    taking the square root of the sum of squares of the elements within the decision
    matrix. This normalization process helps standardize the values in the matrix,
    making it easier to compare and analyze different elements.


    # 22.2.5 WEIGHTED NORMALIZED MATRIX


    Weights represent the preference assigned to each attribute in a decision-making
    process. The matrix is obtained by multiplying the normalized decision matrix
    by the weighted matrix is the weighted normalized matrix. This matrix combines
    the weights assigned to each attribute with the normalized values derived from
    the decision matrix, providing a comprehensive representation that considers both
    the significance of each attribute and the normalized relationships between attributes
    and criteria.


    # 22.2.6 TOPSIS SCORE


    For each alternative, calculate the geometric mean of its normalized distance
    to the ideal and anti-ideal solutions.'
