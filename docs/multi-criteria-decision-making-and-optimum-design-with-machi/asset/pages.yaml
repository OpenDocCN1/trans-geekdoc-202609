- pgno: 23
  md: '# About the Editors


    Van Thanh Tien Nguyen (member, IEEE) received master’s degrees in mechanical engineering
    and linguistics from Viet Nam National University Ho Chi Minh City, Bach Khoa
    University, and HCMC University of Social Sciences and Humanities in 2012 and
    2020, respectively. He holds a Ph.D. in industrial engineering and management
    from the National Kaohsiung University of Science and Technology, Taiwan. He has
    published over 66 journals and conference papers, with over 101 review reports,
    and is an academic reviewer for several QI journals with over 65 scientific manuscripts.
    He has experience studying and working in labs as a researcher/professional in
    many countries, such as South Korea, Thailand, Russia, and Taiwan. He is a lecturer
    at the Industrial University of Ho Chi Minh City, Vietnam. His areas of interest
    are machine learning (AI), compliant mechanisms optimization design, numerical
    computation, multicriteria decision-making, and supply chain management. Dr. Nguyen’s
    works have significantly influenced his field, as evidenced by Scopus H-index
    of 19 and 748 citations (as of August 2024).


    Nhut T.M. Vo (member, IEEE) is a versatile professional. She received the M.Sc.
    degree from the National Kaohsiung University of Science and Technology, Taiwan,
    where she is currently pursuing a Ph.D. in industrial engineering and management.
    Her professional journey has taken through various sectors, including banking,
    the jewelry industry, information technology, and e-commerce, enriching her understanding
    of different industries. She is also a self-published author with many books about
    lean management and other fields. Her research interests span various topics,
    including the Internet of Things, blockchain, cloud computing, machine learning
    (AI), green energy, logistics, e-commerce, and numerical computation.


    Vinh Truong is not just a member of the Faculty of Mechanical Engineering at the
    Industrial University of Ho Chi Minh City, Vietnam, but a dedicated educator.
    Truong has also been involved in research and academia, participating in several
    research projects. He has successfully developed and implemented technologies,
    significantly contributing to the industry, but his true passion lies in inspiring
    and educating future generations of engineers, a commitment that shines through
    his work and contributions to the field of mechanical engineering.


    Van-Thuc Nguyen is a lecturer at Ho Chi Minh University of Technology and Education
    in Vietnam. He has a Ph.D. from the National Kaohsiung University of Science and
    Technology, Taiwan, and has published over 50 SCIE journal papers. His areas of
    expertise include manufacturing material science and mechanical processing. He
    is a highly respected researcher and educator in his field.'
