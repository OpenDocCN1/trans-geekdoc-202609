    #  24.1 INTRODUCTION


    Lumpy skin disease is a viral infection that primarily affects cattle. It is caused
    by the lumpy skin disease virus, which belongs to the family Poxviridae. This
    disease is characterized by the development of nodules on the head, neck, mucous
    membranes, and internal organs of affected animals. The first clinical signs of
    the disease are often a fever and decreased milk production. In more severe cases,
    nodules or lumps will appear on the skin, particularly around the udder, and genitals.
    It is crucial to understand the disease, its transmission, and prevention to effectively
    manage and control its impact on cattle populations. Lumpy skin disease has been
    known to affect cattle for centuries, with records dating to ancient times. The
    disease has evolved in its impact over the years due to changes in livestock-management,
    trading practices, and the globalization of animal diseases (Anwar et al., 2022).


    Machine learning (ML) has been used to guide decisions in an extremely wide range
    of fields. One of researchers used ML to forecast the variables that influence
    the ongoing usage of mobile devery applications. The scientists analyzed data
    from 925 users of what discovered to affect usage were app rating, delivery time,
    and user demographics. The study findings emphasizes that it is critical to comprehend
    these elements in order to raise customer happiness and engagement levels with
    mobile devery applications (Ahmad Rabaa et al., 2022).


    (Jae-Ho Han, 2022) studied improving the accuracy and speed of eye disease diagnosis
    by analyzing medical images using artificial intelligence (AI) algorithms. The
    author compared neural networks, support vector machines, and decision trees for
    detecting three common eye diseases:initis pigmentosa, diabetic retinopathy, and
    glaucoma (Bernard et al., 2011; Shaikh et al., 2022). A research group used medical
    images and patient data to train ML models and then predict the likelihood of
    disease (Shruti Bhat et al., 2020). A separate group'
