    Van-Canh Nguyen, Dung Hoang Tien, Thuy-Duong Nguyen, Van Hung Pham, Ba Nghien
    Nguyen, Duy Trinh Nguyen, and Van Que Nguyen


    #  3.1 INTRODUCTION


    Machining processes, including milling, drilling, boring, and turning, hold significant
    importance across various industries (Abelian-Nebot and Romero Subirón, 2010;
    Okopujie et al., 2019). During these operations, materials undergo a transformative
    process wherein they are separated into chips, contributing approximately 5% to
    the GDP of developed nations (Lindgren et al., 2017). The elimination of undesired
    components leads to the plastic deformation of the workpiece, converting a substantial
    portion of machining into thermal energy (Balogun et al., 2016; Kundrak et al.,
    2021). Recognizing the pivotal role of these procedures across diverse sectors,
    characterized by high expertise, effective resource management, and continual
    development—becomes imperative to address escalating demands (Soni et al., 2023).
    Machining titanium alloys in general often encounters challenges due to the mechanical
    and physical characteristics of this material (Klocke et al., 2015; Ravi Testa
    et al., 2018).


    Ti-6AL-4V is the most commonly used titanium alloy, for over 50% of total global
    titanium production. An α-β phase alloy is extensively utilized in automotive
    and medical industries, which comprise around 80% of Ti-6AL-4V usage (Salvo et
    al., 2017; Wang et al., 2023). Titanium alloys constitute up to 14% of the structural
    composition of the Airbus A350-900 XWB, 15% of the Boeing 787, and 25% of GE CF66
    aircraft engines (Shokrani et al., 2019). Titanium and its alloys are also utilized
    in the automotive, shipbuilding, and chemical industries due to advantageous properties
    including good corrosion resistance and high biocompatibility, etc. (Lin et al.,
    2021; Peters et al., 2003).


    DOI: 10.1021/9781033265170-3'
