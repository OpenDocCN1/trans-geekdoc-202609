    For this research, we were evaluating four locations in India, Kolkata, Chinshur,
    Durgapur, and Bankura, to choose the optimal site for an electric vehicle charging
    station based on five conflicting parameters: population, air quality, total construction
    cost, the total of EVs served per day, and distance from the site from the main
    road are identified to choose an optimal site for EVCS.


    We applied AHP to create the pairwise comparison matrix in Table 10.4 and compute
    criteria weights before calculating the maximum eigenvalue (λ) of the metric.
    Table 10.5 shows that the city had the highest weight in the decision (0.43) and
    that air quality was lower (0.5). Next, we calculated CI, RI, and CR following
    Step V for AHP (Section 10.2.1); we know that an acceptable CR is less than 0.1.
    Figure 10.2 plots the attribute values for each criterion and each of the four
    locations.


    Finally, we applied VIKOR to choose the optimal EVCS site following the steps
    in Section 10.2.2 by calculating the rank evaluation in Table 10.6. We considered
    all the attributes for each alternative, and Table 10.6 shows that VIKOR ranked
