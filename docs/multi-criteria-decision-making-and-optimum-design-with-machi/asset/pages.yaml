    # 8.1 INTRODUCTION


    Additive manufacturing (AM), also known as 3D printing, has become the most widely
    used technology to rapidly create parts with complex geometries, which are difficult
    to produce using traditional methods (Rasiya et al., 2020). Over the years, AM
    technology has seen many advancements based on developments in material science
    and manufacturing technologies (Swift et al., 2013), in particular fused deposition
    modeling (FDM) and filament fabrication, which has brought to widespread 3D printing
    technologies.


    FDM was developed in 1989 by Scott Crump, cofounder of Stratasys Inc., and Stratatys
    brought it to the market in 1991 (Gurr et al., 2012) and has been used extensively
    in various industries such as automotive, health care, education, and aerospace.
    FDM is a cost-effective, flexible, and user-friendly technology that has revolutionized
    the manufacturing industry. With the current FDM technology, printed parts can
    be quickly produced and precisely sized with complex geometries, surface roughness,
    and good mechanical properties. The mechanical characteristics are affected by
    processing parameters such as printing speed, infill pattern, layer height, infill
    density, nozzle temperature, and nozzle diameter. Depending on each specific application,
    it is essential to adjust the process parameters accordingly (Azar Equal et al.,
    2017; Mohamed et al., 2015; Hasdiansah et al., 2023; Lagos et al., 2023).


