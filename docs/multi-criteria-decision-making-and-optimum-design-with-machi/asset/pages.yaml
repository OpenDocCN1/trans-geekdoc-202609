    # 13.4 CLASSIFYING ML TECHNIQUES FOR MCDM


    # 13.4.1 Supervised LEARNING


    Supervised learning in MCDM involves using labeled training data to build models
    that can predict outcomes, evaluate alternatives, or assist in assigning criteria
    weights. Here are some common supervised learning techniques and their applications
    in MCDM.


    # 13.4.1.1 Regression Models and Classification Models


    Regression models, such as linear, polynomial, and support vector regression,
    are used to predict numeric values on input variables. In MCDM, regression can
    be applied to predict the performance of different alternatives across multiple
    criteria, for each alternative''s expected revenue or cost. Classification models
    assigns labels to instances based on learned patterns, including decision trees,
    random forests, and supervised learning can be employed to categorize alternatives
    into predefined groups based on their suitability for specific criteria (Pourkhodabakhsh
    et al., 2023). For example, based on historical performance, investment options
    can be categorized as low, moderate, or high risk.'
