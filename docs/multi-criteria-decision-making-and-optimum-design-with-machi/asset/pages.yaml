    III. In the third step, the eigenvector of matrix B is calculated; the eigenvector
    is the average of each row element of matrix B and represented by Di. Obviously,
    Di is a column vector of size m x 1; it is calculated as Equation (10.3):


    ```

    Di = \begin{bmatrix} \sum b_{b1} & \dots & \sum b_{1m} \ \vdots & \ddots & \vdots
    \ \sum b_{m1} & \dots & \sum b_{mm} \end{bmatrix} (10.3)

    ```


    IV. In the fourth step, the eigenvalue of original matrix B is calculated, which
    is represented by λmax. To calculate λmax requires another column vector which
    we get by multiplying matrix B by D (Equations (10.4) and (10.5)):


    ```

    B × D = \begin{bmatrix} b_{11} & b_{12} & \dots & b_{1m} \ \vdots & \ddots & \vdots
    \ b_{m1} & b_{m2} & \dots & b_{mm} \end{bmatrix} \times \begin{bmatrix} y_1 \
    y_2 \ \vdots \ y_m \end{bmatrix} (10.4)

    ```'
