    # 17.1 INTRODUCTION


    The Iranian scientist Lotfi A. Zadeh developed the mathematical framework known
    as fuzzy set theory in 1965 as a way to address ambiguity and uncertainty in data
    and information. Mathematicians such as George Cantor traditional set theory,
    which works with crisp or clear sets, in which member either belongs to a set
    or does not. But many notions in the real world are neither precisely defined
    binary. In order to overcome this, fuzzy set theory allows objects to have varying
    degrees of membership in a set to a strict yes or no membership. Meenakshi et
    al. [1,2] combined crisp fuzzy sets and fuzzy graph structures and used hypergraphs
    to model social networks, providing a rich representation and intuitive modeling
    language for exploring polymorphic interactions between entities.


    The RSA (Rivest-Shamir-Adleman) cryptystem [3–5] is one of the most widely used
    public key cryptography algorithms; it was introduced in 1977 by Rivest, Adi Shamir,
    and Leonard Adleman is based on the mathematical properties of large prime numbers
    and their difficulty in factorization. It involves the use of a pair of mathematically
    related keys: a public and a private. The private key is required for decryption;
    the public key is utilized for encryption. The difficulty of factoring the product
    of two prime numbers, which serves as the foundation of the keys, is the basis
    for RSA’s security. RSA has been a well-studied and widely used encryption algorithm
    for several decades. Researchers have conducted extensive studies on various of
    RSA cryptography, focusing on its security, efficiency, and potential vulnerabilities
    [6,7].


    Pius et al. [8–10] proposed an enhanced version of RSA to increase security for
    online transactions by replacing the number n in the original RSA algorithm with
    the new f. To this original algorithm eliminates the need to transfer the product
    of two random prime numbers in the public key, making it difficult for intruders
    to guess n and ensuring that the encrypted message remains safe from attackers.'
