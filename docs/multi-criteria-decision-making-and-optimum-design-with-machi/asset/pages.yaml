  md: '# # Optimizing the Surface Roughness of H13 Steel Machined by Wire Electrical
    Discharge


    Pham Thi Hong Nga, Van Tran Tran, Thanh Tan Nguyen, Xuan Tien Vo, and Van-Thuc
    Nguyen*


    # ## 6.1 INTRODUCTION


    Wire electrical discharge machining (WEDM) is a method that can machine complex
    shapes and extremely hard materials that the traditional method cannot process
    [1–3]. WEDM uses a thin wire made from copper and tungsten as an electrode to
    discharge the conductive materials. The discharge process erodes the machined
    part gradually without direct contact with it. The cooling environment removes
    the thermal energy that appears during the WEDM process; therefore, there is no
    thermal effect on the heat-treated steel part [4, 5, 6].


    AISI H13 steel is a chromium hot tool steel that is commonly used in both hot
    and cold tooling applications, belonging to group H under the AISI classification.
    H-13 steel has good abrasion resistance at both low and high temperatures, as
    well as high toughness and ductility [7, 8, 9]. H13 hot work tool is used more
    than any other tool in tooling applications due to its exceptional combination
    of toughness and fatigue resistance.


    However, machining H13 steel is a challenging issue that often requires state-of-the-art
    tools or methods. For example, Caldwell et al [10] applied high-speed machining
    to H13 steel using carbide tooling, and the carbide tool was able to generate
    210 holes with 16 mm depth, 30 mm/min cutting speed, and a 0.1 mm/rev feed rate.
    Umbrello et al [11] presented a model for computer hard-machining H13 steel. The
    hardness-based flow stress and fracture models could imitate the effect of hardness
    on the formation of the chip.


    Zhang et al [12] used physical vapor deposition coating on the cutting tools,
    reducing the cooling tool temperature. The TiAlN coating produced a higher tool-chip
    interface temperature than the Ti coating. Do et al. [13] identified the optimal
    cutting


