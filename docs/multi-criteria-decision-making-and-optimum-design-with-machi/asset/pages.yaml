    environment. This iterative process fosters a sense of collaboration between educators
    and students, creating a shared responsibility for the learning journey.


    In essence, positive feedback in the context of OBE serves as a reinforcement
    mechanism, validating that the educational system is not just delivering content
    but facilitating genuine understanding and skill acquisition. Students, feeling
    heard and acknowledged, are more likely to engage in their learning processes,
    creating a positive cycle of motivation and achievement. Students'' perceptions
    of alignment between their educational experiences and real-world actions cultivates
    a sense of purpose and relevance.


    Moreover, the positive feedback loop in OBE extends beyond individual achievement
    to impact institutional effectiveness. Institutions that observe and leverage
    student feedback as a task for improvement cultivate environments of continuous
    enhancement. This proactive approach positions educational institutions as responsive
    entities that evolve in tandem with the changing needs of their learners and the
    broader society.


    The method of Multi-Criteria Decision Making has attracted researchers since it
    serves as an efficient method in identifying the selection of finalists. This
    decision-identification method comes with different forms of analysis. A few of
    them are AHP, ANP, TOPSIS, CBA, and ranking.


