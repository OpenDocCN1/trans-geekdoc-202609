    # 18.2.5 OVERCOMING THE LIMITATIONS AND POSSIBILITIES AT THE CROSSROADS OF AI
    AND SUSTAINABLE DEVELOPMENT


    The goal of AI should be to help society, the economy, and the environment, to
    generally be beneficial. However, due to unequal power relations in the actual
    world, the greater impact of economic arguments, and the absence of emphasis on
    equitable policy and national prioritization, sustainable development prioritizes
    the environment and the economy over social objectives (Lal et al., 2021). The
    most accurate way to gauge social good is through the UN’s SDGs; all 17 goals
    must be supported for AI to be socially beneficial. There are now more ethical
    questions about AI as a result of recent breakthroughs (van Zanten and van Tulder,
    2021). Significant worries exist about justice, accountability, and lack of bias
    in AI decision-making we as well as job instability.


    Researchers, groups, and governments have all suggested different ethical frameworks
    and principles for making AI socially useful in solving these AI-related problems
    (de Almeida et al., 2021), and the topic of AI ethics is developing quickly to
    address these issues. These frameworks are largely policy statements and non-binding
    for organizations that adopt or support them. Because of this, businesses frequently
    design ethical standards for “ethics washing” without having any authority (Naris
    et al., 2023).


