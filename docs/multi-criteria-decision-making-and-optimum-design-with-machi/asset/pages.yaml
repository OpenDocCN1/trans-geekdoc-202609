  md: "# 16 A Study on Machine Learning Twig Graphs on the Hyper Wiener Index of Complete\
    \ Graph\n\nKannan A, Meenakshi Annamalai, Rajkumar. P, and Kujani T\n\n# 16.1\
    \ INTRODUCTION\n\nIn a chemical graph, atoms and bonds represent vertices and\
    \ edges, respectively, and molecules’ physical properties can be described with\
    \ graph theory descriptors or indices. For instance, $W_{Rg}$ is a graph-based\
    \ measure of the boiling point of a molecule by adding up the lengths of all shortest\
    \ pathways. In this chapter, we introduce the concept of power of three acyclic\
    \ graphs and prove that they have a graceful labeling property. We also show that\
    \ every binomial and power of the three acyclic graphs has a cube labeling (Meenakshi\
    \ and Kannan, 2022).\n\nThe study of the impact of structural variation on the\
    \ boiling point of isomers (Wiener, 1947). The Wiener index was introduced in\
    \ the mathematical literature in 1976 (Entringer et al., 1976) and was first used\
    \ to represent the properties of acyclic compounds alkanes. Then to the development\
    \ of the theory of Wiener indices of trees (Dobrynin et al., 2002), and later\
    \ researchers investigated the link between a tree’s hyper-Wiener index and the\
    \ Wiener indices of T and certain of its edges (Gutman and Furtula, 2003).\n\n\
    The hyper-Wiener indices of the Cartesian product, join, and disjunction graphs\
    \ are calculated (Khalifeh et al., 2008), and trees with the highest and lowest\
    \ Wiener indices are identified based on the number of vertices and degree sequence\
    \ (Se et al., 2023). Machine learning has gained much interest as artificial intelligence\
    \ has advanced, with numerous methods being suggested and effectively used in\
    \ a variety of real-world applications (Xia et al., 2020). Let $G_{Rg}$ have every\
    \ edge is related to a pair of vertices in $G_{Rg}$. Since distance measure $D_{Rg}$\
    \ ($D_{Rg}=D_{Rg}(G)$) and graph $G_{Rg}$ have $n$ vertices, and the $i$th row’s\
    \ sum is $W_{Rg}^i$, the Wiener index of $G$ is defined by $W_{Rg}(G) = \frac{1}{2}\\\
    sum W_{Rg}^i$.\n\nDOI: 10.1201/97810322635170-16\n\n213"
