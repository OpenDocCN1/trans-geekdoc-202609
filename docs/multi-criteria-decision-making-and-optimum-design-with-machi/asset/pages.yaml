    RI is different for different m, and m can range between 1 and 10; Table 10.2
    displays the corresponding RI. If the CR is greater than 0.1, the matrices need
    to be revised (Cay et al., 2013; Chakraborty et al., 2006).


    # 10.2 THE VIKOR METHOD


    # 10.2.2 Literature review on VIKOR


    A literature review on VIKOR reveals that the method has gained significant popularity
    among researchers due to its ability to handle decision-making problems with multiple
    criteria. Researchers have applied VIKOR across a broad range of disciplines,
    including engineering, management, environmental studies, and health care.


    One of the key advantages of VIKOR is its ability to balance multiple criteria,
    allowing decision-makers to select the most effective alternative that meets the
    requirements of all stakeholders. The method ranks choices according to their
    final performance and allows for sensitivity analysis to be carried out to evaluate
    the robustness of the method. Researchers have also identified some limitations
    of the method; for example, the method proposes that all criteria are equally
    weighted but may not always reflect the actual preferences of decision-makers,
    leading to biased results. Additionally, the approach disregards risk and uncertainty
    in decision-making. Despite these limitations, VIKOR remains a popular MCDM method
    because of its clarity, simplicity in adoption, and capacity to handle a massive
    number of criteria. Researchers continue to explore new applications of the method
    and develop to overcome its limitations.


    The steps to calculate the final rank using the VIKOR technique are as follows:


    I. Construct a decision matrix: The decision matrix contains the performance ratings
    of each choice (alternative) in relation to each factor (criterion). The matrix
    should have m alternatives and n criteria (see Equation (10.7)).


