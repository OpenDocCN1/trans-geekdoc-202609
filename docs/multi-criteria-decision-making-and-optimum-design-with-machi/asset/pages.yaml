    # 13.4.1.3 Weight Assignment and Preference Modeling


    Supervised learning can assist in assigning weights to criteria based on historical
    or expert knowledge. By analyzing past decisions and their outcomes, these models
    can provide insights into how different criteria have influenced previous decisions.
    This helps in reducing subjectivity in the weight assignment process. Supervised
    learning can capture decision-maker preferences learning from past choices. This
    allows the model to predict which alternatives a decision-maker will likely prefer,
    considering their preferences'' historical data. Preference modeling can be valuable
    when dealing with decision-makers who have made similar choices in the past (Henrique
