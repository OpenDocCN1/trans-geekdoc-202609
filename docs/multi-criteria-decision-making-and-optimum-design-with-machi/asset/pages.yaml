  md: '# Multi-Criteria Decision-Making with Machine Learning


    # 6.5 CONCLUSION


    For this study, we examined how the discharge duration during wire electrical
    machining affects the surface roughness of H13 steel and found that the microstructure
    showed dark particles scattered in the martensite matrix. The best surface roughness,
    Ra of 1.91 µm, was achieved with Sample 2, where T_on was 6 µs and T_off was 14
    µs. In contrast, for sample 8, Ra = 3.35 µm, with T_on and T_off of 14 µs as well.
    According to the Taguchi data, pulse-on time has a greater impact on surface roughness
    than pulse-off time.


