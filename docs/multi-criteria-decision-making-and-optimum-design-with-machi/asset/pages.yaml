    Then, population is sorted by nondomination algorithm described by pseudocode
    Appendix C.


    In the context of NSGA-II, forming a new population $P_{t+1}$ from a merged population
    is methodological and prioritizes the highest quality solutions. The top non-dominated
    set, $F_1$, that contains the best solutions in the merged population is given
    the highest priority. All members of $F_i$ are included in $P_t$ if the size of
    $F_i$ is less than or equal to the desired population size $N$. If $P_i$ reaches
    after including all members of $F_i$, the algorithm proceeds to select members
    from subsequent non-dominated fronts, based on their rank order. Then solutions
    from $F_2$ are chosen next, followed by those from $F_3$, and so on, until the
    population $P_{t+1}$ reaches its capacity or no more sets can be included.


    If the cumulative count of solutions from $F_1$ to the last accommodated nondinated
    set $F_l$ exceeds $N$, a selection must be made from the last set $F_l$. To do
    this, the solutions in $F_l$ are sorted by the crowded-comparison operator, which
    ranks solutions in descending order based on their crowding distance. The algorithm
    then selects the best solutions from $F_l$ to fill the remaining slots in $P_{t+1}$,
    until the population count reaches exactly $N$. This approach ensures that $P_{t+1}$
    is composed of the best'
