    # 3.3.2 NSGA-II


    In general, multi-objective optimization has several objective functions with
    inequality and equality constraints to optimize. Equation (3.7) defines an optimization
    problem:


    ```

    $$\min f_m(x) m = 1,2,3,...,M$$

    $$s \cdot g_j(x) < 0 \quad j = 1,2,3,...,J$$

    $$h_k(x) = 0 \quad k = 1,2,3,...,K$$

    $$x_i^l \leq x_i \leq x_i^u \quad i = 1,2,3,...,N \quad (3.7)$

    ```


    The objective of a multi-objective optimization problem is to identify a set of
    solutions that simultaneously satisfy two criteria: they must be free of any constraint
    violations, and they must excel in all their objective values. The ultimate result
    of this type of optimization is a collection of solutions that represent a compromise
    between various objectives. These solutions are known as Pareto optimal solutions.


    Pareto optimal solutions are defined by their property of nondominance, meaning
    that it is not possible to improve any aspect of these solutions without worsening
    at another objective; enhancing one criterion would necessitate a compromise in
    another. The aggregate of these viable nondominated solutions'
  merge: -1
