  md: '# # 10 Selecting Optimal Electric Vehicle Charging Station Sites Based on Analytic
    Hierarchy and VIKOR


    Mousumi Karmakar and Subhajit Bhattacharyya


    # ## 10.1 INTRODUCTION


    Economic stability across the globe has improved steadily because of the rapidly
    growing demand for industrialization in our cities, but as a result, we are depleting
    many of our natural resources and causing severe environmental degradation (Bilgen,
    2014) and (Zhao et al., 2014). However, if we stop industrialization to save a
    green environment, then we delay or lose our economic improvement. Therefore,
    it is necessary to develop ways to balance economic advancement by reducing fossil
    fuel consumption.


    Although as of 2023, India''s Climate Change Performance Index (CCPI) has improved
    to eighth place worldwide (Puneet et al., 2022), India''s carbon footprint ranks
    third only after China and the United States. CCPI is calculated based on four
    criteria, greenhouse gas emissions, renewable energy, use, and environmental policy.
    In India, nearly 13% of $CO_2$ emissions are caused by the transportation sector
    (Yingwen et al., 2023), while the aggressive adoption of EVs can drastically reduce
    the emission of harmful greenhouse gases, although ongoing research is needed
    to boost EV battery life and range (Xiuhong et al., 2023). The Indian government
    is promoting EVs by offering subsidies to customers. With support from the government
    and attention from the public, we can make a sustainable, carbon-emission-free
    transportation for our future.


    Building on the rapidly growing demand and for public acceptance of EVs, the optimal
    selection of EV charging station (EVCS) sites plays a significant role in green
    transportation systems. A sufficient number of EVCS can eliminate anxiety among
    EV users, and the public will be attracted to EVs if the charging stations are
    economic, well-organized, and easy to access. The charging station site determines
    its success rate; therefore, the method of selecting the sites needs to be well
    organized for choosing optimal locations.


    In this paper, to choose an optimal site for EVCS, we considered five conflictcriteria:
    population, air quality, total construction cost, the number of EVs served per
    day, and distance of the site from the main road. We propose a hybrid multicriteria
    decision-making (MCDM) model that combines the analytical hierarchy


