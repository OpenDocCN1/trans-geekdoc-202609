    Bij = normalized value of $i^{th}$ alternative for $j^{th}$ criteria.


    VIKOR allows decision-makers to consider both favorable and detrimental criteria
    in evaluating alternatives and considers both the positive and negative aspects
    of each criterion. By considering both types of criteria, supporting informed
    decisions.


    +   V. Next is calculating utility (Si; Equation (10.10)) and regret (Ri; Equation
    (10.11)) for every choice:


    ```

    Si = \sum_{j=1}^n S_{ij} (10.10)

    Ri = max(S_j) for j = 2, \dots, n (10.11)

    ```


    +   VI. The VIKOR index (Qi) is then calculated for each choice using Equation
    (10.12):


    ```

    Qi = p \times \frac{S_i - S_{ij}}{S_i^* - S_{ij}} + (1-p) \times \frac{R_i - R_{ij}}{R_i^*
    - R_{ij}} (10.12)

    ```


    Where $S_i$ is the highest and $S_{ij}$ is the lowest, $R_i$ is the highest $R_j$
    and $R_{ij}$ is the lowest, and $p$ is a weighting factor that reflects the decision-maker''s
    preference for Q or R. A value of $p=0.5$ gives equal weight to values.


    +   VII. Rank the alternatives according to Si, Ri, and Qi (Yildirim et al., 2022),
    with the alternative having the highest value ranked first. VIKOR also requires
    considering two other conditions ranking decisions: acceptable and acceptable
    stability.


    VIKOR acceptable advantage refers to the difference in utility between the two
    best-ranked alternatives, instance Q (Rank1) and Q (Rank2). If the difference
    between Q (Rank1) and Q (Rank2) is greater than or equal to $1/(n-1)$, where $n$
    is the number of alternatives, the acceptable advantage condition is satisfied.
    If the difference between Q (Rank1) and Q (Rank2) is less than $1/(n-1)$, then
    the first and second alternatives may not be sufficiently different in terms of
    their utility. In this case, a compromise solution can be proposed as selecting
    the alternatives ranked first and only if condition 2 is unsatisfied. The acceptable
    advantage condition ensures that the top-ranked alternatives are significantly
    better than the others, and prevents the ranking from being on small differences
    that are not meaningful.


    Acceptable stability ensures that the chosen alternative is stable and consistent
    with the decision-maker''s preferences even when different criteria and weights
