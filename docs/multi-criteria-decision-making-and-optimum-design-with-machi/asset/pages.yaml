    #  13.1 INTRODUCTION


    In an increasingly interconnected and complex world, decision-making often involves
    more than a single criterion or objective. Decision-making extends beyond mere
    quantitative analysis, as numerous factors of diverse nature and significance
    conflict to evaluating alternatives (Sookall & Fonou-Dombeau, 2023). Multicriteria
    decision-making (MCDM) emerges as a systematic and structured approach to navigating
    the intricate choices that require consideration of multiple, often conflicting.
    By providing decision-makers with methodologies to effectively weigh and balance
    these criteria. MCDM offers invaluable insights and aids in making informed decisions
    that align with desired outcomes (Ahmed et al., 2023).


    The essence of MCDM lies in acknowledging that decisions are rarely multidimensional.
    Whether it pertains to selecting an investment opportunity, determining the best
    course of action in project management, or making choices in environmental planning,
    decisions involve various considerations (Choudhary et al., 2023). For instance,
    selecting a location for a new factory, factors such as cost, proximity to suppliers
    and customers, environmental impact, and regulatory compliance all contribute
    to the decision-making process.


    MCDM methods facilitate structuring these scenarios by providing a framework for
    objectively evaluating, comparing, and ranking choices. These methods incorporate
    both quantitative and qualitative criteria to capture the nuances and complexities
    of real-world decision scenarios (Bardini & DiCarlo, 2023). As technological advancements
    continue to enable the collection and analysis of amounts of data, the significance
    of MCDM in handling data-driven decisions has only increased.


    MCDM techniques in tackling the challenges posed by decisions influenced by various
    criteria, which might have different levels of importance or uncertainty. By delving
    into traditional approaches and contemporary integrations with machine learning
    (ML), we aim here to comprehensively understand MCDM’s evolution and adaptability
    (Maa Kouhou et al., 2023). As we navigate the intricate web of choices'
