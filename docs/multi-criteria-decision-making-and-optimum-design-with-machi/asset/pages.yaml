    # 6.4 RESULTS AND DISCUSSION


    # 6.4.1 MICROSTRUCTURE


    The microstructure of H13 steel is presented in Figure 6.3. There are dark carbide
    particles scattered throughout the martensite matrix. The carbide phase is micrometer-sized
    and evenly dispersed throughout the matrix; this small size and well-dispersed
    structure facilitated the cutting during the WEDM and created better surface roughness.
    In WEDM, electrical discharges or sparks are the cutting tools that remove the
    materials; there is no physical contact, and therefore, extremely hard materials
    can be easily machined by this technique.


    The variation in carbide size was approximately 10 µm, which was very modest.
    The carbide particles in the figure were MoC, VC, and V8C7, which belong to the
    MC family of carbides, and M23C6 have extremely high hardness, helping improve
    the wear resistance of the steel. Moreover, due to the minor thermal effect of
    the WEDM process, the microstructure of the H13 steel was better preserved than
    in the supplied condition. In other words, the microstructure of the H13 steel
    before and after the WEDM process is similar.


