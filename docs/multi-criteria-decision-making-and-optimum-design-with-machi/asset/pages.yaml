  md: '# Multi-Criteria Decision-Making with Machine Learning


    fundamental concepts of MCDM provide the foundation for understanding its principles
    and methodologies.


    # 13.2.1.1 Criteria, Objectives, and Trade-Offs


    Criteria are the distinct factors that contribute to the decision-making process;
    these can be quantitative or qualitative and represent the dimensions along which
    alternatives are evaluated. Conversely, objectives are the desired outcomes or
    goals that the decision-maker aims to achieve. Each criterion corresponds to a
    specific objective, and the decision process involves optimizing these simultaneously
    (Sookall & Fonou-Dombou, 2023). Trade-offs occur when improving one criterion
    leads to a deterioration in another; for example, when choosing a mode of transportation,
    speed might conflict with cost. Decision-makers must balance these trade-offs
    to make choices that align with their priorities.


    # 13.2.1.2 Preference, Weights, and Alternatives


    Assigning weights reflects the preferences of the decision-makers, stakeholders,
    or experts. Criteria with higher weights are deemed more critical in influencing
    the decision. Assigning weights is a subjective process and involves considering
    the significance of each criterion (Ahmed et al., 2023). Alternatives are the
    different options under consideration. In a real estate decision, alternatives
    might be different properties or locations. MCDM evaluates and compares these
    alternatives based on their performance across the defined criteria.


    # 13.2.1.3 Scoring, Ranking, and Aggregation


    Scoring involves numerical values to alternatives based on their performance on
    each criterion; these scores quantify how each alternative meets the specific
    criteria. The ranking process then orders the alternatives based on their aggregated
    scores, from the most preferred to the least preferred. Aggregation methods combine
    the individual criterion scores to evaluate each alternative overall. Weighted
    sum and weighted products multiply the criterion by their respective weights and
    sum or multiply the results, (Choudhary et al., 2023). Analytical hierarchy performs
    pairwise comparisons to weights and construct a hierarchy model for aggregation.


    # 13.2.1.4 Dominance, Preference, and Sensitivity Analysis


    Dominance occurs when one alternative is better than another across all criteria.
    When dominance is absent, preference information comes into play. Decisionmakers
    may express their preferences using linguistic terms (for example, "strong preference")
    or numeric scales (for instance, 1 to 5) to compare alternatives and establish
    rankings. Sensitivity analysis assesses how changes in criteria weights or scores
    impact the ranking of alternatives. It helps decision-makers understand which
    criteria most influence the outcomes and provides insights into the robustness
    of their decisions (Bardini & DiCarlo, 2023). Sensitivity analysis ensures that
    small changes in input data do not disproportionately alter the results.'
