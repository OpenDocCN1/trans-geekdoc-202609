    enhanced the evaluation and ranking of all alternatives, and Wu performed a sensitivity
    analysis to select the final charging site.


    Guo et al. (2020) used VIKOR to evaluate the performance of renewable energy power
    plants based on several criteria such as energy-saving, environmental impact,
    and economic feasibility. Teng et al. (2005) compared the performance of VIKOR
    with AHP, TOPSIS, and simple additive weighting and used a case study to show
    that VIKOR was the most effective for solving complex decision-making problems.
    In another study, Kaya et al. (2011) proposed a fuzzy version of VIKOR that could
    handle uncertainty and imprecise information in solving complex decision-making
    problems. Wang et al. (2020) suggested an improved version of VIKOR that could
    handle interval data and hesitant fuzzy information in decision-making. The authors
    used a case study to indicate that the modified VIKOR method can effectively rank
    alternatives based on multiple criteria.


    Researchers have applied VIKOR in other fields such as, for instance in finance
    to calculate the performance of mutual funds (Zhang et al., 2013) and identify
    portfolio stocks (Gupta et al., 2018), and in the field of supply chain management,
    AHP has been used to integrate and evaluate the model objectives in group decision-making
    processes for the development of supply network systems (Tavana et al., 2012).
    In engineering, VIKOR has been adopted to resolve supplier selection (Chen et
    al., 2011), project management (Gao et al., 2019), and product design (Chen et
    al., 2014), and in environmental management, VIKOR has been used to choose a suitable
    location for a waste disposal site (Duzakin et al., 2011) and to evaluate the
    sustainability of construction projects (You et al., 2015).


    Overall, VIKOR has been widely used and showing promising results in solving MCDM
    problems in various fields. However, it is a significant condition that VIKOR
    requires carefully weighing the criteria and selecting appropriate solutions in
    real-life applications. For this study, we propose a hybrid AHP-VIKOR model for
    selecting an optimal EVCS site based on population, air quality, cost, number
    of EVs served, and distance to the main city. The proposed method determined the
    criteria weights and selected the best alternative for EVs.


    # 10.2 TRITIONAL METHODS OF MCDM


    Traditional MCDM techniques have long been a cornerstone in decision analysis
    and played a vital role in helping individuals and organizations make complex
    decisions. These methods encompass a range of well-established approaches, such
    as AHP, analytic network process (ANP), TOPSIS, and VIKOR. These techniques offer
    a structured framework for evaluation and prioritizing alternatives faced with
    conflicting criteria. They enable decision-makers to systematically assess the
    trade-offs between different options, taking into account qualitative and quantitative
    factors. While these traditional MCDM methods have been widely used and trusted
    for many years, they are now being complemented and, in some cases, supplanted
    by more advanced computational and data-driven approaches as technology and data
    availability evolve. Nonetheless, traditional MCDM techniques remain a valuable
    resource for decision-makers seeking to make informed and transparent choices
    in a wide range of domains.'
