  md: '# 50 Multi-Criteria Decision-Making with Machine Learning


    et et al., 2022; Wang et al., 2022). Drawing inspiration from biological neural
    functions like those of the brain, the concept of ANNs originated from the pioneering
    work by McCulloch and Walter Pitts (Cooper, 2005; Sankar et al., 2019). In machining,
    ANNs along with genetic algorithms (GAs) have emerged as notable options, demonstrating
    the ability to optimize cutting parameters in complex environments. Their increasing
    popularity is attributed to their adaptability to nonlinear behaviors (M, 2006).


    In a milling experiment on P20 steel, Escamilla et al. used ANN to predict MRR
    and Rₓ (M, 2006), and Maheshwara used regression models and ANNs to predict Rₓ
    in the hard turning of AISI 52100 steel; they showed the efficacy of utilizing
    ANN for these predictive applications (Maheshwara Reddy Paturi et al., 2018).
    Similarly, Boga and Korglu (2021) leveraged ANNs and a GA to predict surface roughness
    and ideal cutting parameters. The authors deleper into GAs, aiming to minimize
    production time in multi-axis CNC machining while ensuring surface roughness.
    However, the performance of GAs heavily depends on the initial configuration,
    requiring substantial computational resources. This dependency makes GAs less
    practical for smaller operations or under limited computational constraints.


    For these reasons, multicritia decision-making (MCDM) is often an optimal solution.
    Common methods utilized VIKOR, additive weighting, and TOPSIS (technique for order
    of preference by similarity to ideal solution); for instance, Que et al. (2023)
    successfully applied TOPSIS to evaluate various machining strategies based on
    different criteria. Their highlights TOPSIS''s superiority in a systematic approach
    to consider and rank multiple alternative options, integrating various objectives.


    Each method—AI, GA, and MCDM—brings unique strengths to optimization but also
    faces distinct challenges. The predictive power of AI, GA’s robust optimization
    abilities, and MCDM’s structured decision framework suggest an appealing case
    for integration. Such a combined approach could leverage each method’s strengths
    while minimizing their limitations, for AI for prediction and modeling, GA for
    finding optimal solutions in complex scenarios, and MCDM for effective evaluation
    and selection. This integrated approach could address broader challenges in machining
    optimization, offering a more comprehensive and effective solution.


    In this chapter, we support vector regression genetic algorithm (NSGA-II), and
    TOPSIS with entropy weight to optimize the multi-objective milling of titanium
    alloy Ti-6Al-4V under minimum quantity removal (MQL). The objectives are minimizing
    surface roughness (Rₓ) and cutting force (F₂) and maximizing material removal
    rate (MRR). These goals are crucial for improving the efficiency and sustainability
    of the machining process, especially with challenging materials like titanium
    alloys. SVR models predicted the impacts of various machining parameters on Rₓ,
    Fc, and MRR, then Finally, the entropy-weighted TOPSIS provided a structured decision
    framework for selecting the most effective machining strategy.'
