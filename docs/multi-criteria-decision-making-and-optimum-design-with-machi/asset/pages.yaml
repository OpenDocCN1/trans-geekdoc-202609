  md: '# 292 Multi-Criteria Decision-Making with Machine Learning


    # 21.5 CONCLUSIONS AND SUGGESTIONS


    # 21.5.1 CONCLUSIONS


    The main purpose of this study was to provide an interdisciplinary contribution
    to the research on tourists'' decision-making. We applied a systematic MCDM approach
    in order to (1) investigate what factors significantly impact tourists'' decision-making;
    (2) identify and investigate how social networks influence tourist motivation
    and perceived constraints by tourist SNS users before travel; and (3) determine
    the weight for each criterion and recommend strategic alternatives for parties
    involved in this industry.


    Based on the results of this study, we drew several conclusions. First, regarding
    the first purpose, the identifies the factors that most influence tourists'' decision-making
    when they choose a destination, we identified from both the tourist and the expert
    surveys that ofattiaponporn and Miller (2007), who developed and tested a model
    of vacation decision-making and discovered that tourists are most likely to research,
    plan, and pre-book their touring in advance using external information search.
    Second, these findings support Zheng Xiang (2010) finding that SNNs are one of
    the most powerful search engines and play important role in trip planning and
    Kerstetter and Cho''s (2014) finding that information search is a main influence
    on destination decision-making. We found differences between the experts and the
    tourists based on their DEMATEL survey findings. For instance, the experts rated
    decision characteristics as the second most important factor, whereas tourists
    rated chose set and experts rated chose five.


    # 21.5.2 PRACTICAL IMPLICATIONS AND SUGGESTIONS


    Tourism industry practitioners, as marketers, managers, and experts, can benefit
    from the framework presented in this study. Marketing managers have used various
    analyses to identify tourists'' decision-making for segmentation and product positioning
    and to develop targeted promotion strategies for different destination markets
    (Lilien & Kotler, 1983). For this study, we adopted an MCDM approach to explore
    concepts and enhance understanding of the tourist decision-making process. Such
    a goal is critical for the marketer, who seeks to better understand the different
    needs that drive tourist decision-making processes and associated information
    searches to communicate product benefits more effectively and efficiently.


    This framework provides a theoretical and empirical basis for developing promotional
    strategies related to the tourist decision-making process. Therefore, better understanding
    of tourist decision-driven marketing concepts and campaigns may contribute to
    developing more effective customer-driven marketing while maintaining a competitive
    position for their destination. Understanding this study''s findings and taking
    actions that resonate with the tourism market will help travel agencies and related
    companies and better design marketing strategies and effectively target tourists
    by meeting their information needs and desires.'
