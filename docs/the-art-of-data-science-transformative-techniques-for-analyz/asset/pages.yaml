    feature. Decision trees are commonly utilized in industries like banking, marketing,
    and healthcare because they are excellent at defining complicated decision boundaries.
    Ensemble techniques like random forests and gradient boosting substantially improve
    the predictive accuracy of decision trees by fusing several weak learners into
