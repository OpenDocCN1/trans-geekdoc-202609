    Robust classifiers known as support vector machines (SVMs) seek to identify the
    ideal hyperplane in a high dimensional space for dividing several classes. SVMs
    work well with datasets with intricate structures or when the decision boundary
    is nonlinear. Their uses span a variety of fields, including bioinformatics, finance,
    and picture and text classification. A simple yet powerful classification algorithm
    called K-nearest neighbors (KNN) gives an instance a class label based on the
