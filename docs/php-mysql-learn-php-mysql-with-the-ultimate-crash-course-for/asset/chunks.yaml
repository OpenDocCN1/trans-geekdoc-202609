- fmt: "\nOnce you are done making changes to your file, you have to close it using\
    \ the function `fclose()`. It requires a file pointer as an argument. It returns\
    \ true if the closure is successful and false if it is not.\n\n## Reading Files\n\
    \nAfter you open a file using the function `fopen()`, you can read it using the\
    \ function `fread()`. It requires two arguments. It reads the length bytes from\
    \ the file pointer referenced by the handle. It stops reading as soon as it has\
    \ read the length bytes, reaches the end of the file, a socket timeout occurs,\
    \ or a packet becomes available. \n\nYou can use the function `filesize()` to\
    \ find the length of your file. It takes the file name as an argument and returns\
    \ its size in bytes. It also returns false on failure or the read string. Take\
    \ note that the function `fread()` reads from the current position of your file\
    \ pointer. If you want to find the current position of the file pointer, you have\
    \ to use the function `ftell()`. If you wish to rewind the position of the file\
    \ pointer, you have to use `rewind()`.\n\nTake a look at the following example:\n\
    \n```php\n<?php\n$filename = \"/testfile.txt\";\n$file = fopen($filename, \"r\"\
    );\nif ($file == false)\n{\n    echo (\"Opening File Error\");\n    exit();\n\
    }\n$filesize = filesize($filename);\n$filetext = fread($file, $filesize);\nfclose($file);\n\
    echo (\"The size of the file is $filesize bytes\");\necho(\"<pre> $text </pre>\"\
    );\n?>\n```\n\nIn the above example, the content of the text file `testfile.txt`\
    \ is assigned to a variable and then displayed as the output.\n\n## Writing Files\n\
    \nIf you want to write a new file or append a text to an existing file, you can\
    \ use the function `fwrite()`. It requires two arguments to specify the file pointer\
    \ and the data string to be written. You can include a third integer argument\
    \ if you want to specify the length of the data to be written. This third integer\
    \ argument is optional, though. If you do not include any third argument, writing\
    \ would stop upon reaching the specified length.\n\nThe function `fwrite()` writes\
    \ the contents of the string to the file stream pointed to by the handle. It returns\
    \ false on error or the number of bytes. If you are using a system that differentiates\
    \ between text files and binary files, such as Windows, you should open your file\
    \ with `'b'` included in the `fopen()` mode parameter. Also, if the handle is\
    \ opened in append mode, `fwrite()` becomes atomic, except when the size of the\
    \ string exceeds the block size of the file system. There is no more need to `flock()`\
    \ a resource before you call `fwrite()`. You can write all data without any interruption.\n\
    \nTake a look at the following example:\n\n```php\n<?php\n$file = fopen(\"testfile.txt\"\
    , \"w\");\necho fwrite($file, \"Testing sample!\");\nfclose($file);\n?>\n```\n\
    \nIf you run the above code, you will get an output of:\n\n15\n\nWhy? You get\
    \ 15 because `Testing sample!` has fifteen characters including spacing.\n\nPreview\
    \ of my other books that might interest you: \n\n[HTML: Step by Step Beginners\
    \ Guide to HTML](http://www.amazon.com/gp/product/B00YDSJ8VC?Version=1&entries=0)\n\
    \nThe book “HTML: Step by Step Beginners Guide to HTML” will provide all essential\
    \ information and training during the book which you’ll need in order to upgrade\
    \ your skills later with other languages and even with more sophisticated HTML.\n\
    \nThe reason why we start our “Learn Web Design” series with HTML is because he\
    \ is the core to every website out there. No matter how basic or sophisticated\
    \ one website is, the HTML is always there and is essential for its existence.\n\
    \nIn order to perfectly understand the material we’ll go through everything from\
    \ the absolute beginning. We’ll do some exercises because the only way to master\
    \ programming is by constant exercise and learning. \n\nAll the material in this\
    \ book can be learned in less than a day but exercising and upgrading your skills\
    \ later on is essential to becoming a good programmer. \n\nYou can check/download\
    \ the book from [HERE](http://www.amazon.com/gp/product/B00YDSJ8VC?Version=1&entries=0).\n\
    \n## Java  \n\nLearn Java Programming with the Ultimate Crash Course for Beginners\
    \ in no Time!\n\nToday’s applications are becoming increasingly powerful with\
    \ smartphones and tablets. Both are being used extensively by companies and are\
    \ also a friendly language for beginners. \n\nDespite the popularity of Java as\
