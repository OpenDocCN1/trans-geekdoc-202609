    \ of:\n\n28\n\nobviously because the closest integer to that value is 28.\n\n\
    In PHP, there are a lot of mathematical functions. You can use minimum, maximum,\
    \ and random numbers for simple mathematical operations. You can also use functions,\
    \ such as tangent and sine, if you want to do advanced mathematics. You can even\
    \ convert binary and octal numbers.\n\n## Formatting Numbers\n\nIf you wish to\
    \ display a number in a specific format, you can do that in PHP. You can actually\
    \ display numbers with commas to represent thousands or use decimals if you want\
    \ to write currency amounts. For example, if you write 10.00, it would be shown\
    \ as 10. You just have to determine the exact way that you want your number to\
    \ be displayed.\n\nYou can use number\\_format to format numbers. Its general\
    \ form is \n\nnumber\\_format (number, decimals, “decimalsep”, “thousandsep”)\n\
    \nEvery input has a specific function.\n\n\\_number represents the number that\
    \ is to be formatted. It is necessary to include it in all your codes.\n\n\\_decimals\
    \ represents how many decimal places you desire. If you do not include decimals\
    \ in your code, the program will automatically consider 0 to be the number of\
    \ your decimal places. Also, number will be rounded to the integer closest to\
    \ its value. Take note that if you use decimalsep and thousandsep, you have to\
    \ include decimals.\n\n\\_thousandsep represents the character that separates\
    \ a number into thousands. The comma is the default for this. Take note that if\
    \ you use this parameter in your code, you also have to use decimalsep.\n\n\\\
    _decimalsep represents the character that separates the decimal places. The decimal\
    \ point is the default for this. Take note that if you use this parameter in your\
    \ code, you also have to use thousandsep.\n\nTake a look at the following examples\
    \ of number\\_format statements together with their corresponding outputs:\n\n\
    | $number || Format || Output |\n\n| --- | --- | --- |\n\n| 12345 || number\\\
    _format ($number) || 12,345 |\n\n| 12345.77 || number\\_format ($number, 2) ||\
    \ 12,345.77 |\n\n| 12345.77 || number\\_format ($number) || 12,345 |\n\n| 12345.7\
    \ || number\\_format ($number, 3) || 12,345.700 |\n\n| 12345 || number\\_format\
    \ ($number, 0, “.”, “.”) || 12.345 |\n\n| 12345.77 || number\\_format ($number,\
    \ 2, “.”. “ “) || 12345.77 |\n\nOnce formatting is done, the number gets converted\
    \ into a string data type. Thus, you should always perform your desired mathematical\
    \ operation on a number before you decide to format it.\n\nIf you need to do a\
    \ complicated formatting procedure, you have to use sprintf and printf.\n\n\\\
    _sprintf stores the formatted number into a variable.\n\n\\_printf directly outputs\
    \ the formatted number.\n\nYou can use both formatting statements to format numbers\
    \ and character strings, as well as to output numbers and strings in the same\
    \ output statement.\n\n# Chapter 7: Opening, Reading, Writing, and Closing Files\n\
    \n## Opening and Closing Files\n\nIn PHP, the function fopen ( ) is used to open\
    \ files. It requires two arguments that state the file name and the mode in which\
    \ it has to operate.\n\n| File Mode || Purpose |\n\n| --- | --- |\n\n| r || It\
    \ opens the file for the sole purpose of reading. It positions the pointer at\
    \ the start of the file. |\n\n| r+ || It opens the file both for reading and writing.\
    \ It positions the pointer at the start of the file. |\n\n| w || It opens the\
    \ file for the sole purpose of writing. It positions the pointer at the start\
    \ of the file, as well as truncates it to zero length. If there are no files,\
    \ it tries to create one. |\n\n| w+ || It opens the file for both reading and\
    \ writing. It positions the pointer at the start of the file, as well as truncates\
    \ it to zero length. If there are no files, it tries to create one. |\n\n| a ||\
    \ It opens the file for the sole purpose of writing. It positions the pointer\
    \ at the end of the file. If there are no files, it tries to create one. |\n\n\
    | a+ || It opens the file for both reading and writing. It positions the pointer\
    \ at the end of the file. If there are no files, it tries to create one. |\n\n\
    The function fopen ( ) returns the value of false in case opening a file does\
    \ not become successful. Otherwise, it returns a file pointer to write or read\
    \ to that particular file."
