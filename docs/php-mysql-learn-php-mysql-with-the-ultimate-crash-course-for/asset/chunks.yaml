  trans: "\n\nPostgreSQL 的一些重要特性包括 TOAST 数据压缩、参数化和静态 SQL 执行器、改进的缓存管理、强大的可扩展性、异步提交以及先进的基于成本的优化器。PostgreSQL\
    \ 能够使用快速的压缩方案对数据进行解压缩和压缩，使其能够存放在特定的磁盘空间中。压缩数据非常好，因为它不仅节省磁盘空间，还能更快地读取数据。\n\nMySQL\
    \ 的一些核心特性包括广泛的 ANSI SQL 99 子集及扩展、通过 `LIST`、`SET`、`HASH` 和 `RANGE` 进行表分区、网络协议压缩、通过行更改事件或语句的内置复制、触发器、SSL\
    \ 支持、游标、存储过程、可更新视图以及 Unicode 支持。\n\n如果你是一个不为自己的网站编写程序的站管理员，你可能不会觉得 MySQL 和 PostgreSQL\
    \ 之间的差异有多大。你关心的可能主要是你的 Web 主机是否拥有你应用程序所需的数据库软件。通常情况下，如果你使用 CMS 或任何其他流行的博客软件，可以预期它使用\
    \ MySQL。几乎所有的商业 Web 主机都将 MySQL 作为其托管包的一部分。\n\n## 你需要学习 MySQL 吗？\n\n普通的站管理员不需要学习\
    \ SQL 或 MySQL，因为他们使用的软件极可能完成了数据的存储和检索。他们只需要学习如何使用他们的软件。将 MySQL 和类似的数据库想象成汽车引擎。为了能够开车，你真的不需要学习如何设计汽车引擎。同样，为了能够使用博客软件，你不需要学习直接读写\
    \ MySQL 数据库。\n\n另一方面，如果你是一个程序员，你需要学习 SQL，以便编写访问 MySQL 和其他 SQL 数据库的计算机程序。当然，你还需要学习一种合适的编程语言。如果你想是否必须成为程序员才能成为站管理员，答案是否定的。你可以在不知道编程的情况下成为站管理员。你可以通过手动编写\
    \ HTML 代码来创建一个网站。\n\n# 第 3 章：语法、注释、大小写敏感、换行和表单\n\n## 语法\n\n你可以将 PHP 脚本放在文档的任何地方。它们通常以\
    \ `<?php` 开始，以 `?>` 结束。它们的文件扩展名为 `.php`，通常包含 PHP 脚本代码和 HTML 标签。不要忘记使用分号（`;`）结束\
    \ PHP 语句。\n\n考虑以下 PHP 代码示例：\n\n```php\n<?php\necho “Testing code”;\n?>\n```\n\n\
    如果你运行这段代码，你将得到输出：\nTesting code\n\n## 注释\n\n注释是不执行或不作为程序一部分读取的代码。它们的唯一目的是供可能需要额外信息的用户阅读。如果你想让其他人更好地理解你的程序，或者你想提醒自己曾经做过什么，你可以在程序中包含注释。如果你决定在几年后回来看你的程序，你的注释将非常有帮助。它们可以提醒你自己在创建代码时的想法。\n\
    \n考虑以下示例：\n\n```php\n<?php\n# 这是一个单行注释\n// 这是一个单行注释\n/* \n这是一个 \n多行\n注释\n*/\n\
    // 这是一个省略了代码行部分内容的注释\n$w = 2 /* + 10 */ + 3;\necho $w;\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\
    5\n\n## 大小写敏感\n\nPHP 中的函数、关键字和类是不区分大小写的。\n\n  考虑这个示例：\n\n```php\n<?php\necho “Testing\
    \ code ”;\nECHO “Testing code ”;\nEcHo “Testing code ”;\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\
    Testing code Testing code Testing code\n\n然而，PHP 中的变量名是区分大小写的。\n\n看这个示例：\n\n```php\n\
    <?php\n$color = “blue”;\necho “The sky is ” . $color . \"\\n“;\necho “The sky\
    \ is “ . $coLOR . \"\\n“;\necho “The sky is “ . $COLOR . \"\\n“;\n?>\n```\n\n\
    如果你运行这段代码，你将得到输出：\nThe sky is blue \nThe sky is \nThe sky is\n\n你会发现，第一个语句是唯一显示变量\
    \ `$color` 值的。这是因为 `$color`、`$coLOR` 和 `$COLOR` 被视为不同的变量。\n\n## 换行\n\n要创建一个新行，你只需要在语句后放置\
    \ `\\n`。\n\n考虑以下内容：\n\n```php\n<?php\necho “The sky is \\n“;\necho “The rose is\
    \ \\n“;\n?>\n```\n\n如果你运行这段代码，你将得到输出：\nThe sky is\nThe rose is\n\n## 处理表单\n\n\
    PHP 的最大优势之一是它可以处理表单。\n\n# 第 4 章：数组\n\n数组是一个可以存储多个值的特殊变量。例如，你可以在数组中存储多个项目。\n\n\
    ```php\n$name1 = “Wendy”;\n$name2 = “Dawn”;\n```\n\n## 如何创建数组\n\n使用 `array()`\
    \ 函数来创建数组。可以传递任意数量的参数。实际上有三种数组：关联数组、索引数组和多维数组。\n\n### 关联数组\n\n关联数组具有命名的键。关联数组的语法为\
    \ `array(key => value)`。例如：\n\n```php\n<?php\n$price = array (“cantaloupes” =>\
    \ “2”, “grapes” => “3”, “strawberries” => “4”);\necho “Cantaloupes cost “ . $price['oranges']\
    \ . “dollars each.”;\n?>\n```\n\n### 索引数组\n\n索引数组具有数字索引。索引数组的语法为 `array(value1,\
    \ value2)`。编写索引数组有两种：你可以允许索引自动分配，也可以手动分配。\n\n自动分配：\n```php\n$fruits = array (“apples”,\
    \ “bananas”, “kiwis”);\n```\n\n手动分配：\n```php\n$fruits[0] = “apples”;\n$fruits[1]\
    \ = “bananas”;\n$fruits[2] = “kiwis”;\n```\n\n### 多维数组\n\n多维数组包含其他数组。这是一个二维数组的示例：\n\
    \n```php\n<?php\n$fruits = array (\narray (“apples”, 10, 6),\narray (“bananas”,\
    \ 4, 5),\narray (“kiwis”, 11, 10)\n);\n?>\n```\n\n在 PHP 5.4 中，`array()` 可以被 `[]`\
    \ 替换。这被称为短数组语法。例如：\n\n```php\n<?php\n$name = [\n    “Wendy” => “Dawn”,\n    “Dawn”\
    \ => “Wendy”,\n];\n?>\n```\n\n字符串或整数可以是键。值也可以是任何类型。此外，预计会发生以下键转换：\n\n浮点数：它被转换为整数，截断小数部分。例如，键\
    \ `9.7` 将存储在 `9` 下。\n\n"
- fmt: "\n`String`. A string that contains a valid integer is cast to the integer\
    \ type. For example, the key `9` is going to be stored under `9` while the key\
    \ `09` is not going to be cast since it is not a valid decimal integer.\n\n`Bool`.\
    \ It is also cast to an integer. For example, the key `false` is going to be stored\
    \ under `0` while the key `true` is going to be stored under `1`.\n\n`Null`. It\
    \ is cast to an empty string. For example, the key `null` is going to be stored\
    \ under `\" \"`.\n\nObjects and arrays can never be used as keys. If you try to\
    \ use them as keys, you will get an illegal offset type warning.\n\nIf you declare\
    \ multiple elements with the same key, the last one is going to be used while\
    \ the others are going to be overwritten.\n\nConsider the following example:\n\
    \n```php\n<?php\n$array = array (\n    1 => \"w\",\n    \"1\" => \"x\",\n    1.5\
    \ => \"y\",\n    true => \"z\",\n);\n\nvar_dump ($array);\n?>\n```\n\nIf you run\
    \ this code, you will get an output of:\n\n```text\narray (1) {\n    [1] =>\n\
    \    string (1) \"z\"\n}\n```\n\nThis is the resulting output because all the\
    \ keys are cast to `1`. For every new element, the value is overwritten, which\
    \ is why the value `\"z\"` is left. String and integer keys can be contained in\
    \ PHP arrays all at once since PHP cannot differentiate associative and indexed\
    \ arrays.\n\n## The Square Bracket Syntax\n\nThe array `[key]` syntax can be used\
    \ to access array elements. Both curly braces and square brackets can be used\
    \ interchangeably if you want to access array elements. Since PHP 5.4, you can\
    \ array deference the results of method calls and function calls directly. In\
    \ the earlier versions, you can only array deference with the use of a temporary\
    \ variable. Since PHP 5.5, you can already array deference array literals. Then\
    \ again, take note that you cannot access array keys that have not been defined\
    \ just as you cannot access any other undefined variables. If you do, you will\
    \ get an `E_NOTICE`-level error message and a `NULL` output.\n\nWhen it comes\
    \ to creating or modifying arrays using square bracket syntax, you can explicitly\
    \ set values in them. You can do this by assigning values to the arrays. The keys\
    \ should be specified in brackets or omitted to result in empty brackets `[]`.\
    \ If you wish to change a value, you can assign another value to the element through\
    \ its key. If you wish to remove a value pair or key, you can use the `unset()`\
    \ function.\n\nHowever, the array cannot be re-indexed. If you wish to remove\
    \ and shift, you can use the `array_values()` function to.\n\n## Some of the Most\
    \ Used Array Functions\n\n- `asort`: it sorts arrays as well as maintains index.\n\
    - `arsort`: it sorts arrays in reverse order as well as maintains index.\n- `array`:\
    \ it creates arrays\n- `compact`: it creates arrays that contain variables\n-\
    \ `current`: it returns the current elements in arrays\n- `each`: it returns the\
    \ current keys and value pairs from arrays as well as advances the array\n- `end`:\
    \ it sets internal pointers to their last elements\n- `extract`: it imports variables\
    \ into their current symbol tables.\n- `in_array`: it verifies if values exist\
    \ in arrays\n- `key_exists`: it is another name for `array_key_exists`\n- `ksort`:\
    \ it sorts arrays by key\n- `krsort`: it sorts arrays by key but in reverse order\n\
    - `key`: it fetches keys from arrays\n- `list`: it assigns variables like they\
    \ were arrays\n- `natsort`: it sorts arrays through a natural order\n- `natcasesort`:\
    \ it sorts arrays a natural order algorithm that is not case sensitive\n- `next`:\
    \ it advances internal array pointers\n- `prev`: it rewinds internal array pointers\n\
    - `pos`: it is another term for `current`\n- `range`: it creates arrays that contain\
    \ a wide variety of elements\n- `rsort`: it sorts arrays in reverse order\n- `reset`:\
    \ it sets internal pointers to their first element\n- `shuffle`: it shuffles arrays\n\
    - `sort`: it sorts arrays\n- `sizeof`: it is another term for `count`\n- `uasort`:\
    \ it sorts arrays using user-defined comparison functions as well as maintains\
    \ index.\n- `uksort`: it sorts arrays by keys with user-defined comparison functions\n\
    - `usort`: it sorts arrays by values with user-defined comparison functions\n\
    - `array_chunk`: it splits arrays into\n- `array_combine`: it merges arrays into\n\
    - `array_count_values`: it counts every\n- `array_diff`: it calculates difference\
    \ of\n- `array_diff_assoc`: it calculates difference of\n- `array_diff_key`: it\
    \ calculates difference of\n- `array_diff_unique`: it calculates difference of\n\
    - `array_fill`: it fills arrays with\n- `array_fill_keys`: it fills arrays with\n\
    - `array_filter`: it filters arrays\n- `array_group`: it groups the array\n- `array_key_diff`:\
    \ it calculates difference of\n- `array_key_diff_assoc`: it calculates difference\
    \ of\n- `array_key_diff_key`: it calculates difference of\n- `array_key_diff_unique`:\
    \ it calculates difference of\n- `array_keys`: it returns the keys\n- `array_intersect`:\
    \ it calculates intersection\n- `array_intersect_assoc`: it calculates intersection\
    \ of\n- `array_intersect_key`: it calculates intersection of\n- `array_intersect_unique`:\
    \ it calculates intersection of\n- `array_merge`: it merges arrays\n- `array_merge_recursive`:\
    \ it merges recursively\n- `array_multisort`: it sorts arrays multiple\n- `array_pop`:\
    \ it pops elements off\n- `array_pad`: it pads arrays with\n- `array_product`:\
    \ it calculates the product\n- `array_rand`: it randomly chooses one\n- `array_push`:\
    \ it pushes at least one\n- `array_reduce`: it iteratively reduces\n- `array_replace`:\
    \ it replaces the array\n- `array_shift`: it shifts elements off the start\n-\
    \ `array_slice`: it extracts part of\n- `array_splice`: it removes part of\n-\
    \ `array_sum`: it calculates the sum of\n- `array_unique`: it eliminates duplicate\
    \ values\n- `array_values`: it returns the value\n- `array_unshift`: it prepends\
    \ at least one to the start\n- `array_walk`: it applies functions supplied by\
    \ user to each member of the array\n\n# \n\nChapter 5: Conditional Statements\n\
    \nConditional statements are used for performing various actions for various conditions.\
    \ Oftentimes, when you write a code, you aim to perform actions for specific purposes.\
    \ In PHP, you can use these conditional statements:\n\n- `switch`: it lets you\
    \ choose a block of code to execute\n- `if`: it lets you execute a code if the\
    \ condition is true\n- `if...else...else`: it lets you specific a new condition\
    \ for testing if the previous condition is false\n- `if...else`: it lets you execute\
    \ a code if the condition is true, and another one if it is false\n\n## The If\
    \ Statement\n"
