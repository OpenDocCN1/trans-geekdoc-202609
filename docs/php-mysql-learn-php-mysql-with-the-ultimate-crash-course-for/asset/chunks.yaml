    ## Chapter 1: Introduction to PHP

    PHP stands for `PHP: Hypertext Preprocessor`, an open source scripting language
    whose scripts are executed on the server. It is downloadable and available for
    free. It is ideal for web development and recommended for beginners. It can be
    embedded into `HTML`. In addition, it can be used for `WordPress` and `Facebook`.


    A `PHP` file can contain `HTML`, `JavaScript`, `CSS`, `PHP` code, and text. What
    differentiates `PHP` from client-side `JavaScript` is that the codes are executed
    on the server, which generates the `HTML` that is sent to the client. After running
    the script, the client receives the results even if he does not know the underlying
    code. It is possible to configure the web server for the purpose of processing
    `HTML` files using `PHP`.


    PHP is simple enough to be understood by newbies, but it also offers a lot of
    advanced features for advanced programmers. You can even start writing simple
    scripts within just a few hours. Note that although its creation is focused on
    server-side scripting, there is so much more you can do with it.


    ## Why You Should Learn PHP

    You may think that learning PHP is no longer necessary if you are adept at using
    `JavaScript`. However, `JavaScript` is actually much limited compared to `PHP`.
    `JavaScript` runs in the client or browser, which means that it only knows what
    occurs in your browser and the websites that you visit.


    On the other hand, `PHP` runs on the same computer or server as the website that
    you go to. It has access to every file and information on that computer, which
    enables it to create custom `HTML` pages that it sends to your browser, run tasks,
    perform calculations, and handle cookies from that website.


    PHP can open, create, write, read, close, and delete files on the server. It can
    generate page content, collect form data, and send and receive cookies. It can
    also delete, add, and modify data in the database. In addition, it can encrypt
    data as well as control user access.


    With `PHP`, you can output `PDF` files, images, and Flash movies. You are not
    limited to just `HTML`. You can even output texts, such as `XML` and `XHTML`.
    In other words, `PHP` can practically do anything. Since it is focused on server-side
    scripting, it can do anything that other `CGI` programs can do and more.


    `PHP` scripts are mainly used in the following areas:


    - Server-side scripting.

    - Command line scripting.

