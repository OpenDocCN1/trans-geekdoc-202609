    ## 引言

    感谢你的下载，并祝贺你下载了`PHP: Learn PHP and MySQL with the Ultimate Beginners Crash Course
    In No Time!`。这本书包含了关于如何使用正确的语法和关键词创建代码的经过证明步骤和策略。它还提供了如何正确使用数组和条件语句的提示。为了充分利用其应用作用，你还将学习如何执行数学运算。你也将学习如何打开、读取、写入和关闭文件。书中包含示例程序，可以作为你编写代码时的指南。本书还包含了关于
    `MySQL` 和 `PHP` 的有用信息，包括它们的特性，甚至讨论了 `MySQL` 和 `PostgreSQL` 之间的差异。再次感谢下载！本文旨在就涵盖的主题提供准确且可靠的信息。本书的销售基于以下理念：出版者不承担渲染、官方许可或其他形式的责任。


    ## 第 1 章：PHP 简介

    PHP 代表 `PHP: Hypertext Preprocessor`（超文本预处理器），是一种开源脚本语言，其脚本在服务器上执行。它可以免费下载并使用。它是
    Web 开发的理想选择，推荐初学者学习。它可以嵌入 `HTML` 中。此外，它还可以用于 `WordPress` 和 `Facebook`。


    一个 `PHP` 文件可以包含 `HTML`、`JavaScript`、`CSS`、`PHP` 代码和文本。`PHP` 与客户端 `JavaScript`
    的区别在于代码是在服务器上执行的生成发送给客户端的 `HTML`。运行脚本后，即使客户端不知道底层代码也能收到结果。可以配置 Web 服务器使用 `PHP`
    处理 `HTML` 文件。


    PHP 简单到初学者也能理解，但它也为高级程序员提供了许多高级特性。你甚至可以在几小时内开始编写简单的脚本。请注意，尽管它的创建重点是服务器端脚本，但你可以用它做更多事情。


    ## 为什么你应该学习 PHP

    你可能认为，如果你精通使用 `JavaScript`，那么学习 PHP 就不不再了。然而，与 `PHP` 相比，`JavaScript` 实际上限制大得多。`JavaScript`
    运行在客户端或浏览器中，这意味着它只知道你浏览器中发生的情况以及你访问的网站。


    另一方面，`PHP` 运行在你访问的网站所在的计算机或服务器上。它可以访问该计算机上的每个文件和信息，这使其能够创建发送到浏览器的自定义 `HTML` 页面、运行任务、执行计算并处理该网站的
    cookie。


    PHP 可以在服务器上打开、创建、写入、读取、关闭和删除文件。它可以生成页面内容、收集表单数据并发送和接收 cookie。它还可以删除、添加和修改数据库中的数据。此外，它可以加密数据以及控制用户访问。


    通过 `PHP`，你可以输出 `PDF` 文件、图像和 Flash 电影。你不局限于 `HTML`。你甚至可以输出文本，例如 `XML` 和 `XHTML`。换句话说，`PHP`
    实际上可以做任何事情。由于它专注于服务器端脚本，它可以完成任何其他 `CGI` 程序能做的事情以及更多。


    `PHP` 脚本主要用于以下领域：


    - 服务器端脚本。

    - 命令行脚本。


