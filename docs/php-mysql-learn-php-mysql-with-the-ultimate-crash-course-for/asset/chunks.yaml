    \ at your program after a few years, your comments can be helpful. They can remind\
    \ you about your thoughts during the time when you created your code.\n\nConsider\
    \ the following example:\n\n<?php\n\n\\# This is a single line comment\n\n//This\
    \ is a single line comment\n\n/\\* \n\nThis is a \n\nmultiple line \n\ncomment\n\
    \n\\*/\n\n//This is a comment that leaves out a part of a code line\n\n$w = 2\
    \ /\\* + 10 \\*/ + 3;\n\necho $w;\n\n?>\n\nIf you run this code, you will get\
    \ an output of:\n\n5\n\n## Case Sensitivity\n\nFunctions, keywords, and classes\
    \ are not case sensitive in PHP. \n\nConsider this example:\n\n<?php\n\necho “Testing\
    \ code ”;\n\nECHO “Testing code ”;\n\nEcHo “Testing code ”;\n\n?>\n\nIf you run\
    \ this code, you will get an output of:\n\nTesting code Testing code Testing code\n\
    \nHowever, variable names are case sensitive in PHP.\n\nTake a look at this example:\n\
    \n<?php\n\n$color = “blue”;\n\necho “The sky is ” . $color . “\\\\n“;\n\necho\
    \ “The sky is “ . $coLOR . “\\\\n“;\n\necho “The sky is “ . $COLOR . “\\\\n“;\n\
    \n?>\n\nIf you run this code, you will get an output of:\n\nThe sky is blue \n\
    \nThe sky is \n\nThe sky is\n\nIf you notice, the first statement is the only\
    \ one that displays the value of the variable $color. This is because $color,\
    \ $coLOR, and $COLOR are treated as different variables.\n\n## New Line\n\nTo\
    \ create a new line, you simply have to place \\\\n after your statement.\n\n\
    Take a look at this example:\n\n<?php\n\necho “The sky is blue. \\\\n“;\n\necho\
    \ “The rose is red. \\\\n“;\n\n?>\n\nIf you run this code, you will get an output\
    \ of:\n\nThe sky is blue.\n\nThe rose is red.\n\n## Dealing with Forms\n\nAmongst\
    \ the greatest advantages of PHP is that it can deal with HTML forms. Take note\
    \ that form elements are automatically available in PHP scripts.\n\n# \n\nChapter\
    \ 4: Arrays \n\nAn array is a special variable that stores multiple values one\
    \ at a time. It is basically a list of items. For instance, if you want to store\
    \ a list of names, you can store them in single variables such as:\n\n$name1 =\
    \ “Wendy”;\n\n$name2 = “Dawn”;\n\n$name3 = “David”;\n\nHowever, if you want to\
    \ create a loop through these names, you need an array. Arrays can hold numerous\
    \ values in one name and allow you to access these values when you refer to an\
    \ index number.\n\nTo put it in a much simpler perspective, an array is like a\
    \ grocery list. It lets you store more than one item in one variable. When you\
    \ create your grocery list, you can use separate pieces of paper for every item\
    \ that you have to buy. These items are like the variables that you store.\n\n\
    Using separate pieces of paper for your grocery items is unnecessary though. It\
    \ is such a hassle and a total waste of paper. So, instead of doing this, you\
    \ can just write down everything you need to buy in a single piece of paper. This\
    \ single piece of paper is just like an array.\n\n## How to Create an Array\n\n\
    The array ( ) function in PHP is used to create arrays. Any number of comma-separated\
    \ key => value pairs can be used as arguments. For instance,\n\narray (\n\n             \
    \ key1 => value1,\n\nkey2 => value2,\n\n…\n\n)\n\nThe last array may or may not\
    \ have a comma. Single-line arrays are actually better off without commas. So\
    \ instead of writing array (1, 2, ), you should write array (1, 2). Multi-line\
    \ arrays, however, are preferred to have trailing commas because they make the\
    \ addition of new elements easier.\n\nThere are actually three types of arrays:\
    \ associative, indexed, and multidimensional. Associative arrays are arrays that\
    \ have named keys. Indexed arrays are arrays that have a numeric index. Multidimensional\
    \ arrays are arrays that contain one or more arrays.\n\nThe syntax for associative\
    \ arrays is:\n\narray (key => value, key => value, etc.);\n\nFor example:\n\n\
    <?php\n\n$price = array (“cantaloupes” => “2”, “grapes” => “3”, “strawberries”\
    \ => “4”);\n\necho “Cantaloupes cost “ . $price \\[‘oranges’\\] . “dollars each.”;\n\
    \n?>\n\nThe syntax for index arrays is:\n\narray (value1, value2, etc.);\n\nThere\
    \ are two ways on how you can write indexed arrays. You can allow the index to\
    \ be automatically assigned or assign it manually.\n\nTake a look at this example\
    \ of an automatically assigned index:\n\n$fruits = array (“apples”, “bananas”,\
    \ “kiwis”);\n\nAnd here is an example of a manually assigned index:\n\n$fruits\
    \ \\[0\\] = “apples”;\n\n$fruits \\[1\\] = “bananas”;\n\n$fruits \\[2\\] = “kiwis”;\n\
    \nAs for multidimensional array, here is an example of a two-dimensional array:\n\
    \n<?php\n\n$fruits = array (\n\narray (“apples”, 10, 6),\n\narray (“bananas”,\
    \ 4, 5),\n\narray (“kiwis”, 11, 10)\n\n);\n\n?>\n\nIn PHP 5.4, array ( ) can be\
    \ replaced with \\[ \\]. This is called the short array syntax. For example:\n\
    \n<?php\n\n$name = array (\n\n              “Wendy” => “Dawn”,\n\n             \
    \ “Dawn” => “Wendy”,\n\n);\n\ncan be written like this if you are using PHP 5.4:\n\
    \n<?php\n\n$name = \\[\n\n              “Wendy” => “Dawn”,\n\n              “Dawn”\
    \ => “Wendy”,\n\n\\];\n\n?>\n\nA string or an integer can be the key. The value\
    \ can also be of any type. In addition, these key casts are expected to occur:\n\
    \nFloat. It is cast to an integer, truncating the fractional part. For example,\
    \ the key 9.7 is going to be stored under 9."
