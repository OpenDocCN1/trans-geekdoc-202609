  trans: "\n\n`String`。包含有效整数的字符串会被转换为整数类型。例如，键 `9` 将被存储在 `9` 下，而键 `09` 不会被转换，因为它不是有效的十进制整数。\n\
    \n`Bool`。它也会转换为整数。例如，键 `false` 将被存储在 `0` 下，而键 `true` 将被存储在 `1` 下。\n\n`Null`。它被转换为空字符串。例如，键\
    \ `null` 将被存储在 `\" \"` 下。\n\n对象和数组永远不能用键。如果你尝试将它们用键，将得到一个非法偏移类型警告。\n\n如果你声明了多个具有相同键的元素，最后一个将使用使用，而其他的将被覆盖。\n\
    \n考虑以下示例：\n\n```php\n<?php\n$array = array (\n    1 => \"w\",\n    \"1\" => \"\
    x\",\n    1.5 => \"y\",\n    true => \"z\",\n);\n\nvar_dump ($array);\n?>\n```\n\
    \n如果你运行这段代码，你将得到如下输出：\n\n```text\narray (1) {\n    [1] =>\n    string (1) \"z\"\
    \n}\n```\n\n这是结果输出，因为所有的键都被转换成了 `1`。对于每一个新元素，值都会被覆盖，这就是为什么留下了值 `\"z\"`。PHP 数组中可以同时包含字符串键和整数键，因为\
    \ PHP 无法区分关联数组和索引数组。\n\n## 方括号语法\n\n数组 `[key]` 语法可以用于访问数组元素。如果你想访问数组元素，大括号和方括号可以交替使用。从\
    \ PHP 5.4 开始，你可以直接对方法调用和函数调的结果进行数组引用。在较早的版本中，你只能使用临时变量进行数组引用。从 PHP 5.5 开始，你已经可以对数组字面量进行数组引用。再次注意，你不能访问未定义的键，就像你不能访问任何未定义的变量一样。如果你这样做，将得到一个\
    \ `E_NOTICE` 级别的错误消息和 `NULL` 输出。\n\n当使用方括号语法创建或修改数组时，你可以显式地在它们中设置值。你可以通过给数组赋值来实现这一点。键应该在括号中指定，或者省略产生空括号\
    \ `[]`。如果你想更改一个值，可以通过其键为元素分配另一个值。如果你想删除一个键值对或键，可以使用 `unset()` 函数。\n\n然而，数组不能重新索引。如果你想删除并移动，可以使用\
    \ `array_values()` 函数。\n\n## 一些常用的数组函数\n\n- `asort`：它对数组排序并保持索引。\n- `arsort`：它反序对数组排序并保持索引。\n\
    - `array`：它创建数组\n- `compact`：它创建包含变量的数组\n- `current`：它返回数组中的当前元素\n- `each`：它从数组返回当前的键和值对，并移动数组。\n\
    - `end`：它将内部指针设置为最后一个元素。\n- `extract`：它将变量导入到当前的符号表中。\n- `in_array`：它验证值是否存在于数组中\n\
    - `key_exists`：它是 `array_key_exists` 的另一个名字。\n- `ksort`：它按键对数组排序。\n- `krsort`：它按键对数组排序，但是反序的。\n\
    - `key`：它从数组获取键。\n- `list`：它像处理数组一样分配变量。\n- `natsort`：它通过自然顺序对数组排序。\n- `natcasesort`：它按不区分大小的自然排序算法对数组排序。\n\
    - `next`：它移动内部数组指针。\n- `prev`：它回溯内部数组指针。\n- `pos`：它是 `current` 的另一个术语。\n- `range`：它创建包含各种元素的数组。\n\
    - `rsort`：它反序对数组排序。\n- `reset`：它将内部指针设置为第一个元素。\n- `shuffle`：它打乱数组。\n- `sort`：它对数组排序。\n\
    - `sizeof`：它是 `count` 的另一个术语。\n- `uasort`：它使用用户定义的比较函数对数组排序并保持索引。\n- `uksort`：它使用用户定义的比较函数按键排序数组。\n\
    - `usort`：它使用用户定义的比较函数按值排序数组。\n- `array_chunk`：它将数组分割为\n- `array_combine`：它将数组合并为\n\
    - `array_count_values`：它统计每个\n- `array_diff`：它计算差集\n- `array_diff_assoc`：它计算差集\n\
    - `array_diff_key`：它计算差集\n- `array_diff_unique`：它计算差集\n- `array_fill`：它用...填充数组\n\
    - `array_fill_keys`：它用...填充数组\n- `array_filter`：它过滤数组\n- `array_group`：它分组数组\n\
    - `array_diff`：它计算差集\n- `array_diff_assoc`：它计算差集\n- `array_diff_key`：它计算差集\n-\
    \ `array_diff_unique`：它计算差集\n- `array_keys`：它返回键\n- `array_intersect`：它计算交集\n\
    - `array_intersect_assoc`：它计算关联交集\n- `array_intersect_key`：它计算键交集\n- `array_intersect_unique`：它计算唯一交集\n\
    - `array_merge`：它合并数组\n- `array_merge_recursive`：它递归合并\n- `array_multisort`：它对多个数组排序\n\
    - `array_pop`：它弹出最后一个元素\n- `array_pad`：它用...填充数组\n- `array_product`：它计算乘积\n- `array_rand`：它随机选择一个\n\
    - `array_push`：它推送至少一个\n- `array_reduce`：它迭代减少\n- `array_replace`：它替换数组\n- `array_shift`：它从头部移动元素\n\
    - `array_slice`：它截取部分\n- `array_splice`：它删除部分\n- `array_sum`：它计算和\n- `array_unique`：它消除重复值\n\
    - `array_values`：它返回值\n- `array_unshift`：它在开头前置至少一个一个\n- `array_walk`：它将用户提供的函数应用到数组的每个成员\n\
    \n# 第 5 章：条件语句\n\n条件语句用于根据不同的条件执行各种操作。通常，当你编写代码时，目标是针对特定目的执行操作。在 PHP 中，你可以使用这些条件语句：\n\
    \n- `switch`：它让你选择一个要执行的代码块。\n- `if`：如果条件为真，它让你执行代码。\n- `if...else...else`：如果上一个条件为假，它让你指定一个新的测试条件。\n\
    - `if...else`：如果条件为真，它让你执行一段代码，如果为假，则执行另一个。\n\n## if 语句\n\n"
- fmt: "\nAs mentioned above, the `if` statement lets you execute a code if your condition\
    \ is found to be true. Its syntax is:\n\n```\nif (condition)\n{\n    block of\
    \ code;\n}\n```\n\nTake a look at the following example:\n\n```php\n<?php\n$time\
    \ = date (“Hour”);\nIf ($time < “10”)\n{\n    echo “Good morning!”;\n}\n?>\n```\n\
    \nIf you run this code, you will get an output of:\n\nGood morning!\n\nif and\
    \ only if the hour or time is less than 10.\n\n## The If… Else Statement\n\nYou\
    \ can use the `if… else` statement to execute a code when the condition is found\
    \ to be true, and then another code when the condition is found to be false. Its\
    \ syntax is:\n\n```\nif (condition)\n{\n    block of code to execute if the condition\
    \ is true;\n}\nelse \n{\n    block of code to execute if the condition is false;\n\
    }\n```\n\nConsider the following example:\n\n```php\n<?php\n$time = date (“Hour”);\n\
    if ($time < “10”)\n{\n    echo “Good morning!”;\n}\nelse\n{\n    echo “Good afternoon!”;\n\
    }\n?>\n```\n\nIf you run this code, you will get an output of:\n\nGood morning!\n\
    \nif the time is less than 10. Otherwise, you will get an output of:\n\nGood afternoon!\n\
    \n## The If… Else if… Else Statement\n\nThis statement is used to specify new\
    \ conditions to test if the first condition is found to be false. Its syntax is:\n\
    \n```\nif (condition)\n{\n    block of code to execute if the condition is true;\n\
    }\nelse if (condition)\n{\n    block of code to execute if the condition is true;\n\
    }\nelse \n{\n    block of code to execute if the condition is false;\n}\n```\n\
    \nTake a look at the following example:\n\n```php\n<?php\n$time = date (“Hour”);\n\
    if ($time < “10”)\n{\n    echo “Good morning!”;\n}\nelse if ($time < “20”)\n{\n\
    \    echo “Good afternoon!”;\n}\nelse\n{\n    echo “Good night!”;\n}\n?>\n```\n\
    \nIf you run this code, you will get an output of:\n\nGood morning!\n\nif the\
    \ time is less than 10. You will get an output of:\n\nGood afternoon!\n\nif the\
    \ time is less than 20. Otherwise, you will get an output of:\n\nGood night!\n\
    \n## The Switch Statement\n\nIt is used to perform actions depending on the given\
    \ conditions. In PHP, there are many blocks of codes you can use `switch` to choose\
    \ a specific block of code you want to execute. Its syntax is:\n\n```\nswitch\
    \ (name) {\n    case label 1:\n        block of code if name = label 1;\n    \
    \    break;\n    case label 2:\n        block of code if name = label 2;\n   \
    \     break;\n    …\n    default:\n        block of code if name is different\
    \ from all the labels;\n}\n```\n\n## The Break Statement\n\n`Break` is used to\
    \ prevent the block of code from automatically running into the succeeding `case`.\
    \ `Default` is used if a match is not found. Consider the following example:\n\
    \n```php\n<?php\n$color = “pink”;\nswitch ($color)\n{\n    case “pink”:\n    \
    \    echo “The color of the shirt is pink!”;\n        break;\n    case “yellow”:\n\
    \        echo “The color of the shirt is yellow!”;\n        break;\n    case “purple”:\n\
    \        echo “The color of the shirt is purple!”;\n        break;\n    default:\n\
    \        echo “The color of the shirt is neither pink, yellow, nor purple!”;\n\
    }\n?>\n```\n\nIf you run this code, you will get an output of:\n\nThe color of\
    \ the shirt is pink!\n\nWhen writing your code, it is always a good idea to include\
    \ a `default` case in your `switch` statements. Take note that the word `case`\
    \ is not present before the word `default` because `default` is a special keyword.\n\
    \n## The Continue Statement\n\n`Continue` is used to stop the current iteration\
    \ of a loop. It halts, but does not terminate it. It is also placed inside the\
    \ statement block that contains the code which the loop executes, just like `break`.\
    \ It is preceded by the conditional test. In a pass encountering `continue` statement,\
    \ the next pass begins while skipping the rest of the loop code. For example:\n\
    \n```php\n<?php\n$array = array (2, 4, 6, 8, 10);\nforeach ($array as $value)\n\
    {\n    if ($value ==4) continue;\n    echo “The value is $value <br/>”;\n}\n?>\n\
    ```\n\nIf you run this code, you will get an output of:\n\nThe value is 2\nThe\
    \ value is 4\nThe value is 6\nThe value is 10\n\nIn the above example, the loop\
    \ displays the value of the array. When the condition becomes true, however, it\
    \ skips the code and prints the next value.\n\n# Chapter 6: Numbers and Mathematical\
    \ Operations\n\nThe data types `integer` and `float` are numbers and can be stored\
    \ in variables.\n\nFor example:\n\n```\n$intvar = 5;\n$floatvar = 11.4;\n```\n\
    \nIn PHP, values are automatically stored as the appropriate data types. You can\
    \ also perform mathematical operations. You simply have to indicate the mathematical\
    \ operations by using a mathematical operator and two numbers.\n\nFor example,\
    \ you can use the plus (`+`) sign operator:\n\n```\n2 + 3\n```\n\nYou can also\
    \ use variables:\n\n```\n$var2 + $var3;\n```\n\nIf you want to use numbers in\
    \ your mathematical operations, however, you should not enclose them in quotes\
    \ when you assign them to variables. If you use quotes, you will not be able to\
    \ perform mathematical operations on these strings.\n\nConsider the following\
    \ example:\n\n```php\n<?php\n$var1 = “2”;\n$var2 = 4;\n$total = $var1 + $var2;\n\
    ?>\n```\n\nSince `var1` is a string, PHP automatically converts strings to numbers.\
    \ Nevertheless, the numbers are added upon reaching the third statement.\n\n```php\n\
    <?php\n$var1 = “y”;\n$var2 = 4;\n$total = $var1 + $var2;\n?>\n```\n\nSince `y`\
    \ is not a number that can be converted in PHP, the result of `$total` becomes\
    \ 4. More often than not, such conversion is not what programmers expect.\n\n\
    ## Mathematical Operators\n\n- `+` represents the addition process. It is used\
    \ to add numbers.\n- `-` represents the subtraction process. It is used to subtract\
    \ the second number from the first one.\n- `*` represents the multiplication process.\
    \ It is used to multiply numbers.\n- `/` represents the division process. It is\
    \ used to divide the first number by the second number.\n- `%` is called the modulus.\
    \ It identifies the remainder when you do the division process.\n\n## The Order\
    \ of Operations\n\nIt is possible to perform multiple mathematical operations\
    \ all at once. Take a look at the following example:\n\n```\n$total = 2 + 3 *\
    \ 4 + 2;\n```\n\nKeep in mind that the order of your mathematical statement is\
    \ crucial. You may get a different output. Hence, you have to be careful when\
    \ you use mathematical operators in your code. In PHP, division and multiplication\
    \ are performed first. Then, subtraction and addition are done. Also, PHP can\
    \ start from the left towards the right if all other considerations are equal.\n\
    \nIf you run the code given above, you will get an output of:\n\n16\n"
