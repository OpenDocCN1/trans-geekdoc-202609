    \ be a programmer to become a webmaster, the answer is no. You can be a webmaster\
    \ without knowing how to program. You can create a website by manually coding\
    \ it in HTML.\n\n# \n\nChapter 3: Syntax, Comments, Case Sensitivity, New Line,\
    \ and Forms \n\n## Syntax\n\nYou can place PHP scripts anywhere in you document.\
    \ They generally begin with <?php and end with ?>:. Their file extension is .php\
    \ and they normally contain PHP scripting codes and HTML tags. Do not forget to\
    \ use a semicolon (;) to end a PHP statement.\n\nConsider the following example\
    \ of a PHP code:\n\n<?php\n\necho “Testing code”;\n\n?>\n\nIf you run this code,\
    \ you will get an output of:\n\nTesting code\n\n## Comments\n\nComments are lines\
    \ that are not executed or read as part of the program. Their sole purpose is\
    \ to be read by users who may need additional information. You can include comments\
    \ in your program if you want other people to gain a better understanding of it\
