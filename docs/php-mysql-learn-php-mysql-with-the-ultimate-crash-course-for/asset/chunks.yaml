    \ 1;\n        break;\n    case label 2:\n        block of code if name = label\
    \ 2;\n        break;\n    …\n    default:\n        block of code if name is different\
    \ from all the labels;\n}\n```\n\n## Break 语句\n\n`Break` 用于防止代码块自动运行到下一个 `case`。如果未找到匹配项，则使用\
    \ `Default`。请考虑以下示例：\n\n```php\n<?php\n$color = “pink”;\nswitch ($color)\n{\n\
    \    case “pink”:\n        echo “The color of the shirt is pink!”;\n        break;\n\
    \    case “yellow”:\n        echo “The color of the shirt is yellow!”;\n     \
    \   break;\n    case “purple”:\n        echo “The color of the shirt is purple!”;\n\
    \        break;\n    default:\n        echo “The color of the shirt is neither\
    \ pink, yellow, nor purple!”;\n}\n?>\n```\n\n如果您运行这段代码，您将得到如下输出：\n\nThe color\
    \ of the shirt is pink!\n\n在编写代码时，在 `switch` 语句中包含一个 `default` 情况始终是一个好主意。请注意，`default`\
    \ 之前没有 `case` 单词，因为 `default` 是一个特殊的关键字。\n\n## Continue 语句\n\n`Continue` 用于停止循环的当前迭代。它会停止但不终止循环。它也被放在包含循环执行代码的语句块内部，就像\
    \ `break` 一样。它的前面是条件测试。在遇到 `continue` 语句的迭代中，将在跳过循环剩余代码的情况下开始下一次迭代。例如：\n\n```php\n\
    <?php\n$array = array (2, 4, 6, 8, 10);\nforeach ($array as $value)\n{\n    if\
    \ ($value ==4) continue;\n    echo “The value is $value <br/>”;\n}\n?>\n```\n\n\
    如果您运行这段代码，您将得到如下输出：\n\nThe value is 2\nThe value is 4\nThe value is 6\nThe value\
    \ is 10\n\n在上面的示例中，循环显示数组的值。然而，当条件变为真时，它跳过了代码并打印了下一个值。\n\n# 第 6 章：数字与数学运算\n\n\
    数据类型 `integer` 和 `float` 是数字，可以存储在变量中。\n\n例如：\n\n```\n$intvar = 5;\n$floatvar\
    \ = 11.4;\n```\n\n在 PHP 中，值会自动存储为相应的数据类型。您也可以执行数学运算。您只需要通过使用数学运算符两个数字来指示数学运算即可。\n\
    \n例如，您可以使用加号 (`+`) 运算符：\n\n```\n2 + 3\n```\n\n您也可以使用变量：\n\n```\n$var2 + $var3;\n\
    ```\n\n如果您想在数学运算中使用数字，但不应将它们包含在引号中。如果您使用了引号，将无法对这些字符串执行数学运算。\n\n请考虑以下示例：\n\n```php\n\
    <?php\n$var1 = “2”;\n$var2 = 4;\n$total = $var1 + $var2;\n?>\n```\n\n由于 `var1`\
    \ 是字符串，PHP 会将其转换为数字。然而，在到达第三条语句时数字进行了相加。\n\n```php\n<?php\n$var1 = “y”;\n$var2\
    \ = 4;\n$total = $var1 + $var2;\n?>\n```\n\n由于 `y` 不是 PHP 可以转换的数字，`total` 的结果变成了\
    \ 4。通常，这种转换并不是程序员预期的。\n\n## 数学运算符\n\n- `+` 表示加法。用于数字相加。\n- `-` 表示减法。用于从第一个数字中减去第二个数字。\n\
    - `*` 表示乘法。用于数字相乘。\n- `/` 表示除法。用于用第一个数字除以第二个数字。\n- `%` 称为模。它在执行除法时识别余数。\n\n##\
    \ 运算顺序\n\n可以同时执行多个数学运算。请看以下示例：\n\n```\n$total = 2 + 3 * 4 + 2;\n```\n\n记住，您的数学语句的顺序至关重要。您可能会得到不同的输出。因此，当您在代码中使用数学运算符时必须小心。在\
    \ PHP 中，先执行除法和乘法。然后执行减法和加法。此外，在所有其他因素相等的情况下，PHP 可以从左到右开始。\n\n如果您运行上面的代码，您将得到如下输出：\n\
    \n16\n"
- fmt: "\nYou get 16 because PHP performs the multiplication process first. In `$total\
    \ = 2 + 3 * 4 + 2`, `3 * 4` is done first. So multiplying `3` by `4`, you get\
    \ `12`. Since the other operators for addition, PHP reads the code from the left.\
    \ It adds `2` to `12`, which is the result of `3 * 4`. Finally, it performs the\
    \ last addition process. `2 + 12` is `14`, and that is added to `2`, so you get\
    \ `16`.\n\nIf you want to change the order of operations, you can use parentheses.\
    \ When you use a parenthesis, whatever is inside it will be performed first. Take\
    \ a look at the following example:\n\n```php\n$total = (2 + 3) * 4 + 2;\n```\n\
    \nIf you run this code, you will get an output of:\n\n```\n22\n```\n\nYou get\
    \ 22 because `2 + 3` is performed first since they are within the parenthesis.\
    \ Adding `2` and `3` results in `5`, which is then multiplied by `4`. Your code\
    \ practically becomes `(5) * 4 + 2`. As mentioned earlier, the multiplication\
    \ and division processes are performed first by default. However, since you have\
    \ used a set of parenthesis, the operation inside it is performed first. Since\
    \ you do not have any division process to be done, multiplication is performed.\
    \ You get `20 + 2`. Finally, you perform the last addition process. Adding `20`\
    \ and `2` equals to `22`.\n\nIt is also possible to use a set of parenthesis within\
    \ another set of parenthesis. You can do this if you want to change the order\
    \ of operations within that set of parenthesis. Ideally, if your mathematical\
    \ statement has more than one answer, you should use parentheses where they are\
    \ necessary.\n\n## Increments and Decrements\n\nIn PHP, you can use a shortcut\
    \ to add 1 to a variable. Consider the following example:\n\n```php\n$counter\
    \ = $counter + 1;\n```\n\nLikewise, you can write a shorter code that performs\
    \ exactly the same operation:\n\n```php\n$counter++;\n```\n\nTake a look at this\
    \ example:\n\n```php\n$counter = 0;\n$counter++;\n$echo $counter;\n```\n\nIf you\
    \ run the above code, you will get an output of:\n\n```\n1\n```\n\nThis is because\
    \ using `++` adds `1` to your existing value for `$counter`. Similarly, you can\
    \ subtract 1 by using `--`. So if you want to subtract 1 from your existing value\
    \ for `$counter`, you just have to write `$counter--;`.\n\nThere is another shortcut\
    \ you can use to add a number to a certain variable. You can use `+=1` to add\
    \ `1` to that particular variable. You can also add any number to the variable\
    \ through this shortcut. Likewise, you can use it to subtract, divide, or multiply.\
    \ Take a look at the following example. Here are some of the statements you can\
    \ use with the same format:\n\n```php\n$counter/=2;\n$counter*=3;\n$counter-=2;\n\
    $counter+=3;\n```\n\nThe above statements add the value of `3`, subtract `2`,\
    \ multiply by `3`, and divide by `2` with reference to `$counter`.\n\n## Built-In\
    \ Higher Mathematical Functions \n\nIn PHP, you can actually perform complicated\
    \ mathematical operations, such as getting the square root of a particular number.\
    \ Take a look at this example:\n\n```php\n$rootvar = sqrt (25);\n$rootvar = srqt\
    \ ($number);\n```\n\nUsing `$rootvar = sqrt (25)`, `$rootvar = srqt ($number)`\
    \ (Note: `srqt` is likely a typo for `sqrt`), PHP provides built-in functions\
    \ to handle these operations.\n\n## Formatting Numbers\n\nIf you want to format\
    \ numbers, you can use `number_format()`. This allows you to specify the number\
    \ of decimals, the decimal separator, and the thousands separator.\n"
