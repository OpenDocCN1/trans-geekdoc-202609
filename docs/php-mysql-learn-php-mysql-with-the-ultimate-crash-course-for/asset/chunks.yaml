  trans: '

    你得到 16 是因为 PHP 先执行乘法过程。在 `$total = 2 + 3 * 4 + 2` 中，`3 * 4` 先执行。因此，将 `3` 乘以 `4`
    得到 `12`。对于其他的加法运算符，PHP 从左到右读取代码。它将 `2` 加到 `12`（即 `3 * 4` 的结果）上。最后，它执行最后一个加法过程。`2
    + 12` 等于 `14`，然后加上 `2`，所以你得到了 `16`。


    如果你想改变操作顺序，可以使用括号。当你使用括号时，括号内的任何内容都会首先执行。看下面的示例：


    ```php

    $total = (2 + 3) * 4 + 2;

    ```


    如果你运行这段代码，你将得到输出：


    ```

    22

    ```


    你得到 22 是因为 `2 + 3` 在括号内，所以它们先执行。`2` 和 `3` 相加得到 `5`，然后乘以 `4`。你的代码实际上变成了 `(5) *
    4 + 2`。如之前提到的，默认情况下先执行乘法和除法。但由于你使用了一组括号，内部的操作会先执行。由于没有需要执行的除法，因此执行了乘法。你得到 `20
    + 2`。最后，你执行最后一个加法过程。`20` 加 `2` 等于 `22`。


    在一组括号内嵌套另一组括号也是可能的。如果你想改变该括号内部的操作顺序，可以这样做。理想情况下，如果你的数学表达式有多个答案，你应该在需要的地方使用括号。


    ## 递增与递减


    在 PHP 中，你可以使用快捷方法给变量加 1。考虑以下示例：


    ```php

    $counter = $counter + 1;

    ```


    同样地，你可以编写更短的代码来执行完全相同的操作：


    ```php

    $counter++;

    ```


    看这个示例：


    ```php

    $counter = 0;

    $counter++;

    $echo $counter;

    ```


    如果你运行上述代码，你将得到输出：


    ```

    1

    ```


    这是因为使用 `++` 会向你 `$counter` 的现有值加 `1`。同样，你也可以使用 `--` 减 1。所以，如果你想从 `$counter` 的现有值中减
    1，只需编写 `$counter--;` 即可。


    还有另一个快捷方法可以给变量加上数字。你可以使用 `+=1` 给该特定变量加 `1`。你也可以通过这个快捷方法给变量加任何数字。同样，你也可以用它来进行减法、除法或乘法。看下面的示例。以下你可以使用相同格式的一些语句：


    ```php

    $counter/=2;

    $counter*=3;

    $counter-=2;

    $counter+=3;

    ```


    上述语句相对于 `$counter` 分别加上数值 `3`、减去 `2`、乘以 `3` 并除以 `2`。


    ## 内置高级数学函数


    在 PHP 中，你实际上可以执行复杂的数学运算，例如获取数字的平方根。看这个示例：


    ```php

    $rootvar = sqrt (25);

    $rootvar = srqt ($number);

    ```


    使用 `$rootvar = sqrt (25)` 和 `$rootvar = srqt ($number)`（注意：`srqt` 可能是 `sqrt` 的拼写错误），PHP
    提供了内置函数来处理这些操作。


    ## 数字格式化


    如果你想格式化数字，可以使用 `number_format()`。这允许你指定小数位数、小数点分隔符和千分位分隔符。

