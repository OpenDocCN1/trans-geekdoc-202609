- fmt: "\nEven if you do not have a browser or a server, you can still run PHP. You\
    \ just need to have a PHP parser. It is recommended for scripts that are executed\
    \ regularly using Task Scheduler for Windows or `cron` for Linux. You can also\
    \ use these scripts for simple text processing.\n\n### Creating desktop applications\n\
    \nWhile it is true that PHP is not the number one choice for creating desktop\
    \ applications with graphical user interfaces, you can still use it if you want\
    \ to include advanced features in your applications. You can use `PHP-GTK` to\
    \ create such client-side applications. Also, you can write cross-platform applications.\
    \ `PHP-GTK` is actually a PHP extension and it is not available in the primary\
    \ distribution.\n\nYou can use PHP on any major operating system, including Unix,\
    \ Linux, Microsoft Windows, RISC OS, and Mac OS X. PHP is also supported by majority\
    \ of the web servers that are popular today, such as `Apache` and `IIS`. Any web\
    \ server that can use `FastCGI` PHP binary, such as `nginx` and `lighttpd` can\
    \ also use PHP. PHP can serve as a CGI processor or a module.\n\nYou are free\
    \ to choose any web server and operating system with PHP. Moreover, you can choose\
    \ object oriented programming, procedural programming, or a combination of both.\
    \ PHP can autogenerate your files and save them in your file system rather than\
    \ printing them out.\n\nOne of the main advantages of PHP is that it supports\
    \ a variety of databases. It is very easy to write a database-enabled web page\
    \ using a database specific extension or an abstraction layer, such as `PDO`.\
    \ You can also connect to a database that supports the Open Database Connection\
    \ standard through the `ODBC` extension.\n\nWhat’s more, PHP has support for communication\
    \ with other services via protocols such as `IMAP`, `LDAP`, `SNMP`, `POP3`, `NNTP`,\
    \ `COM`, and `HTTP`. You can even interact and open raw network sockets using\
    \ a protocol of your choice. PHP supports Java installation as well as `WDDX`\
    \ data exchange between all programming languages.\n\nPHP also features text processing,\
    \ including Perl Compatible Regular Expressions and other tools for parsing and\
    \ accessing XML files. PHP standardizes XML extensions as well as adds `XML Reader`,\
    \ `XML Writer`, and `Simple XML` support. PHP also has added `PECL` extensions,\
    \ such as `XDebug`.\n\n# Setting Up PHP on Your Computer\n\nIn order to begin\
    \ using PHP, you have to look for a web host that supports `MySQL` and PHP. You\
    \ can also install a web server and then install `MySQL` and PHP. However, if\
    \ your server already supports PHP, then you no longer have to do the above instructions.\
    \ You simply have to create `.php` files and put them in your direction. The server\
    \ will then parse them automatically. There is no more need for you to compile\
    \ or install anything. Majority of the web hosts today actually support PHP because\
    \ it is free.\n\n# Chapter 2: MySQL \n\n`MySQL` is an open source Relational Database\
    \ Management System (RDBMS) that is available for free. It makes use of Structured\
    \ Query Language (`SQL`), which is the most commonly used language for accessing,\
    \ managing, and adding content in databases. It is also known for its proven reliability,\
    \ quick processing, flexibility, and ease of use. `MySQL` is a crucial part of\
    \ nearly every open source PHP application. Some of the most popular PHP/MySQL-based\
    \ scripts include `Joomla`, `phpBB`, and `osCommerce`.\n\n## So What Is MySQL\
    \ Exactly?\n\nTo understand what `MySQL` is, you have to know what a computer\
    \ database is. Essentially, a computer database is a collection of data. `MySQL`\
    \ and other specialized database software are simply programs that allow users\
    \ to access, manage, and add content in databases.\n\n`MySQL` and other specialized\
    \ database software are simply programs that allow users to access, manage, and\
    \ add content in databases.\n\n`MySQL` and other specialized database software\
    \ are simply programs that allow users to access, manage, and add content in databases.\n\
    \nSpecialized database software for retrieval.\n\nSpecialized database software\
    \ for retrieval.\n\nSpecialized database software for retrieval.\n\nSpecialized\
    \ database software for retrieval.\n\nSpecialized database software for retrieval.\n\
    \nSpecialized database software for retrieval.\n\n`MySQL` database system.\n\n\
    `MySQL` database management system.\n\n`MySQL` database servers.\n\n` MySQL vs.\
    \ servers\n\n"
