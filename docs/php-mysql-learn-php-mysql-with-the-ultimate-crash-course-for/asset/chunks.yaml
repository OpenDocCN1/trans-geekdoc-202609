    \ empty string. For example, the key null is going to be stored under “ “.\n\n\
    Objects and arrays can never be used as keys. If you try to use them as keys,\
    \ you will get an illegal offset type warning.\n\nIf you declare multiple elements\
    \ with the same key, the last one is going to be used while the others are going\
    \ to be overwritten.\n\nConsider the following example:\n\n<?php\n\n$array = array\
    \ (\n\n              1 => “w”,\n\n              “1” => “x”,\n\n              1.5\
    \ => “y”,\n\n              true => “z”,\n\n);\n\nvar\\_dump ($array);\n\n?>\n\n\
    If you run this code, you will get an output of:\n\narray (1)  {\n\n             \
    \ \\[1\\] =>\n\n              string (1) “z”\n\n}\n\nThis is the resulting output\
    \ because all the keys are cast to 1. For every new element, the value is overwritten,\
    \ which is why the value “z” is left. String and integer keys can be contained\
    \ in PHP arrays all at once since PHP cannot differentiate associative and indexed\
    \ arrays.\n\n## The Square Bracket Syntax\n\nThe array \\[key\\] syntax can be\
    \ used to access array elements. Both curly braces and square brackets can be\
    \ used interchangeably if you want to access array elements. Since PHP 5.4, you\
    \ can array deference the results of method calls and function calls directly.\
    \ In the earlier versions, you can only array deference with the use of a temporary\
    \ variable. Since PHP 5.5, you can already array deference array literals. Then\
    \ again, take note that you cannot access array keys that have not been defined\
    \ just as you cannot access any other undefined variables. If you do, you will\
    \ get an E\\_NOTICE-level error message and a NULL output.\n\nWhen it comes to\
    \ creating or modifying arrays using square bracket syntax, you can explicitly\
    \ set values in them. You can do this by assigning values to the arrays. The keys\
    \ should be specified in brackets or omitted to result in empty brackets (\\[\\\
    ]). If you wish to change a value, you can assign another value to the element\
    \ through its key. If you wish to remove a value pair or key, you can use the\
    \ unset ( ) function.\n\nHowever, the array cannot be re-indexed. If you wish\
    \ to remove and shift, you can use the array\\_values ( ) function to re-index\
    \ the array. Keep in mind that if you do not specify any key, the maximum integer\
    \ indices will be taken. This will result in the new key being the maximum value\
    \ plus one. If there are no integer indices, the key is going to be zero. The\
    \ maximum integer key does not have to exist in the array currently though. It\
    \ only has to exist in the array again after the array gets re-indexed.\n\nWhenever\
    \ you use a string literal array index, make sure that you do not forget to use\
    \ quotes. Also, you should never write $foo\\[bar\\]. Instead, you should write\
    \ $foo\\[‘bar’\\]. Even though it works, it is still wrong. If you notice, it\
    \ uses an undefined constant instead of a string. Bar is the undefined constant\
    \ while ‘bar’ is the string.\n\n## Some of the Most Commonly Used Array Functions\n\
    \narray\\_change\\_key\\_case – it changes a key’s case\n\narray\\_column – it\
    \ returns the value from a column in an input array\n\narray\\_chunk – it splits\
    \ arrays into chunks\n\narray\\_combine – it uses an array for value and another\
    \ one for keys to create an array\n\narray\\_count\\_values – it counts an array’s\
    \ values\n\narray\\_diff\\_assoc – it calculates the difference of arrays with\
    \ an added index check\n\narray\\_diff\\_uassoc – it calculates the difference\
