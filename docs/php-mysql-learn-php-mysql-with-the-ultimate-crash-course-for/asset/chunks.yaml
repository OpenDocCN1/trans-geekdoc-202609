- fmt: "\nSome of the most significant features of PostgreSQL include TOAST data compression,\
    \ parameterized and static SQL executor, improved cache management, large scalability,\
    \ asynchronous commit, and advanced cost-based optimizer. PostgreSQL has the ability\
    \ to decompress and compress data using a speedy compression scheme that allows\
    \ it to fit data into a specific disk space. Compressing data is great because\
    \ it saves disk space as well as reads data faster.\n\nSome of the core features\
    \ of MySQL include a broad ANSI SQL 99 subset and extensions, table partitioning\
    \ through `LIST`, `SET`, `HASH`, and `RANGE`, network protocol compression, built-in\
    \ replication though row-change events or statements, triggers, SSL support, cursors,\
    \ stored procedures, updateable views, and Unicode support.\n\nIf you are a webmaster\
    \ who does not write programs for your website, you may not find the differences\
    \ between MySQL and PostgreSQL to be such a big deal. Your concerns may be mainly\
    \ about your web host having database software that you need for your application.\
    \ In general, if you use CMS or any other popular software for blogging, you can\
    \ expect it to be MySQL. Nearly all commercial web hosts have MySQL as part of\
    \ their hosting packages.\n\n## Do you need to learn MySQL?\n\nAverage webmasters\
    \ do not need to study SQL or MySQL because the software they use is most likely\
    \ to do the storing and retrieving of data. They just have to learn how to use\
    \ their software. Think of MySQL and similar databases as car engines. There is\
    \ really no need for you to learn how to design car engines just to be able to\
    \ use cars. Similarly, there is no need for you to learn how to directly read\
    \ and write MySQL databases to be able to use blogging software.\n\nOn the other\
    \ hand, if you are a programmer, you need to study SQL to be able to write computer\
    \ programs that access MySQL and other SQL databases. Of course, you also need\
    \ to learn a suitable programming language. If you are wondering if you have to\
    \ be a programmer to become a webmaster, the answer is no. You can be a webmaster\
    \ without knowing how to program. You can create a website by manually coding\
    \ it in HTML.\n\n# Chapter 3: Syntax, Comments, Case Sensitivity, New Line, and\
    \ Forms\n\n## Syntax\n\nYou can place PHP scripts anywhere in you document. They\
    \ generally begin with `<?php` and end with `?>`. Their file extension is `.php`\
    \ and they normally contain PHP scripting codes and HTML tags. Do not forget to\
    \ use a semicolon (`;`) to end a PHP statement.\n\nConsider the following example\
    \ of a PHP code:\n\n```php\n<?php\necho “Testing code”;\n?>\n```\n\nIf you run\
    \ this code, you will get an output of:\nTesting code\n\n## Comments\n\nComments\
    \ are lines that are not executed or read as part of the program. Their sole purpose\
    \ is to be read by users who may need additional information. You can include\
    \ comments in your program if you want other people to gain a better understanding\
    \ of it or you want to be reminded of what you did. In case you decide to look\
    \ back at your program after a few years, your comments can be helpful. They can\
    \ remind you about your thoughts during the time when you created your code.\n\
    \nConsider the following example:\n\n```php\n<?php\n# This is a single line comment\n\
    //This is a single line comment\n/* \nThis is a \nmultiple line \ncomment\n*/\n\
    //This is a comment that leaves out a part of a code line\n$w = 2 /* + 10 */ +\
    \ 3;\necho $w;\n?>\n```\n\nIf you run this code, you will get an output of:\n\
    5\n\n## Case Sensitivity\n\nFunctions, keywords, and classes are not case sensitive\
    \ in PHP. \n\nConsider this example:\n\n```php\n<?php\necho “Testing code ”;\n\
    ECHO “Testing code ”;\nEcHo “Testing code ”;\n?>\n```\n\nIf you run this code,\
    \ you will get an output of:\nTesting code Testing code Testing code\n\nHowever,\
    \ variable names are case sensitive in PHP.\n\nTake a look at this example:\n\n\
    ```php\n<?php\n$color = “blue”;\necho “The sky is ” . $color . \"\\n“;\necho “The\
    \ sky is “ . $coLOR . \"\\n“;\necho “The sky is “ . $COLOR . \"\\n“;\n?>\n```\n\
    \nIf you run this code, you will get an output of:\nThe sky is blue \nThe sky\
    \ is \nThe sky is\n\nIf you notice, the first statement is the only one that displays\
    \ the value of the variable `$color`. This is because `$color`, `$coLOR`, and\
    \ `$COLOR` are treated as different variables.\n\n## New Line\n\nTo create a new\
    \ line, you simply have to place `\\n` after your statement.\n\nConsider the following:\n\
    \n```php\n<?php\necho “The sky is \\n“;\necho “The rose is \\n“;\n?>\n```\n\n\
    If you run this code, you will get an output of:\nThe sky is\nThe rose is\n\n\
    ## Dealing with Forms\n\nAmong the greatest advantages of PHP is that it can deal\
    \ with forms.\n\n# Chapter 4: Arrays\n\nAn array is a special variable that can\
    \ hold multiple values. For instance, you can store more than one item in an array.\n\
    \n```php\n$name1 = “Wendy”;\n$name2 = “Dawn”;\n```\n\n## How to Create an Array\n\
    \nThe `array() ` function is used to create arrays. Any number of arguments can\
    \ be passed. There are actually three types of arrays: associative, indexed, and\
    \ multidimensional.\n\n### Associative Arrays\n\nAssociative arrays have named\
    \ keys. The syntax for associative arrays is `array(key => value)`. For example:\n\
    \n```php\n<?php\n$price = array (“cantaloupes” => “2”, “grapes” => “3”, “strawberries”\
    \ => “4”);\necho “Cantaloupes cost “ . $price['oranges'] . “dollars each.”;\n\
    ?>\n```\n\n### Indexed Arrays\n\nIndexed arrays have numeric index. The syntax\
    \ for index arrays is `array(value1, value2)`. There are two ways on how you can\
    \ write indexed arrays: you can allow the index to be automatically assigned or\
    \ assign it manually.\n\nAutomatically assigned:\n```php\n$fruits = array (“apples”,\
    \ “bananas”, “kiwis”);\n```\n\nManually assigned:\n```php\n$fruits[0] = “apples”;\n\
    $fruits[1] = “bananas”;\n$fruits[2] = “kiwis”;\n```\n\n### Multidimensional Arrays\n\
    \nMultidimensional arrays contain other arrays. Here is an example of a two-dimensional\
    \ array:\n\n```php\n<?php\n$fruits = array (\narray (“apples”, 10, 6),\narray\
    \ (“bananas”, 4, 5),\narray (“kiwis”, 11, 10)\n);\n?>\n```\n\nIn PHP 5.4, `array()`\
    \ can be replaced with `[]`. This is called the short array syntax. For example:\n\
    \n```php\n<?php\n$name = [\n    “Wendy” => “Dawn”,\n    “Dawn” => “Wendy”,\n];\n\
    ?>\n```\n\nA string or an integer can be the key. The value can also be of any\
    \ type. In addition, these key casts are expected to occur:\n\nFloat: It is cast\
    \ to an integer, truncating the fractional part. For example, the key `9.7` is\
    \ going to be stored under `9`.\n"
