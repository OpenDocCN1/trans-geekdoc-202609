    \ – it calculates the difference of arrays with a callback function\n\narray\\\
    _diff – it calculates the difference of arrays\n\narray\\_fill – it fills arrays\
    \ with values\n\narray\\_fill\\_keys – it fills arrays with values but specifies\
    \ the keys\n\narray\\_filter – it filters the elements of the array with a callback\
    \ function\n\narray\\_intersect – it calculates array intersection\n\narray\\\
    _keys – it returns the keys or key subsets of arrays\n\narray\\_key\\_exists –\
    \ it verifies if the index or key exists in an array\n\narray\\_merge – it merges\
    \ at least one array\n\narray\\_merge\\_recursive – it recursively merges at least\
    \ two arrays\n\narray\\_multisort – it sorts multi-dimensional or multiple arrays\n\
    \narray\\_pop – it pops elements off the ends of arrays\n\narray\\_pad – it pads\
    \ arrays to a specific length with values\n\narray\\_product – it calculates the\
    \ product of values\n\narray\\_rand – it randomly chooses at least one entry out\
