  trans: "\n一旦你完成对文件的修改，就必须使用函数 `fclose()`将其关闭。它需要一个文件指针作为参数。如果关闭成功，它返回 true；如果失败则返回\
    \ false。\n\n## 读取文件\n\n在使用 `fopen()` 函数打开文件后，你可以使用 `fread()` 函数对其进行读取。它需要两个参数。它从句柄引用的文件指针读取指定长度的字节。当读取到指定长度、到达文件末尾、发生套接超时或数据包可用时，它将停止读取。\n\
    \n你可以使用 `filesize()` 函数查找文件的长度。它接受文件名作为参数，并返回以字节为单位的大小。如果失败或返回读取的字符串，它会返回 false。请注意，`fread()`\
    \ 函数是从文件指针的当前位置读取的。如果你想找到文件指针的当前位置，必须使用 `ftell()` 函数。如果你想回退文件指针的位置，则必须使用 `rewind()`。\n\
    \n请看下面的示例：\n\n```php\n<?php\n$filename = \"/testfile.txt\";\n$file = fopen($filename,\
    \ \"r\");\nif ($file == false)\n{\n    echo (\"Opening File Error\");\n    exit();\n\
    }\n$filesize = filesize($filename);\n$filetext = fread($file, $filesize);\nfclose($file);\n\
    echo (\"The size of the file is $filesize bytes\");\necho(\"<pre> $text </pre>\"\
    );\n?>\n```\n\n在上面的示例中，文本文件 `testfile.txt`的内容被赋值给变量，然后作为输出显示。\n\n## 写入文件\n\n如果你想写入新文件或向现有文件追加文本，可以使用\
    \ `fwrite()` 函数。它需要两个参数来指定文件指针和要写入的数据字符串。如果你想指定写入数据的长度，可以包含第三个整数参数。尽管第三个整数参数是可选的。如果你不包含第三个参数，写入将在达到指定长度后停止。\n\
    \n`fwrite()` 函数将字符串的内容写入句柄指向的文件流。在出错时返回 false，否则返回字节数。如果你使用的是区分区分文本文件和二进制文件的系统（例如\
    \ Windows），你应该在 `fopen()` 的模式参数中包含 `'b'` 来打开文件。此外，如果句柄是以追加模式打开的，`fwrite()` 将变成原子的，除非字符串的大小超过了文件系统的块大小。你不再需要在调用\
    \ `fwrite()` 之前对资源进行 `flock()` 操作。你可以无中断地写入所有数据。\n\n请看下面的示例：\n\n```php\n<?php\n\
    $file = fopen(\"testfile.txt\", \"w\");\necho fwrite($file, \"Testing sample!\"\
    );\nfclose($file);\n?>\n```\n\n如果你运行上述代码，你将得到输出：\n\n15\n\n为什么？你得到 15 是因为 `Testing\
    \ sample!` 包括空格在内共有十五个字符。\n\n我可能让你感兴趣的其他书籍预览：\n\n[HTML：从入门到精通学者指南](http://www.amazon.com/gp/product/B00YDSJ8VC?Version=1&entries=0)\n\
    \n《HTML: Step by Step Beginners Guide to HTML》一本书将在书中提供所有必要的信息和培训，你将需要这些信息之后使用其他语言甚至更复杂的\
    \ HTML 来提升你的技能。\n\n我们之所以从 HTML 开始我们的“学习 Web 设计”系列，是因为它是世界上每个网站的核心。无论一个网站是多么基础或复杂，HTML\
    \ 始终存在那里，并且对于它的存在至关重要。\n\n为了完美理解这些材料，我们将从最基础开始学习一切。我们将进行一些练习，因为掌握编程的唯一途径就是不断的练习和学习。\n\
    \n书中的所有材料可以在一天内学完，但以后练习和提升你的技能对于成为一名优秀的程序员是至关重要的。\n\n你可以从[此处]查看/下载书籍](http://www.amazon.com/gp/product/B00YDSJ8VC?Version=1&entries=0)。\n\
    \n## Java\n\n通过这本初学者极速入门课程快速学习 Java 编程！\n\n随着智能手机和平板电脑的发展，今天的应用程序变得越来越强大。两者都被公司广泛使用，而且对初学者来说是一种友好的语言。\n\
    \n尽管 Java 作为一个平台非常流行，但合格程序员仍然短缺。无论你是 Java 的完全新手，还是已经熟悉其他语言，这本书都将提供一个坚实的基础。\n\n\
    我们之所以从 HTML 开始我们的“学习 Web 设计”系列，是因为它是世界上每个网站的核心。无论一个网站是多么基础或复杂，HTML 始终存在那里，并且对于它的存在至关重要。\n\
    \n为了完美理解这些材料，我们将从最基础开始学习一切。我们将进行一些练习，因为掌握编程的唯一途径就是不断的练习和学习。\n\n书中的所有材料可以在一天内学完，但以后练习和提升你的技能对于成为一名优秀的程序员是至关重要的。\n\
    \n你可以从[此处]查看/下载书籍](http://www.amazon.com/gp/product/B00YDSJ8VC?Version=1&entries=0)。\n\
    \n## C#\n\n通过这本初学者极速入门课程快速学习 C# 编程！\n\n如果你对 C++ 编程世界有先验知识，那么你会在 `C#`（读作 See Sharp）中发现熟悉的术语和代码结构。它与\
    \ `.NET` 框架配合工作，最初设计作为 Java 的答案。\n\n今天，两者都被公司广泛使用，而且对初学者来说是一种友好的语言。\n\n以下是你将在书内找到的一些核心课程：\n\
    \n- 理解 `C#` 程序结构\n- `C#` 编码规范\n- 精通变量和数据类型\n- 获取输入和使用类型转换\n- 算术、条件、关系和逻辑运算符\n\
    - 使用流程控制语句\n- 生成随机数\n- 以及更多！\n\n我希望你喜欢它！\n\n你可以从[此处]查看/下载书籍](http://www.amazon.com/Learn-Programming-Ultimate-Course-Beginners-ebook/dp/B010N2OLRW)。\n\
    \n## HTML5 & CSS3\n\n通过实践项目在一天内学习 CSS3 和 HTML5 并熟练掌握它们！\n\n这本书包含了关于如何使用 HTML5\
    \ 和 CSS3 设计项目的经过证明的步骤和策略。\n"
