    即使你没有浏览器或服务器，你仍然可以运行 PHP。你只需要一个 PHP 解析器。对于使用 Windows 任务计划程序或 Linux 的 `cron` 定期执行的脚本，建议使用
    PHP。你也可以使用这些脚本进行简单的文本处理。


    ### 创建桌面应用程序


    虽然 PHP 并不是创建带有图形用户界面的桌面应用程序的首选，但如果你想在应用程序中包含高级功能，仍然可以使用它。你可以使用 `PHP-GTK` 来创建此类客户端应用程序。此外，你还可以编写跨平台应用程序。`PHP-GTK`
    实际上是一个 PHP 扩展，它在主发行版中并不可用。


    你可以在任何主流操作系统上使用 PHP，包括 Unix、Linux、Microsoft Windows、RISC OS 和 Mac OS X。PHP 还支持今天大多数流行的
    Web 服务器，如 `Apache` 和 `IIS`。任何可以使用 `FastCGI` PHP 二进制文件的 Web 服务器（如 `nginx` 和 `lighttpd`）也可以使用
    PHP。PHP 可以作为 CGI 处理器或模块存在。


    你可以自由地选择任何支持 PHP 的 Web 服务器和操作系统。此外，你可以选择面向对象编程、过程化编程或两者的结合。PHP 可以自动生成你的文件并将其保存到文件系统中，而不是将其打印出来。


    PHP 的主要优势之一是它支持多种数据库。使用特定的数据库扩展或抽象层（如 `PDO`），可以非常容易地编写启用数据库支持的网页。你还可以通过 `ODBC`
    扩展连接到支持开放数据库连接标准的数据库。


    此外，PHP 支持通过 `IMAP`、`LDAP`、`SNMP`、`POP3`、`NNTP`、`COM` 和 `HTTP` 等协议与其他服务进行通信。你甚至可以使用你选择的协议进行交互并打开原始网络套接字。PHP
    还支持 Java 安装以及在所有编程语言之间的 `WDDX` 数据交换。


    PHP 还具有文本处理功能，包括 Perl 兼容正则表达式以及用于解析和访问 XML 文件的其他工具。PHP 标准化了 XML 扩展，并增加了 `XML Reader`、`XML
    Writer` 和 `Simple XML` 支持。PHP 还有增加了 `PECL` 扩展，例如 `XDebug`。


    # 在你的电脑上设置 PHP


    为了开始使用 PHP，你需要寻找支持 `MySQL` 和 PHP 的 Web 托管。你也可以先安装 Web 服务器，然后安装 `MySQL` 和 PHP。然而，如果你的服务器已经支持
    PHP，那么你就不再需要执行上述指令。你只需要创建 `.php` 文件并将它们放在你的目录中。服务器将自动解析它们。你不再需要编译或安装任何东西。今天大多数
    Web 托管实际上都支持 PHP，因为它是免费的。


    # 第 2 章：MySQL


    `MySQL` 是一个免费提供的开源关系型数据库管理系统 (RDBMS)。它利用结构化查询语言 (`SQL`)，这是访问、管理和添加数据库内容最常用的语言。它还以经过证明的可靠性、快速处理、灵活性易用性而闻名。`MySQL`
    是几乎每个开源 PHP 应用程序的关键部分。一些最流行的基于 PHP/MySQL 的脚本包括 `Joomla`、`phpBB` 和 `osCommerce`。


    ## MySQL 到底是什么？


    要理解 `MySQL` 是什么，你必须知道什么是计算机数据库。本质上，计算机数据库是数据的集合。`MySQL` 和其他专门的数据库软件只是允许用户访问、管理和添加数据库内容的程序。


