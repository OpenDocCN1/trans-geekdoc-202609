- raw: 'This system that we are looking for a number that makes the hash of the data
    start with zeros has no deeper meaning. That''s not the point either. All that
    needs to be ensured is that it is a very difficult puzzle to solve.


    To understand the meaning of mining, let''s imagine that a malicious attacker
    wants to change the transaction history. In doing so, he not only changes a transaction,
    but also the hash of the block that contains the transaction. And not only that:
    since this hash in turn becomes the first entry of the next block, he also changes
    this block and the next and the next.


    ![](Image00004.jpg)The malicious attacker would therefore have to recalculate/guess
    all the nonce numbers on his own. However, he is in competition with all the honest
    miners who have more computing power and have already found the next block or
    two.


    Analogously, we can imagine the blockchain like a big castle protected by many
    castle walls. The castle walls are like onion skins around the castle. An attacker
    (evil miner) has to overcome one wall after the other. The good miners, on the
    other hand, defend the castle and are already working on ever new castle walls
    on the inside. The attacker would have to tear down the castle walls faster than
    the good miners reinforce them.


    Analogous to the example: If the attacker solves an old block in the blockchain,
    the miners have already found several new ones.


    It is a race of computing power that the hacker will always lose against the honest
    miners. It is assumed that the community, the good miners, will always have the
    absolute majority of hashing power and can thus defeat attacks by individuals,
    companies or even entire states. This is also the solution to the double-spending
    problem.


    Therefore, the following network rule applies: The longest blockchain , or the
    blockchain with the most validated blocks, is always the "true" blockchain. Most
    of the work was done to create this blockchain.


    ![](Image00004.jpg)It is therefore possible for a person to spend money twice.
    The transactions are allocated to different blocks and sent to different miners.
    The block for which the matching nonce was found first is appended and applies
    as the consensus for the entire network.


    It can also happen that parallel chains are created for a short time, that miners
    work at different ends.


    However, one chain will always prevail, and all miners will immediately jump on
    the bandwagon with the longest chain. For this reason, a transaction is not automatically
    completed when a miner has integrated it into a block. Only when the next block
    and the block after that have also been confirmed can we be sure that we are on
    the main blockchain. For Bitcoin, this is usually three to six blocks, for other
    cryptocurrencies correspondingly more or less.


    But is this effort worthwhile for the miners at all? After all, miners have to
    buy equipment, consume electricity and maintain the equipment. Let''s take a look
    at mining from the miner''s perspective.


    When guessing the nonce numbers, which is also referred to as solving the block
    , the miners all work simultaneously and all against each other. The miner who
    finds the correct number first and thus completely solves the current block receives
    the entire transaction fees . ( Transaction fees ).


    The other miners go away empty-handed. After that, all the miners immediately
    rush to the next block and start looking for the right nonce.


    ![](Image00041.jpg)But that''s not all: in addition to the transaction fees, the
    miner who solves the block receives a reward that is anchored in the programme
    code and varies depending on the cryptocurrency. This reward is called a block
    subsidy .


    Miner reward = subsidy + transaction fees


    Block Rewards = Block Subsidy+ Transaction Fees


    For Bitcoin, the initial value of the Block Subsidy is set at 50 Bitcoins per
    block found.


    About every ten minutes, 50 new bitcoins are distributed to the miners in addition
    to the transaction fees.


    We have just seen how bitcoins are generated. Bitcoins have not always existed,
    they are issued through mining and distributed to miners. But doesn''t that mean
    that Bitcoin also involves a kind of inflation? After all, new Bitcoins are created
    out of nothing. That''s exactly what should be prevented, isn''t it?


    Indeed, this would be the case if 50 bitcoins per block were always distributed,
    and that is why the Bitcoin protocol has limited the number of distributed coins.
    The number of distributed coins of 50 bitcoins per block becomes less and less
    over time. More precisely, the value is halved every 210,000 blocks. This means:
    The first 210,000 blocks of the blockchain distribute 50 Bitcoins, the next 210,000
    blocks only 25 Bitcoins per block and so on.


    Since one block is equal to 10 minutes, 210,000 blocks are pretty much equal to
    4 years.


    | Period || Block Subsidy - newly distributed coins || Total number of coins distributed
    during the period || Total number of coins distributed so far |


    | --- | --- | --- | --- |


    | 2008-2012 || 50 || 10,500,000 BTC || 10,500,000 BTC |


    | 2012-2016 || 25 || 5,250,000 BTC || 15,750,000 BTC |


    | 2016-2020 || 12,5 || 2,625,000 BTC || 18.375.000 |


    | 2020-2024 || 6,25 || 1,312,500 BTC || 19.687.500 |


    | 2024-2028 || 3,125 || 656,250 BTC || 20.343.750 |


    | … || … || … || … |


    The halving of the distribution is called halving. At the time of this writing
    (2021) the last halving took place on 11 May 2020. The block subsidy was halved
    from 12.5 to 6.25 BTC per block. The next halving is scheduled for 2024.


    So currently, every ten minutes 6.25 BTC is paid out to the person who solves
    the current block: the person who finds the matching nonce for the block.


    ![](Image00042.jpg)


    Figure 27 Total amount of all Bitcoins ever created


    We see that there is not an infinite number of bitcoins being issued, but that
    the total amount of all coins ever created is approaching the limit of just under
    21 million .


    ![](Image00004.jpg)There will never be more than 21 million Bitcoins. The limit
    is anchored in the programme code and cannot be changed. This is how Bitcoin protects
    itself from inflation.


    Only the amount of newly generated coins per block ![Picture 4](Image00003.jpg)(block
    subsidies) changes. The transaction fees remain in place, otherwise the miners
    would no longer have an incentive to make their computing power available.


    Miner reward = subsidy + transaction fees


    As subsidies fall to zero, the result is:


    Miner reward = transaction fees


    At the end of the chapter, a question should be clarified that some readers have
    probably already asked themselves. We have seen that a block always contains the
    hash of the previous block.


    But then what was the first entry of the very first block? After all, there is
    no previous block from which a hash can be generated.


    The first block is called the Genesis block . It has two tasks:


    It starts the blockchain. The content of the first entry is completely insignificant.


    However, the other function that the first entry fulfils is enormously important:
    it must prove that the blockchain was newly created.


    Let''s imagine that Satoshi Nakamoto invented the Bitcoin blockchain not in 2008,
    but already in 2000. However, he did not publish it, but secretly calculated block
    by block and created a blockchain. In the process, he collected all the block
    subsidies himself, initially 50 BTC per block. In addition, his computer was offline
    during the entire period so that no one would know what he was doing.


    This calculated blockchain would of course be significantly longer than all blockchains
    that have only been calculated since 2008. After all, Satoshi would have an eight-year
    head start. If he suddenly goes online with his blockchain in 2020, every miner,
    every node and every user will accept his blockchain as the longest and thus the
    "true" blockchain. All previous mining, all transactions and all created Bitcoins
    would no longer be valid.'
