    \ 前言\n比特币——一个引发争议的话题。对于某些人来说，它不仅是一种数字货币，更是对整个金融系统的变革。另一些人则反驳说它没有内在价值，你应该卖掉手中的资产。\n\
    \n尽管双方观点都有道理，无论如何看待区块链，比特币的价格已经上涨了数倍，随着时间的推移一直在持续增长，因此它至少值得关注。区块链技术正在被广泛研究或应用，这一点已不可否认。\n\
    \n## 2. 入门与基础知识\n比特币是每个人的话题，无论是在公共电视还是私人圈子里。充斥着大量的半桶水，许多术语被混淆或误用。这并不意外，毕竟这项技术是新颖且相对复杂的。我们并不要求外行掌握高深的编程水平，这需要几年的计算机科学学习。\n\
    \n然而，区块链和比特币的话题并没有初看看起来那么复杂。理解其机制只需要一定的技术理解和对主题的热情。\n\n既然你购买了这本书，说明你对这个话题很感兴趣。你想了解比特币和加密货币的入门知识和结构。也许你正考虑投资比特币，但想先了解技术背景。也许你只是想在下次别人提到比特币或区块链时也能发表一下意见。或者你是一个批评者，正在寻找这项技术的缺陷——因为比特币确实存在缺陷！\n\
    \n### 先决条件与知识水平：\n\n"
