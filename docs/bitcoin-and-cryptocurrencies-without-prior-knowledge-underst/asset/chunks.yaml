    ### 3.3 Consensus building and mining


    ![](Image00004.jpg)Mining is the English word for mining, extraction or production
    and is often used in connection with commodities such as gold, gold mining . Analogously,
    the term `bitcoin mining`, i.e. the production or mining of `bitcoin`, has been
    established.


    Cryptographically, mining describes the process of solving a mathematical problem
    such as the calculation of the `SHA256` algorithm.


    When the miners have done their work, the information is ready to become part
    of the consensus. Consensus describes the agreement of the participants as to
    what they consider "true" and what they consider "false". Since there is no central
    institution, the community decides if and when, for example, a transaction can
    take place and whether they will adopt the transaction into their blockchain.


    To better understand this process, let''s look at the different participants in
    a decentralised system. In addition to the miners, there are other participants,
    for example the `full nodes` already mentioned. A user can also act in several
    roles at the same time.


    For easier understanding, we take the building of a house as an analogy to the
    validation process of the individual participants. Using this example, we assign
    tasks to the participants.


    **Miner**: Miners are the users who do the work, in other words, the mining. The
    new information, i.e. the digitally signed transactions, are sent to them.


    Analogously, miners are the construction workers who build the house with their
    labour. The blueprint of what the house should look like are the rules of the
    blockchain.


    The miners calculate a potential consensus in the network, which they forward
    to the nodes for validation.


    The miners naturally want to be paid accordingly for their work.


    ![](Image00004.jpg)Miners are allocated several transactions in a block and create
    consensus, for example by making their computing power available. Users have to
    pay a fee for this. These transaction costs are distributed to the miners.


    Miners are those who do work to ensure the safety of the consensus.


    **Full nodes**: Full nodes are users who have downloaded the entire blockchain
    onto their computer and update it regularly. They synchronise with other nodes
    and form the pillars of the decentralised system. They also validate the information
    sent to them. They synchronise with other nodes and form the pillars of the decentralised
