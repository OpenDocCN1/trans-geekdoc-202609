    At this point, we will conclude the introduction to cryptography. We have already
    learned about all the aspects that we need as a background for understanding Bitcoin.
    Above all, the hashing algorithms will still be of great importance, because as
    already mentioned, hashing algorithms form the basis on which cryptocurrencies
    are built. Understanding private and public keys is also essential.


    3.  The emergence of the Bitcoin


    This chapter explains the technology of blockchain and bitcoins. The knowledge
    gained here forms the basis for understanding the other chapters.


    In parts, the sections become very technical. Although it is not necessary for
    general understanding and the further chapters of the book, it is useful to have
    these details fully explored. Simplified analogies are often used for better understanding.


    In the first chapter we discussed the disadvantages of the monetary system: Centralisation,
    the central banks'' monopoly of power, censorship and inflation.


    After the 2008 financial crisis, a person known by the pseudonym Satoshi Nakamoto
    created a digital, decentralised and limited currency : Bitcoin . It is still
    unclear who Satoshi Nakamoto really is. Many people have claimed to be the inventor
    of Bitcoin, but no one has been able to prove it (although it is actually very
    easy, as we will see later).


      ![](Image00023.jpg)


    Figure 13 Satoshi Nakamoto. To this day, no one knows who the inventor of the
    Bitcoin is


    It is also widely suspected that Satoshi Nakamoto was not a single person but
    a whole group of programmers. Conspiracy theorists, on the other hand, are certain
    that Bitcoin was distributed by the US government to test a digital currency before
    introducing an official government digital currency to make citizens even more
    transparent than they already are.


    3.1.         Bitcoin mBTC and Satoshi - The Currency Units


    The name Bitcoin is composed of "bit" (the unit in which a computer calculates)
    and "coin" (English for "coin").


    The unit of this currency is also called Bitcoin and is abbreviated as BTC. When
    talking about digital money in general, i.e. various cryptocurrencies, and not
    specifically Bitcoin, the general English term coins is often used.


    Like the euro, which still has euro cents, there are also smaller units for coins
    and Bitcoin. In Bitcoin, the smaller sub-units are named after the inventor. One
    Bitcoin consists of 100 million Satoshi i . In other cryptocurrencies, these have
    correspondingly different names.


    Another unit of the Bitcoin ecosystem is the milli-Bitcoin . This represents one
    thousandth of a Bitcoin. A brief overview of the relationships between BTC, mBTCand
    Satoshi:


    | 1 BTC || \= || 1000 mBTC || \= || 100,000,000 Satoshi |


    | --- | --- | --- | --- | --- |


    | 1 mBTC || \= || 0.001 BTC || \= || 100,000 Satoshi |


    | 1 Satoshi || \= || 0.00001 mBTC || \= || 0.00000001 BTC |


    The Bitcoin is divisible into 100 million smaller units. This will be of great
    advantage especially for mass adoption.


    Mass adoption means that the technology can be used by a large part of the population,
    even those who cannot raise the necessary money for a full Bitcoin.


    ![](Image00004.jpg)In October 2018, the Bitcoin white paper was published. A white
    paper is a document aimed at the public that contains an overview of the technology''s
    purpose, benefits and goals.


    Let''s take a closer look at an excerpt from the original bitcoin white paper.
    The white paper can be viewed at bitcoin.org, both in the original English version.


    Bitcoin: An electronic peer-to-peer payment system


    Satoshi Nakamoto


    [satoshin@gmx.com](mailto:satoshin@gmx.com)


    www.bitcoin.org


    A pure peer-to-peer version of an electronic payment process would allow online
    payments to be sent directly from one party to another without going through a
    financial institution.


    Digital signatures are part of the solution, but the main benefits are lost if
    a trusted third party is still needed to prevent double spending.


    Excerpt Bitcoin White Paper Original version in English on bitcoin.org


    The vision of the project is to realise direct, person-to-person digital payment
    without the need for a bank or other financial institution. We also see that digital
    signatures, as we learned about them in the previous chapter, are part of the
    system.


    ![](Image00004.jpg)The corresponding source code was published a little later
    and can still be viewed today. The source code of a cryptocurrency is nothing
    more than the unchanged programme code, a kind of blueprint of the programme that
    can be read by computer scientists.


    The source code is publicly available (open source). It can be viewed at [https://github.com/bitcoin/.](https://github.com/bitcoin/)


    Another aspect of bitcoin is decentralisation . We have often used the terms centrality
    and decentralisation, but what exactly do these terms mean and what exactly is
    the difference?


    ![](Image00004.jpg)Decentralisation means that there is not a central institution
    such as a bank or a state that watches over a system, for example the money supply,
    and can theoretically deny access to its liquid assets at will.


    Instead, as in the example of Bitcoin, a huge network of computers forms the pillars
    of the payment system.


    ![](Image00024.jpg)    ![](Image00025.jpg)


    Figure 14 Centralised structure (left) and decentralised structure (right)


    Digitalisation and the interconnectedness of the internet make it possible to
    set up a network in which there are no longer any central nodes, and this is also
    the case with Bitcoin.


    We see that Bitcoin is a project where we can open digital "accounts" and send
    money to each other. But how do you create an account within a programme and what
    do terms like blockchain have to do with it?


    ![](Image00004.jpg)A blockchain is a transaction history in a decentralised system
    that is complete and never changes. Every participant in the decentralised system
    agrees to this transaction history so that all transactions are uniquely defined.


    The total storage requirement of the Bitcoin transaction history currently amounts
    to almost 300 gigabytes (as of the beginning of 2021). By storing the entire blockchain
    on a computer, one expands the decentralised network and strengthens the network
    before a takeover.


    ![](Image00004.jpg)Anyone who wants to can download the complete transaction history
    of Bitcoin or any other cryptocurrency onto their computer. In this way, one becomes
    a node oneself. The nodes are called full nodes.


    To ensure that every node in the network (full nodes) has the current blockchain,
    the blockchain is updated in regular sections and transmitted to every participant.


    After a certain interval, for example every ten minutes, a package with new information,
    a so-called block , is appended to the previous transaction history. This has
    the advantage that not every single transaction has to be updated, but a bundle
    of transactions.


    Gradually, a chain of information packages then emerges: a block chain.


    Each participant in the decentralised system saves the current blockchain on his
    or her computer. The advantage: If a participant wants to "cheat" and changes
    the blockchain on his computer, all the other participants will immediately notice,
    because the transaction histories differ. The participants do not accept the change.


    ![](Image00004.jpg)Since there is no central overseer in blockchain technology,
    but thousands of overseers spread across the globe, changing rules is not possible.'
