    # Litecoin 概览


    Litecoin（缩写为 `LTC`）通常被称为比特币的“兄弟”，在技术上几乎与比特币系统 1:1 完全等同。仅更改了名称和某些参数。例如，目标区块生成时间从十分钟缩短到了
    2.5 分钟。这意味着交易处理量增加了四倍。与此同时，分发的莱币数量也是四倍，因此所有出现过的莱币总量上限不是 2100 万个，而是 8400 万个 `LTC`。莱币还意识到了
    `SHA256`算法可以通过 `ASICs` 非常高效地计算的问题。一台 `ASIC` 的威力等同于数百台计算机。这使得网络算力变得更容易集中。所需的资源和能量显著减少。


    这就是为什么莱币选择了一种专门为“商品化硬件”创建的算法，以防止算力中心化。莱币的 `scrypt` 算法无法通过 `ASICs` 进行更高效的计算。由于整个网络规模小得多，尽管如此，攻击这里比比特币要容易得多。


    ## 分叉方法


    最后提到的分叉方法是软分叉（soft fork）。正如其名，这不是一次硬分叉，而是一个软过渡。这种分叉更多是对之前区块链的升级，而不是分裂。其优势是 `soft
    fork` 通常具有向后兼容性。类似于在你的电脑或智能手机上更新程序，你仍然可以使用旧或新版本。


    在理解了挖矿原理并学习了不同的分叉变体后，让我们来看看挖矿对环境产生了什么影响。


    ## 4.5 挖矿对环境的影响


    媒体或脱口秀中经常听到这样的反对意见：几个“极客”之间互相发送虚拟币固然很好，但与此同时挖矿的规模已经达到了这种程度，使得所有比特币挖矿消耗的电力超过了某些国家的总和。


    我们将仔细观察为什么电力没有被浪费而是被合理利用。尽管如此，这些耗能的矿机无疑不应低估。


    大约 50% 的矿工位于中国。尽管他们正表现出向可再生能源的大趋势，但目前仍然严重依赖煤炭和天然气。


    一些气候活动人士已经开始禁止比特币。除了比特币无法被禁止（我们稍后也会讨论这一点）之外，一些反对也是相当合理的。


    我们需要理解的是：尽管金融系统并非尽善，且比特币可能是解决方案，但气候变化及其相关影响是非常破坏性的。气候变化影响着人类、自然以及金融系统。


    然而，挖矿的能耗必须始终与其他能耗相比来看。最近的研究显示，用于挖矿的能量中略于一半是 100% 可再生的，而且已经约 80% 的矿工正在转向廉价的绿色能源。这是因为太阳能和风能发电比煤炭或石油发电更便宜。比特币并没有阻碍绿色能源，而是促进了它。


    比特币支持者还认为，比特币代表了自由的金融系统。它代表了的基本权利。


    全球电信和消费电子产品（如 Netflix、视频游戏等）消耗的资源多得多，但对自由社会的贡献小得多。


    ![](img/Image0005)


    图 3 全球消费


    来源：`https://bitcoinmagazine.com/environmental-consumption`


    ## 4.6 权益证明


    与 `POW` 不同，网络的安全性不是通过提供算力来保证，而是通过要求验证区块的参与者以币的形式质押信用。


    ![](img/Image0004)


    我们可以将其想象为每个参与者都像缴纳保险一样质押信用。如果有人有坏意，想要伪造区块并被发现，他就会失去信用。因此，没有人有动力违规。


    每个拥有钱的人都获得投票权。然后，通过民主投票验证区块。一个人拥有的资产越多，他的投票权就越大。解决区块的奖励（交易手续费和区块补贴）反过来支付给所有参与共识的成员。


    这种程序不需要耗能的计算机器。此外，我们可以随时查看哪个账户有多少投票权。权益证明（proof-of-stake）算法对币持有者也有利。他们通过提供形式为分币的币获得回报。他们不需要昂贵的计算器或廉价的电价。


    即使权益证明程序乍看只有优势，但也存在一些严重的问题。其一，它是一个资本系统，金钱或财富会自动带来对权力的某种要求。


    此外，那些已经拥有最多财富的人（即使在绝对意义上）在解决区块时获得最多的奖励。逐渐地，垄断会形成并获得越来越多的影响力。我们已经在目前的世界中看到货币供应量随着时间的推移变得越来越多。世界上超过
    50% 的货币供应量仅由 1% 的人持有。应用到权益证明方法，这意味着如果这 1% 的人聚集在一起，他们将拥有足够的投票权改变区块链的规则。当然，这又是一个非常有假设性的假设，并且会有其他机制来防止这种聚集。例如，网络内的基础性系统决策需要
    90% 的批准而非 51%。系统决策例如是关于质押奖励（即“分红”）应该如何分配的问题。


    需要注意的是，所有基于 `POS` 的区块链在垄断问题上显示出的异常少。


    另一方面，通过 `proof-of-work` 概念，这种方法在原则上是不可能的。


    '
