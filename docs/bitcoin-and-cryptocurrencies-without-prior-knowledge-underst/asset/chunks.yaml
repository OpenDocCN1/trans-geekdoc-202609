- raw: "However, if the price drops sharply within a short period of time, doubts\
    \ start to spread. Uncertainty spreads as to whether the investment was a wise\
    \ decision, and after some pondering, one sells at a loss. Selling an asset class\
    \ that did not convince is generally not wrong. You always have to put the price\
    \ in relation to the fundamentals. In the case of cryptocurrencies, selling would\
    \ have been the wrong decision at almost any time.\n\nThere are only two remedies\
    \ against these market effects:\n\nMore long-term capital needs to flow into the\
    \ crypto market. Large investors, so-called whales , and companies need to invest\
    \ in the market.\n\nThis means that inflows and outflows have less of an effect\
    \ in relative terms. This is exactly what we have been seeing for a few years.\
    \ Large investors, fund managers or private investors invest in cryptocurrencies\
    \ and the projects behind them.\n\nInvestors also need to better understand the\
    \ asset class.\n\n![](Image00004.jpg)Someone who fundamentally understands Bitcoin\
    \ and is convinced of the technology and the future will not sell their Bitcoin\
    \ just because the price has fallen by 70%. The value is crucial, and it is constantly\
    \ growing. In the long term, the price of a good will always approach its value.\n\
    \nLooking at the next two, five or even ten years, the crypto market may continue\
    \ to fluctuate a lot and be dominated by speculators. The more capital flows into\
    \ the market and the more people are convinced of the technology, the less panic\
    \ buying and selling will occur and the more stable the Bitcoin price will become.\n\
    \nSo this myth has, at this point, a kernel of truth. Even if the price fluctuations\
    \ will decrease with increasing awareness, the price is very volatile nowadays\
    \ and can be regarded as speculation.\n\nWhether Bitcoin is too expensive can\
    \ only be assessed subjectively.\n\nLastly, let's look at an economic statement\
    \ about Bitcoin.\n\n9.9.         Deflation destroys the economy\n\nWe have already\
    \ seen that our current inflationary monetary system is doomed to failure in the\
    \ long run.\n\nA central entity, such as a central bank, has the power to create\
    \ money out of nothing, and can thus effectively expropriate any saver by causing\
    \ the purchasing power of money to lose value.\n\nHowever, one must put the blame\
    \ into perspective. For the central banks only carry out what is demanded by the\
    \ economy, the states and the shareholders, namely to pump new money into the\
    \ market to keep the economy artificially alive. The central banks have no other\
    \ options. Their only capabilities are to print new money or to destroy existing\
    \ money.\n\nThat is why more and more voices are being raised, especially by Bitcoin\
    \ maximalists. They state that the inequality is not due to the participants of\
    \ the system, but to the inflationary monetary system in general, that it is doomed\
    \ to fail.\n\n![](Image00004.jpg)The opposite of inflation, i.e. a steady increase\
    \ in the money supply, is deflation , as is the case with Bitcoin. The amount\
    \ of money always remains the same or even decreases over time.\n\nSince everything\
    \ else in our world is almost unlimited, be it gold, products like mobile phones\
    \ or cars, the value of money increases over time.\n\nIn the case of deflation,\
    \ one year later one can buy more with one's money than today. The prices of economic\
    \ goods become cheaper and cheaper and not, as we know it until now, more and\
    \ more expensive.\n\nBut can this form of monetary system work?\n\nThe first argument\
    \ against deflation is quite logical at first glance. Why should we still spend\
    \ money if we know we can afford more of it in one, five or ten years?\n\nIt makes\
    \ much more sense to save money instead of spending it on cars, holidays or smartphones.\
    \ As a result, less is consumed, the economy and thus the entire system collapses.\
    \ This simple example shows: Deflation cannot work. But is that really the case?\n\
    \nWould we no longer go on holiday at all? Would we no longer buy a smartphone\
    \ or a car?\n\nAt the latest when it comes to food or housing, it becomes clear\
    \ that we would still buy bread rolls or noodles and also pay rent for accommodation.\n\
    \nAbove all, in the developed world, people continue to consume. Or do we want\
    \ to stop watching Netflix after an 8-hour working day just because we would pay\
    \ 10% less for it in five years? Surely not. Nor would we let our annual holiday,\
    \ which we have worked hard to earn, be taken away just because we could take\
    \ an extra day's holiday next year for the same money.\n\nIt is true, however,\
    \ that we would only buy a new smartphone every three or five years, for example.\
    \ And a high-quality one that remains functional for a long time. We would consume\
    \ consciously and sustainably. The companies that produce sustainably would automatically\
    \ be paid more.\n\n![](Image00004.jpg)Our system would be trimmed for efficiency,\
    \ not maximum return, in a deflationary monetary system.\n\nIf Apple, Huawei,\
    \ Samsung or any other big-name smartphone manufacturer were to launch the same\
    \ mobile phone every year that, technically speaking, did not feature any essential\
    \ changes to the previous model, consumers would think twice about saving the\
    \ money, as the money would gain purchasing power on its own.\n\nCompanies and\
    \ service providers would also be competing with deflation in this scenario. They\
    \ would have to offer higher quality products, as money would be worth significantly\
    \ more than in an inflationary system.\n\nIt is also a fact that switching to\
    \ a deflationary system would be a big change. Many companies would go bankrupt,\
    \ as they would not deliver any added value to the population and would only be\
    \ kept alive by the devaluation of money.\n\nAll other asset classes would automatically\
    \ become less interesting than before. Perhaps it would plunge the economy into\
    \ a temporary crisis, from which, however, it would recover slowly and sustainably\
    \ afterwards. Many people state that we cannot deliberately switch to a system\
    \ that weakens the economy for a short time. The alternative, however, is to keep\
    \ a system going that has never worked at any time in our history, that is the\
    \ basis for expropriation of savers and encourages waste and unsustainable consumption.\n\
    \nBitcoin as a deflationary monetary system is an experiment with the potential\
    \ to solve many of our problems today, an experiment worth testing.\n\n10.   \
    \ Closing words\n\nThis concludes our journey through Bitcoin basics and blockchain\
    \ technology. We have learned the basics of cryptography and our monetary system.\
    \ We know how Bitcoin works, the potential of a decentralised network like Ethereum\
    \ and what to look out for when buying and selling coins. Of course, this was\
    \ only a small sample of topics that one could write a whole book about individually.\
    \ We are not required to understand every complex context down to the smallest\
    \ detail. The most important thing is to get a grip on the subject, keeping an\
    \ eye on the risks and challenges but not being ignorant per se.\n\n\"Bitcoin\
    \ is the start of something great\"\n\nNassim Taleb - financial mathematician\n\
    \n\"I didn't understand how it \\[Bitcoin\\] worked at first and then I looked\
    \ it up and it was brilliant.\"\n\nJeff Garzik -Bitcoin Developer\n\n\"Bitcoin\
    \ is like gold, but with this magical ability that you can teleport it. “\n\n\
