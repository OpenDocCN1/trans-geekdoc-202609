- raw: 'For this, we again take the largest cryptocurrency: Bitcoin. Bitcoin uses
    the SHA-256 algorithm. Another cryptocurrency called Bitcoin Cash uses the same
    algorithm but is only about 1% the size of Bitcoin.


    One percent of the Bitcoin hashing power is therefore equal to 100% of the Bitcoin
    Cash hashing power. If a group that has only 1% of the hashing power of the entire
    Bitcoin network decides to attack the Bitcoin Cash Blockchain, it already has
    50% of the hashing power and could therefore almost drive a 51% attack.


    This has happened frequently in the past and happens again and again with smaller
    coins. Although it is not possible to change the blockchain retroactively, it
    is possible for the community to no longer recognise the blockchain that has been
    created. If such a 51% attack were to occur, the community has a very simple way
    to get rid of the attackers. We are talking about a fork.


    4.4.         Forking a Blockchain


    ![](Image00046.jpg)Forking describes the process of splitting a blockchain into
    two (or more) blockchains. ![](Image00048.jpg)


    Figure 32 Forking of a blockchain


    The Bitcoin blockchain has already been forked several times, for example in Bitcoin
    SV, Bitcoin Cash or Bitcoin Gold.


    ![](Image00049.jpg)      ![Bitcoin Gold (BTG) Logo Vector](Image00050.jpg)   
    ![File:Bsv-icon-small.png](Image00051.jpg)


    Figure 33 From left to right: Bitcoin Cash BCH , Bitcoin Gold BTG , Bitcoin SV
    BSV


    This is why the Bitcoin Blockchain is often referred to as Bitcoin Core or Bitcoin
    Main , to clearly distinguish it from other forged Bitcoin Blockchains.


    A fork is when a part of the community decides to change the underlying protocol
    (the source code) from a certain block of the blockchain onwards.


    Actually, the source code is considered "sacred" and should never be changed.
    Nevertheless, a fork can be useful in certain situations. Let''s illustrate forking
    again with the help of an analogy.


    Let''s say the blockchain is a dirt road we can drive along. The miners are the
    road builders who work with excavators and jackhammers instead of computing power.
    Piece by piece, they build a long road, which we call Bitcoin core, and on which
    we can move.


    Suddenly a group of people come along and see weaknesses in the construction of
    the road. It is not wide enough, not enough cars can pass through, the construction
    is not stable and so on. They see the need to continue building the road in a
    different way and to change the building rules. However, not everyone agrees with
    this. For the other group, the road is perfectly adequate, or even sees it as
    better.


    As a result, the road splits and a new parallel road called Bitcoin Cash is created.
    Both roads continue to be built in parallel.


    A miner/road builder also has to decide which blockchain he will make his computing
    power available to. After all, he cannot build the Bitcoin Cash Road and the Bitcoin
    Core Road at the same time.


    ![](Image00052.jpg)


    Figure 34 Bitcoin Cash Fork


    When the blockchain splits into two separate chains, this process is also called
    a hard fork . The streets are not compatible with each other. At one point, however,
    the comparison is flawed: as users, we can continue to use both blockchains. After
    the Bitcoin Cash Blockchain was split off from the Bitcoin Blockchain on 1 August
    2017, the miners had to decide, but the users did not.


    It gets even better: If we own coins of the original currency, in this case Bitcoin,
    at the time of a fork, then we automatically own coins of the new blockchain.


    This means: If we had 1 BTC on our Bitcoin account on 1 August 2017, we would
    still have 1 BTC on our account after the fork, but additionally 1 BCH (Bitcoin
    Cash) on our new BCH account. This account has the same address, and we can access
    our coins through the same private key, after all it has only been a copy of the
    previous Bitcoin Blockchain. This may sound a bit confusing, but we need to remember
    first and foremost that we do not own our coins, only our private key. In a fork,
    all addresses, i.e. all public keys and all private keys, are copied 1:1 to the
    new blockchain.


    Why isn''t Bitcoin forked more often? After all, everyone who owns Bitcoin also
    gets coins of the new currency for free every time, right?


    In principle, this is correct, but first there must be a demand for the new currency.
    In addition, enough people must be willing to make their computing power available
    to mine the new coin. In reality, 99% of all forks of Bitcoin have disappeared
    into insignificance so far.


    To name a few examples: Bitcoin Gold, Bitcoin Platinum, BIG Bitcoin, Bitcore,
    super Bitcoin, etc.


    Another example of a "hacker attack" that forced a hard fork has taken place on
    the cryptocurrency Ethereum.


    ![](Image00053.gif)


    Figure 35 Ethereum logo


    Ethereum is the second largest cryptocurrency after Bitcoin. The currency is denominated
    in Ether (ETH).


    Just like Bitcoin, Ethereum uses Proof of Work to build consensus.


    There was an "inaccuracy" in the Ethereum blockchain that a hacker was able to
    exploit in 2016. He managed to steal 3.5 million ETH (equivalent to 60 million
    euros at the time) from part of the community. Great chaos broke out - there had
    never been anything like it before. After the initial fog had settled, the community
    was faced with the question: Should we initiate a hard fork and "ban" the hacker
    from the network?


    The idea behind this is that it would also undo the hack and the hacker would
    no longer have control over the coins. However, there was also a group of people
    who felt that it did not make sense, as such an action shows that the code can
    be changed too easily. According to the principle, "the source code is law," they
    held on to the blockchain with the hacked coins.


    ![](Image00054.jpg)


    Figure 36 Should the blockchain be forked after the hacker attack?


    The groups could not agree and, ironically, even the hacker himself got involved
    in the discussion. He insisted that he had done nothing illegal, as he had merely
    exploited a vulnerability in the Ethereum blockchain. He had even consulted his
    lawyers.


    In the end, however, a hard fork occurred anyway. The blockchain that did not
    "undo" the hack was named Ethereum Classic . Ethereum, which is present today
    and at the same time the second largest cryptocurrency, reversed the hack.


    The miners also had to decide: Do they make their computing power available to
    the Ethereum or the Ethereum Classic network? To date, the majority have opted
    for the Ethereum network.


    On the Ethereum Blockchain, the hacker was not able to steal any coins because
    his hack was neutralised and the vulnerability was fixed. On the Ethereum Classic
    Blockchain, on the other hand, he kept the "stolen" coins.


    The moral of the story: new technologies are always associated with risks. This
    story also shows that even a hack can be overcome by the decentralised community.
    Many people claim that this trial has even strengthened Ethereum and shown that
    no hacker stands a chance against the blockchain and the community - even if a
    mistake is discovered.


    Ethereum Classic, on the other hand, has become increasingly unpopular over the
    years. When Ethereum is mentioned, this explicitly refers to Ethereum and not
    Ethereum Classic.


    ![](Image00053.gif)    ![](Image00055.jpg)


    Figure 37 Ethereum logo (left) and Ethereum Classic (right)


    So far, we have seen the most radical type of fork. Overall, there are several
    ways to fork a blockchain, such as a source for k .


    In a source fork, the existing source code of a cryptocurrency is copied and changed
    in some places. The blockchain is then started from scratch. Since there are no
    matching blocks, a source fork is not considered a real fork of a specific blockchain.
    We also do not receive any coins if, for example, we already own Bitcoins before
    the fork.


    An example of a source fork of Bitcoin is the cryptocurrency Litecoin .


    ![](Image00056.jpg)


    Figure 38 Litecoin logo'
