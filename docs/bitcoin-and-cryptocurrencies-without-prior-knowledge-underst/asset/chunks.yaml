- raw: 'Cryptocurrencies are based on mathematics . 2+2 = 4. We don''t have to be
    afraid that tomorrow 2+2= 5.


    Cryptocurrencies continue to have a decentralised structure. This means that the
    data is not stored on a server, but on a distributed network consisting of thousands
    of computers.


    Before we look at cryptocurrencies, Bitcoin and blockchain technology in detail,
    let''s look at the basics of cryptography. The entire blockchain technology is
    based on these fundamentals and algorithms. Cryptography lets us understand the
    ingenious mechanisms behind cryptocurrencies. Don''t worry: the entire exercise
    will be kept simple so that it remains easy to understand.


    2.5.         Basics Cryptography


    ![](Image00004.jpg)Cryptography is a science that deals with encryption and the
    creation of cryptosystems. A cryptocurrency is a digital currency that has a cryptosystem
    i.e., various encryption algorithms, as its basis.


    Transactions are encrypted, executed and confirmed using well-known, tried and
    tested encryption algorithms. Let''s take a systematic look at the individual
    steps and start with how a message can be encrypted in the first place.


    The fact that good encryption is considered secure and is one of the few means
    left in the fight against hackers or malicious central institutes was also recognised
    by the well-known whistleblower Edward Snowden.


    "Encryption works. Properly implemented strong cryptosystems are one of the few
    things we can rely on." - Edward Snowden


    With the advance of digitalisation, encryption algorithms have become indispensable
    because the integrity of data is essential for communication across continents.


    ![](Image00006.jpg)Data integrity says that we can be sure that the data we receive
    arrives unaltered. This means that no one can change, intercept or delete it along
    the way.


    To ensure this, all communication systems such as the internet, mobile radio or
    even sensors in industrial plants use encryption algorithms . But how does encryption
    actually work and what types of encryption are there?


    To answer these questions, it is first necessary to define some of the terms and
    objectives of encryption. We will now look at a model that is often used in cryptography.


    Two people, let''s call them Alice and Bob, want to communicate with each other
    in encrypted form. To do this, Alice writes a message in plain text . This means
    that the message can be read by anyone.


    The primary goal of encryption is to keep the message secret , so that it cannot
    be read along the way. Therefore, Alice cannot simply send the message in plain
    text, but must encrypt it by means of a procedure so that the message becomes
    unreadable. Bob, on the other hand, can decrypt the message and receives the plain
    text back. But how can you encrypt a message? A simple but insecure method is
    the so-called Caesar shift cipher or Caesar encryption . Here, all letters of
    the plaintext are shifted by a certain number in the alphabet. As an example,
    we shift each letter three places backwards in the alphabet. The A becomes a D,
    the B becomes an E and so on:


    | Letter || A || B || C || D || E || F || G || H || I || … || V || W || X || Y
    || Z |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---
    | --- | --- | --- |


    | Letter+3 || D || E || F || G || H || I || J || K || l || … || Y || Z || A ||
    B || C |


    The number three is called the key , because with the help of this number and
    the algorithm, an encrypted message is created from the plaintext.


    ![](Image00000.jpg)For example, if Alice encrypts the message "Bitcoin is awesome!"
    with the key three , the result is the message "Elwfrlq lv dzhvrph! “


    (You are welcome to check!)


    ![](Image00007.jpg)


    Figure 2 Symmetric encryption of a message


    ![](Image00000.jpg)The message is transmitted in encrypted form. Bob receives
    the message and decrypts the message by shifting all the letters back three places
    .


    For this, Bob must know which method is to be used for encryption and what the
    key is (in our case, the Caesar shift cipher and the number three). This information
    must be known beforehand, for example, it must have been agreed upon in a personal
    meeting.


    It is obvious that the procedure is very insecure, because there are a maximum
    of ![Picture 4](Image00003.jpg)26 different letters in the alphabet, and thus
    only 26 different keys with which the message can be encrypted. A hacker would
    therefore have to make a maximum of 26 attempts to crack the encryption.


    The Caesar shift cipher is an example of a symmetric encryption method . Symmetric
    means that the same key is used for both encryption and decryption. For this,
    both parties must exchange the key without a third person knowing about it.


    Another system that will still be of great importance to us is asymmetric encryption.


    2.6.         Asymmetric encryption


    ![](Image00004.jpg)In an asymmetric encryption method , the same key is not used
    for encryption and decryption, but two different keys . One key is used to encrypt
    the message, the other to decrypt the message.


    The key used for encryption can be openly accessible. It does not have to be kept
    secret and is therefore also called a public key . The key for decryption, on
    the other hand, must be kept secret. It is called a private key .


    ![](Image00008.jpg)


    Figure 3 Asymmetric encryption of a message


    For this kind of encryption, however, we need a function that is not equally easy
    to solve in both directions.


    ![](Image00009.jpg)


    Figure 4 Function of a mathematical one-way function


    ![Picture 4](Image00001.jpg)The public key and the private key are related via
    mathematical functions. However, it is not possible to infer the private key from
    the public key.


    We cannot easily infer the input of the function from the output of the function,
    but we can infer the input of the function from the output of the function.


    As a simple example we take the function ![](Image00010.jpg).


    This equation is relatively simple to solve. On the way back, however, the fourth
    root would have to be drawn: ![](Image00011.jpg). This is a bit more complicated
    than pure multiplication. More complex functions and huge numbers are used for
    asymmetric encryption.


    These mathematical functions are highly complex and would go beyond the scope
    of this book.


    In mathematics, this is called a hard problem. In our context, it is only important
    to understand that the private key and the public key are not independent of each
    other, but that the public key is related to the private key.


    We will look at one more concrete example in this book, but due to the size of
    the book we will not look at the full background or even the mathematical proofs.


    These were already the basics of secrecy or confidentiality by means of encryption
    procedures. Now we know how an encrypted message is created from a message in
    plain text.


    Summary:


    Public Key : Key, freely accessible. This is used to encrypt the message.


    Private Key : Key that must be kept secret. This is used to decrypt the message.


    Private key and public key are related via complex mathematical functions.


    Next, we ask ourselves how we can be sure that Alice really is the sender of the
    message and that the encrypted message has not been intercepted and changed in
    transit. These aspects are summarised under the terms: integrity and authenticity.


    To ensure the integrity of the message, Alice can "encrypt" the message with her
    private key. This process is called signing .


    We can imagine digital signing like a medieval letter seal.


    ![](Image00012.jpg)


    Figure 5 Signing in the Middle Ages


    A sealed letter proves that it has not yet been opened and accordingly cannot
    have been falsified. The seal, in turn, confirms that a certain person, for example
    the king at the time, must have sent this letter.'
