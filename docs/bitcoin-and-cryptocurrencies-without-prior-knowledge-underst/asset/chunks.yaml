- raw: "Normally, a transaction consists of half data and half signature. Segwit reduces\
    \ the need for the signature, so that almost twice as many transactions fit into\
    \ one block. This means that 14 transactions per second can already take place\
    \ on the Bitcoin blockchain. Fourteen transactions are already more than seven\
    \ or eight, but we have already seen that it would have to be tens of thousands\
    \ for Bitcoin to be used as a large-scale means of payment.\n\n![](Image00004.jpg)Since\
    \ the Bitcoin Blockchain primarily focuses on ensuring the security and invulnerability\
    \ of the network, it will most likely never be possible to run all transactions\
    \ directly in the Blockchain. For small amounts, it would also be completely uneconomical\
    \ due to the high transaction costs.\n\nAs the demand for transactions on the\
    \ Bitcoin Blockchain increases, the transaction costs rise at the same time. In\
    \ a few years, hundreds of euros per transaction could be normal.\n\nDoes this\
    \ mean that Bitcoin is not an option as a means of payment?\n\n![](Image00004.jpg)Bitcoin\
    \ is a worldwide movement with a huge community and thousands of active programmers\
    \ who work on the further development of the network every day. It would be naïve\
    \ to believe that there is no technical solution to Bitcoin's challenges today.\
    \ One example that has been developed enormously in recent years is so-called\
    \ second-layer solutions.\n\nSecond Layer Solutions\n\nSecond layer models are\
    \ based on the idea that the blockchain serves as a stable, lowest layer, but\
    \ that we can build further layers on top of this layer. The blockchain is described\
    \ as the main layer.\n\nThis is comparable to the internet. The basis for our\
    \ internet is the Ethernet protocol. Further layers are built on this lowest protocol,\
    \ for example the IP addresses that each computer receives. Further protocols,\
    \ such as the internet browsers with HTTPS protocols, build on the IP addresses.\
    \ Each new layer brings new features. For example, the HTTPS layer provides security\
    \ for data transmission. We all use the HTTPS protocol when we surf the Internet\
    \ and see the lock symbol in our browser.\n\n![](Image00116.jpg)\n\nFigure 83\
    \ HTTPS abbreviation for a secure internet connection\n\nAs we have already seen,\
    \ the blockchain does not need a security update. However, a second layer protocol\
    \ can help us solve the speed problem.\n\nBy building more layers (new technologies)\
    \ on top of the blockchain, the number of transactions can be scaled to thousands\
    \ of transactions per second.\n\nSo far, there are many different approaches as\
    \ to what exactly the second layer models can look like. For example, we are looking\
    \ at a very promising technology: the Lightning network.\n\nLightning network\n\
    \nThe Lightning network is an independent network. Bitcoin can be sent within\
    \ this network. The name ‘lightning’ was chosen because the transactions can be\
    \ transmitted at the speed of light.\n\nThe Lightning network makes sense for\
    \ small payments, for example when we want to buy a coffee for €2 or a bread roll\
    \ for 40 cents. The effort to initiate a separate transaction for this, which\
    \ is stored forever in the blockchain, is out of proportion.\n\nThe Lightning\
    \ network is as simple as it is ingenious. We send our Bitcoin from the Bitcoin\
    \ Blockchain to the Lightning Network. To do this, we lock our Bitcoins on the\
    \ Bitcoin Blockchain so that they can no longer be used. To do this, we need a\
    \ one-time transaction on the Bitcoin Blockchain.\n\nWe can send the blocked bitcoins\
    \ on the Lightning network and can receive bitcoin from other Lightning users\
    \ that the other users have previously blocked on the main blockchain.\n\n![](Image00004.jpg)The\
    \ transactions within the Lightning network are only stored by parties in the\
    \ Lightning network. The Bitcoin blockchain is not aware of this. A transaction\
    \ is only created when a party enters or leaves the Bitcoin Blockchain.\n\n![](Image00117.jpg)\n\
    \nFigure 84 Transferring the bitcoins to the Lightning network\n\nWe can think\
    \ of the system as if we had a bank account (Bitcoin account on the Bitcoin blockchain)\
    \ from which we withdraw cash. We transfer our money from one network (bank account)\
    \ to another network (cash system).\n\nWith cash, we can trade with anyone who\
    \ also has cash. This costs no fee for a transfer and is usually quicker than\
    \ if we must wait a day for the transfer.\n\nIf we want to use our Bitcoins again\
    \ on the Bitcoin Blockchain, we have to deposit the same amount of Bitcoin that\
    \ was \"withdrawn\" again.\n\nThe difference of all transactions in the Lightning\
    \ network is stored as one transaction on the Bitcoin blockchain.\n\n![](Image00004.jpg)The\
    \ transaction history within the Lightning network is not stored. This has a positive\
    \ side effect: because the transactions are not stored, it is no longer so easy\
    \ to trace which person sent how many bitcoins to whom.\n\nFrom outside, only\
    \ the overall balance is that no Bitcoins are missing.\n\nThe Lightning network\
    \ (like many technologies) is still in its infancy. At the moment, a lot of technical\
    \ knowledge is still needed to be able to take Bitcoin out of the network and\
    \ send it on the Lightning network, for example.\n\nThousands of users around\
    \ the world are already using the Lightning network, and more are joining every\
    \ day.\n\n![](Image00118.jpg)\n\nFigure 85 Current distribution of all active\
    \ Lightning Nodes  \n\nSource: https://explorer.acinq.co/\n\nOver time, the technology\
    \ will be developed further and become suitable for mass use. In the future, a\
    \ simple smartphone app may make it possible to transfer bitcoins cheaply in near\
    \ real time.\n\nNext, let's look at another technical prejudice that Bitcoin is\
    \ said to have.\n\n9.6.         Quantum computers destroy the Bitcoin network\n\
    \nPeople who are somewhat tech-savvy often throw in the argument that a quantum\
    \ computer can easily crack Bitcoin's encryption, causing the entire network to\
    \ collapse. As a layman, this sounds like a valid argument. However, this is not\
    \ the full truth either. To understand to what extent quantum computers can pose\
    \ a threat, let's take a look at what quantum computers actually are, how they\
    \ work and what impact this has on Bitcoin.\n\nWe learned about one-way functions\
    \ in the basics of cryptography. These are functions that are very simple to solve\
    \ in one direction, but not so simple in reverse. Applied to the Bitcoin network,\
    \ this means that we can very easily infer the public address from the private\
    \ key, as we already discussed in \"Bitcoin can be hacked.\"\n\nThis function,\
    \ like the elliptic curve, is called a mathematical hard problem , and it is precisely\
    \ these that quantum computers can calculate much faster than conventional computers.\
    \ A quantum computer does not calculate with 1 and 0 like an ordinary computer,\
    \ but with very small parts, so-called quantum particles or qubits . These can\
    \ be electrons or light particles. The special feature of these particles is that\
    \ their properties allow us to calculate several calculations simultaneously instead\
    \ of one after the other.\n\nThis means that a quantum computer requires significantly\
    \ fewer calculations to obtain the same number of results as a conventional computer.\n\
    \nThis is both an attack on the SHA256 algorithm and on the elliptic curve method,\
    \ which generates the public address from the private key.\n\n![](Image00004.jpg)In\
    \ any case, it is correct that there is the theoretical possibility of cracking\
    \ the two methods. However, we are still very far away from this at the present\
    \ time. Some estimates suggest that the computing power of a quantum computer\
    \ still needs to increase hundreds to thousands of times for there to be a real\
    \ danger of an attack. Quantum computers are also extremely expensive, and only\
    \ a few large companies like Google are working on development.\n\n![](Image00119.jpg)\n\
    \nFigure 86 Today's dimensions of a quantum computer\n\nQuantum computers cannot\
    \ be compared with normal computers. The quantum particles have to be meticulously\
    \ processed and evaluated. They work at -270 °C and require enormous amounts of\
    \ energy."
