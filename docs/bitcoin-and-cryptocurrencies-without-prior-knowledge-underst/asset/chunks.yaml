- raw: 'Example Bitcoin: The name of the cryptocurrency is Bitcoin . The units are
    also given in bitcoin and abbreviated as BTC .


    Bitcoin and the blockchain were introduced in 2008, and since then Bitcoin has
    been by far the largest cryptocurrency. The size of a cryptocurrency is measured
    by its market capitalisation , similar to shares. The market capitalisation is
    the price of the coin of a cryptocurrency multiplied by the current number of
    all coins.


    ![](Image00061.jpg)


    If a bitcoin costs €10,000 and there are currently 15 million coins on the market,
    the market capitalisation is:


    ![](Image00062.jpg)


    Conversely, this means: If a coin costs €100, it is not automatically more popular,
    bigger or better than a coin that costs 50 cents. It always depends on the number
    of coins in circulation. If there are a thousand times as many coins of the latter
    coin in circulation, the market capitalisation is greater.


    ![](Image00004.jpg)The ranking of the largest blockchain technologies is measured
    by market capitalisation, not absolute price.


    The fact that smaller coins are more popular in absolute terms is a psychological
    effect that many newcomers to crypto feel. They see that a Bitcoin costs €10,000
    and a Bitcoin Cash only €100. They then prefer to grab Bitcoin Cash without looking
    at the number of coins in circulation.


    As already mentioned, Bitcoin leads the cryptocurrency rankings by a wide margin.


    ![](Image00004.jpg)Bitcoin dominance describes what share Bitcoin accounts for
    in the overall crypto market. Bitcoin dominance has been in the range of 70% since
    the emergence of blockchain technology. This means that Bitcoin alone holds 70%
    of the total capital of the crypto market. All altcoins together hold only 30%
    of the capital.


    This Bitcoin dominance has fluctuated over the years. Bitcoin dominance has been
    below 30% at a low point, but it has also been above 90%.


    If you are a frequent visitor to crypto exchanges, you will often hear terms like
    "market capitalisation" and "bitcoin dominance". There are many websites where
    the current data can be viewed.


    The first place to look at the current price and ranking of the largest cryptocurrency
    is the website coinmarketcap.com.


    ![](Image00063.jpg)


    Figure 43 CoinMarketCap logo


    Coinmarketcap is a huge database in which the prices of almost all existing cryptocurrencies
    are displayed up to the minute. Here we can find out about the current price of
    the cryptocurrencies as well as their performance. The page shows the average
    of all stock exchanges on which the cryptocurrencies are listed. This is the same
    procedure as determining the current stock market price of a share. The bitcoin
    dominance is also displayed on CoinMarketCap.


    ![](Image00064.jpg)


    Figure 44 Extract from CoinMarketCap of Tether-USDT


    When looking at the prices of certain coins, it is noticeable that some coins
    neither fall nor rise over time, for example the cryptocurrency USDT. Is this
    a coincidence?


    6.1.         Stablecoins


    In the early days of the crypto market, there were still some problems. The crypto
    exchange Bitfinex , for example, recognised the problem that every purchase and
    sale of cryptocurrencies had to go through a bank.


    ![](Image00065.jpg)


    Figure 45 Bitfinex logo


    If we want to buy Bitcoins, we have to deposit money into a bank account. In return,
    we receive Bitcoins. With blockchain technology, we already have the perfect method
    with which we can circumvent exactly that.


    To remove this middleman from the buying and selling process, the company Bitfinex
    has created a cryptocurrency that replicates the value of one US dollar.


    For this, one billion US dollars were deposited in a bank account and one billion
    so-called tethers (USDT) were offered for purchase.


    ![](Image00066.jpg)


    Figure 46 Tether logo


    Bitfinex is an exchange for cryptocurrencies. The exchange has a great financial
    incentive to offer a "digital US dollar" for trade. Every time USDT is exchanged
    for Bitcoin or other cryptocurrencies, the exchange now earns and not the bank.


    Instead of selling your Bitcoins for "real" money, you can exchange them for USDT.
    The company behind Tether guarantees that we will also get paid one US dollar
    for the Tether coin if needed. Actually, the price of the currency would fluctuate,
    just like all other cryptocurrencies. Tether actively counteracts this.


    If the demand for coins is too low, Tether compensates for the price fluctuations
    by buying the coin. If, on the other hand, the demand for coins is too high, Tether
    counteracts this by issuing new coins so that the nominal value of 1 USD can be
    maintained.


    ![](Image00067.jpg)


    ![](Image00004.jpg)Because these types of coins, like Tether, have a stable value,
    they are called stablecoins .


    Stablecoins are an important component of the cryptosystem. They form a kind of
    bridge from gold or fiat currencies, like the euro, the dollar, the yen or the
    Swiss franc, into the crypto world. Stablecoins are coins that are linked to a
    comparative value and backed by a real equivalent value.


    Another aspect regarding the issuance of the Tether Coin was that these cryptocurrencies
    were not considered currency by financial authorities, and, as a result, many
    regulatory hurdles for the Bitfinex exchange were removed.


    As in the paper money system, it is important for stablecoins that the currency
    is backed. Covered means that for each Tether coin, a corresponding US dollar
    is also frozen in a bank account. This is the only way to ensure the value of
    Tether. Let''s imagine that there are a billion Tether-Coins, but only one million
    dollars are deposited in a bank account. If all the holders wanted to exchange
    their Tether Coin for fiat money at the same time, it wouldn''t work. In our banking
    system, this is commonplace. The banks usually own less than 5% of the money they
    lend. Now, if people want to physically withdraw their money, as in the Greek
    crisis, it is simply not possible because the bank does not have enough funds.


    Analogous to the printing of money by the central banks, a multiplication of tethers
    without a real countervalue being deposited would be a devaluation of the existing
    money.


    It is precisely regarding this aspect that there has been criticism of Tether
    for a long time. The company behind Tether cannot prove beyond doubt that it really
    owns the money. However, this is essential for the stabilisation of the USDT.


    Bitfinex is currently facing lawsuits in relation to Tether. The New York Attorney
    General''s Office accuses Bitfinex of creating Tether out of thin air and manipulating
    the Bitcoin price through its enormous market power by buying or selling Bitcoins
    with Tether.


    As soon as a central institution has a monopoly over the money supply, the creation
    and abuse of money is tempting.


    For this reason, other exchanges have removed USDT and issued their own stablecoins.


    Next, let''s look at the cryptocurrency that comes in second place behind Bitcoin.


    6.2.         Ethereum


    Ethereum has been the second largest cryptocurrency for years. We have already
    touched on Ethereum in the chapter on mining and hard forks. In the following,
    we want to explore the idea behind Ethereum, because unlike Bitcoin, Ethereum
    is no ordinary cryptocurrency.


    Ethereum was first introduced in 2013 and implemented in 2015. Unlike Bitcoin,
    the founders are known and in constant exchange with the community. The developers
    Vitalik Buterin and Gavin Wood are the face of the Ethereum project. Vitalik Buterin
    in particular is often in the spotlight and is considered the figurehead of Ethereum.
    He developed Ethereum at the age of only 19, has an IQ of 257 and is the most
    famous person in the crypto field.


    Meanwhile, the Ethereum project is also being further developed by the Ethereum
    Foundation, which is based in Switzerland.'
