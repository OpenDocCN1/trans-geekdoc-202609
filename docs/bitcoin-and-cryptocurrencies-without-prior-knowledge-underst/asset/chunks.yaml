    \n1.  Foreword\n\nBitcoin - a topic that divides opinion. For some, Bitcoin is\
    \ not only a digital currency, but a revolution against the entire financial system.\
    \ Others retort that Bitcoin has no intrinsic value and you'd better sell your\
    \ holdings quickly because it will soon be worthless.\n\nAlthough both sides make\
    \ valid points, and regardless of how one feels about blockchain technology, Bitcoin\
    \ has defied all opponents in recent years. The price of a Bitcoin has soared\
    \ several times, and over time Bitcoin, just like all other cryptocurrencies,\
    \ has seen tremendous growth, so it at least makes sense to investigate the issue.\
    \ Blockchain technology is being researched or already being used in many areas,\
    \ that can no longer be denied. The revolution ahead of us is comparable to the\
    \ revolution of digitalization. Who has benefited from digitalization? The people\
    \ who got to grips with the matter at an early stage. Who has not benefited from\
    \ digitalization? The people who were stuck on their old principles and were not\
    \ open to new technologies. So it really makes sense to get to grips with new\
    \ technologies like blockchain or bitcoin at an early stage.\n\nWhat is Bitcoin?\
    \ Is Bitcoin the same as blockchain? And what other cryptocurrencies are there?\n\
    \nBitcoin is on everyone's lips, whether on public television or in private circles.\
    \ A lot of half-knowledge is prevalent, and many terms are confused or used in\
    \ the completely wrong context.\n\nThis is not surprising—after all, the technology\
    \ is new and relatively complex. A layman is not expected to read up to the deepest\
    \ level of programming. This requires several years of computer science studies.\n\
    \nNevertheless, the topic of blockchain and bitcoin is by no means as complex\
    \ as it might first appear. Only a certain technical understanding and enthusiasm\
    \ for the topic are necessary to understand the mechanisms.\n\nSince you bought\
    \ this book, you seem to have the enthusiasm for the subject. You want to understand\
    \ the basics and the structures around Bitcoin and cryptocurrencies. Maybe you\
    \ are thinking about investing in Bitcoin but want to explore the technical background\
    \ first. Maybe you just want to have a say the next time Bitcoin or Blockchain\
    \ is mentioned at the regulars' table. Or maybe you're a critic looking for weaknesses\
    \ in the technology - because Bitcoin and other cryptocurrencies have those too!\n\
    \nIn any case, you will not regret having dealt with the matter.\n\nBooks on blockchain\
    \ technology are mostly either purely focused on the monetary aspect of Bitcoin\
    \ and cryptocurrencies or written in such a technical way that they require several\
    \ years of computer science studies to follow the book content.\n\nHowever, these\
    \ books are completely unsuitable for newcomers: page-long programme lines that\
    \ you forget after a week. The result is confusion. This demotivates and quickly\
    \ causes many interested people to close their minds to the subject. This is not\
    \ because of the readers, but because they simply do not belong to the target\
    \ group of the book. You don't have to be an Einstein to understand the technology\
    \ behind Bitcoin, you just have to be motivated to deal with the matter.\n\nAnd\
    \ it is precisely from this way of thinking that this book has emerged.\n\nIt\
    \ provides a beginner's guide for inquisitive people who want to learn the basics\
    \ of blockchain, bitcoin and other cryptocurrencies without much prior knowledge.\n\
    \nPrerequisites and level of knowledge:"
