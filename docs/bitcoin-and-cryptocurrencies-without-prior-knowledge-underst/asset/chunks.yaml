  fmt: '

    This book is suitable for anyone with a basic enthusiasm for cryptography. There
    is also a bit of mathematics, but at a very manageable level, so that any reader
    can follow along easily.


    The book is suitable for beginners. The chapter contents are designed in such
    a way that they are understandable even without prior knowledge. Since the book
    is also intended to offer added value to readers with prior technical knowledge,
    some of the technical details of the blockchain are dealt with in detail. These
    details and digressions can seem daunting at first glance but are not essential
    for general understanding. Even as a superficial user of the technologies, however,
    it is useful to have the background illuminated, even if one cannot reproduce
    everything in the smallest detail afterwards.


    In addition, many new terms are introduced. If a term needs to be looked up while
    reading, the index at the end of the book will help.


    Since the basic knowledge of our monetary system as well as encryption techniques
    are essential for understanding, the first chapters deal with them specifically.


    For a better structure, the following icons can be found again and again at certain
    points in the book:


    ![](Image00000.jpg) **Light bulb**: Here the key points of a chapter are summarised.
    These statements are good for reference or if you want to skim over a subject
    area again.


    ![Picture 4](Image00001.jpg) **Attention**: Common mistakes are listed here. It
    is shown where and why one often encounters obstacles or wrong assumptions.


    ## 2. Entry and basic knowledge


    The monetary system as we use it today determines almost all areas of our lives,
    whether it''s choosing our career path, financing our home or taking a summer
    holiday.


    Of course, money alone does not make people happy, but there are numerous studies
    that show that money problems cause increased stress levels. That is why it is
    important to deal with the money system at an early age. Where does money come
    from? What is the function of money? How do banks earn their money?


    Unfortunately, there is a huge gap in financial education. Economic contexts are
    usually not part of the school curriculum and are therefore only insufficiently
    taught. Yet fundamental mechanisms are at work in the market that have a significant
    influence on everyone''s everyday life.


    It is therefore important to know what this money is, how it has developed historically
    and what problems are associated with it.


    To get an overview of the current system and its strengths and weaknesses, let''s
    start by taking a look at the history of our money.


    ### 2.1 The history of money


    The history of money goes back to the origin of mankind.


    Until about 2000 years before Christ, it was common for goods and commodities
    to be exchanged directly. At markets or shops, all yields were brought together
    and exchanged. The farmer gave part of his surplus grain for a few woolen blankets,
    the cobbler a pair of shoes for fresh milk and fish, and so on. Relatively quickly
    it became clear that it made more sense not to trade goods directly, but to trade
    a substitute product that unified the value of the different goods. At the same
    time, this substitute must be smaller, more manageable and remain stable for longer,
    i.e. it must not become mouldy or worn out.


    The aim was to be able to store the manpower that is in the products in the long
    term.


    Relatively quickly, shells, diamonds and precious metals such as gold and silver
    were identified as potential stores of value. In the end, precious metals such
    as gold, silver and bronze compounds stood out.


    Gold was the primary, stable currency until the 16th century. But why, with so
    many possible commodities, did the choice fall on precious metals of all things?
    To understand this, let''s first take a look at the tasks of money or a currency.
    What properties must it possess, what problems does it solve?


    ### 2.2 What is money?


    We have already seen that it makes sense to introduce a time-independent store
    of value in the form of a currency.


    ![](Image00000.jpg) For the value of the currency to be maintained, it must be
    rare. Rare means that the commodity is only available in limited quantities. If
    the currency can be increased, the value decreases.


    This is the case, for example, with (hyper-) inflation. The amount of money is
    increased rapidly and as a result the purchasing power of the currency decreases.


    ![Picture 4](Image00001.jpg) Strictly speaking, other factors such as economic
    growth also play a decisive role. However, within the required precision of this
    book, we can neglect these aspects.


    The second elementary property of money is that it must be difficult to produce.
    This primarily serves to protect against counterfeiting. This is also the case
    with gold. It is very costly to recover gold from the earth''s crust and to mint
    coins.


    This brings us directly to the next essential point of a functioning currency:
    substitutability. Substitutability means that several objects within a currency
    class have the same value. A `€10` note is worth the same as another `€10` note.
    This is not the case with shells or diamonds, and that is why they have not become
    accepted as a means of payment. With diamonds, for example, there are different
    degrees of value. Two diamonds that look the same can still have a different value.
    Only an expert can determine the true value.


    Gold, on the other hand, can be melted and pressed into coins of the same size
    and weight - this ensures replaceability. In addition, you can decide for yourself
    how big the coins should be.


    ![](Image00002.jpg) A currency must be transportable, divisible and counterfeit-proof
    in order to ensure smooth trade.


    The last criterion is also the most important criterion for a stable currency
    and will be discussed more often in this book: We are talking about trust.


    Trust is the central building block of the monetary system, and gold has earned
    this trust over thousands of years as a safe means of payment. Gold is therefore
    often referred to as a "safe" investment or "safe haven". Gold itself has no intrinsic
    value. You cannot eat it or make clothes out of it. A piece of jewellery looks
    visually appealing, but nowadays it is largely independent of the current gold
    price.


    The mere confidence that we will receive goods from a third party for a piece
    of gold makes it possible to use gold as a means of payment.


    However, gold and gold coins also have disadvantages. For one thing, they are
    relatively difficult to produce. This plays into the hands of counterfeit protection;
    however, this has turned out to be very impractical from today''s perspective.
    In addition, the divisibility or resolution is limited. Today, a fine ounce of
    gold (`1 oz tr. = 31.1 g`) is around `1500-2000 USD`. If we would like to get
    one eurocent of change at the cash register, we would get back `0.0002 g` of gold.
    Therefore, this is not feasible.


    ![](Image00000.jpg) Therefore, the idea has come up to keep the gold as a basis
    of exchange, but no longer to exchange directly with the gold, but to create a
    kind of promissory note that can be traded more easily.


    What is important in this context is that behind each of these promissory notes
    ![Picture 4](Image00003.jpg)or paper notes there was a piece of physical gold
    that could be exchanged for the note at any time. Central banks issued the notes
    and stored the deposited gold.


    This concept of a currency being backed by a commodity such as gold or silver
    is called the gold standard.


    The confidence that we will get our piece of gold back for our promissory note
    is guaranteed by the bank.


    This system has many advantages. Paper is light and can be produced in large but
    also small quantities. Different banknotes represent different divisions.

    '
