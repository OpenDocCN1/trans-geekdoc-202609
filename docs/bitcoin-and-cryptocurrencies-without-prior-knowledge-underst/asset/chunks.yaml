- raw: 'When the price of a currency rises or falls in a short time, it means that
    many people are buying or selling BTC. Accordingly, the networks are busy, and
    transactions are higher. As described in the chapter Mining Difficulty , the transaction
    cost for Bitcoin was over 40 USD at peak times. This means: If we wanted to send
    BTC for €10, we had to pay almost four times the cost just for the transaction!


    These costs are displayed in a wallet or the exchange before a transaction is
    sent. If we are not in a hurry, we can set a lower transaction fee. If this is
    not possible, it may make sense to wait a few hours or days to make the transaction
    until the network has calmed down.


    If our transaction fees are set too low, ![Picture 4](Image00003.jpg)the miners
    will not forward the transaction to the network but put it in a "queue." This
    means that in the worst case our transaction is trapped in a queue for a fortnight
    (in the case of Bitcoin) before it is finally rejected.


    The transaction fee we choose should always be in the normal range and fit the
    load of the network. Wallet providers know about this issue and often suggest
    a suitable transaction fee.


    If you are interested in the current network load, you can look up the required
    transaction fees at [https://bitcoinfees.earn.com/](https://bitcoinfees.earn.com/)
    , for example. There, it is indicated what the fees are and how long the transaction
    time is.


    Scams


    Even though Bitcoin has existed for over ten years, the crypto market is still
    in its infancy. There is a great deal of ignorance or half-knowledge in many areas.
    As always when a market is still very unregulated, fraudsters are attracted who
    want to enrich themselves through nasty tricks. To avoid becoming a victim ourselves,
    there are a few things to keep in mind.


    Becoming victim to fraud is called a scam .


    A pyramid scheme, i.e. a scheme that has no real product and can only grow by
    attracting new customers, is a typical example of a scam.


    An example of one of the biggest scams in the history of cryptocurrencies, which
    cost many people a fortune, was the website Bitconnect or the associated coin
    Bitconnect BCC. The site went online in spring 2016.


    Bitconnect promised customers 0.25-2% daily  return on their assets if they exchanged
    their Bitcoins for Bitconnect coins.


    When larger amounts such as USD 5,000, USD 10,000 or USD 100,000 were deposited,
    there were additional returns of 0.25% up to 1%.


    How was this possible? According to Bitconnect, it had developed an artificial
    intelligence that buys and sells Bitcoins at the right time by observing price
    movements on the crypto market and thus makes a profit.


    It was noticeable that Bitconnect spent a lot of money to acquire new customers.
    They paid influencers with several million followers to aggressively promote the
    Bitconnect site. Each person who recruited new customers sometimes received up
    to 10% of the new customers'' deposits.


    It was propagated that one could increase one''s money by 37 times within one
    year. Although common sense tells us that such a principal can never have a legitimate
    basis, Bitconnect collected millions in investor money.


    In reality, it was a pyramid scheme. The new customers'' money was distributed
    to the older customers to create a legitimate impression. The early customers
    and influencers publicly showed that the money was actually received.


    This pyramid scheme became so popular in the meantime that the Bitconnect coin
    rose to become the fourth largest cryptocurrency, with a market capitalisation
    of USD 2.6 billion.


    Despite warnings from Ethereum founder Vitalik Buterin, for example, the greed
    of many investors was greater than their intellect.


    In 2017, state authorities stepped in and threatened to take the site offline
    if the legality of the business model was not proven. Initially, all allegations
    were denied and the marketing department of Bitconnect did its best not to let
    the tarnished reputation break completely.


    Gradually, however, the obvious could no longer be countered. From one day to
    the next, a statement was made that Bitconnect would no longer exist. In January
    2018, Bitconnect disappeared from the scene. Reasons for this were allegedly the
    bad press and ongoing hacker attacks on the website.


    The Bitconnect Coin lost over 99% of its value until it was completely suspended
    from trading in August 2018. All investors who had invested lost virtually all
    their deposits.


    ![](Image00100.jpg)


    Figure 71 Price trend of the Bitconnect (BCC) coin


    What does this negative example show us? First of all, it is simple to set up
    a large-scale scam that lasts for months and was worth 2.6 billion USD in the
    meantime.


    This was only possible because incredible returns were advertised, and people
    were reckless due to greed.


    ![Picture 4](Image00003.jpg)Before we invest in a coin, a project or other niches
    of the crypto market, we should always question whether the project is possible
    and makes sense from a neutral point of view. Who are the people behind the projects?
    How is the business model structured? Are there already critical reports?


    Moreover, the saying also applies in the crypto market:


    "If it''s too good to be true, then it''s very likely not true."


    In addition to large-scale projects that are set up as a scam, false advertisements
    with prominent faces are also put up to make a malicious homepage look trustworthy.


    Pictures and fictitious quotes from celebrities were misused to lead unsuspecting
    people to websites and invest money in fictitious business models.


    These headlines lured customers to fraudulent homepages where victims were tricked
    into investing money or handing over their private keys through several promises.


    The money and the coins are usually never seen again, and the perpetrators can
    hardly be prosecuted by the police because they are based abroad or act completely
    anonymously.


    ![Picture 4](Image00003.jpg)In any case, the same rules apply in the crypto realm
    as with all digital content: Never, under any circumstances, should we pass on
    our private key or other passwords to third parties.


    At this point, it should be mentioned that cases of fraud have decreased significantly
    and occurred mainly at the beginning of the crypto boom. In the meantime, there
    are plenty of verified points of contact for buying and selling cryptocurrencies.


    As a conclusion of this chapter, we can state that entering the world of cryptocurrencies
    has become much easier in recent years. We don''t have to have a degree in computer
    science behind us to be able to participate in the crypto market. In particular,
    exchanges like Binance, e-Toro or Coinbase have become much more user-friendly.
    However, we always have to weigh up how much we trust central companies or where
    we want to store our private keys ourselves.


    Through extensions of HD wallets and the storage of simple seeds, the barriers
    to entry have fallen significantly. In the meantime, buying cryptocurrencies hardly
    differs from opening a normal bank account or share deposit.


    In summary, the most important thing we have learned about security is that we
    should treat Private Keys like cash. We must keep our private keys safe and secure
    and never share them with a third person.


    8.  The future of blockchain


    We have learned all the basics of blockchain and bitcoin, and now know what is
    important when buying or selling and what to be wary of.


    After learning about the technology, examples, strengths and weaknesses of the
    most common cryptocurrencies and blockchain technology, we turn to the question
    of what the future will bring. Of course, no one has ever been able to reliably
    predict the future.


    "I think there is a market for maybe five computers worldwide."


    Thomas Watson, Chairman of IBM, in wartime 1943'
  fmt: '

    When the price of a currency rises or falls in a short time, it means that many
    people are buying or selling `BTC`. Accordingly, the networks are busy, and transactions
    are higher. As described in the chapter `Mining Difficulty`, the transaction cost
    for `Bitcoin` was over 40 USD at peak times. This means: If we wanted to send
    `BTC` for `€10`, we had to pay almost four times the cost just for the transaction!


    These costs are displayed in a wallet or the exchange before a transaction is
    sent. If we are not in a hurry, we can set a lower transaction fee. If this is
    not possible, it may make sense to wait a few hours or days to make the transaction
    until the network has calmed down.


    If our transaction fees are set too low, ![Picture 4](Image00003.jpg)the miners
    will not forward the transaction to the network but put it in a "queue." This
    means that in the worst case our transaction is trapped in a queue for a fortnight
    (in the case of `Bitcoin`) before it is finally rejected.


    The transaction fee we choose should always be in the normal range and fit the
    load of the network. Wallet providers know about this issue and often suggest
    a suitable transaction fee.


    If you are interested in the current network load, you can look up the required
    transaction fees at `https://bitcoinfees.earn.com/`, for example. There, it is
    indicated what the fees are and how long the transaction time is.


    ## Scams


    ### What is a Scam?


    Even though `Bitcoin` has existed for over ten years, the crypto market is still
    in its infancy. There is a great deal of ignorance or half-knowledge in many areas.
    As always when a market is still very unregulated, fraudsters are attracted who
    want to enrich themselves through nasty tricks. To avoid becoming a victim ourselves,
    there are a few things to keep in mind.


    Becoming victim to fraud is called a `scam`.


    A pyramid scheme, i.e. a scheme that has no real product and can only grow by
    attracting new customers, is a typical example of a `scam`.


    An example of one of the biggest scams in the history of cryptocurrencies, which
    cost many people a fortune, was the website `Bitconnect` or the associated coin
    `Bitconnect BCC`. The site went online in spring 2016.


    `Bitconnect` promised customers 0.25-2% daily return on their assets if they exchanged
    their `Bitcoins` for `Bitconnect` coins.


    When larger amounts such as `USD 5,000`, `USD 10,000` or `USD 100,000` were deposited,
    there were additional returns of 0.25% up to 1%.


    How was this possible? According to `Bitconnect`, it had developed an artificial
    intelligence that buys and sells `Bitcoins` at the right time by observing price
    movements on the crypto market and thus makes a profit.


    It was noticeable that `Bitconnect` spent a lot of money to acquire new customers.
    They paid influencers with several million followers to aggressively promote the
    `Bitconnect` site. Each person who recruited new customers sometimes received
    up to `10%` of the new customers'' deposits.


    It was propagated that one could increase one''s money by 37 times within one
    year. Although common sense tells us that such a principal can never have a legitimate
    basis, `Bitconnect` collected millions in investor money.


    In reality, it was a pyramid scheme. The new customers'' money was distributed
    to the older customers to create a legitimate impression. The early customers
    and influencers publicly showed it.

    '
