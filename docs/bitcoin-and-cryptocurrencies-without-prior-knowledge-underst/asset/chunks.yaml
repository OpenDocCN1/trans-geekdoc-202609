- raw: 'The "encrypted" message represents a digital signature . Bob, on the other
    hand, can use Alice''s public key to decrypt the message. Since only Alice has
    her private key, the message must have come from Alice.


    ![](Image00013.jpg)


    Figure 6 Digital signature of a message


    The signature itself does not constitute encryption. After all, the public key
    is accessible to everyone. Anyone can check whether the message ![Picture 4](Image00003.jpg)came
    from Alice or not. If we want to both encrypt and sign the message, we have to
    combine the two.


    Alice encrypts the message with Bob''s public key so that only Bob can decrypt
    the message. Alice then signs the already encrypted message with her private key.


    ![](Image00014.jpg)


    Figure 7 Digitally signing and then encrypting a message


    ![](Image00004.jpg)When Bob receives the message, he can use Alice''s public key
    to confirm that the message came from Alice. He obtains the content by decrypting
    the message with his private key.


    With this, we have already discussed the basics of asymmetric encryption and digital
    signatures.


    In the next step, we look at the algorithms that are used for verification. These
    take on the function of a "watchdog" and confirm that, for example in the case
    of Bitcoin, a transaction, i.e. the sending of Bitcoins back and forth, has taken
    place according to the rules.


    In a centralised system, the central unit (for example a bank), acts as a guardian.
    The bank checks whether we have enough money in the account, whether the money
    is directed to a valid address, etc. In a decentralised system, there is no entity
    that performs these functions. That is why we need cryptographic algorithms.


    There are various algorithms that are used nowadays. These are also called auxiliary
    functions of encryption .


    The function or algorithm is called a hash function or hashing algorithm.


    Hash functions must have various properties which we will now take a closer look
    at. We have already learned most of them.


    ![](Image00015.jpg)Hash functions are one-way functions . This means that calculating
    the output of the function is simple. However, it is almost impossible to determine
    the input using the output. Hash functions are used as auxiliary functions in
    cryptocurrencies.


    Different cryptocurrencies are based on different algorithms. We will take a look
    at the algorithm underlying Bitcoin as an example.


    Bitcoin has two algorithms. One algorithm generates our public key from our private
    key. The other algorithm is responsible for the security of the network and the
    stored transactions.


    Bitcoin uses, among other things, an elliptic curve with the functional equation
    to generate the public key. ![](Image00016.jpg).


    ![](Image00017.jpg)


    Figure 8 Diagram of an elliptical curve


    This complex one-way function uses our password (private key) to create a public
    key from which our Bitcoin address can be derived. We will take a closer look
    at how this is implemented in practice later. First, we will look at the algorithm
    that is responsible for the security of the blockchain.


    This algorithm is called the SHA256 algorithm. SHA stands for Secure Hash Algorithm
    . The function is relatively simple from the user''s point of view.


    The SHA256 algorithm guarantees Bitcoin''s security. We will take a closer look
    at how Bitcoin implements the algorithm later. The application of the algorithm
    is always the same:


    We pass a plain text to the function. Within the function, the letters are shifted,
    swapped, compressed or added in several stages.


    ![](Image00018.jpg)


    Figure 9 Sequence of a hash function


    How we have to shift the letters, compress them, and so on is fixed by the SHA256
    algorithm.


    After several stages, we get an "encrypted message" as output. The output of the
    SHA256 function is called a hash . A hash is a kind of checksum , control or security
    number . However, it depends very much on the context.


    ![](Image00004.jpg)The performance or application of a hashing function is comparable
    to the application of a function to a variable, as they are known from school
    lessons. Theoretically, we can calculate the SHA256 hash of a text on a piece
    of paper and a pencil.


    ![](Image00019.jpg)


    Figure 10 Calculating a SHA256 algorithm with paper and pencil


    Source: https://www.youtube.com/watch?v=y3dqhixzGVo&ab\_channel=KenShirriff


    The number 256 of the hashing algorithm indicates the length of the output, i.e.,
    the calculated, encrypted message. The output characters are called bits and can
    only be one or zero.


    The output of the SHA256 algorithm is always exactly 256 bits long. It does not
    matter whether the input consists of a single character or hundreds of thousands.


    ![](Image00020.jpg)The input of a hash function is arbitrarily large, the output
    is independent of it and always constant, in the case of SHA256 it is exactly
    256 bits long.


    ![](Image00021.jpg)


    Figure 11 Simplified representation of the SHA256 hash function


    Since the message only consists of 1 and 0, it is neither legible nor does it
    follow a system.


    Often, for better clarity, four of these bits are combined and displayed as a
    number or letter. The character string is then shortened to 80 or 64 characters
    instead of 256.


    ![](Image00020.jpg)The hashing algorithms are freely accessible. Anyone can load
    them onto their computer and confirm the result.


    As an example, let''s encrypt our message "Bitcoin is awesome!" again. The resulting
    hash, represented as a string (64 characters), looks like this:


    "d75c79bd1c2807154411c6aafbcaf8ccf9cd81b6ae63ee48bb141000e39213e0"


    ![](Image00022.jpg)


    Figure 12 Application of the SHA256 hash function


    We recognise that we cannot draw any conclusions about the original message from
    the hashes.


    It is also important that if we change just one character of our message, the
    resulting hash changes not just slightly, but fundamentally.


    For example, if we only change the spelling of the word Bitcoin to Bit-coin, we
    get different hashes.


    "Bitcoin is awesome!" results in the already known hash.


    "d75c79bd1c2807154411c6aafbcaf8ccf9cd81b6ae63ee48bb141000e39213e0"


    "Bit-coin is awesome!" , on the other hand, results in the hash


    "8b8b302aeddc97b6d9cb9f6087df8137f123e78540585e58aca5e5e494925efd".


    ![](Image00004.jpg)The hashing algorithms are, as already mentioned, openly accessible
    and anyone can see how they work. However, due to the complexity, it is not possible
    to conclude from the output to the input.


    We will see how a hash function is used by looking at how passwords are stored.


    When we set a new password in our PC, in for example our e-mail account or the
    online shop of our choice, it would be very insecure if the passwords were stored
    in plain text on the providers'' servers.


    Instead, the PC generates a hash of the password and stores it.


    ![](Image00004.jpg)In the case of a password query, the password entered is again
    converted into a hash. If it corresponds to the stored hash, the password is correct,
    otherwise the password entered was not the same.


    Now we also understand why we cannot get the password from our provider in plain
    text. The provider does not have the password itself, but only the hash of the
    password, which does not allow us to draw any conclusions about the password.
    If we have forgotten our password, we can only reset it, but not display it.


    If a hacker attacks the provider''s server, he can optimally only steal the hash,
    but not the password in plain text.


    Hashing algorithms thus guarantee a certain degree of security. Furthermore, hashing
    algorithms can help to ensure the integrity already mentioned.


    If we want to be sure that a message has not been tampered with, we can ask the
    sender to convert the message into a hash and make it publicly available. The
    hash only matches that message. If we change just one letter, the hash changes
    completely unpredictably.


    Using the hashes, no one can decrypt the message, because back-calculating the
    hashing function is almost impossible.'
