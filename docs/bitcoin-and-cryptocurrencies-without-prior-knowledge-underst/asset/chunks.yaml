- raw: 'The focus of large companies like Google is certainly not on attacking cryptocurrencies
    during development.


    The objection to this is that we have seen in the last 50 years how quickly technology
    can advance. Let us therefore assume that quantum computers develop into everyday
    devices.


    As soon as it becomes apparent that quantum computers could pose a threat to cryptographic
    algorithms, the network will replace the previous algorithms with quantum-safe
    algorithms. As we have seen, this is easily done by a fork. The SHA256 algorithm
    can be replaced by another, quantum-safe algorithm, and the network will continue
    to run as before. Furthermore, we have already seen that the SHA256 algorithm
    is also used by governments and intelligence agencies. These face the same theoretical
    attack scenarios.


    ![](Image00004.jpg)Quantum-safe algorithms already exist. Whether quantum computers
    will ever pose a real threat to cryptography or whether it will remain a theoretical
    problem is something that even quantum physicists cannot predict beyond doubt.


    In any case, it is easy for the Bitcoin network to avoid such a scenario. Again,
    this argument has no deeper substance that could make Bitcoin dangerous.


    Now that we have dispelled many technical myths, let''s take a look at some economic
    aspects.


    9.7.         Bitcoin is used for illegal activities


    You often hear in the news that Bitcoin and other cryptocurrencies are used by
    the Mafia or terrorist organisations for illegal activities on the dark net. Especially
    in the early years of cryptocurrencies, this was indeed the case.


    Bitcoin was considered a private coin due to its low profile and was used to buy
    weapons and drugs. This was possible because the Bitcoin network was not yet widespread,
    and there was no pseudo-anonymity. Nowadays, the network is more widespread. The
    entry and exit points into the Bitcoin network, i.e. the crypto exchanges, are
    for the most part more tightly controlled by state institutions.


    Due to its transparency and the resulting pseudo-anonymity, Bitcoin is completely
    unsuitable to be used as a means of payment for illegal activities.


    ![](Image00004.jpg)Cryptocurrencies are used for less than one percent of all
    illegal transactions. Most of these transactions take place via fiat currencies,
    primarily cash. This is unlike open blockchains such as Bitcoins.


    Because with Bitcoin, everyone can see the transaction history and knows exactly
    who has how much money and who has sent money to whom. This is so widespread that
    it is known in “insider circles" which addresses and which coins originate from
    illegal activities. These have virtually no value for the community anymore. Nobody
    wants to receive a coin from an address that is known to be the account of a drug
    or Mafia boss.


    ![](Image00120.jpg)The coins that can be associated with illegal activities are
    also called tainted coins .


    Tainted coins are coins that are linked to illegal activities and are therefore
    almost not accepted by the community. They are worth less than other coins. This
    is also the case with Bitcoin due to the transparent blockchain.


    As the network grows and more transactions are made, more and more coins will
    be tainted or partially tainted over time.


    Large exchanges also keep databases in which coins are considered to be tainted.
    This means, for example, that an exchange will reject coins if a large part of
    the coin is tainted.


    The problem of tainted coins can be solved by mixing tainted coins with non-tainted
    coins. Here again, private coins like Monero or Dash offer a solution. If a tainted
    coin is added to a transaction pot with 99 "clean" coins, the output is only 1%
    tainted on average.


    On the one hand, this makes sense, as it does not further limit the money supply
    because some coins are worth less than others.


    On the other hand, this in turn opens the door to illegal activities. However,
    we have already seen that it can make sense to ensure a certain degree of privacy.


    A compromise must be found between security and freedom or security and privacy.


    But why do we need privacy at all? Surely those who have nothing to hide won''t
    resort to a private coin, will they?


    Here we take the idea further that Bitcoin will establish itself as a means of
    payment and that we will make everyday payments through Bitcoins. Do we really
    want everyone to be able to see how much money we have? Do we really want everyone
    to be able to see that we paid the doctor or how much we spent on our new car?


    Transparency also has its negative sides.


    For this reason, extensions are already being developed to limit transparency
    and advance anonymisation. Extensions such as the use of seeds or the Lightning
    network can also help.


    Another example is CoinJoins . Simply put, the transactions of several users are
    collected and mixed. As a result, it is no longer possible to clearly trace who
    sent BTC to whom.


    ![](Image00121.jpg)


    Figure 87 Obfuscation of direct transactions using CoinJoins wallets


    However, this is less well received by authorities and exchanges. Some exchanges
    already do not accept coins sent from "private wallets."


    ![](Image00004.jpg)In summary, Bitcoin is not primarily used for illegal activities
    and is also completely unsuitable for this due to its high transparency.


    9.8.         Bitcoin is too expensive and pure speculation


    Bitcoin and its price are driven up by speculators. Normal citizens can never
    afford a Bitcoin because no one can spend thousands of euros on a coin.


    Here, too, we see parallels to other arguments, for example that Bitcoin is a
    bubble and has no intrinsic value.


    First, we debunk the argument that a normal citizen can never afford a Bitcoin.


    The argument is understandable. If Bitcoin is hypothetically going to rise to
    1 million, we will get just 0.00001 BTC for €10. This acts as a deterrent as a
    currency, because no one wants to calculate in currency units that start with
    four zeros after the decimal point.


    However, we have also seen that one Bitcoin itself is divisible into up to 100
    million Satoshi. For our €10, we would get 1,000 satoshi in the same scenario.
    That sounds much more feasible, doesn''t it?


    The representation of the currency is therefore also not a problem with Bitcoin.
    A big problem at present, however, are the strong price fluctuations triggered
    by speculators.


    On this point, we have to agree completely with the critic. At the moment, the
    price is unpredictable. Price drops of 70% are almost normal.


    From today''s perspective, the price of Bitcoin is still highly volatile. However,
    we have also seen that the long-term trend is upwards.


    The crypto market is still very small. All cryptocurrencies together have just
    10% of the market capitalisation of the gold market. Moreover, it is correct that
    many people have not dealt sufficiently with the fundamental, technical data.
    The trust in Bitcoin is not yet sufficiently developed.


    In this small, unregulated market, it is easier to trigger large price fluctuations
    or even manipulate the market in some cases. Especially in the case of smaller
    cryptocurrencies, it happens time and again that several large investors join
    forces to influence the price of an insignificant coin upwards or downwards.


    Two psychological factors play a major role here. These can be seen not only in
    the crypto market, but also in the gold market, the stock market or all other
    asset classes.


    When an asset class rises rapidly in a short period of time, it stirs up a psychological
    fear. You don''t want to be the only "idiot" who doesn''t get rich while everyone
    else is increasing their money. For this reason, one buys, even if one is not
    sufficiently informed.


    The aforementioned FOMO effect is also an emotional driver in these situations.'
