    # Litecoin Overview


    Litecoin (abbreviation `LTC`) is often referred to as Bitcoin''s little brother
    and is technically almost 1:1 identical to the Bitcoin system. Only the name and
    some parameters have been changed. For example, the targeted block time was reduced
    from ten minutes to 2.5 minutes. This means that four times as many transactions
    can take place. At the same time, four times as many Litecoins are distributed,
    so that not 21 million but 84 million `LTC` form the upper limit of all Litcoins
    that ever occur. Litecoin has also recognised the problem that the `SHA256` algorithm
    can be calculated very efficiently using `ASICs`. An `ASIC` is as powerful as
    hundreds of computers. This makes it easier to centre the computing power of the
    network. Significantly fewer resources and energies are needed.


    That''s why Litecoin chose a different algorithm that was created specifically
    for "commodity hardware" to prevent centralisation of computing power. Litecoin''s
    `scrypt` algorithm cannot be calculated more efficiently by `ASICs`. Since the
    network as a whole is much smaller, an attack here is nevertheless much easier
    than with Bitcoin.


    ## Fork Methods


    The last fork method to be mentioned is the soft fork. As the name suggests, this
    is not a hard fork but a soft transition. The fork is more of an upgrade of the
    previous blockchain than a split. The advantage is that a `soft fork` is often
    backwards compatible. Analogous to updating a programme on your computer or smartphone,
    you can still use the old or the new version.


    After we have understood the principle of mining and learned about the different
    fork variants, let''s take a look at what influence mining has on the environment.


    ## 4.5 Impact of mining on the environment


    The objection is often heard in the media or on talk shows that it is all well
    and good that a few "geeks" send virtual coins back and forth to each other, but
    that in the meantime mining has taken on such proportions that all bitcoin mining
    consumes more electricity than some countries in total.


    We will take a closer look at why the electricity is not wasted but used sensibly.
    Nevertheless, the power-hungry mining computers should of course not be underestimated.


    Around 50% of miners are based in China. Although they are showing a major trend
    towards renewable energies, they are currently still relying heavily on coal and
    gas.


    Some climate activists have already called for a Bitcoin ban. Apart from the fact
    that Bitcoin cannot be banned (we will come to that later as well), some objections
    are quite justified.


    Here''s what we need to understand: Even though the financial system is not optimal
    and Bitcoin could be the solution, climate change and its associated impacts are
    very devastating. Climate change has an impact on people, on nature and also on
    the financial system.


    However, the power consumption of mining must always be considered relative to
    other power consumption. Recent studies show that slightly less than half of the
    energy used for mining is 100% renewable, and already around 80% of miners are
    on the switch to cheap, green energy sources. This is because energy generation
    from solar and wind power is cheaper than electricity from coal or oil. Bitcoin
    does not stand in the way of green energy but promotes it.


    Bitcoin supporters also state that bitcoin stands for a free financial system.
    It stands for a fundamental right of the people.


    Global telecommunications and consumer electronics, such as Netflix, video games
    and the like, consume many times more resources but make a much smaller contribution
    to a free society.


    ![](Image0005)


    Figure 3 Global consumption


    Source: `https://bitcoinmagazine.com/environmental-consumption`


    ## 4.6 Proof of Stake


    In contrast to `POW`, the security of a network is not guaranteed by providing
    computing power, but by requiring participants who validate a block to deposit
    credit in the form of coins.


    ![](Image0004)


    We can think of it as if everyone involved deposit credit as insurance. If someone
    has a bad intention, wants to falsify a block and is caught, he loses his credit.
    Therefore, no one has an incentive to step out of line.


    Everyone who has money is given the right to vote. Then, through a democratic
    vote, the blocks are verified. The more assets a person owns, the more voting
    rights he has. The rewards for solving the blocks (the transaction fees and block
    subsidies) are in turn paid to everyone who participated in the consensus.


    This procedure does not require energy-hungry calculating machines. In addition,
    we can see at any time which account has how many voting rights. The proof-of-stake
    algorithm is also advantageous for the holders of the coins. They receive a return
    for providing their coins in the form of the distributed coins. They do not need
    expensive calculators or cheap electricity prices.


    Even if the proof of stake procedure only offers advantages at first glance, there
    are some serious problems associated with it. For one thing, it is a capitalist
    system in which money or wealth automatically brings with it a certain claim to
    power.


    Moreover, those who already have the most wealth, even in absolute terms, receive
    the most rewards for solving a block. Gradually, monopolies form and gain more
    and more influence. We already see in our current world that the money supply
    becomes more and more over time. Over 50% of the world''s money supply is held
    by just 1% of the people. Applied to the proof-of-stake approach, this means that
    if this 1% of people got together, they would have enough voting power to change
    the rules of the blockchain. Of course, this is again a very hypothetical assumption,
    and there would be other mechanisms to prevent such a conglomeration as well.
    For example, it is the case that a fundamental system decision within the network
    requires 90% approval instead of 51%. A system decision would be, for example,
    the question of how the staking rewards, i.e. the "dividend", should be distributed.


    It should be noted that all blockchains based on `POS` show surprisingly few problems
    with monopolies.


    With the `proof-of-work` concept, on the other hand, such approaches are not possible
    in principle.

    '
