- raw: 'Large corporations like Tesla or Apple have long received most of their liquid
    funds in Bitcoin. For a long time, both currency systems can exist in parallel
    until the demand of central bank money declines to almost zero. While the purchasing
    power of the fiat currencies declines analogously to zero, the inflationary central
    system is weaned away, and Bitcoin is introduced as the new reserve currency.
    All liquid assets will be backed by Bitcoin - the only demonstrably finite asset.


    There will still be central institutions that issue bitcoin IOUs in the form of
    cash.


    ![](Image00106.jpg)


    Figure 76 Bitcoin is accepted as a means of payment


    Due to the deflationary character of Bitcoin, it is possible to accumulate a fortune
    by saving instead of being slowly expropriated. Consumption is less, but much
    more conscious. Companies have to deliver more quality so that people are willing
    to spend their money.


    Admittedly: This idea requires a lot of imagination at this point in time. It
    will take many years for central institutions to relinquish their power over the
    monetary system.


    ![](Image00004.jpg)In summary, we can state that many prominent and wealthy individuals
    as well as large technology companies such as Tesla have now also entered Bitcoin.
    This is shaping acceptance and trust in the cryptocurrency. Confidence that Bitcoin
    can serve as a store of value. Confidence that it makes more sense to invest your
    money in Bitcoin than to leave it in a savings account with negative interest
    rates. Trust, as people have had in gold for thousands of years.


    The development teams are making great breakthroughs in usability and scalability.
    Bitcoin is finding more and more appeal and possibilities, also as a means of
    payment.


    Certainly Bitcoin is nowhere near the level of a Visa or Master Card, and no one
    can say if it ever will be, but big investors are increasingly recognising the
    digital gold nature of Bitcoin.


    That bitcoin will disappear from the scene is very unlikely, but what about the
    more than 10,000 other cryptocurrencies and tokens?


    8.3.         The future of altcoins


    The current cryptocurrency market is comparable to the technology sector of the
    last 40 years. Technology and social media are booming more and more. In the course
    of this, many companies have been founded. Some are still market leaders today;
    others have disappeared into oblivion.


    Large social media platforms such as Myspace, for example, also disappeared from
    the scene overnight. The crypto market will behave similarly. Gradually, the best
    and most efficient projects will emerge, and those that do not add value will
    become irrelevant.


    At the moment, however, we are still in the initial phase, where it is extremely
    difficult to find out which technology or which specific project will prevail.


    Because in the last few years, the crypto market has grown enormously due to all
    the capital flowing in. We can now buy and send over 10,000 different cryptocurrencies.
    It is self-explanatory that we will not be running 1000 different payment methods
    or 1000 different decentralised networks in the future. Very likely, 99% of these
    cryptocurrencies will die out.


    In addition, new projects are constantly being added and an enormous amount of
    investor money is accumulated through marketing.


    We have already seen that in the last 10 years:


    | Top 10 cryptocurrencies by market capitalisation |


    | --- |


    | June 2013 || January 2017 || January 2020 |


    | ![](Image00107.jpg) || ![](Image00108.jpg) || ![](Image00109.jpg) |


    |  ||  ||  |


    The cryptocurrencies that were in the top 10 in the early years were for the most
    part no longer represented in the top positions after a few years. Most of the
    projects that were in the top 10 during the crypto boom in 2017-18 are also hard
    to find again, and the projects that are in the top positions today may no longer
    exist in a few years.


    The exceptions are Bitcoin and, as of a few years prior, Ethereum or Ripple, but
    these coins could still suffer the same fate as many have before them.


    Regarding the future, the most likely scenario is that large cryptocurrencies
    that have already built up a large user base today will also last in the long
    term. Of course, there will always be a new cryptocurrency whose price increases
    a hundredfold within a year, but finding these projects borders more on gambling
    than rational investing.


    There is also a constant race among altcoins. As already noted in the chapter
    on Ethereum''s competitors, no network has yet been able to decisively assert
    itself. Generally speaking, Ethereum has the most users and is thus far ahead.
    It will be difficult to catch up with the Ethereum network.


    That another cryptocurrency will take Bitcoin''s place as a store of value is
    almost impossible. The network, the miners, the trust: Everything speaks for Bitcoin.
    Institutional investors will also always prefer Bitcoin. An investment in cryptocurrencies
    is generally risky. Large investment funds or companies will invest in Bitcoin,
    Ethereum or other large cryptocurrencies because the risk is lowest here.


    For this reason, many experts agree that direct bitcoin alternatives will lose
    out to bitcoin in the long run.


    From an investor''s point of view, Bitcoin and possibly other big coins like Ethereum
    are the least risky. It is up to everyone to decide whether they want to invest
    in a small coin with a big vision in the hope of multiplying their money. However,
    this has little to do with intelligent investing.


    When we invest in a project, we should always ask ourselves whether ![Picture
    4](Image00003.jpg)we believe in the project in the long term. Even if a project
    promises the moon, we need to find out if it is perhaps nothing more than a promising
    idea so far.


    In the crypto scene, coins that have no long-term concept and will very likely
    cease to exist in a few years are also known as shitcoins .


    As always, the same applies here: "Greed eats brains" and many gullible private
    investors have already had to experience this firsthand. Especially with smaller
    projects, we can lose our entire stake at any time.


    On the other hand, we are still at the beginning of the crypto market, always
    led by the mother of all cryptocurrencies: Bitcoin. To the upside, anything is
    possible as well. The long-term trend of the market is clear.


    ![](Image00110.jpg)


    Figure 77 Historical market capitalisation of the entire crypto market on a logarithmic
    scale


    At this point, we have reached the end of this beginner''s guide to cryptocurrencies.
    We have worked out the mathematical and economic basics, we have seen how the
    blockchain is structured and how transactions take place. We also now know how
    to anticipate the crypto market in concrete terms, and we know that it is important
    to save our private keys.


    Last but not least, we want to look at some myths that are often sold as fact
    in the media or at the pub, mostly with the aim of spreading a false image of
    cryptocurrencies. For each argument, we look at the intentions behind the statement
    and check the statements for their truthfulness. Because in order to bring the
    crypto ecosystem closer to more and more people, education is the most important
    strategy.


    Some myths have already been explained in this book, but we will now specifically
    address certain allegations and summarise the key statements. This is because
    it is often important in a discussion like this to be able to convey the key statements
    briefly and concisely.


    9.  The most common myths


    The following myths are exemplified using the mother of all cryptocurrencies.
    They apply analogously to every type of cryptocurrency. However, Bitcoin is often
    singled out because it is by far the largest cryptocurrency and is also known
    to laypeople.


    Some of the myths are of a purely technical nature, others contain game-theoretical
    and economic approaches. Often there is a spark of truth in every myth, but this
    often leads to completely wrong conclusions.'
