    即使对于业内人士来说，市场波动也是不可预测的。本书并没有给出具体的投资建议，而是讨论了区块链技术和加密货币的机遇与挑战。之后，每个人必须单独决定他/她是否相信这项技术及其长期价值，以及是否希望对其进行货币化预期。无论如何，了解该领域都是没有错的。


    ### 8.1. 区块链技术的未来


    我们将本书的大部分内容留给了加密货币。然而，其背后的区块链技术在未来将积极改变我们生活的许多其他领域。在今天，许多创业者（例如创业企业家 `Frank Thelen`）已经是区块链技术的忠实粉丝，并预测它大大光前景。Frank
    Thelen 的公司 `Freigeist Capital` 正与初创公司 `Neufund` 合作。这家来自柏林的初创公司正计划一个基于区块链的股票交易平台。通过这种方式，他们希望消除高昂的公证和商业登记费用。


    区块链技术经常被比作互联网。它是一种颠覆性技术，将渗透到我们生活的每一个方面。


    大型公司已经投入了数十亿美元研究区块链技术。很少有人知道：`Bitcoin` 和其他加密货币仅占这些应用领域的一小部分。


    在未来，借助区块链技术可以节省大量的官僚程序。


    任何数字文档都可以存储在区块链上，无论是支付手段（即 `cryptocurrencies`）、契据还是数字身份标识。正如我们已经在 `tokenisation`（代币化）中提到的，越来越多的现实生活物品被备份在区块链上。其优势是数据是不可篡改的、未经审查的，并且可以在任何地方访问。我们只需要互联网和访问权限，例如以我们的
    `private key` 形式存在。


    ![](img/Image00004.jpg)


    通过区块链，我们是自己敏感个人数据的唯一者。因此，区块链技术也可以快速、方便地推进数据保护。


    例如，我们可以以加密的形式将医疗记录存储在区块链上，而不是存储在全科医生或其他各种医院。只有我们自己可以访问这些数据。反过来，可以随时随地轻松地检索这些数据。


    技术也在发展。我们不再需要存储 `private key` 或 `seed`（种子），而是可以使用指纹或类似的方法进行身份验证。


    另一个与数据保护相关的应用领域是即时消息服务。`Facebook`、`WhatsApp` 或 `Google` 等大型公司长期以来受到批评，认为它们对客户数据的处理不够谨慎。许多公司已经在致力于开发去中心化的消息服务
    `DApp`。其中一个可能会在未来几年内进入主流。其优势是显而易见的：没有公司来投放广告、收集和销售数据或取消参与者的访问权限。像 `Steemit` 这样的去中心化社交媒体平台也在不断进化并变得对用户友好。


    还有无数其他用法，例如无需银行的融资或设计为完全透明并使用 `smart contracts`（智能合约）自动兑付的保险合同。


    金融服务特别容易数字化，因为今天几乎所有的账户、贷款和交易已经通过数字方式处理。


    在 `DeFi`（去中心化金融）术语下，越来越多的去中心化应用正在建立，资金在这些应用上进行贷款、筹集或投资。


    '
