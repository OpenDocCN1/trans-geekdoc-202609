    If you miss something, don''t like it or have suggestions for improvement or questions,
    feel free to send me an email.


    Improvement depends on constructive criticism. I am constantly revising the book
    and am happy to respond to any constructive suggestions for improvement.


    If you enjoyed the book, I would be happy to receive a positive review on Amazon.
    This helps the visibility of the book and is the greatest praise an author can
    receive.


    Your Benjamin


    ## About the author


    Benjamin Spahic (M.Eng) was born in Heidelberg in 1995 and grew up in a village
    with 8,000 inhabitants near Karlsruhe. His passion for technology is reflected
    in his studies as an electrical engineer with a focus on information technology
    at the University of Applied Sciences in Karlsruhe.


    He then deepened his knowledge in a Master''s programme in the field of regenerative
    energy production at the Karlsruhe University of Applied Sciences.


    ## Disclaimer


    The author accepts no responsibility for the topicality, correctness, completeness
    or quality of the information provided. Liability claims against the author relating
    to material or non-material damage caused by the use of the information provided
    or by the use of incorrect or incomplete information are excluded to the fullest
    extent permissible. The book does not in any way represent professional investment,
    wealth or tax advice, nor does it replace such advice. No guarantees or promises
    of profits are made in this book. All statements correspond to my subjective opinion.


    The creation of virtual currency units (cryptocurrencies) is done via private
    computer networks, unlike the currencies of central banks and commercial banks.
    An idea of non-state substitute currency. (according to `BaFin`) These are highly
    speculative transactions with the possibility of total loss! Furthermore, no guarantee
    can be given that the described capabilities will be achieved.


