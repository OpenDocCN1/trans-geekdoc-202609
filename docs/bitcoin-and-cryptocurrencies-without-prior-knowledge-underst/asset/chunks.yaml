- raw: 'Another technical disadvantage that has not yet been fully resolved is the
    possibility of forking the blockchain. Since in a fork the coins remain on both
    blockchains, the owners of the coins do not have to decide on which blockchain
    they "mine” but can continue their power on both blockchains.


    |   || Proof of Work || Proof of Stake |


    | --- | --- | --- |


    | Safety through || Performing work || Evidence of assets |


    | Behaviour during a hardfork || The coins are present on both blockchains ||
    The coins are present on both blockchains |


    | Consensus building || Mining || Validators (asset owners) |


    | Advantages || Severe monopoly formation || Fewer resources |


    | Disadvantages || Environmental issue || Hard fork problem |


    As we can now see, one is not automatically better than the other or vice versa.


    Some cryptocurrencies rely on POW, others on POS. Only time will tell what will
    prevail in the long term for a particular field of application.


    By now, we have learned about the important building blocks of a blockchain and
    cryptocurrencies.


    After we have dealt with some general aspects such as mining, we will look at
    how transactions are stored on the blockchain in the following chapter. Because
    Bitcoin is often accused of being very anonymous and non-transparent. Bitcoin
    is therefore used for illegal transactions and should be banned.


    But how transparent is Bitcoin anyway, and what is the difference between transparency
    and anonymity?


    5.  Transparency and anonymity


    If we want to find out how transparent or anonymous a blockchain is, we first
    have to clearly separate the terms. This is because many terms such as transparency
    and anonymity are often thrown around or used incorrectly in everyday language.


    5.1.         Transparency of the blockchain


    Transparency describes the property that a third person can easily recognise and
    understand an action within a system. In terms of money flows, this means that
    a person can see the flow of money from one account to another, even if it is
    not their own. And this is exactly the case with Bitcoin and most cryptocurrencies.
    The blockchain is the transaction history that contains all former transactions.
    It is freely viewable and accessible to everyone.


    ![](Image00004.jpg)The blockchain is 100 % transparent. Any person can see all
    account balances and money flows that have ever taken place at any time. We can
    also easily look at Satoshi Nakamoto''s account, provided we know which account
    belongs to him.


    Compared to blockchain technology, today''s banking systems are not transparent.
    We cannot see any other money flows except our own. Even though the blockchain
    is transparent, it is also completely anonymous. We need to clearly separate the
    transparency of a system from anonymity.


    5.2.         Anonymity of the blockchain


    The word anonymity is derived from the Greek. It can be translated as "without
    a name" or "no name".


    One can have full anonymity within the blockchain. We have already seen in the
    first chapters of this book that all we need to do to "open" a Bitcoin address
    (public address) is to think up a private key with a length of 256 characters.
    No one can stop us from doing this. Moreover, no one can deduce the name, age,
    origin or gender of the person from the public key. Bitcoin and blockchain technology
    are therefore 100% anonymous and at the same time 100% transparent.


    Even if both are true in theory, in reality, anonymity is not completely given.
    This effect is also called pseudo-anonymity.


    5.3.         Pseudo-anonymity


    Pseudo-anonymity describes that the anonymity in an actually 100% anonymous system
    is automatically dissolved by the high transparency.


    ![](Image00004.jpg)As soon as we can clearly assign a Bitcoin address to a small
    group of people, we can infer the owners of other addresses based on the transactions
    of this address.


    If we send a certain amount of money to a person every month, on the 1st of the
    month, the associated account probably belongs to a close relative, our landlord
    or a bank from which we have borrowed. Since the points of entry and exit are
    not anonymous, the anonymity gradually dissolves.


    ![](Image00004.jpg)This is not only a theoretical consideration of anonymity,
    but also common practice. According to current estimates, 80-90% of all Bitcoin
    addresses can be clearly assigned to their real owners.


    One reason why this is possible is because the entry and exit points are monitored.
    Often, when buying Bitcoins or other cryptocurrencies, you have to confirm your
    personal details so that the address can be clearly assigned before a transaction
    has even taken place.


    De facto, we can state that there is little to no privacy in the Bitcoin network.
    We will take a closer look at the effects this has on the everyday usability of
    cryptocurrencies later. First, we look at cryptocurrencies that are nevertheless
    completely anonymous through various tricks.


    5.4.         Private Coins


    So far, we have only got to know the blockchain technology, which allows all inferences
    to be made about transactions. However, there are also cryptocurrencies where
    a block is not completely transparent.


    ![](Image00004.jpg)These cryptocurrencies are called private coins or privacy
    coins . These blockchains do not allow any precise conclusions to be drawn about
    who has received how much money from whom.


    One of the first cryptocurrencies to emerge as a private coin is Monero (XMR).


    ![](Image00058.jpg)


    Figure 40 Monero logo


    In the blockchains we have looked at so far, each participant signs their own
    transaction. This makes it easy to see who has sent money to whom.


    ![](Image00059.jpg)


    Figure 41 Digital signature of a message


    From a technical point of view, private coins increase privacy by having several
    people sign not only their own transaction, but also other transactions. This
    is then referred to as a ring signature. ![](Image00060.jpg)


    Figure 42 Digital ring signature


    The participants sign a block or their transactions in the block together.


    All participants in the ring signature can confirm that the transactions are permissible,
    but it is no longer concretely visible from the outside from where and to where
    the money has flowed.


    For a more tangible comparison, imagine a group of people pooling money. For example,
    Alice wants to transfer €200, Bob wants to transfer €100 and Charlie wants to
    transfer €50 to other people. They meet and confirm that the other has the necessary
    money. Alice confirms (signs) that Bob''s transaction is OK, Bob confirms Charlie''s
    and Charlie confirms Alice''s transaction intention.


    They then deposit €350 in the bank together and send the money wherever they want.
    The bank does not see how much Alice, Bob or Charlie have deposited individually.
    All the bank sees is a transaction with the total amount.


    It is no longer clear whether ring signatures like Monero''s are still sufficiently
    anonymous. However, the Monero community is already working on the implementation
    of another algorithm that should further increase the anonymity of users.


    There are other cryptocurrencies that also guarantee complete anonymity. However,
    these are currently rather niche products.


