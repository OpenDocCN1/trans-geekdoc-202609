- raw: 'Even for insiders, market movements are unpredictable. Instead of pronouncing
    specific investment advice, this book discusses the opportunities and challenges
    of blockchain technology and cryptocurrencies. Afterwards, everyone must decide
    individually whether he/she believes in the technology and the value in the long
    term and wants to anticipate it monetarily or not. In any case, it is not wrong
    to inform oneself about the subject area.


    8.1.         The future of blockchain technology


    We have devoted most of this book to cryptocurrencies. However, the blockchain
    technology behind it will positively change many other areas of our everyday lives
    in the future. Already today, many entrepreneurs, for example the start-up entrepreneur
    Frank Thelen, are big fans of blockchain technology and predict a great future
    for it. Frank Thelen''s company Freigeist Capital is working with the start-up
    Neufund. The start-up from Berlin is planning a trading platform for company shares
    based on the blockchain. With this, they want to do away with cost-intensive notary
    and commercial register entries.


    Blockchain technology is often compared to the internet in this breath. It''s
    a disruptive technology that will permeate every aspect of our lives.


    Large companies are already investing billions in researching blockchain technologies.
    What few people know: Bitcoin and other cryptocurrencies make up only a fraction
    of these areas of application.


    In the future, a lot of bureaucracy can be saved with the help of blockchain technology.


    Any digital document can be stored on a blockchain, whether it is the means of
    payment, i.e. cryptocurrencies, a deed or a digital ID. As we already mentioned
    with tokenisation, more and more real-life things are being backed up on the blockchain.
    The advantage is that the data is tamper-proof , uncensored and can be accessed
    anywhere . All we need is the internet and access, for example in the form of
    our private key.


    ![](Image00004.jpg)Through the blockchain, we are the only owners of our sensitive,
    personal data. Blockchain technology can therefore also advance data protection
    quickly and easily.


    For example, we could store our medical records in encrypted form on the blockchain
    instead of having them stored at the GP or various other hospitals. Only we ourselves
    have access to the data. In turn, it can be retrieved easily at any time and from
    anywhere.


    Technology is also developing. Instead of having to store a private key or seed,
    we can verify ourselves using our fingerprint or similar methods.


    Another area of application that also relates to data protection is messenger
    services. Large companies such as Facebook, WhatsApp or Google have long been
    criticised for not being very discreet with customer data. Various companies are
    already working on developing a decentralised messenger service DApp. One of them
    could find its way into the mainstream in the course of the next few years. The
    advantages are clear: there will be no company to serve ads, collect and sell
    data or withdraw access from participants. Decentralised social media platforms
    like Steemit are also constantly evolving and becoming more user-friendly.


    There are countless other examples of use, such as financing without banks or
    insurance contracts that are designed to be completely transparent and are redeemed
    automatically using smart contracts.


    Financial services in particular are very easy to digitise, as almost all accounts,
    loans and transactions are already processed digitally today.


    Under the term DeFi (Decentralised Finance), more and more decentralised applications
    are establishing themselves on which funds are lent, collected or invested.


    One particularly exciting aspect that we saw in the US elections in 2016 and 2020
    was the discussion about manipulation of the democratic elections. In 2016, Russian
    hackers allegedly helped Trump win the election. In 2020, there was allegedly
    manipulation of the absentee ballots.


    Neither has been proven beyond doubt, but the discussion would not even arise
    in the case of a decentralised voting network, as the rules are firmly defined
    and self-executing. 


    With blockchain technology in the electoral system, manipulation can be completely
    ruled out. This way, other countries can also check that a democratic election
    has taken place. Everyone can see the consensus. Voting can still be anonymous,
    for example by generating a "one-way private key", similar to the tan procedure
    in online banking. Of course, this technology also faces challenges: How can it
    be ensured that every citizen gets the right to vote? Such issues need to be addressed,
    but so far technological progress has found a suitable answer for every question.


    We could address hundreds more topics. Little by little, more and more people
    are becoming aware of the benefits of technology.


    "BLOCKCHAIN- THE SILENT REVOLUTION" - trade paper 2018


    "Blockchain technology raises hopes across industry boundaries." - ComputerWeek
    2021


    "Blockchain technology allows ownership to be secured more directly and efficiently
    than before."


    BaFin - German Federal Financial Supervisory Authority 2017


    ![](Image00004.jpg)Whether cryptocurrencies will prevail in the long term is often
    still disputed, even among experts. With regard to blockchain technology, however,
    they all agree: the future belongs to the blockchain.


    But what does it look like in concrete terms with regard to Bitcoin and Co. What
    would be the best case, what the worst case for Bitcoin? Let''s take a look at
    some facts from the very recent Bitcoin history and see what the future will bring.


    8.2.         The future of Bitcoin


    In the early years of the Bitcoin network, no one would have expected that a Bitcoin
    could ever be worth a price of 100, 1,000 or 10,000 euros.


    Bitcoin was first taken seriously in 2013, when the price rose from USD 15 to
    over USD 1,100 within a few weeks.


    The euphoria was great. Unfortunately, it was just as quickly dampened again when
    the price fell by over 40% within one day after a bad press release. Many private
    investors lost a lot of money. One of them is still famous today:


    It was on a weekend when the Bitcoin owner with the nickname " GameKyuubi " read
    out his frustration about the large price fluctuations on a Bitcoin forum.


    The original post is at the link:


    https://bitcointalk.org/index.php?topic=375643.0. There are thousands of comments
    under the post.


    In the post, he described how he was a bad trader and that everyone should save
    their schadenfreude . He let out his frustration and got upset about the system
    and people giving gloating advice to other people.


    "OHH YOU SHOULD HAVE SOLD". YES, OH WHAT? NO SHIT, I SHOULD HAVE SOLD."


    He was done with Bitcoin trading. Nevertheless, he believed in Bitcoin and its
    future. That is why he wrote that he would not sell his coins anyway. In English,
    he wanted to write "I am holding" as the headline. Apparently GameKyuubi did not
    write the post completely sober, which he also emphasised in his post : "Yes I
    drank a few glasses of whiskey".


    Instead of "I am holding," he wrote "I am hodling." The amusing spelling mistake
    quickly went viral in the forum and received a lot of positive feedback. It became
    a meme (funny photos that are forwarded on the internet). There are countless
    pictures, printed T-shirts and other things with the famous caption.


    ![](Image00101.jpg)


    Figure 73 HODL meme from the Bitcoin forum


    ![](Image00004.jpg)In the meantime, the post and the term "HODL" have become widespread
    among Bitcoin followers. HODL means that you keep your coins and don''t sell them
    - even if the price plummets.


    ![](Image00102.jpg)![](Image00103.jpg)![](Image00104.jpg)


    Figure 74 Responses from other users on the Bitcoin forum to GameKyuubi''s entry.


    HODL also refers to a specific investment approach, both for cryptocurrencies
    and for shares or other asset classes.'
