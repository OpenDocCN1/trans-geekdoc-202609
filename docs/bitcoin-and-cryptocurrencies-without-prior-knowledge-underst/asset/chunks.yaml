    ### 分层确定性钱包 (HD Wallets)


    如果我们想在区块链上打开 100 个地址，我们就必须存储 100 个私钥。这是非常耗时的。这就是所提改进的用处。


    `BIP32` 引入了分层确定性钱包（`HD Wallets`）。它们解决了上述描述的问题并简化了钱包的操作。同时，它们也有助于提高隐私性。


    通过 `HD Wallets`，引入了一个主密钥。它看起来与私钥非常相似，也由一组加密的数字和字母组成。随后，可以从主密钥生成任意数量的私钥。


    ![](img/Image00096.jpg)


    图 67 使用主密钥生成任意数量的地址


    私钥是从主密钥生成的，从该私钥可以生成另一个私钥，以此此类推。这种目的使用了确定性函数。确定性意味着输出可以明确地分配给输入。


    类似于 `SHA256` 算法，也使用了单向函数，这些函数可以轻松从主密钥生成一个或多个私钥，并随后生成公地址。相反，无法从一个私钥推导出另一个私钥或主密钥。


    当我们想要接收钱币时，我们创建一个新的私钥和相应的地址。对于下一次交易，我们再创建一个新的私钥，以此此类推。


    ![](img/Image00004.jpg)尽管硬币分布在许多地址上，但我们可以通过单个主密钥访问所有硬币。然而，第三方无法得知我们总共有多少额度，因为没有人能追踪哪些地址属于我们。


    我们可以看到 `BIP32` 扩展对隐私很有很大帮助。然而，问题在于我们仍然需要记住一组加密的数字序列。


    ### 种子 (Seeds) 与 BIP39


    任何尝试过在电脑上输入私钥的人都会发现它是有多么不实际。很容易写错或断思路。即使是存储密钥都不直观。这就是为什么引入了所谓的“种子”（Seeds）。这项扩展是以
    `BIP39` 的名引入的。


    随着种子的引入，我们不再需要记住加密的私钥，而是记住明文形式的英文单词。为了这个目的，总共选择了 2,048 个不同的英文单词。单词列表是公开的。


    `https://github.com/bitcoin/bips/blob/master/bip-0039/english.txt`


    ![](img/Image00097.jpg)


    图 68 BIP39 单词列表摘


    从这 2,048 个单词中，我们选择十二或 24 个随机单词。这十二或 24 个单词被称为种子。


    ![](img/Image00004.jpg)现在，钱包提供商为我们完成了这些工作。当我们创建钱包时，会被分配十二或 24 个随机单词。


    种子的示例，十二个随机单词：


    "couple copy shy they vintage during avoid champion little join better code"


    起初我们无法对这些单词做些什么，但可以将这些单词转换为主密钥，然后转换为几个私钥![](img/Image00098.jpg)


    图 69 使用种子生成任意数量的地址（12 个单词）


    ![](img/Image00004.jpg)通过 `BIP39`，存储私钥变得更加大众化。十二或 24 个单词比具有 80 或 256 个字符的加密密码更具实体感。


    ### BIP44 与多货币支持


    到目前为止，种子和多个地址仅限于多个比特币地址。虽然可以在一个种子中存储数百个比特币地址，但随着越来越多的加密货币进入市场，用户对友好型存储多种加密货币货币的需求随之增加。一个种子只能用于一种加密货币的事实随着另一个
    BIP 而改变了。


    `BIP44` 允许通过仅一个种子为各种加密货币创建私钥。不仅从主密钥生成比特币地址的私钥，还可以生成其他私钥，例如用于以太坊、比特币现金和数千种其他硬币。这些私钥反过来可以用于计算相应区块链上的公地址，即账户。


    ![](img/Image00099.jpg)


    图 70 使用种子生成任意数量的不同加密货币地址


    这些扩展使得提供全方位解决方案成为可能，因此终端用户只需写下 12 或 24 个单词。他们可以自己选择这些单词，就像他们选择私钥一样。


    `HD wallets` 查询这些单词，创建一个主密钥，并遍历所有货币的所有地址，直到连续的几个地址不再包含任何硬币。在大多数情况下，为了安全起见，还会检查另外
    100 个地址，以确保没有硬币被遗漏。如 `Ledger-Nano` 之类的冷钱包也能通过集成随机生成器从 `BIP39` 单词列表中选择种子，即十二或 24
    个单词。


    ### 总结


    我们在这一章中学学习了：加密交易所既有优点也有缺点。我们可以快速获得资金并将其兑换为 USDT 或“真实的”美元，例如。然而，我们将钱放在了外国人的手中。我们还看到，种子和
    HD 钱包方便了硬币的长期安全存储以及不同加密货币的所有权。只需十二或 24 个单词，我们就可以同时创建并存储以太坊、比特币、莱特币或 Ripple 等不同加密货币的无数地址。如果我们想长期存储所有这些币，就不再需要为每个币打开单独的地址。


    ### 7.4 我们应该注意什么？


    特别是当你是加密货币的新手时，道路上总会有障碍，我们将在本小节中详细这些这些，以便你的热情不会变成挫败。


    #### 费用比较


    在购买股票或为房融资时，不同的银行和交易所有不同的成本。因此，建议比较不同的股票交易所和银行。百分之二三的费用听起来可能并不多，但在融资买房时，最好想两次。


    购买加密货币的情况也是如此。一些交易所收取按百分比的买卖费（如 `Binance`），另一些收取固定价格（如 `eToro`），还有一些是混合模式，例如 `Coinbase`。为了保持成本尽可能低，我们需要比较不同的价格目录。


    此外，可能存在隐藏费用，例如由于价格差异。在一家提供商那里，一个 `BTC` 只需 10,000 欧元，而在另一个提供商处 `Bitcoin` 的价格为 10,500
    欧元。这在加密货币中特别常见，例如当我们想将 `Bitcoin` 交换为 `Ethereum` 时。因此，在购买之前与 `coinmarketcap` 或其他门户网站的价格对比是有意义的。对于较小的提供商和小币，你需要注意这一点。


    #### 交易费用


    我们已经看到发送 `比特币`和其他加密货币涉及矿工费用。费用越低，确认交易的时间越长。在最坏的情况下，交易不会被处理。我们的币不会丢失，而是留在账户中，但在最坏的情况下，交易会在队列中挂起几天才被拒绝。


    ![](img/Image00004.jpg)发送硬币的交易费用基于网络负载，而不是发送硬币数量的百分比，而是基于交易的数据大小。这意味着：如果我们发送一个
    `BTC`，其成本并不比发送 100 个 `Satoshi` 高出多。


