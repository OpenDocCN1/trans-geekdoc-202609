    `public key`（公钥）和 `public address`（公地址）经常被当作同义词，但从技术角度来看它们并不是一个意思。严格来说，![图片 4](img/Image00003.jpg)未压缩的
    `public key` 首先由 `private key`（私钥）生成，并由此生成 `public address`。要理解这一点，只需要知道存在 `private
    key`、`public key` 或 `public address` 即可。


    ![](img/Image00031.jpg)

    图 17 比特币地址生成


    私公钥的工作原理在比特币和许多其他加密货币中非常相似。不同之处在于地址和密钥的长度。此外，比特币可能存在像图中所示的特征性前缀。


    ![](img/Image00032.jpg)

    图 18 私钥与公地址的关系


    ![图片 4](img/Image00003.jpg)我们从这一章中学到的最重要的的一点是：在任何情况下，我们都不会将自己的 `private key` 交给任何人。


    在以比特币为例查看区块链的具体形成之前，我们将讨论一个大家也半知半解的话题：我们讨论的是挖矿。


    ### 3.3 共识构建与挖矿


    ![](img/Image00004.jpg)Mining 是开矿、提取或生产的英文单词，通常与黄金、金矿等商品联系在一起。类似的，`bitcoin mining`（即
    `bitcoin` 的生产或开矿）术语已经建立。


    从密码学的角度来说，挖矿描述的是解决数学问题的过程，例如计算 `SHA256`算法。


    当矿工完成工作后，信息就准备好成为共识的一部分。共识描述了参与者对于什么是“真”、什么是“假”的达成同。由于没有中心机构，社区决定了交易是否以及何时可以发生，以及他们是否会将该交易纳入他们的区块链。


    为了更好地理解这个过程，让我们看看去中心化系统中的不同参与者。除了矿工外，还有其他参与者，例如前面提到的 `full nodes`（全节点）。用户也可以同时扮演多个角色。


    为了便于理解，我们将盖房子类比为各个参与者的验证过程。通过这个例子，我们为参与者分配了任务。


    **Miner（矿工）**：矿工是执行工作（换句话说就是挖矿）的用户。新信息（即数字签名的交易）会被发送给他们。


    类似地，矿工是凭借自己的劳动建造房子的工人。房子应该是什么样的蓝图就是区块链的规则。


    矿工计算网络中潜在的共识，并将其转发给节点进行验证。


    矿工自然希望为他们的工作获得相应的报。


    ![](img/Image00004.jpg)矿工在一个区块中分配若干交易并创建共识，例如通过提供他们的算力。用户必须为此支付费用。这些交易费用将分配给矿工。


    矿工是那些通过工作确保共识安全的人。


    **Full nodes（全节点）**：全节点是指将整个区块链下载到计算机上并定期更新它们的用户。他们与其他节点同步并构成去中心化系统的支柱。他们还验证发送给他们的信息。（注：原文中该段落存在大量重复，已按要求保留核心含义翻译）。


