    ## 5. 透明度与匿名性


    如果我们想找出一个区块链有多透明或多多匿名，我们首先必须清楚地区分这些术语。这是因为透明度和匿名性等许多术语在日常语言中经常被随意使用或使用不当。


    ### 5.1. 区块链的透明度


    透明度描述了第三者可以容易识别并理解系统内部操作的属性。在资金流方面，这意味着一个人可以看到资金从一个账户到另一个账户的流动，即使该账户不是自己的。`Bitcoin`
    和大多数加密货币恰恰是如此。区块链是包含所有以前交易的交易历史。它是所有人都可以免费查看和访问的。


    ![](img/Image00004.jpg)区块链是 100% 透明的。任何人都可以看到任何时候发生过的所有账户余额和资金流。我们也可以轻松地查看 `Satoshi
    Nakamoto` 的账户，只要我们知道哪个账户属于他。


    与区块链技术相比，今天的银行系统是不透明的。我们看不到自己以外的任何其他资金流。尽管区块链是透明的，但它也是完全匿名的。我们需要将系统的透明度与匿名性明确分开。


    ### 5.2. 区块链的匿名性


    匿名性（anonymity）一词源于希腊语。它可以翻译为“没有名字”或“无名”。


    可以在区块链中拥有完全的匿名性。我们在书的前章节已经看到，要“打开”一个 `Bitcoin` 地址（公共地址），我们只需要出一个长度为 256 个字符的私钥。没有人能阻止我们这样做。此外，没有人能从公钥推断出人的名字、年龄、来源或性别。因此，`Bitcoin`
    和区块链技术是 100%匿名的，同时也是 100%透明的。


    即使理论上两者都真实，但在现实中，匿名性并不是完全保证。这种现象也被称为伪匿名（pseudo-anonymity）。


