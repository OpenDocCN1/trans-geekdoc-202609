    message and that the encrypted message has not been intercepted and changed in
    transit. These aspects are summarised under the terms: integrity and authenticity.


    To ensure the integrity of the message, Alice can "encrypt" the message with her
    private key. This process is called signing .


    We can imagine digital signing like a medieval letter seal.


    ![](Image00012.jpg)


    Figure 5 Signing in the Middle Ages


    A sealed letter proves that it has not yet been opened and accordingly cannot
    have been falsified. The seal, in turn, confirms that a certain person, for example
    the king at the time, must have sent this letter.

    '
  trans: '


    加密货币基于数学的。`2+2 = 4`。我们不需要担心明天 `2+2= 5`。


    加密货币继续保持去中心化的结构。这意味着数据并不存储在服务器上，而是存储在一个由成千上万计算机组成的分布式网络中。


    在详细研究加密货币、比特币和区块链技术之前，让我们先来看密码学的基础知识。整个区块链技术都是基于这些基础和算法的。密码学让我们理解加密货币背后的精妙机制。别担心：整个过程将保持简单，以便易于理解。


    ## 2.5. 密码学基础


    ![](img/Image00004.jpg)密码学是一门处理加密和密码系统生成的科学。加密货币是一种数字货币，其基础是密码系统，即各种加密算法。


    交易使用众为人知、经过时间检验且经过测试的加密算法进行加密、执行和确认。让我们系统地查看每一个步骤，从消息最初如何被加密开始说起。良好的加密被认为是安全的，并且是与黑客或恶意中心机构斗争中剩余的少数手段之一，这一点也被著名的吹哨者埃德华·斯诺登（Edward
    Snowden）所认可。


    “加密是有效的。实施良好的强力密码系统是我们可以依赖的少数事情之一。” —— 埃德华·斯诺登


    随着数字化的进步，加密算法已不可或缺，因为数据的完整性对于跨洲通信至关重要。


    ![](img/Image00006.jpg)数据完整性意味着我们可以确信收到的数据是未被更改过的。这意味着没有人可以在传输过程中对其进行更改、拦截或删除。


    为了确保这一点，所有通信系统如互联网、移动无线电甚至工业工厂中的传感器都使用了加密算法。但加密实际上是如何工作的呢？有哪些类型的加密方式？


    为了回答这些问题，首先需要定义加密的一些术语和目标。我们现在来看一个在密码学中经常使用的模型。


    两个人，我们称他们为 Alice（丽丝）和 Bob（鲍勃），想要以加密的形式通信。为了实现这一点，Alice 写了一条明文消息。这意味着消息可以被任何人阅读。


    加密的主要目标是保持消息机密，使其在传输过程中不被读取。因此，Alice 不能简单地发送明文消息，必须通过某种程序对其进行加密，使消息变得不可读。而 Bob
    则可以解密消息并收回明文。但你如何加密消息呢？一种简单但不安全的方法是所谓的凯撒位移密码或凯撒加密。在这里，明文中的所有字母在字母表中都移动了固定的位数。例如，我们在字母表中每个字母向后移动三个位置。A
    变成 D，B 变成 E，以此此类推：


    | 字母 | A | B | C | D | E | F | G | H | I | … | V | W | X | Y | Z |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---
    | --- | --- | --- |

    | 字母+3 | D | E | F | G | H | I | J | K | l | … | Y | Z | A | B | C |


    数字三被称为 `key`（密钥），因为通过这个数字和算法，可以从明文创建出加密消息。


    ![](img/Image00000.jpg)例如，如果 Alice 使用 `key three`（密钥三）对消息“Bitcoin is awesome!”进行加密，结果是消息“Elwfrlq
    lv dzhvrph! “


    （欢迎检查！）


    ![](img/Image00007.jpg)


    图 2 消息的对称加密


    ![](img/Image00000.jpg)消息以加密形式传输。Bob 接收消息并通过将所有字母向前移动三个位置来解密消息。


    为此，Bob 必须知道使用哪种加密方法以及密钥是什么（在我们案例中，是凯撒位移密码和数字三）。这些信息必须提前已知，例如，必须在私下约定好。


    显而易见，这个过程非常不安全，因为字母表中最多有 ![图片 4](img/Image00003.jpg)26 个不同的字母，因此只有 26 种不同的密钥可以加密消息。因此，黑客最多只需要尝试
    26 次即可破解加密。


    凯撒位移密码是对加密方法的一种例子。对称意味着加密和解密使用同一个密钥。为了这一点，双方必须交换密钥，且不让第三方知晓。


    另一个对我们仍然具有非常重要的系统是非对称加密。


    ## 2.6. 非对称加密


    ![](img/Image00004.jpg)在非对称加密方法中，加密和解密不使用同一个密钥，而是使用两个不同的密钥。一个密钥用于加密消息，另一个用于解密消息。


    用于加密的密钥可以是公开的。它不需要保密，因此也称为 `public key`（公钥）。而解密密钥必须保密。它被称为 `private key`（私钥）。


    ![](img/Image00008.jpg)


    图 3 消息的非对称加密


    对于这种加密，我们需要一个在两个方向上都不同样容易求解的函数


    ![](img/Image00009.jpg)


    图 4 数学单向函数的特性


    ![图片 4](img/Image00001.jpg)公钥和私钥通过数学函数相关联。然而，从公钥推导出私钥是不可能的。


    我们无法轻易地从函数的输出中推导出函数的输入，但我们就可以从函数的输出中推导出函数的输入。


    作为一个简单的例子，我们取函数![](img/00010.jpg)。


    这个方程相对容易求解。但反过来，就需要求四次方根：![](img/00011.jpg)。这比纯乘法要复杂。非对称加密使用了更复杂的函数和巨大的数字。


    这些数学函数非常复杂，超出了本书的范围。


    在数学中，这被称为一个困难问题。在我们的语境下，重要的是理解私钥和公钥并非独立，而是公钥与私钥是相关的。


    我们将在书中看一个更具体的例子，但由于书籍长度，我们不会查看完整的背景或甚至是数学证明。


    这些已经是通过加密程序实现机密性的基础。现在我们知道如何从明文消息创建加密消息。


    总结：


    `public key` : 密钥，公开可用。它用于加密消息。


    `private key` : 必须保密的密钥。它用于解密消息。


    私钥和公钥通过复杂的数学函数相关联。


    接下来，我们要问自己，如何确保 Alice 确实是消息发送者，以及加密消息在传输过程中没有被拦截和更改。这些方面被总结在术语下：完整性和真实性。


    为了确保消息的完整性，Alice 可以用她的私钥对消息进行“加密”。这个过程被称为签名。


    我们可以将数字签名想象成中世纪的信封封。


    ![](img/00012.jpg)


    图 5 中世纪的签名


    '
