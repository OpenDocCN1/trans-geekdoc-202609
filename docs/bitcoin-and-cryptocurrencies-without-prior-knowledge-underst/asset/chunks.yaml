    words into a Master Key and then into several Private Keys ![](Image00098.jpg)


    Figure 69 Generating any number of addresses using a seed (12 words)


    ![](Image00004.jpg)With the BIP39, keeping private keys has become much more mass-produced.
    Twelve or 24 words are more tangible than a cryptic password with 80 or 256 characters.


    Until now, seeds and multiple addresses have been limited to multiple bitcoin
    addresses. While it was possible to store hundreds of Bitcoin addresses in just
    one seed, more and more cryptocurrencies entered the market and the demand for
    user-friendly storage of multiple cryptocurrencies has increased. The fact that
    a seed can only be used for one cryptocurrency has changed with another BIP.


    BIP44 enables the creation of private keys for various cryptocurrencies with the
    help of just one seed. Not only private keys for Bitcoin addresses are generated
    from the master key, but also other private keys, for example for Ethereum, Bitcoin
    Cash and thousands of other coins.


    These private keys can in turn be used to calculate public addresses, i.e. accounts,
    on the respective blockchain.


    ![](Image00099.jpg)


    Figure 70 Generating any number of addresses of different cryptocurrencies using
    a seed


    The extensions made it possible to offer an all-in-one solution so that the end
    user only has to write down 12 or 24 words. They can choose these themselves,
    just as they did with the private key.


    HD wallets query the words, create a master key and run through all addresses
    of all coins until several addresses in a row no longer contain any coins. In
    most cases, another 100 addresses are checked for security, so that no coins are
    forgotten.


    Cold wallets such as the Ledger-Nano are also able to select a seed, i.e. twelve
    or 24 words, from the BIP39 word list through an integrated random generator.


    What we have learned in this chapter: Crypto exchanges offer advantages and disadvantages.
    We can get our money quickly and exchange it for USDT or "real" USD, for example.
    However, we are putting our money in foreign hands. We have further seen that
    both the long-term, safe storage of coins and the ownership of different cryptocurrencies
    are facilitated by seeds and HD wallets. With just twelve or 24 words, we can
    simultaneously create and store countless addresses of different cryptocurrencies
    such as Ethereum, Bitcoin, Litecoin or Ripple. If we want to store all these coins
    in the long term, we no longer need to open a separate address for each coin.


    Next, let''s look specifically at what aspects we should have in mind when dealing
