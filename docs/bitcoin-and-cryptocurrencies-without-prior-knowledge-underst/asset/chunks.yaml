- raw: 'A foundation is a community of people who, unlike a company, do not (have
    to) make a profit, but dedicate themselves to a project, in this case the development
    of the Ethereum network, free of charge. Of course, the developers profit indirectly
    from their work, because all developers also own Ethereum coins themselves and
    therefore profit from rising prices and the increase in Ethereum''s level of awareness.


    The developers are constantly working on improvements. Improvement proposals,
    so-called EIPs (Ethereum improvement proposals), are regularly presented and implemented
    after consultation with the community.


    ![](Image00004.jpg)Ethereum is denominated in Ether (ETH) . Just as a Bitcoin
    can be divided into mBTC or Satoshi, an Ether can be divided into smaller units,
    the Wei. One billion Wei forms a Giga-Wei Gwei and one billion Gwei forms an ETH.


    ![](Image00068.jpg)


    Ethereum also uses the proof-of-work algorithm . This means that the transactions
    are confirmed by decentralised miners and computing power must be used for this.
    However, the block duration for Ethereum is only about 13 seconds. As a reminder,
    it takes ten minutes for Bitcoin. Furthermore, Ethereum does not use the SHA256
    algorithm to secure the blockchain, but the ETHash algorithm . This can be efficiently
    calculated by graphics processors. The idea behind this was that graphics cards
    usually have more power than a processor and that therefore more computing power
    and more security is available to the network. In addition, the centralisation
    of computing power by ASICs should be counteracted.


    ![](Image00004.jpg)Ethereum, unlike Bitcoin, is unlimited. With every block, two
    new ethers are distributed to the miners. The number is not reduced in the process.
    Ethereum is therefore an inflationary system.


    If we want to send an Ether transaction, we have to pay the fee in gas . The price
    for the gas is given in Gwei. The terminology is often a bit confusing for newcomers.
    Gwei, just like Ether (ETH), is Ethereum''s currency.


    We can think of the gas as fuel for our transaction. The faster we want the transaction
    confirmed, the more fuel we need and the more gas we have to buy Gwei.


    If the transaction becomes larger or more complex, we need more gas accordingly.
    Usually 21,000-40,000 gas is sufficient for a transaction. We can often manually
    set the maximum amount of gas we want to use.


    ![](Image00004.jpg)Ethereum, like Bitcoin, is a highest bid system. The transaction
    for which the most fees (gas) are paid is charged first. Only as much gas as is
    necessary is ever used. The rest is paid back to our account.


    ![](Image00069.jpg)


    Figure 47 Example fee calculation of an Ethereum transaction


    Example: We want to send an ETH. The gas price for a quick transaction is 134
    Gwei at the time of writing. We set the maximum gas consumption to 21,000 gas.
    This results in a maximum transaction fee of ![](Image00070.jpg). To arrive at
    the amount in Ether and dollars, we need to convert Gwei to ETH. To do this, we
    need to divide by 1 billion. ![](Image00071.jpg).


    At an ETH rate of 1,900 USD, this results in a transaction fee of about 5.27 USD,
    i.e. about 4.50 €.


    If we buy a car for €5,000, transaction costs of €4.50 are tolerable, but to pay
    for a coffee, these costs are completely unsuitable. One solution is Ethereum
    2.0, which is a conversion of the current protocol that we will also look at.


    Ethereum and Bitcoin have a very similar protocol, but the two cryptocurrencies
    differ in one respect:


    ![](Image00004.jpg)In contrast to Bitcoin, Ethereum is not limited to the mere
    sending and receiving of coins but positions itself as a decentralised super-computer
    on which decentralised apps ( DApps ) can run. The basis is again a decentralised
    blockchain.


    Each full node not only stores the blockchain, but also runs the Ethereum Virtual
    Machine (EVM). All nodes together form a network of computers - a virtual, decentralised
    supercomputer.


    ![](Image00072.jpg)


    Figure 48 The Ethereum network consists of a blockchain and the virtual machine


    We can think of this supercomputer as a giant operating system on which independent
    developers can install programmes that anyone can then use. The programmes will
    run on any computer that runs a full node.


    For example, investor funds can be collected, purchase contracts concluded or
    even games played via the Ethereum platform. The focus is mostly on financial
    applications , although there is no limit to the scope of application.


    The DApps are realised through so-called smart contracts.


    6.3.         Smart contracts and ERC20 tokens


    Bitcoin was designed as a means of payment and a store of value. Ethereum, on
    the other hand, has another function, namely the aforementioned function as a
    supercomputer. So-called smart contracts can be executed on this decentralised
    supercomputer.


    A smart contract can be compared to an ordinary contract. There are two contracting
    parties who agree to exchange goods or services.


    ![](Image00004.jpg)A smart contract is a contract that is stored on the Ethereum
    blockchain or executed on the virtual computer of the Ethereum network.


    ![](Image00073.jpg)


    Figure 49 Smart contract on the blockchain


    The smart contract is automatically triggered when a predefined condition occurs.


    Since the idea of smart contracts is very abstract, we take a concrete example
    to help.


    Alice wants to sell her house to Bob. They have negotiated a purchase price of
    1000 ETH. Normally, the two would need an intermediary, be it a bank or a notary,
    whom they both trust. This is cumbersome, time-consuming and costly. Instead,
    they set up a smart contract that automatically forwards the deed of the house
    to Bob as soon as the previously determined sum of 1000 ETH has been received
    in Alice''s account.


    ![](Image00074.jpg)


    Figure 50 Setting up a smart contract


    As soon as Bob has sent the 1000 ETH to the smart contract, he receives the deed.
    In return, Alice automatically gets the money paid out to her Ethereum address.
    For this, the two have paid a few cents to euros in transaction fees. In a central
    system, hundreds of euros would have been due for a middleman. The time savings
    are not even considered here.


    ![](Image00004.jpg)No middleman is needed any more and the execution of the smart
    contract only costs small transaction fees on the blockchain.


    Other examples where smart contracts can be used are elections. These can be transparent,
    but at the same time anonymous. Election fraud would in fact not be possible.


    ![](Image00004.jpg)If an event is to be executed as soon as a condition is fulfilled,
    middlemen can be bypassed with the help of a smart contract. For this, the condition
    and the event must be represented digitally.


    A smart contract replaces trust in an intermediary with ![Picture 4](Image00003.jpg)trust
    in programming. Conversely, this also means that problems can arise if the smart
    contract has not been written correctly.


    Because once a smart contract has been written, it is unchangeable.


    In addition, the smart contract is openly visible (open source) and executes itself
    automatically as soon as the condition has occurred.


    Smart contracts are executed on the Ethereum blockchain and are therefore decentralised
    and at the same time relatively cheap, depending on the network load.


    A decentralised network is slower than a classic centralised network because of
    the many participants. Due to increasingly faster internet connections, the difference
    is usually negligible. Real-time applications, on the other hand, can only be
    implemented to a limited extent with a decentralised system.


    Simple contracts are not the limit of smart contracts. Smart contracts can be
    used in many ways. For example, they can be used to create tokens .


    A token is comparable to a coin of a cryptocurrency, but tokens can also represent
    a share, deeds, certificates and much more. A token is not just a currency, but
    a general, virtual object.'
