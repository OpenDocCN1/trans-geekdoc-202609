    为了这一点，我们再次采用最大的加密货币：`Bitcoin`。`Bitcoin` 使用 `SHA-256` 算法。另一种名为 `Bitcoin Cash` 的加密货币使用相同的算法，但其规模只有
    `Bitcoin` 的约 1%。


    因此，`Bitcoin` 算力的 1% 等于 `Bitcoin Cash` 100% 的总算力。如果一个仅拥有整个 `Bitcoin` 网络 1% 算力的群体决定攻击
    `Bitcoin Cash` 区块链，他们已经拥有了 50% 的算力，因此几乎可以发动 51% 攻击。


    这种情况在过去经常发生，并且在规模较小的币种上反复反复发生。虽然无法追溯地更改区块链，但社区可以选择不再承认已经创建的区块链。如果发生这样的 51% 攻击，社区有一种简单的方法来摆脱攻击者。我们所说的就是分叉（fork）。


    ## 4.4 区块链的分叉


    ![](img/Image00046.jpg)分叉（Forking）描述了将区块链分裂为两个（或多个）区块链的过程。![](img/Image00048.jpg)


    图 32 区块链的分叉


    `Bitcoin` 区块链已经分叉过几次，例如产生了 `Bitcoin SV`、`Bitcoin Cash` 或 `Bitcoin Gold`。


    ![](img/Image00049.jpg) ![Bitcoin Gold (BTG) Logo 矢量](img/Image00050.jpg) ![File:Bsv-icon-small.png](img/Image00051.jpg)


    图 33 从左到右：`Bitcoin Cash BCH`、`Bitcoin Gold BTG`、`Bitcoin SV BSV`


    这就是为什么 `Bitcoin` 区块链经常被称为 `Bitcoin Core` 或 `Bitcoin Main`，以将其与其他分叉出的 `Bitcoin
    Blockchains` 明确区分开来。


    分叉是指社区的一部分成员决定从区块链的某个区块开始更改底层协议（源代码）。


    实际上，源代码被认为是“神圣不可侵”的，不应该被更改。尽管如此，在某些情况下，分叉是有用的。让我们再次通过一个类比来阐释分叉。


    假设区块链是一条我们可以行驶的泥土路。矿工是筑路者，他们使用挖掘机和风镐而不是计算能力。他们一点一点地建造了一条长路，我们称之为 `Bitcoin core`，我们可以在其上移动。


    突然有一群人路过，发现了道路建设中的缺陷。路不够宽，无法通过足够的车辆，施工不够稳定等等。他们认为有必要以不同的方式继续修路，并改变建造规则。然而，并不是所有人都同意这一观点。对于另一组人来说，路完全足够，甚至认为它更好。


    结果，道路分裂了，创建了一条名为 `Bitcoin Cash` 的新平行路。两条路继续并行建设。


    矿工/筑路者还必须决定将他的计算能力提供给哪条区块链。毕竟，他无法同时建造 `Bitcoin Cash 路`和 `Bitcoin Core 路`。


    ![](img/Image00052.jpg)


    图 34 Bitcoin Cash 分叉


    当区块链分裂成两条独立的链时，这个过程也被称为 `hard fork`（硬分叉）。这些街道之间互是不兼容的。然而，在某一点，这种比较是有缺陷的：作为用户，我们可以继续使用两个区块链。在
    `Bitcoin Cash 区块链`于 2017 年 8 月 1 日从 `Bitcoin Blockchain` 中分离开后，矿工们必须做决定，但用户不需要。


    更棒的是：如果我们在分叉时拥有原始货币（在此例中为 `Bitcoin`）的币，那么我们就自动拥有了新区块链的币。


    这意味着：如果我们在 2017 年 8 月 1 日的 `Bitcoin` 账户上有 `1 BTC`，那么在分叉后，我们的账户上仍有 `1 BTC`，但新的
    `BCH` 账户中还会额外 `1 BCH`（`Bitcoin Cash`）。这个账户具有相同的地址，我们仍然可以通过相同的私钥访问我们的币，毕竟它只是之前
    `Bitcoin Blockchain` 的一个副本。这听起来可能有点困惑，但我们首要记住的是，我们并不拥有自己的币，只拥有自己的私钥。在分叉中，所有的地址（即所有的公钥和所有的私钥）都会
    1:1 地 复制到新的区块链上。


    为什么 `Bitcoin` 不更频繁地分叉？毕竟，每个拥有 `Bitcoin` 的人每次都能免费获得新货币的币，不是吗？


    从原则上说这是正确的，但首先必须对新货币有需求。此外，必须有足够的人愿意提供他们的计算能力来挖掘新币。现实中，到目前所有 `Bitcoin` 的分叉都已消失在微不足道中。


    举几个例子：`Bitcoin Gold`、`Bitcoin Platinum`、`BIG Bitcoin`、`Bitcore`、`super Bitcoin`
    等。


    另一个导致 `hard fork` 的“黑客攻击”发生在加密货币 `Ethereum` 上。


    ![](img/Image00053.gif)


    图 35 Ethereum 图标


    `Ethereum` 是仅次 `Bitcoin` 的第二大加密货币。该货币以 `Ether` (`ETH`) 为单位。


    就像 `Bitcoin` 一样，`Ethereum` 使用 `Proof of Work`（工作量证明）来建立共识。


    `Ethereum` 区块链曾存在一个黑客在 2016 年能够利用的“漏洞”。他成功偷走了 `350 万 ETH`（等值 600 万欧元）。


    '
