    words are called the seed.


    ![](Image00004.jpg)Nowadays, wallet providers do that for us. When we create a
    wallet, we are assigned twelve or 24 random words.


    An example of a seed, twelve random words:


    "couple copy shy they vintage during avoid champion little join better code"


