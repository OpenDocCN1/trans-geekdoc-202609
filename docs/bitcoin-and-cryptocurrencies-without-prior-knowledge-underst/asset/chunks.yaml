    “加密”消息代表了一个数字签名。另一方面，Bob 可以 Alice 的公钥来解密这条消息。由于只有 Alice 拥有她的私钥，因此消息一定来自 Alice。


    ![](img/Image00013.jpg)

    图 6 消息的数字签名


    签名本身并不构成加密。毕竟，公钥是所有人开放的。任何人都可以检查消息 ![Picture 4](img/Image00003.jpg) 是否来自 Alice。如果我们想同时对消息进行加密和签名，我们就将两者结合。


    Alice 使用 Bob 的公钥对消息加密，使得只有 Bob 能够解密消息。然后，Alice 使用她的私钥对已经加密的消息进行签名。


    ![](img/Image00014.jpg)

    图 7 对消息进行数字签名后进行加密


    ![](img/Image00004.jpg)当 Bob 接收到消息时，他可以使用 Alice 的公钥来确认消息来自 Alice。他通过自己的私钥解密消息来获取内容。


    到此，我们已经讨论了非对称加密和数字签名的基础知识。


    在下一步，我们将查看用于验证的算法。这些算法充当“看门狗”的角色，并确认（例如在比特币的情况下）交易（即比特币的往回发送）是根据规则执行的。


    在中心化系统中，中央单元（例如银行）充当守护者的角色。银行检查我们的账户中是否有足够的资金、资金是否指向有效地址等。在去中心化系统中，没有实体来执行这些功能。这就是为什么我们需要加密算法。


    目前使用了多种算法。这些算法也被称为加密的辅助函数。


    这种函数或算法被称为 `hash function`（哈希函数）或 `hashing algorithm`（哈希算法）。


    我们现在详细查看哈希函数的各种属性。我们已经学习了其中大部分。


    ![](img/Image00015.jpg)哈希函数是单向函数。这意味着计算函数的输出是简单的，但几乎无法通过输出确定输入。哈希函数在加密货币中作为辅助函数。


    不同的加密货币基于不同的算法。我们将以比特币的底层算法为例。


    比特币有两种算法。一种算法根据私钥生成公钥。另一种算法负责网络安全和存储交易的安全。


    比特币使用了一种带有函数方程的椭圆曲线来生成公钥![](img/Image00016.jpg)。


    ![](img/Image00017.jpg)

    图 8 椭圆曲线图


    这个复杂的单向函数使用我们的密码（私钥）创建一个公钥，并由此推导出我们的比特币地址。我们稍后将详细查看实践中是如何实现它的。首先，我们将查看负责区块链安全的算法。


    这种算法被称为 `SHA256` 算法。SHA 代表 Secure Hash Algorithm（安全哈希算法）。从用户的角度来看，这个函数相对简单。


    `SHA256` 算法保证了比特币的安全。我们稍后将详细查看比特币如何实现该算法。算法的应用始终相同的：我们将文传递给函数。在函数内部，字母会在几个阶段被移动、交换、压缩或添加。


    ![](img/Image00018.jpg)

    图 9 哈希函数的序列


    我们必须如何移动字母、压缩它们等是由 `SHA256` 算法固定的。


    经过几个阶段，我们得到一个“加密消息”作为输出。`SHA256` 函数的输出被称为 `hash`（哈希）。哈希是一种校验和、控制或安全数字。然而，它很大程度上取决于上下文。


    ![](img/Image00004.jpg)哈希函数的性能或应用类似于学校课程中我们熟知的函数应用于变量的情况。理论上，我们可以用纸和笔计算一段文本的 `SHA256`
    哈希。


    ![](img/Image00019.jpg)

    图 10 用纸和铅笔计算 `SHA256` 算法


    来源：`https://www.youtube.com/watch?v=y3dqhixzGVo&ab_channel=KenShirriff`


    哈希算法中的数字 `256` 表示输出的长度，即计算出的加密消息长度。输出字符被称为位（bits），只能是零或一。


    `SHA256` 算法的输出始终恰好是 256 位长。输入是一个单个字符还是十万个字符并不重要。


    ![](img/Image00020.jpg)哈希函数的输入是任意大的，输出与其无关且始终恒定，在 `SHA256` 的情况下，它恰好是 256 位。


    ![](img/Image00021.jpg)

    图 11 `SHA256` 哈希函数的简化表示


    由于消息只由 1 和 0 组成，它既不可读，也不遵循某种系统。


    通常，为了更清晰，会将这些位中的四位组合并显示为数字或字母。字符字符串随后缩短为 80 或 64 个字符，而不是 256 个。


    ![](img/Image00020.jpg)哈希算法是开放的。任何人都可以将其加载到计算机并确认结果。


    例如，让我们再次加密我们的消息“Bitcoin is awesome!”。生成的哈希为 `75c79bd1c28071544116aaf8af9cd816ae6348bb1410039210`。


    ![](img/Image00022.jpg)

    图 12 SHA256 函数的应用

