- raw: 'The purpose of a token is to represent an object from the real world in the
    digital world. A "VW Golf token" or a "Siemens share token" are conceivable, each
    reflecting the real-world object.


    To receive the tokens, we first set up a smart contract. Then, we have to send
    Ether to the smart contract. In return, we receive a certain number of tokens.


    ![](Image00075.jpg)


    Figure 51 Token issuance through a smart contract


    The smart contract is not only responsible for issuing the tokens, but also for
    using the tokens to another address or monitoring the quantity of tokens.


    It is important that we understand the difference between a coin and a token.


    A coin like Ether or Bitcoin is the currency of the underlying cryptocurrency.
    A token, on the other hand, only exists within a smart ![Picture 4](Image00003.jpg)contract
    on the Ethereum blockchain (or other blockchains that support smart contracts).
    A token does not have its own blockchain or address. We can access the token by
    using the corresponding smart contract on the Ethereum blockchain.


    Tokens are not usually mined but rather issued by the smart contract. Tokens are
    often created with a specific application goal. We will get to know some more
    concrete examples in the coming chapters.


    Any programmer with prior knowledge can set up an individual smart contract and
    use it to create tokens. Over time, many different contracts and tokens were set
    up and issued. Many of them had little or no use.


    ![](Image00004.jpg)It quickly became apparent that there must be a standard for
    tokens that serves as a guideline for the creation of a token. This is how the
    ERC20 standard (Ethereum Request for Comments) came into being. Tokens created
    according to this standard are called ERC20 tokens .


    The ERC20 standard can be compared to a basic framework for a programmer. It specifies
    that every ERC20 token must have the same properties and functions at the lowest
    level. This includes, for example, that the token has a name and an abbreviation
    (symbol) and that a maximum number of tokens must be defined. If the maximum number
    is exceeded, no new tokens are issued. There must also be a possibility in the
    smart contract that makes it possible to send the token from one address to another.


    This requirement makes it easier to offer standardised interfaces for these tokens
    so that they can be traded or sent more easily.


    ![](Image00004.jpg)The creation of ERC20 tokens is standardised and very easy
    to realise. There are now over 100,000 different ERC20 tokens on the market.


    However, this makes it very difficult to see how much value a new token project
    offers. Almost anyone, even without programming skills, can create an ERC20 token
    with an idea and a little internet research.


    This was also the case in the crypto hype of 2017-2018, when numerous new tokens
    were created. Many of these tokens were not based on any real concept or use case.
    Instead, with the help of branding ![Picture 4](Image00003.jpg)and many promises,
    investors (often private individuals) were convinced to invest in these tokens.
    A total volume of over 4 billion euros flowed into these ICOs (Initial Coin Offerings)
    projects.


    The ICO bubble burst in early 2018, with many projects losing over 90% of their
    peak to date.


    Often the promised project was never realised, and the founders merely enriched
    themselves.


    Of course, not all ERC20 projects are automatically bad, but it is important to
    inform yourself sufficiently about whether the promises made can actually be kept.


    Besides Ethereum, there are numerous other cryptocurrencies that can be used as
    a blockchain for the creation of smart contracts and tokens, for example the cryptocurrency
    NEO. NEO is also referred to as Chinese Ethereum. It follows the same approach
    as Ethereum. NEO wants to transfer all data to the blockchain and represent it
    through tokens. There is now talk of tokenising   the world . We will take a closer
    look at other cryptocurrencies that follow the same approach in the course of
    the Ethereum alternatives. However, Ethereum has by far the largest number of
    active users. Therefore, the Ethereum Blockchain is by far the most used for the
    creation of tokens and applications based on smart contracts.


    Having looked at tokens and smart contracts, we now turn to the question of why
    we need smart contracts and tokens in the first place. 


    The smart contracts and tokens based on the Ethereum blockchain form the basis
    for decentralised applications .


    6.4.         DApps


    A smart contract, as we have come to know it so far, can mostly execute a simple
    function. It is an instruction according to the principle: "If X happens, then
    execute Y."


    However, a smart contract can become much more complex. As already mentioned,
    programming skills are required to write a smart contract yourself. The smart
    contracts based on the Ethereum blockchain are programmed in a specially developed
    programming language called Solidity . In the meantime, there are also interfaces
    to more common programming languages, so that significantly more programmers can
    participate in the Ethereum system. Even without prior knowledge of the Solidity
    programming language, it has become relatively simple for a programmer to set
    up a smart contract.


    However, a smart contract is only a relatively simple construct. However, we can
    build more complex applications from these simple building blocks. This works
    by the smart contracts triggering each other and is comparable to a domino chain
    reaction.


    ![](Image00076.jpg)


    Figure 52 Multiple smart contracts interlock


    All this takes place on the decentralised computer and is stored on the blockchain.


    ![](Image00004.jpg)Since the application consisting of the individual smart contracts
    is executed de-centrally on the blockchain, we speak of decentralised applications,
    or Dapps for short. A Dapp can be anything, for example an online game, a social
    media website or a huge database.


    Everything we can bring to the digital world can be realised through smart contracts
    and Dapps.


    An example of a decentralised game that runs completely autonomously on the Ethereum
    Virtual Machine are the crypto kitties .


    On the website [https://www.cryptokitties.co/](https://www.cryptokitties.co/)
    we can collect virtual cats, exchange them and breed them. It is a classic collecting
    game, comparable to digital Pokémon cards.


    ![](Image00077.jpg)


    Figure 53 Crypto Kitties start page


    To participate in the game, we have to send Ether to our cat account and can then
    buy one or more cats.


    The cats we can collect can also mate with each other. This, in turn, gives rise
    to new cats that look similar to their parents, and yet each cat is unique.


    We can doubt the meaningfulness of this game, but for the Ethereum network the
    crypto kitties were the first real, decentralised application.


    But what advantage do we now have from the fact that the game runs de-centrally
    on the blockchain and not, like every other game, on a central server of the game
    developers?


    Let''s consider at a story from the childhood of the inventor of Ethereum, Vitalik
    Buterin.


    Vitalik used to play the game World of Warcraft (WoW). World of Warcraft is an
    open-world game where you can meet other players in a virtual world, complete
    tasks and collect items. It was Vitalik''s absolute favourite game.


    But one day, the game developer Blizzard removed one of his favourite items. That
    day, Vitalik says he cried himself to sleep and realised how unfair centralisation
    can be.


    "I played World of Warcraft in 2007-2010 and was happy with the game, but one
    day Blizzard removed the damage component from my beloved Warlock''s life drain
    spell. I cried myself to sleep and realised that day what horrors centralised
    services can bring. " - Vitalik Buterin'
