    \ be backed by `Bitcoin` - the only demonstrably finite asset.\n\nThere will still\
    \ be central institutions that issue `bitcoin` IOUs in the form of cash.\n\n![](Image00106.jpg)\n\
    \nFigure 76 Bitcoin is accepted as a means of payment\n\nDue to the deflationary\
    \ character of `Bitcoin`, it is possible to accumulate a fortune by saving instead\
    \ of being slowly expropriated. Consumption is less, but much more conscious.\
    \ Companies have to deliver more quality so that people are willing to spend their\
