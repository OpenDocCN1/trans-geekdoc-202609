    7.4.         What should we pay attention to?


    Especially when you are new to cryptocurrencies, there are always obstacles in
    your way, which we will look at in more detail in this subsection so that your
    enthusiasm does not turn into frustration.


    Comparison of fees


    When buying a share or financing a property, different banks and exchanges have
    different costs. It is therefore advisable to compare different stock exchanges
    and banks. Two to three percent fees might not sound like very much, but at the
    latest when financing a house, it is better to think twice.


    It is similar with the purchase of cryptocurrencies. Some exchanges have percentage
    buying and selling fees (such as Binance ), others have a fixed price (such as
    eToro ) and still others have a hybrid model, for example Coinbase . To keep costs
    as low as possible, we need to compare the different price directories.


    In addition, there may be hidden fees, for example due to price differences. With
    one provider, a BTC costs only €10,000, while the Bitcoin is listed for €10,500
    with the other provider.


    This is especially the case with cryptocurrencies, for example when we want to
    exchange Bitcoin for Ethereum.


    It therefore makes sense to compare the prices with the current prices on coinmarketcap
    or other portals before buying. Especially with smaller providers and unpopular
    coins, you should pay attention to this.


    Transaction fees


    We have already seen that sending Bitcoins and other cryptocurrencies involves
    a fee for the miners. The lower the fee, the longer it takes to confirm our transaction.
    In the worst case, the transaction is not processed. Our coins are then not lost,
    but remain in our account, but in the worst case the transaction hangs in a queue
    for days before it is rejected.


    ![](Image00004.jpg)The transaction fees for sending coins are based on the load
    of the network and are not a percentage of the number of coins sent, but of the
    data size of the transaction. This means: If we want to send one BTC, the transaction
    does not cost significantly more than if we want to send 100 Satoshi.'
