    每隔固定的时间（例如每十分分钟），一个包含新信息的包（所谓的“区块”）就会附加到之前的交易历史中。这样做的好处是不需要更新每一笔交易，而是更新一篮交易。\n\
    \n随着时间的推移，信息包逐渐形成了一条链：`区块链`。\n\n为了确保网络中的每个节点（全节点）都拥有当前的 `blockchain`，`区块链` 会定期更新并传输给每个参与者。\n\
    \n任何想要的人都可以将 `Bitcoin` 或任何其他加密货币的交易历史下载到自己的计算机上。通过这种方式，你自己变成了一个节点。这些节点被称为全节点。\n\
    \n`区块链` 是去中心化系统中一份完整的交易历史。每个参与者都同意这一交易历史，使得所有交易都是唯一定义的。\n\n这样做的好处是：如果一个参与者想要作弊并更改其计算机上的\
    \ `blockchain`，所有其他参与者都会立即注意到，因为交易历史不符了。参与者不会接受这种更改。\n\n数字签名，正如我们在上一章中学习到的，它们是系统的一部分。\n\
    \n由于 `区块链` 技术中没有中心监管者，而是有成千上万分布在全球各地的监管者，修改规则是不可能的。\n\n```\n```\nsatoshin@gmx.com\n\
