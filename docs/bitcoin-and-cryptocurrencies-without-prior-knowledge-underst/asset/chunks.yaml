    虚拟货币单位（加密货币）的创建是通过私人计算机网络完成，与中央银行和商业银行的货币不同。非国家替代货币的概念（根据 `BaFin`）。这些是具有高度投机性的交易，可能导致全部损失！此外，无法保证描述的功能能够实现。


