- raw: 'Many private investors try to be smarter than the rest and find the best possible
    time to invest. According to the motto: "Just sell when the price is up and buy
    again after it has fallen."


    The thought process is simple and sounds very charming at first glance.


    The fact is, however, that most inexperienced investors make losses with this
    strategy. The reason is that people act emotionally. Even if we are determined
    to buy Bitcoin after it has fallen 70%, very few will do so because it doesn''t
    feel right.


    For this reason, most investors who follow this investment strategy have less
    money than if they had simply held the coins. In other words, doesn''t pay to
    hope that you are smarter than the market. Instead, you should buy the coins and
    HODL them for the long term.


    In the end, GameKyuubi was right. If he has stayed true to his word and HODLED
    his Bitcoins to date, he has made very good profits over the years.


    This amusing example shows that price fluctuations were already commonplace in
    2013 and did not break the bitcoin''s long-term upward trend.


    But what does the future of Bitcoin look like? Does it make sense to invest now?


    The future of Bitcoin depends on many factors. The biggest factor is whether Bitcoin
    will be needed and used meaningfully at all. Bitcoin proponents agree: Bitcoin
    is unique. It is decentralised, resistant to censorship, transparent and safe
    from attack. No state in the world can exclude participants from the Bitcoin network,
    seize a crypto account or devalue the purchasing power of the stored work through
    inflation.


    At the moment, however, we also see that Bitcoin is completely unsuitable as a
    large-scale means of payment. Volatile prices and high transaction costs prevent
    a meaningful use as a payment method. Volatility describes how much the price
    of an asset class fluctuates. Shares are usually more volatile than commodities
    or government bonds. Bitcoin, in turn, is many times more volatile than shares,
    for example.


    Seven transactions per second are not enough to map all global payment flows.
    However, there are many other points due to which Bitcoin as a payment method
    is currently still considered unrealistic.


    Does this mean that we have read this book for nothing and that Bitcoin will not
    be used in the future? No, because we have learned: money has another very important
    property: the property of storing value.


    Even though Bitcoin cannot be used as a currency on a large scale at the moment,
    Bitcoin was and is the first cryptocurrency. Bitcoin has existed for over ten
    years and has often been pronounced dead.


    ![](Image00004.jpg)Bitcoin has always been the number one cryptocurrency. For
    this reason, Bitcoin is called the mother of cryptocurrencies. The name alone
    is a brand that has been established over the years and stands for independence,
    revolution and resistance against the corrupt banking system.


    The more people who recognise the value of the decentralised currency and join
    the network, the greater influence Bitcoin will achieve.


    Is it possible that Bitcoin will disappear from the scene? Yes, it certainly is.
    But is it also likely?


    As already mentioned, billion-dollar industries have also specialised in Bitcoin.
    Large countries and companies are learning about the value.


    | Company || Industry || Bitcoins in possession |


    | --- | --- | --- |


    | MicroStrategy inc. || Software producer || 91,326 BTC |


    | Tesla, Inc. || Tec. conglomerate || 48,000 BTC |


    | Square inc. || Financial service provider || 8,027 BTC |


    | Marathon Digital Holdings || Mining Group || 5,067 BTC |


    | Galaxy Digital Holdings || Financial service provider || 4,000 BTC |


    | … || … || … |


    | Total ||   || 1.354 million BTC |


    \-May 2021


    In the meantime, over 1.3 million BTC have been bought by large companies such
    as MicroStrategy, Tesla, Galaxy Digital Holdings or Square. All of these companies
    are in turn getting other companies like Paypal, Microsoft or Visa to take cryptocurrency
    trading seriously.


    And here we see the most important advantage Bitcoin has over all other cryptocurrencies:
    the network effect .


    ![](Image00105.jpg)


    Figure 75 Bitcoin network effect


    The network effect describes that the value of a system increases as more and
    more users join the system.


    Facebook became more successful the more users it was able to attract. These in
    turn bring other people to use the network. We can see the same thing with Bitcoin.
    More and more critical voices are dealing with the technology. Many false reports
    that were spread over the course of the last few years are being clarified and
    bringing a niche product into the mainstream.


    It is possible that Bitcoin will disappear completely from the scene, but this
    is extremely unlikely.


    Instead, let''s take a look at what Bitcoin proponents see as the future of Bitcoin.


    The following scenario is purely hypothetical, and many conditions still have
    to be met before such a dramatic system change will occur. Nevertheless, we ask
    the question: What if Bitcoin replaces the dollar?


    Best Case - Bitcoin as a reserve currency:


    If the development of the current monetary system continues as it has, more and
    more people around the globe will realise that fiat money is not a long-term repository
    for the wages of their labour. For money is nothing more than that. It is the
    compensation for the work we have done, which we can store and spend.


    The economy will go through several crises. Each one will be worse than the previous
    one. In order to stimulate the economy again, more and more money has to be printed.
    This in turn leads to more and more crises. People flee into tangible assets such
    as shares, real estate and the like. Companies produce more and more, and consumption
    is increasingly on credit. The states continue to go into debt, while the gap
    between the people who have money to invest and thus profit from rising material
    prices and those who live close to the subsistence level is widening. At some
    point there is no way out. The mood among the population will tip. People are
    losing confidence in the euro, the dollar and other fiat currencies. Instead,
    more and more people are recognising the value of a decentralised currency. Demand
    increases with every new bank failure, with every state and every person excluded
    from the international payments system by economic sanctions, with every new civil
    war in poorer parts of the world and with every new tax and expropriation of property
    to finance the rising national debt.


    At the same time, new techniques are being implemented. The blockchain itself
    is used as a secure core, while payments, loans and other financial services are
    processed via other networks, some of which are still banks and payment service
    providers such as PayPal.


    Gradually, the Bitcoin network and the demand on the network are growing. Due
    to the large network and many active participants, the price, measured in dollars,
    fluctuates less and less. Instead, the price keeps rising and rising, quickly
    reaching prices beyond one million USD. At the same time, the dollar as the world''s
    reserve currency is increasingly losing value. Due to the enormous price of Bitcoin,
    ordinary transactions are no longer calculated in Bitcoin, but in Satoshi.


    Official prices are increasingly quoted in both dollars and bitcoin. At the same
    time, the dollar, the euro and other fiat currencies have massively depreciated,
    multiplying the price of food and everyday items.


    We can decide at the bakery whether we want to buy our bread roll for €125.5 or
    two satoshi. We can choose whether to finance our home with €263 million or 200
    mBTC.


    In tandem with this uptick, further technical updates are constantly being published
    so that millions of transactions can be processed per second and stored in the
    blockchain.'
