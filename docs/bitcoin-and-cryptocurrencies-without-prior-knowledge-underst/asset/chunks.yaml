- raw: 'So that we can clarify these arguments in the future to take away people''s
    fear of cryptocurrencies, let''s take a closer look at the most common myths of
    "non-Bitcoiners."


    9.1.         Bitcoin can be banned


    Let''s start with an argument that you hear again and again in the news or from
    stock market gurus.


    ![](Image00004.jpg)It is often mentioned that Bitcoin and other cryptocurrencies
    are doing well as long as it is still a niche for nerds. As soon as Bitcoin becomes
    bigger, the state will intervene and ban the cryptocurrency.


    Even the head of the European Central Bank, Christine Lagarde , mentioned in an
    interview that Bitcoin needs to be regulated, maybe even banned. Bitcoin is a
    danger and is used for illegal activities.


    We have already discussed in earlier chapters that Bitcoin is not used for illegal
    purposes and that it would be completely nonsensical due to the transparency and
    the factually non-existent anonymity. That the head of the European Central Bank
    makes such a statement is also no longer surprising to us. She symbolically stands
    for the unlimited creation of fiat money, while Bitcoin is seen as a still very
    volatile, but limited and decentralised currency. It is merely an attempt at Bitcoin
    character assassination, which has worked well in recent years. For a long time,
    Bitcoin was considered evil and criminal ; however, the truth is gradually spreading.
    Bitcoin is not used for criminal business but is an alternative to the centralised,
    inflationary monetary system.


    Although one might not think it at first glance, Lagarde''s statement is nevertheless
    a positive signal for the crypto market. A person like the head of the European
    Central Bank would not be involved with Bitcoin if it was still the same niche
    product it was in 2010. Instead, the statement that Bitcoin needs to be regulated
    and controlled is a sign of how much popularity and value Bitcoin has gained.


    But what could a ban on the possession of Bitcoin look like? Is that even possible?


    To answer these questions, let''s review what we need to do to get Bitcoins in
    our wallet: We need to create a randomly chosen private key that is mapped to
    a public key. Owning Bitcoin, conversely, means that we have generated a randomly
    chosen number with 256 digits, which we call a private key. How is generating
    a random number to be prohibited?


    In fact, mining cannot be banned either. Mining is nothing more than the execution
    of hashing algorithms by a computer, i.e., the computer solves a mathematical
    problem. The same SHA256 algorithm is also used in numerous other applications.
    The secret service, the military: they all use this algorithm.


    How one would want to prohibit such a thing in a legal text is beyond the imagination
    of any lawyer in the world.


    ![](Image00004.jpg)It is factually impossible to ban the blockchain or Bitcoin.
    The basis is provided by cryptographic algorithms, which cannot be banned. You
    cannot ban mathematics.


    Banning the possession of Bitcoin would be like banning the flip of a coin 256
    times. Now, we see how absurd the subject of a ban is.


    What can be banned or severely restricted, on the other hand, are the access points
    and framework conditions. This means that official institutions such as crypto
    exchanges are prohibited from acquiring new customers.


    ![](Image00004.jpg)We must always keep in mind that the Bitcoin network cannot
    be banned. A state can only cut itself off from the Bitcoin network. That would
    only make sense if all the states in the world decided at the same time to block
    all access points.


    Even then, the price would initially drop, but trading would go underground over
    time, where control would be lost even more. Therefore, a complete blockade of
    the buying and selling of Bitcoin and other cryptocurrencies is rather pointless.
    It is more likely, however, that states will put more and more hurdles in the
    way of buying and holding Bitcoin.


    And that is exactly the effort we are already seeing. A few years ago, it was
    easy to open an account on a crypto exchange and buy bitcoins with just an email
    address. Nowadays, you often must prove your identity through a verification process
    before you can deposit a cent into your account. This procedure is also called
    KYC (know your customer).


    In addition, states can put further obstacles in the way of cryptocurrencies.
    For example, the presentation of a certificate of good conduct before the purchase
    of cryptocurrencies, special taxes or special annual crypto levies, comparable
    to property taxation.


    In order for the states to retain control over the monetary system, numerous "tricks"
    ![Picture 4](Image00003.jpg)will still come to light. Every new sanction is a
    positive sign for cryptocurrencies. Even if the price will collapse briefly after
    such statements, the value has risen in the long term.


    Furthermore, environmental protection can be used as an excuse to make mining
    illegal, even though we have seen that mining is already producing green energy
    today.


    Again, we need to understand that mining (just like owning Bitcoin) cannot technically
    be blocked. However, it is questionable how many citizens would accept the risk,
    for example of a house search, just because they own Bitcoins. The majority would
    instead "bend" to the requirements in order not to come into conflict with the
    law, even if the ban is neither sensible nor in the interests of the citizens.
    It is human nature to avoid confrontations with higher authorities.


    We see this, for example, in an authoritarian system like the People''s Republic
    of China. A large part of the population is largely passive in accepting the encroachment
    of freedom and personal rights, even though in recent years there has been an
    increase in uprisings and counter-movements.


    In Europe and in the USA, the mentality of citizens is very reserved when it comes
    to resistance against the state apparatus. This is perfectly understandable, because
    our laws and regulations are not arbitrary, but have a concrete purpose, even
    if the implementation or execution is not always optimal.


    Accordingly, it is not so much a technical prohibition that can threaten Bitcoin,
    but a game-theoretical consideration that involves all participants in the financial
    system, as well as the herd behaviour of people.


    To completely eliminate Bitcoin in this way, the majority of states in the world
    would have to resort to totalitarian measures at the same time. History has shown
    that no totalitarian state can prevail in the long term. Moreover, we see that
    Bitcoin can also be interesting for states to make themselves independent of the
    world''s reserve currency, the dollar.


    Another possibility is to offer your own cryptocurrency, a state cryptocurrency.
    In some ways, this would be effective because the trust in the state is still
    higher among the masses than in an "unknown" cryptocurrency.


    The electric euro, the electronic dollar or the electric yen have been talked
    about for a long time, and the abolition of cash has already begun. However, these
    state cryptocurrencies are fundamentally different from Bitcoin and the network.
    These currencies will be centrally controlled and not protected from inflation.
    Censorship and expropriation would be easily possible. In the long term, such
    a currency will also have a hard time gaining acceptance.


    The more people understand the monetary system and realise the value of a backed
    currency, the more people will prefer Bitcoin to government cryptocurrencies.


    What the future will bring exactly is uncertain.


    Things can also turn out quite differently, for example, if states recognise and
    use the advantages of Bitcoin. One example of this is Iran. In Iran, Bitcoin was
    viewed very critically. However, under the US administration of Donald Trump,
    Iran was excluded from international dollar trade.


    Iran was banned from conducting international trade with the world currency, the
    US dollar.'
  fmt: '

    So that we can clarify these arguments in the future to take away people''s fear
    of cryptocurrencies, let''s take a closer look at the most common myths of "non-Bitcoiners."


    ## 9.1. Bitcoin can be banned


    Let''s start with an argument that you hear again and again in the news or from
    stock market gurus.


    It is often mentioned that Bitcoin and other cryptocurrencies are doing well as
    long as it is still a niche for nerds. As soon as Bitcoin becomes bigger, the
    state will intervene and ban the cryptocurrency.


    Even the head of the European Central Bank, Christine Lagarde, mentioned in an
    interview that Bitcoin needs to be regulated, maybe even banned. Bitcoin is a
    danger and is used for illegal activities.


    We have already discussed in earlier chapters that Bitcoin is not used for illegal
    purposes and that it would be completely nonsensical due to the transparency and
    the factually non-existent anonymity. That the head of the European Central Bank
    makes such a statement is also no longer surprising to us. She symbolically stands
    for the unlimited creation of fiat money, while Bitcoin is seen as a still very
    volatile, but limited and decentralised currency. It is merely an attempt at Bitcoin
    character assassination, which has worked well in recent years. For a long time,
    Bitcoin was considered evil and criminal; however, the truth is gradually spreading.
    Bitcoin is not used for criminal business but is an alternative to the centralised,
    inflationary monetary system.


    Although one might not think it at first glance, Lagarde''s statement is nevertheless
    a positive signal for the crypto market. A person like the head of the European
    Central Bank would not be involved with Bitcoin if it was still the same niche
    product it was in 2010. Instead, the statement that Bitcoin needs to be regulated
    and controlled is a sign of how much popularity and value Bitcoin has gained.


    But what could a ban on the possession of Bitcoin look like? Is that even possible?


    To answer these questions, let''s review what we need to do to get Bitcoins in
    our wallet: We need to create a randomly chosen private key that is mapped to
    a public key. Owning Bitcoin, conversely, means that we have generated a randomly
    chosen number with 256 digits, which we call a `private key`. How is generating
    a random number to be prohibited?


    In fact, mining cannot be banned either. Mining is nothing more than the execution
    of hashing algorithms by a computer, i.e., the computer solves a mathematical
    problem. The same `SHA256` algorithm is also used in numerous other applications.
    The secret service, the military: they all use this algorithm.


    How one would want to prohibit such a thing in a legal text is beyond the imagination
    of any lawyer in the world.


    It is factually impossible to ban the blockchain or Bitcoin. The basis is provided
    by cryptographic algorithms, which cannot be banned. You cannot ban mathematics.


    Banning the possession of Bitcoin would be like banning the flip of a coin 256
    times. Now, we see how absurd the subject of a ban is.


    What can be banned or severely restricted, on the other hand, are the access points
    and framework conditions. This means that official institutions such as crypto
    exchanges are prohibited from acquiring new customers.


    We must always keep in mind that the Bitcoin network cannot be banned. A state
    can only cut itself off from the Bitcoin network. That would only make sense if
    all the states in the world decided at the same time to block all access points.


    Even then, the price would initially drop, but trading would go underground over
    time, where control would be lost even more. Therefore, a complete blockade of
    the buying and selling of Bitcoin and other cryptocurrencies is rather pointless.
    It is more likely, however, that states will put more and more hurdles in the
    way of buying and holding Bitcoin.


    A few years ago, it was easy to open an account on a crypto exchange and buy bitcoins
    with just an email address. Nowadays, you often must prove your identity through
    a verification process before you can deposit a cent into your account. This procedure
    is also called `KYC` (know your customer).


    In addition, states can put further obstacles in the way of cryptocurrencies.
    For example, the presentation of a certificate of good conduct before the purchase
    of cryptocurrencies, special taxes or special annual crypto levies, comparable
    to property taxation.


    In order for the states to retain control over the monetary system, numerous "tricks"
    will still come to light. Every new sanction is a positive sign for cryptocurrencies.
    Even if the price will collapse briefly after such statements, the value has risen
    in the long term.


    Furthermore, environmental protection can be used as an excuse to make mining
    illegal, even though we have seen that mining is already producing green energy
    today.


    Again, we need to understand that mining (just like owning Bitcoin) cannot technically
    be blocked. However, it is questionable how many citizens would accept the risk,
    for example of a house search, just because they own Bitcoins. The majority would
    instead "bend" to the requirements in order not to come into conflict with the
    law, even if the ban is neither sensible nor in the interests of the citizens.
    It is human nature to avoid confrontations with higher authorities.


    We see this, for example, in an authoritarian system like the People''s Republic
    of China. A large part of the population is largely passive in accepting the encroachment
    of freedom and personal rights, even though in recent years there has been an
    increase in uprisings and counter-movements.


    In Europe and in the USA, the mentality of citizens is very reserved when it comes
    to resistance against the state apparatus. This is perfectly understandable, because
    our laws and regulations are not arbitrary, but have a concrete purpose, even
    if the implementation or execution is not optimal.


    Accordingly, it is not so much a technical prohibition that can threaten Bitcoin,
    but a game-theoretical consideration that involves all participants in the financial
    system, as well as the herd behaviour of people.


    To completely eliminate Bitcoin in this way, the majority of states in the world
    would have to resort to totalitarian measures at the same time. History has shown
    that no totalitarian state can prevail in the long term. Moreover, we see that
    Bitcoin can also be interesting for states to make themselves independent of the
    world''s reserve currency, the dollar.


    Another possibility is to offer your own cryptocurrency, a state cryptocurrency.
    In some ways, this would be effective because the trust in the state is still
    higher among the masses than in an "unknown" cryptocurrency.


    The electric euro, the electronic dollar or the electric yen have been talked
    about for a long time, and the abolition of cash has already begun. However, these
    state cryptocurrencies are fundamentally different from Bitcoin and the network.
    These currencies will be centrally controlled and not protected from inflation.
    Censorship and expropriation would be easily possible. In the long term, such
    a currency will also have a hard time gaining acceptance.


    The more people understand the monetary system and realise the value of a backed
    currency, the more people will prefer Bitcoin to government cryptocurrencies.


    What the future will bring exactly is uncertain.


    Things can also turn out quite differently, for example, if states recognise and
    use the advantages of Bitcoin. One example of this is Iran. In Iran, Bitcoin was
    viewed very critically. However, under the US administration of Donald Trump,
    Iran was excluded from international dollar trade.


    Iran was banned from conducting international trade with the world currency, the
    US dollar.

    '
  trans: '

    为了让我们在未来能够澄清这些论点，并消除人们对加密货币的恐惧，让我们仔细观察一下“非比特币持有者”最常见的误区。


    ## 9.1. 比特币可以被禁止


    让我们从一个在新闻或股市大师口中反复听到的论点开始。


    人们经常提到，只要比特币和其他加密货币仍然是极客的小众领域，它们就会运行良好。一旦比特币变得大，国家就会干预并禁止这种加密货币。


    即使是欧洲中央银行行长克里斯蒂·拉加德（Christine Lagarde）在采访中也提到，比特币需要监管，甚至可能被禁止。比特币是危险的，并用于非法活动。


    我们在之前的章节中已经讨论过，比特币并未用于非法目的，由于其透明性以及事实上并不存在的匿名性，这样做是完全毫无意义的。欧洲中央银行行长发表这样的表态，对我们来说也不再感到惊讶。她在象征意义上代表了法币的无限创造，而比特币被视为一种虽然仍然波动剧烈、但有限且去中心化的货币。这仅仅是对比特币的一种人格抹杀，而且近年来这种做法效果很好。长期以来，比特币被认为是邪恶和犯罪的；然而，真相正在逐渐传播。比特币并未用于犯罪业务，而是中心化、通胀性货币体系的替代方案。


    尽管人们初看可能并不这么认为，但拉加德的声明对加密市场来说是一个积极信号。如果比特币仍然是 2010 年那样的分众产品，像欧洲中央银行行长这样的人是不会参与其中的。相反，比特币需要监管和控制的说法说明了比特币已经获得了多大的人气和价值。


    但禁止持有比特币会是什么样子呢？这真的可能吗？


    为了回答这些问题，让我们回顾一下在钱包中获得比特币需要做什么什么：我们需要创建一个随机选择的、映射到公钥的私钥。相反，拥有比特币意味着我们生成了一个 256
    位的随机数字，我们称之为 `private key`。如何能禁止生成随机数呢？


    事实上，挖矿也无法被禁止。挖矿本质上是计算机执行哈希算法，即计算机在解决一个数学问题。同样的 `SHA256` 算法也用于许多其他应用。情报机构、军方：他们都在使用这种算法。


    人们想在法律文本中禁止这种事情，这世界上任何律师的想象力都无法触及。


    事实上，禁止区块链或比特币是不可能的。其基础是由加密算法提供的，而加密算法是无法禁止的。你无法禁止数学。


    禁止持有比特币就像禁止抛掷 256 次硬币。现在，我们看到禁止这个主题是多么荒谬了。


    另一方面，可以禁止或严重限制的是接入点和框架条件。这意味着加密交易所等官方机构被禁止获取新客户。


    我们必须始终记住，比特币网络是无法被禁止的。国家只能让自己与比特币网络隔离开。只有当全世界所有的国家同时决定阻塞所有的接入点，这才有意义。


    即使如此，价格最初会下跌，但随着时间的推移，交易将转向地下，那里的控制将更加失去。因此，完全封锁比特币和其他加密货币交易是没有意义的。更有可能的是，国家将为购买和持有比特币设置越来越多的障碍。


    几年前，在加密交易所开设账户并只需一个电子邮件地址即可购买比特币。现在，你通常在向账户中存入一分钱之前，必须通过验证程序证明你的身份。这种程序也被称为 `KYC`（了解你的客户）。


    此外，国家还可以为加密货币设置更多障碍。例如，在购买加密货币前出示良好证明、特殊的税种或类似于财产税的特殊年度加密货币征税。


    为了让国家保留对货币体系的控制，会有许多“花招”出现。每一项新制裁都是加密货币的积极信号。即使价格在此类声明后会短暂崩溃，但其价值长期来看是增长的。


    此外，环境保护可以作为使挖矿违法的借口，尽管我们看到现在的挖矿已经在生产绿色能源。


    再次，我们需要理解挖矿（就像拥有比特币一样）在技术上是无法被阻的。然而，有多少公民会仅仅因为拥有比特币而接受风险（例如被搜查房屋）？大多数人会选择“顺从”要求以避免与法律发生冲突，即使这种禁止既不合理也不符合公民利益。避免与高权威对抗是人性的本能。


    我们这一点，例如在中华人民共和国这样的威权体制下。很大一部分人口在接受自由和个人权利受到侵犯时很大程度上是被动的，尽管近年来起义和反击运动有所增加。


    在欧洲和美国，公民在抵抗国家机器方面的心态非常谨慎。这完全可以理解，因为我们的法律法规不是随意的，而是有具体目的的，即使实施或执行并非完美。


    因此，威胁比特币的与其说是技术性的禁止，不如说是涉及金融系统中所有参与者以及人类行为的博弈论考虑。


    要通过这种方式完全消除比特币，世界上大多数国家必须同时采取极权主义措施。历史证明，没有任何极权主义国家可以长期存在。此外，我们看到比特币对于国家让自己独立于世界储备货币美元来说，也很有趣。


    另一种可能性是提供自己的加密货币，即国家加密货币。在某些方面，这是有效的，因为大众对国家的信任仍然高于对“未知”加密货币的信任。


    电子欧元、电子美元或电子日元已经被讨论了很久，现金废除已经开始。然而，这些国家加密货币与比特币和网络有本质区别。这些货币将由中央控制，且不受通胀的保护。审查和征收将变得容易。从长远来看，这种货币也很难获得认可。


    越多的人理解货币体系并意识到背书货币的价值，就越倾向于选择比特币而非政府加密货币。


    未来究竟会带来什么是不确定的。


    情况也可能完全不同，例如如果国家承认并利用比特币的优势。伊朗就是一个例子。在伊朗，比特币曾被非常批判地看待。然而，在唐纳德·特朗普政府时期，伊朗被排除在国际美元贸易之外。


    伊朗被禁止与世界货币美元进行国际贸易。


    '
