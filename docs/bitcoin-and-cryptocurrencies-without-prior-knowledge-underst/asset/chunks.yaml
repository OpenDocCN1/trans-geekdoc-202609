  trans: '


    许多私人投资者试图比其他人更聪明，寻找最佳的投资时机。正如格言所说：“价格上涨时卖出，价格下跌后再买入。”


    这种思考过程非常简单，乍一看非常有吸引力。


    然而，事实是，大多数缺乏经验的投资者在使用这种策略时会遭受亏损。原因是人的行为是感性的。即使我们下定决心要在 `Bitcoin` 下跌 70% 后买入，也极少能付诸行动，因为感觉不对劲。


    因此，大多数遵循这种投资策略的投资者，其资金量比他们简单持有币种要少。换句话说，指希望自己比市场聪明是徒劳的。相反，你应该买入币并长期持有（HODL）。


    归结底，GameKyuubi 是的。如果他一直言出必行并持有 `Bitcoins` 直至今，那么多年来他已经获得了非常丰厚的利润。


    这个幽默的例子表明，价格波动在 2013 年已经是常有的事，而且并没有打破比特币的长期上升趋势。


    ## 比特币的未来


    但 `Bitcoin` 的未来是什么样的呢？现在投资有意义吗？


    `Bitcoin` 的未来取决于许多因素。最大的因素是 `Bitcoin` 是否会被需要并有意义地使用。`Bitcoin` 的支持者一致认为：`Bitcoin`
    是独特的。它是去中心化的、抗审查的、透明且防御攻击的。世界上任何国家都无法将参与者排除在 `Bitcoin` 网络之外，没收加密账户通过通货膨胀贬低存储劳的购买力。


    然而，目前我们也看到 `Bitcoin` 完全不适合作为大规模支付。价格波动和高交易成本阻碍了其作为支付方式的重要用途。波动性描述了资产类别价格波动程度。股票通常比大商品或政府债券波动更大。例如，`Bitcoin`
    的波动性是股票许多倍。


    每秒七次交易不足以覆盖全球支付流。然而，还有许多其他原因导致 `Bitcoin` 作为支付方式目前仍被认为是不现实的。


    这意味着我们读这本书是白读，`Bitcoin` 未来将不会被使用吗？不，因为我们学到了：钱还有另一个非常重要的属性：价值存储属性。


    尽管 `Bitcoin` 目前无法作为货币大规模使用，但 `Bitcoin` 曾经是也是第一种加密货币。`Bitcoin` 已经存在了十多年，并且经常被宣布死亡。


    ![](img/Image00004.jpg)`Bitcoin` 一直是第一加密货币。正因如此，`Bitcoin` 被称为加密货币之母。这个名字本身就是一个多年来建立的品牌，代表了独立、革命和对腐败银行系统的反抗。


    承认去中心化货币价值并加入网络的人越多，`Bitcoin` 获得的影响就越大。


    `Bitcoin` 可能会从舞台上消失吗？是的，这完全有可能。但这可能吗？


    正如前面提到的，数十亿美元的行业也专门研究了 `Bitcoin`。大国和大公司正在学习其价值。


    | 公司 | 行业 | 持有的比特币 |

    | --- | --- | --- |

    | MicroStrategy inc. | 软件生产商 | 91,326 BTC |

    | Tesla, Inc. | 科技巨头 | 48,000 BTC |

    | Square inc. | 金融服务提供商 | 8,027 BTC |

    | Marathon Digital Holdings | 矿业集团 | 5,067 BTC |

    | Galaxy Digital Holdings | 金融服务提供商 | 4,000 BTC |

    | … | … | … |

    | 总计 | | 135 万万 BTC |


    \-2021 年 5 月


    在此期间，`MicroStrategy`、`Tesla`、`Galaxy Digital Holdings` 或 `Square` 等大公司购买了超过 130
    万个 BTC。这些公司反过来让 `Paypal`、`Microsoft` 或 `Visa` 等公司开始重视加密货币交易。


    在这里我们看到了 `Bitcoin` 相比所有其他加密货币最重要的优势：网络效应。


    ![](img/Image00105.jpg)

    图 75 比特币网络效应


    网络效应描述了随着越来越多的用户加入，系统的价值会增加。


    Facebook 吸引的用户越多就越成功。这些用户反过来又带来了其他人使用该网络。我们在 `Bitcoin` 身上看到了同样的情况。越来越多的批评声音正在处理这项技术。过去几年中传播的许多虚假报告正在得到澄清，并将一种小众产品推向主流。


    `Bitcoin` 可能会完全从舞台上消失，但这极不可能。


    相反，让我们看看 `Bitcoin` 支持者认为的 `Bitcoin` 未来是什么。


    以下场景纯粹是假设性的，在发生如此剧烈的系统变化之前，还需要满足许多条件。然而，我们问：如果 `Bitcoin` 取代美元会怎样？


    ### 最优情况 - 比特币作为储备货币


    如果当前货币体系的发展继续下去，全球越来越多的人将意识到法币不是劳动工资的长期存储地。因为钱无非此。它是我们所做工作的报酬，我们可以存储和花费它。


    经济将经历多次危机。每一次都会比上一次更糟。为了再次刺激经济，必须打印更多的钱。这反过来导致了越来越多的危机。人们逃向实物资产，如股票、房地产等。企业产量增加，消费越来越多依赖信贷。国家继续负债，而有钱投资并从价格上涨中获利的人与生活在生存边缘的人之间的差距正在扩大。在某个时刻，无路可走。情绪将发生转变。人们对欧元、美元和其他法币失去信心。相反，越来越多的人承认去中心化货币的价值。


    '
