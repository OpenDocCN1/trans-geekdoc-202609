    像 `Tesla` 或 `Apple` 这样的大型公司长期通过 `Bitcoin` 接收其大部分流动资金。在很一段时间内，两种货币体系可以并行存在，直到中央银行货币的需求下降到几乎为零。当法币购买力同样下降到零时，通胀性的中央体系将逐渐脱离，`Bitcoin`
    作为新的储备货币被引入。所有流动资产将由 `Bitcoin` 支撑——它是唯一被证明有限的资产。


    仍然会有中央机构以现金形式发行 `bitcoin` 欠条（IOU）。


    ![](img/Image00106.jpg)


    图 76 Bitcoin 作为支付手段被接受


    由于 `Bitcoin` 的通缩特性，人们可以通过储蓄来积累财富，而不是被缓慢地剥夺。消费减少了，但变得更加理智。公司必须提供更高质量的产品，人们才愿意花花钱。


    诚然的是：这种想法在目前这个阶段需要大量的想象力。中央机构需要很多时间才能放弃对货币体系的控制。


    ![](img/Image00004.jpg)总之，我们可以说，许多知名富豪以及像 `Tesla` 这样的大型科技公司现在也进入了 `Bitcoin` 领域。这正在塑造人们对加密货币的接受和信任。对
    `Bitcoin` 可以作为价值存储的信心。对将钱投资在 `Bitcoin` 比放在负利率的储蓄账户中更有意义的信心。正如人们几千年来对黄金那样的信任。


    开发团队在可用性和可扩展性方面取得了重大的突破。`Bitcoin` 正在发现越来越多的吸引力和可能性，作为一种支付手段也是如此。


    诚然，`Bitcoin` 远没有 `Visa` 或 `Master Card` 的水平，没有人能说它是否有一天能达到，但大投资者正日益认可 `Bitcoin`
    的数字黄金属性。


    `bitcoin` 消失在舞台上是非常不可可能的，但其他 10,000 多种加密货币和代币呢？


    ### 8.3 山山寨币的未来


    目前的加密货币市场可以与过去 40 年的技术领域相比。技术和社交媒体正变得越来越繁荣。在此过程中，许多公司相继成立。其中一些今天仍是市场领导者；另一些则已消失湮灭。


    例如，像 `Myspace` 这样的大型社交媒体平台也一夜之间消失在舞台上。加密货币市场也将有类似的行为。逐渐，最好、最高的项目将脱颖而出，而那些不增加价值的项目将变得无关紧要。


    然而，目前仍然处于初始阶段，极难发现哪种技术或哪个特定项目将胜出。


    在过去的几年里，由于所有资金的流入，加密货币市场巨大增长。我们现在可以购买和发送 10,000 多种不同的加密货币。显而易见，我们未来不会运行 1000 种不同的支付方式或
    1000 种不同的去中心化网络。很有可能，这些加密货币中的 99% 将消失。


    此外，新项目不断不断加入，通过营销积累了大量的投资者资金。


