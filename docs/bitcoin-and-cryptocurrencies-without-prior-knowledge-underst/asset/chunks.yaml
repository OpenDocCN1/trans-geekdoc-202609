- raw: 'Even though losing a virtual ability in WoW doesn''t seem that tragic, the
    crypto kitties show how to do it better. Just like our cryptocurrencies, the Kitties
    are 100% our own. There is no institution that can take them away from us, exclude
    us from trading or close the account. The community decides on the rules, improvements,
    etc.


    Strictly speaking, even a DApp is not 100% decentralised. This is because ![Picture
    4](Image00003.jpg)in order to run the application on our computer, we need programmes
    that enable the content to be displayed. This is similar to how we need an internet
    browser to access the internet. These programmes run on central servers.


    The advantage is that we can also access the decentralised network from any other
    server at any time. If the PC or the browser is defective, we can access the internet
    via another computer.


    The crypto kitties have made something else clear: every purchase, exchange and
    reproduction of the crypto kitties is realised through a smart contract. This
    maps transactions on the Ethereum blockchain.


    This means that every time two cats mate or we swap the virtual cats, a transaction
    is triggered on the Ethereum blockchain. This costs the player money and increases
    the network load.


    At its peak in 2017, the Ethereum network was almost at full capacity because
    of the crypto kitties. Over 13% of all transactions were due to the collection
    game alone. This also shows that the network still has to overcome scaling difficulties.


    In the future, DApps, just like the entire Ethereum network, will continue to
    develop. DApps will become much more important.


    However, games are not the only area of application for DApps. DAOs are another
    possible application.


    6.5.         DAOs


    We have already seen an example of an application on the Ethereum blockchain.
    With crypto kitties, the focus was on the fun and collection factor. With DAOs,
    the focus is on economic enterprises that can be mapped on the blockchain.


    A Decentralised Autonomous Organizations DAO is an organisation that has no board
    of directors or decision-making staff. Instead, all rules are written down through
    smart contracts.


    ![](Image00004.jpg)A DAO runs completely autonomously on the Ethereum blockchain.
    Every process within the company is stored in the Ethereum blockchain as a transaction.


    The procedure for setting up a DAO is always the same:


    First, the company is "founded." In the process, the rules are written in smart
    contracts. Anyone can see these.


    Afterwards, a crowdfunding is launched where future tokens can be secured. This
    is important so that the company builds up start-up capital.


    By sending money to the company, for example in the form of Ether, we can become
    part of the company. In return, we receive a token. This is comparable to buying
    a share in the company. If you choose a good company, you can increase your money
    as a "shareholder". However, it can also happen that the company cannot arouse
    interest for potential investors, and you thus lose your invested money completely.


    ![](Image00004.jpg)As soon as the DAO has been funded, it will be launched. From
    now on, it runs completely autonomously. All decisions are made by the community,
    i.e., the holders of the DAO tokens. The community can suggest what the capital
    is used for.


    In decision-making processes within the company, the tokens are voted on democratically.


    For example, the smart contracts may stipulate that a change is only adopted if
    at least 60% of the shareholders—the owners of the tokens—vote in favour of it.


    Every employee or investor can invest in the company and has the same voting rights
    as a percentage of their shares. There are no hierarchical structures like in
    a central company.


    ![](Image00004.jpg)Because the blockchain is decentralised, no central decision-making
    bodies are needed. Instead, the entire consensus-building process is decentralised
    on the Ethereum blockchain.


    One example of such a DAO is Steemit .


    ![](Image00078.jpg)


    Figure 54 Logo steemit.com


    Founded in 2016, Steemit is a decentralised social media and blogging platform.
    It is based on the Steem blockchain.


    We can access the decentralised forum at the URL https://steemit.com/. Users can
    create content, read it and exchange ideas with each other. In addition, users
    are rewarded for good content. Not a central company, but the users themselves
    decide what is considered good.


    As is so often the case, the trust factor is completely taken out of the equation.
    The rules by which the company acts are laid down in the public smart contracts.


    Another example of a DAO is an investment fund or company. Everyone who invests
    in the company and thus pays in capital receives voting rights in the form of
    a token. Then we can regularly vote on which shares, which real estate or other
    asset classes the company should invest in, when it should buy and when it should
    sell. In doing so, we can set all the rules ourselves or submit new proposals,
    which are then also voted on. For example, an automatic bonus to all investors
    is possible if an investment has done well. We also do not have to trust a central
    stock exchange and do not need a cost-intensive fund manager.


    The fields of application of DAOs are manifold.


    We must be aware that the company''s launch rules (the smart contracts) were programmed
    by humans and may contain errors that an end user without programming knowledge
    cannot easily understand (not even experienced programmers or security companies
    can always do this beyond doubt).


    This is shown by a very popular example: The DAO .


    The DAO


    One often reads about an implementation called The DAO . This was one of the first
    and largest DAO projects. The DAO project recognised the DAO hype and also named
    its cryptocurrency the DAO. It''s like a company calling itself “artificial intelligence"
    just to automatically look more attractive to investors.


    The DAO was developed in 2016 by the company Slock.it and executed on the Ethereum
    blockchain. It was a kind of investment company.


    Here you could exchange your Ether for DAO tokens. You could then use your DAO
    tokens to take part in votes on how the decentralised, autonomous company should
    be managed.


    The DAO was an open-source project . This is because anyone can read the smart
    contracts that serve as the foundation of a DAO. The DAO gained enormous popularity
    within a few months. However, the DAO smart contract had a security vulnerability:


    It was possible to issue DAO tokens for Ether and reclaim them afterwards. An
    attacker discovered this vulnerability on 17 June 2016 and was able to capture
    3.6 million Ether in a short time. At the time, the value was around 70 million
    euros.


    The hacker could spend the tokens, reclaim the ETH and so on. Theoretically, this
    would be possible indefinitely, but he made do with 3.6 million ETH.


    In response, the price of Th -DAO token fell by over 70% within a few hours.


    ![](Image00079.jpg)


    Figure 55 Price development of "The DAO Coin


    Fortunately, there was a security measure in place that prevented the hacker from
    leaving with the coins: Before the refunded coins could be spent, there was a
    hold period of 28 days. The community quickly noticed the incident and from then
    on had 28 days to decide how to deal with this problem.


    In response to the incident, a discussion was sparked, and the attacker defended
    himself. Strictly speaking, it was not a hack, because the attacker did nothing
    illegal. He merely recognised a weakness in the smart contract and exploited it
    for his own benefit.


    He stressed in an official statement that he is legally entitled to the coins,
    that he has behaved legally and that a hard or soft fork would immensely damage
    the reputation of Ethereum. One could no longer trust that the code cannot be
    changed arbitrarily. Any kind of hard or soft fork would be the end of Ethereum.'
