    the costs of the war, paper money was unceremoniously decoupled from the price
    of gold.


    All currencies today are unbacked currencies. They are also called `fiat currencies`.


    ### What are the characteristics of this new, unbacked currency?


    The money is still just as transportable and divisible as before. However, money
    can be multiplied at will by the people responsible for controlling the money
    press. This task is taken over by the central banks.


    If a central bank prints `10%` new banknotes per year without destroying old banknotes,
    each existing banknote is only worth about `90%`. Of course, the value on the
    banknote itself does not change. A `€10` banknote will remain a `€10` banknote
    forever. However, the purchasing power, i.e. what we get for our money, decreases.
    As a result, the prices of food, real estate or material assets follow suit.


    This does not automatically have to be bad - as long as the standard of living
    is also adjusted. Optimally, rising salaries offset this effect.


    In any case, we see that the property of storing value is controlled solely by
    a central entity. We trust this entity to use its power over the monetary system
    wisely. As long as it continues to do so, there is little to oppose the unbacked
    fiat money system. So much for the theory.


    ### What does this theoretical view look like in reality?


    Even if the money monopoly is used sensibly, one major problem always remains:
    trust in a central institution like the state and central banks.


    ![](Image00004.jpg)


    We must trust that what we use as money will also be accepted as money by other
    people and that we will get other goods in return.


    If this is not the case, we are stuck with the currency and it is worthless. So
    where does the confidence come from that our currency, i.e. our `euros`, Swiss
    francs or `dollars`, will still be accepted by other participants in the monetary
    system tomorrow or in ten years'' time? Because the abandonment of the gold standard
    means that it is no longer backed by gold.


    It goes without saying that we will be able to buy food in the supermarket tomorrow
    with our `euro` notes, doesn''t it?


    Yes and no. This system requires a central institution to ensure that we get value
    for the coloured notes we use as money. This is the task of the state and the
    central banks, which watch over the money. We trust that the bank has really "put
    away" `€10` for our `€10` note.


    ![](Image00004.jpg)


    In stable times, this centralised banking system works wonderfully. However, when
    a crisis arises and confidence in the state dwindles, confidence in the currency
    often dwindles at the same time.


    There is a direct correlation between the stability of a government and the value
    of the currency.


    There have been plenty of negative examples in the past, for example the Greek
    crisis, when people ran in droves to the ATMs but were not allowed to withdraw
    their own money.


    Another example is the economic crisis in Venezuela, where trust in the government
    and the currency was almost completely lost, resulting in an inflation rate of
    over `130,000%` in `2018`, according to the International Monetary Fund. As a
    result, people secured themselves with goods such as oil, `dollars` or cryptocurrencies.


    The latter example also shows us the big problem of all fiat currencies: The fact
    that they are no longer backed and can be printed in any mass by a central administrative
    body means that the currency is not protected against inflation. The European
    Central Bank (`ECB`), the Federal Reserve (`FET`) or the Swiss and Japanese central
    banks can theoretically create billions in new money overnight. And that is how
    it is done! In principle, inflation is not automatically good or bad. Economists
    argue about whether slight inflation keeps economic growth high and whether this
    would also be possible with a deflationary currency.


    Spending money or taking on debt is also not reprehensible per se but ensures
    growth.


    In a healthy economic cycle, loans are one of the most effective means of strengthening
    the economy. When an entrepreneur borrows money to create new jobs and pays the
    money back with interest in a few years, it has a positive effect for everyone
    in the system: both for the workers who can feed their families, for the company
    that can expand, for the consumers who can buy products, and for the bank that
    gets interest on its capital.


    Unfortunately, in the past, investments were not made in strong companies, but
    in ailing states.


    It is a fact that billions of new `Dollars` have been printed in recent years
    to buy government bonds of indebted countries like Italy or Greece. This new money
    is not matched by any countervalue in the form of a country''s economic performance.
    These states do not put the money to good use, but burn it, and merely ensure
    that more money is in circulation. This in turn devalues the purchasing power
    of the remaining money.


    As an example, let''s look at the absolute money supply in the US over the last
    `25` years.


    ![](Image00005.jpg)


    Figure 1 Development of the absolute money supply in the USA


    In `2020` alone, one third of all money was printed. Whether this will be healthy
    and sustainable can only be determined retrospectively. Many economists criticise
    this development and see it as shifting the problem rather than solving the basic
    problem.


    Another problem of the current monetary system is the banking system itself. This
    system is associated with slow and outdated structures. Although we have arrived
    in the digital age, it still takes two working days for a transfer to be made,
    to transfer abroad it takes even longer, and no transfers are made at all over
    the weekend. The diversions via an intermediary always takes longer than the direct
    exchange. Technically, however, faster transactions are quite easily possible.
    And it is precisely this concept that has made companies like `PayPal` or instant
    bank transfers so successful. The structures, for example in credit intermediation
    with several middlemen, are also neither effective nor cost- or time-saving. At
    this point, it should be mentioned that banks have recognised this problem themselves
    and real-time transfers are becoming more and more


    ## 2.4 Digitisation of money


    The digitisation of money also initially brings many advantages. For example,
    we save enormous storage costs and can move the money faster and easier. In addition,
    we can divide it as we like. Digitally, we can send `€20` from `€50` credit and
    keep `€30`, whereas we cannot divide a `€50` note into `2x €20` and `1x €10`.


    It has also become easier to multiply money. If a central bank wants to print
    new money, no large money printing plants must be started up. No money transporters
    must arrive to distribute the money. No need to pay for printer''s ink either.
    With a few mouse clicks on the `PC`, money in the billions can be created out
    of thin air within seconds.


    The combination of centralised structures that form money monopolies and digitalisation
    has facilitated the multiplication and devaluation of money.


    Cryptocurrencies address all the issues of trust, centralisation and outdated
    structures. They solve these problems through a simple but ingenious substitution.

    '
  trans: '

    但为什么会突然产生这种想法，认为这个系统和我们现有的货币不再适合作为长期的支付手段和价值存储手段呢？为了找到答案，让我们仔细观察一下我们纸币体系的问题。这一切始于对金本位制的放弃。


    ## 2.3 放弃金本位制


    我们已经学习过金本位制。这意味着一种货币，无论是`euro`、日元还是`dollar`，都有金、银甚至石油等大宗商品作为支撑。这种金本位制逐渐瓦解了。例如，由于第一次世界大战期间的黄金储备不足以支付战争费用，纸币毫不留情地与金价脱钩了。


    现今所有的货币都是无支持的货币。它们也被称为`法币`（`fiat currencies`）。


    ### 这种新的无支持货币具有什么特征？


    货币的便携性和可分割性与以前一样。然而，负责控制印钞机的人可以随心所欲增加货币。这项任务由中央银行承担。


    如果一家中央银行每年打印`10%` 的新钞票而不销毁旧钞票，那么每张现有的钞票仅值约`90%`。当然，钞票本身的价值并没有改变。一张`€10` 钞票永远将是一张`€10`
    钞票。然而，购买力，即我们的钱能买到的东西减少了。结果是食品、房地产或物质资产的价格也随之波动。


    这并不自动是坏事——只要生活水平也随之调整。理想情况下，工资的增长可以抵消这种影响。


    无论如何，我们看到价值存储的属性完全由一个中央实体控制。我们信任这个实体会明智地利用其对货币系统的权力。只要它继续这样做，就没有理由反对这种无支持的法币体系。理论就此此。


    ### 这种理论观点在现实中是什么样子的？


    即使货币垄断被明智利用，一个大问题始终存在：对国家和中央银行等中央机构的信任。


    ![](img/Image00004.jpg)


    我们必须相信，我们作为货币使用的东西会被其他人接受为货币，并且我们将获得其他商品作为回报。


    如果事实如此，我们就被困在了货币中，它是一文不值的。那么，这种信心从何而来？为什么我们的货币（即我们的`euros`、瑞士法郎或`dollars`）在明天或十年后仍会被货币系统中的其他参与者接受？因为放弃金本位制意味着它不再由黄金支撑。


    不言而喻的是，我们明天可以用`euro` 钞票在超市买到食物，不是吗？


    既是又不是的。这个系统需要一个中央机构来确保我们用作货币的彩色钞票获得价值。这是国家和中央银行的任务，他们监控货币。我们信任银行确实为我们的`€10` 钞票真的“存好”了`€10`。


    ![](img/Image00004.jpg)


    在稳定时期，这种集中的银行体系运作得非常好。然而，当危机发生、对国家的信任萎减时，对货币的信任往往随之萎减。


    政府的稳定性与货币价值之间存在着直接的相关性。


    过去有许多负面例子，例如希腊危机，当时人们大量涌向 ATM 机，却不被允许提取自己的钱。


    另一个例子是委内瑞拉的经济危机，根据国际货币基金组织的数据，那里对政府和货币的信任几乎完全丧失，导致`2018`年通胀率超过`130,000%`。结果，人们用石油、`dollars`或加密货币等商品来保护自己。


    后一个例子向我们展示了所有法币的大问题：它们不再有支撑且可以由中央行政机构大量打印的事实，意味着货币不受通胀的保护。欧洲中央银行（`ECB`）、联邦储备银行（`FET`）或瑞士和日本的中央银行理论上一夜内就能创造数十亿的新货币。事实如此！原则上，通胀并不是自动好或坏的。经济学家争论轻微的通胀是否能保持经济增长的高位，以及对于通缩货币这是否也可行。


    花钱或承担债务本身并不可责，但它确保了增长。


    在健康的经济周期中，贷款是加强经济最有效的手段之一。当企业家借钱创造新的就业机会并在几年后还还利息时，这对系统中的每个人都有积极影响：包括能够养活家人的工人、可以扩张的公司、可以购买产品的消费者，以及从其资本中获得利息的银行。


    遗憾的是，过去投资并不是投在强大的公司，而是投在病态的国家。


    事实是，最近打印了数十亿新的`Dollars`，用于购买意大利或希腊等负债国家的政府债券。这些新货币没有任何国家经济表现形式的等值物。这些国家没有将钱用于良好用途，而是将其烧掉，仅仅确保流通中有更多的钱。这反过来又贬值了剩余货币的购买力。


    举个例子，让我们看看过去`25`年美国的绝对货币供应量。


    ![](img/Image00005.jpg)


    图 1 美国绝对货币供应量的发展


    仅在`2020`年，所有货币的三分之一就被打印了。至于这种做法是否健康和可持续，只能在事后确定。许多经济学家反对这种发展，认为这是在转移问题而不是解决问题。


    当前货币系统的另一个问题是银行体系本身。这个系统与缓慢和过时的结构相关。尽管我们已经进入数字时代，但转账仍然需要两个工作日，跨境汇款需要更长时间，而且周末完全不进行转账。

