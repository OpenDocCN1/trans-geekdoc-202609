- raw: "The terms public key and public address are often used as synonyms and do\
    \ not mean the same thing from a technical point of view. Strictly speaking, the\
    \ ![Picture 4](Image00003.jpg)uncompressed public key is generated first from\
    \ the private key and from this in turn the public address. To understand this,\
    \ it is sufficient to know that there is a private key and a public key or a public\
    \ address.\n\n![](Image00031.jpg)\n\nFigure 17 Bitcoin address generation\n\n\
    The way private and public keys work is quite similar for Bitcoin and many other\
    \ cryptocurrencies. Only the lengths of the addresses and keys differ. In addition,\
    \ characteristic prefixes such as the one may be present in Bitcoin.\n\n![](Image00032.jpg)\n\
    \nFigure 18 Relationship Private Key Public Address\n\n![Picture 4](Image00003.jpg)One\
    \ thing above all we take away from this chapter: We do not hand over our private\
    \ key to anyone under any circumstances .\n\nBefore we look at the concrete formation\
    \ of the blockchain using the example of Bitcoin, we will discuss a topic about\
    \ which there is also a lot of half-knowledge: We are talking about mining.\n\n\
    3.3.         Consensus building and mining\n\n![](Image00004.jpg)Mining is the\
    \ English word for mining, extraction or production and is often used in connection\
    \ with commodities such as gold, gold mining . Analogously, the term bitcoin mining,\
    \ i.e., the production or mining of bitcoin, has been established.\n\nCryptographically,\
    \ mining describes the process of solving a mathematical problem such as the calculation\
    \ of the SHA256 algorithm.\n\nWhen the miners have done their work, the information\
    \ is ready to become part of the consensus. Consensus describes the agreement\
    \ of the participants as to what they consider \"true\" and what they consider\
    \ \"false\". Since there is no central institution, the community decides if and\
    \ when, for example, a transaction can take place and whether they will adopt\
    \ the transaction into their blockchain.\n\nTo better understand this process,\
    \ let's look at the different participants in a decentralised system. In addition\
    \ to the miners, there are other participants, for example the full nodes already\
    \ mentioned. A user can also act in several roles at the same time.\n\nFor easier\
    \ understanding, we take the building of a house as an analogy to the validation\
    \ process of the individual participants. Using this example, we assign tasks\
    \ to the participants.\n\nMiner: Miners are the users who do the work, in other\
    \ words, the mining. The new information, i.e. the digitally signed transactions,\
    \ are sent to them.\n\nAnalogously, miners are the construction workers who build\
    \ the house with their labour. The blueprint of what the house should look like\
    \ are the rules of the blockchain.\n\nThe miners calculate a potential consensus\
    \ in the network, which they forward to the nodes for validation.\n\nThe miners\
    \ naturally want to be paid accordingly for their work.\n\n![](Image00004.jpg)Miners\
    \ are allocated several transactions in a block and create consensus, for example\
    \ by making their computing power available. Users have to pay a fee for this.\
    \ These transaction costs are distributed to the miners.\n\nMiners are those who\
    \ do work to ensure the safety of the consensus.\n\nFull nodes: Full nodes are\
    \ users who have downloaded the entire blockchain onto their computer and update\
    \ it regularly. They synchronise with other nodes and form the pillars of the\
    \ decentralised system. They also validate the information sent to them by the\
    \ miners.\n\nWe can become a full node by running the Bitcoin Full Node programme\
    \ on our computer. To do this, the computer must be running continuously and connected\
    \ to the internet. Finally, the transaction history updates every ten minutes.\n\
    \n![](Image00033.jpg)\n\nFigure 19 Download of a Bitcoin Full Node  \n\nSource:\
    \ [https://bitcoincore.org/en/download/](https://bitcoincore.org/en/download/)\n\
    \nWe can think of the full nodes as construction supervisors who hardly do any\
    \ physical work themselves in the sense of a construction worker, but who validate\
    \ or reject the miners' work. They always have all the construction plans with\
    \ them in a folder.\n\nSince full nodes do not provide any computing power, they\
    \ do not receive any fees from the network, unlike the miners. Nevertheless, there\
    \ are enough \"volunteers\" who want to support the network and run a full node.\n\
    \nThe full nodes have the important task of supporting the network. Large companies\
    \ like Tesla operate a Bitcoin full node themselves.\n\nIf storage space becomes\
    \ cheaper and cheaper in the future, it is quite realistic that we will be able\
    \ to install a \"Bitcoin full node app\" on each of our smartphones and thus decentralise\
    \ the network more and more.\n\nLight Nodes: Light nodes are users who want to\
    \ use the blockchain but do not want to store all the data. These are the majority\
    \ of all users. Light nodes are also called ordinary users. They send the request\
    \ to send a payment to a full node and to the miners, who then send the transaction\
    \ to all other full nodes.\n\nThe analogy to building a house is not so easy to\
    \ draw here. We can best assign the role of the light node to the builder . He\
    \ has a rough idea of what the house should look like but does not have the complete\
    \ building plan with him, as the full nodes do.\n\nNow that we have divided up\
    \ the concrete participants, let's take a look at what happens after we have clicked\
    \ \"Send\" on a transaction.\n\n3.4.         Sending a transaction\n\nTo understand\
    \ how a transaction can be sent on the blockchain, the basics of cryptography\
    \ are again used.\n\nAlice announces that she wants to send Bob a Bitcoin (1 BTC).\
    \ First, the intention of the transaction is recorded.\n\nThis request is signed\
    \ with Alice's private key, ensuring that she really is the sender she claims\
    \ to be and accordingly owns the credit she wants to send.\n\nWe remember: With\
    \ the help of the signed transaction and Alice's public key, it is possible to\
    \ check whether Alice is the sender.\n\nThis signed transaction is sent to all\
    \ surrounding miners and nodes. Everyone in the network can see this transaction.\n\
    \nIn reality, sending the request is again done by the wallet you use to access\
    \ your bitcoin address.\n\nThe miners and nodes in turn send the information to\
    \ the surrounding miners and nodes, and so on, until every participant in the\
    \ network has received the information. In reality, this only takes a few seconds.\n\
    \nThe nodes check whether the sender has enough coins in his possession by checking\
    \ whether the signature is correct. To do this, they use the public key, i.e.,\
    \ the sender's address. The confirmed transactions are collected in a block. In\
    \ Bitcoin, about 4,200 transactions fit into one block. The miners secure this\
    \ block with their computing power and send the secured block to all nodes. The\
    \ transaction has been confirmed. If an error occurs, the transaction is rejected.\n\
    \n![](Image00034.jpg)\n\nFigure 20 Sequence when sending a transaction\n\nNow\
    \ we have learned how a transaction is sent. In the next step, we look at how\
    \ security can be generated by applying computing power.\n\n3.5.         Proof\
    \ of Work and Double Spending\n\nSo far, we have learned that miners provide their\
    \ computing power to secure transactions. This is the so-called Proof of Work\
    \ (POW) principle.\n\n![](Image00004.jpg)Proof of work means that work must be\
    \ done in the form of computing power to secure the transactions so that they\
    \ cannot be falsified. This concept is the oldest and most widespread. Almost\
    \ all major cryptocurrencies rely on this principle.\n\nThe miners must solve\
    \ a puzzle. In practice, this means that the miners have to calculate different\
    \ algorithms, such as the SHA256 hashing algorithm.\n\nThis is why the computing\
    \ power provided by a Miner is often referred to as hashing power .\n\nBut why\
    \ is it necessary for miners to do work and calculate hashing algorithms in the\
    \ first place? How is security generated from this? For this, we look at a problem\
    \ that is ruled out by this."
