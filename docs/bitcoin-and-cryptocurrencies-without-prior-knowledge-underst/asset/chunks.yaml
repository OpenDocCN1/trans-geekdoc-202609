- raw: "Until 2008, there was a problem that was previously considered unsolvable:\
    \ the double-spending problem.\n\nLet's imagine we are a fraudster and send our\
    \ money in our bank account via instant transfer to two other accounts almost\
    \ simultaneously.\n\nWith a normal account, it is not possible to send money to\
    \ two people at the same time to spend more in total than we actually have. The\
    \ bank controls the balance and blocks one of the transactions so that we can\
    \ never overdraw our account. If Alice wants to send money to Bob and Charles\
    \ at the same time, the later transaction is blocked by the bank.\n\nIn a decentralised\
    \ system, however, it is possible to send your money first to one person and then\
    \ a millisecond later to another person. We have seen that the miners and the\
    \ full nodes have to synchronise first. By the time all the nodes on the entire\
    \ planet have synchronised, the money has already been spent several times.\n\n\
    ![](Image00004.jpg)When funds are sent from one account to two or more accounts\
    \ almost simultaneously, this process is called double spending.\n\nUntil 2008,\
    \ it was dogma that the double-spending problem could not be prevented without\
    \ a central unit.\n\nBut how was this problem solved in Bitcoin and other decentralised\
    \ networks? We have already learned the answer: mining. For a better understanding,\
    \ let's look at how mining combines the individual blocks containing the transactions\
    \ into a blockchain. We start by looking at which transactions are primarily processed,\
    \ and which must wait.\n\n3.6.         Sequence of transactions\n\nA decentralised\
    \ network, like that of bitcoin, now has millions of users who permanently send\
    \ thousands of transactions to the blockchain. Since the miners only have a limited\
    \ capacity to process and validate the transactions, they can be given a voluntary\
    \ bonus. This is a kind of tip that encourages the miners to process the transaction\
    \ sooner. In Bitcoin, for example, only 4,200 transactions fit into a block of\
    \ ten minutes. If you want the transaction to be transferred immediately to the\
    \ current block, you have to be one of the 4,200 \"highest bidders\".\n\nWe will\
    \ learn more about the setting of fees in the later chapters.\n\nTheoretically,\
    \ we don't have to pay a fee at all, but then the transaction will probably never\
    \ be processed because there is always someone who will pay at least a few cents\
    \ to have their transaction favoured.\n\nThe amount and speed of the transaction\
    \ costs depend on the load of the network. If many people want to send a transaction\
    \ quickly, they outbid each other.\n\n![](Image00035.jpg)\n\nFigure 21 Historical\
    \ transaction fees per bitcoin transaction\n\nThis can also be seen in the chart\
    \ above with the example of Bitcoin. In late 2017 and early 2018, Bitcoin had\
    \ reached a new all-time high of 20,000 USD. In parallel, the average transaction\
    \ fees for a transaction rose from under one dollar to over 50 USD, as the demand\
    \ for Bitcoin led to an extreme utilisation of the network - which of course pleased\
    \ the miners.\n\nThe transactions are thus selected according to a bidding system,\
    \ and from these, blocks of up to 4200 transactions are in turn combined. The\
    \ next step is to validate and combine the blocks.\n\n4.  Structure of the blockchain\n\
    \nThe blockchain consists of blocks. The first entry of a block is always a reference\
    \ to the previous block. This establishes the link to the previous block and the\
    \ blocks link together to form a chain.\n\nIn addition, the current block contains\
    \ the transactions that have occurred in the corresponding period. The entire\
    \ data of the block is entered into a SHA256 algorithm. As a result, we get a\
    \ hash of the current block.\n\n![](Image00036.jpg)\n\nFigure 22 Hash generation\
    \ from the data of a block\n\nWe have learned that this hash has a length of 256\
    \ bits and is unpredictable. If we change just one character of the entire block,\
    \ the hash changes completely and unpredictably. And exactly this fact is as simple\
    \ as it is ingenious. A single change in just one transaction would change the\
    \ entire hash of the block and thus all other blocks .\n\nThis is comparable to\
    \ a cinema film in which a time traveller changes only one small thing in the\
    \ past, but the future becomes completely different because of this small change.\n\
    \nThus, the hash of the current block is also a unique reference to this block.\
    \ The hash of the current block is used as the first entry of the following block.\
    \ This creates a sequence of blocks.\n\n![](Image00037.jpg)\n\nFigure 23 Stringing\
    \ blocks together\n\nThe miners calculate the hash of the current block.\n\nHowever,\
    \ we still don't know how the miners ensure security.\n\nNow, the trick with blockchain\
    \ technology is that there is a rule that the hash of the block must start with\
    \ a certain number of zeros. Otherwise, the block is not accepted.\n\nSince the\
    \ hash can only be changed if the data of the block is changed, another element\
    \ is added to the block, called a nonce . This part is variable and does not depend\
    \ on the transactions. By changing the nonce, the hash of the block is changed.\
    \ The nonce has no other function than that the hash can be adjusted by changing\
    \ the nonce.\n\n![](Image00038.jpg)\n\nFigure 24 Hash generation from the data\
    \ of a block incl. the additional variable \"Nonce\".\n\nNext, the miners' computing\
    \ power comes into play. The miners do not have to calculate the hash, but they\
    \ should find a number so that the hash of the entire block starts with a certain\
    \ number of zeros. There is only one way to solve this problem: the miners have\
    \ to try different possibilities for the nonce.\n\nWe can think of a block of\
    \ the blockchain as a big puzzle with one piece missing. All transactions represent\
    \ pieces of the puzzle and miners have to find the missing, completing piece of\
    \ the puzzle through trial and error.\n\nIf they have found a nonce, the block\
    \ is accepted.\n\nTo illustrate this complex process, let's look at a simplified\
    \ example and create our own, very trimmed-down block. This contains only the\
    \ hash of the previous block , a transaction and a nonce . In our case, we start\
    \ with the zero . Furthermore, our requirement is that the resulting hash must\
    \ start with a zero.\n\nUsing an online SHA256 generator, we obtain the hash that\
    \ belongs to our data.\n\n![](Image00039.jpg)\n\nFigure 25 Example of hash generation\
    \ using an online hash generator  \n\nSource: https://emn178.github.io/online-tools/sha256.html\n\
    \nWe see that with the data entered, the hash 48c6..... a19 is created. Since\
    \ this does not start with a zero, the block would not be allowed. We increase\
    \ the nonce by one until we get a hash that starts with a zero.\n\nIn this example,\
    \ this is the case for the first time for the value 16.\n\n![](Image00040.jpg)\n\
    \nFigure 26 After 16 trials, the resulting hash starts with a zero\n\nWe had to\
    \ calculate a SHA256 algorithm 16 times to arrive at a valid hash. In reality,\
    \ significantly more zeros are required, so the algorithm has to be run significantly\
    \ more often.\n\nIn the example, we tried the nonce by hand and changed it until\
    \ the desired result was output. In the Bitcoin network, this is exactly the work\
    \ of the miners. They try out billions of different nonces per second and calculate\
    \ the resulting hash each time. When it starts with the required number of zeros,\
    \ the miner reports, according to the motto: \"I've found the solution!\" He sends\
    \ the solved block including his found nonce to all full nodes. These check whether\
    \ a hash with the required number of zeros is created. If this is the case, the\
    \ block is appended to the blockchain, and the miner receives his reward.\n\n\
    But why do we set the miners the task of finding the matching nonce? Why don't\
    \ we just attach the block directly to the blockchain without solving a puzzle\
    \ first? On the surface, looking for the nonce is a waste of energy, isn't it?"
  fmt: '

    Until 2008, there was a problem that was previously considered unsolvable: the
    double-spending problem.


    Let''s imagine we are a fraudster and send our money in our bank account via instant
    transfer to two other accounts almost simultaneously.


    With a normal account, it is not possible to send money to two people at the same
    time to spend more in total than we actually have. The bank controls the balance
    and blocks one of the transactions so that we can never overdraw our account.
    If Alice wants to send money to Bob and Charles at the same time, the later transaction
    is blocked by the bank.


    In a decentralised system, however, it is possible to send your money first to
    one person and then a millisecond later to another person. We have seen that the
    miners and the full nodes have to synchronise first. By the time all the nodes
    on the entire planet have synchronised, the money has already been spent several
    times.


    ![](Image00004.jpg) When funds are sent from one account to two or more accounts
    almost simultaneously, this process is called double spending.


    Until 2008, it was dogma that the double-spending problem could not be prevented
    without a central unit.


    But how was this problem solved in Bitcoin and other decentralised networks? We
    have already learned the answer: mining. For a better understanding, let''s look
    at how mining combines the individual blocks containing the transactions into
    a blockchain. We start by looking at which transactions are primarily processed,
    and which must wait.


    ### 3.6 Sequence of transactions


    A decentralised network, like that of bitcoin, now has millions of users who permanently
    send thousands of transactions to the blockchain. Since the miners only have a
    limited capacity to process and validate the transactions, they can be given a
    voluntary bonus. This is a kind of tip that encourages the miners to process the
    transaction sooner. In Bitcoin, for example, only 4,200 transactions fit into
    a block of ten minutes. If you want the transaction to be transferred immediately
    to the current block, you have to be one of the 4,200 "highest bidders".


    We will learn more about the setting of fees in the later chapters.


    Theoretically, we don''t have to pay a fee at all, but then the transaction will
    probably never be processed because there is always someone who will pay at least
    a few cents to have their transaction favoured.


    The amount and speed of the transaction costs depend on the load of the network.
    If many people want to send a transaction quickly, they outbid each other.


    ![](Image00035.jpg)


    Figure 21 Historical transaction fees per bitcoin transaction


    This can also be seen in the chart above with the example of Bitcoin. In late
    2017 and early 2018, Bitcoin had reached a new all-time high of 20,000 USD. In
    parallel, the average transaction fees for a transaction rose from under one dollar
    to over 50 USD, as the demand for Bitcoin led to an extreme utilisation of the
    network - which of course pleased the miners.


    The transactions are thus selected according to a bidding system, and from these,
    blocks of up to 4200 transactions are in turn combined. The next step is to validate
    and combine the blocks.


    ### 4. Structure of the blockchain


    The blockchain consists of blocks. The first entry of a block is always a reference
    to the previous block. This establishes the link to the previous block and the
    blocks link together to form a chain.


    In addition, the current block contains the transactions that have occurred in
    the corresponding period. The entire data of the block is entered into a `SHA256`
    algorithm. As a result, we get a hash of the current block.


    ![](Image00036.jpg)


    Figure 22 Hash generation from the data of a block


    We have learned that this hash has a length of 256 bits and is unpredictable.
    If we change just one character of the entire block, the hash changes completely
    and unpredictably. And exactly this fact is as simple as it is ingenious. A single
    change in just one transaction would change the entire hash of the block and thus
    all other blocks.


    This is comparable to a cinema film in which a time traveller changes only one
    small thing in the past, but the future becomes completely different because of
    this small change.


    Thus, the hash of the current block is also a unique reference to this block.
    The hash of the current block is used as the first entry of the following block.
    This creates a sequence of blocks.


    ![](Image00037.jpg)


    Figure 23 Stringing blocks together


    The miners calculate the hash of the current block.


    However, we still don''t know how the miners ensure security.


    Now, the trick with blockchain technology is that there is a rule that the hash
    of the block must start with a certain number of zeros. Otherwise, the block is
    not accepted.


    Since the hash can only be changed if the data of the block is changed, another
    element is added to the block, called a `nonce`. This part is variable and does
    not depend on the transactions. By changing the `nonce`, the hash of the block
    is changed. The `nonce` has no other function than that the hash can be adjusted
    by changing the `nonce`.


    ![](Image00038.jpg)


    Figure 24 Hash generation from the data of a block incl. the additional variable
    "Nonce".


    Next, the miners'' computing power comes into play. The miners do not have to
    calculate the hash, but they should find a number so that the hash of the entire
    block starts with a certain number of zeros. There is only one way to solve this
    problem: the miners have to try different possibilities for the `nonce`.


    We can think of a block of the blockchain as a big puzzle with one piece missing.
    All transactions represent pieces of the puzzle and miners have to find the missing,
    completing piece of the puzzle through trial and error.


    If they have found a `nonce`, the block is accepted.


    To illustrate this complex process, let''s look at a simplified example and create
    our own, trimmed-down block. This contains only the hash of the previous block,
    a transaction and a `nonce`. In our case, we start with the zero. Furthermore,
    our requirement is that the resulting hash must start with a zero.


    Using an online `SHA256` generator, we obtain the hash that belongs to our data.


    ![](Image00039.jpg)


    Figure 25 Example of hash generation using an online hash generator Source: https://emn178.github.io/online-tools/sha256.html


    We see that with the data entered, the hash `48c6.....a19` is created. Since this
    does not start with a zero, the block would not be allowed. We increase the `nonce`
    by one until we get a hash that starts with a zero. In this example, this is the
    case for the first time for the value 16.


    ![](Image00040.jpg)


    Figure 26 After 16 trials, the resulting hash starts with a zero


    We had to calculate a `SHA256` algorithm 16 times to arrive at a valid hash. In
    reality, significantly more zeros are required, so the algorithm has to be run
    significantly more often.


    In the example, we tried the `nonce` by hand and changed it until the desired
    result was output. In the Bitcoin network, this is exactly the work of the miners.
    They try out billions of different nonces per second and calculate the resulting
    hash each time. When it starts with the required number of zeros, the miner reports,
    according to the motto: "I''ve found the solution!" He sends the solved block
    including his found `nonce` to all full nodes. These check whether a hash with
    the required number of zeros is created. If this is the case, the block is appended
    to the blockchain, and the miner receives his reward.


    But why do we set the miners the task of finding the matching `nonce`? Why don''t
    we just attach the block directly to the blockchain without solving a puzzle first?
    On the surface, looking for the nonce is a waste of energy, isn''t it?

    '
  trans: '

    在 2008 年之前，存在一个曾被认为无法解决的问题：双重花费问题。


    让我们想象自己是一个诈骗者，通过即时转账将我们银行账户中的资金几乎同时地发送到另外两个账户。


    对于普通账户来说，不可能同时向两个个人发送资金，从而使总支出金额超过我们实际拥有的金额。银行控制余额并拦截其中一笔交易，使我们永远无法透支账户。如果 Alice
    想要同时向 Bob 和 Charles 发送资金，那么后一笔交易会被银行拦截。


    然而，在去中心化系统中，可能会先将钱发送给一个人，几毫秒后又发送给另一个人。我们已经看到矿工和全节点必须先进行同步。当全球所有的节点完成同步时，这些钱已经被花费了多次。


    ![](img/Image00004.jpg) 当资金几乎同时从一个账户发送到两个或多个账户时，这一过程被称为双重花费。


    在 2008 年之前，人们深信：没有中心化单元，就无法防止双重花费问题。


    但是这个问题在比特币和其他去中心化网络中是如何解决的呢？我们已经知道了答案：挖矿。为了更好地理解，让我们看看挖矿是如何将包含交易的单个区块组合成区块链的。我们首先来看哪些交易是优先处理的，而哪些交易必须等待。


    ### 3.6 交易顺序


    去中心化网络（如比特币网络）现在拥有数百万用户，他们不断地向区块链发送成千上万笔交易。由于矿工处理和验证交易的能力有限，因此他们可以获得一笔自愿奖励。这是一种鼓励矿工更快处理交易的小费。例如，在比特币中，一个十分钟的区块只能容纳
    4,200 笔交易。如果你想让交易立即传输到当前区块，你必须是这 4,200 名“最高出价者”之一。


    我们将在后面的章节中学习更多关于费用设置的知识。


    从理论上说，我们完全不需要支付费用，但交易可能永远不会被处理，因为总有人愿意支付几分钱来让自己的交易获得青睐。


    交易的金额和速度取决于网络负载。如果许多人想快速发送交易，他们就会互相竞价。


    ![](img/Image00035.jpg)


    图 21 比特币每笔交易的历史交易费用


    从上面的比特币图表中也可以通过示例看到这一点。在 2017 年底和 2018 年初，比特币达到了 20,000 美元的历史新高。与此同时，平均交易费用从不到
    1 美元飙升到 50 美元以上，因为对比特币的需求导致了网络的极端利用——这无疑让矿工们很高兴。


    因此，交易是根据竞价系统选择的，并从这些中组合成最多 4200 笔交易的区块。下一步是验证并合并区块。


    ### 4. 区块链结构


    区块链由区块组成。区块的第一个条始终是对上一个区块的引用。这建立了与上一个区块的链接，区块相互连接形成一条链。


    此外，当前区块包含了在相应期间发生的交易。区块的所有数据都被输入 `SHA256` 算法。结果，我们得到了当前区块的哈希值（hash）。


    ![](img/Image00036.jpg)


    图 22 从区块数据生成哈希


    我们已经了解到这个哈希值的长度为 256 位，并且是不可预测的。如果我们只更改整个区块中的一个字符，哈希值就会发生完全且不可预测的变化。恰恰这一事实既简单又巧妙。只需改变其中一笔交易，就会改变整个区块的哈希值，从而影响所有其他区块。


    这就像电影电影，时间旅行者在过去只改变了一个小细节，但因为这个微小的变化，未来变得完全不同。


    因此，当前区块的哈希也是该区块的唯一引用。当前区块的哈希用作下一个区块的第一个条目。这创建了一个区块序列。


    ![](img/Image00037.jpg)


    图 23 将区块连接在一起


    矿工计算当前区块的哈希。


    然而，我们仍然不知道矿工是如何确保安全的。


    现在，区块链技术的秘诀在于有一条规则：区块的哈希值必须以特定数量的零开头。否则，该区块不被接受。


    由于只有在更改区块数据时哈希值才能被更改，因此区块中添加了另一个元素，称为 `nonce`（随机数）。这部分是变量，不依赖于交易。通过更改 `nonce`，区块的哈希值就会改变。`nonce`
    的唯一功能就是允许通过更改 `nonce` 来调整哈希值。


    ![](img/Image00038.jpg)


    图 24 从区块数据生成哈希，包含额外变量 "Nonce"。


    接下来，矿工的计算力派上了用场。矿工不需要计算哈希，但他们应该找到一个数字，使得整个区块的哈希以特定数量的零开头。解决这个问题只有一种方法：矿工必须尝试 `nonce`
    的不同可能性。


    我们可以将区块链的区块想象成一个缺少一块碎片的大拼图。所有交易都代表拼图的碎片，矿工必须通过不断尝试找到缺失的、完整的拼图碎片。


    如果他们找到了 `nonce`，区块就会被接受。


    为了说明这个复杂的过程，让我们看一个简单的示例并创建一个我们自己的精简区块。它只包含上一个区块的哈希、一笔交易和一个 `nonce`。在我们的案例中，我们从零开始。此外，我们的要求是生成的哈希必须以零开头。


    使用在线 `SHA256` 生成器，我们得到了属于我们数据的哈希。


    ![](img/Image00039.jpg)


    图 25 使用在线哈希生成器生成哈希的示例 来源：https://emn178.github.io/online-tools/sha256.html


    我们看到通过输入的数据创建了哈希 `48c6.....a19`。由于它不以零开头，该区块将不被允许。我们将 `nonce` 加 1，直到得到一个以零开头的哈希。在这个例子中，在值为
    16 时第一次出现。


    ![](img/Image00040.jpg)


    图 26 经过 16 次尝试，生成的哈希以零开头


    我们必须计算 16 次 `SHA256` 算法才能得到有效的哈希。在现实中，要求的零更多，因此算法必须运行更多次。

    '
