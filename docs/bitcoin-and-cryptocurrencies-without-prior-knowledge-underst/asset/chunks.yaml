    \ or less.\n\n### Miner's Perspective\n\nBut is this effort worthwhile for the\
    \ miners at all? After all, miners have to buy equipment, consume electricity\
    \ and maintain the equipment. Let's take a look at mining from the miner's perspective.\n\
    \nWhen guessing the `nonce` numbers, which is also referred to as solving the\
    \ block, the miners all work simultaneously and all against each other. The miner\
    \ who finds the correct number first and thus completely solves the current block\
    \ receives the entire `transaction fees`. \n\nThe other miners go away empty-handed.\
    \ After that, all the miners immediately rush to the next block and start looking\
    \ for the right `nonce`.\n\n![](Image00041.jpg)But that's not all: in addition\
    \ to the transaction fees, the miner who solves the block receives a reward that\
    \ is anchored in the programme code and varies depending on the cryptocurrency.\
    \ This reward is called a `block subsidy`.\n\n`Miner reward = subsidy + transaction\
    \ fees`\n\n`Block Rewards = Block Subsidy+ Transaction Fees`\n\nFor Bitcoin, the\
    \ initial value of the `Block Subsidy` is set at 50 Bitcoins per block found.\
    \ About every ten minutes, 50 new bitcoins are distributed to the miners in addition\
    \ to the transaction fees.\n\n### Inflation and Halving\n\nWe have just seen how\
    \ bitcoins are generated. Bitcoins have not always existed, they are issued through\
    \ mining and distributed to miners. But doesn't that mean that Bitcoin also involves\
    \ a kind of inflation? After all, new Bitcoins are created out of nothing. That's\
    \ exactly what should be prevented, isn't it?\n\nIndeed, this would be the case\
    \ if 50 bitcoins per block were always distributed, and that is why the Bitcoin\
    \ protocol has limited the number of distributed coins. The number of distributed\
    \ coins of 50 bitcoins per block becomes less and less over time. More precisely,\
    \ the value is halved every 210,000 blocks. This means: The first 210,000 blocks\
    \ of the blockchain distribute 50 Bitcoins, the next 210,000 blocks only 25 Bitcoins\
    \ per block and so on.\n\nSince one block is equal to 10 minutes, 210,000 blocks\
    \ are pretty much equal to 4 years.\n\n| Period | Block Subsidy - newly distributed\
    \ coins | Total number of coins distributed during the period | Total number of\
    \ coins distributed so far |\n| --- | --- | --- | --- |\n| 2008-2012 | 50 | 10,500,000\
    \ BTC | 10,500,000 BTC |\n| 2012-2016 | 25 | 5,250,000 BTC | 15,750,000 BTC |\n\
    | 2016-2020 | 12,5 | 2,625,000 BTC | 18.375.000 |\n| 2020-2024 | 6,25 | 1,312,500\
    \ BTC | 19.687.500 |\n| 2024-2028 | 3,125 | 656,250 BTC | 20.343.750 |\n| … |\
    \ … | … | … |\n\nThe halving of the distribution is called `halving`. At the time\
    \ of this writing (2021) the last halving took place on 11 May 2020. The block\
    \ subsidy was halved from 12.5 to 6.25 BTC per block. The next halving is scheduled\
    \ for 2024.\n\nSo currently, every ten minutes 6.25 BTC is paid out to the person\
    \ who solves the current block: the person who finds the matching nonce for the\
    \ block.\n\nImage00042.jpg\n\nWe see that there is not an infinite number of bitcoins\
    \ being issued, but that the total amount of coins ever created is approaching\
    \ the limit of just under 21 million. ![](Image0004.jpg)There will never be more\
    \ than 21 million Bitcoins. The limit is anchored in the programme code and cannot\
    \ be changed. This is how Bitcoin protects itself from inflation.\n\nOnly the\
    \ amount of newly generated coins per block changes. The transaction fees remain\
    \ in place, otherwise the miners would no longer have an incentive to make their\
    \ computing power available.\n\n`Miner reward = subsidy + transaction fees`\n\n\
    As subsidies fall to zero, the result is:\n\n`Miner reward = transaction fees`\n\
    \n### The Genesis Block\n\nAt the end of the chapter, a question should be clarified\
    \ that some readers have probably asked themselves. We have seen that a block\
    \ always contains the hash of the previous block.\n\nBut then what was the first\
    \ entry of the very first block? After all, there is no previous block from which\
    \ a hash can be generated.\n\nThe first block is called the `Genesis block`. It\
    \ has two tasks:\n\nIt starts the blockchain. The content of the first entry is\
    \ completely insignificant.\n\nHowever, the other function that the first entry\
    \ fulfils is enormously important: it must prove that the blockchain was newly\
    \ created.\n\nLet's imagine that Satoshi Nakamoto invented the Bitcoin blockchain\
    \ not in 2008, but already in 2000. However, he did not publish it, but secretly\
    \ calculated block by block and created a blockchain. In the process, he collected\
    \ all the block subsidies himself, initially 50 BTC per block. In addition, his\
    \ computer was offline during the entire period so that no one would know what\
    \ he was doing.\n\nThis calculated blockchain would of course be significantly\
    \ longer than all blockchains that have only been calculated since 2008. After\
    \ all, Satoshi would have an eight-year head start. If he suddenly goes online\
    \ with his blockchain in 2020, every miner, every node and every user will accept\
    \ his blockchain as the longest and thus the \"true\" blockchain. All previous\
    \ mining, all transactions and all created Bitcoins would no longer be valid.\n"
