    is called `FOMO` (fear of missing out).

    - As soon as expectations are not fulfilled, they are sold (often at a loss).


    All these reasons form temporary "bubbles" in the crypto market, which we have
    seen again and again in recent years. Within a few months, cryptocurrencies like
    `Bitcoin` multiplied and then crashed again by up to 90%.


    However, there were two major differences to a "normal" bubble: When a bubble
    burst, as was the case with the dotcom bubble, the prices of goods fell below
    their pre-bubble price. Shares like the German Company Telekom share have not
    recovered from this to this day.


    ![](Image00111.jpg)

    Figure 78 Development of the Telekom share price


    `Bitcoin`, on the other hand, has already had several bubbles. However, `Bitcoin`
    has always remained at a higher level after the "bubble burst" than before the
    bubble, and each time the price has been higher than the peak of the previous
    bubble.


    ![](Image00112.gif)

    Figure 79 `Bitcoin` "bubble" from 100 USD to 1200 USD and back to 250 USD


    ![](Image00113.gif)

    Figure 80 `Bitcoin` "bubble" from 1000 USD to 20000 USD and back to 6000 USD


    There are other examples of the short-term "bursting of the bubble."


    We can see that sharp rises and falls in a short period of time are nothing out
    of the ordinary. From a purely factual point of view, both rises shown were not
    bubbles in the sense of previous bubbles, such as the dotcom bubble. If you held
    your coins for the entire period of the rise and fall, you multiplied them compared
    to the price before the bubble.


    In comparison, in the case of a real bubble, as was the case with the Telekom
    share, one has suffered a loss with one''s investment to date.


    ![](Image00004.jpg)Instead of talking about bubbles, `Bitcoin` develops in waves.
    Within these waves, the price rises rapidly and then often falls again. It has
    the outward appearance of a bubble, but the long-term trend is clearly upwards,
    which is not the case after a bubble bursts.


    ![Picture 4](Image00003.jpg)The fact that the bitcoin price grows in waves and
    at times shows rapid rises and falls often gives the appearance of a bubble.


    Moreover, these phases of euphoria have a very positive influence on the value
    of cryptocurrencies. More and more people are getting involved with the topic.
    Companies in this field are being provided with fresh capital and clever minds,
    and investors are discovering new opportunities.


    We have also seen fundamentally in the previous subchapter that the price of `Bitcoin`,
    for example, may still be far below value. We have seen that there are many good
    reasons to attribute a very high intrinsic value to `Bitcoin`. However, to do
    so, one needs to understand the function and purpose of the `blockchain`. So it
    doesn''t make sense to talk about a bubble if at the same time you can''t show
    any reasons why the intrinsic value should be lower than the current price.


    Fittingly, we can look at a page that takes up every newspaper report declaring
    `Bitcoin` "dead."


    [https://99bitcoins.com/bitcoin-obituaries/](https://99bitcoins.com/bitcoin-obituaries/)


    In total, `Bitcoin` has been declared dead over 400 times.


    ![](Image00004.jpg)Critical statements are often made by people who have not dealt
    with `blockchain` or by advocates of centralised institutions such as large banks,
    investment funds or political institutions.


    In conclusion, it can be said that the crypto market is very volatile and therefore
    has a deterrent effect on inexperienced investors. It is theoretically possible
    to lose your entire investment. If we are unlucky, we buy `Bitcoin` and it falls
    in price by 90% afterwards. This is and was quite normal.


    However, it is also a fact that one can increase one''s money by simply buying
    and holding (`HODL`) in any longer period of time (several years). Of course,
    the future cannot ultimately be determined or predicted by the past.


    History does not repeat itself, but it repeats its lessons.

