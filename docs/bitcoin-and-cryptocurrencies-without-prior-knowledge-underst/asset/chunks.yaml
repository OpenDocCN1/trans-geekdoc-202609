    \n## 第二层解决方案\n\n二层模型基于这样一个理念：区块链作为一个稳定的、最底层，但我们可以在这一层之上构建更多的层。区块链被称为主层。\n\n这可以比拟。我们互联网的基础是\
    \ `Ethernet`（以太网）协议。更多的层构建在这个最底层协议之上，例如每台计算机接收的 `IP` 地址。进一步的协议（如带有 `HTTPS` 协议的互联网浏览器）构建在\
    \ `IP` 地址之上。每一个新层都会带来新功能。例如，`HTTPS` 层为数据传输提供了安全保障。当我们上网并在浏览器中看到锁头图标时，我们都在使用 `HTTPS`\
    \ 协议。\n\n![](img/Image00116.jpg)\n\n图 83 HTTPS 是安全互联网连接的缩写\n\n正如我们所看到的，区块链不需要安全更新。然而，二层协议可以帮助我们解决速度问题。\n\
    \n通过在区块链之上构建更多层（新技术），交易数量可以扩展到每秒数千笔。\n\n到目前为止，关于二层模型具体是什么样的，还有许多不同的方法。例如，我们正在研究一种非常有前景的技术：闪电网络（Lightning\
    \ network）。\n\n## 闪电网络\n\n闪电网络是一个独立的网络。比特币可以在此网络内发送。选择“闪电”这个名字是因为交易可以以光速传输。\n\n\
    闪电网络对于小额支付很有意义，例如当我们想买一杯 2 欧元的咖啡或 40 分钱的面包时。为这些交易发起单独的交易（并将其永久存储在区块链中）所付出的精力是不成比例的。\n\
    \n闪电网络既简单又精妙。我们将比特币从比特币区块链发送到闪电网络。为了做到，我们在比特币区块链上锁定比特币，使其无法再次使用。为了实现这一点，我们需要在比特币区块链上进行一次性交易。\n\
    \n我们可以在闪电网络上发送被锁定的比特币，并从其他闪电网络用户那里接收比特币，这些用户之前在主链上锁定了比特币。\n\n![](img/Image00004.jpg)闪电网络内的交易仅由闪电网络内的双方存储。比特币区块链并不感知。只有当一方进入或离开比特币区块链时，才会创建交易。\n\
    \n![](img/Image00117.jpg)\n\n图 84 将比特币传输到闪电网络\n\n我们可以将该系统想象成我们有一个银行账户（比特币区块链上的比特币账户），从中从中提取现金。我们将资金从一个网络（银行账户）转移到另一个网络（现金系统）。\n\
    \n有了现金，我们可以与任何有现金的人进行交易。这种转移不需要支付费用，而且通常比必须等待一天的转账要快。\n\n如果我们想在比特币区块链上再次使用比特币，我们必须再次存入与“提取”相同数量的比特币。\n\
    \n闪电网络所有交易的差额作为一笔交易存储在比特币区块链上。\n\n![](img/Image00004.jpg)闪电网络内部的交易历史并不存储。这有一个积极的副作用：由于交易没有被存储，想要追踪某人向谁发送了多少比特币就不再那么容易了。\n\
    \n从外部看，只有总余额显示没有比特币丢失。\n\n闪电网络（像许多技术一样）仍处于婴儿阶段。目前，仍然需要大量的技术知识才能将比特币从网络中取出并发送到闪电网络等。\n\
    \n全球已有数千万用户在使用闪电网络，并且每天都有更多人加入。\n\n![](img/Image00118.jpg)\n\n图 85 当前所有活跃闪电节点的分布\
    \  \n\n来源：https://explorer.acinq.co/\n\n随着时间的推移，这项技术将进一步发展并变得适合大众使用。未来，一个简单的手机\
    \ App 可能让近乎实时的廉价比特币传输成为可能。\n\n## 9.6. 量子计算机摧毁比特币网络\n\n有些懂技术的人经常会抛出这样一个论点：量子计算机可以轻易破解比特币的加密，导致整个网络崩溃。作为一个外行，这听起来像是一个合理的论据。然而，事实并非如此。为了理解量子计算机在多大程度上构成威胁，让我们来看看量子计算机到底是什么，它们是如何工作的，以及这对比特币有什么影响。\n\
    \n我们在密码学基础课程中学习了单向函数。这些函数在单方向上非常容易求解，但在反向则没有那么简单。应用于比特币网络，这意味着我们可以很容易从私钥推断出公共地址，正如我们在“比特币可以被黑客”中讨论的那样。\n\
    \n这种函数像椭曲线一样，被称为数学难题（mathematical hard problem），而量子计算机计算这些问题的比传统计算机快得多。量子计算机不像普通计算机那样使用\
    \ 1 和 0 进行计算，而是使用非常小的部分，所谓的量子粒子或 `qubits`。这些可以是电子或光粒子。这些粒子的特殊之处在于，它们的属性允许我们同时进行多次计算，而不是一个接一个地进行。\n\
    \n这意味着量子计算机获得与传统计算机相同数量的结果，所需的计算量要少得多。\n\n这既是对 `SHA256` 算法的攻击，也是对从私钥生成公共地址的椭曲线方法的攻击。\n\
    \n![](img/Image00004.jpg)无论，破解这两种方法在理论上确实是可能的。然而，目前我们距离此还遥远。一些估计认为，量子计算机的计算能力还需要增加数百倍到数千倍，才会产生真正的攻击危险。量子计算机也非常昂贵，只有像\
    \ Google 这样的大型公司正在开发。\n\n![](img/Image00119.jpg)\n\n图 86 今天量子计算机的尺寸\n\n量子计算机无法与普通计算机进行比较。量子粒子必须经过仔细的处理和评估。它们在\
    \ -270 摄氏度下工作，需要巨大的能量。\n"
