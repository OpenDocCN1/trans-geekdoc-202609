    \ we create an address on the blockchain. For this, we need a `private key`.\n\
    \n### 7.1 Wallet providers and crypto exchanges\n\nNow we turn to wallet providers\
    \ and crypto exchanges.\n\nAfter we have gained an overview of the current market,\
    \ we create an address on the blockchain. For this, we need a `private key`.\n"
  trans: '

    大多数矿工完全不喜欢这项提议。毕竟，根据目前的估计，他们每解决一个区块获得的以太坊减少了高达 60%。尽管如此，开发者仍然实施了该提案。从理论上讲，矿工可以发起硬分叉（hardfork），但这极可能会对以太坊网络的稳定性和信任产生影响，因此他们将自损害其害。此外，在技术层面，这是系统迈出的一大步。


    所提改进的另一个技术方面是区块大小会根据网络负载进行调整。这使得所有用户使用的网络更快、更更便宜。这一步对于扩展性至关重要，这也是为什么社区的大多数人支持这项提案。他们的理由是，由于受欢迎程度以太坊价格的上涨，矿工仍然可以盈利挖矿。尽管他们每个区块只能获得两个以太坊，但以法币计算，它们的价值更高。这是许多矿工所期待的。虽然有其他方案来补偿矿工，但从长远来看，为了大规模使用以太坊，这种更新是不可避免的。


    无论如何，很清楚，以太坊挖矿将随着以太坊 2.0 的推出而结束，它预计最迟于 2022 年或 2023 年发布。到那时，权益证明（proof-of-stake）概念将完全实现，矿工将被验证者取代。


    取决于你阅读这段文字的时间，`E1559` 提案已经实施，或者以太坊已经在权益证明上运行。也许扩展性对以太坊价格的影响已经可见。`EIP1559` 和以太坊
    2.0 的例子表明，技术正在快速发展，有时是根本性的，重大变化正在不断引入。


    除了波卡（Polkadot）和货币（Cardano），还有许多与以太坊相似或旨在解决以太坊特定问题的项目。示例包括 `NEO`、`Chainlink`、`NEM`
    和 `TEZOS`。


    ![](img/Image00082.jpg)!(Image00083.jpg)!(Image00084.jpg)!(Image00085.jpg)


    图 58 从左到右的 Logo：Neo, Tezos, Chainlink, NEM


    问题仍然是这些加密货币能否成为以太坊的有力竞争对手。以太坊最大的优势是庞大的社区、巨大的矿工网络和活跃的用户。几乎所有的 DApps 和 DAO 应用都运行在以太坊区块链上。


    许多较小的币种（如波卡或货币）面临着“有鸡还是蛋”的问题。极少数客户使用该网络，因为它还没有被广泛使用。同时，这些项目依赖客户来扩展网络。


    ## 7. 实践介绍：购买比特币


    接下来，我们将具体看看终端用户如何购买和出售加密货币，他们在存储私钥时应该考虑什么，以及投资加密货币到底是否有意义。在每一步中，我们首先查看理论背景，也查看具体的实现。


    首先，建议对市场有一个尽的了解。为此，我们可以使用像 `coinmarketcap.com` 这样闻名的网站。在我们对当前市场有了尽的了解后，我们将在区块链上创建一个地址。为此，我们需要一个
    `private key`。


    ### 7.1 钱包提供商和加密交易所


    现在我们转向钱包提供商和加密交易所。

    '
