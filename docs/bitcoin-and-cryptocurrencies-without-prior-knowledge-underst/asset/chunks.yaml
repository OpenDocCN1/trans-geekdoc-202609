- raw: 'After we have loaded enough credit, we select the cryptocurrency of our choice
    and confirm the purchase. That''s it. We are now official owners of cryptocurrencies.
    We can lie back and hope for rising prices.


    However, some of you will have noticed that our coins are on our account with
    the exchange, and we have not received a private key. If the exchange goes bankrupt
    or is hacked, this could also affect us in extreme cases. Let’s take a look at
    how we can store our coins more sensibly in the long term.


    7.2.         Store coins safely for the long term


    The disadvantage of the exchange lies in its centralisation. This is an ordinary
    company whose servers can be hacked. We ourselves often do not have access to
    our private keys.


    An example of a fatal hack is the history of the Mt. Gox exchange . By 2013, over
    60% of the world''s bitcoin exchanges were transacted through this marketplace.
    Through security gaps (or, possibly, planned insider trading), over 850,000 BTC
    could be stolen. This corresponded to a value of half a billion euros at the time.
    A year later, a wave of lawsuits began. The exchange went bankrupt in 2014. Some
    injured parties received a partial refund, but in fiat money at the then BTC price
    of 2013. Others are still waiting for their money today. Most of the victims would
    be millionaires today if they had not lost their Bitcoins.


    This risk is still present today, but much lower than it was in 2013, for example.
    Just as with any other technology company, a hack can also occur with a stock
    exchange. Other companies like Apple, Microsoft and Co. have also been hacked
    several times. The companies have learned from the security breaches and, for
    example, divide the data and credit balances between different virtual wallets
    so that in the event of a hack, not everything can be captured at once, but only
    a small part.


    ![](Image00004.jpg)Even if the risk is not particularly high, cryptocurrencies
    that you want to hold for the long term should not be left on an exchange, especially
    if large amounts are involved.


    If we just want to get acquainted with the crypto ecosystem and buy some Satoshis
    or mBTC for the first time, we can take the risk and leave our coins on an exchange.
    To get acquainted, the ease of use is very valuable. When the investments increase
    and the amounts increase, we should no longer park the money on an exchange. Therefore,
    let''s take a look at how we open a Bitcoin address in practice.


    We have learned that you can freely choose your private key and thus also your
    Bitcoin address (public address). The digits are created by random events, for
    example by flipping a coin. This is not practical for the end user. If we tell
    a person that in order to open an "account" on the blockchain and buy bitcoins,
    they have to flip a coin 256 times, the blockchain technology will hardly be able
    to catch on.


    Instead, there are smart solutions from wallet providers .


    7.2.1. Software Wallets


    ![](Image00004.jpg)A wallet is an app where our private keys are stored. Our coins
    are stored on the blockchain, and we don''t keep the coins, but the proof that
    we are the owner of the coins in the form of our private key.


    This type of wallet is called a software wallet .


    When opening an account with a wallet provider, as with the exchanges, care was
    taken to ensure that it was designed to be user-friendly and that no prior knowledge
    or background knowledge of the blockchain was required. We will go into more detail
    about the different types of wallets later when it comes to storing the coins
    or private keys. But here, too, there is a potential risk of encountering a dubious
    source. In practice, this is unlikely, but there are also one hundred percent
    secure methods of creating an address.


    Instead, it makes sense to send the coins to an address that we have created ourselves,
    whose private key only we know. No coin tossing is necessary for this. A random
    generator on the PC can be sufficient. There are many softwares and algorithms
    that create a 256-bit long random sequence of ones and zeros.


    Important: The PC must be offline. We should never create our private key online.
    This random private key can easily be saved by the operator in order to steal
    the coins later. This private key should be written unaltered on a piece of paper
    and stored, for example in a safe or safe deposit box. This type of wallet is
    called a paper wallet.


    7.2.2. Cold wallets and hardware wallets


    Alternative storage options are cold wallets . A cold wallet is any type of wallet
    that is not connected to the internet and therefore has no contact with the outside
    world and is considered relatively secure. The paper on which our private key
    is written, for example, is already a type of cold wallet. As an extension, so-called
    hardware wallets should be mentioned.


    ![](Image00093.jpg)![](Image00094.jpg)


    Figure 65 Trezor (left) and Ledger Nano S(right) hardwallets


    These are, for example, a kind of intelligent USB stick that stores the private
    key and that you can "unlock" using your fingerprint, for example. These are specifically
    designed for storing cryptocurrencies and are protected against pretty much any
    hacker attack. Of course, technology can always fail, so you should always get
    two or more of these hardware wallets for security.


    These cold wallets can then in turn be stored in a safe deposit box.


    ![Picture 4](Image00003.jpg)We should never buy these cold wallets second-hand.
    Hackers could have reprogrammed them beforehand to steal the private key.


    | Long-term storage of cryptocurrencies |


    | --- |


    | Wallet type || User-friendliness || Security |


    | Stock Exchange || Good || Medium to Good |


    | Software wallet || Medium to good || Good |


    | Hardware wallet || Medium || Very good |


    | Paper wallet || Bad || Very good |


    | Mobile apps, online wallets etc. || Very good || Bad |


    |  ||  ||  |


    With all the security around our coins, one aspect is important: With some wallet
    types, such as the paper wallet or the soft and hardware wallet, only we have
    control over our private key. This has the advantage that no one can deny us access
    to our coins. On the other hand, there is no central institution that can reset
    our password (our private key).


    ![Picture 4](Image00003.jpg)If we lose the private key, the coins are lost forever
    and irreversibly . There is no way to get the money anymore.


    It is therefore always a good idea to keep several backup copies of the private
    key in different places.


    We also have to plan for unforeseeable things such as a natural disaster. A cold
    wallet can also be lost in a flood or earthquake. If we have not taken precautions,
    the coins are lost forever.


    This has already happened in reality. According to current estimates, 3.7 million
    Bitcoin have already been lost. And this number can only increase over time, as
    lost private keys cannot be recovered.


    However, the absolute loss of Bitcoin will decrease over time as Bitcoin steadily
    increases in value. Some wallets have lost 10,000 or more BTC. However, the price
    at the time was only a few euro cents. In retrospect, this is certainly annoying,
    but nowadays no one will keep 10,000 BTC without first printing out several backup
    copies.


    Private keys can also be stored using so-called seeds, which we will look at in
    more detail in the next sub-chapter.


    7.3.         Seeds and Master Keys


    The basis for Seeds is an update to the Bitcoin system, update number 32, called
    BIP32 (Bitcoin Improvement Proposal). A BIP is an improvement proposal issued
    by developers to the community. The proposed change is discussed, and if the proposal
    is deemed good, it is adopted into the Bitcoin protocol. In this way, further
    improvements are always possible.


    As we already know, the Bitcoin network is very transparent, and anyone can see
    the balance of a Bitcoin address. If we don''t want anyone to be able to see our
    entire assets, we have to create a new wallet. In other words, we must save two
    private keys.'
