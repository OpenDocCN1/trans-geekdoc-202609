    因此，伊朗寻找了替代方案和出路，并了解了区块链技术的优势。这甚至发展到伊朗政府与该国的 `Bitcoin` 矿工合作计算 `Bitcoin`。这些比特币随后被用于国际贸易。


    `Bitcoin` 的接受也可能以与人们假设不同的方式发生。让我们想象，一个大国加入了 `Bitcoin` 网络并享受了随之而来的利益。逐渐，其他国家也被迫研究该网络。没有人想成为最后一个或唯一一个没有获得收益的人。


    此外，禁令还会产生经济后果。`Bitcoin` 百富翁通常也非常富有，并且在他们居住的国家持有大量资产。如果一个政府将持有 `Bitcoin` 视为犯罪行为，这些富人中的一些将会离开，大量财富将流出境外。


    此外，`Bitcoin` 游说团体不再仅由“技术狂热分子”组成。大型公司、价值数十亿的企业和几个小型国家已经在投资 `Bitcoin` 了。甚至政府和金融代表也看到了这种数字货币的巨大优势，例如美国证券交易委员会（`SEC`）成员海斯特·皮尔斯（Hester
    Peirce）。


    “政府试图禁止比特币将是愚蠢的。更大的问题将是，如果我们尝试禁止它，我们［美国］将会错过创新［……］。”


    - `SEC` 委员海斯特·皮尔斯在一次金融门户网站 Marketwatch 的演讲中提到


    但最终，对禁令的反对意见并非毫无理由。`Bitcoin` 仍然非常缺乏监管。这一点可以从极具波动的价格看出，例如某些监管是重要的，并且得到了大多数社区的支持。这将改变其形象，从一种不受控的赌博货币变为一种受认可的、法的支付方式。随着时间的推移和网络的扩展，价格将自行稳定。


    ## 9.2. Bitcoin 是一个泡沫


    到为止，反对 `Bitcoin` 和其他加密货币最常见的论点是，`Bitcoin` 是纯粹的投机，它就是一个泡沫。人们经常将其与之前的泡沫进行比较，例如郁金香泡沫或
    2000 年的互联网泡沫。


    ### 什么是泡沫？


    投机泡沫是一种[市场情况，](https://de.wikipedia.org/wiki/Markt_\(Wirtschaftswissenschaft\))
    在其中，一种或多种[交易商品](https://de.wikipedia.org/wiki/Handelsware)（如[股票](https://de.wikipedia.org/wiki/Aktie)或[债券](https://de.wikipedia.org/wiki/Anleihe)）的价格超过了它们的内在价值。


    当人们谈论 `Bitcoin` 泡沫时，他们的意思是 `Bitcoin` 的价格远高于其内在价值。通常会同时给出理由，即 `Bitcoin` 没有内在价值。


    这是因为 `Bitcoin` 没有任何经济表现支撑（像股票公司那样），也没有任何物理实体（像黄金或房地产那样）。结论是，`Bitcoin` 毫无价值，因此是一个泡沫。


    内在价值是一个非常抽象的概念，无法通过物理属性描述。在我们考虑如何衡量 `bitcoin` 价值之前，让我们考虑支持加密市场泡沫的论点：


    - 大量资金流入加密市场，特别是来自那些没有长期投资视野但想赚“快钱”的人。在这里，市场缺乏监管再次合了他们的意。

    - 结果是极端的波动。货币价格快速涨跌就是结果。

    - 另一个关于泡沫的论点是 `Bitcoin` 被限制在 2100 万枚。一旦某种商品受到限制，随着需求的增加，泡沫就会产生，人们愿意支付无限的价格来获得有限商品的份额。

    - 最后一个元素是价格快速上涨时的狂热。对成为最后一个通过 `Bitcoin` 致富的人的恐惧，导致不明情的市场参与者在不分析基本数据的情况下投资加密市场。。这种效应被称为
    `FOMO`（错失恐惧症）。

    - 一旦预期没有实现，就会被卖出（通常是亏损）。


    所有这些理由在加密市场中形成了暂时的“泡沫”，我们在最近几年中反复看到。在几个月内，像 `Bitcoin` 这样的加密货币增加了数倍，然后又崩溃了高达 90%。


    然而，这与“正常”泡沫有两个主要区别：当泡沫破裂时（如互联网泡沫那样），商品价格会跌至泡沫之前的价格以下。像德国电信（Telekom）股票这样的股票至今还没有恢复。


    ![](img/Image00111.jpg)

    图 78 电信股票价格走势


    相比之下，`Bitcoin` 经历了几次泡沫。然而，在“泡沫破裂”之后，`Bitcoin` 的水平一直比泡沫之前的水平高，而且每次价格都比上一个泡沫的峰值高。


    ![](img/Image00112.gif)

    图 79 `Bitcoin` “泡沫”从 100 美元到 1200 美元再回  250 美元


    ![](img/Image00113.gif)

    图 80 `Bitcoin` “泡沫”从 1000 美元到 20000 美元再回到 6000 美元


    还有其他短期“泡沫破灭”的例子。


    我们可以看到，短时间的剧烈涨跌并非寻常。从纯事实的角度来看，所示的两次上涨都不是之前泡沫（如互联网泡沫）意义上的泡沫。如果你在整个涨跌期间持有你的币，那么与泡沫之前的价格相比，你的持币量增加了。


    相比之下，在真实的泡沫情况下（例如电信股票），人们到目前为止的投资遭受了损失。


    ![](img/Image00004.jpg)与其说是泡沫，不如说 `Bitcoin` 是以波浪形式发展的。在这些波动中，价格快速上涨然后往往再次下跌。它看起来像一个泡沫，但长期趋势明显是向上的，而这在泡沫破裂后并非如此。


    ![Picture 4](img/Image00003.jpg)比特币价格以波浪方式增长并有时显示快速涨跌的事实往往给人一种泡沫的印象。


    此外，这些狂热阶段对加密货币的价值有非常积极的影响。越来越多的人参与到这个话题中。该领域获得了新鲜资金和聪明的头，投资者正在发现新的机会。


    我们在上一个小节中也看到，例如 `Bitcoin` 的价格可能仍然远低于价值。我们看到有许多理由认为 `Bitcoin` 具有极高的内在价值。然而，要做到这一点需要理解
    `blockchain` 的功能和目的。因此，如果你不能说明内在价值为何低于当前价格的理由，那么谈论泡沫是没有意义的。


    恰恰，我们可以看一个记录宣布 `Bitcoin` “死亡”的页面。


    [`99bitcoins.com/bitcoin-obituaries/`](https://99bitcoins.com/bitcoin-obituaries/)


    总共，`Bitcoin` 被宣布死亡了 400 多次。

    '
