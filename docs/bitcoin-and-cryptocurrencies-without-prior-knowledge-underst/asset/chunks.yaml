- raw: "This book is suitable for anyone with a basic enthusiasm for cryptography.\
    \ There is also a bit of mathematics, but at a very manageable level, so that\
    \ any reader can follow along easily.\n\nThe book is suitable for beginners. The\
    \ chapter contents are designed in such a way that they are understandable even\
    \ without prior knowledge. Since the book is also intended to offer added value\
    \ to readers with prior technical knowledge, some of the technical details of\
    \ the blockchain are dealt with in detail. These details and digressions can seem\
    \ daunting at first glance but are not essential for general understanding. Even\
    \ as a superficial user of the technologies, however, it is useful to have the\
    \ background illuminated, even if one cannot reproduce everything in the smallest\
    \ detail afterwards.\n\nIn addition, many new terms are introduced. If a term\
    \ needs to be looked up while reading, the index at the end of the book will help.\n\
    \nSince the basic knowledge of our monetary system as well as encryption techniques\
    \ are essential for understanding, the first chapters deal with them specifically.\n\
    \nFor a better structure, the following icons can be found again and again at\
    \ certain points in the book:               \n\n![](Image00000.jpg)Light bulb:\
    \ Here the key points of a chapter are summarised. These statements are good for\
    \ reference or if you want to skim over a subject area again.\n\n![Picture 4](Image00001.jpg)Attention:\
    \ Common mistakes are listed here. It is shown where and why one often encounters\
    \ obstacles or wrong assumptions.\n\n2.  Entry and basic knowledge\n\nThe monetary\
    \ system as we use it today determines almost all areas of our lives, whether\
    \ it's choosing our career path, financing our home or taking a summer holiday.\n\
    \nOf course, money alone does not make people happy, but there are numerous studies\
    \ that show that money problems cause increased stress levels. That is why it\
    \ is important to deal with the money system at an early age. Where does money\
    \ come from? What is the function of money? How do banks earn their money?\n\n\
    Unfortunately, there is a huge gap in financial education. Economic contexts are\
    \ usually not part of the school curriculum and are therefore only insufficiently\
    \ taught. Yet fundamental mechanisms are at work in the market that have a significant\
    \ influence on everyone's everyday life.\n\nIt is therefore important to know\
    \ what this money is, how it has developed historically and what problems are\
    \ associated with it.\n\nTo get an overview of the current system and its strengths\
    \ and weaknesses, let's start by taking a look at the history of our money.\n\n\
    2.1.         The history of money\n\nThe history of money goes back to the origin\
    \ of mankind.\n\nUntil about 2000 years before Christ, it was common for goods\
    \ and commodities to be exchanged directly. At markets or shops, all yields were\
    \ brought together and exchanged. The farmer gave part of his surplus grain for\
    \ a few woolen blankets, the cobbler a pair of shoes for fresh milk and fish,\
    \ and so on. Relatively quickly it became clear that it made more sense not to\
    \ trade goods directly, but to trade a substitute product that unified the value\
    \ of the different goods. At the same time, this substitute must be smaller, more\
    \ manageable and remain stable for longer, i.e. it must not become mouldy or worn\
    \ out.\n\nThe aim was to be able to store the manpower that is in the products\
    \ in the long term.\n\nRelatively quickly, shells, diamonds and precious metals\
    \ such as gold and silver were identified as potential stores of value. In the\
    \ end, precious metals such as gold, silver and bronze compounds stood out.\n\n\
    Gold was the primary, stable currency until the 16th century. But why, with so\
    \ many possible commodities, did the choice fall on precious metals of all things?\
    \ To understand this, let's first take a look at the tasks of money or a currency.\
