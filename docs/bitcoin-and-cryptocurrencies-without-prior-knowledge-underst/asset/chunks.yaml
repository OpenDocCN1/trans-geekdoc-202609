- raw: 'Whether that was really his opinion, or whether he simply wanted to save the
    value of the coins he had captured, is anyone''s guess. In any case, the majority
    of the community did not listen to him and initiated a hardfork.


    Doesn''t this attack sound familiar? Haven''t we already addressed a similar scenario?
    Exactly: In response to this attack, the hardfork was triggered, from which Ethereum
    Classic emerged. Now we also understand the background behind the attack, which
    has since become known as the DAO hack. We also understand that it was not a bug
    in the Ethereum blockchain, but a bug in a smart contract that only ran on the
    blockchain and was programmed by humans.


    Ethereum founder Vitalik Buterin also saw it that way and initially stayed out
    of the entire discussion surrounding the upcoming fork.


    Since over 15% of the total ETH was in the DAO network, the founder finally dealt
    with this issue and worked out the fork, in which the attacker''s address is put
    on a kind of "blacklist" so that he cannot access the coins.


    Even though it was probably the right decision, this example shows that the protocol
    is not set in stone and can be changed by the community.


    Despite this unfortunate event, we can state that smart contracts bring with them
    unimagined possibilities. DApps, tokens or DAOs. Decentralised applications whose
    rules are visible to everyone will be of great relevance in the future.


    6.6.         Ethereum alternatives


    Finally, we can see that Ethereum already significantly facilitates some use cases,
    such as crowdfunding (financing of a project by several, partly private, investors),
    and that the possibilities in the future are seemingly unlimited.


    Ethereum and other decentralised networks will change the entire banking, insurance
    and intermediation sector. Meanwhile, banks and financial service providers are
    also recognising the benefits of blockchain and want to benefit from these technologies
    themselves.


    Ethereum is the first major blockchain technology that no longer positioned itself
    primarily as a currency, but as a decentralised giant computer. As with any new
    technology, not all parts of the community were behind the management. They saw
    a need for improvement in many areas.


    The "Ethereum system" has quickly inspired many development teams to design their
    own cryptocurrency. Even from the founding team of Ethereum, some programmers
    have split off. They believe they can design a better version of Ethereum and
    have programmed their own cryptocurrencies, such as Cardano (ADA).


    In recent years, many Ethereum competitors have entered the market. Each addresses
    a different problem they see in Ethereum. Nevertheless, Ethereum is still by far
    the second largest cryptocurrency. Nevertheless, it is worth looking at the self-proclaimed
    "Ethereum killers."


    Many altcoins have very similar approaches to the Ethereum network but have focused
    strongly on a sub-niche to differentiate themselves from the other projects. These
    can be, for example, the sub-niches "the Internet of Things," "the Internet 3.0"
    or "artificial intelligence".


    It is important to know that there are several Ethereum competitors. We will go
    into the largest project in terms of market capitalisation, but will only cover
    the projects superficially, as the full technology behind these cryptocurrencies
    is beyond the scope of this book. Moreover, it would make little sense to discuss
    a specific project, as the crypto market is very fast-moving and characterised
    by emotions. Whether cryptocurrencies will be the next Bitcoin in a few years
    or disappear into oblivion is very difficult to predict.


    One cryptocurrency that saw a huge rise in the spring of 2020 is Polkadot .


    ![](Image00080.gif)


    Figure 56 Polkadot logo


    Polkadot is a cryptocurrency that was released in October 2017 but was not one
    of the top coins until late 2020.


    The founder of Polkadot, Gavin Wood, is a former Ethereum co-founder who split
    off and later founded the web3 foundation, which is behind Polkadot, with Robert
    Habermeier and Peter Czaban.


    Polkadot''s cryptocurrency is called DOT .


    In the spring of 2021, Polkadot experienced an extreme rise and was able to briefly
    become the fourth largest cryptocurrency.


    What is the vision of Polkadot?


    Polkadot has recognised that more and more blockchain technologies are being developed.
    Each of these technologies solves its own problem. However, interaction between
    these blockchains is not readily possible.


    This is where Polkadot comes in. Polkadot is often referred to as Internet 2.0,
    which aims to create a huge, decentralised network from the individual blockchains,
    with Polkadot forming the bridges between the various blockchains.


    However, this vision is not new. Ethereum has the same approaches but is technically
    significantly behind Polkadot. On the other hand, Ethereum has a larger community
    and more active users.


    Another project very similar to Ethereum is Cardano.


    The founder of Cardano is Charles Hoskinson. Like the founder of Polkadot, he
    was also a co-founder of Ethereum, jumped off in 2015 and realised his own vision
    of a cryptocurrency with Cardano.


    ![](Image00081.jpg)


    Figure 57 Cardano logo


    With Cardano, the coins are called ADA . Cardano is a decentralised blockchain
    and also allows the execution of smart contracts.


    The biggest and most central difference between Ethereum and Cardano is that Cardano
    uses the proof-of-stake concept.


    The transaction costs are distributed to the people who operate the nodes, i.e.,
    those who store blockchain on their computer.


    Cardano itself wants to become the largest crypto project and solve all problems
    of blockchain technology. The Cardano development team consists of many professors,
    programmers and engineers.


    Above all, Cardano can scale better than Ethereum due to the proof-of-stake algorithm.
    Transaction fees are significantly lower, and more transactions are possible.
    We have seen from the crypto kitties that a single project can load the proof-of-work
    network.


    If multiple DAOs, DAPPs and other applications are to run on the Ethereum blockchain
    in the future, Ethereum must scale. Otherwise, Ethereum will lose its current
    lead over the alternatives.


    6.7.         EIP1559 and Ethereum 2.0


    Ethereum itself is now aware of this problem.


    For this reason, EIP1559 will be implemented in July 2021. This improvement proposal,
    also known as the London Update, was proposed by Vitalik Buterin himself in 2018.
    In simple terms, EIP1559 means that transaction fees will no longer be distributed
    to miners as before but instead will be burned . The miners will only receive
    the block subsidy of two ETH per solved block . The transaction fee will be replaced
    by a standard transaction fee. Although this depends on the network load, it is
    significantly lower than the previous "highest bidder system" that is normally
    the case with Proof of Work. However, one can still send a small donation to the
    miners, the Miner Tip or also called Inclusion Fee .


    A concrete example:


    Before EIP1559:


    Mining Reward = Block Subsidy + Transaction Fees


    User costs for the transactions (transaction fee): 5 ETH


    Mining Reward: 2 ETH + 5 ETH = 7 ETH


    The distributed Ether creates an inflation of 2 ETH


    After EIP1559:


    Mining Reward = Block Subsidy + Miner Tip


    \-> Base fees are burnt


    User costs for the transactions (base fee): 2.5 ETH


    Additionally 0.7 ETH Mining Tips will be donated


    Mining Reward: 2 ETH + 0.7 ETH = 2.7 ETH


    In addition, the base fee of 2.5 ETH is burned. This results in a slight deflation
    of 0.5 ETH (2.5 ETH base fee minus 2 ETH block subsidy).


    Depending on the network load, the transaction fees per block can b higher than
    the two ethers distributed per block. This means that, for example, two Ether
    are distributed while three are burned at the same time. Thus, Ether could change
    from an inflationary to a deflationary system.'
