- raw: 'As a result, Iran looked for alternatives and ways out and learned about the
    advantages of blockchain technology. This even went so far that the Iranian government
    worked with Bitcoin miners in the country to calculate Bitcoin. These were then
    used for international trade.


    The acceptance of Bitcoin can also happen in a different way than one might assume.
    Let''s imagine that a large nation joins the Bitcoin network and enjoys the benefits
    that come with it. Gradually, other nations are forced to investigate the network.
    No one wants to be the last or the only one not to reap the benefits.


    Moreover, a ban would also have economic consequences. Bitcoin millionaires are
    also generally very wealthy and hold a lot of assets in the country where they
    reside. If a government were to criminalise the possession of Bitcoin, some of
    these wealthy individuals would leave and a lot of wealth would flow out of the
    country.


    Moreover, the Bitcoin lobby no longer consists only of "tech nuts." Large corporations,
    companies worth billions and several small states are already investing in Bitcoin.
    Even government and financial representatives see the enormous advantages of the
    digital currency, for example Hester Peirce, member of the US Securities and Exchange
    Commission (SEC).


    "It would be stupid of the government to try to ban Bitcoin. The bigger problem
    would be that we \[the US\] would miss out on innovation \[...\] if we try to
    ban it."


    \-SEC Commissioner Hester Peirce in a talk to the financial portal Marketwatch


    Ultimately, however, the objection of a ban is not completely unjustified. Bitcoin
    is still very unregulated. This can be seen, for example, in the very volatile
    prices. Some regulations are important and are supported by the majority of the
    community. This would change the image from an uncontrolled gambling currency
    to a recognised, legitimate payment method. With time and the spread of the network,
    the price will stabilise on its own.


    9.2.         Bitcoin is a bubble


    By far the most common argument used against Bitcoin and other cryptocurrencies
    is that Bitcoin is pure speculation and that it is just a bubble. Comparisons
    are often drawn to previous bubbles such as the tulip bubble or the dotcom bubble
    in 2000.


    But what is a bubble anyway?


    A speculative bubble is a [market situation in](https://de.wikipedia.org/wiki/Markt_\(Wirtschaftswissenschaft\))
    which the prices of one or more [traded goods](https://de.wikipedia.org/wiki/Handelsware)
    (such as [shares](https://de.wikipedia.org/wiki/Aktie) or [bonds) are](https://de.wikipedia.org/wiki/Anleihe)
    above their intrinsic value.


    When someone talks about a Bitcoin bubble, they mean that the price of a Bitcoin
    is far above its intrinsic value. The reason is usually given at the same time,
    namely that Bitcoin has no intrinsic value.


    This is because Bitcoin is not matched by any economic performance, as is the
    case with stock companies, nor by any physical substance, as is the case with
    gold or real estate. In conclusion, Bitcoin is worthless and thus a bubble.


    Intrinsic value is a very abstract concept and cannot be described by physical
    attributes. Before we look at how we can measure bitcoin value, let''s consider
    the arguments in favour of a bubble in the crypto market:


    A lot of capital is flowing into the crypto market, especially from people who
    do not have a long-term investment horizon but want to make "quick money." Here
    again, the non-existent regulation of the market plays into their hands.


    The result is extreme volatility. Rapid rises and falls in the price of currencies
    are the result.


    Another argument for a bubble is the fact that Bitcoin is limited to 21 million
    coins. Once a good is limited, a bubble can develop as demand rises, with people
    paying unlimited prices to get a share of the limited good.


    The final element is euphoria when the price rises rapidly. The fear of being
    the last not to get rich with Bitcoin leads uninformed market participants to
    invest in the crypto market without analysing the fundamental data. This effect
    is called FOMO (fear of missing out).


    As soon as expectations are not fulfilled, they are sold (often at a loss).


    All these reasons form temporary "bubbles" in the crypto market, which we have
    seen again and again in recent years. Within a few months, cryptocurrencies like
    Bitcoin multiplied and then crashed again by up to 90%.


    However, there were two major differences to a "normal" bubble: When a bubble
    burst, as was the case with the dotcom bubble, the prices of goods fell below
    their pre-bubble price. Shares like the German Company Telekom share have not
    recovered from this to this day.


    ![](Image00111.jpg)


    Figure 78 Development of the Telekom share price


    Bitcoin, on the other hand, has already had several bubbles. However, Bitcoin
    has always remained at a higher level after the "bubble burst" than before the
    bubble, and each time the price has been higher than the peak of the previous
    bubble.


    ![](Image00112.gif)


    Figure 79 Bitcoin "bubble" from 100 USD to 1200 USD and back to 250 USD


    ![](Image00113.gif)


    Figure 80 Bitcoin "bubble" from 1000 USD to 20000 USD and back to 6000 USD


    There are other examples of the short-term "bursting of the bubble."


    We can see that sharp rises and falls in a short period of time are nothing out
    of the ordinary. From a purely factual point of view, both rises shown were not
    bubbles in the sense of previous bubbles, such as the dotcom bubble. If you held
    your coins for the entire period of the rise and fall, you multiplied them compared
    to the price before the bubble.


    In comparison, in the case of a real bubble, as was the case with the Telekom
    share, one has suffered a loss with one''s investment to date.


    ![](Image00004.jpg)Instead of talking about bubbles, Bitcoin develops in waves.
    Within these waves, the price rises rapidly and then often falls again. It has
    the outward appearance of a bubble, but the long-term trend is clearly upwards,
    which is not the case after a bubble bursts.


    ![Picture 4](Image00003.jpg)The fact that the bitcoin price grows in waves and
    at times shows rapid rises and falls often gives the appearance of a bubble.


    Moreover, these phases of euphoria have a very positive influence on the value
    of cryptocurrencies. More and more people are getting involved with the topic.
    Companies in this field are being provided with fresh capital and clever minds,
    and investors are discovering new opportunities.


    We have also seen fundamentally in the previous subchapter that the price of Bitcoin,
    for example, may still be far below value. We have seen that there are many good
    reasons to attribute a very high intrinsic value to Bitcoin. However, to do so,
    one needs to understand the function and purpose of the blockchain. So it doesn''t
    make sense to talk about a bubble if at the same time you can''t show any reasons
    why the intrinsic value should be lower than the current price.


    Fittingly, we can look at a page that takes up every newspaper report declaring
    Bitcoin "dead."


    [https://99bitcoins.com/bitcoin-obituaries/](https://99bitcoins.com/bitcoin-obituaries/)


    In total, Bitcoin has been declared dead over 400 times.


    ![](Image00004.jpg)Critical statements are often made by people who have not dealt
    with blockchain or by advocates of centralised institutions such as large banks,
    investment funds or political institutions.


    In conclusion, it can be said that the crypto market is very volatile and therefore
    has a deterrent effect on inexperienced investors. It is theoretically possible
    to lose your entire investment. If we are unlucky, we buy Bitcoin and it falls
    in price by 90% afterwards. This is and was quite normal.


    However, it is also a fact that one can increase one''s money by simply buying
    and holding (HODL) in any longer period of time (several years). Of course, the
    future cannot ultimately be determined or predicted by the past.


    History does not repeat itself, but it repeats its lessons.'
