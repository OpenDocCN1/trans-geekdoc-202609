- raw: '![](Image00095.jpg)


    Figure 66 Generation of two addresses by two private keys


    If we want to open 100 addresses on the blockchain, we have to store 100 private
    keys. That is time-consuming. That’s where the proposed improvement comes in.


    BIP32 proposed the introduction of Hierarchic Determinist Wallets (HD Wallets).


    They solve the problem described and simplify the operation of wallets. However,
    it helps to increase privacy at the same time.


    With HD wallets, a master key is introduced. This looks very similar to a private
    key and also consists of a cryptic sequence of numbers and letters.


    Any number of private keys can then be generated from the master key.


    ![](Image00096.jpg)


    Figure 67 Generating any number of addresses using a master key


    A private key is generated from the master key, from which another private key
    can be generated and so on.


    Deterministic functions are used for this purpose. Deterministic means that an
    output can be clearly assigned to an input.


    Similar to the SHA256 algorithm, one-way functions are also used that can easily
    generate one or more private keys from the master key and thus subsequently generate
    a public address. On the other hand, it is not possible to infer from a private
    key to another private key or to the master key.


    When we want to receive money, we create a new private key and the corresponding
    address. For the next transaction, we create a new private key and so on.


    ![](Image00004.jpg)Although the coins are distributed over many addresses, we
    can access all coins through a single master key. However, a third person cannot
    tell how much credit we have in total, because no one can trace which addresses
    belong to us.


    We can see that the BIP32 extension is a great help for privacy. The problem,
    however, is that we still have to remember a cryptographic sequence of numbers.


    Anyone who has ever tried to enter a private key on their PC will see how impractical
    it can be. It is easy to mistype or lose the thread. Even storing the key is not
    intuitive. That is why so-called seeds have been introduced. This extension has
    been introduced as BIP39 .


    With the introduction of the seeds, we no longer have to remember a cryptic private
    key, but English words that are in plain text.


    A total of 2,048 different English words were selected for this purpose.


    The list of words is publicly available.


    [https://github.com/bitcoin/bips/blob/master/bip-0039/english.txt](https://github.com/bitcoin/bips/blob/master/bip-0039/english.txt)


