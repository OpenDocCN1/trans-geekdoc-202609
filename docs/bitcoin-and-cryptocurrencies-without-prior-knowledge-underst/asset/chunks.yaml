- raw: "To prevent this, it must be proven that he has not mined a longer blockchain\
    \ before. But how do you prove that something has only existed for a short time?\n\
    \nThe solution is as simple as it is ingenious. Satoshi Nakamoto took the headline\
    \ of a newspaper and wrote the hash of the headline in the first block. This proved\
    \ that the blockchain could not have been created before the headline appeared.\
    \ How else could Satoshi have known the headline?\n\nSatoshi could have taken\
    \ any headline, but he deliberately chose a symbolic headline that refers to the\
    \ financial crisis and thus highlights the problems of monetary policy. The headline\
    \ is from the British Times on 3 January 2009.\n\n![](Image00043.jpg)\n\nFigure\
    \ 28 Front page of the Times of 3 January 2009\n\nThe article titled Chancellor\
    \ on brink of second bailout for banks is about the then British Chancellor of\
    \ the Exchequer Alistair Darling . He tried in vain to stimulate the British economy.\
    \ With the choice of headline, the message is obvious: the old system is not working,\
    \ it is time for something new. It is time for Bitcoin.\n\n![](Image00044.jpg)\n\
    \nFigure 29 Excerpt from the Bitcoins programme code\n\nThe heading is therefore\
    \ found in the source code (programme code) of Bitcoin. It is used to create the\
    \ first hash, which forms the very first entry of the Genesis block. Among Bitcoin\
    \ enthusiasts, this headline is well known.\n\n4.1.         Mining Difficulty\n\
    \nWhat we have seen so far: A block is solved when the matching nonce has been\
    \ found, i.e., when a miner has found a number that, together with the transaction\
    \ data, happens to find a hash that starts with a certain number of zeros.\n\n\
    However, it has often been stated that a new block is found every ten minutes.\
    \ If several miners connect to the network and thus many people mine and make\
    \ their computing power available, a suitable nonce can be found much faster.\n\
    \nAnalogously, we can imagine solving a puzzle:\n\nIf ten people try to solve\
    \ a puzzle, even if only by guessing, they will arrive at the result about ten\
    \ times faster than a single person.\n\nThis is only half the truth, because if\
    \ the puzzle is also ten times as complex, the time required is again about the\
    \ same.\n\nOf course, a person can be lucky and guess the right number directly\
    \ by chance. However, this evens out over time.\n\nIf we adjust the difficulty\
    \ of the puzzle to the number of players, the time needed to solve the puzzle\
    \ remains about the same.\n\nThis principle has also been adopted in the Bitcoin\
    \ blockchain.\n\nA block is appended to the blockchain when a miner finds the\
    \ matching nonce. The frequency with which this happens depends on the difficulty\
    \ of finding a matching nonce. To adjust the difficulty, we need to adjust the\
    \ conditions on the nonce or the resulting hash.\n\nIf we specify that the resulting\
    \ hash must not only start with a zero, but with two zeros, the solving becomes\
    \ much more difficult.\n\n![](Image00004.jpg)By increasing the number of initial\
    \ zeros of the resulting hash, finding the correct nonce becomes more complicated.\
    \ Solving a block takes longer on average.\n\nThis has another side effect: since\
    \ the puzzle has automatically become more difficult, the resulting hash also\
    \ contains more computing power or energy that had to be expended to solve it.\
    \ This in turn means that an attacker also needs more computing power. The network\
    \ became more secure by making the puzzle more difficult!\n\n![](Image00004.jpg)The\
    \ more participants connect to the network, the more computing power is in the\
    \ network and the more difficult it becomes to find the matching nonce. Thus,\
    \ the entire network becomes more and more secure with each additional participant.\n\
    \nThe complexity of finding a matching number is also called the mining difficulty.\
    \ The mining difficulty is adjusted every 2,016 blocks. This corresponds to a\
    \ period of about two weeks. If the miners needed more than two weeks to solve\
    \ the last 2,016 blocks, the mining difficulty was too high and is therefore reduced.\
    \ If, on the other hand, too much computing power was available in the network\
    \ and solving the blocks took less than two weeks, the mining difficulty is increased\
    \ and solving the puzzle becomes more difficult. For the network, it is unimportant\
    \ how much absolute computing power is available. It automatically adjusts every\
    \ fortnight so that the blocks take an average of ten minutes to solve.\n\n4.2.\
    \         Economic aspects of mining\n\nFor each block found, bitcoins are paid\
    \ out to the miner who guessed the right nonce. At today's (2021) 6.25 BTC, this\
    \ adds up to several thousand euros. This lucrative incentive attracts people\
    \ who want to earn money with mining. There is nothing wrong with this, after\
    \ all, they support the network, expand decentralisation and make it more difficult\
    \ to \"hack\" the blockchain.\n\nSince the mining difficulty adjusts to the total\
    \ hashing power, or the computing power of the network, the mining difficulty\
    \ increases with increasing popularity and higher bitcoin price. After all, it\
    \ is more lucrative to mine Bitcoins when the price is not €100 but €100,000.\
    \ This is because the amount of bitcoin distributed is already prescribed by the\
    \ source code and is completely independent of the price of a coin.\n\n![](Image00045.jpg)\n\
    \nFigure 30 Historical development of the bitcoin mining difficulty and the total\
    \ hashrate               \n\nSource: https://bitcoinmagazine.com/business/introducing-cbei-a-new-way-to-measure-bitcoin-network-electrical-consumption\
    \              \n\nIn the meantime, Bitcoin mining has taken on such proportions\
    \ that companies have been founded whose entire business model is based on producing\
    \ computing machines that have only one purpose: calculating the SHA256 algorithm.\n\
    \n![](Image00046.jpg)Companies like bitman from China create complex circuits,\
    \ so-called ASIC miners (application-specific intrinsic circuits), which can calculate\
    \ the SHA256 algorithm much more efficiently than any high-end computer. The latest\
    \ model, the Antminer S19 Pro, for example, manages 110 trillion hash calculations\
    \ per second! ![](Image00047.jpg)\n\nFigure 31 Bitman antminser S19 Pro\n\nThe\
    \ original idea of decentralisation, that every private person at home with their\
    \ computer could act as a miner, is no longer feasible.\n\nLarge mining farms,\
    \ mostly based in China, sometimes own over 25 % of the total hashing power.\n\
    \nHowever, since the beginning of bitcoin, it can also be observed that the total\
    \ hashing power keeps increasing, as does the distribution of hashing power.\n\
    \nNevertheless, it would be fatal if one person could accumulate too much computing\
    \ power.\n\n![](Image00046.jpg)If one person or a group of people can muster the\
    \ absolute majority of the computing power, the risk of a 51% attack is possible.\n\
    \n4.3.         The 51 % attack\n\nA 51% attack or a 51% attack means that a group\
    \ of miners can take complete control of a network.\n\nIf a group owns 51% or\
    \ more of the total hashing power of a network, it can freely decide the rules\
    \ of the emerging blockchain. It can confirm or reject transactions and even double-spend.\n\
    \nThe reason for this is that 51% is the largest hashing power of the network\
    \ in absolute terms. This allows the miners to find the required nonces and solve\
    \ blocks the fastest. Consequently, the chain of blocks of the \"attackers\" is\
    \ longer than all others and is taken as consensus by all nodes.\n\nIn reality,\
    \ this kind of attack is completely unfounded on the Bitcoin blockchain and many\
    \ other major cryptocurrencies. It is almost impossible to amass over 50% of the\
    \ total hashing power. The network is so widespread that no group of people could\
    \ centre enough resources and energy to get their hands on over 50% of the computing\
    \ power. However, smaller cryptocurrencies that are not as widespread have seen\
    \ this kind of attack very often."
