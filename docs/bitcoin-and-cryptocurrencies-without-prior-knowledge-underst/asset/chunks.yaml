  trans: "\n\n# 比特币 (Bitcoin)\n\n这种加密货币的名称为 `Bitcoin`。其单位也称为 `bitcoin`，并缩写为 `BTC`。\n\
    \n`Bitcoin` 和区块链于 2008 年推出，从那时以来 `Bitcoin` 一直是最大的加密货币。加密货币的规模通过其市值来衡量，类似于股票。市值是该加密货币的币价乘以所有币的当前数量。\n\
    \n![](img/Image00061.jpg)\n\n如果一个 `bitcoin` 的价格为 10,000 欧元，且市场上有 1500 万个硬币，那么市值为：\n\
    \n![](img/Image00062.jpg)\n\n反之，这意味着：如果一个硬币的价格为 100 欧元，它并不自动比 50 分钱的硬币更受欢迎、更大或更好。这始终取决于流通币的数量。如果后者的硬币流通量是前者的千倍，那么市值就会更高。\n\
    \n![](img/Image00004.jpg) 最大区块链技术的排名是根据市值衡量的，而不是绝对价格。\n\n小额代币在绝对意义上更受欢迎这一事实，是许多加密货币新手会感受到的心理效应。他们看到一个\
    \ `Bitcoin` 价值 10,000 欧元，而 `Bitcoin Cash` 仅需 100 欧元。然后他们倾向于抢购 `Bitcoin Cash`，而不看流通币的数量。\n\
    \n正如前面提到的，`Bitcoin` 远领先于加密货币排名。\n\n![](img/Image00004.jpg) `Bitcoin dominance`（比特币主导率）描述了\
    \ `Bitcoin` 在整个加密市场中所占的份额。自从区块链技术出现以来，`Bitcoin dominance` 一直处于 70% 的范围内。这意味着单\
    \ `Bitcoin` 一项就占据了加密市场总资金的 70%。所有山寨币合起来仅占资金的 30%。\n\n这种 `Bitcoin dominance` 在多年来一直在波动。`Bitcoin\
    \ dominance` 曾在低点时处于 30% 以下，但也曾高于 90%。\n\n如果你是加密交易所的经常访客，你会经常听到“市值”和“比特币主导率”等术语。有很多网站可以看到当前数据。\n\
    \n查看最大加密货币当前价格和排名的第一个地方是 `coinmarketcap.com` 网站。\n\n![](img/Image00063.jpg)\n\n\
    图 43 CoinMarketCap 标志\n\n`Coinmarketcap` 是一个巨大的数据库，其中显示了几乎所有现有加密货币的价格精确到分钟。在这里，我们可以查询加密货币的当前价格及其表现。该页面显示了所有列出这些加密货币的交易所平均价格。这与确定股票当前市场价格的方法相同。`bitcoin\
    \ dominance` 也显示在 `CoinMarketCap` 上。\n\n![](img/Image00064.jpg)\n\n图 44 从 CoinMarketCap\
    \ 提取的泰达 (Tether-USDT) 截图\n\n在观察某些硬币的价格时，可以注意到某些硬币随时间推移既不下跌也不上涨，例如加密货币 `USDT`。这是巧合吗？\n\
    \n## 6. 稳定币 (Stablecoins)\n\n在加密市场的早期，仍然存在一些问题。例如，加密交易所 `Bitfinex` 意识到了加密货币的每次买卖都必须通过银行的问题。\n\
    \n![](img/Image00065.jpg)\n\n图 45 Bitfinex 标志\n\n如果我们想购买 `Bitcoins`，必须向银行账户存入资金。作为回报，我们收到\
    \ `Bitcoins`。有了区块链技术，我们已经有了完美的方法可以恰恰规避这一点。\n\n为了从买卖过程中剔除这个中间人，`Bitfinex` 公司创建了一种复制一美元价值的加密货币。\n\
    \n为此，银行账户中存入了十十亿美元，并提供了十十亿个所谓的“泰达”（`USDT`）供购买。\n\n![](img/Image00066.jpg)\n\n\
    图 46 泰达 (Tether) 标志\n\n`Bitfinex` 是一家加密货币交易所。交易所提供“数字美元”进行交易具有巨大的财务激励。每当 `USDT`\
    \ 兑换为 `Bitcoin` 或其他加密货币时，现在赚取的是交易所而不是银行。\n\n与其将你的 `Bitcoins` 卖出“真实”货币，你可以将其兑换为\
    \ `USDT`。`Tether` 背后的公司保证，如果需要，我们也可以通过 `Tether` 硬币获得一美元。实际上，该货币的价格会波动，就像所有其他加密货币一样。`Tether`\
    \ 积极应对这一点。\n\n如果对硬币的需求太低，`Tether` 会通过买入硬币来补偿价格波动。反之，如果对硬币的需求太高，`Tether` 则通过发行新币来应对这一点，以维持\
    \ 1 美元的名义价值。\n\n![](img/Image00067.jpg)\n\n![](img/Image00004.jpg) 因为这些类型的硬币如\
    \ `Tether` 具有稳定的价值，它们被称为 `stablecoins`。\n\n`Stablecoins` 是加密系统中重要的组成部分。它们构成了从黄金或法币（如欧元、美元、日元或瑞士法郎）进入加密世界的桥梁。`Stablecoins`\
    \ 是与比较价值相关并由真实等值支撑的硬币。\n\n关于 `Tether` 硬币发行的另一个方面是，这些加密货币未被金融当局视为货币，结果 `Bitfinex`\
    \ 交易所消除了许多监管障碍。\n\n正如纸币系统一样，对于 `stablecoins` 来说，货币有支撑是重要的。\n\n 6.2 以太坊 (Ethereum)\n\
    \n以太坊是多年来排名第二的加密货币。我们在挖矿和硬分叉章节中已经提到过 `Ethereum`。在接下来，我们将探索 `Ethereum` 背后的理念，因为以太坊并不是普通的加密货币。\n\
    \n以太坊于 2013 年首次推出，并于 2015 年实施。与比特币不同，其创始人是为人知的，并与社区保持交流。开发者 `Vitalik Buterin`\
    \ 和 `Gavin Wood` 是 `Ethereum` 项目的面孔。`Vitalik Buterin` 特别经常受到关注，被认为是以太坊的灵魂人物。他在\
    \ 19 岁时就开发了 `Ethereum`，智商高达 257，是加密领域最著名的人物。\n\n与此同时，以太坊项目也由总部位于瑞士的 `Ethereum\
    \ Foundation` 进一步开发。\n\n"
