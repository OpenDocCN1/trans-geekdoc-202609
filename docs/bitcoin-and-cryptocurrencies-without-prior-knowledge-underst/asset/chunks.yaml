- raw: "The majority of miners do not like this proposal at all. After all, according\
    \ to current estimates, they receive up to 60 % less ether per solved block. Nevertheless,\
    \ the proposal was implemented by the developers. Theoretically, the miners could\
    \ initiate a hardfork, but this would very likely leave a mark on the stability\
    \ and trust of the Ethereum network, so they would be harming themselves. Apart\
    \ from that, it is a big step forward for the system on a technological level.\n\
    \nAnother technical aspect of the proposed improvement is that the size of a block\
    \ adjusts to the load on the network. This makes the network faster and cheaper\
    \ for all users. This step is important for scalability, which is why most of\
    \ the community is behind this proposal. They reason that miners, due to rising\
    \ popularity and rising Ether price, can still mine profitably. Although they\
    \ will only receive two Ether per block, these will be worth more in fiat currency\
    \ terms. This is what many miners are hoping for. There are already other solutions\
    \ to compensate the miners, but in the long run such an update is inevitable to\
    \ be able to use Ethereum on a large scale.\n\nIn any case, it is also clear that\
    \ Ethereum mining will end with Ethereum 2.0, which is expected to be launched\
    \ in 2022 or 2023 at the latest. By that time, the proof-of-stake concept will\
    \ have been fully implemented and the miners will have been replaced by validators.\n\
    \nDepending on when you read this, the 1559 proposal has already been implemented\
    \ or Ethereum is already running on Proof of Stake. Perhaps the impact on scalability\
    \ on the Ethereum price has already become visible.\n\nThe example of EIP1559\
    \ and Ethereum 2.0 shows that the technology is developing rapidly and sometimes\
    \ fundamentally, and major changes are being introduced all the time.\n\nBesides\
    \ Polkadot and Cardano, there are many other projects that are very similar to\
    \ Ethereum or that aim to solve a specific Ethereum problem. Some examples are\
    \ NEO, Chainlink, NEM, and TEZOS .\n\n  ![](Image00082.jpg)![](Image00083.jpg)![](Image00084.jpg)![](Image00085.jpg)\n\
    \nFigure 58 Logo from left to right: Neo, Tezos, Chainlink, NEM\n\nThe question\
    \ remains whether these cryptocurrencies can become serious Ethereum competitors.\n\
    \nThe biggest Ethereum advantages are the large community, the large miner network\
    \ and the active users. Almost all DApps and DAO applications run on the Ethereum\
    \ blockchain.\n\nMany smaller coins, such as Polkadot or Cardano, have the chicken\
    \ and the egg problem. Very few customers use the network because it is not yet\
    \ widespread. At the same time, these projects rely on customers to scale the\
    \ network.\n\n7.  Practical introduction: Buying Bitcoin\n\nNext, we will take\
    \ a concrete look at how an end user can buy and sell cryptocurrencies, what they\
    \ should consider when storing their private keys and whether it makes sense to\
    \ invest in cryptocurrencies at all. At each step, we first look at the theoretical\
    \ background, but also at the concrete implementation.\n\nFirst, it is advisable\
    \ to get an overview of the market. For this we can use the well-known sites like\
    \ coinmarketcap.com.\n\nAfter we have gained an overview of the current market,\
    \ we create an address on the blockchain. For this, we need a private key.\n\n\
    7.1.         Wallet providers and crypto exchanges\n\nNow we turn to the question\
    \ of how we can concretely participate in the crypto market and exchange fiat\
    \ money for cryptocurrency.\n\nWe must always be aware that the blockchain, with\
    \ all its addresses and assets, is a closed system, similar to the stock market.\
    \ No euros or dollars exist in the Bitcoin network.\n\n![Picture 4](Image00003.jpg)The\
    \ price of a cryptocurrency is determined solely by supply and demand. Cryptocurrencies\
    \ live on the trust of investors. If the trust dwindles, the price falls.\n\n\
    The easiest way to get a Bitcoin is to barter directly. We first create a Bitcoin\
    \ address, find a person who owns Bitcoins and give them our fiat money in exchange\
    \ for them sending us Bitcoins to our address.               \n\n![](Image00086.jpg) \n\
    \nFigure 59 Direct exchange with a miner or other owner of Bitcoins\n\n![Picture\
    \ 4](Image00003.jpg)We do not buy bitcoins from the blockchain, but from a person\
    \ who sends us their bitcoins in fiat money for an agreed amount. This person\
    \ has previously mined the coins or bought them from miners.\n\nWe will have to\
    \ look for people who are already active in the crypto market and want to sell\
    \ their coins.\n\nThis is also cumbersome and no longer in keeping with the times.\
    \ Instead, an overseer, i.e. a kind of bank or stock exchange , is needed. We\
    \ need to trust this central entity. This has the advantage that we have an up-to-the-second\
    \ price and can trade almost in real time.\n\nThe best-known providers now turn\
    \ over billions of euros annually and have become stock corporations.\n\n![](Image00004.jpg)A\
    \ crypto exchange combines the fiat money system with the blockchain . You can\
    \ deposit your fiat money on these exchanges and then exchange it for cryptocurrencies.\
    \ They are the entry point, analogous to the stock market. A crypto exchange is\
    \ user-friendly and takes over the complete management of the users' private keys.\n\
    \n![](Image00087.jpg)\n\nFigure 60 Central exchange as exchange point from crypto\
    \ to fiat currencies\n\n![](Image00004.jpg)The entry point to buy cryptocurrencies\
    \ is mostly a central company. There, the applicable laws and regulations of the\
    \ relevant governments prevail. For example, we have to confirm our identity when\
    \ creating a user account, as well as when opening an account.\n\nThe market leaders\
    \ in the crypto exchange sector are the companies Binance, based in Malta, and\
    \ Coinbase , based in California, USA.\n\n![Binance Logo](Image00088.jpg)\n\n\
    Figure 61 Logo Binance\n\nCoinbase was founded in 2012 as a US company.\n\n![](Image00089.jpg)\n\
    \nFigure 62 Coinbase logo\n\nThe name Coinbase refers to the Coinbase transaction\
    \ . This is the name given to the first transaction that ever took place in a\
    \ blockchain.\n\nBoth companies have been established on the market for years\
    \ and are considered reputable and reliable. Other up-and-coming providers include\
    \ crypto exchanges such as eToro.\n\n![Über eToro: Die Geschichte der führenden\
    \ Social-Trading-Plattform](Image00090.jpg)\n\nFigure 63 Logo eToro\n\nTo participate\
    \ concretely in the market, we need to register with one of the many wallet providers.\
    \ To create an account, we need an email address and a password. We also need\
    \ to read and accept the terms of use.\n\n![](Image00091.jpg)       ![](Image00092.jpg)\n\
    \nFigure 64 Example of account creation using Binance [(](https://accounts.binance.com/de/register)\
    \ https://accounts.binance.com/de/register) and coinbase (https://www.coinbase.com/de/signup)\n\
    \nMore and more conventional stock exchanges, such as the Stuttgart Stock Exchange,\
    \ are also offering the purchase of cryptocurrencies.\n\nAll these platforms have\
    \ advantages and disadvantages. One advantage, for example, is the simple operation.\
    \ As a user, you don't have to worry about the private keys. The Exchange takes\
    \ over the administration and storage. It is often possible to log in using an\
    \ e-mail account and password. In addition, with these exchanges we have an account\
    \ for several cryptocurrencies at the same time. This way, if we want to buy Bitcoin\
    \ and Ethereum, for example, we don't have to open two different accounts.\n\n\
    After we have created an account, the next step is to verify ourselves, as if\
    \ we were opening a new bank account. Verification serves to prevent money laundering.\
    \ There are usually smaller allowances, up to a few hundred euros, which can be\
    \ deposited and exchanged for cryptocurrencies without verification. After successful\
    \ verification, we have to transfer fiat money, such as euros or dollars, from\
    \ a bank account to our account on the exchange. Often, other payment options\
    \ such as instant bank transfer or credit card are also possible."
