  trans: '

    为了防止这种情况，必须证明他以前没有挖过长度更长的区块链。但你如何证明某件事只存在了很短的时间呢？


    解决方案既简单又巧妙。中本聪（Satoshi Nakamoto）取了一份报纸的标题，并在第一个区块中写下了该标题的哈希值。这证明了区块链不太可能在标题出现之前就已经创建。否则，中本聪如何知道那个标题的呢？


    中本聪可以选取任何标题，但他刻意选择了一个与金融危机相关的象征性标题，从而突显了货币政策的问题。该标题来自 2009 年 1 月 3 日的《英国泰时报》。


    ![](img/Image00043.jpg)

    图 28 2009 年 1 月 3 日《泰时报》头版


    标题为《财政大臣处于对银行进行第二轮救助的边缘》的文章是关于当时的英国财政大臣阿利斯泰尔·达林（Alistair Darling）。他曾白白尝试刺激英国经济。通过选择这个标题，信息是显而易见的：旧系统已经失灵了，是时候采用新事物了。这是比特币的时代。


    ![](img/Image00044.jpg)

    图 29 比特币程序代码片段


    因此，该标题可以在比特币的源码（程序代码）中找到。它用于创建第一个哈希，形成了创世纪区块（Genesis block）的最早条目。在比特币爱好者中，这个标题广为人知。


    ## 4.1. 挖掘难度


    到目前为止我们看到的：当找到匹配的随机数（nonce）时，区块就被解决了，即当矿工找到了一个数字，该数字与交易数据恰恰找到了一个以特定数量零开头的哈希。


    然而，人们经常说每十分钟就会产生新区块。如果有多个矿工连接到网络，从而许多人都在挖掘并提供他们的算力，就能更快地找到合适的随机数。


    类比，我们可以想象解决一个谜题：


    如果有十个人尝试解决一个谜题，即使通过猜测，他们得到结果的速度也会比一个人快十倍。


    这只是事实的一半，因为如果谜题的复杂度增加了十倍，所需的时间仍然大约相同。


    当然，某人可能运气很好，偶然猜中了正确的数字。但随着时间的推移，这种现象会变得平均。


    如果我们根据玩家的数量来调整谜题的难度，解决谜题所需的时间保持不变。


    这一原则也被应用于比特币区块链中。


    当矿工找到匹配的随机数时，区块就会追加到区块链上。这种现象发生的频率取决于寻找匹配随机数的难度。为了调整难度，我们需要调整对随机数的限制或生成哈希的条件。


    如果我们规定生成的哈希不仅要以一个零开头，还必须以两个零开头，那么解决过程将变得困难得多。


    ![](img/Image00004.jpg)通过增加生成哈希的初始零的数量，寻找正确的随机数变得更加复杂。平均而言，解决区块所需的时间更长。


    这有另一个副作用：由于谜题自动变得更加困难，生成的哈希也包含了更多为了解决它而必须的算力或能量。这反过来意味着攻击者也需要更多的算力。通过增加谜题难度，网络变得更加安全！


    ![](img/Image00004.jpg) 连接到网络的人越多，网络中的算力就越高，寻找匹配随机数就越困难。因此，随着每一个参与者的加入，整个网络变得变得越来越安全。


    寻找匹配数字的复杂度被称为挖掘难度。挖掘难度每 2,016 个区块调整一次。这对应大约两周的时间。如果矿工需要超过两周来解决最后的 2,016 个区块，说明挖掘难度太高，因此会降低。相反，如果网络中的可用算力过多，且解决区块的时间于两周，则难度会增加。


    ## 4.2. 挖掘的经济方面


    每当矿工找到匹配的随机数时，区块就会追加到区块链上。每个区块都会奖励给找到正确随机数的矿工 6.5 个比特币。这种激励吸引了那些想要通过挖掘赚钱的人。如果网络中的可用算力过多，且解决区块的时间少于两周，则难度会增加。这使得攻击者也需要更多的算力。这种去中心化在比特币上是成立的，除非攻击者拥有超过
    51% 的算力。


    ![](img/Image0045.jpg)

    图 30 比特币挖掘难度的历史发展

    来源 https://bitcoinmagazine.com/business/introducing-a-new-way-to-measure-bitcoin-network-consumption


    与此同时，比特币挖掘的规模已经达到了这种程度，专门的设备（ASIC miners）出现了。


    ![](img/Image00046.jpg)公司创建了复杂的电路，即所谓的 `ASIC 矿机`，它们比任何高级计算机更有效地计算 `SHA256` 算法。例如，最新型号
    `Antminer S19 Pro` 每秒可以进行 110 万亿次计算![](img/Image0047.jpg)

    图 31 比特币 Antminer S19 Pro


    最初的去中心化想法——即每个人用自己的电脑就可以作为矿工——已经不再可行。


    位于中国的大型矿场有时占总算力的 25% 以上。


    然而，自比特币诞生以来，也可以观察到总算力不断增加，算力的分布也是如此。尽管如此，如果一个人积累了过多的算力，将是致命。


    ![](img/Image00046.jpg)如果一个人或一组人能够聚集绝对多数的算力，51% 攻击的风险就是可能的。


    ## 4.3. 51% 攻击


    `51% 攻击`或`51% 攻击`意味着一组矿工可以完全控制网络。


    如果一个群体拥有网络 51% 或以上的总算力，他们就可以自由决定新兴区块链的规则。他们可以确认或拒绝交易，甚至进行双重花费。


    这是因为 51% 在绝对意义上是最大的算力。这使得矿工能够最快地找到所需的 `nonce`。


    '
