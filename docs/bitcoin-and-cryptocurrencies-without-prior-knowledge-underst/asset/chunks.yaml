  trans: '


    # 以太坊概览


    基金会是一个社区，与公司不同，他们不（不必）盈利，而是免费地致力于一个项目，在本例中为以太坊网络的开发。当然，开发者会从他们的工作中间接盈利，因为所有开发者自己也持有以太币，因此从价格上涨和以太坊知名度的提高中获利。


    开发者们不断进行改进。改进提案，即所谓的 `EIPs`（以太坊改进提案），在与社区协商后定期提出并实施。


    ![](img/Image00004.jpg)


    以太坊以太坊（`ETH`）为单位。正如比特币可以分为 `mBTC` 或 `Satoshi`，以太坊也可以分为更小的单位 `Wei`。十亿 `Wei` 组成一个
    `Giga-Wei`（即 `Gwei`），十亿 `Gwei` 组成一个 `ETH`。


    ![](img/Image00068.jpg)


    ## 技术细节


    以太坊也使用工作量证明算法。这意味着交易由去中心化的矿工确认，并且必须使用计算力。然而，以太坊的区块时长仅为约 13 秒。作为参考，比特币需要十分钟。此外，以太坊没有使用
    `SHA256` 算法来保护区块链，而是使用 `ETHash` 算法。这种算法可以通过图形处理器高效计算。其背后的想法是，显卡通常比处理器更强大，因此网络可以获得更多的计算力和更高的安全性。此外，这还为了抵消
    `ASICs` 导致的计算力中心化。


    ![](img/Image00004.jpg)以太坊与比特币不同，它是无限的。每个区块都会向矿工分发两个新的以太。在这个过程中，数量并没有减少。因此，以太坊是一个通胀系统。


    ## Gas 与费用


    如果我们想发送以太坊交易，我们必须支付 `gas` 费用。`gas` 的价格以 `Gwei` 为单位。对于新手中来说，这些术语往往让人困惑。`Gwei` 和以太坊（`ETH`）一样是以太坊的货币。


    我们可以将 `gas` 视为交易的燃料。我们越快想确认交易，需要的燃料就越多，需要购买的 `Gwei` 也越多。


    如果交易变得更大或更复杂，我们相应地需要更多 `gas`。通常 `21,000-40,000` `gas` 就足够完成一次交易。我们经常手动设置想要使用的
    `gas` 最大量。


    ![](img/Image00004.jpg)以太坊和比特币一样，是一个最高出价系统。支付最多费用（`gas`）的交易会被优先处理。系统只会使用必要的 `gas`。剩余部分将退回我们的账户。


    ![](img/Image00069.jpg)


    图 47 以太坊交易的费用计算示例


    示例：我们想发送一个 `ETH`。在编写时，快速交易的 gas 价格为 134 `Gwei`。我们将最大 gas 消耗设置为 `21,000` `gas`。这导致最高交易费用为
    ![](img/Image00070.jpg)。为了得到以太坊和美元的金额，我们需要将 `Gwei` 转换为 `ETH`。为此此，我们需要除以 10 亿。![](img/Image00071.jpg)。


    在 `ETH` 汇率为 `1,900` `USD` 的情况下，这产生的交易费用约为 `5.27` `USD`，即 `5.27`。


