    9.3.         Bitcoin can be hacked


    The next argument that Bitcoin is worthless is that it only takes one attack by
    a hacker to destroy all the trust that Bitcoin has built up over the last few
    years. In principle, this is completely correct, but the thesis is wrongly formulated.
    Nevertheless, the media and high-ranking celebrities keep spreading it.


    "Cyber Theft


    Blockchain hackers have stolen more than US$13.6 billion".


    Source: [https://www.internetworld.de/sonstiges/bitcoin/blockchain-hacker-13-6-milliarden-us-dollar-gestohlen-2600349.html](https://www.internetworld.de/sonstiges/bitcoin/blockchain-hacker-13-6-milliarden-us-dollar-gestohlen-2600349.html)


    We have seen that it is virtually impossible to guess someone else''s private
    key, but how secure is the blockchain itself? After all, we keep reading that
    Bitcoin has been hacked and billions of dollars in assets have been stolen.


    The blockchain is a decentralised system, which means that there is no central
    point of reference that hackers can use, unlike in a safe deposit box, a bank
    branch or a checkout in a supermarket. When there is talk of "hacked Bitcoin accounts,"
    it is usually the private key that has been stolen, for example because it was
    unprotected on the PC and the person concerned caught a virus. There are also
    known cases of people being blackmailed into handing over their private key.


    Another scam is insecure or fraudulent wallets that pretend to generate a random
    private key but store it themselves and thus have access to the account. For this
    reason, it is extremely important to use a secure, proven provider.


    The last way Bitcoin has been "hacked" so far is that a central institution, such
    as an exchange, has been hacked. The servers were hacked and the private keys
    stolen, as was the case with the Mt.Gox hack of 2013.


    ![](Image00004.jpg)The blockchain technology behind Bitcoin has nothing whatsoever
    to do with all these facts. They are always central points of attack that a hacker
    can exploit, be it a crypto exchange or a private PC.


    Therefore, we should never leave coins lying around unnecessarily on an exchange
    platform (especially if larger sums are involved), but always send them to our
    address, of which only we have the private key. After all, otherwise the control
    lies with a central institution again.


    The principle is: " Not your key - not your coins ".


    Technically, the blockchain is not hackable.


    To hack Bitcoin, proven principles such as the elliptic curve or the SHA256 algorithm
    would have to be hacked. This is considered practically impossible. Credit card
    companies or government institutions like the US military also rely on these techniques.
    The SHA256 algorithm has been considered unhackable for 20 years.


    Having cleared up this myth, let''s look at the next aspect, which is often completely
    misinterpreted.


    9.4.         Bitcoin is inefficient


    Bitcoin can currently write about seven to eight transactions per second to the
    blockchain. In comparison, payment providers such as Visa or Master Card make
    several 10,000 transactions per second.


    The conclusion: Bitcoin is inefficient! Huge amounts of electricity and resources
    have to be spent to be able to carry out a few transactions.


    These are valid objections, but when we hear these arguments, we know that the
    speaker has not studied Bitcoin technology or understood the meaning of Bitcoin.


    To do this, we first need to understand what efficiency means in the first place.
    Because why does Bitcoin need so much electricity? Where does all the "consumed"
    energy go?


    Contrary to common understanding, it does not mean that we convert electrical
    energy into transactions. That was never the primary goal of Bitcoin. A central
    entity like a bank is many times more efficient in terms of this comparison.


    ![](Image00004.jpg)Bitcoin was created to establish a decentralised, secure system
    that is unassailable and in which no participant can be blocked or censored by
    a central authority. Complex mathematical algorithms are calculated through mining.
    The results are stored in the blockchain. The more energy is used, the more difficult
    it is to solve the algorithms and the more secure the network becomes.


    Bitcoin converts the lowest level of life, energy, into security. Mining is the
    most efficient way to generate decentralised security. With all other consensus
    methods like Proof of Stake, the electricity is wasted. With mining, it flows
    100% into security.


    As more miners connect to the network and more energy is consumed, the nonce requirements
    adjust using the Mining Difficulty. It automatically becomes more difficult to
    solve a block. This means that the result—the verified block—is all the more secure.
    An attacker would have to put more energy into the system to "crack" the blockchain
    in the form of a 51% attack.


    We also see that there is no other cryptocurrency and no other consensus algorithm
    that can guarantee this security.


    As an example, let''s take Ethereum, which can guarantee significantly more transactions.
    A block does not take ten minutes, but only ten to twenty seconds. Is it therefore
    more efficient? If we take the pure energy per transaction as a yardstick, then:
    definitely. But as we have seen, that was and is never the goal of Bitcoin.


    ![](Image00004.jpg)Bitcoin was deliberately created to be slow and sluggish because
    this is the only way to ensure optimal security.


    The fact that Bitcoin''s blocks are smaller and slower means that more computing
    power is required. This in turn means that more security is created for the same
    number of blocks/transactions.


    It is also often argued that the technology is outdated and that there are much
    better, newer and faster cryptocurrencies. These can handle many more transactions
    and still support great features at the same time. This is also a misconception.


    ![](Image00114.jpg)


    Figure 81 Crypto trilemma


    As always in life, in cryptography we have to make a trade-off of centrality,
    security, speed and much more. It is not a dilemma where one has to determine
    a compromise between two things, but a trilemma . In the trilemma of decentralisation,
    one cannot achieve at least one of the three goals (decentralisation, security
    and speed).


    ![](Image00004.jpg)Some altcoins are significantly more centralised than Bitcoin
    and can carry out significantly more transactions per second. They are therefore
    not more modern, do not have better technology or are not superior to Bitcoin
    in any other way. They have merely opted for a different compromise.


    Once you understand the point of a decentralised, indestructible store of value,
    you realise that Bitcoin is neither obsolete nor inefficient.


    And although Bitcoin was deliberately built to be slow and sluggish, it can still
    be used as a means of payment. We''ll get to the bottom of the payment myth next.


    9.5.         Bitcoin is unsuitable as a means of payment


    The next point has many overlaps with the previous point that Bitcoin is inefficient.
    Due to the fact that Bitcoin is still very slow with currently seven to eight
    transactions per second, the myth arises that Bitcoin can never establish itself
    as a means of payment.


    ![Bitcoin, Europa, Geld, Finanzen, Münzen, Euro, Btc](Image00115.jpg)


    Figure 82 Bitcoin as a physical means of payment conceivable?


    That is absolutely correct. We have already seen that the intention was never
    to enable as many transactions as possible on the blockchain, but to make the
    existing ones as secure as possible! Bitcoin is unassailable. No state or conglomerate
    in the world can take over this network.


    And yet, through technical advancement, it is possible to use Bitcoin as a means
    of payment and still maintain core security.


    There are already technical solutions, for example by compressing the size of
    the transactions and thus putting more transactions into a block, for example
    through an extension called Segwit .'
