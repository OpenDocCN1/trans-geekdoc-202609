    inhibitions.

    +   2. Factors Dataset: It contains 1500 compounds with 12 serine protease inhibitions.

    +   3. Kinase Dataset: It contains 2500 compounds with 99 protein kinases inhibition.

    +   4. UV Dataset: It contains 10,000 compounds with 190 wavelengths.


