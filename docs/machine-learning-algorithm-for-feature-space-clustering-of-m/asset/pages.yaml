    I_{lo}^{NF})). (62) Finally, according to the impact of mixed data I_p to be chosen
    as a clustering kernel argument is computed by, Imp(I_p) = Imp(I_p^{CF}) + Imp(I_p^{NF}).
    (63) Imp(I_p) = (1 - 1/F_c sum_{q=1}^{F_c} CLO(I_{pq}^{CF}, KA)) + (1/F_c sum_{q=1}^{F_c}
    CLO(I_{pq}^{CF}, χ)) + min_{1 <= q <= n} ECM(I_p^{NF}, β_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF}) + (1 - min_{1 <= q <= k} ECM(I_p^{NF}, C_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF})). (64) More specifically, when choosing the initial kernel argument
    which is an empty group, the closeness among the I_p and χ should be evaluated.
    That is, the initial kernel argument β_1 is designated based on, β_1 = argmax_{I_p
    ∈ χ} [CLO(I_p^{CF}, χ) + CLO(I_p^{NF}, χ)] (65) Moreover, the process of the initialization
    adaptation approach for mixed features can be summarized in Table 7. The time
    complexity of the proposed method is better than existing algorithms. Subsequently,
    the proposed algorithm will not cost for extensive calculation.


