    # 7.1. Experiments on molecular datasets


    The proposed algorithm gives a way for a better understanding of chemical structures
    and their relationship. Compounds retrieved from database were characterized by
    the chemical substructure fragments. The presence and absence of particular substructure
    fragments were used to create a chemical fingerprint for similarity comparison.
    Given known compound properties, the chemical features can be used to train deep
    learning models for compound property predictions. Visualization of the clustering
    process is illustrated in Fig. 15. Four collections of assays from MSD (Merk &
    Co., Inc., Kenilworth, NJ U.S.A) are depicted in Table 8. The clustering performance
    in terms of ACC, RI, and NMI of different algorithms of molecular datasets is
    depicted in Table 9. The results are visualized in Fig. 16, Fig. 17, and Fig.
    18.


