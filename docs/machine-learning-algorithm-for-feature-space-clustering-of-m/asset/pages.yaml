    # 6. Initialization adaptation approach


    In general, in most of the existing methodologies, we need to initialize the number
    of clusters. However, dynamic initialization is the informal and typical method.
    Due to the uncertainty of the initialization of instances, the clustering conclusions
    are unequal. To calculate the competence of a method, we need to iteratively run
    the algorithm with frequent initialization values to acquire statistic facts.
    This concern can be more difficult in the feature subspace clustering process.
    The clustering effect reduces through unfortunate initialization of clusters.
    Hence, the training of feature weight in a cluster will fabricate. Most of the
    existing algorithms such as [94-99] are presented to solve this issue. However,
    initialization for mixed features is very less and not yet powerful.


    Generally, if we need to get a better outcome of the clustering process, we frequently
    believe that the variation among the primary kernel instances is high, hence that
    they are further probable from dissimilar groups. However, if we simply search
    for a sophisticated divergence, approximately outliers that ensure the undesirable
    impact on the clustering progression may be chosen. Consequently, when we evaluate
    the significance of an instance to be nominated as a primary kernel argument,
    we must instantaneously deliberate two features: the divergence among this instance
    and the previously nominated kernel arguments and also the closeness between this
    instance and the complete data set.


    Let KA = {β1, β2, ..., βn} be the kernel arguments that have been previously nominated,
    where n < k, and k is the required number of kernel arguments. Likewise, every
    distinct β_v (v ∈ {1,2,...,n}) can be defined as [β_v^CF, β_v^NF]^T where β_v^CF
    represents the numerical features and β_v^NF represents the categorical features.


    In the assortment procedure, if we need to pick an additional kernel argument
    and add it to KA, we must initially evaluate the choice of impact for each instance
    in the dataset and then choose the one through the highest impact. Let Imp(I_p)
    represents the choice of the impact of instance I_p. Subsequently, I_p consists
    of both the numerical and categorical features, Imp(I_p) can be determined as
    Imp(I_p) = Imp(I_p^CF) + Imp(I_p^NF). (51)


    Therefore, given the approximation of Imp(I_p^CF) and (I_p^NF), we can develop
    the impact of I_p.


    Initially, to develop the impact of I_p^CF, we must evaluate the divergence among
    I_p^CF and KA along with the closeness measure among I_p^CF and χ. The instance-cluster
    closeness measure for categorical features can be used to compute the instance
    group. Hence, related to (26) and (27), the closeness among I_p^CF and KA can
    be computed by CLO(I_p^CF, KA) = 1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF, KA). (52)


    Also, the closeness measure among I_p^CF and χ is represented as, CLO(I_p^CF,
    χ) = 1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF, χ). (53)


    Moreover, the impact of I_pq^CF can be calculated by Imp(I_p^CF) = DIV(I_p^CF,
    KA) + CLO(I_p^CF, χ) = (1 - CLO(I_p^CF, KA)) + CLO(I_p^CF, χ). (54) Imp(I_p^CF)
    = (1 - 1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF, KA)) + (1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF,
    χ)). (55)'
