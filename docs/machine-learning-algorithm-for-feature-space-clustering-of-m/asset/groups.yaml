    设 χ 表示训练向量 χ ≡ {I₁, I₂, …, I_N} 的一个广泛集合，分为 K 个不相交的组，其中 I_f ∈ R^N，使得


    ## 表 4

    ### 混合数据集插补 (MDI) 算法。

    混合数据集插补 (MDI) 算法


    输入：

    𝒳 = (I₁, I₂, ..., I_N)：一个具有缺失信息的混合数据集

    输出：

    一个具有完整信息的混合数据集 𝒳

    算法：

