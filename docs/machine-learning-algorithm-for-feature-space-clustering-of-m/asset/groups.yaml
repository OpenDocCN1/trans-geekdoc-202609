    I_q^v estimated by a kernel orientation approach using equation (5) and is well-defined
    as:


    y_q^v = [P_q^v(I_{1q}^v), P_q^v(I_{2q}^v), ..., P_q^v(I_{|I_q|}^v)] . (8)


    The significance of each categorical feature I_{pq}^v (1 ≤ p ≤ |I_q^v|) is computed
    through equations (4), (5), and (6) as follows:


    P_q^v(I_{pq}^v) = { θ_v 1/|I_q^v| + (1 - θ_v) RR_v(I_{pq}^v) if I_{pq}^v ∈ I_q^v
    ; 0 otherwise } . (9)


