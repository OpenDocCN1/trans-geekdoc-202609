    # 7.4. The complexity of the proposed algorithm


    The complexity of both the FSCMMI algorithm & RP-FSCMMI algorithm is O(TkFN),
    where T is the number of training steps, k is the total number of clusters, F
    is the total number of features and N is the number of instances. The time complexity
    of the IA-FSCMMI algorithm is O(kNF + (1/2)k²NF_NF), where k is the total number
    of clusters, F is the total number of features, F_NF is the number of numerical
    features and N is the number of instances. The space complexity of all the three
    algorithms requires O(k(F_NF + N + FM - F_NF M) + FN) where k is the number of
    clusters, F is the total number of features, F_NF are the numerical features,
    M is the maximal categories, and N is the number of data instances.


