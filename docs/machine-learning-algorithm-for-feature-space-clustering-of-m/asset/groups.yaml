    CLIQUE [27]。首先，它将空间划分为可比较位置网格上的不可区分的度量实体。因此，只有包含可量化程度的典型证据的基本要素才被视为压缩，聚类可以通过逐步分组相应的压缩特征来揭示。


    CLIQUE 方法的扩展是 ENCLUS [28]，它提供了对特征空间感知的认识，该感知用于缓解具有不足聚类效果的特征空间。通常，特征空间感知被定义为特征空间中三种有意义组合的结果，即，大信息披露、极高密度和伴随可能性。经过普通组合的特征空间将具有较低的熵，并将被选中以实现分组。此外，CLIQUE
    的扩展是 MAFIA 聚类方法 [29,80]，它在每个分区中达到适应性和不一致的维度情况。这些情况在确定多特征空间中的聚类时是相互关联的，采用生成-测试安排。改变组织的分辨率使
    MAFIA 方法能够缓解时间复杂性并扩展聚类突出性。此外，nCluster [34] 是 CLIQUE 的一种特殊方案，它采用更灵活的结构来分配层级，并允许一个分量的各种情况之间具有相似性。通过这种结构，效果可能在明显额外的情况下会显著；只有理想的
    delta-nClusters 才会被挖掘，以避免生成极多的组。总体而言，这些基于网格的方法的完善性和能力通常由布局的粒度级和顺序决定。更好的网格组织将产生更好的聚类结果，但会提高计算速率。网格构造的一种特殊解决方案是
    SUBCLU 方法 [81]，它依赖于与密度相关的集合，并使用 DBSCAN [82] 在特征空间中搜索组。这使 SUBCLU 能够以随意系统和度量找到组。然而，SUBCLU
    的效率非常高，这限制了其可能性 [83]。


    ### 2.2.2. 软特征空间聚类


    与区分特定特征空间的硬特征空间聚类相比；软特征空间聚类主要为所有特征分配权重向量，以衡量其在各种组扩展中的关联。通常，特征加权分组方法的扩展 [54,84,85]
    是软特征空间聚类，它仅执行单一权重级别以调整特征对整体聚类结构的贡献 [45]。最近，合作探索反应对软特征空间聚类表现出热情，并且在 [69] 和 [86]
    中引入了各种系统。实际上，许多方法都是基于 k-means 型结构中权重向量的增强而构建的。例如，LAC [38] 方案根据对应聚类中各种幅度附近数据的内部关系，将占据负载分配给特征。通常，每个特征的负担是根据每个分量之间聚类间接近度数量的通常原则计算的。[36]
    中介绍了一种新方法，使得复杂的权重向量赋予聚类的压缩特征，其中相关程度之间的计算相似性小于所有程度之间通常计算的相似性。然而，[39,40] 和 [87]
    中的系统已利用熵的知识用于特征权重向量，并引入了熵模式，使得集合中特征的质量被认为是该点在产生集合中的影响前景。然而，大多数方法利用类内证据来计算特征权重向量标准；Deng
    等 [86] 提出了一种改进的方法，该方法结合了类内密度和类间分离，以开发一种创新的模糊解释。


    此外，所有上述软特征空间聚类系统仅适用于数值类型。此外，Chen 等 [88] 提出了一种常见系统，该系统采用互 k-means 系统的过程来计算特征加权相似度度量。因此，如果使用
    Hamming 距离 [89] 来衡量分类类型之间的接近度，则特殊特征空间聚类过程也可以通过利用 k-modes 系统 [90] 和 k-prototypes
    [16] 系统的方案而有利于分类和混合类型。然而，由于分类数据之间的接近度度量被限制为 0 或 1，并且特征原则是用类内接近度度量定义的，分类类型的权重含义有过度可能为
    0 或 1，并且这种感知在聚类任务的评估操作点上不会合理。因此，Bai 等 [45] 和 Cao 等 [46] 提出了 k-modes 过程的其他特征增量结构，以在分类类型上统一软特征空间聚类。然而，混合类型尚未被他们重视。


