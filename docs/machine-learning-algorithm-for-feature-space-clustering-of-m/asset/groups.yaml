    为了实现特征子空间聚类算法，将预先设计一种重复方法以增强目标函数 [20]。特征权重 W_{qv} 的值在每次训练步骤后更新。开始时，特征权重向量值设为 W_{qv}
    = (1/F)，其中 q = 1,2,...,F，且 v = 1,2,...,K。我们分析了所提出的算法能快速收敛到更好的精度。表 4 显示了混合数据插补算法。具有缺失信息的混合数据集的特征空间聚类（FSCMMI）算法在表
    5 中描述。图 4 显示了混合数据缺失信息特征空间聚类计算的示意图。图 5 显示了 I_6^{CF} 中缺失特征 F_4^{CF} 的树。图 6 显示了 I_8^{CF}
    中缺失特征 F_3^{CF} 的树。图 7 显示了 I_8^{CF} 中缺失特征 F_4^{CF} 的树。


    ## 5. 训练簇数


    与现有的极端特征子空间聚类方法不同，所提出系统要求簇数 k 正确固定以匹配合适的数量；否则将得出不合适的聚类结论。


    为了解释这一问题，我们估计了具有自动训练簇数能力的特征加权实例-簇接近度度量过程。惩罚过程已在 [51] 中得到证明，主要用于通过逐步淘汰闲置簇来帮助该过程在训练方法中自动指示簇数。因此，我们使用该惩罚过程来解决自动选择簇数的问题。


    此外，一组权重将与目标函数一起呈现， resulting objective function is denoted as,


    ![](img/4e39085eb98826467f01a93fc8260e3b_16_0.png)

