    ## 摘要


    聚类算法因其强大的能力在机器学习应用中受到了极大的关注。尽管如此，现有的算法仍存在一些需要进一步解决的问题。例如，大多数现有算法将一种类型的特征转换为另一种类型，这忽略了信息的显式属性。此外，大多数算法都考虑全部特征，这可能导致计算困难并产生次优性能。为解决上述困难，本文提出了一种基于缺失信息混合数据特征空间聚类的分类和数值特征聚类新技术（FSCMMI）。该过程包含三个阶段。最初，FSCMMI根据实例和特征类型中的缺失信息对给定数据集进行划分。第二阶段使用决策树过程来识别实例之间的关联。最后，第三阶段用于计算数值特征和分类特征的接近度度量。同时，我们提出了一种新的训练算法来聚类混合数据集。基准数据集上的大量实验结果表明，所提出的
    FSCMMI 在准确性和效率方面优于几种最先进的聚类方法。


    ## 1. 引言


    由于能够在无监督学习环境中智能地从数据中发现有用信息，聚类被视为数据挖掘领域中的重要过程，并已广泛应用于化学信息学、生物信息学等多种科学领域 [1-6]。因此，经常提出一些聚类方法来解决不同领域中的复杂和现实世界问题。


    总体而言，与监督学习中分类的发展 [7-9] 相比，聚类研究要求数据实例由一组相关特征描述，这些特征描述了对学习任务有用的实例属性。随着聚类需求的不断增加，出现了两个主要挑战。第一，大多数现有聚类方法仅接受数值形式的<|message|>
    特征 [10-13]。然而，由于需要从健康、商业、工业和公共部门收集全面的测量数据，我们通常需要处理来自性别、血压、血糖水平和疾病类型等最小值的不常规名义特征
    [13]。在现有聚类过程中，此类特征被称为分类特征。因此，同时包含数值和分类特征的数据称为混合特征。


    为解决混合特征问题，最直接的方法是将一种类型的特征转换为另一种类型。即要么通过离散化过程将数值系统转换为分类系统，要么通过编码过程将分类系统转换为数值系统。尽管如此，转换结构会丢失原始特征值中包含的相似性信息，因此无法准确揭示数据集的结构
    [13,14]。此外，研究人员已广泛研究了混合数据聚类研究的最新流程，并在 [13] 和 [15-20] 中提出了一些流程。然而，由于所有这些流程在聚类实践中以相同方式处理信息，它们造成了额外的问题，即无关特征可能对从实际数据中发现真实聚类的贡献不同。例如，如果我们旨在按疾病类型对患者进行分组，性别数据在不同条件下将是一个重要特征，尽管对其他条件不重要。更准确地说，特征空间聚类是解决此问题的有希望的方法
    [21]。


    这种聚类系统旨在根据数据的特征空间而不是整个数据集将数据实例划分为聚类。尽管诸如降维等智能系统导致相关度量，但在特征空间聚类中，通常从不同的特征子集学习多个聚类。实际上，如果聚类过程中实际数据集非常大，则预处理阶段用于使用降维方法减少实例的维度
    [22-26]。


    使用降维增强了特征空间聚类过程中的星座效应。根据稳定的若干组方法，特征空间聚类实践可分为两组。首先，使用硬特征空间聚类算法来搜索真实聚类的实际特征子集。标准形式包括
    [27-34]。第二类是软特征空间聚类，它从完整数据集中训练数据集，但在聚类过程中为每个特征分配不同的权重以控制其对发现不同聚类的影响。经典方法建议在 [35-40]
    中。尽管如此，上述所有特征空间聚类过程都仅用于对数值类型进行分组，这限制了存在分类类型的实际应用。同样，很少有前人研究关注仅具有分类特征的实例的特征空间聚类。一个例子包含
    [41-44] 中提出的分类特征的硬特征空间聚类算法和 [45-47] 中提出的软特征空间算法。相反，混合特征的特征空间聚类研究范围仍然有限。


    更准确地说，几乎所有现有聚类方法都需要输入聚类数。不幸的是，从应用角度来看，这种重要信息并不总是可用的。因此，如何在不知道实际聚类数的情况下执行聚类任务也是聚类领域中的重要问题
    [48]。为解决这一困难，已经提出了许多方法，可以估计数值或分类实例的聚类数 [49-53]。然而，如何在聚类期间自动选择混合特征的聚类数很少被考虑。此外，由于最大的特征子组和聚类数相结合，该问题在特征空间聚类中变得更加复杂，即不同的聚类结果影响不同的特征子组
    [54]。


