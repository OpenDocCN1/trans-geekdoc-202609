    ## 6. 初始化自适应方法


    一般而言，在大多数现有方法中，我们需要初始化簇数。然而，动态初始化是非正式且典型的方法。由于实例初始化的不确定性，聚类结论不相等。为了计算一种方法的性能，我们需要使用频繁的初始化值迭代运行算法以获取统计事实。这一问题在特征子空间聚类过程中可能更困难。通过不幸的簇初始化，聚类效果降低。因此，簇中特征权重的训练将被制造。许多现有算法如
    [94-99] 被提出以解决此问题。然而，混合特征的初始化非常少且尚未强大。


    一般来说，如果我们需要获得更好的聚类过程结果，我们通常认为主要核实例之间的变化很高，因此它们更可能来自不同的组。然而，如果我们简单地寻找复杂的差异，大约会选择确保对聚类进展产生不良影响的异常值。因此，当我们评估一个实例被提名为主要核参数的重要性时，我们必须立即考虑两个特征：该实例与先前提名的核参数之间的差异，以及该实例与完整数据集之间的接近度。


    设 KA = {β1, β2, ..., βn} 为先前提名的核参数，其中 n < k，且 k 为所需的核参数数量。同样，每个不同的 β_v (v ∈ {1,2,...,n})
    可定义为 [β_v^CF, β_v^NF]^T，其中 β_v^CF 表示数值特征，β_v^NF 表示类别特征。


    在挑选程序中，如果我们需要挑选一个额外的核参数并将其添加到 KA，我们必须首先评估数据集中每个实例的影响选择，然后选择影响最高的一个。设 Imp(I_p)
    表示实例 I_p 的影响选择。随后，I_p 包含数值和类别特征，Imp(I_p) 可确定为 Imp(I_p) = Imp(I_p^CF) + Imp(I_p^NF)。(51)


    因此，给定 Imp(I_p^CF) 和 (I_p^NF) 的近似值，我们可以开发 I_p 的影响。


    首先，为了开发 I_p^CF 的影响，我们必须评估 I_p^CF 与 KA 之间的差异以及 I_p^CF 与 χ 之间的接近度度量。类别特征的实例-簇接近度度量可用于计算实例组。因此，相关于
    (26) 和 (27)，I_p^CF 与 KA 之间的接近度可通过 CLO(I_p^CF, KA) = 1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF,
    KA) 计算。(52)


    此外，I_p^CF 与 χ 之间的接近度度量表示为 CLO(I_p^CF, χ) = 1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF, χ)。(53)


    此外，I_pq^CF 的影响可通过 Imp(I_p^CF) = DIV(I_p^CF, KA) + CLO(I_p^CF, χ) = (1 - CLO(I_p^CF,
    KA)) + CLO(I_p^CF, χ) 计算。(54) Imp(I_p^CF) = (1 - 1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF,
    KA)) + (1/F_c Σ_{q=1}^{F_c} CLO(I_pq^CF, χ))。(55)

