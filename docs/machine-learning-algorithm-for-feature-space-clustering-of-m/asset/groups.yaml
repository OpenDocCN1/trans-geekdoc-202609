    ## 8. 结论


    在本文中，我们提出了一种新颖的聚类过程，利用缺失信息的优势来增强聚类结果的特征。最初，所提出的算法根据实例和特征类型中的缺失信息对给定数据集进行划分。此外，该算法使用决策树程序来识别实例之间的关联。我们提出了一种基于实例聚类接近度度量原型、针对缺失信息准备的特征加权聚类过程，可用于特征空间聚类。该过程适用于具有缺失信息的三种不同类型的特征：例如纯数值特征、纯分类特征或混合数据特征。针对混合特征提出了一种创新的特征加权组织，该组织在统一度量上达成一致，以计算不同分类或数值特征对每个聚类检测的影响。该加权结构是主要结构，同时反映了基于似然分布模型构建的各种类型的聚类特征能力和类内密度。我们在建议的分组过程中引入了一种显著的基于惩罚竞争的过程。显著的惩罚竞争过程用于自动计算聚类数量。随后，引入了一种以初始化为导向的程序，该程序有利于混合类型、数值或分类类型。这种分类可以提高
    k-means 型聚类系统在各种类型数据集上的稳健性和准确性。我们证明了我们的算法在基准数据集上实现了与最先进方法相当甚至更好的性能。


