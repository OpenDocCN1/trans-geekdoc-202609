    φ* = argmax_{φ,W} [ Σ_{v=1}^{K} Σ_{p=1}^{N} Z_{pv} g_v CLO_W(I_p, C_v) ] . (44)


    G = argmax_{1 ≤ v ≤ k} [ g_v CLO_W(I_p, C_v) ] (45)


    其中 g_v 是组 C_v 的权重，v = 1, 2, ..., K，满足条件 0 ≤ g_v ≤ 1。簇 C_v 对整个数据集的基本信息借助 g_v 计算。


    更具体地说，由于上述标准，部分实例将无法获得训练而“死亡”。为克服此问题，可以降低实例的获胜可能性。


    惩罚增长背后的重要统计是，对于实例 I_p 的每次参与，获胜簇以及与获胜簇相关的挑战簇（即亚军）也会根据明确标准受到批评。根据该惩罚过程，簇数 k 的初始化应始终满足水平（k
    ≥ k*），并且必要的持续性是移除闲置簇。因此，权重被分配给我们算法的每个簇。每个簇的后果是根据整个簇关联的该权重计算的。更精确地说，每个簇具有相等权重意味着它们在簇关系中的参与是不可区分的。相反，对于权重较低的任何簇，分配给该簇的实例数量将下降，最终该簇将从组织中变得无动于衷。


    因此，式（45）可修改为，


    G = argmax_{1 ≤ v ≤ k} [ (1 - δ_v) g_v CLO_W(I_p, C_v) ] (46)


    然后，给定实例 I_p，获胜簇 C_v 应满足以下标准：


    δ_v 的相对频率定义为


    δ_v = WT_v / Σ_{i=1}^{k} WT_i . (47)


    其中 WT_v 是簇 C_v 在先前过程中获胜的次数。


    同时，其相邻竞争簇 G_AC 定义为：


    AC = argmin_{1 ≤ v ≤ k, v ≠ G} [ (1 - δ_v) g_v CLO_W(I_p, C_v) ] (48)


    在选择簇的获胜者后，我们需要将实例分配给获胜簇，并修改获胜簇的统计观察以及获胜簇的复发率。


