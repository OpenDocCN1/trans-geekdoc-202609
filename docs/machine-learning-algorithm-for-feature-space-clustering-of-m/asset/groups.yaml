    ## 7.4. 拟议算法的复杂度


    FSCMMI 算法和 RP-FSCMMI 算法的复杂度均为 O(TkFN)，其中 T 是训练步数，k 是聚类总数，F 是特征总数，N 是实例数。IA-FSCMMI
    算法的时间复杂度为 O(kNF + (1/2)k²NF_NF)，其中 k 是聚类总数，F 是特征总数，F_NF 是数值特征的数量，N 是实例数。所有三种算法的空间复杂度均为
    O(k(F_NF + N + FM - F_NF M) + FN)，其中 k 是聚类数，F 是特征总数，F_NF 为数值特征，M 为最大类别数，N 为数据实例数。


