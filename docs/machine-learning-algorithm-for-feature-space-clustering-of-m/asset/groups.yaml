    ## Definition 7: Closeness between two categories

    The closeness between A and B is computed by the number of facts desirable to
    state the unity of A and B and the statistics needed to completely define what
    A and B are. In general, the closeness among A and B is determined as:


    CLO(A,B) = log P(common(A,B)) / log P(description(A,B)), (10)


    where P(s) is the probability of a statement, and the information contained in
    s is computed by [-log P(s)].


    Let there be two clusters I_{pq} and I''_{pq} taking place in two instances I_p
    and I_p'' at the q^th feature. The closeness amongst the clusters is symbolized
    and well-defined as:


    CLO_q(I_{pq}, I''_{pq}) = 2 log RR(I_{pq}, I''_{pq}) / (log RR(I_{pq}) + log RR(I''_{pq})).
    (11)


    and recurrence relation is defined as:


    RR(I_{pq}, I''_{pq}) = # (I_{pq}, I''_{pq}) / |X_CAT| , (12)


    ## Example 5:

    Based on Table 2, only complete instances are considered, and thus, the closeness
    metric of categorical values y and v in the feature F_1 is CLO_q(''y'''''', ''v'''''')
    = 2 log R_1 / (log R_1 + log R_1) = 0.4665.


    ## Definition 8: Closeness metric for numerical features

    The instance-cluster closeness amongst numerical features I_p^{NF} and the cluster
    C_v, p = 1,2,...,N, v = 1,2,...,K is represented as:


    CLO(I_p^{NF}, C_v) = exp(-0.5 ||I_p^{NF} - c_v||^2) / sum_{i=1}^k exp(-0.5 ||I_p^{NF}
    - c_i||^2). (13)


    ## Definition 9: Closeness metric for categorical features

    expressed as follows:


    CLO_q(I_{pq}^{CF}, C_v) = sum_{I_{pq} ∈ I_q^v} P_q^v(I_{pq}) CLO_q(I_{pq}, I''_{pq}).
    (14)


    The closeness measure amongst I_p and cluster center Y_v can be expressed as follows:


    CLO(I_p^{CF}, Y_v) = sum_{q=1}^M CLO_q(I_{pq}^{CF}, C_v). (15)


    ## Definition 10: Closeness metric for mixed features

    Let the instance-cluster closeness measure amongst the instance I_p and cluster
    C_v, represented as CLO(I_p, C_v), which is the average closeness measure computed
    built on every feature. Then,


    CLO(I_p, C_v) = 1/F_M [ CLO(I_{p1}^{CF}, C_v) + CLO(I_{p2}^{CF}, C_v) + ... +
    CLO(I_{pF_c}^{CF}, C_v) + CLO(I_p^{NF}, C_v) ] . (16)


    CLO(I_p, C_v) = 1/F_M sum_{q=1}^{F_c} CLO(I_{pq}^{CF}, C_v) + 1/F_M CLO(I_p^{NF},
    C_v), (17) where F_M = F_c + 1.


    ## Definition 11: Imputation Closeness Measure (ICM)

    A mixed data set χ = {I_1, I_2, ..., I_N} contains complete and missing information
    on instances. Let F'' = {F''_1, F''_2, ..., F''_M} be the complete features and
    F'''' = {F''''_1, F''''_2, ..., F''''_M''} be the missing information on features
    such that {F''_M'', F''''_M''} ⊂ F''_M, M'' < M. For all f = {f''_1, f''_2, ...,
    f''_{M''}} ∈ F''_1 × F''_2 × ... × F''_M and f'''' = {f''''_1, f''''_2, ..., f''''_{M''}}
    ∈ F''''_1 × F''''_2 × ... × F''''_{M''}, the ICM between f'' and f'''' is defined
    as:


    ICM(f'', f'''') = Support(f'', f'''') / sqrt(Support(f'') × Support(f'''')). (18)


    ## Definition 12: Missing complete closeness measure (MCCM)

    Let the mixed data set χ contain both complete and missing information on instances.
    The closeness between two categorical values is defined as:


    CLO_d^{mis}(I_{pd}, I''_{pd}) = { 2 log RR(I_{pd}, I''_{pd}) / (log RR(I_{pd})
    + log RR(I''_{pd})) if I_{pd} ≠ ? and I''_{pd} ≠ ? ; 0 otherwise } (20)


    Let I = {I_1, I_2, ..., I_M} be the complete instances and I'' = {I''_1, I''_2,
    ..., I''_{M''}} be the missing information on instances. The MCCM between I and
    I'' defined as:


    MCCM(I, I'') = sum_{d=1}^M CLO_d^{mis}(I_{pd}, I''_{pd}) (21)


