    where DIV(I_p^{CF}, KA) = (1 - CLO(I_p^{CF}, KA)) represents the divergence among
    I_p^{CF} and KA. Subsequently, we need to compute the impact of the numerical
    feature of Imp(I_p^{NF}). Let I_up^{NF} = (I_{up,1}^{NF}, I_{up,2}^{NF}, ...,
    I_{up,F_n}^{NF})^T and I_lo^{NF} = (I_{lo,1}^{NF}, I_{lo,2}^{NF}, ..., I_{lo,F_n}^{NF})^T
    be the upper and lower limit values correspondingly. These values can be computed
    by, I_{up,q}^{NF} = max_{1 <= p <= M} (I_{p,q}^{NF}) and I_{lo,q}^{NF} = min_{1
    <= p <= M} (I_{p,q}^{NF}) (56) where q = 1,2,...,F. Suppose ECM(I_{up,q}^{NF},
    I_{lo,q}^{NF}) represents the Euclidean closeness measure between I_{up,q}^{NF}
    and I_{lo,q}^{NF}. The numerical features of I_p^{NF} and I_q^{NF} in χ, can be
    represented as, ECM(I_p^{NF}, I_q^{NF}) <= ECM(I_{up}^{NF}, I_{lo}^{NF}). (57)
    Moreover, the divergence between I_p^{NF} and the kernel argument KA can be determined
    as, DIV(I_p^{NF}, KA) = min_{1 <= q <= n} ECM(I_p^{NF}, β_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF}) (58) where DIV(I_p^{NF}, KA) is defined by the minimum closeness
    measure among I_p^{NF} and the numerical kernel argument KA. The closeness measure
    between I_p^{NF} and the cluster center C^{NF} can be determined as CLO(I_p^{NF},
    χ) = CLO(I_p^{NF}, C^{NF}) = 1 - DIV(I_p^{NF}, C^{NF}) (59)


    CLO(I_p^{NF}, χ) = 1 - min_{1 <= q <= k} ECM(I_p^{NF}, C_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF}). (60) Then, we have Imp(I_p^{NF}) = DIV(I_p^{NF}, KA) + CLO(I_p^{NF},
    χ). (61) Imp(I_p^{NF}) = min_{1 <= q <= n} ECM(I_p^{NF}, β_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF}) + (1 - min_{1 <= q <= k} ECM(I_p^{NF}, C_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF})). (62) Finally, according to the impact of mixed data I_p to be chosen
    as a clustering kernel argument is computed by, Imp(I_p) = Imp(I_p^{CF}) + Imp(I_p^{NF}).
    (63) Imp(I_p) = (1 - 1/F_c sum_{q=1}^{F_c} CLO(I_{pq}^{CF}, KA)) + (1/F_c sum_{q=1}^{F_c}
    CLO(I_{pq}^{CF}, χ)) + min_{1 <= q <= n} ECM(I_p^{NF}, β_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF}) + (1 - min_{1 <= q <= k} ECM(I_p^{NF}, C_q^{NF}) / ECM(I_{up}^{NF},
    I_{lo}^{NF})). (64) More specifically, when choosing the initial kernel argument
    which is an empty group, the closeness among the I_p and χ should be evaluated.
    That is, the initial kernel argument β_1 is designated based on, β_1 = argmax_{I_p
    ∈ χ} [CLO(I_p^{CF}, χ) + CLO(I_p^{NF}, χ)] (65) Moreover, the process of the initialization
    adaptation approach for mixed features can be summarized in Table 7. The time
    complexity of the proposed method is better than existing algorithms. Subsequently,
    the proposed algorithm will not cost for extensive calculation.


