    sklearn.metrics 库评估模型性能。


    ## V. 结论与未来工作


    在本文中，我们使用多语言 XLM-R 模型对混合代码罗马乌尔都语和英语社交媒体进行了分析。这些是基于 BERT 的预训练模型。发现 XLM-R 对混合代码罗马乌尔都语和英语具有更高的准确率和
    FI 分。在未来的工作中，我们将构建一个神经网络并扩展 MultiSent 数据集。


