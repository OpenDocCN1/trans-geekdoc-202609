    摘要—情感分析是对针对特定问题、产品、个人和组织的态度、观点和情感的计算性研究。随着人工智能和自然语言处理的发展，情感分析正变得日益智能化。由于这些平台上的大量文本使用了如罗马乌尔都语混合英语等不完善且非正式的语言结构，以往这类代码混合、不完善且研究较少的语言有限。在此类媒体数据上使用深度学习模型是一种很有前景的解决方案。本文的目标是对代码混合的罗马乌尔都语和英语社交媒体文本进行情感分析。我们使用了多语言
    BERT (mBERT) 和 XLM-RoBERTa (XLM-R) 模型进行情感分析。结果显示，情感分析优于 mBERT，F1 分数为 71%。


    媒体数据规模非常大。随着自然语言处理和人工智能技术的发展，情感分析对于社区和小型公司来说变得更加易接触且负担得起。客户通常在查看数据上的客户评论后选择购买的产品。因此，评论已成为买家决策过程的重要部分，并影响了底层地区的贸易模式。


    乌尔都语是南亚流行的语言之一。它也是巴基斯坦的官方语言。世界上有超过 6000 万人使用乌尔都语 [4]。如今，人们使用非正式和代码混合的社交媒体语言来发布评论。


    在南亚，社交媒体平台上的主要语言是罗马乌尔都语混合英语，因为他们发现很难用乌尔都语输入。因此，社交媒体上生成的大短文本包含非正式和代码混合的罗马乌尔都语-英语语言。这是研究较少的语言之一，因此使用深度学习执行
    NLP 任务变得极具挑战性。


    **索引术**—情感分析、代码混合文本、罗马乌尔都语、深度学习、BERT、XLM-RoBERTa、多语言


    解决上述问题的方法之一是将目标语言翻译成英语，然后使用英语资源进行情感预测 [6]。


    然而，这对于不完善的语言并不适用，因为它们没有翻译资源。最近的方法使用深度学习模型进行情感分析 [7]。研究人员评估了这些基于字符的预训练


    # I. 引言


    情感分析是一种检查用户对某个主题或话题的情绪、观点和行为的技术 [1]。从社交媒体中手动提取情感是一项艰巨且耗时的任务，例如用于情感分析的嵌入模型。他们提出了一种使用语言模型嵌入
    (ELMo) 的深度学习模型来进行实验 [5]。然而，这些模型无法同时利用目标词左侧和右侧的上下文的优势。因此，在我们的工作中，我们使用基于转换的模型来提高对低资源代码化罗马乌尔都语-英语语言情感分析的准确性。


    结果显示，ADAN 在跨语言方面取得了令人瞩目的性能。在这些方法中，作者使用了语言翻译。然而，在翻译过程中，单词通常会丢失其上下文，这会导致对客户情感的洞察力。


    最近，深度学习方法被用于情感分析并在客户情感方面提供了改进的结果 [7]。例如，Kumar 和 Dhar [18] 使用了带有表面特征的深度学习方法。他们的网络消除了在代码混合印地语社交媒体数据上进行情感分析的学习技术的局限性。在
    [5] 中，开发了一种用于罗马乌尔都语和英语数据集的方法。他们发现了适应非正式语言的困难性。他们开发了用于代码混合数据的深度学习模型。然而，这些深度学习方法没有使用子词嵌入。


    本本文的目标是对代码混合的罗马乌尔都语和英语社交媒体文本进行情感分析。我们使用了多语言 BERT (mBERT) 和 XLM-RoBERTa (XLM-R)
    模型进行情感分析。结果显示，情感分析优于 mBERT，F1 分数为 71%。媒体数据规模非常大。随着自然语言处理和人工智能技术的发展，情感分析对于社区和小型公司来说变得更加易接触且负担得起。客户通常在查看数据上的客户评论后选择购买的产品。因此，评论已成为买家决策过程的重要部分，并影响了底层地区的贸易模式。


    本文其余部分的结构如下：第二节讨论文献综述；第三节描述本文的方法；第四节分析了结果；最后，第五节总结了本文的结论和未来工作。


    # II. 文献综述


    情感分析对企业非常重要，因为它提取了有用信息。他们提出了一种使用语言模型嵌入 (ELMo) 的深度学习模型来进行实验 [5]。然而，这些模型无法同时利用目标词左侧和右侧的上下文的优势。因此，在我们的工作中，我们使用基于转换的模型来提高对低资源代码化罗马乌尔都语-英语语言情感分析的准确性。


