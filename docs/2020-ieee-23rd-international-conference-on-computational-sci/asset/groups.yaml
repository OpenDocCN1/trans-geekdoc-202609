    我们在实验中使用了五种评估指标，即：分类结果、模型输出、错误预测得分和准确率。结果的马特修斯相关系数（MCC）用于计算每个项目的模型，适用于低资源语言。此外，模型是基于
    BERT 架构的，而 mBERT 在高资源语言上表现更好。XLM-R 是一个 transformer，为混合代码罗马乌尔都语和英语文本提供了最高的 FI 分（0.65）；ELMo
    是长短期记忆（LSTM），无法学习左侧或右侧的上下文。BERT 是一个 transformer，可以同时学习左侧和右侧的上下文。BERT 表示了高达 30,000
    个词的输入。XLM-R 和 BERT 是在 BERT 上实现的，但在混合代码罗马乌尔都语中获得了更高的 FI 分。MCC =


    $$\frac{TP \times TN - FP \times FN}{TP \times TN + FP \times FN}$$


    MCC 是用于计算实际值与预测值之间相关系数的分类矩阵。模型输出提供了每个项目的得分，即：正性、负性。准确率衡量了所有正确预测的比例。


    Accuracy =


    $$\frac{TP}{TP + FN}$$


    最后，我们根据公式 4 计算了错误分类预测的 FI 分。


    F1 = 2 \times


    $$\frac{Precision \times Recall}{Precision + Recall}$$


