    ## 表 IV：模型性能评估


    | | 未微调 | | | 已微调 | | |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 模型 | 准确率 | FI-Score | MCC | 准确率 | FI-Score |

