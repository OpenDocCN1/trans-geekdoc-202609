    数量和批大小（batch size）。更改关键超参数后，我们在 MultiSentiment 数据集上训练了模型。


    ## E. 训练与评估


    在这一步中，我们使用了预训练的 mBERT 和 XLMR-序列分类模型处理混合代码罗马乌尔都语和英语文本。我们有意识地使用预训练模型，因为当数据集较小时，从头训练这些模型会导致过拟合。


