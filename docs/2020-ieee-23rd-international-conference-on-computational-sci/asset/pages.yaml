    # III. METHODOLOGY


    First of all, we collect the dataset of code-mixed Roman-Urdu and English and
    proves it to our experiments. We perform classification of sentiments using mBERT
    and XLMR models. We train the models with tuning the hyperparameters of the codemixed
    Roman Urdu and English dataset. We evaluate the results with F1 score and accuracy
    metrics. The proposed methodology is explained in Fig. 1.


    # C. Classification Models


    We used mBERT and XLMR the most recent multilingual models for sentiment classification.
    The mBERT model is built using BERT base which consists of twelve transformer
    layers with 768 hidden layers. XLM-R is identical to Robust Optimized BERT Pretraining
    Approach (RoBERTa) but based on BERT layers with a dynamic masking mechanism to
    avoid the mask token for the same task in every example with key hyperparameters
    of BERT model. The model is trained on a dataset for a longer duration than BERT
    model.


    Transformers: BERT base consist of 12 transformer layers- consists of number of
    transformer layers. The Transformer is an architecture in natural language processing
    with the objective to perform sequence-to-sequence tasks with long range dependencies.
    Its consists of encoders and decoders. Further, encoder consists of


    Attention: It is an essential component in the Transformer. Self-attention layers
    provide context understanding and representation of a word in the texts or the
    context of the speech [21]. Attention calculates the context of words by applying
    Equation One.


    > $Attention(Q, K, V) = \frac{QK^T}{\sqrt{d_k}}v$$


    In BERT model, the special classification <CLS> encodes the whole sequence, "es
    as..." into a fixed-dimensional representation where possible. The special classification
    token <SEP> denotes the end of this end sentence in Fig. 2. The token ''end''
    is represented by the next token <102>. In XLM-R it is <sep>, and in every sequence
    are are replaced with a [MASK] token (or word, ''da'' is replaced by [MASK]).
    After, the model predicts the original values of masked words for the context
    of non-masked words. The encoders embed each word with a special representation.
    For example, El is the encoded representation of the first word of the sequence,
    "es".


    The models consist of multiple layers and every layer performed multi-head attention
    on the output of the previous layer., mBERT consists of 12 layers. In Fig. 2,
    the T1 is the first representation of each word code.


