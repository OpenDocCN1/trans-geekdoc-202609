    # II. LITERATURE REVIEW


    Sentiment analysis is important especially for businesses as it extracts useful
    information from a product or a service provided online by customers. The influence
    choice of buyer and selling procedure provided by the seller [11]. Now, days users
    write content in multiple languages. Thus, multilingual sentiment analysis is
    gaining popularity as it provides more information about the sentiments of the
    users [13]. There is another category of multilingual sentiment analysis where
    customers are using informal languages like Roman Urdu with English or other highly
    relevant languages [14], [15]. stated that instead of Urdu people are using Roman
    Urdu to express their views on social media.


    One of the challenges in sentiment analysis is such as lack of resources [16].
    In [17], authors performed sentiment analysis on a code-mixed Urdu script and
    English language. Sentiment analysis was performed by using Structural Correspondence
    Learning (SCL). They used approach of speech (POS) tagging and trained two encoders
    (one for accommodation of spelling variation and one for translation from Urdu
    to English). Similarly, Chen et al. proposed an Adversarial Deep Average Network
    (ADAN) to connect knowledge learning from labeled high resource language to unlabeled
    low-resources for sentiment analysis. They performed experiments on unlabeled
    Arabic and Chinese languages while using labeled data of the language.


