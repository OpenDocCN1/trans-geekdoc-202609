    Abstract—Sentiment analysis is the computational study of attitudes, opinions,
    and sentiments towards certain issues, products, individuals, and organizations.
    Sentiment analysis is becoming intelligent with the advancement of artificial
    intelligence and natural language processing. With the structure of a large volume
    of text on these platforms in imperfect and informal languages like Roman Urdu
    with the English language, previous research on these code-mixed imperfect, and
    poorly researched is limited. A promising solution is the use of deep learning
    models on such media data. The objective of this paper is to perform sentiment
    analysis of code-mixed Roman Urdu and English social media text. We performed
    sentiment analysis using Multilingual BERT (mBERT) and XLM-RoBERTa (XLM-R) models.
    The result shows that sentiment analysis is better than mBERT with F1 score of
    71%.


