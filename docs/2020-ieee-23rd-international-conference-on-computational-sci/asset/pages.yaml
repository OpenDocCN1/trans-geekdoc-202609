    Urdu is one of the popular languages of South Asia. It is also the national language
    of Pakistan. More than 60 million people speak Urdu in different parts of the
    world [4]. Nowadays people are using informal and code-mixed social media languages
    to post their comments.


    In South Asia, the primary language of use is Roman Urdu code-mixed with English
    on social media platforms as they find it difficult to type in Urdu. As a result,
    a large set of short text generated on social media contains informal and code-mixed
    Roman Urdu-English language. It is one of the poorly researched languages, consequently,
    it becomes extremely challenging to perform NLP tasks using deep learning.


    **Index Terms**—Sentiment analysis, Code-mixed text, Roman Urdu, Deep Learning,
    BERT, XLM-RoBERTa, Multilingual


