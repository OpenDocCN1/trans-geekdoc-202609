    models as shown in Table III. Each classification model has a dictionary of arguments.
    For tuning the hyperparameters, we changed the default values of the learning
    rate, the number of epochs, and the batch size of the models using the dictionary
    of arguments. After changing the key hyperparameters, we trained the model on
    MultiSentiment dataset.


