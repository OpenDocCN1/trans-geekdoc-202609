    \ are provided:\n\n![](Images/image00101.gif)\n\nIntuitively, we can already understand\
    \ which of the three splits will be selected, right?\n\n#### 3.2.2.1 Gini Index\n\
    \nWe compute the Gini index for `Outlook` using the following formulas:\n\n`GINI(Sunny)\
    \ = 1-Freq(Play = No|Outlook = Sunny)^2 -Freq(Play = Yes|Outlook = Sunny)^2`\n\
    \n`GINI(Rainy) = 1-Freq(Play = No|Outlook = Rainy)^2 -Freq(Play = Yes|Outlook\
    \ = Rainy)^2`\n\n`GINI[Outlook] = Freq(Outlook = Sunny)*GINI(Sunny) + Freq(Outlook\
    \ = Rainy)*GINI(Rainy)`\n\nThe calculations provide:\n`GINI(Sunny) = 1-(4/6)^2-(2/6)^2\
    \ = 0.444`\n`GINI(Rainy) = 1-(1/8)^2-(7/8)^2 = 0.219`\n`GINI[Outlook] = (6/14)*0.444\
    \ + (8/14)*0.219 = 0.315`\n\nSimilarly, the `GINI` for Temperature and Humidity\
    \ is `GINI[Temp.] = 0.367` and `GINI[Hum.] = 0.394`, respectively. Hence, answering\
    \ to question (a), the optimal split using the Gini index is on `Outlook`.\n\n\
    We can also make these computations using R. For `Outlook`, we build the following\
    \ frequency arrays:\n\n```r\nabsfreq = table(weather, c(1, 4))\nfreq = prop.table(absfreq,\
    \ 1)\nfreqSum = rowSums(prop.table(absfreq))\n```\n\nWe calculate the Gini index\
    \ for `Sunny` and `Rainy`:\n`GINI_Sunny = 1-freq[\"Sunny\", \"No\"]^2-freq[\"\
    Sunny\", \"Yes\"]^2`\n`GINI_Rainy = 1-freq[\"Rainy\", \"No\"]^2-freq[\"Rainy\"\
    , \"Yes\"]^2`\n\nThe total Gini for `Outlook` is computed by:\nGINI_Outlook =\
    \ freqSum[\"Sunny\"]*GINI_Sunny + freqSum[\"Rainy\"]*GINI_Rainy`\n\n#### 3.2.2.2\
    \ Information Gain\n\nWe compute the Information Gain for `Outlook` using the\
    \ following formulas:\n\n`Entropy(All) = -Freq(No)*log(No)-Freq(Yes)*log(Yes)`\n\
    `Entropy(Sunny) = -Freq(No|Sunny)*log(No|Sunny)-Freq(Yes|Sunny)*log(Yes|Sunny)`\n\
    `Entropy(Rainy) = -Freq(No|Rainy)*log(No|Rainy)-Freq(Yes|Rainy)*log(Yes|Rainy)`\n\
    `GAIN[Outlook] = Entropy(All)-Freq(Sunny)*Entropy(Sunny)-Freq(Rainy)*Entropy(Rainy)`\n\
    \nThe calculations provide:\n`Entropy(All) = -(5/14)*log(5/14)-(9/14)*log(9/14)\
    \ = 0.652`\n`Entropy(Sunny) = -(4/6)*log(4/6)-(2/6)*log(2/6) = 0.637`\n`Entropy(Rainy)\
    \ = -(1/8)*log(1/8)-(7/8)*log(7/8) = 0.377`\n`GAIN[Outlook] = 0.652-(6/14)*0.637+(8/14)*0.377\
    \ = 0.164`\n\nSimilarly, the Information Gain for Temperature and Humidity is\
    \ `GAIN[Temp.] = 0.105` and `GAIN[Hum.] = 0.071`, respectively. Hence, answering\
    \ to question (a), the optimal first split using the Information Gain is on `Outlook`.\n\
    \nWe can also make these computations using R. Initially, we compute the total\
    \ entropy of the dataset:\n\n```r\nfreq = prop.table(table(weather, c(4)))\nEntropy_All\
