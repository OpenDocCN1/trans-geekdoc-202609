    \ We can perform these transformations in R as follows:\n\niris2  = iris\\[, **c**(1,\
    \ 2, 5)\\]  \n\niris2$Species\\[**c**(101:150)\\] = iris2$Species\\[**c**(21:70)\\\
    ]  \n\niris2$Species = **factor**(iris2$Species)\n\nAfter that, we split the dataset\
    \ into training and testing data:  \n\ntrainingdata = iris2\\[**c**(1:40, 51:90,\
    \ 101:140),\\]  \n\ntestdata = iris2\\[**c**(41:50, 91:100, 141:150),\\]  \n\n\
    We will answer to the following questions:  \n\na) Build a decision tree using\
    \ the training data (the minsplit parameter of rpart should be set to 20, which\
    \ is the default).  \n\nb) Apply the model on testdata and compute the precision,\
    \ the recall, and the f-measure for the two classes.  \n\nc) Build two decision\
    \ trees, one for minsplit equal to 10 and one for minsplit equal to 30, apply\
    \ them on testdata and compute the precision, the recall, and the f-measure for\
    \ the two classes. d) Compare the three models given their f-measure for class\
    \ versicolor.\n\n### **3.3.1 Decision Tree Training and Testing**\n\nWe train\
    \ the decision tree and plot it using the following commands (questions (a), (c)):\n\
    \nmodel  < rpart(  \n\nSpecies ~ .,  \n\nmethod = \"class\",  \n\ndata = trainingdata,\
