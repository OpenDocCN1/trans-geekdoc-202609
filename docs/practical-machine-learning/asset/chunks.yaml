    # Chapter 2 - Introduction to Machine Learning


    ## 2.1 Definition


    Machine Learning (ML) is a subset of Artificial Intelligence (AI) in the field
    of computer science that often uses statistical techniques to give computers the
    ability to “learn” (i.e., progressively improve performance on a specific task)
    with data, without being explicitly programmed.


    Machine Learning is often closelly related, if not used as an alternate term,
    to fields like Data Mining (the process of discovering patterns in large data
    sets involving methods at the intersection of machine learning, statistics, and
    database systems), Pattern Recognition, Statistical Inference or Statistical Learning.
    All these areas often employ the same methods and perhaps the name changes based
    on the practitioner’s expertise or the application domain.


    ## 2.2 Main categories and tasks


    The main ML tasks are typically classified into two broad categories, depending
    on whether there is “feedback” or a “teacher” available to the learning system
    or not.


    - Supervised Learning: The system is presented with example inputs and their desired
    outputs provided by the “teacher” and the goal of the machine learning algorithm
    is to create a mapping from the inputs to the outputs. The mapping can be thought
    of as a function that if it is given as an input one of the training samples it
    should output the desired value.

    - Unsupervised Learning: In the unsupervised learning case, the machine learning
    algorithm is not given any examples of desired output, and is left on its own
    to find structure in its input.


    The main machine learning tasks and the ones we will examine in the present textbook,
    are separated based on what the system tries to accomplish in the end:


    - Classification: inputs are divided into two or more classes, and the learner
    must produce a model that assigns unseen inputs to one or more (multi-label classification)
    of these classes. This is typically tackled in a supervised manner. Spam filtering
    is an example of classification, where the inputs are email (or other) messages
    and the classes are “spam” and “not spam”.

    - Regression: also a supervised problem, the outputs are continuous rather than
    discrete.

    - Clustering: a set of inputs is to be divided into groups. Unlike in classification,
    the groups are not known beforehand, making this typically an unsupervised task.

    - Dimensionality Reduction: simplifies inputs by mapping them into a lower-dimensional
    space. Topic modeling is a related problem, where a program is given a list of
    human language documents and is tasked with finding out which documents cover
    similar topics.

    - Association Rules learning (or dependency modelling): Searches for relationships
    between inputs. For example, a supermarket might gather data on customer purchasing
    habits. Using association rule learning, the supermarket can determine which products
    are frequently bought together and use this information for marketing purposes.
    This is sometimes referred to as market basket analysis.


    ## 2.3 Survival guide to machine learning


    So you are given a problem. With what methodology are you going to approach it?


    First of all you have to understand the problem you are trying to solve with the
    data you have (or you are given) and ML algorithms. Is the problem defined formally?
    Unformally? Both? Are there any assumptions that need to be made? How one can
    go and solve it without ML? What is the motivation behind solving the problem?


    The next step is to prepare the data to be used by your favorite ML algorithms
    since usually data do not come with the format you need or have other problems.
    One should consider: 1) what data are available, 2) if there are any missing values,
    3) if any data need to be removed (for example the student ID, which does not
    have any predictive value, if we want to predict the average GPA of the student
    by the end of the semester), 4) to be organized, cleaned and sampled and 5) to
    be transformed either to other values due to domain knowledge (for example image
    pixel values to average image intensity or symmetry).


    After the data is ready and prepared it is a good practice to select your validation
    strategy (split, k-fold cross validation, etc.) and test 10 or more basic ML algorithms.
    This is useful for getting a feeling on which algorithm can produce good results
    for the specific dataset.


    From here on one can do algorithm tuning through hyper-parameter optimization
    methods, perform more advanced feature selection methods, use ensembles and more…sky
    is the limit.


    Finally, it is good that all the above steps to be logged into an online or offline
    notepad in order to be disseminated to the stakeholders and be available for future
    use: what is the problem, what is the solution you derived, what are the results,
    are there any limitations to your approach and the final conclusions.


    So to summarize the main steps are:


    1. Problem definition

    2. Data preparation

    3. Algorithm application

    4. Algorithm optimization

    5. Result presentation


    If someone wants more formally defined processes for working on data problems
    there are CRISP-DM and OSEMN. The steps for CRISP-DM⁶(check out the diagram below⁷)
    are:


    ^(6https://en.wikipedia.org/wiki/Cross-industry\_standard\_process\_for\_data\_mining7)By
    Kenneth Jensen - Own work based on: ftp://public.dhe.ibm.com/software/analytics/spss/documentation/modeler/18.0/en/ModelerCRISPDM.pdf
    (Figure 1), CC BY-SA 3.0, https://commons.wikimedia.org/w/index.php?curid=24930610


    - Business understanding: understanding the project objectives and requirements
    from a business perspective, and then converting this knowledge into a data mining
    problem definition, and a preliminary plan designed to achieve the objectives.

    - Data understanding: From an initial data collection and proceeds with activities
    in order to:

    - get familiar with the data,

    - identify data quality problems,

    - discover first insights into the data, or

    - detect interesting subsets to form hypotheses for hidden information.

    - Data preparation: This phase deals with the construction of the final dataset
    from the initial raw data.

    - Modeling: Application of various modeling techniques and parameter calibration
    to optimal values.

    - Evaluation: Thorough evaluation of the model before final deployment.

    - Deployment: The deployment can have many forms, from a generated report to a
    repeatable data mining process. Of ocurse we should mention that the creation
    of the model is generally not the end of a project.


    ![](Images/image00100.jpeg)CRISP-DM diagram


    The steps for OSEMN⁸are:


    - Obtain

    - Scrub

    - Explore

    - Models

    - Interpret


    ⁸http://www.dataists.com/2010/09/a-taxonomy-of-data-science/


