- raw: "k-Means Algorithm Purpose: Find the distribution of all samples among clusters\
    \ so as to minimize the sum of squares of the distances between each sample and\
    \ the center of the cluster it belongs. This metric corresponds to the Within\
    \ cluster Sum of Squares â€“ WSS or SSE and is given by the following formula:\n\
    \n^(K ∑) ‖x−m[i]‖²SSE =^∑  \n\ni−1 x∈C[i]  \n\nIn order to solve the aforementioned\
    \ optimization problem, k-Mean algorithm involves two distinc steps:  \n\n1\\\
    . Given certain centers, formulate clusters by assigning each sample to the closest\
    \ cluster 2. Calculate the new centers based on the formulate clusters\n\nIn the\
    \ initialization step, the algorithm randomly selects K samples as the initial\
    \ centers and then using these centers assigned each sample in the closest cluster.\
    \ Once every sample has been assigned to a certain cluster, the new center of\
    \ each cluster is calculated as the mean of every sample that belongs to the cluster.\
    \ This iterative process is continuoued until there is no change in the clusters\
    \ in to consecutive iterations.\n\nThe most famous and used variation of the k-Means\
    \ algorithm is k-Medoids, which is mainly used for categorical data and allows\
    \ the use of various different distance functions. It is worth noticing that unlike\
    \ k-Means, k-Medoids always uses a certain sample as the medoid of each cluster.\n\
    \n## **9.1 - k-Means in R**\n\nFor performing k-Means clustering in R, we can\
    \ use the following command:  \n\n*\\# Perform k-Means to form 3 clusters* model\
    \ = kmeans(data, centers = 3)  \n\nThecentersparameter can either take the number\
    \ of the initial centers (and thus the number of clusters) or the centers themselves\
    \ as argument.  \n\nWe can use the following commands in order to show the final\
    \ centroids and the distribution of the samples into the formulated clusters:\
    \  \n\n*\\# Get centroids* model$centers  \n\n*\\# Get distribution of samples\
    \ into clusters* model$cluster \n\n## **9.2 - k-Medoids in R**\n\nIn order to\
    \ perform k-Medoids clustering in R, we need to import the library cluster:  \n\
    \n**library**(cluster)  \n\nand then we can use the following command:  \n\n*\\\
