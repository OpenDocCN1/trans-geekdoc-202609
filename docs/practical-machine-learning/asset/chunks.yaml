    代表数据挖掘（Data Mining）。


    首先，我们将通过以下代码构建包含上述数据集的数据框：


    ```r

    # 存储 Rank 数据的向量

    Rank = c("High", "Low", "High", "Low", "Low", "High")


    # 存储 Topic 数据的向量

    Topic = c("SE", "SE", "ML", "DM", "ML", "SE")


    # 数据框

    conferences = data.frame(Rank, Topic)

    ```


    我们可以使用以下命令应用 k-Medoids：


    ```r

    # 导入库

    library(cluster)


    # 创建 k-Medoids 模型

    model = pam(conferences, 3)

    ```


    我们可以使用以下命令显示质心以及数据实例到聚类的分布：


    ```r

    # 获取质心

    model$medoids


