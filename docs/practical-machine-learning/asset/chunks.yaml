    | x3 | 7.38 | 4.59 | 1.00 |\n| x4 | 6.96 | 0.75 | 5.66 |\n| x5 | 6.67 | 5.84 |\
    \ 1.00 |\n| x6 | 6.52 | 2.14 | 7.21 |\n| x7 | 0.71 | 6.05 | 7.28 |\n| x8 | 7.91\
    \ | 1.75 | 6.40 |\n\n"
