    \ in the current session you can use the call: `rm(list=ls())`.\n\n## 1.2 Vectors\n\
    \nA vector is a collection of similar types of elements. For example integers.\
    \ Some things you can do with vectors in R are shown below.\n\n1. Create the vector\
