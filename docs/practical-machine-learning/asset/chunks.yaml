    \n• .50-.60 = fail (F)\n\n# Chapter 5 - Classification with k-Nearest Neighbors\n\
    \n## 5.1 Introduction\n\n### 5.1.1 Introduction to k-Nearest Neighbors\n\nk-Nearest\
    \ Neighbors (kNN) is a machine learning algorithm, where the prediction for a\
