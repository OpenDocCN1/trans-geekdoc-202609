- raw: "## **11.2 - DBSCAN model construction**\n\nIn an effort to construct a density-based\
    \ clustering model using DBSCAN algorithm, we will use the data of the following\
    \ table:  \n\nX Y\n\nx1 2 10  \n\nx2 2 5  \n\nx3 8 4  \n\nx4 5 8  \n\nx5 7 5 \
    \ \n\nx6 6 4  \n\nx7 1 2  \n\nx8 4 9\n\nIn order to visualize the data using R,\
    \ we will first need to create the resperctive data frame usinf the following\
    \ commands:  \n\n*\\# Construct vector containing X-axis data* X = **c**(2, 2,\
    \ 8, 5, 7, 6, 1, 4)  \n\n*\\# Construct vector containing Y-axis data* Y = **c**(10,\
    \ 5, 4, 8, 5, 4, 2, 9)  \n\n*\\# Construct vector containing the data labels which\
    \ correspond to the row names* rnames = **c**(\"x1\", \"x2\", \"x3\", \"x4\",\
    \ \"x5\", \"x6\", \"x7\", \"x8\")  \n\n*\\# Create the data frame*  \n\nddata\
    \ = **data.frame**(X, Y, row.names = rnames)  \n\nOnce having created our data\
    \ frame, we can plot our data using the following commands:  \n\n*\\# Plot the\
    \ data*  \n\nplot(ddata, pch = 15)  \n\n*\\# Add the data labels*  \n\ntext(ddata,\
    \ labels = **row.names**(hdata),  \n\npos = **c**(4, 2, 4, 4, 4, 4, 4, 4)) Our\
    \ data is illutrated in the following figure: ![](Images/image00131.gif)\n\n##\
    \ **11.3 - DBSCAN calculation**\n\nIn this subsection, we will apply DBSCAN algorithm\
    \ using minPoints = 2 and epsilon = {2, 3.5} in order to distribute the given\
    \ data into clusters.  \n\n• minPoints = 2 and epsilon = 2  \n\nWe first need\
    \ to compute the distance matrix for the given dataset which is given in the following\
    \ table:  \n\nx1 x2 x3 x4 x5 x6 x7 x8\n\nx1 0.00  \n\nx2 5.00 0.00  \n\nx3 8.49\
    \ 6.08 0.00  \n\nx4 3.61 4.24 5.00 0.00  \n\nx5 7.07 5.00 1.41 3.61 0.00  \n\n\
    x6 7.21 4.12 2.00 4.12 1.41 0.00  \n\nx7 8.06 3.16 7.28 7.21 6.71 5.39 0.00 x8\
    \ 2.24 4.47 6.40 1.41 5.00 5.39 7.62 0.00\n\nGiven the fact that minPoints value\
    \ is 2, each cluster should contain at least two points. In addition, based on\
    \ the epsilon values, which is 2, DBSCAN forms the following clusters:  \n\nC[1]\
    \ : {x[3], x[5], x[6]} and C[2] : {x[4], x[8]}  \n\nThe remaining points are considered\
    \ as noise.  \n\n• minPoints = 2 and epsilon = 3.5  \n\nx1 x2 x3 x4 x5 x6 x7 x8\n\
    \nx1 0.00  \n\nx2 5.00 0.00  \n\nx3 8.49 6.08 0.00  \n\nx4 3.61 4.24 5.00 0.00\
    \  \n\nx5 7.07 5.00 1.41 3.61 0.00  \n\nx6 7.21 4.12 2.00 4.12 1.41 0.00  \n\n\
    x7 8.06 3.16 7.28 7.21 6.71 5.39 0.00 x8 2.24 4.47 6.40 1.41 5.00 5.39 7.62 0.00\n\
    \nIn the case of epsilon = 3.5, DBSCAN forms the following clusters:  \n\nC[1]\
    \ : {x[1], x[4], x[8]}, C[2] : {x[2], x[7]} and C[3] : {x[3], x[5], x[6]} As we\
    \ can see no point is considered as noise. \n\n## **11.4 - DBSCAN clustering with\
    \ R**\n\nIn order to perform clustering using DBSCAN with R, we can use the following\
    \ command:  \n\nmodel = dbscan(ddata, eps = 2, minPts = 2)  \n\nIn order to get\
    \ the distribution of the data point into clusters, we can use the following command:\
    \  \n\nclusters = model$cluster  \n\nFinally, we can plot the clustering results\
    \ using the following commands:  \n\n*\\# Plot clusters*  \n\nplot(ddata, col\\\
    =clusters+1, pch\\=15, main\\=\"DBSCAN(eps = 2, minPts = 2)\")  \n\n*\\# Add data\
    \ labels*  \n\ntext(ddata, labels = **row.names**(ddata), pos = 4) In the following\
    \ figure, we can see the formulated clusters from the previous subsection. ![](Images/image00132.gif)\n\
    \n## **11.5 - Density-based Clustering Application**\n\nIn this section, we are\
    \ going to demonstrate the application of DBSCAN algorithm in a real life application\
    \ example. In this context, we have a dataset that contains 2,000 different 2D\
    \ data points. A summary of the dataset is given in the following table:\n\nX1\
    \ X2\n\nMin. 5.09 7.54 1st Qu. 10.45 9.78 Median 13.30 12.01 Mean 13.28 12.03\
    \ 3rd Qu. 16.13 14.27 Max. 21.43 16.48\n\nWe will use the aforementioned data\
    \ in order to answer the following questions: (a) Plot the given data points\n\
    \n(b) Apply k-Means algorithm in order to create two clusters and plot the result\
    \ using different color for each cluster. Is the result satisfying? Do the created\
    \ clusters correspond to the actual ones?\n\n(c) Optimize esp parameter for DBSCAN\
    \ using kNN distance (use k = 10).  \n\n(d) Apply DBSCAN using eps = 0.4 and minPts\
    \ = 10 into the given dataset. Plot the result using different color for each\
    \ cluster and black for the data points considered as noise.\n\n### **11.5.1 -\
    \ Modeling using k-Means**\n\nOur first step is to read and plot the given dataset\
    \ using the following commands:  \n\n*\\# Plot library* **library**(dbscan)  \n\
    \n*\\# Read data*  \n\nmdata = read.csv(\"mdata.txt\")  \n\n*\\# Plot data* plot(mdata)\
    \  \n\nThe following figure illustrates the given dataset. As we can see from\
    \ the plot, we can identify two distinguished clusters.  \n\n![](Images/image00133.gif)Then,\
    \ we apply k-Means and plot the clustering results using the following commands:\
    \  \n\n*\\# Construct k-Means model*  \n\nmodel = kmeans(mdata, 2)  \n\n*\\# Plot\
    \ data*  \n\nplot(mdata, col = model$cluster + 1)  \n\n![](Images/image00134.gif)\n\
    \nAs we can see, k-Means is not able to suffieciently split the data into clusters.\
    \ This result originates from the fact that k-Means relies on the Euclidean distance\
    \ and thus cannot distingush clusters organized in complex structures.\n\n###\
    \ **11.5.2 - Optimizing parameter eps**\n\nIn order to optimize the parameter\
    \ eps of the DBSCAN algorithm (quaestion (c)), we will use kNN distance. We can\
    \ use the following R command in order to compute the destance of every data point\
    \ with its 10 nearest neighbours:\n\nknndist = kNNdist(mdata, k = 10)  \n\nThen,\
    \ we can plot the respective graph after sorting the data into ascending order:\
    \  \n\n*\\# Get the distances of the 10 nearest neighbours for each point*  \n\
    \nkdist = knndist\\[, 10\\]  \n\n*\\# Plot distances*  \n\nplot(**sort**(kdist),\
    \ type = 'l', xlab = \"Points sorted by distance\",  \n\nylab = \"10-NN distance\"\
    )  \n\n![](Images/image00135.gif)In order to optimize eps, we follow the elbow\
    \ method. As we can see from the graph, the optimized eps valus are in the interval\
    \ \\[0.35, 0.45\\].\n\n### **11.5.3 - Modeling using DBSCAN**\n\nLastly, we can\
    \ answer question (d) by applying DBSCAN on the given dataset using eps = 0.4\
    \ and minPoints = 10.  \n\n*\\# Construct DBSCAN model*  \n\nmodel = dbscan(mdata,\
    \ eps = 0.4, minPts = 10)  \n\n*\\# Plot distances*  \n\nplot(mdata, col = model$cluster\
    \ + 1, pch = **ifelse**(model$cluster, 1, 4))  \n\nThe following figure depicts\
    \ the clustering result. As we can see, DBSCAN is able to efficiently split the\
    \ given dataset into clusters.  \n\n![](Images/image00136.gif)\n\n# Chapter 12\
    \ - Distribution-based clustering\n\n## 12.1 - Theoretical background\n\nDistribution-based\
    \ clustering is closely related to statistics and is based on the fact that clusters\
    \ can easily be defined as objects including data instances belonging most likely\
    \ to the same distribution. While the theoretical foundation of the methods that\
    \ apply to this clustering category is excellent, they suffer from one key problem\
    \ known as overfitting, unless cetrain constraints are set into the complexity\
    \ of the model. A more complex model will usually be able to explain the data\
    \ better, which makes choosing the appropriate level of complexity inherently\
    \ difficult. One prominent and widely used method is known as Gaussian Mixture\
    \ Models or GMMS (using the Expectation-Maximization algorithm or EM).\n\n###\
    \ **12.1.1 - The Expectation-Maximization algorithm**\n\nIn statistics, an Expectation-Maximization\
    \ (EM) algorithm is an iterative method to find maximum likelihood or maximum\
    \ a posteriori (MAP) estimates of parameters in statistical models, where the\
    \ model depends on unobserved latent variables. In practice EM algorithm maximizes\
    \ the following expression:\n\nX : dataset, Z : latent variables, θ : set of parameters\
    \  \n\nlnP (X/θ) =ln^∑P (X, Z/θ)  \n\nZ \n\nThe EM iteration alternates between\
    \ performing an expectation step (E-step), which creates a function for the expectation\
    \ of the log-likelihood evaluated using the current estimate for the parameters,\
    \ and a maximization step (M-step), which computes parameters maximizing the expected\
    \ log-likelihood found on the E step. These parameter estimates are then used\
    \ to determine the distribution of the latent variables in the next E-step.\n\n\
    E-step:  "
