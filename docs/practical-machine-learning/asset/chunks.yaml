    # Import libraries

    library(cluster)


    # Read data from file

    europe = read.csv("europe.txt")


    # Get distance matrix

    d = dist(scale(europe))


    # Perform hierarchical clustering

    hc = hclust(d, method = ''complete'')


    # Plot dendrogram

    plot(hc)

