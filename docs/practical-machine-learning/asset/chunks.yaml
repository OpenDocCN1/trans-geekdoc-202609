    # Chapter 8 - Dimensionality Reduction


    ## 8.1 Principal Components Analysis


    ### 8.1.1 “Raw” Principal Components Analysis


    First we will try to perform Principal Components analysis (PCA) without using
    a ready-made R function from a library.


    ### Step 1: Data


    First we are going to make a dataset and plot it.


    ```

    d < c(2.5, 2.4, 0.5, 0.7, 2.2, 2.9, 1.9, 2.2, 3.1, 3.0, 2.3, 2.7, 2, 1.6, 1, 1.1,
    1.5, 1.6, 1.1, 0.9)

    data < matrix(d, ncol=2, byrow = T)

    plot(data, xlab="x1", ylab="x2")

    ```


    ![](Images/image00111.gif)


    ### Step 2: Subtract the mean


    We subtract the mean of each attribute (x1, x2) from the respective values (centering
    the data) using the function `scale`.


    ```

    data_norm < scale(data, scale=F)

    plot(data_norm, xlab="x1", ylab="x2")

    ```


    ![](Images/image00112.gif)


    ### Step 3: Calculate the covariance matrix


    We calculate the covariance matrix using the function `cov`.


    ```

    S < cov(data_norm)

    print(S)

    ```


    ## [1], [2]


    ## [1,] 0.6165556 0.6154444


    ## [2,] 0.6154444 0.7165556


    ### Step 4: Computer the eigenvectors of the covariance matrix


    Using the `svd` method (Singular Value Decomposition) we derive the eigenvectors
    of the covariance matrix. First we print the decomposition:


    ```

    udv < svd(S)

    print(udv)

    ```


    ## $d


    ## [1] 1.2840277 0.0490834


    ## $u


    ## [1], [2]

    ## [1,] -0.6778734 -0.7351787

    ## [2,] -0.7351787 0.6778734


    ## $v


    ## [1], [2]

    ## [1,] -0.6778734 -0.7351787

    ## [2,] -0.7351787 0.6778734


    and then we plot the eigenvectors:


    ```

    # asp=1 keep the aspect ratio to 1 so that the eigenvectors are # displayed appropriatelly,
    perpendicular

    plot(data_norm, asp=1, xlab="x1", ylab="x2")

    arrows(0,0,udv$u[1,1],udv$u[2,1], lwd=1)

    arrows(0,0,udv$u[1,2],udv$u[2,2], lwd=0.5)

    ```


    ![](Images/image00113.gif)


    ### Step 5: Choosing components


    We can use a barplot to display the variance accounted for for each component.


    ```

    barplot(udv$d)

    print(cumsum(udv$d)/sum(udv$d))

    ```


    ![](Images/image00114.gif)


    We can see that the 1st component accounts for more than 95% of the variance.
    ### Step 6: Picking the 1st component


    We transform the 2D dataset into a 1D dataset using just the 1st Principal Component
    (PC).


    ```

    data_new < t(udv$u[,1,drop=FALSE]) %*% t(data_norm)

    data_new

    ```


    ## [1], [2], [3], [4], [5], [6]

    ## [1,] -0.8279702 1.77758 -0.9921975 -0.2742104 -1.675801 -0.9129491

    ## [7], [8], [9], [10]

    ## [1,] 0.09910944 1.144572 0.4380461 1.223821

    plot(data_new,data_new,asp=1,xlab="x1", ylab="x2")

    ```


    ![](Images/image00115.gif)


    ### 8.1.2 PCA using R function


    In this subsection, we will use `prcomp` that performs PCA in one step. We will
    apply it on Iris dataset and test the gains or losses in terms of accuracy using
    `knn` algorithm.


    ```

    # download the file

    data = iris

    set.seed(1234)

    ind < sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))

    trainData < data[ind==1,]

    validationData < data[ind==2,]

    library(class)

    library(stats)

    trainData < trainData[complete.cases(trainData)]

    validationData < validationData[complete.cases(validationData)]

    trainDataX < trainData[,ncol(trainData)]

    logTrainData < log(trainDataX)

    train.pca < prcomp(logTrainData, center = TRUE, scale. = TRUE)

    summary(train.pca)

    ```


    Importance of Standard deviation 1.7226 0.9313 0.36484 0.17916

    Proportion of Variance 0.7419 0.2168 0.03328 0.00802

    Cumulative Proportion 0.7419 0.9587 0.99198 1.0000


    From the summary, we observe that with 2 PCs, we can explain more than 95% of
    the variance.


    ```

    trainDataY < trainData$Species

    validationDataX < validationData[,ncol(trainData)] # Let''s also transform the
    validation data

    logValidationDataX < log(validationDataX)

    validation.pca < predict(train.pca, newdata=logValidationDataX) # no pca prediction

    prediction = knn(trainDataX, validationDataX, trainDataY, k = 3) # So''s predict
    using only 7 components

    prediction_pca = knn(train.pca$x[,1:2], validation.pca[,1:2], trainDataY, k =
    3)

    cat("Confusion matrix:\n")

    # Confusion matrix:

    xtab = table(prediction, validationData$Species)

    print(xtab)

    # prediction setosa versicolor virginica

    # setosa 10 0 0

    # versicolor 0 12 1

    # virginica 0 0 15

    cat("\nEvaluation:\n\n")

    # Evaluation:

    accuracy = sum(prediction == validationData$Species)/length(validationData$Species)

    cat(paste("Accuracy:\t", format(accuracy, digits=2), "\n",sep=" "))

    # Accuracy: 0.97

    cat("Confusion matrix PCA:\n")

    # Confusion matrix PCA:

    xtab = table(prediction_pca, validationData$Species)

    print(xtab)

    # prediction_pca setosa versicolor virginica

    # setosa 10 0 0

    # versicolor 0 10 3

    # virginica 0 2 13

    cat("\nEvaluation PCA:\n\n")

    # Evaluation PCA:

    accuracy = sum(prediction_pca == validationData$Species)/length(validationData$Species)

    cat(paste("Accuracy PCA:\t", format(accuracy, digits=2), "\n",sep=" "))

    # Accuracy PCA: 0.87

    ```


    Even though the validation dataset is small, one can observe that using 50% less
    predictor attributes, the algorithm made only 4 extra mistakes. Of course in real
    world scenarios, crossvalidation should be used with such small datasets.


    ### 7.2.3 PCA for Plotting


    Using the PCA we can also plot in 2 dimensions, high-dimensional data, by using
    just the first two components.


    ```

    plot(train.pca $x[trainData$Species == ''setosa'',1:2], col="blue", ylim = c(-3,
    3), xlim=c(-3,3), asp=1)

    points(train.pca$x[trainData$Species == ''versicolor'',1:2], pch = 3, col="red")

    points(train.pca$x[trainData$Species == ''virginica'',1:2], pch = 4, col="green")

    ```


    ![](Images/image00116.jpeg)


    In this case the PCA is not the best method for dimensionality reduction to improve
    the accuracy. From the plot one cas observe that the versicolorand virginicaspecies
    are intermixed in 2D and thus the k-NN algorithm will have trouble classifying
    between the two.


    # Part III - Clustering


    ## Chapter 9 - Centroid-based clustering and Evaluation


    Centroid-based clustering is a subset of clustering techniques where clusters
    are represented by a central vector, which may not necessarily be a member of
    the data set. When the number of clusters is fixed to a given number k, k-Means
    clustering gives a formal definition of the following optimization problem:


    Given a dataset containingNsamples:


    X = {x[1], x[2], x[3], . . . , x[N]}


    andKas the number of selected clusters:


    Clusters : {C[1], C[2], . . . , C[K]} with Centers : {m[1], m[2], . . . , m[K]}

    '
  trans: '


    `paste("Accuracy in validation forward search attributes", Accuracy(simpler_pred,
    validationData$Class), sep=" - ")`


    ## [1] "验证前向搜索属性准确率 - 0.971291866028708"


    在乳腺癌威斯康星数据集中，特征选择算法的表现并没有优于使用所有属性。其明显原因是该数据集中有 9 个属性，这些属性是由领域专家手工挑选的，它们确实具有组合预测能力，无法被其中任何子集超越。因此，在这种情况下，删除特征并不会产生更好的结果。


    ![](img/image0009.gif)


    ## 后向搜索


    人们也可以通过将 `forward.searchmethod` 改为 `backward.search` 来执行后向搜索包装选择方法。在后向搜索的情况下，保留了多少属性？


