    \  \n\nEntropy\\_All =  freq\\[\"No\"\\] \\* **log**(freq\\[\"No\"\\])  freq\\\
    [\"Yes\"\\] \\* **log**(freq\\[\"Yes\"\\])  \n\nThen, for Outlook, we build the\
    \ following frequency arrays:\n\nabsfreq  = **table**(weather\\[, **c**(1, 4)\\\
    ]) freq = **prop.table**(absfreq, 1)  \n\nfreqSum = **rowSums**(**prop.table**(absfreq))\n\
    \nWe calculate the entropy for Sunny and Rainy:\n\nEntropy\\_Sunny  =  \n\n\\\
    - freq\\[\"Sunny\", \"No\"\\] \\* **log**(freq\\[\"Sunny\", \"No\"\\])  \n\n\\\
    - freq\\[\"Sunny\", \"Yes\"\\] \\* **log**(freq\\[\"Sunny\", \"Yes\"\\])\n\nEntropy\\\
    _Rainy  =  \n\n\\- freq\\[\"Rainy\", \"No\"\\] \\* **log**(freq\\[\"Rainy\", \"\
    No\"\\])  \n\n\\- freq\\[\"Rainy\", \"Yes\"\\] \\* **log**(freq\\[\"Rainy\", \"\
    Yes\"\\])\n\nThe total information gain for Outlook is computed by:\n\nGAIN\\\
    _Outlook  =  \n\nEntropy\\_All  \n\n\\- freqSum\\[\"Sunny\"\\] \\* Entropy\\_Sunny\
    \  \n\n\\- freqSum\\[\"Rainy\"\\] \\* Entropy\\_Rainy\n\n### **3.2.3 Building\
    \ the Decision Tree**\n\nFor question (c), we build a decision tree using rpart:\n\
    \nmodel  < rpart(  \n\nPlay ~ Outlook + Temperature + Humidity, method = \"class\"\
    ,  \n\ndata = weather,  \n\nminsplit = 1,  \n\nminbucket = 1,  \n\ncp = -1)\n\n\
    Furthermore, we can plot the tree with the following command:  \n\nrpart.plot(model,\
    \ extra = 104, nn = **TRUE**) The tree is shown in the following figure: ![](Images/image00102.gif)\n\
    \n## **3.3 Application with Pruning and Evaluation Metrics**\n\nA decision tree\
    \ classifier can also be applied on datasets with continuous predictor variables,\
    \ such as the iris dataset. From the iris dataset, we shall only keep the first\
    \ 2 columns of the dataset and drop the last 50 instances, so that we now have\
