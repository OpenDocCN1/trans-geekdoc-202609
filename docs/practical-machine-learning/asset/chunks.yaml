    ## 9.5 - k-Means clustering and evaluation in real life Application


    In this section, we are going to demonstrate the application of k-Means algorithm
    in a real life application example. In this context, we have a dataset that contains
    300 different 2D data points that originate from three different distributions.
    A summary of the dataset is given in the following table:


    | X1 | X2 |

    |---|---|

    | Min. | -4.720 | -3.974 |

    | 1st Qu. | -1.237 | -1.059 |

    | Median | 1.757 | 2.096 |

    | Mean | 1.322 | 1.532 |

    | 3rd Qu. | 3.592 | 3.675 |

    | Max. | 6.077 | 6.689 |


    We will use the aforementioned data in order to answer the following questions:


    (a) Compute the center of our dataset, which is given by the mean of all data
    points.

    (b) Identify the optimal number of clusters using the elbow method.

    (c) Compute and plot the silhouette coefficient.

    (d) Visualize the clustering result.


