    # Chapter 4 - Classification with Naive Bayes


    ## 4.1 Introduction


    ### 4.1.1 Introduction to Naive Bayes


    Naive Bayes is a machine learning algorithm that is based on the Bayes theorem
    as well as the assumption of independence between the features of the dataset.
    Given a dataset with a set of features `x[1]`, `x[2], . . . , x[n]` and a class
    feature `c`, the Bayes theorem defines the probability that an instance `{x[1],
    x[2], . . . , x[n]}` belongs to `c` as the combination of the probabilities `P
    (x[1]|c)`, `P (x[2]|c), . . . , P (x[n]|c)`:


    `P (x[1]|c)·P (x[2]|c)· · · · ·P (x[n]|c)·P (c)[P (c|x) = P(x1)·P(x2)· · · · ·P(xn)]`


    where we notice that the probability of the set of features is given by their
    product, as their values are independent from one another.


    ### 4.1.2 Naive Bayes in R


    We may use the `e1071` library to build the probabilistic Naive Bayes model in
    R:


    ```r

    library(e1071)

    ```


    Building a model requires executing the `naiveBayes` command:


    ```r

    model < naiveBayes(Target ~ ., data = ..., laplace = ...)

    ```


    where parameter `laplace` is used to select laplace smoothing.


    Given a trained model, we can predict the class for a new instance using the command:


    ```r

    predict(model, trvalue)

    ```


    while if we further add the parameter `type="raw"`, we are also provided with
    posterior probabilities.


    ## 4.2 Naive Bayes Construction and Classification


    We will use the data of the following table for problem of binary classification:


    | Weather | Day | HighTraffic |

    | :--- | :--- | :--- |

    | Hot | Vacation | No |

    | Cold | Work | Yes |

    | Normal | Work | No |

    | Cold | Weekend | Yes |

    | Hot | Vacation | Yes |


    We will answer to the following questions:

    a) Using the Naive Bayes Classifier, which class would you classify a new instance
    with values `(Weather, Day) = (Hot, Vacation)`?

    b) Using the Naive Bayes Classifier, which class would you classify a new instance
    with values `(Weather, Day) = (Hot, Weekend)`?

    c) Repeat question (b) using Laplace smoothing.

    d) Build the full model in R and repeat question (a).

    e) Build the full model in R using laplace smoothing and repeat question (b).


    ### 4.2.1 Data and Library


    Initially, we read the data and import the required:


    ```r

    traffic = read.csv("traffic.txt")

    library(e1071)

    ```


    ### 4.2.2 Probability Calculation


    For question (a), we compute the probability using the following formulas:

    `P (Y|Hot, Vacation) = P (Hot|Y)·P (Vacation|Y) = 1/4·1/2 = 1/8 (3/8)`

    `P (No|Hot, Vacation) = P (Hot|No)·P (Vacation|No) = 2/4·1/4 = 2/8 (2/8)`


    Since `P (No|Hot, Vacation) > P (Y|Hot, Vacation)`, the algorithm classifies the
    instance to No. Similarly, for question (b):

    `P (Y|Hot, Weekend) = P (Hot|Y)·P (Weekend|Y) = 1/4·1/2 = 1/8 (3/8)`

    `P (No|Hot, Weekend) = P (Hot|No)·P (Weekend|No) = 2/4·0/4 = 0/8 (2/8)`


    Since `P (No|Hot, Weekend) < P (Y|Hot, Weekend)`, the algorithm classifies the
    instance to Yes. Concerning question (c), we will re-compute the probabilities,
    however adding 1 as Laplacian parameter. So, given the new probabilities are:

    `P (Y|Hot, Vacation) = (1+1)/(4+3) = 2/7`

    `P (No|Hot, Vacation) = (2+1)/(4+3) = 3/7`

    `P (Y|Hot, Weekend) = (1+1)/(4+3) = 2/7`

    `P (No|Hot, Weekend) = (0+1)/(4+3) = 1/7`


