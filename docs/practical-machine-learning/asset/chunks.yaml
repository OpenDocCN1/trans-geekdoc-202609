    我们将使用该数据集来回答以下问题：


    (a) 使用完全连接法应用层次聚类并绘制相应的聚类图

    (b) 根据轮廓系数（silhouette coefficient）选择合适的聚类数量

    (c) 使用给定数据形成 7 个类，并生成展示结果的相应聚类图

