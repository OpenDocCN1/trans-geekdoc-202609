    # Chapter 3 - Classification with Decision trees


    ## 3.1 Introduction


    ### 3.1.1 Introduction to Decision Trees


    A Decision Tree is a Machine Learning algorithm that is used mainly for classification
    problems. It can be applied to categorical and continuous data. The main concept
    of the algorithm is simple; the data are split consecutively according to certain
    splitting criteria. Decision trees are computationally efficient when training
    and quite fast for classifying new instances. Furthermore, they are comprehensional
    when they are not too large, therefore they are frequently used for data exploration.
    A common pitfall is that they are sensitive to overfitting, which can be confronted
    by pruning or by adding further criteria when building the tree.


    ### 3.1.2 Decision Trees in R


    We may use the rpart library to build decision trees in R:


    ```

    library(rpart)

    ```

