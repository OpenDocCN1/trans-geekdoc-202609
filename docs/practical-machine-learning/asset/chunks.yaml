    \ x[i] \\cdot P (D_1/x[i], \\theta[1])}{\\sum_{i=1}^{1000} P (D_1/x[i], \\theta[1])}$\n\
    \n$\\mu[2] = \\frac{\\sum_{i=1}^{1000} x[i] \\cdot P (D_2/x[i], \\theta[2])}{\\\
    sum_{i=1}^{1000} P (D_2/x[i], \\theta[2])}$\n\nThe above equations calculate the\
    \ weighted average of all data points, where the weights are actually the probabilities\
    \ for each data point to originate from one of the two distributions. The mixing\
    \ coefficients are given by the following equations:\n\n$\\lambda[1] = \\frac{\\\
    sum_{i=1}^{1000} P (D_1/x[i], \\theta[1])}{1000}$\n\n$\\lambda[2] = \\frac{\\\
    sum_{i=1}^{1000} P (D_2/x[i], \\theta[2])}{1000}$\n\n### 12.2.3 - Calculating\
    \ the parameters of normal distributions using R\n\n```r\n# Initialization\nmu\
    \ = c(0, 1)\nlambda = c(0.5, 0.5)\n# Set stopping criterion\nepsilon = 1e-08\n\
    # Compute initial log-likelihood\nlog_likelihood = sum(log(lambda[1] * dnorm(x,\
    \ mean = mu[1], sd = 1) + lambda[2] * dnorm(x, mean = mu[2], sd = 1)))\n\nrepeat\
    \ {\n  # ------ Expectation step -----\n  # Find distributions given mu, lambda\
    \ (and sigma)\n  T1 = dnorm(x, mean = mu[1], sd = 1)\n  T2 = dnorm(x, mean = mu[2],\
    \ sd = 1)\n  P1 = lambda[1] * T1 / (lambda[1] * T1 + lambda[2] * T2)\n  P2 = lambda[2]\
    \ * T2 / (lambda[1] * T1 + lambda[2] * T2)\n\n  # ------ Maximization step -----\n\
    \  # Find mu, lambda (and sigma) given the distributions\n  mu[1] = sum(P1 * x)\
    \ / sum(P1)\n  mu[2] = sum(P2 * x) / sum(P2)\n  lambda[1] = mean(P1)\n  lambda[2]\
    \ = mean(P2)\n\n  # Calculate the new log likelihood (to be maximized)\n  new_log_likelihood\
    \ = sum(log(lambda[1] * dnorm(x, mean = mu[1], sd = 1) + lambda[2] * dnorm(x,\
    \ mean = mu[2], sd = 1)))\n\n  # Print the current parameters and the log likelihood\n\
    \  cat(\"mu =\", mu, \" lambda =\", lambda, \" log_likelihood =\", new_log_likelihood,\
    \ \"\\n\")\n\n  # Break if the algorithm converges\n  if (new_log_likelihood -\
    \ log_likelihood <= epsilon) break\n  log_likelihood = new_log_likelihood\n}\n\
    ```\n\n### 12.2.4 - GMMs model construction using mixtools\n"
