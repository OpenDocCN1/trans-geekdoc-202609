    \ evaluation metrics. Once we have perform the clutering and get the final distribution\
    \ of the samples into the clusters, then we can compute a list of metrics that\
    \ enable us evaluate the result. Some of those metrics are the following:\n\n\
    • Cohesion (or within-cluster sum of squares)  \n\n^(K ∑) ‖x−m[i]‖²W SS =^∑  \n\
    \ni−1 x∈C[i]  \n\n• Separation (or between-cluster sum of squares)  \n\n^(K 2)BSS\
