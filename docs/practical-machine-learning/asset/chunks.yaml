    ### 9.4.3 - 计算凝聚度（Cohesion）与分离度（Separation）


    为了回答问题 (c)，我们必须计算上一个小节中执行的聚类的凝聚度与分离度。


    首先，我们将手动计算这些指标，然后查看如何使用 R 来计算它们。在计算过程中，我们将使用上述簇。


    ^(\[)7.5^(\] \[)5.67^(\] \[)1.67^(\])


    C[1] : m[1] =[1.5] C[2] : m[2] =[8.33] C[3] : m[3] =[4]


    #### 凝聚度计算


    凝聚度指标由以下方程给出：


    ^(K ∑) ‖x−m[i]‖²W SS =^∑

    i−1 x[∈]C[i]


    此时，计算每个簇的凝聚度：第 1 个簇：


    W SS(C[1]) = ^∑ ‖x−m[1]‖² =‖x[1] −m[1]‖² +‖x[7] −m[1]‖²

    x∈C[1]

    \=^√(7− 7.5)² + (1− 1.5)²² +^√(8− 7.5)² + (2− 1.5)²² = 0.25 + 0.25 + 0.25 + 0.25
    = 1


    第 2 个簇：


    W SS(C[2]) = ^∑ ‖x−m[2]‖² =‖x[4] −m[2]‖² +‖x[6]−m[2]‖² +‖x[8] −m[2]‖²

    x∈C[2]

    \=^√(5− 5.67)² + (8− 8.33)²² +^√(7− 5.67)² + (8− 8.33)²² +^√(5− 5.67)² + (9− 8.33)²²
    = 0.4489 + 0.1089 + 1.7689 + 0.1089 + 0.4489 + 0.4489 = 3.333


    第 3 个簇：


    W SS(C[3]) = ^∑ ‖x−m[3]‖² =‖x[2] −m[3]‖² +‖x[3] −m[3]‖² +‖x[5] −m[3]‖²

    x∈C[3]

    \=^√(5− 4)² + (1− 4)²² +^√(7− 4)² + (3− 4)²² +^√(6− 4)² + (5− 4)²² = 1 + 9 + 9
    + 4 + 1 = 24


    总凝聚度（Total cohesion）由以下方程给出：


    W SS[total] = W SS(C[1]) + W SS(C[2]) + W SS(C[3])

    1 + 3.333 + 24 = 28.333


    #### 分离度计算


    分离度（簇间平方和）指标由以下方程给出：


    所以，我们的步骤是计算数据集的中心点，它是通过所有点的平均值得到的。


    BSS[total] = ∑|C[i]|−m[i]‖²

    = 2(1.5-3.532)² + 3(8.33-3.532)² + 3(4-3.532)²

    = 2(4.129) + 3(22.97) + 3(0.219) = 8.258 + 68.91 + 0.657 = 77.825（注：此处计算过程基于公式逻辑）


