    \ k = 2)\n\nIn order to demonstrate the formulated clusters from the two aforementioned\
    \ approaches (single and complete linkage), we can plot using the following commands:\n\
    \n*\\# Single linkage result*  \n\nplot(hdata, col = clusters, pch = 15, main\
    \ = \"Single Linkage\") text(hdata, labels = **row.names**(hdata), pos = **c**(4,\
    \ 2, 4, 4, 4))\n\n*\\# Complete linkage result*  \n\nplot(hdata, col = clusters,\
    \ pch = 15, main = \"Complete Linkage\") text(hdata, labels = **row.names**(hdata),\
    \ pos = **c**(4, 2, 4, 4, 4))\n\nThe following figure depicts the two formulated\
    \ clusters for both the cases of single and complete linkage.  \n\n![](Images/image00129.gif)\n\
    \n## **10.2 - Hierarchical Clustering Application and Evaluation**\n\nIn order\
    \ to apply hierarchical clustering into a real world example, we will use the\
    \ dataset europe.txt. This dataset contains statistics regarding the Gross Domestic\
    \ Product (GDP), the Inflation and the Unemployment in 28 EU countries. The first\
    \ 6 entries are presented in the table below:\n\nGDP Inflation Unemployment\n\n\
    Austria 41600 3.5 4.2  \n\nBelgium 37800 3.5 7.2  \n\nBulgaria 13800 4.2 9.6 \
    \ \n\nCroatia 18000 2.3 17.7 Czech Republic 27100 1.9 8.5  \n\nDenmark 37000 2.8\
    \ 6.1  \n\n… … … …\n\nWe will this dataset in order to answer the following questions:\
    \  \n\n(a) Apply hierarchical clustering using complete linkage and plot the respective\
    \ dendrogram (b) Select the appropriate number of clusters based on silhouette\
    \ coefficient\n\n(c) Use the given data in order to form 7 clusters and produce\
    \ the respective dendrogram that illustrates the results  \n\n(d) Create a 3D\
    \ plot of the data using a different color for each cluster  \n\n(e) Calculate\
    \ and plot the silhouette coefficient\n\n### **10.2.1 - Create Hierarchical Clustering\
    \ Model**\n\nAt first, in order to answer (a), we will perform hierarchical clustering\
    \ using the given data. Our initial step involves importing the libraries necessary\
    \ for answering the above questions along with importing the given data. This\
    \ is done using the following commands:\n\n*\\# Import libraries* **library**(cluster)\
    \  \n\n**library**(scatterplot3d)\n\n*\\# Read data from file*  \n\neurope = read.csv(\"\
    europe.txt\")  \n\nAfter reading the given dataset, we scale the data and we compute\
    \ the distance matrix using Eucledean distance as our distance metric.  \n\n*\\\
    # Get distance matrix* d = dist(**scale**(europe))  \n\nAfter the computation\
    \ of the distance matrix, we are ready to perform hierarchical clustering using\
    \ complete linkage.  \n\n*\\# Perform hierarchical clustering using complete linkage*\
    \ hc < hclust(d, method = 'complete')  \n\nWe can plot the respective dendrogram\
    \ (illustrated in the following Figure) using the following command:  \n\n*\\\
    # Plot dendrogram* plot(hc)\n\n### **10.2.2 - Selecting Optimal Number of Clusters**\n\
    \nOur next goal is to determine the optimal number of clusters. Our selection\
    \ will be based on the values of silhouette coefficient which is used as a measure\
    \ of how similar an object is to its own cluster (cohesion) compared to other\
    \ clusters (separation).\n\nIn order to determine the optimal number of clusters,\
    \ we will use the constructed (from question (a)) hierarchical clustering model\
    \ in order to form 2, … , 20 clusters and then select the case that maximizes\
    \ silhouette. The following R code can be used to create the different splits\
    \ and store the silhouette coeffiecient values:\n\n*\\# Initialize a vector that\
    \ will hold the silhouette values*  \n\nslc = **c**()\n\n*\\# Iterate over the\
    \ number of clusters*  \n\n**for** (i **in** 2:20){  \n\n*\\# Create clusters*\
    \  \n\nclusters = cutree(hc, k = i)\n\n*\\# Calculate and store silhouette values*\
    \  \n\nslc \\[i\\-1\\] = **mean**(silhouette(clusters, d)\\[, 3\\])  \n\n}  \n\
    \nAfter the computation of the silhouette values for the different clusterings,\
    \ we can plot them using the following command:  \n\n*\\# Initialize a vector\
    \ that will hold the silhouette values* plot(2:20, slc, type\\=\"b\", xlab\\=\"\
    Number of Clusters\", ylab\\=\"Silhouette\")  \n\nThe following figure depicts\
    \ the mean silhouette values for the different number of clusters. As shown form\
    \ the graph, the optimal number of clusters that maximizes silhouette coefficient\
    \ is 7.\n\n### **10.2.3 - Visualizing Clusters**\n\nIn order to answer question\
    \ (c), we will first use the constructed hierarchical clustering model in order\
    \ to form 7 clusters and then use these clusters to visualize the data of the\
    \ original dataset into a 3D plot.\n\n*\\# Form the 7 clusters*  \n\nclusters\
    \ = cutree(hc, k = 7)  \n\nUusing the aforementioned command, we have split our\
    \ data into 7 clusters. The variable clustersholds the information of how the\
    \ clusters are distributed among the data instances. In order to display the constructed\
    \ clusters on the produced dendrogram, we can use the following commands:  \n\n\
    *\\# Plot dendrogram* plot(hc)  \n\n*\\# Display clusters* rect.hclust(hc, k =\
    \ 7)  \n\nThe following figure is the output of the aforementioned commands, where\
    \ each red rectangle refers to each cluster.  \n\nWe can also create a 3D plot\
    \ of the clusters using the following commands:  \n\n*\\# Plot dendrogram*  \n\
    \ns3d = scatterplot3d(europe, angle = 125, scale.y = 1.5, color = clusters) coords\
    \ < s3d$xyz.convert(europe)  \n\ntext(coords$x, coords$y, labels\\=**row.names**(europe),\
    \ pos\\=**sample**(1:4), col = clusters)\n\n### **10.2.4 - Silhouette Plot**\n\
    \nFinally, in order to calculate and plot the silhouette coefficient (question\
    \ (d)), we can use the following commands:  \n\n*\\# Calculate silhouette*  \n\
    \nmodel\\_silhouette = silhouette(clusters, d)  \n\n*\\# Plot silhouette*  \n\n\
    plot(model\\_silhouette) ![](Images/image00130.gif)\n\n# **Chapter 11 - Density-based\
    \ clustering**\n\nDensity-based clustering is based on the ground truth that given\
    \ a cetrain dataset, clusters can be defined as areas of higher density than the\
    \ remainder of the dataset. Data instances within the sparse areas, which are\
    \ required to separate clusters, are usually considered to be noise. The most\
    \ famous and widely used density-based algorithm is DBSCAN (Density-based Spatial\
    \ Clustering of Applications with Noise)which was introduced by Martin Ester,\
    \ Hans-Peter Kriegel, Jorg Sander and Xiaowei Xu in 1996. The main idea behind\
    \ the DBSCAN algorithm is that given a set of points in some n-dimantional space,\
    \ points that are closely packed together (points with many nearby neighbors and\
    \ thus of higher density) are grouped into clusters, while points that lie alone\
    \ in low-density regions are considered as outliers.\n\n## **11.1 - DBSCAN in\
    \ R**\n\nIn order to use DBSCAN in R, we need to use the cluster library which\
    \ can be imported with the following command:  \n\n**library**(dbscan)  \n\nIn\
    \ order to perform clustering using DBSCAN and get the distribution of the input\
    \ dataset into clusters, we can use the following commands:  \n\n*\\# Perform\
    \ clustering using DBSCAN*  \n\nmodel = dbscan(ddata, eps = 1.0, minPts = 4) \
    \ \n\n*\\# Get distribution of the input dataset into clusters* clusters = model$cluster\
    \  \n\nDBSCAN algorithm requires setting 2 main parameters:  \n\n• epsilon (eps),\
    \ which specifies the maximum distance that two data points can have in order\
    \ to be considered as part of the same cluster.  \n\nand  \n\n• minPoints (minPts),\
    \ which specifies the minimum number of data points required to form a cluster. "
