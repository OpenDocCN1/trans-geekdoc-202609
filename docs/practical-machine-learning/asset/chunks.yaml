    \ for `Outlook`, we build the following frequency arrays:\n\n```r\nabsfreq = table(weather,\
    \ c(1, 4))\nfreq = prop.table(absfreq, 1)\nfreqSum = rowSums(prop.table(absfreq))\n\
    ```\n\nWe calculate the entropy for `Sunny` and `Rainy`:\n`Entropy_Sunny = -freq[\"\
    Sunny\", \"No\"]*log(freq[\"Sunny\", \"No\"]-freq[\"Sunny\", \"Yes\"]*log(freq[\"\
    Sunny\", \"Yes\"])`\n`Entropy_Rainy = -freq[\"Rainy\", \"No\"]*log(freq[\"Rainy\"\
    , \"No\"]-freq[\"Rainy\", \"Yes\"]*log(freq[\"Rainy\", \"Yes\"])`\n\nThe total\
    \ information gain for `Outlook` is computed by:\nGAIN_Outlook = Entropy_All-freqSum[\"\
    Sunny\"]*Entropy_Sunny-freqSum[\"Rainy\"]*Entropy_Rainy`\n\n### 3.2.3 Building\
    \ the Decision Tree\n\nFor question (c), we build a decision tree using `rpart`:\n\
    \n```r\nmodel < rpart(\n  Play ~ Outlook + Temperature + Humidity,\n  method =\
    \ \"class\",\n  data = weather,\n  minsplit = 1,\n  minbucket = 1,\n  cp = -1)\n\
    ```\n\nFurthermore, we can plot the tree with the following command:\n\n```r\n\
    rpart.plot(model, extra = 104, nn = TRUE)\n```\nThe tree is shown in the following\
    \ figure: ![](Images/image0102.gif)\n\n## 3.3 Application with Pruning and Evaluation\
    \ Metrics\n\nA decision tree classifier can also be applied on datasets with continuous\
    \ predictor variables, such as the iris dataset. From the iris dataset, we shall\
    \ only keep the first 2 columns and drop the last 50 instances, so that we now\
