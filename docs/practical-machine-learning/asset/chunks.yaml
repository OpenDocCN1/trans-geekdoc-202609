    \ as maximizing the distance between the hyperplane and the data (margin):\n\n\
    Maximize Margin = 2/||w²||given that f (x) = {1ifw ·x + b ≥ 1,−1ifw ·x + b ≤ 1}\
    \ If the data are not linearly separable, then they can be mapped to a space of\
    \ different (usually larger) dimensionality, in order to make them linearly separable.\n\
    \n### **6.1.2 Support Vector Machines in R**\n\nWe may use the e1071 library to\
    \ build an SVM model in R:  \n\n**library**(e1071)  \n\nWe can execute the commandsvmto\
    \ build a model:  \n\nmodel = svm(y ~ ., data, kernel = \"radial\", type = \"\
    C-classification\")\n\nwhere parameter kernelcontrols which kernel is going to\
    \ be used (one oflinear,polynomial, radial), while we may also define more parameters\
    \ for each kernel, such asdegree,gamma,coef0. By executing?svm, we can see all\
    \ the parameters.\n\nHaving a model, a new instance may be classified using the\
    \ command:  \n\npredict(model, test)\n\nIf we also want to view the probabilities\
    \ for each class, then we have to add the parameter probability = TRUE. Note that\
