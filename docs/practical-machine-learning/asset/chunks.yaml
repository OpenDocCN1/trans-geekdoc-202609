    For applying the k-Medoids algorithm, we will use the data contained in the following
    table: Rank Topic


    | Conference\_1 | Conference\_2 | Conference\_3 | Conference\_4 | Conference\_5
    | Conference\_6 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Rank | Topic | High SE | Low SE | High ML | Low DM | Low ML | High SE |


    The above dataset presents the rank and the topic of 6 different conferences.
    SE stands for Software Engineering, ML for Machine Learning and DM for Data Mining.


    At first, we will construct our data frame containing the above dataset with the
    following


    ```r

    # Vector that holds Rank data

    Rank = c("High", "Low", "High", "Low", "Low", "High")


    # Vector that holds Topic data

    Topic = c("SE", "SE", "ML", "DM", "ML", "SE")


    # Data frame

    conferences = data.frame(Rank, Topic)

    ```


    We can apply k-Medoids using the following commands:


    ```r

    # Import library

    library(cluster)


    # Create k-Medoids model

    model = pam(conferences, 3)

    ```


    We can display the medoids and the distribution of the data instances into clusters
    using the following commands:


    ```r

    # Get medoids

    model$medoids


    # Get distribution of samples into clusters

    model$clustering

    ```


    We can also display the medoids by their names using the following command:


    ```r

    conferences[model$id.med,]

    ```


    Finally, we can plot the data using the following commands:


    ```r

    # Get the different ranks

    L1 = levels(conferences$Rank)


    # Get the different topics

    L2 = levels(conferences$Topic)


    # Plot data

    plot(model$data, xaxt = "n", yaxt = "n", pch = 15, col = model$cluster)


    # Insert axes labels

    axis(1, at = 1:length(L1), labels = L1) axis(2, at = 1:length(L2), labels = L2)


    # Display medoids

    points(conferences[model$id.med,], col = 1:3, pch = "o", cex = 2) ![](Images/image00125.gif)

    ```


    # Chapter 10 - Connectivity-based clustering


    Connectivity-based clustering, also known as hierarchical clustering, is based
    on the core idea that every instance of a given dataset is related with every
    other instance. The main idea behind the aforementioned assumption is that the
    degree of this relation is stronger for the “nearby” objects than to objects farther
    away. The term nearby implies that these algorithms connect data instances to
    form clusters based on their distance. A cluster can be described largely by the
    maximum distance needed to connect parts of the cluster. At different distances,
    different clusters will form, which can be represented using a dendrogram, which
    explains where the common name “hierarchical clustering” comes from: these algorithms
    do not provide a single partitioning of the data set, but instead provide an extensive
    hierarchy of clusters that merge with each other at certain distances.


    ## 10.1 - Hierarchical clustering in R


    ### 10.1.1 - Data Construction


    In order to provide a detailed overview of how hierarchical clustering can be
    performed using dimensional space.


    | X | Y |

    | :--- | :--- |

    | x1 | 2 |

    | x2 | 8 |

    | x3 | 0 |

    | x4 | 7 |

    | x5 | 6 |


    First of all, we need to properly construct our data frame containing the above
    dataset. In order to do so, we can use the following commands:


    ```r

    # Construct vector containing X-axis data

    X = c(2, 8, 0, 7, 6)


    # Construct vector containing Y-axis data

    Y = c(0, 4, 6, 2, 1)


    # Construct vector containing the data labels which correspond to row names

    rownames = c("x1", "x2", "x3", "x4", "x5")


    # Create the data frame

    hdata = data.frame(X, Y, rownames = rownames)

    ```


    Once having created our data frame, we can plot our data using the following commands:


    ```r

    # Plot the data

    plot(hdata, pch = 15)


    # Add the data labels

    text(hdata, labels = rownames, pos = c(4, 2, 4, 4))

    ```


    Our data is illustrated in the following figure: ![](Images/image00126.gif)


    ### 10.1.2 - Hierarchical Clustering using Single and Complete Linkage


    In this subsection, we will perform hierarchical clustering using single and complete
    linkage using the aforementioned dataset. As already noted, hierarchical clustering
    is an iterative process that starts with the individual elements of a given dataset
    in order to progressively form clusters. These clusters are formed by merging
    elements that appear to have a strong connection. This connection is expressed
    using a distance metric. A very common distance metric is the Euclidean distance,
    which is given by the equation: $\|x[1]-x[2]\|=\sqrt{\sum(x[1]-x[2])^2}$


    At first, we will go through the single linkage algorithm: The following table
    presents the matrix for the aforementioned dataset.


    | | x1 | x2 | x3 | x4 | x5 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | x1 | 0 | 7.21 | 6.32 | 5.39 | 4.12 |

    | x2 | 7.21 | 0 | 8.25 | 2.24 | 3.61 |

    | x3 | 6.32 | 8.25 | 0 | 8.06 | 7.81 |

    | x4 | 5.39 | 2.24 | 8.06 | 0 | 1.41 |

    | x5 | 4.12 | 3.61 | 7.81 | 1.41 | 0 |


    As shown in the table, the points `x4` and `x5` are the ones having the smallest
    distance. As result, we link them together and thus formulate our first cluster.


    **2nd iteration:** Since we are using single linkage, the distance between the
    cluster containing the points `x4` and `x5` and every other point is the minimum
    of the distance between this point and the points `x4` and `x5`. The following
    table presents the updated distance matrix.


    | | x1 | x2 | x3 | x4-x5 |

    | :--- | :--- | :--- | :--- | :--- |

    | x1 | 0 | 7.21 | 6.32 | 4.12 |

    | x2 | 7.21 | 0 | 8.25 | 2.24 |

    | x3 | 6.32 | 8.25 | 0 | 7.81 |

    | x4-x5 | 4.12 | 2.24 | 7.81 | 0 |


    Again, using the same strategy, we link the point `x2` with the cluster `(x4 -
    x5)`.


    **3rd iteration:** In the next iteration, the distance matrix is updated again
    and the point `x1` is linked with the cluster `(x2 - x4 - x5)`.


    | | x1-x3 | x2-x4-x5 | x3 |

    | :--- | :--- | :--- | :--- |

    | x1-x3 | 0 | 4.12 | 6.32 |

    | x2-x4-x5 | 4.12 | 0 | 7.81 |

    | x3 | 6.32 | 7.81 | 0 |


    **4th iteration:** Finally, the clustering is completed in the 4th iteration where
    the final point `x3` is linked with the cluster `(x1 - x2 - x4 - x5)`.


    | | x1-x2-x4-x5 | x3 |

    | :--- | :--- | :--- |

    | x1-x2-x4-x5 | 0 | 6.32 |

    | x3 | 6.32 | 0 |


    At this point we will go through the same iterative process again, but for the
    case of complete linkage. The first step is the same as in the case of single
    linkage, where we compute the distance matrix of our original dataset and link
    the points `x4` and `x5` which are the ones having the smallest distance.


    | | x1 | x2 | x3 | x4 | x5 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | x1 | 0 | 7.21 | 6.32 | 5.39 | 4.12 |

    | x2 | 7.21 | 0 | 8.25 | 2.24 | 3.61 |

    | x3 | 6.32 | 8.25 | 0 | 8.06 | 7.81 |

    | x4 | 5.39 | 2.24 | 8.06 | 0 | 1.41 |

    | x5 | 4.12 | 3.61 | 7.81 | 1.41 | 0 |


    **2nd iteration:** As opposed to the case of single linkage, in complete linkage
    the distance between the cluster containing the points `x4` and `x5` and every
    other point is the maximum of the distance between this point and the points `x4`
    and `x5`. The following table presents the updated distance matrix.


    | | x1 | x2 | x3 | x4-x5 |

    | :--- | :--- | :--- | :--- | :--- |

    | x1 | 0 | 7.21 | 6.32 | 5.39 |

    | x2 | 7.21 | 0 | 8.25 | 3.61 |

    | x3 | 6.32 | 8.25 | 0 | 8.06 |

    | x4-x5 | 5.39 | 3.61 | 8.06 | 0 |


    Based on the updated distances, we link the point `x2` with the cluster `(x4 -
    x5)`.


    **3rd iteration:** In the next iteration, the distance matrix is updated again
    and this time the closest points are found to be `x1` and `x3`. As a result, they
    are linked together and formulate the cluster `(x1 - x3)`.


    | | x1-x3 | x2-x4-x5 |

    | :--- | :--- | :--- |

    | x1-x3 | 0 | 5.39 |

    | x2-x4-x5 | 5.39 | 0 |


    **4th iteration:** Finally, the clustering is completed in the 4th iteration where
    the clusters `(x1 - x3)` and `(x2 - x4 - x5)` are linked together.


    ### 10.1.3 - Modeling with R


    We can use the following R command in order to compute the distance matrix.


    ```r

    d = dist(hdata)

    ```


    Have in mind that `hdata` is the already constructed data frame that contains
    our dataset (see Data Construction section).


    We can use R commands in order to perform hierarchical clustering and plot the
    respective dendrogram that illustrates the formulated clusters.


    ```r

    # Perform clustering using single linkage

    hc_single = hclust(d, method = "single")


    # Plot the respective dendrogram

    plot(hc_single)

    ```


    The following figure depicts the produced dengrogram.

