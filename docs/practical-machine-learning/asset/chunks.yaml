  trans: "\n\n# k-Means 算法目的\n\n找到所有样本在聚类中的分布，以最小化每个样本与其所属簇中心之间距离的平方和。该指标对应于类内平方和（Within\
    \ cluster Sum of Squares）—— `WSS` 或 `SSE`，其公式如下：\n\n$$SSE = \\sum_{i=1}^{K} \\\
    sum_{x \\in C[i]} \\|x-m[i]\\|²$$ \n\n为了解决上述优化问题，k-Means 算法包含两个不同的步骤：\n\n1. 给定某些中心点，通过将每个样本分配到最近的类来形成聚类。\n\
    2. 根据形成的聚类计算新的中心点。\n\n在初始化步骤中，算法随机选择 `K` 个样本作为初始中心，然后使用这些中心将每个样本分配到最近的类中。一旦每个样本都被分配到某个类，每个类的新中心将计算为属于该类的所有样本的平均值。持续此此迭代过程，直到连续迭代中聚类不再发生变化。\n\
    \nk-Means 算法最著名且常用的变体是 k-Medoids，它主要用于分类数据，并允许使用各种不同的距离函数。值得注意的是，与 k-Means 不同，k-Medoids\
    \ 始终使用某个样本作为每个类的质点（medoid）。\n\n## 9.1 - R 中的 k-Means\n\n在 R 中执行 k-Means 聚类，我们可以使用以下命令：\n\
    \n```r\n# 执行 k-Means 形成 3 个类\nmodel = kmeans(data, centers = 3)\n```\n\n`centers`\
    \ 参数可以接受初始中心点的数量（即类的数量）或中心点本身作为参数。\n\n我们可以使用以下命令来显示最终质心以及样本在形成的类中的分布：\n\n```r\n\
    # 获取质心\nmodel$centers\n\n# 获取样本在类中的分布\nmodel$cluster\n```\n\n## 9.2 - R 中的 k-Medoids\n\
    \n在 R 中执行 k-Medoids 聚类，我们需要导入 `cluster` 库：\n\n```r\nlibrary(cluster)\n```\n\n\
    然后我们可以使用以下命令：\n\n```r\n# 执行 k-Medoids 形成 3 个类\nmodel = pam(conferences, 3)\n```\n\
    \n我们可以使用以下命令显示最终质点以及样本在形成的类中的分布：\n\n```r\n# 获取质心\nmodel$medoids\n\n# 获取样本在类中的分布\n\
    model$clustering\n```\n\n如果数据集包含分类变量，我们可以使用以下命令通过相应的变量显示质点：\n\n```r\ndata[model$id.med,\
    \ ]\n```\n\n## 9.3 - R 中的聚类评估\n\n为了在 R 中评估我们的聚类结果，可以使用 `cluster` 库，它允许我们轻松地计算若干评估指标。一旦我们完成了聚类并获得了样本在类中的最终分布，就可以计算一组指标来评估结果。其中一些指标如下：\n\
    \n- 紧密度（或类内平方和）\n  $$WSS = \\sum_{i=1}^{K} \\sum_{x \\in C[i]} \\|x-m[i]\\|²$$\n\
    - 分离度（或类间平方和）\n  $$BSS = \\sum_{i=1}^{K} |C[i]|\\|m-m[i]\\|$$\n- 轮廓系数\n  $$Silhouette\
    \ (i) = \\frac{b(i)-a(i)}{\\max\\{a(i), b(i)\\}}$$\n  其中 `a(i)` 是第 i 个样本与同一类内所有其他样本之间的平均距离，`b(i)`\
    \ 是第 i 个样本到任何其他类中样本的最低平均距离（其中 i 不属于该类）。\n\n我们可以使用以下 R 命令计算上述指标：\n\n```r\n# 计算\
    \ WSS\ncohesion = model$tot.withinss\n\n# 计算 BSS\nseparation = model$betweenss\n\
    \n# 计算轮廓系数\nmodel_silhouette = silhouette(model$cluster, dist(data))\n```\n\n\
    在轮廓系数的计算中，`data` 代表原始数据。为了绘制轮廓系数图并计算平均轮廓系数，我们可以使用以下命令：\n\n```r\n# 绘制轮廓图\nplot(model_silhouette)\n\
    \n# 计算平均轮廓系数\nmean(model_silhouette[, 3])\n```\n\n另一种可以为我们提供聚类概述并允许我们评估其性能的方法是构建热图。首先，我们可以使用以下命令对数据样本进行排序：\n\
    \n```r\ndata_ord = data[order(model$cluster), ]\n```\n\n然后构建我们的热图：\n\n```r\nheatmap(as.matrix(dist(data_ord)),\
    \ Rowv = NA, Colv = NA, col = heat.colors(256), revC = TRUE)\n```\n\n下图展示了使用分布在\
    \ 3 个类中的数据样本构建的示例热图。热图的颜色表示排序数据样本的距离。红色表示短距离，黄色表示远距离。\n\n![](img/image00117.jpeg)\n\
    \n## 9.4 - k-Means 聚类概述\n\n下表包含了我们将用于使用 k-Means 算法解决聚类问题的数据集。\n\n| X | Y |\n|---|---|---|\n\
    | x1 | 7 | 1 |\n| x2 | 3 | 4 |\n| x3 | 1 | 5 |\n| x4 | 5 | 8 |\n| x5 | 1 | 3 |\n\
    | x6 | 7 | 8 |\n| x7 | 8 | 2 |\n| x8 | 5 | 9 |\n\n使用上述数据集，我们将回答以下问题：\n\n(a) 在二维空间中绘制数据。\n\
    (b) 应用 k-Means 算法将数据点分配到 3 个类中。使用数据点 `x1`、`x2` 和 `x3` 作为初始中心初始化算法。\n(c) 计算问题 (b)\
    \ 中执行的聚类的紧密度和分离度。\n(d) 使用不同的颜色为包含在每个类的数据点绘制聚类结果，并标记质心。\n\n### 9.4.1 - 数据构建\n\n\
    首先，我们需要妥当地构建包含上述数据集的数据框。为了这样做，我们可以使用以下命令：\n\n```r\n# 构建包含 X 轴数据的向量\nX = c(7, 3,\
    \ 1, 5, 1, 7, 8, 5)\n\n# 构建包含 Y 轴数据的向量\nY = c(1, 4, 5, 8, 3, 8, 2, 9)\n\n# 构建包含标签的向量\n\
    names = c(\"x1\", \"x2\", \"x3\", \"x4\", \"x5\", \"x6\", \"x7\", \"x8\")\n\n\
    # 创建数据框\nkdata = data.frame(X, Y, rownames = names)\n```\n\n创建数据框后，我们可以通过以下方式绘制数据：\n\
    \n```r\n# 绘制数据\nplot(kdata)\n\n# 添加标签\ntext(kdata)\n```\n\n我们的数据如图所示：![](img/image0018.gif\n\
    \n### 9.4.2 - 使用 k-Means 算法聚类\n\n为了回答问题 (b)，我们应用 k-Means 算法，设置数据点 `x1`、`x2` 和\
    \ `x3` 为初始中心。\n\n第一次迭代：首先，我们将计算集中所有数据点与初始中心之间的距离。这些距离如下矩阵所示：\n\n| | x1 | x2 |\
    \ x3 |\n|---|---|---|---|\n| x1 | 0.00 | 5.00 | 7.21 |\n| x2 | 5.00 | 0.00 | 2.24\
