    \ when the log-likelihood value is no longer updated or the updat is smaller than\
    \ a given threshold.\n\n### **12.1.2 - Gaussian Mixture Models - GMMs**\n\nA Gaussian\
    \ Mixture Model is a probabilistic model that assumes all the data points are\
    \ generated from a mixture of a finite number of Gaussian distributions with unknown\
    \ parameters. One can think of mixture models as generalizing k-means clustering\
    \ to incorporate information about the covariance structure of the data as well\
    \ as the centers of the latent Gaussians.\n\nGenerally, a mixture of k normal\
    \ distributions is given by the following equation:  \n\nK  \n\nP (x) =^∑π[k]N\
    \ (x/µ[k], Σ[k])  \n\nk=1  \n\nwhere  \n\nK  \n\nπ[k] : Mixing Coefficients ∈\
    \ \\[0, 1\\] and^∑π[k] = 1  \n\nk=1  \n\nµ[k], Σ[k] : Mean and Covariance of distribution\
    \ k  \n\nN : N (x/µ, Σ) =¹ e^(− 1(x−µ)TΣ−1(x−µ)) 2π^(n/2)|Σ|^(1/2 2)\n\nGMMs use\
    \ EM as the optimization algorithm that enables calculating the latent variables\
    \ of the distributions that describe the goven data. As a result, the EM algorithm\
    \ in the case of GMMs maximizes the following quantity:\n\nN K  \n\nln  \n\nP\
