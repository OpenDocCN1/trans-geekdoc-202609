    \ by the following equation:\n\n$\\lambda[j] P (x_i/\\theta[j]) (P (D_j/x_i))\
    \ = \\lambda[1] P (x_i/\\theta[1]) + \\lambda[2] P (x_i/\\theta[2])$\n\nwhere\
