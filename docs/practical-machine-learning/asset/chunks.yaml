    \ `rpart` command:\n\n```r\nmodel < rpart(Target ~ ., method = \"class\", data\
    \ = ..., minsplit = ..., minbucket = ..., cp = ...)\n```\n\nWe can plot the tree\
    \ using `plot(model)` and `text(model, use.n = TRUE)`, or, alternatively, using\
    \ the following command:\n\n```r\nrpart.plot(model, extra = 104, nn = TRUE)\n\
    ```\n\nIn order to check the parameters of `rpart`, we can run `?rpart`. Additionally,\
    \ if we execute `?rpart.control`, we can also check the main parameters:\n\n-\
    \ `minsplit`: the minimum number of instances in a node so that it is split\n\
    - `minbucket`: the minimum allowed number of instances in each leaf of the tree\n\
    - `maxdepth`: the maximum depth of the tree\n- `cp`: parameter that controls the\
    \ complexity for a split and is set intuitively (the larger its value, the more\
    \ probable to apply pruning to the tree)\n\n## 3.2 Splitting Criteria and Decision\
    \ Tree Construction\n\nTo compute the values of different splitting criteria,\
    \ we will use as an example the training data of the following table, which refer\
    \ to a problem of binary classification.\n\n| Outlook | Temperature | Humidity\
    \ | Play |\n| :--- | :--- | :--- | :--- |\n| Sunny | Hot | High | No |\n| Sunny\
    \ | Hot | Low | No |\n| Rainy | Hot | Low | Yes |\n| Rainy | Cool | High | Yes\
    \ |\n| Rainy | Cool | Low | Yes |\n| Rainy | Hot | Low | No |\n| Rainy | Cool\
    \ | Low | Yes |\n| Sunny | Hot | High | No |\n| Sunny | Cool | Low | Yes |\n|\
    \ Rainy | Hot | Low | Yes |\n| Sunny | Cool | Low | Yes |\n| Rainy | Hot | High\
    \ | Yes |\n| Rainy | Cool | Low | Yes |\n| Sunny | Cool | High | No |\n\nWe are\
    \ going to apply a decision tree algorithm on the above dataset. We will answer\
    \ to the following questions:\n\na) If we split using the Gini index, on which\
    \ feature (out of Outlook, Temperature, and Humidity) should we perform the first\
    \ split?\n\nb) If we split using the Information gain, on which feature (out of\
    \ Outlook, Temperature, and Humidity) should we perform the first split?\n\nc)\
    \ Build the full decision tree using the Gini index. Also, plot the tree.\n\n\
    ### 3.2.1 Data and Library Imports\n\nInitially, we read the data and import the\
    \ required librares:\n\n```r\nweather = read.csv(\"weather.txt\")\nlibrary(rpart)\n\
    library(rpart.plot)\n```\n\n### 3.2.2 Splitting Criteria\n\nTo see the split for\
    \ the variable `Outlook`, we execute the following command:\n\n```r\nmodel < rpart(Play\
