    # Part III - Data Processing


    ## Chapter 7 - Feature Selection


    ### 7.1 Introduction


    What is feature selection? What are filter methods? What are wrapper methods?


    ## 7.2 Filter Methods


    In this section we will use the Correlation Feature Selection (CFS) method to
    select attributes to be used when training and testing the machine learning models.
    We will use the Iris dataset for this purpose.


    ```r

    data = iris

    ```


    # split into training and validation datasets


    ```r

    set.seed(1234)

    ind < sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))

    trainData < data[ind==1,]

    validationData < data[ind==2,]

    ```


    # keep only instances that do not have missing values.


    ```r

    trainData < trainData[complete.cases(trainData),]

    validationData < validationData[complete.cases(validationData),]

    ```


    ### 7.2.1 Using the CFS method


    The CFS method is found in the `FSelector` package and to use it we call `cfsmethod`.


    ```r

    library(FSelector)

    subset < cfs(Species ~ ., trainData)

    f < as.simple.formula(subset, "Species")

    print(f)

    ```


    `Species ~ Petal.Length + Petal.Width` `<environment: 0x114e18a70>`


    The output is a formula that we can use in various classification algorithms and
    says that according to the CFS algorithm and the training dataset, the best features
    in order to predict the Species of the Iris flowers are the Petal Length and the
    Petal Width.


    For example in the Naive Bayes algorithm, we will use both the formula that includes
    all the attributes for predicting the Species and the formula derived from CFS.


    ```r

    library(e1071)

    model < naiveBayes(Species ~ ., data=trainData, laplace = 1)

    simpler_model < naiveBayes(f, data=trainData, laplace = 1)

    pred < predict(model, validationData)

    simpler_pred < predict(simpler_model, validationData)

    ```


    ```r

    library(MLmetrics)

    train_pred < predict(model, trainData)

    train_simpler_pred < predict(simpler_model, trainData)

    paste("Accuracy in training all attributes", Accuracy(train_pred, trainData$Species),
    sep=" - ")

    ```


    `[1] "Accuracy in training all attributes - 0.964285714285714"`


    ```r

    paste("Accuracy in training CFS attributes", Accuracy(train_simpler_pred, trainData$Species),
    sep=" - ")

    ```


    `[1] "Accuracy in training CFS attributes - 0.955357142857143"`


    ```r

    paste("Accuracy in validation all attributes", Accuracy(pred, validationData$Species),
    sep=" - ")

    ```


    `[1] "Accuracy in validation all attributes - 0.947368421052632"`


    ```r

    paste("Accuracy in validation CFS attributes", Accuracy(simpler_pred, validationData$Species),
    sep=" - ")

    ```


    `[1] "Accuracy in validation CFS attributes - 0.973684210526316"`


    The accuracy in the training set is increased when using all the attrbitues, but
    decreased in the validation set in relation to the simpler model that only used
    2 attributes.


    ## 7.2 Wrapper Methods


    ### 7.2.1 Recurrent Feature Elimination


    As a demonstration of a wrapper method, we will use the Recurrent Feature Elimination
    (RFE) method to select attributes in the Pima Indians Diabetes dataset. For this
    purpose the library `caret` will be used.


    First, as always, we will split the dataset in train and validation datasets.


    # ensure the results are repeatable


    ```r

    set.seed(1234)

    ```


    # load the required libraries


    ```r

    library(mlbench)

    library(caret)

    ```


    # load the data


    ```r

    data(PimaIndians)

    data = PimaIndians

    ```


    # split into training and validation datasets


    ```r

    set.seed(1234)

    ind < sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))

    trainData < data[ind==1,]

    validationData < data[ind==2,]

    ```


    # keep only instances that do not have missing values.


    ```r

    trainData < trainData[complete.cases(trainData),]

    validationData < validationData[complete.cases(validationData),]

    ```


    Next we will use the `rfe` function of the `caret` package, setting it up.


    # define the control using nb function


    ```r

    control <- rfeControl(functions=nb, method="cv", number=10)

    ```


    # run the RFE


    ```r

    results <- rfe(trainData[,1:8], trainData$diabetes, ctrl=control)

    ```


    # summarize the results


    ```r

    print(results)

    ```


    `Resampling method: Cross Validation (10 fold)`

    `Variables AccuracySD`

    `1 0.7453 0.3681`

    `2 0.7546 0.4182`

    `3 0.7715 0.4707`

    `4 0.7584 0.4479`

    `5 0.7546 0.4457`

    `6 0.7490 0.4344`

    `7 0.7509 0.4290`

    `8 0.7491 0.4201`

    `The top 3 variables (out of 8):`

    `glucose, age, mass`


    The RFE out of 8 variables selected three (glucose, age, mass) that provided the
    best accuracy under 10-fold cross validation.


    # list the chosen features


    ```r

    predictors(results)

    ```


    `[1] "glucose" "age" "mass"`


    # plot the results


    ```r

    plot(results, type=c("g", "o"))

    ```


    We will use the 3 top variables that come out of RFE in the Naive Bayes algorithm:


    ```r

    library(e1071)

    f < as.formula(paste("diabetes", paste(results$optVariables, collapse=" + "),
    "~ "))

    ```


    `diabetes ~ glucose + age + mass`


    ## Outer parentheses


    Note the usage of the outer parenthesis. We both set the variable f equal to the
    formula and print it to the console.


    ```r

    model < naiveBayes(diabetes ~ ., data=trainData, laplace = 1)

    simpler_model < naiveBayes(f, data=trainData, laplace = 1)

    pred < predict(model, validationData)

    simpler_pred < predict(simpler_model, validationData)

    ```


    ```r

    library(MLmetrics)

    train_pred < predict(model, trainData)

    train_simpler_pred < predict(simpler_model, trainData)

    paste("Accuracy in training all attributes", Accuracy(train_pred, trainData$diabetes),
    sep=" - ")

    ```


    `[1] "Accuracy in training all attributes - 0.760299625468165"`


    ```r

    paste("Accuracy in training RFE attributes", Accuracy(train_simpler_pred, trainData$diabetes),
    sep=" - ")

    ```


