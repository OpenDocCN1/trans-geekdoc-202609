  fmt: "\n# k-Means Algorithm Purpose\n\nFind the distribution of all samples among\
    \ clusters so as to minimize the sum of squares of the distances between each\
    \ sample and the center of the cluster it belongs. This metric corresponds to\
    \ the Within cluster Sum of Squares – `WSS` or `SSE` and is given by the following\
    \ formula:\n\n^(K ∑) ‖x−m[i]‖²SSE =^∑  \ni−1 x∈C[i]  \n\nIn order to solve the\
    \ aforementioned optimization problem, k-Mean algorithm involves two distinc steps:\
    \  \n\n1. Given certain centers, formulate clusters by assigning each sample to\
    \ the closest cluster. \n2. Calculate the new centers based on the formulate clusters.\n\
    \nIn the initialization step, the algorithm randomly selects `K` samples as the\
    \ initial centers and then using these centers assigned each sample in the closest\
    \ cluster. Once every sample has been assigned to a certain cluster, the new center\
    \ of each cluster is calculated as the mean of every sample that belongs to the\
    \ cluster. This iterative process is continued until there is no change in the\
    \ clusters in consecutive iterations.\n\nThe most famous and used variation of\
    \ the k-Means algorithm is k-Medoids, which is mainly used for categorical data\
    \ and allows the use of various different distance functions. It is worth noticing\
    \ that unlike k-Means, k-Medoids always uses a certain sample as the medoid of\
    \ each cluster.\n\n## 9.1 - k-Means in R\n\nFor performing k-Means clustering\
    \ in R, we can use the following command:  \n\n```r\n# Perform k-Means to form\
    \ 3 clusters\nmodel = kmeans(data, centers = 3)\n```\n\nThe `centers` parameter\
    \ can either take the number of the initial centers (and thus the number of clusters)\
    \ or the centers themselves as argument.  \n\nWe can use the following commands\
    \ in order to show the final centroids and the distribution of the samples into\
    \ the formulated clusters:  \n\n```r\n# Get centroids\nmodel$centers\n\n# Get\
    \ distribution of samples into clusters\nmodel$cluster\n```\n\n## 9.2 - k-Medoids\
    \ in R\n\nIn order to perform k-Medoids clustering in R, we need to import the\
    \ library `cluster`:  \n\n```r\nlibrary(cluster)\n```\n\nand then we can use the\
    \ following command:  \n\n```r\n# Perform k-Medoids to form 3 clusters\nmodel\
    \ = pam(conferences, 3)\n```\n\nWe can use the following commands in order to\
    \ show the final medoids and the distribution of the samples into the formulated\
    \ clusters:  \n\n```r\n# Get centroids\nmodel$medoids\n\n# Get distribution of\
    \ samples into clusters\nmodel$clustering\n```\n\nIf the dataset contains categorical\
    \ variables, then we can show the medoids using the respective variable with the\
    \ following command:  \n\n```r\ndata[model$id.med, ]\n```\n\n## 9.3 - Clustering\
    \ Evaluation in R\n\nIn order to evaluate our clustering in R, we can use the\
    \ library `cluster` which enables us to easily calculate several evaluation metrics.\
    \ Once we have perform the clutering and get the final distribution of the samples\
    \ into the clusters, then we can compute a list of metrics that enable us evaluate\
    \ the result. Some of those metrics are the following:\n\n- Cohesion (or within-cluster\
    \ sum of squares)\n  ^(K ∑) ‖x−m[i]‖²W SS =^∑  \n  i−1 x∈C[i]  \n- Separation\
    \ (or between-cluster sum of squares)\n  ^(K 2)BSS =^∑|C[i]|‖m−m[i]‖  \n  i−1\
    \  \n- Silhouette coefficient\n  Silhouette (i) = b(i)a(i) max{a(i), b(i)}\n \
    \ where `a(i)` is the average distance between thei-thsample and all other samples\
    \ within the same cluster and `b(i)` is the lowest average distance of thei-thsample\
    \ to all samples in any other clusters, of which `i` is not a member.\n\nWe can\
    \ compute the aforementioned metrics using the following R commands:  \n\n```r\n\
    # Compute WSS\ncohesion = model$tot.withinss\n\n# Compute BSS\nseparation = model$betweenss\n\
    \n# Compute Silhouette\nmodel_silhouette = silhouette(model$cluster, dist(data))\n\
    ```\n\nIn the computation of silhouette coefficient, `data` stands for the original\
    \ data. In order to plot the silhouette coeffiecient and the mean silhouette we\
    \ can use the following commands:  \n\n```r\n# Plot Silhouette\nplot(model_silhouette)\n\
    \n# Compute mean silhouette\nmean(model_silhouette[, 3])\n```\n\nAnother way that\
    \ can provide us with an overview of the clustering and enables us to evaluate\
    \ its performance is the construction of heatmaps. At first, we can order out\
