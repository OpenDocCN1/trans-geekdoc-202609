  fmt: "\nGiven $\\theta[old]$ : find $P (Z/X, \\theta[old])$\n\nM-step:\n\n$\\theta[new]\
    \ = argmax_{\\theta}(\\^sum P (Z/X, \\theta[old]) \\ln P (X, Z/\\theta))$\n\n\
    $Z$\n\nThe EM algorithm reaches convergence when the log-likelihood value is no\
    \ longer updated or the update is smaller than a given threshold.\n\n## 12.1.2\
    \ - Gaussian Mixture Models - GMMs\n\nA Gaussian Mixture Model is a probabilistic\
    \ model that assumes all the data points are generated from a mixture of a finite\
    \ number of Gaussian distributions with unknown parameters. One can think of mixture\
    \ models as generalizing $k$-means clustering to incorporate information about\
    \ the covariance structure of the data as well as the centers of the latent Gaussians.\n\
    \nGenerally, a mixture of $k$ normal distributions is given by the following equation:\n\
    \n$K$\n\n$P (x) = \\sum_{k=1}^{K} \\pi[k]N (x/\\mu[k], \\Sigma[k])$\n\nwhere\n\
    \n$K$\n\n$\\pi[k]$ : Mixing Coefficients $\\in [0, 1]$ and $\\sum_{k=1}^{K} \\\
    pi[k] = 1$\n\n$\\mu[k], \\Sigma[k]$ : Mean and Covariance of distribution $k$\n\
    \n$N : (x/\\mu, \\Sigma) = e^{-1/2(x-\\mu)^T\\Sigma^{-1}(x-\\mu)} (2\\pi^{n/2}|\\\
    Sigma|^{1/2})$\n\nGMMs use EM as the optimization algorithm that enables calculating\
    \ the latent variables of the distributions that describe the given data. As a\
    \ result, the EM algorithm in the case of GMMs maximizes the following quantity:\n\
    \n$N K$\n\n$\\ln P (X / \\pi, \\mu, \\Sigma) = \\sum_{n=1}^{N} \\sum_{k=1}^{K}\
    \ (\\pi[k]N (x[n]/\\mu[k], \\Sigma[k]))$\n\nwhere $X = \\{x[1], x[2], \\dots,\
    \ x[n]\\} \\rightarrow$ Given dataset\n\n## 12.2 - Modeling Gaussian Mixture Models\
