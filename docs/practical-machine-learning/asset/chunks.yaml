    \n我们可以通过以下命令查看混淆矩阵并计算有用的指标（问题 (b)）：\n\n```r\nConfusionMatrix(ytest, pred)\nPrecision(ytest,\
    \ pred, \"democrat\") \nRecall(ytest, pred)\n```\n\n绘制 ROC 曲线（问题 (c））最初需要使用以下命令计算\
    \ TPR 和 FRP：\n\n```r\npred_obj = prediction(predprob[,1], ytest, label.ordering\
    \ = c(\"republican\", \"demo crat\"))\nROCcurve < performance(pred_obj, \"tpr\"\
    , \"fpr\")\n```\n\n如果我们绘制 `ROCcurve` 对象，我们将看到 TPR 和 FRP 以及相应的阈值。最后，我们可以如下所示绘制曲线：\n\
    \n```r\nplot(ROCcurve, col = \"blue\") \nabline(0,1, col = \"grey\")\n```\n\n\
    并使用命令寻找曲线下的面积：`performance(pred_obj, \"auc\")` ![](img/image00103.gif)![](img/image00095.gif)\n\
    \n## ROC 曲线\n\n在统计学中，受者工作特征（ROC）或 ROC 曲线是一种图形，用于说明二分类系统的性能随判别阈值变化而变化。该曲线通过绘制在不同阈值设置下的真阳性率（TPR）相对于假阳性率（FPR）来创建。\n\
    \nROC 曲线展示了以下几点：\n\n* 它显示了敏感性与特异性之间的权衡（敏感性的任何增加都会伴随着特异性的下降）。\n* 曲线越接近 ROC 空间的左侧边界然后是顶部边界，分类器就越准确。\n\
    * 曲线越接近 ROC 区域的 45 度对角线，测试的准确性越低。\n* 切点处切线的斜率给出了该测试值的似然比（LR）。\n* 曲线下的面积是文本准确性的衡量标准。这将在下一节中进一步讨论。\n\
    \n准确率通过 ROC 曲线下的面积来衡量。面积为 1 代表完美的测试；面积为 .5 代表无用的测试。分类诊断测试准确性的粗略指南是传统的学术分值制：\n\n\
    * .90-1 = 优秀 (A)\n* .80-.90 = 良好 (B)\n* .70-.80 = 中等 (C)\n* .60-.70 = 差 (D)\n\
    * .50-.60 = 不及 (F)\n\n# 第 5 章 - k-近邻分类\n\n## 5.1 引言\n\n### 5.1.1 k-最近邻简介\n\nk-最近邻\
    \ (kNN) 是一种机器学习算法，其中对新实例的预测取决于其 k 个最近的实例。因此，新实例的类别是根据其 k 个最近实例的类别通过多数投票决定的。\n\n\
    ### 5.1.2 R 语言中的 k-最近邻\n\n我们可以使用 `class` 库在 R 中应用 kNN 模型：\n\n```r\nlibrary(class)\n\
    ```\n\n可以使用 `knn` 命令对新实例进行分类：\n\n```r\nknn(X_train, X_test, Y_train, k = 1, prob\
    \ = TRUE)\n```\n\n其中我们必须提供训练数据（`X_train`, `Y_train`）、新实例（`X_test`）以及 `k` 的值。\n\
    \n## k-最近邻模型的构建与分类\n\n我们将使用以下数据进行二分类问题：\n\n```r\n# 导入数据\nknata = read.table\n\
    ```\n\n### 5.2 k-最近邻算法\n\n我们将回答以下问题：\n\na) 为不同类别绘制数据。\nb) 使用 `k = 1` 时，使用 kNN\
    \ 分类，其类别是什么？\nc) 使用 `k = 5` 重复 (b)。\nd) 使用 `k = 1` 时，使用 kNN 分类其类别是什么？\n\n### 5.2.1\
    \ 数据处理\n\n最初，我们读取数据：\n\n```r\nknata = read.table(\"knata\")\n```\n\n### 5.2.2\
    \ 算法\n\n最初我们划分数据集：\n\n```r\nX_train = knata[,1:2]\nY_train = knata[,3]\n```\n\n\
    对于问题 (a)，我们执行命令：\n\n```r\nplot(X_train, col = Y_train)\n```\n![](img/image0010.gif)\n\
    \n当 `k = 1` 时，我们需要找到：\n\n```r\nknn(X_train, X_test, Y_train)\n```\n\n对于问题 (b)，我们使用：\n\
    \n```r\nlibrary(class)\n```\n\n当 `k = 5` 时，我们需要找到：\n\n```r\nknn(X_train, X_test,\
    \ Y_train)\n```\n\n## 5.3 k-最近邻真实世界示例\n\n在本节中我们将使用乳腺癌数据集![](img/image0095.gif\n\
    \n## 乳腺癌（原始）数据集\n\n在本节中，我们将对 UCI 机器学习库的 `breast-cancer.data` 文件应用 k-NN。\n\n###\
    \ 5.3.1 数据处理\n\n首先，我们将数据集加载为数据框。假设当前工作目录位于数据集所在的目录。要检查 `read.table` 函数的文档，请使用\
    \ `read.table`。此外，从数据集说明可以看出缺失值用 `?` 表示。接下来我们将数据集分为训练集和验证集。加载和划分数据集的步骤如下：\n\n\
    ```r\nrm(list=ls()) # 下载数据集\nfileURL <- \"http://archive.ics.uci.edu/ml/machine-learning-databases/breast-cancer-consin/breast-cancer.data.data\"\
    .download.file(fileURL, destfile=\"breast-data.data=\" method=\"curl\") # 读取数据\n\
    data <- read.table(\"breast-cancer.data\", na.strings = \"?\", sep=\",\") # 移除\
    \ id 列\n# 为列命名（属性）\nnames(data) <- c(\"ClumpThickness\", \"UniformityCellSize\"\
    , \"UniformityCellShape\", \"MarginalAdhesion\", \"SingleEpithelialCellSize\"\
    , \"BareNuclei\", \"BlandChromatin\", \"NormalNucleoli\", \"Mitoses\", \"Class\"\
    ) # 将类别转换为因子\ndata$Class <- factor(data$Class, levels=c(2,4), labels=c(\"benign\"\
    , \"malignant\")) # 设置种子\nset.seed(1234) # 划分数据集\nind <- sample(2, nrow(iris),\
    \ replace=TRUE, prob=c(0.7, 0.3))\ntrainData <- data[ind==1,]\nvalidationData\
    \ <- data[ind==2,]\n```\n\n### 5.3.2 训练与预测\n\n我们像之前一样加载 k-NN 算法。\n\n"
