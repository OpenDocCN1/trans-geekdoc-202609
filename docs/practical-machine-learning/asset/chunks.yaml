    \ 到 10 之间，因此不需要在 0 到 1 之间进行归化，因为在 `kNN` 的距离计算中没有任何属性会主导其他属性。由于 `kNN` 接受不包含目标列的训练和测试数据集（作为第三个参数），我们将进行一些数据处理，使数据符合\
    \ `knn` 函数的格式（可以通过 `?knn` 查看帮助文档）。此外，由于 `kNN` 不允许存在缺失值，让我们把它们也删掉。\n\n`trainData\
    \ < trainData[complete.cases(trainData),]` \n\n`validationData < validationData[complete.cases(validationData),]`\
    \ \n`trainDataX < trainData[,-ncol(trainData)]` \n\n`trainDataY < trainData$Class`\
    \ \n\n`validationDataX < validationData[,-ncol(trainData)]` \n\n`validationDataY\
    \ < validationData$Class`\n\n让我们进行预测吧，因为在使用 `kNN` 时不需要训练。训练实例即为模型。\n\n`prediction\
    \ = knn(trainDataX, validationDataX, trainDataY, k = 1)` 你可以尝试不同的 `k` 值来寻找更好的模型。\n\
    \n### 5.3.3 评估\n\n对验证集进行预测并打印混淆矩阵：\n\n```r\ncat (\"Confusion matrix:\\n\") \n\
    xtab = table(prediction, validationData$Class) \nprint(xtab) \ncat(\"\\nEvaluation:\\\
    n\\n\")\naccuracy = sum(prediction == validationData$Class)/length(validationData$Class)\
    \ \nprecision = xtab[1,1]/sum(xtab[,1]) \nrecall = xtab[1,1]/sum(xtab[1,]) \n\
    f = 2 * (precision * recall) / (precision + recall) \ncat(paste(\"Accuracy:\\\
    t\", format(accuracy, digits=2), \"\\n\",sep=\" \")) \ncat(paste(\"Precision:\\\
    t\", format(precision, digits=2), \"\\n\",sep=\" \")) \ncat(paste(\"Recall:\\\
    t\\t\", format(recall, digits=2), \"\\n\",sep=\" \")) \ncat(paste(\"F-measure:\\\
    t\", format(f, digits=2), \"\\n\",sep=\" \"))\n```\n\n输出结果：\n\n```text\nConfusion\
    \ matrix: \nprediction benign malignant \nbenign 99 4 \nmalignant 6 60 \n\nEvaluation:\n\
    Accuracy: 0.94 \nPrecision: 0.94 \nRecall: 0.94\nF-measure: 0.95\n```\n\n### 5.3.4\
    \ 交叉验证\n\n为了执行交叉验证，我们将使用 `caret` 包。在这里你可以找到一份快速指南。\n\n#### 5.3.4.1 将数据分为两组\n\n\
    `createDataPartition` 函数对数据进行分层划分。这与我们之前的的操作类似（但之前没有分层）。我们将使用 `train` 函数来构建 `kNN`\
    \ 模型。\n\n```r\nlibrary(caret)\nlibrary(mlbench)\ndata(Sonar)\ninTrain <- createDataPartition(y\
    \ = Sonar$Class, p = .75, list = FALSE)\ntraining <- Sonar[inTrain,]\ntesting\
    \ <- Sonar[-inTrain,]\nkNNFit <- train(Class ~ ., data = training, method = \"\
