    \ a new instance is determined by majority vote given the class of its k nearest\
    \ instances.\n\n### **5.1.2 k-Nearest Neighbors in R**\n\nWe may use the class\
    \ library to apply the kNN model in R:  \n\n**library**(**class**)  \n\nA new\
    \ instance may be classified using the commandknn:  \n\nknn(X\\_train, X\\_test,\
