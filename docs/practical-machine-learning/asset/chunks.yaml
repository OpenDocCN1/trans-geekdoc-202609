    \ P (x_i/\\theta[2])$\n\n其中 $j = 1, 2$， $\\lambda = \\{\\lambda[1], \\lambda[2]\\\
    } = \\{0.5, 0.5\\}$\n\n### 12.2.3 - 使用 R 计算正态分布的参数\n\n```r\n# 初始化\nmu = c(0, 1)\n\
    lambda = c(0.5, 0.5)\n# 设置停止标准\nepsilon = 1e-08\n# 计算初始对数似然\nlog_likelihood =\
    \ sum(log(lambda[1] * dnorm(x, mean = mu[1], sd = 1) + lambda[2] * dnorm(x, mean\
    \ = mu[2], sd = 1)))\n\nrepeat {\n  # ------ 期望步 -----\n  # 根据 mu, lambda (以及\
    \ sigma) Find 分布\n  T1 = dnorm(x, mean = mu[1], sd = 1)\n  T2 = dnorm(x, mean\
    \ = mu[2], sd = 1)\n  P1 = lambda[1] * T1 / (lambda[1] * T1 + lambda[2] * T2)\n\
    \  P2 = lambda[2] * T2 / (lambda[1] * T1 + lambda[2] * T2)\n\n  # ------ 最大化步\
    \ -----\n  # 给定分布找到 mu, lambda (以及 sigma)\n  mu[1] = sum(P1 * x) / sum(P1)\n \
    \ mu[2] = sum(P2 * x) / sum(P2)\n  lambda[1] = mean(P1)\n  lambda[2] = mean(P2)\n\
    \n  # 计算新的对数似然（待最大化）\n  new_log_likelihood = sum(log(lambda[1] * dnorm(x, mean\
    \ = mu[1], sd = 1) + lambda[2] * dnorm(x, mean = mu[2], sd = 1)))\n\n  # 打印当前参数和对数似然值\n\
    \  cat(\"mu =\", mu, \" lambda =\", lambda, \" log_likelihood =\", new_log_likelihood,\
    \ \"\\n\")\n\n  # 如果算法收敛则停止\n  if (new_log_likelihood - log_likelihood <= epsilon)\
    \ break\n  log_likelihood = new_log_likelihood\n}\n```\n\n### 12.2.4 - 使用 mixtools\
    \ 构建 GMMs 模型\n\n"
