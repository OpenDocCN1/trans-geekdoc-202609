    \n- `minsplit`: 节点进行拆分所需的最少实例数量\n- `minbucket`: 树的每个叶子节点中允许的最少实例数量\n- `maxdepth`:\
    \ 树的最大深度\n- `cp`: 控制分裂复杂性的参数，其设置非常直观（值越大，对树进行剪枝的概率越高）\n\n## 3.2 分裂标准与决策树构建\n\n\
    为了计算不同分裂标准的数值，我们将使用下表中的训练数据作为示例，该表涉及一个二分类问题。\n\n| Outlook (天气) | Temperature (温度)\
    \ | Humidity (湿度) | Play (是否玩) |\n| :--- | :--- | :--- | :--- |\n| Sunny | Hot\
    \ | High | No |\n| Sunny | Hot | Low | No |\n| Rainy | Hot | Low | Yes |\n| Rainy\
    \ | Cool | High | Yes |\n| Rainy | Cool | Low | Yes |\n| Rainy | Hot | Low | No\
    \ |\n| Rainy | Cool | Low | Yes |\n| Sunny | Hot | High | No |\n| Sunny | Cool\
    \ | Low | Yes |\n| Rainy | Hot | Low | Yes |\n| Sunny | Cool | Low | Yes |\n|\
    \ Rainy | Hot | High | Yes |\n| Rainy | Cool | Low | Yes |\n| Sunny | Cool | High\
    \ | No |\n\n我们将对上述数据集应用决策树算法。我们将回答以下问题：\n\na) 如果使用 G 尼 指数（Gini index）进行分裂，应该在哪个特征（天气、温度或湿度之间）上进行第一次分裂？\n\
    \nb) 如果使用信息增益（Information gain）进行分裂，应该在哪个特征（天气、温度或湿度之间）上进行第一次分裂？\n\nc) 使用 G 尼\
    \ 指数构建完整的决策树。并绘制该树。\n\n### 3.2.1 数据与库导入\n\n最初，我们读取数据并导入所需的库：\n\n```r\nweather\
    \ = read.csv(\"weather.txt\")\nlibrary(rpart)\nlibrary(rpart.plot)\n```\n\n###\
    \ 3.2.2 分裂标准\n\n为了查看变量 `Outlook`（天气）的分裂，我们执行以下命令：\n\n```r\nmodel < rpart(Play\
    \ ~ Outlook, method = \"class\", data = weather, minsplit = 1)\n```\n\n如果我们也对温度和湿度运行此命令，然后使用\
    \ `rpart.plot(model, extra = 104, nn = TRUE)` 绘制所有三个，将提供以下可视化结果：\n\n![](img/image00101.gif)\n\
    \n直观上，我们已经可以理解这三个分裂中将选择哪一个，对吧？\n\n#### 3.2.2.1 G 尼 指数\n\n我们使用以下公式计算 `Outlook`\
    \ 的 G 尼 指数：\n\n`GINI(Sunny) = 1-Freq(Play = No|Outlook = Sunny)² -Freq(Play =\
    \ Yes|Outlook = Sunny)²`\n\n`GINI(Rainy) = 1-Freq(Play = No|Outlook = Rainy)²\
    \ -Freq(Play = Yes|Outlook = Rainy)²`\n\n`GINI[Outlook] = Freq(Outlook = Sunny)*GINI(Sunny)\
    \ + Freq(Outlook = Rainy)*GINI(Rainy)`\n\n计算结果为：\n`GINI(Sunny) = 1-(4/6)²-(2/6)²\
    \ = 0.444`\n`GINI(Rainy) = 1-(1/8)²-(7/8)² = 0.219`\n`GINI[Outlook] = (6/14)*0.444\
    \ + (8/14)*0.219 = 0.315`\n\n同样，温度和湿度的 GNI 分别为 `GINI[Temp.] = 0.367` 和 `GINI[Hum.]\
    \ = 0.394`。因此，回答问题 (a)，使用 G 尼 指数的最佳分裂是在 `Outlook` 上。我们也可以使用 R 进行这些计算。对于 `Outlook`，我们构建以下频率数组：\n\
    \n```r\nabsfreq = table(weather, c(1, 4))\nfreq = prop.table(absfreq, 1)\nfreqSum\
    \ = rowSums(prop.table(absfreq))\n```\n\n我们计算 `Sunny` 和 `Rainy` 的 G 尼 指数：\n`GINI_Sunny\
    \ = 1-(4/6)²-(2/6)²`\n`GINI_Rainy = 1-(1/8)²-(7/8)²`\n\n`Outlook` 的总 G 尼 计算公式为：\n\
    `GINI_Outlook = freqSum[\"Sunny\"]*GINI_Sunny + freqSum[\"Rainy\"]*GINI_Rainy`\n\
    \n#### 3.2.2.2 信息增益\n\n我们使用以下公式计算 `Outlook` 的信息增益：\n\n`Entropy(All) = -Freq(No)*log(No)-Freq(Yes)*log(Yes)`\n\
    `Entropy(Sunny) = -Freq(No|Sunny)*log(No|Sunny)-Freq(Yes|Sunny)*log(Yes|Sunny)`\n\
    `Entropy(Rainy) = -Freq(No|Rainy)*log(No|Rainy)-Freq(Yes|Rainy)*log(Yes|Rainy)`\n\
    `GAIN[Outlook] = Entropy(All)-Freq(Sunny)*Entropy(Sunny)-Freq(Rainy)*Entropy(Rainy)`\n\
    \n计算结果为：\n`Entropy(All) = -(5/14)*log(5/14)-(9/14)*log(9/14) = 0.652`\n`Entropy(Sunny)\
    \ = -(4/6)*log(4/6)-(2/6)*log(2/6) = 0.637`\n`Entropy(Rainy) = -(1/8)*log(1/8)-(7/8)*log(7/8)\
    \ = 0.377`\n`GAIN[Outlook] = 0.652-(6/14)*0.637+(8/14)*0.377 = 0.164`\n\n同样，温度和湿度的信息增益分别为\
    \ `GAIN[Temp.] = 0.105` 和 `GAIN[Hum.] = 0.071`。因此，回答问题 (a)，使用信息增益的第一次分裂是在 `Outlook`\
    \ 上。我们也可以使用 R 进行这些计算。最初，我们计算数据集的总体熵：\n\n```r\nfreq = prop.table(table(weather,\
    \ c(4)))\nEntropy_All = freq[\"No\"]*log(freq[\"No\"])+freq[\"Yes\"]*log(freq[\"\
    Yes\"])\n```\n\n然后，对于 `Outlook`，我们构建以下频率数组：\n\n```r\nabsfreq = table(weather,\
    \ c(1, 4))\nfreq = prop.table(absfreq, 1)\nfreqSum = rowSums(prop.table(absfreq))\n\
    ```\n\n我们计算 `Sunny` 和 `Rainy` 的熵：\n`Entropy_Sunny = -freq[\"Sunny\", \"No\"]*log(freq[\"\
    Sunny\", \"No\"]-freq[\"Sunny\", \"Yes\"]*log(freq[\"Sunny\", \"Yes\"])`\n`Entropy_Rainy\
    \ = -freq[\"Rainy\", \"No\"]*log(freq[\"Rainy\", \"No\"]-freq[\"Rainy\", \"Yes\"\
    ]*log(freq[\"Rainy\", \"Yes\"])`\n\n`Outlook` 的总信息增益计算为：\n`GAIN_Outlook = Entropy_All-freqSum[\"\
    Sunny\"]*Entropy_Sunny-freqSum[\"Rainy\"]*Entropy_Rainy`\n\n### 3.2.3 构建决策树\n\n\
    对于问题 (c)，我们使用 `rpart` 构建一个决策树：\n\n```r\nmodel < rpart(\n  Play ~ Outlook + Temperature\
    \ + Humidity,\n  method = \"class\",\n  data = weather,\n  minsplit = 1,\n  minbucket\
    \ = 1,\n  cp = -1)\n```\n\n此外，我们可以使用以下命令绘制树：\n\n```r\nrpart.plot(model, extra\
    \ = 104, nn = TRUE)\n```\n树如图所示：![](img/image0102.gif)\n\n## 3.3 剪枝与评估指标的应用\n\n\
    决策树分类器也可以应用于具有连续预测变量的数据集，例如 iris（鸢）数据集。从 iris 数据集中，我们将只保留前 2 列并丢弃最后 50 个实例，这样我们现在就有两个预测特征和一个目标类别的二分类问题。我们可以在\
    \ R 中如下执行这些转换：\n\n```r\niris2 = iris[, c(1, 2, 5)]\niris2$Species[101:150] = iris2$Species[21:70]\n\
    iris2$Species = factor(iris2$Species)\n```\n\n之后，我们将数据集分为训练数据和测试数据：\n\n```r\n\
    trainingdata = iris2[, c(1:40, 51:90, 101:140)]\ntestdata = iris2[, c(41:50, 91:100,\
    \ 141:150)]\n```\n\n我们将回答以下问题：\n\na) 使用训练数据构建决策树（`rpart` 的 `minsplit` 参数设置为 20，这是默认值）。\n\
    \nb) 将模型应用于测试数据，并计算这两个类的精确率、召回率和 F 值。\n\nc) 构建两个决策树，一个 `minsplit` 设置为 10，另一个 `minsplit`\
    \ 设置为 30，将它们应用于测试数据，并计算这两个类的精确率、召回率和 F 值。d) 根据给出的 versicolor 类的 F 值比较这三个模型。\n\n\
    ### 3.3.1 决策树的训练与测试\n\n我们使用以下命令训练并绘制决策树（问题 (a), (c)）：\n\n```r\nmodel < rpart(\n\
    \  Species ~ .,\n  method = \"class\",\n  data = trainingdata,\n  minsplit = 20)\n\
    \nrpart.plot(model, extra = 104, nn = TRUE)\n```\n"
