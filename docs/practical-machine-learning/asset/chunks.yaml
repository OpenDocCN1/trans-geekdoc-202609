    ```\n\n```r\nrowSums(m2)\n```\n\n```\n## [1] 6 15 24 6 15 24\n```\n\n```r\ncolSums(m2)\n\
    ```\n\n```\n## [1] 24 30 36\n```\n\n```r\nmean(m2)\n```\n\n```\n## [1] 5\n```\n\
