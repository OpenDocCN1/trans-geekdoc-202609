    ### 10.2.1 - 创建层次聚类模型


    首先，为了回答问题 (a)，我们将使用给定数据执行层次聚类。我们的初始步骤包括导入回答上述问题所需的库以及导入给定数据。通过以下命令完成：


    ```r

    # 导入库

    library(cluster)


    # 从文件读取数据

    europe = read.csv("europe.txt")


    # 获取距离矩阵

    d = dist(scale(europe))


    # 执行层次聚类

    hc = hclust(d, method = ''complete'')


    # 绘制聚类图

    plot(hc)

    ```


