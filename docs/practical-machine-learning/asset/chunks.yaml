    \ system as its discrimination threshold is varied. The curve is created by plotting\
    \ the true positive rate (TPR) against the false positive rate (FPR) at various\
    \ threshold settings\n\nAn ROC curve demonstrates several things:\n\n• It shows\
    \ the tradeoff between sensitivity and specificity (any increase in sensitivity\
    \ will be accompanied by a decrease in specificity).  \n\n• The closer the curve\
    \ follows the left-hand border and then the top border of the ROC space, the more\
