    | x1-x3 | 0 | 4.12 | 6.32 |

    | x2-x4-x5 | 4.12 | 0 | 7.81 |

    | x3 | | | |


    .4：：： |4 迭代中，点 `x1` 与聚类 `(x2 - x4 - x5)` 连接。


    | | x1-x3 | x2-x4-x5 | x3 |

