    \ ]\n```\n\nand then constuct our heatmap\n\n```r\nheatmap(as.matrix(dist(data_ord)),\
    \ Rowv = NA, Colv = NA, col = heat.colors(256), revC = TRUE)\n```\n\nThe following\
    \ figure illustrates a sample heatmap constructed by using data samples that are\
