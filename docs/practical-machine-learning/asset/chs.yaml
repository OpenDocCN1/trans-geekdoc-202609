  \ | F | Sedan | Medium Yes Yes |\n| 19 | F | Sedan | Medium Yes Yes |\n| 20 | F\
  \ | Sedan | High Yes Yes |\n\n计算以下内容的 Gini 指数：\na) 所有训练实例\nb) 特征 `CustomerID`\n\
  c) 特征 `Sex`\nd) 使用多路划分的征 `CarType`\ne) 使用多路划分的征 `Budget`\n\n根据 Gini 指数，这些哪一个应该用于第一次划分？提示问题：解释为什么\
  \ `CustomerID` 虽然具有最低的 Gini 指数，但不应该被作为划分特征。\n\n# 第 4 章 - 朴素贝叶斯分类\n\n## 4.1 引言\n\n\
  ### 4.1.1 朴素贝叶斯简介\n\n朴素贝叶斯是一种基于贝叶斯定理以及数据集特征间相互独立假设的机器学习算法。给定一个具有一组特征 `x[1]`, `x[2],\
  \ . . . , x[n]` 和一个类别特征 `c` 的数据集，贝叶斯定理定义实例 `{x[1], x[2], . . . , x[n]}` 属于 `c` 的概率为概率\
  \ `P (x[1]|c)`、`P (x[2]|c), . . . , P (x[n]|c)` 的组合：\n\n`P (x[1]|c)·P (x[2]|c)·\
  \ . . . ·P (x[n]|c)·P (c)[P (c|x) = P(x1)·P(x2)· . . . ·P(xn)]`\n\n其中我们注意到，特征集的概率是由它们的乘积给出的，因为它们的值彼此之间是相互独立的。\n\
  \n### 4.1.2 R 中的朴素贝叶斯\n\n我们可以使用 `e1071` 库在 R 中构建概率朴素贝叶斯模型：\n\n```r\nlibrary(e1071)\n\
  ```\n\n构建模型需要执行 `naiveBayes` 命令：\n\n```r\nmodel < naiveBayes(Target ~ ., data =\
  \ ...)\n```\n\n参数 `laplace` 用于拉普拉斯平滑。\n\n给定一个训练好的模型，我们可以使用以下命令预测新实例的类别：\n\n```r\n\
  predict(model, trvalue)\n```\n\n如果我们进一步添加参数 `type=\"raw\"`，我们将获得后验概率。\n\n## 4.2\
  \ 朴素贝叶斯的构建与分类\n\n我们将使用以下数据用于二分类问题：\n\n| Weather | Day | HighTraffic |\n| :--- |\
  \ :--- | :--- |\n| Hot | Vacation | No |\n| Cold | Work | Yes |\n| Normal | Work\
  \ | No |\n| Cold | Weekend | Yes |\n| Hot | Vacation | Yes |\n\n我们将回答以下问题：\na) 使用朴素贝叶斯分类器，将值为\
  \ `(Weather, Day) = (Hot, Vacation)` 的实例分类为哪类？\nb) 使用朴素贝叶斯分类器，将值为 `(Weather, Day)\
  \ = (Hot, Weekend)` 的实例分类为哪类？\nc) 使用拉普拉斯平滑重复问题 (b)。\nd) 在 R 中构建完整模型并重复问题 (a)。\n\
  e) 在 R 中使用拉普拉斯平滑构建完整模型并重复问题 (b)。\n\n### 4.2.1 数据与库\n\n最初，我们读取数据导入：\n\n```r\ntraffic\
  \ = read.csv(\"traffic.txt\")\nlibrary(e1071)\n```\n\n### 4.2.2 概率计算\n\n对于问题 (a)，我们使用以下公式计算：\n\
  `P (Y|Hot, Vacation) = P (Hot|Y)·P (Vacation|Y) = 1/4·1/2 = 1/8 (3/8)`\n`P (No|Hot,\
  \ Vacation) = P (Hot|No)·P (Vacation|No) = 2/4·1/4 = 2/8 (2/8)`\n\n由于 `P (No|Hot,\
  \ Vacation) > P (Y|Hot, Vacation)`，算法将实例分类为 No。同样，对于问题 (b)：\n`P (Y|Hot, Weekend)\
  \ = P (Hot|Y)·P (Weekend|Y) = 1/4·1/2 = 1/8 (3/8)`\n`P (No|Hot, Weekend) = P (Hot|No)·P\
  \ (Weekend|No) = 2/4·0/4 = 0/8 (2/8)`\n\n由于 `P (No|Hot, Weekend) < P (Y|Hot, Weekend)`，算法将实例分类为\
  \ Yes。关于问题 (c)，我们将重新计算概率，添加 1 作为拉普拉斯参数。因此，新的概率为：\n`P (Y|Hot, Vacation) = (1+1)/(4+3)\
  \ = 2/7`\n`P (No|Hot, Vacation) = (2+1)/(4+3) = 3/7`\n`P (Y|Hot, Weekend) = (1+1)/(4+3)\
  \ = 2/7`\n`P (No|Hot, Weekend) = (0+1)/(4+3) = 1/7`\n\n等待，让我们重新验证文本中的逻辑：\n```text\n\
  Naive Bayes Classifier for Discrete Predictors Call: naiveBayes.default(x = X, y\
  \ = Y, laplace = laplace)\nA-priori probabilities: Y\nNo 0.5 Yes 0.5\nConditional\
  \ probabilities: Weather\nY Cold 0.25 Hot 0.50 No 0.25 Yes 0.50 0.25 0.25\nDay\n\
  Y Vacation Weekend Work No 0.25 0.00 0.75 Yes 0.25 0.50 0.25\n```\n\n### 4.2.3 构建朴素贝叶斯模型\n\
  \n#### 4.2.3.1 构建简单模型\n\n对于问题 (d)，我们构建一个朴素贝叶斯模型：\n\n```r\nmodel < naiveBayes(HighTraffic\
  \ ~ ., data = traffic)\nprint(model)\n```\n\n现在我们可以重新计算问题 (a)：\n\n```r\ntrvalue\
  \ = data.frame(Weather = factor(\"Hot\", levels = traffic$Weather), Day = factor(\"\
  Vacation\", levels = traffic$Day))\npredict(model, trvalue)\npredict(model, trvalue,\
  \ type = \"raw\")\n```\n\n#### 4.2.3.2 使用拉普拉斯平滑构建模型\n\n对于问题 (c)，我们构建带有拉普拉斯平滑的朴素贝叶斯模型：\n\
  \n```r\nmodel < naiveBayes(HighTraffic ~ ., data = traffic, laplace = 1)\n```\n\n\
  现在我们可以重新计算问题 (a)：\n\n```r\ntrvalue = data.frame(Weather = factor(\"Hot\", levels\
  \ = traffic$Weather), Day = factor(\"Weekend\", levels = traffic$Day))\npredict(model,\
  \ trvalue)\npredict(model, trvalue, type = \"raw\")\n```\n\n## 4.3 朴素贝叶斯的应用与评估\n\
  \n将在数据集 `HouseVotes84` 上应用朴素贝叶斯分类器。最初，我们导入数据集，忽略任何缺失值的实例：\n\n```r\ndata(HouseVotes84,\
  \ package = \"mlbench\")\nvotes = na.omit(HouseVotes84)\n```\n\n此外，我们导入执行和评估模型所需的库：\n\
  \n```r\nlibrary(e1071)\nlibrary(MLmetrics)\nlibrary(ROCR)\n```\n\n之后，我们将数据集分为训练数据和测试数据：\n\
  \n```r\ntrainingdata = votes[1:180,]\ntestingdata = votes[181:232,]\n```\n\n我们将回答以下问题：\n\
  a) 使用训练数据构建朴素贝叶斯模型并将其应用于测试数据。\nb) 计算测试数据中类别 `democrat` 的精确率、召回率和 F 度量。\nc) 为模型构建\
  \ ROC 曲线。\n\n\n\n\n\n### 4.3.1 构建与应用朴素贝叶斯模型\n\n对于问题 (a)，我们训练了一个朴素贝叶斯模型：\n\n```r\n\
  model < naiveBayes(Class ~ ., data = trainingdata)\n```\n\n之后，我们可以在测试集上应用该模型：\n\n\
  ```r\nxtest = testingdata[,-1]\nytest = testingdata[,1]\npred = predict(model, xtest)\n\
  predprob = predict(model, xtest, type = \"raw\")\n```\n\n### 4.3.2 指标计算与 ROC 曲线绘制\n\
  \n我们可以通过以下命令查看混淆矩阵并计算有用的指标（问题 (b)）：\n\n```r\nConfusionMatrix(ytest, pred)\nPrecision(ytest,\
  \ pred, \"democrat\") \nRecall(ytest, pred)\n```\n\n绘制 ROC 曲线（问题 (c））最初需要使用以下命令计算\
  \ TPR 和 FRP：\n\n```r\npred_obj = prediction(predprob[,1], ytest, label.ordering\
  \ = c(\"republican\", \"demo crat\"))\nROCcurve < performance(pred_obj, \"tpr\"\
  , \"fpr\")\n```\n\n如果我们绘制 `ROCcurve` 对象，我们将看到 TPR 和 FRP 以及相应的阈值。最后，我们可以如下所示绘制曲线：\n\
  \n```r\nplot(ROCcurve, col = \"blue\") \nabline(0,1, col = \"grey\")\n```\n\n并使用命令寻找曲线下的面积：`performance(pred_obj,\
  \ \"auc\")` ![](img/image00103.gif)![](img/image00095.gif)\n\n## ROC 曲线\n\n在统计学中，受者工作特征（ROC）或\
  \ ROC 曲线是一种图形，用于说明二分类系统的性能随判别阈值变化而变化。该曲线通过绘制在不同阈值设置下的真阳性率（TPR）相对于假阳性率（FPR）来创建。\n\
  \nROC 曲线展示了以下几点：\n\n* 它显示了敏感性与特异性之间的权衡（敏感性的任何增加都会伴随着特异性的下降）。\n* 曲线越接近 ROC 空间的左侧边界然后是顶部边界，分类器就越准确。\n\
  * 曲线越接近 ROC 区域的 45 度对角线，测试的准确性越低。\n* 切点处切线的斜率给出了该测试值的似然比（LR）。\n* 曲线下的面积是文本准确性的衡量标准。这将在下一节中进一步讨论。\n\
  \n准确率通过 ROC 曲线下的面积来衡量。面积为 1 代表完美的测试；面积为 .5 代表无用的测试。分类诊断测试准确性的粗略指南是传统的学术分值制：\n\n\
  * .90-1 = 优秀 (A)\n* .80-.90 = 良好 (B)\n* .70-.80 = 中等 (C)\n* .60-.70 = 差 (D)\n* .50-.60\
  \ = 不及 (F)\n\n# 第 5 章 - k-近邻分类\n\n## 5.1 引言\n\n### 5.1.1 k-最近邻简介\n\nk-最近邻 (kNN)\
  \ 是一种机器学习算法，其中对新实例的预测取决于其 k 个最近的实例。因此，新实例的类别是根据其 k 个最近实例的类别通过多数投票决定的。\n\n### 5.1.2\
  \ R 语言中的 k-最近邻\n\n我们可以使用 `class` 库在 R 中应用 kNN 模型：\n\n```r\nlibrary(class)\n```\n\
  \n可以使用 `knn` 命令对新实例进行分类：\n\n```r\nknn(X_train, X_test, Y_train, k = 1, prob = TRUE)\n\
  ```\n\n其中我们必须提供训练数据（`X_train`, `Y_train`）、新实例（`X_test`）以及 `k` 的值。\n\n## k-最近邻模型的构建与分类\n\
  \n我们将使用以下数据进行二分类问题：\n\n```r\n## 导入数据\nknata = read.table\n```\n\n### 5.2 k-最近邻算法\n\
  \n我们将回答以下问题：\n\na) 为不同类别绘制数据。\nb) 使用 `k = 1` 时，使用 kNN 分类，其类别是什么？\nc) 使用 `k = 5`\
  \ 重复 (b)。\nd) 使用 `k = 1` 时，使用 kNN 分类其类别是什么？\n\n### 5.2.1 数据处理\n\n最初，我们读取数据：\n\n\
  ```r\nknata = read.table(\"knata\")\n```\n\n### 5.2.2 算法\n\n最初我们划分数据集：\n\n```r\n\
  X_train = knata[,1:2]\nY_train = knata[,3]\n```\n\n对于问题 (a)，我们执行命令：\n\n```r\nplot(X_train,\
  \ col = Y_train)\n```\n![](img/image0010.gif)\n\n当 `k = 1` 时，我们需要找到：\n\n```r\nknn(X_train,\
  \ X_test, Y_train)\n```\n\n对于问题 (b)，我们使用：\n\n```r\nlibrary(class)\n```\n\n当 `k =\
  \ 5` 时，我们需要找到：\n\n```r\nknn(X_train, X_test, Y_train)\n```\n\n## 5.3 k-最近邻真实世界示例\n\
  \n在本节中我们将使用乳腺癌数据集![](img/image0095.gif\n\n## 乳腺癌（原始）数据集\n\n在本节中，我们将对 UCI 机器学习库的\
  \ `breast-cancer.data` 文件应用 k-NN。\n\n### 5.3.1 数据处理\n\n首先，我们将数据集加载为数据框。假设当前工作目录位于数据集所在的目录。要检查\
  \ `read.table` 函数的文档，请使用 `read.table`。此外，从数据集说明可以看出缺失值用 `?` 表示。接下来我们将数据集分为训练集和验证集。加载和划分数据集的步骤如下：\n\
  \n```r\nrm(list=ls()) # 下载数据集\nfileURL <- \"http://archive.ics.uci.edu/ml/machine-learning-databases/breast-cancer-consin/breast-cancer.data.data\"\
  .download.file(fileURL, destfile=\"breast-data.data=\" method=\"curl\") # 读取数据\n\
  data <- read.table(\"breast-cancer.data\", na.strings = \"?\", sep=\",\") # 移除 id\
  \ 列\n## 为列命名（属性）\nnames(data) <- c(\"ClumpThickness\", \"UniformityCellSize\", \"\
  UniformityCellShape\", \"MarginalAdhesion\", \"SingleEpithelialCellSize\", \"BareNuclei\"\
  , \"BlandChromatin\", \"NormalNucleoli\", \"Mitoses\", \"Class\") # 将类别转换为因子\ndata$Class\
  \ <- factor(data$Class, levels=c(2,4), labels=c(\"benign\", \"malignant\")) # 设置种子\n\
  set.seed(1234) # 划分数据集\nind <- sample(2, nrow(iris), replace=TRUE, prob=c(0.7, 0.3))\n\
  trainData <- data[ind==1,]\nvalidationData <- data[ind==2,]\n```\n\n### 5.3.2 训练与预测\n\
  \n我们像之前一样加载 k-NN 算法。\n\n\n\n\n\nhttp://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+%28Original%29\n\
  \nhttp://archive.ics.uci.edu/ml/machine-learning-databases/breast-cancer-wisconsin/breast-cancer-wisconsin.data\
  \ http://archive.ics.uci.edu/ml/index.html\n\n`library`(`class`)\n\n由于所有属性都在 1 到\
  \ 10 之间，因此不需要在 0 到 1 之间进行归化，因为在 `kNN` 的距离计算中没有任何属性会主导其他属性。由于 `kNN` 接受不包含目标列的训练和测试数据集（作为第三个参数），我们将进行一些数据处理，使数据符合\
  \ `knn` 函数的格式（可以通过 `?knn` 查看帮助文档）。此外，由于 `kNN` 不允许存在缺失值，让我们把它们也删掉。\n\n`trainData\
  \ < trainData[complete.cases(trainData),]` \n\n`validationData < validationData[complete.cases(validationData),]`\
  \ \n`trainDataX < trainData[,-ncol(trainData)]` \n\n`trainDataY < trainData$Class`\
  \ \n\n`validationDataX < validationData[,-ncol(trainData)]` \n\n`validationDataY\
  \ < validationData$Class`\n\n让我们进行预测吧，因为在使用 `kNN` 时不需要训练。训练实例即为模型。\n\n`prediction\
  \ = knn(trainDataX, validationDataX, trainDataY, k = 1)` 你可以尝试不同的 `k` 值来寻找更好的模型。\n\
  \n### 5.3.3 评估\n\n对验证集进行预测并打印混淆矩阵：\n\n```r\ncat (\"Confusion matrix:\\n\") \nxtab\
  \ = table(prediction, validationData$Class) \nprint(xtab) \ncat(\"\\nEvaluation:\\\
  n\\n\")\naccuracy = sum(prediction == validationData$Class)/length(validationData$Class)\
  \ \nprecision = xtab[1,1]/sum(xtab[,1]) \nrecall = xtab[1,1]/sum(xtab[1,]) \nf =\
  \ 2 * (precision * recall) / (precision + recall) \ncat(paste(\"Accuracy:\\t\",\
  \ format(accuracy, digits=2), \"\\n\",sep=\" \")) \ncat(paste(\"Precision:\\t\"\
  , format(precision, digits=2), \"\\n\",sep=\" \")) \ncat(paste(\"Recall:\\t\\t\"\
  , format(recall, digits=2), \"\\n\",sep=\" \")) \ncat(paste(\"F-measure:\\t\", format(f,\
  \ digits=2), \"\\n\",sep=\" \"))\n```\n\n输出结果：\n\n```text\nConfusion matrix: \n\
  prediction benign malignant \nbenign 99 4 \nmalignant 6 60 \n\nEvaluation:\nAccuracy:\
  \ 0.94 \nPrecision: 0.94 \nRecall: 0.94\nF-measure: 0.95\n```\n\n### 5.3.4 交叉验证\n\
  \n为了执行交叉验证，我们将使用 `caret` 包。在这里你可以找到一份快速指南。\n\n#### 5.3.4.1 将数据分为两组\n\n`createDataPartition`\
  \ 函数对数据进行分层划分。这与我们之前的的操作类似（但之前没有分层）。我们将使用 `train` 函数来构建 `kNN` 模型。\n\n```r\nlibrary(caret)\n\
  library(mlbench)\ndata(Sonar)\ninTrain <- createDataPartition(y = Sonar$Class, p\
  \ = .75, list = FALSE)\ntraining <- Sonar[inTrain,]\ntesting <- Sonar[-inTrain,]\n\
  kNNFit <- train(Class ~ ., data = training, method = \"knn\", preProc = c(\"center\"\
