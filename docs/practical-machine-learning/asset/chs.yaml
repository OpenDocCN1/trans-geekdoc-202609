  theta[new] = argmax_{\\theta}(\\^sum P (Z/X, \\theta[old]) \\ln P (X, Z/\\theta))$\n\
  \n$Z$\n\n当对数似然值不再更新或更新步长小于给定的阈值时，EM 算法达到收敛。\n\n## 12.1.2 - 高斯混合模型 - GMMs\n\n高斯混合模型是一种概率模型，它假设所有数据点都是由一个有限数量具有未知参数的高斯分布的混合体生成的。人们可以将混合模型看作是对\
  \ $k$-means 聚类的的推广，它纳入了关于数据协方差结构以及潜在高斯分布中心点的信息。\n\n通常情况下，$k$ 个正态分布的混合由以下方程给出：\n\n\
  $K$\n\n$P (x) = \\sum_{k=1}^{K} \\pi[k]N (x/\\mu[k], \\Sigma[k])$\n\n其中\n\n$K$\n\
  \n$\\pi[k]$ : 混合系数 $\\in [0, 1]$ 且 $\\sum_{k=1}^{K} \\pi[k] = 1$\n\n$\\mu[k], \\\
  Sigma[k]$ : 第 $k$ 个分布的均值和协方差\n\n$N : (x/\\mu, \\Sigma) = e^{-1/2(x-\\mu)^T\\Sigma^{-1}(x-\\\
  mu)} (2\\pi^{n/2}|\\Sigma|^{1/2})$\n\nGMMs 使用 EM 作为优化算法，能够计算描述给定数据的分布的潜变量。因此，在 GMM\
  \ 的情况下，EM 算法最大化以下量值：\n\n$N K$\n\n$\\ln P (X / \\pi, \\mu, \\Sigma) = \\sum_{n=1}^{N}\
  \ \\sum_{k=1}^{K} (\\pi[k]N (x[n]/\\mu[k], \\Sigma[k]))$\n\n其中 $X = \\{x[1], x[2],\
  \ \\dots, x[n]\\} \\rightarrow$ 给定数据集\n\n## 12.2 - 使用 EM 建模高斯混合模型\n\n为了使用 GMMs 进行聚类，我们将使用一个包含\
  \ 1,000 个 1D 数据实例的数据集，这些实例源自两个不同的分布。关于分布，我们知道它们的标准差为 1。数据的摘要如下所示：\n\n| D1\\_X |\
  \ D2\\_X |\n| :--- | :--- | :--- |\n| Min. | -1.905 | 3.992 |\n| 1st Qu. | 0.223\
  \ | 6.322 |\n| Median | 0.907 | 6.944 |\n| Mean | 1.000 | 6.985 |\n| 3rd Qu. | 1.664\
  \ | 7.681 |\n| Max. | 3.659 | 10.810 |\n\n使用上述数据，我们将回答以下问题：\n\n(a) 绘制数据（1 维）以及概率密度函数，并为每个分布使用不同的颜色。\n\
  \n(b) 计算每个正态分布的均值 ($\\mu[1], \\mu[2]$) 和潜变量 $\\lambda[1], \\lambda[2]$。\n\n(d) 在同一张图中绘制给定数据的估计概率密度函数和真实概率密度函数。\n\
  \n### 12.2.1 - 数据\n\n为了回答第一个问题，我们首先使用以下命令读取数据：\n\n```r\n# 读取数据\ngdata = read.csv(\"\
  gdata.txt\")\n# 将 1D 数据保存到向量 x\nx = gdata[, 1]\n# 将聚类索引保存到向量 y\ny = gdata[, 2]\n\
  ```\n\n为了绘制数据以及概率密度，我们可以使用以下命令：\n\n```r\n# 绘制数据\nplot(data.frame(x), ylim = c(-0.01,\
  \ 0.25), col = y, xlab = \"Data\", ylab = \"Density\")\n# 绘制概率密度函数\nlines(density(x),\
  \ col = y)\n```\n\n接下来的图展示了带有概率密度函数的给定数据集。来自每个聚类的数据用不同的颜色（黑色和红色）标出。\n\n### 12.2.2\
  \ - 手动计算正态分布的参数\n\n在本小节中，我们将使用 EM 算法利用给定数据集计算正态分布的参数。首先，我们将为参数 $\\mu$ 和 $\\lambda$\
  \ 选择初始值：\n\n初始化：$\\mu[1] = 0, \\mu[2] = 1, \\lambda[1] = 0.5, \\lambda[2] = 0.5$\n\
  $\\Theta = \\{\\theta[1], \\theta[2]\\} = \\{(0, 1, 0.5), (1, 1, 0.5)\\}$\n\nE 步：在这一步中，我们想要计算给定数据点源自某个正态分布的概率。该概率由以下方程给出：\n\
  \n$\\lambda[j] P (x_i/\\theta[j]) (P (D_j/x_i)) = \\lambda[1] P (x_i/\\theta[1])\
  \ + \\lambda[2] P (x_i/\\theta[2])$\n\n其中 $j = 1, 2$， $\\lambda = \\{\\lambda[1],\
  \ \\lambda[2]\\} = \\{0.5, 0.5\\}$\n\n### 12.2.3 - 使用 R 计算正态分布的参数\n\n```r\n# 初始化\n\
  mu = c(0, 1)\nlambda = c(0.5, 0.5)\n# 设置停止标准\nepsilon = 1e-08\n# 计算初始对数似然\nlog_likelihood\
  \ = sum(log(lambda[1] * dnorm(x, mean = mu[1], sd = 1) + lambda[2] * dnorm(x, mean\
  \ = mu[2], sd = 1)))\n\nrepeat {\n  # ------ 期望步 -----\n  # 根据 mu, lambda (以及 sigma)\
  \ Find 分布\n  T1 = dnorm(x, mean = mu[1], sd = 1)\n  T2 = dnorm(x, mean = mu[2],\
  \ sd = 1)\n  P1 = lambda[1] * T1 / (lambda[1] * T1 + lambda[2] * T2)\n  P2 = lambda[2]\
  \ * T2 / (lambda[1] * T1 + lambda[2] * T2)\n\n  # ------ 最大化步 -----\n  # 给定分布找到\
  \ mu, lambda (以及 sigma)\n  mu[1] = sum(P1 * x) / sum(P1)\n  mu[2] = sum(P2 * x)\
  \ / sum(P2)\n  lambda[1] = mean(P1)\n  lambda[2] = mean(P2)\n\n  # 计算新的对数似然（待最大化）\n\
  \  new_log_likelihood = sum(log(lambda[1] * dnorm(x, mean = mu[1], sd = 1) + lambda[2]\
  \ * dnorm(x, mean = mu[2], sd = 1)))\n\n  # 打印当前参数和对数似然值\n  cat(\"mu =\", mu, \"\
  \ lambda =\", lambda, \" log_likelihood =\", new_log_likelihood, \"\\n\")\n\n  #\
  \ 如果算法收敛则停止\n  if (new_log_likelihood - log_likelihood <= epsilon) break\n  log_likelihood\
  \ = new_log_likelihood\n}\n```\n\n### 12.2.4 - 使用 mixtools 构建 GMMs 模型\n\n\n\n\n\
  为了回答问题 (c)，我们将使用 R 构建一个 GMMs 聚类模型。我们将使用的库是 `mixtools`：\n\n```r\nlibrary(mixtools)\n\
  ```\n\n我们可以使用期望最大化 (EM) 算法，并使用以下命令概述最终计算出的参数：\n\n```r\n# 使用上述初始化模型应用 EM 算法 normalmixEM(x,\
  \ mu = c(0,1), sd.constr = c(1,1)) \n\n# 获取分布的均值 model$mu\n\n# 获取 lambda 值 model$lambda\
  \ \n\n# 获取最终对数似然 model$loglik\n```\n\n我们可以使用以下命令将原始和估计的概率密度函数（绘制在同一张图中）：\n\n```r\n\
  # 绘制估计的概率密度函数 plot(model, which = 2) \n\n# 绘制原始概率密度函数 lines(density(x), lty = 2,\
  \ lwd = 2)\n```\n\n下图展示了概率密度函数。虚线表示实际密度，实线表示估计密度。我们可以看到，估计非常接近实际密度。\n\n![](img/image0138.gif)\n\
  \n## 12.3 - GMMs 应用\n\n在本节中，我们将展示 GMMs 在现实生活示例中的应用。在这种背景下，我们有一个包含 300 个源自不同分布的 2D\
  \ 数据集。分布的总结如下表：\n\n| D1\\_X1 | D1\\_X2 | D1\\_X1 | D1\\_X2 |\n| :--- | :--- | :---\
  \ | :--- |\n| 最小值 | 3.33 | 5.57 | 17.64 | 5.47 |\n| 第一分位数 | 8.29 | 9.01 | 22.43\
