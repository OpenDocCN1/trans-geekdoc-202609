  \ | -3.97 |\n| 三分位数 | 11.88 | 11.38 | 27.44 | 11.48 |\n| 最大值 | 17.32 | 14.80 | 31.27\
  \ | 23.47 |\n\n然后，我们将使用给定数据集回答以下问题：\n\n(a) 为每个类使用不同的颜色绘制给定数据集。\n\n(b) 构建 GMMs 模型将提供的数据集聚分为\
  \ 3 类。设置 epsilon 值为 0.1。\n\n(c) 显示 EM 算法如何收敛并使用估计的概率密度函数绘制数据。\n\n(d) 将每个数据点分配给概率最高的类，并结合质心绘制聚类。\n\
  \n(e) 计算并绘制轮廓系数。\n\n(f) 根据上述聚类结果显示数据的热图。\n\n### 12.3.1 - 数据集构建\n\n首先，我们将使用以下命令读取数据集：\n\
  \n```r\n# 读取数据\ngsdata = read.csv(\"gsdata.txt\")\n\n# 第三列包含每个数据点的类别标签\ntarget =\
  \ gsdata[, 3]\n\n# 前两列包含数据坐标\ngsdata = gsdata[, 1:2]\n```\n\n我们可以使用以下命令绘制数据：\n\n\
  ```r\nplot(gsdata, col = target)\n```\n\n输出结果如下图，其中每个类的数据点用不同的颜色（红、黑、绿）表示：\n\n![](img/image0139.gif)\n\
  \n### 12.3.2 - GMMs 模型构建\n\n为了构建 GMMs 模型，我们将使用以下命令：\n\n```r\n# 导入库 mixtools\nlibrary(mixtools)\n\
  \n# 构建模型\nmodel = mvnormalmixEM(gsdata, k = 3 , epsilon = 0.1)\n```\n\n一旦构建了模型，我们可以以下命令演示算法如何收敛：\n\
  \n```r\nplot(model, which = 1)\n```\n\n收敛情况所示：\n\n![](img/image0140.gif) 注意的是，EM\
  \ 算法收敛非常快。从第 2 次迭代开始，对数似然几乎相同。\n\n最后，我们可以使用以下命令绘制给定数据集以及每个类的概率密度函数：\n\n```r\nplot(model,\
  \ which = 2)\n```\n\n输出结果所示：\n\n![](img/image0141.gif)\n\n使用 `model$posterior` 命令，我们可以看到每个数据点源自三个类之一的概率（软分配）。然而，为了回答这个问题，我们使用以下命令执行了硬分配：\n\
  \n```r\n# 将每个点分配给概率最高的类\nclusters = max.col(model$posterior)\n\n# 计算中心\ncenters\
  \ = matrix(unlist(model$mu), byrow = TRUE, ncol = 2)\n```\n\n使用上述硬分配，我们可以计算轮廓系数并构建热图。\n\
  \n### 12.3.3 - 轮廓计算\n\n为了计算和绘制轮廓系数，我们可以使用以下命令：\n\n```r\n# 计算轮廓\nmodel_silhouette\
  \ = silhouette(clusters, dist(gsdata))\n\n# 绘制轮廓\n```\n\n![](img/image0142.gif)\n\
  \n### 12.3.4 - 热图构建\n\n为了构建热图，我们可以使用：\n\n```r\n# 根据类值对数据进行排序\ngsdata_ord = gsdata[order(clusters),\
  \ ]\n\n# 构建热图\nheatmap(as.matrix(gsdata_ord), col = colors(256))\n```\n\n![](img/image0143.gif)\n\
  \n## 12.4 - 基于信息准则的 GMMs 应用\n\n在本节中，我们将使用基于信息准则的 300 个数据点的 GMMs。两个分布的总结如下：\n\n|\
  \ | 值 |\n| :--- | :--- |\n| 最小值 | -2.239 |\n| 第一分位数 | 0.639 |\n| 中位数 | 5.07 |\n\
  | 平均值 | 5.0336 |\n| 三分位数 | 9.1177 |\n| 最大值 | 12.0908 |\n\n我们将使用给定数据集回答问题：\n\n(a)\
  \ 为每个类绘制给定数据集。\n\n(b) 执行聚类并计算 AIC 和 BIC。\n\n(c) 使用估计的概率密度函数绘制数据。\n\n### 12.4.1 -\
  \ 数据构建\n\n首先，我们将使用以下命令读取数据集：\n\n```r\n# 读取数据\nicdata = read.csv(\"icdata.txt\")\n\
  \n# 第一列包含数据点的数值\nx = icdata[, 1]\n\n# 第二列包含类别的标签\ny = icdata[, 2]\n```\n\n之后，我们可以结合概率密度函数绘制数据集：\n\
  \n```r\n# 绘制数据\nplot(data.frame(x, 0), ylim = c(-0.01, 0.1))\n\n# 绘制密度函数\nlines(density(x))\n\
  ```\n\n![](img/image0144.gif)\n\n### 12.4.2 - 用于选择类数的信息准则\n\n为了回答问题 (b)，我们需要计算赤池信息准则\
  \ (AIC) 和贝叶斯信息准则 (BIC)。对于具有 `t` 个参数、`N` 个样本且对数似然为 `L` 的给定模型，上述准则公式如下：\n\n`AIC =\
  \ 2t - 2ln(L)`\n\n`BIC = tln(N) - 2ln(L)`\n\n我们可以使用以下代码对 2、3、4 和 5 个分布进行聚类：\n\n\
  ```r\n# 存储 AIC 值\nAIC = c()\n\n# 存储 BIC 值\nBIC = c()\n\n# 设置 2x2 绘图布局\npar(mfrow\
  \ = c(2, 2))\n\n# 遍历类数\nfor (k in 2:5) {\n  # 构建模型\n  model = normalmixEM(x, k =\
  \ k, epsilon = 0.0001)\n\n  # 绘制聚类结果\n  plot(model, which = 2 , main2 = paste(\"\
  Density (k = \", k, \")\", sep = \"\"))\n\n  # 计算参数数量\n  numparams = length(model$mu)\
  \ + length(model$stdev) + length(model$lambda)\n\n  # 存储 AIC 和 BIC 值\n  AIC[k] =\
  \ 2 * numparams - 2 * model$loglik\n  BIC[k] = log(length(x)) * numparams - 2 *\
  \ model$loglik\n}\n```\n\n下图描述了聚类结果：\n\n![](img/image0145.gif) 最后，我们可以使用以下命令绘制 AIC\
  \ 和 BIC 值：\n\n```r\n# 绘制 AIC 值\n```\n\n\n\n\n```r\nplot(AIC[2:5], type = 'l', xaxt\
  \ = \"n\", main = \"AIC\", ylab = \"AIC\")\naxis(1, at = 1:4, labels = 2:5)\n\n\
  # Plot BIC values\n\nplot(BIC[2:5], type = 'l', xaxt = \"n\", main = \"BIC\", ylab\
  \ = \"BIC\")\naxis(1, at = 1:4, labels = 2:5)\n```\n\nAIC 和 BIC 值与聚类数量的关系如图所示：\n\
