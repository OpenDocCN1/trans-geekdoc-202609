  \ 3 个简化公式，我们能够在验证集中获得更好的泛化结果。\n\n### 7.2.2 前向搜索\n\n标准的封装方法（wrapper methods）包括前向搜索和后向搜索。在本节中，我们将在乳腺癌威斯康数据集中使用前向搜索并将决策树作为模型（见第\
  \ 5 章）。\n\n#### 下载文件\n\n```r\nfileURL < \"http://archive.ics.uci.edu/ml/machine-learning-databases/breast-cancer-wisconsin/breast-cancer-wisconsin.data\"\
  \ndownload.file(fileURL, destfile=\"breast-cancer-wisconsin.data\", method=\"curl\"\
  ) data < read.table('breast-cancer-wisconsin.data', na.strings = \"?\", sep=\",\"\
  ) data < data[,-1]\n```\n\n```r\nnames(data) < c(\"ClumpThickness\", \"UniformityCellSize\"\
  , \"UniformityCellShape\", \"MarginalAdhesion\", \"SingleEpithelialCellSize\", \"\
  BareNuclei\", \"BlandChromatin\", \"NormalNucleoli\", \"Mitoses\", \"Class\")\n\
  data$Class < factor(data$Class, levels=c(2,4), labels=c(\"benign\", \"malignant\"\
  ))\nset.seed(1234)\nind < sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))\n\
  trainData < data[ind==1,]\nvalidationData < data[ind==2,]\n```\n\n#### 移除缺失数据的案例\n\
  \n```r\ntrainData < trainData[complete.cases(trainData),]\nvalidationData < validationData[complete.cases(validationData),]\n\
  ```\n\n我们将使用 `FSelector` 包中的 `forward.search` 方法以及 `homonymous` 包中的 `rpart` 决策树训练方法。`forward.search`\
  \ 方法需要一个评估函数来评估属性子集。在我们的情况下，`evaluatorfunction` 在训练数据集上执行 5 折交叉验证。\n\n```r\nlibrary(FSelector)\
  \ library(rpart)\nevaluator < function(subset) {\n  # k-fold cross validation\n\
  \  k <- 5\n  splits < runif(nrow(trainData))\n  results = sapply(1:k, function(i)\
  \ {\n    test.idx < (splits >= (i - 1) / k) & (splits < i / k)\n    train.idx <-\
  \ !test.idx\n    test < trainData[test.idx, , drop=FALSE]\n    train < trainData[train.idx,\
  \ , drop=FALSE]\n    tree < rpart(as.simple.formula(subset, \"Class\"), train)\n\
  \    error.rate = sum(test$Class != predict(tree, test, type=\"c\")) / nrow(test)\n\
  \    return(1 error.rate)\n  })\n  print(subset)\n  print(mean(results))\n  return(mean(results))\n\
