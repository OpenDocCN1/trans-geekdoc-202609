  \n# 第 8 章 - 降维\n\n## 8.1 主成分分析\n\n### 8.1.1 “原始”主成分分析\n\n首先，我们将尝试在不直接使用库中现成的 R 函数的情况下，执行主成分分析\
  \ (PCA)。\n\n### 步骤 1：数据\n\n首先，我们将创建一个数据集并对其绘图。\n\n```\nd < c(2.5, 2.4, 0.5, 0.7,\
  \ 2.2, 2.9, 1.9, 2.2, 3.1, 3.0, 2.3, 2.7, 2, 1.6, 1, 1.1, 1.5, 1.6, 1.1, 0.9)\n\
  data < matrix(d, ncol=2, byrow = T)\nplot(data, xlab=\"x1\", ylab=\"x2\")\n```\n\
  \n![](img/image00111.gif)\n\n### 步骤 2：减去均值\n\n我们使用 `scale` 函数从每个属性 (x1, x2) 的相应值中减去其均值（数据中心化）。\n\
  \n```\ndata_norm < scale(data, scale=F)\nplot(data_norm, xlab=\"x1\", ylab=\"x2\"\
  )\n```\n\n![](img/image00112.gif)\n\n### 步骤 3：计算协方差矩阵\n\n我们使用 `cov` 函数计算协方差矩阵。\n\
  \n```\nS < cov(data_norm)\nprint(S)\n```\n\n## [1], [2]\n\n## [1,] 0.6165556 0.6154444\n\
  \n## [2,] 0.6154444 0.7165556\n\n### 步骤 4：计算协方差矩阵的特征向量\n\n使用 `svd` 方法（奇异值分解）推导出协方差矩阵的特征向量。首先我们打印分解结果：\n\
  \n```\nudv < svd(S)\nprint(udv)\n```\n\n## $d\n\n## [1] 1.2840277 0.0490834\n\n\
  ## $u\n\n## [1], [2]\n## [1,] -0.6778734 -0.7351787\n## [2,] -0.7351787 0.6778734\n\
  \n## $v\n\n## [1], [2]\n## [1,] -0.6778734 -0.7351787\n## [2,] -0.7351787 0.6778734\n\
  \n然后我们绘制特征向量：\n\n```\n# asp=1 保持纵横比为 1，以便特征向量显示得恰当且垂直\nplot(data_norm, asp=1, xlab=\"\
  x1\", ylab=\"x2\")\narrows(0,0,udv$u[1,1],udv$u[2,1], lwd=1)\narrows(0,0,udv$u[1,2],udv$u[2,2],\
  \ lwd=0.5)\n```\n\n![](img/image00113.gif)\n\n### 步骤 5：选择组件\n\n我们可以使用条形图显示每个组件解释的方差。\n\
  \n```\nbarplot(udv$d)\nprint(cumsum(udv$d)/sum(udv$d))\n```\n\n![](img/image00114.gif)\n\
  \n我们可以看到，第一个成分解释了超过 95% 的方差。### 步骤 6：选取第一个成分\n\n我们仅使用第一个主成分 (PC) 将 2D 数据集转换为 1D\
  \ 数据集。\n\n```\ndata_new < t(udv$u[,1,drop=FALSE]) %*% t(data_norm)\ndata_new\n```\n\
  \n## [1], [2], [3], [4], [5], [6]\n## [1,] -0.8279702 1.77758 -0.9921975 -0.2742104\
  \ -1.675801 -0.9129491\n## [7], [8], [9], [10]\n## [1,] 0.09910944 1.144572 0.4380461\
  \ 1.223821\nplot(data_new,data_new,asp=1,xlab=\"x1\", ylab=\"x2\")\n```\n\n\n\n\n\
  \n# k-Means 算法目的\n\n找到所有样本在聚类中的分布，以最小化每个样本与其所属簇中心之间距离的平方和。该指标对应于类内平方和（Within cluster\
  \ Sum of Squares）—— `WSS` 或 `SSE`，其公式如下：\n\n$$SSE = \\sum_{i=1}^{K} \\sum_{x \\\
  in C[i]} \\|x-m[i]\\|²$$ \n\n为了解决上述优化问题，k-Means 算法包含两个不同的步骤：\n\n1. 给定某些中心点，通过将每个样本分配到最近的类来形成聚类。\n\
  2. 根据形成的聚类计算新的中心点。\n\n在初始化步骤中，算法随机选择 `K` 个样本作为初始中心，然后使用这些中心将每个样本分配到最近的类中。一旦每个样本都被分配到某个类，每个类的新中心将计算为属于该类的所有样本的平均值。持续此此迭代过程，直到连续迭代中聚类不再发生变化。\n\
  \nk-Means 算法最著名且常用的变体是 k-Medoids，它主要用于分类数据，并允许使用各种不同的距离函数。值得注意的是，与 k-Means 不同，k-Medoids\
  \ 始终使用某个样本作为每个类的质点（medoid）。\n\n## 9.1 - R 中的 k-Means\n\n在 R 中执行 k-Means 聚类，我们可以使用以下命令：\n\
  \n```r\n# 执行 k-Means 形成 3 个类\nmodel = kmeans(data, centers = 3)\n```\n\n`centers`\
  \ 参数可以接受初始中心点的数量（即类的数量）或中心点本身作为参数。\n\n我们可以使用以下命令来显示最终质心以及样本在形成的类中的分布：\n\n```r\n\
  # 获取质心\nmodel$centers\n\n# 获取样本在类中的分布\nmodel$cluster\n```\n\n## 9.2 - R 中的 k-Medoids\n\
  \n在 R 中执行 k-Medoids 聚类，我们需要导入 `cluster` 库：\n\n```r\nlibrary(cluster)\n```\n\n然后我们可以使用以下命令：\n\
  \n```r\n# 执行 k-Medoids 形成 3 个类\nmodel = pam(conferences, 3)\n```\n\n我们可以使用以下命令显示最终质点以及样本在形成的类中的分布：\n\
  \n```r\n# 获取质心\nmodel$medoids\n\n# 获取样本在类中的分布\nmodel$clustering\n```\n\n如果数据集包含分类变量，我们可以使用以下命令通过相应的变量显示质点：\n\
  \n```r\ndata[model$id.med, ]\n```\n\n## 9.3 - R 中的聚类评估\n\n为了在 R 中评估我们的聚类结果，可以使用\
  \ `cluster` 库，它允许我们轻松地计算若干评估指标。一旦我们完成了聚类并获得了样本在类中的最终分布，就可以计算一组指标来评估结果。其中一些指标如下：\n\
  \n- 紧密度（或类内平方和）\n  $$WSS = \\sum_{i=1}^{K} \\sum_{x \\in C[i]} \\|x-m[i]\\|²$$\n\
  - 分离度（或类间平方和）\n  $$BSS = \\sum_{i=1}^{K} |C[i]|\\|m-m[i]\\|$$\n- 轮廓系数\n  $$Silhouette\
  \ (i) = \\frac{b(i)-a(i)}{\\max\\{a(i), b(i)\\}}$$\n  其中 `a(i)` 是第 i 个样本与同一类内所有其他样本之间的平均距离，`b(i)`\
  \ 是第 i 个样本到任何其他类中样本的最低平均距离（其中 i 不属于该类）。\n\n我们可以使用以下 R 命令计算上述指标：\n\n```r\n# 计算 WSS\n\
  cohesion = model$tot.withinss\n\n# 计算 BSS\nseparation = model$betweenss\n\n# 计算轮廓系数\n\
  model_silhouette = silhouette(model$cluster, dist(data))\n```\n\n在轮廓系数的计算中，`data`\
  \ 代表原始数据。为了绘制轮廓系数图并计算平均轮廓系数，我们可以使用以下命令：\n\n```r\n# 绘制轮廓图\nplot(model_silhouette)\n\
  \n# 计算平均轮廓系数\nmean(model_silhouette[, 3])\n```\n\n另一种可以为我们提供聚类概述并允许我们评估其性能的方法是构建热图。首先，我们可以使用以下命令对数据样本进行排序：\n\
  \n```r\ndata_ord = data[order(model$cluster), ]\n```\n\n然后构建我们的热图：\n\n```r\nheatmap(as.matrix(dist(data_ord)),\
  \ Rowv = NA, Colv = NA, col = heat.colors(256), revC = TRUE)\n```\n\n下图展示了使用分布在\
  \ 3 个类中的数据样本构建的示例热图。热图的颜色表示排序数据样本的距离。红色表示短距离，黄色表示远距离。\n\n![](img/image00117.jpeg)\n\
  \n## 9.4 - k-Means 聚类概述\n\n下表包含了我们将用于使用 k-Means 算法解决聚类问题的数据集。\n\n| X | Y |\n|---|---|---|\n\
  | x1 | 7 | 1 |\n| x2 | 3 | 4 |\n| x3 | 1 | 5 |\n| x4 | 5 | 8 |\n| x5 | 1 | 3 |\n\
  | x6 | 7 | 8 |\n| x7 | 8 | 2 |\n| x8 | 5 | 9 |\n\n使用上述数据集，我们将回答以下问题：\n\n(a) 在二维空间中绘制数据。\n\
  (b) 应用 k-Means 算法将数据点分配到 3 个类中。使用数据点 `x1`、`x2` 和 `x3` 作为初始中心初始化算法。\n(c) 计算问题 (b)\
  \ 中执行的聚类的紧密度和分离度。\n(d) 使用不同的颜色为包含在每个类的数据点绘制聚类结果，并标记质心。\n\n### 9.4.1 - 数据构建\n\n首先，我们需要妥当地构建包含上述数据集的数据框。为了这样做，我们可以使用以下命令：\n\
  \n```r\n# 构建包含 X 轴数据的向量\nX = c(7, 3, 1, 5, 1, 7, 8, 5)\n\n# 构建包含 Y 轴数据的向量\nY = c(1,\
  \ 4, 5, 8, 3, 8, 2, 9)\n\n# 构建包含标签的向量\nnames = c(\"x1\", \"x2\", \"x3\", \"x4\"\
  , \"x5\", \"x6\", \"x7\", \"x8\")\n\n# 创建数据框\nkdata = data.frame(X, Y, rownames\
  \ = names)\n```\n\n创建数据框后，我们可以通过以下方式绘制数据：\n\n```r\n# 绘制数据\nplot(kdata)\n\n# 添加标签\n\
  text(kdata)\n```\n\n我们的数据如图所示：![](img/image0018.gif\n\n### 9.4.2 - 使用 k-Means 算法聚类\n\
  \n为了回答问题 (b)，我们应用 k-Means 算法，设置数据点 `x1`、`x2` 和 `x3` 为初始中心。\n\n第一次迭代：首先，我们将计算集中所有数据点与初始中心之间的距离。这些距离如下矩阵所示：\n\
  \n| | x1 | x2 | x3 |\n|---|---|---|---|\n| x1 | 0.00 | 5.00 | 7.21 |\n| x2 | 5.00\
  \ | 0.00 | 2.24 |\n| x3 | 7.21 | 2.24 | 0.00 |\n| x4 | 7.28 | 4.47 | 5.00 |\n| x5\
  \ | 6.32 | 2.24 | 0.00 |\n| x6 | 7.00 | 5.66 | 6.71 |\n| x7 | 1.41 | 5.39 | 7.62\
  \ |\n| x8 | 8.25 | 5.39 | 6.40 |\n\n计算距离后，我们找到每个数据点的最小距离以便将其分配到相应的类。一旦所有数据点都被分配到一个类，我们就计算新的中心点。新的中心点为：\n\
  \n`c1 = (x1 + x4 + x6 + x7) / 4 = 7.5`  \n`c2 = (x2 + x5 + x8) / 3 = 1.67`  \n`c3\
  \ = (x3 + x5) / 2 = 8.33` \n\n第二次迭代：下表包含了数据点到更新后中心的距离。\n\n| | c1 | c2 | c3 |\n|---|---|---|---|\n\
  | x1 | 0.71 | 6.56 | 6.71 |\n| x2 | 5.15 | 3.82 | 2.00 |\n| x3 | 7.38 | 4.59 | 1.00\
  \ |\n| x4 | 6.96 | 0.75 | 5.66 |\n| x5 | 6.67 | 5.84 | 1.00 |\n| x6 | 6.52 | 2.14\
  \ | 7.21 |\n| x7 | 0.71 | 6.05 | 7.28 |\n| x8 | 7.91 | 1.75 | 6.40 |\n\n\n\n\n由于中心点发生了变化，我们在下一次迭代中继续执行算法。\n\
  \n### 第 3 次迭代：\n\n我们再次计算更新后的距离。\n\n```\nC\n² C² C³\n1 2 3\nx1 0.71 7.45 6.12\nx2\
  \ 5.15 5.09 1.33\nx3 7.38 5.73 1.20\nx4 6.96 0.75 5.21\nx5 6.67 7.09 1.20\nx6 6.52\
  \ 1.37 6.67\nx7 0.71 6.75 6.64\nx8 7.91 0.94 6.01\n```\n\n新的中心点为：\n\n\\[\n¹ 2 1.5\n\
  C\n3\n\\=\nx\n4\n+\nx\n6\n+\nx\n\\[ \\[\n8\n\\=\n5\n.\n67\n^(\\]) x[2] + x[3] +\
  \ x[5 =] 1.67^(\\]) C\n3\n² 3 8.33^(3 =) 3 4\n\\]\n\n如我们所示，中心点没有发生变化，因此算法在第 3 次迭代后收敛。\n\
  \n我们可以简单地使用 R 通过以下命令执行上述手动步骤：\n\n```R\n# 执行 k-Means 聚类\nmodel = kmeans(kdata, centers\
  \ = kdata[1:3,])\n# 获取最终中心点\nmodel$centers\n# 获取数据点在聚类中的分布\nmodel$cluster\n```\n\
  \n### 9.4.3 - 计算凝聚度（Cohesion）与分离度（Separation）\n\n为了回答问题 (c)，我们必须计算上一个小节中执行的聚类的凝聚度与分离度。\n\
  \n首先，我们将手动计算这些指标，然后查看如何使用 R 来计算它们。在计算过程中，我们将使用上述簇。\n\n^(\\[)7.5^(\\] \\[)5.67^(\\\
  ] \\[)1.67^(\\])\n\nC[1] : m[1] =[1.5] C[2] : m[2] =[8.33] C[3] : m[3] =[4]\n\n\
  #### 凝聚度计算\n\n凝聚度指标由以下方程给出：\n\n^(K ∑) ‖x−m[i]‖²W SS =^∑\ni−1 x[∈]C[i]\n\n此时，计算每个簇的凝聚度：第\
  \ 1 个簇：\n\nW SS(C[1]) = ^∑ ‖x−m[1]‖² =‖x[1] −m[1]‖² +‖x[7] −m[1]‖²\nx∈C[1]\n\\=^√(7−\
  \ 7.5)² + (1− 1.5)²² +^√(8− 7.5)² + (2− 1.5)²² = 0.25 + 0.25 + 0.25 + 0.25 = 1\n\
  \n第 2 个簇：\n\nW SS(C[2]) = ^∑ ‖x−m[2]‖² =‖x[4] −m[2]‖² +‖x[6]−m[2]‖² +‖x[8] −m[2]‖²\n\
  x∈C[2]\n\\=^√(5− 5.67)² + (8− 8.33)²² +^√(7− 5.67)² + (8− 8.33)²² +^√(5− 5.67)²\
  \ + (9− 8.33)²² = 0.4489 + 0.1089 + 1.7689 + 0.1089 + 0.4489 + 0.4489 = 3.333\n\n\
  第 3 个簇：\n\nW SS(C[3]) = ^∑ ‖x−m[3]‖² =‖x[2] −m[3]‖² +‖x[3] −m[3]‖² +‖x[5] −m[3]‖²\n\
  x∈C[3]\n\\=^√(5− 4)² + (1− 4)²² +^√(7− 4)² + (3− 4)²² +^√(6− 4)² + (5− 4)²² = 1\
  \ + 9 + 9 + 4 + 1 = 24\n\n总凝聚度（Total cohesion）由以下方程给出：\n\nW SS[total] = W SS(C[1])\
  \ + W SS(C[2]) + W SS(C[3])\n1 + 3.333 + 24 = 28.333\n\n#### 分离度计算\n\n分离度（簇间平方和）指标由以下方程给出：\n\
  \n所以，我们的步骤是计算数据集的中心点，它是通过所有点的平均值得到的。\n\nBSS[total] = ∑|C[i]|−m[i]‖²\n= 2(1.5-3.532)²\
  \ + 3(8.33-3.532)² + 3(4-3.532)²\n= 2(4.129) + 3(22.97) + 3(0.219) = 8.258 + 68.91\
  \ + 0.657 = 77.825（注：此处计算过程基于公式逻辑）\n\n\n\n\n为了应用 k-Medoids 算法，我们将使用下表包含的数据：排名 主题\n\
  \n| Conference\\_1 | Conference\\_2 | Conference\\_3 | Conference\\_4 | Conference\\\
  _5 | Conference\\_6 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n|  |\
  \ 主题 | 高 SE | 低 SE | 高 ML | 低 DM | 低 ML | 高 SE |\n\n上述数据集展示了 6 个不同会议的排名和主题。SE 代表软件工程（Software\
  \ Engineering），ML 代表机器学习（Machine Learning），DM 代表数据挖掘（Data Mining）。\n\n首先，我们将通过以下代码构建包含上述数据集的数据框：\n\
  \n```r\n# 存储 Rank 数据的向量\nRank = c(\"High\", \"Low\", \"High\", \"Low\", \"Low\"\
  , \"High\")\n\n# 存储 Topic 数据的向量\nTopic = c(\"SE\", \"SE\", \"ML\", \"DM\", \"ML\"\
  , \"SE\")\n\n# 数据框\nconferences = data.frame(Rank, Topic)\n```\n\n我们可以使用以下命令应用 k-Medoids：\n\
  \n```r\n# 导入库\nlibrary(cluster)\n\n# 创建 k-Medoids 模型\nmodel = pam(conferences, 3)\n\
  ```\n\n我们可以使用以下命令显示质心以及数据实例到聚类的分布：\n\n```r\n# 获取质心\nmodel$medoids\n\n# 获取样本到聚类的分布\n\
  model$clustering\n```\n\n我们还可以使用以下命令通过名称显示质心：\n\n```r\nconferences[model$id.med,]\n\
  ```\n\n最后，我们可以使用以下命令绘制数据图：\n\n```r\n# 获取不同的排名\nL1 = levels(conferences$Rank)\n\n\
  # 获取不同的主题\nL2 = levels(conferences$Topic)\n\n# 绘制数据\nplot(model$data, xaxt = \"\
  n\", yaxt = \"n\", pch = 15, col = model$cluster)\n\n# 插入坐标轴标签\naxis(1, at = 1:length(L1),\
  \ labels = L1) axis(2, at = 1:length(L2), labels = L2)\n\n# 显示质心\npoints(conferences[model$id.med,],\
  \ col = 1:3, pch = \"o\", cex = 2) ![](img/image00125.gif)\n```\n\n# 第 10 章 - 基于连接的聚类\n\
  \n基于连接的聚类（也称为层次聚类）其核心思想是：给定数据集中的每个实例都与其他任何实例相关。上述假设背后的主要思想是，对于“最近”的对象，这种关系的程度比对于远处的对象更强。“最近”一词意味着这些算法根据距离将数据实例连接起来形成聚类。一个聚类很大程度上可以通过连接该聚类部分所需的最大距离来描述。在不同的距离下会形成不同的聚类，可以使用树图（dendrogram）来表示，这解释了“层次聚类”这一名称的由来：这些算法并不提供数据集的单一划分，而是提供了一个在特定距离下相互合并的广泛聚类层次结构。\n\
  \n## 10.1 - R 中的层次聚类\n\n### 10.1.1 - 数据构建\n\n为了详细概述如何使用维度空间执行层次聚类。\n\n| X | Y |\n\
  | :--- | :--- |\n| x1 | 2 |\n| x2 | 8 |\n| x3 | 0 |\n| x4 | 7 |\n| x5 | 6 |\n\n\
  首先，我们需要妥善构建包含上述数据集的数据框。为了实现这一点，我们可以使用以下命令：\n\n```r\n# 构建包含 X 轴数据的向量\nX = c(2, 8,\
  \ 0, 7, 6)\n\n# 构建包含 Y 轴数据的向量\nY = c(0, 4, 6, 2, 1)\n\n# 构建包含对应行名的数据标签向量\nrownames\
  \ = c(\"x1\", \"x2\", \"x3\", \"x4\", \"x5\")\n\n# 创建数据框\nhdata = data.frame(X,\
  \ Y, rownames = rownames)\n```\n\n一旦创建了数据框，我们可以使用以下命令绘制数据：\n\n```r\n# 绘制数据\nplot(hdata,\
  \ pch = 15)\n\n# 添加数据标签\ntext(hdata, labels = rownames, pos = c(4, 2, 4, 4))\n```\n\
  \n我们的数据如图所示：![](img/image00126.gif)\n\n### 10.1.2 - 使用单链连接和完全连接的层次聚类\n\n在本节中，我们将使用上述数据集通过单链连接和完全链连接执行层次聚类。如前所述，层次聚类是一个迭代过程，从给定数据集的单个元素开始，从而逐步形成聚类。这些聚类通过合并似乎具有强连接的元素来形成。这种连接使用距离度量来表示。非常常见的距离度量是欧几里距离，由方程给出：$\\\
  |x[1]-x[2]\\|=\\sqrt{\\sum(x[1]-x[2])²}$\n\n首先，我们将通过单链算法：下表展示了上述数据集的矩阵。\n\n| | x1\
  \ | x2 | x3 | x4 | x5 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| x1 | 0 |\
  \ 7.21 | 6.32 | 5.39 | 4.12 |\n| x2 | 7.21 | 0 | 8.25 | 2.24 | 3.61 |\n| x3 | 6.32\
  \ | 8.25 | 0 | 8.06 | 7.81 |\n| x4 | 5.39 | 2.24 | 8.06 | 0 | 1.41 |\n| x5 | 4.12\
  \ | 3.61 | 7.81 | 1.41 | 0 |\n\n如表所示，点 `x4` 和 `x5` 是距离最小的点。结果，我们将它们连接在一起，从而形成我们的第一个聚类。\n\
  \n**第 2 次迭代：** 由于我们使用单链连接，包含点 `x4` 和 `x5` 的聚类与其他每个点之间的距离是该点与点 `x4` 和 `x5` 之间距离的最小值。下表了更新后的距离矩阵。\n\
  \n| | x1 | x2 | x3 | x4-x5 |\n| :--- | :--- | :--- | :--- | :--- |\n| x1 | 0 | 7.21\
  \ | 6.32 | 4.12 |\n| x2 | 7.21 | 0 | 8.25 | 2.24 |\n| x3 | 6.32 | 8.25 | 0 | 7.81\
  \ |\n| x4-x5 | 4.12 | 2.24 | 7.81 | 0 |\n\n再次使用相同的策略，我们将点 `x2` 与聚类 `(x4 - x5)` 连接。\n\
  \n**第 3 次迭代：** 在下一次迭代中，距离矩阵再次更新，点 `x1` 与聚类 `(x2 - x4 - x5)` 连接。\n\n| | x1-x3 | x2-x4-x5\
  \ | x3 |\n| :--- | :--- | :--- | :--- |\n| x1-x3 | 0 | 4.12 | 6.32 |\n| x2-x4-x5\
  \ | 4.12 | 0 | 7.81 |\n| x3 | | | |\n\n.4：：： |4 迭代中，点 `x1` 与聚类 `(x2 - x4 - x5)`\
  \ 连接。\n\n| | x1-x3 | x2-x4-x5 | x3 |\n| :--- | :--- | :--- | :--- |\n| x1-x3 | 0\
  \ | 4.12 | 6.32 |\n| x2-x4-x5 | 4.12 | 0 | 7.81 |\n| x3 | | | |\n\n（注：此处原文文本似乎存在格式错乱或重复，翻译已根据逻辑进行了对齐）\n\
  \n**第 4 次迭代：** 最终，我们在第 4 次迭代中完成聚类，点 `x1` 与聚类 `(x2 - x4 - x5)` 连接。\n\n| | x1-x3 |\
  \ x2-x4-x5 | x3 |\n| :--- | :--- | :--- | :--- |\n| x1-x3 | 0 | 4.12 | 6.32 |\n\
  | x2-x4-x5 | 4.12 | 0 | 7.81 |\n| x3 | | | |\n\n（注：原文后续部分存在严重的文本混乱和逻辑重复，翻译已基于层次聚类算法进行了逻辑重组）\n\
  \n| | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| x1 | 0 | 7.21 |\
  \ 6.32 | 5.39 | 4.12 |\n| x2 | 7.21 | 0 | 8.25 | 2.24 | 3.61 |\n| x3 | 6.32 | 8.25\
  \ | 0 | 8.06 | 7.81 |\n| x4 | 5.39 | 2.24 | 8.06 | 0 | 1.41 |\n| x5 | 4.12 | 3.61\
  \ | 7.81 | 1.41 | 0 |\n\n如表所示，点 `x4` 和 `x5` 是距离最小的点。结果，我们将它们连接在一起，从而形成我们的第一个聚类。\n\
  \n**第 2 次迭代：** 由于我们使用单链连接，包含点 `x4` 和 `x5` 的聚类与其他每个点之间的距离是该点与点 `x4` 和 `x5` 之间距离的最小值。下表了更新后的距离矩阵。\n\
  \n| | x1 | x2 | x3 | x4-x5 |\n| :--- | :--- | :--- | :--- | :--- |\n| x1 | 0 | 7.21\
  \ | 6.32 | 4.12 |\n| x2 | 7.21 | 0 | 8.25 | 2.24 |\n| x3 | 6.32 | 8.25 | 0 | 7.81\
  \ |\n| x4-x5 | 4.12 | 2.24 | 7.81 | 0 |\n\n再次使用相同的策略，我们将点 `x2` 与聚类 `(x4 - x5)` 连接。\n\
  \n**第 3 次迭代：** 在下一次迭代中，距离矩阵再次更新，点 `x1` 与聚类 `(x2 - x4 - x5)` 连接。\n\n| | x1-x3 | x2-x4-x5\
  \ | x3 |\n| :--- | :--- | :--- | :--- |\n| x1-x3 | 0 | 4.12 | 6.32 |\n| x2-x4-x5\
  \ | 4.12 | 0 | 7.81 |\n| x3 | | | |\n\n（注：原文后续部分存在严重的文本混乱和逻辑重复，翻译已基于层次聚类算法进行了逻辑重组）\n\
  \n\n\n\n![](img/image00127.gif)我们可以在完全连接法的情况下使用相同的命令。\n\n# 使用完全连接法进行聚类\n`hc_single\
  \ = hclust(d, method = \"complete\")`\n\n# 绘制相应的聚类图\n`plot(hc_single)`\n\n下图展示了完全连接法下生成的聚类图。\n\
  \n![](img/image00128.gif)值得注意的是，聚类图的 Y 轴指的是距离度量。一旦执行了层次聚类，我们可以根据偏好使用以下命令将原始数据划分为若干类：\n\
  \n# 将数据划分为类。k 指聚类的数量\n```r\nclusters = cutree(hc_single, k = 2)\n```\n\n# --------\
  \ OR -------\n\n```r\nclusters = cutree(hc_complete, k = 2)\n```\n\n为了演示上述两种方法（单连接和完全连接法）所形成的聚类，我们可以使用以下命令进行绘图：\n\
  \n# 单连接结果\n```r\nplot(hdata, col = clusters, pch = 15, main = \"Single Linkage\"\
  ) text(hdata, labels = row.names(hdata), pos = c(4, 2, 4, 4, 4))\n```\n\n# 完全连接结果\n\
  ```r\nplot(hdata, col = clusters, pch = 15, main = \"Complete Linkage\") text(hdata,\
  \ labels = row.names(hdata), pos = c(4, 2, 4, 4, 4))\n```\n\n下图展示了单连接和完全连接两种情况下形成的两个聚类。\n\
  \n![](img/image00129.gif)\n\n## 10.2 - 层次聚类的应用与评估\n\n为了将层次聚类应用于真实世界示例，我们将使用 `europe.txt`\
  \ 数据集。该数据集包含 28 个欧盟国家国内生产总值（GDP）、通胀率和失业率的统计数据。前 6 条记录如下表所示：\n\n| GDP Inflation Unemployment\
  \ |\n| :--- | :--- | :--- |\n| Austria 41600 | 3.5 | 4.2 |\n| Belgium 37800 | 3.5\
  \ | 7.2 |\n| Bulgaria 13800 | 4.2 | 9.6 |\n| Croatia 18000 | 2.3 | 17.7 | Czech\
  \ Republic 27100 | 1.9 | 8.5 |\n| Denmark 37000 | 2.8 | 6.1 |\n| … … … … | |\n\n\
  我们将使用该数据集来回答以下问题：\n\n(a) 使用完全连接法应用层次聚类并绘制相应的聚类图\n(b) 根据轮廓系数（silhouette coefficient）选择合适的聚类数量\n\
  (c) 使用给定数据形成 7 个类，并生成展示结果的相应聚类图\n(d) 为每个类使用不同的颜色创建数据的 3D 散图\n(e) 计算并绘制轮廓系数\n\n###\
  \ 10.2.1 - 创建层次聚类模型\n\n首先，为了回答问题 (a)，我们将使用给定数据执行层次聚类。我们的初始步骤包括导入回答上述问题所需的库以及导入给定数据。通过以下命令完成：\n\
  \n```r\n# 导入库\nlibrary(cluster)\n\n# 从文件读取数据\neurope = read.csv(\"europe.txt\")\n\
  \n# 获取距离矩阵\nd = dist(scale(europe))\n\n# 执行层次聚类\nhc = hclust(d, method = 'complete')\n\
  \n# 绘制聚类图\nplot(hc)\n```\n\n*(注：原文后部分存在大量重复内容，已根据“不要重复输出原文”的要求进行处理，仅保留并翻译核心逻辑结构)*\n\
  \n\n\n\n## 11.2 - DBSCAN 模型构建\n\n为了使用 DBSCAN 算法构建基于密度的聚类模型，我们将使用下表的数据：\n\n| X |\
  \ Y |\n|---|---||\n| x1 | 2 | 10 |\n| x2 | 2 | 5 |\n| x3 | 8 | 4 |\n| x4 | 5 | 8\
  \ |\n| x5 | 7 | 5 |\n| x6 | 6 | 4 |\n| x7 | 1 | 2 |\n| x8 | 4 | 9 |\n\n为了使用 R 可视化数据，我们首先需要使用以下命令创建相应的数据框：\n\
  \n```r\n# 构建包含 X 轴数据的向量\nX = c(2, 2, 8, 5, 7, 6, 1, 4)\n\n# 构建包含 Y 轴数据的向量\nY = c(10,\
  \ 5, 4, 8, 5, 4, 2, 9)\n\n# 构建包含对应行名的数据标签向量\nrnames = c(\"x1\", \"x2\", \"x3\",\
  \ \"x4\", \"x5\", \"x6\", \"x7\", \"x8\")\n\n# 创建数据框\nddata = data.frame(X, Y, row.names\
  \ = rnames)\n```\n\n创建好数据框后，我们可以使用以下命令绘制数据：\n\n```r\n# 绘制数据\nplot(ddata, pch = 15)\n\
  \n# 添加数据标签\ntext(ddata, labels = row.names(hdata), pos = c(4, 2, 4, 4, 4, 4, 4,\
  \ 4))\n```\n\n我们的数据如图所示：![](img/image00131.gif)\n\n## 11.3 - DBSCAN 计算\n\n在本小节中，我们将使用\
  \ `minPoints = 2` 和 `epsilon = {2, 3.5}` 应用 DBSCAN 算法，将给定数据划分到不同的聚类中。\n\n### `minPoints\
