  \n# 第 6 章 - 支持向量机分类\n\n## 6.1 引言\n\n### 6.1.1 支持向量机简介\n支持向量机 (`SVM`) 是一种寻找分离数据超平面的算法。该问题可以定义为最大化超平面与数据之间的距离（间隔）：\n\
  当 `f(x) = {w·x + b ≥ 1, w·x + b ≤ -1}` 时，`Margin = 2/||w||`。如果数据是不可分的，则可以将它们映射到不同维度的空间中。\n\
  \n### 6.1.2 R 中的支持向量机\n我们可以使用 `e1071` 库在 R 中构建支持向量机：\n```r\nlibrary(e1071)\n```\n\
  我们可以执行 `svm` 来构建模型：\n```r\nmodel = svm(y ~ ., kernel = \"radial\")\n```\n参数 `kernel`\
  \ 控制使用哪种内核（线性、多项式、径向），同时我们还可以定义更多参数，如 `degree`, `gamma`。通过执行 `svm` 可以查看所有参数。有了模型后，可以使用\
  \ `predict` 命令对新实例进行分类：\n```r\npredict(model, test)\n```\n如果我们还想查看每个类的概率，则必须添加 `probability\
  \ = TRUE` 参数。注意，在训练 (`svm`) 和运行 (`predict`) 时都必须添加该参数。\n\n## 6.2 支持向量机的构建与分类\n我们将使用\
  \ `alldata.txt` 文件的数据进行二分类问题：\n\n| | X1 | X2 | y |\n|---|---|---|---|\n| 最小值 | 3.253207\
  \ | 4.64161 | 1.0 |\n| 第一分位数 | 0.7090886 | 0.625361 | 1.0 |\n| 中位数 | 0.0116251 |\
  \ 1.641370 | 1.5 |\n| 平均值 | 0.0349357 | 1.939284 | 1.5 |\n| 第三分位数 | 0.7337179 |\
  \ 3.115350 | 2.0 |\n| 最大值 | 3.6395763 | 9.784076 | 2.0 |\n\n首先，导入数据集并将其分为训练数据和测试数据：\n\
  ```r\nalldata = read.csv(\"alldata.txt\")\ntrainingdata = alldata[1:600,]\ntestdata\
  \ = alldata[601:800,]\n```\n我们将回答以下问题：\na) 使用不同的颜色/符号绘制训练数据。\nb) 使用 RBF 核且 `gamma`\
  \ 等于 1 的 SVM，并在图 (a) 上绘制超平面。\nc) 对于 `gamma` 值 0.01 和 100 重复问题 (b)。你的观察结果是什么？\n\n\
  使用 gamma 值 `gammavalues = c(0.01, 0.1, 1, 10, 100, 1000, 10000, 100000, 1000000)`，我们将回答：\n\
  d) 计算训练误差和测试误差。\ne) 在同一张图中绘制这两个误差。你的观察结果是什么？\nf) 应用 10 折交叉验证来寻找 `gamma` 的最佳值。\n\n\
  ### 6.2.1 库导入\n首先，导入所需的库：\n```r\nlibrary(MLmetrics)\nlibrary(e1071)\n```\n\n###\
  \ 6.2.2 算法应用与超平面图\n对于问题 (a)，执行：\n```r\nplot(trainingdata[,1:2], col = trainingdata$y,\
  \ pch = c(\"o\",\"\"))\n```\n对于问题 (b), (c)，我们首先建立网格，并在上方绘制超平面：\n```r\nX1 = seq(min(trainingdata[,1]),\
  \ max(trainingdata[,1]), by = 0.1)\nX2 = seq(min(trainingdata[,2]), max(trainingdata[,2]),\
  \ by = 0.1)\nmygrid = expand.grid(X1, X2)\ncolnames(mygrid) = colnames(trainingdata)[1:2]\n\
  ```\n对于问题 (b)，我们训练 `gamma = 1` 的 SVM 并将其应用于网格上：\n```r\nsvm_model = svm(y ~ ., kernel=\"\
  radial\", type=\"C-classification\", data = trainingdata, gamma = 1)\npred = predict(svm_model,\
  \ mygrid)\nY = matrix(pred, length(X1), length(X2))\ncontour(X1, X2, Y, add = TRUE,\
  \ levels = 1.5)\n```\n同样，对于问题 (c)，当 `gamma = 0.01` 时：\n```r\nsvm_model = svm(y ~\
  \ ., kernel=\"radial\", type=\"C-classification\", data = trainingdata, gamma =\
  \ 0.01)\npred = predict(svm_model, mygrid)\nY = matrix(pred, length(X1), length(X2))\n\
  contour(X1, X2, Y, add = TRUE, levels = 1.5)\n```\n当 `gamma = 100` 时：\n```r\nsvm_model\
  \ = svm(y ~ ., kernel=\"radial\", type=\"C-classification\", data = trainingdata,\
  \ gamma = 100)\npred = predict(svm_model, mygrid)\nY = matrix(pred, length(X1),\
  \ length(X2))\ncontour(X1, X2, Y, add = TRUE, levels = 1.5)\n```\n最后，如图所示：\n![](img/image0107.jpeg)\n\
  \n### 6.2.3 训练与测试曲线\n对于问题 (d)，我们遍历 `gammavalues` 并计算训练误差：\n```r\ntraining_error\
  \ = c()\nfor (gamma in gammavalues) {\n  svm_model = svm(y ~ ., kernel=\"radial\"\
  , type=\"C-classification\", data = trainingdata, gamma = gamma)\n  pred = predict(svm_model,\
  \ trainingdata)\n  training_error = c(training_error, Accuracy(trainingdata$y, pred))\n\
  }\n```\n同样，对于测试误差：\n```r\ntesting_error = c()\nfor (gamma in gammavalues) {\n  svm_model\
  \ = svm(y ~ ., kernel=\"radial\", type=\"C-classification\", data = trainingdata,\
  \ gamma = gamma)\n  pred = predict(svm_model, testdata)\n  testing_error = c(testing_error,\
  \ Accuracy(testdata$y, pred))\n}\n```\n我们可以使用以下命令在同一张图中绘制这两个误差：\n```r\nplot(training_error,\
  \ type = \"l\", col=\"blue\", ylim = c(0, 0.5), xlab = \"Gamma\", ylab = \"Error\"\
  , xtxt = \"n\")\naxis(1, at = 1:length(gammavalues), labels = gammavalues)\nlines(testing_error,\
  \ col=\"red\")\n```\n\n\n\n\n\n# 从 10 个折中选择 9 个用于训练，1 个用于验证\n\n```r\ntrainingset\
  \ < trainingdata[unlist(folds[-i]),]\nvalidationset < trainingdata[unlist(folds[i]),]\n\
  ```\n\n# 训练并应用模型\n\n```r\nsvm_model = svm(y ~ ., kernel=\"radial\", type=\"C-classification\"\
  , data = trainingset, gamma = gamma)\npred = predict(svm_model, validations[, c(1:2)])\n\
  ```\n\n# 保存预测和测试集\n\n```r\npredictions < rbind(predictions, as.data.frame(pred))\n\
  testsets < rbind(testsets, as.data.frame(validationset[,3]))\n```\n\n# 计算新的准确率并添加到之前的准确率中\n\
  \n```r\naccuracies = c(accuracies, Accuracy(predictions, testsets))\n```\n\n我们计算每个折的准确率，最后选择准确率最高的\
  \ gamma 值：\n\n```r\nprint(accuracies)\nbestgamma = gammavalues[which.max(accuracies)]\n\
  ```\n\n## 6.3 练习\n\n你得到以下数据，其中 Y 是二分类分类的类别向量。X1 X2 Y\n\n2 2 1\n2 -2 1\n-2 -2 1\n\
  -2 2 1\n1 1 2\n1 -1 2\n-1 -1 2\n-1 1 2\n\n你可以使用以下命令在 R 中输入数据：\n\n```r\nX1 = c(2,\
  \ 2, -2, -2, 1, 1, -1, -1)\nX2 = c(2, -2, -2, 2, 1, -1, -1, 1)\nY = c(1, 1, 1, 1,\
  \ 2, 2, 2, 2)\nalldata = data.frame(X1, X2, Y)\n```\n\n回答以下问题：\n\na) 使用不同的颜色/符号为每个类别绘制训练数据图。\n\
  b) 应用带有 RBF 核的 SVM，并在问题 (a) 的图中画出超平面。\nc) 使用你的 jmodel，你会将值为 (4, 5) 的新实例归为哪一类？\n\n\
  # 第三部分 - 数据处理\n\n# 第 7 章 - 特征选择\n\n## 7.1 引言\n\n什么是特征选择？什么是过滤方法？什么是包装方法？\n\n## 7.2\
  \ 过滤方法\n\n在本节中，我们将使用相关特征选择 (CFS) 方法来选择用于训练和测试机器学习模型的属性。我们将使用 Iris 数据来实现此目的。\n\n\
  ```r\ndata = iris\n```\n\n# 划分为训练集和验证集\n\n```r\nset.seed(1234)\nind < sample(2,\
  \ nrow(data), replace=TRUE, prob=c(0.7, 0.3))\ntrainData < data[ind==1,]\nvalidationData\
  \ < data[ind==2,]\n```\n\n# 只保留没有缺失值的实例。\n\n```r\ntrainData < trainData[complete.cases(trainData),]\n\
  validationData < validationData[complete.cases(validationData),]\n```\n\n### 7.2.1\
  \ 使用 CFS 方法\n\nCFS 方法位于 `FSelector` 包中，要使用它我们需要调用 `cfsmethod`。\n\n```r\nlibrary(FSelector)\n\
  subset < cfs(Species ~ ., trainData)\nf < as.simple.formula(subset, \"Species\"\
  )\nprint(f)\n```\n\n`Species ~ Petal.Length + Petal.Width` `<environment: 0x114e18a70>`\n\
  \n输出是一个可以在各种分类算法中使用的公式，它表示根据 CFS 算法和训练数据集，预测鸢尾花品种（Species）的最佳特征是花瓣长度（Petal Length）和花瓣宽度（Petal\
  \ Width）。\n\n例如在朴素贝叶算法中，我们将使用包含所有属性的公式以及从 CFS 派生的公式。\n\n```r\nlibrary(e1071)\nmodel\
  \ < naiveBayes(Species ~ ., data=trainData, laplace = 1)\nsimpler_model < naiveBayes(f,\
  \ data=trainData, laplace = 1)\npred < predict(model, validationData)\nsimpler_pred\
  \ < predict(simpler_model, validationData)\n```\n\n```r\nlibrary(MLmetrics)\ntrain_pred\
  \ < predict(model, trainData)\ntrain_simpler_pred < predict(simpler_model, trainData)\n\
  paste(\"Accuracy in training all attributes\", Accuracy(train_pred, trainData),\
  \ sep=\" - \")\n```\n\n`[1] \"Accuracy in training all attributes - 0.964285714285714\"\
  `\n\n```r\npaste(\"Accuracy in training CFS attributes\", Accuracy(train_simpler_pred,\
  \ trainData), sep=\" - \")\n```\n\n`[1] \"Accuracy in training CFS attributes -\
  \ 0.95535714285714\"`\n\n```r\npaste(\"Accuracy in validation all attributes\",\
  \ Accuracy(pred, validationData), sep=\" - \")\n```\n\n`[1] \"Accuracy in validation\
  \ all attributes - 0.94736842105263\"`\n\n```r\npaste(\"Accuracy in validation CFS\
  \ attributes\", Accuracy(simpler_pred, validationData), sep=\" - \")\n```\n\n`[1]\
  \ \"Accuracy in validation CFS attributes - 0.97368421052631\"`\n\n使用所有属性时，训练集的准确率增加了，但与仅使用\
  \ 2 个属性的简单模型相比，验证集的准确率下降了。\n\n## 7.2 包装方法\n\n### 7.2.1 递归特征消除\n\n作为包装方法的演示，我们将使用递归特征消除\
  \ (RFE) 方法在 Pima Indians 数据集中选择属性。为此，将使用 `caret` 库。\n\n首先，一常一样，我们将数据集划分为训练集和验证集。\n\
  \n```r\nset.seed(1234)\n```\n\n# 加载所需的库\n\n```r\nlibrary(mlbench)\nlibrary(caret)\n\
  ```\n\n# 加载数据\n\n```r\ndata(PimaIndians)\ndata = PimaIndians\n```\n\n# 划分为训练集和验证集\n\
  \n```r\nset.seed(1234)\nind < sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))\n\
  trainData < data[ind==1,]\nvalidationData < data[ind==2,]\n```\n\n# 只保留没有缺失值的实例。\n\
  \n```r\ntrainData < trainData[complete.cases(trainData),]\nvalidationData < validationData[complete.cases(validationData),]\n\
  ```\n\n接下来我们将使用 `caret` 包中的 `rfe` 函数并对其进行设置。\n\n# 使用 nb 函数定义控制\n\n```r\ncontrol\
  \ <- rfeControl(functions=nb, method=\"cv\", number=10)\n```\n\n# 运行 RFE\n\n```r\n\
  results <- rfe(trainData[,1:8], trainData$diabetes, ctrl=control)\n```\n\n# 总结结果\n\
  \n```r\nprint(results)\n```\n\n`Resampling method: Cross Validation (10 fold)`\n\
  `Variables AccuracySD`\n`1 0.7453 0.3681`\n`2 0.7546 0.4182`\n`3 0.7715 0.4707`\n\
  `4 0.7584 0.4479`\n`5 0.7546 0.4457`\n`6 0.7490 0.4344`\n`7 0.7509 0.4290`\n`8 0.7491\
  \ 0.4201`\n`The top 3 variables (out of 8):`\n`glucose, age, mass`\n\n在 8 个变量中，RFE\
  \ 选出了三个（glucose, age, mass），它们在 10 折交叉验证下提供了最好的准确率。\n\n# 列出选定的特征\n\n```r\npredictors(results)\n\
