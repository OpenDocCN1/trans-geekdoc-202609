  \n\n## 2.1 定义\n\n机器学习（Machine Learning, ML）是计算机科学领域中人工智能（AI）的一个子集，它通常使用统计技术使计算机能够通过数据进行“学习”（即通过数据不断提高其在特定任务上的性能），而无需显式的程序编写。\n\
  \n机器学习通常与以下领域密切相关，甚至可以被用作同义术语：数据挖掘（通过在涉及机器学习、统计学和数据库系统交叉领域的方法，从庞大的数据集中发现模式的过程）、模式识别、统计推断或统计学习。所有这些领域通常采用相同的方法，其名称可能会根据从业人员的专业知识或应用领域而发生变化。\n\
  \n## 2.2 主要类别与任务\n\n主要的机器学习任务通常根据学习系统是否有可用“反馈”或“老师”分为两个大类：\n\n-   监督学习（Supervised\
  \ Learning）：系统接收由“老师”提供的示例输入及其期望输出，机器学习算法的目标是创建一个从输入到输出的映射。这种映射可以被看作一个函数，如果给它一个训练样本作为输入，它应该输出期望的值。\n\
  -   无监督学习（Unsupervised Learning）：在无监督学习的情况下，机器学习算法不会被任何期望输出的示例，而是让其自己在输入数据中寻找结构。\n\
  \n主要的机器学习任务以及我们在本教科书中将要研究的任务，是根据系统最终尝试实现的目标而进行划分的：\n\n-   分类（Classification）：将输入分为两个或多个类别，学习器必须产生一个模型，将未见过的输入分配给这些类别中的某一个或多个（多标签分类）。这通常以监督学习的方式来解决。垃圾邮件过滤是分类的一个例子，其中输入是电子邮件（或其他）消息，类别是“垃圾邮件”和“非垃圾邮件”。\n\
  -   回归（Regression）：也是一个监督问题，但输出是连续的而非离散的。\n-   聚类（Clustering）：将一组输入划分为若干组。与分类不同，这些组是预先未知的，这通常是一项无监督任务。\n\
  -   降维（Dimensionality Reduction）：通过将输入映射到低维空间来简化输入。主题建模（Topic modeling）是一个相关问题，其中给程序一个人类语言文档列表，任务是找出哪些文档涵盖相似的主题。\n\
  -   关联规则学习（Association Rules learning，或依赖建模）：搜索输入之间的关系。例如，超市可能会收集客户购买习惯的数据。使用关联规则学习，超市可以确定哪些产品经常被一起购买，并利用这些信息进行营销目的。这有时被称为购物篮子分析。\n\
  \n## 2.3 机器学习生存指南\n\n现在你面对了一个问题。你将用什么方法来处理它？\n\n首先，你必须理解你尝试用现有的（或提供的）数据和机器学习算法来解决的问题。这个问题是正式定义的吗？还是正式定义的吗？还是两者都是？是否有任何需要做的假设？如果不使用机器学习，可以如何解决它？解决这个问题的动机是什么？\n\
  \n下一步是准备数据以供你喜欢的机器学习算法使用，因为数据通常不符合你所需的格式，或者存在其他问题。应该考虑：1) 有哪些可用数据，2) 是否有缺失值，3) 是否有数据需要删除（例如学生\
  \ ID，如果我们想预测学生在学期结束时的平均 GPA，则它没有任何预测价值），4) 进行组织、清洗和采样，以及 5) 进行转换。\n\n\n\n\n此外，我们将使用\
  \ `rpart.plot` 库来绘制生成的树：\n\n`library(rpart.plot)`\n\n构建新决策树需要执行 `rpart` 命令：\n\n\
  ```r\nmodel < rpart(Target ~ ., method = \"class\", data = ..., minsplit = ...,\
  \ minbucket = ..., cp = ...)\n```\n\n我们可以使用 `plot(model)` 和 `text(model, use.n =\
  \ TRUE)` 来绘制树，或者使用以下命令：\n\n```r\nrpart.plot(model, extra = 104, nn = TRUE)\n```\n\
  \n为了检查 `rpart` 的参数，我们可以运行 `?rpart`。此外，如果执行 `?rpart.control`，我们也可以检查主要参数：\n\n- `minsplit`:\
  \ 节点进行拆分所需的最少实例数量\n- `minbucket`: 树的每个叶子节点中允许的最少实例数量\n- `maxdepth`: 树的最大深度\n- `cp`:\
  \ 控制分裂复杂性的参数，其设置非常直观（值越大，对树进行剪枝的概率越高）\n\n## 3.2 分裂标准与决策树构建\n\n为了计算不同分裂标准的数值，我们将使用下表中的训练数据作为示例，该表涉及一个二分类问题。\n\
  \n| Outlook (天气) | Temperature (温度) | Humidity (湿度) | Play (是否玩) |\n| :--- | :---\
  \ | :--- | :--- |\n| Sunny | Hot | High | No |\n| Sunny | Hot | Low | No |\n| Rainy\
  \ | Hot | Low | Yes |\n| Rainy | Cool | High | Yes |\n| Rainy | Cool | Low | Yes\
  \ |\n| Rainy | Hot | Low | No |\n| Rainy | Cool | Low | Yes |\n| Sunny | Hot | High\
  \ | No |\n| Sunny | Cool | Low | Yes |\n| Rainy | Hot | Low | Yes |\n| Sunny | Cool\
  \ | Low | Yes |\n| Rainy | Hot | High | Yes |\n| Rainy | Cool | Low | Yes |\n| Sunny\
  \ | Cool | High | No |\n\n我们将对上述数据集应用决策树算法。我们将回答以下问题：\n\na) 如果使用 G 尼 指数（Gini index）进行分裂，应该在哪个特征（天气、温度或湿度之间）上进行第一次分裂？\n\
  \nb) 如果使用信息增益（Information gain）进行分裂，应该在哪个特征（天气、温度或湿度之间）上进行第一次分裂？\n\nc) 使用 G 尼 指数构建完整的决策树。并绘制该树。\n\
  \n### 3.2.1 数据与库导入\n\n最初，我们读取数据并导入所需的库：\n\n```r\nweather = read.csv(\"weather.txt\"\
  )\nlibrary(rpart)\nlibrary(rpart.plot)\n```\n\n### 3.2.2 分裂标准\n\n为了查看变量 `Outlook`（天气）的分裂，我们执行以下命令：\n\
  \n```r\nmodel < rpart(Play ~ Outlook, method = \"class\", data = weather, minsplit\
  \ = 1)\n```\n\n如果我们也对温度和湿度运行此命令，然后使用 `rpart.plot(model, extra = 104, nn = TRUE)`\
  \ 绘制所有三个，将提供以下可视化结果：\n\n![](img/image00101.gif)\n\n直观上，我们已经可以理解这三个分裂中将选择哪一个，对吧？\n\
  \n#### 3.2.2.1 G 尼 指数\n\n我们使用以下公式计算 `Outlook` 的 G 尼 指数：\n\n`GINI(Sunny) = 1-Freq(Play\
  \ = No|Outlook = Sunny)² -Freq(Play = Yes|Outlook = Sunny)²`\n\n`GINI(Rainy) = 1-Freq(Play\
  \ = No|Outlook = Rainy)² -Freq(Play = Yes|Outlook = Rainy)²`\n\n`GINI[Outlook] =\
  \ Freq(Outlook = Sunny)*GINI(Sunny) + Freq(Outlook = Rainy)*GINI(Rainy)`\n\n计算结果为：\n\
  `GINI(Sunny) = 1-(4/6)²-(2/6)² = 0.444`\n`GINI(Rainy) = 1-(1/8)²-(7/8)² = 0.219`\n\
  `GINI[Outlook] = (6/14)*0.444 + (8/14)*0.219 = 0.315`\n\n同样，温度和湿度的 GNI 分别为 `GINI[Temp.]\
  \ = 0.367` 和 `GINI[Hum.] = 0.394`。因此，回答问题 (a)，使用 G 尼 指数的最佳分裂是在 `Outlook` 上。我们也可以使用\
  \ R 进行这些计算。对于 `Outlook`，我们构建以下频率数组：\n\n```r\nabsfreq = table(weather, c(1, 4))\n\
  freq = prop.table(absfreq, 1)\nfreqSum = rowSums(prop.table(absfreq))\n```\n\n我们计算\
  \ `Sunny` 和 `Rainy` 的 G 尼 指数：\n`GINI_Sunny = 1-(4/6)²-(2/6)²`\n`GINI_Rainy = 1-(1/8)²-(7/8)²`\n\
  \n`Outlook` 的总 G 尼 计算公式为：\n`GINI_Outlook = freqSum[\"Sunny\"]*GINI_Sunny + freqSum[\"\
  Rainy\"]*GINI_Rainy`\n\n#### 3.2.2.2 信息增益\n\n我们使用以下公式计算 `Outlook` 的信息增益：\n\n`Entropy(All)\
  \ = -Freq(No)*log(No)-Freq(Yes)*log(Yes)`\n`Entropy(Sunny) = -Freq(No|Sunny)*log(No|Sunny)-Freq(Yes|Sunny)*log(Yes|Sunny)`\n\
  `Entropy(Rainy) = -Freq(No|Rainy)*log(No|Rainy)-Freq(Yes|Rainy)*log(Yes|Rainy)`\n\
  `GAIN[Outlook] = Entropy(All)-Freq(Sunny)*Entropy(Sunny)-Freq(Rainy)*Entropy(Rainy)`\n\
  \n计算结果为：\n`Entropy(All) = -(5/14)*log(5/14)-(9/14)*log(9/14) = 0.652`\n`Entropy(Sunny)\
  \ = -(4/6)*log(4/6)-(2/6)*log(2/6) = 0.637`\n`Entropy(Rainy) = -(1/8)*log(1/8)-(7/8)*log(7/8)\
  \ = 0.377`\n`GAIN[Outlook] = 0.652-(6/14)*0.637+(8/14)*0.377 = 0.164`\n\n同样，温度和湿度的信息增益分别为\
  \ `GAIN[Temp.] = 0.105` 和 `GAIN[Hum.] = 0.071`。因此，回答问题 (a)，使用信息增益的第一次分裂是在 `Outlook`\
  \ 上。我们也可以使用 R 进行这些计算。最初，我们计算数据集的总体熵：\n\n```r\nfreq = prop.table(table(weather, c(4)))\n\
  Entropy_All = freq[\"No\"]*log(freq[\"No\"])+freq[\"Yes\"]*log(freq[\"Yes\"])\n\
  ```\n\n然后，对于 `Outlook`，我们构建以下频率数组：\n\n```r\nabsfreq = table(weather, c(1, 4))\n\
  freq = prop.table(absfreq, 1)\nfreqSum = rowSums(prop.table(absfreq))\n```\n\n我们计算\
  \ `Sunny` 和 `Rainy` 的熵：\n`Entropy_Sunny = -freq[\"Sunny\", \"No\"]*log(freq[\"Sunny\"\
  , \"No\"]-freq[\"Sunny\", \"Yes\"]*log(freq[\"Sunny\", \"Yes\"])`\n`Entropy_Rainy\
  \ = -freq[\"Rainy\", \"No\"]*log(freq[\"Rainy\", \"No\"]-freq[\"Rainy\", \"Yes\"\
  ]*log(freq[\"Rainy\", \"Yes\"])`\n\n`Outlook` 的总信息增益计算为：\n`GAIN_Outlook = Entropy_All-freqSum[\"\
  Sunny\"]*Entropy_Sunny-freqSum[\"Rainy\"]*Entropy_Rainy`\n\n### 3.2.3 构建决策树\n\n\
  对于问题 (c)，我们使用 `rpart` 构建一个决策树：\n\n```r\nmodel < rpart(\n  Play ~ Outlook + Temperature\
  \ + Humidity,\n  method = \"class\",\n  data = weather,\n  minsplit = 1,\n  minbucket\
  \ = 1,\n  cp = -1)\n```\n\n此外，我们可以使用以下命令绘制树：\n\n```r\nrpart.plot(model, extra =\
  \ 104, nn = TRUE)\n```\n树如图所示：![](img/image0102.gif)\n\n## 3.3 剪枝与评估指标的应用\n\n决策树分类器也可以应用于具有连续预测变量的数据集，例如\
  \ iris（鸢）数据集。从 iris 数据集中，我们将只保留前 2 列并丢弃最后 50 个实例，这样我们现在就有两个预测特征和一个目标类别的二分类问题。我们可以在\
  \ R 中如下执行这些转换：\n\n```r\niris2 = iris[, c(1, 2, 5)]\niris2$Species[101:150] = iris2$Species[21:70]\n\
  iris2$Species = factor(iris2$Species)\n```\n\n之后，我们将数据集分为训练数据和测试数据：\n\n```r\ntrainingdata\
  \ = iris2[, c(1:40, 51:90, 101:140)]\ntestdata = iris2[, c(41:50, 91:100, 141:150)]\n\
  ```\n\n我们将回答以下问题：\n\na) 使用训练数据构建决策树（`rpart` 的 `minsplit` 参数设置为 20，这是默认值）。\n\nb)\
  \ 将模型应用于测试数据，并计算这两个类的精确率、召回率和 F 值。\n\nc) 构建两个决策树，一个 `minsplit` 设置为 10，另一个 `minsplit`\
  \ 设置为 30，将它们应用于测试数据，并计算这两个类的精确率、召回率和 F 值。d) 根据给出的 versicolor 类的 F 值比较这三个模型。\n\n\
  ### 3.3.1 决策树的训练与测试\n\n我们使用以下命令训练并绘制决策树（问题 (a), (c)）：\n\n```r\nmodel < rpart(\n\
  \  Species ~ .,\n  method = \"class\",\n  data = trainingdata,\n  minsplit = 20)\n\
  \nrpart.plot(model, extra = 104, nn = TRUE)\n```\n\n\n\n公式中的 `.in` 代表数据框 `trainingdata`\
  \ 中剩余的所有变量。我们也可以使用命令在测试集上执行我们的模型：\n\n```r\nxtest = testdata[,1:2]\nytest = testdata[,3]\n\
  pred = predict(model, xtest, type=\"class\")\n```\n\n### 3.3.2 评估指标\n\n我们可以通过以下命令生成混淆矩阵并计算有指标（问题\
  \ (b), (c)）：\n\n`library` (`MLmetrics`)\n\n```r\ncm = ConfusionMatrix(pred, ytest)\n\
  accuracy = Accuracy(pred, ytest)\nprecision = Precision(ytest, pred, 'versicolor')\n\
  recall = Recall(ytest, pred, 'versicolor')\nf1 = F1_Score(ytest, pred, 'versicolor')\n\
  data.frame(precision, recall, f1)\n```\n\n（或者，我们可以计算 TP、FP、TN 和 FN，并通过 `TP/(TP +\
  \ FP)` 计算精确率，通过 `TP/(TP + FN)` 计算召回率）\n\n最后，三个模型的 F 度量显示在以下数组中（问题 (d））：决策树 F-度量\n\
  \n```text\nminsplit = 10 0.833\nminsplit = 20 0.947\nminsplit = 30 0.857\n```\n\n\
  ### 3.4 练习\n\n你给了一个用于二分类问题的以下数组训练数据。\n\n| CustomerID | Sex | CarType | Budget |\
  \ Insurance |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | M | Family | Low | No\
