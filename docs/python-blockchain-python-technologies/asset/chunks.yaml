  trans: "\n\n![](img/rsrcW1.jpg)\n\n![](img/rsrcW1.jpg)\n\n# Python 区块链技术 作者：Vishal\
    \ Gupta\n\n版权所有。未经出版者明确书面许可，本书的任何部分均不得复制、存储在检索系统中，或以任何形式或通过手段（电子、机械、复印、录音或其他）进行传输。\n\
    \n我想将这本书献给将使用它的学生们。祝愿你们未来的职业成功，并希望你们永远停止学习。\n\n## 目录\n- 介绍\n- 开发客户端\n- 客户端类\n\
    - 交易类\n- 创建多个交易\n- 区块类\n- 创建创世区块\n- Python 创建块链\n- 添加创世区块\n- 创建矿工\n- 添加区块\n- 范围与结论\n\
    \n## 介绍\n在区块链的教程中，我们详细学习了区块链背后的理论。区块链是世界上最流行的数字货币——比特币背后的基础构建模块。本教程深入探讨了比特币的复杂性，并充分解释了区块链架构。下一步是构建我们自己的区块链。中本·聪聪（Satoshi\
    \ Nakamoto）创建了世界上第一种名为比特币的虚拟货币。看到比特币的成功，许多人也创建了自己的虚拟货币。列举几个——Litecoin、Zcash 等。现在，你可能也想发行自己的货币。让我们将其称为\
    \ TPCoin（TutorialsPoint 币）。你将编写一个区块链来记录所有涉及 TPCoin 的交易。TPCoin 可用于购买披萨、汉堡、沙拉等。可能会有其他服务提供商加入你的网络，并开始接受\
    \ TPCoin 作为提供其服务的货币。可能性是无限的。在本教程中，让我们了解如何构建这样一个系统并在市场上推出你自己的数字货币。\n\n### 区块链项目开发涉及的组件\n\
    整个区块链项目开发由三个主要部分组成——\n- 客户端 (Client)\n- 矿工 (Miners)\n- 区块链 (Blockchain)\n\n###\
    \ 客户端\n客户端是向其他供应商处购买商品的人。客户端本身也可以成为供应商，并根据其提供的货物收取他人的钱。我们在此假设客户端既可以是 TPCoins 的供应者也是接收者。因此，我们将在代码中创建一个\
    \ `client` 类，该类具有发送和接收资金的能力。\n\n### 矿工\n矿工是从交易池中拾取交易并将其组装成区块的人。矿工必须提供有效的工作证明（proof-of-work）以获得挖矿奖励。矿工作为费用收集的所有资金将归他所有。他可以像上述客户端一样，将这些钱花在从网络其他其他注册供应商购买商品或服务。\n\
    \n### 区块链\n最后，区块链是一种按顺序将所有挖掘出的区块连接在一起的数据结构。这条链是不可变的，因此是防篡的。你可以通过在新的 Jupyter notebook\
    \ 中输入每一步的代码来遵循本教程。或者，你也可以从 `www.anaconda.com` 下载整个 Jupyter notebook。在下一章中，我们将开发一个使用我们区块链系统的客户端。\n\
    \n## 开发客户端\n客户端是持有 TPCoins 并与网络上的其他供应商（包括他自己）进行商品/服务交易的人。我们应该为这一目的定义一个 `Client`\
    \ 类。为了给客户端创建一个全局唯一的身份标识，我们使用 `PKI`（公钥基础设施）。在本章中，让我们详细讨论一下。客户端应该能够从他的钱包将钱发送给另一个已知人员。同样，客户端应该能够从第三方处接收钱。为了花钱，客户端将创建一个交易，指定发送者的姓名和要支付的金额。为了接收钱，客户端将向第三方提供他的身份——这本质上是资金的发送者。我们不存储客户端在钱包中的余额金额。在交易期间，我们将计算实际余额，以确保客户端有足够的余额进行支付。\n\
    \n为了开发 `Client` 类以及项目中的其余代码，我们需要导入许多 Python 库。列举如下——\n```python\n# import libraries\n\
    import hashlib\nimport random\nimport string\nimport json\nimport binascii\nimport\
    \ numpy as np\nimport pandas as pd\nimport pylab as pl\nimport logging\nimport\
    \ collections\n```\n除了上述库之外，我们还将对交易进行签名，创建对象的哈希值。为此，你需要导入 PKI 需要的以下库：\n```python\n\
    import Crypto\nfrom Crypto.Hash import SHA\nfrom Crypto.PublicKey import RSA\n\
    ```\n```5\n\n## 客户端类\n`Client` 类使用内置的 `RSA` 算法生成私钥和公钥。感兴趣的读者可以参考本教程实现 `RSA`。在对象初始化期间，我们创建私钥和公钥并将值存储在实例中。\n\
    ```python\nself._private_key = RSA.generate(1024)\nself._public_key = self._private_key.publickey()\n\
    ```\n注意，你永远不要丢失你的私钥。为了记录，可以将生成的私钥复制到外部存储器，或者只需写下它的 ASCII 表示。生成的公钥将作为客户端的身份。为此，我们定义了一个名为\
    \ `identity` 的属性，返回公钥的 HEX 表示。\n```python\n@property\ndef identity(self):\n  \
    \  return binascii.hexlify(self._public_key.format('DER'))\n```\n`identity` 对于每个客户端都是唯一的，并且可以公开。任何人都可以使用\
    \ `identity` 向你发送虚拟货币，它将被添加到你的钱包。`Client` 类的完整代码所示：\n```python\nclass Client:\n\
    \    def __init__(self):\n        random = Crypto.Random.new()\n        self._private_key\
    \ = RSA.generate(1024, random)\n        self._public_key = self._private_key.publickey()\n\
    \        self._signer = PKCS1_15.new(self._private_key)\n\n    @property\n   \
    \ def identity(self):\n        return binascii.hexlify(self._public_key.format('DER'))\n\
    ```\n\n### 测试客户端\n现在，我们将编写代码演示如何使用 `Client` 类\n```python\nDinesh = Client()\n\
    print(Dinesh.identity)\n```\n上述代码创建了一个 `Client` 实例并赋值给变量 `Dinesh`。我们通过调用其 `identity`\
    \ 方法打印 `Dinesh` 的公钥。输出所示\n```\\n\
    ```\n现在，让我们在下一章中继续创建一个交易。\n\n"
- fmt: "\n# Transaction Class\n\nIn this chapter, let us create a `Transaction` class\
    \ so that a client will be able to send money to somebody. Note that a client\
    \ can be both a sender or a recipient of the money. When you want to receive money,\
    \ some other sender will create a transaction and specify your `public` address\
    \ in it.\n\nWe define the initialization of a transaction class as follows:\n\n\
    ```python\ndef __init__(self, sender, recipient, value):\n    self.sender = sender\n\
    \    self.recipient = recipient\n    self.value = value\n    self.time = datetime.datetime.now()\n\
    ```\n\nThe `init` method takes three parameters: the sender’s `public` key, the\
    \ recipient’s `public` key, and the amount to be sent. These are stored in the\
    \ instance variables for use by other methods. Additionally, we create one more\
    \ variable for storing the time of transaction.\n\nNext, we write a utility method\
    \ called `to_dict` that combines all the four above-mentioned instance variables\
    \ in a dictionary object. This is just to put the entire transaction information\
    \ accessible through a single variable.\n\nAs you know from the earlier tutorial\
    \ that the first block in the blockchain is a `Genesis` block. The `Genesis` block\
    \ contains the first transaction initiated by the creator of the blockchain. The\
    \ identity of this person may be kept a secret like in the case of Bitcoins. So\
    \ when this first transaction is created, the creator may just send his identity\
    \ as `Genesis`. Thus, while creating the dictionary, we check if the sender is\
    \ `Genesis` and if so we simply assign some string value to the identity variable;\
    \ else, we assign the sender’s identity to the `identity` variable.\n\n```python\n\
    if self.sender == \"Genesis\":\n    identity = \"Genesis\"\nelse:\n    identity\
    \ = self.sender.identity\n```\n\nWe construct the dictionary using following line\
    \ of code:\n\n```python\nreturn collections.OrderedDict ({ 'sender': identity,\
    \ 'recipient': self.recipient, 'value': self.value, 'time': self.time })\n```\n\
    \nThe entire code for the `to_dict` method is shown below:\n\n```python\ndef to_dict(self):\n\
    \    if self.sender == \"Genesis\":\n        identity = \"Genesis\"\n    else:\n\
    \        identity = self.sender.identity\n    return collections.OrderedDict ({\
    \ 'sender': identity, 'recipient': self.recipient, 'value': self.value, 'time':\
    \ self.time })\n```\n\nFinally, we will sign this dictionary object using the\
    \ private key of the sender. As before, we use the built-in PKI with SHA algorithm.\
    \ The generated signature is decoded to get the ASCII representation for printing\
    \ and storing it in our blockchain. The `sign_transaction` method code is shown\
    \ here:\n\n```python\ndef sign_transaction(self):\n    private_key = self.sender._private_key\n\
    \    signer = PKCS1_v1_5.new(private_key)\n    h = SHA.new(str(self.to_dict()).encode('utf8'))\n\
    \    return binascii.hexlify(signer.sign(h)).decode('ascii')\n```\n\n# Testing\
    \ Transaction Class\n\nFor this purpose, we will create two users, called `Dinesh`\
    \ and `Ramesh`. Dinesh will send 5 TPCoins to Ramesh. For this first we create\
    \ the clients called `Dinesh` and `Ramesh`.\n\n```python\nDinesh = Client()\n\
    Ramesh = Client()\n```\n\nRemember that when you instantiate a `Client` class,\
    \ the `public` and `private` keys unique to the client would be created. As Dinesh\
    \ is sending payment to Ramesh, he will need the public key of Ramesh which is\
    \ obtained by using the `identity` property of the client. Thus, we will create\
