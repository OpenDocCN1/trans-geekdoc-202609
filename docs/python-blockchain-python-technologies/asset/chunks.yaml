  trans: "\n\n# Block 类\n\n`Block` 类由任意数量的交易组成。为了简单起见，在本文中，我们假设区块包含固定数量的交易，在本例中为三个。由于区块需要存储这三个交易的列表，我们将声明一个名为\
    \ `verified_transactions` 的实例变量，如下—— `self.verified_transactions = []`。我们将此变量命名为\
    \ `verified_transactions`，表示只有经过的有效交易会被添加到区块中。每个区块还持有上一个区块的哈希值，使得区块链变得不可篡改。为了存储上一个哈希值，我们声明一个实例变量如下——\
    \ `self.previous_block_hash = \"\"`。最后，我们又声明了一个名为 `Nonce` 的变量，用于存储矿工在挖掘过程中生成的随机数。`self.Nonce\
    \ = \"\"`\n\n`Block` 类的完整定义如下：\n\n```python\nclass Block:\n    def __init__(self):\n\
    \        self.verified_transactions = []\n        self.previous_block_hash = \"\
    \"\n        self.Nonce = \"\"\n```\n\n由于每个区块都需要上一个区块的哈希值，我们声明了一个名为 `last_block_hash`\
    \ 的全局变量，如下—— `last_block_hash = \"\"`。现在让我们在区块链中创建第一个区块。\n\n## 创建创世区块 (Genesis\
    \ Block)\n\n我们假设 TPCoins 的创始人最初向已知客户端 `Dinesh` 发送了 500 个 TPCoins。为此，他首先创建了一个 `Dinesh`\
    \ 实例——`Dinesh = Client()`。然后我们创建一个创世交易，并将 500 个 TPCoins 发送到 Dinesh 的公地址。`t0 =\
    \ Transaction(\"Genesis\", Dinesh.identity, 500.0)`\n\n现在，我们创建一个 `Block` 类实例并将其命名为\
    \ `block0`。`block0 = Block()`。我们将 `previous_block_hash` 和 `Nonce` 实例变量初始化为 `None`，因为这是区块链中存储的第一个交易。`block0.previous_block_hash\
    \ = None`, `Nonce = None`\n\n接下来，我们将上述 `t0` 交易添加到区块内部维护的 `verified_transactions`\
    \ 列表中——`block0.verified_transactions.append(t0)`。此时，区块已完全初始化，准备好添加到我们的区块链中。我们将为此目的创建区块链。在将区块添加到区块链之前，我们会对区块进行哈希处理，将其值存储在之前声明的全局变量\
    \ `last_block_hash` 中。该值将由下一个矿工在其区块中使用。我们使用以下两行代码对区块进行哈希处理并存储摘要值：\n\n```python\n\
    digest = hash(block0)\nlast_block_hash = digest\n```\n\n最后，我们将像下一章所示的那样创建一个区块链。\n\
    \n## 使用 Python 创建区块链\n\n区块链包含一个相互链接的区块列表。为了存储整个列表，我们将创建一个名为 `TPCoins` 的列表变量——`TPCoins\
    \ = []`。我们还会编写一个名为 `dump_blockchain` 的实用方法，用于导出整个区块链的内容。我们首先打印区块链的长度，以便知道区块链中目前存在多少区块。\n\
    \n```python\ndef dump_blockchain(self):\n    print(\"Number of blocks in the chain:\
    \ \" + str(len(self)))\n```\n\n注意，随着时间的推移，区块链中的区块数量可能会非常高，难以打印。因此，当你打印区块链内容时，可能需要决定你想要检查的范围。在下面的代码中，我们打印了整个区块链，因为在当前的演示中不会添加太多的区块。为了遍历链，我们设置了如下\
    \ `for` 循环——\n\n```python\nfor x in range(len(TPCoins)):\n    block_temp = TPCoins[x]\n\
    ```\n\n每个引用的区块都被复制到一个临时变量 `block_temp` 中。我们将区块编号作为每个区块的标题打印。注意数字从零开始，第一个区块是编号为零的创世区块。`print(\"\
    block # \" + str(x))`\n\n在每个区块内部，我们用名为 `verified_transactions` 的变量存储了一个包含三个交易的列表（创世区块除外）。我们在\
    \ `for` 循环遍历此列表，并对获取的每个项调用 `display_transaction` 函数来显示交易详情。\n\n```python\nfor\
    \ transaction in block_temp.verified_transactions:\n    display_transaction(transaction)\n\
    ```\n\n整个函数的定义如下：\n\n```python\ndef dump_blockchain(self):\n    print(\"Number\
    \ of blocks in the chain: \" + str(len(self)))\n    for x in range(len(TPCoins)):\n\
    \        block_temp = TPCoins[x]\n        print(\"block # \" + str(x))\n     \
    \   for transaction in block_temp.verified_transactions:\n            display_transaction(transaction)\n\
    \    print('--------------')\n    print('=====================================')\n\
    ```\n\n注意，在这里我们在代码的适当位置插入了分隔符，以区分区块及其内部的交易。由于我们现在创建了用于存储区块的区块链，下一个任务是创建区块并将其添加到区块链中。为此，我们将添加之前已创建的创世区块。\n\
    \n## 添加创世区块\n\n将区块添加到区块链涉及将创建的区块添加到我们的 `TPCoins` 列表中`TPCoins.append(block0)` 注意，与系统的其他区块不同，创世区块仅包含一个由\
    \ TPCoins 系统发起的交易。现在，你通过调用全局函数 `dump_blockchain` 来导出区块链的内容——`dump_blockchain(TPCoins)`\n\
    \n当你执行此函数时，将看到以下输出：\n\n```\nNumber of blocks in the chain: 1\nblock # 0\nsender:\
    \ Genesis\n-----\nrecipient: \n\
    -----\nvalue: 500.0\n-----\ntime: 2019-01-14 16:18:02.042739\n-----\n--------------\n\
    --------------\n=====================================\n```\n\n此时区块链系统已准备就绪。现在我们将通过提供挖掘功能，让感兴趣的客户成为矿工。\n\
    \n"
- fmt: "\n# Creating Miners\n\nFor enabling mining, we need to develop a mining function.\
    \ The mining functionality needs to generate a digest on a given message string\
    \ and provide a proof-of-work. Let us discuss this in this chapter.\n\n## Message\
    \ Digest Function\n\nWe will write a utility function called `sha256` for creating\
    \ a digest on a given message:\n\n```python\ndef sha256(message): return hashlib.sha256(message.encode('ascii')).hexdigest()\n\
    ```\n\nThe `sha256` function takes a `message` as a parameter, encodes it to ASCII,\
    \ generates a hexadecimal digest and returns the value to the caller.\n\n## Mining\
    \ Function\n\nWe now develop the `mine` function that implements our own mining\
    \ strategy. Our strategy in this case would be to generate a hash on the given\
    \ message that is prefixed with a given number of 1’s. The given number of 1’s\
    \ is specified as a parameter to `mine` function specified as the difficulty level.\n\
    \nFor example, if you specify a difficulty level of 2, the generated hash on a\
    \ given message should start with two 1’s - like `11xxxxxxxx`. If the difficulty\
    \ level is 3, the generated hash should start with three 1’s - like `111xxxxxxxx`.\
    \ Given these requirements, we will now develop the mining function as shown in\
    \ the steps given below.\n\n### Step 1\nThe mining function takes two parameters\
    \ - the message and the difficulty level.\n```python\ndef mine(message, difficulty=1):\n\
    ```\n\n### Step 2\nThe difficulty level needs to be greater or equal to 1, we\
    \ ensure this with the following assert statement:\n```python\nassert difficulty\
    \ >= 1\n```\n\n### Step 3\nWe create a `prefix` variable using the set difficulty\
    \ level.\n```python\nprefix = '1' * difficulty\n```\nNote if the difficulty level\
    \ is 2 the prefix would be “11” and if the difficulty level is 3, the prefix would\
    \ be “111”, and so on. We will check if this prefix exists in the generated digest\
    \ of the message.\n\nTo digest the message itself, we use the following two lines\
    \ of code:\n```python\nfor i in range(1000):\n    digest = sha256(str(hash(message))\
    \ + str(i))\n```\n\nWe keep on adding a new number `i` to the message hash in\
    \ each iteration and generate a new digest on the combined message. As the input\
    \ to the `sha256` function changes in every iteration, the `digest` value would\
    \ also change. We check if this `digest` value has above-set `prefix`.\n```python\n\
    if digest.startswith(prefix):\n```\nIf the condition is satisfied, we will terminate\
    \ the `for` loop and return the `digest` value to the caller.\n\nThe entire `mine`\
    \ code is shown here:\n```python\ndef mine(message, difficulty=1):\n    assert\
    \ difficulty >= 1\n    prefix = '1' * difficulty\n    for i in range(1000):\n\
    \        digest = sha256(str(hash(message)) + str(i))\n        if digest.startswith(prefix):\n\
    \            print (\"after \" + str(i) + \" iterations found nonce: \"+ digest)\n\
    \            return digest\n```\nFor your understanding, we have added the `print`\
    \ statement that prints the digest value and the number of iterations it took\
    \ to meet the condition before returning from the function.\n\n## Testing Mining\
    \ Function\n\nTo test our mining function, simply execute the following statement:\n\
    ```python\nmine (\"test message\", 2)\n```\nWhen you run the above code, you will\
    \ see the output similar to the one below:\n```\nafter 138 iterations found nonce:\
    \ 11008a740eb2fa6bf8d55baecda42a41993ca65ce66b2d3889477e6bfad1484c\n```\nNote\
    \ that the generated digest starts with “11”. If you change the difficulty level\
    \ to 3, the generated digest will start with “111”, and of course, it will probably\
    \ require more number of iterations. As you can see, a miner with more processing\
    \ power will be able to mine a given message earlier. That’s how the miners compete\
    \ with each other for earning their revenues. Now, we are ready to add more blocks\
    \ to our blockchain. Let us learn this in our next chapter.\n"
