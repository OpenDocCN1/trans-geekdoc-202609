  trans: "\n\n# 创建矿工\n\n为了启用挖掘功能，我们需要开发一个挖掘函数。挖掘功能需要对给定的消息字符串生成摘要，并提供工作量证明（proof-of-work）。让我们在本章中讨论这一点。\n\
    \n## 消息摘要函数\n\n我们将编写一个名为 `sha256` 的工具函数，用于为给定的消息创建摘要：\n\n```python\ndef sha256(message):\
    \ return hashlib.sha256(message.encode('ascii')).hexdigest()\n```\n\n`sha256`\
    \ 函数接收 `message` 作为参数，将其编码为 ASCII，生成十六进制摘要摘要并将该值返回给调用者。\n\n## 挖掘函数\n\n我们现在开发实现我们自己的挖掘策略的\
    \ `mine` 函数。在这种情况下，我们的策略是针对给定的消息生成一个哈希值，该哈希值要以指定数量的 1 开头。给定的 1 的数量作为 `mine` 函数的参数指定，定义为难度级别。\n\
    \n例如，如果你指定的难度级别为 2，则给定消息生成的哈希值应该以两个 1 开头——例如 `11xxxxxxxx`。如果难度级别为 3，生成的哈希应该以三个\
    \ 1 开头——例如 `111xxxxxxxx`。根据这些要求，我们现在按照下所示步骤开发挖掘函数。\n\n### 步骤 1\n挖掘函数接收两个参数——消息和难度级别。\n\
    ```python\ndef mine(message, difficulty=1):\n```\n\n### 步骤 2\n难度级别需要大于或等于 1，我们通过以下断言语句确保这一点：\n\
    ```python\nassert difficulty >= 1\n```\n\n### 步骤 3\n我们使用设置的难度级别创建一个 `prefix` 变量。\n\
    ```python\nprefix = '1' * difficulty\n```\n注意，如果难度级别为 2，前缀为“11”，如果难度级别为 3，前缀为“111”，依此类推。我们将检查此前缀是否存在于消息生成的摘要中。\n\
    \n为了对消息本身进行摘要，我们使用以下两行代码：\n```python\nfor i in range(1000):\n    digest = sha256(str(hash(message))\
    \ + str(i))\n```\n\n我们在每次迭代中不断向消息哈希添加一个新数字 `i`，并对组合后的消息生成新摘要。由于 `sha256` 函数的输入在每次迭代中发生变化，`digest`\
    \ 值也会发生变化。我们检查 `digest` 值是否具有上述设置的 `prefix`。\n```python\nif digest.startswith(prefix):\n\
    ```\n如果满足条件，我们将终止 `for` 循环并将 `digest` 值返回给调用者。\n\n整个 `mine` 代码所示：\n```python\n\
    def mine(message, difficulty=1):\n    assert difficulty >= 1\n    prefix = '1'\
    \ * difficulty\n    for i in range(1000):\n        digest = sha256(str(hash(message))\
    \ + str(i))\n        if digest.startswith(prefix):\n            print (\"after\
    \ \" + str(i) + \" iterations found nonce: \"+ digest)\n            return digest\n\
    ```\n为了方便理解，我们添加了 `print` 语句，在从函数返回之前打印摘要值以及满足条件所需的迭代次数。\n\n## 测试挖掘函数\n\n为了测试我们的挖掘函数，只需执行以下语句：\n\
    ```python\nmine (\"test message\", 2)\n```\n当你运行上述代码时，你将看到类似于下面的输出：\n```\nafter\
    \ 138 iterations found nonce: 11008a740eb2fa6bf8d55baecda42a41993ca65ce66b2d3889477e6bfad1484c\n\
    ```\n注意，生成的摘要以“11”开头。如果你将难度级别改为 3，生成的摘要将以“111”开头，这可能需要更多的迭代次数。如所见，具有更高处理能力的矿工能够更早地挖掘给定消息。这就是矿工之间竞争获取收入的方式。现在，我们准备好为我们的区块链添加更多区块了。让我们在下一章中学习。\n\
    \n"
- fmt: "\n# Adding Blocks\n\nEach miner will pick up the transactions from a previously\
    \ created transaction pool. To track the number of messages already mined, we\
    \ have to create a global variable `last_transaction_index = 0`. We will now have\
    \ our first miner adding a block to the blockchain.\n\n## Adding First Block\n\
    \nTo add a new block, we first create an instance of the `Block` class.\n\n```python\n\
    block = Block()\n```\n\nWe pick up the top 3 transactions from the queue:\n\n\
    ```python\nfor i in range(3):\n    temp_transaction = transactions[last_transaction_index]\n\
    ```\n\n### validate transaction\n\nBefore adding the transaction to the block,\
    \ the miner will verify the validity of the transaction. The transaction validity\
    \ is verified by testing for equality the hash provided by the sender against\
    \ the hash generated by the miner using sender’s public key. Also, the miner will\
    \ verify that the sender has sufficient balance to pay for the current transaction.\
    \ For brevity, we have not included this functionality in the tutorial.\n\nAfter\
    \ the transaction is validated, we add it to the `verified_transactions` list\
    \ in the `block` instance.\n\n```python\nblock.verified_transactions.append(temp_transaction)\n\
    ```\n\nWe increment the last transaction index so that the next miner will pick\
    \ up subsequent transactions in the queue.\n\n```python\nlast_transaction_index\
    \ += 1\n```\n\nWe add exactly three transactions to the block. Once this is done,\
    \ we will initialize the rest of the instance variables of the `Block` class.\
    \ We first add the hash of the last block.\n\n```python\nblock.previous_block_hash\
    \ = last_block_hash\n```\n\nNext, we mine the block with a difficulty level of\
    \ 2.\n\n```python\nblock.Nonce = mine(block, 2)\n```\n\nNote that the first parameter\
    \ to the `mine` function is a binary object. We now hash the entire block and\
    \ create a digest on it.\n\n```python\ndigest = hash(block)\n```\n\nFinally, we\
    \ add the created block to the blockchain and re-initialize the global variable\
    \ `last_block_hash` for the use in next block. The entire code for adding the\
    \ block is shown below:\n\n```python\nblock = Block()\nfor i in range(3):\n  \
    \  temp_transaction = transactions[last_transaction_index]\n    # validate transaction\n\
    \    # if valid:\n    block.verified_transactions.append(temp_transaction)\n \
    \   last_transaction_index += 1\nblock.previous_block_hash = last_block_hash\n\
    block.Nonce = mine(block, 2)\ndigest = hash(block)\nTPCoins.append(block)\nlast_block_hash\
    \ = digest\n```\n\n## Adding More Blocks\n\nWe will now add two more blocks to\
    \ our blockchain. The code for adding the next two blocks is given below:\n\n\
    ### Miner 2 adds a block\n\n```python\nblock = Block()\nfor i in range(3):\n \
    \   temp_transaction = transactions[last_transaction_index]\n    # validate transaction\n\
    \    # if valid:\n    block.verified_transactions.append(temp_transaction)\n \
    \   last_transaction_index += 1\nblock.previous_block_hash = last_block_hash\n\
    block.Nonce = mine(block, 2)\ndigest = hash(block)\nTPCoins.append(block)\nlast_block_hash\
    \ = digest\n```\n\n### Miner 3 adds a block\n\n```python\nblock = Block()\nfor\
    \ i in range(3):\n    temp_transaction = transactions[last_transaction_index]\n\
    \    display_transaction(temp_transaction)\n    # validate transaction\n    #\
    \ if valid:\n    block.verified_transactions.append(temp_transaction)\n    last_transaction_index\
    \ += 1\nblock.previous_block_hash = last_block_hash\nblock.Nonce = mine(block,\
    \ 2)\ndigest = hash(block)\nTPCoins.append(block)\nlast_block_hash = digest\n\
    ```\n\nWhen you add these two blocks, you will also see the number of iterations\
    \ it took to find the `Nonce`. At this point, our blockchain consists of totally\
    \ 4 blocks including the genesis block.\n\n## Dumping Entire Blockchain\n\nYou\
    \ can verify the contents of the entire blockchain using the following statement:\n\
    \n```python\ndump_blockchain(TPCoins)\n```\n\nYou would see the output similar\
    \ to the one shown below:\n\n```text\nNumber of blocks in the chain: 4\nblock\
    \ # 0\nsender: Genesis\n-----\nrecipient: \n\
    -----\nvalue: 500.0\n-----\ntime: 2019-01-14 16:18:02.042739\n-----\n--------------\n\
    =====================================\nblock # 1\nsender: \n\
    ... (truncated for brevity)\n```\n"
