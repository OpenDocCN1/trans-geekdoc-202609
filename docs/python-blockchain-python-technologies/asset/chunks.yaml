  trans: "\n\n# 创建多个交易\n各种客户端创建的交易在系统中排队；矿工从该队列中提取交易并将其添加到区块中。然后他们将对区块进行挖掘，获胜的矿工有权将区块添加到区块链，从而为自己赚取费用。我们将在讨论区块链创建时再描述这一挖矿过程。在编写多个交易的代码之前，让我们先添加一个小小的实用函数来打印给定交易的内容。\n\
    \n## 显示交易\n`display_transaction` 函数接受一个交易类型的单一参数。接收到的交易中的字典对象被复制到名为 `dict` 的临时变量中，并使用字典的键在控制台上打印各种值。\n\
    \n```python\ndef display_transaction(transaction):\n    #for transaction in transactions:\n\
    \        dict = transaction.to_dict()\n        print (\"sender: \" + dict['sender'])\n\
    \        print ('-----')\n        print (\"recipient: \" + dict['recipient'])\n\
    \        print ('-----')\n        print (\"value: \" + str(dict['value']))\n \
    \       print ('-----')\n        print (\"time: \" + str(dict['time']))\n    \
    \    print ('-----')\n```\n\n接下来，我们定义一个交易队列来存储我们的 `transaction` 对象。\n\n## 交易队列\n\
    为了创建一个队列，我们如下所示声明一个全局 `list` 变量 `transactions`：\n```python\ntransactions = []\n\
    ```\n我们将简单的将每个新创建的交易添加到此队列中。请注意，为了简单起见，我们在教程中不会实现队列管理逻辑。\n\n## 创建多个客户端\n现在，我们将开始创建交易。首先，创建四个客户端，他们将相互发送资金以从他人那里获得各种服务或商品。\n\
    \n```python\nDinesh = Client()\nRamesh = Client()\nSeema = Client()\nVijay = Client()\n\
    ```\n\n此时，我们有了四个名为 Dinesh、Ramesh、Seema 和 Vijay 的客户端。我们目前假设每个客户端钱包中都持有一些 TPCoins\
    \ 用于交易。每个客户端的身份将通过使用这些对象的 `identity` 属性指定。\n\n## 创建第一个交易\n现在，我们如下初始化第一个交易：\n```python\n\
    t1 = Transaction (Dinesh, Ramesh.identity, 15.0)\n```\n在这次交易中，Dinesh 向 Ramesh\
    \ 发送了 5 个 TPCoins。为了使交易成功，我们必须确保 Dinesh 的钱包中有足够的资金支付此款。请注意，我们需要一个创世交易来启动系统中的 TPCoin\
    \ 循环。在你阅读的过程中，很快就会编写该创世交易的代码。我们将使用 Dinesh 的私钥对该交易进行签名，并如下将其添加到交易队列中：\n\n```python\n\
    t1.sign_transaction()\ntransactions.append(t1)\n```\n在 Dinesh 完成第一个交易后，我们将在上面创建的不同客户端之间再创建几个交易。\n\
    \n## 添加更多交易\n我们现在将创建更多几个交易，每个交易都向另一方提供几个 TPCoins。当有人花钱时，他没有必要检查该钱包中是否有足够的余额。无论如何，矿工在发起交易时都会验证发送者在交易时的余额。如果余额不足，矿工将标记此交易为无效且不会将其添加到区块。以下代码创建并向我们的队列添加了九个交易。\n\
    \n```python\nt2 = Transaction (Dinesh, Seema.identity, 6.0)\nt2.sign_transaction()\n\
    transactions.append(t2)\nt3 = Transaction(Ramesh, Vijay.identity, 2.0)\nt3.sign_transaction()\n\
    transactions.append(t3)\nt4 = Transaction(Seema, Ramesh.identity, 4.0)\nt4.sign_transaction()\n\
    transactions.append(t4)\nt5 = Transaction(Vijay, Seema.identity, 7.0)\nt5.sign_transaction()\n\
    transactions.append(t5)\nt6 = Transaction(Ramesh, Seema.identity, 3.0)\nt6.sign_transaction()\n\
    transactions.append(t6)\nt7 = Transaction(Seema, Dinesh.identity, 8.0)\nt7.sign_transaction()\n\
    transactions.append(t7)\nt8 = Transaction(Seema, Ramesh.identity, 5.0)\nt8.sign_transaction()\n\
    transactions.append(t8)\nt9 = Transaction(Vijay, Dinesh.identity, 5.0)\nt9.sign_transaction()\n\
    transactions.append(t9)\nt10 = Transaction(Vijay, Ramesh.identity, 3.0)\nt10.sign_transaction()\n\
    transactions.append(t10)\n```\n当你运行上述代码时，队列中将有十个交易供矿工创建区块。\n\n## 导出交易\n作为区块链管理器，你可能想定期查看队列的内容。出于此目的，你可以使用之前开发的\
    \ `display_transaction` 函数来导出所有的 `transactions` 列表：\n\n```python\nfor transaction\
    \ in transactions:\n    display_transaction(transaction)\n```\n交易之间用虚线分隔。如果你运行上述代码，你将看到下面的交易列表：\n\
    \n```text\nsender: 30819f300d06092a864886f70d010101050003818d003081890281810bb064c99c492144a9f463480273394111111111111000000000000003033f499fd8e54d244da086632e8674905842222222222222222\
    \ (此处省略重复哈希，实际保持格式)\n```\n*(注：由于原文示例在导出部分包含大量长哈希值，译文此处保持了逻辑结构。)*\n\n"
- fmt: "\n# Block Class\n\n`Block` class consists of a varying number of transactions.\
    \ For simplicity, in our case we will assume that the block consists of a fixed\
    \ number of transactions, which is three in this case. As the block needs to store\
    \ the list of these three transactions, we will declare an instance variable called\
    \ `verified_transactions` as follows — `self.verified_transactions = []` We have\
    \ named this variable as `verified_transactions` to indicate that only the verified\
    \ valid transactions will be added to the block. Each block also holds the hash\
    \ value of the previous block, so that the chain of blocks becomes immutable.\
    \ To store the previous hash, we declare an instance variable as follows — `self.previous_block_hash\
    \ = \"\"` Finally, we declare one more variable called `Nonce` for storing the\
    \ nonce created by the miner during the mining process. `self.Nonce = \"\"`\n\n\
    The full definition of the `Block` class is given below:\n\n```python\nclass Block:\n\
    \    def __init__(self):\n        self.verified_transactions = []\n        self.previous_block_hash\
    \ = \"\"\n        self.Nonce = \"\"\n```\n\nAs each block needs the value of the\
    \ previous block’s hash we declare a global variable called `last_block_hash`\
    \ as follows — `last_block_hash = \"\"` Now let us create our first block in the\
    \ blockchain.\n\n## Creating Genesis Block\n\nWe assume that the originator of\
    \ TPCoins initially gives out 500 TPCoins to a known client `Dinesh`. For this,\
    \ he first creates a `Dinesh` instance — `Dinesh = Client()` We then create a\
    \ genesis transaction and send 500 TPCoins to Dinesh’s public address. `t0 = Transaction(\"\
    Genesis\", Dinesh.identity, 500.0)`\n\nNow, we create an instance of `Block` class\
    \ and call it `block0`. `block0 = Block()` We initialize the `previous_block_hash`\
    \ and `Nonce` instance variables to `None`, as this is the very first transaction\
    \ to be stored in our blockchain. `block0.previous_block_hash = None`, `Nonce\
    \ = None`\n\nNext, we will add the above `t0` transaction to the `verified_transactions`\
    \ list maintained within the block — `block0.verified_transactions.append(t0)`\
    \ At this point, the block is completely initialized and is ready to be added\
    \ to our blockchain. We will be creating the blockchain for this purpose. Before\
    \ we add the block to the blockchain, we will hash the block and store its value\
    \ in the global variable called `last_block_hash` that we declared previously.\
    \ This value will be used by the next miner in his block. We use the following\
    \ two lines of coding for hashing the block and storing the digest value:\n\n\
    ```python\ndigest = hash(block0)\nlast_block_hash = digest\n```\n\nFinally, we\
    \ create a blockchain as we see in the next chapter.\n\n## Python Creating Blockchain\n\
    \nA blockchain contains a list of blocks chained to each other. To store the entire\
    \ list, we will create a list variable called `TPCoins` — `TPCoins = []` We will\
    \ also write a utility method called `dump_blockchain` for dumping the contents\
    \ of the entire blockchain. We first print the length of the blockchain so that\
    \ we know how many blocks are currently present in the blockchain.\n\n```python\n\
    def dump_blockchain(self):\n    print(\"Number of blocks in the chain: \" + str(len(self)))\n\
    ```\n\nNote that as the time passes, the number of blocks in the blockchain would\
    \ be extraordinarily high for printing. Thus, when you print the contents of the\
    \ blockchain you may have to decide on the range that you would like to examine.\
    \ In the code below, we have printed the entire blockchain as we would not be\
    \ adding too many blocks in the current demo. To iterate through the chain, we\
    \ set up a `for` loop as follows —\n\n```python\nfor x in range(len(TPCoins)):\n\
    \    block_temp = TPCoins[x]\n```\n\nEach referenced block is copied to a temporary\
    \ variable called `block_temp`. We print the block number as a heading for each\
    \ block. Note that the numbers would start with zero, the first block is a genesis\
    \ block that is numbered zero. `print(\"block # \" + str(x))`\n\nWithin each block,\
    \ we have stored a list of three transactions (except for the genesis block) in\
    \ a variable called `verified_transactions`. We iterate this list in a `for` loop\
    \ and for each retrieved item, we call `display_transaction` function to display\
    \ the transaction details.\n\n```python\nfor transaction in block_temp.verified_transactions:\n\
    \    display_transaction(transaction)\n```\n\nThe entire function definition is\
    \ shown below:\n\n```python\ndef dump_blockchain(self):\n    print(\"Number of\
    \ blocks in the chain: \" + str(len(self)))\n    for x in range(len(TPCoins)):\n\
    \        block_temp = TPCoins[x]\n        print(\"block # \" + str(x))\n     \
    \   for transaction in block_temp.verified_transactions:\n            display_transaction(transaction)\n\
    \    print('--------------')\n    print('=====================================')\n\
    ```\n\nNote that here we have inserted the separators at appropriate points in\
    \ the code to demarcate the blocks and transactions within it. As we have now\
    \ created a blockchain for storing blocks, our next task is to create blocks and\
    \ start adding it to the blockchain. For this purpose, we will add a genesis block\
    \ that you have already created in the earlier step.\n\n## Adding Genesis Block\n\
    \nAdding a block to the blockchain involves appending the created block to our\
    \ `TPCoins` list. `TPCoins.append(block0)` Note that unlike the rest of the blocks\
    \ in the system, the genesis block contains only one transaction which is initiated\
    \ by the originator of the TPCoins system. Now, you will dump the contents of\
    \ the blockchain by calling our global function `dump_blockchain` — `dump_blockchain(TPCoins)`\n\
    \nWhen you execute this function, you will see the following output:\n\n```\n\
    Number of blocks in the chain: 1\nblock # 0\nsender: Genesis\n-----\nrecipient:\
    \ \n\
    -----\nvalue: 500.0\n-----\ntime: 2019-01-14 16:18:02.042739\n-----\n--------------\n\
    =====================================\n```\n\nAt this point the blockchain system\
    \ is ready to use. We will now enable the interested clients to become miners\
    \ by providing them a mining functionality.\n"
