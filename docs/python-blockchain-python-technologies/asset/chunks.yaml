  trans: "\n# Transaction 类\n\n在本章中，让我们创建一个 `Transaction` 类，以便客户端能够向他人发送资金。注意，客户端可以是发送者也可以是接收者。当想要接收资金时，发送者将创建交易并指定地址。\n\
    \n我们定义交易的初始化如下：\n\n```python\ndef __init__(self, sender, recipient, value):\n\
    \    self.sender = sender\n    self.recipient = recipient\n    self.value = value\n\
    \    self.time = datetime.now()\n```\n\n`__init__` 方法接收三个参数：发送者的密钥、接收密钥以及要发送的金额。这些被存储在实例变量中以供其他方法使用。此外，我们创建一个变量来存储交易的时间。\n\
    \n接下来，我们编写一个名为 `to_dict` 的工具方法，将上述四个实例变量合并到一个字典中。通过该方法可以访问整个交易信息。从之前的教程可知，区块链的第一个块是\
    \ `Genesis` 块。`Genesis` 块包含了由创建者发起的第一个交易。当这笔交易被创建时，创建者的身份可能是 `Genesis`。因此，在创建字典时，我们检查发送者是否为\
    \ `Genesis`，如果是，则简单地将值赋值给 `identity` 变量。\n\n```python\nif self.sender == \"Genesis\"\
    :\n    identity = \"Genesis\"\nelse:\n    identity = self.sender\n```\n\n使用以下代码构造字典：\n\
    \n```python\nreturn collections.OrderedDict({'sender': identity, 'recipient':\
    \ self.recipient, 'value': self.value, 'time': self.time })\n```\n\n`to_dict`\
    \ 方法的完整代码所示：\n\n```python\ndef to_dict(self):\n    if self.sender == \"Genesis\"\
    :\n        identity = \"Genesis\"\n    else:\n        identity = self.sender\n\
    \    return collections.OrderedDict({'sender': identity, 'recipient': self.recipient,\
    \ 'value': self.value, 'time': self.time })\n```\n\n最后，我们将使用发送者的私钥对该字典进行签名。之前使用内置的\
    \ SHA 算法。生成的签名被转换为 ASCII 表示并存储在我们的区块链中。`sign_transaction` 方法所示：\n\n```python\n\
    def sign_transaction(self):\n    private_key = self.sender._private_key\n    signer\
    \ = PKCS1_v1_5.new(private_key)\n    h = SHA.new(str(self.to_dict()).encode('utf8'))\n\
    \    return binascii.hexlify(signer.sign(h)).decode('ascii')\n```\n\n# 测试 Transaction\
    \ 类\n\n为了这个目的，我们将创建两个名为 `Dinesh` 和 `Ramesh` 的用户。Dinesh 将向 Ramesh 发送 5 Coins。首先我们创建名为\
    \ `Dinesh` 和 `Ramesh` 的客户端。\n\n```python\nDinesh = Client()\nRamesh = Client()\n\
    ```\n\n记住，当实例化 `Client` 类时，会创建该客户端唯一的公私钥。当 Dinesh 向 Ramesh 发送付款时，他需要 Ramesh 的公钥，这可以通过客户端的\
    \ `identity` 属性获取。因此，我们将使用以下代码创建交易实例：\n\n```python\nt = Transaction( Dinesh, Ramesh.identity,\
    \ 5. )\n```\n\n注意第一个参数是发送者，第二个参数是接收者的公钥，第三个参数是要传输的金额。`sign_transaction` 方法从第一个参数检索发送者的私钥以对交易进行签名。交易对象创建后，你通过调用其\
    \ `sign_transaction` 方法对其进行签名。该方法返回可打印格式生成的签名。\n\n使用以下两行代码生成并打印签名：\n\n```python\n\
    signature = t.sign_transaction()\nprint (signature)\n```\n\n当你运行上述代码时，你将看到类似的输出：\n\
    \n`7c7e3c97629b218e9ec6e86b01f9abd8e361fd69e7d373c38420790b655b9abe3b575e343c713703ca1aee781acd7157a0624db3d57d7c2f1172730ee3f45af943338157f899965856f6b00e34db240b62673ad5a08c8e490f880b568efbc36035cae2e748f1d802d5e8e66298be826f5c6363dc511222fb2416036ac04eb972`\n"
- fmt: "\n# Creating Multiple Transactions\nThe transactions made by various clients\
    \ are queued in the system; the miners pick up the transactions from this queue\
    \ and add it to the block. They will then mine the block and the winning miner\
    \ would have the privilege of adding the block to the blockchain and thereby earn\
    \ some money for himself. We will describe this mining process later when we discuss\
    \ the creation of the blockchain. Before we write the code for multiple transactions,\
    \ let us add a small utility function to print the contents of a given transaction.\n\
    \n## Displaying Transaction\nThe `display_transaction` function accepts a single\
    \ parameter of transaction type. The dictionary object within the received transaction\
    \ is copied to a temporary variable called `dict` and using the dictionary keys,\
    \ the various values are printed on the console.\n\n```python\ndef display_transaction(transaction):\n\
    \    #for transaction in transactions:\n        dict = transaction.to_dict()\n\
    \        print (\"sender: \" + dict['sender'])\n        print ('-----')\n    \
    \    print (\"recipient: \" + dict['recipient'])\n        print ('-----')\n  \
    \      print (\"value: \" + str(dict['value']))\n        print ('-----')\n   \
    \     print (\"time: \" + str(dict['time']))\n        print ('-----')\n```\n\n\
    Next, we define a transaction queue for storing our `transaction` objects.\n\n\
    ## Transaction Queue\nTo create a queue, we declare a global `list` variable called\
    \ `transactions` as follows:\n```python\ntransactions = []\n```\nWe will simply\
    \ append each newly created transaction to this queue. Please note that for brevity,\
    \ we will not implement the queue management logic in this tutorial.\n\n## Creating\
    \ Multiple Clients\nNow, we will start creating transactions. First, we will create\
    \ four clients who will send money to each other for obtaining various services\
    \ or goods from others.\n\n```python\nDinesh = Client()\nRamesh = Client()\nSeema\
    \ = Client()\nVijay = Client()\n```\n\nAt this point, we have four clients called\
    \ Dinesh, Ramesh, Seema, and Vijay. We currently assume that each of these clients\
    \ hold some TPCoins in their wallets for transacting. The identity of each of\
    \ these clients would be specified by using the `identity` property of these objects.\n\
    \n## Creating First Transaction\nNow, we initiate our first transaction as follows:\n\
    ```python\nt1 = Transaction (Dinesh, Ramesh.identity, 15.0)\n```\nIn this transaction\
    \ Dinesh sends 5 TPCoins to Ramesh. For transaction to be successful, we will\
    \ have to ensure that Dinesh has sufficient money in his wallet for this payment.\
    \ Note that, we will need a genesis transaction to start TPCoin circulation in\
    \ the system. You will write the transaction code for this genesis transaction\
    \ very shortly as you read along. We will sign this transaction using Dinesh’s\
    \ private key and add it to the transaction queue as follows:\n\n```python\nt1.sign_transaction()\n\
    transactions.append(t1)\n```\nAfter the first transaction made by Dinesh, we will\
    \ create several more transactions between different clients that we created above.\n\
    \n## Adding More Transactions\nWe will now create several more transactions, each\
    \ transaction given out a few TPCoins to another party. When somebody spends money,\
    \ it is not necessary that he has to check for sufficient balances in this wallet.\
    \ The miner anyway would be validating each transaction for the balance that the\
    \ sender has while initiating the transaction. In case of insufficient balance,\
    \ the miner will mark this transaction as invalid and would not add it to this\
    \ block. The following code creates and adds nine more transactions to our queue.\n\
    \n```python\nt2 = Transaction (Dinesh, Seema.identity, 6.0)\nt2.sign_transaction()\n\
    transactions.append(t2)\nt3 = Transaction(Ramesh, Vijay.identity, 2.0)\nt3.sign_transaction()\n\
    transactions.append(t3)\nt4 = Transaction(Seema, Ramesh.identity, 4.0)\nt4.sign_transaction()\n\
    transactions.append(t4)\nt5 = Transaction(Vijay, Seema.identity, 7.0)\nt5.sign_transaction()\n\
    transactions.append(t5)\nt6 = Transaction(Ramesh, Seema.identity, 3.0)\nt6.sign_transaction()\n\
    transactions.append(t6)\nt7 = Transaction(Seema, Dinesh.identity, 8.0)\nt7.sign_transaction()\n\
    transactions.append(t7)\nt8 = Transaction(Seema, Ramesh.identity, 5.0)\nt8.sign_transaction()\n\
    transactions.append(t8)\nt9 = Transaction(Vijay, Dinesh.identity, 5.0)\nt9.sign_transaction()\n\
    transactions.append(t9)\nt10 = Transaction(Vijay, Ramesh.identity, 3.0)\nt10.sign_transaction()\n\
    transactions.append(t10)\n```\nWhen you run the above code, you will have ten\
    \ transactions in the queue for miners to create blocks.\n\n## Dumping Transactions\n\
    As a blockchain manager, you may periodically like to review the contents of queue.\
    \ For this purpose you can use the `display_transaction` function developed earlier\
    \ to dump all the `transactions` list:\n\n```python\nfor transaction in transactions:\n\
    \    display_transaction(transaction)\n```\nThe transactions are separated by\
    \ a dashed line. If you run the above code, you would see the transaction list\
    \ below:\n\n```text\nsender: \n\
    -----\nrecipient: \n\
    -----\nvalue: 15.0\n-----\ntime: 2019-01-14 16:18:01.859915\n-----\n--------------\n\
    sender: \n\
    -----\nrecipient: \n\
    -----\nvalue: 2.0\n-----\ntime: 2019-01-14 16:18:01.861958\n-----\n--------------\n\
    ```\n"
