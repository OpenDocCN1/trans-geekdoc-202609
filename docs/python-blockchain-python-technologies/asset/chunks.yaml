  trans: "\n\n# 添加区块\n\n每个矿工都将从之前创建的交易池中提取交易。为了跟踪已经挖掘的消息数量，我们需要创建一个全局变量 `last_transaction_index\
    \ = 0`。现在，我们将让第一个矿工向区块链添加一个区块。\n\n## 添加第一个区块\n\n要添加一个新区块，我们首先创建一个 `Block` 类的实例。\n\
    \n```python\nblock = Block()\n```\n\n我们从队列中提取前 3 笔交易：\n\n```python\nfor i in range(3):\n\
    \    temp_transaction = transactions[last_transaction_index]\n```\n\n### 验证交易\n\
    \n在将交易添加到区块之前，矿工将验证交易的有效性。交易的有效性通过将发送者提供的哈希与矿工使用发送者公钥生成的哈希进行相等性测试来验证。此外，矿工还将验证发送者是否有足够的余额支付当前交易。为了简单起见，我们没有在教程中包含此功能。\n\
    \n交易通过验证后，我们将其添加到 `block` 实例的 `verified_transactions` 列表中。\n\n```python\nblock.verified_transactions.append(temp_transaction)\n\
    ```\n\n我们增加最后一次交易的索引，以便下一个矿工能够获取队列中的后续交易。\n\n```python\nlast_transaction_index\
    \ += 1\n```\n\n我们向区块恰好添加了三笔交易。一旦完成，我们将初始化 `Block` 类的其余实例变量。我们首先添加上一个区块的哈希。\n\n\
    ```python\nblock.previous_block_hash = last_block_hash\n```\n\n接下来，我们以难度为 2 的级别挖掘该区块。\n\
    \n```python\nblock.Nonce = mine(block, 2)\n```\n\n注意，`mine` 函数的第一个参数是一个二进制对象。现在我们对整个区块进行哈希处理并创建其创建一个摘要。\n\
    \n```python\ndigest = hash(block)\n```\n\n最后，我们将创建的区块添加到区块链中，并重新初始化全局变量 `last_block_hash`\
    \ 以供下一个区块使用。添加区块的完整代码所示：\n\n```python\nblock = Block()\nfor i in range(3):\n \
    \   temp_transaction = transactions[last_transaction_index]\n    # validate transaction\n\
    \    # if valid:\n    block.verified_transactions.append(temp_transaction)\n \
    \   last_transaction_index += 1\nblock.previous_block_hash = last_block_hash\n\
    block.Nonce = mine(block, 2)\ndigest = hash(block)\nTPCoins.append(block)\nlast_block_hash\
    \ = digest\n```\n\n## 添加更多区块\n\n现在我们将为我们的区块链再添加两个区块。添加接下来两个区块的代码所示：\n\n### 矿工\
    \ 2 添加一个区块\n\n```python\nblock = Block()\nfor i in range(3):\n    temp_transaction\
    \ = transactions[last_transaction_index]\n    # validate transaction\n    # if\
    \ valid:\n    block.verified_transactions.append(temp_transaction)\n    last_transaction_index\
    \ += 1\nblock.previous_block_hash = last_block_hash\nblock.Nonce = mine(block,\
    \ 2)\ndigest = hash(block)\nTPCoins.append(block)\nlast_block_hash = digest\n\
    ```\n\n### 矿工 3 添加一个区块\n\n```python\nblock = Block()\nfor i in range(3):\n   \
    \ temp_transaction = transactions[last_transaction_index]\n    display_transaction(temp_transaction)\n\
    \    # validate transaction\n    # if valid:\n    block.verified_transactions.append(temp_transaction)\n\
    \    last_transaction_index += 1\nblock.previous_block_hash = last_block_hash\n\
    block.Nonce = mine(block, 2)\ndigest = hash(block)\nTPCoins.append(block)\nlast_block_hash\
    \ = digest\n```\n\n当你添加这两个区块时，你还会看到找到 `Nonce` 所需的迭代次数。此时，我们的区块链总共包含 4 个区块（包括创世区块）。\n\
    \n## 导出整个区块链\n\n你可以使用以下语句验证整个区块链的内容：\n\n```python\ndump_blockchain(TPCoins)\n\
    ```\n\n你将看到类似于所示的输出：\n\n```text\nNumber of blocks in the chain: 4\nblock # 0\n\
    sender: Genesis\n-----\nrecipient: \n\
    -----\nvalue: 500.0\n-----\ntime: 2019-01-14 16:18:02.042739\n-----\n--------------\n\
    =====================================\nblock # 1\nsender: \n\
    ... (省略)\n```\n"
