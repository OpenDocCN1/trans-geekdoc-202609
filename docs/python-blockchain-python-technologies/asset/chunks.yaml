    ) Note that the first parameter is the sender, the second parameter is the public
    key of the recipient and the third parameter is the amount to be transferred.
    The sign\_transaction  method retrieves the sender’s private key from the first
    parameter for singing the transaction. After the transaction object is created,
    you will sign it by calling its sign\_transaction  method. This method returns
    the generated signature in the printable format. We generate and print the signature
    using following two lines of code − signature = t.sign\_transaction() print (signature)
