  raw: 'Transaction Class In this chapter, let us create a Transaction  class so that
    a client will be able to send money to somebody. Note that a client can be both
    a sender or a recipient of the money. When you want to receive money, some other
    sender will create a transaction and specify your public  address in it. We define
    the initialization of a transaction class as follows − def \_\_init\_\_( self
    , sender, recipient, value ): self . sender \= sender self . recipient \= recipient
    self . value \= value self . time \= datetime . datetime . now () The init  method
    takes three parameters − the sender’s public  key, the recipient’s public  key,
    and the amount to be sent. These are stored in the instance variables for use
    by other methods. Additionally, we create one more variable for storing the time
    of transaction. Next, we write a utility method called to\_dict  that combines
    all the four above-mentioned instance variables in a dictionary object. This is
    just to put the entire transaction information accessible through a single variable.
    As you know from the earlier tutorial that the first block in the blockchain is
    a Genesis  block. The Genesis block contains the first transaction initiated by
    the creator of the blockchain. The identity of this person may be kept a secret
    like in the case of Bitcoins. So when this first transaction is created, the creator
    may just send his identity as Genesis  . Thus, while creating the dictionary,
    we check if the sender is Genesis  and if so we simply assign some string value
    to the identity variable; else, we assign the sender’s identity to the identity
     variable. if self . sender \== "Genesis" : identity \= "Genesis" else : identity
    \= self . sender . identity We construct the dictionary using following line of
    code return collections. OrderedDict ({ ''sender'' : identity , ''recipient''
    : self . recipient , ''value'' : self . value , ''time'' : self . time }) The
    entire code for the to\_dict  method is shown below − def to\_dict( self ): if
    self . sender \== "Genesis" : identity \=  "Genesis" else : identity \= self .
    sender . identity return collections . OrderedDict ({ ''sender'' : identity ,
    ''recipient'' : self . recipient , ''value'' : self . value , ''time'' : self
    . time }) Finally, we will sign this dictionary object using the private key of
    the sender. As before, we use the built-in PKI with SHA algorithm. The generated
    signature is decoded to get the ASCII representation for printing and storing
    it in our blockchain. The sign\_transaction  method code is shown here − def sign\_transaction(self):
    private\_key = self.sender.\_private\_key signer = PKCS1\_v1\_5.new(private\_key)
    h = SHA.new(str(self.to\_dict()).encode(''utf8'')) return binascii.hexlify(signer.sign(h)).decode(''ascii'')
    We will now test this Transaction  class. Testing Transaction Class For this purpose,
    we will create two users, called Dinesh  and Ramesh . Dinesh will send 5 TPCoins
    to Ramesh. For this first we create the clients called Dinesh and Ramesh. Dinesh
