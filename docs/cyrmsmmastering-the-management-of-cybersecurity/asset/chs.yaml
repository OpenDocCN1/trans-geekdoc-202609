  \n## 董事如何应对其监督网络安全的义务？\n一份针对 Equifax、Uber 等时代董事会的实用指南\n作者：Roel Campos 和 David X\
  \ Martin\n\n许多董事都意识到，他们有责任监督公司网络安全的事务。但更让他们困惑的是，他们现在应该做什么来为董事会的工作做出贡献？他们应该提出的正确问题是什么？下面我们对您应该关注的网络安全合规的几个主要领域进行了简短讨论。我们邀请您将本文存档，作为您董事身份和职责的参考，并在董事会上讨论网络安全时使用本文末尾的大纲。\n\
  \n## 引言\n2017 年 9 月 7 日，美国最大的信贷监控机构之一——`Equifax Inc.` 宣布，超过 1.43 亿客户的账户已遭到入侵，这可能是迄今为止对美国消费者影响最严重的网络攻击。\n\
  \n在 Equifax 丑闻期间，美国证券交易委员会（`SEC`）也发布了一些令人震惊的自身披露。新上任的 `SEC` 主席 `Jay Clayton` 于 2017\
  \ 年 9 月 20 日宣布，`SEC` 自身的 `EDGAR` 系统数月前已被网络黑客入侵，这引发了人们对此类系统安全性以及拥有此类敏感非公开公司信息的个人进行内幕交易风险的担忧。\n\
  \n近期其他高知名的网络攻击也层出不穷。令热门剧集《游戏之王》粉丝非常遗憾的是，`HBO` 电视网络在 2017 年 7 月遭到入侵，黑客窃取了超过 1.5 TB\
  \ 的信息，包括剧本和几部热门剧集的完整剧。\n\n在更具趣闻的故事之一中，`Uber Technologies, Inc.` 的近期披露详细了 2016 年该网约车公司系统遭入侵的情况，期间黑客盗取了数百万\
  \ Uber 客户和司机的姓名、电子邮件地址、电话号码和驾照号码。`Uber` 不仅在一年多时间内未披露此次入侵，据称还向黑客支付了笔“赎金”，以换取黑客承诺删除被盗数据并对此次网络事件保持保密。\n\
  \n\n\n\n第一条教训是公司必须关注常规警报，以警告公司系统及所用软件中的网络安全漏洞。在 Equifax 的案例中，黑客显然利用了 `Apache Struts`\
  \ 网络应用程序软件中的一个已知网络漏洞，Equifax 正使用该软件来构建其网络应用程序。美国国土安全部美国计算机应急响应小组（`US-CERT`）曾于 2017\
  \ 年 3 月 8 日通知 Equifax 及许多其他机构此漏洞，并要求对软件进行补丁修复。尽管公司通过电子邮件在内部传发了 `US-CERT` 的通知，并要求相关人员安装补丁，但该补丁显然没有安装，或安装不正确，一周后对系统进行的后续扫描未能发现该错误。\n\
  \n第二条教训是公司必须确保拥有适当的系统来升级潜在网络安全事件的信息，并确保例如由总律师在关键窗口期内禁止对重大违规行为有内部情情的个人交易公司证券。在 Equifax\
  \ 的案例中，据披露，几位高管在泄露事件于内部报告之后、公众获知之前交易了公司股票。这引发了对可能存在内部交易的质疑，以及在 Equifax 已经因泄露本身面临严厉公众审查时，内部控制缺失的问题。（此后，Equifax\
  \ 一个负责分析泄露的特别委员会已证明这些高管无违规行为。）⁹\n\n第三条教训是，如果在其范围内发生了灾难性的网络攻击，董事会必须有一套公共响应计划。Equifax\
  \ 对事件的公开处理受到了几乎所有角度的广泛批评。例如，许多人抱怨公司在 2017 年 7 月底获知泄露后，花费了整整一个月才公开披露该事件。还有人嘲笑 Equifax\
  \ 在泄露发生后立即将消费者引导至一个不安全的“伪造”网站，该网站模仿了 Equifax 为与焦虑于个人信息是否受损的客户交流而建立的网站。更有人遗憾的是，公司在泄露后似乎处于“公关模式”，并犯了错误，例如向受影响的个人提供付费的信用监控服务，而非免费提供。（公司随后改为向受害者提供免费的信用监控服务，但迫使这些客户同意冗长的仲裁条款，这将限制客户就相关服务问题起诉\
  \ Equifax 的能力。在公众抗议后，Equifax 随后放弃了仲裁条款。）¹⁰\n\n第四条教训是公司应该仔细考虑何时以及如何披露泄露事件。Equifax\
  \ 和 Uber 最近披露的网络安全事件为董事会的此方面提供了宝贵的指导。公司在评估何时披露什么内容时，不仅必须考虑其法律披露义务，还必须考虑公众舆论。类似地，一些人指出，`SEC`\
  \ 对涉及其 `EDGAR` 数据库的网络安全事件的公开披露，是在该事件的内部报告提出几个月后才进行的，这说明了对于任何行为者——包括那些被负责监督基于披露的行为的人员来说——要平衡快速公开披露与彻底内部审查之间的竞争性需求是多么困难。`SEC`\
  \ 自身对网络漏洞的不理想响应（以及随之导致的网络披露延迟）引发了人们对该机构未来如何追究公司网络相关披露责任，以及如何在一方面及时披露和另一方面严谨内部审查之间平衡竞争性需求的疑问。\n\
  \n最后一个教训是，公司应该意识到当第三方处理公司敏感数据时所带来的风险。德勤的事件提供了另一个数据点，并强化了这样一种观点：当这些实体处理公司敏感数据时，公司不仅必须关注自己的网络安全系统，还要关注第三方供应商和顾问（甚至可能是政府）的系统。\n\
  \n鉴于近期这些高关注事件，我们将在下讨论了一系列实务考虑和原则，董事成员可以使用这些原则来帮助其公司建立一个有效且动态的网络安全计划。这些考虑也将帮助董事测试当前网络安全计划的现状和有效性。\n\
  \n## 董事的实务考虑\n\n作为首要原则，董事应当理解他们在网络安全方面的信托责任，以及指导其所属公司的总体法律格局。除了业务和声誉风险外，网络安全的疏忽可能会给公司、管理层，在某些情况下给其董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管了特定行业或类型的敏感信息。\n\
  \n公司还必须意识到，联邦和州监管机构（如 `SEC`、`DOJ` 和 `FTC`）在执行非网络法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须关注股东和消费者诉讼的风险，这些诉讼通常在披露网络安全事件后引发。如下文所述，公司的总律师和内部网络人员应为董事会安排定期简报，以评估这些进展。\n\
  \n### 1. 评估现有网络安全风险并确定优先级\n\n网络安全是许多行业中的“首要级”风险。如果董事会尚未这样做，应当投资进行正式简报，讨论其公司面临的一系列现有网络安全风险，并权衡各种可能保护公司最有价值资产的机制的优缺点。董事会首先识别公司最有价值的资产，并评估这些资产可能如何受到网络事件的影响。对于某些公司而言，其最有价值的资产是客户的私人财务信息、个人身份信息或可能的健康记录。对于其他公司，可能是知识产权，或者可能是专利数据库，甚至是一组敏感邮件。任何网络安全计划都必须旨在保护这些最重要的公司资产。\n\
  \n董事应对对公司系统中可能发生的各种类型网络泄露有基本的了解，并熟悉行业内常用的技术术语。公司常见的网络安全事件从恶意软件到钓鱼攻击不等，从未打补丁的软件漏洞到高级持续性威胁（`APT`）。此外，公司物理安全中的漏洞可能允许攻击者渗透公司的网络防御。\n\
  \n虽然董事会不一定有义务研究网络攻击的技术机制或其应对措施，但董事会应对对这些概念有足够的熟悉，以便与管理层进行建设性讨论，并对公司的网络安全计划进行有效监督。\n\
  \n\n\n\n\n在评估现有网络安全风险时，董事会应密切关注其所在行业的趋势和近期事件，以及规模相似公司的影响。某些类型的网络攻击在某些行业中发生频率较高，而在另一些行业则较少。例如，如果你是一家小型零售商，你最紧迫的网络安全关注可能是销售点入侵，攻击者利用远程访问应用程序（通常由第三方供应商提供）的漏洞来窃取你客户的信用卡支付信息。\n\
  \n董事还应该广泛地了解谁或哪些群体最可能针对他们的公司，以及目的是什么。作为一个起点，威信公司发布的`2017 年数据泄露调查报告`（`2017 Verizon\
  \ Report`）显示，大多数网络泄露是由外部威胁者实施的（75%），而比例较小的一部分则是由内部人员（如员工或前员工）实施的（25%）。\n\n一旦董事会会对公司现有的网络威胁状况有了良好掌握，就应该优先考虑缓解实际网络泄露风险的策略。一名有效的董事成员会帮助公司确定哪些资产最有价值，并评估保护这些资产的关键控制措施。\n\
  \n他或她还将为突发情况制定计划，并确保有适当的响应框架来处理潜在的网络安全事件。这一过程的一部分不可避免将涉及审查公司与网络安全相关的预算，以根据现有威胁和公司现有系统的稳健性确定预算是否合理。（请记住，预防问题比修复问题要便宜得多。）\n\
  \n一个关键结论是，网络安全中没有进攻性策略——只有防御策略。此外，你无法保护一切。即使是网络领域技术最先进的组织——国家安全局（`NSA`）也无法保护其最深层的秘密。\n\
  \n## 2. 评估企业文化并树立正确榜样\n\n真正“理解”网络安全的公司具有适应性文化。然而，大多数企业文化并不会快速变化——它们是以缓慢的速度演化的。因此，许多组织的安全文化未能跟上其所处威胁格局的发展。\n\
  \n安全需要被框架化为关键的推动因素，帮助公司履行对客户的承诺。它还需要被公司所有层级的员工视为一项基于`团队协作，而非监控`的共同努力。\n\n还要考虑贵公司的“高层基调”以及发送给员工的有关网络安全实践的信息。鼓励高层营造一种每个人都对网络安全承担共同责任的环境。理想情况下，员工应该能够与公司首席信息安全官（`CISO`）部门的成员直接联系，并理解他们可以向该人员寻求判断和无忧的指导。\n\
  \n公司管理层投资与网络安全相关的高质量员工培训也至关重要。现在，接受通用的安全意识培训被认为是一种最佳实践，这种培训可能在很大程度上或完全专注于网络安全。\n\
  \n此外，培训不应是“一次性”的活动。`CISO` 部门或总法官（`GC`）应定期通过电子邮件向员工提供网络安全领域的最新进展以及他们应该注意的问题。这种持续的强化能够培养出真正的网络“健康”文化。\n\
  \n评估公司网络安全文化的良好起点是审查公司关于使用和保护公司系统的书面及正式指导意见。例如，公司是否有一份关于员工使用个人邮箱处理公司业务的成面政策？该政策是如何实施和遵守的？董事会是否遵守同样的标准，还是存在例外情况？理想情况下，董事成员将能够以身作则。要明白，作为董事，你可能是网络泄露的极具吸引力的目标，因为众，董事经常使用个人设备下载董事会书籍并就敏感的非公开公司信息进行交流。\n\
  \n总之，网络安全健康文化需要成为嵌入公司日常运营和核心价值观的战略重点。新的范式应该是网络安全是一项持续的风险，需要组织中的每个人来管理。当员工（贵公司或其他公司的员工）在这一方面出现失误时，要把这些经历作为不应重复的错误的教科书级案例——在公司的任何地方都是如此。因为泄露往往会导致法律诉讼，董事会应该在讨论中加入律师，并确保他们改变企业文化的努力兼了法律视角。在确保高层基调是诚信和有效合规后，董事会应转向战略考量。\n\
  \n## 3. 聘关键网络安全人员\n\n董事会应参与关键人员的选拔，例如`CISO`。他们还应该确保建立适当的系统来监控这些人员的表现。在过去，公司经常将网络安全的责任委托给公司的首席运营官或首席技术官。考虑目前负责贵公司网络安全主要职责的官员。那个人是\
  \ C 级管理人员吗？网络安全是否是他们目前正在处理的许多紧迫需求之一？如果对第一个问题的答案是“否”，第二个问题的答案是“是”，你可能考虑创建一个`CISO`\
  \ 形式的新职位。\n\n董事会还应该考虑 `CISO`（或其他主要负责网络安全的官员）的内部汇报结构，以确保该人员拥有在这一至关重要的角色中取得成功所需的独立性和权威。`CISO`\
  \ 可以向公司的首席信息官、首席运营官、首席技术官，甚至是首席执行官汇报——但在任何情况下，`CISO` 都应该根据需要接触高级管理层和董事会。公司管理层还应该考虑建立由公司\
  \ `CISO` 主席的安全委员会，并邀请 C 级官员参加委员会会议。董事们自己应该了解谁担任了 `CISO` 职位，并根据情况与该个人进行直接交流。\n\n\
  ## 4. 评估风险管理策略\n\n从董事的角度来看，有效监督的关键在于让高级管理层负责阐述和监控公司与网络安全相关的策略和风险承受能力。在大多数情况下，董事成员应该关注公司的网络安全计划，但不应过度干涉其执行细节。\n\
  \n董事会可以且应该发挥关键作用的一个领域是制定公司与网络安全相关的战略计划。在完成初步工作之后，董事会应监督公司管理层实施该战略计划。\n\n\n\n\n董事会还应与管理层合作，制定一份网络安全事件“响应手册”，规划出在发生数据泄露或影响公司系统的严重网络安全事件时，公司将如何应对各种应急情况。例如，在\
  \ Uber 丑闻之后，公司可能希望考虑处理赎金请求，在可能缓解与泄露相关的某些损害的优点，与以这种方式奖励犯罪行为的缺点之间进行权衡。任何此类分析都应具有足够的灵活性，以考虑到当时的执法部门的建议以及对公司披露义务的法律分析。为了避免像\
  \ Equifax（富安信）那样的问题，公共响应计划应指定一个内部和外部专家团队来调查原因并进行适当的披露。\n\n公司管理层可以使用多种框架来制定与网络安全相关的适当风险管理策略。例如，2013\
  \ 年 10 月，美国商务部国家标准与技术研究院（`NIST`）发布了一套旨在降低网络安全风险的自愿标准和最佳实践供征求。最终版本于 2014 年 2 月发布，标题为*改进关键基础设施网络安全框架*。¹⁴**\n\
  \n`NIST` 框架包含了五个“功能领域”，董事会在为公司制定整体网络安全计划时考虑这些功能领域。这些功能包括：\n\n1. **识别**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。\n\
  2. **保护**：开发并实施适当的保护措施，以确保关键基础设施服务的交付。\n3. **检测**：开发并实施适当的活动以识别网络安全事件的发生。\n4. **响应**：开发并实施适当的活动对已检测的网络安全事件采取行动。\n\
  5. **恢复**：开发并实施适当的活动以维护韧性计划并恢复任何因网络安全事件受损的能力或服务。¹⁵。\n\n鉴于美国证券交易委员会（`SEC`）对市场的巨大影响，其指南也为董事会提供了宝贵的帮助。网络安全一直是\
  \ `SEC` 国家检查计划的重中之重，该计划由合规检查检查办公室（`OCIE`）监督。2017 年 8 月，`OCIE` 发布了一份风险警报，强调了其“网络安全\
  \ 2 号倡议”的结果。¹⁶。\n\n作为网络安全 2 号倡议的一部分，`OCIE` 评估了公司在以下领域管理其网络安全计划的情况：\n\n1. 治理和风险评估；\n\
  2. 权限与控制；\n3. 数据泄露防护；\n4. 供应商管理；\n5. 培训；以及\n6. 事件响应。¹⁷。\n\n从广泛的角度来看，`OCIE` 发现，虽然公司在建立网络安全计划方面做得更多，但面对不断变化的网络威胁和攻击，它们在维护和更新这些计划方面做得还不够。¹⁸。\n\
  \n## 5. 开发监控网络安全工作的系统\n\n董事会应将监控公司网络安全工作的方法类似于对机器的持续维护。这需要定期的检查和调整，而不是一项一次性的工作。用于进行和防止网络攻击的技术手段将不断演变。\n\
  \n此外，随着公司转向不同的操作系统或扩大其业务组合，旧的战术和系统可能被认为无关或不足。\n\n因此，董事会至少在每季度会议上对公司的网络安全计划进行例行审查是明智的。如果出现新的、严重的问题，还应有一套程序能够更频繁地向董事会汇报。\n\
  \n公司的董事会会议记录应准确反映在此类会议上讨论网络安全的情况，以便董事会的尽职调查得到记录和证明。董事会还应定期收到网络安全计分卡，突出公司在缓解网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡并不需要包含高度技术性的关键绩效指标才能发挥作用。相反，适用于董事会的良好指标示例包括：客户满意度（因信息安全事件导致客户系统停机的时间）、声誉（媒体报道的信息安全事件数量）以及财务（信息安全预算占\
  \ IT 预算的百分比）。\n\n作为一个重要原则，董事会应确保管理层和公司员工收集、分析并分享有关网络安全事件（无论大小）的数据，以帮助评估现有网络安全工作的有效性。公司还应优先内部收集、分析和共享从政府、私人或非营利来源获取有关网络漏洞和可能暴露的任何信息。\n\
  \n在 Equifax 事件之后，所有公司认真审视其信息升级协议都是非常重要的。当可能的网络事件首次被公司察觉时，谁会收到通知？\n\n通常，初级员工最适合观察网络泄露的初步迹象。在安装关键软件补丁时——例如\
  \ Equifax 的案例——要确保有适当的监督和同级评审系统，以免一个人的人为失误导致灾难性的（且可以避免的）泄露。\n\n董事会还应确保公司有一套系统，鼓励员工和管理层从过去的错误中吸训。\n\
  \n承认错误并从中学习会带来更好的决策。在关于公司安全模型和漏洞的简报中，应该鼓励进行网络安全事后分析（post mortems）。\n\n当错误发生时，这也是咨询律师的好时机。某些错误伴随着法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及由此产生的任何政策都包含必要的法律应对。\n\
  \n## 6. 审查网络披露的充分性\n\n每年越来越多的上市公司开始在财务披露中将网络安全描述为一种风险。¹⁹。\n\nEquifax 因在 7 月底发现泄露后直到\
  \ 9 月才披露而遭了严重批评。但公司和监管机构都意识到，在早期披露与等待掌握所有事实以避免做出误导或不准确的披露之间存在着巨大的张力。`SEC` 本身也因在处理\
  \ `EDGAR` 数据泄露时的感知失误而受到批评。`SEC` 最初报告没有个人识别信息被获取；随后它不得不修正了这些声明。²⁰。\n\n公司建立适当的升级协议至关重要。不要浪费宝贵时间等待泄露报告层层上报给决策者。相反，在重大性泄露到披露之间的任何时间都应该很好地花在调查事实和分析问题上。\n\
  \n`SEC` 已经在该领域提供了一些指导。2011 年，`SEC` 公司金融部发布了针对上市公司的有关网络安全威胁和不利网络事件披露义务的指南。²¹。\n\n\
  \n\n虽然美国证券交易委员会（SEC）尚未介入，但其他监管机构已开始积极执行网络安全相关的披露义务。例如，2017 年 8 月，Uber 就联邦贸易委员会（“FTC”）针对其\
  \ 2014 年的一起数据泄露事件提出的指控达成和解。FTC 指控该公司在保护客户信息方面的努力上做出了误导性陈述，并未能采取“合理的、低成本的措施”来防止对客户个人数据的未经授权访问。同时，FTC\
  \ 确认其正在审查 Uber 对 2016 年数据泄露事件的回应，该公司最近才披露了该事件。\n\nFTC 此前还就甲骨文（Oracle）的披露问题提起诉讼，声称该公司未能告知消费者，新版本的软件更新不会自动删除旧版（且可能被利用的）`Oracle’s\
  \ Java software` 版本。去年，消费者金融保护局（CFPB）命令运营在线支付系统的 Dwolla, Inc. 支付罚款并改进其安全实践，此前该公司此前被指控向消费者误传其网络是“安全号且“可靠的”，并声称其数据安全实践“超过”或“超越”行业安全标准。\n\
  \n此外，尽管目前还没有国家级的“数据泄露通知”法，但大多数州已经颁布了法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全泄露时，必须通知受影响个人。\n\
  \nUber 可能是延迟披露和“不应如何做法”最极端的例子。该公司在近一年的时间里未能通知受泄露影响的监管机构和个人，这可能违反了州级通知法。此外，Uber 还被指控将不披露泄露作为向网络犯罪分子支付赎金的条件，这进一步加剧了其掩盖真相的形象。\n\
  \n几个州的总检察官已经对该泄露事件启动了调查。\n\n核心启训是，公司绝对必须持续审查其网络披露的充分性和及时性。这没有“一刀切”的答案。经验披露顾问的建议至关重要。\n\
  \n### 7. 理解第三方漏洞\n\n如果说最近的事件教给了我们什么，那就是：如果公司未能确保第三方服务提供商也实施充分的网络风险管理系统，那么公司的网络安全协议将化为乌有。很多时候，网络犯罪分子的切入点是拥有公司系统或非公开数据的第三方。\n\
  \n例如，家得宝（Home Depot）仍受到 2014 年一次网络事件的影响，在那次事件中，黑客利用第三方支付处理商的安全漏洞，盗了超过 5000 万名家得宝客户的电子邮件和支付信息。黑客在\
  \ 2013 年同样利用第三方供应商访问了 Target 的客户数据库，盗了约 4000 万客户的支付信息。\n\n德勤（Deloitte）最近的案例说明了为什么公司在涉及第三方网络风险时，应特别关注专业服务公司。专业服务公司——如律事务所、审计机构和咨询公司——特别脆弱，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，这些信息都集中在一个方便网络犯罪分子利用的位置。专业服务公司拥有的信息对网络犯罪分子来说是非常具吸引力的目标，因为通过非法交易很容易变现。此类信息也可能是黑客行动主义者（hacktivists）吸引的目标。\n\
  \n2015 年的“巴拿马文件”丑闻是首批揭露律师事务所网络漏洞的重大事件之一。受影响的事务所 Mossack Fonseca 曾帮助数百名美国客户建立离岸业务。黑客泄露了\
  \ Mossack Fonseca 知名客户的敏感信息，时间可追溯到 1970 年，并让许多与该公司合作过的公司暴露在风险之中。\n\n由于第三方通常可以访问高度敏感的公司信息，因此在公司聘用他们之前，应对对他们进行严格的第三方网络风险评估。\n\
  \n董事不需要了解每一份服务合同的细微细节，但他们应该确保公司有一份书面的供应商风险管理政策，以处理第三方对公司系统和敏感非公开数据的访问。归根结底，该政策应确保管理层进行适当的尽职调查，并意识到与特定供应商开展业务的风险。公司还应定期重新评估第三方风险，并确保第三方服务提供商确实履行了其义务。\n\
  \n董事会应意识到向政府提供敏感非公开信息相关的风险。SEC `EDGAR database` 的泄露引发了人们的严重质疑，即市场监管机构应该持有多少敏感的公司数据，以及由于资源有限的政府是否能够保护此类数据。\n\
  \n### 8. 考虑转移网络风险的方法\n\n网络安全不是一个要解决的问题——它是一项需要持续管理的风险，并在审慎的情况下进行转移。作为风险管理工作的一部分，董事会应仔细审查与第三方供应商的现有合同和保险单。\n\
  \n这些协议必须明确规定发生泄露时由谁负责以及涵盖范围是什么。\n\n尽管网络保险仍处于起步阶段，缺乏精算数据，但它是美国公司中增长最快的保障类型之一——而且理有其。。\n\
  \nTarget 公司在今年早些时候向 SEC 提交的年度报告中报告，其与 2013 年系统数据泄露相关的累计费用已达 2.92 亿美元，该事件导致了客户信用卡信息被大规模盗取。\n\
  \n根据公司的说法，该总金额部分被 9000 万美元的保险赔款抵消。\n\n除了货币索赔这一显而易见的潜在收益外，寻求网络保险可能为公司带来辅助优势。寻求网络保险的公司将有动力使用最佳实践，因为保费至少在某种程度上取决于公司对保护措施的有效利用。仅申请过程就可能需要对公司现有的网络计划进行深度评估。通过这一过程，公司可能对自己的网络风险和机会有更好的认识。董事会还应意识到，如果需要，保险公司通常会提供工具帮助公司应对网络安全事件并减轻泄露后的损失。\n\
  \n董事会通常处于公司是否应购买网络保险的最终决定权地位。作为董事会做出这一决定可能需要应对一些新领域。你必须确定哪些是涵盖且应该涵盖的，哪些是不涵盖且不需要涵盖的。还需要确定特定的保费是否公平。董事会应该问的问题之一是，现保险单是否可能涵盖某些事件。\n\
  \n\n\n传统上，大多数商业综合责任（CGL）保单不包含网络安全“免责条款”；然而，如今保险公司可能更倾向于保单中加入此类条款。董事应确保保障范围没有关键漏洞，并根据公司自身的风险概况考虑何种保障最合理（例如，保障选项可能包括数据泄露成本；勒索；取证分析；盗窃；诉讼费用和开支；以及业务中断等）。董事会还应确认其董事及高管（D&O）保单涵盖了对网络安全相关事件的保障。\n\
  \n# 9. 跟进发展动态\n\n网络安全领域没有任何停滞不前。黑客攻击不断演变，上个月还是行业标准的防御实践，下个月可能就会过时。立法者和监管机构也努力跟上新的法律法规，这在很大程度上受到受关注的泄露事件后舆论愤慨的推动。例如，纽约州对最近的\
  \ Equifax 泄露事件做出了反应，提议通过法规来扩大该州首创的网络安全规则，这些规则目前要求纽约所有的金融机构必须在州注册，并实施保护消费者数据的计划等。²⁹\n\
  \n治理网络安全的法律格局的转变本身可能被视为公司的网络“漏洞”。董事会需要意识到公司的合规义务，但这说起来易做起来难。如今的公司运行在一个碎片化的网络安全监管体系中。\n\
  \n州、联邦和外国监管机构都有各自的规则和指南。某些州（如加利福尼亚州和纽约州）近年来采取了特别激进的立场，在其管辖范围内监管并执行网络安全标准。在联邦层面，`FTC`\
  \ 和 `SEC` 等机构在其指定的关注领域和指导范围内也处于网络安全执法的前沿。\n\n欧盟方面近期实施了《通用数据保护条例》，该条例对从欧盟公民那里收集信用卡数据或其他个人信息的公司实施了报告和其他要求。³⁰\n\
  \n董事会应确保其公司继续遵守有关网络安全的最新州和联邦法律法规。对于某些经常被网络犯罪分子针对的行业公司（例如金融机构），以及处理敏感个人信息（如个人身份信息、财务信息或受保护的健康信息）的公司来说尤为如此，因为这些公司经常受到监管机构和立法者的审查。董事会显而易见的第一步可能是要求公司总法律和\
  \ `CISO` 定期向董事会汇报立法进展并提供建议。鉴于许多律师事务所都在扩大其数据隐私和网络安全业务，公司也可以借鉴外部法律顾问的专业知识，根据公司需求制定个性化的计划来管理网络安全风险。\n\
  \n董事会也可以对抗“合规疲劳”的有力武器，在这种疲劳下，执行日常合规工作的人员在应对各种碎片化需求和多个不断变化的目标时，会忽视大局。“勾选合规项”很重要，但还不够够。凭借其高层次的视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施时进行批判性和创新性思维方面发挥重要作用。最终，董事会应尝试确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规性。\n\
  \n# 结论\n\n为了实施有效的网络安全计划，董事应该理解其公司面临的全方位网络风险，并鼓励管理层制定针对公司特定需求和目标的相应策略。任何有效的网络安全计划都包括周密的规划、明智的授权以及监控监控系统——这些都应由董事负责。这不再是公司是否会被攻击的问题，而是何时会被攻击，以及公司将如何应对的问题。智能网络监控、早期预警指标、多层防御以及从过去的事件中学习都是真正的网络韧性的关键组成部分。当问题发生时（无论规模是大还是小），快速识别并响应问题的能力将决定公司的最终恢复。网络安全无法保证，但及时且恰当的反应可以。\n\
  \n# 董事网络安全清单\n\n### 风险评估 - 评估现有网络安全风险并确定优先级\n* 确定最有价值的资产\n* 寻求保护它们的有效策略\n* 审查网络安全预算的合理性\n\
  \n### 评估企业文化并树立正确榜样\n* 高管层和董事会不仅要参与，还应设定基调\n* 培训应具有参与性\n* 文化应基于团队合作而非监控\n\n### 制定管理网络风险的策略和内部系统\n\
  * 评估内部系统和控制的效果\n* 参与关键网络安全人员的选拔\n* 确保网络安全人员能够接触董事会\n* 理解并制定评估网络安全有效性的指标\n* 严格审查升级流程\n\
  * 请求提供安全评分卡\n* 制定应急响应计划\n* 测试计划。考虑模拟网络攻击\n\n### 理解披露要求和第三方考量\n* 审视披露内容以关注网络安全\n\
  * 为第三方合同建立缓解控制措施\n* 审查网络保险覆盖范围\n\n### 跟进发展动态\n* 根据不断变化的法律格局定期重新评估你的网络计划\n* 至少每季度启动一次网络计划的常规审查\n\
  * 指派总法律顾问和/或 `CISO` 向董事会汇报监管进展\n* 利用与外部法律顾问的现有关系\n\n# 注释\n\n# [INDEX]](#Toc.xhtml#R_index)\n\
