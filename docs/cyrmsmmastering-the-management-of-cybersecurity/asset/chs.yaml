- "# 网络安全管理精通指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给我的家人，他们为我的世界赋予了生命。\n\n\n\n\n\n\n首先，数据、连接、交易和通信数量出现了此前无法想象的爆炸式增长，这导致传统数据系统过载。\n\
  \n其次，机构已经失去了有效识别问题的能力。更快的创新周期和琳琅满齐的新产品意味着，大多数企业发现自己无法快速识别安全违规。社交网络系统、大数据、云计算、移动互联网和物联网技术正在产生个人数据流，这使得授权和信息过滤变得异常困难。\n\
  \n第三，缺乏正式的控制机制。在网络安全中断变得日益普遍和复杂的环境中，在检测、响应、补救和企业内部通信方面仍然没有公认的标准。这些关键功能的管理通常留给 IT\
  \ 部门，而 IT 部门通常被要求追求过时的“硬壳策略”，这些策略的设计初衷仅仅是为了防止渗透。\n\n凭借作为风险管理领导者的十年经验，我审视了这一局面，并清楚地意识到我们需要一种信息安全模型，能够持续评估其收集信息的有效性、可靠性和价值。我开发并完善了这种安全模型，将其转化为一个我知道可以帮助公司避免网络攻击最糟糕陷阱的流程。它被称为网络风险管理，或\
  \ `CyRM℠`。\n\n`CyRM℠` 是一种新范式，它将安全视为业务问题并与业务需求对齐。因此，它不再将安全视为由技术人员处理的技术问题，而是使用一种结果为驱动的方法来平衡投资与风险。更进一步，它不是以牺牲高层参与为代价向问题投入金钱，而是将网络安全与业务决策相结合，以影响业务结果。\n\
  \n为了有效影响业务结果，`CyRM℠` 需要由三个部分组成：\n\n1. **风险管理：** 它需要将风险管理原则应用于网络安全，以对整个组织的风险进行观察，指导资源分配、更好地管理风险并实现问责制。\n\
  2. **CyberWellness℠：** 它不仅需要涵盖整个公司，还需要涵盖每个需要对其所承担的风险负责的员工。这需要一个与网络安全的互动过程——就像公司的身体健康计划一样，公司采取积极措施促进员工健康。\n\
  3. **作为业务战略的网络安全：** 网络安全需要重新定位到它的本质——作为增长的推动者，而不仅仅是为了通过消除病毒和黑客带来的危险来降低运营风险。它还需要增强产品完整性、客户体验、运营合规性、品牌声誉和投资者信心。\n\
  \n本书阐述了我对 `CyRM℠` 的方法，并向你们——无论是业务领袖还是 IT 经理——展示如何合作并取得成功。书的每一章都会告诉你在管理当前网络安全格局方面需要的知识。每一章都以\
  \ `CyRM℠` 行动点结束——这是你可以采取的主动步骤，让自己和你的公司做好生存和成功的准备。我期待成为你们的教育者和导师，共同深入研究 `CyRM℠`。\n\
  \n# 1 现状\n\n2017 年 9 月 7 日，美国最大的信用监控机构之一 Equifax 宣布，超过 1.43 亿个客户账户被攻破，这可能是迄今为止对美国消费者影响最大的网络攻击。此后，受影响人数估计已增加到\
  \ 1.47 亿。\n\n在 Equifax 争议期间，美国证券交易委员会（`SEC`）主席 Clayton 于 9 月 20 日宣布，`EDGAR` 系统已被攻破。从那时起，SEC`\
  \ 对其系统的安全性提出了质疑。\n\n高性攻击持续发生。在《权力的游戏》案例中，`HBO` 网络遭到入侵，被盗了 1.5 TB 的信息。“四大”会计师之一的\
  \ `Deloitte` 通知客户其内部电子邮件系统遭到破坏。`Uber` 花了了一多的时间才承认被黑客攻击，并支付了赎金以删除被盗数据。\n\n大规模数据泄露每年都在发生。2019\
  \ 年，`Capital One` 透露一名黑客获取了 1 亿个客户账户的访问。`Quest Diagnostics` 透露 1200 万患者的医疗信息被泄露。在剑桥分析丑闻发生约一年后，`Facebook`\
  \ 承认无意中泄露了超过百万用户的电子邮件。\n\n2020 年，与多伦多大学相关的 `Citizen Lab` 揭露了一群位于新德里的、被称为 `Dark Basin`\
  \ 的雇佣黑客。这些受雇的黑客针对了 `Exxon` 和一家名为 `Wirecard` 的德国公司。2020 年，黑客通过针对远程员工入侵了美国最大的国防承包商之一\
  \ `Lockheed Martin`。所有黑客进入公司所需的只是某一个弱点；一旦他们找到了那个点，就可以控制整个网络并窃取数据和秘密。\n\n\n\n\n\n\
  ## 引言\n\n此外，第三方公司提供的服务是弹性的——换句话说，它们提供的服务和安全性的程度或水平各不相同。这导致了安全模型的不一致。你可能听过应用程序接口（`APIs`）。`APIs`\
  \ 是一种编程过滤器，让用户有机会定制其云服务功能以适应业务需求。例如，银行和烘焙店的需求截然不同，在它们的网站上拥有特定的数据过滤器对它们是有利的。虽然这些程序在允许用户进行身份验证、提供访问和影响加密方面极其有用，但它们也可能产生漏洞。`API`\
  \ 最大的漏洞在于应用程序之间发生的通信——这创造了可被利用的安全风险和新的攻击面。\n\n恰例说明的是：2019 年 1 月，研究人员揭示了大多数现代微处理器中常见的一种设计特征，该特征允许使用恶意的\
  \ JavaScript 代码从内存中读取内容（包括加密数据）。该问题的两个变体被称为 `Meltdown` 和 `Spectre`（ Spectre），它们由于破坏了应用程序之间的隔离而允许侧信道攻击。这段技术术语的另一种说法是：攻击面的扩大意味着风险的增加！\n\
  \n## 云技术风险\n\n准备好面对随云技术而来的潜在问题了吗？在最近的一起在线银行泄露事件中，攻击者是托管银行网站的第三方公司的前员工。据称，犯罪分子利用\
  \ Web 应用程序防火墙凭据获取了“权限提升”，我们用这个词来指访问大多数人不应看到的信息。云的另一个潜在问题包括服务提供商无意擦除数据。这最近发生在一家大型在线零售商那里。通常情况下，企业对存储在云端的数据没有恢复计划。一旦数据丢失（如果没有备份的话），它就永远消失了。\n\
  \n## 网络攻击日益增长的威胁\n\n无论攻击是通过云端还是其他方式，针对持有敏感个人和专有数据的组织的网络攻击频率和严重性逐年剧增——这些攻击导致的资金损失现在已达`数十亿`。公共和私营组织都是如此。这些攻击对所有受影响的人来说无疑是破坏性的且昂贵的。\n\
  \n银行、零售商、国防承包商、世界 500 强公司、娱乐公司和地区政府——所有这些最近都是网络攻击的受害者。这只是未来更多攻击的先兆。美国现在许多员工在居家办公，使用个人笔记本通过不安全的互联网连接访问包含机密信息和个人数据的工作文件。这为黑客提供了充足的机会——之前提到的“攻击面”。每家公司的攻击面都急剧扩大，使他们更容易成为目标。网络情报公司\
  \ `CYFIRMA` 报告称，2020 年 2 月至 3 月之间，与新冠肺炎相关的网络威胁增加了 600%。\n\n## 战略应对\n\n既然我已经引起了你的注意，面对网络攻击，我们应该——**你**应该做什么？答案绝对不是缩头乌龟。如果你和你的公司想在这个网络格局中生存并繁荣，你就必须变得明智且全面。你需要投资并增强你的网络风险管理（`CyRM`℠）。\n\
  \n有些人可能认为美国政府可以保护他们免受攻击。毕竟，我们的军队保护我们免受入侵。为什么不保护我们免受网络入侵呢？但这是一个残酷的现实：尽管美国政府非常擅长传统的军事防御，遗憾的是，他们在网络防御方面并不出色。\n\
  \n## 政府失败与漏洞\n\n在`9·11`之后的二十年里，我们有充分的证据表明政府正在努力保护我们免受网络攻击。但我们没有任何证据。考虑一下，`2014`年\
  \ 11 月，国家安全局（`NSA`）局长在国会作证，他认为外国可以有效关闭电力、水电和燃料。五多年前，我们的政府接到通知，不同国家可以关闭我们的国家基础设施。然而，政府并没有给出任何正在采取措施的保证。也许这种威胁太理论化了、太无形了，而且太关乎生存了。\n\
  \n然而，在那次证词后仅仅四天，朝鲜就网络攻击了索尼，摧毁了专有信息以及计算机硬件。一个国家行为者证明了它可以访问并让一家大型跨国公司难堪。`2015`年，我们得知美国人事管理局（`OPM`）尽管早有警告，仍允许中国政府盗取\
  \ 2000 万美国人的数据。最近，`NSA` 未能充分保护其开发的、高度先进、武器化的`zero-day` 漏洞。（零日漏洞是先进的网络攻击工具，其速度之快、破坏之大，以至于受害者没有时间发现。）`NSA`\
  \ 失败的结果是，这些漏洞现在落在了全球范围内大作破坏的恶恶分子手中。`2020`年，由一个外国政府支持的团体发起的重大网络攻击渗透了美国联邦政府的多个部分。\n\
  \n尽管存在攻击和专家的反复警告，美国政府自`2002`年以来还没有通过过任何独立的网络安全相关立法。`2002`年，我们都在使用美国在线服务（AOL），而 `Gmail`\
  \ 甚至不存在！最重要的拟议法案要求私营部门与政府共享更多数据。为什么公司要自愿向一个在保护 `OPM` 和 `NSA` 数据方面失职的实体交出敏感数据呢？这些数据可以说是其国家机密库中最敏感的信息。\n\
  \n## 未来展望\n\n雪上加霜的是，这种立法上的不作为还伴随着不愿让外国政府对我们公民和企业的网络攻击负责。像地理位置或军队规模——这些传统上保护这个国家的因素在网络空间中并不存在。突然之间，许多较小的国家可以直接入侵我们的能源**通信和金融行业。坏分子正在不断设计新的、更强大的恶意软件，以远程操纵和干扰这些行业。\n\
  \n美国情报界内部日益担心，外国政府将网络入侵金融机构——不是为了偷钱，而是为了污染、破坏和操纵数据。外国情报机构策划的网络攻击旨在制造记录保存、交易精确性和货币估值方面的混乱，这可能会破坏和毁灭公众信任，以至于整个金融系统的稳定性可能受到影响。\n\
  \n\n\n\n\n持续且广泛的金融数据腐败这一毒性结合——加之政府似乎无力阻止这一局面——显然是一个巨大的动不稳定性威胁，反过来，这应该触发公共部门和私营部门的紧迫战略规划。不要等政府来使其政策现代化。不要盲目信任第三方公司。网络坏分子拥有惊人的能力，可以触及大量潜在受害者。他们战术变化迅速，在穿行于无边界的数字领域时保持高度匿名状态，在自己故土的舒适之乡大肆破坏。\n\
  \n当这些坏家伙遇到对手时——如果他们能遇到的话——美国政府正拖着拖它那套模拟时代的法律结构。这种结构按任务（执法、情报、军事）和地理（国内、国外、司法管辖区、美国人员、美国美国）进行划分，并使用着很大程度上在冷战期间构建的政策和程序（安全分级制度）。\n\
  \n面对新的网络威胁现实，政府显然既不充分、缺乏战略性，也不敏捷。现在是时候在我们如今几乎全球互联的星球背景下，重新审视刑法、国际条约协议以及治理方案的充分性了。然而，考虑到政府迄今为止可怜的记录，就不要指望它能振作起来。现在就行动。\n\
  \n有些人看到光明时就会改变；另一些人只有在感受到痛苦时才会改变。换句话说：你可以是主动的，也可以是被动的。在网络安全方面，美国政府已被证明是被动的。对于精明的商业领袖来说——那些看到光明的人——他们有责任在**现在**采取行动保护自己的公司。随着攻击面的增加和政府的缓慢反应，是你时候投资\
  \ `CyRM℠` 并在保持、将坏家伙挡之门外发挥领导作用了。\n\n## 支柱 1：`CyRM℠`: 网络风险管理\n\n# 2 收集情报，预判风险\n\n\
  正如我们在`第 1 章`中看到的，这不再是一个公司是否会被攻击的问题，而是一个关于*何时*会发生这个问题——以及组织将如何防止它的问题。当事情出现问题时，无论大小程度如何，快速识别和响应问题的能力将决定你公司的最终恢复情况。我的方法\
  \ `CyRM℠` 将风险管理的原则应用于网络安全。我相信，从整个组织的角度广泛看待风险至关重要，以便为资源分配提供信息，更好地管理风险并实现问责制。与传统的风险管理一样，`CyRM℠`\
  \ 的目标是尽早识别风险并实施适当的措施以防止事故或减轻其影响。为了培养一个卓越的网络风险管理计划，你首先需要理解企业管理的原则和实践。\n\n风险经理通过各种方式调查公司面临的风险图谱，然后根据这些风险创建适当的响应。考虑风险管理时，一个很有用的类比是人体：你的五感接收刺激并将数据传递给大脑，以发现潜在危险并预判问题。历史记忆帮助你根据过去的经验预测可能的结果，并帮助你规划潜在的响应。你的五种前瞻性感官结合历史记忆，持续监控你的周围环境，以警你潜在的危险。例如，烟味和/或临近火灾的热量会告诉你，受到火灾伤害的风险有多紧迫、有多严重。你的感官越敏锐，你的身体就能越快做出反应保护自己。你组织的风险管理系统应该持续感知任何潜在风险，确定它们对你的业务有多严重，并提供有效的机制来快速响应。\n\
  \n对于更具技术头脑的读者，另一个恰当的比喻是雷达。雷达的独特之处在于，虽然它利用历史性能（不像你身体的历史记忆），但它也向前看以预测未来的结果。\n\n它是这样运作的：雷达天线发射无线电波，电波在路径上的任何物体上发生反射。反射的能量返回到天线上，确定物体的距离、高度、方向和/或速度。跟踪算法预测移动物体未来的位置。这些算法很大程度上基于历史性能，并频繁进行前向更新。换句话说，雷达非常擅长收集情报*以及*预判风险。\n\
  \n风险管理——像雷达一样——依赖于量化的数据。风险和信息之间存在反相关关系。你掌握的信息越少，你面临的风险越高。考虑一个简单的日常例子：如果你不知道天气预报，你就会增加穿衣不当和在暴雨中措手不及的风险。\n\
  \n从风险管理的角度来看，风险和不确定性根据发生概率和可能结果是否为人知，是可量化的。由此产生的潜在损失金额可以很容易计算。例如，如果天气预报说下雨的概率为 100%，但你没有带伞且你的新鞋被坏了，潜在损失金额就是买一双新鞋的成本。如果在雨中弄坏鞋会导致几种可能的结果/成本——更换鞋的成本，或者带它们去鞋匠那里尝试修复的成本——你可以根据所有可能的结果/成本计算一个潜在损失金额。\n\
  \n将这个简单的例子再推进一步，假设你决定在雨中脱掉鞋以防弄坏它们；你完全不知道你的脚可能会发生什么。一种方法是制定方案，以确定你的脚可能发生什么、每种损伤的概率，并计算潜在损失金额。当你不知道在雨中赤脚行走可能对脚产生什么后果时，这个问题变得更难解决了。\n\
  \n如果你在雨中赤脚走在海中船只的甲板上，这个问题就变成了一个完全不同的维度——因为没有理智的人愿意将生存交由概率。换句话说，这不再是一个管理*不确定性*的问题——它变成了一个*生存*的问题。你的思维过程从“我所承担的成本是否合理？”转变为“这种风险我绝愿承担。我现有的保护措施是否足以我不遭受严重伤害？”换句话说：你不愿跨越的界限何时变得关乎生存——关乎你的存在——而不仅仅是量化成本？\n\
  \n\n\n\n与雷达一样，存在复杂的公式可以帮助风险官量化所有这些场景。通过（这些公式的帮助）收集情报并预判风险。\n\n网络风险管理演变为有效的监督职能一直受到阻碍，原因在于大多数组织无法像处理其他类型的风险那样对网络风险进行组织、分类和衡量。网络安全风险的量化应该是网络风险管理的核心。量化网络风险可以带来更好的决策，因为它是用公司内其他风险相同的通用语言或语境来描述风险的。向高级管理人员、董事会及其他利益相关者报告网络风险，有助于他们更好地理解随着时间的推移，公司、特定业务、产品和活动的网络风险水平的状况。\n\
  \n对于整体网络安全预算、网络安全支出分配以及保险范围，也可以做出更明智的决策。这也有助于营造一种重视漏洞的文化。它对第三方供应商提供了客观评估。它还有助于将网络风险与其他企业风险及运营风险整合起来。\n\
  \n那么，网络风险经理是如何收集情报并预判风险的呢？网络领域存在着看似无尽的未知数。我建议可以使用基于制造业的创新方法来解决所有类型组织的网络安全运营中断。\n\
  \n例如，在制造业中，考虑汽车制造工厂的装配线。如果一个不满的员工向装配线中部发射了火箭，工厂管理团队可以确定维修生产线需要多久、维修费用是多少，以及生产损失的成本。换句话之，通过关注发生了什么（无论它是如何发生的），汽车制造商可以确定火箭造成的潜在中断损失。（当然，这种场景还应该引发对由于工厂士气低落和员工不满所产生风险的额外分析。但你明白我的意思。）\n\
  \n让我们把这个例子扩展到一个本应该 24/7 全天运行的在线银行应用程序。突然，在一个三天休假周末的深夜，银行应用程序因一次网络攻击而变得无法使用。无论攻击是如何发生的，通过仅关注发生了什么，银行可以确定需要修复的关键节点、费用多少、需要多长时间以及停机成本——所有这些都可以像制造业示例一样被量化。\n\
  \n这种方法关注服务中断的影响，而无论其成因是什么，它允许你有效地创建一个中断模型，并并利用该模型来量化与运营中断相关的网络安全风险。底是：网络风险经理应该关注关键中断节点以提高韧性——这在攻击发生之前的很久就应该做好。\n\
  \n正如雨中行走的经典风险案例一样，网络风险经理经常忽略了这些场景中的连锁反应。例如，假设对纽约金融系统的网络攻击包括在周末期间对曼哈顿电网的攻击。所有的金融交易所都有应急电源系统，但它们的响应可能会受到阻碍，因为地铁也将无法运行。连锁反应是，本该响应攻击的技术人员将非常难进入市区——这一事实很容易被忽视。\n\
  \n一个优秀的网络风险管理官关注的是*可能发生*哪些中断，而不是它们将*如何发生*。考虑风险的连锁反应同样重要。最终，一个优秀的网络风险经理必须自问：“我所采取的保护措施对于我的生存能力来说是否足够？”\n\
  \n以一个真正无法预知的风险为例，例如网络安全事件造成的声誉损失总额。首要问题是：“应该制定什么样的最佳实践（响应计划和政策），以确保影响可以被吸收且组织能够继续运行？”\n\
  \n在这些情况下，了解公司的“皇冠上的明珠”是什么非常重要，然后划定清晰的界限并采取强有力的缓解措施来保护它们。例如，在一家资产管理公司，个人客户数据极其敏感，可能需要额外的控制层，包括不同的安全协议。二道防风险管理的观点应该是：“公司是否已采取一切必要措施来适当缓解这些风险？”\n\
  \n一个强大的网络风险管理方法涵盖以下内容：\n\n*   关注网络安全事件的影响，而不是它们如何发生。\n*   使用中断模型量化运营中断。\n*   尽可能将未知风险转化为已知风险，以便进行量化。\n\
  *   并且，对于那些真正无法预知的风险，关注需要做什么来确保生存能力。\n\n\n\n第二道防线是提供独立的监督，以确保风险得到积极且适当的管理。最亲密参与网络安全的人有时会遗漏某些问题，因为他们每天都处于一线状态。风险管理部门应该提供这种独立、客观的视角——可以说是一双“新的眼睛”，或一种建设性的挑战。风险管理人员应该扮演与他们在处理公司其他所有风险时相同的角色，执行相同的功能。例如，他们应该在确定公司需要保护的“皇冠明珠”方面发挥关键作用，然后评估现有的控制措施是否适当。\n\
  \n网络安全的第三道防线是审计职，它通过定期对现行的策略和控制进行测试，以确保其到位并有效。内部审计应通过对现有和所需控制措施提供独立评估，在帮助公司管理网络威胁方面发挥关键作用，并帮助高层管理理解并应对当今数字世界中许多化的风险。内部审计还应该评估整个网络安全框架，而不是仅仅挑选项目。这种评估涉及将当前状态与框架特征、组织去向以及整个行业或业务领域的最低预期网络安全实践进行对比。初步评估应为进一步、更深入的审查提供参考。其目的并非进行需要大量测试的详尽分析。相反，初步评估应驱动额外的、基于风险的网络安全深度审查。\n\
  \n以下是构建 CyRM℠ 免疫系统的关键组件摘要，这些内容将在后续章节中进行更详细的讨论。\n\n## 警报\n\n智能网络监控、预警指标、多层防御以及从过去事件汲取的教都是真正的网络韧性的关键组成部分。网络安全无法完全保证，但及时且适当的反应是可以保证的。\n\
  \n要意识到第三方处理公司敏感数据时所带来的风险，因为第三方会对运营环境产生影响。公司对第三方网络安全风险的敏锐度通常没有对自身业务的风险那样敏锐，尽管第三方可能会产生同样的负面长期影响。\n\
  \n例如，公司与其供应商之间的数据共享和通信不再完全受公司内部运营的控制，因为这些外部实体为公司技术环境创建了新的切入点，增加了运营环境的复杂性和潜在波动。第三方计划的基础应包括：根据组织风险（包括网络风险）对第三方风险口进行优先级排序；为任何新关系的建立建立的评估工具；以及持续的、基于风险调整的监控流程，以评估对合同条款的遵守情况，并与主要服务提供商进行联合灾难演练。\n\
  \n## 解决问题\n\n建立组织理解，以管理系统、资产、数据和能力的网络安全风险。当问题真的发生时——因为它们迟早会发生——快速识别问题的能力将带来更有效的恢复。\n\
  \n开发并实施适当的保护措施，以确保关键基础设施服务的交付。同时，利用新兴的开源情报服务并使用收集的数据来指导持续的网络安全投资也很重要。随着时间的推移，这些数据将汇聚，允许开发出新工具来分析、预防和缓解当下的网络威胁。这种新情报在主动量化风险和评估保护特定资产所需的投资水平时将特别有价值。\n\
  \n## 恢复与记忆\n\n建立组织理解，以管理系统、资产、数据和能力的网络安全风险。当问题真的发生时——因为它们迟早会发生——快速识别问题的能力将带来更有效的恢复。\n\
  \n开发并实施适当的保护措施，以确保关键基础设施服务的交付。同时，利用新兴的开源情报服务并使用收集的数据来指导持续的网络安全投资也很重要。随着时间的推移，这些数据将汇聚，允许开发出新工具来分析、预防和缓解当下的网络威胁。这种新情报在主动量化风险和评估保护特定资产所需的投资水平时将特别有价值。\n\
  \n## 考虑转移风险的方法\n\n可以利用法律和其他因素来划分和减轻风险。然而，风险——无论源自何处——在压力时期都会反弹到你的公司。对公司感到相当安全，不仅仅是能够回答“我们有正确的治理吗？”相反，它还意味着能够回答更大的问题，例如“我们的思考方式正确吗？这一切将向何处发展？”\n\
  \n# IT 与业务关键决策的对齐\n\n董事会成员在评估组织内战略性与运营决策与 IT 决策之间的脱节时，需要考虑以下步骤。问题是不节，而目标是对齐。持续管理这种对齐是高层管理人员的职责：\n\
  \n1. 识别问题（或机会）并解决它。\n2. 收集信息并制定替代方案。\n3. 选择你认为最成功的替代方案。\n4. 根据你的决定采取行动。\n\n## 识别问题并解决它\n\
  \n在今天的许多组织中，IT 策略是事后考虑的——是挂接到业务策略上的，而不是成为其不可或的一部分。这导致了公司的战略性和运营业务决策与其 IT 决策之间的脱节。尽管\
  \ IT 策略在今天应该扮演着重要的角色，但它很多时候并没有做到。\n\n\n\n\n如果业务部门在没有 IT 部门参与的情况下做出决策，或者 IT 部门在没有包含高管理层业务目标的情况下做出业务决策，那么对齐是不可能的。随着业务需求和组织优先级的变化，高管理层团队会通过制定自己的策略来做出反应，但他们很少考虑将\
  \ IT 纳入支持这些变化的范围中。\n\n每个部门和高管都从自己的职能角度来看业务问题以及机会。对齐也不例外。遗憾的是，职能部门往往无法相互沟通和分享观点。董事会成员应该处于独特的地位来观察大局，并评估每个人的角色（包括\
  \ IT 的角色）是否对所有人都是清晰的。\n\n在做出良好决策时，需要收集与问题相关的信息。广撒大网以充分理解问题的重要性和紧迫性至关重要。从各种来源收集大量信息也将有助于为潜在的解决方案产生想法。\n\
  \n在过程中，不要过早地评估潜在解决方案是重要的。有时，起初看起来天马行空或疯狂的想法，在进一步考虑后可能会被证明是极好的可能性。管理学大师彼得·德鲁克曾说：“组织需要两类人：官僚者和疯子。创新总是来自疯子——绝不来自官僚。”因此，务必确保高管理层在征集可能解决方案的想法时，咨询了公司的那些“疯狂且狂野的人”。\n\
  \n在评估高管理层的行动方案时，你需要确定一项潜在决策将如何影响其他相关人员。问问自己：“这个决策的可能结果是什么？它现在将如何影响业务？它未来又将如何影响业务？”\n\
  \n**注意**：IT 部门对这些问题的回答有时会令人困惑。有些词和术语属于信息安全文化，对于没有深厚行业背景的人来说很难翻译。此外，当存在解决的问题时，IT\
  \ 倾向于关注技术因素而非技术因素。当问题出现时（在 IT 领域以惊人的速度发生），他们假设问题要么与技术有关，要么可以通过技术或按顺序来解决，这也是大多数 IT\
  \ 问题的解决方式。\n\n## 采取行动\n\n一旦你评估了选项并对高管理层的决策表示满意，评估所有必要人员是否采取了行动就至关重要。高管理层不断评估决策和已采取的行动，以确保一切都按计划进行。这一步也是基础性的，因为它可能要求高管理层在过程中寻求新信息并进行调整和进一步更改。\n\
  \nIT 风险的衡量和评估方式与业务风险不同，这影响了决策过程。IT 风险根据性能、成本或实施时间来衡量。当 IT 做出有关适当服务水平决策时，他们可能会选择最高的服务水平——因为\
  \ IT 通常根据性能可靠性来判断。\n\n而产生真正的业务价值需要不同的指标来确定成功——而且可能不需要最高的服务水平。由于 IT 自配成本，它通常需要不同的方式跟踪和管理成本，这可能会导致深刻的脱节。\n\
  \n## 管理对齐\n\n董事会成员评估以下内容至关重要：\n\n* IT 领导是否有机会将其部门的角色从“服务提供者”转变为“信任伙伴”。\n* IT 策略是否在更广泛的背景下制定，即理解服务是如何支持增长的。\n\
  * IT 相关的决策不应该孤立地做出，在不知道业务需求的情况下做出。\n* IT 策略应该是业务策略的延续，包括业务替代方案。\n* IT 对公司业务的影响需要持续的对话。\n\
  \n简而言之，要在当今技术驱动的世界中有效竞争，公司需要实现正确的对齐。\n\n# 面高管和董事会成员的网络安全\n\n虽然网络安全对董事会来说不是新挑战，但近期事件的规模和数量表明，我们可能正处于一个分水岭时刻，涉及到董事监督适当网络安全系统的责任以及经理实施这些职责。在\
  \ Equifax 于 2017 年公开披露影响其系统的网络攻击后，观察者了解了许多关于警告的知识。\n\n第一条教训是，公司必须注意公司系统和公司使用的软件中有关网络漏洞的常规警报。回想我在第一章中引用的高知名网络攻击案例：Equifax、Uber、HBO\
  \ 和德勤。在 Equifax 案例中，黑客显然利用了 Apache Struts Web 应用程序软件中的一个已知网络漏洞，Equifax 使用它来构建其 Web\
  \ 应用程序。美国国土安全部美国计算机应急准备小组（`USCERT`）于 2017 年 3 月 8 日通知了 Equifax 等许多机构该漏洞的存在并需要修补该软件。尽管该公司通过电子邮件在内部传发了\
  \ `USCERT` 通知，并要求相关人员应用补丁，但补丁显然没有安装，或安装得不正确，一周后对系统的后续扫描未能发现该错误。良好的 `CyRM` 协议会定期检查那些警报。\n\
  \n董事会成员的第二条教训是，公司必须确保有适当的系统来升级有关潜在网络事件的信息。例如，总法律顾问是否有一套流程，在关键时间窗口内禁止对重大泄露有内部知情的人员对公司证券进行交易？在\
  \ Equifax 案例中，据披露在泄露在内部报告后、公众获知泄露之前，几位高管交易了公司的股票。这引发了对可能内幕交易以及内部控制缺失的质疑，而当时 Equifax\
  \ 已经面临严厉的公众审查。（这些高管随后已由 Equifax 内部负责分析泄露的特别委员会清除了违规责任。）\n\n\n\n\n\n## 第 3 Lesson：公共响应计划\n\
  \n第三点教训是，如果在任期内发生了灾难性的网络攻击，董事会必须制定好公共响应计划。`Equifax` 对该事件的公开处理几乎从所有角度受到了广泛批评。例如，许多人抱怨该公司在\
  \ 2017 年 7 月底获知泄露后，花费了整整一个月的时间才公开披露该事件。还有人嘲笑 `Equifax` 在在泄露发生后的立即，竟然将消费者引导至一个不安全的“伪造”网站，该网站模仿了\
  \ `Equifax` 为应对急于了解个人信息是否泄露的客户而建立的网站。也有人感叹，公司在泄露后似乎陷入了“公关模式”，犯了诸许多错误，例如向受影响的个人收取信用监控服务的费用而不是免费提供。随后，`Equifax`\
  \ 改而向受害者提供免费的信用监控服务，但迫使这些客户同意冗长的仲裁条款，从而限制了客户就相关服务对公司提起诉讼的能力。在公众抗议后，`Equifax` 放弃了该仲裁条款。\n\
  \n所有这些事件表明，`Equifax` 对于应对此类规模的披露后预见会产生的公众影响，准备不足。一个良好的 `CyRM℠` 计划应为任何意外做好准备。\n\n\
  ## 第 4 Lesson：披露策略与时机\n\n董事成员的第四点教训是，公司应该仔细考虑在何时以及如何披露泄露事件。`Equifax` 和 `Uber` 的网络事件披露为董事会在此方面工作提供了宝贵的指导。公司在评估何时以及披露什么内容时，不仅要考虑其法律披露义务，还要考虑公众舆论。与此类似，一些人指出，`SEC`\
  \ 对涉及其 `EDGAR` 数据库的网络事件进行公开披露，是在内部报告对该事件提出问题几个月后才完成的，这说明了对于任何行为者（包括负责监督基于披露行为的人员）来说，要在快速公开披露和彻底内部审查的竞争需求之间取得平衡是多么困难。`SEC`\
  \ 自身对网络攻击的不理想反应（以及随之延迟的网络披露）引发了人们对该机构未来将如何追究公司网络相关披露责任，以及如何在及时披露与严谨内部审查之间平衡竞争需求的疑问。\n\
  \n## 第 5 Lesson：第三方风险\n\n最后一点教训是，公司应该意识到当第三方处理公司敏感数据时所构成的风险。`Deloitte` 的事件提供了另一个数据点，并强化了这样一个观点：公司不仅必须关注自身的网络安全系统，还要关注第三方供应商和顾问（甚至可能是政府）的系统，当这些实体处理公司敏感数据时也是。\n\
  \n## 实施网络安全计划\n\n学习我上面列出的教训只是战斗的一半。一旦高管和董事成员理解了这些教训，在公司内部实施一个有效且动态的网络安全计划是至关重要的。以下考虑因素也将帮助董事测试网络安全计划的现状和有效性。\n\
  \n### 信托职责与法律格局\n\n作为首要原则，董事应该理解他们在网络安全方面的信托职责，以及指导公司的总体法律环境。除了业务和声誉风险外，网络安全的疏忽可能会给公司、管理层以及在某些情况下给董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管特定行业或类型的敏感信息。公司还必须意识到，联邦和州监管机构（如\
  \ `SEC`、`DOJ` 和 `FTC`）在执行其他非网络特定的法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须关注股东和消费者诉讼的风险，这些诉讼通常在网络安全事件披露后引发。如下文所述，公司总法务和内部网络人员应为董事会安排定期简报，以评估这些进展。\n\
  \n### 风险评估\n\n网络安全是许多行业中的“首要级”风险。如果董事会尚未这样做，他们应该投资进行正式简报，讨论公司面临面临的一系列现有网络安全风险，并根据这些风险权衡各种有助于保护公司最有价值资产机制的优缺点。\n\
  \n董事会应首先识别公司最有价值的资产，并评估这些资产可能如何被网络事件损害。对于某些公司来说，其最有价值的资产是客户的私人财务信息、个人身份信息或可能的健康记录。对于其他公司来说，可能是知识产权，或者可能是专利数据库，甚至是一批敏感电子邮件。任何网络安全计划都必须以保护这些最重要的公司资产为目标。\n\
  \n### 技术素养与监督\n\n董事应该对公司系统中可能发生的各种类型的网络泄露有基本的了解，并熟悉行业中常用的技术术语。公司常见的网络事件可能从 `malware`\
  \ 到 `phishing` 攻击，从未修补的软件漏洞到高级持续性威胁 (`APTs`)。此外，公司物理安全中的漏洞可能允许攻击者渗透公司的网络防御。\n\n\
  虽然董事并不一定负责研究网络攻击的技术机制或相应措施，但董事应该对这些概念有足够的熟悉，以便与管理层进行高效的讨论，并对公司的网络安全计划进行有效监督。在总结现有网络安全风险时，董事应密切关注其特定行业的趋势和影响类似规模公司的近期事件。特定类型的网络攻击在某些行业中出现频率较高，而在另一些行业则较少。例如，如果你是一家小型零售商，你最迫切的网络安全关注可能是销售点入侵，攻击者利用远程访问应用程序（通常由第三方供应商提供）的弱点来窃取客户的信用卡支付信息。另一方面，如果你是一家拥有广泛且易于接触物理基础设施（例如\
  \ `ATM` 机器）的大型金融机构，你可能会面临更广泛的网络漏洞，包括网络中单个节点遭受“盗刷”攻击的风险。\n\n### 威胁行为者\n\n董事还应该广泛地了解谁或哪些群体最可能针对公司，以及目的是什么。作为起点，`Verizon`\
  \ 的《2017 数据入侵调查报告》表明，大多数网络泄露是由外部威胁行为者造成的（75%），而较小比例是由内部人员（如员工或前员工）造成的（25%）。日益增长的入侵可以追溯到国家背景的行为者（18%），而较小比例涉及业务伙伴（2%）。\n\
  \n一旦董事对公司现有的网络威胁状况有了良好的掌握，就应该优先考虑降低实际网络泄露风险的策略。\n\n\n\n\n\n他或她还将为突发情况制定计划，并确保建立适当的响应框架以应对潜在的网络安全事件。这项工作将不可避免地涉及审查公司与网络安全相关的预算，以根据现有威胁和公司现有系统的稳健性来判断预算是否合理。（请记住，预防问题的成本比修复问题要低得多。）\n\
  \n一个关键的结论是，网络安全中没有进攻性策略——只有防御性策略。此外，你无法保护一切。即使是网络领域技术最先进的机构——国家安全局（NSA），也无法保护其最深层的秘密。因此，公司采取以下行动至关重要：（1)\
  \ 反思哪些公司资产最有价值；(2) 哪些系统最脆弱；(3) 根据这种权衡，考虑哪些可用机制和策略对业务至关重要且具有效益。\n\n在制定优秀的 CyRM℠ 计划方面，真正“懂行”的公司具有适应性文化。然而，大多数企业文化并不会迅速变化——它们是以缓慢的速度演变的。结果，许多组织的安全文化未能跟上其所处威胁格局的发展。\n\
  \n安全需要被定义为一种关键的推动因素，帮助公司履行对客户的承诺。它还需要被公司所有层级的员工视为基于`teamwork`（团队合作）而非`surveillance`（监控）的共同努力。\n\
  \n还要考虑公司的“高层基调”以及向员工传递有关网络安全实践的信息。鼓励高级管理层营造一个每个人对网络安全都有共同责任的环境。理想情况下，员工应该能与公司首席信息安全官（`CISO`）部门的人员建立直接沟通渠道，并理解他们可以联系该人员寻求判断和无忧的指导。\n\
  \n公司管理层投资网络安全相关的高质量员工培训也至关重要。现在，接受通用的安全意识培训被认为是一种最佳实践，这种培训可能很大程度上侧重或专门专注于网络安全。此外，培训不应是“一次性”的活动。`CISO`\
  \ 部门或 `GC` 应该通过电子邮件定期向员工提供有关网络安全最新进展以及他们应该注意的其他问题。这种持续的强化培养了真正的网络健康（CyberWellness）文化。\n\
  \n评估公司网络安全文化的一个良好起点，是审查公司关于使用和保护公司系统的书面及正式指南。例如，公司是否拥有关于员工使用个人邮箱处理公司业务的书面政策？该政策是如何实施和遵守的？董事会是否遵守相同的标准，还是存在例外？理想情况下，董事能够以身作则。要明白，作为董事，你可能是网络攻击特别有吸引力的目标，因为众，董事经常使用个人设备下载董事书籍并就敏感的非公开公司信息进行通信。\n\
  \n总而言之，一个优秀的 CyRM℠ 计划需要成为嵌入到公司日常运营和核心价值观中的战略重点。新的范式应该是：网络安全是一种持续的风险，需要组织中的每个人来管理。\n\
  \n当员工（贵公司员工或其他公司的员工）在这方面出现失误时，请将这些经验作为教科书式的案例，以便在公司的任何地方避免重犯错误。由于数据泄露往往会导致法律诉讼，董事会应将律师纳入讨论中，并确保他们改变企业文化的努力兼顾法律角的考量。在确保高层基调是诚信且有效合规后，董事会应转向战略考虑。\n\
  \n### 董事会监督与人事管理\n\n董事会应参与关键人员的选拔，例如 `CISO`。他们还应确保建立了适当的系统来监控这些人员的表现。在过去，公司通常将网络安全的责任委托给公司的首席运营官或首席技术官。考虑目前负责贵公司网络安全的主要负责人。那个人是\
  \ `C-suite` 级别的人吗？网络安全是否是该人员正在处理的许多紧迫需求之一？如果第一个问题的答案是“否”，第二个问题的答案是“是”，你可能希望考虑以 `CISO`\
  \ 的形式创建一个新职位。\n\n董事会还应考虑 `CISO`（或其他主要负责网络安全的军员）的内部汇报结构，以确保该人员拥有在该至关重要的角色中成功所需的独立性和权威。`CISO`\
  \ 可以向公司的首席信息官、首席风险官、首席运营官、首席技术官，甚至向首席执行官汇报——但在任何情况下，`CISO` 都应该能够根据需要接触高级管理层和董事会。公司管理层还应考虑建立由公司\
  \ `CISO` 主席的信息安全委员会，并邀请 `C-suite` 级管理人员参加委员会会议。董事们则应该了解谁担任了 `CISO` 职位，并在适当的情况下与该人员进行直接交流。\n\
  \n从董事会的角度来看，有效监督的关键是让高级管理层负责阐述和监控公司与网络安全相关的战略和风险承受能力。在大多数情况下，董事会成员应该关注公司的网络安全计划，但应避免过度干预其具体细节。\n\
  \n董事会可以且应该发挥关键作用的一个领域是制定公司与网络安全相关的战略计划。在完成这项初步工作后，董事会应监督公司管理层实施该战略计划。\n\n### 事件响应与框架\n\
  \n董事会还应与管理层合作制定一份网络事件“响应剧本”，规划出在发生泄露或影响公司系统的严重网络事件时，公司将如何应对各种突发情况。例如，在 Uber 丑闻之后，公司可能想要考虑如何处理赎金请求，在可能缓解与泄露相关的损害的优点与通过这种方式奖励犯罪行为的坏处之间进行权衡。任何此类分析都应该足够灵活，以考虑到当时的执法部门的建议，以及对公司披露义务的法律分析。为了避免\
  \ Equifax 那样的问题，公共响应计划应指定一个内部和外部专家团队进行调查并进行适当披露。\n\n公司管理层可以使用各种框架来制定与网络安全相关的风险管理策略。例如，2013\
  \ 年 10 月，美国商务部国家标准与技术研究所（`NIST`）发布了一套减少网络安全风险的自愿标准和最佳实践征求意见。最终版本于 2014 年 2 月发布，标题为《改进关键基础设施安全的框架》。\n\
  \n`NIST` 框架包含了五个“功能领域”，董事会在为公司制定整体网络安全计划时可以考虑这些功能。这些功能包括：\n\n- **识别 (Identify)**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。\n\
  - **保护 (Protect)**：开发并实施适当的安全措施，以确保关键基础设施服务的交付。\n- **检测 (Detect)**：开发并实施适当的活动，以识别网络事件的发生。\n\
  \n\n\n\n响应：制定并实施适当活动，以就检测到的网络安全事件采取行动。\n\n恢复：制定并实施适当活动，以维护韧性计划，并恢复任何因网络安全事件而损害的能力或服务。\n\
  \n美国证券交易委员会（SEC）的指南也为董事会提供了宝贵的帮助，考虑到该机构在市场中具有巨大的影响力。网络安全一直是 SEC 国家检查计划的优先级之重，该计划由合规检查与检查办公室（OCIE）监督。2017\
  \ 年 8 月，OCIE 发布了一份风险警报，强调了其“网络安全 2 号”倡议的结果。尽管该倡议仅针对经纪交易商、投资顾问和基金，但 OCIE 的发现为其他行业公司的董事提供了一个模板。\n\
  \n作为“网络安全 2 号”倡议的一部分，OCIE 评估了公司在以下领域管理其网络安全计划：\n\n1. 治理与风险评估\n2. 访问权限与控制\n3. 数据泄露防护\n\
  4. 供应商管理\n5. 培训\n6. 事件响应\n\n从广观角度来看，OCIE 发现，虽然公司在建立网络安全计划方面做得越来越多，但面对不断变化的网络威胁和攻击，它们在维护和更新这些计划方面做得不够。例如，OCIE\
  \ 指出，几乎所有公司都有应对访问事件的计划，例如拒绝服务事件和未经授权的入侵；然而，受调查的顾问和基金中不足二分三的似乎未能充分维护此类计划。\n\n###\
  \ 监控与董事会监督\n\n董事对公司网络安全努力的监控，应该像对机器进行持续维护一样。需要定期的检查和调整，而不是一次性的任务。用于实施和防止网络攻击的技术手段将不断演变。此外，随着公司转向不同的操作系统或扩大其业务组合，旧的战术和系统可能被认为是无关或不足的。\n\
  \n因此，董事会至少在季度会议上对公司的网络安全计划进行常态审查是明智的。如果出现新的、严重的问题，还应有一套程序以便更频繁地向董事会简报。公司的董事会议记录应准确反映在这些会议上讨论网络安全的时间，以便董事会的尽职调查能够记录并得到证明。\n\
  \n董事会还应定期接收网络安全计分卡，突出公司在减轻网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡不需要包含高度技术性的关键绩效指标才能发挥作用。相反，适用于董事会的良好指标示例包括：\n\
  - 客户满意度（由信息安全事件导致的客户系统停机时间）\n- 声誉（媒体中报道的信息安全事件数量）\n- 财务状况（信息安全预算占 IT 预算的百分比）\n\n\
  ### 数据收集与分析\n\n作为一项重要原则，董事会应确保管理层和公司员工收集、分析并分享有关网络安全事件（无论大小）的数据，以帮助了解持续网络安全努力的有效性。公司还应优先收集、分析并共享内部可能从政府、私营或非营利组织获取的任何关于网络漏洞和可能泄露风险的信息。\n\
  \n### 事件升级与人为错误\n\n在 Equifax 事件之后，所有公司都认真审视其信息升级协议是非常关重要的。当可能的网络事件首次被公司察觉时，谁会收到通知？通常，初级员工最适合观察网络泄露的第一迹象。在安装关键软件补丁时（例如\
  \ Equifax 案例那样），要确保有系统进行适当的监督和同行评审，以免一个个人的人为失误导致灾难性的（且可预防的）泄露。\n\n### 从错误中学习\n\n\
  董事会还应确保公司有一套系统，鼓励员工和管理层从过去的错误中学习。承认错误并从中学习可以做出更好的决策。在关于公司安全模型和脆弱性的简报中，应鼓励进行网络安全事后分析。\n\
  \n当错误发生时，这也是一个咨询律师的好时机。某些错误伴随着法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及任何由此产生的政策，都包含必要的法律应对措施。\n\
  \n### 披露义务与法规\n\n越来越多的越来越多的上市公司在每年的财务披露中将网络安全描述为一种风险。但要披露什么以及何时披露，对许多人来说仍然是一个棘手的问题。Equifax\
  \ 因为等到 9 月才披露其在 7 月底发现的泄露而受到严厉批评。但公司和监管机构都意识到，在尽早披露与等待了解所有性事实以避免做出误导性或不准确的披露之间存在着巨大的紧张关系。\n\
  \nSEC 本身也因在处理 `EDGAR` 数据泄露时被认为失误而受到批评。SEC 最初报告称没有个人身份信息被获取；后来又不得不修正那些声明。此外，泄露发生在\
  \ 2016 年，但在 2017 年 9 月才向公众报告。\n\n对于公司建立适当的升级协议至关重要。不要在等待泄露报告缓慢地层层上报给决策者而浪费宝贵的时间。相反，在实质性泄露和披露之间的任何时候，都应该花在调查事实和分析问题上。\n\
  \nSEC 在该领域提供了一些指导。2011 年，SEC 的公司财务部（`Division of Corporation Finance`）针对上市公司发布了关于与网络威胁和不利网络事件相关的披露义务的指南。该指南建议，如果为了使其他披露不具有误导性，应当披露有关网络风险和不利网络事件的事实信息。特别是，公司应该根据之前网络事件的严重性和频率来审查其网络风险。公司还应该根据其特定行业存在的风险，考虑其网络防御的充分性。公司应避免泛泛的风险因素披露，而应考虑其独特事实和情况。例如，如果公司\
  \ `已经` 经历了某种威胁，那么披露该威胁 `可能` 发生是不够的。公司还应考虑，如果与网络风险或事件相关的成本或后果可能对公司的财务状况产生重大影响，应在其定期文件的管理讨论与分析（`MD&A`）部分中包含对网络风险和事件的讨论。\n\
  \n尽管 SEC 尚未采取行动，其他监管机构已经开始积极执行网络相关的披露义务。例如，2017 年 8 月，Uber 与联邦贸易委员会（`FTC`）就 2014\
  \ 年的泄露提出的指控达成和解。FTC 指控该公司在努力保护客户信息方面做出了欺骗性陈述，并未能采取“合理的、低成本措施”来防止未经访问客户个人数据。与此同时，FTC\
  \ 已确认正在审查 Uber 对 2016 年泄露的反应，该事件最近才被披露。\n\n\n\n\n\n联邦贸易委员会（FTC）此前还曾甲骨文（Oracle）的披露问题提起诉讼，指控该公司未告知消费者，新的软件更新不会自动删除旧版本（且可能被利用的）Oracle\
  \ Java 软件。去年，消费者金融保护局（CFPB）命令运营在线支付系统的 Dwolla Inc. 支付罚款并改进其安全实践，此前该公司被指控向消费者假称其网络是“安全”且“可靠”的，并称其数据安全实践“超过”或“优于”了行业安全标准。\n\
  \n此外，尽管目前还没有国家级的“数据泄露通知”法，但大多数州已经颁布法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全漏洞时，实体必须通知受影响个人。\n\
  \nUber 可能是延迟披露和“不应做之事”最极端的例子。该公司在近一年的时间没有通知监管机构和受泄露影响的个人，这可能违反了州通知法。此外，据报道，Uber\
  \ 将不泄露漏洞事件作为向网络犯罪分子支付赎金的条件，这进一步加剧了掩盖真相的形象。多个州的总检察长已经对该漏洞事件发起了调查。\n\n### 核心要点\n\n\
  核心要点是，公司必须持续审查其网络披露的充分性和及时性。这没有“一刀切”的标准答案。经验丰富的披露法律顾问提供的建议至关重要。\n\n如果最近的事件教给了我们什么的话，那就是如果公司未能确保第三方服务提供商也实施充分的网络风险管理系统，那么公司的网络安全协议将化为乌有。很多时候，网络犯罪者的切入点是拥有公司系统权限或非公开数据的第三方。\n\
  \n### 第三方风险案例研究\n\n例如，家得宝（Home Depot）至今仍受到 2014 年一次网络事件的影响，在那次事件中，黑客利用第三方支付处理商的安全漏洞，盗取了超过\
  \ 5000 万名家得宝客户的电子邮件和支付信息。同样，黑客在 2013 年利用第三方供应商访问了 Target 的客户数据库，并盗取了约 4000 万客户的支付信息。\n\
  \n德勤（Deloitte）的案例说明了为什么公司在涉及第三方网络风险时，应特别关注专业服务公司。专业服务公司——如律事务所、审计机构和咨询公司——特别容易受到，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，而这些信息都集中在一个方便网络犯罪者利用的地方。专业服务公司所拥的信息对网络犯罪者来说是一个非常有吸引力的目标，因为通过非法交易相对容易变现。此类信息也可能是黑客活动者（hacktivists）关注的目标。\n\
  \n2016 年的“巴拿马文件”丑闻是首批揭露律事务所网络漏洞的重大事件之一。受影响的 Mossack Fonseca 公司曾帮助数百名美国客户建立海外业务。黑客入侵获取了\
  \ Mossack Fonseca 高知名客户的敏感信息，时间追溯到 1970 年代，并让许多与该公司合作过的公司暴露在风险之中。我们在“乐天堂文件”丑闻中也看到了类似的态势发展，该丑闻涉及\
  \ Appleby 律事务所泄露机密客户信息。\n\n### 风险管理策略\n\n由于第三方通常可以访问高度敏感的公司信息，因此在公司聘用他们之前，应对其进行严谨的第三方网络风险评估。董事不需要了解每一项服务合同的细节，但他们应该确保公司有一份书面的供应商风险管理政策，以处理第三方对公司系统和敏感非公开数据的访问。至少，该政策应确保管理层进行了适当的尽职调查，并意识到与特定供应商交易的风险。公司还应定期重新评估第三方风险，并确保第三方服务提供商确实履行了其义务。\n\
  \n董事会应意识到向政府提供敏感非公开信息相关的风险。`SEC` 的 `EDGAR` 数据库泄露引发了人们的严重关注，即市场监管机构应该持有多少敏感公司数据，以及由于资源有限，政府是否能够保护此类数据。在可能的情况下，公司应考虑通过加密物理介质提供信息，而不是通过安全文件传输。\n\
  \n网络安全不是一个等待待解决的问题——它是一项需要持续管理的风险，并在审慎的情况下进行风险转嫁。作为公司风险管理工作的一部分，其董事会应仔细审查与第三方供应商的现有合同和保险政策。这些协议必须明确在发生泄露时由谁承担责任以及涵盖的范围是什么。\n\
  \n### 网络保险\n\n尽管网络保险仍处于起步阶段，缺乏精算数据，但它是美国公司增长最快的保障类型之一——而且不无理由。与网络攻击相关的成本可能会对公司产生根本性的影响。Ponemon\
  \ 研究所（Ponemon Institute）最近的一项研究显示，全球数据泄露的平均成本为 362 万美元。大规模网络攻击的受害者可以预期在该数字基础上增加几个零，因为声誉损害、通知成本和长期的诉讼费用会迅速累积。\n\
  \nTarget 公司在今年早些时候向 `SEC` 提交的年度报告中报告，其与 2013 年系统数据泄露相关的累计支出已达 2.92 亿美元，该事件导致了客户信用卡信息被大规模盗取。\n\
  \n根据该公司说法，这一总金额部分被 900 万美元的保险赔付所抵消。同样，2017 年，FedEx 的荷兰子公司遭到了“NotPetya”病毒的袭击，导致公司运营临时中断，并导致季度利润损失了\
  \ 3 亿美元。FedEx 当时没有针对该攻击的保险覆盖，FedEx 的首席财务官此后透露，该事件引发了公司对未来是否应该购买网络保险的内部评估。\n\n除了保险理赔这一显性的潜在益处外，寻求网络保险可能为公司带来间接利益。处于网络保险市场的公司将有动力采用最佳实践，因为保费至少在程度上取决于公司对保护措施的有效利用。仅申请过程就可能要求公司对其现有的网络计划进行深度评估。通过这一过程，公司可能会对自身的网络风险和机会有更好的认识。董事会还应意识到，如果需要，保险公司通常会提供工具来帮助公司应对网络安全事件并减轻泄露后的损失。\n\
  \n\n\n\n董事会通常对公司是否应该购买网络安全保险拥有最终决定权。作为董事会做出这一决策可能需要应对一些新领域。你必须确定哪些是已经（以及应该）被涵盖的范围，哪些是未涵盖（且不需要）涵盖的范围。你还需要确定特定的保费是否合理。董事会应该问的一个问题是现有的保险保单是否可以涵盖某些事件。传统上，大多数商业综合责任（`CGL`）保单不包含网络安全“免责条款”；但如今，保险公司更有可能在保单中加入此类条款。董事应确保在保障范围内没有关键漏洞，并根据公司自身的风险状况考虑哪些保障范围最合理——例如，保障选项可能包括数据泄露成本；勒索；取证分析；盗窃；诉讼成本和费用；以及业务中断等。董事会还应确认其董事和高管（`D&O`）保单涵盖了与网络安全相关的事件。\n\
  \n网络安全领域没有任何停滞不变的。黑客攻击在不断演变，上个月还是行业标准的防御措施下个月可能就过时了。立法者和监管机构也努力跟上新法律法规的步伐，这在很大程度上受到受关注泄露事件后公众愤怒的推动。例如，纽约州对\
  \ Equifax 泄露事件做出了反应，提议监管以扩大该州首创的网络安全规则，该规则目前要求纽约所有金融机构必须在州注册并实施保护消费者数据的计划等。新规将将这些要求扩展到信用报告机构。纽约州总长还提议了新立法，以修订该州现有的数据泄露通知法。值得注意的是，拟议的立法将扩大对“私人信息”的定义，并适用于任何持有纽约州居民私人信息的实体，即使该实体未在该州内开展常规业务。\n\
  \n治理网络安全的不断变化的法律格局本身可能被视为公司的网络“漏洞”。董事会需要意识到公司的合规义务，但这说起来易做起来难。如今的公司运行在碎片化的网络安全监管体系中。州、联邦和外国监管机构都有自己的规则和指导。加州和纽约州等州近年来采取了特别激进的手段，在其管辖范围内监管并执行网络安全标准。在联邦层面，`FTC`和`SEC`等机构在其各自指定的重点领域和指导范围内处于网络安全执法的前沿。欧盟方面则实施了《通用数据保护条例》，该条例对从欧盟公民那里收集信用卡数据或其他个人信息的公司实施了报告和其他要求。\n\
  \n董事会应确保其公司继续遵守最新的网络安全州和联邦法律法规。这对于某些经常成为网络罪分子攻击目标的特定行业公司（例如金融机构），以及那些处理敏感个人信息（如个人身份识别信息、财务信息或受保护的健康信息）的公司来说尤其如此，因为这些公司经常受到监管机构和立法者的审查。董事会显而易见的第一步可能是要求总法律顾问和`CISO`定期向董事会简报立法进展并提供他们的建议。随着许多律师事务所扩大其数据隐私和网络安全业务，公司也可以借鉴外部法律顾问的专业知识，根据公司的需求开发个性化的计划来管理网络安全风险。\n\
  \n董事会还可以成为对抗“合规疲劳”的宝贵武器，在这种疲劳中，执行日常合规工作的人员在应对迥异的日常需求和多个移动目标时，会失去大局观。“勾选框”很重要，但这是不够的。凭借其高层次视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施方面进行批判性和创新性思考方面发挥重要作用。最后，董事会应该尝试确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规。\n\
  \n## 第二支柱 CyberWellness℠\n\n# 第 6 章 CyberWellness℠\n\n## 全公司方法\n\n中心控制与员工和客户的每一次连接是不可能的——因此，需要一种新范式。公司的`CyRM℠`计划不仅需要涵盖整个公司，还需要涵盖每位员工。公司中的每个人都要对他们承担的风险负责。这需要一个活跃的过程——就像身体健康计划一样，公司采取积极措施来促进和维护员工的健康。`CyberWellness℠`\
  \ 也是如此：需要在网络防御、响应和治理的多个维度上做出主动选择。\n\n正如你在之前的章节中看到的那样，传统的网络安全方法依赖于预防策略。这种过时的方法假设公司\
  \ IT 系统周围环绕着一层坚固的外壳。它错误地假设网络安全事件是例外——即对坚固外壳的罕见穿透——而不是频繁、持续且不断更具创意的针对数据破解的尝试。良好的\
  \ `CyRM℠` 计划会说：老办法已经够了，是时候实践全面的 `CyberWellness℠` 了。\n\n有效 `CyberWellness℠` 的关键在于公司评估、衡量、监控和控制风险的能力。大多数公司通常关注泄露事件，这实际上只是评估方面。他们需要扩大关注范围，开发新的措施（如网络风险容忍度），开发创新的监控技术作为关键性能指标，为员工提供网络安全培训，并实施整合到更新政策和程序中的更好的网络控制。\n\
  \n为了继续这个健康类比，请考虑近年来，我们看到公共卫生系统试图从被动模式转为主动模式——关注预防疾病，而不仅仅是在疾病爆发发生时才做出反应。（COVID-19\
  \ 大流行加深了我们的理解，即仅仅处于被动状态并不有效！）\n\n与将事件视为罕见例外相反，一种情报驱动的心态假设公司已经被攻破，因此需要不断演进以保持领先。例如，在我山坡上的房子里，我有多层安全。院子周围有一圈铁艺栅栏、写有“内恶犬”和“受事报报警系统保护”的牌子、光敏型泛光灯、连接到每扇门和窗户的报警系统、一个隐藏在视线之外的防火保险箱，以及床边的恐慌按钮。我的目标是用我的栅栏、泛光灯和栅栏上的牌子来威慑坏人。但如果他们仍然决定闯入，那么我有多层防御：门、窗和窗帘的报警器、如果坏人设法设在不触发外部报警的情况下进入的内部红外束、恐慌按钮、一只叫声很大的大狗以及隐藏的保险箱。仅仅依靠外部安全措施是不够的。你可能认为这过分，但当你成为风险管理专家时，你知道防患胜于治疗。\n\
  \n\n\n\n\n我的家庭安全方法——一种动态 CyRM℠ 程序的模拟版本——之所以成功，是因为它是全面的。考虑防范网络攻击的一种方法被称为“深度防御（Defense\
  \ in Depth）”。这种方法模仿了传统的军事战略。“深度防御”策略并非将所有资源集中在前线，而是将防御者部署在一系列预先计划的位置上——即一系列层级——从这些位置他们可以占据优势并进攻推进的敌人。转化到网络安全领域，“深度防御”策略使用多种安全技术和产品来缓解单个组件失效的风险。“深度防御”还能减缓攻击者的速度，并赢得修复问题的时间。\n\
  \n当连环银行劫犯威利·萨顿被问及为什么觉得必须去抢劫金融机构时，他回答说：“那里有钱。”网络犯罪分子也是如此。你的公司需要决定哪些数据最有价值，然后投入相应的资金进行保护。例如，机密客户信息（如社会安全号码）可能是最关键的，应该受到最严格的保护。如果是如此，请将网络安全预算的大部分分配给客户信息保护。\n\
  \n在考虑保护客户数据时，请记住，这不再仅仅是数据被盗的问题——还要担心数据可能被篡改导致其无法使用或错误。这是分子在公司眼皮底下会做的事情，而且可能需要很长时间才能发现！因此，你的公司制定最有效的策略或多种策略来保护重要数据至关重要。一旦你确定了需要保护内容的关键性，就可以优先排序并分配资源，以避免和缓解网络安全威胁。那时，你就可以判断你的网络安全预算是否合适。\n\
  \n此外，全面掌握其他风险缓解项目（如保险）的条款条件也是重要的，并相应地了解保险和其他风险缓解措施在什么情况下不会有效。例如，你的公司是客户的信赖顾问。如果你的公司遭受了网络攻击，并因此丢失了顶级客户的高度私密财务数据，这对你公司声誉的打击可能足以让你的公司倒闭。\n\
  \n聪明的公司理解，CyberWellness℠ 不是一个需要解决的技术问题，而是一项需要持续管理的持续风险。网络安全是无法保证的，但及时恰当的反应是可以做到的。考虑到这一点，让我们考虑防范黑客攻击的最佳方法。\n\
  \n## 应急响应计划\n\n你的公司应该制定兼顾公共关系和法律问题的应急响应计划。应急响应计划有助于识别、响应并从网络安全安全中中恢复。应急响应计划的目标是防止服务中断、数据丢失或被窃等损害，并防止对组织系统的非法访问。\n\
  \n如果没有能够执行该计划的团队，应急响应计划就是完整的。团队成员是事件的负责人——他们负责与内部伙伴以及外部人员（如法律顾问、媒体、执法部门、客户和其他利益相关者）进行沟通。为了让应急响应团队有效，他们需要高层的支持、持续的测试以及清晰的通信渠道。团队需要制定一个响应计划，为这些每个步骤提供结构化的流程：\n\
  \n*   **准备：** 进行风险评估并对安全问题进行排序。识别哪些是最敏感的资产，并借此确定团队应该关注的哪些关键安全事件以控制问题。创建通信计划并准备相关文档，清晰、简要地概述角色、职责和流程。\n\
  *   **识别：** 当发现潜在的事件时，团队应立即收集额外证据，决定事件的类型和严重程度，并记录他们正在做的一切。\n*   **遏制：** 一旦团队识别出安全事件，首要目标是遏制事件并防止进一步损害。\n\
  *   **根：** 团队必须识别攻击的根源，并采取措施防止未来发生类似事件。例如，如果漏洞被利用，应立即进行补丁。\n*   **恢复：** 团队应该仔细地让受影响的生产系统重新上线，确保不再发生其他事件，然后测试并验证受影响的系统已恢复正常。\n\
  *   **经验总结：** 进一步调查事件以识别其是否可能再次发生，然后采取必要措施确保其不再发生。\n\n## 渗透测试\n\n健康的 CyberWellness℠\
  \ 计划还会进行`penetration testing`——也称为渗透测试（或称 pen testing）。渗透测试从恶意攻击者和丰富的网络安全专家的视角审视你的网络、应用程序、设备和物理安全，以发现弱点并识别你的安全态势需要改进的领域。渗透测试不仅限于发现犯罪分子可能获取未经授权的敏感数据、甚至为了恶意目的接管你系统的方法。它还模拟真实的攻击，以确定你的防御表现如何，以及可能的泄露规模。此类评估（可能由独立的第三方执行）可以让你洞察组织的整体网络弹性韧性，而这是一个不断演进的目标。\n\
  \n渗透测试不仅关乎哪里错了。它还关乎识别合适的权衡——因为你无法保护一切。全面的渗透测试考虑几个领域：应用程序、网络（包括无线）、弱密码和协议，以及物理屏障（如传感器和摄像头）。\n\
  \n就像你去医疗保健机构进行年度体检一样，聘请经过高度训练的安全顾问来执行你的安全测试也是有意义的。虽然你可能认为自己完全健康，但医生可以进行测试来检测你未意识到的危险。同样，那些制定、维护和监控你安全计划的人可能不具备识别安全缺陷所需的客观性，无法理解你组织的风险水平，也无法帮助解决和修复关键问题。用比喻（隐喻）来说，在这场持续的猫鼠游戏中，你应该明智地经常咨询客观的外部猫，因为老鼠既敏捷又狡猾——一直在学习，一直在演进，发明偷取你奶酪的新方法。\n\
  \n## 桌面演练\n\n\n\n\n网络韧性的一个重要组成部分是聘请外部专家和公司加入，以支持对任何数据泄露做出果断、有效的响应。泄露发生后的环境并非寻找所需专业知识或谈判合同条款的时机，因此拥有一支外部专家团队可以加速恢复和业务复运行。这些外部专家应精通法证、法律、公关传播和系统修复等领域。在事件发生之前，你还应该预先考虑与执法部门（如\
  \ `FBI` 等机构）的应对方案。\n\n重复我的话：网络安全无法被保证，但及时且恰当的反应可以。\n\n## 建立有效的治理\n\n公司需要一个有效的治理结构，以确保员工以及所有与你合作的人员都能进行准确、及时的评估，以识别当前和新兴的漏洞。最好使用外部专业人士来审查你的治理结构。让具备适当技术技能并了解当前风险环境的专业人士参与进来至关重要。精通网络世界的技术导向型专家将是一个不可或缺的资源。\n\
  \n## 持续的员工培训与发展\n\n研究表明，三分之二的成功网络攻击直接归因于员工的行为（或不作为）。公司必须确保员工理解网络威胁的多样性及其不断变化的特质。他们需要知道自己的行为如何帮助保护公司资产。因此，提高员工对风险暴露的意识对于加强你组织的整体网络韧性至关重要。任何对员工意识的可衡量改进——通过游戏化倡议和具操作性的持续培训等措施——都会对你组织保护和响应网络事件的能力产生巨大的增益。\n\
  \n遗憾的是，大多数员工对自己的个人数字安全并不感兴趣，更不用说公司的安全了。从历史上看，任何与 IT 安全有关的事情都被 IT 团队隔离开用户之外。那么，用户对公司的网络安全几乎没有兴趣，这有什么奇怪呢？消除这种冷淡是困难的。改变组织的企业文化以加强网络安全是非常的。这需要向\
  \ `CyberWellness℠` 进行范式转变，以跟上不断演变的网络威胁。\n\n如果你思考一下，用户和员工应该是数据安全的前线。毕竟，他们是创建和处理信息的人。他们处于理解信息价值的最佳位置。高层管理应该实施与用户和员工产生互动（`engage`）的培训和问责计划。现代基于游戏的培训——辅以后续监控以观察用户和员工如何应用培训——可以将公司的文化转变为网络安全是每个人的责任。培养和经营一个持续的学习环境至关重要——包括相关的、令人记忆深刻的培训和工具，以支持强大的网络卫生，从密码协议到反钓鱼活动再到“自带设备”策略。\n\
  \n此外，你必须创建一个安全的环境，鼓励各层级的用户和员工指出弱点和漏洞，而不必担心“打信者死”。当用户和员工识别出未缓解的风险或新兴威胁时，他们需要知道自己得到了认可和奖励。你希望他们带给你“坏消息”，因为如果你不知道漏洞的存在，你就无法防止或修复它们。一种健康的\
  \ `CyberWellness℠` 文化会赞扬并感谢这些信者——而不是杀死他们。\n\n## 为所有第三方供应商和供应商实施管理流程\n\n第三方对运营环境可以产生积极影响。然而，公司对第三方网络安全风险的关注程度通常不如对自身业务的关注。他们应该如此！第三方可能会产生与公司员工相同的负面长期影响。请考虑，你公司与其供应商之间的数据共享和通信不再完全受公司内部运营的控制。供应商和供应商是外部实体，为公司的技术环境创建了新的进入点，增加了运营环境的复杂性和潜在的波动。\n\
  \n以下是任何健康的第三方计划的一些基本规则：\n\n*   根据对组织的风险（包括网络风险）对第三方暴露进行优先级排序。\n*   为任何新关系的建立建立的评估工具。\n\
  *   实施持续的、基于风险的监控流程，以评估对合同条款的遵守情况，并与主要服务商进行联合灾难恢复测试。\n\n法律和其他实际考虑因素可以（也应该）用于划分和缓解通过第三方关系引入的风险。风险——无论源自何处——在危机或压力时期都会回到你的公司。客户和顾客（无论是企业还是个人）在问题发生时总是向你的公司寻求解释和帮助。尝试向一个社会安全号码泄露的人解释，问题源于一个\
  \ `B2B` 供应商。\n\n## 退后一步\n\n虽然我提到了你的公司为了建立健康且具韧性的网络安全计划需要采取的几个不同步骤，但我想要重申，对公司的网络安全计划感到相当安全，不仅仅是能够回答这样的问题：“我们的组织是否拥有正确的治理结构？”相反，它是能够回答更大的问题，例如：“我们思考安全的方式是否正确，这一切将向何处发展？”通过主动采取\
  \ `CyberWellness℠` 方案，你将确保自己、你的客户和员工尽可能安全。\n\n# 7 培养强大的文化以增强网络安全\n\n我们都知道企业文化不会改变得很快——它们是迁徙的。大多数组织发展专家为文化改变提供相同的配方：\n\
  \n1.  选择正确的领导者。\n2.  识别并奖励你想要鼓励的行为。\n3.  传达清晰的价值观。\n4.  提供大量的培训。\n\n这个配方对于网络安全这个不断演变、变幻莫测、不断移动的目标是不起作用的。大多数员工对自己的数字安全并不感兴趣，更不用说公司的。因此，改变公司的文化以加强安全是特别困难的，需要范式转变以跟上威胁格局的演。\n\
  \n大多数人将安全视为对公司数字环境的保护——一个虚拟的硬外壳，由守护公司网络、服务器和应用程序的安全措施来保护。这种范式的问题在于，当你关注环境时，所采用的安全措施就变成了一个目的，而与它试图保护的数据没有直接关系。\n\
  \n例如，假设一家公司正试图防御数据泄露或数据的未经授权使用。从安全的角度来看，如果数据本身不是易于读取的，并且根据授权访问人员及其所处的业务背景可以被追踪，难道不是好得多？\n\
  \n此外，这种方法通过公司作为“深度防御”策略的一部分而实施的多层防御层依然有效。\n\n\n\n\n# 数据保护\n\n当我们将焦点从 IT 基础设施转移到需要保护的数据时，第一步是定义哪些是关键数据。一旦定义，你就可以使用新的、经过验证的解决方案来控制数据的处理和分发。\n\
  \n例如，加密可以帮助确保数据在静态存储或动态传输过程中都是安全的。但它并不是万无一失的，因为一旦网络攻击者利用窃取的的用户凭据侵入网络，加密就会变得无用武处。\n\
  \n数据掩码（隐藏特定数据的过程）是另一个实用的工具。数据掩码可以通过多种方式实现：用户执行请求时动态地模糊数据；通过复制数据来消除需要隐藏的数据子集；或者仅仅对用户或第三方对数据进行掩码。\n\
  \n控制数据的另一种方法是使用数据泄露防护（DLP）解决方案，它可以提供有关敏感数据移动的准确信息——在在未授权终端上发现数据时，甚至阻止其传输或删除。使用 `DLP`\
  \ 解决方案对数据进行持续监控可以及时识别泄露并限制造成的损害。这种以数据为中心的安全策略、关注数据安全性的范式转变，将改变你的企业文化。以下是你可以这样做。\n\
  \n## 让用户参与进来\n\n从历史上看，任何与 IT 安全有关的事情都被 IT 团队隔在用户之外。难怪用户对公司的安全性表现出毫无兴趣或完全不感兴趣。\n\n\
  事实上，用户是数据安全的前线。他们创建并处理数据，最能理解数据的价值。例如：安联爱尔兰（Allianz Ireland）强制用户在共享文档或发送电子邮件之前选择数据分类。该公司在短短几个月内经历了快速的文化转变，结果导致员工对数据安全实践的意识提升了\
  \ 60%，数据泄露事件减少了 89%。\n\n## 让员工参与到应用中\n\n如今的网络安全风险培训侧重于钓鱼计划，而不是保护数据。大多数培训计划都不吸引人、没意思也不有趣。它们试图用模糊的“是/否”问题进行教学，而且通常\
  \ 80% 的问题答案都是“是”。只要回答了所有问题，没有人会不及格。无聊了！现在假设网络安全培训是一个视频游戏，你正在有趣地扮演一个坏人，他偷了有效的用户凭据，现在正试图偷取公司数据。你根据成功窃取数据的程度获得积分。\n\
  \n这种游戏具有很高的参与性，在课程结束时，你会获得一个分数，如果分数足够高，还可以获得奖励。更好的是，公司现在有了有效数据来确定员工的网络意识——这些信息可以用于帮助购买网络保险。\n\
  \n## 让多样性成为安全文化的一部分\n\n自我意识和自觉是改变任何不理想行为或态度的第一步。员工与安全相关的决策受到他们的多样性、背景、对讨论问题的开放程度以及对社区态度的影响。但海报、屏幕保护程序，甚至是面对面的小组评审，也几乎无法影响你的员工判断威胁的能力。\n\
  \n假设发生了数据泄露，并将其作为每个人的学习经验。与其仅仅制作一个 PowerPoint，为什么不\n\n## 网络安全作为一种业务战略\n\n## 信任将成为竞争优势\n\
  \n当我开始在花旗银行（Citicorp）工作时，生意是通过握手达成的；你的话被视为信誉。现在许多调查显示，人与人、企业与机构之间的信任已经下降。位列顶首的是大规模网络攻击和破坏信任的社交媒体的发展。列表中还包括导致人们无法进入房屋的技术故障。在我们节奏快速、匿名的数字世界里，公司的产品信息随处可见。正如一位客户服务专家所说，“客户是连接且危险的。”坏消息的传播比以前任何时候都快。“与众”越来越不再是一种竞争优势。相反，客户对你公司的信任是新的领域通货。\n\
  \n有一个信任失败令我记忆犹新。当三星 Galaxy Note 7 在 2016 年 8 月首次进入测评周期时，共识是“它可能是有史以来设计最好的智能手机”。那是第一部手机爆炸之前，因为电池倾向于同时燃烧。发布一个月后，已有报告称至少\
  \ 35 台手机起火。三星发布了一份谦逊且道歉的声明，宣布它将召回 Note 7 并提供更换设备。好吧，但那些更换设备也开始起火，其中至少有一个在飞机上。美国运输安全管理局（TSA）禁止了所有的\
  \ Note 7。如果你在那个秋天旅行过，可能还记得。最终，三星召回了所有手机，并发送了软件更新，使现有设备变得无用。公司最终决定对其爆炸的手机负责，并通过更换不同型号来补偿，这可能挽救了公司的声誉。瑞信集团的分析师估计，这些损失让三星花费了整整\
  \ 170 亿美元。这还没提到他们失去的消费者信任。\n\n同样重要——也许更重要——信任包含了保护个人数据。为了获得业务，每家公司都必须通过真正可靠来赢得客户的信任。客户会问：“我可以相信网络安全是首要任务，我的交易、信息和个人数据是准确、安全且私密的吗？”\n\
  \n未来，信任将变得越来越重要。今天我们生活在一个平台时代。我们有 Airbnb 和 eBay 这样的信任平台，它们本质上是鼓励陌生人进行交易的低风险环境。我们还有像\
  \ Netflix 和 iTunes 这样的进一步信任平台。如果你尝试从 iTunes 购买已经买过的专辑，iTunes 会提醒你已经拥有它。Amazon 也是如此。Amazon\
  \ 推出了一个价格检查应用程序，你的手机可以扫描任何零售商店任何产品的条码，将其与 Amazon 的价格进行比较，如果你从 Amazon 购买商品，它会给你折扣。\n\
  \n\n\n\n客户不仅可以即时获取定价信息和最强竞争对手的信息，而且游戏规则也将发生改变。客户将关注他们与所购商品供应商（如亚马逊）之间的关系，而不是产品制造商。在透明化时代，加之权力向消费者的转移，要求公司必须更加关注信任，并将其转化为一种竞争优势。信任将定义公司与其各种利益相关者之间关系的质量和可持续性。\n\
  \n但信任并不仅仅关乎消费者。员工的信任对于培养推动业务结果的高水平协作至关重要。员工会问道：“我是否可以信任我的工作相关数据是安全且私密的？网络能够正常运行吗？是否采取了网络安全措施？”在新的虚拟世界中，这将变得日益重要，因为在这个世界里，管理远程团队需要额外的努力，才能让员工在离开总部时感到被重视。在我们互联互通的业务环境中，信任定义了公司与供应商之间的关系。随着数据和系统被广泛共享，有效的数据管理将成为帮助客户赢得客户支持的重要差异化因素。\n\
  \n以往的交易和直接关系将让位于问责制，以及业务合作伙伴的治理和合规流程与自身保持一致的更大保证。维护信任将建立共同的价值观并创造真正的竞争优势。\n\nTarget\
  \ 进军市场的尝试是一个关于供应链管理不当的教训，也说明了不如何进入新市场。这家美国零售商曾试图同时在该国开设 124 家商店和三个大型分发中心。他们使用了一个显然有故障的计算机辅助订单系统，导致仓库货物积压，而商店货架却空空如。。蒙特利尔物流供应链咨询公司\
  \ `MWPVL International Inc.` 总裁 Marc Wulfraat 指出，Target “完全失去了对库存的控制”，如果它最初以较少的门店进入加拿大，并能够先测试其分发网络，这种情况就不会发生。该公司在\
  \ 2020 年 2 月宣布，其在“白色北方”的艰辛让公司损失了 10 亿美元。\n\n我们从 COVID-19 疫情中看到，信任已经扩展到生态系统伙伴。公司会问：“我是否可以信任正在采取措施来保护我的专有信息并确保交易的完整性？在业务互动日益虚拟化的情况下，服务水平是否能够维持？”更进一步，受信任的公司将试图平衡所有利益相关者的信任。哈佛商学院教授\
  \ Sandra Sucher 指出，“受信任的公司知道如何平衡所有利益相关者的信任。”在疫情期间的一个例子是，一家需要裁减员工的全球酒店度假村连锁，将其停工团队与其他短期内需要帮助的公司联系起来，以应对激增的需求。\n\
  \n# 9 CyRM℠ 作为关键的业务战略\n\n当今的商业世界变得越来越互联互通。新的威胁每天都在出现——不仅来自恶意行为者，还来自由于攻击面扩大和通信增强而产生的漏洞。今天，员工可以很容易从他们的手机或健身手表上被追踪。他们的笔记本电脑可以被黑客攻击，汽车、手表、电视甚至助听器也是如此！更强大的互联网连接性正在不断扩大攻击面。从办公室的灯泡到家中的报警系统，再到家电、飞机和起搏器，一切都是漏洞。\n\
  \n数字通信在不断增加功能和控制的同时，也创造了新的漏洞。例如，考虑到你的 `E-ZPass` 可能被执法部门用于开超速单。\n\n大多数人假设 `CyRM℠`\
  \ 的主要功能是通过消除病毒和黑客带来的危险来降低运营风险。但现在是时候重新定位 `CyRM℠`，让它回归其本质——增长的推动者。\n\n数字化转型创造了一个竞争日益激烈的环境。敏捷组织可以通过利用尖端技术来创建新产品、提供更好的客户体验、进行创新，并在企业内部快速扩展这些创新，从而占据上风。因此，业务战略和\
  \ IT 战略将变得日益且积极地对齐。公司如何将其技术投资交织在一起，最终将决定其对预防中断和抓住机会的准备程度。构建无边界、适应性强且高度人性化、明确实现规模和战略敏捷性的\
  \ IT 系统的将获胜。\n\n要实现这一点，公司需要为未来重新构业务流程。它们（你）需要针对多个过程采用相同的技术，这些技术日益依赖平台、生态系统和各种连接数据来驱动人工智能系统。数字化的关键要素涉及云、大数据、移动性和协作。安全需要嵌入到整个业务生态系统中——而且它需要足够敏捷，以适应日常交易所需的数据速度和量，同时能够处理数字世界中威胁的复杂性和多样性。\n\
  \n安全和治理将比现在更加复杂——因为更多潜在攻击面的增加了脆弱性。在开发新产品和服务时，公司需要在创新和风险之间取得正确的平衡。在大多数情况下，安全性越高，产品或服务的友好和便利性就越低。强大的\
  \ `CyRM℠` 态势对于确保创新不因安全考虑而受限至关重要。健全 `CyRM℠` 战略必须促进创新以及客户信任——这对于持续增长都至关重要。良好的 `CyRM℠`\
  \ 战略能保持创新和业务运营轮的运转。有效的 `CyRM℠` 还需要增强产品完整性、客户体验、运营、监管合规、品牌声誉和投资者信心。\n\n业务格局正变得越来越相互依赖。因此，业务战略侧重于扩大和深化与公司外部资源的联系。公司需要管理一个复杂的利益相关者生态系统：合作伙伴、供应商、投资者和客户。网络伙伴的选择必须符合与其自身一致的治理和信托流程。如果生态系统中的任何环节断裂，其他环节也会削弱，业务将遭受损害。采用能够评估行为的\
  \ `CyRM℠` 技术很重要，以便在潜在问题造成伤害之前识别它们。检测到异常行为时实现自动系统干预的实时监控将成为常态。\n\n接受这些 `CyRM℠` 核心概念并将其与“弯而不不断”的方法（结合网络安全、业务连续性和企业韧性）相结合的公司将获得竞争优势。我们识别出可能伤害我们的风险通常是正确的，但我们通常低估了它们的速度或强度。提升安全角的公司将加强客户信任并提高股东价值。\n\
  \n想到了关于 `CyRM℠` 与业务战略互联的两个例子：\n\n\n\n\n\n2018 年 3 月，亚特兰大市遭受了名为 SamSam 的勒索软件攻击。这次攻击摧毁了市政府的计算机系统，导致多项城市服务中断，包括警察记录、法院、公用事业和停车服务。计算机系统关闭了`five\
  \ days`，迫使许多部门不得不手工完成必要的文书工作。五天！想象一下如果你的系统宕机五小时，你会有多崩溃。尽管服务在缓慢恢复，但完全恢复花费了数月时间。\n\
  \n攻击者仅索要 52,000 美元的赎金，但事后统计，这次攻击造成的全面影响预计超过了 1,700 万美元。仅应急 IT 顾问和危机管理公司的合同费用就高达近\
  \ 300 万美元。\n\n亚特兰大勒索软件攻击是一个关于业务连续性计划不足的教训。这一事件表明，该市 IT 部门对攻击的准备极其糟糕。就在两个月前，一次审计还发现该市\
  \ IT 系统存在 1,500 到 2,000 个漏洞，而这些漏洞因“过时的软件以及由随机或未记录流程驱动的 IT 文化”而进一步恶化。\n\n这就是糟糕的 `CyRM℠`\
  \ 如何导致糟糕业务的例子。现在让我们来看一个关于互通性的正面案例。研究显示，40% 到 60% 的小企业在灾难后从未再次开门。2017 年 8 月，哈维飓风袭击了德克萨斯州南部，破坏了该地区的家庭和企业。在四天内，某些地区的雨量超过了\
  \ 40 英寸。当风暴过去时，它造成的损害超过了 1,250 亿美元。\n\nGaille Media 是一家小型网络营销机构，它拒绝成为另一因灾难而关闭的小公司。尽管办公室位于办公楼的二层，但当休斯顿湖溢出时，Gaille\
  \ 的办公室被淹没了。洪水非常严重，导致三个月内没有人进入该建筑。该公司从未回到该建筑，但其运营几乎没有受到影响。这是因为 Gaille 将大部分数据存储在云端，这允许员工在风暴期间及之后进行远程工作。即使办公室被毁，他们从未失去对关键文件和记录的访问权限。事实上，在决定搬往何处时，老板最终决定保持公司去中心化，允许员工继续远程工作。如果公司将所有数据都存储在办公室，该业务可能永远无法恢复。COVID-19\
  \ 大流行证明了`虚拟世界已经来临，最终的赢家将是那些实现这一点的公司。`\n\n谈到企业危机时，人们唯一记得的是结果。良好的结果是一个完善、有纪律的过程的结果，这种过程展示了集体智慧和对纠正结果的承诺。\n\
  \n一个有效的 `CyberWellness℠` 和安全计划的具体需求包括：周密的计划、明智授权以及一套监控合规性的系统——这些都应该由董事会进行监督。从长远来看，董事会需要理解并考虑网络安全的战略性业务影响，培养正确的安全企业文化，并鼓励将\
  \ `CyRM℠` 实践整合到所有的治理和审批流程中。底线是：精明的董事会理解，网络安全是一个管理问题——而不仅仅是一个技术问题。\n\n拥有有效的业务网络安全策略如此重要，以至于\
  \ `SEC` 很快将强制要求。《网络安全披露法案》（Cybersecurity Disclosure Act）目前正在参议院通过，这是一项将产生深远影响的简单法案。其意图是确保公司公开披露它们为保护自己和客户免受网络攻击而采取的措施。\n\
  \n作为向 `SEC` 提交年度报告的一部分，上市公司必须披露董事会成员是否“具有网络安全方面的知识或经验”。如果没有，他们将能够说明公司采取了“哪些其他网络安全措施”。要求董事会具备信息安全专业知识对于美国企业界来说将是一个新奇，除了那些从事信息安全业务的公司之外的领域。\n\
  \n更具意义的是，《网络安全披露法案》将要求董事会承担保护公司及其投资者免受数据泄露、黑客攻击和其他网络威胁的责任。这项立法将网络安全提升到上市公司必须披露的其他风险因素之列，例如诉讼、高负债水平或劳工问题。\n\
  \n简而言之，在当今这个技术驱动的世界中竞争并获胜，公司需要做好网络安全。\n\n# 如何思考未来\n\n许多年前，我曾为 `Citicorp` 制定一项战略计划，期间我有幸与管理学界泰斗元老\
  \ `Peter Drucker` 共度过了一天。我问 `D Drucker` 如何预测未来，他回答：“预测未来最好的方法是创造它。”\n\n情景构建和分析是预测未来的完美工具。情景是关于未来的“如果……”的故事，允许我们考虑几乎任何可能发生的情况（无论是积极还是负面的），并帮助我们规划各种应对措施。它们还涉及边界的创建，并决定是否留在这些边界之内。这可能会让你想起上一章中的一些风险管理概念。\n\
  \n当我们构建情景时，我们从列出可能的驱动因素开始，然后将它们分为两个广泛的领域：我们认为自己了解某些情况以及不确定因素。前者通常是根据过去可以推出的趋势。例如，根据过去和现在的变化，我们可以对人口结构的长期转变做出相当合理的假设。不确定因素包括利率、政治权力的更迭以及尚无法预见的创新。良好的情景规划需要对已知和未知的变化驱动因素进行仔细的融合。一旦情景的大致参数确定，就可以开始寻找转折点——或称导索线——可以通过监控这些点来确定当天的事件是否会触发通往情景实现的连锁反应。\n\
  \n一个关于“世界大战三”的情景可能如下：\n\n> 2021 年，在因病毒疫情传播问题中美关系紧张局一年后，中国镇压香港。美国对所有中国出口产品实施了严厉制裁，导致中国出现负增长。对政府的不满情绪蔓延到中国大陆。国际机构未能将中美带回谈判桌。中国试图夺取南海一些长期存在争议的岛屿。一场酝酿中的危机通过几次事件不断升级，但转折点是台湾，其宣布从中国独立。中国随后入侵台湾，并对援助台湾的美国航空母舰发射了弹道导弹。一艘大型战舰及其船员的损失促使美国采取行动。美国攻击台湾的中国陆军，并阻止了这些部队的增援和补给，最终迫其投降。随着局势升级，美国同时攻击了中国的空军和海军以及预备的舰船和飞机。也许你还构建了一个日本和朝鲜爆发冲突的情景。\n\
  \n\n\n\n\n在上述场景中，如果中国是我公司主要的零部件供应商，我显然会担心我的替代供应链。如果中美之间的紧张局势升级，韩国可能不再是我的第一个“首选供应商”了。我还会监测首尔与东京之间的关系（到目前为止双方一直敌对），因为在北朝鲜干预的情况下，如果首尔和东京都站在美国一边，中人可能会花费更多时间来克制平壤，而不是在冲突中支持它。\n\
  \n当我在花旗银行（Citicorp）工作时，我们会监控高净值人士资本的本地流动。资本从一个新兴市场流出预示着问题的开始——毕竟，只有该国家的人才最清楚这一点——并预示了该国货币最终的贬值。如果我们等到当地政府自己采取行动，而不是由我们监控资金流，那么做出反应就已經太晚了。现在对未来不做任何行动往往会产生最高风险。“触发线”（Trip\
  \ wires）让你在事件开始左右你之前采取主动行动。\n\n# 针对风险做出更好的决策\n\n每当我听到有人说他们看到了“隧道尽头的亮光”时，我的第一反应是那可能是迎面来来的车灯。也许矿井比隧道贴贴的比喻：我们正在黑暗中前进，寻找黄金。我们不能仅仅根据我们看到的或我们自以为知道的事实来对未来做出决策。事实上，我们的决策总是基于不完整的信息——那只是我们那个时候手头拥有的最佳信息。因此，我们必须学会管理与不完美的决策过程相关的风险。我们可以将决策过程分为四个步骤：状况评估；游戏规则；做出决策；以及事后重新评估。\n\
  \n## 评估\n\n了解你所处的位置至关重要。在设定目标和管理风险之前，必须对你的当前状况进行清醒、彻底的评估。然而，我们感官本身的局限性使我们无法感知周围发生的很多事情，而这在大多数时候是一件好事。例如，如果我们能听到身体内细胞不断分裂的声音——那轰鸣声会把我们震聋的。事实上，清晰思考的能力似乎依赖于某种程度的感官剥夺。正因如此，我们的大多数人在工作时都会避免噪音。从更广泛意义上说，我们每天开始时的第一个感觉是我们的周围环境。尽管这个过程可能是下意识中发生的，但我们的眼睛首先接收卧室熟悉的景象，从而建立我们的位置。这似乎是我们的大脑在告诉我们：为了知道我们在做什么以及我们可能会去哪里，我们必须先知道我们在哪里。起初，这可能看起来像是一个矛盾——即认为既可以关注短期事件，又能关注长期计划——但我们的生活充满了不一致性。诀窍在于知道在适当的时候如何改变你的视野，先研究细节，然后退后一步观察大局。毕竟，没有细节，大局根本就不存在。\n\
  \n了解你不知道的什么同样重要。理解你自身知识的局限性，并质疑他人的假设。例如，有许多研究预测，世界五大经济体中的三个——欧盟、日本和德国——的人口在未来四十年内将会下降，意大利、俄罗斯和韩国也是如此。这些变化无疑将引起全球经济生产的变化，并几乎会改变军事力量的平衡。人口老龄化的影响将极大加剧这一趋势，减少世界领先经济体中生产性劳动动力，同时导致医疗成本上升。虽然这些假设是基于预测的——因此真正是基于我们不知道的事物——但这些趋势足够令人警觉，值得在未来几年对底层假设进行持续的审查和质疑。\n\
  \n## 游戏规则\n\n确定你为了实现目标愿意接受多少风险是至关重要的。如果你实现了目标，你会得到什么？为了实现这个目标，你愿意放弃什么？年前，我被一家世界顶级投资公司聘请，帮助公司高层做出我们所谓的“多高才算太高”的决策。换句话说，高层愿意在特定的投资头寸中损失多少？我们在\
  \ CEO 的会议室里转来转去，最终确定了这样一个简单的答案：“太高”是指他们不愿读到《华尔街日报》（`Wall Street Journal`）头版上关于自己的损失。保持在该数字以下将让公司管理层安心。对他们来说，对风险的胃与避免负面报道的需求有关。我建议他们对公司的投资组合设置限制，使其损失永远不会超过他们可以在报纸头版上接受的金额。公司的定量分析主管抱怨这些限制不够精确。当我回答时，大家都笑了：“大概上正确要比精确地错误要好。”当你定义了游戏规则时，做出决策变得更容易。\n\
  \n## 做出你的决策\n\n许多年前，我与玛格丽特·撒切（Margaret Thatcher）共进午饭。我问她：“首相，你为什么要和萨达姆·侯赛因战争？”她直视着我的眼睛说：“你绝不让欺凌者欺负你。我打了布什总统的电话，我们发起了战争。”她的回答告诉我，重要且困难的决策应该基于简单、基本的原则。\n\
  \n首先，也是最重要的，我们需要识别出那些我们从根本不愿承担的风险，无论任何个人成本如何。当新冠肺炎席卷世界时，美国海军上布雷特·克罗泽（Brett Crozier）根据原则采取了行动。在面临指挥的数百（或数千）名水手可能死亡与等待指挥链行动之间做出选择时，他选择了他的船员的安全和健康。同样，如果我们每个人都了解自己的压力点，我们就能识别出自己处境中不愿承担的底线风险——无论如何。这让我们在过程早期处于更容易做出良好决策的位置。\n\
  \n在评估风险时，我们都倾向于*低估*这些风险发生的程度和速度。在 2008 年金融危机之前的六个月，我问利曼兄弟的前首席执行官：“你的策略是什么？”他回答说：“保命！”这个答案听起来是否和今天我们从其他人那里听到的答案相似？至关重要重要的是，当你拥有*真实*的替代方案时，生命中的最佳决策才是做出的。因此，现在就开始制定现实的应急计划，以保护你免受不利影响。\n\
  \n\n\n\n\n第三，重要的是要理解`风险就是信息的缺失`。我们所做的每件事都存在风险，因为我们不可能知道所有的一切——在任何情况下，总会有信息的缺失。这一点在\
  \ COVID-19 疫情期间比任何时候都更加真实。你是否应该戴口罩？你每周应该买几次食物？考虑到这一新现实，你应该如何投资你的退休资产？每个决策都存在权衡。没有一个适用于所有人的答案。风险是个人的化的。多年来，我经常对客户说：当所有人都失业时，那是衰退；当你自己失业时，那是萧条。你必须对自己的日常行为、财务选择，以及影响你、你的家庭、你的社区——间接影响整个国家的选择，进行个人的风险/收益分析。\n\
  \n做出艰难的风险决策就像亲吻响尾蛇。这绝无趣味，而且可能是致命的。但你越系统地考虑什么对你来说真正重要、缺少了哪些信息、集体智慧告诉了你——并承诺评估“相对于对我真正重要的事情，我的下行风险是什么”——你的决策就会越好。尽管这可能不舒服，但经过深思熟虑和仔细评估风险，远比完全不考虑风险好得多。如果你得出需要帮助做出正确决策结论，请尽早寻求协助，而不是推迟。让专家来帮助你。\n\
  \n最后，在危机结束后，人们只会记住你做出的判断和你取得的结果。没有人会因为你的善意而给你赞誉——只有最终的结果。最理想的结果是一个经过深思熟虑、有纪律、有序的过程的结果，这个过程包含了集体智慧以及对确保正确性的强大、激光般的专注意。\n\
  \n## 重新评估\n\n一些常识在这里同样适用。持续监控结果并从错误中学习，以便你将来能做出更好的决策。日本的 `kaizen` 哲学（或“持续改进”）正是基于这种方法——通过微小的、渐进的改变来实现目标的实现。例如，多年前，我向某家慈善机构捐赠了一笔相当数目的资金，并理解这笔钱将用于启动一个我非常关心的特定项目。一年后，我发现该慈善机构根据他们自己的计划花了大部分资金，几乎完全忽略了我的指示。我与一位积累了巨大财富的朋友吃午饭，痛苦地诉说了所发生的一切。“这都是你的错，”她说，“你没有很好地传达你的愿景，你没有设定里程碑，你没有根据这些里程碑监控慈善机构的进度，而且鉴于你的专业知识，你本应该知道这些。”我在重新评估自己的慈善决定时没有运用常识。\n\
  \n专家预测的不可避免事件——流行、地震、干旱、海平面上升和其他灾难——需要很长时间才会发生，但当它们发生时，速度会非常快。情景构建（Scenario construction）是一种良好的实践，也是为不可避免事件发生时做好准备。此类练习将让你对早晚可能发生的情况有一个良好的感知，以便你在此过程中能做出更好的决策。\n\
  \n## 新兴威胁\n\n目前使用的安全产品存在许多问题。许多杀毒解决方案仅对已知威胁有效。平均每天产生 350,000 个新的恶意软件变体。依赖已知恶意软件解决方案是一场无止的、没有赢家的追赶游戏。此外，许多解决方案检测和修复攻击的时间太长。泄露的持续时间直接影响损害程度。如果你好奇，Ponemon\
  \ 研究所得出结论，2019 年识别并持续泄露的平均时间为 279 个受影响日。更进一步，更复杂的解决方案使用了 AI 算法，这些算法过度依赖基于历史经验预设的特征。尽管机器学习在检测广泛的已知攻击向量方面非常准确，但在检测从未见过的攻击（特别是具有独特解决方案的恶意软件）时，效果并不好。安全产品似乎总是落后一步。\n\
  \n此外，新兴技术往往产生以前未遇到过的新风险，并增加现有风险的复杂性。这些风险的互联性需要同时处理风险，而不是孤立地处理。例如，公司对互联系统依赖的增加将放大故障的影响并威胁韧性。在人工智能方面更进一步，由于算法没有与社会、伦理、文化或法律规范完全一致，将导致声誉、法律和监管后果。例如，许多组织在网站的程序化广告在不当内容旁边投放广告后，从该网站删除了他们的广告。\n\
  \n机器人（Bot）是程序用于执行特定任务的软件应用程序。机器人是自动化的，这意味着它们根据指令运行，不需要人类用户启动。机器人经常模仿或取代人类用户的行为。通常，它们执行重复性任务，而且执行速度远快于人类用户。坏机器人被程序用于破解用户账户、扫描网络上的联系信息以发送垃圾邮件，或执行其他恶意活动。机器人已被用于通过过度访问和权限获取大量机密数据来放大网络事件的损害。\n\
  \n自然语言生成工具和技术将能够对非结构化的“大数据”进行处理、分析和理解，公司将利用这些更有效地主动地运营。然而，虚假信息的大规模传播也将可能，并以各种方式表现，包括利用社交媒体影响舆论；通过付费在线评论创建虚假趋势；传播看起来真实的虚假照片/视频；以及基于错误认知鼓励错误的财务交易。\n\
  \n目前形式的互联网数据处理通常是集中化结构，大多数数据被收集并发送到具有良好存储、处理和网络的大型远程数据中心。这种集中化模型不可持续的，因为互联网正在转向大量的无线和远程设备，这些设备利用大量数据，且越来越需要更快的响应。更多的计算、存储和网络资源需要位于网络边缘（边缘计算），以显著减少数据流量并提高智能家居、智能交通、智能健康、智能电网和智能能源等新兴应用的响应时间。然而，边缘计算将为标准的加密、身份验证和访问控制带来新的网络安全挑战。例如，结果是拒绝服务攻击将大幅增加。\n\
  \n## 基于新兴威胁的情景使用\n\n考虑到这些潜在威胁以及实际发生的事件，想象这样一个涉及人工智能的潜在情景，以理解什么是可能的，然后在 `CyRM` 方面重点关注什么。\n\
  \n\n\n\n\n信不信由，真实的事件是几个已知的案例，犯罪分子接管了超过百万台计算机。已知最大的机器人网络是 `Bredolab`，包含超过 3000 万台计算机。它由一个黑客网络创建，通过将被劫持计算机的时间租给其他犯罪组织来获利。在巅峰时期，它每天能发送超过三十亿封受感染邮件。\n\
  \n现在考虑以下场景。\n\n## 应用 CyRM\n\n根据此场景的事件，你会监控什么，你会采取哪些潜在的管理行动步骤？例如，作为第一步，监控这些攻击并了解自己相对于需要保护的资产资产的脆弱性并不困难。其次，也许可以聘请网络过滤服务，扫描表现出异常行为的网站并阻止用户访问这些网站。或者可能统一使用\
  \ `Google Chrome` 或 `Mozilla Firefox` 以外的浏览器（这两种是流行的浏览器，因此恶意软件都是针对它们编写的）。同样，重要的是从四个步骤来思考决策过程：形势评估、规则、做出决策以及事后重新评估。记住，犯“错失性错误”（你研究了问题，考虑了所有替代方案，但走了一条错误的路）远比犯“遗漏性错误”（你甚至没有考虑过潜在问题）好得多。\n\
  \n# 结论\n\n在如今太多的公司中，参与网络安全是一件事后考虑的事，被额外补在人们每天的工作上，以希望创造一个安全的环境。我们都知道这种方法是不可通的。网络安全并没有被视为一个业务问题来处理，然后与业务需求对齐。此外，没有人在网络安全中采取主动进攻——只有防守，而且公司正关注着他们无法控制的昨天的问题和威胁。我们都知道，真正的失败往往没有被用作学习经验，也没有获得足够的关注来产生改变。\n\
  \n更进一步，董事会和高管层错误地认为合规性会拯救他们，但实际上，合规并不等同于适当的保护水平。遗憾的是，对于“我的公司足够足够？”这个问题，今天还没有简单的答案。高管决策与\
  \ IT 专业人员在网络安全方面也存在真实的脱节，这应该让更多的人彻夜难眠，因为每一个新的估算都增加了新威胁的水平。网络安全不仅仅是一个需要做对的重要问题——它是一个“必须做对”的问题。心态必须发生转变，从对抗昨天的战争转向识别并准备应对今天和明天的威胁。\n\
  \n真正需要一支拥有所有不同角色和职的军队来提供适当的 `CyRM`。不同的人有许多角色：董事会、C 级高管、`CISO`、IT 员工、风险管理人员、审计师以及公司的每位员工。这是一支来自不同背景、财富和教育经历的人员军队，但每个参与者都有共同的目标，这就是为什么它运行得如此良好。\n\
  \n我们在网络安全领域都缺少一个共同的目标：对 `CyRM` 的真正承诺。对我来说，通过 `CyRM` 掌握网络安全管理的重要性，就像试图解释“参与”与“承诺”的区别一样。这就像一份培根早餐——鸡是参与了，但猪是承诺了。你必须承诺。你必须在你的公司建立对\
  \ `CyRM` 的承诺。在整本书中，我强调安全*不应该*被视为由技术人员处理的技术问题。很多时候，这都是关于投入资金寻求技术解决方案，而以牺牲高管的参与为代价。网络安全是一个管理问题。要取得成功，你必须将安全视为一个业务问题，并将网络安全与业务决策联系起来，以影响业务结果。记住，`CyRM`\
  \ 为了有效影响业务结果，需要由三个部分组成：\n\n1. **风险管理：** 将风险管理的原则应用于网络安全，以便从组织的整体角度观察风险，以指导资源分配、更好地管理风险并实现问责制。\n\
  2. **网络健康 (CyberWellness)：** 它不仅应该涵盖整个公司，还涵盖每位员工，他们需要对自己承担的风险负责。这需要一个活跃的安全过程——就像公司采取积极措施促进员工健康的健康计划一样。\n\
  3. **作为业务战略的网络安全：** 网络安全需要重新定位其真实本质：增长的者，而不仅仅是通过消除病毒和黑客带来的危险来减少运营风险。它还需要增强产品完整性、客户体验、运营合规性、品牌声誉和投资者信心。\n\
  \n我写这本书是因为我热衷帮助业务领导者通过关键的网络风险管理工具——`CyRM` 让他们晚上睡得更好，这些工具在保护他们企业的同时增强战略性的业务增长。在 `PwC`、`AllianceBernstein`、`Citibank`\
  \ 等机构担任财务领导者的四十年经验，为平衡风险的现实与业务的机会提供了基础。技术渗透到今天所有的运营中，从业务的运行方式到它交付价值和成功的方式。技术也威胁着这些所有方面。那么，我们如何在这个危险的环境中蓬勃发展呢？\n\
  \n我的答案是在你的公司中建立对 `CyRM` 的承诺。我列出了我的 `CyRM` 方法，并向你们——无论是业务领导者还是 IT 经理——展示了如何合作并取得成功。在每一章中，我都强调了你们在应对当今危险形势时需要了解的知识，并概述了你们为准备公司所需的积极步骤——为了生存，甚至繁荣。\n\
  \n管理咨询先驱 `W. Edwards Deming` 曾说：“改变不是必要的。生存不是强制的。”我们都知道他的意思。鉴于过去几十年变化的指数级速度和强度，这在今天比在戴明的时代要真实得多。适应，或灭亡。\n\
  \n\n\n\n\n`Roel C. Campos` 是华盛顿特区 Hughes Hubbard & Reed 律师事务所的合伙人，并担任证券执法部门主席。Campos\
  \ 先生的业务范围包括为高级管理层和董事会就最敏感且复杂的问题提供建议。他的工作通常涉及进行内部调查以及应对涉及金融监管机构的案件，例如 `SEC`、`DOJ`、`CFTC`\
  \ 和 `FINRA`。他还负责就网络安全、治理、加密货币以及金融监管机构拟定的规则等事项向董事会提供建议。\n\n从 2002 年开始，Campos 先生两次获得总统乔治·W·布什的任命并经美国参议院确认为\
  \ `SEC` 委员，任职至 2007 年。\n\n在被 `SEC` 委员之前，Campos 先生曾与合伙人一起从事风险投资，并担任过高管且运营过一家广播公司。\n\
  \n在从哈佛法学院毕业后，他在洛杉矶的一家大型律所工作。Campos 先生还曾在洛杉矶的`美国检察官办公室`任职。他起诉过大型毒品集团，并在一次著名的审判中，判定了几名毒品集团头目绑架并杀害一名\
  \ `DEA` 探员。\n\n\n`David X Martin` 是网络安全专家，曾与 `FBI` 及大型企业共同主持了一项关于情报共享和最佳实践的公私合作倡议；曾为`以色列中央银行`就金融机构的网络安全审计提供咨询；曾担任一家上市公司信息安全委员会主席；担任\
  \ `Oliver Wyman` 的网络安全高级顾问；并发表了许多关于管理网络安全的创新方法的文章。他是网络安全咨询与开发公司 `cybXsecure` 的联合董事。\n\
  \nMartin 先生是公认的风险管理和估值问题专家，在投资策略与运营、定量研究、交易所以及交易台监管方面拥有丰富经验。他是`投资公司协会风险委员会`的创始主席以及`买方风险委员会`的共同主席。他是一位资深金融高管，40\
  \ 年的职业生涯包括在`普华永道 (PWC)`、`花旗银行`和`AllianceBernstein`担任高级职位，在这些机构中他曾担任首席风险官和 `Sanford\
  \ Bernstein LLC` 的董事。\n\nMartin 先生还是 `纽约大学 (NYU)` 和 `福特汉大学商学院`的客座教授，2010 年秋由 `McGraw\
  \ Hill` 出版的《风险与精明的投资者》（Risk and the Smart Investor），以及 2012 年由 `Amazon` 出版的《风险的本质》（The\
  \ Nature of Risk）。他还发表了许多关于网络安全、合规与风险、企业风险管理以及公司治理的白皮书。\n\nMartin 先生担任美国国务院`国际经济政策咨询委员会制裁小组小组`的成员，并担任`金融稳定中心`负责网络安全和新兴风险的特别顾问。\n\
  \n## 引言\n\n本文档的目的是为董事会提供一套指导原则，以便能够实施有效的网络安全计划。\n\n董事应当了解其公司面临的全方位网络风险，并鼓励管理层根据公司的运营环境、风险状况和长期目标制定相应的策略。\n\
  \n任何有效的网络安全计划的特定需求都包括周密的计划、明智的授权以及合规监控系统——这些都是董事应该监督的。现在已经不再是公司“是否”会受到攻击的问题，而是“何时”会发生这个问题——以及组织将如何防止。\n\
  \n智能网络监控、早期预警指标、多层防御以及从过去事件中吸取的教训，都是真正的网络韧性的关键组成部分。当问题发生时（无论大小如何），快速识别和响应问题的能力将决定公司的最终恢复情况。\n\
  \n网络安全无法得到保证，但及时恰当的反应是可以保证的。\n\n从长远来看，董事会应该理解并考虑网络安全的战略业务影响，培养围绕安全的正确公司文化，并鼓励整合网络风险实践。从本质上说，董事会应该将网络安全视为一个管理问题，而不仅仅是一个技术问题。\n\
  \n### 董事应将网络安全视为其必须监督的企业风险的重要组成部分\n\n1. 识别组织可能受攻击的关键资产（“皇冠上的宝石”）。\n2. 确定要避免哪些网络风险、接受哪些风险、以及规缓哪些风险。\n\
  3. 针对每种方法制定具体的计划。\n\n网络安全中没有进攻策略——只有防御策略。此外，董事会成员的关要任务是首先确定哪些资产最有价值，其次是采取最有效的策略来保护这些资产。一旦董事会确定了需要保护的价值，就可以进行优先排序并分配资源。\n\
  \n定义组织的风险承受能力是一项复杂的挑战，因为它要求所有人员对以下项目充满信心：\n\n* 了解他们的信息资产清单是完整且实时的\n* 确定用于优先考虑这些资产价值的流程是准确且适当的\n\
  * 理解为保护最重要资产（例如“皇冠上的宝石”）所采取的关键行动的有效性\n* 对其他风险缓解项目（如保险）的条款和条件有全面的掌握，并对保险和其他缓解措施在何情况下将失效有相应的知识\n\
  * 对发生网络事件时将触发的业务响应和连续性计划的规模和稳健性有深入理解\n\n上述五个要素代表了风险能力计算中组成要素的示例，董事和高级管理层需要持续执行这些计算。前三项对董事来说至关重要，以确保他们知道管理层投入了哪些计划、投资和资源来保护最有价值的资产，因为这些资产被盗、未经授权的访问或损坏可能代表生存性风险。\n\
  \n最后两项也作为输入纳入能力计算中，因为缓解行动（如第三方网络保险和远程备份设施）的成本和收益同样重要。这些传统的风险管理活动在组织评估其承受或应对预定义的业务连续性事件的能力方面发挥着重要作用。\n\
  \n业务连续性框架可以帮助对网络泄露发生后需要恢复的资产优先顺序获得洞察。当然，任何预定义的事件估计都可能与实际情况不符，但组织可以使用频繁的模拟攻击，以识别并评估其他“不那么重要”的资产是否从风险缓解的角度得到了适当的评估。\n\
  \n\n\n\n\n为了履行这一关怀义务，董事必须能够以合理的常理方式证明他们已经履行了对网络安全的监督职能。为此，董事应当定期从 `CEO` 和 `CISO`\
  \ 处获得评估和保证，以确保整个组织（即不仅仅是技术部门）正在进行的工作高度侧重于保护核心资产及其他高优先级资产。这些工作计划程应涉及功能分层、稳健的身份访问管理以及更高层次的员工培训，以及网络和端点层面领先的安全实践。\n\
  \n此外，承认错误并从从中学习可以带来更好的决策。在关于公司安全模型和漏洞的简报中，应该鼓励进行网络安全事后分析（post mortems）。对网络安全问题的审慎考虑和参与是不可替代的。\n\
  \n当然，在开发新产品和服务务时，公司需要在创新与风险之间取得正确的平衡。在大多数情况下，安全性越高，产品的用户友好性和便利性就越低。应该进行网络过滤审查的流程包括战略规划、并购、产品开发以及资本分配和预算。即使是人力资源流程也应该具备网络过滤器，以理解招聘、领导力培养和网络资源留存策略。\n\
  \n## II. 董事应将网络安全视为战略性和管理性问题，因此应要求管理层对建议和实施整体网络风险管理策略及政策负责。\n\n1. 管理层应对对报告其行为和网络违规情况负责责。\n\
  2. 在适当的情况下，董事会应要求关键高管证明网络安全计划的某些重要方面已经执行。\n3. 提高员工意识和培训至关重要。\n4. 对网络漏洞进行第三方测试可以提供高程度的威慑。\n\
  5. 董事会应维持一个外部专业人士团队，以便在培训和危机情况下提供支持。\n\n董事必须通过比单纯信息技术（IT）更广阔的视角来理解安全，因为对公司造成的潜在损害可能是毁灭性的。\n\
  \n网络安全风险需要 C 级管理层的负责制和董事会的监督，以推动议程并管理具备正确技能的赋权员工。\n\n与负责的公司官员关于网络风险管理的讨论，应在董事会和董事委员会会议议程中获得定期且充分的时间。\n\
  \n负责人员的领导技能——沟通和危机管理——应得到同等的考虑，因为它们通常比技术技能更重要。显然，在日常技术管理或危机时刻，拥有一位高超的领导者比拥有一个领域专家好得多。\n\
  \n董事会还应该根据他们完全理解的术语（和语言）建立自评估框架，以确保正在实施行业最佳实践并取得了实际进展。对结果的强化关注应取代纯粹基于活动的报告。\n\n\
  董事需要通过鼓励管理层各级与下属之间进行适当的互动，来促进稳健的网络安全状态和韧性。\n\n据文献记载，大约三分之二的成功授权网络攻击直接归因于员工所采取（或未采取）的行为。\n\
  \n因此，提高员工对网络风险暴露的意识，代表了增强组织整体网络韧性的重要意义的机会。\n\n通过游戏化和持续培训等具有操作性质的举措对员工意识进行任何可衡量的改进，将极大增强实体保护和响应网络事件的能力。\n\
  \n从董事的角度来看，接收对真实和模拟事件响应事件的深度分析和评估至关重要，这些评估应详细描述上述三个团队之外的其他职能团队之间的互动。此类评估（可能由独立的第三方执行）将为组织的整体网络韧性提供洞察，而这种韧性充其是一个不断演进的目标。\n\
  \n网络韧性的重要部分还包括与外部专家和公司建立关系，以支持对数据泄露做出更果断的响应。破解后的环境并不是寻找所需专业知识或谈判合同条款的最佳时机，因此拥有一个“随时待命”的外部资源团队可以加速恢复和业务重启。这些外部专家可以包括取证、法务、通信和系统修复等。执法部门（`FBI`\
  \ 等）的处理方法也应在事件发生前予以。\n\n## III. 董事应受网络安全两个广泛概念的指导：\n\n1. 确保网络安全在三线防御内进行管理，以及\n2.\
  \ 确保网络安全基于收集情报并适应变化的环境进行管理。\n\n### A. 三线防御\n\n网络安全需要一种不仅仅是信息安全部门唯一关注的方法。首选方法是三线防御模型。第一道防“风险识别与评估”是业务部门和信息安全团队的责任。因此，他们对拥有、理解和管理网络风险以及向董事通报评估结果有直接责任。\n\
  \n第二道防“风险管理”是公司风险管理团队的责任，从战略业务角度对威胁的影响、优先级的确定和资源的分配提供职能监督。风险管理团队还应对第一线的网络风险处理方法提供建设性的战略业务挑战，确保建立了正确的政策和程序，并确保网络安全有效整合到运营和企业风险中。再次，应向董事会提供风险管理有效性的定期报告。\n\
  \n第三道防“风险监控”是内部审计的责任，为董事会和高级管理层提供企业网络风险治理有效的保证。\n\n这三线防御应由活跃、投入的董事会指导，该董事会批准并监督公司的网络安全方法，批准战略决策和优先级，同时对管理层提供可靠且有效的制衡。\n\
  \n### B. 情报驱动方法\n\n传统的安全方法依赖于预防策略。它以异常方式处理事件响应。相比之下，情报驱动的心态是基于公司已经遭到入侵的假设，因此需要不断演进，以便在情报和事件方面保持领先。\n\
  \n\n\n\n\n自适应安全架构允许对安全相关问题进行决策，其依据是：准确的威胁建模、可量化的资产估值，以及考虑安全措施或流程的威慑因素及其成本的“假设性”情景。正确的情报驱动方法基于先前的经验、当前的威胁情报、对影响过其他公司的泄露事件的理解、趋势、资产估值，以及对保护这些资产的防御措施的持续分析（包括控制措施失效时的情况）。\n\
  \n董事还应鼓励对用于访问管理、人工智能和分分布式数据等新技术进行审查，这些技术可能会增强公司的网络防御能力。\n\n## IV. 董事应理解公司对第三方供应商的风险敞口。\n\
  \n第三方对运营环境可能产生影响，因为董事会和公司对第三方网络安全风险的关注程度通常不如对自身业务风险的敏锐，尽管第三方可能会产生同样的负面长期影响。\n\n\
  那些密切关注通过核心竞争力实现使命的组织，将其他提供商和合作伙伴的优势视为一种关键且可行的业务战略。公司管理着成百甚至数千个供应商、第三方服务提供商和其他类型的外包安排。这些外部实体通过为公司技术环境创建新的切入点，成为增量风险的主要来源。数据共享和通信不再完全由组织的内部运营控制，这为运营环境增加了复杂性和潜在的波动性。\n\
  \n法律和其他务实考量可以（也应该）被用于划分和缓解风险；然而，风险无论源自何处，在危机或压力时期都将转回到公司身上。客户（企业和个人）只会向与其开展业务业务的公司寻求解释和救济。\n\
  \n许多组织在供应商管理方面正处于“追赶”状态。创建完整的供应商关系清单的能力显然是整个计划的“入场券”。第三方计划的基础性工作应包括以下内容：\n\n*  \
  \ 所有第三方合同的完整且全面的清单\n*   根据对组织的风险（包括网络风险）对第三方风险敞口进行优先级排序\n*   为任何新关系的入驻建立清晰的评估工具\n\
  *   建立持续的、经风险调整的监控流程，以评估对合同条款的遵守情况\n*   通过服务组织控制（SOC）报告对供应商的做法进行第三方评估\n*   与主要服务提供商进行联合灾难恢复测试\n\
  \n这些活动应产生具有操作性且及时的董事会报告；利用技术赋能的供应商解决方案也是一种最佳实践。\n\n一个新兴趋势是进行第四方评估，以了解哪些活动被进一步外包，导致网络安全风险状况发生了变化。\n\
  \n对于网络安全风险，“风险调整”不再仅仅是基于金额的过滤（例如，基于合同的财务规模）。随着廉价应用以及其他狭窄但高效工具的普及，这些工具可以完全捕捉关系的风险状况，因此必须使用其他过滤器来理解其对组织的影响。\n\
  \n强大的第三方供应商管理计划不仅能加强网络安全风险管理——它还能支持支出决策、合同策略、服务水平和其他关键的运营活动，以支持核心业务目标的实现。\n\n##\
  \ V. 董事应致力于培养一种高度重视网络安全的企业文化。\n\n### A. 董事应与管理层共同为网络安全定义适当的行为，并清晰地展示组织对严格遵守这些要求的重视。\n\
  \n风险文化是通过共享的组织价值观、信念和态度，将风险承担和风险管理的各个方面结合在一起的胶水。通过提高意识和刻意规划，可以主动影响风险文化，以增强组织的风险和业务管理环境。网络安全也不例外；鉴于大多数网络风险最初可以追溯到人员及相关行为，而非技术，建立强大的网络安全文化是任何计划的不可缺少的部分。\n\
  \n然而，大多数员工对个人数字安全并不感兴趣，更不用说公司的了。因此，改变公司文化以加强安全性是特别困难的——需要范式转变以跟上不断变化的威胁。从历史上看，任何与\
  \ IT 安全有关的事情都被 IT 团队远离了用户。难怪用户对公司的安全表现出没有或毫无兴趣。\n\n但实际上，用户应该是数据安全的前线。他们创建并处理信息——因此他们最能理解其价值。董事应要求管理层开发与用户互动的培训和问责计划。使用现代的游戏化培训，并在随后监控用户如何应用培训，有助于将公司文化转变为网络安全是每个人的责任。\n\
  \n如果没有强大的风险文化，即使是最好的网络安全管理框架也会变得脆弱并失效。鉴于不断变化和快速演变的网络环境，嵌入强大的网络风险文化可以在政策尚未起草或更新时为活动提供原则和价值观。具体的指导并不总是可用、相关或被记住。强大网络安全文化的指标包括：\n\
  \n*   反映组织面临的风险和不断变化的运营环境的清晰简洁的网络安全政策框架\n*   董事会和领导层议程重点包含网络安全\n*   网络风险不是孤立管理的——关于网络的讨论被织入所有管理流程中，例如新产品审批、合并尽职调查和第三方外包安排\n\
  *   持续学习环境，包括相关且易于记忆的培训和工具，以支持良好的网络卫生，从密码协议到反钓鱼活动再到自自带设备（BYOD）政策\n*   存在安全的环境供员工提出风险或问题，员工需要知道当他们识别出未缓解的风险或新兴威胁时，会获得支持的\n\
  \n强大网络安全文化的另一个标志是组织中的任何人都都不例外，包括董事会。董事会应通过参加公司网络安全培训、避免使用个人邮箱处理公司业务以及（物理和电子方式）保护机密信息来展示他们对强大网络安全实践的了解。\n\
  \n### B. 董事需要理解网络风险与其公司具体情况相关的法律和监管影响，包括他们的信托义务和整体法律格局。\n\n\n\n\n\n过去一年左右，影响德勤（Deloitte）、Equifax、Facebook\
  \ 以及许多其他公司的知名事件提醒我们，数据泄露风险以及对这些事件的响应有多快地影响一家公司的声誉。敏感客户和公司数据及系统的泄露将引起股东和监管机构的严审查，并对公司的运营及股价构成重大风险。此外，根据证券法，董事是看门人，有责任向股东防止发生违规行为。\n\
  \n当然，董事负有尽职调查、忠诚和诚实的信义义务，以确保保护公司资产（包括客户信息）以及公司的声誉和股东价值。这包括确保建立有效的网络安全计划，以满足法律要求，并维护多层安全措施，保护敏感信息免受无论是意外还是故意的未经授权的修改、破坏或泄露。为了履行这些职责，董事应安排其总法律顾问和/或外部律师进行定期简报，向董事通报联邦、地方和州法律对网络安全和隐私的影响。\n\
  \n# 结论\n\n网络攻击后的公众监督以及监管机构的要求已使网络安全成为董事会的议题和核心责任。在危机中，人们在做出判断时唯一记得的是结果。一个良好的结果通常是深思熟虑、严谨的流程的结果，这展示了集体智慧以及对纠正结果的承诺。\n\
  \n董事会议是公司董事重新评估其在网络安全风险管理方面如何行使治理责任的良机。在当今的全球网络地雷区中，董事会不仅要监控表现，还要激励在该领域追求卓越表现。\n\
  \n## 附录：DCRO 网络风险治理指导原则\n\n**原则 1：** 董事应将网络安全视为企业风险的一个重要元素，他们必须对其进行监督：识别公司可能易受网络攻击的本质资产，确定需要避免、接受或缓解哪些网络风险，并针对每种方法制定具体的计划。\n\
  \n**原则 2：** 董事应将网络安全视为一个战略性和管理性的问题，因此应要求管理层对建议和实施整体网络风险管理策略及政策负责。\n\n**原则 3：** 董事应受网络安全两个广义概念的指导：确保在“三道防线”内进行管理，并根据收集的情报和不断变化的风险环境做出反应和适应。\n\
  \n**原则 4：** 董事应理解公司对第三方供应商的风险敞口。\n\n**原则 5：** 董事应致力于培养一种高度重视网络安全的企业文化。\n\n## DCRO\
