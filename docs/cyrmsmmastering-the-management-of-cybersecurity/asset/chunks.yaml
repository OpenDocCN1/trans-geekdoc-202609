    My approach to home safety—which is an analog version of a dynamic CyRM℠ program—succeeds
    because it’s comprehensive. One way to consider preparing for cyberattacks is
    an approach called “Defense in Depth.” This approach is modeled after conventional
    military strategy. Rather than concentrating all resources at the front line,
    the “Defense in Depth” strategy has defenders deployed in a series of preplanned
    positions—a series of layers—from which they can advantageously attack the advancing
    enemy. Adapted to cybersecurity, “Defense in Depth” strategies use multiple security
    techniques and products to mitigate the potential failure of one component. “Defense
    in Depth” also slows down the attacker and buys time to fix the problem.


    When serial bank robber Willie Sutton was asked why he felt compelled to rip off
    financial institutions, he replied, “That’s where the money is.” The same goes
    for cybercriminals. Your firm needs to decide which data is the most valuable
    and then spend accordingly to protect it. For example, confidential client information
    (social security numbers, say) may be the most critical and should receive the
    most protection. If that’s the case, allocate a large share of your cybersecurity
    budget toward client information protection.


    When thinking about protecting client data, keep in mind that it’s no longer simply
    a question of having data stolen—there’s also the concern that the data will be
    altered to make it unusable or incorrect. This is something criminals do under
    the nose of a firm, and it can take ages to come to light! It’s therefore critical
    that your company puts in place the most effective strategy or strategies to protect
    important data. Once you’ve ascertained the criticality of what needs to be protected,
    you can prioritize and allocate resources to avoid and mitigate cybersecurity
    threats. At that point, you can decide whether or not your cybersecurity budget
    is appropriate.


    It’s also important to have a comprehensive command of the terms and conditions
    of other risk-mitigating items—such as insurance—with the corresponding knowledge
    of where insurance and other risk mitigation efforts won’t be effective. For example,
    your company is a trusted adviser to your clients. If your company experiences
    a cyberattack and as a result loses your top clients’ highly personal financial
    data, that could be enough of a reputational hit to put your firm out of business.


    Smart companies understand that CyberWellness℠ isn’t a technical problem to be
    solved, but rather an ongoing risk to be managed. Cybersecurity cannot be guaranteed,
    but a timely and appropriate reaction can. With thatat in mind, let’s consider
    the best way to prepare for being hacked.


    ## Incident Response Plans


    Your company should create incident response plans that consider both public relations
    and legal issues. An incident response plan helps to identify, respond to, and
    recover from cybersecurity incidents. The objective of an incident response plan
    is to prevent damages such as service outages, data loss, or theft, as well as
    to illicit access to organizational systems.


    An incident response plan isn’t complete without a team that can carry it out.
    Team members are the point people for the incident—they’re responsible for communicating
    with internal partners and external parties, such as legal counsel, press, law
    enforcement, customers, and other stakeholders. In order for the incident response
    team to be effective, they need senior management support, consistent testing,
    and clear communication channels. The team needs to develop a response plan that
    provides a structured process for each of these steps:


    *   **Preparation:** Perform a risk assessment and prioritize security issues.
    Identify which are the most sensitive assets and, by extension, which are the
    critical security incidents the team should focus on to contain the issue. Create
    a communication plan and prepare documentation that clearly and briefly outlines
    roles, responsibilities, and processes.

    *   **Identification:** When a potential incident is discovered, the team should
    immediately collect additional evidence, decide on the type and severity of the
    incident, and document everything they’re doing.

    *   **Containment:** Once the team identifies a security incident, the immediate
    goal is to contain the incident and prevent further damage.

    *   **Eradication:** The team must identify the root cause of the attack and take
    steps to prevent similar ones in the future. For example, if a vulnerability was
    exploited, it should be immediately patched.

    *   **Recovery:** The team should bring affected production systems back online
    carefully to ensure another incident doesn’t take place, then test and verify
    that affected systems are back to normal.

    *   **Documentation of lessons learned:** Investigate the incident further to
    identify if it could happen again, then take necessary steps to ensure it won’t.


    ## Penetration Testing


    A healthy CyberWellness℠ program also practices `penetration testing`—also known
    as pen testing. Pen testing views your network, application, device, and physical
    security through the eyes of both a malicious actor and an experienced cybersecurity
    expert to discover weaknesses and identify areas where your security posture needs
    improvement. Pen testing doesn’t stop at just discovering ways in which a criminal
    might gain unauthorized access to sensitive data, or even take over your systems
    for malicious purposes. It also simulates a real-world attack to determine how
    your defenses will fare, and the possible magnitude of a breach. Such evaluations
    (perhaps performed by an independent third party) provide insight into your organization’s
    overall cyber resilience, which is a continuously evolving objective.


    Pen testing isn’t just about what’s wrong. It’s also about identifying appropriate
    trade-offs—because you can’t protect everything. Comprehensive penetration testing
    considers several areas: application, networks (including wireless), weak passwords
    and protocols, and physical barriers, such as sensors and cameras.


    Just as you go to a health care provider for an annual wellness checkup, it makes
    sense to enlist the help of highly trained security consultants to carry out your
    security testing. While you might think you’re perfectly healthy, a doctor can
    run tests to detect dangers you’re not aware of. Similarly, the people who put
    together, maintain, and monitor your security program may not have the objectivity
    needed to identify security flaws, understand the level of risk for your organization,
    and help address and fix critical issues. Metaphorically speaking, in this ongoing
    game of cat and mouse, you would be smart to consult with an objective outside
    cat every so often because the mice are fast and sneaky—always learning, always
    evolving, inventing new ways to steal your cheese.


    ## Tabletop Exercises


    Tabletop exercises help determine how your team will react to a potential cyberattack
    so you can evaluate the effectiveness of your planning. Companies can identify
    flaws or gaps in their response and make adjustments to ensure top-notch preparedness.
    For instance, if your company experienced a ransomware attack, would your employees
    know what to do? Testing this scenario in a safe environment lets you know if
    your response plan for ransomware is effective and whether it can be improved
    using other alternatives. Tabletop exercises can also help you identify missing
    links in the chain of command—ensuring documentation of response plans and finding
    gaps in your recovery process. An excellent outside eye can identify and develop
    tabletop exercises that will help your company strengthen its security and resiliency.


    ## Public Relations and Legal Counsel

