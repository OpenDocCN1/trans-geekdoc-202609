    The prospect of a toxic mix of continual and widespread financial data corruption—along
    with a government seemingly powerless to prevent it—is clearly a massive destabilization
    threat that, in turn, ought to trigger urgent strategic planning in both the public
    and private sectors. Don’t wait for government to modernize its policies. Don’t
    blindly trust third-party companies. Cyber bad actors have incredible reach to
    massive numbers of potential victims. They change tactics rapidly and remain largely
    anonymous as they traverse a boundary-less digital realm, wreaking havoc from
    the comfort of their native lands.


    The bad guys are met—when they can be met—by a US government lugging around its
    analog-era legal construct that divides by mission (law enforcement, intelligence,
    military) and geography (domestic, foreign, judicial districts, US Person, non-US
    Person), wielding policies and procedures largely constructed during the Cold
    War (security classification levels).


    The government is clearly not adequate, strategic, or nimble in the face of new
    cyberthreat realities. It’s high time to reexamine the sufficiency of current
    criminal law, international treaties and agreements, and governance protocols
    within the context of our now virtually interconnected planet. However, given
    the pathetic track record of government thus far, don’t hold your breath waiting
    for it to get its act together. Act now.


    Some people change when they see the light; others change only when they feel
    the heat. In other words: you can be proactive or you can be reactive. When it
    comes to cybersecurity, the United States government has proven to be reactive.
    It’s incumbent upon smart business leaders—those who see the light—to take steps
    NOW to protect their companies. As attack surfaces multiply and government slowly
    responds, it’s time for you to invest in `CyRM℠` and take the lead in keeping
    the bad guys at bay.


    ## PRONG 1: `CyRM℠`: Cyber Risk Management


    ## 2 Gather Intelligence, Anticipate Risk


    As we saw in `Chapter 1`, it’s no longer a question of whether a company will
    be attacked, but more a question of *when* this will happen—and how the organization
    is going to prevent it. When things go wrong, whether in a major or minor way,
    the ability to quickly identify and respond to a problem will determine your company’s
    ultimate recovery. My approach, `CyRM℠`, applies the tenets of risk management
    to cybersecurity. I believe it’s essential to take a broad view of risks across
    an organization to inform resource allocation, better manage risks, and enable
    accountability. As with traditional risk management, the goal of `CyRM℠` is to
    identify risks early and implement appropriate mitigations to prevent incidents
    or attenuate their impact. To foster an excellent cyber risk management program,
    you first need to understand the principles and practices of enterprise risk management.


    Risk managers survey the landscape of risk a company faces in a variety of ways
    and then create appropriate responses based on those risks. A helpful analogy
    in considering risk management is the human body: your five senses receive stimuli
    and convey data to your brain in order to spot potential dangers and anticipate
    problems. Historical memory helps you predict potential outcomes based on past
    experiences and helps you plan potential responses. Your five forward-looking
    senses, coupled with your historical memory, are continuously monitoring your
    immediate environment to alert you to potential danger. For example, the smell
    of smoke and/or the heat of an approaching fire tells you how imminent and how
    severe your risk is of being harmed by the fire. The sharper your senses, the
    more quickly your body can react to protect itself. Your organization''s risk
    management system should be continuously sensing any potential risks ahead, determining
    how serious they are to your business, and providing effective mechanisms to respond
    quickly.


    For the more technically minded reader, another apt metaphor is radar. What''s
    unique about radar is that while it uses historical performance—not unlike your
    body''s historical memory—it also looks forward to predict a future outcome.


    Here''s how it works: the radar antenna transmits radio waves that bounce off
    any object in their path. The bounced-back energy returns to a dish that determines
    the object''s range, altitude, direction, and/or speed. Tracking algorithms predict
    future positions of the moving object. These algorithms are, for the most part,
    based on historical performance, with frequent forward-facing updates. In other
    words, radar is very good at both gathering intelligence *and* anticipating risk.


    Risk management—like radar—relies on quantifiable data. There’s an inverse correlation
    between risk and information. The less information you have, the higher the risk
    you run. Consider a simple everyday example: if you don’t know the weather forecast,
    you increase the risk of dressing inappropriately and getting caught unprepared
    in a downpour.


    From a risk management perspective, risk and uncertainty are quantifiable based
    on whether the probabilities of occurrence and possible outcomes are known. The
    resulting potential loss amount can be easily calculated. For example, if the
    weather forecast says there’s 100 percent probability of rain, but you don’t carry
    an umbrella and your new shoes get ruined, the potential loss amount is the cost
    of buying a new pair of shoes. If there were several possible outcomes/costs resulting
    from ruining your shoes in the rain—the cost of replacing them, or taking them
    to a shoemaker to try to restore them—you could compute a potential loss amount
    based on all possible outcomes/costs.


    Taking this simple example one step further, suppose you decide to take your shoes
    off in the rain to keep from ruining them; you have no idea what might happen
    to your feet. One approach would be to develop scenarios to determine what possibly
    could happen to your feet, the probabilities of each type of damage, and computing
    the potential loss amount. The problem becomes even more difficult to solve when
    you don’t know what could possibly happen to your feet from walking barefoot in
    the rain.


    The problem takes on a totally different dimension if you’re walking without shoes
    in the rain across the deck of a ship at sea—because no rational individual wants
    to leave survival to probabilities. In other words, it’s no longer a question
    of managing *uncertainty*—it becomes a question of *survival.* Your thought process
    switches from “Are the costs reasonable for the risks I’m assuming?” to “This
    is a risk I’m just not willing to assume. Are the protections I have in place
    adequate for me to not get seriously hurt?" In other words: At what point does
    the line that you’re not willing to cross become about survival—about your very
    existence—and no longer about simply quantifying the cost?


    Many risk managers work with scenarios on issues related to survivability to try
    to bind the realm of possibilities. Scenarios have limitations: they only address
    *known unknown* risks (things that you can imagine), but consequently don’t address
    what you do *not* know (the *unknown unknown* risks). A good risk manager asks,
    “How do I turn as many unknown risks into known risks, which can then be quantified?”


    For example, again the scenario of a person walking without shoes across a slippery,
    rain-drenched deck of a ship at sea. What if the rain was from a hurricane, where
    in many cases the strength of the winds or height of the incoming water (all velocity-related)
    are underestimated and cause knock-on effects? Not only can you slip and fall
    overboard—what about the scenario of the boat capsizing and the rescue party ashore
    not being able to mobilize to save you?

