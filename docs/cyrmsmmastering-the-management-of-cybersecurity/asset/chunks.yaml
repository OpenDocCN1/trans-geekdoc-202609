    \ to a 2014 breach. The FTC alleged that the company made deceptive claims about\
    \ its efforts to safeguard customer information and failed to undertake “reasonable,\
    \ low-cost measures” to prevent unauthorized access to customers’ personal data.\
    \ Meanwhile, the FTC has confirmed that it is currently scrutinizing Uber’s response\
    \ to the 2016 breach, which the company only recently disclosed.[^(22)](#fn22)\n\
    \n The FTC also previously brought a case against Oracle for disclosure issues,\
    \ claiming that the company failed to inform consumers that newer software updates\
    \ would not automatically remove older (and potentially exploitable) versions\
    \ of Oracle’s Java software. Last year the Consumer Financial Protection Bureau\
    \ (“CFPB”) ordered Dwolla, Inc., a company that operates an online payment system,\
    \ to pay a penalty and improve its security practices after the company allegedly\
    \ misrepresented to consumers that its networks were “safe” and “secure,” and\
    \ that its data security practices “exceed” or “surpass” industry security standards.\n\
    \nAdditionally, while there is no national “data breach notification” law as of\
    \ yet, the vast majority of states have enacted laws that require entities to\
    \ notify affected individuals in the event of certain cybersecurity breaches involving\
    \ sensitive consumer and personally identifiable information.[^(23)](#fn23)\n\n\
    Uber may well be the most egregious example of delayed disclosure and “what not\
    \ to do.” The company failed to notify regulators and individuals affected by\
    \ the breach for nearly a year, possibly in violation of state notification laws.\
    \ Moreover, Uber allegedly made non-disclosure of the breach a condition of its\
    \ ransom payment to the cybercriminals, only further perpetuating the image of\
    \ a cover up.\n\nSeveral states’ attorneys general have already initiated investigations\
    \ into the breach.\n\nThe key takeaway is that it is absolutely essential for\
    \ companies to review the adequacy and timeliness of their cyber disclosures on\
    \ an ongoing basis. There is no “one-size-fits-all” answer. The advice of experienced\
    \ disclosure counsel is crucial.\n\n### **7\\. Understand Third-Party Vulnerabilities**\n\
    \nIf recent events have taught us anything, it is that a company’s cybersecurity\
    \ protocols are all for naught if the company fails to ensure that third-party\
    \ service providers also implement adequate cyber risk management systems. All\
    \ too often, the entry-point for the cyber criminals is a third party who has\
    \ access to the company’s systems or nonpublic data.\n\nHome Depot, for example,\
    \ is still feeling the reverberations from a 2014 cyber incident in which hackers\
    \ took advantage of a security flaw  in a third- party payment processor to steal\
    \ email and payment information of more than 50 million Home Depot customers.\
    \ Hackers similarly used a third-party vendor to access Target’s customer database\
    \ in 2013 and stole payment information from approximately 40 million customers.[^(24)](#fn24)\n\
    \nThe recent example of Deloitte demonstrates why companies should pay attention\
    \ to professional service firms in particular when it comes to third-party cyber\
    \ risk. Professional service firms—such as law firms, auditors, and consultants—are\
    \ particularly vulnerable because their databases and cloud computing applications\
    \ often contain sensitive information from many different clients and business\
    \ partners, all in one convenient location for cyber criminals to exploit. The\
    \ information professional service firms possess is an appealing target for cyber\
    \ criminals because it is relatively easy to monetize through illegal trading.\
    \ Such information may also be an attractive target for hacktivists.\n\nThe 2015\
    \ “Panama Papers” scandal was one of the first major incidents to shed light on\
    \ law firm cyber vulnerabilities. The compromised firm, Mossack Fonseca, had helped\
    \ hundreds of U.S. clients establish offshore businesses. The hack compromised\
    \ the sensitive information of Mossack Fonseca’s high-profile clients, dating\
    \ as far back as the 1970s, and left many companies who had worked with the firm\
    \ exposed.[^(25)](#fn25)\n\nBecause third parties often have access to highly\
    \ sensitive company information, they should be subject to a rigorous third-party\
    \ cyber risk assessment before companies engage them.\n\nDirectors do not need\
    \ to be aware of the nitty gritty details of each and every contract for services,\
    \ but they should ensure that the company has a written vendor risk management\
    \ policy in place for addressing third parties’ access to company systems and\
    \ sensitive nonpublic data. At bottom, the policy should ensure that management\
    \ conducts proper due diligence and is aware of the risks of doing business with\
    \ particular vendors. The company should also routinely reassess third-party risk\
    \ and ensure that third-party service providers are in fact complying with their\
    \ obligations.\n\nBoards should also be aware of the risks associated with providing\
    \ the government with sensitive nonpublic information. The breach  of the SEC’s\
    \ EDGAR database raises serious questions about how much sensitive company data\
    \ should be held by market regulators and whether the government, with its limited\
    \ resources, can protect such data.[^(26)](#fn26)\n\n### **8\\. Consider Methods\
    \ to Transfer Cyber Risk**\n\nCybersecurity is not a problem to be solved—it’s\
    \ an ongoing risk to be managed and, where prudent, transferred. As part of the\
    \ risk management effort, the board should carefully review existing contracts\
    \ with third-party vendors and insurance policies.\n\nThese agreements must clearly\
    \ state who is liable and what is covered in case of a breach.\n\nAlthough cyber\
    \ insurance is still in its nascent stages, with little actuarial data, it is\
    \ one of the fastest growing types of coverage among U.S. companies— and with\
    \ good reason.[^(27)](#fn27)\n\nIn its annual report filed with the SEC earlier\
    \ this year, Target Corporation reported that it had incurred $292 million in\
    \ cumulative expenses in connection with the 2013 data breach of its systems,\
    \ which resulted in the massive theft of customers’ credit card information.\n\
    \nAccording to the company, this total amount was offset, in part, by $90 million\
    \ in insurance payments.[^(28)](#fn28)\n\nIn addition to the obvious potential\
    \ benefit of a monetary insurance recovery, seeking cyber insurance may result\
    \ in ancillary advantages for companies. A company that is in the market for cyber\
    \ insurance  will be incentivized to use best practices, as premiums will be based,\
    \ at least to some extent, on the company’s effective use of protective measures.\
    \ The application process alone may require an in-depth evaluation of a company’s\
    \ existing cyber program. Through this process, the company may gain a better\
    \ appreciation of its own cyber risks and opportunities. Boards should also be\
    \ aware that insurance carriers often offer tools to help companies respond to\
    \ cybersecurity incidents and mitigate post-breach losses, should the need arise.\n\
    \nBoards are commonly in a position to have the final say on whether a company\
    \ should purchase cyber insurance. Making this decision as a board may require\
    \ navigating some new terrain. You must determine what is, and should, be covered,\
    \ and what is not, and need not, be covered. You also need to determine whether\
    \ a particular premium is fair. One question boards should ask is whether existing\
    \ insurance policies may cover certain events."
