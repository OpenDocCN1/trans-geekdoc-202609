- fmt: "\nFirst, there has been a previously unimaginable explosion in the amount\
    \ of data, connections, transactions, and communications that has overloaded traditional\
    \ data systems.\n\nSecond, institutions have lost the ability to effectively identify\
    \ problems. Faster innovation cycles and a dizzying array of new products mean\
    \ that most businesses find themselves unable to quickly recognize security breaches.\
    \ Social networking systems, big data, cloud computing, mobile internet, and Internet\
    \ of Things technologies are generating personal data streams that have made authorization\
    \ and message filtration extraordinarily difficult.\n\nThird, there’s a lack of\
    \ formal control mechanisms. In an environment where cybersecurity disruptions\
    \ are becoming more pervasive and sophisticated, there are still no recognized\
    \ standards for detection, response, remediation, and enterprise-wide communication.\
    \ The management of these critical functions is often left to the IT department,\
    \ which is usually directed to pursue outdated, hardened-shell strategies designed\
    \ only to discourage penetration.\n\nArmed with decades of experience as a leader\
    \ in risk management, I examined this landscape, and it became clear to me that\
    \ we need an information security model that continually assesses the validity,\
    \ reliability, and value of the information it gathers. I developed and honed\
    \ that security model into a process that I know can help companies avoid the\
    \ worst pitfalls of a cyberattack. It’s called cyber risk management, or `CyRM℠`.\n\
    \n`CyRM℠` is a new paradigm that approaches security as a business problem and\
    \ aligns it with business needs. So, instead of viewing security as a technical\
    \ problem handled by technical people, it uses an outcome-driven approach that\
    \ balances investment and risk. Even further, instead of throwing money at the\
    \ problem at the expense of executive engagement, it connects cybersecurity with\
    \ business decision-making to impact business outcomes.\n\nTo effectively impact\
    \ business outcomes, `CyRM℠` needs to consist of three prongs:\n\n1. **Risk Management:**\
    \ It needs to apply the tenets of risk management to cybersecurity in order to\
    \ take a broad view of risks across an organization to inform resource allocation,\
    \ better manage risks, and enable accountability.\n2. **CyberWellness℠:** It needs\
    \ to encompass not only the firm as a whole, but also every employee who needs\
    \ to be responsible for the risks they undertake. This requires an active process\
    \ with cybersecurity—just like physical wellness programs in which the company\
    \ takes an active approach to promoting employees’ good health.\n3. **Cybersecurity\
    \ as a Business Strategy:** Cybersecurity needs to be repositioned for what it\
    \ really is—a growth enabler, and not just designed to reduce operational risks\
    \ by eliminating the dangers posed by viruses and hackers. It also needs to enhance\
    \ product integrity, customer experience, operations regulatory compliance, brand\
    \ reputation, and investor confidence.\n\nThis book lays out my approach to `CyRM℠`\
    \ and shows you—business leaders and IT managers alike—how to work together and\
    \ succeed. Each chapter of this book tells you what you need to know about managing\
    \ the current cybersecurity landscape. And each chapter ends with `CyRM℠` Action\
    \ Points—proactive steps you can take to prepare yourself and your company to\
    \ survive and succeed. I’m looking forward to being your educator and guide as\
    \ we delve into `CyRM℠`.\n\n# 1 The Current Landscape\n\nOn September 7, 2017,\
    \ one of the nation’s largest credit monitoring agencies, Equifax, announced that\
    \ more than 143 million customer accounts had been breached in what may be the\
    \ most significant cyberattack to impact US consumers to date. The number of affected\
    \ individuals has since risen to an estimated 147 million people.\n\nAmid the\
    \ Equifax controversy, the US Securities and Exchange Commission (`SEC`) Chair\
    \ Clayton announced on September 20, that the `EDGAR` system had been penetrated.\
    \ Since then, the `SEC` has raised questions about the safety of its systems.\n\
    \nHigh-profile attacks continue to happen. In the case of `Game of Thrones`, the\
    \ `HBO` network was breached pilfering 1.5 terabytes of information. `Deloitte`,\
    \ one of the \"Big Four\" accounting firms, notified clients its internal email\
    \ system was compromised. `Uber` took more than a year to admit it had been hacked,\
    \ paying a ransom to delete the purloined data.\n\nLarge-scale data breaches continue\
    \ every year. In 2019, `Capital One` revealed a single hacker gained access to\
    \ 100 million customer accounts. `Quest Diagnostics` revealed access to medical\
    \ information of twelve million patients. Approximately one year after the Cambridge\
    \ Analytica scandal, `Facebook` admitted to unintentionally making more than one\
    \ million user emails. \n\nIn 2020, the `Citizen Lab` (associated with the University\
    \ of Toronto) exposed a group of mercenary hackers dubbed `Dark Basin`, based\
    \ in New Delhi. These for-hire hackers went after `Exxon` and a German company\
    \ called `Wirecard`. In 2020 hackers broke into `Lockheed Martin`, one of the\
    \ largest US defense contractors, by targeting remote workers. All hackers need\
    \ to gain access to a company is one vulnerable point; once they find that, they\
    \ can seize control of a whole network and steal data and secrets.\n"
