- fmt: "\nIf the business makes technology decisions without the IT department's input,\
    \ or IT makes business decisions without including senior management's business\
    \ goals, alignment is impossible. As business needs and organizational priorities\
    \ change, the senior management team will react by developing strategies that\
    \ work for them, but they’ll give little thought to including IT in supporting\
    \ these changes.\n\nEach department and senior executive sees business problems—and\
    \ opportunities—through their own functional perspective. Alignment is no exception.\
    \ Unfortunately, functional silos often fail to communicate and share their perspectives\
    \ with one another. Board members should be in the unique position to see the\
    \ big picture—and to evaluate whether everyone's role, including IT’s, is clear\
    \ to all.\n\nIn making good decisions, one needs to gather information that’s\
    \ pertinent to the problem. It's important to cast a wide net in order to fully\
    \ comprehend both the importance and the urgency of the problem. Gathering plenty\
    \ of information from a variety of sources will also help generate ideas for potential\
    \ solutions.\n\nIt's important not to evaluate potential solutions too soon in\
    \ the process. Sometimes ideas that seem off the wall or crazy at first turn out\
    \ to be great possibilities upon further consideration. Management guru Peter\
    \ Drucker used to say, “Organizations need two kinds of people: bureaucrats and\
    \ lunatics. Innovation always comes from the lunatics—never the bureaucrats.”\
    \ So be sure to determine that senior management is consulting with the company’s\
    \ “wild and crazy guys” as they solicit ideas for possible solutions.\n\nIn evaluating\
    \ senior management’s options for action, you need to determine how a potential\
    \ decision will effect everyone else involved. Ask yourself: “What are the likely\
    \ results of this decision? How will it affect the business now? And how will\
    \ it affect it in the future?”\n\n**Caution**: an IT department's answers to these\
    \ questions can sometimes be confusing. There are words and terms that are part\
    \ of the information security culture that don’t easily translate to people without\
    \ a deep industry background. Further, IT staff have a predisposition toward focusing\
    \ on technology versus nontechnology factors when there’s a problem to address.\
    \ When issues come up—as they do at an incredible rate in IT—they assume they’re\
    \ either technology-related or can be solved with technology or sequentially,\
    \ which is how most IT issues are resolved.\n\n## Take Action\n\nOnce you've evaluated\
    \ options and are comfortable with senior management’s decision, it’s important\
    \ to evaluate whether everyone required takes action. It’s critical for senior\
    \ management to continually evaluate the decision and the actions that have been\
    \ taken to ensure that everything is working as planned. This step is also fundamental\
    \ because it may require senior management to seek out new information and make\
    \ adjustments and further changes along the way.\n\nIT risks are measured and\
    \ evaluated differently from business risks, which impacts the decision-making\
    \ process. IT risk is measured in terms of performance, cost, or time to implement.\
    \ When decisions concerning the appropriate level of service are made by IT, they’re\
    \ likely to opt for the highest levels of service—because IT is usually judged\
    \ on performance reliability.\n\nWhereas generating real business value requires\
    \ different metrics to determine success—and the highest level of service may\
    \ not be required. Since IT allocates its costs, it often needs to track and manage\
    \ costs differently, which can cause profound disconnects.\n\n## Manage the Alignment\n\
    \nIt’s important for board members to assess whether:\n\n* IT leaders are given\
    \ the opportunity to change their department’s role from “service provider” to\
    \ “trusted partner”.\n* IT strategy is developed in a broader context that understands\
    \ how services are supporting growth.\n* IT-related decisions shouldn’t be made\
    \ in isolation, without knowing business needs.\n* IT strategy should be a continuation\
    \ of business strategy, including the business alternatives.\n* The impact of\
    \ IT on a company’s business requires ongoing dialogue. \n\nIn short, to compete\
    \ effectively in today’s technology-driven world, companies need to get the alignment\
    \ right.\n\n# Cybersecurity for Senior Executives and Board Members\n\nAlthough\
    \ cybersecurity isn’t a new challenge for boards of directors, the sheer scope\
    \ and volume of recent events suggest that we may be experiencing a watershed\
    \ moment when it comes to directors’ responsibility to oversee—and managers’ duty\
    \ to implement—adequate cybersecurity systems. Following Equifax’s public disclosure\
    \ of the cyberattack affecting its systems in 2017, observers learned a good deal\
    \ about warnings.\n\nThe first lesson is that companies must pay attention to\
    \ routine alerts warning of cyber vulnerabilities in the company’s systems and\
    \ in software the company uses. Think back to the examples of high-profile cyberattacks\
    \ I referenced in Chapter 1: Equifax, Uber, HBO, and Deloitte. In Equifax’s case,\
    \ hackers apparently exploited a known network vulnerability in the Apache Struts\
    \ web-application software, which Equifax used to build its web applications.\
    \ The US Department of Homeland Security’s United States Computer Emergency Readiness\
    \ Team (`USCERT`) notified Equifax and many others of this vulnerability and the\
    \ need to patch the software on March 8, 2017. Although the company disseminated\
    \ the `USCERT` notification internally by email and requested that appropriate\
    \ personnel apply the patch, the patch was apparently not installed, or not installed\
    \ correctly, and follow-on scans of the system one week later failed to reveal\
    \ the error. A good `CyRM` protocol regularly checks those alerts.\n\nThe second\
    \ lesson for board members is that companies must ensure they have appropriate\
    \ systems in place to escalate information about potential cyber incidents. For\
    \ example, does the general counsel have a process for imposing a freeze on trading\
    \ in the company’s securities by individuals with insider knowledge of material\
    \ breaches during key windows of time? In Equifax’s case, it was revealed that\
    \ several executives had traded in the company’s stock after the breach had been\
    \ reported internally, but before the public had knowledge of the breach. This\
    \ raised questions about possible insider trading and a lack of internal controls\
    \ at a time when Equifax was already subject to intense public scrutiny. (The\
    \ executives have since been cleared of wrongdoing by a special committee at Equifax\
    \ tasked with analyzing the breach.)\n"
