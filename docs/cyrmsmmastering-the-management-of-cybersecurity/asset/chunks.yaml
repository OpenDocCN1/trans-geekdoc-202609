- fmt: '

    The FTC also previously brought a case against Oracle for disclosure issues, claiming
    that the company failed to inform consumers that newer software updates wouldn’t
    automatically remove older (and potentially exploitable) versions of Oracle’s
    Java software. Last year the Consumer Financial Protection Bureau (CFPB) ordered
    Dwolla Inc., a company that operates an online payment system, to pay a penalty
    and improve its security practices after the company allegedly misrepresented
    to consumers that its networks were “safe” and “secure,” and that its data security
    practices “exceeded” or “surpassed” industry security standards.


    Additionally, while there’s no national “data breach notification” law as of yet,
    the vast majority of states have enacted laws that require entities to notify
    affected individuals in the event of certain cybersecurity breaches involving
    sensitive consumer and personally identifiable information.


    Uber may well be the most egregious example of delayed disclosure and “what not
    to do.” The company failed to notify regulators and individuals affected by the
    breach for nearly a year, possibly in violation of state notification laws. Moreover,
    Uber allegedly made nondisclosure of the breach a condition of its ransom payment
    to the cybercriminals, only further perpetuating the image of a cover-up. Several
    states’ attorneys general have already initiated investigations into the breach.


    ### Key Takeaways


    The key takeaway is that it’s absolutely essential for companies to review the
    adequacy and timeliness of their cyber disclosures on an ongoing basis. There’s
    no “one-size-fits-all” answer. The advice of experienced disclosure counsel is
    crucial.


    If recent events have taught us anything, it’s that a company’s cybersecurity
    protocols are all for naught if the company fails to ensure that third-party service
    providers also implement adequate cyber risk management systems. All too often,
    the entry point for the cybercriminals is a third party that has access to the
    company’s systems or nonpublic data.


    ### Case Studies of Third-Party Risks


    Home Depot, for example, is still feeling the reverberations from a 2014 cyber
    incident in which hackers took advantage of a security flaw in a third-party payment
    processor to steal email and payment information of more than 50 million Home
    Depot customers. Hackers similarly used a third-party vendor to access Target’s
    customer database in 2013 and stole payment information from approximately 40
    million customers.


    The example of Deloitte demonstrates why companies should pay attention to professional
    service firms in particular when it comes to third-party cyber risk. Professional
    service firms—such as law firms, auditors, and consultants—are particularly vulnerable
    because their databases and cloud computing applications often contain sensitive
    information from many different clients and business partners, all in one convenient
    location for cybercriminals to exploit. The information that professional service
    firms possess is an appealing target for cybercriminals because it’s relatively
    easy to monetize through illegal trading. Such information may also be an attractive
    target for hacktivists.


    The 2016 “Panama Papers” scandal was one of the first major incidents to shed
    light on law firm cyber vulnerabilities. The compromised firm, Mossack Fonseca,
    had helped hundreds of US clients establish offshore businesses. The hack compromised
    the sensitive information of Mossack Fonseca’s high-profile clients, dating as
    far back as the 1970s, and left many companies that had worked with the firm exposed.
    We saw a similar set of circumstances unfold in the “Paradise Papers” scandal
    involving the release of confidential client information from the Appleby law
    firm.


    ### Risk Management Strategies


    Because third parties often have access to highly sensitive company information,
    they should be subject to a rigorous third-party cyber risk assessment before
    companies engage them. Directors don’t need to be aware of the nitty-gritty details
    of each and every contract for services, but they should ensure that the company
    has a written vendor risk management policy in place for addressing third parties’
    access to company systems and sensitive nonpublic data. At the very least, the
    policy should ensure that management conducts proper due diligence and is aware
    of the risks of doing business with particular vendors. The company should also
    routinely reassess third-party risk and ensure that third-party service providers
    are in fact complying with their obligations.


    Boards should also be aware of the risks associated with providing the government
    with sensitive nonpublic information. The breach of the `SEC`’s `EDGAR` database
    raises serious questions about how much sensitive company data should be held
    by market regulators and whether the government, with its limited resources, can
    protect such data. When possible, companies should consider providing information
    on encrypted physical media versus through secure file transfer.


    Cybersecurity isn’t a problem to be solved—it’s an ongoing risk to be managed
    and, where prudent, transferred. As part of a company’s risk management effort,
    its board should carefully review existing contracts with third-party vendors
    and insurance policies. These agreements must clearly state who’s liable and what’s
    covered in case of a breach.


    ### Cyber Insurance


    Although cyber insurance is still in its nascent stages, with little actuarial
    data, it’s one of the fastest growing types of coverage among US companies—and
    with good reason. The costs associated with a cyberattack can be game-changing
    for a company. A recent study conducted by Ponemon Institute shows that the average
    cost globally of a data breach is $3.62 million. Victims of large-scale cyberattacks
    could expect to add several zeros to that figure, as damage to reputation, costs
    of notification, and protracted litigation quickly add up.


    In its annual report filed with the `SEC` earlier this year, Target Corporation
    reported that it had incurred $292 million in cumulative expenses in connection
    with the 2013 data breach of its systems, which resulted in the massive theft
    of customers’ credit card information.


    According to the company, this total amount was offset, in part, by $90 million
    in insurance payments. Similarly, in 2017, FedEx’s Dutch subsidiary was hit by
    the “NotPetya” virus, which caused a temporary shutdown in the company’s operations
    and led to a $300 million hit to its quarterly profit. FedEx didn’t have insurance
    coverage for the attack, and FedEx’s chief financial officer has since revealed
    that the incident triggered an internal reevaluation as to whether the company
    should purchase cyber insurance moving forward.


    In addition to the obvious potential benefit of a monetary insurance recovery,
    seeking cyber insurance may result in ancillary advantages for companies. A company
    that’s in the market for cyber insurance will be incentivized to use best practices,
    as premiums will be based, at least to some extent, on the company’s effective
    use of protective measures. The application process alone may require an in-depth
    evaluation of a company’s existing cyber program. Through this process, the company
    may gain a better appreciation of its own cyber risks and opportunities. Boards
    should also be aware that insurance carriers often offer tools to help companies
    respond to cybersecurity incidents and mitigate post-breach losses, should the
    need arise.

