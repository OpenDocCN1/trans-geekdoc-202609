    8. 8 *参见*，纽约时报，《Uber 隐藏了 2016 年泄露，向黑客付费以删除被盗数据》（2017 年 11 月 21 日），[`www.nytimes.com/2017/11/21/technology/uber-hack.html?mtrref=www.google.com&gwh=34D070015500C54F741A1922ED2C7834&gwt=pay`](https://www.nytimes.com/2017/11/21/technology/uber-hack.html?mtrref=www.google.com&gwh=34D070015500C54F741A1922ED2C7834&gwt=pay)。\n\
