  trans: '


    信不信由，真实的事件是几个已知的案例，犯罪分子接管了超过百万台计算机。已知最大的机器人网络是 `Bredolab`，包含超过 3000 万台计算机。它由一个黑客网络创建，通过将被劫持计算机的时间租给其他犯罪组织来获利。在巅峰时期，它每天能发送超过三十亿封受感染邮件。


    现在考虑以下场景。


    ## 应用 CyRM


    根据此场景的事件，你会监控什么，你会采取哪些潜在的管理行动步骤？例如，作为第一步，监控这些攻击并了解自己相对于需要保护的资产资产的脆弱性并不困难。其次，也许可以聘请网络过滤服务，扫描表现出异常行为的网站并阻止用户访问这些网站。或者可能统一使用
    `Google Chrome` 或 `Mozilla Firefox` 以外的浏览器（这两种是流行的浏览器，因此恶意软件都是针对它们编写的）。同样，重要的是从四个步骤来思考决策过程：形势评估、规则、做出决策以及事后重新评估。记住，犯“错失性错误”（你研究了问题，考虑了所有替代方案，但走了一条错误的路）远比犯“遗漏性错误”（你甚至没有考虑过潜在问题）好得多。


    ## 结论


    在如今太多的公司中，参与网络安全是一件事后考虑的事，被额外补在人们每天的工作上，以希望创造一个安全的环境。我们都知道这种方法是不可通的。网络安全并没有被视为一个业务问题来处理，然后与业务需求对齐。此外，没有人在网络安全中采取主动进攻——只有防守，而且公司正关注着他们无法控制的昨天的问题和威胁。我们都知道，真正的失败往往没有被用作学习经验，也没有获得足够的关注来产生改变。


    更进一步，董事会和高管层错误地认为合规性会拯救他们，但实际上，合规并不等同于适当的保护水平。遗憾的是，对于“我的公司足够足够？”这个问题，今天还没有简单的答案。高管决策与
    IT 专业人员在网络安全方面也存在真实的脱节，这应该让更多的人彻夜难眠，因为每一个新的估算都增加了新威胁的水平。网络安全不仅仅是一个需要做对的重要问题——它是一个“必须做对”的问题。心态必须发生转变，从对抗昨天的战争转向识别并准备应对今天和明天的威胁。


    真正需要一支拥有所有不同角色和职的军队来提供适当的 `CyRM`。不同的人有许多角色：董事会、C 级高管、`CISO`、IT 员工、风险管理人员、审计师以及公司的每位员工。这是一支来自不同背景、财富和教育经历的人员军队，但每个参与者都有共同的目标，这就是为什么它运行得如此良好。


    我们在网络安全领域都缺少一个共同的目标：对 `CyRM` 的真正承诺。对我来说，通过 `CyRM` 掌握网络安全管理的重要性，就像试图解释“参与”与“承诺”的区别一样。这就像一份培根早餐——鸡是参与了，但猪是承诺了。你必须承诺。你必须在你的公司建立对
    `CyRM` 的承诺。在整本书中，我强调安全*不应该*被视为由技术人员处理的技术问题。很多时候，这都是关于投入资金寻求技术解决方案，而以牺牲高管的参与为代价。网络安全是一个管理问题。要取得成功，你必须将安全视为一个业务问题，并将网络安全与业务决策联系起来，以影响业务结果。记住，`CyRM`
    为了有效影响业务结果，需要由三个部分组成：


    1. **风险管理：** 将风险管理的原则应用于网络安全，以便从组织的整体角度观察风险，以指导资源分配、更好地管理风险并实现问责制。

    2. **网络健康 (CyberWellness)：** 它不仅应该涵盖整个公司，还涵盖每位员工，他们需要对自己承担的风险负责。这需要一个活跃的安全过程——就像公司采取积极措施促进员工健康的健康计划一样。

    3. **作为业务战略的网络安全：** 网络安全需要重新定位其真实本质：增长的者，而不仅仅是通过消除病毒和黑客带来的危险来减少运营风险。它还需要增强产品完整性、客户体验、运营合规性、品牌声誉和投资者信心。


    我写这本书是因为我热衷帮助业务领导者通过关键的网络风险管理工具——`CyRM` 让他们晚上睡得更好，这些工具在保护他们企业的同时增强战略性的业务增长。在 `PwC`、`AllianceBernstein`、`Citibank`
    等机构担任财务领导者的四十年经验，为平衡风险的现实与业务的机会提供了基础。技术渗透到今天所有的运营中，从业务的运行方式到它交付价值和成功的方式。技术也威胁着这些所有方面。那么，我们如何在这个危险的环境中蓬勃发展呢？


    我的答案是在你的公司中建立对 `CyRM` 的承诺。我列出了我的 `CyRM` 方法，并向你们——无论是业务领导者还是 IT 经理——展示了如何合作并取得成功。在每一章中，我都强调了你们在应对当今危险形势时需要了解的知识，并概述了你们为准备公司所需的积极步骤——为了生存，甚至繁荣。


    管理咨询先驱 `W. Edwards Deming` 曾说：“改变不是必要的。生存不是强制的。”我们都知道他的意思。鉴于过去几十年变化的指数级速度和强度，这在今天比在戴明的时代要真实得多。适应，或灭亡。


