    `Roel C. Campos` 是华盛顿特区 Hughes Hubbard & Reed 律师事务所的合伙人，并担任证券执法部门主席。Campos 先生的业务范围包括为高级管理层和董事会就最敏感且复杂的问题提供建议。他的工作通常涉及进行内部调查以及应对涉及金融监管机构的案件，例如
    `SEC`、`DOJ`、`CFTC` 和 `FINRA`。他还负责就网络安全、治理、加密货币以及金融监管机构拟定的规则等事项向董事会提供建议。


    从 2002 年开始，Campos 先生两次获得总统乔治·W·布什的任命并经美国参议院确认为 `SEC` 委员，任职至 2007 年。


    在被 `SEC` 委员之前，Campos 先生曾与合伙人一起从事风险投资，并担任过高管且运营过一家广播公司。


    在从哈佛法学院毕业后，他在洛杉矶的一家大型律所工作。Campos 先生还曾在洛杉矶的`美国检察官办公室`任职。他起诉过大型毒品集团，并在一次著名的审判中，判定了几名毒品集团头目绑架并杀害一名
    `DEA` 探员。


    ![](img/figu12_4_B.jpg)


    `David X Martin` 是网络安全专家，曾与 `FBI` 及大型企业共同主持了一项关于情报共享和最佳实践的公私合作倡议；曾为`以色列中央银行`就金融机构的网络安全审计提供咨询；曾担任一家上市公司信息安全委员会主席；担任
    `Oliver Wyman` 的网络安全高级顾问；并发表了许多关于管理网络安全的创新方法的文章。他是网络安全咨询与开发公司 `cybXsecure` 的联合董事。


    Martin 先生是公认的风险管理和估值问题专家，在投资策略与运营、定量研究、交易所以及交易台监管方面拥有丰富经验。他是`投资公司协会风险委员会`的创始主席以及`买方风险委员会`的共同主席。他是一位资深金融高管，40
    年的职业生涯包括在`普华永道 (PWC)`、`花旗银行`和`AllianceBernstein`担任高级职位，在这些机构中他曾担任首席风险官和 `Sanford
    Bernstein LLC` 的董事。


    Martin 先生还是 `纽约大学 (NYU)` 和 `福特汉大学商学院`的客座教授，2010 年秋由 `McGraw Hill` 出版的《风险与精明的投资者》（Risk
    and the Smart Investor），以及 2012 年由 `Amazon` 出版的《风险的本质》（The Nature of Risk）。他还发表了许多关于网络安全、合规与风险、企业风险管理以及公司治理的白皮书。


    Martin 先生担任美国国务院`国际经济政策咨询委员会制裁小组小组`的成员，并担任`金融稳定中心`负责网络安全和新兴风险的特别顾问。


    ## 引言


    本文档的目的是为董事会提供一套指导原则，以便能够实施有效的网络安全计划。


    董事应当了解其公司面临的全方位网络风险，并鼓励管理层根据公司的运营环境、风险状况和长期目标制定相应的策略。


    任何有效的网络安全计划的特定需求都包括周密的计划、明智的授权以及合规监控系统——这些都是董事应该监督的。现在已经不再是公司“是否”会受到攻击的问题，而是“何时”会发生这个问题——以及组织将如何防止。


    智能网络监控、早期预警指标、多层防御以及从过去事件中吸取的教训，都是真正的网络韧性的关键组成部分。当问题发生时（无论大小如何），快速识别和响应问题的能力将决定公司的最终恢复情况。


    网络安全无法得到保证，但及时恰当的反应是可以保证的。


    从长远来看，董事会应该理解并考虑网络安全的战略业务影响，培养围绕安全的正确公司文化，并鼓励整合网络风险实践。从本质上说，董事会应该将网络安全视为一个管理问题，而不仅仅是一个技术问题。


    ### 董事应将网络安全视为其必须监督的企业风险的重要组成部分


    1. 识别组织可能受攻击的关键资产（“皇冠上的宝石”）。

    2. 确定要避免哪些网络风险、接受哪些风险、以及规缓哪些风险。

    3. 针对每种方法制定具体的计划。


    网络安全中没有进攻策略——只有防御策略。此外，董事会成员的关要任务是首先确定哪些资产最有价值，其次是采取最有效的策略来保护这些资产。一旦董事会确定了需要保护的价值，就可以进行优先排序并分配资源。


    定义组织的风险承受能力是一项复杂的挑战，因为它要求所有人员对以下项目充满信心：


    * 了解他们的信息资产清单是完整且实时的

    * 确定用于优先考虑这些资产价值的流程是准确且适当的

    * 理解为保护最重要资产（例如“皇冠上的宝石”）所采取的关键行动的有效性

    * 对其他风险缓解项目（如保险）的条款和条件有全面的掌握，并对保险和其他缓解措施在何情况下将失效有相应的知识

    * 对发生网络事件时将触发的业务响应和连续性计划的规模和稳健性有深入理解


    上述五个要素代表了风险能力计算中组成要素的示例，董事和高级管理层需要持续执行这些计算。前三项对董事来说至关重要，以确保他们知道管理层投入了哪些计划、投资和资源来保护最有价值的资产，因为这些资产被盗、未经授权的访问或损坏可能代表生存性风险。


    最后两项也作为输入纳入能力计算中，因为缓解行动（如第三方网络保险和远程备份设施）的成本和收益同样重要。这些传统的风险管理活动在组织评估其承受或应对预定义的业务连续性事件的能力方面发挥着重要作用。


    业务连续性框架可以帮助对网络泄露发生后需要恢复的资产优先顺序获得洞察。当然，任何预定义的事件估计都可能与实际情况不符，但组织可以使用频繁的模拟攻击，以识别并评估其他“不那么重要”的资产是否从风险缓解的角度得到了适当的评估。


