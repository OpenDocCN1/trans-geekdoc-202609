    # 数据保护


    当我们将焦点从 IT 基础设施转移到需要保护的数据时，第一步是定义哪些是关键数据。一旦定义，你就可以使用新的、经过验证的解决方案来控制数据的处理和分发。


    例如，加密可以帮助确保数据在静态存储或动态传输过程中都是安全的。但它并不是万无一失的，因为一旦网络攻击者利用窃取的的用户凭据侵入网络，加密就会变得无用武处。


    数据掩码（隐藏特定数据的过程）是另一个实用的工具。数据掩码可以通过多种方式实现：用户执行请求时动态地模糊数据；通过复制数据来消除需要隐藏的数据子集；或者仅仅对用户或第三方对数据进行掩码。


    控制数据的另一种方法是使用数据泄露防护（DLP）解决方案，它可以提供有关敏感数据移动的准确信息——在在未授权终端上发现数据时，甚至阻止其传输或删除。使用 `DLP`
    解决方案对数据进行持续监控可以及时识别泄露并限制造成的损害。这种以数据为中心的安全策略、关注数据安全性的范式转变，将改变你的企业文化。以下是你可以这样做。


    ## 让用户参与进来


    从历史上看，任何与 IT 安全有关的事情都被 IT 团队隔在用户之外。难怪用户对公司的安全性表现出毫无兴趣或完全不感兴趣。


    事实上，用户是数据安全的前线。他们创建并处理数据，最能理解数据的价值。例如：安联爱尔兰（Allianz Ireland）强制用户在共享文档或发送电子邮件之前选择数据分类。该公司在短短几个月内经历了快速的文化转变，结果导致员工对数据安全实践的意识提升了
    60%，数据泄露事件减少了 89%。


    ## 让员工参与到应用中


    如今的网络安全风险培训侧重于钓鱼计划，而不是保护数据。大多数培训计划都不吸引人、没意思也不有趣。它们试图用模糊的“是/否”问题进行教学，而且通常 80% 的问题答案都是“是”。只要回答了所有问题，没有人会不及格。无聊了！现在假设网络安全培训是一个视频游戏，你正在有趣地扮演一个坏人，他偷了有效的用户凭据，现在正试图偷取公司数据。你根据成功窃取数据的程度获得积分。


    这种游戏具有很高的参与性，在课程结束时，你会获得一个分数，如果分数足够高，还可以获得奖励。更好的是，公司现在有了有效数据来确定员工的网络意识——这些信息可以用于帮助购买网络保险。


    ## 让多样性成为安全文化的一部分


    自我意识和自觉是改变任何不理想行为或态度的第一步。员工与安全相关的决策受到他们的多样性、背景、对讨论问题的开放程度以及对社区态度的影响。但海报、屏幕保护程序，甚至是面对面的小组评审，也几乎无法影响你的员工判断威胁的能力。


    假设发生了数据泄露，并将其作为每个人的学习经验。与其仅仅制作一个 PowerPoint，为什么不


    ## 网络安全作为一种业务战略


    ## 信任将成为竞争优势


    当我开始在花旗银行（Citicorp）工作时，生意是通过握手达成的；你的话被视为信誉。现在许多调查显示，人与人、企业与机构之间的信任已经下降。位列顶首的是大规模网络攻击和破坏信任的社交媒体的发展。列表中还包括导致人们无法进入房屋的技术故障。在我们节奏快速、匿名的数字世界里，公司的产品信息随处可见。正如一位客户服务专家所说，“客户是连接且危险的。”坏消息的传播比以前任何时候都快。“与众”越来越不再是一种竞争优势。相反，客户对你公司的信任是新的领域通货。


    有一个信任失败令我记忆犹新。当三星 Galaxy Note 7 在 2016 年 8 月首次进入测评周期时，共识是“它可能是有史以来设计最好的智能手机”。那是第一部手机爆炸之前，因为电池倾向于同时燃烧。发布一个月后，已有报告称至少
    35 台手机起火。三星发布了一份谦逊且道歉的声明，宣布它将召回 Note 7 并提供更换设备。好吧，但那些更换设备也开始起火，其中至少有一个在飞机上。美国运输安全管理局（TSA）禁止了所有的
    Note 7。如果你在那个秋天旅行过，可能还记得。最终，三星召回了所有手机，并发送了软件更新，使现有设备变得无用。公司最终决定对其爆炸的手机负责，并通过更换不同型号来补偿，这可能挽救了公司的声誉。瑞信集团的分析师估计，这些损失让三星花费了整整
    170 亿美元。这还没提到他们失去的消费者信任。


    同样重要——也许更重要——信任包含了保护个人数据。为了获得业务，每家公司都必须通过真正可靠来赢得客户的信任。客户会问：“我可以相信网络安全是首要任务，我的交易、信息和个人数据是准确、安全且私密的吗？”


    未来，信任将变得越来越重要。今天我们生活在一个平台时代。我们有 Airbnb 和 eBay 这样的信任平台，它们本质上是鼓励陌生人进行交易的低风险环境。我们还有像
    Netflix 和 iTunes 这样的进一步信任平台。如果你尝试从 iTunes 购买已经买过的专辑，iTunes 会提醒你已经拥有它。Amazon 也是如此。Amazon
    推出了一个价格检查应用程序，你的手机可以扫描任何零售商店任何产品的条码，将其与 Amazon 的价格进行比较，如果你从 Amazon 购买商品，它会给你折扣。


