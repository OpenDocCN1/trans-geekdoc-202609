  raw: "The second line of defense is providing independent oversight to ensure that\
    \ risks are actively and appropriately managed. Those who are most intimately\
    \ involved in cybersecurity may occasionally miss things because they’re in the\
    \ trenches every day. The risk management department should provide this independent,\
    \ objective perspective—a fresh pair of eyes or a constructive challenge, if you\
    \ will. The risk management staff should be playing the same role and performing\
    \ the same functions as they do for all other risks within the company. For example,\
    \ they should play a key role in determining what the “crown jewels” are of the\
    \ company that need to be protected, then evaluating whether the controls in place\
    \ are appropriate.\n\nThe third line of cybersecurity defense is the audit function,\
    \ which periodically tests the policies and controls that are in place to ensure\
    \ they’re in position and effective. Internal audit should play a critical role\
    \ in helping the company manage cyberthreats by providing an independent assessment\
    \ of existing and needed controls, as well as helping senior management understand\
    \ and address the many diverse risks in today’s digital world. Internal audit\
    \ should also evaluate the full cybersecurity framework rather than cherry-picking\
    \ items. This evaluation involves understanding the current state against framework\
    \ characteristics, where the organization is going, and the minimum expected cybersecurity\
    \ practices across the industry or business sector. The initial assessment should\
    \ inform further, more in-depth reviews. It isn’t intended to be an exhaustive\
    \ analysis requiring extensive testing. Rather, the initial assessment should\
    \ drive additional risk-based cybersecurity deep-dive reviews.\n\nThe following\
    \ is a summary of the key components of building a CyRM℠ immune system, which\
    \ are discussed in greater detail in subsequent chapters.\n\n## [Sound the Alarm](#Toc.xhtml#R_sec3_1)\n\
    \nSmart network surveillance, early warning indicators, multiple layers of defense,\
    \ and lessons from past events are all critical components of true cyber resilience.\
    \ Cybersecurity cannot be guaranteed, but a timely and appropriate reaction can.\n\
    \n Be aware of the risks posed when third parties handle sensitive company data,\
    \ as third parties can be impactful to an operating environment. Companies aren’t\
    \ usually as attuned to cybersecurity risks from third parties as they are for\
    \ their own businesses, even though third parties can create the same adverse,\
    \ long-term effects.\n\nFor example, the sharing of data and communication between\
    \ the company and its vendors is no longer fully in control of the internal operations\
    \ of the company, as these external parties create new entry points into a company’s\
    \ technology environment, adding complexity and potential volatility to the operating\
    \ environment. Basics for a third-party program should include third-party exposures\
    \ prioritized based on risk (including cyber) to the organization; clear assessment\
    \ tools in place for the onboarding of any new relationships; and ongoing, risk-adjusted\
    \ monitoring processes in place to assess adherence to contract terms and joint\
    \ disaster recovery testing with primary service providers.\n\n## [Solve the Problem](#Toc.xhtml#R_sec3_2)\n\
    \nDevelop the organizational understanding to manage cybersecurity risk to systems,\
    \ assets, data, and capabilities. When things do go wrong—because sooner or later,\
    \ they will—the ability to quickly identify the problem will lead to a more effective\
    \ recovery.\n\nDevelop and implement appropriate safeguards to ensure delivery\
    \ of critical infrastructure services. It’s also important to leverage emerging\
    \ open-source intelligence services and to use the data gathered to guide ongoing\
    \ cybersecurity investment. Over time, that data will be pooled, allowing new\
    \ tools to be developed to analyze, prevent, and mitigate the cyberthreat of the\
    \ day. This new intelligence will be particularly valuable when proactively quantifying\
    \ risks and evaluating the investment levels required to protect specific assets.\n\
    \n## [Recover and Remember](#Toc.xhtml#R_sec3_3)\n\nDevelop and implement the\
    \ appropriate activities to maintain plans for resilience and to restore any capabilities\
    \ or services that were impaired due to a cybersecurity event. Just like subjecting\
    \ oneself to an annual medical examination, so, too, senior management must  institute\
    \ independent cybersecurity review processes. Threats should be viewed in the\
    \ context of tolerance levels—high and low—and treated accordingly. A comprehensive\
    \ management framework for cybersecurity should encompass governance, the setting\
    \ of objectives, prompt identification of rapid events, risk assessment, and response\
    \ and control activities.\n\n## [Consider Methods to Transfer Cyber Risks](#Toc.xhtml#R_sec3_4)\n\
    \nLegal and other practical considerations can (and should) be employed to partition\
    \ and mitigate the risk. However, the risk—no matter where it originates—will\
    \ rebound to your company in times of crisis or stress. Feeling reasonably secure\
    \ about your company’s CyRM℠ program isn’t just a matter of being able to answer\
    \ questions like, “Does our company have the right governance structure?” Rather,\
    \ it’s also being able to answer bigger questions, such as, “Are we thinking about\
    \ security the right way, and where is all this going?”\n\n# [4  \n\nAlign Critical\
    \ Decision-Making for IT vs. Business](#Toc.xhtml#R_chapter4)\n\nToday’s board\
    \ directors face an important question in reviewing technology decisions: Is the\
    \ company’s IT decision-making aligned with its strategic business decision-making?\
    \ Unfortunately, this key alignment is absent in most companies today. A company\
    \ that wants to implement a robust CyRM℠ policy must ask itself the following\
    \ three questions to evaluate the alignment between IT and business strategy:\n\
    \n*   Is technology leveraged to produce demonstrable value to the business in\
    \ terms of productivity, business and revenue goals, business agility, improvement\
    \ of the client experience, speed to market, and co-adopting with customers?\n\
    \n*   Is generating business value from IT a shared responsibility demonstrated\
    \ by IT being frequent partners in setting the strategic direction; being thought\
    \ of as innovators instead of simply service providers; and working closely with\
    \ the business units to leverage emerging technologies?\n\n*   Is there a continual\
    \ process of adjusting IT capabilities across multiple dimensions and critical\
    \ time frames that includes the effective exchange of ideas, knowledge, and information\
    \ between IT and business, leveraging the IT infrastructure to support new applications,\
    \ a shift in emphasis to data and security, and the mutual rating of projects\
    \ against a finite set of value criteria?\n\nBoard members need to consider the\
    \ following steps in evaluating the misalignment between strategic and operational\
    \ decision-making and IT decision-making in their organizations. The problem is\
    \  misalignment; the goal is alignment. It’s senior management’s job to manage\
    \ this alignment on an ongoing basis:\n\n1.  Recognize the problem—or opportunity—and\
    \ address it.\n\n2.  Gather information and develop alternative approaches.\n\n\
    3.  Choose the alternative you think will be most successful.\n\n4.  Act based\
    \ on your decision.\n\n## [Recognize the Problem and Address It](#Toc.xhtml#R_sec4_1)\n\
    \nIn far too many organizations today, IT strategy is an afterthought—bolted on\
    \ to the business strategy rather than becoming an integral part of it. This is\
    \ what leads to misalignments between a company's strategic and operational business\
    \ decisions and their IT decisions. Despite the important role IT strategy should\
    \ be playing in product and business strategy today, too often it isn't. So, the\
    \ first step is to identify this misalignment as the problem—then determine that\
    \ it’s being addressed as such. Senior management should keep their eye on the\
    \ goal. That goal is alignment."
