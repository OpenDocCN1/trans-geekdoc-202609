  raw: 'An adaptive security architecture allows decision making for security related
    issues that is based on the following: accurate threat modeling,  a quantifiable
    asset valuation, and ‘what if’ scenarios that consider the deterrence factors
    of a security measure or process, as well as their cost. The right intelligence
    driven approach is based on prior experiences, current threat intelligence, understanding
    of breaches that have impacted other companies, trends, valuation of assets, and
    analysis of the safeguards to guard these assets constantly, including when controls
    fail.


    Directors should also encourage the review of new technologies for access management,
    artificial intelligence, and distributive data that could potentially enhance
    the companies’ cyber defenses.


    ### [IV.DIRECTORS SHOULD UNDERSTAND THE COMPANY’S EXPOSURE TO THIRD-PARTY VENDORS.](#appendix-1.xhtml#R_sec12_2_4)


    Third parties can be impactful to an operating environment, since boards and companies
    are not usually as attuned to cybersecurity risks from third parties as they are
    for their own businesses, even though third parties can create the same adverse,
    long-term effects*.*


    Organizations that are laser-focused on delivering their missions through core
    competencies leverage the strengths of other providers and partners as a critical
    and viable business strategy. Companies manage hundreds, if not thousands, of
    vendor, third-party provider, and other types of outsourcing arrangements. These
    external parties are a primary source of incremental risk by creating new entry
    points into a company’s technology environment. The sharing of data and communication
    is no longer fully in control of the internal operations of the organization,
    adding complexity and potential volatility to the operating environment.


    Legal and other practical considerations can (and should) be employed to partition
    and mitigate the risk; however, the risk, no matter where it originates, will
    revert to the company in times of crisis or stress. Customers (corporate and individual)
    simply look to the company with which they are doing business for explanations
    and relief.


    Many organizations are playing “catch-up” when it comes to vendor management.
    The ability to create a full inventory of vendor relationships is clearly “table
    stakes” in an overall program. The basics for a third-party program should include
    the following:


    *   Complete and comprehensive inventory of all third-party contracts


    *   Third-party exposures prioritized based on risk (including cyber) to the organization


    *   Clear assessment tools in place for the onboarding of any new relationships


    *   Ongoing, risk-adjusted monitoring processes in place to assess adherence to
    contract terms


    *   Third-party assessment of vendor practices through Service Organizational
    Control (SOC) reporting


    *   Joint disaster recovery testing with primary service providers


    The activities should result in actionable and timely summarized board reporting;
    leveraging a technology-enabled vendor management solution is also a best practice.


    An emerging trend is a fourth-party assessment to understand what activities have
    been further outsourced causing change to the risk profile for cybersecurity.


    For cybersecurity risk, “risk-adjusted” is no longer purely a dollar filter, e.g.,
    based on the financial size of the contract. With the proliferation of inexpensive
    applications and other narrow, but highly effective, tools to fully capture the
    risk profile of the relationship, other filters must also be used to understand
    the impact to the organization.


    A strong third-party vendor management program does more than strengthen cybersecurity
    risk management — it can support spending decisions, contracting strategies, service
    levels, and other critical operational activities to support the attainment of
    core business objectives.


    ### [V.DIRECTORS SHOULD COMMIT TO DEVELOPING A CORPORATE CULTURE THAT PLACES A
    HIGH VALUE ON CYBERSECURITY.](#appendix-1.xhtml#R_sec12_2_5)


    **A. With management, directors should define appropriate behavior for cybersecurity
    and then demonstrate clearly the importance the organization places upon strict
    adherence.**


    Risk culture is the glue that binds all aspects of risk-taking and risk management
    together through shared organizational values, beliefs,  and attitudes. Through
    awareness and deliberate planning, risk culture can be proactively influenced
    to enhance an organization’s risk and business management environments. Cybersecurity
    is no exception; establishing a strong cybersecurity culture is an essential component
    of any program, given that the vast majority of cyber risk can be initially traced
    to people and related behaviors, not technology.


    However, most employees aren’t interested in their personal digital security —
    much less their company’s. Therefore, changing a company’s culture to strengthen
    security is especially difficult — requiring a paradigm shift in order to keep
    pace with the evolving threats. Historically, anything to do with IT security
    was kept away from users by IT teams. Little wonder that users show no or little
    interest in the company’s security.


    But in reality, users should be the front line of data security. They create and
    handle the information — therefore they are best-placed to understand its value.
    Directors should request their management to develop interactive training and
    accountability programs that engage with users. Using modern game based training
    and thereafter monitoring how users and employees apply their training helps transform
    a company’s culture into one where cybersecurity is everyone’s concern.


    Without a strong risk culture, even the best cybersecurity management framework
    would be vulnerable to weaknesses and failures. Given the continuously changing
    and quickly evolving cyber environment, embedding a strong cyber risk culture
    provides employees with principles and values to guide activities when policies
    are yet to be drafted or updated. Specific guidance may not always be available,
    relevant, or remembered. Indicators of a strong cybersecurity culture include:


    *   Clear and concise cybersecurity policy framework reflective of risks faced
    by the organization and the evolving operating environment;


    *   Board and leadership agendas prominently include cybersecurity;


    *   Cyber risk is not managed in a silo — discussions on cyber are woven into
    all management processes, such as new product approvals, merger due diligence,
    and third-party outsourcing arrangements;


    *   Continuous learning environment, including relevant and memorable training
    and tools to support strong cyber hygiene ranging from password protocols to anti-phishing
    campaigns to “bring your own device” policies;


    *   The existence of a safe environment for employees to bring forward risks or
    issues, employees need to know they are supported if they identify an unmitigated
    risk or emerging threat.


    Another hallmark of a strong cybersecurity culture is that no one in the organization
    is exempt, including the board. Boards should demonstrate their knowledge of strong
    cybersecurity practices by participating in company cybersecurity training, avoiding
    personal e-mail for company business, and safeguarding (physically and electronically)
    confidential information.


    **B. Directors need to understand the legal and regulatory implications of cyber
    risks as they relate to their company’s specific circumstances including their
    fiduciary duties and the overarching legal terrain.**'
