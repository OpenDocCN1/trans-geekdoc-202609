    \ who practices SEC securities enforcement defense and regulation law as a partner\
    \ at Hughes Hubbard & Reed LLP, and regularly advises boards of directors on securities\
    \ issues. David X Martin is a well-known risk and business cybersecurity expert.\
    \ Roel and David serve as co-chairs of the Directors and Chief Risk Officers Group\
    \ (DCRO) Cyber Risk Governance Council. Together, their collaboration in this\
    \ article has pro- duced a practical common sense approach, with the necessary\
