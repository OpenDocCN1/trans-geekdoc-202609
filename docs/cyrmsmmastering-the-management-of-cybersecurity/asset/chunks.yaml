    联邦贸易委员会（FTC）此前还曾甲骨文（Oracle）的披露问题提起诉讼，指控该公司未告知消费者，新的软件更新不会自动删除旧版本（且可能被利用的）Oracle
    Java 软件。去年，消费者金融保护局（CFPB）命令运营在线支付系统的 Dwolla Inc. 支付罚款并改进其安全实践，此前该公司被指控向消费者假称其网络是“安全”且“可靠”的，并称其数据安全实践“超过”或“优于”了行业安全标准。


    此外，尽管目前还没有国家级的“数据泄露通知”法，但大多数州已经颁布法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全漏洞时，实体必须通知受影响个人。


    Uber 可能是延迟披露和“不应做之事”最极端的例子。该公司在近一年的时间没有通知监管机构和受泄露影响的个人，这可能违反了州通知法。此外，据报道，Uber
    将不泄露漏洞事件作为向网络犯罪分子支付赎金的条件，这进一步加剧了掩盖真相的形象。多个州的总检察长已经对该漏洞事件发起了调查。


    ### 核心要点


    核心要点是，公司必须持续审查其网络披露的充分性和及时性。这没有“一刀切”的标准答案。经验丰富的披露法律顾问提供的建议至关重要。


    如果最近的事件教给了我们什么的话，那就是如果公司未能确保第三方服务提供商也实施充分的网络风险管理系统，那么公司的网络安全协议将化为乌有。很多时候，网络犯罪者的切入点是拥有公司系统权限或非公开数据的第三方。


    ### 第三方风险案例研究


    例如，家得宝（Home Depot）至今仍受到 2014 年一次网络事件的影响，在那次事件中，黑客利用第三方支付处理商的安全漏洞，盗取了超过 5000 万名家得宝客户的电子邮件和支付信息。同样，黑客在
    2013 年利用第三方供应商访问了 Target 的客户数据库，并盗取了约 4000 万客户的支付信息。


    德勤（Deloitte）的案例说明了为什么公司在涉及第三方网络风险时，应特别关注专业服务公司。专业服务公司——如律事务所、审计机构和咨询公司——特别容易受到，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，而这些信息都集中在一个方便网络犯罪者利用的地方。专业服务公司所拥的信息对网络犯罪者来说是一个非常有吸引力的目标，因为通过非法交易相对容易变现。此类信息也可能是黑客活动者（hacktivists）关注的目标。


    2016 年的“巴拿马文件”丑闻是首批揭露律事务所网络漏洞的重大事件之一。受影响的 Mossack Fonseca 公司曾帮助数百名美国客户建立海外业务。黑客入侵获取了
    Mossack Fonseca 高知名客户的敏感信息，时间追溯到 1970 年代，并让许多与该公司合作过的公司暴露在风险之中。我们在“乐天堂文件”丑闻中也看到了类似的态势发展，该丑闻涉及
    Appleby 律事务所泄露机密客户信息。


    ### 风险管理策略


    由于第三方通常可以访问高度敏感的公司信息，因此在公司聘用他们之前，应对其进行严谨的第三方网络风险评估。董事不需要了解每一项服务合同的细节，但他们应该确保公司有一份书面的供应商风险管理政策，以处理第三方对公司系统和敏感非公开数据的访问。至少，该政策应确保管理层进行了适当的尽职调查，并意识到与特定供应商交易的风险。公司还应定期重新评估第三方风险，并确保第三方服务提供商确实履行了其义务。


    董事会应意识到向政府提供敏感非公开信息相关的风险。`SEC` 的 `EDGAR` 数据库泄露引发了人们的严重关注，即市场监管机构应该持有多少敏感公司数据，以及由于资源有限，政府是否能够保护此类数据。在可能的情况下，公司应考虑通过加密物理介质提供信息，而不是通过安全文件传输。


    网络安全不是一个等待待解决的问题——它是一项需要持续管理的风险，并在审慎的情况下进行风险转嫁。作为公司风险管理工作的一部分，其董事会应仔细审查与第三方供应商的现有合同和保险政策。这些协议必须明确在发生泄露时由谁承担责任以及涵盖的范围是什么。


    ### 网络保险


    尽管网络保险仍处于起步阶段，缺乏精算数据，但它是美国公司增长最快的保障类型之一——而且不无理由。与网络攻击相关的成本可能会对公司产生根本性的影响。Ponemon
    研究所（Ponemon Institute）最近的一项研究显示，全球数据泄露的平均成本为 362 万美元。大规模网络攻击的受害者可以预期在该数字基础上增加几个零，因为声誉损害、通知成本和长期的诉讼费用会迅速累积。


    Target 公司在今年早些时候向 `SEC` 提交的年度报告中报告，其与 2013 年系统数据泄露相关的累计支出已达 2.92 亿美元，该事件导致了客户信用卡信息被大规模盗取。


    根据该公司说法，这一总金额部分被 900 万美元的保险赔付所抵消。同样，2017 年，FedEx 的荷兰子公司遭到了“NotPetya”病毒的袭击，导致公司运营临时中断，并导致季度利润损失了
    3 亿美元。FedEx 当时没有针对该攻击的保险覆盖，FedEx 的首席财务官此后透露，该事件引发了公司对未来是否应该购买网络保险的内部评估。


    除了保险理赔这一显性的潜在益处外，寻求网络保险可能为公司带来间接利益。处于网络保险市场的公司将有动力采用最佳实践，因为保费至少在程度上取决于公司对保护措施的有效利用。仅申请过程就可能要求公司对其现有的网络计划进行深度评估。通过这一过程，公司可能会对自身的网络风险和机会有更好的认识。董事会还应意识到，如果需要，保险公司通常会提供工具来帮助公司应对网络安全事件并减轻泄露后的损失。


