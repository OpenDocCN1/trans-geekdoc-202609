  trans: "\n传统上，大多数商业综合责任（CGL）保单不包含网络安全“免责条款”；然而，如今保险公司可能更倾向于保单中加入此类条款。董事应确保保障范围没有关键漏洞，并根据公司自身的风险概况考虑何种保障最合理（例如，保障选项可能包括数据泄露成本；勒索；取证分析；盗窃；诉讼费用和开支；以及业务中断等）。董事会还应确认其董事及高管（D&O）保单涵盖了对网络安全相关事件的保障。\n\
    \n# 9. 跟进发展动态\n\n网络安全领域没有任何停滞不前。黑客攻击不断演变，上个月还是行业标准的防御实践，下个月可能就会过时。立法者和监管机构也努力跟上新的法律法规，这在很大程度上受到受关注的泄露事件后舆论愤慨的推动。例如，纽约州对最近的\
    \ Equifax 泄露事件做出了反应，提议通过法规来扩大该州首创的网络安全规则，这些规则目前要求纽约所有的金融机构必须在州注册，并实施保护消费者数据的计划等。²⁹\n\
    \n治理网络安全的法律格局的转变本身可能被视为公司的网络“漏洞”。董事会需要意识到公司的合规义务，但这说起来易做起来难。如今的公司运行在一个碎片化的网络安全监管体系中。\n\
    \n州、联邦和外国监管机构都有各自的规则和指南。某些州（如加利福尼亚州和纽约州）近年来采取了特别激进的立场，在其管辖范围内监管并执行网络安全标准。在联邦层面，`FTC`\
    \ 和 `SEC` 等机构在其指定的关注领域和指导范围内也处于网络安全执法的前沿。\n\n欧盟方面近期实施了《通用数据保护条例》，该条例对从欧盟公民那里收集信用卡数据或其他个人信息的公司实施了报告和其他要求。³⁰\n\
    \n董事会应确保其公司继续遵守有关网络安全的最新州和联邦法律法规。对于某些经常被网络犯罪分子针对的行业公司（例如金融机构），以及处理敏感个人信息（如个人身份信息、财务信息或受保护的健康信息）的公司来说尤为如此，因为这些公司经常受到监管机构和立法者的审查。董事会显而易见的第一步可能是要求公司总法律和\
    \ `CISO` 定期向董事会汇报立法进展并提供建议。鉴于许多律师事务所都在扩大其数据隐私和网络安全业务，公司也可以借鉴外部法律顾问的专业知识，根据公司需求制定个性化的计划来管理网络安全风险。\n\
    \n董事会也可以对抗“合规疲劳”的有力武器，在这种疲劳下，执行日常合规工作的人员在应对各种碎片化需求和多个不断变化的目标时，会忽视大局。“勾选合规项”很重要，但还不够够。凭借其高层次的视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施时进行批判性和创新性思维方面发挥重要作用。最终，董事会应尝试确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规性。\n\
    \n# 结论\n\n为了实施有效的网络安全计划，董事应该理解其公司面临的全方位网络风险，并鼓励管理层制定针对公司特定需求和目标的相应策略。任何有效的网络安全计划都包括周密的规划、明智的授权以及监控监控系统——这些都应由董事负责。这不再是公司是否会被攻击的问题，而是何时会被攻击，以及公司将如何应对的问题。智能网络监控、早期预警指标、多层防御以及从过去的事件中学习都是真正的网络韧性的关键组成部分。当问题发生时（无论规模是大还是小），快速识别并响应问题的能力将决定公司的最终恢复。网络安全无法保证，但及时且恰当的反应可以。\n\
    \n# 董事网络安全清单\n\n### 风险评估 - 评估现有网络安全风险并确定优先级\n* 确定最有价值的资产\n* 寻求保护它们的有效策略\n* 审查网络安全预算的合理性\n\
    \n### 评估企业文化并树立正确榜样\n* 高管层和董事会不仅要参与，还应设定基调\n* 培训应具有参与性\n* 文化应基于团队合作而非监控\n\n###\
    \ 制定管理网络风险的策略和内部系统\n* 评估内部系统和控制的效果\n* 参与关键网络安全人员的选拔\n* 确保网络安全人员能够接触董事会\n* 理解并制定评估网络安全有效性的指标\n\
    * 严格审查升级流程\n* 请求提供安全评分卡\n* 制定应急响应计划\n* 测试计划。考虑模拟网络攻击\n\n### 理解披露要求和第三方考量\n* 审视披露内容以关注网络安全\n\
    * 为第三方合同建立缓解控制措施\n* 审查网络保险覆盖范围\n\n### 跟进发展动态\n* 根据不断变化的法律格局定期重新评估你的网络计划\n* 至少每季度启动一次网络计划的常规审查\n\
    * 指派总法律顾问和/或 `CISO` 向董事会汇报监管进展\n* 利用与外部法律顾问的现有关系\n\n# 注释\n\n# [INDEX]](#Toc.xhtml#R_index)\n\
    * 应用程序接口 (APIs), 7\n* 应用 `CyRM^(SM)`, 83\n* 现状的评估，77\n* 亚特兰大（城市），攻击，71\n* 构建更有效的网络安全防御，21\n\
    \    * 考虑转移网络风险的方法，24\n    * 恢复与记忆，23\n    * 解决问题，23\n    * 警报，22\n* Capital One\
    \ 泄露，6\n* CISO 角色，34–35, 55–56\n* 云暴露，第三方，6–7, 23, 41\n* COVID-19 大疫情，8, 72, 79\n\
    * 培养强大的文化以增强网络安全，59\n    * 以数据为中心的安全，60\n    * 让员工参与培训应用，61\n    * 让用户参与进来，60\n\
    \    * 将多样性作为安全文化的一部分，61\n\n"
