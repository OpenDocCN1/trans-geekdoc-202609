- fmt: '

    In March 2018 the city of Atlanta was attacked by a ransomware called SamSam.
    The attack devastated the city government’s computer systems, disrupting numerous
    city services, including police records, courts, utilities, and parking services.
    Computer systems were shut down for `five days`, forcing many departments to complete
    essential paperwork by hand. Five days! Think about how aggravated you get when
    your system is down for five hours. Even though services were slowly brought back
    online, the full recovery took months.


    The attackers demanded a mere $52,000 ransom payment, but when all was said and
    done, the full impact of the attack was projected to cost more than $17 million.
    Nearly $3 million alone was spent on contracts for emergency IT consultants and
    crisis management firms.


    The Atlanta ransomware attack is a lesson in inadequate business continuity planning.
    The event revealed that the city’s IT was woefully unprepared for the attack.
    Just two months earlier, an audit had found 1,500 to 2,000 vulnerabilities in
    the city’s IT systems, which were compounded by “obsolete software and an IT culture
    driven by ad hoc or undocumented processes.”


    That was an example of how bad `CyRM℠` leads to bad business. Now let’s look at
    a positive example of the interconnectedness. Research shows that 40 percent to
    60 percent of small businesses never reopen their doors after a disaster. In August
    2017, Hurricane Harvey slammed into Southeast Texas, ravaging homes and businesses
    across the region. Over the course of four days, some areas received more than
    forty inches of rain. By the time the storm cleared, it had caused more than $125
    billion in damage.


    Gaille Media, a small internet marketing agency, refused to be another small company
    shut down by disaster. Despite being located on the second floor of an office
    building, Gaille’s offices were flooded when Lake Houston overflowed. The flooding
    was so severe that nobody could enter the building for three months. The company
    never returned to the building, but its operations were hardly affected. That’s
    because Gaille kept most of its data stored in the cloud, which allowed staff
    to work remotely through the storm and after. Even with the office destroyed,
    they never lost access to their critical documents and records. In fact, when
    it came time to decide where to relocate, the owner ultimately decided to keep
    the company decentralized, allowing workers to continue working remotely. Had
    the company kept all its data stored at the office, the business may never have
    recovered. The COVID-19 pandemic has demonstrated that `the virtual world is already
    upon us and that the ultimate winners will be the companies that enable it.`


    When it comes to corporate crises, the only thing people remember is the outcome.
    A good outcome is the result of a well-developed, disciplined process that demonstrates
    collective wisdom and commitment to corrective results.


    The specific needs of an effective `CyberWellness℠` and security program include:
    careful planning, smart delegation, and a system for monitoring compliance—all
    of which the board of directors should oversee. Long term, the board needs to
    understand and consider the strategic business implications of cybersecurity,
    foster the right corporate culture regarding security, and encourage the integration
    of `CyRM℠` practices into all governance and approval processes. Bottom line:
    a smart board of directors understands that cybersecurity is a management issue––not
    just as a technical one.


    Having an effective business cybersecurity strategy is so important that the `SEC`
    will soon mandate it. Now working its way through the Senate, the `Cybersecurity
    Disclosure Act` is a simple bill that will have a far-reaching effect. The intent
    is to ensure that companies publicly disclose the steps they’re taking to protect
    themselves and their customers from cyberattacks.


    As part of their annual reporting to the `SEC`, public companies will have to
    disclose whether a member of the board “has expertise or experience in cybersecurity.”
    If not, they’ll have to be able to cite “what other cybersecurity steps” were
    taken by the company. Requiring board expertise in information security would
    be a novelty in corporate America, other than what already exists in companies
    in the information security business.


    More significantly, the `Cybersecurity Disclosure Act` will hold boards of directors
    responsible for protecting their companies and their investors from data breaches,
    hack attacks, and other cyberthreats. This legislation will elevate cybersecurity
    to the list of other risk factors that public companies must disclose, such as
    litigation, high debt levels, or labor problems.


    In short, to compete and win in today’s technology-driven world, companies need
    to get cybersecurity right.


    # How to Think About the Future


    Many years ago, I worked on a strategic plan for `Citicorp`, during which time
    I was privileged to spend a day with `Peter Drucker`, the elder statesmen of management
    gurus. I asked `D Drucker` how to predict the future, and he replied, “The best
    way to predict the future is to create it.”


    Scenario construction and analysis are the perfect tools to predict the future.
    Scenarios are “what if” stories about the future that allow us to consider almost
    anything that can happen, both positive and negative, and help us plan various
    responses. They also involve the creation of boundaries and deciding whether to
    remain within them. This may remind you of some of the risk management concepts
    from the previous chapter.


    When we build scenarios, we begin by listing the possible drivers of change, then
    divide them into two broad domains: those things we think we know something about
    and uncertainties. The former are usually trends that can be extrapolated from
    the past. We can, for example, make pretty good assumptions about long-term shifts
    in demographics, based on past and present shifts. Uncertainties include things
    like interest rates, changes in political power, and as yet unforeseen innovations.
    Good scenario planning requires a careful blending of known and unknown drivers
    of change. Once the broad parameters of a scenario are in place, one begins to
    look for inflection points—or trip wires—that can be monitored to determine whether
    the events of the day may trigger a chain of events leading toward the fulfillment
    of the scenario.


    A scenario regarding World III might read as follows:


    > In 2021, after a year of increasing tensions between China and the US over the
    spread of the pandemic, China clamps down on Hong Kong. The US places steep sanctions
    on all Chinese exports, causing China’s negative growth. Social unrest against
    the government carries over into the Chinese mainland. International bodies are
    unable to bring the US and China to the bargaining table. China tries to seize
    some long-disputed islands in the South China Sea. A brewing crisis steadily escalates
    over a few incidents, but the tipping point is Taiwan, which declares its independence
    from China. China subsequently invades Taiwan and launches a ballistic missile
    volley against a US carrier coming to aid Taiwan. The loss of a major warship
    and its crew galvanizes the US into action. The US targets Chinese land forces
    in Taiwan and prevents the reinforcement and resupply of these troops before forcing
    their surrender. The US simultaneously targets Chinese air and naval units, as
    well as ships and aircraft held in reserve as the situation escalates. Perhaps
    you also build out a scenario in which Japan and North Korea begin a conflict.


    Even if they’re not necessarily predictive, scenarios can challenge our present
    view of the world, long before events have changed them. In doing so, they provide
    us with trip wires, and when we stumble across them, much like speed bumps make
    us aware of our speed, they lead us to consider how we’ll be impacted by future
    events.

