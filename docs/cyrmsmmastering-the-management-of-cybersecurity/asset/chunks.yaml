  trans: '

    第二道防线是提供独立的监督，以确保风险得到积极且适当的管理。最亲密参与网络安全的人有时会遗漏某些问题，因为他们每天都处于一线状态。风险管理部门应该提供这种独立、客观的视角——可以说是一双“新的眼睛”，或一种建设性的挑战。风险管理人员应该扮演与他们在处理公司其他所有风险时相同的角色，执行相同的功能。例如，他们应该在确定公司需要保护的“皇冠明珠”方面发挥关键作用，然后评估现有的控制措施是否适当。


    网络安全的第三道防线是审计职，它通过定期对现行的策略和控制进行测试，以确保其到位并有效。内部审计应通过对现有和所需控制措施提供独立评估，在帮助公司管理网络威胁方面发挥关键作用，并帮助高层管理理解并应对当今数字世界中许多化的风险。内部审计还应该评估整个网络安全框架，而不是仅仅挑选项目。这种评估涉及将当前状态与框架特征、组织去向以及整个行业或业务领域的最低预期网络安全实践进行对比。初步评估应为进一步、更深入的审查提供参考。其目的并非进行需要大量测试的详尽分析。相反，初步评估应驱动额外的、基于风险的网络安全深度审查。


    以下是构建 CyRM℠ 免疫系统的关键组件摘要，这些内容将在后续章节中进行更详细的讨论。


    ## 警报


    智能网络监控、预警指标、多层防御以及从过去事件汲取的教都是真正的网络韧性的关键组成部分。网络安全无法完全保证，但及时且适当的反应是可以保证的。


    要意识到第三方处理公司敏感数据时所带来的风险，因为第三方会对运营环境产生影响。公司对第三方网络安全风险的敏锐度通常没有对自身业务的风险那样敏锐，尽管第三方可能会产生同样的负面长期影响。


    例如，公司与其供应商之间的数据共享和通信不再完全受公司内部运营的控制，因为这些外部实体为公司技术环境创建了新的切入点，增加了运营环境的复杂性和潜在波动。第三方计划的基础应包括：根据组织风险（包括网络风险）对第三方风险口进行优先级排序；为任何新关系的建立建立的评估工具；以及持续的、基于风险调整的监控流程，以评估对合同条款的遵守情况，并与主要服务提供商进行联合灾难演练。


    ## 解决问题


    建立组织理解，以管理系统、资产、数据和能力的网络安全风险。当问题真的发生时——因为它们迟早会发生——快速识别问题的能力将带来更有效的恢复。


    开发并实施适当的保护措施，以确保关键基础设施服务的交付。同时，利用新兴的开源情报服务并使用收集的数据来指导持续的网络安全投资也很重要。随着时间的推移，这些数据将汇聚，允许开发出新工具来分析、预防和缓解当下的网络威胁。这种新情报在主动量化风险和评估保护特定资产所需的投资水平时将特别有价值。


    ## 恢复与记忆


    建立组织理解，以管理系统、资产、数据和能力的网络安全风险。当问题真的发生时——因为它们迟早会发生——快速识别问题的能力将带来更有效的恢复。


    开发并实施适当的保护措施，以确保关键基础设施服务的交付。同时，利用新兴的开源情报服务并使用收集的数据来指导持续的网络安全投资也很重要。随着时间的推移，这些数据将汇聚，允许开发出新工具来分析、预防和缓解当下的网络威胁。这种新情报在主动量化风险和评估保护特定资产所需的投资水平时将特别有价值。


    ## 考虑转移风险的方法


    可以利用法律和其他因素来划分和减轻风险。然而，风险——无论源自何处——在压力时期都会反弹到你的公司。对公司感到相当安全，不仅仅是能够回答“我们有正确的治理吗？”相反，它还意味着能够回答更大的问题，例如“我们的思考方式正确吗？这一切将向何处发展？”


    # IT 与业务关键决策的对齐


    董事会成员在评估组织内战略性与运营决策与 IT 决策之间的脱节时，需要考虑以下步骤。问题是不节，而目标是对齐。持续管理这种对齐是高层管理人员的职责：


    1. 识别问题（或机会）并解决它。

    2. 收集信息并制定替代方案。

    3. 选择你认为最成功的替代方案。

    4. 根据你的决定采取行动。


    ## 识别问题并解决它


    在今天的许多组织中，IT 策略是事后考虑的——是挂接到业务策略上的，而不是成为其不可或的一部分。这导致了公司的战略性和运营业务决策与其 IT 决策之间的脱节。尽管
    IT 策略在今天应该扮演着重要的角色，但它很多时候并没有做到。

