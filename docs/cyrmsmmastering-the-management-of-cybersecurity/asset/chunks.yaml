  trans: '

    虽然美国证券交易委员会（SEC）尚未介入，但其他监管机构已开始积极执行网络安全相关的披露义务。例如，2017 年 8 月，Uber 就联邦贸易委员会（“FTC”）针对其
    2014 年的一起数据泄露事件提出的指控达成和解。FTC 指控该公司在保护客户信息方面的努力上做出了误导性陈述，并未能采取“合理的、低成本的措施”来防止对客户个人数据的未经授权访问。同时，FTC
    确认其正在审查 Uber 对 2016 年数据泄露事件的回应，该公司最近才披露了该事件。


    FTC 此前还就甲骨文（Oracle）的披露问题提起诉讼，声称该公司未能告知消费者，新版本的软件更新不会自动删除旧版（且可能被利用的）`Oracle’s Java
    software` 版本。去年，消费者金融保护局（CFPB）命令运营在线支付系统的 Dwolla, Inc. 支付罚款并改进其安全实践，此前该公司此前被指控向消费者误传其网络是“安全号且“可靠的”，并声称其数据安全实践“超过”或“超越”行业安全标准。


    此外，尽管目前还没有国家级的“数据泄露通知”法，但大多数州已经颁布了法律，要求在发生涉及敏感消费者和个人身份信息的某些网络安全泄露时，必须通知受影响个人。


    Uber 可能是延迟披露和“不应如何做法”最极端的例子。该公司在近一年的时间里未能通知受泄露影响的监管机构和个人，这可能违反了州级通知法。此外，Uber 还被指控将不披露泄露作为向网络犯罪分子支付赎金的条件，这进一步加剧了其掩盖真相的形象。


    几个州的总检察官已经对该泄露事件启动了调查。


    核心启训是，公司绝对必须持续审查其网络披露的充分性和及时性。这没有“一刀切”的答案。经验披露顾问的建议至关重要。


    ### 7. 理解第三方漏洞


    如果说最近的事件教给了我们什么，那就是：如果公司未能确保第三方服务提供商也实施充分的网络风险管理系统，那么公司的网络安全协议将化为乌有。很多时候，网络犯罪分子的切入点是拥有公司系统或非公开数据的第三方。


    例如，家得宝（Home Depot）仍受到 2014 年一次网络事件的影响，在那次事件中，黑客利用第三方支付处理商的安全漏洞，盗了超过 5000 万名家得宝客户的电子邮件和支付信息。黑客在
    2013 年同样利用第三方供应商访问了 Target 的客户数据库，盗了约 4000 万客户的支付信息。


    德勤（Deloitte）最近的案例说明了为什么公司在涉及第三方网络风险时，应特别关注专业服务公司。专业服务公司——如律事务所、审计机构和咨询公司——特别脆弱，因为它们的数据库和云计算应用程序通常包含来自许多不同客户和业务伙伴的敏感信息，这些信息都集中在一个方便网络犯罪分子利用的位置。专业服务公司拥有的信息对网络犯罪分子来说是非常具吸引力的目标，因为通过非法交易很容易变现。此类信息也可能是黑客行动主义者（hacktivists）吸引的目标。


    2015 年的“巴拿马文件”丑闻是首批揭露律师事务所网络漏洞的重大事件之一。受影响的事务所 Mossack Fonseca 曾帮助数百名美国客户建立离岸业务。黑客泄露了
    Mossack Fonseca 知名客户的敏感信息，时间可追溯到 1970 年，并让许多与该公司合作过的公司暴露在风险之中。


    由于第三方通常可以访问高度敏感的公司信息，因此在公司聘用他们之前，应对对他们进行严格的第三方网络风险评估。


    董事不需要了解每一份服务合同的细微细节，但他们应该确保公司有一份书面的供应商风险管理政策，以处理第三方对公司系统和敏感非公开数据的访问。归根结底，该政策应确保管理层进行适当的尽职调查，并意识到与特定供应商开展业务的风险。公司还应定期重新评估第三方风险，并确保第三方服务提供商确实履行了其义务。


    董事会应意识到向政府提供敏感非公开信息相关的风险。SEC `EDGAR database` 的泄露引发了人们的严重质疑，即市场监管机构应该持有多少敏感的公司数据，以及由于资源有限的政府是否能够保护此类数据。


    ### 8. 考虑转移网络风险的方法


    网络安全不是一个要解决的问题——它是一项需要持续管理的风险，并在审慎的情况下进行转移。作为风险管理工作的一部分，董事会应仔细审查与第三方供应商的现有合同和保险单。


    这些协议必须明确规定发生泄露时由谁负责以及涵盖范围是什么。


    尽管网络保险仍处于起步阶段，缺乏精算数据，但它是美国公司中增长最快的保障类型之一——而且理有其。。


    Target 公司在今年早些时候向 SEC 提交的年度报告中报告，其与 2013 年系统数据泄露相关的累计费用已达 2.92 亿美元，该事件导致了客户信用卡信息被大规模盗取。


    根据公司的说法，该总金额部分被 9000 万美元的保险赔款抵消。


    除了货币索赔这一显而易见的潜在收益外，寻求网络保险可能为公司带来辅助优势。寻求网络保险的公司将有动力使用最佳实践，因为保费至少在某种程度上取决于公司对保护措施的有效利用。仅申请过程就可能需要对公司现有的网络计划进行深度评估。通过这一过程，公司可能对自己的网络风险和机会有更好的认识。董事会还应意识到，如果需要，保险公司通常会提供工具帮助公司应对网络安全事件并减轻泄露后的损失。


    董事会通常处于公司是否应购买网络保险的最终决定权地位。作为董事会做出这一决定可能需要应对一些新领域。你必须确定哪些是涵盖且应该涵盖的，哪些是不涵盖且不需要涵盖的。还需要确定特定的保费是否公平。董事会应该问的问题之一是，现保险单是否可能涵盖某些事件。

