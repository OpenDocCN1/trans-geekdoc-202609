    \ vulnerability and the need to patch the software on March 8, 2017. Although\
    \ the company disseminated the US-CERT notification internally by email and requested\
    \ that appropriate personnel apply the patch, the patch was apparently not installed,\
    \ or not installed correctly, and follow-on scans of the system one week later\
    \  failed to reveal the error. A good CyRM℠ protocol regularly checks those alerts.\n\
    \nThe second lesson for board members is that companies must ensure they have\
    \ appropriate systems in place to escalate information about potential cyber incidents.\
    \ For example, does the general counsel have a process for imposing a freeze on\
    \ trading in the company’s securities by individuals with insider knowledge of\
    \ material breaches during key windows of time? In Equifax’s case, it was revealed\
    \ that several executives had traded in the company’s stock after the breach had\
    \ been reported internally, but before the public had knowledge of the breach.\
    \ This raised questions about possible insider trading and a lack of internal\
    \ controls at a time when Equifax was already subject to intense public scrutiny\
    \ over the breach itself. (The executives have since been cleared of wrongdoing\
    \ by a special committee at Equifax tasked with analyzing the breach.)"
