    \ The attack devastated the city government’s computer systems, disrupting numerous\
    \ city services, including police records, courts, utilities, and parking services.\
    \ Computer systems were shut down for *five days*, forcing many departments to\
    \ complete essential paperwork by hand. Five days! Think about how aggravated\
    \ you get when your system is down for five hours. Even though services were slowly\
    \ brought back online, the full recovery took months.\n\nThe attackers demanded\
    \ a mere $52,000 ransom payment, but when all was said and done, the full impact\
    \ of the attack was projected to cost more than $17 million. Nearly $3 million\
