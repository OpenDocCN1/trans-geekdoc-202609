    # 附录 B：董事会网络安全指南

    作者：Roel C. Campos 和 David X Martin

    Hughes Hubbard & Reed LLP

    一家纽约有限责任合伙企业

    One Battery Park Plaza

    New York, New York 10004-1482

    +1 (212) 837-6000


    律师广告。请读者注意，以往结果不保证类似的结局。本广告的任何内容均未获得新泽西州最高法院批准。有关奖项选择过程的信息，请访问 [`www.hugheshubbard.com/legal-notices-methodologies`](https://www.hugheshubbard.com/legal-notices-methodologies)。


    ## 董事如何应对其监督网络安全的义务？

    一份针对 Equifax、Uber 等时代董事会的实用指南

    作者：Roel Campos 和 David X Martin


    许多董事都意识到，他们有责任监督公司网络安全的事务。但更让他们困惑的是，他们现在应该做什么来为董事会的工作做出贡献？他们应该提出的正确问题是什么？下面我们对您应该关注的网络安全合规的几个主要领域进行了简短讨论。我们邀请您将本文存档，作为您董事身份和职责的参考，并在董事会上讨论网络安全时使用本文末尾的大纲。


    ## 引言

    2017 年 9 月 7 日，美国最大的信贷监控机构之一——`Equifax Inc.` 宣布，超过 1.43 亿客户的账户已遭到入侵，这可能是迄今为止对美国消费者影响最严重的网络攻击。


    在 Equifax 丑闻期间，美国证券交易委员会（`SEC`）也发布了一些令人震惊的自身披露。新上任的 `SEC` 主席 `Jay Clayton` 于 2017
    年 9 月 20 日宣布，`SEC` 自身的 `EDGAR` 系统数月前已被网络黑客入侵，这引发了人们对此类系统安全性以及拥有此类敏感非公开公司信息的个人进行内幕交易风险的担忧。


    近期其他高知名的网络攻击也层出不穷。令热门剧集《游戏之王》粉丝非常遗憾的是，`HBO` 电视网络在 2017 年 7 月遭到入侵，黑客窃取了超过 1.5 TB
    的信息，包括剧本和几部热门剧集的完整剧。


    在更具趣闻的故事之一中，`Uber Technologies, Inc.` 的近期披露详细了 2016 年该网约车公司系统遭入侵的情况，期间黑客盗取了数百万
    Uber 客户和司机的姓名、电子邮件地址、电话号码和驾照号码。`Uber` 不仅在一年多时间内未披露此次入侵，据称还向黑客支付了笔“赎金”，以换取黑客承诺删除被盗数据并对此次网络事件保持保密。


