  trans: '


    2018 年 3 月，亚特兰大市遭受了名为 SamSam 的勒索软件攻击。这次攻击摧毁了市政府的计算机系统，导致多项城市服务中断，包括警察记录、法院、公用事业和停车服务。计算机系统关闭了`five
    days`，迫使许多部门不得不手工完成必要的文书工作。五天！想象一下如果你的系统宕机五小时，你会有多崩溃。尽管服务在缓慢恢复，但完全恢复花费了数月时间。


    攻击者仅索要 52,000 美元的赎金，但事后统计，这次攻击造成的全面影响预计超过了 1,700 万美元。仅应急 IT 顾问和危机管理公司的合同费用就高达近
    300 万美元。


    亚特兰大勒索软件攻击是一个关于业务连续性计划不足的教训。这一事件表明，该市 IT 部门对攻击的准备极其糟糕。就在两个月前，一次审计还发现该市 IT 系统存在
    1,500 到 2,000 个漏洞，而这些漏洞因“过时的软件以及由随机或未记录流程驱动的 IT 文化”而进一步恶化。


    这就是糟糕的 `CyRM℠` 如何导致糟糕业务的例子。现在让我们来看一个关于互通性的正面案例。研究显示，40% 到 60% 的小企业在灾难后从未再次开门。2017
    年 8 月，哈维飓风袭击了德克萨斯州南部，破坏了该地区的家庭和企业。在四天内，某些地区的雨量超过了 40 英寸。当风暴过去时，它造成的损害超过了 1,250
    亿美元。


    Gaille Media 是一家小型网络营销机构，它拒绝成为另一因灾难而关闭的小公司。尽管办公室位于办公楼的二层，但当休斯顿湖溢出时，Gaille 的办公室被淹没了。洪水非常严重，导致三个月内没有人进入该建筑。该公司从未回到该建筑，但其运营几乎没有受到影响。这是因为
    Gaille 将大部分数据存储在云端，这允许员工在风暴期间及之后进行远程工作。即使办公室被毁，他们从未失去对关键文件和记录的访问权限。事实上，在决定搬往何处时，老板最终决定保持公司去中心化，允许员工继续远程工作。如果公司将所有数据都存储在办公室，该业务可能永远无法恢复。COVID-19
    大流行证明了`虚拟世界已经来临，最终的赢家将是那些实现这一点的公司。`


    谈到企业危机时，人们唯一记得的是结果。良好的结果是一个完善、有纪律的过程的结果，这种过程展示了集体智慧和对纠正结果的承诺。


    一个有效的 `CyberWellness℠` 和安全计划的具体需求包括：周密的计划、明智授权以及一套监控合规性的系统——这些都应该由董事会进行监督。从长远来看，董事会需要理解并考虑网络安全的战略性业务影响，培养正确的安全企业文化，并鼓励将
    `CyRM℠` 实践整合到所有的治理和审批流程中。底线是：精明的董事会理解，网络安全是一个管理问题——而不仅仅是一个技术问题。


    拥有有效的业务网络安全策略如此重要，以至于 `SEC` 很快将强制要求。《网络安全披露法案》（Cybersecurity Disclosure Act）目前正在参议院通过，这是一项将产生深远影响的简单法案。其意图是确保公司公开披露它们为保护自己和客户免受网络攻击而采取的措施。


    作为向 `SEC` 提交年度报告的一部分，上市公司必须披露董事会成员是否“具有网络安全方面的知识或经验”。如果没有，他们将能够说明公司采取了“哪些其他网络安全措施”。要求董事会具备信息安全专业知识对于美国企业界来说将是一个新奇，除了那些从事信息安全业务的公司之外的领域。


    更具意义的是，《网络安全披露法案》将要求董事会承担保护公司及其投资者免受数据泄露、黑客攻击和其他网络威胁的责任。这项立法将网络安全提升到上市公司必须披露的其他风险因素之列，例如诉讼、高负债水平或劳工问题。


    简而言之，在当今这个技术驱动的世界中竞争并获胜，公司需要做好网络安全。


    # 如何思考未来


    许多年前，我曾为 `Citicorp` 制定一项战略计划，期间我有幸与管理学界泰斗元老 `Peter Drucker` 共度过了一天。我问 `D Drucker`
    如何预测未来，他回答：“预测未来最好的方法是创造它。”


    情景构建和分析是预测未来的完美工具。情景是关于未来的“如果……”的故事，允许我们考虑几乎任何可能发生的情况（无论是积极还是负面的），并帮助我们规划各种应对措施。它们还涉及边界的创建，并决定是否留在这些边界之内。这可能会让你想起上一章中的一些风险管理概念。


    当我们构建情景时，我们从列出可能的驱动因素开始，然后将它们分为两个广泛的领域：我们认为自己了解某些情况以及不确定因素。前者通常是根据过去可以推出的趋势。例如，根据过去和现在的变化，我们可以对人口结构的长期转变做出相当合理的假设。不确定因素包括利率、政治权力的更迭以及尚无法预见的创新。良好的情景规划需要对已知和未知的变化驱动因素进行仔细的融合。一旦情景的大致参数确定，就可以开始寻找转折点——或称导索线——可以通过监控这些点来确定当天的事件是否会触发通往情景实现的连锁反应。


    一个关于“世界大战三”的情景可能如下：


    > 2021 年，在因病毒疫情传播问题中美关系紧张局一年后，中国镇压香港。美国对所有中国出口产品实施了严厉制裁，导致中国出现负增长。对政府的不满情绪蔓延到中国大陆。国际机构未能将中美带回谈判桌。中国试图夺取南海一些长期存在争议的岛屿。一场酝酿中的危机通过几次事件不断升级，但转折点是台湾，其宣布从中国独立。中国随后入侵台湾，并对援助台湾的美国航空母舰发射了弹道导弹。一艘大型战舰及其船员的损失促使美国采取行动。美国攻击台湾的中国陆军，并阻止了这些部队的增援和补给，最终迫其投降。随着局势升级，美国同时攻击了中国的空军和海军以及预备的舰船和飞机。也许你还构建了一个日本和朝鲜爆发冲突的情景。


