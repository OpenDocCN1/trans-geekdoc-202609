    \ should purchase cyber insurance. Making this decision as a board may require\
    \ navigating some new terrain. You must determine what is (and should be) covered,\
    \ and what is not (and need not be) covered. You also need to determine whether\
    \ a particular premium is fair. One question boards should ask is whether existing\
    \ insurance policies may cover certain events. Traditionally, most commercial\
    \ general liability (CGL) policies didn’t contain cyber “exclusions”; however,\
    \ these days, insurers may be more likely to include such provisions in their\
    \ policies. Directors should ensure there are no critical gaps in coverage and\
    \ consider what coverage makes the most sense based on their company’s own risk\
    \ profile—for example, coverage options may include coverage for costs of data\
    \ breaches; extortion; forensic analyses; theft; litigation costs and expenses;\
    \ and business interruption, to name a few. Boards should also confirm that their\
    \ directors and officers (D&O) policies include coverage of cybersecurity-related\
    \ events.\n\nThere’s nothing stagnant about cybersecurity. The hacks are ever\
    \ evolving, and defensive practices that are industry standard one month may be\
    \ obsolete the next. Legislators and regulators, in turn, strive to keep pace\
    \ with new laws and regulations, spurred in no small part by public outcry following\
    \ high-profile breaches. The state of New York, for example, responded to the\
    \ Equifax breach by proposing regulation to expand the state’s first-of-its-kind\
    \ cybersecurity rules, which  currently require all financial institutions in\
    \ New York to register with the state and implement programs to protect consumer\
    \ data, among other things. The new regulation would extend the requirements to\
    \ credit reporting agencies. New York’s attorney general also proposed new legislation\
    \ to amend the state’s existing data breach notification law. Notably, the proposed\
    \ legislation would expand the definition of “private information” and apply to\
    \ any entity that holds the private information of New Yorkers, even if that entity\
    \ doesn’t conduct regular business in the state.\n\nThe shifting legal landscape\
    \ governing cybersecurity may itself be considered a cyber “vulnerability” for\
    \ a company. Boards need to be cognizant of their companies’ compliance obligations,\
    \ but that’s easier said than done. Companies today operate in a fragmented system\
    \ of cybersecurity regulations. State, federal, and foreign regulators all come\
    \ with their own rules and guidance. Certain states, such as California and New\
    \ York, have taken a particularly aggressive tack in recent years to regulate\
    \ and enforce cybersecurity standards within their jurisdictional limits. On the\
    \ federal level, agencies such as the FTC and SEC are on the vanguard of cybersecurity\
    \ enforcement within their own designated areas of focus and guidance. The European\
    \ Union, for its part, implemented its General Data Protection Regulation, which\
    \ imposes reporting and other requirements on companies that collect credit card\
    \ data or other personal information from EU citizens.\n\nBoards should ensure\
    \ their companies continue to comply with the latest array of state and federal\
    \ laws and regulations concerning cybersecurity. This is especially true for companies\
    \ in certain industries that are frequently targeted by cybercriminals (e.g.,\
    \ financial institutions), and for those that handle sensitive personal information,\
    \ such as personally identifiable information, financial information, or protected\
    \ health information, as these companies are often subject to scrutiny by regulators\
    \ and legislators. One obvious first step for the board may be to ask the company’s\
    \ general counsel and CISO to brief the board regularly on legislative developments\
    \ and provide their recommendations. With many law firms growing their data privacy\
    \ and cybersecurity practices, companies can also draw on the expertise of outside\
    \ counsel to develop individualized programs to manage cybersecurity risk, in\
    \ view of the company’s needs.\n\n Boards can also be valuable weapons in combating\
    \ “compliance fatigue,” in which personnel performing the day-to-day compliance\
    \ functions lose sight of the broader picture as they navigate disparate, daily\
    \ demands and multiple moving targets. It’s important to “check the boxes,” but\
    \ that isn’t enough. With their high-level perspective and status, boards can\
    \ play a major role in encouraging management to think critically and innovatively\
    \ when it comes to improving existing processes and cybersecurity measures. In\
    \ the end, boards should try to ensure that the lion’s share of the company’s\
    \ effort is spent on actual cybersecurity, not on merely demonstrating compliance.\n\
    \n# [**PRONG 2**  \n\nCyberWellness℠](#Toc.xhtml#R_partp002)\n\n# [6  \n\nCyberWellness℠](#Toc.xhtml#R_chapter6)\n\
    \n## [A Companywide Approach](#Toc.xhtml#R_chapter6)\n\nIt’s impossible to centrally\
    \ control every connection with employees and clients—therefore, a new paradigm\
    \ is required. A company’s CyRM℠ program needs to encompass not only the firm\
    \ as a whole, but every employee. Everyone in the company is responsible for the\
    \ risks they undertake. This requires an active process—just like physical wellness\
    \ programs in which the company takes an active approach to promoting and maintaining\
    \ employees’ good health. So, too, with CyberWellness℠: proactive choices need\
    \ to be made across multiple dimensions of cyber defense, response, and governance.\n\
    \nAs you’ve seen in earlier chapters, the traditional approach to cybersecurity\
    \ relies on prevention strategies. This outmoded approach assumes there’s a hardened\
    \ shell surrounding your firm’s IT system. It wrongly assumes that cybersecurity\
    \ incidents are exceptions—the rare piercing of the hardened shell—rather than\
    \ frequent, ongoing, and ever-more-creative attempts at breaching data. Good CyRM℠\
    \ programs say: enough of the old way, it’s time to practice comprehensive CyberWellness℠.\n\
    \nThe key to effective CyberWellness℠ is your company’s ability to assess, measure,\
    \ monitor, and control risk. Most companies generally focus on breaches, which\
    \ is really only the assessment aspect. They need to broaden their focus, develop\
    \ new measures like cyber risk tolerances, develop innovative monitoring techniques\
    \ as key performance indicators, provide cybersecurity training to employees,\
    \ and implement better cyber-related controls that are incorporated into updated\
    \ policies and procedures.\n\nTo continue the wellness analogy, consider that\
    \ in recent years, we’ve seen our public health systems try to shift from reactive\
    \ mode to proactive—focusing on preventing illness rather than just responding\
    \  to disease outbreaks when they happen. (The COVID-19 pandemic has heightened\
    \ our understanding that simply being reactive doesn’t work well!)\n\nIn contrast\
    \ to treating incidents as rare exceptions, an intelligence-driven mindset assumes\
    \ that the company has already been compromised and therefore needs to continuously\
    \ evolve to stay ahead of the curve. For instance, at my hillside house, I have\
    \ multiple layers of security. There’s a wrought-iron fence around the perimeter\
    \ of the yard, signs that read “Beware of Dog” and “Protected by Post Alarm,”\
    \ light-sensitive floodlights, an alarm system that’s wired to every door and\
    \ window, a fireproof safe hidden well out of sight, and a panic button next to\
    \ my bed. My goal is to deter bad actors with my fence, my floodlights, and the\
    \ signs on my fence. But if they should decide to break in anyway, then I have\
    \ multiple layers of defense in place: doors, windows, and screens alarmed, internal\
    \ beams should the bad guys somehow manage to get in without setting off an external\
    \ alarm, the panic button, a big dog with a big bark, and the hidden safe. It’s\
    \ not enough to rely on the exterior security measures. You may think that’s excessive,\
    \ but when you’re an expert in risk management, you know it’s better to be safe\
    \ than sorry."
