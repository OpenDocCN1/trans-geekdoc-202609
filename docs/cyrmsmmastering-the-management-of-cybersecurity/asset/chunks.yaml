    为了履行这一关怀义务，董事必须能够以合理的常理方式证明他们已经履行了对网络安全的监督职能。为此，董事应当定期从 `CEO` 和 `CISO` 处获得评估和保证，以确保整个组织（即不仅仅是技术部门）正在进行的工作高度侧重于保护核心资产及其他高优先级资产。这些工作计划程应涉及功能分层、稳健的身份访问管理以及更高层次的员工培训，以及网络和端点层面领先的安全实践。


    此外，承认错误并从从中学习可以带来更好的决策。在关于公司安全模型和漏洞的简报中，应该鼓励进行网络安全事后分析（post mortems）。对网络安全问题的审慎考虑和参与是不可替代的。


    当然，在开发新产品和服务务时，公司需要在创新与风险之间取得正确的平衡。在大多数情况下，安全性越高，产品的用户友好性和便利性就越低。应该进行网络过滤审查的流程包括战略规划、并购、产品开发以及资本分配和预算。即使是人力资源流程也应该具备网络过滤器，以理解招聘、领导力培养和网络资源留存策略。


    ## II. 董事应将网络安全视为战略性和管理性问题，因此应要求管理层对建议和实施整体网络风险管理策略及政策负责。


    1. 管理层应对对报告其行为和网络违规情况负责责。

    2. 在适当的情况下，董事会应要求关键高管证明网络安全计划的某些重要方面已经执行。

    3. 提高员工意识和培训至关重要。

    4. 对网络漏洞进行第三方测试可以提供高程度的威慑。

    5. 董事会应维持一个外部专业人士团队，以便在培训和危机情况下提供支持。


    董事必须通过比单纯信息技术（IT）更广阔的视角来理解安全，因为对公司造成的潜在损害可能是毁灭性的。


    网络安全风险需要 C 级管理层的负责制和董事会的监督，以推动议程并管理具备正确技能的赋权员工。


    与负责的公司官员关于网络风险管理的讨论，应在董事会和董事委员会会议议程中获得定期且充分的时间。


    负责人员的领导技能——沟通和危机管理——应得到同等的考虑，因为它们通常比技术技能更重要。显然，在日常技术管理或危机时刻，拥有一位高超的领导者比拥有一个领域专家好得多。


    董事会还应该根据他们完全理解的术语（和语言）建立自评估框架，以确保正在实施行业最佳实践并取得了实际进展。对结果的强化关注应取代纯粹基于活动的报告。


    董事需要通过鼓励管理层各级与下属之间进行适当的互动，来促进稳健的网络安全状态和韧性。


    据文献记载，大约三分之二的成功授权网络攻击直接归因于员工所采取（或未采取）的行为。


    因此，提高员工对网络风险暴露的意识，代表了增强组织整体网络韧性的重要意义的机会。


    通过游戏化和持续培训等具有操作性质的举措对员工意识进行任何可衡量的改进，将极大增强实体保护和响应网络事件的能力。


    从董事的角度来看，接收对真实和模拟事件响应事件的深度分析和评估至关重要，这些评估应详细描述上述三个团队之外的其他职能团队之间的互动。此类评估（可能由独立的第三方执行）将为组织的整体网络韧性提供洞察，而这种韧性充其是一个不断演进的目标。


    网络韧性的重要部分还包括与外部专家和公司建立关系，以支持对数据泄露做出更果断的响应。破解后的环境并不是寻找所需专业知识或谈判合同条款的最佳时机，因此拥有一个“随时待命”的外部资源团队可以加速恢复和业务重启。这些外部专家可以包括取证、法务、通信和系统修复等。执法部门（`FBI`
    等）的处理方法也应在事件发生前予以。


    ## III. 董事应受网络安全两个广泛概念的指导：


    1. 确保网络安全在三线防御内进行管理，以及

    2. 确保网络安全基于收集情报并适应变化的环境进行管理。


    ### A. 三线防御


    网络安全需要一种不仅仅是信息安全部门唯一关注的方法。首选方法是三线防御模型。第一道防“风险识别与评估”是业务部门和信息安全团队的责任。因此，他们对拥有、理解和管理网络风险以及向董事通报评估结果有直接责任。


    第二道防“风险管理”是公司风险管理团队的责任，从战略业务角度对威胁的影响、优先级的确定和资源的分配提供职能监督。风险管理团队还应对第一线的网络风险处理方法提供建设性的战略业务挑战，确保建立了正确的政策和程序，并确保网络安全有效整合到运营和企业风险中。再次，应向董事会提供风险管理有效性的定期报告。


    第三道防“风险监控”是内部审计的责任，为董事会和高级管理层提供企业网络风险治理有效的保证。


    这三线防御应由活跃、投入的董事会指导，该董事会批准并监督公司的网络安全方法，批准战略决策和优先级，同时对管理层提供可靠且有效的制衡。


    ### B. 情报驱动方法


    传统的安全方法依赖于预防策略。它以异常方式处理事件响应。相比之下，情报驱动的心态是基于公司已经遭到入侵的假设，因此需要不断演进，以便在情报和事件方面保持领先。


