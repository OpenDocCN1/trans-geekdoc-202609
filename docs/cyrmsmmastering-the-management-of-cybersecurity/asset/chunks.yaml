    在上述场景中，如果中国是我公司主要的零部件供应商，我显然会担心我的替代供应链。如果中美之间的紧张局势升级，韩国可能不再是我的第一个“首选供应商”了。我还会监测首尔与东京之间的关系（到目前为止双方一直敌对），因为在北朝鲜干预的情况下，如果首尔和东京都站在美国一边，中人可能会花费更多时间来克制平壤，而不是在冲突中支持它。


    当我在花旗银行（Citicorp）工作时，我们会监控高净值人士资本的本地流动。资本从一个新兴市场流出预示着问题的开始——毕竟，只有该国家的人才最清楚这一点——并预示了该国货币最终的贬值。如果我们等到当地政府自己采取行动，而不是由我们监控资金流，那么做出反应就已經太晚了。现在对未来不做任何行动往往会产生最高风险。“触发线”（Trip
    wires）让你在事件开始左右你之前采取主动行动。


    # 针对风险做出更好的决策


    每当我听到有人说他们看到了“隧道尽头的亮光”时，我的第一反应是那可能是迎面来来的车灯。也许矿井比隧道贴贴的比喻：我们正在黑暗中前进，寻找黄金。我们不能仅仅根据我们看到的或我们自以为知道的事实来对未来做出决策。事实上，我们的决策总是基于不完整的信息——那只是我们那个时候手头拥有的最佳信息。因此，我们必须学会管理与不完美的决策过程相关的风险。我们可以将决策过程分为四个步骤：状况评估；游戏规则；做出决策；以及事后重新评估。


    ## 评估


    了解你所处的位置至关重要。在设定目标和管理风险之前，必须对你的当前状况进行清醒、彻底的评估。然而，我们感官本身的局限性使我们无法感知周围发生的很多事情，而这在大多数时候是一件好事。例如，如果我们能听到身体内细胞不断分裂的声音——那轰鸣声会把我们震聋的。事实上，清晰思考的能力似乎依赖于某种程度的感官剥夺。正因如此，我们的大多数人在工作时都会避免噪音。从更广泛意义上说，我们每天开始时的第一个感觉是我们的周围环境。尽管这个过程可能是下意识中发生的，但我们的眼睛首先接收卧室熟悉的景象，从而建立我们的位置。这似乎是我们的大脑在告诉我们：为了知道我们在做什么以及我们可能会去哪里，我们必须先知道我们在哪里。起初，这可能看起来像是一个矛盾——即认为既可以关注短期事件，又能关注长期计划——但我们的生活充满了不一致性。诀窍在于知道在适当的时候如何改变你的视野，先研究细节，然后退后一步观察大局。毕竟，没有细节，大局根本就不存在。


    了解你不知道的什么同样重要。理解你自身知识的局限性，并质疑他人的假设。例如，有许多研究预测，世界五大经济体中的三个——欧盟、日本和德国——的人口在未来四十年内将会下降，意大利、俄罗斯和韩国也是如此。这些变化无疑将引起全球经济生产的变化，并几乎会改变军事力量的平衡。人口老龄化的影响将极大加剧这一趋势，减少世界领先经济体中生产性劳动动力，同时导致医疗成本上升。虽然这些假设是基于预测的——因此真正是基于我们不知道的事物——但这些趋势足够令人警觉，值得在未来几年对底层假设进行持续的审查和质疑。


    ## 游戏规则


    确定你为了实现目标愿意接受多少风险是至关重要的。如果你实现了目标，你会得到什么？为了实现这个目标，你愿意放弃什么？年前，我被一家世界顶级投资公司聘请，帮助公司高层做出我们所谓的“多高才算太高”的决策。换句话说，高层愿意在特定的投资头寸中损失多少？我们在
    CEO 的会议室里转来转去，最终确定了这样一个简单的答案：“太高”是指他们不愿读到《华尔街日报》（`Wall Street Journal`）头版上关于自己的损失。保持在该数字以下将让公司管理层安心。对他们来说，对风险的胃与避免负面报道的需求有关。我建议他们对公司的投资组合设置限制，使其损失永远不会超过他们可以在报纸头版上接受的金额。公司的定量分析主管抱怨这些限制不够精确。当我回答时，大家都笑了：“大概上正确要比精确地错误要好。”当你定义了游戏规则时，做出决策变得更容易。


    ## 做出你的决策


    许多年前，我与玛格丽特·撒切（Margaret Thatcher）共进午饭。我问她：“首相，你为什么要和萨达姆·侯赛因战争？”她直视着我的眼睛说：“你绝不让欺凌者欺负你。我打了布什总统的电话，我们发起了战争。”她的回答告诉我，重要且困难的决策应该基于简单、基本的原则。


    首先，也是最重要的，我们需要识别出那些我们从根本不愿承担的风险，无论任何个人成本如何。当新冠肺炎席卷世界时，美国海军上布雷特·克罗泽（Brett Crozier）根据原则采取了行动。在面临指挥的数百（或数千）名水手可能死亡与等待指挥链行动之间做出选择时，他选择了他的船员的安全和健康。同样，如果我们每个人都了解自己的压力点，我们就能识别出自己处境中不愿承担的底线风险——无论如何。这让我们在过程早期处于更容易做出良好决策的位置。


    在评估风险时，我们都倾向于*低估*这些风险发生的程度和速度。在 2008 年金融危机之前的六个月，我问利曼兄弟的前首席执行官：“你的策略是什么？”他回答说：“保命！”这个答案听起来是否和今天我们从其他人那里听到的答案相似？至关重要重要的是，当你拥有*真实*的替代方案时，生命中的最佳决策才是做出的。因此，现在就开始制定现实的应急计划，以保护你免受不利影响。


