- fmt: '

    In taking stock of existing cybersecurity risks, boards should pay close attention
    to trends and recent events in their particular industry and impacting companies
    of a similar size. Particular types of cyberattacks appear more frequently in
    some industries, and less in others. If you are a small retailer, for example,
    your most pressing cybersecurity concern may be point of sale intrusions, where
    attackers exploit weaknesses in remote-access applications (often provided by
    third-party vendors) in order to siphon your customers’ credit card payment information.


    Directors should also have a broad understanding of who or which groups are most
    likely to target their companies, and for what purpose. As a starting point, the
    `2017 Data Breach Investigations Report` by Verizon (`2017 Verizon Report`) suggests
    that the majority of cyber breaches are perpetrated by external threat actors
    (75%), while a smaller percentage are perpetrated by insiders, such as employees
    or former employees (25%).


    Once the board has a good handle on the company’s existing cyber threat profile,
    it should prioritize strategies to mitigate the risk of an actual cyber breach.
    An effective director will help the company determine which assets are most valuable
    and evaluate the key controls in place to protect them.


    He or she will also plan for contingencies and ensure there is an appropriate
    response framework in place to deal with potential cyber incidents. Part of this
    exercise will inevitably entail reviewing the company’s budget related to cybersecurity
    to determine whether it is appropriate in light of existing threats and the robustness
    of existing company systems. (Keep in mind that it is less expensive to prevent
    a problem than it is to fix it.)


    One key takeaway is that there are no offensive strategies in cybersecurity—only
    defensive strategies. In addition, you cannot protect everything. Even the most
    technologically advanced organization in cyber—the National Security Agency (`NSA`)—could
    not protect its deepest secrets.


    ## 2. Assess Corporate Culture and Set the Right Example


    Firms that really “get it” in cybersecurity have adaptive cultures. However, most
    corporate cultures do not change quickly—they evolve at a slow pace. As a result,
    the security culture in many organizations has not kept pace with the threat landscape
    in which they operate.


    Security needs to be framed as a critical enabler that helps the company deliver
    its promise to customers. It also needs to be viewed by all levels of the company’s
    workforce as a shared endeavor based on `teamwork, not surveillance`.


    Also consider the “tone at the top” of your company and the messages that are
    being sent to employees related to cybersecurity practices. Encourage senior management
    to cultivate an environment where everyone has shared responsibility for cybersecurity.
    Ideally, employees should have a direct line of communication with someone in
    the company’s chief information security officer’s (`CISO`) department and understand
    they can reach out to that person for judgment and hassle-free guidance.


    It is also crucial that company management invest in quality employee training
    related to cybersecurity. It is now considered a best practice that employees
    receive a general security awareness training, which may focus largely or exclusively
    on cybersecurity.


    Also, training should not be a “one-and-done” exercise. The `CISO`’s department
    or the `GC` should regularly provide updates to employees via email on recent
    developments in cybersecurity and issues they should be aware of. This is the
    kind of constant reinforcement that cultivates a true culture of cyber “wellness.”


    A good place to start in evaluating a company’s cybersecurity culture is to review
    the company’s written and formal guidance on the use and protection of company
    systems. Does the company, for example, have a written policy regarding employees’
    use of personal email to conduct company business? How is that policy implemented
    and observed? Does the board abide by the same standard, or are there exceptions
    made? Ideally, directors will be able to lead by example. Understand that as a
    director, you may be a particularly attractive target for a cyber breach, as it
    is known that directors often use personal devices to download board books and
    communicate about sensitive, non-public company information.


    In all, a culture of cyber wellness needs to become a strategic focus embedded
    in the day-to-day operations and core values of the company. The new paradigm
    should be that cybersecurity is an ongoing risk that needs to be managed by everyone
    in the organization. When employees (of your company or of other companies) make
    missteps on this front, use these experiences as textbook examples of what not
    to repeat—anywhere in the firm. Because breaches often result in legal action,
    the board should include lawyers in their discussions and make sure their efforts
    to change corporate culture are seasoned with a legal perspective. After assuring
    that the tone at the top is one of integrity and effective compliance, the board
    should turn to strategic considerations.


    ## 3. Engage Key Cybersecurity Personnel


    The board should participate in selecting key personnel, such as the `CISO`. They
    should also ensure that adequate systems are in place to monitor those individuals’
    performances. In times past, companies often delegated responsibility for cybersecurity
    to the company’s chief operations officer or chief technology officer. Consider
    the officer who currently has primary responsibility for cybersecurity at your
    company. Is that person C-suite level? Is cybersecurity only one of many, pressing
    demands they are currently juggling? If the answer to the first question is “no,”
    and the second “yes,” you may consider creating a new role in the form of a `CISO`.


    The board should also consider the internal reporting structure for the `CISO`
    (or other officer with primary responsibility for cybersecurity) to ensure this
    individual has the independence and authority needed to succeed in this mission-critical
    role. The `CISO` may report to the company’s chief information officer, chief
    operations officer, chief technology officer, or even the chief executive officer—but
    in any case the `CISO` should have access to senior management and the board as
    needed. Company management should also consider establishing an information security
    committee chaired by the company’s `CISO`, and invite C-suite officers to attend
    the committee’s meetings. Directors, for their part, should understand who fills
    the `CISO` role and engage directly with that individual as appropriate.


    ## 4. Evaluate Risk Management Strategies


    From the board’s perspective, the key to effective oversight is to hold senior
    management responsible for articulating and monitoring the company’s strategy
    and risk tolerance related to cybersecurity. In most cases, board members should
    have their noses, but not their fingers, in the company’s cybersecurity program.


    One area where boards can, and should, play a crucial role is in developing the
    company’s strategic plan related to cybersecurity. Following this initial effort,
    the board should oversee company management in implementing the strategic plan.

