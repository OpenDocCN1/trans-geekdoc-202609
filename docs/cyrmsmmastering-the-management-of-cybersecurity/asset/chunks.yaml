    # 引言


    此外，第三方公司提供的服务是弹性的——换句话说，它们提供的服务和安全性的程度或水平各不相同。这导致了安全模型的不一致。你可能听过应用程序接口（`APIs`）。`APIs`
    是一种编程过滤器，让用户有机会定制其云服务功能以适应业务需求。例如，银行和烘焙店的需求截然不同，在它们的网站上拥有特定的数据过滤器对它们是有利的。虽然这些程序在允许用户进行身份验证、提供访问和影响加密方面极其有用，但它们也可能产生漏洞。`API`
    最大的漏洞在于应用程序之间发生的通信——这创造了可被利用的安全风险和新的攻击面。


    恰例说明的是：2019 年 1 月，研究人员揭示了大多数现代微处理器中常见的一种设计特征，该特征允许使用恶意的 JavaScript 代码从内存中读取内容（包括加密数据）。该问题的两个变体被称为
    `Meltdown` 和 `Spectre`（ Spectre），它们由于破坏了应用程序之间的隔离而允许侧信道攻击。这段技术术语的另一种说法是：攻击面的扩大意味着风险的增加！


    ## 云技术风险


    准备好面对随云技术而来的潜在问题了吗？在最近的一起在线银行泄露事件中，攻击者是托管银行网站的第三方公司的前员工。据称，犯罪分子利用 Web 应用程序防火墙凭据获取了“权限提升”，我们用这个词来指访问大多数人不应看到的信息。云的另一个潜在问题包括服务提供商无意擦除数据。这最近发生在一家大型在线零售商那里。通常情况下，企业对存储在云端的数据没有恢复计划。一旦数据丢失（如果没有备份的话），它就永远消失了。


    ## 网络攻击日益增长的威胁


    无论攻击是通过云端还是其他方式，针对持有敏感个人和专有数据的组织的网络攻击频率和严重性逐年剧增——这些攻击导致的资金损失现在已达`数十亿`。公共和私营组织都是如此。这些攻击对所有受影响的人来说无疑是破坏性的且昂贵的。


    银行、零售商、国防承包商、世界 500 强公司、娱乐公司和地区政府——所有这些最近都是网络攻击的受害者。这只是未来更多攻击的先兆。美国现在许多员工在居家办公，使用个人笔记本通过不安全的互联网连接访问包含机密信息和个人数据的工作文件。这为黑客提供了充足的机会——之前提到的“攻击面”。每家公司的攻击面都急剧扩大，使他们更容易成为目标。网络情报公司
    `CYFIRMA` 报告称，2020 年 2 月至 3 月之间，与新冠肺炎相关的网络威胁增加了 600%。


    ## 战略应对


    既然我已经引起了你的注意，面对网络攻击，我们应该——**你**应该做什么？答案绝对不是缩头乌龟。如果你和你的公司想在这个网络格局中生存并繁荣，你就必须变得明智且全面。你需要投资并增强你的网络风险管理（`CyRM`℠）。


    有些人可能认为美国政府可以保护他们免受攻击。毕竟，我们的军队保护我们免受入侵。为什么不保护我们免受网络入侵呢？但这是一个残酷的现实：尽管美国政府非常擅长传统的军事防御，遗憾的是，他们在网络防御方面并不出色。


    ## 政府失败与漏洞


    在`9·11`之后的二十年里，我们有充分的证据表明政府正在努力保护我们免受网络攻击。但我们没有任何证据。考虑一下，`2014`年 11 月，国家安全局（`NSA`）局长在国会作证，他认为外国可以有效关闭电力、水电和燃料。五多年前，我们的政府接到通知，不同国家可以关闭我们的国家基础设施。然而，政府并没有给出任何正在采取措施的保证。也许这种威胁太理论化了、太无形了，而且太关乎生存了。


    然而，在那次证词后仅仅四天，朝鲜就网络攻击了索尼，摧毁了专有信息以及计算机硬件。一个国家行为者证明了它可以访问并让一家大型跨国公司难堪。`2015`年，我们得知美国人事管理局（`OPM`）尽管早有警告，仍允许中国政府盗取
    2000 万美国人的数据。最近，`NSA` 未能充分保护其开发的、高度先进、武器化的`zero-day` 漏洞。（零日漏洞是先进的网络攻击工具，其速度之快、破坏之大，以至于受害者没有时间发现。）`NSA`
    失败的结果是，这些漏洞现在落在了全球范围内大作破坏的恶恶分子手中。`2020`年，由一个外国政府支持的团体发起的重大网络攻击渗透了美国联邦政府的多个部分。


    尽管存在攻击和专家的反复警告，美国政府自`2002`年以来还没有通过过任何独立的网络安全相关立法。`2002`年，我们都在使用美国在线服务（AOL），而 `Gmail`
    甚至不存在！最重要的拟议法案要求私营部门与政府共享更多数据。为什么公司要自愿向一个在保护 `OPM` 和 `NSA` 数据方面失职的实体交出敏感数据呢？这些数据可以说是其国家机密库中最敏感的信息。


    ## 未来展望


    雪上加霜的是，这种立法上的不作为还伴随着不愿让外国政府对我们公民和企业的网络攻击负责。像地理位置或军队规模——这些传统上保护这个国家的因素在网络空间中并不存在。突然之间，许多较小的国家可以直接入侵我们的能源**通信和金融行业。坏分子正在不断设计新的、更强大的恶意软件，以远程操纵和干扰这些行业。


    美国情报界内部日益担心，外国政府将网络入侵金融机构——不是为了偷钱，而是为了污染、破坏和操纵数据。外国情报机构策划的网络攻击旨在制造记录保存、交易精确性和货币估值方面的混乱，这可能会破坏和毁灭公众信任，以至于整个金融系统的稳定性可能受到影响。


