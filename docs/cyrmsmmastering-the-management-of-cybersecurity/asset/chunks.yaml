    As with radar, there are sophisticated formulas that help risk officers quantify
    all these scenarios. Intelligence is gathered (with the help of these formulas)
    and risk is anticipated.


    The evolution of cyber risk management into an effective oversight role has been
    hampered by most organizations’ inability to organize, classify, and measure cyber
    risks the way they would handle other kinds of risk. The quantification of cybersecurity
    risk should be at the heart of cyber risk management. Quantifying cyber risk leads
    to better decisions, because it describes risk in the same common language or
    context of other risks in the company. The reporting of cyber risk to senior executives,
    the board of directors, and other stakeholders facilitates a better understanding
    of the level of cyber risk over time for the company, specific businesses, products,
    and activities.


    Sounder decisions can also be made regarding the overall cybersecurity budget
    and the allocation of the cybersecurity spend, as well as on insurance coverage.
    It also helps to create a culture in which vulnerabilities are taken seriously.
    It provides an objective assessment of third-party vendors. It helps facilitate
    the integration of cyber risk with other enterprise and operational risks.


    So, how does a cyber risk manager gather intelligence and anticipate risk? There
    are seemingly infinite unknowns in the cyber landscape. I would suggest that an
    innovative approach based on the manufacturing industry can be used to address
    cybersecurity operational disruptions for organizations of all types.


    For example, in manufacturing, consider the assembly line at an auto manufacturing
    plant. If a disgruntled employee fires a bazooka at the middle of an assembly
    line, the plant management team can determine how long it will take to repair
    the line, how much it will cost to repair, and the cost of lost production. In
    other words, by focusing on what happened, irrespective of how it happened, the
    auto manufacturer can determine the potential disruption loss from the bazooka.
    (Of course, this scenario should also lead to an additional analysis of the risks
    generated by poor plant morale and disgruntled employees. But you get the point.)


    Let’s extend this example to an online banking application that’s supposed to
    be operational 24/7. Suddenly, in the middle of the night on a three-day holiday
    weekend, the banking app is rendered useless by a cyberattack. Irrespective of
    how the attack happened, and by focusing solely on what happened, the bank can
    determine the critical nodes that need to be repaired, how much it will cost,
    how long it will take, and the cost of the downtime—all of which can be quantified,
    just like in the manufacturing example.


    This approach, which focuses on the impact of a service disruption regardless
    of what caused it, allows you to effectively create a disruption model that you
    can use to quantify cybersecurity risk related to operational disruptions. Bottom
    line: cyber risk managers should focus on critical disruption nodes to improve
    resiliency—long before an attack ever happens.


    As with the classic risk example of walking in the rain, cyber risk managers often
    overlook the knock-on effects in these scenarios. As an example, let’s say a cyberattack
    on the financial system in New York includes an attack on the Manhattan power
    grid over a weekend. The financial exchanges all have emergency power systems,
    but their responses could be hampered because subways would also be out of commission.
    The knock-on effect is that the technical people who are supposed to respond to
    the attack would have great difficulty making it into the city—a fact that could
    easily be overlooked.


    A good cyber risk management officer focuses on what disruptions could happen,
    not on how they could happen. It’s also important to consider the knock-on effects
    of risk. And, ultimately, a good cyber risk manager must ask: "Are the protections
    I have in place adequate for my survivability?”


    Take, for example, a truly unknowable risk, such as the total amount of reputational
    loss created by a cyber incident. The operative question is: “What are the best
    practices—a response plan and policies—that should be developed so that the impact
    can be absorbed and the organization can continue to function?”


    In these cases, it’s important to know what the “crown jewels” of the company
    are, then to put down bright lines and strong mitigating controls to protect them.
    For example, in an asset management company, personal client data is extremely
    sensitive and may require extra layers of controls, including different security
    protocols. A second-line cyber risk management perspective should be primarily:
    “is the company doing everything it needs to do to properly mitigate the impact
    of these risks to ensure sustainability?”


    A strong CyRM℠ approach does the following:


    * Focuses on the impact of the cybersecurity events—not how they happen.

    * Uses disruption models to quantify operational disruptions.

    * Converts as many unknown risks into known risks, so they can be quantified.

    * And, for those truly unknowable risks, focuses on what needs to be done to ensure
    survivability.


    # Building a More Effective Cybersecurity Defense


    Think of the cyber risk management prong of CyRM℠ like the human immune system.
    When a germ breaches the body''s natural barriers, the immune system mounts a
    three-step defense: sound the alarm, solve the problem, and recover and remember.
    The first defenders on the scene are the white blood cells, which constantly circulate
    throughout the body, much like police on patrol. Next, specialized white blood
    cells called lymphocytes engage in a two-pronged attack—one directed at infected
    cells and the other at hostile microbes roaming through the blood. Finally, once
    the invaders and the compromised cells have been destroyed, the immune system''s
    soldiers return to their bases, leaving a smaller number of seasoned veterans
    to attack should the invader return.


    The effectiveness of cybersecurity defense, like that of the immune system, depends
    largely on each component efficiently fulfilling its role. Corporations clearly
    need to manage cybersecurity at the enterprise level and must improve the ability
    of each element—line management, operations, internal audit, risk, and compliance—to
    satisfy its individual and organizational functions. Managing cybersecurity risks
    requires three lines of defense. The first is to prevent cyber incidents from
    occurring and to protect the organization. This is the responsibility of everyone
    in the entire organization, and especially the technology and information security
    departments. Senior management should designate a senior partner who’s the responsible
    officer for firmwide cybersecurity. In the day-to-day management of technology
    or in a crisis, it’s far better to have a skillful leader rather than a subject
    matter expert. In choosing the right person, his or her leadership skills—communication
    and crisis management—are equally important. CyRM℠ isn’t managed in a silo. Discussions
    should be part and parcel of all management processes, such as new product approvals,
    merger due diligence, and third-party outsourcing arrangements.

