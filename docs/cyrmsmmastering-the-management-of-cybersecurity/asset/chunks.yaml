    我的家庭安全方法——一种动态 CyRM℠ 程序的模拟版本——之所以成功，是因为它是全面的。考虑防范网络攻击的一种方法被称为“深度防御（Defense in
    Depth）”。这种方法模仿了传统的军事战略。“深度防御”策略并非将所有资源集中在前线，而是将防御者部署在一系列预先计划的位置上——即一系列层级——从这些位置他们可以占据优势并进攻推进的敌人。转化到网络安全领域，“深度防御”策略使用多种安全技术和产品来缓解单个组件失效的风险。“深度防御”还能减缓攻击者的速度，并赢得修复问题的时间。


    当连环银行劫犯威利·萨顿被问及为什么觉得必须去抢劫金融机构时，他回答说：“那里有钱。”网络犯罪分子也是如此。你的公司需要决定哪些数据最有价值，然后投入相应的资金进行保护。例如，机密客户信息（如社会安全号码）可能是最关键的，应该受到最严格的保护。如果是如此，请将网络安全预算的大部分分配给客户信息保护。


    在考虑保护客户数据时，请记住，这不再仅仅是数据被盗的问题——还要担心数据可能被篡改导致其无法使用或错误。这是分子在公司眼皮底下会做的事情，而且可能需要很长时间才能发现！因此，你的公司制定最有效的策略或多种策略来保护重要数据至关重要。一旦你确定了需要保护内容的关键性，就可以优先排序并分配资源，以避免和缓解网络安全威胁。那时，你就可以判断你的网络安全预算是否合适。


    此外，全面掌握其他风险缓解项目（如保险）的条款条件也是重要的，并相应地了解保险和其他风险缓解措施在什么情况下不会有效。例如，你的公司是客户的信赖顾问。如果你的公司遭受了网络攻击，并因此丢失了顶级客户的高度私密财务数据，这对你公司声誉的打击可能足以让你的公司倒闭。


    聪明的公司理解，CyberWellness℠ 不是一个需要解决的技术问题，而是一项需要持续管理的持续风险。网络安全是无法保证的，但及时恰当的反应是可以做到的。考虑到这一点，让我们考虑防范黑客攻击的最佳方法。


    ## 应急响应计划


    你的公司应该制定兼顾公共关系和法律问题的应急响应计划。应急响应计划有助于识别、响应并从网络安全安全中中恢复。应急响应计划的目标是防止服务中断、数据丢失或被窃等损害，并防止对组织系统的非法访问。


    如果没有能够执行该计划的团队，应急响应计划就是完整的。团队成员是事件的负责人——他们负责与内部伙伴以及外部人员（如法律顾问、媒体、执法部门、客户和其他利益相关者）进行沟通。为了让应急响应团队有效，他们需要高层的支持、持续的测试以及清晰的通信渠道。团队需要制定一个响应计划，为这些每个步骤提供结构化的流程：


    *   **准备：** 进行风险评估并对安全问题进行排序。识别哪些是最敏感的资产，并借此确定团队应该关注的哪些关键安全事件以控制问题。创建通信计划并准备相关文档，清晰、简要地概述角色、职责和流程。

    *   **识别：** 当发现潜在的事件时，团队应立即收集额外证据，决定事件的类型和严重程度，并记录他们正在做的一切。

    *   **遏制：** 一旦团队识别出安全事件，首要目标是遏制事件并防止进一步损害。

    *   **根：** 团队必须识别攻击的根源，并采取措施防止未来发生类似事件。例如，如果漏洞被利用，应立即进行补丁。

    *   **恢复：** 团队应该仔细地让受影响的生产系统重新上线，确保不再发生其他事件，然后测试并验证受影响的系统已恢复正常。

    *   **经验总结：** 进一步调查事件以识别其是否可能再次发生，然后采取必要措施确保其不再发生。


    ## 渗透测试


    健康的 CyberWellness℠ 计划还会进行`penetration testing`——也称为渗透测试（或称 pen testing）。渗透测试从恶意攻击者和丰富的网络安全专家的视角审视你的网络、应用程序、设备和物理安全，以发现弱点并识别你的安全态势需要改进的领域。渗透测试不仅限于发现犯罪分子可能获取未经授权的敏感数据、甚至为了恶意目的接管你系统的方法。它还模拟真实的攻击，以确定你的防御表现如何，以及可能的泄露规模。此类评估（可能由独立的第三方执行）可以让你洞察组织的整体网络弹性韧性，而这是一个不断演进的目标。


    渗透测试不仅关乎哪里错了。它还关乎识别合适的权衡——因为你无法保护一切。全面的渗透测试考虑几个领域：应用程序、网络（包括无线）、弱密码和协议，以及物理屏障（如传感器和摄像头）。


    就像你去医疗保健机构进行年度体检一样，聘请经过高度训练的安全顾问来执行你的安全测试也是有意义的。虽然你可能认为自己完全健康，但医生可以进行测试来检测你未意识到的危险。同样，那些制定、维护和监控你安全计划的人可能不具备识别安全缺陷所需的客观性，无法理解你组织的风险水平，也无法帮助解决和修复关键问题。用比喻（隐喻）来说，在这场持续的猫鼠游戏中，你应该明智地经常咨询客观的外部猫，因为老鼠既敏捷又狡猾——一直在学习，一直在演进，发明偷取你奶酪的新方法。


    ## 桌面演练


