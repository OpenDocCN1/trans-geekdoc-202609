    High-profile incidents affecting Deloitte, Equifax, Facebook, and many others
    over the past year or so, remind us how quickly the risk of breaches and response
    to those events can impact a company’s reputation. A breach of sensitive customer
    and company data and systems brings enormous scrutiny from shareholders and regulators
    and poses a significant risk to a firm’s operations as well as to its stock price.
    Furthermore, under securities laws, directors are gatekeepers who have responsibilities
    to shareholders in preventing wrongdoing.


    Of course, Directors have fiduciary duties of care, loyalty, and good faith to
    ensure to protect corporate assets, including customer information, as well as
    the firm’s reputation and shareholder value. This includes ensuring the existence
    of an effective Cybersecurity Program that satisfies legal requirements and maintains
    multi-layered security measures that protect sensitive information from unauthorized
    modification, destruction, or disclosure — whether accidental or intentional.
    To meet their responsibilities, directors should schedule regular briefings from
    their General Counsel and/or outside lawyers to brief the directors on cybersecurity
    and privacy implications for federal, local, and state laws.


    ## Conclusion


    Public scrutiny after cyber-attacks and the regulators have made cybersecurity
    a board issue and key responsibility. In crisis, the only thing people remember
    when it comes to judgement calls is the outcome. A good outcome is usually the
    result of a well- considered, disciplined process that demonstrates collective
    wisdom and commitment to corrective results.


    Board meetings are an opportune time for corporate directors to reassess how they
    exercise their governance responsibilities with regard to the management of cybersecurity
    risk. In today’s global cyber minefield, it is essential that boards of directors
    not just monitor performance, but incentivize excellence in this area.


    ## Appendix: The DCRO Guiding Principles for Cyber Risk Governance


    **Principle 1:** Directors should view cybersecurity as an important element of
    enterprise risk that they must oversee: identifying the company’s essential assets
    that may be vulnerable to cyber attack, which cyber risks to avoid, accepts, or
    mitigate, and to develop specific plans associated with each approach.


    **Principle 2:** Directors should view cybersecurity as a strategic and managerial
    issue and should therefore hold management accountable for recommending and implementing
    the overall cyber risk management strategy and polices.


    **Principle 3:** Directors should be guided by two broad concepts of cybersecurity:
    ensuring that it is managed within “three lines of defense” and based on reacting
    and adapting to gathering intelligence and the changing risk environment.


    **Principle 4:** Directors should understand the company’s exposure to third-party
    vendors.


    **Principle 5:** Directors should commit to developing the corporate culture that
    places a high value on cybersecurity.


