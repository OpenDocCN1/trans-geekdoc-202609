- fmt: '

    Respond: Develop and implement the appropriate activities to take action regarding
    a detected cybersecurity event.


    Recover: Develop and implement the appropriate activities to maintain plans for
    resilience and to restore any capabilities or services that were impaired due
    to a cybersecurity event.


    Guidelines from the SEC also provide valuable assistance to directors, given the
    agency’s considerable influence in markets. Cybersecurity has long been a priority
    of the SEC’s National Exam Program, which is overseen by the Office of Compliance
    Inspections and Examinations (OCIE). In August 2017, OCIE posted a risk alert
    highlighting the results of its Cybersecurity 2 Initiative. Although this initiative
    focuses only on broker dealers, investment advisers, and funds, the findings of
    OCIE provide a template for directors of companies in other industries.


    As part of the Cybersecurity 2 Initiative, OCIE assessed how companies managed
    their cybersecurity programs in the following areas:


    1. Governance and risk assessment

    2. Access rights and controls

    3. Data loss prevention

    4. Vendor management

    5. Training

    6. Incident response


    From a broad perspective, OCIE found that while firms were doing more to establish
    cybersecurity programs, they weren’t doing enough to maintain and update those
    programs in light of the constantly changing cyberthreats and attacks. For example,
    OCIE noted that nearly all firms had plans that address access incidents, such
    as denial of service incidents and unauthorized intrusions; however, less than
    two–thirds of advisers and funds surveyed appeared to adequately maintain such
    plans.


    ### Monitoring and Board Oversight


    Directors should approach monitoring their companies’ cybersecurity efforts like
    ongoing maintenance of machinery. Regular checks and adjustments will be needed,
    and it isn’t a one-time exercise. Technical means for conducting and preventing
    cyberattacks will constantly evolve. Moreover, old tactics and systems may be
    deemed irrelevant or insufficient as the company moves toward different operating
    systems or expands its business portfolio.


    Accordingly, it’s wise for directors to have a standing review of the company’s
    cybersecurity program at quarterly meetings, at the very least. There should also
    be a procedure in place for briefing the board more frequently if new and serious
    issues emerge. The company’s board minutes should accurately reflect when cybersecurity
    is discussed at such meetings so that the board’s diligence is documented and
    demonstrated.


    Boards should also regularly receive a cybersecurity scorecard that highlights
    the company’s progress mitigating cyber risk, including external metrics, gap
    remediation, emerging risks, trade-offs, and other issues. The scorecard doesn’t
    need to include highly technical key performance indicators to be effective. Instead,
    examples of good metrics for the board include:

    - customer satisfaction (customer system downtime caused by information security
    incidents)

    - reputation (number of information security incidents reported in the media)

    - financials (information security budget as a percent of IT budget)


    ### Data Collection and Analysis


    As an important principle, boards should ensure that management and company employees
    collect, analyze, and share data regarding cybersecurity incidents—both large
    and small—to help inform the effectiveness of ongoing cybersecurity efforts. The
    company should also prioritize collecting, analyzing, and sharing internally any
    information the company may receive from government, private, or nonprofit sources
    regarding cyber vulnerabilities and possible exposure.


    ### Incident Escalation and Human Error


    Following Equifax, it’s important for all companies to take a hard look at their
    information escalation protocols. Who’s informed when a possible cyber incident
    is first picked up on the company’s radar? Oftentimes, more junior employees will
    be best-placed to observe the first signs of a cyber breach. When it comes to
    installing critical software patches—such as in Equifax’s case—ensure there are
    systems in place for appropriate supervision and peer review so that one person’s
    human error doesn’t result in a catastrophic (and preventable) breach.


    ### Learning from Mistakes


    Directors should also ensure the company has a system in place to encourage employees
    and management to learn from past mistakes. Acknowledging mistakes and learning
    from them leads to better decision-making. Cybersecurity postmortems should be
    encouraged in briefings about the company’s security model and vulnerabilities.


    When a mistake occurs, this is also a good time to consult a lawyer. Certain mistakes
    come with legal responsibilities. For example, a company may have to disclose
    cybersecurity risks and adverse cyber events to its shareholders. Boards should
    make sure any postmortem, and any policy that grows out of it, includes the necessary
    legal response.


    ### Disclosure Obligations and Regulations


    More and more public companies are describing cybersecurity as a risk in their
    financial disclosures each year. But what to disclose, and when to disclose it,
    remains a thorny issue for many. Equifax received significant criticism for waiting
    until September to disclose a breach it discovered in late July. But companies
    and regulators alike are realizing that there’s a major tension between disclosing
    early and waiting to learn all material facts in order to avoid making misleading
    or inaccurate disclosures.


    The SEC itself was subject to criticism for its perceived missteps in handling
    the `EDGAR` data breach. The SEC first reported that no personally identifying
    information was taken; it later had to revise those statements. Also, the breach
    happened in 2016, but it was reported to the public in September 2017.


    It’s critically important for companies to have appropriate escalation protocols
    in place. Don’t lose precious time waiting for the report of a breach to slowly
    make its way up the chain to decision-makers. Instead, any time between a material
    breach and disclosure should be well spent investigating the facts and analyzing
    the issues.


    The SEC has provided some guidance in this area. In 2011, the SEC’s `Division
    of Corporation Finance` published guidance for public companies concerning disclosure
    obligations related to cybersecurity threats and adverse cyber events. The guidance
    recommends that material information regarding cyber risk and adverse cyber events
    should be disclosed if necessary to make other disclosures not misleading. In
    particular, a company should review its cyber risks in light of the severity and
    frequency of prior cyber events. Companies should also consider the adequacy of
    their cyber defenses in light of the risks present in their particular industry.
    Companies should avoid generic risk factor disclosure and instead should consider
    their unique facts and circumstances. For example, a disclosure that a threat
    `may` occur may be insufficient if a company `already` experienced that threat.
    A company should also consider including a discussion of cyber risks and incidents
    in the management discussion and analysis (`MD&A`) portion of its regular filings
    if the costs or consequences associated with the cyber risk or incident are likely
    to have a material effect on the company’s financial condition.


    While the SEC has yet to dip its toe, other regulators have already been active
    in enforcing cyber-related disclosure obligations. For example, in August 2017,
    Uber settled charges brought by the Federal Trade Commission (`FTC`) relating
    to a 2014 breach. The FTC alleged that the company made deceptive claims about
    its efforts to safeguard customer information and failed to undertake “reasonable,
    low-cost measures” to prevent unauthorized access to customers’ personal data.
    Meanwhile, the FTC has confirmed that it is currently scrutinizing Uber’s response
    to the 2016 breach, which the company only recently disclosed.

