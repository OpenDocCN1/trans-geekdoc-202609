    To meet this duty of care, directors must be able to demonstrate that they have
    discharged their oversight function of cybersecurity in a reasonable common sense
    manner. To that end, directors should receive regular assessments and assurances
    from both the `CEO` and the `CISO` that the work being performed by the entire
    organization (i.e., not just the technology function) is highly focused on protecting
    the crown jewels and other high priority assets. These work initiatives should
    involve functional segmentation, robust identity access management, and higher
    levels of employee training, along with the leading-edge security practices at
    the network and end-point levels.


    Also, acknowledging mistakes and learning from them leads to better decision making.
    Cybersecurity post mortems should be encouraged in briefings about the company’s
    security model and vulnerabilities. There is no substitute for the proper deliberation
    and engagement of cybersecurity issues.


    Of course, when developing new products and services, a company needs to strike
    the right balance between innovation and risk. In most cases, the more that security
    is increased, the less user-friendly and convenient the product becomes. Processes
    that should be reviewed for a cyber filter include strategic planning, M&A, product
    development, and capital allocation and budgeting. Even HR processes should have
    a cyber-filter to understand recruiting, leadership development, and cyber resource
    retention strategies.


    ## II. DIRECTORS SHOULD VIEW CYBERSECURITY AS A STRATEGIC AND MANAGERIAL ISSUE
    AND SHOULD THEREFORE HOLD MANAGEMENT ACCOUNTABLE FOR RECOMMENDING AND IMPLEMENTING
    THE OVERALL CYBER RISK MANAGEMENT STRATEGY AND POLICIES.


    1. Management should be accountable for reporting their actions and cyber breaches.

    2. Where appropriate, the board should require key executives to attest that certain
    important aspects of the cybersecurity plan have been executed.

    3. Promoting employee awareness and training is crucial.

    4. Third-party testing of cyber vulnerabilities can provide a high degree of deterrence.

    5. Boards should maintain an external team of professionals that are available
    for training and in crisis situation.


    Directors must understand security through a broader lens than simply information
    technology (IT), since the potential harm to a company can be devastating.


    Cybersecurity risk demands C-level accountability and board oversight to drive
    the agenda and manage empowered employees with the right skill sets.


    Discussions about cyber risk management with the accountable corporate officer
    should be given regular and adequate time on board and board committee meeting
    agendas.


    The accountable officer’s leadership skills — communication and crisis management
    — should be considered equally, as they are often more important than technical
    skills. Clearly, in the day-to-day management of technology, or in a crisis, it
    is far better to have a skillful leader rather than a subject-matter expert.


    The board should also create a self-assessment framework in terms (and language)
    that they fully understand to ensure that best industry practices are being implemented
    and real progress is being made. A strong focus on outcomes should replace pure
    activity- based reporting.


    Directors need to promote a robust state of cybersecurity and resilience by encouraging
    appropriate interaction between all levels of management and subordinates.


    It is well documented that approximately two-thirds of successful unauthorized
    cyber-attacks are directly attributable to the actions (or inactions) made by
    employees.


    Therefore, improving awareness of employees to cyber risk exposures represents
    a meaningful opportunity to enhance an organization’s overall cyber resilience.


    Any measurable improvement to employee awareness through initiatives such as gamification
    and continuous training that is operational in nature would be highly accretive
    to an entity’s capacity to protect and respond to a cyber-incident.


    From a board director’s perspective, it is important to receive in-depth analysis
    and evaluations of real and simulated incident response events that describe in
    detail the interactions between the various functional teams beyond the three
    described above. Such evaluations (perhaps performed by an independent third party)
    would provide insight into the organization’s overall cyber resilience which is,
    at best, a continuously evolving objective.


    An important part of cyber resilience entails establishing relationships with
    external experts and firms to support a more decisive response to a data breach.
    The post-breach environment is not the optimal time to be searching for required
    expertise or negotiating contractual terms, so having a team of external resources
    “at the ready” can speed recovery and resumption of operations. These external
    experts can include forensics, legal, communication, and systems remediation,
    among others. The approach to law enforcement (`FBI` and others) should also be
    considered in advance of an incident.


    ## III. DIRECTORS SHOULD BE GUIDED BY TWO BROAD CONCEPTS OF CYBERSECURITY:


    1. Ensure that cybersecurity is managed within three lines of defense, and

    2. Ensure that cybersecurity is managed based on constantly reacting to gathering
    intelligence and promoting adaptation to the changing risk environment.


    ### A. Three Lines of Defense


    Cybersecurity requires an approach that goes beyond being the sole concern of
    the information security group. A preferred approach is a three-lines-of-defense
    model. The first line of defense, “risk identification and assessment,” is the
    responsibility of the business units and information security teams. Therefore,
    they have the direct accountability for owning, understanding and managing cyber
    risks and making the directors aware of their risk assessments.


    The second line of defense, “risk management,” is the responsibility of the company
    risk management team to provide functional oversight from a strategic business
    perspective regarding the potential impact of threats, the determination of priorities,
    and the allocation of resources. The risk management team should also provide
    constructive, strategic business challenges to the first line’s approach to cyber
    risk, ensuring that the right policies and procedures are in place, and that cybersecurity
    is effectively integrated into operational and enterprise risk. Again, periodic
    reports of the effectiveness of risk management should be provided to the board.


    The third line of defense, “risk monitoring,” is the responsibility of internal
    auditing to provide assurance to the board and senior management of the effectiveness
    of cyber risk governance for the enterprise.


    These three lines of defense should be guided by an active, engaged board of directors
    that approves and oversees the firm’s approach to cybersecurity, approving strategic
    decisions and priorities, while providing a credible and effective counterbalance
    to management.


    ### B. Intelligence Driven Approach


    The traditional approach to security relies on prevention strategies. It treats
    incident responses using an exception-based approach. In contrast, an intelligence-driven
    mindset is based on the assumption that the company has already been compromised
    and therefore the need exists to continuously evolve to stay ahead of the curve
    in terms of intelligence and incidents.

