    首先，数据、连接、交易和通信数量出现了此前无法想象的爆炸式增长，这导致传统数据系统过载。


    其次，机构已经失去了有效识别问题的能力。更快的创新周期和琳琅满齐的新产品意味着，大多数企业发现自己无法快速识别安全违规。社交网络系统、大数据、云计算、移动互联网和物联网技术正在产生个人数据流，这使得授权和信息过滤变得异常困难。


    第三，缺乏正式的控制机制。在网络安全中断变得日益普遍和复杂的环境中，在检测、响应、补救和企业内部通信方面仍然没有公认的标准。这些关键功能的管理通常留给 IT
    部门，而 IT 部门通常被要求追求过时的“硬壳策略”，这些策略的设计初衷仅仅是为了防止渗透。


    凭借作为风险管理领导者的十年经验，我审视了这一局面，并清楚地意识到我们需要一种信息安全模型，能够持续评估其收集信息的有效性、可靠性和价值。我开发并完善了这种安全模型，将其转化为一个我知道可以帮助公司避免网络攻击最糟糕陷阱的流程。它被称为网络风险管理，或
    `CyRM℠`。


    `CyRM℠` 是一种新范式，它将安全视为业务问题并与业务需求对齐。因此，它不再将安全视为由技术人员处理的技术问题，而是使用一种结果为驱动的方法来平衡投资与风险。更进一步，它不是以牺牲高层参与为代价向问题投入金钱，而是将网络安全与业务决策相结合，以影响业务结果。


    为了有效影响业务结果，`CyRM℠` 需要由三个部分组成：


    1. **风险管理：** 它需要将风险管理原则应用于网络安全，以对整个组织的风险进行观察，指导资源分配、更好地管理风险并实现问责制。

    2. **CyberWellness℠：** 它不仅需要涵盖整个公司，还需要涵盖每个需要对其所承担的风险负责的员工。这需要一个与网络安全的互动过程——就像公司的身体健康计划一样，公司采取积极措施促进员工健康。

    3. **作为业务战略的网络安全：** 网络安全需要重新定位到它的本质——作为增长的推动者，而不仅仅是为了通过消除病毒和黑客带来的危险来降低运营风险。它还需要增强产品完整性、客户体验、运营合规性、品牌声誉和投资者信心。


    本书阐述了我对 `CyRM℠` 的方法，并向你们——无论是业务领袖还是 IT 经理——展示如何合作并取得成功。书的每一章都会告诉你在管理当前网络安全格局方面需要的知识。每一章都以
    `CyRM℠` 行动点结束——这是你可以采取的主动步骤，让自己和你的公司做好生存和成功的准备。我期待成为你们的教育者和导师，共同深入研究 `CyRM℠`。


    # 1 现状


    2017 年 9 月 7 日，美国最大的信用监控机构之一 Equifax 宣布，超过 1.43 亿个客户账户被攻破，这可能是迄今为止对美国消费者影响最大的网络攻击。此后，受影响人数估计已增加到
    1.47 亿。


    在 Equifax 争议期间，美国证券交易委员会（`SEC`）主席 Clayton 于 9 月 20 日宣布，`EDGAR` 系统已被攻破。从那时起，SEC`
    对其系统的安全性提出了质疑。


    高性攻击持续发生。在《权力的游戏》案例中，`HBO` 网络遭到入侵，被盗了 1.5 TB 的信息。“四大”会计师之一的 `Deloitte` 通知客户其内部电子邮件系统遭到破坏。`Uber`
    花了了一多的时间才承认被黑客攻击，并支付了赎金以删除被盗数据。


    大规模数据泄露每年都在发生。2019 年，`Capital One` 透露一名黑客获取了 1 亿个客户账户的访问。`Quest Diagnostics` 透露
    1200 万患者的医疗信息被泄露。在剑桥分析丑闻发生约一年后，`Facebook` 承认无意中泄露了超过百万用户的电子邮件。


    2020 年，与多伦多大学相关的 `Citizen Lab` 揭露了一群位于新德里的、被称为 `Dark Basin` 的雇佣黑客。这些受雇的黑客针对了 `Exxon`
    和一家名为 `Wirecard` 的德国公司。2020 年，黑客通过针对远程员工入侵了美国最大的国防承包商之一 `Lockheed Martin`。所有黑客进入公司所需的只是某一个弱点；一旦他们找到了那个点，就可以控制整个网络并窃取数据和秘密。


