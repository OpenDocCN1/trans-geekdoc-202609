    ## How Do Directors Cope with their Obligations to Oversee Cybersecurity?

    A Practical Primer For Boards of Directors in the Age of Equifax, Uber, et al.

    By Roel Campos and David X Martin


    Many directors understand they have a responsibility to oversee cybersecurity
    at their companies. But more puzzling is what they should be doing now to contribute
    to the board’s effort. What are the right questions they should be asking? Below
    we provide a short discussion of the major areas in cybersecurity compliance that
    you should be concerned with. We invite you to keep this article in your files
    for your director references and duties, and use the outline at the end of this
    article when discussing cybersecurity at board meetings.


    ## Introduction

    On September 7, 2017, one of the nation’s largest credit monitoring agencies,
    `Equifax Inc.`, announced that over 143 million customers’ accounts had been breached
    in what may be the most significant cyberattack to impact U.S. consumers to date.


    Amidst the Equifax controversy, the U.S. Securities and Exchange Commission (`SEC`)
    made some striking disclosures of its own. The newly-arrived `SEC` Chair, `Jay
    Clayton`, announced on September 20, 2017 that the `SEC`’s own `EDGAR` filing
    system had been penetrated by cybercriminals months previously, leading to questions
    about the safety of such systems and the risk of insider trading by individuals
    with advance knowledge of sensitive, nonpublic company information.


    Other recent high-profile cyberattacks abound. Much to the chagrin of fans of
    the popular television show Game of Thrones, the `HBO` television network was
    breached in July 2017 by a group that pilfered over 1.5 terabytes of information,
    including show scripts and full episodes of several prominent shows.


    In one of the more salacious stories, recent revelations from `Uber Technologies,
    Inc.` detail a 2016 breach of the ride-sharing company’s systems, during which
    hackers stole the names, email addresses, phone numbers, and drivers’ license
    numbers of millions of Uber’s customers and drivers. Not only did `Uber` fail
    to disclose the breach for over a year—but it also purportedly paid a “ransom”
    to the hackers in exchange for a promise by the hackers to delete the purloined
    data and keep the cyber incident quiet.

