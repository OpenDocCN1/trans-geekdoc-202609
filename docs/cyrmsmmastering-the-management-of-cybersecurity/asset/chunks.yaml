    过去一年左右，影响德勤（Deloitte）、Equifax、Facebook 以及许多其他公司的知名事件提醒我们，数据泄露风险以及对这些事件的响应有多快地影响一家公司的声誉。敏感客户和公司数据及系统的泄露将引起股东和监管机构的严审查，并对公司的运营及股价构成重大风险。此外，根据证券法，董事是看门人，有责任向股东防止发生违规行为。


    当然，董事负有尽职调查、忠诚和诚实的信义义务，以确保保护公司资产（包括客户信息）以及公司的声誉和股东价值。这包括确保建立有效的网络安全计划，以满足法律要求，并维护多层安全措施，保护敏感信息免受无论是意外还是故意的未经授权的修改、破坏或泄露。为了履行这些职责，董事应安排其总法律顾问和/或外部律师进行定期简报，向董事通报联邦、地方和州法律对网络安全和隐私的影响。


    ## 结论


    网络攻击后的公众监督以及监管机构的要求已使网络安全成为董事会的议题和核心责任。在危机中，人们在做出判断时唯一记得的是结果。一个良好的结果通常是深思熟虑、严谨的流程的结果，这展示了集体智慧以及对纠正结果的承诺。


    董事会议是公司董事重新评估其在网络安全风险管理方面如何行使治理责任的良机。在当今的全球网络地雷区中，董事会不仅要监控表现，还要激励在该领域追求卓越表现。


    ## 附录：DCRO 网络风险治理指导原则


    **原则 1：** 董事应将网络安全视为企业风险的一个重要元素，他们必须对其进行监督：识别公司可能易受网络攻击的本质资产，确定需要避免、接受或缓解哪些网络风险，并针对每种方法制定具体的计划。


    **原则 2：** 董事应将网络安全视为一个战略性和管理性的问题，因此应要求管理层对建议和实施整体网络风险管理策略及政策负责。


    **原则 3：** 董事应受网络安全两个广义概念的指导：确保在“三道防线”内进行管理，并根据收集的情报和不断变化的风险环境做出反应和适应。


    **原则 4：** 董事应理解公司对第三方供应商的风险敞口。


    **原则 5：** 董事应致力于培养一种高度重视网络安全的企业文化。


