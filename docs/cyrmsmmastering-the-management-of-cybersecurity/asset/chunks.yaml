  trans: '


    在评估现有网络安全风险时，董事会应密切关注其所在行业的趋势和近期事件，以及规模相似公司的影响。某些类型的网络攻击在某些行业中发生频率较高，而在另一些行业则较少。例如，如果你是一家小型零售商，你最紧迫的网络安全关注可能是销售点入侵，攻击者利用远程访问应用程序（通常由第三方供应商提供）的漏洞来窃取你客户的信用卡支付信息。


    董事还应该广泛地了解谁或哪些群体最可能针对他们的公司，以及目的是什么。作为一个起点，威信公司发布的`2017 年数据泄露调查报告`（`2017 Verizon
    Report`）显示，大多数网络泄露是由外部威胁者实施的（75%），而比例较小的一部分则是由内部人员（如员工或前员工）实施的（25%）。


    一旦董事会会对公司现有的网络威胁状况有了良好掌握，就应该优先考虑缓解实际网络泄露风险的策略。一名有效的董事成员会帮助公司确定哪些资产最有价值，并评估保护这些资产的关键控制措施。


    他或她还将为突发情况制定计划，并确保有适当的响应框架来处理潜在的网络安全事件。这一过程的一部分不可避免将涉及审查公司与网络安全相关的预算，以根据现有威胁和公司现有系统的稳健性确定预算是否合理。（请记住，预防问题比修复问题要便宜得多。）


    一个关键结论是，网络安全中没有进攻性策略——只有防御策略。此外，你无法保护一切。即使是网络领域技术最先进的组织——国家安全局（`NSA`）也无法保护其最深层的秘密。


    ## 2. 评估企业文化并树立正确榜样


    真正“理解”网络安全的公司具有适应性文化。然而，大多数企业文化并不会快速变化——它们是以缓慢的速度演化的。因此，许多组织的安全文化未能跟上其所处威胁格局的发展。


    安全需要被框架化为关键的推动因素，帮助公司履行对客户的承诺。它还需要被公司所有层级的员工视为一项基于`团队协作，而非监控`的共同努力。


    还要考虑贵公司的“高层基调”以及发送给员工的有关网络安全实践的信息。鼓励高层营造一种每个人都对网络安全承担共同责任的环境。理想情况下，员工应该能够与公司首席信息安全官（`CISO`）部门的成员直接联系，并理解他们可以向该人员寻求判断和无忧的指导。


    公司管理层投资与网络安全相关的高质量员工培训也至关重要。现在，接受通用的安全意识培训被认为是一种最佳实践，这种培训可能在很大程度上或完全专注于网络安全。


    此外，培训不应是“一次性”的活动。`CISO` 部门或总法官（`GC`）应定期通过电子邮件向员工提供网络安全领域的最新进展以及他们应该注意的问题。这种持续的强化能够培养出真正的网络“健康”文化。


    评估公司网络安全文化的良好起点是审查公司关于使用和保护公司系统的书面及正式指导意见。例如，公司是否有一份关于员工使用个人邮箱处理公司业务的成面政策？该政策是如何实施和遵守的？董事会是否遵守同样的标准，还是存在例外情况？理想情况下，董事成员将能够以身作则。要明白，作为董事，你可能是网络泄露的极具吸引力的目标，因为众，董事经常使用个人设备下载董事会书籍并就敏感的非公开公司信息进行交流。


    总之，网络安全健康文化需要成为嵌入公司日常运营和核心价值观的战略重点。新的范式应该是网络安全是一项持续的风险，需要组织中的每个人来管理。当员工（贵公司或其他公司的员工）在这一方面出现失误时，要把这些经历作为不应重复的错误的教科书级案例——在公司的任何地方都是如此。因为泄露往往会导致法律诉讼，董事会应该在讨论中加入律师，并确保他们改变企业文化的努力兼了法律视角。在确保高层基调是诚信和有效合规后，董事会应转向战略考量。


    ## 3. 聘关键网络安全人员


    董事会应参与关键人员的选拔，例如`CISO`。他们还应该确保建立适当的系统来监控这些人员的表现。在过去，公司经常将网络安全的责任委托给公司的首席运营官或首席技术官。考虑目前负责贵公司网络安全主要职责的官员。那个人是
    C 级管理人员吗？网络安全是否是他们目前正在处理的许多紧迫需求之一？如果对第一个问题的答案是“否”，第二个问题的答案是“是”，你可能考虑创建一个`CISO`
    形式的新职位。


    董事会还应该考虑 `CISO`（或其他主要负责网络安全的官员）的内部汇报结构，以确保该人员拥有在这一至关重要的角色中取得成功所需的独立性和权威。`CISO`
    可以向公司的首席信息官、首席运营官、首席技术官，甚至是首席执行官汇报——但在任何情况下，`CISO` 都应该根据需要接触高级管理层和董事会。公司管理层还应该考虑建立由公司
    `CISO` 主席的安全委员会，并邀请 C 级官员参加委员会会议。董事们自己应该了解谁担任了 `CISO` 职位，并根据情况与该个人进行直接交流。


    ## 4. 评估风险管理策略


    从董事的角度来看，有效监督的关键在于让高级管理层负责阐述和监控公司与网络安全相关的策略和风险承受能力。在大多数情况下，董事成员应该关注公司的网络安全计划，但不应过度干涉其执行细节。


    董事会可以且应该发挥关键作用的一个领域是制定公司与网络安全相关的战略计划。在完成初步工作之后，董事会应监督公司管理层实施该战略计划。


