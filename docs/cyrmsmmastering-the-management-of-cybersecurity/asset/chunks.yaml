  trans: '

    第一条教训是公司必须关注常规警报，以警告公司系统及所用软件中的网络安全漏洞。在 Equifax 的案例中，黑客显然利用了 `Apache Struts` 网络应用程序软件中的一个已知网络漏洞，Equifax
    正使用该软件来构建其网络应用程序。美国国土安全部美国计算机应急响应小组（`US-CERT`）曾于 2017 年 3 月 8 日通知 Equifax 及许多其他机构此漏洞，并要求对软件进行补丁修复。尽管公司通过电子邮件在内部传发了
    `US-CERT` 的通知，并要求相关人员安装补丁，但该补丁显然没有安装，或安装不正确，一周后对系统进行的后续扫描未能发现该错误。


    第二条教训是公司必须确保拥有适当的系统来升级潜在网络安全事件的信息，并确保例如由总律师在关键窗口期内禁止对重大违规行为有内部情情的个人交易公司证券。在 Equifax
    的案例中，据披露，几位高管在泄露事件于内部报告之后、公众获知之前交易了公司股票。这引发了对可能存在内部交易的质疑，以及在 Equifax 已经因泄露本身面临严厉公众审查时，内部控制缺失的问题。（此后，Equifax
    一个负责分析泄露的特别委员会已证明这些高管无违规行为。）⁹


    第三条教训是，如果在其范围内发生了灾难性的网络攻击，董事会必须有一套公共响应计划。Equifax 对事件的公开处理受到了几乎所有角度的广泛批评。例如，许多人抱怨公司在
    2017 年 7 月底获知泄露后，花费了整整一个月才公开披露该事件。还有人嘲笑 Equifax 在泄露发生后立即将消费者引导至一个不安全的“伪造”网站，该网站模仿了
    Equifax 为与焦虑于个人信息是否受损的客户交流而建立的网站。更有人遗憾的是，公司在泄露后似乎处于“公关模式”，并犯了错误，例如向受影响的个人提供付费的信用监控服务，而非免费提供。（公司随后改为向受害者提供免费的信用监控服务，但迫使这些客户同意冗长的仲裁条款，这将限制客户就相关服务问题起诉
    Equifax 的能力。在公众抗议后，Equifax 随后放弃了仲裁条款。）¹⁰


    第四条教训是公司应该仔细考虑何时以及如何披露泄露事件。Equifax 和 Uber 最近披露的网络安全事件为董事会的此方面提供了宝贵的指导。公司在评估何时披露什么内容时，不仅必须考虑其法律披露义务，还必须考虑公众舆论。类似地，一些人指出，`SEC`
    对涉及其 `EDGAR` 数据库的网络安全事件的公开披露，是在该事件的内部报告提出几个月后才进行的，这说明了对于任何行为者——包括那些被负责监督基于披露的行为的人员来说——要平衡快速公开披露与彻底内部审查之间的竞争性需求是多么困难。`SEC`
    自身对网络漏洞的不理想响应（以及随之导致的网络披露延迟）引发了人们对该机构未来如何追究公司网络相关披露责任，以及如何在一方面及时披露和另一方面严谨内部审查之间平衡竞争性需求的疑问。


    最后一个教训是，公司应该意识到当第三方处理公司敏感数据时所带来的风险。德勤的事件提供了另一个数据点，并强化了这样一种观点：当这些实体处理公司敏感数据时，公司不仅必须关注自己的网络安全系统，还要关注第三方供应商和顾问（甚至可能是政府）的系统。


    鉴于近期这些高关注事件，我们将在下讨论了一系列实务考虑和原则，董事成员可以使用这些原则来帮助其公司建立一个有效且动态的网络安全计划。这些考虑也将帮助董事测试当前网络安全计划的现状和有效性。


    ## 董事的实务考虑


    作为首要原则，董事应当理解他们在网络安全方面的信托责任，以及指导其所属公司的总体法律格局。除了业务和声誉风险外，网络安全的疏忽可能会给公司、管理层，在某些情况下给其董事会带来重大的法律后果。公司必须意识到并理解各种联邦和州法律，其中某些法律监管了特定行业或类型的敏感信息。


    公司还必须意识到，联邦和州监管机构（如 `SEC`、`DOJ` 和 `FTC`）在执行非网络法律（如联邦消费者保护法和证券法）时，可能会日益关注网络安全。此外，董事还必须关注股东和消费者诉讼的风险，这些诉讼通常在披露网络安全事件后引发。如下文所述，公司的总律师和内部网络人员应为董事会安排定期简报，以评估这些进展。


    ### 1. 评估现有网络安全风险并确定优先级


    网络安全是许多行业中的“首要级”风险。如果董事会尚未这样做，应当投资进行正式简报，讨论其公司面临的一系列现有网络安全风险，并权衡各种可能保护公司最有价值资产的机制的优缺点。董事会首先识别公司最有价值的资产，并评估这些资产可能如何受到网络事件的影响。对于某些公司而言，其最有价值的资产是客户的私人财务信息、个人身份信息或可能的健康记录。对于其他公司，可能是知识产权，或者可能是专利数据库，甚至是一组敏感邮件。任何网络安全计划都必须旨在保护这些最重要的公司资产。


    董事应对对公司系统中可能发生的各种类型网络泄露有基本的了解，并熟悉行业内常用的技术术语。公司常见的网络安全事件从恶意软件到钓鱼攻击不等，从未打补丁的软件漏洞到高级持续性威胁（`APT`）。此外，公司物理安全中的漏洞可能允许攻击者渗透公司的网络防御。


    虽然董事会不一定有义务研究网络攻击的技术机制或其应对措施，但董事会应对对这些概念有足够的熟悉，以便与管理层进行建设性讨论，并对公司的网络安全计划进行有效监督。


