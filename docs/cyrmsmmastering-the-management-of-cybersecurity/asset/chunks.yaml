    自适应安全架构允许对安全相关问题进行决策，其依据是：准确的威胁建模、可量化的资产估值，以及考虑安全措施或流程的威慑因素及其成本的“假设性”情景。正确的情报驱动方法基于先前的经验、当前的威胁情报、对影响过其他公司的泄露事件的理解、趋势、资产估值，以及对保护这些资产的防御措施的持续分析（包括控制措施失效时的情况）。


    董事还应鼓励对用于访问管理、人工智能和分分布式数据等新技术进行审查，这些技术可能会增强公司的网络防御能力。


    ## IV. 董事应理解公司对第三方供应商的风险敞口。


    第三方对运营环境可能产生影响，因为董事会和公司对第三方网络安全风险的关注程度通常不如对自身业务风险的敏锐，尽管第三方可能会产生同样的负面长期影响。


    那些密切关注通过核心竞争力实现使命的组织，将其他提供商和合作伙伴的优势视为一种关键且可行的业务战略。公司管理着成百甚至数千个供应商、第三方服务提供商和其他类型的外包安排。这些外部实体通过为公司技术环境创建新的切入点，成为增量风险的主要来源。数据共享和通信不再完全由组织的内部运营控制，这为运营环境增加了复杂性和潜在的波动性。


    法律和其他务实考量可以（也应该）被用于划分和缓解风险；然而，风险无论源自何处，在危机或压力时期都将转回到公司身上。客户（企业和个人）只会向与其开展业务业务的公司寻求解释和救济。


    许多组织在供应商管理方面正处于“追赶”状态。创建完整的供应商关系清单的能力显然是整个计划的“入场券”。第三方计划的基础性工作应包括以下内容：


    *   所有第三方合同的完整且全面的清单

    *   根据对组织的风险（包括网络风险）对第三方风险敞口进行优先级排序

    *   为任何新关系的入驻建立清晰的评估工具

    *   建立持续的、经风险调整的监控流程，以评估对合同条款的遵守情况

    *   通过服务组织控制（SOC）报告对供应商的做法进行第三方评估

    *   与主要服务提供商进行联合灾难恢复测试


    这些活动应产生具有操作性且及时的董事会报告；利用技术赋能的供应商解决方案也是一种最佳实践。


    一个新兴趋势是进行第四方评估，以了解哪些活动被进一步外包，导致网络安全风险状况发生了变化。


    对于网络安全风险，“风险调整”不再仅仅是基于金额的过滤（例如，基于合同的财务规模）。随着廉价应用以及其他狭窄但高效工具的普及，这些工具可以完全捕捉关系的风险状况，因此必须使用其他过滤器来理解其对组织的影响。


    强大的第三方供应商管理计划不仅能加强网络安全风险管理——它还能支持支出决策、合同策略、服务水平和其他关键的运营活动，以支持核心业务目标的实现。


    ## V. 董事应致力于培养一种高度重视网络安全的企业文化。


    ### A. 董事应与管理层共同为网络安全定义适当的行为，并清晰地展示组织对严格遵守这些要求的重视。


    风险文化是通过共享的组织价值观、信念和态度，将风险承担和风险管理的各个方面结合在一起的胶水。通过提高意识和刻意规划，可以主动影响风险文化，以增强组织的风险和业务管理环境。网络安全也不例外；鉴于大多数网络风险最初可以追溯到人员及相关行为，而非技术，建立强大的网络安全文化是任何计划的不可缺少的部分。


    然而，大多数员工对个人数字安全并不感兴趣，更不用说公司的了。因此，改变公司文化以加强安全性是特别困难的——需要范式转变以跟上不断变化的威胁。从历史上看，任何与
    IT 安全有关的事情都被 IT 团队远离了用户。难怪用户对公司的安全表现出没有或毫无兴趣。


    但实际上，用户应该是数据安全的前线。他们创建并处理信息——因此他们最能理解其价值。董事应要求管理层开发与用户互动的培训和问责计划。使用现代的游戏化培训，并在随后监控用户如何应用培训，有助于将公司文化转变为网络安全是每个人的责任。


    如果没有强大的风险文化，即使是最好的网络安全管理框架也会变得脆弱并失效。鉴于不断变化和快速演变的网络环境，嵌入强大的网络风险文化可以在政策尚未起草或更新时为活动提供原则和价值观。具体的指导并不总是可用、相关或被记住。强大网络安全文化的指标包括：


    *   反映组织面临的风险和不断变化的运营环境的清晰简洁的网络安全政策框架

    *   董事会和领导层议程重点包含网络安全

    *   网络风险不是孤立管理的——关于网络的讨论被织入所有管理流程中，例如新产品审批、合并尽职调查和第三方外包安排

    *   持续学习环境，包括相关且易于记忆的培训和工具，以支持良好的网络卫生，从密码协议到反钓鱼活动再到自自带设备（BYOD）政策

    *   存在安全的环境供员工提出风险或问题，员工需要知道当他们识别出未缓解的风险或新兴威胁时，会获得支持的


    强大网络安全文化的另一个标志是组织中的任何人都都不例外，包括董事会。董事会应通过参加公司网络安全培训、避免使用个人邮箱处理公司业务以及（物理和电子方式）保护机密信息来展示他们对强大网络安全实践的了解。


    ### B. 董事需要理解网络风险与其公司具体情况相关的法律和监管影响，包括他们的信托义务和整体法律格局。


