    Third, it’s important to understand that `risk is the absence of information.`
    There’s risk in everything we do, because we can’t possibly know all there is
    to know—there’s always information missing in every situation. Never was that
    truer than it is with the COVID-19 pandemic. Should you wear a mask or not? How
    many times a week should you shop for food? How should you be investing your retirement
    assets in light of this new reality? There are trade-offs with each decision.
    There’s no one-size-fits-all answer for everyone. Risk is personal. I’ve often
    said to clients over the years that when everyone is out of work, it’s a recession;
    when you’re out of work, it’s a depression. You have to do your own personal risk/reward
    analysis for your daily actions, your financial choices, and choices that affect
    you, your family, your community—and, indirectly, the whole country.


    Making difficult risk decisions is comparable to kissing a rattlesnake. It’s never
    fun and can be fatal. But the more you systematically consider what’s really important
    to you, what information is missing, what the collective wisdom is telling you—and
    you make a commitment to evaluate “what is my downside relative to what is really
    important to me”—the better your decisions will be. Though it may be uncomfortable,
    it’s much better to have thoughtfully and carefully evaluated the risks than to
    not have considered them at all. And if you conclude that you need help to make
    the right decision, ask for that assistance sooner rather than later. Let the
    experts help you.


    Finally, after a crisis is over, the only thing people will remember are the judgment
    calls you made and the outcomes you achieved. Nobody will give you credit for
    good intentions—only final outcomes. The best possible outcome is the result of
    a thoughtful, disciplined, orderly process that includes collective wisdom and
    a powerful, laser-focus intention on getting it right.


    ## Reevaluate


    Some common sense applies here. Monitor outcomes continuously and learn from your
    mistakes, so you can make better decisions in the future. The Japanese philosophy
    of `kaizen`, or continual improvement, is based on just this approach—making small,
    incremental changes that lead to the fulfillment of one’s goals. For example,
    many years ago, I’d donated a relatively large sum of money to a certain charity
    with the understanding that the money would be used to start a specific program
    dear to my heart. A year or so later, I discovered that the charity had spent
    the bulk of the money according to their own plans, almost completely disregarding
    my instructions. I went to lunch with a friend who had amassed a great fortune
    and recounted bitterly what had happened. “This is all your fault,” she said.
    “You didn’t communicate your vision well, you didn’t set up milestones, you didn’t
    monitor the charity’s progress against them, and, given your expertise, you should
    have known better.” I hadn’t applied common sense in reevaluating my charitable
    decision.


    The inevitable events that experts predict—pandemics, earthquakes, droughts, sea
    rise, and other disasters—take a long time to happen, but when they do, they happen
    fast. Scenario construction is good practice and preparation for handling the
    inevitable when it does take place. Such exercises will give you a good sense
    of what might occur, sooner or later, so you can make better decisions along the
    way.


    ## Emerging Threats


    There are many problems with the security products used today. Many antivirus
    solutions are only effective against known threats. On average, there are 350,000
    new malware variants created every day. Relying on known malware solutions is
    an endless, no-win catch-up game. Also, many solutions take too long to detect
    and remediate attacks. The longevity of breaches has a direct impact on the extent
    of the damage. In case you’re wondering, Ponemon Institute concluded that the
    average time to identify and continue a breach in 2019 was 279 affected days.
    Even further, the more sophisticated solutions use AI algorithms that are too
    dependent on characteristics that are predetermined based on historical experience.
    Although machine learning is very accurate at detecting a wide range of known
    attack vectors, it doesn’t work well when detecting never-seen-before attacks,
    particularly malware that has a unique solution. It seems that security products
    are always a step behind.


    Further, emerging technologies often create new risks that haven’t been encountered
    before and that also add complexity to existing risks. The interconnected nature
    of these risks creates a need to deal with the risks concurrently, rather than
    in isolation. For example, the increased reliance on interconnected systems by
    companies will amplify the impact of failure and threaten resilience. Taking this
    a step further with artificial intelligence, there are reputational, legal, and
    regulatory consequences as a result of algorithms that aren’t totally aligned
    with social, ethical, cultural, or legal norms. For example, many organizations
    dropped their advertisements from a website after its programmatic advertising
    placed ads next to inappropriate content.


    A bot is a software application that’s programmed to do certain tasks. Bots are
    automated, which means they run according to their instructions without a human
    user needing to start them up. Bots often imitate or replace a human user''s behavior.
    Typically, they do repetitive tasks, and they can do them much faster than human
    users could. Bad bots are programmed to break into user accounts, scan the web
    for contact information for sending spam, or perform other malicious activities.
    Bots have been used to amplify the damages from cyber incidents by acquiring large
    quantities of confidential data through excessive access and privileges.


    Natural language generation tools and techniques will enable the processing, analyzing,
    and understanding of unstructured “big data” that companies will use to operate
    more effectively and proactively. However, the large scale spread of misinformation
    will also be enabled and will manifest in a variety of ways, including using social
    media to influence public opinion; creating false trends through paid online reviews;
    disseminating fake photos/videos that look real; and encouraging incorrect financial
    trading based on false perceptions.


    Data processing on the internet in its current form is generally a centralized
    structure in which most of the data are collected and sent to large, remote data
    centers with good storage, processing, and network capabilities. This centralized
    model isn’t sustainable, as the internet is shifting to massive numbers of wireless
    and remote devices that utilize large volumes of data that increasingly require
    faster response times. More computational, storage, and networking resources will
    need to be situated at the edge of networks (edge computing) to significantly
    reduce data traffic and improve response times for emerging applications such
    as smart homes, smart transportation, smart health, smart grids, and smart energy.
    However, edge computing will create new cybersecurity challenges for standard
    encryption, authentication, and access controls. For example, as a result, there
    will be a huge increase in denial-of-service attacks.


    ## Use of Scenarios Based on Emerging Threats


    Taking these potential threats into consideration, as well as actual real events,
    imagine this potential scenario involving artificial intelligence to understand
    what’s possible and then what to focus on in terms of `CyRM`.

