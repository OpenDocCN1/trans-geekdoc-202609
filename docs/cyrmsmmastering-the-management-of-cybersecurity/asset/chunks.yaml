  trans: '

    与雷达一样，存在复杂的公式可以帮助风险官量化所有这些场景。通过（这些公式的帮助）收集情报并预判风险。


    网络风险管理演变为有效的监督职能一直受到阻碍，原因在于大多数组织无法像处理其他类型的风险那样对网络风险进行组织、分类和衡量。网络安全风险的量化应该是网络风险管理的核心。量化网络风险可以带来更好的决策，因为它是用公司内其他风险相同的通用语言或语境来描述风险的。向高级管理人员、董事会及其他利益相关者报告网络风险，有助于他们更好地理解随着时间的推移，公司、特定业务、产品和活动的网络风险水平的状况。


    对于整体网络安全预算、网络安全支出分配以及保险范围，也可以做出更明智的决策。这也有助于营造一种重视漏洞的文化。它对第三方供应商提供了客观评估。它还有助于将网络风险与其他企业风险及运营风险整合起来。


    那么，网络风险经理是如何收集情报并预判风险的呢？网络领域存在着看似无尽的未知数。我建议可以使用基于制造业的创新方法来解决所有类型组织的网络安全运营中断。


    例如，在制造业中，考虑汽车制造工厂的装配线。如果一个不满的员工向装配线中部发射了火箭，工厂管理团队可以确定维修生产线需要多久、维修费用是多少，以及生产损失的成本。换句话之，通过关注发生了什么（无论它是如何发生的），汽车制造商可以确定火箭造成的潜在中断损失。（当然，这种场景还应该引发对由于工厂士气低落和员工不满所产生风险的额外分析。但你明白我的意思。）


    让我们把这个例子扩展到一个本应该 24/7 全天运行的在线银行应用程序。突然，在一个三天休假周末的深夜，银行应用程序因一次网络攻击而变得无法使用。无论攻击是如何发生的，通过仅关注发生了什么，银行可以确定需要修复的关键节点、费用多少、需要多长时间以及停机成本——所有这些都可以像制造业示例一样被量化。


    这种方法关注服务中断的影响，而无论其成因是什么，它允许你有效地创建一个中断模型，并并利用该模型来量化与运营中断相关的网络安全风险。底是：网络风险经理应该关注关键中断节点以提高韧性——这在攻击发生之前的很久就应该做好。


    正如雨中行走的经典风险案例一样，网络风险经理经常忽略了这些场景中的连锁反应。例如，假设对纽约金融系统的网络攻击包括在周末期间对曼哈顿电网的攻击。所有的金融交易所都有应急电源系统，但它们的响应可能会受到阻碍，因为地铁也将无法运行。连锁反应是，本该响应攻击的技术人员将非常难进入市区——这一事实很容易被忽视。


    一个优秀的网络风险管理官关注的是*可能发生*哪些中断，而不是它们将*如何发生*。考虑风险的连锁反应同样重要。最终，一个优秀的网络风险经理必须自问：“我所采取的保护措施对于我的生存能力来说是否足够？”


    以一个真正无法预知的风险为例，例如网络安全事件造成的声誉损失总额。首要问题是：“应该制定什么样的最佳实践（响应计划和政策），以确保影响可以被吸收且组织能够继续运行？”


    在这些情况下，了解公司的“皇冠上的明珠”是什么非常重要，然后划定清晰的界限并采取强有力的缓解措施来保护它们。例如，在一家资产管理公司，个人客户数据极其敏感，可能需要额外的控制层，包括不同的安全协议。二道防风险管理的观点应该是：“公司是否已采取一切必要措施来适当缓解这些风险？”


    一个强大的网络风险管理方法涵盖以下内容：


    *   关注网络安全事件的影响，而不是它们如何发生。

    *   使用中断模型量化运营中断。

    *   尽可能将未知风险转化为已知风险，以便进行量化。

    *   并且，对于那些真正无法预知的风险，关注需要做什么来确保生存能力。

