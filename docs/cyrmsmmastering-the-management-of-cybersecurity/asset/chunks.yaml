  trans: '

    董事会还应与管理层合作，制定一份网络安全事件“响应手册”，规划出在发生数据泄露或影响公司系统的严重网络安全事件时，公司将如何应对各种应急情况。例如，在 Uber
    丑闻之后，公司可能希望考虑处理赎金请求，在可能缓解与泄露相关的某些损害的优点，与以这种方式奖励犯罪行为的缺点之间进行权衡。任何此类分析都应具有足够的灵活性，以考虑到当时的执法部门的建议以及对公司披露义务的法律分析。为了避免像
    Equifax（富安信）那样的问题，公共响应计划应指定一个内部和外部专家团队来调查原因并进行适当的披露。


    公司管理层可以使用多种框架来制定与网络安全相关的适当风险管理策略。例如，2013 年 10 月，美国商务部国家标准与技术研究院（`NIST`）发布了一套旨在降低网络安全风险的自愿标准和最佳实践供征求。最终版本于
    2014 年 2 月发布，标题为*改进关键基础设施网络安全框架*。¹⁴**


    `NIST` 框架包含了五个“功能领域”，董事会在为公司制定整体网络安全计划时考虑这些功能领域。这些功能包括：


    1. **识别**：建立组织理解，以管理系统、资产、数据和能力的网络安全风险。

    2. **保护**：开发并实施适当的保护措施，以确保关键基础设施服务的交付。

    3. **检测**：开发并实施适当的活动以识别网络安全事件的发生。

    4. **响应**：开发并实施适当的活动对已检测的网络安全事件采取行动。

    5. **恢复**：开发并实施适当的活动以维护韧性计划并恢复任何因网络安全事件受损的能力或服务。¹⁵。


    鉴于美国证券交易委员会（`SEC`）对市场的巨大影响，其指南也为董事会提供了宝贵的帮助。网络安全一直是 `SEC` 国家检查计划的重中之重，该计划由合规检查检查办公室（`OCIE`）监督。2017
    年 8 月，`OCIE` 发布了一份风险警报，强调了其“网络安全 2 号倡议”的结果。¹⁶。


    作为网络安全 2 号倡议的一部分，`OCIE` 评估了公司在以下领域管理其网络安全计划的情况：


    1. 治理和风险评估；

    2. 权限与控制；

    3. 数据泄露防护；

    4. 供应商管理；

    5. 培训；以及

    6. 事件响应。¹⁷。


    从广泛的角度来看，`OCIE` 发现，虽然公司在建立网络安全计划方面做得更多，但面对不断变化的网络威胁和攻击，它们在维护和更新这些计划方面做得还不够。¹⁸。


    ## 5. 开发监控网络安全工作的系统


    董事会应将监控公司网络安全工作的方法类似于对机器的持续维护。这需要定期的检查和调整，而不是一项一次性的工作。用于进行和防止网络攻击的技术手段将不断演变。


    此外，随着公司转向不同的操作系统或扩大其业务组合，旧的战术和系统可能被认为无关或不足。


    因此，董事会至少在每季度会议上对公司的网络安全计划进行例行审查是明智的。如果出现新的、严重的问题，还应有一套程序能够更频繁地向董事会汇报。


    公司的董事会会议记录应准确反映在此类会议上讨论网络安全的情况，以便董事会的尽职调查得到记录和证明。董事会还应定期收到网络安全计分卡，突出公司在缓解网络风险方面的进展，包括外部指标、差距修复、新兴风险、权衡和其他问题。计分卡并不需要包含高度技术性的关键绩效指标才能发挥作用。相反，适用于董事会的良好指标示例包括：客户满意度（因信息安全事件导致客户系统停机的时间）、声誉（媒体报道的信息安全事件数量）以及财务（信息安全预算占
    IT 预算的百分比）。


    作为一个重要原则，董事会应确保管理层和公司员工收集、分析并分享有关网络安全事件（无论大小）的数据，以帮助评估现有网络安全工作的有效性。公司还应优先内部收集、分析和共享从政府、私人或非营利来源获取有关网络漏洞和可能暴露的任何信息。


    在 Equifax 事件之后，所有公司认真审视其信息升级协议都是非常重要的。当可能的网络事件首次被公司察觉时，谁会收到通知？


    通常，初级员工最适合观察网络泄露的初步迹象。在安装关键软件补丁时——例如 Equifax 的案例——要确保有适当的监督和同级评审系统，以免一个人的人为失误导致灾难性的（且可以避免的）泄露。


    董事会还应确保公司有一套系统，鼓励员工和管理层从过去的错误中吸训。


    承认错误并从中学习会带来更好的决策。在关于公司安全模型和漏洞的简报中，应该鼓励进行网络安全事后分析（post mortems）。


    当错误发生时，这也是咨询律师的好时机。某些错误伴随着法律责任。例如，公司可能需要向股东披露网络安全风险和不利的网络事件。董事会应确保任何事后分析以及由此产生的任何政策都包含必要的法律应对。


    ## 6. 审查网络披露的充分性


    每年越来越多的上市公司开始在财务披露中将网络安全描述为一种风险。¹⁹。


    Equifax 因在 7 月底发现泄露后直到 9 月才披露而遭了严重批评。但公司和监管机构都意识到，在早期披露与等待掌握所有事实以避免做出误导或不准确的披露之间存在着巨大的张力。`SEC`
    本身也因在处理 `EDGAR` 数据泄露时的感知失误而受到批评。`SEC` 最初报告没有个人识别信息被获取；随后它不得不修正了这些声明。²⁰。


    公司建立适当的升级协议至关重要。不要浪费宝贵时间等待泄露报告层层上报给决策者。相反，在重大性泄露到披露之间的任何时间都应该很好地花在调查事实和分析问题上。


    `SEC` 已经在该领域提供了一些指导。2011 年，`SEC` 公司金融部发布了针对上市公司的有关网络安全威胁和不利网络事件披露义务的指南。²¹。

