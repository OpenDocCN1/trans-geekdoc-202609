    # Introduction


    What’s more, the services provided by third-party companies are elastic—in other
    words, there are different degrees or levels of service and security available
    in them. This fosters an inconsistent security model. Maybe you’ve heard of application
    programming interfaces (`APIs`). `APIs` are programming filters that give users
    the opportunity to customize features of their cloud services to fit business
    needs. A bank and a bakery, for example, have very different needs, and it benefits
    them to have specific data filters on their sites. While these programs are incredibly
    useful in the way they allow users to authenticate, provide access, and affect
    encryption, they also can create vulnerabilities. The biggest vulnerability of
    an `API` lies in the communication that takes place between applications—creating
    exploitable security risks and new attack surfaces.


    Case in point: in January 2019, researchers revealed a design feature common in
    most modern microprocessors that could allow content—including encrypted data—to
    be read from memory using malicious JavaScript code. Two variations of this problem,
    called `Meltdown` and `Spectre`, permit side-channel attacks because they break
    down the isolation between applications. That bit of technical jargon is another
    way of saying that a growing attack surface means there’s heightened risk!


    ## Cloud Technology Risks


    Ready for more potential problems that accompany cloud technology? In a recent
    breach of an online bank, the attacker was a former employee of the third-party
    company that hosted the bank’s site. The perpetrator allegedly used web application
    firewall credentials to obtain “privilege escalation,” a phrase we use to mean
    access to information most aren’t supposed to see. Another potential problem with
    the cloud includes accidental data wipes by service providers. This recently happened
    at one large online retailer. Typically, businesses don’t have recovery plans
    for data stored on the cloud. Once data is lost, it’s gone forever (if it’s not
    backed up).


    ## The Rising Threat of Cyberattacks


    Whether the attack comes via the cloud or some other way, the frequency and seriousness
    of cyberattacks on organizations holding sensitive personal and proprietary data
    have increased dramatically year after year—with dollar losses resulting from
    these attacks now in the `billions`. This is true of both public and private organizations.
    These attacks are certainly damaging and costly to everyone affected.


    Banks, retailers, defense contractors, Fortune 500 companies, entertainment companies,
    and regional governments—all of these have lately been victims of cyberattacks.
    This is just a precursor of more attacks to come. Many employees in America are
    now working from home, using personal laptops on unsecured internet connections
    to access work files that contain confidential information and personal data.
    This provides ample opportunity for hackers—that “attack surface” mentioned earlier.
    Every company’s attack surface has dramatically widened, making them easier targets.
    `CYFIRMA`, a cyber intelligence firm, reported that cyberthreats related to the
    COVID-19 pandemic increased 600 percent between February and March of 2020.


    ## Strategic Response


    So, now that I’ve got your attention, what should we—what should YOU—do about
    cyberattacks? The answer is definitely not to stick your head in the sand. If
    you and your company want to survive and thrive in this cyber landscape, you’ve
    got to get smart and comprehensive. You need to invest in and enhance your cyber
    risk management (`CyRM`℠)


    Some people may think the US government can protect them from attacks. After all,
    our Army protects us from invasion. Why not protect us from cyber invasion? But
    here’s the cold, hard truth: although the United States government is excellent
    at good old-fashioned military defense, it’s unfortunately not so great at cyber
    defense.


    ## Government Failures and Vulnerabilities


    In the two decades since `11th`, we have ample evidence that the government is
    going to great lengths to protect us from cyberattacks. But we have no evidence.
    Consider that in November `2014`, the director of the `National Security Agency`
    testified before Congress that he believed foreign countries could effectively
    shut down power, water, and fuel. More than five years ago, our government was
    notified that different countries could shut down our national infrastructure.
    Yet there followed no words of assurance from the government that steps were being
    taken. Perhaps the threat was too theoretical, too intangible, and too existential.


    And yet, a mere four days after that testimony, North Korea cyberattacked Sony,
    destroying proprietary information, as well as computer hardware. A state actor
    proved it could access and embarrass a giant, multinational. In `2015`, we learned
    that the US `OPM`, despite earlier warnings, allowed the Chinese government to
    steal data for twenty million Americans. More recently, the `NSA` failed to adequately
    safeguard highly advanced, weaponized `zero-day` exploits it had developed. (Zero-day
    exploits are advanced cyberattack tools that are so quick and devastating they
    leave the victim with no time to discover.) The result of the `NSA`’s failure
    is that those exploits are now in the hands of malicious actors who are wreaking
    havoc worldwide. In `2020`, a major cyberattack by a group backed by a foreign
    government penetrated multiple parts of the United States federal.


    Despite these attacks and repeated warnings from experts, the United States government
    hasn’t passed stand-alone cybersecurity-related legislation since `2002`. In `2002`,
    we were all using America Online, and `Gmail` didn’t exist! The most significant
    proposed bill asks the private sector to share more of its data with the government.
    Why should companies willingly hand over sensitive data to the entity that was
    derelict in securing `OPM` and `NSA` data that’s arguably some of the most sensitive
    in its treasury of state secrets?


    ## Future Outlook


    To add insult to injury, this legislative inaction is accompanied by an unwillingness
    to hold foreign governments accountable for cyber assaults on our citizens and
    businesses. Things like geography or army size—factors that traditionally protected
    this country—don’t exist in cyberspace. Suddenly, much lesser countries can intrude
    directly into our energy, communication, and financial industries. Bad actors
    are continually designing new and ever more powerful malware to remotely manipulate
    and disrupt these sectors.


    There’s growing concern within the US intelligence community that foreign governments
    will cyber-invade financial institutions—not to steal money, but to pollute, destroy,
    and manipulate data. Cyberattacks by foreign intelligence services designed to
    create chaos in record keeping, transaction precision, and currency valuations
    could disrupt and destroy the public trust to such a degree that the stability
    of the entire financial system may come into play.

