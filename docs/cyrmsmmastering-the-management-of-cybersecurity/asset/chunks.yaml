    董事会通常对公司是否应该购买网络安全保险拥有最终决定权。作为董事会做出这一决策可能需要应对一些新领域。你必须确定哪些是已经（以及应该）被涵盖的范围，哪些是未涵盖（且不需要）涵盖的范围。你还需要确定特定的保费是否合理。董事会应该问的一个问题是现有的保险保单是否可以涵盖某些事件。传统上，大多数商业综合责任（`CGL`）保单不包含网络安全“免责条款”；但如今，保险公司更有可能在保单中加入此类条款。董事应确保在保障范围内没有关键漏洞，并根据公司自身的风险状况考虑哪些保障范围最合理——例如，保障选项可能包括数据泄露成本；勒索；取证分析；盗窃；诉讼成本和费用；以及业务中断等。董事会还应确认其董事和高管（`D&O`）保单涵盖了与网络安全相关的事件。


    网络安全领域没有任何停滞不变的。黑客攻击在不断演变，上个月还是行业标准的防御措施下个月可能就过时了。立法者和监管机构也努力跟上新法律法规的步伐，这在很大程度上受到受关注泄露事件后公众愤怒的推动。例如，纽约州对
    Equifax 泄露事件做出了反应，提议监管以扩大该州首创的网络安全规则，该规则目前要求纽约所有金融机构必须在州注册并实施保护消费者数据的计划等。新规将将这些要求扩展到信用报告机构。纽约州总长还提议了新立法，以修订该州现有的数据泄露通知法。值得注意的是，拟议的立法将扩大对“私人信息”的定义，并适用于任何持有纽约州居民私人信息的实体，即使该实体未在该州内开展常规业务。


    治理网络安全的不断变化的法律格局本身可能被视为公司的网络“漏洞”。董事会需要意识到公司的合规义务，但这说起来易做起来难。如今的公司运行在碎片化的网络安全监管体系中。州、联邦和外国监管机构都有自己的规则和指导。加州和纽约州等州近年来采取了特别激进的手段，在其管辖范围内监管并执行网络安全标准。在联邦层面，`FTC`和`SEC`等机构在其各自指定的重点领域和指导范围内处于网络安全执法的前沿。欧盟方面则实施了《通用数据保护条例》，该条例对从欧盟公民那里收集信用卡数据或其他个人信息的公司实施了报告和其他要求。


    董事会应确保其公司继续遵守最新的网络安全州和联邦法律法规。这对于某些经常成为网络罪分子攻击目标的特定行业公司（例如金融机构），以及那些处理敏感个人信息（如个人身份识别信息、财务信息或受保护的健康信息）的公司来说尤其如此，因为这些公司经常受到监管机构和立法者的审查。董事会显而易见的第一步可能是要求总法律顾问和`CISO`定期向董事会简报立法进展并提供他们的建议。随着许多律师事务所扩大其数据隐私和网络安全业务，公司也可以借鉴外部法律顾问的专业知识，根据公司的需求开发个性化的计划来管理网络安全风险。


    董事会还可以成为对抗“合规疲劳”的宝贵武器，在这种疲劳中，执行日常合规工作的人员在应对迥异的日常需求和多个移动目标时，会失去大局观。“勾选框”很重要，但这是不够的。凭借其高层次视角和地位，董事可以在鼓励管理层在改进现有流程和网络安全措施方面进行批判性和创新性思考方面发挥重要作用。最后，董事会应该尝试确保公司的大部分精力花在实际的网络安全上，而不是仅仅为了证明合规。


    # 第二支柱 CyberWellness℠


    # 第 6 章 CyberWellness℠


    ## 全公司方法


    中心控制与员工和客户的每一次连接是不可能的——因此，需要一种新范式。公司的`CyRM℠`计划不仅需要涵盖整个公司，还需要涵盖每位员工。公司中的每个人都要对他们承担的风险负责。这需要一个活跃的过程——就像身体健康计划一样，公司采取积极措施来促进和维护员工的健康。`CyberWellness℠`
    也是如此：需要在网络防御、响应和治理的多个维度上做出主动选择。


    正如你在之前的章节中看到的那样，传统的网络安全方法依赖于预防策略。这种过时的方法假设公司 IT 系统周围环绕着一层坚固的外壳。它错误地假设网络安全事件是例外——即对坚固外壳的罕见穿透——而不是频繁、持续且不断更具创意的针对数据破解的尝试。良好的
    `CyRM℠` 计划会说：老办法已经够了，是时候实践全面的 `CyberWellness℠` 了。


    有效 `CyberWellness℠` 的关键在于公司评估、衡量、监控和控制风险的能力。大多数公司通常关注泄露事件，这实际上只是评估方面。他们需要扩大关注范围，开发新的措施（如网络风险容忍度），开发创新的监控技术作为关键性能指标，为员工提供网络安全培训，并实施整合到更新政策和程序中的更好的网络控制。


    为了继续这个健康类比，请考虑近年来，我们看到公共卫生系统试图从被动模式转为主动模式——关注预防疾病，而不仅仅是在疾病爆发发生时才做出反应。（COVID-19
    大流行加深了我们的理解，即仅仅处于被动状态并不有效！）


    与将事件视为罕见例外相反，一种情报驱动的心态假设公司已经被攻破，因此需要不断演进以保持领先。例如，在我山坡上的房子里，我有多层安全。院子周围有一圈铁艺栅栏、写有“内恶犬”和“受事报报警系统保护”的牌子、光敏型泛光灯、连接到每扇门和窗户的报警系统、一个隐藏在视线之外的防火保险箱，以及床边的恐慌按钮。我的目标是用我的栅栏、泛光灯和栅栏上的牌子来威慑坏人。但如果他们仍然决定闯入，那么我有多层防御：门、窗和窗帘的报警器、如果坏人设法设在不触发外部报警的情况下进入的内部红外束、恐慌按钮、一只叫声很大的大狗以及隐藏的保险箱。仅仅依靠外部安全措施是不够的。你可能认为这过分，但当你成为风险管理专家时，你知道防患胜于治疗。


