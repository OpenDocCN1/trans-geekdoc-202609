- fmt: "\nTraditionally, most commercial general liability (CGL) policies did not\
    \ contain cyber “exclusions”; however, these days, insurers may be more likely\
    \ to include such provisions in their policies. Directors should ensure there\
    \ are no critical gaps in coverage and consider what coverage makes the most sense\
    \ based on their company’s own risk profile (for example, coverage options may\
    \ include coverage for costs of data breaches; extortion; forensic analyses; theft;\
    \ litigation costs and expenses; and business interruption, to name a few). Boards\
    \ should also confirm that their directors and officers (D&O) policies include\
    \ coverage of cybersecurity-related events.\n\n# 9. Stay on Top of Developments\n\
    \nThere is nothing stagnant about cybersecurity. The hacks are ever evolving,\
    \ and defensive practices that are industry standard one month may be obsolete\
    \ the next. Legislators and regulators, in turn, strive to keep pace with new\
    \ laws and regulations, spurred in no small part by public outcry following high-profile\
    \ breaches. The State of New York, for example, has responded to the recent Equifax\
    \ breach by proposing regulation to expand the state’s first-of-its-kind cybersecurity\
    \ rules, which currently require all financial institutions in New York to register\
    \ with the state and implement programs to protect consumer data, among other\
    \ things.[^(29)](#fn29)\n\nThe shifting legal landscape governing cybersecurity\
    \ may itself be considered a cyber “vulnerability” for a company. Boards need\
    \ to be cognizant of their companies’ compliance obligations, but that is easier\
    \ said than done. Companies today operate in a fragmented system of cybersecurity\
    \ regulation.\n\nState, federal, and foreign regulators all come with their own\
    \ rules and guidance. Certain states, such as California and New York, have taken\
    \ a particularly aggressive tack in recent years to regulate and enforce cybersecurity\
    \ standards within their jurisdictional limits. On the federal level, agencies\
    \ such as the `FTC` and `SEC` are on the vanguard of cybersecurity enforcement\
    \ within their own designated areas of focus and guidance, as well.\n\nThe European\
    \ Union, for its part, recently implemented its General Data Protection Regulation,\
    \ which imposes reporting and other requirements on companies that collect credit\
    \ card data or other personal information from EU citizens.[^(30)](#fn30)\n\n\
    Boards should ensure their companies continue to comply with the latest array\
    \ of state and federal laws and regulations concerning cybersecurity. This is\
    \ especially true for companies in certain industries that are frequently targeted\
    \ by cyber criminals (e.g., financial institutions), and those that handle sensitive\
    \ personal information, such as personally identifiable information, financial\
    \ information, or protected health information, as these companies are often subject\
    \ to scrutiny by regulators and legislators. One obvious first step for the board\
    \ may be to ask the company’s general counsel and `CISO` to brief the board regularly\
    \ on legislative developments and provide their recommendations. With many law\
    \ firms growing their data privacy and cybersecurity practices, companies can\
    \ also draw on the expertise of outside counsel to develop individualized programs\
    \ to manage cybersecurity risk, in view of the company’s needs.\n\nBoards can\
    \ also be valuable weapons in combating “compliance fatigue,” in which personnel\
    \ performing the day-to-day compliance functions lose sight of the broader picture\
    \ as they navigate disparate, daily demands and multiple moving targets. It is\
    \ important to “check the boxes,” but that is not enough. With their high-level\
    \ perspective and status, boards can play a major role in encouraging management\
    \ to think critically and innovatively when it comes to improving existing processes\
    \ and cybersecurity measures. In the end, boards should try to ensure that the\
    \ lion’s share of the company’s effort is spent on actual cybersecurity, and not\
    \ on merely demonstrating compliance.\n\n# Conclusion\n\nTo implement an effective\
    \ cybersecurity program, a director should understand the full range of cyber\
    \ risks facing his or her company and encourage management to develop appropriate\
    \ strategies tailored to the company’s specific needs and goals. Any effective\
    \ cyber program includes careful planning, smart delegation, and a system for\
    \ monitoring compliance—all of which directors should own. It’s no longer a question\
    \ of whether a company will be attacked but more a question of when—and what the\
    \ company is going to do about it. Smart network surveillance, early warning indicators,\
    \ multiple layers of defense, and learning from past events are all critical components\
    \ of true cyber resilience. When things go wrong, whether in a major or minor\
    \ way, the ability to quickly identify and respond to a problem will determine\
    \ the company’s ultimate recovery. Cybersecurity cannot be guaranteed, but a timely\
    \ and appropriate reaction can.\n\n# Directors’ Cyber Checklist\n\n### Risk Assessment\
    \ - Evaluate the Existing Cybersecurity Risks, and Prioritize\n* Determine most\
    \ valuable assets\n* Seek effective strategies to protect them\n* Review cybersecurity\
    \ budget for appropriateness\n\n### Assess Corporate Culture and Set the Right\
    \ Example\n* C-suite and board must be more than involved, they should set the\
    \ tone\n* Training should be engaging\n* Culture should be based on teamwork not\
    \ surveillance\n\n### Develop Strategies and Internal Systems to Manage Cyber\
    \ Risk\n* Evaluate effectiveness of internal systems and controls\n* Participate\
    \ in selecting key cybersecurity personnel\n* Make sure cybersecurity personnel\
    \ have board access\n* Understand and develop metrics for evaluating cybersecurity\
    \ effectiveness\n* Take a hard look at escalation protocols\n* Request a security\
    \ scorecard\n* Develop an incident response plan\n* Test the plan. Consider simulated\
    \ cyberattacks\n\n### Understand Disclosure Requirements and Third-Party Considerations\n\
    * Review disclosures with an eye toward cybersecurity\n* Put mitigating controls\
    \ in place for third-party contracts\n* Review cyber insurance coverage\n\n###\
    \ Stay on Top of Developments\n* Regularly reassess your cyber plan in light of\
    \ the shifting legal landscape\n* Initiate standing review of cyber program on\
    \ at least a quarterly basis\n* Task general counsel and/or `CISO` with briefing\
    \ board on regulatory developments\n* Leverage preexisting relationships with\
    \ outside counsel\n\n# Notes\n\n# [INDEX]](#Toc.xhtml#R_index)\n* application\
    \ programming interfaces (APIs), [7](#chapter-1.xhtml#page_7)\n* applying `CyRM^(SM)`,\
    \ [83](#chapter-10.xhtml#page_83)\n* assessment of current position, [77](#chapter-10.xhtml#page_77)\n\
    * Atlanta, (city of) attack, [71](#chapter-9.xhtml#page_71)\n* building a more\
    \ effective cybersecurity defense, [21](#chapter-3.xhtml#page_21)\n    * consider\
    \ methods to transfer cyber risks, [24](#chapter-3.xhtml#page_24)\n    * recover\
    \ and remember, [23](#chapter-3.xhtml#page_23)\n    * solve the problem, [23](#chapter-3.xhtml#page_23)\n\
    \    * sound the alarm, [22](#chapter-3.xhtml#page_22)\n* Capital One breach,\
    \ [6](#chapter-1.xhtml#page_6)\n* CISO role, [34](#chapter-5.xhtml#page_34)–[35](#chapter-5.xhtml#page_34),\
    \ [55](#chapter-6.xhtml#page_55)–[56](#chapter-6.xhtml#page_55)\n* cloud exposure,\
    \ third-party, [6](#chapter-1.xhtml#page_6)–[7](#chapter-1.xhtml#page_6), [23](#chapter-3.xhtml#page_23),\
    \ [41](#chapter-5.xhtml#page_41)\n* COVID-19 pandemic, [8](#chapter-1.xhtml#page_8),\
    \ [72](#chapter-9.xhtml#page_72), [79](#chapter-10.xhtml#page_79)\n* cultivate\
    \ a strong culture to enhance cyber security, [59](#chapter-7.xhtml#page_59)\n\
    \    * data-centric security, [60](#chapter-7.xhtml#page_60)\n    * engage employees\
    \ in training applications, [61](#chapter-7.xhtml#page_61)\n    * get the users\
    \ involved, [60](#chapter-7.xhtml#page_60)\n    * make diversity part of the security\
    \ culture, [61](#chapter-7.xhtml#page_61)\n"
