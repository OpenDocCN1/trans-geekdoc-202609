- fmt: "\n`Roel C. Campos` is a partner at the law firm of Hughes Hubbard & Reed in\
    \ Washington, DC and is Chair of the Securities Enforcement practice. Mr. Campos’\
    \ practice consists of advising senior management and boards in their most sensitive\
    \ and complex issues. His practice often involves conducting internal investigations\
    \ and defending matters involving financial regulators, such as the `SEC`, `DOJ`,\
    \ `CFTC`, and `FINRA`. He also advises boards on items such as cybersecurity,\
    \ governance, cryptocurrency and proposed rulemakings by financial regulators.\n\
    \nBeginning in 2002, Mr. Campos was appointed twice by President George W. Bush\
    \ and confirmed by the U.S. Senate as a Commissioner of the `SEC`, serving until\
    \ 2007.\n\nPrior to being appointed to the `SEC`, Mr. Campos raised venture capital\
    \ with partners, was a senior executive and operated a radio broadcasting company.\n\
    \nAfter attending Harvard Law School, he worked in Los Angeles for major law firms.\
    \ Mr. Campos also served in the `U.S. Attorney’s Office` in Los Angeles. He prosecuted\
    \ major narcotics cartels and, in a celebrated trial, he convicted several kingpin\
    \ cartel members for the kidnapping and murder of a `DEA` agent.\n\n![](images/figu12_4_B.jpg)\n\
    \n`David X Martin` is an expert in cybersecurity, having co-chaired a public/private\
    \ initiative with the `FBI` and major corporations on intelligence sharing and\
    \ best practices, consulted with the `Central Bank of Israel` on cybersecurity\
    \ audits of Financial Institutions, chaired an information security committee\
    \ for a public corporation, worked as a senior advisor on cybersecurity for `Oliver\
    \ Wyman`, and published numerous articles on innovative approaches to managing\
    \ cybersecurity. He is the co-managing director of `cybXsecure`, a cybersecurity\
    \ consulting and development company.\n\nMr. Martin is an acknowledged expert\
    \ on risk management and valuation issues and has extensive experience with investment\
    \ strategies and operations, quantitative research, exchanges, and supervising\
    \ trading desks. He was the founding Chairman of the `Investment Company Institute’s\
    \ Risk Committee` and Co-Chair of the `Buy Side Risk Committee`. He is a veteran\
    \ financial executive whose 40-year career includes senior positions at `PricewaterhouseCoopers\
    \ (PWC)`, `Citibank`, and `AllianceBernstein`, where he served both as Chief Risk\
    \ Officer and a Director of `Sanford Bernstein LLC`.\n\nMr. Martin is also an\
    \ Adjunct Professor at `NYU’s` and `Fordham’s Graduate Schools of Business`, author\
    \ of `Risk and the Smart Investor`, published by `McGraw Hill` in the fall of\
    \ 2010, and author of `The Nature of Risk`, published by `Amazon` in 2012. He\
    \ has also published numerous white papers on cybersecurity, compliance and risk,\
    \ enterprise risk management, and corporate governance.\n\nMr. Martin serves as\
    \ a member of the `Sanctions Subcommittee of the US Department of State’s Advisory\
    \ Committee on International Economy Policy` and as a Special Counselor to the\
    \ `Center for Financial Stability` on cybersecurity and emerging risks.\n\n##\
    \ Introduction \n\nThe purpose of this document is to provide boards of directors\
    \ a set of Guiding Principles to enable the implementation of an effective cybersecurity\
    \ program.\n\nA director should understand the full range of cyber risks facing\
    \ his or her company and encourage management to develop appropriate strategies\
    \ tailored to the company’s operating environment, risk profile, and long-term\
    \ goals.\n\nThe specific needs of any effective cyber program include careful\
    \ planning, smart delegation, and a system for monitoring compliance — all of\
    \ which directors should oversee. It’s no longer a question of `whether` a company\
    \ will be attacked but more a question of `when` this will happen — and how the\
    \ organization is going to prevent it. Smart network surveillance, early warning\
    \ indicators, multiple layers of defense, and lessons from past events are all\
    \ critical components of true cyber resilience. When things go wrong, whether\
    \ in a major or minor way, the ability to quickly identify and respond to a problem\
    \ will determine the company’s ultimate recovery.\n\nCybersecurity cannot be guaranteed,\
    \ but a timely and appropriate reaction can.\n\nLonger term, the board should\
    \ understand and consider the strategic business implications of cybersecurity,\
    \ foster the right company culture surrounding security, and encourage the integration\
    \ of cyber risk practices. In essence, the board should consider cybersecurity\
    \ as a managerial issue, not just a technical one.\n\n### DIRECT SHOULD VIEW CYBERSECURITY\
    \ AS AN IMPORTANT ELEMENT OF ENTERPRI RISK THAT THEY MUST OVERSEE\n\n1. Identify\
    \ the organization’s essential assets (`crown jewels`) that may be vulnerable\
    \ to attack.\n2. Identify which cyber risks to avoid, which to accept, and which\
    \ to mitigate.\n3. Develop specific plans associated with each approach.\n\nThere\
    \ are no offensive strategies in cybersecurity — only defensive ones. In addition,\
    \ it is critical for board members to first determine which assets are most valuable,\
    \ and second, to put in the most effective strategy to protect these assets. Once\
    \ the board ascertains the value of what needs to protect, it can prioritize and\
    \ allocate resources.\n\nDefining an organization’s risk capacity is a complex\
    \ challenge because it requires all the personnel to be confident of the following\
    \ items:\n\n* Knowing their inventory of information assets is both complete and\
    \ up-date\n* Being certain that the process used to prioritize the value of these\
    \ assets is accurate and appropriate\n* Understanding the effectiveness of the\
    \ key actions that have been taken to protect the most important assets, e.g.,\
    \ the crown jewels\n* Having a comprehensive command of the terms and conditions\
    \ of other risk-mitigating items, such as insurance, with the corresponding knowledge\
    \ of where insurance and other mitigation efforts will not be effective\n* Possessing\
    \ a deep understanding of the scale and robustness of the organization’s business\
    \ response and continuity plans that will be triggered in the event of a cyber\
    \ incident\n\nThe five elements listed above represent a sample of the component\
    \ elements in the risk capacity calculation that board directors and senior management\
    \ need to perform on an ongoing basis. The first three are critically important\
    \ to directors to ensure they know what programs, investments and resources management\
    \ has dedicated to protecting the most valuable holdings, because the theft, unauthorized\
    \ access, or damage to these assets could represent an existential risk.\n\nThe\
    \ last two also factor into the capacity calculation as inputs because the costs\
    \ and benefits of mitigation actions, such as third-party cyber insurance and\
    \ remote back-up facilities are also important. These traditional risk management\
    \ activities play an important role in how the organization assesses its capacity\
    \ to endure or weather a pre-defined type of business continuity event.\n\nThe\
    \ business continuity framework can help gain insight into the priority of the\
    \ assets to be recovered after a cyber-breach has occurred. Of course, any pre-defined\
    \ event estimate will likely not match what happens in reality, but an organization\
    \ can use frequent simulated attacks in order to identify and assess whether other\
    \ “less critical” assets are appropriately evaluated from a risk mitigation perspective.\n"
