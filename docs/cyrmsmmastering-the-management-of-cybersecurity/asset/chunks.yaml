  trans: '


    第三，重要的是要理解`风险就是信息的缺失`。我们所做的每件事都存在风险，因为我们不可能知道所有的一切——在任何情况下，总会有信息的缺失。这一点在 COVID-19
    疫情期间比任何时候都更加真实。你是否应该戴口罩？你每周应该买几次食物？考虑到这一新现实，你应该如何投资你的退休资产？每个决策都存在权衡。没有一个适用于所有人的答案。风险是个人的化的。多年来，我经常对客户说：当所有人都失业时，那是衰退；当你自己失业时，那是萧条。你必须对自己的日常行为、财务选择，以及影响你、你的家庭、你的社区——间接影响整个国家的选择，进行个人的风险/收益分析。


    做出艰难的风险决策就像亲吻响尾蛇。这绝无趣味，而且可能是致命的。但你越系统地考虑什么对你来说真正重要、缺少了哪些信息、集体智慧告诉了你——并承诺评估“相对于对我真正重要的事情，我的下行风险是什么”——你的决策就会越好。尽管这可能不舒服，但经过深思熟虑和仔细评估风险，远比完全不考虑风险好得多。如果你得出需要帮助做出正确决策结论，请尽早寻求协助，而不是推迟。让专家来帮助你。


    最后，在危机结束后，人们只会记住你做出的判断和你取得的结果。没有人会因为你的善意而给你赞誉——只有最终的结果。最理想的结果是一个经过深思熟虑、有纪律、有序的过程的结果，这个过程包含了集体智慧以及对确保正确性的强大、激光般的专注意。


    ## 重新评估


    一些常识在这里同样适用。持续监控结果并从错误中学习，以便你将来能做出更好的决策。日本的 `kaizen` 哲学（或“持续改进”）正是基于这种方法——通过微小的、渐进的改变来实现目标的实现。例如，多年前，我向某家慈善机构捐赠了一笔相当数目的资金，并理解这笔钱将用于启动一个我非常关心的特定项目。一年后，我发现该慈善机构根据他们自己的计划花了大部分资金，几乎完全忽略了我的指示。我与一位积累了巨大财富的朋友吃午饭，痛苦地诉说了所发生的一切。“这都是你的错，”她说，“你没有很好地传达你的愿景，你没有设定里程碑，你没有根据这些里程碑监控慈善机构的进度，而且鉴于你的专业知识，你本应该知道这些。”我在重新评估自己的慈善决定时没有运用常识。


    专家预测的不可避免事件——流行、地震、干旱、海平面上升和其他灾难——需要很长时间才会发生，但当它们发生时，速度会非常快。情景构建（Scenario construction）是一种良好的实践，也是为不可避免事件发生时做好准备。此类练习将让你对早晚可能发生的情况有一个良好的感知，以便你在此过程中能做出更好的决策。


    ## 新兴威胁


    目前使用的安全产品存在许多问题。许多杀毒解决方案仅对已知威胁有效。平均每天产生 350,000 个新的恶意软件变体。依赖已知恶意软件解决方案是一场无止的、没有赢家的追赶游戏。此外，许多解决方案检测和修复攻击的时间太长。泄露的持续时间直接影响损害程度。如果你好奇，Ponemon
    研究所得出结论，2019 年识别并持续泄露的平均时间为 279 个受影响日。更进一步，更复杂的解决方案使用了 AI 算法，这些算法过度依赖基于历史经验预设的特征。尽管机器学习在检测广泛的已知攻击向量方面非常准确，但在检测从未见过的攻击（特别是具有独特解决方案的恶意软件）时，效果并不好。安全产品似乎总是落后一步。


    此外，新兴技术往往产生以前未遇到过的新风险，并增加现有风险的复杂性。这些风险的互联性需要同时处理风险，而不是孤立地处理。例如，公司对互联系统依赖的增加将放大故障的影响并威胁韧性。在人工智能方面更进一步，由于算法没有与社会、伦理、文化或法律规范完全一致，将导致声誉、法律和监管后果。例如，许多组织在网站的程序化广告在不当内容旁边投放广告后，从该网站删除了他们的广告。


    机器人（Bot）是程序用于执行特定任务的软件应用程序。机器人是自动化的，这意味着它们根据指令运行，不需要人类用户启动。机器人经常模仿或取代人类用户的行为。通常，它们执行重复性任务，而且执行速度远快于人类用户。坏机器人被程序用于破解用户账户、扫描网络上的联系信息以发送垃圾邮件，或执行其他恶意活动。机器人已被用于通过过度访问和权限获取大量机密数据来放大网络事件的损害。


    自然语言生成工具和技术将能够对非结构化的“大数据”进行处理、分析和理解，公司将利用这些更有效地主动地运营。然而，虚假信息的大规模传播也将可能，并以各种方式表现，包括利用社交媒体影响舆论；通过付费在线评论创建虚假趋势；传播看起来真实的虚假照片/视频；以及基于错误认知鼓励错误的财务交易。


    目前形式的互联网数据处理通常是集中化结构，大多数数据被收集并发送到具有良好存储、处理和网络的大型远程数据中心。这种集中化模型不可持续的，因为互联网正在转向大量的无线和远程设备，这些设备利用大量数据，且越来越需要更快的响应。更多的计算、存储和网络资源需要位于网络边缘（边缘计算），以显著减少数据流量并提高智能家居、智能交通、智能健康、智能电网和智能能源等新兴应用的响应时间。然而，边缘计算将为标准的加密、身份验证和访问控制带来新的网络安全挑战。例如，结果是拒绝服务攻击将大幅增加。


    ## 基于新兴威胁的情景使用


    考虑到这些潜在威胁以及实际发生的事件，想象这样一个涉及人工智能的潜在情景，以理解什么是可能的，然后在 `CyRM` 方面重点关注什么。


    '
