    as pen testing. Pen testing views your network, application, device, and physical
    security through the eyes of both a malicious actor and an experienced cybersecurity
    expert to discover weaknesses and identify areas where your security posture needs  improvement.
    Pen testing doesn’t stop at just discovering ways in which a criminal might gain
    unauthorized access to sensitive data, or even take over your systems for malicious
    purposes. It also simulates a real-world attack to determine how your defenses
    will fare, and the possible magnitude of a breach. Such evaluations (perhaps performed
    by an independent third party) provide insight into your organization’s overall
    cyber resilience, which is a continuously evolving objective.


    Pen testing isn’t just about what’s wrong. It’s also about identifying appropriate
    trade-offs—because you can’t protect everything. Comprehensive penetration testing
    considers several areas: application, networks (including wireless), weak passwords
    and protocols, and physical barriers, such as sensors and cameras.


    Just as you go to a health care provider for an annual wellness checkup, it makes
    sense to enlist the help of highly trained security consultants to carry out your
    security testing. While you might think you’re perfectly healthy, a doctor can
    run tests to detect dangers you’re not aware of. Similarly, the people who put
    together, maintain, and monitor your security program may not have the objectivity
    needed to identify security flaws, understand the level of risk for your organization,
    and help address and fix critical issues. Metaphorically speaking, in this ongoing
    game of cat and mouse, you would be smart to consult with an objective outside
    cat every so often because the mice are fast and sneaky—always learning, always
    evolving, inventing new ways to steal your cheese.


    ## [Tabletop Exercises](#Toc.xhtml#R_sec6_3)


    Tabletop exercises help determine how your team will react to a potential cyberattack
    so you can evaluate the effectiveness of your planning. Companies can identify
    flaws or gaps in their response and make adjustments to ensure top-notch preparedness.
    For instance, if your company experienced a ransomware attack, would your employees
    know what to do? Testing this scenario in a safe environment lets you know if
    your response plan for ransomware is effective and whether it can be improved
    using other alternatives. Tabletop exercises can also help you identify missing
    links in the chain of command—ensuring  documentation of response plans and finding
    gaps in your recovery process. An excellent outside eye can identify and develop
    tabletop exercises that will help your company strengthen its security and resiliency.


    ## [Public Relations and Legal Counsel](#Toc.xhtml#R_sec6_4)'
