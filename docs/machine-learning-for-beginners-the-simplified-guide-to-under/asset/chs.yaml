  [content]

  这是一种根据各种不相关的统计数据得出的平均值。它是一种有助于理解各种随机数据的技术分析。例如，通过理解价格波动的含义，以判断价格是在上涨还是滞后。这种类型的参数被用于股市的预测。它有助于根据过去的价格趋势进行预测。这里使用了两种移动平均线，即简单移动平均线（SMA）和指数移动平均线（EMA）。




  这是一种根据权衡所有证据来做出决策的模型。第一层感知机是通过考虑输入数据来做出三个简单的决策。第二层感知机则是通过权衡第一层感知机的决策来做出决策。因此，第二层可以在比第一层感知机更抽象、更复杂的层面做出决策。


  因此，第三层感知机将做出比第二层复杂得多的决策，从上所述，多层感知机可以从其复杂数据中做出复杂的决策。虽然在计算机中输出看起来有很多，但从实际意义上说，只有一个输出，因为其中一个输出可能是另一层感知机的输入。


  ## 2. 机器如何使用感知机进行学习


  ### 1. 监督学习

  感知机被用于监督学习。它帮助将输入数据进行分类。机器通过由以下四层组成的内容进行学习：


  * 输入数据

  * 权重和偏置

  * 网络加和

  * 激活函数


  这意味着输入数据受到一组权重和偏置的处理。权重显示了函数的强度，而偏置则允许在激活函数内进行上下平移。激活函数决定神经网络的输出，表现为“是”或“否”。


  在机器学习中，监督学习的算法是感知机。它是二分类和线性分类器。也就是说，它基于线性预测函数做出预测。


  机器通过编写机器学习算法来学习。有些算法比其他的更复杂，但最简单的是单层感知机。


  ### 2. 无监督学习

  这种学习有另一种名称，称为赫布学习（Hebbian Learning）。这是一种没有监督或教师的机器学习方法。它就像自学一种程序。这基于其之前输入数据的聚类、概率和密度。该模型识别数据中的共同变量，并根据共同变量的存在与否做出反应。


  无监督学习是统计学中密度估计的模型。它倾向于推断优先概率，而监督学习基于条件概率产生条件概率分布。这种模型倾向于模拟人类逻辑，因为它搜索间接或隐藏的结构或模式来分析新数据。


  无监督学习中常用的模型或算法有：


  * 聚类

  * 异常检测

  * 神经网络

  * 隐变量模型


  这些模型可以被划分为更小的子集。


  ### 3. 强化学习

  机器学习有三种范式：监督学习、无监督学习和强化学习。强化学习是机器学习的一个特殊领域，其中软件代理寻求在环境中采取行动，以最大化某些概念并给出累积奖励。它是一种以目标为引导的算法，学习如何在许多步骤中实现复杂的任务或目标。在合适的条件下，它可以从零开始实现超人类的性能。


  例如，结合深度学习的强化算法可以在游戏领域击败世界冠军和人类专家。它是一个正在快速发展的尖端计算机程序。一个精确的例子是 `ALPHAGO`。


  ## 3. 深度神经网络：回归

  这是一种在输入和输出之间具有多个层的人工网络。它寻求将输入到输出。将考虑以下主题：


  ## 1. 前馈

  这是一种连接不形成循环的人工网络。它与 `RNN` 不同。信息仅向一个方向移动。前馈网络也被称为多层感知机。它们是深度学习的基础。`CNN` 和 `RNN` 是基于监督学习的。


  前馈用于近似代价函数。当执行得当时，它会产生近似值。之所以被称为前馈（feed forward），是因为信息是向前移动的。


  #### 线性函数

  线性函数是在图表上绘制时会产生直线的函数。它具有一个或多个没有指数或幂次的变量。这些变量必须是常数以保持线性。识别线性函数的检查清单是：

  * 它必须有两个变量（如果有第三个，则它必须是常数）

  * 任何变量都不应该有指数

  * 它在任何时候都必须给出直线


  偏离这三点的任何变化都会导致该函数失效；它不再是线性函数。


  #### 激活函数

  激活函数是根据输入传递输出的人工神经元。人工神经元的视觉模型最好解释了这一函数。它是神经结构的末。它是模仿生物神经元的轴突的。它是一个基于 0 或 1 二进制输入的函数，或者是根据输入连接范围输出的函数。


  激活函数也称为传递函数，通常与涉及许多输出的图形相关。激活函数可以是线性的是非线性的，而线性函数保持恒定的输出。非线性激活函数能够创建更多用于构建神经网络的变量。示例有
  `sigmoid` 和 `ReLU` 函数。


  #### 误差函数

  这也称为高斯误差函数。这是一种 sigmoid 形状的特殊函数，可以在概率、统计学和偏微分方程中找到。它用于描述数字通信系统的比特错误率。


  ### 4. 优化器

  优化器或优化算法有两种类型：一阶优化算法和二阶优化算法。优化器用于最小化代价函数，从而在每个训练阶段后更新权重和偏置的值，直到代价函数达到全局最优。





  # 二阶优化

  二阶优化利用二阶导数来完成一阶优化的工作。这种二阶导数被称为 `Hessian`。二阶导数的计算代价非常高，因此很少被使用。二阶优化旨在告知一阶导数是否在增加或减少，它提供了关于二次面的信息，该面接触到误差面的曲率。


  # 反向传播

  这也被误差的反向传播。误差被计算并反向传播到神经网络的每一层。它被用于训练深度神经网络。该函数有助于神经网络快速解决以前无法解决的问题。在当今世界中，它是神经网络学习的主力军。它有助于快速学习，更重要的是，它提供了关于权重和偏置的改变如何影响整体输出的详细见解。


  # 第 4 章：深度神经网络：分类


  在分类中，数据被分为两组，一组被指定为训练集，另一组被指定为测试集。根据 Han 等人的观点，分类任务的两个步骤是模型构建和模型使用。模型使用一组训练好的数据集构建，该数据集反过来变成训练好的模型，并用于尽可能精确地分配隐藏层。训练数据用于构建和训练模型；另一组被称为测试的数据则用于验证训练，即检查训练的准确性。


  在分类中，你处理的是图像分类。它使用一种名为卷积神经网络——`CNN` 的深度学习模型。循环神经网络——`RNN` 不能处理图像，而 `CNN` 处理图像的方式不同于
  `NN` 但仍然遵循相同的通用概念。


  它是任何处理图像识别任务的默认模型。与 `RNN` 下的模型相比，使用 `CNN` 减少了图像所需的参数数量。


  ## 1. 前馈

  前馈有助于解决二分类问题。在机器学习（ML）中，分类是一种监督学习方法，其中任务被划分为数据样本，并由决策函数预定义；当只有两组数据时，它被称为二分类。决策函数是从一组标记样本（称为训练数据）中学习的，而这种学习过程被称为训练。


  ### 1.1.AR 函数

  这被称为线性分类器。也被称为二分类。它是模式识别的一个示例。这是一种基于线性预测器结合输入的权重集和特征向量来做出决策的函数。这有助于建立决策边界，该边界可以是直线或平面。它还用于医学诊断，以预测患者是否患有疾病。该分类器对应于决策边界，其中正样本在一方，而负样本在另一方。


  该函数基本上做出决策或区分两个类别或对象。


  该函数用于金融领域和统计计算中，它可以帮助比较变量成本和费率，有助于预算编制并根据输入的过去学习做出有用的预测。


  ### 1.2. 激活函数

  该函数用作神经元输出处的决策端口。该神经元从线性和非线性决策边界中学习。基于线性或非线性决策边界的学习函数被称为激活函数。它有助于在通过几层决策后计算并归一化输出神经元，由于多层决策的级联效应，这些输出往往变得混乱且数值巨大。


  函数是单调的，而输出不是。它可以是线性的也可以是非线性的。线性是僵化的，无法帮助输入神经网络的复杂输入数据，因此其使用受到限制。非线性是最常用的激活函数。它能够易于处理泛化和可变数据，并区分不同的输出。


  非线性激活函数的示例有：

  - Sigmoid 或逻辑回归激活函数

  - `Tahn` 或双曲正切激活函数

  - `ReLU`（整流线性单元）激活函数

  - `Leaky ReLU`


  ### 1.3. 误差函数

  误差函数在数学中也称为高斯误差函数。它是出现在统计、微分方程中的函数。误差函数与概率密切相关。它近似概率结果。


  ### 1.4. 优化器

  优化器通过更新权重等模型参数来产生更好、更快的结果。优化有两种类型：随机梯度下降或 Adam 梯度下降。优化有助于最小化或最大化目标函数，它是误差函数的另一种名称。


  神经网络利用以下优化类型：

  - 梯度下降

  - 梯度下降变体

  - 随机梯度下降

  - 小批量梯度下降


  ## 2. 反向传播 – BP

  通过训练多层馈神经网络进行分类被称为反向传播。它只有一个输入层、一些隐藏层和一个输出层。每一层由感知器组成，并与其他权重连接。它是机器学习的一种快速方法，并详细说明了偏置权重的改变如何影响神经网络的整体输出。


  反向传播我们需要两个主要假设来允许计算导数。`BP` 利用四个基本方程：

  - 输出层的误差方程

  - 关于后一层误差的方程

  - 成本相对于网络中任何偏置的变化率方程

  - 成本相对于网络中任何权重的变化率方程


  反向传播的应用如下：

  - 分类问题

  - 函数近似

  - 时间序列预测


  `BP` 也被称为反向传播或误差。


  # 第 5 章：机器学习的应用

  在之前的几个章节中，我们已经定义或描述了机器学习的本质。现在我们将列出机器学习的独特重要，以及通过理解机器学习及其操作你可以获得什么。


  机器学习在当今的数字世界中有许多应用。机器学习的使用从农业、医学、安全、电脑游戏、语音识别到手写识别。只要说出生活中机器学习应用广泛的领域即可。


  以下不是全部，但目前机器学习应用广泛的某些领域包括：


  ### 1. 社交媒体服务

  从个性化新闻推送到更好的广告投放，所有社交媒体都在利用机器学习来实现这些任务；你在社交媒体账户上注意到的一些示例包括可能认识的人、人脸识别、从视频和图像中获取有用信息的相似推荐。这些用法可以在
  Facebook 等平台上找到。


  ### 2. 欺诈检测

  邮件垃圾和恶意软件过滤利用机器学习不断更新系统来实现这一点。多层感知机、`C4.5 Decision 树` 归纳是参与垃圾邮件过滤的一些模型。






  欺诈检测的另一个问题是在线欺诈。机器学习让网络空间变得安全可靠。追踪资金欺诈是其功能之一。例如，Paypal 使用 `ML` 来打击洗钱行为。它使用一些工具对在其内部发生的数百万次交易进行比较，并将买家和卖家之间的交易区分为合法交易和非法交易。


  ### 3. 搜索引擎

  供你参考，Google 和其他搜索引擎使用机器学习来改进搜索结果。引擎随着搜索的进行不断学习。如果客户端在查询后停留在页面并打开了搜索结果，机器就会学习该结果符合搜索请求；但如果它没有留在第一页而是继续向下滚动，机器就会学习到搜索结果与查询不匹配。因此，机器学会了改进搜索结果。


  ### 4. 预测

  `ML` 用于 GPS 导航服务。当前位置和车辆速度被保存在服务器流量管理中。它根据存储在过去的输入经验，帮助估计最可能发生拥堵的地方。


  在在线交通网络中，`ML` 在预测高峰时段的乘客需求方面起着重要作用。`Uber` 是在其所有服务领域都使用 `ML` 的交通系统之一。


  ### 5. 农业与食品

  `ML` 已用于食品加工、发酵、过滤、干燥、流变学和湿热测量。它们在热处理和感官科学中也有用途。


