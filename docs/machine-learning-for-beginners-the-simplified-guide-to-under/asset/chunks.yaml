- raw: "It is a model that makes decisions based on weighing all the evidence before\
    \ it. The first layer of perceptron is based on making three simple decisions\
    \ by considering the input data. The second layer perceptron is making decisions\
    \ based on weighing the decisions of the first layer perceptron. Therefore the\
    \ second layer can make a decision at a more abstract and complex level than perceptron\
    \ at first layer.\n\nPerceptron of the third layer will thereby make much more\
    \ complex decisions than the second layer thereby from the foregoing multiple\
    \ layer perceptron can make sophisticated decisions from complex data before it.\
    \ Although in the computer the output looks like they are many but in the real\
    \ sense there is only one output because one output may be the input for another\
    \ layer of perceptron.\n\n2.            HOW CAN A MACHINE LEARN USING PERCEPTRON\n\
    \n1.         Supervised learning\n\nPerceptron is used in supervised learning.\
    \ It helps in classifying the data inputs into it.  The machine learns through\
    \ four layers consisting in\n\n*   Input data \n\n*   Weight and bias\n\n*   Net\
    \ sum \n\n*   Activation function\n\nThat means the input data is subjected to\
    \ a set of weight and biases. The weight shows the strength of the function while\
    \ the biases allow for the up and down shift within the activation function. \
    \ The activation function determines the output of the neural network as in either\
    \ yes or no.\n\nIn Machine Learning, the algorithm for supervised learning is\
    \ perceptron.  It is binary and linear classifiers.  That is, it makes is predictions\
    \ based on a linear predictor function.\n\nThe machines learn by writing a Machine\
    \ Learning algorithm. Some are more complex than others but the simplest is single\
    \ layer perceptron.\n\n2.         Unsupervised learning\n\nThis type of learning\
    \ has another nomenclature called Hebbian Learning.  It is a method of machine\
    \ learning without supervision or teacher.  It is like to teach yourself procedure. \
    \ This is based on cluster and probability and density of data input that is before\
    \ it.  This model recognizes common variables in the data and reacts based on\
    \ the absence or presence of the common variables\n\nUnsupervised learning is\
    \ the model used in density estimation in statistics. It tends to infer on priority\
    \ probability while supervised learning is based on conditional probability producing\
    \ conditional probability distribution. This model tends to mimic human logic\
    \ because it searches for indirect or hidden structures or patterns to analyze\
    \ new data.\n\nCommon models or algorithm used in unsupervised learning are \n\
    \n Clustering\n\n Anomaly detection\n\n Neural networks\n\n Latent variable\
    \ models\n\nThese models can be subdivided into smaller subsets. \n\n3.                 \
    \ Reinforcement learning\n\nThere are three paradigms in machine learning which\
    \ are supervised learning, unsupervised learning and reinforcement learning. \
    \ Reinforcement learning is a special area of machine learning wherein software\
    \ agents seeks to take action in an environment so as to maximize some notions\
    \ to give a cumulative reward. It is goal oriented algorithm which learns how\
    \ to attain a complex objective or goal over many steps. It can start from a blank\
    \ point to achieve a superhuman performance when under the right condition.\n\n\
    For example Reinforcement algorithm incorporating deep learning can beat world\
    \ champions at the game as well as a human expert.  It is state of the art computer\
    \ program that is progressing rapidly. A precise example is ALPHAGO which is a\
    \ computer program that defeated world champion at the ancient Chinese game of\
    \ Go.  Zero is also another program that is even stronger than Alphago and it\
    \ is the strongest player GO in history.\n\nCHAPTER 3 \n\nDEEP NEURAL NETWORK:\
    \ REGRESSION\n\nThis is an artificial neural network ANN with multiple layers\
    \ between the input and output layers.  It seeks to find the correct mathematical\
    \ manipulation to turn the input into the output whether it has a linear or non-linear\
    \ relationship.  The following topics will be considered in this chapter. \n\n\
    1Feed forward neural networks \n\nThis is an artificial neural network where the\
    \ connection between the data does not form a cycle. Therefore it is different\
    \ from recurrent neural networks.  This network was the simplest and was the first\
    \ artificial network. In this network information only moves in one direction\
    \ from the input layer to the output layer with or without passing through hidden\
    \ layers.  In this network, there are no cycles or loops.\n\nDeep feed forward\
    \ networks are also known as multilayer perceptrons.  They are the foundation\
    \ of most deep learning models.  Therefore CNN and RNN are based on feed forward\
    \ networks.  The network is used for supervised Machine Learning.  The prime goal\
    \ of feed forward networks is to approximate some regression functions and map\
    \ them with output function. When this is done properly through mathematical computation\
    \ it results in best approximation.  The reason it is called feed forward is that\
    \ the flow of information moves in a forward direction only.\n\nFeed forward network\
    \ is a better model than linear models because linear models are limited to only\
    \ linear functions whereas neural networks are not. Linear model faces serious\
    \ problems if the data is not linearly separable.  It faces problems in approximation\
    \ which in neural networks is very easy. Under this heading, we will discuss a\
    \ little about the following functions.\n\n1.                   Linear function\n\
    \nA linear function is a function that produces a straight line graph if plotted\
    \ on the graph mathematically.   It is a function that has one or more variables\
    \ without exponents or powers.  These variables must be constant or known to continue\
    \ to remain as a linear function.  The checklist to identifying a linear function\
    \ is as follows:  first, it must have two variables and if it has a third one,\
    \ the third must be a constant. Secondly, none of the variables should have an\
    \ exponent and thirdly it must always give a straight line curve at all times. \
    \ Any shift from these three has disqualified the function; it is no longer a\
    \ linear function.\n\n2.   Activation function\n\nThe activation function is artificial\
    \ neurons that deliver an output based on inputs.  The visual model of the artificial\
    \ neuron best explains this function. It is the end of the neural structure. \
    \ It is modeled after the axon of a biological neuron. It is a function that is\
    \ based on binary inputs of 0 or 1 or a function that connects a range of outputs\
    \ based on inputs.\n\nActivation function otherwise known as transfer function\
    \ is often associated with a graph that involves so many outputs.  An activation\
    \ function can be linear or non – linear while the linear function maintains constant\
    \ output non – linear activation function is able to create more variables which\
    \ can be used to build a neural network.  Examples are sigmoid and ReLU functions\
    \ used by neural networks to build working models.\n\n3.                   Error\
    \ functions\n\nThis is also known as Gauss error function.  It is a special function\
    \ of sigmoid shape that one can find in probability, statistics, and partial differential\
    \ equations.  There are other closely related functions like complementary error\
    \ function and imaginary error function.  It is used to describe the bit error\
    \ rate of a digital communication system.\n\n4.   Optimizer\n\nOptimizer or optimization\
    \ algorithm has two types, first-order optimization algorithm, and second-order\
    \ optimization algorithm.  An optimizer is used to minimize the cost function\
    \ which thereby updates the values of weight and biases after every training section\
    \ until the cost function reaches global optimum.\n\nFirst order optimization\
    \ either minimizes or maximizes the cost function using its gradient values with\
    \ respect to the parameters.   This tends to inform us whether the function is\
    \ decreasing or increasing at a given point.  "
  fmt: '

    It is a model that makes decisions based on weighing all the evidence before it.
    The first layer of perceptron is based on making three simple decisions by considering
    the input data. The second layer perceptron is making decisions based on weighing
    the decisions of the first layer perceptron. Therefore the second layer can make
    a decision at a more abstract and complex level than perceptron at first layer.


    Perceptron of the third layer will thereby make much more complex decisions than
    the second layer thereby from the foregoing multiple layer perceptron can make
    sophisticated decisions from complex data before it. Although in the computer
    the output looks like they are many but in the real sense there is only one output
    because one output may be the input for another layer of perceptron.


    ## 2. HOW CAN A MACHINE LEARN USING PERCEPTRON


    ### 1. Supervised learning

    Perceptron is used in supervised learning. It helps in classifying the data inputs
    into it. The machine learns through four layers consisting in:


    * Input data

    * Weight and bias

    * Net sum

    * Activation function


    That means the input data is subjected to a set of weight and biases. The weight
    shows the strength of the function while the biases allow for the up and down
    shift within the activation function. The activation function determines the output
    of the neural network as in either yes or no.


    In Machine Learning, the algorithm for supervised learning is perceptron. It is
    binary and linear classifiers. That is, it makes is predictions based on a linear
    predictor function.


    The machines learn by writing a Machine Learning algorithm. Some are more complex
    than others but the simplest is single layer perceptron.


    ### 2. Unsupervised learning

    This type of learning has another nomenclature called Hebbian Learning. It is
    a method of machine learning without supervision or teacher. It is like to teach
    yourself procedure. This is based on cluster and probability and density of data
    input that is before it. This model recognizes common variables in the data and
    reacts based on the absence or presence of the common variables.


    Unsupervised learning is the model used in density estimation in statistics. It
    tends to infer on priority probability while supervised learning is based on conditional
    probability producing conditional probability distribution. This model tends to
    mimic human logic because it searches for indirect or hidden structures or patterns
    to analyze new data.


    Common models or algorithm used in unsupervised learning are:


    * Clustering

    * Anomaly detection

    * Neural networks

    * Latent variable models


    These models can be subdivided into smaller subsets.


    ### 3. Reinforcement learning

    There are three paradigms in machine learning which are supervised learning, unsupervised
    learning and reinforcement learning. Reinforcement learning is a special area
    of machine learning wherein software agents seeks to take action in an environment
    so as to maximize some notions to give a cumulative reward. It is goal oriented
    algorithm which learns how to attain a complex objective or goal over many steps.
    It can start from a blank point to achieve a superhuman performance when under
    the right condition.


    For example Reinforcement algorithm incorporating deep learning can beat world
    champions at the game as well as a human expert. It is state of the art computer
    program that is progressing rapidly. A precise example is `ALPHAGO`.


    ## 3. DEEP NEURAL NETWORK: REGRESSION

    This is an artificial network with multiple layers between the input and output.
    It seeks to map the input to output. The following topics will be considered:


    ### 1. Feed forward

    This is an artificial network where the connection does not form a cycle. It is
    different from `RNN`. Information moves in one direction only. Feed forward networks
    are also known as multilayer perceptrons. They are the foundation of deep learning.
    `CNN` and `RNN` are based on supervised learning.


    Feed forward is used to approximate the cost function. When this is done properly
    it results in approximation. The reason it is called feed forward is that information
    moves forward.


    #### Linear function

    A linear function is a function that produces a straight line if plotted on the
    graph. It is a function that has one or more variables without exponents or powers.
    These variables must be constant to remain as linear. The checklist to identifying
    a linear function is:

    * It must have two variables (if it has a third one must be constant)

    * None of the variables should have an exponent

    * It must always give a straight line at all times.


    Any shift from these three has disqualified the function; it is no longer a linear
    function.


    #### Activation function

    The activation function is artificial neurons that deliver an output based on
    inputs. The visual model of the artificial neuron best explains this function.
    It is the end of the neural structure. It is modeled after the axon of a biological
    neuron. It is a function that is based on binary inputs of 0 or 1 or a function
    that connects a range of outputs based on inputs.


    Activation function otherwise known as transfer function is often associated with
    a graph that involves so many outputs. An activation function can be linear or
    non-linear while the linear function maintains constant output. Non-linear activation
    function is able to create more variables which can be used to build a neural
    network. Examples are `sigmoid` and `ReLU` functions.


    #### Error functions

    This is also known as Gauss error function. It is a special function of sigmoid
    shape that one can find in probability, statistics, and partial differential equations.
    It is used to describe the bit error rate of a digital communication system.


    ### 4. Optimizer

    Optimizer or optimization algorithm has two types, first-order optimization algorithm,
    and second-order optimization algorithm. An optimizer is used to minimize the
    cost function which thereby updates the values of weight and biases after every
    training section until the cost function reaches global optimum.

