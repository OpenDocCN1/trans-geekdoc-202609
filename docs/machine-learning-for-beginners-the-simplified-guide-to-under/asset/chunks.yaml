    \ is used as a decision making port at the output of a neuron. This neuron learns\
    \ from linear and non-linear decision-making boundaries. Learning function based\
    \ on linear or non-linear decision boundaries is known as the activation function.\
    \ It also helps to compute and normalizes the output neurons after passing through\
    \ several layers of decision making which tends to be chaotic and very large due\
    \ to the cascading effect of the multilayer decision making.\n\nThe function is\
    \ monotonic while the output is not. It can be linear or non-linear.  Linear is\
    \ rigid and does not help with the complex input data fed to Neural Network so\
    \ its use is limited. The nonlinear is the mostly used activation functions. \
    \ It makes it easy to work with generalization and variable data and to differentiate\
    \ between the outputs.\n\nExamples of the nonlinear activation function are\n\n\
     A sigmoid or logistic activation function\n\n Tahn or hyperbolic tangent Activation\
    \ Function\n\n ReLU  (Rectified Linear Unit) Activation Function\n\n Leaky ReLU\n\
    \n3.  ERROR FUNCTION\n\nAn error function is also known as Gauss error function\
    \ in Mathematics. It is a function that is found in statistics, probability and\
    \ differential equations. The error function is closely connected with probability.\
    \ It approximates the result that has a high probability. \n\n4.  OPTIMIZER\n\n\
    Optimizers are used to produce better and faster results by updating the model\
    \ parameters such as weight and Bias values.  There are two types of optimization\
    \ – stochastic gradient descent or Adam gradient descent. Optimization helps to\
    \ minimize or maximize an objective function which is another name for error function.\n\
    \nNeural Network utilizes the following optimization types\n\nGradient descent\n\
    \nVariants of Gradient Descent\n\nStochastic gradient descent\n\nMini-batch gradient\
    \ descent\n\n2.            BACK PROPAGATION – BP\n\nClassification model by training\
    \ a multilayer feed forward neural network is called Back Propagation. It has\
    \ only one input layer with some hidden layers and one output layer. Each layer\
    \ is made up of perceptron which can be linked to other weighted connections.\
    \ It is a faster means of training machine learning and gives detailed insights\
    \ into how changing biases and weights can change the overall output of the network.\
    \ \n\nBack Propagation we need to have two main assumptions which help to allow\
    \ computing partial derivatives. BP utilizes four basic equations which are  \n\
    \n*   The equation for the error in the output layer\n\n*   The equation for the\
    \ error in terms of the next layer\n\n*   The equation for the rate of change\
    \ of the cost with respect to any bias in the network\n\n*   The equation for\
    \ the rate of change of the cost with respect to any weight in the network.\n\n\
    Applications of Back Propagation are as follows:\n\n Classification problems\n\
    \n Function approximation\n\n Time series prediction\n\nBP is also known as\
    \ Back Propagation or errors.\n\nCHAPTER 5\n\nAPPLICATION OF MACHINE LEARNING\n\
    \nIn the previous chapters, we have defined or described what Machine Learning\
