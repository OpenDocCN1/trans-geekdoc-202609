    \ Unit) Activation Function\n- `Leaky ReLU`\n\n### 1.3. ERROR FUNCTION\nAn error\
    \ function is also known as Gauss error function in Mathematics. It is a function\
    \ that is found in statistics, probability and differential equations. The error\
    \ function is closely connected with probability. It approximates the result that\
    \ has a high probability.\n\n### 1.4. OPTIMIZER\nOptimizers are used to produce\
    \ better and faster results by updating the model parameters such as weight and\
    \ Bias values. There are two types of optimization – stochastic gradient descent\
    \ or Adam gradient descent. Optimization helps to minimize or maximize an objective\
    \ function which is another name for error function.\n\nNeural Network utilizes\
    \ the following optimization types:\n- Gradient descent\n- Variants of Gradient\
    \ Descent\n- Stochastic gradient descent\n- Mini-batch gradient descent\n\n##\
    \ 2. BACK PROPAGATION – BP\nClassification model by training a multilayer feed\
    \ forward neural network is called Back Propagation. It has only one input layer\
    \ with some hidden layers and one output layer. Each layer is made up of perceptron\
    \ which can be linked to other weighted connections. It is a faster means of training\
    \ machine learning and gives detailed insights into how changing biases and weights\
    \ can change the overall output of the network.\n\nBack Propagation we need to\
    \ have two main assumptions which help to allow computing partial derivatives.\
    \ `BP` utilizes four basic equations which are:\n- The equation for the error\
    \ in the output layer\n- The equation for the error in terms of the next layer\n\
    - The equation for the rate of change of the cost with respect to any bias in\
    \ the network\n- The equation for the rate of change of the cost with respect\
    \ to any weight in the network.\n\nApplications of Back Propagation are as follows:\n\
    - Classification problems\n- Function approximation\n- Time series prediction\n\
    \n`BP` is also known as Back Propagation or errors.\n\n# CHAPTER 5: APPLICATION\
    \ OF MACHINE LEARNING\nIn the previous chapters, we have defined or described\
    \ what Machine Learning is all about. We will now go ahead and itemize the unique\
    \ importance of Machine Learning and what you stand to gain from understanding\
    \ Machine Learning and its operations.\n\nMachine Learning has many applications\
    \ in today’s digital world. The use of Machine Learning span from agriculture\
    \ to medicine to security, computer games, voice recognition to handwriting recognition.\
    \ Just name the area of life you have Machine learning application wildly in use.\n\
    \nThe following are not exclusive but some of the areas where Machine Learning\
    \ is wildly in use today are:\n\n### 1. Social media services \nFrom personal\
    \ news feed to better advertisement targeting social media all are utilizing Machine\
    \ Learning to achieve these tasks; some of the examples you will notice on social\
    \ media accounts are people you may know, face recognition, similar pins which\
    \ are a technique of obtaining useful information from videos and images. All\
    \ these usages can be found on Facebook etc. \n\n### 2. Fraud detection \nEmail\
    \ spam and malware filtering utilize Machine Learning to constantly update the\
    \ system to achieve this. Multilayer Perceptron, `C4.5 Decision Tree` induction\
    \ are some of the models that engage in spam filtering techniques.\n"
