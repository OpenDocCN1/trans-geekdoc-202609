    # 引言


    感谢下载《初学者机器学习》一书。本书的目的是通过循序渐进的方法，利用深度神经网络，让你在不涉及复杂的数学或计算机语言的情况下，轻松地学习机器学习的工作原理。


    本书旨在引导完全初学者如何使用感知器（类似于人类大脑中的神经元）来理解机器学习的工作原理，并提供为了学习机器学习所需的基础知识。


    `ML` 是一个很深奥的主题，但本书旨在向完全初学者介绍该主题，使 `ML` 的基础、理论以及其操作和应用能够被初学者轻松理解。本书将把 `ML` 的要点分解为小部分，以促进对机器学习的轻松理解。


    ## 机器学习的优势


    以下是机器学习的一些优势。我们将在另一个关于机器学习应用的章节中更详细地讨论这些益处。


    *   机器学习有助于管理特定环境中不同类型的海量多维数据。它使计算机处理来自不同来源的各种杂信息变得简单，从而能够其进行存储和排列，为不同的搜索提供快速的结果。

    *   在处理大规模、惊人的海量信息时，机器学习可以使信息处理变得非常快速、多样、多维、准确且廉价。

    *   通过收集信息并将其输入计算机，机器学习可以用于对现有机会进行预测和高精度预测，并能发出警告以规避商业世界中的潜在危险。这种信息收集和计算可以使企业在面对激烈的竞争对手时拥有竞争优势。

    *   它有助于金融领域在两个核心领域做出关键决策，即何时投资业务或防范勒索，这可能有助于做出关于何时退出或放弃某项业务的决定。

    *   它可以帮助限制政府或私有安全机构的数据欺诈。因此，机器学习在安全系统中具有顶级的用途。

    *   由于数据输入，机器学习在医疗保健领域具有巨大的用途。机器可以用于进行精确准确的诊断。

    *   根据你过去的购买记录，它正成为零售业的未来，计算机可以解释个人可能感兴趣的产品。这是零售世界的新趋势。机器学习现在可以处理之前的购买历史，并预测客户可能感兴趣的内容。

    *   它在石油天然气行业有巨大的用途，机器学习被用于将可用数据转换为智能信息，优化石油分配，使其更具高效且更精确。该领域的应用仍在扩大。

    *   它在运输业务中具有巨大的性。它有助于区分对运输大有益的模式。高效利用机器学习可以帮助扩大收益。


    # 第 1 章：什么是机器学习？


    机器学习是人工智能的一个分支，是一种相对较新的计算机编程形式，它允许计算机访问海量数据，同时也允许机器通过经验进行学习，而无需机器被专门程序成那样。机器会自己学习。通过不同的输入数据和经验，它能够执行某些未预先编程的任务。它基本上是对提供给计算机的信息模式进行分析和解释。


    机器学习又称为 `ML`，是一个不断发展的学科，可以在从语言识别、血缘识别到数据挖掘的广泛应用范围内发挥关键作用。


    这里的支柱是计算机根据提供的数据经验进行自动学习。当计算机输入新数据时，它进入了自学模式，它会调整、增长和发展自己，无论它是否被显式地编程。它从输入的示例和信息中获益，并在几乎没有人类帮助的情况下得出结论。


    ## 赋予机器学习的典型任务


    机器学习任务可以分为许多大大类。在机器学习任务中，我们有监督学习和半监督学习。监督学习围绕数学模型构建，这些模型可以从一组输入数据和期望输出中推导出。因此，我们这一类下有训练数据。


    半监督学习是围绕不完整数据训练构建的数学模型。这意味着部分输入数据没有附标签。


    与机器学习相关的任务有很多类型，但关键的包括：


    *   特征选择

    *   回归

    *   分类

    *   聚类

    *   测试与匹配

    *   密度估计

    *   降维

    *   多变量查询


    在所有这些与机器学习相关的任务中，我们关注回归和分类。回归和分类任务基本上都是监督学习。虽然分类的输出在本质上是离散的，但回归是对连续数量的预测。


    ### 回归任务


    机器学习中的这项任务涉及数值估计和本质上是连续的数据，这也可以被称为连续变量。在此任务下，我们有如下内容：


    *   房屋单元的价格估算

    *   产品价格

    *   股票价格


    这项任务涉及金融世界的买卖以及与数值数据相关的会计程序。可以使用以下方法来实现此任务的目标，这些方法可以细分为两组：


    高准确率方法：

    *   内核回归

    *   高斯过程回归


    准确率不够的方法：

    *   回归树

    *   线性回归

    *   支持向量回归

    *   `LASSO`


    ### 分类任务


    我们要处理的机器学习的另一个分支被称为离散变量。它是关于预测一类数据。例如，预测一封邮件是否为垃圾邮件。它在医疗保健领域也被广泛使用，即预测一个人是否患有某种疾病。它还被用于金融领域，以确定交易是否欺诈。


    这项任务也可以分为两个大分支，即高准确率和准确率不够的。在高准确率任务下，可以使用以下方法解决此任务的问题：

    *   `K – Nearest Neighbours`

    *   `Artificial neural networks (ANN)`

    *   `Support vector machine (SVM)`

    *   `Random forest`（随机森林）


    准确率不够的方法：

    *   决策树

    *   提升树

    *   逻辑回归

    *   朴素贝叶斯

    *   深度学习


    ## 核回归


    在回归主题下，我们将详细介绍以下：


    这是一种拟合数据的估计技术。它被归类为参数技术。它与基于正态分布假设的线性回归不同因为它因为它假设任何分布来估计回归函数。


    内核回归的作用是在每个观测数据点上放置一组名为“核”（kernel）的相同函数。它是其他加权回归的超集，与移动平均（`MA`）、K 近邻（`KNN`）、径向基函数（`RBF`）、神经网络（`NN`）和支持向量机（`SVM`）密切相关。


    在继续之前我们将定义这些参数


    `MA – MOVING AVERAGE`（移动平均）


    '
