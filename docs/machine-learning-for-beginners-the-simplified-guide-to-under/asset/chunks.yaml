    This is average derived from various statistical data that are not related. it
    is a technical analysis that helps to make sense of various random data. The example
    is making sense out of price fluctuations to see whether the price is increasing
    or lagging. This type of parameter is what is used to forecast in the stock exchange.
    It helps in forecasting based on the past prices trend. There are two moving averages
    in use which are the simple moving average – `SMA` and the exponential moving
    average – `EMA`.


    The simple moving average – `SMA` is the data obtained by examining the trend
    over a defined period of time while exponential moving average – `EMA` gives greater
    weight to the more recent data. That is the more recent data is what is considered
    in `EMA` so one can conclude that `SMA` is analysis data over a very long time
    while `EMA` is consideration of data over a short period of time.


    These two parameters can now be used to generate other technical indicators such
    as Moving Average Convergence Divergence – `MACD`


    Application of moving average in real life is predicting the stock exchange. If
    properly utilized it can predict whether the market is bullish that is uptrend
    or bearish that is a downtrend.


    ### Gaussian process regression


    This is a distribution over functions and inferences taking place in the space
    of functions. They have parameters that can be changed by setting certain parameters.
    That means the properties begin to change as parameters are changed or varied.
    A sharp example is the `GP` model which takes the form of full predictive distribution.
