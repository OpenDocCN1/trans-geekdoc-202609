- raw: "This is average derived from various statistical data that are not related. \
    \ it is a technical analysis that helps to make sense of various random data. \
    \ The example is making sense out of price fluctuations to see whether the price\
    \ is increasing or lagging.  This type of parameter is what is used to forecast\
    \ in the stock exchange.  It helps in forecasting based on the past prices trend. \
    \ There are two moving averages in use which are the simple moving average – SMA\
    \ and the exponential moving average – EMA.  \n\nThe simple moving average – SMA\
    \ is the data obtained by examining the trend over a defined period of time while\
    \ exponential moving average – EMA gives greater weight to the more recent data.\
    \ That is the more recent data is what is considered in EMA so one can conclude\
    \ that SMA is analysis data over a very long time while EMA is consideration of\
    \ data over a short period of time.\n\nThese two parameters can now be used to\
    \ generate other technical indicators such as Moving Average Convergence Divergence\
    \ – MACD   \n\nApplication of moving average in real life is predicting the stock.\
    \ Exchange.   If properly utilized it can predict whether the market is bullish\
    \ that is uptrend or bearish that is a downtrend.   \n\nGaussian process regression\n\
    \nThis is a distribution over functions and inferences taking place in the space\
    \ of functions. They have parameters that can be changed by setting certain parameters. \
    \ That means the properties begin to change as parameters are changed or varied. \
    \ A sharp example is the GP model which takes the form of full predictive distribution.\
    \ Also, the learning of inverse dynamics of a robot is a practical example.\n\n\
    All these models have so many statistical and mathematical functions but we do\
    \ not intend to bore you with these things at this beginning.  All we want is\
    \ to give you familiarization tour around the topic in layman language for easy\
    \ comprehension.  \n\nThis model utilizes the weight – space view which is a simple\
    \ linear regression model where the output is linear combinations of the inputs. \
    \ This means the main virtue of the model is the simplicity of implementation\
    \ and interpretation while the drawback is that if the output cannot be reasonably\
    \ approximated, the linear function will give poor predictions.\n\nUnder classification\
    \ we will like to treat the following models:\n\nKNN – K NEAREST NEIGHBOUR\n\n\
    This parameter is part of supervised learning which has been used in many applications\
    \ successfully.  It has been used in the field of statistical pattern recognition\
    \ like speech and handwriting recognition, data mining, etc.  The purpose of this\
    \ is to classify a new object based on previous training samples.  It does not\
    \ use any model but only uses memory. For a query, we find k number of objects\
    \ or training points that are closest to the query point. It is using majority\
    \ votes among the k objects. It uses neighborhood classification to predict the\
    \ value of the new query. \n\nExample of this parameter is predicting the quality\
    \ outcome of a new product from the same company but with different properties\
    \ from the former ones using the outcome of data obtained from questionnaires\
    \ survey asking people about their opinion of the product whether it is good or\
    \ not using four training samples namely data of acid durability and strength.\n\
    \nAcid durabilitystrengthclassification\n\n66bad\n\n64bad\n\n34good\n\n14good\n\
    \nUsing this data it is possible to determine without another survey whether another\
    \ product which has acid durability 3 and strength 2 from the laboratory test\
