    virtue of the model is the simplicity of implementation and interpretation while
    the drawback is that if the output cannot be reasonably approximated, the linear
    function will give poor predictions.


    ### Classification


    Under classification we will like to treat the following models:


    #### KNN – K NEAREST NEIGHBOUR


    This parameter is part of supervised learning which has been used in many applications
    successfully. It has been used in the field of statistical pattern recognition
    like speech and handwriting recognition, data mining, etc. The purpose of this
    is to classify a new object based on previous training samples. It does not use
    any model but only uses memory. For a query, we find `k` number of objects or
    training points that are closest to the query point. It is using majority votes
    among the `k` objects. It uses neighborhood classification to predict the value
    of the new query.


    Example of this parameter is predicting the quality outcome of a new product from
    the same company but with different properties from the former ones using the
    outcome of data obtained from questionnaires survey asking people about their
    opinion of the product whether it is good or not using four training samples namely
    data of acid durability and strength.


    `Acid durabilitystrengthclassification`


    ```

    66bad

    64bad

    34good

    14good

    ```


    Using this data it is possible to determine without another survey whether another
    product which has acid durability 3 and strength 2 from the laboratory test can
    be classified as good or as bad. Its application in real life is marketing. It
    can be used to deduce whether a product will be seen as good or not.


    #### RBF – RADIAL BASIS FUNCTION


    This function has the real value which depends on the distance from the origin
    or a centre. Origin in geometry is a fixed special point of reference denoted
    as `O` used as a reference point in relation to the surrounding area. This function
    is used to build up the approximation of a given function or data called multivariate.
    Because it is radial it can be used in more than one dimension; therefore a radial
    function is a function paired in a vector or metric space having a centre `C`.
    This function is associated with what is called radial kernels. Hence radial kernels
    are the basis for radial functions.


    Commonly used types are Neural Networks. This is used highly in the of science
    and technology.


    #### NN – NEURAL NETWORKS


    This is the model that uses perceptron to operate. Single layer operation of multiples
    of these when combined form what is known as Neural Networks. This is a computer
    program modeled after the human brain. It uses examples to automatically build
    rules for recognizing handwritten digits. By increasing the number of examples
    the network can predict with high accuracy. Accuracy is a function of the degree
    of learning examples this network is exposed to. The more the learning examples
    the more accurate the prediction will be.


    #### SVM – SUPPORT VECTOR MACHINE


    This is a supervised learning model in Machine Learning. They analyze data used
    for classification and regression. It produces significant accuracy with less
    computation power. It can be used for both classification and regression tasks.
    It helps to separate two classes of data points where there are several of them.
    These two classes should have maximum distances between the data points such that
    in the future, data points that fall within the model can be classified with more
    confidence. This maximizes the margin of the classifier.


    Application of this model can be found in the field of hydrology. It is used in
    flood routing. It is used in face detection, text and hypertext categorization,
    classification of images, bioinformatics, handwriting recognition, and Generalized
    Predictive Control `GPC`.


