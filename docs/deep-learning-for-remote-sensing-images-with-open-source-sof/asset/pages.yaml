- pgno: 22
  md: '# ## 2.1.1 Applications


    The Orfeo ToolBox applications aim to provide users a number of implemented algorithms.
    These applications can be used directly through multiple interfaces like command
    line, graphical user interface, and third-party software like QGIS for instance.
    For developers, applications can also be used from Python and C++ APIs. Each OTB
    application comes with a set of parameters. Parameters used in OTB applications
    are typed (images, vector data, file, folder, integer, floating, etc.) and this
    formalism makes the OTB applications usable through all interfaces and APIs.


    # ## 2.1.2 Streaming mechanism


    The streaming mechanism enables the processing of images several times on different
    regions. Instead of working on the entire data, which would require a lot of memory,
    blocks are processed one by one until the output data is produced. This mechanism
    preserves the memory footprint and enables the processing of very large data.
    Most of the algorithms implemented in OTB applications and C++ classes support
    this mechanism. The few algorithms that don’t implement the streaming mechanism
    require that all input and output data are stored in memory at execution.


    # ## 2.1.3 Remote modules


    For developers, OTB eases the integration and the deployment of new features thanks
    to the external modules. This mechanism enables you to standardize the development
    of components external to the library, such as a new OTB application. Remote modules
    allow anyone to extend the functionalities of OTB without being part of the core
    project repository. Remote modules can have different licenses than the main OTB
    repository. For instance, the OTBTF remote module that we will use in this tutorial,
    implements deep learning using the TensorFlow library. It is not in the core of
    the official OTB library, but provides applications that can be used as any other
    using the OTB application API.


    # ## 2.1.4 The Python API


    The Python API of the Orfeo ToolBox enables you to build pipelines using in-memory
    connection of existing OTB applications. The resulting pipeline still enforces
    the streaming mechanism. Another useful feature is the ability of using Numpy
    arrays in pipelines, as input or output of the OTB applications. The Python API
    is really great to build complex pipelines with already existing algorithmic blocks
    like the OTB applications (including the applications from remote modules). This
    book targets user-oriented interactions with OTB applications, and Python bindings
    are partially introduced in section 16.3.'
  merge: -1
  img_proc: true
