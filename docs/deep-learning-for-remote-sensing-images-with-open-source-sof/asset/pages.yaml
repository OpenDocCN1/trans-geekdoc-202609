  md: '# 8.5.1 Inference


    In this section, we will generate some maps.


    # 8.5.1.1 Patch-based mode


    First, we will run the model in patch-based mode. Generate the output classification
    map at the resolution of the 20-m-spacing image. To do this, just feed the 20-m-spacing
    image to the source1, which is the reference source for the output physical spacing.


    ```

    ```text

    # Generate the classification map, patch-based mode, same

    # resolution as the 20m spacing image

    otbcli_TensorflowModelServe \

    -source1.il Sentinel-2_B567_20m.tif \

    -source1.rfieldx 8 \

    -source1.rfieldy 8 \

    -source1.placeholder "x1" \

    -source2.il Sentinel-2_B4328_10m.tif \

    -source2.rfieldx 16 \

    -source2.rfieldy 16 \

    -source2.placeholder "x2" \

    -model.dir model3 \

    -output.names "prediction" \

    -out "classif_model3.tif?&box=2000:2000:500:500"

    ```

    ```


    If you switch source1 and source2 so the first source is the 10-m-spacing image,
    then the output image will be created with the same spacing. Let’s try it!


    # 8.5.1.2 Fully convolutional mode


    Generate the output classification map at the same resolution as the 10-m-spacing
    image, setting the **fullyconv** parameter to **on** to enable the fully convolutional
    mode of the processing.


    Use the following command line:


    ```

