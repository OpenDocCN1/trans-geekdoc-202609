    \ on \\\n--output.names \"prediction\" \\\n--out \"classif_model2.tif?&box=4000:4000:1000:1000\"\
    \n```\n```\n\nThe map can be produced over the whole image. The **optim** parameter\
    \ group of **TensorflowModelServe** enables us to adjust settings for the model\
    \ execution to reach better performance. To speed up the process, you can force\
    \ the application to produce the result using large tiles. In the following, we\
    \ force the output tiles to large rectangular tiles of 128-pixel height, in order\
    \ to reduce the computation from partially overlapping input areas.\n\n```\n```text\n\
    # Generate the landcover map over the entire image\notbcli_TensorflowModelServe\
