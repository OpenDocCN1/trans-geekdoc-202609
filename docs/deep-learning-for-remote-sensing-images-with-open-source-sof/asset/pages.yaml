- pgno: 70
  md: "```\n```python\n# The 20m spacing branch (input patches: 8x8x3)\nconv1_x1 =\
    \ tf.layers.conv2d(inputs=x1, filters=16, kernel_size=[3,3],\n               \
    \             padding=\"valid\", activation=tf.nn.relu)\n# conv1_x1 out size:\
    \ 6x6x16\nconv2_x1 = tf.layers.conv2d(inputs=conv1_x1, filters=32, kernel_size=\n\
    \                            [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv2_x1 out size: 4x4x32\nconv3_x1 = tf.layers.conv2d(inputs=conv2_x1, filters=64,\
    \ kernel_size=\n                            [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv3_x1 out size: 2x2x64\nconv4_x1 = tf.layers.conv2d(inputs=conv3_x1, filters=64,\
    \ kernel_size=\n                            [2,2], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv4_x1 out size: 1x1x64\n\n# The 10m spacing branch (input patches: 16x16x4)\n\
    conv1_x2 = tf.layers.conv2d(inputs=x2, filters=16, kernel_size=[5,5],\n      \
    \                      padding=\"valid\", activation=tf.nn.relu)\n# conv1_x2 out\
    \ size: 12x12x16\nconv2_x2 = tf.layers.conv2d(inputs=conv1_x2, filters=32, kernel_size=\n\
    \                            [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv2_x2 out size: 10x10x32\nconv3_x2 = tf.layers.conv2d(inputs=conv2_x2, filters=64,\
    \ kernel_size=\n                            [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv3_x2 out size: 8x8x64\nconv4_x2 = tf.layers.conv2d(inputs=conv3_x2, filters=64,\
    \ kernel_size=\n                            [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv4_x2 out size: 6x6x64\nconv5_x2 = tf.layers.conv2d(inputs=conv4_x2, filters=64,\
    \ kernel_size=\n                            [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv5_x2 out size: 4x4x64\npool1_x2 = tf.layers.max_pooling2d(inputs=conv5_x2,\
    \ pool_size=[2, 2],\n                                   strides=2)\n# pool1_x2\
    \ out size: 2x2x64\nconv6_x2 = tf.layers.conv2d(inputs=pool1_x2, filters=64, kernel_size=\n\
    \                            [2,2], padding=\"valid\", activation=tf.nn.relu)\n\
    # conv6_x2 out size: 1x1x64\n\n# Stack features from the two branches\nfeatures\
    \ = tf.reshape(tf.stack([conv4_x1, conv6_x2], axis=3),\n                     \
    \ shape=[-1, 128], name=\"features\")\n\n# Fully connected layer\ndense_1 = tf.layers.dense(inputs=features,\
    \ units=128, activation=\n                          tf.nn.relu)\n\n# Neurons for\
    \ classes\nestimated = tf.layers.dense(inputs=dense_1, units=nclasses,\n     \
    \                        activation=None)\nestimated_label = tf.argmax(estimated,\
    \ 1, name=\"prediction\")\n\nreturn estimated, estimated_label\n\n\"\"\" Main\
    \ \"\"\"\n```\n```"
