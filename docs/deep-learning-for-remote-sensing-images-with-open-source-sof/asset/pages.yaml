- pgno: 149
  md: '# 18


    # Inference


    We will apply the previously exported *SavedModel* on the Sentinel-1 and Sentinel-2
    images.


    # 18.1  Inputs and outputs


    At inference time, only the inputs for $S1_t$, $S2_{t-1}$ and $S2_{t+1}$ are fed
    to the model. The $\bar{S2}_t$ input is not used anymore: we only care about retrieving
    the $S2_t$ image at the output of the model.


    Another important point is the output used to retrieve $S2_t$. As explained in
    section 12.2.2.1, computing the *exact* output of a fully convolutional model
    is one strategy to avoid blocking artifacts. For this purpose, we compute the
    *exact* output of the model in extracting the center of the final convolution
    output. We then remove 256 pixels from each side of the output tensor named *prediction_fcn*
    in the spatial dimensions. The corresponding tensor, named *prediction_fcn*, is
    used as output for $S2_t$. Removing 256 pixels from each side of the spatial dimensions
    of the output tensor is equivalent to using a model that inputs virtual patches
    of 576 × 576 and produces a field of 64 × 64 pixels. Note that very deep models
    can lead to a significant theoretical margin to remove. When this margin is too
    large, one is advised to analyze the effect of the margin on the output, to find
    a practical setting. The practical margin should be large enough to avoid blocking
    artifacts, and small enough to reasonably impact the shrinking of the model output.
    In the OTBT formalism, our network has hence a receptive field of 576 × 576 pixels,
    and an output *expression field* of 64 × 64 pixels. Figure 18.1 presents the model
    used at inference time.


    # 18.2  Generating the image


    Since the output is *prediction_fcn*, the image can be efficiently processed by
    blocks without tiling artifacts. We apply the model on the inputs'
  merge: -1
  img_proc: true
