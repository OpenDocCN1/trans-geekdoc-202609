  md: 'of the net at each iteration. Thus, distribution of the initial model weights
    and data are crucial to make the learning converge. In many machine learning frameworks,
    parameters are often defaulted to be suited for centered reduced distributions
    and values within the [-1, +1] range. That is why data normalization is a fundamental
    pre-processing step. Regarding our dataset, we will shift-scale all remote sensing
    images channels to normalize them with their maximum value using the BandMathX
    application.


    To generate the normalized image, go inside the output folder from the command
    line. You can use the cd command to navigate in the file system, which is common
    for Windows and UNIX.


    ```

    # Normalize images


    # Go in the folder Sentinel-2 images (10m)

    cd ~/tokyo/

    cd S2A_MSIL2A_20190508T012701_N0212_R074_T54SUE_20190508T041235.SAFE

    cd GRANULE/L2A_T54SUE_A020234_20190508T012659/IMG_DATA/R10m/


    # Concatenate images, and normalise them between [0,1]

    otbcli_BandMathX \

    -il T54SUE_20190508T012701_B04_10m.jp2 \

    T54SUE_20190508T012701_B03_10m.jp2 \

    T54SUE_20190508T012701_B02_10m.jp2 \

    T54SUE_20190508T012701_B08_10m.jp2 \

    -exp "{im1b1/im1b1Maxi;im2b1/im2b1Maxi;im3b1/im3b1Maxi;im4b1/im4b1Maxi}" \

    -out ~/tokyo/Sentinel-2_B4328_10m.tif


    # Go back in the working directory

    cd ~/tokyo/

    ```


    The command line above runs the BandMathX application with the following parameters:


    +   - **il** is the input images list. We have fed 4 string values to this parameter
    which are the Sentinel-2 band filenames.

    +   - **exp** is the mathematical expression that the application will perform
    on the pixels. The provided expression simply normalizes each channel with its
    maximum value, ensuring that the output range is [0, 1].

    +   - **out** is the output generated image filename.


