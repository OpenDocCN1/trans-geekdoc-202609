  md: '# Mapping buildings


    In this section, we apply semantic segmentation to map the buildings over the
    Amsterdam region of interest.


    # 12.1  Input data pre-processing


    We intend to perform the semantic segmentation of buildings, from a Spot-7 image
    at 1.5 m acquired over Amsterdam. The first step is to pre-process the Spot-7
    image. Then, we will prepare the terrain truth that will be used for training
    of our U-Net model. The main difference with the approach investigated in Part
    II, is that the labels are patches rather than a single label value. Hence we
    need to produce a label image for our terrain truth, with the same pixel size
    of the Spot-7 image.


    # 12.1.1  Satellite image pansharpening


    For the sake of simplicity, we will introduce a very simple deep network that
    inputs a single image. For this reason, we will fuse the panchromatic channel
    and the multispectral image into one single image, prior to other processing.
    We perform pansharpening of the Spot-7 product, meaning that we generate a multispectral
    image that has the same resolution as the panchromatic channel, and the same channels
    as the original multispectral image. To generate this pansharpened image, we rely
    on the **BundleToPerfectSensor** application of OTB.


    ```

    ```bash

    # Perform the pansharpening


    # Go in the folder of the Spot product

    cd ~/amsterdam/

    cd Amsterdam_Netherlands_SPOT7/

    cd PROD_SPOT7_001/VOL_SPOT7_001_A/


    # Execute the OTB application

    # We can set the output encoding to uint8 since inputs encoding is

    # 8 bits.

    otbcli_BundleToPerfectSensor \

    -inp IMG_SPOT7_P_001_A/IMG_SPOT7_P_201409171025192_ORT_1190912101_R1C1.JPG2 \

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 96
  md: '```

    ```bash

    -inxs IMG_SPOT7_MS_001_A/IMG_SPOT7_MS_201409171025192_ORT_1190912101

    _R1C1 .JP2 \\

    -method waves \\

    -out ~/amsterdam/IMG_SPOT7_amsterdam_PMS.tif uint8


    # Go back in the workspace directory

    cd ~/amsterdam/

    ```

    ```


    # ### 12.1.2  Image normalization


    We normalize the pansharpened Spot-7 image between 0 and 1 using the **BandMathX**
    application.


    ```

    ```bash

    # Normalize image between [0,1]

    otbcli_BandMathX \\

    -il "IMG_SPOT7_amsterdam_PMS.tif" \\

    -exp "{im1b1/im1b1Maxi;im1b2/im1b2Maxi;\\

    im1b3/im1b3Maxi;im1b4/im1b4Maxi}" \\

    -out "IMG_SPOT7_amsterdam_PMS_norm.tif"

    ```

    ```


    # ### 12.1.3  Sample selection


    In the following, we will select the center of the patches that we will extract
    in the images, and that will be used as the terrain truth.


    # #### 12.1.3.1  Patch position seeding


    The goal here, is to select only patches that are fully annotated: in our case,
    if a patch has missing building annotations, we remove it from the terrain truth.
    Typically, in the case of buildings, we should avoid terrain truth patches that
    miss buildings that actually exist in Spot-7 patches. In order to select a sufficient
    number of patches for the terrain truth, we adopt a simple strategy consisting
    of selecting patch positions at regular intervals in the images. Since we want
    fully annotated patches, we just keep the positions that are fully included in
    the area covered by the OSM data, in our case the region of interest used in section
    11.3. Our goal is to generate a vector layer containing the locations of the patches
    that will be sampled.


    Here are the steps to select them:


    +   1. Use QGIS to create a vector grid. Select from the menu **Vector > Research
    tools > Create grid** as shown in [figure 12.1].

    +   2. Create a grid with the following properties ([figure 12.2]):

    +      - **Grid type:** *Rectangle*.

    +      - **Horizontal spacing and Vertical spacing:** 96 meters.

    +      - **Grid extent:** select *Use extent from* then use the Spot-7 image layer
    to specify the extent.

    +      - **Name the output vector data** *amsterdam_grid.gpkg*.'
