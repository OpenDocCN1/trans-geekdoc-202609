    # 16.3 More: automate steps with the OTB Python API


    In this section, we provide insight on the use of the Python API of the Orfeo
    ToolBox. This section is, however, optional, and can be skipped since it only
    shows how to automate the steps previously performed to prepare the patches. The
    Python API enables you to connect in-memory OTB applications in preserving the
    so-called streaming mechanism (see 2.1.2). OTB applications can be instantiated
    as Python objects and their parameters can be set using the same key/value identifiers:
    once an OTB application object is instantiated, its parameter values can be set
    using dedicated methods. All parameters that can be set in an OTB application
    are settable in the Python instance (e.g. integer, float or double precision numbers,
    strings, images, images lists, vector data, etc.). Hence, it is quite straightforward
    to implement an entire pipeline that implies multiple OTB applications chained
    together: we instantiate'
