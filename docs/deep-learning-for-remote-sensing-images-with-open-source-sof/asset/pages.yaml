    source{}.patchsize{}\".format(i, dim),\n            64)\n\n\n# The input vector\
    \ data must have an \"id\" field\napp_patches.SetParameterString(\"vec\", params.locations)\n\
    app_patches.SetParameterString(\"field\", \"id\")\napp_patches.ExecuteAndWriteOutput()\n\
    ```\n```"
