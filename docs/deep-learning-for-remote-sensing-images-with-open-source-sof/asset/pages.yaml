- pgno: 57
  md: '# 6


    # Fully Convolutional Neural Network


    In the previous section, we performed pixel-wise classification using a deep convolutional
    neural network. We have performed the inference in patch-based mode, meaning that
    for each output pixel, we have run the model on one small patch of the input image,
    centered on the output pixel position. While this kind of network architecture
    is easy to implement, it is not efficient in terms of processing. Due to patch
    overlap, the data is copied multiple times with different memory alignment (for
    each different patch) and passed to the model. The costliest operations implemented
    in the deep net are the convolutions, which are massively parallel and can be
    implemented so that the intermediate results are reused for other patch processing
    (e.g. intermediate sums, see equations 1.2 and 1.3). However, the patch-based
    mode disables the possible reuse of the intermediate results since they are re-computed
    at each new patch, which is not efficient. We will introduce the Fully Convolutional
    Neural Networks (FCNN, or FCN) that are just CNNs that can process entire image
    regions instead of being limited to small patches.


    # 6.1 Using the existing model as an FCN


    From the constitution of the simple CNN we used in section 5.4, we can notice
    that this model can be used as an FCN. Its properties are summarized as the following:


    +   - **receptive field** (16 × 16 pixels),

    +   - **expression field** (1 × 1 pixel),

    +   - **scale factor** (there is a total of 2 successive pooling operators of
    size 2, meaning that the scale factor is 2 × 2 = 4).


    We can check that they are consistent with operators implemented in the model.
    If we let n be the size of the input image, we can see how the model propagates
    the image region to the output of size m:


    +   1. convolution with 5 × 5 kernel: output size is n − 4,

    +   2. 2x pooling with stride (2,2): output size is (n − 4)/2 = n/2 − 2,'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   3. convolution with 3×3 kernel: output size is (n/2 − 2) − 2 = n/2 − 4,

    +   4. 2x pooling with stride (2,2): output size is (n/2 − 4)/2 = n/4 − 2,

    +   5. convolution with 2×2 kernel: output size is (n/4 − 2) − 1 = n/4 − 3.


    In conclusion, we have m = n/4 − 3, which is quite consistent with the properties
    (receptive field, expression field, spacing factor) of the model: the model produces
    an output of size 1 × 1 from an input image of size 16 × 16. The physical spacing
    of its output pixel is equal to the input pixel spacing divided by 4. Run the
    CNN model with the parameter model.fullyconv to on in order to enable the fully
    convolutional processing.


    ```

    otbcli_TensorflowModelServe \

    -source1.il Sentinel-2_B4328_10m.tif \

    -source1.rfieldx 16 \

    -source1.rfieldy 16 \

    -source1.placeholder "x" \

    -model.dir model1 \

    -model.fullyconv on \

    -output.names "prediction" \

    -output.spcscale 4 \

    -out "classif_model1_fcn.tif?&box=1000:1000:250:250"

    ```


    Open the resulting image in QGIS, and compare with the classification map created
    by the original CNN. Open the Properties > Metadata tab and check that the physical
    spacing of the new map is 4 times greater than the original.


    # 6.2 Pixel-wise fully convolutional model


    A fully convolutional network runs faster than patch based, enough to process
    the full image in reasonable time (to test it, just remove the extended filename
    in the previous command). However, pooling completely destroys the resolution
    of the output (the output image spacing is 4 times greater than the input pixel
    spacing). We can modify our original model a bit to create a pixel-wise fully
    convolutional network which preserves the input image spacing.


    We remove the pooling operators, and add some convolutional layers with unit strides.
    Our goal is to keep the same receptive field and expression field as the previously
    used architecture (this way, we can reuse our image patches that we have generated
    in section 5.2). Figure 6.1 summarizes our new architecture.'
  merge: -1
  img_proc: true
- pgno: 59
  md: "![](img/f70619500c7a30b0babf83918d56ad93_59_0.png)\n\n# **FIGURE 6.1**\n\n\
    The new Fully Convolutional Neural Network. Pooling operators have been removed,\
    \ and convolution operators have been added. Note that there is no stride in convolution,\
    \ preserving the physical spacing in spatial dimensions.\n\nLet’s implement our\
    \ new FCN architecture. We will use the `create_model2.py` Python code provided\
    \ in the resources repository.[^1]\n\n```\n```python\n#\n# Do not forget to add\
    \ the otbtf/python directory to your PYTHONPATH.\n# Else \"tricks\" can’t be imported.\n\
    # In the OTBTF Docker image, tricks.py is located in the following\n# path: /work/otb/otb/Modules/otbtf\n\
    #\n# Works with OTBTF 1.7\n#\nfrom tricks import *\nimport sys\n\nnclasses=6\n\
    \ndef myModel(x):\n\n    # input patches: 16x16x4\n    conv1 = tf.layers.conv2d(inputs=x,\
    \ filters=16, kernel_size=[5,5],\n                             padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv1 out size: 12x12x16\n    conv2 = tf.layers.conv2d(inputs=conv1,\
    \ filters=16, kernel_size=[3,3],\n                             padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv2 out size: 10x10x16\n    conv3 = tf.layers.conv2d(inputs=conv2,\
    \ filters=16, kernel_size=[3,3],\n                             padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv3 out size: 8x8x16\n    conv4 = tf.layers.conv2d(inputs=conv3,\
    \ filters=32, kernel_size=[3,3],\n                             padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv4 out size: 6x6x32\n    conv5 = tf.layers.conv2d(inputs=conv4,\
    \ filters=32, kernel_size=[3,3],\n                             padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv5 out size: 4x4x32\n    conv6 = tf.layers.conv2d(inputs=conv5,\
    \ filters=32, kernel_size=[3,3],\n                             padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv6 out size: 2x2x32\n```\n```\n\n[^1]: https://github.com/remicres/otbtf_tutorials_resources"
