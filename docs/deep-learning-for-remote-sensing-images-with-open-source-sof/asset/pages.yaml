- pgno: 63
  md: "# # Classifiers on deep features\n\nRecent studies have pointed out that using\
    \ the features computed with deep nets in machine learning algorithms like Support\
    \ Vector Machines or Random Forests, offers state-of-the-art results [20, 21,\
    \ 22]. This section provides insight into classification using classic Machine\
    \ Learning techniques on deep learning features. Here, deep learning is used merely\
    \ as feature engineering rather than a sole classifier.\n\n# ## 7.1 Principle\n\
    \nWe will use algorithms that are already implemented in the Orfeo ToolBox with\
    \ features coming from our deep net. The whole workflow is summarized in figure\
    \ 7.1.\n\n![](img/f70619500c7a30b0babf83918d56ad93_63_0.png)\n\n**FIGURE 7.1**\
    \  \nWorkflow for hybrid classification, mixing deep nets with random forest.\n\
    \nIn section 5.3.2, we have described the model guts. In particular, before computing\
    \ the classes pseudo-probability on the last neurons, our model computes a number\
    \ of features, as shown on figure 7.2. This is done by reshaping the output of\
    \ the last convolution operator to a vector of dimension 2: one dimension for\
    \ the batch size, which is not fixed, the other for the components of the features,\
    \ which is fixed (32 elements). In a TensorFlow model, once an operator has a\
    \ name, it is possible to fetch its result during the inference."
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Since the *tf.reshape* operator performing this is named **features**, it is
    possible to use the **TensorflowModelServe** application to produce the *features*
    for an entire image, using the same mechanisms as described in previous sessions.


    ![](img/f70619500c7a30b0babf83918d56ad93_64_0.png)


    **FIGURE 7.2**


    The model outputs the tensor named “*features*.” The output of the dense layer
    composed of 6 neurons is not used. Only “*features*” is computed using the net,
    and the classification is performed using another classifier.


    This enables us to use the **TensorflowModelServe** to produce the *features*
    output tensor for pixels of the image, and the resulting pixels are then used
    as features for training a Random Forest (with the **TrainImageClassifier** application).
    Once the RF rule is produced, it can be used to classify the entire image from
    the deep features computed on each pixel.


    # 7.2  Overview of composite applications in OTB


    In OTB, composite applications are multiple applications connected together. Typically,
    one application input can come from another application output, instead of being
    read from file. The major benefit is that temporary file read and write are avoided,
    which (i) saves some disk space, and (ii) helps in reducing processing time when
    I/O is a bottleneck. Presented in section 2.1.2, the streaming mechanism enables
    the processing of large images, in splitting the requested parts of the images
    into multiple regions. Composite applications that involve applications with streaming
    support, also benefit from this mechanism.


    In OTBTF there are currently two composite applications.


    +   - **TrainClassifierFromDeepFeatures**, which reuses our model serving application
    (**TensorflowModelServe**) as input of the *TrainImagesClassifier* to train a
    machine learning algorithm based on the features of the deep net given in the
    first application.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "+   - **ImageClassifierFromDeepFeatures** uses **TensorflowModelServe** as\
    \ input of the **ImagesClassifier** application to classify the input image.\n\
    \n> > **Important note**  \n> > Since the classifier is based on the features\
    \ computed from the network, the deep net used in **ImageClassifierFromDeepFeatures**\
    \ must be the same as the deep net used in **TrainClassifierFromDeepFeatures**\
    \ to generate the classification rule! If not, the classifier would perform the\
    \ image classification task using the feature vectors coming from the wrong model,\
    \ and the classification would be irrelevant.\n\n# 7.3  Training\n\nThis exercise\
    \ will require a slightly more important amount of computing power, because the\
    \ whole input image will be processed with the deep net twice. The first time:\
    \ for the classifier training (using the **TrainClassifier-FromDeepFeatures**\
    \ application). The second time: during the classification map generation (using\
    \ the **ImageClassifierFromDeepFeatures** application).\n\n> > **Important note**\
    \  \n> > This processing lasts approximately **3 minutes** on a i7 Intel(R) Xeon(R)\
    \ with CPU E5-1650 @ 3.20 GHz with 16 GB RAM. You can adjust the parameters of\
    \ the processing using the *optim* parameter group of the applications, using\
    \ the same parameter values as you did in section 6.2. You can do it for **ImageClassifierFromDeepFeatures**.\
    \ However, computations of **TrainClassifierFromDeepFeatures** are mainly controlled\
    \ by the *ram* parameter, which determines the requested region using an internal\
    \ streaming mechanism based on the tile hint of the images. It is thus advised\
    \ to set a small value for the *ram* parameter in this application, to avoid memory\
    \ allocation issues.\n\nFor the training, you can also set the *io.confmatout*\
    \ parameter to 1, to produce an output confusion matrix.\n\n```\notbcli_TrainClassifierFromDeepFeatures\
    \ \\\\\n--source1.il Sentinel-2_B4328_10m.tif \\\\\n--source1.rfield 16 \\\\\n\
    --source1.rfiel dy 16 \\\\\n--source1.placeholder \"x\" \\\\\n--model.dir model2\
    \ \\\\\n--model.fullyconv on \\\\\n--output.names \"features\" \\\\\n```"
