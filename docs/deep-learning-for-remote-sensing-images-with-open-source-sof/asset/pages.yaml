    --valid_s2_t patches_valid_s2_2019-07-25.tif \\

    --valid_s2_t_after patches_valid_s2_2019-08-24.tif \\

    --save_ckpt mymodel_checkpoint

    ```

    ```


    The program will execute and achieve the following actions:


    +   1. Load the input patch images.

    +   2. For each epoch:

    +      (a) Perform the gradient descent over the dataset.

    +      (b) Assess the model error (in terms of L1 and L2 losses).

    +      (c) Save the model weights into a *checkpoint* file.


    # 17.4  Export the model


    Once all epochs are completed, we can export a *SavedModel* from the last *checkpoint*
    created during the training. Note that a better approach could be to export the
    best model trained among the last epochs, or as soon as the model over-fit the
    training data (there are multiple strategies, and we do not intend'
