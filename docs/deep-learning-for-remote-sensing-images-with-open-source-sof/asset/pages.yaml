    \ (Spectral band 5, 6, 7, 8a, 11 and 12). This model processes the two inputs\
    \ jointly and outputs a land cover map at the lowest resolution, i.e. 20-m-spacing.\
    \ The 20-m-spacing image patches have a size of 8 × 8 and the 10-m-spacing image\
    \ a size of 16 × 16. Note that we could have different patch sizes, but we want\
    \ our model inputs to be the same physical area in both resolutions. *Figure 8.1*\
    \ summarizes the implemented deep net."
