  md: '+   - **training.source2.il** is the input image filename

    +   - **training.source2.patchsizex** is the label width

    +   - **training.source2.patchsizey** is the label height

    +   - **training.source2.placeholder** is the name of the placeholder for the
    label patches


    +   - **model.dir** is the directory containing the TensorFlow *SavedModel*

    +   - **training.targetnodes** is the name of the operator that computes the gradient
    descent in the training step. In our model, the gradient descent is performed
    with the adam optimizer called **“optimizer.”**

    +   - **validation.mode** is the validation mode. The **“class”** validation mode
    enables the computation of classification metrics for both training data and validation
    data.

    +   - **validation.source1** is the patch source (for validation). As the name
    of the source for validation (**validation.source1.name**) is the same as the
    placeholder name of the same source for training (**training.source1.placeholder**),
    this source is considered as an input of the model, and is fed to the corresponding
    placeholder during the validation step.

    +   - **validation.source2** is the label source (for validation). As the name
    of the source (**validation.source2.name**) is different than the placeholder
    name of the same source for training (**training.source2.placeholder**), this
    source is considered as a reference to be compared to the output of the model
    that has the same tensor name during the validation step.

    +   - **model.saveto** enables us to export the model variables (i.e. weights)
    to a file.


    The command line corresponding to the above description is the following:


