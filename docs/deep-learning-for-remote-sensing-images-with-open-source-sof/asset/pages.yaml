    Computation of classification metrics, performed separately on the training dataset
    and validation dataset.


    The application parameters are the following:


    +   - **training.source1** is the parameter group for the first source, i.e. image
    patches (for learning)

    +     - **training.source1.il** is the input image filename

    +     - **training.source1.patchsizex** is the patch width

    +     - **training.source1.patchsizey** is the patch height

    +     - **training.source1.placeholder** is the name of the placeholder for the
    image patches

    +   - **training.source2** is the parameter group for the second source, i.e.
    label patches (for learning)'
