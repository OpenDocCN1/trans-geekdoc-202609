    \ 16 \\\n--source1.placeholder \"x\" \\\n--model.dir model2 \\\n--model.fullyconv\
    \ on \\\n--output.names \"prediction\" \\\n--optim.tilesizex 999999 \\\n--optim.tilesizey\
    \ 128 \\\n--out classif_model2_full.tif uint8\n```\n```\n\nThe processing of the\
    \ entire image lasts approximately **80 seconds** on an i7 Intel(R) Xeon(R) with\
