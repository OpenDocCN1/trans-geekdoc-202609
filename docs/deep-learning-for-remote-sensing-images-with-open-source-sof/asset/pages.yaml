- pgno: 145
  md: '# # 17 Model training


    This section addresses model training. We will follow the following steps to get
    our model trained and ready, in order to perform gapfilling:


    +   1. Download the code of the implementation from the author’s repository.

    +   2. Use the code to train the model. Model weights will be saved in *checkpoint*
    files.

    +   3. Export a trained **SavedModel** from an existing *checkpoint*.

    +   4. Use the **SavedModel** with the OTBT **TensorflowModelServe** application
    to perform the optical image restoration.


    # ## 17.1 Training from Python


    Many practitioners like to have full control of their training process, and will
    prefer the TensorFlow Python API rather than using the **TensorflowModelTrain**
    application. Indeed, **TensorflowModelTrain** hides the complexity of the training
    and provides the user an easy interface to train models on their geospatial data,
    but with a drastically simplified training approach. However, this user-friendliness
    comes with the cost of over-simplifying the process, which can be frustrating
    for deep learning experts and people that would prefer a more customized approach
    to train their models. In this section, we show that experts can still train their
    models from their own Python code, and apply the trained model using OTBT. The
    *deep-gapfill* code illustrates this in providing the build and training of a
    deep learning architecture in pure Python. The resulting model can be exported
    as a TensorFlow **SavedModel** and used with the **TensorflowModelServe** application
    to generate the gap-filled image.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 17.2 Get the code


    First, download the Python code of the implementation described in section 14.3.
    You can clone the source code from the author''s github account (*deep-gapfill*
    repository¹) or directly download the archive of the code.² The *deep-gapfill*
    code enables you to directly train the model.


    # 17.3 Use the code


    # 17.3.1 Description


    From your command line interface, navigate to the folder where you have downloaded
    *deep-gapfill*. You should have a *model.py* file that you will launch with Python:


    ```

    python model.py

    ```


    The application should display the help function. From the displayed description,
    you should be able to identify the important inputs and parameters that will be
    used to train the model:


    +   1. **s1_t**, **s2_t**, **s2_t_before** and **s2_t_after** are the paths to
    the input patch images for training, respectively, for $S1_t$, $S2_t$, $S2_{t-1}$
    and $S2_{t+1}$.

    +   2. **valid_s1_t**, **valid_s2_t**, **valid_s2_t_before** and **valid_s2_t_after**
    are the paths to the input patch images for validation, respectively, for $S1_t$,
    $S2_t$, $S2_{t-1}$ and $S2_{t+1}$.

    +   3. **save_ckpt** is the parameter for the output prefix of *checkpoint* files,
    that are used by TensorFlow to save the model weights on disk.


    You can notice that the inputs for $S1_t$ are not mandatory: when **s1_t** and
    **valid_s1_t**, aren''t provided, the model will be built without the SAR encoder
    branch. This ablation feature enables you to compare how the model behaves with
    or without the SAR information.


    # 17.3.2 Parameters


    The table 17.1 summarizes the parameter values that will be used to run the training:'
  merge: -1
  img_proc: true
