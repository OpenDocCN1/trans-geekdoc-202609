- pgno: 15
  md: '# 1


    # Deep learning background


    In this section, we provide the essential principles of deep learning. After reading
    this chapter, one should have the required theoretical basis to understand what
    is involved in processing geospatial data in the rest of the book.


    # 1.1 What is deep learning?


    Deep learning is becoming increasingly important to solve a number of image processing
    tasks [1]. Among common algorithms, Convolutional Neural Network- and Recurrent
    Neural Network-based systems achieve state-of-the-art results on satellite and
    aerial imagery in many applications. For instance, synthetic aperture radar (SAR)
    interpretation with target recognition [2], classification of SAR time series
    [3], parameter inversion [4], hyperspectral image classification [5], anomaly
    detection [6], very-high-resolution image interpretation with scene classification
    [7, 8], object detection [9], image retrieval [10], and classification from time
    series [11]. Deep learning has addressed other issues in remote sensing, like
    data fusion (see [12] for a review) e.g. multi-modal classification [13], pansharpening
    [14], and 3D reconstruction.


    Deep learning refers to artificial neural networks with deep neuronal layers (i.e.
    a lot of layers). Artificial neurons and edges have parameters that adjust as
    learning proceeds. Inspired from biology, an artificial neuron is a mathematical
    function modeling a neuron. Neuron parameters (sometimes called weights) are values
    that are optimized during the training step. Equation 1.1 provides an example
    of a basic artificial neuron model. In this equation, X is the input, y the output,
    A the values for the gains, b is the offset value, and f is the activation function.
    In this minimal example, the parameters of the artificial neuron are gains and
    one offset value. Gains compute the scalar product with the input of the neuron,
    and the offset is added to the scalar product. The resulting value is passed into
    a non-linear function, frequently called the activation function.


    y = f(AX + b) = f[∑ᵢ (aᵢ × xᵢ) + b] (1.1)'
  merge: -1
  img_proc: true
