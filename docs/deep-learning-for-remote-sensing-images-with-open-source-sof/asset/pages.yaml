- pgno: 106
  md: "As can be noticed, we use convolutions and transposed convolutions which retain\
    \ the size of the output features (*padding=\"same\"*), meaning that zero padding\
    \ is used in convolutions. We should understand that we can’t use the features\
    \ computed in the last layer directly, if we want to use this model in fully convolutional\
    \ mode: for each processed block, only a subset would be exact, meaning similar,\
    \ regardless of the input region. Using the output would produce some blocking\
    \ artifacts caused by the zero padding in the convolutions.\n\n# ### 12.2.2.1\
    \  Exact output\n\nTo cope with that, we create an output dedicated to the computation\
    \ of the *exact* part of the *prediction* output tensor. For this, we simply remove\
    \ a few pixels from the borders of the output since the convolutions “pollute”\
    \ the borders at each layer, as illustrated in [figure 12.10](#figure-12-10).\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_106_0.png)\n\n**FIGURE 12.10**  \n\
    At each layer, the feature maps are contaminated by the zero padding of the convolutions.\
    \ Blocks with orange borders: features; blocks filled in orange: valid parts of\
    \ feature maps. The *exact* part of the final output feature map is its center\
    \ area.\n\n[Table 12.1](#table-12-1) shows how to compute the number of pixels\
    \ to remove from the border of the last feature map (the *prediction* output tensor).\
    \ At each layer, convolution contaminates the feature map due to padding. We can\
    \ calculate the central part of the feature maps, which is *exact*, i.e. not contaminated\
    \ by padding. As all convolution kernels are of size 3, it’s easy to compute the\
    \ number of pixels that should be clipped at the end. For instance: Level 1, convolution\
    \ output is 32 (input is 64, and we use convolutions with stride 2) but as our\
    \ kernel is 3 × 3, the actual valid part of the output feature map has a size\
    \ of 31 × 31."
  merge: -1
  img_proc: true
- pgno: 107
  md: "# TABLE 12.1\n\nValid part of the convolution outputs (namely feature maps)\n\
    \n| Level | Feature size | Valid part |\n|---|---:|---:|\n| / | 64 | 64 |\n| 1\
    \ | 32 | 31 |\n| 2 | 16 | 15 |\n| 3 | 8 | 7 |\n| 4 | 4 | 3 |\n| 1 | 8 | 5 |\n\
    | 2 | 16 | 9 |\n| 3 | 32 | 17 |\n| 4 | 64 | 33 |\n\nAs shown in [table 12.1],\
    \ the valid part of the final feature map has a size 33 × 33 elements. We then\
    \ remove 16 elements from the borders to output a valid tensor of 32 × 32 elements.\n\
    \n# 12.2.2.2   Expression field\n\nIn OTBTF the spatial part that the model outputs\
    \ for the tensors specified in the **output.names** is called the *expression\
    \ field*. As explained, the model transforms an elementary input image of size\
    \ 64 × 64 into an elementary output predicted label image of size 32 × 32. Hence,\
    \ later we will use a receptive field of 64 × 64 (the input volume that the network\
    \ “sees”) and an expression field of 32 × 32 (the output volume that the network\
    \ “fills”).\n\n# 12.2.3   Generate the SavedModel\n\nTo generate the model, use\
    \ the `create_model4.py` Python script.\n\n```\n```bash\n# Generate the model\n\
    \n# The \"create_model4.py\" file can be downloaded from:\n# https://github.com/remipierre/otbtf_tutorials_resources.git\n\
    python3 ~/python/create_model4.py \"model4\"\n```\n```\n\n> **Important note**\n\
    > \n> As you can note, we carefully set 4 dimensions for the output tensors that\
    \ will be used in the OTBTF applications. Currently, OTBTF interprets the last\
    \ dimension of an output tensor as the number of components of the output image.\
    \ That is why we use `tf.expand_dims()` to make the *prediction* output tensor\
    \ with a last dimension of size 1."
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 12.3  Training the model


    Train the model with the **TensorflowModelTrain** application:


    ```

    # Since the TensorflowModelTrain uses n+1 sources

    export OTB_TF_NSOURCES=1


    # Train the deep learning model

    otbcli_TensorflowModelTrain \

    -training.source1.il amsterdam_Spot7_patches_A.tif \

    -training.source1.patchsize 64 \

    -training.source1.patchsizey 64 \

    -training.source1.placeholder "x" \

    -training.source2.il amsterdam_labelimage_patches_A.tif \

    -training.source2.patchsize 64 \

    -training.source2.patchsizey 64 \

    -training.source2.placeholder "y" \

    -model.dir model4 \

    -training.targetnodes optimizer \

    -validation.mode "class" \

    -validation.source1.il amsterdam_Spot7_patches_B.tif \

    -validation.source1.name "x" \

    -validation.source2.il amsterdam_labelimage_patches_B.tif \

    -validation.source2.name "prediction" \

    -model.saveto model4/variables/variables

    ```


    # 12.4  Inference


    As explained in section 12.2.1, we set an input receptive field of size 64×64
    and an output expression field of size 32×32. We ask the **TensorflowModelServe**
    application to produce, in fully convolutional mode, the *prediction_fcn* output
    tensor of the model.


    Let’s run the model over a subset image:


    ```

    # Produce the map

    otbcli_TensorflowModelServe \

    -source1.il IMG_SPOT7_amsterdam_PMS_norm.tif \

    -source1.rfieldx 64 \

    -source1.rfieldy 64 \

    -source1.placeholder "x" \

    -model.dir model4 \

    -model.fullyconv on \

    -output.efieldx 32 \

    -output.efieldy 32 \

    -output.names "prediction_fcn" \

    -out "classif_model4.tif?&box=6000:4000:2000:2000" uint8

    ```'
