  img_proc: true
- pgno: 141
  md: "![](img/f70619500c7a30b0babf83918d56ad93_141_0.png)\n\n**FIGURE 16.14**  \n\
    The pipeline implemented in the Python program. The following applications of\
    \ the OrfeoToolBox are chained together: **BandMathX, SARCalibration, Superimpose,\
    \ and PatchesExtraction.**\n\napplications, set their parameters, and connect\
    \ them together in the desired fashion. After the pipeline is set, one can trigger\
    \ its execution to generate the outputs.\n\n# 16.3.1  Build the pipeline\n\nThe\
    \ following Python program automates the pre-processing steps that we saw in this\
    \ section, apart from the operations performed in QGIS. It consists of chaining\
    \ together the OTB applications used, from input image calibration and normalization,\
    \ to the generation of patches. Figure 16.14 illustrates the pipeline implemented\
    \ in the Python program. The source code follows.\n\n```\n```python\nimport os\n\
    import argparse\nimport otbApplication\n\nparser = argparse.ArgumentParser()\n\
    \n# Input lists of the 10m Sentinel-2 bands (B4, B3, B2 and B8)\nparser.add_argument('--img_list_s2_before',required=True,nargs='+',\n\
    \        default=[])\nparser.add_argument('--img_list_s2_t',required=True,nargs='+',\n\
    \        default=[])\nparser.add_argument('--img_list_s2_after',required=True,nargs='+',\n\
    \        default=[])\n```\n```"
  merge: -1
  img_proc: true
- pgno: 142
  md: "```\n# Input SAR images\nparser.add_argument('--img_s1_t_vh', required=True)\n\
    parser.add_argument('--img_s1_t_vv', required=True)\n\n# Input vector data\nparser.add_argument('--locations',\
    \ required=True)\n\n# Output patches\nparser.add_argument('--out_patches_s2_before',\
    \ required=True)\nparser.add_argument('--out_patches_s2_t', required=True)\nparser.add_argument('--out_patches_s2_after',\
    \ required=True)\nparser.add_argument('--out_patches_s1_t', required=True)\n\n\
    params = parser.parse_args()\n\ndef normalize_s2(s2_img_list):\n    \"\"\" This\
    \ function returns an instance of an OTB application that\n    concatenate and\
    \ normalize the input images\n    \"\"\"\n    newApp = otbApplication.Registry.CreateApplication(\"\
    BandMathX\")\n    newApp.SetParameterStringList(\"il\", s2_img_list)\n    newApp.SetParameterString(\"\
    exp\", \"{{a}*im1b1;{a}*im2b1;{a}*im3b1;{a}*im4b1}}\".format(a=\"0.00012207\"\
    ))\n    newApp.Execute()\n    return newApp\n\n\"\"\" Prepare the Sentinel-2 images\
    \ \"\"\"\n\napp_s2_norm_1 = normalize_s2(params.img_list_s2_before)\napp_s2_norm_2\
    \ = normalize_s2(params.img_list_s2_t)\napp_s2_norm_3 = normalize_s2(params.img_list_s2_after)\n\
    \n\"\"\" Prepare the Sentinel-1 image \"\"\"\n\n# 1. SAR Calibration\napp_s1_vh\
    \ = otbApplication.Registry.CreateApplication(\"SARCalibration\")\napp_s1_vh.SetParameterString(\"\
    in\", params.img_s1_t_vh)\napp_s1_vh.Execute()\napp_s1_vv = otbApplication.Registry.CreateApplication(\"\
    SARCalibration\")\napp_s1_vv.SetParameterString(\"in\", params.img_s1_t_vv)\n\
    app_s1_vv.Execute()\n\n# 2. Clip in dB scale\napp_s1_vhvv_dB = otbApplication.Registry.CreateApplication(\"\
    BandMathX\")\napp_s1_vhvv_dB.AddImageToParameterInputImageList(\"il\",\n    app_s1_vh.GetParameterOutputImage(\"\
    out\"))\napp_s1_vhvv_dB.AddImageToParameterInputImageList(\"il\",\n    app_s1_vv.GetParameterOutputImage(\"\
    out\"))\napp_s1_vhvv_dB.SetParameterString(\"exp\",\n    \"vlog({min(max(im1b1,0.00001),1);min(max(im2b1,0.00001),1)})\"\
    )\napp_s1_vhvv_dB.Execute()\n\n# 3. Normalize between [-1, 0]\napp_s1_vhvv_dB_norm\
    \ = otbApplication.Registry.CreateApplication\n```"
  merge: -1
  img_proc: true
- pgno: 143
  md: "```\n```python\n(\"BandMathX\")\napp_s1_vhvv_dB_norm.AddImageToParameterInputImageList(\"\
    il\",\n    app_s1_vhvv_dB.GetParameterOutputImage(\"out\"))\napp_s1_vhvv_dB_norm.SetParameterString(\"\
    exp\",\n    \"{im1b1/im1b1Mini;im1b2/im1b2Mini}\")\napp_s1_vhvv_dB_norm.Execute()\n\
