- pgno: 17
  md: '# 1.2 Convolution


    Equation 1.2 shows how the result Y of a convolution with kernel K on input X
    is computed in dimension two (x and y are pixel coordinates). In this equation,
    Y and K are 2-dimensional matrices of real-valued numbers.


    $Y(x,y) = (X * K)(x,y) = \sum_{i} \sum_{j} X(x - i, y - j) \times K(i,j) \quad
    (1.2)$


    Because of the nature of the convolution, one CNN layer is composed of neurons
    with edges that are massively shared with the input: it can be assimilated to
    a small densely connected neural layer that performs the whole input locally (i.e.
    with connections to input restricted to a neighborhood of neurons). Generally,
    CNN layers are combined with non-linear activation functions and pooling operators.
    The convolution can be performed every Nth step in x and y dimensions: this is
    usually called the stride. The output of a convolution involving strides is described
    in equation 1.3, where $s_x$ and $s_y$ are the stride values in each dimension.


    $Y(x,y) = (X * K)(x,y) = \sum_{i} \sum_{j} X(x \times s_x - i, y \times s_y -
    j) \times K(i,j) \quad (1.3)$


    A convolution can be performed keeping the valid portion of the output, meaning
    that only the values of Y that are computed from every value of K over X are kept.
    In this case, the resulting output has a lower size than the input. It can also
    be performed over a padded input: zeros are added all around the input so that
    the output is computed at each location, even where the kernel doesn’t lay entirely
    inside the input. This is generally used to keep the input size through the convolution.
    However, the borders of the output are affected by the zeros of the padding. Figure
    1.2 shows how the stride and padding of the convolution affect the output size
    (the number of rows and columns of the resulting image) and the physical spacing
    (the physical size of the output pixel).'
  merge: -1
  img_proc: true
- pgno: 18
  md: "![](img/f70619500c7a30b0babf83918d56ad93_18_0.png)\n\n**FIGURE 1.2**  \nLeft:\
    \ no padding, stride=2, **Center:** padding, stride=2, **Right:** padding, stride=1.\
    \ The output is the upside, white matrix, and the input is the blue matrix at\
    \ the bottom. The output **size** depends on the following parameters of the convolution:\
    \ padding, kernel size, and stride. The output **physical spacing** is changed\
    \ accordingly to the stride in the convolution: *n* strides ensure that physical\
    \ spacing is scaled by *n*.\n\n> **Important note**\n> \n> - Non-unitary strides\
    \ modify the output physical spacing.\n> - Without padding, the output size is\
    \ changed, depending on the kernel size.\n> - With padding, the output size can\
    \ be kept (same as the input, if no stride) but values at the border might be\
    \ contaminated by the zero padding.\n\n# 1.3  Pooling\n\nAnother important concept\
    \ of CNNs is pooling, which is a form of non-linear downsampling. Several non-linear\
    \ functions can be implemented in pooling operations, among which max pooling\
    \ is the most common: it partitions the input image and for each sub-region, outputs\
    \ the maximum ref to figure 1.3. The intuition is that the exact location of a\
    \ feature is less important than its rough location relative to other features.\
    \ The pooling layer aims to progressively reduce the spatial size of the representation,\
    \ to reduce the number of parameters and amount of computation in the network,\
    \ and hence to also control overfitting. It is common to periodically insert a\
    \ pooling layer between successive convolutional layers in a CNN architecture.\
    \ The pooling operation"
  merge: -1
  img_proc: true
- pgno: 19
  md: "provides another form of translation invariance. The pooling layer operates\
    \ independently on every depth slice of the input and resizes it spatially. Like\
    \ convolution with non-unitary stride, the pooling operators also modify the output\
    \ size.\n\n![](img/f70619500c7a30b0babf83918d56ad93_19_0.png)\n\n# FIGURE 1.3\n\
    \n2 × 2 max pooling with stride 2. Each 2 × 2 sub-region of the image, the maximum\
    \ value is kept.\n\n> **Important note**\n> Pooling, and convolutions with stride,\
    \ can be viewed as a subsampling process, which does modify the output size, and\
    \ the output physical spacing. Depending on the implementation, it can also keep\
    \ partially sampled items at borders.\n\n# 1.4 Activation functions\n\nInspired\
    \ from biology, the activation functions are usually an abstraction representing\
    \ the way a neuron will be activated (i.e. it will transmit its output value)\
    \ or not. Basically, the activation functions control the amount of what is actually\
    \ transmitted to output. There are many activation functions used in deep learning.\
    \ Among these, we can enumerate the following, which are common ones we will use\
    \ during this tutorial:\n\n+   1. The rectified linear unit returns a maximum\
    \ value between 0 and x:\n+   \n+      $$f(x) = max(0, x)$$<|message|>\n+   2.\
    \ A leaky rectified linear unit allows a small, positive gradient when the unit\
    \ is not active. It is parametrized with α, a scalar value:\n+   \n+      $$f(x)\
    \ = \\begin{cases} x & \\text{if } x > 0, \\\\ \\alpha x & \\text{otherwise,}\
    \ \\end{cases}$$ \n+   3. Sigmoid:\n+   \n+      $$f(x) = \\frac{1}{1 + e^{-x}}$$"
  merge: -1
  img_proc: true
- pgno: 20
  md: "+   4. Hyperbolic tangent (Tanh), which is a shift-scaled sigmoid ($\\tanh(x)\
    \ = 2 \\times \\operatorname{sigmoid}(2x) - 1$):\n+   \n+   $$f(x) = \\frac{e^x\
    \ - e^{-x}}{e^x + e^{-x}}$$\n\n# ### 1.5 Challenges ahead for deep learning with\
    \ remote sensing images\n\nThere are still challenges remaining ahead to process\
    \ real-world remote sensing images with deep learning. One crucial point is software\
    \ implementation. Entering into deep learning requires familiarity with a framework.\
    \ Implementing new methods requires an extensive programming background and deep\
    \ learning knowledge. The tools must scale enough to the huge size of real-world\
    \ remote sensing images and datasets. In particular, the image size problem is\
    \ out of deep learning frameworks scope. In computed vision, popular problems\
    \ and datasets are often related to small-sized and true-color images. Many deep\
    \ learning architectures must be redesigned to suit remote sensing images. Another\
    \ point is that algorithms presented in the literature often serve one unique\
    \ purpose and each new algorithm implementation requires new effort and expertise\
    \ to be applied on standardized geospatial data. Additionally, recent studies\
    \ have pointed out that using the features computed with deep nets in machine\
    \ learning algorithms like Support Vector Machines or Random Forests, offers great\
    \ opportunities. However, even if most remote sensing image processing software\
    \ implement a machine learning framework with such algorithms, only a few of them\
    \ enable the combination of deep learning algorithms with those already implemented\
    \ well-known machine learning algorithms.\n\nIn the next section, we introduce\
    \ the software that leverages all these issues."
  merge: -1
  img_proc: true
