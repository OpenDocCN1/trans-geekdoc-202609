  md: '(training data and validation data), the validation step of the **Tensorflow-ModelTrain**
    application consists of computing the following metrics:


    +   - Confusion matrix

    +   - Overall accuracy index

    +   - Kappa index

    +   - For each class:

    +     - Precision

    +     - Recall

    +     - F-Score


    Depending on the placeholder names of the sources used for training, and the names
    of the sources used for evaluation, the application to detect which source is
    used as input of the model, or as a baseline to compute evaluation metrics, is
    explained in figure 5.3.


    ![](img/f70619500c7a30b0babf83918d56ad93_50_0.png)


