- pgno: 9
  md: '# Preface


    The volume of earth observation data has increased in recent years, and more and
    more remote sensing imagery is available today. On one hand, the amount of remote
    sensing data is constantly growing due to the rise of very-high-resolution sensors
    and short repeat cycle satellites. Thanks to programs like Landsat or Sentinel,
    many free imagery products are available. In addition, community-based geographic
    information gathering systems are expanding each in existing geospatial data bases:
    the OpenStreetMap initiative is a well-known example. Regarding this amount of
    geospatial data, tackling complexity in earth observation information extraction
    is rising as a major and exciting challenge.


    Deep learning is a growing trend in big data analysis, and had a breakthrough
    impact in the last few years on such diverse domains as image analysis, speech
    recognition, autonomous cars, or the arts. Convolutional Neural Networks are designed
    to extract features in images, enabling image recognition, object detection, and
    semantic segmentation. Recurrent Neural Networks are suited for sequential data
    analysis, such as speech recognition and action recognition tasks. As for numerous
    fields, the deep learning revolution has impacted the remote sensing sector. In
    recent years, a number of studies have shown that remote sensing benefits strongly
    from these new approaches, thanks to the availability of data and computing resources.
    Deep learning allows researchers and engineers in remote sensing to move beyond
    usual approaches and tackle a number of problems with solid results. Various remote
    sensing problems have been successfully addressed with deep learning: classification,
    segmentation, object detection, image restoration, image enhancement, etc. Deep
    learning has proven to be pertinent in many kinds of remote sensing imagery: synthetic
    aperture radar, hyperspectral imagery, very-high-resolution images, time series,
    etc.


    A lot of the literature explains deep learning theory, but this book rather focuses
    on its technical application on satellite imagery. The core of this work teaches
    how to apply deep learning techniques to real-world remote sensing images using
    existing, open-source tools like QGIS, TensorFlow and Orfeo ToolBox. The generation
    of land cover maps from large satellite images will be the central topic. However,
    perspectives of applying deep learning to various earth observation sensors for
    a number of purposes are open, and we will show that deep learning applies not
    only to image classification, but also to image restoration from multimodal imagery.'
  merge: -1
  img_proc: true
- pgno: 10
  md: After a short summary of deep learning background, the book will introduce the
    common steps to extract samples from remote sensing images, create and train deep
    networks, and use them to generate output images, e.g. land cover maps. Various
    approaches and deep network architectures will be introduced in different parts
    of the book. For each of them, all steps enabling the reader to perform the processing
    of data will be detailed. We provide an online repository containing the ancillary
    data and sharing code snippets used in the exercises. The software involved in
    this tutorial are open-source, and instructions to install them are provided.
