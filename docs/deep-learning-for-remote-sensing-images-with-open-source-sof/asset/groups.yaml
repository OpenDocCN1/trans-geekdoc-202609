  - '[PAGE 81]


    # 10


    *Semantic segmentation of optical imagery*


    # 10.1  Introduction


    This section presents an approach to perform semantic segmentation on very-high-resolution
    remote sensing images using a deep convolutional neural network. In part II, we
    introduced a patch-based classification approach, that is suited to sparsely annotated
    data. However, this kind of approach is limited in term of semantic precision
    in spatial location. Indeed, a patch-based network is designed to attribute one
    single class to an input patch, and does not make use of the context of the actual
    classes labels, namely the terrain truth. On the contrary, semantic segmentation
    methods, also known as *dense prediction*, use the semantic spatial context. These
    approaches train networks estimating the semantic of patches of pixels, rather
    than just a single pixel. Semantic segmentation methods allow us to tackle the
    spatial precision of the classification. However, the training of networks requires
    densely annotated terrain truth. In this section, we will introduce a semantic
    segmentation approach, and use OpenStreetMap data over the city of Amsterdam to
    generate the map of buildings from a Spot image (1.5-m resolution).


    # 10.2  Overview


    The goal of semantic image segmentation is to label each pixel of an image with
    a corresponding class. The main difference with pixel classification, as performed
    in the previous sections, is that the classes are estimated for every pixel in
    an entire region of an image, rather than one pixel by one pixel (fig. 10.1).
    That is why semantic segmentation is also referred as dense prediction.'
  - '[PAGE 82]


    ![](img/f70619500c7a30b0babf83918d56ad93_82_0.png)


    # FIGURE 10.1


    Semantic segmentation is understanding an image at pixel level. The output is
    an image of labels that annotate the image content: here the output of the semantic
    segmentation is a label image annotating the following 3 classes: human, bike
    and background. *Source: VOC2012.*


    As for image classification, CNNs are very successful on segmentation problems.
    First approaches using artificial neural networks used fully connected layers
    and therefore required fixed size images. Later, FCN CNN architectures for dense
    predictions were usable without any fully connected layers. One of the main problems
    remaining with using CNNs for semantic segmentation is pooling layers. Pooling
    layers increase the field of view and are able to aggregate the context, but as
    we saw in section 6, they remove spatial information. Since semantic segmentation
    requires a precise location of classes, it needs to preserve this spatial information.
    To tackle this problem, many architectures have evolved over the last years. In
    this chapter, we will use one of the first popular architectures based on FCN,
    the U-Net [25]. It is an encoder-decoder architecture. The encoder progressively
    reduces the spatial resolution with strided convolution or pooling layers, increasing
    the feature dimension, and the decoder progressively recovers spatial resolution
    in decreasing feature dimension. Finally, the last feature map is the predicted
    class. Figure 10.2 presents the original U-Net architecture.'
