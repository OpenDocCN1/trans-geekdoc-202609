    At this point you can import in QGIS the three generated images Sentinel2_2019-07-05_10m.tif
    (S2_{t-1}), Sentinel2_2019-07-25_10m.tif (S2_t), and Sentinel2_2019-08-24_10m.tif
    (S2_{t+1}). QGIS will display the images in true colors since the index of the
    red, green and blue channels of the pre-processed Sentinel-2 images are respectively
    1, 2 and 3.


    # 16.1.2 SAR image


    Radar is an active sensor, meaning that it emits a radio wave “illuminating” the
    target (but not in the visible domain) and the echo is received and recorded.
    Synthetic Aperture Radar (SAR) is a kind of radar that generates images using
    the motion of the sensor to simulate a larger antenna, enabling a higher-resolution
    image. The acquisition principle is that the target is viewed multiple times from
    the moving sensor, but with different acquisition angles. SAR processing combines
    these acquisitions and allows us to increase the resolution of the original antenna.
    A few pre-processing steps are required prior to processing SAR images.


    # 16.1.2.1 Calibration


    The first step to prepare the SAR images is the calibration. The calibration ensures
    that the intensity value actually represents the sigma zero (σ₀) value of the
    reflectivity, i.e., the radar cross section normalized to area. We use the SARCalibration
    application of the Orfeo ToolBox to compute the calibrated σ₀ image from the downloaded
    Sentinel-1 product.


    We first generate the calibrated VH image.


    ```

    # SAR calibration

    cd ~/marmande

    cd S1A_IW_GRDH_1SDV_20190725T175553_20190725T175618_028277_0331C8_3C98.SAFE

    cd measurement


    # Calibration of VH channel

    otbcli_SARCalibration \

    -in s1a-iw-grd-vh-20190725t175553-20190725t175618-028277-0331c8-002.tiff \

    -out ~/marmande/sar_vh.tif


    # Go back to workspace

    cd ~/marmande

    ```


    We repeat the same operation to generate the VV image.


    ```

    # SAR calibration

    cd ~/marmande

    cd S1A_IW_GRDH_1SDV_20190725T175553_20190725T175618_028277_0331C8_3C98.SAFE

    cd measurement


    # Calibration of VV channel

    ```'
