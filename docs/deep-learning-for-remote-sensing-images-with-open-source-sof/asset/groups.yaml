    \ In the menu, select **Plugins > Manage and install plugin...**\n- 2. Search\
    \ for *OSM Downloader* as shown in [figure 11.1](#figure-11-1).\n- 3. Click on\
    \ **Install plugin**.\n\n![](img/f70619500c7a30b0babf83918d56ad93_87_0.png)\n\n\
    **FIGURE 11.1**  \nInstall OSM Downloader.\n\nOnce the plugin is installed, one\
    \ can retrieve the OSM data.\n\n### 11.3.2 Download OSM data\n\n- 1. Click on\
    \ **Download OSM data by rectangle selection** ([figure 11.2](#figure-11-2)).\n\
    - 2. Select an area covering the central part of the image ([figure 11.3](#figure-11-3)).\
    \ Do not select an area too large, else the download might fail. A region corresponding\
    \ approximately to half the image is enough.\n- 3. Select an output filename on\
    \ your *amsterdam* directory as *amsterdam.osm*.\n- 4. Tick the box **Load layer\
    \ after download**.\n- 5. Click on **Ok**.\n\n![](img/f70619500c7a30b0babf83918d56ad93_88_0.png)\n\
    \n**FIGURE 11.2**  \nUse the OSM downloader from the QGIS toolbar.\n\n![](img/f70619500c7a30b0babf83918d56ad93_88_1.png)\n\
    \n**FIGURE 11.3**  \nDownload OSM data by rectangle selection.\n\nAfter the download,\
    \ the vector layer must be imported in QGIS. Select the **Multipolygon** layer\
    \ ref to fig 11.4.\n\n![](img/f70619500c7a30b0babf83918d56ad93_89_0.png)\n\n**FIGURE\
    \ 11.4**  \nImport only the multipolygon layer.\n\n### 11.3.3 Prepare the vector\
    \ layer\n\nWe will now export a vector layer for the buildings in the Shapefile\
    \ format from the OSM file.\n\n- 1. Right-click on the imported **multipolygon_layer**\
    \ and select **Open attribute table** (figure 11.5).\n- 2. Click on the **Filter\
    \ by attribute** icon (figure 11.6).\n- 3. Enter the following expression: *length(\"\
    buildings\")>0*, to select only buildings polygons (figure 11.7), then click on\
    \ **Select features**. Then click on the **Close** button.\n- 4. Right-click on\
    \ the **multipolygon_layer** and select **Export > Save selected features as**\
    \ (figure 11.8).\n- 5. Choose a name for your output vector layer: **buildings.gpkg**.\
    \ Select also the same coordinate reference system as the Spot-7 image, **EPSG\
    \ 32631** (figure 11.9).\n\n![](img/f70619500c7a30b0babf83918d56ad93_90_0.png)\n\
    \n**FIGURE 11.5**  \nOpen the attribute table.\n\n![](img/f70619500c7a30b0babf83918d56ad93_90_1.png)\n\
    \n**FIGURE 11.6**  \nClick on the Filter by attribute icon.\n\n![](img/f70619500c7a30b0babf83918d56ad93_91_0.png)\n\
    \n**FIGURE 11.7**  \nSelect buildings polygons.\n\n![](img/f70619500c7a30b0babf83918d56ad93_91_1.png)\n\
    \n**FIGURE 11.8**  \nExport the selected polygons as a new vector layer.\n\n![](img/f70619500c7a30b0babf83918d56ad93_92_0.png)\n\
    \n**FIGURE 11.9**  \nExport the output vector layer.\n\nYou have now prepared\
    \ a vector layer **buildings.gpkg** consisting of polygons that describe in detail\
    \ the buildings of the Amsterdam area (figure 11.10). We will use this vector\
    \ data later as terrain truth to train a deep network to perform the semantic\
    \ segmentation of the buildings.\n"
  mdcn: "\n\n## 第三部分：语义分割\n\n## 10 光学影像的语义分割\n\n### 10.1 引言\n\n本节介绍一种使用深度卷积神经网络对甚高分辨率遥感影像执行语义分割的方法。在第二部分中，我们介绍了一种基于图像块（patch）的分类方法，该方法适用于稀疏标注的数据。然而，这种方法在空间位置的语义精度方面存在局限。实际上，基于图像块的网络被设计为给输入图像块分配一个单一的类别，并没有利用实际类别标签的上下文，即地面真值。相反，语义分割方法（也称为*密集预测*）利用语义空间上下文。这些方法训练网络估计像素块的语义，而不仅仅是单个像素。语义分割方法使我们能够解决分类的空间精度问题。然而，网络的训练需要密集标注的地面真值。在本节中，我们将介绍一种语义分割方法，并利用阿姆斯特丹市的\
    \ OpenStreetMap 数据，从一幅 Spot 图像（1.5 米分辨率）生成建筑物地图。\n\n### 10.2 概述\n\n语义图像分割的目标是为图像中的每个像素标注相应的类别。与前面章节中执行的像素分类的主要区别在于，是对图像整个区域中的每个像素进行类别估计，而不是逐个像素地进行（图\
    \ 10.1）。这就是语义分割也被称为密集预测的原因。\n\n![](img/f70619500c7a30b0babf83918d56ad93_82_0.png)\n\
    \n**图 10.1**\n\n语义分割是在像素级别理解图像。输出是一幅标签图像，用于标注图像内容：这里语义分割的输出是一幅标签图像，标注了以下 3 个类别：人、自行车和背景。*来源：VOC2012。*\n\
    \n与图像分类一样，CNN 在分割问题上也非常成功。早期使用人工神经网络的方法采用全连接层，因此需要固定大小的图像。后来，用于密集预测的 FCN 这类 CNN\
    \ 架构可以在没有任何全连接层的情况下使用。使用 CNN 进行语义分割时仍然存在的一个主要问题是池化层。池化层增加了视野并能够聚合上下文，但正如我们在第 6\
    \ 节中看到的，它们会移除空间信息。由于语义分割需要精确的类别位置，因此必须保留这种空间信息。为了解决这个问题，近年来发展出了许多架构。在本章中，我们将使用最早流行的基于\
    \ FCN 的架构之一——U-Net [25]。它是一种编码器-解码器架构。编码器通过步幅卷积或池化层逐步降低空间分辨率，同时增加特征维度；解码器则通过降低特征维度逐步恢复空间分辨率。最后，最后一个特征图就是预测的类别。图\
    \ 10.2 展示了原始的 U-Net 架构。\n\n## 11 使用的数据：阿姆斯特丹数据集\n\n本节旨在介绍即将进行的实践环节所涉及的数据。我们使用免费获取的数据，称为*阿姆斯特丹*数据集。在接下来的部分中，我们将说明如何下载和准备该数据集，以便为实践环节做好准备。在您的文件系统上创建一个名为\
    \ *amsterdam* 的目录。我们将使用该目录来存储练习期间下载和生成的所有数据。\n\n### 11.1 描述\n\n*阿姆斯特丹*数据集包含一幅覆盖阿姆斯特丹市的甚高分辨率\
    \ Spot-7 图像，以及一个包含建筑物轮廓的矢量图层。在本节中，我们将说明如何下载 Spot-7 图像，并从 OSM 数据生成矢量图层。*阿姆斯特丹*数据集贯穿整个第\
    \ 11 节。请注意，您可以将此练习推广到您手头可用的任何经过正射校正的甚高分辨率遥感影像。\n\n### 11.2 Spot-7 图像\n\nSpot-7\
    \ 产品由一幅多光谱图像（物理间距 6.0 米，波段：红、绿、蓝、近红外）和一个全色波段（物理间距 1.5 米）组成。编码为 12 位。Spot 图像可以从空客防务与航天（Airbus,\
    \ Defense & Space）的示例影像网页上免费下载。[^1] 要下载该产品，请按照以下步骤操作：\n\n- 1. 前往 ADS 示例影像网页。\n\
    - 2. 在搜索字段中输入 *amsterdam*（位于放大镜图标旁）。\n- 3. 点击 *搜索*（Search）按钮。\n\n[^1]: https://www.intelligence-airbusds.com/en/8262-sample-imagery\n\
    \n由作者从资源库^a提供（使用**查找文件**工具搜索 *amsterdam_labelimage.tif* 文件）。\n\n[https://github.com/remicres/otbtf_tutorials_resources](https://github.com/remicres/otbtf_tutorials_resources)\n\
    \n### 11.3.1 OSM 下载器插件\n\nOSM 插件是一个用户友好的工具，允许您下载感兴趣区域内的 OpenStreetMap 数据。\n\n\
    - 1. 在菜单中，选择**插件 > 管理并安装插件...**\n- 2. 搜索 *OSM Downloader*，如[图 11.1](#figure-11-1)所示。\n\
    - 3. 点击**安装插件**。\n\n![](img/f70619500c7a30b0babf83918d56ad93_87_0.png)\n\n**图\
    \ 11.1**  \n安装 OSM 下载器。\n\n插件安装完成后，就可以获取 OSM 数据了。\n\n### 11.3.2 下载 OSM 数据\n\n\
    - 1. 点击**通过矩形选择下载 OSM 数据**（[图 11.2](#figure-11-2)）。\n- 2. 选择一个覆盖图像中心部分的区域（[图 11.3](#figure-11-3)）。不要选择过大的区域，否则下载可能会失败。大约占图像一半的区域就足够了。\n\
    - 3. 在您的 *amsterdam* 目录中选择一个输出文件名，命名为 *amsterdam.osm*。\n- 4. 勾选**下载后加载图层**复选框。\n\
    - 5. 点击**确定**。\n\n![](img/f70619500c7a30b0babf83918d56ad93_88_0.png)\n\n**图 11.2**\
    \  \n从 QGIS 工具栏使用 OSM 下载器。\n\n![](img/f70619500c7a30b0babf83918d56ad93_88_1.png)\n\
    \n**图 11.3**  \n通过矩形选择下载 OSM 数据。\n\n下载完成后，必须在 QGIS 中导入矢量图层。选择 **Multipolygon**\
    \ 图层，参见图 11.4。\n\n![](img/f70619500c7a30b0babf83918d56ad93_89_0.png)\n\n**图 11.4**\
    \  \n仅导入 multipolygon 图层。\n\n### 11.3.3 准备矢量图层\n\n我们现在将从 OSM 文件中以 Shapefile 格式导出建筑物矢量图层。\n\
    \n- 1. 右键点击导入的 **multipolygon_layer**，选择**打开属性表**（图 11.5）。\n- 2. 点击**按属性筛选**图标（图\
    \ 11.6）。\n- 3. 输入以下表达式：*length(\"buildings\")>0*，以仅选择建筑物多边形（图 11.7），然后点击**选择要素**。接着点击**关闭**按钮。\n\
    - 4. 右键点击 **multipolygon_layer**，选择**导出 > 将所选要素另存为**（图 11.8）。\n- 5. 为输出矢量图层选择一个名称：**buildings.gpkg**。同时选择与\
    \ Spot-7 图像相同的坐标参考系，**EPSG 32631**（图 11.9）。\n\n![](img/f70619500c7a30b0babf83918d56ad93_90_0.png)\n\
    \n**图 11.5**  \n打开属性表。\n\n![](img/f70619500c7a30b0babf83918d56ad93_90_1.png)\n\
    \n**图 11.6**  \n点击“按属性筛选”图标。\n\n![](img/f70619500c7a30b0babf83918d56ad93_91_0.png)\n\
    \n**图 11.7**  \n选择建筑物多边形。\n\n![](img/f70619500c7a30b0babf83918d56ad93_91_1.png)\n\
    \n**图 11.8**  \n将选中的多边形导出为新矢量图层。\n\n![](img/f70619500c7a30b0babf83918d56ad93_92_0.png)\n\
    \n**图 11.9**  \n导出输出矢量图层。\n\n现在，您已经准备好一个矢量图层 **buildings.gpkg**，其中包含详细描述阿姆斯特丹地区建筑物的多边形（图\
    \ 11.10）。稍后，我们将使用该矢量数据作为地面真值，训练深度网络来执行建筑物的语义分割。\n\n"
