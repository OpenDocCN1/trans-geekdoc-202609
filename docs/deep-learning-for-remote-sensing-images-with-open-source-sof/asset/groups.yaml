    +   2. *Sentinel2_2019-07-25_holes.gpkg*

    +   3. *Sentinel2_2019-08-24_holes.gpkg*


    Since we want samples that are valid in the four images ($S2_{t-1}$, $S2_t$, $S2_{t+1}$
    and $S1_t$), we need to merge the vector layers of images into a single one that
    indicates where at least one image has missing content. Use QGIS to merge the
