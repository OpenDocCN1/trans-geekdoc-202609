    # ### 11.3.1  OSM downloader plugin


    The OSM plugin is a user-friendly tool that enables you to download OpenStreetMap
    data over a region of interest.


    +   1. In the menu, select **Plugins > Manage and install plugin...**

    +   2. Search for *OSM Downloader* as shown in [figure 11.1](#figure-11-1).

    +   3. Click on **Install plugin**.


    ![](img/f70619500c7a30b0babf83918d56ad93_87_0.png)


    **FIGURE 11.1**

    Install OSM Downloader.


    Once the plugin is installed, one can retrieve the OSM data.


    # ### 11.3.2  Download OSM data


    +   1. Click on **Download OSM data by rectangle selection** ([figure 11.2](#figure-11-2)).

    +   2. Select an area covering the central part of the image ([figure 11.3](#figure-11-3)).
    Do not select an area too large, else the download might fail. A region corresponding
    approximately to half the image is enough.

    +   3. Select an output filename on your *amsterdam* directory as *amsterdam.osm*.

    +   4. Tick the box **Load layer after download**.'
