    -field "class" \

    -outlabels Sentinel-2_B4328_10m_labels_A.tif uint8

    ```


    where:


    - **source1** is the parameter group for the first image source (it cannot be
    set with value, and only contains parameters),

    - **source1.il** is the input image list of the first source,

    - **source1.patchsizex** is the patch width of the first source,

    - **source1.patchsizey** is the patch height of the first source,

    - **source1.out** is the output patches image of the first source,

    - **vec** is the input vector data of the points (samples locations),

    - **field** is the attribute that we will use as the label value (i.e. the class),

    - **outlabels** is the output image for the labels.


    After this step, you should have generated the following output images, that we
    will name “the training dataset”:


    - *Sentinel-2_B4328_10m_patches_A.tif*

    - *Sentinel-2_B4328_10m_labels_A.tif*


    **Visualizing the patches**


    A simple trick enables you to check the extracted patches from QGIS: Simply open
    the patches as a raster, then chose the same coordinate reference system as the
    current project (indicated on the bottom right of the window).


    Repeat the previously described steps for the vector layer *terrain_truth_epsg32654_B_pos.shp*
    and generate the patches and labels for validation.


    ```bash

    otbcli_PatchesExtraction \

    -source1.il Sentinel-2_B4328_10m.tif \

    -source1.patchsizex 16 \

    -source1.patchsizey 16 \

    -source1.out Sentinel-2_B4328_10m_patches_B.tif \

    -vec terrain_truth_epsg32654_B_pos.shp \

    -field "class" \

    -outlabels Sentinel-2_B4328_10m_labels_B.tif uint8

    ```


    After this step, you should have the following data that will be referred as *the
    validation dataset*:


    - *Sentinel-2_B4328_10m_patches_B.tif*

    - *Sentinel-2_B4328_10m_labels_B.tif*


    ## A note on pixel interleave


    To keep things simple, sampled patches are stored in one single big image that
    stacks all patches in rows. There are multiple advantages to this. First, accessing
    one unique big file is more efficient than working on thousands of separate small
    files stored in the file system, or accessing sparsely located patches in large
    images. Secondly, we can visualize/process patches as any image: for instance,
    we can import the big patch image in QGIS and check that our patches look good.
    Thirdly, the interleave of the sampled source is preserved, which guarantees good
    performance during data access.


    ## 5.3 Training


    How do you train a deep net? To begin with something easy, we will train a small
    existing model. We focus on a CNN that inputs our 16 × 16 × 4 patches and produces
    the prediction of an output class among 6 labels ranging from 0 to 5 (see table
    4.2 for class descriptions).


    ### 5.3.1 Principle


    In this section, we supply a short overview of the basic concepts for the training
    of deep learning models. Model training usually involves a gradient descent (in
    the network weights space) of a loss function that typically expresses the gap
    between estimated and reference data. The **batch** size defines the number of
    samples that will be propagated through the network to average the gradient at
    each step. Suppose that we have *N* training samples and we want to use a batch
    size of *n*. During learning, the first *n* samples (from 1 to *n*) will be used
    to train the network. Then, the second *n* samples (from *n* + 1 to 2*n*) will
    be used to train the network again. This procedure is repeated until all samples
    are propagated through the network (this is called one **epoch**). At each step,
    the gradient is computed over the batch, and the network weights are updated accordingly
    to the chosen optimization method.


    Using a batch size that is smaller than the number of samples enables the overall
    training procedure to require less memory, which is useful for a big dataset.
    Also, the network weights are updated after each propagation.


    Depending on the problem, performances can be superior with multiple batches:
    if all samples were used during propagation, it would make only one single update
    for the network’s parameter. However, the smaller the batch, the less accurate
    the estimate of the gradient will be. For each batch, the network weights will
    be updated to minimize the cost function that corresponds to the samples used.
    If the number of samples is too small, the gradient changes its direction very
    often compared to a bigger batch. There is no simple rule for choosing a good
    batch size, since this depends on the network architecture, loss functions to
    minimize, training parameters, data distribution, etc.


    ### 5.3.2 Model architecture


    We propose to introduce a small and simple CNN model to better understand the
    approach. This section describes what is inside this model. An overview is provided
    in [figure 5.2](#figure-52), which summarizes the computational graph of the considered
    architecture.


    ![](img/f70619500c7a30b0babf83918d56ad93_45_0.png)


    **FIGURE 5.2**


    Our first deep net. The network consists of two placeholders (“x” and “lr”), respectively
    used for input patches (4-dimensional array) and learning rate (single scalar),
    one output tensor (“prediction”, one-dimensional array) and one target node (“optimizer”,
    used only for training the net). “#” means that the number of components for the
    first dimension is not fixed.


    #### 5.3.2.1 Input


    The image patches feed the placeholder named **“x”** in the TensorFlow model.
    The first dimension of **“x”** might have any number of components. This dimension
    is usually employed for the batch size, and isn’t fixed to enable the use of different
    batch sizes. For instance, assuming we want to train our model with a batch of
    10 samples, we will feed the model a multidimensional array of size 10 × 16 ×
    16 × 4 in the placeholder **“x”** of size # × 16 × 16 × 4.


    #### 5.3.2.2 Layers


    **“x”** is then processed by a succession of 2D-Convolution/Activation function
    (Rectified linear unit)/Pooling layers. After the last activation function, the
    features are processed by a fully connected layer of 8 neurons (one for each predicted
    class).


    #### 5.3.2.3 Estimated class


    The estimated class is the index of the neuron (from the last neuron layer) that
    output the maximum value. This is performed in processing the outputs of the last
    fully connected layer with the *Argmax* operator, which is named **“prediction”**
    in the graph.


    #### 5.3.2.4 Loss function


    The goal of the training is to minimize the cross entropy between the data distribution
    (real labels) and the model distribution (estimated labels). We use the cross
    entropy of the softmax function of the 6 neurons as the loss function. Basically,
    this function will measure the probability error in the discrete classification
    task in which the classes are mutually exclusive (each entry is in exactly one
    class). For this, the model implements an operation of TensorFlow known as *softmax
    cross entropy with logits*. This function first computes the *softmax* function
    of the 6-neuron outputs. The softmax function normalizes the outputs, such as
    their sum is equal to 1 and can be used to represent a categorical distribution,
    i.e, a probability distribution over *n* different possible outcomes (Equation
    5.1). The Shannon cross entropy between true labels and probability-like values
    from the softmax is then computed (Equation 5.2), and considered as the loss function
    of the deep net.


    $$\sigma(z)_i = \frac{e^{z_i}}{\sum_{k=1}^{n} e^{z_k}} \tag{5.1}$$


    $$H(p,q) = -\sum_x p(x)\log(q(x)) \tag{5.2}$$


    #### 5.3.2.5 Optimizer


    A node called **“optimizer”** performs the gradient descent of the loss function:
    this node is used only to train (or fine tune, if one want to “freeze” certain
    weights) the model. This node is not used at inference time, that is, when the
    model is used (typically, to estimate the classes). The method implemented in
    this operator is called Adam (like Adaptive moment estimation [19]). A placeholder
    named **“lr”** controls the learning rate of the optimizer: it holds a single
    scalar value (floating point) and can have a default value.


    > **Important note**

    >

    > The functions used in our model work on labels that are integers ranging from
    0 to 5 ($N = 6$). The first class number must be 0 to enforce the class numbering
    convention of the TensorFlow functions used in our model.


    ## 5.4 Generate the model


    Now that we understand what is inside this model, we will build it. We construct
    a TensorFlow model using the Python API of TensorFlow. We will use the *create_model1.py*
    Python script provided in the resources repository. You can download the code
    from the link, or clone the repository with Git. Before running the *create_model1.py*
    code with Python, the *PYTHONPATH* environment variable, which enables Python
    to import all the external libraries, must be properly set. The *tricks.py* Python
    code is part of OTBTF and contains a set of useful functions and helpers. In particular,
    the function *CreateSavedModel* enables us to serialize the model into a *SavedModel*
    on the file system. In the OTBTF Docker image, *tricks.py* is located in the */work/otb/otb/Modules/Remote/otbtf/Python/*
    directory. We must add this directory to the *PYTHONPATH* environment variable,
    before running the *create_model1.py* code with Python. The *create_model1.py*
    code is shown as explained below.


    ```python

    #

    # Do not forget to add the otbtf/python directory to your PYTHONPATH.

    # Else "tricks" can''t be imported.

    # In the OTBF Docker image, tricks.py is located in the following

    # path: /work/otb/otb/Modules/otbtf

    #

    # Works with OTBTf 1.7

    #

    from tricks import *

    import sys

    ```


