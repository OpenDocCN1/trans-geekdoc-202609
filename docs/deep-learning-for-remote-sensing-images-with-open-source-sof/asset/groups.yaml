    # 7.2  Overview of composite applications in OTB


    In OTB, composite applications are multiple applications connected together. Typically,
    one application input can come from another application output, instead of being
    read from file. The major benefit is that temporary file read and write are avoided,
    which (i) saves some disk space, and (ii) helps in reducing processing time when
    I/O is a bottleneck. Presented in section 2.1.2, the streaming mechanism enables
    the processing of large images, in splitting the requested parts of the images
    into multiple regions. Composite applications that involve applications with streaming
    support, also benefit from this mechanism.


    In OTBTF there are currently two composite applications.


    +   - **TrainClassifierFromDeepFeatures**, which reuses our model serving application
    (**TensorflowModelServe**) as input of the *TrainImagesClassifier* to train a
    machine learning algorithm based on the features of the deep net given in the
    first application.'
