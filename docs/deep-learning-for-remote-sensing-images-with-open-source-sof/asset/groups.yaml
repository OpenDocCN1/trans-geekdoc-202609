    the following input parameters:


    +   - An **image list**: it can be either one image or a list of images (when
    a list of images is set, images are stacked together in their order of appearance,
    and hence must have the same size and spatial extent).


    +   - The **receptive field**: size of the receptive field of the network, related
    to the input, in *x* and *y* direction.


    +   - A **placeholder** name (string): as named in the TensorFlow model.


    For each input source, the placeholder with the name specified by the **placeholder**
    parameter, is fed to the TensorFlow model with a chunk of the **image stack**
    that corresponds to the **receptive field** of the input.


    In the same way, multiple outputs of a TensorFlow model can be retrieved as a
    result. The following parameters must be provided by the user to transform the
    output tensors into the output image:


    +   - The output tensors names: a list of strings representing the name of the
    tensors, as named in the TensorFlow model (parameter **output.names**).


    +   - The output expression field of the output tensor (parameters **output.efieldx**
    and **output.efieldy**).


    +   - The output scale factor, related to the first input source (i.e. “source1”)
    physical pixel spacing (parameter **output.spscale**).


    Multiple output tensors can be fetched, stacked, then exported as an OTB image.
    The principle is that the user provides the list of tensor names (**output.names**)
    to be considered as outputs of the model. After the TensorFlow session run, they
    are stacked together in the 3rd dimension of the output image (i.e. pixel components).
    Currently, only one output image can be generated. Hence, the current limitation
    is that the output tensors can be stacked as mentioned.


