    ## 关于像素交错的一点说明


    为简单起见，采样的补丁存储在单个大图像中，该图像将所有补丁按行堆叠。这样做有多个优点。首先，访问一个唯一的大文件比处理文件系统中存储的数千个独立小文件，或者访问大图像中稀疏分布的补丁更高效。其次，我们可以像处理任何图像一样可视化/处理补丁：例如，我们可以将大补丁图像导入
    QGIS，并检查我们的补丁是否看起来正确。第三，采样源的交错方式得以保留，这保证了数据访问期间的良好性能。


    ## 5.3 训练


    如何训练一个深度网络？为了从简单开始，我们将训练一个较小的现有模型。我们关注一个 CNN，它输入我们的 16 × 16 × 4 补丁，并在 0 到 5 的
    6 个标签中产生一个输出类别的预测（类别描述见表 4.2）。


    ### 5.3.1 原理


    在本节中，我们简要概述深度学习模型训练的基本概念。模型训练通常涉及损失函数的梯度下降（在网络权重空间中），该函数通常表示估计数据与参考数据之间的差距。**批量**大小定义了通过网络传播以在每一步平均梯度的样本数量。假设我们有*N*个训练样本，并且想要使用大小为*n*的批量。在学习过程中，前*n*个样本（从
    1 到*n*）将用于训练网络。然后，第二个*n*个样本（从*n* + 1 到 2*n*）将再次用于训练网络。重复此过程，直到所有样本都通过网络传播（这称为一个**周期**）。在每一步，梯度在批量上计算，网络权重根据所选的优化方法进行更新。


    使用小于样本总数的批量大小可以使整个训练过程需要更少的内存，这对于大数据集很有用。此外，每次传播后都会更新网络权重。


    根据问题的不同，使用多个批量时性能可能会更优：如果所有样本都在传播中使用，则网络参数只会进行一次更新。然而，批量越小，梯度的估计就越不准确。对于每个批量，网络权重将被更新以最小化与所用样本对应的代价函数。如果样本数量太少，与较大的批量相比，梯度的方向会非常频繁地改变。没有简单的规则来选择好的批量大小，因为这取决于网络架构、要最小化的损失函数、训练参数、数据分布等。


    ### 5.3.2 模型架构


    我们建议引入一个小而简单的 CNN 模型，以更好地理解该方法。本节描述该模型的内部内容。[图 5.2](#figure-52) 中提供了概述，其中总结了所考虑架构的计算图。


    ![](img/f70619500c7a30b0babf83918d56ad93_45_0.png)


    **图 5.2**


    我们的第一个深度网络。该网络由两个占位符（“x”和“lr”）组成，分别用于输入补丁（4 维数组）和学习率（单个标量），一个输出张量（“prediction”，一维数组）和一个目标节点（“optimizer”，仅用于训练网络）。“#”表示第一维的分量数不固定。


    #### 5.3.2.1 输入


    图像补丁馈入 TensorFlow 模型中名为**“x”**的占位符。**“x”**的第一维可以有任何数量的分量。该维度通常用于批量大小，并且不固定以支持不同的批量大小。例如，假设我们想要用
    10 个样本的批量训练模型，我们将大小为 10 × 16 × 16 × 4 的多维数组馈入大小为 # × 16 × 16 × 4 的占位符**“x”**中。


    #### 5.3.2.2 层


    **“x”**随后由一系列的 2D 卷积/激活函数（线性修正单元）/池化层处理。在最后一个激活函数之后，特征由 8 个神经元的全连接层处理（每个预测类别一个）。


    #### 5.3.2.3 估计类别


    估计类别是输出最大值的神经元（来自最后一个神经元层）的索引。这是通过使用*Argmax*算子处理最后一个全连接层的输出来完成的，该算子在图中命名为**“prediction”**。


    #### 5.3.2.4 损失函数


    训练的目标是最小化数据分布（真实标签）与模型分布（估计标签）之间的交叉熵。我们使用 6 个神经元的 softmax 函数的交叉熵作为损失函数。基本上，该函数将测量离散分类任务中的概率误差，其中类别是互斥的（每个条目恰好属于一个类别）。为此，模型实现了
    TensorFlow 中称为*带 logits 的 softmax 交叉熵*的操作。该函数首先计算 6 个神经元输出的*softmax*函数。softmax
    函数对输出进行归一化，使其总和等于 1，并且可以用于表示类别分布，即，在*n*个不同可能结果上的概率分布（公式 5.1）。然后计算真实标签与 softmax
    得到的概率值之间的香农交叉熵（公式 5.2），并将其视为深度网络的损失函数。


    $$\sigma(z)_i = \frac{e^{z_i}}{\sum_{k=1}^{n} e^{z_k}} \tag{5.1}$$


    $$H(p,q) = -\sum_x p(x)\log(q(x)) \tag{5.2}$$


    #### 5.3.2.5 优化器


    一个名为**“optimizer”**的节点执行损失函数的梯度下降：该节点仅用于训练（或微调，如果希望“冻结”某些权重）模型。该节点在推理时（即模型被使用时，通常是估计类别）不被使用。该算子实现的方法称为
    Adam（即自适应矩估计 [19]）。一个名为**“lr”**的占位符控制优化器的学习率：它保存一个标量值（浮点数），并且可以有一个默认值。


    > **重要提示**

    >

    > 我们模型中所使用的函数适用于 0 到 5 的整数标签（$N = 6$）。第一个类别编号必须为 0，以符合我们模型中使用的 TensorFlow 函数的类别编号约定。


