    \ pansharpening of the Spot-7 product, meaning that we generate a multispectral\
    \ image that has the same resolution as the panchromatic channel, and the same\
    \ channels as the original multispectral image. To generate this pansharpened\
    \ image, we rely on the **BundleToPerfectSensor** application of OTB.\n\n```bash\n\
    # Perform the pansharpening\n\n# Go in the folder of the Spot product\ncd ~/amsterdam/\n\
    cd Amsterdam_Netherlands_SPOT7/\ncd PROD_SPOT7_001/VOL_SPOT7_001_A/\n\n# Execute\
    \ the OTB application\n# We can set the output encoding to uint8 since inputs\
    \ encoding is\n# 8 bits.\notbcli_BundleToPerfectSensor \\\n-inp IMG_SPOT7_P_001_A/IMG_SPOT7_P_201409171025192_ORT_1190912101_R1C1.JP2\
    \ \\\n-inxs IMG_SPOT7_MS_001_A/IMG_SPOT7_MS_201409171025192_ORT_1190912101_R1C1.JP2\
    \ \\\n-method waves \\\n-out ~/amsterdam/IMG_SPOT7_amsterdam_PMS.tif uint8\n\n\
    # Go back in the workspace directory\ncd ~/amsterdam/\n```\n\n### 12.1.2 Image\
    \ normalization\n\nWe normalize the pansharpened Spot-7 image between 0 and 1\
    \ using the **BandMathX** application.\n\n```bash\n# Normalize image between [0,1]\n\
    otbcli_BandMathX \\\n-il \"IMG_SPOT7_amsterdam_PMS.tif\" \\\n-exp \"{im1b1/im1b1Maxi;im1b2/im1b2Maxi;\\\
    \\\nim1b3/im1b3Maxi;im1b4/im1b4Maxi}\" \\\n-out \"IMG_SPOT7_amsterdam_PMS_norm.tif\"\
    \n```\n\n### 12.1.3 Sample selection\n\nIn the following, we will select the center\
    \ of the patches that we will extract in the images, and that will be used as\
    \ the terrain truth.\n\n### 12.1.3.1 Patch position seeding\n\nThe goal here,\
    \ is to select only patches that are fully annotated: in our case, if a patch\
    \ has missing building annotations, we remove it from the terrain truth. Typically,\
    \ in the case of buildings, we should avoid terrain truth patches that miss buildings\
    \ that actually exist in Spot-7 patches. In order to select a sufficient number\
    \ of patches for the terrain truth, we adopt a simple strategy consisting of selecting\
    \ patch positions at regular intervals in the images. Since we want fully annotated\
    \ patches, we just keep the positions that are fully included in the area covered\
    \ by the OSM data, in our case the region of interest used in section 11.3. Our\
    \ goal is to generate a vector layer containing the locations of the patches that\
    \ will be sampled.\n\nHere are the steps to select them:\n\n- 1. Use QGIS to create\
    \ a vector grid. Select from the menu **Vector > Research tools > Create grid**\
    \ as shown in [figure 12.1].\n- 2. Create a grid with the following properties\
    \ ([figure 12.2]):\n  - **Grid type:** *Rectangle*.\n  - **Horizontal spacing\
    \ and Vertical spacing:** 96 meters.\n  - **Grid extent:** select *Use extent\
    \ from* then use the Spot-7 image layer to specify the extent.\n  - **Name the\
    \ output vector data** *amsterdam_grid.gpkg*.\n\n![](img/f70619500c7a30b0babf83918d56ad93_97_0.png)\n\
    \n**FIGURE 12.1**\nCreate a vector grid.\n\n![](img/f70619500c7a30b0babf83918d56ad93_97_1.png)\n\
    \n**FIGURE 12.2**\nSet the grid properties.\n\n- 3. Once the grid is created,\
    \ select it in the stack list on the side of the QGIS window.\n- 4. Click on the\
    \ *Select features by area or single click* icon of the QGIS toolbar, as shown\
    \ in *figure 12.3*.\n- 5. Select all the polygons of the grid which lie completely\
    \ inside the area covered by the buildings polygons.\n\n- 6. Finally, you can\
    \ export the selected polygons: right-click on the grid layer and select **Export\
    \ > Save selected features as**, then export the vector data as *amsterdam_grid_selection.gpkg*.\n\
    \nFigure 12.4 summarizes these last two steps.\n\n![](img/f70619500c7a30b0babf83918d56ad93_98_0.png)\n\
    \n## FIGURE 12.3\n\nThe *Select features by area* or single click icon of the\
    \ QGIS toolbar.\n\n![](img/f70619500c7a30b0babf83918d56ad93_98_1.png)\n\n## FIGURE\
    \ 12.4\n\nSelect the patches that lie completely inside the area covered with\
    \ building annotations from OSM (the selection appears in yellow in the illustration),\
    \ and export the selection as a new vector layer, *amsterdam_grid_selection.gpkg*.\n\
    \nSometimes, the OSM vector data is not fully annotated and many polygons are\
    \ missing in some regions. In this case, you can manually clean the vector data,\
    \ removing portions of patches that are not actually fully annotated. This is\
    \ a common issue that you can encounter with OSM data. Luckily, OSM data is quite\
    \ well annotated in our *Amsterdam* dataset.\n\n### 12.1.3.2 Patch position selection\n\
    \nNow, we want to extract centroids of those valid patches that we previously\
    \ have pre-selected. From the QGIS menu, select **Vector**, then **Geometry tools**,\
    \ then **Centroids** (*Fig. 12.5*).\n\n- **mode.attribute.field** is the name\
    \ of the field from which we want to burn the values. In our case, we set *class*.\n\
    - **background** is the value for the background. In our case, we set the default\
    \ value (zero) because there is no zero value in the *class* field.\n\nLet’s run\
    \ the application.\n\n```bash\n# Rasterize the OSM vector layer for terrain truth\n\
    # Since the output raster contains integers values\n# between 0 and 6, we can\
    \ use uint8 encoding (8 bits)\notbcli_Rasterization \\\n-in \"buildings.gpkg\"\
    \ \\\n-im \"IMG_SPOT7_amsterdam_PMS_norm.tif\" \\\n-out \"amsterdam_labelimage.tif\"\
    \ uint8 \\\n-mode binary \\\n-mode.binary.foreground 1\n```\n\nYou can now open\
    \ the *amsterdam_labelimage.tif* in QGIS to check that the vector layer has been\
    \ correctly rasterized over the Spot-7 image pixel grid, as shown in figure 12.8.\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_101_0.png)\n\n## FIGURE 12.8\n\nRasterized\
    \ building polygons over Spot-7 image reference.\n\n### 12.1.5 Patch extraction\n\
    \nLet’s prepare the patches that will be used for training and validation. We\
    \ use the **PatchesExtraction** application to jointly extract patches in the\
    \ Spot-7 image and the label image. In Part II, each remote sensing image patch\
    \ was associated with a corresponding label value. This time, our goal is slightly\
    \ different because we need labels as patches, not as a single value like for\
    \ the patch-based approach. Hence, we tell **PatchesExtraction** that we want\
    \ two sources: one for the Spot-7 image, and one for the label image. We change\
    \ the **OTB_TF_NSOURCES** environment variable to 2 to fulfill this need.\n\n\
    ```bash\nexport OTB_TF_NSOURCES=2\n```\n\n### 12.2.1 Architecture\n\nThis kind\
    \ of architecture is also called an autoencoder. An autoencoder consists of:\n\
    \n- 1. an encoder extracting features in the input image,\n- 2. a bottleneck,\
    \ being the output of the encoder, and\n- 3. a decoder that upsamples the features\
    \ into the output features (typically for a classifier: the classes representation).\n\
    \n[Figure 12.9](#) presents our model.\n\n![](img/f70619500c7a30b0babf83918d56ad93_103_0.png)\n\
    \nThe encoder is composed of 4 convolutions with stride 2 followed with a rectified\
    \ linear unit. The decoder is composed of 4 transposed convolutions with stride\
    \ 2 with a rectified linear unit. The final layer is a 2-neuron layer: one neuron\
    \ for class *background* and another for class *buildings*. We train the network\
    \ in minimizing the gap between the predicted (i.e. the 2 neurons output) and\
    \ the terrain truth (i.e. the *y* placeholder which hosts the label image patches).\n"
  mdcn: "\n\n![](img/f70619500c7a30b0babf83918d56ad93_93_0.png)\n\n## 图11.10\n\n得到的**buildings.gpkg**矢量图层（红色）。\n\
    \n## OSM 下载\n\n除了使用QGIS中的*OSM下载器*插件（可能受下载数据量的限制），你还可以使用以下几种替代方法：\n\n- download.geofabrik.de\n\
    - [OpenStreetMap.org/export](https://OpenStreetMap.org/export)\n\n## 建筑物制图\n\n\
    在本节中，我们应用语义分割来绘制阿姆斯特丹感兴趣区域内的建筑物。\n\n## 12.1 输入数据预处理\n\n我们打算对阿姆斯特丹获取的1.5米Spot-7影像进行建筑物语义分割。第一步是预处理Spot-7影像。然后，我们将准备用于训练U-Net模型的地面真值。与第二部分研究方法的主要区别在于，标签是图像块而不是单一的标签值。因此，我们需要为地面真值生成一幅标签图像，其像素大小与Spot-7影像相同。\n\
    \n### 12.1.1 卫星影像全色锐化\n\n为了简化，我们将引入一个非常简单的深度网络，输入单张影像。因此，在其他处理之前，我们将全色波段和多光谱影像融合为单张影像。我们对Spot-7产品进行全色锐化，这意味着生成一幅多光谱图像，其分辨率与全色波段相同，波段数与原始多光谱图像相同。为了生成这幅全色锐化图像，我们依赖OTB的**BundleToPerfectSensor**应用程序。\n\
    \n```bash\n# Perform the pansharpening\n\n# Go in the folder of the Spot product\n\
    cd ~/amsterdam/\ncd Amsterdam_Netherlands_SPOT7/\ncd PROD_SPOT7_001/VOL_SPOT7_001_A/\n\
    \n# Execute the OTB application\n# We can set the output encoding to uint8 since\
    \ inputs encoding is\n# 8 bits.\notbcli_BundleToPerfectSensor \\\n-inp IMG_SPOT7_P_001_A/IMG_SPOT7_P_201409171025192_ORT_1190912101_R1C1.JP2\
    \ \\\n-inxs IMG_SPOT7_MS_001_A/IMG_SPOT7_MS_201409171025192_ORT_1190912101_R1C1.JP2\
    \ \\\n-method waves \\\n-out ~/amsterdam/IMG_SPOT7_amsterdam_PMS.tif uint8\n\n\
    # Go back in the workspace directory\ncd ~/amsterdam/\n```\n\n### 12.1.2 图像归一化\n\
    \n我们使用**BandMathX**应用程序将全色锐化后的Spot-7影像归一化到0和1之间。\n\n```bash\n# Normalize image\
    \ between [0,1]\notbcli_BandMathX \\\n-il \"IMG_SPOT7_amsterdam_PMS.tif\" \\\n\
    -exp \"{im1b1/im1b1Maxi;im1b2/im1b2Maxi;\\\\\nim1b3/im1b3Maxi;im1b4/im1b4Maxi}\"\
    \ \\\n-out \"IMG_SPOT7_amsterdam_PMS_norm.tif\"\n```\n\n### 12.1.3 样本选择\n\n接下来，我们将选择在图像中提取的、并将用作地面真值的图像块中心。\n\
    \n### 12.1.3.1 图像块位置播种\n\n这里的目标是仅选择完全标注的图像块：就我们而言，如果某个图像块缺少建筑物标注，我们会将其从地面真值中移除。通常在建筑物的情况下，我们应该避免那些遗漏了Spot-7图像块中实际存在的建筑物的地面真值图像块。为了选择足够数量的地面真值图像块，我们采用一种简单的策略，即以固定间隔在图像中选择图像块位置。由于我们需要完全标注的图像块，我们只保留完全包含在OSM数据覆盖区域内的位置，在我们的案例中即11.3节使用的感兴趣区域。我们的目标是生成一个矢量图层，其中包含将要采样的图像块的位置。\n\
    \n以下是选择它们的步骤：\n\n- 1. 使用QGIS创建矢量网格。从菜单选择**矢量 > 研究工具 > 创建网格**，如[图12.1]所示。\n- 2.\
    \ 创建具有以下属性的网格（[图12.2]）：\n  - **网格类型：** *矩形*。\n  - **水平间距和垂直间距：** 96米。\n  - **网格范围：**\
    \ 选择*使用图层范围*，然后使用Spot-7影像图层指定范围。\n  - **命名输出矢量数据** *amsterdam_grid.gpkg*。\n\n\
    ![](img/f70619500c7a30b0babf83918d56ad93_97_0.png)\n\n**图12.1**\n创建矢量网格。\n\n![](img/f70619500c7a30b0babf83918d56ad93_97_1.png)\n\
    \n**图12.2**\n设置网格属性。\n\n- 3. 创建网格后，在QGIS窗口侧面的图层列表中选中它。\n- 4. 单击QGIS工具栏中的*按区域选择要素或单击选择*图标，如*图12.3*所示。\n\
    - 5. 选择网格中完全位于建筑物多边形覆盖区域内的所有多边形。\n\n- 6. 最后，导出选中的多边形：右键单击网格图层，选择**导出 > 将所选要素另存为**，然后将矢量数据导出为*amsterdam_grid_selection.gpkg*。\n\
    \n图12.4总结了最后两步。\n\n![](img/f70619500c7a30b0babf83918d56ad93_98_0.png)\n\n## 图12.3\n\
    \nQGIS工具栏中的*按区域选择要素*或单击选择图标。\n\n![](img/f70619500c7a30b0babf83918d56ad93_98_1.png)\n\
    \n## 图12.4\n\n选择完全位于OSM建筑物标注覆盖区域内的图像块（在插图中选择内容以黄色显示），并将选择导出为新矢量图层*amsterdam_grid_selection.gpkg*。\n\
    \n有时，OSM矢量数据并非完全标注，某些区域缺少许多多边形。在这种情况下，你可以手动清理矢量数据，移除那些实际上未被完全标注的图像块部分。这是OSM数据中常见的问题。幸运的是，在我们的*阿姆斯特丹*数据集中，OSM数据标注得相当完善。\n\
    \n### 12.1.3.2 图像块位置选择\n\n现在，我们要提取之前预先选中的有效图像块的质心。从QGIS菜单中，选择**矢量**，然后选择**几何工具**，再选择**质心**（*图12.5*）。\n\
    \n- **mode.attribute.field** 是我们要从中提取值进行栅格化的字段名称。在我们的案例中，我们设置为*class*。\n- **background**\
    \ 是背景值。在我们的案例中，我们设置默认值（零），因为*class*字段中没有零值。\n\n让我们运行该应用程序。\n\n```bash\n# Rasterize\
    \ the OSM vector layer for terrain truth\n# Since the output raster contains integers\
    \ values\n# between 0 and 6, we can use uint8 encoding (8 bits)\notbcli_Rasterization\
    \ \\\n-in \"buildings.gpkg\" \\\n-im \"IMG_SPOT7_amsterdam_PMS_norm.tif\" \\\n\
    -out \"amsterdam_labelimage.tif\" uint8 \\\n-mode binary \\\n-mode.binary.foreground\
    \ 1\n```\n\n你现在可以在QGIS中打开*amsterdam_labelimage.tif*，检查矢量图层是否已正确栅格化到Spot-7影像像素网格上，如图12.8所示。\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_101_0.png)\n\n## 图12.8\n\n在Spot-7影像参考上栅格化的建筑物多边形。\n\
    \n### 12.1.5 图像块提取\n\n让我们准备用于训练和验证的图像块。我们使用**PatchesExtraction**应用程序来同时提取Spot-7影像和标签影像中的图像块。在第二部分中，每个遥感影像图像块都对应一个标签值。这次，我们的目标略有不同，因为我们需要标签作为图像块，而不是像基于图像块的方法那样使用单一值。因此，我们告诉**PatchesExtraction**我们需要两个源：一个用于Spot-7影像，一个用于标签影像。我们将**OTB_TF_NSOURCES**环境变量改为2以满足这一需求。\n\
    \n```bash\nexport OTB_TF_NSOURCES=2\n```\n\n### 12.2.1 架构\n\n这种架构也称为自编码器。自编码器由以下部分组成：\n\
    \n- 1. 编码器，提取输入图像中的特征，\n- 2. 瓶颈，即编码器的输出，\n- 3. 解码器，将特征上采样为输出特征（通常对于分类器而言：类别表示）。\n\
    \n[图12.9](#)展示了我们的模型。\n\n![](img/f70619500c7a30b0babf83918d56ad93_103_0.png)\n\
    \n编码器由4个步长为2的卷积层组成，后面跟着一个修正线性单元。解码器由4个步长为2的转置卷积层组成，并带有修正线性单元。最后一层是2神经元层：一个神经元对应*背景*类别，另一个对应*建筑物*类别。我们训练网络以最小化预测（即2个神经元的输出）与地面真值（即承载标签图像块的*y*占位符）之间的差距。\n\
    \n"
