    教程。QGIS 的一个有趣特性是 Python 扩展提供程序。它允许访问许多用 Python 编写的插件，这些插件使用 QGIS API 来提供新功能。特别是，我们将使用一个插件，它允许我们将
    OpenStreetMap 数据下载为矢量图层，即 OSM **Downloader**。


    ![](img/f70619500c7a30b0babf83918d56ad93_30_0.png)


    **图 2.5** QGIS。


    ## 第二部分：基于图像块的分类


    ## 3 引言


    本章介绍了我们所说的用于土地覆盖制图的*基于图像块的分类*。该任务包括对固定大小的图像块进行分类，并将估计的类别赋予图像块的中心像素，以生成土地覆盖图。当可用数据是稀疏标注时，这种方法很合适：唯一的要求是已知类别的图像块的位置。通常，支持这种方法的真实地面示例可以是与土地覆盖类别相关的
    GPS 坐标，也可以是 GIS 中手动标注的多边形等。这种方法涉及深度网络，输入一个图像块，并产生一个代表该图像块类别的单个值：因此，训练这种网络只需要输入图像块和相关的类别值。一旦网络训练完成，生成土地覆盖图就是将模型应用于遥感图像的每个图像块，并将估计的类别值存储在输出图像中。这种方法的优点是适用于稀疏标注的数据集。其实现细节和局限性将在本章讨论。


    ![](img/f70619500c7a30b0babf83918d56ad93_34_0.png)


    ## 4 使用的数据：东京数据集


    本节旨在介绍本次实践课所涉及的数据。我们使用一个免费可用的数据集，称为 *东京* 数据集。在接下来的部分中，我们说明如何下载和准备这个数据集，以便为实践课做好准备。在您的文件系统上创建一个名为
    *tokyo* 的目录。我们将使用这个目录存储在练习中下载和生成的所有数据。


    ### 4.1 描述


    *东京*数据集由一幅 Sentinel-2 影像和一个栅格化的 OpenStreetMap[^1]（OSM）矢量图层组成。它将用于第二部分的所有练习。


    [^1]: [www.openstreetmap.org](http://www.openstreetmap.org)


    ### 4.2 遥感影像


    我们使用一幅在日本本土东京地区获取的 Sentinel-2 影像（[图 4.1](#)）。


    从搜索结果中，您应该能够下载一个名为 S2A_MSIL2A_20190508T012701_N0212_R074_T54SUE_20190508T041235
    的产品，如图 4.3 所示。


    ![](img/f70619500c7a30b0babf83918d56ad93_37_0.png)


    **图 4.3** 下载名为 S2A_MSIL2A_20190508T012701_N0212_R074_T54SUE_20190508T041235 的产品。


    下载产品后，您可以解压缩归档文件并查看解压后的文件。该产品有两组影像：一组具有 10 米间距（光谱波段 2、3、4 和 8），另一组具有 20 米间距（光谱波段
    5、6、7、8a、11 和 12）。在本章中，我们不会使用其他光谱波段，因为它们主要与大气成分有关。表 4.1 总结了这些影像的特征。


    **表 4.1** 影像的特征


    | Id | 产品类型 | 图像大小（列 × 行） | 值编码 | 像素间距（米） |

    |---|---|---|---|---|

    | *Sentinel-2（波段 2、3、4、8）* | 多光谱 | 10980 × 10980 | int（16 位） | 10 米 |

    | *Sentinel-2（波段 5、6、7、8a、11、12）* | 多光谱 | 5490 × 5490 | int（16 位） | 20 米 |


    ### 4.3 地面真值


    我们将使用法国蒙彼利埃大学 TETIS 研究机构提供的一些地面真值。地面真值由两个标签栅格组成，即像素对类别值进行编码，其空间范围和分辨率与 10 米影像相同。相应的类别在表
    4.2 中描述。


    **表 4.2** *东京*数据集地面真值的特征


    | 类别编号 | 描述 |

    |---:|---|

    | 0 | 水体 |

    | 1 | 高尔夫球场 |

    | 2 | 公园和草地 |

