    \ the red, green and blue channels of the pre-processed Sentinel-2 images are\
    \ respectively 1, 2 and 3.\n\n## 16.1.2 SAR image\n\nRadar is an active sensor,\
    \ meaning that it emits a radio wave “illuminating” the target (but not in the\
    \ visible domain) and the echo is received and recorded. Synthetic Aperture Radar\
    \ (SAR) is a kind of radar that generates images using the motion of the sensor\
    \ to simulate a larger antenna, enabling a higher-resolution image. The acquisition\
    \ principle is that the target is viewed multiple times from the moving sensor,\
    \ but with different acquisition angles. SAR processing combines these acquisitions\
    \ and allows us to increase the resolution of the original antenna. A few pre-processing\
    \ steps are required prior to processing SAR images.\n\n### 16.1.2.1 Calibration\n\
    \nThe first step to prepare the SAR images is the calibration. The calibration\
    \ ensures that the intensity value actually represents the sigma zero (σ₀) value\
    \ of the reflectivity, i.e., the radar cross section normalized to area. We use\
    \ the SARCalibration application of the Orfeo ToolBox to compute the calibrated\
    \ σ₀ image from the downloaded Sentinel-1 product.\n\nWe first generate the calibrated\
    \ VH image.\n\n```\n# SAR calibration\ncd ~/marmande\ncd S1A_IW_GRDH_1SDV_20190725T175553_20190725T175618_028277_0331C8_3C98.SAFE\n\
    cd measurement\n\n# Calibration of VH channel\notbcli_SARCalibration \\\n-in s1a-iw-grd-vh-20190725t175553-20190725t175618-028277-0331c8-002.tiff\
    \ \\\n-out ~/marmande/sar_vh.tif\n\n# Go back to workspace\ncd ~/marmande\n```\n\
    \nWe repeat the same operation to generate the VV image.\n\n```\n# SAR calibration\n\
    cd ~/marmande\ncd S1A_IW_GRDH_1SDV_20190725T175553_20190725T175618_028277_0331C8_3C98.SAFE\n\
    cd measurement\n\n# Calibration of VV channel\n```\n\n- **inm** is the *moving\
    \ image*. In our case, the image to resample is the Sentinel-1 image we have already\
    \ radiometrically pre-processed, the *sar_vh_hh_log_norm.tif* image.\n- **out**\
    \ is the output image, that is, the *moving image* resampled to the same spatial\
    \ extent and with the same pixel spacing as the *reference image*.\n\nPerform\
    \ the resampling with the following command line.\n\n```\n# Resample the Sentinel-1\
    \ image over one Sentinel-2 image\notbcli_Superimpose \\\n-inm sar_vh_hh_log_norm.tif\
    \ \\\n-inr Sentinel2_2019-07-05_10m.tif \\\n-out sar_vh_hh_log_norm_EPSG32630.tif\n\
    ```\n\n## 16.2 Patches\n\nThe Sentinel-1 and Sentinel-2 images are pre-processed,\
    \ and we can now proceed to the next step: the preparation of patches. The goal\
    \ is to prepare two datasets: one for training the network (the training dataset),\
    \ and the other to evaluate the performance of the network (the validation dataset).\
    \ Each dataset consists of quadruplets of ($S2_{t-1}$, $S2_t$, $S2_{t+1}$, $S1_t$)\
    \ patches.\n\n### 16.2.1 Patch position seeding\n\nThe first step is to select\
    \ the locations where the samples will be extracted. Here, we must select some\
    \ clean patches in the images: patches must be cloud-free and have no-data values.\
    \ To accomplish this task, we will use QGIS exclusively in performing these steps:\n\
    \n1. For each Sentinel-2 image, we create a mask of pixels that are not valid\
    \ (i.e. cloudy or no-data values). Since the Sentinel-1 image is cloud-free and\
    \ entirely overlaps our region of interest, we don’t need to create a mask for\
    \ it.\n2. We then merge the Sentinel-2 masks to obtain a unique mask of the areas\
    \ that should be avoided in extracting the samples.\n3. Finally, we generate a\
    \ grid of points, and keep the points that lie in the valid part of the Sentinel-2\
    \ images, i.e. which do not intersect the mask of areas to avoid. We use a grid\
    \ because (i) the samples are uniformly distributed in space, and (ii) the patches\
    \ do not overlap.\n\n#### 16.2.1.1 Sentinel-2 image masks\n\nIn this part, we\
    \ will create one mask of polluted/no-data pixels for each Sentinel-2 image. We\
    \ detail the steps to create the mask of one Sentinel-2 image, Sentinel2_2019-07-05_10m.tif.\
    \ You will then be able to process the two other *Sentinel-2* images, *Sentinel2_2019-07-25_10m.tif*\
    \ and *Sentinel2_2019-08-24_10m.tif*, by repeating the same operations.\n\nCreate\
    \ a new empty project in QGIS, and import the *Sentinel2_2019-07-05_10m.tif* image.\n\
    \nThe objective is to create a vector layer representing the area where pixels\
    \ of the *Sentinel2_2019-07-05_10m.tif* image are cloudy or have *no-data* values.\
    \ For the sake of simplicity, we manually draw polygons that represent these areas.\n\
    \nFirst, create a new vector layer: from the menu, select **Layer > Create Layer\
    \ > New geopackage layer** as shown in Figure 16.1.\n\n![](img/f70619500c7a30b0babf83918d56ad93_132_0.png)\n\
    \n**FIGURE 16.1**  \nCreate a new vector layer from the menu.\n\nIn *Geometry\
    \ type*, select *Polygon* and save the vector layer in a file named *Sentinel2_2019-07-05_holes.gpkg*\
    \ in your working directory, as shown in Figure 16.2.\n\n![](img/f70619500c7a30b0babf83918d56ad93_132_1.png)\n\
    \n**FIGURE 16.2**  \nSave the vector layer into *Sentinel2_2019-07-05_holes.gpkg*.\n\
    \n#### 16.2.1.2 Merge masks\n\nYou should have ended the previous step with 3\
    \ new vector layers:\n\n1. *Sentinel2_2019-07-05_holes.gpkg*\n2. *Sentinel2_2019-07-25_holes.gpkg*\n\
    3. *Sentinel2_2019-08-24_holes.gpkg*\n\nSince we want samples that are valid in\
    \ the four images ($S2_{t-1}$, $S2_t$, $S2_{t+1}$ and $S1_t$), we need to merge\
    \ the vector layers of images into a single one that indicates where at least\
    \ one image has missing content. Use QGIS to merge the masks into a single vector\
    \ layer. From the menu, select **Vector > Data management tools > Merge vector\
    \ layers** refer to Figure 16.6.\n\n![](img/f70619500c7a30b0babf83918d56ad93_134_0.png)\n\
    \n**FIGURE 16.6**  \nMerge the masks.\n\nIn input layers, select the 3 vector\
    \ layers *Sentinel2_2019-07-05_holes.gpkg*, *Sentinel2_2019-07-25_holes.gpkg*\
    \ and *Sentinel2_2019-08-24_holes.gpkg*. Select the destination CRS (Coordinate\
    \ Reference System) as EPSG:32630, which is the same as the Sentinel images. Save\
    \ the output vector layer as a temporary layer. Figure 16.7 summarizes the parameters\
    \ to provide.\n\n![](img/f70619500c7a30b0babf83918d56ad93_134_1.png)\n\n**FIGURE\
    \ 16.7**  \nSelect the masks to merge. Keep the same coordinate reference system\
    \ as the images (EPSG:32630). Save the output vector layer as a temporary layer.\n\
    \nThe merge mask should look like the illustration in Figure 16.8.\n\n![](img/f70619500c7a30b0babf83918d56ad93_135_0.png)\n\
    \n**FIGURE 16.8**  \nThe resulting *Merged* layer.\n\n#### 16.2.1.3 Grid generation\n\
    \nIn this section, we will generate the grid that will be used to extract the\
    \ patches in the images. As in section 12.1.3.1, we use QGIS to generate a vector\
    \ layer of polygons that represent the patch layout, aligned on the pixel positions\
    \ of the images. Since our model needs 64 × 64 patches at inputs and the pixels\
    \ have 10-m spacing, we will generate a grid tiled with 640-meter-sized squares.\
    \ From the menu, click on **Vector > Research tools > Create grid** as shown in\
    \ Figure 16.9.\n\n![](img/f70619500c7a30b0babf83918d56ad93_135_1.png)\n\n**FIGURE\
    \ 16.9**  \nCreate a vector grid.\n\nOnce the **Create grid** tool is open, set\
    \ the following fields (Figure 16.10):\n\n1. **Grid type**: select *Rectangle*.\n\
    2. **Grid extent**: set *Use layer extent*, then select one of the images, for\
    \ instance, *Sentinel2_2019-07-05_10m.tif*.\n3. **Horizontal spacing**: select\
    \ 640.\n4. **Vertical spacing**: select 640.\n5. You can set the output **Grid**\
    \ layer to *Create temporary layer* since it is just an intermediate data.\n\n\
    You can then click on *Run*.\n\n![](img/f70619500c7a30b0babf83918d56ad93_136_0.png)\n\
    \n**FIGURE 16.10**  \nVector grid parameters.\n\n#### 16.2.1.4 Grid filtering\n\
    \nWe will now keep only the patches of valid pixels. Purposely, we will use the\
    \ mask created in section 16.2.1.2 to eliminate the undesirable polygons of our\
    \ grid. Again, vector tools of QGIS are used: click on the menu **Vector > Research\
    \ tools > Select by location** (Figure 16.11).\n"
  mdcn: "\n此时，您可以在 QGIS 中导入生成的三个影像：Sentinel2_2019-07-05_10m.tif（$S2_{t-1}$）、Sentinel2_2019-07-25_10m.tif（$S2_t$）和\
    \ Sentinel2_2019-08-24_10m.tif（$S2_{t+1}$）。由于预处理后的 Sentinel-2 影像的红、绿、蓝通道索引分别为\
    \ 1、2 和 3，QGIS 将以真彩色显示这些影像。\n\n## 16.1.2 SAR 影像\n\n雷达是一种主动传感器，即它发射无线电波“照射”目标（但不在可见光波段），并接收和记录回波。合成孔径雷达（SAR）是一种利用传感器运动来模拟更大天线、从而生成更高分辨率影像的雷达。其采集原理是：运动中的传感器从不同的采集角度多次观测目标。SAR\
    \ 处理将这些采集数据组合起来，使我们能够提高原始天线的分辨率。在处理 SAR 影像之前，需要进行一些预处理步骤。\n\n### 16.1.2.1 校准\n\
    \n准备 SAR 影像的第一步是校准。校准确保强度值实际表示反射率的 sigma zero（σ₀）值，即归一化到面积的雷达截面。我们使用 Orfeo ToolBox\
    \ 的 SARCalibration 应用程序，从下载的 Sentinel-1 产品中计算校准后的 σ₀ 影像。\n\n我们首先生成校准后的 VH 影像。\n\
    \n```\n# SAR calibration\ncd ~/marmande\ncd S1A_IW_GRDH_1SDV_20190725T175553_20190725T175618_028277_0331C8_3C98.SAFE\n\
    cd measurement\n\n# Calibration of VH channel\notbcli_SARCalibration \\\n-in s1a-iw-grd-vh-20190725t175553-20190725t175618-028277-0331c8-002.tiff\
    \ \\\n-out ~/marmande/sar_vh.tif\n\n# Go back to workspace\ncd ~/marmande\n```\n\
    \n我们重复相同操作以生成 VV 影像。\n\n```\n# SAR calibration\ncd ~/marmande\ncd S1A_IW_GRDH_1SDV_20190725T175553_20190725T175618_028277_0331C8_3C98.SAFE\n\
    cd measurement\n\n# Calibration of VV channel\n```\n\n- **inm** 是*移动影像*。在我们的案例中，要重采样的影像是我们已经完成辐射预处理的\
    \ Sentinel-1 影像，即 *sar_vh_hh_log_norm.tif* 影像。\n- **out** 是输出影像，即*移动影像*被重采样到与*参考影像*相同的空间范围和像素间距。\n\
    \n使用以下命令行执行重采样。\n\n```\n# Resample the Sentinel-1 image over one Sentinel-2 image\n\
    otbcli_Superimpose \\\n-inm sar_vh_hh_log_norm.tif \\\n-inr Sentinel2_2019-07-05_10m.tif\
    \ \\\n-out sar_vh_hh_log_norm_EPSG32630.tif\n```\n\n## 16.2 图块\n\nSentinel-1 和\
    \ Sentinel-2 影像已经过预处理，现在我们可以进入下一步：准备图块。目标是准备两个数据集：一个用于训练网络（训练数据集），另一个用于评估网络性能（验证数据集）。每个数据集由（$S2_{t-1}$、$S2_t$、$S2_{t+1}$、$S1_t$）四元组图块组成。\n\
    \n### 16.2.1 图块位置布点\n\n第一步是选择将提取样本的位置。在此，我们必须在影像中选择一些干净的图块：图块必须无云且没有无数据值。为完成此任务，我们将完全使用\
    \ QGIS 执行以下步骤：\n\n1. 对于每幅 Sentinel-2 影像，我们创建一个无效像素（即云或无数据值）的掩膜。由于 Sentinel-1 影像无云且完全覆盖我们感兴趣的区域，我们不需要为其创建掩膜。\n\
    2. 然后合并 Sentinel-2 掩膜，获得一个唯一的掩膜，指示在提取样本时应避开的区域。\n3. 最后，我们生成一个点网格，并保留位于 Sentinel-2\
    \ 影像有效部分中的点，即不与需避开区域的掩膜相交的点。我们使用网格是因为 (i) 样本在空间上均匀分布，(ii) 图块之间不重叠。\n\n#### 16.2.1.1\
    \ Sentinel-2 影像掩膜\n\n在本部分，我们将为每幅 Sentinel-2 影像创建一个污染/无数据像素掩膜。我们详细说明创建一幅 Sentinel-2\
    \ 影像 Sentinel2_2019-07-05_10m.tif 掩膜的步骤。然后，您可以通过重复相同操作来处理另外两幅 *Sentinel-2* 影像：*Sentinel2_2019-07-25_10m.tif*\
    \ 和 *Sentinel2_2019-08-24_10m.tif*。\n\n在 QGIS 中创建一个新的空项目，并导入 *Sentinel2_2019-07-05_10m.tif*\
    \ 影像。\n\n目标是创建一个矢量图层，表示 *Sentinel2_2019-07-05_10m.tif* 影像中像素为云或具有 *无数据* 值的区域。为简单起见，我们手动绘制表示这些区域的多边形。\n\
    \n首先，创建新的矢量图层：从菜单中选择 **图层 > 创建图层 > 新建 GeoPackage 图层**，如图 16.1 所示。\n\n![](img/f70619500c7a30b0babf83918d56ad93_132_0.png)\n\
    \n**图 16.1**  \n从菜单创建新的矢量图层。\n\n在*几何类型*中，选择*面*，并将矢量图层保存到工作目录中名为 *Sentinel2_2019-07-05_holes.gpkg*\
    \ 的文件中，如图 16.2 所示。\n\n![](img/f70619500c7a30b0babf83918d56ad93_132_1.png)\n\n\
    **图 16.2**  \n将矢量图层保存为 *Sentinel2_2019-07-05_holes.gpkg*。\n\n#### 16.2.1.2 合并掩膜\n\
    \n上一步结束后，您应得到 3 个新的矢量图层：\n\n1. *Sentinel2_2019-07-05_holes.gpkg*\n2. *Sentinel2_2019-07-25_holes.gpkg*\n\
    3. *Sentinel2_2019-08-24_holes.gpkg*\n\n由于我们希望样本在四幅影像（$S2_{t-1}$、$S2_t$、$S2_{t+1}$\
    \ 和 $S1_t$）中都有效，因此需要将各影像的矢量图层合并为一个图层，以指示至少有一幅影像缺失内容的位置。使用 QGIS 将掩膜合并为单个矢量图层。从菜单中选择\
    \ **矢量 > 数据管理工具 > 合并矢量图层**，参见图 16.6。\n\n![](img/f70619500c7a30b0babf83918d56ad93_134_0.png)\n\
    \n**图 16.6**  \n合并掩膜。\n\n在输入图层中，选择 3 个矢量图层 *Sentinel2_2019-07-05_holes.gpkg*、*Sentinel2_2019-07-25_holes.gpkg*\
    \ 和 *Sentinel2_2019-08-24_holes.gpkg*。将目标 CRS（坐标参考系统）选择为 EPSG:32630，与 Sentinel\
    \ 影像相同。将输出矢量图层保存为临时图层。图 16.7 总结了需要提供的参数。\n\n![](img/f70619500c7a30b0babf83918d56ad93_134_1.png)\n\
    \n**图 16.7**  \n选择要合并的掩膜。保持与影像相同的坐标参考系统（EPSG:32630）。将输出矢量图层保存为临时图层。\n\n合并后的掩膜应类似于图\
    \ 16.8 中的图示。\n\n![](img/f70619500c7a30b0babf83918d56ad93_135_0.png)\n\n**图 16.8**\
    \  \n生成的*合并*图层。\n\n#### 16.2.1.3 网格生成\n\n在本节中，我们将生成用于在影像中提取图块的网格。与第 12.1.3.1 节一样，我们使用\
    \ QGIS 生成一个表示图块布局的多边形矢量图层，并与影像的像素位置对齐。由于我们的模型需要 64 × 64 的输入图块，且像素间距为 10 米，因此我们将生成一个由\
    \ 640 米大小的正方形拼接而成的网格。从菜单中单击 **矢量 > 研究工具 > 创建网格**，如图 16.9 所示。\n\n![](img/f70619500c7a30b0babf83918d56ad93_135_1.png)\n\
    \n**图 16.9**  \n创建矢量网格。\n\n打开**创建网格**工具后，设置以下字段（图 16.10）：\n\n1. **网格类型**：选择*矩形*。\n\
    2. **网格范围**：设置为*使用图层范围*，然后选择其中一幅影像，例如 *Sentinel2_2019-07-05_10m.tif*。\n3. **水平间距**：选择\
    \ 640。\n4. **垂直间距**：选择 640。\n5. 您可以将输出的**网格**图层设置为*创建临时图层*，因为它只是中间数据。\n\n然后点击*运行*。\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_136_0.png)\n\n**图 16.10**  \n矢量网格参数。\n\
    \n#### 16.2.1.4 网格过滤\n\n现在，我们将仅保留有效像素的图块。为此，我们将使用第 16.2.1.2 节中创建的掩膜来消除网格中不想要的多边形。同样使用\
    \ QGIS 的矢量工具：单击菜单 **矢量 > 研究工具 > 按位置选择**（图 16.11）。\n"
