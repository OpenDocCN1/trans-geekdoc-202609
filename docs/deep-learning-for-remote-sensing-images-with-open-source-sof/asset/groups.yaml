    # 9


    # Discussion


    In this section, we have introduced a simple approach to produce land cover maps
    from remote sensing images using deep nets. The patch-based approach, consisting
    of estimating the class value of one patch of image(s), is well suited to a sparsely
    annotated dataset. Architectures involved in patch-based classification generally
    input one or multiple patches of images, possibly from different modalities (as
    we saw in section 8.2), and derive a single-valued output corresponding to the
    estimated class of the input content. This kind of architecture can be trained
    with single-valued class samples. For instance, terrain truth data, like a set
    of GPS coordinates associated with land cover classes, suffices to train this
    kind of network. In chapter 7 we saw that these models are also good feature extractors,
    that can be used in other classifiers like Random Forests. We explain why, depending
    on their implementation, models can be faster at inference time, and introduced
    fully convolutional patch-based models in section 6.2.


    We also show that the patch-based approach has some drawbacks. In particular,
    the receptive field of one model has an impact on the spatial resolution of the
    output map generated with the trained model. Since the image content in the receptive
    field activates the single-valued model output, we can expect that the localization
    of the predicted class is not reliable if predicted at the same spatial resolution
    as the input image. Practically, large patches contain more context, so the network
    can be activated by a class target (i.e. a tree, a road), even if this last is
    not exactly centered on the patch. We can explain theoretically this phenomenon
    analyzing the constitution of the patch-based models. For instance, VGG-like architectures
    [24] are composed of a succession of pooling operations and convolutions with
    strides. These operations downsample the feature maps in the spatial dimension,
    through the network depth, generally with a factor of 2. Each downsampling diminishes
    the spatial resolution of the features, causing a loss of localization of the
    predicted classes, and usually the last feature maps of this kind of network have
    a low spatial resolution, corresponding to 2^n times the physical spacing of the
    input. In practice, when a land cover map is generated at the same resolution
    as the input image, rather than the resolution of the last feature map of the
    network (which is, generally 2^n smaller), some blobby artifacts can be observed
    around small objects. In the next section, we will introduce some new architectures
    that aim to preserve the spatial resolution of the final features of the model
    output.'
