    \n# Go back in the working directory\ncd ~/tokyo\n```\n\n## 8.4 采样\n\n现在，我们将使用\
    \ **PatchesExtraction** 应用创建两个块图像，一个用于 20 米间距的波段图像，另一个用于 10 米间距的波段图像。我们将针对 20\
    \ 米间距的图像采样 8 × 8 大小的块，针对 10 米间距的图像采样 16 × 16 大小的块。我们将 **OTB_TF_NSOURCES** 环境变量设置为\
    \ 2，以告知 OTBTF 应用我们需要 2 个数据源（一个用于 10 米间距图像，一个用于 20 米间距图像）。\n\n运行以下命令：\n\n```bash\n\
    # Here, we change the number of sources\nexport OTB_TF_NSOURCES=2\n\n# Patches\
    \ extraction\notbcli_PatchesExtraction \\\n-source1.il Sentinel-2_B567_20m.tif\
    \ \\\n-source1.patchsizex 8 \\\n-source1.patchsizey 8 \\\n-source1.out Sentinel-2_B567_20m_patches_A.tif\
    \ \\\n-source2.il Sentinel-2_B4328_10m.tif \\\n-source2.patchsizex 16 \\\n-source2.patchsizey\
    \ 16 \\\n-source2.out Sentinel-2_B4328_10m_patches_A.tif \\\n-vec terrain_truth_epsg32654_A_pos.shp\n\
    ```\n\n## 8.5.1 推理\n\n### 8.5.1.1 基于块的模式\n\n首先，我们将以基于块的模式运行模型。生成与 20 米间距图像分辨率一致的输出分类图。为此，只需将\
    \ 20 米间距图像输入到 source1，该源是输出物理间距的参考源。\n\n```text\n# Generate the classification\
    \ map, patch-based mode, same\n# resolution as the 20m spacing image\notbcli_TensorflowModelServe\
    \ \\\n-source1.il Sentinel-2_B567_20m.tif \\\n-source1.rfieldx 8 \\\n-source1.rfieldy\
    \ 8 \\\n-source1.placeholder \"x1\" \\\n-source2.il Sentinel-2_B4328_10m.tif \\\
    \n-source2.rfieldx 16 \\\n-source2.rfieldy 16 \\\n-source2.placeholder \"x2\"\
    \ \\\n-model.dir model3 \\\n-output.names \"prediction\" \\\n-out \"classif_model3.tif?&box=2000:2000:500:500\"\
    \n```\n\n如果交换 source1 和 source2，使第一个源为 10 米间距图像，那么输出图像将以相同的间距生成。我们来试试吧！\n\n###\
    \ 8.5.1.2 全卷积模式\n\n通过将 **fullyconv** 参数设置为 **on** 以启用处理的全卷积模式，生成与 10 米间距图像分辨率一致的输出分类图。\n\
    \n使用以下命令行：\n\n```text\n# Generate the classification map, fully convolutional\n\
    # mode, same resolution as the 20m spacing image\notbcli_TensorflowModelServe\
    \ \\\n-source1.il Sentinel-2_B567_20m.tif \\\n-source1.rfieldx 8 \\\n-source1.rfieldy\
    \ 8 \\\n-source1.placeholder \"x1\" \\\n-source2.il Sentinel-2_B4328_10m.tif \\\
    \n-source2.rfieldx 16 \\\n-source2.rfieldy 16 \\\n-source2.placeholder \"x2\"\
    \ \\\n-model.dir model3 \\\n-model.fullyconv on \\\n-output.names prediction \\\
    \n-out \"classif_model3_fcn.tif?&box=2000:2000:500:500\"\n```\n\n**重要说明**\n\n\
    如果交换 **source1** 和 **source2**，使第一个源为 10 米间距图像，则必须向 **TensorflowModelServe** 应用提供一个输出缩放因子（参数\
    \ **spscale**），以使输出的物理间距保持一致。在本示例中，spscale 应为 4。\n\n## 9 讨论\n\n在本节中，我们介绍了一种利用深度网络从遥感图像生成土地覆盖图的简单方法。基于块的方法需要估计一个或多个图像中某个图像块的类别值，因此非常适合稀疏标注的数据集。参与基于块分类的网络架构通常输入一个或多个图像块，可能来自不同模态（如我们在第\
    \ 8.2 节所见），并生成与输入内容估计类别相对应的单值输出。这类架构可以使用单值类别样本进行训练。例如，与土地覆盖类别关联的一组 GPS 坐标等地面真值数据，就足以训练这类网络。在第\
    \ 7 章中，我们看到这些模型也是很好的特征提取器，可用于随机森林等其他分类器。我们解释了为什么根据实现的不同，模型在推理时可以更快，并在第 6.2 节中介绍了全卷积基于块模型。\n\
    \n我们还表明，基于块的方法存在一些缺点。特别是，模型的感受野会影响使用训练模型生成的输出图的空间分辨率。由于感受野中的图像内容会激活单值模型输出，因此如果以与输入图像相同的空间分辨率进行预测，预测类别的定位就可能不可靠。实际上，较大的块包含更多上下文，因此即使类别目标（如一棵树、一条道路）并未完全位于块的中心，网络也可能被其激活。通过分析基于块模型的构成，我们可以从理论上解释这一现象。例如，类\
    \ VGG 的架构 [24] 由一系列池化操作和带步长的卷积组成。这些操作在空间维度上对特征图进行下采样，通常沿网络深度以 2 为因子进行。每次下采样都会降低特征的空间分辨率，导致预测类别定位信息的丢失；通常此类网络的最后一个特征图具有较低的空间分辨率，其对应于输入物理间距的\
    \ 2^n 倍。实际上，当以与输入图像相同的分辨率（而不是网络最后一个特征图的分辨率，后者通常小 2^n 倍）生成土地覆盖图时，在小物体周围可以观察到一些团块状伪影。在下一节中，我们将介绍一些旨在保持模型输出最终特征空间分辨率的新架构。\n"
