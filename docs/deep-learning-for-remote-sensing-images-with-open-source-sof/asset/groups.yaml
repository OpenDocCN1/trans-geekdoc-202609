  - "[PAGE 152]\n\n```\n```bash\n-im Sentinel2_2019-07-25_estimated.tif \\\\\n-out\
    \ valid_area_mask.tif uint8\n```\n```\n\nAfter the rasterization is done, we interpolate\
    \ the $\\widehat{S}_{2t}$ image over the $S_{2t}$ image. Because of the receptive\
    \ field, the generated $\\widehat{S}_{2t}$ image is slightly smaller than the\
    \ $S_{2t}$ image. In order to conduct a pixel-wise operation on pixels of both\
    \ $S_{2t}$, $\\widehat{S}_{2t}$ and the binary mask, we must superimpose the $S_{2t}$\
    \ image over the $\\widehat{S}_{2t}$ image. To perform this operation, we use\
    \ the **Superimpose OTB** application:\n\n```\n```bash\notbcli_Superimpose \\\\\
    \n-inr Sentinel2_2019-07-25_estimated.tif \\\\\n-inm Sentinel2_2019-07-25_10m.tif\
    \ \\\\\n-out Sentinel2_2019-07-25_10m_superimposed.tif\n```\n```\n\nWe can then\
    \ compose the final Sentinel-2 image, keeping the pixels in the valid areas, and\
    \ replacing the polluted ones with $\\widehat{S}_{2t}$. The **BandMathX OTB**\
    \ application allows us to create the final image. A mathematical expression is\
    \ used to perform the computation of the output pixel. **BandMathX** is able to\
    \ identify the input images and the input image bands in a mathematical expression.\
    \ The **BandMathX** expression is the following:\n\n$$im1b1==255\\ ?\\ im2\\ :\\\
    \ im3$$\n\nThe “?” and “:” are ternary operators. The expression is interpreted\
    \ as: If the binary mask (i.e. $im1b1$: like “band #1” of image #1) is 255, then\
    \ the pixel is polluted and the output is the $S_{2t}$ image (i.e. $im2$: like\
    \ “image #2”). Otherwise, the output is the $\\widehat{S}_{2t}$ image (i.e. $im3$:\
    \ like “image #3”). Run the following command line to perform the final compositing\
    \ step of the gapfilling:\n\n```\n```bash\notbcli_BandMathX \\\\\n-il valid_area_mask.tif\
    \ \\\\\n    Sentinel2_2019-07-25_estimated.tif \\\\\n    Sentinel2_2019-07-25_10m_superimposed.tif\
    \ \\\\\n-exp \"im1b1==255 ? im2 : im3\" \\\\\n-out Sentinel2_2019-07-25_final.tif\n\
    ```\n```\n\nNote that at this step, we can also instead denormalize the image\
    \ in inverting the equation 16.1.1, i.e. multiplying $im2$ and $im3$ by 8192:\n\
    \n```\n```bash\notbcli_BandMathX \\\\\n-il valid_area_mask.tif \\\\\n    Sentinel2_2019-07-25_estimated.tif\
    \ \\\\\n    Sentinel2_2019-07-25_10m_superimposed.tif \\\\\n-exp \"im1b1==255\
    \ ? 8192*im2 : 8192*im3\" \\\\\n-out Sentinel2_2019-07-25_final_16b.tif int16\n\
    ```\n```\n\nThe final image is ready. [Figure 18.3](#) shows the resulting image\
    \ imported in QGIS."
