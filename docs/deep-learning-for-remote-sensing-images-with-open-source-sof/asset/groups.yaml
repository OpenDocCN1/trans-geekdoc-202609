    +   - **mode.attribute.field** is the name of the field from which we want to
    burn the values. In our case, we set *class*.

    +   - **background** is the value for the background. In our case, we set the
    default value (zero) because there is no zero value in the *class* field.


    Let’s run the application.


    ```

    # Rasterize the OSM vector layer for terrain truth

    # Since the output raster contains integers values

    # between 0 and 6, we can use uint8 encoding (8 bits)

    otbcli_Rasterization \

    -in "buildings.gpkg" \

    -im "IMG_SPOT7_amsterdam_PMS_norm.tif" \

    -out "amsterdam_labelimage.tif" uint8 \

    -mode binary \

    -mode.binary.foreground 1

    ```


    You can now open the *amsterdam_labelimage.tif* in QGIS to check that the vector
    layer has been correctly rasterized over the Spot-7 image pixel grid, as shown
    in figure 12.8.


    ![](img/f70619500c7a30b0babf83918d56ad93_101_0.png)


    # FIGURE 12.8


    Rasterized building polygons over Spot-7 image reference.


    # 12.1.5 Patch extraction


    Let’s prepare the patches that will be used for training and validation. We use
    the **PatchesExtraction** application to jointly extract patches in the Spot-7
    image and the label image. In Part II, each remote sensing image patch was associated
    with a corresponding label value. This time, our goal is slightly different because
    we need labels as patches, not as a single value like for the patch-based approach.
    Hence, we tell **PatchesExtraction** that we want two sources: one for the Spot-7
    image, and one for the label image. We change the **OTB_TF_NSOURCES** environment
    variable to 2 to fulfill this need.


    ```

    export OTB_TF_NSOURCES=2

    ```'
