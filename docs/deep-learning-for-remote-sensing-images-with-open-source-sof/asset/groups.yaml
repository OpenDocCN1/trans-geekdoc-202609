    +   - **inm** is the *moving image*. In our case, the image to resample is the
    Sentinel-1 image we have already radiometrically pre-processed, the *sar_vh_hh_log_norm.tif*
    image.

    +   - **out** is the output image, that is, the *moving image* resampled to the
    same spatial extent and with the same pixel spacing as the *reference image*.


    Perform the resampling with the following command line.


    ```

    # Resample the Sentinel-1 image over one Sentinel-2 image

    otbcli_Superimpose \

    -inm sar_vh_hh_log_norm.tif \

    -inr Sentinel2_2019-07-05_10m.tif \

    -out sar_vh_hh_log_norm_EPSG32630.tif

    ```


    # 16.2 Patches


    The Sentinel-1 and Sentinel-2 images are pre-processed, and we can now proceed
    to the next step: the preparation of patches. The goal is to prepare two datasets:
    one for training the network (the training dataset), and the other to evaluate
    the performance of the network (the validation dataset). Each dataset consists
    of quadruplets of (S2_{t-1}, S2_t, S2_{t+1}, S1_t) patches.


    # 16.2.1 Patch position seeding


    The first step is to select the locations where the samples will be extracted.
    Here, we must select some clean patches in the images: patches must be cloud-free
    and have no-data values. To accomplish this task, we will use QGIS exclusively
    in performing these steps:


    +   1. For each Sentinel-2 image, we create a mask of pixels that are not valid
    (i.e. cloudy or no-data values). Since the Sentinel-1 image is cloud-free and
    entirely overlaps our region of interest, we don’t need to create a mask for it.

    +   2. We then merge the Sentinel-2 masks to obtain a unique mask of the areas
    that should be avoided in extracting the samples.

    +   3. Finally, we generate a grid of points, and keep the points that lie in
    the valid part of the Sentinel-2 images, i.e. which do not intersect the mask
    of areas to avoid. We use a grid because (i) the samples are uniformly distributed
    in space, and (ii) the patches do not overlap.


    # 16.2.1.1 Sentinel-2 image masks


    In this part, we will create one mask of polluted/no-data pixels for each Sentinel-2
    image. We detail the steps to create the mask of one Sentinel-2 image, Sentinel2_2019-07-05_10m.tif.
    You will then be able to process the two'
