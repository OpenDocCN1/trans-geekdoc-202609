    \ the code:\n\n```\n```python\n#\n# Do not forget to add the otbf/python directory\
    \ to your PYTHONPATH.\n# Else \"tricks\" can't be imported.\n# In the OTBTF Docker\
    \ image, tricks.py is located in the following\n# path: /work/otb/otb/Modules/otbtf\n\
    #\n# Works with OTBTF 1.7\n#\nfrom tricks import *\nimport sys\n\nnclasses=2\n\
    \n# Convolution block with strides 2 (\"downsampling\")\ndef _conv(inp, n, k_size=3,\
    \ strides=2, activ=tf.nn.relu):\n    return tf.layers.conv2d(inputs=inp,\n   \
    \                         filters=n,\n                            kernel_size=[k_size,\
    \ k_size],\n                            padding=\"same\",\n                  \
    \          strides=(strides, strides),\n                            activation=activ)\n\
    \n# Transposed convolution block with strides 2 (\"upsampling\")\ndef _dconv(inp,\
    \ n, k_size=3, strides=2, activ=tf.nn.relu):\n    return tf.layers.conv2d_transpose(inputs=inp,\n\
    \                                      filters=n,\n                          \
    \            strides=(strides,strides),\n                                    \
    \  kernel_size=[k_size, k_size],\n                                      padding=\"\
    same\",\n                                      activation=activ)\n\ndef myModel(x):\n\
    \n    depth = 16\n\n    # Encoding\n    conv1 = _conv(x, 1*depth) # 64 x 64 -->\
    \ 32 x 32 (31 x 31)\n    conv2 = _conv(conv1, 2*depth) # 32 x 32 --> 16 x 16 (15\
    \ x 15)\n    conv3 = _conv(conv2, 4*depth) # 16 x 16 --> 8 x 8 ( 7 x 7)\n    conv4\
    \ = _conv(conv3, 4*depth) # 8 x 8 --> 4 x 4 ( 3 x 3)\n\n    # Decoding (with skip\
    \ connections)\n    deconv1 = _dconv(conv4, 4*depth) # 4 x 4 --> 8 x 8 ( 5 x 5)\n\
    \    deconv2 = _dconv(deconv1 + conv3, 2*depth) # 8 x 8 --> 16 x 16\n        \
    \                                          # ( 9 x 9)\n    deconv3 = _dconv(deconv2\
    \ + conv2, 1*depth) # 16 x 16 --> 32 x 32\n                                  \
    \                # (17 x 17)\n    deconv4 = _dconv(deconv3 + conv1, 1*depth) #\
    \ 32 x 32 --> 64 x 64\n                                                  # (33\
    \ x 33)\n\n    # Neurons for classes\n```\n```"
