  mdcn: "\n\n### 14.3.3 损失函数\n\n我们使用训练集 $T$ 来训练网络参数，该训练集由 $n$ 个元组 $t_i$ 组成，每个元组包含\
    \ $(S2_{t-1}, S1_t, S2_{t+1}, S2_t)$ 的图像块。\n\n$$T = \\{t_1, \\ldots, t_n\\},\\\
    quad t_i = (S2_{t-1,i}, S1_{t,i}, S2_{t+1,i}, S2_{t,i}) \\tag{14.1}$$\n\n训练阶段的目标是找到：\n\
    \n$$\\arg\\min \\mathbb{E}\\bigl(L_2(\\widehat{S}_{2t}, S_{2t})\\bigr) \\tag{14.2}$$\n\
    \n我们使用 $L_2$ 范数，因为它表示真实图像与估计图像像素之间的欧氏距离。因此，所有图像块上 $L$ 的平均值对应于估计的均方根误差。为了优化我们的网络，我们使用\
    \ Adam 求解器 [19] 对 $L$ 执行梯度下降。\n\n![](img/f70619500c7a30b0babf83918d56ad93_119_0.png)\n\
    \n**图 14.3** 模型实现。为清晰起见，未表示编码器和解码器特征图的拼接。圆点代表编码器和解码器的其余 6 个构建模块。\n\n如第 5.3 节所述，我们将\
    \ Adam 求解器的算子命名为*优化器*。图 14.3 概括了模型训练的实现过程。\n\n## 15 Marmande 数据集\n\n本节旨在介绍本次实践课程所涉及的数据。我们使用公开可用的数据，称为\
    \ *Marmande* 数据集。在下一章中，我们将说明如何下载和准备该数据集，以便为实践课程做好准备。请在您的文件系统上创建一个名为 *marmande*\
    \ 的目录。我们将在练习期间使用该目录存储所有下载和生成的数据。\n\n### 15.1 描述\n\n*Marmande* 数据集包含三幅 Sentinel-2\
    \ 影像和一幅 Sentinel-1 产品。它将用于第四部分的所有练习。**表 15.1** 汇总了影像的特征。\n\n**表 15.1** 影像特征\n\n\
