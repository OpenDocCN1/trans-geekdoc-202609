    # # 16

    ## Pre-processing


    The Sentinel-1 and Sentinel-2 images should now be downloaded and ready to use.
    We will proceed to the creation of a dataset that can be used (i) to train the
    model described in section 14.3, and also (ii) to evaluate its performance in
    terms of root mean squared error.


    # ### 16.1  Sentinel images


    The Sentinel-1 image has 16 bits signed encoding and the Sentinel-2 images have
    16 bits unsigned encoding, i.e. integer numbers. We need to normalize the pixels
    to have absolute values inside the [0, 1] range. As in sections 5.1, 8.3 and 12.1.2
    we use the **BandMathX** application of the Orfeo ToolBox to perform the band
    concatenation and the normalization of values.


    # #### 16.1.1  Optical images


    We process only the 10-m-resolution bands, numbers 2, 3, 4 and 8. The actual encoding
    of the Sentinel-2 sensor is 12 bits. In Sentinel images, the 16-bit encoding is
    used for convenience, because the Jpeg2000 driver, as most remote sensing images
    drivers, doesn’t support 12-bit encoding. But the actual digital number produced
    by the Sentinel-2 ground segment has 12-bit encoding. Hence, a simple method to
    perform the normalization of input images consists of dividing the pixel values
    by the maximum value of 12 bits, i.e. 8192. We can use **BandMathX** to apply
    the corresponding linear transformation to the pixel values:


    $$x_{norm} = \alpha x \tag{16.1}$$


    With:


    $$\begin{aligned}

    \alpha &= \frac{1}{2^{12}} \\

    &= \frac{1}{8192} \tag{16.2}\\

    &= 1.2207 \times 10^{-4}

    \end{aligned}$$'
