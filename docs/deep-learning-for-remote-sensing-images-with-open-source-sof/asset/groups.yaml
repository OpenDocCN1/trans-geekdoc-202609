    ## 前言\n\n近年来，地球观测数据量不断增加，如今可用的遥感影像越来越多。一方面，由于甚高分辨率传感器和短重访周期卫星的增多，遥感数据量持续增长。得益于\
    \ Landsat 或 Sentinel 等项目，许多免费的影像产品可供使用。此外，基于社区的地理信息采集系统正在扩展并丰富现有的地理空间数据库：OpenStreetMap\
    \ 倡议就是一个著名的例子。面对如此大量的地理空间数据，处理地球观测信息提取中的复杂性正成为一个重大而激动人心的挑战。\n\n深度学习是大数据分析中日益增长的趋势，近年来在图像分析、语音识别、自动驾驶汽车乃至艺术等众多不同领域产生了突破性影响。卷积神经网络旨在提取图像中的特征，从而实现图像识别、目标检测和语义分割。循环神经网络适用于序列数据分析，例如语音识别和动作识别任务。与众多领域一样，深度学习革命也影响了遥感行业。近年来，大量研究表明，得益于数据和计算资源的可用性，遥感从这些新方法中受益匪浅。深度学习使遥感领域的研究人员和工程师能够超越常规方法，以扎实的成果解决诸多问题。各种遥感问题已通过深度学习成功解决：分类、分割、目标检测、图像恢复、图像增强等。深度学习已被证明在许多种类的遥感影像中都具有适用性：合成孔径雷达、高光谱影像、甚高分辨率影像、时间序列等。\n\
    \n在简要总结深度学习背景之后，本书将介绍从遥感影像中提取样本、创建和训练深度网络，以及使用它们生成输出影像（例如土地覆盖图）的常见步骤。本书的不同部分将介绍各种方法和深度网络架构。针对每一种方法，都将详细说明使读者能够执行数据处理的全部步骤。我们提供了一个在线代码仓库，其中包含辅助数据以及练习中使用的共享代码片段。本教程涉及的软件均为开源软件，并提供了安装说明。\n\
    \n## 作者\n\n雷米·克雷松（Rémi Cresson）于2009年获得法国格勒诺布尔理工学院国立能源、水与环境高等学院（École Nationale\
    \ Supérieure de l’Énergie, de l’Eau et de l’Environnement）的电气工程学位。他目前在法国国家农业科学研究院（French\
    \ National Institute for Agricultural Research）工作，任职于法国蒙彼利埃大学的土地、环境、遥感与空间信息联合研究单元。他的研究和工程兴趣包括大规模地理空间图像处理、高性能计算、机器学习和地理空间数据互操作性。他参与开源软件开发，是\
    \ Orfeo ToolBox 项目指导委员会成员，同时也是开源地理空间基金会 OSGeo 的成员。\n\n![](img/f70619500c7a30b0babf83918d56ad93_12_0.png)\n\
    \n## 第一部分\n\n## 背景\n\n![](img/f70619500c7a30b0babf83918d56ad93_14_0.png)\n\nTaylor\
    \ & Francis\n\nTaylor & Francis Group\n\nhttp://taylorandfrancis.com\n\n## 1 深度学习背景\n\
    \n本节将介绍深度学习的基本原理。读完本章后，读者应具备必要的理论基础，能够理解本书后续处理地理空间数据所涉及的内容。\n\n### 1.1 什么是深度学习？\n\
    \n深度学习在解决许多图像处理任务中正变得越来越重要 [1]。在常见算法中，基于卷积神经网络和循环神经网络的系统在卫星和航空影像的许多应用中取得了最先进的成果。例如，用于目标识别的合成孔径雷达（SAR）解译\
    \ [2]、SAR 时间序列分类 [3]、参数反演 [4]、高光谱图像分类 [5]、异常检测 [6]、基于场景分类的甚高分辨率影像解译 [7, 8]、目标检测\
    \ [9]、图像检索 [10] 以及时间序列分类 [11]。深度学习还解决了遥感中的其他问题，例如数据融合（综述见 [12]），如多模态分类 [13]、全色锐化\
    \ [14] 和三维重建。\n\n深度学习指具有深层神经元层的人工神经网络（即有很多层）。人工神经元和边具有随着学习过程而调整的参数。受生物学启发，人工神经元是模拟神经元的数学函数。神经元参数（有时称为权重）是在训练步骤中优化的值。公式\
    \ 1.1 给出了一个基本人工神经元模型的示例。在该公式中，X 是输入，y 是输出，A 是增益值，b 是偏置值，f 是激活函数。在这个最小示例中，人工神经元的参数是增益和一个偏置值。增益与神经元的输入计算标量积，偏置加到标量积上。所得值被传入一个非线性函数，通常称为激活函数。\n\
    \ny = f(AX + b) = f[∑ᵢ (aᵢ × xᵢ) + b] (1.1)\n\n"
