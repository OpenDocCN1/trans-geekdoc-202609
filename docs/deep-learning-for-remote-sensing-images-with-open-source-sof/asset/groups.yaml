    \ library for training and inference on deep neural networks [17], initiated by\
    \ Google. It has become a popular open source deep learning framework, with a\
    \ large worldwide growing community of developers ref to figure 2.2.\n\n![](img/f70619500c7a30b0babf83918d56ad93_23_0.png)\n\
    \n**FIGURE 2.2**  \nThe TensorFlow library.\n\n# 2.2.1  APIs\n\nTensorFlow has\
    \ a powerful high-level Python API to build deep nets. Currently, TensorFlow uses\
    \ Keras which allows you to build networks from a higher implementation level.\
    \ TensorFlow also has a simple yet powerful C++ API to integrate deep nets in\
    \ C++ projects.\n\n# 2.2.2  Computations\n\nTensorFlow uses symbolic programming\
    \ that distinguishes definitions of computations from their proper execution.\
    \ In TensorFlow, tensors are abstraction objects of the operations and values\
    \ in the memory, simplifying manipulation regardless of the computing environment:\
    \ for instance, Central Processing Unit (CPU) or Graphical Processing Unit (GPU).\
    \ In TensorFlow, the so-called *model* consists of operations arranged into a\
    \ graph of nodes. Each node is an operation taking zero or more tensors as inputs,\
    \ and producing one or multiple tensors. This data flow graph defines the operations\
    \ (e.g. linear\n\n[^4]: forum.orfeo-toolbox.org"
