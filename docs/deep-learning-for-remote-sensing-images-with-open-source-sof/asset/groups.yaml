  - '[PAGE 17]


    # 1.2 Convolution


    Equation 1.2 shows how the result Y of a convolution with kernel K on input X
    is computed in dimension two (x and y are pixel coordinates). In this equation,
    Y and K are 2-dimensional matrices of real-valued numbers.


    $Y(x,y) = (X * K)(x,y) = \sum_{i} \sum_{j} X(x - i, y - j) \times K(i,j) \quad
    (1.2)$


    Because of the nature of the convolution, one CNN layer is composed of neurons
    with edges that are massively shared with the input: it can be assimilated to
    a small densely connected neural layer that performs the whole input locally (i.e.
    with connections to input restricted to a neighborhood of neurons). Generally,
    CNN layers are combined with non-linear activation functions and pooling operators.
    The convolution can be performed every Nth step in x and y dimensions: this is
    usually called the stride. The output of a convolution involving strides is described
    in equation 1.3, where $s_x$ and $s_y$ are the stride values in each dimension.


    $Y(x,y) = (X * K)(x,y) = \sum_{i} \sum_{j} X(x \times s_x - i, y \times s_y -
    j) \times K(i,j) \quad (1.3)$


    A convolution can be performed keeping the valid portion of the output, meaning
    that only the values of Y that are computed from every value of K over X are kept.
    In this case, the resulting output has a lower size than the input. It can also
    be performed over a padded input: zeros are added all around the input so that
    the output is computed at each location, even where the kernel doesn’t lay entirely
    inside the input. This is generally used to keep the input size through the convolution.
    However, the borders of the output are affected by the zeros of the padding. Figure
    1.2 shows how the stride and padding of the convolution affect the output size
    (the number of rows and columns of the resulting image) and the physical spacing
    (the physical size of the output pixel).'
  - "[PAGE 18]\n\n![](img/f70619500c7a30b0babf83918d56ad93_18_0.png)\n\n**FIGURE 1.2**\
    \  \nLeft: no padding, stride=2, **Center:** padding, stride=2, **Right:** padding,\
    \ stride=1. The output is the upside, white matrix, and the input is the blue\
    \ matrix at the bottom. The output **size** depends on the following parameters\
    \ of the convolution: padding, kernel size, and stride. The output **physical\
    \ spacing** is changed accordingly to the stride in the convolution: *n* strides\
    \ ensure that physical spacing is scaled by *n*.\n\n> **Important note**\n> \n\
    > - Non-unitary strides modify the output physical spacing.\n> - Without padding,\
    \ the output size is changed, depending on the kernel size.\n> - With padding,\
    \ the output size can be kept (same as the input, if no stride) but values at\
    \ the border might be contaminated by the zero padding.\n\n# 1.3  Pooling\n\n\
    Another important concept of CNNs is pooling, which is a form of non-linear downsampling.\
    \ Several non-linear functions can be implemented in pooling operations, among\
    \ which max pooling is the most common: it partitions the input image and for\
    \ each sub-region, outputs the maximum ref to figure 1.3. The intuition is that\
    \ the exact location of a feature is less important than its rough location relative\
    \ to other features. The pooling layer aims to progressively reduce the spatial\
    \ size of the representation, to reduce the number of parameters and amount of\
    \ computation in the network, and hence to also control overfitting. It is common\
    \ to periodically insert a pooling layer between successive convolutional layers\
    \ in a CNN architecture. The pooling operation"
  - "[PAGE 19]\n\nprovides another form of translation invariance. The pooling layer\
    \ operates independently on every depth slice of the input and resizes it spatially.\
    \ Like convolution with non-unitary stride, the pooling operators also modify\
    \ the output size.\n\n![](img/f70619500c7a30b0babf83918d56ad93_19_0.png)\n\n#\
    \ FIGURE 1.3\n\n2 × 2 max pooling with stride 2. Each 2 × 2 sub-region of the\
    \ image, the maximum value is kept.\n\n> **Important note**\n> Pooling, and convolutions\
    \ with stride, can be viewed as a subsampling process, which does modify the output\
    \ size, and the output physical spacing. Depending on the implementation, it can\
    \ also keep partially sampled items at borders.\n\n# 1.4 Activation functions\n\
    \nInspired from biology, the activation functions are usually an abstraction representing\
    \ the way a neuron will be activated (i.e. it will transmit its output value)\
    \ or not. Basically, the activation functions control the amount of what is actually\
    \ transmitted to output. There are many activation functions used in deep learning.\
    \ Among these, we can enumerate the following, which are common ones we will use\
    \ during this tutorial:\n\n+   1. The rectified linear unit returns a maximum\
    \ value between 0 and x:\n+   \n+      $$f(x) = max(0, x)$$<|message|>\n+   2.\
    \ A leaky rectified linear unit allows a small, positive gradient when the unit\
    \ is not active. It is parametrized with α, a scalar value:\n+   \n+      $$f(x)\
