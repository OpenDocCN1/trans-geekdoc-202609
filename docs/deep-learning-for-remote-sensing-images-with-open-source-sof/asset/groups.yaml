    # ### 2.3.2 Featured applications


    The remote module contains a set of new user-oriented applications. Among others,
    the key applications that will be used in this tutorial are the following:


    +   - **PatchesSampling** is dedicated to extraction of patches in multiple images.

    +   - **TensorflowModelTrain** can train a TensorFlow model from multiple input
    images.

    +   - **TensorflowModelServe** can run a TensorFlow model on multiple input images.


    There is also a set of composite applications, that chain together existing OTB
    applications and the above applications to perform state-of-the-art machine learning
    (e.g. combining Random Forest with features from deep learning). In the practice
    session, we will see how to use these new applications with remote sensing images.


    # ### 2.3.3 Principle


    As explained in section 2.2, TensorFlow provides APIs to allow developers to easily
    build deep nets. Once a deep net is built, it can be exported as a *SavedModel*,
    serialized as a Google Protobuf (language-neutral, platform-neutral, extensible
    mechanism for serializing structured data). This *SavedModel* includes the processing
    graph, and the variables of the model. It can then be used in the new OTB applications
    provided by the OTBTF remote module. OTBTF implements mechanisms to convert images
    into tensors that can feed the TensorFlow models, execute the model, and convert
    back the resulting tensors of the model into output images. Thanks to the streaming
    mechanism of OTB, there is no limitation on processed image size. A TensorFlow
    model is associated with its following intrinsic parameters, that must be given
    to OTBTF:


    +   1. **The receptive field:** as explained in section 1, the receptive field
    is the input volume that the model “sees” in the input space.

    +   2. **The expression field:** it describes the volume that the model “creates”
    in the output space.

    +   3. **Scale factor:** the scale factor describes the physical spacing change
    between one reference input (typically, the first input) and the output space.
    For instance, we consider a CNN that transforms a single'
  - '[PAGE 27]


    input into a single output, implementing a total of 2 pooling operators with stride
    2. Then the total scale factor is 4, meaning that the output spacing is multiplied
    by a factor of 4, and hence the output image size will be divided by 4 in each
    $x$ and $y$ dimension.


    The **TensorflowModelServe** application automatically computes the region propagation
    in the pipeline (i.e. from input images to output), and the output image information,
    which are two crucial steps to enable streaming. [Figure 2.3](#figure-2.3) illustrates
    how related the above deep nets parameters are in these steps.


    ![](img/f70619500c7a30b0babf83918d56ad93_27_0.png)


    # FIGURE 2.3


    Deep net parameters. The figure shows the incidence of two deep net parameters
    on region propagation and output image information. The two nets have the same
    Expression Field and Receptive field, but a different Scale Factor parameter ($F_{scale}=1$
    for the net on top, $F_{scale}=2$ for the net on bottom).


    The application computes regions of images that are aligned to the expression
    field, i.e. image regions which have a start index and a size that are a multiple
    of the expression field. When a requested output region lies across multiple aligned
    sub-regions, the TensorFlow model is run over the largest aligned region, and
    only the requested part is then kept ([figure 2.4](#figure-2.4)). This mechanism
    avoids blocking artifacts and ensures that the output is independent of the tiling
    layout used by the streaming manager, i.e. (i) seamless, if allowed by the model,
    and (ii) reproducible.'
