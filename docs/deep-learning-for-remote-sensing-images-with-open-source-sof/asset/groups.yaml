    # # 8 Dealing with multiple sources


    Deep nets can be used efficiently to deal with multiple heterogeneous sources,
    for instance, in implementing a number of branches tailored for each data source,
    that eventually merge together at some point to fuse the information. For example,
    it is easy to build a deep neural network that can deal simultaneously with time
    series and one very-high-resolution image: while one branch composed of a recurrent
    neural network processes the time series (for instance Sentinel-1 or Sentinel-2
    images), another branch composed of a CNN processes the high-resolution image
    (for instance Spot 6/7 images). Such approaches are available in the literature
    (for instance in [13]).


    This section will present how OTBTF can be used with any number of image sources.


    # ## 8.1 More sources?


    The number of sources in OTBTF applications can be controlled using the environment
    variable **OTB_TF_NSOURCES**. If this environment variable is undefined, the default
    value for the number of sources is 1. You can change it using the command line.
    In the following, we will use 2 sources from the Sentinel-2 image:


    +   1. Channels at 20-m spacing (Spectral bands 5, 6, 7, 8a, 11 and 12), stacked
    in a single raster

    +   2. Channels at 10-m spacing (Spectral bands 4, 3, 2 and 8), stacked in a single
    raster


    The architecture inputs two images at different resolution to derive a single
    output at the desired resolution. This architecture is inspired from [23].


    Let’s change the number of sources from the terminal:


    ```

    ```bash

    export OTB_TF_NSOURCES=2

    ```

    ```


    Then, you can check that the number of sources has been increased to 2 in every
    applications of OTBTF. For instance, type the following in the terminal:


    ```

    ```bash

    otbcli_PatchesExtraction -help

    ```

    ```'
