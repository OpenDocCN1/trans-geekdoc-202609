    # ## 5.2 Sampling


    The first step to apply deep learning techniques to real-world datasets is sampling.
    The existing framework of the Orfeo ToolBox offers great tools for pixel-wise
    or object-oriented classification/regression tasks. On the deep learning side,
    nets like CNNs are trained over patches of images rather than single-pixel batches.
    Hence the first application of OTBTF we will present targets patch sampling and
    is called **PatchesExtraction**.


    # ### 5.2.1  Selection


    The **PatchesExtraction** application integrates seamlessly in the existing sampling
    framework of OTB. The first step is the sample selection. It consists of selecting
    the locations of the center of the samples. There are currently two approaches
    depending on the type of the terrain truth format:


    +   - When terrain truth is **vector data**: typically one can use the **PolygonClassStatistics**
    and **SampleSelection** applications to select patch centers, then give them to
    the **PatchesExtraction** application.

    +   - When terrain truth is **raster data**: one can use the **LabelImageSampleSelection**
    application, which is part of the OTBTF remote module.


    Since our terrain truth is raster, we use the second approach. You can refer to
    the OTB CookBook[^1] to see how to perform the first approach.


    ```

