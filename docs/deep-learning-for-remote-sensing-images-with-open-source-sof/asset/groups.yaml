  md: "\n![](img/f70619500c7a30b0babf83918d56ad93_150_0.png)\n\n## FIGURE 18.1\n\n\
    Only $S1_t$, $S2_{t-1}$ and $S2_{t+1}$ inputs are used. Nodes related to training\
    \ (cost function, optimizer) are not used anymore at inference time. The $S2_t$\
    \ image is retrieved at the output of the model from the *prediction_fcn* tensor.\
    \ *prediction_fcn* is the exact output of the model, obtained in extracting the\
    \ center of the *prediction* tensor in the spatial dimensions.\n\n$S2_{t-1}$,\
    \ $S2_{t+1}$ and $S1_t$ are used to generate the output image $\\widehat{S2_t}$\
    \ that we name *Sentinel2_2019-07-25_estimated.tif*. Run the following command\
    \ line to generate the synthetic $\\widehat{S2_t}$ image:\n\n```bash\nexport OTB_TF_NSOURCES=3\n\
    otbcli_TensorflowModelServe \\\n-source1.il_sar_vh_hh_log_norm_EPSG32630.tif \\\
    \n-source1.rfieldx 576 -source1.rfieldy 576 \\\n-source1.placeholder \"s1\" \\\
    \n-source2.il_Sentinel2_2019-07-05_10m.tif \\\n-source2.rfieldx 576 -source2.rfieldy\
    \ 576 \\\n-source2.placeholder \"s2_before\" \\\n-source3.il_Sentinel2_2019-08-24_10m.tif\
    \ \\\n-source3.rfieldx 576 -source3.rfieldy 576 \\\n-source3.placeholder \"s2_after\"\
    \ \\\n-model.dir savedmodel_gapfill \\\n-model.fullyconv on \\\n-output.names\
    \ \"gen_fcn\" -output.efieldx 64 -output.efieldy 64 \\\n-out Sentinel2_2019-07-25_estimated.tif\n\
    ```\n\nOnce the image is generated, import it in QGIS and compare it visually\
    \ with the $S2_t$ image ([figure 18.2](figure 18.2)).\n\n```bash\n-im Sentinel2_2019-07-25_estimated.tif\
    \ \\\n-out valid_area_mask.tif uint8\n```\n\nAfter the rasterization is done,\
    \ we interpolate the $\\widehat{S}_{2t}$ image over the $S_{2t}$ image. Because\
    \ of the receptive field, the generated $\\widehat{S}_{2t}$ image is slightly\
    \ smaller than the $S_{2t}$ image. In order to conduct a pixel-wise operation\
    \ on pixels of both $S_{2t}$, $\\widehat{S}_{2t}$ and the binary mask, we must\
    \ superimpose the $S_{2t}$ image over the $\\widehat{S}_{2t}$ image. To perform\
    \ this operation, we use the **Superimpose OTB** application:\n\n```bash\notbcli_Superimpose\
    \ \\\n-inr Sentinel2_2019-07-25_estimated.tif \\\n-inm Sentinel2_2019-07-25_10m.tif\
    \ \\\n-out Sentinel2_2019-07-25_10m_superimposed.tif\n```\n\nWe can then compose\
    \ the final Sentinel-2 image, keeping the pixels in the valid areas, and replacing\
    \ the polluted ones with $\\widehat{S}_{2t}$. The **BandMathX OTB** application\
    \ allows us to create the final image. A mathematical expression is used to perform\
    \ the computation of the output pixel. **BandMathX** is able to identify the input\
    \ images and the input image bands in a mathematical expression. The **BandMathX**\
    \ expression is the following:\n\n$$im1b1==255\\ ?\\ im2\\ :\\ im3$$\n\nThe “?”\
    \ and “:” are ternary operators. The expression is interpreted as: If the binary\
    \ mask (i.e. $im1b1$: like “band #1” of image #1) is 255, then the pixel is polluted\
    \ and the output is the $S_{2t}$ image (i.e. $im2$: like “image #2”). Otherwise,\
    \ the output is the $\\widehat{S}_{2t}$ image (i.e. $im3$: like “image #3”). Run\
    \ the following command line to perform the final compositing step of the gapfilling:\n\
    \n```bash\notbcli_BandMathX \\\n-il valid_area_mask.tif \\\n    Sentinel2_2019-07-25_estimated.tif\
    \ \\\n    Sentinel2_2019-07-25_10m_superimposed.tif \\\n-exp \"im1b1==255 ? im2\
    \ : im3\" \\\n-out Sentinel2_2019-07-25_final.tif\n```\n\nNote that at this step,\
    \ we can also instead denormalize the image in inverting the equation 16.1.1,\
    \ i.e. multiplying $im2$ and $im3$ by 8192:\n\n```bash\notbcli_BandMathX \\\n\
    -il valid_area_mask.tif \\\n    Sentinel2_2019-07-25_estimated.tif \\\n    Sentinel2_2019-07-25_10m_superimposed.tif\
    \ \\\n-exp \"im1b1==255 ? 8192*im2 : 8192*im3\" \\\n-out Sentinel2_2019-07-25_final_16b.tif\
    \ int16\n```\n\nThe final image is ready. [Figure 18.3](#) shows the resulting\
    \ image imported in QGIS.\n\n![](img/f70619500c7a30b0babf83918d56ad93_153_0.png)\n\
    \n## FIGURE 18.3\n\nThe final image resulting from the gapfilling process.\n\n\
    images using stride 2 convolution, hence having 20-m physical spacing) with the\
    \ input image at 20 m.\n\nAnother useful modification of the model could be to\
    \ integrate the image normalization, avoiding some pre-processing, and saving\
    \ storage.\n\nThe introduced application, optical time series gapfilling using\
