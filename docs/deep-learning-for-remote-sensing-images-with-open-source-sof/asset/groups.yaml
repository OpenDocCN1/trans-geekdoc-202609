    - 4. `patches_valid_s2_2019-08-24.tif`\n\n## 16.3 扩展：使用 OTB Python API 自动化步骤\n\
    \n在本节中，我们提供关于使用 Orfeo ToolBox 的 Python API 的见解。不过，本节是可选的，可以跳过，因为它仅展示如何自动化之前为准备图块而执行的步骤。Python\
    \ API 使您能够在保留所谓流式机制（见 2.1.2）的同时连接内存中的 OTB 应用程序。OTB 应用程序可以实例化为 Python 对象，并使用相同的键/值标识符设置其参数：一旦实例化\
    \ OTB 应用程序对象，就可以使用专用方法设置其参数值。所有可在 OTB 应用程序中设置的参数都可以在 Python 实例中设置（例如整数、浮点或双精度数、字符串、图像、图像列表、矢量数据等）。因此，实现一个包含多个\
    \ OTB 应用程序链接在一起的完整流水线相当直接：我们实例化应用程序，设置其参数，并按所需方式将它们连接起来。流水线设置完成后，可以触发其执行以生成输出。\n\
