  - '[PAGE 22]


    # ## 2.1.1 Applications


    The Orfeo ToolBox applications aim to provide users a number of implemented algorithms.
    These applications can be used directly through multiple interfaces like command
    line, graphical user interface, and third-party software like QGIS for instance.
    For developers, applications can also be used from Python and C++ APIs. Each OTB
    application comes with a set of parameters. Parameters used in OTB applications
    are typed (images, vector data, file, folder, integer, floating, etc.) and this
    formalism makes the OTB applications usable through all interfaces and APIs.


    # ## 2.1.2 Streaming mechanism


    The streaming mechanism enables the processing of images several times on different
    regions. Instead of working on the entire data, which would require a lot of memory,
    blocks are processed one by one until the output data is produced. This mechanism
    preserves the memory footprint and enables the processing of very large data.
    Most of the algorithms implemented in OTB applications and C++ classes support
    this mechanism. The few algorithms that don’t implement the streaming mechanism
    require that all input and output data are stored in memory at execution.


    # ## 2.1.3 Remote modules


    For developers, OTB eases the integration and the deployment of new features thanks
    to the external modules. This mechanism enables you to standardize the development
    of components external to the library, such as a new OTB application. Remote modules
    allow anyone to extend the functionalities of OTB without being part of the core
    project repository. Remote modules can have different licenses than the main OTB
    repository. For instance, the OTBTF remote module that we will use in this tutorial,
    implements deep learning using the TensorFlow library. It is not in the core of
    the official OTB library, but provides applications that can be used as any other
    using the OTB application API.


    # ## 2.1.4 The Python API


    The Python API of the Orfeo ToolBox enables you to build pipelines using in-memory
    connection of existing OTB applications. The resulting pipeline still enforces
    the streaming mechanism. Another useful feature is the ability of using Numpy
    arrays in pipelines, as input or output of the OTB applications. The Python API
    is really great to build complex pipelines with already existing algorithmic blocks
    like the OTB applications (including the applications from remote modules). This
    book targets user-oriented interactions with OTB applications, and Python bindings
    are partially introduced in section 16.3.'
  md: "\n## 1.2 Convolution\n\nEquation 1.2 shows how the result Y of a convolution\
    \ with kernel K on input X is computed in dimension two (x and y are pixel coordinates).\
    \ In this equation, Y and K are 2-dimensional matrices of real-valued numbers.\n\
    \n$$Y(x,y) = (X * K)(x,y) = \\sum_{i} \\sum_{j} X(x - i, y - j) \\times K(i,j)\
    \ \\quad (1.2)$$\n\nBecause of the nature of the convolution, one CNN layer is\
    \ composed of neurons with edges that are massively shared with the input: it\
    \ can be assimilated to a small densely connected neural layer that performs the\
    \ whole input locally (i.e. with connections to input restricted to a neighborhood\
    \ of neurons). Generally, CNN layers are combined with non-linear activation functions\
    \ and pooling operators. The convolution can be performed every Nth step in x\
    \ and y dimensions: this is usually called the stride. The output of a convolution\
    \ involving strides is described in equation 1.3, where $s_x$ and $s_y$ are the\
    \ stride values in each dimension.\n\n$$Y(x,y) = (X * K)(x,y) = \\sum_{i} \\sum_{j}\
    \ X(x \\times s_x - i, y \\times s_y - j) \\times K(i,j) \\quad (1.3)$$\n\nA convolution\
    \ can be performed keeping the valid portion of the output, meaning that only\
    \ the values of Y that are computed from every value of K over X are kept. In\
    \ this case, the resulting output has a lower size than the input. It can also\
    \ be performed over a padded input: zeros are added all around the input so that\
    \ the output is computed at each location, even where the kernel doesn’t lay entirely\
    \ inside the input. This is generally used to keep the input size through the\
    \ convolution. However, the borders of the output are affected by the zeros of\
    \ the padding. Figure 1.2 shows how the stride and padding of the convolution\
    \ affect the output size (the number of rows and columns of the resulting image)\
    \ and the physical spacing (the physical size of the output pixel).\n\n![](img/f70619500c7a30b0babf83918d56ad93_18_0.png)\n\
    \n**FIGURE 1.2**  \nLeft: no padding, stride=2, **Center:** padding, stride=2,\
    \ **Right:** padding, stride=1. The output is the upper white matrix, and the\
    \ input is the blue matrix at the bottom. The output **size** depends on the following\
    \ parameters of the convolution: padding, kernel size, and stride. The output\
    \ **physical spacing** is changed accordingly to the stride in the convolution:\
    \ *n* strides ensure that physical spacing is scaled by *n*.\n\n> **Important\
    \ note**\n>\n> - Non-unitary strides modify the output physical spacing.\n> -\
    \ Without padding, the output size is changed, depending on the kernel size.\n\
    > - With padding, the output size can be kept (same as the input, if no stride)\
    \ but values at the border might be contaminated by the zero padding.\n\n## 1.3\
    \ Pooling\n\nAnother important concept of CNNs is pooling, which is a form of\
    \ non-linear downsampling. Several non-linear functions can be implemented in\
    \ pooling operations, among which max pooling is the most common: it partitions\
    \ the input image and for each sub-region, outputs the maximum value (see Figure\
    \ 1.3). The intuition is that the exact location of a feature is less important\
    \ than its rough location relative to other features. The pooling layer aims to\
    \ progressively reduce the spatial size of the representation, to reduce the number\
    \ of parameters and amount of computation in the network, and hence to also control\
    \ overfitting. It is common to periodically insert a pooling layer between successive\
    \ convolutional layers in a CNN architecture. The pooling operation provides another\
    \ form of translation invariance. The pooling layer operates independently on\
    \ every depth slice of the input and resizes it spatially. Like convolution with\
    \ non-unitary stride, the pooling operators also modify the output size.\n\n![](img/f70619500c7a30b0babf83918d56ad93_19_0.png)\n\
    \n**FIGURE 1.3**  \n2 × 2 max pooling with stride 2. In each 2 × 2 sub-region\
    \ of the image, the maximum value is kept.\n\n> **Important note**\n> Pooling,\
    \ and convolutions with stride, can be viewed as a subsampling process, which\
    \ does modify the output size, and the output physical spacing. Depending on the\
    \ implementation, it can also keep partially sampled items at borders.\n\n## 1.4\
    \ Activation functions\n\nInspired from biology, the activation functions are\
    \ usually an abstraction representing the way a neuron will be activated (i.e.\
    \ it will transmit its output value) or not. Basically, the activation functions\
    \ control the amount of what is actually transmitted to output. There are many\
    \ activation functions used in deep learning. Among these, we can enumerate the\
    \ following, which are common ones we will use during this tutorial:\n\n- 1. The\
    \ rectified linear unit returns a maximum value between 0 and x:\n\n  $$f(x) =\
    \ max(0, x)$$\n- 2. A leaky rectified linear unit allows a small, positive gradient\
    \ when the unit is not active. It is parametrized with α, a scalar value:\n\n\
    \  $$f(x) = \\begin{cases} x & \\text{if } x > 0, \\\\ \\alpha x & \\text{otherwise,}\
    \ \\end{cases}$$\n- 3. Sigmoid:\n\n  $$f(x) = \\frac{1}{1 + e^{-x}}$$\n- 4. Hyperbolic\
    \ tangent (Tanh), which is a shift-scaled sigmoid ($\\tanh(x) = 2 \\times \\operatorname{sigmoid}(2x)\
    \ - 1$):\n\n  $$f(x) = \\frac{e^x - e^{-x}}{e^x + e^{-x}}$$\n\n## 1.5 Challenges\
    \ ahead for deep learning with remote sensing images\n\nThere are still challenges\
    \ remaining ahead to process real-world remote sensing images with deep learning.\
    \ One crucial point is software implementation. Entering into deep learning requires\
    \ familiarity with a framework. Implementing new methods requires an extensive\
    \ programming background and deep learning knowledge. The tools must scale enough\
    \ to the huge size of real-world remote sensing images and datasets. In particular,\
    \ the image size problem is out of deep learning frameworks' scope. In computer\
    \ vision, popular problems and datasets are often related to small-sized and true-color\
    \ images. Many deep learning architectures must be redesigned to suit remote sensing\
    \ images. Another point is that algorithms presented in the literature often serve\
    \ one unique purpose and each new algorithm implementation requires new effort\
    \ and expertise to be applied on standardized geospatial data. Additionally, recent\
    \ studies have pointed out that using the features computed with deep nets in\
    \ machine learning algorithms like Support Vector Machines or Random Forests,\
    \ offers great opportunities. However, even if most remote sensing image processing\
    \ software implement a machine learning framework with such algorithms, only a\
    \ few of them enable the combination of deep learning algorithms with those already\
    \ implemented well-known machine learning algorithms.\n\nIn the next section,\
    \ we introduce the software that leverages all these issues.\n\n### 2.1.1 Applications\n\
    \nThe Orfeo ToolBox applications aim to provide users a number of implemented\
    \ algorithms. These applications can be used directly through multiple interfaces\
    \ like command line, graphical user interface, and third-party software like QGIS\
    \ for instance. For developers, applications can also be used from Python and\
    \ C++ APIs. Each OTB application comes with a set of parameters. Parameters used\
    \ in OTB applications are typed (images, vector data, file, folder, integer, floating,\
    \ etc.) and this formalism makes the OTB applications usable through all interfaces\
    \ and APIs.\n\n### 2.1.2 Streaming mechanism\n\nThe streaming mechanism enables\
    \ the processing of images several times on different regions. Instead of working\
    \ on the entire data, which would require a lot of memory, blocks are processed\
    \ one by one until the output data is produced. This mechanism preserves the memory\
    \ footprint and enables the processing of very large data. Most of the algorithms\
    \ implemented in OTB applications and C++ classes support this mechanism. The\
    \ few algorithms that don’t implement the streaming mechanism require that all\
    \ input and output data are stored in memory at execution.\n\n### 2.1.3 Remote\
    \ modules\n\nFor developers, OTB eases the integration and the deployment of new\
    \ features thanks to the external modules. This mechanism enables you to standardize\
    \ the development of components external to the library, such as a new OTB application.\
    \ Remote modules allow anyone to extend the functionalities of OTB without being\
    \ part of the core project repository. Remote modules can have different licenses\
    \ than the main OTB repository. For instance, the OTBTF remote module that we\
    \ will use in this tutorial, implements deep learning using the TensorFlow library.\
    \ It is not in the core of the official OTB library, but provides applications\
    \ that can be used as any other using the OTB application API.\n\n### 2.1.4 The\
    \ Python API\n\nThe Python API of the Orfeo ToolBox enables you to build pipelines\
    \ using in-memory connection of existing OTB applications. The resulting pipeline\
    \ still enforces the streaming mechanism. Another useful feature is the ability\
    \ of using Numpy arrays in pipelines, as input or output of the OTB applications.\
    \ The Python API is really great to build complex pipelines with already existing\
    \ algorithmic blocks like the OTB applications (including the applications from\
    \ remote modules). This book targets user-oriented interactions with OTB applications,\
    \ and Python bindings are partially introduced in section 16.3.\n"
  mdcn: "\n\n## 1.2 卷积\n\n公式 1.2 展示了在二维空间中（x 和 y 是像素坐标）用卷积核 K 对输入 X 进行卷积时，结果 Y 是如何计算的。在该公式中，Y\
    \ 和 K 是实数值的二维矩阵。\n\n$$Y(x,y) = (X * K)(x,y) = \\sum_{i} \\sum_{j} X(x - i, y -\
    \ j) \\times K(i,j) \\quad (1.2)$$\n\n由于卷积的性质，一个 CNN 层由若干神经元组成，这些神经元的边与输入大量共享：它可被比作一个小的密集连接神经层，在局部处理整个输入（即对输入的连接被限制在神经元的邻域内）。通常，CNN\
    \ 层会与非线性激活函数和池化算子结合使用。卷积可以在 x 和 y 维度上每隔 N 步执行一次：这通常称为步长。涉及步长的卷积输出如公式 1.3 所示，其中\
    \ $s_x$ 和 $s_y$ 分别是各维度的步长值。\n\n$$Y(x,y) = (X * K)(x,y) = \\sum_{i} \\sum_{j} X(x\
    \ \\times s_x - i, y \\times s_y - j) \\times K(i,j) \\quad (1.3)$$\n\n执行卷积时可以保留输出的有效部分，这意味着只保留\
    \ Y 中由 K 在 X 上每个值都参与计算得到的值。在这种情况下，得到的输出尺寸小于输入。它也可以在填充后的输入上执行：在输入周围添加零，使得即使卷积核并非完全位于输入内部，也能在每个位置计算出输出。这通常用于在卷积过程中保持输入尺寸不变。然而，输出边界会受到填充零的影响。图\
    \ 1.2 展示了卷积的步长和填充如何影响输出尺寸（结果图像的行数和列数）和物理间距（输出像素的物理尺寸）。\n\n![](img/f70619500c7a30b0babf83918d56ad93_18_0.png)\n\
    \n**图 1.2**  \n左侧：无填充，步长=2，**中间：** 有填充，步长=2，**右侧：** 有填充，步长=1。输出是上方的白色矩阵，输入是底部的蓝色矩阵。输出的**尺寸**取决于卷积的以下参数：填充、卷积核大小和步长。输出的**物理间距**随卷积中的步长相应改变：步长为\
    \ *n* 时，物理间距按 *n* 缩放。\n\n> **重要说明**\n>\n> - 非单位步长会改变输出的物理间距。\n> - 如果没有填充，输出大小会改变，具体取决于卷积核大小。\n\
    > - 如果有填充，输出大小可以保持不变（无步长时与输入相同），但边界值可能会受到零填充的污染。\n\n## 1.3 池化\n\nCNN 的另一个重要概念是池化，它是一种非线性下采样形式。池化操作可以实现多种非线性函数，其中最大池化最为常见：它将输入图像分区，并为每个子区域输出最大值（见图\
    \ 1.3）。其直觉是，特征的精确位置不如其相对于其他特征的粗略位置重要。池化层旨在逐步减小表示的空间尺寸，以减少网络中的参数数量和计算量，从而也控制过拟合。在\
    \ CNN 架构中，通常会在连续的卷积层之间定期插入池化层。池化操作提供了另一种形式的平移不变性。池化层独立地对输入的每个深度切片进行操作，并在空间上调整其大小。与非单位步长的卷积一样，池化算子也会改变输出尺寸。\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_19_0.png)\n\n**图 1.3**  \n步长为 2 的 2\
    \ × 2 最大池化。在图像的每个 2 × 2 子区域中，保留最大值。\n\n> **重要说明**\n> 池化和带步长的卷积可视为一种子采样过程，它确实会改变输出尺寸和输出物理间距。根据具体实现，它还可以在边界处保留部分采样的元素。\n\
    \n## 1.4 激活函数\n\n激活函数受生物学启发，通常是一种抽象，表示神经元是否会被激活（即传递其输出值）的方式。基本上，激活函数控制实际传递给输出的信息量。深度学习中使用了许多激活函数。其中，我们可以列举以下本教程中会常用的几种：\n\
    \n- 1. 线性整流单元（ReLU）返回 0 和 x 中的最大值：\n\n  $$f(x) = max(0, x)$$\n- 2. 带泄漏的线性整流单元（Leaky\
    \ ReLU）允许单元未激活时有一个小的正梯度。它以标量 α 为参数：\n\n  $$f(x) = \\begin{cases} x & \\text{if\
    \ } x > 0, \\\\ \\alpha x & \\text{otherwise,} \\end{cases}$$\n- 3. Sigmoid 函数：\n\
    \n  $$f(x) = \\frac{1}{1 + e^{-x}}$$\n- 4. 双曲正切函数（Tanh），它是平移缩放的 Sigmoid 函数（$\\\
    tanh(x) = 2 \\times \\operatorname{sigmoid}(2x) - 1$）：\n\n  $$f(x) = \\frac{e^x\
    \ - e^{-x}}{e^x + e^{-x}}$$\n\n## 1.5 遥感影像深度学习面临的挑战\n\n用深度学习处理真实世界的遥感影像仍然面临挑战。一个关键点是软件实现。进入深度学习领域需要熟悉某个框架。实现新方法需要广泛的编程背景和深度学习知识。工具必须具有足够的扩展性，以应对真实世界遥感影像和数据集的大尺寸。特别是，图像尺寸问题超出了深度学习框架的处理范围。在计算机视觉中，常见的问题和数据集通常与小尺寸和真彩色图像相关。许多深度学习架构必须重新设计以适应遥感影像。另一点是，文献中提出的算法往往服务于单一目的，每种新算法的实现都需要新的工作和专业知识，才能应用于标准化的地理空间数据。此外，最近的研究指出，在机器学习算法（如支持向量机或随机森林）中使用深度网络计算的特征，会带来巨大机会。然而，即使大多数遥感影像处理软件实现了带有此类算法的机器学习框架，也只有少数软件能将深度学习算法与那些已经实现的知名机器学习算法结合起来。\n\
    \n在下一节中，我们将介绍解决所有这些问题的软件。\n\n### 2.1.1 应用程序\n\nOrfeo ToolBox 应用程序旨在为用户提供大量已实现的算法。这些应用程序可以直接通过多种接口使用，例如命令行、图形用户界面以及\
    \ QGIS 等第三方软件。对于开发者，应用程序也可以通过 Python 和 C++ API 使用。每个 OTB 应用程序都附带一组参数。OTB 应用程序中使用的参数是类型化的（图像、矢量数据、文件、文件夹、整数、浮点数等），这种形式化机制使\
    \ OTB 应用程序能够通过所有接口和 API 使用。\n\n### 2.1.2 流式处理机制\n\n流式处理机制使图像可以在不同区域上多次处理。它不是处理整个数据（这需要大量内存），而是逐块处理，直到生成输出数据。这种机制将内存占用维持在可控范围，并支持处理非常大的数据。OTB\
    \ 应用程序和 C++ 类中实现的大多数算法都支持这种机制。少数未实现流式处理机制的算法在执行时需要将所有输入和输出数据存储在内存中。\n\n### 2.1.3\
    \ 远程模块\n\n对于开发者而言，OTB 借助外部模块简化了新功能的集成和部署。这种机制使你可以标准化库外部组件的开发，例如新的 OTB 应用程序。远程模块允许任何人在不加入核心项目存储库的情况下扩展\
    \ OTB 的功能。远程模块可以采用与 OTB 主存储库不同的许可证。例如，我们将在本教程中使用的 OTBTF 远程模块使用 TensorFlow 库实现深度学习。它不在官方\
    \ OTB 库的核心中，但提供的应用程序可以像其他任何应用程序一样通过 OTB 应用程序 API 使用。\n\n### 2.1.4 Python API\n\
    \nOrfeo ToolBox 的 Python API 使你可以将现有 OTB 应用程序在内存中连接起来构建流水线。生成的流水线仍然强制执行流式处理机制。另一个有用的功能是能够在流水线中使用\
    \ Numpy 数组，作为 OTB 应用程序的输入或输出。Python API 非常适合利用已有的算法模块（如 OTB 应用程序，包括来自远程模块的应用程序）构建复杂的流水线。本书面向用户与\
    \ OTB 应用程序的交互，Python 绑定将在 16.3 节中部分介绍。\n\n"
