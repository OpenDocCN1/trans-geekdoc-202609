    \ we do not intend to cover this topic in this book). To export the *SavedModel*,\
    \ use the Python code located in the *Python* folder of OTBTF named *ckpt2savedmodel.py*.\n\
    \n```bash\n# Convert the checkpoint into a SavedModel\npython /work/otb/otb/Modules/Remote/otbtf/python/ckpt2savedmodel.py\
    \ \\\n--ckpt_model checkpoint-199 \\\n--inputs \"s1:0\" \"s2_before:0\" \"s2_after:0\"\
    \ \\\n--outputs \"gen_cn:0\" \\\n--model savedmodel_gapfill\n```\n\nAfter the\
    \ command run, a new folder that contains the *SavedModel* should have been created\
    \ (*savedmodel_gapfill*).\n\n## 18 Inference\n\nWe will apply the previously exported\
    \ *SavedModel* on the Sentinel-1 and Sentinel-2 images.\n\n### 18.1 Inputs and\
    \ outputs\n\nAt inference time, only the inputs for $S1_t$, $S2_{t-1}$ and $S2_{t+1}$\
    \ are fed to the model. The $\\bar{S2}_t$ input is not used anymore: we only care\
    \ about retrieving the $S2_t$ image at the output of the model.\n\nAnother important\
    \ point is the output used to retrieve $S2_t$. As explained in section 12.2.2.1,\
    \ computing the *exact* output of a fully convolutional model is one strategy\
    \ to avoid blocking artifacts. For this purpose, we compute the *exact* output\
    \ of the model in extracting the center of the final convolution output. We then\
    \ remove 256 pixels from each side of the output tensor named *prediction_fcn*\
    \ in the spatial dimensions. The corresponding tensor, named *prediction_fcn*,\
    \ is used as output for $S2_t$. Removing 256 pixels from each side of the spatial\
    \ dimensions of the output tensor is equivalent to using a model that inputs virtual\
    \ patches of 576 × 576 and produces a field of 64 × 64 pixels. Note that very\
    \ deep models can lead to a significant theoretical margin to remove. When this\
    \ margin is too large, one is advised to analyze the effect of the margin on the\
    \ output, to find a practical setting. The practical margin should be large enough\
    \ to avoid blocking artifacts, and small enough to reasonably impact the shrinking\
    \ of the model output. In the OTBTF formalism, our network has hence a receptive\
    \ field of 576 × 576 pixels, and an output *expression field* of 64 × 64 pixels.\
    \ Figure 18.1 presents the model used at inference time.\n\n### 18.2 Generating\
    \ the image\n\nSince the output is *prediction_fcn*, the image can be efficiently\
    \ processed by blocks without tiling artifacts. We apply the model on the inputs\n"
  mdcn: "\n\n#### 16.3.2 运行流水线\n\n下面是通过命令行运行程序以生成训练图像块的方法。要生成验证图像块，只需替换输入矢量数据的名称，并更改输出图像块的名称。\n\
    \n```bash\n# Run the pipeline to generate the patches for training\npython preprocess_gapfill.py\
    \ \\\n--locations patches_centroids_train.gpkg \\\n--img_list_s2_before \\\n \
    \   T30TYQ_20190705T105031_B04_10m.jp2 \\\n    T30TYQ_20190705T105031_B03_10m.jp2\
