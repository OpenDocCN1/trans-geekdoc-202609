    source3.out\", params.out_patches_s2_after)\napp_patches.AddImageToParameterInputImageList(\"\
    source4.il\",\n    app_s1_resampled.GetParameterOutputImage(\"out\"))\napp_patches.SetParameterString(\"\
    source4.out\", params.out_patches_s1_t)\n\n# Set all sources patches sizes to\
