  mdcn: "\n\n![](img/f70619500c7a30b0babf83918d56ad93_150_0.png)\n\n## 图 18.1\n\n\
    仅使用 $S1_t$、$S2_{t-1}$ 和 $S2_{t+1}$ 作为输入。与训练相关的节点（代价函数、优化器）在推理时不再使用。在模型输出端，从 *prediction_fcn*\
    \ 张量中获取 $S2_t$ 图像。*prediction_fcn* 是模型的精确输出，通过在空间维度上提取 *prediction* 张量的中心得到。\n\
    \n$S2_{t-1}$、$S2_{t+1}$ 和 $S1_t$ 用于生成输出图像 $\\widehat{S2_t}$，我们将其命名为 *Sentinel2_2019-07-25_estimated.tif*。运行以下命令行以生成合成的\
    \ $\\widehat{S2_t}$ 图像：\n\n```bash\nexport OTB_TF_NSOURCES=3\notbcli_TensorflowModelServe\
    \ \\\n-source1.il_sar_vh_hh_log_norm_EPSG32630.tif \\\n-source1.rfieldx 576 -source1.rfieldy\
    \ 576 \\\n-source1.placeholder \"s1\" \\\n-source2.il_Sentinel2_2019-07-05_10m.tif\
    \ \\\n-source2.rfieldx 576 -source2.rfieldy 576 \\\n-source2.placeholder \"s2_before\"\
    \ \\\n-source3.il_Sentinel2_2019-08-24_10m.tif \\\n-source3.rfieldx 576 -source3.rfieldy\
    \ 576 \\\n-source3.placeholder \"s2_after\" \\\n-model.dir savedmodel_gapfill\
    \ \\\n-model.fullyconv on \\\n-output.names \"gen_fcn\" -output.efieldx 64 -output.efieldy\
    \ 64 \\\n-out Sentinel2_2019-07-25_estimated.tif\n```\n\n图像生成后，将其导入 QGIS，并与 $S2_t$\
    \ 图像进行目视比较（[图 18.2](figure 18.2)）。\n\n```bash\n-im Sentinel2_2019-07-25_estimated.tif\
    \ \\\n-out valid_area_mask.tif uint8\n```\n\n栅格化完成后，我们将 $\\widehat{S}_{2t}$ 图像叠加到\
    \ $S_{2t}$ 图像上。由于感受野的原因，生成的 $\\widehat{S}_{2t}$ 图像比 $S_{2t}$ 图像略小。为了对 $S_{2t}$、$\\\
    widehat{S}_{2t}$ 和二值掩膜的像素进行逐像素运算，我们必须将 $S_{2t}$ 图像叠加到 $\\widehat{S}_{2t}$ 图像上。为此，我们使用\
    \ **Superimpose OTB** 应用：\n\n```bash\notbcli_Superimpose \\\n-inr Sentinel2_2019-07-25_estimated.tif\
    \ \\\n-inm Sentinel2_2019-07-25_10m.tif \\\n-out Sentinel2_2019-07-25_10m_superimposed.tif\n\
    ```\n\n然后，我们可以合成最终的 Sentinel-2 图像，保留有效区域内的像素，并用 $\\widehat{S}_{2t}$ 替换受污染像素。**BandMathX\
    \ OTB** 应用允许我们创建最终图像。我们使用一个数学表达式来计算输出像素。**BandMathX** 能够在数学表达式中识别输入图像和输入图像的波段。**BandMathX**\
    \ 表达式如下：\n\n$$im1b1==255\\ ?\\ im2\\ :\\ im3$$\n\n“？”和“：”是三元运算符。该表达式的含义是：如果二值掩膜（即\
    \ $im1b1$：图像 #1 的“波段 #1”）为 255，则该像素受污染，输出为 $S_{2t}$ 图像（即 $im2$：图像 #2）。否则，输出为 $\\\
    widehat{S}_{2t}$ 图像（即 $im3$：图像 #3）。运行以下命令行以执行缺口填充的最后合成步骤：\n\n```bash\notbcli_BandMathX\
    \ \\\n-il valid_area_mask.tif \\\n    Sentinel2_2019-07-25_estimated.tif \\\n\
    \    Sentinel2_2019-07-25_10m_superimposed.tif \\\n-exp \"im1b1==255 ? im2 : im3\"\
    \ \\\n-out Sentinel2_2019-07-25_final.tif\n```\n\n请注意，在此步骤中，我们也可以改为通过反转方程 16.1.1\
    \ 对图像进行去归一化，即将 $im2$ 和 $im3$ 乘以 8192：\n\n```bash\notbcli_BandMathX \\\n-il valid_area_mask.tif\
    \ \\\n    Sentinel2_2019-07-25_estimated.tif \\\n    Sentinel2_2019-07-25_10m_superimposed.tif\
    \ \\\n-exp \"im1b1==255 ? 8192*im2 : 8192*im3\" \\\n-out Sentinel2_2019-07-25_final_16b.tif\
    \ int16\n```\n\n最终图像生成完毕。[图 18.3](#) 展示了导入 QGIS 后的结果图像。\n\n![](img/f70619500c7a30b0babf83918d56ad93_153_0.png)\n\
    \n## 图 18.3\n\n缺口填充过程得到的最终图像。\n\n使用步长为 2 的卷积（因此物理间距为 20 米）的图像与 20 米处的输入图像。\n\n\
    模型的另一个有用的改进是集成图像归一化，从而避免一些预处理并节省存储空间。\n\n所介绍的应用——使用深度卷积自编码器进行光学时间序列缺口填充——展示了深度神经网络如何轻松组合具有不同模态、物理分辨率和光谱分辨率的多源数据。虽然我们通过这一特定应用展示了深度学习的多功能性，但我们毫不怀疑，遥感领域的大量问题都可以通过精心定制的深度学习架构来解决。\n\
