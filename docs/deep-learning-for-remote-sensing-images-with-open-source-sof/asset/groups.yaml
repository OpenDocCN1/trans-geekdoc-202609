    ### 7.1 原理\n\n我们将使用 Orfeo ToolBox 中已实现的算法，并使用来自我们深度网络的特征。整个工作流程在图 7.1 中进行了总结。\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_63_0.png)\n\n**图 7.1**  \n混合深度网络与随机森林的混合分类工作流程。\n\
    \n在第 5.3.2 节中，我们描述了模型的内部结构。特别是，在最后的神经元上计算类别伪概率之前，我们的模型会计算一些特征，如图 7.2 所示。这是通过将最后一个卷积算子的输出重塑为二维向量来完成的：一个维度用于批大小，该维度不是固定的，另一个维度用于特征的组件，该维度是固定的（32\
    \ 个元素）。在 TensorFlow 模型中，一旦算子具有名称，就可以在推理期间获取其结果。\n\n由于执行此操作的 *tf.reshape* 算子命名为\
    \ **features**，因此可以使用 **TensorflowModelServe** 应用程序使用前面章节中描述的相同机制为整个图像生成 *features*。\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_64_0.png)\n\n**图 7.2**\n\n模型输出名为“*features*”的张量。由\
    \ 6 个神经元组成的密集层的输出未被使用。仅使用网络计算“*features*”，分类则使用另一个分类器执行。\n\n这使我们能够使用 **TensorflowModelServe**\
    \ 为图像的像素生成 *features* 输出张量，然后将得到的像素用作训练随机森林（使用 **TrainImagesClassifier** 应用程序）的特征。一旦生成\
    \ RF 规则，就可以使用它根据每个像素上计算的深度特征对整个图像进行分类。\n\n### 7.2 OTB 中复合应用程序概述\n\n在 OTB 中，复合应用程序是由多个应用程序连接而成。通常，一个应用程序的输入可以来自另一个应用程序的输出，而不必从文件中读取。主要好处是避免了临时文件的读写，这\
    \ (i) 节省了一些磁盘空间，(ii) 有助于在 I/O 为瓶颈时减少处理时间。第 2.1.2 节中介绍的流式处理机制能够通过将请求的图像部分拆分为多个区域来处理大型图像。涉及具有流式处理支持的应用程序的复合应用程序也受益于该机制。\n\
    \n在 OTBTF 中目前有两个复合应用程序。\n\n- **TrainClassifierFromDeepFeatures**，它将我们的模型服务应用程序\
    \ (**TensorflowModelServe**) 重用为 *TrainImagesClassifier* 的输入，以基于第一个应用程序中给出的深度网络的特征训练机器学习算法。\n"
