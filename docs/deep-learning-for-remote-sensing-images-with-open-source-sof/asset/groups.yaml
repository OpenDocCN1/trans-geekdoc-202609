    # 16.3 More: automate steps with the OTB Python API


    In this section, we provide insight on the use of the Python API of the Orfeo
    ToolBox. This section is, however, optional, and can be skipped since it only
    shows how to automate the steps previously performed to prepare the patches. The
    Python API enables you to connect in-memory OTB applications in preserving the
