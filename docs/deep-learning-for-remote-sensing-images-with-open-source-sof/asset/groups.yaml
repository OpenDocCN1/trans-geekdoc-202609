  - "[PAGE 106]\n\nAs can be noticed, we use convolutions and transposed convolutions\
    \ which retain the size of the output features (*padding=\"same\"*), meaning that\
    \ zero padding is used in convolutions. We should understand that we can’t use\
    \ the features computed in the last layer directly, if we want to use this model\
    \ in fully convolutional mode: for each processed block, only a subset would be\
    \ exact, meaning similar, regardless of the input region. Using the output would\
    \ produce some blocking artifacts caused by the zero padding in the convolutions.\n\
    \n# ### 12.2.2.1  Exact output\n\nTo cope with that, we create an output dedicated\
    \ to the computation of the *exact* part of the *prediction* output tensor. For\
    \ this, we simply remove a few pixels from the borders of the output since the\
    \ convolutions “pollute” the borders at each layer, as illustrated in [figure\
    \ 12.10](#figure-12-10).\n\n![](img/f70619500c7a30b0babf83918d56ad93_106_0.png)\n\
    \n**FIGURE 12.10**  \nAt each layer, the feature maps are contaminated by the\
    \ zero padding of the convolutions. Blocks with orange borders: features; blocks\
    \ filled in orange: valid parts of feature maps. The *exact* part of the final\
