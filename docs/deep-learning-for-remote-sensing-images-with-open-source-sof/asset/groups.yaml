    \ Marmande 数据集的感兴趣区域。\n\n下面，我们详细介绍如何下载产品。如第 4 节所述，我们将使用欧洲空间局数据服务平台下载在 **T30TYQ**\
    \ 分幅上获取的 Sentinel-2 影像，日期如下：\n\n- 2019/07/05，作为 $S2_{t-1}$\n- 2019/07/25，作为 $S2_t$\n\
    - 2019/08/24，作为 $S2_{t+1}$\n\n下面，我们描述下载产品的步骤。首先，登录欧洲空间局数据服务平台。¹ 然后，搜索具有以下属性的产品：\n\
