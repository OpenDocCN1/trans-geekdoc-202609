    ## Discussion


    This part provided insight into semantic segmentation on remote sensing images.
    We have introduced semantic segmentation using a U-Net-like architecture, a popular
    model targeting semantic segmentation of images.


    We have built and used a small model to classify the buildings over one entire
    remote sensing image, without any limitation regarding its size, and in reasonable
    time.


    We saw that, unlike the patch-based approach, semantic segmentation employs models
    that preserve the spatial resolution of the output. However, we have also understood
    that this kind of model must be trained from densely annotated images: the training
    step requires patches of images that are fully annotated, i.e. each pixel of the
    image has a corresponding class label. This complicates the elaboration of reference
    data, however more and more open data are available (e.g. OpenStreetMap).


    We presented a simple framework to prepare, select and extract those patches in
    the remote sensing images, and from a rasterized OpenStreetMap vector layer of
    building footprints.


    We built a small modified U-Net model that inputs a pansharpened SPOT image, and
    generates a land cover map. Thanks to the so-called skip-connections, that reuse
    the features computed from different scales within the network, our model has
    preserved the semantic details. An interesting extension of this exercise could
    be to skip the pansharpening step, and directly fuse the multispectral channels
    in the network. This could be realized with a two-branch encoder that separately
    inputs the panchromatic channel at 1.5 m and the multispectral image at 6.0 m.
    The two feature maps obtained at the same scale could then be concatenated. For
    instance, after two strided convolutions, feature maps of the panchromatic encoder
    branch would have the same physical spacing as the multispectral image (or its
    feature maps, if no stride in the multispectral encoder branch) and thus could
    be concatenated together.


    We also presented a method to properly use fully convolutional models on very
    large images, avoiding blocking artifacts: we have extracted the central area
    of the model output, that represents the valid result of the convolutions, to
    compute in a fully convolutional fashion large regions of the input image. Among
    other benefits of this approach are reproducibility (one can process an entire
    image, or a subset: result will be identical) and speed.


    It should be noted that deep learning also offers plenty of architectures for
    semantic segmentation, and each year new models emerge with various different
    strategies. To name a few, we can cite DeepLab [26], which uses the atrous convolutions,
    or PSPNet [27], which uses a Pyramid Pooling Module.


    Deep learning is a growing trend, and each year new approaches appear. We have
    no doubt that in the near future, plenty of new methods for semantic segmentation
    will appear, leveraging the remaining difficulties ahead, semantic segmentation
    model training, and particularly regarding data availability.


    ## Part IV


    ## Image restoration


    exploiting available multi-temporal optical images, and one SAR image which is
    acquired in the same time as the polluted image. The approach aims to restore
    gaps in the optical image to provide a cloud-free product, and has shown superior
    results compared to traditional gapfilling (i.e. linear interpolation or linear
    regression) in terms of root mean squared error. Given $t$, the time stamp of
    the optical image polluted by clouds (denoted $S2_t$), the method uses one SAR
    image acquired at $t$ (denoted $S1_t$), and a couple of available cloud-free optical
    images acquired before and after $t$ (respectively denoted $S2_{t-1}$ and $S2_{t+1}$),
    to estimate a synthetic optical image at $t$ (denoted $\widehat{S2_t}$) that can
    be used to fill the missing values of the actual optical image $S2_t$. We intend
    to estimate $\widehat{S2_t}$ from $S2_{t-1}$, $S1_t$, $S2_{t+1}$ using a deep
    neural network called a *deep convolutional autoencoder*, which is trained over
    the available parts of the images (illustrated in figure 14.1). We focus on the
    minimization of the spread between the cloud-free parts of the target image (i.e.
    the ground truth), and the estimated image generated from our deep network. The
    training of our deep network hence consists of minimizing a cost function that
    evaluates the distance between $\widehat{S2_t}$ and $S2_t$ images in terms of
    $L_2$ loss. We assume that the SAR image and the optical images cover the same
    physical extent and are superimposed over the same physical pixel grid, meaning
    they share the same coordinate reference system, origin, physical pixel spacing,
    and size. We also assume that optical images have the same number of components
    per pixel (i.e. same number of spectral bands). In the following, we will use
    these notations for the images:


    - $S2_{t-1}$ for the optical image acquired at date $t-1$

    - $S1_t$ for the SAR image acquired at a date close to $t$

    - $S2_{t+1}$ for the optical image acquired at date $t+1$

    - $\widehat{S2_t}$ for the estimated optical image acquired at date $t$

    - $S2_t$ for the actual optical image acquired at the date $t$


    ![](img/f70619500c7a30b0babf83918d56ad93_117_0.png)


    **FIGURE 14.1** Our deep-learning-based approach for optical image gapfilling.
    The deep convolutional autoencoder is trained with every available source (the
    optical images $S2_{t-1}$, $S2_t$, $S2_{t+1}$ and the SAR image $S1_t$), for the
    purpose of estimating the $\widehat{S2_t}$ image.


    ### 14.3 Architecture


    Our network inherits from the U-Net architecture described in [25]. As we mentioned
    in chapter 10, U-Net is a popular model used in semantic labeling or image-to-image
    translation. Our architecture is presented in figure 14.2. The main differences
    between our architecture and the original U-Net, is that we have three inputs
    instead of one, hence three encoder branches. Each encoder branch of the model
    encodes, respectively, the input images $S2_{t-1}$, $S1_t$ and $S2_{t+1}$ into
    a feature map called the bottleneck. This bottleneck is the concatenation of the
    last feature maps of the encoders. The second part of the network decodes this
    bottleneck to retrieve the estimated image $\widehat{S2_t}$.


    ![](img/f70619500c7a30b0babf83918d56ad93_117_1.png)


    **FIGURE 14.2** Architecture used for optical image gapfilling.


    ### 14.3.1 Encoder


    Each encoder implements a convolutional neural network with strides. It consists
    of successive 4 × 4 convolutions with stride 2 to downsample the input. Each convolution
    is followed by a leaky rectified linear unit (LReLU). The first outputs a feature
    map which has a depth of 64, and the feature map’s depth is doubled at each convolution
    except for the two last layers. We denote $C_k$ as a block composed of the following:


    - 1. Convolution with k filters

    - 2. LReLU layer

    - 3. Batch normalization layer [35]

    - 4. Dropout layer


    Each encoder is composed as follows: $C_{64}$-$C_{128}$-$C_{256}$-$C_{512}$-$C_{512}$-$C_{512}$.


    ### 14.3.2 Decoder


    The decoder is built as the mirror of the encoder. It consists of successive 4
    × 4 transposed convolutions with stride 2 to upsample the input. The first transposed
    convolution inputs the 512-element-depth bottleneck feature maps. The depth of
    the feature maps is divided by 2 at each transposed convolution. Each transposed
    convolution is followed by a rectified linear unit (ReLU). It is then concatenated
    with the corresponding feature maps from the encoder. The main difference between
    our architecture and the original U-Net is that it has three encoder branches
    that are stacked together as the bottleneck. The last transposed convolution outputs
    a 4-element-depth feature map, which corresponds to the number of channels of
    the Sentinel-2 image, followed by a hyperbolic tangent unit. We denote $C_k^{tr}$
    as a block containing the following:


    - 1. A transposed convolution with k filters

    - 2. ReLU

    - 3. Batch normalization

    - 4. Dropout layer


    We also denote $CH_k^{tr}$ as a transposed convolution with k filters + a hyperbolic
    tangent layer. The decoder is composed as follows: $C_{512}^{tr}$-$C_{512}^{tr}$-$C_{256}^{tr}$-$C_{128}^{tr}$-$C_{64}^{tr}$-$CH_4^{tr}$.


    In most building blocks, we use dropout to avoid overfitting. As our network has
    a total of 6 levels of convolutions/transposed convolutions, it is suited to input
    64×64 input patches of ($S2_{t-1}$, $S1_t$, $S2_{t+1}$) to estimate 64×64 output
    patches of $\widehat{S2_t}$.

