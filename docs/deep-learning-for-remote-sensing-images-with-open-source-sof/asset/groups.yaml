    Sometimes, the OSM vector data is not fully annotated and many polygons are missing
    in some regions. In this case, you can manually clean the vector data, removing
    portions of patches that are not actually fully annotated. This is a common issue
    that you can encounter with OSM data. Luckily, OSM data is quite well annotated
    in our *Amsterdam* dataset.


    # 12.1.3.2  Patch position selection


    Now, we want to extract centroids of those valid patches that we previously have
    pre-selected. From the QGIS menu, select **Vector**, then **Geometry tools**,
