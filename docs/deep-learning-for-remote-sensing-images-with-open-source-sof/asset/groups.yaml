    \ kernel_size=[3,3],\n                             padding=\"valid\", activation=tf.nn.relu)\n\
    \    # conv3 out size: 8x8x16\n    conv4 = tf.layers.conv2d(inputs=conv3, filters=32,\
    \ kernel_size=[3,3],\n                             padding=\"valid\", activation=tf.nn.relu)\n\
    \    # conv4 out size: 6x6x32\n    conv5 = tf.layers.conv2d(inputs=conv4, filters=32,\
    \ kernel_size=[3,3],\n                             padding=\"valid\", activation=tf.nn.relu)\n\
    \    # conv5 out size: 4x4x32\n    conv6 = tf.layers.conv2d(inputs=conv5, filters=32,\
    \ kernel_size=[3,3],\n                             padding=\"valid\", activation=tf.nn.relu)\n\
    \    # conv6 out size: 2x2x32\n```\n\n[^1]: https://github.com/remicres/otbtf_tutorials_resources\n\
    \n"
