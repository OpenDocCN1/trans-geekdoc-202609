    ## 讨论


    本节深入探讨了遥感图像上的语义分割。我们介绍了一种使用类U-Net架构的语义分割方法，这是一种针对图像语义分割的流行模型。


    我们构建并使用了一个小型模型，对一整幅遥感图像中的建筑物进行分类，不受图像尺寸限制，且在合理时间内完成。


    我们看到，与基于块的方法不同，语义分割采用的模型保留了输出的空间分辨率。然而，我们也认识到这类模型必须使用密集标注的图像进行训练：训练步骤需要完全标注的图像块，即图像的每个像素都有对应的类别标签。这使得参考数据的制作变得复杂，不过越来越多的开放数据可用（例如OpenStreetMap）。


    我们提出了一个简单框架，用于准备、选择和提取遥感图像中的这些图像块，以及从建筑物足迹的栅格化OpenStreetMap矢量图层中提取。


    我们构建了一个小型改进型U-Net模型，输入全色锐化的SPOT图像，生成土地覆盖图。得益于所谓的跳跃连接，该连接复用了网络内不同尺度计算的特征，我们的模型保留了语义细节。本练习的一个有趣扩展是跳过全色锐化步骤，直接在网络中融合多光谱通道。这可以通过一个双分支编码器实现，分别输入1.5米分辨率的全色通道和6.0米分辨率的多光谱图像。然后可以将在同一尺度上获得的两个特征图拼接起来。例如，经过两次步进卷积后，全色编码器分支的特征图将与多光谱图像（或其特征图，如果多光谱编码器分支中没有步进）具有相同的物理间距，因此可以拼接在一起。


    我们还提出了一种在超大图像上正确使用全卷积模型的方法，避免块状伪影：我们提取了模型输出的中心区域，该区域代表卷积的有效结果，以全卷积方式计算输入图像的大区域。这种方法的其他优点包括可重复性（可以处理整幅图像或子集：结果将相同）和速度。


    应当指出，深度学习也为语义分割提供了大量架构，每年都会出现采用各种不同策略的新模型。举几个例子，我们可以引用DeepLab [26]，它使用空洞卷积；或PSPNet
    [27]，它使用金字塔池化模块。


    深度学习是一个日益增长的趋势，每年都有新方法出现。我们毫不怀疑，在不久的将来，将会出现大量新的语义分割方法，以应对剩余的困难、语义分割模型训练，尤其是数据可用性方面的问题。


    ## 第四部分


    ## 图像恢复


    利用可用的多时相光学图像，以及一幅与受污染图像同时获取的SAR图像。该方法旨在恢复光学图像中的间隙，以提供无云产品，并且在均方根误差方面，与传统填补方法（即线性插值或线性回归）相比显示出更优的结果。给定
    $t$，即被云污染的光学图像（记为 $S2_t$）的时间戳，该方法使用一幅在 $t$ 时刻获取的SAR图像（记为 $S1_t$），以及几幅在 $t$ 前后获取的无云光学图像（分别记为
    $S2_{t-1}$ 和 $S2_{t+1}$），来估计 $t$ 时刻的合成光学图像（记为 $\widehat{S2_t}$），该图像可用于填补实际光学图像
    $S2_t$ 的缺失值。我们打算使用一种称为*深度卷积自编码器*的深度神经网络，从 $S2_{t-1}$、$S1_t$、$S2_{t+1}$ 估计 $\widehat{S2_t}$，该网络在图像可用部分上进行训练（如图14.1所示）。我们专注于最小化目标图像的无云部分（即真实值）与我们的深度网络生成的估计图像之间的差异。因此，我们深度网络的训练包括最小化一个代价函数，该函数以
    $L_2$ 损失评估 $\widehat{S2_t}$ 和 $S2_t$ 图像之间的距离。我们假设SAR图像和光学图像覆盖相同的物理范围，并叠加在相同的物理像素网格上，这意味着它们共享相同的坐标参考系统、原点、物理像素间距和大小。我们还假设光学图像每像素具有相同数量的分量（即相同数量的光谱波段）。在下文中，我们将对这些图像使用以下符号：


    - $S2_{t-1}$：在日期 $t-1$ 获取的光学图像

    - $S1_t$：在接近 $t$ 的日期获取的SAR图像

    - $S2_{t+1}$：在日期 $t+1$ 获取的光学图像

    - $\widehat{S2_t}$：在日期 $t$ 获取的估计光学图像

    - $S2_t$：在日期 $t$ 获取的实际光学图像


    ![](img/f70619500c7a30b0babf83918d56ad93_117_0.png)


    **图14.1** 我们基于深度学习的遥感图像间隙填补方法。深度卷积自编码器使用所有可用源（光学图像 $S2_{t-1}$、$S2_t$、$S2_{t+1}$
    和SAR图像 $S1_t$）进行训练，目的是估计 $\widehat{S2_t}$ 图像。


    ### 14.3 架构


    我们的网络继承了文献[25]中描述的U-Net架构。正如我们在第10章中提到的，U-Net是一种流行的模型，用于语义标注或图像到图像的转换。我们的架构如图14.2所示。我们的架构与原始U-Net的主要区别在于，我们有三个输入而不是一个，因此有三个编码器分支。模型的每个编码器分支分别将输入图像
    $S2_{t-1}$、$S1_t$ 和 $S2_{t+1}$ 编码为称为瓶颈的特征图。该瓶颈是编码器最后一个特征图的拼接。网络的第二部分解码该瓶颈，以生成估计图像
    $\widehat{S2_t}$。


    ![](img/f70619500c7a30b0babf83918d56ad93_117_1.png)


    **图14.2** 用于光学图像间隙填补的架构。


    ### 14.3.1 编码器


    每个编码器实现了一个带步进的卷积神经网络。它由连续的4×4卷积组成，步长为2，用于对输入进行下采样。每个卷积之后是一个带泄漏的修正线性单元（LReLU）。第一个卷积输出深度为64的特征图，除最后两层外，特征图的深度在每个卷积处加倍。我们将
    $C_k$ 表示为包含以下部分的块：


    - 1. 具有k个滤波器的卷积

    - 2. LReLU层

    - 3. 批归一化层 [35]

    - 4. Dropout层


    每个编码器组成如下：$C_{64}$-$C_{128}$-$C_{256}$-$C_{512}$-$C_{512}$-$C_{512}$。


    ### 14.3.2 解码器


    解码器是编码器的镜像。它由连续的4×4转置卷积组成，步长为2，用于对输入进行上采样。第一个转置卷积输入512元素深度的瓶颈特征图。在每个转置卷积处，特征图的深度除以2。每个转置卷积之后是一个修正线性单元（ReLU）。然后将其与编码器中相应的特征图拼接。我们的架构与原始U-Net的主要区别在于，它有三个编码器分支堆叠在一起作为瓶颈。最后一个转置卷积输出4元素深度的特征图，对应于Sentinel-2图像的通道数，随后是一个双曲正切单元。我们将
    $C_k^{tr}$ 表示为包含以下部分的块：


    - 1. 具有k个滤波器的转置卷积

    - 2. ReLU

    - 3. 批归一化

    - 4. Dropout层


    我们还将 $CH_k^{tr}$ 表示为具有k个滤波器的转置卷积 + 一个双曲正切层。解码器组成如下：$C_{512}^{tr}$-$C_{512}^{tr}$-$C_{256}^{tr}$-$C_{128}^{tr}$-$C_{64}^{tr}$-$CH_4^{tr}$。


    在大多数构建块中，我们使用dropout来避免过拟合。由于我们的网络总共有6层卷积/转置卷积，它适合输入64×64的（$S2_{t-1}$，$S1_t$，$S2_{t+1}$）输入图像块，以估计64×64的
    $\widehat{S2_t}$ 输出图像块。

