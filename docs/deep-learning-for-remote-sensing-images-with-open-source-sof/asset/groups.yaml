    # # 11


    # Data used: the Amsterdam dataset


    This section aims to present the data involved for the upcoming practice session.
    We rely on freely available data, called the *Amsterdam* dataset. In the following
    part, we explain how to download and prepare this dataset in order to be ready
    for the practice session. Create a directory named *amsterdam* on your file system.
    We will use this directory to store all the downloaded and generated data during
    the exercises.


    # ## 11.1 Description


    The *Amsterdam* dataset consists of one very-high-resolution Spot-7 image acquired
    over the city of Amsterdam, and a vector layer containing the building footprints.
    In this section, we explain how to download the Spot-7 image, and generate the
    vector layer from OSM data. The *Amsterdam* dataset is involved in the entire
    section 11. Note that you can generalize this exercise to any orthorectified very-high-resolution
    remote sensing image at your disposal.


    # ## 11.2 Spot-7 image


    The Spot-7 product is composed of one multispectral image (6.0-m physical spacing,
    bands: red, green, blue, near infra-red) and one panchromatic channel (1.5-m physical
    spacing). The encoding is 12 bits. The Spot image can be freely downloaded from
    the Airbus, Defense & Space sample imagery web page.[^1] To download the product,
    follow these steps:


    +   1. Go to the ADS sample imagery web page.

    +   2. In the search field, enter *amsterdam* (next to the magnifying icon).

    +   3. Click on the *Search* button.


    [^1]: https://www.intelligence-airbusds.com/en/8262-sample-imagery'
