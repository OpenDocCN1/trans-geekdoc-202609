    ### 5.2 采样


    将深度学习技术应用于真实数据集的第一步是采样。Orfeo ToolBox 的现有框架为逐像素或面向对象的分类/回归任务提供了出色的工具。在深度学习方面，像
    CNN 这样的网络是在图像块而非单像素批次上训练的。因此，我们将介绍的 OTBTF 的第一个应用针对图像块采样，称为 **PatchesExtraction**。


