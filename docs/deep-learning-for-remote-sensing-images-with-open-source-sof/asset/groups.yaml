    \ patch of the input image, centered on the output pixel position. While this\
    \ kind of network architecture is easy to implement, it is not efficient in terms\
    \ of processing. Due to patch overlap, the data is copied multiple times with\
    \ different memory alignment (for each different patch) and passed to the model.\
    \ The costliest operations implemented in the deep net are the convolutions, which\
    \ are massively parallel and can be implemented so that the intermediate results\
    \ are reused for other patch processing (e.g. intermediate sums, see equations\
    \ 1.2 and 1.3). However, the patch-based mode disables the possible reuse of the\
    \ intermediate results since they are re-computed at each new patch, which is\
    \ not efficient. We will introduce the Fully Convolutional Neural Networks (FCNN,\
    \ or FCN) that are just CNNs that can process entire image regions instead of\
    \ being limited to small patches.\n\n### 6.1 Using the existing model as an FCN\n\
    \nFrom the constitution of the simple CNN we used in section 5.4, we can notice\
    \ that this model can be used as an FCN. Its properties are summarized as the\
    \ following:\n\n- **receptive field** (16 × 16 pixels),\n- **expression field**\
    \ (1 × 1 pixel),\n- **scale factor** (there is a total of 2 successive pooling\
    \ operators of size 2, meaning that the scale factor is 2 × 2 = 4).\n\nWe can\
    \ check that they are consistent with operators implemented in the model. If we\
    \ let n be the size of the input image, we can see how the model propagates the\
    \ image region to the output of size m:\n\n1. convolution with 5 × 5 kernel: output\
    \ size is n − 4,\n2. 2× pooling with stride (2,2): output size is (n − 4)/2 =\
    \ n/2 − 2,\n3. convolution with 3×3 kernel: output size is (n/2 − 2) − 2 = n/2\
    \ − 4,\n4. 2× pooling with stride (2,2): output size is (n/2 − 4)/2 = n/4 − 2,\n\
    5. convolution with 2×2 kernel: output size is (n/4 − 2) − 1 = n/4 − 3.\n\nIn\
    \ conclusion, we have m = n/4 − 3, which is quite consistent with the properties\
    \ (receptive field, expression field, spacing factor) of the model: the model\
    \ produces an output of size 1 × 1 from an input image of size 16 × 16. The physical\
    \ spacing of its output pixel is equal to the input pixel spacing multiplied by\
    \ 4. Run the CNN model with the parameter `model.fullyconv` set to on in order\
    \ to enable the fully convolutional processing.\n\n```bash\notbcli_TensorflowModelServe\
    \ \\\n-source1.il Sentinel-2_B4328_10m.tif \\\n-source1.rfieldx 16 \\\n-source1.rfieldy\
