  md: "\n## 12.2.2 Implementation\n\nLet’s look a bit more closely at the code:\n\n\
    ```python\n#\n# Do not forget to add the otbtf/python directory to your PYTHONPATH.\n\
    # Else \"tricks\" can't be imported.\n# In the OTBTF Docker image, tricks.py is\
    \ located in the following\n# path: /work/otb/otb/Modules/otbtf\n#\n# Works with\
    \ OTBTF 1.7\n#\nfrom tricks import *\nimport sys\n\nnclasses=2\n\n# Convolution\
    \ block with strides 2 (\"downsampling\")\ndef _conv(inp, n, k_size=3, strides=2,\
    \ activ=tf.nn.relu):\n    return tf.layers.conv2d(inputs=inp,\n              \
    \              filters=n,\n                            kernel_size=[k_size, k_size],\n\
    \                            padding=\"same\",\n                            strides=(strides,\
    \ strides),\n                            activation=activ)\n\n# Transposed convolution\
    \ block with strides 2 (\"upsampling\")\ndef _dconv(inp, n, k_size=3, strides=2,\
    \ activ=tf.nn.relu):\n    return tf.layers.conv2d_transpose(inputs=inp,\n    \
    \                                  filters=n,\n                              \
    \        strides=(strides,strides),\n                                      kernel_size=[k_size,\
    \ k_size],\n                                      padding=\"same\",\n        \
    \                              activation=activ)\n\ndef myModel(x):\n\n    depth\
    \ = 16\n\n    # Encoding\n    conv1 = _conv(x, 1*depth) # 64 x 64 --> 32 x 32\
    \ (31 x 31)\n    conv2 = _conv(conv1, 2*depth) # 32 x 32 --> 16 x 16 (15 x 15)\n\
    \    conv3 = _conv(conv2, 4*depth) # 16 x 16 --> 8 x 8 ( 7 x 7)\n    conv4 = _conv(conv3,\
    \ 4*depth) # 8 x 8 --> 4 x 4 ( 3 x 3)\n\n    # Decoding (with skip connections)\n\
    \    deconv1 = _dconv(conv4, 4*depth) # 4 x 4 --> 8 x 8 ( 5 x 5)\n    deconv2\
    \ = _dconv(deconv1 + conv3, 2*depth) # 8 x 8 --> 16 x 16\n                   \
    \                               # ( 9 x 9)\n    deconv3 = _dconv(deconv2 + conv2,\
    \ 1*depth) # 16 x 16 --> 32 x 32\n                                           \
    \       # (17 x 17)\n    deconv4 = _dconv(deconv3 + conv1, 1*depth) # 32 x 32\
    \ --> 64 x 64\n                                                  # (33 x 33)\n\
    \n    # Neurons for classes\n    estimated = tf.layers.dense(inputs=deconv4, units=nclasses,\n\
    \                                activation=None)\n\n    return estimated\n\n\"\
    \"\" Main \"\"\"\n# check number of arguments\nif len(sys.argv) != 2:\n    print(\"\
    Usage: output_directory_for_SavedModel\")\n    sys.exit(1)\n\n# Create the graph\n\
    with tf.Graph().as_default():\n\n    # Placeholders\n    x = tf.placeholder(tf.float32,\
    \ [None, None, None, 4], name=\"x\")\n    y = tf.placeholder(tf.int32, [None,\
    \ None, None, 1], name=\"y\")\n    default_lr = tf.constant(0.0002, dtype=tf.float32,\
    \ shape=[])\n    lr = tf.placeholder_with_default(default_lr, shape=[], name=\"\
    lr\")\n\n    # Output neurons of the model\n    y_estimated = myModel(x)\n\n \
    \   # Prediction output\n    y_class = tf.argmax(y_estimated, axis=3)\n\n    #\
    \ Add the 4th dimension to have (#, :, :, 1) so the OTBTF apps\n    # know that\
    \ the output image has 1 component\n    y_pred = tf.expand_dims(y_class, axis=-1,\
    \ name=\"prediction\")\n\n    # Prediction output (FCN)\n    y_pred_fcn = tf.identity(y_pred[:,\
    \ 16:-16, 16:-16, :],\n                             name=\"prediction_fcn\")\n\
    \n    # Loss function\n    cost = tf.losses.sparse_softmax_cross_entropy(labels=tf.reshape\n\
    \                 (y, [-1, 1]), logits=tf.reshape(y_estimated, [-1, nclasses]))\n\
    \n    # Optimizer\n    optimizer = tf.train.AdamOptimizer(learning_rate=lr,\n\
    \                                       name=\"optimizer\").minimize(cost)\n\n\
    \    # Initializer, saver, session\n    init = tf.global_variables_initializer()\n\
    \    saver = tf.train.Saver(max_to_keep=20)\n    sess = tf.Session()\n    sess.run(init)\n\
    \n    # Create a SavedModel\n    CreateSavedModel(sess=sess,\n               \
    \      inputs=[\"x:0\", \"y:0\"],\n                     outputs=[\"prediction:0\"\
    , \"prediction_fcn:0\"],\n                     directory=sys.argv[1])\n```\n\n\
    As can be noticed, we use convolutions and transposed convolutions which retain\
    \ the size of the output features (*padding=\"same\"*), meaning that zero padding\
    \ is used in convolutions. We should understand that we can’t use the features\
    \ computed in the last layer directly, if we want to use this model in fully convolutional\
    \ mode: for each processed block, only a subset would be exact, meaning similar,\
    \ regardless of the input region. Using the output would produce some blocking\
    \ artifacts caused by the zero padding in the convolutions.\n\n### 12.2.2.1 Exact\
    \ output\n\nTo cope with that, we create an output dedicated to the computation\
    \ of the *exact* part of the *prediction* output tensor. For this, we simply remove\
    \ a few pixels from the borders of the output since the convolutions “pollute”\
    \ the borders at each layer, as illustrated in [figure 12.10](#figure-12-10).\n\
    \n![](img/f70619500c7a30b0babf83918d56ad93_106_0.png)\n\n**FIGURE 12.10**  \n\
    At each layer, the feature maps are contaminated by the zero padding of the convolutions.\
    \ Blocks with orange borders: features; blocks filled in orange: valid parts of\
    \ feature maps. The *exact* part of the final output feature map is its center\
    \ area.\n\n[Table 12.1](#table-12-1) shows how to compute the number of pixels\
    \ to remove from the border of the last feature map (the *prediction* output tensor).\
    \ At each layer, convolution contaminates the feature map due to padding. We can\
    \ calculate the central part of the feature maps, which is *exact*, i.e. not contaminated\
    \ by padding. As all convolution kernels are of size 3, it’s easy to compute the\
    \ number of pixels that should be clipped at the end. For instance: Level 1, convolution\
    \ output is 32 (input is 64, and we use convolutions with stride 2) but as our\
    \ kernel is 3 × 3, the actual valid part of the output feature map has a size\
    \ of 31 × 31.\n\n**TABLE 12.1**  \nValid part of the convolution outputs (namely\
    \ feature maps)\n\n| Level | Feature size | Valid part |\n|---|---:|---:|\n| /\
    \ | 64 | 64 |\n| 1 | 32 | 31 |\n| 2 | 16 | 15 |\n| 3 | 8 | 7 |\n| 4 | 4 | 3 |\n\
    | 1 | 8 | 5 |\n| 2 | 16 | 9 |\n| 3 | 32 | 17 |\n| 4 | 64 | 33 |\n\nAs shown in\
    \ [table 12.1], the valid part of the final feature map has a size 33 × 33 elements.\
    \ We then remove 16 elements from the borders to output a valid tensor of 32 ×\
    \ 32 elements.\n\n### 12.2.2.2 Expression field\n\nIn OTBTF the spatial part that\
    \ the model outputs for the tensors specified in the **output.names** is called\
    \ the *expression field*. As explained, the model transforms an elementary input\
    \ image of size 64 × 64 into an elementary output predicted label image of size\
    \ 32 × 32. Hence, later we will use a receptive field of 64 × 64 (the input volume\
    \ that the network “sees”) and an expression field of 32 × 32 (the output volume\
    \ that the network “fills”).\n\n## 12.2.3 Generate the SavedModel\n\nTo generate\
    \ the model, use the `create_model4.py` Python script.\n\n```bash\n# Generate\
    \ the model\n\n# The \"create_model4.py\" file can be downloaded from:\n# https://github.com/remipierre/otbtf_tutorials_resources.git\n\
    python3 ~/python/create_model4.py \"model4\"\n```\n\n> **Important note**\n> \n\
    > As you can note, we carefully set 4 dimensions for the output tensors that will\
    \ be used in the OTBTF applications. Currently, OTBTF interprets the last dimension\
    \ of an output tensor as the number of components of the output image. That is\
    \ why we use `tf.expand_dims()` to make the *prediction* output tensor with a\
    \ last dimension of size 1.\n\n## 12.3 Training the model\n\nTrain the model with\
    \ the **TensorflowModelTrain** application:\n\n```bash\n# Since the TensorflowModelTrain\
    \ uses n+1 sources\nexport OTB_TF_NSOURCES=1\n\n# Train the deep learning model\n\
    otbcli_TensorflowModelTrain \\\n-training.source1.il amsterdam_Spot7_patches_A.tif\
    \ \\\n-training.source1.patchsize 64 \\\n-training.source1.patchsizey 64 \\\n\
    -training.source1.placeholder \"x\" \\\n-training.source2.il amsterdam_labelimage_patches_A.tif\
    \ \\\n-training.source2.patchsize 64 \\\n-training.source2.patchsizey 64 \\\n\
    -training.source2.placeholder \"y\" \\\n-model.dir model4 \\\n-training.targetnodes\
    \ optimizer \\\n-validation.mode \"class\" \\\n-validation.source1.il amsterdam_Spot7_patches_B.tif\
    \ \\\n-validation.source1.name \"x\" \\\n-validation.source2.il amsterdam_labelimage_patches_B.tif\
    \ \\\n-validation.source2.name \"prediction\" \\\n-model.saveto model4/variables/variables\n\
    ```\n\n## 12.4 Inference\n\nAs explained in section 12.2.1, we set an input receptive\
    \ field of size 64×64 and an output expression field of size 32×32. We ask the\
    \ **TensorflowModelServe** application to produce, in fully convolutional mode,\
    \ the *prediction_fcn* output tensor of the model.\n\nLet’s run the model over\
    \ a subset image:\n\n```bash\n# Produce the map\notbcli_TensorflowModelServe \\\
    \n-source1.il IMG_SPOT7_amsterdam_PMS_norm.tif \\\n-source1.rfieldx 64 \\\n-source1.rfieldy\
    \ 64 \\\n-source1.placeholder \"x\" \\\n-model.dir model4 \\\n-model.fullyconv\
    \ on \\\n-output.efieldx 32 \\\n-output.efieldy 32 \\\n-output.names \"prediction_fcn\"\
    \ \\\n-out \"classif_model4.tif?&box=6000:4000:2000:2000\" uint8\n```\n"
