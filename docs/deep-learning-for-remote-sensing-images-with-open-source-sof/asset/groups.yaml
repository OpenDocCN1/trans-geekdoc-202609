    \ **ImageClassifierFromDeepFeatures** 中使用的深度网络必须与 **TrainClassifierFromDeepFeatures**\
    \ 中用于生成分类规则的深度网络相同！否则，分类器将使用来自错误模型的特征向量执行图像分类任务，导致分类结果毫无意义。\n\n## 7.3 训练\n\n本练习需要稍多一些的计算资源，因为整个输入图像将使用深度网络处理两次。第一次：用于分类器训练（使用\
    \ **TrainClassifierFromDeepFeatures** 应用）。第二次：在生成分类图时（使用 **ImageClassifierFromDeepFeatures**\
    \ 应用）。\n\n> **重要提示**\n>\n> 在配备 16 GB 内存的 Intel(R) Xeon(R) CPU E5-1650 @ 3.20 GHz\
    \ 上，此处理大约需要 **3 分钟**。你可以使用应用的 *optim* 参数组调整处理参数，采用与第 6.2 节中相同的参数值。你可以对 **ImageClassifierFromDeepFeatures**\
    \ 进行调整。然而，**TrainClassifierFromDeepFeatures** 的计算主要受 *ram* 参数控制，该参数通过基于图像 tile\
    \ 提示的内部流式机制确定请求区域。因此，建议在此应用中设置较小的 *ram* 参数值，以避免内存分配问题。\n\n对于训练，你还可以将 *io.confmatout*\
    \ 参数设置为 1，以生成输出混淆矩阵。\n\n```bash\notbcli_TrainClassifierFromDeepFeatures \\\n--source1.il\
    \ Sentinel-2_B4328_10m.tif \\\n--source1.rfield 16 \\\n--source1.rfieldy 16 \\\
    \n--source1.placeholder \"x\" \\\n--model.dir model2 \\\n--model.fullyconv on\
    \ \\\n--output.names \"features\"\n```\n\n## 8 处理多源数据\n\n深度网络可以有效地用于处理多个异构数据源，例如，为每个数据源定制多个分支，这些分支最终在某个点合并以融合信息。例如，可以轻松构建一个能够同时处理时间序列和一幅超高分辨率图像的深度神经网络：一个由循环神经网络组成的分支处理时间序列（例如\
    \ Sentinel-1 或 Sentinel-2 图像），另一个由 CNN 组成的分支处理高分辨率图像（例如 Spot 6/7 图像）。此类方法在文献中已有记载（例如\
    \ [13]）。\n\n本节将介绍如何将 OTBTF 用于任意数量的图像源。\n\n### 8.1 更多数据源？\n\nOTBTF 应用中的数据源数量可通过环境变量\
    \ **OTB_TF_NSOURCES** 控制。如果该环境变量未定义，数据源数量的默认值为 1。你可以通过命令行更改它。下面，我们将使用来自 Sentinel-2\
    \ 图像的 2 个数据源：\n\n1. 20 米间距的通道（光谱波段 5、6、7、8a、11 和 12），叠加在单个栅格中\n2. 10 米间距的通道（光谱波段\
    \ 4、3、2 和 8），叠加在单个栅格中\n\n该架构输入两幅不同分辨率的图像，以在所需分辨率下生成单一输出。此架构的灵感来源于 [23]。\n\n让我们通过终端更改数据源数量：\n\
    \n```bash\nexport OTB_TF_NSOURCES=2\n```\n\n然后，你可以检查 OTBTF 的每个应用中的数据源数量是否已增加到\
    \ 2。例如，在终端中输入以下内容：\n\n```bash\notbcli_PatchesExtraction -help\n```\n或\n```bash\n\
    otbcli_TensorflowModelServe -help\n```\n\n如你所见，这些应用现在有 2 个数据源，即 *source1* 和 *source2*，每个都有自己的参数。\n\
    \n> **重要提示**\n>\n> 如果尝试使用 **TensorflowModelServe** 应用，你会注意到有 **OTB_TF_NSOURCES+1**\
    \ 个数据源。这是因为至少还有一个用于参考输入的数据源：例如，在分类任务中，需要这个额外的输入来提供地面真实标签。\n\n### 8.2 多输入模型\n\n\
    我们提出了一个具有两个不同分辨率输入的 CNN：Sentinel-2 的 10 米间距波段（光谱波段 2、3、4 和 8）和 Sentinel-2 的 20\
    \ 米间距波段（光谱波段 5、6、7、8a、11 和 12）。该模型联合处理这两个输入，并以最低分辨率（即 20 米间距）输出土地覆盖图。20 米间距图像块的大小为\
    \ 8 × 8，10 米间距图像块的大小为 16 × 16。请注意，我们可以使用不同的图像块大小，但我们希望模型输入在两种分辨率下对应相同的物理区域。*图\
    \ 8.1* 总结了所实现的深度网络。\n\n![](img/f70619500c7a30b0babf83918d56ad93_69_0.png)\n\n\
    **图 8.1**\n\n该网络由三个占位符（“x1”、“x2”和“lr”）组成，分别用于 20 米输入图像（4 维数组）、10 米输入图像（4 维数组）和学习率（单标量），一个输出张量（“prediction”，一维数组）和一个目标节点（“optimizer”，仅用于训练网络）。\n\
    \n使用资源仓库¹ 中提供的 *create_model3.py* Python 代码来生成一个 *SaveModel*，以实现上述双分支 CNN。\n\n\
    ```python\n#\n# Do not forget to add the otbtf/python directory to your PYTHONPATH.\n\
    # Else \"tricks\" can’t be imported.\n# In the OTBTF Docker image, tricks.py is\
    \ located in the following\n# path: /work/otbtf/otb/Modules/otbtf\n#\n# Works\
    \ with OTBTF 1.7\n#\nfrom tricks import *\nimport sys\n\nnclasses=6\n\ndef myModel(x1,x2):\n\
    \    # The 20m spacing branch (input patches: 8x8x6)\n    conv1_x1 = tf.layers.conv2d(inputs=x1,\
    \ filters=16, kernel_size=[3,3],\n                                padding=\"valid\"\
    , activation=tf.nn.relu)\n    # conv1_x1 out size: 6x6x16\n    conv2_x1 = tf.layers.conv2d(inputs=conv1_x1,\
    \ filters=32, kernel_size=\n                                [3,3], padding=\"\
    valid\", activation=tf.nn.relu)\n    # conv2_x1 out size: 4x4x32\n    conv3_x1\
    \ = tf.layers.conv2d(inputs=conv2_x1, filters=64, kernel_size=\n             \
    \                   [3,3], padding=\"valid\", activation=tf.nn.relu)\n    # conv3_x1\
    \ out size: 2x2x64\n    conv4_x1 = tf.layers.conv2d(inputs=conv3_x1, filters=64,\
    \ kernel_size=\n                                [2,2], padding=\"valid\", activation=tf.nn.relu)\n\
    \    # conv4_x1 out size: 1x1x64\n\n    # The 10m spacing branch (input patches:\
    \ 16x16x4)\n    conv1_x2 = tf.layers.conv2d(inputs=x2, filters=16, kernel_size=[5,5],\n\
    \                                padding=\"valid\", activation=tf.nn.relu)\n \
    \   # conv1_x2 out size: 12x12x16\n    conv2_x2 = tf.layers.conv2d(inputs=conv1_x2,\
    \ filters=32, kernel_size=\n                                [3,3], padding=\"\
    valid\", activation=tf.nn.relu)\n    # conv2_x2 out size: 10x10x32\n    conv3_x2\
    \ = tf.layers.conv2d(inputs=conv2_x2, filters=64, kernel_size=\n             \
    \                   [3,3], padding=\"valid\", activation=tf.nn.relu)\n    # conv3_x2\
    \ out size: 8x8x64\n    conv4_x2 = tf.layers.conv2d(inputs=conv3_x2, filters=64,\
    \ kernel_size=\n                                [3,3], padding=\"valid\", activation=tf.nn.relu)\n\
    \    # conv4_x2 out size: 6x6x64\n    conv5_x2 = tf.layers.conv2d(inputs=conv4_x2,\
    \ filters=64, kernel_size=\n                                [3,3], padding=\"\
    valid\", activation=tf.nn.relu)\n    # conv5_x2 out size: 4x4x64\n    pool1_x2\
    \ = tf.layers.max_pooling2d(inputs=conv5_x2, pool_size=[2, 2],\n             \
    \                          strides=2)\n    # pool1_x2 out size: 2x2x64\n    conv6_x2\
    \ = tf.layers.conv2d(inputs=pool1_x2, filters=64, kernel_size=\n             \
    \                   [2,2], padding=\"valid\", activation=tf.nn.relu)\n    # conv6_x2\
    \ out size: 1x1x64\n\n    # Stack features from the two branches\n    features\
    \ = tf.reshape(tf.stack([conv4_x1, conv6_x2], axis=3),\n                     \
    \     shape=[-1, 128], name=\"features\")\n\n    # Fully connected layer\n   \
    \ dense_1 = tf.layers.dense(inputs=features, units=128, activation=\n        \
    \                      tf.nn.relu)\n\n    # Neurons for classes\n    estimated\
    \ = tf.layers.dense(inputs=dense_1, units=nclasses,\n                        \
    \        activation=None)\n    estimated_label = tf.argmax(estimated, 1, name=\"\
    prediction\")\n\n    return estimated, estimated_label\n\n\"\"\" Main \"\"\"\n\
    ```\n\n¹ https://github.com/remicres/otbtf_tutorials_resources\n\n"
