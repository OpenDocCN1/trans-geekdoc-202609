    the address instead of a full copy.


    If you are very confident that this method is being called from limited places
    and that this method will not be required to update the receiver in the future,
    only then you should choose the value receiver. Otherwise, you should select the
    pointer receiver.


    A type can have a mix of a value receiver and pointer receiver methods. Some methods
    can be declared as value receiver and some methods can be declared as pointer
    receiver on a type. It’s always a good practice to have either all methods as
    value receiver or pointer receiver. We should not mix both of them unless it is
    extremely necessary.'
