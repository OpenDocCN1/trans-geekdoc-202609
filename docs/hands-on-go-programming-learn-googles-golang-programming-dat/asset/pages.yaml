  md: '# ## 8.4.1 Method resolution process


    The compiler uses the method resolution process to find the method. When a method
    is called on a type, it first tries to find it in the same type. If it is not
    found in the same type, it looks into all the embedded types; if none of the embedded
    types have that method, it tries to find in the embedded of embedded type:


    ![](img/e1030b71ae44b81457dd2ae7b5008eac_271_0.png)


    **Figure 8.1:** *Method resolution process*


    If a method is defined in two embedded types at the same level, then that is ambiguity.
    So the compiler gives a compilation error:


    ![](img/e1030b71ae44b81457dd2ae7b5008eac_271_1.png)


    **Figure 8.2:** *Ambiguity in the method resolution process*'
