  md: "# 12.3 *Recover*\n\nThe built-in function recover recovers from panic. The\
    \ program usually executes after the recover call. It should be called from the\
    \ defer function; otherwise, it will not have any impact.\n\nThe recover function\
    \ can be called from any function in the call stack. It is not necessary to call\
    \ the recover function the same function from where panic is encountered. In the\
    \ code given below, the recover function is called in the fn2 function. After\
    \ the fn2 call, the program doesn’t terminate. Instead, it regains the flow and\
    \ ends the program gracefully. It is important to note that the last line of fn2\
