  md: '# Conclusion


    Declaration of function and method are almost similar. There is only one difference
    in their declaration—method declaration contains receiver whereas the function
    does not.


    Methods can always be associated with any type. We can specify that type by the
    receiver.


    We cannot declare a method without a type of body. We can declare a method to
    type anywhere.


    We declare a method to a type when we want to modify and get properties of the
    type.


    There are two types of receivers:


    **Pointer** It is used when we want to modify the properties of the type.


    **Value** It is used when we want to get the properties of the type. The modification
    done by the value receiver method does not reflect outside of the methods.


    We can declare methods on the basic data type, composite type, and even on function.'
