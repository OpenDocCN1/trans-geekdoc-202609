    # Chapter 7: [Structs]


    This chapter explains the basic concept of struct and how to use it in the Go
    programming language. It covers how to declare and initialize structs type, access
    fields of structs, pointer to structs, exported and unexported structs, and structs
    fields.


    # Chapter 8: [Methods]


    This chapter covers the concept of methods in the Go programming language. You
    will learn how to declare a method, how to call a method, the syntax of different
    types of methods, and the method resolution process.


    # Chapter 9: [Interfaces]


    This chapter will cover the concept of interface in Golang. You will learn what
    the interface in Golang is, how Golang interfaces are different from other languages,
    how to declare an interface, and how implicit implementation happens in Golang
    and what are its benefits. We will create the interface without methods and see
    its benefits with built-in functions. We will see the impact of value receiver
    and pointer receiver while implementing the interface and creating polymorphic
    objects.'
