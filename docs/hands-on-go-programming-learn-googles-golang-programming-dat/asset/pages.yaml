  md: '# 8.1 Definition


    The syntax of methods is almost similar to function with one difference— the method
    always has a receiver between the func keyword and the method name as shown below:


    ```

    func (receiverName receiverType) methodName(param1 paramType) (returnType1) {

    ...

    }

    ```


    The receiver is placed in parenthesis () after the func keyword and before the
    method name. The rest of the syntax is similar to the function. It has a list
    of parameters. A method can have a single or multiple parameters. There can be
    multiple method parameters with different types, or all parameters can be of the
    same type. The same is applied to the return types. However, if a method returns
    multiple values, then the return type must be in parenthesis; otherwise, we can
    omit the parenthesis.


    You might be wondering why we need a receiver on a method. We don’t need a receiver
    in other class-based object-oriented languages like C++ and Java. This is because
    methods are grouped into classes in C++ and Java. Methods are always declared
    as part of the class body. So the compiler can understand by class definition
    that the class has certain methods in it. But this is not the case with Go. Type
    and its methods are'
