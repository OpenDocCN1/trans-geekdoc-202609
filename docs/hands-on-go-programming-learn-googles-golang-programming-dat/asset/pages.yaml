    In the previous section, we have used the Sleep function to wait for child goroutines
    to finish. But the Sleep function is not a good practice to wait for the child
    goroutine to finish. We can use WaitGroup of the sync package to wait for the
    child goroutine to finish.


    The sync.WaitGroup is a struct type. It has three useful methods:


    The Add method adds an integer number to the The integer number is a count that
    says the main function will wait for that number of a goroutine to complete.


