- pgno: 9
  md: '# Preface


    Golang is regarded as a swift and flawless programming language having loads of
    useful features like efficient built-in concurrency, garbage collector with automatic
    garbage detection and cleaning, dynamic growable call stack of goroutines, extremely
    fast compiler and cross platform versatility, etc. A lot of cloud, networking,
    and DevOps softwares are written in Golang like Docker, Kubernetes, Terraform,
    etcd, and ist.io. The Go developers community is one of the most active open source
    communities on GitHub.


    This book focuses on learning Golang, starting from the basic concepts to interfaces,
    pointers, concurrency, etc. We have explained each concept in detail using programming
    examples. We start with the basics and get into more complex stuff with each chapter.
    Each chapter has exercises which will help you in understanding the concepts clearly.


    Over the 12 chapters in this book, you will learn the following:


    # Chapter 1: [Introduction]


    This chapter covers the basic concepts of data types, constants, variables, operators,
    reassignment, and redeclaration. You will learn how to use them in the Go programming
    language.


    # Chapter 2: [Functions]'
