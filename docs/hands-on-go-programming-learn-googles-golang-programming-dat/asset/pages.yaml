  md: '# 11.3.3.1 Unbuffered channel


    When there is no capacity in a channel, then that channel called an unbuffered
    channel. In the unbuffered channel, the send operation will be blocked until one
    goroutine reads. The same applies for the read operation. The read operation blocks
    until one goroutine sends data to it.


    Let’s write a producer-consumer program and see that the read operation will only
    be executed when one goroutine writes a value to the channel.


