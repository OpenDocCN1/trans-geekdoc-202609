  md: '# 11.3.1 Introduction


    The make built-in function can be used to declare a channel.


    ```

    make(chan , size>)

    ```


    A keyword is used for channel declaration.


    The type is any valid type and the channel will hold values of that type. A type
    could be a basic data type or a custom type.


    buffer This is an optional value. The default value is 0. We can declare a buffered
    channel by providing value. We will discuss buffered and unbuffered channels later
    in this chapter.


    Let’s declare a channel that can host integer values.


    ```

    ch := make(chan int)

    ```


    The <- operator is used to write and read a value from the channel.


    ```

    ch <- 10

    ```


    The previous statement writes 10 to the channel


    ```

    a := <-ch

    ```'
