  md: '# 11.3 *Channels*


    Channel is a type in Golang by which two goroutines can communicate. One goroutine
    can send data and another goroutine can receive data. It is like a pipeline. Channels
    in Golang introduce a new way of concurrency. The implementation of concurrency
    using channels works as said in the statement given below:


    > *Do not communicate by sharing memory; instead, share memory by communicating.*


    We have seen it in [Section 11.1.3] where we used amount as a shared variable,
    and multiple goroutines were accessing it. The Golang does not encourage concurrency
    implementation in this way. It strongly says that *do not communicate by sharing*.
    It suggests we should use channels wherever communication is required.'
  merge: -1
  img_proc: true
