- pgno: 336
  md: '# 10.3.2 Arithmetic operator


    Those who are coming from a C/C++ background would expect arithmetic operators
    on pointers. But for the sake of simplicity, the arithmetic operators are not
    allowed on pointers in the Go language. The arithmetic operators on pointers may
    lead to an illegal address which is very dangerous.


    In the C family languages, the pointer arithmetic is very useful when iterating
    over an array because it is very fast. However, the hardware and compiler are
    so advanced nowadays that iterating arrays using indices is more efficient than
    using pointer arithmetic. So, there is no need for the pointer arithmetic to perform
    a fast iteration over the array.'
