  md: '# 2.5 Variadic functions


    Functions, in general, accept only a fixed number of arguments but the variadic
    function can accept a variable number of arguments.


    Only the last parameter of a function can be variadic. If the last parameter of
    a function definition is prefixed by an ellipsis then the function can accept
    any number of arguments for that parameter. This is shown as follows:


    ```

    func variadic_function(a int, b ...int) {

    // Body of variadic function

    }

    ```


    In the above function, the parameter b is variadic since it''s prefixed by an
    ellipsis, and it can accept any number of arguments.


    Let''s make the first parameter of the variadic_function variadic. The syntax
    will look like this:


    ```

    func variadic_function(a ...int, b int) {

    // Body of variadic function

    }

    ```'
