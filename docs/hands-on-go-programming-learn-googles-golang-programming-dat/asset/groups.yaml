    ## 9.4 方法集\n\n方法集是使类型隐式实现接口的方法集合。到目前为止，我们已经看到，当一个类型定义了某个接口的所有方法时，该类型就会隐式地实现该接口的所有方法。但我们还没有看到方法应该是指针接收者方法还是值接收者方法。接口方法并不指定实现类型应该使用指针接收者还是值接收者。\n\
