    exit status 2\n```\n\n## 12.4 最佳实践\n\n在程序逻辑中显式调用 panic 并不是好的做法。你的函数的调用者不会知道你的函数可能发生\
    \ panic，因此调用者可能不会编写 recover 函数。在这种情况下，整个程序将终止。始终最好的做法是让函数返回错误，而不是显式调用 panic。\n\
    \n当函数返回错误时，我们应该处理该错误，不应该忽略它。\n\n## 结论\n\nGolang 使用 error 类型进行错误处理。\n\n如果函数可能引发错误，则函数可以将\
