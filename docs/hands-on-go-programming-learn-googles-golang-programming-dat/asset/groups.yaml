    ## Conclusion


    In Go, the slice is a segment of an array that can be resized and is more flexible
    compared to arrays. Like arrays, slices are indexable and have length.


    A slice is a lightweight structure that wraps and represents a portion of an array.
    A slice consists of three things – pointer, length, and capacity.


    In the Go language, a slice is declared just like an array but it doesn’t contain
    the size of the slice. Therefore, it becomes flexible and dynamic in size to fit
    the requirements.


    In order to create a slice from an array, we specify two indices, lower bound
    and upper bound separated by a colon. The default value for low is 0 and high
    is the length of the slice. The low and high indices in the slice expression are
    optional.


    In Go, you can create a slice using the make() function provided by the Go library.
    This function takes three parameters-type, length, and capacity. Here, the capacity
    value is optional. It assigns an underlying array with a size that is equal to
    the given capacity and returns a slice which refers to the underlying array.


    The slices are reference types in the Go language and they refer to an underlying
    array. Hence, modifying an element of a slice will


    modify the corresponding elements in the referenced array and the other slices
    that refer to the same array will also see those modifications.


    In Go, a nil slice does not contain any element in it. So, the capacity and length
    of this slice are 0 and the nil slice does not contain an array reference. Also,
    you can use the == operator in slice to check whether a given slice is nil or
    not.


    In Go, the multi-dimensional slice is just like the multi-dimensional array, except
    that the slice does not contain the size.


    You can iterate over the slice either by using for loop or range in for loop.
    By using a range in the for loop, you can also get the index and the element value.


    In Go, you can sort the elements present in a slice. The standard Go library provides
    the sort package which contains different types of sorting methods for sorting
    the slices of strings and ints.


