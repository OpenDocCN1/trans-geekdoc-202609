    Length of Array:\", len(a))\n}\n```\n\n以下是上述程序的输出：\n\n```text\narray\nLength of\
    \ Array: 5\n```\n\n当使用数组字面量声明数组时，可以为特定的数组元素初始化值。每个元素都有一个关联的整数索引，用于表示其在数组中的位置。\n\
    \n### 程序 4.5\n\n```go\n// Go program to initialize the value of specific array\
