    In m1 of St\")\n}\n\nfunc (s St) m2() {\n    fmt.Println(\"In m2 of St\")\n}\n\
    \nfunc main() {\n    var i Itr\n    fmt.Println(\"Assigning value of St\")\n \
    \   i = St{}\n    i.m1()\n    i.m2()\n    fmt.Println(\"Assigning Address of St\"\
    )\n    i = &St{}\n    i.m1()\n    i.m2()\n}\n```\n\n上述程序的输出如下：\n\n**分配 St 的值**\
    \  \n**在 St 的 m1 中**  \n**在 St 的 m2 中**  \n**分配 St 的地址**  \n**在 St 的 m1 中**  \n\
    **在 St 的 m2 中**\n\n在上述代码中，我们通过使用值接收器定义 `m1` 和 `m2` 方法来实现 `Itr` 接口。在 main 函数中，我们尝试将\
    \ `St` 的值和地址都赋给一个接口变量，并且它工作正常。在此代码中我们不会得到编译错误。\n\n## 方法集的结论\n\n- 如果类型 `T` 通过定义指针接收器方法来实现接口\
    \ `I`，那么只有 `*T` 会实现接口 `I`，而 `T` 不会。因此，我们只能将 `T` 的地址赋给接口变量。\n- 如果类型 `T` 通过定义值接收器来实现接口\
    \ `I`，那么 `T` 和 `*T` 都实现接口 `I`。因此，我们可以将 `T` 的值和地址都赋给接口变量。\n\n## 9.5 经常使用的内置/stdlib\
    \ 接口\n\n标准库中有太多常用的接口。我们无法在此涵盖所有这些接口。我们将在本节中介绍 `Stringer` 接口，并在第 9.5.3 节中看到 error\
    \ 接口的实现。\n\n### 9.5.1 Stringer 接口\n\n`Stringer` 接口对于打印自定义输出非常有用。它只有一个名为 `String`\
    \ 的方法，该方法返回一个字符串。当我们使用 `fmt.Println` 打印某个类型的值时，如果该类型重写了 `String()` 方法，则 `String()`\
    \ 方法会在内部被调用。`fmt` 包会打印 `String()` 方法返回的内容。\n\n#### 程序 9.9\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\ntype Dollar float64\n\nfunc (d Dollar) String() string {\n\
    \    return fmt.Sprintf(\"$%f\", d)\n}\n\nfunc main() {\n    var d Dollar = 23.3\n\
    \    fmt.Println(d)\n}\n```\n\n上述程序的输出如下：\n\n```text\n$23.300000\n```\n\n### 9.5.2\
    \ sort 包的 Interface 接口\n\nGolang 标准库中有一个名为 `sort.Interface` 的接口。请注意，接口名称本身就是 `Interface`。该接口在\
    \ `sort` 包中定义，用于对用户定义类型的切片进行排序。该接口有三个方法：`Len`、`Less` 和 `Swap`。下面给出的代码片段是来自 `sort`\
    \ 包的 `Interface` 接口的定义：\n\n#### 程序 9.10\n\n```go\npackage sort\n\ntype Interface\
    \ interface {\n    Len() int\n    Less(i, j int) bool\n    Swap(i, j int)\n}\n\
    ```\n\n如果我们想对任何类型的切片进行排序，则需要调用 `sort` 包的 `Sort` 函数。`Sort` 函数期望 `Interface` 类型。因此，我们可以传递任何实现\
    \ `sort.Interface` 的类型。该类型可以通过实现全部三个方法来实现 `Interface` 接口：\n\n#### 程序 9.11\n\n\
    ```go\npackage main\n\nimport (\n    \"fmt\"\n    \"sort\"\n)\n\ntype Student\
    \ struct {\n    Name  string\n    Marks int\n}\n\nfunc (s Student) String() string\
    \ {\n    return fmt.Sprintf(\"%s: %d\", s.Name, s.Marks)\n}\n\ntype ByMarks []Student\n\
    \nfunc (a ByMarks) Len() int           { return len(a) }\nfunc (a ByMarks) Swap(i,\
    \ j int)      { a[i], a[j] = a[j], a[i] }\nfunc (a ByMarks) Less(i, j int) bool\
    \ { return a[i].Marks < a[j].Marks }\n\nfunc main() {\n    students := []Student{\n\
    \        {\"Bob\", 31},\n        {\"John\", 42},\n        {\"Michael\", 17},\n\
    \        {\"Jenny\", 26},\n    }\n    fmt.Println(\"Before sorting =\", students)\n\
    \    sort.Sort(ByMarks(students))\n    fmt.Println(\"After sorting =\", students)\n\
    }\n```\n\n上述程序的输出如下：\n\n```text\nBefore sorting = [Bob: 31 John: 42 Michael: 17\
    \ Jenny: 26]\nAfter sorting = [Michael: 17 Jenny: 26 Bob: 31 John: 42]\n```\n\n\
    在程序 9.11 中，我们声明了一个名为 `Student` 的结构体。我们在 `Student` 中定义了 `String()` 方法，以便以美观的方式打印\
    \ `Student` 对象。然后，我们创建了一个新的 `Student` 切片类型，即 `ByMarks`，并按如下方式在 `ByMarks` 类型上定义了\
    \ `Interface` 的全部三个方法：\n\n- `Len()` 返回切片的长度。\n- `Swap()` 将第 i 个索引元素与第 j 个索引元素交换。\n\
    - `Less()` 具有判断第 i 个索引元素和第 j 个元素中哪个更小的逻辑。\n\n在 `main` 函数中，我们有一个包含四个元素的 `Student`\
    \ 切片。当我们打印 `students` 变量时，它按这些元素插入的顺序打印。在下一行，我们通过传递 `sort.Sort()` 函数对 `students`\
    \ 变量进行排序。在将其传递给 `sort.Sort()` 函数之前，我们已将 `students` 强制转换为 `ByMarks` 类型。\n\n上述方法对于排序来说不必要地复杂。`Len`\
    \ 和 `Swap` 方法是不必要的，因为 `Sort` 函数应该具有内部逻辑来查找切片的长度并交换元素。`sort` 包有一个函数可以克服这种复杂性。我们可以使用\
    \ `sort` 包的 `Slice` 函数。我们不需要实现任何接口。`sort.Slice` 函数期望两个参数：\n\n- 我们想要排序的元素切片。\n\
    - 用于排序逻辑的函数。\n\n以下代码演示了 `Slice` 函数：\n\n#### 程序 9.12\n\n```go\npackage main\n\n\
    import (\n    \"fmt\"\n    \"sort\"\n)\n\ntype Student struct {\n    Name  string\n\
    \    Marks int\n}\n\nfunc (s Student) String() string {\n    return fmt.Sprintf(\"\
    %s: %d\", s.Name, s.Marks)\n}\n\nfunc main() {\n    students := []Student{\n \
    \       {\"Bob\", 31},\n        {\"John\", 42},\n        {\"Michael\", 17},\n\
    \        {\"Jenny\", 26},\n    }\n    fmt.Println(\"Before sorting\", students)\n\
    \    sort.Slice(students, func(i, j int) bool {\n        return students[i].Marks\
    \ < students[j].Marks\n    })\n    fmt.Println(\"After sorting\", students)\n\
    }\n```\n\n上述程序的输出如下：\n\n```text\nBefore sorting [Bob: 31 John: 42 Michael: 17\
    \ Jenny: 26]\nAfter sorting [Michael: 17 Jenny: 26 Bob: 31 John: 42]\n```\n\n\
    在程序 9.12 中，`Student` 结构体未实现任何接口。此代码调用 `sort.Slice()` 方法。我们传递了一个学生切片和一个匿名函数。匿名函数具有按\
    \ Marks 升序对学生进行排序的逻辑。\n\n## 9.6 结构体中的接口\n\n接口可以在结构体体内使用。我们既可以将接口用作嵌入类型，也可以定义接口变量。我们不能在创建结构体值时传递接口的实际值，因为接口是抽象的。我们需要传递实际实现类型的值。因此，当我们在结构体上调用接口的方法时，调用将转到实际实现类型。\n\
    \n### 9.6.1 接口变量作为结构体字段\n\n接口变量可以用作结构体字段。当创建该结构体的对象时，我们需要按如下所示为接口传递实际实现值：\n\n\
    #### 程序 9.13\n\n```go\npackage main\n\nimport \"fmt\"\n\ntype Executor interface\
    \ {\n    Execute()\n}\n\ntype Thread struct {\n}\n\nfunc (t Thread) Execute()\
    \ {\n    fmt.Println(\"Executing thread\")\n}\n\ntype Process struct {\n    exe\
    \ Executor\n}\n\nfunc main() {\n    p := Process{Thread{}}\n    p.exe.Execute()\n\
    }\n```\n\n上述程序的输出如下：\n\n```text\nExecuting thread\n```\n\n在程序 9.13 中，我们创建了一个名为\
    \ `Process` 的结构体，其中接口变量 `exe` 作为字段。`exe` 字段是 `Executor` 接口的变量。`Thread` 结构体实现了\
    \ `Executor` 接口。在 main 函数中，我们创建了一个 `Process` 的变量，并为 `Executor` 字段传递了 `Thread`\
    \ 值。我们在 `p` 变量的 `exe` 字段上调用了 `Execute` 方法。\n"
