    \ {\nfmt.Printf(\"PRODUCER: sending %v\\n\", index)\nch <- index\n}\n\nclose(ch)\n\
    done <- true\n}\n\nfunc consumer(ch chan int) {\nfor val := range ch {\nfmt.Printf(\"\
    CONSUMER: read %v\\n\", val)\n}\n}\n```\n\n上述程序的输出如下：\n\n```text\nPRODUCER: sending\
