  mdcn: "\n```text\nInfinite Loop\nInfinite Loop\nInfinite Loop\nInfinite Loop\n...\n\
    ...\n```\n\n## 3.2.3.5 穿透\n\n在 Go 中，程序控制在执行完某个 case 后会立即退出 switch 语句。但通过使用 `fallthrough`\
    \ 语句，可以将控制转移到表达式 switch 语句中下一个 case 子句的第一个语句。\n\n**程序 3.11**\n\n```go\n// Go program\
    \ to explain fallthrough\n\npackage main\n\nimport (\n\"fmt\"\n)\n\nfunc main()\
    \ {\nswitch number := 200; {\ncase number < 300:\nfmt.Printf(\"%d is less than\
    \ 300\\n\", number)\nfallthrough\ncase number > 100:\nfmt.Printf(\"%d is greater\
    \ than 100\", number)\n}\n}\n```\n\n上述程序将显示以下输出：\n\n```text\n200 is less than\
    \ 300\n200 is greater than 100\n```\n\n`fallthrough` 不能在 switch 的最后一个 case 中使用，因为后面没有更多\
    \ case 了。如果在最后一个 case 中使用 `fallthrough`，将出现以下编译错误：\n\n```text\ncannot fallthrough\
    \ final case in switch\n```\n\n**程序 3.12**\n\n```go\n// Go program using fallthrough\
    \ in last case\n\npackage main\n\nimport (\n\"fmt\"\n)\n\nfunc number() int {\n\
    \ sum := 10 + 20\n return sum\n}\n\nfunc main() {\n\nswitch sum := number(); {\n\
    case sum < 40:\nfmt.Printf(\"%d is lesser than 40\\n\", sum)\nfallthrough\ncase\
    \ sum > 20:\nfmt.Printf(\"%d is greater than 20\", sum)\nfallthrough\n}\n}\n```\n\
    \n上述程序将显示以下输出：\n\n```text\ncannot fallthrough final case in switch\n```\n\n##\
    \ 结论\n\nGolang 中的控制语句用于根据某些条件控制给定程序的执行流程。它们用于确保程序执行期间根据程序状态的变化保持逻辑流程。\n\n在 `if...else`\
    \ 语句中，`if` 语句会在条件为真时执行一段语句；如果条件为假，则会转到 `else` 块并执行它。\n\n该语句允许组合多个 `if...else`\
    \ 语句。\n\n`switch` 语句是多路分支语句，可根据表达式的值高效地将执行转移到代码的不同部分。case 会从上到下进行评估，并在找到为真的 case\
    \ 时停止。如果没有 case 匹配且存在 `default` case，则会执行它。\n\n循环语句用于重复执行给定的代码块。`for` 循环是 Go 语言中唯一的循环。与\
    \ C 不同，Go 不支持 `while` 或 `do...while` 循环。\n\n嵌套循环是在另一个循环内发生的循环，当需要在数据集的每个元素上执行循环操作时非常有用。在\
    \ Go 中，循环可以像其他编程语言一样嵌套。\n\n当给定循环的执行离开其作用域时，在该作用域内创建的对象也会被销毁。循环控制语句用于更改程序的执行。\n\
    \n`break` 语句用于终止当前所在的循环或语句。\n\n`goto` 语句用于将控制转移到 Go 程序中的标记语句。标签是一个有效的标识符，并放置在控制从其转移的语句之前。\n\
    \n`continue` 语句用于在特定条件下跳过给定循环的执行部分。之后，它将控制转移到循环的开头。\n\n在 Go 语言中，如果省略循环条件或使用 `true`\
    \ 布尔值，`for` 循环可以作为无限循环工作。\n\n在 Golang 中，程序控制在执行完某个 case 后会立即退出 switch 语句。但通过使用\
    \ `fallthrough` 语句，可以将控制转移到表达式 switch 语句中下一个 case 子句的第一个语句。\n\n## 问题\n\n- 编写一个\
    \ Go 程序来解释 `if..else` 语句的使用。\n- 判断正误：\n  - `for` 循环在 Golang 中不可用。\n  - Go 没有 `while`\
    \ 或 `do...while` 循环。\n  - `for` 循环在 Golang 中可用。\n- 写出 `if...else if...else` 语句的语法。\n\
    - 什么是 `switch...case` 语句？编写一个 Go 程序来解释 `switch...case` 语句的使用。\n- `goto` 语句在 Go\
    \ 程序中的作用是什么？用 Go 程序解释。\n- Go 支持多少种类型的循环控制语句？编写一个 Go 程序来解释它。\n- 判断正误：\n  - `goto`\
    \ 语句用于将控制转移到 Go 程序中的标记语句。\n  - `continue` 语句不用于在特定条件下跳过循环的执行部分。\n  - 在 Go 中，如果省略循环条件或使用\
    \ `true` 布尔值，`for` 循环可以作为无限循环工作。\n- 写出 Golang 中嵌套 `for` 循环的语法。\n\n## 第 4 章 数组\n\
    \n在 Go 中，数组是相同类型的固定大小元素的集合。数组的元素按顺序存储，可以通过其索引访问。一旦在 Go 中定义了数组，就不能扩展以容纳更多数据。Go\
    \ 是一种静态类型语言。不允许在数组中混合属于不同数据类型的不同值。\n\n### 结构\n\n- 数组声明\n- 数组初始化\n- 数组字面量\n- 默认值和数组类型\n\
    - 访问和赋值数组元素\n- 2D 和 3D 数组\n- 数组迭代\n- 将数组传递给函数\n- 编程示例\n\n### 目标\n\n本章的目的是向读者介绍数组的概念。它还涵盖了在\
    \ Go 编程语言中声明、初始化和将数组传递给函数。\n\n### 4.1 数组\n\n数组是一种容纳相同类型值的容器。Go 中的数组具有固定长度；一旦定义，就不能扩展以容纳更多数据。然而，这个问题可以通过使用切片来解决，你将在下一章学习它。\n\
    \n数组是一个固定长度的序列，用于在内存中存储同质元素。在 Go 中，像许多其他语言一样，数组是固定的。声明数组需要我们指定大小。一旦指定大小，就不能增长。数组是具有固定长度的单一类型元素的编号序列。\n\
    \n数组的元素通过使用 `[]` 索引运算符与其基于零的位置进行索引，这意味着第一个元素的索引是 `array[0]`，最后一个元素的索引是 `n-1`。\n\
    \n### 4.2 数组声明\n\n在 Go 语言中，数组可以通过两种不同的方式创建：使用 `var` 关键字或简写声明。在 Go 中，数组索引从 0 开始，即第一个元素。因此，最后一个元素的索引是\
    \ `n-1`，其中 `n` 是数组的长度。要访问数组中的任何元素，我们需要使用 `a[index]` 语法，其中 `a` 是数组变量。\n\n#### 4.2.1\
    \ 使用 var 关键字\n\n使用 `var` 关键字、类型、名称、大小和元素创建数组。\n\n**语法：**\n\n```\nvar array_name\
    \ [length]Type\n```\n\n例如，`var team [15]int` 可以使用索引 `team[0]` 到 `team[14]` 保存多达\
    \ 15 个分数。尝试访问数组中超出范围的索引将导致编译器或运行时错误。\n\n以下示例将打印大小为 5 的数组：\n\n**程序 4.1**\n\n```go\n\
    // Go program to explain the use of var keyword\n\npackage main\n\nimport \"fmt\"\
    \n\nfunc main() {\nvar x [5]int\nfmt.Println(x)\n}\n```\n\n上述代码的输出如下：\n\n```text\n\
    [0 0 0 0 0]\n```\n\n由于我们没有为 `x` 分配任何值，我们只是定义了数组但没有定义数组元素的值。因此，它将具有其数据类型的零值。\n\n\
    #### 4.2.2 简写声明\n\n**语法：**\n\n```\narray_name := [length]Type{item1, item2, item3,\
    \ ... itemN}\n```\n\n让我们看下面的程序：\n\n**程序 4.2**\n\n```go\n// Go program to explain\
    \ use shorthand declaration\n\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\
    \narr := [5]string{\"Ganga\", \"Yamuna\", \"Godavari\", \"Kaveri\", \"Narmada\"\
    }\nfmt.Println(\"Array elements:\")\n\nfor i := 0; i <= 4; i++ {\nfmt.Println(arr[i])\n\
    }\n}\n```\n\n上述程序的输出如下：\n\n```text\nArray elements:\nGanga\nYamuna\nGodavari\n\
    Kaveri\nNarmada\n```\n"
