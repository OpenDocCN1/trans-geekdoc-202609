    \ has only one method, then it is an interface naming convention that interface\
    \ name should be methodName plus er. In our example, the method name is Execute.\
    \ So, the interface name is Executor by appending r at the end of the method name.\
    \ It is not a hardcore rule but it is a convention.\n\nThere can be multiple methods\
