    \nIn Program 11.6 we have executed the f1 function as a goroutine. The f1 function\
    \ has a for loop iterating from 0 to 9. Within the for loop, we have a condition\
    \ that if an index value is 5 we call the Goexit function. So, the for loop executes\
    \ till index 0 to 5 and it exits and prints from 0 to 4. The main function waits\
    \ until the f1 function completes.\n\n## 11.3 *Channels*\n\nChannel is a type\
    \ in Golang by which two goroutines can communicate. One goroutine can send data\
    \ and another goroutine can receive data. It is like a pipeline. Channels in Golang\
    \ introduce a new way of concurrency. The implementation of concurrency using\
    \ channels works as said in the statement given below:\n\n> *Do not communicate\
    \ by sharing memory; instead, share memory by communicating.*\n\nWe have seen\
