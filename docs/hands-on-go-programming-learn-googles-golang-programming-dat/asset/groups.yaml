    }\n```\n```\n\n以下是上述代码的输出：\n\n```text\nmap[]\nMap is not empty\nmap[ten:10]\n\
    ```\n\n## 6.4 遍历 Go map\n\n您可以使用 for 循环的 range 形式遍历 map。它在每次迭代中为您提供键值对。让我们看下面的程序：\n\
