    \ {\na[i][j] = i + j\n}\n}\nfmt.Println(\"2D Array:\", a)\n}\n```\n\n以下是上述程序的输出：\n\
    \n## 4.5 数组遍历\n\n在 Go 中，我们可以使用 for 循环遍历数组。此外，Go 还提供了 range 运算符，它在 for 循环中返回数组每个元素的索引和值。\n\
    \n### 程序 4.9\n\n// 用于遍历数组的 Go 程序\n\n```go\npackage main\n\nimport \"fmt\"\n\n\
    func main() {\n x := [...]int{10, 20, 30, 40, 50}\n for index := 0; index < len(x);\
    \ index++ {\n fmt.Printf(\"x[%d] = %d\\n\", index, x[index])\n }\n}\n```\n\n以下是上述程序的输出：\n\
