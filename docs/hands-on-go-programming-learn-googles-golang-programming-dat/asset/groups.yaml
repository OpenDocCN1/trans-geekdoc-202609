    \ implementation is always proper as that becomes clear by looking at the type\
    \ that implements which interface. But implicit implementation has its benefits:\n\
    \n- You may want to implement your custom interface in a type which is available\
    \ in a third-party library. You don’t have access to the code, so you can’t change\
    \ the code. The implicit implementation is beneficial in this case. If the type\
    \ has methods that can satisfy your interface, it implements that interface implicitly.\n\
    \n- If you want to create a new interface with very few methods and you want to\
