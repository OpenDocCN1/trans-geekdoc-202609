    \n### 9.1 Introduction\n\nThe syntax of interface is similar to struct. The following\
    \ is the syntax:\n\n```go\ntype InterfaceName interface{\nMethodName(argument\
    \ argumentType) returnType\n}\n```\n\nThe above syntax has a method that has one\
