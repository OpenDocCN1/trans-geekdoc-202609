    \ 方法来解决这个错误。\n\n### 9.2.1 为什么采用隐式实现？\n\n如果你有 Java 背景，你可能会疑惑为什么我们要采用接口的隐式实现。你可能会认为显式实现总是更合适，因为通过查看类型就能清楚它实现了哪个接口。但隐式实现有其好处：\n\
    \n-   你可能希望在一个来自第三方库的类型上实现你的自定义接口。你无法访问其代码，因此不能修改代码。在这种情况下，隐式实现是有益的。如果该类型具有能够满足你接口的方法，那么它就会隐式地实现该接口。\n\
