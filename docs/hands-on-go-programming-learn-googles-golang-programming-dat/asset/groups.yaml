    ```\n\nThe zero value of a map is nil. A nil map has no keys. Therefore, any attempt\
    \ to add keys to a nil map will result in a runtime error. Let’s look at the following\
    \ example:\n\n### Program 6.1\n\n```go\n// Go program to explain the declaration\
    \ of a map\n\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    var m1 map[string]int\n\
    \    fmt.Println(m1)\n    if m1 == nil {\n```\nfmt.Println(\"Map is empty\")\n\
    } else {\nfmt.Println(\"Map is not empty\")\n}\n\n// Attempt to add keys to a\
