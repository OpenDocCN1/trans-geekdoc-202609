    a function definition is prefixed by an ellipsis then the function can accept
    any number of arguments for that parameter. This is shown as follows:


    ```

    func variadic_function(a int, b ...int) {

    // Body of variadic function

    }

    ```


    In the above function, the parameter b is variadic since it''s prefixed by an
    ellipsis, and it can accept any number of arguments.


    Let''s make the first parameter of the variadic_function variadic. The syntax
    will look like this:


    ```

    func variadic_function(a ...int, b int) {

    // Body of variadic function

    }

    ```


    The above variadic_function will fail to compile with an error syntax error:


    **cannot use ... with non-final parameter a**


    In the above function, it is not possible to pass arguments to the parameter b
    because whatever argument we pass will be assigned to the first parameter a since
    it is variadic. Hence, variadic parameters can only be present in last in the
    function definition. The way variadic functions work is by converting the variable
    number of arguments to a slice of the type of the variadic parameter. You will
    learn the concept of slices in *Chapter 5: Slices* in detail:


