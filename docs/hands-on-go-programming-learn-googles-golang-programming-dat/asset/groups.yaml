    # Conclusion


    The methods in an interface do not have a body. All methods of an interface are
    purely abstract.


    An interface’s methods can have arguments and return types.


    Any custom type can implement the interface.


    There is no explicit syntax to implement an interface. When any type defines all
    methods of the interface, then that type implicitly implements the interface.


    A type that implements an interface can also have other methods.


    A type can implement more than one interface.


    An interface can be implemented by many types.


    When an interface does not have any method, it is called an empty interface. An
    empty interface is by default implemented by all types.


    An interface can be used as a field of a struct. When it is used, we need to pass
    the actual implementation of the interface while creating a struct object.'
