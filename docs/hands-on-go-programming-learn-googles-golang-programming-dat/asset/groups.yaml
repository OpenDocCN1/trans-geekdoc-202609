    \ err 为 nil，则意味着 create() 函数没有返回错误，因此它会继续处理其余代码。此代码使用 fmt 包的 Errorf 函数创建错误值：\n\
    \n### 程序 12.1\n\n```\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\
