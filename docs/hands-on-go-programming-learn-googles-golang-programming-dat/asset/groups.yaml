  mdcn: "\n\n## 10.3.2 算术运算符\n\n那些具有 C/C++ 背景的人会期望指针上支持算术运算符。但为了简单起见，Go 语言不允许在指针上使用算术运算符。指针上的算术运算符可能会导致非法地址，这是非常危险的。\n\
    \n在 C 系列语言中，指针算术在遍历数组时非常有用，因为它速度很快。然而，如今的硬件和编译器已经非常先进，使用索引遍历数组比使用指针算术更高效。因此，没有必要使用指针算术来快速遍历数组。\n\
    \n## 10.4 复合类型上的指针\n\n我们已经了解了基本数据类型上的指针。现在，我们将了解数组和切片等复合数据类型上的指针。\n\n### 10.4.1.1\
    \ 声明\n\n创建指向数组的指针有两种方法：使用 `var` 关键字和使用 `:=` 运算符。\n\n### 使用 var 关键字声明\n\n[程序 10.9](#)\
    \ 使用 `var` 关键字声明了一个指向数组的指针：\n\n### 程序 10.9\n\n```go\npackage main\n\nimport \"\
    fmt\"\n\nfunc main() {\n\tvar arr1 *[5]int\n\tvar arr2 = [5]int{1, 2, 3, 4, 5}\n\
    \tarr1 = &arr2\n\tfmt.Println((*arr1)[0])\n}\n```\n\n上述程序的输出如下：\n\n```text\n1\n\
    ```\n\n在**程序 10.9**中，我们使用星号声明了一个指向数组变量的指针。我们声明了 `[5]int` 类型的数组，即 `[5]int{1, 2,\
    \ 3, 4, 5}`。然后，我们将 arr2 的地址赋值给了 arr1。我们打印了 arr1 的第 0 个元素。从输出中可以看到，arr1 的第 0 个元素是\
    \ 1，因为我们将 arr2 赋值给了 arr1，而 arr2 在数组第 0 个位置的值是 1。请注意，我们使用了星号来访问指针数组上的值，即 `(*arr1)[0]`。\n\
    \n访问指针数组上的元素并不一定要使用星号。我们可以像访问数组变量一样访问指针数组的元素。这样看起来非常清晰。**程序 10.10** 在没有使用星号的情况下访问了指针数组元素：\n\
    \n### 程序 10.10\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\nvar\
    \ arr1 *[5]int\nvar arr2 = [5]int{1, 2, 3, 4, 5}\narr1 = &arr2\nfmt.Println(arr1[0])\n\
    }\n```\n\n上述程序的输出如下：\n\n```text\n1\n```\n\n程序 10.10 的输出与程序 10.9 类似。代码几乎相同，除了一个变化，即我们访问指针数组元素时没有使用星号。这不仅看起来更清晰，而且更易读。\n\
    \n当使用 `var` 关键字声明指针数组但尚未分配任何数组地址，并且我们尝试访问指针数组的任何元素时，程序将会发生 panic。程序 10.11 对此进行了演示：\n\
