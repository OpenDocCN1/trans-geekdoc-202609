    ### 2.6.1 Defer


    A defer statement postpones the execution of a function and pushes a function
    call onto a list until the surrounding function returns, either normally or through
    a panic. Defer is commonly used to simplify functions that perform various clean-up
    actions as shown below:


    ### Program 2.9


    ```

    //Program to explain defer


    package main


    import "fmt"


    func main() {

    defer fmt.Println("GO")

    fmt.Println("Book")

    }

    ```


    The following will be the output for the above program:


    Book

    GO


    ## Conclusion


    A function declaration consists of the keyword the name of the function, a parameter
    list (empty for main), a result list, and the body of the function—the statements
    that define what it does—enclosed in braces.


    When a function is invoked, you pass a value to the parameter. This value is referred
    to as an actual parameter or argument. The parameter list refers to the type,
    order, and the number of the parameters of a function.


    When a program calls a function, the program control is transferred to the called
    function. A called function performs a defined task, and when its return statement
    is executed or when its function-ending closing brace is reached, it returns the
    program control to the main program.


    In Go, a function can return multiple values using the return statement. The type
    of return values depends on the type of the parameters defined in the parameter
    list.


    Golang allows giving names to the return parameters of the functions in the function
    definition, i.e., explicit naming of return variables in the function definition.
    It eliminates the need to mention the variable''s name with the return statement.


    Go does not have a call by reference since it doesn’t have reference variables.
    However, we can pass the address of the variable as a value. Here, we will use
    the concept of pointers and dereference operators. The address operator, & is
    used to get the address of a variable of any data type and the dereference operator,
    * is used to access the value at an address.


    Functions, in general, accept only a fixed number of arguments but the variadic
    function can accept a variable number of arguments. Only the last parameter of
    a function can be variadic. If the last parameter of a function definition is
    prefixed by an ellipsis, then the function can accept any number of arguments
    for that parameter.


    The variadic function increases the readability of your program. It can be used
    in the scenarios when the number of parameters is not known.


    A defer statement postpones the execution of a function and pushes a function
    call onto a list until the surrounding function returns, either normally or through
    a panic. Defer is commonly used to simplify functions that perform various clean-up
    actions.


