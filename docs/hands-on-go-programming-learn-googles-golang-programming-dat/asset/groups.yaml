    ### 方法


    方法类似于函数。方法始终与一种类型相关联。可以为任何数据类型创建方法。数据类型可以是基本类型 like 等等。或者，它可以是复合类型 like 数组 map
    等。方法可以访问和修改类型的属性。


    ### 结构

    - 定义

    - 值接收器和指针接收器

    - 不同类型的方法

    - 嵌入类型的方法


    ### 8.1 定义


    方法的语法几乎与函数相似，只有一个区别——方法总是在 func 关键字和方法名之间有一个接收器，如下所示：


    ```

    func (receiverName receiverType) methodName(param1 paramType) (returnType1) {

    ...

    }

    ```


    接收器放在 func 关键字之后、方法名之前 的括号 () 中。其余语法与函数相似。它有一组参数。方法可以有一个或多个参数。方法参数可以有不同的类型，也可以全部是同一类型。返回类型也适用相同规则。然而，如果方法返回多个值，则返回类型必须放在括号中；否则，我们可以省略括号。


    你可能会想知道为什么方法需要接收器。我们在其他基于类的面向对象语言如 C++ 和 Java 中不需要接收器。这是因为在 C++ 和 Java 中方法被分组到类中。方法始终声明为类体的一部分。因此编译器可以通过类定义理解该类具有某些方法。但在
    Go 中并非如此。类型及其方法

    未分组。方法不是其类型声明的一部分。甚至方法也不需要在与类型相同的源文件中。你可以在不同的源文件中声明方法和其类型。因此，我们需要在方法上使用接收器，以便
    Go 编译器能够理解它属于哪种类型。


    这里最关键的一点是，方法和其类型必须在同一包中声明。你不能在与类型不同的包中声明方法。这就是我们不能为预定义命名类型添加方法的原因。示例：你不能为添加方法。然而，对于这个问题有一个变通方法，我们将在后面的章节中看到。


    ### 程序 8.1


    ```go

    type rectangle struct {

    length float32

    width float32

    }

    func (r rectangle) area() float32 {

    return r.length * r.width

    }

    ```


    _程序 8.1_ 声明了一个名为 rectangle 的结构体，其字段为 length 和 width。Both length and width are
    declared as float32。The rectangle struct has a method named as area。The method
    is not declared as part of the rectangle body. Instead, it is declared separately.
    It is considered a method of the rectangle struct because the rectangle is used
    as the receiver type. The receiver is placed between the func keyword and the
    method name。The receiver is declared with the receiver variable r。We can access
    fields of the receiver in a

    method body by applying the dot operator on the receiver variable. We have accessed
    length and width in the method body by `r.length` and `r.width`。The method calculates
    the area of the rectangle by multiplying length and width and finally, it returns
    the result. The return type of the method is float32。


    你可以为接收器名称提供任何有效的标识符。你可以像我们在 Java 或 Python 中分别定义的那样将接收器名称定义为 *this* 或 *self*，但这不是强制性的。也可以为所有方法定义不同的接收器名称。为所有接收器提供简短且相同的名称是一个好习惯。*程序
    8.2* 声明了两个方法，area 和 perimeter，并且这两个方法具有不同的接收器名称，分别为 r 和 rect。


    ### 程序 8.2


    ```go

    type rectangle struct {

    length float32

    width float32

    }

    func (r rectangle) area() float32 {

    return r.length * r.width

    }

    func (rect rectangle) perimeter() float32 {

    return (2 * rect.length) + (2 * rect.width)

    }

    ```


    接收器名称在方法声明中不是强制性的。你可以通过仅提供接收器类型来声明方法。如果方法不读取或修改接收器的任何字段，我们可以省略接收器名称（尽管这不是一个有效的用例，因为

    如果方法确实读取/修改字段，那么声明该方法就没有意义了）。


    程序 8.3 声明了一个方法名 doSomething，仅使用接收器类型。此方法不读取/修改任何 rectangle 字段 相反，它只是将字符串打印到控制台，因此我们已删除接收器变量，如下所示：


    ### 程序 8.3


    ```

    type rectangle struct {

    length float32

    width float32

    }

    func (rectangle) doSomething() {

    fmt.Println("I don''t know what to do")

    }

    ```


    到目前为止，我们已经学习了如何声明方法。现在，让我们学习如何调用方法。方法可以使用点运算符在类型值上调用。下面给出的代码在 rectangle 结构体的 rect
    变量上调用 area() 方法。它返回一个 float32 值，因此我们已将其分配给变量 a。最后，它将结果打印到控制台：


    ### 程序 8.4


    ```

    func main() {

    rect := rectangle{12.3, 21.45}

    a := rect.area()

    fmt.Println(a)

    }

    ```


    ### 全部整合


    ### 程序 8.5


    ```

    package main

    import "fmt"

    func main() {

    rect := rectangle{12.3, 21.45}

    a := rect.area()

    fmt.Println(a)

    }

    type rectangle struct {


    length float32

    width float32

    }

    func (r rectangle) area() float32 {

    return r.length * r.width

    }

    func (r rectangle) perimeter() float32 {

    return (2 * r.length) + (2 * r.width)

    }

    ```


    ### 8.2 值接收器和指针接收器


    我们在第 节的所有示例中都使用了值接收器。我们正在尝试从值接收器读取值。然而，如果我们尝试修改值接收器上的值，它不会反映在调用者中，因为修改是由方法中的值接收器完成的，并且更改对调用者不可见。让我们在以下程序中验证这一点：


    ### 程序 8.6


    ```go

    package main

    import "fmt"

    func main() {

    rect := rectangle{12.3, 21.45}

    rect.increaseLength(3.4)

    fmt.Println(rect)

    }

    type rectangle struct {

    length float32

    width float32

    }

    func (r rectangle) increaseLength(a float32) {

    r.length = r.length + a

    }

    ```


    以下将是上述程序的输出：


    ```text

    {12.3 21.45}

    ```


    *程序 8.6* 添加了一个新方法，使用值接收器。此方法根据提供的输入增加矩形的长度。main 方法为 rectangle 结构体创建了一个变量 rect，长度和宽度值分别为
    12.3 和 21.45。main 方法通过传递 3.4 作为参数调用 increaseLength 方法。最后，它将 rect 打印到控制台。根据代码，它应该打印具有更新长度的
    rect，但事实并非如此。它在控制台上打印 {12.3 21.45}，其中长度仍然是 12.3。原因非常简单。increaseLength 是使用值接收器定义的。


    如果你想修改接收器并希望更改对调用者可见？你可以使用指针接收器。指针接收器方法的语法与值接收器方法相似，除了一个区别，即接收器定义为指针。请注意下面给出的语法。receiverType
    前缀为星号


    ```go

    func (receiverName *receiverType) methodName(param1

    paramType) (returnType) {

    ...

    }

    ```


    让我们使用指针接收器重新声明 increaseLength 方法：


