    \ fly\n```\n\nWe have created an interface named `Bird`. The `Bird` interface\
    \ has a method `Fly()`. We have created three structs `Eagle`, `Pigeon`, and `Penguin`,\
    \ and all implement Bird by overriding `Fly()` methods. Most importantly, we have\
    \ defined a function as `flyNow(b Bird)`. The `flyNow` function expects Bird as\
    \ an argument and calls the `Fly` method on the variable of `Bird`. The `flyNow`\
    \ function does not know which implementation of Bird will be passed; it only\
    \ knows that the implementation will have a `Fly` method. We can pass an object\
    \ of any type which implements the Bird interface. In the `main()` function, we\
    \ are calling the `flyNow` function three times and we have passed the value of\
    \ `Eagle{}`, `Pigeon{}`, and `Penguin{}`. When the `flyNow` function calls the\
