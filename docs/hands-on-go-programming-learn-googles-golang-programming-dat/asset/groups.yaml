    \ `St`。类型 `St` 通过使用指针接收器定义 `m1` 和 `m2` 方法来实现 `Itr` 接口。在 main 函数中，我们使用 `var` 关键字声明了一个\
    \ `Itr` 的变量，并将 `St` 的值赋给它。然后，我们在接口变量上调用了 `m1` 和 `m2` 方法。但运行此代码时，我们会得到编译错误。错误提示\
    \ `St` 未实现 `Itr`。出现此错误的原因是 `*St` 实现 `Itr` 接口，而不是 `St`。\n\n如果我们重新运行上述代码，将 `St`\
    \ 的地址赋给变量 `i`，代码将正常工作。\n\n当我们通过值接收器实现接口时，可以将该类型的值和地址都赋给接口。让我们在以下代码中查看这一点：\n\n\
    #### 程序 9.8\n\n```go\npackage main\n\nimport \"fmt\"\n\ntype Itr interface {\n\
