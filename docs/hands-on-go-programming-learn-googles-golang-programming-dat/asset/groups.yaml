    \n**返回了值 0。通道已关闭**\n\n### 11.3.2.2 遍历通道\n\n我们可以在读取通道时遍历通道。遍历通道读取数据有两种方式。一种方式是使用通道返回的第二个值。我们可以使用无限循环进行遍历，并在第二个值为\
