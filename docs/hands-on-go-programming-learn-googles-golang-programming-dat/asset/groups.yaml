    ## 第10章：[指针]


    在本章中，你将了解 Go 语言中的指针是什么。本章将向你解释指针的用途、如何声明指针变量，以及理解指针类型。你还将了解为什么在 Go 语言中不允许对指针变量进行算术运算。


    ## 第11章：[并发]


    本章将介绍 goroutine 和 channel（通道）。你将学习如何定义 goroutine、WaitGroup 是什么，以及如何使用 WaitGroup
    等待其他 goroutine 完成。你将理解 channel 的概念。我们将使用 channel 在 goroutine 之间进行通信。我们将创建两种类型的
    goroutine：有缓冲和无缓冲。


    ## 第12章：[错误处理]


    本章将介绍错误处理。学完本章后，你将了解 Go 语言中的错误是什么、如何从函数或方法中返回错误，以及如何在调用函数中处理这些错误。我们还将看到内置的 error
    接口、错误处理包，以及 errors 包中的方法、函数和结构体。你将学习如何定义一个新错误、创建自定义错误类型、什么是 panic、如何使用 recover
    处理 panic、什么是 defer，以及处理 panic 时 defer 函数的重要性，等等。


