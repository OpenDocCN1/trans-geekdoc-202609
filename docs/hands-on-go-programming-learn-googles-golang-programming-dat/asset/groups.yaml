    # 2.1 Function


    A function is an independent section of code that maps input parameters to output
    parameters. It is a collection of statements that are used to perform a specific
    task and return the result to the caller.


    Functions are the building blocks of a Go program. They have inputs, outputs,
    and a series of steps called statements that are executed in order.'
