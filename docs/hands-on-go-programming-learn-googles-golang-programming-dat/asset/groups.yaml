    \ [0 0 0 10 0]\nValue assigned at 3rd array index: 10\n```\n\n## 4.4 二维和三维数组\n\
    \n数组类型是一维的，但你可以组合类型来构建多维数据结构。数组本身是 Go 语言中的一种类型。数组是相同数据类型的集合。例如，整数数组或字符串数组。\n\n\
