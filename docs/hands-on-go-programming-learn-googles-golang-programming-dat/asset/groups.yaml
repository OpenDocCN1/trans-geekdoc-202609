    \ that your function can panic and so, the caller may not write the recover function.\
    \ In that case, the whole program will terminate. It is always the best practice\
    \ to return an error from the function instead of calling panic explicitly.\n\n\
    When a function returns an error, we should handle that error. We should not ignore\
    \ it.\n\n## Conclusion\n\nGolang uses error type for error handling.\n\nA function\
    \ can return an error type as the last return type if the function can cause the\
    \ error.\n\nIt is not mandatory to return error type as the last return type.\
    \ It is a convention.\n\nWhen there is no error returned by the function, the\
    \ function returns nil as an error. The caller function checks whether the error\
    \ is nil or not to check if there is an error in calling the function.\n\nWe can\
