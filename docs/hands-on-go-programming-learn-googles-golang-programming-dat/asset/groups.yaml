    \ `Bird` 类型的变量上调用 `Fly` 方法。`flyNow` 函数并不知道会传入哪一个 Bird 的实现；它只知道该实现会有一个 `Fly` 方法。我们可以传入任何实现了\
    \ Bird 接口的类型的对象。在 `main()` 函数中，我们调用了 `flyNow` 函数三次，并分别传入了 `Eagle{}`、`Pigeon{}`\
    \ 和 `Penguin{}` 的值。当 `flyNow` 函数调用 `Fly` 方法时，实际调用会进入 `Eagle`、`Pigeon` 或 `Penguin`\
    \ 的接收者。\n\n## 9.3 空接口\n\n到目前为止，我们已经看到，如果一个类型拥有某个接口的所有方法，那么它便满足该接口，并隐式地实现了该接口。但假如一个接口没有任何方法会怎样？在这种情况下，所有类型都满足该接口。没有任何方法的接口被称为空接口。\n\
    \n因为所有类型都满足空接口，所以我们可以将任意类型的值赋给该接口的变量。\n\n**程序 9.6**\n\n```go\npackage main\n\n\
    import \"fmt\"\n\ntype MyEmpty interface {\n}\n\ntype Student struct {\n\tid \
    \  int\n\tname string\n}\n\nfunc main() {\n\tvar empty MyEmpty\n\tempty = 10\n\
    \tfmt.Println(empty)\n\tempty = \"a\"\n\tfmt.Println(empty)\n\tempty = 22.3\n\t\
    fmt.Println(empty)\n\tempty = Student{101, \"Shyam\"}\n\tfmt.Println(empty)\n\
    }\n```\n\n上述程序的输出如下：\n\n```\n10\na\n22.3\n{101 Shyam}\n```\n\n我们创建了一个名为 `MyEmpty`\
    \ 的空接口。接口 `MyEmpty` 没有任何方法。我们还创建了一个 `Student` 结构体，其字段为 `id` 和 `name`。在 main 函数中，我们创建了一个名为\
