    }\n```\n```\n\nThe following will be the output for the above code:\n\n```text\n\
    map[]\nMap is not empty\nmap[ten:10]\n```\n\n## 6.4 Iterating over Go maps\n\n\
    You can iterate over a map using a range form of the for loop. It gives you the\
    \ key and value pair in every iteration. Let’s look at the following program:\n\
    \n### Program 6.4\n\n```go\n// Go program to explain iteration over a map\n\n\
