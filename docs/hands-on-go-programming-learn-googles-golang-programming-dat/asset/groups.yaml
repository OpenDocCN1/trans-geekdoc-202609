    \   - 12.1.2 用户自定义错误\n  - 12.2 Panic\n    - 12.2.1 Panic 和 defer\n  - 12.3 Recover\n\
    \  - 12.4 最佳实践\n  - 结论\n  - 问题\n- 索引\n\n## 第 1 章\n\n### 介绍\n\nGo 编程语言由 Robert\
    \ Griesemer、Rob Pike 和 Ken Thompson 于 2007 年在 Google 构思。它是一种开源的通用编程语言，支持高性能网络和多处理。Go\
    \ 编译器最初用 C 编写，但现在是用 Go 本身编写的。\n\n### 结构\n\n- 数据类型\n- 常量、变量和运算符\n- 具类型常量和无类型常量\n\
    - 多个常量声明\n- 重新声明概念\n- 重新赋值概念\n- 代码结构\n\n### 目标\n\n本章涵盖数据类型、常量、变量、运算符、重新赋值和重新声明的基本概念。你将学习如何在\
    \ Go 编程语言中使用它们。\n\n### 介绍\n\nGo 是一种用于大型分布式系统和高度可扩展网络服务器的系统级编程语言。它非常适合构建网络服务器和工具等基础设施，并适用于云、移动应用、机器学习等。Go\
    \ 提供高效的并发、灵活的数据抽象方法，并支持自动内存管理，即垃圾回收。\n\n### 为什么使用 Go 编程？\n\n大多数编程语言都支持多线程，但竞争条件和死锁给创建多线程应用程序带来了困难。例如，在\
    \ Java 中创建新线程大约消耗 1 MB 的内存堆大小。现在，考虑一种需要启动数千个此类线程的情况。那么，它将导致内存不足。\n\n此外，您可以添加到处理器（如四核和八核）以提高处理能力的核心数量是有限的。由于成本问题，您无法不断向处理器添加更多缓存以提高性能。因此，我们只剩下一种选择，即构建性能更高的更高效的软件。\n\
    \nGo 通过 goroutine 为该问题提供了解决方案。您一次可以启动数百万个，因为它们消耗 ~2KB 堆内存。Goroutine 启动时间更快，并且仅在需要时才使用更多内存。此外，单个\
    \ goroutine 可以在多个线程上运行，因为 goroutine 和操作系统线程没有 1:1 映射。\n\n### 1.1 数据类型\n\n数据类型对一组相关值进行分类并描述可以执行的操作。\n\
    \n#### 1.1.1 数值类型\n\n它们是算术类型，表示整数类型或浮点值。\n\n**整数类型：**\n\n|  |  |  |  |  |  |\n\
    |---|---|---|---|---|---|\n| types: | types: | types: | types: | types: | types:\
    \ |\n| types: | types: | types: | types: | types: | types: |\n| types: | types:\
    \ | types: | types: | types: | types: |\n| types: | types: | types: | types: |\
    \ types: | types: |\n| types: | types: | types: | types: | types: | types: |\n\
    | types: | types: | types: | types: | types: | types: |\n| types: | types: | types:\
    \ | types: | types: | types: |\n| types: | types: | types: | types: | types: |\
    \ types: |\n\n表 1.1\n\n**浮点类型：**\n\n|  |  |  |  |\n|---|---|---|---|\n| types:\
    \ | types: | types: | types: |\n| types: | types: | types: | types: |\n\n|  |\
    \  |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|---|\n| types: | types: |\
    \ types: | types: | types: | types: | types: | types: |\n| types: | types: | types:\
    \ | types: | types: | types: | types: | types: |\n\n表 1.2\n\n```go\ny := \"apple\\\
    norange\"\nfmt.Println(y)\n\nz := `apple\\norange`\nfmt.Println(z)\n}\n```\n\n\
    以下是上述程序的输出：\n\n**apple**\n**orange**\n**apple\\norange**\n\n#### 1.1.3 布尔类型\n\n\
    **程序 1.2**\n\n```go\n// Go program to explain boolean types\n\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    var b bool\n    fmt.Println(b)\n    b = true\n\
    \    fmt.Println(b)\n}\n```\n\n以下是上述程序的输出：\n\n**false**\n\n**true**\n\n#### 1.1.4\
    \ 派生类型\n\n派生类型可能包括结构体类型、函数类型、切片类型、接口类型、映射类型和通道类型。\n\n### 1.2 常量\n\n在 Go 中，const\
    \ 是引入标量值（如 3.14159）名称的关键字。此类值称为常量。\n\n**类型：** 当变量在未指定显式类型的情况下声明（使用 `:=` 语法或 `var\
    \ =` 表达式语法）时，变量的类型会从右侧的值推断出来。\n\n常量使用 const 关键字声明，可以是数值、字符串、布尔或字符值。\n\n常量不能使用\
    \ `:=` 语法声明\n\n例如：`const Pi = 3.14`\n\n#### 1.2.1 变量声明\n\n未显式初始化值的变量会被赋予数值类型的默认值零，布尔类型的\
    \ false，以及字符串类型的 \"\"（空字符串）。让我们看下面的程序：\n\n**程序 1.3**\n\n```go\n// Go program showing\
    \ variables declared\n// without an explicit initial value\n\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    var f float64\n    var i int\n    var b bool\n\
    \    var s string\n    fmt.Printf(\"%v %v %v %q\\n\", f, i, b, s)\n}\n```\n\n\
    以下是上述程序的输出：\n\n- `0 0 false \"\"`\n\n在 Go 中，变量的类型在变量名之后指定。\n\n如果您想在一行上放置两个（或更多）语句，它们必须用分号分隔。\n\
    \n声明变量时，它会被赋予该类型的 *自然* 空值。\n\n这意味着在这里，在 `var i int` 之后，i 的值为 0。\n\n使用 `var s`，s\
    \ 被赋予零字符串，即 `\"\"`。\n\n比较以下具有相同效果的代码片段：\n\n**使用 = 的声明**\n\n```go\nvar a int =\
    \ 20\nvar b bool = true\n```\n\n`var` 关键字用于声明变量然后为其赋值。\n\n**使用 := 的声明**\n\n您可以在此语法中省略\
    \ `var` 和数据类型。\n\n```go\na := 20\nb := true\n```\n\n当 Go 找到 `:=` 赋值语法时，它理解需要用初始值声明一个新变量。但您不能使用此语法为预定义变量赋值。变量类型从值推断出来。例如，值\
    \ 20 表示 int，值 true 告诉 Go 类型应为布尔。\n\n#### 1.2.2 短变量声明\n\n在 Go 中，您可以通过以下两种方式声明变量：\n\
    \n- 使用 `var` 关键字\n- 使用短声明运算符\n\n短变量声明运算符用于在函数内部声明和初始化局部变量。它缩小了变量的作用域。\n\n使用短声明运算符，变量在不指定类型的情况下声明。变量的类型由\
    \ `:=` 运算符右侧表达式的类型决定。\n\n短变量声明运算符的语法：\n\n```\nvariable_name := expression or value\n\
    ```\n\n示例：\n\n```\na := 10\n```\n\n```\nx, y := 100, 200\n```\n\n```\np, q, r\
    \ := 150, 250, 300\n```\n\n**短变量声明：**\n\n- 它仅用于在函数内部声明和初始化变量。\n- 变量的声明和初始化同时进行。\n\
    - 变量在函数内部声明，因此它们具有局部作用域。\n- 在短变量声明中不需要提及变量的类型。\n\n"
