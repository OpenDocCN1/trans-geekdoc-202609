    ## Conclusion


    A map is an unordered collection of key-value pairs in Golang. The keys are unique
    within a map but the values may not be. It is widely used because it provides
    fast lookups and values that can be retrieved, updated, or deleted with the help
    of keys.


    In Golang, a map is also known as an associative array, a hash table, or a dictionary.
    A map is used to look up a value by its associated key.


    The zero value of a map is nil and a nil map has no keys. Therefore, any attempt
    to add keys to a nil map will result in a runtime error.


    In Go, a map can be initialized by either using a map literal or a built-in make()
    function.


    A map literal is the easiest way to initialize a map with some data in Go programming.
    You just need to pass the key-value pairs separated by a colon inside curly braces.
    The last trailing comma is necessary as otherwise, you’ll get a compiler error.


    In Go, you can initialize a map using the built-in make() function. You just need
    to pass the type of the map to the make() function and it will return an initialized
    and ready-to-use the map.


    You can iterate over a map using a range form of the for loop in the Go programming
    language. It gives you the key and value pair in every iteration.


    In Golang, a map is an unordered collection and therefore, the iteration order
    of a map is not guaranteed to be the same every time that you iterate over it.
    So, if you run any program multiple times, you’ll get the results in different
    orders.


    In a map, if you try to add an already existing key, it will merely override or
    update the value of that key with the new value.


    If a key doesn’t exist in the given map, it will return a zero value, i.e., nil;
    and if the key exists in the given map, it will return the value related to that
    key.


    In Go, when you retrieve the value assigned to a given key using the syntax it
    returns an additional Boolean value as well which is true if the key exists in
    the map and is false if it doesn’t exist.


    In maps, you are allowed to delete the key present in the map using the delete()
    function. It’s a built-in function in Golang. It does not return any value and
    doesn’t perform any action if the key is not present in the given map.


    Maps are reference types in Golang. When you assign a map to a new variable, both
    of them refer to the same underlying data

    structure. Therefore, changes done by one variable are visible to the other.


