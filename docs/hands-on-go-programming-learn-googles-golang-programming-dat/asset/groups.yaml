    }\nfunc main() {\np := person{101, \"Xyz\"}\np.setName(\"Abc\")\nfmt.Println(p)\n\
    }\n```\n\nState true or false:\n\n- We can create an overloaded method in Golang.\n\
    \n- The pointer receiver method can only be called on the address of the type\
