    ```go\n}\nfunc main() {\n\tb := B{}\n\tb.m1()\n}\n```\n\n接口在 Golang 中提供了纯粹的抽象。接口体中只能包含方法声明和嵌入的接口。接口中的方法没有函数体，只能定义方法签名。我们不能创建接口的对象。接口是为了实现而设计的。任何实现接口的类型都会提供方法的函数体。\n\
