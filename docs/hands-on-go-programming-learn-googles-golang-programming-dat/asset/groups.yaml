  md: "\n## Conclusion\n\n- The methods in an interface do not have a body. All methods\
    \ of an interface are purely abstract.\n- An interface’s methods can have arguments\
    \ and return types.\n- Any custom type can implement the interface.\n- There is\
    \ no explicit syntax to implement an interface. When any type defines all methods\
    \ of the interface, then that type implicitly implements the interface.\n- A type\
    \ that implements an interface can also have other methods.\n- A type can implement\
    \ more than one interface.\n- An interface can be implemented by many types.\n\
    - When an interface does not have any method, it is called an empty interface.\
    \ An empty interface is by default implemented by all types.\n- An interface can\
    \ be used as a field of a struct. When it is used, we need to pass the actual\
    \ implementation of the interface while creating a struct object.\n- Polymorphism\
    \ can be implemented using an interface in Golang.\n\n## Questions\n\nWhat will\
    \ be the result of the following program?\n\n```go\npackage main\n\nimport \"\
    fmt\"\n\ntype I interface {\n\tm1()\n}\n\ntype T struct {\n}\n\nfunc (t *T) m1()\
    \ {\n\tfmt.Println(\"M1 of T\")\n}\n\nfunc main() {\n\tvar i I\n\tt := T{}\n\t\
    i = t\n\ti.m1()\n}\n```\n\n- M1 of T\n- Compilation error\n\nWhat will be the\
    \ result of the following program?\n\n```go\npackage main\n\nimport \"fmt\"\n\n\
    type I interface {\n    m1()\n}\n\ntype T struct {\n}\n\nfunc (t *T) m1() {\n\
    \    fmt.Println(\"M1 of T\")\n}\nfunc (t *T) m2() {\n    fmt.Println(\"M2 of\
    \ T\")\n}\n\nfunc main() {\n    var i I\n    t := T{}\n    i = &t\n    i.m2()\n\
    }\n```\n\n- M2 of T\n- M1 of T\n- Compilation error\n\nWhat is the stringer interface?\n\
    \n- It converts every object into a string.\n- It is an empty interface and every\
    \ type by default implements this.\n- It has a method named `String()`. When you\
    \ implement the `String` method on any type, we can customize the output of the\
    \ type.\n- There is no such interface in Golang.\n\nWhich is the name of the interface\
    \ which can be used for sorting?\n\n- Sorter\n- SortInterface\n- Comparator\n\n\
    ## Interface\n\nSelect true statements from the following:\n\n- The `implements`\
    \ key can be used to implement an interface.\n- A type can implement more than\
    \ one interface.\n- An interface can be implemented by many types.\n- There is\
    \ no syntax to implement an interface.\n- To implement an interface in any type,\
    \ the type needs to implement all the methods of the interface.\n\n## Pointers\n\
    \nThe pointer variable can hold the memory address of another variable. When the\
    \ value of the variable is changed, it reflects in the pointer variable. Pointers\
    \ are very useful when the variable is passed to a function. When any change happens\
    \ to the variable, it reflects in the caller function.\n\n## Structure\n\n- What\
    \ are pointers?\n- How can we use pointers?\n- Pointer concepts\n- Programming\
    \ examples\n\n## Objective\n\nIn this chapter, you will learn what pointers are\
    \ in Golang. This chapter will explain to you the use of a pointer, how to declare\
    \ a pointer variable, and what are the pointer types. You will also learn why\
    \ arithmetic operations are not allowed on pointer variables in Golang.\n\n##\
    \ 10.1 Declaration\n\nThe ampersand (`&`) can be used to access the memory address\
    \ of any value. In the program, the address of variable `x` is accessed using\
    \ `&x` and assigned to variable `a`. Program 10.1 will print the value and address\
    \ of the variable.\n\n### Program 10.1\n\n```go\npackage main\n\nimport \"fmt\"\
    \n\nfunc main() {\n    x := 15\n    a := &x\n    fmt.Println(\"Value of x:\",\
    \ x)\n    fmt.Println(\"Address of x:\", a)\n}\n```\n\nThe following will be the\
    \ output for the above program:\n\n```\nValue of x: 15\nAddress of x: 0xc000014058\n\
    ```\n\n> **Note:** Memory address of x can be different on each run.\n\nThe variable\
    \ `a` is called a pointer variable because it holds the memory address of a variable.\
    \ The value pointed to by the pointer variable can be accessed using an asterisk\
    \ (`*`). Accessing the pointer's underlying value using the `*` is called *dereferencing*.\
    \ Program 10.2 will print...\n\n### Program 10.2\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    x := 15\n    a := &x\n\n    fmt.Println(\"Value\
    \ at address of x:\", *a)\n}\n```\n\nThe following will be the output for the\
    \ above program:\n\n```\nValue at address of x: 15\n```\n\nThe above dereferencing\
    \ statement is equivalent to the statement below:\n\n```go\nfmt.Println(\"Value\
    \ of x:\", *(&x))\n```\n\nSince the pointer variable holds the address of any\
    \ value, any modification to the value pointed to by the pointer variable will\
    \ be reflected in the actual value. Program 10.3 modifies the value of `*a` and\
    \ it will reflect in variable `x` as well.\n\n### Program 10.3\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main() {\n    x := 15\n    a := &x\n    fmt.Println(\"\
    Value of x(before modification):\", x)\n    fmt.Println(\"Value of *a:(before\
    \ modification):\", *a)\n    *a = 20\n    fmt.Println(\"Value of x(After modification):\"\
    , x)\n    fmt.Println(\"Value of *a:(After modification):\", *a)\n}\n```\n\nThe\
    \ following will be the output for the above program:\n\n```\nValue of x(before\
    \ modification): 15\nValue of *a:(before modification): 15\nValue of x(After modification):\
    \ 20\nValue of *a:(After modification): 20\n```\n\nThe built-in function `new()`\
    \ can be used to create a pointer:\n\n### Program 10.4\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    a := new(int)\n    *a = 15\n    fmt.Println(*a)\n\
    \    fmt.Println(a)\n}\n```\n\nThe following will be the output for the above\
    \ program:\n\n```\n15\n0xc000014058\n```\n\nThe pointer variable can also be created\
    \ using the `var` keyword. The following statements create a pointer of type `*int`\
    \ and assign the address of `x` to the pointer:\n\n```go\nx := 15\nvar a *int\n\
    a = &x\n```\n\n## 10.2 Pointer type\n\nTill now, we have created a pointer variable\
    \ using `:=` and the type of variable was inferred as `*int`. We can print the\
    \ type of variable using the `reflect` package as shown below:\n\n### Program\
    \ 10.5\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"reflect\"\n)\n\n\
    func main() {\n    x := 15\n    a := &x\n    fmt.Println(reflect.TypeOf(a))\n\
    }\n```\n\nThe following will be the output for the above program:\n\n```\n*int\n\
    ```\n\nIt is also an important point to note that the address of type `T` can\
    \ only be assigned to type `*T`. Violating this rule gives a compilation error.\
    \ Program 10.6 will not compile because the address of an `int` variable is assigned\
    \ to a `*float64` variable, which is a type mismatch.\n\n### Program 10.6\n\n\
    ```go\npackage main\n\nfunc main() {\n    x := 15\n    var a *float64\n    a =\
    \ &x\n}\n```\n\nThe following will be the output for the above program:\n\n```\n\
    Error 10.1: cannot use &x (type *int) as type *float64 in assignment\n```\n\n\
    If a pointer variable created using the `var` keyword has not been assigned a\
    \ memory address, it will point to the `nil` pointer. If we try to print it, `<nil>`\
    \ will be printed on the console.\n\n```go\nvar a *float64\nfmt.Println(a)\n```\n\
    \nWhat will happen if we try to access the value of the pointer using the asterisk?\n\
    \nIf we try to access the value at a `nil` pointer, the Go program will panic\
    \ with a runtime error. The following program gives a demonstration:\n\n### Program\
    \ 10.7\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    var a *float64\n\
    \    fmt.Println(*a)\n}\n```\n\nThe following will be the output for the above\
    \ program:\n\n```\nError 10.2: panic: runtime error: invalid memory address or\
    \ nil\npointer dereference\n[signal SIGSEGV: segmentation violation code=0x1 addr=0x0\n\
    pc=0x1091507]\n```\n\n## 10.3 Operators with the pointer\n\nLike C and C++, we\
    \ can apply operators on a pointer but with limited usage. We can use a relational\
    \ operator on a pointer in Golang. We cannot use arithmetic or any other operators\
    \ on pointers.\n\n### 10.3.1 Relational operator\n\nThe only relational operator\
    \ allowed on pointers is the equality operator. The equality operator can be used\
    \ to check whether two pointers are pointing to the same memory address or not.\
    \ This is demonstrated in Program 10.8.\n\n### Program 10.8\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main() {\n    x := 15\n    y := 15\n    a :=\
    \ &x\n    b := &x\n    c := &y\n    fmt.Println(a == b)\n    fmt.Println(a ==\
    \ c)\n}\n```\n\nThe following will be the output for the above program:\n\n```\n\
    true\nfalse\n```\n\nThe equality operator `==` or `!=` can be used to check whether\
    \ a particular pointer variable points to a memory address or to `nil`, as shown.\n"
  mdcn: "\n## 结论\n\n- 接口中的方法没有主体。接口的所有方法都是纯抽象的。\n- 接口的方法可以有参数和返回类型。\n- 任何自定义类型都可以实现接口。\n\
    - 没有显式语法来实现接口。当任何类型定义了接口的所有方法时，该类型就会隐式实现接口。\n- 实现接口的类型也可以有其他方法。\n- 一个类型可以实现多个接口。\n\
    - 一个接口可以被许多类型实现。\n- 当接口没有任何方法时，它被称为空接口。空接口默认由所有类型实现。\n- 接口可以作为结构体字段使用。当使用时，我们需要在创建结构体对象时传递接口的实际实现。\n\
    - 在 Golang 中可以使用接口实现多态。\n\n## 问题\n\n以下程序的结果是什么？\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\ntype I interface {\n\tm1()\n}\n\ntype T struct {\n}\n\nfunc (t *T)\
    \ m1() {\n\tfmt.Println(\"M1 of T\")\n}\n\nfunc main() {\n\tvar i I\n\tt := T{}\n\
    \ti = t\n\ti.m1()\n}\n```\n\n- M1 of T\n- 编译错误\n\n以下程序的结果是什么？\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\ntype I interface {\n    m1()\n}\n\ntype T struct {\n\
    }\n\nfunc (t *T) m1() {\n    fmt.Println(\"M1 of T\")\n}\nfunc (t *T) m2() {\n\
    \    fmt.Println(\"M2 of T\")\n}\n\nfunc main() {\n    var i I\n    t := T{}\n\
    \    i = &t\n    i.m2()\n}\n```\n\n- M2 of T\n- M1 of T\n- 编译错误\n\nstringer 接口是什么？\n\
    \n- 它将每个对象转换为字符串。\n- 它是一个空接口，每个类型默认都实现此接口。\n- 它有一个名为 `String()` 的方法。当你在任何类型上实现\
    \ `String` 方法时，我们可以自定义该类型的输出。\n- Golang 中没有这样的接口。\n\n可用于排序的接口名称是什么？\n\n- Sorter\n\
    - SortInterface\n- Comparator\n\n## 接口\n\n请选择以下正确的陈述：\n\n- 可以使用 `implements` 关键字来实现接口。\n\
    - 一个类型可以实现多个接口。\n- 一个接口可以被许多类型实现。\n- 没有实现接口的语法。\n- 要在任何类型中实现接口，该类型需要实现接口的所有方法。\n\
    \n## 指针\n\n指针变量可以保存另一个变量的内存地址。当变量的值被更改时，它会在指针变量中反映出来。指针在变量传递给函数时非常有用。当变量发生任何更改时，它会在调用函数中反映出来。\n\
    \n## 结构\n\n- 什么是指针？\n- 如何使用指针？\n- 指针概念\n- 编程示例\n\n## 目标\n\n在本章中，你将学习 Golang 中指针是什么。本章将解释指针的用途，如何声明指针变量，以及指针类型是什么。你还将学习为什么在\
    \ Golang 中不允许对指针变量进行算术运算。\n\n## 10.1 声明\n\n符号 `&` 可用于访问任何值的内存地址。在程序中，变量 `x` 的地址使用\
    \ `&x` 访问并赋给变量 `a`。程序 10.1 将打印变量的值和地址。\n\n### 程序 10.1\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    x := 15\n    a := &x\n    fmt.Println(\"\
    Value of x:\", x)\n    fmt.Println(\"Address of x:\", a)\n}\n```\n\n上述程序的输出如下：\n\
    \n```\nValue of x: 15\nAddress of x: 0xc000014058\n```\n\n> **注意：** x 的内存地址在每次运行中可能不同。\n\
    \n变量 `a` 被称为指针变量，因为它保存了变量的内存地址。指针变量指向的值可以使用星号 (`*`) 访问。使用 `*` 访问指针的底层值称为 *解引用*。程序\
    \ 10.2 将打印...\n\n### 程序 10.2\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc\
    \ main() {\n    x := 15\n    a := &x\n\n    fmt.Println(\"Value at address of\
    \ x:\", *a)\n}\n```\n\n上述程序的输出如下：\n\n```\nValue at address of x: 15\n```\n\n上面的解引用语句等价于下面的语句：\n\
    \n```go\nfmt.Println(\"Value of x:\", *(&x))\n```\n\n由于指针变量保存了任何值的地址，对指针变量指向的值的任何修改都将反映在实际值中。程序\
    \ 10.3 修改了 `*a` 的值，它也将反映在变量 `x` 中。\n\n### 程序 10.3\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    x := 15\n    a := &x\n    fmt.Println(\"Value\
    \ of x(before modification):\", x)\n    fmt.Println(\"Value of *a:(before modification):\"\
    , *a)\n    *a = 20\n    fmt.Println(\"Value of x(After modification):\", x)\n\
    \    fmt.Println(\"Value of *a:(After modification):\", *a)\n}\n```\n\n上述程序的输出如下：\n\
    \n```\nValue of x(before modification): 15\nValue of *a:(before modification):\
    \ 15\nValue of x(After modification): 20\nValue of *a:(After modification): 20\n\
    ```\n\n内置函数 `new()` 可用于创建指针：\n\n### 程序 10.4\n\n```go\npackage main\n\nimport \"\
    fmt\"\n\nfunc main() {\n    a := new(int)\n    *a = 15\n    fmt.Println(*a)\n\
    \    fmt.Println(a)\n}\n```\n\n上述程序的输出如下：\n\n```\n15\n0xc000014058\n```\n\n指针变量也可以使用\
    \ `var` 关键字创建。以下语句创建了类型为 `*int` 的指针并将 `x` 的地址赋给该指针：\n\n```go\nx := 15\nvar a *int\n\
    a = &x\n```\n\n## 10.2 指针类型\n\n到目前为止，我们使用 `:=` 创建了指针变量，变量的类型被推断为 `*int`。我们可以使用\
    \ `reflect` 包打印变量的类型，如下所示：\n\n### 程序 10.5\n\n```go\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"reflect\"\n)\n\nfunc main() {\n    x := 15\n    a := &x\n\
    \    fmt.Println(reflect.TypeOf(a))\n}\n```\n\n上述程序的输出如下：\n\n```\n*int\n```\n\n\
    还需要注意一个重要点，即类型 `T` 的地址只能赋给类型 `*T`。违反此规则会导致编译错误。程序 10.6 将无法编译，因为 `int` 变量的地址被赋给了\
    \ `*float64` 变量，这是一个类型不匹配。\n\n### 程序 10.6\n\n```go\npackage main\n\nfunc main()\
    \ {\n    x := 15\n    var a *float64\n    a = &x\n}\n```\n\n上述程序的输出如下：\n\n```\n\
    Error 10.1: cannot use &x (type *int) as type *float64 in assignment\n```\n\n\
    如果使用 `var` 关键字创建的指针变量未被赋予内存地址，它将指向 `nil` 指针。如果我们尝试打印它，控制台上将打印 `<nil>`。\n\n```go\n\
    var a *float64\nfmt.Println(a)\n```\n\n如果我们尝试使用星号访问指针的值会发生什么？\n\n如果我们尝试访问 `nil`\
    \ 指针处的值，Go 程序将 panic 并出现运行时错误。以下程序给出了演示：\n\n### 程序 10.7\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    var a *float64\n    fmt.Println(*a)\n}\n\
    ```\n\n上述程序的输出如下：\n\n```\nError 10.2: panic: runtime error: invalid memory address\
    \ or nil\npointer dereference\n[signal SIGSEGV: segmentation violation code=0x1\
    \ addr=0x0\npc=0x1091507]\n```\n\n## 10.3 指针上的操作符\n\n像 C 和 C++ 一样，我们可以在指针上应用操作符，但使用有限。我们可以在\
    \ Golang 中对指针使用关系操作符。我们不能对指针使用算术或其他操作符。\n\n### 10.3.1 关系操作符\n\n在指针上允许的唯一关系操作符是相等操作符。相等操作符可用于检查两个指针是否指向相同的内存地址。这在程序\
    \ 10.8 中进行了演示。\n\n### 程序 10.8\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc\
    \ main() {\n    x := 15\n    y := 15\n    a := &x\n    b := &x\n    c := &y\n\
    \    fmt.Println(a == b)\n    fmt.Println(a == c)\n}\n```\n\n上述程序的输出如下：\n\n```\n\
    true\nfalse\n```\n\n相等操作符 `==` 或 `!=` 可用于检查特定指针变量是否指向内存地址或指向 `nil`，如图所示。\n"
