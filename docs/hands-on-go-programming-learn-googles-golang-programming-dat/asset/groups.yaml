    ## Objective


    This chapter will cover function declaration, parameters, multiple returns, the
    variadic function, and defer statement. It will also cover the concept of call
    by value and how to pass address of the variable as a value. You will learn how
    to use them in the Go programming language.


    ## 2.1 Function


    A function is an independent section of code that maps input parameters to output
    parameters. It is a collection of statements that are used to perform a specific
    task and return the result to the caller.


    Functions are the building blocks of a Go program. They have inputs, outputs,
    and a series of steps called statements that are executed in order.


    ## 2.2 Parameters and returns


    The function definition in Go programming language is as follows:


    ```go

    func function_name([parameter_list]) [return_types] {

    //Body of function

    }

    ```


    ## 2.2.1 Parameters


    When a function is invoked, you pass a value to the parameter. A parameter is
    like a placeholder. This value is referred to as an actual parameter or argument.
    The parameter list refers to the type, order, and the number of the parameters
    of a function. Parameters are optional in functions. Hence, a function may contain
    no parameters.


    ## 2.2.2 Returns


    A function may return a list of values. The return_types is the list of data types
    of the values that the function returns. Some functions perform the desired operations
    without returning a value. In this case, the return_type is not required.


    Here is a sample Go program to explain parameters and returns:


    ## Program 2.1


    ```go

    // Go program to explain parameters and returns


    package main


    import "fmt"


    func main() {

    /* declare local variables*/

    var x int = 50

    var y int = 40

    var sum_value int


    /* calling a function to get sum of values */

    sum_value = sum(x, y)


    fmt.Printf("Sum value is: %d\n", sum_value)

    }


    /* function returns the sum of two numbers */

    func sum(num1, num2 int) int {

    /* declare local variables */

    var result int

    result = num1 + num2

    return result

    }

    ```


    The following will be the output for the above program:


    **Sum value is: 90**


    While creating a Go function, you define the task that the function will perform.
    To use a function, you will have to call that function to perform the predefined
    task.


    When a program calls a function, the program control is transferred to the called
    function. A called function performs a defined task, and when its return statement
    is executed or when its function-ending closing brace is reached, it returns the
    program control to the main program.


    To call a function, you simply need to pass the required parameters along with
    its function name. If the function returns a value, then you can store the returned
    value.


    ## 2.3 Multiple returns and named return


    Golang allows giving names to the return or result parameters of the functions
    in the function definition. Also, Go has built-in support for multiple return
    values. This feature is used to return both result and error values from a function.


    ## 2.3.1 Multiple returns


    In Go, a function can return multiple values using the return statement. The type
    of return values depends on the type of the parameters defined in the parameter
    list as shown below:


