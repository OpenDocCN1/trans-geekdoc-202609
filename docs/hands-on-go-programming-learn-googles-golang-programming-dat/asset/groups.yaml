    \nIf all goroutines are completed but in wait, the count has not reached zero,\
    \ there will be a deadlock in the Wait method. So,\n\nthe code will panic at the\
    \ Wait method call. Please try this as an exercise.\n\n## 11.1.3 Mutex Lock\n\n\
    When multiple goroutines update any shared variable, that scenario is called a\
    \ race condition. The race condition causes an inconsistent update of shared variables.\
    \ The code which causes the inconsistently update of the variable is called a\
