    \nA method can be called using the dot operator on an instance of the type.\n\n\
    If a method is available in embedded type, then Golang uses the method resolution\
    \ process to find a method. There can be ambiguity if a method is found in two\
    \ types embedded at the same level.\n\n## Questions\n\nWhat is the output of the\
    \ following code?\n\n```go\npackage main\nimport \"fmt\"\ntype person struct {\n\
