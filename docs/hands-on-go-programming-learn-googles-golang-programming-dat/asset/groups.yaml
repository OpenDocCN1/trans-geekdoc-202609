    \ we can assign the value of any type to the variable of the interface.\n\n**Program\
    \ 9.6**\n\n```go\npackage main\n\nimport \"fmt\"\n\ntype MyEmpty interface {\n\
    }\n\ntype Student struct {\n\tid   int\n\tname string\n}\n\nfunc main() {\n\t\
    var empty MyEmpty\n\tempty = 10\n\tfmt.Println(empty)\n\tempty = \"a\"\n\tfmt.Println(empty)\n\
    \tempty = 22.3\n\tfmt.Println(empty)\n\tempty = Student{101, \"Shyam\"}\n\tfmt.Println(empty)\n\
    }\n```\n\nThe following will be the output for the above program:\n\n```\n10\n\
    a\n22.3\n{101 Shyam}\n```\n\nWe have created an empty interface called `MyEmpty`.\
    \ The interface `MyEmpty` doesn’t have any method. We have also created a `Student`\
    \ struct with `id` and `name` as fields. In the main function, we have created\
    \ a variable of `MyEmpty` interface with the name `empty`. We have assigned different\
    \ types of values to this variable like `10`, `\"a\"`, `22.3`, and `Student{101,\
    \ \"Shyam\"}`. We have also printed these values.\n\nBut what is the benefit of\
