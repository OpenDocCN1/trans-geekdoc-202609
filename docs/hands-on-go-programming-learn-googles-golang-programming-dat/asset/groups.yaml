    \ fmt.Println(\"In m1 of St\")\n}\nfunc (s *St) m2() {\n    fmt.Println(\"In m2\
    \ of St\")\n}\n\nfunc main() {\n    var i Itr\n    i = St{}\n    i.m1()\n    i.m2()\n\
    }\n```\n\nThe following will be the error in the above program:\n\n### Error 9.3\n\
    \n```text\n./main.go:20:4: cannot use St literal (type St) as type Itr in assignment:\n\
    St does not implement Itr (m1 method has pointer receiver)\n```\n\nIn Program\
    \ 9.7, we have defined an interface as `Itr`. This interface has two methods:\
    \ `m1` and `m2`. We have defined a struct type as `St`. The type `St` implements\
    \ the `Itr` interface by defining `m1` and `m2` methods with a pointer receiver.\
    \ In the main function, we have declared a variable of `Itr` using the `var` keyword\
    \ and we have assigned the value of `St` to it. Then, we have called the `m1`\
    \ and `m2` methods on the interface variable. But when we run this code, we get\
    \ a compilation error. The error says that `St` does not implement `Itr`. The\
    \ reason behind this error is that `*St` implements `Itr` interface, not `St`.\n\
    \nIf we re-run the above code by assigning the address of `St` to the variable\
    \ `i`, the code will work just fine.\n\nWhen we implement an interface by a value\
    \ receiver, we can assign both the value and address of the type to the interface.\
    \ Let us see this in the following code:\n\n#### Program 9.8\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\ntype Itr interface {\n    m1()\n    m2()\n}\n\ntype\
    \ St struct {\n}\n\nfunc (s St) m1() {\n    fmt.Println(\"In m1 of St\")\n}\n\n\
    func (s St) m2() {\n    fmt.Println(\"In m2 of St\")\n}\n\nfunc main() {\n   \
    \ var i Itr\n    fmt.Println(\"Assigning value of St\")\n    i = St{}\n    i.m1()\n\
    \    i.m2()\n    fmt.Println(\"Assigning Address of St\")\n    i = &St{}\n   \
    \ i.m1()\n    i.m2()\n}\n```\n\nThe following will be the output for the above\
    \ program:\n\n**Assigning value of St**  \n**In m1 of St**  \n**In m2 of St**\
    \  \n**Assigning Address of St**  \n**In m1 of St**  \n**In m2 of St**\n\nIn the\
    \ above code, we have implemented the `Itr` interface by defining the `m1` and\
    \ `m2` methods with value receivers. In the main function, we have tried to assign\
    \ both the value and address of `St` to an interface variable and it worked fine.\
    \ We will not get a compilation error in this code.\n\n## Conclusion of method\
    \ set\n\n- If a type `T` implements an interface `I` by defining the pointer receiver\
    \ methods, then only `*T` will implement interface `I`, not `T`. So, we can assign\
    \ only the address of `T` to the interface variable.\n- If a type `T` implements\
    \ an interface `I` by defining a value receiver, then both `T` and `*T` implement\
    \ the interface `I`. So, we can assign both the value and address of `T` to the\
    \ interface variable.\n\n## 9.5 Frequently used built-in/stdlib interfaces\n\n\
    There are too many frequently used interfaces in the standard library. We cannot\
    \ cover all those interfaces here. We will cover the `Stringer` interface in this\
    \ section and we will see the error interface implementation in Section 9.5.3.\n\
    \n### 9.5.1 Stringer interface\n\nThe `Stringer` interface is very useful for\
    \ printing customized output. It has only one method called `String` which returns\
    \ a string. When we print a value of a type using `fmt.Println`, if the type overrides\
    \ the `String()` method, the `String()` method gets called internally. The `fmt`\
    \ package will print whatever the `String()` method returns.\n\n#### Program 9.9\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\ntype Dollar float64\n\nfunc (d Dollar)\
    \ String() string {\n    return fmt.Sprintf(\"$%f\", d)\n}\n\nfunc main() {\n\
    \    var d Dollar = 23.3\n    fmt.Println(d)\n}\n```\n\nThe following will be\
    \ the output for the above program:\n\n```text\n$23.300000\n```\n\n### 9.5.2 Interface\
    \ interface of sort package\n\nThere is an interface in the Golang standard library\
    \ called `sort.Interface`. Please note that the interface name itself is `Interface`.\
    \ This interface is defined in the `sort` package and used for sorting slices\
    \ of user-defined types. This interface has three methods: `Len`, `Less`, and\
    \ `Swap`. The code snippet given below is the definition of the `Interface` interface\
    \ from the `sort` package:\n\n#### Program 9.10\n\n```go\npackage sort\n\ntype\
    \ Interface interface {\n    Len() int\n    Less(i, j int) bool\n    Swap(i, j\
    \ int)\n}\n```\n\nIf we want to sort a slice of any type, then we need to call\
    \ the `Sort` function of the `sort` package. The `Sort` function expects the `Interface`\
    \ type. So, we can pass any type which implements `sort.Interface`. The type can\
    \ implement the `Interface` interface by implementing all three methods:\n\n####\
    \ Program 9.11\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"sort\"\n\
    )\n\ntype Student struct {\n    Name  string\n    Marks int\n}\n\nfunc (s Student)\
    \ String() string {\n    return fmt.Sprintf(\"%s: %d\", s.Name, s.Marks)\n}\n\n\
    type ByMarks []Student\n\nfunc (a ByMarks) Len() int           { return len(a)\
    \ }\nfunc (a ByMarks) Swap(i, j int)      { a[i], a[j] = a[j], a[i] }\nfunc (a\
    \ ByMarks) Less(i, j int) bool { return a[i].Marks < a[j].Marks }\n\nfunc main()\
    \ {\n    students := []Student{\n        {\"Bob\", 31},\n        {\"John\", 42},\n\
    \        {\"Michael\", 17},\n        {\"Jenny\", 26},\n    }\n    fmt.Println(\"\
    Before sorting =\", students)\n    sort.Sort(ByMarks(students))\n    fmt.Println(\"\
    After sorting =\", students)\n}\n```\n\nThe following will be the output for the\
    \ above program:\n\n```text\nBefore sorting = [Bob: 31 John: 42 Michael: 17 Jenny:\
    \ 26]\nAfter sorting = [Michael: 17 Jenny: 26 Bob: 31 John: 42]\n```\n\nIn Program\
    \ 9.11, we have declared a struct called `Student`. We have defined the `String()`\
    \ method in `Student` to print `Student` objects in a beautified way. Then, we\
    \ have created a new type of `Student` slice, i.e., `ByMarks` and we have defined\
    \ all three methods of `Interface` on `ByMarks` type as follows:\n\n- `Len()`\
    \ returns the length of the slice.\n- `Swap()` swaps ith index element with jth\
    \ index element.\n- `Less()` has logic to find which element is less between the\
    \ ith index element and jth element.\n\nIn the `main` function, we have a slice\
    \ of `Student` with four elements. When we print `students` variable, it prints\
    \ in the sequence in which these elements were inserted. In the next line, we\
    \ are sorting the `students` variable by passing the `sort.Sort()` function. We\
    \ have typecasted `students` to the `ByMarks` type before passing it to the `sort.Sort()`\
    \ function.\n\nThe above is unnecessarily complicated for sorting. The `Len` and\
    \ `Swap` methods are unnecessary because the `Sort` function should have an internal\
    \ logic to find the length of the slice and swap elements. The `sort` package\
    \ has a function to overcome this complexity. We can use the `Slice` function\
    \ of the `sort` package. We will not need to implement any interface. The `sort.Slice`\
    \ function expects two parameters:\n\n- The slice of the elements that we want\
    \ to sort.\n- The function that will have logic for sorting.\n\nThe following\
    \ code demonstrates the `Slice` function:\n\n#### Program 9.12\n\n```go\npackage\
    \ main\n\nimport (\n    \"fmt\"\n    \"sort\"\n)\n\ntype Student struct {\n  \
    \  Name  string\n    Marks int\n}\n\nfunc (s Student) String() string {\n    return\
    \ fmt.Sprintf(\"%s: %d\", s.Name, s.Marks)\n}\n\nfunc main() {\n    students :=\
    \ []Student{\n        {\"Bob\", 31},\n        {\"John\", 42},\n        {\"Michael\"\
    , 17},\n        {\"Jenny\", 26},\n    }\n    fmt.Println(\"Before sorting\", students)\n\
    \    sort.Slice(students, func(i, j int) bool {\n        return students[i].Marks\
    \ < students[j].Marks\n    })\n    fmt.Println(\"After sorting\", students)\n\
    }\n```\n\nThe following will be the output for the above program:\n\n```text\n\
    Before sorting [Bob: 31 John: 42 Michael: 17 Jenny: 26]\nAfter sorting [Michael:\
    \ 17 Jenny: 26 Bob: 31 John: 42]\n```\n\nIn Program 9.12, the `Student` struct\
    \ does not implement any interface. This code calls the `sort.Slice()` method.\
    \ We have passed a slice of students and an anonymous function. The anonymous\
    \ function has logic to sort students by Marks in ascending order.\n\n## 9.6 Interface\
    \ with struct\n\nAn interface can be used within a struct body. We can either\
    \ use the interface as an embedded type or we can define an interface variable.\
    \ We cannot pass the actual value of an interface while creating a struct value\
    \ because interfaces are abstract. We need to pass the value of the actual implementation\
    \ type. So, when we call a method of the interface on a struct, the call will\
    \ go to the actual implementation type.\n\n### 9.6.1 Interface variable as struct\
    \ field\n\nAn interface variable can be used as a struct field. When an object\
    \ of that struct is created, we need to pass the actual implementation value for\
    \ the interface as shown below:\n\n#### Program 9.13\n\n```go\npackage main\n\n\
    import \"fmt\"\n\ntype Executor interface {\n    Execute()\n}\n\ntype Thread struct\
    \ {\n}\n\nfunc (t Thread) Execute() {\n    fmt.Println(\"Executing thread\")\n\
    }\n\ntype Process struct {\n    exe Executor\n}\n\nfunc main() {\n    p := Process{Thread{}}\n\
    \    p.exe.Execute()\n}\n```\n\nThe following will be the output for the above\
    \ program:\n\n```text\nExecuting thread\n```\n\nIn Program 9.13, we have created\
    \ a struct called `Process` with the interface variable, `exe`, as a field. The\
    \ `exe` field is a variable of the `Executor` interface. The `Thread` struct implements\
    \ the `Executor` interface. In the main function, we have created a variable of\
    \ `Process` and passed the `Thread` value for the `Executor` field. We have called\
    \ the `Execute` method on the `exe` field of `p` variable.\n\n"
