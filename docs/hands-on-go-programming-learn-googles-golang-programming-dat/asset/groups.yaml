    \ drop `var` and data type in this syntax.\n\n```go\na := 20\nb := true\n```\n\
    \nWhen Go finds the `:=` assignment syntax, it understands that a new variable\
    \ needs to be declared with an initial value. But you cannot use this syntax to\
    \ assign a value to a pre-defined variable. The variable type is deduced from\
    \ the value. For example, a value of 20 indicates an int and a value of true tells\
    \ Go that the type should be Boolean.\n\n#### 1.2.2 Short variable declaration\n\
    \nIn Go, you can declare variables in the following two ways:\n\n- Using `var`\
    \ keyword\n- Using a short declaration operator\n\nThe short variable declaration\
    \ operator is used to declare and initialize the local variables inside a function.\
    \ It narrows the scope of the variable.\n\nUsing a short declaration operator,\
    \ variables are declared without specifying the type. The type of variable is\
    \ determined by the type of expression on the right-hand side of the `:=` operator.\n\
    \nSyntax of short variable declaration operator:\n\n```\nvariable_name := expression\
    \ or value\n```\n\nExamples:\n\n```\na := 10\n```\n\n```\nx, y := 100, 200\n```\n\
    \n```\np, q, r := 150, 250, 300\n```\n\n**Short variable declaration:**\n\n- It\
    \ is used to declare and initialize variables inside a function only.\n- The variable\
    \ declaration and initialization are made at the same time.\n- Variables are declared\
    \ inside the function, hence they have local scope.\n- It is not required to mention\
    \ the type of the variable in the short variable declaration.\n"
