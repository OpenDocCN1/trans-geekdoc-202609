    \ 中，如果省略循环条件或使用 true 布尔值，for 循环可以作为无限循环工作。下面的示例会一直打印 Infinite Loop：\n\n**程序 3.10**\n\
    \n```go\n// Go program to explain Infinite loop\n\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"time\"\n)\n\nfunc main() {\n    for true {\n        fmt.Println(\"\
    Infinite Loop\")\n        time.Sleep(time.Second)\n    }\n}\n```\n\n上述程序将显示以下输出：\n\
    \n**Infinite Loop**\n"
