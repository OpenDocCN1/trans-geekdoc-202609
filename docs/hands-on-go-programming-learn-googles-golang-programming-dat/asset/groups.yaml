    # 12.4 Best practice


    It is not a good practice to call panic explicitly in program logic. The caller
    of your function will not know that your function can panic and so, the caller
    may not write the recover function. In that case, the whole program will terminate.
    It is always the best practice to return an error from the function instead of
    calling panic explicitly.


    When a function returns an error, we should handle that error. We should not ignore
    it.'
  - '[PAGE 438]


    # Conclusion


    Golang uses error type for error handling.


    A function can return an error type as the last return type if the function can
    cause the error.


    It not mandatory to return error type as the last return type. It is a convention.


    When there is no error returned by the function, the function returns nil as an
    error. The caller function checks whether the error is nil or not to check if
    there is an error in calling the function.


    We can create customized error by implementing the Error() method of the error
    interface.


    If there is an unexpected behavior, the Golang code panics. An example of expected
    behavior is accessing an array element by index more than length.


    The recover function can be used to handle panic.'
