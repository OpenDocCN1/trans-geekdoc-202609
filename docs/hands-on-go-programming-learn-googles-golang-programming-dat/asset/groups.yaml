    # 11.4 Read-only and send-only channel


    We can define a read-only or send-only channel variable as a function parameter.
    If a function has a read-only channel and we try to send data into that channel,
    the program will give a compilation error and vice-versa is the same:


    ```

    func readVal(ch <-chan int) {

    ch <- 10

    }

    ```


    The above code will give a compilation error because the ch variable is declared
    as a read-only variable.


    Now let’s declare a send only channel as a function parameter and see what happens
    when we receive the value from it.


    ```

    func writeVal(ch chan<- int) {

    <-ch

    }

    ```


    Again, the above code will not compile because we are trying to read from the
    send-only channel.'
