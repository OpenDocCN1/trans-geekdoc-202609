    for index := 0; index < 100; index++ {\n go withdraw(&wg, &m)\n}\nwg.Wait()\n\
    fmt.Println(amount)\n}\n\nfunc withdraw(wg *sync.WaitGroup, m *sync.Mutex) {\n\
    defer wg.Done()\nm.Lock()\namount = amount - 1\nm.Unlock()\n}\n```\n\nThe following\
    \ will be the output for the above program:\n\n900\n\nWe have created a variable\
    \ of sync.Mutex in the main method and we have passed its address to the withdraw\
    \ function. We have called Lock before the decrement statement and Unlock after\
