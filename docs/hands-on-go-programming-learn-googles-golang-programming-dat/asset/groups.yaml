    # Chapter 10: [Pointers]


    In this chapter, you will learn what pointers in Golang are. This chapter will
    explain to you the use of pointers, how to declare a pointer variable, and you
    will understand the pointer types. You will also learn why arithmetic operations
    are not allowed on pointer variables in Golang.


    # Chapter 11: [Concurrency]


    This chapter will cover goroutines and channels. You will learn how to define
    a goroutine, what WaitGroup is, and how to use the WaitGroup to wait for other
    goroutines to finish. You will understand the concept of channel. We will use
    the channel for communication between the goroutines. We will create two types
    of goroutines: buffered and unbuffered.


    # Chapter 12: [Error handling]


    This chapter will cover error handling. At the end of this chapter, you will learn
    what an error in Golang is, how to return an error from a function or method,
    and how to handle these errors in the caller function. We will also see a built-in
    error interface, the error packages and the method, function, and struct in the
    errors package. You will learn how to define a new error, create a customized
    error type, what panic is, how to handle panic using recover, what defer is, and
    the importance of the defer function while handling panic, etc.'
