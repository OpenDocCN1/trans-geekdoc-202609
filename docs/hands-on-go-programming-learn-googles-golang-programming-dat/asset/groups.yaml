    \ will be the output for the above code:\n\n```\nmap[]\nMap is empty\n```\n\n\
    If you uncomment the statement m1[\"ten\"] = 10 the program will give a runtime\
    \ error. Therefore, it is necessary to initialize a map before adding items to\
    \ it.\n\n## 6.3 Initialization of Go Maps\n\nA map can be initialized by either\
    \ using a map literal or the built-in make() function.\n\n### 6.3.1 Initializing\
    \ maps using map literal\n\nA map literal is the easiest way to initialize a map\
