    \ 进行等待，因此在 writeVal goroutine 有机会启动之前，main 函数不会结束。\n\n可以对已关闭的通道执行读取操作。当我们对已关闭的通道执行读取操作时，它总是返回零值。零值可能是通道中的有效值。我们可以区分从通道返回的零值究竟是通道中实际存在的零值，还是因为通道已关闭而导致的返回值。通道会返回两个值：第一个是值，第二个是检查通道是否已关闭的标志。当通道关闭时，我们会收到第二个值为\
