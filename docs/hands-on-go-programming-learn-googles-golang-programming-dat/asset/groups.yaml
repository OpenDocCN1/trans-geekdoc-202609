    Array a: [2 4 6 8 10]\nArray b: [1 3 0 0 0]\n```\n\n当我们使用 `...` 而不是指定长度来初始化数组时，编译器会根据数组声明中指定的元素来确定数组的长度。Go\
    \ 编译器会自行计算出长度。你只能在定义带有初始值的数组时使用该运算符。Go 提供了一个内置函数 `len`，用于计算许多数据类型的长度。在本例中，我们可以使用它来计算数组的长度，如下所示：\n\
    \n### 程序 4.4\n\n```go\n// Go program for array length\n\npackage main\n\nimport\
