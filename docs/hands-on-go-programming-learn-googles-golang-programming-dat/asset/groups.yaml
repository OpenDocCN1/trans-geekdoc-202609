    \n— Sachchidanand Singh\n\n我的父母、妻子 Rajani  \n&  \n深爱的儿子 Parthiv\n\n— Prithvipal\
    \ Singh\n\n## 关于作者\n\n**Mr. Sachchidanand Singh** 在 IBM India Software Labs (ISL),\
    \ Pune 担任高级分析、BI 和数据科学 SME。他拥有来自 Birla Institute of Technology and Science (BITS),\
    \ Pilani 的 M.Tech 学位。他在 IEEE、国际计算机期刊以及国家/国际会议上发表了十多篇技术研究论文。\n\n他在人工智能、机器学习、云和认知领域拥有多项专利。他在高级分析和商业智能\
    \ (BI) 等技术方面的架构设计和解决方案实施方面拥有丰富的经验。他是 IEEE 审稿人、多个国家/国际会议技术程序委员会 (TPC) 成员，以及美国《美国计算机科学与信息工程期刊》审稿委员会成员。\n\
    \n**Mr. Prithvipal Singh** 在 IT 行业工作近十年。他在 Java、Golang、Spring、Node.js 和 Python\
    \ 方面拥有丰富的经验。他在微服务架构和云领域具有专业知识。他拥有 Savitribai Phule Pune University 的 MCA 学位。\n\
    \n## 关于审阅者\n\n**Dolly Talreja** 目前担任开发 5G 核心网络 (Golang Linux) 的团队的技术负责人和核心成员，是\
    \ Altran Technologies 的重要组成部分。在其职责范围内，她是节点 UDM 和 AUSF 的负责人，并参与完成 SDLC。她也是分析网络跟踪的专家。她是团队的一员，该团队处于创新前沿，旨在解决云和数字平台不断发展的世界中客户的各种机会。她是\
    \ NIT Warangal 的校友，在行业内拥有超过 6 年的经验。她曾担任 HP 的首席工程师，在 LEDM 的开发中发挥了关键作用。她是 HP 的 Scan\
    \ to Feature 的负责人。她还曾担任三星印度研发院的高级软件工程师，并参与开发了三星 MPF 的 SMB 3.0 协议。她还发表了一篇关于去中心化点对点网络的\
    \ IEEE 论文。\n\n## 致谢\n\n在这一重要提升的时刻，在我们深入正题之前，我们想对那些给予我们无尽支持、始终保持幽默和温暖祝愿的人们表达几句衷心的感谢。首先，最重要的是赞美和感谢全能的上帝，在完成本书的过程中赐予我们无尽的祝福。\n\
    \n我们要感谢我们的同事，他们为我们撰写更合适的文本提供了动力。我们感谢管理层、前辈和同事不断推动我们不断向上攀登。除他们之外，我们还要感谢所有朋友、好心人、受访者和学者，他们从构思到完成的全程帮助了我们。\n\
    \n## 前言\n\nGolang 被认为是一种快速而无懈可击的编程语言，拥有大量有用的功能，如高效的内置并发、具有自动垃圾检测和清理的垃圾收集器、goroutine\
    \ 的动态可增长调用栈、极快的编译器和跨平台多功能性等。大量云、网络和 DevOps 软件都是用 Golang 编写的，如 Docker、Kubernetes、Terraform、etcd\
    \ 和 Istio。Go 开发者社区是 GitHub 上最活跃的开源社区之一。\n\n本书专注于学习 Golang，从基本概念到接口、指针、并发等。我们使用编程示例详细解释了每个概念。我们从基础开始，随着每一章的深入进入更复杂的内容。每章都有练习，这将帮助你更清晰地理解概念。\n\
    \n在本书的 12 章中，你将学习以下内容：\n\n### 第 1 章：介绍\n\n本章涵盖数据类型、常量、变量、运算符、重新赋值和重新声明等基本概念。你将学习如何在\
    \ Go 编程语言中使用它们。\n\n### 第 2 章：函数\n\n本章将涵盖函数声明、参数、多返回值、可变参数函数和 defer 语句。它还将涵盖传值调用的概念以及如何将变量的地址作为值传递。\n\
    \n### 第 3 章：控制流\n\n本章的目的是向读者介绍控制流和循环的概念，并展示如何使用它们。\n\n### 第 4 章：数组\n\n本章的目的是向读者介绍数组的概念。它还将展示如何声明和初始化数组，以及如何将数组传递给函数。\n\
    \n### 第 5 章：切片\n\n本章的目的是向读者介绍切片的概念，并告诉他们如何声明切片、创建切片的各种方法、修改和比较切片、关于多维切片、排序切片以及遍历切片。\n\
    \n### 第 6 章：映射\n\n本章解释了映射的基本概念以及如何在 Go 编程语言中使用它。它涵盖了如何声明和初始化映射、遍历映射、如何对映射执行检索、更新和删除操作，以及如何检查映射中是否存在某个键等。\n\
    \n### 第 7 章：结构体\n\n本章解释了结构体的基本概念以及如何在 Go 编程语言中使用它。它涵盖了如何声明和初始化结构体类型、访问结构体的字段、指向结构体的指针、导出的和未导出的结构体以及结构体字段。\n\
    \n### 第 8 章：方法\n\n本章涵盖了 Go 编程语言中方法的概念。你将学习如何声明方法、如何调用方法、不同类型方法的语法以及方法解析过程。\n\n\
    ### 第 9 章：接口\n\n本章将涵盖 Golang 中接口的概念。你将学习 Golang 中的接口是什么，Golang 接口与其他语言有何不同，如何声明接口，以及\
    \ Golang 中隐式实现是如何发生的及其好处。我们将创建没有方法的接口，并通过内置函数看到其好处。我们将看到在实现接口和创建多态对象时使用值接收器和指针接收器的影响。\n"
  merge: -1
