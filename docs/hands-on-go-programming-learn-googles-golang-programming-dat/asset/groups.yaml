    \ {\ngo withdraw(&wg)\n}\nwg.Wait()\nfmt.Println(amount)\n}\n\nfunc withdraw(wg\
    \ *sync.WaitGroup) {\ndefer wg.Done()\namount = amount - 1\n}\n```\n\nThe output\
    \ of Program 11.3 is not predictable. The expected output is 900, but when you\
