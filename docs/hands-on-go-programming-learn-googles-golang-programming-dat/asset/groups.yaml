    \n## 目标\n\n本章将介绍 Golang 中接口的概念。你将学习 Golang 中的接口是什么、Golang 接口与其他语言有何不同、如何声明接口、Golang\
    \ 中的隐式实现是如何发生的，以及它的好处。我们将创建不带方法的接口，并了解它在内置函数中的好处。我们将看到在实现接口和创建多态对象时值接收者和指针接收者的影响。\n\
    \n### 9.1 引言\n\n接口的语法类似于结构体。语法如下：\n\n```go\ntype InterfaceName interface{\nMethodName(argument\
    \ argumentType) returnType\n}\n```\n\n上述语法有一个带一个参数和一个返回值的方法。参数类型和返回值类型必须是有效的 Go\
    \ 类型。上面语法中定义的类型只是为了解释语法。\n\n**程序 9.1** 有一个有效的语法：\n\n```go\ntype Executor interface\
    \ {\nExecute()\n}\n```\n\n接口名为 Executor。它有一个方法，即 Execute。该方法没有参数，也没有返回值。如果接口只有一个方法，那么按照接口命名约定，接口名应该是方法名加\
    \ er。在我们的示例中，方法名是 Execute。因此，通过在方法名末尾附加 r，接口名就是 Executor。这不是硬性规则，而是一种约定。\n\n接口中可以有多个方法。所有方法可以有不同签名。下面给出的代码定义了一个名为\
