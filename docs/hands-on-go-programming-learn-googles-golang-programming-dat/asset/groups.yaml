    # 9.2.1 Why implicit implementation?


    If you come from a Java background, you might be wondering why we are doing implicit
    implementation of the interface. You might be thinking that explicit implementation
    is always proper as that becomes clear by looking at the type that implements
    which interface. But implicit implementation has its benefits:


    You may want to implement your custom interface in type which is available in
    a third-party library. You don’t have access to the code, so you can’t change
    the code. The implicit implementation is beneficial in this case. If the type
    has methods that can satisfy your interface, it implements that interface implicitly.


    If you want to create a new interface with very few methods and you want to implement
    that interface in many types, you don’t need to make code changes in all the places.'
