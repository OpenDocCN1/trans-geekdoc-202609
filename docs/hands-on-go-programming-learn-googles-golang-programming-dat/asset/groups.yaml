    \n如果我们想调用 D 的方法，可以显式指定：\n\n```go\na.B.D.m1()\n```\n\n### 8.4.2 不允许多态\n\n嵌入类型不允许多态。多态可以通过接口实现；我们将在下一章介绍接口。以\
