    \    return OpenFile(name, O_RDONLY, 0)\n}\n```\n```\n\n该函数的调用者可以在处理打开的文件之前检查函数返回的错误是否为\
    \ nil。如果错误不是 nil，则说明存在错误，我们不能继续处理：\n\n```\nfile, err := os.Open(\"myfile.txt\"\
    )\nif err != nil {\nlog.Fatal(err)\n}\n```\n\n有时函数可能不返回任何有意义的值，但它可能引发错误。在这种情况下，该函数将只返回一个错误。一个例子是\
    \ os 包的 Mkdir 函数，如下所示：\n\n```\nfunc Mkdir(name string, perm FileMode) error\n\
    ```\n\n### 12.1.1 error 接口\n\nGo 有一个名为 error 的内置接口，它只有一个方法，即 Error 方法返回字符串类型，如下所示：\n\
    \n```\ntype error interface {\nError() string\n}\n```\n\nGo 有一个名为 errors 的包。errors\
    \ 包有一个未导出的 errorString 结构体类型。errorString 是 error 接口的一个实现，因为它实现了 Error() 方法。下面给出的代码片段是\
    \ error 包的完整代码：\n\n```\npackage errors\n```\n\n```\nfunc New(text string) error\
    \ {\nreturn &errorString{text}\n}\n```\n\n```\ntype errorString struct {\ns string\n\
    }\n```\n\n```\nfunc (e *errorString) Error() string {\n```\n\n```\nreturn e.s\n\
    }\n```\n\nerrorString 是 error 接口最常用的实现。由于它是未导出的，我们不能直接创建 errorString 的值。我们需要调用\
    \ New() 函数来创建 errorString 类型的值，如下所示：\n\n```\nerr := errors.New(\"Invalid Inputs\"\
    )\n```\n\nfmt 包也可以用来创建错误值。Errorf 函数使用 errors.New() 函数创建错误，并使用 Sprintf 格式化字符串。fmt\
    \ 包的 Errorf 函数有助于格式化错误消息。它返回错误值，如下所示：\n\n```\nerr := fmt.Errorf(\"Invalid Input:\
    \ %v\", 12)\n```\n\n程序 12.1 中的 create() 函数为 student 类型创建值，放入 map 中，并返回学生的 id。如果\
