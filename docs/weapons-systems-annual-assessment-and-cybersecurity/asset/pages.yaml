- pgno: 86
  md: 'fully mature. Almost 6 years after the design review, the program no longer
    has a stable design, which is reflected as an update to our attainment of product
    knowledge. While the program had previously completed over 90 percent of its design
    drawings, the program has made a number of design changes that added almost a
    thousand new drawings. These changes include, among other things, added functionality
    and new components to protect against parts obsolescence.


    Following limited testing in June 2016, the Army Test and Evaluation Command reported
    that software deficiencies rendered the IAMD system “not suitable, not survivable,
    and not reliable.” In February 2017, DOD’s Office of Operational Test and Evaluation
    further found the system’s software to be “neither mature nor stable.” This poor
    performance was largely driven by instability of the IAMD battle command system
    (IBCS) software, which was used in the limited user testing. Since limited user
    testing was completed, the program has updated the IBCS software, specifically
    focusing on fixing problems observed during testing, such as increasing the stability
    and reliability of the software. These updates began in 2016 and a series of test
    events were executed through October 2017 to verify the fixes. Early results indicate
    that the software issues experienced during the 2016 limited user testing have
    been corrected, but officials noted that testing continues.


    The program has implemented several changes to reduce risk. The program reports
    that one of these changes includes requiring the contractor to now test IBCS software
    with tactical network and weapon/sensor interfaces prior to acceptance. Officials
    noted they believe this to be a key step to reducing remaining technical risks
    within the program.


    # Production Readiness


    After the unsatisfactory performance of its limited testing in June 2016, the
    Army delayed the IAMD low-rate production decision—previously planned for August
    2016—to September 2020 in order to allot more time for developmental testing.
    The program also plans to update its Acquisition Program Baseline (APB) in conjunction
    with that decision. Additionally, according to program officials, the program
    plans to conduct'
