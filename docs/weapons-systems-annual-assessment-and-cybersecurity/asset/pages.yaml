    modify aspects of the engine design to fix this issue.


    # Other Program Issues


    The CH-53K contractor plans to move its final assembly line from its current location
    in West Palm Beach, Florida, to Sikorsky’s headquarters in Stratford, Connecticut.
    The move will require a number of equipment and configuration changes to Sikorsky’s
    Stratford facility, which will take time to complete and pose risk to the CH-53K
    production schedule. The contractor plans to produce the first four system demonstration
    test helicopters in Florida before transitioning production to Connecticut in
    summer 2018 for the fifth, and final, demonstration helicopter. Program officials
    stated that they expect delivery of the first three helicopters in the second
    quarter of fiscal year 2018, but that production of the fourth helicopter has
    been delayed to December 2018 due to a parts shortage.


    Program officials also stated that they face challenges related to cybersecurity
    requirements applicable to the CH-53K system. They stated the challenges include
    lengthy contractual lead times to field solutions that address continuously evolving
    cyber threats. They added that this has resulted in prolonged operational risk.
    At the same time, the program office is planning to award a contract for Sikorsky
    to identify cybersecurity risks that may exist within the CH-53K system. Once
    that work is completed, the program office anticipates awarding another contract
    in order to mitigate any risks discovered. The program office plans to have a
    related risk mitigation plan completed by the start of initial operational and
    test evaluation in July 2019.'
