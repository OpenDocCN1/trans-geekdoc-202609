  md: 'shore-based testing. CMR’s ship-based testing is scheduled for February 2018.
    The Navy plans to declare IOC for two additional systems, Remote Minehunting and
    Unmanned Mine Sweeping, in fiscal year 2019, while IOC for the final system, Buried
    Minehunting, is planned for fiscal year 2020. Then, following operational testing
    on the Independence variant of the LCS, the Navy plans to declare IOC for the
    full MCM suite in fiscal year 2021.


    Based on findings from an independent review team, the Navy is replacing the vehicle
    on the Remote Minehunting system with a 40’ unmanned boat called the Unmanned
    Surface Vehicle (USV). Officials stated the USV will be easier to launch and recover
    but could be susceptible to wave movement, potentially increasing the difficulty
    of finding mines. Officials said that USV development is critical to achieving
    IOC by fiscal year 2021. Afterward, the Navy plans to implement several upgrades
    and improvement efforts to achieve all threshold requirements.


    # Surface Warfare (SUW)


    The Navy designed and produced SUW mission package systems prior to demonstrating
    the maturity of key systems, leading to configuration changes and delays to the
    SUW package. Each SUW package currently consists of two 30-millimeter guns, an
    armed helicopter, and two rigid-hull inflatable boats. The Navy has accepted six
    SUW packages to date and, in fiscal year 2018, plans to accept two boat deliveries,
    but no gun deliveries. The Navy has operationally tested the current SUW package
    on both LCS variants, found that it met interim performance requirements, and
    is now fielding it. To meet full threshold requirements, the Navy has adapted
    a surface-to-surface missile (the Army’s Longbow Hellfire) for the maritime environment
    and is currently testing it. The Navy plans to declare IOC for the adapted missile
    on the LCS Freedom variant in the second quarter of fiscal year 2018, and then
    plans to test the missile on the LCS Independence variant in fiscal year 2020.
    The Navy is also pursuing an over-the-horizon missile as a part of the LCS seaframe
    program.'
