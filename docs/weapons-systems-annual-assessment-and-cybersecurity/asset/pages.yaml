    GAO-12-8 (Washington, D.C.: Nov. 29, 2011); Federal Workforce: OPM and Agencies
    Need to Strengthen Efforts to Identify and Close Mission-Critical Skills Gaps
    GAO-15-223 (Washington, D.C.: Jan. 30, 2015); Cybersecurity: Actions Needed to
    Strengthen U.S. Capabilities, GAO-17-440T (Washington, D.C.: Feb. 14, 2017); and
    Cybersecurity: Federal Efforts are Under Way that may Address Workforce Challenges,
    GAO-17-533T (Washington, D.C.: April 4, 2017).


    ^54^ RAND Corporation, Hackers Wanted: An Examination of the Cybersecurity Labor
