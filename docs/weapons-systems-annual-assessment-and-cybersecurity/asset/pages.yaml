  md: 'prior to acceptance of low-rate production vehicles. According to the program,
    validation processes are in place to verify the technical data against production
    parts and manufacturing processes.


    # AGENCY COMMENTS


    We provided a draft of this chapter to DOD for comment. In its comments, reproduced
    in appendix VII, DOD generally concurred with our observations. DOD also provided
    us with technical comments, which we incorporated as appropriate.


    In its comments, DOD stated that our report shows that the acquisition reform
    initiatives started in 2010 have resulted in measurable improvements. Specifically,
    DOD stated that it was encouraged by our observations that it has improved the
    cost performance of recent programs while also expanding its total acquisition
    portfolio size and cost. DOD further noted that it remains committed to reducing
    the costs and time required to deliver weapon systems to warfighters.


    DOD also identified plans to increase investments aimed at maintaining technology
    superiority over adversaries. Further, DOD stated that the separation of the Office
    of the Under Secretary of Defense for Acquisition, Technology, and Logistics into
    the Offices of the Under Secretary of Defense for Acquisition and Sustainment
    and Under Secretary of Defense for Research and Engineering represents a major
    shift in how DOD develops and procures weapon systems.


    Shelby S. Oakley

