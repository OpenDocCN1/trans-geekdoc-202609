    Chapter 2 - DOD plans to spend about $1.66 trillion to develop its current portfolio
    of major weapon systems. Potential adversaries have developed advanced cyber-espionage
    and cyber-attack capabilities that target DOD systems. Cybersecurity—the process
    of protecting information and information systems—can reduce the likelihood that
    attackers are able to access our systems and limit the damage if they do. GAO
    was asked to review the state of DOD weapon systems cybersecurity. This chapter
    addresses (1) factors that contribute to the current state of DOD weapon systems’
    cybersecurity, (2) vulnerabilities in weapons that are under development, and
    (3) steps DOD is taking to develop more cyber resilient weapon systems. To do
    this work, GAO analyzed weapon systems cybersecurity test reports, policies, and
    guidance. GAO interviewed officials from key defense organizations with weapon
    systems cybersecurity responsibilities as well as program officials from a non-generalizable
    sample of nine major defense acquisition program offices.'
