    # Organizations Responsible for Weapon Systems Cybersecurity


    Just as many DOD organizations are responsible for weapon systems acquisitions,
    many have responsibilities related to cybersecurity during the acquisition process.²²
    For example, program offices are responsible for planning and implementing cybersecurity
    measures for the system under development. Authorizing officials are responsible
    for overseeing programs’ adherence to security controls and for authorizing a
    system’s entry into operations based on the system having an acceptable level
    of cyber risk. At key decision points, the Office of the Under Secretary of Defense
    (Research and Engineering) is responsible for advising the Secretary of Defense
    and providing independent technical risk assessments that address a variety of
    topics, including the system’s cybersecurity posture. Military test organizations
    conduct cybersecurity assessments of weapon systems. DOT&E oversees those tests
    and is funding research on the cybersecurity of some weapon system components
    that pose particular cybersecurity challenges.


    Organizations that are traditionally associated with cybersecurity, such as NSA
    and Cyber Command, support some aspects of weapon systems cybersecurity. However,
    they are not responsible for reviewing the designs of most weapon systems to identify
    potential vulnerabilities, although NSA officials said that they will provide
