    several programmatic issues that further delayed the program’s formal entry into
    system development. These issues included concern within senior Army leadership
    about whether the program had built sufficient time into the Block 1 schedule
    to correct any deficiencies that may arise during testing prior to production
    start. To mitigate that concern, program officials stated the program added 5
    months between Block 1’s limited user test and its low-rate initial production
    decision review (Milestone C). This new schedule delays Block 1’s initial operating
    date from fiscal year 2020 to fiscal year 2021. Further, according to program
