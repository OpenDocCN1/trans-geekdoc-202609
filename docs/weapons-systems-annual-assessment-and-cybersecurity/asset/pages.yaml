- pgno: 22
  md: 'certifications that they have met the following requirements, among others,
    prior to entering system development.[^12]


    +   - The program has conducted appropriate trade-offs among cost, schedule, and
    performance objectives;

    +   - The program has demonstrated a high likelihood of accomplishing its intended
    mission based on a preliminary design review and formal post-preliminary design
    review assessment; and

    +   - The Under Secretary of Defense for Research and Engineering has independently
    verified that critical technologies are mature and demonstrated in a relevant
    environment.[^13]


    In 2010, DOD started its own acquisition reform initiatives, as outlined in its
    “Better Buying Power” memorandums.[^14] These reforms included the requirement
    that programs conduct affordability and “should-cost” analyses to encourage program
    managers to find cost savings.[^15]


    [^12] This requirement is codified as amended at 10 U.S.C. § 2366b. Since WSARA
    was implemented in late 2009, Congress has revised or repealed some of its original
    requirements. For example, the National Defense Authorization Act for Fiscal Year
    2016 repealed the requirement for programs to conduct competitive prototyping
    prior to starting system development. Pub. L. No. 114-92, § 822(b). Now, program
    acquisition strategies generally are to include the use of competitive prototypes
    before the start of system development to the maximum extent practicable and consistent
    with the economical use of available financial resources. 10 U.S.C. § 2431b(c).


    [^13] Demonstration in a relevant environment is Technology Readiness Level (TRL)
    6. Demonstration in an operational environment is TRL 7 and this is the level
    of maturity GAO’s knowledge-based acquisition practices work has determined constitutes
    a low risk for starting a product development program. See appendix VI for detailed
    descriptions of TRLs. In addition, a major defense acquisition program generally
    may not receive approval for development start until the milestone decision authority
    certifies that the technology in the program has been demonstrated in a relevant
    environment. 10 U.S.C. § 2366b(a)(2). Under certain circumstances this requirement
    may be waived. Id. § 2366b(d).


    [^14] DOD’s Better Buying Power memorandums are an initiative to strengthen DOD’s
    purchasing practices, improve industry productivity, and provide an affordable
    military capability to the warfighter. According to DOD, it encompasses a set
    of fundamental acquisition principles to achieve greater efficiencies through
    affordability, cost control, elimination of unproductive processes and bureaucracy,
    and promotion of competition.


    [^15] Affordability analyses promote responsible and sustainable investment decisions
    by examining the implications of today’s capability requirements choices and investment
    decisions based on reasonable projections of future needs before substantial resources
