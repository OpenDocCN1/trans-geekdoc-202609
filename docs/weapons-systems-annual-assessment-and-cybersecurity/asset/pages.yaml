  md: '# LCS Program


    # Technology Maturity and Design Stability


    Following 13 years of production, the LCS seaframe program office reported that
    all 18 critical technologies—the total number of technologies for both designs—are
    mature, including the aluminum hull structure and launch, handling, and recovery
    system of the Independence variant. In our 2017 assessment, the program assessed
    only 16 of these 18 technologies as mature. The Navy stated that the aluminum
    hull structure achieved maturity following the deployment of LCS 2 and LCS 4 and
    completion of the full shock ship trial conducted on LCS 6 in 2016. However, the
    Director, Operational Test and Evaluation (DOT&E) noted that the Navy conducted
    the trial at a reduced severity level and that some equipment was either removed
    or modified to reduce damage to the ship. The new design of the Twin Boom Extensible
    Crane, used to launch and recover watercraft, was first installed on LCS 6 and
    had previously been restricted to operation with only unmanned watercraft. The
    Navy stated that the crane was qualified in March 2017. The Navy and DOT&E have
    yet to complete analysis of data for LCS 5 and LCS 6 for shock trials conducted
    in 2016, or of rough water trials that resulted in damage to both designs over
    3 years ago. DOT&E officials stated they initially expected results of the shock
    trials around February 2017, but as of December 2017 had not received the results.


    Since December 2015, the Navy has attributed a series of engineering issues on
    both variants to shortfalls in crew training, seaframe design, and construction
    quality. Although some hulls continue to experience propulsion-related failures,
    the Navy reports that recently delivered seaframes are better constructed and
    have performed better in trials than previous ships. The Navy accepted delivery
    of LCS 9 and LCS 12 with no mission- or safety-degrading deficiencies, and officials
    stated that LCS 11 is not experiencing the same propulsion equipment failures
    suffered by LCS 9, but has experienced other deficiencies, which the shipbuilder
    is correcting.'
