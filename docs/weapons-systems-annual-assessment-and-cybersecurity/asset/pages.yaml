    # Next Generation Operational Control System (OCX)


    The Air Force''s OCX program is primarily a software development effort to replace
    the existing Global Positioning System (GPS) ground control system. Intended to
    ensure reliable, secure delivery of position and timing information to military
    and civilian users, OCX software will be delivered in blocks that each provide
    upgrades as they become available. We assessed the first three blocks: Block 0
    for launch and initial, limited tests of new satellites; Block 1 for satellite
    control and basic military signals; and Block 2 for modernized military and additional
    navigation signals.


