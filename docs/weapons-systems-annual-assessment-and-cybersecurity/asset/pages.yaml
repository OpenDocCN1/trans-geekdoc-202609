    # F-35 Lightning II (F-35)


    DOD is developing and fielding a family of fifth generation strike fighter aircraft,
    integrating stealth technologies with advanced sensors and computer networking
    capabilities for the United States Air Force, Marine Corps, and Navy, eight international
    partners, and three foreign military sales customers. The family is comprised
    of three aircraft variants. The Air Force’s F-35A variant will complement its
    F-22A fleet and is expected to replace the air-to-ground attack capabilities of
    the F-16 and A-10. The Marine Corps’ F-35B variant will replace its F/A-18 and
    AV-8B aircraft. The Navy’s F-35C variant will complement its F/A-18E/F aircraft.


