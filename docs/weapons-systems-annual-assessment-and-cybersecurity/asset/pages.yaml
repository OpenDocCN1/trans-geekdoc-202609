    # Production Readiness


    More than 2 years into production, the JLTV program has yet to demonstrate production
    readiness using statistical process control data. Prior to entering production,
    the the JLTV program office assessed the manufacturing readiness levels for all
    three competing contractors. These assessments examined manufacturing process
    readiness, quality management systems, and production planning activities. Ultimately,
    the program office found that all three competing contractors demonstrated proven
    manufacturing processes and procedures, but reached this conclusion without evaluating
    statistical quality control metrics—an approach inconsistent with best practices.


    Program officials stated that the contractor remains unable to provide statistical
    process control data even after having produced more than 700 vehicles to date
    because the contractor has historically relied on inspection-based quality procedures
    for manufacturing vehicles. The program office was also unable to report the number
    of critical manufacturing processes identified by the contractor because, according
    to program officials, the information is proprietary. Program officials had previously
    told us that the contractor would begin collecting production process capability
    index data during low-rate production and, further, that the government was working
    with the contractor’s manufacturing personnel to identify critical manufacturing
    processes. A program official stated that, as the program proceeds from low-rate
    production to full-rate production, the contractor is evaluating processes on
    a case-by-case basis in order to determine whether it is financially worthwhile
    to implement statistical indices or to continue using 100 percent inspections.


    Since beginning production, the program has identified vehicle failures resulting
    in production process engineering changes that must be incorporated into the manufacturing
    process. According to Defense Contract Management Agency program assessment reports,
    the resulting retrofit and rework activities have delayed government acceptance
    of'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'several vehicles. Thirty-three vehicles required retrofits after a vendor used
    an incorrect material on the subframes. Transmission failures discovered during
    testing required retrofits to 23 vehicles. According to a Defense Contract Management
    Agency official, these and other engineering changes must be incorporated into
    both the overall manufacturing process and previously manufactured JLTVs.


    # **Other Program Issues**


    Program officials reported that, in March 2016, the JLTV program office exercised
    a contract option to purchase the JLTV technical data package from Oshkosh. Program
    officials reported that the purchase provides the government with government purpose
    rights to the design. After exercising the contract option and receiving some
    of the technical material, program officials discovered that the engineering drawings
    were inadequate to facilitate open competition for vehicles to be procured in
    fiscal year 2021 and beyond. In response, the program office is working with the
    contractor to improve the quality of the technical data package.


    # **Program Office Comments**


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    According to program officials, the JLTV program remains on track for a fiscal
    year 2019 full-rate production decision. The program stated that JLTV had demonstrated
    low-rate production readiness and has capability in place to begin full-rate production.
    The program said that, in support of full-rate production, it is conducting additional
    analyses of production readiness. The program pointed out that JLTV is manufactured
    on the same production line as the U.S. Army’s medium and heavy tactical wheeled
    vehicles and that a retrofit program ensures design changes identified during
    test will be incorporated prior to first vehicle fielding.


    The program said it will have a complete technical data package to support a fiscal
    year 2021 competition and that, in the meantime, review processes exist to identify
    current JLTV deficiencies that must be corrected'
