  md: '# Other Program Issues


    Although FAB-T entered system development in 2002, the Air Force selected a new
    development contractor in 2012. Currently, only the CPT subprogram is in development
    and production. In July 2016, the Air Force submitted a strategy for achieving
    the FET requirements to the Secretary of Defense. In December 2017, the program
    completed a cost and capability analysis and is developing an acquisition strategy
    in preparation for a materiel development decision. Until the FET subprogram is
    executed, FAB-T cannot achieve its planned capabilities that are based on the
    interaction of bomber aircraft with intelligence, surveillance, and reconnaissance
    aircraft and CPTs.


    FAB-T is designed to communicate through the Advanced Extremely High Frequency
    (AEHF) network of satellites, three of which have already been launched. Depending
    on how long delays continue, the first launched AEHF satellite might be nearing
    the end of its projected 14-year operational lifetime by the time FAB-T is available.
    All six AEHF satellites are expected to be on-orbit before FAB-T is operational.
    The lack of synchronization between the two programs has resulted in the underutilization
    of costly satellite capabilities.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    According to program officials, FAB-T has completed development of and is pursuing
