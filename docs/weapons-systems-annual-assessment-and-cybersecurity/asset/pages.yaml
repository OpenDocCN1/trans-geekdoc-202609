  md: '# Utility Helicopter (UH-1N) Replacement


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_222_0.png)


    Source: U.S. Air Force.


    # Utility Helicopter (UH-1N) Replacement


    The UH-1N Replacement program aims to replace the Air Force’s 63-helicopter fleet,
    initially manufactured in the 1960s. The UH-1N helicopter’s primary missions are
    securing intercontinental ballistic missile sites and convoys, and transporting
    senior government officials in the National Capital Region. However, the program
    office reports that the current fleet does not comply with DOD’s nuclear weapons
    security guidance and cannot meet all mission requirements. The program plans
    to acquire 84 helicopters, an integration laboratory, a training system, support
    and test equipment, and associated software.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_222_1.png)


    # Program Essentials


    +   - Program office: Wright-Patterson Air Force Base, OH

    +   - Prime contractor: TBD

    +   - Contract type (planned): Firm-fixed-price

    +   - Next major milestone: Contract award (June 2018)


    # Current Status


    The Air Force established the UH-1N Replacement program in fiscal year 2016. The
    program’s acquisition strategy anticipated a competitive, full and open, best
    value tradeoff source selection and the program reports it plans to award a contract
    in June 2018.


    The Air Force completed an analysis of alternatives in June 2015 and issued an
    initial request for information to industry as part of its market research in
    August 2015. At that time, the Air Force planned to start the program with an
    initial production decision. However, based on the responses to the request for
    information, the Air Force determined that the contractors’ existing helicopters
    could not meet program requirements without modifications. Therefore, the Air
    Force altered its approach and, in April 2017, chose to start the program earlier
    in the acquisition life cycle. According to program documents, this revised approach
    will help contractors meet all program requirements by giving them an opportunity
    to add existing components to their existing airworthiness-certified helicopters.
    The program now plans to make an initial production decision at the end of fiscal
    year 2020.


    The program office identified cybersecurity and workforce risks. The program office
    has decided to accept cybersecurity risks when it chose to use an existing helicopter.
    Officials stated that the program may procure a helicopter that does not meet
    current cybersecurity standards. In addition, the program office told us of significant
    workforce risks. Specifically, it has had difficulties in hiring government personnel
    with the required engineering, avionics, and defense systems expertise.


    # Estimated Program Cost


    (fiscal year 2018 dollars in millions)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_222_2.png)


    # Planned quantities


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_222_3.png)


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    According to the program office, its strategy to acquire an existing helicopter
    limits its ability to insert additional cybersecurity requirements. Consequently,
    the program office stated that it will assess and actively manage cyber risks.
    The program office also said that it is working to hire additional qualified personnel.'
