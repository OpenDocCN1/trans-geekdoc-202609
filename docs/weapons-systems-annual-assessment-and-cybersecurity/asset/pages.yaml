  md: '# Advanced Pilot Training (APT)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_217_0.png)


    # Advanced Pilot Training (APT)


    With its APT program, the Air Force is replacing its legacy T-38C trainer fleet
    and related ground equipment by developing and fielding newer, more technologically
    advanced trainer aircraft and an associated ground-based training system. The
    APT program responds to the Air Force''s advanced fighter pilot training needs
    and seeks to close training gaps that the T-38C cannot fully address.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_217_1.png)


    # Program Essentials


    Program office: Wright-Patterson Air Force Base, OH


    Prime contractor: TBD


    Contract type (planned): Indefinite-delivery indefinite quantity with delivery
    orders.


    +   - Fixed-price incentive (development)

    +   - Fixed-price incentive and firm-fixed-price (production)


    Next major milestone: Development start (by summer 2018)


    # Estimated Program Cost


    (Cost figure reflects fiscal years 2016-2022; fiscal year 2018 dollars in millions)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_217_2.png)


    # Planned Quantities


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_217_3.png)


    # Current Status


    In October 2009, the Air Force identified 12 gaps in its aircraft training capabilities.
    In May 2010, the Under Secretary of Defense for Acquisition, Technology and Logistics
    approved the Air Force''s plans to conduct an analysis of alternatives for closing
    that gap. In June 2011, the analysis of alternatives recommended that the existing
    training aircraft, the T-38C, be replaced because a modification program would
    not be cost effective, nor would it address all the identified capability gaps.


    In response, the APT program plans to compete and award an indefinite delivery/indefinite
    quantity contract to a single source for system development, production of an
    estimated 351 trainer aircraft ground-based training systems and initial sustainment.
    The Air Force solicited proposals for this source selection in December 2016 ahead
    of a planned contract award of December 2017. In October 2017, the Air Force delayed
    the contract award to allow time for the source selection team to ensure that
    proposals were properly evaluated. Air Force officials now plan to award the contract
    by summer 2018 and stated that they do not expect the revised contract award date
    to affect the schedule for future milestone events in the program.


    The APT program''s acquisition approach is based on the employment of mature technology
    for timely fielding of the APT system. According to Air Force officials, all prospective
    vendors will offer systems that are well beyond the prototype phase and will include
    flight-test data from aircraft that closely match the offered aircraft. As a result,
    the program does not plan to conduct a preliminary design review until after development
    start, for which the program office will request a statutory waiver.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.'
