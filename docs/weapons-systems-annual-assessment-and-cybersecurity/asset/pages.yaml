  md: 'a formal manufacturing readiness assessment for the program in preparation
    for the program’s low-rate production decision, at which time they expect all
    vendors to be ready for low-rate initial production. The Army now plans to declare
    initial operational capability in fiscal year 2022, nearly 4 years later than
    previously planned.


    # Other Program Issues


    The program has experienced development cost growth in excess of limits authorized
    in its APB. This cost breach resulted from the Army’s decision to request increased
    program funding in fiscal year 2018 and restructure the program schedule to allot
    increased time for remaining development and implement corrective fixes following
    the June 2016 limited test event. Specifically, the Army’s fiscal year 2018 budget
    request reflected new requirements for Advanced Electronic Protection Enhancements,
    which the Army believes will develop and assess solutions to the IAMD emerging
    threats and vulnerabilities to advanced electronic attack. The program plans for
    IAMD Battle Command System Command and Control and radio frequency data and voice
    network protection features to be developed and assessed against current and postulated
    advanced electronic attack systems and techniques. Additionally, they plan to
    demonstrate and assess electronic protection and emerging threat solutions in
    live and simulated advanced electronic attack environments. Similarly, the program
    plans to coordinate electronic protection and advanced threat solutions with joint
    services and other agencies, such as the Missile Defense Agency.


