  md: 'For our second observation, in order to determine whether programs experienced
    an increase or decrease in buying power over the past year, we used data on the
    programs’ number of procurement units, procurement cost changes, and average procurement
    unit costs.


    We calculated cost change “due” to quantity changes as the change in quantity
    over the last year multiplied by the average procurement unit cost for the program
    a year ago. We calculated cost change “not due” to quantity changes as the current
    acquisition quantity times the change in average per unit costs. In practice,
    changes in quantity will often affect per unit cost—as discussed in this appendix—so
    this is more precisely described as “Cost change due to change in quantity assuming
    no change in average procurement unit cost” and “Cost change due to change in
    average procurement unit cost.” If changes in quantity affect per unit cost, those
    changes will appear in the cost change “not due” to quantity changes. We first
    calculated the amount of procurement cost growth attributable to quantity changes.
    To do this, we multiplied any change in quantity by the average procurement unit
    cost for the program a year ago. The resulting dollar amount is considered a change
    due solely to shifts in the number of units procured and may overestimate the
    amount of change expected when quantities increase. Additionally, it could also
    underestimate the expected change when quantities decrease as it does not account
    for other effects of quantity changes on procurement such as gain or loss of learning
    in production that could result in changes to unit cost over time or the use or
    absence of economic orders of material. However, these changes are accounted for
    as part of the change in cost not due to quantities.


