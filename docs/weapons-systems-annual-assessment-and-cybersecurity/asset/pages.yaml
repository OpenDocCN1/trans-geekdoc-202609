- pgno: 297
  md: '# TESTS REVEALED THAT MOST WEAPON SYSTEMS UNDER DEVELOPMENT HAVE MAJOR VULNERABILITIES,
    AND DOD LIKELY DOES NOT KNOW THE FULL EXTENT OF THE PROBLEMS


    We found that from 2012 to 2017, DOD testers routinely found mission-critical
    cyber vulnerabilities in nearly all weapon systems that were under development.
    Using relatively simple tools and techniques, testers were able to take control
    of these systems and largely operate undetected. In some cases, system operators
    were unable to effectively respond to the hacks. Furthermore, DOD does not know
    the full scale of its weapon system vulnerabilities because, for a number of reasons,
    tests were limited in scope and sophistication.


    # Weapon Systems Cybersecurity Assessments Identified Mission-Critical Vulnerabilities


    Nearly all major acquisition programs that were operationally tested between 2012
    and 2017 had mission-critical cyber vulnerabilities that adversaries could compromise.
    DOT&E’s 2017 annual report stated that tests consistently discovered mission-critical
    vulnerabilities in acquisition programs, echoing a similar finding by the DSB
    in 2013 about DOD IT systems and networks. Cybersecurity test reports that we
    reviewed showed that test teams were able to gain unauthorized access and take
    full or partial control of these weapon systems in a short amount of time using
    relatively simple tools and techniques.³⁸ We saw widespread examples of weaknesses
    in each of the four security objectives that cybersecurity tests normally examine:
    protect, detect, respond, and recover.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Protect


    # Test Teams Easily Took Control


    Test teams were able to defeat weapon systems cybersecurity controls meant to
    keep adversaries from gaining unauthorized access to the systems. In one case,
    it took a two-person test team just one hour to gain initial access to a weapon
    system and one day to gain full control of the system they were testing. Some
    programs fared better than others. For example, one assessment found that the
    weapon system satisfactorily prevented unauthorized access by remote users, but
    not insiders and near-siders. Once they gained initial access, test teams were
    often able to move throughout a system, escalating their privileges until they
    had taken full or partial control of a system. In one case, the test team took
    control of the operators’ terminals. They could see, in real-time, what the operators
    were seeing on their screens and could manipulate the system. They were able to
    disrupt the system and observe how the operators responded. Another test team
    reported that they caused a pop-up message to appear on users’ terminals instructing
    them to insert two quarters to continue operating. Multiple test teams reported
    that they were able to copy, change, or delete system data including one team
    that downloaded 100 gigabytes, approximately 142 compact discs, of data.


    # Key Concepts


    +   - **An insider** is a user who is authorized to use a system (e.g., has a
    username and password) and has physical access to all or parts of a system.

    +   - **A near-sider** is an unauthorized user who has physical access to all
    or part of a system. For example, someone taking a tour of a Navy ship would be
    a near-sider.

    +   - **A remote user** is not authorized to use the system and does not have
    physical access to the system.


    Source: DOD. | GAO-19-128.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Test Teams Needed Only Basic Tools


    The test reports indicated that test teams used nascent to moderate tools and
    techniques to disrupt or access and take control of weapon systems. For example,
    in some cases, simply scanning a system caused parts of the system to shut down.
    One test had to be stopped due to safety concerns after the test team scanned
    the system. This is a basic technique that most attackers would use and requires
    little knowledge or expertise. Poor password management was a common problem in
    the test reports we reviewed. One test report indicated that the test team was
    able to guess an administrator password in nine seconds.39 Multiple weapon systems
    used commercial or open source software, but did not change the default password
    when the software was installed, which allowed test teams to look up the password
    on the Internet and gain administrator privileges for that software. Multiple
    test teams reported using free, publicly available information or software downloaded
    from the Internet to avoid or defeat weapon system security controls.


    # Example: Poor Password Management


    The 2016 cyber attack on Dyn, a company that serves as a key intermediary in directing
    Internet traffic, disabled websites, such as Twitter, Netflix, and CNN and brought
    down the Internet in some regions. The attack used malware to search the Internet
    for unsecured devices, such as those that used factory-default usernames and passwords,
    and then used those devices to send junk traffic to online targets until they
    could not function.


    Source: Congressional and industry reports. | GAO-19-128.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Security Controls Were Insufficient


    Test reports we reviewed make it clear that simply having cybersecurity controls
    does not mean a system is secure. How the controls are implemented can significantly
    affect cybersecurity. For example, one test report we reviewed indicated that
    the system had implemented role-based access control, but internal system communications
    were unencrypted. Because the system’s internal communications were unencrypted,
    a regular user could read an administrator’s username and password and use those
    credentials to gain greater access to the system and the ability to affect the
    confidentiality, integrity, or availability of the system.


    # Programs Had Not Addressed Some Previously Identified Vulnerabilities


    Program offices were aware of some of the weapon system vulnerabilities that test
    teams exploited because they had been identified in previous cybersecurity assessments.
    For example, one test report indicated that only 1 of 20 cyber vulnerabilities
    identified in a previous assessment had been corrected. The test team exploited
    the same vulnerabilities to gain control of the system. When asked why vulnerabilities
    had not been addressed, program officials said they had identified a solution,
    but for some reason it had not been implemented. They attributed it to contractor
    error. Another test report indicated that the test team exploited 10 vulnerabilities
    that had been identified in previous assessments.


    # Detect


    Test reports we reviewed indicated that test team activities were not detected
    at all during some assessments, including one case in which the test team operated
    for several weeks without being detected. One test report indicated that test
    team activities were not discovered even though the test team was deliberately
    “noisy” and was not trying to hide its activities. In other cases, intrusion detection
    systems correctly identified'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'test team activities as suspicious, but users were unaware of the detection.^40
    One test team emulated a denial of service attack by rebooting the system, ensuring
    the system could not carry out its mission for a short period of time.^41 Operators
    reported that they did not suspect a cyber attack because unexplained crashes
    were normal for the system. Another test report indicated that the intrusion detection
    system correctly identified test team activity, but did not improve users’ awareness
    of test team activities because it was always “red.” Warnings were so common that
    operators were desensitized to them.


    # Example: Poor Detection


    In the 2014 **Office of Personnel Management (OPM)** cyber attack, attackers exfiltrated
    personnel files of 4.2 million government employees, security clearance background
    information on 21 million individuals, and fingerprint data of 5.6 million of
    these individuals. Attackers used a contractor’s OPM credentials to log into the
    OPM system, installed malware, and created a backdoor to the network. These attackers
    were in OPM’s networks for at least 14 months. Over 2,000 pieces of malware were
    later identified on OPM devices.


    Source: GAO-17-614 and H. Comm. on Oversight & Gov’t Reform Majority Staff. |
    GAO-19-128.


