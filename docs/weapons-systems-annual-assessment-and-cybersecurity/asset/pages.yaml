    three Kaiser-class oilers, the predecessor to the T-AO 205.


    Navy officials stated that Lewis class cybersecurity requirements have changed
    since the June 2016 DD&C award, but they do not expect the revisions to cause
    any changes to ship hardware or to the allocated baseline. The Navy has requested
