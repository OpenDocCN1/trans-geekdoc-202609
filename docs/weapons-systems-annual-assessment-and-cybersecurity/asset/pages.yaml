    In 2016, the House Committee on Armed Services requested the Navy study the effect
    of switching the Lewis class program to a construction rate of two ships funded
    per year. In June 2017, the Navy produced the requested study, but in the absence
    of any directed changes from Congress, the Navy continues to plan for a rate of
    one ship funded per year.


    The Navy awarded what it refers to as a “block buy” contract for construction
    of the first six ships in June 2016. This contract is structured under mostly
    fixed-price incentive contract terms and includes a target price for the design
