    # CH-53K Heavy Lift Replacement Helicopter (CH-53K)


    # CH-53K Program


    # Technology Maturity, Design Stability, and Production Readiness


    The CH-53K program entered production in March 2017 with mature critical technologies
    and a stable design, but with undemonstrated production processes. Eight months
    later, production uncertainty persists as the program has yet to bring production
    processes into statistical control.


    The program office has identified two critical technologies—main rotor blade and
    main gear box. According to program officials, these two critical technologies
    matured within the last year. The program began flight testing both of the technologies
    in October 2015. Persistent problems with the main gear box have required the
    program to delay the planned completion of system-level demonstration tests by
    4 months—now scheduled to be completed in May 2019. We previously found that components
    within the rear module assembly, part of the main gear box, required a number
    of redesigns. Program officials reported that since the latest redesign, the program
    has successfully tested the main gear box.


    At critical design review, the program assessed what was later proven to be an
    unstable design. In our 2017 assessment, we reported that the extent of this instability
    was unknown as the program no longer tracked information on design drawings. For
    our current assessment, however, the program provided new information indicating
    that the contractor had'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'released 89 percent of current drawings to manufacturing by the critical design
    review—a level that falls just short of meeting best practices criteria for design
    stability. This information also indicated that the contractor had completed nearly
    99 percent of CH-53K drawings as of October 2017—a level that reflects design
