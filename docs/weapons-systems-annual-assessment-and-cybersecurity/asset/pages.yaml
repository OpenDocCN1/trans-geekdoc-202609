    # Example: Increased Reliance on Software


    In the 2015 JEEP Cherokee cyber attack, researchers remotely took physical control
    of a JEEP, including shutting off the engine and controlling the brakes. In 2016,
    we reported that electronic systems control multiple passenger vehicle functions
    and that vehicles include multiple interfaces that leave them vulnerable to cyber
    attacks.


    Researchers studied a JEEP to understand its systems, including the characteristics
    of its software code and its ''CAN Bus,'' which connects to units that control
    core vehicle functions. They remotely accessed an Internet-connected component
    and used it as an initial entry point to access the vehicle''s CAN Bus, which
    then allowed them to control many of the JEEP''s functions.


    Source: GAO-16-350 and industry report. | GAO-19-128.


    # MULTIPLE FACTORS MAKE WEAPON SYSTEMS CYBERSECURITY INCREASINGLY DIFFICULT, BUT
    DOD IS JUST BEGINNING TO GRAPPLE WITH THE CHALLENGE


    Multiple factors contribute to the current state of DOD weapon systems cybersecurity,
    including: the increasingly computerized and networked nature of DOD weapons,
    DOD''s past failure to prioritize weapon systems cybersecurity, and DOD''s nascent
    understanding of how best to develop more cyber secure weapon systems. Specifically,
    DOD weapon systems are more software and IT dependent and more networked than
    ever before. This has transformed weapon capabilities and is a fundamental enabler
    of the United States'' modern military capabilities. Yet this change has come
    at a cost. More weapon components can now be attacked using cyber capabilities.
    Furthermore, networks can be used as a pathway to attack other systems. We and
    others have warned of these risks for decades. Nevertheless, until recently, DOD
