  md: 'Our work has shown that DOD, through its Instruction 5000.02, has incorporated
    WSARA and other initiatives to address sound management practices, such as realistic
    cost estimates, use of prototypes, and systems engineering.


    # TEN OBSERVATIONS ON THE COST AND SCHEDULE PERFORMANCE OF DOD’S 2017 MAJOR DEFENSE
    ACQUISITION PROGRAM PORTFOLIO


    Our analysis of DOD’s 2017 MDAP portfolio shows that programs initiated since
    2010 performed better than the remainder of the portfolio and realized a cost
    decrease of $5.6 billion between 2016 and 2017. However, these savings were not
    big enough to avert an overall cost increase of $54.7 billion across the entire
    portfolio last year, the majority of which was due to quantity increases. It is
    too early to say whether these savings could curb that level of growth in future
    years. We will likely gain visibility into that prospect as more programs that
    began after 2010 enter production.


    # DOD’s 2017 Portfolio Has Grown in Number of Programs and Cost


    +   1. The 2017 portfolio consists of 86 programs, which will cost over $1.66
    trillion to acquire.¹⁶

    +      Three programs exited the portfolio in 2017, after they completed their
    planned procurements or were cancelled, and 11 new programs were added, which
    resulted in the largest number of programs within the'
