  md: 'Twelve of ULA’s variants have achieved design stability, and four have reached
    both design stability and production readiness. Some variants are used infrequently
    and may never reach design stability or production readiness. The Falcon 9 v1.1
    has achieved both design stability and production readiness, but did not meet
    Air Force National Security Space reliability or performance requirements, according
    to the program office. A new variant—the Falcon 9 Upgrade, which SpaceX intends
    to use going forward for EELV launch service competitions—first flew in December
    2015 and was certified for EELV launches in January 2016. SpaceX conducted an
    initial demonstration flight of its new variant—the Falcon Heavy—in February 2018.
    New vehicles, or variants that introduce changes to the original design, can pose
    increased cost and schedule risks until they are proven through multiple successful
    flights.


    # Other Program Issues


    The program is pursuing an acquisition approach to help ensure DOD’s access to
    space and maintain multiple launch providers. One of ULA’s current launch vehicles,
    Atlas V, uses the RD-180 engine for propulsion, which is designed and manufactured
    in Russia. The National Defense Authorization Act (NDAA) for Fiscal Year 2015,
    as amended, prohibited, with certain exceptions, the award or renewal of a contract
    for the procurement of property or services for National Security Space launch
    activities under the EELV program if such contract carries out such activities
    using rocket engines designed or manufactured in the Russian Federation.


    In addition, a provision in the FY18 NDAA restricts any obligation or expenditure
    to carry out the EELV program using funds authorized under the FY18 NDAA or otherwise
    made available for FY18 for research, development, test, and evaluation to development
    of the following: a domestic rocket propulsion system to replace non-allied space
    launch engines; integration of the domestic propulsion system with an existing
    or planned launch vehicle; and capabilities necessary to enable existing or planned
    commercially available launch vehicles or infrastructure that are'
  merge: -1
