    # APPENDIX III: KNOWLEDGE-BASED

    ACQUISITION PRACTICES


    Our prior work on best product development practices found that successful programs
    take steps to gather knowledge that confirm that their technologies are mature,
    their designs stable, and their production processes are in control. Successful
    product developers ensure a high level of knowledge is achieved at key junctures
    in development. We characterize these junctures as knowledge points.


    Table 12 summarizes these knowledge points and associated practices.'
