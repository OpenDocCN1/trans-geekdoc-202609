    Program officials state that they will continue to monitor and assess production
    readiness leading up to the full-rate production decision in May 2020. The program
    intends to purchase nearly 36 percent of its total aircraft during low-rate initial
    production. Generally, programs must provide a rationale if low-rate initial production
    quantities are going to exceed 10 percent of total quantities. The Under Secretary
    of Defense for Acquisition, Technology and Logistics approved this acquisition
    strategy for the KC-46A program to avoid a break in the production line.


