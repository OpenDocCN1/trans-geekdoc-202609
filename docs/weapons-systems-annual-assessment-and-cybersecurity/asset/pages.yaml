    year 2019 President''s Budget.


    # Current Status


    The Navy continues to undertake Flight III detail design activities, which have
    included extensive changes to the ship''s hull, mechanical, and electrical systems
    to incorporate the SPY-6 radar and restore weight and stability safety margins
    within the ship. Both Flight III shipbuilders completed zone design activities—three-dimensional
    modeling of the individual areas within the ship—by December 2017, before the
    start of lead ship construction. All four of Flight III''s critical technologies
    are mature and undergoing testing. To help reduce technical risk, the Navy plans
    to field all but one of the critical technologies—the SPY-6 radar—on other ship
    classes before integration with Flight III.


    A draft Test and Evaluation Master Plan for Flight III is under review within
    DOD. The Director, Operational Test and Evaluation (DOT&E) and the Navy are deliberating
    whether Flight III initial operational test and evaluation will include the use
    of a self-defense test ship equipped with the Aegis combat system and SPY-6 radar.
    The Navy currently does not plan to provide funding for this modified self-defense
    test ship, contending there are other means to validate performance. However,
    DOT&E reports that it will not be able to fully determine Flight III''s defensive
    capabilities without it.


    In June and September 2017, the Navy modified existing Flight IIA multiyear procurement
    contracts—contracts that allow the Navy to procure multiple years'' worth of ships
    on a single contract action—to include construction of the first two Flight III
    ships, with the Flight III configuration upgrades incorporated. Huntington Ingalls
    plans to begin construction of DDG 125 in May 2018; Bath Iron Works will begin
    DDG 126 in April 2019. For later Flight III ships, Congress has authorized the
    Navy to enter into multiyear procurement contracts for up to 15 additional ships.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    Navy officials noted the DDG 51 program has successfully delivered 65 ships since
    program inception in 1985 and made awards for 77 ships to date. They said that
    Flight III design efforts are stable and on track, with planned completion prior
    to Flight III construction.


