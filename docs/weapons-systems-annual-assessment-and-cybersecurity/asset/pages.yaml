- pgno: 153
  md: '# Design Stability


    The Columbia Class program is prioritizing design stability prior to the start
    of construction of the lead submarine of the class. The program plans to complete
    100 percent of design arrangements, including 3D product modeling, and 83 percent
    of design disclosures prior to the start of construction of the lead submarine.
    However, the design will likely remain immature once construction starts even
    if the program can complete 83 percent of design disclosures because some of the
    key technologies are not fully mature and detail design work is proceeding with
    notional or placeholder data representing key systems. For example, the Navy has
    entered the detail design phase for the ship with incomplete data for significant
    components of the design, such as the nuclear reactor plant and Integrated Power
    System. We have previously reported that concurrency of technology development
    and design increases the risk of design rework and can result in negative cost
    and schedule impacts.


    # Production Readiness


    The Navy plans to begin lead ship construction in fiscal year 2021 and expects
    to build the lead ship in 84 months. This timeframe is significantly shorter than
    the Navy has achieved on any recent lead submarine, including those during high
    levels of Cold War submarine production. Moreover, the Navy expects that the Columbia
    Class will be built as quickly as was planned for the lead Virginia Class submarine—a
    submarine of less than one and one-half the size and estimated construction labor
    hours of Columbia. In an effort to achieve its aggressive delivery schedule, the
    Navy is planning to start building areas of the lead ship in advance of the planned
    lead ship authorization in fiscal year 2021. The Navy intends to start construction
    as early as 2019—2 years prior to the planned fiscal year 2021 ship authorization—on
    some of the submarine’s structure. This includes construction on the stern, bow,
    and mission command and control module as early as 6 months before the planned
    fiscal year of authorization, which officials stated was because of the disruptive
    effects of delays to these components that are critical to ensuring an on-time
    delivery. Accelerating construction could further exacerbate'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'design instability issues since some of the components still being designed
    are in the areas the Navy is considering for early construction.


    # Other Program Issues


    In a December 2017 report, we determined that it is more likely than not that
    the Columbia Class program will exceed the Navy’s $128 billion (then-year dollars)
    estimate of total acquisition cost. Specifically, the Navy has budgeted the submarine
    to a confidence level for the program that is lower than what experts recommend,
    a decision which may not account for a sufficient amount of program risk due to
