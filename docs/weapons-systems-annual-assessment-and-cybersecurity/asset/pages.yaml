    LX(R) early design efforts with acquisition activities for the next America Class
    Amphibious Assault Ship (LHA 8) and the John Lewis Class Fleet Replenishment Oilers
    (T-AO 205) to reportedly better sustain the naval shipbuilding industrial base.
    In 2016, the Navy awarded contracts to Huntington Ingalls and General Dynamics
    NASSCO for early LX(R) design activities. These contracts allotted 75 percent
    of the LX(R) contract design hours to Huntington Ingalls and the remainder to
    NASSCO. Also in 2016, Congress appropriated $250 million in advanced procurement
    funds—three years earlier than planned—which would have accelerated lead ship
    construction, but in 2017 it rescinded $236 million of this funding. The National
    Defense Authorization Act for Fiscal Year 2017 authorized the Navy to enter into
    a contract for the design and construction of the LX(R) or LPD-29 using shipbuilding
    and conversion funds. Further, the Navy continues to deliberate on which phase
    LX(R) will enter the acquisition cycle. Although a new program, program officials
    have proposed that LX(R) entry occur at full-rate production—a significant departure
