  md: '# 3DELRR Program


    # Technology Maturity


    The 3DELRR program entered system development in October 2014 with its six critical
    technologies approaching maturity, and their maturity remains unchanged. Shortly
    after the program entered system development, the Air Force suspended performance
    on the development contract awarded to Raytheon after Lockheed Martin and Northrop
    Grumman filed bid protests. In January 2015, GAO dismissed the protests when the
    Air Force agreed to take corrective action to address the issues raised. Legal
    action continued in federal courts and before GAO, and the program ultimately
    re-entered the source selection phase and awarded a $52.7 million development
    and production contract to Raytheon in May 2017. Program officials stated that
    the critical technologies would be proven to work in their final forms and under
    expected conditions during developmental tests, which are scheduled to start in
    April 2020.


    # Design Stability


    In January 2018, the 3DELRR program held its critical design review. At the time
    of our review, the program was in the process of finalizing the results, which
    precluded us from an assessment of design stability. The program office and contractor
    had delayed the critical design review from October 2017 to January 2018, in part
    due to a lack of technical readiness, which was assessed as part of a July 2017
    DOD system-level review.


    In July 2017, DOD’s systems engineering office conducted a system-level technical
    review of the 3DELRR program as part of the program’s follow-on preliminary design
    review to evaluate the contractor’s design changes since the preliminary design
    review in May 2013. After the preliminary design review, the Air Force made trade-offs
    between affordability and performance of the 3DELRR system, which resulted in
    revisions to the technical requirements. For example, the Air Force reduced the
    required average time between critical failures, reduced the altitude the radar
    needs to survey, and increased the amount of time needed for the radar to scan
    an area. The contractor also revised its proposed 3DELRR'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'design to reduce costs and improve producibility. However, DOD found that the
    contractor’s revised design, which included a reduced number of transmit/receive
    and receive-only modules, may not meet the program’s key performance parameters
    related to detection range for certain targets and operational availability. DOD
    recommended that the program office and contractor continue to work on the proposed
    design to minimize technical risks. In response, 3DELRR program officials delayed
    the critical design review to January 2018.


    DOD’s systems engineering office also noted risks with the contractor’s software
    development efforts. Although contract performance did not occur from 2014 through
    2017 while the legal action before the courts and GAO was being resolved, the
    contractor continued radar software development efforts using its own resources.
    During the July 2017 follow-on preliminary design review, the contractor stated
    that it did not plan to conduct additional software development for the program.
    According to the contractor, it had conducted this software development as part
    of its independent research and development efforts. The contractor further stated
    that, under the terms of its contract, any further software efforts would be related
    to correction of deficiencies found during integration and test. However, DOD
    determined that the scope of this effort could be underestimated because the program
    office did not have well-defined software integration and test metrics. DOD further
    noted that if the program does not achieve the predicted software reuse and commercial-off-the-shelf
    utilization during design and integration, then software development may require
    additional time, which would delay the program’s schedule.


