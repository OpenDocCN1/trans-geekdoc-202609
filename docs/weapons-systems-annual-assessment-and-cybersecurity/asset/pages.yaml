  img_proc: true
- pgno: 61
  md: '+   - held a preliminary design review prior to starting development; and

    +   - released at least 90 percent of their design drawings by critical design
    review.


    Additionally, we found that MDAPs that held a preliminary design review prior
    to starting development had less schedule growth than other programs.


    We analyzed 15 programs that already completed system development, held a critical
    design review, and started production (i.e., completed knowledge points 1 through
    3). These programs, 2 of which we included in our first annual assessment in 2003,
    were ones that we had previously assessed at the time they completed each knowledge
    point for their implementation of the correspondent knowledge-based acquisition
    practices.


    +   - Our analysis revealed that, on average, programs that completed one or more
    of the aforementioned three knowledge-based acquisition practices had lower cost
    increases than programs that did not complete these knowledge-based practices
    by the time they reached each knowledge point.^27^ These differences, which ranged
    from approximately 56 to 63 percentage points lower on average for cost increases,
    were statistically significant.

    +   - Additionally, programs that held a preliminary design review prior to starting
    development had 47 percent less schedule growth than programs that did not.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - These results support our work and offer initial validation that MDAPs
    that follow these particular knowledge-based practices may have lower cost increases
    and less schedule growth than those programs that do not.

    +   - Because inferences from our analysis were limited by the small sample size
    and the unique characteristics of the 15 MDAPs in the data set, we plan to update
    this analysis in our future annual assessments. As more programs we previously
    assessed at development start and at critical design review enter production,
    this larger sample may enable more precise analysis of differences between MDAPs
    that completed or did not complete specific knowledge-based practices.


    Our prior work demonstrates that completion of all of the knowledge-based practices
    by the time programs reach their knowledge points underpins a sound business case
    that positions programs to better meet their cost and schedule goals.


    # Programs Often Enter Production with Incomplete Knowledge, Which Contributes
    to Cost and Schedule Growth


    6. Of the 45 current programs we reviewed, 23 reported schedules that included
    overlap, or concurrency, between developmental tests and production. We observed
    that this concurrency was accompanied by higher acquisition cost growth, not attributable
    to quantity changes, as compared to 8 other programs.


    We observed that cost growth over the last year averaged $513 million not attributable
    to quantity changes for the 23 programs with concurrent schedules and $154 million
    for each of the 8 programs reporting non-concurrent schedules.


    +   - We also observed total acquisition cost growth since first full estimate
    not attributable to quantity changes averaged $6.05 billion'
