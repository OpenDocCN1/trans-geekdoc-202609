  md: '# AMPV Program


    # Technology Maturity and Design Stability


    The AMPV program entered system development in December 2014 with its critical
    technologies deemed fully mature by an independent review team. According to program
    officials, while the AMPV design utilizes a new hull design, a majority of subsystems
    are derived from existing vehicle designs.


    The program held its critical design review in June 2016 with over 90 percent
    of its design drawings released to manufacturing, but it had not demonstrated
    a system-level prototype at that time. Following CDR, however, the total number
    of drawings unexpectedly grew by nearly 19 percent as the contractor underestimated
    the number and complexity of design drawings needed to meet program requirements,
    thus undermining the design stability the program thought it had attained. We
    have updated our attainment of product knowledge table to reflect this change
    in design stability from our previous assessment. We currently assess the AMPV
    design as stable because the program reports that it has released all planned
    drawings to manufacturing.


    The program’s plan to complete a planned logistics demonstration prior to production
    start has fluctuated because of program challenges. This demonstration—which was
    intended to demonstrate that the vehicle’s design could meet maintainability requirements
    and was stable before commencing low-rate initial production—was initially postponed
    after the contractor delivered the AMPV technical data package over a year late,
    in large part due to the late release of engineering drawings. The program was
    at risk for fully completing this demonstration after the start of production.
    According to program officials, however, the contractor’s new recently completed
    plan anticipates completion of the logistics demonstration prior to the start
    of production.


    # Production Readiness


    The contractor, BAE Systems, delivered the first prototype in December 2016. While
    this vehicle was delivered on time, subsequent'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'prototype deliveries have been delayed by as much as 3 months due to problems
    with parts shortages and changes to engineering drawings, among other things.
    Due to delayed prototype deliveries, the program eliminated initial contractor-specific
    performance and reliability testing. The current test schedule has relatively
    little margin to account for discovery and correction of any vehicle deficiencies.


    According to program officials, the program plans to demonstrate its critical
    manufacturing processes on a pilot production line prior to the start of low-rate
    initial production in February 2019. Program officials noted that the contractor
    should deliver all prototypes by the end of calendar year 2017, which would provide
    the program with over a year to refine manufacturing activities prior to the start
    of production. According to program officials, this would include redesigning
    the manufacturing layout based on prototype building issues. However, in a series
    of program assessment reports, the Defense Contract Management Agency (DCMA) identified
    significant concerns about the contractor’s capabilities for collecting and assessing
    manufacturing process control data. Specifically, in a November 2017 overall program
    status assessment provided by the program manager, DCMA reported that the contractor
    did not have adequate production controls in place to sufficiently evaluate production
    processes.


    # Other Program Issues


    The program has experienced development contract cost growth of over 20 percent
    above target cost due to continued challenges meeting logistics, performance,
    and production requirements. However, program officials noted that the government’s
    official cost position for AMPV development—based on the independent cost estimate
    prepared by the Office of Cost Assessment and Program Evaluation—has not changed
    as it includes adequate margin to account for the cost growth to date.


    AMPV remains dependent on other programs—such as the Army’s Handheld, Manpack,
    and Small Form Fit Radios—for its key communication and networking capabilities.
    However, these programs have experienced their own acquisition challenges delaying
    their'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'availability for the AMPV program. The program is including a legacy radio
    platform in its production vehicle design configuration, which will, according
    to program officials, readily accommodate future networking capabilities provided
    by these other programs.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    Program officials also noted that the program remains within its cost, schedule,
    and performance baseline. They said that the cost rebaseline process is complete,
    and there are sufficient resources for remaining work. They also stated that they
    judge the vehicle design to be stable based on drawing releases, prototype deliveries,
    and initial reliability test results. According to the program office, prototype
    deliveries were on average 6-8 weeks behind schedule, but the program stated that
    it has minimized delays through a compressed test schedule that has merged contractor
    tests into the government test program. Additionally, the program said that vehicle
    reliability, availability, and maintainability tests have exceeded the number
    of miles planned per day, which has further reduced lost time. The program also
    reported that the contractor is updating its production process in order to minimize
    variability and risk.


