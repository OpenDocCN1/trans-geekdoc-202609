    # Current Status


    The Navy plans to award an MQ-25 development contract in the fourth quarter of
    fiscal year 2018. The Navy has yet to identify any critical technologies for the
    MQ-25, but has asked potential contractors to identify any critical technologies
    they plan to use, and the maturity of those technologies, within their proposals.
    The Navy does not plan to conduct a system-level preliminary design review before
    starting MQ-25 development. Instead, the Navy plans to rely on knowledge gained
    through previously conducted reviews under the UCLASS program and risk reduction
    studies and analyses conducted by the four companies that competed for the UCLASS
    development contract.


    The MQ-25 program resulted from DOD’s February 2016 review of its airborne ISR
    portfolio. Based on this review, DOD directed the Navy to restructure the UCLASS
    program to create the Carrier-Based Aerial Refueling System, which DOD subsequently
    designated the MQ-25. As compared to the UCLASS program’s focus on intelligence,
    surveillance and reconnaissance capabilities, the MQ-25 program’s primary requirements
    are carrier suitability and air refueling. From September to October 2016, the
    Navy awarded four contracts with a combined total value of $250 million to the
    four companies that previously competed for the UCLASS development contract. These
    contracts required each company to evaluate potential MQ-25 performance requirements
    and technical risks involving integration and deck handling, among other things.


    In July 2017, the Joint Requirements Oversight Council approved the MQ-25 requirements
    document that was informed by the contractors’ efforts. According to Navy officials,
    this document reflects an MQ-25 aerial refueling capability that far exceeds the
    refuel capacity currently provided by F/A-18E/F Super Hornet aircraft. Further,
    Navy officials expect MQ-25 will reduce the need for F/A-18E/F aircraft to perform
    refueling missions, which will increase their availability for strike fighter
    missions and preserve their service life.


