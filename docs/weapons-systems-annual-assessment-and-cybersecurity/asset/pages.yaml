  md: '# Production Readiness


    In September 2015, FAB-T received verbal approval to begin production, followed
    by a formal acquisition decision in October 2015. At the time, FAB-T had not met
    best practices standard for beginning production, but, according to program officials,
    it met DOD’s standards. The program has ordered a total of 42 terminals to date:
    10 modification kit terminals in September 2015, 12 modification kit terminals
    in July 2016, and 5 modification kit terminals and 15 new antenna ground fixed
    terminals in June 2017. As of January 2018, the program has delivered 9 terminals,
    and has installed 4 to begin testing.


    The program had expected to declare FAB-T initial operational capability by December
    2019. However, in April 2017, the program reported a breach of its acquisition
    program baseline schedule for completion of operational testing, full-rate production,
    initial operational capability, and full operational capability. The program has
    yet to establish new dates for these milestones. The program attributed the delay
    in initial operational testing and full rate production to delays in developmental
    and production qualification testing and fielding. Further, the program attributed
    delays in initial and full operational capability to the limited availability
    of the E-4 and E-6 platforms for FAB-T installation.


    In October 2015, the Under Secretary of Defense for Acquisition, Technology and
    Logistics authorized the FAB-T program to purchase more than 60 percent of its
    total units during low-rate production. Generally, programs must provide a rationale
    if low-rate production quantities will exceed 10 percent of total quantities,
    a situation where the program makes large funding commitments for systems that
    have yet to be proven operationally effective or suitable. FAB-T officials said
    that the higher number of units are required to demonstrate initial operational
    capability due to the various configurations and platforms needed. Officials said
    they plan to request permission to procure additional terminals before a full-rate
    procurement decision to take advantage of cost control opportunities from volume
    discounts. With the majority of terminals already approved, officials noted that
    initial operational testing would not significantly inform a full-rate decision.'
  merge: -1
  img_proc: true
