  md: 'Air Force re-baselined the program’s cost and schedule estimates and restarted
    OCX software development activities. Nonetheless, this restart occurred before
    the program had fully addressed the root causes that led to the 2013 pause, which
    then caused new disruptions. In December 2015, 2 months after the Air Force’s
    re-baseline, the Under Secretary of Defense for Acquisition, Technology and Logistics
    directed a 24-month schedule extension to Block 1 that postponed the OCX software
    delivery to December 2020, a timeframe that was recognized as aggressive.


    In June 2016, following additional cost growth and departmental reviews, the Secretary
    of the Air Force notified Congress of a critical statutory unit cost breach in
    the program. DOD also conducted a second root cause analysis as a requirement
    to recertify the program and resume development. This analysis found that (1)
    external factors drove the program to an unrealistic schedule, (2) costs to fully
    implement information assurance requirements were underestimated, and (3) both
    the contractor and government had performed poorly. In October 2016, the Air Force
    subsequently restructured the program to (1) repeat the program review associated
    with entry into system development, which the program office held in June 2017,
    (2) re-estimate the program’s cost, and (3) add 6 more months to Block 1 efforts
    and deliver Blocks 1 and 2 concurrently in June 2021. In September 2017, the contractor
    delivered OCX Block 0, a subset of software from Block 1 that provided the capabilities
    needed to launch and test GPS III satellites. The Air Force took possession in
    October 2017 and will finally accept it when Block 1 is delivered.


    As of January 2018, DOD has not completed an independent cost estimate for OCX,
    which has precluded approval of the new program schedule and cost proposed in
    June 2017.


    # Other Program Issues


    The current program schedule assumes (1) higher levels of software coding productivity
    than the program has historically demonstrated and (2) an assumed ability to discover
    and fix software defects earlier in the development process under a new software
    development methodology, which the program has yet to fully implement. The program
    does not'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'anticipate proving some of its anticipated productivity gains and earlier discovery
    and corrections of defects until the end of fiscal year 2018. Further, the program
    nearly doubled its contractor staff in the year following December 2015 to meet
    the directed 24-month program extension. Contractor staff that support the program
    now total nearly 1,000 people each month. The contractor’s prior forecasts indicated
    that staff totals would decline by the middle of 2017, but those reductions have
