- pgno: 67
  md: 'For 42 programs, we produced two-page assessments discussing the technology,
    design, and manufacturing knowledge obtained, as well as other program issues.
    Each two-page assessment contains a comparison of total acquisition cost from
    the first full estimate for the program to the current estimate. The first full
    estimate is generally the cost estimate established at development start; however,
    for a few programs that did not have such an estimate, we used the estimate at
    production start. For shipbuilding programs, we used their planning estimates
    if those estimates were available. For programs that began as non-major defense
    acquisition programs, we used the first full estimate available. Of these 42 two-page
    assessments, most are in development or early production. See Figure 16 for an
    illustration of the layout of each two-page assessment.


    In addition, we produced one-page assessments on the current status of 15 programs,
    which include 12 future major defense acquisition programs and 3 major defense
    acquisition programs that are well into production, but are developing new increments
    of capability as part of their existing programs. See figure 17 for an illustration
    of the layout of each one-page assessment.


    For our two-page assessments, we use a scorecard to depict the extent of knowledge
    gained. These scorecards display key knowledge-based acquisition practices that
    should be implemented by certain points in the acquisition process. The more knowledge
    the program has attained by each of these key points, the more likely the weapon
    system will be delivered within its estimated cost and schedule. A knowledge deficit
    means the program is proceeding without sufficient knowledge about its technologies,
    design, or manufacturing processes, and faces unresolved risks that could lead
    to cost increases and schedule delays.


    For each program, we identified a knowledge-based practice that had been implemented
    with a closed circle. We identified a knowledge-based practice that had yet to
    be implemented with an open circle. If the program did not provide us with enough
    information to make a determination, we showed this with a dashed line. A knowledge-based
    practice that is not applicable to the program is grayed out.'
  merge: -1
