    # Other Program Issues


    LHA 6 initially deployed in July 2017 and Navy test officials declared the completion
    of operational testing in August 2017. During this testing, the Navy demonstrated
    the ability to land, service, and launch all required aircraft and transported
    over 350 Marines and their equipment from ship to shore. In October 2017, however,
    DOD’s Director, Operational Test and Evaluation (DOT&E) expressed concern that
    LHA 6 combat systems may not be effective against all threats and noted that some
    combat system tests are not scheduled to be completed until December 2018. DOT&E
    requires these data to assess overall combat effectiveness. In addition, the Navy
