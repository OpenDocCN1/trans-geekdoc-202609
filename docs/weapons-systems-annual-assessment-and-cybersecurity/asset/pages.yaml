    # BACKGROUND


    # Weapon Systems Are Unique in Many Ways, but Face Common Cyber Vulnerabilities


    Cybersecurity issues can vary widely across different types of systems, so weapon
    systems cybersecurity challenges may be very different than those of some IT systems.
    Despite variation across systems, cybersecurity can be described using common
    terminology, such as the key terms below used by the National Research Council.^10^


