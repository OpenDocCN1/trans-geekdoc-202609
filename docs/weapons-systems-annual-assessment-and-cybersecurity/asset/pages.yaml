    # JPALS Program


    # Technology Maturity and Design Stability


    Both JPALS critical technologies are approaching maturity, and the program has
    released 100 percent of its design drawings, which corresponds with a stable design.
    However, as the program continues to mature its critical technologies through
    testing—and each technology evolves into a final form, fit, and function— the
    program may need to revise its design drawings to accommodate these changes, which
    could compromise JPALS design stability.


    JPALS originally entered system development in July 2008 with two technologies
    that were approaching maturity. The program held a critical design review (CDR)
    in December 2010, but the design later proved unstable. The program proceeded
    with development and accepted delivery of eight prototypes. As JPALS approached
    its production decision in 2013, other military services and civilian agencies
    decided to continue use of their current landing systems rather than devote resources
    to invest in JPALS. Given these decisions and similar fiscal concerns, the Navy
    conducted a review of its precision approach and landing capabilities. As a result,
    the Navy restructured the JPALS program from seven increments to one, which is
    intended to support the F-35 Lightning II, the MQ-25'
