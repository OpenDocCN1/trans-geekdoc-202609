  md: '![](img/43698ea8af5a4b46ccccdfa98ec6b016_82_0.png)


    # HMS Program


    # Technology Maturity and Design Stability


    The HMS program now plans to acquire the Leader and Manpack radios as non-developmental
    items, which has precluded the program’s use or tracking of any critical technologies.


    At the HMS program’s development start in 2004, the program did not assess the
    maturity of its critical technologies—an approach inconsistent with best practices.
    The program had also not fully matured its critical technologies by its 2011 production
    start. Instead, the program completed development of individual critical technologies
    in May 2015. This divergence from best practices likely contributed to the nearly
    150 percent increase in development costs since the first full estimate.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'At its 2008 critical design review, the program had completed less than half
    of its planned design drawings, which did not meet best practices criteria for
    design stability. Most importantly, the program’s persistent technology immaturity
    between 2004 and 2011, including at the critical design review, contributed to
    radio designs that did not fully accommodate the final form, fit, and function
    of critical technologies as they matured. These design shortfalls became evident
    as HMS radios entered testing.


    Specifically, in fiscal year 2014, developmental testing of the Manpack radio
    revealed deficiencies with the system’s reliability. Initial operational test
    and evaluation that same year flagged suitability shortfalls, specifically related
    to the excessive weight of the Manpack units. Similarly, operational tests of
    the Rifleman radio in fiscal year 2014 identified suitability problems related
    to overheating and rapid battery depletion. Program officials stated that the
    contractor redesigned both radio systems to resolve these various problems, although
    the Army has not yet completed tests to verify these corrective fixes. Subsequent
    testing and procurement of the Rifleman radio has been deferred. Further, program
    test plans do not currently reflect the Army’s transition from the one-channel
    Rifleman radio to the two-channel Leader radio, which will likely require its
    own operational tests.


    # Production Readiness


    The HMS program has yet to assess its production readiness for the Leader radio,
    and Manpack radio production readiness remains unassessed nearly 7 years after
    that radio entered low-rate initial production. According to HMS program officials,
    the program assessed the production readiness of the Rifleman radio system in
    May 2011, but the Army will require a new assessment for the Leader radio. Program
    officials also stated that the HMS program will assess the production readiness
    of the Manpack radio as part of its separate full rate production decision in
    February 2021.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Other Program Issues


    At present, use of the MUOS waveform—which some Manpack radios will rely on—is
    largely unavailable to warfighters because DOD has yet to authorize the waveform’s
    use in an operational environment. Although the program has not identified MUOS
    as a critical technology, without this waveform, affected Manpack radios are able
    to communicate only through legacy communications capabilities, which limit the
    capacity of the network of radios.


    The Army has completed a network review that will evaluate HMS, as well as other
    Army communications programs, in an effort to assess processes, reduce system
    vulnerabilities, redefine capability gaps, and improve needed equipment. According
    to HMS program officials, this review increased uncertainty about the program’s
    schedule and acquisition strategy. Consequently, while the Leader contract award
    is now planned for June 2018, the Army has not yet updated the HMS acquisition
    program baseline to reflect these new plans.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    Program officials stated that the Army’s network review concluded that both the
    Leader radio and Manpack radio are essential to the future of the network. According
    to the program, the Leader radio test plan is currently in development. As for
    the Manpack radio, officials noted that it provides two simultaneous channels
    of secure voice and data communications using MUOS and other advanced networking
    waveforms and therefore supports legacy communications, as well as new waveform
    technologies, as required. Officials also said the Manpack radio will help the
    Army toward its goal of improving communication security and addresses a communications
    need for Army vehicles. Program officials further stated that a manufacturing
    readiness assessment was performed for each Manpack radio manufacturer, low-rate
    production was demonstrated for each vendor, and capability is in place to begin
    full rate production.'
  merge: -1
