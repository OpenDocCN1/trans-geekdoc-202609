  md: 'Further, Triton production began before the contractor brought its manufacturing
    processes for wing production under control and, as of November 2017, despite
    improvements, the contractor has not yet controlled these processes. Not achieving
    process control can result in low quality, extensive rework and waste, and not
    meeting cost and schedule targets.


    In May 2013, during development of initial prototype aircraft, the Defense Contract
    Management Agency (DCMA) identified quality deficiencies affecting Triton wings.
    As a result, program officials stated their office organized a monthly review
    board in August 2014 to identify the cause of ongoing wing deficiencies and reduce
    the turn-around time in correcting them. As of November 2017, program officials
    reported that these efforts have led to an 82 percent reduction in the number
    of wing deficiencies that occur during production.


    Nonetheless, unanticipated development and integration challenges with Triton’s
    baseline software led the Navy to modify its acquisition strategy, allotting additional
    time for the development and integration of future capabilities. Subsequently,
    the start of full-rate production has been delayed by over 3 years, from September
    2018 to May 2021. The program also plans to increase the quantity of aircraft
    acquired during low-rate production from 10 to 15, increasing the risk that more
    aircraft units will require design changes after the Navy operationally tests
    Triton and demonstrates its capabilities beginning in 2020.


    The system’s baseline software configuration is expected to achieve Early Operational
    Capability in March 2018. Meanwhile, the program is developing new Triton capabilities
    that will be implemented in two future upgrade packages. The first upgrade, which
    the program plans to integrate into production beginning in 2020, will support
    enhanced intelligence capabilities. The second upgrade will include electronic
    defense upgrades and an aircraft avoidance radar system. This upgrade is scheduled
    to be integrated into the production line for the 19th production aircraft, which
    is slated for delivery in fiscal year 2024.'
