  md: '# JOINT DOD-WIDE PROGRAM ASSESSMENTS


    We completed individual assessments on two of the five “joint” or DOD-wide current
    and future major defense acquisition programs—the F-35 Lighting II and Joint Light
    Tactical Vehicle (JLTV) programs. We found that DOD currently estimates a need
    of almost $239 billion in funding to complete the acquisition of these two programs.
    We also compared these two programs’ first full estimates of cost and schedule
    with their current estimates and found that:


    +   - net cost growth exceeds $115 billion, all of which occurred more than 5
    years ago and is attributable to the F-35 Lightning II program, and which constitutes
    a 44 percent increase over initial estimates, and

    +   - program schedule delays average approximately 41 months.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_224_0.png)'
