- pgno: 238
  md: 'government uses individual subcontracting reports from eSRS as one method of
    monitoring small business participation, as this tool includes information on
    contractors’ performance against small business subcontracting goals. There are
    multiple reasons why a prime contractor may not have an accepted subcontracting
    report in eSRS. For example, some contractors may have pending or rejected reports
    within the system as all reports are reviewed prior to acceptance. Not all prime
    contractors for major defense acquisition programs are required to submit individual
    subcontracting reports. Instead, some contractors report small business participation
    at a corporate level as opposed to the program level and this data is not captured
    in the individual subcontracting reports. In addition, although a prime contractor
    may be required to submit a report, it may not yet have done so for the period
    we reviewed.


    # APPENDIX II: OBJECTIVES, SCOPE, AND METHODOLOGY


    This chapter includes observations on (1) the cost and schedule performance of
    the Department of Defense’s (DOD) 2017 portfolio of 86 major weapon programs,
