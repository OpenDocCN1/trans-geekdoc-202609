- pgno: 123
  md: 'Beginning with radars produced in 2016, the program upgraded G/ATOR’s “transmit/receive
    modules”—key components that process signals from and to the radar—to a new, but
    mature, gallium nitride (GaN) semiconductor technology. The GaN semiconductors
    fit inside the G/ATOR system the same way as the older gallium arsenide (GaAs)
    semiconductors they have replaced. Program officials also expect the GaN technology
    to achieve better performance with higher reliability at a lower cost by reducing
    the number of modules required. The program office has budgeted $45 million from
    fiscal years 2022 through 2024 to refurbish the first six GaAs radars and update
    them to GaN technology.


    # Other Program Issues


    In 2016, the G/ATOR program office revised its operational test strategy. Originally,
    the program office planned to conduct initial operational testing with the older
    GaAs configuration, but DOD’s Director, Operational Test & Evaluation raised concerns
    about testing this legacy configuration as a majority of the planned G/ATOR procurements
    are with the newer GaN modules. The program office awarded a contract in August
    2016 for up to nine GaN radars. The program plans to accept delivery of three
    of these nine GaN radars in 2018 to support initial operational test and evaluation,
    ahead of the program’s full rate production decision in 2019.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office stated that the G/ATOR program continues to deliver on the
    cost, schedule, and performance commitments set when it was re-baselined in 2010.
    It said that six low-rate initial production systems have been delivered with
    nine additional systems under contract. According to the program office, G/ATOR
    demonstrated all Block 1 key performance requirements and the capability to meet
    all Block 2 performance requirements during developmental testing in 2017. The
    program office also stated that, following a positive operational assessment,
    the Marine Corps fielded the first two G/ATOR Block 1'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'systems to support initial operational capability. In the program’s view, production
    processes are in control, technology maturity is appropriate for production, and
    the program remains on schedule. It also said that a Block 2 operational assessment
    is on track to support an early fielding decision in 2018, and that three systems
    will be delivered in 2018 to support initial operational test and evaluation and
