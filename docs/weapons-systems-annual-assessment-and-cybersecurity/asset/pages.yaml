  md: '# VH-92A Program


    # Technology Maturity


    The program contains no immature critical technologies, due to its use of an existing
    helicopter and components. However, the program is using a government-designed
    mission communications system (MCS), which is the only technology that is not
    in use in another aircraft in the same configuration, as required for the VH-92A.
    While software development is on schedule, the MCS has yet to be government flight
    tested. To date, the VH92A contractor has installed an updated version of MCS
    on the developmental aircraft for initial contractor-led testing. The program
    expects to release software updates, following an operational assessment planned
    for December 2018, that will address deficiencies identified during earlier testing.


    # Design Stability


    Since its July 2016 critical design review, the VH-92A program has increased its
    expected number of design drawings by 2.4 percent. The increase is due to contractor
    incorporation of wide-band line-of-sight and formation lights, which were existing
    requirements. Also, additional drawings were needed based on redesign of wiring
    harnesses for selected equipment to include filters for protection against electronic
    radio frequency damage.


    Engineering development model aircraft have completed first flights and are now
    undergoing contractor-led testing. In addition, three of four planned production
    representative aircraft, built under the development contract, are now undergoing
    modifications, in preparation for integration of VH-92Aspecific subsystems. Meanwhile,
    the program is pursuing technical improvements related to the S-92A propulsion
    system, which has yet to meet the VH-92A engine start requirement. According to
    program officials, they expect the contractor to complete the necessary engineering
    analysis of solutions for meeting this performance requirement by October 2018.
    Program officials noted that, should they not meet the aforementioned schedule,
    they do not intend to delay production and will'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'continue working on a solution to support the start of operational testing
    in December 2019. The program office is also monitoring a potential shortfall
    in the aircraft’s ability to meet the landing zone suitability “no damage to lawn/landing
    zone surface” threshold. Currently, the combined exhaust from both the engine
    and auxiliary power unit may impinge the lawn/landing zone surface at temperatures
    high enough to cause damage.


    Nonetheless, earlier design challenges have reduced the amount of time available
    to complete government testing prior to the production decision. The program office
    has characterized its aggressive integrated test schedule as a risk factor it
    is tracking. To mitigate this risk, government pilots are participating in contractor-led
    testing and proactively engaging the contractor in discussions related to data
    gathered during these test events.


    # Production Readiness


    The program anticipates completing an operational assessment of production representative
    aircraft capabilities before making the production decision. In addition, the
    program plans to demonstrate critical manufacturing processes on a pilot production
    line, prior to the start of production, to provide assurance that quality requirements
    will be met. Further, the program plans to determine production readiness through
    audits and inspections included in the Federal Aviation Administration’s airworthiness
    certification process, which is used to determine whether an aircraft is safe
    to operate. According to program officials, by relying on the procedures built
    into the airworthiness process, they no longer needed to conduct their own separate
    production readiness review and the saving associated with this action will be
    reinvested into the program.


