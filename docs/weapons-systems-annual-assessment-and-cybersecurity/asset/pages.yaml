  md: 'As a result, the program revised its schedule and milestones, including scheduling
    a new system-level preliminary design review (PDR) in March 2016, a new development
    start in June 2016, and a new CDR in May 2017. Because the program repeated these
    three events, our attainment of product knowledge table assesses the program’s
    knowledge at its original development start and original CDR events, which formed
    the basis for the program’s original business case. This methodology is consistent
    with how we have previously assessed JPALS and other programs that have repeated
    key program events.


    Program officials reported the release of all JPALS expected design drawings at
    the new PDR, but subsequently increased the total number of drawings by approximately
    4 percent in order to provide additional clarity. In June 2016, Navy leadership
    authorized the restructured JPALS program to enter the engineering and manufacturing
    development phase. The program office reported that it awarded a contract in September
    2016 to upgrade the eight original prototypes, as well as to procure two additional
    prototypes for developmental testing. Both the new and upgraded prototypes are
    intended to be production representative, and the program office plans to use
    them to provide early operational capability in support of F-35 Lightning II initial
    capability in fiscal year 2018. These prototypes will also allow the program to
    demonstrate the JPALS critical technologies in a realistic environment.


    For fiscal year 2017, program officials reported that the Navy had installed JPALS
    prototypes aboard two Nimitz-class aircraft carriers and three amphibious assault
    ships to support F-35 Lightning II developmental testing, JPALS integrated testing
    risk reduction, and landing system certification. This testing included 71 total
    F-35 Lightning II aircraft approaches.


    # Production Readiness


    The May 2017 CDR included an evaluation of JPALS manufacturing plans and did not
    identify any critical manufacturing processes for the'
