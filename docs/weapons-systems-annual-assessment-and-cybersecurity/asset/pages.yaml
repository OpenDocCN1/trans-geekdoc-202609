    # B-2 DMS-M Program


    # Technology Maturity


    The program entered system development in March 2016 with four critical technologies
    approaching maturity. Since then, Northrop Grumman proposed, and the Air Force
    accepted, an alternative system that provides additional capabilities and has
    been tested on another program. The alternative system has the same four critical
    technologies. Because major subsystems are being leveraged from existing systems,
    the program office assesses three of the four critical technologies as mature.
    One critical technology, band 2 (previously designated band 1) apertures, continues
    to approach maturity.


    # Design Stability


    The Air Force’s decision to pursue an alternative system has led to some delays.
    For example, although the program held a preliminary design review before entering
    system development, the program plans to complete a second preliminary design
    review (PDR) in February 2018 and the critical design review is now scheduled
    for August 2018. Based on the need for a new PDR, we have updated our knowledge
    table to reflect this change as compared to what we presented in our 2017 assessment.
    As of mid-January 2018 the contractor has completed 444 of 853 (52 percent) of
    the program’s total drawings. Consistent with acquisition best practices,'
  merge: -1
