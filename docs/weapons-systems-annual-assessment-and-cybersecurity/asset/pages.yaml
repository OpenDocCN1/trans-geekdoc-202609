- pgno: 73
  md: '# AMF Program


    # Technology Maturity, Design Stability, and Production Readiness


    The AMF program office plans to purchase technically mature, production-ready
    SANR radios from an as-yet to be determined contractor. This non-developmental
    acquisition strategy, which the Army adopted in 2012, does not lend itself to
    application of our standard metrics for technology maturity, design stability,
    and production readiness. We have updated our attainment of product knowledge
    table to reflect this change compared to what we presented in our 2017 assessment.


    The AMF program’s acquisition strategy had its genesis in 2012 when, as part of
    an overall Joint Tactical Radio System (JTRS) program reorganization, DOD directed
    the AMF program to acquire the radios as a modified non-developmental item. DOD
    further directed that the AMF program leverage, to the maximum extent practicable,
    investments made since 2008 within the original JTRS program. The restructure
    shifted the program from a development effort supporting Army, Air Force, and
    Navy platforms to a non-developmental effort supporting only Army aviation.


    The program office’s procurement of radios is currently in the pre-solicitation
    phase before award of a production contract. The office anticipates that it will
    solicit proposals from potential contractors in the fourth quarter of fiscal year
    2018 and award a contract in the third quarter of fiscal year 2020. It plans to
    procure 7,014 two-channel SANR radios total—110 for test purposes; 262 as part
    of low-rate initial production; and 6,642 in full-rate production.


    The program office believes that its revised acquisition strategy provides opportunities
    for it to assess technology maturity, design stability, and production readiness.
    Those opportunities, it stated, include plans to require contractors to identify
    critical technology elements prior to contract award, substantiate contractors’
    claims with their test results, and submit manufacturing plans that detail the
    contractor’s readiness to produce radios that meet Army requirements and schedule.
    Additionally, the program'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'office expects to use other methods after contract award to ensure the chosen
    contractor’s radios meet Army needs, such as a re-assessment of technology maturity
    in tests prior to the low-rate initial production decision, use of contract terms
    to control changes to design, and tests that demonstrate the production process.


    # Other Program Issues


    Since our 2017 assessment, the Army has delayed the AMF initial capability by
    over 3 years. This delay, coupled with prior delays, has increased the program’s
    schedule to over 18.5 years between development start and initial capability—for
    what is now ostensibly a non-developmental acquisition. According to program officials,
    Army leadership has yet to approve the program’s plans for SANR production, testing,
    and deployment. The program expects that the ongoing Army network review, which
    was established to adjust and modernize Army communications programs, will produce
    changes to current AMF acquisition plans. Already, program officials stated that
    AMF’s current schedule estimate will breach the program’s 2014 approved baselines
    for full rate production and initial operational capability and as a result, the
    Army will need to approve a new program baseline once the network review and a
    related analysis of alternatives are complete.


    The Army’s network analysis could also affect the AMF program schedule in other
    ways. According to program officials, the analysis could recommend the replacement
    of a currently planned SANR voice and data waveform with another waveform. The
    officials stated that should the Army adopt a waveform change, the program will
    require additional time to adjust the program’s content and schedule.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office did not have any comments.'
