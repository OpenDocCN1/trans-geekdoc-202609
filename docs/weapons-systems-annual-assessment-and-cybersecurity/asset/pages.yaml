    on a SpaceX Falcon 9 rocket instead of a United Launch Alliance Delta IV rocket.
    The launch date change was necessary because a Falcon 9 rocket launch of the satellite
    would not be ready before May 2018, according to Air Force officials. Ongoing
    SpaceX efforts to validate and certify that the Falcon 9 is able to launch the
    GPS III satellite pushed the projected launch date beyond May 2018.


    Because of extensive delays to OCX—the next generation GPS operational control
    system that will enable the full range of GPS III capabilities—the GPS III program
    expects to have delivered at least the first nine satellites and to have awarded
    a contract for additional satellites before operational testing of the satellite
    with OCX Block 1 confirms the satellite’s modernized signal capabilities. This
    sequencing creates cost, schedule, and performance risk, since it limits Air Force
    corrective options if issues are discovered in testing.


