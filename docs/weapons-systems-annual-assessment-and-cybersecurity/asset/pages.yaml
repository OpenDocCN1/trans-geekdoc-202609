    # F-15 Eagle Passive Active Warning Survivability System (F-15 EPAWSS)


    # F-15 EPAWSS Program


    # Technology Maturity


    EPAWSS entered system development in November 2016 with its four critical technologies
    approaching full maturity following demonstration with existing hardware in a
    high-fidelity lab environment. The Air Force plans to lab test new EPAWSS hardware
    containing the four technologies for the first time in April 2018 to demonstrate
    functionality. However, the Air Force does not plan to fully mature EPAWSS critical
    technologies to final form, fit, and function and demonstrate them in a realistic
    environment until the start of F-15 flight testing in November 2018. This approach
    introduces risk of flight test delays if technologies do not mature as expected
    and is inconsistent with best practices.


    # Design Stability


    The EPAWSS program completed its system-level critical design review (CDR) in
    February 2017 having released a total of 87 percent of EPAWSS drawings to manufacturing.
    This total falls just short of the 90 percent recommended at CDR to demonstrate
    design stability. Specifically, the program had released 99 percent of EPAWSS
    hardware drawings, but only 83 percent of required F-15 airframe drawings, at
    CDR. The program'
  merge: -1
